    # Object Etiquette


    # Use Interface References


    One important consideration is that even if you make of an abstract class I reckon
    that you should still make use of interfaces to reference the data objects themselves.
    This gives you a degree of flexibility that you can use to good effect.


    # BANK NOTES: MAKING GOOD USE OF INTERFACE AND ABSTRACT


    If our bank takes over another bank and wants to share account information we
    might need a way to use their accounts. If their accounts are software components
    (and they should be) then we all have to implement the required interfaces in
    each end and our systems understand each other. In other words the other bank
    must create the methods in the IAccount interface, get their accounts (whatever
    they are called) to implement the interface, and I, Presto, can now use their
    accounts.


    This would be much more difficult if my entire system though in terms of a Parent
    class – since their classes would not fit into this hierarchy at all.


    # 4.9.9 Don''t Panic


    This is all deep stuff. If you don''t get it, don''t worry. These features of
    C# are tied up with the process of software design which is a very complex business.
    The important point to bear in mind is that the features are all provided so that
    you can solve one problem:


    > Create software which is packaged in secure,

    interchangeable components.


    Interfaces let me describe what each component can do. Class hierarchies let re-use
    code inside those components.


    And that is it.


    # 4.10 Object Etiquette


    We have considered objects "in the large", that we know how they can be used to
    design and implement large software systems. What we need to do now is to take
    a look at some smaller, but very important, issues to relate to how we use objects
    in our programs.


    # 4.10.1 Objects and ToString


    We have taken it as read that objects have a magical ability to print themselves
    out. If I write the code:


    ```

    int i = 99;

    Console.WriteLine(i);

    ```


    This will print out:


    ```

    99

    ```


    The integer somehow seems to know how to print itself out. Now it is to find out
    how this is achieved, and how we can give our objects the same magical ability.


    It turns out that this is all provided by the "objectness" of things in C#. We
    know that an object can contain information and things for us. (in fact we have
    seen that the whole basis of building programs is to decide what the objects should
    do and to make them do these things). We have also seen that you can extend a
    parent to create a child which has all the abilities of the parent, plus the new
    ones we added.'
