    # 4.5 Designing With Objects


    We are now to start thinking in terms of objects. The reason that we do this is
    that we would like a way of making the design of our systems as easy as possible.
    This comes back to the "creative laziness" that programmers are famous for. The
    thing that we are trying to do is best expressed as:


    > "Put off all the hard work for as long as we can, and if possible someone else
    do it for us."


    Objects let us do. If we return to our bank account we can see that there are
    a number of things we need to be able to do with it:


