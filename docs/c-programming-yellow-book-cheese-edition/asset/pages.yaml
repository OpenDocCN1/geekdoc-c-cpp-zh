    # Writing a Program


    +   - It should be clear who wrote it, and when it was changed. If you write something
    good you should put your name on it. If you change what you wrote should add information
    about the changes you made and why.


    A big part of a well written program is the comments that the programmer puts
    there. A program without comments is a bit like an aeroplane which has an autopilot
    but no windows. There is a chance that it might take you to the right place, but
    it will be very hard to tell where it is coming from the inside.


    # Block Comments


    When the C# compiler sees the /* sequence which means the start of a comment it
    says to itself:


    > Aha! Here is a piece of information for greater minds than mine to ponder. I
    will ignore everything until I see a /* closes the comment.


    As example:


    ```

    / This program works out glass and wood required for a double glazing salesman.
    */

    ```


    Be generous with your comments. They help to make your program much easier to
    understand. You will be very surprised to find how quickly you forget how your
    program to work. You can also use comments to keep people informed of the particular
    version of the program, which was last modified and why, and the name of the programmer
    who wrote it - even if it was you.


    If you are using an editor that supports syntax highlighting you will find comments
    are usually displayed in green.


    # Line Comments


    Another form of comment uses the // sequence. This marks the start of a comment
    which extends to the end of that particular line of code. It is useful for putting
    a quick note on the end of a statement:


    ```

    position = position + 1 ; // move on to the next customer

    ```


    I annotated the statement to give the reader extra information about what it actually
    does.


    # Programmer''s Point: Don''t add too much


    Writing comments is a very sensible thing to do. But don''t go too far. Remember
    that the person who is reading your program can be expected to know the C# language
    and doesn''t need them explained to in too much detail:


    ```

    goatCount = goatCount + 1 ; // add one to goatCount

    ```


    This is plain insulting to the reader I reckon. If you choose sensible identifiers
    you should find that your program will express most of what it does directly from
    the code itself.


