  md: '# Advanced Programming


    # Generics and Collections


    This sounds a bit confusing, how about an example.


    If you want to share marbles amongst you and your friends could come up with way
    of doing that. Something like: "Divide the number of marbles by the number of
    friends and distribute the remainder normally." However, you could also use it
    to share sweets, cakes or even cars. What the system works is not particularly
    important. You could take your universal sharing algorithm and use it to share
    anything. The sharing algorithm could have been invented without worrying about
    the type of thing it being shared; it can be a general sharing behaviour that
    is applied to the types we want to share. In this respect, generics can be regarded
    as another form of abstraction.


    # Generics and the List


    In the case of generics, however we want that of a list. What the list stores
    is not important when making the list, just as long as you have a way of telling
    it what to store. The CF features provides a few new methods to allow you to express
    this. The Generic List lives in the System.Collections.Generic namespace and works
    like:


    ```

    List<Account> accountList = new List<Account>();

    ```


    The above statement creates a list called accountList which can hold references
    to Accounts. The type between the < > characters how we tell the list kind of
    things it can store. We could create a List that can hold integers in a similar
    way:


    ```

    List<int> scores = new List<int>();

    ```


    Because we have the compiler to type the things the list can hold it can perform
    type validation and make sure that nothing bad happens when the list is used:


    ```

    KitchenSink k = new KitchenSink();naccountList.Add(k);

    ```


    The above statements would cause a compilation error, the accountList variable
    is declared as holding a list of Account references, and will not accept the kitchen
    sink.


    Since the compiler knows AccountList holds Account references, this means that
    you can write code like this


    ```

    accountList[0].PayFunds(50);

    ```


    There is no need to cast the item in the list as the type has already established.


    You can do everything with a List (Add, Count, Remove) that you can with an Array,
    which makes the perfect perfect to store a large number of items of a particular
    type.


    # 5.1.3 The Dictionary class


    As Array has a more generically enhanced, called List, HashTable has a more powerful
    cousin Dictionary. This allows the key to your hashtable, and the items it stores,
    to be typesafe. For example we want to use a name of an account holder as a way
    of locating a particular account. In other words, we use a string as the key Account
    reference as the value. We can create a dictionary to store these key/value pairs
    as:


    ```

    Dictionary<string,Account> accountDictionary =

    new Dictionary<string,Account>();

    ```


    We can now add items into our dictionary:


    ```

    accountDictionary.Add("Rob", roAccount);

    ```


    This looks like the way the HashTable was used (and it is). However, using a Dictionary
    has the advantage that we can use Account values which are located by means of
    a string. In other words statements like this would be rejected.


    C# Programming Rob Miles 2016


