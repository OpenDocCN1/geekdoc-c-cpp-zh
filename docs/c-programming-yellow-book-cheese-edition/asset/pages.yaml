  md: 'The method looks very similar, but now every thread busyLoop is sharing the
    same count variable. This is potentially disastrous. It is very hard to predict
    how long this multi-threaded program will take to finish. Consider the following
    sequence of actions:


    +   1. Thread fetches the value of the count variable so that it can add one to
    it.

    2. Before the addition can be performed, Thread 1 is stopped and Thread 20 is
    allowed to run.

    3. Thread 20 fetches the value of count, adds one to it and stores it back in
    memory.

    4. Sometimes Thread 1 gets control again, adds one to the value it fetched before
    it was interrupted and stores the result in memory.


    Because of why that Thread 1 was interrupted during its calculation, it overwrites
    the changes that Thread 20 made. As the threads are all loading, interrupting
    and storing the value of count and overwriting changes that they have made.


    What we need is a way of stopping the threads from interrupting each other. The
    statement `count = count + 1;` must be allowed without being interrupted. You
    can do this by using a feature *mutual exclusion* or *mutex*. We can return to
    our train analogy.


    # Using Mutual Exclusion to Manage Data Sharing


    Allowing two threads to share the same variable is a bit like allowing two trains
    to share the same piece of track. Both are dangerous. The single track problem
    was solved using a single brass token which was held by the engine. When they
    entered the single track they were given the token. When the train left the left
    section the driver handed the token back. Anyone wanting to enter the track had
    wait for their token.


    Mutual exclusion works in the same way by using an instance of an object to play
    the role.


    ```

    static object sync = new object();

    ```


    This object doesn''t actually hold any data. It is just used as the token which
    is held by the process.


    ```

    Monitor.Enter(sync);

    count = count + 1;

    Monitor.Exit(sync);

    ```


    The code between `Monitor.Enter` and `Monitor.Exit` can only be performed by one
    thread at a time. In other words, there is no window of interrupting the increment
    statement and switching to another process. All increment operations will complete
    in their entirety. Once execution leaves the statements between the Monitor calls
    they can be suspended until usual.


    Threads that aren''t able to run are "parked" in a queue of waiting threads. This
    queue is held in order, the first thread to get the entry point will be the first
    to get the lock, with other threads lining up for their turn. The *Monitor* looks
    after this for us; we don''t need to know how it works.


    # Programmer''s Threads: Can Totally Break your Program


    If a thread grabs hold of a synchronisation object and does not let go of it,
    it will stop other threads from running if they need that object. This is a really
    good way to make your programs fail. Another one, called the "Deadly Embrace"
    is where thread a has object x and is waiting for object y, and b has got object
    y and is waiting for object x. This is the computer version of "I''m not calling
    him to apologise, I''m going to wait for him to call me"'
