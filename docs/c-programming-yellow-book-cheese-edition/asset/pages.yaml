    # Putting in more detail


    We have a fairly good understanding of what our program is going to do for us.
    Being sensible and thinking people we do not stop here, we now have to worry about
    our program will decide when the information coming in is actually valid.


    This must be in conjunction with the customer, he or she must understand that
    information is given if it fits within the range specified, your program will
    regard the data and act accordingly.


    In the case of we could therefore expand the definition of data coming in as:


    +   - The width of the window, in metres and being a value between 0.5 metres
