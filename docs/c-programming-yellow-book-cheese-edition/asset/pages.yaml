    this ability by exposing a method called Parse.


    Note that there is nothing wrong about something C exposing its methods. It is
    how we get things done. When you want to design larger programs you will find
    that the best way to do this is to create components methods to get the job done.
    The whole of the C library is provided as a series of methods and one of the things
    that you will have to get grips with is the methods and how to use them. With
    many things in life, the trick is knowing to ask as...


    # Parse


    The Parse method has the job of converting the string it has been given into a
    double precision floating point number. To do it must must along the string, pull
    out each digit in turn and calculate the actual value, as "12" as ten and two
    units. This process of looking is often called parsing. Hence the name of the
    method we are using. The method gives the string that it is to be parsed and returns
    the number it has found.


    Note that this gives significant potential for evil, if the user doesn''t type
    a type or values something like "Twenty Five" the Parse method will not be able
    to resolve a problem and will fail as a result. How if it fails, and how can you
