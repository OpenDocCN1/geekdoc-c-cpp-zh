    Manipulating Data


    # 2.2 Manipulating Data


    In this section we are going to take a look at how we write programs that manipulate
    data, how values can be stored, retrieved and generally fiddled. This provides
    us with the ability to perform the data processing of programs.


    # 2.2.1 Variables and Data


    In the glazing明白 we decide to hold the width and the height of the windows that
    we are working on in variables we described double. Before we go much further
    in our programming career we need to consider just what means, and what other
    types of data we can store in programs that we write.


    Programs operate on data. A programming language must give you a way of storing
    the data you are processing, otherwise it is useless. What the actual data means
    is something that you, a programmer decide (see the above digression on).


    A variable is a named location where you can store something. You think of it
    as a box of a particular size with a name that we use to reflect what is going
    to be stored (we used sensible names like length in the above program). You also
    need to choose the type of the variable (particular size and shape of box) from
    the range of storage types C# The type of the variable is part of the metadata
    about that variable.


    Programs also contain literal values. A literal is just a value in your program
    which we use for some purpose. For each type of variable the C language has a
    way in which literal values of that type are expressed.


    # 2.2.2 Stores Numbers


    When considering numeric values there are two kinds of:


    +   - Nice chunky individual values, for example the sheep in a field, teeth on
    a cog, apples in a basket. These are referred to as integers.

    - Nasty real world types, for example the current temperature, length of a piece,
    so that. These are referred to as reals.


    In the first case we can hold the value exactly; you always have an exact number
    of these items, they are integral.


    In the second case we can never hold the value exactly. Even if you measure a
    piece of string to 100 decimal places it is not possible to give you its exact
    length to get the value we are accurate. A computer digital i.e it operates on
    patterns of bits which can be regarded as numbers. We know that it works in terms
    of ons and off it has problems holding real values. To handle values the computer
    actually stores them to a limited capacity, which we hope is adequate (and usually
    is).


    This means that we want to store something have to tell the computer whether it
    is an integer or a real. We also need to consider the range of possible values
    that we need to hold so that we can choose the appropriate type to store the data.


    You tell C about a variable you want to declare. The declaration identifies the
    type of the thing we want to store. Think of this as a C# creating of a particular
    size, specifically designed to hold items of the given type. The box is tagged
    with some metadata (there is that word again) so that the system knows what can
    be put into it and how that box can be used.


    When you are writing a specification you should worry about the precision to which
    values are to be held. Too much accuracy may slow the machine - too little may
    result in the wrong values used.


    C# Programming © Rob Miles 2016


    22'
