  md: "# Creating Programs\n\n# Methods\n\nThe piece of C# above calls the method\
    \ with the variable test as the argument. When it runs it prints out the following:\n\
    \n```\ni = 21;\ntest = 20;\n```\n\nIt is very important that you understand what\
    \ is happening here. The value of test is being used in the case of addone. The\
    \ program works out of the expression to be passed into the method as an argument.\
    \ It passes this value into the call. This means you can write calls like:\n\n\
    ```\ntest = 20;\naddone(test + 99);\n```\n\nThis would print\n\n```\ni = 120;\n\
    ```\n\nPass by value is very safe, although the method does not affect variables\
    \ in the code it calls. However, it is a limitation when we want to create a method\
    \ that returns more than one value.\n\n# 3.1.8 Parameter Passing By Reference\n\
    \nIt is very that you understand how references work. If you don't understand\
    \ these you can't call yourself a proper programmer!\n\nC# provides a way to that,\
    \ rather than sending the value of a variable into a method, a reference to value\
    \ is supplied instead. Inside the method, rather than using the value of the reference\
    \ used is to get the actual value itself. The thing that is passed into the method\
    \ is the position or address of the variable, rather than the content of variable.\n\
    \nSo passing by reference \"20\" in above the compiler compiler will generate\
    \ code which passes the memory location 5023 instead (assuming that the variable\
    \ is actually stored at 5023). This memory location is used by the method, instead\
    \ of the value. In other words:\n\n> If pass by reference, changes to the parameter\
    \ change the variable you referenced passed\n\nIf you finds confusing you are\
    \ not alone. However, we use in real life all the time with no problems. If you\
    \ say \"Deliver the carpet to 23 High Street.\" Using a reference in a program\
    \ is just the same. program will say \"Get the value from location 5023\" rather\
    \ than \"The value is\"\n\nConsider the code:\n\n```\nstatic void addToRefParam(ref\
    \ int i) {\n    i = i + 1;\n    Console.WriteLine(\"i is : \" + i);\n}\n```\n\n\
    Note that the ref has been used to add the information about the parameter.\n\n\
    ```\ntest = 20;\naddToOneRefParam(ref test);\nConsole.WriteLine(\"test is : \"\
    \ + test );\n```\n\nThe code above makes a call to the new method, and also has\
    \ the word ref in front of the parameter. In this case the output is as follows:\n\
    \n```\ni = 21;\ntest = 21;\n```\n\nIn this method call has made changes to the\
    \ content of the variable. Note that C# is careful about when a parameter is a\
    \ reference. You have to put the word ref in the method heading and also in the\
    \ call of the method.\n\nC# Programming © Rob Miles 2016\n\n55"
