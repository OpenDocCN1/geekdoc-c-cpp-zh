    # 4.5.2 Member Protection inside objects


    If objects are going to be useful we have to have a way of protecting the data
    within. Ideally I want to get control when someone tries to change a value in
    my, and stop the change from being made if I don''t like it. The posh word for
    this is encapsulation. I want all the important data hidden inside my object so
    that I have complete control over what is done with it. This technology is the
    key to my defensive programming approach which is geared towards making sure that
    whatever happens, my part of the program does not go wrong.


    For example, in our bank program we want to make sure that the balance is never
    changed in a manner that we can''t control. The first thing we need to do is stop
    the outside world from playing with our balance value:


    ```

    class Account

    {

    private decimal balance;

