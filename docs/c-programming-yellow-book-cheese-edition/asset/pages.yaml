  md: '# Computers and Programs


    # Describing the Solution


    The actual instructions which describe your solution to the problem must be part
    of your program. A single, simple, instruction to do something in a C# program
    is called a *statement*. A statement is an instruction to perform one particular
    operation, for example add two numbers together and store the result in


    The really gripping thing about programming are statements that change what is
    performed next, so that your program can look at them and decide what to do. In
    the case of C# you can call statements to form a lump of programming which does
    one particular. Such a task is called a *method*.


    A method can be very simple, or very large. It can return a value or may not be
    of interest. You can name it any you like, and your program can contain as many
    methods as you see fit. One method may refer to others. The C# language has a
    huge number of libraries which save you from "re-inventing the wheel" each time
    you write a program. We will look at methods in later detail than needs.


    Seasoned programmers break down a problem into a number of smaller ones and make
    a method for each.


    # Identifiers and Keywords


    You give a name to that you create, and you try to make the name of the function
    what it does, for example ShowWindow or SaveToFile. The C# language actually runs
    your program by looking for a method with a special name, *Main*. This method
    is called when your program starts running, and when *Main* finishes, your program
    ends. The names that you invent are identifiers. You also create identifiers to
    make things hold values; *length* might be a good choice when you want to hold
    the length of word desired. Later on we will look at the rules and conventions
    which you use to create identifiers.


    The words which are part of the C# language itself are called keywords. In a recipe
    a keyword would be something like "cake" or "oven". A method might be things like
    "heat sugar until molten" or "mix smooth". In fact, you''ll find that programs
    look a lot like recipes. Keywords appear *blue* in some of the listings in this
    text.


    # Objects


    Some of the things in the programs that we write are objects that are part of
    the framework we are using. To continue our cooking analogy, these are like mixing
    bowls and ovens, which are used during the cooking process. The names of objects
    will be in a *different shade of blue* in some of the listings in this text.


    # Text in a Computer Program


    There are two kinds of text in your program. There are the instructions that you
    want the computer to perform and there are the messages that you want the program
    to display in front of you. Your mum might add the following instruction to your
    cake recipe:


    > Now write the words "Happy Christmas" on top of the cake in pink icing.


    She is using double quotes to mark the text that is to be drawn on the cake, and
    C# works in the same way. "Happy Christmas" is not part of the instructions; it
    is what needs to be written. These kinds of messages are coloured red in this
    text.


    # Colours and Conventions


    The colours that I use in this text are intended to line up with the colours you
    see when you edit your programs using a visual editor such as the one supplied
    as Visual Studio. The colours serve just to make the programs easier to understand,
    and do not have any special meaning. They are added automatically by the editor
    you write your program.


    C# Programming Rob Miles 2016


