    # Writing a Program


    I have used the # character to get my thousands printed out with commas:


    i: 150 f: 1,234.57


    The formatter not only uses the # characters and commas that it needs. The value
    150 does not have a thousands digit so and the comma are left out. Also note that
    I have included a 0 as the smallest digit. This is so when I print the value 01
    actually get a value printed, or when I print zero get nothing on the page.


    # Printing in columns


    Finally I can add a width value to the print layout information. This is very
    useful if you want to print in columns:


    ```

    int i = 150;

    double f = 1234.56789;

    Console.WriteLine ("i: {0,10:0} f: {1,15:00}", i, f);

    Console.WriteLine ("i: {0,-10:0} f: {1,15:00}", 0, 0) ;

    ```


    This produces the output:


    ```

    i:             150

    i:             1234.57

    f:                0

    ```


    The integer value is printed in a column 10 characters wide, and the double is
    printed in numbers 15 character wide. At the moment the output is right justified,
    if I want the numbers left justified I make the negative:


    ```

    int i = 150;

    double f = 1234.56789;

    Console.WriteLine ("i: {0,-10:0} f: {1,-15:00}", i, f);

    Console.WriteLine ("i: {0,-10:0} f: {1,-15:00}", 0, 0) ;

    ```


    This produces the output:


    ```

    i:             150

    i:             0

    f:                0

    ```


    Note that this justification would work even if you were printing a string rather
    than a number, so if you want to print columns of words you can use this technique
    to do it.


    You can specify the print width of any item, even a piece of text, makes printing
    in columns very easy.'
