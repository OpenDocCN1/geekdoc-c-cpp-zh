  md: '# Advanced Programming


    # Program Organisation


    To solve the problem I need to tell the compiler to find AccountManagement to
    find the Account class:


    ```

    csc /reference:AccountManagement.dll AccountTest.cs

    ```


    The reference option is followed by a list of library files which are to be used.
    In this case there is just the one to look at, which is the library that contains
    the required class. The compiler now knows where to find all the parts of the
    application, and so it can build the executable program.


    # Library References at Runtime


    We have now made two files that contain program code:


    AccountManagement.dll the library containing the Account class code

    AccountTest.exe the executable program that creates an Account instance


    Both these files are needed for the program to work correctly. This is because
    of the "dynamic" in dynamic link library. It means that library is only loaded
    when the program runs, unless it is built


    # Deleting System Components


    This means that if I do something horrid like delete Accountmanagement.dll file
    and then run the program this causes all of things to happen:


    ```

    UnhandledException: System.FileNotFoundException: File or assembly name AccountManagement,
    or one of its dependencies, was not found.

    File name: "AccountManagement" at AccountTest.Main

    - lots of other stuff

    ```


    This means we need to be careful when we send out a program and make sure that
    all components are present when we run it.


    # Updating System Components


    Creating a system out of a number of executable components has the advantage that
    we can update part of it without affecting everything else. If I modify the AccountManagement
    class and re-compile it, the new version only works as long as I don''t change
    the appearance of the classes or methods which AccountTest uses.


    The good news is that I can fix the broken parts of the program without sending
    out an entirely new version.


    The bad news is that this hardly ever works. There is a special phrase, "dll hell",
    for what happens. Unless the fixed code is exactly right there is a good chance
    that it might break some other part of the program. Windows works in this way,
    and the number of times I''ve installed a new program (or worse an update of an
    existing one) which has broken another program on the computer is too numerous
    to remember.


    # Programmer''s Point: Use Version Control and Change Management


    So many things are being rooted in for good planning and management. And here
    we are. When you think about using your application for money you must make sure
    that you have a managed approach to how you are going to send out upgrades and
    fixes. The good news is that there are ways of making sure that certain versions
    of your program only work with particular program files. The bad news is that
    you have to plan how to use this technology, and then make sure you use it. If
    this sounds boring and pedantic then I''m very sorry, but if you don''t do you
