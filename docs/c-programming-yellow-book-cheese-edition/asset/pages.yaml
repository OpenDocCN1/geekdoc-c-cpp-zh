  md: '# 5.6.2 Namespaces


    We can use library files to break up our solution into a number of files. This
    makes management of the solution slightly easier. But we also have another problem.
    We don''t want to break things into physical chunks. We also want to use logical
    ones as well:


    If you are not sure what I mean by this, consider the situation in our bank. We
    decided that Account is a sensible name for the class which holds all the details
    of a customer account.


    But if you consider the whole of the bank operations you find that the word "account"
    crops up over the place. The bank will buy things like paper clips, rubber stamps,
    little pens on chains (pre-supplied with no ink in course) and the like from suppliers.


    You could say that the bank has an account with such a supplier. It may well wish
    to keep track of these accounts using a computer system. Perhaps the programmers
    might decide that a sensible name for such a thing would be Account. Argh! If
    the two systems ever meet up we can expect a digital fight to the death about
    what a "Account" really means. Which would be bad.


    We could solve the problem by renaming our account class CustomerAccount. But
    this would be messy, and many times we would have to make sure that we name all
    our classes in a way which will be unique.


    A far better way would be to say that we have a CustomerBanking namespace in which
    the word Account has a particular meaning. We can also have EquipmentSupplier
    namespace as well. This prevents the two names from clashing, in that they are
    not defined in the same namespace.


    # Putting a Class in a Namespace


    Up until now every name we have used has been created in what is called the global
    namespace. This is because we have not explicitly set up a namespace in our source
    files. However, they are very easy to set up:'
