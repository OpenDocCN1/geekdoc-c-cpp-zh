    \ put the code inside a method body and call it when we need it.\n\n# 3.1.2 Parameters\n\
    \nAt this point methods are useful because they let us the same block of statements\
    \ at many points in the program. However, they become more useful if we allow\
    \ them to have parameters.\n\nA parameter is a means of passing a value into a\
    \ method call. The method is given the data to work on. For an example, consider\
    \ the code below:\n\n```\nusing System;\nclass MethodDemo\n{\n    static void\
    \ silly (int i)\n    {\n        Console.WriteLine(\"i is : \" + i);\n    }\n \
    \   public static void Main()\n    {\n        silly (101);\n        silly (500);\n\
    \    }\n}\n```\n\nCode Sample 10 Method with parameters\nThe method silly has\
    \ a single integer parameter. Within the block of code which is the body of this\
    \ method we can use the i as an integer variable. When the method starts the value\
    \ supplied for the parameter is copied into it. This means that when the program\
    \ runs we get output like this:\n\n```\ni is : 101\ni is : 500\n```"
