  md: "# Creating Solutions\n\n# From Object to Component\n\n# Code Sample 38 Using\
    \ Components\n\nThe code above shows how this would really be used. The accounts\
    \ array can hold references to any object that implements the IAccount interface.\
    \ This includes CustomerAccount and BabyAccount objects. The first element in\
    \ the array (element 0) is assigned to a CustomerAccount object and the second\
    \ element (element 1) is assigned to a BabyAccount. When methods are called on\
    \ these objects in the particular way it is used, the final call of WithDrawFunds\
    \ will fail, although the has money in the bank they not allowed to draw out more\
    \ than 10 pounds.\n\nA component can implement as many interfaces as are required.\
    \ The IAccount interface lets me regard a component purely in terms of its ability\
    \ to behave as a bank. However, I might want to regard a component in a variety\
    \ of ways. For example, the bank will want the account to be able to print itself\
    \ out paper.\n\nYou might think that all I have to do is add a print method to\
    \ the Account interface. This would be reasonable if I ever wanted to print bank\
    \ accounts. However, there will be lots of things which need to be printed, for\
    \ example warnings, special offers and the like. Each of these will be implemented\
    \ in terms of a component which provides a particular interface (IWarning, ISpecialOffer\
    \ for example). I don't want to provide a print method in each of these, what\
    \ will be a way that I can regard object in terms of its ability to print.\n\n\
    This is actually very easy. I create the interface:\n\n```\npublic interface IPrintToPaper\
    \ {\n    void DoPrint();\n}\n```\n\nNow anything which implements the IPrintToPaper\
    \ will contain the DoPrint method and can be thought of in terms of its ability\
    \ to print.\n\nA class can implement as many interfaces as it needs. Each interface\
    \ is a new way in which it can be referred to or accessed.\n\n```\npublic class\
    \ BabyAccount : IAccount, IPrintToPaper {\n    \n}\n```\n\nThis means that a BabyAccount\
    \ instance behaves like an account and also contains a DoPrint method which can\
    \ be used to print it out.\n\n# # 4.8.7 Designing with Interfaces\n\nIf you the\
    \ \"abstraction\" technique properly you will end up with a system process which\
    \ grows along the lines of:\n\n+   - gather as metadata what you can tell about;\
    \ what is important to the customer, what values need to be represented and manipulated\
    \ and the range of those values\n- identify classes that you will have to create\
