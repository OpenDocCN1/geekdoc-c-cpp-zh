    Jim\", \"Jims House\");\n        Accounts[2] = new Account(\"Fred\");\n    }\n\
    }\n```\n\nCode Sample 35 Overloaded Constructors\n\nThe sample above shows constructor\
    \ being used properly. The code creates an array of account references (called\
