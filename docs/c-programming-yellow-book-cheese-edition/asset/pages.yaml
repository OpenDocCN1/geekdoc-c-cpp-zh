  md: '# Coupling


    If a class is dependent on another the two classes are said to be coupled. Generally
    speaking a programmer should strive to have as little coupling in their designs
    as possible, since it makes harder to update the system.


    Coupling is often discussed alongside cohesion, in that you should aim for high
    cohesion and low coupling.


    # Creative Laziness


    It seems that some aspects of laziness work well when applied to programming.
    Code reuse, where you pick and up existing code, is a good example of this. Making
    sure the spec is right before you do anything is other way of saving on. However,
    designing the structure so that you can get someone to do a lot of the work is
    probably the best example of laziness in action.


    # Declarative language


    A declarative language tells a computer system about stuff. It doesn''t give instructions
    that explain how to perform an action; it just makes the system aware of the fact
    that something exists and has a particular set of properties.


    C# contains declarations; this is how program can create variables.


    ```

    int i;

    ```


    This declaration creates an integer variable which is identified by the name i.
    However, a C# program also contains statements which tell the computer how to
    perform an action.


    ```

    i = i + 1;

    ```


    This statement changes the value in i, making it larger by 1. The ability to do
    this means that C# is not a declarative language. The markup language XAML however,
    XAML was designed to express the design of a page. A XAML source file contains
    descriptions of items.


    ```

    <TextBox Name="firstNumberTextBox" Text="0"

    VerticalAlignment="Top" Width="460"

    Alignment="center">

    </TextBox>

    ```


    This chunk of XAML describes a TextBox element. It gives the width, the initial
    text and the name of the element. It does not, and can never, tell the system
    what to do with the element, or any behaviour that it has. This is because XAML
    does not provide a way of expressing behaviour; it is simply there to tell the
    system about stuff.


    # Delegate


    A delegate is a safe reference to a method. A delegate is created for a particular
    method signature (for example this method accepts two integers and returns a float).
    It can be directed to a method in a class which matches that signature. Note that
    the delegate holds two items, a reference to the instance/class which contains
    the method and a reference to the method itself. That delegate is an object means
    that it can be passed around any other.


    Delegates are used to inform event generators (things like buttons, timers and
    the link) of the method which is to be called when the event they generate takes
    place.'
  merge: -1
