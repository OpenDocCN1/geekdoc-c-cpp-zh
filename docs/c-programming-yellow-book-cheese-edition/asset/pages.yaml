  md: '# Code Reuse


    A developer takes steps to make sure that a piece of program is only written once.
    This is usually achieved by putting code into methods and then calling them, rather
    than repeating the statements at different parts of a program. The use of class
    hierarchies is also a way of reusing code. You only need to override the methods
    that you want to update.


    # Cohesion


    A class has high cohesion if it is not dependent on/coupled to all other classes.


    # Collection


    The C# library has the idea of a collection being a bunch of things that you want
    to store, for example all the players in a football team or all the customers
    in a bank. One form of collection is an array. Another is the hashtable, which
    allows you to easily find a particular item based on a key value in that. A collection
    enumeration means that it can be asked to provide successive values to the C#
    foreach construction.


    Whenever you want to store a number of things together you should consider using
    a collection class to do this for. The collection classes can be found in the
    System.Collections namespace.


    # Compiler


    A compiler takes a source file and makes sense of it. The compiler will produce
    an executable file which is run. Writing compilers is a specialised business,
    used to be written in assembly language but are now constructed in high level
    languages (like C#). A compiler is a large program which is specially written
    for a particular computer and programming language. Most compilers work in various
    fields. The first phase, the pre-processor, takes the source which the user has
    written and then finds all the individual keywords, identifiers and symbols producing
    a stream of program source which is fed to the "parser" which ensures that the
    source adheres to the grammar of the programming language in. The final phase
    is the code generator, which produces the executable file which is later run by
    the host.


    # Component


    A component is a class which expresses its behaviour in the form of an interface.
    This means rather than being thought of in terms of what it is (for example a
    CustomerBankAccount) it is thought of terms of what it can do (implement the IAccount
    interface to pay and withdraw money). When creating a system you should focus
    on the components and how they interact. Their interactions are expressed in the
    interfaces between them.


    # Constructor


    A constructor is a method in a class which is called as a new instance of that
    is created. Programs use constructors to get control when an instance is created
    and set up the values inside the class. If a class is a member of a hierarchy,
    the parent class has a constructor, it is important when making the child that
    you ensure the parent constructor is called correctly. Otherwise the compiler
    will refuse to compile your program.'
