    \ since this allows a well-managed way of using the method that you over-rid.\
    \ In fact, I'm wondering why I mentioned this at all.\n\n# 4.9.5 Stopping Overriding\n\
    \nOverriding is very powerful. It means that a programmer can just change one\
    \ part of a class and make a new one with all the behaviours of the parent. This\
    \ goes well with a design process which means as you move down the \"family tree\"\
    \ of classes you get more and more.\n\nHowever,overriding/replacing is not always\
    \ desirable. Consider the GetBalance method. This is never going to need a replacement.\
    \ And a jaunty programmer could write their own and override the one in the parent:\n\
    \n```\npublic new decimal GetBalance ()\n{\n    return 1000000;\n}\n```\n\nThis\
    \ is the banking equivalent of the bottle of beer that is empty. No matter how\
    \ much cash is drawn out, it always returns a balance of a million pounds!\n\n\
    A naughty programmer could insert this into a class and give himself a nice advice\
    \ spree. This is that we need a way to mark some methods as not being able to\
    \ be overridden. C# does this by giving us a sealed keyword which means \"You\
    \ can't override any method\".\n\nUnfortunately this is hard to use. The rules\
    \ are that you can only seal an overriding method (which means that we cannot\
    \ seal the GetBalance method in the CustomerAccount class) and a naughty programmer\
    \ could always replace a sealed method in the parent that has the same name in\
    \ the code.\n\nAnother use for sealed, which has a bit more potential, is that\
    \ you can mark a class as sealed. This means that the class cannot be extended,\
