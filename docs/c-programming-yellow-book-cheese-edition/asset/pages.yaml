  md: '# Functional Design Specification


    Large software developments follow a particular path, from the initial meeting
    up to when the product is handed over. The precise path depended on the nature
    of the job and the techniques in use at the developer; however, all developments
    start with a description of what the system is to do. This is the most crucial
    item in the whole project, and is often called the Functional Design Specification,
    or FDS.


    # Globally Unique Identifier (GUID)


    This is something which is created with the intention of it being unique in the
    world. It gives an identifier by which something can be referred to. GUID creation
    involves the use of random values and the date and other things, GUIDs are used
    for things like account references and tags which must be unique. Most operating
    systems and programmer libraries provide methods which will create GUIDs.


    # Hierarchy


    A hierarchy is created when a parent class is extended by a child to produce a
    new class with all the abilities of the parent new and modified behaviours to
    the requirements, of the child. Extending the child produces a further level of
    hierarchy. The classes at the top of the hierarchy should be more general and
    possibly abstract (for example BankAccount) and the classes at the lower levels
    will be more specific (for example ChildBankAccount).


    # Immutable


    An immutable object cannot be changed. If an attempt is to change the content
    of an immutable object new object is created with the changed content and the
    "old" remains in memory. The string class is immutable. This gives strings a behaviour
    similar to value types, which makes them easier to use in programs.


    # Inheritance


    Inheritance is the way in which a class extends a parent to allow it to make use
    of all the behaviours and properties the parent add/customise these for a slightly
    different requirement. For more detail see the description of hierarchy.


    # Interface


    An interface defines a set of actions. The actions are defined in terms of a number
    of method definitions. A class which implements an interface must contain code
    for each of the methods. A class which implements an interface can be referenced
    purely in terms of that interface. Interfaces make it possible to create components.
    We don''t care precisely what the component is, as long as it implements the interface
    it can be thought of purely in terms of that ability.


    # Library


    A library is a set of classes which are used by other programs. The difference
    between a library and a program is that the library file will have the extension
    .dll (dynamic link library) and will not contain a main method.'
  merge: -1
