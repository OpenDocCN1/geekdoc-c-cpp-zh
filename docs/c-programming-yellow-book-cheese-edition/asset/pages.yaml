  md: '# Advanced Programming


    # A Graphical User Interface


    This system of standard format and schema means that it is very easy for developers
    to create data formats for particular purposes. This is helped by the fact that
    there are a lot of tools to help create documents and schemas. The .NET framework
    provides a way by which a program can save an object as a formatted XML document.


    As far as we are concerned, is worth remembering that XML is useful for this kind
    of thing, but at the moment I want to keep the focus on XML itself.


    # XML and page layout design


    A file of XML can describe a page. When you create a new WPF application you get
    a page that contains a few elements. As you put more into the page file grows
    as each description is added. Some elements work as containers. These elements
    can hold other. They are very useful when you want to lay things out, for example
    a Grid can hold a set of elements in a grid arrangement. The XML can also contain
    the descriptions of animations and transitions that can be used to make your interface
    more impressive user interfaces. We are not going to spend too much time on the
    layout of elements XML; suffice to say that you can create incredibly impressive
    front ends for your programs using this tool. It is also a special design tool
    called "Expression Blend" that we use for making displays.


    Unfortunately that most programmers (including me) are not good at designing attractive
    interfaces (although I am). In a real company you will employ graphic designers
    who will create artistic looking front ends. The role of the programmer then be
    to write the code that displays these to get the required job.


    Microsoft designed XML as a recognition of this issue. It enforces a strong separation
    between screen design and the code that is controlled by it. It makes it easy
    for a programmer to create an initial user interface which is subsequently changed
    by a designer in a much more attractive one. It is also possible for a programmer
    to take a complete user interface design and then fit the behaviours between each
    of the display components.


    # Describing XAML Elements


    We can start to describe how XAML lets us design an application by taking a look
    at how you could construct a program using it. Consider the following screen.


    ![](img/5a238309826e383fc3d481aa5d5dfccc_188_0.png)


    This is a very simple Windows program that I''ve called an "Adding Machine". You
    can use to perform very simple sums. You enter two numbers into the two boxes
    at the top and then press the equals button. It rewards you with the sum of these
    two numbers. At the moment it is showing us that 0 plus is 0. Each individual
    item on the screen is called a UI or User Interface. I''m going to collect these
    elements from now on. There are six of them on the screen above:


    +   1. The title "Adding Machine". This is a block of text with a font size of
    18 so it stands out.

    2. The top textbox, where I can type a number.

    3. A text item holding the character +.


