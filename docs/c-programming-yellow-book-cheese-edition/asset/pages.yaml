  md: '# Proving it Works


    In a real world you nowadays create a test which will allow you to prove that
    the program works, you could for example:


    > "If I give the above program the inputs 2 metres high and 1 metre wide the program
    should tell me I need 4 square metres of glass and 19.5 feet of wood."


    The test procedure which is designed for a proper project should test out all
    possible states within the program, including the all-important error conditions.
    In a large system the person writing the program may have to create a test harness
    and the supplier should agree on the number and type of the tests to be performed
    and then sign it to be tested. Both the customer and the supplier document describing
    these.


    Testing is a very important part of development. There is one development technique
    where you write the tests before the actual program does the job. This is actually
    a good idea, and we will explore later. In terms of code production, you can expect
    to write as much code to test your solution as in itself. Remember when you are
    working out how much work is involved in a particular job.


    # Getting Paid


    At this point the supplier knows that if a system is created which will pass all
    the tests the customer will have no option to pay for the work! Note also that
    the design and test procedures have been frozen, there is no ambiguity which can
    lead to the customer requesting the work although of course this can still happen!


    The good news is that if changes are requested be viewed in the context of actual
    work, which they can expect to be paid.


