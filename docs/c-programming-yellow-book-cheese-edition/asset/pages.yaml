    # Syntax Highlighting


    Some program editors (for example Visual Studio) display different program elements
    in different colors, to make it easier for the programmer to understand the code.
    Keywords are displayed in blue, strings in red and green. Note that the colours
    are added by the editor, and there is nothing in the actual C source file that
    can stop them the colour of the text.


    # Test harness


    The test harness will contain simulations of those portions of the input and output
    which the system is being tested will use. You put your program into a test harness
    and then the program thinks it is in the completed system. A test harness is very
    useful when debugging it removes the need for the complete system (for example
    a lawyer?).


    # This


    this is a C# keyword which has different meanings depending on the context in
    which it is given. It is used in a constructor of a class to call another constructor.
    It is also used as a reference to the current instance, or in non-static methods
    running inside instance.


    # Typesafe


    We have seen that C# is quite fussy about combining things that should not be
    combined. Try to put a float value into an int variable and the compiler will
    get cross at this point. The reason for this is that the designers of the language
    have noticed a few programming mistakes and have designed it so that these mistakes
    are detected before the program runs, not when it has crashed. One of these is
    the use of values or items in contexts where it is not meaningful to do this (put
    string into a bool) or result in loss of data or accuracy (put a double into a
    byte). This kind of fussiness is safety and C# is very big on it. Other languages
    are much more relaxed when it comes to combining things, and work on the basis
    that the programmer knows best. They assume that because code has been written
    to something, that thing must be the right.


    C# is very keen on this (as I am). It is important that developers get the left
    to stop them doing stupid things, and a language that stops you from combining
    things in a way that might not be sensible is a good thing in my book.


    If you really want to impose your will on the compiler and to compile your code
    in spite of any type safety issues you can do this by casting.


    # Unit test


    A unit test is a small test which exercises a component and ensures it for a particular
    function correctly. Unit tests should be written alongside the development process
    so that they can be applied to code just after (or in test drive development)
    before the code is written.'
