  md: "# Programmer's Point: Document your side-effects\n\nA change by a method to\
    \ something around it is called a side effect of the method. In other words, when\
    \ someone calls our addToRefParam method, it is going to have the \"side effect\"\
    \ of something outside the method itself (the value of the parameter passed by\
    \ reference). Generally speaking you have to be careful with side effects, as\
    \ someone reading your program has to know that your method has changed in this\
    \ way.\n\n# 3.1.9 Passing Parameter values as \"out\" references\n\nWhen you pass\
    \ a parameter as a reference you don't want this. Instead you just want to allow\
    \ the method to change it. This is the case when we want to read in the name and\
    \ age of a user. The original value of the parameters is of no interest to the\
    \ method. Instead just want to deliver results to them. In this case I can replace\
    \ the ref with the keyword out.\n\n```\nstatic void readPerson (out string name,\
    \ out int age {\n    name = readString(\"Enter your name: \");\n    age = readInt(\"\
    Enter your age: \", 0, 100);\n}\n```\n\nThe method readPerson reads the name and\
    \ the age of a person. It uses two more methods that I have created, readString\
    \ and readInt.\n\nI can call readPerson as follows:\n\n```\nstring name;\nint\
    \ age;\nreadPerson (out name, out age);\n```\n\nNote that I use the out keyword\
    \ in the clause of the method as well.\n\nThe readPerson method will read the\
    \ person and deliver the information into the two variables.\n\n# Programmer's\
    \ Point: Languages can help programmers\n\nThe out keyword is a nice example of\
    \ how the design of a programming language can make programs safer and easier\
    \ to write. It makes sure that a programmer cannot use the value of the parameter\
    \ in the method. It also allows the compiler to make sure that somewhere in the\
    \ method the output parameters are assigned values. This is very useful. It means\
    \ that if I mark the parameters as out I must have given them a value for the\
    \ program to compile. This makes harder for me to get the program wrong, as I\
    \ am protected against forgetting to do that part of the job.\n\n# 3.1.10 Method\
    \ Libraries\n\nThe first thing that a good programmer will do when they start\
    \ writing code is to create a set of libraries which can be used to make their\
    \ job easier. In the code I have written a couple of library methods which I can\
    \ use to read values of different types:"
