  md: '# Creating Solutions


    # Inheritance


    be used at the design stage of a program if you have a set of related objects
    that you

    wish to create.


    Inheritance lets a class pick up behaviours from the class which is its parent.
    You can

    regard an interface as a statement by a class that it has a set of behaviours
    that it

    implements a given interface. If a class is descended from a particular class
    then this

    means that it has a set of behaviour because it has *inherited* from its parent.
    In parent

    short:


    **Interface:** "I can do these things because I value you can"

    **Inheritance:** "I can do these things because my parent can"


    # 4.9.1 Extending a class


    We can see an example of use for inheritance in our bank account project. We have

    already noted that a BabyAccount must behave just like a CustomerAccount except

    in respect of cash withdrawal method. Customer account can draw as much as they

    want. Baby accounts are only allowed to draw up to 10 pounds at time.


    We have solved this problem from a point of view by using interfaces. By

    separating the thing that does only from the description of the job (which) is
    an

    interface lets you do we get the whole system to be flexible.

    IAcc and then plug in with different behaviours as required. We can

    create new accounts at any time after the system has been deployed. These can

    be introduced and work alongside the others because they behave correctly (i.e.

    t implement them).


    But this makes things bit tiresome when we write the program. We need to createnanaAccount
    class which contains a lot of code which is duplicated in the

    CustomerAccount class. "This is not a problem" you probably think "I can use the

    editor block copy to move the program across" But:


    # Programmer''s Point: Block Copy is Evil


    I still make mistakes when I write programs. You might think that such a huge
    number of years in the job I get

    every thing right. Wrong. And a lot of the mistakes that I am caused by improper
    use of block code. I

    write some code and find that I need something, not exactly the same, in another
    part of the program. So I

    use block code. Then I change not, but not all, of the new and find that my program
    doesn''t work properly.

    Try not to do this. A great programmer writes every piece of code, and only once.
    If you need to use it in

    than one place, make it a method.


    What we really want to pick up all the behaviours in the CustomerAccount and

    then just the one method that behave differently. It turns out that we

    do this in C# using inheritance. When I create the BabyAccount class I can tell

    t compiler that it is the CustomerAccount one:


    ```

    public class BabyAccount : CustomerAccount, IAccount

    }

    ```


    The key thing here is highlighted after the class name. I have put the name of

    t class that BabyAccount is extending. This means that everything that does

    CustomerAccount can do, BabyAccount can do.


    I now write code like:


    ```

    BabyAccount b = new BabyAccount();

    b.PayFunds(50);

    ```


    This works because, although BabyAccount does not have a PayFunds method,

    parent class does. This means that the PayFunds method from the

    CustomerAccount class is used at this point.


    C# Programming by Rob Miles 2016


    116'
