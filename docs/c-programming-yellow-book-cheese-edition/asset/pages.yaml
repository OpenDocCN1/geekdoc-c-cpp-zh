  md: "# Programmer's Point: Interface names start with I\n\nWe have seen that there\
    \ are things called coding conventions, which set down standards for naming variables.\
    \ Another convention is that the name of an interface starts with the letter I.\
    \ If you do not this your programs will compile fine, since the compiler has no\
    \ opinions on variable names, you may have trouble sleeping at night. And quite\
    \ right too.\n\n# 4.8.3 Implementing an Interface in C#\n\nInterfaces become interesting\
    \ when we make a class implement them. Implementing an interface is a bit like\
    \ setting a contract between the suppliers of resources and the consumer. If a\
    \ class implements it it is saying that for every method described in the interface,\
    \ it has a corresponding implementation.\n\nIn the case of the bank account, I\
    \ am going to create a class which implements the interface, so that it can be\
    \ thought of as an account component, regardless of what it is:\n\n```\npublic\
    \ class CustomerAccount : IAccount\n{\n    private decimal balance = 0;\n\n  \
    \  public bool WithdrawFunds ( decimal amount )\n    {\n        if ( balance <\
    \ amount )\n        {\n            return false;\n        }\n        balance =\
    \ balance - amount;\n        return true;\n    }\n\n    public void PayInFunds\
    \ ( decimal amount )\n    {\n        balance = balance + amount;\n    }\n\n  \
    \  public decimal GetBalance (\n    {\n        return balance;\n    }\n}\n```\n\
    \nThe code above does not look that different from the previous account class.\
    \ The only difference is the top line:\n\n```\npublic class CustomerAccount :\
    \ IAccount\n{\n```\n\nThe highlighted part of the line above is where the programmer\
    \ tells the compiler that this class implements the IAccount interface. This means\
    \ that the class contains concrete versions of all the methods described in the\
    \ interface. If the class does not contain a method that the interface needs you\
    \ will get a compilation error:\n\nIn this case I missed out the PayFunds method\
    \ and the compiler complained accordingly."
