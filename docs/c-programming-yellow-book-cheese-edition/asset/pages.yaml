  md: "# 4.2.1 Enumeration and states\n\nEnumerated sounds posh. But if you think\
    \ of \"enumerated\" as just meaning \"numbered\" things get a bit easier. To understand\
    \ what we are doing here we need to consider the problem which these types are\
    \ intended to solve.\n\nWe know that if we want to hold an integer value we can\
    \ use an int If we want to hold something that is either true or false we can\
    \ use a bool. However, sometimes we want to hold a range of particular values\
    \ or states.\n\n# Sample states\n\nEnumerated types are very useful when storing\
    \ state information. States are not the same as other items like the name of a\
    \ customer or the balance of their account.\n\nFor example, if I am writing a\
    \ program to play the game Battleships (squares of the \"sea\" hold different\
    \ types of craft which can be attacked) I may decide that a given square of the\
    \ sea have the following thing in it:\n\n+   - Empty sea\n- Attacked\n- Battleship\n\
    - Cruiser\n- Submarine\n- Rowing boat\n\nIf you think about it, I am sort of assembling\
    \ more metadata here, in that I have decided I need to keep track of the sea and\
    \ I have worked exactly what I can put in it. I could do something with numbers\
    \ if I like:\n\n+   - Empty sea = 1\n- Attacked = 2\n- Battleship = 3\n- Cruiser\
    \ = 4\n- Submarine = 5\n- Rowing boat = 6\n\nHowever, this world would mean that\
    \ I have to keep track of the values myself and remember that if we get the value\
    \ 7 in a sea location this is clearly wrong. These types are \"enumerated types\"\
    .\n\nC# has a way in which we create a type which has just a particular set of\
    \ possible values.\n\n```\nenum SeaState {\n  EmptySea,\n  Attacked,\n  Battleship,\n\
    \  Cruiser,\n  Submarine,\n  RowingBoat\n};\n```\n\nI created a type called SeaState\
    \ which can be used to hold the state of a particular part of the sea. It can\
    \ only have the given values above, and must be managed solely in types of named\
    \ enumerations. For example I write:\n\n```\nSeaState openSea;\nopenSea = SeaState.EmptySea;\n\
    ```\n\nMy variable openSea is only to hold values that represent the state of\
    \ the sea contents. Of course C# itself will actually represent these states as\
    \ particular numeric values, but how these are managed is not a problem for me.\n\
    \nNote that types I create (like SeaState) will be highlighted by the editor in\
    \ a blue colour which is not the same as keywords."
