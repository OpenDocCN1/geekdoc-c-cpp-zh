    # Code Sample 29 Multiple References


    The question is: what would the second call of WriteLine print out? If we draw
    a diagram the answer becomes clearer:


    ![](img/5a238309826e383fc3d481aa5d5dfccc_93_0.png)


    Both of the tags refer to the same instance of Account. This means that changes
    are made to the object that Temp refers to will also be reflected in the one that
    RobsAccount refers to, because they are the same object. This means that the program
    would print Jim, since that is the name in the object that RobsAccount is referring
    to.


    This indicates a trickiness with objects and references. There is no limit to
    the number of references that can be attached to a single instance, so you need
    to remember that changing the object that a reference refers to may well change
    that instance from the point of view of other objects.


