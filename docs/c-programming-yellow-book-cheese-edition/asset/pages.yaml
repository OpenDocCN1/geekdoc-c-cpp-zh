  md: "# Properties and interfaces\n\nInterfaces are a way that you can bring together\
    \ a set of behaviours. They are packaged as a list of methods which a class must\
    \ contain if it implements the interfaces. It is possible to add properties to\
    \ interfaces. You do this by leaving out the statements which are the body of\
    \ the get and set behaviours:\n\n```\ninterface IStaff {\n  int Age {\n    get;\n\
    \    set;\n  }\n}\n```\n\nThis is an interface that specifies classes which implement\
    \ it must contain an Age property with both get and set behaviours.\n\n# Property\
    \ problems\n\nProperties are really neat, and they are used throughout the classes\
    \ in the .NET libraries. But there are a few things that you need to be aware\
    \ of when deciding or not to use them:\n\n# Property Assignment Failure\n\nWe\
    \ have seen that the set behaviour can reject values if it thinks they are out\
    \ of range. This is OK, but with no way of telling the user of the property that\
    \ this has failed. With our property above the code:\n\n```\ns.Age = 121;\n```\n\
    \n+   - would fail. However, the person performing the assignment would not be\
    \ aware of this, since there is no way that the property can return a value which\
    \ indicates success or failure. The only way that a property method could do this\
    \ is to throw an exception, which is not a good way to go on.\n\nA SetAge method\
    \ on the other hand could return a value which indicates whether or not worked:\n\
    \n```\npublic bool SetAge( int inAge ) {\n  if (inAge > 0) && (inAge < 120) {\n\
    \    this.age = inAge;\n    return true;\n  }\n  return false;\n}\n```\n\nA programmer\
    \ setting the age value can now find out if the set worked or failed.\nIf there\
    \ is a situation where a property can fail I never expose that as a property.\
    \ I suppose that it would be possible to combine a set method and a property,\
    \ but I reckon that would be madness.\n\n# Properties Run Code\n\nWhen you assign\
    \ a value to a property you are actually calling a method. Unfortunately there\
    \ is no way you can tell that from the code which does the assignment:\n\n```\n\
    s.Age = 99;\n```\n\nThis looks very innocent, but could result in a thousand lines\
    \ of code running inside the set property. It is possible to use this advantage,\
    \ in that an object can react and track property changes. But it can also be made\
    \ very confusing."
