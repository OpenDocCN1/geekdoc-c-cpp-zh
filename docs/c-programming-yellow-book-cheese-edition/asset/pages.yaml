  md: "# Creating Solutions\n\n# Inheritance\n\nSo, instances of the BabyAccount class\
    \ have abilities they pick up from their parent class. In fact, at the moment,\
    \ the BabyAccount class has no behaviours of its own; it gets everything from\
    \ its parent.\n\n# ## 4.9.2 Overriding methods\n\nWe now know that we can make\
    \ a new class based on an existing one. The next thing we need to be able to change\
    \ the behaviour of the one method that we are interested in. We replace the WithdrawFunds\
    \ method with a new that is called overriding a method. In the BabyAccount class\
    \ I can do like this:\n\n```\npublic class BabyAccount : CustomerAccount,IAccount\n\
    {\n    public override bool WithdrawFunds(decimal amount)\n    {\n        if (amount\
    \ > 10)\n        {\n            return false;\n        }\n        if (balance\
    \ < amount)\n        {\n            return false;\n        }\n        balance\
    \ = balance - amount;\n        return true;\n    }\n}\n```\n\nThe keyword override\
    \ means \"use this version of the method in preference to the one in the parent\"\
    . This means that code looks like:\n\n```\nBabyAccount b = new BabyAccount();\n\
    b.PayFunds($5);\nb.WithdrawFunds($5);\n```\n\nThe call of PayFunds will use the\
    \ method in the parent (since that it has not been overridden) but the call of\
    \ WithdrawFunds will use the method in the BabyAccount.\n\n# ## Virtual Methods\n\
    \nActually, there is one other thing that we need to do in order for the overriding\
    \ to work. The C# compiler needs to know if a method is going to be overridden.\
    \ This is in a slightly different way from a \"normal\" one. In other words, the\
    \ code above won't compile properly because the compiler has not detected that\
    \ WithdrawFunds might be overridden in classes which are of the parent class.\n\
    \nTo make the override correctly I have to change my declaration of the method\
    \ in the CustomerAccount class.\n\n```\npublic class CustomerAccount : IAccount\n\
    {\n    private decimal balance = 0;\n    public virtual bool WithdrawFunds(decimal\
