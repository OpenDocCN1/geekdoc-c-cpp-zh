    \ is an Account for Rob with a full address and 100000 pounds. The second element\
    \ (element 1) refers to an account for Jim with his address and the default balance\
    \ of 0. The third element (element 0) refers to an account for Fred with the default\
    \ balance \"Not Supplied\" and a default balance of 0.\n\n# Programmer's Point:\
    \ Object Construction Should Be Planned\n\nThe way in which objects are constructed\
    \ is something that you can plan carefully when you write your program. You should\
    \ create one \"master\" constructor which handles the most comprehensive method\
    \ of constructing the object. You should also make all the other constructor methods\
    \ use this to get hold of that.\n\n# 4.7.5 A constructor cannot fail\n\nIf you\
    \ watch a James Bond movie there is usually a point when your agent 007 is tied\
    \ to the fate of the world is in his hands. Failure is not an option. Constructors\
    \ are a bit like this. Constructors cannot fail. And this is a problem:\n\nWhenever\
    \ we have written methods in the past we have made sure that their behaviour is\
    \ error checked that the method cannot upset the state of our object. For example,\
    \ attempts to withdraw negative amounts of money from a bank account could be\n\
    \nThe whole basic of the way that we have allowed objects to be manipulated is\
    \ to make sure they cannot be broken by the people using them. If you try to do\
    \ something stupid with a method call it would refuse to perform the action and\
    \ return something which indicates it could not do the job.\n\nSo know when we\
    \ create a method that changes the data in an object we have to make sure the\
    \ change is always valid. For example, we might use the following called:\n\n\
    ```\nRobsAccount.PayFunds (1234567890);\n```\n\nThere will be an upper limit to\
    \ the amount that you can pay in once, so the PayInFunds method will refuse to\
    \ pay the money. But what is to stop the following:\n\n```\nRobsAccount = new\
    \ Account(\"Rob\", \"Hull\", 1234567890);\n```\n\nLike James Bond, constructors\
    \ are not allowed to fail. Whatever happens during the constructor call, it will\
    \ complete and a new instance will be created.\n\nThis poses a problem. It looks\
    \ as if we can stupid values at every point except the one which is most important,\
    \ i.e. when the object is created.\n\nC# Programming Rob Miles 2016\n\n107"
