  md: '# Simple Data Processing


    # Writing a Program


    You can see examples of this construction in the for loop definition in the example
    above.


    The other shorthand which we use is when we add a particular value to a variable.
    We could put:


    ```

    house_cost = house_cost + window_cost;

    ```


    This is perfectly OK, but again is rather long winded. C# has some additional
    operators which allow us to shorten this:


    ```

    house_cost += window_cost;

    ```


    The += operator combines addition and the assignment, so that the value in house_cost
    is increased by window_cost. Some other operators are:


    | a += b | the value in a is replaced by a + b |

    | a -= b | the value in a is replaced by a - b |

    | a /= b | the value in a is replaced by a / b |

    | a *= b | the value in a is replaced by a * b |


    There are other combination operators; I will leave you to find them!


    # Statements and Values


    One of the few things about C# is that all statements return a value, which you
    can use in another statement if you like. Most of the time it will be very useful,
    when we get to around deciding things (later). In order to show how this is done,
    consider the following:


    ```

    i = (j++);

    ```


    This is perfectly legal (and even sensible) C#. It has the effect of setting both
    i and j to θ. An assignment statement always returns the value which was assigned
    (i.e. the bit on the right of the gozzinta). This value can then be used as a
    value or operand. If you are advised to put brackets around the statement which
    is being used as a value, this makes the whole thing clearer for you and the compiler:


    When you consider operators like ++ there is possible ambiguity, in that you do
    not know the value before or after the increment. C# provides a way of getting
    either value, depending on what effect you want. You determine whether to see
    the value before after the sum by the position of the ++


    ```

    i++ Means "Give me the value before the increment"

    ++i Means "Give me the value after the increment"

    ```


    As an example:


    ```

    int i = 2, j;

    j = ++i;

    ```


    would make j equal to 3. The other special operators, += return all the value
    after the operator has been performed.


    # Programmer''s Point: Always simplify for simplicity


    Don''t get carried away with this. The fact that you can produce code like:


    ```

    height = width = speed = count = size = 0;

    ```


    - does not mean you should. When I am writing a program first consideration is
    whether or not the program is easy to understand. I don''t think the statement
    above is very easy to follow -so irrespective of how much more efficient it is,
    I still don''t do it.


    C# Programming © Rob Miles 2016


    45'
