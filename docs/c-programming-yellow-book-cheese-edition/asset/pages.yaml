    Thread.Sleep(500);\n```\n\nThis method is given number of milliseconds (thousand'th\
    \ of a second) that the execution is to pause. The above call would pause a program\
    \ for half second.\n\n# Joining Threads\n\nYou might want to make one wait for\
    \ another finish working. A thread finishes when it exits the method that was\
    \ called in. In above example, each thread will end when the call of busyloop\
    \ finishes. A thread instance provides a Join method that can be called to wait\
    \ for another to complete operation.\n\n```\nt1.Join();\n```\n\nThis would cause\
    \ executing the thread to wait until the thread t1 finishes.\n\n# Thread Control\n\
    \nThe class provides a set of methods that you can use to control the execution\
    \ of a thread. You can abort a thread by calling its Abort method:\n\n```\nt1.Abort();\n\
    ```\n\nThis asks the operating system to destroy and remove it from memory.\n\n\
    If you don't want to destroy a thread, but simply make it pause for a while, you\
    \ can call the Suspend method on the thread:\n\n```\nt1.Suspend();\n```\n\nThe\
    \ thread is to sleep until you call the Resume method on that thread.\n\n```\n\
    t1.Resume();\n```\n\n# Finding the state of a thread\n\nYou can find out the state\
    \ of a thread using its ThreadState property. This is an enumerated value which\
    \ has a number of possible values.\n\nThe most useful are:\n\n+   ThreadState.Running\
    \ the thread is running\nThreadState.Stopped the thread has finished executing\
    \ the thread method\nThreadState.Suspend the thread has been suspended\nThreadState.WaitSleepJoin\
    \ the thread is executing a Sleep, waiting to join another thread or waiting for\
    \ a Monitor\n\nAs an example, to display a message if thread t1 is running:\n\n\
    ```\nif ( t1.ThreadState == ThreadState.Running )\n{\n    Console.WriteLine(\"\
    Thread Running\");\n}\n```"
