  md: '# 3 Creating Programs


    In this chapter we will build on our programming abilities to make programs that
    are broken down into manageable chunks and find out how a program can store and
    manipulate large amounts of data using arrays.


    # 3.1 Methods


    We have already come across the methods Main, WriteLine and ReadLine. Main is
    the method we write where our program starts. WriteLine and ReadLine were provided
    by the creators of C# to give us a way of displaying text and reading information
    from the user.


    This is what methods are all about. Your programs will contain methods that you
    create to solve parts of the problem and they will also use methods that have
    been provided by other people. In this section we are going to consider why methods
    are useful and how you can create your own.


    # 3.1.1 The Need for Methods


    In the glazing program above we spend a lot of time checking the values of inputs
    and making sure they are in certain ranges. We have exactly the same piece of
    code to check widths and heights. If we added a third line to, for example frame
    thickness, the program would get bigger and harder to write. This is not efficient;
    it makes the code thicker. What we would like to do is write the checking code
    once and use it at each point in the program. To do this you need to define a
    method to do the work for you.


    # Method and Laziness


    We have already established that a good programmer is creatively lazy. The one
    of this is that a programmer will try to do a good job once and only once.


    Until now all our programs have been in a single method. The method is the block
    of code which follows the main part in our program. However, C# lets us create
    other methods which are used when we run programs. Methods give us what we have
    written:


    +   - We can use methods to let us re-use a piece of code

    - We can also use methods to break down a large task into a number of smaller
    ones.


    We need both of these when we start to write larger programs. Again, with lots
    of features of the C# language, methods don''t actually make things possible,
    but they help with the organisation of our programs.


    Essentially you take a block of code and give it a name. Then you can refer to
    this block of code to do something for you. As a silly example:'
