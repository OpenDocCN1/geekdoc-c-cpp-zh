  md: '# Advanced Programming


    # A Graphical User Interface


    # 3. Button – something we can press to cause events in our program.


    If you think about it, you can break the properties of each of these elements
    into two kinds, those that all the elements need to have, for example position
    on the screen, and those that are specific to that type of element. For example
    a TextBox needs to record the position of the cursor where text is being entered.
    From a software design point of view this is a really good use for a class hierarchy.


    ![](img/5a238309826e383fc3d481aa5d5dfccc_190_0.png)


    Above you can see part of the hierarchy that the XAML designers built. The top
    class is called FrameworkElement. It contains all the information that is common
    to all controls on the screen. Each of the other classes is a child of this class.
    Children pick up all the behaviours and properties of their parent class and add
    some of their own. Actually the design is a bit more complex than shown above,
    the FrameworkElement is a child of a class called UIElement, but it shows the
    principles behind the controls.


    Creating a class hierarchy like this has a lot of advantages. If we want a custom
    kind of textbox we can extend the TextBox class and add the properties and behaviours
    that we need. As far as the software implementing the XAML system is concerned
    it can treat all controls the same and ask each control to draw itself in a manner
    appropriate to that component.


    Our program will manipulate the elements as if they were #C objects, which were
    actually defined in a XAML source file. This works when the program is built the
    XAML system will create objects that match elements in the XAML source file.


    # Managing Elements


    When we want to use the interface elements in our program we need a way of referring
    to them. If we take a look at the XAML that implements our adding our machine
    we can see that some of the components have a name property:


    ```

    <TextBox Name="firstNumberTextBox" Width="100" Margin="0,10" TextAlignment="Center"/>

    ```


    I have set the name to firstNumberTextBox. You''ll never guess what the text box
    is called. Note that the name of a property in this context is actually going
    to set the name of the variable declared inside the adding program. In other words,
    as a result of what I''ve done above will now be the following statement in my
    program somewhere:


    ```

    TextBox firstNumberTextBox;

    ```'
