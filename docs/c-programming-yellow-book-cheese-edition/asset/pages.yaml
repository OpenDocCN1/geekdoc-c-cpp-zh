    # 3.4.6 Throwing an Exception


    Now we know how to catch exceptions, the next thing we need to consider is how
    to throw them. This turns out to be very easy:


    ```

    throw new Exception("Boom");

    ```


    The statement above makes a new exception and then throws it. When you make an
    exception you can give it a string that contains the exception delivery. In this
    case I have used somewhat unhelpful message "Boom". Throwing an exception might
    cause your program to end if the code does not run a try-construction.


    # 3.4.7 Exception Etiquette


    Exceptions are best reserved for situations when your program really cannot go
    any further. If you are going to throw an exception this should be in a situation
    where your program really cannot do anything else. For example if a user of the
    double glazing enters height which is too large the program can simply print the
    message "Height too large" and ask for another value. This means that errors at
    this level are not worthy of catching. I reserve my exceptions for catastrophic
    errors that my program really cannot deal with must pass on to something, and
    you should too.


    # Programmer''s Plan: Plan your Exception Handling


    When you design a program you should consider what events count as "stopoppers"
    and how you are going to deal with them. You can create your own custom exception
    types based on the one provided by the System and use these in your error handling.


