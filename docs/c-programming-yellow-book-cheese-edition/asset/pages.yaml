  md: '# Machine code


    Machine Code is the language which the processor of the computer actually understands.
    It contains a number of very simple operations, for move an item from the processor
    to memory, or add one to an item in the processor. Each particular range of computer
    processors has its own machine code, which means that machine code written for
    one kind of machine cannot be easily used on another.


    # Member


    A member of a class is declared within that class. It can either do something
    (a method) or hold some data (variable). Methods are sometimes called behaviours.
    Data members are sometimes called properties.


    # Metadata


    Metadata is about data. It operates at all kinds of levels. The fact that the
    value is held as an integer is metadata. The fact that it cannot be negative is
    more metadata. Metadata must be gathered by the programmer in consultation with
    the customer when creating a system.


    # Method


    A method is a block of code preceded by a method signature. The method has a particular
    name and may return a value. It may also accept a parameter to work on. Methods
    are used to break a large program into a number of smaller units, of which performs
    one part of the task. They are also used to allow some piece of program to be
    used in lots of places in a large development. If a method is public it can be
    called by other classes. A public method is how an object exposes its behaviours.
    A message is delivered to an object by means of a call of a method inside that
    object.


    # Mutator


    A mutator is a method which is called to change the value of a member inside an
    object. The change will hopefully be managed, in invalid values will be rejected
    in some way. This is implemented in the form of a public method which is supplied
    with a new value and may return an error code.


    # Namespace


    A namespace is an area within which a particular name has a particular meaning.
    Namespaces lets you reuse names. A programmer creating a namespace can use any
    name in that namespace. A fully qualified name of a resource is prefixed by the
    namespace in which the name exists. A namespace can contain another namespace,
    allowing hierarchies to be set up. Note that a namespace is purely logical in
    that it does not reflect where in the system the items are physically located,
    it just gives the names by which they are known. C# provides the using keyword
    to allow namespaces to be ''imported'' to a program.


    # Overload


    A method is overloaded when one comes with the same name but a different set of
    parameters is declared in the class name. Overloads are revealed when there is
    more than one way of providing information for a particular action, for example
    a date can be set by providing day, month, year information or by a text string
    or by a single integer which'
