    # 4.11.5 String Length


    All of the above operations will fail if you try to do something that takes you
    the length of the string. In this respect strings are just like arrays. It is
    also possible to use the methods to find out how long they are:


    ```

    Console.WriteLine("Length: " + s1.Length);

    ```


    The Length property gives the number of characters in the string.


    # 4.11.6 Character case


    Objects of string can be asked to create new, modified, versions of themselves
    in slightly different forms. You can do this by calling methods on the reference
    to get the result you want:


    ```

    s1=ToUpper();

    ```


    The Upper method returns a version of a string with all the letters converted
    to UPPER CASE. No other characters in the string are changed. There is a corresponding
    ToLower method as well.


    # 4.11.7 Trimming and empty strings


    Another method is Trim. This removes any leading or trailing spaces from the string:


    ```

    s1.Trim();

    ```


    This is useful if your users have typed " Rob " rather than "Rob". If you don''t
    trim the text you will find equals checks for the name will fail. There TrimStart
    and TrimEnd methods to take off leading or trailing spaces if you want to end
    up with a string that contains no characters (i.e. its length is zero).


    # 4.11.8 Character Commands


    The class also exposes some very useful methods which can be used to check the
    values of individual characters. These are characters in the character class and
    can be used to test characters in a variety of ways:


    | char.IsDigit(ch) | returns true if the character is a digit (0 to 9) |

    | char.IsLetter(ch) | returns true if the character is a letter (a to z or A to
    Z) |

    | char.IsOrDigit(ch) | returns true if the character is a letter or a digit |

    | char.IsLower(ch) | returns true if the character is a lower case letter |

    | char.IsUpper(ch) | returns true if the character is an upper case letter |

    | char.IsPunctuation(ch) | returns true if the character is a punctuation character
    |

    | char.IsWhiteSpace(ch) | returns true if the character is a space, tab or newline
    |


    You can use these when you are looking through a string for a particular character.


