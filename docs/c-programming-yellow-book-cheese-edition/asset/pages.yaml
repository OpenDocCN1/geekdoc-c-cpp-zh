  md: "# Creating Solutions\n\n# Building a Bank\n\nIn short, the hash function gives\
    \ us a starting point for our search, rather than always looking from the beginning\
    \ of our array in some array code above. This greatly speeds up access to the\
    \ data.\n\n# 4.13.4 Using the C# Hashtable collection\n\nFortunately for the designers\
    \ of the C# we have created a hash table for us to use. This will store items\
    \ for us based on a particular object which is called the key. It turns out to\
    \ be very easy to create a bank storage mechanism based on this:\n\n```\nclass\
    \ HashBank : IBank\n{\n    Hashtable bankHasht = new Hashtable();\n    public\
    \ IAccount FindAccount(string name)\n{\n        return bankHasht[name] as IAccount;\n\
    \    }\n    public bool StoreAccount(IAccount account)\n{\n        bankHashtable.Add(account.GetName(),\
    \ account);\n        return true;\n    }\n}\n```\n\nCode Sample 47 A hash table\
    \ bank\n\nThe Hashtable class can be found in the System.Collections namespace.\
    \ It provides a method called Add which gives the value of the key and a reference\
    \ to the item to be stored on that hash code. It also allows you to use a reference\
    \ (by key in this case name) to locate an item:\n\n```\nreturn bankHashtable[name]\
    \ as IAccount;\n```\n\nWe have to use the \"as\" part of this code as the collection\
    \ will return a reference to an Object. We have to return a reference to an instance\
    \ which the IAccount interface provides. The as is a form of casting (where we\
    \ force the compiler to read an as being of a particular type). It is used in\
    \ preference to the code:\n\n```\nreturn (IAccount) bankHashtable[name];\n```\n\
    \nThe as has the advantage that if bankHashtable[name] does not return an account,\
    \ or returns something of the wrong type, as operator will generate a null reference.\
    \ Since this is just what our call of FindAccount method is expecting this can\
    \ be returned as default. If it is effective (i.e. at runtime) our program will\
    \ fail with an exception.\n\nIt is interesting to note that because we have implemented\
    \ our bank behaviour an interface, we can very easily change the way that the\
