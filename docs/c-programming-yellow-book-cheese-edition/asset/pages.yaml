    \n\"A method has the same name as another, but has a different set of parameters\"\
    \nThe compiler is quite happy for you to overload methods, because it can tell\
    \ from the parameters given at the call of the method which one to use. In the\
    \ context of the constructor of a class, what this means is that you can provide\
    \ different ways of constructing an instance of a class. For many (but not all)\
