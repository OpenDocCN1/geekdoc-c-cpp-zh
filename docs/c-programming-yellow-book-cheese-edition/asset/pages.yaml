  md: '# A Graphical User Interface


    # 5.7 A Graphical User Interface


    The programs that we have written until now use a command line to interact with
    the user. If the computer asks questions, the user types in their responses and
    the computer then processes the response to produce the required answer. We are
    now going over into Graphical User Interfaces.


    A user interface is a posh name for the thing that people actually see when they
    use your program. It comprises buttons, text fields, and pictures that the user
    actually works with to get their jobs done. Part of the job of the programmer
    is to create this "front" and put the appropriate behaviours behind the screen
    to allow the user to drive and get what they want from it. In this section we
    are going out how to create a program that uses a graphical user interface.


    We are creating a Windows Presentation Framework (WPF) application which uses
    a markup language XAML to define the pages that the user sees. This is available
    on the Windows operating system, including Windows Vista, Windows 7 and the Windows
    8 desktop environment. If you want to create RT applications the fundamentals
    are similar but you will need to make some modifications to the XAML files you
    use.


    There is a point in the Wizard of Oz where Dorothy looks at the yellow brick road,
    the munchkins and all says "We''re not in Kansas anymore". We are kind of at this
    point with C#. This section is not really about the programming language C#, it
    is much more about how to create interfaces using XAML as a markup language and
    C# to provide the behaviours. You can create programs that use a XAML based user
    interface using other languages, for example Visual .NET.


    We are going to discover that it is hard to talk about XAML without mentioning
    Visual Studio, the integrated development environment that lets programmers create
    applications which connect a XAML designed interface connected to C# code behind.


    Visual Studio can synchronise the XAML description of a user interface with the
    program code that is connected to it. It also contains editor that can be used
    to design the interface.


    It is perhaps best to regard C#, XAML and Visual Studio as a whole, as are designed
    to work together to make it easy for programmers to create these kinds of applications.


    # Programmer''s Point: Learn how to use Visual Studio


    It is possible to create XAML files and complete applications by writing the text
    files that contain the C# and XAML elements. However, this will take a very long
    time. At this point you should invest some time in learning to use Visual Studio,
    which provides a very rich environment for the creation of programs like this
    will let you drag elements around a surface (if you must touch by hand) and automatically
    create handlers for things like buttons.


    # 5.7.1 The XAML Markup Language


    We are going to use Extensible Application Markup Language (or XAML) which has
    been designed by Microsoft to make it easy to create a good looking interface.
    To understand this we are going to learn a few things about how markup languages
    work. The good news is that this knowledge is extremely useful, lots of modern
    user interface systems work in a similar way.


    XAML is a declarative language. This means that all it can do is give information
    to a computer about stuff. In the case of XAML stuff it is the design of the screen,
    or page that the user sees.'
