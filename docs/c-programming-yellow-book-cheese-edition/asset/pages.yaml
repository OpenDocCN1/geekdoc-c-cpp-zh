    # 4.1 Our Case Study: Friendly Bank


    The bulk of this section is based on a case study which will allow you to see
    the features of C# in a strong context. You are taking the role of a programmer
    who will be using the language to create a solution for a customer.


    The program we are making for a bank, the "United Friendly and Really Nice Bank
    Easy", otherwise known as the Friendly Bank. We will be creating the entire bank
    application using C# and will be exploring the features of C# that make this easy.


    It is unlikely that you will get to implement an entire bank system using your
    professional career as a programmer (although it might be quite fun and rather
    lucrative). However, from a programming point of view it is an interesting problem
    and as we approach it will uncover of techniques that will be useful in other
    programs that you might write.


    # Programmer''s Point: Look for Patterns


    The number of different programs in the world is actually quite small. A lot of
    the things that our bank is going to do (store a large amount of information about
    a large number of individuals, search for a particular person, implement transactions
    that change the content of one or more items in the system) are common to many
    other types of programs, from video games to robots.


    # 4.1.1 Bank System Scope


    The scope of a system is a description of the things that the system is going
    to do. This is also, by implication, a statement of what the system will and not
    do. This is equally important, as a customer will not usually have a clear idea
    of what you are doing and may well expect you to deliver things that you have
    no intention of providing. By setting the scope at the beginning you can make
    sure that there are no surprises later on.


    At the moment we are simply concerned with managing the account information in
    the bank. The bank manager has told us that each customer. This information includes
    their name, address, account number, balance and overdraft value. Other items
    might be added.


    There are many thousands of customers and the manager has also told us that there
    are a number of different types of accounts (and new types of account are invented
    from time to time).


    The system must also generate warning letters and statements as required.


    # BANK NOTES


    At the end of some sections there will be a description of how this new piece
    of C# will affect how we create our bank system. These notes should put the feature
    into a useful context.


    # 4.2 Enumerated Types


    These sound really posh. If anyone asks you what you learned using enumerated
    types and they will be really impressed. Of course they know about programming
    they''ll just say "Oh, you mean you''ve numbered some states".'
