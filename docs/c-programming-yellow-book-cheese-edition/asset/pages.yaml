    # Manipulating Data


    A cast can also lose information in other ways:


    ```

    int i;

    i = (int) 1.999;

    ```


    The code above takes 1.99 (which would be compiled as a value of type double)
    and casts it to int. This discards the fractional part, which means that the variable
    will end up with the value 1 in, even though the original number was much closer
    to a value with a fractional part (float, double, decimal). You should remember
    that this truncation happens whenever you cast from a value to one without it.


    # Casting and Literal Values


    We have seen that you can cast "literal" into your program. These are just values
    you want to use in your calculations. For example, in our double glazing program
    we want to multiply the length width in meters by 3.25 to convert the length to
    feet (there are 3.2 feet in meter).


    C# keeps careful of the things that it is combining, and this includes how it
    allows values to be used. This is by statements like:


    ```

    int i;

    i = 3.4 / "stupid";

    ```


    +   - will be converted to the type they richly deserve. The C# compiler knows
    that it is daft to divide the value 3.4 by the string "stupid". However, consider
    this:


    ```

    float x;

    x = (float) 3.4;

    ```


    This code looks perfectly. However, it is not. Because the literal 3.4 is a double
    precision value when expressed as a literal, and the variable x has been declared
    as a floating point. If you want to put a floating point literal value into a
    floating point variable i can use:


    ```

    float x;

    x = (float) 3.4;

    ```


    This casts the double literal into a floating point value, so that the assignment
    works.


    To make easier the C# have added a different way we can assign a floating point
    literal value in a program. If you put an f after the value this is regarded as
    a floating point value. This means:


    ```

    float x;

    x = 3.4f;

    ```


    +   - would compile correctly.


    # 2.2.8 Types of Data in Expressions


    When C# uses an operator, it makes a decision as to the type of the result is
    to be produced. Essentially, if the two operands are integer it says that the
    result should be integer. If the two are floating point it says that the result
    should be floating point. This can lead to problems, consider the following:


    ```

    1/2

    1/2,0

    ```


    You might think that this would give the same result. Not so. The compiler thinks
    that the first expression, which involves only integers, should give an integer
    result. It would evaluate this to the integer value 0 (the fractional part is
    always truncated). The second expression, because it involves a floating point
    value would be evaluated to give a double precision floating point result, the
    more accurate answer of 0. S.


