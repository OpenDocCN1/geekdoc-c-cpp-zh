  md: "# Using streams\n\nA better solution is to give the save method a stream to\
    \ save itself, rather than a filename. A stream is the thing that the C# library\
    \ creates when we open a connection to a file:\n\n```\nSystem.IO.TextWriter textOut\
    \ =\nnew System.IO.StreamWriter(\"Test.txt\");\n```\n\nThe reference textOut returns\
    \ to a stream which is connected to the file.txt. We can create a method which\
    \ accepts the stream reference as a parameter instead of:\n\n```\npublic void\
    \ Save (System.IO.Textwriter textOut)\n{\n    textOut.WriteLine(name);\n    textOut.WriteLine(balance);\n\
    }\n```\n\nThis method can be called from our original file save method:\n\n```\n\
    public bool Save (string fileName)\n{\n    System.IO.Textwriter textOut = null;\n\
    \    try\n    {\n        textOut = new System.IO.StreamWriter(fileName);\n   \
    \     Save(textOut);\n    }\n    catch\n    {\n        return false;\n    }\n\
    \    finally\n    {\n        if (textOut != null)\n        {\n            textOut.Close();\n\
    \        }\n        return true;\n    }\n}\n```\n\nThis method creates a stream\
    \ and then passes it to the same method to save the item. Note that this is an\
    \ example of overloading in that we have two methods which share the same name.\n\
    \nThe load method for our bank account can be replaced by one which has in a similar\
    \ way.\n\n```\npublic static CustomerAccount Load(\nSystem.IO.TextReader textIn)\n\
    {\n    CustomerAccount result = null;\n    try\n    {\n        string name = textIn.ReadLine();\n\
    \        string balanceText = textIn.ReadLine();\n        decimal balance = decimal.Parse(balanceText);\n\
    \        result = new CustomerAccount(name, balance);\n    }\n    catch\n    {\n\
    \        return null;\n    }\n    return result;\n}\n```"
