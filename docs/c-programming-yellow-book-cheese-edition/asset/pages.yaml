    # 2.3 Writing a Program


    The programs that we have created until now have been very simple. They just read
    data, in so much and then print out the result. However, we will need to create
    programs which are more complex than this. They may have to make a decision based
    on the data which they are given. They may need to repeat things until something
    is true. They may need to read in a large amount of data and then process in a
    number of different ways.


    In this section we are going to consider how we can write our programs that extra
    level of complexity, and look at the general best of writing programs.


    # 2.3.1 Software as a story


    Some people say that writing a program is a bit like writing a story. I''m completely
    convinced that this is true. I have found that some computer manuals are of fiction,
    but programs are something else. I think that while it is not a story as such,
    a good program does have the characteristics of good literature:


    +   - It should be easy to read. At no point should the reader be forced to backtrack
    or brush on knowledge that the writer assumes names is. All the names in the text
    should be meaningful and distinct from each other.


    +   - It should have good punctuation and grammar. The variables should be organised
    in a clear and consistent way.


    +   - It should look good on the page. A good program is well laid out. The different
    blocks should be indented and the statements spread over the page in a well formed
    manner.


