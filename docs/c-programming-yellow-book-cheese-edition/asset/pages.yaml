  md: '# Advanced Programming


    # A Graphical User Interface


    These declarations are created automatically when the program is built and so
    do we need to actually worry about the above statement. We just have to remember
    that this is how the program works. Note that not all the elements in my interface
    have names, there is no point in giving a name to the TextBlock that holds the
    "-” character as I will never need to interact with this when the program runs.


    # Properties in Elements


    Once we have our TextBox a variable name we can move on to give it the properties
    that are required for this application. We can also change properties for the
    textbox including the width of the textbox, the margin (which is set) and so on.


    When we talk about the "properties" of Silverlight on the page (for example the
    text displayed in a TextBox) we are actually talking about property values in
    the class that implements the TextBlock. In other words, when a program contains
    a statement such as:


    ```

    resultTextBlock.Text = "0";

    ```


    +   - This will cause a Set method to run inside the resultTextBlock object which
    has the text on the TextBox to the appropriate value.


    You may be asking Why do we use properties in XAML? It makes sense to use them
    in a bank account where I want to protect the data inside my objects but in a
    XAML page, where I can put any text like a TextBox, there seems no validation
    of the incoming value. In fact running this will slow the setting process. By
    making the Text a value string we could make the program smaller and faster, and
    which has to be a good thing?


    Well, sort of. Except when we change the text on the XAML page in front of the
    user to change as well. This is how adding machine will display the result. If
    a program just changed the value of a member there would be no way the XAML system
    could know that the message on the screen needs to be updated.


    However, if the member is a property when a program runs in the TextBox will get
    to run. The code in the set behaviour update the stored value of the text field
    and it can also trigger an update of the display to make the new value visible.
    Properties provide a means by which an object can control when a value inside
    the object is being changed, and this is extremely important. The simple example:


    ```

    resultTextBlock.text = "0";

    ```


    +   - may cause hundreds of C statements to run when the new value is stored in
    the TextBlock and an update of the display is triggered to make the screen change.


    # Page Design with XAML


    XAML turns to be very useful. Once you get the help of information used to describe
    properties it turns out to be much quicker to add things to a page and move them
    about by just editing the text in the XAML file, rather than dragging around or
    moving property values. I found it particularly useful when I want a large number
    of similar elements on the screen. Visual Studio is aware of the syntax used to
    describe each type of element and will provide Intellisense help as you go along.


    If you read up the XAML specification you will find that can give elements graphical
    properties that can make them transparent, add images to their backgrounds and
    even move them around the screen. This at point we have moved well beyond programming
    and entering the realm of graphic design. And I wish you the best of luck.'
