    As I said above, some faults are just plain finding bugs. Here are some tips:

    Don''t make any assumptions. If you assume that "the only way it could get here

    through this sequence" or "there is no way that this piece of code could be obeyed",

    y will often be wrong. Rather than make assumptions, add extra code to prove that

    you think it is really happening.


    # Talk to the Duck


    Explain the problem to someone else - even if it is the cat or rubber duck! The
    act

    of explaining the problem can often lead you to deduce the answer. It is best
    if the

    person you are talking to is highly skeptical of your statements.

    Look at all (if seemingly unrelated) factors in the manifestation of the bug.

    This is particularly important if the bug is intermittent. If the bug appears
    on Friday

    afternoons on your UNIX system, find out if another department uses the machine
    to

    do a payroll at that time and fills up the scratch space, or the loading department

    un the big honest and inject loads of noise.

    Leave the problem alone for a while. Go off and do something different and you

    find that the answer will just appear. Alternatively you may find the answer as
    soon

    y come back to the problem.

    Remember that although the bug is of course impossible, it is happening. This
    means

    that the impossible is happening, or one of your assumptions that is impossible
    is

    wrong!


    Can you get back to a state where the bug was not present, and then look at the
    changes

    made since? If the system is failing as result of a change, or ever fixed, a bug,
    you

    try to move back to a point where the bug is not there, and then introduce the
    changes

    until the bug appears. Alternatively, look carefully at how the introduction of
    the

    feature affects other modules in the system. A good Source Control System is

    very valuable, in that you can easily check what changes were made from

    one version to the next.


    One thing that I should make clear is that the process of debugging is that

    of fixing faults in a solution which should work. In other words you must know
    what

    the program is supposed to do before you try and fix problems with what it actually

    is. I have been nearly moved to the sight of putting in loop or

    changing the way their conditions operate to "see if this will make the program

    work". Such efforts are always doomed, just like throwing a bunch of electrical

    components at the wall and expecting a DVD player to land on the floor is also
    not

    going to work.


    # Rip it up and start again


    In some projects it is possible that the effort involved starting is less than

    trying to find out what is wrong with a broken solution that you have created.
    If you

    have some time off from debugging, explained the code to a friend and checked

    all your assumptions then maybe, just maybe this might be the best way forward.


