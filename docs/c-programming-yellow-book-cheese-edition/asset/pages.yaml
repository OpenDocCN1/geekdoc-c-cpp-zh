  md: "# Creating Programs\n\n# Variables and Scope\n\nchunk of memory is used to\
    \ hold the value and it also makes sure that we only ever use that correctly.\
    \ The C# compiler also looks for the part of a program within which variable has\
    \ an existence. This is called the scope of a variable.\n\n# 3.2.1 Scope and blocks\n\
    \nWe have already seen that a block is a number of statements which are enclosed\
    \ in curly brackets. Any block can contain any number of local variables, i.e.\
    \ variables which are local to that block.\n\nThe scope of a local variable is\
    \ the block within which the variable is declared. As far as the C# language concerns\
    \ you can declare a variable at any point in the block, but you must declare it\
    \ before you use it. When the execution of the program moves outside a block all\
    \ local variables which declared are automatically discarded. The methods that\
    \ we have created often contained local variables; the variable result in the\
    \ readonly method is local to the method.\n\n# 3.2.2 Nested Blocks\n\nWe have\
    \ seen that in C# the programmer can create blocks inside blocks. Each of these\
    \ nested blocks has its own scope of variables:\n\n```\nint i;\n{\n    int j;\n\
    }\n```\n\nThe variable j has the scope of the inner block. This means that only\
    \ statements in the inner block can use this variable. In other words the code:\n\
    \n```\nint i;\n{\n    int j;\n    j = 99;\n}\n```\n\n- would cause an error, as\
    \ the variable j does not exist at this point in the program.\nin order to keep\
    \ you from confusing yourself by creating two versions of a variable with the\
    \ same name, C# has an additional rule about the variables in the inner blocks:\n\
    \n```\nint i;\n{\n    int i;\n}\n```\n\nThis is not a valid program because C#\
    \ does not let a variable in an inner block have the same name as one in an outer\
    \ block. This is inside the inner block there is the possibility that you use\
    \ the \"inner\" version of i when you intend to use the outer one. In order to\
    \ remove this possibility the compiler refuses to allow this. Note that this is\
    \ in contrast to the situation in other languages, for example C++, where this\
    \ behaviour is allowed.\n\nIt is however perfectly acceptable to reuse a variable\
    \ name in successive blocks because in this situation there is no way that one\
    \ variable can be confused with another."
