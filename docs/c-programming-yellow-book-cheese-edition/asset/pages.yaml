  md: "that the bank has many lists of customers. It will have a list of all the customers,\
    \ with a list of \"special\" customers and perhaps another list of those who owe\
    \ the money. So, an item \"in\" the arraylist is never actually in it, the list\
    \ actually contains a reference to it. When an item is removed from an arraylist,\
    \ it is not necessarily destroyed; it is just longer on that.\n\n# Accessing Items\
    \ in an ArrayList\n\nItems in arraylists can be accessed in the same way as array\
    \ elements, but with a tricky twist. It would be very nice if we could just get\
    \ hold of the account from the arraylist and use it.\n\n```\nAccount a = store[0];\n\
    a.PayFunds(50);\n```\n\nUnfortunately this will not work. If you write this code\
    \ you will get a compilation error. The reason for this is that an arraylist holds\
    \ a list of object references. If you do this, it is only the type of object it\
    \ could hold. The designer of the ArrayList has no idea what type of object a\
    \ programmer will want to use with and so how to use the object reference.\n\n\
    You will not remember from the discussion of object hierarchies that an object\
    \ reference can refer to an instance of any class (since they are all derived\
    \ from object) and so that is the only kind of reference that the arraylist works.\n\
    \nThis is not actually a huge problem, because a program can use a cast to change\
    \ the type of the arraylist returns.\n\n```\nAccount a = (Account) store[0];\n\
    a.PayFunds(50);\n```\n\nThis would get the element at the start of the arraylist,\
    \ cast it into an Account class and then pay fifty into it.\n\nA larger problem\
    \ is that the arraylist is not typesafe. This means that we can't be sure that\
    \ an arraylist gives us nothing other than accounts in:\n\n```\nKitchenSink k\
    \ = new KitchenSink();\nstore.add(k);\n```\n\nThis puts a reference to a KitchenSink\
    \ instance into our bank storage. This will cause problems (and maybe an exception)\
    \ if we try to use it as an Account. To get a properly typesafe storage we have\
    \ to take a look at generics in a bit later.\n\n# Removing Items from an ArrayList\n\
    \nIt is not possible to remove items from an arraylist, but the arraylist provides\
    \ a very useful Remove behaviour. This is given a reference to the thing to be\
    \ removed:\n\n```\nstore.remove(obsAccount);\n```\n\nThis removes the first occurrence\
    \ of the reference obsAccount from the store arraylist. If the store contained\
    \ more than one reference to account then each of them could be removed individually.\
    \ Note that if the reference is not actual in the arraylist (i.e. if you run the\
    \ code above which did not contain obsAccount) this does not cause an error. If\
    \ you remove an item size of the arraylist is decreased.\n\nYou can use the count\
    \ property to find how many items are in the list:\n\n```\nif (store.Count ==\
    \ 0)\n{\n    Console.WriteLine(\"The bank is empty\");\n}\n```"
