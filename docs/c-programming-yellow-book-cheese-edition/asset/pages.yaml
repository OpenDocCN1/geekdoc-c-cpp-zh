  md: "# Creating Solutions\n\n# From Object to Component\n\nAny main board which\
    \ contains a socket built to the standard can accept a graphics card.\n\nSo, from\
    \ the point of view of hardware, components are possible because we have created\
    \ standard interfaces which describe exactly how they fit together.\n\nSoftware\
    \ components are exactly the same.\n\n# Why we Need Software Components?\n\nAt\
    \ the moment you might not see a need for software components. When we are creating\
    \ a system we work out each of the parts of it needs to do, and then create those\
    \ parts. It is not obvious at this stage components are required.\n\nWell, a system\
    \ designed without components is exactly like a computer with a graphics adapter\
    \ which is part of the main board. It is not possible for me to improve the graphics\
    \ adapter because it is \"hard wired\" into the system.\n\nHowever, it is unfortunately\
    \ the case that with our bank system we may have a need to create different forms\
    \ of bank account For example, we might be asked to create a \"BabyAccount\" class\
    \ which only the account holder draw out up to tens each time. This might happen\
    \ even after we have installed the system and it is being used.\n\nIf everything\
    \ has been hard wired into place this will be impossible. By describing objects\
    \ in terms of their interfaces we can use any which behaves like an Account in\
    \ this position.\n\n# 4.8.2 Components and Interfaces\n\nOne point I should make\
    \ is that we are not talking about the user interface to our program. The user\
    \ interface is the way a person using our program would it work for them. These\
    \ are either text (the user types in commands and gets) or graphical (the user\
    \ clicks on \"buttons\" on a screen using the mouse).\n\nAn interface on the other\
    \ hand just specifies how a software component could be used by another software\
    \ component. Please don't be tempted to answer an question about the Cf interface\
    \ mechanism with a long description of how windows and buttons work. This will\
    \ earn you zero marks.\n\n# Interfaces and Design\n\nSo, starting off by designing\
    \ classes we should be thinking about their interfaces, i.e. what they have to\
    \ do. In C# we express this information in a called called interface. An interface\
    \ is a simple set of method definitions which are lumped together.\n\nOur first\
    \ pass at a bank account interface could be as follows:\n\n```\npublic interface\
    \ IAccount\n{\n    void PayInFunds (decimal amount);\n    bool WithdrawFunds (decimal\
    \ amount);\n    decimal GetBalance();\n}\n```\n\nThis says that the IAccount interface\
    \ is comprised of three methods, one to pay money; another to withdraw it and\
    \ a third which returns the balance on the account. From the balance management\
    \ point of view this is all we need. Note that at the interface level I am not\
    \ saying how it should be done, I am just saying what should be done. An interface\
    \ is found in a source file just like a class, and compiled in the same way. It\
    \ sets out a number of methods which relate to a particular task or role, in this\
    \ case what a class must do to be considered a bank account.\n\nC# Programming\
    \ Rob Miles 2016\n\n110"
