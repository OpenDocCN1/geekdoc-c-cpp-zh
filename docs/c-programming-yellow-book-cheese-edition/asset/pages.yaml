    # Operands


    Operands are the operators they work on. They are usually literal values or the
    identifiers of variables. In the program above first, second, third are identifiers
    and 2 is a literal value. A literal value is something which is literally in the
    code. A literal value has a type associated with it by the compiler.


    # Operators


    Operators are the things who do the work: They specify the operation to be performed
    on the operands. Most operators work on two operands, each one side.


    Here are a few examples:


    ```

    2 + 3 * 4

    -1 + 3

    (2 + 3) * 4

    ```


    These expressions are worked out (evaluated) by C# moving from left to right,
    just as you would yourself. Again, as in traditional mathematics all the multiplication
    and division is performed first in an expression, followed by the addition and
    subtraction.


    C# does this giving each operator a priority. When C# works out an expression
    it looks for all the operators with the highest priority and does them first.
    It looks for the next one and so on until the final result is obtained. Note that
    this means that the first expression above will therefore return 14 and 20.


    If you want to force the order in which things are worked out you can put brackets
    around the things you want done first, as in the final example. You can put inside
    brackets if you want, provided you make sure that you have as many open as close.
    Being a simple I tend to make things very clear by putting brackets around everything.


    It is probably worth getting too into about evaluation as people call it; generally
    speaking tend to be worked out how you would expect them.


    For completeness here is a list of all operators, what they do and their precedence
    (priority). I am listing the operators with the highest priority.


    | unary minus, the minus that C# finds in negative numbers, e.g., -1. Unary minus
    means applying to only one item |\| multiplication, note the use of the * rather
    than the more mathematically correct but confusing |

    | division, because of the difficulty of dividing one number another on a screen
    we use this character instead |

    | Addition |

    | subtraction. Note that we use exactly the same character as for unary minus.
    |


    This is not a complete list of all the operators available, but it will do for
    now. Because these operators work on numbers are often called the numeric operators.
    But of course you should remember that some of them (for example +) can be used
    between other types of data as well. It is also possible to use operators in a
    way which causes values to be moved from one type to another. This can cause problems
    as we will see now.


