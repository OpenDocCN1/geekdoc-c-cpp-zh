  md: "# 3.3.5 Arrays and Lookup Tables\n\nArrays make great lookup tables. They provide\
    \ a neat way of going from a number to something else. For example, you might\
    \ want to print out the name of the month, from the month value. You could do\
    \ this by using tests:\n\n```\nint monthNo = 1;\nstring monthName;\n\nif (monthNo\
    \ == 1)\n    monthName = \"January\";\n\nif (monthNo == 2)\n    monthName = \"\
    February\";\n```\n\nThis would be tedious to write. A better way would be to use\
    \ an array of strings. Then you could do something like this:\n\n```\nmonthName\
    \ = monthNames[monthNo];\n\nstring[] monthNames = new string[13];\n```\n\nFor\
    \ this to work we would need to make sure that each of the elements in the monthNames\
    \ array would hold the name of the month.\nSo we would have to set up before we\
    \ use the lookup table:\n\n```\nmonthNames[1] = \"January\";\nmonthNames[2] =\
    \ \"February\";\n```\n\n# Programmer's Sometimes: When is it OK to \"waste\" element\
    \ 0\n\nIf you have followed the text carefully up to now you will have spotted\
    \ something odd here. I say that arrays are indexed at 0, in other words the element\
    \ at the start of the array will have the subscript of zero, which I should really\
    \ be putting the string \"January\" into monthNames{0}. This is true if I want\
    \ to make the most efficient use of our storage, but it does make my program harder\
    \ to handle, and whenever I want to decode a month value (which goes from 1 to\
    \ 12) I will have to subtract 1 from the value. In this case I reckon is feasible\
    \ to create an array that is larger than required (so that the subscripts range\
    \ from 0 to 13) and then index the element at the start.\n\nA programming just\
    \ might point out that if a program tries to use the element at the base of the\
    \ array names (the one with subscript 0) is in danger of creating an invalid month\
    \ value. We can guard this by making the first element null before using it:\n\
    \n```\nmonthNames[0] = null;\n```\n\nThis means that the code ever tries to use\
    \ this in the array it will throw an exception and stop. If the purist continues\
    \ to complain that this might lead my program misbehaving then we can ask them\
    \ to consider the effect of leaving off the \"month minus one\" part and the program\
    \ would continue to run. I'd rather have a program explode in a shower of sparks\
    \ and flames than do the wrong thing.\n\nOf course, it looks like we have exchanged\
    \ one of tediousness (doing lots of tests to get the month string) with another\
    \ (initialising lots of array). However, it is that C# has a really neat way that\
    \ you can set the elements in an array.\n\n```\nstring[] monthNames = new string[]\n\
    {\n    null, // element for non existent month 0\n    \"January\", \"February\"\
    , \"March\", \"April\",\n    \"May\", \"June\", \"July\", \"August\",\n    \"\
    September\", \"October\", \"November\", \"December\"\n};\n```\n\nA program can\
    \ contain a list of initialisations which are then used to create an array with\
    \ the correct content. Note that the initialisation itself will work out"
