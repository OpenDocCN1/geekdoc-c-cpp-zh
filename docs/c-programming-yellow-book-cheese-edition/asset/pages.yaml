    \ classes when I change the CustomerAccount class (perhaps to add a new field\
    \ called customerPIN) I also have to update the Load method in the BabyAccount\
    \ class to make sure that extra data is loaded. If I forget to do this the program\
    \ will compile, but when it runs it not work correctly.\n\nWhat we really want\
    \ is to make the CustomerAccount responsible for loading its data and the BabyAccount\
    \ look after its content, in a similar way to what the save method uses the base\
    \ to save the parent object.\n\nThe way to do this is to go back to the construction\
    \ process. We know that a constructor is a method which constructs an instance\
    \ of a class is being created. A constructor can be used to set up the data in\
    \ the instance, and it can be passed information to allow it to do this. In the\
    \ code above there a constructor for the BabyAccount class which accepts the three\
    \ data items that the BabyAccount holds and then sets the instance with values.\n\
    \nWhat do we create constructors for CustomerAccount and BabyAccount classes that\
    \ read their information from a stream that are supplied to:\n\n```\npublic BabyCustomerAccount(System.IO.TextReader\
    \ textIn)\n{\n    name = textIn.ReadLine();\n    string balance = textIn.ReadLine();\n\
    \    balance = decimal.Parse(balanceText);\n}\n```\n\nThis constructor sets up\
    \ the new CustomerAccount instance by reading the values from the stream that\
    \ it is supplied. If we can write code like this:\n\n```\nSystem.IO.TextReader\
    \ textIn =\n    new System.IO.StreamReader(filename);\n    result = new CustomerAccount(textIn);\n\
    \    textIn.Close();\n```\n\nThis creates a new CustomerAccount from the stream.\
    \ Now I can create a constructor for the BabyAccount which uses the constructor\
    \ of the parent class:\n\n```\npublic BabyAccount(System.IO.TextReader textIn)\n\
    {\n    base(textIn);\n    parentName = textIn.ReadLine();\n}\n```\n\nThis removes\
