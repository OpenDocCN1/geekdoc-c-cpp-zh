    # The power of strings and chars


    # Passing a reference to yourself to other classes


    Another use for this is an instance class needs to provide a reference to itself
    to another class that wants to use it. A new bank account could store itself in
    a bank by passing a reference to itself to a method that will store it:


    ```

    bank.Store(this);

    ```


    When the Store method is called it is a reference to the currently executing account
    instance. The Store method accepts this and stores it somehow. of course, in this
    situation we are not passing an account into the bank, instead we pass a reference
    to the account.


    If this hurts your head, don''t worry about it for.


    # Confusion with this


    I reckon using this is a good idea. It means that people reading my code can tell
    instantly I am using a local variable or a member of the class. However it might
    take a bit of getting used. If I have a member of my class which contains methods,
    and I want to use one of them, I would writing code like this:


    ```

    this.account.SetName("Rob");

    ```


    This means "I have a variable in this class called. Call the SetName method on
    member to set the name to "Rob".


    # 4.11 The power of strings and chars


    It is probably worth spending a few moments considering the string type in a bit
    detail. This is because you get a lot of extra features which will save you a
    lot of work. They are exposed as methods which can call on a string reference.
    The methods return a new string, transformed in the way that you want. You can
    sort out the case of, trim spaces from the start and end cut sub-strings using
    these methods.


    # 4.11.1 String Manipulation


    Strings are rather special. I regard them as bit like bats. A bat can be regarded
    as either an animal or a bird in many respects. A string can be regarded as an
    object (referred to by means of a reference) or a value (referred to as a value).


    This hybrid behaviour is provided because it makes things easier for programmers.
    However does not mean that we we treat strings as a bit special when we are learning
    to program, because they seem to break some of the rules that we have learned.


    It is very important you understand what happens when you transform a string.
    This is the time, although strings are objects, they don''t actually behave like
    objects all the time.


    ```

    string s1="Rob";nstring s2=s1;

    s2 = "different";

    Console.WriteLine(s1 + " + " + s2);

    ```


    If you know about objects and references, you should be expecting s1 to change
    when s2 is changed. The second statement makes the s2 refer to the same object
    as s1, so changing s2 should change the object that s1 refers to well. To find
    out more about this, take a look at section 4.4.1.


    This does not happen though, because C# regards instance of a string type in a
    special way. It calls it immutable. This is because programmers want strings to
    behave a bit like values in this respect.


    C# Programming © Rob Miles 2016


