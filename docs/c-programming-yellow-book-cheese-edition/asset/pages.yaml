  md: '# BANK NOTES: MORE THAN ONE INTERFACE


    The bank may have a wide range of requirements for editing account details. These
    will range from an operator in a call centre, an operator on a day terminal, a
    customer on a mobile phone and a customer at a cash machine. I hope that you can
    see that the only way to manage all these different ways of interacting with the
    bank account is to separate the business object (the account itself) from the
    input/output behaviour.


    Note that we do not allow things like the user interface to decide what constitutes
    a valid name. This question is not the responsibility of the front end. The only
    thing that can decide on the validity of a name is the account object itself.
    The user interface must always work on the basis that it will use the business
    object to perform this kind of validation.


    # 5.4 Threads and Threading


    If you want to call yourself a proper programmer know something about threads.
    They can make programs much easier to create, but they can also be the source
    of nasty bugs. In the future, where the speed of computer processors is limited
    by things like the speed of light and the size of atoms, they are the way that
    we will be able to keep on improving the performance of our computer systems.


    # 5.4.1 What is a thread?


    At our moment we are only using a single thread when you run. The thread usually
    starts in the Main method and finishes when this of method is reached. You can
    envisage a thread as a train running along a track. The track is the statements
    that the thread is executing. In the same way that can put more than one train
    on a single track, a computer can run more than one thread in a single block of
    program.


    A computer can support multiple threads in two ways. The first is by rapidly switching
    between active threads, giving each thread the chance to run for a limited time
    before moving on one another. When a thread is not running it is held in a “frozen”
    state, waiting for its turn. As far as the thread is concerned it is running may
    only be active for a fraction of a second every now and then.


    The second way to support multiple threads is to actually have more than one processor.
    The first computers had only one processor and were forced to use “time slicing”
    to support multiple threads. Newer machines now have “dual core” or “quad core”
    processors which actually run multiple threads simultaneously.


    # 5.4.2 Why do we have threads?


    Threads make it possible for your computer to do something useful while one program
    is held up. Your system can play music and download files while your program waits
    for you to press the next key. A modern computer can perform millions of instructions
    per second; it makes sense to share among several tasks.


    The programs that you have written and running have all executed in your computer.
    This is how your program can be active at the same time as other programs you
    wish to use alongside it. You have not been aware of this the operating system
    (usually Windows) does a very good job of sharing the processing power.


    Threads provide another level of “abstraction”, in that is if we wish to do more
    than at the same time it is very useful to send a thread off to perform the task,
    rather than interleaving the second task with the first. If we wrote a processor
    we might find it useful to create threads to perform time consuming tasks like
    printing or spell checking. This could be performed “in the background” while
    the user continues to work on the document.'
