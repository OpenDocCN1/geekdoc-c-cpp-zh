    \ that can hold 100 accounts. It creates a new account and stores it in the bank.\
    \ It searches for name and finds it.\n\n# 4.13.2  Searching and Performance\n\n\
    The solution will work fine, and could be used as the basis of a bank. However,\
    \ it becomes very slower as the size of the bank increases. Each time we add a\
    \ new account the searching gets slower as the FindAccount method must look through\
    \ more and more items to find it. A bank with only fifty accounts is not a problem,\
    \ but if there are thousands of accounts this simple search will be too slow.\n\
    \n# 4.13.3  Storing Accounts using a Hash Table\n\nFortunately for us we use a\
    \ device called \"hash table\" which allows us to easily find items based on a\
    \ key. This is much faster than a sequential search, since it uses a technique\
    \ which will suit to the required item.\n\nThe idea is that we are doing mathematical\
    \ (\"h\") to the information in the search property to generate a number that\
    \ can be used to identify the location where the data is stored.\n\nFor example\
    \ we take all the letters in the account name, look up the ASCII code for each\
    \ letter and add these values up. The name \"Rob\" could be reduced to 82+111+98\
