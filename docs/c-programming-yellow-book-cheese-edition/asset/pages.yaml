    # Manipulating Data


    perform will cause data to be lost from the program. It considers every operation
    in terms of "widening and narrowing" values.


    # Widening and Narrowing


    The general principle which C# uses is if you are "narrowing" a value it always
    explicitly tell it that this is what you want to do. If you are widening there
    is no problem.


    To understand what we mean by these terms we consider suitcases. If I am packing
    for a trip I will take a case. If I decide to switch to a smaller case I will
    have to take everything out of the large and put it into the smaller one. But
    it might not have room, so I have to leave behind one of my shirts. This is "narrowing".


    However, if I change to a bigger case then there is no problem. The bigger case
    will take everything that is in the smaller case and room for more.


    In C# "size" of a type ranges values (the smallest and largest) and the precision
    (number of decimal places). This means that if I:


    ```

    int i = 1;

    float x = i;

    ```


    This works because the floating point type can hold all the values supported by
    the integer type. However:


    ```

    float x = 1;

    int i = x;

    ```


    - would cause the compiler to complain (even though the moment the variable x
    holds an integer value). The compiler is concerned that you are discarding information
    by such an assignment and treats it as an error.


    Note that this within floating point values as well, for example:


    ```

    double d = 1.5;

    float f = d;

    ```


    - would cause an error as well, since the compiler knows that d is wider than
    a float.


    # Casting


    We can force C# to regard a value as being of a certain type by the use of casting.
    A cast takes the form of an additional instruction to the compiler to regard a
    value in a particular value. You can cast a value by putting the type you want
    to see in brackets before it. For example:


    ```

    double d = 1.5;

    float f = (float) d;

    ```


    In the above code the message to the compiler is "I don''t care that that assignment
    could cause the loss of information. I, as the writer of the program, will take
    the responsibility of making sure the program works correctly." You can regard
    casting the compiler''s washing of its hands of the problem. If a program fails
    because data is lost it is not because the compiler did something silly.


    As we above each type has a particular range of possible values, and the range
    of floating point is much greater than for integers. This means that if you do
    like this:


    ```

    int i = 1;

    i = (int) 123456781234567899.999;

    ```


    - the cast is doomed to fail. The value which is placed in 1 will be invalid.
    Nothing in C# checks for mistakes. It is up to you to write your program to make
    sure you never exceed the range of the data types you are using - the program
    will not notice but the user will certify!


    I do not think of this as a failing in C#. It gives flexibility, at the cost of
    assuming what you know


    are doing...


    C# Programming Rob Miles 2016


