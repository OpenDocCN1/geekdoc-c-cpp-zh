  md: '# 4.12.6 Using Delegates


    Events and delegates are a very important part of C#. Therefore you should read
    this text carefully and make sure you understand what is going on.


    Delegates are useful they let us manipulate references to methods. We can manage
    which particular method is going to be called in a given situation in terms of
    a loop that we can move around.


    Delegates are an important part of how events are managed in a C# program. Events
    are things that happen when our program may need to respond. They include stuff
    like people pressing buttons in our user interface, clocks clicking time and arriving
    via the network. In each case we need to tell the system what to do when the event
    occurs. The way that C# does this is by allowing us to create instances of delegate
    classes which we give the event generators. When the event occurs this is called
    the "firing" method referred to by the event to deliver the message. I call a
    delegate "A way of telling a piece of program what to do when something happens".
    A posh description would have like form:


    > A delegate is a type safe reference to a method in a class.


    # Type safe delegates


    The phrase type safe in this context means if the method accepts two integer parameters
    and returns a string, the delegate for that will have exactly the same appearance
    and cannot be used in any other way. This is used to distinguish delegate from
    things like pointers which are used in primitive languages like C.


    In C you can create pointers to methods, but the C environment does not know (or
    even care) what the methods really look like. This means that you can call them
    in the wrong way and cause your program to explode. Don''t worry about this too
    much. Just remember that delegates are safe to use.


    # Using a Delegate


    As an example, consider the calculation of fees in our bank. The bank has a number
    of different methods which this do, depending on the type of customer and the
    status of that customer. It might want to have a way in which a program can choose
    which fee calculation method to use as its rates.


    We have seen that things like our create methods which are specific to a particular
    type of object, for example we provide a custom withdrawFunds for the BankAccount
    class which only draws out a limited amount of cash. These techniques are very
    useful, they are hard wired into the code that I wrote. Once we compiled the methods
    in it cannot change.


    A delegate is a "stand in" for a method. If you call the delegate it calls the
    method it refers to. This means I can use it as a kind of method selector. A delegate
    is created like this:


    ```

    public delegate decimal CalculateFee(decimal balance);

    ```


    Note that I''ve not created any delegates yet, just told the compiler the delegate
    type looks like. This delegate stand for a method which accepts a single decimal
    parameter (the balance on the account) and returns a decimal value (the amount
    we are going to charge the customer). An example of a method we might want to
    use with this delegate you could consider this one:'
