  md: '# BANK NOTES: OVERRIDING FOR FUN AND PROFIT


    The ability to override a method is very powerful. It means that we can make more
    general classes (for example the CustomerAccount) and customised to make it more
    specific (for example the BabyAccount). Of course this should be planned and managed
    at the stage. This calls for metadata to be gathered from the customer and to
    decide which parts of the behaviour need be changed during the life of the project.
    We would have the WithDrawFunds method virtual because the manager would have
    said "We like to customise the way that some accounts withdraw funds." And we
    would have written this down in the specification.


    # 4.9.3 Using the base method


    Remember that programmers are essentially lazy people who try to write only once
    for a problem. Well, it looks as if we are overriding our own rules here, that
    the WithDrawFunds method in the BabyAccount contains all the code of the method
    in the parent class.


    We have already noted that we do not like this, in that it means that the balance
    value has to be made more exposed than we might like. Fortunately the designers
    of C# have thought of this and provided a way that you can use the base method
    when one overrides it.


    The word base in this context means "a reference to the thing which has been overridden".
    I can use this to make the WithDrawFunds method in my BabyAccount much simpler:


    Code Sample 40 Overriding the base method


    The very line of the WithDrawFunds method makes a call to the original WithDrawFunds
    method in the parent class, i.e. the method that one overrides.


    It is important to understand what I''m doing here, and why I''m doing it:


    +   - I don''t have to write the same code twice

    - I don''t want to make the balance value visible outside the CustomerAccount
    class.


    Use of the word base to call the override solves both of these problems rather
    beautifully. Because the method returns a bool I can just send whatever it delivers.
    By making this change I can put the balance back to private CustomerAccount because
    it is not changed out.


    Note that there are other useful spin-offs here. If I need to fix the behaviour
    of the WithDrawFunds method I just fix it once, in the top class, and it is fixed
    for all the classes that call back to.


    # 4.9.4 Making a Replacement Method


    This is bit painful, but don''t worry too much since it actually makes sense when
    you think about it. If you play around with C# you will find out that you''actually
    seems to need the virtual keyword to override a method. If I leave it out (and
    the override (too)) the program seems to work fine.'
