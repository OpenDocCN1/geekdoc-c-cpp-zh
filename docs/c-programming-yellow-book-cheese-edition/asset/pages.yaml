  md: '# 1 Computers and Programs


    In this chapter you are going to find out what a computer is and get an understanding
    of the way that a computer program tells the computer what to do. You will discover
    what you should do when starting to write a program, to ensure you achieve a “happy
    ending” for you and your customer. Finally, you will take a look at programming
    in general and the C# language in particular.


    # 1.1 Computers


    Before we consider programming, we are going to consider computers. This is an
    important thing to do, because it sets the context in which all the issues of
    programming itself are placed.


    # 1.1.1 An Introduction to Computers


    +   - Why does a bee hum?

    Ans: Because it doesn''t know the words!


    One way of describing a computer is an electric box with whims. This, while technically
    correct, can lead to significant amounts of confusion, particularly among those
    who try to program a fridge. A better way is to describe it as:


    > A device which processes information according to instructions it has been given.


    This general definition rules out fringes but is not exhaustive. However, for
    our purposes it will do. The instructions you give to the computer are often called
    a program. The business of using a computer is often called programming. This
    is not what most people do with computers. Most people do not write programs.
    They use programs written by other people. We must therefore make a distinction
    between users and programmers. A user has a job which he or she is easier to do
    on a computer running the program. A programmer has a master design inside with
    the inns of the machine. One of the golden rules is that you never write your
    own program if there is already one available, i.e. a desire to process words
    with your computer should not result in writing a word processor!


    However, because you will often want to do things with computers which have not
    been done before, and because there are people willing to pay you to do it, we
    are going to learn how to program as well as use a computer.


    Before we look at the packed business of programming it is worth looking at some
    computer terminology:


    # 1.2 Hardware and Software


    If you buy a computer, you are not just getting a box with whims. The box, to
    be useful, must also have built-intelligence to understand simple commands to
    do things. At this point we must draw a distinction between the software of a
    computer and the hardware.


    Hardware is the physical side of the system. If you can kick it, and it kicks
    when immersed in a bucket of water, it is hardware. The impressive part of lights
    and switches in the case is what the salesman sold you.


    Software is what makes the machine tick. If a computer has a soul, it keeps it
    in its software. Software uses the physical ability of the hardware, which can
    run programs, to do something useful. It is called software because it has no
    physical existence and'
