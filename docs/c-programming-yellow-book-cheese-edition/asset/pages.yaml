    \ to set up a loop of all forms in one: follows:\n\n```\nfor ( setup ; finish\
    \ test ; update )\n{\n    things we want to do a given\n    number of times\n\
    }\n```\n\nWe use this to re-write the above program as:\n\n```\nusing System;\n\
    class ForLoop\n{\n    int i;\n    for ( i = 1 ; i < 11 ; i = i + 1 )\n    {\n\
    \        Console.WriteLine (\"Hello mum\");\n    }\n}\n```\n\nCode Sample 07 For\
    \ loop\n\nThe setup puts a value into the control variable which it will start\
    \ with. The test is a condition which must be true for the for loop to continue.\
    \ The update is the statement which performs to control the variable at the end\
    \ of each loop. Note that the three elements are separated by semicolons. The\
    \ precise sequence of events is:\n\n+   1. Put the setup value into the control\
    \ variable.\n2. Test to see if we have finished the loop yet and exit to the statement\
    \ after the loop if we use.\n3. Perform the statements to be repeated.\n4. Perform\
    \ the update.\n5. Repeat from step 2.\n\nWriting a loop in this way is quicker\
    \ and simpler than using a for while because it keeps all the elements of the\
    \ loop in one place instead of leaving them spread about the program. This means\
