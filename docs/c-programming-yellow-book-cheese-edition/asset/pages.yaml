  md: '# Computers and Programs


    # Computers


    Windows 10 is an example of an operating system. It gives computer programs a
    platform on which they can execute.


    is comparatively easy to change. Software is the voice which says says "Computer
    Running" in a Star Trek film.


    All computers are sold with some software. Without it you would be a lonely and
    highly expensive heating system. The software which comes with a computer is often
    called its Operating System. The Operating System makes the machine usable. It
    looks after all the information on the computer and provides lots of commands
    to allow you to manage things. It also runs programs, ones written and from other
    people. You will have to learn to talk to an operating system so that you can
    create your C# programs and get them to.


    # 1.1.3 Data and Information


    People use the words data and information interchangeably. They seem to think
    that one means the other. I regard data and information as two different things:


    **Data** is the collection of ones and offs which computers store and manipulate.


    **Information** is the interpretation of the data by people to mean something.
    Strictly speaking process data, humans work on information. As an example, the
    computer could hold the following pattern in memory somewhere:

    11111111 11111111 11111111 00000000


    > You could regard this as:

    > "you are 256 pounds overdrawn at the bank"


    > > "you are 256 feet below the surface of the ground"


    > > "eight of the thirty two lights switches are off"


    The transition from data to information is usually made when the human reads the
    output. So may if I am being pedantic? (pedantic means fussy about something being
    exactly right) It is vital to remember that a computer does not "know" what the
    data is it is processing means. As far as the computer is concerned just patterns
    of bits, it is the user who gives meaning to these patterns. Remember this when
    you give a bank statement which says you have £8, 388, 668 in your account!


    # Data Processing


    Computers are data processors. Information is fed into them; and they generate
    further information. A computer program tells the computer what to do with the
    information coming in. A computer works on data in the same way that a sausage
    machine works on meat, something is put in one end, processing is performed, and
    comes out of the other end:


    ![](img/5a238309826e383fc3d481aa5d5dfccc_6_0.png)


    This makes a computer very good "mistake amplifier", as well as a useful thing
    to blame......


    A program is unaware of the data it is processing in the same way that a sausage
    machine is unaware of what it makes. Put a sausage into a sausage machine and
    it will try to make sausages out of it. Invalid data into a computer and it will
    do useless things. It is us people who actually give meaning to the data (see
    above). As far as the computer is concerned data is just stuff coming in which
    has to be manipulated in some way.


    A computer program is just a sequence of instructions which tell the computer
    what to do with the data coming in and what form the data sent out will have.


