  md: '# 3.6.4 Closing a Stream


    When your program has finished writing to a stream it is very important that the
    stream is explicitly closed using the Close method:


    ```

    writer.Close();

    ```


    When the Close method is called the stream will write out any text to the file
    that it is waiting to be written and disconnect the program from the file. Any
    further attempts to write to the stream will fail with an exception. Once a file
    has been closed it can be accessed by other programs on the computer, i.e. once
    the file has been performed you can use the Notepad program to view text, and
    take a look at what is inside. Forgetting to close a file is bad for a number
    of reasons:


    +   - It is possible that the program may finish without the file being closed.
    In this situation of the data that you wrote into the file will not be lost.


    +   - If your program has a stream connected to file other programs may be able
    to use it. It will also be possible to move or rename the file.


    +   - An open stream consumes a small, but significant, part of operating resource.
    If your program creates lots of streams but does not close them might lead to
    problems opening other files later.


    So, close the file or suffer the consequences.


    # 3.6.5 Streams and Namespaces


    If you rush out and try the bits of code you will find that they don''t work.
    Sorry about that. There is something else that you need to know before you use
    the StreamWriter type. Lots of the objects that deal with input and output, object
    is defined in the System namespace. We have touched on namespaces before, we reflected
    on the need to have the statement using System; at the start of our C# programs.
    Now we will learn more about namespaces.


    Namespaces are all to finding resources. The C# language provides the keywords
    and constructs that allow us to write programs, but on top of these are a whole
    lot of extra resources supplied with a Console object that lets us read and write
    text to the user. A C# installation actually contains thousands of resources,
    of which which must be uniquely identified. If you were making a museum you would
    find it very helpful to lump items into groups. Museum curators do this all the
    time. Put all the artifacts in one room, and the Greeks in another. The designers
    of the C# language created a namespace facility where programmers can do what
    they want.


    A namespace is, quite literally, a ''space where names have meaning''. The full
    name of the Console that you have been using to write text to the user is Console.Console.
    That is, the Console class in the System namespace. It is okay to use this fully
    in your programs:


    ```

    System.Console.WriteLine("Hello World");

    ```


    The above uses the fully qualified name of the console resource and calls the
    method WriteLine for output. However, we didn''t had to use this form because
    at the start of our programs we have told the compiler to use the System namespace
    to find any names it hasn''t seen before. The using keyword allows us to tell
    the compiler where to look for resources.


    ```

    using System;

    ```


    This statement tells the compiler to look in the System namespace for resources.
    Once we have specified a namespace in a program file we will not need to use the
    fully qualified name for resources for that namespace. Whenever the compiler finds'
