  md: "# Creating Programs\n\n# Methods\n\nThe method readValue has been defined with\
    \ three parameters. A call of the\nmethod must have three argument values: prompt,\
    \ a low value and a high value.\n\nThis means the following call of readValue\
    \ would be rejected by the compiler:\n\n```\nx = readValue(25, 100, \"Enter your\
    \ age\");\n```\n\nThis is because the prompt string must go first, followed by\
    \ the low and high limits for\nto value to be read.\n\nIf you want to make calls\
    \ and not have to worry about the order of the\narguments you can name each one:\n\
    \n```\nx = readValue(low:25, high:100, prompt: \"Enter your age\");\n```\n\nNow\
    \ the compiler is using the name of each argument, rather than its position in\
    \ the list.\nThis has the useful effect of making it much clearer to someone reading\
    \ your code\nthe exact meaning of each argument.\n\n# Programmer's Point: I love\
    \ using named arguments\n\nI love this feature of C#. It makes clarity and it\
    \ also means you don't have to scratch your head\nander if the low value is given\
    \ before the high value when you create the method.\n\n# Optional Arguments\n\n\
    Sometimes the value of an argument might have a sensible default value. For example,\n\
    if we wanted the readValue to fetch a value from the user and not display a\n\
    prompt we could do this by providing an empty string:\n\nHowever, this is a bit\
    \ messy. Instead we can change the definition of the method to\ndefine a default\
    \ value for the parameter:\n\n```\nstatic double readValue (\n  double low, //\
    \ lowest allowed value\n  double high, // highest allowed value\n  string prompt\
    \ = \"\", // optional prompt for the user\n){\n}\n```\n\nWe can now call the method\
    \ and leave the prompt out if we like:\n\n```\nx = readValue(25, 100);\n```\n\n\
    When the method runs the prompt will be set to an empty string if the user doesn't\n\
    provide a value.\n\nNote that I've had to rearrange the order of the parameters\
    \ so that the prompt is the last\nparameter. Optional parameters must be provided\
    \ after all required ones.\n\nThere is a potential problem however. Consider this\
    \ method:"
