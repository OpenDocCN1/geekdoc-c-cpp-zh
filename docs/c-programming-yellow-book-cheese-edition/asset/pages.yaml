  md: '# Advanced Programming


    # Debugging


    you popular with users. It is important to stress to that any fault report will
    only be taken seriously if it is well documented.


    # Programmer''s Point: Design Your Fault Reporting Process


    Like just everything I''ve ever mentioned, the way in which you manage your fault
    reports should be considered at the start of the project. In other words, you
    should set up a process to deal with faults that are reported. In a large scale
    development fault reports are managed, assigned to programmers and tracked very
    carefully. The number of faults that are reported, and the time taken to deal
    with them, is valuable information about the quality of the thing you are making.
    Also, if you formalize (or perhaps even automate) the fault reporting process
    you can ensure that you get the maximum possible information about the problem.


    # The two types of Fault


    Faults split into two kinds, those which always happen and those which sometimes
    happen.


    Faults which always happen are, you can perform the sequence which causes the
    bug to manifest itself and use suitable techniques to catch it (later).


    Faults which sometimes happen are a pain. What this means is you do not have a
    defence sequence of events which causes the system to fail. This does not mean
    there is no sequence (unless you are suffering from a hardware induced fault of
    kind—which is rather rare) but does not happen exactly when


    An example would be a print function which sometimes crashes and work at other
    times. You might track this down to the number of pages, or the amount of text
    on the page, or the size of the document which is edited when the print is requested.


    The manifestation of a fault may be after the error itself has occurred, for example
    a program may fail when an item is removed from a database, but the error may
    be in the routine which stored it, or in code which overwrote the database lives.


    A fault may change or disappear when the program is changed; errors overwrite
    memory might corrupt different parts of the program if the layout of the code
    changes. This can lead to the most annoying kind of fault, where you put in extra
    statements to find out more about the problem, and the problem simply disappears!


    If you suspect such an error, your first test is to check the code and data in
    some way and re-run the program. If the fault changes in this nature indicates
    problems with program or data being corrupted.


    # 5.8.2 Bugswating


    You can split faults into other categories, where the program crashes (i.e. stops
    completely) or when it does the wrong thing. Surprisingly, crashes are often easier
    to fix. They usually point to:


    +   - a state which is not catered for (make sure that all selections have a default
    handler which does something sensible and you use defensive programming techniques
    when values are passed between modules)


    +   - programs that get stuck into loops, do while constructions contain code
    which controls the variables, methods that call themselves by mistake and recurse
    their way stack overflow


    +   - an exception that is not caught properly


    If your program does the wrong thing, it is harder to find. Look for:


    +   - use of un-initialised members of classes


