    # BANK NOTES: CONSTRUCTING AN ACCOUNT


    The issues revolving around the constructor of a class are not directly relevant
    to the bank account specification as such, since they relate to how the specification
    is implemented, and what the system itself actually does.


    That said; if the manager says something like "The customer fills in a form, enters
    their name and address and this is used to create the new account" this gives
    you a good idea of what parameters should be supplied to the constructor.


    # 4.8 From Object to Component


    I take that as you develop as a software writer you go through a process of "stepping
    back" from problems and thinking at higher and higher levels. Possible call this
    "abstraction". This is the progress that we have made so far:


    +   - representing values by named locations (variables)

    - creating actions which use the variables (statements and blocks)

    - putting behaviours into loops of code we can give names to. We can reuse these
    behaviours and also use them in the design process (methods)

    - creating things which become member variables as properties and member methods
    as actions (objects)


    Rather than a span of time at the start of a project we are going to just represent
    an account and precisely what it should do, we just say "We need an account here"
    and then move on to other things. We will come back and revisit the problem in
    a greater level of detail, and from the point of view of what the Account needs
    to do.


    The next thing to do is consider how we take a further step back and expressing
    a solution using components and interfaces. In this section you will find out
    the difference between an object and a component, and how to design systems using
    them.


    # 4.81 Components and Hardware


    Before we start on things a point of view it is worth considering things from
    a hardware point of view. You would be familiar with the way that, in a typical
    computer, some parts are not "wired in" to system. For example, the graphics adapter
    is a separate device which is plugged into the main board. This is good; because
    it means that you can buy a new graphics adapter at time and fit it into the machine
    to improve the performance.


    For this work to properly follow the people who make boards and the people who
    make graphics adapters have to agree on an interface between two devices. This
    takes the form of a large document which describes exactly how the components
    interact, for which signals are inputs, which signals are outputs and so on.


    C# Programming Rob Miles 2016


