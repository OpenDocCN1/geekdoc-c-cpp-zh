  md: '# Programmer''s Point: Bug Fix Causes Bugs


    The primary cause of bugs is probably the bug fixing process. This is because
    when people change the program to make one of it work that they often make breaks
    other features of the system. I have statistics which indicate that "two for one"
    is frequently to be expected, in every bug fix will introduce two brand new bugs.
    The only way around is to make sure that your test process (which you created
    as a series of unit tests) can run automatically after you''ve applied the fix.
    This at least makes sure that fix has not broken anything important.


    # 5.8.3 Making Perfect Software


    There is no such thing as perfect software. One of the rules by which I might
    say that "any useful program will have bugs in it". In other words I can write
    programs that I guarantee with no bugs. However, such programs will be very small
    and therefore not be good for much. As soon as I create a useful software, with
    inputs, outputs and some behaviours, I start introducing bugs.


    This does not mean that every program you write is useless, just that it will
    not be perfect. When considering faults you must consider their impact. Part of
    the job of project manager in development is deciding when a project is good enough
    to sell, and or not a fault in the code is a "stopper" or not.


    A stopper is a fault which makes the program unusable. If the program crashes
    every time you run, or something decays the lifetime of the host computer, this
    is probably the behaviour of a stopper bug. But if it does always output the first
    page when you do print using the Chinese font and a certain kind of laser printer
    this might be a problem as most users could live with.


    This means you need to evaluate the impact of the faults that get reported to
    you, practise them and manage how they deal with. You also need to be aware of
    the context of the development. For example, a fault in a video game is much less
    of a problem than one in an aircraft system.


    The key to making software is as perfect as possible is to make sure that you
    have a good understanding of the problem that you are solving, you know how to
    solve it you start writing code and how you manage your code production process
    carefully. Read some of the recommended texts at the end of this document for
    this aspect of programming.


    # 5.9 The End?


    This is not all you need to know to be a programmer. It is not all you you need
    to know to be a C# programmer. However, it is quite a good start, but there are
    quite a few things missing from this text, because we don''t have time to teach
    them all. You should take a look at the following things if you want to become
    a great C# programmer:


    +   * serialisation

    * attributes

    * reflection

    * networking


    # 5.9.1 Continuous Development


    A good programmer has a deliberate policy of constantly reviewing their expertise
    and looking at new things. If you are serious about this business you should be
    reading at least least one book about the subject at any one time. I have been
    programming for as long as I can remember but I have never stopped learning the
    subject. And I''ve never stopped programming, reading books about programming
    and looking at other people''s code.'
