  md: "# Advanced Programming\n\n# Storing Business Objects\n\nThis method is supplied\
    \ with a text stream. It reads the name and the balance from this stream and creates\
    \ a new CustomerAccount based on this data.\n\n# Programmer's Point: Streams are\
    \ wonderful\n\nUsing streams is a very good idea. The C# input/output system lets\
    \ us connect streams to all manner of things, not just files on a disk. For example,\
    \ you can create a stream which is connected to a network port. This means that\
    \ if you make your business objects save and load them using streams they can\
    \ be sent over network connections with no extra work from you.\n\n# Saving and\
    \ loading bank accounts\n\nNow that we have a way of saving multiple accounts\
    \ to a single stream we can write a method for the bank. This will open a stream\
    \ and save all the accounts to it:\n\n```\npublic void Save(System.IO.TextWriter\
    \ textOutput)\n{\n    textOutput.WriteLine(bankHashtable.Count);\n    foreach\
    \ (CustomerAccount account in bankHashtable.Values)\n    {\n        account.Save(textOutput);\n\
    \    }\n}\n```\n\nThis is the Save method which would be added to our Hashtable\
    \ based bank. It gets each account out of the hash and saves it in the given stream.\
    \ Note that we are using a new C# loop construction here, foreach. This is very\
    \ useful when dealing with collections of data. It works through a collection,\
    \ in this case the Values property of bankHashtable, and saves each item in turn.\n\
    Note that it writes out the number of accounts in the bank. We do this so when\
    \ the bank is read back the load method knows how many accounts are required.\
    \ We could just write out the data and then let the load method stop when it reaches\
    \ the end of the file, but this would not allow us to detect if the file had been\
    \ shortened.\n\nThe Load method for the entire bank is as follows:\n\n```\npublic\
    \ static Hashtable Load(System.IO.TextReader text)\n{\n    Hashtable result =\
    \ new Hashtable();\n    string countString = text.ReadLine();\n    int count =\
    \ int.Parse(countString);\n\n    for (int i = 0; i < count; i++)\n    {\n    \
    \    CustomerAccount account = CustomerAccount.Load(text);\n        result.bankHashtable.Add(account.GetName(),\
    \ account);\n    }\n    return result;\n}\n```\n\nThis reads the size of the bank\
    \ and then reads each of the accounts in turn and adds it to the hash table. Note\
    \ that this load method does not handle errors. A production version of the program\
    \ would check that each account was loaded correctly before adding it to the hash\
    \ table."
