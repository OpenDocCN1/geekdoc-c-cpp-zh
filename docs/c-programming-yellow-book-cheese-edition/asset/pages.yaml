  md: "# Simple Data Processing\n\n# Writing a Program\n\nIf you are so stupid as\
    \ to mess around the value of the control variable in the loop you can expect\
    \ your program to do stupid things, i.e. if you put 1 by to 0 the loop it will\
    \ run forever. And serve you right.\n\n# Programmer's Point: Don't be clever/stupid\n\
    \nSome people like to show how clever they are by doing things with the setup,\
    \ condition and update statements, which can do things other than simple assignment,\
    \ increment and test. Some programmers think they are clever if they can do all\
    \ the work \"inside\"the for at the top and have an empty statement after.\n\n\
    I call these people \"the stupid people\". There is rarely need for such convoluted\
    \ code. When you are writing programs the two things which you should be worrying\
    \ about \"How do I prove this? and \"How is this code to understand? Complicated\
    \ code does not help you either of these things.\n\n# Breaking Out of Loops\n\n\
    Sometimes you may want to escape from a loop while in the middle of it, i.e. your\
    \ program may decide there is no need or point to go on and wishes to leave out\
    \ the loop and continue the program from the statement after.\n\nYou can do this\
    \ with the break statement. This is a command to leave the immediately. Your program\
    \ will usually use some function to quit in this way. I find it so useful that\
    \ I can provide a \"get out of here\" option in the middle of something, for example\
    \ in the while program sets the variable aborted, normally false becomes true\
    \ when the loop has it abandoned and the variable runningOK, normally true, becomes\
    \ false when it is time to finish\n\n```\nwhile (runningOK)\n{\n    complex stuff\n\
    ...\n    if (aborted)\n{\n        break;\n    }\n    more complex stuff\n...\n\
    }\nbit we get if aborted becomes true\n```\n\nNote that we are using two variables\
    \ as switches, they do not hold values as such; they are actually used to represent\
    \ states in the program as it runs. It is a standard programming trick that you\
    \ will find very useful.\n\nYou can break out of any of the three kinds of loop.\
    \ In every case the program continues running the statement after the last statement\
    \ of the loop.\n\n# Programmer's Point: Be careful with your breaks\n\nThe break\
    \ keyword looks a little like the dreaded goto statement, which programmers are\
    \ often scared of. Goto is a special one that lets execution jump from one of\
    \ the program to another. For this reason the goto is condemned as a potentially\
    \ dangerous and confusing device. The break statement lets you jump from any point\
    \ in a loop, to the statement just outside the loop. This means that if my program\
    \ is at the statement immediately following the loop, there are a number of ways\
    \ it could have got there; for every break in the loop above. This means the break\
    \ construction is less confusing than the goto, but can still lead to problems.\
    \ In respect we advise you to exercise caution when using it."
