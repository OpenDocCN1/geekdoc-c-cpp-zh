  md: "# Extensible Markup Languages\n\nAt this point you are wondering what an Extensible\
    \ Application Markup Language actually is. Well, it is a markup language for applications\
    \ that is extensible. I'm sure that helped. What we mean by this is that you can\
    \ use the rules of the language to create constructions that describe anything.\
    \ It is a lot like this. We have letters and punctuation which are the symbols\
    \ of English text. We also have different kinds of rules grammar that set out\
    \ how to make words and sentences to describe actions. We have nouns that describe\
    \ things and verbs that describe actions. When something comes along we invent\
    \ a new word for it to describe it. Someone had come up with the name for computer,\
    \ along with phrases like 'boot up', 'system crash' and 'too slow'.\n\nXML languages\
    \ are extensible in that we can invent new words and phrases that fit within the\
    \ rules of the language and use these new constructions to describe anything.\
    \ We call them markup languages because they are often used to describe the arrangement\
    \ of items on a page. The word markup was originally used in printing when you\
    \ wanted to display a name in a very large font. The most famous markup language\
    \ is HTML, HyperText Language, which is used by the Wide Web to describe the format\
    \ of web pages.\n\nProgrammers frequently invent their own data formats using\
    \ XML. As an example, a snippet of XML that describes a set of high scores might\
    \ look like follows:\n\n```\n<xml version=\"1.0\" encoding=\"us-ascii\" ?>\n<HighScoreRecords\
    \ count=\"2\">\n  <HighScore>\n    <game>Breakout</game>\n    <playerName>Rob\
    \ Miles</playerName>\n    <score>1500</score>\n  </HighScore>\n  <HighScore game=\"\
    Space Invaders\">\n    <playerName>Rob Miles</playerName>\n    <score>4500</score>\n\
    \  </HighScore>\n</HighScoreRecords>\n```\n\nThis is a tiny XML that describes\
    \ some high scores for a video game system. The HighScoreRecords element contains\
    \ two HighScore items, one for Breakout and one for Space Invaders. The two high\
    \ scores are contained within the HighScore item. Each of the items has a property\
    \ which gives the game name and also contains two elements: the name of the player\
    \ and the score that was achieved. This is how easy it is to understand the XML\
    \ from above. It is not hard to work out the high score for the Space Invaders\
    \ game.\n\nThe line at the very top of the file tells whatever wants to read the\
    \ file what the XML standard is and on the ending of the characters in the file\
    \ text. XAML takes the rules of an extensible markup language and uses them to\
    \ create a language that describes constructions on a page of a display.\n\n```\n\
    <TextBox Height=\"72\" HorizontalAlignment=\"Left\" Text=\"0\" VerticalAlignment=\"\
    Top\" Width=\"468\" TextAlignment=\"Center\" />\n```\n\nIf we now take a look\
    \ at the above description of a TextBox I can see that the designers of XAML have\
    \ just created field names that match their requirements. We will see more XAML\
    \ in this section.\n\n# XML Schema\n\nThe XML standard also contains descriptions\
    \ how to create a schema which describes a particular document format. For example,\
    \ in the above the schema for the high score information would say that a HighScore\
    \ must contain a PlayerName and a Score property. It might also say things like\
    \ the HighScore can contain a Date value (the date when the high score was achieved)\
    \ but that is not required for every HighScore value."
