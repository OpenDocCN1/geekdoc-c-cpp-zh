    # What’s New?


    ATTR() function is similar to SCREEN($) but it returns the colour attributes for
    the screen location queried in the form of a numeric value. It’s slightly more
    complex but much more useful where the collision detection cannot rely on SCREEN($).
    SCREEN($) will not work with UDGs for instance. The workings of the ATTR() function
    is harder to work out but here is the gist


    ATTR() is the sum of the following values of attributes for a single character
    position on the screen.


    If the character position is flashing = 128 otherwise 0

    If the character position is bright = 64 otherwise 0

    Paper colour = colour value * 8 (e.g. Paper Cyan = 5*8 = 40)

    Ink colour = (e.g. Ink Red = 2)


    So adding all of those attributes will tell you what value should be returned
