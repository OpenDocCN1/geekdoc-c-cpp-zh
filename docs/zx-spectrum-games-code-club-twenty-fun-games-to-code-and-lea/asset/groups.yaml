    \n在模拟器上使用时，注意某些符号在模拟器上可能会不同。\n\n## 模拟器的标准等价键\n\n在模拟器上使用时，注意。。以下是某些符号在模拟器上可能会不同：\n\
    - *（星号）= Ctrl + B\n- = Ctrl + 9\n- ）= Ctrl + P\n- .（句号）= Alt + M\n- ,（逗号）= Alt\
    \ + n\n- ;（分号）= Alt + O\n- :（冒号）= Alt + O\n- Delete（删除键）= Shift + 0\n\n## 录制你的打入\n\
    \n在模拟器上使用时，注意某些符号在模拟器上可能会不同。对于真实的机器用户，你需要一个录音机来录制 15、30、60 或 90。\n\n![](img/a5b1b953bf13d825daab6d82a3f4e6b5)\n\
    \n## 游戏循环基础\n\n游戏循环是程序内发生所有动作的部分，并反复运行直到游戏结束。它遵循特定的事件顺序。这种结构并不是死板的，下面展示了它如何进入代码的简单示例：\n\
    \n- 设置：加载数据\n- 初始化：变量、字符串和数组\n- 菜单/开始界面\n- 游戏循环：\n  - 处理输入\n  - 更新位置\n  - 绘制屏幕\n\
    - 重复\n- 结束/退出游戏\n\n我在书中的大多数游戏中都使用了这种结构。希望你发现这种格式有助于理解游戏循环的作用以及如何使用它。\n\n## 如何使用本书\n\
