    # What’s New?


    The RND function is used to generate a Random value between 0 and 1 which is multiplied
    by a value which determines the range of the values involved. E.g. INT(RND*10)
    will return an INTEGER value of RND*10, so a value between 0 and 9 as INT command
    rounds down a number to ZERO decimal places.


    Other new parts in this listing are UDGs (User Definable Graphics) and some basic
    collision detection. We will go over these briefly. Also new is the use of directional
    vector values stored in vx and vy. Which constantly increase or decrease the x
    and y values for ball movement by adding itself (vx or vy) to x or y in every
    loop.


    ```

    4010 LET bx=bx+vx: LET by=by+vy

    ```


    # What are UDGs?


    UDGs stand for User Definable Graphics and they help add graphic sprites to a
    game. Lines 7010 to 7050 look for values to place into memory to create the UDGs.
    While Lines 7300 keep the data which make up the values to go into the UDG memory.


    ```

    7010 FOR n = 0 TO 31

    7020 READ graph

    7030 POKE USR “a”+n,graph

    7050 NEXT n

    ```


    The READ command looks for DATA statements in your code. It reads each value within
    the DATA statements in order, if it runs out of data then an error occurs. So
    can tell READ where to start from using RESTORE <data_line_number>. UDGs are graphics
    characters within the character set, by default they start looking like the same
    as the letters A to Z. After some well thought out POKEs these letters can be
    changed to graphics. Each UDG character has 8 bytes by each byte containing 8
    bits.


    An easy way to create these graphics is to use BIN function which is short for'
