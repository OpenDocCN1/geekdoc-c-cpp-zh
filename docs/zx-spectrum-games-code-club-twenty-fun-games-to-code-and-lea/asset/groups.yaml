    ## 进度

    得还好吗？你现在应该理解这些命令了。你会注意到最后一个列表中有很多代码，可以在附录 A 中查询。


    ## 输入

    我们使用了大量的 `INPUT` 命令。非常实用的命令，要求用户执行操作或做出决定。它对于文字游戏或用户可以改变故事情的故事非常有用。


    ## PEEK 和 POKE

    对于我们的图形，我们使用了名为 `POKE` 的命令。它将小数值放入内存位置。然后可以使用 `PEEK` 命令再次获取该值。例如：尝试 `POKE 3300,45`
    然后回车，现在尝试 `PEEK 3000` 获取值。


    ## 数学函数

    Sinclair BASIC 有很多函数。它并不完美，也没有所有的函数，但包含了初学者学习三角函数或代数所需的大部分函数。例如：`PI` (3.14159...)、`EXP`(指数)、`LN`(对数)、`SIN`(正弦)、`COS`(余弦)、`TAN`(正切)。


