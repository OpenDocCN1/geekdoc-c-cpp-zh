    # Prototyping a game


    Using really basic graphics for a game idea is a good way to test the idea before
    investing too much time into doing a lot of coding. BASIC is really fun for prototyping
    with. A prototype is like a crude demo model of something. Next time you think
    of a game idea, try to make it in BASIC and see if its fun. If it is then you
    probably have a good case to build your idea into a full game!


    # Simple Block Graphics


    Block graphics are retro and the Minecraft look is very popular. You can use the
    Spectrum graphics characters to create simple graphics for your games – saving
    you from having to create unnecessary UDGs for simple shapes.


