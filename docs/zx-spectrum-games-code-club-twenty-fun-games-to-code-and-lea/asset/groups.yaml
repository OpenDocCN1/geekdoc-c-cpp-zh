    ## SNAKE BITE


    You must help the snake survive and grow by eating the apples that are falling
    from trees. Try to eat as many as possible without running into the side of the
    screen or your own tail! Good Luck! Myself and classroom buddies spent a lot of
    time playing this game on IBMs during computer classes. It also appeared on Nokia
    phones and was one of the first mobile games!


    - Players: 1

    - Rules: Player tries to eat as many apples as possible and beat their high score.
    Running into borders or your own tail will end the game.

    - Controls: q = up, a = down, o = left, p = right.


    ```

    10 REM ******ZX Club ***

    15 REM * SNAKE BITE by Garyman

    20 REM *********************************

    25 LET hsc=0: GO SUB 6000

    30 INK 1: PAPER 7: BORDER 4: CLS

    45 REM ***** Initial variables

    50 PRINT AT 2,10; INK 7; BRIGHT 1; PAPER 2;"SNAKE BITE": PRINT 4,5;"Control your
    snake *

    35 LET lives=3

    60 PRINT AT 7,5;"Avoid your tail! *****"

    65 PRINT AT 8,5;"Eat the apples"; PAPER 6;"o"

    70 PRINT AT 11,2;"Controls";AT 12,2;"Q/A=Up/Down,O/P=Left/Right"

    80 PRINT AT 18,5; FLASH 1;"PRESS A KEY TO START": PAUSE 0

    ```


    ```

    100 GO SUB 300: REM initialise

    130 GO SUB 1000: REM main loop for game

    200 GO TO 30:

    300 REM *** SETUP

    310 LET x=10: LET y=10: LET vx=0: LET vy=0: LET score=0: LET lvl=1: LET ax=1:
    LET ay=1: LET ax2=0: LET ay2=0: LET loot=0: LET snk=5: LET dx-x: LET dy-y: LET
    longer=0: LET snkpos=1: LET ny=0: LET nx=0: LET ly=0: LET lx=0

    330 RETURN

    1000 CLASS

    1010 FOR n=0 TO 19:

    1030 PRINT n,0;CHR$(136);AT n,31;CHR$(136)

    1040 NEXT n

    1045 FOR n=1 TO 30

    1050 PRINT 0,n;CHR$(136);AT 19,n;CHR$(136)

    1060 NEXT n

    1087 PRINT AT INT (RND*15)+3,INT (RND*25)+3; PAPER 6;"o

    1095 PRINT AT 20,1;“Score”:score

    1096 FOR n=1 TO 5

    1097 PRINT AT y,x-n;"**

    1098 NEXT n

    1099 PRINT AT y,y;"**

    1100 LET i=$INKEY($): LET i=IN 31

    1110 IF(i="q" OR i=2) AND y>2 THEN vy=-1: LET vx=0

    1120 IF(i=$“a” OR i=4) AND y<19 THEN vy=1: LET vx=0

    1130 IF(i=$“o” OR i=1) AND x>20 THEN vx=-1: LET vy=0

