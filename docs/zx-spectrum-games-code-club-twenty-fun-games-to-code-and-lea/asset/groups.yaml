    # Puzzle Games


    These type of games work very well in Sinclair BASIC. They usually don''t rely
    on fast action and require more thinking. You can change this game in many ways
    using the same code.


    ```

    1020 PRINT AT 3,5;"MMMMMMMMMM"

    1030 PRINT AT 4,5;"MM"

    1040 PRINT AT 5,5;"M M"

    1050 PRINT AT 6,5;"M M M"

    1060 PRINT AT 7,5;"MM M M"

    ```


    # Making your game fun


    Everyone wants to make a fun game. But the concept can sound a lot more fun than
    the end result. The game Retro Hunter started out with your character Ally collecting
    on the screen against the clock but it had no real challenge as just a running
    maze game. The end version became a puzzle game with only small tweaks to the
    code and a redesign of the screen map. So rethinking your ideas is better than
    scrapping a game completely. And this is a lot more fun now.

