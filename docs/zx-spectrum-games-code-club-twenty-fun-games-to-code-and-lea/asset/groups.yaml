    1110 PRINT AT 2,2:"Turn ";turn AT 20,0;"Seq";codeseq

    1120 PRINT AT 18,0;"Enter each letter for code"

    1130 INPUT r,g,b,c,m,y$(1,1):

    1140 IF a$(1,1)="c" THEN LET t(codeseq)=2

    1150 IF a$(1,1)="b" THEN LET t(codeseq)=1

    1160 IF a$(1,1)="g" THEN LET t(codeseq)=4

    1170 IF a$(1,1)="y" THEN LET t(codeseq)=6

    1180 IF a$(1,1)="m" THEN LET t(codeseq)=3

    1190 IF a$(1,1)="c" THEN LET t(codeseq)=5

    1390 LET codeseq=codeseq+1

    1400 IF codeseq=5 THEN LET codeseq=1: GO SUB 4000: REM ***

    1900 GO TO 1100:

    2000 FOR n = 1 TO 15

    2010 PRINT AT 2+n,10; PAPER 7; BRIGHT 1;"; PAPER 5;"; PAPER 6;

    2020 NEXT n

    2030 FOR n = 1 TO 4: PRINT AT 2,10+n; INK c(n);CHR$(143)

    2040 NEXT n: REM if you want to see code

    2050 RETURN


    4000 REM checking value

    4010 LET col=0: LET colseq=0

    4020 FOR n = 1 TO 4

    4030 IF t(n)=c(n) THEN colseq=colseq+1: GO TO 4050

    4040 IF t(n)>c(n) AND (t(n)=c(1) OR t(n)=c(2) OR t(n)=c(3) OR t(n)=c(4)) THEN
    col=col+1

    4050 NEXT n

    4060 LET turn=turn+1

    4070 PRINT AT 18-turn,18; PAPER 7;Y="colseq; C="col

    4080 FOR n = 1 TO 4: PRINT AT 18-turn,10+n; PAPER (t(n"));": NEXT n

    4090 IF turn=15 PRINT AT 10,10;" LOSE ": GO SUB 4300:

    4100 If col=4 THEN PRINT AT 10,5;"CONGRATS CODEBREAKER!";AT 12,5;PRESS PLAY AGAIN";
    PAUSE 0: GO TO 30

    4110 RETURN


    4300 REM Lost

    4310 PRINT PAPER 7;AT 12,10;";AT 13,10;";AT 14,10;"

    4320 FOR n = 1 TO 4

    4340 PRINT AT 13,12+n; PAPER c(n);"\n

    4350 NEXT n

    4360 PAUSE 0

    4370 GO TO 30


    # Simple but fun


    It’s a simple colourful game that one of players can play. Players can debate
    and agree on the colours to use in the sequence. Lines 2030 and 2040 allow for
    a little cheat mode for testing your program is working correctly. To you would
    need to remove the REM at the start of each line.


    # What’s New?


    RANDOMIZE is used to generate a new Random Seed value. When placed after user
    responses this makes your program much more random using RND functions. Another
    use was found here for our friend the Array. However it is a more simple and straightforward
    usage this time.


    The array() is used to save our code sequence as a numeric value for each colour.
    We then check those to the user know how they are getting on with colseq counting
    exact colour and sequence matches, and col value just counting correct colours
    present.


    # A note on Debugging


    It is good practice to use PRINT and other commands to show you information when
    Debugging your programs. Also another very useful command is the STOP command.
    You can use this with an IF statement to search and test for certain conditions
    that you want to avoid or fix. STOP will simply end the program at that line and
    return the user to the BASIC prompt.


