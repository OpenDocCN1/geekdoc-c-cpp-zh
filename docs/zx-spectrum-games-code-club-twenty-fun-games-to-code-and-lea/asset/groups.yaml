    # Puzzle Games


    These type of games work very well in Sinclair BASIC. They usually don''t rely
    on fast paced action and require more thinking and analysis. You can change this
    game in many ways and have it resemble another theme that is of interest to you
    or of interest to someone in your family. Changing the screen level is simply
    done by altering lines 1020 to 1150. Also only a few changes are required to make
    a simple maze game from this base code.


    ```

    1020 PRINT AT 03,5;"MMMMMMMMMMMM"

    1030 PRINT AT 04,5;"MM MM"

    1040 PRINT AT 05,5;"M M M"

    1050 PRINT AT 06,5;"M M M M"

    1060 PRINT AT 07,5;"MM M"

    ```'
