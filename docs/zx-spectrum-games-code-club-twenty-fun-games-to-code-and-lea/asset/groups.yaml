    # Reducing code


    We were able to reduce the number of IF statements for keypresses by using code
    that translated the keypress information into coordinates for our game.


    ```

    2030 IF a$="1" AND a$<="7" THEN LET rightpos = VAL a$: GO SUB 2500: GO SUB 3000

    2040 IF a$="a" AND a$<="g" THEN LET toppos = CODE$-96: GO SUB 2500: GO SUB 3000

    ```


    VAL converts string numbers to actual numbers and CODE returns the character set
    value for a string character.'
