    \ `RENUMBER`，它将重新组织程序的行号。这有一定的局限性，但在我们早期阶段无需担心这些。\n\n## UDGs（用户定义图形）\n\n你将学会如何轻松地创建自己的图形！因此，你可以回到书中的某些程序，并添加你自己的图形来增强它们。\n\
    \n## 机器码\n\n对于本书来说，机器码会有点难以理解。因此我们不会涵盖它。不过，请在 Gazzapper.com 订阅我们的警报，因为我们可能会发布某些游戏的更新版本，其中包含少量的机器码例程。\n\
    \n## 什么是“打入列表”（Type-in Listing）？\n\n在微型计算机的早期，杂志会发布“列表”或“打入列表”，让年轻的爱好者（即代码编写者/程序员）坐在舒适的卧室里，在键盘上一个字字输入。有些列表可能会打印错误或包含漏洞，导致使用户对作者感到沮丧和愤怒。如果你无法修复漏洞，就只能面对无法运行的代码，并花费好几个小时来输入它们。\n\
    \n不过，我很兴地告诉大家，我已经编写并测试了所有的列表，确保它们能够正常工作，任何问题都可以通过我建立的名为 ZX Spectrum Code Club\
    \ 的新 Facebook 群组来解决。如果你已经是 ZX Spectrum 群组的成员，可以在那里发布你的问题（如果规则允许）。\n\n列表的编码方式充分利用了\
    \ Sinclair BASIC 的速度限制（在合理范围内），以便游戏具有可玩性，并希望也同样有趣。结构设计得易于理解，虽然并不完美，但允许用户了解每个游戏内部的运作。游戏的结构保持相似，以便你熟悉它们，并并你自己的自己的创作提供一个简单的模板。\n\
    \nSinclair BASIC 的一个伟大特性是 ROM 在接受语句之前会验证大部分代码。以防你之前错过了，ROM 代表“只读存储器”（Read Only\
    \ Memory），它包含了操作系统以及 BASIC 所需各种例程。\n\n虽然运行程序并不需要 `REM` 语句，但提供这些注释是一个良好的习惯，因为你向程序中添加的代码越多，需要的注释就越多。特别是为了让用户在未来的以后某天编辑或扩展代码时进行参考。它们也可以作为你程序中不同部分之间的视觉分割符，使其更易读。\n\
    \nSinclair BASIC 不是最快的编程语言，但它是最容易学习的语言之一，而且非常有趣。在不涉及过多技术细节的情况下，用户可以在选项中将任何 Spectrum\
    \ 模拟器的运行速度从标准的 3.54MHz 加快到 x2 倍或更高。\n\n## 模拟器键盘映射\n\n当使用模拟器而非真实的 Spectrum 机器时，关于键盘映射有几点复杂之处需要指出。下面是真实的\
