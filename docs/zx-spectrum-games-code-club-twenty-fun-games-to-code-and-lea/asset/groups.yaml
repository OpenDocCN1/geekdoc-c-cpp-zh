    ## What’s New?


    The main thing that is new here is a second method for controls. IN 31 is used
    to read the Joystick port of the machine (or emulator). So now you will have the
    ability to use joystick controls in your games. Yes, it''s really that easy to
    add joystick controls to a Sinclair BASIC game. Lines 1100 to 1140 contain the
    code to detect keyboard and joystick controls for your game. That''s 5 lines of
    code!


    ```

    1100 IF i$=INKEY$(): LET i=IN 31

    1110 IF (i$="q" OR i=8) AND y>2 THEN LET vy=-1: LET vx=0

    1120 IF (i$="a" OR i=4) AND y<19 THEN LET vy=1: LET vx=0

    1130 IF (i$="o" OR i=1) AND x>2 THEN LET vx=-1: LET vy=0

    1140 IF (i$="p" OR i=2) AND y<30 THEN LET vx=1: LET vy=0

    ```


    You use one of more Sinclair joystick port options, you need setup keys 1,2,3,4
    and 5 or 6,7,8,9 and 0 these keys would be equivalent of left, right,


