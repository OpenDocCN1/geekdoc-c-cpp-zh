    # What’s New?


    So the we start by building our game screen and limiting the movement within the
    Tetrix play area. The items will advance down the screen until they encounter
    the ground tiles or another block. Now the next item will start coming down one
    position at a time.


    If the area below the block is occupied and the block cannot fit then the block
    will get stuck there and we are on the next block and so on.


    Now that’s all very easy, the hard part comes when we need to match and a line
    and bring down the rest of the blocks. This is done with an array, a loop and
    our friend the ATTR() function. As SCREEN$() will not work with UDGs and it does
    not distinguish colour attributes like ATTR() does.


    ```

    4710 FOR n = ypos-cn TO 3 STEP -1

    4720 FOR j = 7 TO 15

    4725 LET=ATTR(n,j)

    4730 IF att<-56 THEN PRINT INK att-56; PAPER 7;AT n+1,j;CHR$(145);AT n,j;

    INK 0; PAPER 7;"

    4740 NEXT j

    4750 NEXT n

    ```


    Above is some simple code that is used for shifting down the positions and colour
    attributes of the blocks. Our Tetrix game is not perfect, but you could add more
    rotations on the shapes to improve it. I took a simple approach to try to keep
    it easy to understand and short enough to type in.


