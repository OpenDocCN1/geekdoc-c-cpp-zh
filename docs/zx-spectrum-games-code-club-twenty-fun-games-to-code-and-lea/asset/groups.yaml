    ## Progress

    Well are you getting along with BASIC? You should understand what commands are
    used by now. You will have noticed a lot of codes in the last listing. These can
    be looked up the end of the book in Appendix A.


    ## Input

    We used a fair amount of INPUT commands. This is quite a useful command asking
    the user to perform actions or make decisions. It is very useful for text games
    or interactive stories where the users can change the route of the story.


    ## PEEK and POKE

    For our graphics we used a command called POKE. This places a decimal value into
    a memory location. We can then collect this value again using a PEEK command e.g.
    Try POKE 3300,45 then enter, now try PEEK 3000 to get the value.


    ## Maths Functions

    Sinclair BASIC has a lot of functions. It is not perfect, nor does it have every
    function but it has the majority of what a beginner would need for simple Trigonometry
    or Algebra. Examples: PI (3.14159...), EXP (Exponential), LN (Logarithms), SIN
    (Sine), COS (Cosine), TAN (Tangent).


