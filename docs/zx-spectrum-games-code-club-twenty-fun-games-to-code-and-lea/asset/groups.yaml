    # Speed


    In order to keep the game running at the same speed throughout, without resulting
    to any machine code, we used a custom tail eating routine for our snake. And to
    allow the snake to grow we delayed the tail eating routine each time the snake
    ate.


    # Collision Detection


    Commands like SCREEN$ (dy+ny,dx)="*" can be useful for testing for collision or
    letting the program know where objects can move to, or if part of the screen is
    empty or not. Keep this in mind when you are creating any of your own games.


    # High Scoring


    My personal best at this version of the game is 72. Try to beat that if you can!


    # IF x THEN y


    All games need to perform decisions. These decisions in BASIC are performed using
    IF THEN statements. IF x=1 THEN do something : now do something else : and so
    on. IF statements in Sinclair BASIC are quite simple and execute only a single
    line of commands. They do not have the ELSE or ELSEIF alternative conditions.
    But you can branch off and perform multiple commands using a GOTO or a GO SUB.
    Throughout this book we will also see IF statements with multiple conditions to
    meet using the AND / OR Boolean expressions.


    # Simple Boolean expression example


    Between the IF THEN you can have a number of different expressions which you can
    test as TRUE or FALSE and order those expressions using brackets and using the
    Boolean operators of AND and OR.'
