    # CODEBREAK


    It’s WWII and the enemy is sending secret orders to their troops. You must crack
    the code to decrypt the messages! Okay, remember a little electronic game where
    you had to solve the colour code? Also there was a 2 player game called MasterMind
    that worked using a second player to set the code and tell if you worked out the
    sequence correctly.


    Players: 1 or more (cooperative)


    Rules: Limited turns to guess the colour sequence. Choosing from Red, Blue, Green,
    Magenta (purple) and Yellow. The CPU will tell you Y with number of colours in
    sequence and C for number of colours correct.


    Controls: Enter a colour sequence per turn using previous turns to work out the
    code.


    ```

