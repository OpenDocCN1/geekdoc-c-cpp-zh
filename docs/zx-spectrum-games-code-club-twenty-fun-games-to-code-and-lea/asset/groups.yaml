    NOUGHTS AND CROSSES


    So let''s start with a simple game. Tic Tac Toe, or Naughts and Crosses, is a
    simple and a fairly universal game. Most people have played this at least once
    before, using pencil and paper. Many school copy books were littered with these
    games.


    Players: 2


    Rules: Player 1 tries to get a row of Xs and Player 2 tries to get a row of Os.


    Controls: Keys 1 to 9 will pick your square on the grid. See grid of positions
    below.


