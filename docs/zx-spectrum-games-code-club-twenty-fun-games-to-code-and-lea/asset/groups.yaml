    ## What’s New?


    Look we have used ABS once again to test for collision with baddies.

    4250 IF ABS (x-ex1)<2 AND ABS (y-ey1)<2 THEN GO SUB 4600


    Also in order to mix up the baddie movement we added very basic AI to change direction
    of the baddie randomly if they are:

    4020 IF (vx1=0 AND vy1=0) OR (ex1=11 OR ex1=14) THEN LET r1=INT(RND*4)+1


    ## Maze Games


    Who doesn’t love maze games! In the 1980s everyone went crazy for a dot munching
    icon. So here we have added 3 baddies with basic rudimentary AI (random) and a
    few hacks to make the baddie go down the centre part of the screen maze. Lots
    can be done with this, our final game in this book.


    ![](img/a5b1b953bf13d825daab6d82a3f4e6b5_133_0.png)


    Suggestions for Extending (optional)


    - 1] Increase difficulty

    - 2] Add another baddie

    - 3] Change around and make your own maze chaser!


    ## Congratulations


    You are now a certified Sinclair BASIC Coder!


    Thank You for purchasing this book and taking the time to work through it. If
    you got through all the games you should be very familiar with BASIC by now, and
    able to write some programs of your own. Plan your games on paper first in rough
    form and type in your code piece by piece.


    I hope you had fun and learned a little along the way while you typed in some
    of these games. I hope you enjoyed the experience and perhaps it has got your
    brain working on how to create games of your own for your next project. Don’t
    forget to check out our games on Android store. Please leave a review for this
    book you purchased from. You can follow us on Twitter.com/Gazzapper or visit our
    site for updates [www.gazzapper.com](http://www.gazzapper.com), Gary Plowman


    If you really liked it! You can also get a lovely Glossy 8x10 Edition on Amazon.


