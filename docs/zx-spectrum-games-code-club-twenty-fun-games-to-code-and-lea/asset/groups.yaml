    Binary. The BIN function will covert a string of 1s and 0s into a decimal number.


    Binary on the spectrum ranges from 0 to 255 which each 0 or 1 digit representing
    a number which doubles the value of the previous digit.


    | Digit1 | Digit2 | Digit3 | Digit4 | Digit5 |

    |---|---|---|---|---|

    | 1 = 1 | 1 = 2 | 1 = 4 | 1 = 8 | 1 = 16 |

    | Digit6 | Digit8 | | | 1 = |

    | 32 | 1 = 128 | | | |

    | Digit7 | | | | |

    | 1 = 64 | | | | |


    All 8 digits would total to make 255. Below is an example of binary data to make
    a basic tree shape and the decimal equivalents of each bye of the UDG. A UDG contains
    8 bytes of data.'
