    Print\"\n\nAs you can see you can have almost any combination of those commands\
    \ on a PRINT statement.\n\n## Line Numbering\n\nIt is good practice to leave adequate\
    \ gaps in numbering your code lines so you can enter additional commands at a\
    \ later stage. I would suggest for your own programs to step in increments of\
    \ 10 at least. So line 10, then line 20 and so on. Sinclair BASIC can have a maximum\
    \ of 9999 lines but lines can contain multiple statements when separated by a\
    \ colon (:), so commands can run into tens of thousands.\n\n## 128k Mode and Line\
    \ Numbers\n\nThe 128k spectrum mode has another feature that is handy for new\
    \ coders. If your program is missing a section and you did not make enough space\
    \ for the commands, you can run RENUMBER and it will re-organise the program line\
    \ numbers. There are limitations to this but we need not be concerned about those\
    \ at this early stage.\n\n## UDGs (User Definable Graphics)\n\nYou will learn\
    \ how to make your own graphics with ease! So you can return to some of the programs\
    \ in this book and add your own graphics to enhance them.\n\n## Machine Code\n\
    \nFor the purposes of this book, machine code would be a little difficult to grasp.\
    \ So we will not be covering it. However, signup for our alerts at Gazzapper.com\
    \ as we may release updated versions of some of the games with small routines\
    \ of machine code included.\n\n## So what is a ‘Type-in Listing’?\n\nIn the earlier\
    \ days of micro computing, magazines would publish ‘listings’ or ‘type-in listings’\
    \ for young enthusiasts (aka coders / programmers) to sit down and type in at\
    \ their keyboards from the comfort of their bedrooms. Some listings would be misprinted\
    \ or would contain bugs causing the user to be frustrated and furious with the\
    \ author. If you couldn’t fix the bugs, you were stuck with code that didn’t run\
    \ and spent hours typing them.\n\nWell I am happy to say I have written and tested\
    \ all the listings so that they do work and any issues worked through the new\
    \ Facebook group I set called ZX Spectrum Code Club. Or if you are already a member\
    \ of a ZX Spectrum group post your questions there (if the rules allow).\n\nThe\
    \ listings were coded in a way to make the most of the speed limitations of Sinclair\
    \ BASIC (within reason) so that the games are playable and hopefully fun too.\
    \ The structure is made to be easy to follow and although not perfect, will allow\
    \ the user to follow what is going inside each game. The structure of the games\
    \ are kept similar so that you become familiar with them and also provides a simple\
    \ template for your own creations.\n\nA great feature of Sinclair BASIC is that\
    \ the ROM validates the majority of the code before accepting the statements.\
    \ In case you missed it earlier, ROM stands for Read Only Memory and it contains\
    \ the operating system and various routines required by BASIC.\n\nAlthough REM\
    \ statements are not required for the running of the programs it is good practice\
    \ to provide these, as the more code you add into a program the more comments\
    \ are needed. Especially for the user to refer to whenever editing or extending\
    \ the code at a future date. They can also be useful as visual dividers between\
    \ sections of your program, making it easier to read.\n\nSinclair BASIC is not\
    \ the fastest of programming languages but it is one of the easiest to learn and\
    \ it's great fun. Without going into too much technical details a user can speed\
    \ up any of the Spectrum emulators running speed from the standard 3.54MHz to\
    \ x2 speed or higher in the options.\n\n## Emulator keyboard mapping\n\nWhen using\
    \ an emulator over a real Spectrum machine there are a few intricacies that should\
    \ be pointed out in relation to keyboard mappings. Below is a real 48k Spectrum\
    \ keyboard layout.\n\n![](img/a5b1b953bf13d825daab6d82a3f4e6b5_13_0.png)\n\nSelecting\
    \ symbols such as quotes and * etc might be different on your PC / MAC keyboard\
    \ than that of the emulator. This may be the case for some keyboards and emulators.\
    \ You can see above that certain symbols will be different on your keyboard.\n\
    \n## Standard Keyboard Equivalents for Sinclair Emulators\n\nBelow is a list of\
    \ how some of the mappings might differ. Keep in mind that some emulators might\
    \ use Alt instead of Ctrl for some of these mappings.\n\n- * (asterisk) = Ctrl\
    \ and B\n- ( = Ctrl and 8\n- ) = Ctrl and 9\n- “ (quotes) = Ctrl and P\n- . (full\
    \ stop) = Alt Gr and M\n- , (comma) = Alt Gr and n\n- ; (semi colon) = Alt Gr\
    \ and O\n- : (colon) = Alt Gr and O\n- Delete = Shift and 0 (zero)\n\nNote: Alt\
    \ Gr is the right Alt key\n\nIf you get stuck of or run into any issues then submit\
    \ your query to one of the many ZX Spectrum Facebook groups.\n\n## Saving your\
    \ Type-Ins\n\nThis is relatively straightforward for emulator users – Just save\
    \ a snapshot (.sna) file, but for the ‘real’ machine users you need an old school\
    \ tape recorder and a blank C15, C30, C60 or C90 cassette. To save your Type-in\
    \ Press ‘Play & Record’ on your tape deck (with ear and mic connected) and use\
    \ SAVE “<Typein Name>” LINE 10.\n\n![](img/a5b1b953bf13d825daab6d82a3f4e6b5_15_0.png)\n\
    \n## Game Loop Basics\n\nThe Game Loop is the part of your game where all the\
    \ action happens and runs repeatedly until the game is over. It follows a certain\
    \ structure or sequence of events. This structure is not set in stone, but a simple\
    \ example is shown below of how a Game Loop fits into your code.\n\n- Setup: Graphic\
    \ UDGs (a.k.a. Sprites) or loading data\n- Initialise: Key variables, strings\
    \ and arrays\n- Menu / Start Screen for Game\n- Game Loop:\n  - Process Input\
    \ / Keypresses\n  - Updating positions / AI updates etc\n  - Draw / Print Screen\
    \ items\n  - Repeat Loop\n- End / Quit Game\n\nI have used this type structure\
    \ for most of the games in this book. I hope you find that the format helps you\
    \ get your head around what a Game Loop does and how it should be used.\n\n##\
    \ How to use this Book\n\nYou can code or type in these listings in any order\
    \ you wish. Some commands or newer concepts though may not be explained as they\
    \ may have been dealt with in a previous listing but is fine. You will get there\
    \ eventually. Remember this is for fun so if a certain game is not of interest\
    \ to you feel free to skip it.\n\nAlso here is a very handy space character rule\
    \ (only relevant to printed versions of book) for the printed book, each 12 characters\
    \ is approx. 3cm.\n\n| 10 | 20 | 30 |\n|---|---|---|\n| 3cm | 6cm | 9cm |\n\n\
    Scan / copy and print it or just refer back to if you need it for calculating\
    \ spaces in the code listings. You can also make your own. The listings are mono-spaced\
    \ so it should be easy to use or work out spaces.\n\n## Some Handy Tips when Typing\
    \ in code...\n\n- 1) To quicken data entry for Type-Ins you could ask a friend\
    \ or a family member to read out the code listing to you line by line.\n- 2) Another\
    \ method is to use a ruler or another book to hide the lines you haven't yet typed\
    \ in.\n- 3) Always double-check the line number is correct! Lots of people make\
    \ typos when typing numbers out.\n\nSo without further delay, start in!\n\n##\
    \ TIC TOE OR NOUGHTS AND CROSSES\n\nLet's start with a simple game. Tic Toe, or\
    \ Naughts and Crosses, is a fairly universal game. Most people have played this\
    \ at least once using pencil and paper.\n\nRules: Player 1 tries to get a row\
    \ of Xs Player 2 tries to get a row of Os. Controls: 1 to 9 will pick square.\
    \ See grid below.\n\n1 2 3\n4 5 6\n7 8 9\n"
