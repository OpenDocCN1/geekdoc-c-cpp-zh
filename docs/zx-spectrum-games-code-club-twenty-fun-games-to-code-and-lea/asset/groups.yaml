    1190 LET x=x+vx: LET y=y+vy

    1150 IF x=0 THEN GO SUB 200

    1160 IF x=31 THEN GO SUB 2000

    1170 IF y=19 THEN GO SUB 2000

    1180 IF y=0 THEN GO SUB 2000

    1185 LET a=$SCREEN$ (y,x)

