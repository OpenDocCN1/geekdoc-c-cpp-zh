    # Progress


    If you''ve gotten this far you must be really getting to grips with BASIC and
    learning intuitively what most of the BASIC commands do. Also you must be familiar
    now with coding in a simple template for a new game.

    That''s how I learned to code!


    # What''s New?


    Loops are very handy for doing a lot of work with very little code. An easy way
    to think of it is "count from 1 to 13" is the FOR n=x to y and the NEXT part seals
    the loop by jumping back to increase the count. Other types of loops but the FOR
    NEXT loop was the original one in Sinclair BASIC.


    ```

    2070 FOR n = 1 TO 13

    2080 PRINT AT 16-n+1,shoot1*3;

    2090 PRINT AT 5+n-1,7,shoot2*3;

    2100 PRINT AT 16,7,shoot1*3;CHR$(144)

    2110 PRINT AT 5+n,7,shoot2*3;CHR$(144)

    2120 BEEP .1,n

    ```


    The above code creates the effect:

