    # 游戏原型设计


    使用非常基础的图形来设计游戏想法，是在投入大量时间进行大量编码之前测试该想法的好方法。BASIC 非常适合用于原型设计。原型就像是某东西的粗糙演示模型。下次当你想到一个游戏想法时，尝试用
    BASIC 制作它并看看好不好玩。如果是的话，你可能就有足够的理由将你的想法构建成一个完整的游戏了！


    # 简单区块图形


    区块图形具有复古风，而且 Minecraft 的风格非常流行。你可以使用 Spectrum 图形字符为你的游戏创建简单的图形——这可以避免为简单形状创建不必要的
    UDG（自定义图形）。


