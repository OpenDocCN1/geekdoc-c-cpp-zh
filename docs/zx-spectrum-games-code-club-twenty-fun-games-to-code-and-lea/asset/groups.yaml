    # PENALTY SHOOTOUT


    Everyone loves a good Penalty Shootout. So you can code in your own 2 player version
    here. Timing is everything in this little fun game. Hopefully you won''t fall
    out with any friends while playing it. Have a good time and don''t spill your
    tea in frustration.


    Players: 2


    Rules: Player 1 in Blue, Player 2 in Red. Taking turns and first to 5 wins proving
    the opponent is at least 2 points behind. Shooter takes his shot then the player
    in goal gets a chance to save it.


    Controls: S = Shoot at goal (try not to go wide!), G = Goalkeeper makes a save
    attempt.


