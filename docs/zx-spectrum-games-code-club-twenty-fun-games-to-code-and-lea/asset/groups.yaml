    his time limit. He is slightly bonkers and runs in one direction until he reaches
    a stall or the wall of building. The more games he can collect, the more time
    will be added to his timer. However, other Collectors are here and looking to
    snap up retro too. So he''s gotta be quick to figure out how to get around Play
    Expo in this fun game.


