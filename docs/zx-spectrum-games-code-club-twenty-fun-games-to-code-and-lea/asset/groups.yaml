    # After you play


    We will not go through every line, just the important stuff or any part I think
    might be harder to grasp.


    So what does it all mean? Well lines 10 to 20 are just for show, the REM command
    is for adding any comments or remarks about the code.


    | 10 REM **************************************** | 15 REM * Tic-Tac-Toe or Nought
    & Crosses |

    | 20 REM ********** Gary Plowman ********** | |


    Line 30 sets up the display of the game. INK command is the pen colour, PAPER
    is the main screen area and BORDER is the area outside the main screen area. The
    border area is rarely used and it is not reached by PLOT or PRINT commands, but
    it can be made flash to indicate getting a hit or scoring point.


    ```

    30 INK 7: PAPER 6: BORDER 7: CLS: LET ply=1: LET win=0: DIM a(9,2): LET sq=0

    ```


    Next on that line is CLS. This means Clear the Screen and without the PAPER command
    would not have made the whole of the screen area colour. After that the LET command
    is used to setup variables. Variables store values to be used or changed at a
    later time in the code.


    # Arrays & Multi-dimensional Arrays


    This next is part is not that difficult at all but don''t worry if you don''t
    get Arrays just yet. Arrays are tricky in the beginning, and it is best to think
    of them as lists of values.


    Last part of line 30 is the DIM a(9,2) command (dimensional array). This is an
    array of variables and works like a list or spreadsheet in numerical order. But
    if you do not understand that maybe this will explain it better.


    The first dimension can be thought of as Column 1 contains 9 rows of data. With
    the second part referring to Column 2 with a different set of 9 rows of data.


    # DIM a(9,2) – 9 rows down with 2 columns


    | Column 1 | Column 2 |

    | LET a(1,1)=1 | LET a(1,2)=1 - Row |

    | ... | ... |

    | LET a(9,1)=9 | LET a(9,2)=9 - Row |


    The commands above will store value in different sections of the array. An error
    occurs if you try to exceed the limits of the array as setup in your DIM statement.
    Arrays in Sinclair BASIC always start from 1 and not 0 (Zero).


    # GO SUB Explained


    The GO SUB command means Go Subroutine. A GO SUB will allow a program to leap
    to another part of the code based on the line number provided and then it can
    return to the previous position if a RETURN statement is encountered. This is
    very useful for dividing a BASIC program into logical sections. A GO SUB is handy
    to keep in mind for any code extending you might want to add to any of the games.
    Each significant problem you run into can be separated off as GO SUB routine,
    which helps you keep track of your program.


    # Summary of the Remaining Program


    Lines 90 to 210 draw the contents of the game screen.


    - 90 PRINT AT 2,10; INK 1;“Tic Toe"

    - 110 PLOT INK 5:100,40; DRAW INK 5:0,100

    - 120 PLOT INK 5:150,40; DRAW INK 5:0,100

    - 130 PLOT INK 5:65,70: DRAW INK 5:0,20

    - 140 PLOT INK 5:65,110; DRAW INK 5:0,20

    - 160 REM State 1=player 1, 2=player 2


    Lines 110 to 140 with PLOT, creating the starting points for drawing. These draw
    the # grid. PLOT places your pen on the screen (making a dot). Then the DRAW command
    creates a line or arc. Lines 175 to 190 will draw the X and O symbols to the sides
    of the grid and also print the grid for the player. Lines 300 to 400 will run
    the main Loop, which is quite short for the game.


    ```

    300 REM ****** Test

    310 PRINT AT 18,1; INK 7; PAPER 6;"ply"; Choose 1-9

    320 LET i$=INKEY

    330 IF i$="1" AND i$<="9" LET square=VAL i$: GO SUB 100

    340 IF i$="" THEN GOTO 320

    350 GO SUB 200: REM Test for Winning Conditions

    360 IF win=0 THEN PRINT AT 18,1;"ply has WON!"; BEEP 4,3; BEEP 2,10: GO TO 10

    370 IF win=0 THEN PRINT AT 18,1;"DRAW RESTARTING"; BEEP 4,3: BEEP 2,10: GO TO
    10

    400 GO TO 300

    ```


    Lines 320 is important as it captures the presses of the players. 330 checks to
    make sure the key pressed is valid (between 1 and 9). 1000 to 1090 check to ensure
    the chosen square is taken.


    ```

    1000 REM Check squares

    1010 IF a(square,1)=1 OR a(square,2)=1 THEN PRINT AT 18,1;"square Taken"; BEEP
    3,1: GO TO 1050

    1020 LET a(square,ply)=1: LET ply=ply+1: LET sq=sq+1

    1025 PRINT AT 18,1; INK 4;"Good move!": BEEP 4,1

    1030 IF ply=3 THEN ply=1

    1040 GO SUB 3000: REM Draw

    1050 PRINT AT 18,1;"

    1090 RETURN

    ```


