    所有游戏都需要做出决策。BASIC 中的这些决策是使用 `IF THEN` 语句实现的。`IF x=1 THEN 执行某事 ： 现在执行其他事 ：以此类推。Sinclair
    BASIC 中的 `IF` 语句非常简单，只执行单行命令。它们没有 `ELSE` 或 `ELSEIF` 可选条件。但你可以使用 `GOTO` 或 `GO SUB`
    分支并执行多个命令。在本书中，我们还将看到使用 `AND / OR` 布尔表达式来满足多个条件的 `IF` 语句。


    ## 简单布尔表达式示例


    在 `IF THEN` 之间，你可以有许多不同的表达式可以测试其为真或假，并使用括号以及 `AND` 和 `OR` 布尔运算符对这些表达式进行排序。


    128k 模式提供了 `PLAY` 命令的另一种形式，它使用更具音乐性的 AY 芯片，但为了易用性和兼容性，我们将直接使用 `BEEP`。


