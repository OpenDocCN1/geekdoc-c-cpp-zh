    现在这些都非常简单，困难的部分在于我们需要匹配行并下移剩余的块。这是通过数组、循环和 `ATTR()` 函数实现的。`SCREEN()` 不支持自定义图形（UDG），不像
    `ATTR()` 那样区分颜色。


    ```

    4710 FOR n =cn ypos TO 3 STEP -1

