    # RETRO HUNTER


    Little Ally has gone to a Retro Gaming Expo and must try to collect many games
    as he he can within his time limit. He is slightly bonkers and runs in one direction
    until he reaches a stall or the wall of the building. The more games he can collect,
    the more time will be added to his timer. However, other Retro Collectors are
    here and looking to snap up retro games too. So he''s gotta be quick to figure
    out how to get around the Play Expo in this fun little Puzzle game.


    Players: 2

    Rules: Navigate the location and use the other stalls to reach the areas to collect
    your games.

    Controls: q = up, a = down, o = left, p = right to move.


