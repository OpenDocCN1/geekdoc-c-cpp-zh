    # ZX BREAKOUT


    Based on the original Arcade game Breakout by Atari. My first experience of playing
    Breakout was in a pool hall near our house. I think it was the first arcade game
    I played that was in colour. Although later in life, I found I was duped! The
    game was really only black and white – the extra colours were achieved using an
    overlay of coloured transparent plastic. The effect on screen was quite similar
    to that of the ZX Spectrum’s colour clash. Still, it worked its magic and I was
    hooked. By the way, did I mention that the two main founders of Apple created
    Breakout!


    Players:

    Rules: Launch the ball and keep it from falling past your bat.

    Eliminate 70 points worth of blocks to get to the next screen.

    Controls:

    z = left, x = right, [space]=launch ball.


