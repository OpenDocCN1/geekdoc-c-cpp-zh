    # TAKEWAY TED


    Ted must manage his Takeaway shop well or risk losing customers and money. Also
    his missus will give him an ear-bashing if he messes it up too much. Ted must
    feed the customers with the correct orders to bring in the moolah! If a food queue
    is fully used then Ted will save money on the running costs. If he gives the customer
    the wrong food...Uh oh!


    Players: 1


    Rules: Start your queue and as the customers come into your chip shop you have
    to match their orders with what''s in your queue. Letters on screen: C = Chips,
    B = Burger, F = Fish, P = Pizza and K = Kebab. Match the orders to your customer
    queue. ''K'' will generate a new list of food items but it will cost money. Using
    all available items gets you a free list of food to serve. Give a wrong order
    to a customer and lose some of your money. The shop spends money to run so try
    to make enough to keep it open.


