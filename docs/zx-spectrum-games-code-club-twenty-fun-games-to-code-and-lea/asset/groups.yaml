    # Congratulations


    You are now a certified Sinclair BASIC Coder!


    Thank You for purchasing this book and taking the time to work through it. If
    you got through all the games you should be very familiar with BASIC by now, and
    able to write some programs of your own. Plan your games on paper first in rough
    form and type in your code piece by piece.


    I hope you had fun and learned a little along the way while you typed in some
    or all of these games. I hope you have enjoyed the experience and perhaps it has
    got your brain cells working on how to create super games of your own with Sinclair
    BASIC, or maybe you have been inspired to tackle other coding languages for your
    next project.


    Don’t forget to check out our Android games too, just search for Gazzapper Games
    on Playstore. Please leave a review for this book on store you purchased from.


    You can follow us on www.Twitter.com/Gazzapper or visit our site and signup for
    updates


    www.gazzapper.com


    Thank you,


    Gary Plowman


    P.s. If you really liked it! You can also get a Printed Edition in a lovely Glossy
    8x10” Book on Amazon.'
