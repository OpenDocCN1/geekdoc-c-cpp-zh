    # SPECIAL THANKS


    To Gabby and Pippin for putting up with the late nights


    # ACKNOWLEDGEMENTS


    I would like to express my gratitude to all the supporters of this book and those
    ZX Spectrum & BASIC coding fans that supported the idea in early stages.


    I would like to thank my partner Gabrielle for her help in testing some of the
    code within this book.


    Thanks to my parents for buying me the ZX Spectrum for Christmas back in 80s.


    Thanks to Richard Langford for the use of his 48k Spectrum graphic image.


    Thanks to the larger Retro community in general who help spread the word.


    Thanks to Sir Clive Sinclair for making the Sinclair ZX Spectrums.


    # Contents


    - TIC TAC TOE

    - ZX BREAKOUT

    - SNAKE BITE

    - FLAPPY BIRD

    - THE NUMBERS GAME

    - BATTLESHIP WAR

    - CODEBREAK

    - ASTRAL INVADERS

    - COLOUR STACKS

    - ANGRY CHICKY

    - ALLOTMENT WARS

    - RETRO HUNTER

    - SNOWBALL SHOOTOUT

    - TETRIX

    - TYPE INVADERS

    - MINIPONG

    - TAKEAWAY TED

    - C5 SOLAR RACE

    - PENALTY SHOOTOUT

    - BILLY BOB''S GOLD

    - APPENDIX A - The character set

    - ABOUT THE AUTHOR


    # INTRODUCTION


    Before we start, let’s just clarify the purpose of this book. This is not intended
    as an all-knowing reference book on the ins and outs of the Sinclair BASIC language.
    This is a book to facilitate the learning of Sinclair BASIC by typing through
    the code listings for various games, the added benefit is that you get to enjoy
    your efforts in the book, we some ‘old school’ gaming. As you progress through
    the book, we do less explaining so as not to bore you. There are many different
    types of games in this book, so I hope there is something of interest for everyone.


    Perhaps some of you want to introduce a younger generation to the glory days of
    early micro computing with a machine that grew up with. Or you may wish to provide
    a local Code Club with easy to learn activities for building fun games, without
    the need to be a skilled artist, boffin or whiz kid. Or perhaps you are a ZX fan
    and have gotten yourself one of those new Bluetooth ZX Spectrums, either way we
    hope you have fun using this book.


    As a teenager I benefited from learning BASIC programming and the experience opened
    doors to many possibilities, it gave me a passion for computing and coding in
    general. Today, I am involved in desktop, web and mobile coding for both game
    development, business applications and Internet startups. Everyone has to start
    somewhere and it’s never too late or too early to learn to code.


    # So why Sinclair BASIC?


    The Sinclair BASIC language is one of the gateways to professional coding that
    many successful British and European programmers started with before going on
    program amazing games and utilities, during the 1980s. All this was done in less
    than 48k of RAM. Some examples of the these are RARE (aka Ultimate Play the Game,
    aka ACG), The Oliver Twins (Dizzy series), Codemasters, and many more.


    BASIC stands for Beginners All Purpose Symbolic Instruction Code, so it''s perfect
    for beginners learning to code. It is friendly and fun to learn and the commands
    are logical and clearly named after the function they perform.


    Sinclair BASIC teaches logic, how to perform decisions and structure your code
    but only for simple concepts. It helps with basic math skills – and you do not
    need to be a math Guru to learn it.


    The BASIC ROM (Read Only Memory) is the operating system of the Sinclair machine
    and is setup in such a way it will not allow illegal code to be entered. Each
    line is validated by the ROM, so after entering a line you will hear an acceptance
    beep sound for a line entered correctly. If the line is incorrect, then a lower
    tone sound is used and the system prompts you to fix any incorrect code.


    A note of thanks must go to the Sinclair guys and especially Steve Vickers and
    the rest of the guys at Nine Tiles Ltd for creating Sinclair BASIC.


    # What do you need before we start?


    Any of the following configurations is fine for starting quickly:


    - a) A Real ZX Spectrum: e.g. ZX Spectrum 16k, 48k, 48K+, 128K or any further
    model.

    - b) A computer that can run an emulator: Example of some emulators for various
    platforms...


    Windows: ZX Spin, Spectacular, Speccy plus many more.


    Mac OS: Fuse


    Linux/Unix: Fuse


    iOS/Android: Spectacularator, Fuse, Speccy, Marvin


    Chrome/FF: There are a couple of online emulators that will work from a browser.
    Using Google will lead you to these, but here are two examples I know of that
    will work in your browser...


    http://jsspeccy.zxdemo.org

    http://torinak.com/qaop


    - c) Another good option is the new Recreated ZX Spectrum (Bluetooth) which works
    with Android and iOS.


    For beginners for the ZX Spectrum I would suggesting coding in 128k mode as this
    allows for typed commands and does not require combination key-presses required
    by 48k mode. But if you are up to the challenge or you want a nostalgia hit then
    by all means go for 48k or 16k mode.


    ![](img/a5b1b953bf13d825daab6d82a3f4e6b5_9_0.png)


    # Quick Start


    If you want to dive into writing your code now, and you have one of the options
    above ready-to-go, then by all means you can skip this next section and begin
    coding one of the games right now.


    # Basic Commands


    Some of the most common commands that we will be using are PRINT, IF, GOTO, GO
    SUB, DIM and LET. I will only give you an overview of each of as as this is a
    book for learning-by-doing and not meant to be used like a manual. Having too
    much technical jargon to get readers boring after a while. We need to be hitting
    the fleshy keys of the Spectrum 48k or the plastic clicks tones of the Spectrum
    128k models or your preferred emulator.


    Here is the obligatory “hello world” example that is present in nearly all coding
    books.


    ```

    10 PRINT AT 10,5;"Hello World"

    ```


    Hit Enter at the end of the line to save it in memory, then type RUN and hit enter
    again to see it working.


    The breakdown of the above example code is...


    ```

    10      = Line numbering (sequence order of the program)

    PRINT   = PRINTing on the screen (easy!)

    ```


    ```

    AT y,x = Telling the program coordinates to PRINT at where y is vertical axis
    and x is horizontal

    ```


    ```

    ; = Allows for a new sub function or for the text to print

    ```


    ```

    "Hello World" = Your text contents

    ```


    PRINT will populate text or special characters (i.e. UGs) on the screen at the
    position you specify. The ZX Spectrum workable screen is 32 character columns
    (0 to 31) wide and 22 lines long (0 to 21). The AT (operand) part of command is
    telling the command to place items at Y (line) , X (Column). There are 2 additional
    lines but these are not used with the standard PRINT command.


    The following sub functions will work inline with the PRINT command:


    - **INK <0-7>** Sets the foreground colour for the pen which prints all text and
    graphics

    - **PAPER <0-7>** Sets the colour for the paper background of the main screen

    - **INVERSE <1 or 0>** Prints and Inverse of the current INK and PAPER setup

    - **OVER <1 or 0>** Turns on / off Overprinting on the screen

    - **FLASH <1 or 0>** Flash with repeatedly alternate between the current and inverse
    colours

    - **BRIGHT <1 or 0 or 8>** Brighter versions of the colors 1 – 6 (for INK and

