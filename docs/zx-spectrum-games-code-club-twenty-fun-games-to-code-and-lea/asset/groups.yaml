    1005 BEEP 3,10; LET ink =1; IF ply=2 THEN INK=2

    1006 PRINT INK ink; AT 10,6;CHR(139); AT 11,5;CHR(137);CHR(143);AT 12,6;CHR(142)

    1010 FOR n = 1 TO 10

    1020 LET i=$INKEY($)

    1030 PRINT AT 11,8+(n-2); INK 6;";CHR(143);

