    60 PRINT AT 7,5;"Get code in sequence"

    70 PRINT AT 8,5;"Enter Colours 1 at a time."

    80 PRINT AT 18


    100 GO SUB 300: REM initial

    130 GO SUB 1000: REM main loop for game

    200 GO TO 30:


    300 REM SETUP

    310 LET turn=1: DIM c(4): DIM t$(1,1): LET col=0: LET colseq=0: LET codeseq=1

    330 RETURN


    1000 PAPER 4: CLS

