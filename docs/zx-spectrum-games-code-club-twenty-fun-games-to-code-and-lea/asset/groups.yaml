    # 点球大战


    每个人都喜欢精彩的点球大战。所以你可以在这里编写自己的 2 人版本。在这个有趣的小游戏中，时机就是一切。希望你在玩的时候时不会和任何朋友闹翻。玩得开心，不要因为沮丧而洒了茶。


    玩家：2


    规则：玩家 1 为蓝色，玩家 2 为红色。轮流进行，先达到 5 分的人获胜，证明对手至少落后 2 分。射门者出手后，守门员将机会扑救。


    控制：S = 向球门射门（尽量不要偏！），G = 守门员尝试扑救。


