    # ZX SPECTRUM GAMES CODE CLUB


    TWENTY FUN GAMES TO TYPE IN, LEARN FROM AND EXTEND


    ![](img/a5b1b953bf13d825daab6d82a3f4e6b5_0_0.png)


    Sinclair BASIC is fun and easy-to-learn.

    Type in a game, play it and then we''ll explain it.


    # Includes...


    Flappy Bird, ZX Breakout, Astral Invaders, C5 Solar Race,

    MiniPong, Retro Hunter, Takeaway Ted, Billy Bob''s Gold and many more.


    Gary Plowman


    # ZX SPECTRUM GAMES

    CODE CLUB


    Twenty fun games to type in, learn from and extend


    Gary Plowman


    # Gazzapper Games 👾


    First published in 2015 by Gazzapper Press


    http://www.gazzapper.com


    Cover design by Gary Plowman


