    我们不会逐行解释代码，只讲解重要的内容或我认为可能较难理解的部分。


    这一切意味着什么呢？嗯，第 10 到 20 行只是演示，`REM` 命令用于添加代码的任何注释或备注。


    | 10 REM **************************************** | 15 REM * 井字游戏或交叉点游戏 |

    | 20 REM ********** Gary Plowman ********** | |


    第 30 行设置了游戏的显示。`INK` 命令是笔的颜色，`PAPER` 是主屏幕区域，`BORDER` 是主屏幕区域之外的区域。边界区域很少使用，`PLOT`
    或 `PRINT` 命令无法到达那里，但可以让它闪烁以表示击中或得分。


    ```

    30 INK 7: PAPER 6: BORDER 7: CLS: LET ply=1: LET win=0: DIM a(9,2): LET sq=0

    ```


    该行的后续部分是 `CLS`。这意味着清除屏幕，如果没有 `PAPER` 命令，就无法让整个屏幕区域着色。之后使用 `LET` 命令来设置变量。变量存储值，以便在代码稍后使用或更改。


    # 数组与多维数组


    接下来的部分一点也不难，但如果你还没有理解数组（Arrays），也不要担心。数组在刚开始很复杂，最好把它们看作值的列表。


    第 30 行的最后部分是 `DIM a(9,2)` 命令（维度数组）。这是一个变量数组，工作类似于按数值排序的列表或电子表格。但如果你不理解，也许这里能解释得更好。


    第一维可以看作第 1 列，包含 9 行数据。第二部分指的是第 2 列，包含另一组 9 行数据。


    # DIM a(9,2) – 9 行 2 列


    | 列 1 | 列 2 |

    | LET a(1,1)=1 | LET a(1,2)=1 - 行 |

    | ... | ... |

    | LET a(9,1)=9 | LET a(9,2)=9 - 行 |


    上面的命令将把值存储在数组的不同部分。如果你尝试超出 `DIM` 语句中定义的数组限制，就会发生错误。Sinclair BASIC 中的数组总是从 1 开始，而不是
    0。


    # 解释 GO SUB


    `GO SUB` 命令意味着跳转到子程序。`GO SUB` 将允许程序根据提供的行号跳转到代码的另一部分然后在遇到 `RETURN` 语句时返回之前的位置。这对于将
    BASIC 程序分为逻辑部分非常有用。对于任何想要扩展的游戏的重要问题，都可以分离为 `GO SUB` 程序，这有助于你跟踪程序。


