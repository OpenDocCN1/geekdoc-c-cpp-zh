    准备好防御你的基地！外星人正在进攻！面对为了奴役你们人民的外星人侵袭，你能生存多久？《太空入侵者》的主题永远不会过，几乎每个人都体验过这款 80 年代经典游戏的版本。这个游戏有趣且上瘾，拥有精美的彩色
    UDG 图形，所以快开始编码并消灭那些外星人吧。


    - 玩家：1

    - 规则：类《太空入侵者/银河战士》的游戏，让人联想起如《星际大战》之类的桌面电子游戏。在外星人攻击你的基地之前击败它们。让它们冲过将导致失去一条生命。非常好玩！

    - 控制：z = 左，x = 右，[空格键] = 射击。


