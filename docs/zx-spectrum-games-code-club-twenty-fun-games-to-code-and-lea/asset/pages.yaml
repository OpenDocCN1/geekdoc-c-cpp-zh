- img_proc: true
  md: '# PAPER) 8 is transparent


    TAB # Moves across horizontally from left to right # spaces


    E.g. PRINT INK 2; AT 10,10;"Test"; TAB 16;PAPER 1;INK 7;1;"Print"


    As you can see you can have almost any combination of those commands on a PRINT
    statement.


    # Line Numbering


    It is good practice to leave adequate gaps in numbering your code lines so you
    can enter additional commands at a later stage. I would suggest for your own programs
    to step in increments of 10 at least. So line 10, then line 20 and so on. Sinclair
    BASIC can have a maximum of 9999 lines but lines can contain multiple statements
    when separated by a colon \”, so commands can run into tens of thousands.


    # 128k Mode and Line Numbers


    The 128k spectrum mode has another feature that is handy for new coders. If your
    program is missing a section and you did not make enough space for the commands,
    you can run RENUMBER and it will re-organise the program line numbers. There are
    limitations to this but we need not be concerned about those at this early stage.


    # UDGs (User Definable Graphics)


    You will learn how to make your own graphics with ease! So you can return to some
    of the programs in this book and add your own graphics to enhance them.


    # Machine Code'
