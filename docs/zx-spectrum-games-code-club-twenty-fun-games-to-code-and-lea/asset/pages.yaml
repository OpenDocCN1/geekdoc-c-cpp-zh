- img_proc: true
  md: 'Lines 110 to 140 with # PLOT, creating the starting points for drawing from.

    These draw the # grid for the game. PLOT command places your pen on

    t screen (making a dot). Then the DRAW command creates a line or arc.

    Lines 175 to 190 will draw the large X and O symbols to the sides of the grid

    and will also print the grid for the player controls.

    Lines 300 to 400 will run the main Game Loop, which is quite short for the

    game.


    ```

    300 REM ****** Test Press

    310 PRINT AT 18,1; INK 7; PAPER 6-ply;"PLAYER ;ply"; Choose Square 1 - 9

    320 LET i$=INKEY($)

    330 IF i$="1" AND i$<="9" LET square=VAL i$: GO SUB 100

    340 IF i$="" THEN GOTO 320

    350 GO SUB 200: REM ****** Test for Winning Conditions )

    360 IF win=0 THEN PRINT AT 18,1;"PLAYER ;win"; has WON!"; BEEP .4,3;

    BEEP 2,10: GO TO 10

    370 IF win=0 THEN PRINT AT 18,1;"GAME DRAW - RESTARTING"; BEEP

    4,3: BEEP 2,10: GO TO 10

    400 GO TO 300

    ```


