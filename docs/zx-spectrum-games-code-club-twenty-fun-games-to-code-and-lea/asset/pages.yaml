    from an action based game to a turn-based one. This was purely due to the Spectrum’s
    limits and playability. This offers more options to extend over the arcade version.
    If you wish can convert / re-write to a multiplayer (hotseat) game for 1 to four
    players, while keeping remaining players as controlled.'
