  md: '# Fun Themes


    A fun game with a funny premise. That is what a lot of the old spectrum classics
    have in common. Games like Mathew Smith’s Manic Miner and Jet Set Willy, British
    gaming is literally full of games that were based on wacky ideas. Don’t be afraid
    to experiment and have fun when making your games.


    # What’s New?


    We have used the ABS() function in our code, this is useful for calculating distances
    of objects from one another, amongst other things. This function returns the result
    as an absolute value, i.e. converting it to positive. So -1 become 1 and +1 is
    1. This allows you test for difference between two values without the need of
    worrying if the value tested is +2 or -2. The use case in our Angry Chicky game
    is to find out if Chicky has caught Timmy.


