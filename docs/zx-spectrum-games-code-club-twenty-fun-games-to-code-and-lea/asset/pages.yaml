  md: '# What’s New?


    Wackiness galore and who doesn’t love a bag of chips! The game is a queue based
    game which needs quick reflexes to get your goods out the door in the hands of
    your customers. This one might make your brain hurt.


    We created graphics with PLOTs and DRAWs rather than UDGs here as there was no
    screen action to be concerned with.


    ```

    326 INK 6: PLOT 107,102: DRAW 0-7; DRAW -5,0

    ```


    DRAW has a third parameter which is used for providing the angle of the line.
    We did not use it – but it is handy to know it’s there in case you plan to try
