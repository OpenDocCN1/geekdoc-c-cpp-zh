    The binary tree is a useful data structure for rapidly storing sorted data and
    rapidly retrieving stored data. This results in an immense increase in efficiency
    of searching and sorting.


    # 8.1 Composition


    A binary tree is composed of parent nodes, or leaves, each of which stores data
    and also links to up to at most two child nodes. It is the relationship between
    the leaves linked to and the linking leaf, also known as the parent node, which
    makes the binary tree such an efficient data structure.


    Generally, the left node has a lesser value than parent while right child has
    a greater key value than its parents. Due to these two simple rules, the efficiency
    of trees is enormous.


    As a result, the leaves on the farthest left of the tree have the lowest values
    and we already know that so if we want to get the lowest value, we only need to
    traverse to the lowermost leaf node to the left instead of going through every
    element of the tree.'
