    was designed by K.


    Thompson while working on initial versions of UNIX. B was a

    programming language


    based on BCPL, a type less systems programming language,

    developed by Martin


    Richards in 1967. Its basic data type was the machine word, and it

    made heavy use of


    pointers and address arithmetic. It is completely different from

    traditional structural


    programming, which involved use of typed commands. Although C

    initially evolved


    from Band BCPL, but it included typing.'
