    # 2.1 Preprocessors


    C compiler has a preprocessor built into it. Lines that begin with a # are called
    preprocessors. We have so far used #define and #include. The compiler processes
    these preprocessors before actually compiling a code. For example, when we defined
    a constant using #define in section 2.2, the compiler replaced all the instances
    of PI with the value specified at the start before compiling the code. Such constants
    are usually known as Symbolic constants.


    We write all the #define statements at the top of our file. It is a convention
    to write all the letters of a constant in capital. Following this convention enables
    programmers to easily identify Symbolic constants or any other constants as well.
    It is important to note that though, the preprocessor never changes the contents
    of quoted strings. For'
