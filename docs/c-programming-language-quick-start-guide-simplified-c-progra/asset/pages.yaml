- pgno: 18
  md: 'setting standards for different systems, including programming languages. Standards
    are important in a sense that everyone can have his own perspective. For example,
    while travelling in a train, what seems to be stationary for you, might be moving
    for someone outside the train. ANSI Committee X3J11 is responsible for setting
    the standard for the programming language C. In the late 1980s, the committee
    created draft standards for what is known as ANSI C or standard C. In 1990, the
    International Organization for Standardization (ISO) approved the standard for
    ANSI C as well. Thus, ANSI C, or ANSI/ISO C, is an internationally recognized
    standard for programming in C. The standard specifies the form in which programs
    are written in C and defines the standards for how these programs are to be interpreted.
    The standardization results in better portability, reliability, maintainability,
    and efficient execution of C language programs on different machines. All the
    compilers follow this standard and hence there is uniformity in interpretation
    of code.


