  md: 'language C.


    C language has rules of precedence and associativity in operators. It is critical
    in nature


    as we do not want one statement to result in two different outputs. These rules
    do not


    fully determine evaluation because we give user the power to achieve the result
    of desire


    by mastering these rules. Since expressions inside parenthesis are evaluated first,


    parentheses can be used to clarify or change the order operations are performed.


    Consider the expression:


    Answer = 30 + ( 4 * 10 / 5 -20 ) ;


    The operator “(” has the highest parenthesis in this expression so we dissect
    it before


    anything else. Then we have three operators inside parenthesis. Multiplication
    and


    division have equal precedence so we perform whatever comes first in the expression.
    In


    this case, we perform 4 * 10 and have a result of 40. We divide 40 by 5 and result
    is 8.


    We subtract 20 from 8 and the result is -12. Now that parenthesis are closed,
    we


    compute the operations outside it. We add -12 to 30 and the result is 18.'
