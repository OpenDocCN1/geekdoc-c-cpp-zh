  md: '# Chapter 2:Tokens and Syntax


    In this chapter, we explain the syntax and lexical elements of the C programming
    language. C is a high level programming language. Like other high level languages,
    it has rules and principles for putting together different components to create
    legal and working programs. These rules and principles define the syntax of the
    language.


    The program that checks on the legality of C code is called the compiler. The
    compiler translates each line of code into machine language to see if there are
    any errors. If there is an error, the compiler will print an error message and
    stop. If the compiler finds no errors, then the source code is correct, and the
    code is translated into object code. The object code is used by loader to create
    an executable file.


    As we discussed earlier, the preprocessors are processed prior to execution of
    remaining code. We can think of the preprocessor as being built into the compiler.
    This is what actually happens on some systems, whereas on others the preprocessor
    is separate. This'
  merge: -1
  img_proc: true
