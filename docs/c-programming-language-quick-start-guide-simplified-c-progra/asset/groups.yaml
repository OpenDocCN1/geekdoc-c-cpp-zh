    ### 3.4.3 Storage Class register


    register 存储类使变量作为高速寄存器工作。显然，它可能存在基于硬件的限制，因为物理空间中的寄存器数量有限。由于物理限制，当编译器发现无法将变量用作内存寄存器时，此类的变量会自动转换为
    auto 类型。


    register 类在快速执行至关重要时使用。当速度是关注点时，程序员可以选择几个频繁访问的变量并将其声明为存储类 register。寄存器在被访问以供使用或修改时所需的时钟周期数少于普通内存位置。由于寄存器存储整数值，因此
    register 变量默认也是整数。因此以下两个声明是等价的：


    ```

    extern int variable;

    extern variable;

    ```


    ### 3.4.4 Storage Class static


    Static 指的是保持其状态恒定的东西。Static 类有两个基本用途。


    主要用途与 static 这个词的含义相似：用于声明在频繁进入和退出块时仍保留其状态的变量。请记住，普通变量在块关闭后立即被释放。第二种用途是与 external
    类声明一起使用。


    这里有一个例子：


    ![](img/6d3b01499498c82f19a5187d6ebfb7f1_103_0.png)


    ```

    void demo()

    {

    int normalVariable = 5;

    static int staticVariable = 5;

    normalVariable += 10;

    staticVariable += 10;

    printf("Normal: %d\n", normalVariable);

    printf("Static: %d\n", staticVariable);

    }

    void main(void)

    {

    demo();

    }

    ```


    ```

    demo();


    demo();


    system("pause");


    }

    ```


    正如你在上面程序的输出中看到的，static 变量在第二次和第三次函数调用中也保留其先前的值。变量的 static 声明仅在函数第一次被调用时执行。之后，编译器会忽略它。下一次，static
    变量的值为 15，再加上 10 并打印出 25。第三次函数调用使用保留的 25 作为 static 变量的值并加上 10。另一方面，normal 变量一次又一次地重新初始化为
    5 并加上 10。三个函数调用中的每一个都创建了自己的 normal 变量，而 static 变量只在第一次生成，然后保留供将来引用。


    现在让我们讨论 static 外部变量。Extern 和 static 结合使用为程序员提供了更好的隐私选项。正如你所知，全局或外部变量只能被其声明之后定义的函数访问。另一方面，static
    变量取决于它们的块，可以由程序员塑造使用。


    让我们利用这一功能提供一个对一组函数而言是全局的变量，同时对文件而言是私有的。


    static 的另一种用途是作为存储类来指定函数定义和原型。这种用法会导致函数的作用域受限。Static 函数仅在其被定义的文件内可见。与可以从其他文件访问的普通函数不同，static
    函数在其自己的文件中可用，但其他文件不可用。


    ### 3.5 Default Initializations


    在 C 中，未在声明时赋值的外部变量和静态变量都会自动初始化为 0。这种默认初始化适用于数组、字符串、指针、结构体和联合体。


    与此相反，自动变量和寄存器变量不会由系统自动初始化。这意味着如果你在未初始化自动变量或寄存器变量的情况下访问它们，编译器要么生成错误，要么使用垃圾值。


