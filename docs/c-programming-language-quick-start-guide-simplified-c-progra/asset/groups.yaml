    ## Chapter 1: Let’s C


    This chapter gives an overview of the C programming language. We start with a
    brief background and discuss pros and cons of the general-purpose language. After
    that, a series of programs follows, and the elements of each program are carefully,
    line-by-line explained. We emphasize on how to use the basic input/output functions
    of C. As we discuss in detail the similarities between C and C++, you can fairly
    assume that the programs written are syntactically correct for both the languages
    and the concepts elaborated are also common. Of course, the C++ programmer has
    more capabilities using the object-oriented programming concepts.


    We recommend that everyone reads this chapter out so that they know the basics
    about C and programming in C. Everyone should read this chapter even if they don’t
    understand everything because everything is explained in detail later on, in the
    book but the introduction in this chapter is important.


    ### 1.1 Background:


    C is a procedural programming language that was originally designed by Dennis
    Ritchie at Bell in 1972. UNIX operating system used it as the systems language.
    C was designed to overcome the shortcomings of a programming language B, which
    was designed by K. Thompson while working on initial versions of UNIX. B was a
    programming language based on BCPL, a typeless systems programming language, developed
    by Martin Richards in 1967. Its basic data type was the machine word, and it made
    heavy use of pointers and address arithmetic. It is completely different from
    traditional structural programming, which involved use of typed commands. Although
    C initially evolved from B and BCPL, but it included typing.


    By the early 1980s, the language has transformed itself into what it looks like
    today, commonly known as the traditional C. ANSI standard C was introduced in
    the later part of the same decade. The committee added the void, function prototypes,
    a new function definition syntax, and more functionality for the preprocessor,
    and in general made the language definition more precise.


    ANSI C maintained its standard in an amazing way that it is still used in many
    programs as a system language. It is one of the most commonly used programming
    languages of the world, and it is found in colleges and universities for learning
    purposes. It is mostly the first programming course offered to any IT students.
    C++ is an extension of ANSI standard C which incorporates the object-oriented
    programming paradigm, which kind of revolutionized the programming world. This
    book describes the ANSI version of the C language, along with some topics in C++
    as well.


    ### 1.2 ANSI Standard C:


    ANSI stands for "American National Standards Institute." This institute is involved
