    ## 引言


    你是在寻找一本简单、完整且快速的 C 编程参考书吗？如果是，你会发现本书比市面上任何其他书都更有用。本书逐步介绍这种通用语言。本书按照程序员的方法编写，因此非常适合作为快速指南和参考书。


    强烈推荐学生将本书作为其第一门或第二门编程课程。它详细涵盖了编程的所有基本概念，如运算符、函数、决策语句、指针、数组和字符串。本书最大的优点是在书的前期部分提供了源代码及输出结果。除了学生，本书对专业人士也很有帮助，因为它对每章主题进行了全面详细的索引。


    本书通过降低主题之间的相互关联性，使读者可以有选择地阅读。我们先概述整个语言，包括简要历史、C 的基本特征、与其他语言的比较和对比。


    然后让读者熟悉 C 程序和语法。我们逐一详细讨论语法的重要组成部分。本节包含源代码，有助于激发读者兴趣并促进学习。


    我们详细学习 C 中的函数。本书讨论内置函数，并描述编写自定义函数的规则和基础知识。本章还包括编程示例。


    数组、指针和字符串是 C 语言的优势所在，因此单独在一章中讨论。这些主题密切相关，因此值得进行比较和对比讨论。


    由于二叉树的重要性，我们用一整章专门讨论二叉树。我们讨论了抽象数据类型，并研究了栈、队列和链表的示例。


    本书说明了编程语言 C 的通用用途，详细

