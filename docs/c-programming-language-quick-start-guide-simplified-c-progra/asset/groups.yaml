    - **break**：将控制传递出复合语句。

    - **case**：用于通过 Switch 根据输入进行逻辑决策编程。

    - **char**：用于定义字符类型变量。

    - **const**：使变量值或指针参数不可修改。

    - **continue**：将控制传递到循环的开始。


    ### default

    用于在 switch-case 语句中定义默认操作。


    ### do

    该关键字与 ‘while’ 一起用于一种特殊的循环。


    ### double

    该关键字用于定义类型为 ‘double’ 的变量。


    ### else

    与 ‘if’ 一起使用，用于为某个条件定义替代分支。


    ### enum

    定义一组整数类型的常量。


    ### extern

    用于表示变量在当前程序之外定义。


    ### float

    用于定义浮点类型变量。


    ### for

    用于编写 ‘for’ 循环。


    ### goto

    用于在程序中无条件地转移控制。


    ### if

    定义一个决策语句。


    ### int

    定义整数类型变量。


    ### long

    定义所需类型的 long 类型变量，例如 int。


    ### register

    将变量中的值存储到 CPU 寄存器中。


    ### return

    将控制权返回到上一个程序块。


    ### short

    用于修饰带有 ‘short’ 的数据类型变量。


    ### signed

    用作数据类型修饰符。


    ### sizeof

    返回表达式或类型的大小。


    ### static

    用于在变量的作用域结束后仍然保留该变量。


    ### struct

    根据需求定义自定义数据结构。


    ### switch

    用作决策语句，即 switch-case。


    ### typedef

    定义一个新的数据类型。


    ### union

    将共享同一存储空间的变量分组。


    ### unsigned

    用作数据类型修饰符。


    ### void

    空数据类型。


    ### volatile

    与关键字 ‘const’ 相反。


