    ## 2.6 Operators and Punctuators


    Like every other programming language, C has many characters with certain meanings.


    Examples include the Arithmetic operators which stand for the usual arithmetic
    operations of addition, subtraction, multiplication, division, and modulus, respectively.


    Modulus in mathematics returns the remainder after dividing a number by another.
    For example, the value of "a modulus b" is obtained by taking the remainder after
    dividing a by b. % is the character used for Modulus operation in C. Thus, 15%7
    has the answer 1, and 7 % 5 results in 2.


    In a program, operators can be used to separate identifiers that are involved
    in an expression. Remember, an expression is a statement that ends with a semicolon.
    It is good practice to give whitespaces between each identifier and operators
    to give better readability but it is not necessary. Compiler ignores Whitespaces
    unless they are quoted in the code. So, the following statements are identical
    to the compiler,


    ```

    X=A+B;


    X = A + B ;

    ```


    Context is very important in almost everything. Symbols change their meaning depending
    upon where and how they are used. For example consider the following two statements
    which use % symbol in two different contexts.


    ```

    printf("Owner: %s\n", OWNER);


    int x = 15 % 4 ;

    ```


    The first % symbol is the start of a conversion specification, or format which
    is related to the identifier in the later part of the expression, whereas the
    second % symbol represents the modulus operator of mathematics.


    Examples of punctuators include parentheses, braces, commas, and semicolons.


    Consider the following code:


    ```

    void main(void)

    {

    int a, b = 2, c = 3;

    a = (b * (b + c));

    }

    ```


    The parenthesis used right after main are used as an operator. By rules, they
    are used to indicate that main is a function. After the parenthesis, the symbols
    “{”, “,”, “,”, “,”, “(”, “(”, “)”, “)” and “,” are all punctuators. Both operators
    and punctuators are collected by the compiler as tokens (characters), and along
    with white space, they serve to separate language elements like identifiers, constants,
    functions, keywords, operators and others.


    Tokens depend on their context a lot. For example, as explained in the previous
    paragraph, the parentheses are sometimes used to indicate a function name while
    they can be used as punctuators as well. Another example is given by the expressions


    ```

    C = a + b ;

    ++ a ;

    a += b ;

    ```


    They all use + as a character, but ++ and += are increment and assignment operators
    respectively while the first one is a simple arithmetic operator. This dependency
    of symbols meaning on context leads to the short but more effective programming
    language C.


    C language has rules of precedence and associativity in operators. It is critical
    in nature as we do not want one statement to result in two different outputs.
    These rules do not fully determine evaluation because we give user the power to
    achieve the result of desire by mastering these rules. Since expressions inside
    parentheses are evaluated first, parentheses can be used to clarify or change
    the order operations are performed.


    Consider the expression:


    `Answer = 30 + ( 4 * 10 / 5 -20 ) ;`


    The operator “(” has the highest precedence in this expression so we dissect it
    before anything else. Then we have three operators inside parentheses. Multiplication
    and division have equal precedence so we perform whatever comes first in the expression.
    In this case, we perform 4 * 10 and have a result of 40. We divide 40 by 5 and
    result is 8. We subtract 20 from 8 and the result is -12. Now that the parentheses
    are closed, we compute the operations outside them. We add -12 to 30 and the result
    is 18.


    | Operator | Name | Description |

    |---|---|---|

    | / | Divide | Used for division of two numbers |

    | % | Modulus | Used to find remainder after division of 2 numbers |

    | ~ | Negation | Binary operator, used to invert the boolean value |

    | & | Bitwise AND | Used to perform logical AND on every bit |

    | \| | Bitwise OR | Used to perform logical OR on every bit |

    | ^ | Power | Used to compute power of a number |

    | << | Left Shift | Used to shift bits to the left |

    | >> | Right Shift | Used to shift bits to the right |


    Let us now see an example of using these operators in a program:


    ```

    #include "iostream"


    void main(void)

    {


    int A = 50, B = 17;


    bool Alive =false;


    printf("This is a Program to demonstrate use of Arithmetic Operators in C\n");


    printf("Sum: %d\n", A + B);


    printf("Difference: %d\n", A - B);


    printf("Product: %d\n", A * B);


    printf("Division: %d\n", A / B);


    printf("Modulus: %d\n", A % B);


    printf("Negation: %s\n", ~Alive? "true":"false");


    printf("Bitwise AND: %d\n", A & B);


    printf("Bitwise OR: %d\n", A | B);


    printf("Bitwise XOR: %d\n", A^B);


    printf("Left Shift: %d\n", A<<2);


    printf("Right Shift: %d\n", A>>2);


    system("pause");

    }

    ```


