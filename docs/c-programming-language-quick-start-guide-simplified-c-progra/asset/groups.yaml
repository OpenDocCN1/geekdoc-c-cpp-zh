    \n## 第7章：结构体\n\nC 是一种易于扩展的语言。它可以使用头文件和标准库来使用某些函数和宏进行扩展。它也可以通过定义由基本类型构造的数据类型来扩展，例如数组，它是一组默认数据类型变量。\n\
    \n结构类型用于表示异构数据。结构体具有称为成员的组件。结构体是为程序员的方便而设计的，以便他们可以定义自己的数据类型，该类型可能包含多个成员。每个成员可以是默认数据类型或另一个结构体。由于结构体的组件可以是各种类型，程序员可以根据自己的需求设计它们。\n\
    \n### 7.1 声明\n\n结构体允许程序员将不同类型的变量集成在一起。\n\n数组用于存储相同类型的变量。作为一个简单的例子，让我们定义一个描述学生的结构体。学生具有各种不同类型的属性，如\
    \ Name、Course、Section、CGPA 和 ID。学生可以用 C 中的结构体来定义。我们可以使用关键字 struct 如下声明学生的结构体类型：\n\
    \n```c\nstruct Student\n{\n    char *Name;\n    int Course, ID;\n    char Section;\n\
    \    double CGPA;\n};\n```\n\n此声明创建派生数据类型 struct Student。它是一个用户定义的数据类型。已定义的结构体可用于定义此用户定义类型的标识符。标签名或标识符连同关键字\
    \ struct 用于声明 Student 类型的变量：\n\n```c\nstruct Student s1, s2, s3;\n```\n\n上述对结构体变量的声明为标识符分配存储空间，这些标识符现在代表一个\
    \ Student。声明这些标识符的另一种方式如下：\n\n```c\nstruct Student\n{\n    char *Name;\n    int\
    \ Course, ID;\n    char Section;\n    double CGPA;\n} s1, s2, s3;\n```\n\n另一种声明方式，强烈推荐，因为它缩短了结构体标识符的声明，如下所示：\n\
    \n```c\ntypedef struct\n{\n    char *Name;\n    int Course, ID;\n    char Section;\n\
    \    double CGPA;\n} Student;\n```\n\n### 7.2 内存分配\n\n尽管在声明时已为这些变量分配了内存，但这些变量尚未被赋值。没有学生类型变量保存了详细信息。\n\
    \n以下是结构体类型变量的每个组件如何初始化：\n\n```c\ns1.Name = \"R Khan\";\ns1.Course = 18;\ns1.ID\
    \ = 786;\ns1.Section = 'A';\ns1.CGPA = 3.74;\n```\n\n### 7.3 成员访问运算符\n\n我们可以通过两种方式访问结构体变量的成员。上面的示例使用了成员访问运算符“.”。我们现在将进一步举例说明其用法并介绍另一个成员访问运算符“->”。这两个运算符用于相同的目的。区别在于调用者。点运算符由结构体变量使用，而箭头由指向结构体变量的指针使用。\n\
    \n```c\ntypedef struct\n{\n    char *Name;\n    int Course, ID;\n    char Section;\n\
    \    double CGPA;\n} Student;\n\nvoid printUsingPointer(Student *s)\n{\n    printf(\"\
    %s %d %d %c %f\\n\", s->Name, s->ID, s->Course, s->Section, s->CGPA);\n}\n\nvoid\
    \ main(void)\n{\n    Student s1, s2;\n\n    s1.Name = \"R Khan\";\n    s1.Course\
    \ = 18;\n    s1.ID = 786;\n    s1.Section = 'A';\n    s1.CGPA = 3.74;\n\n    s2.Name\
    \ = \"Ali Khan\";\n    s2.Course = 18;\n    s2.ID = 890;\n    s2.Section = 'A';\n\
    \    s2.CGPA = 3.14;\n\n    printf(\"%s %d %d %c %f\\n\", s1.Name, s1.ID, s1.Course,\
    \ s1.Section, s1.CGPA);\n\n    printUsingPointer(&s2);\n\n    system(\"pause\"\
    );\n}\n```\n\n以下是一些语句以及等效的访问方法也列出：\n\n```c\nstruct Student s, *p = &s;\n\ns.Section\
    \ == 'A';\n\ns.Name = \"Khan\";\n\ns.ID = 786;\n```\n\n| 表达式 | 等价表达式 | 值 |\n|---|---|---|\n\
    | s.grade | p->grade | ‘A’ |\n| s.Name | p->Name | \"Khan\" |\n| (*p).ID | p->ID\
    \ | 786 |\n| *p->Name + 1 | (*(p->Name)) + 1 | D |\n| *(p->Name + 2) | (p->Name)[2]\
    \ | S |\n\n### 7.4 定义\n\n所有由程序员初始化的外部和静态变量，包括结构体变量，除非另有指定，否则系统会自动将其初始化为零。在传统的\
    \ C 中，只有外部和静态变量可以被初始化。ANSI C 也允许自动变量，包括结构体，进行初始化。初始化结构体的语法与初始化数组的语法非常相似，因为结构体也使用大括号取值。声明中的结构体变量可以通过在其后加上等号进行初始化\n\
    \nADT 栈是一种遵循后进先出（LIFO）原则的对象容器。这意味着你只能访问最近输入的元素。栈是一种受限访问的数据结构 - 元素只能在栈顶添加和移除。要访问其他元素，需要移除它们上面的对象。栈实现只需要两个主要操作：push\
    \ 和 pop。Push 指的是在栈顶添加一个元素，而 pop 则移除栈顶的项目。一个有用的类比是想象一根钢杆上的哑铃堆；你只能移除最上面的哑铃，也可以在顶部添加新的哑铃。\n\
    \n我们现在开发并实现 ADT 栈，这是最有用的标准数据结构之一。可以为栈实现的典型操作有 push、pop、top、empty、full 和 reset。push\
    \ 和 pop 操作前面已讨论过。empty 运算符测试栈是否为空，并返回布尔值。full 运算符测试栈是否已满，也返回布尔值。reset 运算符移除栈的所有元素并对其进行初始化。\n\
    \n我们将使用固定长度的 char 数组来存储栈的内容。栈顶将是一个名为 top 的整数值成员。上一段讨论的各种栈操作将作为函数实现，每个函数的参数列表都包括一个指向栈的指针类型的参数。使用指针可以避免复制大的栈值，从而提高效率。\n\
    \n下面是一个完整的 C 程序，它实现了栈的各种函数：\n\n```c\n#define MAX_SIZE 50\n\nint stack[MAX_SIZE];\n\
    \nvoid push();\n\nint pop();\n\nint is_empty();\n\nint peek();\n\nint TOP = -1;\n\
