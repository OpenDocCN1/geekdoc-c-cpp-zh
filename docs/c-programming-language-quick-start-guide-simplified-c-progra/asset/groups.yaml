    # 8.1 Composition


    A binary tree is composed of parent nodes, or leaves, each of which stores data
    and also links to up to at most two child nodes. It is the relationship between
    the leaves linked to and the linking leaf, also known as the parent node, which
    makes the binary tree such an efficient data structure.


    Generally, the left node has a lesser value than parent while right child has
    a greater key value than its parents. Due to these two simple rules, the efficiency
    of trees is enormous.


    As a result, the leaves on the farthest left of the tree have the lowest values
    and we already know that so if we want to get the lowest value, we only need to
    traverse to the lowermost leaf node to the left instead of going through every
    element of the tree.'
  - '[PAGE 185]


    Similarly, the leaves on the right of the tree have the greatest values and therefore
    if we need to find the highest number, we just need to traverse to one side of
    the tree and we can reach the destination much quicker than a program which used
    sorting and searching algorithms to accomplish this task.


    More importantly, as each leaf connects to two other leaves, it is the beginning
    of a new, smaller, binary tree. Due to this reason, it is possible to easily access
    and insert any type data in a binary tree at any point of time, using search and
    insert functions recursively called on successive leaves and maintaining the order
    of tree as well. The newly inserted node always goes to the right place.


