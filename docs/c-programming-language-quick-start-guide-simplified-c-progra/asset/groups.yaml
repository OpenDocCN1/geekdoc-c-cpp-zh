    ## 2.5 字符常量


    本节讨论在特定情况下具有特定含义的字符常量。字符字面量用单引号括起来，例如 ''a''，可以存储在简单的 char 类型变量中。


    字符字面量可以是普通字符、转义序列或通用字符。


    一个紧密相关的话题是字符串常量，也叫字符串字面量，它是由一对双引号括起来的字符序列，例如 “Khan”。有趣的是，字符串常量由多个字符组成，但编译器会将其视为一个单独的标记（token）。字符串以字符数组的形式存储。不过，务必要注意字符串常量与字符常量是不同的。例如，''a''
    和 "a" 并不相同。实际上，“a” 包含两个字符：第一个是 ‘a’，下一个是 ''\0''，后者表示 NULL。


    C 语言提供了一些含义预定义的字符常量，例如我们多次使用过的 “\n” 来表示新行的开始。这类字符被称为转义序列。请记住，这些字符及其含义适用于写在双引号内作为字符串的情况。以下是常见的转义序列字符列表：


