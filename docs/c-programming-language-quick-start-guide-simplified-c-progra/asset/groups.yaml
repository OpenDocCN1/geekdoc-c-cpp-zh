  - '[PAGE 18]


    setting standards for different systems, including programming languages. Standards
    are important in a sense that everyone can have his own perspective. For example,
    while travelling in a train, what seems to be stationary for you, might be moving
    for someone outside the train. ANSI Committee X3J11 is responsible for setting
    the standard for the programming language C. In the late 1980s, the committee
    created draft standards for what is known as ANSI C or standard C. In 1990, the
    International Organization for Standardization (ISO) approved the standard for
    ANSI C as well. Thus, ANSI C, or ANSI/ISO C, is an internationally recognized
    standard for programming in C. The standard specifies the form in which programs
    are written in C and defines the standards for how these programs are to be interpreted.
    The standardization results in better portability, reliability, maintainability,
    and efficient execution of C language programs on different machines. All the
    compilers follow this standard and hence there is uniformity in interpretation
    of code.


    # 1.3 Strengths of C:'
  - '[PAGE 19]


    The programming languages that are being used today are so powerful that nothing


    remains impossible. But this power depends directly on how vast a language is,
    which is


    determined by number of reserved keywords. C has fewer keywords than Pascal, but
    it is


    more powerful than it. The power of C lies in the unrestricted structure of programming


    in it. Although, C has its limitations like any other language but it comes as
    the best in


    its capacity. Because C is a small language, hence it is ideal to start your programming


    career from it. It is easy to master when compared with other languages. Once
    you have


    mastered C, you can then easily move on to the more powerful and vast languages.


    We will now briefly discuss the strong characteristics of C, which will motivate
    the


    readers to program in C.


    +   • UNIX is a major interactive operating system on workstations, servers, and
    mainframes. C is the basic language used on UNIX platform. Many windowing packages,
    database programs, graphics libraries, and other large-application packages are
    written in C.'
  - '[PAGE 20]


    +   - C is portable. Code written on one machine can be easily moved to another.
    The programmer is provided with a standard library of functions that work independently
    of machines. Even if there is a system dependent code, the programmer is given
    the capability to single it out using preprocessor provided by C.

    +   - Personal Computers used C as their programming language.

    +   - C is small but has a very powerful set of operators. Some of these operators
    allow the programmer to access the machine at the bit level. For example, a powerful
    increment operator “++” can manipulate the machine in the same way as machine
    code does. This results in higher efficiency as other languages require multiple
    statements to complete the equivalent task.

    +   - C is modular. C uses the external functions, for which arguments are passed
    using call-by-value technique. Pointers are used for passing arguments using call-by-reference
    technique. The nesting of functions is not allowed. Using the storage'
  - '[PAGE 21]


    class static within files provides a limited form of privacy. These features,
    along with tools provided by the operating system, readily support user-defined
    libraries of functions and modular programming.


    +   - C laid the basis for C++ and Java. This can be clearly seen by analyzing
    the common attributes and functionalities of these languages. C++ and Java support
    the basic structure of functions, methods or routines in C++ or Java. The primitive
    data types are retained as well. Thus, learning C prior to learning C++ or Java
    is a good thing.


    +   - Certain constructs in C are dependent on machines, implementation of these
    constructs is up to the programmer to support the targeted machine(s). Thus, C
    can support multiple machines.


