    ## 第1章：开始学 C


    本章概述 C 编程语言。我们先介绍简要背景，并讨论这种通用语言的优缺点。之后是一系列程序，并对每个程序的元素逐行仔细解释。我们重点介绍如何使用 C 的基本输入/输出函数。由于我们详细讨论了
    C 与 C++ 之间的相似之处，你可以相当有把握地认为，所编写的程序在两种语言中语法都正确，所阐述的概念也是共通的。当然，C++ 程序员利用面向对象编程概念可以拥有更多能力。


    我们建议每个人都读完本章，以便了解 C 和 C 编程的基础知识。即使不能理解所有内容，每个人也都应该阅读本章，因为所有内容都会在本书后面详细解释，但本章的引言很重要。


    ### 1.1 背景：


    C 是一种过程式编程语言，最初由 Dennis Ritchie 于 1972 年在贝尔实验室设计。UNIX 操作系统将其用作系统语言。C 的设计是为了克服编程语言
    B 的缺点，B 是 K. Thompson 在开发早期版本的 UNIX 时设计的。B 是一种基于 BCPL 的编程语言，BCPL 是由 Martin Richards
    于 1967 年开发的一种无类型系统编程语言。它的基本数据类型是机器字，并且大量使用指针和地址算术。它与涉及使用带类型命令的传统结构化编程完全不同。尽管 C
    最初由 B 和 BCPL 演化而来，但它包含了类型化。


    到 20 世纪 80 年代初，该语言已经转变为我们今天所看到的样子，通常称为传统 C。ANSI 标准 C 在同一个十年的后期被引入。委员会增加了 void、函数原型、新的函数定义语法，以及预处理器更多功能，并且总体上使语言定义更加精确。


    ANSI C 以惊人的方式保持了其标准，至今仍作为系统语言用于许多程序中。它是世界上使用最广泛的编程语言之一，并被高校用于教学目的。它通常是面向任何 IT
    学生开设的第一门编程课程。C++ 是 ANSI 标准 C 的扩展，融合了面向对象编程范式，这在某种程度上彻底改变了编程世界。本书介绍 ANSI 版本的 C
    语言，同时也涉及 C++ 的一些主题。


    ### 1.2 ANSI 标准 C：


    ANSI 代表“美国国家标准学会”。该学会参与


