    \n## 第 6 章：数组、指针和字符串\n\nC 提供了一种数据结构，它通过将每个值与一个下标关联，从而可以在其中存储多个相同类型的值。它在常见编程中极其有用。例如，你需要存储\
    \ 50 名学生的成绩，不必声明 50 个单独的变量，只需使用一个大小为 50 的数组即可。通过指定其索引或下标即可访问每个元素。\n\n数组是一种随机访问数据结构，其中每个元素都可以在常数时间内直接访问。随机访问的一个典型例子是书——书的每一页都可以独立于其他页打开。\n\
    \nC 中的数组由连续的内存位置组成，这意味着它们在内存中放在一起。数组的最低成员（首元素）具有最低地址，数组的最后一个成员被分配最高的内存地址。\n\n\
    在 C 中，数组和指针是密切相关的概念。有趣的是，数组名本身就像指针一样起作用，而指针和数组一样可以被索引。“按引用传递”机制基于指针。该机制允许程序员从一个作用域更改另一个作用域中局部变量的值。C\
    \ 通过在函数定义中指定指针参数来实现这一点。字符串也是字符的一维数组。它们将在下一章讨论。\n\n### 6.1 一维数组\n\n一维数组指一维数组。此类数组可以看作包含固定数量元素的单行或单列。它们只有一个索引。数组除了有索引之外，就像普通变量一样。索引始终从\
    \ 0 开始，到 (arraySize-1) 结束。\n\nC 中数组声明的一般格式如下：\n\n```c\nType arrayName [arraySize];\n\
    ```\n\nType 指数组的数据类型，后面是标识符，最后是括在方括号中的数组大小。\n\n数组的存储类可以是 automatic、static 或 extern，但不能是\
    \ register。ANSI C 支持使用初始化器初始化所有三种类型的数组，但传统 C 只允许对 static 或 extern 寄存器这样做。\n\n\
    初始化一维数组的一般格式如下：\n\n```c\nType identifier [size] = {list of elements separated\
    \ by commas}\n```\n\n下面是使用初始化器使用一维数组的示例：\n\n```c\nvoid main(void)\n{\n    int\
    \ table[10] = { 5, 10, 15, 20, 25, 30, 35, 40, 45, 50 };\n\n    //printing elements\
    \ of array\n    for(int i = 0; i < 10 ; i++)\n    {\n        printf(\"5 x %d =\
    \ %d\\n\",i+1,table[i]);\n    }\n    system(\"pause\");\n}\n```\n\n下面是使用循环而非常见初始化器来初始化一维数组的示例：\n\
    \n```c\nvoid main(void)\n{\n    int table[10];\n\n    //initialization of array\n\
    \    for(int i = 1; i <= 10 ; i++)\n    {\n        table[i-1] = i * 5;\n    }\n\
    \    //printing elements of array\n    for(int i = 0; i < 10 ; i++)\n    {\n \
    \       printf(\"5 x %d = %d\\n\",i+1,table[i]);\n    }\n    system(\"pause\"\
    );\n}\n```\n\n![](img/6d3b01499498c82f19a5187d6ebfb7f1_146_0.png)\n\n输出：两个程序相同。\n\
    \n### 6.2 指针\n\n程序中的简单变量存储在机器中某个内存位置（或地址）的一定数量的字节中。指针本质上是保存这些地址而非实际值的变量。这些地址可以被访问，因此实际值也可以通过指针的“引用”来访问。指针在程序中用于\n"
