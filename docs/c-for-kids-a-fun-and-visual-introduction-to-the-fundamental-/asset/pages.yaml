  md: '# void


    Data/return type that allows a null (empty or invalid) value.


    # int


    Data/return type that allows identifiers to store an integer.


    # string


    Data/return type that allows identifiers to store a group of characters. Since
    string is not included in the iostream file, to use it, #include<string>.


    # main ()


    Necessary and primary function that executes code.


    # function


    A group of statements that are executed when the function name is called in main.


    ![](img/c250f5b4c5b7fab1cd6ff30d8c375a1f_27_0.png)'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# array


    Allows identifiers to store multiple data. The number within the braces is how
    many pieces of data it can store. int A[2] is said [array A sub 2]. Array A can
    hold 2 integers.


    ![](img/c250f5b4c5b7fab1cd6ff30d8c375a1f_28_0.png)


    # identifier


    The name of a variable, which is made known to the compiler by using data types.


    # if


    A statement that lets the computer make a choice based on the condition.


    ![](img/c250f5b4c5b7fab1cd6ff30d8c375a1f_28_1.png)


    # for/while Loop


    A statement that repeats until the condition proves false.


    ![](img/c250f5b4c5b7fab1cd6ff30d8c375a1f_28_2.png)


    # endl \n


    Used to visually end a line when using cout.'
