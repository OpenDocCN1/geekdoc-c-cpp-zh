    # Glossary


    # compiler


    A computer program that translates C++ language into machine language so the computer
    can understand it.


    # #include


    Tells the compiler to refer to another, already created file. Use <> to surround
    the file name.


    # iostream


    Said as [I O stream] for Input and Output. A previously created file that adds
    the use of input and output.


    # using namespace std


    Said as [using namespace standard]. A commonly used statement that includes std::
    before standards like cout and cin so we don''t have to


    ```

    C-OUT

    ```


    cout

    Said as [c out]. The standard output for the language.'
  - '[PAGE 26]


    # cin


    Said as [c in]. The standard input for the language.


    # <<<<


    Insertion Operator. Used with cout to display text or values.


    # >>


    Extraction Operator. Used with cin to obtain values or other input from the user.


    # //


    Designates any preceding information as comments and are ignored by the compiler.


    # ;


    Ends a c/c++ statement. Very similar to the way a period (.) ends a sentence in
    the English language.


    # " ""


    Used with cout to output text within the quotations.


    ![](img/c250f5b4c5b7fab1cd6ff30d8c375a1f_26_0.png)


