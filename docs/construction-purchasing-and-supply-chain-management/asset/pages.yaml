- pgno: 1
  md: "# # A Comprehensive Guide to Construction Supply Chain Management\n\nDevelop\
    \ a highly efficient construction supply chain management (CSCM) solution that\
    \ decreases risk and increases profitability. This authoritative volume provides\
    \ proven strategies for the lean construction approach, including just-in-time\
    \ purchasing, supplier evaluation, subcontractor selection, subcontractor relationship\
    \ management, equipment acquisition, information sharing, and project quality\
    \ management. There are numerous illustrations and ready-to-use forms—and a step-by-step\
    \ economic evaluation for equipment acquisition.\n\nConstruction Purchasing and\
    \ Supply Chain Management explains how to achieve maximum integration with upstream\
    \ and downstream supply chain members using the latest technologies. You will\
    \ be able to establish a strategic CSCM framework to meet the budgetary and scheduling\
    \ goals of any project. This comprehensive, step-by-step guide to CSCM is useful\
    \ for project owners, design engineers, architects, prime contractors, subcontractors,\
    \ suppliers, and construction managers involved in construction projects throughout\
    \ the world.\n\n**Discover how to:**\n\n+   - Ensure the on-time and cost-effective\
    \ delivery of materials, equipment, and services\n+   - Effectively negotiate\
    \ with suppliers and subcontractors\n+   - Manage superior subcontractor and supplier\
    \ relationships\n+   - Evaluate and select suppliers based on their value-added\
    \ capabilities\n+   - Analyze and negotiate subcontracting services\n+   - Plan\
    \ for, purchase, and lease construction equipment\n+   - Leverage technology,\
    \ safety measures, and information sharing to increase productivity and profitability\n\
    +   - Understand the components of horizontal and vertical construction supply\
    \ chain operating models\n\nUSD $59.95 / GBP £39.99  \nISBN 978-0-07-154885-4\
    \  \nMHID 0-07-154885-8\n\n![](img/5a99b8094bd51e396d3bb39b49a21371_1_0.png)\n\
    \nLearn more. Do more.  \nMcGraw Hill  \nMHPROFESSIONAL.COM  \nConstruction"
