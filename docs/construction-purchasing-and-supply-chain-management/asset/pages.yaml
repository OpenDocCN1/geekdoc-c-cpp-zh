  md: 'considered “off balance” sheet transactions where lease payments are simply
    reported as an expense. A leasing arrangement can actually increase a firm’s borrowing
    capacity. Most loans require the borrower to place a reasonable down payment.
    Leases generally do not require an initial down payment beyond the first and last
    monthly payment.


    +   - *Risk of obsolescence:* In the case of fast-moving technology, it is possible
    for the lessee to shift the risk level to the lessor. Computer technology is a
    good example of the risk of obsolescence.

    +   - *Salvage value:* The lessor is responsible for the salvage value of the
    leased assets. If the expected salvage value is high for leased equipment, the
    cost of ownership to the lessee may be lower. In this case, the lessee should
    write a contract that will enable it to buy the fixed asset at the end of the
    lease term.

    +   - *Maintenance:* In most lease agreements the responsibilities and risks for
    each party are spelled out in detail. If the lessor assumes the costs of maintenance,
    insurance, and taxes, it will usually pass the expense to the lessee in the form
    of increased lease payments.

    +   - *Discount rate:* The after-tax borrowing rate is commonly known as the discount
    rate. Both leasing and buying involve cash outflows over an extended period. Since
    the lease payment is fixed and other costs associated with the lease (salvage
    value, operating expenses, and interest rates) are uncertain, it is important
    to evaluate the implicit interest rate for a lease-versus-buy decision.


    # ### Lease versus Borrow and Purchase


