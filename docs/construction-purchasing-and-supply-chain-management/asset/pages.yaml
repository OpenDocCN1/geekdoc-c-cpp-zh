    the best leader?), egocentrism (is pride creating a myopic strategy?), and finally,
    a deficiency of mutuality (are profits and rewards shared equally?).


    On the basis of the above barriers to supply chain management, development of
    an integrated supply chain remains an extremely difficult task. It represents
    a new way of doing business, and most construction firms are not prepared or even
    necessarily willing to effectively integrate the chain. Though it is perhaps a
    distant goal, the concept of supply chain management remains a critical factor
    for the long-term success of construction firms. While complete supply chain management
    may be out of reach for most construction firms, application of its concepts will
