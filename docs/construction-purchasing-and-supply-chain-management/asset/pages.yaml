  md: '# ## CHAPTER 6


    # # Construction Equipment Planning, Purchasing, and Leasing


    # ### Profitable Innovations


    The acquisition of capital equipment is a major decision in most construction
    firms from an organizational standpoint and in terms of the impact on the firm’s
    financial health. Equipment investments can require substantial expenditures and
    are made with the expectation that the returns will be extended over several years
    or multiple projects. The tax planning process is also an important factor in
    the equipment acquisition decision. The timing of both the expected returns and
    the tax effects are critical and can contribute favorably to the bottom line of
    a successful construction company. Depending on the size of the organization,
    most high-value capital equipment purchases are processed at the superintendent
    level and above. However, the purchasing/supply manager still serves a critical
    role in the equipment acquisition process. In most large construction organizations,
    there is typically an equipment buyer with expertise in the construction industry.
    Most equipment costs are pegged to the construction industry norms. Sometimes
    it is more cost-effective to purchase equipment at auctions rather than from traditional
    sources. The purchasing department should be familiar with these sources and continuously
    look for effective equipment purchasing opportunities because equipment investment
    decisions are not easily reversible once they are made.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '![](img/5a99b8094bd51e396d3bb39b49a21371_119_0.png)


    **FIGURE 6.1** The construction equipment acquisition process.


    The acquisition process can be shown with a construction capital equipment acquisition
    flow diagram. See Fig. 6.1. Depending on the equipment category and the economic
    environment, the process may be slightly modified. Short-term equipment investment
    decisions depend on the estimated work quantities on specific projects. An effective
    “rule of thumb” for the short-term equipment investment decision is that if the
    equipment will be utilized at least 1500 hours per year and it pays for itself,
    it should be purchased. Otherwise a lease or rental option may be more appropriate.
    On the other hand, long-term equipment investment decisions are sometimes driven
    by the tax effect of acquiring equipment now rather than later. There are numerous
    steps in the construction equipment acquisition process. Each cross-functional
    step is a subsystem of the entire process, which is closely related to a variety
    of other subsystems in the process.'
