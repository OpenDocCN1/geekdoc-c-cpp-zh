  md: '# CHAPTER 8


    # Construction Supply Chain Management Business Models


    # A Road Map for Success


    The construction industry has become increasingly more complex. There has been
    significant growth in construction projects in domestic markets and in emerging
    free market economies throughout the world. Horizontal and vertical construction
    projects are increasing at an impressive rate. The construction of bridges, highways,
    schools, housing developments, hospitals, apartment buildings, manufacturing facilities,
    and levies has led to an explosion in construction knowledge. What follows is
    a general categorization of two construction supply chain business models that
    encompass the various types of construction projects.


    # Public and Private Sector Heavy Construction and Horizontal Supply Chain Models


    Projects in heavy construction or horizontal segment are the most complicated
    and require the highest levels of technical, financial, and managerial expertise.
    This market sector also requires sophisticated materials handling and placement
    methods. The characteristics of the heavy construction supply chain market segment
    are:


    +   - Dams, bridges, flood control highways, airports, interchanges, and the like

    +   - Large projects—petroleum refineries, nuclear plants, and the like'
  merge: -1
  img_proc: true
- pgno: 161
  md: '+   - Large global market potential

    +   - Requires high levels of engineering

    +   - Accounts for 25 to 30 percent of the annual construction costs in the United
    States


    There is also an increasing international demand for this market segment. The
    design phase in this sector is controlled by civil engineers. The construction
    phase is characterized by fleets of heavy equipment: cranes, earthmovers, and
    trucks, which are used extensively for these projects. Almost all of these projects
    are publicly financed and inspected by civil engineers who work directly for the
    project owner, typically a government agency. The prime contractor must be highly
    qualified in engineering, geology, planning, scheduling, and control. The industrial
    sector is heavily capitalized with significant engineering expertise. There are
    only a few companies qualified to operate at this level. For example, Halliburton
    and Brown-Root both are engaged in infrastructure projects in Iraq.


    The heavy highway market is regulated by state departments of transportation (DOTs)
    and the Federal Highway Administration (FHWA). The DOT is the project owner and
    contract administrator and FHWA is the custodian of the Federal Highway Trust
    Fund, which is primarily funded by taxes on motor fuels. The FHWA disburses the
    gas tax moneys to state governments to fund road construction. The DOTs match
    the federal funds at a rate of 10 to 20 percent state money versus 80 to 90 percent
    of federal funds. The FHWA is responsible for oversight of federal aid highway
    projects. The 1956 Federal Aid Highway Act was the seminal legislation that created
    the highway trust fund and system for building roads and bridges which has been
    implemented in all states and the District of Columbia. What makes this sector
    significant is the similarity in operations and processes across all of the state
    DOTs. Most DOTs have a corporate and district offices with in-house engineers
    and staff who play a critical role in contract and project administration. Each
    DOT has its own standard specifications that apply to its respective projects.
    Interestingly enough, as between the state DOTs, sections of the standard specification
    manuals are similar in terms of organization and definitions. The dedicated transportation
    function within state governments has been replicated on a smaller scale by local
    municipalities and county governments.


    Because of the financial and technical complexities of the heavy highway projects,
    most states require that prime contractors be prequalified. Prequalification is
    a measure of a firm''s capacity and capabilities based on financial information,
    equipment, personnel, and relevant past experiences. The heavy supply chain market
    requires specific engineering expertise and managerial skill. Some states even
    require that subcontractors meet prequalification standards similar to the'
  merge: -1
