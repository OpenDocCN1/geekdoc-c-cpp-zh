  md: 'will be an important factor in determining whether a construction organization
    is profitable.


    # ### Single versus Multiple Sources


    Much debate has taken place concerning the number of suppliers a firm should use.
    One side of the debate is the multiple-sources side, which involves the use of
    two or more suppliers. The other side of the debate is the single-source policy,
    in which only one supplier is used to supply a particular lot of bulk materials.


    The goal of both policies is to provide the buying organization with the best
    value of a supplied lot of bulk materials. Many attributes contribute to the value
    that the buyer receives. They include risk, quality, material price, total cost,
    delivery, quality, reliability, and service (design capabilities, productivity
    improvements, research and development).


    # ### Advantages of Multiple Sourcing


    The main arguments for multiple sourcing are competition and assured supply. It
    is commonly believed that competition between suppliers for similar materials
    will drive costs down as suppliers compete against each other for more of the
    buying organization’s business. This sense of competition is at the very root
    of American thought because competition is the basis for capitalism and the backbone
    of Western economic theory.


    Multiple sources also can guarantee an undisturbed supply of bulk materials. If
    something should go wrong with one supplier, such as a strike or a major breakdown
    or natural disaster, the other supplier(s) can pick up the slack to deliver all
    the needed materials without a disruption.


    Multiple sourcing also can provide other benefits such as improved market intelligence
    and improved supplier appraisal effectiveness. Contact with many suppliers will
    allow a firm to keep abreast with new developments and new technologies as they
    emerge across the field. In addition, greater contact with suppliers will increase
    the effectiveness of evaluating a supplier’s ability and progress by comparing
    cost and production data from among suppliers.


    # ### Advantages of Single Sourcing


    The major arguments in favor of single sourcing are that, with the certainty of
    large volumes, the supplier can enjoy lower costs per unit and increased cooperation
    and communication to produce win-win relationships between buyer and seller. Naming
    a certain supplier as the single source and providing it with 100 percent of the
    contract requirements greatly reduces the uncertainty that the supplier will lose
    business to another competitor. With this contract guarantee, the'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'supplier is more willing to change its business/operating methods to accommodate
    the construction buying organization. By reducing duplication in operations in
    areas such as setup, single sources of bulk materials should be able to provide
    lower costs per lot compared to multiple sources. Spreading fixed costs across
    a larger volume should also result in an accelerated learning curve. Cooperation
    and communication is enhanced between buyer and seller with a single-source agreement
    because of the fewer number of people involved when compared to multiple sourcing.


    # ### Advantages of Dual Sourcing


    The advantages of multiple sourcing can be viewed as the disadvantages of single
    sourcing and vice versa. The best scenario would be one that included the advantages
    of both. This might be done by applying significant pressure to single-source
    suppliers or by providing significant certainty to suppliers in a multiple-sourcing
    environment. This may be accomplished through the use of supplier usage limits.
    Changing suppliers on projects regardless of single or multiple suppliers can
    be used as a form of punishment; in some instances, using the same suppliers on
    all projects can be viewed as a reward.


    Long-term contracts for specific projects can provide the stability needed to
    produce single-source results while still using more than one supplier. By servicing
    several projects, two suppliers (a single source on each project) may be able
    to achieve the economies of scale comparable to that of one supplier. When spreading
    volume over fixed costs, materials savings experience diminishing returns. If
    the volume is great enough, two firms may eventually get the returns diminished
    enough so they are comparable in price to one firm. The advantage can be attributed
    to the “economies of scale” that may occur with a single source supplier.


    # ### Long-Term Relationship Issues


    Single sourcing advocates may want to address certain issues regarding long-term
    impacts of single sourcing. In the long run, if everyone undertakes a reduction
    in supplier base, there will be fewer suppliers to deal with and overall competition
    will decrease. Supplier consolidation will give suppliers more power in the long
    run.


    Finally, many more tasks are being performed by single sources in areas such as
    engineering and design work. In what is known as “outsourced supply contracts,”
    the construction organization assigns a completed work category or service to
    a supplier and it is the supplier’s responsibility to design and produce it. The
    project owner and construction organization are only concerned with the completed
    work item. These types of situations may enable suppliers to become so specialized
    and to obtain so much expertise that the construction'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'organization cannot effectively compete with its suppliers. Construction organizations
    must be careful not to let too much of the value-added portion of their product
    be delegated to suppliers or else the construction organization’s power will be
    reduced.


    # Cross-Sourcing


    The single-sourcing/multiple-sourcing issue does not have to be viewed as a “yes
    or no” type of a decision. A hybrid approach can be used that is known as cross-sourcing.
    With this method, the supplier base is expanded without increasing the actual
    number of suppliers. For example, if supplier A can supply materials on projects
    1, 2, 3, 4, and 5 and so can supplier B, the advantages of both single and multiple
    sourcing can be achieved if supplier A supplies materials for projects 1, 3, and
    5 and supplier B supplies for projects 2 and 4. If anything happens to supplier
    A, supplier B can pick up the slack because B has the capability to supply projects
    1, 3, and 5 as well. Neither supplier suffers because overall volume remains the
    same. The reverse also can be done if supplier B fails to perform.


    # Supplier Reduction


    Regardless of one’s final analysis of the single/multiple debate, reduction of
    the supply base is recommended. If the perceived benefits outweigh the risks,
    and after careful analysis of both short-term and long-term needs, a single source
    may be appropriate. However, for operations that would be financially damaged
    if a supply stoppage occurred, then the use or development of a second source
    is wise. Assuming that it is desirable to reduce the number of suppliers, the
    question becomes “which one(s)?” The grade and hurdle methods are used to guide
    the supplier reduction analysis.


    # Grade


    “Grade” methods are those that are based on a score or grade given to the supplier
    by the buyer for some attribute. The most common attributes are quality, price,
    and delivery. The supplier’s performances in the past are kept on record and the
    suppliers receive a “report card” for performance compared to other suppliers.
    Many additional attributes can be added such as frequency of delivery, but the
    method remains the same—for each attribute and purchase transaction, the supplier
    is given a grade. These attributes can be weighted equally or used to emphasize
    what is more important to the buying firm.


    When implementing a policy of supplier reduction, it is often recommended to use
    the report card, which is usually computerized, to rank the suppliers and then
    go with the best one(s). One of the drawbacks of this method is that, many times,
    qualitative information cannot accurately be incorporated into the system—for
    example, if a design change or traffic congestion caused a shipment to be delayed.'
