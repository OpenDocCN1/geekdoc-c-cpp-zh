    +   15. Prepares contract documents.


    +   16. Awards contract.


    +   17. Conducts preconstruction meeting.


    +   18. Ensures that permits, insurance, performance bonds, DBE goals, and other
    requirements are in place before beginning the project.


    +   19. May conduct partnering meetings with supply chain members throught the
    life cycle of a project.


    The major elements of an INDOT project are presented in a flow diagram in the
    project development process (PDF). See Fig. 8.2.


    # ### The Prime Contractor (Tier 2 in the Construction Supply Chain)


    Responsibilities of the prime contractor:


    +   1. Reviews the Notice to Contractors found at http://www.in.gov/dot/div/contracts/standards/drawings/index.html.
    The notice is posted 5 weeks prior to the bid opening; it lists the type of work,
    location, qualification requirements, and the cost of the bid documents.


    +   2. Reviews contract information booklet, construction plans, specifications,
    special provisions, and additional contract requirements. In its review, the prime
    contractor is assessing the project location, special conditions, and completeness
    of the construction plans and specifications. The prime contractor also considers
    the type of contract, schedule of pay items and quantities, which can be found
    at http://www.in.gov/dot/div/contracts/standards/drawings/index.html. The prime
    contractor''s current prequalification capacity and work in progress are factors
    that affect its decision to bid.


    +   3. Submits new prequalification application at least 21 calendar days before
    bid opening date to be considered for that bid opening. Renews prequalification
    annually at least 15 calendar days before bid opening date in order to receive
    consideration for that bid opening. Prequalification determines what items of
    work a prime contractor can perform and the dollar value. To be prequalified to
    perform work over $1,000,000, the prime contractor must submit an audited balance
    sheet. The classifications of work by type include concrete base-pavement and
    resurface; bituminous base-pavement and resurface; grading, and bridges. The dollar
    value of all unearned work, including non-INDOT work, counts against the prequalification
    limits. The INDOT prequalification application form can be found at http://www.in.gov/dot/div/contracts/standards/drawings/index.html.'
