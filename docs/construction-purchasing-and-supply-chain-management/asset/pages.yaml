- pgno: 59
  md: '# **Purchase Order**


    The purchase order is the short form of a contract issued by the general contractor
    for purchasing materials, equipment, supplies, and, in some cases, professional
    services. See Fig. 2.5.


    # **Subcontract**


    The subcontract is a contract between the prime contractor and a lower tiered
    contractor. Depending on the complexity of the project, subcontractors may also
    be held liable for some or all of the provisions in the prime contract, that are
    incorporated by reference to the subcontract.


    # **Leases and other Agreements**


    A lease agreement is used to source temporary items that are not consumed by the
    project. Construction and office equipment are sometimes controlled by lease agreements.


    # **Subcontracting versus Materials Purchasing**


    There is a vast difference between purchasing materials and subcontracting. Routine
    materials purchasing is usually transactional. Subcontracting is a complex joint
    relationship between the prime and subcontracting firms. If the prime contractor
    and supply manager cannot describe what is needed, either it hasn''t been precisely
    or completely designed or the work methods have not been fully developed. The
    project owner initially seeks to source technical expertise that will evolve into
    the desired specified structure or service. Considering the dollar value and complexity
    of some construction-related subcontracts, the successful project owner and prime
    contractor will spare no effort to ensure that the very best subcontract source
    is selected. In routine materials purchasing, if a selected source fails to perform,
    the materials supplier''s contract can easily be cancelled. On the other hand,
    selecting the wrong subcontractor may be irreversible. The critical nature of
    the subcontracting sourcing process cannot be taken for granted. As can be seen,
    there are major differences between purchasing materials and subcontracting services.


    # **The Subcontracting Sourcing Process**


    The subcontracting sourcing process is driven by the following elements:


    +   1. An efficient planning and control system

    +   2. A precise list of expected deliverables'
  merge: -1
  img_proc: true
