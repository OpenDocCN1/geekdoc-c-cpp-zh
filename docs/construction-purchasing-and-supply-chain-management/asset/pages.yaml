  md: 'to reduce the project’s materials costs. When designing a certification program,
    careful attention should be paid to the selection of criteria. Good certification
    should include issues regarding equipment capability, quality assurance, financial
    health of the supplier, production scheduling methods, value analysis abilities,
    and cost-accounting methods.


    # Conclusion


    Construction organizations are not proficient at identifying the capabilities
    of their suppliers and often rationalize decisions for the selection of materials
    suppliers based on convenience. This integral function—materials supplier selection
    process—should be integrated into the supply chain management environment so that
    the availability of bulk materials is ensured. The mistakes made by many organizations
    in supplier selection can be avoided with three factors for success. Prime contractors
    should assess the core competencies and capabilities of each supplier and then
    ask if that supplier could be replaced. Since firms exit the market for various
    reasons, prime contractors should be prepared to establish alternative partnerships.
    Lastly, the prime contractor should share information with all strategic suppliers
    and request their input.


    # Reference


    +   1. Benton, W. C., *Purchasing and Supply Management*, McGraw-Hill/Irwin, New
    York, 2007.'
