  md: '# Requisition


    The capital acquisition process is initiated with a company officer or owner requesting
    equipment replacements in order to expand into new market niches. This step requires
    the authorization of the company owner, the superintendent, the project manager,
    or the executive in charge of a specific project. The requisition process is sometimes
    initiated by a “specific project,” or a low-cost financial projection. Without
    special approval, a monetary limit is usually placed on equipment acquisitions.
    As an example, some of the larger construction organizations place a limit of
    $25,000 for general “job specific” acquisitions. Capital purchases in excess of
    $25,000 require the owner’s or superintendent’s approval. Typical corporate policies
    might allow a project manager to purchase miscellaneous equipment (i.e., compressors,
    generators, trench pumps, fire pumps, etc.) in the regular course of business,
    whereas a request for a backhoe or rubber-tired vehicle might have to first be
    recommended by the owner or superintendent. The process must have built-in control
    mechanisms.


    For example, an equipment purchasing requirements plan for a water line project
    includes details for the purchase of an excavator and two dump trucks. The information
    in the equipment purchasing requirements plan will be used as input to the equipment
    pricing component of the final bid package. See Chap. 2, Table 2.4, and Fig. 6.2.
    The hourly rate for the excavator in this example and the decision to rent the
    loader and compactor are all based on information obtained from the requirements
    plan. See Fig. 6.3.


    # Company Goals and Objectives


    The next step in the process is to compare the acquisition request with the overall
    long-term objectives of the construction organization. These objectives will be
    the basis for evaluating proposals for making alternative equipment selections.
    The strategic plan and market analysis of the construction organization are important
    input data simply because any major equipment purchase will probably affect the
    segmented work category, the effective company capacity, the capabilities, and
    the company competitive priorities for many years in the future. Company goals
    may be slightly different across the construction industry, but all competitive
    construction organizations must eventually maximize profitability and minimize
    avoidable risk.


