    \n# The Construction Manager (Tier 2 in the Construction Supply Chain)\n\nSelecting\
    \ a professional construction manager is similar to selecting an architect. The\
    \ effective construction management organization must have the personnel, capabilities,\
    \ systems, and experience to complete high-quality projects on-time and under\
    \ budget. The construction manager should have experience both as prime contractor\
    \ and as a construction manager on projects of similar size and type. This requirement\
    \ of specialized experience on similar projects includes knowledge of up-to-date\
    \ work methods and inspection expertise, the supply chain concept in the vertical\
    \ sector. Lean construction methodologies coupled with state-of-the-art technology\
    \ are management systems that the construction manager should implement for the\
    \ most efficient project planning and control functions.\n\nThe construction manager’s\
    \ ability to work with the architect and interpret the design objectives is fundamental\
    \ to implementing the supply chain concept in the vertical sector. The construction\
    \ manager’s knowledge of the project requirements and owner’s ultimate usage of\
    \ the project should include a keen understanding of the project risks and the\
    \ local construction labor market. Finally, the construction manager should itself\
    \ be financially strong and have references that demonstrate honesty and prudent\
    \ financial management and controls."
