  img_proc: true
- pgno: 214
  md: 'the Architect-Consultant agreement AIA Document C401™–2007. Such incorporation
    by reference is a valid legal drafting method, and documents so incorporated are
    generally interpreted as part of the respective contract. Pursuant to Section
    9.19.3 of A295–2008, the Contractor must require each Subcontractor to be bound
    to the Contractor by the terms of A295–2008, and to assume toward the Contractor
