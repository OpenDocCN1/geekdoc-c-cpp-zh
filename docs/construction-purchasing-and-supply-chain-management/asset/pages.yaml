  md: '+   3. A system for the prequalification of subcontractors (see Chap. 5, Fig.
    5.3)

    +   4. An effective progress control system


    After these four stages have been formalized, the subcontracting sourcing process
    can proceed as shown in the three steps outlined as follows:


    +   1. *The request for quotations:* Requests for quotations are driven by the
    complexity of the scope of work. A newspaper advertisement may be sufficient for
    a simple project. On the other hand, some complex bid proposals include the following
    documents:

    +       - Specifications

    +       - Drawings

    +       - Scope of Work

    +       - Bills of Materials

    +       - Notice to Bidders

    +       - Proposal Form

    +       - Contract Form

    +       - Terms and Conditions

    +       - Shipping Instructions

    +       - Schedules

    +       - Insurance Requirements

    +       - Special Requirements

    +       - Affirmative Action Certification

    +       - Payment and Performance Bond Form

    +   2. *Bid receipt and evaluations:* Government agencies sometimes conduct public
    pre-bid meetings and bid openings, whereas private owners are less formal. In
    some cases, both governmental and private owners furnish the bidders with comparative
    bid tabulations. Governmental agencies are required by law to select and negotiate
    with the lowest responsive bidder. Private owners have the discretion to select
    and negotiate with any of the bidders.

    +   3. *Award and preparation of documents:* Governmental agencies must formalize
    the contract award by distributing a public “Notice of Award.” For materials purchasing,
    a purchase order is issued to the successful bidder. Performance and payment bonds
    are usually required to ensure that the low bidder will execute and complete the
    project and pay the subcontractors and material suppliers. See the miscellaneous
    subcontract documents in App. B.'
