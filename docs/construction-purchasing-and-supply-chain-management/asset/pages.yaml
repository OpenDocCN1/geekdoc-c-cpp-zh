    +   - What method of communication will the team use?

    +   - Who initiates communication among team members?


    Behavior toward one another


    +   - What behaviors are inappropriate?

    +   - What behaviors will the team strive for?


    Joint venture problems


    +   - What problems does the team anticipate and how will the members work through
    them?

    +   - How will the team handle rumors, confidentiality, and conflicts?


    # **Phase II: Production**


    Step 4—Plan the specified work


    +   - Lay out major steps or goals that will accomplish the mission

    +   - Break down each major step or goal into manageable tasks

    +   - Lay out time line for completion of goals and tasks

    +   - Use scheduling tools as needed'
