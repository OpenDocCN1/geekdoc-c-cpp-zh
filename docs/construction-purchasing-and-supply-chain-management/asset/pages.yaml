    are relatively inexpensive to implement.


    The primary objective of the construction organization''s purchasing department
    is to provide for a continuous improvement operation by ensuring the availability
    of bulk materials and equipment services. In a competitive environment, the purchasing
    function must ensure on-time delivery of the right goods at a reasonable price.
    There is a general consensus that quality, service, delivery time, and price are
    the key buying criteria for competitive firms. Implicit criteria such as managerial
    expertise, financial stability, and relative supplier location are important in
    the supplier selection process. Firms must also have a complete understanding
    of economic trends, innovations, and challenges in the construction industry.
