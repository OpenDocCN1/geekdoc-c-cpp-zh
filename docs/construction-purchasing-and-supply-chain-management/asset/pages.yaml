    future expectations, and long-term plans. The advantages associated with implementing
    this sort of evaluation program are that it can be implemented almost immediately
    and is the least expensive of the three systems discussed here. This method’s
    major disadvantage is its dependence on the judgment of its users. The system
    is largely dependent on the memories of personnel to explain what “unsatisfactory”
    or “good” means. With this method, there is no concrete supporting data.


    In the construction industry, establishing performance factors and measures is
    a relatively simple task for management so that some type of quantitative system
    can be developed to gauge improvement. However, design consultants are perhaps
    the most difficult to measure. When measuring service businesses, data must be
    collected on supplier attitude and response time to requests for assistance, quality
    of technical assistance, and qualifications of support staff. It is normal, therefore,
    to have a relatively simple rating scheme for services, such as outstanding, acceptable,
    and poor, along with explanations regarding specific incidents to explain the
    ratings.


    Experience is essential when using any category-based managerial evaluation system.
    For example, a simple pass/fail approach to supplier rating will work when a construction
    organization is reducing its supplier base, but should be replaced when the supplier
    base becomes more manageable. In other words, the initial improvements are easier
    and less expensive than future evaluation methods.


    # **Cost-Ratio Method**


    The cost-ratio method evaluates supplier performance using standard cost analysis.
    The total cost of each purchase of materials is calculated as its selling price
    plus the buying organization’s internal operating costs associated with the quality,
    delivery, and service elements of the purchase. Calculations involve a four-step
    approach. The first step is to determine the internal costs associated with quality,
    delivery, and service. Next, each element is converted to a cost ratio, which
    expresses the cost as a percentage of the value of the purchase. An example of
    quality costs follows:'
