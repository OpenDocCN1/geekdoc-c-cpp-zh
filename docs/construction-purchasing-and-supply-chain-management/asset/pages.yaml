  md: '+   - Familiar with the production rates of bidding firm’s labor force

    +   - Understand the difference between overhead chargeable to a specific project
    and home office overhead

    +   - Check all subcontracts for price and conformity


    Knowledge of the construction industry and the item(s) of work, efficiency with
    technology, and the ability to visualize the project after visiting the site are
    some of the more important characteristics for an estimator. The comprehensive
    process of estimating and bidding includes plan reading, preparing and analyzing
    the work break-down, and using automated spreadsheet applications. After understanding
    the documentation, the estimator should feel more capable preparing profit-producing
    estimates. In short, a good estimator must have strong practical knowledge and
    exceptional analytical abilities. The primary factors in estimating are:


    +   - Contract documents, construction plans, and specifications

    +   - Materials

    +   - Labor

    +   - Overhead

    +   - Equipment

    +   - Profit


    Labor information is the most important of the six factors. The workforce must
    be well suited for the kind of work that the firm pursues. Contractors are encouraged
    to never bid 100 percent productivity. The profit margin should be determined
    based on the perceived risk, complexity, the dollar size of the project, and current
    capacity. There is no substitute for putting in the time required and commitment
    necessary to produce an effective estimate. In the estimating stage, information
    sharing takes place between the design engineer and the project owner, and among
    the prime contractors, suppliers, and subcontractors.


    # ## Contractual Agreements


    As much as any element, the contracts used in the construction industry affirm
    a fragmented, hierarchical, single-interest, and blame-pointing environment. The
    tone and content of most construction contracts have little in common with supply
    chain objectives. Information sharing is the least common denominator in traditional
    construction models. Instead, the industry is dominated by contract documents
    that prize avoiding liability rather than accepting responsibility.


    If the supply chain were a freight train, the project owner would be the locomotive
    engine with the other freight cars vying to be linked directly to the engine.
    At two extremes, it is the architect that typically'
