    | EATCF ($) | <100,000 | 40,000 | 40,000 | 30,000 | 30,000 |

    | Discount factor ($) | 1.000 | 0.909 | 0.826 | 0.751 | 0.683 |

    | Present value ($) | −100,000 | 36,300 | 33,040 | 22,530 | 20,490 |


    $$NPV=-100{,}000+36{,}360+33{,}040+22{,}530+20{,}490=12{,}420$$


    The investment decision is


    +   - If NPV > 0, accept the Motor Grader

    +   - If NPV < 0, reject the Motor Grader


    Notice the difference between the ARR and NPV methods is the timing of the various
    EATCF cash flows. In other words, as the EATCF increases, the project becomes
    more attractive.


    # Internal Rate of Return


    Using the internal rate of return (IRR) method, a project is considered a good
    investment if the opportunity cost of capital is less than the internal rate of
    return. If the cost of capital is equal to the IRR, the project has zero NPV.
    On the other hand, if the cost of capital is greater than the IRR, the project
    has a negative NPV. The IRR will give the same answer as the NPV. The IRR is defined
    as the discount rate that will make the NPV of the project equal to zero.


    $$\sum_{t=0}^{m}\frac{EATCF_t}{(1+IRR)^t}=0$$


    For example


    $$\sum(100{,}000)+\frac{40{,}000}{(1+IRR)^1}+\frac{40{,}000}{(1+IRR)^2}+\frac{30{,}000}{(1+IRR)^3}+\frac{30{,}000}{(1+IRR)^4}=0$$


    For a discount rate of 20 percent the NPV = −$7060. Using a trial and error approach,
    the IRR can be determined. If the EATCF was $40,000 for each of the 4 years, the
    IRR would be approximately 22 percent. Since the EATCF for the last 2 years is
    $30,000 per year, the discount rate should be decreased. We calculated a negative
    NPV of −$7060 at a 20 percent discount rate; thus, we must lower the discount
    rate to let us say, 16 percent. At a 16 percent discount rate, the NPV = $138.90.
    Thus, the IRR is approximately 16 percent.


    +   - If IRR > k, accept the Motor Grader.

    +   - If IRR < k, reject the Motor Grader.


    where k = Required rate of return and m = Number of periods'
