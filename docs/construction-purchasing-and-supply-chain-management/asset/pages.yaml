    # Private and Public Sector Vertical Construction Supply Chain Models


    The vertical construction sector includes a wide range of projects from apartment
    buildings, elementary schools, and department stores in the private sector to
    universities, hospitals, and local, state, and federal office buildings in the
    public sector. The private projects in this sector are financed by commercial
    banks. Engineers and architects usually collaborate on the design phase of projects
    in this segment. The bids are packaged and categorized by system, such as mechanical,
    electrical, or structural. Typically more than 70 percent of the bid items are
    subcontracted to specialty contractors. The characteristics of the vertical-non-government
    construction supply chain market segment include:


    +   * Construction management as the predominant project delivery system.

    +   * An equipment-intensive operating environment.

    +   * Significant material costs (concrete, steel, pipe, and rock).

    +   * Mostly privately financed projects.

    +   * High levels of expertise.

    +   * Pricing based on competitive bidding.

    +   * A dollar volume that accounts for 35 to 40 percent of the all annual construction
    in the U.S.


    Public sector supply chains consist of projects ranging from small retail spaces
    in airports to hospitals to universities. Each of the projects in this market
    sector requires engineering and management capabilities. In most cases, the projects
    are financed by the federal, state, or local governments or some combination of
    the three. Architects are used to design these projects. Construction managers,
    general contractors, and subcontractors are used for executing and managing the
    construction transformation process. Projects in this market sector are highly
    centered on the actual utilization of the various facilities, which is especially
    true for hospitals, universities, and schools.


