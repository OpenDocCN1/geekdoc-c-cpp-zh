  md: 'construction market. Companies that are shifting toward a smaller subcontractor
    and supply base cannot ignore the role that relationships will play with the remaining
    subcontracted capabilities and material suppliers. Another reason that construction
    supply chain relationship management is important is the increasing shortages
    of skilled capabilities and resources. Many resources and commodity materials
    are becoming harder to acquire, and in turn, are becoming more expensive to purchase.
    With rising prices and increasingly scarce materials supply, a construction organization
    must maintain strong relationships with the subcontractors/suppliers of these
    materials (work items) to guarantee that they are the first-priority customer
    of their subcontractor/supplier; no firm can survive if it is unable to have a
    sustainable source of supply, even for scarce items.


    # Four Dimensions of Supply Chain Relationships


    One model that explains supply chain relationship management includes four behavioral
    dimensions—the four C’s; counterproductive (lose-lose), competitive (win-lose),
    cooperative (win-win), and collaborative (win-win) relationships.² Counterproductive
    relationships are those in which each firm is so focused on getting what is best
    for it that each puts the other at a disadvantage. This relationship is undesirable
    because it does not promote a positive rapport between firms involved and neither
    firm achieves their goals. Counterproductive relationships also discourage future
    dealings between firms and create instability in each firm’s reputation.


    Competitive relationships are those in which firms strive to get the very best
    arrangement possible in their negotiations and fail to see the benefits of both
    firms obtaining their goals and objectives. These firms will stop at nothing to
    make sure that they come out on top and do not care about the other firm’s well-being.
    Typically, the firm that is able to win in a competitive relationship has much
    more power than the losing firm. The more powerful firm sometimes places its focus
    on the present, not concerning itself with long-term negotiations on future projects.
    This type of relationship will also discourage an ongoing relationship to the
    detriment of both firms. There are certain situations in which a competitive relationship
    is desirable. A competitive relationship is almost always required with transactional/Tier
    3 contractors and suppliers and ensures that the construction organization can
    contract for lower prices to help keep their competitive edge in the market (e.g.,
    commodities are transactional purchases unless there is a monopoly or shortage).
    It does not matter if the relationship is not strong enough to last because, by
    definition, transactional suppliers can be easily replaced at any time.


    Cooperative relationships recognize the potential value of both firms getting
    what they want and maximize the potential of having a'
