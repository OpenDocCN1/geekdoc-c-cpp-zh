  md: 'Effective supply chain practice and effective information shar-ing are two
    sources of construction supply chain improvement. While some construction organizations
    emphasize on improving supply chain practice, others emphasize on leveraging information
    sharing among construction supply chain partners. Because these two major approaches
    are not independent, construction organiza-tions must work on both construction
    supply chain practice and information sharing simultaneously.


    This section is intended to show (1) the relationship between information sharing
    and the construction supply chain, (2) the influ-ence of supply chain information
    sharing and supply chain construc-tion projects, and (3) the impact of information
    sharing and supply chain practice on project delivery performance.


    Construction supply chain planning practices are used to process information from
    project owners, design engineers, construction managers, subcontractors, and suppliers.
    Construction supply chain planning is driven by two objectives: developing good
    estimates of project requirements and coordinating the various project activities
    upstream and downstream.


    The importance of the final estimate for the project cannot be ignored. Interaction
    and coordination within the project supply chain are important because alignment
    among the supply chain partners is necessary to achieve the project owner''s goal.
    The coordination with materials suppliers and subcontractors is critical and is
    supported by research that shows the value of the interfirm cooperation and infor-mation
    sharing. The ultimate construction supply chain objective is to complete high-quality
    projects on time and under budget. The objective is to reduce wasteful activities
    in a process as a way to improve value added content. The project process must
    be simplified and the construction resource model must be carefully managed. See
    Table 7.1.


    Construction supply chain management (CSCM) is based on the coor-dination of materials,
