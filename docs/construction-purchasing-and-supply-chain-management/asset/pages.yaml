  img_proc: true
- pgno: 125
  md: '# **Payback**


    Payback is the best known investment criterion. Payback is the number of years
    it takes to repay the initial investment. Using the Motor Grader example and given
    that the cash flows are constant and positive


    Payback = 40,000 (year 1) + 40,000 (year 2)<br>+ 20,000 (67% of year 3) = 2.67
    years


    Suppose that Hoosier Pride predetermines that the maximum payback period is 3
    years. In this case, the Motor Grader is a candidate for acceptance. On the other
    hand, if the standard payback period were set at 2 years, then, the Motor Grader
    would be rejected.


    # **Average Rate of Return**


    The average rate of return (ARR) is the average cash flow after tax divided by
    the initial investment:


    ARR = (ΣEATCF/economic life)/initial investment<br>ARR = [(40,000 + 40,000 + 30,000
    + 30,000)/4]/100,000<br>= 35%


    If ARR > the required ARR, accept the Motor Grader.


    If ARR < the required ARR, reject the Motor Grader.


    This method ignores the timing of the cash flows: What if most of the cash flows
    ($140,000) in the example problem were all lumped into 1 year? The ARR would still
    be 35 percent. Even so, the ARR is the most popular evaluation criterion used
    today.


    # **Net Present Value**


    The net present value (NPV) recognizes that a dollar today is worth more than
    a dollar tomorrow because the dollar today can be invested and begin earning interest
    immediately. This NPV is calculated by taking the present value of all expected
    cash inflows from the project minus the initial investment. If the NPV is greater
    than zero, then the investment should be made. But if NPV is less than zero, then
    the investment should not be made. This evaluation method is applied to the example
    of the purchase of a Motor Grader.


    NPV = \sum_{t=0}^{m} \frac{EATCF}{(1+k)^t}


    where k = Motor Grader’s required rate of return and m = Number of periods


    NPV = \sum \left( 100,000 + \frac{40,000}{1+k} + \frac{40,000}{(1+k)^2} + \frac{30,000}{(1+k)^3}
    + \frac{30,000}{(1+k)^4} \right)'
