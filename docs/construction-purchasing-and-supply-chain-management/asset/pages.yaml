  md: 'the parties must choose between total victory and complete loss, no bargaining
    occurs. Bargaining situations require intermediate solutions for the parties involved.
    (2) There must be a possibility for provisional offers made by those involved
    in the situation. (3) The provisional offers must not determine the outcome of
    the situation until the terms are accepted by all parties. A bargaining situation
    can be defined as an interaction where parties with certain disagreements confer
    and exchange ideas about a possible solution until a compromise is reached or
    the bargaining is terminated. This definition of bargaining is referred to as
    *explicit bargaining*. In the construction industry, distributive bargaining occurs
    between two parties who possess resources that the other one desires.


    While bargaining sometimes occurs in what has been referred to as multiopponent
    bargaining situations—where the prime contractor shops several subcontractors
    when purchasing subcontracting services or where a contractor negotiates bulk
    material purchases with several alternative suppliers—this approach cannot be
    productive in a supply chain environment. Instead, the emphasis should be on bargaining
    in a *bilateral monopoly* system. This does not rule out the influence of other
    constituencies on the two bargainers, but it does limit the bargaining to just
    two parties. The total gains from the situation must be “distributed” between
    the two parties involved and each party usually wants as much as it can get. However,
    if either party is too greedy, an agreement will not be reached. In dealing with
    distributive bargaining, the influence of both parties must be considered. Discussion,
    understanding, and agreements are vital to distributive bargaining. By the very
    nature of the prime subcontractor relationship, cooperation is important. Without
    some degree of cooperation, either party can block trading and reduce individual
    gain to zero.


    In a varying-sum schedule bargaining situation, the profits (and/or losses) of
    the respective bargainers, when added together, need not always equal the same
    fixed amount, thus the term *varying sum*. While the payoff schedules are usually
    inversely related—if one gains, the other must lose—there can be some situations
    where both parties realize a gain (or loss) not in direct proportion to what happens
    to the other bargainer. In the zero-sum bargaining situation, the profits (and/or
    losses) of the respective bargainers always sum to the same fixed amount. The
    term *zero-sum* means that what one bargainer gains, the other loses, and the
    gains (and/or losses) net out to be zero.


    Both of these bargaining situations exist in the construction industry. The varying-sum
    schedule is often found in customer service situations where the bulk material
    supplier is at or above the 90 percent service level. To go from the 90 percent
    to the 95 percent level, an improvement of only 5 percent for the prime contractor
    can mean a doubling of the costs to the supplier to attain that increased level.
    The zero-sum schedule is usually found in situations where the subcontractor’s
    cost structure is relatively fixed. The less the prime contractor agrees to, the'
