- pgno: 216
  md: 'This document may not be reproduced for project manuals. If a user wishes to
    include a sample or samples of this document in a project manual, the normal practice
    is to purchase a quantity of the pre-printed forms, binding one in each of the
    manuals.


    Unlike many other AIA Contract Documents, AIA Document A295–2008 does not include
    the AIA''s express written permission to reproduce copies of the document. The
    AIA will not permit reproduction outside of the limited license for reproduction
    granted above, except upon written request and receipt of written permission from
    the AIA.


    Rights to reproduce the document may vary for users of AIA software. Licensed
    AIA software users should consult the End User License Agreement (EULA).


    To report copyright violations of AIA Contract Documents, e-mail The American
    Institute of Architects'' legal counsel, copyright@aia.org.


    # ## USING A295–2008


    # ### Modifications


    Particularly with respect to professional or contractor licensing laws, building
    codes, taxes, monetary and interest charges, arbitration, indemnification, format,
    and font size, AIA Contract Documents may require modification to comply with
    state or local laws. Users are encouraged to consult an attorney before completing
    or modifying a document.


    In a purchased paper AIA Contract Document, necessary modifications may be accomplished
    by writing or typing the appropriate terms in the blank spaces provided on the
    document, or by attaching Supplementary Conditions, special conditions, or referenced
    amendments. Modifications directly to purchased paper AIA Contract Documents may
    also be achieved by striking out language. However, care must be taken in making
    these kinds of deletions.


    Under NO circumstances should standard language be struck out to render it illegible.
    For example, users should not apply blocking tape, correction fluid, or Xs that
    would completely obscure text. Such practices may raise suspicion of fraudulent
    concealment, or suggest that the completed and signed document has been tampered
    with. Both parties should initial handwritten changes.


    Using AIA software, modifications to insert information and revise the standard
    AIA text may be made as the software permits.'
