  md: '# # CHAPTER 7


    # # Construction Supply Chain Complexity, Profitability, and Information Sharing


    # ## The Next Generation


    The construction supply chain is an operational and strategic cycle that includes
    labor, materials, equipment, subcontracting, and a finished project. Technology,
    safety, and communications are the three elements that connect all of the components
    of the chain. The construction supply chain has even more significance because
    of the potential for participation in many complex private and public sector construction
    projects. The concept of the construction supply chain implicitly takes a strategic
    look at profitability. In the short run, contractors may be able to survive with
    losses; however, in the long run, *every construction business must* show a profit
    in order to be considered a going concern. Profit or net income is a component
    of retained earnings on the balance sheet. Retained earnings pay for the future
    by enabling contractors to buy new equipment and hire, train, and develop more
    employees. Successful construction organizations must focus on the question: “What
    is meant by profitability?” Any one of the five approaches listed below or combination
    of them will increase profits:


    +   - Increase contract revenues through niche marketing.

    +   - Decrease the total cost of construction.

    +   - Decrease overhead.'
