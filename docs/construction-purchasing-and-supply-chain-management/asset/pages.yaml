  md: 'over time. But a revised contract in a fragmented, adversarial environment
    is just that, a revision and not a new way of doing business. More is needed.
    In order to achieve integration and transparency throughout the supply chain,
    the contractual documents should be more forthright with respect to communications
    and information sharing. The content of many provisions should be completely overhauled.
    More importantly, the guiding principles for the project and management team should
