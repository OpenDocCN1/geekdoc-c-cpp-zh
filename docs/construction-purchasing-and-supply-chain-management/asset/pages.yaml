- pgno: 54
  md: '# # Purchase Order


    A purchase order is a binding contract between the construction organization and
    the supplying organization. It serves as an offer to the supplying organization
    that is accepted once the supplier signs the actual purchase order. In some instances,
    a supplier may send a confirmation of acceptance rather than sign the purchase
    order. (This mode of acceptance can be problematic if there are disputes later
    and can cause what is known as a “battle of the forms” conflict.) At any rate,
    the purchase order memorializes the terms and conditions that govern the transaction
    and supersedes any negotiations. For this reason, the construction organization
    must take extra care in preparing and wording the purchase order. The “front”
    side of the purchase order includes a description and specifications for the material,
    quantities, delivery schedules, and shipping requirements, including who pays
    for the shipment. The payment term also appears on the face of the purchase order.
    It frequently offers the buyer an incentive for early payment. For example, 2/10
    net 30 means that payments made within 10 days will be discounted by 2 percent,
    whereas payments made within 30 days must be the full amount. If engineering drawings
    or any related documents are part of the purchase order, they must be specifically
    incorporated by reference. In general, the purchase order should include all the
    information required by the construction organization to ensure acceptable performance
    and should be clear and unambiguous. In addition to custom provisions, the back
    of the purchase order will include standard boilerplate terms and conditions.
    Boilerplate provisions usually cover terms such as arbitration, third party assignment,
    applicable state law, force majeure, general warranties, and order cancellation.


    The typical distribution procedure for a purchase order includes the following:


    +   - An acknowledgement copy is sent to the supplying organization.

    +   - A copy is sent to the construction organization’s accounting department.

    +   - A copy is sent to the project manager on the jobsite.

    +   - A copy remains in the supply sourcing department.


    A copy remains with the supply manager for the project as an open purchase order.
    See Fig. 2.5. The purchase order file should include the following information:


    +   1. The executed purchase order, change orders, back charges, claims, invoices,
    and payment records.

    +   2. Specifications and design changes.'
  merge: -1
  img_proc: true
