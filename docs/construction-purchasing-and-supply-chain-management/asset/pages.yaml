    and higher material and equipment costs.


    # Supply Chain Strategy


    As competitive forces increase, project owners expect high-quality projects, on
    time completion, increased service, and decreased costs. As construction organizations
    become more competitive, a rippling effect is experienced by the suppliers and
    subcontractors. As a result of more competition and the increased cost of subcontracting
    and materials, the supply chain management concept has emerged as a competitive
    weapon. Other secondary reasons for supply chain management are the increased
    use of technology and the concept of continuous improvement.


    These new supplier/subcontractor prime contractor relationships require trust
    and commitment by all supply chain parties, which is in direct contrast to their
    historical relationships which have been far from'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'cooperative. Traditional subcontracting attitudes have always encouraged arm''s-length
    relationships with price as the dominant buying factor. Today, supply chain management
    culture looks for a more cooperative attitude between parties. Although many construction
    organizations are claiming to be interested in the supply chain management concept,
    the effectiveness of these proposed arrangements is just beginning to be studied
    in the construction industry. In reality, a single construction organization could
    participate in the supply chain in a variety of roles, as a supplier, subcontractor,
    or prime contractor.


    # ## The Project Sourcing Plan


    The sourcing plan for an awarded contract must be explicit and complete. Several
    key elements must be considered for the materials, equipment, and subcontracting
    sourcing, and an equipment plan should be included. The final step in the sourcing
    plan involves the issuance of either a purchase order or a contract. See Fig.2.4
    and Table 2.4.


