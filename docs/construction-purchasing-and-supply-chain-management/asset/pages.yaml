    # Cost-Plus Contracts


    By definition, cost-plus contracts are used where the scope of work is uncertain
    and the costs can easily become out of control. In some cases, such as emergency
    projects, where cost plus agreements are employed, the owner wants to begin construction
    even though the plans and specifications are ill defined and incomplete. In this
    arrangement, the owner pays the prime contractor for costs incurred in construction
    plus some sort of additional fee.


    The written agreement between the prime contractor and subcontractor must specify
    which costs are reimbursable. Typically reimbursable costs include all field and
    project costs including, labor, materials, equipment, overhead, insurance, and
    bond premiums. On the other hand, a contractor’s corporate office operations are
    not usually included in cost-plus agreements. In addition, the agreement should
    specify what costs should be considered when computing additional fees. Contract
    modifications and change orders can easily consume the budget. These cost overruns
    require either a diminution in quality in certain tasks, total elimination of
    certain aspects of the project, or the need for an additive change order to increase
    project funding. Cost-plus contracts can be expensive compared to lump sum contracts.
    The project owner is at a disadvantage with cost-plus contracts. The various hybrids
    of cost-plus contracts are described in the following sections.


    # Cost-Plus Fixed Percentage


    The contractor is paid actual costs plus a percentage of the total project costs.
    The contract must clearly state what costs are reimbursable.


    # Cost-Plus Fixed Fee


    The customer agrees to reimburse the contractor’s actual costs, regardless of
    amount, and to pay a negotiated fee that is unrelated to the amount of the actual
    costs.


    # Cost-Plus Fixed Fee with Guaranteed Maximum Price Contract

    and/or Bonus or Sharing Any Cost Savings


    There are several variations of the cost-plus fixed fee agreement. A *cost-plus
    fixed fee with guaranteed maximum price* is used when the contractor is paid for
    the total project cost plus a negotiated fee, but the'
