    # ## Construction Supply Chain Relationship Management


    For the purpose of the supply chain relationship discussion, we will assume that
    the owner and architect or engineer and/or construction manager relationships
    have been preestablished. (The terms *CM At Risk* and prime contractor will be
    used interchangeably.) The prime contractor takes full responsibility for coordinating
    and motivating the supply chain to deliver a high-quality project under budget
    and on time. The supply chain management approach depends on a prime contractor
    being guided by the following five fundamental principles:


    +   1. Competing by adding supply chain value and eliminating waste

    +   2. Establishing long-term relationships with subcontractors and suppliers

    +   3. Focus on supply chain value analysis and target costing

    +   4. Development of continuous improvement throughout the supply chain

    +   5. Promotion of upstream and downstream information technology


    An illustration of an integrated construction supplier relationship management
    system is given in Fig. 3.1. Construction supply chain relationships have become
    increasingly important for a number of reasons. There is a major trend toward
    contractor specialization away from building an entire project and to more subcontracting
    of a variety of bid items. However, it should be noted that in some heavy highway
    markets, 50 percent of the contract value *must* be performed by the prime contractor.
    In the private sector, the subcontracted value allocation is at the discretion
