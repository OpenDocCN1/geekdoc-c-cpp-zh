- pgno: 40
  md: '# # CHAPTER 2


    # # The Construction Supply Sourcing Process and Procedures


    > > Reengineering Construction Organizations for the Twenty-First Century


    The sourcing process for most construction firms is fragmented and not well documented.
    Since the beginning of the new millennium and even more so today, the construction
    marketplace has been in an economic and energy quandary. In addition to these
    industry wide challenges, individual construction firms have had to change radically
    in response to burgeoning technologies. Historically, the sourcing of subcontracting
    services was the most neglected element in the construction process. Only when
    the cost of materials and subcontracting services increased, did management attempt
    to investigate alternative methods to the planning and control of the acquisition
    and transformation functions in the organization. Instead, most firms emphasized
    minimizing the cost of labor. The focus on labor was logical because, by definition,
    the construction process is labor intensive. Some construction market segments
    have embraced new technologies and invested in technology-driven construction
    systems. Although these new systems are up and running, too frequently they are
    operated just like the old construction business models, thus defeating the very
    purpose the system was designed to achieve. The reality is that technology and
    advanced management systems are rapidly displacing labor.'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'As a functional area within a firm, purchasing and sourcing management grappled
    with the stigma of being labeled a clerical function. However, in the past 25
    years, construction sourcing has made many strides toward shedding this label
    and has emerged as a viable professional career path. More importantly, during
    the next decade, sourcing, supply chain management, and continuous improvement
    are likely to contribute to profitability more than any other functions in the
    construction industry.


    The life cycle of a typical construction project consists of the following stages.
    (Fig. 2.1):


    +   1. Conceptualization

    +   2. Engineering and design

    +   3. Supply sourcing

    +   4. Construction

    +   5. Implementation

    +   6. Utilization


    In reality, the construction life cycle stages are not mutually exclusive or independent.
    Many of these stages occur concurrently. By definition, each construction project
    is unique and requires varying degrees of aggregation. Depending on the size of
    the construction


    ![](img/5a99b8094bd51e396d3bb39b49a21371_41_0.png)'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'organization, the supply sourcing function may be implemented with a single
    supply manager or a supply sourcing group. Regardless of the size of the organization,
    ownership in the supply sourcing function must be defined. In small construction
    organizations, the president of the company must exercise supply sourcing leadership.
    The supply sourcing function of the typical construction organization is the first
    stage of profit realization.


    The primary responsibility of the supply function is to serve as the supply sourcing
    professional for the construction organization at both the project and home office
    levels. The supply sourcing activities must be carried out subject to specifications,
    budgetary, and scheduling constraints. Supply sourcing and purchasing activities
    are implemented at two levels of aggregation. The home office or owner usually
    purchases capital equipment and materials. Equipment renting and bulk materials
    are sourced from the field (i.e., the superintendent orders concrete the day before
    it is needed).


    The focus of this book is on the supply sourcing and construction stages of the
    construction project life cycle. There is a high level of integration and interdependence
    between the sourcing and construction stages which increases the probability of
    project risks upstream and downstream. Project quality, budgets, and completion
    times can easily be compromised. Therefore, it is important to manage the communication
    and project integration in order to mitigate adverse project events. The supply
    sourcing function involves working with upstream and downstream relationships,
    inside and outside each Organization. The supply sourcing process involves assisting
    the project manager with subcontracting services, bulk materials, and equipment
    requirements. At a basic level, the construction organization transforms capital,
    engineering, labor, bulk materials, supplies, work methods, and technology into
    a completed, acceptable project. See Fig. 2.2. The percentage of the resource
    inputs sourced externally is constantly increasing compared to the in-house resources.
    There is a continuous trend toward specialization and integration. Subcontracting
    is basically specialized labor. In most cases, construction organizations can
    source specialized resources more efficiently than adding the needed capabilities
    in-house. Supply sourcing managers and the project manager have the responsibility
    and the authority to schedule and deliver the required resources to the project
    site. The supply sourcing manager must become an expert in sourcing for various
    project categories (i.e., bridge construction, office buildings, hospitals, etc.).


    The supply sourcing manager, along with the prime contractor and project manager,
    usually prequalifies subcontractors and solicits competitive bids based on the
    engineering and design specifications. The key to construction sourcing coordination
    is effective project planning and scheduling. The construction stages shown in
    Fig. 2.1 involve converting labor, materials, and equipment into an acceptable
    completed project, as shown in Fig. 2.2. The construction manager or prime'
  merge: -1
