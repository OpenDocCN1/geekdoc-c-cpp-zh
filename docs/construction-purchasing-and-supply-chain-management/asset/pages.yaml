- pgno: 140
  md: 'equipment may provide a good short-term solution to a construction organization’s
    production problems. The company must also consider the trade-off between long-term
    financing costs and short-term maintenance costs. In this case, financial efficiency
    is more important than maintenance costs. A thorough inspection must be performed
    when buying used equipment. It is a sad reality that some used car dealers are
    experts when it comes to cleaning and painting severely damaged equipment. Likewise,
    some used equipment dealers are disreputable and will do whatever it takes to
    mislead an unsuspecting buyer. The selling terms are usually “as-is” and net cash
    with no warranty.


    # Conclusion


    The capital equipment acquisition is a specialized function for the purchasing
    department.


    A step-by-step capital acquisition process includes (1) requisition, (2) company
    objectives, (3) new product ideas, (4) cash-flow analysis, (5) an economic evaluation,
    (6) a financial plan analysis, and (7) expenditure control. The decision to lease
    or buy capital equipment requires both analytical analysis and normative judgments.
    When does it make more sense to invest in construction capital equipment instead
    of leasing it? Another element of the capital acquisition process is whether to
    purchase new or used equipment. Equipment investments can serve to replace existing
    equipment, allow expansion into new markets, and increase market share in existing
    market niches. But, whatever the reason for the purchase or lease, technology
    driven equipment acquisitions can be a formidable competitive weapon.'
