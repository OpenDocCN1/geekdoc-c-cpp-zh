  md: 'be objective at the pre-bid meeting. There are certain technical questions
    that involve work methods and engineering processes that could bias the bidding
    and should *not* be answered during the pre-bid conference.


    # Purchasing/Supply Management (Large Construction Organizations)


    The contracting manager should be the *only* point of contact for communication
    with the potential bidders. There should never be any communications between the
    potential bidders and other personnel from the contracting organization, (i.e.,
    the prime contractor’s project manager). All potential subcontractors should be
    treated fairly during the solicitation period. Bid package amendments should be
    disseminated to all bidders in writing via both e-mail and a confirming letter.
    Amendments may take the form of changes in the terms and conditions, changes in
    material quantities, and clarifications requested from competing subcontractors.
    The contracting manager must ensure that no proprietary information is disclosed
    during the evaluation process. Competition in subcontracting can be assured by
    preparing identical bid packages and treating subcontractors equally in the selection
    process.


    # Evaluation of Bid Packages


    The bid evaluation process and criteria should be established before the bids
    are submitted. If the evaluation process is based on a point system, the weighting
    method must be set up before evaluating the bid proposals. The evaluation committee
    should consist of the project manager, superintendent, legal, and the contracting
    manager.


    # Submitting Bids by E-mail, Facsimile, and Telephone


    In some instances the prime contractor will allow subcontractors to submit bids
    via facsimile or telephone on the bid due date. See Fig. 5.4. Upon receiving these
    bids, the contracting manager will call the most competitive bidders and discuss
    the scope of work. See Fig. 5.5. The contracting manager will then compare the
    subcontractor bids and select the most competitive and qualified subcontractor.
    This subcontractor selection approach is risky if the prime contractor does not
    have a relationship with the successful subcontractor. The selection approach
    also requires detailed documentation. After all of the responsive subcontractor
    bids are collected, a bid analysis is performed. See Fig. 5.6.


