  md: 'and meetings using PowerPoint presentations. The most acceptable forms of information
    sharing at this stage in the project include CPM diagrams and real-time Internet
    transmissions. Regardless of the format, an effective information sharing system
    should consist of the following items:


    +   - *Estimates:* The project or activity estimates based on the plans and the
    final bid.

    +   - *Actual:* The actual quantities and budget usage to date.

    +   - *Forecasts:* The most accurate expectations of future projects forecasts
    are usually based on past performance.

    +   - *Variances:* The positive and negative differences between the estimates
    and actuals. The variances should be reported in relative (percentages) and absolute
    (money and production) quantities. The construction manager can then assess the
    magnitude of the variances and share the information both upstream and downstream.


    Two pure construction supply chain models will be presented in Chap. 8.


    +   - Horizontal government and nongovernment construction supply chain business
    models

    +   - Vertical government construction supply chain model


    # Conclusion


    The concept of construction supply chain has gained significance because of the
    increasing number of potential complex private and public sector construction
    projects. In the short run, contractors may be able to survive with losses; however,
    in the long run, *every* construction business *must* generate a profit. Niche
    marketing, decreasing total costs, and decreasing overhead are traditional means
    of increasing profits.


    In the construction process, costly delays in materials, equipment, and services
    erode profits. Construction supply chain management through the integration and
    coordination of materials, information, and money flows between the various project
    partners resolves delays and offers a new means of increasing profitability. CSCM’s
    emphasis on information sharing and communications fosters cooperation and collaboration
    among supply chain members. Contract arrangements that promote core values across
    all levels of the supply chain depart from traditional practices by advancing
    successful project outcomes instead of individual firm’s successes. Project management
    and execution are the final tests of how well the supply chain is working. Tracking
    progress in the field ensures that a project will be on-time and'
