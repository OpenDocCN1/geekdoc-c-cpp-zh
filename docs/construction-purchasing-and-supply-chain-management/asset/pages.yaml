  img_proc: true
- pgno: 215
  md: 'interstate commerce), arbitration provisions may be enforceable under the Federal
    Arbitration Act.


    The AIA does not administer dispute resolution processes. To submit disputes to
    mediation or arbitration or to obtain copies of the applicable mediation or arbitration
    rules, call the American Arbitration Association at (800) 778–7879, or visit their
    Web site at www.adr.org.


    **Why Use AIA Contract Documents.** AIA contract documents are the product of
    a consensus-building process aimed at balancing the interests of all parties on
    the construction project. The documents reflect actual industry practices, not
    theory. They are state-of-the-art legal documents, regularly revised to keep up
    with changes in law and the industry—yet they are written, as far as possible,
    in everyday language. Finally, AIA contract documents are flexible: they are intended
    to be modified to fit individual projects, but in such a way that modifications
    are easily distinguished from the original, printed language.


    **Use of Non-AIA Forms.** If a combination of AIA documents and non-AIA documents
    is to be used, particular care must be taken to achieve consistency of language
    and intent among documents.


    **Standard Forms.** Most AIA documents published since 1906 have contained in
    their titles the words "Standard Form." The term "standard" is not meant to imply
    that a uniform set of contractual requirements is mandatory for AIA members or
    others in the construction industry. Rather, the AIA standard documents are intended
    to be used as fair and balanced baselines from which the parties can negotiate
    their bargains. As such, the documents have won general acceptance within the
    construction industry and have been uniformly interpreted by the courts. Within
    an industry spanning 50 states—each of them free to adopt different, and perhaps
    contradictory, laws affecting that industry—AIA documents form the basis for a
    generally consistent body of construction law.


    **Use of Current Documents.** Prior to using any AIA Contract Document, users
    should consult www.aia.org or a local AIA component to verify the most recent
    edition.


    **Reproductions.** This document is a copyrighted work and may not be reproduced
    or excerpted from without the express written permission of the AIA. There is
    no implied permission to reproduce this document, nor does membership in The American
    Institute of Architects confer any further rights to reproduce this document.


    This document is intended for use as a consumable—that is, the original document
    purchased is to be consumed in the course of its use.'
