    The GMP Documents, including A295–2008, record the Contract for Construction between
    the Owner and the Contractor. The other GMP Documents are the A195–2008, Supplementary
    Conditions, Drawings, Specifications, and Modifications. Although the AIA does
    not produce standard documents for Supplementary Conditions, Drawings, or Specifications,
    a variety of model and guide documents are available, including AIA’s MASTERSPEC
    and AIA Document A503™–2007, Guide for Supplementary Conditions.


    As mentioned above and diagrammed below, A295–2008 is a vital document used to
    allocate the proper legal responsibilities of the parties.


    ![](img/5a99b8094bd51e396d3bb39b49a21371_214_0.png)


    **Dispute Resolution—Mediation and Arbitration.** This document contains provisions
    for mediation and arbitration of claims and disputes. Mediation is a non-binding
    process, but is mandatory under the terms of this agreement. Arbitration is also
    mandatory under the terms of this agreement. Arbitration is binding in most states
    and under the Federal Arbitration Act. In a minority of states, arbitration provisions
    relating to future disputes are not enforceable but the parties may agree to arbitrate
    after the dispute arises. Even in those states, under certain circumstances (for
    example, in a transaction involving'
