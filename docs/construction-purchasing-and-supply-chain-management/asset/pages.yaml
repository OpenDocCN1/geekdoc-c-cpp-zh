  md: 'was spent in 2007—it has historically been a slow- to no-learning industry.
    However, the days of slow learning construction firms are coming to an end. More
    and more firms in the construction industry are adopting the lessons learned from
    the manufacturing sector. Progressive firms are now implementing six sigma and
    lean management initiatives to drive efficiencies for their project operations.
    This transition has generated the construction supply chain management revolution.


    # Information Sharing


    Construction supply chain execution is the process of purchasing materials, leasing
    or buying equipment and contracting with subcontractors in order to produce a
    finished project. Construction purchasing, the central focus of supply chain execution,
    is responsible for project sustainability and efficiency. The supply chain execution
    is complemented by the supply chain information model which begins with project
    requirements that are determined by the owner. The project owner’s requirements
    ignite a series of information, material and money flows, and the quality of these
    flows determines the level of supply chain integration. Despite the inherent complexities,
    on a project-by-project basis, some project managers adequately execute the construction
    processes. However, if the various processes were more integrated and driven by
    information sharing, there would be fewer disruptions resulting in continuous
    improvement on succeeding projects.


    There are three aspects of information sharing: information sharing support technology,
    information content, and information quality.¹ Information sharing support technology
    includes the hardware and software needed to support information sharing. *Information
    content* refers to the information shared between the various construction supply
    chain participants. *Information quality* measures the quality of information
    shared between the construction supply chain participants.


    In the past decade, supply chain management and information technology (IT) management
    have attracted much attention from construction organizations. Construction supply
    chain practice focuses on material, equipment, and labor movement, while information
    sharing focuses on information flow. There are two categories of supply chain
    practice: construction supply chain network design and supply chain integration.
    Information sharing is the key driver for construction supply chain integration.
    During the past decade, the investment in information technology in corporate
    America has increased significantly. It is estimated that US information technology
    spending will increase to approximately $497 billion in 2009 and increase again
    to approximately $511 billion by 2010 (http://www.itfacts.biz). Information technology
    has had an impressive impact on construction supply chain practice.'
