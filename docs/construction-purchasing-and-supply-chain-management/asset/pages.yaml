    # ### Design-Build Contracts


    Design-build is a turn-key project delivery system. The project owner says I need
    a new office building on January 10, 2011. In a traditional design-bid-build arrangement,
    the owner first contracts with a design professional to prepare construction plans
    and specifications, which are later used to solicit competitive bids for construction.
    In design-build, a single entity is selected to do both the design and construction
    of the building. While price may be a factor in the selection of the design-builder,
    other factors are also evaluated. The design and construction may proceed simultaneously.
    The advantages of design-build are cost savings for the project owner since typically
    no change orders are allowed and potentially early completion of the project.
    The downside of design-build is that the owner gives up control. Because design-build
    is fast track and turn-key, the owner must also be certain of the project requirements
    before the project begins.


    # ### Negotiated Contracts


    In rare instances the prime contractor may forego a formal assessment process
    in lieu of selecting a subcontractor. This decision is usually based on a schedule
    constraint. Negotiated contracts are priced as lump sum or cost-plus based on
    the complexity of the work items. When the work items are straightforward, a *lump
    sum* contract is negotiated. However, if there is uncertainty associated with
    the work item, a *cost-plus* contract is negotiated.


    # ## Contract Negotiations


    *Bargaining and negotiation* are important components of the contractor subcontractor
    relationship. In the process of constructing a building or bridge, negotiations
    must take place between all of the supply chain partners to arrive at a mutually
    satisfactory agreement for performing the work items. Whenever the terms of construction
    contract agreements are determined or project modifications are settled, bargaining
    is likely. In a sense, each supply chain member becomes a bargainer at one time
    or another. Bargaining takes place when two or more parties have divergent interests
    or goals and communication between the parties is possible. Three additional conditions
    also must exist in order for bargaining to occur. (1) Mutual compromise must be
    possible. If one of'
