  md: 'work documents. Written specifications should also be produced for each set
    of plans. The specifications are usually written in concert with each trade area
    (i.e., concrete, structural steel, asphalt, mechanical, and others). The specifications
    and drawings should provide the complete scope of how the project will be built.
    These documents are key legal instruments between the owner and the contractor.
    During the estimating and bidding phase of the project, the prime contractor uses
    the drawings and the specifications to determine costs. If the specifications
    and drawings are sketchy, it is impossible to accurately determine costs and work
    methods.


    # **Maintenance, Repair, and Operating Supplies**


    Maintenance, repair, and operating (MRO) supplies are distinct and are specified
    in various ways. The keys are quality and uniqueness. Over time, equipment parts
    are subject to wear and need to be replaced. The original equipment manufacturer
    expects to resupply these parts during the life of the equipment. Not infrequently,
    a contract to purchase equipment includes a specified number of replacement parts;
    periodically, engines are removed for overhaul. Replacement parts are specified
    by manufactured part number and model number according to the unit in which it
    is installed. Problems arise when manufacturers discontinue equipment. Replacements
    will be available as long as sufficient machines are in operation in the field.
    After that, sourcing and specifications become a problem. Some equipment owners
    may elect to supply themselves, in which case they must provide complete documentation
    (specification) of the parts required. The same is true if the parts are purchased
    externally. Sometimes equipment manufacturers will produce replacement parts if
    a sufficient number is ordered to make their manufacture profitable. The older
    the model being maintained, the less current experience the supplier has, and
    the more difficult the task of specifying becomes.


    Maintenance also means the application or renewal of materials such as lubricants
    and coolants. Periodic maintenance (labor and materials) ensures longevity and
    satisfactory machine operation. In most cases, these maintenance materials are
    commodity-like in nature and are specified by industry or association standards.
    These materials are carried in stock and managed as part of raw materials inventory
    by purchasing management.


    The distinction between maintenance and repair materials is not always clear.
    In theory, if good maintenance is practiced, events requiring repair will occur
    infrequently. Repair suggests the unexpected, which means the need to patch up
    or replace equipment components that are not expected to fail. Usually the parts
    are not carried as inventory by the equipment manufacturer. The repair material
    may have to be described in very specific ways, that is, drawings and'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'photographs. Perhaps field engineers from the machine supplier will need to
    be called. The more common event is that the services of a skilled craftsman to
    repair failed equipment are more important than specific operating supplies, parts,
    and materials.


    Operating supplies, also called “indirect materials,” become part of the end item
    and are essential for its production, but their unit value or size is too small
    to plan or control usage unit by unit. A good example is ties used in bridge deck
    steel. These are “counted” by weighing them. Bins of ties are located throughout
    the jobsite and available to anyone on a “help yourself” basis. Ties are dropped
    on the deck and so on, without regard for usage. No one would suggest counting
    ties or holding steel workers accountable for them. Adhesives are another common
    example. These materials are supplied as needed to assemble components or provide
    seals between components. Generally speaking, operating supplies are standard
    items and are specified by manufacturer or industry codes. Nonstandard items should
    be questioned by the purchasing manager: Is the special item really necessary?
    Can a standard material be substituted?


    # Conclusion


    Historically, the sourcing of subcontracting services was the most arbitrary element
    in the construction process. Only when the cost of materials and subcontracting
    services increased did management attempt to solve sourcing problems. The focus
    on labor was logical simply because the construction process is labor intensive.
    Recently, some construction market segments have investigated new technologies
    and invested in technology-driven construction purchasing systems. Although these
    new systems are up and running, too frequently they are being operated just like
    the old construction business models, thus defeating the very purpose the system
    was designed to achieve. The reality is that technology and advanced management
    systems are rapidly displacing labor.


    The supply sourcing function plays a critical role in the transformation of capital,
    engineering, labor, bulk materials, work methods, and technology into a completed
    acceptable project. The efficient and profitable transformation depends on an
    expert sourcing professional who can ensure the on time delivery of the right
    goods at a reasonable price. Technology-driven sourcing develops systems to identify,
    prequalify, select, and evaluate vendors to provide materials, equipment, and
    services while, at the same time, achieving maximum integration with upstream
    and downstream supply chain members. The objective is to keep inventory investment
    to a minimum, maintain good relationships with supply chain members, and develop
    a culture of continuous improvement.'
