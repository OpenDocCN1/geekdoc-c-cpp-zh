- pgno: 85
  md: 'deducting the amount of points received (100 if perfect) from 100, dividing
    by 100, and adding 1. The idea is to give a simple numeric rating to the so-called
    hidden cost of ownership—the additional lifetime cost to the organization. A score
    of 1.20, for instance, means that for every dollar the buying organization spends
    with that supplier, it spends another $0.20 on everything from delays to added
    service costs.


    # Linear Averaging


    The linear averaging method is probably the most commonly used evaluation method.
    Specific quantitative performance factors are used to evaluate supplier performance.
    The most commonly used factors in goods purchases are quality, service (delivery),
    and price, although any one of these factors named may be given more weight than
    the others. Quality is most important for a builder of complex bridge projects.
    Price might be given equal or greater weight in an evaluation system used by the
    highly competitive residential housing market. An example of the linear averaging
    method follows.


    The first step is to assign appropriate weights to each performance factor, such
    that the total weights of each factor add up to 100. For example, quality might
    be assigned a weight of 50, service a weight of 35, and price a weight of 15.
    The assignment of these weights is a matter of judgment and top management preferences.
    These weights are subsequently used as multipliers for individual ratings on each
    of the three performance factors. After the weights have been assigned, the individual
    performance factor ratings are determined. This is done by summing the scores
    for each factor. The third step is to multiply each performance factor rating
    by its respective weight as a percentage. In this example, a quality rating of
    95 would be multiplied by 0.50, if quality had a weight of 50. Finally, the results
    from step three are added to give a numerical rating for each supplier.


    # Example


    Prime contractor A wishes to rate its suppliers on quality, service, and price,
    and has assigned each a weighting factor of 50 for quality, 35 for service, and
    15 for price. For this example, quality is rated as a direct percentage of the
    number of acceptable bulk lots received in relation to total lots received. The
    service rating is a direct percentage of the lots delivered on time in relation
    to total bulk lots received. In rating price, the lowest price obtained from any
    supplier is used as the base price, and prices from other suppliers are rated
    as a ratio of the base price. Two suppliers would thus be rated as follows:'
