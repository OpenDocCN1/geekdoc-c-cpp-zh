    # **The Subcontractor (Tier 3 in the Construction Supply Chain)**


    In cases where the prime contractor cannot perform or decides not to perform certain
    project tasks, it will contract with a subcontractor. Subcontracting organization
    must have the resources and expertise to perform the requested tasks. The subcontracting
    organization must also share some of the project risk. The prime contractor must
    self-perform at least 50 percent of the work. There are no second tier subcontractors
    on INDOT projects.


    Responsibilities of the subcontractor:


    +   1. Submits new prequalification application at least 21 calendar days before
