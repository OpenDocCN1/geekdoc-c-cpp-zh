  md: '# # Glossary


    **Acceptance** A draft on which the debtor indicates by the word “accepted” his
    or her intention to pay or honor.


    **Acknowledgment** A standard form used by a vendor or supplier to advise that
    the purchase order has been received.


    **Act of God** Danger beyond human control; any accident produced by an irresistible
    physical cause, such as hurricane, flood, earthquake, or lightning. In no way
    connected with negligence.


    **Actual weight** Gross shipping or transport weight


    **Addendum** A document used to modify bid documents prior to receipt of bids.
    An addendum is incorporated into the formal contract.


    **Ad valorem** The total value of goods or materials against which tariff rates
    are imposed.


    **Advertisement for bids** A published notice of an owner’s intention to award
    a contract for construction work to a contractor who submits an acceptable proposal
    in accordance with the owner’s instructions to bidders. In its usual form, the
    advertisement is published in a convenient form of news media (e.g., newspaper,
    magazine) in order to attract contractors who are willing to prepare and submit
    proposals for the completion of the project.


    **Advice of shipment** A notice sent to the purchaser from the seller advising
    that the shipment has gone forward; usually contains details of packing, routing,
    delivery date, and so on.


    **Agency** Implies a relationship between two parties in which one is empowered
    to perform certain functions or business transactions for the other.


    **Agent** An agent is authorized by the principal to act in the principal’s behalf
    and interest. An agent’s actions generally bind the principal as if the principal
    had acted directly.


    **Aggregated shipments** An indefinite number of shipments from different supply
    sources to a single buying organization, consolidated and considered as a single
    consignment.'
  merge: -1
  img_proc: true
- pgno: 225
