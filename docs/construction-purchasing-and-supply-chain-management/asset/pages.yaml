- pgno: 162
  md: 'prime contractors. In reviewing financial information for prequalification,
    the DOTs tend to value liquidity, that is cash and cash equivalents. In some respects,
    prequalification is akin to a performance bond and helps the state safeguard the
    taxpayers’ dollars. Annual prequalification is the key to regular bid lettings.
    Only the contractors who are prequalified in advance—that is, those who are capable
    of building a particular item and have the financial resources, equipment, and
    personnel—are permitted to bid.


    Because of prequalification, when all the bids are accepted then, generally speaking,
    the only remaining task is to identify the low bidder.


