  md: 'and react to change, construction firms must be lean and flexible. This necessitates
    a general attitude toward elimination of excess in materials, personnel, and processes.
    "Lean" construction has helped propel many responsive construction companies to
    success. A fourth element that fosters the environment for best practice operations
    is *technology*. Knowledge of company capabilities, competitors, and the business
    cycle is critical to success. Modern technology can also be utilized to enhance
    information flows both inside and outside the firm. Technology may be exploited
    to facilitate improved project selection, planning, scheduling, work methods,
    and materials flows. This "Lean" construction approach enhances the responsiveness
    and allows the construction firm to be on the cutting edge of competition. See
    Fig. 1.8.


    The critical elements of attitude, process improvement, waste elimination, and
    technology are necessary in allowing operational efficiency to serve as a competitive
    advantage within a construction firm. An operations-oriented strategy, however,
    must extend beyond an individual construction firm. The project is delivered to
    the project owner via supply networks of firms consisting of architects, engineers,
    contractors, material suppliers, and related supply chain members. Most firms
    are simply a link in the supply chain, and a chain can only be as strong as its
    weakest link. Therefore, construction firms cannot be responsive without responsive
    subcontractors or material suppliers and technology implementation. As another
    example, a prime contractor cannot produce high-quality projects without quality
    materials and well-informed subcontractors, pushing quality responsibility down
    to its subcontractors and material suppliers.


