- pgno: 175
  md: '# Supply Chain Document Flows


    The document flows between supply chain entities include the agreement between
    the project owner and architect and the agreement between the project owner and
    construction manager at risk. There are also contracts between the construction
    manager at risk and the subcontractors and material suppliers. Throughout the
    course of the project, the document flow may include change orders authorized
    by the construction manager at risk. In addition to the formal legal arrangements,
    the project owner may require bid, performance, and payment bonds from all entities
    in the supply chain. The proofs of comprehensive general liability insurance,
    worker’s compensation, and other insurance coverages are typically submitted by
    all supply chain members to the construction manager at risk. There is a trend
    to have downstream supply chain entities name the project owner and the construction
    manager at risk contractor as an additional insured on their policies. In the
    event of payment disputes, lien filings can become a part of the document flow
    with unpaid downstream supply chain entities filing against the project property.


    # Supply Chain Coordination and Information Flows


    For high-profile projects, such as sports arenas and convention centers, there
    are frequently dedicated websites with information on how and when to bid. Bid
    packages may be advertised in the newspaper, and also advertised, produced, and
    sold by independent local reprographics firms. The contractor subscription services
    and reprographics firms may publish plan holders’ lists so that the construction
    community has information on who is bidding what projects. In the vertical sector,
    pre-bid meetings may be held to disseminate information and answer questions about
    the project. The bids in this sector can be submitted electronically for more
    sophisticated project owners, or manually with immediate dissemination of the
    identity of the low responsive bidder. During the course of construction on some
    projects, partnering meetings are held with all supply chain members represented.
    There are often work site postings, including billboard size announcements that
    credit major supply chain entities for their performance. However, there are so
    many different trades represented on a large vertical project, that the coordination
    of information can be a challenge absent the implementation of supply chain philosophies.


    # Supply Chain Money Flows


    The vertical construction market is the most vulnerable to bankruptcy because
    of the many private owners. The project owner obtains financing from commercial
    banks, insurance company investment'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'divisions, and other financial institutions, and then makes periodic draws
    to pay the project invoices. Some high-profile private projects, hotels, and the
    like are subsidized with government dollars which can mean a more reliable cash
    flow. Inspection is performed by the construction manager. Payment can be slow
    especially for downstream entities when there are disputes upstream.


    # Implementation of Construction Supply Chain Management


    Before firms align based on capabilities and interest in a supply chain configuration,
    they must first excel as individual firms in their internal and external operations.
    Each perspective supply chain member should perform a focus analysis. A focus
    analysis consists of thought provoking questions that challenge the construction
    supply chain member to consider all aspects of their businesses. The purpose of
    performing a focus analysis is to investigate the following questions: Is the
    “how to make money” in my business and industry changing? Who is winning profitable
    projects in my work category; who is not winning profitable projects and why?
    An example focus analysis checklist is given in Table 8.1.


    | Profit and Growth |

    |---|

    | 1. How are profitable projects defined? |

    | • The top 20% of the profit generation |

    | 2. How is profitability for your company measured? |

    | • Quality of revenue streams |

    | 3. What proportion of the business development expenditures and incentives are
    directed toward bidding on profitable projects? |

    | • Bidding on profitable projects is important |

    | 4. What percentage of profitable projects does your company win? |

    | • What percentage of the profitable projects does your primary competitor win?
    |

    | Customer (project owner) Satisfaction |

    | 5. Are customer satisfaction data collected? |

    | 6. How is information concerning/customer satisfaction used to solve customer
    problems? |

    | Employee Productivity |

    | 7. How do you measure employee/subcontractor productivity? |


    **TABLE 8.1**  Construction Company Focus Analysis Example'
  merge: -1
  img_proc: true
