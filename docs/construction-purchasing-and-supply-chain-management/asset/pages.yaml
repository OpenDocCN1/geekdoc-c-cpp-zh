    # The Project Owner (Tier 1 in the Construction Supply Chain)


    Responsibilities of the project owner:


    +   1. Determines what is to be constructed. [For purposes of this discussion,
    the project owner is the Indiana Department of Transportation (INDOT).¹ The funding
    agency is the FHWA.¹] As part of its preconstruction responsibilities, the project
    owner issues the *Federal Environmental Impact Statement* (EIS), which describes
    the purpose and need for the project. The EIS outlines the various alternatives
    including the routes that were selected and those that were eliminated. The EIS
    further describes the environmental consequences and impact, and then discusses
    measures to mitigate these impacts. *The Record of Decision* (ROD), issued by
    the FHWA, is the final step in the EIS process. The ROD identifies the preferred
    alternatives and discusses the means that will be adopted to minimize the environmental
    impacts.

    +   2. Establishes the date the project must be completed.

    +   3. Establishes the major quality and reliability project construction milestones.

    +   4. Prepares final plans and specifications.

    +   5. Establishes preliminary cost estimates for the project.

    +   6. Prepares bid package.

    +   7. Establishes disadvantaged business enterprise (DBE) participation goals.

    +   8. Prepares notices and advertisements for bid letting.

    +   9. Posts notice to contractors. The definitions for the various bid postings
    are provided at http://www.in.gov/dot/div/contracts/standards/drawings/index.html.

    +   10. Posts electronic bidding system 4 weeks before the opening of bids. This
    is the electronic exchange that lists the schedule of pay items. The exchange
    is updated for revisions as needed beginning 10 days prior to the opening of bids.

    +   11. Posts bidder and plan holder lists 14 days before the bid opening, and
    updates 7 days before and again 1 day before the opening of bids. This information
    is strategic because the bidders know who will be the competition prior to submitting
    their bids.

    +   12. Conducts mandatory pre-bid meeting in special circumstances.

    +   13. Receives bids from prime contractors.'
