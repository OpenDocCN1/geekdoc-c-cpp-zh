  md: 'This provision may work for a transactional supplier, but it does not bode
    well for a strategic subcontractor (discussed in Chap. 5) who could be critical
    to the execution of large portions of the work. Communication is the cornerstone
    of construction supply chain management. The concerns about who speaks to whom
    and for what reasons seem to be more tied to avoiding claims and litigation than
    to accomplishing the work. Instead, the thinking should be what can be gained
    from allowing supply chain entities to share information at all levels. The pecking
    order of who officially can talk to the owner and who cannot is outdated and not
    at all useful in today''s high technology fast track construction environment.
    A construction supply chain management environment will not diminish the architect''s
    importance in the supply chain; it will simply elevate other strategic entities
    to the same level in order to advance the best interests of the project over the
    interests of individual firms.


    The legal arrangements downstream in the supply chain for strategic subcontractors
    are more like entanglements that are complicated by the lack of communications,
    the awkward timing of contract negotiations and execution, and the contract terms
    that establish patterns of blame instead of efficiency. Subcontracting is a means
    of getting the work performed while transferring risk. Subcontracting also allows
    the prime contractor to extract a fixed price for the subcontracted portions of
    work. Practically speaking, the prime contractor controls the money and is responsible
    for the coordination of the work, while the subcontractor is responsible for executing
    the work with limited rights and potentially unlimited risk.


    The discussion of distributive bargaining in Chap. 5 underscores the lack of real
    give and take between prime contractors and subcontractors and shows the imbalance
    of power. The pre-award discussions between the prime contractor and subcontractor
    center on price, scope of work, and payment terms. During this period, the prime
    contractor may have similar discussions with more than one subcontractor for the
    same item of work. The intention of the prime is to influence the subcontractor''s
    actions to the prime contractor''s advantage. This goal is effectively communicated
    and reinforced by the prime contractor''s cost structure. Once the prime contractor
    is identified as the most responsive bidder, the imbalance of power is even more
    significant because the prime contractor is in a position to dole out the work.
    In some markets, after the award, the prime contractor will further beat down
    the price of the subcontractors. By the time both the prime contract award and
    the subcontract award are made, the subcontractor believes that it has no choice
    but to agree to terms and conditions that do not consider its cost structure,
    and worse, terms and conditions that the subcontractor may not have even read.


    Hopefully, all subcontractors read the agreements that they sign. What they may
    not read, however, is the prime contractor''s agreement with the project owner
    that is almost always incorporated by'
