  md: 'F.O.B. agreement, title goes to the purchaser when the carrier delivers the
    article to the location stipulated.


    **F.O.B. destination, freight prepaid**  A term used in reference to the title
    passing to the buyer and to the freight cost being paid by the seller.


    **F.O.B. factory, freight allowed**  Free on board factory, freight prepaid from
    point of origin.


    **F.O.B. origin, freight collect**  A term used in reference to the title passing
    to the buyer. The buyer pays the freight costs, owns the goods in transit, and
    files all claims for any loss or damage while in transit.


    **F.O.B. origin, freight prepaid and charged**  A term used in reference to the
    title passing to the buyer. Freight costs are paid by the seller and then collected
    from the buyer by adding the value of freight costs to the invoice.


    **F.O.B. shipping point**  The location at which title to the articles passes
    from the seller to the buyer. The seller is liable for transportation costs and
    the risks of loss or damage to the goods up to the point where title passes to
    the buyer. The buyer is liable for such costs and risks after the passing of the
    title.


    **Follow-up record**  Information used in the expediting and delivery from vendors
    and suppliers.


    **F.O.R.**  Free on rail.


    **Force majeure**  Circumstances beyond an individual’s control; pleadable as
    an excuse for the nonfulfillment of a contract or purchase order.


    **Forward purchasing**  The purchase of quantities exceeding the immediate requirement,
    that is, in anticipation of any significant price increase or market shortage.


    **F.O.T.**  Free on truck.


    **Freight forwarder**  Some freight forwarder organizations act as agents on behalf
    of shippers in organizing the transportation of articles without handling any
    of the articles. Others act as freight carriers in consolidating small- and mid-sized
    shipments and delivering them to the purchaser.


    **General conditions**  Guidelines that define many of the rights, responsibilities,
    obligations, and limitations of authority of the owner and contractor, and include
    a general procedure governing the performance of the work. When organized under
    the Construction Specification Institute Master Format, they are described under
    16 divisions.


    **General contractor**  A construction organization who has a direct relationship
    with project owners and is also referred to as a prime contractor.'
