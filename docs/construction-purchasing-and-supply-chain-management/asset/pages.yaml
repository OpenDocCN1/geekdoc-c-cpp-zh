    # ## Purchasing New versus Used Construction Equipment


    Despite today’s competitive markets, it may not be cost-effective to purchase
    new equipment. Depending on the purpose and expected use of the purchased equipment,
    it may be more cost-effective to buy used equipment. In this section the guidelines
    for purchasing new versus used equipment are discussed.


    # ### New Construction Equipment Purchases


    When a company purchases new construction equipment, there is no uncertainty regarding
    the performance to stated specifications. The buying firm must first determine
    the number of hours per year that the equipment will be employed. The construction
    organization must pay close attention to the theoretical usage levels of certain
    equipment. As an example, the life expectancy of construction equipment is easy
    to predict given the normal operating conditions. Construction equipment is usually
    purchased new. In cases where significant demand or uses already exist for a particular
    piece of equipment, the purchase of new equipment is appropriate. The technological
    advantages of new equipment also may increase productivity in these situations.
    In the case of backhoes, dump trucks, and other rubber-tired vehicles, it may
    be more cost-effective to purchase new equipment. However, if an older model is
    adequate for the expected use, significant savings could occur. Remember, new
    equipment requires less maintenance than used construction equipment. This is
    perhaps the strongest argument for considering only new equipment. For example,
    after a Motor Grader is used for more than 10,000 hours, a new $30,000 scraper
    is usually required. The maintenance record must be considered when deciding to
    buy used equipment.


    Specifications must be carefully considered when purchasing major construction
    equipment. It is a simple task to compare new equipment. It is next to impossible
    to compare different models of used equipment. Sometimes low equipment prices
    may lead to purchasing construction equipment that is ready to be scrapped. However,
    if the used equipment dealer is willing to offer a reasonable warranty and other
    guarantees, purchasing a specified piece of used equipment may be justified.


    # ### Used Construction Equipment Purchases


    Low cost is usually the only reason to purchase used equipment. The determination
    of the true value of used equipment is extremely difficult. A review of the historical
    maintenance record should be the first step in the acquisition of used equipment.
    In some cases, used'
  merge: -1
