  md: '# # CHAPTER 5

    ## Purchasing

    ## Subcontracting

    ## Services


    > > Nothing Happens until You Decide


    Construction is a project-driven industry that requires many skilled specialties.
    Historically, the prime contractor served as the master builder who purchased
    materials and used its own labor to construct a project. Over time, the industry
    has evolved so that today the prime contractor performs almost none of the work
    itself, but instead acts as the construction manager who coordinates and administers
    the project. The actual work is performed by specialty subcontractors. Electrical,
    mechanical, trucking, structural steel, bridge painting, and roofing services
    are just some of the many work items that are routinely subcontracted. Because
    the capabilities of subcontractors are so specialized, sourcing subcontractor
    services differs significantly from the purchasing of bulk construction materials
    and equipment. Agreements between prime contractors and materials suppliers or
    equipment vendors are routine, transactional, and arms-length unless the supplier
    is a strategic partner. On the other hand, the prime-subcontractor relationship
    requires continuous or, at a minimum, intermittent cooperation among many levels
    in the construction and subcontracting organizations. For example, the design
    specifications for a bridge project require meticulous coordination and execution
    between the prime contractor and the structural steel subcontractor. In design-build
    projects the owner seeks expeditious completion of the project, yet continuous
    design changes mean that the prime contractor is unable to initially specify some
    work items and quantities needed. In the fast track environment of design-build,
    experienced subcontractors are vital links in'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'the construction supply chain. The critical nature of the subcontractor’s role
    is not limited to time sensitive design-build environments. The dollar magnitude
    of subcontracting, as much as 80 percent of all dollars on some projects, is motivation
    for the supply chain management-oriented construction organization to spare no
    effort to ensure that the most adaptable subcontractors are selected.


    Technically, because there is no contract between the owner and subcontractors,
    subcontractors do not have a formal relationship with the project owner. The prime
    contractor is entirely responsible for the relationship with the subcontractor
    as demonstrated by a generic project organization chart. See Fig. 5.1.


    Practically speaking, however, there are many connections between the owner and
    subcontractors based on legal project administration requirements. In most jurisdictions,
    subcontractors have a relationship with the prime contractor because of mechanics’
    lien laws. Liens attach directly to a piece of property that is the subject of
    the work. If the owner pays the prime contractor who, in turn, never pays the
    subcontractors, then the owner is still responsible for money owed to the subcontractors
    even though the prime contractor has been paid. In order to enforce lien rights
    in some states, a subcontractor must notify the project owner that work has begun
    within so many days of starting the project. This notification is frequently referred
    to as a notice of furnishing or a pre-lien. In the case of public projects, a
    subcontractor does not lien a road or public building, but instead has the


    ![](img/5a99b8094bd51e396d3bb39b49a21371_93_0.png)'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'right to claim an equitable lien against the funds owed to the prime contractor.
    This is commonly referred to as an attested account. Similar to a pre-lien in
    the vertical building market, some state departments of transportation (DOTs)
    require the prime contractor to file a list of subcontractors before beginning
    work.


    There are other nexuses between the project owners and subcontractors. Some government
    and private owners may require that subcontractors be prequalified before they
    are eligible to quote prime contractors who work on public and private projects.
    Prequalification is intended to determine a firm’s financial capacity and experience
    building a particular work item. A prequalification application from a government
    agency can be extensive and may require compiled, reviewed or audited financial
    statements, equipment inventory, resumes of key employees, and a list of completed
    and ongoing projects. This information is evaluated to set a dollar limit and
    work category that a contractor is capable of performing; for example, prequalified
    for $25 million in concrete base pavement and resurfacing. In addition to what
    project owners require, prime contractors may also have their own subcontractor
    prequalification process which is discussed later in this chapter.


    Insurance and bonding requirements also connect project owners with subcontractors.
    In the current environment, it is not unusual for a subcontractor to have to list
    both the project owner and prime contractor as additional insureds on its commercial
    general liability insurance policy. Where the owner has an in-house engineering
    staff and conducts its own inspections, subcontractors may have an opportunity
    to interact directly with the owner. Partnering meetings that include all of the
    supply chain entities present another opportunity for subcontractors to have some
    interaction with the project owner.


    Affirmative action programs for woman- and minority-owned businesses administered
    by federal, state, and local government agencies are another instance where project
    owners must deal directly with a small subset of program eligible subcontractors.
    For example, the Federal Highway Administration’s program for disadvantaged business
    enterprises is administered by the state DOTs. Based on 49 CFR 26 and other federal
    and state regulations, state DOTs determine if a business owner is socially and
    economically disadvantaged. After a business is certified as a disadvantaged business
    enterprise (DBE), then the firm is listed in a directory with other DBE firms
    and may be solicited to meet the DBE goal required on some federal aid highway
    contracts. After a contract is awarded in the DOT market, the agency tracks the
    field operations of both DBEs and prime contractors to ensure compliance with
    regulations governing the DBE program.


    The depth and number of contacts between the project owner and subcontractors
    are more than tenuous. The linkages between owner and subcontractors are already
    significant and may help advance the implementation of construction supply chain
    management concepts.'
