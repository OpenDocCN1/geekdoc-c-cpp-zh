  md: '# CHAPTER 3


    # Construction Supply Chain Relationship Management


    # The Power of Partnerships


    The supply chain management process is based on the idea of efficient resource
    coordination and teamwork. Depending on whether a project is a vertical or horizontal
    construction, an architect or design engineer is selected based on qualifications
    and experience to develop a design that meets code and other regulations while
    satisfying the functionality and end-use requirements of the project owner. The
    relationship between the project owner and the architect in vertical construction
    is established by the scope of the professional services contract and the complexity
    of the project. In addition to the typical design services in a vertical construction
    project, the architect may have varied roles in the construction process and oversight,
    including advice on the award to a prime contractor, detailed document preparation,
    construction progress reviews, and other contract administration duties. Project
    owners with too many projects or not enough in-house expertise sometimes hire,
    in addition to the architect, what is known in the industry as a Construction
    Manager Agent or a Construction Manager “At No Risk.” The CM Agency serves as
    the owner’s representative, manages the project, and has limited liability. Another
    alternative for the project owner is to use a Construction Manager “At Risk.”
    The CM At Risk is essentially a general contractor who is contractually obligated
    to the owner to deliver the completed project for a guaranteed price and within
    a set schedule.


    In the horizontal public works construction, the design engineer is responsible
    for preparing plans, specifications, and contract documents.'
