  md: 'the probability for a successful project. It is impossible to achieve integration
    without information sharing. In fact, information is the lifeblood of *all* successful
    construction projects. There are significant volumes of data generated by each
    CSCM member. This data must be translated into usable information and shared throughout
    the CSCM process. Currently, many construction projects are driven by the critical
    path or project schedule. The shortcoming of driving the project by the *Critical
    Path Method* schedule is the static nature of the project schedule, while timely
    accurate information is dynamic. With modifications, most of the supply chain
    concepts can be recommended and implemented into the construction industry.


    However, without strong leadership throughout the complex construction network,
    the construction supply chain management concepts cannot be properly implemented.
    Supply chain management initiatives must be implemented in the initial stages
    of the project because each of the *key strategic* supply chain partners may not
    have worked together and may not be aware of the project owners or prime contractors’
    team-oriented goals. Otherwise, the flow of materials, money, and equipment will
    continue to move inefficiently across the project. The supply chain application
    for the construction industry must be flexible enough to adjust to project and
    supply chain partner changes. In the case of the horizontal government model,
    the project owner is in a strong position to exert supply chain leadership and
    information sharing. Implementing the supply chain management concepts for heavy
    highway and other complex public works projects can lead to reduction in delays
    and claims, as well as continuous improvement through the processing of real-time
    information by the strategic supply chain partners.


    The three stages of supply chain information sharing are: (1) bid preparation,
    (2) preparation and execution of contractual agreements, and (3) project management
    and administration.


    # **Bid Preparation**


    An estimate that matches the skill and other resources of the firm with the needs
    of the project is at the heart of a project supply chain. A competent and effective
    estimator is one of the key links in the supply chain operation. The attributes
    and qualities of a good estimator are:


    +   - A background of construction experience

    +   - Ability to visualize a project from plans and specifications

    +   - Ability to scale and read plans and specifications accurately

    +   - Well grounded in mathematics and geometry

    +   - Adept in using computers

    +   - Understand the importance of visiting the site of a proposed project; visualize
    step-by-step construction process

    +   - Keep current on construction materials, methods, equipment, and processes'
