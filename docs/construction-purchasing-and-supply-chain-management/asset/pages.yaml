- pgno: 80
  md: 'there are no formal measures taken to ensure that high-quality materials have
    been delivered. Visual material inspection is undertaken and any piece of material
    that is not visibly damaged is accepted and used. However, materials such as steel
    beams or concrete require a more formal inspection to ensure that they conform
    to specifications. In the case of steel materials, plant visits may be made by
    a representative of the buying firm during testing procedures to ensure that the
    architect’s specifications are being met. For example, concrete core samples are
    sometimes tested to confirm that they are of the desired consistency. In addition,
    a representative of the supplier will sometimes be present at the construction
    site in order to ensure that the materials are being placed properly. Although
    quality is a very important aspect to the buying firm, it may not play a large
    role in the selection of one supplier over another. Quality is rarely a problem
    in the construction industry, simply because the buying firm provides the supplier
    with specifications and the supplier must comply. If a supplier cannot provide
    adequate quality, it will not receive consideration for future business from the
    contractor. Therefore, after the potential suppliers have been selected, considerations
    of delivery dependability and price play a more important role in actually selecting
    one supplier over another.


    Delivery dependability is obviously vital in today’s fast-track construction industry,
    where construction is often begun before the architects’ final designs are completed.
    If delivery deadlines are missed, the result can be costly for both the owner
    and the contractor. *In the construction industry, time really is money.* If a
    project is not completed by its deadline, the loss of potential profits increases
    with each day past the due date. In the construction industry, suppliers must
    be able to deliver materials to the contractor when promised. If one company can
    supply a contractor considerably faster than another supplier, the faster company
    will have an advantage. Delivery considerations are the most important criteria
    used in selecting suppliers for the construction industry.


    Price also has a significant effect on the process selection. Price, however,
    cannot always overshadow all other criteria. The trick is to strike a balance
    between price and the other factors considered in the process. Premiums often
    may be required for rush deliveries. The company must weigh the desire for expected
    deliveries with the resulting higher prices. Through negotiation, the buyer and
    supplier must reach a price agreement that is satisfactory to both parties.


    While quality, delivery dependability, and price play the most vital roles in
    selecting a supplier, they are not the only considerations. Depending on the project
    and the specific types of materials required, other factors may play an even more
    important role. For example, a supplier must be financially stable in order to
    ensure the buyer that it will be around to fulfill the negotiated agreement. Warranties
    may also play an important role when buying roofing materials, wooden'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'doors, and cabinets. Finally, advantages in the areas of customer service or
    supplier location also may sway a buyer in the direction of a particular supplier.


    # ## Sources of Supplier Information


    Searching for an appropriate supplier for a specific material or service is a
    strategic issue in itself. In the new fast-paced and volatile buying environment,
    the construction organization must know where to look for required materials or
    equipment services. Materials and service buyers must become experts on the construction
    industry and in specific bulk materials or equipment services. There are many
    sources for the buying organization to consider when seeking out potential suppliers.
    Traditional buying sources—the local chambers of commerce, the Yellow Pages, trade
    shows, the Internet, the Association of General Contractors, and public libraries—are
    excellent sources of supplier data.


    # ## Strategic Selection


    The project manager should have a clear understanding of the strategy of the entire
    organization and have a specific project sourcing plan that complements and aids
    the overall strategy execution. Purchasing, logistics, materials management, and
    construction are functional areas that are linked closely together under the construction
    supply chain management umbrella. These functions must work as cohesive strategic
    competitive units where each one complements the other. It is from this perspective
    that the selection of strategic suppliers should take place.


    For example, if a firm’s strategy is to be differentiated by bidding highway work,
    then price will be secondary. Specifications, innovation, technology, and quality
    dominate the way the firm stays competitive and in compliance. This places a requirement
    on the project manager to be flexible and capable of change. Therefore, a supplier
    should be chosen who can adapt to the change that is mandated by the operating
    needs and contract change orders in the field. A “strategic match” is needed between
    the construction organization and supplier so that they can work in harmony as
    far into the future as they are compatible. The selection of suppliers should
    not be based solely on past performance but on the anticipated capabilities of
    the future. In order for good communication to exist between buyer and supplier,
    common ground should exist in management styles, control systems, quality philosophies,
    and technological abilities (e.g., engineering, design, and supply chain integration).
    The supplier selection decision should be viewed as an extension of the construction
    organization’s strategy.'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# Criteria for Supplier Evaluation


    There are two main categories of supplier evaluations: *process-based evaluations*
    and *performance-based evaluations*. The process-based evaluation is an assessment
    of the supplier’s production or service process. For strategic suppliers, the
    construction organization will conduct an audit at the supplier’s site to assess
    the level of capability in the supplier’s operating systems. Process flowcharts
    can be developed to identify the non-value-added activities that should be eliminated
    to improve business efficiency. In addition, large construction sourcing organizations
    are increasingly demanding that their suppliers become certified through third-party
    organizations.


    The *performance-based evaluation* is an assessment of the supplier’s actual performance
    according to a variety of criteria, such as delivery reliability, cost, and quality
    defect rate. It is a tactical assessment which measures the day-to-day performance
    of the supplying firm; hence, it is an after-the-fact evaluation. The performance-based
    evaluation is more common than the process-based evaluation, perhaps because objective
    data are readily available and easier to measure. Benefits of objective measurement
    schemes include reduced perceptual bias and a means for benchmarking a supplier’s
    performance. Three common performance-based supplier evaluation systems are described
    in the next section.


    # Three Common Supplier Evaluation Systems¹


    The three general types of supplier evaluation systems used today are the categorical
    method, the cost-ratio method, and the linear averaging method. In general, the
    guiding factors in determining which system is best are ease of implementation
    and overall reliability of the system. It should be noted that the interpretation
    of the results from any of these three systems is a matter of the buying organization’s
    judgment.


    # Categorical Method


    The categorical method involves categorizing each supplier’s performance in specific
    areas defined by a list of relevant performance variables. The buyer develops
    a list of performance factors for each supplier and keeps track of each area by
    assigning a “grade” in simple terms, such as “good,” “neutral,” and “unsatisfactory.”
    At frequent meetings between the buying organization and the supplier, the buyer
    will inform the supplier of its performance. See Table 4.1.


    The categorical method is a simple and informal system in the sense that detailed
    performance achievements or shortcomings are not measured. Instead, it is primarily
    used as a basic evaluation tool between top managers in the buying organization
    and the selling organization, while still permitting the discussion of past performance,'
  merge: -1
  img_proc: true
