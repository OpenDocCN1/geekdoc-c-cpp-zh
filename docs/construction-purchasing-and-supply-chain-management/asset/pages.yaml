    A Harvard Business School study concluded that a key driver in the decline of
    U.S. competitiveness in the international marketplace has originated from investing
    less in intangible benefits such as rela-tionship building.^4^ According to MacNeil,
    it is impossible to operate as a discrete entity. But, while virtually no firm
    has completely dis-crete engagements, conventional Western and American business
    practices have been more oriented toward discrete than relational strategies.^5^
    Traditionally, U.S. firms have based their drive for success on autonomy and have
    viewed competition as a Darwinistic keeper of American superiority. Long-run U.S.
    firm planning has been inde-pendent, and considerable efforts are taken to ensure
    privacy of com-pany information.


    Over recent decades, however, American firms within the supply chain have begun
    to realize the advantages enjoyed from sharing technology, information, and planning
    with other firms and even competitors. Many modernistic business thinkers will
    claim that a more open and relational attitude is not only advantageous, but is
    also actually essential and inevitable in maintaining a competitive advantage.
    The idea of relationalism between firms seeks to move away from the concept of
    discrete transactions, breaking down tradi-tional intrafirm barriers. See Table
    1.3. Firms unite to share informa-tion and planning efforts, thus reducing uncertainty
    as well as increasing control. In the end, supply chain partners reap the benefits
    of the joint effort.


    Modern construction improvements such as Lean management methods require the tighter
    control generated by the construction supply chain partnership.'
