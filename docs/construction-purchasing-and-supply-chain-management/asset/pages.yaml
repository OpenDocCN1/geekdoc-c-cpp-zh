  md: 'Construction sourcing risks involve all of the entities in the supply chain:
    the project owner, architect, prime contractor, subcontractors, and suppliers.
    The potential for mistakes and problems is magnified by the interrelationships
    between these entities. Some of the risks include:


    +   - Internal financial problems

    +   - Working capital problems

    +   - Slow payment from project owner

    +   - Inferior plans and specifications

    +   - Inadequate technical capabilities

    +   - Insufficient information technology

    +   - Lack of communication between supply chain partners

    +   - Productivity inefficiencies

    +   - Work quality problems

    +   - Work method problems

    +   - Delivery reliability problems

    +   - Bulk materials quality problems


    Any of these adverse events independently or together could cause the entire supply
    chain to go bankrupt. Supply risk management involves identifying and assessing
    alternative strategies for eliminating and reducing supply chain sourcing risks.
    Perhaps the most important component of risk management is the certification,
    prequalification, and monitoring of all supply chain participants.


    Operations, how to generate a product or service and get it to market, is a critical
    business function. The contrasts between the risks in manufacturing and construction
    are significant when one compares the operations component (project delivery system,
    product/service, employees, response time, and location) in both industries. The
    differences suggest the need for knowledge-based solutions like supply chain management
    that can achieve process improvements in the construction business model. A classic
    manufacturing process is predictable, stable, capital-intensive, and technocratic.
    The typical supply chain network is simple and centralized, and includes multiple
    suppliers, the manufacturer, and the ultimate customer. See Fig. 1.3.


    The customer is isolated from the process and for the most part, is only affected
    indirectly, if at all, by any malfunction. The product in manufacturing is typically
    mass produced, standardized and durable, and can be transported. In addition,
    the product can usually be produced ahead of time, which makes it easier to balance
    resources with demand. Products can even be backordered. Employees in manufacturing
    sometimes have wages that are based on output. In the'
