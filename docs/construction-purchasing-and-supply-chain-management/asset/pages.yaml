    motivating by fear</li><li>Leading by personality versus company policies</li></ul></td></tr>

    </table>


    TABLE 8.1 Construction Company Focus Analysis Example (Continued)


    # Conclusion


    Horizontal and vertical infrastructure construction projects are increasing at
    an impressive rate. Two construction supply chain models encompass the variety
    of specific project types discussed in Chap. 1. Horizontal projects are usually
    publicly funded and characterized by government agencies in the role of the project
    owner. In addition to the project owner''s own in-house technical capabilities,
    the supply chain members have substantial engineering expertise. Vertical projects
    may have public or private funding. Construction managers are a key supply chain
    entity in the vertical model. Because of private ownership issues there can be
    vulnerability to bankruptcy in some variations of the vertical model.


    # Reference


    +   1. American Recovery and Reinvestment Act, H.R. 1—92-94.'
