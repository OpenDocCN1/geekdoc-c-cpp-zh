    A successful construction supply chain relationship requires that both the prime
    contractor and subcontractor make concessions. To simplify matters, the following
    bargaining conditions are assumed to exist:


    +   1. Each subcontract negotiation is an independent event.

    +   2. The bargainers are honorable people.

    +   3. The decisions are binding.

    +   4. No arbitration or third party is available to assist bargainers.

    +   5. Any party can break off the negotiation and continue as before.

    +   6. The setting and language are not important.


    Subcontractors and prime contractors tend to have conflicting bargaining goals.
    The aim of the prime contractor is to influence the subcontractor''s actions to
    its advantage. This goal is effectively communicated and reinforced by the prime
    contractor''s cost structure. Subcontractors often agree to conditions and terms
    that do not consider their company''s total cost structure. Logic dictates a similar
    objective for power imbalances between the prime contractor and the subcontractor.


    # ## Awarding Major Subcontractors


    In major high-value subcontracts a pre-award meeting between the prime and the
    subcontractor is important to ensure that the scope of work, technical requirements,
    and scheduling requirements are fully understood. See Fig. 5.8. The subcontractor''s
    managerial capabilities and financial health should also be reviewed and confirmed.
    After the pre-award assessment process is complete, the contracting manager recommends
    the subcontractor to the project manager. The complete subcontractor data file
    is submitted by the contracting manager to the project manager. The contracting
    manager should then brief the project manager on the subcontractor''s technical,
    managerial, quality, and field support capabilities. The final step in the award
    process is to issue a letter of intent to inform the successful bidder that he
    or she has been awarded the contract. See Fig. 5.9. The purpose of the letter
    of intent is to signal to the subcontractor to plan for the forthcoming mobilization.
    A notice is also sent to the unsuccessful bidders. See Fig. 5.10.


