- pgno: 246
  md: '**Vendor performance evaluation** A ranking and evaluation of vendors’ and
    suppliers’ performance based on quality of work, compliance with specifications,
    delivery, and cost.


    **Vendor’s lien** A seller’s right to retain possession of materials or equipment
    until he or she has received payment.


    **Verification** Witnessing of certain steps in the fabrication and manufacturing
    process, such as metallurgical analysis, hydrostatic and performance, or operational
    tests. Review and audit of nondestructive testing, x-rays, and bench tests.


    **Vessel-ton** One hundred cubic feet of volume.


    **Vicarious liability** An individual or organization that is liable for the results
    of another individual’s or organization’s failure to act.


    **Visual inspection** Manual inspection of materials and equipment.


    **VNX** Value not exceeding.


    **Volume discount** A reduction in unit cost predicted on the size of a particular
    purchase.


    **Waive** To give up a right or claim; to refrain from claiming or pressing.


    **Warehouse** A facility for the receiving, storage, and eventual distribution
    of materials and equipment.


    **Warehouse receipt** A document given by the warehouseman as a receipt for materials
    and equipment placed in the warehouse.


    **Warranty** A promise or pledge that something is what it is claimed to be. The
    seller makes a specific assurance concerning the nature, quality, and character
    of the goods.


    **Waste** The refuse from the fabrication and manufacturing process that cannot
    be reclaimed or reused.


    **Waybill** A document compiled at the point of origin of a shipment indicating
    the point of origin, final destination, route, purchaser, seller, description
    of shipment, and the cost of the transportation.


    **Weight, gross** The actual combined weight of the item, container, or any dunnage
    materials.


    **Weight, net** The actual weight of the item; does not include container, or
    any dunnage materials.


    **Weight, tare** The difference between the gross weight and the net weight of
    an item being shipped; weight of empty container, including dunnage packing material
    used in transport.


    **Wholesaler** An individual or organization that acquires products, materials,
    and equipment for resale to retailers or other users.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '**Workers'' compensation insurance** The insurance required of employers that
    provides compensation for injury and loss of wages for a work-related accident.


    **Work in progress** Materials or equipment in various states of fabrication or
    completion.


    **Work Order** A written form that describes an activity to be completed.'
  merge: -1
  img_proc: true
