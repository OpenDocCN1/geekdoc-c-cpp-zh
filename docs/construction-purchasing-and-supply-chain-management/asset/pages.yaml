- pgno: 217
  md: 'By reviewing properly made modifications to a standard AIA Contract Document,
    parties familiar with that document can quickly understand the essence of the
    proposed relationship. Commercial exchanges are greatly simplified and expedited,
    good faith dealing is encouraged, and otherwise latent clauses are exposed for
    scrutiny.


    AIA Contract Documents may not be retyped or electronically scanned. Retyping
    can introduce typographic errors and cloud legal interpretation given to a standard
    clause. Furthermore, retyping and electronic scanning are not permitted under
    the user’s limited license for use of the document, constitute the creation of
