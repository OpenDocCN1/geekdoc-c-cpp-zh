  md: 'incremental cash flows from the purchased equipment should be measured. The
    economic life of the equipment investment versus the physical life of the purchased
    equipment investment must also be considered.


    Life cycle costing is an evaluation method used to assess alternative equipment
    purchasing proposals. Life cycle costing is based on the total cost of ownership
    (TCO) over the expected life of the purchased equipment. The total cost components
    are given as follows:


    +   - Research

    +   - Development

    +   - Productivity

    +   - Operation

    +   - Maintenance


    There are numerous testimonials regarding the use of life cycle costing for both
    capital equipment and systems acquisition. Consider a construction organization
    that currently spends an average of $1,500 per month to maintain a 1996 Caterpillar
    Motor Grader. Recently the company purchased a 2004 Caterpillar Motor Grader at
    an auction for $100,000 based on the life cycle costing concept. The average monthly
    maintenance cost for the 2006 Motor Grader is $220 for the remaining life of the
    2006 Caterpillar Motor Grader. The efficiency and cost of operating also will
    have a significant effect on the construction equipment acquisition. Productivity,
    dependability, and durability are the principal operating variables that must
    be investigated.


    # ## Economic Evaluation


    The five most commonly used methods for an economic evaluation of individual projects
    are *payback*, *average rate of return*, *net present value*, *internal rate of
    return*, and *profitability index*. These methods can be used to measure the financial
    performance of individual equipment purchases. Prior to applying a particular
    method, the construction organization must set a predetermined required rate of
    return based on its business plan. To illustrate the concept of economic evaluation,
    consider the Motor Grader example.


    # ### Example: Motor Grader


    Suppose Hoosier Pride Construction, Inc., is considering purchasing the used Motor
    Grader mentioned herein. Assume the complete stream of *estimated after-tax cash
    flows (EATCF)* is


    | Year | 0 | 1 | 2 | 3 | 4 |

    |---|---|---|---|---|---|

    | EATCF($) | -100,000 | 40,000 | 40,000 | 30,000 | 30,000 |


    These data will be used to illustrate the five economic evaluation criteria.'
