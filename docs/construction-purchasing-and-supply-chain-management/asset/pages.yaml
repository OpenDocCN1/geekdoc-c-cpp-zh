    # CONSENSUSDOCS 300


    STANDARD FORM OF TRI-PARTY AGREEMENT FOR

    COLLABORATIVE PROJECT DELIVERY


    This document was developed through a collaborative effort of entities representing
    a wide cross-section of the construction industry. The organizations endorsing
    this document believe it represents a fair and reasonable consensus among the
    collaborating parties of allocation of risk and responsibilities in an effort
    to appropriately balance the critical interests and concerns of all project participants.


    These endorsing organizations recognize and understand that users of this document
    must review and adapt this document to meet their particular needs, the specific
    requirements of the project, and applicable laws. Users are encouraged to consult
    legal, insurance and surety advisors before modifying or completing this document.
    Further information on this document and the perspectives of endorsing organizations
    is available in the ConsensusDOCS Guidebook.


    # TABLE OF ARTICLES


    +   1. AGREEMENT

    +   2. DEFINITIONS

    +   3. COLLABORATIVE PRINCIPLES

    +   4. MANAGEMENT BY THE MANAGEMENT GROUP'
