  md: '# # Supply Chain Management and Competitive Construction Operations


    This discussion leads to the conclusion that a single construction firm cannot
    necessarily position itself as an *operations efficiency* leader without the help
    of other firms in the chain. A fifth element necessary for a competitive construction
    operation is *supply chain control*. Specifically, the supply chain consists of
    all firms and organizations which contribute delivery of a high-quality project
    or service to the project owner. Japanese manufacturers achieved tight control
    over their supply chains with the *keiretsu*, which is described as a business
    cohort which relies on cooperation, coordination, and control to competitively
    position businesses and industry norms. While *keiretsu* activities are driven
    by the unique legal and cultural environment in Japan, transferring the keiretsu-like
    philosophy to the United States has yielded the concept of *supply chain management*.


    Supply chain management involves the strategic and process coordination of subcontractors,
    material suppliers, and information within the supply chain to deliver satisfaction
    to the ultimate project owner. While each business entity in the supply chain
    has been traditionally driven by self-profitability, the notion of supply chain
    management involves optimization of synergistic relationships between supply chain
    members to ultimately satisfy the project owner. The concept evolves from controlling
    the supply chain as a single process rather than as a sum of independent transactional
    relationships. The expected end result is a mutually beneficial, win-win partnership
    that creates a synergistic supply chain in which the entire chain is more effective
    than the sum of its individual parts.


    Ideally, supply chain management represents a win-win, utopian goal of circular
    benefits. See Fig. 1.9. Each company in the supply chain obtains its own profitability
    and success by creating customer value in terms of a functional, high-quality
    project at an acceptable price. Each organization within the supply chain can
    reduce its own costs and increase its project performance through supply chain
    management, thereby enabling the supply chain to deliver value to the project
    owner. The satisfied project owner in turn rewards the supply chain with loyal
    contracting power, allowing profitability to be transferred back down throughout
    the supply chain. This in turn fosters further supply chain integration and responsiveness,
    causing the cycle to repeat.


    As mentioned above, a prime contractor may be able to position a firm as a market
    leader through exploitation of best practice operations, but the nature of the
    linked firms in the supply chain necessitates that subcontractors and material
    suppliers must be part of this strategy. The prime contractor cannot become an
    industry leader without supply chain support, and, thus, supply chain'
