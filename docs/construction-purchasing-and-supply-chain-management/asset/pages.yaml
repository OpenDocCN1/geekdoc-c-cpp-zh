- pgno: 17
  md: '# Manufacturing Risks versus Construction Risks


    Knight² defined the difference between risk and uncertainty: Risk is measurable,
    but uncertainty cannot be measured. Therefore, supplier and contractor risks can
    be defined as SCR = PA × NC, where SCR = supplier and contractor risks, PA = the
    probability that an adverse event will occur, and NC = negative consequences if
    the adverse event occurs, assuming that each of the adverse events is independent.


    The notion of risk versus reward in the construction industry is counterintuitive
    because the expected risk reward curve in the manufacturing industry is positively
    correlated, meaning that for each unit of risk an approximate reward follows (Ceteris
