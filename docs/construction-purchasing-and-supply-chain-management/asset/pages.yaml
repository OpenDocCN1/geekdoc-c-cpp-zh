  md: 'reference in the subcontract agreement. In short, even if they have not read
    it or have never seen it, subcontractors are bound to the project owner by the
    same terms and conditions as the prime contractor. These conduit, or “flow-down,”
    terms from the prime contractor’s agreement with the owner provide that the subcontract
    incorporates the prime contract provisions that apply to the subcontracted work.
    Where these flow-down terms become difficult is when the most onerous provisions
    are pushed down to the subcontractor; but reciprocal rights, as between the owner
    and prime contractor, are not always pushed down and included in the subcontractor’s
    agreement. Both the AIA and Consensus DOCS subcontract agreements take the most
    equitable position and give the subcontractor reciprocal rights, meaning that
    the subcontractor has the same rights against the prime contractor as the prime
    contractor has against the owner.⁴


    Consensus DOCS specifically requires that the prime contractor provide the subcontractor
    with copies of the contracts to which the subcontractor is bound.⁵ The AIA subcontract
    states that the prime contractor make available to the subcontractor copies of
    the agreement between the prime contractor and the owner.⁶ Sharing the prime contract
    agreement with the strategic subcontractor who is bound by its terms may seem
    basic, but this level of information sharing and transparency is a giant step
    away from industry practices that seek to cut off the information flow and keep
    strategic subcontractors in the dark.


    In the traditional fragmented project delivery system, there have been some advances
    in information sharing at critical junctures in the construction process. For
    example, the project dispute resolution system, at least in Consensus DOCS, is
