  md: 'Similar terms are found in CD 750, “Agreement between Contractor and Subcontractor,”
    Section 11.5. The AIA documents provide that the initial decision maker (IDM)
    will make the first determination about any claims that are made except for claims
    involving hazardous materials, emergencies, and subrogation. In AIA 201—2007,
    the parties can agree that someone other than the architect will act as the IDM.
    A neutral choice for IDM may be advisable since some claims actually involve the
    architect’s role in contract administration.⁷ EJCDC—C 700 (2007) requires that,
    as a condition precedent, most claims must be first referred to the engineer before
    the owner or contractor pursues any other remedies.⁸ Over time, other contract
    terms have been modified to inspire more balance and parity between supply chain
    members. Indemnification is one of those provisions. Construction jobsites are
    dangerous and, unfortunately, can be the scene of serious accidents. When those
    accidents occur and workers and others are injured, claims and litigation frequently
    ensue and all of the supply chain members are named as parties. Indemnification
    or hold-harmless provisions are contractual terms which set forth one party’s
    obligation to assume another party’s liability to third parties if there is bodily
    injury and death, and/or property loss on a jobsite. The types of indemnity provisions
    are defined below using supply chain entities as the parties.


    +   - Limited form indemnity means that the subcontractor will pay for losses
    that are the subcontractor’s fault.

    +   - Intermediate form indemnity means that the subcontractor will pay for losses
    that are partly the prime contractor’s fault.

    +   - Broad form indemnity means that the subcontractor will pay for all losses
    even though they may be solely the prime contractor’s fault.


    Not only do indemnity provisions obligate a party to pay for losses, they typically
    include provisions which require a party to pay attorneys’ fees and defense costs
    incurred by the party being indemnified. Unfair indemnification provisions can
    lead to the insolvency of individual supply chain entities and adversely impact
    the solvency of an entire project. Adequate insurance coverage can buffer the
    impact of paying claims due to contractual indemnification. The indemnity provisions
    in the industry contracts are generally moving more toward a supply chain philosophy.
    The AIA, Consensus DOCS, and EJCDC have comparable terms that embrace the more
    desirable limited form indemnity model for subcontractors and downstream supply
    chain members. However, AIA and EJCDC contracts could do more for upstream entities
    by implementing mutual indemnity, as between the owner and the prime contractor.
    The more impartial individual contract terms in the construction industry have
    changed'
