    # AIA® Document A295™—2008 Instructions


    *General Conditions of the Contract for Integrated Project Delivery*


    # GENERAL INFORMATION


    Purpose. Integrated Project Delivery is a project delivery approach that integrates
    people, systems, business structures, and practices into a process that collaboratively
    harnesses the talents and insights of all participants to reduce waste and optimize
    efficiency through all phases of design, fabrication, and construction. AIA Document
    A295–2008, a general conditions form, provides the terms and conditions under
    which the Owner, Contractor, and Architect will work together on a Project that
    utilizes Integrated Project Delivery and is the cornerstone of this delivery model.


    A295–2008 integrates the duties and services of the Owner, Architect, and Contractor
    through each phase of Integrated Project Delivery. A295–2008 describes the services
    and duties of the Owner, Contractor,


    > *Reproduced with permission of The American Institute of Architects, 1735 New
    York Avenue, NW, Washington, D.C., 2006.'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'and Architect in six phases: Conceptualization; Criteria Design; Detailed Design;
    Implementation Documents; Construction; and Closeout. Throughout the Conceptualization,
    Criteria Design, and Detailed Design phases, the Architect performs its design
    services in close collaboration with the Owner and Contractor. The Contractor,
    during the design phases, provides estimating and other advisory services, such
    as constructability reviews, to inform the Architect’s design. At the conclusion
    of the Detailed Design Phase, the Owner and Contractor negotiate a Guaranteed
    Maximum Price and the GMP Documents are identified. The Contractor is thereafter
    required to construct the Project in accordance with the GMP Documents. Upon establishment
    of the Guaranteed Maximum Price, A295–2008 provides essential terms for the construction
    contract, clearly delineating the duties of the Owner, Contractor, and Architect
    through the Implementation Documents, Construction, and Closeout Phases.


    In addition to the unique manner in which A295–2008 describes the Owner, Architect,
    and Contractor’s duties, it also requires the utilization of a building information
    model to the greatest extent practicable. A building information model is a digital
    representation of the physical and functional characteristics of the Project.
    The building information model may consist of a single model or multiple models
    used in the aggregate. In order to utilize the building information model and
    any other digital information used on the Project in the most efficient manner,
    A295–2008 requires the Owner, Architect, and Contractor to meet and delineate
    the types of software to be used, standards and tolerances required, and the permitted
    uses for all such digital information. Such determinations are to be set forth
    in AIA Form E201™–2007, or a similar protocol document, that is incorporated by
    reference into all agreements for services or construction for the Project.


    In order to achieve this highly collaborative process, the terms of A295–2008
    are incorporated by reference into the Owner-Architect and Owner-Contractor Agreements.
    A295–2008 should also be incorporated by reference into any consultant and subcontractor
    agreements the Architect and Contractor may enter into. The result is that the
    parties establish a common basis for the primary and secondary relationships of
    Integrated Project Delivery.


    **Related Documents.** A295–2008 is incorporated by reference into B195™–2008,
    Standard Form of Agreement between Owner and Architect for Integrated Project
    Delivery and A195™–2008, Standard Form of Agreement between Owner and Contractor
    for Integrated Project Delivery. A295–2008 may also be adopted by indirect reference
    into the Architect-Consultant agreement when the prime Agreement between Owner
    and Architect adopts A295–2008 and it is in turn adopted into'
