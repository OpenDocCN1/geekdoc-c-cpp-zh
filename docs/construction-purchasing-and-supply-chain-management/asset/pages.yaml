- pgno: 24
  md: 'When integrated with continuous improvement, CSCM can successfully address
    major problems of the construction industry and its project owners.


    CSCM can systematically reduce sources of uncertainty through the active cooperation
    of all entities in the supply chain in four functional areas: preconstruction
    design and contractor selection, construction, information management, and risk
    management.


    # Preconstruction Design and Contractor Selection


    After the owner makes its own internal determination to proceed with a new project,
    a qualified architect or engineering firm is selected to develop a design. A request
    for proposal (RFP) is initiated to solicit architectural services. The architect’s
    compensation is established by negotiations. The next step is to develop an appropriate
    design that meets the owner’s requirements in terms of constructability and functionality.
    The architect then communicates the final project design, specifications, and
    bid to documents to a pool of qualified contractors. The prime contractor may
    be selected through a competitive bid process where the award is made to the most
    responsive low bidder or through negotiations. Whether prime contractor or subcontractor,
    there are four prevalent kinds of pricing methods that are widely used in the
    construction industry:


    +   1. Single fixed price (lump sum)

    +   2. Negotiated, cost plus a fee

    +   3. Unit price

    +   4. Design build


    After the award, contract documents are signed between the owner and the prime
    contractor or construction manager. Those agreements are typically either customized
    or standardized industry forms, such as the family of construction documents available
    through the American Institute of Architects (AIA), the series of contract documents
    developed by the Engineers Joint Contract Documents Committee (EJCDC) in 1975
    and revised in 2007, or a new set of agreements, ConsensusDOCS, which have been
    endorsed by 22 contractor and other industry groups led by the Associated General
    Contractors of America (AGC).³ With a signed contract between the owner and the
    prime contractor or construction manager, the material suppliers and subcontractors
    are selected and similar documents are then signed by all entities downstream
    in the supply chain. Depending on the nature of the project, the selection of
    subcontractors can be ongoing as various segments of a project are “packaged”
    for bidding by trade. See Chap. 7 for more about CSCM and contract documents in
    the principal market segments discussed in this book.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# **Construction**


    This phase is the core of production, and it includes critical activities such
    as scheduling; site coordination; and resource, material, and logistics management.
    This phase might also include the selection of additional contractors if the project
    is presented to the industry in trade “packages.”


    # **Information Management**


    This area includes project information demand and supply (information transparency,
    flow, acquisition, availability, and sharing). The key elements in information
    management uncertainty are analyzed in terms of how they contribute to inefficiencies
    in information upstream and downstream of the construction process. At the same
    time, subcontractors, materials, equipment, and even funds move in response to
    signals from the information flow. However, in construction projects these flows
    take place in the context of linkages between independent organizations. In a
    pre-CSCM environment, there is an informal reliance on information management
    to coordinate the chain. The strength of CSCM is that it crosses organizational
    boundaries, organizing information and process flows, sending signals to operations,
    and evaluating results. As a result, information management is the life blood
    of *construction* SCM.


    # **Risk Management**


    The potential for liability in any business has a direct correlation to the relationships
    in that business, that is, dealings with other businesses, employees, and the
    general public. Disputes between customers, subcontractors, and suppliers almost
    always occur because of poor initial communications and attempts to shift risk
    unfairly through egregious contractual provisions. Disgruntled employees negatively
    affect productivity. As ambassadors for the employer, dissatisfied workers can
    be detrimental to customer relationships. In construction, employees on the jobsite
    have substantial interactions with the project owner and other entities in the
    supply chain. Liability that stems from accidents is unfortunate and hard to predict;
    however, it can be reduced and managed through safety programs that foster a safe
    work environment. The paradigm of CSCM can play a significant role in developing
    relationships within the supply chain that reduce the exposure to contractual
    claims disputes. This development of relationships works to minimize accidents
    and create an overall environment of productive employees.


    # **Critical Elements for Best Practice Construction**


    The construction industry has seen fierce price competition in the past decade,
    making survival a more arduous task. The competitive strategies of low-cost, high-quality,
    on-time project completion, and'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'flexible leadership allow firms the ability to compete by positioning *operational
    efficiency* as a competitive weapon. In today''s business environment, this competitive
    edge is not only a must for a market leader in the construction industry, but
    a necessity for all construction industry firms just to survive. The creation
    and maintenance of operational leadership, however, is a difficult and complex
    process, and construction firms must foster a set of new, critical elements in
    order to develop best practice construction operations. There are several established
    best practices for forecasting the benefits of CSCM. See Fig. 1.7.


    First, the construction industry must develop a sincere *attitude adjustment*
    toward a strong dedication to operational efficiency. The belief and commitment
    toward developing operational efficiency as a profit driver requires a high level
    of organizational support that must be communicated throughout the firm. Operational
    analysis must play a prominent role in business strategy for successful construction
    operations. This leads to a second necessary operational element of *continuous
    improvement*. An established competitive advantage means little if the construction
    firm is not able to sustain it from project to project, and, thus, construction
    industry leaders must retain a fundamental spirit of anticipation (instead of
    reaction) to changes and problems. Realizing that most major advances result from
    small changes over time, the construction industry must create an environment
    of continuous project and process (work method) improvement. This requires employee
    training and empowerment as these small changes will more effectively come from
    the quality of the work force.


    The third component required to position operations efficiency as a source of
    advantage is the *elimination of waste*. To be able to reduce costs


    ![](img/5a99b8094bd51e396d3bb39b49a21371_26_0.png)


