- pgno: 71
  md: 'Relationships with strategic sources need to be closely managed. One way to
    keep up on supplier relationships is for a prime contractor to compile supplier
    profiles for each strategic source. These profiles should include items such as
    key management contacts, a company overview, SWOT (strengths, weaknesses, opportunities,
    threats) analysis, Porter''s five key financial figures, information on current
    contracts, "owners" of the relationship within the firm, and an organizational
    chart. See the example profile at the end of the chapter.³ While the process of
    compiling these profiles should be owned by the supply sourcing manager, the content
    of the profiles should be owned by all functions of the construction organization.
    Functional ownership of the content will ensure that all areas within the construction
    operation that deal with each of the strategic suppliers will have input in the
    necessary content of the profiles. Ownership of the process by the supply sourcing
    manager/department makes certain that there is only one source of strategic source
    profiles for the entire firm. This method also ensures that the supply sourcing
    manager/department is knowledgeable about all strategic sources and aware of how
    they are rated by each function. In addition to the strategic source profiles,
    the construction organization should clearly establish expectations for strategic
    sources and discuss plans and projects for the future; this is typically done
    with an annual review period. Public and private project owners may also have
    their own evaluation system that includes not only the prime contractor but also
    specific evaluations of all entities within the supply chain.


    # ## Strategic Source Performance Review Process


    The construction organization should have a process for managing performance and
    giving feedback to the subcontractors and suppliers. This process is typically
    accomplished by asking the subcontractor/supplier for a performance self assessment
    and then communicating to the strategic source subcontractor/supplier exactly
    how the prime contracting firm rates its performance. Most often there is some
    sort of reward and punishment system put in place by the construction sourcing
    organization to further encourage excellent performance. SMS has addressed the
    feedback and performance management phase.


    An overview can be beneficial in developing a clear idea of the supplier performance
    review process. A performance review is a set of expectations and measurements
    for controlling long-term relationships with existing strategic subcontractors/suppliers.
    It includes consistent measurements for establishing positive relationships with
    new strategic sources and evaluating current performance of the existing ones,
    according to the expectations of SMS. The SMS review process has a standard template
    that is used as a guideline for informing a customized review process with criteria
    specific to each strategic source.'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'The performance review template includes a personal meeting with the prime
    contractor''s manager or superintendent. Having the project manager in the performance
    review of a strategic source is beneficial for the prime contracting firm and
    fosters cross-functional communication. By getting input from the person directly
    responsible for each strategic source, a more complete review of performance is
    possible.


    The general review process should take approximately 2 work days to complete.
    The first step is to schedule a review process for each individual strategic source;
    the review date is established when the contract is signed. Approximately 5 days
    before the review date, an SMS-developed questionnaire specific to their needs
    and those of the strategic source is sent. The strategic source is then required
    to complete the questionnaire and return it to SMS no later than 2 days prior
    to the meeting. After an internal review is completed, a final analysis of the
    project relationship expectations is communicated to the strategic source. Within
    the next few days, meetings are held between them, where all of the action items
    are recorded. The final step is the distribution of the minutes from the meetings
    between SMS and the strategic source and the official publication of action items.
    See Fig. 3.3.


    SMS has various review categories that are used to fully assess their strategic
    sources. Quality is a very important review category. SMS requires their strategic
    sources to meet or exceed their performance standards and proactively initiate
    quality process improvements. Customer service is expected to be proactive and
    flexible, and delivery performance needs to be optimized. The most important attributes
    that SMS seeks are high quality and on time completion. Technology and innovation
    are important in order to stay ahead of or at pace with competition and help keep
    SMS at the top of their field. It is necessary for SMS to have suppliers who are
    open about their total costs. Cost reduction and continuous process improvement
    is necessary in order to keep costs down and create trust with strategic sources.
    The last category is very important from an ethical standpoint for SMS and anyone
    with whom they work. Every supplier must have formal environmental, health, operational,
    and safety programs. In addition, they should put forth the effort to reduce,
    reuse, and recycle when possible. These categories, as well as others, are used
    in the development of the questionnaire for each source.


    # **Strategic Supplier Relationship Scoring System**


    The scoring system for each strategic source is done on a scale from 0.0 to 4.0
    (where 4.0 is the highest possible score), meaning that there are five different
    ratings that range from exceptional to unacceptable. The weaker the score, the
    more often the supplier needs to be evaluated. When a subcontractor/supplier rates
    between 2.5 and 4.0, (exceptional and very good strategic sources) there are annual
    evaluations.'
  merge: -1
  img_proc: true
