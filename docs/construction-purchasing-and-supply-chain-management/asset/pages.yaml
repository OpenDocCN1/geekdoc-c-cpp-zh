    # ## Pre-Bid Conference


    If the project is large, complex and includes security concerns, it may be desirable
    to require a *mandatory* pre-bid meeting in order to answer any questions related
    to the bid package. Mandatory pre-bid meetings, even for prime contractors, are
    rare in most markets, especially heavy highway. When a pre-bid meeting is mandatory,
    potential bidders must attend or they are precluded from bidding. The pre-bid
    conference ensures that all potential subcontractors have the same interpretations
    of the requirements. In most cases, pre-bid conferences will result in lower prices,
    especially when there are several potential bidders. The prime contractor must
    make every attempt to'
