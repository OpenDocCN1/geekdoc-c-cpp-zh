    # Conclusion


    Construction organizations cannot afford to ignore subcontractor/supplier relationship
    management. Competitive advantages can be gained through their superior management.
    Given the competitive nature of the current business environment, a firm could
    potentially go out of business if it neglects proper management of strategic subcontractor/supplier
