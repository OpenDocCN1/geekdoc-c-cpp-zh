    The state departments of transportation are playing a critical role in the federal
    economic stimulus plan, 2009 American Recovery and Reinvestment Act. The flow
    of money and controls from FHWA to the DOTs makes the horizontal heavy construction
    model ideal for managing the economic stimulus program. The law provides approximately
    27.5 billion for highway work and requires that one-half of the funds be'
