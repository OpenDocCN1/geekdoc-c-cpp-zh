- pgno: 43
  md: '![](img/5a99b8094bd51e396d3bb39b49a21371_43_0.png)


    **FIGURE 2.2** Construction transformation process.


    contractor coordinates the transformation process based on three basic criteria—completing
    the project on time, coming in under budget, and delivering an acceptable high-quality
    project to the owner.


    # ## Objectives and Activities of Construction Supply Sourcing


    The purpose of the supply sourcing function for construction organizations is
    to buy materials and services of the right quality, in the right quantity, and
    at the right price from the right source at the right time. The supply sourcing
    department assists the project team in performing their responsibilities within
    the project''s budgetary and scheduling goals. Supply sourcing managers and purchasing
    agents seek to obtain the highest-quality subcontractors and materials at the
    lowest possible cost for their organizations. Sourcing managers determine which
    bulk materials, commodities, or services are best; choose the suppliers of the
    material or service; negotiate the lowest price and award contracts that ensure
    that the correct amount of the material or service is received at the appropriate
    time. In small construction firms, the owner is usually responsible for all of
    the sourcing and purchasing functions. In order to accomplish these tasks successfully,
    sourcing managers (owners) must identify the most qualified suppliers. Supply
    sourcing managers must also become experts on the materials and services that
    they purchase.


    Managers in this critical sourcing function evaluate suppliers on the basis of
    quality, price, service support, availability, and reliability'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'in order to purchase services competitively and wisely. To assist them in their
    search for the right subcontractors and suppliers, sourcing managers review catalogs,
    industry and company databases, government directories, and trade journals. Much
    of this information is now available on the Internet. Sourcing managers research
    the reputation and history of the subcontractors and suppliers, and advertise
    anticipated purchase actions in order to solicit bids. At meetings, trade shows,
    conferences, suppliers’ plants, and field sites, they examine materials and services,
    assess a supplier’s performance capabilities, and discuss other technical and
    business considerations that influence the sourcing decision. Once all of the
    necessary information on suppliers is gathered, purchase orders are placed and
    contracts are awarded to those suppliers who meet the contractor requirements.


    To keep inventory investment to a minimum, the sourcing professional must implement
    just-in-time (lean) purchasing concepts. Just-in-time requires on-time, frequent
    deliveries of reliable small batches of high-quality materials. The supply manager
    is always developing reliable alternative suppliers and subcontractors. New sources
    for equipment and materials must be developed in order to eliminate single sourcing.
    The overall goal of the sourcing manager is to achieve maximum integration with
    upstream and downstream supply chain members. This integration involves communication
    and information sharing.


    Several key objectives for construction supply sourcing applicable to both horizontal
    and vertical construction organizations are listed below. The guiding principle
    of these objectives is to obtain the maximum value for each dollar spent.


    +   1. To assist the project team in performing their responsibilities within
    the project’s budgetary and scheduling goals.

    +   2. To purchase and source services competitively. (In order to source competitively
    and wisely, supply managers must be experts on the materials and subcontracting
    services that they purchase.)

    +   3. To keep inventory investment (i.e., deterioration and theft) to a minimum
    by implementing just-in-time (lean) purchasing concepts for the jobsite.

    +   4. To develop and maintain good relationships with supply chain members (suppliers
    and subcontractors).

    +   5. To develop reliable alternative suppliers and subcontractors.

    +   6. To achieve maximum integration with upstream and downstream supply chain
    members.

    +   7. To continue to develop innovative systems for recruiting, training, and
    retaining purchasing and supply chain talent.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '+   8. To prepare patterns of administration for sourcing materials, equipment,
    services, and subcontracts.

    +   9. To prequalify, select, and evaluate suppliers and subcontractors.

    +   10. To establish and update database of current and potential suppliers and
    subcontractors.

    +   11. To conduct background checks on current and potential consultants, suppliers,
    and subcontractors.

    +   12. To study scope of work for each active project.

    +   13. To review and evaluate invitation to bid.

    +   14. To conduct bid opening and/or participate in the proposal evaluation team.

    +   15. To inform successful and unsuccessful bidders in timely manner.

    +   16. To prepare contract and associated details.

    +   17. To participate in the negotiations team.

    +   18. To participate in change order variances from the initial contract.

    +   19. To seek out bids from women- and minority-owned businesses and monitor
    compliance after selection and award.

    +   20. To prepare purchase orders, contracts, and subcontracts for engineering
    and construction.

    +   21. To coordinate submittal of shop drawings and other specification requirements.

    +   22. To schedule shipping and transportation.

    +   23. To prepare back charges with the assistance of the project manager.

    +   24. To coordinate and track invoice approval process.

    +   25. To participate in purchase order and subcontract closeout activities with
    the assistance of the project manager.

    +   26. To develop a continuous improvement culture that permits the accomplishments
    of all of the preceding objectives.


    # The Supply Management Process


    Changing economic and political environments, emerging technology versus labor,
    and the changing nature of construction as a discipline must influence the role
    of construction purchasing and supply chain management. To become more strategically
    competitive, construction firms must abandon fragmented purchasing and subcontracting
    approaches. The companies that invest in engineering-based construction methods
    ("hard" technology) must at the same time invest in result-oriented sourcing training
    programs ("soft technology"). The'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'purchasing function must become an integral part of transforming materials
    and resources into an on time, under budget, and acceptable finished project.


    In many construction firms, functional and project managers within each area make
    independent decisions using similar techniques. The approach introduced in this
    chapter proposes that the sourcing decision should be integrated. Integrative
    supply management consists of the planning, acquisition, and conversion of materials
    and subcontracted labor into a finished project. In this scenario, each field
    supervisor (foreman) reports to the same superior. Further, project managers should
    work for the overall purpose of delivering high-quality, efficient, on-time projects
    to the owner. An important objective of this approach is to provide high-quality
    customer service while minimizing the cost of producing the service or project.
    Integrative supply management is not related to the size of a firm. Realistically,
    the sourcing subfunctions must first be integrated before the supply function
    will be synergistic with other business functions.


    The purpose of supply management is to support the construction function in the
    transformation of materials and labor into a completed project. The function of
    the supply chain is to integrate the entire transformation process. During the
    transformation process, materials are combined with labor, information, technology,
    and capital. The construction planning and scheduling system is central to the
    acquisition of subcontracting and materials in an effective construction environment.
    For complex projects, the critical path method (CPM) schedule is the most important
    input into a construction planning and control system. Many successful construction
    organizations have embraced just-in-time philosophies and use CPM concepts to
    enhance the effectiveness of the construction supply mission.


    Perhaps the most significant change for construction firms in the past decade
    has been the acknowledgment of continuous improvement. Between 1960 and 1990,
    most construction firms performed 60 to 80 percent of the project through the
    combined efforts of a prime contractor and numerous subcontractors. Today, a large
    number of construction management and design engineering organizations serve as
    the owners’ representative and subcontract 90 to 95 percent of the projects’ values.
    Since this impressive shift in value percentages, the complexity of the construction
    process has been greatly reduced for the prime contractors. The complexity in
    the construction process has been shifted downstream to the supply chain (subcontractors
    and suppliers). Under the traditional construction model, the prime contractors
    transformed significantly more materials and labor for the project. Because prime
    construction firms are purchasing more and more subcontracting services, the construction
    focus is shifted downstream to operations efficiency. This significant shift has
    elevated the importance and profile of sourcing and supply sourcing professionals.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# # Supply Sourcing Dollar Responsibility


    The dollar responsibility of supply management is very large in both relative
    and absolute terms in the construction industry. More importantly, if the supply
    sourcing management is responsible, it will contribute to the competitive stance
    and long-run survival of the construction organization.


    The following are ratios of materials-related costs that are typically cited in
    the construction industry:


    Total project cost of sales (labor, equipment, and materials)

    = 75% of sales

    Home office overhead (sales) = 15% of sales

    Profit margin = 10% of sales


    The labor, equipment, and materials ratios are increasing for various reasons:
    competitive pressures, material shortages, inflation, and thoroughly complex high-value
    projects.


    # ## Competitive Pressures


    As the number of bidders increases for each project, the project prices decrease.
    Some competing construction organizations bid below the total project cost.


    # ## Material Shortages


    As natural resources are consumed, more costly methods of exploration, extraction,
    and processing are necessary. Shortages also result from political events. Former
    colonies of Western nations, once a low-cost and ready source of supply, have
    gained their independence. As autonomous nations, these new nations manage their
    resources to achieve economic, social, and nationalistic objectives.


    # ## Inflation


    Material prices usually adjust upward in response to the rising costs of energy
    and labor. Managing materials during inflationary periods result in decisions
    that would make little sense in stable environments.


    # ## Complex, High-Value Projects


    Management in the construction industry frequently hears the complaint, “They
    don’t build them like they used to.” The industry’s response is, “If we did, you
    wouldn’t want them.” Project owners demand ever more reliable and functional projects
    for lower prices. For these reasons, we should expect no reversal in the trends
    of increased dollar responsibility and the promise of effective construction supply
    chain management. Where else is the potential for cost reduction and competitive
    advantage so great?'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Potential for Profit


    All sourcing activities have the potential for increasing profit through cost
    reduction. The sourcing of materials is used to illustrate the “profit leverage”
    argument which emphasizes the importance of profit efficiency over market share.
    As an example, consider a construction firm’s income statement is like the one
    given in Table 2.1. At the sales level of $1,000,000, the firm is expending 50
    percent of sales or $500,000 for the purchase of bulk materials while incurring
    a net profit of $50,000.


    Suppose the firm sets a goal of increasing the net profit by $10,000 or 1 percent
    of current sales. One way to achieve this goal is to focus on market share and
    increase the firm’s level of sales without changing the material costs. The required
    level of sales can be estimated using the following equation.


    Sales = variable cost + fixed cost ± profit


    x = 0.5x + 0.4x + 50,000 + (10,000 + 50,000)


    x = $1,100,000


    In order to increase the net profit by $10,000 or 1 percent of current sales,
    the required increase in sales is $100,000 or 10 percent of current sales. Also,
    the variable costs increase as the result of increased production.


    Another way to achieve the same goal is to improve profit efficiency through the
    reduction of material costs by the supplier manager’s skillful negotiations while
    maintaining the current level of sales. In this case, the material cost is the
    only changing variable. As each $1 cost reduction is exactly reflected as an increase
    in profit, the required reduction in material cost is $10,000 or 2 percent of
    current material cost. The resulting income statement is like shown in Table 2.2.


    When comparing the two methods, it can be seen that the required reduction in
    material costs which is 2 percent or $10,000 is far smaller in amount compared
    to the required 10 percent increase in sales. In addition, a sales increase of
    10 percent could be considerable difficult


    | | (in 000s) |

    |---|---|

    | Sales | $1,000 |

    | Bulk material costs | (500) |

    | Labor costs | (400) |

    | Gross profit | $100 |

    | Project overhead | (50) |

    | Net profit | $50 |


    **Table 2.1** Income Statement Example 1'
