- pgno: 31
  md: 'costs, the demanding project owner will continue to demand more. As a result,
    the efficient construction supply chains will prosper, and the traditional, adversarial
    supply chains will not survive. For this reason, construction supply chain management
    remains a critical element for positioning operational efficiency as a source
    of competitive advantage, and serves as a desirable goal for leadership in the
    construction industry.


    # ## Supply Chain Partnerships


    Critical to the implementation of construction supply chain management techniques
    is the construction supply chain partnership. Also termed a *strategic alliance*,
    a strategic supply chain partnership is a relationship formed between two independent
    entities in supply channels to achieve specific objectives and benefits. These
    partnerships form the essential building blocks of CSCM. The high levels of information
    flow and subsequent coordination of error-free planning and scheduling required
    by CSCM require prime contractors to build tighter bonds with a few strategic
    subcontractors and suppliers. Once traditionally driven by competition, the supplier
    *relationships* for many construction firms have thus matured from an adversarial
    relationship to one of a construction supply chain partnership.


    Within the win-win construction partnership dyad, prime contractors and strategic
    (subcontractors and material) suppliers share goals as well as inherent risks
    through joint planning and control, seeking to create an effective supply chain
    with increased information flow and enhanced project owner loyalty. Like the overall
    goal of CSCM, such coordination allows for improved service, technological innovation,
    and project design with decreased cost. Ideally, the end result for all members
    of the construction supply chain should be a decreased uncertainty, yielding greater
    control of costs, activity times, materials, project quality, and, ultimately,
    project owner satisfaction.


    # ### Traditional Construction Supply Chain


    Firms must take bold steps to break down intrafirm barriers to both smooth uncertainty
    and enhance control of the supply chain activities. See Fig. 1.10. The evolution
    of intrafirm functional integration has occurred for most progressive construction
    firms over the last few decades, and the current push is toward external integration
    with subcontractors, material suppliers, and project owners. Supply chain partnerships
    bridge the barrier between prime contractors, subcontractors, materials suppliers,
    and project owners.


    Historically, contractors have formulated operations strategy around adversarial
    downstream relationships. This approach encourages competition which the prime
    contractors can exploit to shop for lower costs. Such a strategy enhances ultimate
    prime contractor bargaining power. This is clearly an unsustainable strategy.
    The most'
