- pgno: 233
  md: '**General liability insurance** A broad form of liability insurance covering
    claims for bodily injury and property damage.


    **Generic** A term used to generally describe a group, type, or class of materials
    and equipment, rather than name a specific trade name or source of manufacture.


    **Goods received note** A document detailing all equipment and materials after
    they have been audited and checked for quantity at the receiving point.


    **Gross ton** 2240 lb of weight.


    **Gross weight** The total weight of a shipment, including containers, packaging,
    and miscellaneous materials.


    **Guarantee** A promise, pledge, or formal assurance given as a pledge that another’s
    obligation or debt will be fulfilled.


    **Guaranteed maximum cost contract** A contract for construction in which the
    contractor’s or subcontractor’s compensation is stated as a combination of actual
    cost incurred, plus a fee, with a guarantee by the contractor or subcontractor
    that the total compensation will be limited to a specific stated amount.


    **Heavy-lift charge** A fee imposed by a transportation organization for lifting
    materials and equipment of excessive weight.


    **Hedging** A method of selling for future delivery whereby the parties protect
    themselves against potential loss.


    **Hold** The below-deck cargo storage space aboard ship; the cargo compartment
    of an aircraft.


    **Hold order** A purchaser’s order to hold a particular delivery at a designated
    location for a specific period of time.


    **Hold points** Inventory or warehouse areas set aside for storing semicomplete
    articles.


    **Hundredweight** The transport of 100 lb “cwt.”


    **Implied contract** A contract formed when parties express, through their conduct,
    their agreement to be bound to its conditions and terms. An agreement is inferred
    and understood without express statements.


    **Indemnification** An obligation contractually taken on or legally imposed on
    one party to protect another party against any loss or damage from specific liability.


    **Indemnity** A responsibility of one person to make good a loss or damage incurred
    by another. A payment for damage, loss, or expense incurred.


    **Indirect materials** A group of materials used in making a product that are
    not incorporated or part of the finished product.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '**Injunction** A formal order issued by a court of law ordering a person or
    a group to do or refrain from doing some activity.


    **Inland bill of lading** A bill of lading used in transporting materials and
    equipment overland to the exporter''s international transporter. A through-bill
    of lading can be used in some circumstances; however, it is usually necessary
    to prepare both an inland bill of lading and an ocean bill of lading for foreign
    export of materials and equipment.


    **Inland carrier** A transportation organization that moves export or import materials
    and equipment between seaports and inland locations.


    **Inquiry** A request for information related to the schedule, location, availability,
    interest, cost, or quantity of construction-related items.


    **Inspection** The examination, audit, measuring, and testing of materials and
    equipment including, when necessary, raw materials, fabrication elements, components,
    intermediate assemblies, subassemblies, and end products to determine if the materials,
    equipment, and services meet the contract specification requirements. This activity
    can be completed either by visual inspection or with the use of special equipment.


    **Inspection plan** A procedure that defines the material or equipment requiring
    inspection and describes the method and order of performing the tests or inspections.


    **Inspection report** A report to inform the purchaser of the quality and workmanship
    of the items of materials and equipment delivered.


    **Inspector** A qualified inspector employed by an organization to examine and
    review the fabrication, manufacture, and installation of construction-related
    equipment and materials.


    **Instructions to bidders** A document that is part of the bidding requirements,
    usually prepared by a design professional, architect, or engineer. Instructions
    to bidders describe specific instructions to the potential contractors on procedures,
    requirements of the owner, and other necessary information for the preparation
    and submission of bids for consideration and review by the owner.


    **Insurance** A contract, typically called an insurance policy, in which the insurer,
    in return for the payment of a premium, agrees to pay the insured for any losses
    or damages incurred by the insured during the execution of a specified undertaking
    (e.g., construction of a building or facility).


    **Insurance certificate** A document supplied by a contractor, subcontractor,
    or vendor stating the coverage of insurance related to a particular contract.


    **Inventory** Items of materials and equipment that are in the storeroom or warehouse,
    or work-in-progress consisting of raw materials, fabrication elements, components,
    parts of intermediate materials and equipment, and finished materials and equipment
    ready for distribution and sale.'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'Physical inventory is ascertained and established by actual count. It includes
    materials and equipment that are physically available for allocation and distribution,
    and stored and controlled in a warehouse or outside laydown area.


    **Invitation to bid** Written notice of an owner''s desire to receive competitive
    bids for a particular construction project where a select number of contractors
    are invited to submit bids for the construction of the project.


    **Invoice** Seller''s itemized bill of quantities and prices of materials, equipment,
    and/or services that have been delivered to the purchaser.


    **ITC** Investment tax credit


    **JIT** (just-in-time) A system for planning and scheduling fabrication through
    the manufacturing sequence, optimizing the purchase and storage of materials and
    equipment, and eliminating any inventory or stock on hand.


    **Job lot** A small number of specific materials or items of equipment that are
    produced at one specific time.


    **Job-lot ordering** The buying of necessary materials, equipment, and components
    to fabricate in accordance with a customer''s specifications.


    **Joint agent** An official designated to act for two or more principals.


    **Joint venture** An organization in which two or more parties join together to
    form a business operation with the legal characteristics of a partnership to achieve
    a specific goal.


    **Journeyman** A qualified workman who has completed an apprenticeship.


    **Judgment** A decision rendered as a result of a course of action in a court
    of law.


    **KD** Knocked down or disassembled to reduce bulk.


    **Key activity** An activity that is considered of major importance, sometimes
    referred to as a milestone event.


    **Kitting** The process of sending components of a total assembly to another location
    in a kit form for assembly.


    **Labor and material payment bond** A contract between a contractor and a surety,
    in which the surety, for a premium payment by the contractor, agrees to reimburse
    subcontractors, vendors, and material suppliers any amounts due for their materials
    and services, should the contractor default in payment to them.


    **Lading** The act of loading, or the contents of a specific shipment.


    **Laydown area** A space of ground, usually without a roof, that is used for the
    delivery and storage of materials and equipment.'
  merge: -1
  img_proc: true
- pgno: 236
  md: '**L&D** Loss and damage.


    **Lead time** The period of time required to perform a specific activity of work.


    **Lease** A contract whereby an individual or organization lets another use property
    or equipment for a definite term and for an agreed rental cost. The lessor retains
    title to such property or equipment.


    **Legal tender** Money issued by the government to satisfy a debt or obligation.


    **Letter of credit** A letter addressed by a bank to a correspondent bank certifying
    that an individual or organization named therein is entitled to draw upon an account.


    **Liability** A state of being under obligation; exposure to potential claim by
    which an individual or organization may be subject to pay for compensation for
    loss, damage, or other acts to another individual or organization.


    **Lien** A legal claim on the assets or property of another.


    **LIFO** (last-in, first-out) An accounting practice of determining the cost of
    stock inventory used in a manufactured product or process (opposite of FIFO).


    **Liquidated damages** A sum of money agreed to by the contracting parties as
    to damages to be given in case of a failure to meet the obligations of the contract.


    **Litigation** To engage in a lawsuit; the process by which parties submit their
    disputes to the jurisdiction of federal or state law courts for resolution.


    **Load factor** A ratio that applies to the utilization of a physical plant or
    piece of equipment; the ratio or percentage of average load utilized to maximum
    load available for use.


    **Logistics** The science of transportation and supply; the art of obtaining and
    distributing finished products in the marketplace.


    **Long ton** 2240 lb, same as gross ton.


    **Lot size** The amount of specific materials and equipment items ordered from
    a vendor.


    **LTL** Less than truckload.


    **Lump sum** An amount or value used in a proposal, bid, or contract representing
    the total cost that an organization is prepared to contract to perform an item
    of work.


    **Manifest** A list of the cargo loaded in ships, trucks, containers, and the
    like; an oceangoing transportation, referred to as a ship’s manifest.'
  merge: -1
  img_proc: true
- pgno: 237
  md: '**Marketable title** A title about which no uncertainty exists concerning its
    legal soundness or validity.


    **Marketing research** The systematic gathering, recording, and analyzing of data
    and intelligence about tasks and activities related to the marketing of materials
    and services.


    **Markup** A percentage that can be added to the total of all direct costs to
    determine a final price or contract sum. Allows the contractor or subcontractor
    to recover the costs associated with overhead.


    **Material** The raw elements, parts, or semiprocessed components from which a
    finished product is created.


    **Material cost** The cost of all items that are essential to the construction
    process or operation of a facility, including the direct and indirect related
    costs.


    **Material man** A term used to describe an individual from whom the contractor
    may obtain the materials of construction. The material man may be a manufacturer''s
    sales representative or agent or distributor; a salesman of materials and equipment
    could also be considered a material man.


    **Materials management** A concept whereby all materials and equipment procurement
    functions are combined under one management function, including contracting, purchasing,
    quality assurance, quality control, inspection and expediting, trafficking, and
    receiving.


    **Material status** A report detailing the current availability of materials.


    **Materials test report** A report usually referred to as a Certified Materials
    Test Report or Mill Test Report. The actual test results are usually described,
    detailing chemical analyses, material composition tests, and procedures used in
    testing.


    **MC** Minimum charge.


    **Mechanic''s lien** A type of lien filed by an individual or organization who
    has performed work for which payment is either in dispute or remains unpaid.


    **Minimum carload weight** A minimum weight for which a carload of materials and
    equipment can be charged.


    **Mixed truckload rate** A rate applied to a truckload shipment made up of two
    or more different materials.


    **Modifications** A term used to signify changes that may be made to contract
    documents and a construction contract. Modifications made before the award of
    a contract are called addenda; modifications made after the contract is in place
    are called change orders.


    **Multiple-consignee** A container car, truck, or ship loaded with materials and
    equipment for two or more consignees.'
  merge: -1
  img_proc: true
- pgno: 238
  md: '**Multiple source buying** A container car, truck, or ship loaded with materials
    and equipment for two or more consignees.


    **Need date** The date when a particular article is required at the construction
    site.


    **Negligence** Under the law, failure to exercise the care and consideration a
    prudent person would exercise; lack of care and attention.


    **Negotiation** The process by which a buyer and seller reach an agreement on
    the terms and conditions regarding the purchase of materials, equipment, goods,
    or services.


    **Net price** The price reached after all allowable discounts, rebates, and the
    like are deducted from the original selling price.


    **Net ton** 2000 lb


    **Net weight** The weight of the materials and equipment without the shipping
    container and dunnage.


    **Notary** A public officer empowered to administer oaths, take depositions, and
    certify deeds and contracts.


    **OBL** Ocean bill of lading.


    **Obligation** A duty that is the result of a promise or contract; an agreement
    which an individual or organization is responsible to fulfill.


    **Obsolete** Outmoded, worn out, discarded, or no longer in use.


    **Offer** A proposal or bid made by an individual or organization to another individual
    to perform a service or action; the acceptance of such an offer results in contract.
    The individual or organization who makes the offer is called an offeror, and the
    individual or organization who receives the offer is called an offeree. A bid
    or proposal is an example of an offer.


    **Open competitive bidding selection** A process of contractor selection wherein
    an advertisement to bidders is published in newspapers and trade magazines notifying
    contractors of the owner’s intention to receive and consider sealed competitive
    bids for a construction contract. Typically the lowest conforming and responsible
    bid will be successful.


    **Open-end order** Purchases made against the buyer’s purchase order or contract.
    The purchase order or contract contains price, conditions, and terms. The purchase
    order or contract may not specify the final quantity to be purchased.


    **Order lead time** Period of time required to obtain an item from a vendor or
    supplier once the purchase order requirements are known.


    **OS&D** (over, short, and damage report) A report or log showing discrepancies
    in materials received, together with a damage evaluation.'
  merge: -1
  img_proc: true
- pgno: 239
  md: '**Overhead** A cost inherent in the operating of a business. A cost that cannot
    be charged to a specific part of the work, materials, or equipment.


    **Owner** The individual, group, or organization that has title to a building
    or facility.


    **Packing list** A document or log prepared by the shipper to indicate in detail
    the particular package contents.


    **Partial payment** A stage payment made upon delivery of one or more completed
    units.


    **Patent** A government grant to an inventor by which he or she is the only person
    allowed to make or sell the new invention for a certain number of years.


    **Payment bond** A form of security purchased by a contractor from a surety; guarantees
    that the contractor will pay all costs of labor, materials, and other services
    associated with a construction.


    **Penalty clause** A clause in a contract that stipulates the sum of money to
    be forfeited in the case of nonperformance of the terms and conditions of the
    contract.


    **Performance bond** A form of security purchased by a contractor from a surety;
    guarantees that the contractor will satisfactorily perform all of the work associated
    with a construction project.


    **Physical distribution** The activities associated with the transportation and
    movement of materials and equipment from the manufacturer to the end user.


    **Piggyback** The carrying of anything that usually moves alone by a large vehicle.
    The transportation of highway trailers or containers on specially equipped railroad
    flat cars.


    **Pledge** To bind by a promise.


    **Point of origin** The actual location of origin of a shipment.


    **Port of entry** A port designated by a government as the entry point for materials,
    equipment, and services from an overseas country.


    **Prime contractor** The prime contractor works directly for the project owner
    to build and coordinate the project. In some sectors, for example, heavy highway,
    the prime self performs a significant portion of construction items. In other
    sectors, the prime''s role is consistent with that of a general contractor.


    **Prefabrication** A manufacturing or fabrication technique, generally taking
    place at a location other than the construction site, in which various materials
    and equipment are combined to form a larger component element for final installation
    at the construction location.


    **Procurement** The activity related to the acquisition of articles, land, property,
    or services by the means of purchasing.'
  merge: -1
  img_proc: true
- pgno: 240
  md: '**Procurement lead time**  The time required by a buyer to select and negotiate
    with a vendor or supplier and place a purchase order.


    **Promissory note**  A written pledge or promise by one individual or organization
    to pay another unconditionally a certain sum of money (principal and interest)
    at a specified time.


    **Purchase**  Obtaining an article for money; something acquired for a specific
    amount of money or its equivalent.


    **Purchase order**  A written contract made between a buyer and a seller that
    describes the articles being purchased, the price of the articles and the method
    of delivery.


    **Purchase requisition**  A written request issued to a purchasing department
    from an individual or group that requires a specific article.


    **Purchasing**  The act of buying materials, equipment, and services that conform
    to the correct quality, in the correct quantity, at the market price, and are
    delivered in accordance with the promised delivery date.


    **Purchasing cycle**  The activities in the acquisition of materials, equipment,
    and services.


    **Purchasing manual**  An operating guide that explains the policies and procedures
    for purchasing personnel to follow in the performance of their work activities.


    **Quality**  The essential attributes that permit materials and equipment to function
    in the desired manner.


    **Quality assurance**  A formal procedure that ensures that the materials and
    equipment will perform satisfactorily when installed.


    **Quality control**  The procedure and activities that ensure adequate quality
    is maintained in the materials and equipment utilized in the construction process.


    **Quantification**  A list of actual quantities of materials and equipment from
    a set of drawings and specifications.


    **Quantity**  The amount of equipment or material units required.


    **Quantity discount**  The reduction in unit price cost established by a predetermined
    minimum number.


    **Quasi-contract**  An obligation under which an individual or organization that
    received a benefit must pay the individual or organization who gave the benefit,
    despite the absence of a contract.


    **Quotation**  A summary of price, terms of sale, and general description of materials,
    equipment, or services offered for sale by a contractor or vendor to a potential
    buyer. When issued in response to a purchase inquiry, it is considered an offer
    to sell.'
  merge: -1
  img_proc: true
- pgno: 241
  md: '**Quotation expiration date** The date after which a quotation is no longer
    valid.


    **Quotation request** A purchaser''s invitation to potential vendors or suppliers
    to bid on a list of articles.


    **Rate of exchange** The rate at which the currency of one country is exchanged
    for the currency of another country.


    **Reactive expediting** A form of expediting conducted primarily by telephone
    contact; reacts to situations and problems as they occur.


    **Rebate** The amount refunded to a purchaser for the purchase of an agreed quantity
    or value within a stipulated period of time.


    **Receipt inspection** An audit and examination of materials and equipment prior
    to acceptance; to review the completeness of the delivery and to note any obvious
    damage.


    **Receipt of bids** The action of an owner in receiving sealed bids that have
    been invited or advertised in accordance with the owner''s intention to award
    a construction contract.


    **Receiving** The receipt and delivery of articles at a designated location.


    **Receiving and storage** The action of processing materials and equipment from
    vendors and suppliers, including maintaining and controlling all elements in storage,
    and the eventual distribution of the materials and equipment.


    **Receiving report** A form or log used by an organization''s receiving department
    for recording the materials and equipment received and the differences, if any,
    from the quantities indicated on the purchase order.


    **Recourse** The procedure a buyer or seller may use to have a seller or buyer
    satisfactorily comply with the terms of the contract.


    **Repair** To mend or put in good condition. The process of restoring a nonconforming
    material or equipment item so that it can perform its intended function.


    **Request for bid** A request by a purchaser for the submission of an offer or
    proposal from the supplier to be considered, accepted, or rejected by the purchaser.


    **Requirements** The total scope of work to be performed together with specifications,
    drawings, and cost of the work.


    **Requisition** An internal form that an individual or department sends to the
    purchasing department requesting materials, equipment, or other services.


    **Retention** The percentage or value withheld from a contractor that is paid
    when the contract has been satisfactorily completed.'
  merge: -1
  img_proc: true
- pgno: 242
  md: '**Review** The examination of any form of data, documentation, or drawings,
    for the purpose of establishing acceptability and conformance to the requirements
    of the contract.


    **Rework** The procedure by which a nonconforming element is made to conform to
    the established need by repairs or modifications.


    **RFQ** (Request For Quotation) The process of soliciting bids or proposals for
    a stated scope of work.


    **Routing** The determination of each road to be used in the transportation of
    materials and equipment to a construction job site.


    **Sales price** The value received for items sold. Gross sales price is the total
    value paid. Net sales is the gross value less discounts, rebates, and freight
    costs.


    **Sales representative** An individual acting for a supplier or vendor who is
    familiar with the products that the buyer may be considering for purchase.


    **Sales revenue** Funds received as the result of a sales transaction.


    **Sales tax** A tax levied on the sale of materials, equipment, or services; calculated
    as a percentage of the purchase price. Different states use different percentages.


    **Salvage** The material or equipment that is saved after damage or demolition
    has been completed.


    **Salvage value** The value recovered or realized when an article or facility
    is demolished, scrapped, or sold.


    **Samples** Examples of completed materials, products, equipment, or workmanship
    that establish standards by which the installed work will be evaluated.


    **Scope** Defines the work to be performed and completed; usually documented and
    described in the contract.


    **Scope change** A deviation from the original project scope of work agreed to
    in the contract. A scope change can be an activity either added to or deleted
    from the original scope of work.


    **Seller’s lien** The seller’s right to withhold or to lay claim on materials
    or equipment sold, giving up these rights upon receipt of payment.


    **Shop drawings** The various drawings created by contractors, subcontractors,
    vendors, or manufacturers that illustrate construction, materials, dimensions,
    and installation data for the incorporation of a specific element into the construction
    project.


    **Shop fabrication** The manufacturing assembly of components or elements in a
    vendor’s or manufacturer’s shop.'
  merge: -1
  img_proc: true
