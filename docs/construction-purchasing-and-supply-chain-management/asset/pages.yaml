- pgno: 226
  md: '**Artisan''s lien** The lien of a mechanic or other skilled worker in connection
    with something on which he or she has applied labor or materials, giving him or
    her the right to keep possession of it until final payment is made.


    **As-built drawings** Record drawings made during construction. As-built drawings
    record the locations, sizes, and nature of concealed items such as structural
    elements, accessories, fixtures, devices, values, and mechanical equipment. These
    record drawings form a permanent record of the as-built condition of the building
    or facility.


    **As is** Indicates that the materials and equipment offered for sale are without
    warranty or guarantee. The purchaser has no recourse on the vendor or supplier
    for the quality of the materials and equipment.


    **Assignment** The transfer of rights or title to another party, frequently involving
    rights originating from a contract.


    **Back order** The part of an order that cannot be delivered at the scheduled
    date, but will be delivered at a later date.


    **Banker''s acceptance draft** A document or draft used in financing a foreign
    transaction, making possible the payment of cash to an exporter, covering all
    or part payment for a shipment made by the exporter.


    **Bargain** Agreement on the terms and conditions of a purchase. Purchase of articles
    at a price favorable to the buyer.


    **Barter** The process of exchanging one kind of article for another, as opposed
    to trading by use of money.


    **Bid** A complete and properly executed proposal to perform work or supply goods
    or services that have been described verbally or in the bidding documents and
    submitted in accordance with instructions to bidders. A bid is an offer.


    **Bid bond** A form of bid security purchased by a bidder; provided, subject to
    forfeit, to guarantee that the bidder will enter into a contract with the owner
    for construction of the facility within a specified time period.


    **Bidding documents** Documents that typically include the advertisement or invitation
    to bidders, instructions to bidders, bid form, form of contract, forms of bonds,
    conditions of contract, specifications, drawings, and any other information necessary
    to completely describe the work for which bidders can prepare bids for the owner''s
    consideration.


    **Bid opening** A formal meeting held at a specified place and time at which sealed
    bids are opened, tabulated, read aloud, and made available for public inspection.


    **Bill** An invoice the freight carrier uses to show consignee, consignor, shipment
    description, weight, freight charges, and other relevant information.'
  merge: -1
  img_proc: true
- pgno: 227
  md: '**Bill of exchange** A formal written document used to settle and pay for an
    existing obligation.


    **Bill of lading** A transport company''s contract and receipt for materials and
    equipment; agrees to transport from one location to another and to deliver to
    a designated individual or party.


    **Bill of materials** A list of all permanent materials required on the construction
    project. The bill of materials lists consists of all items described on a drawing
    and specification.


    **Binder** A temporary but binding commitment by an insurance company to provide
    insurance coverage.


    **Blanket order** Provides for the vendor or supplier to furnish certain materials
    for a certain period of time and at a predetermined price; acts as a master purchase
    order, reducing the number of smaller purchase orders.


    **Boiler plate** A term used to describe the terms and conditions on the back
    of a purchase order or the specific clauses described in a contract.


    **Bonded warehouse** A warehouse under the surveillance of the U.S. Treasury Department
    for observance of revenue and excise laws.


    **Bond performance** A bond obtained in connection with a contract; ensures the
    performance and completion of all the scope, terms, conditions, and agreements
    contained within the contract.


    **Bonds** Formal documents, given by an insurance company, in the name of a principal
    to an obligee to guarantee a specific obligation. In the construction industry
    the main types of bonds are the bid bond, performance bond, and payment bond.


    **Breach of contract** The failure to perform any of the obligations that are
    stated within the terms and conditions of the contract.


    **Bulk materials** Materials bought in lots; purchased from a generic description
    or standard catalog description and bought in medium to large quantity for issue
    as required. Examples are pipe fittings, conduit, cable, timber, and stone.


    **Bulletin** A document used to request pricing for a modification to the design
    after a contract is issued. If pricing is acceptable, a change order to the contract
    incorporates the requirements of the bulletin into a project.


    **Burden** In construction, the cost of operating a home branch or site office
    with staff other than operating site personnel. Also means federal, state, and
    local taxes, fringe benefits, and other union contract obligations. In manufacturing
    operations, burden typically means operating overhead costs.


    **Cancellation of order** Annulment or cessation of order.'
  merge: -1
  img_proc: true
