  md: '![](img/5a99b8094bd51e396d3bb39b49a21371_19_0.png)


    manufacturing sector, workers have technical skills, are closely supervised, in
    most instances exercise no or low personal judgment, and have little or no contact
    with the actual customer. A single plant or multiple facilities permanently house
    the equipment and production processes. The manufacturing sector is characterized
    by long response times for making a product. While labor, supply, and transportation
    are nearby for manufacturing entities, the market for the sale of a product can
    be both national and international.


    Improvement curve techniques are well suited for manufacturing because of its
    repetitive production of individual durable units by a single business. The improvement
    curve is exponential and depicts a constant-percentage reduction of labor as a
    function of cumulative units produced. Put another way, as workers learn how to
    do their jobs better, they produce more and more units at a lower cost. The efficiencies
    that are achieved over time are a factor in a firm’s competitive advantage and
    are the impact of cumulative learning in manufacturing. See Fig. 1.4.


