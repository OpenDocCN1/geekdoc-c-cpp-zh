  md: '+   4. Requisition generation

    +   5. Solicitation of bids or quotes

    +   6. Evaluation of bid proposals and award

    +   7. Generation of purchase order, lease, or subcontract agreement

    +   8. Submission of sample materials by supplier and the prepara-tion and submission
    of shop drawings by subcontractor.

    +   9. Review and acceptance of shop drawings by general contrac-tor, architect,
    or engineer

    +   10. Fabrication by subcontractor or supplier

    +   11. Tracking and expediting

    +   12. Shipping and traffic

    +   13. Delivery and inspection

    +   14. Staging to site location

    +   15. Installation operations

    +   16. Testing based on specifications

    +   17. Acceptance of rejections

    +   18. Warranties and corrections


    This generic sourcing cycle above has been highly oversimplified for presentation
    purposes. For residential contractors, most of the sourcing steps are condensed;
    however, consider the magnitude of the construction sourcing process when resource
    inputs are trans-formed to build a complex span bridge, a skyscraper or football
    sta-dium. Since much of the steel for these projects is sourced from Japan, the
    costs can be impressive and the shipping times can be lengthy. Shop drawings for
    a span bridge could take up to 2 years to complete. As can be seen, the construction
    sourcing process can easily become diverse as the complexity of the project increases.
    At each stage in the sourcing cycle, there are excellent opportunities for cutting
    project costs and improving quality.


    # Construction Sourcing Documents


    The typical construction sourcing documents are the prime contract, purchase order,
    subcontract agreement, and lease agreements.


    # Prime Contract


    The prime contract is the exclusive controlling contract awarded by a project
    owner to a general contactor to perform the requested work according to specifications.'
