    CSCM methodologies mandate a fundamental departure from traditional practices
    and require contractual arrangements that foster the successful project outcomes
    instead of individual firm successes. The issue becomes how to draft agreements
    that promote trust, sharing, and openness across all levels of the supply chain,
    including the project owner, architect, prime contractor, and all strategic subcontractors
    and suppliers who impact delays, quality, and cost. Both AIA⁹ and Consensus DOCS
    have developed contract documents that encourage collaboration among supply chain
    entities. In October, 2008, the national AIA and AIA California announced the
    Integrated Project Delivery system to design and build projects. Consensus DOCS
    has also introduced a collaborative tri-party agreement that is an outgrowth of
    principles of lean construction. Both document series integrate key stakeholders
    in a design and construction environment that values information sharing, openness,
    risk allocation, and transparency. These industry documents are valuable resources
    as project owners make the wise decision to implement construction supply chain
    management. But the legal arrangements can never drive change; they can only be
    a by-product of change that comes from within the industry. See sample sections
    from CD 300, Standard Form of Tri-Party Agreement for Collaborative Project Delivery
    in App. C, and AIA Document A 295—2008 Instructions, General Conditions of the
    Contract for Integrated Project Delivery in App. D.


    # The Project Management Stage


    The management of the project is the last line of defense. If the bid preparation
    and contractual agreements are adequate, the right prime contractor is selected
    and the ultimate project budget is reasonable, then a good management effort will
    deliver a successful project to the owner. A poor management effort will undo
    the pre-execution achievements. On the other hand, if the project is in trouble
    when the'
