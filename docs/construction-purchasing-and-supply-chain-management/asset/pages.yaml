  md: '# # Glossary


    **Containerization** The use of road and marine transportation containers are
    normally 20 or 40 feet in length. Shipment of large sealed freight containers
    via rail, air, truck, or water to optimized transit time, security, packaging,
    and turnaround time.


    **Contract** A written or oral agreement between two or more competent parties
    to perform a specific act or acts enforceable by law.


    **Contract administration** Administering contracts and purchase orders to protect
    the interest of a specific organization and to satisfy the conditions and requirements
    of the contract and/or purchase order.


    **Contract documents** A term applied to a collection of related documents (contract,
    specifications, drawings, and any additional data) that define the extent of an
    agreement between two or more parties.


    **Cost plus** A contract or pricing method in which the purchaser agrees to pay
    the supplier an amount determined by the actual cost incurred by the supplier
    to provide the materials, equipment, or services purchased, plus a fixed percentage
    of that cost or a fixed sum as profit.


    **Counteroffer** To decline an offer by submitting a new offer with different
    conditions or terms than the original offer.


    **Damage claim** A formal claim document filed for damages to materials and equipment.


    **Damages** Compensation or payment for damage to materials and equipment, individuals,
    or property that is the fault or cause of another party.


    **Davis-Bacon Act** An act passed into law by the U.S. Congress in the 1930s.
    The act provides that wages and fringe benefits paid to workers employed by contractors
    and subcontractors under contract with the federal government be paid not less
    than the local prevailing wage rate for each trade.


    **Debit notice** An invoice used to offset a previous overpayment, showing the
    difference between the previous invoice and the correct value.


    **Deliverable** A product or report that must be delivered to satisfy a contractual
    obligation.


    **Delivering carrier** The carrier that transports and delivers the materials
    and equipment to the purchaser.


    **Delivery** The act of transferring possession; applied to shipping, occurs when
    lading is surrendered and title, materials, and equipment pass to the receiving
    party.


    **Demurrage** A charge made on freight cars, vehicles, or ships held by or for
    consignor or consignee for subsequent loading or unloading.


    **Detail specification** A description of the requirements for a specific item
    or material or equipment.'
  merge: -1
  img_proc: true
- pgno: 230
  md: '**Discount** An allowance or deduction given by the seller to the buyer that
    reduces the cost of the item purchased when certain conditions are met by the
    buyer (e.g., prompt payment within a stipulated period).


    **Distribution** The broad range of activities targeted at the efficient movement
    of finished materials and equipment from the end of the production line to the
    eventual end user or consumer.


    **Dock** The loading or unloading ramp or platform at an industrial facility or
    factory.


    **Draft** A legal document instructing one individual to pay another.


    **Due date** The date when purchased materials and equipment will be available
    for installation at the project location.


    **Dunnage** Protective matter used around materials or equipment to prevent movement,
    damage, or breakage while in transit.


    **Durable goods** Consumer products that are used repeatedly over a period of
    years (e.g., household appliances, vehicles).


    **Duty** The charge assessed by a government on materials and equipment imported
    or exported. An obligation established by law or contract is not formalized.


    **Earnest money** Money that one party gives to another at the time of entering
    into a contract to “seal the deal.” Earnest money can be forfeited if a contract
    is not formalized.


    **Error and omission excepted** Printed on invoices or other statement(s) to safeguard
    the originator’s right to amend or modify the value if found to be incorrect.


    **Escalation** The value of adjustment permitted by an escalation clause (see
    below). An allowance for an anticipated increase in the cost of equipment, materials,
    and labor as a result of continuing price inflation experienced over time.


    **Escalation clause** A contract clause that provides for a price adjustment based
    on specific changes.


    **Ex** (Ex mill, Ex factory, Ex warehouse, Ex dock) Prefix used to denote point
    of origin. When a seller quotes a price Ex, the seller proposes only to make the
    materials and equipment available at the Ex point of origin and includes no transportation
    costs in the quoted prices.


    **Excess freight** Freight in excess of that indicated on the original freight
    carrier billing.


    **Exchange bill of lading** A bill of lading compiled and exchanged for another
    bill of lading.


    **Excise tax** A tax on the manufacture, sale, or use of certain articles made,
    sold, or used within a country.'
  merge: -1
  img_proc: true
- pgno: 231
  md: '+   - **Export** Shipment of materials or equipment to a foreign country.

    +   - **Export permit** A permit given by the government of an exporting country
    allowing a party within that country to export the materials and equipment to
    another country.

    +   - **Fabrication** Manufacturing operations for materials or equipment as opposed
    to the final installation operation.

    +   - **Facilitation** A system to decrease the time of international cargo transportation
    through the use of the latest customs methods, duty and tariff collection, and
    other related functions of international traffic activities.

    +   - **Factor** An agent selling goods or materials on a commission basis for
    his or her principal.

    +   - **Fair market value** The value of an article as determined by negotiation
    between buyer and seller; considered acceptable as a basis of a purchase and sale
    of the particular article.

    +   - **FAS** (Free Along Side) When a seller quotes a price FAS, the price includes
    the cost of transportation and delivery alongside the oceangoing vessel and within
    reach of the vessel’s loading equipment. The price does not include costs for
    any export permits or the payment of any export duties or tariffs.

    +   - **Field inspection** A thorough examination of the equipment and materials
    shortly after delivery to determine if they meet the requirements of the specifications
    and to find any hidden defects or damage.

    +   - **Field purchase order** A purchase order used in field construction situations
    where authority to make the type of purchase involved is usually restricted or
    has a predetermined not-to-exceed value.

    +   - **Field required date** The date required for an item of material or equipment
    to be delivered to a construction site for the maintenance of the project schedule.

    +   - **FIFO** An accounting procedure based on a “first-in, first-out” treatment
    of stock or inventory; the articles that are received earliest are used first.
    The opposite of this procedure is LIFO (last-in, first-out).

    +   - **Firm offer** A definite proposal or offer to buy or sell some article
    on stated terms and conditions. Such an offer binds the proposal to a stipulated
    time period.

    +   - **FOB** (Free On Board) Indicates that the seller pays the transportation
    costs up to the delivery location indicated. For example, a contractor’s purchase
    order frequently specifies delivery as “F.O.B. construction site” or “F.O.B. storage
    yard.” If the purchase order stipulates that the seller is to pay the delivery
    costs to a designated location, the title to the article does not pass until the
    article has been delivered to that location. Under'
  merge: -1
  img_proc: true
