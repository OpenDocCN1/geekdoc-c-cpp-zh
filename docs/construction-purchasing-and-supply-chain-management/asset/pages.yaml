  md: 'execution starts, a good project management effort can bail it out and, conversely,
    a poor effort will put the nail in the coffin. In order to be successful, the
    project must conform to the plans and specifications and, be on time and within
    budget.


    The duties and responsibilities of the project manager are diversified. The precise
    duties depend on the construction supply chain organization. The skill and experience
    of the strategic supply chain partners are the ultimate determinants of delivering
    a successful project. Two important factors that contribute to success are:


    +   - Adequacy of site operations and management

    +   - Relationship between the strategic supply chain partners


    Costs are often divided into two categories, direct and indirect costs, defined
    as:


    +   - *Direct costs* include materials, labor, and subcontract expenditures associated
    with the actual implementation [subdivided into various accounting codes to reflect
    the actual work, the work breakdown structure (WBS)].

    +   - *Indirect costs* are all other expenditures, sometimes referred to as hidden
    costs.


    The tasks involved in a typical complex project are as follows:


    +   - Establish a reasonable budget.

    +   - Know where expenditures are being made.

    +   - Forecast final expenditures.

    +   - Identify problem areas by comparing expenditures and budgets.

    +   - Apprise contractors and strategic supply chain partners of the information
    early so that actions can be taken to achieve economies.

    +   - Determine total cost of a laborer.

    +   - The productivity must be maximized.

    +   - The field manager must properly balance the indirect costs to achieve the
    maximum level of efficiency.

    +   - Contractors/managers must be assigned indirect cost center responsibility
    early.

    +   - Joint reviews of indirect cost must take place on a scheduled basis.

    +   - Use tracking curves or lists to monitor budgeted versus actual costs.

    +   - Work hours must be controlled.'
