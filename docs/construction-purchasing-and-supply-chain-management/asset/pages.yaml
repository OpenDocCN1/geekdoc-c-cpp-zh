    work a prime contractor can perform and the dollar value. To be prequalified to
    perform work over $1,000,000, the subcontractor must submit an audited balance
    sheet. Special contracts and subcontract components are the general types of work
    and classifications given for subcontractor prequalification. The INDOT prequalification
    application form can be found at http://www.in.gov/dot/div/contracts/standards/drawings/index.html.


    +   2. The subcontractor receives a request for quotation for a specified item
    of work from the prime contractor. In the INDOT market, the subcontractor can
