    the project owner, the construction manager, the design engineer, the subcontractor,
    the suppliers (materials and equipment), and the funding sources.


    # The Project Owner (Tier 1 in the Construction Supply Chain)


    Responsibilities of the project owner:


    +   1. Determines what is to be constructed and the location. The project owners
    in this market sector must either be knowledgeable and have civil and design engineers
    on staff or hire professional expertise, such as a construction manager at risk.
    The extent of the project owner’s in-house capabilities must be considered when
    selecting a construction manager or general contractor. See an example of a construction
    management contract in App. E.

    +   2. Establishes the date the project must be completed.

    +   3. Quality and the reliability of project construction milestones.

    +   4. Determines the preliminary scope of work.

    +   5. Establishes a preliminary budget for the project.

    +   6. Establishes the strategy for selecting the architect or construction manager.
    The architect or construction manager must be experienced, have a capable organization
    as well as individual resumes, have specialized experience on similar projects,'
