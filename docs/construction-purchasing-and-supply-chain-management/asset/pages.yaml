- pgno: 4
  md: '# About the Authors


    W.C. Benton, Jr. is the Edwin D. Dodd Professor of Management and Distinguished
    Research Professor of Operations and Supply Chain Management at the Max M. Fisher
    College of Business at the Ohio State University where he teaches courses in purchasing/supply
    management manufacturing planning and control, operations analysis, and facility
    design to undergraduates, MBAs, and doctoral students. Dr. Benton earned his B.S.
    in Business Administration at Texas Christian University, Ft. Worth, Texas, and
    received his doctorate in both operations and systems management and quantitative
    business analysis from Indiana University, Bloomington, Indiana. His research
    and writing accomplishments include more than 120 articles. He is the author of
    two books.


    Dr. Benton''s expert contribution to the business and governmental arena includes
    consultancy for Grant Hospital, Ashland, IBM, RCA, Frigidaire, the Ohio Department
    of Transportation, the Florida Department of Transportation, the Indiana Department
    of Transportation, the South Carolina Department of Transportation, the Alabama
    Department of Transportation, the Kentucky Department of Transportation Cabinet,
    the Federal Highway Administration, Battelle Institute, the United States Air
    Force, Gelzer Automated Assembly Systems, Bitronics, Inc., the Ohio Rehabilitation
    Services Commission, Bio-Ohio, the Carter Group Canada, and others.


    He currently serves as a panel member for the engineering and manufacturing divisions
    at the *National Science Foundation*. He also serves on the board of directors
    for the Healthcare Accreditation Colloquium, inc., the Sleep Medicine Foundation,
    the House of Hope, the Supply Chain Research Group, and others.


    Linda F. McHenry is chief operating officer for Benton and Associates, a construction
    management and engineering training firm. Ms. McHenry received her BA in political
    philosophy from Wellesley College, Wellesley, Massachusetts. She earned her law
    degree at Indiana University, Bloomington, Indiana. She also studied accounting
    and business administration at the Ohio State University. Ms. McHenry is admitted
    to the practice of law in four jurisdictions—Ohio, Indiana, California, and Michigan
    (inactive). Ms. McHenry was formerly an attorney for the Dow Chemical Company,
    Midland, Michigan, where she was responsible for advising 10 product groups. Later
    she was assistant general counsel at ITT-O. M. Scott-Burpee, Marysville, Ohio.
    At ITT-Scott, Ms. McHenry also served as manager of corporate planning with overall
    responsibility for the annual business plan cycle and presentation to the president
    of ITT. Ms. McHenry is the project manager for training programs presented by
    Benton and Associates. She is responsible for program and creative design and
    also offers courses on entrepreneurship, how to purchase legal and other professional
    services and construction law. Ms. McHenry has authored more than 18 construction
    educational manuals developed specifically for state departments of transportation
    and the Federal Highway Administration in Indiana, Kentucky, South Carolina, North
    Carolina, Alabama, Mississippi, Tennessee, Georgia, Florida, and Ohio.'
