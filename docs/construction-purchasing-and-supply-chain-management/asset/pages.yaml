  md: 'Different tax rates are applied to different levels of income. As income rises,
    it is taxed at a higher rate. The marginal tax rate determines how much a tax
    deduction will actually reduce taxes owed. Individuals or corporations with high
    incomes may have marginal tax rates of 35 percent or more, while those losing
    money will have tax rates of 0 percent. The higher the marginal tax rate, the
    more a tax deduction is worth. The value of a tax deduction is determined by multiplying
    it by the tax rate. Using this rule, a $10,000 tax deduction is worth nothing
    if the tax rate is 0 percent, $1,500 at 15 percent, and $2,800 at 28 percent.


    The situation is relatively simple with leases. Each lease payment is a tax deduction
    for the company leasing the equipment. Its value can be determined by multiplying
    the marginal tax rate by the lease payment. If the buy option is chosen, depreciation
    on a Motor Grader must be taken over a 5-year period. Both straight-line and accelerated
    methods are possible, and either can have its advantages depending on Hoosier
    Pride’s tax situation. In this example, straight-line depreciation of $20,000
    for each of 5 years will be used. Hoosier Pride has a 40 percent tax rate, so
    the tax savings will be calculated:


    $$\text{Tax savings} = 40\% \times (\text{interest payment} + \text{depreciation}
    + \text{maintenance})$$


    If the lease option is chosen, the tax savings will be calculated as follows:


    $$\text{Tax savings (years 1–3)} = 40\% \times \text{Lease payment}$$


    $$\text{Tax savings (years 4 and 5)} = 40\% \times (\text{lease payment} + \text{depreciation}
    + \text{maintenance})$$


