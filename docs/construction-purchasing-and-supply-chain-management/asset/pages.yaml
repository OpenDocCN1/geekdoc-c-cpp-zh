  md: 'guided by well-defined planning and scheduling methods. In large organizations,
    the equipment acquisition team includes personnel from engineering, finance, management,
    and purchasing. The equipment acquisition team approach is an excellent example
    of a cross-functional purchasing supply chain strategy. In any progressive construction
    firm, the marketing plan provides a continuous stream of attractive capital equipment
    opportunities. The company owner/superintendent must spend many hours brainstorming,
    analyzing, and carefully planning for their firm’s projected equipment needs.
    The classification of the various capital equipment requests must be based on
    certain common characteristics. Equipment acquisitions are frequently grouped
    according to the following categories:


    +   - Replacement equipment

    +   - Expansion (new market niches)

    +   - Expansion (existing market niches)

    +   - Others


    The *replacement* of old equipment is often motivated by a need to increase quality,
    reduce operating expense, and provide more efficiency. Construction organizations
    can easily conduct in-depth cost savings and efficiency studies. Construction
    organizations on a growth pattern fueled by technology acquire new equipment to
    expand into *newly introduced market segments*. Technology-driven equipment acquisitions
    can become a formidable competitive weapon. Investment in construction equipment
    for expansion purposes should increase incremental revenue. Sometimes construction
    organizations are interested in expanding the output of *existing* market niches,
    which is usually an alternative to replacing the current equipment. Expanding
    existing equipment is also a way to increase capacity.


    # Cash-Flow Analysis


    If a long-term equipment request survives the new market niche ideas step, cash
    flow estimates must be considered for each equipment investment idea. The after-tax
    cash inflows and outflows of each equipment acquisition alternative must be evaluated
    on an incremental cash-flow basis. Three criteria should apply to the cash-flow
    analysis:


    +   - The net cash investment

    +   - The net cash flow

    +   - The economic life of the project


    In other words, the construction organization must consider net cash outlays and
    the total implementation costs. Net cash flows are net economic benefits generated
    from the equipment purchase. The net'
