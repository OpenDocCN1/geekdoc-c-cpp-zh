  md: '# # Materials Purchasing


    The minimum level of materials purchasing expertise must include the following:


    +   1. Competent purchasing personnel

    +   2. Accurate documentation for the requested scope of work

    +   3. A well-documented supplier evaluation system

    +   4. An in-depth understanding of the negotiations process

    +   5. A well-documented quality control system

    +   6. An action plan for implementing an efficient continuous improvement system

    +   7. A just-in-time system for delivering materials and equipment to the jobsite

    +   8. A control system for acknowledging the receipt of materials on the jobsite

    +   9. A well-documented plan for securing materials and equipment on the jobsite

    +   10. A system for job cost accounting for materials and equipment usage

    +   11. An efficient system for tracking back charges


    The materials used in the construction industry are produced by highly skilled
    engineers and production workers. Construction bulk materials are composed of
    naturally occurring materials such as wood and stone. The materials also include
    processed steel, aluminum, and plastics. Processed steel becomes beams, rods,
    screws, and many other construction related products; aluminum is transformed
    into windows; and wood is transformed into lumber, plywood, and many other related
    products. Construction materials such as steel are specified by process (e.g.,
    “hot rolled”), physical properties (hardness and strength), and dimension. A steel
    buyer who orders by industry specification or standard runs little risk of suppliers
    misunderstanding what material is required: “One-inch diameter, 1020 cold rolled
    steel bars, 16 ft long” means the same to everyone who makes steel. Note that,
    while specifications are unambiguous, the quality of the material produced may
    fail to conform to the specifications. This is the same problem that was discussed
    earlier—poor execution of a good design.


    Building codes and engineering specifications regulate the use of construction
    materials. Design engineers and architects are responsible for selecting the appropriate
    materials while considering the owners request, value, and aesthetics, as well
    as the structural attributes of the project. The materials specifications phase
    is the key to building a successful project. Symbols are used to specify materials
    on the'
