  md: '# # CHAPTER 4

    ## Construction

    ## Supplier Selection

    ## and Evaluation


    # Milestones for Success


    The materials selection process is one of the most important steps in the design
    phase of the construction process shown in Chap. 2, Fig. 2.1. Concrete and masonry,
    which are relatively abundant, are two of the most widely used construction materials.
    Small quantities of concrete can be made manually, whereas large quantities are
    made at computerized mixing plants. Masonry (clay, brick, and tile) is made in
    small units, thereby providing the architect with the opportunity to use a variety
    of designs and patterns. Ferrous metal products have a broad range of applications
    that are used in the design process. Wood, plastics, and composites are also commonly
    used by construction organizations. Asphalt is a predominant material in horizontal
    construction. In addition to the materials component, most complex construction
    projects require a number of equipment suppliers (e.g., pumps, compressors and
    blowers, conveyors, cranes and hoist, and testing equipment).


    In today''s aggressive sourcing environment, construction organizations must select
    suppliers based on their value-added capabilities and not purely on the competitive
    process. The current trend in construction materials purchasing is to reduce the
    supplier base. At the same time, more construction organizations are increasing
    their percentage of purchased materials. Therefore, in order to select suppliers
    who continually outperform the competition, suppliers must be carefully analyzed
    and evaluated. When making these critical material'
  merge: -1
  img_proc: true
