    key, you get the specific value of that particular key i.e. ‘sammy-shark’. The
    values that linger within Sammy dictionary could actually be called using that
    same format:![](image929.jpg)When you take advantage of the key-value pairs of
    dictionaries, you can reference keys to retrieve values.-Accessing Elements with
