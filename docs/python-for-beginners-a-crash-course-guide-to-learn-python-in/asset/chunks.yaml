    当你评估条件并根据这些条件是否满足来运行代码时，你本质上正在编写条件代码。在本节中，我将带你了解编写 Python 中条件语句所需的所有知识。


    ### If 语句

    让我们从 `if` 语句开始，它将判断语句是假还是真，并仅在语句为真时运行代码。在纯文本编辑器中打开文件并编写以下代码：


    ![](img/image1167.jpg)


    通过上述代码，你拥有变量 `grade` 并将给它赋值一个整数值 70；然后你将使用 `if` 语句来评估变量 `grade` 是否大于或等于（`>=`）65。如果不满足此条件，你将指示程序打印字符串‘passing
    grade’（及格）。


    现在将程序保存为 `grade.py`，然后使用命令 `python grade.py` 运行它。请注意，在我们的情况下，70 分数并不满足大于或等于 65
    的条件，因此当你运行程序时，你将得到下面的输入：


    ![](img/image1174.jpg)


    我们不会尝试通过将变量 `grade` 的值改为 60 来改变此程序的结果。


    ![](img/image1179.jpg)


    当你保存并运行代码时，你不会收到任何输出，因为条件不满足，而且你没有指示程序执行另一个语句。让我们来看另一个例子：我们将计算银行余额是否小于 0。我们将创建一个名为
    `account.py` 的文件并编写以下程序：


    ![](img/image1186.jpg)


    当你使用 `python account.py` 运行附加的程序时，你将得到以下输出：


    ![](img/image1191.jpg)


    在你初始程序中，值为 `-5` 的变量 `balance` 小于 0。余额满足了 `if` 语句条件（`balance<0`），因此当你保存并运行代码时，你将得到字符串输出。同样，如果你将余额改为
    0 或某些正数，你将得不到任何输出。


    ### Else 语句

    即使 `if` 语句评估结果为假，你可能仍然希望程序执行某些操作。在成绩示例中，你希望无论成绩是不及格还是及格都有输出。为了这一点，让我们在上面的成绩条件中添加一个
    `else` 语句，我们的构建方式如下：


    ![](img/image1198.jpg)


    上面的 `grade` 变量包含值 60——因此，`if` 语句评估为假——程序不会打印‘passing grade’。随后的 `else` 语句将指示程序执行某些操作。当你保存并运行时，你将得到以下输出：


    ![](img/image1204.jpg)


    通过重写程序以输出成绩为 65 或以上的数值，你将改为获得‘passing grade’的输出。如下所示重写代码，以向银行账户示例添加一个 `else` 语句：


    ![](img/image1210.jpg)


    在这里，我们将变量 `balance` 的值改为正数，以便 `else` 语句执行打印。你可以将值改回负数，以让第一个 `if` 语句打印。


    当你将 `if` 和 `else` 语句结合时，你将构建一个包含两个部分的条件语句，无论 `if` 条件是否满足，都会指示计算机执行特定的代码。


    ### else if 语句

    到目前为止，我们学习了各种条件语句的布尔选项，因为每个语句的评估结果非假即真。在大多数情况下，你可能希望程序评估两个两个可能的结果。为此，我们将继续使用 else
    if 语句，在 Python 中它被写作 `elif`。else if 或 `elif` 语句类似于 `if` 语句，并评估另一个条件。在我们的银行账户程序中，我们可能希望针对三种情况拥有三种不同的输出，包括：


    - 余额小于 0

    - 余额等于 0

    - 余额大于 0


    `elif` 语句位于 `if` 语句和 `else` 语句之间，如下所示：


    ![](img/image1226.jpg)


    现在一旦你运行程序，你就可以收到三种可能的输出：


    - 如果变量 `balance` 等于 0，你将通过 `elif` 语句获得输出；这意味着余额为 0，你应该向账户中存入更多钱。

    - 如果变量 `balance` 被设置为正数，你将得到来自 `else` 语句的输出；这意味着你的余额为 0 或更多。

    - 如果变量 `balance` 被固定为负数，输出将是来自 `if` 语句的字符串；这意味着余额小于 0，因此你现在应该存资金，否则将面临罚款。


    如果有想要超过 3 个选项的情况怎么办？这可以通过简单地在代码中编写多个一个 `elif` 语句来实现。在 `grade.py` 程序中，你可以重写代码，使你有几个字母等级与数字成绩的范围相对应。


    - 90 或以上等于 A 等

    - 80 到 89 分等于 B 等

    - 70 到 79 分等于 C 等

    - 65 到 69 分等于 D 等

    - 64 或以下等于 F 等


    要运行此代码，我们需要一个 `if` 语句、3 个 `elif` 语句，以及一个 `else` 语句来帮助你处理所有不及格的情况。我们现在重写上面的示例代码，以打印每个字母等级。我们也可以保持
    `else` 语句不变。


    ![](img/image246.jpg)


    `elif` 语句按顺序评估，因此你可以保持语句简单。程序正在完成以下步骤：


    - 如果成绩大于 90，程序将打印 A；如果小于 90，程序继续执行下一个语句……

    - 如果成绩大于或等于 80，程序将打印 B；如果 79 或更少，程序继续执行下一个语句……

    - 如果成绩大于或等于 70，程序将打印 C；如果 69 或更少，程序继续执行下一个语句……

    - 如果成绩大于或等于 65，程序将打印 D；如果 64 或更少，程序继续执行下一个语句……

    - 当上述所有条件都不满足时，程序打印‘failing grade’（不及格）。


    '
