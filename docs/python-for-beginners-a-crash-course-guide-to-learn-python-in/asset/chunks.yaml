    9: Python DictionariesIn python, dictionaries refer to the unordered collection
    of items. We also refer to them as the built-in ‘mapping’ type of python. Dictionaries
    are helpful because they map keys to values and these pairs (key-value) offer
    a convenient way to store python’s data. Thus, while other compound types of data
    contain only a single value as an element, the dictionary contains a key: value
    pair.We optimize dictionaries to retrieve values when we know the key.Dictionaries
