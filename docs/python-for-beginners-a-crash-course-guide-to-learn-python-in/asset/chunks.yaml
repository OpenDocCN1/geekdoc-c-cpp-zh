    我们将在任选的编辑器中创建一个名为 `password.py` 的文件，并从初始化 `password` 变量为空字符串开始：![](img/image1355.jpg)你将使用空字符串在
    `while` 循环中接收用户的输入。现在我们来一起构建 `while` 语句及其条件![](img/image1360.jpg)


    在这种情况下，`while` 后面紧的是 `password` 变量。你正在检查该变量是否被设置为 `password` 字符串，但你可以选择任何你想要的字符串。因此，如果用户输入了
    `password` 字符串，循环将停止，程序继续执行循环之外的代码。尽管如此，如果用户输入的字符串不等同于 `password` 字符串，循环将继续。之后，你将在
    `while` 循环内部添加执行某些操作的代码块：![](img/image1364.jpg)在 `while` 循环中，程序将运行一个 `print` 语句，然后提示输入密码。随后，通过
    `input()` 函数将 `password` 变量设置为用户的输入。程序检查 `password` 变量是否赋值为 `password` 字符串；如果是，`while`
    循环将自动结束。现在为这种情况给程序添加额外一行代码：![](img/image1370.jpg)最后的语句 `print()` 位于 `while` 循环之外；因此，当用户输入
    `password` 作为密码时，该用户将看到循环外的最后一个 `print` 语句。尽管如此，如果用户完全没有输入 `password` 词，他或她将无法到达最后的
    `print()` 语句并陷入死循环。


    ### 什么是无限循环？

    当程序在单个循环内不断执行而不离开时，就会发生无限循环。你可以简单地在命令行上按 `CTRL+C` 退出无限循环。现在保存程序并运行：`python password.py`
    你将得到密码提示，然后可以使用不同的可能输入对其进行测试。查看程序的示例输出：![](img/image1378.jpg)你应该记住，字符串是区分大小写的，除非你在检查之前利用字符串函数将字符串转换为全小写（例如）。


    ### 一个‘while’循环的示例程序

    既然我们已经在 `while` 循环的前提上取得了良好进展，我们可以创建一个基于命令行的猜数字游戏，这可以有效利用利用 `while` 循环。要理解此程序是如何运行的，请确保仔细阅读并理解条件语句部分。


    首先，我们将从偏好的文本编辑器中创建一个名为 `guess.py` 的文件。你希望计算机为用户生成随机数供其猜测，因此你将[导入](https://www.digitalocean.com/community/tutorials/how-to-import-modules-in-python-3)包含导入语句的
    `random` 模块。如果不熟悉这个包，可以从 Python 文档中学习许多关于[创建随机数](https://docs.python.org/3.6/library/random.html)的知识![](img/image1386.jpg)之后，你给
    `number` 变量分配一个随机整数，确保它在 1 到 25（包含边界）范围内。我希望这不会让游戏变得太难![](img/image1391.jpg)在这里，你可以通过先初始化变量然后生成循环来进入你的
    `while` 循环![](img/image1396.jpg)你初始化了 `number_of_guesses` 变量；这意味着你每次循环时都会增加它，这样就不会出现无限循环。然后你添加了
    `while` 语句，使得变量 `number_of_guesses` 被限制为 5 次。在第五次猜测后，用户将返回命令行，此时，如果用户输入了整数以外的内容，将会报错。我们在循环中添加了一个
    `print()` 语句来提示用户输入数字，我们通过 `input()` 函数获取了 `guess`，然后将其字符串转换为整数。在循环结束之前，你还要让 `number_of_guesses`
    变量加 1，以便你可以循环五次。最后，你应该写一个条件 `if` 语句来检查用户猜测的 `guess` 是否等于计算机生成的 `number`，如果是，你将使用[break
    语句](https://www.digitalocean.com/community/tutorials/how-to-use-break-continue-and-pass-statements-when-working-with-loops-in-python)退出循环。此时程序功能正常，你可以运行命令：`python
    guess.py` 即使它可以运行，用户（此时）在不知道猜测是否正确的情况下循环整个五次。当你采样程序的输出时，你会得到类似这样的内容![](img/image1405.jpg)我们现在将在循环外添加各种条件语句，帮助用户获取关于猜测是否正确的反馈。这些位于文件的末尾![](img/image1409.jpg)现在程序告诉用户他们猜的数字是高是低。在
    `if guess == number` 行之前添加这个![](img/image1414.jpg)当你再次运行 `python guess.py` 程序时，你会注意到用户的猜测得到了更多引导。因此，如果随机生成的数字是
    12，用户猜的是 18，程序将告知用户高了，他们应该相应调整猜测。为了改进代码，你可以处理用户未输入整数的情况。


    ## 第 12 章：在 Python 编程中构建‘For Loops’

    正如上一节提到的，在编程中使用循环的目的是多次自动化执行任务。在本节中，我们将查看 python for 循环。`for` 循环根据计数器或变量执行重复的代码。这意味着在进入循环之前已知迭代次数时，可以使用
    `for` 循环，这与基于 `while` 的循环不同。


    ### For 循环

    在 Python 中，我们这样构建 `for` 循环![](img/image1440.jpg)具体执行的操作直到序列完成。我们现在来看一个遍历范围内数值的
    `for` 循环![](img/image1445.jpg)运行程序，你得到类似这样的输出：01234 `i` 由此 `for` 循环设置为迭代变量，序列出现在零到五范围内。我们在循环内部打印一个整数。请记住，在编程中通常从索引
    0 开始，这就是为什么尽管输五个数字，但它们的范围是 0-4。当你的程序需要重复特定次数的代码块时，通常会注意到并使用 `for` 循环。


    ### 在 For Loops 中使用 ()

    Python 内置不可变序列类型之一是 `range()`。循环专门使用 `range()` 来控制循环的次数。当你使用 `range()` 时，可以向它传递一到三个整数参数：

    - 整数开始的值由 `start` 表示——如果不包含该值，则 `start` 将从 0 开始。

    - `stop` 整数总是必须的，且在计数时不包含在内。

    - `Step` 设置了后续迭代的增量（或负数的减量），如果省略，`step` 默认为 1。让我们来看几个向 `range()` 传递各种参数的例子。首先，我们只传递参数
    `stop`，使得集合的序列为 `range(stop)`![](img/image1465.jpg)在上面的程序中，6 是 `stop` 参数，因此代码从
    0 到 6 迭代——包含 6。输出是：012345 现在让我们突出带有特定值的 `range(start, stop)`，这些值指定了迭代何时开始何时停止![](img/image1477.jpg)这里的范围从
    20 到 25——两者都包含，所以输出看起来像：2021222324 `range()` 的步长参数与[在切片字符串时指定步长](https://www.digitalocean.com/community/tutorials/how-to-index-and-slice-strings-in-python-3#specifying-stride-while-slicing-strings)相同；这意味着可以使用它可以跳过序列中的值。使用三个参数时，`step`
    将位于最后：`range(start, stop, step)`。首先，让我们使用一个正值的 `step`![](img/image1488.jpg)在这里，for
    循环被策略性地设置为从 0 到 15 的数字，但步长为 3，使得每三个数字被打印一次，像这样：image1493.jpg 你也可以使用负值的 `step`
    参数来反向迭代，但必须相应地修改 `stop` 和 `start` 参数：image498.jpg 在这种情况下，100 是 `start` 值，0 是 `stop`
    值。每次迭代减少 10；因此循环从 100 开始在 0 结束。你可以看到这种发生：image1502.jpg


    ### 在 For Loops 中使用序列类型

    列表和其他数据类型也可以作为迭代参数。与其通过 `range()` 迭代，你可以轻松地定义一个列表并对其进行迭代：image1510.jpg 在这里，我们正在打印列表中的每一个项。尽管我们使用了
    `shark` 变量，但可以调用任何有效名称并得到不同的输出，如下：image1515.jpg 上述输出清楚地显示 `for` 循环遍历了列表并打印列表中的每一行。列表和其他序列类型（如元组和字符串）非常适合配合循环，因为它们是迭代的。你可以通过
    `range()` 将这些数据类型结合，例如：在这种情况下，我包含了一个占位符字符串 `shark` 以及 `sharks` 列表长度。你也可以使用 `for`
    循环从零创建一个列表：image1522.jpg 在上面的示例中，`integers` 列表被初始化；然而 `for` 循环以这种方式填充列表 image1526.jpg
    同样，你可以这样遍历字符串：image1530.jpg。当你遍历字典时，记住键值结构很好。


    ### 嵌套 For Loops

    我们经常使用循环来遍历和处理序列类型。嵌套循环是发生在另一个循环内部的循环，在结构上类似于嵌套的 `if` 语句。我们这样构建它们：image1552.jpg
    程序首先遇到外部循环并执行其第一次迭代。这次迭代激活了内部嵌套循环并运行完成。然后程序返回外部循环顶部完成第二次迭代并再次触发嵌套循环。嵌套循环再次运行结束，程序返回外部循环顶部，直到序列结束或被
    `break` 或其他语句中断。现在让我们实现一个嵌套 `for` 循环来帮助理解这一点。在这种情况下，外部循环遍历名为 `num_list` 的整数列表，内部循环遍历名为
    `alpha_list` 的字符串列表 image1558.jpg 运行程序后，你会得到这个输出：image1562.jpg 输出将显示程序通过打印 1 完成外部循环的第一次迭代，从而启动内部循环的完成，因此连续打印
    a, b, c。当内部循环结束后，程序返回外部循环顶部并打印 2，然后完整打印内部循环 (a, b, c)，以此类推。


    嵌套循环对于遍历包含列表的列表是必要的。如果你只使用一个 for 循环，程序会将每个列表作为一个项输出：image1568.jpg 当你想访问内部列表的每一个项时，将必须执行嵌套
    `for` 循环 image1573.jpg 当你开始使用嵌套 `for` 循环时，你能够遍历列表包含的单个项。在本节中介绍了 `for` 循环如何工作以及如何创建它们。`for`
    循环根据指定的次数循环代码块。


    也许是最后的……

    到这里你应该在寻找一种让编码更简单的方法，下一个主题应该帮助你实现这一点——你将能够将类分组，拥有继承其他类的方法，并为链接类的功能创建一个树搜索结构。总的来说，如果你想在编写大型程序时享受重用现有代码的便利，请读下去。免费下载此书的有声书版本！点击下方链接开始![For
    Audible US](https://www.audible.com/pd/B07N8JGWXW/?source_code=AUDFPWS0223189T-BK-ACX0-141304&ref=acx_bty_BK_ACX0_141304)[For
    Audible UK](https://www.audible.co.uk/pd/B07N8HM6RF/?source_code=AUKFrDlWS02231890H6-BK-ACX0-141304&ref=acx_bty_BK_ACX0_141304)[For
    Audible Fr](https://www.audible.fr/pd/B07N8HWBM3/?source_code=FRAORWS022318903B-BK-ACX0-141304&ref=acx_bty_BK_ACX0_141304)[For
    Audible DE](https://www.audible.de/pd/B07N8CQ6TL/?source_code=EKAORWS0223189009-BK-ACX0-141304&ref=acx_bty_BK_ACX0_141304)

