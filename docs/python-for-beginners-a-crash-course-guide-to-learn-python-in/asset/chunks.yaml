    this output better.![](image1045.jpg)![](image1049.jpg)![](image1052.jpg)Python,
    following mathematical logic, has evaluated the following in each of the above
    expressions:![](image1057.jpg)Even though we used integers here, we can also utilize
    float values to substitute them.Boolean operators are also usable with strings;
