    # 第 11 章：在 Python 中构建 ‘while’ 循环


    当你需要自动化和重复任务时，计算机程序会非常有用，因为这样做你就不需要手动操作。重复相同任务的一种极方法是使用循环，在书的这一节中，我们将查看 Python
    中的 `while` 循环。代码的重复实现主要建立在布尔条件之上，所以没什么新奇。只要 `while` 语句为真，包含 `while` 块的代码就会执行。


    ## while 循环


    以下是我们在 Python 中构建 while 循环的方式：![](img/1344.jpg) 程序正在执行的操作将继续运行，直到评估的条件不再为真。现在让我们尝试创建一个执行
    `while` 循环的小程序。对于这个程序，我们将指示用户输入密码。在我们循环过程中，会有 2 种结果：


    *   如果密码正确，退出 while 循环

    *   如果密码错误，while 循环继续执行


