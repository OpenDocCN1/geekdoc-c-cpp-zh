    # Nested if Statements


    When you have started feeling comfortable with the `elif`, `else`, and `if` statements,
    you can start experimenting with the nested conditional statements. You can use
    the nested if statements when you want to check for secondary condition if the
    initial condition implements as true. In this case, you can include an `if-else`
    statement right in the middle on another `if-else` statement. Let us discuss a
    nested if statement:![](image1263.jpg)


    Some possible outputs resulting from this code would be: If the first statement
    (or statement 1) evaluates to true, the program evaluates whether the `nested_statement`
    is also evaluating to true. If both are true, you will get the following output:![](image1269.jpg)


    However, when the first statement evaluates to true but the `nested_statement`
    evaluates to false, the output you get is:![](image1274.jpg) If the first statement
    evaluates to false, it means the `if-else` statement will not run and thus, the
    `else` statement runs alone. In such a case, the output you get is: `false`


    You can also have many `if` statements nested all through your code:![](image1280.jpg)
    In the above code, there is a nested if statement within every ‘if’ statement
    along with the `elif` statement. This allows for more options inside each condition.


    You can look at an example of nested if statement using your `grade.py` program.
    You can check for whether or not a grade is passing first (more than or equivalent
    to 65%), and then look for the letter grade the numerical grade should be equal
    to. However, if the grade is not passing, you do not need to run through the letter
    grades. Instead, you can have the program reporting that the grade is failing.


    The modified code with the nested if statement will appear like this:![](image1287.jpg)
    If you run the code with the `grade` variable set to the integer value of 92,
    the first condition will be met and your program will print ‘passing grade of:’.
    After that, it checks to find out whether the grade is more than, or equivalent
    to 90 and since this condition too is met, it prints out `A`.


    If you run the code with the variable `grade` set to 60, and then the first condition
    fails to be met, the program skips the nested if statements and moves on to the
    ‘else’ statement, and the program prints out ‘failing grade’.


    You can definitely add more options to this, and use another layer of nested if
    statements. Maybe you will want to evaluate for `A-`, `A` and `A+` grades individually.
    We can also achieve that by first trying to see whether the grade is passing,
    then trying to check whether the grade is 90 or more, then checking whether (for
    instance) the grade is beyond 96 for an `A+`.![](image1294.jpg) The code above
    shows that for variable `grade` set to 96, the program runs the following:


    *   Check whether the grade is more than, or equivalent to 65; this is true.

    *   Print out the ‘passing grade of:’

    *   Check whether the grade is more than or equal to 90; this is true

    *   Check whether the grade is more than 96; this is false

    *   Check whether the grade is more than 93 and also less than, or equivalent
    to 96; this is true

    *   Print `A`

    *   Drop these nested conditional statements and move on with the rest of the
    code


    The program output for a grade of 96 will look like this:![](image1315.jpg) The
    nested if statements can give the chance to add a number of particular levels
    of conditions to your code. When you use conditional statements such as the ‘if’
    statement, you gain more control over what your program executes. Conditional
    statements instruct your program to evaluate whether or not a particular condition
    is being met. If the condition is met, it executes certain code, but if not, the
    program continues to move down to some other code.


    In the next section, we will look at conditional statements that repeat themselves;
    the repeated implementation of code is mostly founded on Boolean conditions, so
    nothing new.


