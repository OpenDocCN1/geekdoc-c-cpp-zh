- fmt: "\n# The Python Environmental Variables to Note\n\nEnvironmental variables\
    \ in this regard are system-wide settings living outside python, which you can\
    \ use to customize the interpreter's behavior every time you ran it on your computer.\
    \ It is important you know about them before we run our python program. Python\
    \ recognizes a number of environment variables contained in the following list:\n\
    \n- `PYTHONPATH`: This one has a role that resembles `PATH` i.e. informing the\
    \ Python interpreter the location where it should locate module files, which are\
    \ usually imported into a given program. It usually contains the python source\
    \ code as well as the Python source library directory.\n- `PYTHONSTARTUP`: It\
    \ has the path of an initialization file that contains the Python source code.\
    \ It executes each time you start the interpreter .\n- `PYTHONCASEOK`: If you\
    \ are a Widows user, you will use this variable to ask Python (in an import statement)\
    \ to search for the first case-insensitive match.\n- `PYTHONHOME`: This one is\
    \ an alternative module search path typically embedded within the `PYTHONPATH`\
    \ directory or the `PYTHONSTARTUP` directory to ease the process of switching\
    \ module libraries.\n\nBy now, you must have come across a number of terms that\
    \ you are unfamiliar with. To make it easy to understand these and the others\
    \ that we will discuss as we go on in the book, let’s briefly talk about a list\
    \ of some of these terms.\n\n## Chapter 3: Python Glossary\n\nHere is an explanation\
    \ to some of the common terms that you will find in this book.\n\n- **Augment**:\
    \ This refers to the supplementary information a computer uses to execute commands.\n\
    - **Class**: A class is the template we use to build user defined objects.\n-\
    \ **Continue**: `Continue` is a function we use to skip an existing block and\
    \ turn back to the `while` or `for` statement.\n- **Conditional statement**: A\
    \ conditional statement is a statement containing an `if/else` or `if`.\n- **Debugging**:\
    \ Debugging is the process of pursuing and purging errors in programming.\n- **Def**:\
    \ `Def` is a function that mainly defines a method or function.\n- **Iteration**:\
    \ Iteration refers to the process where instructions or structures are repeated\
    \ sequentially a set of times or until some condition is met.\n- **Syntax**: A\
    \ syntax is a set of rules that outline how python program should be written and\
    \ interpreted.\n- **Index**: Index refers to the position in a well-ordered list\
    \ assigned to the characters. For instance, each character holds an index from\
    \ 0 to the length of -1.\n- **Variable**: A variable is reserved memory location\
    \ a computer uses to store values.\n- **Module**: Refers to an object that contains\
    \ attributes, arbitrarily named, that can reference and bind.\n- **Console**:\
    \ Refers to the terminal where you can execute a command at a time.\n- **Instantiate**:\
    \ The process of generating an instance. An instance is specific realization of\
    \ template class of objects.\n- **Indentation**: Refers to the placement of text\
    \ away the left or right in order to separate it.\n\n## Chapter 4: Interacting\
    \ with Python\n\nIn this section, you will learn how to use and interact with\
    \ Python in number of available ways. Let us begin by talking about the python’s\
    \ interpreter, while using the console of your operating system. A console is\
    \ also referred to as a command prompt or terminal. A textual method of interacting\
    \ with your PC together with the mouse.\n\n### How to Open a Console on Mac X\n\
    The standard console of OS X is a program known as “terminal”. To open it, navigate\
    \ to applications, then double click terminal program. You can also easily search\
    \ for it at the top right of the screen. The command line terminal is a tool you\
    \ will use to interact with your computer.\n```\ncomputer:~\n```\n\n### How to\
    \ Open a Console in Linux\nThe different distributions of Linux (such as mint,\
    \ Fedora, Ubuntu) may have dissimilar console programs, typically known as terminals.\
    \ The particular terminal you open and how you do so can depend on your distribution.\
    \ Let us take one example on Ubuntu; open Gnome Terminal—it presents a prompt\
    \ similar to this:\n```\nusername@computer:~$\n```\n\n### How to Open a Console\
    \ on Windows\nWindow’s console is also referred as the command prompt, or `cmd`.\
    \ You can easily get to it by using the key combination `windows+R` (windows in\
    \ case refers to Run button), that opens Run dialog. Just type `cmd` and press\
    \ enter or just click okay. You can also use the start menu to search for it.\
    \ It should appear like this:\n```\nC:\\Users\\username >\n```\nThe windows command\
    \ prompt is not as potent as its counterparts on OS X and Linux are; therefore,\
    \ you should consider directly starting the Python interpreter or use the IDLE\
    \ program that comes with Python. All these are accessible from the Start menu.\n\
    \n### Starting and Interacting With Python\nThe python program you have installed\
    \ will act as something we usually refer as interpreter. The interpreter picks\
    \ up text commands and runs them as you write them, which is quite handy for trying\
    \ stuff out. At your console, just type `python` then press enter and you should\
    \ enter the interpreter.\n```\n>>>\n```\nThis indicates that you are currently\
    \ in an interactive Python interpreter session known as ‘python shell’. You should\
    \ note that the python shell is different from the normal command prompt. At this\
    \ point, you can try entering some code for Python to run. Try the following:\n\
    ```python\nprint(\"Hello world\")\n```\nHelp is a very useful command since it\
    \ enters a help functionality that lets you explore all the things python enables\
    \ to do, right from the interpreter. To close the help window, press `q` and go\
    \ back to the Python prompt. You can also press `Ctrl+Z` to leave the interactive\
    \ shell and return to the console or the system shell. On OS X or Linux, press\
    \ `Ctrl+D`, or on the Windows button, enter. Let us now try a simple exercise:\
    \ Earlier, I demonstrated entering a command to work out some math. You can now\
    \ try out some math commands. Do you know any python operations? Tell it to give\
    \ you the squared result of the sum of 239 and 588.\n\n### Running the Python\
    \ Files\nWhen you have a large python code to run, you will want to save it into\
    \ a file. For example, you can modify it into little parts (fix a bug) and re-run\
    \ the code without having to type the rest repeatedly. You can save your code\
    \ to a file and pass the name of the file to the python program instead of typing\
    \ the commands one by one. This executes the file’s code instead of launching\
    \ the interactive interpreter. Let us try that: Just create a file in the current\
    \ directory (labelled `hello.py`) with your most preferred code editor and then\
    \ enter the print command above. Next, save the file. On OS X or Linux, run `touch\
    \ hello.py` so that you create an empty file to edit. It is very easy to run this\
    \ file with Python:\n```bash\npython hello.py\n```\nEnsure you are positioned\
    \ at your system command prompt, which will either have `$` or `>` at the end,\
    \ not at python’s (which contains `>>>` instead). If you are using Windows, you\
    \ can double click the file to run it. When you press enter now, the file will\
    \ execute and you will see the output. This time however, when python has completed\
    \ the execution of all commands from the file, it exits back to the system command\
    \ prompt.\n\nAt this point, we can now get started with turtle. Even so, you have\
    \ to note the following: If you are getting weird errors about ‘no such file or\
    \ directory’ or ‘can’t open file’ instead of ‘hello world’, it means your command\
    \ line is most probably running from the directory in which you saved your file.\
    \ You can go ahead and change your command line’s working directory with the `cd`\
    \ command—`cd` stands for change directory. On windows, you might prefer something\
    \ like:\n```cd Desktop\\Python_Exercises\n```\nIf you are using OS X or Linux,\
    \ you might prefer seeing something like:\n```\ncd Desktop/Python_Exercises\n\
    ```\nThis changes to `python_exercises` under the desktop folder. If unsure of\
    \ location you saved the file in, simply drag the directory to the command line\
    \ window. Again, if you are not sure in directory your shell is currently running,\
    \ use `pwd`—it stands for print directory. NOTE: When you begin playing around\
    \ turtle, avoid naming your file `turtle.py`. You can try using more names like\
    \ `rectangle.py` or `square.py`. Otherwise, each time you refer to `turtle`, python\
    \ will immediately pick up your file in place of standard `turtle` module.\n\n\
    ## Chapter 5: Using Turtle for a Simple Drawing\n\nTurtle is a python feature\
    \ resembling a drawing board that lets you command some turtle to draw over it.\
    \ In this feature, you can use functions such as `turtle.left()` and `turtle.forward()`\
    \ which can move the turtle around. Before we use the turtle, we have to import\
    \ it first. I recommend playing it in the interactive interpreter first since\
    \ there is a bit more work needed to make it work from files. To do so, go to\
    \ your terminal and type the following:\n```python\nimport turtle\n```\nIf you\
    \ are using Mac OS and are not seeing anything, you can try issuing a command\
    \ as `turtle.forward(0)` and check whether a new window opens behind your command\
    \ line. If you are using Ubuntu and receive the following error message `no module\
    \ named _tkinter`, it means you have a missing package; just install it with `sudo\
    \ apt-get install python3-tk`. While it might be tempting to copy-paste some of\
    \ the things written in this book into your terminal, I recommend that you type\
    \ out each command because typing will get the syntax under your fingers (growing\
    \ the muscle memory) and even assist avoid syntax-based errors.\n```python\nturtle.forward(25)\n\
    turtle.left(30)\n```\nThe function `turtle.forward()` will tell the turtle to\
    \ move forward by a specific distance while `turtle.left()` takes the number of\
    \ degrees you desire to rotate to the left. We also have `turtle.right()` and\
    \ `turtle.backward()` too. If you want to start afresh, simply type `turtle.reset()`\
    \ to clear the drawing your turtle created so far.\n\n### Draw a Square\n```\n\
    \n### Draw a Rectangle\nThe standard turtle is a triangle; that is no fun. Instead\
    \ of using the `turtle.shape()` command, let us try making it a turtle:\n```python\n\
    turtle.shape(\"turtle\")\n```\nThat is so much better. If you placed the commands\
    \ into a file, you should have noted the turtle window disappear after the turtle\
    \ completed its movement. This is because python normally exits as soon as your\
    \ turtle has completed moving. Since the turtle window is innate to python, it\
    \ will go away as well. To prevent that, you can just put `turtle.exitonclick()`\
    \ beneath your file. The window remains open until you click on it.\n\nIn Python\
    \ programming, text’s horizontal indenting is important. We will learn all about\
    \ it as we look at functions later on. For now though, let us consider that stray\
    \ spaces or tabs can bring an unexpected error. You can even try adding one to\
    \ see how badly python will react.\n\n## Chapter 6: Variables\n\nI’m sure you\
    \ have noted that experimenting with angles requires changing three different\
    \ numbers or places in the code each time. Can you imagine trying out all the\
    \ sizes of squares or with rectangles? Would not be tedious? Luckily, we have\
    \ easier ways to do that than changing many numbers each time. Using variables,\
    \ we can achieve that sleekly. You will be able to tell python that whenever you\
    \ refer to a variable, you actually mean something else. When you relate it to\
    \ symbolic math, where you can write “let x be 5”, this concept may be a bit more\
    \ familiar. In this case, then `x*2` is obviously 10. In python syntax, this statement\
    \ is explained as `x = 5`. After the statement, if you happen to `print(x)`, it\
    \ outputs the value.\n\nVariables store all sorts of stuff, not just numbers.\
    \ Another thing you may want to store regularly is `string`. A string just refers\
    \ to piece of text. These (Strings) usually have a starting as ending double quote.\n\
    \n### The Angle Variable\nYou can even refer to the turtle by name using a variable?\
    \ Here is an explanation of this in play:\n```python\njohn = turtle\n```\n\n###\
    \ The Pythagorean Theorem\nTell it to give you the squared result of the sum of\
    \ 239 and 588. There are several ways you can get the answer:\n\n## Chapter 7:\
    \ Loops\n(content continues...)\n\n## Chapter 8: Native Datatypes\n\n### 1: Python\
    \ Strings\nWe are now going to discuss how to make, format, and delete strings.\
    \ A string is a sequence of characters. A character is a symbol; for instance,\
    \ we have 26 characters in the English language. Nonetheless, computers do not\
    \ deal with characters; \n\n### The String Operators\nWe have numerous operations\
    \ you can perform with string; this makes it one of the most used python datatypes.\n\
    \n#### 1- Concatenation of Multiple Strings\nA concatenation is the joining of\
    \ two or more strings into one string. In Python, we use the `+` operator to achieve\
    \ this. When you write two string literals together, it also concatenates them.\
    \ We use the `*` operator to repeat the strings a particular number of times.\n\
    \n#### 2-Iterating Through String\nYou can also use `for loop` to iterate through\
    \ a string. For instance, you can count the sum of ‘1’ in a string.\n\n#### 3-\
    \ The String Membership Test\nYou can test if a substring occurs inside a string\
    \ or not by using the keyword `in`.\n\n#### 4- The Built-In Functions to Use with\
    \ Python\nMany built-in functions that work with sequence also work with strings.\
    \ Some of the most popular functions are `len()` and `enumerate()`.\n\n### Python\
    \ String Formatting\nHere is how python strong formatting works:\n\n#### Escape\
    \ Sequence\nSay you want to print some text as ‘he said, what’s there’, you cannot\
    \ use single or double quotes. Since the text itself has both double and single\
    \ quotes, it will definitely result in `SyntaxError`.\n\n#### Formatting Strings\
    \ Using the Format Method\nThe `format()` method that is available with the string\
    \ is quite versatile.\n\n#### Element Slicing in Python\nWe can access particular\
    \ characters using indexing and an array of characters through slicing. Index\
    \ starts from 0 and when you try to access a character out of range, it causes\
    \ an `IndexError`.\n\n"
