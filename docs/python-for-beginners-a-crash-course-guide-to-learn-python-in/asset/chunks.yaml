    确保你处于系统提示符处，结尾应该是 `$` 而不是 `>>>`。如果你使用的是 Windows，可以双击文件运行它。当你按回车时，文件将执行，你会看到输出。然而，当
    python 完成文件中所有命令的执行后，它会返回系统提示符。此时我们现在可以开始 turtle。如果你遇到奇怪的错误“no such file or directory”或“can’t
