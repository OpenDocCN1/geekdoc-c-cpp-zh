    # 类与对象


    *   类是程序员为对象构建的蓝图。它定义了刻画从该特定类实例化的任何对象的属性。

    *   另一方面，对象是类的实例。它是类的具体实现版本；类是在程序中展示的结构。


    你将使用这些概念来构建模式（针对类），然后利用这些模式（针对对象）。在本节中，我们将讨论如何初始化属性、实例化对象、使用构造方法方法创建类，以及如何使用同一类的多个对象进行工作。


    ## 类


    你可以将类看作是创建对象的蓝图。我们使用 `class` 关键字来定义类，就像我们使用 `def` 关键字来定义函数一样。


    我们现在定义一个名为 `shark` 的类，它包含两个函数：`Swimming` 和 `Being awesome`：![](img/image1610.jpg)


    由于这些函数在 `shark` 类内部缩进，因此我们称它们为方法（在类内部定义的特殊函数）。`self` 单词是对基于该类创建的对象引用，它是这些函数的参数；`self`
    始终是引用实例的初始参数，但它不必是唯一的参数。


    定义这个类仅仅创建了鲨对象的模式，我们稍后会定义它。它并没有创建任何 `shark` 对象。这意味着如果你在这一阶段之后运行程序，将没有任何任何内容。因此，我们通过创建上面的
    `shark` 类，获得了一个对象的蓝图。


    ## 对象


    对象仅仅是类的实例。你可以获取上面定义的 `shark` 类，然后使用它来创建一个对象以及它的实例。我们现在将创建一个名为 `sammy` 的 `shark`
    对象—— `sammy=shark()`。


    在这种情况下，通过将其赋值为 `shark()`，我们将对象 `sammy` 初始化为类的实例。现在我们将对鲨鱼对象 `sammy` 使用这两个两个方法：![](img/image1620.jpg)


    `sammy` 正在使用两个方法：`be_awesome()` 和 `swim()`。我们使用点操作符（`.`）调用这些方法，该操作符用于引用对象的属性。在这种情况下，该属性是一个带有括号调用的方法，就像你调用函数一样。


    由于 `self` 关键字是 `shark` 类中定义的方法参数，`sammy` 对象被传递给方法。`self` 参数确保方法有办法引用对象的属性。尽管如此，当我们调用方法时，括号内没有传递任何内容，`sammy`
    对象通过点操作符自动传递。


    我们现在将在程序的范围内添加该对象：![](img/image1628.jpg)


    当你运行程序时：![](img/image1632.jpg) `sammy` 对象调用了程序函数 `main()` 中的两个方法，从而使方法运行。


    ## 构造方法


    我们使用构造方法来初始化数据。构造方法在类对象被实例化时运行。它也被称为 `__init__` 方法，并将是第一个类定义；它看起来像这样：![](img/image1638.jpg)


    如果你将上面的 `__init__` 方法添加到上述程序中的 `shark` 类中，在不对 `sammy` 实例化进行任何修改的情况下，你将得到一个像下面的输出：![](img/image1643.jpg)


    其原因是构造方法是自动初始化的。你应该使用这个方法执行你对类对象想要进行的任何初始化。与其使用这个构造方法，我们可以构建一个使用 `name` 变量的构造方法，我们可以通过它为对象命名。在这种情况下，`name`
    将作为参数传递，我们将 `self.name` 设置等同于 `name`。![](img/image1647.jpg)


    接下来，我们可以修改函数中的字符串以如下所示引用名称：![](img/image1651.jpg) 最终，你可以通过传递其作为 `Shark` 类的参数，将鲨鱼对象的名称
    `sammy` 设置为 `Sammy`。![](img/image1656.jpg)


    现在运行程序：`python shark.py`![](img/image1661.jpg) 如你所见，我们传递给对象的名称正在打印出来。我们用参数名称（连同
    `self` 关键字）定义了 `__init__` 方法，并在方法中定义了一个变量。


    由于构造方法是自动初始化的，因此我们不需要显式地调用它，而是在创建类的新实例时，在跟随类名后的括号内传递参数即可。如果我们想的话，也可以通过将其传递给 `__init__`
    方法来添加另一个如 `age` 的参数。![](img/image1667.jpg)


    之后，当我们构建对象 `sammy` 时，我们也可以在语句中传递 sammy 的年龄：![](img/image1671.jpg) 我们还需要在类中创建一个调用
    age 的方法以便使用它。构造方法允许我们初始化特定的对象属性。


    ## 与多个对象工作


    类之所以重要，是因为它们允许你在同一个蓝图上创建多个相似的对象。为了更好地了解其工作原理，我们可以在程序中添加另一个 `shark` 对象：![](img/image1677.jpg)


    我们创建了另一个名为 `stevie` 的 `shark` 对象，并向它传递了名称 `stevie`。在这种情况下，我们对 `sammy` 使用了 `be_awesome()`
    方法，对 `stevie` 使用了 `swim()` 方法。


    现在运行程序：`python shark.py`![](img/image1682.jpg) 输出显示我们确实在使用两个不同的对象：`stevie` 和 `sammy`
    对象，它们都属于 `shark` 类。类允许你创建多于一个对象。


    ## 结论


    这就是你理解 Python 编程的指南。你还应该注意，我们涵盖了许多内容但不是 Python 的全部。这意味着在短短几天内，你应该熟悉所有所讨论的内容，并能够轻松地执行讨论过的项目。对更多主题进行更多研究以扩展你的知识将是非常明智的。


