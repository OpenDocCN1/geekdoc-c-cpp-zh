    ## Introduction

    Thank you for downloading this book. The book has lots of actionable information
    that will get you started on the journey to becoming a pro at python programming.


    Without doubt, code is the language of the future. Think about it, with the ever
    growing dependency on computers, one of the most critical things that anyone in
    the world today can learn is how to speak to computers in a language that they
    understand and have them do anything that you want to do. This skill is one whose
    demand is increasing at an increasing rate the world over. Whether you want to
    learn code to pursue a career as a programmer, web developer or graphics designer
    or want to learn code to be able to develop your own web applications and other
    computerized systems, the one thing you need to do is to start somewhere. What
    better place to start than to learn?


    ## Chapter 1: Python: A Comprehensive Background

    Before we discuss Python programming, especially what python is, let me briefly
    say something about programming. Being a good programmer does not simply entail
    knowing a vast array of programming languages or how to code fast programs. Instead,
    it is about:


    *   Comprehending a problem abstractly and being able to change it into code.

    *   Looking for new ways to tackle, for instance, a scientific problem and knowing
    the kind of tools to use.

    *   Being able to fix a program when it is not working

    *   Writing a program that is quick enough, not the quickest possible

    *   Writing a program that other people can understand in a short period of time


    Take note of the last point: Reproducible research and open science is becoming
    the norm in some research fields. This means that other people will probably have
    to read your code, understand exactly what you are doing and be able to recreate
    the code so that they can run it. By the end of this book therefore, we will not
    only be interested in the correctness of your solutions; we shall also look at
    whether we can understand how the program you create solves the problem. This
    is to mean that you should always write your codes assuming that someone else
    will read it. Let’s go back to understanding python, the programming language
    of the future.


    ### What Is Python?

    In its simplest terms, python is a general-purpose, multi-paradigm, and interpreted
    programming language that gives programmers the ability to use various styles
    of programming to create complex or simple programs, get results faster, and write
    code in a way that resembles human language.


    Python is the programming language often used to create algorithms for sorting
    and analyzing chunks of data that businesses and organizations from all over the
    world collect. The explanation above brings about some very interesting points
    about python:


    1. It’s a high level language

