    This pair can go anywhere in the dictionary since dictionaries are typically unordered.
    If you can use the dictionary ‘usernames’ later in your program file, it will
    contain the additional key-value pair.Additionally, you can use this syntax to
    modify the value assigned to a key. In this case, you will reference a key that
    exists and pass to it a different value.We will consider a dictionary ‘drew’ which
