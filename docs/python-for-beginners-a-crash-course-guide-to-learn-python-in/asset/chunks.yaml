    # 嵌套 if 语句


    当你开始熟悉 `elif`、`else` 和 `if` 语句后，就可以开始尝试使用嵌套条件语句了。当你想要在初始条件为真时检查次要条件，就可以使用嵌套的 if
    语句。在这种情况下，你可以将一个 `if-else` 语句直接放在另一个 `if-else` 语句中间。让我们讨论一下嵌套 if 语句：![](img/image1263.jpg)


    此代码可能产生的输出为：如果第一个语句（或语句 1）求值为真，程序将评估 `nested_statement` 是否也求值为真。如果两者都为真，你将得到以下输出：![](img/image1269.jpg)


    然而，当第一个语句求值为真但 `nested_statement` 求值为假时，你得到的输出是：![](img/image1274.jpg) 如果第一个语句求值为假，则意味着
    `if-else` 语句将不会运行，因此 `else` 语句将单独运行。在这种情况下，你得到的输出是：`false`


    你还可以在整个代码中嵌套许多个 `if` 语句：![](img/image1280.jpg) 在上面的代码中，每个 `if` 语句和 `elif` 语句内部都有嵌套的
    if 语句。这允许在每个条件内部有更多选项。


    你可以通过你的 `grade.py` 程序查看嵌套 if 语句的示例。你可以先检查成绩是否及格（大于或等于 65%），然后查找数字成绩对应的字母等级。然而，如果成绩未及格，你不需要运行字母等级判断。相反，你可以让程序报告成绩不及格。


    带有嵌套 if 语句的修改后代码如下：![](img/image1287.jpg) 如果你将变量 `grade` 设置为整数 92 并运行代码，第一个条件将满足，你的程序将打印‘passing
    grade of:’。之后，它会检查成绩是否大于或等于 90，由于这个条件也满足了，它会打印出 `A`。


    如果你将变量 `grade` 设置为 60 运行，第一个条件将无法满足，程序将跳过嵌套的 if 语句并移动到‘else’语句，程序将打印‘failing grade’。


    你完全可以在此基础上添加更多选项，并使用另一层嵌套 if 语句。也许你想要单独评估 `A-`、`A` 和 `A+` 等级。我们也可以通过首先尝试查看成绩是否及格，然后尝试检查成绩是否为
    90 或或以上，再检查（例如）成绩是否超过 96 以获得 `A+`。(image1294.jpg)上面的代码显示，当变量 `grade` 设置为 96 时，程序运行如下：


    *   检查成绩是否大于或等于 65；这是真的。

    *   打印‘passing grade of:’

    *   检查成绩是否大于或等于 90；这是真的。

    *   检查成绩是否大于 96；这是假的。

    *   检查成绩是否大于 93 且小于或等于 96；这是真的。

    *   打印 `A`

    *   放弃这些嵌套条件语句并继续执行代码其余部分


    成绩为 96 的程序输出将如下：![](img/image1315.jpg) 嵌套 if 语句可以让你在代码中添加许多特定层级的条件。当你使用诸如‘if’语句之类的条件语句时，你对程序执行的内容有了更多的控制。条件语句指示你的程序评估是否满足特定条件。如果满足条件，它会执行某些代码，如果不满足，程序将继续向下移动其他代码。


    在下一节中，我们将查看会重复的条件语句。代码的重复实现主要建立在布尔条件之上，所以没什么新奇。


