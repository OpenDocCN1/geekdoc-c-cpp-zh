    10: Boolean Logic and Conditional StatementsThe Boolean type of data can be one
    or two values, either false or true. In programming, we use Booleans to compare
    and control the flow of the program. Booleans symbolize the true values linked
    with logic in mathematics, which forms the foundation of algorithms in computer
    science. Booleans are named after George Boole, the mathematician who lived over
    two centuries ago. Thus, the word Boolean should begin with a capitalized B. The
    False and True values also have to begin with capital F and T respectively because
    in Python, they are very special values.Before we get deeper into the topic, we
    will start by going over the basics of Boolean logic, including how they work,
    the Boolean comparisons, truth tables and logical operators.Comparison OperatorsIn
    programming, we use comparison operators to make comparisons of values and evaluate
    down to one Boolean value of either False or True.The following is a table showing
