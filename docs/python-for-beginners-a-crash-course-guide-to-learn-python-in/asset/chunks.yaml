    ## Chapter 12: Constructing ‘For Loops’ In Python ProgrammingAs I mentioned in
    the previous section, in programming, the purpose of using loops is to automate
    and repeat similar tasks many times. In this section, we will be looking at the
    `for` loop in python. A `for` loop executes the repeated implementation of code
    according to the loop counter or variable. This means you can utilize `for` loops
    especially when the number of iterations is known before you enter the loop, which
    is nothing like the `while` loops that are largely based.


    ### The For Loops

    In Python, we construct `for` loops as follows:![](image1440.jpg)What is being
    done exactly is implemented until the sequence is finished. We will now look at
    a `for` loop that iterates through values in a range:![](image1445.jpg)By running
    the program, you get an output that looks like this:01234`i` is set up by this
    for loops as its iterating variable, and the sequence occurs in the range of zero
    to five. We print a single integer for iteration within the loop. Bear in mind
    that in programming, it is typical to start at index 0, which is why although
    five numbers are pointed out, they range from 0-4. You will generally note and
    use `for` loops when your program needs to repeat a block of code a particular
    number of times.


    ### Using Range () In For Loops

    One of Python’s in-built types of immutable sequence is `range()`. Loops in particular
    use `range()` to control the number of times the loop is repeated. When you are
    working with `range()`, you can pass between one and three arguments of integers
    to it:

    - The value at which the integer starts is denoted by `start`- if the value is
    not included, `start` will start at 0.

    - The `stop` integer is always essential and while counted up, it is not included.

    - `Step` sets how much increasing (or decreasing of negative numbers) the following
    iteration, which if omitted, `step` defaults to 1. Let us look at a couple of
    examples of passing various arguments to `range()`. First of all, we will only
    pass the argument `stop` so that the set’s sequence is `range(stop)`.![](image1465.jpg)In
    the above program, 6 is the `stop` argument, and so the code iterates from 0-6-which
    is inclusive of 6. The output is:012345Let’s now highlight the `range(start, stop)`
    with the specific values specified for when the iteration really starts and when
    they should stop.![](image1477.jpg)The range here starts from 20 to 25- both of
    which are inclusive, so the output looks like this:2021222324 The `range()` step
    argument is the same as trying to [specify stride while slicing strings](https://www.digitalocean.com/community/tutorials/how-to-index-and-slice-strings-in-python-3#specifying-stride-while-slicing-strings)
    ; this means you can use it to skip values in the sequence. With the three arguments,
    `step` will come in the last position: `range(start, stop, step)`. First, let
    us use a `step` that has a value that is positive![](image1488.jpg)Here, the for
    loop is strategically set up that the numbers ranging from 0 to 15 print out,
    but a step of 3 so that only every third number gets printed, like this:![](image1493.jpg)You
    can also use a negative value for the `step` argument so to iterate backwards,
    but you will have to modify the `stop` and `start` arguments accordingly:![](image498.jpg)In
    this case, 100 is the `start` value, and 0 is the `stop` value. -10 is the range;
    thus the loop starts at 100 and ends at 0 while reducing by 10 with every iteration.
    You can see this happening:![](image1502.jpg)


    ### Using Sequential Data Types In For Loops

    Lists and other types of data sequence can also be used as iteration parameters.
    Instead of iterating through `range()`, you can easily define a list and iterate
    via it. Let us now assign a list to a variable and try iterating through the list![](image1510.jpg)Here,
    we are printing out every item in the list. Even though we used the `shark` variable,
    we could have called the variable any valid name and would not get any different
    output as you can see:![](image1515.jpg)The above output clearly shows that the
    `for` loop is iterated through the list, and prints every item from the list per
    line. List and other sequence data types such as tuples and strings are ideal
    to use with loops since they are iterable. You can bring together these datatypes
    with `range()` to take in items to a list- for instance: In this case, I have
    included a placeholder string `shark` with every item of the `sharks` list length.
    You can also use a `for` loop to create a list from scratch![](image1522.jpg)In
    the example above, the list `integers` gets initialized empty; nonetheless the
    `for` loop populates the list this way![](image1526.jpg)Likewise, you can iterate
    through strings like this:![](image1530.jpg)You can iterate through tuples in
    the exact same format as iterating through strings or lists. When you are iterating
    through a dictionary, it is good to keep the key, value structure, in mind to
    make sure you are calling the right dictionary element.


    ### The Nested For Loops

    We often use loops to iterate and manipulate the sequential data types.

    We can nest loops in Python, as we can with other languages. A nested loop is
    a loop occurring within another loop, and is similar to the nested `if` statements
    in terms of structure. We construct them like this:![](image1552.jpg)The program
    will first meet the outer loop, implementing its first iteration. This first iteration
    activates the inner, nested loop that subsequently runs to completion. The program
    then returns to the top of the outer loop, to complete the second iteration and
    triggers the nested loop again. Once again, the nested loop runs to the end, and
    the program goes back to the top of the outer loop until the sequence finishes
    or a `break` or some other statement interrupts the process. Let us now implement
    a nested `for` loop to help us understand more of this. In this case, the outer
    loop iterates through a list of integers known as `num_list`, and the inner loop
    iterates through strings list known as `alpha_list`.![](image1558.jpg)Upon running
    the program, you will get this output:![](image1562.jpg)The output will show that
    the program finishes the outer loop’s first iteration by painting 1, which then
    initiates completion of the inner loop, thus printing a, b, c successively. When
    the inner loop ends, the program will return to the top of the outer loop and
    print 2, and then print the inner loop entirely (a, b, c) and so on.


    Nested for loops are necessary for iterating through items inside lists that comprise
    lists. If you use only one `for` loop, the program gives an output of every list
    as an item:![](image1568.jpg)When you want to access every item of the internal
    lists, you will have to execute a nested `for` loop.![](image1573.jpg)When you
    begin utilizing a nested `for` loop, you become able to iterate over the individual
    items contained in the lists. We have gone over how `for` loops work in this section,
    and how to create them. For loops, continue looping through a block of code given
    a particular number of times.


