- fmt: "\n# Classes and Objects\n\n* A class is a blueprint a programmer builds for\
    \ an object. It defines the attributes that will characterize whichever object\
    \ instantiated from this particular class. \n* On the other hand, an object is\
    \ an instance of a class. It is the realized class version; the class is exhibited\
    \ in the program.\n\nYou will use these to build patterns (with respect to classes)\
    \ and then utilize the patterns (with respect to objects). In this section, we\
    \ will discuss about initializing attributes, instantiating objects and creation\
    \ of classes with the use of the constructor method, and using multiple objects\
    \ of the same class to work with.\n\n## Classes\n\nYou can think of classes as\
    \ blueprints we use to create objects. We use the `class` keyword to define classes,\
    \ just as we use the `def` keyword to define functions.\n\nWe will now define\
    \ a class named `shark` that contains two functions: `Swimming` and `Being awesome`:![](image1610.jpg)\n\
    \nSince these functions are indented within the class `shark`, we refer to them\
    \ as methods (special functions defined within a class). The word `self` which\
    \ is a reference to objects made based on this class, are the argument to these\
    \ functions; `self` will always be the initial parameter to reference instances,\
    \ but it does not have to be the only one.\n\nDefining this class then only created\
    \ a shark object’s pattern, which we will define later. It does not create any\
    \ `shark` objects. This means if you run your program beyond this stage, there\
    \ will be nothing returned. We therefore got a blueprint for an object by creating\
    \ the `shark` class above.\n\n## Objects\n\nAn object is just a class instance.\
    \ You can take the `shark` class, which we defined above then use it so as to\
    \ create an object as well as its instance. We will now make a `shark` object\
    \ by the name `sammy`- `sammy=shark()`.\n\nIn this case, by setting it equal to\
    \ `shark()`, we initialized the object `sammy` as a class instance. Now we will\
    \ use both methods with the shark object `sammy`:![](image1620.jpg)\n\n`sammy`\
    \ is using both methods: `be_awesome()` and `swim()`. We called these using the\
    \ dot operator (`.`) used to reference the object’s attribute. In this case, the\
    \ attribute is a method called with parentheses just as you would call with a\
    \ function.\n\nSince the `self` keyword was a parameter of the methods as is defined\
    \ in the class `shark`, the `sammy` object is passed to the methods. The parameter\
    \ `self` makes sure the methods have a way of referring to attributes of the objects.\
    \ Nonetheless, when we call the methods, there is nothing passed within the parentheses\
    \ and the `sammy` object is automatically passed with the dot.\n\nWe will now\
    \ add the object within the program’s context:![](image1628.jpg)\n\nWhen you run\
    \ the program:![](image1632.jpg) The `sammy` object calls both methods in the\
    \ program’s function `main()`, thus making the methods run.\n\n## The Constructor\n\
    \nWe use the constructor method to initialize data. The constructor runs when\
    \ a class object is instantiated. It is also called `__init__` method and will\
    \ be the first class definition; it looks like this:![](image1638.jpg)\n\nIf you\
    \ add the `__init__` method above to the `shark` class in the above program, you\
    \ would get an output that looks like the one below without doing any modification\
    \ inside the `sammy` instantiation:![](image1643.jpg)\n\nThe reason is that the\
    \ constructor method is initialized automatically. You should carry out any initialization\
    \ you want to do with your class objects with this method. Instead of using this\
    \ constructor method, we can build one that uses a `name` variable, which we can\
    \ assign names to objects with. In this case, the `name` will be passed as a parameter\
    \ and we will set `self.name` equivalent to `name`.![](image1647.jpg)\n\nNext,\
    \ we can modify the strings in our functions to reference the names as below:![](image1651.jpg)\
    \ Ultimately, you can set the `shark` object’s name `sammy` as equal to `Sammy`\
    \ by passing it as a parameter of `Shark` class.![](image1656.jpg)\n\nNow run\
    \ the program: `python shark.py`![](image1661.jpg) As you can see, the name we\
    \ passed to the object is printing out. We defined the `__init__` method with\
    \ the name of the parameter (together with the `self` keyword) and also defined\
    \ a variable in the method.\n\nSince the constructor method is initialized automatically,\
    \ we do not need to call it explicitly but pass the arguments within the parentheses\
    \ that follow the class name when we make a new instance of the class. We could\
    \ also add another parameter like `age` if we wanted to by passing it to the `__init__`\
    \ method too.![](image1667.jpg)\n\nAfter that, when we build our object `sammy`,\
    \ we can also pass the age of Sammy in the statement:![](image1671.jpg) We would\
    \ also need to create a method in the class calling for age in order to make use\
    \ of it. The constructor method enables us to initialize particular object attributes.\n\
    \n## Working With Multiple Objects\n\nClasses are important because they let you\
    \ create multiple similar objects on the same blueprint. For a better insight\
    \ on how this works, we can add another `shark` object to the program:![](image1677.jpg)\n\
    \nWe have created another `shark` object named `stevie` and passed to it the name\
    \ `stevie`. In this case, we utilized the `be_awesome()` method with `sammy` and\
    \ also the `swim()` with `stevie`.\n\nNow run the program: `python shark.py`![](image1682.jpg)\
    \ The output shows that we are indeed using two different objects: the `stevie`\
    \ and `sammy` objects both of the `shark` class. Classes allow you to make more\
    \ than a single object.\n\n## Conclusion\n\nThat has been your guide to understanding\
    \ programming with python. You should also note that we have covered a lot but\
    \ not everything in python. This means that in just a few days, you should be\
    \ familiar with everything discussed, and be able to execute the projects discussed\
    \ comfortably. It would be very wise of you to conduct more research on more topics\
    \ to expand your knowledge.\n"
