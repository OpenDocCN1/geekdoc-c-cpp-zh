    the ‘unordered’ nature of the dictionary data type. Therefore, unlike tuples and
    lists, dictionaries do not maintain order or the ability to be indexed. Any time
    you print a dictionary, the order is usually random. However, the key-value pairs
    usually remain intact all the time thus enabling people to access data according
    to their relational meaning.How to Access Elements of the DictionaryDue to the
