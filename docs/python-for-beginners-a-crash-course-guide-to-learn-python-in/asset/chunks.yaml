    让我们能够编写 `Python` 程序的这款软件是开源的。这意味着它在公有领域可用，任何人都可以自由使用它。该软件最大的优势在于，你可以修改它并创建自己的版本来执行特定任务。这实际上是许多人公开拥抱开源概念的主要原因，而使用
    `python` 也不例外。让我们简要讨论一下：


    ## 使用 Python 的机构


    许多组织目前正在使用 `Python` 来完成重大任务。你并不会总是听到它们的用途，因为组织在分享其系统信息或“商业秘密”方面相当谨慎。尽管如此，`Python`
    仍然存在那里，并对组织的运作方式产生着巨大影响，许多常用系统和应用程序都选择了 `Python` 进行开发。它们包括 YouTube、Google 搜索、BitTorrent、NASA、Eve
    Online、iRobot 机器人、Yahoo、Facebook、Maya 以及许多其他。


    以下是 `Python` 的商业用途：


    - **Corel**: 多年来，人们一直使用 `PaintShop Pro` 等产品来截屏、修改图片、绘制新图像并执行许多其他与图形相关的任务。这个流行产品令人惊讶的是，它高度依赖于
    `Python` 脚本。这意味着要在 `PaintShop Pro` 中实现自动化，你需要具备一定的 `Python` 知识。

    - **D-link**: 通过网络连接升级固件可能会非常棘手，这家公司 (`D-link`) 遇到过一种情况，每次升级往往会占用一台机器，他们将其描述为资源的低效利用。此外，由于目标设备存在问题，许多升级需要额外的工作。使用
    `python` 构建一个允许更新移动到设备的多线程应用程序，使得单台机器就可以服务多台设备，而且一种由 `python` 支持的新方法在完成该新固件安装后，将所有重启减少到一次。此外，该公司选择了
    `Python` 而不是 `Java` 等其他语言，因为 `Python` 提供了易用的串口通信代码。

    - **ForecastWatch.com**: 你是否曾经想过某个地方是否有人审查你们的气象预报员的表现？如果你想过，那就不用找了；这家公司正是这样做。该公司将每天产生的数千名气象预报员与真实的气候数据进行比较，以确定他们的准确性。生成的报告推进了天气预报。在特定情况下，比较中使用的软件是一个纯的
    `Python` 程序，因为它包含了在从在线源收集、解析和存储数据时重要的标准库。此外，`python` 增强的多线程特性和能力使其能够每天从约 5,000
    个源收集预报。该代码也比 `PHP` 或 `Java` 等其他语言需要的要小得多。


    许多其他公司、软件和程序都在使用 `Python`，总而言之，我会说科学家、商人、教师、政府甚至宗教组织（至少提一下这些）以某种形式或另一种形式使用 `python`
    编程。如果你不想被时代淘汰，你自己也应该开始学习 `python`。我们将从开始，即下载程序。


