    ## Chapter 2: How to Download and Install Python


    We will now discuss how to download `Python` on your Widows OS and Mac OS X.


    ### Windows OS


    If you are a Windows operating system user, you have to note that the program
    does not arrive prepackaged with windows. As such, you have to install it and
    ensure you install the latest version. A number of years ago, `Python` saw an
    update that caused a split in the program. This split has become a challenge to
    many newcomers. However, you should not worry because I will take you through
    the installation of both versions and talk about some of their important features.


    The first thing you have to do is go to the `python` [download page](https://www.python.org/downloads/windows/)
    . You’ll actually note this division and also see the repository ask whether you
    want the latest `Python 3` (`3.6.1`) release or `Python 2` (`2.7.13`).![](image197.jpg)


    The first question you may ask yourself is which version you should download.
    While newer means better, naturally, being a `Python` programmer means you have
    to make your choice based on your end goal. For instance, `python 2.7` is ideal
    for hobby projects like games (coded in `Python`) in which you want to introduce
    new features. If you want to get some project whose extension ends in `.py`, the
    best version you can use is `Python 2.7`. On the other hand, if your focus is
    learning `Python`, you should highly consider installing both versions, something
    very possible and easy; it also requires minimal risk and very little setup. This
    will also give you an opportunity to work with the latest version and be able
    to run older scripts of the language while testing for backwards compatibility.
    Please visit [wiki.python.org](https://wiki.python.org/Python2orPython3) to get
    more information about the two versions. If you are completely sure you only need
    a specific version, you can go ahead and download one of them. Just note that
    you will see `x86–64` executable installer under the two versions’ main entry.![](image204.jpg)


    The installer will immediately install the suitable `64/32` bit version on your
    PC. You can also read [here](https://www.howtogeek.com/56701/htg-explains-the-difference-between-32-bit-and-64-bit-windows/)
    for more information about the differences between 64-bit and 32-bit.


    #### How to Install Python 2


    The installation of this particular version is simple and the installer even sets
    up the variable that specifies the directories where the program is located in
    your PC known as PATH. You only have to run the installer, select `install for
    all users` then select `next`.![](image211.jpg)


    Leave the directory as `Python27` on the selection screen and then click `next`.![](image216.jpg)


    On the window, scroll down and select `add python.exe to path, and then click
    `will be installed on local drive.` When finished, click next.![](image22.jpg)


    After the part above, you will realize you do not have to make any more decisions.
    Make sure to click through the wizard until you complete the installation. Once
    complete, you can now open up the command prompt in order to confirm the installation,
    and then type the following:


    ```

    python -V

    ```![](image226.jpg)


    Good job so far! If you wanted 2.7 to complete pending project, you can stop here.
    The program is now installed on your device and its path set.


    #### How to Install Python 3


    Installation of the latest version of `Python` requires you complete this step,
    and as I mentioned earlier, you can install this version alongside `2.7` without
    experiencing any problems. Go ahead and run the executable now. On the first screen,
    enable the option labeled `add python 3.6 to PATH` and then click `install now`.![](image33.jpg)


    Once you do that, prepare yourself for an important decision. When you select
