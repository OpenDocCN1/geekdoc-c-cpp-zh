    # Chapter 11: Constructing ‘While’ Loops In Python


    Computer programs come in handy in situations where you want to automate and repeat
    tasks because in so doing, you won’t have to keep them manually. A great way to
    repeat the same tasks is by using loops and in this section of the book, we will
    be looking at the `while` loop in Python. The Boolean condition is the basis on
    which the `while` loop executes the repeated implementation of code. The code
    that contains a `while` block executes, so long as the `while` statement is `true`.
    You can think of the `while` loop as a conditional statement that repeats itself.
    The program executes the code after the `if` statement. However, in the `while`
    loop, the program goes to the start of the `while` statement until it finds the
    condition as `false`. The while loops are conditionally based. This is not the
    same thing when it comes to `for` loops, which usually execute a specific number
    of times. Therefore, you do not need to know the number of times that you should
    repeat the code going in.


    ## While loop


    Here is how we construct while loops in Python:![](1344.jpg) What is being done
    in the program will continue to execute until the condition that is under assessment
    is no longer true. Let us now try to create a little program for executing the
    `while` loop. For this program, we will instruct the user to put in a password.
    As we go through the loop, there are 2 possible outcomes:


    *   If the password is right, the while loop exits

    *   If the password is not right, the while loop continues executing

