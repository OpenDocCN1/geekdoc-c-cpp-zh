    ## 第 2 章：如何下载和安装 Python


    我们现在来讨论如何在 Windows OS 和 Mac OS X 上下载 `Python`。


    ### Windows OS


    如果你是 Windows 操作系统用户，必须注意该程序没有随 Windows 预装。因此，你必须安装它并确保安装了最新版本。几年前，`Python` 经历了一次更新，导致了程序的分裂。这种分裂对许多新手来说是一项挑战。不过，你不必担心，因为我将带你完成两个版本的安装，并介绍它们的一些重要特性。


    你必须做的第一件事是前往 `python` [下载页面](https://www.python.org/downloads/windows/)。你会实际上注意到这种划分，并看到存储库询问你想要最新的
    `Python 3` (`3.6.1`) 版本还是 `Python 2` (`2.7`) 版本。


    你可能会问的第一个问题应该是下载哪一个版本。虽然越新越好，但作为一个 `Python` 程序员，你需要根据你的目标做出选择。例如，`python 2.7`
    对于游戏（用 `Python` 代码）是理想的。如果你想获取某些以 `.py`结尾的项目，最好的版本是 `2.7`。另一方面，如果你的重点是学习 `Python`，你应该高度考虑安装两个版本，这非常可行且简单；它也需要极少的设置。这将让你有机会使用最新版本，同时能够运行旧脚本以向后兼容。请访问
    [wiki.python.org](https://wiki.python.org/Python2orPython3) 获取更多关于两个版本的信息。如果你完全确定只需要特定版本，可以下载其中一个。只需注意你将在主入口看到
    `x86–64` 可执行文件。


    安装程序将立即在你的 PC 上安装相应的 `64/32` 位版本。你也可以[在这里](https://www.howtogeek.com/56701/htg-explains-the-difference-between-32-bit-and-64-bit/)
    阅读更多关于 32 位 64 位的区别。


    #### 如何安装 Python 2


    此版本的安装非常简单，安装程序甚至会设置程序在 PC 中位置的变量。你只需要运行安装程序，选择“为所有用户安装”，然后点击“下一步”。image211jpg


    在选择屏幕上将目录留为 `Python27`，然后点击“下一步”。image216jpg


    在窗口上，向下滚动并选择“将 python.exe 添加到路径”，然后点击“安装在本地驱动器”。image222jpg


    完成上述部分后，你会发现不需要做任何更多决定。确保点击向导直到完成安装。完成后，你现在可以命令提示符来确认安装，然后输入：


    ```

    python -V

    ```

    image226jpg


    到目前为止！如果你只需要 2.7 项目，可以在这里停止。程序现在已安装在你的设备上，路径已设置。


    #### 如何安装 Python 3


    安装最新版本的 `Python` 需要完成此步骤，正如我之前提到的，你可以在不遇到任何问题的情况下与 `2.7` 并安装此版本。在第一个屏幕上启用“将 python
    3.6 添加到 PATH”选项，然后点击“现在安装”。image33jpg


    一旦这样做，准备好做一个重要决定。当你选择“禁用路径限制”选项时，你将移除 `MAX_PATH` 变量限制。这不会改变或扭曲任何内容。实际上，它允许软件使用长路径。目前我们许多程序员在
    Linux 等系统上工作，在那里长度是一个可以忽略的问题；因此，及早开启此项可以以帮助你在 Windows 下工作时解决任何路径相关的问题。如果听我的，直接选择此选项。如果你确定不想限制路径长度，可以点击关闭并在那里完成安装。image39jpg


    如果你只是安装 `python 3`，你也可以使用上面过的命令行技巧 `python v` 来确认其安装正确以及路径变量已设置。


    ### 如何在 Mac OS X 上安装 Python


    Mac OS X 通常带有一个预安装的 `Python` 版本。例如，Mac OS X 10.8 带有 `2.7` 版本。你只需要下载并安装系统中的最新版本即可开始享受该程序最新版本的优点。只需前往
    Python 的[官方网站](https://www.python.org/downloads/windows/) 获取最新的 `Python 3` 版本。记住；你不能依赖
    `Python 3` 来运行 `python 2` 脚本。


    #### 步骤


    当你使用 Mac 访问 Python 下载页面时，它会自动感知你是一个 Mac 用户，随后的选项将反映这一点。步骤非常简单，很快，你将下载一个标记为 `3.x.macosx10.6dmg`
    的文件，它将直接进入你浏览器的下载文件夹。


    当你打开下载的文件时，它会立即在你的桌面上挂载为一个卷。打开文件并等待看到类似下面的窗口。image51jpg


    在继续安装程序之前，花几秒钟时间阅读 `readme.txt` 文件以了解很多，包括你可能不能直接双击标记为 `Python.mpkg` 的安装程序，因为
    Apple 没有对其进行签名。然而，你的 gatekeeper 设置将决定你是否可以双击它，该选项可以在“系统设置 > 隐私 > 通用”下找到。完成后，忽略出现的窗口，并继续下一步。


    如果你的计算机使用 gatekeeper 默认设置，请继续右键点击安装包，并点击“打开方式- 安装.app”选项，如下：image57jpg


    当你完成该操作后，系统将带你通过标准的安装流程，步骤与我们在 Windows 部分涵盖的相似。


