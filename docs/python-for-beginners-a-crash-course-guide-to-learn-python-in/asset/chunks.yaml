    # 需要注意的 Python 环境变量


    这方面的环境变量是位于 Python 之外的系统级设置，你可以通过它们在每次在计算机上运行 Python 时，自定义解释器的行为。在我们运行 Python
    程序之前，了解这些环境变量至关重要。Python 能够识别以下列表中包含的多个环境变量：


    - `PYTHONPATH`: 这个变量的作用类似于 `PATH`，即通知 Python 解释器它应该在何位置查找模块文件，这些文件通常被导入到特定的程序中。它通常包含
    Python 源代码以及 Python 源库目录。

    - `PYTHONSTARTUP`: 它包含一个包含 Python 源代码的初始化文件路径。每当你启动解释器时，都会执行该文件。

    - `PYTHONCASEOK`: 如果是 Windows 用户，将使用此变量要求 Python（在导入语句中）搜索第一个不区分大小写的匹配项。

    - `PYTHONHOME`: 这是另一种模块搜索路径，通常嵌入在 `PYTHONPATH` 目录或 `PYTHONSTARTUP` 目录中，以便切换模块库的过程。


    到这里，你可能已经遇到了一些你不熟悉的术语。为了方便理解这些以及我们在书中后续将要讨论的其他术语，让我们简要讨论一下其中一些术语。


    ## 第 3 章：Python 术语表


    以下是书中遇到的一些常用术语的解释。


    - **增广 (Augment)**: 指计算机执行命令时使用的补充信息。

    - **类 (Class)**: 类是我们用于构建用户定义对象的模板。

    - **继续 (Continue)**: `Continue` 是我们使用的一个函数，用于跳过现有块并返回 `while` 或 `for` 语句。

    - **条件语句 (Conditional statement)**: 条件语句是包含 `if/else` 或 `if` 的语句。

    - **调试 (Debugging)**: 调试是在编程中寻找并消除错误的过程。

    - **def**: `Def` 是一个主要用于定义方法或函数。

    - **迭代 (Iteration)**: 迭代指的是指令或结构按顺序重复若干次或直到满足某些条件的过程。

    - **语法 (Syntax)**: 语法是一组概述了 Python 程序应如何编写和解释的规则。

    - **索引 (Index)**: 索引指的是在有序列表中分配给字符的位置。例如，每个字符持有一个从 0 到长度-1 的索引。

    - **变量 (Variable)**: 变量是计算机用于存储值的预留内存位置。

    - **模块 (Module)**: 指包含任意命名属性的对象，这些属性可以被引用和绑定。

    - **控制台 (Console)**: 指可以在其中一次执行一个命令的终端。

    - **实例化 (Instantiate)**: 生成实例的过程。实例是对象模板类的具体实现。

    - **缩进 (Indentation)**: 指文本远离左侧或右侧的放置，以便将其隔离开。


    ## 第 4 章：与 Python 交互


    在本节中，你将学习如何以多种可用方式使用并与 Python 交互。让我们从使用操作系统的控制台开始介绍 Python 解释器。控制台也被称为命令提示符或终端。这是一种结合鼠标一起与你的
    PC 交互的文本方法。


    ### 如何在 Mac X 上打开控制台

    OS X 的标准控制台是一个名为“terminal”（终端）的程序。要打开它，导航到应用程序，然后双击终端程序。你也可以在屏幕右上角轻松搜索到它。命令行终端是你用来与计算机交互的工具。

    ```

    computer:~

    ```


    ### 如何在 Linux 中打开控制台

    不同的 Linux 发行版（如 mint, Fedora, Ubuntu）可能具有不同的控制台程序，通常称为终端（terminals）。你打开的特定终端以及如何打开取决于你的发行版。让我们以
    Ubuntu 为例；打开 Gnome Terminal——它会显示类似下方的提示符：

    ```

    username@computer:~$

    ```


    ### 如何在 Windows 上打开控制台

    Windows 控制台也称为命令提示符或 `cmd`。你可以通过组合键 `windows+R`（windows 指的是运行按钮）轻松进入它，这会打开运行对话框。只需输入
    `cmd` 并按回车，或直接点击确定。你也可以使用开始菜单搜索它。它看起来应该是：

    ```

    C:\Users\username >

    ```

    Windows 命令提示符没有 OS X 和 Linux 的对应版本强大；因此，你应该考虑直接启动 Python 解释器，或使用 Python 自带的 IDLE
    程序。所有这些都可以开始菜单访问。


    ### 启动并与 Python 交互

    你安装的 Python 程序将我们通常所说的解释器。解释器会获取文本命令并在你编写时运行它们，这对于尝试新事物非常方便。在你的控制台上，只需输入 `python`
    然后按回车，你就应该进入解释器了。

    ```

    >>>

    ```

    这表示你当前处于交互式 Python 解释器会话中，被称为“python shell”（壳）。你需要注意，python shell 不同于普通的命令提示符。此时，你可以尝试输入一些代码让
    Python 执行。尝试以下：

    ```python

    print("Hello world")

    ```

    `help` 是一个非常有用的命令，因为它会进入帮助功能，让你直接从解释器探索 Python 允许的所有操作。要关闭帮助窗口，按 `q` 回到 Python
    提示符。你也可以按 `Ctrl+Z` 退出交互式 shell 并返回控制台或系统 shell。在 OS X 或 Linux 上，按 `Ctrl+D`，或者在
    Windows 键上按回车。现在让我们尝试一下：之前我演示了如何输入命令来完成一些练习。你现在可以尝试一些数学。你认识任何 python 操作吗？


    ### 运行 Python 文件

    当你有大量的 Python 代码需要运行时时，你会想要将其保存到文件中。例如，你可以修改它（修复 bug）而无需反复输入代码。你可以将代码保存到文件，并将文件名传递给
    python 程序执行，而不是启动交互式解释器。让我们尝试一下：使用你最喜欢的代码编辑器在当前目录创建一个标记为 `hello.py` 的文件，然后输入上面的命令。接下来，在
    OS X 或 Linux 上运行 `touch hello.py` 以创建一个空文件。很容易用 Python 运行这个文件：

