    这些值中的每一个要么是整数或布尔值（见下一节）。现在让我们打印“sammy”字典：![](img/image915.jpg)当你查看输出时，你可能会注意到键值对的顺序发生了变化。这是因为字典数据类型具有“无序”的性质。因此，与元组和列表不同，字典不维护顺序，也不具备被索引的能力。每当你打印字典时，顺序通常是随机的。然而，键值对通常始终保持完好，从而使人们能够根据它们的关联意义来访问数据。


    ## 如何访问字典的元素

    由于字典数据结构无序的特性，你不能像使用元组和列表那样通过索引数字来调用它的值。尽管如此，你可以引用相关的键来调用它的值。


    ### 使用键访问数据项

    在你的 Python 程序中，字典非常重要，因为它们提供了键值对来存储数据。如果你想单独提取用户名“Sammy”，可以通过调用 `Sammy[''username'']`
    来。让我们尝试打印它：![](img/image923.jpg) 像数据库一样，字典与列表的不同在于，与通过调用整数来获取特定的索引值相反，你将一个值分配给键，并可以选择调用该键来获取其相关值。当你调用“username”键时，你会得到该特定键的特定值，即“sammy-shark”。留在
    Sammy 字典中的值实际上可以使用相同的格式进行调用：![](img/image929.jpg) 当你利用字典的键值对时，你可以引用键来检索值。


    ### 使用函数访问元素

    除了使用键访问值外，你还可以使用许多内置函数：![](img/image936.jpg) 要返回键，你需要使用 `dict.keys()` 函数。在示例中，那将是变量名，即
    `sammy.keys()`。我们将其传递给 `print()` 函数并观察输出：![](img/image940.jpg) 我们得到的输出将键放在一个 `dict_keys`
    类的可迭代视图对象中。因此，键以列表的形式打印出来。


    你可以使用此函数跨字典进行查询。例如，你可以看到字典数据结构之间共享的公共键：![](img/image946.jpg) “sammy”字典和“jesse”字典都是用户配置字典。它们的配置包含包含不同的键。尽管如此，由于
    Sammy 有一个带有关联粉丝的社交个人资料，而 Jesse 带有关联分数的游戏个人资料，他们共有的两个键都是“online”状态和“username”，你可以在运行这个小程序时获取到它们：![](img/image951.jpg)
    你完全可以对程序进行改进以确保输出对用户更具读性；然而，这说明你可以使用 `dict.keys()` 来检查不同的字典，以便查看它们之间是否有共同点或何不同。你会发现这对于大型字典特别有用。


    你还可以以类似的方式使用 `dict.values()` 函数来查询“sammy”字典中的值，你可以将其构造为 `sammy.values`。让我们尝试打印它们：![](img/image957.jpg)
    `values()` 和 `methods()` 都返回“sammy”字典中存在的未排序的键列表和值，并按特定的顺序包含所有的 `dict_keys` 和
    `dict_values` 视图对象。如果你对所有字典项感兴趣，可以简单使用 `items()` 函数访问它们：![](img/image962.jpg)
    这种返回的“列表”格式通常具有包含 `dict_items` 视图对象的 (key, value) 元组对。通过使用 `for 循环`，你实际上可以迭代返回的格式列表。例如，你可以打印特定字典的每一个键和值，并通过添加一个字符串使其对任何用户更具读性：![](img/image968.jpg)
    如果你检查上方，`for 循环` 实际上迭代了“sammy”字典中的项，然后逐行打印出键和值，并带有让用户更易于理解的信息。你可以利用内置函数从字典的数据结构中访问值、项和键。


    ## 修改字典

    正如我之前提到的，字典是可以修改的变结构（变结构）。在这方面，我们现在查看如何在字典中添加和删除元素。


    ### 添加和更改元素

    你可以使用语法 `dict[key] = value` 在不使用函数的情况下添加键值对。让我们通过向“usernames”字典中添加一个键值对来实际观察它是如何工作的![](img/image978.jpg)
    正如你所见，字典已用键值对‘drew’:‘squidly’进行了更新。这对组合可以位于字典的任何位置，因为字典通常是无序的。如果你在程序文件的后续部分使用字典
    `usernames`，它将包含这个额外的键值对。此外，你可以使用此语法来修改分配给键的值。在这种情况下，将引用一个已存在的键并向其传递一个不同的值。


    我们将考虑一个字典 `drew`，它是给定网络上的用户之一。假设今天，该用户的粉丝数量增加了。我们必须更新传递给键（followers）的整数。我们将使用
    `print()` 函数来确认字典确实被修改了![](img/image985.jpg) 在输出中，我们可以看到粉丝数量从整数值 305 跳到了 342。我们可以利用此方法……（注：此处原文在此处中断，翻译已按原文内容结束）

