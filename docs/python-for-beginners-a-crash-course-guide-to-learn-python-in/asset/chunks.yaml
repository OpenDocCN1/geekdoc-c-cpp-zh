    - `and` ought to have at least a single `False` expression evaluating to False

    - `or` ought to have the two expressions evaluating to False

    - `not` ought to have its inner expression being True for the new expression to
    evaluate to False


    If the above results are not very clear to you, we will shortly go over some truth
    tables that will bring you up to speed. You can also use `and`, `not` and `or`
    in writing your compound statements: ![](image1111.jpg)


    Now, first, focus on the innermost expression: `(0.8 < 3.1)` or `(0.1 ==0.1)`.
    This particular expression evaluates to `True` because the two mathematical statements
    are True. We can now take the returned `True` value and merge it with the next
    inner expression which is `(-0.2>1.4)` and `(true)`. This example in particular
    returns false because the Mathematical statement `-0.2 > 1.4` is False and obviously,
    `(False)` and `(True)` returns False. We finally have the outer expression which
    is `not(False)`, that evaluates to True, so the last returned value is: (if we
    print the statement) `True`. The logical operators `and`, `not`, `and`, `or` thus
    evaluate expressions and return the Boolean values.


    ## Truth Tables


    There is definitely a ton of stuff to learn about the branch of mathematics known
    as logic. However, we can learn some of it selectively to develop our algorithmic
    thinking for programming. Look at the truth tables below for the comparison operator
    `==`, and each one of the logic operators `and`, `not` and `or`. While it is possible
    not be able to reason them out immediately, it will prove helpful to work to memorize
    them so that they quicken your decision-making process.


    The truth table for `==`![](image1123.jpg)

    The truth table for `and`![](image1128.jpg)

    The truth table for `or`![](image1133.jpg)

    The truth table for `not`![](image1137.jpg)


    Truth tables are logic based mathematical tables- common as they are, they tend
    to be useful to memorize or always keep in mind when creating instructions or
    algorithms in any form of computer programming.


    ## Boolean Operators for ‘Flow Control’


    To control the stream and program outcomes in form of flow control statements,
    you can use a condition, and then a clause. A condition essentially evaluates
    down to a Boolean value of `True` or `False`, and presents a point where the program
    makes a decision i.e. a condition informs you when something evaluates to False
    or True.


    On the other hand, a clause is a block of code following the condition and dictates
    the program outcome. That is, it forms the ‘do this’ part of the whole construction-
    ‘if y is True, then do this.’


    Look at the block of code below that describes comparison operators working together
    with conditional statements to control python program flow:![](image1146.jpg)


    This program evaluates whether every student’s grade is failing or passing. When
    a student (for instance), gets a grade of 83, the first statement evaluates to
    True, and the print statement of ‘passing grade’ is triggered. In case a student
    registers grade 59, the initial statement evaluates to False and thus, the program
    goes ahead to implement the print statement attached to the `else` expression:
    ‘failing grade’.


    Since each Python object can be evaluated to False or True, expert python programmers
    recommend against comparing values to False or True since it is less readable
    and tends to return an unanticipated Boolean. This means you should try to avoid
    using something like `sammy== True` in your programs and alternatively, make a
    comparison of `sammy` to some other non-Boolean value that returns a Boolean.
    Boolean operators usually present conditions we can use to decide the ultimate
    program outcome via flow control statements. With all that covered, I know you
    are ready to make some decisions!


    ## Conditional Statements: If and Else Statements


    Every programming language typically has conditional statements. When you have
    conditional statements, you have code that runs sometimes (not all the time),
    even though it depends on the conditions of the program at that particular time
    . When you execute every program statement fully, moving from the top to bottom
    with every line implemented in an order, you are not really instructing the program
    to actually evaluate particular conditions. We can use conditional statements
    to help programs to actually determine whether specific conditions are really
    being met.


    To gain a better understanding of conditional statements, look at the following
    examples where they (conditional statements) would be used:


    - If the student gets over 70% on his test, report that his grade passed; if not,
    report that his grade fails.

    - If Jane has money in her account, calculate interest; if she does not, charge
    the penalty fee.

    - If he buys 8 mangoes or more, calculate a 5% discount; if he buys less, then
    don’t.

