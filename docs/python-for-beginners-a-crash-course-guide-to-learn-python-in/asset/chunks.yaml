    Python 是一种高级编程语言。这意味着你为了构建程序而编写的代码比通常用于控制机器的机器更接近人类语言。这一方面让你（程序员）的工作变得简单得多，另一方面，同时也意味着如果其他人想要使用这些代码，他/她也更容易理解。随后，这种类人类语言的（高级）代码会通过一个名为
    `interpreter`（解释器）的软件被转换为机器码，即机器可以听懂的语言。


    ## 2. 它是开源的


