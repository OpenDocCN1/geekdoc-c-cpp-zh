    by an index number as you can with tuples and lists. Nonetheless, you can reference
    the related keys to call its values .-Accessing Data Items Using KeysIn your python
    program, dictionaries are very important because they provide key-value pairs
    to store data. If you want to seclude the username ‘Sammy’, you can do so by calling
    Sammy[‘username’]. Let us try printing that out:![](image923.jpg)Like databases,
    dictionaries are dissimilar to lists in that as opposed to calling an integer
