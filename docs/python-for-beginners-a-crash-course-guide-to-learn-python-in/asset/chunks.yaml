    ## 引言

    感谢下载本书。书中包含了许多实用的信息，将帮助你开启成为 Python 编程专家之旅。


    毫无疑问，代码是未来的语言。想看，随着对计算机依赖的日益增长，最关键的事情之一就是学习如何用计算机能理解的语言与其交流。无论你是想学习代码以成为程序员、Web
    开发人员或图形设计师，还是想学习代码以开发自己的应用程序和其他系统，你唯一需要做的就是从某处开始。


    ## 第 1 章：Python：全面背景

    在我们讨论 Python 编程（特别是 Python 是什么）之前，让我简要谈一下编程。成为一个优秀的程序员并不简单意味着掌握大量的编程语言或如何编写快速程序。相反，它是关于：


    *   抽象地理解问题并将其转换为代码。

    *   寻找解决例如科学问题的新方法，并知道使用何种工具。

    *   在程序运行异常时能够修复。

    *   编写足够快的程序，而不是最快的程序。

    *   编写他人能够在短时间内理解的代码。


    注意最后一点：可复性研究和开放科学正成为某些研究领域的常态。这意味着其他人可能需要阅读你的代码，准确理解你正在做什么，并能够重建代码以便他们运行。因此，在本书结束时，我们不仅对你解决方案的正确性感兴趣，还会查看你创建的程序是如何解决问题的。这意味着你应该在编写代码时，假设会有其他人阅读它。让我们回到理解未来的编程语言
    Python。


    ### 什么是 Python？

    用最简单的话来说，Python 是一种通用的、多范式的解释型编程语言，它让程序员能够使用各种编程风格创建复杂或简单的程序，更快获取结果，并以类似于人类语言的方式编写代码。


    Python 经常用于创建算法，以排序和分析全球企业和组织收集的数据块。上述解释引出了关于 Python 的一些有趣的点：


    1. 它是一种高级语言语言


    '
