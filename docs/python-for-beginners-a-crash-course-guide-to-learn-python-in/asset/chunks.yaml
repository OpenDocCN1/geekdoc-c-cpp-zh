    are not the same: one begins with the upper case S while the other one begins
    with a lower-case s. However, if you added another variable assigned to the value
    of ‘Sammy’, they will then evaluate to equal.![](image1067.jpg)You can also use
    the other comparison operators that include > and < to compare two strings. The
    program compares the strings using the ASCII values of the characters lexicographically.You
    can also evaluate Boolean values with the comparison operators:![](image1073.jpg)The
