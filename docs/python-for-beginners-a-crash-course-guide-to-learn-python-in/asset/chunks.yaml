    - `and` 至少应该有一个求值为 `False` 的表达式

    - `or` 应该有两个表达式都求值为 `False`

    - `not` 只有在其内部表达式为 `True` 时，新表达式的值才为 `False`


    如果上述结果对你来说还不清晰，我们将很快通过一些真值表来帮助你快速上手。你也可以在编写复合语句时使用 `and`、`not` 和 `or`：![](img/image1111.jpg)


    现在，首先关注最内层的表达式：`(0.8 < 3.1)` 或 `(0.1 ==0.1)`。这个特定的表达式求值为 `True`，因为这两个数学语句都是 `True`
    的。现在我们可以获取返回的 `True` 值，并将其与下一个内层表达式 `(-0.2>1.4)` 和 `(true)` 合并。这个例子之所以特别返回 `false`，是因为数学语句
    `-0.2 > 1.4` 是 `False`，显然，`(False)` 和 `(True)` 的结果是 `False`。我们最终得到了外层表达式 `not(False)`，它的求值为
    `True`，所以最后一个返回的值是（如果我们打印该语句）：`True`。逻辑运算符 `and`、`not`、`and`、`or` 因此此评估表达式并返回布尔值。


    ## 真值表


    关于逻辑这一数学分支，绝对有很多需要学习的内容。然而，我们可以选择性地学习，以开发我们编程的算法思维。查看下方比较运算符 `==` 以及每个逻辑运算符 `and`、`not`
    和 `or` 的真值表。虽然你可能无法立即推导出它们，但努力记忆它们将证明是有用的，这样可以加快你的决策过程。


    `==` 的真值表![](img/image1123.jpg)

    `and` 的真值表![](img/image1128.jpg)

    `or` 的真值表![](img/image1133.jpg)

    `not` 的真值表![](img/image1137.jpg)


    真值表是基于逻辑的数学表格——它们虽然常见，但在任何形式的计算机编程中创建指令或算法时，记住或牢牢记在心中往往非常有用。


    ## 用于“流程控制”的布尔运算符


    为了以流程控制语句的形式控制流和程序结果，你可以使用一个条件，然后接一个句。条件本质上被求值为 `True` 或 `False` 的布尔值，并提供程序做出决策点，即：条件告知你某值何值为
    `False` 或 `True`。


    另一方面，句是跟随在条件后面的代码块，并决定程序的输出。也就是说，它构成了整个结构中的“执行此操作”部分——“如果 y 为 True，则执行此操作”。


    查看下面的代码块，它描述了比较运算符如何配合条件语句工作以控制 Python 程序流：![](img/image1146.jpg)


    此程序评估每个学生的成绩是及格还是不及格。当一个学生（例如）得到 83 分时，第一个语句求值为 `True`，并触发“及格”的打印语句。如果学生记录的成绩是
    59，初始语句求值为 `False`，因此程序将执行附加在 `else` 表达式上的打印语句：“不及格”。


    由于每个 Python 对象都可以被求值为 `False` 或 `True`，专家 Python 程序员建议不要将值与 `False` 或 `True` 进行比较，因为这样可读性较低并且往往返回意料之外的布尔值。这意味着你应该尽量避免在程序中使用类似
    `sammy== True` 的代码，而是将 `sammy` 与其他非布尔值进行比较，以返回一个布尔值。布尔运算符通常提供了我们可以通过流程控制语句决定最终程序结果的条件。涵盖了这些内容，我知道你已经准备好做出决策了！


    ## 条件语句：If 和 Else 语句


    每种编程语言通常都有条件语句。当你有条件语句时，你就拥有有时运行的代码（而不是总是运行），尽管这取决于程序在特定时刻的条件。当你完全执行每个程序语句，从上到下顺序实现每一行时，你并没有真正指示程序去评估特定的条件。我们可以使用条件语句帮助程序实际判断特定条件是否真的被满足。


    为了更好地理解条件语句，请查看以下使用（条件语句）的示例：


    - 如果学生考试超过 70%，报告其成绩及格；否则，报告其成绩不及格。

    - 如果 Jane 的账户里有钱，计算利息；如果没有，则收取罚金。

    - 如果他买了 8 个或更多芒果，计算 5% 的折扣；如果买得少，则不计算。


    '
