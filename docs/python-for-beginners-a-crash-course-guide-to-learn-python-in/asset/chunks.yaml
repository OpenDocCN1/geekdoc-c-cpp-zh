    Python is a high-level language. This means the code you type to build a program
    is more like a human language than the typical code created to control machines.
    This, for one, makes things a lot simpler for you, the programmer, and means that
    someone else is better placed to understand the code if he/she wants to use it
    him/herself. The human-like (high-level) code then goes through a software called
    an `interpreter` that converts it into machine code, a language that machines
    can understand.


