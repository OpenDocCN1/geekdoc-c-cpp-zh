    8: Native Python DatatypesTo have a better understanding of all we have discussed
    so far (and what is coming), I will introduce a new topic that will go into more
    detail about specific basic components of python. Besides that, we will also discuss
    a lot more to make sure you can handle larger projects with the program.1: Python
    StringsWe are now going to discuss how to make, format, change, and delete python
    strings. You will also learn about the various string operations and functions.A
    string is a sequence of characters. A character is a symbol; for instance, we
    have 26 characters in the English language. Nonetheless, computers do not deal
    with characters; they deal with binary or numbers. Even though we usually see
    characters on the screen, internally, they are stored and used as a mixture of
    zeros (0’s) and ones (1’s).The conversion of characters to numbers is also known
    as encoding and some of the most popular encoding used are Unicode and ASCII (decoding
    is the reverse process). In Python, the sequence of Unicode character is known
    as string. At its introduction, encoding was meant to include every character
    in all languages and bring some uniformity in encoding. To learn more about encoding,
    [read here](http://docs.python.org/3.3/howto/unicode.html) . That aside, let’s
    discuss how to make strings .How to Make StringsYou can create strings by enclosing
    characters within single quotes or double quotes. You can even use triple quotes
    in Python but generally to represent docstrings and multiline strings.![](image649.jpg)Accessing
    Characters in a StringYou can access particular characters using indexing and
    an array of characters through slicing. Index starts from 0 and when you try to
    access a character out of index range, it causes an ‘IndexError’. This index must
    be an integer. We cannot use float or other forms as it will result into TypeError.In
    python, negative indexing is used for its sequences.The -1 index refers to the
    final item, the second last item is represented by -2, and so on. When you use
    the slicing operator (colon), you can be able to access a range of items.![](image657.jpg)If
    you try accessing index outside the range, or use a decimal number, you get errors.![](image662.jpg)You
    can best visualize slicing by considering the index to remain between the elements
    as illustrated below. If you want to access a range, you will require the index
    that will help with slicing the portion from the string.![Element Slicing in Python](image667.jpg)Changing
    and Deleting a StringStrings are largely immutable; this means you cannot change
    the string elements once you have assigned it. You can simply reassign various
    strings to the same name.![](image673.jpg)You cannot remove or delete characters
    from a string unless you are deleting the entire string itself; this is possible
    by using the ‘del’ keyword.![](image678.jpg)Next, we will discuss string operators.The
    String OperatorsWe have numerous operations you can perform with string; this
    makes it one of the most used python datatypes. For instance, you can do the following:1-Concatenation
    of Multiple StringsA concatenation is the joining of two or more strings into
    one string. In Python, we use the + operator to achieve this. When you write two
    string literals together, it also concatenates them. We use the * operator to
    repeat the strings a particular number of times.![](image687.jpg)When you write
    two string literals, this also concatenates them just like the + operator. You
    can also use parentheses if you want to proceed to concatenate strings in separate
    lines.![](image692.jpg)2-Iterating Through StringYou can also use ‘for loop’ to
    iterate through a string. For instance, you can count the sum of ‘1’ in a string.![](image698.jpg)3-The
    String Membership TestYou can test if a substring occurs inside a string or not
    by using the keyword ‘in’. Here is an example:![](image704.jpg)4- The Built-In
    Functions to Use with PythonMany built-in functions that work with sequence also
    work with strings. Some of the most popular functions are len () and enumerate
    (). The enumerate () function takes back an enumerate object. It has the index
    and value of every item in the string as pairs, something that can be very useful
    for iteration.Likewise, len () takes back the number of characters (length) of
    the string.![](image710.jpg)Python String FormattingHere is how python strong
    formatting works:Escape SequenceSay you want to print some text such as ‘he said,
    what’s there’, you cannot use single or double quotes. Since ‘the’ text itself
    has both double and single quotes, it will definitely result into ‘SyntaxError’.![](image718.jpg)To
    dodge this problem, you can simply use triple quotes, or instead, use escape sequences.
    An escape sequence begins with a backlash and it is interpreted differently. If
    you use single quotes to signify a string, all the single quotes within the text
    have to be escaped. This is similar to the case with double quotes. This is how
    you can do it to represent the text above.![](image723.jpg)The following is a
    list of the python-supported escape sequence:![](image727.jpg)Look at the following
    examples:![](image732.jpg)Ignoring the Escape Sequence with Raw StringAs you will
    soon realize, there are times when you will just wish to ignore the escape sequences
    within a string. To do this, you can place R or r before the string. This implies
    that this is actually a raw string and all escape sequences within are ignored.![](image737.jpg)Formatting
    Strings Using the Format () MethodThe format () method that is available with
    the string object is quite versatile and strong in string formatting. Format strings
    has curly braces {} as replacement fields or placeholders that gets replaced.
    You can use keyword arguments or positional arguments (explained later) to specify
    the order.This ‘format ()’ method can have discretionary format specifications,
    and the colon separates them from the field name. For instance, we can right-justify,
    left-justify or center ^ a string in the set space. We also format integers as
    hexadecimal, binary and so on, and floats are presentable in the exponent format
    or rounded.You can use numerous formatting methods. [Visit Pyformat.info](https://pyformat.info/)
    for all the available string formatting with the format () method.![](image745.jpg)The
    Old-Style FormattingYou can actually format strings such as the old sprintf ()
    that is popularly used in the C programming language. To achieve this, we use
    the % operator as shown below:![](image751.jpg)The Common Python String MethodsThere
    are various methods available with the string object; the format () method we
    talked about is one of them.  Some of the most popular methods used include upper
    (), lower (), replace (), join (), split () etc. You can find a complete list
    of all the Python’s built in methods to work with strings [here](https://www.tutorialspoint.com/python/python_strings.htm)
    .![](image757.jpg)From sequences of characters, let us now try looking at other
    data structures–all the different collections you have on your computer–the assortment
    of your files, browser bookmarks, your song playlists, emails, the video collections
    you can access on a streaming service and many more.Let us talk about lists.2:
    Python ListsIn this section, you will learn all about lists, how they are made,
    the process of adding or removing elements from them, and so forth.Python offers
    many compound datatypes usually known as sequences. Apart from being one of the
    most frequently used datatype in Python, ‘lists’ is very versatile.There are a
    number of ways to describe lists :The usual description of a list type is “the
    container that holds other objects in a particular order.” It executes the sequence
    protocol and lets you add or take out objects from the sequence.Another description
    of the list is as a data structure that is a changeable, or mutable, organized
    sequence of elements. Every element or value within a list is referred to as an
    item. Just as strings are known as characters in between quotes, lists are characterized
    by values in between square brackets [ ].When you want to work with many related
    values in Python, lists are very handy to use. They will allow you to keep data
    that belongs together together, condense code, and perform similar methods and
    operations on different values all at once.When you are thinking about lists in
    python, and other data structures that are essentially types of collections, you
    can try considering all the different collections you have on your computer, the
    assortment of your files, browser bookmarks, your song playlists, emails, the
    video collections you can access on a streaming service, and many more.Creating
    a ListIn Python, you can create a list by placing the elements (or all the items)
    within a square bracket [], and separating with commas. It can contain any number
    of items that may be of different types (float, integer, string, etc.).![](image772.jpg)Additionally,
    a list can contain another list as an item in what we call a nested list.![](image777.jpg)Accessing
    Elements from a ListTo access list elements, you can use a number of ways:List
    indexYou can use the index operator [] to get to an item in a list. Index begins
    from 0, and thus, a list of five items will contain an index from 0 to 4\. When
    you try to access an element other than this, it raises an IndexError. The index
    should be an integer and we cannot use float or other types because the results
    will be a TypeError.Nested list are accessed via nested indexing![](image787.jpg)Negative
    IndexingPython programming supports negative indexing within its different sequences.
    As I mentioned while discussing string, the -1 index is used in reference to the
    final item, -2 is used in reference to second last one etc.![](image793.jpg)Slicing
    Lists in PythonWe can access numerous items in a list with the colon/slicing operator.![](image799.jpg)You
    can best visualize slicing by considering the index supposed to go between the
    elements as displayed below. Thus, if you want to access a range, you will need
    two indexes that will slice that particular portion from the list.![Element Slicing
    from a list in Python](image667.jpg)Changing or adding elements to a listI mentioned
    in the beginning that lists are mutable; this means unlike [tuple](https://www.tutorialspoint.com/python/python_tuples.htm)
    or strings, their elements can be changed. When changing an item or multiple items,
    we can use the assignment operator = to do that.![](image808.jpg)You can also
    use append () method to add one item to a list or use the extend () method to
    add multiple items.![](image813.jpg)You can also combine two lists using the +
    operator. This is known as concatenation. The * operator on the other hand repeats
    a list for the set number of times.![](image818.jpg)Furthermore, you can insert
    a single item at a desired place by using the insert () method or just insert
    many items by squeezing it into an empty list slice.![](image823.jpg)How to Remove
    or Delete List ElementsYou can delete a single or multiple items from a list by
    using the ‘del’ keyword. It can actually delete the list completely.![](image829.jpg)You
    can also use remove () to remove the given item or pop () method to get rid of
    an item at the given index.The pop () method removes and returns the final item
    if index is not given. This in particular helps us implement lists just like stacks
    (first-in, last-out structure). To empty a list, you can also use the clear ()
    method.![](image835.jpg)Lastly, you can also delete list items by allocating an
    empty list to a slice of elements.![](image840.jpg)The Python List MethodsIn the
    following table are the methods available with the Python programming list object.
    You will access them as list.method (). Note that we have already used some of
    these methods above.![](image846.jpg)Look at some examples of python list methods:![](image850.jpg)Creating
    Lists Elegantly Through List ComprehensionOne very elegant and precise way of
    creating new lists from existing python lists is though list comprehension.List
    comprehension comprises an expression that is followed by the ‘for statement’
    within square brackets. The following is an example to make a list with every
    item assuming an increasing power of 2.![](image857.jpg)This code is equivalent
    to![](image861.jpg)Optionally, the list comprehension can have more ‘for’ or ‘if’
    statements. An optional ‘if’ statement will filter out items for the fresh list.
    Examine these examples:![](image866.jpg)Well, ‘lists’ just contains values. At
