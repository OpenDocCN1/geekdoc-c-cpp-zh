    When you evaluate conditions and assign code to run based on whether those conditions
    are met or not, you are essentially writing conditional code. In this section,
    I will take you through all you need to know about writing conditional statements
    in Python.


    ### If Statement

    Let us begin with the `if` statement that will determine whether a statement is
    false or true, and run code only when the statement is true. Open a file in a
    plain text editor and write this code:


    ![](image1167.jpg)


    With the above code, you have the variable `grade` and will give it an integer
    value of 70; you will then use the `if` statement to evaluate whether the variable
    `grade` is more or equal (`>=`) to 65 or not. If it fails to meet this condition,
    you are instructing the program to print the string ‘passing grade’.


    Now save the program with the name `grade.py` then use the command `python grade.py`
    to run it. Note that in our case, the grade of 70 does not meet the condition
    of being more than or equal to 65, and so, when you run the program, you will
    get the input below:


    ![](image1174.jpg)


    We will not try to change the result of this program by altering the value of
    the variable `grade` to 60.


    ![](image1179.jpg)


    When you save and run the code, you will not receive any output because the condition
    was not met and you did not instruct the program to implement another statement.
    Let us look at another example: We will calculate whether or not a bank balance
    is less than 0. We will create a file named `account.py` and write the program
    below:


    ![](image1186.jpg)


    When you run the program attached with `python account.py`, you will get the following
    output:


    ![](image1191.jpg)


    In the program you initialized, the `balance` variable with the value `-5` is
    below 0. The balance did meet the `if` statement condition (`balance<0`) and thus,
    when you save and run the code, you will get the string output. Again, if you
    alter the balance to 0 or some positive number, you will not get any output.


    ### Else Statement

    Even as an `if` statement evaluates to false, it is possible that you will want
    the program to do something. In the grade example, you will want an output whether
    the grade is failing or passing. To do this, let us add an `else` statement to
    the above grade condition, which we construct this way:


    ![](image1198.jpg)


    The `grade` variable above contains a value of 60- thus, the `if` statement will
    evaluate as false- and the program will not print the ‘passing grade’. The subsequent
    `else` statement will tell the program to do something anyway. When you save and
    run, you will get the following output:


    ![](image1204.jpg)


    By rewriting the program to give out the grade and a value of 65 or more, you
    will instead get the output ‘passing grade.’ Rewrite the code as shown below to
    add an `else` statement to the example on bank account:


    ![](image1210.jpg)


    Here, we changed the value of the `balance` variable to a positive number in order
    for the `else` statement to print. You can rewrite the value to a negative number
    to get the first `if` statement to print.


    When you combine the `if` and `else` statements, you will be constructing a conditional
    statement with two parts that will instruct your computer to implement a particular
    code whether the `if` condition is met or not.


    ### The else if statement

    We have so far learnt a Boolean option for various conditional statements as each
    statement evaluates to either false or true. In most cases, you will want your
    program to evaluate more than two possible outcomes. For this, we will proceed
    to use the else if statement, which in Python, is written as `elif`. The else
    if or `elif` statement resembles the `if` statement and evaluates another condition.
    In our program on bank account, we may want to have some three distinct outputs
    for three situations that include the following:


    - The balance is less than 0

    - The balance equals to 0

    - The balance is more than 0


    The `elif` statement goes between the `if` statement and the `else` statement
    as is shown below:


    ![](image1226.jpg)


    Now we have three possible outputs you can receive once you run the program:


    - If the `balance` variable is equal to 0, you will then get the output using
    the `elif` statement; this means the balance is 0 and you should add more money
    to your account.

    - If the `balance` variable is set to a positive number, you will get the output
    from the else statement; this means that your balance is either 0 or more.

    - If the `balance` variable is fixed to a number that is negative, the output
    will have to be the string from the `if` statement; this means that the balance
    is less than 0 and therefore, you should add funds now or face a penalty.


    What about an instance where you want to have over 3 options? This is possible
    by simply writing more than a single `elif` statement into your code. In the `grade.py`
    program, you can rewrite the code so that you will have a few letter grades agreeing
    with the ranges of numerical grades.


    - 90 or more is equal to grade A

    - From 80 to 89 is equal to grade B

    - From 70 to 79 is equal to grade C

    - From 65 to 69 is equal to grade D

    - 64 or below is equal to grade F


    To run this code, we will require a single `if` statement, 3 `elif` statements,
    as well an else statement to help you handle all the failing cases. We will now
    rewrite the code from the above example to have strings printing out every letter
    grade. We can also keep the `else` statement the same.


    ![](image1246.jpg)


    The `elif` statements evaluate in order and thus, you can keep your statements
    basic. The program is completing the following steps:


    - If the grade is more than 90, the program will print grade A; if it is less
    than 90, the program continues to the following statement…

    - If the grade is more than, or equivalent to 80, the program will print grade
    B; if it is 79 or less, the program continues to the following statement…

    - If the grade is more than, or equivalent to 70, the program will print grade
    C; if it is 69 or less, the program continues to the following statement…

    - If the grade is more than or equivalent to 65, the program will print grade
    D; if it is 64 or less, the program continues to the following statement…

    - The program prints ‘failing grade’ when all the conditions above are not met.

    '
