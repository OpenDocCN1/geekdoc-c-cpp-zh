  \n---\n\n### 多态语法\n\n`virtual method(){ }`\n\n多态意味着基类中的方法可以被派生类重写。\n\n例如\n\n```cpp\n\
  #include <iostream>\n#include <string>\nusing namespace std;\n\nclass Animal {\n\
  public:\n    virtual void yell() { }\n};\n\nclass Cat : public Animal {\npublic:\n\
  \    void yell() override {\n};\n```\n\n\n\n\n\n# `puts()` 语法：\n\n`puts(\"string\"\
