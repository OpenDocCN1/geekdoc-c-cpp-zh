  | `[]` | 空捕获列表，无捕获。 |\n| `[x]` | 按值/拷贝捕获 `x`。 |\n| `[&y]` | 按引用捕获 `y`。 |\n| `[x,\
  \ &y]` | 按值/拷贝捕获 `x` 并按引用捕获 `y`。 |\n| `[=]` | 按值/拷贝捕获所有使用的变量。 |\n| `[&]` | 按引用捕获所有使用的变量。\
  \ |\n| `[&, x, y]` | 按引用捕获所有使用的变量，但 `x` 和 `y` 按值/拷贝捕获。 |\n| `[=, &x, &y]` | 按值/拷贝捕获所有使用的变量，但\
  \ `x` 和 `y` 按引用捕获。 |\n| `[this]` | 按引用捕获当前对象 |\n| `[*this]` | 按值/拷贝捕获当前对象 |\n\n\
  ## 预处理器宏列表\n\n| 宏 | 返回 |\n| :--- | :--- |\n| `__LINE__` | 表示正在编译的源文件中当前行行的整数值。 |\n\
  | `__FILE__` | 包含正在编译的源文件假设名称的字面量。 |\n| `__DATE__` | 格式为 \"mm dd yyyy\" 的字面量，包含编译过程开始的日期。\
  \ |\n| `__TIME__` | 格式为 \"hh:mm:ss\" 的字面量，包含编译过程开始的时间。 |\n| `__cplusplus` | 整数值。所有\
  \ C++ 编译器都定义了此常量。其值取决于版本。 |\n| `__STDC_HOSTED__` | 如果实现是托管实现（可用所有标准头文件）则为 1，否则为\
  \ 0。 |\n| `__STDC__` | 实现定义。 |\n| `__STDC_VERSION__` | 实现定义。 |\n| `__STDC_MB_MIGHT_NEQ_WC__`\
  \ | 如果字节编码在字符字面量中可能赋予字符不同的值 |\n| `__STDC_ISO_10646__` | 格式为 yyyymmL 的值，指定 Unicode\
  \ 标准日期以及 `wchar_t` 字符的编码 |\n| `__STDCPP_STRICT_POINTER_SAFETY__` | 如果实现具有严格指针安全机制则为\
  \ 1 |\n| `__STDCPP_THREADS__` | 如果实现支持线程则为 1 |\n\n"
