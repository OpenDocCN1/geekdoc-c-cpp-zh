  \    return 0;\n}\n```\n// 输出:\nsqrt(f): 10.0439\n\n---\n\n## `srand()` 语法\n\n`srand(\
  \ (unsigned)time( NULL ) );`  // 设置种子\n`num= rand();` // 生成随机数\n\ne.g.\n\n```cpp\n\
  #include <iostream>\n#include <ctime>\n#include <cstdlib>\nusing namespace std;\n\
  int main (){\n    int num;\n    srand( (unsigned)time( NULL ) );  // 设置种子\n    num=\
  \ rand();   // 生成随机数\n    cout <<\"Random number is \" << num << endl;\n    return\
  \ 0;\n}\n```\n// 输出:   Random number is 900729318\n\n---\n\n## 静态函数语法\n\n`static\
  \ type function( );`     // 声明静态函数\n`className :: function( );` // 类引用函数\n\n// 静态函数可以通过类或任何对象引用。非静态函数仅通过对象引用，而不通过类引用。\n\
  \ne.g.\n\n```cpp\nclass Account {\npublic:\n    static int myfunction( int n );\
  \   // 声明静态方法\n};\n\nint Account :: myfunction(int n){  // 类的方法\n    return n;\n\
  }\n\nint main() {\n    cout << Account :: myfunction( 200 ) << endl; // 类直接引用方法\n\
  \    return 0;\n}\n```\n// 输出:   200\n\n---\n\n## 静态全局变量语法\n\n`static type variable;`\n\
  \n// 如果 \"static type variable;\" 定义在函数外部，它将是一个静态全局变量。\n// \"static type variable;\"\
  \ 声明了一个只能在当前文件中使用的变量。\n\ne.g.\n\n(file1.cpp)\n```cpp\n#include <iostream>\nusing\
  \ namespace std;\nstatic int c;  // 静态全局变量\nint main( ){\n    int a = 30, b = 40;\n\
  \    c = a + b;   // \" \"c\" 是静态全局变量\n    cout << c << endl;\n    return 0;\n}\n\
  ```\n\n(file2.cpp)\n```cpp\n#include <iostream>\nusing namespace std;\nint a = 100,\
  \ b = 200;\nint c = a + b;  // \"c\" 不是静态全局变量\n```\n// 输出:   70\n\n---\n\n## 静态局部变量语法\n\
  \n`static type variable;`\n\n// 如果 \"static type variable;\" 定义在函数内部，它将是一个静态局部变量。\n\
  // 静态局部变量在每次函数调用保留变量的值\n\ne.g.\n\n```cpp\n#include<iostream>\nusing namespace std;\n\
  void myFunction();\n\nint main( ){\n    myFunction( );\n    myFunction( );\n   \
  \ myFunction( );\n    return 0;\n}\n\nvoid myFunction(){\n}\n```\n\n\n\n\n\n```cpp\n\
  static int num = 1;    // 定义一个静态局部变量\n\nnum = num + 2;\n\ncout<< num << endl;\n\n\
  }\n\n// 输出:     3    5    7\n```\n\n## 静态变量语法\n\n`static type variable;`      //\
  \ 声明一个静态变量\n\n`className :: variable;`     // 类引用一个变量\n\n// 静态变量可以通过类或任何对象引用。非静态变量仅通过对象引用，不能通过类引用。\n\
  \ne.g.\n\n```cpp\nclass Account {\npublic:\nstatic int num;   // 声明静态变量 num\n};\n\
  \nint Account :: num = 100;  \n\nint main() {\ncout << Account :: num << endl; \
  \ // 类引用一个变量\nreturn 0;\n}\n```\n// 输出:  100\n\n---\n\n## std::chrono::milliseconds()\
  \ 语法\n\n`std::chrono::milliseconds(number)`\n\n// 设置毫秒级持续时间\n\ne.g.\n\n```cpp\n\
  #include <iostream>\n#include <chrono>\n#include <thread>\n\nint main(){\nstd::this_thread::sleep_for(std::chrono::milliseconds(5000));\
  \            \nstd::cout << \"After 5000 milliseconds, you can see me!\" << std::endl;\n\
  }\n```\n// 输出:  After 5000 milliseconds, you can see me!\n\n---\n\n## std::chrono::seconds()\
