  \ ( );\nreturn 0;\n}\n```\n// 输出：`C++ is a very good language.`\n\n---\n\n# `read()`\
  \ 语法：\n\n`cin.read(stringArray, stringLength);`\n\n// `stringArray` 将字符串定义数组。\n\
  // `stringLength` 定义字符串的最大尺寸。\n\n例如：\n\n```cpp\nint main(){\ncout<< \"Please input\
  \ a sentence:\"<< endl;\nchar myString[ 80];  // 字符串可以包含 80 个字符\ncin.read ( myString\
  \ , 10 );     // 最大输入 10 个字符\ncout << \"What you inputted is: \" << myString <<\
  \ endl;\nreturn 0;\n}\n```\n// 假设我们输入了一个句子：Very Good\n// 输出：Please input a sentence:\n\
  What you inputted is:   Very Good\n\n---\n\n# 递归语法：\n\n`type functionName(){`\n\
  `functionName();` // 函数调用者调用自己\n}`\n\n// 函数内部的函数调用者调用自己，这被称为递归函数。\n\n例如：\n\n```cpp\n\
  #include <iostream>\nusing namespace std;\nvoid myself(int n);\nint main() {\nmyself\
  \ ( 1 );    // 声明一个函数\nreturn 0;\n}\nvoid myself(int n){    // 定义一个函数 \"myself(){\
  \ }\"\ncout <<  \"Number \" << n << endl;\n++n;\nif ( n == 4) return;     // return\
  \ 停止运行\nelse myself(n);     // 函数调用者调用 myself()\n}\n```\n// 输出：\nNumber 1\nNumber\
  \ 2\nNumber 3\n\n---\n\n# 引用参数语法：\n\n`type functionName(&a, &b) { }`\n\n// `(&a,\
  \ &b)` 不仅可以接收来自函数调用者的参数，还可以将参数传递给函数调用者。\n\n例如：\n\n```cpp\nvoid swap(int &a, int\
  \ &b) {    // 引用参数\nint temp;\ntemp = a, a = b, b = temp;  // 引用交换\n}\nint main(\
  \ ) {\nint x = 10, y = 20;\ncout << x << \" \" << y << endl;\nswap ( x, y );  //\
  \ 调用函数并传递参数\ncout << x << \" \" << y << endl;\nreturn 0;\n}\n```\n// 输出：\n10   20\n\
  20   10\n\n---\n\n# 引用对象语法：\n\n`ClassName &reference = object;`\n\n// 引用是变量或对象的别名。\n\
  // 引用名之前带有符号 `&`。\n\n例如：\n\n```cpp\nclass Flower{    // 声明一个类\npublic:\nvoid display();\n\
  };\nvoid Flower :: display( ){      // 定义一个方法\ncout <<\"The flower is beautiful\"\
  \ << endl;\n}\nint main( ) {\nFlower obj; // 创建一个对象\nFlower &reference = obj; //\
  \ \"reference\" 是 \"obj\" 的别名\nreference.display();\nreturn 0;\n}\n```\n// 输出：`The\
  \ flower is beautiful`\n\n---\n\n# 引用变量语法：\n\n`type &reference = variable;`\n\n\
  // 引用是变量或对象的别名。\n// 引用名之前带有符号 `&`。\n\n例如：\n\n```cpp\nint main( ) {\nint num = 100;\n\
  int &reference = num; // \"reference\" 是 \"num\" 的别名\ncout << reference << endl;\n\
  return 0;\n}\n```\n// 输出：`100`\n\n---\n\n# `remove()` 语法：\n\n`remove(myFile)`\n\n\
  // 删除指定的文件，成功则返回 0，失败返回非 0。\n\n例如：\n\n```cpp\n#include <cstdio>\nusing namespace\
  \ std;\nint main(){\nif ( !remove(\"myFile.txt\") ){ cout << \"Removed successfully!\"\
  ;}\nelse{ cout << \"Not removed yet!\";}\n}\n```\n// 输出：Removed successfully\n\n\
  ---\n\n# `rename()` 语法：\n\n`rename(oldFile, newFile)`\n\n// 将旧文件名重命名为新文件名，成功则返回\
  \ 0，失败返回非 0。\n\n例如：\n\n```cpp\n#include <iostream>\n#include <cstdio>\nusing namespace\
  \ std;\nint main(){\nif (rename(\"oldname.txt\", \"newname.txt\") != 0)\ncout <<\
  \ \"File renamed failed!\";\nelse\ncout << \"File renamed successfully\";\n}\n```\n\
  // 输出：File renamed successfully\n\n---\n\n# `return` 语法：\n\n`return value;`\n\n\
  // `return value` 可以向函数调用者返回一个值。\n\n例如：\n\n```cpp\n#include <iostream>\nusing namespace\
  \ std;\nint myFunction(int arg );  // 声明一个函数\nint main( ) {\ncout << \"The number\
  \ is \" << myFunction(10) <<endl; \nreturn 0;   // \"myFunction(20)\" 是函数调用者\n}\n\
  int myFunction ( int arg ) {  // 定义一个函数\nreturn ++arg;  // 向函数调用者返回一个值\n}\n```\n\
  // 输出：The number is 11.\n\n---\n\n# `round()` 函数语法：\n\n`round(num);`\n\n// 返回 `num`\
  \ 的最近的整数值，半数情况远离远离的方向舍入\n\n例如：\n\n```cpp\n#include <iostream>\n#include <cmath>\n\
  using namespace std;\nint main (){\nfloat f = 100.88;\ncout << \"round(f): \" <<\
  \ round(f) << endl;\nreturn 0;\n}\n```\n// 输出：round(f): 101\n\n---\n\n# `seekg()`\
  \ 函数语法：\n\n`contentName.seekg(n, ios::beg / ios::cur / ios::end);`\n\n// 将读取指针设置到内容的起始、结束或当前位置的第\
  \ N 个字符。\n// `n` 意味着第 N 个字符。\n// `ios::beg` 表示从内容的开始\n\n\n\n\n\n// `ios::cur` 表示从内容的当前位置\n\
  // `ios::end` 表示从内容的末尾\n\ne.g.\n\n```cpp\n#include <fstream>\n#include <iostream>\n\
  \nusing namespace std;\nint main(int argc, char** argv){\n    // 以输入/输出/截断模式打开新文件\n\
  \    fstream myFile(\"abc.txt\",ios::in | ios::out | ios::trunc);\n    // 将字符串 \"\
  C++ is excellent\" 添加文件中\n    myFile << \"C++ is excellent\";\n    // 移动到文件开始处的第\
  \ 6 个字符\n    myFile.seekg(6, ios::beg);\n    // 从文件中读取接下来的 10 个字符到缓冲区\n    char\
  \ contents[6];\n    myFile.read(contents, 10);\n    // 用空终止字符填充缓冲区\n    contents[10]\
  \ = 0;\n    // 输出从文件中读取的内容并关闭\n    cout << contents << endl;\n    myFile.close();\n\
  }\n```\n// 输出:   excellent\n\n---\n\n## `seekp()` 函数语法\n\n`contentName.seekg(n,\
  \ ios::beg / ios::cur / ios::end);`\n\n// 将写入指针设置为距离内容开头、末尾或当前位置第 N 个字符。\n// \"\
  n\" 表示第 N 个字符。\n// `ios::beg` 表示从内容的开始\n// `ios::cur` 表示从内容的当前位置\n// `ios::end`\
  \ 表示从内容的末尾\n\ne.g.\n\n```cpp\n#include <sstream>\n#include <iostream>\n\nint main(){\n\
  \    std::ostringstream str(\"javascript\");\n    str.seekp(4);    // 改变第 4 个字符的位置\n\
  \    str << 'S';\n    str.seekp(0, std::ios::end);  \n    // 改变最后一个字符的位置\n    str\
  \ << '!';\n    str.seekp(0);    // 改变第一个字符的位置\n    str << 'J';\n    std::cout <<\
  \ str.str() << '\\n';\n}\n```\n// 输出:   JavaScript!\n\n---\n\n## setter 语法\n\n`private:`\
  \    // 封装\n`type variable;`      // 设置私有变量\n`public:`\n`void setVariable() { }\
  \   // setter\n`long getVariable() { return … }` // getter\n\n// 封装的含义是确保秘密数据对用户隐藏。\n\
  // 我们必须先将类变量声明为 \"private\"。\n// 如果我们想访问 \"private\" 变量，可以使用公的 `getter` 和 `setter`\
  \ 方法。\n\ne.g.\n\n```cpp\n#include <iostream>\nusing namespace std;\nclass Programmer\
  \ {\nprivate:    // 封装\n    long income;      // 设置私有变量\npublic:\n    void setIncome(int\
  \ money) {   // setter\n        income = money;\n    }\n    long getIncome() { \
  \   // getter\n        return income;\n    }\n};\n\nint main() {\n    Programmer\
  \ guy;\n    guy.setIncome(90000);\n    cout << \"Monthly income is: $\"<< guy.getIncome();\
  \ \n    return 0;\n}\n```\n// 输出:   Monthly income is: $90000\n\n---\n\n## `signal()`\
  \ 语法\n\n`signal(SIGINT, handler);`\n\n// `signal()` 用于捕获紧急信号。\n// `SIGINT` 是一个中断信号，可以通过手动按下\
  \ Ctrl+C 键生成，也可以通过 `raise()` 函数生成。\n// \"handler\" 是处理信号的回调函数。\n\ne.g.\n\n```cpp\n\
  #include <iostream>\n#include <csignal>\n#include <unistd.h>\nusing namespace std;\n\
  void signalHandler( int mySignal ){\n    // 定义一个处理信号的函数\n    cout << \"Interrupt\
  \ signal (\" << mySignal << \") received.\\n\";\n    exit(mySignal);\n}\nint main\
  \ (){\n    signal(SIGINT, signalHandler);  \n    // 定义要捕获的 SIGINT 信号和回调函数\n    while(1){\n\
  \        cout << \"The program is running…...\" << endl;\n        sleep(2);    \
  \  // 睡眠 2 秒\n    }\n    return 0;\n}\n```\n// 输出:\nThe program is running…...\n\
  The program is running…...\nThe program is running…...\n// 当我们按下 Ctrl+C 键时，可以看到结果：\n\
  Interrupt signal (2) received.\n// 然后程序的运行被终止。\n\n---\n\n## 有符号数字语法\n\n`signed number;`\n\
  // 声明有符号数字\n\ne.g.\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main(){\n\
  \    signed num1;          // 声明有符号数字\n    unsigned num2;      // 声明无符号数字\n    num1\
  \ = -1;\n    num2 = num1;\n    cout << num1 << \"   \" << num2;\n    return 0;\n\
  }\n```\n// 输出:     -1    4294967295\n// 有符号的 -1 被解释为无符号的 4294967295\n\n---\n\n##\
  \ `sin()` 语法\n\n`sin(num)`\n\n// 返回弧度为 num 的正值。\n\ne.g.\n\n```cpp\n#include <iostream>\n\
  #include <cmath>\nusing namespace std;\nint main(){\n    double degree=30;\n   \
  \ double r = degree*3.14/180; \n    cout << sin(r);\n}\n```\n// 输出:   0.49977\n\n\
  ---\n\n## `sinh()` 语法\n\n`sinh(num)`\n\n// 返回 num 的双曲正弦\n\ne.g.\n\n```cpp\n#include\
