  \ (counter < 8){  // 执行 8 次\n    cout << \"&\";\n    counter++;  // 增加 1\n}\n//\
  \ 输出: &&&&&&\n```\n\n---------------------------------------------------------------\n\
  \n### `unsigned` 数字语法：\n\n```cpp\nunsigned number;\n```\n// 声明一个无符号数字\n\ne.g.\n\n\
  ```cpp\n#include <iostream>\nusing namespace std;\n\nint main(){\n    signed num1;\
  \      // 声明有符号数字\n    unsigned num2;   // 声明一个无符号数字\n    num1 = -1;\n    num2 =\
  \ num1;\n    cout << num1 << \" \" << num2;\n    return 0;\n}\n// 输出: -1 4294967295\n\
  ```\n\n- 有符号的 `-1` 被解释为无符号的 `4294967295`。\n\n---------------------------------------------------------------\n\
  \n### vector 声明语法：\n\n```cpp\nvector <data-type> vectorName (size);\n```\n\n- vector\
  \ 类似于大小可以改变的数组。\n- vector 可以是任何类型，其第一个索引从零开始。\n\ne.g.\n\n```cpp\nvector <int> myVector\
  \ (10); // 10\n```\n\n\n\n\n\n```cpp\nvector <double> prices (60);    // 2\nvector\
  \ <string> titles (18);         // 3\n```\n\n### 解析:\n1: 声明一个包含 10 个元素的 \"int\"\
  \ 类型 vector \"myVector\"。\n2: 声明一个包含 60 个元素的 \"double\" 类型 vector \"prices\"。\n\
  3: 声明一个包含 18 个元素的 \"string\" 类型 vector \"titles\"。\n\n## vector 方法语法\n\n- `v.push_back(value)`\
  \ // 向 vector 的末尾添加一个元素\n- `v.size( ) // 返回 vector 的大小\n- `v.at(index)` // 返回 vector\
  \ 在指定索引处的值\n- `v.pop_back( ) // 删除 vector 的最后一个元素\n\n### 示例\n```cpp\nint main (){\n\
  \nvector < int > myVector(1);  // 创建包含 1 个元素的 vector。\nmyVector.push_back(20); //\
  \  在末尾添加元素 20\nmyVector.push_back(30); //  在末尾添加元素 30\ncout<< \"myVector size: \"\
  \ << myVector.size( ) << endl;\n// 获取元素个数\ncout<< \"The third element: \" << myVector.at(2)\
  \ << endl;\n// 获取索引 2 处的值\nmyVector.pop_back( );\n//  移除最后一个元素\ncout<< \"Final element\
  \ has been removed.\"<< endl;\nreturn 0;\n\n}\n```\n**输出:**\n```\nmyVector size:\
  \ 3\nThe third element: 30\nFinal element has been removed.\n```\n\n## vector 方法语法\n\
  \n- `v.front( ) // 返回第一个元素的值\n- `v.back( ) // 返回最后一个元素的值\n- `v.clear( ) // 清空 vector\n\
  - `v.empty( ) // 如果 vector 为空返回 1，否则返回 0\n\n### 示例\n```cpp\nint main (){\n\nvector\
  \ < int > myVector ( 1 );\nmyVector.push_back(20);\nmyVector.push_back(30);\ncout<<\
  \ \"The first element: \" << myVector.front( ) <<endl;\n// 获取第一个元素的值\ncout<< \"\
  The last element: \" << myVector.back( ) <<endl;\n// 获取最后一个元素的值\nmyVector.clear(\
  \ );     // 清空所有元素\ncout<< \"myVector is empty? \" << myVector.empty( ) <<endl;\n\
  // 检查 vector 是否为空\nreturn 0;\n\n}\n```\n**输出:**\n```\nThe first element: 0\nThe\
  \ last element: 30\nmyVector is empty? 1 \n```\n\n## 虚函数语法\n\n`virtual type functionName(\
  \ );`\n\n- `virtual type functionName( );` 定义一个虚函数。当该函数被调用时，执行派生类中的重写函数，而不是基类中的函数。\n\
  \n### 示例\n```cpp\n#include<iostream>\nusing namespace std;\n\nclass Car{\npublic:\n\
  virtual void drive( ){    // 定义一个虚函数\ncout << \"Drive a car.\" << endl;\n}};\n\n\
  class Van: public Car{\npublic:\nvoid drive( ){\ncout << \"Drive a van.\" << endl;\n\
  }};\n\nclass Bus: public Car{\npublic:\nvoid drive( ){\ncout << \"Drive a bus.\"\
  \ << endl;\n}};\n\nvoid myFunction(Car &c){     // Car 的别名是 \"c\"。\nc.drive( );\
  \    // 调用派生类中的 drive()\n}\n\nint main( ){\nVan v;   // 创建一个对象\nBus b;   // 创建一个对象\n\
  myFunction(v);\nmyFunction(b);\nreturn 0;\n}\n```\n**输出:**\n```\nDrive a Van.\n\
  Drive a Bus.\n```\n\n## 虚方法语法\n\n`virtual type method(){ }` \n\n- 在基类中定义一个虚方法\n\
  `type method(){ }`\n- 派生类中的方法重写基类中的虚方法。\n- 多态意味着基类中的方法可以被派生类中的多个方法所重写。\n\n### 示例\n\
  ```cpp\n#include <iostream>\n#include <string>\nusing namespace std;\n\nclass Animal\
  \ {     // 基类\npublic:\nvirtual void yell() {     // 虚方法\n}\n};\n\nclass Cat : public\
  \ Animal {    // 派生类\npublic:\nvoid yell() {\ncout << \"The cat yells: mew mew \\\
  n\" ;\n}\n};\n\nclass Dog : public Animal {    // 派生类\npublic:\nvoid yell() {\n\
  cout << \"The dog yells: wow wow \\n\" ;\n}\n};\n\nint main() {\nCat myCat;\nDog\
  \ myDog;\nmyCat.yell();\nmyDog.yell();\nreturn 0;\n}\n```\n**输出:**\n```\nThe cat\
  \ yells: mew mew\nThe dog yells: wow wow\n```\n\n## volatile 语法\n\n- `int volatile\
  \ variable;`     // 声明变量\n- `volatile int variable;`     // 声明变量\n- `int volatile\
  \ *pointer;` // 声明指针\n- `volatile int *pointer;` // 声明指针\n- `volatile` 告诉编译器多线程中的变量值可能会在任何时间意外变化；编译器应该从内存读取变量而不是寄存器。\n\
  - `volatile` 告诉编译器不要优化此值。\n- `volatile` 告诉编译器不要在寄存器中缓存变量。\n- `volatile` 告诉编译器不要改变赋值顺序。\n\
  \n### 示例\n```cpp\nint main(){\nvolatile int number;\nnumber++;\n}\nint main(){\n\
  int number;\nnumber++;\n}\n```\n**解析:**\n`volatile int`: 无法从内存拷贝到寄存器。\n`int number`:\
  \ 可以从内存拷贝。\n\n## write() 语法\n\n`cout.write(stringArray, stringLength);`\n\n- `stringArray`\
  \ 将字符串定义为数组。\n- `stringLength` 定义大小。\n\n### 示例\n```cpp\nusing namespace std;\nint\
  \ main() {\nchar ch[ ] = \"This is a test\"; // 定义一个字符串\ncout.write(ch, strlen(ch))\
  \ << endl; // 输出字符串\nreturn 0;\n}\n```\n**输出:**\n```\nThis is a test\n```\n\n##\
  \ 写入文件语法\n\n`ofstream fileObject (\"myFile.txt\");` // 创建输出对象\n`fileObject << myString\
  \ << endl;` // 将 myString 写入文件\n\n- `ofstream fileObject (\"myFile.txt\");` 创建一个输出文件\
  \ `fileObject`。\n- `ofstream` 类用于向文件写入数据。\n- `fileObject` 是一个输出文件对象。\n- 处理文件，我们需要首先使用\
  \ `<fstream>`。\n\n### 示例\n```cpp\n#include <iostream>\n#include <fstream>\n#include\
  \ <string>\nusing namespace std;\nint main(){\nofstream fileObject ( \"D:\\\\myFile.txt\"\
