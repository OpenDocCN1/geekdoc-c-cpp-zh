  \n### 指针++ 语法\n\n```cpp\nptr++;\n```\n\n- 将指针移动到下一个地址。\n\ne.g.\n\n```cpp\nconst\
  \ int MAX = 3;\nint main (){\n    int  arr[MAX] = {10, 20, 30};\n    int  *ptr;\
  \ ptr = arr;\n    for (int i = 0; i < MAX; i++){\n        cout << \"Address of arr[\"\
  \ << i << \"] = \";\n        cout << ptr << endl;\n        cout << \"Value of arr[\"\
  \ << i << \"] = \";\n        cout << *ptr << endl;\n        ptr++;   // 移动到下一个地址\n\
  \    }\n    return 0;\n}\n```\n```cpp\n// Output: \nAddress of arr[0] = 0x7ffd5bc55a58\n\
  Value of arr[0] = 10\nAddress of arr[1] = 0x7ffd5bc55a5c\nValue of arr[1] = 20\n\
  Address of arr[2] = 0x7ffd5bc55a60\nValue of arr[2] = 30\n```\n\n-------------------------------------------------------------------------------\n\
  \n### 指针-- 语法\n\n```cpp\nptr--;\n```\n\n- 将指针移动到上一个内存地址。\n\ne.g.\n\n```cpp\nconst\
  \ int MAX = 3;\nint main (){\n    int  arr[MAX] = {10, 20, 30};\n    int  *ptr;\
  \ ptr = &arr[MAX-1]; // 指向最后一个地址\n    for (int i = MAX; i > 0; i--){\n        cout\
  \ << \"Address of arr[\" << i << \"] = \";\n        cout << ptr << endl;\n     \
  \   cout << \"Value of arr[\" << i << \"] = \";\n        cout << *ptr << endl;\n\
  \        ptr--;   // 移动到上一个地址\n    }\n    return 0;\n}\n```\n\n\n\n\n\n`arr[2]`\
  \ 的值 = 20\n`arr[1]` 的地址 = 0x7ffd67ddecf8\n`arr[1]` 的值 = 10\n\n---\n\n### 指针数组语法\n\
  \n`*pointer = array;`\n\n`*pointer = array;` 意味着指针最初指向数组的第一个元素。\n\n例如\n\n```cpp\n\
  int main( ) {\n    int myArray[ 3 ] = { 10, 20, 30 };\n    int *pt = myArray;  \n\
  \    // 指针指向第一个元素 myArray[0]\n    cout << \"The first value is: \" << *pt << endl;\n\
  \    pt++;  // 指针移动到下一个元素 myArray[1]\n    cout << \"The second value is: \" << *pt\
  \ << endl;\n    pt++; // 指针移动到下一个元素 myArray[2]\n    cout << \"The third value is:\
  \ \" << *pt << endl;\n    return 0;\n}\n```\n\n// 输出:\nThe first value is: 10\n\
  The second value is: 20\nThe third value is: 30\n\n---\n\n### 指针数组语法\n\n`int a,\
  \ b, c;`\n`int *pointer[n] = { &a, &b, &c };`\n\n`int *pointer[n] = { &a, &b, &c\
  \ };` 定义了一个指针数组。\n`n` 是数组的长度。\n`&a, &b, &c` 是数组的元素。\n\n例如\n\n```cpp\nint main( )\
  \ {\n    int a, b, c;\n    a = 10, b = 11, c = 12;\n    int *myArray[3] = { &a,\
  \ &b, &c };  \n    // 定义一个指针数组 \"myArray\"\n    cout << *myArray[0] + *myArray[1]\
  \ << endl;     // a + b\n    cout << *myArray[2] - *myArray[1] << endl;      //\
  \ c - b\n    return 0;\n}\n```\n\n// 输出: 21 1\n\n---\n\n### 指针初始化语法\n\n`dataType\
  \ *pointer;` // 声明指针\n`*pointer = &variable;` // `*pointer` 访问变量的值\n`pointer = &variable;`\
  \ // `pointer` 指向变量的地址\n\n指针名称前有一个 ` * `。\n`&` 运算符获取变量的内存地址。\n\n例如\n\n```cpp\n#include\
  \ <string>\n#include <iostream>\nusing namespace std;\n\nint main( ) {\n    int\
  \ num = 20;\n    int *pt = &num;      // *pt 访问 num 的值\n    cout << \"The value\
  \ of num is: \" << *pt << endl;\n    pt = &num;      // pt 指向 num 的地址\n    cout\
  \ << \"The address of num is: \" << pt << endl;\n    return 0;\n}\n```\n\n// 输出:\
  \ The value of num is: 20\nThe address of num is: 0x7fff1bbfbaa8\n\n---\n\n### 指针交换语法\n\
  \n`pt = pt1; pt1 = pt2; pt2 = pt;`\n\n`pt1` 的指针可以与 `pt2` 的指针交换。\n\n例如\n\n```cpp\n\
  #include <string>\n#include <iostream>\nusing namespace std;\n\nint main( ) {\n\
  \    int *pt, x, y;\n    x = 100, y = 200;\n    int *pt1 = &x;      // *pt1 访问 x\
  \ 的值\n    int *pt2 = &y;      // *pt2 访问 y 的值\n    cout << x << \" \" << y << endl;\n\
  \    pt = pt1; pt1 = pt2; pt2 = pt;      // 交换指针\n    cout << *pt1 << \" \" << *pt2\
  \ << endl;\n    return 0;\n}\n```\n\n// 输出:\n100 200\n200 100\n\n---\n\n### 指针使用语法\n\
  \n`dataType *pointer;` // 声明指针\n`*pointer = &variable;` // `*pointer` 访问变量的值\n`pointer\
  \ = &variable;` // `pointer` 指向变量的地址\n\n例如\n\n```cpp\n#include<iostream>\nusing\
  \ namespace std;\n\nint main( ){\n    int x = 100, y = 200;\n    int *xPt = &x;\
  \      // *xPt 访问 x 的值\n    int *yPt = &y;      // *yPt 访问 y 的值\n    cout<<\"X value:\
  \ \"<< *xPt <<endl;      // 显示值\n    cout<<\"X address: \"<< xPt <<endl;     //\
  \ 显示地址\n    cout<<\"Y value: \"<< *yPt <<endl;      // 显示值\n    cout<<\"Y address:\
  \ \"<< yPt <<endl;      // 显示地址\n    return 0;\n}\n```\n\n// 输出:\nX value: 100\n\
  X address: 0x22ff55\nY value: 200\nY address: 0x22ff50\n\n---\n\n### 指针与字符串语法\n\n\
  `char *pt = myString;`\n\n`char *pointer = \"string\";` 定义了一个指向字符串第一个字符的指针。\n\n\
  例如\n\n```cpp\nint main( ) {\n    char str[ ] = \"myString\";  // 定义一个字符串\n    char\
  \ *pt = str; // 指向 str 的第一个字符\n    int counter = 0;    // 定义一个计数器\n    while ( *pt\
