  \ `#include <fstream>`。\n\n### 示例\n\n\n\n假设 `\"myFile.txt\"` 的路径为 `\"D:\\\\myFile.txt\"\
  `。\n`\"myFile.txt\"` 的内容为：\"C++ is a very good language.\"`\n\n```cpp\n#include\
  \ <iostream>\n#include <fstream>\n#include <string>\n\nusing namespace std;\n\n\
  int main(){\n    string myString;\n    ifstream fileObject ( \"D:\\\\myFile.txt\"\
  \ ); // 创建一个对象\n    getline ( fileObject, myString ); // 将文件读取到 myString\n    cout\
  \ << myString <<endl;    // 显示 myString 的内容\n    fileObject.close ( );\n    return\
  \ 0;\n}\n```\n// 输出：`C++ is a very good language.`\n\n## 继承语法\n\n继承语法：\n\n`derived\
  \ class : public base class`\n\n- 基类可以被其派生类继承。派生类可以继承基类的所有的公共成员。\n- 基类可以被父类。\n-\
  \ 派生类可以被视为子类。\n\n### 示例\n\n```cpp\n#include<string>\n#include <iostream>\n\nusing\
  \ namespace std;\n\nclass Computer {  // 基类\npublic:\n    void display( ){\n   \
  \     cout << \"Computer OK!\" << endl;\n    }\n};\n\nclass Laptop : public Computer\
  \ { \n    // 派生类继承基类\n};\n\nint main ( ){\n    Laptop Lt;    // 派生类创建对象 Lt\n   \
  \ Lt. display( );  // Lt 调用基类的方法\n    return 0;\n}\n```\n// 输出：`Computer OK!`\n\n\
  ## 内联函数语法\n\n内联函数语法：\n\n`inline type functionName( );`\n\n- 内联函数可以提高程序的执行效率。每当调用内联函数时，编译器都会用函数中的实际代码替换函数调用。\n\
  \n### 示例\n\n```cpp\n#include <iostream>\nusing namespace std;\n\ninline int sum(int\
  \ n);   // 定义内联函数\nint main( ){\n    int number;\n    cout << \"Please enter a number:\
  \ \";\n    cin >> number;\n    number = sum(number);\n    cout << \"Result: \" <<\
  \ number << endl;\n    number = sum(number);\n    cout << \"Result: \" << number\
  \ << endl;\n    number = sum(number);\n    cout << \"Result: \" << number << endl;\n\
  }\n\nint sum(int n){\n    return n + n;\n}   // 假设我们输入了数字 3 并回车\n```\n// 输出：\n`Please\
  \ enter a number: 3`\n`Result: 6`\n`Result: 12`\n`Result: 24`\n\n### 用户输入语法\n\n\
  用户输入语法：\n\n`cin >> variable;`\n\n- 从键盘获取用户输入。\n\n### 示例\n\n```cpp\nint main() {\n\
  \    int num;\n    cout << \"Please enter a number: \";\n    cin >> num;  // 接受用户数字\n\
  \    cout << num;\n    return 0;\n}\n```\n// 输出：`Please enter a number: 100`\n\n\
