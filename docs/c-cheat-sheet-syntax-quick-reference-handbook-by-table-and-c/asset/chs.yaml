  \n---\n\n# `raise()` 语法：\n\n`int raise (signal);`\n\n// `raise()` 函数可以生成一个信号。\n\
  // `raise(SIGINT)` 可以生成一个 `SIGINT` 信号\n// `SIGINT` 是一个中断信号，可以通过手动按下 `Ctrl+C` 键生成，也可以通过\
  \ `raise()` 函数生成。\n\n例如：\n\n```cpp\n#include <iostream>\n#include <csignal>\n#include\
  \ <unistd.h>\nusing namespace std;\nvoid signalHandler( int mySignal ){\n// 定义一个处理信号的函数\n\
  cout << \"Interrupt signal (\" << mySignal << \") received.\\n\";\nexit(mySignal);\n\
  }\nint main (){\nint i = 0;\nsignal(SIGINT, signalHandler);\n// 定义要捕获的 SIGINT 信号和回调函数\n\
  while(++i){\ncout << \"The program is running......\" << endl;\nif( i == 3 ){\n\
  raise( SIGINT);   // 生成一个 SIGINT 信号\n}\nsleep(2);   // 睡眠 2 毫秒\n}\nreturn 0;\n}\n\
  ```\n// 输出：\nThe program is running......\nThe program is running......\nThe program\
  \ is running......\nInterrupt signal (2) received.\n// 随后程序运行终止。\n\n---\n\n# `rand()`\
  \ 语法：\n\n`srand( (unsigned)time( NULL ) );` // 设置种子\n`num= rand();` // 生成一个随机数\n\
