  num= rand();   // 生成一个随机数\ncout <<\"Random number is \" << num << endl;\nreturn\
  \ 0;\n}\n```\n// 输出：`Random number is 900729318`\n\n---\n\n# 读取文件语法：\n\n`ifstream\
