  \n### 重写语法\n\n```cpp\nmyFunction(arg){…}     // 此方法在基类中\nmyFunction(arg){…}    \
  \ // 此方法在派生类中\n```\n\n- 如果名称和参数相同，派生类的方法可以重写基类的方法。\n\ne.g.\n\n```cpp\n#include <iostream>\n\
  using namespace std;\n\nclass Computer{ // 基类\npublic:\n    void harddrive( ){ cout\
  \ << \"5T\" << endl; };\n    void memory( ){ cout << \"4G\" << endl; };\n};\n\n\
  class Laptop: public Computer{ // 派生类\npublic:\n    void harddrive( ){ cout << \"\
