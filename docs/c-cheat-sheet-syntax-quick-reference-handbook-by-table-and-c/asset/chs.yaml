- "# C++ 速查表，语法快速参考手册（表格与图表）：语法快速学习指南\n\n\n\n![](img/image_rsrc767.jpg)\n\n\n## 关于本书\n\
  本书涵盖了所有基础 C++ 语法，几乎每个语法条目都列出了一个程序示例和结果输出（300 个示例，300 个输出，300 个解释）。我们可以快速参考最有帮助的编程语法，例如常用命令语法、字符串函数语法、集合函数语法、类与对象语法等等……这些语法对于编程都非常有用。\n\
  \n我们可以将这本书作为一份基础语法手册，因为它的条目是按字母顺序排列的，方便我们轻松参考重要的语法。\n\n无论现在还是未来，C++ 语法书都能为我们学习和工作中的编码提供巨大的帮助。\n\
  \n在世界上，哪里能找到一本拥有“300 个示例，300 个输出，300 个解释”的书呢？\n\n----- 仅在此处！\n\n## 免责声明\n本书仅作为基础语法手册；它不能包含该主题的所有条目。其目的是作为查表书籍的补充，而不是完整的\
  \ C++ 字典。\n\n## 类模板语法\n\n```cpp\ntemplate <class T>      // 定义一个类模板\nclass templateName{\
  \ class body };   // 类模板\n```\n\n一个类模板可以替换多个类的代码。\n如果多个类体相同，仅数据类型不同，则可以使用类模板。\n\
  `templateName <type>object;`\n// 创建类模板对象\n\ne.g.\n```cpp\n#include <iostream>\n\
  using namespace std;\n\ntemplate< class T>     // 定义一个类模板\nclass Contrast{     //\
  \ 类模板\npublic:\n    Contrast(T a, T b)     // 构造函数\n    { x = a; y = b;}\n    T\
  \ max( )      // \"T\" 可能是不同的数据类型\n    { return (x > y) ? x : y;}\nprivate:\n  \
  \  T x, y;     // \"T\" 可能是不同的数据类型\n};\n\nint main( ){\n    Contrast <int>con1(\
  \ 10, 20);     // 创建一个对象 \"con1\"\n    cout << con1.max( ) << endl;     // 数据类型为\
  \ \"int\"\n    Contrast <float>con2( 20.01, 20.02 );    // 创建 \"con2\"\n    cout\
  \ << con2.max( ) << endl;     // 数据类型为 \"float\"\n    Contrast <long> con3( 67891,\
  \ 67892 );     // 创建 \"con3\"\n    cout << con3.max( ) << endl;     // 数据类型为 \"\
  long\"\n    return 0;\n}\n```\n// 输出: 20        20.02        67892\n\n## clog 语法\n\
  \n```cpp\nclog << variable;\n```\n\n// 输出日志消息\n\ne.g.\n```cpp\nint main( ){\n  \
  \  char msg[] = \"The file is executed only one time\";\n    clog << \"Log message\
  \ : \" << msg << endl;\n}\n```\n// 输出: Log message : The file is executed only one\
  \ time\n\n## 注释语法\n\n注释 `//` 用于单行注释。\n注释 `/*…*/` 用于多行注释。\n// C++ 注释用于解释当前代码，描述这些代码正在做什么。C++\
  \ 编译器会忽略注释。\n\ne.g.\n```cpp\ncout << \"Hello World\" ;   // 输出 \"Hello World\"\n\
  \n/*\n这里是多行注释\n\"cout <<\"  是一个 C++ 输出命令，意味着显示或打印。\n*/\n```\n\n## 条件编译语法\n\n```cpp\n\
  #if expression\n编译代码 1       // 如果为真，编译此代码\n#else\n编译代码 2       // 如果为假，编译此代码\n\
  #endif\n```\n\n如果条件测试结果为真，则会编译 C++ 程序的一部分；如果条件测试为假，则不编译。\n\ne.g.\n```cpp\n#include<iostream>\n\
  using namespace std;\n#define ID 100\nint main( ){\n#if ID > 0\ncout<< \"ID>0\"\
  \ << endl;\n#else\ncout<< \"ID<0\" << endl;\n#endif\nreturn 0;\n}\n```\n// 输出: ID>0\n\
  \n## 条件编译语法\n\n```cpp\n#ifdef identifier\n编译代码 1       // 如果已定义，编译此代码\n#else\n编译代码\
  \ 2       // 如果未定义，编译此代码\n#endif\n```\n\n如果字符串之前被定义过，则会编译 C++ 程序的一部分；如果字符串未定义，则不编译。\n\
  \ne.g.\n```cpp\n#include<iostream>\nusing namespace std;\n#define VARIABLE \"This\
  \ is a string.\"\nint main( ){\n#ifdef VARIABLE\ncout<< \"VARIABLE has been defined\"\
  \ <<endl;\n#else\ncout<< \"VARIABLE has not been defined\" << endl;\n#endif\nreturn\
  \ 0;\n}\n```\n// 输出: VARIABLE has been defined.\n\n## 条件运算符语法\n\n```cpp\n(test-expression)\
  \ ? (if-true-do-this) : (if-false-do-this);\n```\n\n// 当 `test-expression` 返回真时，执行\
  \ `if-true-do-this`。\n// 当 `test-expression` 返回假时，执行 `if-false-do-this`。\n\ne.g.\n\
  ```cpp\nint main( ) {\n    int a = 100; int b =200;\n    string result = (a < b)\
  \ ? \"apple\" : \"banana\";\n    // (test-expression) ? (if-true-do-this) : (if-false-do-this);\n\
  \    cout << result << endl;\n    return 0;\n}\n```\n// 输出: apple\n\n## 常量定义语法\n\
  \n```cpp\n#define CONSTANT-NAME \"value\"\n```\n\n// `#define` 定义一个常量。\n// `CONSTANT_NAME`\
  \ 是常量名，使用大写。\n// 注意：尽量不要在 `#define` `CONSTANT_NAME` 语句结束加分号。\n\ne.g.\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\n#define SYMBOL \"$\"   // 定义一个常量\n#define PRICE\
  \ 80    // 定义一个常量\n#define MONEY \" dollars\" // 定义一个常量\n\nint main( ) {\n    int\
  \ num = 10;\n    cout << SYMBOL << num * PRICE << MONEY;\n    return 0;\n}\n```\n\
  // 输出: $800 dollars\n\n## 常量定义语法\n\n```cpp\nconst type variable = value;\n```\n\n\
  // `const` 用于定义常量。\n// 常量名通常是大大写的。\n\ne.g.\n```cpp\n#include <iostream>\nusing namespace\
  \ std;\nconst int LENGTH = 100; \nconst int WIDTH = 50;\n\nint main(){\n    int\
  \ rectangle; \n    rectangle = LENGTH * WIDTH;\n    cout << rectangle;\n    return\
  \ 0;\n}\n```\n// 输出: 5000\n\n## constexpr 语法\n\n```cpp\nconstexpr variables/function/constructors\n\
  ```\n\n// `constexpr` 意味着常量表达式，它可以用于变量、函数、构造函数。`constexpr` 在编译时求值而不是在运行时求值。\n\n\
  e.g.\n```cpp\n#include <iostream>\nconstexpr int sum(int a, int b){ return (a +\
  \ b); }\n\n// 通过 constexpr，编译器在编译时求值。\nint main(){\n    constexpr int s = sum(10,\
  \ 20);\n    std::cout << s;\n    return 0;\n}\n```\n// 输出: 30\n\n## 构造函数语法\n\n```cpp\n\
  class ClassName{\n    ClassName( ) {…} ; // 构造函数\n};\n```\n\n// 构造函数用于初始化变量。构造函数名与类名相同。当创建对象时，构造函数会被调用。\n\
  \ne.g.\n```cpp\n#include<string>\n#include <iostream>\nusing namespace std;\n\n\
  class Flower {     // 创建一个名为 Flower 的类\n```\n\n\n\n\n\n```cpp\npublic:    // 指定访问权限\n\
  \  string c1, c2;\n\n  void beautify() {  cout << \"Green\" <<endl; };\n\n  Flower(){\
  \  c1= \"Red\";  c2 = \"Yellow\"; };    // 构造函数\n\n  // 定义一个构造函数 \"Flower()\"\n\
  };\n\nint main( ) {\n  Flower obj;    // 创建名为 \"obj\" 的对象并调用构造函数\n  cout << obj.c1\
  \ << endl;\n  cout << obj.c2 << endl;\n  obj.beautify();\n  return 0;\n}\n```\n\
  Output:\nRed\nYellow\nGreen\n\n---\n\n### continue 语法：\n\n```cpp\ncontinue;\n```\n\
  `continue` 关键字用于停止当前的迭代，忽略后续代码，然后继续下一次循环。\n\ne.g.\n```cpp\nint num = 0;\n\nwhile\
  \ ( num < 10 ){\n  num++;\n  if ( num == 5 )  continue; // 进入下一次 while 循环\n  cout\
  \ <<  num ;      // 如果 num 是 5，则跳过这段代码\n}\n```\nOutput: `1234678910`\n注意输出中没有 `5`。\n\
  \n---\n\n### 类型转换语法：\n\n```cpp\n( type ) variable;\n```\n将一种数据类型转换为另一种数据类型。\n\n\
  e.g.\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main(){\n  double\
  \ x = 2.718281828;\n  float y = 3.14;\n  int z ;\n  z = (int)x;\n  cout << \"Value\
  \ of (int)x is: \" << z << endl ;\n  z = (int)y;\n  cout << \"Value of (int)y is:\
  \ \" << z << endl ;  \n  return 0;\n}\n```\nOutput:\nValue of `(int)x` is: 2\nValue\
  \ of `(int)y` is: 3\n\n---\n\n### cos() 语法：\n\n```cpp\ncos(num)\n```\n返回以弧度为单位的\
  \ num 的余值。\n\ne.g.\n```cpp\n#include <iostream>\n#include <cmath>\nusing namespace\
  \ std;\n\nint main(){\n  double degree=30;\n  double r = degree*3.14/180; \n  cout\
  \ << cos(r);\n}\n```\nOutput: `0.866158`\n\n---\n\n### cosh() 语法：\n\n```cpp\ncosh(num)\n\
  ```\n返回 num 的双曲余弦。\n\ne.g.\n```cpp\n#include <cmath>\n#include <iostream>\nusing\
  \ namespace std;\n\nint main(){\n  cout << cosh(0.6);\n}\n```\nOutput: `1.18547`\n\
  \n---\n\n### cout 语法：\n\n```cpp\ncout << \"   \";  // 在同一行中打印结果\ncout << \"   \"\
  \ << endl; // 在不同行中打印结果\n```\ne.g.\n```cpp\ncout << \" 1 \";     // 在同一行输出\ncout\
  \ << \" 2 \";\ncout << \" 3 \";\n```\nOutput: `1  2  3`\n\ne.g.\n```cpp\ncout <<\
  \ \" 1 \" << endl ;    // 在不同行输出\ncout << \" 2 \" << endl ;\ncout << \" 3 \" <<\
  \ endl ;\n```\nOutput:\n1\n2\n3\n\n---\n\n### ctime() 语法：\n\n```cpp\ntime_t t //\
  \ 定义一个 time_t 类型变量 \"t\"。\nctime(&t) // 返回表示本地时间的字符串\n```\ne.g.\n```cpp\n#include\
  \ <ctime>\n#include <iostream>\nusing namespace std;\n\nint main(){\n  time_t t;\n\
  \  ctime(&t); // 返回当前日期和时间\n  cout<<\"Today is: \"<< ctime(&t);\n}\n```\nOutput:\
  \ `Today is : Today is: Mon Dec 26 22:37:09 2022`\n\n---\n\n### 当前日期与时间语法：\n\n```cpp\n\
  time_t now = time(0);    // 获取当前系统的日期与时间\nchar* dt = ctime(&now);    // 将 \"now\"\
  \ 转换为字符串类型\n```\n获取日期和时间，请先包含 `<ctime>`。\n\ne.g.\n```cpp\n#include <iostream>\n\
  #include <ctime>\nusing namespace std;\n\nint main( ){\n  time_t now = time(0);\
  \      // 获取当前系统的日期与时间\n  char* dt = ctime(&now);      // 将 \"now\" 转换为字符串类型\n \
  \ cout << dt << endl;\n}\n```\nOutput: `Sun Aug  7    16:02:18    2022`\n\n---\n\
  \n### 数据类型语法：\n\n```cpp\ntype variable = value;\n```\n数据类型指定了变量的属性。\n\ne.g.\n```cpp\n\
  #include <iostream>\n#include <string>\nusing namespace std;\n\nint main () {\n\
  \  int myNum = 10;             // 整数\n  float myFloat = 10.99;      // 浮点数\n  double\
  \ myDouble = 10.9999;  // 双精度浮点数\n  char myCharacter = 'C';     // 字符\n  bool myBool\
  \ = true;        // 布尔值\n  string myString = \"C Plus Plus\";   // 字符串\n  cout <<\
  \ \"int type: \" << myNum << \"\\n\";\n  cout << \"float type: \" << myFloat <<\
  \ \"\\n\";\n  cout << \"double type: \" << myDouble << \"\\n\";\n  cout << \"char\
  \ type: \" << myCharacter << \"\\n\";\n  cout << \"bool type: \" << myBool << \"\
  \\n\";\n  cout << \"string type: \" << myString << \"\\n\";\n  return 0;\n}\n```\n\
  Output:\nint type: 10\nfloat type: 10.99\ndouble type: 10.9999\nchar type: C\nbool\
  \ type: 1\nstring type: C Plus Plus\n\n---\n\n### UTC 日期时间语法：\n\n```cpp\ntime_t\
  \ now = time(0);    // 获取当前日期时间\ntm *gm = gmtime(&now);    // 将 \"now \" 转换为 tm\
  \ 类型\nchar* utc = asctime(gm); // 获取 UTC 日期时间\n```\n获取日期和时间，请先包含 `<ctime>`。\n\n\
  e.g.\n```cpp\n#include <iostream>\n#include <ctime>\nusing namespace std;\n\nint\
  \ main( ){\n  time_t now = time(0);    // 获取当前日期时间\n  tm *gm = gmtime(&now);   \
  \ // 将 \"now \" 转换为 tm 类型\n  char* utc = asctime(gm); // 获取 UTC 日期时间\n  cout <<\
  \ utc << endl;\n}\n```\nOutput: `Sun Aug 7    16:28:29      2022`\n\n---\n\n###\
  \ 默认参数语法：\n\n```cpp\nvoid functionName( type variable = value ) {\n}\n```\n如果调用函数时不带参数，C++\
  \ 编译器将应用默认参数。\n`(type variable = value)` 是一个默认参数。\n\ne.g.\n```cpp\n#include <iostream>\n\
  #include <string>\nusing namespace std;\n\nvoid myFunction(string city = \"New York\"\
  ) {\n  cout << city << \"\\n\";\n}\n\nint main() {\n  myFunction(\"Atlanta\");\n\
  \  myFunction(\"Boston\");\n  myFunction(\"Chicago\");\n  myFunction();\n  return\
  \ 0;\n}\n```\nOutput:\nAtlanta\nBoston\nChicago\nNew York\n\n---\n\n### 定义变量语法：\n\
  \n```cpp\ndataType variableName = value;\n```\n变量是一个与值关联的符号名称。\n\ne.g.\n```cpp\n\
  void main ( ) {\n  char  mychar = 'm';\n  int myinteger = 168;\n  float myflt =\
  \ 28.98;\n  double mydbl = 0.12345679;\n  boolean myBool = true;\n}\n```\n\n---\n\
  \n### 删除变量语法：\n\n```cpp\nvariable = new type; // 为变量分配内存\ndelete variable; // 释放内存\n\
  ```\ne.g.\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main (){\n \
  \ double* myVar = NULL; // 初始化指针为空 Null\n  myVar = new double; // 为变量分配内存\n  *myVar\
  \ = 100; // 将值存储到内存地址\n  cout << \"Value of myVar : \" << *myVar << endl;\n  delete\
  \ myVar; // 释放内存\n  return 0;\n}\n```\nOutput: `Value of myVar : 100`\n\n---\n\n\
  ### 删除数组语法：\n\n```cpp\nMyClass* myArr = new MyClass[3]; // 为数组分配内存\ndelete [] myArr;\
  \ // 释放数组内存\n```\ne.g.\n```cpp\n#include <iostream>\nusing namespace std;\n\nclass\
  \ MyClass{\npublic:\n  MyClass() {\n    cout << \"Call constructor!\" <<endl;\n\
  \  }\n  ~MyClass() {\n    cout << \"Call destructor!\" <<endl;\n  }\n};\n\nint main(\
  \ ){\n  MyClass* myArr = new MyClass[3]; // 分配内存\n  delete [] myArr; // 释放内存\n \
  \ return 0;\n}\n```\nOutput:\nCall constructor!\nCall constructor!\nCall constructor!\n\
  Call destructor!\nCall destructor!\nCall destructor!\n\n---\n\n### 解引用语法：\n\n```cpp\n\
  dataType *pointer; // 声明指针\n*pointer = &variable; // *pointer 访问变量的值\n```\n如果 `*pointer\
  \ = &variable`，意味着可以通过指针根据变量的地址访问变量的值，这被称为指针的“解引用”。\n\ne.g.\n```cpp\n#include <iostream>\n\
  #include <string>\nusing namespace std;\n\nint main() {\n  string greet = \"Hello\"\
  ; // 变量声明\n  string *ptr = &greet; // *ptr 访问 \"greet\" 的值\n}\n```\n\n\n\n\n\n```cpp\n\
  cout << ptr << \"\\n\";      // 显示 ptr 指向的 greet 地址\ncout << *ptr << \"\\n\";  \
  \   // 显示 *pt 访问的 greet 值\nreturn 0;\n}\n```\n**Output:**\n```\n0x7ffdb3c71d70\n\
  Hello\n```\n\n`string *ptr = &greet;`: 这行代码意味着通过解引用指针 `*ptr` 通过指针访问 `\"greet\"`\
  \ 的值。\n\n### 析构函数语法\n\n```cpp\n~ destructor( );\n```\n析构函数用于释放内存占用，清理构造函数产生的数据。\n\
  析构函数的名称与类名相同，但前面有一个 `~` 符号。\n析构函数没有任何参数，也没有返回值。\n\n例如：\n```cpp\nclass Flower { \
  \    // 声明一个类\npublic:\nstring c1, c2;\nFlower() {  c1= \"yellow\";  c2 = \"purple\"\
  ; } ;  // 构造函数\n~ Flower();      // 定义析构函数。\n};\n```\n析构函数的声明必须紧跟构造函数之后。\n\n###\
  \ detach() 语法\n\n```cpp\nthreadObj.detach();\n```\n将指定的线程与线程对象分离。\n线程退出后，所有分配的资源将被释放。\n\
  \n例如：\n```cpp\n#include <iostream>\n#include <chrono>\n#include <thread>\nvoid func02()\
  \ {\n  std::cout << \"Start thread02.\\n\";\n  std::this_thread::sleep_for(std::chrono::seconds(3));\n\
  \  std::cout << \"Exit thread02.\\n\";\n}\n\nvoid func01() {\n  std::cout << \"\
  Start thread01.\\n\";\n  std::thread th(func02);\n  th.detach();   // 将线程从线程对象中分离\n\
  \  std::this_thread::sleep_for(std::chrono::seconds(2));\n  std::cout << \"Exit\
  \ thread01.\\n\";\n}\n\nint main() {\n  func01();\n  std::this_thread::sleep_for(std::chrono::seconds(4));\n\
  }\n```\n**Output:**\n```\nStart thread01.\nStart thread02.\nExit thread01.\nExit\
  \ thread02.\n```\n\n### div() 语法\n\n```cpp\ndiv(x, y).quot // 返回 x/y 的商\ndiv(x,\
  \ y).rem  // 返回 x/y 的余数\n```\n例如：\n```cpp\n#include <iostream>\n#include <cstdlib>\n\
  using namespace std;\nint main(){\n  cout << \"Quotient of 19/2 = \" << div(19,\
  \ 2).quot << endl;\n  cout << \"Remainder of 19/2 = \" << div(19, 2).rem << endl;\n\
  }\n```\n**Output:**\n```\nQuotient of 19/2 = 9\nRemainder of 19/2 = 1\n```\n\n###\
  \ do / while 循环语法\n\n```cpp\ndo{ // 在此处编写某些 c++ 代码 } while ( test-expression);\n\
  ```\n`do...while` 循环执行一次代码块，如果指定的指定的条件为真，则重复循环。\n`do…while` 先执行代码，再检查条件。\n\n例如：\n\
  ```cpp\nint counter = 0;\ndo {    // 在检查条件之前运行代码\n  cout <<  \"@\";\n  counter++;\n\
  } while (counter < 8);      // 运行 8 次\n```\n**Output:**\n```\n@@@@@@@@\n```\n\n\
  ### e.what( ) 语法\n\n```cpp\ntry\n{…}\ncatch(exception& e)\n{\n  cout  << e.what(\
  \ )  <<endl;\n}\n```\n`e.what( )` 可以产生异常消息。\n`e` 是一个异常对象。\n\n例如：\n```cpp\nint main\
  \ () {\n  string str = \"JavaScript\";\n  try{\n    str.at(100);\n  }\n  catch(exception\
  \ &e){  // e 是异常对象\n  cout<<\"Catch an exception: \"<< e.what( ) << endl;\n  //\
  \ \"e.what( )\" 创建了一个异常消息。\n  }\n  return 0;\n}\n```\n**Output:**\n```\nCatch an\
  \ exception: basic_string::at: __......\n```\n\n### empty() 语法\n\n```cpp\nmyString.empty();\n\
  ```\n`myString.empty();` 可以测试用户在提交数据之前是否输入了单词或句子。如果 `myString` 为空，它返回 true，允许我们输入某些内容；否则返回\
  \ false。\n\n例如：\n```cpp\n#include <string>\n#include <iostream>\nusing namespace\
  \ std;\nint main( ) {\n  string myString;\n  if ( myString.empty()) {    // 如果还没有输入内容\n\
  \  cout << \"Please enter your name: \";\n  getline (cin, myString);  // 假设输入了 John\
  \ Smith\n  cout << myString << endl;\n  }\n  else {\n  cout << \"You have entered\
  \ your name, thank you! \";\n  }\n  return 0;\n}\n```\n**Output:**\n```\nPlease\
