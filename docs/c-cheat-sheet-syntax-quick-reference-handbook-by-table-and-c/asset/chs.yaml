  \n### `virtual` 语法：\n\n```cpp\nclass AbstractClass;\nvirtual type functionName(\
  \ ) = 0;\n```\n\n- `virtual type functionName( ) = 0;` 定义了一个 `纯虚方法`。\n- 任何包含 `virtual\
  \ function` 的类都是 `抽象类`。\n- 它必须始终由派生类重写。\n\ne.g.\n\n```cpp\n#include <iostream>\n\
  using namespace std;\n\nclass Ball {\npublic:\n    virtual void play( ) = 0;\n};\n\
  \nclass Volleyball: public Ball {\npublic:\n    void play( ) {\n        cout <<\
  \ \"Play volleyball.\" << endl;\n    }\n};\n\nclass Football: public Ball {\npublic:\n\
  \    void play( ) {\n        cout << \"Play football.\" << endl;\n    }\n};\n\n\
  void sport(Ball &b){\n    b.play();\n}\n\nint main((){\n    Volleyball v;\n    Football\
  \ f;\n    sport(v);\n    sport(f);\n    return 0;\n}\n// 输出:\nPlay volleyball.\n\
  Play football.\n```\n\n---------------------------------------------------------------\n\
  \n### `while` 循环语法：\n\n```cpp\nwhile ( test-expression ) {  // 在此处编写 C++ 代码; }\n\
