  - `\"catch( ){  }\"` 捕获 `try` 块中的任何异常并处理。\n- 对于 `\"try-catch\"`，你需要使用 `#include<stdexcept>`。\n\
  \ne.g.\n\n```cpp\n#include <iostream>\n#include <stdexcept>\nusing namespace std;\n\
  \nint main(){\n    string str1 = \"JavaScript\";\n    string str2 = \"and\";\n \
