  \n### 运算符重载语法\n\n```cpp\nClassName operator + (args){\n}\n```\n\n```cpp\nobject3\
  \ = object1 + object2;\n```\n\n- `+`, `-`, `*`, `/` 定义了运算符重载。\n- 运算符重载可以加/减/乘除两个对象的属性，并返回一个新的对象。\n\
  \ne.g.\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nclass Carton{\npublic:\n\
  \    double getVolume( void ){ return length * width * height; }\n    void setLength(\
  \ double len ){ length = len; }\n    void setWidth( double wid ){ width = wid; }\n\
  \    void setHeight( double hei ){ height = hei; }\n    Carton operator + (const\
  \ Carton& obj){ // 运算符重载\n        Carton carton;\n        carton.length = this->length\
  \ + obj.length;\n        carton.width = this->width + obj.width;\n        carton.height\
  \ = this->height + obj.height;\n        return carton;\n    }\nprivate:\n    double\
  \ length;  double width;   double height;     \n};\n\nint main( ){\n    Carton carton1;\
  \   Carton carton2;   Carton carton3;             \n    double volume = 0.0;   \
  \  // 声明体积\n    carton1.setLength(7.0);\n    carton1.setWidth(8.0);\n    carton1.setHeight(6.0);\n\
  \    carton2.setLength(11.0);\n    carton2.setWidth(12.0);\n    carton2.setHeight(10.0);\n\
  \    volume = carton1.getVolume();\n    cout << \"Volume of carton1 : \" << volume\
  \ <<endl;\n    volume = carton2.getVolume();\n    cout << \"Volume of carton2 :\
  \ \" << volume <<endl;\n    carton3 = carton1 + carton2;   // 相加两个对象\n    volume\
  \ = carton3.getVolume();\n    cout << \"Volume of carton3 : \" << volume <<endl;\n\
  \    return 0;\n}\n```\n```cpp\n// Output:\nVolume of carton1 : 336\nVolume of carton2\
  \ : 1320\nVolume of carton3 : 5760\n```\n\n------------------------------------------------------------------------------\n\
  \n### 运算符重载语法\n\n```cpp\nClassName operator * (args){\n}\n```\n\n```cpp\nobject3\
  \ = object1 * object2;\n```\n\n- `+`, `-`, `*`, `/` 定义了运算符重载。\n- 运算符重载可以加/减/乘/除两个对象的属性，并返回一个新的对象。\n\
  \ne.g.\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nclass Carton{\npublic:\n\
  \    double getVolume( void ){ return length * width * height; }\n    void setLength(\
  \ double len ){ length = len; }\n    void setWidth( double wid ){ width = wid; }\n\
  \    void setHeight( double hei ){ height = hei; }\n    Carton operator*(const Carton&\
  \ obj){ // 运算符重载\n        Carton carton;\n        carton.length = this->length *\
  \ obj.length;\n        carton.width = this->width * obj.width;\n        carton.height\
  \ = this->height * obj.height;\n        return carton;\n    }\nprivate:\n    double\
  \ length;  double width;   double height;     \n};\n\nint main( ){\n    Carton carton1;\
  \   Carton carton2;   Carton carton3;             \n    double volume = 0.0;   \
  \  // 声明体积\n    carton1.setLength(7.0);\n    carton1.setWidth(8.0);\n    carton1.setHeight(6.0);\n\
  \    carton2.setLength(11.0);\n    carton2.setWidth(12.0);\n    carton2.setHeight(10.0);\n\
  \    volume = carton1.getVolume();\n    cout << \"Volume of carton1 : \" << volume\
  \ <<endl;\n    volume = carton2.getVolume();\n    cout << \"Volume of carton2 :\
  \ \" << volume <<endl;\n    carton3 = carton1 * carton2;   // 相乘两个对象\n    volume\
  \ = carton3.getVolume();\n    cout << \"Volume of carton3 : \" << volume <<endl;\n\
  \    return 0;\n}\n```\n```cpp\n// Output:\nVolume of carton1 : 336\nVolume of carton2\
  \ : 1320\nVolume of carton3 : 443520\n```\n\n-------------------------------------------------------------------------------\n\
