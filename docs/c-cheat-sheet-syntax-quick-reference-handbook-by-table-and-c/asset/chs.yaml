  \ character\";}\n  else{ cout << c << \" is not an uppercase character\";}\n}\n\
  // 输出: A is an uppercase character\n```\n\n## join() 语法\n\n`thread t1(threadFunction,\
  \ argument);`    // 创建线程 t1\n`t1.join();`      // t1 合并主线程\n`thread t2(threadFunction,\
  \ argument);`  // 创建线程 t2\n`t2.join();`      // t2 合并主线程\n`thread t3(threadFunction,\
  \ argument);`  // 创建线程 t3\n`t3.join();`      // t3 合并主线程\n// `threadName.join()`可以将当前线程合并到主线程\n\
  \ne.g.\n\n```cpp\nvoid threadFunction(arg){\n  cout << \"I am the running function\
  \ of the thread\" << endl;\n}\n\nint main(){\n  thread t1(threadFunction, argument);\
  \   // 创建线程 t1\n  t1.join();      // t1 合并主线程\n  thread t2(threadFunction, argument);\
  \  // 创建线程 t2\n  t2.join();      // t2 合并主线程\n  thread t3(threadFunction, argument);\
  \  // 创建线程 t3\n  t3.join();      // t3 合并主线程\n  return (0);\n}\n\nt1.detach(); \
  \   // 将 t1 从主线程分离\nif (t1.joinable()){    // 检查 t1 是否可以合并主线程\n  t1.join();\n}\n\
  else{\n  cout << \"t1 is detached\" << endl;\n}\n// 上述代码是多线程的主结构\n```\n\n## joinable()\
  \ 语法\n\n`threadObj.joinable()`\n\n// 如果线程对象可以合并，则返回 1，否则返回 0。\n// 只有在线程运行结束后，另一个线程才能被合并。\n\
  \ne.g.\n\n```cpp\n#include <iostream>\n#include <thread>\n\nvoid func() {\n  std::this_thread::sleep_for(std::chrono::seconds(2));\n\
  }\n\nint main() {\n  std::thread t;\n  t = std::thread(func);    // 创建一个线程对象\n \
  \ std::cout<<\"Before joining, will be joinable? \"<< t.joinable()'\\n';\n  t.join();\
  \      // 合并到线程对象\n  std::cout<<\"After joining, will be joinable? \"<< t.joinable()'\\\
  n';\n}\n// 输出:\nBefore joining, will be joinable? 1\nAfter joining, will be joinable?\
  \ 0\n```\n\n## lambda 函数 语法\n\n`[ ] (parameters)->return-type{body}`\n\n// Lambda\
  \ 表达式将函数视为对象。我们可以将其赋值给变量并作为参数传递，还可以像函数一样求值它们。\n\ne.g.\n\n```cpp\n#include <iostream>\n\
  using namespace std;\n\nint main() {\n  auto salute = [ ]()-> void{ // 创建一个 lambda\
