    \  }\n  return 0;\n}\n```\n**Output:**\n```\nCatch an exception: basic_string::at:\
    \ __......\n```\n\n### empty() syntax\n\n```cpp\nmyString.empty();\n```\n`myString.empty();`\
    \ can test whether a user has inputted a word or sentence before submitting data.\
