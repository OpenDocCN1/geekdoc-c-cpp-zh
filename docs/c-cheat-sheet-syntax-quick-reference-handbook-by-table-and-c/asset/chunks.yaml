    \n### cout 语法：\n\n```cpp\ncout << \"   \";  // 在同一行中打印结果\ncout << \"   \" << endl;\
    \ // 在不同行中打印结果\n```\ne.g.\n```cpp\ncout << \" 1 \";     // 在同一行输出\ncout << \"\
