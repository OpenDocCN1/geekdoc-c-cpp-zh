    \ ) << endl;\n// 获取元素个数\ncout<< \"The third element: \" << myVector.at(2) << endl;\n\
    // 获取索引 2 处的值\nmyVector.pop_back( );\n//  移除最后一个元素\ncout<< \"Final element has\
    \ been removed.\"<< endl;\nreturn 0;\n\n}\n```\n**输出:**\n```\nmyVector size: 3\n\
    The third element: 30\nFinal element has been removed.\n```\n\n## vector 方法语法\n\
