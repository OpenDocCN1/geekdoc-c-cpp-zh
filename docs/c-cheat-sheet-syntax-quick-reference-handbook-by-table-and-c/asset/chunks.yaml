    // 检查 vector 是否为空\nreturn 0;\n\n}\n```\n**输出:**\n```\nThe first element: 0\nThe\
    \ last element: 30\nmyVector is empty? 1 \n```\n\n## 虚函数语法\n\n`virtual type functionName(\
    \ );`\n\n- `virtual type functionName( );` 定义一个虚函数。当该函数被调用时，执行派生类中的重写函数，而不是基类中的函数。\n\
    \n### 示例\n```cpp\n#include<iostream>\nusing namespace std;\n\nclass Car{\npublic:\n\
    virtual void drive( ){    // 定义一个虚函数\ncout << \"Drive a car.\" << endl;\n}};\n\
    \nclass Van: public Car{\npublic:\nvoid drive( ){\ncout << \"Drive a van.\" <<\
    \ endl;\n}};\n\nclass Bus: public Car{\npublic:\nvoid drive( ){\ncout << \"Drive\
    \ a bus.\" << endl;\n}};\n\nvoid myFunction(Car &c){     // Car 的别名是 \"c\"。\n\
    c.drive( );    // 调用派生类中的 drive()\n}\n\nint main( ){\nVan v;   // 创建一个对象\nBus\
    \ b;   // 创建一个对象\nmyFunction(v);\nmyFunction(b);\nreturn 0;\n}\n```\n**输出:**\n\
    ```\nDrive a Van.\nDrive a Bus.\n```\n\n## 虚方法语法\n\n`virtual type method(){ }`\
    \ \n\n- 在基类中定义一个虚方法\n`type method(){ }`\n- 派生类中的方法重写基类中的虚方法。\n- 多态意味着基类中的方法可以被派生类中的多个方法所重写。\n\
    \n### 示例\n```cpp\n#include <iostream>\n#include <string>\nusing namespace std;\n\
    \nclass Animal {     // 基类\npublic:\nvirtual void yell() {     // 虚方法\n}\n};\n\
    \nclass Cat : public Animal {    // 派生类\npublic:\nvoid yell() {\ncout << \"The\
    \ cat yells: mew mew \\n\" ;\n}\n};\n\nclass Dog : public Animal {    // 派生类\n\
    public:\nvoid yell() {\ncout << \"The dog yells: wow wow \\n\" ;\n}\n};\n\nint\
    \ main() {\nCat myCat;\nDog myDog;\nmyCat.yell();\nmyDog.yell();\nreturn 0;\n\
    }\n```\n**输出:**\n```\nThe cat yells: mew mew\nThe dog yells: wow wow\n```\n\n\
    ## volatile 语法\n\n- `int volatile variable;`     // 声明变量\n- `volatile int variable;`\
    \     // 声明变量\n- `int volatile *pointer;` // 声明指针\n- `volatile int *pointer;`\
    \ // 声明指针\n- `volatile` 告诉编译器多线程中的变量值可能会在任何时间意外变化；编译器应该从内存读取变量而不是寄存器。\n- `volatile`\
    \ 告诉编译器不要优化此值。\n- `volatile` 告诉编译器不要在寄存器中缓存变量。\n- `volatile` 告诉编译器不要改变赋值顺序。\n\n\
    ### 示例\n```cpp\nint main(){\nvolatile int number;\nnumber++;\n}\nint main(){\n\
    int number;\nnumber++;\n}\n```\n**解析:**\n`volatile int`: 无法从内存拷贝到寄存器。\n`int number`:\
    \ 可以从内存拷贝。\n\n## write() 语法\n\n`cout.write(stringArray, stringLength);`\n\n- `stringArray`\
