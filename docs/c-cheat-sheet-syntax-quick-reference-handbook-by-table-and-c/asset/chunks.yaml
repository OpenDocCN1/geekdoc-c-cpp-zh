    ## Time Functions


    - `struct tm *localtime(const time_t *time)`: return a "tm" pointer that points
    to the local time.

    - `clock_t clock(void)`: return the elapsing time of processor clock from starting
    the program.

    - `char * asctime(const struct tm * time)`: return a pointer that points to the
    string with information about time.

    - `struct tm *gmtime(const time_t *time)`: return a pointer that points to the
    GMT.

    - `time_t mktime(struct tm *time)`: return a time since epoch time by converting
    the local calendar time.

    - `double difftime(time_t time2, time_t time1)`: return the number of seconds
    between `time1` and `time2`.

    - `size_t strftime()`: return a specified format of the date and time.


