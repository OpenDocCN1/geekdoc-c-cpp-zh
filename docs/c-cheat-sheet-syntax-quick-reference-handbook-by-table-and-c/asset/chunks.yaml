    \ = value;` // 定义全局变量\n`void myFunction ()` // 定义函数\n`int local_variable = value;`\
    \ // 定义局部变量\n// 局部变量定义在函数内部。\n// 全局变量定义在函数外部。\n\ne.g.\n\n```cpp\n#include <iostream>\n\
