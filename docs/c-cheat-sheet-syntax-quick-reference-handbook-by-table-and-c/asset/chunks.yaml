  trans: "\n\n# `memcmp()` 语法\n\n`memcmp(object1, object2, num)`\n\n// 按字母顺序比较两个对象\n\
    // \"num\" 指定了要比较的最大字节数\n\ne.g.\n```cpp\n#include <cstring>\n#include <iostream>\n\
    \nusing namespace std;\nint main(){\n    int comp = memcmp(\"abcd\", \"efg\",\
    \ 4);\n    if ( comp == 0 ){ cout << \"abcd = efg\"; }\n    if ( comp > 0 ){ cout\
    \ << \"abcd > efg\"; }\n    if ( comp < 0 ){ cout << \"abcd < efg\"; }\n}\n//\
    \ Output: abcd < efg\n```\n\n# 内存分配语法\n\n`variable = new type;` // 为变量分配内存\n`*variable\
    \ = value;` // 将值存储到内存地址\n`delete variable;` // 释放变量内存\n\ne.g.\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\nint main (){\n    double* myVar = NULL; //\
    \ 初始化指针为 Null\n    myVar = new double;    // 为变量分配内存\n    *myVar = 100;      \
    \   // 将值存储到内存地址\n    cout << \"Value of myVar : \" << *myVar << endl;\n    delete\
    \ myVar;         // 释放变量内存\n    return 0;\n}\n// Output: Value of myVar : 100\n\
    ```\n\n# 内存分配语法\n\n`MyClass* myArr = new MyClass[3];` // 分配数组内存\n`delete [] myArr;`\
    \ // 释放数组内存\n\ne.g.\n```cpp\n#include <iostream>\nusing namespace std;\nclass\
    \ MyClass{\npublic:\n    MyClass() {\n        cout << \"Call constructor!\" <<endl;\n\
    \    }\n    ~MyClass() {\n        cout << \"Call destructor!\" <<endl;\n    }\n\
    };\nint main( ){\n    MyClass* myArr = new MyClass[3]; // 分配内存\n    delete []\
    \ myArr;                // 释放内存\n    return 0;\n}\n// Output:\nCall constructor!\n\
    Call constructor!\nCall constructor!\nCall destructor!\nCall destructor!\nCall\
    \ destructor!\n```\n\n# 多重继承语法\n\n`class ParentClass { // 父类 };`\n`class ChildClass:\
    \ public ParentClass { // 子类 };`\n`class GrandSonClass: public ChildClass { //\
    \ 孙子类 };`\n\n// 孙子类可以派生自子类，子类可以派生自父类。\n\ne.g.\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\nclass ParentClass { // 父类\npublic:\n    void myFunction() {\n\
    \        cout << \"The treasure from the parents\" ;\n    }\n};\nclass ChildClass:\
    \ public ParentClass { // 子类 };\nclass GrandSonClass: public ChildClass { // 孙子类\
    \ };\nint main() {\n    GrandSonClass myObj;\n    myObj.myFunction();\n    return\
    \ 0;\n}\n// Output:\nThe treasure from the parents\n```\n\n# 多重继承语法\n\n`class\
    \ ParentClass1 { // 父类 1 };`\n`class ParentClass2 { // 父类 2 };`\n`class ChildClass:\
    \ public ParentClass1, public ParentClass2 { }`\n\n// 子类派生自 ParentClass1 和 ParentClass2\n\
    // 子类可以通过逗号分隔每个父类，从而派生自多个父类。\n\ne.g.\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nclass ParentClass1 { // 父类 1\npublic:\n    void function1() {\n      \
    \  cout << \"Some treasures from parent class1.\\n\" ;\n    }\n};\nclass ParentClass2\
    \ { // 父类 2\npublic:\n    void function2() {\n        cout << \"Some treasures\
    \ from parent class2.\\n\" ;\n    }\n};\nclass ChildClass: public ParentClass1,\
    \ public ParentClass2 { };\nint main() {\n    ChildClass myObj;\n    myObj.function1();\n\
    \    myObj.function2();\n    return 0;\n}\n// Output:\nSome treasures from parent\
    \ class1.\nSome treasures from parent class2.\n```\n\n# 多线程语法\n\n`thread t1(threadFunction,\
    \ argument);` // 创建线程 t1\n`t1.join();` // t1 等并主线程\n`thread t2(threadFunction,\
    \ argument);` // 创建线程 t2\n`t2.join();` // t2 等并主线程\n`thread t3(threadFunction,\
    \ argument);` // 创建线程 t3\n`t3.join();` // t3 等并主线程\n\n// 多线程可以处理多个任务。\n\ne.g.\n\
    ```cpp\nvoid threadFunction(arg){\n    cout << \"I am the function of the thread\"\
    \ << endl;\n}\nint main(){\n    thread t1(threadFunction, argument);\n    t1.join();\n\
    \    thread t2(threadFunction, argument);\n    t2.join();\n    thread t3(threadFunction,\
    \ argument);\n    t3.join();\n    t1.detach(); // 将 t1 与主线程分离\n    if (t1.joinable()){\
    \ // 检查 t1 是否可以等并主线程\n        t1.join();\n    }\n    else{\n        cout << \"\
    t1 is detached\" << endl;\n    }\n    return 0;\n}\n// 以上代码是多线程的结构\n```\n\n# 命名空间语法\n\
    \n`namespace namespace_name { }` // 声明命名空间\n`namespace_name::variable;` // 引用变量\n\
    `namespace_name::function;` // 引用函数\n\n// 命名空间用于解决冲突问题。\n\ne.g.\n```cpp\n#include\
