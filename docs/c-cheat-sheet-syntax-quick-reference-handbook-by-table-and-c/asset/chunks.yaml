    \    }\n}\nint main (){\n    x_space::func(); // 调用 x_space 中的函数\n    y_space::func();\
    \ // 调用 y_space 中的函数\n    return 0;\n}\n// Output:\nThis is x_space\nThis is y_space\n\
    ```\n\n# 空指针语法\n\n`int *pointer = NULL;`\n\n// 空 指针是一个值为 零的常量。\n\ne.g.\n```cpp\n\
    #include <iostream>\nusing namespace std;\nint main (){\n    int *ptr = NULL;\n\
    \    cout << \"The value of the ptr is \" << ptr;\n    return 0;\n}\n// Output:\
    \ The value of the ptr is 0\n```\n\n# 对象创建语法\n\n`ClassName objectName;` // 创建一个对象\n\
    `object.variable;` // 对象引用一个变量\n`object.method-name();` // 对象引用一个方法\n\n// 对象是类的实例。\n\
    \ne.g.\n```cpp\n#include<string>\n#include <iostream>\nusing namespace std;\n\
