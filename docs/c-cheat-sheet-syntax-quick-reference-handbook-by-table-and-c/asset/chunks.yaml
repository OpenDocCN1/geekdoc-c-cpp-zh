    \ 类型 vector \"titles\"。\n\n## vector 方法语法\n\n- `v.push_back(value)` // 向 vector\
    \ 的末尾添加一个元素\n- `v.size( ) // 返回 vector 的大小\n- `v.at(index)` // 返回 vector 在指定索引处的值\n\
    - `v.pop_back( ) // 删除 vector 的最后一个元素\n\n### 示例\n```cpp\nint main (){\n\nvector\
    \ < int > myVector(1);  // 创建包含 1 个元素的 vector。\nmyVector.push_back(20); //  在末尾添加元素\
