    insert() syntax:


    originalString = insert(index, substring);


    // "originalString = insert(index, substring);" can insert a substring into an
    original string.


    // "index" means a position where inserting a substring.


    e.g.


    #include<string>


    #include <iostream>


    using namespace std;


