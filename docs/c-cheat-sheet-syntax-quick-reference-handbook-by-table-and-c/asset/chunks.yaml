    public:\n    MyClass() {} // 构造函数\n    ~MyClass() {} // 析构函数\n};\n```\n\n## 宏定义语法：\n\
    \n`#define NAME value`\n\n// `#define` 用于定义一个宏。\n// 宏在预编译阶段会被替换为值。\n\n例如：\n\n\
