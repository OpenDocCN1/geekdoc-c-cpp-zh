    \n例如：\n\n```cpp\ntemplate <typename T>\nT max(T a, T b) {\n    return (a > b)\
    \ ? a : b;\n}\n```\n"
- fmt: "\n# anonymous function syntax\n\n`[ ] (parameters)->return-type{body}`\n\n\
    // `Lambda` expressions treat a function as an object. We can assign them to variables\
    \ and pass them as arguments, and we can evaluate them as functions.\n\ne.g.\n\
    \n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main() {\n    auto\
    \ salute = []()-> void {// create a lambda function\n        cout << \"Hi, My\
    \ friends!\";\n    };\n\n    salute();     // call the lambda function\n    return\
    \ 0;\n}\n```\n// Output: Hi, My friends!\n\n# array creating (1) syntax\n\n`int\
    \ arrayName[] = {\"value0\", \"value1\", \"value2\",…};`\n\n// Create an array\
    \ with some elements\n\ne.g.\n```cpp\nint main() {\n    int myArray[] = { 10,11,12\
    \ };   // create an array\n    cout<<myArray[0]<<endl;      // access the array\
    \ element\n    cout<<myArray[1]<<endl;      // access the array element\n    cout<<myArray[2]<<endl;\
    \      // access the array element\n}\n```\n// Output: 10  11  12\n\n# array creating\
    \ (2) syntax\n\n`type arrayName[ size ];`\n\n`type arrayName[index0] = \"value1\"\
    ;`\n\n`type arrayName[index1] = \"value1\";`\n\n`type arrayName[index2] = \"value2\"\
    ;`\n\n// Declare an array first, then assign values to array elements.\n\ne.g.\n\
    ```cpp\nint main( ) {\n    string color[3];         // declare an array\n    color\
    \ [0] = \"Red  \";   // assign the value to the array\n    color [1] = \"Yellow\
    \ \";\n    color [2] = \"Green  \";\n    cout<< color[0]<<color[1]<<color[2];\n\
    \    return 0;\n}\n```\n// Output: Red  Yellow  Green\n\n# array element's value\
    \ syntax\n\n`int value = array[index];`\n\n// get a value from an element.\n\n\
    `int array[index] = value;`\n\n// set a value to an element.\n\ne.g. (1)\n```cpp\n\
    int arr[5] = {10, 20, 30, 40, 50};\nint value = arr[2];     // get a value from\
    \ an element.\ncout <<  value << endl;   \n```\n// Output: 30\n\ne.g. (2)\n```cpp\n\
    int num[5] = {10, 20, 30, 40, 50};\nnum[3] = 800;     // set a value to an element.\n\
    cout << num[3] << endl;    \n```\n// Output: 800\n\n# array parameter syntax\n\
    \n`void functionName( type array ) { // array parameter\n}`\n\n`functionName(arr);\
