    return 0;


    };


    // Output:  Flower is very beautiful!


    -------------------------------------------------------------------------------


    isalnum() syntax:


    isalnum(''character'')


    // Check whether the given character is alphanumeric or not.


    e.g.


    #include <iostream>


    #include <cctype>


    using namespace std;


