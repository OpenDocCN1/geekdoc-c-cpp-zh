    \ c << \" is an uppercase character\";}\n  else{ cout << c << \" is not an uppercase\
    \ character\";}\n}\n// 输出: A is an uppercase character\n```\n\n# join() 语法\n\n\
    `thread t1(threadFunction, argument);`    // 创建线程 t1\n`t1.join();`      // t1\
    \ 合并主线程\n`thread t2(threadFunction, argument);`  // 创建线程 t2\n`t2.join();`    \
    \  // t2 合并主线程\n`thread t3(threadFunction, argument);`  // 创建线程 t3\n`t3.join();`\
    \      // t3 合并主线程\n// `threadName.join()`可以将当前线程合并到主线程\n\ne.g.\n\n```cpp\nvoid\
    \ threadFunction(arg){\n  cout << \"I am the running function of the thread\"\
    \ << endl;\n}\n\nint main(){\n  thread t1(threadFunction, argument);   // 创建线程\
    \ t1\n  t1.join();      // t1 合并主线程\n  thread t2(threadFunction, argument);  //\
