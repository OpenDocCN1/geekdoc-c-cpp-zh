    \n`log10(num)`\n\n// 返回数字以 10 为底的对数。\n\ne.g.\n\n```cpp\n#include <iostream>\n\
    #include <cmath>\nusing namespace std;\n\nint main(){\n  cout << \"log10(100)\
    \ = \" << log10(100);\n}\n// 输出: log10(100) = 2\n\n# math 函数 语法\n\n`math_function(x);`\n\
    `math_function(x, y);`\n\n// 常用的数学函数有 `sin()`, `cos()`, `tan()`, `exp()`, `round()`,\
