    // "fileObject" is an input-file object.


    // For processing a file, we need to import #include <fstream> first.


    e.g.


    // Assume that the path of the "myFile.txt" is "D:\\myFile.txt".


    // "myFile.txt" has content: "C++ is a very good language."


    #include <iostream>


    #include <fstream>


    #include <string>


    using namespace std;


    int main(){


    string myString;


    ifstream fileObject ( "D:\\myFile.txt" ); // create an object


    getline ( fileObject, myString ); // reads file to myString


    cout << myString <<endl;    // show the content of myString


    fileObject.close ( );


    return 0;


    }


    // Output:  C++ is a very good language.


    -------------------------------------------------------------------------------


    inheritance syntax:


    derived class : public base class


    // A base class can be inherited by its derived class. The derived class can inherit
    all public members of the base class.


    // The base class can be treated as a parent class.


    // The derived class can be treated as a child class.


    e.g.


    #include<string>


    #include <iostream>


    using namespace std;


    class Computer {   // base class


    public:


    void display( ){


    cout << "Computer OK!" << endl;


    }} ;


    class Laptop : public Computer { 


    // the derived class inherits the base class


    };


    int main ( ){


    Laptop Lt;    // derived class creates an object Lt


    Lt. display( );   // Lt calls the base class’s method


    return 0;


    }


    // Output:     Computer OK!


    -------------------------------------------------------------------------------


    inline function syntax:


    inline type functionName( );


    // The inline functions can increase the execution efficiency of a program. Whenever
    the inline function is called, the compiler will replace the function call with
    the actual code from the function.


    e.g.


    #include <iostream>


    using namespace std;


    inline int sum(int n);   // define an inline function


    int main( ){


    int number;


    cout << "Please enter a number: ";


    cin >> number;


    number = sum(number);


    cout << "Result: " << number << endl;


    number = sum(number);


    cout << "Result: " << number << endl;


    number = sum(number);


    cout << "Result: " << number << endl;


    }


    int sum(int n){


    return n + n;


    }   // assume that we input a number 3, and Enter


    // Output:


    Please enter a number:  3


    Result:  6


    Result: 12


    Result:  24


