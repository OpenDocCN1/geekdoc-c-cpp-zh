    Call constructor!\nCall constructor!\nCall destructor!\nCall destructor!\nCall\
    \ destructor!\n\n---\n\n### 解引用语法：\n\n```cpp\ndataType *pointer; // 声明指针\n*pointer\
    \ = &variable; // *pointer 访问变量的值\n```\n如果 `*pointer = &variable`，意味着可以通过指针根据变量的地址访问变量的值，这被称为指针的“解引用”。\n\
    \ne.g.\n```cpp\n#include <iostream>\n#include <string>\nusing namespace std;\n\
