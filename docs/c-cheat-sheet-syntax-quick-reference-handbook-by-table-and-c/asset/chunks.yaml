  trans: "\n\n## ifstream 语法\n\n`ifstream` 语法：\n\n```cpp\nifstream fileObject( \"\
    myFile.txt\" );  // 创建输入对象\ngetline( fileObject, myString);    // 从文件中读取 myString\n\
    ```\n\n- `ifstream fileObject ( \"myFile.txt\" );` 创建了一个输入文件对象 `fileObject`。\n\
    - `ifstream` 类用于从文件中读取数据。\n- `fileObject` 是一个输入文件对象。\n- 为了处理文件，我们需要先导入 `#include\
    \ <fstream>`。\n\n### 示例\n\n\n\n假设 `\"myFile.txt\"` 的路径为 `\"D:\\\\myFile.txt\"\
    `。\n`\"myFile.txt\"` 的内容为：\"C++ is a very good language.\"`\n\n```cpp\n#include\
    \ <iostream>\n#include <fstream>\n#include <string>\n\nusing namespace std;\n\n\
    int main(){\n    string myString;\n    ifstream fileObject ( \"D:\\\\myFile.txt\"\
    \ ); // 创建一个对象\n    getline ( fileObject, myString ); // 将文件读取到 myString\n   \
    \ cout << myString <<endl;    // 显示 myString 的内容\n    fileObject.close ( );\n\
    \    return 0;\n}\n```\n// 输出：`C++ is a very good language.`\n\n## 继承语法\n\n继承语法：\n\
    \n`derived class : public base class`\n\n- 基类可以被其派生类继承。派生类可以继承基类的所有的公共成员。\n- 基类可以被父类。\n\
    - 派生类可以被视为子类。\n\n### 示例\n\n```cpp\n#include<string>\n#include <iostream>\n\nusing\
    \ namespace std;\n\nclass Computer {  // 基类\npublic:\n    void display( ){\n \
    \       cout << \"Computer OK!\" << endl;\n    }\n};\n\nclass Laptop : public\
    \ Computer { \n    // 派生类继承基类\n};\n\nint main ( ){\n    Laptop Lt;    // 派生类创建对象\
    \ Lt\n    Lt. display( );  // Lt 调用基类的方法\n    return 0;\n}\n```\n// 输出：`Computer\
    \ OK!`\n\n## 内联函数语法\n\n内联函数语法：\n\n`inline type functionName( );`\n\n- 内联函数可以提高程序的执行效率。每当调用内联函数时，编译器都会用函数中的实际代码替换函数调用。\n\
    \n### 示例\n\n```cpp\n#include <iostream>\nusing namespace std;\n\ninline int sum(int\
    \ n);   // 定义内联函数\nint main( ){\n    int number;\n    cout << \"Please enter a\
    \ number: \";\n    cin >> number;\n    number = sum(number);\n    cout << \"Result:\
    \ \" << number << endl;\n    number = sum(number);\n    cout << \"Result: \" <<\
    \ number << endl;\n    number = sum(number);\n    cout << \"Result: \" << number\
    \ << endl;\n}\n\nint sum(int n){\n    return n + n;\n}   // 假设我们输入了数字 3 并回车\n\
    ```\n// 输出：\n`Please enter a number: 3`\n`Result: 6`\n`Result: 12`\n`Result: 24`\n\
    \n## 用户输入语法\n\n用户输入语法：\n\n`cin >> variable;`\n\n- 从键盘获取用户输入。\n\n### 示例\n\n```cpp\n\
    int main() {\n    int num;\n    cout << \"Please enter a number: \";\n    cin\
    \ >> num;  // 接受用户数字\n    cout << num;\n    return 0;\n}\n```\n// 输出：`Please enter\
    \ a number: 100`\n\n## 字符输入语法\n\n字符输入语法：\n\n`cin.get(char c );`\n\n- 字符始终由一对单引号包含。\n\
    \n### 示例\n\n```cpp\nint main(){\n    char c;\n    cout << \"Input character: \"\
    ;\n    cin.get( c );  // 输入字符\n    cout << c <<endl;  // 输出字符\n    return 0;\n\
    } // 假设我们通过键盘输入了字符 \"A\"\n```\n// 输出：`Input character: A`\n\n## 字符串输入语法\n\n字符串输入语法：\n\
    \n`cin >> variable;`\n\n- `cin >> variable` 可以输入单个单词。\n\n### 示例\n\n```cpp\n#include\
    \ <string>\n#include <iostream>\nusing namespace std;\n\nint main( ) {\n    string\
    \ myString;\n    cout << \"Please enter a word: \"<< endl;\n    cin >> myString;\
    \  // 输入 GOOD\n    cout << myString <<endl;\n    return 0;\n}\n```\n// 输出：`Please\
    \ enter a word: GOOD`\n\n## getline 字符串语法\n\n字符串输入语法：\n\n`getline(cin, myString);`\n\
    \n- `getline(cin, myString)` 可以允许用户输入句子。\n\n### 示例\n\n```cpp\n#include <string>\n\
    #include <iostream>\nusing namespace std;\n\nint main( ) {\n    string myString;\n\
    \    cout << \"Please enter a sentence: \" << endl;\n    getline(cin, myString);\
    \  // 输入 \"C++ is Very Good!\"\n    cout << myString << endl;\n    return 0;\n\
    }\n```\n// 输出：`Please enter a sentence: C++ is Very Good!`\n\n## insert() 语法\n\
    \ninsert() 语法：\n\n`originalString = insert(index, substring);`\n\n- `originalString\
    \ = insert(index, substring)` 可以向原始字符串中插入子字符串。\n- `index` 表示插入子字符串的位置。\n\n###\
    \ 示例\n\n```cpp\n#include<string>\n#include <iostream>\nusing namespace std;\n\n\
    int main( ) {\n    string originalString = \"Flower is beautiful!\";\n    string\
    \ substring = \"very \";\n    originalString.insert(10, substring); // 插入子字符串\n\
    \    cout << originalString << endl;\n    return 0;\n}\n```\n// 输出：`Flower is\
    \ very beautiful!`\n\n## isalnum() 语法\n\nisalnum() 语法：\n\n`isalnum('character')`\n\
    \n- 检查给定字符是否为字母数字。\n\n### 示例\n\n```cpp\n#include <iostream>\n#include <cctype>\n\
    using namespace std;\n\nint main(){\n    char c = '9';\n    if(isalnum(c)){ cout\
    \ << c << \" is alpha-numeric\";}\n    else{ cout << c << \" is not alpha-numeric\"\
    ;}\n}\n```\n// 输出：`9 is alpha-numeric`\n\n## isalpha() 语法\n\nisalpha() 语法：\n\n\
    `isalpha('character')`\n\n- 检查给定字符是否为字母。\n\n### 示例\n\n```cpp\n#include <iostream>\n\
    #include <cctype>\nusing namespace std;\n\nint main(){ \n    char c = '9';\n \
    \   if(isalpha(c)){ cout << c << \" is alphabetic\";}\n    else{ cout << c <<\
    \ \" is not alphabetic\";}\n}\n```\n// 输出：`9 is not alphabetic`\n\n## is_compound<>\
    \ 语法\n\nis_compound<> 语法：\n\n`is_compound<type>::value`\n\n- 如果指定类型是复合类型，返回 1；否则返回\
    \ 0。\n- 复合类型指数组、函数、指针、引用、联合体、类和枚举类型等……\n\n### 示例\n\n```cpp\n#include <iostream>\n\
    #include <type_traits>\nusing namespace std;\n\nint main() {\n    cout << \"char:\
    \ \" << is_compound<char>::value << endl;\n    cout << \"double: \" << is_compound<double>::value\
    \ << endl;\n    cout << \"float*: \" << is_compound<float*>::value << endl;\n\
    \    cout << \"double&: \" << is_compound<double&>::value << endl;\n    cout <<\
    \ \"bool: \" << is_compound<bool>::value << endl;\n    return 0;\n}\n```\n// 输出：\n\
    `char: 0`\n`double: 0`\n`float*: 1`\n`double&: 1`\n`bool: 0`\n\n## isdigit() 语法\n\
    \nisdigit() 语法：\n\n`isdigit('character')`\n\n- 检查给定字符是否为数字。\n\n### 示例\n\n```cpp\n\
    #include <iostream>\n#include <cctype>\nusing namespace std;\n\nint main(){ \n\
    \    char c = '9';\n    if(isdigit(c)){ cout << c << \" is a digit\";}\n    else{\
    \ cout << c << \" is not a digit\";}\n}\n```\n// 输出：`9 is a digit`\n\n## isgraph()\
    \ 语法\n\nisgraph() 语法：\n\n`isgraph('character')`\n\n- 检查给定字符是否可打印。\n\n### 示例\n\n\
    ```cpp\n#include <iostream>\n#include <cctype>\nusing namespace std;\n\nint main(){\
    \ \n    char c = '9';\n    if(isgraph(c)){ cout << c << \" is printable\";}\n\
    \    else{ cout << c << \" is not printable\";}\n}\n```\n// 输出：`9 is printable`\n\
    \n## islower() 语法\n\nislower() 语法：\n\n`islower('character')`\n\n- 检查给定字符是否为小写字母。\n\
    \n### 示例\n\n```cpp\n#include <iostream>\n#include <cctype>\nusing namespace std;\n\
    \nint main(){ \n    char c = 'A';\n    if(islower(c)){ cout << c << \" is an lowercase\
    \ character\";}\n    else{ cout << c << \" is not an lowercase character\";}\n\
    }\n```\n// 输出：`A is not an lowercase character`\n\n"
- fmt: "\n# ispunct() syntax\n\n`ispunct('character')`\n\n// Check whether the given\
    \ character is a punctuation character or not.\n\ne.g.\n\n```cpp\n#include <iostream>\n\
    #include <cctype>\nusing namespace std;\n\nint main(){  \n  char c = '?';\n  if(ispunct(c)){\
    \ cout << c << \" is a punctuation character\";}\n  else{ cout << c << \" is not\
    \ a punctuation character\";}\n}\n// Output: ? is a punctuation character\n```\n\
    \n# isspace() syntax\n\n`isspace('character')`\n\n// Check whether the given character\
    \ is a space or not.\n\ne.g.\n\n```cpp\n#include <iostream>\n#include <cctype>\n\
    using namespace std;\n\nint main(){  \n  char c = 'A';\n  if(isspace(c)){ cout\
    \ << c << \" is a space\";}\n  else{ cout << c << \" is not a space\";}\n}\n//\
    \ Output: A is not a space\n```\n\n# isupper() syntax\n\n`isupper('character')`\n\
    \n// Check whether the given character is an uppercase character or not.\n\ne.g.\n\
    \n```cpp\n#include <iostream>\n#include <cctype>\nusing namespace std;\n\nint\
    \ main(){  \n  char c = 'A';\n  if(isupper(c)){ cout << c << \" is an uppercase\
    \ character\";}\n  else{ cout << c << \" is not an uppercase character\";}\n}\n\
    // Output: A is an uppercase character\n```\n\n# join() syntax\n\n`thread t1(threadFunction,\
    \ argument);`    // create thread t1\n`t1.join();`      // t1 join the main thread\n\
    `thread t2(threadFunction, argument);`  // create thread t2\n`t2.join();`    \
    \  // t2 join the main thread\n`thread t3(threadFunction, argument);`  // create\
    \ thread t3\n`t3.join();`      // t3 join the main thread\n// `threadName.join()`\
    \ can join the current thread to main thread\n\ne.g.\n\n```cpp\nvoid threadFunction(arg){\n\
    \  cout << \"I am the running function of the thread\" << endl;\n}\n\nint main(){\n\
    \  thread t1(threadFunction, argument);   // create thread t1\n  t1.join();  \
    \    // t1 join the main thread\n  thread t2(threadFunction, argument);  // create\
    \ thread t2\n  t2.join();      // t2 join the main thread\n  thread t3(threadFunction,\
    \ argument);  // create thread t3\n  t3.join();      // t3 join the main thread\n\
    \  return (0);\n}\n\nt1.detach();    // detach t1 from the main thread\nif (t1.joinable()){\
    \    // check if t1 can join the main thread\n  t1.join();\n}\nelse{\n  cout <<\
    \ \"t1 is detached\" << endl;\n}\n// The above code is the main structure of multithreading\n\
    ```\n\n# joinable() syntax\n\n`threadObj.joinable()`\n\n// Return 1 if a thread\
    \ object can be joinable, return 0 if not.\n// Only after a thread finishes running\
    \ can another thread be joinable.\n\ne.g.\n\n```cpp\n#include <iostream>\n#include\
    \ <thread>\n\nvoid func() {\n  std::this_thread::sleep_for(std::chrono::seconds(2));\n\
    }\n\nint main() {\n  std::thread t;\n  t = std::thread(func);    // create a thread\
    \ object\n  std::cout<<\"Before joining, will be joinable? \"<< t.joinable()'\\\
    n';\n  t.join();      // join to the thread object\n  std::cout<<\"After joining,\
    \ will be joinable? \"<< t.joinable()'\\n';\n}\n// Output:\nBefore joining, will\
    \ be joinable? 1\nAfter joining, will be joinable? 0\n```\n\n# lambda function\
    \ syntax\n\n`[ ] (parameters)->return-type{body}`\n\n// Lambda expressions treat\
    \ a function as an object. We can assign them to variables and pass them as arguments,\
    \ and we can evaluate them as functions.\n\ne.g.\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nint main() {\n  auto salute = [ ]()-> void{ // create\
    \ a lambda function\n    cout << \"Hi, My friends!\";\n  };\n  salute();     //\
    \ call the lambda function\n  return 0;\n}\n// Output: Hi, My friends!\n```\n\n\
    # lcm() syntax\n\n`std::lcm(num1, num2)`\n\n// Get the least common multiple of\
    \ two numbers\n\ne.g.\n\n```cpp\n#include <iostream>\n#include <numeric>\nusing\
    \ namespace std;\n\nint main(){\n  cout << \"lcm(100, 200) = \" << std::lcm(100,\
    \ 200) << endl;\n}\n// Output: lcm(100, 200) = 200\n```\n\n# local variable syntax\n\
    \n`int global_variable = value;` // define a global variable\n`void myFunction\
    \ ()` // define a function\n`int local_variable = value;` // define local variable\n\
    // Local variable is defined inside the function.\n// Global variable is defined\
    \ outside the function.\n\ne.g.\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nint global_variable = 100; // global variable\n\nvoid test1() {\n  int\
    \ local_variable = 30; // local variable\n}\n\nvoid test2 () {\n  int local_variable\
    \ = 50; // local variable\n}\n\nint main(){\n  test1();\n  test2();\n  cout <<\
    \ global_variable << endl;\n  return 0;\n}\n// (Note: Simplified for clarity)\n\
    ```\n\n# log() syntax\n\n`log(num)`\n\n// Return the natural logarithm of the\
    \ argument.\n\ne.g.\n\n```cpp\n#include <iostream>\n#include <cmath>\nusing namespace\
    \ std;\n\nint main(){\n  cout << log(100);\n}\n// Output: 4.60517\n```\n\n# log2()\
    \ syntax\n\n`log2(num)`\n\n// Return the base 2 logarithm for a number.\n\ne.g.\n\
    \n```cpp\n#include <iostream>\n#include <cmath>\nusing namespace std;\n\nint main(){\n\
    \  cout << \"log2(128) = \" << log2(128);\n}\n// Output: log2(128) = 7\n```\n\n\
    # log10() syntax\n\n`log10(num)`\n\n// Return the base 10 logarithm for a number.\n\
    \ne.g.\n\n```cpp\n#include <iostream>\n#include <cmath>\nusing namespace std;\n\
    \nint main(){\n  cout << \"log10(100) = \" << log10(100);\n}\n// Output: log10(100)\
