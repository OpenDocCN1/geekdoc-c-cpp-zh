    \n// `T` is a type parameter. It stands for different data type.\n\ne.g.\n\n```cpp\n\
    #include <iostream>\n\nusing namespace std;\n\ntemplate <typename T> T min(T a,\
    \ T b, T c){\n    // defines a function template \"min( )\"\n    if ( b < a )\
    \ a = b;\n    if ( c < a ) a = c;\n    return a;\n}\n\nint main( ){\n    int n,\
    \ n1 = 10, n2 = 20, n3 = 30;\n    double d, d1 = 10.01, d2 = 10.02, d3 = 10.03;\n\
    \    long g, g1= 67891, g2 = 67892, g3 = 67893;\n    n = min( n1, n2, n3 );\n\
    \    d = min( d1, d2, d3 );\n    g = min( g1, g2, g3 );\n    cout << n << endl;\n\
    \    cout << d << endl;\n    cout << g << endl;\n    return n + n;\n}\n```\n//\
