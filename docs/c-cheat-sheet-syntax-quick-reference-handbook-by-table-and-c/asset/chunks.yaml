    \  // 创建线程 t3\n  t3.join();      // t3 合并主线程\n  return (0);\n}\n\nt1.detach();\
    \    // 将 t1 从主线程分离\nif (t1.joinable()){    // 检查 t1 是否可以合并主线程\n  t1.join();\n\
    }\nelse{\n  cout << \"t1 is detached\" << endl;\n}\n// 上述代码是多线程的主结构\n```\n\n#\
