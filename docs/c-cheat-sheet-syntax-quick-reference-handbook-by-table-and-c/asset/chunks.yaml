    \  char* dt = ctime(&now);      // 将 \"now\" 转换为字符串类型\n  cout << dt << endl;\n\
    }\n```\nOutput: `Sun Aug  7    16:02:18    2022`\n\n---\n\n### 数据类型语法：\n\n```cpp\n\
    type variable = value;\n```\n数据类型指定了变量的属性。\n\ne.g.\n```cpp\n#include <iostream>\n\
    #include <string>\nusing namespace std;\n\nint main () {\n  int myNum = 10;  \
    \           // 整数\n  float myFloat = 10.99;      // 浮点数\n  double myDouble = 10.9999;\
    \  // 双精度浮点数\n  char myCharacter = 'C';     // 字符\n  bool myBool = true;     \
    \   // 布尔值\n  string myString = \"C Plus Plus\";   // 字符串\n  cout << \"int type:\
