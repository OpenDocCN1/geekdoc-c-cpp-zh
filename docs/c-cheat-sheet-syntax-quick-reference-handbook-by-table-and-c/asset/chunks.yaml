- fmt: "\n// Part of the C++ program will be compiled if the string has been defined\
    \ previously, it will not be compiled if the string has not been defined.\n\n\
    e.g.\n\n```cpp\n#include<iostream>\n\nusing namespace std;\n\n#define VARIABLE\
    \ \"This is a string.\"\n\nint main( ){\n\n#ifdef VARIABLE\ncout<< \"VARIABLE\
    \ has been defined\" <<endl;\n#else\ncout<< \"VARIABLE has not been defined\"\
    \ << endl;\n#endif\n\nreturn 0;\n}\n```\n// Output: VARIABLE has been defined.\n\
    \n## syntax:\n\n`token1 ## token2`\n\n// The `##` operator is used to join two\
    \ tokens.\n\ne.g.\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\n#define\
    \ concat(x, y) x ## y\n\n// convert \"concat(x, y)\" to \"xy\"\n\nint main(){\n\
    int mn = 200;\ncout << concat(m, n);\nreturn 0;\n}\n```\n// Output: 200\n// \"\
    concat(m, n)\" has been converted to \"mn\".\n\n## pointer syntax:\n\n`dataType\
    \ *pointer;` // declare a pointer\n`*pointer = &variable;` // `*pointer` accesses\
    \ the variable's value\n`pointer = &variable;` // pointer points to the variable's\
    \ address\n\n// \"dataType *pointer\" declares a pointer.\n// Pointer name is\
    \ preceded by a \" * \".\n// `&` operator gets the memory address of a variable.\n\
    \ne.g.\n\n```cpp\n#include <string>\n#include <iostream>\n\nusing namespace std;\n\
    \nint main( ) {\nint num = 20;\nint *pt = &num;      // *pt accesses the num's\
    \ value\ncout << \"The value of num is: \" << *pt << endl;\npt = &num;     //\
    \ pt points to the num's address\ncout << \"The address of num is: \" << pt <<\
    \ endl;\nreturn 0;\n}\n```\n// Output: The value of num is: 20\nThe address of\
    \ num is: 0x7fff1bbfbaa8\n\n## & operator syntax:\n\n`&variable` // `&` operator\
    \ gets the memory address of a variable.\n`*pointer = &variable;` // `*pointer`\
    \ accesses the variable's value.\n`pointer = &variable;` // pointer points to\
