    `n` bytes from the current position of the `fileObject`

    - `fileObject.seekg( n, ios::end )`: The file reading pointer is located in the
    `n` bytes from the end of the `fileObject`

    - `fileObject.seekg( n )`: The file reading pointer is located in the `n` bytes
    from the beginning of the `fileObject`

    - `fileObject.seekp( n, ios::beg )`: The file writing pointer is located in the
    `n` bytes from the beginning of the `fileObject`

    - `fileObject.seekp( n, ios::cur )`: The file writing pointer is moved forward
    `n` bytes from the current position of the `fileObject`

    - `fileObject.seekp( n, ios::end )`: The file writing pointer is located in the
    `n` bytes from the end of the `fileObject`

    - `fileObject.seekp( n )`: The file writing pointer is located in the `n` bytes
    from the beginning of the `fileObject`


