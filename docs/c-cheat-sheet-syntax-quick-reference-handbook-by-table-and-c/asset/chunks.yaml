- fmt: "\n```cpp\n// Output:   ( 10 , 20 )\n```\n\nWe can use the default constructor\
    \ to initialize an object with default value, implicitly invokes the default constructor.\n\
    \ne.g. (2)\n\n```cpp\n#include <iostream>\n\nclass Coordinate{ // define a class\n\
    \npublic:\n    int x, y;\n\n};\n\nint main(){\n    Coordinate c; // create and\
    \ initialize object \"c\" with default value\n    std::cout << \"(\" << c.x <<\
    \ \", \" << c.y << \")\";\n    return 0;\n}\n```\n```cpp\n// Output:   ( 0 , 0\
    \ )\n```\n\n-------------------------------------------------------------------------------\n\
    \n### `ofstream` syntax\n\n```cpp\nofstream fileObject (\"myFile.txt\"); // create\
    \ an output object\nfileObject << myString << endl; // write myString to file\n\
    ```\n\n- `ofstream fileObject (\"myFile.txt\");` creates an output-file object\
    \ `fileObject`.\n- The `ofstream` class is used to write data to a file.\n- `fileObject`\
    \ is an output-file object.\n- For processing a file, we need to use `#include\
    \ <fstream>` first.\n\ne.g.\n\n```cpp\n#include <iostream>\n#include <fstream>\n\
    #include <string>\nusing namespace std;\n\nint main(){\n    ofstream fileObject\
    \ ( \"D:\\\\myFile.txt\" ); // create an object\n    string myString = \"C++ is\
    \ a very good language.\";\n    fileObject << myString << endl; // write myString\
    \ to file\n    fileObject.close ( );\n    cout << \"Write to file successfully!\"\
    \ << endl;\n    return 0;\n}\n```\n```cpp\n// Output:  Write to file successfully!\n\
    ```\n\n------------------------------------------------------------------------------\n\
    \n### operator overload syntax\n\n```cpp\nClassName operator + (args){\n}\n```\n\
    \n```cpp\nobject3 = object1 + object2;\n```\n\n- `+`, `-`, `*`, `/` defines an\
    \ operator overloading.\n- Operator overloading can adds/minus/times/divides two\
    \ object's properties, and return a new object.\n\ne.g.\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nclass Carton{\npublic:\n    double getVolume( void ){\
    \ return length * width * height; }\n    void setLength( double len ){ length\
    \ = len; }\n    void setWidth( double wid ){ width = wid; }\n    void setHeight(\
    \ double hei ){ height = hei; }\n    Carton operator + (const Carton& obj){ //\
    \ operator overload\n        Carton carton;\n        carton.length = this->length\
    \ + obj.length;\n        carton.width = this->width + obj.width;\n        carton.height\
    \ = this->height + obj.height;\n        return carton;\n    }\nprivate:\n    double\
    \ length;  double width;   double height;     \n};\n\nint main( ){\n    Carton\
    \ carton1;   Carton carton2;   Carton carton3;             \n    double volume\
    \ = 0.0;     // declare the volume\n    carton1.setLength(7.0);\n    carton1.setWidth(8.0);\n\
    \    carton1.setHeight(6.0);\n    carton2.setLength(11.0);\n    carton2.setWidth(12.0);\n\
    \    carton2.setHeight(10.0);\n    volume = carton1.getVolume();\n    cout <<\
    \ \"Volume of carton1 : \" << volume <<endl;\n    volume = carton2.getVolume();\n\
