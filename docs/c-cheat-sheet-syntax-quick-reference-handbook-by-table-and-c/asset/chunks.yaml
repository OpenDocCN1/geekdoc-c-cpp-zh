    \    cout << c;   // assume that we input a character \"A\" in keyboard\n}\n```\n\
    // Output: A\n\n### getenv()\n```cpp\ngetenv(\"path\")\n```\n// Return a pointer\
    \ to a string that contains environment information, such as path names, devices…\n\
    \ne.g.\n\n```cpp\n#include <iostream>\n#include <cstdlib>\n\nusing namespace std;\n\
