    \    cout <<  myString << endl;\n    return 0;\n}\n```\n// Output:\nPlease enter\
    \ a sentence:\nC++ is Very Good!\n\n---\n\n# Classes and Encapsulation\n\n###\
    \ Getter Syntax\n```cpp\nprivate:   // encapsulation\ntype variable;     // set\
    \ a private variable\npublic:\nvoid setVariable() {   }     // setter\nlong getVariable()\
    \ { return … }   // getter\n```\nThe meaning of encapsulation is to ensure that\
    \ secret data is hidden from the user.\n// We must declare class variables as\
    \ `private` first.\n// If we want to access the `private` variables, we can make\
    \ use of public `getter` and `setter` methods.\n\ne.g.\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nclass Programmer {\nprivate:   // encapsulation\n    long\
