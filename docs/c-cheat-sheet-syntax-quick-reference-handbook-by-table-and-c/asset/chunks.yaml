  trans: "\n\n# 匿名函数语法\n\n`[ ] (parameters)->return-type{body}`\n\n// `Lambda` 表达式将函数视为一个对象。我们可以将其赋值给变量并作为参数传递，还可以将其作为函数求值。\n\
    \ne.g.\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main() {\n\
    \    auto salute = []()-> void {// 创建一个 lambda 函数\n        cout << \"Hi, My friends!\"\
    ;\n    };\n\n    salute();     // 调用 lambda 函数\n    return 0;\n}\n```\n// 输出:\
    \ Hi, My friends!\n\n# 数组创建 (1) 语法\n\n`int arrayName[] = {\"value0\", \"value1\"\
    , \"value2\",…};`\n\n// 创建包含某些元素的数组\n\ne.g.\n```cpp\nint main() {\n    int myArray[]\
    \ = { 10,11,12 };   // 创建数组\n    cout<<myArray[0]<<endl;      // 访问数组元素\n    cout<<myArray[1]<<endl;\
    \      // 访问数组元素\n    cout<<myArray[2]<<endl;      // 访问数组元素\n}\n```\n// 输出: 10\
    \  11  12\n\n# 数组创建 (2) 语法\n\n`type arrayName[ size ];`\n\n`type arrayName[index0]\
    \ = \"value1\";`\n\n`type arrayName[index1] = \"value1\";`\n\n`type arrayName[index2]\
    \ = \"value2\";`\n\n// 先声明数组，然后给数组元素赋值。\n\ne.g.\n```cpp\nint main( ) {\n    string\
    \ color[3];         // 声明数组\n    color [0] = \"Red  \";   // 给数组赋值\n    color\
    \ [1] = \"Yellow \";\n    color [2] = \"Green  \";\n    cout<< color[0]<<color[1]<<color[2];\n\
    \    return 0;\n}\n```\n// 输出: Red  Yellow  Green\n\n# 数组元素的值语法\n\n`int value\
    \ = array[index];`\n\n// 从元素中获取一个值。\n\n`int array[index] = value;`\n\n// 给元素设置一个值。\n\
    \ne.g. (1)\n```cpp\nint arr[5] = {10, 20, 30, 40, 50};\nint value = arr[2];  \
    \   // 从元素中获取一个值。\ncout <<  value << endl;   \n```\n// 输出: 30\n\ne.g. (2)\n```cpp\n\
    int num[5] = {10, 20, 30, 40, 50};\nnum[3] = 800;     // 给元素设置一个值。\ncout << num[3]\
    \ << endl;    \n```\n// 输出: 800\n\n# 数组参数语法\n\n`void functionName( type array\
    \ ) { // 数组参数\n}`\n\n`functionName(arr);   // 将数组传递给函数`\n\n// 我们可以将数组作为参数传递给函数。\n\
    \ne.g.\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nvoid myFunction(\
    \ int arr[4] ) {   // 数组参数\n    for (int n = 0; n < 4; n++) { \n        cout <<\
    \ arr[n] << \"\\n\";    \n    }\n}\n\nint main() {\n    int arr[4] = {10, 20,\
    \ 30, 40}; \n    myFunction(arr); // 将数组传递给函数\n    return 0;\n}\n```\n// 输出:\n\
    10\n20\n30\n40\n\n# 数组大小语法\n\n`size = sizeof(array) / sizeof(element);`\n\n//\
    \ 返回数组的大小\n\ne.g.\n```cpp\nint main() {\n    int arr[ ] = {10, 11, 12, 13, 14,\
    \ 15};    // 定义数组\n    int size = sizeof(arr) / sizeof(arr[0]);     // 获取大小\n\
    \    cout << \"The size of the array is: \" << size;\n    return 0;\n}\n```\n\
    // 输出: The size of the array is: 6\n\n# asin() 语法\n\n`asin(num)`\n\n// 返回数字以弧度表示的反正弦。\n\
    \ne.g.\n```cpp\n#include <iostream>\n\n#include <cmath>\n\nusing namespace std;\n\
    \nint main(){\n    double num = 0.5;\n    double result = asin(num);\n    cout\
    \ << \"asin(0.5) = \" << result << \" radian\" << endl;\n}\n```\n// 输出: asin(0.5)\
    \ = 0.523599 radian\n\n# at() 语法\n\n`myString.at(index);`\n\n// `myString.at(index)`\
    \ 根据索引从字符串中获取一个字符。字符串的索引从 0 开始。\n\ne.g.\n```cpp\n#include<string>\n#include <iostream>\n\
    \nusing namespace std;\n\nint main( ) {\n    string myString = \"operating system\"\
    ;\n    char aCharacter = myString.at(2);  // 获取索引为 2 处的字符\n    cout << \"The character\
    \ is: \" << aCharacter << endl;\n    return 0;\n};\n```\n// 输出: The character\
    \ is:  e\n\n# atan() 语法\n\n`atan(num)`\n\n// 返回数字以弧度表示的反正切。\n\ne.g.\n```cpp\n\
    #include <iostream>\n\n#include <cmath>\n\nusing namespace std;\n\nint main(){\n\
    \    double num = 60;\n    double result = atan(num);\n    cout << \"atan(60)\
    \ = \" << result << \" radian\" << endl;\n}\n```\n// 输出: atan(60) = 1.55413 radian\n\
    \n# atexit() 语法\n\n`atexit(myFunction)`\n\n// 当程序正常退出时，调用 `myFunction`。\n\ne.g.\n\
    ```cpp\n#include <iostream>\n\n#include <cstdlib>\n\nusing namespace std;\n\n\
    void myFun(void){\n    cout<<\"The myFun is called.\";\n}\n\nint main(){\n   \
    \ atexit(myFun);   // 程序退出时执行 atexit()。\n}\n```\n// 输出: The myFun is called.\n\
    \n# atof() 语法\n\n`float num = atof(str)`\n\n// 将字符串转换为浮点数\n\ne.g.\n```cpp\n#include\
    \ <iostream>\n\n#include <cstdlib>\n\nusing namespace std;\n\nint main(){\n  \
    \  char str[] = \"168.88\";\n    float num = atof(str);\n    cout << \"Number\
    \ in Floating = \" << num;\n}\n```\n// 输出: Number in Floating = 168.88\n\n# atoi()\
    \ 语法\n\n`int num = atoi(str)`\n\n// 将字符串转换为整数\n\ne.g.\n```cpp\n#include <iostream>\n\
    \n#include <cstdlib>\n\nusing namespace std;\n\nint main(){\n    char str[] =\
    \ \"168\";\n    int num = atoi(str);\n    cout << \"Number in Integer = \" <<\
    \ num;\n}\n```\n// 输出: Number in Integer = 168\n\n# atol() 语法\n\n`long num = atol(str)`\n\
    \n// 将字符串转换为长整数\n\ne.g.\n```cpp\n#include <iostream>\n\n#include <cstdlib>\n\n\
    using namespace std;\n\nint main(){\n    char str[] = \"168.88\";\n    long num\
    \ = atol(str);\n    cout << \"Number in Long = \" << num;\n}\n```\n// 输出: Number\
    \ in Long = 168\n\n# auto 语法\n\n`auto variable = value;`\n\n// 当声明 `variable`\
    \ 时，类型从初始化表达式中自动推导。\n\ne.g.\n```cpp\nauto i = 10;      // \"i\" 的类型是 int\nauto\
    \ f = 3.14;    // \"f\" 的类型是 float\nauto s = \"hello\"; // \"s\" 的类型是 string\n\
    ```\n\n# break 语法\n\n`break;`\n\n// `break` 关键字用于根据条件停止循环运行\n\ne.g.\n```cpp\n\
    int main( ) {\n    int num = 0;\n    while ( num < 10 ){\n        if ( num ==\
    \ 5 )  break; // 退出 while 循环\n        num++;\n    }\n    cout <<  num ;\n    return\
    \ 0;\n}\n```\n// 输出: 5\n\n# 转换运算符语法\n\n`( type ) variable;`\n\n// 将一种数据类型转换为另一种类型\n\
    \ne.g.\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main(){\n \
    \   double x = 2.7182128;\n    float y = 3.14;\n    int z ;\n    z = (int)x;\n\
