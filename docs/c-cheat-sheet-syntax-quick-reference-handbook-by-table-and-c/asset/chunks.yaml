    \ << endl;\n  }\n  else {\n  cout << \"You have entered your name, thank you!\
    \ \";\n  }\n  return 0;\n}\n```\n**Output:**\n```\nPlease enter your name:   John\
    \ Smith\n```\n\n### encapsulation syntax\n\n```cpp\nprivate:\npublic:\n```\nEncapsulation\
    \ ensures that data is hidden from the user.\nThe `private` access specifier limits\
    \ access to within the class.\nThe `public` access specifier allows access from\
    \ outside the class.\n\n`private` access specifier limits access to within the\
