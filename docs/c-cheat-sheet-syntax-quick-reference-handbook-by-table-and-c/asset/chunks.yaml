  trans: "\n\n// 如果字符串之前已经定义，则将编译 C++ 程序部分；如果字符串未定义，则不会被编译。\n\n例如：\n\n```cpp\n#include<iostream>\n\
    \nusing namespace std;\n\n#define VARIABLE \"This is a string.\"\n\nint main(\
    \ ){\n\n#ifdef VARIABLE\ncout<< \"VARIABLE has been defined\" <<endl;\n#else\n\
    cout << \"VARIABLE has not been defined\" << endl;\n#endif\n\nreturn 0;\n}\n```\n\
    // 输出: VARIABLE has been defined.\n\n## 语法：\n\n`token1 ## token2`\n\n// `##` 运算符用于连接两个标记。\n\
    \n例如：\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\n#define concat(x,\
    \ y) x ## y\n\n// 将 \"concat(x, y)\" 转换为 \"xy\"\n\nint main(){\nint mn = 200;\n\
    cout << concat(m, n);\nreturn 0;\n}\n```\n// 输出: 200\n// \"concat(m, n)\" 已转换为\
    \ \"mn\"。\n\n## 指针语法：\n\n`dataType *pointer;` // 声明指针\n`*pointer = &variable;`\
    \ // `*pointer` 访问变量的值\n`pointer = &variable;` // 指针指向变量的地址\n\n// \"dataType *pointer\"\
    \ 声明了一个指针。\n// 指针名称前有一个 \" * \"。\n// `&` 运算符获取变量的内存地址。\n\n例如：\n\n```cpp\n#include\
    \ <string>\n#include <iostream>\n\nusing namespace std;\n\nint main( ) {\nint\
    \ num = 20;\nint *pt = &num;      // *pt 访问 num 的值\ncout << \"The value of num\
    \ is: \" << *pt << endl;\npt = &num;     // pt 指向 num 的地址\ncout << \"The address\
    \ of num is: \" << pt << endl;\nreturn 0;\n}\n```\n// 输出: The value of num is:\
    \ 20\nThe address of num is: 0x7fff1bbfbaa8\n\n## & 运算符语法：\n\n`&variable` // `&`\
    \ 运算符获取变量的内存地址。\n`*pointer = &variable;` // `*pointer` 访问变量的值。\n`pointer = &variable;`\
    \ // 指针指向变量的地址\n\n// `&` 运算符获取变量的内存地址。\n// \"dataType *pointer\" 声明了一个指针。\n//\
    \ 指针名称前有一个 \" * \"。\n\n例如：\n\n```cpp\n#include <string>\n#include <iostream>\n\
    \nusing namespace std;\n\nint main( ) {\nint num = 20;\nint *pt = &num;      //\
    \ *pt 访问 num 的值\ncout << \"The value of num is: \" << *pt << endl;\npt = &num;\
    \     // pt 指向 num 的地址\ncout << \"The address of num is: \" << pt << endl;\nreturn\
    \ 0;\n}\n```\n// 输出: The value of num is: 20\nThe address of num is: 0x7fff1bbfbaa8\n\
    \n## &参数语法：\n\n`type functionName ( &a, &b ) { }`\n\n// (`&a`, `&b)`) 不仅可以接收来自函数调用者的参数，还可以将参数传递给函数调用者。\n\
    \n例如：\n\n```cpp\nvoid swap ( int &a, int &b) {    // 引用参数\nint temp;\ntemp = a,\
    \ a = b, b = temp;  // 引用交换\n}\n\nint main( ) {\nint x = 10, y = 20;\ncout <<\
    \ x << \" \" << y << endl;\nswap ( x, y );  // 调用函数并传递参数\ncout << x << \" \" <<\
    \ y << endl;\nreturn 0;\n}\n```\n// 输出：\n10 20\n20 10\n\n## ? : 运算符语法：\n\n`(test-expression)\
    \ ? (if-true-do-this) : (if-false-do-this);`\n\n// 当 `test-expression` 返回真时，执行\
