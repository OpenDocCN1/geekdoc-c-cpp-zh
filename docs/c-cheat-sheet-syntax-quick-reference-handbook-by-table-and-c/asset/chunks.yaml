    unicode standard then the encoding of `wchar_t` characters |

    | `__STDCPP_STRICT_POINTER_SAFETY__` | 1 if the implementation has strict pointer
    safety |

    | `__STDCPP_THREADS__` | 1 if the implementation has threads support |

