    }\n// 输出: max(10, 100); 100\n```\n\n# memchr() 语法\n\n`memchr(string, ch, count\
    \ )`\n\n// 在字符串中搜索字符\n// \"count\" 是要搜索的字符个数\n\ne.g.\n\n```cpp\n#include <cstring>\n\
