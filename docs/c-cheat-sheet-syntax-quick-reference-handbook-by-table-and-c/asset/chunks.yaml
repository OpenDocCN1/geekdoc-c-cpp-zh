    \ = 50; // 局部变量\n}\n\nint main(){\n  test1();\n  test2();\n  cout << global_variable\
    \ << endl;\n  return 0;\n}\n//（注：为了清晰起起简化）\n```\n\n# log() 语法\n\n`log(num)`\n\n\
    // 返回参数的自然对数。\n\ne.g.\n\n```cpp\n#include <iostream>\n#include <cmath>\nusing\
