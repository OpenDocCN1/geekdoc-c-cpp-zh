    sin(d): -0.349498\ntan(d): 0.373022\nabs(i): 100\nround(f): 101\nceil(d): 101\n\
    floor(f): 100\nsqrt(f): 10.0439\npow(d, 2): 10178.4\nmax(10, 100): 100\nmin(10,\
    \ 100): 10\n```\n\n# max() 函数 语法\n\n`max(x, y);`\n\n// 通过比较 x 和 y 返回较大的值。\n\n\
    e.g.\n\n```cpp\n#include <iostream>\n#include <cmath>\nusing namespace std;\n\n\
