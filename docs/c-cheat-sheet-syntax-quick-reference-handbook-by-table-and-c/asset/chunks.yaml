    \ << name << number << endl;}\nFlower::Flower(string name, int number, string\
    \ color)\n{cout << name <<number << color << endl;}\n```\n```cpp\n// Output:\n\
    Rose\nRose 10\nRose 10 Red\n```\n\n-------------------------------------------------------------------------------\n\
    \n### 重写语法\n\n```cpp\nmyFunction(arg){…}     // 此方法在基类中\nmyFunction(arg){…}  \
    \   // 此方法在派生类中\n```\n\n- 如果名称和参数相同，派生类的方法可以重写基类的方法。\n\ne.g.\n\n```cpp\n#include\
