    \  void beautify() { cout << \"Green\" << endl; };\n};\nint main( ) {\n    Flower\
    \ obj; // 创建一个名为 \"obj\" 的对象。\n    obj.c1= \"Red \"; obj.c2 = \"Yellow \";\n \
    \   cout << obj.c1 << endl; // 对象 obj 引用 c1\n    cout << obj.c2 << endl; // 对象\
    \ obj 引用 c2\n    obj.beautify(); // 对象 obj 引用 beautify()\n    return 0;\n}\n//\
    \ Output: Red Yellow Green\n```\n\n# 对象初始化语法\n\n`Class object{value}`\n\n// 创建并初始化一个对象\n\
    \ne.g.\n```cpp\n#include <iostream>\nclass Coordinate{ // 定义一个类\npublic:\n   \
    \ int x, y;\n};\nint main(){\n    Coordinate c{10, 20}; // 创建并初始化对象 \"c\"\n  \
