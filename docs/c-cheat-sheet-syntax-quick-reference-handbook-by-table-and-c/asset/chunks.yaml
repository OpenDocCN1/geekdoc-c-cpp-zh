    \    cout << \"The character is: \" << aCharacter << endl;\n    return 0;\n};\n\
    ```\n// Output: The character is:  e\n\n# atan() syntax\n\n`atan(num)`\n\n// Returns\
    \ the arctangent of a number in radian.\n\ne.g.\n```cpp\n#include <iostream>\n\
    \n#include <cmath>\n\nusing namespace std;\n\nint main(){\n    double num = 60;\n\
    \    double result = atan(num);\n    cout << \"atan(60) = \" << result << \" radian\"\
    \ << endl;\n}\n```\n// Output: atan(60) = 1.55413 radian\n\n# atexit() syntax\n\
    \n`atexit(myFunction)`\n\n// `myFunction` is called when the program exits normally.\n\
