    \  cout << \"double type: \" << myDouble << \"\\n\";\n  cout << \"char type: \"\
    \ << myCharacter << \"\\n\";\n  cout << \"bool type: \" << myBool << \"\\n\";\n\
    \  cout << \"string type: \" << myString << \"\\n\";\n  return 0;\n}\n```\nOutput:\n\
    int type: 10\nfloat type: 10.99\ndouble type: 10.9999\nchar type: C\nbool type:\
    \ 1\nstring type: C Plus Plus\n\n---\n\n### UTC 日期时间语法：\n\n```cpp\ntime_t now\
    \ = time(0);    // 获取当前日期时间\ntm *gm = gmtime(&now);    // 将 \"now \" 转换为 tm 类型\n\
    char* utc = asctime(gm); // 获取 UTC 日期时间\n```\n获取日期和时间，请先包含 `<ctime>`。\n\ne.g.\n\
    ```cpp\n#include <iostream>\n#include <ctime>\nusing namespace std;\n\nint main(\
    \ ){\n  time_t now = time(0);    // 获取当前日期时间\n  tm *gm = gmtime(&now);    // 将\
    \ \"now \" 转换为 tm 类型\n  char* utc = asctime(gm); // 获取 UTC 日期时间\n  cout << utc\
    \ << endl;\n}\n```\nOutput: `Sun Aug 7    16:28:29      2022`\n\n---\n\n### 默认参数语法：\n\
    \n```cpp\nvoid functionName( type variable = value ) {\n}\n```\n如果调用函数时不带参数，C++\
    \ 编译器将应用默认参数。\n`(type variable = value)` 是一个默认参数。\n\ne.g.\n```cpp\n#include <iostream>\n\
