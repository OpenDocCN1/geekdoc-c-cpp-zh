- fmt: "\n# `memcmp()` syntax\n\n`memcmp(object1, object2, num)`\n\n// Compare two\
    \ objects alphabetically\n// \"num\" specifies maximum numbers of bytes to compare\n\
    \ne.g.\n```cpp\n#include <cstring>\n#include <iostream>\n\nusing namespace std;\n\
    int main(){\n    int comp = memcmp(\"abcd\", \"efg\", 4);\n    if ( comp == 0\
    \ ){ cout << \"abcd = efg\"; }\n    if ( comp > 0 ){ cout << \"abcd > efg\"; }\n\
    \    if ( comp < 0 ){ cout << \"abcd < efg\"; }\n}\n// Output: abcd < efg\n```\n\
    \n# memory assigned syntax\n\n`variable = new type;` // assign memory for the\
    \ variable\n`*variable = value;` // store value to a memory address\n`delete variable;`\
    \ // release memory of the variable\n\ne.g.\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\nint main (){\n    double* myVar = NULL; // initialize the pointer\
    \ of Null\n    myVar = new double;    // assign memory for the variable\n    *myVar\
    \ = 100;         // store value to a memory address\n    cout << \"Value of myVar\
    \ : \" << *myVar << endl;\n    delete myVar;         // release memory of the\
    \ variable\n    return 0;\n}\n// Output: Value of myVar : 100\n```\n\n# memory\
    \ assigned syntax\n\n`MyClass* myArr = new MyClass[3];` // assign memory of the\
    \ array\n`delete [] myArr;` // release memory of the array\n\ne.g.\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\nclass MyClass{\npublic:\n    MyClass() {\n\
    \        cout << \"Call constructor!\" <<endl;\n    }\n    ~MyClass() {\n    \
    \    cout << \"Call destructor!\" <<endl;\n    }\n};\nint main( ){\n    MyClass*\
    \ myArr = new MyClass[3]; // assign memory\n    delete [] myArr;             \
    \   // release memory\n    return 0;\n}\n// Output:\nCall constructor!\nCall constructor!\n\
    Call constructor!\nCall destructor!\nCall destructor!\nCall destructor!\n```\n\
    \n# `min()` function syntax\n\n`min(x, y);`\n\n// Returns the smaller value by\
    \ comparing x and y.\n\ne.g.\n```cpp\n#include <iostream>\n#include <cmath>\n\
    using namespace std;\nint main (){\n    cout << \"min(10, 100); \" << min(10,\
    \ 100) << endl;\n    return 0;\n}\n// Output: min(10, 100); 10\n```\n\n# `modf()`\
    \ syntax\n\n`fraction = modf(number, &integer)`\n\n// Return the fraction part\
    \ of a floating number.\n\ne.g.\n```cpp\n#include <bits/stdc++.h>\nusing namespace\
    \ std;\nint main(){\n    double number = 3.14, integer, fraction;\n    fraction\
    \ = modf(number, &integer);\n    cout << \"Integer Part = \" << integer << \"\
    \ , \";\n    cout << \"Fraction Part = \" << fraction << endl;\n}\n// Output:\
    \ Integer Part = 3, Fraction Part = 0.14\n```\n\n# multiple inheritance syntax\n\
    \n`class ParentClass { // Parent class };`\n`class ChildClass: public ParentClass\
    \ { // Child Class };`\n`class GrandSonClass: public ChildClass { // Grandson\
    \ Class };`\n\n// Grandson class can be derived from Child class, and Child can\
    \ be derived from Parent class.\n\ne.g.\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nclass ParentClass { // Parent class\npublic:\n    void myFunction() {\n\
