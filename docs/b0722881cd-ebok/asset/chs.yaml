  \ name: Dr. Rajiv\nHello Dr. Rajiv good morning\n\n## 示例 23：编写一个 C 程序实现一个简单的计算器，可以对从键盘读取的两个数字进行加、减、乘、除。\n\
  \n解决方案 23：程序如下：\n\n```c\n#include<stdio.h>\nmain( )\n{\n   float num1, num2, result;\n\
  \   char opn;\n   void arithop( );\n   printf(“Enter any two numbers and the \\\
  n”);\n   printf(“operation symbol (+, -, * or /) \\n”);\n   scanf(“%f %f %c”, &num1,\
  \ &num2, &opn);\n   printf(“\\n %8.2f %c %8.2f = “, num1, opn, num2);\n   arithop(num1,\
