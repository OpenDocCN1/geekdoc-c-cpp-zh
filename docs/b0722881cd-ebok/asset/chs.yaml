  \ `iostream.h`。它代表“标准输入输出头文件流文件”。\n9. 尖括号告诉预处理器在一个或多个标准目录中搜索该文件。这些目录包含了系统提供的头文件以及多个程序员常用的头文件（如果计算机是多用户机器）。\n\
  10. 有时括号会被替换为双引号，如下文所示：\n\n```\n#include “iostream.h”\n```\n\n在这种情况下，预处理器将首先在程序员自己的目录或包含程序文件的相同目录中查找。如果没有在那里找到，则会搜索标准目录。\n\
