  \ a1[i];\n```\n\n复制数组的错误方法：\n\n```c\nint a1[] = {1,2,3,4,5};\nint a2[5];\na2 = a1;\
  \ // 错误\n```\n\n\n\n\n\n## 数组\n\n21. 元素的数据类型、数组的形状以及维度都是数组类型的一部分。因此，数组在声明中仅包含这些详细信息。\n\
  \n22. 数组的大小不是数组类型的一部分。因此，数组的声明中不包含其大小。\n\n23. 数组声明不预留任何内存。\n\n24. 数组的实例使用 `new`\
  \ 运算符动态创建。\n\n25. 只有在使用 `new` 运算符创建数组时，方括号中的值才表示大小。在其他地方，它们仅表示索引或下标。下标必须是一个整常数。\n\
  \n26. 数组的大小必须是大于或等于 0 的整数。在创建数组后，如果没有初始化器，下标变量的值将假定默认值。\n\n27. 数组下标必须始终从零开始。\n\n\
  28. 最后一个数组变量的下标始终 `[size - 1]`（即比数组大小小 1）。\n\n29. 你不能对数组进行反向索引（例如 `a[-1]`、`a[-2]`\
  \ 等）。同样注意，引用超出数组边界的元素是非法的。例如，对于一个大小为 8 的数组，数组边界仅从 `a[0]` 到 `a[7]`。C 编译器会在编译时检查数组边界并报告任何错误（如果有）。\n\
  \n30. 在执行程序时，数组类型的值可以是 `null` 或指向该数组类型实例的引用。\n\n31. 数组的初始化可以通过初始化器与实例化结合。\n\n32.\
  \ 当创建实例时，如果数组元素没有使用初始化器显式初始化，则它们被初始化为它们的默认值。\n\n我们现在可以解决一些基于 1D 数组的问题了。\n\n### Q1.\
