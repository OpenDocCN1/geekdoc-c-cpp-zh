  \ source file is %d\\n”, var1);\n                   fun( );\n}\n```\n而 `t2.c` 具有以下代码：\n\
  ```c\nint var1 = 95;\nfun( )\n{\n     printf(“Function fun is defined in other source\
  \ file”);\n}\n```\n\n那么在 CodeBlock 中运行这些文件后，我们得到如下输出：\n\nThe value of `var1` defined\
  \ in the other source file is 95.\n\nThe function `fun is defined in the other source\
