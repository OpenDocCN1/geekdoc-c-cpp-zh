  ```\n\n\n\n\n## 示例 5：数组和结构体有什么相似之处？又有什么不同？\n\n### 答案 5：主要点如下表所示：\n\n| 数组 (Array)\
  \ | 结构 (Structure) |\n| --- | --- |\n| 数组是一种辅助数据类型。 | 结构也是一种辅助数据类型。 |\n| 数组的所有元素都存储在连续的内存位置。\
  \ | 结构的所有元素也存储在连续的内存位置。 |\n| 数组是相同数据类型元素的集合。 | 结构是不同数据类型元素的元素的集合。 |\n| 数组只有声明。 |\
  \ 结构有声明和定义部分。 |\n| 数组没有关联关键字。 | 结构关联了关键字 `struct`。 |\n| 数组不能包含位域。 | 结构可以包含位域。 |\n\
  \n## 示例 6：区分结构体（structure）和联合体（union）。\n\n### 答案 6：差异如下表所示：\n\n| 结构 (Structure)\
  \ | 联合体 (Union) |\n| --- | --- |\n| 1. 结构用于在内存的不同位置存储不同的成员。 | 1. 联合体用于在相同的内存位置存储不同的成员。\
  \ |\n| 2. 它们不用于节省内存。 | 2. 它们用于节省内存。 |\n| 3. 使用的总内存等于其所有单独元素/成员的大小之和。 | 3. 分配的总内存等于其所有成员中最大/最大的那个的大小。\
  \ |\n| 4. 使用关键字 `struct`。 | 4. 使用关键字 `union`。 |\n| 5. 语法：`struct <name> {member-1;member-2;...member-n;};`\
  \ | 5. 语法：`union <name> {member-1;member-2;...member-n;};` |\n\n## 示例 7：编写一个 C 程序来两个复数相乘。创建一个表示复数的结构体\
  \ `complex`，并编写一个执行复数乘法的函数。已知：\n\n`(a + ib) * (c + id) = (ac – bd) + i(ad + bc)`\n\
  \n### 答案 7：程序如下：\n\n```c\n #include<stdio.h>\n#include<conio.h>\nstruct complex\n\
  \ {\n   int r;\n   int i;\n};\nvoid main( )\n {\n   struct complex a, b, c;\n  \
  \ clrscr( );\n\n   printf(“\\n Enter first complex number”);\n   printf(“\\n Enter\
  \ real part:”);\n   scanf(“%d”, &(a.r));\n   printf(“\\n Enter imaginary part:”);\n\
  \   scanf(“%d”, &(a.i));\n   printf(“\\n Enter second complex number”);\n   printf(“\\\
  n Enter real part:”);\n   scanf(“%d”, &(b.r));\n   printf(“\\n Enter imaginary part:”);\n\
  \   scanf(“%d”, &(b.i));\n   c= multiply(a, b);\n   printf(“\\n The resultant number\
  \ is %d + %di”, c.r, c.i);\n   getch( );\n }\nstruct complex multiply(struct complex\
  \ x, struct complex y)\n {\n   struct complex z;\n   z.r = (x.r + y.r) – (x.i *\
  \ y.i);\n   z.i = (x.r + y.i) – (x.i * y.r);\n   return (z);\n }\n```\n\n| | |\n\
