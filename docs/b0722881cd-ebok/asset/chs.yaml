  \ of characters to reversed: 5\n\n## 示例 26：编写一个 C 程序，使用递归实现二分查找。\n\n解决方案 26：程序如下：\n\
  \n```c\n#include<stdio.h>\nint key; /* 全局变量 */\nmain( )\n{\n   int a[50], n, loc;\n\
  \   int bin( );\n   printf(“\\n\\t Enter the array size:\");\n   scanf(“%d”, &n);\n\
  \   printf(“%d\\n”, n);\n   printf(“\\n\\t Please enter the array elements in ascending\
  \ order:”);\n   for(i=0; i<n; i++)\n      scanf(“%d”, &a[i]);\n   for(i=0; i<n;\
  \ i++)\n      printf(“%d”, a[i]);\n   printf(“\\n”);\n   printf(“Enter the element\
  \ to searched:”);\n   scanf(“%d”, &key);\n   loc = bin (a, 0, n);\n   printf(“\\\
  n\\n”);\n   if (loc = 0)\n      printf(“Unsuccessful search. %d not found \\n”,\
  \ key);\n   else\n    {\n      printf(“Successful search\\n”);\n      printf(“%d\
  \ found at position %d. \\n”, key, loc);\n    }\n}\n/* 递归二分查找方法 */\nint bin (b,\
  \ low, high)\nint b[50], low, high;\n{\n   static int mid;\n   int i;\n   if (low\
  \ <= high)\n    {\n      mid = (low + high)/2;\n      if (key < b[mid]) {\n    \
  \  /* 在左半部分 */\n      high = mid – 1;\n      bin (b, low, high);\n      }\n    \
  \  else if (key > b[mid]) {\n      /* 在右半部分 */\n      low = mid + 1;\n      bin\
  \ (b, low, high);\n    }\n   else if (key = b[mid])\n   /* 找到元素 */\n      return\
  \ (mid + 1);\n   }\nelse\n   return (0 ); /* 未找到元素 */\n}\n```\n\n**输出（运行后）：**\n\
  Enter the array size: 10\nPlease enter the array elements in ascending order: 2\
  \ 4 6 8 10 12 14 16 20\nEnter the element to searched: 16\nSuccessful search\n16\
  \ found at position 8\n\n## 示例 27：编写一个 C 程序，仅使用指针找到大小为 n 的数组中的最小元素。\n\n解决方案 27：代码如下：\n\
  \n```c\n#include<stdio.h>\nmain( )\n{\n   int i, n, small, *ptr, a[50];\n   printf(“\\\
  n\\t Enter the array size:\");\n   scanf(“%d”, &n);\n   printf(“%d”, n);\n   printf(“\\\
  n\\t Enter the array elements:\");\n   for (i=0; i< n; i++)\n      scanf(“%d”, &a[i]);\n\
  \   printf(“\\n\\t Echoing the array elements:”);\n   for (i=0; i< n; i++)\n   \
  \   printf(“%d”, a[i]);\n   printf(“\\n”);\n   ptr = a;  /* 将 a[0]的地址赋值给指针‘ptr’，可以通过两种实现——要么\
  \ ptr = &a[0]，要么 ptr = a */\n   small = *ptr; /* 将 a[0]的内容赋值给 small */\n   ptr ++;\
  \ /* 指针移动到下一个元素 */\n   /* 遍历 n-1 次以查找数组中的最小元素 */\nfor (i=1; i<n; i++)\n{\n   if\
  \ ( small > *ptr)\n      small = *ptr;\n   ptr++; /* 指针移动到 a[i+1] */\n }\n printf(“\\\
  n Smallest element is %d”, small);\n}\n```\n\n**输出（运行后）：**\nEnter the array size:\
  \ 5\nEnter the array elements: -5 4 3 2 7\nSmallest element is -5\n\n## 示例 28：编写一个\
  \ C 程序，仅使用指针对大小为 n 的数组进行冒泡排序。\n\n解决方案 28：程序如下：\n\n\n\n\n\n```c\n #include<stdio.h>\n\
  #include<malloc.h>\nmain( )\n{\n   int i, n, *vector;\n   void bubble( );\n   printf(“\
  \ Enter the array size:”);\n   scanf(“%d”, &n);\n   printf(“%d”, n);\n   /* dynamic\
  \ memory allocation is done using malloc ( ) of C */\n   vector = (int *) malloc\
  \ (n * sizeof(int)); /* sizeof gives size of data type in bytes */\n   printf(“\\\
  nEnter the array elements :”);\n   for (i=0; i<n ; i++)\n    scanf(“%d”, vector\
  \ + i);\n   for (i=0; i<n ; i++)\n    printf(“%d”, *(vector + i)); /* echoing */\n\
  \   printf(“\\n”);\nbubble(vector, n); /* invoke function */\nprintf(“\\n Sorted\
  \ array is:”);\nfor (i =0; i <n; i++)\n   printf(“%d”, *(vector + i));\nprintf (“\\\
  n”);\n}\n   void bubble (x, m)\n   int *x, m;\n    {\n      int pass, i, temp;\n\
  \      for (pass = 0; pass < m-1; pass++)\n       {\n         for (i=0; i < m-pass;\
  \ i++)\n          {\n               if (*(x + i) > *(x+i+1))\n                {\n\
  \                     temp = *(x+i);\n                     *(x+i) = *(x + i +1);\n\
  \                     *(x+i+1) = temp;\n                }\n          }\n       }\n\
  \    }\n```\n\n输出（运行后）：\n\nEnter the array size: 5\n\nEnter the array elements:\
  \ -5 4 3 2 7\n\nSorted array is: -5 2 3 4 7\n\n示例 29: 编写一个 C 程序来找到给定字符串的长度。\n\n\
