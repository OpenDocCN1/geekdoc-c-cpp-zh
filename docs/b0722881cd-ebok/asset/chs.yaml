  14. 头文件可以包含其他的 `#include` 指令。请注意，它不能包含自身，因为这将导致无限递归。同样注意，它不能包含另一个包含第一个文件的文件，因为这也会导致无限递归。\n\
  15. 头文件可以包含任何文本。它们还可能包含用于定义结构模板、全局变量或函数定义的 C 语言代码。然而，头文件通常不包含函数定义，因为将这些内容存储在用户设置的函数库中更高效。但有时会包含全局变量。\n\
  16. 如果程序包含了 `iostream.h`，则将使用宏版本（稍后将讨论）。另一方面，如果程序员希望使用函数版本，可以在 `#include<iostream.h>`\
  \ 指令之后对其取消定义（undefined）。\n17. 预处理器指令以其占据行的结束而终止，但如有必要，可以通过在最后一行之前的所有行末尾加上反斜杠来将其延续到一行或多行。\n\
  \n定义 定义部分\n\n在本节中，我们定义了一个带有某些值的变量。这被称为特殊常量区域。在这里，使用了 `define` 语句。可以使用以下 `#define`\
  \ 语句定义符号预处理器或符号编译器指令的通用通用语法：\n\n```\n#define name value\n```\n\n例如，\n\n```\n#define\
  \ PI 3.1417\n```\n\n这初始化了一个值为 `3.1417` 的变量 `PI`。但关于 `#define` 预处理器指令，请牢记以下几点：\n\n\
  1. `#define` 不可以被放置在程序的任何位置。\n2. 在这些语句中定义的变量是符号常量，因此最好写成大写。\n3. `#define` 语句的末尾没有分号。\n\
  4. `#` 和 `define` 之间不允许有空格。\n5. `define` 应该只写成 `define` 而不能写成 `Define`。\n6. 如果 `PI`\
  \ 是符号名称（如我们的示例所示），那么我们不能让它也成为变量。\n7. `PI` 和 `3.1417` 之间没有等号（`=`）。\n8. 不要在这些符号名称中使用特殊字符。\n\
  9. 你不能将这些符号语句连接在一起（即每个符号名称必须单独在一行中声明）。\n\n| | |\n|---|---|---|\n| 例如 | `#define\
  \ PI 3.1417`（有效的）。 |\n| 但 | `#define PI = 3.1417`（无效的）。 |\n| 同样地 | `#define NAME\
  \ “Rajiv”`（有效的）。 |\n| | `#define R ‘r’`（有效的）。 |\n| 但 | `#Define PI 3.1417`（无效的，因为\
  \ ‘D’ 必须小写）。 |\n| | `# define PI 3.1417`（无效的，因为 `#` 和 `define` 之间不允许空格）。 |\n| |\
  \ `#define PI, R 3.14, 5`（无效的，因为不允许多次初始化）。 |\n\n#### 全局声明部分\n\n有时我们需要在函数和主程序中使用相同的变量。在这种情况下，我们使用全局变量。这些变量是正常声明的，但放置在程序开始之前。请在这里理解，如果你让数据在程序的所有部分可用，你就必须将变量声明为全局变量，或者作为参数传递（稍后将学习）。还要理解，使用这些任何方法的最终目标都是让数据在所有函数中可用。\n\
  \n| | |\n|---|---|\n| 注意 | 当全局变量和局部变量冲突时，局部变量具有优先级。 |\n\n#### main() 函数\n\n`main()`\
  \ 函数是编译器开始执行程序的地方。如果你没有 `main()`，你的程序编译成功但无法运行，编译器将报告未定义 `main()` 函数的错误。这就是为什么 `main()`\
  \ 函数是必要的。它是一个作为整个 C 程序容器的特殊函数。代码的这部分包含了输入输出以及处理语句。它可能具有如下的返回类型：\n\n```\nvoid main(void)\
  \ //这里全是 void，因为 main 没有返回任何值也没有传递任何参数。\n```\n\n另一方面，对比以下语句：\n\n```\n int main (\
  \ )\n      {\n        ……\n        ……\n        return (0); // 是必须\n      }\n```\n\
  \n在这里，左大括号 `{` 显示了主程序的开始，而 `}` 显示了它的结束。在大括号之后声明的变量被称为局部变量——即它们的作用域局限于这个主函数。然后是用户编写程序的部分。这被称为用户定义部分。\n\
  \n\n\n\n预处理器指令用于指示预处理器在源程序编译之前对源程序执行特定的操作。预处理器是一个在将源程序传递给编译器之前对源程序进行处理的程序。这就是为什么这些预处理器指令也被称为预处理器命令。需要理解的点是，当你开始编写程序时，所有的预处理器分配都应该完成了。该软件始终与标准\
  \ C 库函数一起包含在 C 软件包中。正如已经解释的那样，无论你是否使用任何预处理器指令，C 编译器都会在第一遍编译时自动调用预处理器。但程序员也可以调用预处理器在不经过编译的情况下对源程序进行处理。不过，了解和使用预处理器指令并不是强制性的，因为程序在没有它们的情况下也可以运行。然而，它们的用处在于，在它们的帮助下，即使我们在不同的环境中工作，也可以轻松地更改源代码。请记住，如果我们使用任何预处理器指令，就意味着预处理器必须执行特定的操作，例如将长字符串更改为短字符串、忽略源程序的某些部分、或者将其他文件的内容插入到源文件中等。\n\
  \n## 2.2 使用 GETCHAR 和 PUTCHAR 进行 C 原始输入输出\n\n现在我们将讨论 C 语言中的 `getchar()` 和 `putchar()`\
  \ 函数。\n\n#### I. getchar 函数：`getchar();`\n\n`getchar()` 函数从标准输入读取单个字符。它不接受任何参数，并返回输入的字符。通常，对\
  \ `getchar()` 函数的引用写法如下：\n\n```\nvariable = getchar();\n```\n\n例如：\n\n```\nchar\
  \ c;\nc = getchar();\n```\n\n请注意，这里的第二行会导致从键盘输入单个字符并将其赋值给 `c`。如果在使用 `getchar()`\
  \ 函数读取字符时遇到文件结束（EOF）条件，将自动返回符号常量 `EOF` 的值。还要注意，该函数还可以通过在多路循环中每次读取一个字符，用于读取多字符字符串。\n\
  \n#### II. putchar 函数：`putchar(variable | constant);`\n\n通过将单个字符发送到标准输出来打印或显示字符的标准\
  \ C 函数称为 `putchar`。该函数接受一个参数，即要字符的字符。\n\n例如：\n`putchar('R');` 将显示字符 ‘R’。\n\n或者：\n\
  \n```\nchar var = '$';\nputchar(var);\n```\n显示字符 `$`。\n\n让我们为这个程序提供一个算法：\n\n步骤 1：读取一个字符。\n\
  步骤 2：如果输入的字符不是空格，则打印它。\n步骤 3：否则，打印第一个空格字符并跳过所有连续的空格。\n步骤 4：重复步骤 1 到 3，直到输入的字符是换行符。\n\
  \n以下是该程序：\n\n```c\n#include<stdio.h>\n#include<string.h>\nvoid main()\n{\n  char\
  \ c;\n  printf(\"\\nEnter the text:\");\n  c= getchar();\n  printf(\"The output\
  \ text is: \");\n  while (c!= '\\n')\n  {\n    if (c == ' ' || c == '\\t')\n   \
  \ {\n      c = ' ';\n      putchar(c);\n    }\n    while(c == ' ' || c == '\\t')\n\
  \    {\n      c = getchar();\n    }\n    putchar(c);\n    c = getchar();\n  }\n\
  \  printf(\"\\n\");\n}\n```\n\n输出（运行后）\nEnter the text: DR. RAJIV CHOPRA\nThe output\
  \ text is: DR. RAJIV CHOPRA\n\n### 2.3 简单输入/输出\n\n某些函数用于数据输入和数据输出。这些函数被称为标准输入输出函数。在\
  \ C 中，这些函数分为两类：\n\n(a) 格式化输入输出函数\n(b) 非格式化输入输出函数\n\n让我们讨论每一种。\n\n#### I. 格式化输入输出函数\n\
  \n格式化输入输出函数用于从标准输入设备输入数据，并将输出发送到标准输出设备。在此类中，`scanf()` 函数用于从键盘读取值，而 `printf()` 函数用于在输出终端显示值。这两个函数都定义在\
  \ `<conio.h>` 头文件中。\n\n`scanf()` 函数用于以固定格式从标准设备接受输入数据。其语法如下：\n\n语法\n`scanf(\"format\
  \ string\", arguments);`\n\n其中 `format string` 包含以 `%` 字符开头的格式说明符，列表如下：\n\n| 格式说明符\
  \ | 输入类型 | 数据类型 |\n| --- | --- | --- |\n| %d or %i%u%ld%lu%x%o | 短有符号整数、短无符号整数、长有符号整数、长无符号整数、无符号十六进制整数\
  \ | INTEGER（整数） |\n| %f | 单精度浮点数 | FLOAT（浮点型） |\n| %lf | 双精度浮点数 | DOUBLE（双精度浮点型）\
  \ |\n| %c | 有符号字符 | CHARACTER（字符） |\n| %s | 字符串 | STRING（字符串） |\n\n`scanf()` 函数用于以固定格式从标准设备接受输入数据。其语法如下：\n\
  \n语法\n`scanf(\"format string\", arguments);`\n\n其中 `format string` 包含以 `%` 字符开头的格式说明符，列表如下：\n\
  \n（根据逻辑流省略表格内容）\n\n### 2.4 从库中调用函数\n\n如 `getchar()`、`putchar()`、`printf()` 和 `scanf()`\
  \ 等函数定义在 `stdio.h` 中。`strlen()`、`strcpy()`、`strcat()`、`strcmp()` 和 `strrev()` 等函数定义在\
  \ `string.h` 中。`exit(0)` 等函数定义在 `process.h` 中。同样，`sin()`、`cos()` 和 `tan()` 等函数包含在\
  \ `math.h` 中。请注意，所有包含在头文件中的函数都是 C 库的一部分。这意味着 C 编译器会自动执行它们的代码并给出所需的结果。还要注意，我们无法修改这些内置函数。如果我们想修改其中任何一个，就必须编写自己的函数，即用户定义函数。\n\
  \n### 2.5 C 中的数据类型\n\nC 具有数据类型概念，用于在使用变量之前定义它。变量的定义将为变量分配存储空间并定义存储在该位置的数据类型。变量的值可以随时更改。在\
  \ C 中，给出以下数据类型：\n\n(a) int\n(b) float\n(c) double\n(d) char\n\n请注意，C 中没有布尔数据类型。C\
  \ 并没有传统的逻辑比较视图。实际上，C 中的数据类型被分为三大类类：\n\n(a) 基本数据类型\n(b) 派生数据类型\n(c) 用户定义数据类型\n\n\
  #### 基本数据类型\n\n所有 C 编译器都接受以下基本类型：\n\n(a) 整数 (`int`)\n(b) 字符 (`char`)\n(c) 浮点型 (`float`)\n\
  (d) 双精度浮点型 (`double`)\n(e) 空 (`void`)\n\n\n\n\n`int` 数据类型用于定义整数（例如，`int count;`）。整数是不带小数部分的数字，其取值范围取决于机器（机器架构）。一个整数在内存中占用\
  \ 2 字节。一个 `int` 可以是 `short int`、`int` 或 `long int`。所有这些数据类型都有有符号（signed）和无符号（unsigned）的形式。`short\
  \ int` 需要的空间是普通整数值的一半。`unsigned` 数字始终为正数，并使用所有位来表示数值的大小。`long` 和 `unsigned` 整数用于声明更广泛的值。\n\
  \n`char` 数据类型定义一个字符。每个字符在内存中占用一个字节。可以显式地对 `char` 应用 `signed` 或 `unsigned` 限定符。虽然\
  \ `unsigned` 字符的值范围在 0 到 255 之间，而 `signed` 字符的值范围从 –128 到 127。\n\n`Float` 用于定义浮点数，即表示为精确到\
  \ 6 位精度的实数。当浮点数的精度不足时，我们可以使用 `double` 来定义该数字。`double` 与 `float` 相同但具有更高的精度。为了进一步扩展精度，我们可以使用\
  \ `long double`，它占用 80 位的内存空间。\n\n```c\nfloat a;\n```\n\n`Void` 用于指定函数的类型。\n\n每个数据类型的大小和范围见表\
  \ 2.1。\n\n#### 表 2.1：数据类型、大小和范围\n\n| 类型 | 大小 (位) | 范围 |\n| --- | --- | --- |\n|\
  \ Char or signed char | 8 | –128 to 127 |\n| Unsigned char | 8 | 0 to 255 |\n| Int\
  \ or signed int | 16 | –32768 to 32767 |\n| Unsigned int | 16 | 0 to 65535 |\n|\
  \ Short int or signed short int | 8 | –128 to 127 |\n| Unsigned short int | 8 |\
  \ 0 to 255 |\n| Long int or signed long int | 32 | –2147483648 to 2147483647 |\n\
  | Unsigned long int | 32 | 0 to 4294967295 |\n| Float | 32 | 3.4 e-38 to 3.4 e+38\
  \ |\n| Double | 64 | 1.7 e-308 to 1.7e+308 |\n| Long double | 80 | 3.4 e-4932 to\
  \ 3.4 e+4932 |\n\n注意 `short`、`long`、`signed` 和 `unsigned` 是修饰符。这些修饰符定义了分配给变量的大小。还要记住根据\
  \ ANSI 规则：\n\n```\nshort int <= int <= long int\nfloat <= double <= long double\n\
  ```\n\n这意味着 `short int` 分配的存储空间应少于或等于 `int`，而 `int` 要求的字节数应等于或少于 `long int`。\n\n\
  可以使用 `sizeof` 运算符确定为数据类型分配了多少存储空间。这些范围定义在 `limits.h` 头文件中。\n\n#### 变量\n\n变量是一个命名的存储区域，可以存储单个值（数值或字符）。程序中使用的每个变量都应该向编译器声明。此声明告诉了我们两点：\n\
  \n1. 告诉编译器变量的名字。\n2. 告诉它所包含的变量类型。\n\n#### 语法\n\n```\nvariable-name1, variable-name1,\
  \ … variable-name-n;\n```\n\n例如：\n\n```c\nint a;\nfloat k;\ndouble j;\n```\n\n此外，如果需要，我们可以初始化这些变量：\n\
  \n```c\nint a = 10;\nfloat k = 80.80;\ndouble j = 90.89765;\n```\n\n当有许多变量需要声明时，它们用逗号隔开，并必须以分号结束。\n\
  \n#### 变量名的命名规则\n\n1. 变量名必须以字母开头。\n2. 变量名是 1 到 8 个字母、数字或下划线的组合。某些编译器允许长达 40 个字符。\n\
  3. 变量名不能包含任何逗号或空格。\n4. 变量名不能包含下划线以外的任何特殊符号。\n\n无效的变量名：`2hb`、`we b`、`#west`、`$123se`\n\
  \n有效的变量名：`e_p_f`、`_wepp`、`ai`\n\n### 2.6 枚\n\nC 中有两种用户定义的类型声明。在第一种中，用户可以定义一个代表现有数据类型的标识符。用户定义的数据类型以后可以用于声明变量。其语法为：\n\
  \n```\ntypedef type identifier;\n```\n\n在这里，`type` 代表现有的数据类型，`identifier` 指赋予该数据类型的名字。\n\
  \n例如：\n\n```c\ntypedef int age;\ntypedef float marks;\n```\n\n在这里，`age` 是整数类型，`marks`\
  \ 是浮点类型。现在它们可以以后如下用于声明变量：\n\n```\nage a1, a2;\nmarks m1, m2;\n```\n\n现在 `a1` 和 `a2`\
  \ 是整数类型变量。\n\n第二种用户定义的类型声明是 `enum`。它用于定义一组命名常量。其语法为：\n\n```\nenum identifier {constant1,\
  \ constant2, ...};\n```\n\n例如：\n\n```c\nenum color {RED, GREEN, BLUE};\n```\n\n\
  在这里，`color` 是标识符，而 `RED`、`GREEN`、`BLUE` 是常量。\n\n\n\n 局部变量\n\n局部变量的作用域仅限于定义它们的块或函数内部。它们始终在块的顶部定义。当局部变量被定义时，系统不会对其初始化；事实上，你必须手动初始化它。当块或函数执行结束，变量就会失效。\n\
  \n例如\n\n```c\n int x=40;\n main( )\n     {\n         int x = 20;\n         printf(\"\
  %d\", x);\n```\n\n程序的输出将是 20。为什么呢？正如我们在第一行看到的，`x`被初始化为 40。这被称为`x`的全局声明。另一方面，在`main()`中`x`被初始化为\
  \ 20。现在，`x`是一个局部变量。规则是，当局部变量和全局变量发生冲突时，优先使用局部变量。此外注意，由于全局变量对程序可见，不需要作为参数传递。\n\n\
  | | |\n| --- | --- |\n| 注意 | 有两种可以将数据提供给程序的其他部分：将其声明为全局变量或作为参数传递。 |\n\n全局变量在程序的顶部声明。当你定义它们时，系统会自动进行初始化。\n\
  \n### 2.7 运算符\n\n运算符是导致编译器采取操作的符号。在`sum = a + b;`这样的表达式中，我们说`+`是一个运算符，而`a`和`b`是操作数。C\
  \ 还支持下面讨论的运算符。\n\n#### 算术运算符\n\nC 提供了两个一元和一个二进制算术运算符（见表 2.2）。\n\n表 2.2：C 中的算术运算符\n\
  \n| 符号 | 含义 |\n| --- | --- |\n| + | 一元加 |\n| – | 一元减 |\n| * | 乘法 |\n| / | 除法 |\n\
  | % | 取模（余数运算符） |\n| + | 二进制加 |\n| – | 二进制减 |\n\n在语句`(u*v + w)`中，先执行乘法操作然后执行加法。这是因为`*`的优先级高于`+`。通常，乘法、除法和模运算符的优先级高于二进制加减运算符。\n\
  \n#### 增减运算符\n\n在 C 中，我们有`++`（增）和--`（减）运算符，它们将变量的值加减 1。这可以通过两种方式实现：\n\n(a) `++ count;`和\
  \ `-- count;`（称为前增）\n\n(b) `count ++;`和`count--;;`（称为后增）\n\n请注意，如果我们使用这些增减运算符如`count++;`或`count--;;`，它们的效果相同。然而，同样注意，如果你在如下表达式中使用这些运算符：\n\
  \n```c\ncount = count++;\n```\n\n或者\n\n```c\ncount =++count;\n```\n\n那么这两个表达式将不会产生相同的效果。这是因为在第一个表达式中，`count`的值被赋值给`count-variable`（左侧），然后`count`的值将加\
  \ 1。另一方面，在第二个表达式中，`count`的值先增加，然后才被赋值给左侧的变量`--count`。\n\n我们现在可以解决一个例子了。\n\n示例 1：编写一个\
  \ C 程序来展示后增和前增运算符的概念。\n\n方案 1：程序如下：\n\n```c\n #include<stdio.h>\n       void main(\
  \ )\n         {\n            int counter, precount, postcount;\n            counter\
  \ = 10;\n            precount = ++counter;\n            postcount= counter;\n  \
  \          printf(\"%d\", precount);\n            printf(\"%d\", postcount);\n \
  \        }\n```\n\n输出如下：\n\n```\n11\n11\n```\n\n运算符是导致编译器采取操作的符号。在`sum = a + b;`这样的表达式中，我们说`+`是一个运算符，而`a`和`b`是操作数。C\
  \ 还支持下面讨论的运算符。\n\n#### 算术运算符\n\nC 提供了两个一元和一个二进制算术运算符（见表 2.2）。\n\n表 2.2：C 中的算术运算符\n\
  \n| 符号 | 含义 |\n| --- | --- |\n| + | 一元加 |\n| – | 一元减 |\n| * | 乘法 |\n| / | 除法 |\n\
  | % | 取模（余数运算符） |\n| + | 二进制加 |\n| – | 二进制减 |\n\n在语句`(u*v + w)`中，先执行乘法操作然后执行加法。这是因为`*`的优先级高于`+`。通常，乘法、除法和模运算符的优先级高于二进制加减运算符。\n\
  \n#### 增减运算符\n\n在 C 中，我们有`++`（增）和--（减）运算符，它们将变量的值加减 1。这可以通过两种方式实现：\n\n(a) `++ count;`和\
  \ `-- count;`（称为前增）\n\n(b) `count ++;`和`count--;;`（称为后增）\n\n请注意，如果我们使用这些增减运算符如`count++;`或`count--;;`，它们的效果相同。然而，同样注意，如果你在如下表达式中使用这些运算符：\n\
  \n```c\ncount = count++;\n```\n\n或者\n\n```c\ncount =++count;\n```\n\n那么这两个表达式将不会产生相同的效果。这是因为在第一个表达式中，`count`的值被赋值给`count-variable`（左侧），然后`count`的值将加\
  \ 1。另一方面，在第二个表达式中，`count`的值先增加，然后才被赋值给左侧的变量`--count`。\n\n我们现在可以解决一个例子了。\n\n示例 1：编写一个\
  \ C 程序来展示后增和前增运算符的概念。\n\n方案 1：程序如下：\n\n```c\n #include<stdio.h>\n       void main(\
  \ )\n         {\n            int counter, precount, postcount;\n            counter\
