  \ 语言中的文件处理\n\n### 5.0 引言\n\n文件长期以来一直用于存储数据。文件是传统的数据结构。它们对于顺序操作（如从文件读取或写入文件）非常有用。你需要创建一个文件，打开它，写入内容，最后关闭文件。你也可以从文件中读取。当文件数据以可读字符的形式存储时，它就是文本文件。当数据以不可读的格式存储时，它是二进制文件。\n\
  \n### 5.1 文件指针\n\n首先，我们必须打开一个文件。文件数据以可读字符的形式存储，它是文本文件。当数据以不可读的格式存储时，它是二进制文件。\n\n\
  声明文件指针的语法：\n```c\nFILE *fp;\n```\n\n打开文件的语法：\n```c\nfp = fopen (“filename”, “mode”);\n\
  ```\n其中 `fp` 是指向 `FILE` 的指针。`fopen()` 是一个有两个参数的库函数；一个是文件名，另一个是要打开文件的模式。\n\n表 5.1\
  \ 打开模式\n\n| 模式 | 目的 |\n| --- | --- |\n| r | 用于读取文本文件。如果文件存在，设置一个指向第一个字符的指针；否则返回\
  \ `NULL`。 |\n| w | 用于写入文本文件。如果文件存在，则覆盖其内容；否则创建一个新文件。 |\n| a | 用于在现有文件末尾添加数据。如果文件不存在，则创建一个新文件，指针指向第一个字符。\
  \ |\n| r+ | 用于读写的文本文件。可能的操作包括读取现有内容、写入新内容和修改现有内容。如果文件不存在则返回 `NULL`。 |\n| w+ | 用于读写的文本文件。可能的操作包括写入新内容或读取和修改现有内容。如果文件不存在，将创建它用于更新。\
  \ |\n| a+ | 用于读写的文本文件。可能的操作包括读取现有内容和在文件末尾添加新内容；无法修改现有内容。如果文件不存在，将创建它。 |\n| rb, wb,\
  \ ab, rb+, wb+, ab+ | 前述模式的二进制文件版本，与其相应的文本文件模式具有相同的特性。 |\n\n打开文件时的问题\n\n1. 我们尝试读取一个不存在的文件。\n\
  2. 我们尝试写入一个文件，但磁盘上没有足够的空间。\n3. 我们尝试打开一个已损坏的文件。\n\n解决方案：在读取或写入之前，我们必须检查文件是否成功打开。如果无法打开文件，`fopen()`\
  \ 函数将返回 `NULL`（在 `stdio.h` 中定义的哨兵值）。让我们看看是如何操作的\n\n\n\n\n\n```\n fp = fopen(“text.dat”,”w”);\n\
  \   if (fp = =NULL)\n    {\n      printf(“\\n Cannot open file text.dat”);\n   \
  \   exit (1);\n    }\n   或者我们也可以用另一种方式写：\n   if ((fp = fopen(“text.dat”,”w”)) =\
  \ = NULL)\n    {\n      printf(“\\n Cannot open file text.dat”);\n      exit ( 1);\n\
  \    }\n```\n\n| | |\n| --- | --- |\n| 注意 | 在此处注意，如果文件没有成功打开，将给出以下消息： |\n\n‘`cannot\
  \ open file text.dat`’\n\n当你完成对文件的操作后，必须将其关闭。这是通过使用库函数 `fclose()` 实现的。\n\n### 语法（关闭文件）：\n\
  \n```c\nfclose (fp);\n```\n\n其中 `fp` 是与要关闭的文件关联的文件指针。始终关闭你打开的任何文件。这是一个良好的编程习惯。\n\
  \n文件输入/输出 (I/O) 操作有不同的类型，如下图 5.1 所示。\n\n![](img/00029.jpeg)\n\n图 5.1 文件 I/O 操作\n\
  \n### 5.2 使用文件的字符输入/输出\n\n就像我们可以使用 `getchar()` 和 `putchar()` 函数从键盘读写数据一样，我们也可以使用字符\
  \ I/O 函数一次读取或写入一个字符。\n\n#### 写入文件\n\n在向文件写入之前，我们必须以写模式打开它。\n\n#### 语法\n\n```c\n\
  fputc (ch, fp);\n```\n\n其中 `ch` 是一个字符变量或常量，`fp` 是文件指针。\n\n#### 从文件读取数据\n\n写入文件中的数据也可以使用\
  \ `fgetc()` 函数从同一个文件中读取。\n\n#### 语法\n\n```c\nch = fgetc(fp);\n```\n\n其中 `ch` 是一个字符变量，`fp`\
  \ 是文件指针。\n\n`fgetc()` 函数用于从 `fp` 指向的文件中一次读取一个字符。它返回读取到的字符，或者返回文件结束符（`EOF`）字符。请注意，`EOF`\
  \ 也存在于 `<stdio.h>` 文件中。\n\n### 5.3 字符串 I/O 函数\n\n也可以以字符串的形式更方便地读写数据。\n\n#### 写入文件\n\
  \n我们可以以字符串的形式将数据写入文件。我们使用 `fputs()` 函数来实现。\n\n#### 语法\n\n```c\nfputs (s, fp);\n\
  ```\n\n其中 `s` 是一个字符串常量或变量，`fp` 是文件指针。与用于将数据写到屏幕上的 `puts()` 函数相比，此函数用于将数据放入或写入文件中。\n\
  \n#### 从文件读取数据\n\n以字符串形式写入文件的数据也可以通过 `fgets()` 函数读取。\n\n#### 语法\n\n```c\nfgets (s,\
  \ n, fp);\n```\n\n其中 `s` 是字符串，`n` 是输入字符串的最大长度，`fp` 是文件指针。该函数一次读取一个字符串；如果它读取到 `EOF`\
  \ 字符，它将返回一个 `NULL` 值。\n\n### 5.4 整数 I/O 函数\n\n就像我们可以按字符或按字符串为单位读取或读写数据一样，我们也可以以整数的形式读写数据。\n\
  \n#### 向文件写入数据\n\n对于以整数形式写入数据，我们使用 `putw()` 函数：\n\n#### 语法\n\n```c\nputw (n, fp);\n\
  ```\n\n其中 `n` 是写入文件的整数常量或变量，`fp` 是文件指针。\n\n#### 从文件读取数据\n\n对于从文件读取数据，使用 `getw()`\
  \ 函数：\n\n#### 语法\n\n```c\ngetw (fp);\n```\n\n当遇到 `EOF` 时，此函数返回一个 `EOF` 字符。\n\n###\
  \ 5.5 格式化 I/O 函数\n\n格式化 I/O 函数用于从文件读取或写入任何类型的数据（char、int、float、string 等）。这些函数的行为类似于控制台\
  \ I/O 函数——`scanf()` 和 `printf()`。唯一的区别是格式化 I/O 函数用于文件。\n\n#### 向文件写入数据\n\n为了从文件写入格式化输出，我们使用\
  \ `fprintf()` 函数：\n\n#### 语法\n\n```c\nfprintf(fp, “format string”, list);\n```\n\
  \n其中 `fp` 是文件指针；格式化字符串为 `%c`（字符）、`%d`（整数）或 `%f`（浮点数）；`list` 是写入文件的变量数量。\n\n####\
  \ 从文件读取数据\n\n为了从文件读取格式化数据，我们使用 `fscanf()` 函数：\n\n#### 语法\n\n```c\nfscanf(fp, “format\
  \ string”, list);\n```\n\n其中 `list` 是存储这些值的地址列表。\n\n### 5.6 块（或记录）I/O 函数\n\n块或记录\
  \ I/O 函数用于从文件中读取或写入结构体或数组。这些函数基本上用于读取或写入数据库文件——例如，如果我们想以结构体的形式从文件中读取或写入完整的员工记录。\n\
  \n#### 向文件写入数据\n\n为了向文件写入块数据，我们使用 `fwrite()` 函数：\n\n#### 语法\n\n```c\nfwrite (ptr,\
  \ size, count, fp);\n```\n\n其中 `ptr` 是指向要写入数据的指针，`size` 是大小，`count` 是数量，`fp` 是文件指针。从文件中读取块数据，使用\
  \ `fread()` 函数：\n\n#### 语法\n\n```c\nfread (ptr, size, count, fp);\n```\n\n其中 `ptr`\
  \ 是指向接收数据的指针，`size` 是大小，`count` 是数量，`fp` 是文件指针。该函数一次读取一个块；如果它读取到 `EOF` 字符，它将返回一个\
  \ `NULL` 值。\n\n\n\n\n\n输出（运行后）：\n\n11\n22\n-45\n\n## 示例 3：编写一个 C 程序以：\n\n(a) 在文件中写入混合数据类型的数据。\n\
  (b) 从同一个文件中读取格式化数据。\n\n#### 解决方案 3(a):\n\n```c\n #include<stdio.h>\n#include<conio.h>\n\
  \         void main( )\n         {\n            FILE *fp;\n            char ch =\
  \ ‘y’, name[30];\n            int age;\n            float salary;\n            clrscr(\
  \ );\n            if ((fp = fopen(“test4.dat”, “w”)) = =NULL)\n            {\n \
  \                 printf(“\\n Cannot open file”);\n                  exit(1);\n\
  \            }\n            while (ch = =’y’)\n             {\n                \
  \  printf(“\\n Enter name, age and salary:”);\n                  scanf(“%s%d%f”,\
  \ name, &age, &salary);\n                  fprintf(fp, “%s\\t/%d\\t%f\\n”, name,\
  \ age, salary);\n                  printf(“\\n More records (y/n)?”);\n        \
  \          ch = tolower (getche( ));\n                  }\n             fclose (fp);\n\
  \            }\n```\n\n输出（运行后）：\n\n|  |  |  |\n| --- | --- | --- |\n| Enter name,\
  \ age and salary: Rajiv | 41 | 82000.00 |\n| Enter name, age and salary: Ajay |\
  \ 52 | 52000.00 |\n| More records (y/n)? y |  |  |\n\n#### 解决方案 3(b):\n\n```c\n\
  \ #include<stdio.h>\n            #include<conio.h>\n            void main( )\n \
