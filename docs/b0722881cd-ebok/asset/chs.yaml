  \ `for` 循环的递增/减部分）被执行，然后评估测试表达式。\n\n`continue` 语句应该谨慎使用，因为像 `break` 语句一样，它也会跳过循环逻辑，导致代码难以理解和调试。\n\
  \n大多数重复算法可以使用上述讨论的三种循环中的任何一种来编写。但每个循环在不同的情况下效果最好。\n\n1. `while` 循环：正如我们所见，`while`\
  \ 循环是一个预测试循环。如果你希望当条件从一开始为假时不执行循环迭代，那么这种循环是理想的。如果你想使用哨兵值来终止循环，它也是理想的。哨兵值是一个特殊值，不会被误认为是列表的成员，并表示没有更多值需要输入。当用户输入哨兵值时，循环终止。\n\
  \n2. `do-while` 循环：正如我们所见，`do-while` 循环是一种后测试循环。这种循环对于始终希望循环至少迭代一次的情况是理想的。\n\n3.\
  \ `for` 循环：正如我们所见，`for` 循环是一个预测试循环，它内置了初始化、测试和更新的表达式。这些表达式使得将循环控制变量作为计数器非常方便。在确切迭代次数的情况下，`for`\
  \ 循环是理想的。\n\n### return 语句\n\n`return` 语句仅用于方法（`C` 语言中的函数和 `C++` 中的成员函数在 Java 中被称为方法）。它通过将控制权传回给调用者方法来终止方法的执行。因此，如果一个方法必须返回一个值，你可以这样写：\n\
  \n```\nreturn expression;\n```\n\n另一方面，对于不返回任何值的 `void` 类型方法，使用以下语法：\n\n```\nreturn;\n\
  ```\n\n`return` 语句无条件地从被调用方法将控制权传回给调用方法。这意味着 `return` 语句和方法结束之间的所有的语句都会被跳过。这就是为什么此类语句通常放置在方法的末尾；在特定条件适用且需要提前终止时，也可以使用它。对于返回非\
  \ `void` 类型的方法，在方法末尾使用 `return` 语句是关重要的。\n\n|  |  |\n| --- | --- |\n| 注意 | 对于具有\
  \ `void` 返回类型的方法，可以省略此语句，编译器将隐式添加。 |\n\n### 块语句\n\n封装在花括号内的一组语句组成一个块。因此，一个块包含语句列表——一系列语句。块中的语句被称为嵌入语句，它可以是一个标签、一个声明或简单语句。请注意，块也称为复合语句。在块中没有语句或有一个空语句是允许的。块在语法上与单个语句相似。还要注意，在结束块的右花括号后不放置分号。当块中没有语句时，它被称为空块。具有一个空语句的块不是空块，因为它包含了一个有效的语句。即：\n\
  \n```\n\n```\n { }     //是空块\n        { ; }    //非空块\n```\n\n空语句：不执行任何操作的语句被称为空语句。它以单个分号的形式写，如下所示：\n\
  \n```\n ;     //空语句\n```\n\n记住，空语句也称为空操作或空值语句（null statement）。该语句帮助程序人员在程序执行中引入一些延迟。实际上，它们什么都不做，只是跳过了某些机器周期，从而产生延迟。例如，\n\
  \n```\n for( int i=0; i<100; i++)\n           {\n                 ;     //空语句\n\
  \           }\n```\n\n同样，我们可以在 `while` 和 `do-while` 循环中使用它。\n\n帮助程序员在程序执行中引入一些延迟。\n\
