  \ `sum()` 是一个函数。这个函数可能返回值，也可能不返回。我们稍后会学习这一点。 |\n\n在向系统标识 `main()` 之后，我们现在必须指定该例程做什么。这是通过将例程的所有程序语句封装在一对大括号内（第\
  \ 3 行）来实现的。还要注意，包含在大括号之间的所有程序语句都被系统视为 `main` 例程的一部分。在 Hello World! 程序中，我们只有两个这样的语句。第一条语句告诉我们要调用或执行名为\
  \ `printf` 的例程。字符字符串 `\"hello world! \\n\"` 是传递给 `printf` 例程的参数或参数。\n\n只需记住 `printf`\
  \ 例程是 C 语言库中的一个函数。它只是在双引号之间在你的屏幕上打印或显示它的参数。还要注意，字符串中的空格被视为一个字符。\n\n在第 4 行中看到的还有两个特殊字符——反斜杠（`\\\
  `）和字母 `n`——它们合称为换行符。这个换行符告诉系统精确地执行其名称所暗示的操作——即跳转到新的一行（下一行）。\n\n| | |\n| --- | ---\
