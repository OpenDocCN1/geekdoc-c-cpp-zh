  \ ARRAYS AND POINTERS\n\n### 3.0 INTRODUCTION\n\n假设我们希望在我们的大学存储 3000 名学生的成绩；如果我使用变量，则需要超过\
  \ 3000 个变量。这非常琐碎。所以为了解决这类问题，我们使用具有共同名称和下标的数组。因此，数组被定义为相同类型元素的有限序列。共同名称是数组，每个单独的项目被称为元素。\n\
  \n数组被定义为一组在内存中连续存储的相同类型。这意味着数组的元素存储在从第一个开始的后续内存中。数组的每个元素可以通过数组名称和下标来引用。数组可以有一个或多个维度——一维（1D）、二维（2D）或多维。一维数组使用单个索引，二维数组使用两个索引，以此此类推。一维数组可以用于表示数据列表，也称为向量。同样，二维数组可以用于表示由行和列组成的数据表，它称为矩阵。三维数组可以用于表示表格集合。该概念可以超出三个维度。\n\
  \n数组的维度被称为秩（rank）。例如，一维数组的秩为 1，二维数组的秩为 2，以此此类推。下标的数量由数组的秩决定。数组中的总元素数是数组中每个维度大小的乘积。如果数组的任何一个或多个维度大小为\
  \ 0，则该数组为空数组。数组可能是规则的或锯齿的（ragged）。锯齿数组是包含数组作为元素的一维数组。\n\n### 3.1 1D, 2D, AND 3D\
  \ ARRAYS\n\n在程序中使用数组元素之前，必须创建数组。有两个步骤：\n\na. 声明数组\nb. 实例化数组\n\n数组声明语法取决于形状和维度数量。只有声明的数组才能实例化。\n\
  \n在 C 语言中，一维数组的声明如下：\n\n    datatype   arrayname[ ];\n\n\n\n\n\n例如，以下语句声明了一个整数数组：\n\
  \n```c\nint marks[ ];\n```\n\n请注意，该语句仅声明 `marks` 是一个数组变量；实际上并不存在数组。\n\n数组也可以如下所示的方式进行初始化（例如初始化前\
  \ 6 个元素）：\n\n```c\nint marks [ ] = {10, 20, 30, 40, 50, 60};\n```\n\n请注意，在这种情况下，数组将自动创建为足够大的空间，以容纳你在数组初始化器中指定的元素数量。另外请注意，初始化数组时不需要使用\
  \ `new` 运算符。你可以通过在方括号指定索引来访问数组元素。例如，你可以通过 `marks[3]` 访问数组 `marks` 的第四个元素。\n\n记住以下几点：\n\
  \n1. 方括号紧跟在数据类型后面而不是数组名。\n2. 方括号也可以紧跟在数组名后面。\n3. 上述语法声明了对特定数据类型数组的引用。\n4. 这些引用用默认的空值初始化。\n\
  5. 因此，仅通过声明不会为数组分配内存。\n6. 元素的数据类型和数组的秩（rank）是通过声明确定的。\n7. 表示维度长度的数组大小不是数组类型的一部分。这就是为什么在声明中没有提到数组的大小。\n\
  8. 声明也没有在起始和结束方括号之间包含任何整数值。\n9. 注意这里在 C 语言中，数组索引从 0 开始并使用整数表达式。\n10. 大小为 0 的数组被称为空数组。\n\
  11. 一旦创建数组，其大小就不能更改。\n12. 数组中最后一个元素的下标比数组中的总元素数少 1。\n13. 在 C 语言中，数组初始化有两个缺点：\n \
  \   (a) 没有简单的方法可以只初始化选定的元素。\n    (b) 没有快捷方法可以初始化大量元素。\n14. 为了缓解索引问题，在编写处理数组的循环时，通常使用\
  \ `sizeof( ` 表达式——即：\n\n```c\nint i;\nshort a[ ] = {1,2,3,4,5};\nfor (i=0; i< (sizeof(a)\
  \ / sizeof(short)); ++i)\n{\n   ………\n}\n```\n\n在前面的代码段中，数组的大小没有显式指定。编译器知道将其大小设为\
  \ 5，因为列表 `a` 中有 5 个元素。向列表添加额外的值将导致大小调整为 6，由于 `for` 循环中使用了 `sizeof` 表达式，代码会自动适应这一变化。\n\
  \n例如，\n\n```c\nvoid main( )\n{\n    int a[ ] = {2,4,6,8,10};\n    int i;\n    for\
  \ ( i = 0; i < 5; i ++)\n        printf (“The array elements are: “, a[i]);\n}\n\
  }\n```\n\n输出（运行后）：\n\n246810\n\n在此注意，C 语言会严格检查以确保你不会尝试存储或引用数组范围之外的值。C 的运行时系统会完成所有这些工作。如果你尝试越界数组边界，C\
  \ 将报告如下错误：\n\nException in “main” ‘Array Index is Out Of Bounds...’\n\n所以我们在使用 C\
  \ 语言的数组时必须小心。\n\n正如之前解释过的样，普通数组可以是一维或多维的。超过 3 维的数组很少使用。普通数组是一维数组的最简单形式。它也是使用章节开头提到的两个步骤创建的。\n\
  \n假设我们想给数组添加 100 个元素。我们可以这样写：\n\n```c\nsum = 0.0;\nfor(i=0; i<100; ++i)\nsum = a[i];\n\
  ```\n注意，除了整数常量，还可以在括号内使用整数表达式来引用数组的特定元素。因此，如果 `low` 和 `high` 定义为整数变量，那么语句\n\n`next_value\
  \ = sorted_data[(low + high)/2];`\n\n将通过计算表达式 `(low+high)/2` 给 `next_value` 赋值。\n\
