  7. 重复步骤 2 到 7，直到 `(a<=3)` 为假。\n8. 退出。\n\nC 程序如下如下：\n\n```\n void main ( )\n    \
  \   {\n          int a, b;\n          a=1;\n          do\n           {\n       \
