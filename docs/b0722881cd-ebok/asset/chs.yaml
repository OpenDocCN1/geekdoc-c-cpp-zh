  \n\n\n\n\n## 文件处理：文本模式 vs. 二进制模式\n\n| 在文本模式下，字符数以逐字符的格式存储（`1234` 占用 `4` 字节；`1234.56`\
  \ 在磁盘上占用 `7` 字节）。位数越多的数字需要的磁盘空间越大。 | 可以通过将数字转换为二进制格式进行存储。每个数字在磁盘上占据的字节数与其在内存中占据的字节数相同。因此，在二进制文件中存储数字效率更高。例如，`fread()`\
  \ 和 `fwrite()` 函数使用二进制模式。 |\n\n## 问题\n\n### Q3. 什么是命令行参数？为什么要使用它们？它们是如何传递给 `main`\
