  \ f0;\n        printf(“%d”,f2);\n        f0 = f1;\n        f1 = f2;\n    }\n   \
  \ }\n  }\n```\n\n输出（运行后）：\n\n0112358132134\n\n### Q2. 使用 `for` 循环编写一个 C 程序来检查给定数字是否为阿姆斯特数（Armstrong\
