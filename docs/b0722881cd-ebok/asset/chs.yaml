  nReading array elements:\");\n   for(i=0; i<row; i++)\n    {\n      for(j=0; j<col;\
  \ j++)\n         scanf(\"%d\", &a[i][j]);\n    }\n      big = a[0][0];\n      small\
  \ = a[0][0];\n   for(i=0; i<r; i++)\n    {\n      for(j=0; j<c; j++)\n       {\n\
  \         if (a[i][j] > big)\n          {\n               big = a[i][j];\n     \
  \          locbi = i +1;\n               locbj = j + 1;\n          }\n         if\
  \ (a[i][j] < small)\n          {\n               small = a[i][j];\n            \
  \   locsi = i +1;\n               locsj = j + 1;\n          }\n       }\n     }\n\
  \     printf(\"\\nLargest element is %d\", big);\n     printf(\"\\nLargest element\
  \ is stored at %d row %d column\",    locbi, locbj);\n     printf(\"\\nSmallest\
  \ element is %d\", small);\n     printf(\"\\nSmallest element is stored at %d row\
  \ %d column\", losci, locsj);\n     getch( );\n}\n```\n\n输出（运行后）：\n\nEnter the row\
  \ and column of a matrix: 3 3\n\nEchoing …\n\n1 2 3\n\n4 5 6\n\n7 8 9\n\nLargest\
  \ element is 9\n\nLargest element is stored at 3 row and 3 column\n\nSmallest element\
  \ is 1\n\nSmallest element is stored at 1 row and 1 column\n\n### 示例 5：编写一个 C 程序来打印杨辉三角——即：\n\
  \n|  |  |  |\n| --- | --- | --- |\n| 1 |  |  |\n| 1 | 1 |  |\n| 1 | 2 | 1 |\n| \
  \ |  |  |  |  |\n| --- | --- | --- | --- | --- |\n| 1 | 3 | 3 | 1 |  |\n| 1 | 4\
  \ | 6 | 4 | 1 ? |\n\n### 解决方案 5：程序如下：\n\n```c\n #include<stdio.h>\n#include<conio.h>\n\
  void main( )\n{\n   int a[10][10], i, j, n;\n   clrscr( );\n   printf(\"\\nHow many\
  \ rows you want?\");\n   scanf(\"%d\", &n);\n   for (i =1; i< = n; i++)\n    {\n\
  \      for (j=1; j <=i j++)\n       {\n         if (j = = 1 || j = = i)\n      \
  \         a[i][j] = 1;\n         else\n               a[i][j] = a[i-1][j] + a[i-1][j-1];\n\
  \         printf(\"%d\\t\", a[i][j]);\n       }\n       printf(\"\\n\");\n    }\n\
  \   getch( );\n}\n```\n\n输出（运行后）：\n\nHow many rows you want? 5\n|  |  |  |  |  |\n\
  | --- | --- | --- | --- | --- |\n| 1 |  |  |  |  |\n| 1 | 1 |  |  |  |\n| 1 | 2\
  \ | 1 |  |  |\n| 1 | 3 | 3 | 1 |  |\n| 1 | 4 | 6 | 4 | 1 |\n\n### 字符数组\n\n与数字数组类似，我们也可以定义和使用字符数组，如下：`char\
  \ array_name[size];`。这里 `array_name` 是存储字符类型数据的名称，`size` 是字符的总数。例如，`char name[80];`。这里\
  \ `name` 是一个包含 80 个字符的数组。再次，数组索引从 0 开始，因此 `name[]` 的第五个元素是 `name[4]`。同样可以使用循环访问整个数组。\n\
  \n### 向字符数组中读取字符\n\n与整数数组的方法相同，但应该知道字符占用一个字节，因此存储 10 个字符的字符数组大小为 10。这里是：`for(i=0;\
  \ i<size++)` `scanf(\"%c\", &name[i]);`。\n\n### 从字符数组写入字符\n\n与整数数组相同，写入的循环如下：`for\
  \ (i=0; i<size++)` `printf(\"%c\", name[i]);`。在进一步讨论之前，尝试编写以下程序。\n\n### Q1. 编写一个\
  \ C 程序使用字符数组读取你的名字。\n\n解决方案 1：程序如下：\n\n```c\n #include<stdio.h>\nmain( )\n{\n  \
  \ char name[10]\n   int i;\n   printf(\"\\nPlease enter your name:\");\n   for(i=0;\
  \ i<10++)\n      scanf(\"%c\", &name[i]);\n   printf(\"\\nEchoing...\");\n   for(i=0;\
  \ i<10++)\n      printf(\"%c\", name[i]);\n}\n```\n\n输出（运行后）：\n\nPlease enter your\
  \ name: Dr. RAJIV\n\nEchoing… Dr.\n\n### 如何初始化字符数组\n\n与整数或浮点数数组类似，我们也可以在声明期间初始化字符数组，如下：`char\
  \ name[10] = {'D', '.', 'A', 'J', 'V'};`。我们也可以写成：`char name[] = {'D', '.', 'A',\
  \ 'J', 'V'};`。请注意，在数组声明期间，如果省略了下标（数组大小），则被假设为初始化数组的数据的大小。同样注意，由用户来记住存储在数组中的字符数。\n\
  \n### C 中的字符串\n\n字符串是一个以空字符（NULL character）终止的特殊字符数组。这个空字符由 `\\0` 表示（NULL 的 ASCII\
  \ 值为 0）。C 中的字符串包含在双引号中。例如，“Dr. Rajiv Chopra is a Ph.D. in Computer Science”。每个字符存储一个字节。最后一个字符是空字符。\n\
  \n### 如何初始化字符串？\n\nC 中的字符串是逐字符初始化的，如下：`char name[10] = {'D', 'R', 'A', 'J', 'V',\
  \ '\\0'};`。请注意，必须在字符串末尾插入空字符。但也可以如下所示初始化字符串：`char name[10] = \"Dr. RAJIV\";`。这里空字符由\
  \ C 编译器自动添加。同样注意，在声明 char 为字符串时，字符串的大小应该大一个字符。这意味着如果字符数组可以容纳 10 个字符，那么作为字符串可以存储\
  \ 9 个字符，因为字符串中存储的最后一个字符是空字符。\n\n### 如何读取和写入字符串\n\n`scanf` 中用于字符串的格式说明符是 `%s`。例如：\n\
  \n```c\n #include<stdio.h>\nmain( )\n{\n   char name1[] = \"Dr.\";\n   char name2[]\
  \ = \"Rajiv\";\n   printf(\"\\nFirst name is %s\", name1);\n   printf(\"\\nSecond\
  \ name is %s\", name2);\n}\n```\n\n结果为：\n\nFirst name is Dr.\n\nSecond name is Rajiv\n\
  \n另一个示例：\n\n```c\n #include<stdio.h>\nmain( )\n{\n char name1[15], name2[15];\n\
  \ printf(\"\\nPlease enter your first name:\");\n   scanf(\"%s\", name1);\n   printf(\"\
  \\nPlease enter your second name:\");\n   scanf(\"%s\", name2);\n   printf(\"\\\
  nFirst name is %s\", name1);\n   printf(\"\\nSecond name is %s\", name2);\n}\n```\n\
  \n结果：\n\nPlease enter your first name: RAJIV\n\nPlease enter your second name: CHOPRA\n\
  \nFirst name is: RAJIV\n\nSecond name is: CHOPRA\n\n但在此请注意`%s` 格式说明符有一些局限性：\n\n\
  1. 使用 `%s` 格式说明符的第一个局限是程序员必须记住字符数组的大小。\n\n2. 第二个局限是它无法从键盘接收多单词字符串。\n\n3. 在 C 中，我们有标准函数\
  \ `gets()` 从键盘接收多单词字符串，以及函数 `puts()` 在屏幕上打印多单词字符串。\n\n### C 中的 `gets()` 和 `puts()`\
  \ 函数\n\n在 C 中，我们有标准函数 `gets()` 从键盘接收多单词字符串，以及函数 `puts()` 在屏幕上打印多单词字符串。例如：\n\n```c\n\
  \ #include<stdio.h>\nmain( )\n{\n   char name[50];\n   printf(\"Enter your full\
  \ name:\");\n   gets(name);\n   puts(name);\n}\n```\n\n输出（运行后）：\n\nEnter your full\
  \ name: Dr. Rajiv Chopra\n\nDr. Rajiv Chopra\n\n\n\n\n\n```c\n #include<stdio.h>\n\
  \   main( )\n   {\n      char name1[50][name2[50];\n      printf(“\\nEnter the first\
  \ name: “);\n      gets(name1);\n      printf(“\\nEnter the second name: “);\n \
  \     gets(name2);\n      printf(“\\nFirst name is:”);\n      puts(name1);\n   \
  \   printf(“\\nSecond name is:”);\n      puts(name2);\n      }\n```\n\nOUTPUT (after\
  \ running):\n\nEnter the first name: Dr. RAJIV\n\nEnter the second name: CHOPRA\n\
  \nFirst name is: Dr. RAJIV\n\nSecond name is: CHOPRA\n\n但这里存在一些局限性。我们使用 `gets()`\
  \ 和 `puts()` 函数只能接收和显示一个字符串。因此，以下语句是完全无效的：\n\n`gets(name1, name2)` /* 无效 */\n\n\
  `puts (name1, name2)` /* 无效 */\n\n类似地，我们使用 `puts()` 函数只能在屏幕上显示一个字符串。\n\n让我们来看看如何实现：\n\
  \n```c\n #include<stdio.h>\nmain( )\n{\n   puts(“\\nDr. RAJIV”);\n   puts(“\\nCHOPRA”);\n\
  \   getch( );\n}\n```\n\nOUTPUT (after running):\n\nDr. RAJIV\n\nCHOPRA\n\n在进一步讨论之前，让我们先写一些程序。\n\
  \n## 示例 1：编写一个 C 程序将大写字符串转换为小写字符串。\n\n### 解决方案 1：请记住大写字母（A, B, C, 等）的 ASCII 值在 65\
  \ 到 90 之间，小写字母（a, b, c, 等）的值在 97 到 122 之间。每个大写字母与其对应的小写字母之间的差值为 32。记住这一点，我们写了以下程序：\n\
  \n```c\n #include<stdio.h>\nmain( )\n{\n   char name[80];\n   int i =0;\n   puts(“\\\
  nEnter any upper case string:”);\n   gets(name);\n   puts(“\\nEchoing….);\n   puts(name);\n\
  \   while (name[i] != ‘\\0’)\n{\n   if (name[i] >=65) && (name[i] <=90))\n     \
  \ name[i] = name[i] + 32;\n   i++;\n}\nputs(“Converted lower case string is”);\n\
  puts(name);\n}\n```\n\nOUTPUT (after running):\n\nEnter any uppercase string: DR.\
  \ RAJIV CHOPRA\n\nEchoing …\n\nDR. RAJIV CHOPRA\n\nConverted lowercase string is:\n\
  \ndr. rajiv chopra\n\n## 内置字符串函数与“string.h”头文件\n\nC 提供了一个内置字符串处理函数库。这些内置函数定义在名为\
  \ `<string.h>` 的头文件中。如果你使用以下任何内置字符串函数，必须包含该文件：\n\n| | |\n| --- | --- |\n| I. | `strlen()`\
  \ 函数 |\n| II. | `strcpy()` 函数 |\n| III. | `strcmp()` 函数 |\n| IV. | `strcat()` 函数\
  \ |\n| V. | `strrev()` 函数 |\n| VI. | `strlwr()` 和 `strupr()` 函数 |\n\n### I. `strlen()`\
  \ 函数\n\n`strlen()` 函数返回字符串中字符的总数（不包括空字符）。\n\n#### 语法\n```\nstrlen(str);\n```\n\n\
  在这里，`str` 是任何字符串常量或字符串变量名。\n\n例如，\n\n```c\n #include<stdio.h>\n#include<string.h>\n\
  main( )\n{\n   char name[20];\n     int len;\n     printf(“\\nEnter any string:”);\n\
  \     gets(name);\n     len = strlen(name);\n     printf(“The length of a given\
  \ string is %d”, len);\n}\n```\n\nOUTPUT (after running):\n\nEnter any string: Dr.\
  \ Rajiv Chopra\n\nThe length of a given string is 16\n\n| | |\n| --- | --- |\n|\
  \ 注意 | 每个空格被视为 1 字节（即使是 ‘.’ 也被视为 1 个字节）。 |\n\n### II. `strcpy()` 函数\n\n`strcpy()`\
  \ 函数将一个字符串的内容复制到另一个字符串。它返回一个整数值。\n\n#### 语法\n```\nstrcpy(dest, source);\n```\n\n\
  在这里，字符串 `source` 的内容被复制到字符串 `dest` 中。\n\n例如，\n\n```c\n #include<stdio.h>\n#include<string.h>\n\
  main( )\n{\n   char name[20], dupname[20];\n   printf(“\\nEnter your string:”);\n\
  \   gets(name);\n   strcpy(dupname, name);\n   printf(“Duplicated string is %s”,\
  \ dupname);\n}\n```\n\nOUTPUT (after running):\n\nEnter your string: DR. RAJIV\n\
  \nDuplicated string is: DR. RAJIV\n\n### III. `strcmp()` 函数\n\n`strcmp()` 函数比较一个字符串的内容与另一个字符串。它返回一个整数值。\n\
  \n#### 语法\n```\nstrcmp(str1, str2);\n```\n\n在这里，`str1` 和 `str2` 是字符串常量或字符串变量。如果它们相等，函数返回\
  \ 0；如果 `str1` 小于 `str2`，返回负数；如果 `str1` 大于 `str2`，返回正数。记住这种比较是大小敏感的。\n\n例如，\n\n```c\n\
  \ #include<stdio.h>\nmain( )\n{\n   char name1[80], name2[80];\n   printf(“\\nEnter\
  \ your string:”);\n   gets(name1);\n   printf(“\\nEnter your string:”);\n   gets(name2);\n\
  \   if (strcmp(name1, name2) == 0)\n      printf(“Both strings are equal”);\n  \
  \ else\n      printf(“Both strings are not equal”);\n}\n```\n\nOUTPUT (after running):\n\
  \nEnter your string: DR. RAJIV\n\nEnter your string: CHOPRA\n\n### IV. `strcat()`\
  \ 函数\n\n`strcat()` 函数将第二个字符串追加到第一个字符串后面。\n\n#### 语法\n```\nstrcat(str, str);\n```\n\
  \n在这里，`str2` 被追加到 `str1`。\n\n例如，\n\n```c\n #include<stdio.h>\n#include<string.h>\n\
  main( )\n{\n   char str1[20], str2[20], str3[20];\n   printf(“\\nEnter first string:”);\n\
  \   gets(str1);\n   printf(“\\nEnter second string:”);\n   gets(str2);\n   strcpy(str3,\
  \ str1);\n   strcat(str3, str2);\n   printf(“Concatenated string is %s”, str3);\n\
  }\n```\n\nOUTPUT (after running):\n\nEnter first string: DR. RAJIV\n\nEnter second\
  \ string: CHOPRA\n\nConcatenated string is: DR. RAJIVOPRA\n\n### V. `strrev()` 函数\n\
  \n`strrev()` 函数反转字符串。\n\n#### 语法\n```\nstrrev(str);\n```\n\n在这里，`str` 的内容被反转。在继续讨论之前，让我们写一些程序。\n\
  \n示例 1：编写一个 C 程序判断给定的字符串是否为回文。\n\n解决方案 1：正读和反读都相同的字符串即为回文。\n\n```c\n #include<stdio.h>\n\
  #include<string.h>\nmain( )\n{\n   char name1[80], name2[80];\n   printf(“\\nEnter\
  \ your string:”\n   gets(name1);\n   strcpy(name2, name1);\n   strrev(name2);\n\
  \   if (strcmp(name1, name2) == 0)\n      printf(“String is a palindrome”);\n  \
  \ else\n      printf(“String is not a palindrome”);\n}\n```\n\nOUTPUT (after running):\n\
  \nEnter your string: MADAM\n\nString is a palindrome\n\n### VI. `strlwr()` 和 `strupr()`\
  \ 函数\n\n`strlwr()` 函数将字符串的字符转换为小写，而 `strupr()` 函数将字符串的字符转换为大写。\n\n#### 语法\n```\n\
  strlwr(str);\nstrupr(str);\n```\n\n例如，\n\n```c\n #include<stdio.h>\n#include<string.h>\n\
  main( )\n{\n   char name1[80], name2[80];\n   printf(“\\nEnter your string:”);\n\
  \   gets(name1);\n   strcpy(name2, name1);\n   strlwr(name1);\n   strupr(name2);\n\
  \   printf(“Equivalent lowercase string is %s”, name1);\n   printf(“Equivalent uppercase\
  \ string is %s”, name2);\n}\n```\n\nOUTPUT (after running):\n\nEnter your string:\
  \ Dr. Rajiv\n\nEquivalent lowercase string is dr. rajiv\n\nEquivalent uppercase\
  \ string is DR. RAJIV\n\n## 字符串数组/二维字符数组\n\n字符串数组也被称为二维字符数组。\n\n#### 语法\n```\nchar\
  \ arrayname[row][col];\n```\n\n在这里，`arrayname` 是字符串数组的名称，`row` 是字符串的数量，`col` 是每个字符串预留的列数。我们也可以在声明时初始化字符串数组，如下：\n\
  \n| | | |\n| --- | --- | --- |\n| char days[7][10] | = | { |\n| | | {‘M’, ‘O’, ‘N’,\
  \ ‘D’, ‘A’, ‘Y’, ‘\\0’}, |\n| | | {‘T’, ‘U’, ‘E’, ‘S’, ‘D’, ‘A’, ‘Y’, ‘\\0’}, |\n\
  | | | {‘W’, ‘E’, ‘D’, ‘N’, ‘E’, ‘S’, ‘D’, ‘A’, ‘Y’,‘\\0’}, |\n| | | {‘T’, ‘H’, ‘U’,\
  \ ‘R’, ‘S’, ‘D’, ‘A’, ‘Y’, ‘\\0’}, |\n| | | {‘F’, ‘R’, ‘I’, ‘D’, ‘A’, ‘Y’, ‘\\0’},\
  \ |\n| | | {‘S’, ‘A’, ‘T’, ‘U’, ‘R’, ‘D’, ‘Y’, ‘\\0’}, |\n| | | {‘S’, ‘U’, ‘N’,\
  \ ‘N’, ‘D’, ‘A’, ‘Y’, ‘\\0’}, |\n| | | }\n\n\n\n\n\n|  |  | `{‘F’, ‘R’, ‘I’, ‘D’,\
  \ ‘A’, ‘Y’,‘\\0’},` |\n|  |  | `{‘S’, ‘A’, ‘T’, ‘U’, ‘R’, ‘D’, ‘A’, ‘Y’,‘\\0’},`\
  \ |\n|  |  | `{‘S’, ‘U’, ‘N’, ‘D’, ‘A’, ‘Y’,‘\\0’},` |\n\n```c\n };\n```\n\n或者你也可以如下所示初始化字符串数组：\n\
  \n```c\n char days[7][10] = {\n         “MONDAY”,\n         “TUESDAY”,\n       \
  \  “WEDNESDAY”,\n         “THURSDAY”,\n         “FRIDAY”,\n         “SATURDAY”,\n\
  \         “SUNDAY”\n        };\n```\n\n这比上一个简单。\n\n现在，如果我们想显示名为 `days[] []` 的字符串数组的内容，我们使用以下语句：\n\
  \n```c\nfor(i=0; i<6; i++)\n    printf(“\\n%s”, days[i]);\n```\n\n实现此点的另一种方法是：\n\
  \n```c\nfor(i=0; i<6; i++)\n    printf(“\\n%s”, days[i] [0]);\n```\n\n同样，如果我们要从键盘读取字符串到数组中，我们使用以下语句：\n\
  \n```c\nfor(i=0; i<6; i++)\n    scanf(“\\n%s”, days[i]);\n```\n\n现在现在写一个完整的程序，根据给定的星期几数字显示星期名称。\n\
  \n```c\n #include<stdio.h>\nmain( )\n{\nchar days[7][10] = {\n         “MONDAY”,\n\
  \         “TUESDAY”,\n         “WEDNESDAY”,\n          “THURSDAY”,\n          “FRIDAY”,\n\
  \          “SATURDAY”,\n          “SUNDAY”\n         };\n int choice;\n printf(“\\\
  nEnter any week day number:”);\n scanf(“%d”, &choice);\n if ((choice >=1) && (choice\
  \ <=7))\n printf(“\\nYou have entered %s”, days[choice – 1]);\n else\n    printf(“\\\
  nYou have entered wrong number”);\n}\n```\n\n输出（运行后）：\n\nEnter any week day number:\
  \ 4\n\nYou have entered THURSDAY.\n\n我们现在可以编写一些程序了。\n\n## 示例 1：编写一个 C 程序来展示 C 中按值传递的概念。然后使用引用传递的概念重写完全相同的程序。\n\
  \n解决方案 1：像其他任何参数（数据）一样，数组元素也可以按值传递和按引用传递。在按值传递传递方法中，传递的是数组元素；而在引用传递中，传递的是数组元素的地址。让我们现在来写这两个程序。\n\
  \n```c\n /* using pass by value or call by value in C */\n#include<stdio.h>\n#include<conio.h>\n\
  void main( )\n{\n   int m [ ] = {10, 20, 30, 40 50}, i;\n   clrscr( );\n   for(i\
  \ =0; i< 5; i++)\n      show(a[i]);\n   getch( );\n}\n   show (int marks)\n    {\n\
  \      printf(“\\t%d”, marks);\n    }\n```\n\n输出（运行后）：\n\n10 20 30 40 50\n\n另一方面，在引用传递或引用传递中：\n\
  \n```c\n /* using pass by reference or call by reference in C */\n#include<stdio.h>\n\
  #include<conio.h>\nvoid main( )\n{\n   int m [ ] = {10, 20, 30, 40 50}, i;\n   clrscr(\
  \ );\n   for(i =0; i< 5; i++)\n      show(&a[i]);\n   getch( );\n}\n   show (int\
  \ *marks)\n    {\n      printf(“\\t%d”, *marks);\n    }\n```\n\n输出（运行后）：\n\n10 20\
  \ 30 40 50\n\n## 示例 2：你将如何修改上述程序以在 C 中传递整个数组？\n\n解决方案 2：程序如下：\n\n```c\n #include<stdio.h>\n\
  #include<conio.h>\nvoid main( )\n{\n   int a[ ] = {10, 20, 30, 40 50}, i;\n   clrscr(\
  \ );\n   show(a, 5); /* a is the starting address of the array */\n   getch( );\n\
  }\nshow (int *a, int n)\n{\n   int i;\n   for (i=0; i<n i++)\n    {\n      printf(“\\\
  t%d”, *a);\n      a ++;\n    }\n}\n```\n\n输出（运行后）：\n\n10 20 30 40 50\n\n## 示例 3：编写一个\
  \ C 程序使用冒泡排序法对整数数组。\n\n解决方案 3：程序如下：\n\n```c\n #include<stdio.h>\n#include<conio.h>\n\
  void main( )\n{\n   int a[10], i, j, temp;\n   clrscr( );\n   printf(“\\n\\tEnter\
  \ the size of your array:”);\n   scanf(“%d”, &n);\n   printf(“\\n\\tEnter your elements:”);\n\
  \   for(i =0; i<n; i++)\n    scanf(“%d”, &a[i]);\n   printf(“\\n\\tEchoing array.”);\n\
  \   for(i =0; i<n; i++)\n    printf(“%d”, a[i]);\n   /*sorting now */\n   for(i\
  \ =0; i<n; i++)\n    for(j=1; j<n-1; j++)\n    if(a[i] > a[j])\n    {\n        temp\
  \ = a[i];\n        a[i] = a[j];\n        a[j] = temp;\n    }\n    printf(“\\n\\\
  tThe sorted array is:”);\n    for(i =0; i<n; i++)\n    printf(“%d”, a[i]);\n   \
  \ getch( );\n}\n```\n\n输出（运行后）：\n\nEnter the size of your array: 5\nEnter your elements:\
  \ 20 10 40 50 30\nEchoing array… 20 10 40 50 30\nThe sorted array is: 10 20 30 40\
