  \n(b) 结构化英语：\n第 1 步：开始\n第 2 步：将和以及待加元素初始化为 `0`。\n第 3 步：读取待加元素的个数——即读取 `n`。\n第 4\
  \ 步：读取一个要加的数字并设为 `a`。\n第 5 步：`s=s+a` 和 `i=i+1`\n第 6 步：如果 `i<n`，跳转到第 4 步，否则跳转到第 7\
  \ 步。\n第 7 步：显示（输出）`sum` 的值。\n第 8 步：停止。\n\n(c) 伪代码：\n```\n Algo_ add(a, n)\n    \
  \     {\n               s:= 0.0;\n               for i:=1 to n do\n            \
  \   s:= s + a [i]; S + a [i];\n               return s;\n         }\n```\n\n(d)\
  \ C 代码：\n```\n int add(int a[ ] , int n)\n         {\n              int i, s=0;\n\
  \              for(i=0; i <n ; i++)\n              s=s + a[i];\n              return\
  \ s;\n         }\n```\n\n### 1.3 编译器概览\n\n编译器是一种软件程序，它负责分析用特定计算机语言开发的程序，然后将其翻译成适用于特定计算机系统上执行的形式。GNU\
  \ C 编译器 `gcc` 是 C 语言现有的最好的编译器。事实上，它是一个编译器套件，因为该包包含了 `g++`（C++ 编译器），并便于编译其他语言，如 Objective-C、Objective-C++、固定格式和自由格式的\
  \ Fortran、ADA 以及 `JAVA2`。它可以处理 C 的不同方言。它还能为各种 CPU 族（如 ARC、AVR、ARM、Darwin、DEC Alpha、HPPA、i386\
  \ 和 x86-64、IA-64、MIPS、PDP-11、POWERPC、SPARC 等）生成可执行代码。当你调用 `gcc` 时，它通常会执行预处理、编译、汇编和链接。整体选项允许在中间阶段停止此过程。例如：\n\
  \n- `-c` 编译或汇编源文件但不链接。不进行链接阶段。输出为每个源文件的对象文件形式。\n- `-S` 在真正的编译阶段后停止；不汇编。输出为每个指定的非汇编输入文件的汇编代码文件形式。\n\
  - `-E` 在预处理阶段后停止；不运行真正的编译器。输出为预处理后的源代码形式，然后发送到标准输出。\n- `-o` 将输出置于文件 `file` 中。\n\
  - `-wall` 这是一个警告选项——显示所有可能的警告，在代码的初始调试期间非常有用。\n\n实际上，`gcc` 拥有大量关于警告、调试、优化、预处理器、链接器、汇编以及目标机器或语言的选项——例如\
  \ C 编译器、C++ 编译器等。\n\n用 C 语言开发的计算机程序在输入、编译和执行过程中涉及步骤如图 1.3 所示。\n\n![](img/00002.jpeg)\n\
  \n图 1.3 输入、编译和执行 C 程序的基本步骤\n\n解释：要编译的程序首先被输入并保存到文件中。C 程序以 `.c` 扩展名保存。因此，`program1.c`\
  \ 可能是 C 程序的有效文件名。C 程序在文本编辑器中输入、保存和编辑。例如，`vi` 是 Unix 系统上常用的文本编辑器。输入到文件中的程序被称为源程序，因为它代表了用\
  \ C 语言表示的程序的原始形式。源程序输入到文件后，你就可以进行编译。编译过程通过在系统上输入特殊命令来启动。当输入该命令时，必须指定包含源程序的名。例如，在\
  \ Unix 系统上，启动程序编译的命令称为 `cc`。\n\n但请记住，如果你使用的是流行的 GNU C 编译器，你使用的命令是 `gcc`。因此，输入该行：\n\
  \n```\ngcc program1.c\n```\n具有启动对 `program1.c` 中源程序进行编译过程的效果。\n\n在编译过程的第一步中，编译器检查源程序中包含的每个程序语句，并确保符合语言的语法。实际上，编译器通常会对程序进行预扫描以寻找特殊语句。这被称为预处理。如果编译器在此阶段发现了任何错误，编译过程就会结束。然后必须使用编辑器在源程序中纠正错误并重新编译。在此阶段报告的典型错误可能是由于括号不平衡（语法错误）或使用了未定义的变量（语义错误）。\n\
  \n当消除了程序中的语法和语义错误后，编译器随后将每个语句翻译成低级形式。这意味着编译器将语句翻译成汇编语言语句。\n\n程序翻译成汇编程序后，编译过程的下一步是将汇编语句翻译成实际机器指令。这一步可能涉及执行独立的程序，即汇编器。在大多数系统中，汇编器作为编译过程的一部分自动执行。汇编器将每个汇编语句转换为二进制格式的对象代码，然后写入系统的另一个文件中。该文件在\
  \ Unix 下通常与源文件名相同，但最后一个字母为 `o`（对象）而不是 `c`。在 Windows 中，后缀字母 `obj` 通常替换文件名中的 `c`。\n\
  \n程序翻译成对象代码后，就可以进行链接。这一过程在 Unix 下执行 `cc` 或 `gcc` 命令时再次自动执行。还要理解链接阶段的目的是获取程序的最终形式。如果程序使用了之前由编译器处理的其他程序，那么在这个阶段这些程序将被链接在一起。系统程序库中的程序在此阶段也被搜索并与对象程序链接。编译和链接程序的过程被称为构建。最终的链接文件以可执行对象代码格式存储在系统的另一个文件中，准备好运行或执行。\n\
  \n在 Unix 下，此文件称为 `a.out`。\n\n在 Windows 下，可执行文件通常与源文件名相同，将 `c` 扩展名替换为 `exe` 扩展名。\n\
  \n\n\n\n命令 `a.out` 用于执行程序。该命令会将名为 `a.out` 的程序加载到计算机内存中并启动其执行。当程序执行时，程序中的每条语句都会按顺序执行。如果程序向用户请求任何数据（称为\
  \ `input`），程序将临时暂停执行，以便输入数据。或者程序也可能简单地等待某个事件的发生，例如点击鼠标。程序显示的结果（称为 `outputs`）会出现在窗口中（也称为\
  \ `console` 控制台）。或者输出也可能被直接写入系统中的一个文件。\n\n如果程序运行正常，则没有问题，但这在第一次尝试时并不经常发生。如果程序没有产生预期的结果，就有必要回去重新分析程序的逻辑。这被称为调试阶段，在此阶段，将尝试从程序中消除所有已知的问题或错误（bugs）。这需要对原始源程序进行修改。请注意，在这种情况下，必须重复编译、链接和执行程序的整个过程，直到获得预期的结果。另请注意，通常\
  \ `gcc` 遵循以下处理步骤：\n\n- 步骤 1：预处理（调用 `cpp`）\n- 步骤 2：编译\n- 步骤 3：汇编（调用 `as`）\n- 步骤 4：链接（调用\
  \ `ld`）\n\n这也可以通过图形显示，如图 1.4 和 1.5 所示。\n\n![](img/00009.jpeg)\n\n图 1.4 `gcc` 使用汇编器从\
  \ C 转换为 `obj`\n\n![](img/00014.jpeg)\n\n图 1.5 `gcc`:链接器将 `obj` 文件转换为可执行文件\n\n在 `gcc`\
  \ 中，尝试优化级别由 `-0` 和其他开关控制，但对于嵌入式和设备驱动程序代码必须非常小心。\n\n### 1.4 汇编器、链接器和加载器\n\n如果我们回顾编程语言的历史，会发现如下：\n\
  \n(a) 20 世纪 40 年代使用了机器语言。\n(b) 20 世纪 50 年代使用了符号语言。\n(c) 20 世纪 60 年代使用了高级语言。\n\n\
  每台计算机都有其自己的由 0 和 1 的流组成的机器语言。这是因为计算机是由开关、晶体管和其他电子设备组成的，这些设备可以处于 1（逻辑高电）或 0（逻辑低电）状态。这些也被称为\
  \ 0（关闭）和 1（开启）。\n\n| | |\n| :--- | :--- |\n| 注意 | 计算机硬件唯一理解的语言是机器语言。 |\n\n20 世纪\
  \ 50 年代，数学家格拉斯·霍珀（Grace Hopper）海军将开发了一种特殊计算机程序的概念，可以将程序转换为机器语言。它使用符号（也称为记符），这就是为什么这些程序使用的语言被称为符号语言。因为计算机无法理解这种符号语言，因此必须将其翻译成机器语言。将符号代码转换为机器语言的程序被称为汇编器。\n\
  \n接着在 20 世纪 60 年代，高级语言的引入让程序员摆脱了用汇编语言编写程序的繁琐任务。符号语言和高级语言都有一个共同点——它们都必须转换为机器语言。而这种转换过程被称为编译。\n\
  \n例如，第一种高级语言是 FORTRAN（公式翻译）。它由 John Backus 和 IBM 团队于 1957 年创建。`C` 也是用于开发系统软件和新应用程序的高级语言。\n\
  \n通常一个程序非常大，因此将其拆分为较小的单元比较方便。这些单元每个存储在单独的文件中。在编译这些单独的程序文件后，必须以某种方式将它们链接在一起形成一个单一程序。这种链接通常由一个称为链接编辑器（linkage\
  \ editor）的程序完成，它通常在程序编译时自动运行。该链接器将所有函数（包括用户定义的函数和系统函数）组装成一个最终的可执行程序。\n\n一旦程序完成链接，就可以执行了。要执行程序，我们使用诸如\
  \ `run` 命令之类的操作系统命令。该命令将程序加载到主内存并执行它。而将程序读入内存是名为加载器（loader）的操作系统程序的功能。它定位可执行程序并将其读入内存。当所有内容加载完成后，程序接管控制并开始执行。\n\
  \n#### 示例 1：比较编译器和解释器。\n\n解答 1：下表比较了编译器和解释器：\n\n| 编译器 | 解释器 |\n| :--- | :--- |\n\
  | 1. 将整个程序转换为机器码，然后执行整个程序。 | 1. 逐步将程序转换为机器码，然后只运行该部分。 |\n| 2. 编译后列出所有错误。 | 2. 程序翻译后立即显示错误。\
  \ |\n| 3. 需要的时间较短。 | 3. 需要的时间较长。 |\n| 4. 调试效率高。 | 4. 调试效率较低。 |\n| 5. | 5. 生成 .exe\
  \ 文件（例如）。 |\n\n#### 示例 2：比较链接器和链接编辑器。\n\n解答 2：比较如下表：\n\n| 链接器 | 链接编辑器 |\n| :---\
  \ | :--- |\n| 1. 将目标模块和必要的库链接并立即加载到主内存。 | 1. 将目标模块和必要的库链接并存储在一个文件中。 |\n| 2. 仅使用一次。\
  \ | 2. 可以多次使用。 |\n| 3. 每次都要进行库搜索和外部解析。 | 3. 库搜索和外部解析只需进行一次。 |\n| 4. 不适合反复执行的程序。\
  \ | 4. 适合反复执行的程序。 |\n\n#### 示例 3：比较机器语言、汇编语言和高级语言。\n\n解答 3：比较如下表：\n\n| 机器语言 | 汇编语言\
  \ | 高级语言 |\n| :--- | :--- | :--- |\n| 1. 用机器语言编写的程序难以编写、调试和理解。 | 1. 汇编语言程序比机器语言简单。\
  \ | 1. 高级语言程序易于编写、调试和理解。 |\n| 2. 程序不可移植性。 | 2. 程序不可移植性。 | 2. 程序具有移植性。 |\n| 3. 程序员必须跟踪内存地址。\
  \ | 3. 程序员必须跟踪内存地址。 | 3. 不需要跟踪内存地址。 |\n| 4. 不需要翻译器转换为机器码。 | 4. 不需要翻译器转换为机器码。 | 4.\
  \ 需要编译器或解释器。 |\n| 5. 程序执行速度非常快。 | 5. 程序执行速度比机器语言慢。 | 5. 程序执行速度比汇编语言慢。 |\n\n### 1.5\
  \ C 语言简单“HELLO WORLD”程序的结构\n\n通常，任何 C 程序由一个或多个预处理指令、全局声明部分以及一个或多个函数组成。即\n\n![](img/00018.jpeg)\n\
  \n\n\n\n每个 C 程序都从一些预处理器指令或命令开始。这些是发送给预处理器的特殊指令，告诉它如何为编译准备程序。在每个 C 程序中，我们都会使用一个名为\
  \ `include` 的预处理器指令。这个 `include` 命令告诉预处理器，我们需要从被称为头文件的选定库获取信息。当我们编写 C 程序时（在某些编辑器中），所有的预处理分配将自动完成。这意味着预处理器实际上在对\
  \ C 程序本身进行分析之前，就已经对这些语句进行了分析。\n\n预处理器语句通过井号 `#` 的出现来识别，该符号必须是行中的第一个非空格字符。\n\n在 C\
  \ 语言中，程序员会插入一条指令 `#include<stdio.h>`，它告诉预处理器在程序的此位置包含头文件 `stdio.h`。\n\n然后，程序员可以给出全局声明（如果有的话）。全局声明是对程序所有部分都可见的声明。我们稍后将学习这些内容。\n\
  \n接着是 `main`，程序的实际执行从这里开始。我们知道程序的实际工作是由其`functions`（函数）完成的，函数是程序内任务的代码块。在任何程序中，只能有一个函数可以是`main`函数。程序中的所有函数（包括`main`）都分为两个部分——声明部分和语句部分。\n\
  \n声明部分位于函数的开头。它指定了你将在函数中使用到的数据。函数中的声明被称为局部声明，因为它们只对包含它们的函数可见。\n\n语句部分紧随声明部分之后。该部分包含某些导致操作执行的指令，例如两个数字相除。\n\
  \n让我们来看一个解释其结构的最简单 C 程序。\n\n```c\n /* My first C program */\n  1\\. #include<stdio.h>\n\
  \  2\\. int main (void)\n  3\\. {\n  4\\. printf(“Hello World! \\n”);\n  5\\. return\
  \ 0;\n  6\\. }\n```\n\n这个程序只有一个预处理器指令。没有全局声明，也没有局部定义。它简单地在屏幕上显示“Hello World!”。然后有两个语句，一个用于打印消息，另一个用于停止程序。\n\
  \n现在让我们学习这些部分。\n\n#### I. 预处理器指令/命令\n\n如前所述，预处理器是 C 编译过程的一部分，用于识别可能穿散布在整个 C 程序中的特殊语句。它实际上在\
  \ C 程序分析开始之前就已经对这些语句进行了分析。预处理器是编译器的一个部分，在程序编译之前会检查 C 程序。\n\n#### 预处理器的工作\n\n当你下发编译\
  \ C 程序的命令时，程序会自动通过预处理器运行。预处理器是一个根据程序中提供的指令来修改 C 源程序的程序。原始源程序通常存储在一个文件中。预处理器不会修改该程序文件，而是创建一个包含处理后的程序版本的新文件。这个新文件随后被提交给编译器。\n\
  \n当我们编译这个程序时，编译器显示的编译行数大于 6 行。这是因为在预处理阶段，`include` 预处理器指令（第 1 行）会在指定的目录列表中搜索 `stdio.h`\
  \ 文件，如果找到了头文件，`include` 指令就会被替换为头文件的全部内容。如果包含的头文件中包含另一个 `include` 指令，它也将被处理。这种处理将递归进行，直到没有剩余\
  \ `include` 指令或达到最大翻译限制（ISO 规定嵌套头文件的最大深度为 15 层）。因此，一行源代码被多行头文件内容替换。在编译阶段，这些添加的行也将被编译。因此，编译器显示的行数大于\
  \ 6。\n\n| | |\n| --- | --- |\n| 注意 | 某些编译器允许程序员仅对源程序运行预处理器，并查看预处理阶段的结果。 |\n\n请记住关于预处理器指令的以下几点：\n\
  \n1. 它们位于程序的开头。\n2. 它们以井号/哈希（`#`）符号开头。这是它的语法（规则）。\n3. 这些指令末没有分号。\n4. 它们可以从任何列开始，但通常从第\
  \ 1 列开始。\n5. 它们告诉编译器在程序中包含标准输入输出库文件。该库文件在屏幕上打印消息。实际上，打印是该库中识别的输入输出过程之一。\n6. 如第 1\
  \ 行所示，该命令的语法必须精确。\n7. 井号/哈希符号与保留关键字 `include` 之间没有空格。\n8. 它告诉预处理器你想将尖括号（`<>`）中的库文件包含在你的程序中。该头文件的名为\
  \ `stdio.h`。它代表“标准输入输出头文件”。\n9. 尖括号告诉预处理器在一个或多个标准目录中搜索文件。这些目录包含系统提供的头文件以及几个程序员常用的头文件（如果计算机是多用户机器）。\n\
  10. 有时括号会被替换为双引号，如下所示：\n\n```c\n#include \"stdio.h\"\n```\n\n在这种情况下，预处理器将首先在程序员自己的目录或与程序文件相同的目录中查找。如果在该处没有找到，则会搜索标准目录。\n\
  11. 预处理器还可以添加或删除 C 程序语句。\n12. 如果预处理器符号出现在单引号或双引号内，则永远不会被替换。\n13. 头文件还为多个程序文件提供了一致性。通常一个程序很大，因此可以将其拆分为较小的单元，每个单元存储在单独的文件中（注：此处原文为\
  \ break it into smaller units, each of which is stored in a separate file）。在这些独立的程序文件编译后，它们必须以某种方式链接成一个单一程序。这种链接通常由称为链接编辑器的程序完成（它在编译程序时自动运行）。\n\
  14. 头文件可以包含其他 `#include` 指令。请注意，它不能包含自身，否则会导致无限递归。同样注意，它不能包含另一个包含第一个文件的文件，因为这同样会导致无限递归。\n\
  15. 头文件可以包含任何文本。它们还可以包含定义结构模板、全局变量或函数定义的 C 代码。然而，头文件通常不包含函数定义，因为将这些存储在用户设置的函数库中效率更高。但有时会包含全局变量。\n\
  16. 如果程序中包含了 `stdio.h`，则将使用宏版本（稍后讨论）。另一方面，如果程序员希望使用函数版本，可以在 `#include<stdio.h>`\
  \ 指令之后取消它们的定义。\n17. 预处理器指令以其所占行的结束作为终止，但如有需要，可以通过在最后一行之外的行末尾添加反斜杠将其延续到一行或多行。\n\n\
