  \ printf：“以字符串 END 结束\\n”);\n   scanf：“%s”, names[n]);\n   while (strcmp(names[n],\
  \ “END”) > 0) {\n      n++;\n      scanf：“%s”, names[n]);\n   }\n   printf：“\\n”);\n\
  \   for (i=0; i<n++)\n      printf：“%10s”, names[i]);\n   printf(“\\n”);\n   printf：“\\\
  n”);\n   printf：“\\n 总数 = %d”, n);\n   /* 排序 */\n   for (i=0; i<n-1; i++)\n    \
  \  for (j=i+1; j<n; j++)\n         if (strcmp(names[i], names[j]) > 0) {\n     \
  \       temp = names[i];\n            names[i] = names[j];\n            names[j]\
  \ = temp;\n         }\n   printf(“\\n 排序后的姓名：\\n”);\n```\n\n输出：\n\n输入姓名一个一个\n以字符串\
  \ END 结束\nAjay\nBob\nCharlie\nDavid\nEND\n\n \n\n 总数 = 4\n\n 排序后的姓名：\n\n      Ajay\n\
  \         Bob\n      Charlie\n      David\n\n\n\n也就是说，当程序控制到达函数调用 `f1()` 时，它会将控制转移到函数\
  \ `f1()`（右侧），在该处遇到返回语句时，控制将返回到 `main()` 函数。\n\n## 为什么我们需要函数\n\n1. 编写和调试函数比编写大型的单体程序更简单。\n\
  2. 代码不再重复，因为我们可以在任何需要的地方调用函数。\n3. 函数具有可移植性，可以在任何系统上运行。\n4. 节省了大量的时间内存资源。\n5. 易于实现模块化。\n\
  6. 程序长度变得更短。\n\n## 函数的类型\n\n函数分为两种类型：\n\n(a) 库函数或内置函数。\n(b) 用户定义函数。\n\n库函数是语言编译器中预定义的、存储在特殊库文件中的内置函数。例如，我们包含\
  \ `math.h` 头文件来使用数学函数。\n\n另一方面，用户定义函数是那些由程序员定义并创建的函数。每个函数都是一个自包含的语句块，执行用户指定的某些定义良好的任务。\n\
  \n请记住关于函数的以下几点：\n\n1. 一个 C 程序是由一个或多个函数的集合。\n2. 当函数名后跟着括号和分号时，函数就会被调用。\n3. 注意，在语句\
  \ `int name` 中，`name` 是一个整数变量，`name[10]` 是数组，而 `name()` 是一个函数，尽管它们的名称相似。\n4. 任何函数都可以从任何其他函数调用。\n\
  5. 函数一旦写好就可以被调用任意次。即使 `main()` 也是一个可以反复调用的函数。这被称为递归。\n6. 函数调用的顺序和定义的顺序可能不同。这没有区别。\n\
  7. 函数有两种类型——像 `sqrt()`、`printf()`、`scanf()`、`sin()` 和 `cos()` 等这样的库函数，而上面定义的 `name()`\
  \ 函数是用户定义函数。\n\n函数定义的语法已经展示过了。现在我们让我们来看一个例子，\n\n## 定义函数\n\n1. `int gcd(int u, int\
  \ v)`\n2. `{`\n3. `int temp;`\n4. `temp = u % v;`\n5. `u = v;`\n6. `v = temp;`\n\
  7. `return (v);`\n8. `}`\n\n在这个函数中，请观察：\n\n1. 第 1 行是函数头，根据规则，函数头始终是形式的，其内部参数被称为形式参数或哑参数。\n\
  2. 从 `main()` 传递的参数被称为实际参数。实际参数可以是常量、变量或更复杂的表达式。\n3. 每个实际参数的类型必须与其对应的形式参数类型相同。\n\
  4. 每个实际参数的值被传递到函数并赋值给相应的形式参数。\n5. 如果没有指定函数的返回类型，则默认认为它是 `int` 类型。\n6. 形式参数不能是常量或表达式。\n\
  7. 函数的命名规则与变量名相同。\n8. `main` 函数或函数中的返回类型必须是相同的类型。\n9. 函数被称为被调用函数（called function），而调用它的\
  \ `main()` 函数被称为调用函数（calling function）。\n\n就像声明变量一样，函数也需要如下进行声明：\n\n`<type> <name>\
  \ (arguments);`\n\n这本质上是一个函数原型。如果你在 UNIX 平台上使用 C 语言，可能没有先写原型，但如果你使用 C++ 编译器运行程序，则是必要的。每个\
  \ C 程序也可以用 C++ 编译器运行，因为 C 是 C++ 的子集。\n\n例如，\n\n`fact(int n);`\n\n这里，`n` 是实际参数，且此函数调用没有返回值。它以分号结束。另一方面，考虑\n\
  \n`result = fact(int n);`\n\n此函数调用将在 `result` 变量中返回某个值。\n\n我们甚至可以写成：\n\n`fact();`\n\
  \n这意味着该函数现在没有要返回的内容，也没有参数。\n\n## return 语句（在函数中）\n\nreturn 语句用于将程序控制传回主程序。\n\n####\
  \ 语法\n\n```\nreturn (exp);\n```\n\n其中 `exp` 可以是常量、变量或表达式。`exp` 周的括号也是可选的。\n\n返回语句有两个任务：\n\
  \n1. 它将控制传回调用程序。\n2. 在返回调用程序后返回一个值。\n\n请注意，返回语句并不总是位于被调用函数的末尾。函数中存在的返回语句数量没有限制。还要注意，一个函数只能返回一个值。\n\
  \n## 用户调用函数\n\n用户可以创建并调用的函数有类型。\n\n### I. 无参数且无返回值的函数\n\n没有参数或返回值的函数是 C 中编写用户定义函数最简单的方法。程序的调用部分与被调用函数块之间没有数据通信。调用环境通过不传递任何形式参数来调用该函数，且函数不向调用者返回任何内容。\n\
  \n例如，\n\n```\n main()\n {\n    int x, y;\n    ……….\n    ……….\n    message(); //函数被调用\n\
  \ }\n message()\n {\n    //函数体\n }\n```\n\n这些函数没有参数也没有返回值。此类函数可能从外部或内部来源获取数据。也可以省略函数声明，但前提是函数在调用之前已经定义。例如，\n\
  \n```\n message()\n {\n    //函数体\n}\n\n main()\n {\n    int x, y;\n    ……….\n  \
  \  ……….\n    message(); //函数被调用\n }\n```\n\n这种方法对于短程序更简单，因为对于大型程序安排所有函数是很困难的。\n\n\
  ### II. 有参数无返回值的函数\n\n那些从调用函数接收参数但不返回值的函数属于下一类函数。\n\n例如，\n\n```\n main()\n   {\n\
  \       ………….\n       void power(int, int); //函数声明\n       …………\n   }\n   void power(int\
  \ x, int y)\n     {\n   //函数体\n }\n```\n\n在这里我们从 `main` 函数调用 `power()` 函数。在 `power`\
  \ 函数中，我们传递两个参数或变量 `x` 和 `y`。这些值被收集到调用函数的副本中。这个过程被称为值传递（call by value）。注意，如果你对函数的副本进行任何更改，该更改不会反映在调用函数的参数值上。此外，`void`\
  \ 表示我们没有返回任何值。\n\n### III. 无参数有返回值的函数\n\n第三类函数不从某些调用函数接收参数，但返回某个值。\n\n例如，\n\n```\n\
  \ #include<iostream.h>\n void main()\n  {\n     int add (void);\n     int sub (void);\n\
  \     int mul (void);\n     int x;\n     x = add();\n     printf(\"The addition\
  \ of two numbers:\");\n     x = sub();\n     printf(\"The difference of two numbers:\"\
  );\n     x = mul();\n     printf(\"The product of two numbers:\");\n  }\n int add()\n\
  \  {\n     int a, b, c;\n     printf(\"\\n Enter two numbers for addition:\");\n\
  \     scanf(\"%d %d\", &a, &b);\n     c = a + b;\n     return ( c) ;\n  }\n int\
  \ sub()\n  {\n     int a, b, c;\n     printf(\"\\nEnter two numbers for difference:\"\
  );\n     scanf(\"%d %d\", &a, &b);\n     c = a - b;\n     return ( c) ;\n  }\n int\
  \ mul()\n  {\n     int a, b, c;\n     printf(\"\\nEnter two numbers for multiplication:\"\
  );\n     scanf(\"%d %d\", &a, &b);\n     c = a * b;\n     return ( c) ;\n  }\n```\n\
  \nOUTPUT（运行后）：\n\nEnter two numbers for addition: 20 40\n\n\n\n\n两个数字相加：60\n\n输入两个数字以求差值：80\
  \ 40\n\n两个数之差：40\n\n输入两个数字以求乘积：50 90\n\n两个数的乘积：4500\n\n解释：在这个程序中，我们从 `main()` 函数调用了三个函数——`add()`、`sub()`\
  \ 和 `mul()`。请注意，由于我们没有向这三个函数传递任何值，而只是接收值，因此在它们的原型声明中，有必要在括号中包含 `void`，并将 `int` 作为它们的返回类型。如果函数原型指定其返回类型为\
  \ `void`，则它由其定义中的右大括号终止。如果你想从函数返回某个值，必须在函数体内部使用带有值的 `return` 语句。`return` 语句一次只返回一个值。返回\
  \ `void` 的函数可以使用不带值的 `return` 语句，如下所示：\n\n```\n void example( )\n   {\n      printf(”n\
  \ Thanks to God”);\n      return;\n   }\n```\n\n另外请注意，`return` 语句可以出现在函数体的任何位置。这意味着程序员可以自由地在函数体大括号之前使用它。\n\
  \n例如，\n\n```\n #include<iostream.h>\nvoid main( )\n{\n   void test( );\n   test(\
  \ );\n}\nvoid test( )\n{\n   int u;\n   printf(“Enter your number: “);\n   scanf(%d”,\
  \ &u);\n   if ( u < 0)\n      {\n         printf(“\\n It is a negative number”);\n\
  \         return;\n     }\n     else\n      {\n         printf(”\\n It is a positive\
  \ number”);\n         return;\n      }\n}\n```\n\n输出（运行后）：\n\nEnter your number:\
  \ -80\n\nIt is a negative number\n\n|  |  |\n| --- | --- |\n| 注意 | 如果你调用一个返回值的函数并将其使用在一个不期望有值的语文中（例如，你没有将返回值赋值给任何东西），实际上并没有发生任何异常。编译器不会发出警告信息。函数会正确执行并返回其值。调用者函数可以使用该值，也可以忽略它。\
  \ |\n\n### IV. 带参数和返回值的函数\n\n那些从调用函数接收某些参数并返回某些值的函数被归为下一类。在这里我们使用值传递法，该方法在第 3.4\
  \ 节中讨论过。\n\n### V. 递归\n\n递归被定义为函数不断调用自身的过程。这是一种用一个或多个相同问题的较小版本来定义问题的技术。解决方案基于较小版本的结果构建的。递归函数通过直接或间接调用自己来解决任务的较小版本，直到最后的不需要自调用的最终调用。\n\
  \n例如，\n\n```\n Add( )\n     {\n        Add ( );\n     }\n```\n\n这意味着函数 `add()` 调用了自己。\n\
  \n#### 递归的优点\n\n1. 递归使程序更加紧凑。\n2. 对于复杂问题，递归可以产生更清晰、更容易编写的解决方案。\n3. 它对于栈、队列、树等数据结构来说非常简单且非常合适。\n\
  4. 在递归过程中，系统会处理内部栈。\n5. 它对于存在某些重复性的问题很有用。\n\n#### 递归的缺点\n\n1. 从速度和执行时间来说，它是慢的。\n\
  2. 它需要更多的内存空间，因为在每次函数调用期间都会反复创建变量。\n3. 它需要额外的运行时开销。\n4. 对于大多数问题，递归很难实现。\n5. 过多的递归调用会导致栈溢出。\n\
  \n递归有两个条件：\n\n1. 函数必须不断地调用自己。\n2. 函数必须有一个退出条件。\n\n迭代与递归不同。表 3.1 列出了它们的差异。\n\n表 3.1：递归与迭代的区别\n\
  \n| 递归 | 迭代 |\n| --- | --- |\n| (1) 与迭代相比，它更慢。 | (1)迭代比递归快。 |\n| (2) 它占用更多内存，因为在每次函数调用期间都会反复创建变量。\
  \ | (2) 它占用内存较少，因为变量只声明一次。 |\n| (3) 这些算法可能需要多次函数调用的额外开销。 | (3) 这些算法不涉及开销。 |\n| (4)\
  \ 在某些情况下，递归很容易使用（如树形遍历）；否则，它很难。 | (4) 对于某些场景，迭代很难实现；有时它很容易实现。 |\n| (5) 系统处理内部栈。\
  \ | (5) 用户必须处理内部栈。 |\n\n让我们现在写一个程序，使用这些方法每一种（即递归和迭代）来找到数字的阶乘。\n\n#### 迭代法：\n\n找到数字阶乘的迭代循环如下：\n\
