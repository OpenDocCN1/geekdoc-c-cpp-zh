  \ to 3 = 8.000000\n\n### 示例 16：考虑经典的汉诺塔问题。它涉及使用第三个辅助塔将指定数量的盘子从一个塔移动到另一个塔。假设有三个塔\
  \ `A`、`B` 和 `C`。游戏开始时盘子按大小顺序堆叠在 `A` 上（即最大的在下面，最小的在上面）。目标是在满足以下约束的情况下将盘子从 `A` 转移到\
  \ `C`：\n\n(a) 每次只能移动一个盘子。\n(b) 较大的盘子不能放在较小的盘子上。\n\n编写一个 C 程序来模拟汉诺塔。\n\n#### 方案 16：让我们先写算法：\n\
  \n`if (n = =1)` `tower(A, C)` 将盘子 1 从 `A` 移动到 `C`\n\n`else`\n`tower(A, B)` 将 `n-1`\
  \ 个盘子从 `A` 移动到 `B`。\n`tower(A, C)` 将最大的盘子从 `A` 移动到 `C`。\n`tower(B, C)` 将 `n-1` 个盘子从\
  \ `B` 移动到 `C`。\n\n程序如下：\n\n```c\n #include<stdio.h>\n#include<conio.h>\n#include<process.h>\n\
  void main( )\n{\n   int n;\n   void tower(char from, char to, int n);\n   clrscr(\
  \ );\n   printf(“\\n Enter the number of disks:”);\n   scanf(“%d”, &n);\n   if (n\
  \ < 1)\n    {\n      printf(“\\n It is not possible”);\n      exit (1);\n  }\n \
  \ else\n     tower('A', 'C', n);\n}\nvoid tower (char from, char to, int n)\n{\n\
  \   if (n = =1)\n      printf (“\\n Move %c to %c”, from, to);\n   else\n    {\n\
  \      tower(from, to, n-1); // ... 递归逻辑\n    }\n}\n```\n\n等待，函数使用名为 `tlib.exe`\
  \ 的工具添加到库中（turbo c 的功能）。在添加函数后，链接器会自动将其与你的程序连接。考虑一个阶阶函数示例：\n\n```c\n int fact(int\
  \ n)\n  {\n    int i, f = 1;\n    for (i=1; i<=n; i++)\n       f = f * i;\n    return\
  \ (f);\n  ```\n\n将此程序保存到某个文件中——例如 `facto.c`。使用 `ctrl+F9` 编译此文件。这会创建一个带有对象代码的 `facto.obj`\
  \ 文件。\n\n从 DOS 提示符，使用命令将函数添加到库中：\n\n`C:\\>math.lib + facto.obj`\n\n请注意这里 `math.lib`\
  \ 是库名，`+` 用于向库添加新函数，`facto.obj` 是要添加的文件。同样注意 `-` 用于删除现有函数。\n\n现在在头文件中声明 `fact()`\
  \ 的原型——例如 `fact.h`。调用函数时应包含此文件。使用该函数创建一个程序：\n\n```c\n #include “fact.h”\n main(\
  \ )\n  {\n    int f;\n    f = fact (5);\n    printf(“%d”, f);\n  }\n```\n\n使用 `ctrl+F9`\
  \ 编译并执行该程序。\n\n### 示例 17：希望向 C 库添加自定义函数。如何实现？请举例。\n\n#### 方案 17：添加到库的函数首先要编译。然后使用名为\
  \ `tlib.exe` 的工具添加到库中。\n\n### 示例 18：区分形参参数和实参参数。\n\n#### 方案 18：以下是它们的区别：\n\n| 形参数\
  \ (Formal Parameter) | 实参数 (Actual Parameter) |\n| --- | --- |\n| (1) 形参数是在函数内部定义的变量。它们用于函数体内的表达式。\
  \ | (1) 实参数是在调用函数时指定的变量。当访问函数时，实参数替换形参数。 |\n| (2) 函数头总是形参数。 | (2) 函数调用具有实参数。 |\n\
  | (3) 它们在函数定义的第一行。 | (3) 它们在函数声明中。 |\n| 例如，`fact (int n){……}`。`n` 是在函数头中声明的形参数。\
  \ | 例如，`fact (5);` 这里，5 是正在传递的实参数。 |\n\n### 示例 19：区分值传递和引用传递。\n\n#### 方案 19：以下是两者之间的差异点：\n\
  \n| 值传递 (Call by Value) | 引用传递 (Call by Reference) |\n| --- | --- |\n| (1) 在这种方法中，变量的值被传递给调用的函数。\
  \ | (1) 在这种方法中，变量的地址被传递给调用的函数。 |\n| (2) 在调用的函数中，值在相同类型的变量中接收。 | (2) 因为在调用的函数中接收了变量的地址，它也被接收在指针变量中。\
  \ |\n| (3) 这些函数只能返回一个值。 | (3) 函数可以返回多个值。 |\n| (4) 语法为：`t = gcd(u, v);` | (4) 语法为：`gcd\
  \ (&u, &v);` |\n\n### 示例 20：写出两种编写原型的不同风格。\n\n#### 方案 20：写出原型的两种风格：\n\n`float sum\
  \ (float x, float y);`\n\n或者\n\n`float sum (float, float);`\n\n### 示例 21：区分 C 中的库函数和用户定义函数。\n\
  \n#### 方案 21：下表显示了差异点：\n\n| 库函数 (Library Functions) | 用户定义函数 (User-Defined Functions)\
  \ |\n| --- | --- |\n| (1)预定义在编译器本身中。 | (1)未在编译器中预定义。 |\n\n\n\n\n\n| 内置函数 | 用户定义函数\
  \ |\n| :--- | :--- |\n| (2) 无用户创建的库函数 | (2) 由程序员创建的用户定义函数 |\n| (3) 存储在特殊的库文件中 |\
  \ (3) 用户定义函数不存储在库文件中 |\n| (4) 程序中使用的每个内置函数都必须包含相应的头文件（否则会报错） | (4) 用户定义函数没有头文件 |\n\
  | (5) 程序执行不从库函数开始 | (5) 程序执行始终从用户定义函数开始——即 `main()` |\n| 例如，`log()`，`cos()`，`sqrt()`，`printf()`，`scanf()`\
  \ | 例如，`main()`，`sum()`，`sort()` |\n\n## 示例 22：编写一个示例程序，显示无参数且无返回值的函数。\n\n解决方案 22：程序如下：\n\
  \n```c\n/*无参数且无返回值的函数*/\n#include<stdio.h>\nmain ( )\n{\n   void hello ( ); /* 函数声明\
