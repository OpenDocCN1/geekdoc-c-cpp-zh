  \n# CHAPTER 3\n\n## ARRAYS AND POINTERS\n\n### 3.0 INTRODUCTION\n\nSay we wish to\
  \ store the marks of 3000 students at our college; if I use variables, more than\
  \ 3000 are required. This is very tedious. So to solve this type of problem, we\
  \ use an array that has a common name with a subscript. Thus, an array is defined\
  \ as an ordered sequence of finite elements of same type that share a common name.\
  \ The common name is the array and each individual item is known as an element.\n\
  \nAn array is defined as a set of same type that are stored contiguously in memory.\
  \ This means that the elements of an array are stored in subsequent locations starting\
  \ from the first. Each element of an array can be referred to by array name and\
  \ a subscript. Arrays can have one or more dimensions—one-dimensional (1D), two-dimensional\
  \ (2D), or multidimensional. A one-dimensional array uses a single index a two-dimensional\
  \ array uses two indexes, and so on. A 1D array can be used to represent a list\
  \ of data items and is also known as a vector. Similarly, a 2D array can be used\
  \ to represent a table of data items consisting of rows and columns. It is also\
  \ known as a matrix. A 3D array can be used to represent a collection of tables.\
  \ The concept can go beyond three dimensions.\n\nThe dimension of the array is known\
  \ as its rank. For instance, a 1D array has rank 1, a 2D array has rank of 2, and\
  \ so on. The number of subscripts is determined by the rank of an array. The total\
  \ number of elements in an array is the product of the sizes of each dimension in\
  \ an array. If any one or more of the dimensions of an array have size 0, the array\
  \ is known as an empty array. An array may be regular or ragged. A ragged/jagged\
  \ array is a 1D array which contains arrays as elements.\n\n### 3.1 1D, 2D, AND\
  \ 3D ARRAYS\n\nAn array must be created before using its elements in a program.\
  \ There are two steps:\n\na. Declare an array\nb. Instantiate an array\n\nThe syntax\
  \ for declaration of an array depends on the shape and number of dimensions. Only\
  \ declared arrays can be instantiated.\n\nIn C, a one-dimensional array is declared\
