  \ 17\n\n## 示例 6：编写一个 C 程序将其输入复制到输出，将每个一个或多个空格的字符串替换为空格。\n\n解决方案 6：我们将使用 C 的 `getchar()`\
  \ 和 `putchar()` 函数。\n\n### I. getchar 函数：`getchar()`\n\n`getchar` 函数从标准输入读取单个字符。它不接受参数并返回输入的字符。通常情况下，对\
  \ `getchar` 函数的引用写为：\n\n`variable = getchar();`\n\n例如：\n\n```c\nchar c;\nc = getchar();\n\
  ```\n\n此处注意，第二行会导致从键盘输入单个字符并将其赋值给 `c`。当使用 `getchar` 函数读取字符时遇到文件结束（end-of-file）情况，将自动返回符号常量\
  \ `EOF` 的值。还要注意，该函数也可以通过在多路循环中每次读取一个字符来读取多字符字符串。\n\n### II. putchar 函数：`putchar(variable\
  \ | constant)`\n\n标准 C 函数 `putchar` 通过将字符发送到标准输出来打印或显示单个字符。该函数接受一个参数，即要显示的字符。\n\n\
  例如，`putchar('R');` 将显示字符 ‘R’。\n\n或者\n\n`char var = '$';`\n\n`putchar(var);` 显示 $。\n\
  \n让我们先写出该程序的算法：\n\n步骤 1：读取一个字符。\n\n步骤 2：如果输入的字符不是空格，则打印它。\n\n步骤 3：否则打印第一个空格字符并跳过所有连续的空格。\n\
  \n步骤 4：重复步骤 1 到 3，直到输入的字符是换行符。\n\n程序如下：\n\n```c\n #include<stdio.h>\n#include<string.h>\n\
  void main( )\n{\n   char c;\n   printf(“\\nEnter the text:”);\n   c= getchar( );\n\
  \   printf(“The output text is: “);\n   while (c!= ‘\\n’)\n    {\n      if (c =\
  \ = ‘ ‘ || c= = ‘\\t’)\n       {\n         c = ‘ ‘;\n         putchar( c );\n  \
  \     }\n    while(c = = ‘ ‘ | | c = = ‘\\t’)\n    {\n      c = getchar( );\n  \
  \  }\n  putchar(c );\n  c = getchar( );\n  }\n  printf(“\\n”);\n}\n```\n\n输出（运行后）：\n\
  \nEnter the text: DR. RAJIV CHOPRA\n\nThe output text is: DR. RAJIV CHOPRA\n\n\n\
