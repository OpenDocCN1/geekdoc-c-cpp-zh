  (b) 行注释\n\n当注释跨越多行代码时使用块注释。它使用一个开始标记（`/*`）和一个结束标记（`*/`）。包含在其中的任何内容会被编译器直接忽略。标记可以在任何列开始，且不必在同一行。例如，\n\
  \n```/* 一个块注释可以延伸到\n多行内容也 */\n```\n\n另一方面，行注释使用两个斜杠（`//`）来标识注释。这里不需要行尾标记。这种注释格式非常受程序员的青睐，因为它更容易编写。它也可以从行的任何位置开始。\n\
