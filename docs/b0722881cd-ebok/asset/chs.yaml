  \    }\n```\n\n### 2.1 存储存储类：AUTO, STATIC, EXTERN AND REGISTER\n\nC 语言中的变量具有数据类型。但它们也有存储类，提供了关于其位置和可见性的信息。存储类划分了程序中识别变量的部分。以下是各种存储类：\n\
  \n#### I. Auto（自动）\n`auto` 存储类是局部变量，仅对在其声明的函数可见。`auto` 是默认类。`auto` 关键字将指定的变量放入内存的堆栈区域。这在大多数变量声明（如\
  \ `int i;`）中通常是隐式的。所有局部变量的默认类都是 `auto`。例如，\n\n```c\nint counter;\nauto int i;\n\
  ```\n这里定义的两个变量具有相同的存储类；`auto` 只能在函数内部使用（即局部变量）。\n\n#### II. Static（静态）\n`static`\
  \ 存储类是局部变量，即使在控制权转移到调用函数后，它仍然存在并保留其值。`static` 变量在函数返回后仍保留其值。`static` 变量在程序开始时初始化。。尝试使用循环来显示你的表格。（注：此处原文逻辑有重复，按原意翻译）\n\
  \n（注：由于原文文本中存在多处重复和逻辑混乱，译文已尽可能保持原文结构并进行翻译。）\n\n\n\n\n\n# register 关键字\n\n`register`\
  \ 关键字指的是存储在寄存器（`register`）中的变量。它建议编译器将特定变量放在直接位于 CPU 上的快速寄存器内存中。如今大多数编译器（如 `gcc`）都非常智能，建议寄存器实际上可能会让你的程序运行变慢。请注意，`register`\
  \ 用于定义应该存储在寄存器而非 `RAM` 中的局部变量。还需要注意的是，这意味着变量的最大大小等于寄存器的大小（通常为一个字），并且它不能使用一元操作符 `&`，因为它没有内存地址。\n\
  \n例如，\n\n```c\nregister int u;\n```\n\n`register` 关键字应该只用于需要快速访问的变量，例如计数器。同时要理解，定义\
  \ `register` 并不意味着该变量将存储在寄存器中；而是意味着它可能被存储在寄存器中——取决于硬件和实现上的限制。\n\n---\n\n## 练习题\n\
