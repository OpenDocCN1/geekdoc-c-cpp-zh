  \ 10，将引用 `sorted_data[5]`。\n\n同样注意，像变量一样，数组在使用之前必须声明。数组的声明涉及数组中元素的类型（如 `int`、`float`\
  \ 或 `char`）以及存储在数组中的元素的最大数量。\n\n### 如何从键盘读取数组\n\n考虑以下代码段：\n\n```c\nint i;  //n =\
  \ 10 = 数组大小\nint a[10];\nprintf(“ Enter total number of elements in array:”\nfor\
  \ (i =0; i<n; i++)\n    scanf(“%d”, &a[i]);\n```\n\n### 数组复制的问题\n\n数组是一个对象。数组与引用它的变量之间存在差异。因此，数组和引用变量是两个独立的实体。当你想要将一个数组的内容到另一个数组时，这种差异至关重要。\n\
