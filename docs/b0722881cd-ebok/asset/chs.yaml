  \ of a and b is 3\n\nValue of a and b is 4\n\nValue of a and b is 6\n\nValue of\
  \ a and b is 3\n\nValue of a and b is 6\n\nValue of a and b is 9\n\n### Q2. 区分 `while`\
  \ 循环和 `do-while` 循环。\n\n[提示：\n\n| `while` 循环 | `do-while` 循环 |\n| --- | --- |\n\
  | 1. 首先评估测试条件。 | 1. 先进入循环，然后评估测试条件。 |\n| 2. 循环执行的最小次数为零。 | 2. 循环至少执行一次。 |\n| 3.\
  \ 它也称为预测试循环或入口控制循环。 | 3. 它也称为后测试循环或出口控制循环。 |\n| 4. 它的语法是：`while(test-condition)\
  \ { Statement(s); }` | 4. 它的语法是：`do{ statement(s); while(test-condition); }` |\n\
  | 5. 不需要分号。 | 5. 在此循环的 `while` 语句后需要一个分号。 |\n\n#### for 循环\n程序中最常用、最频繁且功能最强大的循环是\
  \ `for` 循环。它被用于循环重复次数已知的情况。在 C 语言中，它可以用于执行已知次数的次数，或根据特定条件重复执行循环。\n\n#### 语法\n```\n\
  \ for ( expression-1; boolExpr; expr3)\n           {\n            statement(s);\n\
  \        }\n```\n\n### `for` 循环的工作原理\n`for` 循环的工作原理如下：\n\n1. 首先，评估 `expr1`。它通常用于初始化计数器。\n\
  2. 然后，评估 `boolExpr` 以检查执行条件。如果它返回真值，则：\n   (a) 执行循环中的语句。\n   (b) 评估 `Expr2`。 \n\
  \   (c) 然后控制转移到步骤 2。\n3. 如果 `boolExpr` 返回假值，则循环终止。\n\n这意味着 `for` 循环的工作原理如下：\n\n\
  ![\n\n也就是说，首先评估 `expr1`。然后检查条件。如果为真，则进入循环体（`{` 大括号之后）并执行其中的语句。在一次迭代结束后，控制回到 `expr2`，然后再次检查\
  \ `boolExpr` 条件。这就是 `for` 循环工作的过程。在此还要注意，在 `for` 循环中，三个表达式中的任何一个、两个或三个都可以省略，但必须放置两个分号（`;`）来分隔表达式。此外，`expr1`\
  \ 和 `expr2` 可以是逗号分隔的表达式列表。因此，`expr1` 或 `expr2` 也可能成为复合语句。\n\n关于 `for` 循环，请记住以下几点：\n\
  \n1. `for` 循环也可以使用 `while` 或 `do-while` 循环等价地编写。\n2. 任何有效值都可以初始化为 `expr1` 并作为计数器。\n\
  3. `for` 循环执行的最小次数为零。\n4. 也可以在 `for` 循环本身中声明计数器变量。\n5. 我们还可以嵌套讨论的三个循环中的任何一个。\n\n\
  \n\n让我们现在使用 `for` 循环重写这个程序：\n\n```c\n void main( )\n    {\n    int i, f0=0,f1=1,f2;\n\
