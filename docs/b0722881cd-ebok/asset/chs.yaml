  \\n\\tEnter the number of rows and columns of second matrix:\");\n   scanf(\"%d%d\"\
  , &row2, &col2);\n   if (col1 == row2)\n    {\n      printf(\"\\nEnter the elements\
  \ of first matrix (%d * %d)\\n\", row1, col1);\n      for (i=0; i<row1; i++)\n \
  \      {\n         for(j=0; j<col1; j++)\n          {\n               scanf(\"%d\"\
  , &a[i][j]);\n          }\n       }\n      printf(\"\\nEnter the elements of second\
  \ matrix (%d * %d)\\n\", row2, col2);\n      for (i=0; i<row2; i++)\n       {\n\
  \         for(j=0; j<col2; j++)\n          {\n               scanf(\"%d\", &b[i][j]);\n\
  \         }\n      }\n     for(i=0; i<row1; i++)\n      {\n        for(j=0; j<col2;\
  \ j++)\n         {\n              c[i][j] = 0;\n              for(k=0; k<col1; k++)\n\
  \                    c[i][j] += a[i][k] * b[k][j];\n         }\n      }\n      printf(\"\
  \\nMultiplication of two matrices is: \");\n      for(i=0; i<row1; i++)\n      \
  \ {\n        printf(\"\\n\");\n        for(j=0; j<col2; j++)\n         {\n     \
  \         printf(\"%d\\t\", c[i][j]);\n         }\n       }\n     }\n     else\n\
  \      {\n     printf(\"\\nColumns of first matrix and rows of second matrix do\
