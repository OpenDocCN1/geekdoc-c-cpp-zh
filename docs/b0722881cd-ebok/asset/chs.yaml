  \n该规则可以表述为：当你想覆盖默认的结合律时，必须使用括号。但在一对括号内部，相同的层级结构（如表 2.11）有效。此外，如果你有一组嵌套的括号，则最内层括号中的操作将首先执行，然后是下一层内层括号中的操作，依此类推。\n\
  \n### 2.8 C 语言中的类型转换（或强制类型）\n\nC 支持不同的数据类型，如 `int`、`float`、`long`、`double` 等。由于大小及其符号/无符号属性的不同，这些类型的取值范围也不同。在实践中，一个表达式可以在两个不同数据类型之间进行操作（一个可以是整数，另一个可以是浮点，反之亦然）。为了处理此类情况，C\
  \ 在这些情况下提供了特定的类型转换规则。请理解，当编译器在同一个表达式中遇到不同类型的操作数时，较小类型变量会被提升为较大的类型变量。内置数据类型的顺序见表\
  \ 2.12。\n\n表 2.12：内置数据类型\n\n| 数据类型 | 字节数 | 顺序 |\n| --- | --- | --- |\n| long double\
  \ | 10 | 6 (最大) |\n| double | 8 | 5 |\n| float | 4 | 4 |\n| long | 4 | 3 |\n| int\
  \ | 2 | 2 |\n| char | 1 | 1 |\n\n因此，如果你将一个较小类型的变量（例如 `int`）赋值给较大的类型（例如 `float`），那么较小的\
  \ `(int)` 值将被提升为较大的 `(float)` 值。相反，如果你将一个较大类型的值（例如 `float`）赋值给较小类型（例如 `int`），那么较大的值会被降级，多余的数据甚至会被截断；在某些情况下，除非你进行隐式类型转换，否则编译器会发出警告。\n\
  \n这是由编译器自动完成的。但有时程序员也可以进行类型转换，这是一种显式将一种类型转换为另一种类型的技术。C 中的类型转换/强制转换方式如下：\n\n```\n\
  type(expression);\n```\n\n在这里，`type` 是 C 中任何要进行转换的有效数据类型。\n\n### 2.9 使用 IF-ELSE\
  \ 进行条件执行\n\n`if` 语句后面跟着一个逻辑表达式，在该表达式中进行数据比较并根据比较结果做出决策。其语法如下：\n\n```c\nif (testcondition)\n\
  {\n    statement (s);\n}\nelse\n{\n    statement (s);\n}\n```\n\n在这里，当 `testcondition`\
  \ 为真时，执行 `if` 子句包含的语句；否则，执行 `else` 子句包含的语句。\n\n`if` 语句用于创建决策结构，允许程序拥有多条执行路径。它可以通过图\
  \ 2.1 中的流程图表示。\n\n![](img/00030.jpeg)\n\n图 2.1：If-Else 决策结构逻辑流程图\n\n可以使用关系运算符如 `>`\
  \ `<`, `>=`, `<=`、`=` 和 `!=`。但请记住，当你使用 `<=` 或 `>=` 运算符时，它们之间没有空格。\n\n尽管 `if` 语句通常跨越多行，但它实际上是一个长语句。例如，以下\
  \ `if` 语句在编写风格上除外，是完全相同的：\n\n```c\nif (salary > 100000)\n    printf(\"\\n It is\
  \ a good salary\");\n\nif (salary > 1000000) printf(\"\\n It is a good salary\"\
  );\n```\n\n另外注意，在这两个例子中，编译器都将 `if` 语句和条件执行语句视为一个单元，并在末尾正确地放置了分号。缩进和空格是为了程序的类阅读者的，而不是为了编译器。\n\
  \n#### 使用 if 语句的规则\n\n-   **规则 1**：条件执行语句应该出现在 `if` 语句的下一行。\n-   **规则 2**：条件执行语句应该比\
  \ `if` 语句缩进一层。\n\n记住，在大多数编辑器中，当你按下 tab 键时，你就是缩进了一层。通过缩进条件执行语句，你使其在视觉上脱出来。这样你就能一眼看出\
  \ `if` 语句执行程序的哪个部分。这是编写 `if` 语句的标准方法。\n\n#### 注意事项\n\n1.  不要在 `if(testcondition)`\
  \ 部分之后放置分号，因为如果没有条件部分，`if` 语句就是不完整的。但如果你在这里放置一个分号，编译器将假设你已经终止了语句。不会显示错误，但编译器会假定你在那里放置了一个空语句（null\
  \ statement）。还要注意，空语句（什么都不执行的空语句）将成为条件执行语句。你原本打算条件执行的语句将与 `if` 语句断开，并将始终执行。例如：\n\
  \n```c\nint u=5, v=10;\nif ( u>v);\n    System.out.println(\"u is greater than\"\
  );\n```\n\n\n\n\n\n```c\n#include<stdio.h>\nvoid main( )\n{\n   int numb;\n   printf(\"\
  \\n Enter your number: \");\n   scanf(“%d”, &numb);\n   if (numb >= 0)\n      printf(\"\
  \\n It is a positive number.\");\n}\n```\n\n输出（运行后）：\n\nEnter your number: 80\n\n\
  It is a positive number.\n\n#### 示例 2：编写一个 C 程序来检查给定的年份是否为闰年。\n\n闰年能被 4 整除但不能被 100\
  \ 整除的年份（除非它也能被 400 整除）。\n\n#### 解决方案 2：\n\n```c\n/* leap year program */\n#include<stdio.h>\n\
  void main( )\n{\n   int y;\n   printf(\"\\n Enter the year in four digits: \");\n\
  \   scanf(“%d”, &y);\n   if (( y % 4 ==0 && y%100 != 0) || (y %400==0 ))\n     \
  \ printf(\"\\n\\t It is a leap year\");\n   else\n      printf(\"\\n\\t It is not\
  \ a leap year\");\n}\n```\n\n输出（运行后）：\n\nEnter the year in four digits: 2000\n\n\
  2000 is a leap year\n\n### 2.10 SWITCH 和 BREAK\n\nC 提供了一种极其实用的 `switch-case` 结构，便于在多个备选项之间进行选择。在\
  \ `switch` 语句控制的代码块中，程序员可以放置 `case` 语句和（可选的）`default` 语句。例如：\n\n```c\n switch (x)\
  \ {\n    case 0 : str = “none”; break;\n    case 1 :\n      str = “single” ; break;\n\
  \    case 2 :\n      str = “pair” ;\n      break;\n    default : str = “many” ;\n\
  \ }\n```\n\n每个 `case` 关键字后面都跟着一个整数常量，紧接着是一个冒号。请注意，属于每个 `case` 的代码块可以紧跟在冒号后面（在同一行），也可以另起一行。如果\
  \ `x` 的值不是 `case` 语句中提供的任何值之一，将执行 `default` 语句的代码。同样需要注意的是，如果没有 `default` 语句且没有精确匹配，执行将在\
  \ `switch` 代码块之后继续进行。\n\n在上面的程序示例中，使用了 `break` 语句来终止每个 `case` 的代码，并导致执行在 `switch`\
  \ 代码块之后继续。请理解，如果没有出现 `break`，执行将“贯穿”并执行后续 `case` 中的代码。例如：\n\n```c\n switch(x) {\n\
  \   case 0 : printf(“A, “);\n   case 1: printf(“B, “); break;\n   default: printf(“C”);\n\
  \ }\n```\n\n在这里，`x` 的值为 `0` 将导致输出“A, B,”。\n\n同样需要理解的是，我们在处理 `switch` 结构时发生的大多数错误似乎与忘记考虑“贯穿”有关。因此，每当我们使用\
  \ `switch` 语句编写程序时，都必须始终仔细检查 `break` 语句。与每个 `case` 关联的代码块可以简单用一个语句，也可以是数百行代码。此外，此代码块可以包含另一个\
  \ `switch` 语句。但为了具有更好的可读性，我们应该将任何复杂代码转换为单独的方法，并在 `case` 语句中简单调用该方法。\n\n关于 `switch`\
  \ 语句可以得出以下几点：\n\n1. `switch` 语句中的表达式必须求值为 32 位或更小的整数类型：`byte`、`char`、`short` 或 `int`。编译器会检查整数类型的合法范围是否涵盖了\
  \ `switch` 代码块中 `case` 语句使用的所有常量。\n2. 如果 `switch` 语句中整数类型的合法范围不匹配，编译器将抛出错误。\n3.\
  \ `case` 语句必须是 32 位或更小的整数类型常量。\n4. `case` 语句不能使用 `float` 常量、变量或字符串。\n5. 在 `switch`\
  \ 语句中的 `case` 标签必须是整数常量。\n6. 如果在 `switch` 语句中使用 `byte` 变量，则检查其是否在合法范围内。\n7. 与 `case`\
  \ 关联的代码块可以是一个简单的单个语句，也可以是数百行代码。\n8. `case` 语句可以包含另一个 `switch` 语句。\n9. `switch` 语句中的\
  \ `case` 标签可以按任意顺序排列。\n10. `switch` 语句中的 `case` 标签必须是唯一的。\n11. `switch` 语句中的 `case`\
  \ 标签可以是 `enum`。\n12. 表达式首先被求值，然后与 `case` 标签进行匹配。如果没有与任何 `case` 标签匹配，则执行 `default`（如果存在存在）。\n\
  13. `case` 语句可以是 `if-else`。\n\n#### Switch 与 If-Else（比较）\n\n`if-else` 语句可以处理范围，例如：\n\
  \n```c\n if(marks > 80 && marks <=100)\n   //statements\n else if(marks > 70 &&\
  \ marks <=90)\n   //statements\n```\n\n但遗憾的是，`switch` 无法处理这些范围。每个 switch 标签必须是单个值，且该值必须是整数或字符。对于范围或浮点数，你必须使用\
  \ `if-else`。另一方面，如果 case 标签是整数常量或字符常量，`switch` 语句更高效、更易于编写且更易理解。\n\n我们现在可以使用 `switch`\
  \ 语句编写一些程序了。\n\n#### 示例 1：编写一个 C 程序来检查从键盘读取的元音是否为元音。仅使用 `switch` 语句。现在用混合整数和字符常量重写此程序。该程序可以编译吗？\n\
  \n#### 解决方案 1：我们编写两个独立的程序——一个在 case 中使用整数常量，另一个使用整数和字符常量。\n\n//仅使用字符常量的 switch 元音程序（case\
  \ 中）\n\n```c\n#include<stdio.h>\nvoid main( )\n{\n   char ch;\n   printf(\"\\n Enter\
  \ any vowel:\");\n    scanf(“%c”, ch);\n    switch (ch)\n     {\n      case ‘a’:\n\
  \             printf(“You entered a.\");\n             break;\n      case ‘e’:\n\
  \             printf(“You entered e.\");\n             break;\n      case ‘i’:\n\
  \             printf(“You entered i.\");\n             break;\n      case ‘o’:\n\
  \             printf(“You entered o.\");\n             break;\n      case ‘u’:\n\
  \             printf(“You entered u.\");\n             break;\n      default:\n\
  \          printf(“You have not entered any vowel.”);\n    }\n}\n```\n\n输出（运行后）：\n\
  \nEnter any vowel: i\n\nYou entered i.\n\nEnter any vowel: u\n\nYou entered u.\n\
  \nEnter any vowel: r\n\nYou have not entered any vowel.\n\n//使用字符常量和整数常量的 switch\
  \ 元音程序（case 中），两者。\n\n\n\n\n\n```c\n#include<stdio.h>\nvoid main( )\n{\n  char ch;\n\
  \  printf(\"\\n Enter any vowel:\");\n  scanf(\"%c\", &ch);\n  switch (ch)\n  {\n\
  \    case ‘a’:\n      printf(\"You entered a.\");\n      break;\n    case ‘101’:\n\
  \      printf(\"You entered e.\");\n      break;\n    case ‘i’:\n      printf(\"\
  You entered i.\");\n      break;\n    case ‘111’:\n      printf(\"You entered o.\"\
  );\n      break;\n    case ‘u’:\n      printf(\"You entered u.\");\n      break;\n\
  \    default:\n      printf(\"You have not entered any vowel.\");\n  }\n}\n```\n\
  \n#### 输出（运行后）：\n\n输入任意元音: i\n\nYou entered i.\n\n输入任意元音: u\n\nYou entered u.\n\n\
  输入任意元音: r\n\nYou have not entered any vowel.\n\n因此，两种情况下输出是相同的。`switch` 语句允许为多个分支标签执行一组语句。我们已经看到，每当\
  \ `switch` 语句找到匹配项时，除非遇到 `break` 语句，否则它会执行 `switch` 之后的所有行。还要注意，如果不使用 `default`\
  \ 分支且 `switch` 语句没有找到匹配项，则 `switch` 语句内部将不执行任何操作，控制将转移到控制结构之后的下一个语句（如果有）。\n\n###\
  \ goto 语句\n\n`goto` 语句是一种无条件控制语句。它可以直接将“程序控制”跳转到你指定的任何地方。通常我们不建议使用 `goto` 语句，因为它是一种无结构化的编程方式。它会让程序变得不可读、不可靠且难以调试。\n\
  \n例如，\n\n```c\nstart: if (number < 0) {\n  i++;\n  goto start;\n}\n```\n\n在这里我们看到，如果\
  \ `number < 0`，则执行 `i++`，然后在标签 `'start'` 处进行无条件跳转。标签以分号结尾，之后放置了相应的语句。\n\n通常建议尽可能使用其他的控制结构和循环语句。\n\
  \n### 2.11 循环的概念——WHILE 循环、DO-WHILE 循环、FOR 循环、嵌套循环、BREAK 语句、CONTINUE 语句\n\n循环是程序中重复执行的部分。循环是一种导致语句或一组语句重复执行的控制结构。C\
  \ 语言有三种循环结构：\n\n(a) `while` 循环\n\n(b) `do-while` 循环\n\n(c) `for` 循环\n\n现在让我们逐一讨论这些。\n\
  \n#### while 循环\n\n`while` 循环结构用于在满足给定条件时重复执行单个语句或一组语句。它由一个用于模拟判断的布尔表达式 (`boolExpr`)\
  \ 和一个或多个语句 (`Stmt`) 组成。首先求值 `boolExpr`。如果它返回真（true），则执行 `while` 循环中的 `Stmt`。当 `boolExpr`\
  \ 返回假（false）值时，循环终止。`boolExpr` 是一个产生布尔字面量的表达式。`while` 循环的语法如下，随后是其工作原理（见图 2.2）。\n\
  \n#### 语法\n\n```c\nwhile (boolExpr)\n{\n  Stmt;\n}\n```\n\n#### while 循环的工作原理\n\n\
  ![](img/00036.jpeg)\n\n图 2.2：while 循环的语法与工作原理\n\n解释：语法中显示的第一行被称为循环头。当 `boolExpr`\
  \ 返回真值时，执行 `Stmt` 部分。当它返回假值时，循环终止。如果 `boolExpr` 第一次产生就产生了假值，则可以在不执行循环内语句的情况下退出 `while`\
  \ 循环。因此，`while` 循环执行的最小次数为零。请理解，由于条件在进入循环体之前进行测试，因此也被称为预测试循环或顶端测试循环。还要理解，当 `boolExpr`\
  \ 总是返回真值时，循环将变成无限循环。例如，\n\n```c\nwhile (true) {\n  Stmt;\n}\n```\n\n这是一个无限循环。在这里，使用布尔字面量\
  \ `true` 代替 `boolExpr`。它也可以写成如下形式以形成无限循环：\n\n```c\nwhile (! false) {\n  Stmt;\n\
  }\n```\n\n因此，如果一个循环没有停止的方法，它被称为无限循环。无限循环会一直重复，直到程序被中断。例如，\n\n```c\nint numb = 1;\n\
  while (numb <= 5)\n{\n  printf(\"Hello\");\n}\n```\n\n这是一个无限循环，因为它没有包含改变 `numb`\
  \ 变量值的语句。每当测试布尔表达式时，`numb` 都包含值 1。\n\n现在，假设程序员错误地在 `while` 循环末尾放了一个分号，如下：\n\n`while(numb\
  \ <= 5);`\n\n请注意，第一行末尾的分号被认为为空语句，它将 `while` 语句与随后的代码块隔离开来。这个 `while` 循环将永远执行该空语句，而它什么都不做。\n\
  \n现在，假设你忘记在 `while` 头部之后加上大括号，如下所示：\n\n```c\nint numb = 1;\nwhile(numb <= 5)\n \
  \ printf(\"Hello\");\n  numb++;\n```\n\n在这里，`numb++` 语句不在循环体内。由于缺少大括号，`while` 语句只执行随后的语句。这个循环将无限执行，因为它没有改变\
  \ `numb` 值的语句。必须遵循的规则可以是：\n\n规则 1：如果表达式为真，则执行循环块。\n\n规则 2：如果表达式为假，则循环停止。循环在头部处没有分号。\n\
  \n#### while 循环的应用\n\n1. `while` 循环可以用于创建直到输入接受的数据为止重复的输入例程。\n2. 此循环用于输入验证。我们将输入验证定义为对给程序的数据进行检查以确保有效。\n\
  3. 在循环开始之前进行的读取操作被称为引导读取（priming read）。\n\n在进一步讨论之前，让我们解决一些例子。\n\n#### Q1 给出输入验证的通用逻辑。\n\
  \n[提示：输入验证使用以下步骤：\n1. 读取第一个值。\n2. 检查该值有效还是无效。\n3. 如果无效，则显示错误消息并读取另一个值。\n4. 否则继续执行程序的其余部分]\n\
  \n#### Q2 给出以下代码段的输出：\n\n```c\nint i = 40;\nwhile (i >=0) {\n  if (i%2 ==0)\n  \
  \  printf(\"d\", i);\n  i++;\n}\n```\n\n[提示：它打印 40。尝试将 `i++` 改为 `i--` 并查看你的结果]。\n\
  \n#### Q3 编写一个 C 程序反转数字。\n\n[提示：\n\n```c\n void main( ) {\n  int n;\n  printf(\"\
  输入一个数字:\");\n  scanf(\"%d\", &n);\n  printf(\"反转后的数字是:\");\n  while (k !=0) {\n\
  \    /*通过重复取模和除法提取单个数字*/\n    int m = n % 10;\n    k=n/10;\n    n=k;\n    printf(\"\
  %d\", m); //打印数字\n  }\n }\n```\n\n#### Q4 通过不同的方法编写一个 C 程序寻找两个正数的 GCD（最大公约数）。\n\n\
  方法 1：\n\n两个正数的 GCD 定义为这两个整数的最大公共公约数。例如，24 和 36 的 GCD 为：\n\n24 的因数有 1, 2, 3, 4, 6,\
  \ 8, 12, 24\n\n\n\n\n\n36 的因数有 1, 2, 3, 4, 6, 9, 12, 18, 36。\n\n因此，最大公约数是 12。所以\
  \ 24 和 36 的 `GCD` 是 12。\n\n#### 方法 2：\n\n你可以使用下面的欧几里得算法来寻找两个数的 `GCD`：\n\n```\nwhile\
  \ m is greater than zero\ndo\n  if n is greater than m, swap m and n.\n  subtract\
  \ n from m.\nend\nfinal n is the `GCD`.\n```\n\n#### 方法 3：\n\n可以遵循另一种算法：\n\n1. 读取两个数字\
  \ `a`, `b`。\n2. 当 `a` 不等于 0 时，重复执行第 5 步。\n3. 设置 `gcd = a`\n4. `a = b % a`\n5. `b\
