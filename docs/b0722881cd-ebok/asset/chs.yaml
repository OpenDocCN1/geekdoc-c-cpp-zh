  \ 博士\n\n# 第 1 章\n\n## C 概述\n\n### 1.0 引言\n\n`C` 编程语言由 Dennis Ritchie 于 20 世纪 70\
  \ 年代初在 AT&T 贝尔实验室开发。不久，贝尔实验室开发了一种名为 `UNIX` 的新操作系统。Unix 操作系统（OS）约 90% 的代码完全是用 `C`\
  \ 编写的。随着 `C` 变得流行，越来越多的供应商加入竞争并开发了自身的编译器。这是必要的，因为直到 20 世纪 70 年代后期，只有贝尔实验室拥有 `C`\
  \ 编译器。\n\n20 世纪 80 年代初，意识到标准化 `C` 语言后，处理此类事务的美国标准协会（`ANSI`）开始了这项工作。1990 年，第一个官方\
  \ `ANSI` `C` 标准定义被发布。不久 `C` 变得无处不在，因此需要进一步的标准化。国际标准组织（`ISO`）采纳了名为 `ISO/IEC 9899:1990`\
  \ 的标准。1990 年之后，`C` 语言发生了许多额外变化。1993 年，成立了一个 `ANSI C` 委员会（称为 `X3J11`）来标准化 `C`。最新的标准于\
  \ 1999 年被采用，被称为 `ANSI C99` 或 `ISO/IEC 9899:1999`。从那时起，`ANSI C` 已经在各种计算机上实现，包括 IBM\
  \ 兼容个人电脑（PC）、大型机、小型机和工作站。\n\n`C` 是一种高级语言，但它仍然允许程序员以更低得的级别处理硬件。请注意，尽管 `C` 是一种通用编程语言，但它的设计目标考虑了系统编程应用。因此，它提供了大量的力和灵活性。\n\
  \n本章讨论了与 `C` 相关的一些基础术语，并解释了 `C` 语言编写的程序的编译过程。\n\n### 1.1 算法和伪代码的概念\n\n如果未加载软件，计算机就是是一堆死硬件。它可以是应用软件、系统软件、嵌入软件或其他类型的软件。计算机系统的基本操作构成了计算机的指令集。现在，为了使用计算机解决问题，你必须用特定计算机的指令来表达问题的解决方案。因此，我们将计算机程序定义为解决特定问题所需的指令集合。用于解决问题的方法或途径被称为\
  \ `算法`。例如，如果你想找到一个数的阶乘，那么解决该问题的语句集就成了一个程序。你首先用 `算法` 表达问题的解决方案，然后开发一个实现该算法的程序。程序可以用你选择任何编程语言编写，例如\
  \ `C/C++`、`JAVA2`、`Visual Basic 9` 等。\n\n`算法` 是一种解决问题的正式逐步步进方法。让我们现在来看算法的一些特征：\n\
  \n1. 算法由一组有序的指令组成。\n2. 算法的每一步都应该是无歧义的——即它不应该有多种含义。\n3. 它应该有有限的步骤。\n4. 它在这些有限的步骤之后应该结束/停止。\n\
  5. 它应该有一些输入，并可能或不产生任何输出。\n\n算法应该是简洁紧凑的，以便验证其正确性。验证涉及使用一组高质量测试用例观察算法的性能。\n\n例如，我们可能想写一个算法，从一组\
  \ `n` 个正数中找到最大值。我们假设数字存储在数组 `X` 中。\n\n从数组 `X` 中寻找最大值的算法\n\n输入：具有 `n` 个元素的数组 `X`。\n\
  \n输出：从数组 `X` 中找到最大的元素 `MAX`。\n\n步骤 1：设置 `MAX=0` /* `MAX` 的初始值 */\n步骤 2：`for j=1\
  \ to n` 执行\n步骤 3：`if(X[j] > MAX)` 则 `MAX = X[j]`\n结束循环\n步骤 4：停止\n\n作为一种解决问题的工具，程序员通常会在类英语描述的问题定义和\
  \ `C` 代码之间引入至少一个中间步骤。这个中间步骤被称为 `伪代码`（pseudo=假）。`伪代码` 是用类英语步骤列表对问题进行的重述。\n\n```\n\
