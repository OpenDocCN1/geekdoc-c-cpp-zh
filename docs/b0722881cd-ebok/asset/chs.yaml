  \ 2 字节。\n\n# 示例 12：联合体（unions）主要适用于哪种应用？\n\n**答案 12**: 联合体基本上用于防止计算机将其内存拆分成许多大小不一的块，这种现象被称为内存碎片。联合体数据类型通过为某些数据创建标准大小来防止碎片化。\n\
