  \ is 03/24/2016\n\n程序中进行的日期初始化如图 4.1 所示。\n\n![](img/00001.jpeg)\n\n图 4.1：给结构体变量赋值\n\
  \n在涉及表达式求值时，结构体成员遵循与 C 中普通变量相同的规则。因此，一个整数结构体成员除以另一个整数将作为整数除法执行。\n\n让我们再次考虑 `Emp`\
  \ 结构体（之前定义过的）：\n\n```c\nstruct Emp\n{\n  char fname[40], lname[40];\n  int age;\n\
  \  float basic_salary;\n  char address[80];\n};\n```\n\n在这里，`fname` 留 own 40 字节，`lname`\
  \ 40 字节，`age` 2 字节，`basic_salary` 4 字节，字符数组 80 字节。因此，结构体的大小由其各个元素/数据项的大小之和决定。\n\n\
  还需要注意的是，如果在定义结构体时已经声明了特定结构体类型的结构体变量，则可以省略结构体名称。例如：\n\n```c\nstruct\n{\n  char fname[40];\n\
  \  int age;\n  float bas_salary;\n} emp;\n```\n\n但这里的问题是，在这样的声明中，你无法随后声明另一个类型与 `emp`\
  \ 相同的变量。\n\n所以我们通过以下方式访问这些成员：\n\n`emp.fname;`\n\n`emp.age;`\n\n`emp.bas_salary;`\n\
  \n一旦我们知道了这一点，就可以如下所示初始化这些成员变量的值：\n\n`strcpy(emp.fname, “DR. RAJIV”)`\n\n`strcpy(emp.lname,\
  \ “CHOPRA”)`\n\n`emp.age = 41;`\n\n`emp.salary = 82000.00;`\n\n`strcpy(emp.address,\
  \ “GTB NAGAR”)`\n\n在进一步讨论结构体之前，让我们现在写一些程序。\n\n### 示例 1：编写一个简单的程序，从键盘读取员工姓名、年龄和工资并显示这些信息。\n\
  \n#### 方案 1：以下是程序：\n\n```c\n#include<stdio.h>\nmain( )\n{\n  struct Employee\n \
  \ {\n    char name[20];\n    int age;\n    float salary;\n  };\n  struct Employee\
  \ emp1, emp2;\n  printf(“\\n Enter name, age and salary of the 1st employee:”);\n\
  \  scanf(“%s %d %f”, &emp1.name, &emp1.age, &emp1.salary);\n  printf(“\\n Enter\
  \ name, age and salary of the 2nd employee:”);\n  scanf(“%s %d %f”, &emp2.name,\
  \ &emp2.age, &emp2.salary);\n  printf(“\\n First Employee details…”);\n  printf(“\\\
  n Name: %s”, emp1.name);\n  printf(“\\n Age: %d”, emp1.age);\n  printf(“\\n Salary:\
  \ %f”, emp1.salary);\n  printf(“\\n Second Employee details…”);\n  printf(“\\n Name:\
  \ %s”, emp2.name);\n  printf(“\\n Age: %d”, emp2.age);\n  printf(“\\n Salary: %f”,\
  \ emp2.salary);\n}\n```\n\n输出（运行后）：\n\nEnter name, age and salary of the 1st employee:\
  \ Dr. Rajiv 40 82000.00\n\nEnter name, age and salary of the 2nd employee: Mr. Sushant\
  \ 30 50000.00\n\nFirst Employee details …\n\nName: Dr. Rajiv\n\nAge: 40\n\nSalary:\
  \ 82000.00\n\nSecond Employee details …\n\nName: Mr. Sushant\n\nAge: 30\n\nSalary:\
  \ 50000.00\n\n### 结构体的初始化\n\n就像你初始化 ints、floats、chars 和数组一样，你也可以初始化结构体变量。\n\n例如，在之前的结构体\
  \ `Emp` 中：\n\n```c\nstruct Emp\n{\n  char fname[40], lname[40];\n  int age;\n  float\
  \ salary;\n  char address[30], dept[30];\n};\n```\n\n那么，该结构体的变量——例如 `emp1`——可以在其声明时如下初始化：\n\
  \n`struct Emp emp1 = {“Rajiv”, Chopra”, 40, 82000.00, “GTB Nagar”, “Computer Science”};`\n\
  \n或者你也可以写成：\n\n```c\nstruct Emp\n{\n  char fname[40], lname[40];\n  int age;\n \
  \ float salary;\n  char address[30], dept[30];\n} emp1 = {“Rajiv”, Chopra”, 40,\
  \ 82000.00, “GTB Nagar”, “Computer Science”};\n```\n\n在这里，`emp1.fname = “Rajiv”`，`emp1.lname\
  \ = “Chopra”`，`emp1.age = 40`，`emp1.salary = 82000.00`，`emp1.address = “GTB Nagar”`，`emp1.dept\
  \ = “Computer Science”`。由于我们可以将基本类型赋值给另一种类型，同样我们可以将一个结构体变量赋值给相同类型的另一个变量。\n\n例如：\n\
  \n```c\nstruct Emp\n{\n  char fname[40], lname[40];\n  int age;\n  float salary;\n\
  \  char address[30], dept[30];\n};\nstruct Emp emp1 = {“Rajiv”, Chopra”, 40, 82000.00,\
  \ “GTB Nagar”, “Computer Science”};\nstruct Emp emp2;\nemp2 = emp1; /* valid */\n\
  ```\n\n现在 `emp2` 将与 `emp1` 相同的数据。但请注意以下初始化是无效的：\n\n```c\nstruct Emp\n{\n  char fname[40]\
  \ = “Rajiv”; /* invalid */\n  int lname[40] = “Chopra”; /* invalid */\n  int age\
  \ = 40; /* invalid */\n};\n```\n\n这意味着不能在结构体内部初始化单个成员。如果你这样做，将会得到编译错误。\n\n### 结构体数组\n\
  \n当我们想要存储大量的相似记录——例如 100 个员工时，结构体数组的定义如下：\n\n```c\nstruct Emp\n{\n  char fname[40],\
  \ lname[40];\n  int age;\n  float salary;\n  char address[30], dept[30];\n};\nstruct\
  \ Emp emp1[100]; /* 结构体数组 */\n```\n\n这意味着 `emp1` 是一个拥有 100 个 `Employee` 类型元素的数组。在此之后，C\
  \ 编译器为 100 个结构体留出了空间；结构体数组的规则与 ints、floats 或 chars 数组相同。\n\n![](img/00011.jpeg)\n\
  \n图 4.2：存储的结构体\n\n请注意，这里通过索引选择 `struct` 员工。例如，`emp1[0]` 是结构体数组 `emp1` 中的第一个元素。数组\
  \ `emp1` 的每个元素都是 `Emp` 类型的结构体。此外注意，为了访问第 1 个员工的 `fname`，我们使用表达式：`emp1[0].fname`。\n\
  \n因此，第 1 个员工记录为：\n\n`emp1[0].fname;`\n\n`emp1[0].lname;`\n\n`emp1[0].age;`\n\n`emp1[0].salary;`\n\
  \n`emp1[0].address;`\n\n`emp1[0].dept;`\n\n同样，第 2 个员工记录为：\n\n`emp1[1].fname;`\n\n\
  `emp1[1].lname;`\n\n`emp1[1].age;`\n\n`emp1[1].salary;`\n\n`emp1[1].address;`\n\n\
  `emp1[1].dept;`\n\n而第 100 个员工记录为：\n\n`emp1[99].fname;`\n\n`emp1[99].lname;`\n\n\
  `emp1[99].age;`\n\n`emp1[99].salary;`\n\n`emp1[99].address;`\n\n`emp1[99].dept;`\n\
  \n显示这种结构体的另一种方法：\n\n```c\nstruct Emp\n{\n  char fname[40], lname[40];\n  int age;\n\
  \  float salary;\n  char address[30], dept[30];\n};\nstruct Emp emp1[100]; /* 结构体数组\
  \ */\n```\n\n![](img/00007.jpeg)\n\n因此，第 1 个员工记录为：\n\n`emp1[0].fname;`\n\n`emp1[0].lname;`\n\
  \n`emp1[0].age;`\n\n`emp1[0].salary;`\n\n`emp1[0].address;`\n\n`emp1[0].dept;`\n\
  \n对于 100 个员工的记录，`emp1[1]` ... 直到 `emp1[99]` 都遵循相同的步骤。\n\n### 如何初始化结构体数组\n\n我们可以像初始化单个结构体一样来初始化结构体数组。\n\
  \n例如：\n\n```c\nstruct Emp\n{\n  char name[30];\n  int age;\n  float salary;\n};\n\
  struct Emp emp1[5] = {\n  {“Rajiv”, 41, 83000.00},\n  {“Ajay”, 31, 73000.00},\n\
  \  {“Sushant”, 32, 17000.00},\n  {“Yash”, 29, 33000.00},\n  {“Ankur”, 38, 55000.00}\n\
  };\n```\n\n此声明创建了一个包含 5 个 `Employee` 结构体的数组。第一组值赋值给 `emp1[0]`，第二组赋值给 `emp1[1]`，以此此类推。初始值用逗号分隔并包含在大括号内。结束的大括号后面跟着分号。\n\
  \n我们现在处于编写程序的位置了。\n\n/* 显示结构体数组的概念 */\n\n\n\n\n\n```c\n #include<stdio.h>\nvoid\
  \ main( )\n {\n   struct Employee\n     {\n       char name[20];\n       int age;\n\
  \       float salary;\n     };\n     struct Employee emp[5];\n     int i;\n\n  \
  \    float x, *y = &x, x= *y; /* why? */\n      printf(“n\\t Enter your 5 employees\
  \ name, age and salary:    \\n\\n’);\n      for(i=0; i<5; i++)\n         scanf(“%s\
  \ %d %f”, emp[i].name, &emp[i].age, &emp[i].salary);\n      printf(“\\n You have\
  \ entered these records\\n”);\n      for(i=0; i<5; i++)\n      printf(“\\n %s\\\
  t\\t: %d\\t\\t: %f”, emp[i].name, emp[i].age,     emp[i].salary);\n   }\n```\n\n\
  OUTPUT (after running):\n\nEnter your 5 employees name, age and salary:\n\nRajiv\
  \ 40 82000.00\n\nAjay 30 67000.00\n\nAmit 30 70000.00\n\nMayur 20 67000.00\n\nAdi\
  \ 30 50000.00\n\nYou have entered these records\n\nRajiv: 40: 82000.00\n\nAjay:\
  \ 30: 67000.00\n\nAmit: 30: 70000.00\n\nMayur: 20: 67000.00\n\nAdi: 30: 50000.00\n\
  \n注意程序中的下述语句：\n\n`float x, *y = &x, x= *y;`\n\n如果该语句不存在，你将得到一个错误消息：\n\n`scanf: floating\
  \ point formats not linked.`\n\n程序异常终止。\n\n解释：此错误是由于浮点数模拟器（floating point emulator）导致的。浮点模拟器用于在运行时库函数（如\
  \ `scanf( ` 和 `atof()`）中处理浮点数。在某些情况下，例如结构体数组，`float` 是结构体的成员，且对 `float` 的引用较为模糊；这就是为什么编译器没有检测到需要模拟器的原因。为了克服这一局限性，会对\
  \ `float` 的地址进行引用。当编译器遇到 `float` 的地址时，它会自动设置一个标志，让链接器链接浮点模拟器。这就是为什么这些语句会强制将浮点模拟器链接到程序中。因此，为了防止此此错误，请在程序的开头包含该语句。\n\
  \n# 嵌套结构体\n\n可以将一个结构体嵌套在另一个结构体内部。这样的结构被称为嵌套结构体。\n\n例如，\n\n```c\nstruct date\n{\n\
  \      int day;\n      int month;\n      int year;\n};\n\nstruct Emp\n{\n      char\
  \ fname[40], lname[40];\n      int age;\n      float salary;\n      struct date\
  \ dob;\n      struct date dobj;\n      char address[30], dept[30];\n};\n```\n\n\
  注意下一个示例所示嵌套结构体中的限制：\n\n```c\nstruct Emp\n{\n      char name[40];\n      int age;\n\
  \      float salary;\n      struct Emp e; /* 是非法的 */\n};\n```\n\n因此，结构体的成员也可以是另一个结构体。也就是说，你可以说结构体的各个成员也可以是其他结构体。成员本身也是结构体的结构被称为嵌套结构体或层次结构体。\n\
  \n例如，假设我们想在一个名为 `Employee` 的结构体内部嵌套一个名为 `address` 的结构体；声明这种嵌套结构体有两种方法：\n\n### I.\
  \ 第一种方法：\n\n```c\nstruct date\n{\n      int day;\n      int month;\n      int year;\n\
  };\n\nstruct Emp\n{\n      char fname[40], lname[40];\n      int age;\n      float\
  \ salary;\n      struct date dob;\n      struct date dobj;\n      char address[30],\
  \ dept[30];\n};\n```\n\n使用这种表示法时，请记住嵌入的结构体类型（`date`）应该在包含它的结构中使用之前声明；否则编译器将无法识别它。\n\
  \n### II. 第二种方法：\n\n```c\nstruct Emp\n{\n      char fname[30], lname[30];\n    \
  \  int age;\n      float salary;\n      struct date\n      {\n            int day;\n\
  \            int month;\n            int year;\n      } dob, doj;\n      char address[30],\
  \ dept[30];\n};\n```\n\n在这种方法中，你不能像普通结构体一样在其他地方直接使用结构 `date`。另一方面，如果你使用前者且 `address`\
  \ 结构在 `Emp` 结构外部声明，那么你可以在其他地方直接使用 `address` 结构。\n\n嵌套结构体也可以如下初始化：\n`struct Emp emp1\
  \ = {“Rajiv”, “Chopra”, 40, 82000.00, 24, 03, 2016, “Computer Science” };`\n\n现在让我们如何访问嵌套结构体的成员。在这个示例中，`date`\
  \ 结构被用于 `Emp` 结构。结构内部的特定成员可以通过重复应用点运算符 `.` 来访问。例如，在语句 `emp.dob.day = 5;` 中，我们将 `emp`\
  \ 结构中 `dob` 结构中的 `day` 变量设置为 5。同样，嵌套结构体的其他成员的访问方式如下：\n`emp.dob.month = 3;`\n`emp.dob.year\
  \ = 2016;`\n\n我们还可以如下方式显示嵌套结构体的成员：\n`printf(\"%d”, emp.dob.day);`\n`printf(\"%d”,\
  \ emp.dob.month);`\n`printf(\"%d”, emp.dob.year);`\n\n注意，这种嵌套深度可以达到任何层级。没有限制。还要注意结构体不能嵌套在自身内部。例如：\n\
  \n```c\nstruct Emp\n{\n      char name[40];\n      int age;\n      float salary;\n\
  \      struct Emp e; /* 是非法的 */\n};\n```\n\n但是可以拥有自身类型的结构指针作为其结构成员。例如：\n\n```c\n\
  struct Emp\n{\n      char name[40];\n      int age;\n      float salary;\n     \
  \ struct Emp*e; /* 是非法的 */\n};\n```\n\n这样的结构被称为自引用结构体。\n\n# 结构体与函数\n\n就像可以传递基本数据类型一样，也可以向函数传递结构体并从函数接收结构体。有两种技术：作为参数的结构体和返回的结构体。\n\
  \n## I. 结构体作为参数\n\nC 提供了将整个结构体传递给函数的手段。结构变量像基本数据类型一样被传递。例如：\n\n```c\n #include<stdio.h>\n\
  \  display(struct Employee);\n  struct Emp\n  {\n  char name[10];\n  int age;\n\
  \  float salary;\n  };\n  main( )\n  {\n     struct Employee emp = {“Rajiv”, 40,\
  \ 82000.00};\n     display(emp); /*传递整个结构到 display 函数 */\n  }\n display(struct Employee\
  \ e)\n {\n    printf(“n Employee Record:”);\n    printf(“n Name: %s”, e.name);\n\
  \    printf(“n Age: %d”, e.age);\n    printf(“n Salary: %f”, e.salary);\n }\n```\n\
  \nOUTPUT (after running):\n\nEmployee Record:\nName: Rajiv\nAge: 40\nSalary: 82000.00\n\
  \n解释：在这里 `struct Employee` 定义在 `main()` 外部，因为我们将结构变量 `emp` 传递给了函数 `display()`。如果你在\
  \ `main()` 内部声明 `struct Employee`，那么函数 `display()` 将不知道数据类型结构变量 `emp`。为了使其变为全局，必须在\
  \ `main()` 外部声明结构。正如你可以传递基本类型数组一样，你可以向函数传递结构数组。在这种情况下，你将使用与传递基本类型数组相同的表示法。请注意，当结构变量作为参数传递给函数时，它是像其他数据类型一样按值传递的。因此，如果你在调用函数中进行了更改，调用者处是不可见的。\n\
  \n## II. 从函数返回结构\n\n就像基本数据类型一样，你也可以使用 `return` 语句从函数返回结构。例如：\n\n```c\n #include<stdio.h>\n\
  struct Employee readRecord( );\ndisplay (struct Employee);\nstruct Employee\n {\n\
  \   char name[10];\n   int age;\n   float salary;\n };\nmain( )\n {\n   struct Employee\
  \ emp1, emp2;\n   emp1 = readRecord( );\n   emp2 = readRecord( );\n   printf(“\\\
  n Displaying first record…”);\n   display(emp1);\n   printf(“\\n\\n Displaying second\
  \ record..”);\n   display(emp2);\n   }\n   struct Employee readRecord( )\n   {\n\
  \     struct Employee e;\n     printf(“\\n Enter name, age and salary of an employee.\
  \ \\n”);\n     scanf(“%s %d %f”, e.name, &e.age, &e.salary);\n     return e; /*返回一个结构\
  \ */\n }\n```\n\nOUTPUT (after running):\n\nEnter name, age and salary of an employee.\n\
  \nRajiv 40 82000.00\n\nEnter name, age and salary of an employee.\n\nMayur 30 40000.00\n\
  \nDisplaying first record…\nName: Rajiv\nAge: 40\nSalary: 82000.00\n\nDisplaying\
  \ second record..\nName: Mayur\nAge: 30\nSalary: 40000.00\n\n\n\n\n姓名: Rajiv 年龄:\
  \ 40 工资: 80000.00\n\n显示第二条记录。\n\n姓名: Mayur 年龄: 30 工资: 40000.00\n\n# 结构体与数组\n\n也可以定义包含数组成员的结构。这种类型常见的应用之一是在结构体内部设置字符数组。\n\
  \n例如，假设我们要定义一个名为 `month` 的结构，其成员包含该月份的天数以及月份名称的 3 字符缩写。实现方式如下：\n\n```c\n struct\
  \ month\n {\n   int number_of_days;\n   char name[3];\n };\n```\n\n这创建了一个 `month`\
  \ 结构，它包含一个名为 `number_of_days` 的整数成员和一个名为 `name` 的字符成员。该成员名实际上是一个 3 个字符的数组。现在我们现在以普通方式定义一个类型为\
  \ `struct month` 的变量：\n\n```\nstruct month a_month;\n```\n\n我们可以通过以下语句序列为 `a_month`\
  \ 设置一月份的相应字段：\n\n```\na_month.number_of_days = 31;\na_month.name[0] = ‘J’;\na_month.name[1]\
  \ = ‘a’;\na_month.name[2] = ‘n’;\n```\n\n或者我们可以使用以下语句将该变量初始化为相同的值：\n\n```\nstatic\
  \ struct month a_month = {31, { ‘J’, ‘a’, ‘n’ } };\n```\n\n并在数组内部设置 12 个月的结构体来代表每年的每一个月：\n\
  \n```\nstruct month months[12];\n```\n\n现在让我们写一个程序来展示结构体和数组的概念：\n\n/* 在数组内设置初始值并它们的程序\
  \ */\n/* 它说明了结构体和数组的概念 */\n\n```c\n struct month\n {\n   int number_of_days;\n \
  \  char name[3];\n };\nmain( )\n {\n   int i;\n   static struct month months[12]\
  \ =\n     { { 31, {‘J’, ‘A’, ‘N’ } }, {28, {‘F’, ‘E’, ‘B’ } },\n     { { 31, {‘M’,\
  \ ‘A’, ‘R’ } }, {30, {‘A’, ‘P’, ‘R’ } },\n     { { 31, {‘M’, ‘A’, ‘Y’ } }, {30,\
  \ {‘J’, ‘U’, ‘N’ } },\n     { { 31, {‘J’, ‘U’, ‘L’ } }, {31, {‘A’, ‘U’, ‘G’ } },\n\
  \     { { 30, {‘S’, ‘E’, ‘P’ } }, {31, {‘O’, ‘C’, ‘T’ } },\n     { { 30, {‘N’, ‘O’,\
  \ ‘V’ } }, {31, {‘D’, ‘E’, ‘C’ } } };\n   printf(“Month  Number of Days\\n”);\n\
  \   printf(“--------  ---------------------\\n”);\n   for(i=0; i<12; ++i)\n    \
  \ printf(“ %c%c%c  %d\\n”,\n       months[i].name[0], months[i].name[1],\n     \
  \  months[i].name[2], months[i].number_of_days);\n }\n```\n\n输出（运行后）：\n\n| Month\
  \ | Number of Days |\n| --- | --- |\n| --------- | ---------------------- |\n| ---\
  \ | --- |\n| JAN | 31 |\n| FEB | 28 |\n| MAR | 31 |\n| APR | 30 |\n| MAY | 31 |\n\
  | JUN | 30 |\n| JUL | 31 |\n| AUG | 31 |\n| SEP | 30 |\n| OCT | 31 |\n| NOV | 30\
  \ |\n| DEC | 31 |\n\n下面的图显示了内存是如何存储的。\n\n![](img/00023.jpeg)\n\n从图中清楚可见，`months[0]`\
  \ 指 `months` 数组第一个位置包含的整个月份结构体。该表达式的类型为 `struct month`。因此，当将 `months[0]` 作为参数传递给函数时，函数内部对应的形式参数必须声明为\
  \ `struct month` 类型。然后表达式：\n\n`months[0].number_of_days`\n\n指向 `months[0]` 中包含的结构体的\
  \ `number_of_days` 成员。该表达式的类型是 `int`。表达式：\n\n`months[0].name`\n\n引用 `months[0]`\
  \ 结构体内部名为 `name` 的 3 字符数组。如果将此表达式作为参数传递给函数，那么对应的形式参数将声明为 `char` 类型的数组。\n\n最后，表达式\n\
  \n`months[0].name[0]`\n\n引用 `months[0]` 中包含的名称数组的第一个字符（字符 ‘J’）。\n\n## 4.1 结构体与联合体的对比\n\
  \n与结构体一样，联合体（unions）也是用户定义的数据类型。联合体是一种允许不同类型的变量共享内存中相同空间的数据类型。与每个成员都有自己内存空间的结构体不同，联合体允许其成员在内存中共享空间。\n\
  \n#### 语法\n\n```c\nunion unname\n{\n    datatype-1 ListOfVariables;\n    datatype-2\
  \ ListOfVariables;\n    …………\n    datatype-n ListOfVariables;\n};\n```\n\n在这里，`union`\
  \ 是关键字，`uname` 是联合体数据类型的名称。联合体变量像结构体变量一样被声明。当创建一个联合体变量时，C 编译器会自动分配足够的空间来存放联合体中最大的成员。由于联合体的所有成员共享相同空间，当任何一个成员发生变化时，其他成员也会随之改变。\n\
  \n\n\n\n\n`(*eptr).salary;`\n\n在这里必须使用括号，因为点运算符（`.`）的优先级高于解引用运算符（`*`）。如果你省略了括号，这些表达式将被解释为：\n\
  \n`*(eptr.name);`\n\n`*(eptr.age);`\n\n`*(eptr.salary);`\n\n由于 `eptr` 是一个结构体指针，C\
  \ 编译器肯定会标记出一个错误信息。\n\n在我们继续讨论之前，让我们写一个程序来展示结构体指针的使用，然后展示我们对结构体和枚举区别的理解。\n\n### 示例\
  \ 1：创建一个结构体 `Employee` 并存储其姓名、年龄和工资。读取并显示员工详细信息。\n\n#### 解决方案 1：程序如下：\n\n```c\n\
  \ #include<stdio.h>\nmain( )\n  {\n   struct Employee\n    {\n      char name[30];\n\
  \      int age;\n      float salary;\n    };\n   struct Employee emp1, emp2;  /*\
  \ 结构体变量 */\n   struct Employee *eptr1, *eptr2; /* 结构体指针 */\n   eptr1 = &emp1;\n\
  \   eptr2 = &emp2;\n/* 结构体变量使用点运算符 (.)。但结构体指针使用箭头运算符 */\n   printf(“n\\t 输入第一个员工的姓名、年龄和工资:\\\
  n”);\n   scanf(“%s %d %f”, emp1.name, &emp1.age, &emp1.salary);\n   printf(“n\\\
  t 输入第二个员工的姓名、年龄和工资:\\n”);\n   scanf(“%s %d %f”, eptr2->name, &eptr2->age, &eptr2->salary);\n\
  \   printf(“n 第一个员工:”);\n   printf(“n 姓名: %s”, eptr1->name);\n   printf(“n 年龄: %d”,\
  \ eptr1->age);\n   printf(“n 工资: %f”, eptr1->salary);\n   printf(“n 第二个员工:”);\n\
  \   printf(“n 姓名: %s”, emp2.name);\n   printf(“n 年龄: %d”, emp2.age);\n   printf(“n\
  \ 工资: %f”, emp2.salary);\n  }\n```\n\n**输出（运行后）：**\n\n输入第一个员工的姓名、年龄和工资：\nRajiv 40\
  \ 82000.00\n输入第二个员工的姓名、年龄和工资：\nAmit 30 55000.00\n第一个员工：\n姓名: Rajiv\n年龄: 40\n工资:\
  \ 82000.00\n第二个员工：\n姓名: Amit\n年龄: 30\n工资: 55000.00\n\n结构体也可以包含指针作为其成员变量。例如，\n\n\
  ```c\n     struct Emp\n {\n      char *name;\n      int age;\n      float salary;\n\
  \ };\n```\n\n在这里，结构体 `Emp` 关联了一个指针 `name`。现在结构体成员可以如下进行定义和使用：\n\n`struct Emp emp1\
  \ ={“Rajiv”, 40, 82000.00};`\n`struct Emp emp2;`\n`emp2.name = “Rajiv”;`\n`emp2.age\
  \ = 40;`\n`emp2.salary = 82000.00`\n\n### 示例 2：区分结构体和枚举。\n\n#### 解决方案 2：结构体是一种强大且灵活的方法，可以将多个不同的数据项组合在一个一个名称下。另一方面，可以在类型说明符中为有限的值集定义一个枚举数据类型。还要记住，C\
  \ 语言没有提供读取和显示枚举类型值的直接功能。它们只能作为整数值被读取或显示。\n\n我们现在可以写一些程序了。\n\n### 示例 1：编写一个 C 程序读取学生记录并找到其成绩百分比。它还应该根据下面给出的规则分配等级：\n\
