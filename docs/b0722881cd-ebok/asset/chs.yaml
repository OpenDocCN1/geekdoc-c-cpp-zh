  \ 示例 4：编写一个 C 程序来找到矩阵中的最大和最小元素。\n\n### 解决方案 4：程序如下：\n\n```c\n #include<stdio.h>\n\
  #include<conio.h>\nvoid main( )\n{\n   int a[10][10], r, c, i, j, big, small, locbi,\
