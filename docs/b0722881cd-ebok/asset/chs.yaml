  \   printf(\"\\nReading array elements:\");\n   for(i=0; i<row; i++)\n    {\n  \
  \    for(j=0; j<col; j++)\n         scanf(\"%d\", &a[i][j]);\n    }\n   printf(\"\
  \\nEchoing…..\");\n   for(i=0; i<row; i++)\n    {\n      for(j=0; j<col; j++)\n\
  \         printf(\"%d\", a[i][j]);\n    }\n   for(i=0; i<col; i++)\n    {\n    \
