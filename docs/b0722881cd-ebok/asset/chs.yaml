  \ `main`。在关键字 `main` 之前的 `int` 表示该 `main` 函数（在此处）将向操作系统返回一个整数值。关键字 `void` 表示 `main`\
  \ 函数没有参数（即参数列表为 `void`）。`main` 之后是两个大括号，表示 `main` 是一个函数。请注意，这里函数头后面没有标点符号。\n\n|\
