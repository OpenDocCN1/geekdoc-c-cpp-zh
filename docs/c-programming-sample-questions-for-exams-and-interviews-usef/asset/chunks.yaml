    main () x=40, y=20


    2.  Call by reference: (Passing address to a Function)


    ➢          In this technique the addresses of actual arguments in the calling
    function are copied into the formal arguments in the called function.➢          
    Any changes happen in formal arguments does effect on the actual arguments.➢          
    But if any changes will happen in the actual arguments, formal arguments automatically
    effected.Question: Write a C program to pass a parameter using call by reference.PROGRAM:/*
    write a program swaping of two numbers by using call by reference technique*/#include<stdio.h>#include<conio.h>void
    main(){int x,y;clrscr();printf("\n enter value of x,y:");scanf("%d%d",&x,&y);change(&x,&y);printf("\n
    in main() x=%d,y=%d",x,y);getch();}change(int *a,int *b){int *k;*k=*a;*a=*b;*b=*k;printf("\n
    in change() x=%d,y=%d",*a,*b);}OUTPUT:enter value of x,y:40 20in change() x=20,y=40in
    main() x=20,y=406.2 What are the Variable Storage Classes?Every variable in C
    programming has two properties: type and storage class. Type refers to the data
    type of a variable. And, storage class determines the scope, visibility and lifetime
    of a variable.There are 4 types of storage class:1.      automatic2.      external3.
         static4.      register


    1.  Local Variable or automatic variables:


    The variables declared inside the function are automatic or local variables.The
    local variables exist only inside the function in which it is declared. When the
    function exits, the local variables are destroyed.int main() {int n; // n is a
    local variable to main() function... .. ...}void func() {int n1; // n1 is local
    to func() function}In the above code, n1 is destroyed when func() exits. Likewise,
    n gets destroyed when main() exits.Question: Write a C program to implement local
    variable storage classes.PROGRAM:#include<stdio.h>#include<conio.h>void fun1(){int
    a=10;printf(“\na=%d”,a);}void fun2(){int a=20;printf(“\na=%d”,a);}void main(){clrscr();int
    a=30;fun1();fun2();printf(“\na=%d”,a);}OUTPUT:a=10a=20a=30


    2.  Global Variable or external variables:


    Variables that are declared outside of all functions are known as external or
    global variables. They are accessible from any function inside the program.Question:
    Write a C program to implement global variable storage classes.PROGRAM:#include
    <stdio.h>void display();int n = 5;  // global variableint main(){++n;     // variable
    n is not declared in the main() functiondisplay();return 0;}void display(){++n;     //
    variable n is not declared in the display() functio nprintf("n = %d", n);}OUTPUT:n=7❖
              Suppose, a global variable is declared in file1\. If you try to use
    that variable in a different file file2, the compiler will complain. To solve
    this problem, keyword extern is used in file2 to indicate that the external variable
    is declared in another file.


    3.  Static Variable


    A static variable is declared by using keyword static. For example;static int
    i;The value of a static variable persists until the end of the program.Question:
    Write a C program to implement static variable storage classes.PROGRAM://Static
    Variable#include <stdio.h>void display();int main(){    display();display();}void
    display(){static int c = 0;printf("%d\t  ",c);c += 5;}OUTPUT:0  5●         During
    the first function call, the value of c is equal to 0\. Then, it''s value is increased
    by 5.●         During the second function call, variable c is not initialized
    to 0 again. It''s because c is a static variable. So, 5 is displayed on the screen.


    4.  Register Variable


    ➢          The register keyword is used to declare register variables. Register
    variables were supposed to be faster than local variables.➢          However,
    modern compilers are very good at code optimization and there is a rare chance
    that using register variables will make your program faster.➢          Unless
    you are working on embedded systems where you know how to optimize code for the
    given application, there is no use of register variables.Question: Write a C program
    to implement register variable storage classes.PROGRAM:#include<stdio.h>int exp(int
    a, int b);int main(){int a=3, b=5, res;res=exp(a,b);printf(“\n %d to the power
    of %d=%d”,a,b,res);return 0;}int exp(int a, int b){register int res=1;int i;for(i=1;i<=b;i++)res=res*a;return
    res;}OUTPUT:3 to the power of 5=2436.3 What is Recursion?Definition:- “ The function
    which calls itself is called recursive function”.➢         Recursive functions
    are classified into two types:


    1.  Direct recursive (function calls directly)


    2.  In-direct recursive (function calls indirectly)


    ➢         The following are the conditions(criteria ) of recursive function:a)    
    Base criteria andb)     Recursive criteria.➢        The recursive function which
    satisfies the above two criteria is called well-defined recursive function.Rules
    for recursive function:-


    1.  Function should be called itself otherwise recursion does not takes place.


    2.  Only user-defined functions are involved in the recursion but not pre-defined.


    3.  To stop the recursion, the function should met the base criteria.


    4.  It needs the stack memory for implementing the recursion.


    Advantages of recursion:-In the recursive program, the solution to the base case
    is provided and the solution of the bigger problem is expressed in terms of smaller
    problems.i)                    It is very flexible in data structures like stacks,
    queues, linked lists and trees.ii)                 Using recursion, the length
    of the program is reduced.Disadvantages of recursion:-i)                    It
    requires extra storage space(memory).ii)                 Whenever there is no
    exit condition then program will be executed out of memory and takes into infinite
    calls.iii)               It takes more time and less speed for execution.The following
    are the applications(example problems ) of recursion:


    1.  Towers of Hanoi  and


    2.  Fibonacci sequence(Fibonacci series) .'
