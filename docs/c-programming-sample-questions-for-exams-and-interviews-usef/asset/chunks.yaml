  raw: "​ We use single dimensional arrays to implement search algorithms.Example: Linear\
    \ Search, Binary Search4\\. Arrays are used to implement Sorting Algorithms​ We\
    \ use single dimensional arrays to implement sorting algorithms.Example: Insertion\
    \ Sort, Bubble Sort, Selection Sort, Quick Sort, Merge Sort.5\\. Arrays are used\
    \ to implement Data structures​ We use single dimensional arrays to implement\
    \ data structures.Example: Stack Using Arrays, Queue Using Arrays6\\. Arrays are\
    \ also used to implement CPU Scheduling AlgorithmsFor the CPU scheduling the arrays\
    \ are used in OS (Operating System).5\\. What is a String?A c-string is a variable\
    \ length array of characters that is delimited by the null character.Storing strings:In\
    \ c, a string is stored in an array of characters. It is terminated by the null\
    \ character \\0H E L L O \\0Question: Why do we need a null character at the end\
    \ of a string?Answer:A string is not a data type but a data structure. This means\
    \ that its implementation is logical, not physical.Difference between the strings\
    \ and character arrays are shown below.H E L L O \\0​ H E L L OQuestion: What\
    \ is a String Literal?Answer:A string literal is a sequence of characters enclosed\
    \ in double quotes.Example:“Have a nice day” “Hello”“Hai”“Prasad”Strings:Strings\
    \ concepts :![](Image00027.jpg)Fig. 5.1: Types of StringFixed length strings :\
    \ When implementing a fixed length string format the first decision is the size\
    \ of the variable. If we make it too small, we can‟t store all the data. If we\
    \ make it too big, we waste memory.Example :\n\n1.  char str[15]=”Have a nice\
    \ day”;\n\n2.  char str[100]=”Hi”;\n\nVariable length strings : In variable length\
    \ strings the user can use the required memory only. So reduce the memory wastage\
    \ and data losses.Example : char str[]=”Good day”;1.    Length controlled strings\
    \ : Length controlled strings add a count that specifies the number of characters\
    \ in the string.2.     Delimited strings : Another techniques used to identify\
    \ the end of the string is the delimiter at the ends of delimited strings.Strings\
    \ and characters : Data can be stored in two ways.1.     Data as character literal.2.    \
    \ Data as string literal.Data stored as character literal, we can use single quote\
    \ marks.Example:‘a’  - Here a is a character.“a” - Here a is a string.‘ ‘ - It\
    \ is an empty character.“ “ -It is an empty string..5.1 How to Declare a String?String\
    \ declaration defines memory for a string when it is declared as an array in local\
    \ memory.Syntax : 1\\. char str[9];Syntax : 2\\. string pointer declaration.char\
    \ *pstr;Initializing strings :We can initialize a string the same way that we\
    \ initialize any storage structure by assigning a value to it when it is defined.Example:\n\
    \n1.  char str[9]=”good day”;\n\n2.  char name[9]=”Rashmi”\n\nString initialized\
    \ as a character pointer.char *pstr=”good day”;String initialized as an array\
    \ of characters.char str[9]={’g’,’o’,’o’,’d’,’  ‘,’d’,’a’,’y’};Strings are ended\
    \ with null character.5.2 What are String Input and Output functions?C provide\
    \ two basic ways to read and write strings. First, we can read and write strings\
    \ with the formatted input/output functions.They are,scanf/fscanf and printf/fprintfWe\
    \ can use a special set of strings only which are also functions. They are shown\
    \ below.\n\n1.  getstring → (gets/fgets)\n\n2.  putstring→ (puts/fputs)\n\nFormatted\
    \ string input :scanf(): scanf is the general input statement. It is used to read\
    \ character data or numeric data from the keyboard.Syntax :scanf(“Format specifier”,\
    \ variablename);Example:char str[9];scanf(“%s”,str);Formatted string output :printf():\
    \ printf is the general output statement. It is used to write character data or\
    \ numeric data on the output units.Syntax:printf(“Format specifier”,variablename);Example:char\
    \ str[9]=”Hello”;printf(“%s”, str);Question: Write a C program to print the entered\
    \ string.PROGRAM:#include<string.h>#include<conio.h>voidmain(){char str[9]; clrscr();printf(“Enter\
    \ your string:”); scanf(“%s”,str);printf(“Your string is %s”,str); getch();}OUTPUT:Enter\
    \ your string:RashmiYour string is RashmiString functions (input and output):String\
    \ input : gets()The function gets accepts the name of string as a parameter, and\
    \ fills the string with characters that are input from the keyboard, till a newline\
    \ character is encountered, at the end, the function gets appends a null terminator\
    \ as must be done for any string and returns. The new line character is not added\
    \ to the string.Syntax:gets(variable);String output : puts()This function is used\
    \ to print the string message on to the output screen and also display the stored\
    \ string in variable.Syntax:puts(“string message”);puts(variable);Question: Write\
    \ a C Program using gets() and puts().PROGRAM:#include<string.h>#include<conio.h>void\
    \ main(){char str[10];clrscr();puts(“Enter your name”);gets(str);puts(“Entered\
    \ name is “);puts(str);getch();}OUTPUT:Enter your name RashmiEntered name is RashmiQuestion:\
    \ What are Character Input Output Functions?Answer:Character input functions are\n\
    \n1.  getchar()\n\n2.  getch()\n\n3.  getche()  \n\nAbove three statements used\
    \ for read a single character from keyboard at a time.1)      getchar(): This\
