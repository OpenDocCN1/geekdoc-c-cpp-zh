    2 title : Telecom BillingBook 2 author : ShanthiBook 2 subject : Telecom Billing
    TutorialBook 2 book_id : 64957099.3 What is a Nested Structure?Structure written
    inside another structure is called as nesting of two structures. Nested Structures
    are allowed in C Programming Language.We can write one Structure inside another
    structure as member of another structure.Way 1 : Declare two separate structuresstruct
    date{int date;int month;int year;};struct Employee{char ename[20];int ssn;float
    salary;struct date doj;}emp1;Accessing Nested Elements :❖           Structure
    members are accessed using dot operator.❖           ‘date‘ structure is nested
    within Employee Structure.❖           Members of the ‘date‘ can be accessed using
    ’employee’ emp1 & doj are two structure names (Variables)Explanation Of Nested
    Structure:Accessing Month Field :  emp1.doj.month  Accessing day Field   :  emp1.doj.dayAccessing
    year Field  :  emp1.doj.yearWay 2 : Declare Embedded structuresstruct Employee{char
    ename[20];int ssn;float salary;struct date{int date;int month;int year;}doj;}emp1;Accessing
    Nested Members:Accessing Month Field :  emp1.doj.month  Accessing day Field   :  emp1.doj.dayAccessing
    year Field  :  emp1.doj.yearPROGRAM:#include <stdio.h>struct Employee{char ename[20];int
    ssn;float salary;struct date{int date;int month;int year;}doj;}emp = {"Leela",1001,1000.60,{22,6,1992}};int
    main(int argc, char *argv[]){printf("\nEmployee Name   : %s",emp.ename);printf("\nEmployee
    SSN    : %d",emp.ssn);printf("\nEmployee Salary : %f",emp.salary); printf("\nEmployee
    DOJ    : %d/%d/%d", emp.doj.date,emp.doj.month,emp.doj.year);return 0;}OUTPUT:Employee
    Name   : LeelaEmployee SSN    : 1001Employee Salary : 1000.600000Employee DOJ    :
    22/6/19929.4 What is Arrays of Structures?Structure is used to store the information
    of One particular object but if we need to store such 1000 objects then Array
    of Structure is used.Example:struct Bookinfo{char[20] bname;int pages;int price;}Book[1000];Explanation:Here
    Book structure is used to Store the information of one Book.In case if we need
    to store the Information of 1000 books then Array of Structure is used.b1[0] stores
    the Information of 1st Book , b1[1] stores the information of 2nd Book and So
    on We can store the information of 1000 books.Example:We can represent the std
    array variable as following.// student structurestruct student {char id[15];char
    firstname[64];char lastname[64];float points;};// student structure variablestruct
    student std[3];![](Image00051.jpg)Fig. 9.2: Internal Memory Representation for
    Structure studentPROGRAM:#include <stdio.h>struct Bookinfo{char[20] bname;int
    pages;int price;}book[3];int main(int argc, char *argv[]){int i;for(i=0;i<3;i++){printf("\nEnter
    the Name of Book    : ");gets(book[i].bname);printf("\nEnter the Number of Pages
    : ");scanf("%d",book[i].pages);printf("\nEnter the Price of Book   : ");scanf("%f",book[i].price);}   printf("\nBook
    Details");   for(i=0;i<3;i++){printf("\nName of Book    : %s",book[i].bname);printf("\nNumber
    of Pages : %d",book[i].pages);printf("\nPrice of Book   : %f",book[i].price);}   return
    0;}OUTPUT:Enter the Name of Book    : CEnter the Number of Pages : 100Enter the
    Price of Book   : 200Enter the Name of Book    : CPPEnter the Number of Pages
    : 200Enter the Price of Book   : 300Enter the Name of Book    : JavaEnter the
    Number of Pages : 300Enter the Price of Book   : 500Book DetailsName of Book    :
    CNumber of Pages : 100Price of Book   : 200Name of Book    : CPPNumber of Pages
    : 200Price of Book   : 300Name of Book    : JavaNumber of Pages : 300Price of
    Book   : 5009.5 How to use Structure as Function Arguments?A structure as a function
    argument can be passed in the same way as you pass any other variable or pointer.PROGRAM:#include
    <stdio.h>#include <string.h>struct Books {char  title[50];char  author[50];char  subject[100];int   book_id;};/*
    function declaration */void printBook( struct Books book );int main( ) {struct
    Books Book1;        /* Declare Book1 of type Book */struct Books Book2;        /*
    Declare Book2 of type Book *//* book 1 specification */strcpy( Book1.title, "C
    Programming");strcpy( Book1.author, "Rashmi");strcpy( Book1.subject, "C Programming
    Tutorial");Book1.book_id = 6495403;/* book 2 specification */strcpy( Book2.title,
    "Telecom Billing");strcpy( Book2.author, "Sharmila");strcpy( Book2.subject, "Telecom
    Billing Tutorial");Book2.book_id = 6495788;/* print Book1 info */printBook( Book1
    );/* Print Book2 info */printBook( Book2 );return 0;}void printBook( struct Books
    book ){printf( "Book title : %s\n", book.title);printf( "Book author : %s\n",
    book.author);printf( "Book subject : %s\n", book.subject);printf( "Book book_id
    : %d\n", book.book_id);}OUTPUT:Book title : C ProgrammingBook author : RashmiBook
    subject : C Programming TutorialBook book_id : 6495403Book title : Telecom BillingBook
    author : SharmilaBook subject : Telecom Billing TutorialBook book_id : 64957889.6
    How to Use Pointers to Structures?Defining pointers to structures in the same
    way as you define pointer to any other variable.struct Books *struct_pointer;To
    find the address of a structure variable, place the ''&''; operator before the
    structure''s name as follows:struct_pointer = &Book1;To access the members of
    a structure using a pointer to that structure, you must use the → operator as
    follows:struct_pointer->title;PROGRAM:#include <stdio.h>#include <string.h>struct
    Books {char  title[50];char  author[50];char  subject[100];int   book_id;};/*
    function declaration */void printBook( struct Books *book );int main( ) {struct
    Books Book1;        /* Declare Book1 of type Book */struct Books Book2;        /*
    Declare Book2 of type Book *//* book 1 specification */strcpy( Book1.title, "C
    Programming");strcpy( Book1.author, "Rashmi");strcpy( Book1.subject, "C Programming
    Tutorial");Book1.book_id = 6995407;/* book 2 specification */strcpy( Book2.title,
    "Telecom Billing");strcpy( Book2.author, "Sharma");strcpy( Book2.subject, "Telecom
    Billing Tutorial");Book2.book_id = 6995700;/* print Book1 info by passing address
    of Book1 */printBook( &Book1 );/* print Book2 info by passing address of Book2
    */printBook( &Book2 );return 0;}void printBook( struct Books *book ){printf( "Book
    title : %s\n", book->title);printf( "Book author : %s\n", book->author);printf(
    "Book subject : %s\n", book->subject);printf( "Book book_id : %d\n", book->book_id);}OUTPUT:Book
    title : C ProgrammingBook author : RashmiBook subject : C Programming TutorialBook
    book_id : 6995407Book title : Telecom BillingBook author : SharmaBook subject
    : Telecom Billing TutorialBook book_id : 69957009.7 What are Self Referential
    Structures?Self Referential structures are those [structures](https://www.geeksforgeeks.org/structures-c/)
     that have one or more pointers which point to the same type of structure, as
    their member.![](Image00052.jpg)Fig. 9.3: Self Referential StructuresStructures
    pointing to the same type of structures are self-referential in nature.Example:struct
    node {int data1;char data2;struct node* link;};int main(){struct node ob;return
    0;}In the above example ‘link’ is a pointer to a structure of type ‘node’. Hence,
    the structure ‘node’ is a self-referential structure with ‘link’ as the referencing
    pointer.●         An important point to consider is that the pointer should be
    initialized properly before accessing, as by default it contains garbage value.Types
    of Self Referential Structures1)   Self Referential Structure with Single Link2)  
    Self Referential Structure with Multiple Links1)   Self Referential Structure
    with Single LinkThese structures can have only one self-pointer as their member.
    The following example will show us how to connect the objects of a self-referential
    structure with the single link and access the corresponding data members. The
    connection formed is shown in the following figure.![](Image00053.jpg)Fig. 9.4:
    Self Referential Structure with Single LinkPROGRAM:#include <stdio.h>struct node
    {int data1;char data2;struct node* link;} ;int main(){struct node ob1; // Node1//
    Intializationob1.link = NULL;ob1.data1 = 11;ob1.data2 = 21;struct node ob2; //
    Node2// Initializationob2.link = NULL;ob2.data1 = 31;ob2.data2 = 41;// Linking
    ob1 and ob2ob1.link = &ob2;// Accessing data members of  ob2 using ob1printf("%d",
    ob1.link->data1);printf("\n%d", ob1.link->data2);return 0;}OUTPUT:31412)   Self
    Referential Structure with Multiple Links:Self referential structures with multiple
    links can have more than one self-pointers. Many complicated data structures can
    be easily constructed using these structures. Such structures can easily connect
    to more than one nodes at a time. The following example shows one such structure
    with more than one links.The connections made in the above example can be understood
    using the following figure.![](Image00054.jpg)Fig. 9.5: Self Referential Structure
    with Single LinkPROGRAM:#include <stdio.h>struct node {int data;struct node* prev_link;struct
    node* next_link;};int main(){struct node ob1; // Node1// Intializationob1.prev_link
    = NULL;ob1.next_link = NULL;ob1.data = 10 ;struct node ob2; // Node2// Intializationob2.prev_link
    = NULL;ob2.next_link = NULL;ob2.data = 20;struct node ob3; // Node3// Intializationob3.prev_link
    = NULL;ob3.next_link = NULL;ob3.data = 30;// Forward linksob1.next_link = &ob2;ob2.next_link
    = &ob3;// Backward linksob2.prev_link = &ob1;ob3.prev_link = &ob2;// Accessing  data
    of ob1, ob2 and ob3 by ob1printf("%d\t", ob1.data);printf("%d\t", ob1.next_link->data);printf("%d\n",
    ob1.next_link->next_link->data);// Accessing data of ob1, ob2 and ob3 by ob2printf("%d\t",
    ob2.prev_link->data);printf("%d\t", ob2.data);printf("%d\n", ob2.next_link->data)
    ;// Accessing data of ob1, ob2 and ob3 by ob3printf("%d\t", ob3.prev_link->prev_link->data);printf("%d\t",
    ob3.prev_link->data);printf("%d", ob3.data);return 0;}OUTPUT:10    20    3010    20    3010    20    30In
    the above example we can see that ‘ob1’, ‘ob2’ and ‘ob3’ are three objects of
    the self referential structure ‘node’. And they are connected using their links
    in such a way that any of them can easily access each other’s data. This is the
    beauty of the self referential structures. The connections can be manipulated
    according to the requirements of the programmer.Applications of self referential
    structures:Self referential structures are very useful in creation of other complex
    data structures like:'
