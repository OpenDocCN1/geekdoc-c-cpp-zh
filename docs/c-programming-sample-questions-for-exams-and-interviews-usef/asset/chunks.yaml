    10\. What is Union?A union is a special data type available in C that allows to
    store different data types in the same memory location. You can define a union
    with many members, but only one member can contain a value at any given time.
    Unions provide an efficient way of using the same memory location for multiple-purpose.Defining
    a UnionTo define a union, you must use the union statement in the same way as
    you did while defining a structure. The union statement defines a new data type
    with more than one member for your program. The format of the union statement
    is as follows −Syntax:union [union tag] {member definition;member definition;.
    . .member definition;} [one or more union variables];The union tag is optional
    and each member definition is a normal variable definition, such as int i; or
    float f; or any other valid variable definition. At the end of the union''s definition,
    before the final semicolon, you can specify one or more union variables but it
    is optional. Here is the way you would define a union type named Data having three
    members i, f, and str.Example:union Data {int i ;float f;char str[20];} data;Now,
    a variable of Data type can store an integer, a floating-point number, or a string
    of characters. It means a single variable, i.e., same memory location, can be
    used to store multiple types of data. You can use any built-in or user defined
    data types inside a union based on your requirement.The memory occupied by a union
    will be large enough to hold the largest member of the union. For example, in
    the above example, Data type will occupy 20 bytes of memory space because this
    is the maximum space which can be occupied by a character string. The following
    example program displays the total memory size occupied by the above union.PROGRAM:#include
    <stdio.h>#include <string.h>union Data {int i;float f;char str[10];};int main(
    ) {union Data data;       printf( "Memory size occupied by data : %d\n", sizeof(data));return
    0;}OUTPUT:Memory size occupied by data : 10Question: How to Access Union Members?Answer:To
    access any member of a union, we use the member access operator (.). The member
    access operator is coded as a period between the union variable name and the union
    member that we wish to access. You would use the keyword union to define variables
    of union type. The following example shows how to use unions in a program.PROGRAM:#include
    <stdio.h>#include <string.h>union Data {int i;float f;char str[20];};int main(
    ) {union Data data;       data.i = 10;printf( "data.i : %d\n", data.i);data.f
    = 221.5 ;printf( "data.f : %f\n", data.f);strcpy( data.str, "C Programming");printf(
    "data.str : %s\n", data.str);return 0;}OUTPUT:data.i : 10data.f : 221.500000data.str
    : C ProgrammingHere, all the members are getting printed very well because one
    member is being used at a time.PROGRAM:#include <stdio.h>#include <string.h>typedef
    struct Books {char title[50];char author[50];char subject[100];int book_id;} Book;int
    main( ){Book book;strcpy( book.title, "C Programming");strcpy( book.author, "Nuha
    Ali");strcpy( book.subject, "C Programming Tutorial");book.book_id = 649540;printf(
    "Book title : %s\n", book.title);printf( "Book author : %s\n", book.author);printf(
    "Book subject : %s\n", book.subject);printf( "Book book_id : %d\n", book.book_id);return
    0;}OUTPUT:Book  title : C ProgrammingBook  author : Nuha AliBook  subject : C
    Programming TutorialBook  book_id : 649540typedef and #define#define is a C-directive
    which is also used to define the aliases for various data types similar to typedef
    but with the following differences:➢          typedef is limited to giving symbolic
    names to types only where as #define can be used to define alias for values as
    well, q., you can define 1 as ONE etc.➢           typedef interpretation is performed
    by the compiler whereas #define statements are processed by the pre-processor.Question:
    Explain about bitfields.Answer:Suppose a C program contains a number of TRUE/FALSE
    variables in a structure as follows:struct abc{unsigned int a;unsigned int b;};This
    structure requires 8 bytes of memory space but in actual we are going to store
    either 0 or 1 in each of the variables. If we use such variables inside a structure
    then we can define the width of a variable which specifies that we are going to
    use only those number of bytes. For example, above structure can be modified as
    follows:struct abc{unsigned int a : 1;unsigned int b : 1;};Now, the above structure
    will require 4 bytes of memory space for status variable but only 2 bits will
    be used to store the values. If you will use up to 32 variables each one with
    a width of 1 bit , then also status structure will use 4 bytes, but as soon as
    you will have 33 variables, then it will allocate next slot of the memory and
    it will start using 8 bytes.For example:struct abc{unsigned int a : 1;unsigned
    int b : 1;};Now, the above structure will require 4 bytes of memory space for
    status variable but only 2 bits will be used to store the values. If you will
    use up to 32 variables each one with a width of 1 bit , then also status structure
    will use 4 bytes, but as soon as you will have 33 variables, then it will allocate
    next slot of the memory and it will start using 8 bytes.PROGRAM:struct abcd1{int
    a;int b;} ;struct abcd2{int a : 1;int b : 1;} ;int main( ){printf( "Memory size
    occupied by abcd1 : %zu\n", sizeof(struct abcd1));printf( "Memory size occupied
    by abcd2 : %zu\n", sizeof(struct abcd2));return 0;}OUTPUT:Memory size occupied
    by abcd1 : 8Memory size occupied by abcd2 : 411\. What are File Operations?FILE
    HANDLING IN C: file I/O operations:File handling in C enables us to create, update,
    read, and delete the files stored on the local file system through our C program.
    The following operations can be performed on a file.1)      Creation of a new
    file (fopen with attributes as “a” or “a+” or “w” or “w++”)2)       Opening an
    existing file (fopen)3)       Reading from file (fscanf or fgetc)4)       Writing
    to a file (fprintf or fputs)5)       Moving to a specific location in a file (fseek,
    rewind)6)       Closing a file (fclose)The text in the brackets denotes the functions
    used for performing those operations.


    | No. | Function | Description |


    | 1 | fopen() | Opens new or existing file |


    | 2 | fprintf() | Write data into file |


    | 3 | fscanf() | Reads data from file |


    | 4 | fputc() | Writes character into file |


    | 5 | fgetc() | Reads character from file |


    | 6 | fclose() | Closes the file |


    | 7 | fseek() | Sets the file pointer to given position |


    | 8 | fputw() | Writes an integer to file |


    | 9 | fgetw() | Reads an integer from file |


    | 10 | ftell() | Returns current position |


    | 11 | rewind() | Sets the file pointer to the beginning of file |


    11.1 How to Create a File?The fopen() function is used to create a new file or
    to open an existing file.Syntax:*fp = FILE *fopen(const char *filename, const
    char *mode);Here, *fp is the FILE pointer (FILE *fp), which will hold the reference
    to the opened(or created) file. The filename is the name of the file to be opened
    and mode specifies the purpose of opening the file. Mode can be of following types,


    | No. | Mode | Description |


    | 1 | r | Opens a text file In Reading Mode |


    | 2 | w | Opens or Creates a text file in Writing Mode |


    | 3 | a | Opens a text file in Append Mode |


    | 4 | r+ | Opens a text file in both Reading and Writing Mode |


    | 5 | w+ | Opens a text file in both Reading and Writing Mode |


    | 6 | a+ | Opens a text file in both Reading and Writing Mode |


    | 7 | rb | Opens binary file in Reading Mode |


    | 8 | wb | Opens or Create a binary file in Writing Mode |


    | 9 | ab | Opens a binary file in Append Mode |


    | 10 | rb+ | Opens a binary file in both Reading and Writing Mode |


    | 11 | wb+ | Opens a binary file in both Reading and Writing Mode |


    | 12 | ab+ | Opens a binary file in both Reading and Writing Mode |'
