  trans: "\n\n# 例: if, switch\n\n使用 `const` 关键字声明的变量这些变量被称为常量变量。我们无法以任何代价改变常量变量的数据。常量变量可以是局部的、全局的和块级的。\n\
    \n**问题：如何初始化变量？**\n**答案：** 变量可以通过两种方式初始化。它们是：\n1) 静态变量初始化\n2) 动态变量初始化\n\n### 1)\
    \ 静态变量初始化\n通过赋值常量值来声明变量被称为静态变量初始化。或者说赋值给变量的值在程序编译之前就已经已知，被称为静态变量初始化。\n示例： \n```c\n\
    int x=10;\nfloat y=200;\nchar c=\"ngc\";\n```\n\n### 2) 动态变量初始化\n通过赋值表达式或变量来声明变量被称为动态变量初始化。或者说赋值给变量的值在编译时是未知的，被称为动态变量初始化。可以使用\
    \ `c` 库中预定义的函数完成动态初始化。\n示例：\n```c\nint c;\nscanf(\"%d\",&c); // 动态初始化\nc= 10;\
    \ //静态初始化\n```\n\n# ‘C’ 程序的结构\n```c\n<预处理指令>\n<全局声明>\nvoid main (){\n<局部声明>;\n\
    <语句>;\n}\nFunction (arguments){\n<局部声明>;\n<语句>;\n}\n```\n* `C` 程序具有自由格式的结构。\n\
    * 每一条语句必须以分号（`;`）结束。\n* 程序是函数的集合。可能有很多函数，也可能没有，但至少必须有一个 `main()` 函数，这是执行的开始点。\n\
    * `C` 是大小写敏感的。所有关键字都定义为小写。\n* 所以最好用小写写整个程序。\n\n**问题：什么是预处理指令？**\n**答案：** 以哈希符号（`#`）开头的命令被称为预处理指令。这些命令用于将库信息放入程序中。通常在\
    \ `C` 程序中，库信息以头文件的形式放置。\n示例：\n```c\n#include <stdio.h>\n#include \"conio.h\"\n\
    #define PI 3.14159\n```\n\n**问题：什么是全局声明？**\n**答案：** 要使用任何变量，必须在第一个可执行语句之前用其数据类型进行声明。在块内部声明的变量仅在该块内可用。此类变量被称为局部变量。若要在整个程序中使用具有相同效果的变量，必须将其声明为全局。这些全局变量声明在函数外部。\n\
    \n**问题：什么是 `main()` 函数？**\n**答案：**\n* 它是程序执行的起点。该函数没有参数也没有参数。\n* `C` 语言不允许在单个程序中出现多个一个\
    \ `main()` 函数。\n* `main()` 函数始终只用小写。\n* 每个函数都必须且应该通过 `main()` 调用（直接或间接）。\n* 该函数由声明和可执行语句组成。\n\
    * `C` 编译器不考虑 `main` 之外的任何内容。\n\n# 2.8 什么是输入输出语句？\n输入输出操作通过使用预定义的库函数完成。\n\n###\
    \ printf()\n`printf()` 是 `C` 语言中一个预定义的输出函数。基本上 `printf()` 有三个用途：\n1. 第一个用途是在控制屏幕上显示某些消息。\n\
    \   语法：`printf(\"Some text message\");`\n   示例：`printf (\"My name is C\");`\n\
    2. 第二个用途是在控制屏幕上显示某些值。\n   语法：`printf(\"format specifier\", variable_names);`\n\
    \   示例：\n   ```c\n   printf(\"%d\",a);\n   printf(\"%d%d\",a,b);\n   printf(\"\
    %d%f%c\",a,b,c);\n   printf(\"value of a =%d\",a);\n   printf(\"addition =%d\"\
    ,c);\n   ```\n3. 如果你想打印变量的地址，请使用 `printf()`：\n   语法：`printf(\"control string\"\
    ,&variable_name);`\n   示例：\n   ```c\n   printf(\"%d\",&a);\n   printf(\"address\
    \ of a =%d\",&a);\n   printf(\"address of a and b=%d%f\",a,b);\n   ```\n**注意：**\n\
    1. `printf()` 函数的返回值是整数类型。\n2. `printf()` 定义在 `stdio.h`（标准输入输出）头文件中。\n\n### scanf()\n\
    * `scanf()` 函数是一个预定义的函数，通过使用 `scanf()` 函数我们可以在运行时读取数据。\n* `scanf` 函数返回一个整数值，即扫描到的值的总数。\n\
    * `scanf()` 函数的完整行为仅取决于格式说明，而不取决于参数列表。\n* 当我们使用 `scanf()` 函数时，如果你没有为参数提供取地址符，`scanf()`\
    \ 将读取值但这些值不会存储在内存中。\n   语法：`scanf('%format string', &(variables));`\n   示例：\n\
    \   ```c\n   scanf(\"%d %d\", &a,& b);\n   ```\n\n# 3. 什么是控制语句？\n## 3.1 什么是条件语句？\n\
    **问题：什么是选择语句？**\n**答案：** 这些语句也称为“分支语句”或条件语句。因为它们被用于将控制从一条语句转移到另一个语句。条件语句主要分为两类，它们是：\n\
    1) `if` 语句\n2) `switch` 语句。\n\n### 3.1.1 什么是简单 if 语句？\n`C` 使用 `if` 关键字来实现决策控制语句。该语句的一般形式如下：\n\
    语法：\n```c\nif (condition){\nStatements;\n}\n```\n如果条件为真，则执行 `if` 块。否则不执行语句。当我们需要创建决策时，`if`\
    \ 是可选的。语句体是必须的。如果不指定体，则自动以分号终止。\n\n**问题：使用 if 语句打印两个数字中较大的。**\n```c\n#include<stdio.h>\n\
    #include<conio.h>\nvoid main(){\nint a,b;\nclrscr();\nprintf(\"enter a,b =\");\n\
    scanf(\"%d%a,&b);\nif(a>b){printf(\"a is greater than b\");}\nif(b>a){printf(\"\
    b is than a\");\n\n\n\n：：enter a,,, =10 a greater than b`\n\n### 3.1.2 什么是 if\
    \ else 语句？\n`if else` 语句是简单 `if` 语句的扩展。其一般形式语法为：\n```c\nif (condition){\nBlock\
    \ of statements;\n}\nelse{\nBlock of statements;\n}\n```\n如果条件为真，执行 `if` 块，否则执行\
    \ `else` 块。\n\n**问题 1：写一个程序打印给定值是偶数还是奇数。**\n```c\n#include<stdio.h>\n#include<conio.h>\n\
    void main(){\nint a;\nclrscr();\nprintf(\"enter a=\");\nscanf(\"%d\", &a);\nif(a%2==0){printf(\"\
    a is even \", a);}\nelse{printf(\"a is odd\", a);}\n```\n输出：`enter a=5 odd`\n\n\
    **问题 2：写一个程序检查给定数字是正数还是负数。**\n```c\n#include<stdio.h>\n#include<conio.h>\nvoid\
    \ main(){\nint k;\nclrscr();\nprintf(\"enter any number=\");\nscanf(\"%d\", &k);\n\
    if(k==0){printf(\"the number is zero\");}\nelse if(k>0){printf(\"the number is\
    \ positive\");}\nelse{printf(\"the number is negative\");}\n```\n```}\n```\n\n\
    ### 3.1.3 什么是 else-if 语句？\n`else-if` 也是 `if else` 语句的扩展，用于实现多个条件。一般形式为：\n```c\n\
    if (condition){\nBlock of statements;\n}\nelse if (condition){\nBlock of statements;\n\
    }\nelse{\nBlock of statements;\n}\n```\n如果第一个 `if` 条件不成立，则进入第二个 `if` 条件，如果为真则进入特定块。假设上述条件失败，最终移动到\
    \ `else` 块。\n\n**问题：写一个 C 程序检查给定字符是否为元音。**\n```c\n#include<stdio.h>\n#include<conio.h>\n\
    void main(){\nchar c;\nclrscr();\nprintf(\"enter a character =\");\nscanf(\"%c\"\
    , &c);\nif(c=='a'||c=='A'){printf(\"It is vowel\");}\nelse if(c=='e'||c=='E'){printf(\"\
    It is vowel\");}\nelse if (c=='o'||c=='O'){printf(\"It is vowel\");}\nelse if(c=='i'||c=='I'){printf(\"\
    It is vowel\");}\nelse if (c=='u'||c=='U'){printf(\"It is vowel\");}\nelse{printf(\"\
    %c is not vowel\", c);}\n}\n```\n输出：`enter a character=E It is vowel`\n\n### 3.1.4\
    \ 什么是嵌套 if？\n`if...else` 链（`if...else if....else`）根据测试表达式的真假执行两段不同的代码。有时必须从超过\
    \ 2 种可能性中做出选择。`if...else` 链允许你检查多个测试表达式并执行不同的语句。\n语法：\n```c\nif(testExpression1){\n\
    Statements;\n}\nelse if(testExpression2){\nStatements;\n}\nelse{\nStatements;\n\
    }\n```\n**问题：使用嵌套 if … else 写一个 C 程序。**\n```c\n#include <stdio.h>\nint main(){\n\
    int number1,number2;\nprintf(\"Enter two integers: \");\nscanf(\"%d %d\", &number1,\
    \ &number2);\nif (number1 >= number2){\nif (number1 == number2){\nprintf(\"Result:\
    \ %d = %d\",number1,number2);}\nelse{printf(\"Result: %d > %d\", number1, number2);}}\n\
    else{printf(\"Result: %d < %d\",number1, number2);}}\nreturn 0;}\n```\n输出：`Enter\
    \ two integers:245 Result 24<5`\n\n# 3.1.5 什么是使用 switch Case 的多路选择语句？\n`Switch`\
    \ 是关键字，通过使用 `switch` 我们可以构建多个选择语句块。多个块可以使用 `case` 关键字构建。\n* 它提供了一种简单的方法，根据表达式的值将执行分发到代码的不同部分。因此，它通常提供比大量的\
    \ `if-else` 更好的替代方案。\n语法：\n```c\nswitch (expression){\ncase value1:\nStatements;\n\
    break;\ncase value 2:\nStatements;\nbreak;\n...\ncase value n:\nStatements;\n\
    break;\ndefault:\n```\n* `switch` 语句的工作方式如下：将表达式的值与 `case` 语句中的常量值进行比较。如果找到匹配项，执行该\
    \ `case` 语句。如果没有找到匹配，则执行 `default` 语句。\n* `Default` 是一种特殊的 case，当未找到匹配项时自动执行。使用\
    \ `default` 是可选的。当我们需要处理所有 `switch` 块时建议使用。\n\n**问题 1：使用 switch case 实现算术运算。**\n\
    ```c\n#include<stdio.h>\n#include<conio.h>\nvoid main(){int a,b,k;clrscr();\n\
    printf(\"enter two numbers=\");scanf(\"%d%d\", &a,&b);\nprintf(\"\\n 1.addition:\"\
    );\nprintf(\"\\n 2.Subtraction:\");\nprintf(\"\\n 3.multiplication:\");\nprintf(\"\
    \\n 4.division\");\nprintf(\"\\n select choice:\");scanf(\"%d\", &k);\nprintf(\"\
    \\n\");\nswitch(k){\ncase 1:printf(\"the addition=%d\", a+b);break;\ncase 2:printf(\"\
    the subtraction =%d\",a-b);break;\ncase 3:printf(\"the multiplication=%d\", a*b);break;\n\
    case 4:printf(\"the division=%d\", a/b);break;\ndefault:printf(\"in valid choice);}\n\
    ```\n输出：`enter two numbers=305 1.addition:2.Subtraction:3.multiplication:4.division\
    \ select choice:1 addition=8`\n\n**问题 2：使用 switch case 写程序查找给定数字是否小于五。**\n```c\n\
    #include <stdio.h>\n#include <conio.h>\nvoid main(){int k ;clrscr();\nprintf(\"\
    Enter any number \");scanf(\"%d\", &k) ;\nswitch(k){\ncase 0 :printf(\"\\n Number\
    \ is zero \");\ncase 1 :\ncase 2 :\ncase 3 :\ncase 4 : printf(\"\\n Number less\
    \ than five \");\ncase 5 : printf(\"\\n Number is five \");break;\ndefault :printf(\"\
    \\n Number is greater than five \")}\n```\n输出：`Enter any number 3 Number than\
    \ five`\n\n**问题 3：为 switch case 写程序。**\n```c\n#include <stdio.h>\n#include <conio.h>\n\
    main(){char k;clrscr();\nprintf(\"Enter any one of alphabets: \");k = getche()\
    \ ;\nswitch(k){\ncase 'a' :case 'A' : printf(\"\\n A for Active \");break;\ncase\
    \ 'b' :case 'B' : printf(\"\\n B for Brave \");break;\ncase 'c' :case 'C' : printf(\"\
    \\n C for Courage \");break;\ncase 'd' :case 'D' : printf(\"\\n D for Dare \"\
    );break;\ndefault : printf(\"\\n You are timid \")}\n```\n输出：`Enter any one of\
    \ alphabets: DD D for Dare`\n\n# 3.2 什么是迭代语句？\n**问题：迭代语句的作用是什么？**\n**答案：** 迭代意味着语句的重复执行。在大多数情况下，我们需要按照指定的次数执行一组语句。重复编写同一组语句会导致：\n\
    1. 时间浪费。\n2. 内存浪费。\n3. 产生错误的机会。\n为了解决这个问题，我们引入了循环的概念。使用循环，我们只需写一次语句，就可以执行多次。\n\
    \n**问题：条件语句是指什么？**\n**答案：** 直到给定条件满足可以执行指定次数的语句被称为条件语句。C 语言通过以下单词支持这些语句：\n1) `while`\n\
    2) `do-while`\n3) `for`\n\n**问题：什么是循环？**\n**答案：** 循环是在某些条件为真时重复执行的指令组。\n\n**问题：解释循环的类型？**\n\
    循环分为两类：\n1. **入口控制循环**：在这种控制循环中，首先检查条件。如果条件为真，则进入体。如果条件失败，体至少不执行一次。入口循环也称为预检查循环。例如：`while`、`for`。\n\
    2. **出口控制循环**：在这种循环中编译器首先执行体，然后检查条件。如果条件再次为真，则进入体。如果条件失败，则退出体。出口循环也称为后检查循环。\n\n\
    **问题：解释在程序中实现循环的步骤？**\n通常每个循环需要三个步骤：\n1. 初始化\n2. 条件\n3. 迭代\n\n**问题：解释循环中初始化、条件、迭代的性？**\n\
    初始化指示循环的起点。条件指示循环的终点（即当条件失败时自动终止）。为了按顺时针或逆时针方向旋转循环体，循环中是需要迭代的。\n\n### 3.2.1 使用\
    \ `while` 语句进行循环的作用是什么？\n语法：\n```c\nwhile(condition){\nstatements1;\nStatement2;\n\
    ...\nincrement/ decrement;\n}\n```\n**问题 1：写一个程序打印 1 到 n 的值。**\n```c\n//Program\
    \ to print one to n\n#include<stdio.h>\n#include<conio.h>\nvoid main(){int n,i;clrscr();\n\
    printf(\"enter n=\");scanf(\"%d\",n);\ni=1;\ndo{printf(\"%t\",i);i++;}while (i<=n);}\n\
    ```\n**问题 2：写一个程序打印数字表。**\n```c\n//Program to print given table\n#include<stdio.h>\n\
    #include<conio.h>\nvoid main(){int n,i;clrscr();\nprintf(\"enter n=\");scanf(\"\
    %d\",n);\ni=1;\ndo{printf(\"\\n%d\",i);i++;}while n}\n```\n**问题 3：写一个程序查找数字反转。**\n\
    ```c\n//Program to find reverse of number\n#include<stdio.h>\n#include<conio.h>\n\
    void main(){int n,rd,sd;clrscr();\nprintf(\"enter n=\");scanf(\"%d\",n);\ni=0;\n\
    while(n>0){rd=n%10;sd=sd*10+rd;n=n/10;}\n```\n\n### 3.2.2 前测试循环\n预测试循环的关键特征是我们在执行循环体之前测试是否继续。这种这样做的影响是我们可能不执行体。因此，如果我们设计的程序中某个部分可能执行\
    \ 0 次或多次（不保证执行），那么预测试结构就是我们需要的。\n\n### 后测试循环\n正如我们有一个顶部测试继续条件的结构一样，我们也有在执行块之后测试的结构。这被称为后测试循环。这种测试确保了循环体至少执行一次。这使得它区别于预测试循环。\n\
    \n### 中测试循环\n有一种循环结构可以泛化预测试和后测试循环。在这里我们在循环的中间进行测试。\n\n"
