    2.  To develop the assembly code, knowledge of hardware compulsory required.


    3.  Execution time is more because of translating of assembly code into machine
    level code.


    Question: What is a High Level Language?Answer:


    1.  High level language has been introduced in 1960’s.


    2.  The languages which are developed in general language (English) are called
    as high level languages.


    3.  High level having greater efficiency.


    4.  These are portable languages.


    5.  FORTAN, COBOL, C, C++, JAVA etc are the examples of high level languages.


    6.  Machine does not understand high level languages directly. So to convert high
    level languages into its equivalent machine level languages translators are used.


    7.  The translators are interpreter and compiler.


    Question:What are the advantages of High Level Language?Answer:


    1.  High level languages are always Machine independent.


    2.  These languages are easy to learn and used.


    3.  Preparation cost is less due to it takes less time and effort to develop the
    application.


    4.  Easy to maintain compare to machine level and assembly level languages.


    Question:What are the Disadvantages of High Level Language?Answer:


    1.  The efficiency of the program less compared with machine and assembly level
    languages.


    2.  Execution time is more because of translation i.e. high level to machine level
    languages.


    3.  This are having less flexible than assembly language.


