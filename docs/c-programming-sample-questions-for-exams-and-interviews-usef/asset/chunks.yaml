  trans: "\n\n# C 语言考试与面试样题\n\n作者：Rashmi  \n版本 1.0  \n版权所有 2020  \n\n**作者：** Rashmi\
    \  \n\n## 前言\n\n笔者在工程学院从事计算机科学与工程教学工作。在授课过程中，当学生被问到 C 语言的任一子话题时，他们常常会因无法给出正确答案而感到困惑。同样地，他们在求职面试中面对面试官提出的问题时也常感到茫然。\n\
    \n为了以提问的形式分享知识并以 Kindle 电子书形式展示 C 语言程序解决方案而编写了本书。市面上已有许多 C 语言编程书籍。但通常情况下，学生们寻求的是真正的编程问题——无论是应对考试还是工作面试。\n\
    \n当前版本的 Kindle 电子书涵盖了基本语法或子主题的用法，并附有已解决的示例程序；通过具体结构化实例解释概念化繁为简轻松学习每个知识点都经过编译器测试确保准确可靠读者可直接参阅附带代码输出的问题陈述非常方便实用！\n\
    \n本出版物将定期更新根据收到的反馈持续改进内容祝你拥有美好时光好运伴随左右!\n\n---\n\n## 目录\n1   什么是问题解决？\n    - \
    \  11  有哪些解决问题的工具？\n        - ……\n2 ...（其余内容结构保持原样但格式正确）\n\n--- \n\n### 第一章 ：理解问题及其解决方法\
