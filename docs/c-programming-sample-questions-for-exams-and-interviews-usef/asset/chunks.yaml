- fmt: "\n➢ 在这种技术中，调用函数中的实际参数值被复制到被调用函数的形参中。\n➢ 这里的数据传输只朝一个方向进行，即从调用函数到被调用函数。因此，对形参所做的任何更改都不会影响实参。\n\
    ➢ 但是，如果实参发生任何变化，则会自动影响到形参。\n\n**问题：**编写一个C程序来使用按值传递传參。\n\n```\nPROGRAM://write\
    \ a program to send value by call by value\n#include<stdio.h>\n#include<conio.h>\n\
    void change();\nvoid main()\n{\nint x,y;\nclrscr();\nprintf(\"\\n enter values\
    \ of x and y=\");\nscanf(\"%d%d\",&x,&y);\nchange(x,y);\nprintf(\"\\n in main\
    \ () x=%d, y=%d\",x,y);\ngetch();\n}\nvoid change(int a,int b)\n{\nint k;\nk=a;\n\
    a=b;\nb=k;\nprintf(\"\\n in change() a=%d,b=%d\",a,b);\n}\n```\n\n输出：\n`enter\
    \ values of xand y=40`\n`20in change() a=20,b=40`\n`in main () x=40, y=20`\n\n\
