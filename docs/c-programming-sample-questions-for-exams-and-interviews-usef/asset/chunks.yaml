    to find the prime numbers from 2 to 10#include <stdio.h>#include<conio.h>int main
    (){int i, j;clrscr();for(i = 2; i<10; i++){for(j = 2; j <= (i/j); j++)if(!(i%j))
    break; // if factor found, not primeif(j > (i/j))printf("%d is prime\n", i);}return
    0;}3.3     What is break Statement?The break statement in C programming has the
    following two usages −


    1.  When a break statement is encountered inside a loop, the loop is immediately
    terminated and the program control resumes at the next statement following the
    loop.


    2.  It can be used to terminate a case in the switch statement (covered in the
    next chapter).


    If you are using nested loops, the break statement will stop the execution of
    the innermost loop and start executing the next line of code after the block.Syntax:break;Flow
    Diagram for break statement:![](Image00021.jpg)Fig. 3.9: Flow chart for break
    statementQuestion:Write a C program using break statement.PROGRAM://Example program
    using break statement#include <stdio.h>int main () {/* local variable definition
    */int a = 10;/* while loop execution */while( a < 20 ) {printf("value of a: %d\n",
    a);a++;if( a > 15) {/* terminate the loop using break statement */break;}}return
    0;}OUTPUT:value of a: 10value of a: 11value of a: 12value of a: 13value of a:
    14value of a: 153.4 What is continue Statement?The continue statement in C programming
    works somewhat like the break statement. Instead of forcing termination, it forces
    the next iteration of the loop to take place, skipping any code in between. For
    the for loop, continue statement causes the conditional test and increment portions
    of the loop to execute. For the while and do…while loops, continue statement causes
    the program control to pass to the conditional tests.Syntax:continue;Flow Diagram:![](Image00022.jpg)Fig.
    3.10: Flow chart for continue statementQuestion:Write a C program using continue
    statement.PROGRAM://Example Program for continue statement#include <stdio.h>int
    main () {/* local variable definition */int a = 10;/* do loop execution */do {if(
    a == 15) {/* skip the iteration */a = a + 1;continue;}printf("value of a: %d\n",
    a);a++ ;} while( a < 20 );return 0;}OUTPUT:value of a: 10value of a: 11value of
    a: 12value of a: 13value of a: 14value of a: 16value of a: 17value of a: 18value
    of a: 193.5 What is goto Statement?goto is a jumping statement in c language,
    which transfer the program’s control from one statement to another statement (where
    label is defined).Defining a labelLabel is defined following by the given syntaxlabel_name:label_name
    should be a valid identifier name.: (colon) should be used after the label_name.Transferring
    the control using ‘goto’Program’s control can be transfer following by the given
    syntaxgoto label_name;Transferring the control from down to toplabel-name :statement1;statement2;..if(any-test-condition)goto
    label-name;Question: Write a C program using goto statement.PROGRAM:


    //Program using goto statememtvoid main(){int number;number=1;repeat:printf("%d\n",number);number++;if(number<=10)goto
    repeat;}OUTPUT:123456789104\. What is an Array?Question: What is the need of arrays?Answer:A
    variable having only one memory location so we can store only one value at a time.
    But my requirement is I want to store multiple data values into one variable at
    a time (the total data belonging to similar data only). In c language by using
    arrays we can achieve this requirement (i.e. storing set of data values into single
    variable). This is the need of arrays.Question: What is array? Explain its properties?Answer:✓        
    An array is a collection of data storage locations, each having the same data
    type and the same name.✓          Each storage location in an array is called
    an array element or array index.✓          Array is derived data type.✓         
    Array is a composite data type.Properties:1\. Array index values always start
    from zero(0).2\. The variable name of array contains the base address of the memory
    block.3\. The array variable is created at the time of compilation.4\. The size
    of the array can’t be alerted at run time.5\. The address held by the array variable
    is static.6\. The array size must be constant.Question: What are the advantages
    and disadvantages of array?Answer:Advantages:


    *   Array supporting grouping of similar data elements.


    *   Referring more than one value with the same name which decreases complexity
    in reading and writing values.


    Disadvantages:The disadvantage of array is wastage of memory because of its static
    behavior.4.1 How to Declare an Array?To declare an array,Syntax:data_type array_name[array_size];For
    example,float mark[6];Here, we declared an array, mark, of floating-point type
    and size 6. Meaning, it can hold 6 floating-point values.4.2 How to Find Elements
    of Array?Access of elements in an array is done by indices.Suppose you declared
    an array mark as above. The first element is mark[0], second element is mark[1]
    and etc.![](Image00023.jpg)Fig. 4.1: Internal memory representation for array
    markNote:➢           Arrays have 0 as the first index not 1\. In this example,
    mark[0]➢          If the size of an array is n, to access the last element, (n-1)
    index is used. In this example, mark[4]➢          Suppose the starting address
    of mark[0] is 2120\. Then, the next address, a[1], will be 2124, address of a[2]
    will be 2128 and so on. It''s because the size of a float is 4 bytes.4.3 How to
    Initialize an Array?It''s possible to initialize an array during declaration.
    For example,int mark[5] = {11, 12, 13, 14, 15};Another method to initialize array
    during declaration:int mark[ ] = {11, 12, 13, 14, 15};![](Image00024.jpg)Fig.
    4.2: Elements in memory for array markHere,mark[0] is equal to 11mark[1] is equal
    to 12mark[2] is equal to 13mark[3] is equal to 14mark[4] is equal to 15Question:
    Write a C Program to find the average of n numbers using arrays.PROGRAM:// Program
    to find the average of n numbers using arrays#include <stdio.h>#include<conio.h>int
    main(){int marks[10], i, n, sum = 0, average;clrscr();printf("Enter n: ");scanf("%d",
    &n);for(i=0; i<n; ++i ){printf("Enter number%d: ",i+1);scanf("%d", &marks[i]);sum
    += marks[i];}average = sum/n;printf("Average = %d", average);return 0;}OUTPUT:Enter
    n: 3Enter number 1:10Enter number 2:15Enter number 3:5Average=104.4 What are the
    Different Types of Array?Arrays are broadly classified in two types. They are1)      
    Single Dimensional arrays.2)       Multi Dimensional arrays.Question: What is
    single dimensional array? Explain with examples?Answer:


    *   One dimensional array is a list of values of the same data type. A one dimensional
    array contains only one subscripts


    *   A subscript is a number inside a bracket that follows an array''s name. This
    number can identify the number of individual elements in the array.


    *   Array elements are stored in sequential memory locations'
