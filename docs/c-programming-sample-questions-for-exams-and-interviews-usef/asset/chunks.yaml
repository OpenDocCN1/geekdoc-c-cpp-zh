    string.h>#include<stdio.h>#include<conio.h>void main(){char str[20];clrscr();puts(“Enter
    the string in uppercase:”);gets(str);strlwr(str);printf(“Entered string in lowercase:”);puts(str);getch();}OUTPUT:Enter
    the string in uppercase:YEAREntered string in lowercase:yearstrupr(): This function
    is used to convert the lowercase string to uppercase string.Syntax:strupr(string);PROGRAM:#include<
    string.h>#include<stdio.h>#include<conio.h>void main(){char str[20];clrscr();puts(“Enter
    the string in lowercase”);gets(str);printf(“Entered string in uppercase”);strupr(str);puts(str);getch();}OUTPUT:Enter
    string in lowercase:newEntered string in uppercase:NEWQuestion: Write a C program
    to check the given string is palindrome or not.PROGRAM:#include< string.h>#include<stdio.h>#include<conio.h>void
    main(){char str[20],str1[20];clrscr();puts(“Enter a string:”);gets(str);strcpy(str1,str);strrev(str);i=strcmp(str,str1);if(i==0)puts(“Given
    string is palindrome”);elseputs(“Given string is not palindrome”);getch();}OUTPUT:Enter
    a string:MADAMGiven string is palindrome6\. What are Functions?Question: What
    is modular programming?Answer:If a program is large, it is subdivided into a number
    of smaller programs that are called modules or subprograms. If a complex problem
    is solved using more modules, this approach are known as modular programmingQuestion
    What is a function?Answer:A function is a named, independent section of C code
    that performs a specific task and optionally returns a value to the calling program.Now
    let''s look at the parts of this definition:


    1.  A function is named: Each function has a unique name. By using that name in
    another part of the program, you can execute the statements contained in the function.
    This is known as calling the function. A function can be called from within another
    function.


    2.  A function is independent: A function can perform its task without interference
    from or interfering with other parts of the program.


    3.  A function performs a specific task: This is the easy part of the definition.
    A task is a discrete job that your program must perform as part of its overall
    operation, such as sending a line of text to a printer, sorting an array into
    numerical order, or calculating a cube root.


    4.  A function can return a value to the calling program. When your program calls
    a function, the statements it contains are executed. If you want them to, these
    statements can pass information back to the calling program.'
