    \ );}int fib(int val){if(val<=2)return 1;elsereturn(fib(val-1)+fib(val-2));}OUTPUT:enter\
    \ the number of terms 6Fibonacci sequence for 6 terms is 0​ 1​ 1​ 2​ 3​ 5Question:\
    \ What is Towers of Hanoi? How does it implement recursion?Answer:Tower of Hanoi\
    \ is a mathematical puzzle where we have three rods and n disks. The objective\
    \ of the puzzle is to move the entire stack to another rod, obeying the following\
    \ simple rules:1)       Only one disk can be moved at a time.2)      Each move\
    \ consists of taking the upper disk from one of the stacks and placing it on top\
    \ of another stack i.e. a disk can only be moved if it is the uppermost disk on\
    \ a stack.3)       No disk may be placed on top of a smaller disk.Approach :Take\
    \ an example for 2 disks :Let rod 1 = 'A', rod 2 = 'B', rod 3 = 'C'.Step 1 : Shift\
    \ first disk from 'A' to 'B'.Step 2 : Shift second disk from 'A' to 'C'.Step 3\
    \ : Shift first disk from 'B' to 'C'.The pattern here is :Shift 'n-1' disks from\
    \ 'A' to 'B'.Shift last disk from 'A' to 'C'.Shift 'n-1' disks from 'B' to 'C'.Image\
    \ illustration for 3 disks :Initially all the disks are as shown below.![](Image00031.jpg)Step\
    \ 1:![](Image00032.jpg)Step 2:![](Image00033.jpg)Step 3:![](Image00034.jpg)Step\
    \ 4:![](Image00035.jpg)Step 5:![](Image00036.jpg)Step 6:![](Image00037.jpg)Step\
    \ 7:![](Image00038.jpg)PROGRAM:#include <stdio.h>int main(){int n = 4; // Number\
    \ of diskstowerOfHanoi(n, 'A', 'C', 'B');// A, B and C are names of rods in towers\
    \ of hanoireturn 0;}// C recursive function to solve tower of hanoi puzzlevoid\
    \ towerOfHanoi(int n, char from_rod, char to_rod, char aux_rod){if (n == 1){printf(\"\
    \\n Move disk 1 from rod %c to rod %c\", from_rod, to_rod);return;}towerOfHanoi(n-1,\
    \ from_rod, aux_rod, to_rod);printf(\"\\n Move disk %d from rod %c to rod %c\"\
    , n, from_rod, to_rod);towerOfHanoi(n-1, aux_rod, to_rod, from_rod);}Here,For\
    \ n disks, total 2n – 1 moves are required.Example: For 4 disks 24 – 1 = 15 moves\
    \ are required.For n disks, total 2n-1 function calls are made.Example: For 4\
    \ disks 24-1 = 8 function calls are made.Question: What are the differences between\
    \ recursion and iteration?Answer:\n\n| RECURSION | ITERATION |\n\n| 1)    Function\
    \ calls itself is called as Recursion. | 1)    A set of instructions repeatedly\
    \ executed is called as Iteration. |\n\n| 2)    Functions are the applications\
    \ for Recursion, | 2) Loops are the application for Iteration. |\n\n| 3)    Termination\
    \ for recursion is through base case, where there will be no function call. |\
    \ 3) When the termination condition for the iterator ceases to be satisfied. |\n\
    \n| 4)    Used when code size needs to be small, and time complexity is not an\
    \ issue. | 4) Used when time complexity needs to be balanced against an expanded\
    \ code size. |\n\n| 5)    Recursion has smaller code size. | 5) Iteration has\
    \ larger code size. |\n\n6.4 What are the Standard Library Functions?Question:\
    \ What Is Header File In C Language?Answer:●          Header file is a file that\
    \ contains function declaration and macro definition for C in-built library functions.●         \
    \ All C standard library functions are declared in many header files which are\
    \ saved as file_name.h.●         We are including these header files in our C\
    \ program using “#include <file_name.h>” command to make use of the functions\
    \ those are declared in the header files.●         We can include header files\
    \ in our C program using “#include <filename.h>” command, all C code of the header\
    \ files are included in C program. Then, this C program is compiled by compiler\
    \ and executed.●         A header file is a file with extension .h  which contains\
    \ C function declarations and macro definitions to be shared between several source\
    \ files. There are two types of header files:\n\n1.  The files that the programmer\
    \ writes\n\n2.  The files that comes with your compiler.\n\n●         You request\
    \ to use a header file in your program by including it with the C preprocessing\
    \ directive #include , like you have seen inclusion of stdio.h  header file, which\
    \ comes along with your compiler.●         Including a header file is equal to\
    \ copying the content of the header file but we do not do it because it will be\
    \ error-prone and it is not a good idea to copy the content of a header file in\
    \ the source files, especially if we have multiple source files in a program.●         \
    \ Both the user and the system header files are included using the preprocessing\
    \ directive #include . It has the following two forms.​ ​​ #include <file>This\
    \ form is used for system header files. It searches for a file named 'file' in\
    \ a standard list of system directories.​​​ #include \"file\"It searches for a\
    \ file named 'file' in the directory containing the current file.Writing Of Single\
    \ And Multiple Uses Of Header Files:In case, when a header file needs to be included\
    \ twice within your program, your compiler will be going to process the contents\
    \ inside it - twice which will eventually lead to an error in your program. So\
    \ to eliminate this, you have to use conditional preprocessor directives.Syntax:#ifndef\
    \ HEADER_FILE_NAME#define HEADER_FILE_NAMEthe entire header file#endifMultiple\
    \ conditional preprocessors can be used like this:Syntax:#if FIRST_SYSTEM#include\
    \ \"sys.h\"#elif SEC_SYSTEM#include \"sys2.h\"#elif THRID_SYSTEM....#endifFor\
    \ example, I am calling an external function named swap in my main.c file.Example:#include<stdio.h>#include\"\
    swap.h\"void main(){int a=10;int b=30;swap (&a,&b);printf (\"a=%d\\n\", a);printf\
    \ (\"b=%d\\n\",b);}Swap method is defined in swap.h  file, which is used to swap\
    \ two numbers by using a temporary variable.Example:void swap (int* a, int* b){  int\
    \ tmp;tmp = *a;*a = *b;*b = tmp;}Question: Write a about C Preprocessor?Answer:The C\
    \ Preprocessor is not a part of the compiler, but is a separate step in the compilation\
    \ process. All preprocessor commands begin with a hash symbol (#). It must be\
    \ the first non blank character, and for readability, a preprocessor directive\
    \ should begin in the first column. The following section lists down all the important\
    \ preprocessor directives:\n\n|  \n\n19.  No\n\n | Directive | Description |\n\
    \n| 1 | #define | Substitutes a preprocessor macro. |\n\n| 2 | #include | Inserts\
    \ a particular header from another file. |\n\n| 3 | #undef | Undefines a preprocessor\
    \ macro. |\n\n| 4 | #ifdef | Returns true if this macro is defined. |\n\n| 5 |\
    \ #ifndef | Returns true if this macro is not defined |\n\n| 6 | #if | Tests if\
