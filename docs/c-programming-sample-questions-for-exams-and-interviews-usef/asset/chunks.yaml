    How to do Input/Output Operations in a File?](#text00014.html_a5RJ)1\. What is
    Problem Solving ?1.1 What are the Problem Solving Tools?In order to solve any
    problem the following should be done. They are:1)       Problem definition phase2)      
    Getting started on a problem3)       Use of specific examples4)       Similarities
    among problem5)       Working backwards from solution6)       General problem-solving
    strategies1)      Problem definition phase: Initially the problem should be identified
    from the given question required by the user.2)      Getting started on a problem:
    Based on the problem we should identify the requirements.3)      Use of specific
    examples: Consider a simple example for the given problem and solve it.4)     
    Similarities among problem: Based on the examples identify the similarities and
    identify a solution to solve a large number of problems.5)      Working backwards
    from solution: After identification of the solution we have to check if it correct
    or not.6)      General problem-solving strategies: Steps involved in the problem
    solving process are shown as following.


    1.  Become aware of the problem


    2.  Define the problem


    3.  Choose the particular problem to be solved


    4.  Identify potential solutions


    5.  Evaluate the valid potential solutions to select the best one.


    6.  Develop an action plan to implement the best solution


    1.2 What are the Problem Solving Techniques?Procedure to Solve a Problem (Steps
    Involved in Problem Solving):​ A computer cannot solve a problem on its own. One
    has to provide step by step solutions of the problem to the computer. In fact,
    the task of problem solving is not that of the computer. It is the programmer
    who has to write down the solution to the problem in terms of simple operations
    which the computer can understand and execute.​ In order to solve a problem by
    the computer, one has to pass though certain stages or steps. They are


    1.  Understanding the problem


    2.  Analyzing the problem


    3.  Developing the solution


    4.  Coding and implementation.'
