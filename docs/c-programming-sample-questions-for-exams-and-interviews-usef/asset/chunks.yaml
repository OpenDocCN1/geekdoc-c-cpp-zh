    \ for constants to increase readability.\n\n```\n#include <stdio.h>\n#include\
    \ \"myheader.h\"\n```\n\nThese directives tell the CPP to get `<stdio.h>` from\
    \ System Libraries and add the text to the current source file. The next line\
    \ tells CPP to get `\"myheader.h\"` from the local directory and add its content\
    \ to the current source file.\n\n```\n#undef FILE_SIZE\n#define FILE_SIZE 32\n\
    ```\n\nIt tells the CPP to undefine existing `FILE_SIZE` and define it as 32。\n\
    \n```c\n#ifndef MESSAGE\n#define MESSAGE \"You wish!\"\n#endif\n```\n\n**EXAMPLE\
