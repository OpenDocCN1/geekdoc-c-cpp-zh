  raw: '1\. Understanding the problem: Here we try to understand the problem to be
    solved in totally. Before with the next stage or step, we should be absolutely
    sure about the objectives of the given problem.2. Analyzing the problem: After
    understanding thoroughly the problem to be solved, we look different ways of solving
    the problem and evaluate each of these methods. The idea here is to search an
    appropriate solution to the problem under consideration. The end result of this
    stage is a broad overview of the sequence of operations that are to be carries
    out to solve the given problem.3\. Developing the solution : Here the overview
    of the sequence of operations that was the result of analysis stage is expanded
    to form a detailed step by step solution to the problem under consideration.4\.
    Coding and implementation: The last stage of the problem solving is the conversion
    of the detailed sequence of operations in to a language that the computer can
    understand. Here each step is converted to its equivalent instruction or instructions
    in the computer language that has been chosen for the implantation.1.3 How the
    Computer Acts as a Problem Solving Tool?Question: What is the need for programming
    language?Answer:If we want the computer to solve the problem any number of times
    we need a programming language. Computer can repeatedly solve the problem any
    number of times. If we have to tell the computer to repeatedly solve the problem
    any number of times.Question: What is a Problem?Answer:A Problem is an obstacle
    which makes it difficult to achieve a desired goal, objective or purpose.Question:
    What is Problem Solving?Answer:Every problem in the real world needs to be identified
    and solved. Trying to find a solution to a problem is known as problem solving.Question:
    How to Solve a Problem?Answer:If you have a problem you can solve it manually
    or solve the problem using a computer.Question: What is computer? Explain parts
    of computer?Answer:Computer is a device capable of performing computations and
    making logical decisions at speed of millions and even billions of times faster
    than human being can.OrComputer is an electronics device which performs arithmetic
    and logical operations.A computer system made of two major components. They are:1\.
    Software2\. Hardware.The hardware component of the computer system consists of
    five parts: input devices, central processing unit (CPU), primary storage, output
    devices, and auxiliary storage devicesThe input device is usually a keyboard where
    programs and data are entered into the computers. Examples of other input devices
    include a mouse, a pen or stylus, a touch screen, or an audio input unit.The central
    processing unit (CPU ) is responsible for executing instructions such as arithmetic
    calculations,comparisons among data, and movement of data inside the system. Today’s
    computers may have one ,two, or more CPU’s .Primary storage which is also known
    as main memory, is a place where the programs and data are stored temporarily
    during processing. The data in primary storage are erased when we turn off a personal
    computer or when we log off from a time-sharing system.The output device is usually
    a monitor or a printer to show output. If the output is shown on the monitor,
    we say we have a soft copy . If it is printed on the printer, we say we have a
    hard copy.Auxiliary storage , also known as secondary storage , is used for both
    input and output. It is the place where the programs and data are stored permanently.
    When we turn off the computer, or programs and data remain in the secondary storage,
    ready for the next time we need them.Question: What is a Computer Software?Answer:Computer
    software is divided in to two broad categories: system software and application
    software .System software manages the computer resources .It provides the interface
    between the hardware and the users. Application software, on the other hand is
    directly responsible for helping users solve their problems.Question: What is
    the need of software?Answer:The need of software is to implement any specific
    task in a computer i.e. if you want to solve your problem through computer, then
    you have to develop software according to your problem and you have to install
    that software in your system. Then your system is ready to serve your requirement.Note:
    Generally softwares are developed by using computer programming languages like
    C, C++, JAVA, .NET etc.Question: What is SOFTWARE? Explain types of software?Answer:The
    software is the collection of programs that allow the hardware to do its job.
    Computer software is divided into two broad categories.a)       System Softwareb)      
    Application softwarea)    SYSTEM SOFTWARESystem software consists of programs
    that manage the hardware resources from computer and perform required information
    processing tasks. These programs are divided into 3 classes.


    1.  The operating system


    2.  System support


    3.  System development.


    a)    APPLICATION SOFTWARE:Application software is broken into two classes.1)      
    General purpose software2)       Application specific softwareGeneral purpose
    software is purchased from a software developer and can be used for more than
    one word application processors. Data base management system etc.Application specific
    software can be used only for its intended purpose.A general ledger system used
    by accountant and a material requirement. Planning system used by a manufacturing
    organization are the examples of application specific software.1.4 What are the
    Programming languages ?Question: What is a programming language?Answer:A programming
    language is an artificial language designed to communicate instructions to a machine,
    particularly a computer. Programming languages can be used to create programs
    that control the behavior of a machine and/or to express algorithms precisely.A
    programming language is usually split into the two components of syntax (form)
    and semantics (meaning). Some languages are defined by a specification document.               To
    write a program for a computer we must use a computer language. A summary of computer
    languages as shown belowQuestion: What is a Machine Level Language?Answer:


    1.  Machine level language has been introduced in 1940’s.


    2.  The only language understood by computer is machine level language.


    3.  Each computer has its own machine language, which is made streams of Os and
    1’s because the internal circuits of a computer are made of switches, transistors
    and other electronic devices that can be in one of two states off and on.


    4.  In this the off state is represented by “O” and the on state is represented
    by 1.


    Question: What are the Advantages Of Machine Level Language?Answer:


    1.  Machine level language easily understood by the CPU.


    2.  The time taken for executing the program is very less.


    3.  The execution speed is very high because of machine instructions are directly
    understood by the CPU and no translation of the program is required.


    Question: What are the Disadvantages of Of Machine Level Language?Answer:


    1.  It is machine dependent language.


    2.  Length of the program is very high so difficult to modify.


    3.  Machine language is difficult to program. It is necessary for the programmer
    either to memorize the dozens of code numbers.


    4.  Difficult to check the errors


    Question: What Is a Symbolic Level Language?Answer:


    1.  Symbolic level language has been introduced in 1950’s.


    2.  Symbolic language uses symbols or mnemonics to represent the various machine
    language instructions. It is developed by admiral grace happen in the early 1950s.


    3.  It is also called as Assembly level language.


    4.  Computer does not understand symbolic language. So it must be translated to
    the machine language.


    5.  A special program called as assembler translates symbolic code into machine
    language.


    Question: What are the Advantages Of Symbolic Level Language?Answer:


    1.  It is easier to understand and use.'
