  raw: '11.2 How to do Input/Output Operations in a File?In the above table we have
    discussed about various file I/O functions to perform reading and writing on file.
    getc() and putc() are the simplest functions which can be used to read and write
    individual characters to a file.C fputc() and fgetc():Writing File : fputc() functionThe
    fputc() function is used to write a single character into file. It outputs a character
    to a stream.Syntax:int fputc(int c, FILE *stream) Reading File : fgetc() functionThe
    fgetc() function returns a single character from the file. It gets a character
    from the stream. It returns EOF at the end of file.Syntax:int fgetc(FILE *stream)PROGRAM:#include<stdio.h>void
    main(){FILE *fp;char ch;fp = fopen("one.txt", "w");printf("Enter data...");while(
    (ch = getchar()) != EOF){putc(ch, fp);}fclose(fp);fp = fopen("one.txt", "r");while(
    (ch = getc(fp)! = EOF)printf("%c",ch);// closing the file pointerfclose(fp);}The
    above program prints the contents entered in file one.txt.Closing File: fclose()The
    fclose() function is used to close a file. The file must be closed after performing
    all the operations on it.The syntax of fclose() function is given below:int fclose(
    FILE *fp ); Here fclose() function closes the file and returns zero on success,
    or EOF if there is an error in closing the file. This EOF is a constant defined
    in the header file stdio.h.C fputs() and fgets()The fputs() and fgets() in C programming
    are used to write and read string from stream. Let''s see examples of writing
    and reading file using fgets() and fgets() functions.Writing File : fputs() functionThe
    fputs() function writes a line of characters into file. It outputs string to a
    stream.Syntax:int fputs(const char *s, FILE *stream)  PROGRAM:#include<stdio.h>#include<conio.h>void
    main(){FILE *fp;clrscr();fp=fopen("myfile2.txt","w");fputs("hello c programming
    language",fp); fclose(fp);getch();}OUTPUT:hello c programming languageReading
    File : fgets() functionThe fgets() function reads a line of characters from file.
    It gets string from a stream.Syntax:char* fgets(char *s, int n, FILE *stream) PROGRAM:#include<stdio.h>#include<conio.h>void
    main(){FILE *fp;char text[300];clrscr();   fp=fopen("myfile2.txt","r");printf("%s",fgets(text,200,fp));fclose(fp);getch();}OUTPUT:hello
    c programmingC fseek() functionThe fseek() function is used to set the file pointer
    to the specified offset. It is used to write data into file at desired location.Syntax:int
    fseek(FILE *stream, long int offset, int whence) There are 3 constants used in
    the fseek() function for whence:a)       SEEK_SETb)       SEEK_CURc)        SEEK_END.PROGRAM:#include
    <stdio.h>void main(){FILE *fp;  fp = fopen("myfile.txt","w+");fputs("This is C
    program", fp);fseek( fp, 7, SEEK_SET );fputs("my programming language", fp);fclose(fp);}OUTPUT:This
    is my programming languageQuestion: What are the difference between Text File
    and Binary FileAnswer:


    | Text File | Binary File |


    | 1)    Bits represent character.. | 1)   Bits represent a custom data. |


    | 2)   Less prone to get corrupt as changes reflect as soon as the file is opened
    and can easily be undone. | 2) Can easily get corrupted, even a single bit change
    may corrupt the file. |


    | 3)   Can store only plain text in a file. | 3) Can store different types of
    data (image, audio, text) in a single file. |


    | 4)   Widely used file format and can be opened using any simple text editor.
    | 4) Developed especially for an application and may not be understood by other
    applications. |


    | 5)   Mostly .rtf and .txt are used as extension as text files. | 5) Can have
    any application defined extension. |


    Question: What are Formatted Input/Output Operations?Answer:Input means to provide
    the program with some data to be used in the program and Output means to display
    data on screen or write the data to a printer or a file.C programming language
    provides many built-in functions to read any given input and to display data on
    screen when there is a need to output the result.scanf() and printf() functions:The
    standard input-output header file, named stdio.h contains the definition of the
    functions printf() and scanf(), which are used to display output on screen and
    to take input from user respectively.PROGRAM:#include<stdio.h>void main(){int
    i;printf("Please enter a value...");scanf("%d", &i);printf( "\nYou entered: %d",
    i);}OUTPUT:Please enter a value…5You entered:5When you will compile the above
    code, it will ask you to enter a value. When you will enter the value, it will
    display the value you have entered on screen.You must be wondering what is the
    purpose of %d inside the scanf() or printf() functions. It is known as format
    string and this informs the scanf() function, what type of input to expect and
    in printf() it is used to give a heads up to the compiler, what type of output
    to expect.


    | Format String | Meaning |


    | %d | Scan or Print an integer as a single decimal number |


    | %f | Scan or Print a floating point number |


    | %c | To scan or print a Character |


    | %s | To scan or print a character string. The scanning ending at white space.
    |


    We can also limit the number of digits or characters that can be input or output,
    by adding a number with the format string specifier, like "%1d" or "%3s", the
    first one means a single numeric digit and the second one means 3 characters,
    hence if you try to input 42, while scanf() has "%1d", it will take only 4 as
    input. Same is the case for output.getchar() & putchar() functions:❖         
    The getchar() function reads a character from the terminal and returns it as an
    integer. This function reads only single character at a time. You can use this
    method in a loop in case you want to read more than one character.❖          The
    putchar() function displays the character passed to it on the screen and returns
    the same character. This function too displays only a single character at a time.
    In case you want to display more than one characters, use putchar() method in
    a loop.PROGRAM:#include <stdio.h>void main( ){int c;printf("Enter a character:");c
    = getchar();printf(“Entered character:”);putchar(c);}OUTPUT:Enter a character:kEntered
    character:kgets() & puts() functions:❖          The gets() function reads a line
    from stdin(standard input) into the buffer pointed to by str pointer, until either
    a terminating newline or EOF (end of file) occurs.❖           The puts() function
    writes the string str and a trailing newline to stdout.PROGRAM:#include<stdio.h>void
    main(){char str[100];printf("Enter a string:");gets( str );printf(“Entered string:”);puts(
    str );getch();}OUTPUT:Enter a string:rashmiEntered string:rashmiWhen you will
    compile the above code, it will ask you to enter a string. When you will enter
    the string, it will display the value you have entered.Difference between scanf()
    and gets():➢          The main difference between these two functions is that
    scanf() stops reading characters when it encounters a space, but gets() reads
    space as character too.➢          If you enter name as Rashmi Devi using scanf()
    it will only read and store Rashmi and will leave the part after space. But gets()
    function will read it completely.OTHER BOOKS BY AUTHOR:![](Image00055.jpg)'
