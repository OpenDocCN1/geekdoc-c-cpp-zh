  raw: '1.  In this approach, first, we develop and test most important module.


    2.  This approach is easy to see the progress of the project by developer or customer.


    3.  Using this approach, we can utilize computer resources in a proper manner
    according to the project.


    4.  Testing and debugging is easier and efficient.


    5.  In this approach, project implementation is smoother and shorter.


    6.  This approach is good for detecting and correcting time delays.


    Example for top down approach is shown below.![](Image00011.jpg)Fig. 1.4: Top
    down approach example2\. How to Write C Program ?Question: What are the advantages
    of C language?Answer:Advantages of C are shown below.


    1.  C is Portable: This means a program written for one computer may run successfully
    on other computer also.


    2.  C is fast: This means that the executable program obtained after compiling
    and linking runs very fast.


    3.  C is compact: The statements in C Language are generally short but very powerful.


    4.  Simple / Easy: The C Language has both the simplicity of High Level Language
    and speed of Low Level Language. So it is also known as Middle Level Language


    5.  C has only 32 Keywords


    6.  C Compiler is easily available


    7.  C has ability to extend itself. Users can add their own functions


    2.1 How the Structure of C program look like?The program written in C language
    follows this basic structure. The sequence of sections should be as they are in
    the basic structure. A C program should have one or more sections but the sequence
    of sections is to be followed.1\. Documentation section2\. Linking section3\.
    Definition section4\. Global declaration section5\. Main function section{Declaration
    sectionExecutable section}6\. Sub program or function section1.    DOCUMENTATION
    SECTION : comes first and is used to document the use of logic or reasoning your
    program. It can be used to write the program''s objective, developer and logic
    details.The documentation is done in C language with /* and */ . Whatever is written
    between these two are called comments.2.    LINKING SECTION : This section tells
    the compiler to link the certain occurrences of keywords or functions in your
    program to the header files specified in this section.Example:  #include <stdio.h>3.
       DEFINITION SECTION : It is used to declare some constants and assign them some
    value.e.g. #define MAX 25Here #define is a compiler directive which tells the
    compiler whenever MAX is found in the program replace it with 25.4.    GLOBAL
    DECLARATION SECTION : Here the variables which are used through out the program
    (including main and other functions) are declared so as to make them global(i.e
    accessible to all parts of program)e.g. int i; (before main())5.     MAIN FUNCTION
    SECTION : It tells the compiler where to start the execution from                            
    main(){point from execution starts}main function has two sections1\. declaration
    section : In this the variables and their data types are declared.2\. Executable
    section : This has the part of program which actually performs the task we need.TURBO
    C EDITOR:Question: What is IDE?Answer:Turbo c features as integrated Development
    environment, or IDE,. It is also referred to as the programmer’s platform.) in
    IDE you can able to write/save/open your programs or code, compile using short
    cut keys, and also perform code debugging very easily.Question: What is turbo
    c editor?Answer:It is a compiler of C program and it can be also used as a general
    editor. To enter into editor first change into the directory this contains the
    software and enters the command TC at the command prompt.C:\> CD TCC:\TC> tcThen
    it opens the editor which contains a menu bar at the top, a status bar at the
    bottom and a main window to write the programming statements and a sub window
    which shows the messages.The menu bar contains some menu pads and they can be
    selected by pressing ALT and the highlighted character in the required menu pad.Then
    it shows the sub menu which contains some bars and they can be selected using
    arrow keys.The status bar shows online help and the keys information.1)   To write
    a new program selects ‘New’ command from “File” menu.2)   To save the working
    program select ‘Save’ command from “File” menu.Or press F2 and enter a name.3)  
    To compile the program select ‘Compile to OBJ’ command from “compile” menu or
    press Alt + F9\. Then it shows the list of Errors or warnings. If the program
    is error-free then the compiler Creates an object file (.OBJ) and an executable
    file (.EXE).4) To execute the program select ‘Run’ command from “Run” menu or
    press Ctrl + F9.5) To see the output of the execution select ‘User Screen’ command
    from “Run” menu or press Alt + F5.6) To close the editor select ‘Quit’ command
    from “File” menu or press Alt + X.Common Short cut Keys Description:F2 press to
    Save current workF3 press to open an existing fileALT-F3 press to close currentALT-F9
    press to compile onlyALT-F5 press to view the desired output of the program.CTRL-F9
    press to compile+runALT-X or ALT-F-X press to exit from TC IDE2.3 What are the
    Basic Data Types?Question: What do mean by data type?Answer:


    ​ Data types reserves space for data. A data type defines for which type of data
    how much memory to be allocated.


    1.  Type


    2.  Size


    Question: What are the different data types?Answer: There are five data types


    1.  Primary data types


    2.  Extended data types


    3.  Derived data types


    4.  User defined data type


    5.  Null data type


    1.  Primary Data Types:


    Primary data types include integer data type, floating point data type and character
    data types.Integer Data Type:Keyword:  intMemory size​ :  2 bytesRange:  -215
    to -215 -1Signed:  -32,768 to 32,767Control String:  %dUnsigned:  0 to 216 -1: 
    0 to 65,535Floating Point Data Type:Keyword:  floatMemory rage:  4 bytes (32)
    bitsRange:  -3276999 to 3276998Control String:  %fCharacter Data Type:Keyword:  charMemory
    Size:  1 byteRange:  -128 to 127 (ASCII code)Control String:  %cNote: every character
    should denote between in single quotations (‘a’)ASCII: The American Standard Code
    for Information Interchange (ASCII) is a character-encoding scheme based on the
    ordering of the English alphabet. ASCII codes represent text in computers, communications
    equipment, and other devices that use text. Most modern character-encoding schemes
    are based on ASCII, though they support many more characters than ASCII does.For
    example ASCII code for character A is 65.​


    2.  Extended Data Types:


    The extended data types includes the following.i)    Long Integer Data Type:Keyword:  long
    intMemory Size:  4 bytes (32) bitsControl String:  %ldii)    Double Data Type:Keyword:  doubleMemory
    Size:  8 bytesControl String:  %lf


    3.  Derived data types:


    The derived data types are again classified as shown below.1) Arrays2) structures3)
    pointers4) Unions4\. User defined data type:The classification of user defined
    data types are shown below.1\. Functions2\. Typedef3\. Enum5\. Null data type:Using
    the key word: voidQuestion: What are all the predefined data type ranges?Answer:Predefined
    data type ranges are:


    | Type | Typical Size in bits | Minimal Range |


    | char | 8 | -128 to 127 |


    | unsigned char | 8 | 0 to 255 |


    | signed char | 8 | -128 to 127 |


    | short int | 16 | -32,768 to 32,767 |


    | unsigned short int | 16 | 0 to 65535 |


    | signed short int | 16 | -32,768 to 32,767 |


    | long int | 32 | -2,147,483,647 to 2,147,483,647 |


    | long long int | 64 | -(263 ) to 263 -1 |


    | signed long int | 32 | -2,147,483,647 to 2,147,483,647 |


    | unsigned long int | 32 | 0 to 4,294,967,295 |


    | unsigned long long int | 64 | 264 -1 |


    | float | 32 | 3.4e-38 to 3.4e+38 |


    | double | 64 | 1.7e-308 to 1.7e+308 |


    | long double | 80 | 3.4e-4932 to 1.1e+4932 |


    | void | - | data type that do not return any value |'
