  raw: 'Preprocessors ExamplesAnalyze the following examples to understand various
    directives.#define MAX_ARRAY_LENGTH 10This directive tells the CPP to replace
    instances of MAX_ARRAY_LENGTH with 10\. Use #define for constants to increase
    readability.#include <stdio.h>#include "myheader.h"These directives tell the CPP
    to get stdio.h from System Libraries and add the text to the current source file.
    The next line tells CPP to get myheader.h from the local directory and add the
    content to the current source file.#undef  FILE_SIZE#define FILE_SIZE 32It tells
    the CPP to undefine existing FILE_SIZE and define it as 32.#ifndef MESSAGE#define
    MESSAGE  "You wish!"#endifEXAMPLE C PROGRAM:#include<stdio.h>#define PI 3.14void
    main(){printf(“PI value is %f”,PI);}Question: Write a C program to Pass One Dimensional
    Array to Function?PROGRAM:// Program to calculate the sum of array elements by
    passing to a function#include <stdio.h>float calculateSum(float age[]);int main()
    {float result, age[] = {23.4, 55, 22.6, 3, 40.5, 18};// age array is passed to
    calculateSum()result = calculateSum(age);printf("Result = %.2f", result);return
    0;}float calculateSum(float age[]) {float sum = 0.0;for (int i = 0; i < 6; ++i)
    {sum += age[i];}return sum;}OUTPUT:Result = 162.50Question: Write a C program
    to Pass Two Dimensional Array to Function ?PROGRAM:#include <stdio.h>void displayNumbers(int
    num[2][2]);int main(){int num[2][2];printf("Enter 4 numbers:\n");for (int i =
    0; i < 2; ++i)for (int j = 0; j < 2; ++j)scanf("%d", &num[i][j]);/* passing multi-dimensional
    array to a function*/displayNumbers(num);return 0;}void displayNumbers(int num[2][2]){printf("Displaying:\n");for
    (int i = 0; i < 2; ++i) {for (int j = 0; j < 2; ++j) {printf("%d\n", num[i][j]);}}}OutputEnter
    4 numbers:2346Displaying:23467\. What are Pointers?Pointers store address of variables
    or a memory location.Syntax:datatype *var_name;Example:int *ptr;![](Image00039.jpg)Fig.
    7.1: Pointers working in CTo use pointers in C, we must understand below two operators.To
    access address of a variable to a pointer, we use the unary operator & (ampersand)
    that returns the address of that variable. For example &x gives us address of
    variable x.PROGRAM:#include <stdio.h>int main(){int x;// Prints address of xprintf("%p",
    &x);return 0;}To access the value stored in the address we use the unary operator
    (*) that returns the value of the variable located at the address specified by
    its operand.PROGRAM:#include <stdio.h>int main(){int Var = 10;int *ptr = &Var;printf("Value
    of Var = %d\n", *ptr);printf("Address of Var = %p\n", ptr);*ptr = 20; // Value
    at address is now 20printf("After doing *ptr = 20, *ptr is %d\n", *ptr);return
    0;}OUTPUT:Value of Var = 10Address of Var = 0x7fffa057dd4After doing *ptr = 20,
    *ptr is 20Below is pictorial representation of above program:![](Image00040.jpg)Fig.
    7.2: Pointer variable and addressPointer Expressions and Pointer Arithmetic


    A limited set of arithmetic operations can be performed on pointers. A pointer
    may be:incremented ( ++ )decremented ( — )an integer may be added to a pointer
    ( + or += )an integer may be subtracted from a pointer ( – or -= )Pointer arithmetic
    is meaningless unless performed on an array.PROGRAM:#include <stdio.h>int main(){int
    v[3] = {10, 100, 200};int *ptr;// Assign the address of v[0] to ptrptr = v;for
    (int i = 0; i < 3; i++){printf("Value of *ptr = %d\n", *ptr);printf("Value of
    ptr = %p\n\n", ptr);ptr++;}}OUTPUT:Output:Value of *ptr = 10Value of ptr = 0x7ffcae30c710Value
    of *ptr = 100Value of ptr = 0x7ffcae30c714Value of *ptr = 200Value of ptr = 0x7ffcae30c718   ![](Image00041.jpg)Fig.
    7.3: Pointer Arithmetic7.1 What are the Pointers And Function Arguments?C programming
    allows passing a pointer to a function. To do so, simply declare the function
    parameter as a pointer type.Question:Write a C program to implement Pointers and
    Function Arguments?PROGRAM:#include <stdio.h>double getAverage(int *arr, int size);int
    main (){int balance[5] = {1000, 2, 3, 17, 50};double avg;avg = getAverage( balance,
    5 ) ;printf("Average value is: %f\n", avg );return 0;}double getAverage(int *arr,
    int size){int  i, sum = 0;      double avg;         for (i = 0; i < size; ++i)
    {sum += arr[i];}avg = (double)sum / size;return avg;}OUTPUT:Average value is:
    214.400000PASSING ARGUMENTS BY ADDRESS:There is one more way to pass variables
    to functions, and that is by address. Passing an argument by address involves
    passing the address of the argument variable rather than the argument variable
    itself. Because the argument is an address, the function parameter must be a pointer.
    The function can then dereference the pointer to access or change the value being
    pointed to.7.2 What is Dangling Memory?Question: What is Dangling Pointer or Dangling
    Memory with Cause and How to avoid it?Answer:Dangling pointers in computer programming
    are pointers that pointing to a memory location that has been deleted (or freed).Dangling
    pointers arise during object destruction, when an object that has an incoming
    reference is deleted or deallocated, without modifying the value of the pointer,
    so that the pointer still points to the memory location of the deallocated memory.
    The system may reallocate the previously freed memory, unpredictable behavior
    may result as the memory may now contain completely different data.![](Image00042.jpg)Fig.
    7.4: Dangling Pointer (or) Dangling MemoryQuestion: What is the Cause of Dangling
    Pointers?Answer:1)       Return Local Variable in Function Call2)       Variable
    goes out of scope3)       De-allocating or free variable memory


    1.  Return Local Variable in Function Call


    PROGRAM:#include<stdio.h>#include<string.h>char *getHello(){char str[10];strcpy(str,"Hello!");return(str);}int
    main(){/*str falls out of scopefunction call char *getHello() is now a dangling
    pointer */printf("%s", getHello());}Here we are returning an address which was
    a local variable (str), which would have gone out of scope by the time control
    was returned to the calling function.Attempts to read from the pointer may still
    return the correct value (Hello!) for a while after calling function getHello(),
    but any functions called thereafter will overwrite the stack storage allocated
    for str with other values and the pointer would no longer work correctly. If a
    pointer to str must be returned, str must have scope beyond the function—it might
    be declared as static.


    2.  Variable goes out of scope


    PROGRAM:#include<stdio.h>int main(){char **strPtr{char *str = "Hello!";strPtr
    = &str;}/* str falls out of scopestrPtr is now a dangling pointer*/printf("%s",
    *strPtr);}As str character pointer is non-visible in Outer Block , then character
    pointer to pointer strPtr is still pointing to same invalid memory location in
    Outer block , then character pointer to pointer strPtr becomes "Dangling Pointer".


    3.  De-allocating or free variable memory'
