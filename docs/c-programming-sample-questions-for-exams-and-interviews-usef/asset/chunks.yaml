    # 2.4 什么是 C 令牌 (Tokens)？


    **问题：** 什么是令牌（token）？请解释 C 语言中令牌的类型。


    **答案：**

    `C` 程序的最小独立单元被称为**令牌 (Tokens)**。基本上，`C` 令牌分为四类：

    1. 关键字 (Keywords)

    2. 标识符 (Identifiers)

    3. 常量 (Constants)

    4. 运算符 (Operators)


    ---


    ## 问：什么是关键字 (Keyword)？


    **答案：**

    关键字是预定义的单词，其含义已经向“C”编译器进行了说明和解释。这些关键字也被称为保留字（reserved words）。

    标准 `C` 语言中共有 32 个关键字：


    ```

    auto, break, case, char, const , continue , default , do,

    double , else , enum extern float far for goto if int long near register short
    ,

    return signed static struct switch typedef union void unsigned while .

    ```


    - 这 32 个关键字（实际上）存在于所有版本中；某些关键字可能会根据编译器/库而略有不同。

    - 所有关键字必须完全使用小写字母。

    - 我们无法向这些关键字添加任何内容——它们完全由每个实现标准的标准机构固定，这些标准机构依赖它们形成集成课程或指令，并严格遵循附带严厉规则的 ISO/ANSI
    有效文档（这些文档自每个新草案委员会发布更新后就在在线广泛发布，主要是因为没有人希望在开发阶段自发地产生不同的方言，因此确切知道通过正确理解此前提供的相关假设内容可以自由组合会更有保障）。


    （注：后续部分为随机单词列表，跳过翻译。）


