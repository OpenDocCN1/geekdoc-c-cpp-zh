    \ |\n| 18   | `strpbrk()`    | **Searches the first occurrence of a character\
    \ in a given string and then it displays the string starting from that character.**\
    \ |\n\n### `strlen()`\n\n此函数返回一个整数值，即某个字符串变量中字符的数量。\n**语法：**`strlen(variable);`\n\
    **程序示例：**\n```c\n#include<string.h>\n#include<conio.h>\nvoid main()\n{\nchar str[20];\
