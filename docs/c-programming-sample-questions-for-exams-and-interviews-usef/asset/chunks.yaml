  raw: 'Creating and running programs:●          The software used to write programs
    is as a text editor.●          The file created from a text editor is known as
    a source file.●         The code in a source file must be translated into machine
    languages using the ‘c’ compiler, which is made of two separate programs they
    are the preprocessor and the translator.●          The file created from the compiler
    is known as an object module.●          An object module is linked to the standard
    functions necessary for running the program by the linker.![](Image00002.jpg)Fig.
    1.1: Creation and Running of a C Program●         Linker generates new code called
    executable code i.e the code which is having the functionality of the application
    that code is called as executable code.●          Executable code given to the
    runner or loader which will give the final result of our application.Consider
    a C program (or) source code named name.c is compiled through a compiler like
    Turbo C compiler, it will be converted to an object file named name.obj . Linker
    links the library functions and converts the name.obj to name.exe file, then finally
    loader executes the program to get the output as a result.1.6 What is an Algorithm?Definition:
    Step by step procedure to solve a particular problem is called as an algorithm.​
    A set of sequential steps usually written in Ordinary Language to solve a given
    problem is called Algorithm.​ It may be possible to solve to problem in more than
    one ways, resulting in more than one algorithm. The choice of various algorithms
    depends on the factors like reliability, accuracy and easy to modify. The most
    important factor in the choice of algorithm is the time requirement to execute
    it, after writing code in High-level language with the help of a computer. The
    algorithm which will need the least time when executed is considered the best.Question:
    What are the steps involved in algorithm development?Answer:​ An algorithm can
    be defined as “a complete, unambiguous, finite number of logical steps for solving
    a specific problem“.Step 1: Identification of input: For an algorithm, there are
    quantities to be supplied called input and these are fed externally. The input
    is to be identified first for any specified problem.Step 2: Identification of
    output: From an algorithm, at least one quantity is produced, called for any specified
    problem.Step 3: Identification the processing operations: All the calculations
    to be performed in order to lead to output from the input are to be identified
    in an orderly manner.Step 4: Processing Definiteness: The instructions composing
    the algorithm must be clear and there should not be any ambiguity in them.Step
    5: Processing Finiteness: If we go through the algorithm, then for all cases,
    the algorithm should terminate after a finite number of steps.Step 6: Possessing
    Effectiveness: The instructions in the algorithm must be sufficiently basic and
    in practice they can be carries out easily.Question: What are the features of
    algorithm (or) characteristics of good algorithm?Answer:An algorithm must possess
    the following properties1\. Finiteness: An algorithm must terminate in a finite
    number of steps2\. Definiteness: Each step of the algorithm must be precisely
    and unambiguously stated3\. Effectiveness: Each step must be effective, in the
    sense that it should be primitive easily convert able into program statement)
    can be performed exactly in a finite amount of time.4\. Generality: The algorithm
    must be complete in itself so that it can be used to solve problems of a specific
    type for any input data.5\. Input/output: Each algorithm must take zero, one or
    more quantities as input data produce one or more output values.An algorithm can
    be written in English like sentences or in any standard representation sometimes,
    algorithm written in English like languages are called Pseudo Code.EXAMPLE 1:
    Suppose we want to find the average of three numbers, the algorithm is as followsStep
    1: Read the numbers a, b, cStep 2 :Compute the sum of a, b and cStep 3 :Divide
    the sum by 3Step 4:Store the result in variable dStep 5:Print the value of dStep
    6: StopEXAMPLE 2: Write an algorithm for Write an algorithm to calculate the simple
    interest using the formula. Simple interest = P*N* R/100.Where P is principle
    Amount, N is the number of years and R is the rate of interest.Step 1: Read the
    three input quantities P, N and R.Step 2: Calculate simple interest as Simple
    interest = P* N* R/100Step 3: Print simple interest.Step 4: Stop.EXAMPLE 3: Write
    an algorithm to find the largest of three numbers X, Y,Z.Step 1: Read the numbers
    X,Y,Z.Step 2: if (X > Y) Big = X else BIG = YStep 3 : if (BIG < Z)Step 4: Big
    = ZStep 5: Print the largest number i.e. BigStep 6: Stop.EXAMPLE 4: Write an algorithm
    to calculate the perimeter and area of rectangle. Given its length and width.Step
    1: Read length of the rectangle.Step 2: Read width of the rectangle.Step 3: Calculate
    perimeter of the rectangle using the formula perimeter = 2* (length + width)Step
    4: Calculate area of the rectangle using the formula area = length *width.Step
    5: Print perimeter.Step 6: Print area.Step 7: Stop.EXAMPLE 5: Algorithm/pseudo
    code to add two numbersStep 1: StartStep 2:Read the two numbers in to a,bStep
    3: c=a+bStep 4: write/print cStep 5: Stop.1.7 What is a Flowchart ?Definition:A
    flow chart is a step by step diagrammatic representation of the logic paths to
    solve a given problem. (or) A flowchart is visual or graphical representation
    of an algorithm.​ The flowcharts are pictorial representation of the methods to
    b used to solve a given problem and help a great deal to analyze the problem and
    plan its solution in a systematic and orderly manner. A flowchart when translated
    in to a proper computer language, results in a complete program.Question: What
    are the advantages of Flowcharts?Answer:1\. The flowchart shows the logic of a
    problem displayed in pictorial fashion which felicitates easier checking of an
    algorithm.2\. The Flowchart is good means of communication to other users. It
    is also a compact means of recording an algorithm solution to a problem.3\. The
    flowchart allows the problem solver to break the problem into parts. These parts
    can be connected to make master chart.4\. The flowchart is a permanent record
    of the solution which can be consulted at a later time.Question: What are the
    basic symbols used in flow-charts?Answer:​ The symbols that we make use while
    drawing flowcharts as given below are as per conventions followed by International
    Standard Organization (ISO).1\. Oval: Rectangle with rounded sides is used to
    indicate either START/ STOP of the program.![](Image00003.jpg)2\. Input and output
    indicators : Parallelograms are used to represent input and output operations.
    Statements like INPUT, READ and PRINT are represented in these Parallelograms.![](Image00004.jpg)3\.
    Process Indicators: Rectangle is used to indicate any set of processing operation
    such as for storing arithmetic operations.![](Image00005.jpg)4\. Decision Makers:
    The diamond is used for indicating the step of decision making and therefore known
    as decision box. Decision boxes are used to test the conditions or ask questions
    and depending upon the answers, the appropriate actions are taken by the computer.
    The decision box symbol is![](Image00006.jpg)5\. Flow Lines: Flow lines indicate
    the direction being followed in the flowchart. In a Flowchart, every line must
    have an arrow on it to indicate the direction. The arrows may be in any direction![](Image00007.jpg)6\.
    On- Page connectors: Circles are used to join the different parts of a flowchart
    and these circles are called on-page connectors. The uses of these connectors
    give a neat shape to the flowcharts. Ina complicated problems, a flowchart may
    run in to several pages. The parts of the flowchart on different pages are to
    be joined with each other. The parts to be joined are indicated by the circle.![](Image00008.jpg)7\.
    Off-page connectors: This connector represents a break in the path of flowchart
    which is too large to fit on a single page. It is similar to on-page connector.
    The connector symbol marks where the algorithm ends on the first page and where
    it continues on the second.EXAMPLE 1: Draw a flowchart to add two numbers entered
    by user.![](Image00009.jpg)Fig. 1.2: Flowchart to add two numbers entered by userEXAMPLE
    2: Draw flowchart to find the largest among three different numbers entered by
    user.![](Image00010.jpg)Fig. 1.3: Flowchart to find the largest among three different
    numbers entered by userQuestion: What are the differences between Algorithm and
    Flowchart?Answer:Algorithm is a method of representing the step-by-step procedure
    logically to solve a particular problem, where as a flow chart is a diagrammatic
    representation of an algorithm. It is constructed using different types of boxes
    and symbols. An algorithm consists of step-by-step English descriptions in which
    each step belongs to a particular operation leading to a solution of a problem.
    The flowchart shows the series of blocks and arrows each of which represents a
    particular step in an algorithm. An algorithm is used particularly for small problems
    where as flowchart is used for large problems. For complex problems the algorithm
    had been proved to be inadequate and flowchart is adequate for complex problems.1.8
    What is Top Down Design?A top -down design  is the decomposition of a system into
    smaller parts in order to comprehend its compositional sub-systems.Top Down approach
    in C:In this approach we look at the overall requirement and start coding. We
    build the main function first, then add calls to various functions like add, subtract
    etc... and then display the output. After doing all these we code the individual
    functions for addition, subtraction etc.So what we did here was approached the
    problem by first looking at the overall objective which is the top, then deciding
    when and where to call the functions and eventually going down to the lowest level
    detail of designing the functions themselves, hence it is called the "top-down"
    approach. In this top down approach, a large project divides into small programs,
    and these programs are known as modules.C programming language supports this approach
    for developing projects. It is always good idea that decomposing solution into
    modules in a hierarchy manner.The basic task of a top-down approach is to divide
    the problem into tasks and then divide tasks into smaller sub-tasks and so on.In
    this approach, first we develop the main module and then the next level modules
    are developed. This procedure is continued until all the modules are developed.Question:
    What is the advantages of top-down approach?Answer:'
