- fmt: "\n# Question: What are the Advantages of Structured Programming?\n\nAnswer:\
    \ Why is structured programming so great? There are two important reasons:\n\n\
    1. It's easier to write a structured program, because complex programming problems\
    \ are broken into a number of smaller, simpler tasks. Each task is performed by\
    \ a `function` in which code and `variables` are isolated from the rest of the\
    \ program. You can progress more quickly by dealing with these relatively simple\
    \ tasks one at a time.\n2. It's easier to debug a structured program. If your\
    \ program has a bug (something that causes it to work improperly), a structured\
    \ design makes it easy to isolate the problem to a specific section of code (a\
    \ specific `function`).\n\n# Question: How to write a function? Give it’s description?\n\
    \nAnswer: Syntax:\n```c\nreturn_type function_name (argument_list) {\n    Local\
    \ variable declarations,\n    Executable statement1;\n    Executable statement2;\n\
    \    ...\n    return (expression);\n}\n```\n\n- The first line of every `function`\
    \ is the function header, which has three components, each serving a specific\
    \ function.\n- The function return type specifies the data type that the `function`\
    \ returns to the calling program. The return type can be any of C's data types:\
    \ `char`, `int`, `long`, `float`, or `double`. You can also define a `function`\
    \ that doesn't return a value by using a return type of `void`.\n- You can name\
    \ a `function` anything you like, as long as you follow the rules for C variable\
    \ names.\n- Many functions use arguments, which are values passed to the `function`\
    \ when it's called. A `function` needs to know what kinds of arguments to expect\
    \ i.e. the data type of each argument.\n- You can pass a `function` any of C's\
    \ data types. Argument type information is provided in the function header by\
    \ the parameter list. For each argument that is passed to the `function`, the\
    \ parameter list must contain one entry. This entry specifies the data type and\
    \ the name of the parameter.\n\n### Function Body\nThe function body is enclosed\
    \ in braces, and it immediately follows the function header. It's here that the\
    \ real work is done. When a `function` is called, execution begins at the start\
    \ of the function body and terminates (returns to the calling program) when a\
    \ `return` statement is encountered or when execution reaches the closing brace.\n\
    \n### Function Statements\nThere is essentially no limitation on the statements\
    \ that can be included within a `function`. The only thing you can't do inside\
    \ a `function` is define another `function`. You can, however, use all other C\
    \ statements, including loops, `if` statements, and assignment statements. You\
    \ can call library functions and other user-defined functions.\n\n### Returning\
    \ a Value\nTo return a value from a `function`, you use the `return` keyword,\
    \ followed by a C expression. When execution reaches a `return` statement, the\
    \ expression is evaluated, and execution passes the value back to the calling\
    \ program.\n\nEXAMPLE:\n```c\nreturn 0;\nreturn a;\n```\n\n# Question: What are\
    \ the advantages of functions?\n\nAnswer: The advantages of functions are\n- **Reusability**:\
    \ write the code once and use many times which decreases the size of the program.\n\
    - **Modularity**: dividing problem into small parts (modules) in which each and\
    \ every module having separate operation. Due to this we can easily develop the\
    \ programs and we can easily debug the program.\n- **Efficiency**: Avoid redundant\
    \ instructions which decreases size of the program and increases efficiency.\n\
    \nSome more advantages:\n1. Debugging is easier\n2. It is easier to understand\
    \ the logic involved in the program\n3. Testing is easier\n4. Recursive call is\
    \ possible\n5. Irrelevant details in the user point of view are hidden in functions\n\
    6. Functions are helpful in generalizing the program\n\n# Question: Explain types\
    \ of functions?\n\nAnswer: Basically we have two types of functions.\n\n1. Pre\
    \ defined\n2. User defined.\n\n### 1. PREDEFINED\nA `function` which has own definition\
    \ and comes along with the software is called as predefined functions. Or library\
    \ functions are called as predefined.\nEx: `printf`, `scanf`, `getchar()`, `putchar()`,\
    \ etc.\n- We can’t change the predefine function operation. \n- We can’t modify\
    \ predefined function.\n\n### 2. USER DEFINED\nA `function` which is defined by\
    \ user for a particular purpose is called as user defined functions.\n- User defined\
    \ functions follow the c language functions pre-defined rules.\n- Pre defined\
    \ rules user can’t change.\n- In user defined functions user can implement their\
    \ own operation.\n- User defined functions names and the operations can change\
    \ when user want.\n\nExample:\n```c\nvoid main()\nint abc(int a, int b);\nfloat\
    \ addition(float a, int b);\n```\n\n# Question: What is a function and built-in\
    \ function?\n\nAnswer: A large program is subdivided into a number of smaller\
    \ programs or subprograms. Each subprogram specifies one or more actions to be\
    \ performed for large program. Such subprograms are functions. The `function`\
    \ supports only static and `extern` storage classes. By default, `function` assumes\
    \ `extern` storage class. Functions have global scope. Only `register` or `auto`\
    \ storage class is allowed in the function parameters. Built-in functions that\
    \ predefined and supplied along with the compiler are known as built-in functions.\
    \ They are also known as library functions.\n\n# Question: What are the Parameters?\
    \ Explain types of parameters?\n\nAnswer: In c language parameters are classified\
    \ into two types. They are Actual parameter and Formal parameter (Note: original\
    \ had Formal twice).\n\n1. Actual parameter:\nThe values which are send/pass from\
    \ calling function to called function are called actual parameters are actual\
    \ arguments.\n\n2. Formal parameter:\n"
