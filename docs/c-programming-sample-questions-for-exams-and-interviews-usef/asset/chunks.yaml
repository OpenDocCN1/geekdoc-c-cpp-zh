  trans: "\n\n# 问题：结构化编程有哪些优点？\n\n答案：为什么结构化编程如此出色？有两个重要的原因：\n\n1. 编写结构化程序更简单，因为复杂的编程问题被分解成若干个更小、更简单的任务。每个任务都由一个\
    \ `function` 执行，其中代码和 `variables` 与程序的其余部分隔离开。通过逐个处理这些相对简单的任务，你可以更快速地推进工作。\n2.\
    \ 调试结构化程序更简单。如果你的程序有 bug（导致其运行不正常的问题），结构化设计可以让你很容易将问题定位到代码的特定部分（某个特定的 `function`）。\n\
    \n# 问题：如何编写函数？给出它的描述？\n\n答案：语法：\n```c\nreturn_type function_name (argument_list)\
    \ {\n    Local variable declarations,\n    Executable statement1;\n    Executable\
    \ statement2;\n    ...\n    return (expression);\n}\n```\n\n- 每一个 `function` 的第一行都是函数头，它包含三个部分，每个部分都有特定的功能。\n\
    - 函数返回类型指定了 `function` 返回给调用程序的数据类型。返回类型可以是 C 语言的任何数据类型：`char`、`int`、`long`、`float`\
    \ 或 `double`。你也可以使用 `void` 返回类型定义不返回值的 `function`。\n- 你可以为 `function` 命名，只要符合\
    \ C 变量的命名规则即可。\n- 许多函数使用参数，参数是在调用函数时传递给 `function` 的值。`function` 需要知道期望什么类型的参数，即每个参数的数据类型。\n\
    - 你可以向 `function` 传递 C 语言的任何数据类型。参数类型信息通过函数头的参数列表提供。对于传递给 `function` 的每个参数，参数列表必须包含一个目。该条目指定了参数的数据类型和名称。\n\
    \n### 函数体\n函数体包含在大括号中，紧跟在函数头之后。这是实际工作完成的地方。当 `function` 被调用时，执行从函数体的开始开始，并在遇到\
    \ `return` 语句或执行到结束大括号时终止（返回到调用程序）。\n\n### 函数语句\n对于 `function` 中可以包含的语句基本上没有限制。在\
    \ `function` 内部不能做的事情就是定义另一个 `function`。然而，你可以使用所有其他 C 语句，包括循环、`if` 语句和赋值语句。你可以调用库函数和其他用户定义的函数。\n\
    \n### 返回值\n要从 `function` 返回值，你使用 `return` 关键字，后跟一个 C 表达式。当执行到达 `return` 语句时，表达式会被求值，执行会将值传回调用程序。\n\
    \n示例：\n```c\nreturn 0;\nreturn a;\n```\n\n# 问题：函数有哪些优点？\n\n答案：函数的优点是\n- **可重用性**：编写一次代码多次使用，从而减小程序体积。\n\
    - **模块化**：将问题分成若干部分（模块），每个模块都有独立的操作。由于此此，我们可以轻松地开发程序，也可以轻松地调试程序。\n- **效率**：避免冗余指令，减小程序体积并提高效率。\n\
    \n其他一些优点：\n1. 更容易调试\n2. 更容易理解程序中涉及的逻辑\n3. 测试更容易\n4. 可以进行递归调用\n5. 用户视角下无关的细节被隐藏在函数中\n\
    6. 函数有助于程序的泛化\n\n# 问题：解释函数的类型？\n\n答案：基本上我们有两种类型的函数。\n\n1. 预定义的\n2. 用户定义的\n\n###\
    \ 1. 预定义的 (PREDEFINED)\n自带定义并随软件一起提供的 `function` 称为预定义函数。库函数也被称为预定义。\n例如：`printf`、`scanf`、`getchar()`、`putchar()`\
    \ 等。\n- 我们不能改变预定义函数的操作。\n- 我们不能修改预定义函数。\n\n### 2. 用户定义的 (USER DEFINED)\n用户为了特定目的定义的\
    \ `function` 称为用户定义函数。\n- 用户定义函数遵循 C 语言函数的预定义规则。\n- 用户不能改变预定义规则。\n- 在用户定义函数，用户可以实现自己的操作。\n\
    - 用户定义函数的名称和操作可以根据需要更改。\n\n示例：\n```c\nvoid main()\nint abc(int a, int b);\nfloat\
    \ addition(float a, int b);\n```\n\n# 问题：什么是函数和内置函数？\n\n答案：一个大型程序被细分为若干较小的程序或子程序。每个子程序指定了为大型程序执行的一个或多个动作。这些子程序就是函数。`function`\
    \ 只支持静态和 `extern` 存储类。默认情况下，`function` 假设为 `extern` 存储类。函数具有全局作用域。函数参数中只允许 `register`\
    \ 或 `auto` 存储类。随编译器预定义并提供的函数称为内置函数。它们也被称为库函数。\n\n# 问题：什么是参数？解释参数的类型？\n\n答案：在 C\
    \ 语言中，参数分为两类。实参和形参（注：原文 Formal 写了两次）。\n\n1. 实参：\n从调用函数发送/传递到被调用函数的值称为实参（actual\
    \ arguments）。\n\n2. 形参：\n\n"
