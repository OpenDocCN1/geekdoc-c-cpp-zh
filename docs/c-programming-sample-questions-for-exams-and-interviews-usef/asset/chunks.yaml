- fmt: "\n# Ex: if, switch\n\nThe variables which are declared with `const` keyword,\
    \ those variables are called as constant variables. Constant variables' data we\
    \ can’t change it at any cost. Constant variable may be local, global and block\
    \ level.\n\n**Question: How to initialize a variable?**\n**Answer:** A variable\
    \ can be initialized in two ways. They are:\n1) Static variable initialization\n\
    2) Dynamic variable initialization\n\n### 1) Static variable initialization\n\
    Declaring a variable by assigning constant value is called Static variable initialization.\
    \ Or The value assigned to variable is known before compiling program is called\
    \ Static variable initialization.\nEx: \n```c\nint x=10;\nfloat y=200;\nchar c=\"\
    ngc\";\n```\n\n### 2) Dynamic Variable Initialization\nDeclaring a variable by\
    \ assigning expression or variable is called Dynamic variable initialization.\
    \ Or The value assigned to variable is not known during compiling time is called\
    \ Dynamic variable initialization. Dynamic initialization can be done by using\
    \ pre defined functions which available in `c` library.\nExample:\n```c\nint c;\n\
    scanf(\"%d\",&c); // dynamic initialization\nc= 10; //static initialization\n\
    ```\n\n# Structure of a ‘C’ program\n```c\n<Preprocessor commands>\n<Global declarations>\n\
    void main (){\n<Local declarations>;\n<Statements>;\n}\nFunction (arguments){\n\
    <Local declarations>;\n<Statements>;\n}\n```\n* The `C` program has a free formatted\
    \ structure.\n* Every statement must be terminated with a semicolon (`;`).\n*\
    \ A program is a collection of functions. There may be a lot of functions or not\
    \ but at least one function must be there that is `main()`, where the execution\
    \ starts.\n* `C` has case sensitivity. All the keywords are defined in lower case.\n\
    * So better to write entire program in lower case.\n\n**Question: What is a Preprocessor\
    \ command?**\n**Answer:** The commands which start with a hash (`#`) symbol are\
    \ called Preprocessor commands. These commands are used to place library information\
    \ in our program. Generally in `C` programs library information placed in the\
    \ form of header files.\nExample:\n```c\n#include <stdio.h>\n#include \"conio.h\"\
    \n#define PI 3.14159\n```\n\n**Question: What are Global declarations?**\n**Answer:**\
    \ To use any variable it must be declared with its data type before the first\
    \ executable statement. The variables which declared inside a block are available\
    \ in that block only. Such variables are called as local variable. To use the\
    \ variable in entire program with same effect it must be declared as global. These\
    \ global variables are declared outside the functions.\n\n**Question: What is\
    \ a `main()` function?**\n**Answer:**\n* It is starting point for program execution.\
    \ This function has no arguments and no parameters.\n* `C` language does not allow\
    \ more than one `main()` function in a single program.\n* `main()` function always\
    \ write in small caps only.\n* Every function must and should call through `main()`\
    \ only (directly or indirectly).\n* This function consists of declarations and\
    \ executable statements.\n* `C` compiler does not consider anything out of the\
    \ `main`.\n\n# 2.8 What are the Input and Output Statements?\nInput and output\
    \ operations are performed by using predefined library functions.\n\n### printf()\n\
    `printf()` is a pre defined output function in `C` language. Basically `printf()`\
    \ is used to for three purposes:\n1. 1st purpose is to display some message on\
    \ the console screen.\n   Syntax: `printf(\"Some text message\");`\n   Ex: `printf\
    \ (\"My name is C\");`\n2. 2nd purpose is to display some values on the console\
    \ screen.\n   Syntax: `printf(\"format specifier\", variable_names);`\n   Example:\n\
    \   ```c\n   printf(\"%d\",a);\n   printf(\"%d%d\",a,b);\n   printf(\"%d%f%c\"\
    ,a,b,c);\n   printf(\"value of a =%d\",a);\n   printf(\"addition =%d\",c);\n \
    \  ```\n3. If you want to print address of the variable then go for `printf()`:\n\
    \   Syntax: `printf(\"control string\",&variable_name);`\n   Example:\n   ```c\n\
    \   printf(\"%d\",&a);\n   printf(\"address of a =%d\",&a);\n   printf(\"address\
    \ of a and b=%d%f\",a,b);\n   ```\n**Note:**\n1. The return type of the `printf()`\
    \ function is integer type.\n2. `printf()` defined in `stdio.h` (standard input\
    \ output) header file.\n\n### scanf()\n* `scanf()` function is a predefined function\
    \ by using `scanf()` function we can read the data at run time.\n* `scanf` function\
    \ returning an integer value i.e. total number of scanned values.\n* The complete\
    \ behavior of `scanf()` function will depends on format specifying only but not\
    \ on argument list.\n* When we working with `scanf()` function if you not provide\
    \ ampersand to the argument then `scanf()` will read the values but those not\
    \ stored in memory.\n   Syntax: `scanf('%format string', &(variables));`\n   Example:\n\
    \   ```c\n   scanf(\"%d %d\", &a,& b);\n   ```\n\n# 3. What are the Control statements?\n\
    ## 3.1 What are the Conditional Statements?\n**Question: What are Selection statements?**\n\
    **Answer:** These statements are also called ‘Branching Statements’ or conditional\
    \ statements. Because they are used to transfer control from one statement to\
    \ another statement. Conditional statements are mainly classified into two types\
    \ they are:\n1) `if` statements\n2) `switch` statement.\n\n### 3.1.1 What is Simple\
    \ if Statement?\n`C` uses the keyword `if` to implement the decision control statement\
    \ or instructions. The general form of its statement looks like is:\nSyntax:\n\
    ```c\nif (condition){\nStatements 1;\nStatements n;\n}\n```\nIf the condition\
    \ is true then executes the `if` block otherwise it does not execute statements.\
    \ In implementation when we need to create decision making then go for `if`. Constructing\
    \ the body is always optional. For a single statements body need be constructed.\
    \ If the body is not specified then automatically condition terminated with next\
    \ semicolon.\n\n**Question: Write a Program to print big value of two numbers\
    \ using if statement.**\n```c\n#include<stdio.h>\n#include<conio.h>\nvoid main(){\n\
    int a,b;\nclrscr();\nprintf (\"enter a,b, values =\");\nscanf(\"%d%d\",&a,&b);\n\
    if(a>b){printf(\"a is greater than b\");}\nif(b>a){printf(\"b is greater than\
    \ a\");}\ngetch();\n}\n```\nOUTPUT: `enter a,b, values =1020` `a is greater than\
    \ b`\n\n### 3.1.2 What is if else Statement?\nThe `if else` statement is an extension\
    \ of simple `if` statement. The general form is syntax:\n```c\nif (condition){\n\
    Block of statements; //true\n}\nelse{\nBlock of statements; //false\n}\n```\n\
    If the condition is true then executes the `if` block otherwise executes the `else`\
    \ block.\n\n**Question #1: Write a program to print the given value is even or\
    \ odd.**\n```c\n#include<stdio.h>\n#include<conio.h>\nvoid main(){\nint a;\nclrscr();\n\
    printf(\"enter a value=\");\nscanf(\"%d\", &a);\nif(a%2==0){printf(\"a is even\
    \ \", a);}\nelse{printf(\"a is odd\", a);}\ngetch();}\n}\n```\nOUTPUT: `enter\
    \ a value=5 a odd`\n\n**Question #2: Write a program to check the given number\
    \ is positive or negative.**\n```c\n#include<stdio.h>\n#include<conio.h>\nvoid\
    \ main(){\nint k;\nclrscr();\nprintf(\"enter any number=\");\nscanf(\"%d\", &k);\n\
    if(k==0){printf(\"the number is zero\");}\nelse if(k>0){printf(\"the number is\
    \ positive\");}\nelse{printf(\"the number is negative\");}\ngetch();}\n```\nOUTPUT:\
    \ `enter any number=5 the number positive`\n\n### 3.1.3 What is else-if Statement?\n\
    `else-if` is also an extension of `if else` statement to implement multiple conditions.\
    \ General form is:\n```c\nif (condition){\nBlock of statements;\n}\nelse if (condition){\n\
    Block of statements;\n}\nelse{\nBlock of statements;\n}\n```\nIf 1st `if` condition\
    \ is not true then moves into second `if` condition if it is true then enter body\
    \ of particular block. Suppose above mentioned condition fail then finally moves\
    \ to `else` block.\n\n**Question: Write a C Program to check the given character\
    \ is vowel or not.**\n```c\n#include<stdio.h>\n#include<conio.h>\nvoid main(){\n\
    char c;\nclrscr();\nprintf(\"enter a character =\");\nscanf(\"%c\", &c);\nif(c=='a'||c=='A'){printf(\"\
    It is vowel\");}\nelse if(c=='e'||c=='E'){printf(\"It is vowel\");}\nelse if (c=='o'||c=='O'){printf(\"\
    It is vowel\");}\nelse if(c=='i'||c=='I'){printf(\"It is vowel\");}\nelse if (c=='u'||c=='U'){printf(\"\
    It is vowel\");}\nelse{printf(\"%c is not vowel\", c);}\ngetch();}\n```\nOUTPUT:\
    \ `enter a character=E It is vowel`\n\n### 3.1.4 What is Nested if?\n`if...else\
    \ Ladder` (`if...else if....else`) executes two different codes depending upon\
    \ whether the test expression is true or false. Sometimes a choice has to be made\
    \ from more than 2 possibilities. The `if...else ladder` allows you to check for\
    \ multiple test expressions and execute different statements.\nSyntax:\n```c\n\
    if(testExpression1){\nStatements;\n}\nelse if(testExpression2){\nStatements;\n\
    }\nelse{\nStatements;\n}\n```\n**Question: Write a C Program using nested if …\
    \ else.**\n```c\n#include <stdio.h>\nint main(){\nint number1,number2;\nprintf(\"\
    Enter two integers: \");\nscanf(\"%d %d\", &number1, &number2);\nif (number1 >=\
    \ number2){\nif (number1 == number2){\nprintf(\"Result: %d = %d\",number1,number2);}\n\
    else{printf(\"Result: %d > %d\", number1, number2);}}\nelse{printf(\"Result: %d\
    \ < %d\",number1, number2);}}\nreturn 0;}\n```\nOUTPUT: `Enter two integers:245\
    \ Result 24<5`\n\n# 3.1.5 What are Multiway Selection Statements Using switch\
    \ Case?\n`Switch` is keyword, by using `switch` we can constructs multiple blocks\
    \ of a selection statements. Multiple blocks can be constructed with `case` keyword.\n\
    * It provides an easy way to dispatch execution to different parts of your code\
    \ based on the value of an expression. As such it often provides a better alternative\
    \ than a large series of `if-else` statements.\nSyntax:\n```c\nswitch (expression){\n\
    case value1:\nStatements;\nbreak;\ncase value 2:\nStatements;\nbreak;\n...\ncase\
    \ value n:\nStatements;\nbreak;\ndefault:\ndefault statement\n```\n* The `switch`\
    \ statement works like this: the value of the expression is compared with each\
    \ of the constant values in the `case` statement. If a match is found, the code\
    \ sequence following that case statement is executed. If none of the constants\
    \ matches the value of the expression then the `default` statement is executed.\n\
    * `Default` is a special kind of case which will be executed automatically when\
    \ the matching case is not found. Using `default` is always optional. It is recommended\
    \ to use when we are not handling all provisions of `switch` block.\n\n**Question\
    \ #1: Write a C Program to implement Arithmetic operation in a switch case.**\n\
    ```c\n#include<stdio.h>\n#include<conio.h>\nvoid main(){int a,b,k;clrscr();\n\
    printf(\"enter two numbers=\");scanf(\"%d%d\", &a, &b);\nprintf(\"\\n 1.addition:\"\
    );\nprintf(\"\\n 2\\.Subtraction:\");\nprintf(\"\\n 3.multiplication:\");\nprintf(\"\
    \\n 4.division\");\nprintf(\"\\n select your choice:\");scanf(\"%d\", &k);\nprintf(\"\
    \\n\");\nswitch(k){\ncase 1:printf(\"the addition=%d\", a+b);break;\ncase 2:printf(\"\
    the subtraction =%d\",a-b);break;\ncase 3:printf(\"the multiplication=%d\", a*b);break;\n\
    case 4:printf(\"the division=%d\", a/b);break;\ndefault:printf(\"in valid choice);}getch();}\n\
    ```\nOUTPUT: `enter two numbers=305 1.addition:2.Subtraction:3.multiplication:4.division\
    \ select your choice:1 the addition=8`\n\n**Question #2: Write a program to find\
    \ given number is less than greater than five using switch case.**\n```c\n//Program\
    \ to find number less than greater five\n#include <stdio.h>\n#include <conio.h>\n\
    void main(){int k ;clrscr();\nprintf(\"Enter any number \");scanf(\"%d\", &k)\
    \ ;\nswitch(k){\ncase 0 :printf(\"\\n Number is zero \");\ncase 1 :\ncase 2 :\n\
    case 3 :\ncase 4 : printf(\"\\n Number less than five \");break;\ncase 5 : printf(\"\
    \\n Number is five \");break;\ndefault :printf(\"\\n Number is greater than five\
    \ \")}getch();}\n```\nOUTPUT: `Enter any number 3 Number less than five`\n\n**Question\
    \ #3: Write a program for switch case.**\n```c\n#include <stdio.h>\n#include <conio.h>\n\
    main(){char k;clrscr();\nprintf(\"Enter any one of alphabets: \");k = getche()\
    \ ;\nswitch(k){\ncase 'a' :case 'A' : printf(\"\\n A for Active \");break;\ncase\
    \ 'b' :case 'B' : printf(\"\\n B for Brave \");break;\ncase 'c' :case 'C' : printf(\"\
    \\n C for Courage \");break;\ncase 'd' :case 'D' : printf(\"\\n D for Dare \"\
    );break;\ndefault : printf(\"\\n You are timid \")}getch();}\n```\nOUTPUT: `Enter\
    \ any one of alphabets: DD D for Dare`\n\n# 3.2 What are the Iterative Statements?\n\
    **Question: What is the use of Iterative Statements?**\n**Answer:** Iteration\
    \ means repeated execution of statements. In most situations, we need to execute\
    \ a set of statements for given number of times. Writing the same set of statements\
    \ repeatedly will have the following:\n1. Wastage of time.\n2. Wastage of memory.\n\
    3. Chances of creating errors.\nTo overcome this problem, we go to concept of\
    \ loops. Using loops, we will write the statements only once, and execute them\
    \ as many.\n\n**Question: What meant by conditional statement?**\n**Answer:**\
    \ The statements which can be executed for specified set of times until the given\
    \ condition satisfies are known as conditional statements. These statements are\
    \ supported under C with following words as:\n1) `while`\n2) `do-while`\n3) `for`\n\
    \n**Question: What is a loop?**\n**Answer:** Loop is a group of instructions executes\
    \ repeatedly while some condition remains true.\n\n**Question: Explain types of\
    \ loops?**\nLoops are classified into two types:\n1. **Entry control loop**: In\
    \ this control loop will check condition first. If condition is true then move\
    \ into the body. If condition fail doesn’t execute body at least once. Entry loop\
    \ is also called as Pre-checking loop. Ex: `while`, `for`.\n2. **Exit control\
    \ loop**: In this kind of loop compiler first executes the body then it go for\
    \ the condition. If condition is true again it goes to the body. If condition\
    \ fails it goes out of the body. Exit loop is also as post loop.\n\n**Question:\
    \ Explain steps how implements loops in a program?**\nGenerally every loop require\
    \ three steps:\n1. Initialization\n2. Condition\n3. Iteration\n\n**Question: Explain\
    \ the need of initialization, condition, iteration in a loop?**\nInitialization\
    \ indicates the starting point of the loop. Condition indicates ending point of\
    \ loop (i.e. when condition fail automatically terminated). To rotate the body\
    \ of the loop either in clock or anti clock direction iteration required in a\
    \ loop.\n\n### 3.2.1 What Is the Use Of Looping Using The while Statement?\nSyntax:\n\
    ```c\nwhile(condition){\nstatements1;\nStatement2;\n...\nincrement/ decrement;\n\
    }\n```\n**Question #1: Write a program to print one to given number of values.**\n\
    ```c\n//Program to print one to given values\n#include<stdio.h>\n#include<conio.h>\n\
    void main(){int n,i;clrscr();\nprintf(\"enter n values=\");scanf(\"%d\",n);\n\
    i=1;\ndo{printf(\"%t\",i);i++;}while (i<=n);}\n```\n**Question #2: Write a program\
    \ to print given table.**\n```c\n//Program to print given table\n#include<stdio.h>\n\
    #include<conio.h>\nvoid main(){int n,i;clrscr();\nprintf(\"enter n=\");scanf(\"\
    %d\",n);\ni=1;\ndo{printf(\"\\n%d\",i);i++;}while n}\n```\n**Question #3: Write\
    \ a program to find reverse of number.**\n```c\n//Program to find reverse of number\n\
    #include<stdio.h>\n#include<conio.h>\nvoid main(){int n,rd,sd;clrscr();\nprintf(\"\
    enter n=\");scanf(\"%d\",n);\ni=0;\nwhile(n>0){rd=n%10;sd=sd*10+rd;n=n/10;}\n\
    ```\n\n### 3.2.2 The Pretest Loop\nThe key feature of the pretest loop is that\
    \ we test to see whether or not to continue before executing the body of the loop.\
    \ The effect of this is that we might not execute the body at all. So, if we're\
    \ designing a program that has a section which might be executed 0 or more time\
    \ (that we're not guaranteed that it will be executed at all), a pretest structure\
    \ is what we want.\n\n### Post-Test Loop\nJust as we have a structure that tests\
    \ the continuation condition at the top, we have on that tests it at the bottom.\
    \ This is called post-test loop. The test is to determine whether or not to continue\
    \ until after executing the block, the loop body will always be executed at least\
    \ once. This distinguishes it from the pretest loop.\n\n### Mid-Test Loop\nThere\
    \ is a loop structure that generalizes both the pretest and the post-test loop.\
    \ Here we test in the middle of the loop.\n"
