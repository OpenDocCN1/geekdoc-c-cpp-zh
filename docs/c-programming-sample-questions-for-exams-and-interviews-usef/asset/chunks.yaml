    are declared.You can declare any of C''s variable types in a function.Note: sometimes
    global variables are called as extern variables.Question: If global variables
    can be used anywhere in the program, why not make all variables global?Answer:As
    your programs get bigger, you will begin to declare more and more variables. There
    are limits on the amount of memory available. Variables declared as global take
    up memory for the entire time the program is running; however, local variables
    don''t. For the most part, a local variable takes up memory only while the function
    to which it is local is active. Additionally, global variables are subject to
    unintentional alteration by other functions. If this occurs, the variables might
    not contain the values you expect them to when they''re used in the functions
    for which they were created.Question: How does the computer knows the difference
    between a global variable and a local variable that have the same name?Answer:The
    important thing to know is that when a local variable is declared with the same
    name as a global variable, the program temporarily ignores the global variable.
    It continues to ignore the global variable until the local variable goes out of
    scope.Question: Can I declare a local variable and a global variable that have
    the same name, as long as they have different variable types?Answer:Yes. When
    you declare a local variable with the same name as a global variable, it is a
    completely different variable. This means that you can make it whatever type you
    want. You should be careful, however, when declaring global and local variables
    that have the same name6.1 What are the Different Category of functions?Functions
    are categories depending on whether arguments are present or not and whether a
    value is returned or not. In C language functions May belong to one of the following
    categories1)       Functions with no arguments and no return values.2)       Functions
    with arguments and no return values.3)       Functions with arguments and returns
    values.1. Function With No Arguments And No Return Values:`​ When a function has
    no arguments it does not receive, any data from the calling function. Similarly,
    when it does not return a value the calling function does not receive any data
    from the called function. It shows in the figure. The dotted lines indicate that
    there is only a transfer of control but not data..![](Image00028.jpg)Fig. 6.1:
    Function with no arguments and no return valuesQuestion: Write a C Program with
    no arguments and no return type using functions.PROGRAM:/* no arguments and no
    return type*/#include<stdio.h>#include<conio.h>void first (void);void second (void);void
    third (void){printf("\n this is in third function");}void fourth (void){printf("\n
    this is in fourth function");}void main(){clrscr();printf("this is in main");first();second();third();fourth();printf("\n
    this is in main again");getch();}void first (void){printf("\n this is in first
    function");}void second (void){printf("\n this is in second function");}OUTPUT:this
    is in mainthis is in first functionthis is in second functionthis is in third
    functionthis is in fourth functionthis is in main again2.   Arguments But No Return
    Values:When a function has arguments it receive data from the calling function.
    Similarly when it does not return a value the calling function does not receive
    any data from the called function.The nature of data communication between the
    calling function and the called function with arguments but no return values as
    shown below.![](Image00029.jpg)Fig. 6.2: Function with arguments and no return
    valuesQuestion: Write a C program with arguments with no return value using functions.PROGRAM:/*arguments
    with no return value functions*/#include<stdio.h>#include<conio.h>void replicate
    (int n, int ch){int k;for (k=1; k<=n; k++)printf("%c", ch);}void main(){clrscr();replicate
    (9, ''x'');printf("\n hello \n");replicate (6, ''#'');printf("\n bhano daya \n");replicate
    (10, ''%'');printf("\n welcome \n");replicate (4, ''@'');getch();}OUTPUT:xxxxxxxxxhello######bhano
    daya%%%%%%%%%%welcome@@@@3.    Arguments With Return Values:When a function have
    arguments it receive data from the calling function similarly when function having
    return a value the calling function receive data from the called function. In
    effect the data transfer between the calling function and called function happened.Two
    -way data communication between the called function and calling function as shown
    below.![](Image00030.jpg)Fig. 6.3: Function with arguments and return valuesQuestion:
    Write a C program with arguments and with return value using functions.PROGRAM:/*arguments
    with return value functions*/#include<stdio.h>#include<conio.h>int add (int x,
    int y){int z;z=x+y;return z;}int subtr(int p, int q){return (p-q);}int mult (int,
    int);int div (int, int);int main(){int a,b,c;clrscr();printf("Enter any two numbers
    \n");scanf("%d%d", &a, &b);c=add(a, b);printf("\n the addition is %d", c);printf("\n
    the subtraction %d", subtr(a, b));c=mult(a, b);printf("\n the multiplication %d",
    mult(a,b));printf("\n the division %d", div(a,b));getch();return(0);}int mult
    (int a, int b){return a*b;}int div(int m, int n){int p=m/n;return p;}OUTPUT:Enter
    any two numbers103the addition is 13the subtraction 7the multiplication 30the
    division 3Question: What is the difference between pass by reference and pass
    by value?Answer:In call by value the actual argument will not be affected by the
    change of the formal parameter. Where as in Call by reference the actual argument
    will be affected by the formal parameters.Parameter passing techniques:​ In c
    language two types of techniques are available for passing parameters to the functions.
    they are


    1.  Call by value


    2.  Call by reference


    1.  Call by value:'
