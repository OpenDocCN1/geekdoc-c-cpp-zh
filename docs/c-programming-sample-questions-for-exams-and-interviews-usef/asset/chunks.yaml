  raw: '2.4 What are C Tokens?Question: What is token? Explain types of tokens in
    c language?Answer:The smallest individual units of a C- program are known as Tokens.
    Basically c tokens are classified into four types. They are1\. Key word2\. Identifiers3\.
    Constants4\. OperatorsQuestion: What is a Keyword?Answer:Key words are the pre
    defined words meaning has already been explained to the “C” Compilers. These key
    words are also called as “Reserved words”. There are 32 keywords available in
    standard C language. Following are the list of keywords in Cauto, break, case,
    char, const, continue, default, do.double, else, enum, extern, float, far, for,
    goto, if, int, long, near, register, short,return, signed, static, struct, switch,
    type def, union, voids, unsigned, while.➢           These are the 32 keywords
    available in C programming language.➢           All keywords must and should write
    in all small caps only.➢           We can’t add anything to the keywords because
    this all are predefined.➢           We can’t change the operation of any key words.➢
              We can’t combine two keywords.2.5 What are Identifiers?➢          Identifiers
    are user defined words or names which doesn’t have specific meaning with in language.
    The meaning of these words understood by programmer/developer.➢           Identifiers
    are used to identify the data instruction or user defined types.Question: What
    are the Rules for Identifiers?Answer:1\. It consists of sequence of letters and
    digits.2\. Identifier name always start with alphabet.3\. The only special characters
    allowed is under score (-)4\. The length of the Identifier is up to 32 characters.5\.
    Identifiers should not be a keyword.6\. No two successive underscores are not
    allowed7\. It can be defined in uppercase or lowercase letters.8\. Identifiers
    are case sensitive in programming.9\. Duplicate names are not allowed.10\. Don’t
    give any white spaces whenever we are writing identifier names.2.6 What are Constants?Constants
    refer to fixed values that the program may not alter and they are called literals
    .A constant is a value which never changes throughout the program. These values
    are represented in different formats.Types of Constants:Constants mainly classified
    in the two types.1\. Numeric Constants2\. Alpha - numeric Constants➢          
    Numeric constants are again classified into two types


    1.  Integer Constant          2\. Real constants


    1\. Integer Constant:Integer constants again classified into three types


    1.  Decimal integer


    2.  Octal integers


    3.  Hexa decimal integer


    Decimal integer :◆           An integer value with base 10 is called decimal integer.◆
              This integer value consists of digits from 0 to 9.◆           This integer
    is prefix with 1-9 sign(+/-)◆           Valid decimal integers are 100, 456, -345,
    23456, -19202 etc.Octal integers:◆           An integer value with base 8 is called
    octal integer.◆           This integer value consists of digits from 0 to 7.◆
              This integer is prefix with ‘0’Ex: 0123, 0725 …etc are the valid octal
    integers.Ex: 0128, 4647……etc are the invalid octal integers.Hexa decimal integer:◆
              An integer value with base 16 is called Hexa decimal integer.◆          
    This integer value consists of digits from 0 to9 and A-F or a-f.◆           This
    integer value is prefix with “ox”Ex: 1ab - invalidOx1ab - valid2\. Real constants:◆
              Real constants are also called as floating point constants.◆          
    Real constants are having both decimal and fractional parts.Alpha numeric constants:Character
    constants again classified into two types.


    1.  Single character constant


    2.  String constant


    1\. Single character constant:✓          A non numeric value represented with
    in ‘ ‘ is called single character value or constant.✓          Every character
    occupies 1 byte of memory.2\. String constant:✓          A non numeric value represented
    with in “ “ is called string or constant.✓          A string is collection of
    characters.Examples:“rama” – Alphabetic string“A101” - Alphabetic string“a**”
    - Alphabetic string✓          Every string is terminated with a special character
    called NULL which occupies 1- byte.Note: In C program constants are declared by
    using “ const” keyword.Example:const int a=10;const float f=1.5;const char =’f’;2.7
    What are Variables?Variable:➢          While solving a problem we need to remember
    some data values temporarily. Such values are placed in the named locations in
    the memory. These named locations in the memory are called variables.➢         
    A variable is an identifier. It can be consider as a name given to the location
    in memory where values are stored.➢           The quantities which can be changed
    during the execution of program are called Variables.➢           Variable is a
    container which contains data or Information.➢           Before using any variable
    in a program it must be declared first.SYNTAX:<Data-type><variable-name>;Example:
    int count;float X;char name;Rules:1) Variable names can consist of alphabets,
    Digits, underscore, dollar character etc.2) A variable name should not begin with
    a digit or any special symbol except #.3) White spaces are not allowed in variable
    names.4) Upper and lower case distinct I.e.,”A” Is differed from ‘a’.5) The maximum
    length of variable length is 32 characters.Important points to remember:


    1.  In c programming language variable declaration must be exist top of the program
    i.e. after opening the curly braces and before writing the first instruction.


    2.  In variable declaration existing keyword, operators, separators, and constants
    values are not allowed.


    3.  At least once space should be required in between data-type and variable-name.


    4.  All data-types must write in small caps only.


    5.  Variable names are case sensitive.


    Note : one variable contain only one value. If you change the value of the variable
    then old value will be erased and new value will be stored.Question: What does
    a variable contain?Answer:Variable contain mainly three things1)    Name of the
    variable2)    Value of the variable3)    Address of the variableExample:​int a=10;![](Image00012.jpg)Fig.
    2.1: Variable name, value and addressQuestion: What are Different Types of variables?Answer:Variables
    are broadly classified into four types. They are1)       Local variables2)      
    Global variables3)       Block level variables4)       Constant variable1\. Local
    variables means, the variables which are defined inside a function. These variables
    are work within that function only. The scope of the local variables is inside
    a function in which variables are defined.2\. Global variables are nothing but
    the variables which are defined outside of any function (generally main). The
    scope of these variables is throughout the program i.e. in all functions we can
    use these variables.3. The variables which are defined inside a block is called
    as block level variables . The scope of the block level variables is within the
    block.Block variables again classified into 2 types. They are


    1.  Conditional block(generally conditional statements)


    Ex: while, for, do-while


    2.  Iteration block(generally loops)'
