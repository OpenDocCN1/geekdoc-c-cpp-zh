  笔者在工程学院从事计算机科学与工程教学工作。在授课过程中，当学生被问到 C 语言的任一子话题时，他们常常会因无法给出正确答案而感到困惑。同样地，他们在求职面试中面对面试官提出的问题时也常感到茫然。\n\
