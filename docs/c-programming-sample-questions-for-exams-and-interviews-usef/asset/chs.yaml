  \ C 语言中令牌的类型。\n\n**答案：**\n`C` 程序的最小独立单元被称为**令牌 (Tokens)**。基本上，`C` 令牌分为四类：\n1. 关键字\
  \ (Keywords)\n2. 标识符 (Identifiers)\n3. 常量 (Constants)\n4. 运算符 (Operators)\n\n---\n\
  \n## 问：什么是关键字 (Keyword)？\n\n**答案：**\n关键字是预定义的单词，其含义已经向“C”编译器进行了说明和解释。这些关键字也被称为保留字（reserved\
  \ words）。\n标准 `C` 语言中共有 32 个关键字：\n\n```\nauto, break, case, char, const , continue\
  \ , default , do,\ndouble , else , enum extern float far for goto if int long near\
  \ register short ,\nreturn signed static struct switch typedef union void unsigned\
  \ while .\n```\n\n- 这 32 个关键字（实际上）存在于所有版本中；某些关键字可能会根据编译器/库而略有不同。\n- 所有关键字必须完全使用小写字母。\n\
  - 我们无法向这些关键字添加任何内容——它们完全由每个实现标准的标准机构固定，这些标准机构依赖它们形成集成课程或指令，并严格遵循附带严厉规则的 ISO/ANSI\
  \ 有效文档（这些文档自每个新草案委员会发布更新后就在在线广泛发布，主要是因为没有人希望在开发阶段自发地产生不同的方言，因此确切知道通过正确理解此前提供的相关假设内容可以自由组合会更有保障）。\n\
  \n（注：后续部分为随机单词列表，跳过翻译。）\n\n\n\n\n\n# 例: if, switch\n\n使用 `const` 关键字声明的变量这些变量被称为常量变量。我们无法以任何代价改变常量变量的数据。常量变量可以是局部的、全局的和块级的。\n\
  \n**问题：如何初始化变量？**\n**答案：** 变量可以通过两种方式初始化。它们是：\n1) 静态变量初始化\n2) 动态变量初始化\n\n### 1)\
  \ 静态变量初始化\n通过赋值常量值来声明变量被称为静态变量初始化。或者说赋值给变量的值在程序编译之前就已经已知，被称为静态变量初始化。\n示例： \n```c\n\
  int x=10;\nfloat y=200;\nchar c=\"ngc\";\n```\n\n### 2) 动态变量初始化\n通过赋值表达式或变量来声明变量被称为动态变量初始化。或者说赋值给变量的值在编译时是未知的，被称为动态变量初始化。可以使用\
  \ `c` 库中预定义的函数完成动态初始化。\n示例：\n```c\nint c;\nscanf(\"%d\",&c); // 动态初始化\nc= 10; //静态初始化\n\
  ```\n\n# ‘C’ 程序的结构\n```c\n<预处理指令>\n<全局声明>\nvoid main (){\n<局部声明>;\n<语句>;\n}\nFunction\
  \ (arguments){\n<局部声明>;\n<语句>;\n}\n```\n* `C` 程序具有自由格式的结构。\n* 每一条语句必须以分号（`;`）结束。\n\
  * 程序是函数的集合。可能有很多函数，也可能没有，但至少必须有一个 `main()` 函数，这是执行的开始点。\n* `C` 是大小写敏感的。所有关键字都定义为小写。\n\
  * 所以最好用小写写整个程序。\n\n**问题：什么是预处理指令？**\n**答案：** 以哈希符号（`#`）开头的命令被称为预处理指令。这些命令用于将库信息放入程序中。通常在\
  \ `C` 程序中，库信息以头文件的形式放置。\n示例：\n```c\n#include <stdio.h>\n#include \"conio.h\"\n#define\
  \ PI 3.14159\n```\n\n**问题：什么是全局声明？**\n**答案：** 要使用任何变量，必须在第一个可执行语句之前用其数据类型进行声明。在块内部声明的变量仅在该块内可用。此类变量被称为局部变量。若要在整个程序中使用具有相同效果的变量，必须将其声明为全局。这些全局变量声明在函数外部。\n\
  \n**问题：什么是 `main()` 函数？**\n**答案：**\n* 它是程序执行的起点。该函数没有参数也没有参数。\n* `C` 语言不允许在单个程序中出现多个一个\
  \ `main()` 函数。\n* `main()` 函数始终只用小写。\n* 每个函数都必须且应该通过 `main()` 调用（直接或间接）。\n* 该函数由声明和可执行语句组成。\n\
  * `C` 编译器不考虑 `main` 之外的任何内容。\n\n# 2.8 什么是输入输出语句？\n输入输出操作通过使用预定义的库函数完成。\n\n### printf()\n\
  `printf()` 是 `C` 语言中一个预定义的输出函数。基本上 `printf()` 有三个用途：\n1. 第一个用途是在控制屏幕上显示某些消息。\n \
  \  语法：`printf(\"Some text message\");`\n   示例：`printf (\"My name is C\");`\n2. 第二个用途是在控制屏幕上显示某些值。\n\
  \   语法：`printf(\"format specifier\", variable_names);`\n   示例：\n   ```c\n   printf(\"\
  %d\",a);\n   printf(\"%d%d\",a,b);\n   printf(\"%d%f%c\",a,b,c);\n   printf(\"value\
  \ of a =%d\",a);\n   printf(\"addition =%d\",c);\n   ```\n3. 如果你想打印变量的地址，请使用 `printf()`：\n\
  \   语法：`printf(\"control string\",&variable_name);`\n   示例：\n   ```c\n   printf(\"\
  %d\",&a);\n   printf(\"address of a =%d\",&a);\n   printf(\"address of a and b=%d%f\"\
  ,a,b);\n   ```\n**注意：**\n1. `printf()` 函数的返回值是整数类型。\n2. `printf()` 定义在 `stdio.h`（标准输入输出）头文件中。\n\
  \n### scanf()\n* `scanf()` 函数是一个预定义的函数，通过使用 `scanf()` 函数我们可以在运行时读取数据。\n* `scanf`\
  \ 函数返回一个整数值，即扫描到的值的总数。\n* `scanf()` 函数的完整行为仅取决于格式说明，而不取决于参数列表。\n* 当我们使用 `scanf()`\
  \ 函数时，如果你没有为参数提供取地址符，`scanf()` 将读取值但这些值不会存储在内存中。\n   语法：`scanf('%format string',\
  \ &(variables));`\n   示例：\n   ```c\n   scanf(\"%d %d\", &a,& b);\n   ```\n\n# 3.\
  \ 什么是控制语句？\n## 3.1 什么是条件语句？\n**问题：什么是选择语句？**\n**答案：** 这些语句也称为“分支语句”或条件语句。因为它们被用于将控制从一条语句转移到另一个语句。条件语句主要分为两类，它们是：\n\
  1) `if` 语句\n2) `switch` 语句。\n\n### 3.1.1 什么是简单 if 语句？\n`C` 使用 `if` 关键字来实现决策控制语句。该语句的一般形式如下：\n\
  语法：\n```c\nif (condition){\nStatements;\n}\n```\n如果条件为真，则执行 `if` 块。否则不执行语句。当我们需要创建决策时，`if`\
  \ 是可选的。语句体是必须的。如果不指定体，则自动以分号终止。\n\n**问题：使用 if 语句打印两个数字中较大的。**\n```c\n#include<stdio.h>\n\
  #include<conio.h>\nvoid main(){\nint a,b;\nclrscr();\nprintf(\"enter a,b =\");\n\
  scanf(\"%d%a,&b);\nif(a>b){printf(\"a is greater than b\");}\nif(b>a){printf(\"\
  b is than a\");\n\n\n\n：：enter a,,, =10 a greater than b`\n\n### 3.1.2 什么是 if else\
  \ 语句？\n`if else` 语句是简单 `if` 语句的扩展。其一般形式语法为：\n```c\nif (condition){\nBlock of statements;\n\
  }\nelse{\nBlock of statements;\n}\n```\n如果条件为真，执行 `if` 块，否则执行 `else` 块。\n\n**问题\
  \ 1：写一个程序打印给定值是偶数还是奇数。**\n```c\n#include<stdio.h>\n#include<conio.h>\nvoid main(){\n\
