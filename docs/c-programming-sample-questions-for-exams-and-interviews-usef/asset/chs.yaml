  \ init=done.\n\n\n\n\n\n# 创建和运行程序\n\n- 用于编写程序的软件是文本编辑器。\n- 从文本编辑器中创建的文件被称为源文件。\n\
  - 源文件中的代码必须使用 `c` 编译器翻译成机器语言，该编译器由两个独立的程序组成：预处理器和翻译器。\n- 编译器生成的文件称为对象模块。\n- 链接器将对象模块与运行程序所必需的标准函数链接在一起。\n\
  \n![](img/Image00002.jpg)\n*图 1.1：C 程序的创建与运行*\n\n- 链接器生成称为可执行代码的新代码——即具有应用程序所需全部功能代码；此类代码被称为“可执行文件”。\n\
  \  \n可执行文件通过运行器或加载器产生我们应用程序的最终结果。\n\n考虑以下场景：假设我们编写了一个名为 `name.c` 的简单 C 程序，通过 Turbo\
  \ Compiler 编译然后进行相应的转换：\n第一步涉及通过对上述文件扩展名调用命令生成 `.obj`（对象）格式——生成的输出将存储在本地目录中，与源代码在一起，然后进入后续阶段，直到完全完成。最后通过链接库依赖项，合并并成功解析了两个外部引用，从而创建出有效的\
  \ Windows 可执行文件 (.exe)。加载机制触发实际二进制内容的执行，并将计算出的结果返回到用户屏幕相应显示。”\n\n## 什么是算法？\n\n**定义**：解决特定问题的逐步演进程序，称为算法。<br>\n\
  一组通常用普通语言编写的顺序步骤，用于解决给定问题。已知算法有时存在多种方法，根据涉及的各种因素（如可靠性、准确性、易修改性）而产生不同的版本，但最关键的一点仍然是实现后的执行时间要求；在高层语言中优化利用计算机系统资源，在竞争性选项中选择最合适的候选者；从最小延迟的整体有效性角度以及从理论计算复杂性的角度来看。\n\
