- pgno: 33
  md: '# Working with Variables


    We’ve seen some examples of variables in our Python code already but it’s always
    worth going through the way they operate and how Python creates and assigns certain
    values to a variable.


    # VARIOUS VARIABLES


    You’ll be working with the Python 3 IDLE Shell in this tutorial. If you haven’t
    already, open Python 3 or close down the previous IDLE Shell to clear up any old
    code.


    **STEP 1** In some programming languages you’re required to use a dollar sign
    to denote a string, which is a variable made up of multiple characters, such as
    a name of a person. In Python this isn’t necessary. For example, in the Shell
    enter: `name="David Hayward"` (or use your own name, unless you’re also called
    David Hayward).


    ![](img/840275566c862102888f27d8ae2ac921_33_0.png)


    **STEP 2** You can check the type of variable in use by issuing the `type()` command,
    placing the name of the variable inside the brackets. In our example, this would
    be: `type(name)`. Add a new string variable: `title="Descended from Vikings"`.


    ![](img/840275566c862102888f27d8ae2ac921_33_1.png)


    **STEP 3** You’ve seen previously that variables can be concatenated using the
    plus symbol between the variable names. In our example we can use: `print (name
    + ": " + title)`. The middle part between the quotations allows us to add a colon
    and a space, as variables are connected without spaces, so we need to add them
    manually.


    ![](img/840275566c862102888f27d8ae2ac921_33_2.png)


    **STEP 4** You can also combine variables within another variable. For example,
    to combine both name and title variables into a new variable we use: `character=name
    + ": " + title`. Then output the content of the new variable as: `print (character)`.
    Numbers are stored as different variables: `age=44`, `Type (age)`. Which, as we
    know, are integers.


    ![](img/840275566c862102888f27d8ae2ac921_33_3.png)'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# STEP 5


    However, you can’t combine both strings and integer type variables in the same
    command, as you would a set of similar variables. You need to either turn one
    into the other or vice versa. When you do try to combine both, you get an error
    message:


    ```

    print (name + age)

    ```


    ![](img/840275566c862102888f27d8ae2ac921_34_0.png)


    # STEP 6


    This is a process known as TypeCasting. The Python code is:


    ```

    print (character + " is " + str(age) + " years old.")

    ```


    or you can use:


    ```

    print (character, “is”, age, “years old.”)

    ```


    Notice again that in the last example, you don’t need the spaces between the words
    in quotes as the commas treat each argument to print separately.


    ![](img/840275566c862102888f27d8ae2ac921_34_1.png)


    # STEP 7


    Another example of TypeCasting is when you ask for input from the user, such as
    a name. For example, enter:


    ```

    age= input (“How old are you?”)

    ```


    All data stored from the Input command is stored as a string variable.


    ![](img/840275566c862102888f27d8ae2ac921_34_2.png)


    # STEP 8


    This presents a bit of a problem when you want to work with a number that’s been
    inputted by the user, as age + 10 won’t work due to being a string variable and
    an integer. Instead, you need to enter:


    ```

    int(age) + 10

    ```


    This will TypeCast the age string into an integer that can be worked with.


    ![](img/840275566c862102888f27d8ae2ac921_34_3.png)


    # STEP 9


    The use of TypeCasting is also important when dealing with floating point arithmetic;
    remember numbers that have a decimal point in them. For example, enter:


    ```

    shirt=19.99

    ```


    Now enter type(shirt) and you’ll see that Python has allocated the number as a
    ‘float’, because the value contains a decimal point.


    ![](img/840275566c862102888f27d8ae2ac921_34_4.png)


    # STEP 10


    When combining integers and floats Python usually converts the integer to a float,
    but should the reverse ever be applied it’s worth remembering that Python doesn’t
    return the exact value. When converting a float to an integer, Python will always
    round down to the nearest integer, called truncating; in our case instead of 19.99
    it becomes 19.


    ![](img/840275566c862102888f27d8ae2ac921_34_5.png)'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# # User Input


    We''ve seen some basic user interaction with the code from a few of the examples
    earlier, so now would be a good time to focus solely on how you would get information
    from the user then store and present it.


    # ## USER FRIENDLY


    The type of input you want from the user will depend greatly on the type of program
    you''re coding. For example, a game may ask for a character''s name, whereas a
    database can ask for personal details.


    **STEP 1** If it''s not already, open the Python 3 IDLE Shell, and start a New
    File in the Editor. Let''s begin with something really simple, enter:


    ```

    ```python

    print("Hello")

    firstname=input("What is your first name? ")

    print("Thanks.")

    surname=input("And what is your surname? ")

    ```

    ```


    ![](img/840275566c862102888f27d8ae2ac921_35_0.png)


    **STEP 3** Now that we have the user''s name stored in a couple of variables we
    can call them up whenever we want:


    ```

    ```python

    print("Welcome", firstname, surname, ". I hope you''re well today.")

    ```

    ```


    ![](img/840275566c862102888f27d8ae2ac921_35_1.png)


    **STEP 2** Save and execute the code, and as you already no doubt suspected, in
    the IDLE Shell the program will ask for your first name, storing it as the variable
    firstname, followed by your surname; also stored in its own variable (surname).


    ![](img/840275566c862102888f27d8ae2ac921_35_2.png)


    **STEP 4** Run the code and you can see a slight issue, the full stop after the
    surname follows a blank space. To eliminate that we can add a plus sign instead
    of the comma in the code:


    ```

    ```python

    print("Welcome", firstname, surname+". I hope you''re well today.")

    ```

    ```


    ![](img/840275566c862102888f27d8ae2ac921_35_3.png)'
  merge: -1
  img_proc: true
