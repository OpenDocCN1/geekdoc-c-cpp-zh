- pgno: 39
  md: "# # Conditions and Loops\n\nConditions and loops are what makes a program interesting;\
    \ they can be simple or rather complex. How you use them depends greatly on what\
    \ the program is trying to achieve; they could be the number of lives left in\
    \ a game or just displaying a countdown.\n\n# ## TRUE CONDITIONS\n\nKeeping conditions\
    \ simple to begin with makes learning to program a more enjoyable experience.\
    \ Let’s start then by checking if something is TRUE, then doing something else\
    \ if it isn’t.\n\n**STEP 1** Let’s create a new Python program that will ask the\
    \ user to input a word, then check it to see if it’s a four-letter word or not.\
    \ Start with File > New File, and begin with the input variable:\n\n```\n~~~python\n\
    word=input(\"Please enter a four-letter word: \")\n~~~\n```\n\n![](img/840275566c862102888f27d8ae2ac921_39_0.png)\n\
    \n**STEP 2** Now we can create a new variable, then use the len function and pass\
    \ the word variable through it to get the total number of letters the user has\
    \ entered:\n\n```\n~~~python\nword=input(\"Please enter a four-letter word: \"\
    )\nword_length=len(word)\n~~~\n```\n\n![](img/840275566c862102888f27d8ae2ac921_39_1.png)\n\
    \n**STEP 3** Now you can use an if statement to check if the word_length variable\
    \ is equal to four and print a friendly confirmation if it applies to the rule:\n\
    \n```\n~~~python\nword=input(\"Please enter a four-letter word: \")\nword_length=len(word)\n\
    if word_length == 4:\n    print(word, \"is a four-letter word. Well done.\")\n\
    ~~~\n```\n\nThe double equal sign (==) means check if something is equal to something\
    \ else.\n\n![](img/840275566c862102888f27d8ae2ac921_39_2.png)\n\n**STEP 4** The\
    \ colon at the end of if tells Python that if this statement is true do everything\
    \ after the colon that’s indented. Next, move the cursor back to the beginning\
    \ of the Editor:\n\n```\n~~~python\nword=input(\"Please enter a four-letter word:\
    \ \")\nword_length=len(word)\nif word_length == 4:\n    print(word, \"is a four-letter\
    \ word. Well done.\")\nelse:\n    print(word, \"is not a four-letter word.\")\n\
    ~~~\n```\n\n![](img/840275566c862102888f27d8ae2ac921_39_3.png)"
  merge: -1
  img_proc: true
- pgno: 40
  md: "# Conditions and Loops\n\n# STEP 5\n\nPress F5 and save the code to execute\
    \ it. Enter a four-letter word in the Shell to begin with, you should have the\
    \ returned message that it’s the word is four letters. Now press F5 again and\
    \ rerun the program but this time enter a five-letter word. The Shell will display\
    \ that it’s not a four-letter word.\n\n![](img/840275566c862102888f27d8ae2ac921_40_0.png)\n\
    \n# STEP 6\n\nNow expand the code to include another condition. Eventually, it\
    \ could become quite complex. We’ve added a condition for three-letter words:\n\
    \n```\nword=input(\"Please enter a four-letter word: \")\nword_length=len(word)\n\
    if word_length == 4:\n    print (word, \"is a four-letter word. Well done.\")\n\
    elif word_length == 3:\n    print (word, \"is a three-letter word. Try again.\"\
    )\nelse:\n    print (word, \"is not a four-letter word.\")\n```\n\n![](img/840275566c862102888f27d8ae2ac921_40_1.png)\n\
    \n# LOOPS\n\nA loop looks quite similar to a condition but they are somewhat different\
    \ in their operation. A loop will run through the same block of code a number\
    \ of times, usually with the support of a condition.\n\n# STEP 1\n\nLet’s start\
    \ with a simple While statement. Like if, this will check to see if something\
    \ is TRUE, then run the indented code:\n\n```\nx = 1\nwhile x < 10:\n    print\
    \ (x)\n    x = x + 1\n```\n\n![](img/840275566c862102888f27d8ae2ac921_40_2.png)\n\
    \n# STEP 3\n\nThe For loop is another example. For is used to loop over a range\
    \ of data, usually a list stored as variables inside square brackets. For example:\n\
    \n```\nwords=[\"Cat\", \"Dog\", \"Unicorn\"]\n\nfor word in words:\n    print\
    \ (word)\n```\n\n![](img/840275566c862102888f27d8ae2ac921_40_3.png)\n\n# STEP\
    \ 2\n\nThe difference between if and while is when while gets to the end of the\
    \ indented code, it goes back and checks the statement is still true. In our example\
    \ x is less than 10. With each loop it prints the current value of x, then adds\
    \ one to that value. When x does eventually equal 10 it stops.\n\n![](img/840275566c862102888f27d8ae2ac921_40_4.png)\n\
    \n# STEP 4\n\nThe For loop can also be used in the countdown example by using\
    \ the range function:\n\n```\nfor x in range (1, 10):\n    print (x)\n```\n\n\
    The x=x+1 part isn’t needed here because the range function creates a list between\
    \ the first and last numbers used.\n\n![](img/840275566c862102888f27d8ae2ac921_40_5.png)"
  merge: -1
  img_proc: true
- pgno: 41
  md: '# # Python Modules


    We''ve mentioned modules previously, (the Math module) but as modules are such
    a large part of getting the most from Python, it''s worth dedicating a little
    more time to them. In this instance we''re using the Windows version of Python
    3.


    # ## MASTERING MODULES


    Think of modules as an extension that''s imported into your Python code to enhance
    and extend its capabilities. There are countless modules available and as we''ve
    seen, you can even make your own.


    # ### STEP 1


    Although good, the built-in functions within Python are limited. The use of modules,
    however, allows us to make more sophisticated programs. As you are aware, modules
    are Python scripts that are imported, such as `import math`.


    ![](img/840275566c862102888f27d8ae2ac921_41_0.png)


    # ### STEP 2


    Some modules, especially on the Raspberry Pi, are included by default; the math
    module being a prime example. Sadly, other modules aren''t always available. A
    good example on non-Pi platforms is the pygame module, which contains many functions
    to help create games. Try: `import pygame`.


    ![](img/840275566c862102888f27d8ae2ac921_41_1.png)


    # ### STEP 3


    The result is an error in the IDLE Shell, as the pygame module isn''t recognised
    or installed in Python. To install a module we can use Pip (Pip Installs Packages).
    Close down the IDLE Shell and drop into a command prompt or Terminal session.
    At an elevated admin command prompt, enter:


    ```

    ~~~

    pip install pygame

    ~~~

    ```


    ![](img/840275566c862102888f27d8ae2ac921_41_2.png)


    # ### STEP 4


    The PIP installation requires an elevated status due to installing components
    at different locations. Windows users can search for CMD via the Start button
    and right-click the result then click Run as Administrator. Linux and Mac users
    can use the Sudo command, with `sudo pip install package`.


    ![](img/840275566c862102888f27d8ae2ac921_41_3.png)'
