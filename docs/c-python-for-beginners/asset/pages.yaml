    ![](img/840275566c862102888f27d8ae2ac921_64_0.png)


    # STEP 8


    Create a deliberate error in the code. Remove the semicolon from the `cout` line,
    so it reads:


    ```

    cout << "Hello, world!\n"

    ```


    ![](img/840275566c862102888f27d8ae2ac921_64_1.png)


    # STEP 6


    In order to apply the new changes to the code, you need to re-compile, build,
    and run it again. This time, however, you can simply click the Build/Run icon,
    the combined yellow cog and green play button.


    ![](img/840275566c862102888f27d8ae2ac921_64_2.png)


    # STEP 9


    Now click the Build and Run icon again to apply the changes to the code. This
    time Code::Blocks refuses to execute the code, due to the error you put in. In
