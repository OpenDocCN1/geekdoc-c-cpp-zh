- pgno: 17
  md: "# # How to Set Up\n# Python in Linux\n\nPython version 2.x is already installed\
    \ in most Linux distributions but as we’re going to be using Python 3.x, there’s\
    \ a little work we need to do first to get hold of it. Thankfully, it’s not too\
    \ difficult.\n\n# ## PYTHON PENGUIN\n\nLinux is such a versatile operating system\
    \ that it’s often difficult to nail down just one way of doing something. Different\
    \ distributions go about installing software in different ways, so we will stick\
    \ to Linux Mint 18.1 for this particular tutorial.\n\n**STEP 1**  \nFirst you\
    \ need to ascertain which version of Python is currently installed in your Linux\
    \ system; as we’ve mentioned, we’re going to be using Linux Mint 18.1 for this\
    \ section. As with macOS, drop into a Terminal by pressing Ctrl+Alt+T.\n\n![](img/840275566c862102888f27d8ae2ac921_17_0.png)\n\
    \n**STEP 3**  \nSome Linux distros will automatically update the installation\
    \ of Python to the latest versions whenever the system is updated. To check, first\
    \ do a system update and upgrade with:\n\n`sudo apt-get update && sudo apt-get\
    \ upgrade`\n\nEnter your password and let the system do any updates.\n\n![](img/840275566c862102888f27d8ae2ac921_17_1.png)\n\
    \n**STEP 2**  \nNext enter: `python --version` into the Terminal screen. You should\
    \ have the output relating to version 2.x of Python in the display. Ours in this\
    \ particular case is Python 2.7.12.\n\n![](img/840275566c862102888f27d8ae2ac921_17_2.png)\n\
    \n**STEP 4**  \nOnce the update and upgrade is complete, you may need to answer\
    \ ‘Y’ to authorise any upgrades, enter: `python3 --version` to see if Python 3.x\
    \ is updated or even installed. In the case of Linux Mint, the version we have\
    \ is Python 3.5.2, which is fine for our purposes.\n\n![](img/840275566c862102888f27d8ae2ac921_17_3.png)"
