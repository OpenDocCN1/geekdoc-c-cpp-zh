  md: "# COMMENTS\n\nLines that begin with a double slash are comments. This means\
    \ they won't be executed in the code and are ignored by the compiler. Comments\
    \ are designed to help you, or another programmer looking at your code, explain\
    \ what's going on. There are two types of comment. /* covers multiple line comments,\
    \ // a single line. Lines that begin with a double slash are comments. This means\
    \ they won't be executed in the code and are ignored by the compiler. Comments\
    \ are designed to help you, or another programmer looking at your code, explain\
    \ what's going on. There are two types of comment. /* covers multiple line comments,\
    \ // a single line.\n\n```\n```cpp\n#include <iostream>\n\nint main()\n{\n   \
    \ // My First C++ program\n}\n```\n```\n\n# <<\n\nThe two chevrons used here are\
    \ insertion operators. This means that whatever follows the chevrons is to be\
    \ inserted into the std::cout statement. In this case they're the words 'Hello,\
    \ world!', which are to be displayed on the screen when you compile and execute\
    \ the code.\n\n```\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint\
    \ main()\n{\n    cout << \"Hello, world!\\n\";\n\n    return 0;\n}\n```\n```\n\
    \n# STD\n\nWhile std stands for something quite different, in C++ it means Standard.\
    \ It's part of the Standard Namespace in C++, which covers a number of different\
    \ statements and commands. You can leave the std:: part out of the code but it\
    \ must be declared at the start with: using namespace std; not both. For example:\n\
    \n```\n```cpp\n#include <iostream>\nusing namespace std;\n```\n```\n\n```\n```cpp\n\
    #include <iostream>\n\nusing namespace std;\n\nint main()\n{\n    std::cout <<\
    \ \"Hello, world!\\n\"; //Remember! declare\n}\n```\n```\n\n# OUTPUTS\n\nLeading\
    \ on, the 'Hello, world!' part is what we want to appear on the screen when the\
    \ code is executed. You can enter whatever you like, as long as it's inside the\
    \ quotation marks. The brackets aren't needed but some compilers insist on them.\
    \ The \\n part indicates a new line is to be inserted.\n\n```\n```cpp\n// My first\
    \ C++ program\ncout << \"Hello, world!\\n\"\n```\n```\n\n# COUT\n\nIn this example\
    \ we're using cout, which is a part of the Standard Namespace, hence why it's\
    \ there, as you're asking C++ to use it from that particular namespace. Cout means\
    \ Character OUTput, which displays, or prints, something to the screen. If we\
    \ leave std:: out we have to declare it at the start of the code, as mentioned\
    \ previously.\n\n```\n```cpp\n#include <iostream>\nusing namespace std;\n\nint\
    \ main()\n{\n    // My first C++ program\n    cout\n}\n```\n```\n\n# ; AND }\n\
    \nFinally you can see that lines within a function code block (except comments)\
    \ end with a semicolon. This marks the end of the statement and all statements\
    \ in C++ must have one at the end or the compiler fails to build the code. The\
    \ very last line has the closing brace to indicate the end of the main function.\n\
    \n```\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main()\n{\n  \
    \  // My first C++ program\n    cout << \"Hello, world!\\n\";\n    return 0;\n\
    }\n```\n```"
