- pgno: 18
  md: '**STEP 5** However, if you want the latest version, 3.6.2 as per the Python
    website at the time of writing, you need to build Python from source. Start by
    entering these commands into the Terminal:


    ```

    sudo apt-get install build-essential checkinstall

    sudo apt-get install libreadline-gplv2-dev libncursesw5-dev libssl-dev libsqlite3-dev
    tk-dev libgdbm-dev libc6-dev libbz2-dev

    ```


    ![](img/840275566c862102888f27d8ae2ac921_18_0.png)


    **STEP 6** Open up your Linux web browser and go to the Python download page:
    **www.python.org/downloads**. Click on the Download Python 3.6.2 (or whichever
    version it’s on when you look) to download the source Python-3.6.2.tar.xz file.


    ![](img/840275566c862102888f27d8ae2ac921_18_1.png)


    **STEP 7** In the Terminal, go the Downloads folder by entering: `cd Downloads/`.
    Then unzip the contents of the downloaded Python source code with: `tar -xvf Python-3.6.2.tar.xz`.
    Now enter the newly unzipped folder with `cd Python-3.6.2/`.


    ![](img/840275566c862102888f27d8ae2ac921_18_2.png)


    **STEP 8** Within the Python folder, enter:


    ```

    ./configure

    sudo make altinstall

    ```


    This could take a little while depending on the speed of your computer. Once finished,
    enter: `python3.6 --version` to check the installed latest version.


    ![](img/840275566c862102888f27d8ae2ac921_18_3.png)


    **STEP 9** For the GUI IDLE, you need to enter the following command into the
    Terminal:


    ```

    sudo apt-get install idle3

    ```


    The IDLE can then be started with the command: `idle3`. Note, that IDLE runs a
    different version from the one you installed from source.


    ![](img/840275566c862102888f27d8ae2ac921_18_4.png)


    **STEP 10** You also need PIP (Pip Installs Packages) which is a tool to help
    you install more modules and extras. Enter:


    ```

    sudo apt-get install python3-pip

    ```


    Pip is then installed; check for the latest update with:


    ```

    pip3 install --upgrade pip

    ```


    When complete, close the Terminal and Python 3.x will be available via the Programming
    section in your distro’s menu.


    ![](img/840275566c862102888f27d8ae2ac921_18_5.png)'
