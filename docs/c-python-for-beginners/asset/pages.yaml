- pgno: 70
  md: "# Data Types\n\n```\n```cpp\ncout.precision(22);\ncout << PI;\n}\n```\n```\n\
    \n![](img/840275566c862102888f27d8ae2ac921_70_0.png)\n\nThis is mainly due to\
    \ the conversion from binary in the compiler and that the IEEE 754 double precision\
    \ standard occupies 64-bits of data, of which 52-bits are dedicated to the significant\
    \ (the significant digits in a floating-point number) and roughly 3.5-bits are\
    \ taken holding the values 0 to 9. If you divide 53 by 3.5, then you arrive at\
    \ 15.142857 recurring, which is 15-digits of precision.\n\nTo be honest, if you’re\
    \ creating code that needs to be accurate to more than fifteen decimal places,\
    \ then you wouldn’t be using C++, you would use some scientific specific language\
    \ with C++ as the connective tissue between the two languages.\n\nYou can create\
    \ your own data types, using an alias-like system called typedef. For example:\n\
    \n![](img/840275566c862102888f27d8ae2ac921_70_1.png)\n\nAgain, build and run the\
    \ code; as you can see from the command line window, the number represented by\
    \ the variable PI is different to the number you’ve told C++ to use in the variable.\
    \ The output reads the value of PI as 3.141592653589793115998, with the numbers\
    \ going awry from the fifteenth decimal place.\n\n![](img/840275566c862102888f27d8ae2ac921_70_2.png)\n\
    \n![](img/840275566c862102888f27d8ae2ac921_70_3.png)\n\n```\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\ntypedef int metres;\n\nint main()\n{\n   \
    \ metres distance;\n    distance = 15;\n    cout << \"distance in metres is: \"\
    \ << distance;\n}\n```\n```\n\n![](img/840275566c862102888f27d8ae2ac921_70_4.png)\n\
    \nThis code when executed creates a new int data type called metres. Then, in\
    \ the main code block, there’s a new variable called distance, which is an integer;\
    \ so you’re basically telling the compiler that there’s another name for int.\
    \ We assigned the value 15 to distance and displayed the output: distance in metres\
    \ is 15.\n\nIt might sound a little confusing to begin with but the more you use\
    \ C++ and create your own code, the easier it becomes."
  merge: -1
  img_proc: true
- pgno: 71
  md: "# Strings\n\nStrings are objects that represent and hold sequences of characters.\
    \ For example, you could have a universal greeting in your code “Welcome” and\
    \ assign that as a string to be called up whenever you like in the program.\n\n\
    # STRING THEORY\n\nThere are different ways in which you can create a string of\
    \ characters, which historically are all carried over from the original C language,\
    \ and are still supported by C++.\n\n**STEP 1** To create a string you use the\
    \ char function. Open a new C++ file and begin with the usual header:\n\n```\n\
    ```cpp\n#include <iostream>\nusing namespace std;\n\nint main ()\n{\n}\n```\n\
    ```\n\n![](img/840275566c862102888f27d8ae2ac921_71_0.png)\n\n**STEP 2** It’s easy\
    \ to confuse a string with an array. Here’s an array, which can be terminated\
    \ with a null character:\n\n```\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nint main ()\n{\n    char greet[8] = {'W', 'e', 'l', 'c', 'o', 'm', 'e',\
    \ '\\0'};\n    cout << greet << \"\\n\";\n}\n```\n```\n\n![](img/840275566c862102888f27d8ae2ac921_71_1.png)\n\
    \n**STEP 3** Build and run the code, and ‘Welcome’ appears not a string. A string\
    \ is a class, which defines objects that can be represented as a stream of characters\
    \ and doesn’t need to be terminated like an array. The code can therefore be represented\
    \ as:\n\n```\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main ()\n\
    {\n    char greet[] = \"Welcome\";\n    cout << greet << \"\\n\";\n}\n```\n```\n\
    \n![](img/840275566c862102888f27d8ae2ac921_71_2.png)\n\n**STEP 4** In C++ there’s\
    \ also a string function, which works in much the same way. Using the greeting\
    \ code again, you can enter:\n\n```\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nint main ()\n{\n    string greet = \"Welcome\";\n    cout << greet <<\
    \ \"\\n\";\n}\n```\n```\n\n![](img/840275566c862102888f27d8ae2ac921_71_3.png)"
  merge: -1
  img_proc: true
- pgno: 72
  md: "# STEP 5\n\nThere are also many different operations that you can apply with\
    \ the string function. For instance, to get the length of a string you can use:\n\
    \n```\n```cpp\n#include <iostream>\nusing namespace std;\nint main ()\n{\n   \
    \ string greet = \"Welcome\";\n    cout << \"The length of the string is: \";\n\
    \    cout << greet.size() << \"\\n\";\n}\n```\n```\n\n![](img/840275566c862102888f27d8ae2ac921_72_0.png)\n\
    \n# STEP 6\n\nYou can see that we used greet.size() to output the length, the\
    \ number of characters there are, of the contents of the string. Naturally, if\
    \ you call your string something other than greet, then you need to change the\
    \ command to reflect this. It's always stringname.operation. Build and run the\
    \ code to see the results.\n\n![](img/840275566c862102888f27d8ae2ac921_72_1.png)\n\
    \n# STEP 7\n\nYou can of course add strings together, or rather combine them to\
    \ form longer strings:\n\n```\n```cpp\n#include <iostream>\nusing namespace std;\n\
    int main ()\n{\n    string greet1 = \"Hello\";\n    string greet2 = \", world!\"\
    ;\n    string greet3 = greet1 + greet2;\n    cout << greet3 << \"\\n\";\n}\n```\n\
    ```\n\n![](img/840275566c862102888f27d8ae2ac921_72_2.png)\n\n# STEP 8\n\nJust\
    \ as you might expect, you can mix in an integer and store something to do with\
    \ the string. In this example, we created int length, which stores the result\
    \ of string.size() and outputs it to the user.\n\n```\n```cpp\n#include <iostream>\n\
    using namespace std;\nint main ()\n{\n    int length;\n    string greet1 = \"\
    Hello\";\n    string greet2 = \", world!\";\n    string greet3 = greet1 + greet2;\n\
    \    length = greet3.size();\n    cout << \"The length of the combined strings\
    \ is: \" << length << \"\\n\";\n}\n```\n```\n\n# STEP 9\n\nUsing the available\
    \ operations that come with the string function, you can manipulate the contents\
    \ of a string. For example, to remove characters from a string you could use:\n\
    \n```\n```cpp\n#include <iostream>\nusing namespace std;\nint main ()\n{\n   \
    \ string str (\"Here is a long sentence in a string.\");\n    cout << str << '\\\
    n';\n    str.erase (10,5);\n    cout << str << '\\n';\n    str.erase (str.begin()+8);\n\
    \    cout << str << '\\n';\n    str.erase (str.begin()+9, str.end()-9);\n    cout\
    \ << str << '\\n';\n}\n```\n```\n\n# STEP 10\n\nIt's worth spending some time\
    \ playing around with the numbers, which are the character positions in the string.\
    \ Occasionally, it can be hit and miss whether you get it right, so practice makes\
    \ perfect. Take a look at the screenshot to see the result of the code.\n\n![](img/840275566c862102888f27d8ae2ac921_72_3.png)"
  merge: -1
  img_proc: true
- pgno: 73
  md: "# C++ Maths\n\nProgramming is mathematical in nature and as you might expect,\
    \ there’s plenty of built-in scope for some quite intense maths. C++ has a lot\
    \ to offer someone who’s implementing mathematical models into their code. It\
    \ can be extremely complex or relatively simple.\n\n# C++ = MC²\n\nThe basic mathematical\
    \ symbols apply in C++ as they do in most other programming languages. However,\
    \ by using the C++ Math Library, you can also calculate square roots, powers,\
    \ trig and more.\n\n**STEP 1** C++’s mathematical operations follow the same patterns\
    \ as those taught in school, in that multiplication and division take precedence\
    \ over addition and subtraction. You can alter that though. For now, create a\
    \ new file and enter:\n\n```\n```cpp\n#include <iostream>\nusing namespace std;\n\
    \nint main ()\n{\n    float numbers = 100;\n\n    numbers = numbers + 10; // This\
    \ adds 10 to the initial 100\n\n    cout << numbers << \"\\n\";\n\n    numbers\
    \ = numbers - 10; // This subtracts 10 from the new 110\n\n    cout << numbers\
    \ << \"\\n\";\n}\n```\n```\n\n![](img/840275566c862102888f27d8ae2ac921_73_0.png)\n\
    \n**STEP 2** While simple, it does get the old maths muscle warmed up. Note that\
    \ we used a float for the numbers variable. While you can happily use an integer,\
    \ if you suddenly started to use decimals, you would need to change to a float\
    \ or a double, depending on the accuracy needed. Run the code and see the results.\n\
    \n![](img/840275566c862102888f27d8ae2ac921_73_1.png)\n\n**STEP 3** Multiplication\
    \ and division can be applied as such:\n\n```\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\n\nint main ()\n{\n    float numbers = 100;\n\n    numbers =\
    \ numbers * 10; // This multiplies 100 by 10\n\n    cout << numbers << \"\\n\"\
    ;\n\n    numbers = numbers / 10; // And this divides 1000 by 10\n\n    cout <<\
    \ numbers << \"\\n\";\n}\n```\n```\n\n![](img/840275566c862102888f27d8ae2ac921_73_2.png)\n\
    \n**STEP 4** Again, execute the simple code and see the results. While not particularly\
    \ interesting, it’s a start into C++ maths. If you had a float here, so you can\
    \ play around with the code and multiply by decimal places, as well as divide,\
    \ add and subtract.\n\n![](img/840275566c862102888f27d8ae2ac921_73_3.png)"
  merge: -1
  img_proc: true
- pgno: 74
  md: "# STEP 5\n\nThe interesting maths content comes when you call upon the C++\
    \ Math Library. Within this header are dozens of mathematical functions along\
    \ with further operations. Everything from computing cosine to arc tangent with\
    \ two parameters, to the value of PI. You can call the header with:\n\n```\n```cpp\n\
    #include <iostream>\n#include <cmath>\nusing namespace std;\n\nint main ()\n{\n\
    }\n```\n```\n\n![](img/840275566c862102888f27d8ae2ac921_74_0.png)\n\n# STEP 8\n\
    \nCalculating powers of numbers can be done with:\n\n```\n```cpp\n#include <iostream>\n\
    #include <cmath>\nusing namespace std;\n\nint main ()\n{\n    float number = 12;\n\
    \n    cout << number << \" to the power of 2 is \" << pow(number, 2) << \"\\n\"\
    ;\n    cout << number << \" to the power of 3 is \" << pow(number, 3) << \"\\\
    n\";\n    cout << number << \" to the power of .08 is \" << pow(number, 0.8) <<\
    \ \"\\n\";\n}\n```\n```\n\n![](img/840275566c862102888f27d8ae2ac921_74_1.png)\n\
    \n# STEP 6\n\nStart by getting the square root of a number:\n\n```\n```cpp\n#include\
    \ <iostream>\n#include <cmath>\nusing namespace std;\n\nint main ()\n{\n    float\
    \ number = 134;\n\n    cout << \"The square root of \" << number << \" is: \"\
    \ << sqrt(number) << \"\\n\";\n}\n```\n```\n\n![](img/840275566c862102888f27d8ae2ac921_74_2.png)\n\
    \n# STEP 9\n\nHere we created a float called number with the value of 12, and\
    \ the pow(variable, power) is where the calculation happens. Of course, you can\
    \ calculate powers and square roots without using variables. For example, pow\
    \ (12, 2) outputs the same value as the first cout line in the code.\n\n![](img/840275566c862102888f27d8ae2ac921_74_3.png)\n\
    \n# STEP 7\n\nHere we created a new float called number and used the sqrt(number)\
