- pgno: 68
  md: "# STEP 5\n\nYou can assign a value to a variable as soon as you declare it.\
    \ The code you’ve typed in could look like this, instead:\n\n```\nint a = 10;\n\
    int b = 5;\nint result = a + b;\n\ncout << result;\n```\n\n![](img/840275566c862102888f27d8ae2ac921_68_0.png)\n\
    \n# STEP 6\n\nSpecific to C++, you can also use the following to assign values\
    \ to a variable as soon as you declare them:\n\n```\nint a (10);\nint b (5);\n\
    ```\n\nThen, from the C++ 2011 standard, using curly brackets:\n\n```\nint result\
    \ {a+b};\n```\n\n![](img/840275566c862102888f27d8ae2ac921_68_1.png)\n\n# STEP\
    \ 7\n\nYou can create global variables, which are variables that are declared\
    \ outside any function and used in any function within the entire code. What you’ve\
    \ used so far are local variables: variables used inside the function. For example:\n\
    \n```\n#include <iostream>\nusing namespace std;\nint StartLives = 3;\n\nint main\
    \ ()\n{\n    StartLives = StartLives - 1;\n    cout << StartLives;\n}\n```\n\n\
    ![](img/840275566c862102888f27d8ae2ac921_68_2.png)\n\n# STEP 8\n\nThe previous\
    \ step creates the variable StartLives, which is a global variable. In a game,\
    \ for example, a player’s lives go up or down depending on how well or how bad\
    \ they’re doing. When the player restarts the game, the StartLives returns to\
    \ its default state: 3. Here we’ve assigned 3 lives, then subtracted 1, leaving\
    \ 2 lives left.\n\n![](img/840275566c862102888f27d8ae2ac921_68_3.png)\n\n# STEP\
    \ 9\n\nThe modern C++ compiler is far more intelligent than most programmers give\
    \ it credit. While there are numerous data types you can declare for variables,\
    \ you can in fact use the auto feature:\n\n```\n#include <iostream>\nusing namespace\
    \ std;\nauto pi = 3.141593;\n\nint main()\n{\n    double area, radius = 1.5;\n\
    \    area = pi * radius * radius;\n    cout << area;\n}\n```\n\n![](img/840275566c862102888f27d8ae2ac921_68_4.png)\n\
    \n# STEP 10\n\nA couple of new elements here: first, auto won’t work unless you\
    \ go to Settings > Compiler and tick the box labelled ‘Have G++ follow the C++11\
    \ ISO C++ Language Standard [-std=c++11]’. Then, the new data type, double, which\
    \ means double-precision floating point value. Enable C++11, then build and run\
    \ the code. The result should be 7.06858.\n\n![](img/840275566c862102888f27d8ae2ac921_68_5.png)"
  merge: -1
  img_proc: true
- pgno: 69
  md: "# Data Types\n\nVariables, as we've seen, store information that the programmer\
    \ can then later call up, and manipulate if required. Variables are simply reserved\
    \ memory locations that store the values the programmer assigns, depending on\
    \ the data type used.\n\n# THE VALUE OF DATA\n\nThere are many different data\
    \ types available for the programmer in C++, such as an integer, floating point,\
    \ Boolean, character and so on. It's widely accepted that there are seven basic\
    \ data types, often called Primitive Built-In Types; however, you can create your\
    \ own data types should the need ever arise within your code.\n\nThe seven basic\
    \ data types are:\n\n| TYPE | COMMAND |\n|---|---|\n| Integer | Integer |\n| Floating\
    \ Point | float |\n| Character | char |\n| Boolean | bool |\n| Double Floating\
    \ Point | double |\n| Wide Character | wchar_t |\n| No Value | void |\n\nThese\
    \ basic types can also be extended using the following modifiers: Long, Short,\
    \ Signed and Unsigned. Basically this means the modifiers can expand the minimum\
    \ and maximum range values for each data type. For example, the int data type\
    \ has a default value range of -2147483648 to 2147483647, a fair value, you would\
    \ agree.\n\nNow, if you were to use one of the modifiers, the range alters:\n\n\
    +   Unsigned int = 0 to 4294967295\n+   Signed int = -2147483648 to 2147483647\n\
    +   Short int = -32768 to 32767\n+   Unsigned Short int = 0 to 65535\n+   Signed\
    \ Short int = -32768 to 32767\n+   Long int = -2147483647 to 2147483647\n+   Signed\
    \ Long int = -2147483647 to 2147483647\n+   Unsigned Long int = 0 to 4294967295\n\
    \nNaturally you can get away with using the basic type without the modifier, as\
    \ there's plenty of range provided with each data type. However, it's considered\
    \ good C++ programming practise to use the modifiers when possible.\n\nThere are\
    \ issues when using the modifiers though. Double represents a double-floating\
    \ point value, which you can use for\n\nincredibly accurate numbers but those\
    \ numbers are only accurate up to the fifteenth decimal place. There's also the\
    \ problem when displaying such numbers in C++ using the cout function, in that\
    \ cout by default only outputs the first five decimal places. You can combat that\
    \ by adding a cout.precision() function and adding a value inside the brackets,\
    \ but even then you're still limited by the accuracy of the double data type.\
    \ For example, try this code:\n\n```\n#include <iostream>\nusing namespace std;\n\
    double PI = 3.141592653589793238463;\nint main()\n{\n    cout << PI;\n}\n```\n\
    \n![](img/840275566c862102888f27d8ae2ac921_69_0.png)\n\nBuild and run the code\
    \ and as you can see the output is only 3.14159, representing cout's limitations\
    \ in this example.\n\nYou can also alter the code including the aforementioned\
    \ cout.precision function, for greater accuracy. Take precision all the way up\
    \ to 22 decimal places, with the following code:\n\n```\n#include <iostream>\n\
    using namespace std;\ndouble PI = 3.141592653589793238463;\nint main()\n```"
  merge: -1
