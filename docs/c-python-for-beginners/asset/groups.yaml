    \ you arrive at 15.142857 recurring, which is 15-digits of precision.\n\nTo be\
    \ honest, if you’re creating code that needs to be accurate to more than fifteen\
    \ decimal places, then you wouldn’t be using C++, you would use some scientific\
    \ specific language with C++ as the connective tissue between the two languages.\n\
    \nYou can create your own data types, using an alias-like system called typedef.\
    \ For example:\n\n![](img/840275566c862102888f27d8ae2ac921_70_1.png)\n\nAgain,\
    \ build and run the code; as you can see from the command line window, the number\
    \ represented by the variable PI is different to the number you’ve told C++ to\
    \ use in the variable. The output reads the value of PI as 3.141592653589793115998,\
    \ with the numbers going awry from the fifteenth decimal place.\n\n![](img/840275566c862102888f27d8ae2ac921_70_2.png)\n\
    \n![](img/840275566c862102888f27d8ae2ac921_70_3.png)\n\n```\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\ntypedef int metres;\n\nint main()\n{\n   \
    \ metres distance;\n    distance = 15;\n    cout << \"distance in metres is: \"\
    \ << distance;\n}\n```\n```\n\n![](img/840275566c862102888f27d8ae2ac921_70_4.png)\n\
    \nThis code when executed creates a new int data type called metres. Then, in\
    \ the main code block, there’s a new variable called distance, which is an integer;\
    \ so you’re basically telling the compiler that there’s another name for int.\
    \ We assigned the value 15 to distance and displayed the output: distance in metres\
    \ is 15.\n\nIt might sound a little confusing to begin with but the more you use\
    \ C++ and create your own code, the easier it becomes."
  - "[PAGE 71]\n\n# Strings\n\nStrings are objects that represent and hold sequences\
    \ of characters. For example, you could have a universal greeting in your code\
    \ “Welcome” and assign that as a string to be called up whenever you like in the\
    \ program.\n\n# STRING THEORY\n\nThere are different ways in which you can create\
    \ a string of characters, which historically are all carried over from the original\
    \ C language, and are still supported by C++.\n\n**STEP 1** To create a string\
    \ you use the char function. Open a new C++ file and begin with the usual header:\n\
    \n```\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main ()\n{\n}\n\
    ```\n```\n\n![](img/840275566c862102888f27d8ae2ac921_71_0.png)\n\n**STEP 2** It’s\
    \ easy to confuse a string with an array. Here’s an array, which can be terminated\
    \ with a null character:\n\n```\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nint main ()\n{\n    char greet[8] = {'W', 'e', 'l', 'c', 'o', 'm', 'e',\
    \ '\\0'};\n    cout << greet << \"\\n\";\n}\n```\n```\n\n![](img/840275566c862102888f27d8ae2ac921_71_1.png)\n\
    \n**STEP 3** Build and run the code, and ‘Welcome’ appears not a string. A string\
    \ is a class, which defines objects that can be represented as a stream of characters\
    \ and doesn’t need to be terminated like an array. The code can therefore be represented\
    \ as:\n\n```\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main ()\n\
    {\n    char greet[] = \"Welcome\";\n    cout << greet << \"\\n\";\n}\n```\n```\n\
    \n![](img/840275566c862102888f27d8ae2ac921_71_2.png)\n\n**STEP 4** In C++ there’s\
    \ also a string function, which works in much the same way. Using the greeting\
    \ code again, you can enter:\n\n```\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nint main ()\n{\n    string greet = \"Welcome\";\n    cout << greet <<\
    \ \"\\n\";\n}\n```\n```\n\n![](img/840275566c862102888f27d8ae2ac921_71_3.png)"
  - "[PAGE 72]\n\n# STEP 5\n\nThere are also many different operations that you can\
    \ apply with the string function. For instance, to get the length of a string\
    \ you can use:\n\n```\n```cpp\n#include <iostream>\nusing namespace std;\nint\
    \ main ()\n{\n    string greet = \"Welcome\";\n    cout << \"The length of the\
    \ string is: \";\n    cout << greet.size() << \"\\n\";\n}\n```\n```\n\n![](img/840275566c862102888f27d8ae2ac921_72_0.png)\n\
    \n# STEP 6\n\nYou can see that we used greet.size() to output the length, the\
    \ number of characters there are, of the contents of the string. Naturally, if\
    \ you call your string something other than greet, then you need to change the\
    \ command to reflect this. It's always stringname.operation. Build and run the\
    \ code to see the results.\n\n![](img/840275566c862102888f27d8ae2ac921_72_1.png)\n\
    \n# STEP 7\n\nYou can of course add strings together, or rather combine them to\
    \ form longer strings:\n\n```\n```cpp\n#include <iostream>\nusing namespace std;\n\
    int main ()\n{\n    string greet1 = \"Hello\";\n    string greet2 = \", world!\"\
    ;\n    string greet3 = greet1 + greet2;\n    cout << greet3 << \"\\n\";\n}\n```\n\
    ```\n\n![](img/840275566c862102888f27d8ae2ac921_72_2.png)\n\n# STEP 8\n\nJust\
    \ as you might expect, you can mix in an integer and store something to do with\
    \ the string. In this example, we created int length, which stores the result\
    \ of string.size() and outputs it to the user.\n\n```\n```cpp\n#include <iostream>\n\
    using namespace std;\nint main ()\n{\n    int length;\n    string greet1 = \"\
    Hello\";\n    string greet2 = \", world!\";\n    string greet3 = greet1 + greet2;\n\
    \    length = greet3.size();\n    cout << \"The length of the combined strings\
    \ is: \" << length << \"\\n\";\n}\n```\n```\n\n# STEP 9\n\nUsing the available\
    \ operations that come with the string function, you can manipulate the contents\
