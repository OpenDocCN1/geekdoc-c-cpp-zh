    \ 1** 让我们创建一个新的 Python 程序，它会要求用户输入一个单词，然后检查它是否为四字母单词。从“文件”>“新建文件”开始，并以下面的输入变量开头：\n\
    \n  ```python\n  word = input(\"Please enter a four-letter word: \")\n  ```\n\n\
    \  ![](img/840275566c862102888f27d8ae2ac921_39_0.png)\n\n- **步骤 2** 现在我们可以创建一个新变量，然后使用\
    \ len 函数并将 word 变量传递给它，以获取用户输入的字母总数：\n\n  ```python\n  word = input(\"Please enter\
    \ a four-letter word: \")\n  word_length = len(word)\n  ```\n\n  ![](img/840275566c862102888f27d8ae2ac921_39_1.png)\n\
    \n- **步骤 3** 现在你可以使用 if 语句来检查 word_length 变量是否等于 4，如果符合规则，则打印一条友好的确认信息：\n\n  ```python\n\
    \  word = input(\"Please enter a four-letter word: \")\n  word_length = len(word)\n\
    \  if word_length == 4:\n      print(word, \"is a four-letter word. Well done.\"\
    )\n  ```\n\n  双等号（==）表示检查某个值是否等于另一个值。\n\n  ![](img/840275566c862102888f27d8ae2ac921_39_2.png)\n\
    \n- **步骤 4** if 语句末尾的冒号告诉 Python：如果这个语句为真，就执行冒号后面所有缩进的内容。接下来，将光标移回编辑器开头：\n\n \
    \ ```python\n  word = input(\"Please enter a four-letter word: \")\n  word_length\
    \ = len(word)\n  if word_length == 4:\n      print(word, \"is a four-letter word.\
    \ Well done.\")\n  else:\n      print(word, \"is not a four-letter word.\")\n\
    \  ```\n\n  ![](img/840275566c862102888f27d8ae2ac921_39_3.png)\n\n- **步骤 5** 按\
    \ F5 并保存代码以执行它。先在 Shell 中输入一个四字母单词，你应该会收到返回的消息，说这个单词是四个字母。现在再次按 F5 重新运行程序，但这次输入一个五字母单词。Shell\
    \ 将显示它不是四字母单词。\n\n  ![](img/840275566c862102888f27d8ae2ac921_40_0.png)\n\n- **步骤\
    \ 6** 现在扩展代码以包含另一个条件。最终，它可能会变得相当复杂。我们为三个字母的单词添加了一个条件：\n\n  ```python\n  word =\
    \ input(\"Please enter a four-letter word: \")\n  word_length = len(word)\n  if\
    \ word_length == 4:\n      print(word, \"is a four-letter word. Well done.\")\n\
    \  elif word_length == 3:\n      print(word, \"is a three-letter word. Try again.\"\
    )\n  else:\n      print(word, \"is not a four-letter word.\")\n  ```\n\n  ![](img/840275566c862102888f27d8ae2ac921_40_1.png)\n\
    \n### 循环\n\n循环看起来与条件非常相似，但它们的操作方式有所不同。循环会多次运行同一段代码，通常借助条件来控制。\n\n- **步骤 1** 让我们从一个简单的\
    \ While 语句开始。与 if 一样，它会检查某事是否为真，然后运行缩进的代码：\n\n  ```python\n  x = 1\n  while x\
    \ < 10:\n      print(x)\n      x = x + 1\n  ```\n\n  ![](img/840275566c862102888f27d8ae2ac921_40_2.png)\n\
    \n- **步骤 2** if 和 while 之间的区别在于，当 while 到达缩进代码的末尾时，它会返回并检查该语句是否仍然为真。在我们的示例中，x\
    \ 小于 10。每次循环它都会打印 x 的当前值，然后将该值加 1。当 x 最终等于 10 时，循环停止。\n\n  ![](img/840275566c862102888f27d8ae2ac921_40_4.png)\n\
    \n- **步骤 3** For 循环是另一个例子。For 用于遍历一系列数据，通常是存储在方括号中变量形式的列表。例如：\n\n  ```python\n\
    \  words = [\"Cat\", \"Dog\", \"Unicorn\"]\n\n  for word in words:\n      print(word)\n\
    \  ```\n\n  ![](img/840275566c862102888f27d8ae2ac921_40_3.png)\n\n- **步骤 4** For\
    \ 循环也可以使用 range 函数来实现倒计时示例：\n\n  ```python\n  for x in range(1, 10):\n      print(x)\n\
    \  ```\n\n  这里不需要 x=x+1 这部分，因为 range 函数会在第一个和最后一个数字之间创建一个列表。\n\n  ![](img/840275566c862102888f27d8ae2ac921_40_5.png)\n\
    \n"
