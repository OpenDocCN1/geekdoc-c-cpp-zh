    # How to Set Up C++ in Windows


    Windows users have a wealth of choice when it comes to programming in C++. There
    are plenty of IDEs and compilers available, including Visual Studio from Microsoft.
    However, in our opinion, the best C++ IDE to begin with is Code::Blocks.


    # CODE::BLOCKS


    Code::Blocks is a free C++, C and Fortran IDE that''s feature rich and easily
    extendible with plug-ins. It’s easy to use, comes with a compiler and has a vibrant
    community behind it.


    +   **STEP 1** Start by visiting the Code::Blocks download site, at www.codeblocks.org/downloads.
    From there, click on the ‘Download the binary releases’ link to be taken to the
    latest downloadable version for Windows.


    ![](img/840275566c862102888f27d8ae2ac921_49_0.png)


    +   **STEP 2** You can see that there are several Windows versions available.
    The one you want to download has ‘mingw-setup.exe’ at the end of the current version
    number. At the time of writing this is: codeblocks-17.12mingw-setup.exe. The difference
    is that the mingw-setup version includes a C++ compiler and debugger from TDM-GCC
    (a compiler suite).


    ![](img/840275566c862102888f27d8ae2ac921_49_1.png)


    +   **STEP 3** When you’ve located the file, click on the download link in the
    end of the line and a download notification window appears; click on Save File
    to start the download and save the executable to your PC. Locate the downloaded
    Code::Blocks installer and double-click to start. Follow the on-screen instructions
    to begin the installation.


    ![](img/840275566c862102888f27d8ae2ac921_49_2.png)


    +   **STEP 4** Once you’ve agreed to the licencing terms, there is a choice of
    installation options available. You can opt for a smaller install, missing out
    on some of the components but we would recommend you opt for the Full option as
    default.


    ![](img/840275566c862102888f27d8ae2ac921_49_3.png)'
  - '[PAGE 50]


    # STEP 5


    Next choose an install location for the Code::Blocks files. It’s your choice,
    but the default will generally suffice, unless of course you have any special
    requirements. When you click Next, the install begins; when it’s finished a notification
    pops up asking you if you want to start Code::Blocks now, so click Yes.


    ![](img/840275566c862102888f27d8ae2ac921_50_0.png)


    # STEP 8


    Before you start using Code::Blocks it’s worth explaining exactly why you need
    the added compiler. First, a compiler is a separate program that reads through
    your C++ code and checks it against the latest acceptable programming standards;
    this is why you need the most recently available compiler. This is currently C++17,
    with C++20 underway.


    ![](img/840275566c862102888f27d8ae2ac921_50_1.png)


    # STEP 6


    The first time Code::Blocks loads it runs an auto-detect for any C++ compilers
    you may already have installed on your system. If you don’t have any, click on
    the first detected option, GNU GCC Compiler, and click the Default button to set
    it as the system’s C++ compiler. Click OK when you’re ready to continue.


    ![](img/840275566c862102888f27d8ae2ac921_50_2.png)


    # STEP 9


    Essentially, computers work and understand only binary, ones and zeros, or Machine
    Language. Programming in binary isn’t effective for human beings. For example,
    to output the words “Hello World!” to the screen in C++ would appear in binary
    as:


    ```

    0100011 0110111 01110101 01110100 0100000

    0011100 0101111 00100000 01000101 00100000

    0101011 01001111 00100000 0101100 00110000

    0101101 0101111 00100100 01101111 01000000

    0010111 0010011 01100101 01110100 01000000

    0010001 01000110 00111111

    ```


    ![](img/840275566c862102888f27d8ae2ac921_50_3.png)


    # STEP 7


    When the program starts another message appears, informing you that Code::Blocks
    is currently not the default application for C++ files. You a couple of options;
    to leave everything as it is or allow Code::Blocks to associate all C++ file types.
    Again, we would recommend you opt for the last choice to associate Code::Blocks
    with every supported file type.


    ![](img/840275566c862102888f27d8ae2ac921_50_4.png)


    # STEP 10


    The compiler therefore takes what you’ve entered as C++ code and translates that
    to Machine Language. To execute C++ code the IDE builds the code, checking for
    errors, then pass it through the compiler to check standardisation and convert
    it to ones and zeros for the computer to act upon. It’s rather clever stuff, when
    you stop to think about it.


    ![](img/840275566c862102888f27d8ae2ac921_50_5.png)'
