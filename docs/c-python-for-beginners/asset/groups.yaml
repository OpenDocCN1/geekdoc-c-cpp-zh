  mdcn: "\n### 第 5 步\n\n在命令行框中按任意键即可关闭它，并返回到 Code::Blocks。我们来稍微修改一下代码。在 `#include`\
    \ 行下面输入：\n\n```\nusing namespace std;\n```\n\n然后，删除 cout 行中的 `std::` 部分；如下所示：\n\
    \n```\ncout << \"Hello, world!\\n\";\n```\n\n![](img/840275566c862102888f27d8ae2ac921_64_0.png)\n\
    \n### 第 8 步\n\n在代码中故意制造一个错误。删除 `cout` 行中的分号，使其变为：\n\n```\ncout << \"Hello, world!\\\
    n\"\n```\n\n![](img/840275566c862102888f27d8ae2ac921_64_1.png)\n\n### 第 6 步\n\n\
    为了将新更改应用到代码中，你需要重新编译、构建并再次运行它。不过，这一次你可以直接单击“构建/运行”图标，也就是组合在一起的黄色齿轮和绿色播放按钮。\n\n\
    ![](img/840275566c862102888f27d8ae2ac921_64_2.png)\n\n### 第 9 步\n\n现在再次单击“构建并运行”图标，将更改应用到代码中。这一次，由于你加入的错误，Code::Blocks\
    \ 拒绝执行代码。在屏幕底部的日志窗格中会告知你错误，此例中为：在 `}` 标记之前需要 `;`，表示缺少分号。\n\n![](img/840275566c862102888f27d8ae2ac921_64_3.png)\n\
    \n### 第 7 步\n\n正如我们在前面几页提到的，如果你已经在代码开头使用了 using namespace std;，就不需要写 `std::cout`。我们本可以一开始就轻松单击“构建/运行”图标，但值得把可用选项都过一遍。你还可以看到，通过构建并运行，文件已经被保存。\n\
    \n![](img/840275566c862102888f27d8ae2ac921_64_4.png)\n\n### 第 10 步\n\n恢复分号，并在\
    \ cout 行下面向代码中输入新的一行：\n\n```\ncout << \"And greetings from C++!\\n\";\n```\n\n\
    `\\n` 只是在上一条输出文本的下一行添加一个新行。构建并运行代码，以显示你的成果。\n\n![](img/840275566c862102888f27d8ae2ac921_64_5.png)\n\
    \n## 使用注释\n\n虽然注释对于组成游戏、应用程序甚至整个操作系统的许多行代码来说似乎只是一个小元素，但实际上它们很可能是最重要的因素之一。\n\n\
    ### 注释的重要性\n\n代码中的注释基本上是对代码在该特定位置正在做什么的人类可读描述。它们听起来并不特别重要，但没有注释的代码是编程中众多令人沮丧的方面之一，无论你是专业人士还是刚刚入门。\n\
    \n简而言之，所有代码都应当以能够有效描述某一行、某一部分或各个元素用途的方式进行注释。你应该养成尽可能多写注释的习惯，可以想象一个对编程一无所知的人拿起你的代码，仅通过阅读注释就能理解它要做什么。\n\
    \n在专业环境中，注释对代码的成功至关重要，并最终关系到公司的成功。在一个组织中，许多程序员会与工程师、其他开发人员、硬件分析师等组成团队一起工作。如果你是为公司编写定制软件团队的一员，那么一旦出问题，你的注释能帮助节省大量时间，让另一位团队成员可以接手并顺着线索定位问题。\n\
    \n设身处地想一想，假如你的工作就是找出程序哪里出了问题。这个程序有超过 800,000 行代码，分布在多个不同模块中。你很快就能体会到，需要原始程序员以良好注释的形式提供一点帮助。\n\
    \n![](img/840275566c862102888f27d8ae2ac921_65_0.png)\n\n最好的注释总是简洁的，并在逻辑上与代码关联，详细说明当程序执行到这一行或这一部分时会发生什么。你不需要对每一行都加注释。大致来说：if\
    \ x==0 并不需要你注释说“如果 x 等于零，就做某事”；这对读者来说显而易见。然而，如果 x 等于零会大幅改变程序对用户的状态，例如玩家已经用完生命，那么它当然需要注释。\n\
    \n即使代码是你自己写的，你也应该像要公开分享给他人一样编写注释。这样，当你回到那段代码时，就能始终理解自己做了什么、哪里出了问题，或者什么方法效果非常好。\n\
    \n注释是良好的实践；一旦你理解如何在需要的地方添加注释，很快你就会像本能一样去做。\n\n```\n; Some random point\nSTART:\
    \ MOV A, #0\n        LD  (ADDR), A\n        LD  B, #40h\n        LD  (ADDR2),\
    \ A\n        LD  A, 2\n        LD  (ADDR3), A\n        LD  B, #30h\n        LD\
    \  (ADDR4), A\n        LD  A, 2\n        ...\n```\n\n## C++ 注释\n\n在 C++ 中注释会使用双正斜杠“//”，或者正斜杠加星号“/*”。你已经看过一些简短示例，下面说明它们如何工作。\n\
    \n### 第 1 步\n\n以 Hello World 代码为例，你可以使用双正斜杠轻松地注释代码的不同部分：\n\n```cpp\n//My first\
    \ C++ program\ncout << \"Hello, world!\\n\";\n```\n\n![](img/840275566c862102888f27d8ae2ac921_66_0.png)\n\
    \n### 第 4 步\n\n注释时要小心，尤其是块注释。很容易忘记添加结束的星号和正斜杠，从而使落入注释块内的任何代码失效。\n\n![](img/840275566c862102888f27d8ae2ac921_66_1.png)\n\
    \n### 第 2 步\n\n不过，你也可以在代码行的末尾添加注释，以更好地描述正在发生什么：\n\n```cpp\ncout << \"Hello, world!\\\
    n\"; //This line outputs the words 'Hello, world!'. The \\n denotes a new line.\
    \ Note you don't have to put a semicolon at the end of a comment. This is because\
    \ it's a line in the code that's ignored by the compiler.\n```\n\n![](img/840275566c862102888f27d8ae2ac921_66_2.png)\n\
    \n### 第 5 步\n\n显然，如果你尝试构建并执行代码，它会报错，提示缺少花括号。要补全代码块，如果你已经犯过几次这种错误，那么回头修正可能会很耗时。幸好，Code::Blocks\
    \ 中的颜色编码有助于区分注释和代码。\n\n![](img/840275566c862102888f27d8ae2ac921_66_3.png)\n\n\
    ### 第 3 步\n\n你可以使用正斜杠和星号注释掉多行：\n\n```cpp\n/* This comment can\ncover several lines\n\
    without the need to add more slashes */\n```\n\n只需记住用相反顺序的星号和正斜杠结束块注释。\n\n![](img/840275566c862102888f27d8ae2ac921_66_4.png)\n\
    \n### 第 6 步\n\n如果你使用块注释，在 C++ 中良好的做法是在注释块的每一新行前添加一个星号。这也有助于你记得在继续编写代码之前关闭注释块：\n\
    \n```cpp\n/* This comment can\n * cover several lines\n * without the need to\
    \ add more slashes */\n```\n\n![](img/840275566c862102888f27d8ae2ac921_66_5.png)\n\
    \n### 第 5 步\n\n你可以在声明变量的同时就为其赋值。你输入的代码也可以改为如下所示：\n\n```\nint a = 10;\nint b =\
    \ 5;\nint result = a + b;\n\ncout << result;\n```\n\n![](img/840275566c862102888f27d8ae2ac921_68_0.png)\n\
    \n### 第 6 步\n\n具体到 C++，你也可以在声明变量的同时使用以下方式为其赋值：\n\n```\nint a (10);\nint b (5);\n\
    ```\n\n然后，从 C++ 2011 标准开始，可以使用花括号：\n\n```\nint result {a+b};\n```\n\n![](img/840275566c862102888f27d8ae2ac921_68_1.png)\n\
    \n### 第 7 步\n\n你可以创建全局变量，即在任何函数之外声明、并可在整个代码中的任何函数里使用的变量。到目前为止你使用的是局部变量：在函数内部使用的变量。例如：\n\
    \n```\n#include <iostream>\nusing namespace std;\nint StartLives = 3;\n\nint main\
    \ ()\n{\n    StartLives = StartLives - 1;\n    cout << StartLives;\n}\n```\n\n\
    ![](img/840275566c862102888f27d8ae2ac921_68_2.png)\n\n### 第 8 步\n\n上一步创建了变量 StartLives，它是一个全局变量。例如，在游戏中，玩家的生命数会根据他们表现的好坏而增加或减少。当玩家重新开始游戏时，StartLives\
    \ 会恢复到默认状态：3。这里我们分配了 3 条命，然后减去 1，剩下 2 条命。\n\n![](img/840275566c862102888f27d8ae2ac921_68_3.png)\n\
    \n### 第 9 步\n\n现代 C++ 编译器比大多数程序员所认为的要智能得多。虽然你可以为变量声明许多数据类型，但实际上你可以使用 auto 特性：\n\
    \n```\n#include <iostream>\nusing namespace std;\nauto pi = 3.141593;\n\nint main()\n\
    {\n    double area, radius = 1.5;\n    area = pi * radius * radius;\n    cout\
    \ << area;\n}\n```\n\n![](img/840275566c862102888f27d8ae2ac921_68_4.png)\n\n###\
    \ 第 10 步\n\n这里有几个新元素：首先，除非你转到“设置 > 编译器”并勾选标有‘Have G++ follow the C++11 ISO C++\
    \ Language Standard [-std=c++11]’的复选框，否则 auto 不会生效。然后是新的数据类型 double，它表示双精度浮点值。启用\
    \ C++11，然后构建并运行代码。结果应为 7.06858。\n\n![](img/840275566c862102888f27d8ae2ac921_68_5.png)\n"
