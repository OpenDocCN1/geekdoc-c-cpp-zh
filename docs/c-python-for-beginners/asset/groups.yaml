    ### STEP 4\n\nYou can also combine variables within another variable. For example,\
    \ to combine both name and title variables into a new variable we use: `character=name\
    \ + \": \" + title`. Then output the content of the new variable as: `print (character)`.\
    \ Numbers are stored as different variables: `age=44`, `type(age)`. Which, as\
    \ we know, are integers.\n\n![](img/840275566c862102888f27d8ae2ac921_33_3.png)\n\
    \n### STEP 5\n\nHowever, you can’t combine both strings and integer type variables\
    \ in the same command, as you would a set of similar variables. You need to either\
    \ turn one into the other or vice versa. When you do try to combine both, you\
    \ get an error message:\n\n```python\nprint (name + age)\n```\n\n![](img/840275566c862102888f27d8ae2ac921_34_0.png)\n\
    \n### STEP 6\n\nThis is a process known as TypeCasting. The Python code is:\n\n\
    ```python\nprint (character + \" is \" + str(age) + \" years old.\")\n```\n\n\
    or you can use:\n\n```python\nprint (character, \"is\", age, \"years old.\")\n\
    ```\n\nNotice again that in the last example, you don’t need the spaces between\
    \ the words in quotes as the commas treat each argument to print separately.\n\
    \n![](img/840275566c862102888f27d8ae2ac921_34_1.png)\n\n### STEP 7\n\nAnother\
    \ example of TypeCasting is when you ask for input from the user, such as a name.\
    \ For example, enter:\n\n```python\nage = input(\"How old are you?\")\n```\n\n\
    All data stored from the Input command is stored as a string variable.\n\n![](img/840275566c862102888f27d8ae2ac921_34_2.png)\n\
    \n### STEP 8\n\nThis presents a bit of a problem when you want to work with a\
    \ number that’s been inputted by the user, as age + 10 won’t work due to being\
    \ a string variable and an integer. Instead, you need to enter:\n\n```python\n\
    int(age) + 10\n```\n\nThis will TypeCast the age string into an integer that can\
    \ be worked with.\n\n![](img/840275566c862102888f27d8ae2ac921_34_3.png)\n\n###\
    \ STEP 9\n\nThe use of TypeCasting is also important when dealing with floating\
    \ point arithmetic; remember numbers that have a decimal point in them. For example,\
    \ enter:\n\n```python\nshirt=19.99\n```\n\nNow enter `type(shirt)` and you’ll\
    \ see that Python has allocated the number as a ‘float’, because the value contains\
    \ a decimal point.\n\n![](img/840275566c862102888f27d8ae2ac921_34_4.png)\n\n###\
    \ STEP 10\n\nWhen combining integers and floats Python usually converts the integer\
    \ to a float, but should the reverse ever be applied it’s worth remembering that\
    \ Python doesn’t return the exact value. When converting a float to an integer,\
    \ Python will always round down to the nearest integer, called truncating; in\
    \ our case instead of 19.99 it becomes 19.\n\n![](img/840275566c862102888f27d8ae2ac921_34_5.png)\n\
    \n## # User Input\n\nWe've seen some basic user interaction with the code from\
    \ a few of the examples earlier, so now would be a good time to focus solely on\
    \ how you would get information from the user then store and present it.\n\n###\
    \ ## USER FRIENDLY\n\nThe type of input you want from the user will depend greatly\
    \ on the type of program you're coding. For example, a game may ask for a character's\
    \ name, whereas a database can ask for personal details.\n\n### STEP 1\n\nIf it's\
    \ not already, open the Python 3 IDLE Shell, and start a New File in the Editor.\
    \ Let's begin with something really simple, enter:\n\n```python\nprint(\"Hello\"\
    )\nfirstname=input(\"What is your first name? \")\nprint(\"Thanks.\")\nsurname=input(\"\
    And what is your surname? \")\n```\n\n![](img/840275566c862102888f27d8ae2ac921_35_0.png)\n\
    \n### STEP 3\n\nNow that we have the user's name stored in a couple of variables\
    \ we can call them up whenever we want:\n\n```python\nprint(\"Welcome\", firstname,\
    \ surname, \". I hope you're well today.\")\n```\n\n![](img/840275566c862102888f27d8ae2ac921_35_1.png)\n\
    \n### STEP 2\n\nSave and execute the code, and as you already no doubt suspected,\
    \ in the IDLE Shell the program will ask for your first name, storing it as the\
    \ variable firstname, followed by your surname; also stored in its own variable\
    \ (surname).\n\n![](img/840275566c862102888f27d8ae2ac921_35_2.png)\n\n### STEP\
    \ 4\n\nRun the code and you can see a slight issue, the full stop after the surname\
    \ follows a blank space. To eliminate that we can add a plus sign instead of the\
    \ comma in the code:\n\n```python\nprint(\"Welcome\", firstname, surname+\". I\
    \ hope you're well today.\")\n```\n\n![](img/840275566c862102888f27d8ae2ac921_35_3.png)\n\
    \n### STEP 5\n\nYou don’t always have to include quoted text within the input\
    \ command. For example, you can ask the user their name, and have the input in\
    \ the line below:\n\n```python\nprint(\"Hello. What's your name?\")\nname=input()\n\
    ```\n\n![](img/840275566c862102888f27d8ae2ac921_36_0.png)\n\n### STEP 8\n\nWhat\
    \ you’ve created here is a condition, which we will cover soon. In short, we’re\
    \ using the input from the user and measuring it against a condition. So, if the\
    \ user enters David as their name, the guard will allow them to pass unhindered.\
    \ Else, if they enter a name other than David, the guard challenges them to a\
    \ fight.\n\n![](img/840275566c862102888f27d8ae2ac921_36_1.png)\n\n### STEP 6\n\
    \nThe code from the previous step is often regarded as being a little neater than\
    \ having a lengthy amount of text in the input command, but it’s not a rule that’s\
    \ set in stone, so do as you like in these situations. Expanding on the code,\
    \ try this:\n\n```python\nprint(\"Halt! Who goes there?\")\nname=input()\n```\n\
    \n![](img/840275566c862102888f27d8ae2ac921_36_2.png)\n\n### STEP 9\n\nJust as\
    \ you learned previously, any input from a user is automatically a string, so\
    \ you need to apply a TypeCast in order to turn it into something else. This creates\
    \ some interesting additions to the input command. For example:\n\n```python\n\
    # Code to calculate rate and distance\nprint(\"Input a rate and distance\")\n\
    rate = float(input(\"Rate: \"))\n```\n\n![](img/840275566c862102888f27d8ae2ac921_36_3.png)\n\
    \n### STEP 7\n\nIt’s a good start to a text adventure game, perhaps? Now you can\
    \ expand on it and use the raw input from the user to flesh out the game a little:\n\
    \n```python\nif name==\"David\":\n    print(\"Welcome, good sir. You may pass.\"\
    )\nelse:\n    print(\"I know you not. Prepare for battle!\")\n```\n\n![](img/840275566c862102888f27d8ae2ac921_36_4.png)\n\
    \n### STEP 10\n\nTo finalise the rate and distance code, we can add:\n\n```python\n\
    distance = float(input(\"Distance: \"))\nprint(\"Time:\", (distance / rate))\n\
    ```\n\nSave and execute the code and enter some numbers. Using the `float(input())`\
    \ element, we’ve told Python that any entered number is a floating point number\
    \ rather than a string.\n\n![](img/840275566c862102888f27d8ae2ac921_36_5.png)\n"
