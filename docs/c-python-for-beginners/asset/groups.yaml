    \    print(a+b)\n    ```\n\n  这段代码只是取 a 和 b 的值，将它们相加并输出结果。\n\n  ![](img/840275566c862102888f27d8ae2ac921_24_1.png)\n\
    \n- **第 7 步** 你可以尝试不同种类的变量和 print 函数。例如，你可以为某人的名字分配变量：\n\n    ```python\n    name=\"\
    David\"\n    print(name)\n    ```\n\n  ![](img/840275566c862102888f27d8ae2ac921_24_2.png)\n\
    \n- **第 8 步** 现在让我们添加一个姓氏：\n\n    ```python\n    surname=\"Hayward\"\n    print(surname)\n\
    \    ```\n\n  现在你有两个变量，分别包含名字和姓氏，并且可以独立打印它们。\n\n  ![](img/840275566c862102888f27d8ae2ac921_24_3.png)\n\
    \n- **第 9 步** 如果我们像之前那样使用 + 符号套用同样的流程，名字在 Shell 的输出中不会正确显示。试试看：\n\n    ```python\n\
    \    print(name+surname)\n    ```\n\n  你需要在两者之间加一个空格，将它们定义为两个独立的值，而不是进行数学运算的东西。\n\
    \n  ![](img/840275566c862102888f27d8ae2ac921_24_4.png)\n\n- **第 10 步** 在 Python\
    \ 3 中，你可以使用逗号将两个变量用空格分隔：\n\n    ```python\n    print(name, surname)\n    ```\n\
    \n  或者，你也可以自己添加空格：\n\n    ```python\n    print(name+\" \"+surname)\n    ```\n\n\
    \  如你所见，使用逗号要整洁得多。恭喜你，你已经迈入了广阔的 Python 世界的第一步。\n\n  ![](img/840275566c862102888f27d8ae2ac921_24_5.png)\n\
    \n## 保存并执行你的代码\n\n虽然对于小型代码片段来说，在 IDLE Shell 中工作完全没问题，但它并不是为输入较长的程序清单而设计的。在本节中，你将认识\
    \ IDLE Editor，从现在开始你将在其中工作。\n\n### 编辑代码\n\n你最终会达到一个阶段，必须从向 Shell 中输入单行代码过渡。相反，IDLE\
    \ Editor 将允许你保存并执行 Python 代码。\n\n- **第 1 步** 首先，打开 Python IDLE Shell，启动后点击 File\
    \ > New File。这会打开一个名为 Untitled 的新窗口。这就是 Python IDLE Editor，你可以在其中输入创建未来程序所需的代码。\n\
    \n  ![](img/840275566c862102888f27d8ae2ac921_25_0.png)\n\n- **第 2 步** 实际上，IDLE\
    \ Editor 就是一个带有 Python 功能、颜色编码等特性的简单文本编辑器；与 Sublime 非常相似。你可以像在 Shell 中一样输入代码，因此，以之前教程中的示例为例，输入：\n\
    \n    ```python\n    print(\"Hello everyone!\")\n    ```\n\n  ![](img/840275566c862102888f27d8ae2ac921_25_1.png)\n\
    \n- **第 3 步** 可以看到，IDLE Editor 中使用了与 Shell 相同的颜色编码，使你能够更好地理解代码的运行情况。不过，要执行代码，你需要先保存它。按\
    \ F5，会打开一个 Save... 对话框。\n\n  ![](img/840275566c862102888f27d8ae2ac921_25_2.png)\n\
    \n- **第 4 步** 在 Save 框中点击 OK 按钮，并选择保存所有 Python 代码的目标位置。目标位置可以是一个名为 Python 的专用文件夹，也可以随意放在你喜欢的地方。不过，记得保持驱动器整洁，以便将来方便管理。\n\
