  mdcn: "\n## 首次启动 Python\n\n我们将使用 Raspberry Pi 作为 Python 3 硬件平台。最新版本的 Raspbian 预装了\
    \ Python 3，确切地说是 3.4.2 版，因此只要你有一个 Python 3 Shell，我们所有的代码都能运行。\n\n### 启动 Python\n\
    \n我们不会详细介绍如何让 Raspberry Pi 启动并运行，因为关于这个主题已经有大量资料可供参考。不过，一旦准备就绪，就启动你的 Pi，准备开始编码吧。\n\
    \n- **第 1 步** 加载 Raspbian 桌面后，点击 Menu 按钮，然后选择 Programming > Python 3 (IDLE)。这会打开\
    \ Python 3 Shell。Windows 和 Mac 用户可以在 Windows 的“开始”按钮菜单中找到 Python 3 IDLE Shell，也可以通过\
    \ Finder 找到。\n\n  ![](img/840275566c862102888f27d8ae2ac921_21_0.png)\n\n- **第\
    \ 2 步** Shell 是你输入代码并查看输入到 Python 中的代码的响应和输出的地方。它有点像沙盒，你可以在其中尝试一些简单的代码和流程。\n\n\
    \  ![](img/840275566c862102888f27d8ae2ac921_21_2.png)\n\n- **第 3 步** 例如，在 Shell\
    \ 中输入：`2+2`。按下 Enter 后，下一行会显示答案：4。基本上，Python 接收了这段“代码”并生成了相应的输出。\n\n  ![](img/840275566c862102888f27d8ae2ac921_21_1.png)\n\
    \n- **第 4 步** Python Shell 的行为非常像计算器，因为代码本质上是一系列与系统进行的数学交互。整数是无限序列的整数，可以轻松进行加、减、乘等运算。\n\
    \n  ![](img/840275566c862102888f27d8ae2ac921_21_3.png)\n\n- **第 5 步** 虽然这很有趣，但并不是特别令人兴奋。相反，试试这个：\n\
    \n    ```python\n    print(\"Hello everyone!\")\n    ```\n\n  就像我们在本书“安装文本编辑器”一节中在\
    \ Sublime 里输入的代码一样。\n\n  ![](img/840275566c862102888f27d8ae2ac921_22_0.png)\n\n\
    - **第 6 步** 这更像样了，因为你刚刚生成了第一段代码。print 命令顾名思义，就是打印内容。Python 3 需要括号以及引号才能将内容输出到屏幕，在这个例子中是“Hello\
    \ everyone!”这部分。\n\n  ![](img/840275566c862102888f27d8ae2ac921_22_1.png)\n\n-\
    \ **第 7 步** 你可能已经注意到 Python IDLE 中的颜色编码。这些颜色代表 Python 代码的不同元素。它们是：\n\n  - 黑色 –\
    \ 数据与变量\n  - 绿色 – 字符串\n  - 紫色 – 函数\n  - 橙色 – 命令\n  - 蓝色 – 用户函数\n  - 深红色 – 注释\n\
    \  - 浅红色 – 错误消息\n\n### IDLE 颜色编码\n\n| 颜色 | 用途 | 示例 |\n|---|---|---|\n| 黑色 | 数据与变量\
    \ | `23.6` `area` |\n| 绿色 | 字符串 | `\"Hello World\"` |\n| 紫色 | 函数 | `len()` `print()`\
    \ |\n| 橙色 | 命令 | `for` `if` `else` |\n| 蓝色 | 用户函数 | `get_area()` |\n| 深红色 | 注释\
    \ | `#Remember VAT` |\n| 浅红色 | 错误消息 | `SyntaxError` |\n\n- **第 8 步** Python IDLE\
    \ 是一个可配置的环境。如果你不喜欢颜色的显示方式，可以随时通过 Options > Configure IDLE 并点击 Highlighting 选项卡来更改它们。不过，我们不建议这样做，因为这样你看到的将不会和我们的截图一样。\n\
    \n  ![](img/840275566c862102888f27d8ae2ac921_22_2.png)\n\n- **第 9 步** 就像大多数可用程序一样，无论使用哪种操作系统，都有大量快捷键可用。这里没有空间全部列出，但在\
    \ Options > Configure IDLE 下的 Keys 选项卡中，你可以看到当前键位绑定的列表。\n\n  ![](img/840275566c862102888f27d8ae2ac921_22_3.png)\n\
    \n- **第 10 步** Python IDLE 是一个强大的界面，而且它实际上是使用可用的 GUI 工具包之一用 Python 编写的。如果你想了解\
    \ Shell 的许多细节，我们建议你花几分钟查看 www.python.org/3/library/idle.html，其中详细介绍了 IDLE 的许多功能。\n\
    \n  ![](img/840275566c862102888f27d8ae2ac921_22_4.png)\n\n## 你的第一段代码\n\n本质上，你已经用上一教程中的\
    \ `print(\"Hello everyone!\")` 函数写下了第一段代码。不过，让我们扩展一下，看看如何输入代码并尝试一些其他 Python 示例。\n\
    \n### 玩转 Python\n\n对于大多数语言，无论是计算机语言还是人类语言，关键都在于记住并在正确的情境中使用正确的词语。你并非生来就认识这些词，所以需要学习它们。\n\
    \n- **第 1 步** 如果你已经关闭了 Python 3 IDLE，请重新打开它，无论你偏好哪个操作系统版本。在 Shell 中，输入以下熟悉的内容：\n\
    \n    ```python\n    print(\"Hello\")\n    ```\n\n  ![](img/840275566c862102888f27d8ae2ac921_23_0.png)\n\
    \n- **第 2 步** 正如预期的那样，单词 Hello 以蓝色文本出现在 Shell 中，表示来自字符串的输出。这相当简单，不需要太多解释。现在试试：\n\
    \n    ```python\n    print(\"2+2\")\n    ```\n\n  ![](img/840275566c862102888f27d8ae2ac921_23_1.png)\n\
    \n- **第 3 步** 可以看到，输出不是数字 4，而是你要求打印到屏幕上的 2+2。引号定义了要输出到 IDLE Shell 的内容；要打印 2+2\
    \ 的总和，需要去掉引号：\n\n    ```python\n    print(2+2)\n    ```\n\n  ![](img/840275566c862102888f27d8ae2ac921_23_2.png)\n\
    \n- **第 4 步** 你可以继续这样，将 2+2、464+2343 等打印到 Shell 中。更简单的方法是使用变量，我们稍后会深入介绍。现在，输入：\n\
    \n    ```python\n    a=2\n    b=2\n    ```\n\n  ![](img/840275566c862102888f27d8ae2ac921_23_3.png)\n\
    \n- **第 5 步** 你在这里做的是给字母 a 和 b 分别赋两个值：2 和 2。它们现在是变量，只要数值保持不变，Python 就可以调用它们来输出、相加、相减、相除等。试试这个：\n\
    \n    ```python\n    print(a)\n    print(b)\n    ```\n\n  ![](img/840275566c862102888f27d8ae2ac921_24_0.png)\n\
