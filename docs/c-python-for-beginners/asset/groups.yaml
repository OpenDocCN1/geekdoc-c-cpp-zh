    \n```\n```cpp\n#include <iostream>\nusing namespace std;\nint main ()\n{\n   \
    \ string str (\"Here is a long sentence in a string.\");\n    cout << str << '\\\
    n';\n    str.erase (10,5);\n    cout << str << '\\n';\n    str.erase (str.begin()+8);\n\
    \    cout << str << '\\n';\n    str.erase (str.begin()+9, str.end()-9);\n    cout\
    \ << str << '\\n';\n}\n```\n```\n\n# STEP 10\n\nIt's worth spending some time\
    \ playing around with the numbers, which are the character positions in the string.\
