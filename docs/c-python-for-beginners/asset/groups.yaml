    \n![](img/840275566c862102888f27d8ae2ac921_60_0.png)\n\n#### STEP 6\n\nOn the\
    \ next line below int main(), enter a curly bracket:\n\n`{`\n\nThis can be done\
    \ by pressing Shift and the key to the right of P on an English UK keyboard layout.\n\
    \n![](img/840275566c862102888f27d8ae2ac921_60_1.png)\n\n#### STEP 7\n\nNotice\
    \ that Code::Blocks has automatically created a corresponding closing curly bracket\
    \ a couple of lines below, linking the pair, as well as a slight indent. This\
