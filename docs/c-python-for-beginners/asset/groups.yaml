    \ \"The square root of \" << number << \" is: \" << sqrt(number) << \"\\n\";\n\
    }\n```\n\n![](img/840275566c862102888f27d8ae2ac921_74_2.png)\n\n**第 7 步** 这里我们创建了一个名为\
