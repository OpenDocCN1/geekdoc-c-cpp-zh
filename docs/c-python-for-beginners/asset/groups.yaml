    in the code and if you open up the file manager you can also see that file''s
    icon has C++ stamped on it.


    ![](img/840275566c862102888f27d8ae2ac921_54_1.png)


    ### STEP 7


    With your code now saved, drop into the Terminal again. You need to navigate to
    the location of the C++ file you''ve just saved. Our example is in the Documents
    folder, so we can navigate to it by entering: `cd Documents`. Remember, the Linux
    Terminal is case-sensitive, so any capitals must be entered correctly.


    ![](img/840275566c862102888f27d8ae2ac921_54_2.png)


    ### STEP 8


    Before you can execute the C++ file you need to compile it. In Linux it''s common
    to use `g++`, an open-source C++ compiler, as you''re now in the same folder as
    the C++ file, enter: `g++ helloworld.cpp` in the Terminal and press Return.


    ![](img/840275566c862102888f27d8ae2ac921_54_3.png)


    ### STEP 9


    It takes a short time while the code is compiled by `g++` but providing there
    are no mistakes or errors in the code you are returned to the command prompt.
    The compiling of the code has created a new file, if you enter: `ls` into the
    Terminal you can see that alongside your C++ file is `a.out`.


    ![](img/840275566c862102888f27d8ae2ac921_54_4.png)


    ### STEP 10


    The `a.out` file is the compiled C++ code. To run the code enter: `./a.out` and
    press Return. The words ''Hello World!'' appear on the screen. However, `a.out`
    isn''t very friendly. To name it something else post-compiling, you can recompile
    with: `g++ helloworld.cpp -o helloworld`. This creates an output file called helloworld
    which can be run with: `./helloworld`.


    ![](img/840275566c862102888f27d8ae2ac921_54_5.png)


    ## Other C++ IDEs to Install


    ### VISUAL STUDIO


    Microsoft’s Visual Studio is a mammoth C++ IDE that allows you to create applications
    for Windows, Android, iOS and the web. The Community version is free to download
    and install but the other versions allow a free trial period. Go to www.visualstudio.com/
    to see what it can do for you.


    ![](img/840275566c862102888f27d8ae2ac921_56_0.png)


    ### ANJUTA


    The Anjuta DevStudio is a Linux-only IDE that features some of the more advanced
    features you would normally find in a paid software development studio. There’s
    a GUI designer, source editor, app wizard, interactive debugger and much more.
    Go to www.anjuta.org/ for more information.


    ![](img/840275566c862102888f27d8ae2ac921_56_1.png)


    ### QT CREATOR


    This cross-platform IDE is designed to create C++ applications for desktop and
    mobile environments. It comes with a code editor and integrated tools for testing
    and debugging, as well as deploying to your chosen platform. It’s not free but
    there is a trial period on offer before requiring purchasing: www.qt.io/qt-features-libraries-apis-tools-and-ide/.


    ![](img/840275566c862102888f27d8ae2ac921_56_2.png)


    ### MONODEVELOP


    This excellent IDE allows developers to write C++ code for desktop and web applications
    across all the major platforms. There’s an advanced text editor, integrated debugger
    and a configurable workbench to help you create your code. It’s available for
    Windows, Mac and Linux and is free to download and use: www.monodevelop.com/.


    ![](img/840275566c862102888f27d8ae2ac921_56_3.png)


    ### DEV C++


    Bloodshed Dev C++, despite its colourful name, is an older IDE that is for Windows
    systems only. However, many users praise its clean interface and uncomplicated
    way of coding and compiling. Although there’s not been much updating for some
    time, it’s certainly one to consider if you want something different: www.bloodshed.net/devcpp.html.


    ![](img/840275566c862102888f27d8ae2ac921_56_4.png)


    ### U++


    Ultimate++ is a cross-platform C++ IDE that boasts a rapid development of code
    through the smart and aggressive use of C++. For the novice, it’s a beast of an
    IDE but behind its complexity is a beauty that would make a developer’s knees
    go wobbly. Find out more at www.ultimatepp.org/index.html.


