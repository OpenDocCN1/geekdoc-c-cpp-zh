    \ icon.\n\n![](img/840275566c862102888f27d8ae2ac921_60_5.png)\n\n## Structure\
    \ of a C++ Program\n\nC++ has a very defined structure and way of doing things.\
    \ Miss something out, even as small as a semicolon, and your entire program will\
    \ fail to be compiled and executed. Many a professional programmer has fallen\
    \ foul of sloppy structure.\n\n### INCLUDE <C++ STRUCTURE>\n\nLearning the basics\
    \ of programming, you begin to understand the structure of a program. The commands\
    \ may be different from one language to the next, but you will start to see how\
    \ the code works.\n\nC++ was invented by Danish student Bjarne Stroustrup in 1979,\
    \ as a part of his Ph.D. thesis. Initially C++ was called C with Classes, which\
    \ added features to the already popular C programming language, while making it\
    \ a more user-friendly environment through a new structure.\n\n**Bjarne Stroustrup,\
    \ inventor of C++.**\n\n![](img/840275566c862102888f27d8ae2ac921_61_0.png)\n\n\
    ### INCLUDE\n\nThe structure of a C++ program is quite precise. Every C++ code\
    \ begins with a directive: **#include <>**. The directive instructs the pre-processor\
    \ to include a section of the standard C++ code. For example: **#include <iostream>**\
    \ includes the iostream header to support input/output operations.\n\n```cpp\n\
    #include <iostream>\n```\n\n### INT MAIN()\n\n**int main()** initiates the declaration\
    \ of a function, which is a group of code statements under the name ‘main’. All\
    \ C++ code begins at the main function, regardless of where it actually lies within\
    \ the code.\n\n```cpp\n#include <iostream>\n\nint main()\n```\n\n### BRACES\n\n\
    The open brace (curly brackets) is something that you may not have come across\
    \ before, especially if you’re used to Python. The open brace indicates the beginning\
    \ of the main function and contains all the code that belongs to that function.\n\
    \n```cpp\n#include <iostream>\n\nint main()\n{\n\n}\n```\n\n### COMMENTS\n\nLines\
    \ that begin with a double slash are comments. This means they won't be executed\
    \ in the code and are ignored by the compiler. Comments are designed to help you,\
    \ or another programmer looking at your code, explain what's going on. There are\
    \ two types of comment. `/* ... */` covers multiple line comments, `//` a single\
    \ line.\n\n```cpp\n#include <iostream>\n\nint main()\n{\n    // My First C++ program\n\
    }\n```\n\n### <<\n\nThe two chevrons used here are insertion operators. This means\
    \ that whatever follows the chevrons is to be inserted into the std::cout statement.\
    \ In this case they're the words 'Hello, world!', which are to be displayed on\
    \ the screen when you compile and execute the code.\n\n```cpp\n#include <iostream>\n\
    \nusing namespace std;\n\nint main()\n{\n    cout << \"Hello, world!\\n\";\n\n\
    \    return 0;\n}\n```\n\n### STD\n\nWhile std stands for something quite different,\
    \ in C++ it means Standard. It's part of the Standard Namespace in C++, which\
    \ covers a number of different statements and commands. You can leave the std::\
    \ part out of the code but it must be declared at the start with: using namespace\
    \ std; not both. For example:\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n```\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main()\n\
    {\n    std::cout << \"Hello, world!\\n\"; //Remember! declare\n}\n```\n\n### OUTPUTS\n\
    \nLeading on, the 'Hello, world!' part is what we want to appear on the screen\
    \ when the code is executed. You can enter whatever you like, as long as it's\
    \ inside the quotation marks. The brackets aren't needed but some compilers insist\
    \ on them. The `\\n` part indicates a new line is to be inserted.\n\n```cpp\n\
    // My first C++ program\ncout << \"Hello, world!\\n\";\n```\n\n### COUT\n\nIn\
    \ this example we're using cout, which is a part of the Standard Namespace, hence\
    \ why it's there, as you're asking C++ to use it from that particular namespace.\
    \ Cout means Character OUTput, which displays, or prints, something to the screen.\
    \ If we leave std:: out we have to declare it at the start of the code, as mentioned\
    \ previously.\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main()\n\
    {\n    // My first C++ program\n    cout\n}\n```\n\n### ; AND }\n\nFinally you\
    \ can see that lines within a function code block (except comments) end with a\
    \ semicolon. This marks the end of the statement and all statements in C++ must\
    \ have one at the end or the compiler fails to build the code. The very last line\
    \ has the closing brace to indicate the end of the main function.\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\n\nint main()\n{\n    // My first C++\
    \ program\n    cout << \"Hello, world!\\n\";\n    return 0;\n}\n```\n\n## Compile\
    \ and Execute\n\nYou've created your first C++ program and you now understand\
    \ the basics behind the structure of one. Let's actually get things moving and\
    \ compile and execute, or run if you prefer, the program and see how it looks.\n\
    \n### GREETINGS FROM C++\n\nCompiling and executing C++ code from Code::Blocks\
    \ is extraordinarily easy; just a matter of clicking an icon and seeing the result.\
    \ Here's how it's done.\n\n#### STEP 1\n\nOpen Code::Blocks, if you haven't already,\
    \ and load up the previously saved Hello World code you created. Ensure that there\
    \ are no visible errors, such as missing semicolons at the end of the std::cout\
    \ line.\n\n![](img/840275566c862102888f27d8ae2ac921_63_0.png)\n\n#### STEP 2\n\
    \nIf your code is looking similar to the one in our screenshot, then look to the\
    \ menu bar along the top of the screen. Under the Fortran entry in the topmost\
    \ menu you can see a group of icons: a yellow cog, green play button and a cog/play\
    \ button together. These are Build, Run, Build and Run functions.\n\n![](img/840275566c862102888f27d8ae2ac921_63_1.png)\n\
    \n#### STEP 3\n\nStart by clicking on the Build icon, the yellow cog. At this\
    \ point, your code has now been run through the Code::Blocks compiler and checked\
    \ for any errors. You can see the results of the Build by looking to the bottom\
    \ window pane. Any messages regarding the quality of the code are displayed here.\n\
    \n![](img/840275566c862102888f27d8ae2ac921_63_2.png)\n\n#### STEP 4\n\nNow click\
    \ on the Run icon, the green play button. A command line box appears on your screen\
    \ displaying the words: Hello, world!, followed by the time it's taken to execute\
    \ the code, and asking you to press a key to continue. Well done, you just compiled\
    \ and executed your first C++ program.\n\n![](img/840275566c862102888f27d8ae2ac921_63_3.png)\n"
