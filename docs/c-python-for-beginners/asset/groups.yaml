    # # Why C++?


    C++ is one of the most popular programming languages available today. Originally
    called C with Classes, the language was renamed C++ in 1983. It''s an extension
    of the original C language and is a general purpose object-oriented (OOP) environment.


    # ## C EVERYTHING


    Due to how complex the language can be, and its power and performance, C++ is
    often used to develop games, programs, device drivers and even entire operating
    systems.


    Dating back to 1979, the start of the golden era of home computing, C++, or rather
    C with Classes, was the brainchild of Danish computer scientist Bjarne Stroustrup
    while working on his PhD thesis. Stroustrup''s plan was to further the original
    C language, which was widely used since the early seventies.


    C++ proved to be popular among the developers of the ''80s, since it was a much
    easier environment to get to grips with and more importantly, it was 99% compatible
    with the original C language. This meant that it could be used beyond the mainstream


    computing labs and by regular people who didn''t have access to the mainframes
    and large computing data centres.


    C++''s impact in the digital world is immense. Many of the programs, applications,
    games and even operating systems are coded using C++. For example, all of Adobe''s
    major applications, such as Photoshop, InDesign and so on, are developed in C++.
    You will find that the browser you surf the Internet with is written in C++, as
