    \ way as the Shell you opened in Step 8: note the three left-facing arrows (>>>).\
    \ Whilst it’s a perfectly fine environment, it’s not too user-friendly, so leave\
    \ the command line for now. Enter `exit()` to leave and close the Command Prompt\
    \ window.\n  \n  ![](img/840275566c862102888f27d8ae2ac921_14_5.png)\n\n- **STEP\
    \ 5**  \n  The next section details the Software License Agreement, and whilst\
    \ not particularly interesting to most folks, it’s probably worth a read. When\
    \ you’re ready, click on the Continue button once again.\n  \n  ![](img/840275566c862102888f27d8ae2ac921_16_0.png)\n\
    \n- **STEP 6**  \n  Finally you’ll be presented with the amount of space Python\
    \ will take up on your system and an Install button, which you need to click to\
    \ start the actual installation of Python 3.x on to your Mac. You may need to\
    \ enter your password to authenticate the installation process.\n  \n  ![](img/840275566c862102888f27d8ae2ac921_16_2.png)\n\
    \n- **STEP 7**  \n  The installation shouldn’t take too long; the older Mac Mini\
    \ we used in this section is a little slower than more modern Mac machines and\
    \ it only took around thirty seconds for the Installation Successful prompt to\
    \ be displayed.\n  \n  ![](img/840275566c862102888f27d8ae2ac921_16_4.png)\n\n\
    - **STEP 8**  \n  There’s nothing much else left to do in the Python installation\
    \ wizard so you can click the Close button. If you now drop back into a Terminal\
    \ session and re-enter the command: `python3 --version`, you can see the new version\
    \ is now listed. To enter the command line version of Python, you need to enter:\
    \ `python3`. To exit, it’s: `exit()`.\n  \n  ![](img/840275566c862102888f27d8ae2ac921_16_1.png)\n\
    \n- **STEP 9**  \n  You need to search in Finder for the Python IDLE; when you’ve\
    \ found it, click it to launch and it should look similar to that of the Windows\
    \ IDLE version shown on the previous page. The only difference being the Mac-detected\
    \ hardware platform it’s running on.\n  \n  ![](img/840275566c862102888f27d8ae2ac921_16_3.png)\n\
    \n- **STEP 10**  \n  Older Mac versions may have trouble with the newer versions\
    \ of Python, in which case you will need to revert to a previous Python 3.x build;\
    \ as long as you’re using Python 3.x, the code in this book will work for you.\n\
    \  \n  ![](img/840275566c862102888f27d8ae2ac921_16_5.png)\n\n## How to Set Up\
    \ Python in Linux\n\n### PYTHON PENGUIN\n\nLinux is such a versatile operating\
    \ system that it’s often difficult to nail down just one way of doing something.\
    \ Different distributions go about installing software in different ways, so we\
    \ will stick to Linux Mint 18.1 for this particular tutorial.\n\n- **STEP 1**\
    \  \n  First you need to ascertain which version of Python is currently installed\
    \ in your Linux system; as we’ve mentioned, we’re going to be using Linux Mint\
    \ 18.1 for this section. As with macOS, drop into a Terminal by pressing Ctrl+Alt+T.\n\
    \  \n  ![](img/840275566c862102888f27d8ae2ac921_17_0.png)\n\n- **STEP 2**  \n\
    \  Next enter: `python --version` into the Terminal screen. You should have the\
    \ output relating to version 2.x of Python in the display. Ours in this particular\
    \ case is Python 2.7.12.\n  \n  ![](img/840275566c862102888f27d8ae2ac921_17_2.png)\n\
    \n- **STEP 3**  \n  Some Linux distros will automatically update the installation\
    \ of Python to the latest versions whenever the system is updated. To check, first\
    \ do a system update and upgrade with:\n  \n  ```\n  sudo apt-get update && sudo\
    \ apt-get upgrade\n  ```\n  \n  Enter your password and let the system do any\
    \ updates.\n  \n  ![](img/840275566c862102888f27d8ae2ac921_17_1.png)\n\n- **STEP\
    \ 4**  \n  Once the update and upgrade is complete, you may need to answer ‘Y’\
    \ to authorise any upgrades, enter: `python3 --version` to see if Python 3.x is\
    \ updated or even installed. In the case of Linux Mint, the version we have is\
    \ Python 3.5.2, which is fine for our purposes.\n  \n  ![](img/840275566c862102888f27d8ae2ac921_17_3.png)\n\
    \n- **STEP 5**  \n  However, if you want the latest version, 3.6.2 as per the\
    \ Python website at the time of writing, you need to build Python from source.\
    \ Start by entering these commands into the Terminal:\n  \n  ```\n  sudo apt-get\
    \ install build-essential checkinstall\n  sudo apt-get install libreadline-gplv2-dev\
    \ libncursesw5-dev libssl-dev libsqlite3-dev tk-dev libgdbm-dev libc6-dev libbz2-dev\n\
    \  ```\n  \n  ![](img/840275566c862102888f27d8ae2ac921_18_0.png)\n\n- **STEP 6**\
    \  \n  Open up your Linux web browser and go to the Python download page: **www.python.org/downloads**.\
    \ Click on the Download Python 3.6.2 (or whichever version it’s on when you look)\
    \ to download the source Python-3.6.2.tar.xz file.\n  \n  ![](img/840275566c862102888f27d8ae2ac921_18_1.png)\n\
    \n- **STEP 7**  \n  In the Terminal, go to the Downloads folder by entering: `cd\
    \ Downloads/`. Then unzip the contents of the downloaded Python source code with:\
    \ `tar -xvf Python-3.6.2.tar.xz`. Now enter the newly unzipped folder with `cd\
    \ Python-3.6.2/`.\n  \n  ![](img/840275566c862102888f27d8ae2ac921_18_2.png)\n\n\
    - **STEP 8**  \n  Within the Python folder, enter:\n  \n  ```\n  ./configure\n\
    \  sudo make altinstall\n  ```\n  \n  This could take a little while depending\
    \ on the speed of your computer. Once finished, enter: `python3.6 --version` to\
    \ check the installed latest version.\n  \n  ![](img/840275566c862102888f27d8ae2ac921_18_3.png)\n\
    \n- **STEP 9**  \n  For the GUI IDLE, you need to enter the following command\
    \ into the Terminal:\n  \n  ```\n  sudo apt-get install idle3\n  ```\n  \n  The\
    \ IDLE can then be started with the command: `idle3`. Note that IDLE runs a different\
    \ version from the one you installed from source.\n  \n  ![](img/840275566c862102888f27d8ae2ac921_18_4.png)\n\
    \n- **STEP 10**  \n  You also need PIP (Pip Installs Packages) which is a tool\
    \ to help you install more modules and extras. Enter:\n  \n  ```\n  sudo apt-get\
    \ install python3-pip\n  ```\n  \n  Pip is then installed; check for the latest\
    \ update with:\n  \n  ```\n  pip3 install --upgrade pip\n  ```\n  \n  When complete,\
    \ close the Terminal and Python 3.x will be available via the Programming section\
    \ in your distro’s menu.\n  \n  ![](img/840275566c862102888f27d8ae2ac921_18_5.png)\n\
    \n![](img/840275566c862102888f27d8ae2ac921_19_0.png)\n\n![](img/840275566c862102888f27d8ae2ac921_20_0.png)\n\
    \n## Getting Started with Python\n\nGetting started with Python may seem a little\
    \ daunting at first but the language has been designed with simplicity in mind.\
    \ Like most things, you need to start slowly, learn how to get a result and how\
    \ to get what you want from the code.\n\nIn this section, we cover variables,\
    \ numbers and expressions, user input, conditions and loops and the types of errors\
    \ you may well come across in your time with Python.\n"
