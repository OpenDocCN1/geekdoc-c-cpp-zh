    \ – Commands\n  - Blue – User Functions\n  - Dark Red – Comments\n  - Light Red\
    \ – Error Messages\n\n### IDLE Colour Coding\n\n| Colour | Used for | Examples\
    \ |\n|---|---|---|\n| Black | Data & variables | `23.6` `area` |\n| Green | Strings\
