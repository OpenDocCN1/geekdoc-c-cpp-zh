    \ extremely valuable resource.\n\n![](img/840275566c862102888f27d8ae2ac921_12_4.png)\n\
    \n### 3.X WINS\n\nPython 3’s growing popularity has meant that it’s now prudent\
    \ to start learning to develop with the new features and begin to phase out the\
    \ previous version. Many development companies, such as SpaceX and NASA use Python\
    \ 3 for snippets of important code.\n\n![](img/840275566c862102888f27d8ae2ac921_12_5.png)\n\
    \n## How to Set Up Python in Windows\n\nWindows users can easily install the latest\
    \ version of Python via the main Python Downloads page. Whilst most seasoned Python\
    \ developers may shun Windows as the platform of choice for building their code,\
    \ it’s still an ideal starting point for beginners.\n\n### INSTALLING PYTHON 3.X\n\
    \nMicrosoft Windows doesn’t come with Python preinstalled as standard, so you’re\
    \ going to have to install it yourself manually. Thankfully, it’s an easy process\
    \ to follow.\n\n- **STEP 1** — Start by opening your web browser to **www.python.org/downloads/**.\
    \ Look for the button detailing the download link for Python 3.x.x (in our case\
    \ this is Python 3.6.2 but as mentioned you may see later versions of 3).\n\n\
    \  ![](img/840275566c862102888f27d8ae2ac921_13_0.png)\n\n- **STEP 2** — Click\
    \ the download button for version 3.x, and save the file to your Downloads folder.\
    \ When the file is downloaded, double-click the executable and the Python installation\
    \ wizard will launch. From here you have two choices: Install Now and Customise\
    \ Installation. We recommend opting for the Customise installation link.\n\n \
    \ ![](img/840275566c862102888f27d8ae2ac921_13_1.png)\n\n- **STEP 3** — Choosing\
    \ the Customise option allows you to specify certain features and what will stay\
    \ with the defaults, it’s a good habit to adopt as sometimes (not with Python,\
    \ thankfully) installers can include unwanted additional features. On the first\
    \ screen available, ensure all boxes are ticked and click the Next button.\n\n\
    \  ![](img/840275566c862102888f27d8ae2ac921_13_2.png)\n\n- **STEP 4** — The next\
    \ page of options include some interesting additions to Python. Ensure the Associate\
    \ file with Python, Create Shortcuts, Add Python to Environment Variables, Precompile\
    \ Standard Library and Install for All Users options are ticked. These make using\
    \ Python later much easier. Click Install when you’re ready to continue.\n\n \
    \ ![](img/840275566c862102888f27d8ae2ac921_13_3.png)\n"
  mdcn: "\n## 树莓派\n\n为什么要使用树莓派？树莓派是一台非常便宜的小型计算机，却为用户提供了极佳的学习平台。它的主要操作系统 Raspbian 预装了最新版\
    \ Python，以及许多模块和附加组件。\n\n### 树莓派\n\n树莓派 3 是最新版本，配备更强大的 CPU、更大的内存，并支持 Wi-Fi 和蓝牙。你可以花约\
    \ 32 英镑买到一块树莓派，或者以 50 英镑以上的价格购买套装，具体取决于你感兴趣的套装。\n\n![](img/840275566c862102888f27d8ae2ac921_10_0.png)\n\
    \n### FUZE 项目\n\nFUZE 是一个基于最新款树莓派构建的学习环境。你可以购买配备电子套件的工作站，甚至还有可供你搭建和编程的机械臂。你可以在\
    \ www.fuze.co.uk 上找到有关 FUZE 的更多信息。\n\n### RASPBIAN\n\n树莓派的主要操作系统是一个基于 Debian 的\
    \ Linux 发行版，它以简单易用的软件包形式提供了你所需的一切。它针对树莓派进行了精简优化，是硬件和软件项目、Python 编程，甚至作为桌面计算机使用的理想平台。\n\
    \n![](img/840275566c862102888f27d8ae2ac921_10_1.png)\n\n### 图书\n\n我们通过 www.pcpublications.com\
    \ 提供多本优秀的编程图书。我们的树莓派图书涵盖如何购买你的第一块树莓派、进行设置并使用它；书中还有一些很棒的逐步项目示例和指南，帮助你充分利用树莓派。\n\
    \n![](img/840275566c862102888f27d8ae2ac921_10_2.png)\n\n## 认识 Python\n\nPython\
    \ 是有史以来最伟大的计算机编程语言。它让你能够用一种简洁易懂的语言，充分发挥计算机的能力。\n\n### 什么是编程？\n\n在尝试学习一门编程语言之前，先了解什么是编程语言会很有帮助，Python\
    \ 也不例外。让我们来看看 Python 是如何诞生的，以及它与其他语言的关系。\n\n#### PYTHON\n\n编程语言是计算机遵循的一系列指令。这些指令可以简单到显示你的名字或播放音乐文件，也可以复杂到构建整个虚拟世界。Python\
    \ 是一种编程语言，由 Guido van Rossum 于 20 世纪 80 年代末在荷兰的 Centrum Wiskunde & Informatica（CWI）构思，作为\
    \ ABC 语言的继任者。\n\n**Guido van Rossum，Python 之父。**\n\n![](img/840275566c862102888f27d8ae2ac921_11_0.png)\n\
    \n### 编程食谱\n\n程序就像给计算机的食谱。烤蛋糕的食谱可以是这样：\n\n- 将 100 克自发粉放入碗中。\n- 向碗中加入 100 克黄油。\n\
    - 加入 100 毫升牛奶。\n- 烘焙半小时。\n\n![](img/840275566c862102888f27d8ae2ac921_11_1.png)\n\
    \n### 代码\n\n就像食谱一样，程序由需要按顺序执行的指令组成。一个描述蛋糕的程序可能像这样运行：\n\n```python\nbowl\nflour\
    \ = 100\nbutter = 50\nmilk = 100\nbowl.append([flour,butter,milk])\ncake.cook(bowl)\n\
    ```\n\n![](img/840275566c862102888f27d8ae2ac921_11_2.png)\n\n### 程序命令\n\n你可能不理解某些\
    \ Python 命令，比如 bowl.append 和 cake.cook(bowl)。第一个是列表，第二个是对象；我们将在本书中探讨这两者。主要要知道的是，Python\
    \ 中的命令很容易阅读。一旦你了解了这些命令的作用，就很容易弄明白程序是如何工作的。\n\n![](img/840275566c862102888f27d8ae2ac921_11_3.png)\n\
    \n![](img/840275566c862102888f27d8ae2ac921_11_4.png)\n\n### 高级语言\n\n易于阅读的计算机语言被称为“高级语言”。这是因为它们远离硬件（硬件也被称为“金属”）。像汇编语言这样“贴近金属飞行”的语言被称为“低级语言”。低级语言看起来有点像这样：`msg\
    \ db , 0xa len equ $ - msg`。\n\n![](img/840275566c862102888f27d8ae2ac921_12_0.png)\n\
    \n### Python 之禅\n\nPython 让你能用人类可理解的语言访问计算机的全部能力。这一切背后是一种称为“Python 之禅”的理念。它由 20\
    \ 条软件原则组成，影响着该语言的设计。原则包括“优美胜于丑陋”和“简单胜于复杂”。在 Python 中输入 `import this`，它就会显示所有原则。\n\
    \n![](img/840275566c862102888f27d8ae2ac921_12_1.png)\n\n### PYTHON 3 与 PYTHON\
    \ 2\n\n在典型的计算场景中，Python 由于存在两个活跃版本：Python 2 和 Python 3，而显得有些复杂。\n\n### Python\
    \ 的世界\n\n当你访问 Python 下载页面时，会注意到有两个可用按钮：一个用于 Python 3.6.2，另一个用于 Python 2.7.13；这些版本在撰写本文时是正确的（请记住\
    \ Python 经常更新，因此你可能会看到不同的版本号）。\n\n![](img/840275566c862102888f27d8ae2ac921_12_2.png)\n\
    \n### PYTHON 3.X\n\n2008 年，Python 3 问世，带来了若干新功能和增强功能。这些功能提供了更稳定、更有效且更高效的编程环境，但遗憾的是，这些新功能中的大多数（即使不是全部）与\
    \ Python 2 的脚本、模块和教程不兼容。尽管起初并不受欢迎，但 Python 3 后来已成为 Python 编程的前沿。\n\n![](img/840275566c862102888f27d8ae2ac921_12_3.png)\n\
    \n### PYTHON 2.X\n\n那么为什么有两个版本？嗯，Python 2 最初于 2000 年发布，从那时起便积累了相当大量的工具、脚本、用户、教程等。多年来，Python\
    \ 2 迅速成为初学者和专家最早使用的编程语言之一，这使它成为极其宝贵的资源。\n\n![](img/840275566c862102888f27d8ae2ac921_12_4.png)\n\
    \n### 3.X 胜出\n\nPython 3 日益普及，意味着现在开始学习使用新功能进行开发并逐步淘汰旧版本是明智之举。许多开发公司，例如 SpaceX\
    \ 和 NASA，都在重要代码片段中使用 Python 3。\n\n![](img/840275566c862102888f27d8ae2ac921_12_5.png)\n\
    \n## 如何在 Windows 中设置 Python\n\nWindows 用户可以通过 Python 主下载页面轻松安装最新版 Python。尽管大多数经验丰富的\
    \ Python 开发者可能会避开 Windows，不将其作为编写代码的首选平台，但它对初学者来说仍然是一个理想的起点。\n\n### 安装 PYTHON\
    \ 3.X\n\nMicrosoft Windows 默认不预装 Python，因此你需要手动安装。所幸，这个过程很容易操作。\n\n- **第 1 步**\
    \ — 首先在 Web 浏览器中打开 **www.python.org/downloads/**。找到详细说明 Python 3.x.x 下载链接的按钮（在我们的例子中是\
    \ Python 3.6.2，但如前所述，你可能会看到 3 的更高版本）。\n\n  ![](img/840275566c862102888f27d8ae2ac921_13_0.png)\n\
    \n- **第 2 步** — 单击版本 3.x 的下载按钮，并将文件保存到你的“下载”文件夹。文件下载完成后，双击可执行文件，Python 安装向导将启动。在这里你有两个选择：“立即安装”和“自定义安装”。我们建议选择“自定义安装”链接。\n\
    \n  ![](img/840275566c862102888f27d8ae2ac921_13_1.png)\n\n- **第 3 步** — 选择“自定义”选项可以让你指定某些功能以及哪些将保留默认设置；这是一个值得养成的好习惯，因为有时（幸运的是，Python\
    \ 不会这样）安装程序可能包含不需要的附加功能。在出现的第一个屏幕上，确保勾选所有复选框，然后单击“下一步”按钮。\n\n  ![](img/840275566c862102888f27d8ae2ac921_13_2.png)\n\
    \n- **第 4 步** — 下一页选项包括一些为 Python 增加的有趣附加项。确保勾选“将文件与 Python 关联”、“创建快捷方式”、“将 Python\
    \ 添加到环境变量”、“预编译标准库”和“为所有用户安装”选项。这些选项会让之后使用 Python 容易得多。准备好继续时，单击“安装”。\n\n  ![](img/840275566c862102888f27d8ae2ac921_13_3.png)\n\
    \n"
