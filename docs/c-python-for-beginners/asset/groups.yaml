    \ and miss whether you get it right, so practice makes perfect. Take a look at\
    \ the screenshot to see the result of the code.\n\n![](img/840275566c862102888f27d8ae2ac921_72_3.png)\n"
  mdcn: "\n\n## 数据类型\n\n正如我们所见，变量存储信息，程序员之后可以调用这些信息，并在需要时进行操作。变量实际上就是保留的内存位置，用于存储程序员根据所用数据类型赋给的值。\n\
    \n### 数据的值\n\nC++ 为程序员提供了许多不同的数据类型，例如整数、浮点型、布尔型、字符等。人们普遍认为有七种基本数据类型，通常称为基本内置类型；不过，如果你的代码中有需要，也可以创建自己的数据类型。\n\
    \n七种基本数据类型是：\n\n| 类型 | 命令 |\n|---|---|\n| 整数 | int |\n| 浮点型 | float |\n| 字符 |\
    \ char |\n| 布尔 | bool |\n| 双精度浮点型 | double |\n| 宽字符 | wchar_t |\n| 无值 | void |\n\
    \n这些基本类型还可以使用以下修饰符进行扩展：Long、Short、Signed 和 Unsigned。基本上，这意味着这些修饰符可以扩展每种数据类型的最小值和最大值范围。例如，int\
    \ 数据类型的默认值范围是 -2147483648 到 2147483647，你会同意这是一个合理的范围。\n\n现在，如果你使用其中一个修饰符，范围就会改变：\n\
    \n- 无符号 int = 0 到 4294967295\n- 有符号 int = -2147483648 到 2147483647\n- 短 int =\
    \ -32768 到 32767\n- 无符号短 int = 0 到 65535\n- 有符号短 int = -32768 到 32767\n- 长 int\
    \ = -2147483647 到 2147483647\n- 有符号长 int = -2147483647 到 2147483647\n- 无符号长 int\
    \ = 0 到 4294967295\n\n自然，你可以只使用不带修饰符的基本类型，因为每种数据类型都提供了充足的范围。不过，在可能的情况下使用修饰符被认为是良好的\
    \ C++ 编程实践。\n\n不过，使用修饰符时也会存在问题。Double 表示双精度浮点值，你可以用它来表示极其精确的数字，但这些数字最多只能精确到小数点后第十五位。在\
    \ C++ 中使用 cout 函数显示此类数字时还会有一个问题：默认情况下，cout 只输出前五位小数。你可以通过添加 cout.precision() 函数并在括号内添加一个值来应对这个问题，但即便如此，你仍然会受到\
    \ double 数据类型精度的限制。例如，试试这段代码：\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\ndouble PI = 3.141592653589793238463;\nint main()\n{\n    cout << PI;\n\
    }\n```\n\n![](img/840275566c862102888f27d8ae2ac921_69_0.png)\n\n构建并运行代码，如你所见，输出只有\
    \ 3.14159，这体现了 cout 在此示例中的局限性。\n\n你也可以修改代码，加入前面提到的 cout.precision 函数，以获得更高的精度。使用以下代码将精度一直提高到小数点后\
    \ 22 位：\n\n```cpp\n#include <iostream>\nusing namespace std;\ndouble PI = 3.141592653589793238463;\n\
    int main()\n{\n    cout.precision(22);\n    cout << PI;\n}\n```\n\n![](img/840275566c862102888f27d8ae2ac921_70_0.png)\n\
    \n这主要是由于编译器中的二进制转换，以及 IEEE 754 双精度标准占用 64 位数据，其中 52 位专用于有效数字（浮点数中的有效位数），大约 3.5\
    \ 位用于保存 0 到 9 的值。如果将 53 除以 3.5，得到循环小数 15.142857，也就是 15 位精度。\n\n老实说，如果你编写的代码需要精确到小数点后十五位以上，那么你不会使用\
    \ C++，而会使用某种科学专用语言，并让 C++ 作为两种语言之间的连接组织。\n\n你可以使用一种称为 typedef 的类似别名的系统来创建自己的数据类型。例如：\n\
    \n![](img/840275566c862102888f27d8ae2ac921_70_1.png)\n\n再次构建并运行代码；如命令行窗口所示，变量\
    \ PI 所表示的数值与你在变量中告诉 C++ 使用的数值不同。输出将 PI 的值读取为 3.141592653589793115998，从第十五位小数开始数字出现偏差。\n\
    \n![](img/840275566c862102888f27d8ae2ac921_70_2.png)\n\n![](img/840275566c862102888f27d8ae2ac921_70_3.png)\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\ntypedef int metres;\n\nint\
    \ main()\n{\n    metres distance;\n    distance = 15;\n    cout << \"distance\
    \ in metres is: \" << distance;\n}\n```\n\n![](img/840275566c862102888f27d8ae2ac921_70_4.png)\n\
    \n这段代码执行后会创建一个名为 metres 的新 int 数据类型。然后，在主代码块中有一个名为 distance 的新变量，它是整数；因此，你实际上是在告诉编译器\
    \ int 还有另一个名称。我们将值 15 赋给 distance，并显示输出：distance in metres is 15。\n\n一开始听起来可能有点令人困惑，但你使用\
    \ C++ 并编写自己的代码越多，它就会变得越容易。\n\n## 字符串\n\n字符串是表示并保存字符序列的对象。例如，你可以在代码中有一个通用问候语“Welcome”，并将其赋值为字符串，以便在程序中的任何时候调用。\n\
    \n### 字符串理论\n\n创建字符字符串有多种方式，这些方式历史上都源自最初的 C 语言，并且仍受 C++ 支持。\n\n### 第 1 步\n\n要创建字符串，你可以使用\
    \ char 函数。打开一个新的 C++ 文件，并从通常的头文件开始：\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nint main()\n{\n}\n```\n\n![](img/840275566c862102888f27d8ae2ac921_71_0.png)\n\
    \n### 第 2 步\n\n很容易将字符串与数组混淆。下面是一个数组，它可以用空字符终止：\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nint main()\n{\n    char greet[8] = {'W', 'e', 'l', 'c',\
    \ 'o', 'm', 'e', '\\0'};\n    cout << greet << \"\\n\";\n}\n```\n\n![](img/840275566c862102888f27d8ae2ac921_71_1.png)\n\
    \n### 第 3 步\n\n构建并运行代码，‘Welcome’ 会出现——不过这不是字符串。字符串是一个类，它定义的对象可以表示为字符流，而且不需要像数组那样终止。因此，代码可以写成：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nint main()\n{\n    char\
    \ greet[] = \"Welcome\";\n    cout << greet << \"\\n\";\n}\n```\n\n![](img/840275566c862102888f27d8ae2ac921_71_2.png)\n\
    \n### 第 4 步\n\nC++ 中还有一个 string 函数，其工作方式大致相同。再次使用问候语代码，你可以输入：\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\n\nint main()\n{\n    string greet = \"Welcome\"\
    ;\n    cout << greet << \"\\n\";\n}\n```\n\n![](img/840275566c862102888f27d8ae2ac921_71_3.png)\n\
    \n### 第 5 步\n\n使用 string 函数还可以应用许多不同的操作。例如，要获取字符串的长度，你可以使用：\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\nint main()\n{\n    string greet = \"Welcome\"\
    ;\n    cout << \"The length of the string is: \";\n    cout << greet.size() <<\
    \ \"\\n\";\n}\n```\n\n![](img/840275566c862102888f27d8ae2ac921_72_0.png)\n\n###\
    \ 第 6 步\n\n可以看到，我们使用 greet.size() 输出字符串内容的长度，即其中字符的数量。当然，如果你的字符串变量不叫 greet，就需要相应更改命令。格式始终是\
    \ stringname.operation。构建并运行代码以查看结果。\n\n![](img/840275566c862102888f27d8ae2ac921_72_1.png)\n\
    \n### 第 7 步\n\n当然，你可以将字符串相加，或者更确切地说，将它们组合成更长的字符串：\n\n```cpp\n#include <iostream>\n\
    using namespace std;\nint main()\n{\n    string greet1 = \"Hello\";\n    string\
    \ greet2 = \", world!\";\n    string greet3 = greet1 + greet2;\n    cout << greet3\
    \ << \"\\n\";\n}\n```\n\n![](img/840275566c862102888f27d8ae2ac921_72_2.png)\n\n\
    ### 第 8 步\n\n正如你所料，你可以混入整数，并存储与字符串相关的某些内容。在此示例中，我们创建了 int length，用于存储 string.size()\
    \ 的结果并将其输出给用户。\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\n\
    {\n    int length;\n    string greet1 = \"Hello\";\n    string greet2 = \", world!\"\
    ;\n    string greet3 = greet1 + greet2;\n    length = greet3.size();\n    cout\
    \ << \"The length of the combined strings is: \" << length << \"\\n\";\n}\n```\n\
    \n### 第 9 步\n\n使用 string 函数自带的可用操作，你可以操作字符串的内容。例如，要从字符串中删除字符，你可以使用：\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\nint main()\n{\n    string str (\"Here\
    \ is a long sentence in a string.\");\n    cout << str << '\\n';\n    str.erase\
    \ (10,5);\n    cout << str << '\\n';\n    str.erase (str.begin()+8);\n    cout\
    \ << str << '\\n';\n    str.erase (str.begin()+9, str.end()-9);\n    cout << str\
    \ << '\\n';\n}\n```\n\n### 第 10 步\n\n值得花些时间摆弄这些数字，它们代表字符串中的字符位置。有时你能否弄对会有偶然性，所以熟能生巧。查看截图以了解代码的运行结果。\n\
    \n![](img/840275566c862102888f27d8ae2ac921_72_3.png)\n\n"
