    \ Now enter:\n\n`// My first C++ program`\n\n![](img/840275566c862102888f27d8ae2ac921_60_2.png)\n\
    \n#### STEP 8\n\nNote again the colour coding change. Press Return at the end\
    \ of the previous step’s line, and then enter:\n\n`std::cout << \"Hello, world!\\\
    n\";`\n\n![](img/840275566c862102888f27d8ae2ac921_60_3.png)\n\n#### STEP 9\n\n\
    Just as before, Code::Blocks auto-completes the code you’re entering, including\
