    \ Windows 版 Python 3。\n\n### 掌握模块\n\n可以把模块看作导入到 Python 代码中的扩展，用于增强和扩展其能力。可用模块数不胜数，而且正如我们所见，你甚至可以自己创建模块。\n\
    \n#### 步骤 1\n\nPython 内置函数虽然很好，但功能有限。然而，使用模块可以让我们编写更复杂的程序。如你所知，模块是被导入的 Python\
    \ 脚本，例如 `import math`。\n\n![](img/840275566c862102888f27d8ae2ac921_41_0.png)\n\
    \n#### 步骤 2\n\n有些模块（尤其是在树莓派上）默认包含；math 模块就是一个典型例子。遗憾的是，其他模块并不总是可用。在非 Pi 平台上，一个很好的例子是\
    \ pygame 模块，它包含许多有助于创建游戏的函数。试试：`import pygame`。\n\n![](img/840275566c862102888f27d8ae2ac921_41_1.png)\n\
    \n#### 步骤 3\n\n结果是 IDLE Shell 中出现错误，因为 pygame 模块未被识别或未安装在 Python 中。要安装模块，我们可以使用\
    \ Pip（Pip Installs Packages）。关闭 IDLE Shell，进入命令提示符或终端会话。在具有管理员权限的命令提示符中，输入：\n\n\
    ```\npip install pygame\n```\n\n![](img/840275566c862102888f27d8ae2ac921_41_2.png)\n\
    \n#### 步骤 4\n\nPIP 安装需要提升权限，因为它会将组件安装到不同位置。Windows 用户可以通过“开始”按钮搜索 CMD，右键单击结果，然后单击“以管理员身份运行”。Linux\
    \ 和 Mac 用户可以使用 sudo 命令，即 `sudo pip install package`。\n\n![](img/840275566c862102888f27d8ae2ac921_41_3.png)\n\
    \n![](img/840275566c862102888f27d8ae2ac921_43_0.png)\n\n![](img/840275566c862102888f27d8ae2ac921_44_0.png)\n\
    \n## 向 C++ 问好\n\nC++ 是一种高级编程语言，用于众多技术领域。从你最喜欢的移动应用、主机和 PC 游戏，到整个操作系统，所有这些都是使用\
    \ C++ 以及一系列软件开发工具包和自定义库开发的。\n\nC++ 是你日常使用的大多数东西背后的驱动力，这使它成为一种复杂且异常强大的语言，值得掌握。在本节中，我们将介绍如何在你的计算机上安装\
    \ C++ IDE 和编译器。\n\n## 为什么选择 C++？\n\nC++ 是当今最流行的编程语言之一。它最初被称为“带类的C”（C with Classes），1983\
    \ 年更名为 C++。它是最初 C 语言的扩展，也是一种通用面向对象（OOP）环境。\n\n### C 语言无处不在\n\n由于该语言可能非常复杂，并且具有强大的功能和性能，C++\
    \ 常用于开发游戏、程序、设备驱动程序，甚至整个操作系统。\n\n追溯到 1979 年，即家用计算机黄金时代的开端，C++（更确切地说是“带类的C”）是丹麦计算机科学家本贾尼·斯特劳斯特鲁普（Bjarne\
    \ Stroustrup）在攻读博士论文期间的创意结晶。斯特劳斯特鲁普的计划是进一步发展最初 C 语言，该语言自 70 年代初以来就被广泛使用。\n\nC++\
    \ 被证明在 80 年代的开发者中很受欢迎，因为它是一个更容易上手的环境，更重要的是，它与最初的 C 语言 99% 兼容。这意味着它可以在主流计算实验室之外使用，也可以由那些无法使用大型机和大型计算数据中心的普通人使用。\n\
    \nC++ 在数字世界中的影响巨大。许多程序、应用程序、游戏甚至操作系统都是使用 C++ 编码的。例如，Adobe 的所有主要应用程序（如 Photoshop、InDesign\
    \ 等）都是用 C++ 开发的。你会发现，你上网使用的浏览器是用 C++ 编写的，Windows 10、Microsoft Office 以及 Google\
    \ 搜索引擎的骨干也是如此。Apple 的 macOS 在很大程度上是用 C++ 编写的（其中一些\n\n![](img/840275566c862102888f27d8ae2ac921_45_0.png)\n\
    \n> C++ 代码比 Python 代码快得多。\n\n```cpp\n#include<iostream>\nusing namespace std;\n\
    void main()\n{ char ch;\ncout<<\"Enter a character to check it is vowel or not\"\
    ;\ncin>>ch;\nswitch(ch)\n{\ncase 'a': case 'A':\ncout<<ch<<\" is a Vowel\";\n\
    break;\ncase 'e': case 'E':\ncout<<ch<<\" is a Vowel\";\nbreak;\ncase 'i': case\
    \ 'I':\ncout<<ch<<\" is a Vowel\";\nbreak;\ncase 'o': case 'O':\ncout<<ch<<\"\
    \ is a Vowel\";\nbreak;\ncase 'u': case 'U':\ncout<<ch<<\" is a Vowel\";\nbreak;\n\
    ```\n\n## 如何在 Windows 中搭建 C++ 环境\n\n在 C++ 编程方面，Windows 用户有丰富的选择。有许多可用的 IDE 和编译器，包括\
    \ Microsoft 的 Visual Studio。然而，在我们看来，最适合入门的 C++ IDE 是 Code::Blocks。\n\n### CODE::BLOCKS\n\
    \nCode::Blocks 是一款免费的 C++、C 和 Fortran IDE，功能丰富，并且可通过插件轻松扩展。它易于使用，自带编译器，背后有一个活跃的社区。\n\
    \n- **步骤 1** 首先访问 Code::Blocks 下载站点：www.codeblocks.org/downloads。在那里，点击“下载二进制发布版”链接，前往适用于\
    \ Windows 的最新可下载版本。\n\n  ![](img/840275566c862102888f27d8ae2ac921_49_0.png)\n\n\
    - **步骤 2** 你可以看到有多个 Windows 版本可用。你要下载的版本在当前版本号末尾带有“mingw-setup.exe”。在撰写本文时，该文件为：codeblocks-17.12mingw-setup.exe。不同之处在于，mingw-setup\
    \ 版本包含来自 TDM-GCC（一个编译器套件）的 C++ 编译器和调试器。\n\n  ![](img/840275566c862102888f27d8ae2ac921_49_1.png)\n\
    \n- **步骤 3** 找到该文件后，点击该行末尾的下载链接，会出现一个下载通知窗口；点击“保存文件”开始下载，并将可执行文件保存到你的电脑上。找到下载的\
    \ Code::Blocks 安装程序并双击启动。按照屏幕上的说明开始安装。\n\n  ![](img/840275566c862102888f27d8ae2ac921_49_2.png)\n\
    \n- **步骤 4** 同意许可条款后，会出现可选的安装选项。你可以选择较小的安装，跳过某些组件，但我们建议你默认选择“完整”选项。\n\n  ![](img/840275566c862102888f27d8ae2ac921_49_3.png)\n\
    \n#### 步骤 5\n\n接下来，为 Code::Blocks 文件选择一个安装位置。这由你决定，但默认位置通常就足够了，除非你当然有特殊要求。单击“下一步”后，安装开始；安装完成后，会弹出一个通知，询问你是否现在启动\
    \ Code::Blocks，因此点击“是”。\n\n![](img/840275566c862102888f27d8ae2ac921_50_0.png)\n\
    \n#### 步骤 8\n\n在开始使用 Code::Blocks 之前，值得解释一下你为什么需要额外安装的编译器。首先，编译器是一个单独的程序，它会读取你的\
    \ C++ 代码，并根据最新的可接受编程标准进行检查；这就是为什么你需要最新可用的编译器。目前是 C++17，C++20 正在推进中。\n\n![](img/840275566c862102888f27d8ae2ac921_50_1.png)\n\
    \n#### 步骤 6\n\nCode::Blocks 第一次加载时，会自动检测你的系统上可能已经安装的任何 C++ 编译器。如果你没有安装任何编译器，请点击检测到的第一个选项\
    \ GNU GCC Compiler，然后点击“默认”按钮，将其设置为系统的 C++ 编译器。准备好继续时，点击“确定”。\n\n![](img/840275566c862102888f27d8ae2ac921_50_2.png)\n\
    \n#### 步骤 9\n\n本质上，计算机只能以二进制（即 1 和 0，或机器语言）工作和理解。用二进制编程对人类来说并不高效。例如，在 C++ 中向屏幕输出“Hello\
    \ World!”这几个字，用二进制表示会是这样：\n\n```\n0100011 0110111 01110101 01110100 0100000\n\
    0011100 0101111 00100000 01000101 00100000\n0101011 01001111 00100000 0101100\
    \ 00110000\n0101101 0101111 00100100 01101111 01000000\n0010111 0010011 01100101\
    \ 01110100 01000000\n0010001 01000110 00111111\n```\n\n![](img/840275566c862102888f27d8ae2ac921_50_3.png)\n\
    \n#### 步骤 7\n\n程序启动时，会出现另一条消息，通知你 Code::Blocks 当前不是 C++ 文件的默认应用程序。你有几个选项：保持一切不变，或允许\
    \ Code::Blocks 关联所有 C++ 文件类型。同样，我们建议你选择最后一个选项，将 Code::Blocks 与所有支持的文件类型关联。\n\n\
    ![](img/840275566c862102888f27d8ae2ac921_50_4.png)\n\n#### 步骤 10\n\n因此，编译器会接收你输入的\
    \ C++ 代码，并将其转换为机器语言。要执行 C++ 代码，IDE 会构建代码、检查错误，然后将其传给编译器，以检查标准化情况，并将其转换为 1 和 0，供计算机执行。停下来想想，这确实相当巧妙。\n\
    \n![](img/840275566c862102888f27d8ae2ac921_50_5.png)\n\n"
