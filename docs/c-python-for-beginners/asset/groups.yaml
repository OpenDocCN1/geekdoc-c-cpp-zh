  mdcn: "\n\n## C++ 数学运算\n\n编程本质上就是数学，正如你所料，C++ 内置了大量用于处理相当复杂数学运算的功能。对于将数学模型实现到代码中的人来说，C++\
    \ 提供了丰富的支持。它既可能极其复杂，也可能相对简单。\n\n### C++ = MC²\n\nC++ 中的基本数学符号与大多数其他编程语言一样。然而，通过使用\
    \ C++ 数学库，你还可以计算平方根、幂、三角函数等等。\n\n**第 1 步** C++ 的数学运算遵循与学校教授的相同规则，即乘法和除法优先于加法和减法。不过你也可以改变这种优先级。现在，创建一个新文件并输入：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nint main ()\n{\n    float\
    \ numbers = 100;\n\n    numbers = numbers + 10; // 这会在初始的 100 上加上 10\n\n    cout\
    \ << numbers << \"\\n\";\n\n    numbers = numbers - 10; // 这会从新的 110 中减去 10\n\n\
    \    cout << numbers << \"\\n\";\n}\n```\n\n![](img/840275566c862102888f27d8ae2ac921_73_0.png)\n\
    \n**第 2 步** 虽然简单，但这确实能让你的数学思维活跃起来。注意，我们为 `numbers` 变量使用了 `float` 类型。虽然你也可以使用整数，但如果突然开始使用小数，就需要根据所需的精度改用\
    \ `float` 或 `double`。运行代码并查看结果。\n\n![](img/840275566c862102888f27d8ae2ac921_73_1.png)\n\
    \n**第 3 步** 乘法和除法可以这样使用：\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    \nint main ()\n{\n    float numbers = 100;\n\n    numbers = numbers * 10; // 这会将\
    \ 100 乘以 10\n\n    cout << numbers << \"\\n\";\n\n    numbers = numbers / 10;\
    \ // 这会将 1000 除以 10\n\n    cout << numbers << \"\\n\";\n}\n```\n\n![](img/840275566c862102888f27d8ae2ac921_73_2.png)\n\
    \n**第 4 步** 同样，运行这段简单的代码并查看结果。虽然不算特别有趣，但这是 C++ 数学运算的入门。这里我们使用了 `float` 类型，因此你可以随意修改代码，乘以小数，也可以进行除法、加法和减法运算。\n\
    \n![](img/840275566c862102888f27d8ae2ac921_73_3.png)\n\n**第 5 步** 当你调用 C++ 数学库时，有趣的数学内容就出现了。这个头文件中包含数十个数学函数以及更多运算。从计算余弦、带两个参数的反正切，到\
    \ π 的值，应有尽有。你可以这样调用该头文件：\n\n```cpp\n#include <iostream>\n#include <cmath>\nusing\
