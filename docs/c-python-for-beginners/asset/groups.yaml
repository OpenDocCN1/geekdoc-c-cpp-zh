    | Dark red | Comments | `#Remember VAT` |\n| Light red | Error messages | `SyntaxError`\
    \ |\n\n- **STEP 8** The Python IDLE is a configurable environment. If you don’t\
    \ like the way the colours are represented, then you can always change them via\
    \ Options > Configure IDLE and clicking on the Highlighting tab. However, we don’t\
    \ recommend that, as you won’t be seeing the same as our screenshots.\n\n  ![](img/840275566c862102888f27d8ae2ac921_22_2.png)\n\
