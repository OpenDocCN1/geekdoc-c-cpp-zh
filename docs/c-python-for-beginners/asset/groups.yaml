  mdcn: "\n\n## 创建函数\n\n### 有趣的函数\n\n函数是你输入到 Python 中用来执行某项操作的一条命令。它是一小段自包含的代码，接收数据、处理数据，然后返回结果。\n\
    \n- **步骤 1** 函数不仅能处理数据，还能在 Python 中完成各种有用的操作，例如对数据进行排序、将项目从一种格式转换为另一种格式，以及检查项目的长度或类型。基本上，函数就是一个短单词后跟括号。例如，`len()`、`list()`\
    \ 或 `type()`。\n\n  ![](img/840275566c862102888f27d8ae2ac921_37_0.png)\n\n- **步骤\
    \ 2** 函数接收数据（通常是变量），根据函数被编程设定的功能对其进行处理，然后返回最终值。被处理的数据放在括号内，因此如果你想知道 antidisestablishmentarianism\
    \ 这个单词中有多少个字母，你可以输入：`len(\"antidisestablishmentarianism\")`，然后会返回数字 28。\n\n  ![](img/840275566c862102888f27d8ae2ac921_37_2.png)\n\
    \n- **步骤 3** 你可以用类似的方式将变量传递给函数。假设你想要获取一个人姓氏中的字母数量，你可以使用以下代码（此示例请进入文本编辑器）：\n\n\
    \  ```python\n  name = input(\"Enter your surname: \")\n  count = len(name)\n\
    \  print(\"Your surname has\", count, \"letters in it.\")\n  ```\n\n  按 F5 并保存代码以执行它。\n\
    \n  ![](img/840275566c862102888f27d8ae2ac921_37_1.png)\n\n- **步骤 4** Python 内置了数十个函数，数量多得无法在此有限的篇幅中一一介绍。不过，若要查看\
