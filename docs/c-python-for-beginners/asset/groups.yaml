    \ 等等。\n\nPython 创建于二十六多年前，如今已发展成为初学者学习计算机编程的理想入门语言。它非常适合爱好者、发烧友、学生、教师，以及那些需要在自己与外部硬件或计算机之间创建独特交互的人。\n\
