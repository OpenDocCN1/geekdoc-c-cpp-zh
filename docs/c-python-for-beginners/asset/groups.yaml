  - "[PAGE 17]\n\n# # How to Set Up\n# Python in Linux\n\nPython version 2.x is already\
    \ installed in most Linux distributions but as we’re going to be using Python\
    \ 3.x, there’s a little work we need to do first to get hold of it. Thankfully,\
    \ it’s not too difficult.\n\n# ## PYTHON PENGUIN\n\nLinux is such a versatile\
    \ operating system that it’s often difficult to nail down just one way of doing\
    \ something. Different distributions go about installing software in different\
    \ ways, so we will stick to Linux Mint 18.1 for this particular tutorial.\n\n\
    **STEP 1**  \nFirst you need to ascertain which version of Python is currently\
    \ installed in your Linux system; as we’ve mentioned, we’re going to be using\
    \ Linux Mint 18.1 for this section. As with macOS, drop into a Terminal by pressing\
    \ Ctrl+Alt+T.\n\n![](img/840275566c862102888f27d8ae2ac921_17_0.png)\n\n**STEP\
    \ 3**  \nSome Linux distros will automatically update the installation of Python\
    \ to the latest versions whenever the system is updated. To check, first do a\
    \ system update and upgrade with:\n\n`sudo apt-get update && sudo apt-get upgrade`\n\
    \nEnter your password and let the system do any updates.\n\n![](img/840275566c862102888f27d8ae2ac921_17_1.png)\n\
    \n**STEP 2**  \nNext enter: `python --version` into the Terminal screen. You should\
    \ have the output relating to version 2.x of Python in the display. Ours in this\
    \ particular case is Python 2.7.12.\n\n![](img/840275566c862102888f27d8ae2ac921_17_2.png)\n\
    \n**STEP 4**  \nOnce the update and upgrade is complete, you may need to answer\
    \ ‘Y’ to authorise any upgrades, enter: `python3 --version` to see if Python 3.x\
    \ is updated or even installed. In the case of Linux Mint, the version we have\
    \ is Python 3.5.2, which is fine for our purposes.\n\n![](img/840275566c862102888f27d8ae2ac921_17_3.png)"
  - '[PAGE 18]


    **STEP 5** However, if you want the latest version, 3.6.2 as per the Python website
    at the time of writing, you need to build Python from source. Start by entering
    these commands into the Terminal:


    ```

    sudo apt-get install build-essential checkinstall

    sudo apt-get install libreadline-gplv2-dev libncursesw5-dev libssl-dev libsqlite3-dev
    tk-dev libgdbm-dev libc6-dev libbz2-dev

    ```


    ![](img/840275566c862102888f27d8ae2ac921_18_0.png)


    **STEP 6** Open up your Linux web browser and go to the Python download page:
    **www.python.org/downloads**. Click on the Download Python 3.6.2 (or whichever
    version it’s on when you look) to download the source Python-3.6.2.tar.xz file.


    ![](img/840275566c862102888f27d8ae2ac921_18_1.png)


    **STEP 7** In the Terminal, go the Downloads folder by entering: `cd Downloads/`.
    Then unzip the contents of the downloaded Python source code with: `tar -xvf Python-3.6.2.tar.xz`.
    Now enter the newly unzipped folder with `cd Python-3.6.2/`.


    ![](img/840275566c862102888f27d8ae2ac921_18_2.png)


    **STEP 8** Within the Python folder, enter:


    ```

    ./configure

    sudo make altinstall

    ```


    This could take a little while depending on the speed of your computer. Once finished,
    enter: `python3.6 --version` to check the installed latest version.


    ![](img/840275566c862102888f27d8ae2ac921_18_3.png)


    **STEP 9** For the GUI IDLE, you need to enter the following command into the
    Terminal:


    ```

    sudo apt-get install idle3

    ```


    The IDLE can then be started with the command: `idle3`. Note, that IDLE runs a
    different version from the one you installed from source.


    ![](img/840275566c862102888f27d8ae2ac921_18_4.png)


    **STEP 10** You also need PIP (Pip Installs Packages) which is a tool to help
    you install more modules and extras. Enter:


    ```

    sudo apt-get install python3-pip

    ```


    Pip is then installed; check for the latest update with:


    ```

    pip3 install --upgrade pip

    ```


    When complete, close the Terminal and Python 3.x will be available via the Programming
    section in your distro’s menu.


    ![](img/840275566c862102888f27d8ae2ac921_18_5.png)'
