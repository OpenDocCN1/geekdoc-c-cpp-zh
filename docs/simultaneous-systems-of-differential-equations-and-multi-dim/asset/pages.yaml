  md: '# 2 Simultaneous Differential Equations and Multi-Dimensional Vibrations


    system of simultaneous differential equations, whose order N is the degree of
    the characteristic polynomial. The solutions corresponding to single or multiple,
    real or complex roots, are similar for a single (set of simultaneous) differential
    equation(s), and each dependent variable is a linear combination of them, with
    coefficients determined by the initial conditions; the number of independent and
    compatible initial conditions needed to specify a unique solution is equal the
    order of the single (set of simultaneous) differential equation(s). This implies
    that the solution of a linear system of M ordinary differential equations with
    constant (homogeneous) coefficients without forcing [section 7 (7.5)] (i) each
    of the M dependent variables is a linear combination of N independent particular
    integrals specified by the roots of the characteristic polynomial; (ii) there
    are N arbitrary constants of integration, for example, those in the first dependent
    variable; (iii) the coefficients in all other dependent variables involve the
    same N arbitrary constants of integration, in a way that is compatible with substitution
    back into the system of simultaneous ordinary differential equations.


    The case of a single (set of simultaneous) linear differential equation(s) with
    constant coefficients and a forcing term, can be considered using [sections 1.4–1.5
    (7.5)] the characteristic polynomial directly or as an inverse operator. A characteristic
    polynomial also exists for a single (set of simultaneous) linear ordinary differential
    equation(s) with power coefficients, leading to similar methods of solution for
    a single (set of simultaneous) linear finite difference equation(s), again leading
    to similar methods of solution [section] 1.9 (7.8–7.9)].


    # 7.1 Reduction of General to Autonomous Systems


    A general system of M simultaneous ordinary differential equations [subsection
    7.1.2] can be reduced to an autonomous system of differential equations [subsection
    7.1.1].


    # 7.1.1 Autonomous System of Differential Equations


    A generalized autonomous system of order M of ordinary differential equations
    (standard CXXI) has one independent variable x, and M dependent variables (7.1a)
    whose first-order derivatives (7.1b) depend explicitly only on all the dependent
    variables and the dependent variable:


    ```

    $m=1,...,M: \quad y_m^*(x) \equiv \frac{dy_m}{dx} = Y_m(x;y_1,...,y_M); \quad
    (7.1a, b)$

    ```'
