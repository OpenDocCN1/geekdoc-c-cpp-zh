  md: '# Oscillations with Several Degrees-of-Freedom


    in the electrical case, namely having in the connecting branch no (only) self
    [Figure 8.7a (8.8a)], resistor [Figure 8.7b (8.8b)] or capacitor [Figure 8.7c
    (8.8c)]. A signal travels without loss along a transmission line when the elements
    are electrical (mechanical) impedances of circuits with self (mass) and capacitor
    (springs) but no resistor (damper). A transmission line [Figure 8.6] is an infinite
    sequence of electrical (mechanical) circuits [Figure 8.5a(c)] represented by impedances
    [Figure 8.5b(d)] in series $Z_s$, and parallel $Z_p$. As an example is an electrical
    (mechanical) transmission line [Figure 8.4a(b)] with self (masses) and capacitor
    (springs) but no resistors (dampers); lossless transmission is possible if the
    frequency band lies at least above a cut-off frequency.


    The mechanical and electrical oscillations (waves) are described by ordinary (partial)
    differential equations with time (and position) as independent variables. Dissipative
    waves of second-order in space are described by the generalized equation of mathematical
    physics, with the spatial dependence specified by the Laplacian operator. The
    solution reduces to ordinary differential equations if the Laplacian is separable,
    for example, (Diagram 8.3) for:


    # COORDINATE SYSTEMS


    ![](img/080abdaa37584fa5219331ed46134fd7_305_0.png)


    **DIAGRAM 8.3** The two most common coordinate systems in the plane are Cartesian
    and polar. The polar coordinates cylindrical (spherical) coordinates by translation
    perpendicular to the plane (rotation around an axis passing through the center).
    The hyperserical (hypercylindrical) coordinates in $N$ dimensions add $N-2$ rotational
    coordinates to the spherical (cylindrical) coordinates.'
