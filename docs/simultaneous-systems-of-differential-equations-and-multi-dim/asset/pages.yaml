    to the vector field. The set of families of curves, for all possible surfaces
    (Figure 7.7), forms a normal surface (Figure 7.6), if vector field has zero helicity.
    The existence of a normal surface depends on: (i) either the conditions immediate
    integrability for the vector field; (ii) or on the existence of a parallel vector
    field obtained by multiplication by an integrating factor that satisfies the conditions
    of immediate integrability. The proof of the sufficiency of immediate integrability
