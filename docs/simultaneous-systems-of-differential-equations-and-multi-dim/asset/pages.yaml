    # 7.4.11 Natural Integrals and Banded System


    If all roots of the natural characteristic polynomial (7.58c) of the $M \times
    M$ matrix system (7.54) are distinct (7.64a–c) the N normal integrals (7.64d)
    satisfy a decoupled system of N ordinary linear differential equations of first
    order with the roots as coefficients (7.78a) = (7.96a, b):


    $n=1,...,N: \frac{dq_n}{dx} = a_n q_n$;


    $\begin{matrix} a_1 & 0 & 0 & \dots & 0 \ 0 & a_2 & 0 & \dots & 0 \ \vdots & \vdots
    & \vdots & \ddots & \vdots \ 0 & 0 & \dots & \dots & a_N \end{matrix} \begin{matrix}
    q_1(x) \ q_2(x) \ \vdots \ q_N(x) \end{matrix} = \begin{matrix} \frac{dq_1}{dx}
    \ \frac{dq_2}{dx} \ \vdots \ \frac{dq_N}{dx} \end{matrix}; (7.96a–c)$


    which is equivalent (standard XXXVII) to the $N \times N$ diagonal system (7.96c);
    thus, the transformation from simultaneous $(y_1,...,y_M)$ to natural $(q_1,...,q_N)$
    dependent variables diagonalizes the system (7.54), leading to a complete decoupling.
    If a root of the characteristic polynomial (7.70a, b) has multiplicity $\alpha_i$,
    the corresponding (standard XXXVIII) normal integrals (7.70c, d) satisfy (7.97a–c):


    ```

    $\frac{dq_{\beta}}{dx} = \frac{d}{dx}[x^{\beta-1} \exp(ax)] = \exp(ax)[x^{\beta-1}
    a + (\beta-1)x^{\beta-2}] = aq_{\beta}(x) + (\beta-1)q_{\beta-1}(x), (7.97a–c)$

    ```


    and in this case, the diagonal element $a_0$ is ruled by a two-band matrix:


    $\begin{matrix} a & 0 & 0 & \dots & 0 \ 1 & a & 0 & \dots & 0 \ 0 & 2 & a & \dots
    & 0 \ \vdots & \vdots & \vdots & \ddots & \vdots \ 0 & 0 & \dots & \alpha-1 &
    a \end{matrix} \begin{matrix} q_1(x) \ q_2(x) \ q_3(x) \ \vdots \ q_{\alpha}(x)
    \end{matrix} = \begin{matrix} \frac{dq_1}{dx} \ \frac{dq_2}{dx} \ \frac{dq_3}{dx}
    \ \vdots \ \frac{dq_{\alpha}}{dx} \end{matrix}, \quad (7.97d)$


    along the diagonal of the multiple root (7.97d), so that there is partial decoupling.'
