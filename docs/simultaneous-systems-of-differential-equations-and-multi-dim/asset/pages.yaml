    FIGURE 7.14

    A horn whose cross-sectional area is a Gaussian function of the axial coordinate
    ($a$) has as an analogue to a Gaussian elastic rod that acts as a displacement
    amplifier increasing the amplitude of small vibrations (Figure 7.11) at the wide
    base to larger vibrations at the narrow tip. The longitudinal displacement $u$
    as a function of the axial coordinate $x$ is specified by Hermite polynomials
    of degree $n$ for a set of discrete frequencies $\omega_0$. The fundamental frequency
    $\omega_0$ corresponds to a Hermite polynomial of first degree, implying that
    the corresponding (b) longitudinal displacement spectrum is a linear function
    of the axial coordinate; (c) the strain and stress spectra are constant along
    the length of the rod. This helps to prevent fracture or breaking of the tapered
    elastic rods used as displacement amplifiers in power tools, which operate close
    to resonance.'
