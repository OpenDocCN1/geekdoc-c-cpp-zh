    # 7.6 Natural Integrals for Simultaneous Homogeneous Systems


    The characteristic polynomial (matrix of polynomials of derivatives) applies to
    a single (simultaneous system of) linear differential equation(s) with: (i) constant
    coefficients [sections 1–3–15 (7.4–7)] using ordinary derivatives; (ii) power
    coefficients [sections 1–6–17 (7.6–7)] using homogeneous derivatives. Considering
    the simultaneous linear system of ordinary differential equations with homogeneous
    coefficients (subsection 7.6.1), in the unforced (section 7.6) case: (i) the system
    involves a matrix of polynomials of homogeneous derivatives (subsection 7.6.2);
    (ii) its determinant specifies the characteristic polynomial (subsection 7.6.3);
    (iii) the simple (multiple) root(s) of the characteristic polynomial lead to (subsection
    7.6.4) the natural integrals, which are powers (multiplied by logarithms) and
    specify the exponent; (iv) the general integral is a linear combination of the
    natural integrals (subsection 7.6.5) are arbitrary constants of integration for
    one dependent variable; (v) the remaining dependent variables are also linear
    combinations of the natural integrals, with coefficients determined by compatibility
    conditions (subsection 7.6.6) arising from the simultaneous differential system;
    (vi) the arbitrary constants of integration are determined by an equal number
    of independent and boundary conditions (subsection 7.6.7); (vii–viii) the dependent
    variables satisfy a non-diagonal system whereas (subsection 7.6.8) the natural
    integrals satisfy a diagonal uncoupled (two-banded diagonal minimally coupled)
    system for simple (multiple) roots of the characteristic polynomial (subsection
    7.6.9).


