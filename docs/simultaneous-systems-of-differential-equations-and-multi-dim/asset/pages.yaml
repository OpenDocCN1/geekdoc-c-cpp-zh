  md: '# About the Author


    L.M.B.C. Campos was born on March 28, 1950, in Lisbon, Portugal. He graduated
    in 1972 as a mechanical engineer from the Instituto Superior Tecnico (IST) of
    Lisbon Technical University. The tutorials as a student (1970) were followed by
    a career at the same institution (IST) through all levels: assistant (1972), assistant
    with tenure assistant professor (1978), associate professor (1982), chair of Applied
    Mathematics and Mechanics (1985). as the coordinator of undergraduate and postgraduate
    degrees in 1991. He is the coordinator of the Scientific Area of Applied and Aerospace
    Mechanics in the Department of Mechanical Engineering. He is also the director
    and founder of the Center for Aeronautical and Space Technology.


    In 1977, Campos received his doctorate on "waves in fluids" from the Engineering
    Department of Cambridge University, England. Afterwards, he received a Rouse Bull
    Ball Scholarship to study at Trinity College, while on leave from IST. In 1984,
    his first sabbatical was a Senior Visitor at the Department of Applied Mathematics
    and Theoretical Physics of Cambridge University, England. In 1991, he spent a
    second sabbatical as an Alexander von Humboldt scholar at Max-Planck Institute
    for Aeronautics at Katzenburg, Germany. Further sabbaticals abroad were excluded
    by major commitments to the home. The latter were always compatible with extensive
    professional travel to participate in scientific meetings, individual or national
    representation in international institutions, and collaborative research projects.


    Campos received the Von Karman medal from the Advisory Group for Aerospace and
    Development (AGARD) and Technology Organization (RTO). Participation in AGARD/RTO
    included serving as a vice-chairman of the System Concepts and Integration Panel,
    and chairman of the Flight Mechanics Panel and of the Flight Vehicle Integration
    Panel. He was also a member of the Flight Techniques Working Group. Here he was
    involved in the creation of an independent flight test capability, active in Portugal
    during the last 30 years, which has been used in national and international projects,
    including Eurocontrol and the European Space Agency. The participation in the
    European Space Agency (ESA) has afforded Campos the opportunity to serve on various
    program boards at the levels of national representative and Council of Ministers.


    His participation in activities sponsored by the European Union (EU) has included:
    (i) 27 research projects with industry, research, and academic


