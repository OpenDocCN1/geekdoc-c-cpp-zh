    depending on position (velocity) and leading [subsection 8.1.2 (8.1.3)] to the
    potential (dissipation) function. The restoring, friction, inertia, and applied
    forces (power of the forces, including the potential and dissipation functions)
    appear in the momentum (energy) equation [subsection 8.1.5 (8.1.6)] and apply
    both to decoupled and simultaneous oscillators (subsection 8.1.4). The energy
