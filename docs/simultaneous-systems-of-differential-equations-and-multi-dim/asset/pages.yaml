  md: 'xiv


    Diagrams, Notes, and Tables


    +   D 8.2 Considering a radioactive disintegration chain (Figure 8.4a) the non-resonant
    (resonant) cases correspond to distinct (coincident) disintegration rates, leading
    to two cases 2A–B for the first disintegration. The second disintegration has
    cases 3A–E, of which one non-resonant, three resonant and one doubly resonant.
    The N-th disintegration has N/(N–k), including one non-resonant case k=0 and one
    N-resonant case k=N........................234


    +   D 8.3 The most common coordinate systems in the plane are Cartesian and polar.
    The polar yields cylindrical (spherical) coordinates by translation perpendicular
    to the plane (rotation around an axis passing through the center). The hyperserical
    (hypercylindrical) coordinates in N dimensions add N–2 rotational coordinates
    to the spherical (cylindrical) coordinates...........................................279


