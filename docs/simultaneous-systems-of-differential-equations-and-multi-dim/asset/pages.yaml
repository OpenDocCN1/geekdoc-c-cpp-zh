    the oscillator problem, and they occur a priori for decoupled systems. If an N-dimensional
    oscillator is forced at an externally applied frequency, it will oscillate with
    constant amplitudes and phase in the presence of damping; in the absence of damping,
    the amplitude of oscillation is still constant except if the applied frequency
    is close (equal) to a natural frequency, and beats (resonance) occur. In the case
    of N-dimensional oscillator, it is possible (section 8.3) to have: (i) internal
    beats (resonance) if two natural frequencies are close (equal); (ii) externally
    forced multiple beats (resonance) if the applied frequency is close (equal) to
    several coincident modal frequencies.


    The methods of study of N-dimensional linear oscillators with damping and forcing
    are similar to the one-dimensional case (chapter 2), replacing one variable by
    N, and single coefficients by matrices of coefficients. In order to illustrate
    the properties of N-dimensional oscillators with a minimum of algebra, it is sufficient
    to consider a two-dimensional oscillator (sections 8.3–8.5) of which one example
    is the vibration absorber (section 8.6). A particular class of N-dimensional systems
    leading to a banded matrix, with all terms except for the diagonal and parallel
    lines, are chains in which each element is connected only to the preceding and
    following, for example, a chain of radioactive disintegration (sequence of oscillators)
    consisting of first-(second)- order system [section 8.7 (8.8)]. An infinite chain
    becomes a transmission line (section 8.9), which may allow passage with amplitude
    within a frequency band and causes signal reflection outside the “band pass”;
    this problem leads to finite equations instead of ordinary differential equations.


