  md: '# 7 Simultaneous Differential Equations


    An ordinary differential equation of order N relates one independent and one dependent
    variable, with a set of derivatives of the latter with regard to the former up
    to including the order N. In the case of a simultaneous differential equations,
    there are M dependent variables and only one dependent variable (section 7.1).
    The derivatives of the former with regard to the latter appear in a set of simultaneous
    equations, which cannot be separated for each dependent variable (at least without
    manipulation).


    The simplest case of a system of M ordinary differential equations is an autonomous
    system (section 7.1) in which the derivative of each of the M variables is an
    explicit function of all the dependent variables, and does not involve any derivatives.
    The autonomous system of ordinary differential equations is related to the problem
    of finding the curves tangent to a continuous vector field (section 7.2), which
    always has a solution. In contrast, the problem of finding a family of hypersurfaces
    of first order in M variables has (does not) a solution (sections 3.8-9 and notes
    3.1-15) if the differential is exact or has an integrating factor (is inexact
    and has no integrating factor). Any system of M simultaneous ordinary differential
    equations can be transformed into an autonomous system (section 7.1); this leads
    to a method to eliminate a system of M ordinary differential equations into a
    single ordinary differential equation of order N for one of the dependent variables
    (section 7.3). This specifies the order N of the system of M simultaneous ordinary
    differential equations that equals (is less than) the sum of the higher-order
    derivatives in all M if the system is independent (redundant).


    The most important class of single (simultaneous) ordinary differential equation
    is the linear case with constant coefficients [sections 1.3–1.5 (7.4–7.7)] to
    which this can be reduced to the case of power coefficients [sections 1.6–1.8
    (7.6–7.7)]. In all of the cases, the solution is determined by the roots of a
    single characteristic polynomial. For a single linear differential equation with
    constant coefficients, the characteristic polynomial is the differential operator
    acting on the dependent variable (section 1.3). In the case of a simultaneous
    system of equations with M dependent variables, there is (section 7.4) an M×times
    M matrix of linear operators with constant coefficients, and its determinant specifies
    the characteristic polynomial of the'
