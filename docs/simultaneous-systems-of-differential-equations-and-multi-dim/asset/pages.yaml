    # 7.2 Tangents, Trajectories, and Paths in N-Dimensions


    An autonomous system of $N$ first-order coupled differential equations specifies
    a family of curves in a space of $N$ dimensions (subsection 7.2.1), which may
    lie on the intersection of $M \leq N$ hypersurfaces (subsection 7.2.3). The simplest
    cases $N=2(N=3)$ are plane curves specified by the intersection of two surfaces.
    Thus, the consideration of hypercurves (hypersurfaces) tangent (orthogonal) to
    a continuous $N$-dimensional vector field leads to an autonomous system of $N$
    differential equations [a first-order differential in $N$ variables (notes 3.1–3.15)]
    that always has (may not have) a solution.'
