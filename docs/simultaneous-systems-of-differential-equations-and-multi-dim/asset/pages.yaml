    # 7.7.8 Inverse Matrix of Polynomials of Homogeneous Derivatives


    The coupled linear system (7.192b) of ordinary differential equations with homogeneous
    coefficients may be (standard CLXI) formally inverted:


    ```

    $y_r(x) = \frac{1}{Q(\delta)} \sum_{m=1}^{M} Q_m(\delta) B_m(x),\n\$(7.229)

    ```


