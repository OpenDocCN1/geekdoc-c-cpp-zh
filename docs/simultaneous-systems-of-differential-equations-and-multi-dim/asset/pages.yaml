  md: '# Preface


    Volume IV (Ordinary Differential Equations with Applications to Trajectories and
    Oscillations) is organized like the preceding three volumes of the series Mathematics
    and Physics Applied to Science and Technology: (volume III) Generalized Calculus
    with Applications to Matter and Forces; (volume II) Transcendental Representations
    with Applications to Solids and Fluids; (volume I) Complex Analysis with Flows
    and Fields. The first book, Linear Differential Equations and Oscillatory; the
    second book, Non-Linear Differential Equations and Dynamical Systems; and the
    third book, Higher-Order Differential Equations and Elasticity of volume IV, respectively,
    to four to six of the series, and consist of chapters 1 to 6 of volume IV. The
    present book, Simultaneous Differential Equations and Multidimensional Vibrations,
    is the fourth book of volume IV and the seventh book of the series; it consists
    of chapters 7 and 8 of volume IV.


    Chapters 1, 3, and 5 focus on single differential equations, starting with (i)
    linear differential equations with constant or homogeneous coefficients; and continuing
    with (ii) non-linear first-order differential equations, including variable coefficients
    and (iii) non-linear second-order and higher-order equations. Chapter 7 discusses
    simultaneous systems of ordinary differential equations, and focuses mostly on
    the cases that have a matrix of characteristic polynomials, namely linear systems
    with constant or homogeneous power coefficients. The method of character-istic
    polynomials also applies to simultaneous systems of linear finite differential
    equations with constant coefficients.


    Chapters 2 and 4 focus on, respectively, linear and non-linear oscillators described
    by second-order differential equations, like the elastic bodies without stiffness
    in the chapter 6; the elastic bodies with stiffness in chapter 6 lead to fourth-order
    differential equations equivalent to coupled second-order systems. Chapter 8 considers
    multi-dimensional oscillators with any number of degrees of freedom, including
    damping, forcing, and multiple response. The discrete oscillators may be extended
    from a finite number of degrees-of-freedom to infinite chains. The continuous
    oscillators correspond to waves in homogeneous or inhomogeneous media, including
    elastic, acoustic, electromagnetic, and water surface waves. The combination of
    propagation and dissipation leads to the equations of mathematical physics.'
