    # 8.3 Coupled Circuits and Electromechanical Simulations


    The simplest case of the general theory (sections 8.1–8.2) of the damped N-dimensional
    free (forced) oscillator [section 8.4 (8.5)] is two-dimensional (section 8.3).
    Three examples are given of equivalent coupled circuits, such as each allows an
    electromechanical simulation (subsections 8.3.4–8.3.5) of the other two. The three
    analogous two-dimensional oscillators are: (i) masses with paired forces connected
    to each other and to two walls by three pairs of springs and dampers (subsection
    8.3.1); (ii) two electrical circuits consisting of diode switches, resistors,
    capacitors, and batteries with a common branch with a resistor and a capacitor
    (subsection 8.3.2); (iii) the suspension of a two-wheeled vehicle. The particular
    cases of the latter include: (iii-a) a diatomic molecule represented by two masses
    at a distance; (iii-b) a homogeneous rod acted by forces and moments that perform
    have, is vertical (rotary) displacements (subsection 8.3.3). The analogy among
    the three circuits applies to different physical coordinates (subsection 8.3.4)
    and the associated mass, friction, and resilience (damping and oscillation) matrices,
    which specify the modal (dispersion) matrix (subsection 8.3.5).


