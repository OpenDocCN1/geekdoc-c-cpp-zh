    # 7.3 Order of a Simultaneous System of Differential Equations


    The order of a simultaneous system of ordinary differential equations is defined
    as the highest of the orders of the decoupled ordinary differential equations
    satisfied by each of the dependent variables (subsection 7.3.1). The transformation
    to an autonomous system (subsection 7.1.2) leads to a procedure to eliminate all
    dependent variables but one (subsection 7.3.1), specifying the order of the original
    simultaneous system (subsection 7.3.2). Alternative less general methods to determine
    the order of a system of simultaneous ordinary differential equations in particular
    cases, for example, using first integrals to introduce arbitrary constants of
    integration and reduce the order of the system (subsection 7.3.3). Knowledge of
    order is essential to determine the number of independent and compatible initial
    conditions to ensure unity of solution.


