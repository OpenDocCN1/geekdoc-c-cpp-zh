  md: '# # Oscillations with Several

    Degrees-of-Freedom


    The theory of oscillators, amplifiers, and deformations involves (chapter 2) a
    linear second-order system with or without damping and forcing with one degree-of-freedom.
    It can be generalized in four directions: (i) nonlinear oscillations (chapter
    4), associated with non-linear restoring or damping forces; (ii) higher-order
    systems, such as fourth-order, for example, (chapter 6) the transverse deflection
    of one (two) dimensional elastic bodies with bending stiffness, including bars
    (plates); (iii) systems with several independent degrees-of-freedom, as multidimensional
    oscillators (chapter 8) with inertia, damping, resilience, and forcing; (iv) systems
    with several independent variables, leading to partial differential equations
    (notes 7.1 to 7.55 and 8.1 to 8.17), as waves depending on position (x) and time
    (t), or deformations depending on spatial coordinates. A case has already been
    presented involving all (i) to (iv) features: the strong bending and stretching
    of a plate (section 6.9) involves two fourth-order differential equations depending
    on two spatial coordinates coupling nonlineararly the transverse deflection and
    stress. The stress section concerns second-order linear oscillators with without
    damping and forcing (sections 8.1–8.2) in two dimensions (sections 8.3–8.6), while
    N-dimensional chains (sections 8.7–8.8) and transmission lines (section 8.9) with
    infinite dimension.


    The vibrations with small amplitude of a one-dimensional oscillator are (chapter
    2) an example of the solution of a linear ordinary differential equation (chapter
    1) in cases of free or forced oscillations. Very often, vibrating systems have
    more than one degree-of-freedom, for example, rigid bodies supported on springs
    and dampers, or associations of quasi-stationary circuits; in most cases, these
    degrees-of-freedom interact (chapter 8) and the multidimensional oscillator is
    described by a set of simultaneous ordinary differential equations (chapter 7).
    An oscillator with N degreesof-freedom (chapter 8.1) has N modal frequencies,
    and each degreeof-freedom generally consists of a linear superposition of oscillations
    at all these frequencies (chapter 8.2). It is possible to find a linear combination
    of the original degrees-of-freedom, which eliminates all modal frequencies but
    one; thus, a set of modal coordinates exist, each oscillating at one modal frequency,
    and leading to one of a set of N decoupled ordinary differential'
