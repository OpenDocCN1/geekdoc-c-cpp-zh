    # 7.5 Integrals of Forced and Unforced Systems


    The complete integral [section 1.2.6 (7.5.7)] of a single (simultaneous system)
    of linear forced differential equation(s) with variable coefficients [subsection
    1.2.1 (7.4.1)] consists of the sum of: (i) the general integral [subsection 1.2.4
    (section 7.4)] of the unforced equation(s), which contains all of the necessary
    constants of integration; (ii) any particular integral of the forced equation(s)
    [subsection 1.2.5 (section 7.5)], the simpler better. In the case of a single
    (simultaneous system of) linear differential equation(s) with constant coefficients
    the the characteristic polynomial (matrix of polynomials of derivatives) specifies:
    (i) the general integral of the unforced system [section 1.4 (7.4)], by exponential,
    circular, and hyperbolic sines and cosines and their products [subsection 1.5
    (subsections 7.5)] (ii) the forcings involving powers by using inverse polynomials
    (matrix of polynomials) of derivatives [section 1.5 (subsections 7.5.6–7.5.7)].
    Since the methods are similar (1.4–1) a shorter account is given considering a
    particular integral of a simultaneous system of linear differential equations
    with constant coefficients with by: (i) exponentials [subsection 7.5.1], including
    non-resonant and resonant cases [subsection 7.5.3] and multiple resonances (subsection
    5.7.2); (ii) the product of exponentials by circular or hyperbolic sines and cosines
    (subsections 7.5.4–7.5.5); (iii) powers or polynomials (subsections 7.5.6–7.5.7).
    The principle of superposition applies to simultaneous linear differential equations
    and allows addition of particular integrals [subsection 7.5.8].


