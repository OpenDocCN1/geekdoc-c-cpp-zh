    of homogeneous derivatives; (ii) the inverse (7.230a) of the characteristic polynomial
    (7.168b) that can be expanded (section 1.5) as a series of homogeneous derivatives,
    which applies to (7.229) and must converge (chapter 1.21):


    ```

    $Q(\delta) = \sum_{k=0}^{\infty} q_k \delta^k;\n\nB_{\ell}(x) = \sum_{\ell=0}^{\infty}
    B_{\ell} x^{\\ell},\n\$(7.230a, b)

    ```


    (iv) if the forcing vector is a polynomial of logarithms (7.230b), then there
    is non-convergence because the derivatives of order $k > L_m$ vanish:


    ```

    $\delta^k(\log^{\ell} x) = \begin{cases} (\ell-1)!(\ell-k+1)\log^{\ell-k} x &
    \text{if} \ell \leq k,\ k! & \text{if} \ell = k,\ 0 & \text{if} \ell > k. \end{cases},\n\$(7.231a–c)

    ```


    The relation, (7.231a) ≡ (7.198b), was obtained before, the case $\ell = k$ leads
    to a constant (7.231b), and hence, further differentiation $\ell > k$ gives zero
    (7.231c).'
