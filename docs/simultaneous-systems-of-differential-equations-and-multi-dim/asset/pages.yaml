  md: (i) Cartesian coordinates in any dimension; (ii) polar coordinates in the plane,
    which extend by $N - 2$ (rotation) to cylindrical (spherical) coordinates in space;
    (iii) adding $N - 2$ Cartesian coordinates leads to hyperspherical (hyper-cylindrical)
    coordinates. The separation of variables in the Laplacian for these (i) to (iii)
    and some other orthogonal coordinate systems lead to linear ordinary differential
    equations with variable coefficients whose solutions are special functions.
