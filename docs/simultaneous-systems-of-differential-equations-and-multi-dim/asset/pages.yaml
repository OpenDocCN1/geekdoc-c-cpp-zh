  md: '# Organization of the Contents


    Volume IV consists of ten chapters: (i) the odd-numbered chapters present mathematical
    developments; (ii) the even-numbered chapters contain physical applications; (iii)
    the last is a set of 20 detailed examples of (i) and (ii). The chapters are divided
    into sections and subsections, for example, chapter 7, section 7.1, and subsection
    7.1.1. The formulas are numbered by chapters in curved brackets; for example,
    (8.2) is equation of chapter 8. When referring to volume I the symbol I is inserted
    at the beginning, for example: (i) chapter L3.6, section L3.6.1, subsection L3.6.1.2;
    (ii) equation (L3.63a). The final part of each chapter includes: (i) a conclusion
    referring to the figures as a kind of visual summary; (ii) the notes, lists, tables,
    diagrams, and classifications as additional support. The latter (ii) appear at
    the end of each chapter, and are numbered within the chapter (for example, diagram—D7.2,
    note—N8.10, table—T7.4); if there is more than one diagram, note, or table, they
    are numbered sequentially (for example, notes—N7.1 to N7.55). The chapter starts
    with an introductory preview, and related topics may be mentioned in the notes
    at the end. The sections “Series Preface,” and “Mathematical Symbols” from the
    first book of volume IV are not repeated. The sections “Physical Quantities,”
    “References,” and “Index” focus on the contents of the present fourth book of
    volume IV.'
