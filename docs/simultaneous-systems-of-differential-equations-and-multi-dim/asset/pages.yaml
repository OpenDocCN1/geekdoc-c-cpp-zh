    $y_r(x) = H_r e^{bx}: \quad G_m e^{bx} = \sumsum_{r=1}^{M} P_{m,r}(D)H_r, e^{bx}
    = \sumsum_{r=1}^{M} P_{m,r}(b)H_r, \quad (7.117a, b)$

