    # 8.8 Sequence of Damped and Forced Oscillators


    Considering a sequence of second-order systems, the mechanical (electrical) circuits
    in Figure 8.4bc, this is not a Markov chain because each intermediate element
    depends on both the preceding and following (subsection 8.8.1). In case of three
    masses and four springs, if one of the intermediate elements has a very different
    mass from all others (subsection 8.8.3) then: (i) it splits into two if its mass
    is much larger; (ii) if its mass is much smaller, it can be omitted reducing the
    degrees of freedom by one (subsection 8.8.2). The analogy between mechanical (electrical)
    circuits [subsection 8.8.4] applies with any number of chains. In the general
    case of the damped oscillations of a chain N, the (i) modal damping frequencies
    are specified by (subsection 8.8.5) and the real (imaginary) parts of the complex
    conjugate roots of the modal polynomial of degree 2N; the dependence of each oscillator
    is (subsection 8.8.6) a superposition of modal coordinates with complex coefficients.
    The method of solution for a chain of oscillators (subsections 8.8.5–8.8.6) is
    illustrated explicitly (subsection 8.8.7) in the simplest cases of tripe or quadruple
    oscillators.


