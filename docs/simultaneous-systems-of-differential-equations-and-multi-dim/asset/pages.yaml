    # NOTE 7.1: Classification of Differential Equations


    The simplest equations (Diagram 7.1) are algebraic of two types: (i) rational,
    if they reduce to the ratio of polynomials (chapter I.31); (ii) transcendental,
    if they involve infinite sequences, such as series of products (chapters I.21,
    23, 25, 27, 29) or fractions (sections II.1.2-II.1.3, infinite products (sections
    II.1.4-II.1.5) or continued fractions (sections II.1.6-II.1.9). The next level
    above algebraic equations are those that involve analytical methods like differentiation
    (chapter I.11) and/or integration (chapters I.13, 15, 17, 19). The differential
    equations can be classified (Table 7.2) by four criteria (Diagram 7.2): (i/ii
    number of independent (dependent) variables; (iii) order; (iv) type. An ordinary
    (partial) differential equation [o.d.e or p.d.e] has (i) one (several) independent
    variable(s). A single or separate (simultaneous system) of differential equations
    [s.d.e.] has (ii) one (several) dependent variable(s). The (iii) order of a single
    differential equation is that of the highest derivative; in the case of a simultaneous
    system of differential equations the order is the highest of all single differential
    equations obtained by elimination for each dependent variable (section 7.3). The
    most common are first-order and second-order differential equations (chapters
    2, 3, 4, 5, and 9); besides higher-order equations and systems (1, 6, 7, 8);


