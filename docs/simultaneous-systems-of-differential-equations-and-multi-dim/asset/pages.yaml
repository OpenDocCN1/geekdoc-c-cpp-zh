  md: '# Diagrams, Notes, and Tables


    # Diagrams


    +   D 7.1 Types of equations, (a) algebraic, (b) finite difference, (c) differential,
    (d) integral, (e) fractional differential and (f) delay with some combinations
    in the Diagram 7.3................84


    +   D 7.2 Classification of differential equations according to: (i)(ii) the number
    of independent and dependent variables; (iii) the order; (iv) the non-linear and
    linear, the latter with special types of coefficients. The ordinary and partial
    differential equations may be combined with four other types of equations from
    Diagram 7.1................................................85


    +   D 7.3 The oscillators (waves) are specified by ordinary (partial) wave equations
    (Diagram 7.3) depending only on time (t) (also on position (xi)). In the case
    of waves in a steady inhomogeneous medium, whose properties do not depend only
    on position, the spectrum of a wave of fixed frequency depends the oscillators
    with several degrees-of-freedom (waves with several variables) lead to simultaneous
    systems of ordinary (partial) differential equations................................................................128


    +   D 7.4 The acoustics of ducts includes the cases of uniform and non-uniform
    cross-sections. The acoustics of non-uniform ducts or horns may be considered:
    (i)/(ii) in the high (low) frequency approximations of sound rays (scattering);
    (iii) the intermediate case of diffraction requires exact solutions of the wave
    equations, including the nine duct shapes in the Table 7.5...............................................132


    +   D 8.1 The classification of oscillations applies both in one (several) dimensions
    [chapter 2|8] and uses the same criteria: (i) free (forced) in the absence (presence)
    of external forces; (ii) undamped (damped) in the absence (presence) of dissipation.
    The damping is weak (strong) if much smaller (comparable) to the modal frequency.
    Amplification can be seen as negative damping. The sinusoidal forcing is non-resonant
    (resonant) if the applied frequency does not (does) coincide with a modal frequency.
    Beats occur at the undamped transition from non-resonant to resonant response................................184'
