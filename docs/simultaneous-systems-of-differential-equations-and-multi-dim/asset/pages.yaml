  md: '# 86 Simultaneous Differential Equations and Multi-Dimensional Vibrations


    # NOTE 7.2: Difference, Fractional, and Integral Equations


    Diagram 7.1 also indicates other equations with properties related to differential
    equations namely: (a) finite difference equations; (b) fractional differential
    equations; (c) integral equations; (d) delay differential equations. The single
    or separate (simultaneous systems) of (a) finite differential equations[section]1.9
    [7.8–79] can be solved by methods similar to differential equations in the linear
    case with constant [sections 1.3–1.6 [7.4–75]] or homogeneous equations [1.7–1.8
    (7.6–77)] coefficients. The fractional differential equations involve derivatives
    of non-integer order, that is, the order may be a rational, real or complex number.
    They are a particular case of (c) linear integral equations, of which an example
    is:


    ```

    $y(x) = \int_{a}^{x} K(x;\xi) y(\xi) d\xi;$

    ```


    the integral equation (7.326) is linear because the kernel or $K(x;\xi)$ does
    not involve the dependent variable $y$, though it may involve the dependent variable.
    A delay differential equation involves (d) the dependent variable and its derivatives
    for different values of the independent variable, for example:


    ```

    $0 = F(y(x), y(x-x_1), y''(x-x_2), y''''(x-x_3));$

    ```


    The various types of equations may be combined, for example, as integro-differential
    equations:


    ```

    $y''''(x) + e^x y(x) = \int_{a}^{x} K(x;\xi) y(\xi) d\xi;$

    ```


    Two methods are illustrated for linear partial differential equations with two
    independent variables: (i) the method of separation of variables, leads to two
    ordinary differential equations, and applies always in the case of constant coefficients,
    for example, one-dimensional waves in homogeneous steady media (notes 6.1–62);
    (ii) if the coefficients depend only one variable, for one-dimensional waves in
    inhomogeneous steady media (notes 7.6–750), a single ordinary differential equation
    is obtained using the Fourier series (notes 1.9–1.10) or integrals (notes 1.11–1.14)
    or Laplace transforms (notes 1.15–1.28).


