    # 8.6 Principle of the Vibration Absorber


    A two-dimensional coupled oscillator of special interest is the vibration absorber,
    whose principle of operation can be explained as follows: (i) consider a primary
    second-order damped system forced at an applied frequency $\omega_0$; (ii) a second-order
    undamped system is coupled (subsection 8.6.1) with natural frequency tuned to
    be equal to the applied frequency (iii) that the forced oscillation in the first
    system is pressed, and is transferred to the second system (subsection 8.6.2);
    (iv) the free oscillations of both systems decay on account of the damping (subsection
    8.6.3); (v) the vibration absorber does not apply to an undamped system (subsection
    8.6.4), but a weak damping is sufficient (subsection 8.6.5) for it to become effective
    after a sufficiently long time. Thus, in the vibration absorber both circuits
    have transient oscillations, but the secondary circuit, not the primary circuit,
    has forced oscillations (subsection 8.6.6).


