    # About the Author


    institutions; (ii) membership of various Committees, including Vice-Chairman of
    the Aeronautical Science and Technology Advisory Committee; (iii) participation
    on the Space Advisory Panel on the future role of EU in space. Campos has been
    a member of the Space Committee of the European Science Foundation, which works
    with the Space Board of the National Science Foundation of the United States.
    He has been a member of the Committee for Peaceful Uses of Outer Space (COPUOS)
    of the United Nations. He has served as a consultant and advisor on behalf of
    these organizations and other vice-chairman of the Portuguese Academy of Engineering,
    fellow of the Royal Aeronautical Society, Astronomical Society and Cambridge Philosophical
    Society, associate fellow of the American Institute of Aeronautics and Astronautics,
    and founding and life member of the European Astronomical Society.


    Campos has published and worked on numerous books and articles. His publications
    include 10 books as a single author, one as an editor, and one as a co-editor.
    He has published 152 papers (82 as the single author, including 12 reviews) in
    60 journals, and 254 communications to symposium. He has served as reviewer for
    40 different journals, in addition to 23 reviews published in Mathematics Reviews.
    He is or has been member of the editorial boards of journals, Progress in Aerospace
    Sciences, International Journal of Aeronautics, International Journal of Sound
    and Vibration, and Air & Space Science.


    Campos''s area of research focus on four topics: acoustics, magnetohydrodynamics,
    special functions, and flight dynamics. His work on acoustics has concerned the
    generation, propagation, and refraction of sound in flows with mostly aeronautical
    publications. His work on magnetohydrodynamics has concerned magneto-gravity-inertial
    waves in solar-terrestrial and stellar physics. His developments on special functions
    have used integration operators, generalizing the ordinary derivative and primitive
    to complex order; they have led to the introduction of new special functions.
    His work on flight dynamics has concerned aircraft and rockets, including trajectory
    optimization, performance, stability, control, and atmospheric disturbances.


    The range of topics from mathematics to physics and engineering fits with the
    aims and contents of the present series. Campos''s experience in university teaching
    and industrial research has enhanced his ability to make the series valuable to
    students from undergraduate level to research level.


    Campos''s professional activities on the technical side are balanced by other
    cultural and humanistic interests. Complementary non-technical interests include
    classical music (mostly orchestral and choral), plastic arts (painting, sculpture,
    architecture), social sciences (psychology and biography), history (classical,
    renaissance and overseas expansion) and technology (automotive, photo, audio).
    Campos is listed in various biographical publications, including *Who''s in the
    World* since 1986, *Who''s in Science and Technology* since 1994, and *Who''s
    in America* since 2011.'
