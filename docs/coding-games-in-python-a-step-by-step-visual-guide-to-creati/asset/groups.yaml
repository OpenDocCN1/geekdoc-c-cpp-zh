    \ **Run Module**, or just press the **F5** key.\n\n```\n```python\nimport pgzrun\n\
    \ndef draw():\n    screen.draw.text(\"Hello\", topleft=(10, 10))\n\npgzrun.go()\n\
    ```\n```\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_26_1.png)\n\n# IMPORTANT!\n\
