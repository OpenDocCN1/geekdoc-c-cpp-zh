    # # How to build

    # Red Alert


    You’ll need lightning-fast reactions to beat this game. Click on the red star
    to keep the game moving. Anything other than red will land you in trouble.


    # ## What happens


    When the game begins, two stars appear and start moving down the screen. The player
    needs to click on the red star before the stars reach the bottom of the screen.
    Each time the red star is clicked, the game moves on to the next level. With each
    level, more green and red stars are added and they move faster than before. If
    the player clicks on any star other than the red one, or if the stars reach the
    bottom of the screen, the game ends.


