  mdcn: "\n## 创建龙巢\n\n游戏中的每条龙都有自己的龙巢，里面有特定数量的龙蛋，并对应简单、中等或困难难度等级。你可以使用 Python 的字典来跟踪创建这些龙巢所需的所有元素。每个字典都包含用于龙和龙蛋的\
    \ Actor，以及用于跟踪每条龙睡眠周期的变量。首先为最简单的龙巢创建一个字典。请在第 6 步的代码下方仔细输入这些行。\n\n```python\nreset_required\
