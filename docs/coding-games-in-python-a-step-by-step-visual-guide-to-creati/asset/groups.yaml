    # Running your program


    Because your games use Pygame Zero, you usually have to run them in a different
    way from normal Python programs. It isn''t difficult once you get used to it,
    however.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_25_0.png)


    +   6. **Open Command Prompt or Terminal window**

    +      To run the program, you can use the command line. If you''re using a Windows
    computer, this is in the Command Prompt app. If you''re on a Mac, open the Terminal
    app.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_25_1.png)


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_25_2.png)


    This is what the icon for Command Prompt looks like.


    This is what the icon for the Terminal window looks like.


    +   7. **Type in the Pygame Zero command**

    +      To tell Pygame Zero to run the game, type `pgzrun` into the command line
    and leave a space, but don''t press **Enter** yet!


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_25_3.png)


    Don''t forget to leave a space after `pgzrun`.


    +   8. **Drag and drop the IDLE file**

    +      Keep the app open, and using Explorer (Windows) or Finder (Mac), go to
    the folder where you saved your program. Once you find it, drag and drop the `.py`
    file into the command line.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_25_4.png)


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_25_5.png)


    Drag and drop `hello.py` into the Command Prompt or Terminal window.


    The location of your **IDLE** file will appear here when you drop it in.


    +   9. **Run the program**

    +      Now that you''ve typed in the `pgzrun` command and your computer knows
    where to find the **IDLE** file, press **Enter**. This will launch Pygame Zero.


    +   10. **Final screen**

    +       If your program is working correctly, you''ll see a window with a ''Hello''
    message written in the top-left corner of the screen. Good job! Now it''s time
    to become a Python games coder!'
