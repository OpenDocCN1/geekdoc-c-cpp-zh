    # # How to build

    ## Dance Challenge


    Get your groove on with this fast-paced game. Watch the dancer move to the music
    and then put your memory skills to the test by repeating those moves. How long
    can you keep going without making a mistake?


    # ## What happens


    In this game, the dancer performs a sequence of moves. You need to remember this
    sequence and make him repeat it using the four arrow keys on the keyboard.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_139_0.png)


    Each correct move will earn you a point.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_139_1.png)


    **< Dancer**


    The dancer loves showing off his moves! Follow him carefully to keep on playing.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_139_2.png)


    **< Colored squares**


