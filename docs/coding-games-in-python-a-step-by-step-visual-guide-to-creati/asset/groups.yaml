    # ## Using numbers


    Variables can be used to store numbers, which can then be used in calculations.
    You can use them with symbols, just like you do in math. Be careful with multiplication
    and division, though, because they use different symbols from the ones you use
    at school.


    | Symbol | Meaning |

    |---|---|

    | + | add |

    | − | subtract |

    | * | multiply |

    | / | divide |


    # ### 1. A simple calculation


    Type this code into the shell window. It uses two variables, x and y, which store
    integers to perform a simple calculation. Press Enter to see the answer.


    ```

    ```text

    >>> x = 2

    >>> y = x * 3

    >>> print(y)

    6

    ```

    ```


    Create a new variable, x, and assign the value 2 to it.


    Multiply by 3 and assign the result to another variable, y.


    Print the value assigned to y.


    The result of the calculation.


    # ### 2. Change a value


    To change the value of a variable, just assign a new value to it. In this code,
    assign the value 5 to x. Print the value assigned to y again. What do you think
    the result will be?


    ```

    ```text

    >>> x = 5

    >>> print(y)

    6

    ```

    ```


    Change the value of x.


    The result hasn''t changed—next we''ll find out why.


    # ### 3. Update the value


    The value of y needs to be updated to get the correct result. To do this, you
    need to run the y = x * 3 calculation again. Now the code assigns the new value
    to y after x has been changed.


    ```

    ```text

    >>> x = 5

    >>> y = x * 3

    >>> print(y)

    15

    ```

    ```


    You need to redo the calculation to update the value of y.


    # ### LINGO

    ## Integers and floats


    In coding, different types of numbers can be stored in variables. Whole numbers
    are called “integers,” and numbers with a decimal point in them are called “floats.”
    Integers are usually used to count things, like a player’s score, whereas floats
    are usually used for measurements, such as temperature.


