  - '[PAGE 15]


    # # Gaming in Python


    Video games are computer programs that contain a bunch of instructions. Python
    can be used to build lots of different types of games. With Python, there’s something
    for every gamer!


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_15_0.png)


    # ## Types of games


    There are lots of different categories, or genres, of computer games. These range
    from simple one-button games to more complex strategy ones. Which genre would
    you like to create first?


    ▷ **One button**


    With Python, you can build fun, action-packed games that only need one button
    to be played. These games are so addictive, you’ll want to play them over and
    over again.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_15_1.png)


    ◁ **Puzzles**


    Puzzles are a great way to exercise your brain or test someone’s general knowledge.
    They come in all shapes and sizes, from jigsaw puzzles to word and number games.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_15_2.png)


    △ **Platform**


    Platform games, such as racing games, create the illusion of speed by making the
    background scroll past the player’s viewpoint. The gameplay generally involves
    moving around obstacles or jumping over them.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_15_3.png)


    △ **Multiplayer**


    Some games you play by yourself, but others let you compete against other players.
    You can use Python to build multiplayer games and challenge your friends.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_15_4.png)


    ◁ **Strategy**


    A strategy game is all about decisions. You need to plan ahead and make the right
    choices to win.'
  - '[PAGE 16]


    # Python modules


    Python has bundles of code called “modules” that help you complete common coding
    tasks. You can use these modules by importing them into your programs. Here are
    some Python modules that you might find useful.


    # ▽ Pygame


    Pygame is designed for writing games in Python. With this module, you can easily
    add and control game characters, update scores and timers, use special animations
    and graphics, and use gamepads and joysticks with your games. It is not a built-in
    Python module, so it needs to be installed separately.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_16_0.png)


    # EXPERT TIPS


    # Downloading modules


    Python comes with several built-in modules for developing games, such as Pyglet.
    But some other modules, like Pygame, have to be downloaded separately.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_16_1.png)


    # △ Pygame Zero


    Pygame Zero is a great module for beginner game programmers. It’s a simplified
    version of Pygame, which makes it even easier to get started by hiding some of
    Pygame’s more complicated features. It comes with several tools that are useful
    for beginners, but it’s also powerful enough to build more impressive games.


    # ▽ Math


    Math is a standard Python module that can be used to perform simple calculations
    in games. However, you might need to use other modules for trickier calculations.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_16_2.png)


    # ▷ Random


    This module can pick a random number or shuffle a list into a random order. It
    is great for adding an element of chance to a game. Use it when you want to simulate
    rolling dice or when choosing a random enemy for the player to face.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_16_3.png)


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_16_4.png)


    # ◁ Time


    This module provides tools to work with time and dates in a program. For example,
    you might need to calculate how many seconds have passed since a game started.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_16_5.png)


    # ◁ Tkinter


    This tool is used to build simple graphics in games to create Graphical User Interfaces
    (GUIs, pronounced “goo-eyes”) that let users interact with, and control, Python
    programs.'
