    \ the same block of code over and over again. There are many different types of\
    \ loops.\n\n# ## “For” loops\n\nWhen you know exactly how many times you want\
    \ a loop to repeat, you can use a for loop. In this example, the code prints “You\
    \ are the high scorer!” ten times. Try out the code for yourself in the shell\
    \ window.\n\n```\n```python\n>>> for count in range(1, 11):\n        print(\"\
    You are the high scorer!\")\n```\n```\n\nThis is the loop variable.\n\nThe code\
    \ that gets repeated is known as the “loop body.”\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_37_0.png)\n\
    \n# ### Loop variable\n\nThe loop variable keeps track of how many times the loop\
    \ has run so far. At the start of the loop, it’s equal to the first number in\
    \ the range. The second time around, it’s equal to the second number in the range,\
    \ and so on. Once it completes the second-to-last number in the range, the loop\
    \ stops.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_37_1.png)\n\n# ### Loop body\n\
    \nThe block of code that gets repeated in a loop is called the loop body. You\
