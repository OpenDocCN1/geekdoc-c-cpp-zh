  mdcn: "\n\n## 如何制作《射击水果》\n\n这个简单的射击游戏是一种练习瞄准的有趣方式。当苹果出现时，点击它进行“射击”。不过要仔细瞄准，因为如果没击中，游戏就结束了！\n\
