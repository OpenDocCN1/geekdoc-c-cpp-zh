    \ 将图像一张接一张显示，使其看起来像有东西在移动的过程。\n- **布尔表达式** 结果为 True 或 False 的语句，会导向两种可能的结果。\n\
    - **分支** 程序中可供选择不同选项的节点。\n- **错误** 程序代码中的错误，会导致程序以意外的方式运行。\n- **调用** 在程序中使用函数。\n\
    - **命令行** 让你在命令提示符或终端窗口中输入命令的屏幕。\n- **命令提示符** Windows 电脑上的一个应用程序，允许用户输入并执行命令。\n\
    - **注释** 添加到程序中的文本说明，使代码更易理解，程序运行时会被忽略。\n- **条件** 用于在程序中做出决定的“True 或 False”语句。另见*布尔表达式*。\n\
    - **常量** 值在整个程序中应保持不变的变量。程序员命名常量时使用大写字母，以便让其他程序员知道其值不应被更改。另见*变量*。\n- **坐标** 用于精确定位的一对数字。通常写作\
    \ (x, y)。\n- **数据** 信息，例如文本、符号和数值。\n- **字典** 成对存储的数据项集合，例如国家及其首都。\n- **调试** 查找并纠正程序中的错误。\n\
    - **加密** 一种对数据进行编码的方式，使只有特定的人能够读取或访问它。\n- **事件** 计算机程序可以对其作出反应的事情，例如按键或点击鼠标。\n\
    - **文件** 以名称存储的数据集合。\n- **标志变量** 可以取两种状态（例如 True 和 False）的变量。\n- **浮点数** 带小数点的数字。\n\
    - **流程图** 将程序展示为一系列步骤和决策的图表。\n- **函数** 执行特定任务的代码。也称为过程、子程序或例程。\n- **全局变量** 可在程序每个部分中使用的变量。另见*局部变量*。\n\
    - **图形** 屏幕上的视觉元素，例如文本、图片、图标和符号。\n- **GUI** GUI，即图形用户界面，是构成程序可见且可交互部分的按钮和窗口的名称。\n\
    - **巧妙改动** 对代码进行巧妙的更改，使其实现新功能或变得更简单。（也指未经许可访问计算机。）\n- **黑客** 闯入计算机系统的人。“白帽”黑客为计算机安全公司工作，寻找问题以便修复。“黑帽”黑客闯入计算机系统以造成伤害或从中获利。\n\
    - **缩进** 将一块代码放在比前一块更靠右的位置。缩进通常为四个空格。特定代码块中的每一行都必须缩进相同的量。\n- **索引号** 分配给列表中项目的编号。在\
