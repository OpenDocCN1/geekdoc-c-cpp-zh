    ```\nspells = 11\nif (spells > 10):\n    print(\"You gained the title Enchanter!\"\
    )\n```\n\nThis branch runs if the condition is True.\n\n# **How it works**\n\n\
    In this example, the program checks to see the number of spells you’ve cast. If\
    \ it’s more than ten, the program prints “You gained the title Enchanter!” If\
    \ the number of spells you cast is less than ten, the message is not printed.\n\
    \n# ▽ **Two branches**\n\nWhat if you want the program to do one thing if a condition\
    \ is True, but another if it’s False? In this case, you need a command with two\
    \ possible branches, called an if-else statement.\n\n```\ngame_over = True\nif\
    \ game_over:\n    print(\"Game Over!\")\nelse:\n    print(\"Keep playing!\")\n\
    ```\n\nThis block runs if the condition is False.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_36_1.png)\n\
    \nThis block runs if the condition is True.\n\n# **How it works**\n\nIn this example,\
    \ there’s a variable called game_over, which is set to True. The if statement\
    \ checks to see if game_over is True. If it is, the program prints “Game Over!”\
    \ If it isn’t, the else statement runs, to print “Keep playing!” Try running this\
    \ code with game_over set to True, then False, to see this in action.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_36_2.png)\n\
    \nThis is the first condition.\n\n```\nghosts = 3\nif ghosts > 1:\n    print(\"\
    It’s so spoooky!\")\nelif ghosts > 0:\n    print(\"Get that ghost!\")\nelse:\n\
    \    print(\"Ghosts all gone!\")\n```\n\nThis block runs if the second condition\
    \ is True.\n\nThis block runs if both conditions are False.\n\n# ▽ **More than\
    \ two branches**\n\nWhen there are more than two possible paths, the command elif\
    \ (short for “else-if”) can be used in your program. In the following example,\
    \ you need to capture several ghosts in one go.\n\n# **How it works**\n\nIn this\
    \ program, the variable ghosts has been set to 3, so the first branch is True\
    \ and the program prints “It’s so spoooky!” But if the value in ghosts was 1,\
    \ the first branch would be False, so the second branch would run, printing “Get\
    \ that ghost!” If neither of the above branches are True, the program moves on\
    \ to the third branch to print “Ghosts all gone!” An elif statement must always\
    \ come after an if and before else."
