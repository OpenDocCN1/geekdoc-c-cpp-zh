    \ **Hello Martin** 中的字符数量，请在创建该字符串后，在 shell 中输入以下代码行，然后按 **Enter** 键。\n\n```python\n\
    >>> len(message)\n12\n```\n\n字符数量（包括空格）都会被计算在内。\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_31_1.png)\n\
    \n## 创建列表\n\n列表用于存储一组数据。它可以容纳许多不同的值，并保持它们的顺序。例如，列表可以存储游戏中（如“配对”游戏）的一副牌，这样代码就能知道接下来该发哪张牌。列表中每个值的位置都用一个数字标识，从\
    \ 0 开始。你可以使用这些数字来更改列表中的值。\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_32_0.png)\n\
    \n### 1. 多个变量\n\n假设你在编写一个多人游戏，并且想为每张牌设置一个不同的变量。你需要 52 个变量才能存储一整副牌，但现在我们只用 6 张牌来操作。\n\
    \n```python\n>>> card1 = \"1 hearts\"\n>>> card2 = \"2 hearts\"\n>>> card3 = \"\
    3 hearts\"\n>>> card4 = \"4 hearts\"\n>>> card5 = \"5 hearts\"\n>>> card6 = \"\
    6 hearts\"\n```\n\n无需输入这段代码。\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_32_1.png)\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_32_2.png)\n\n### 2. 变量中的列表\n\n使用列表来存储所有牌的值要比逐个使用这么多变量容易得多。要创建列表，请将你想存储的值用方括号括起来。\n\
    \n```python\n>>> cards = [\"1 hearts\", \"2 hearts\", \"3 hearts\", \"4 hearts\"\
    , \"5 hearts\", \"6 hearts\"]\n```\n\n该列表被赋值给变量 **cards**。\n\n这些值必须用逗号分隔。\n\n\
    ![](img/3188b147f991a51de14dcd2bb4b4c42e_32_3.png)\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_32_4.png)\n\
    \n### 3. 从列表中获取元素\n\n一旦将所有值放入列表中，操作列表就变得很简单了。要从列表中获取某个元素，请输入列表名称，然后在方括号内输入该元素在列表中的位置。但请注意——在\
    \ Python 中，列表的第一个位置是 0，而不是 1。现在试着从你的 cards 列表中取出不同的牌。\n\n```python\n>>> cards[0]\n\
    \"1 hearts\"\n\n>>> cards[5]\n\"6 hearts\"\n```\n\n这行代码获取列表中的第一个值。\n\n这是我们列表中的最后一个值。\n\
    \n对于我们这个较小的列表，最后一个位置是 5，但对于整副牌的列表，它将是 51。\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_32_5.png)\n\
    \n## 做出决策\n\n玩游戏时需要就下一步做什么做出决策。这些决策通常基于问题的答案。例如，“我还有命吗？”、“有人在追我吗？”、“我打破最高分了吗？”\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_33_0.png)\n\n### 比较\n\n计算机也会通过提问来决定下一步做什么。这些问题通常涉及比较两个值。例如，一个数是否比另一个数大？如果是，计算机可能会跳过一块本来会运行的代码。\n\
    \n```python\n>>> answer_one = True\n>>> answer_two = False\n```\n\n变量  \n布尔值\n\
    \n#### 布尔值\n\n计算机提出的问题只有两种可能的答案：True 或 False。Python 将这两种值称为布尔值，并且它们必须以大写字母开头。你可以将布尔值存储在变量中。\n\
    \n| 符号 | 含义 |\n|---|---|\n| `==` | 等于 |\n| `!=` | 不等于 |\n| `<` | 小于 |\n| `>` |\
    \ 大于 |\n\n#### 逻辑运算符\n\n这里展示的符号和单词被称为“逻辑运算符”，它们帮助计算机进行比较，从而提出问题。\n\n### 专家提示\n\
    \n#### 等号\n\n在 Python 中有两种等号：单个等号 `=` 和双等号 `==`。这两个符号的含义不同。当你想将一个值存储到变量中时，使用单个等号。例如，`lives\
    \ = 10` 将值 10 存储到变量 lives 中。而当你想比较两个值时，使用双等号。\n\n这会设置变量的值。\n\n这会把你年龄与变量进行比较。\n\
    \n```python\n>>> age = 10\n>>> if age == 10:\n    print(\"You are ten years old.\"\
    )\n```\n\n如果两者匹配，代码就会打印这条消息。\n\n## 怪物与金币\n\n让我们在 shell 窗口中尝试一个示例。你可以使用变量 **monsters**\
    \ 和 **coins** 分别表示三个怪物和四枚金币。输入以下代码。\n\n```python\n>>> monsters = 3\n>>> coins\
    \ = 4\n```\n\n这个值存储在变量 **monsters** 中。\n\n这个变量存储金币的数量。\n\n### 让我们来比较\n\n现在输入以下几行代码来比较这两个变量中的值。每输入一行，按\
    \ **Enter** 键，Python 就会告诉你这些语句是 True 还是 False。\n\n```python\n>>> coins > monsters\n\
    True\n```\n\n这个表达式为 True，因为金币的数量大于怪物的数量。\n\n```python\n>>> monsters == coins\n\
    False\n```\n\n这个表达式为 False，因为怪物的数量和金币的数量不相等。\n\n```python\n>>> monsters < coins\n\
    True\n```\n\n这个表达式为 True，因为怪物的数量小于金币的数量。\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_34_0.png)\n\
    \n### 术语\n\n#### 布尔表达式\n\n包含变量和值并使用逻辑运算符的语句，其结果始终是布尔值——True 或 False。因此，这些语句被称为布尔表达式。示例中所有关于怪物和金币的语句都是布尔表达式。\n\
    \n```python\n>>> coins > monsters\nTrue\n```\n\ncoins 是一个变量。\n\nmonsters 是一个变量。\n\
    \n> 是一个逻辑运算符。\n\nTrue 是一个布尔值。\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_34_1.png)\n\
    \n### 多重比较\n\n在 Python 中，你还可以使用逻辑运算符 **and** 和 **or** 来组合多个比较。\n\n```python\n\
    >>> (monsters == 3) and (coins == 4)\nTrue\n```\n\n使用 **and** 时，所有比较都必须成立，布尔值才是\
    \ True。\n\n使用 **or** 时，只要其中一个比较成立，布尔值就是 True。\n\n```python\n>>> (monsters == 7)\
    \ or (coins == 4)\nTrue\n```\n\n## 升级\n\n假设你在创建一个有两个关卡的的游戏。要进入第 2 关，你需要至少拥有四只魔法蜗牛，并且分数超过\
    \ 100 分。此时，你有 110 分，但只有三只魔法蜗牛。使用 shell 窗口看看你是否仍能进入第 2 关。首先，为分数和收集到的蜗牛数量创建变量，并为它们赋予正确的值。然后，将进入第\
    \ 2 关的规则输入为一个布尔表达式。\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_35_0.png)\n\n\
    ```python\n>>> score = 110\n>>> snails = 3\n>>> (score > 100) and (snails >= 4)\n\
    False\n```\n\n将值存储在变量中。\n\n这是一个布尔表达式，意为“分数大于 100 且蜗牛数量大于或等于 4”。\n\n这显示你目前还无法进入第\
    \ 2 关。\n\n## 分支\n\n有时在玩游戏时需要做出决策。你应该向右转去探查图书馆，还是向左转去看看厨房？计算机程序通常包含只在特定情况下运行的代码。这意味着计算机要对运行哪些代码块做出决策。\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_35_1.png)\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_35_2.png)\n\
    \n- 盯紧球：假设你在玩一场足球游戏，需要决定朝哪个方向射门。你可以问自己：“守门员是不是在球门的左侧？”如果是，你就朝球门右侧射门；如果不是，你就朝左侧射门。在\
    \ Python 中，程序中的不同路径会通向不同的代码块。计算机使用布尔表达式（即条件）来决定运行哪些代码块。\n\n"
