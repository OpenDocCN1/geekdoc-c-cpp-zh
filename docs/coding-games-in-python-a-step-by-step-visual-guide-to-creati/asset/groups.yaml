  mdcn: "\n## 舞蹈挑战\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_138_0.png)\n\n### 如何构建舞蹈挑战\n\
    \n在这个快节奏的游戏中尽情摇摆吧。观看舞者随着音乐起舞，然后通过重复这些动作来考验你的记忆力。你能连续多久不出错？\n\n### 会发生什么\n\n在这个游戏中，舞者会表演一系列动作。你需要记住这个序列，并使用键盘上的四个方向键让他重复这些动作。\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_139_0.png)\n\n每做出一个正确的动作，你就能获得一分。\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_139_1.png)\n\n**舞者**\n\n这位舞者喜欢炫耀自己的舞步！仔细观察他，才能继续玩下去。\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_139_2.png)\n\n**彩色方块**\n\n每当舞者从一个动作切换到另一个动作时，其中一个方块会以黄色轮廓高亮显示。\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_140_0.png)\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_140_1.png)\n\
    \n你可以为游戏背景使用不同的图片。\n\n舞者通过在不同姿势之间切换来表现出跳舞的样子。\n\n按正确的顺序按下方向键即可得分。\n\n这个舞台图像为你的游戏设定了场景。\n\
    \n**准备摇滚！** 这个程序使用不同的函数来让舞者移动并高亮显示彩色方块。你可以选择倒计时，给玩家时间准备记住这套动作。\n\n### 工作原理\n\n\
    你首先设置一些函数来生成一系列舞蹈动作、创建倒计时，然后在屏幕上显示这些动作。游戏会持续检查你是否按下了方向键，以及按的是否正确。如果你犯了错误，游戏就会结束。\n\
    \n### 专家提示\n\n### 添加音乐\n\n在这个游戏中，你需要添加一些音乐，让舞者随之起舞。Pygame Zero 有一些特殊命令，可以很容易做到这一点。每次向游戏中添加音乐时，都要在游戏的主文件夹中创建一个名为`music`的文件夹，这样\
    \ Pygame Zero 就能知道在哪里找到音频文件。\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_141_0.png)\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_141_1.png)\n\n开始 → 开始音乐 → 生成动作 → 显示倒计时\
    \ → 显示动作 → 显示“跳舞！” → 检查玩家按下的键 → 是否与动作匹配？ → 如果是，查看下一个要检查的动作；如果否，结束。持续检查，直到序列中的所有动作都被检查完毕。\n\
    \n### 舞蹈挑战流程图\n\n这个简单的流程图展示了游戏是如何组合在一起的，以及你的操作如何影响接下来发生的事情。如果你设法按正确顺序复制了序列中的所有动作，游戏将循环生成一个新序列。这种情况会持续发生，直到你犯了错误。\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_141_2.png)\n\n### 5. 设置音乐文件夹\n\n这个游戏使用一个音频文件，让舞者有音乐可跳。该文件需要自己的文件夹，因此在你的\
    \ dance-challenge 文件夹中新建一个名为 music 的文件夹。\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_143_0.png)\n\
