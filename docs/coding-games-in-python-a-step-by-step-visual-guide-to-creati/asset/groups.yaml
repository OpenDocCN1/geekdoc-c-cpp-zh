    # # Working with strings


    A string is any data made up of a sequence of letters or other characters. Words
    and sentences are stored as strings. In Python, most programs use at least one
    string. Any character that you can type on your keyboard can be stored in a string.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_31_0.png)


    # ## Strings in variables


    Strings can be assigned to variables. Type this code into the shell window. It
    assigns the string **Martin** to the name variable and then displays it. Strings
    must be written between quotation marks to show where they start and end.


    ```

    ```python

    >>> name = "Martin"

    >>> print(name)

    Martin

    ```

    ```


    Quotation marks tell the computer that it’s a string.


    Press Enter to print the string.


    # ## Joining strings together


    Variables can be combined to create new ones. For example, you can add two strings
    and store the combination in a new variable. Type this code into the shell window
    to try this out. You can change the greeting and the name to make a new message.


    ```

    ```python

    >>> greeting = "Hello "

    >>> name = "Martin"

    >>> message = greeting + name

    >>> print(message)

    Hello Martin

    ```

    ```


    Remember the quotation marks, and leave a space after Hello.


    Remember the space after the greeting.


    The **+** symbol can be used to join strings together.


    **message** is a new variable that contains the greeting and **name** variables.


    # ## EXPERT TIPS


    # ### Length of a string


    For some programs, it’s useful to be able to count the number of characters in
    a string. You can do this using the function **len()**. A function is a useful
    operation that contains multiple lines of code, so you don’t have to enter them
    manually. To find out the number of characters in the string **Hello Martin**,
    type this line of code into the shell after you’ve created the string, then hit
    **Enter**.


    ```

    ```python

    >>> len(message)

    12

    ```

    ```


    The number of characters, including spaces, is counted.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_31_1.png)'
  - '[PAGE 32]


    # ## Making lists


    A list is used to store a collection of data. It can hold many different values
    and keep them in order. For example, a list can store a deck of cards for a game,
    such as Snap, so the code knows which card to deal next. The position of each
    value in the list is identified with a number, starting from 0. You can use these
    numbers to change list values.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_32_0.png)


    # ### 1. More than one variable


    Imagine you’re coding a multiplayer game and want to have a different variable
    for each card. You would need 52 variables to store a whole deck of cards, but
    we’ll just work with six for now.


    ```

    ```python

    >>> card1 = "1 hearts"

    >>> card2 = "2 hearts"

    >>> card3 = "3 hearts"

    >>> card4 = "4 hearts"

    >>> card5 = "5 hearts"

    >>> card6 = "6 hearts"

    ```

    ```


    There’s no need to type this code out.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_32_1.png)


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_32_2.png)


    # ### 2. List in a variable


    It would be much easier to use a list to store all the values of the cards instead
    of using up so many variables individually. To create a list, surround the values
    you want to store with square brackets.


    ```

    ```python

    >>> cards = ["1 hearts", "2 hearts", "3 hearts", "4 hearts", "5 hearts", "6 hearts"]

    ```

    ```


    The list is assigned to the variable **cards**.


    The values must be separated by commas.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_32_3.png)


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_32_4.png)


    # ### 3. Getting items from a list


    It’s easy to work with a list once you have all your values in it. To get an item
    from a list, type the name of the list, followed by the item’s position in the
    list within square parentheses. But watch out—in Python, the first position in
    a list is 0, not 1. Now try getting different cards out of your cards list.


    ```

    ```python

    >>> cards[0]

    >>> "1 hearts"


    >>> cards[5]

    >>> "6 hearts"

    ```

    ```


    This line gets the first value in the list.


    This is the last value in our list.


    For our small list, the last position is 5, but for the entire cards list it would
    be 51.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_32_5.png)'
