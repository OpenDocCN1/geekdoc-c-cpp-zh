    # ▽ Level up


    Make the game more fun by adding levels and increasing the speed with each level.
    To do this, you could set the number of obstacles in each level to ten. To complete
    the level, the player must clear all the obstacles and score ten points. Every
    time the score reaches a multiple of ten, make the obstacles move faster. In the
    original game, the birds move by four pixels at a time, and the houses and trees
    move by two. If you want to increase it with every level, you need to store the
    speed in a variable. Just remember that the bird should always be traveling twice
    as fast as the trees and houses.


    ```

    speed = 2

    bird.x += speed * 2

    ```


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_136_0.png)


    # ▽ Space out the obstacles


    Sometimes all the obstacles—the tree, the house, and the bird—might appear at
    the same position on the x-axis. This works fine, but you may want to avoid it.
    Try to change the update() function so that the obstacles pick a new random x
    coordinate if there is a clash. This code will help you get started:


    ```

    if bird.x == house.x

    ```


    # EXPERT TIPS


    # Modulo operator


    When Python performs division, it ignores the remainder. But sometimes it’s useful
    to know if there is a remainder and what it is. For example, if you want to test
    if the number is even, you can do so by dividing it by 2 and checking if there
    is a remainder. To do this, you can use the modulo operator %.


    ```

    >>> print(2 % 2)

    0

    ```


    > This is 0 because there is no remainder when 2 is divided by 2.


    ```

    >>> print(3 % 2)

    1

    ```


    > This is the remainder when 3 is divided by 2.


    In Balloon Flight, you can use the modulo operator to know if the score is a multiple
    of 10, and therefore whether the player should move to the next level.


    ```

    score % 10

    ```


    > This would return the remainder when the score is divided by 10.


