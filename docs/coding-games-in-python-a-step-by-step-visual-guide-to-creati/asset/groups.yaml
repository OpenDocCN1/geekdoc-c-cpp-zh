    \n### 工作原理\n\n这个游戏使用 Python 的 `randint()` 函数为每个圆点随机选择 x 和 y 坐标，然后将它们全部放到屏幕上。它使用\
    \ `on_mouse_down()` 函数来知道玩家何时点击了圆点。如果玩家点击了正确的圆点，并且它不是第一个圆点，就会在当前圆点和上一个圆点之间画一条线。如果玩家点击了错误的圆点，或者点击了屏幕上的其他任何位置，所有线条都会被删除，玩家必须重新开始。一旦玩家连接了所有圆点，游戏就会结束。\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_73_0.png)\n\n> 这很简单……只要跟着数字走！\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_73_1.png)\n\
    \n> 真的吗？我还是不明白！\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_73_2.png)\n\n### “按数字连线”流程图\n\
    \n这个游戏会检查玩家是否点击了某个圆点，以及该圆点是否与 `next_dot` 变量中的值匹配。程序会继续运行，直到没有更多圆点需要连接。\n\n###\
    \ 开始吧\n\n现在该开始构建游戏了。首先导入这个游戏所需的 Python 模块。然后编写创建圆点和线条的函数。\n\n- **1. 设置环境**  \n\
    \  打开 IDLE，转到“文件”菜单并选择 **新建文件**，创建一个空文件。\n\n  ![](img/3188b147f991a51de14dcd2bb4b4c42e_74_0.png)\n\
    \n  ![](img/3188b147f991a51de14dcd2bb4b4c42e_74_1.png)\n\n- **2. 保存游戏**  \n  转到你之前创建的\
    \ python-games 文件夹，在其中再创建一个名为 *follow-the-numbers* 的文件夹。转到“文件”菜单，点击 **另存为...**，然后将程序保存为\
    \ *numbers.py*。\n\n  ![](img/3188b147f991a51de14dcd2bb4b4c42e_74_2.png)\n\n- **3.\
    \ 设置图像文件夹**  \n  这个游戏对所有圆点使用同一张图像。在你的 follow-the-numbers 文件夹中创建一个名为 *images* 的新文件夹。\n\
    \n  ![](img/3188b147f991a51de14dcd2bb4b4c42e_74_3.png)\n\n- **4. 将图像放入文件夹**  \n\
    \  在 Python 游戏资源包（dk.computercoding）中找到名为“dot.png”的文件，并将其复制到 images 文件夹中。现在你的文件夹应该看起来像这样。\n\
    \n  ![](img/3188b147f991a51de14dcd2bb4b4c42e_74_4.png)\n\n- **5. 导入模块**  \n  现在你可以开始编码了。回到你的\
    \ IDLE 文件，在顶部输入这一行。\n\n  ```python\n  from random import randint\n  ```\n\n  >\
    \ 这会从 Python 的 Random 模块中导入 randint() 函数。\n\n- **9. 绘制角色**  \n  现在使用 draw() 函数在屏幕上显示圆点及其数字标签。screen.draw.text()\
    \ 函数期望输入一个字符串，但由于 number 中存储的值是整数，你需要使用 str() 函数将其转换为字符串。在步骤 8 的命令下方添加这段代码。\n\n\
    \  这会将背景颜色设置为黑色。\n\n  ```python\n  dots.append(actor)\n\n  def draw():\n     \
    \ screen.fill(\"black\")\n      number = 1\n      for dot in dots:\n         \
    \ screen.draw.text(str(number), \\\n              (dot.pos[0], dot.pos[1] + 12))\n\
    \          dot.draw()\n          number = number + 1\n  ```\n\n  这会创建一个变量来跟踪当前数字标签。\n\
    \n  这些行会在屏幕上绘制每个圆点及其数字标签。\n\n- **10. 绘制线条**  \n  接下来，将这段代码添加到 draw() 函数的末尾以绘制线条。在玩家点击前两个圆点之前，lines\
    \ 列表会一直为空，因此该函数不会在屏幕上绘制任何线条。\n\n  ```python\n  number = number + 1\n  for line\
    \ in lines:\n      screen.draw.line(line[0], line[1], (100, 0, 0))\n  ```\n\n\
    \  ![](img/3188b147f991a51de14dcd2bb4b4c42e_76_0.png)\n\n**专家提示**  \n线条函数\n\n\
    这个函数会在屏幕上的两点之间画一条线——从点 x 开始，到点 y 结束。你可以将线条的颜色更改为红色（R）、绿色（G）、蓝色（B），甚至这三种颜色的混合色（RGB）；方法是通过给出\
    \ 0（没有该颜色）到 255（该颜色的最大值）之间的值来设置颜色。例如，(0, 0, 100) 会将线条颜色设置为蓝色。你可以通过输入某些颜色的名称来使用它们，但\
    \ RGB 值可以让你使用许多不同的色调。\n\n```python\nscreen.draw.line(x, y, (0, 0, 100))\n```\n\
    \n这些数字可以根据你为线条选择的颜色而变化。\n\n> 宝蓝色怎么样？或者海军蓝？最好查看第 114–115 页了解它们的 RGB 值。\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_76_1.png)\n\
    \n- **11. 测试代码**  \n  我们来测试一下你到目前为止编写的代码。记住，你需要使用命令提示符或终端窗口中的命令行来运行程序。如果需要提醒自己如何操作，请查看第\
    \ 24–25 页。\n\n  ```\n  pgzrun\n  ```\n\n  将 `numbers.py` 文件拖到这里即可运行。\n\n- **12.\
    \ 你看到了什么？**  \n  如果程序成功运行，你应该会看到类似下面的屏幕。不过，你的圆点位置可能会略有不同。如果你的屏幕看起来完全不同，或者收到错误消息，请仔细检查代码，看看是否犯了任何错误。\n\
    \n  ![](img/3188b147f991a51de14dcd2bb4b4c42e_77_0.png)\n\n  ![](img/3188b147f991a51de14dcd2bb4b4c42e_77_1.png)\n\
    \n  > “啊！一个 bug！我最好翻到第 44–47 页寻求帮助。”\n\n  > “哦，我终于能看到它们了！总共有十个圆点。”\n\n  ![](img/3188b147f991a51de14dcd2bb4b4c42e_77_2.png)\n\
    \n  每次运行代码时，圆点的位置都会变化。\n\n- **13. 添加新函数**  \n  刚才运行程序时，你可能注意到点击圆点没有任何反应。要解决这个问题，请在步骤\
    \ 10 的代码下方添加 `on_mouse_down(pos)` 函数。\n\n  ```python\n  def on_mouse_down(pos):\n\
    \      global next_dot\n      global lines\n  ```\n\n  你必须添加这段代码，才能让该函数更改全局变量\
    \ `next_dot` 和 `lines` 的值。\n\n- **14. 连接圆点**  \n  现在你需要让圆点响应鼠标点击。在步骤 13 的 `def\
    \ on_mouse_down(pos)` 下方添加这些行。\n\n  ```python\n  global lines\n  if dots[next_dot].collidepoint(pos):\n\
    \      if next_dot:\n          lines.append((dots[next_dot - 1].pos, dots[next_dot].pos))\n\
    \          next_dot = next_dot + 1\n      else:\n          lines = []\n      \
    \    next_dot = 0\n  ```\n\n  这一行检查玩家是否点击了序列中的下一个圆点。\n\n  这一行检查玩家是否已经点击了第一个圆点。\n\
    \n  这会将 `next_dot` 设置为下一个数字。\n\n  这会在当前圆点和上一个圆点之间画一条线。\n\n  如果玩家点击了错误的圆点，这会将 `next_dot`\
    \ 重置为第一个，并删除所有线条。\n\n- **15. 该连接了**  \n  完成了！既然你已经写完代码，保存它并从命令行运行，就可以开始玩了。别忘了，你需要尽可能快地连接所有圆点！\n\
    \n  ![](img/3188b147f991a51de14dcd2bb4b4c42e_78_0.png)\n\n**专家提示**  \n### 碰撞检测\n\
    \n你可以使用 `collidepoint()` 函数来检查鼠标点击的位置是否与某个角色的位置匹配。\n\n这会用圆点图像创建一个角色。\n\n这会将鼠标点击的位置传递给\
    \ `on_mouse_down()` 函数。\n\n```python\ndot = Actor(\"dot\")\n\ndef on_mouse_down(pos):\n\
    \    if dot.collidepoint(pos):\n        print(\"Ouch\")\n```\n\n如果鼠标点击位置和圆点位置匹配，shell\
    \ 中会打印出“Ouch”。\n\n### 技巧与调整\n\n试试下面的想法，让“按数字连线”更具挑战性，也更有趣。\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_79_0.png)\n\
    \n### 更多圆点\n\n你可以向游戏中添加更多圆点，让它更具挑战性。还记得步骤 8 中创建十个圆点的循环吗？你能修改范围来创建更多圆点吗？\n\n设置一个变量来跟踪每一关有多少个圆点。\n\
    \n定义一个函数，向圆点列表中添加两个圆点。\n\n```python\nnumber_of_dots = 10\n\ndef next_level():\n\
    \nif next_dot == number_of_dots - 1:\n```\n\n提高关卡时，你的程序需要做什么？\n\n### 升级\n\n你可以添加关卡，让游戏在你每次完成一组连接后变得更难。每一关都可以比上一关多两个圆点。试着定义一个\
    \ next_level() 函数来实现这一点。这段代码可以帮助你入门。\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_79_1.png)\n\
    \n三振出局！\n\n### 没有更多机会\n\n目前，玩家有无限次尝试来连接圆点。试着修改代码，让玩家一旦犯错游戏就结束。你甚至可以在代码中添加一条“游戏结束！”消息。如果这样做，记得先清除屏幕上的其他所有内容。\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_79_2.png)\n\n### 多组圆点\n\n为了让游戏更具挑战性，你可以添加另一组圆点。资源包的“技巧与调整”部分中有一个红色圆点。要调整游戏，你需要考虑以下事项：\n\
    \n- 为红色圆点创建一个单独的列表。\n- 为连接红色圆点的蓝色线条创建一个单独的列表。\n- 为红色圆点创建一个 `next_dot` 变量。\n- 在开始时设置好红色圆点。\n\
    - 绘制红色圆点和蓝色线条。\n- 检查是否点击了下一个红色圆点。\n\n"
