    \ robots 列表移动。\n\n#### 工作原理\n\n我们创建一个名为 robot 的临时变量，用来保存列表中的单个项。每轮循环都会更新 robot\
    \ 中的值，使它依次保存 Bing、Bleep，最后是 Bloop。一旦到达列表末尾，循环就会停止。\n\n### 遍历两个列表\n\nPython 可以或多或少自动地从头到尾遍历一个列表。但如果你想同时遍历两个列表，就需要使用一个额外的变量来告诉\
    \ Python 依次遍历这两个列表。\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_38_1.png)\n\n\
    #### 带颜色的机器人\n\n在这个示例中，我们有两个列表。一个名为 robots，保存机器人的名字。另一个名为 colors，告诉你每个机器人的颜色。这个程序使用一个名为\
    \ index 的变量来遍历这两个列表，打印出每个机器人的名字以及它的颜色。\n\nindex 将帮助 Python 按顺序遍历这两个列表。\n\n这一行更新\
    \ index，使 Python 在每次循环时遍历列表。\n\n```python\n>>> robots = [\"Bing\", \"Bleep\",\
    \ \"Bloop\"]\n>>> colors = [\"red\", \"orange\", \"purple\"]\n>>> index = 0\n\
    >>> for each in robots:\n    print(\"My name is \" + robots[index] + \" I am \"\
    \ + colors[index])\n    index = index + 1\n```\n\nindex 变量记录每个列表当前所在的位置。\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_39_0.png)\n\
    \n#### 工作原理\n\n`robots[index]` 和 `colors[index]` 都使用 `index` 的值来决定打印各自列表中的哪一项。由于\
    \ `index` 一开始被设置为 0，两个列表都会从第一项开始——记住，Python 列表中的第一个位置总是 0，而不是 1。由于 Bing 位于 robots\
    \ 列表的位置 0，而 red 位于 colors 列表的位置 0，这意味着 Bing 是红色的。每次循环运行时，它都会给 `index` 加 1，使每个列表移到下一项，因此\
    \ Bleep 将是橙色，Bloop 将是紫色。循环会一直持续到列表末尾。\n\n### “While”循环\n\n有时，在编写程序时，你可能并不确切知道希望循环重复多少次。别担心！在这种情况下，你可以使用\
    \ while 循环。\n\n#### 循环条件\n\nwhile 循环包含一个问题，其答案可以是 `True` 或 `False`。这称为循环条件。只有当循环条件的答案为\
    \ `True` 时，while 循环才会开始。想象你在玩一个游戏，一座城堡由一条龙守卫，它会检查你是否有魔法钥匙。“你有魔法钥匙吗？”就是循环条件，而城堡就是循环体。如果你有魔法钥匙，循环条件为\
    \ `True`，你就可以进入城堡。但如果你没有钥匙，循环条件为 `False`，所以你就无法进入循环！\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_39_1.png)\n\
    \n> 老兄，我们到底什么时候才能停下来？\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_39_2.png)\n\n\
    > 没有魔法钥匙，谁也别想进来！\n\n#### 专家提示\n\n##### 缩进错误\n\n就像 `for` 循环一样，`while` 循环主体中的代码必须比启动循环的那一行再缩进四个空格。如果不这样做，Python\
    \ 会显示一条错误消息：“unexpected indent”。\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_39_3.png)\n"
