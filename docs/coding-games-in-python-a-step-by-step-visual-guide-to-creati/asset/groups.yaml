    \n## 工作原理\n\n游戏会持续检测你是否点击了鼠标按钮。每次你点击苹果，它都需要在屏幕上的其他位置重新绘制。如果你点击但没有击中苹果，游戏将结束。\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_52_0.png)\n\n### 《射击水果》流程图\n\n这张流程图展示了游戏背后的逻辑。代码的主体是一个循环，用于检查你是否点击了苹果。\n\
    \n## 开始射击！\n\n准备好编写代码了吗？在这个程序中，你将首先在屏幕上绘制一个苹果，然后学习在开始射击之前把它放到随机位置。准备好了吗？让我们开始编码吧！\n\
    \n- **1. 打开 IDLE**  \n  在 IDLE 中创建空文件：转到 **File** 菜单并选择 **New File**。\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_52_1.png)\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_52_2.png)\n\n- **2 保存你的游戏**  \n  转到\
    \ **File** 菜单并点击 **Save As...**。然后将你的程序保存到 python-games 文件夹中。如果还没有创建这个文件夹，现在就创建它。在此文件夹内，再创建一个名为\
    \ *shoot-the-fruit* 的文件夹，并将你的 IDLE 文件以 *shoot.py* 为名保存在其中。\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_53_0.png)\n\
    \n- **3 创建图片文件夹**  \n  这个游戏需要使用一张苹果图片。在 shoot-the-fruit 文件夹内，右键点击并选择 **New Folder**\
    \ 创建另一个文件夹，命名为 *images*。它需要与你的 IDLE 文件放在同一位置。\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_53_1.png)\n\
    \n- **4 将图片放入文件夹**  \n  前往 dk.com/computercoding，下载 Python Games Resource Pack，或者只下载《射击水果》图片。找到名为\
    \ *apple.png* 的文件，把它复制到 images 文件夹中。现在你的文件夹结构应该类似这样。\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_53_2.png)\n\
    \n- **5 认识 Actor**  \n  现在你可以开始编写代码了。回到 IDLE，在编辑器窗口中写下这行代码，然后按 **Enter**。\n\n\
    ```python\napple = Actor(\"apple\")\n```\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_53_3.png)\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_53_4.png)\n\n### 术语解析：Actor 与 Sprite\n\
    \n在计算机游戏开发中，精灵（sprite）是由代码控制的对象，比如金币或敌人角色。Python 中的 Actor 就像 Scratch 中的 Sprite。Actor\
    \ 可以被绘制在屏幕上、四处移动，甚至可以与游戏中的其他 Actor 交互。每个 Actor 都会获得一个“脚本”（即 Python 代码），来告诉它在游戏中如何表现。\n\
    \n- **6 在屏幕上绘制苹果**  \n  接下来，你需要在屏幕上“绘制”苹果。为此，你可以使用 Pygame Zero 的内置函数 `draw()`。这个函数用于重绘游戏屏幕。例如，如果某个角色移动了或分数发生了变化，你可以使用这个函数来刷新屏幕上的这些变化。将以下代码写在你刚才的代码下面。\n\
    \n```python\napple = Actor(\"apple\")\n\ndef draw():\n    screen.clear()\n   \
    \ apple.draw()\n```\n\n这个函数叫 `draw()`。\n\n这会清空屏幕。\n\n记住，这里需要四个空格。\n\n这行代码将苹果绘制到屏幕上。\n\
    \n- **7 测试代码**  \n  现在该测试代码了。在命令提示符或终端窗口中使用命令行来运行程序。如果你需要回想一下具体做法，请翻到第 24–25 页。\n\
    \n```text\npgzrun\n```\n\n将你的 shoot.py 文件拖放到这里即可运行。\n\n> 如果你在运行游戏时需要帮助，请查看第 24–25\
    \ 页。\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_54_0.png)\n\n- **8 第一个画面**  \n\
    \  如果你的代码运行正常，你应该会看到这个画面。如果没有，或者你收到了错误消息，请返回检查代码，找出并修复任何 bug。\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_54_1.png)\n\
    \n屏幕上应该会出现一个空白游戏窗口，窗口左上角有一个苹果。\n\n- **9 放置苹果**  \n  目前，苹果出现在游戏窗口的左上角。你可以修改代码，把苹果放在屏幕上你想要的任意位置。编写下面这个函数，它会把苹果放到坐标\
    \ (300, 200) 处。\n\n```python\napple.draw()\n\ndef place_apple():\n    apple.x\
    \ = 300\n    apple.y = 200\n```\n\n苹果将在 x 轴（水平方向）上偏移 300 像素。\n\n苹果将在 y 轴（垂直方向）上向下偏移\
    \ 200 像素。\n\n> 运行程序前必须先保存你的代码，否则运行时使用的可能还是旧版本。\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_54_2.png)\n\
    \n### 专家建议：Pygame 中的图形\n\nPython 使用坐标来标识窗口中对象可能出现的所有位置。也就是说，每个位置都可以用两个数字来标识。第一个数字是\
    \ x 坐标，表示对象向右的距离；第二个数字是 y 坐标，表示对象向下的距离。坐标写在括号中，x 坐标在前，形式如下：(x, y)。在数学中，坐标 (0,\
    \ 0) 通常位于左下角，但在计算机图形中，它几乎总是位于左上角。\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_55_0.png)\n\
    \n- **10. 运行函数**  \n  编写完放置苹果的函数后，你需要告诉 Python 运行它。添加下面这行代码来调用名为 `place_apple()`\
    \ 的函数。\n\n```python\ndef place_apple():\n    apple.x = 300\n    apple.y = 200\n\
    \nplace_apple()\n```\n\n这个函数会将苹果放在坐标 (300, 200) 处。\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_55_1.png)\n\
    \n- **11. 再次测试**  \n  保存文件，然后从命令行运行代码。记住，你可以在命令行中按 **Up** 方向键来快速选择之前的命令，然后按 **Enter**。这次，苹果将出现在\
    \ (300, 200) 这个点。\n\n苹果被放置在坐标 (300, 200) 处。\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_55_2.png)\n\
    \n- **12 处理点击**  \n  现在，我们来编写当你按下鼠标时要运行的代码。Pygame Zero 有一个内置函数 `on_mouse_down()`，每次你点击鼠标时它都会运行。在步骤\
    \ 9 和步骤 10 添加的代码下面输入这段代码，然后从命令行运行它。每次点击鼠标时，你应该都会在命令提示符或终端窗口中看到 “Good shot!” 消息。\n\
    \n```python\ndef place_apple():\n    apple.x = 300\n    apple.y = 200\n\ndef on_mouse_down(pos):\n\
    \    print(\"Good shot!\")\n    place_apple()\n\nplace_apple()\n```\n\n程序员有时会添加空行来让代码更整洁，但这不是必须的。Python\
    \ 会完全忽略空行。\n\n- **13 添加一些逻辑**  \n  目前，每次点击鼠标都会显示 “Good shot!” 消息，但我们希望只有在玩家真正击中苹果时才显示它。你可以通过修改步骤\
    \ 10 和步骤 12 中的代码来加入一条 if 语句。下面的代码会检查苹果和鼠标光标是否在同一位置。如果在同一位置，就显示这条消息。\n\npos 是点击鼠标时光标所在的位置。\n\
    \n```python\ndef on_mouse_down(pos):\n    if apple.collidepoint(pos):\n      \
    \  print(\"Good shot!\")\n        place_apple()\n```\n\n确保下面两行现在以八个空格开头。\n\n这个函数用于检查光标是否与苹果在同一位置。\n\
    \n### 专家建议：缩进\n\nPython 使用缩进来分隔不同的代码块。如果缩进不正确，Python 将无法读取你的代码，最终会出现 bug！每个缩进由四个空格组成，代码可以被缩进一次以上——例如，缩进八个空格。有时\
    \ IDLE 会自动为你添加缩进，但如果你要移动代码，比如步骤 13 中的做法，你可能需要自己手动缩进。你可以输入正确数量的空格来实现这一点。\n\n哇！好球！\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_56_0.png)\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_56_1.png)\n\
    \n"
