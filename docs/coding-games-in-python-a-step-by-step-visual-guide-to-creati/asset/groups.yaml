    \n### 错误提示\n\n在 IDLE 中，当发生意外情况时，编辑器和 shell 窗口都会显示错误消息。这条消息会突出显示错误，并告诉你该错误位于哪一行代码。\n\
    \n### 命令提示符/终端中的消息\n\nPygame Zero 中的错误消息会显示在命令提示符或终端窗口中。当发现错误时，程序会停止运行，并告诉你错误是什么以及应该在代码中哪里查找。\n\
    \n```text\nFile \"/Library/Frameworks/Python.framework/Versions/3.6/bin/python\"\
