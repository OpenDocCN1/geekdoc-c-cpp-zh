  - '[PAGE 34]


    # # Monsters and coins


    Let’s try an example in the shell window. You can use the variables **monsters**
    and **coins** to represent three monsters and four coins, respectively. Type in
    the following code.


    ```

    >>> monsters = 3

    >>> coins = 4

    ```


    This value is stored in the variable **monsters**.


    This variable stores the number of coins.


    # ▽ Let’s compare


    Now type the following lines of code to compare the values in the two variables.
    After typing each line, press **Enter** and Python will tell you if the statements
    are True or False.


    ```

    >>> coins > monsters

    True

    ```


    This expression is True because the number of coins is greater than the number
    of monsters.


    ```

    >>> monsters == coins

    False

    ```


    This expression is False because the number of monsters and the number of coins
    aren’t equal.


    ```

    >>> monsters < coins

    True

    ```


    This expression is True because the number of monsters is less than the number
    of coins.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_34_0.png)


    # LINGO

    ## Boolean expressions


    Statements that contain variables and values and use logical operators always
    give you a Boolean value—True or False. Because of this, these statements are
    called Boolean expressions. All of the statements about monsters and coins in
    the examples are Boolean expressions.


    ```

    >>> coins > monsters

    True

    ```


    coins is a variable.


    monsters is a variable.


    > is a logical operator.


    True is a Boolean value.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_34_1.png)


    # ▽ Multiple comparisons


    In Python, you can also combine more than one comparison by using the logical
    operators **and** and **or**.


    ```

    >>> (monsters == 3) and (coins == 4)

    True

    ```


    When using **and**, both the comparisons need to be correct for the Boolean value
    to be True.


    When using **or**, only one of the comparisons needs to be given the Boolean value
    to be True.


    ```

    >>> (monsters == 7) or (coins == 4)

    True

    ```'
