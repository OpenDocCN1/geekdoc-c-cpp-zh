    \n```python\nscores = []\n\ndef update_high_scores():\n    pass\n\ndef display_high_scores():\n\
    \    pass\n```\n\n使用 pass 创建函数占位符。你可以稍后定义它。\n\n## 专家提示\n\n### 屏幕上的障碍物\n\n在气球飞行中，气球停留在屏幕中央，障碍物从它旁边经过。这样看起来就像是气球在移动。为了让障碍物以随机间隔出现，游戏会为每个障碍物选择\
    \ 800 到 1600 像素之间的随机位置。因为屏幕宽度是 800 像素，所以障碍物最初会出现在屏幕外，因此你不会立即看到它们。稍后，你将添加代码让这些障碍物从右向左移动，因此障碍物放置得离屏幕越远，它出现在屏幕上的时间就越长。上限设为\
