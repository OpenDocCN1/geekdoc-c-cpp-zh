    \ names here.\n\nrobot is a temporary variable that moves along the robots list\
    \ each time the loop runs.\n\n#### How it works\n\nWe create a temporary variable\
    \ called robot that holds a single item in the list. The value in robot is updated\
    \ each time around the loop, so that it holds Bing, then Bleep, and finally Bloop.\
    \ Once it reaches the end of the list, the loop stops.\n\n### Looping over two\
    \ lists\n\nPython can loop through a list from start to finish more or less automatically.\
    \ But if you want to loop through two lists at once, you need to use an extra\
    \ variable to tell Python to move through both lists.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_38_1.png)\n\
    \n#### Robots with colors\n\nIn this example, we have two lists. One is called\
    \ robots and holds the names of the robots. The other is called colors and tells\
    \ you the color of each robot. This program uses a variable called index to move\
    \ through both lists, printing out each robot’s name and also what color it is.\n\
    \nindex will help Python move through both lists in order.\n\nThis line updates\
    \ index so Python moves through the lists with each loop.\n\n```python\n>>> robots\
    \ = [\"Bing\", \"Bleep\", \"Bloop\"]\n>>> colors = [\"red\", \"orange\", \"purple\"\
    ]\n>>> index = 0\n>>> for each in robots:\n    print(\"My name is \" + robots[index]\
    \ + \" I am \" + colors[index])\n    index = index + 1\n```\n\nThe index variable\
    \ keeps track of the position each list is at.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_39_0.png)\n\
    \n#### How it works\n\n`robots[index]` and `colors[index]` both use the value\
    \ of `index` to decide which item in their list to print. Since `index` is set\
    \ to 0 to begin with, both lists will start with the first item—remember the first\
    \ position in Python lists is always 0, not 1. Since Bing is at position 0 of\
    \ the list robots and red is at position 0 of the list colors, that means Bing\
    \ is red. Each time the loop runs, it adds 1 to `index`, moving each list onto\
    \ the next item, so Bleep will be orange and Bloop will be purple. The loop will\
    \ continue until it reaches the end of the lists.\n\n### “While” loops\n\nSometimes,\
    \ while coding a program, you might not know exactly how many times you want a\
    \ loop to repeat. Don’t worry! In this case, you can use a while loop.\n\n####\
    \ Loop condition\n\nA while loop includes a question whose answer can either be\
    \ `True` or `False`. This is called a loop condition. The while loop will only\
    \ start if the answer to the loop condition is `True`. Imagine you are playing\
    \ a game where a castle is guarded by a dragon that checks if you have the magic\
    \ key. “Do you have the magic key?” would be the loop condition and the castle\
    \ would be the loop body. If you have the magic key, the loop condition is `True`\
    \ and you can enter the castle. But if you don’t have the key, the loop condition\
    \ is `False`, so you can’t get into the loop!\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_39_1.png)\n\
    \n> Dude, when are we supposed to stop?\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_39_2.png)\n\
    \n> Nobody enters without the magic key!\n\n#### EXPERT TIPS\n\n##### Indentation\
    \ error\n\nJust like the `for` loop, the code in the body of a `while` loop must\
    \ be four spaces further in than the line starting the loop. If you don’t do this,\
    \ Python will show an error message saying “unexpected indent.”\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_39_3.png)\n"
  mdcn: "\n## 单分支\n\n最简单的分支命令类型是 if 语句。它只有一个分支，如果条件为 True，计算机就会执行该分支。\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_36_0.png)\n\
    \n“看好了！我赐予你……‘附魔师’的称号！”\n\n这个比较就是条件。\n\n```python\nspells = 11\nif (spells > 10):\n\
    \    print(\"You gained the title Enchanter!\")\n```\n\n如果条件为 True，则运行此分支。\n\n\
    ### 工作原理\n\n在这个示例中，程序会检查你已施放的法术数量。如果超过十个，程序会打印“你获得了‘附魔师’称号！”如果你施放的法术数量少于十个，则不会打印该消息。\n\
    \n## 两个分支\n\n如果你希望程序在条件为 True 时做一件事，而在条件为 False 时做另一件事，该怎么办？在这种情况下，你需要一个具有两个可能分支的命令，称为\
    \ if-else 语句。\n\n```python\ngame_over = True\nif game_over:\n    print(\"Game\
    \ Over!\")\nelse:\n    print(\"Keep playing!\")\n```\n\n如果条件为 False，则运行此代码块。\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_36_1.png)\n\n如果条件为 True，则运行此代码块。\n\n\
    ### 工作原理\n\n在这个示例中，有一个名为 game_over 的变量，它被设置为 True。if 语句会检查 game_over 是否为 True。如果是，程序会打印“Game\
    \ Over!”；如果不是，else 语句就会运行，打印“Keep playing!”试着将 game_over 设置为 True 再设置为 False 来运行这段代码，看看实际效果。\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_36_2.png)\n\n这是第一个条件。\n\n```python\n\
    ghosts = 3\nif ghosts > 1:\n    print(\"It’s so spoooky!\")\nelif ghosts > 0:\n\
    \    print(\"Get that ghost!\")\nelse:\n    print(\"Ghosts all gone!\")\n```\n\
    \n如果第二个条件为 True，则运行此代码块。\n\n如果两个条件都为 False，则运行此代码块。\n\n## 两个以上分支\n\n当可能路径超过两条时，可以在程序中使用\
    \ elif 命令（“else-if”的缩写）。在下面的示例中，你需要一次性抓住几个幽灵。\n\n### 工作原理\n\n在这个程序中，变量 ghosts\
    \ 已被设置为 3，因此第一个分支为 True，程序会打印“太吓人啦！”但如果 ghosts 的值是 1，第一个分支就会为 False，于是第二个分支会运行，打印“抓住那个幽灵！”如果上述两个分支都不为\
    \ True，程序会继续执行第三个分支，打印“幽灵全都没了！”elif 语句必须始终位于 if 之后、else 之前。\n\n## 玩转循环\n\n在编写游戏程序时，你经常需要多次运行同一小段代码，但如果每次都要手动输入，那就太无聊了。幸运的是，你可以使用循环反复运行同一代码块。循环有许多不同的类型。\n\
    \n### “For”循环\n\n当你确切知道希望循环重复多少次时，可以使用 for 循环。在这个示例中，代码会打印“你是最高得分者！”十次。你可以在 shell\
    \ 窗口中亲自试试这段代码。\n\n```python\n>>> for count in range(1, 11):\n    print(\"You are\
    \ the high scorer!\")\n```\n\n这是循环变量。\n\n被重复执行的代码称为“循环体”。\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_37_0.png)\n\
    \n#### 循环变量\n\n循环变量记录循环到目前为止已经运行了多少次。在循环开始时，它等于 range 中的第一个数字。第二次循环时，它等于 range\
    \ 中的第二个数字，依此类推。一旦它完成 range 中倒数第二个数字，循环就会停止。\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_37_1.png)\n\
    \n#### 循环体\n\n在循环中被重复执行的代码块称为循环体。循环体中的命令必须始终相对于启动 for 循环的那一行行首缩进四个空格。\n\n### 专家提示\n\
    \n#### range\n\n在 Python 中，range 一词后面跟括号中的两个数字，表示“列表中从第一个数字到倒数第二个数字的所有数字”。因此，range(1,\
    \ 5) 包含数字 1、2、3 和 4，但不包含 5，所以循环会运行四次。\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_37_2.png)\n\
    \n### 遍历列表\n\n游戏程序经常使用按列表分组在一起的物品集合。如果你想对列表中的每个项执行某些操作，可以使用 `for` 循环。\n\n> 第 31\
    \ 页会帮助你了解列表。\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_38_0.png)\n\n#### 列出机器人\n\
    \n在这个示例中，有一个列表，其中包含玩家在游戏中必须逃离的三个机器人的名字。\n\n```python\n>>> robots = [\"Bing\",\
