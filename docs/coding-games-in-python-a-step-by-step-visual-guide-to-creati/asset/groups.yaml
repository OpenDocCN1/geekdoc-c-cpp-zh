    \ \"egg_count\": 3,\n    \"egg_hidden\": False,\n    \"egg_hide_counter\": 0,\n\
    \    \"sleep_length\": 4,\n    \"sleep_counter\": 0,\n    \"wake_counter\": 0\n\
    }\n```\n\n> 这也太难了！\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_186_0.png)\n\n\
    - 这会设置此龙巢的龙蛋数量。\n- 这会跟踪龙蛋已隐藏了多少秒。\n\n### 10. 将龙巢汇集在一起\n\n稍后在代码中你需要遍历所有龙巢。为了更方便，请将它们存储在一个列表中。接下来输入这一行。\n\
