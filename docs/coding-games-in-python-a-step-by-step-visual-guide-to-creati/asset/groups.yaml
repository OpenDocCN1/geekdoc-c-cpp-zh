    ![](img/3188b147f991a51de14dcd2bb4b4c42e_18_3.png)\n\n## 安装 Pygame Zero\n\n现在该添加一些额外工具，帮助你制作出色的游戏了。在本书中，你需要两个额外的模块——Pygame\
    \ 和 Pygame Zero。这些模块未随 Python 附带，因此需要单独安装。\n\n### 在 Windows 上安装 Pygame Zero\n\n\
    按照以下步骤在你的 Windows 计算机上安装最新版本的 Pygame 和 Pygame Zero。你的机器需要连接到互联网才能完成其中一些步骤。\n\n\
    > **专家提示**\n>\n> **管理员权限**\n>\n> 确保你以管理员身份登录计算机；否则，系统不会让你正确安装程序。在别人的计算机上安装新软件前，务必先征得许可。\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_19_0.png)\n\n1. **打开命令提示符**\n\n   点击\
    \ **开始**。向下滚动并打开 **Windows 系统** 文件夹。点击 **命令提示符**。如果找不到，请尝试搜索它。你需要输入一些命令，并按 **Enter**\
    \ 运行每一条命令。确保所有内容拼写正确，并在正确的位置留空格，否则命令将无法运行。\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_19_1.png)\n\
    \n在菜单中留意这个缩略图。\n\n2. **安装包管理器**\n\n   安装 Python 时，应会附带一个名为“pip”的包管理器。这个工具可以让安装\
    \ Pygame Zero 和其他 Python 模块更容易。将此命令输入命令提示符，然后按 **Enter**——它会检查你的计算机上是否安装了 pip，如果没有，就会安装它。\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_19_2.png)\n\n3. **安装 Pygame**\n\n \
    \  包管理器安装完成后，输入以下命令并按 **Enter**。这会使用 pip 安装 Pygame。\n\n```bash\npip install pygame\n\
    ```\n\n4. **安装 Pygame Zero**\n\n   最后，输入此命令。按 **Enter** 后，这将安装 Pygame Zero，简称\
    \ pgzero。\n\n```bash\npip install pgzero\n```\n\n## 使用 IDLE\n\n在 IDLE 中，你可以在两种不同的窗口中工作。编辑器窗口可用于编写和保存程序，而\
    \ shell 窗口会立即运行 Python 指令。\n\n### shell 窗口\n\n打开 IDLE 时，shell 窗口会弹出。这是开始上手的最佳位置，因为你不必先创建新文件。你只需将代码直接输入\
    \ shell 窗口即可。\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_21_0.png)\n\n```\n>>>\
    \ from turtle import *\n>>> forward(200)\n>>> left(90)\n>>> forward(300)\n```\n\
    \n这四行代码是一个简单的绘图程序——你可以自己试一试。\n\n你在 >>> 提示符处输入代码。\n\n这一行显示你拥有的 Python 版本。\n\n这里的文本将取决于你的操作系统。\n\
    \n### 在 shell 中工作\n\n你可以使用 shell 窗口，在将代码片段加入更大的程序之前先测试它们。你输入的代码可以立即运行，并会显示任何消息或“bug”（错误）。\n\
    \n> **专家提示**\n>\n> **不同的窗口**\n>\n> 为了帮助你了解应将代码放入哪个窗口，我们为 IDLE 中的每个窗口设置了不同的颜色。\n\
    \n- shell 窗口\n- 编辑器窗口\n\n```\n>>> print('You’ve unlocked a new level!')\n\n>>>\
    \ 123 + 456 * (7 / 8)\n\n>>> ''.join(reversed('Time to play'))\n```\n\n### 试运行\
    \ shell\n\n将每个代码片段输入 shell 窗口，并在输入每个片段后按 Enter。第一行显示一条消息，第二行执行一次计算。你能看出第三行做什么吗？\n\
    \n## 编辑器窗口\n\nshell 窗口无法保存你的代码，因此当你关闭它时，你输入的代码将永远消失。在制作游戏时，你应该使用 IDLE 的编辑器窗口。这样可以保存你的代码。它还具有内置工具，可帮助你编写程序并排查任何错误。\n\
    \n> **编辑器窗口**\n>\n> 要在 IDLE 中打开编辑器窗口，请点击顶部的 **文件** 菜单，然后选择 **新建文件**。随后会出现一个空白的编辑器。你将使用编辑器窗口编写本书中游戏的程序。\n\
    \n你在这里输入代码。这个程序会打印一个列表，告诉你哪些数字是偶数，哪些是奇数。\n\n文件名显示在这里。\n\n你可以从此菜单运行 Python 程序，但运行\
    \ Pygame Zero 程序的方式会有所不同。\n\n编辑器窗口的菜单栏与 shell 窗口的菜单栏不同。\n\n你让 Python 打印的任何内容都会显示在\
    \ shell 窗口中。\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_22_0.png)\n\n```python\n\
    for count in range(10):\n    if ((count % 2) == 0):\n        print(count)\n  \
    \      print(\"is even\")\n    else:\n        print(count)\n        print(\"is\
    \ odd\")\n```\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_22_1.png)\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_22_2.png)\n\
    \n> **专家提示**\n>\n> **代码中的颜色**\n>\n> IDLE 会自动为文本着色，以突出显示代码的不同部分。这些颜色使代码更易于理解，并且在尝试发现错误时很有用。\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_22_3.png)\n\n- **符号和名称** —— 大多数代码文本为黑色。\n\
    - **输出** —— 程序运行时产生的任何文本为蓝色。\n- **内置命令** —— Python 命令（例如 print()）显示为紫色。\n- **关键字**\
    \ —— 某些词（例如 if 和 else）是特殊的 Python 关键字。它们显示为橙色。\n- **错误** —— Python 使用红色提醒你代码中的任何错误。\n\
    - **引号中的文本** —— 引号中的任何文本为绿色。这些称为字符串。\n\n## 你的第一个程序\n\n安装 Python、Pygame 和 Pygame\
    \ Zero 后，按照以下步骤编写你的第一个 Python 程序。这个简单的程序将在屏幕上显示一条消息。\n\n> **专家提示**\n>\n> **仔细输入**\n\
    >\n> 确保完全按照本书中的写法输入所有代码。网格会帮助你正确输入全部内容。仅仅一行代码中的一个小拼写错误就可能导致整个程序崩溃。\n\n### 工作原理\n\
    \n这个 Python 程序将检查所有设置是否正确，以便你可以开始制作一些游戏。它使用 Pygame Zero 在屏幕上显示“Hello”这个词。\n\n\
    1. **设置文件夹**\n\n   开始之前，在容易找到的位置（例如桌面上）创建一个名为 python-games 的文件夹。在 python-games\
    \ 文件夹中再创建一个文件夹，并将其命名为 hello。\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_23_0.png)\n\
    \n2. **启动 IDLE**\n\n   在你的计算机上打开 IDLE。从文件菜单中选择新建文件，创建一个空白的编辑器窗口，以便编写程序。\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_23_1.png)\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_23_2.png)\n\n### Hello 流程图\n\n制作游戏时，程序员会使用称为流程图的图表来规划游戏并展示其工作方式。每个步骤都显示在一个框中，并用箭头指向下一步。更复杂的游戏可能会有带问题的步骤，并根据问题的答案，用不止一个箭头指向不同的框。\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_23_3.png)\n\n"
