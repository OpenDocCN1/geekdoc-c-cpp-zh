  - '[PAGE 13]


    # # What is Python?


    Computers need step-by-step instructions to perform different tasks. A set of
    instructions, or code, can be written in different programming languages. Python
    is one of the most popular programming languages.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_13_0.png)


    # ## Why Python?


    Python is a powerful programming language that you can use to code simple programs
    quickly. It''s not too hard to learn and it''s great for building apps and games.
    Here are some of the reasons why Python is such a great tool for programmers.


    # ### Portable


    The same Python code will work on PCs, Macs, Linux machines, and Raspberry Pi
    computers. The programs act in a similar way on each platform, so games created
    with Python can be played on lots of machines all around the world.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_13_1.png)


    # ### Easy to understand


    Unlike some other programming languages, Python doesn''t use complicated symbols.
    You type the code using a mixture of English words, characters, and numbers, so
    it''s easy to read and write—just like a book.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_13_2.png)


    # ### Diverse applications


    Python is used to build systems and tools for lots of interesting tasks in different
    industries, such as banking, healthcare, the space industry, education, and many
    others.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_13_3.png)


    # ### Packed with tools


    Python comes with everything you need to start coding right away, so programmers
    say it comes with “batteries included.” It contains lots of prewritten code, called
    the Standard Library, that you can use in your programs.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_13_4.png)


    # ### Lots of help


    Python''s website is packed with support materials to help you learn how to use
    it. It has a guide to getting started, several pieces of sample code, and a reference
    section to help you understand the code.'
