    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_62_1.png)\n\n### Set up an image folder\n\
    \nThis game uses two images—a fox and a coin. Within your coin-collector folder,\
    \ create a new folder called images. Remember, this new folder needs to be in\
