    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_123_0.png)\n\n气球必须避开鸟、房子和树木。\n\n##\
    \ 专家提示\n\n### 函数\n\n函数由两部分组成——函数头和函数体。函数头是函数的第一行，包含名称及其任何参数。函数体是函数被调用时运行的代码。\n\
