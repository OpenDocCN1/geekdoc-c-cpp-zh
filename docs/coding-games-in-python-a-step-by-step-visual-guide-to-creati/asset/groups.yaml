    \n这个积木块会在对话气泡中显示消息。\n\n### 在 Scratch 中输出\n\n在 Scratch 中，“say”积木块用于在屏幕上显示消息。\n\n\
    ![](img/3188b147f991a51de14dcd2bb4b4c42e_14_1.png)\n\n### 在 Scratch 中设置条件\n\n\
    “if-then-else”积木块让你根据条件为 True 还是 False 来选择运行脚本的哪一部分。\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_14_2.png)\n\
    \n如果 `if` 之后的条件为 True，则执行此命令。\n\n如果答案为 True，则显示此消息。\n\n这是“if-then-else”积木块的结尾。\n\
    \n### 在 Python 中输出\n\n在 Python 中，“print”命令会在屏幕上显示消息。\n\n```python\nprint(\"Hello\
    \ World!\")\n```\n\n在此输入你的消息。\n\n消息会像这样显示在屏幕上。\n\n```text\nHello World!\n```\n\
    \n### 在 Python 中设置条件\n\n在 Python 中，“if-then-else”命令的工作方式完全相同，但它们不使用“then”这个词。\n\
    \n```python\nif a == 2:\n    print(\"Hello!\")\nelse:\n    print(\"Goodbye!\"\
    )\n```\n\n如果答案为 False，则显示此消息。\n\n如果 `if` 之后的条件为 False，则执行此命令。\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_14_3.png)\n\
    \n## 用 Python 做游戏\n\n电子游戏是包含许多指令的计算机程序。Python 可用于构建许多不同类型的游戏。使用 Python，每位玩家都能找到适合自己的内容！\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_15_0.png)\n\n### 游戏类型\n\n计算机游戏有很多不同的类别或类型。这些游戏从简单的一键游戏到更复杂的策略游戏不等。你想先创建哪种类型？\n\
    \n- **一键游戏**：使用 Python，你可以构建只需一个按钮即可游玩的趣味十足、动作丰富的游戏。这些游戏如此令人上瘾，你会想一遍又一遍地玩。\n\n\
    \  ![](img/3188b147f991a51de14dcd2bb4b4c42e_15_1.png)\n\n- **益智游戏**：益智游戏是锻炼大脑或测试某人常识的好方法。它们有各种形状和大小，从拼图到文字和数字游戏。\n\
    \n  ![](img/3188b147f991a51de14dcd2bb4b4c42e_15_2.png)\n\n- **平台游戏**：平台游戏，例如赛车游戏，通过让背景从玩家视角滚动而过，营造出速度的错觉。游戏玩法通常涉及绕过障碍物或跳过障碍物。\n\
    \n  ![](img/3188b147f991a51de14dcd2bb4b4c42e_15_3.png)\n\n- **多人游戏**：有些游戏你独自玩，但另一些游戏让你与其他玩家竞争。你可以使用\
    \ Python 构建多人游戏并挑战你的朋友。\n\n  ![](img/3188b147f991a51de14dcd2bb4b4c42e_15_4.png)\n\
    \n- **策略游戏**：策略游戏关键在于决策。你需要提前规划并做出正确选择才能获胜。\n\n## Python 模块\n\nPython 有称为“模块”的代码包，可帮助你完成常见的编码任务。你可以通过将模块导入程序来使用它们。以下是一些你可能会觉得有用的\
    \ Python 模块。\n\n### Pygame\n\nPygame 是为用 Python 编写游戏而设计的。使用这个模块，你可以轻松添加和控制游戏角色、更新分数和计时器、使用特殊动画和图形，以及在游戏中使用游戏手柄和操纵杆。它不是\
    \ Python 内置模块，因此需要单独安装。\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_16_0.png)\n\
    \n**专家提示**\n\n**下载模块**\n\nPython 自带若干用于开发游戏的内置模块，例如 Pyglet。但其他一些模块，如 Pygame，必须单独下载。\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_16_1.png)\n\n### Pygame Zero\n\nPygame\
    \ Zero 是适合初学游戏编程者的绝佳模块。它是 Pygame 的简化版本，通过隐藏 Pygame 一些较复杂的特性，让入门更加容易。它自带若干对初学者有用的工具，但也足够强大，可以构建更令人印象深刻的游戏。\n\
    \n### Math\n\nMath 是标准 Python 模块，可用于在游戏中执行简单计算。不过，你可能需要使用其他模块来进行更复杂的计算。\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_16_2.png)\n\
    \n### Random\n\n此模块可以选取随机数或将列表打乱为随机顺序。它非常适合为游戏添加随机性。当你想要模拟掷骰子或为玩家选择随机敌人时，可以使用它。\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_16_3.png)\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_16_4.png)\n\
    \n### Time\n\n此模块提供在程序中处理时间和日期的工具。例如，你可能需要计算游戏开始以来已经过了多少秒。\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_16_5.png)\n\
    \n### Tkinter\n\n此工具用于在游戏中构建简单图形，以创建图形用户界面（GUI，发音为“goo-eyes”），让用户与 Python 程序交互并控制它们。\n\
    \n## 安装 Python\n\n本书中的游戏使用 Python 3。它是免费的，你可以从 Python 网站下载。请按照与你的计算机相匹配的说明操作。除非获得计算机所有者的许可，否则切勿安装任何程序。\n\
    \n### 在 Windows 上安装 Python\n\n首先你需要查明你的计算机使用的是 32 位还是 64 位版本的 Windows。转到**开始**菜单，然后依次选择**计算机**、**属性**，如果出现该选项，则选择**系统**。\n\
    \n1. **下载 Python**\n\n   访问 www.python.org 并点击**下载**。点击适用于 Windows 的最新版 Python。版本号应以数字\
    \ 3 开头。在出现的不同安装程序选项中选择**可执行安装程序**。\n\n   ![](img/3188b147f991a51de14dcd2bb4b4c42e_17_0.png)\n\
    \n2. **安装 Python**\n\n   打开安装程序文件，然后点击**自定义安装**，再点击**下一步**，直到进入**高级选项**。保持复选框原样，但确保同时勾选“为所有用户安装”和“将\
    \ Python 添加到环境变量”。然后在每个提示处点击**安装**和**下一步**。\n\n   ![](img/3188b147f991a51de14dcd2bb4b4c42e_17_1.png)\n\
    \n3. **启动 IDLE**\n\n   安装过程完成后，通过搜索 IDLE 或转到**开始**菜单、选择**所有应用**，然后选择 **IDLE**\
    \ 来打开 IDLE。应出现如下图所示的窗口。\n\n   ![](img/3188b147f991a51de14dcd2bb4b4c42e_17_2.png)\n\
    \n```text\nPython 3.6.2 Shell\nIDLE   File   Edit   Shell   Debug   Options  \
    \ Window   Help\nPython 3.6.2 (v3.6.2:5fd33b5, Aug 15 2017, 00:45:10) [MSC v.1900\
    \ 32 bit (Intel)] on win32\nType \"copyright\", \"credits\" or \"license()\" for\
    \ more information.\n>>> \n```\n\n"
