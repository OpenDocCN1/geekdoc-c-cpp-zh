    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_185_0.png)\n\n### 中等龙巢\n\n接下来为中等难度的龙巢添加一个字典。这段代码与上一步的代码非常相似，但有些值不同。\n\
    \n```python\nmedium_lair = {\n    \"dragon\": Actor(\"dragon-asleep\", pos=(600,\
    \ 300)),\n    \"eggs\": Actor(\"two-eggs\", pos=(400, 300)),\n    \"egg_count\"\
    : 2,\n    \"egg_hidden\": False,\n    \"egg_hide_counter\": 0,\n    \"sleep_length\"\
    : 7,\n    \"sleep_counter\": 0,\n    \"wake_counter\": 0\n}\n```\n\n- 这些是此龙巢中龙的坐标。\n\
    - 这会检查龙蛋当前是否隐藏。\n- 这会跟踪龙的睡眠周期。\n- 这会设置龙蛋的坐标。\n\n### 9. 困难龙巢\n\n现在你需要添加第三个也是最后一个龙巢。将这段代码添加到你在第\
