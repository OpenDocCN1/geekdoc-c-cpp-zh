    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_119_2.png)\n\n◁ **障碍物** 障碍物会不断出现在随机位置。玩家需要避开所有障碍物才能继续游戏。\n\
    \n当鸟飞过屏幕时要小心。\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_120_0.png)\n\n云是背景的一部分，所以你不必避开它们。\n\
    \n按住鼠标按钮时气球上升，松开时气球下降。\n\n### ◁ 在空中\n\n程序通过让障碍物以随机间隔出现并沿 x 轴移动来制造运动的错觉。\n\n##\
    \ 工作原理\n\n首先，你要把气球和所有障碍物添加到代码中。程序会检查玩家是否按下鼠标按钮使气球上升，或未按下而让其下降。一旦某个障碍物从屏幕左边缘消失，程序就会在屏幕右边缘外最多\
    \ 800 像素处随机放置一个新的障碍物，使障碍物以随机间隔出现。如果气球撞到任何障碍物，游戏将结束并显示最高分。\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_121_0.png)\n\
