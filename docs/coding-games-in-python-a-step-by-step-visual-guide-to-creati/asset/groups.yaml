    \ you can press the **Up** arrow key in Command Prompt or Terminal to see your\
    \ recent commands. You can then press **Enter** to run one of them again. If your\
    \ game is still running, you need to close it before rerunning your code. If you\
    \ don’t, nothing will happen!\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_26_0.png)\n\
    \n# Running your program using IDLE\n\nIt’s possible to run your Pygame Zero programs\
