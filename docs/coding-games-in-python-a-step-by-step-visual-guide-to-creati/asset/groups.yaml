    ![](img/3188b147f991a51de14dcd2bb4b4c42e_45_1.png)\n\n## 语法错误\n\n编程语言中语句的结构被称为语法。语法错误意味着你输入了错误的内容。你可能漏掉了语句的一部分，或者拼写错了某个单词。语法错误是最容易修复的错误。转到出错的那一行，修改你输错的内容。\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_46_0.png)\n\n### 需要注意的错误\n\n- 你的左右括号是否匹配？\n\
    - 是否缺少引号？\n- 所有单词都拼写正确了吗？\n- 这些是导致语法错误的主要原因。\n\n```python\nprint(score\n```\n\n\
    缺少右括号。\n\n```python\nhorse = Actor(\"horse)\n```\n\n缺少右引号。\n\n```python\nhrse.draw()\n\
    ```\n\n这是一个拼写错误。它本应引用名为“horse”的变量，所以应该是horse.draw()。\n\n## 缩进错误\n\nPython 使用缩进来表示代码块的开始和结束。如果你在代码结构上犯了错误，就会显示缩进错误。如果一行代码以冒号结尾，你必须缩进下一行。Python\
    \ 会在冒号后自动缩进，但你也可以手动添加四个空格来做到这一点。\n\n```python\nif play:\nhorse.draw()\n```\n\n\
    这里没有留任何空格，会导致缩进错误。\n\n```python\nif play:\n    horse.draw()\n```\n\n通过添加四个空格来缩进代码，可以修复这个错误。\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_46_1.png)\n\n### 缩进每个新代码块\n\nPython\
    \ 程序中通常会有代码块嵌套在其他代码块中，例如循环中的 if 语句。一个代码块中的每一行都必须缩进相同的量。每次缩进可以通过按空格键四次来完成。尽管 Python\
    \ 会在冒号后自动缩进，你还是应该养成检查缩进是否正确的好习惯。\n\n## 类型错误\n\n当你把错误类型的数据放入代码时，就会出现这些错误。例如，如果代码期望一个数字，但你给它一个字符串，它就无法工作。\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_47_0.png)\n\n```python\nlives_remaining\
    \ = lives_remaining - \"one\"\n```\n\n这行代码用来记录玩家剩余的生命数。\n\nlives_remaining 存储的是整数，所以从中减去字符串“one”是没有意义的。你需要改用数字\
    \ 1。\n\n```python\nscore = 100 > \"high_score\"\n```\n\n检查一个数字是否大于一个字符串是没有意义的，因为它们是不同的数据类型。\n\
    \n去掉 high_score 周围的引号，这段代码就能正常工作了。\n\n```python\nplayers = [\"Martin\", \"Craig\"\
    , \"Claire\", \"Daniel\"]\nfind_highest_score(players)\n```\n\n这个函数期望一个整数列表，但实际传入的是一个表示玩家姓名的字符串列表。\n\
    \n### 类型错误的示例\n\n当你编写的代码没有意义时，就会发生类型错误。从数字中减去字符串、比较不同的数据类型，或者试图在字符串列表中查找最大的数字，都属于类型错误。\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_47_1.png)\n\n## 名称错误\n\n当你试图使用一个尚未创建的变量或函数时，就会发生名称错误。为了避免这种错误，你必须记住在使用所有变量和函数之前先定义它们。\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_47_2.png)\n\n### 名称错误示例\n\n如果你在创建变量之前就尝试显示变量的内容，这段代码就会产生名称错误。记住，你需要先创建变量。\n\
    \n```python\nprint(\"Welcome \" + player_name)\nplayer_name = \"Martin\"\n```\n\
    \n你需要先将“Martin”赋值给变量player_name。\n\n## 逻辑错误\n\n有时你可能不会收到任何错误消息，但代码仍然无法按你期望的方式工作。这是因为在\
    \ Python 看来，程序本身没有问题，但代码的逻辑是不正确的。这被称为逻辑错误。你可能遗漏了一行重要的代码，或者把正确的指令放错了顺序。\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_48_0.png)\n\
    \n2 × 2 = 4  \n2 × 3 = 6  \n2 × 4 = 8  \n2 × 5 = 10  \n6 × 2 = 12\n\n> “有点不太对劲！我能感觉到！”\n\
    \n```python\nprint(\"You lost a life!\")\nprint(lives)\nlives = lives - 1\n```\n\
    \n> 代码中没有错误，但最后两行的顺序颠倒了。\n\n### 修复逻辑\n\n逻辑错误可能是最难发现和修复的错误。你只能通过更多经验来改进。为了让逻辑错误更容易被发现，请经常运行代码进行测试。如果你认为有错误，请仔细逐行检查代码。例如，在检查程序中不同阶段分配给变量的值时，尝试使用`print()`语句来发现任何错误。\n\
    \n### 你能发现这个 bug 吗？\n\n这段代码运行时不会出现任何错误消息，但它包含一个逻辑错误。当玩家失去一条生命时，屏幕会先显示 lives 的值，然后生命数才减\
    \ 1。这意味着玩家会看到错误的剩余生命数！要修复它，你必须把`print(lives)`这条语句移到末尾。\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_48_1.png)\n\
    \n## 专家提示\n\n### Bug 排查清单\n\n编码有时会让人沮丧，你可能觉得自己永远找不到解决办法。但不要放弃！如果你遵循这份实用清单中的提示，你就能识别出大多数错误。\n\
    \n- **问问自己……**\n  - 你是否完全按照书中的代码输入了？特别注意缩进和空格。\n  - 所有单词都拼写正确吗？\n  - 行首是否有多余的空格？\n\
    \  - 你是否把数字和字母搞混了，比如 0 和 O？\n  - 所有字母的大小写都正确吗？\n  - 左括号是否有匹配的右括号？`()` `[]`\n \
    \ - 每个引号都有匹配的结束引号吗？\n  - 你是否请别人帮你检查过代码，并与书中的内容对比过？\n  - 你最近更改代码后保存了吗？\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_48_2.png)\n\
    \n> “我应该担心吗？”\n\n"
