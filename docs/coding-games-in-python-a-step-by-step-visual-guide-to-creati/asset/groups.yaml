    \ 文件夹，在其中新建一个名为 sleeping-dragons 的文件夹。然后转到**文件**菜单并选择**另存为...**，将 IDLE 文件以 dragons.py\
    \ 为名保存到该文件夹中。\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_183_0.png)\n\n> 我将你命名为玛格丽特。\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_183_1.png)\n\n### 3. 添加图片\n\n这个游戏使用九张图片。在\
    \ sleeping-dragons 文件夹内新建一个名为 images 的文件夹。在 Python 游戏资源包（dk.com/computercoding）中找到所有图片，并将它们复制到该文件夹中。\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_183_2.png)\n\n### 4. 导入模块\n\n现在你可以开始编写代码了。首先导入\
    \ Python 的 Math 模块。在 IDLE 文件的最顶部输入以下代码。\n\n```python\nimport math\n```\n\n这将导入整个模块。\n\
    \n> 请查看第15页，了解更多关于 Math 模块的内容。\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_183_3.png)\n\
    \n术语\n\n### 常量\n\n常量是用于保存值、决定游戏行为方式的变量。这些变量本身并没有任何特殊机制阻止它们被修改，但程序员在命名时使用大写字母，以告知其他程序员它们不应在整个程序运行期间被更改。\n\
    \n### 5. 声明常量\n\n你需要在游戏开始时声明常量。\n\n在这款游戏中，你将使用常量来确定很多东西，包括英雄的起始位置，以及玩家获胜需要收集的龙蛋数量。所有这些常量都将在后面的代码中使用。在步骤4的代码下方输入以下内容。\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_184_0.png)\n\n别忘了保存你的工作。\n\n```python\n\
    import math\n\nWIDTH = 800\nHEIGHT = 600\nCENTER_X = WIDTH / 2\nCENTER_Y = HEIGHT\
    \ / 2\nCENTER = (CENTER_X, CENTER_Y)\nFONT_COLOR = (0, 0, 0)\nEGG_TARGET = 20\n\
    HERO_START = (200, 300)\nATTACK_DISTANCE = 200\nDRAGON_WAKE_TIME = 2\nEGG_HIDE_TIME\
    \ = 2\nMOVE_DISTANCE = 5\n```\n\n- 这些常量定义了游戏窗口的大小。\n- 这设置了赢得游戏所需的龙蛋数量。\n- 这设置了游戏开始时英雄的位置。\n\
    - 这设置了龙蛋被隐藏的秒数。\n- 这设置了字体颜色为黑色。\n- 这是巨龙能够攻击英雄的距离（以像素为单位）。\n- 这是巨龙保持清醒的秒数。\n- 这是每次按键时英雄移动的像素数。\n\
    \n### 6. 声明全局变量\n\n在常量之后，你需要声明全局变量。它们和常量很相似，因为通常都在程序顶部声明。但与常量不同的是，它们的值会在整个程序中使用时发生变化，以追踪游戏的进度。接下来输入以下代码。\n\
    \n> 请查看第74页，了解更多关于全局变量的内容。\n\n```python\nMOVE_DISTANCE = 5\nlives = 3\neggs_collected\
    \ = 0\ngame_over = False\ngame_complete = False\nreset_required = False\n```\n\
    \n- 这追踪已收集的龙蛋数量。\n- 这个变量追踪玩家是否已获胜。\n- 这个变量追踪剩余的生命数量。\n- 这个变量追踪游戏是否结束。\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_184_1.png)\n\
    \n"
