  md: '# ▷ **input()**


    This function lets the player enter information for the game to use, rather than
    the coder putting it in the original code. For example, imagine you''re creating
    a game and you want to create a variable to store the player''s name, but you
    don''t know what they''re called. You can use `input()` to make the game ask the
    player what their name is. Their answer becomes a return value, which the function
    will then assign to the name variable.


    This is a variable that will later store the player''s name.


    `input()` asks the user what their name is.


    ```

    ```python

    >>> name = input("What is your name?")

    What is your name? Ben

    >>> print(name)

    Ben

    ```

    ```


    You can type your own name in here.


    `input()` has assigned the answer to the name variable.


    # ## Another way to call functions


    Some types of data, such as integers and strings, have their own built-in functions
    that are used to manipulate or change that data. These are known as “member” functions
    and can be called by placing a dot immediately after the data, followed by the
    name of the function and a pair of parentheses. Try these out in the shell window.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_42_0.png)


    ```

    ```python

    >>> "functions are fun".count("fun")

    2

    ```

    ```


    The string **fun** appears twice.


    # △ **count()**


    This function is used with strings. It is called on one string, with another string
    as a parameter of the function `count()`. The return value tells you how many
    times the second string appears in the first string.


    ```

    ```python

    >>> "blue".upper()

    ''BLUE''

    ```

    ```


    This is the new string, all in capitals.


    # △ **upper()**


    This function takes an existing string and returns a new string, replacing all
    the lowercase letters with uppercase (capital) letters.


    A list of numbers is assigned to a variable.


    The reverse function is called on the list of numbers.


    ```

    ```python

    >>> countdown = [1, 2, 3]

    >>> countdown.reverse()

    >>> print(countdown)

    [3, 2, 1]

    ```

    ```


    # △ **reverse()**


    You can also call a member function on a variable. In this example, the function
    `reverse()` is used to reverse the order of the list of numbers stored in the
    variable `countdown`.


    The function has two parameters, which are separated by a comma.


    ```

    ```python

    >>> message = "Coding makes me happy"

    >>> message.replace("happy", ":D")

    ''Coding makes me :D''

    ```

    ```


    # △ **replace()**


    For this function, you need two parameters—the first is the part of a string you
    want to replace, and the second is what you want to replace it with. The function
    returns a new string with the replacement made.'
