- pgno: 23
  md: '# # Your first program


    After you’ve installed Python, Pygame, and Pygame Zero, follow these steps to
    write your first Python program. This simple program will display a message on
    the screen.


    # ### EXPERT TIPS


    ## Type carefully


    > > Make sure you type all your code exactly as it’s written in this book. The
    grid will help you get it all correct. A tiny typo in just one line of code can
    cause a whole program to crash.


    # ## How it works


    This Python program will check if everything is set up properly so you can start
    building some games. It uses Pygame Zero to display the word “Hello” on the screen.


    +   1. **Set up a folder**

    +      Before you start, create a folder called python-games somewhere easy to
    find, such as on your Desktop. Create another folder within your python-games
    folder and call it hello.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_23_0.png)


    +   2. **Start IDLE**

    +      Open IDLE on your computer. From the File menu, choose New File to create
    an empty editor window where you can write your program.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_23_1.png)


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_23_2.png)


    # ### Hello flowchart


    When building a game, programmers use diagrams called flowcharts to plan their
    game and show how it works. Each step is shown in a box, with an arrow leading
    to the next step. More complicated games might have steps with questions and more
    than one arrow leading to different boxes, depending on the answer to the question.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_23_3.png)'
  merge: -1
  img_proc: true
- pgno: 24
  md: "# ### 3. Type the first line of code\n\nWrite this first line of code that\
    \ tells Python to show, or “draw,” something on the screen. Press **Enter** when\
    \ you’re done.\n\n```\n```python\ndef draw():\n```\n```\n\nThis line of code is\
    \ used to print something on the screen.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_24_0.png)\n\
    \n# ### 4. Type the second line of code\n\nThen type in this second line of code.\
    \ Check that it starts with four spaces. This is called an “indent,” and your\
    \ code won’t work without it.\n\n```\n```python\ndef draw():\n    screen.draw.text(\"\
    Hello\", topleft=(10, 10))\n```\n```\n\nAdd four blank spaces if IDLE hasn’t done\
    \ it automatically.\n\nMake sure you have two closing parentheses here.\n\n# ###\
    \ 5. Save the file\n\nNow let’s save the file. Go to the **File** menu and choose\
    \ **Save As...** Name the file *hello.py* and save it in the folder you created\
    \ earlier.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_24_1.png)\n\nWhen you save\
    \ a program, IDLE adds “.py” to the end automatically, so you don’t have to type\
    \ it in.\n\n# ## EXPERT TIPS\n\n# ### Indents\n\nThere should be four blank spaces\
    \ at the start of the second line of your code. This is called an “indent.” Python\
    \ uses them to separate different blocks of code. Spaces and indents are very\
    \ important—your code will not work if you miss them or put them in the wrong\
    \ place. They’re one of the most common bugs in Python programs!\n\n# ## EXPERT\
    \ TIPS\n\n# ### Saving your code\n\nAlways save your code before you run it, especially\
    \ after you make any changes. If you don’t, Python will run an out-of-date version\
    \ of your code.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_24_2.png)"
