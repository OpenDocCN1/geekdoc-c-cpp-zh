  md: "# From Scratch to Python\n\nScratch is a visual language, whereas Python is\
    \ text based. If you’ve used Scratch, you will recognize some of the features\
    \ and ideas in Python. The two languages might look different, but lots of the\
    \ elements that are used in Scratch are also used in Python.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_14_0.png)\n\
    \nThis block displays the message in a speech bubble.\n\n# △ Print in Scratch\n\
    \nIn Scratch, the “say” block is used to display a message on the screen.\n\n\
    ![](img/3188b147f991a51de14dcd2bb4b4c42e_14_1.png)\n\nThis command is executed\
    \ if the condition after `if` is True.\n\nThis message is displayed if the answer\
    \ is True.\n\nThis is the end of the “if-then-else” block.\n\n# △ Set a condition\
    \ with Scratch\n\nThe “if-then-else” block lets you choose which part of the script\
    \ to run depending on whether the condition is True or False.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_14_2.png)\n\
    \n```\n```python\nprint(\"Hello World!\")\n```\n```\n\nType your message here.\n\
    \nThe message appears on the screen like this.\n\n```\n```text\nHello World!\n\
    ```\n```\n\n# △ Print in Python\n\nIn Python, the “print” command displays a message\
    \ on the screen.\n\n```\n```python\nif a == 2:\n    print(\"Hello!\")\nelse:\n\
    \    print(\"Goodbye!\")\n```\n```\n\nThis message is displayed if the answer\
    \ is False.\n\nThis command is executed if the condition after `if` is False.\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_14_3.png)\n\n# △ Set a condition with\
    \ Python\n\nIn Python, “if-then-else” commands work exactly the same way, but\
    \ they don’t use the word “then.”"
