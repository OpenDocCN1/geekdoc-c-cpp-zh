  md: "# 23 Wilt a flower\n\nIt’s time to give your garden-tending cow a bit of a\
    \ challenge. Instead of making the cow wilt a random flower every three seconds,\
    \ the cow will have to dash to the wilted flower to water it. Replace the word\
    \ `pass` in the `wilt_flower()` function from Step 13 with the code below.\n\n\
    |  | 0 | 1 | 2 | 3 |\n|---|---|---|---|---|\n| `flower_list` | \U0001F338 | \U0001F338\
    \ | \U0001F338 | \U0001F338 |\n| `wilted_list` | happy | wilted flower | happy\
    \ | wilted flower |\n\nThese two lists store the information of a particular flower\
    \ at the same index number.\n\n```\n```python\ndef wilt_flower():\n    global\
    \ flower_list, wilted_list, game_over\n    if not game_over:\n        if flower_list:\n\
    \            rand_flower = randint(0, len(flower_list) - 1)\n            if flower_list[rand_flower].image\
    \ == \"flower\":\n                flower_list[rand_flower].image = \"flower-wilt\"\
    \n                wilted_list[rand_flower] = time.time()\n        clock.schedule(wilt_flower,\
    \ 3)\n    return\n```\n```\n\nThis line resets the time for this flower in `wilted_list`\
    \ to the current time.\n\nThis schedules another call to `wilt_flower()` in three\
    \ seconds.\n\nThis line generates a random index in the list of flowers.\n\nThis\
    \ checks if the flower at this index is wilted or not.\n\nThis sets the flower\
    \ image to a wilted flower image.\n\n# 24 Unhappy garden!\n\nNext you need to\
    \ check if any of the flowers have been wilted for more than ten seconds. If one\
    \ has, the garden’s unhappy, and it’s game over! Copy the `check_wilt_times()`\
    \ in Step 13 and replace `pass` with the code shown here.\n\n```\n```python\n\
    def check_wilt_times():\n    global wilted_list, game_over, garden_happy\n   \
    \ if wilted_list:\n        for wilted_since in wilted_list:\n            if (not\
    \ wilted_since == \"happy\"):\n                time_wilted = int(time.time() -\
    \ wilted_since)\n                if (time_wilted > 10.0):\n                  \
    \  garden_happy = False\n                    game_over = True\n              \
    \      break\n    return\n```\n```\n\nThis checks if there are any items in the\
    \ `wilted_list`.\n\nThis code loops over each item in the `wilted_list`.\n\nThese\
    \ lines check if the flower has wilted and work out how long it’s been wilted.\n\
    \nThis line checks if the flower has been wilted for more than ten seconds."
