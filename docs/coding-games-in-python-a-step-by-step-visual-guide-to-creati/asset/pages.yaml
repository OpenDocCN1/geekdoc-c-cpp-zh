  md: "# # Hacks and tweaks\n\nYou can play around with the code to make the game\
    \ even more interesting. But only if you’ve got enough energy left after all that\
    \ dancing!\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_154_0.png)\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_154_1.png)\n\
    \n△ **Create your own character**\n\nMake your own dancer by using the 8-bit editors\
    \ available online, or use the additional images provided in the Python Games\
    \ Resource Pack. You could have more than four dance moves to make more interesting\
    \ changes. Just add some code under the `on_key_up()` function in Step 17 to assign\
    \ keys to each of the extra moves.\n\n△ **Play against a friend!**\n\nYou can\
    \ play this game against a friend. Change the code so that all the odd-number\
    \ sequences add to player 1’s score, and the even-number ones add to player 2’s\
    \ score. It should show both scores at the top of the screen, and you must also\
    \ display a message that tells which player needs to play next, just before the\
    \ countdown begins. Add some code to the `on_key_up()` function so that one player\
    \ uses the keys **W, A, S,** and **D** to enter their moves, while the other uses\
    \ the **Up, Left, Down,** and **Right** keys.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_154_2.png)\n\
    \n```\n```python\nif (rounds % 3 == 0):\n    dance_length = dance_length + 1\n\
    ```\n```\n\n△ **A longer dance**\n\nYou can make the game more challenging. Each\
    \ time you complete three sequences, increase the `dance_length` by one. To find\
    \ out how many rounds have been completed, divide the number of sequences danced\
    \ by three. If the remainder is zero, then three sequences have been successfully\
    \ completed since the last check, so add 1 to `dance_length`. You can use Python’s\
    \ modulo operator to work out the remainder. Modulo is written using the `%` symbol,\
    \ so 4 % 3 will give you the remainder on dividing 4 by 3.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_154_3.png)\n\
    \n△ **Change the music**\n\nYou can change the game music by downloading audio\
    \ files from www.creativecommons.org. Remember to look for the `.ogg` format.\
    \ You don’t have to pay for the music, but you should acknowledge the creator\
    \ in your game by adding a line of code that displays the name of the track and\
    \ its creators on the “GAME OVER!” screen."
