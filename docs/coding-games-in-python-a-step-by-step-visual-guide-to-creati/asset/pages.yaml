  md: "# Constants\n\nConstants are variables whose value shouldn’t change after they\
    \ are first set. Programmers use capital letters when naming them to let other\
    \ programmers know not to change their values. This is known as a “naming convention”—a\
    \ rule that most programmers agree on, so that everyone’s code looks similar and\
    \ is easier to understand.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_88_0.png)\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_88_1.png)\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_88_2.png)\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_88_3.png)\n\n# Draw the stars\n\nNow\
