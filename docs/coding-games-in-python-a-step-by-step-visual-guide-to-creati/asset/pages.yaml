  md: "# ▷ Dragon animation flowchart\n\nThe second loop in the program is responsible\
    \ for the dragons’ sleep cycle. It runs once every second.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_182_0.png)\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_182_1.png)\n\n# Begin the quest\n\n\
    First you’ll create the variables that will track the game’s progress. Then you’ll\
    \ write some code that will draw all the elements on the screen. Finally, you’ll\
    \ set up the functions to make the hero move, handle the dragons’ sleep cycles,\
