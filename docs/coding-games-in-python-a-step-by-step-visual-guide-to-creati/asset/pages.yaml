- pgno: 15
  md: '# # Gaming in Python


    Video games are computer programs that contain a bunch of instructions. Python
    can be used to build lots of different types of games. With Python, there’s something
    for every gamer!


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_15_0.png)


    # ## Types of games


    There are lots of different categories, or genres, of computer games. These range
    from simple one-button games to more complex strategy ones. Which genre would
    you like to create first?


    ▷ **One button**


    With Python, you can build fun, action-packed games that only need one button
    to be played. These games are so addictive, you’ll want to play them over and
    over again.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_15_1.png)


    ◁ **Puzzles**


    Puzzles are a great way to exercise your brain or test someone’s general knowledge.
    They come in all shapes and sizes, from jigsaw puzzles to word and number games.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_15_2.png)


    △ **Platform**


    Platform games, such as racing games, create the illusion of speed by making the
    background scroll past the player’s viewpoint. The gameplay generally involves
    moving around obstacles or jumping over them.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_15_3.png)


    △ **Multiplayer**


    Some games you play by yourself, but others let you compete against other players.
    You can use Python to build multiplayer games and challenge your friends.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_15_4.png)


    ◁ **Strategy**


    A strategy game is all about decisions. You need to plan ahead and make the right
    choices to win.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Python modules


    Python has bundles of code called “modules” that help you complete common coding
    tasks. You can use these modules by importing them into your programs. Here are
    some Python modules that you might find useful.


    # ▽ Pygame


    Pygame is designed for writing games in Python. With this module, you can easily
    add and control game characters, update scores and timers, use special animations
    and graphics, and use gamepads and joysticks with your games. It is not a built-in
    Python module, so it needs to be installed separately.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_16_0.png)


    # EXPERT TIPS


    # Downloading modules


    Python comes with several built-in modules for developing games, such as Pyglet.
    But some other modules, like Pygame, have to be downloaded separately.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_16_1.png)


    # △ Pygame Zero


    Pygame Zero is a great module for beginner game programmers. It’s a simplified
    version of Pygame, which makes it even easier to get started by hiding some of
    Pygame’s more complicated features. It comes with several tools that are useful
    for beginners, but it’s also powerful enough to build more impressive games.


    # ▽ Math


    Math is a standard Python module that can be used to perform simple calculations
    in games. However, you might need to use other modules for trickier calculations.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_16_2.png)


    # ▷ Random


    This module can pick a random number or shuffle a list into a random order. It
    is great for adding an element of chance to a game. Use it when you want to simulate
    rolling dice or when choosing a random enemy for the player to face.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_16_3.png)


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_16_4.png)


    # ◁ Time


    This module provides tools to work with time and dates in a program. For example,
    you might need to calculate how many seconds have passed since a game started.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_16_5.png)


    # ◁ Tkinter


    This tool is used to build simple graphics in games to create Graphical User Interfaces
    (GUIs, pronounced “goo-eyes”) that let users interact with, and control, Python
    programs.'
  merge: -1
  img_proc: true
- pgno: 17
  md: "# # Installing Python\n\nThe games in this book use Python 3. It's free, and\
    \ you can download it from the Python website. Follow the instructions that match\
    \ your computer. Never install any program unless you have the computer owner's\
    \ permission.\n\n# ## Installing Python on Windows\n\nFirst you need to find out\
    \ if your computer uses the 32-bit or 64-bit version of Windows. Go to the **Start**\
    \ menu, then **Computer**, **Properties**, and choose **System** if the option\
    \ appears.\n\n+   1. **Download Python**\n+   \n+   Go to www.python.org and click\
    \ on **Downloads**. Click on the latest version of Python for Windows. It should\
    \ start with the number 3. Select **executable installer** from the different\
    \ installer options that appear.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_17_0.png)\n\
    \n+   2. **Install Python**\n+   \n+   Open the installer file, then click **Custom\
    \ Installation**, then **Next** until you get to **Advanced Options**. Leave the\
    \ checked boxes as they are, but make sure \"Install for all users\" and \"Add\
    \ Python to environment variables\" are also checked. Then click **Install** and\
    \ **Next** at each prompt.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_17_1.png)\n\
    \n+   3. **Start IDLE**\n+   \n+   Once the installation process is complete,\
    \ open IDLE by searching for it or going to the **Start** menu, choosing **All\
    \ Apps**, then selecting **IDLE**. A window like the one below should appear.\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_17_2.png)\n\n```\n```\nPython 3.6.2\
    \ Shell\nIDLE   File   Edit   Shell   Debug   Options   Window   Help\nPython\
    \ 3.6.2 (v3.6.2:5fd33b5, Aug 15 2017, 00:45:10) [MSC v.1900 32 bit (Intel)] on\
    \ win32\nType \"copyright\", \"credits\" or \"license()\" for more information.\n\
    >>> \n```\n```"
  merge: -1
  img_proc: true
- pgno: 18
  md: '# # Installing Python on a Mac


    Before you install Python 3 on a Mac, you need to check which operating system
    your Mac uses. To do this, click the **Apple** icon in the top left of the screen
    and choose **About This Mac** from the drop-down menu.


    +   1. **Download Python**

    +      Go to www.python.org and click on **Downloads**. Click on the version of
    Python 3 that matches your operating system. The “Python.pkg” file will download
    to your Mac automatically.


    The version number might not be exactly the same as this one—just make sure it
    has a 3 at the beginning.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_18_0.png)


    +   2. **Install Python**

    +      Double-click the “.pkg” file in the **Downloads** folder to start the installation.
    Select **Continue** and then **Install** to accept the default settings.


    Click the package to run the installer.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_18_1.png)


    +   3. **Start IDLE**

    +      Once the installation is complete, check that it was successful by opening
    the IDLE program. Search for it in Spotlight or select the **Applications** folder,
    then the **Python** folder, and double-click **IDLE**. A window like this should
    appear.


    ```

    ```text

    Python 3.6.2 Shell

    IDLE   File   Edit   Shell   Debug   Window   Help


    Python 3.6.2 (v3.6.2:5fd33b5, Aug 15 2017, 13:38:16)

    [GCC 4.2.1 (Apple Inc. build 5666) (dot 3)] on darwin

    Type "copyright", "credits" or "license()" for more information.

    >>>

    ```

    ```


    > > **EXPERT TIPS**

    > >

    > > ### Raspberry Pi

    > >

    > > If you’re using a Raspberry Pi computer, then you can skip the download step
    because Python 2 and Python 3 come preinstalled on the machine. Remember this
    book uses Python 3, so make sure you open the right version. You’ll find Python
    3 in the **Applications** menu on your Raspberry Pi. Open it now and check that
    it works.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_18_2.png)


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_18_3.png)'
