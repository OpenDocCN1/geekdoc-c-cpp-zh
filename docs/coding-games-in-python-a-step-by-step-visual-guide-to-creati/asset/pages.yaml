    ```\n```\n\nThe else-if branches are used to move the fox depending on which arrow\
    \ key is pressed.\n\n# 20 Collect the coins\n\nFinally, you need to add some code\
    \ that will update the score if the fox touches a coin. Add this code to the update()\
    \ function.\n\nMake sure you add this line at the very top.\n\nIf the fox touches\
    \ the coin, this variable will be True.\n\n```\n```python\ndef update():\n   \
    \ global score\n\n    if keyboard.left:\n        fox.x = fox.x - 2\n    elif keyboard.right:\n\
    \        fox.x = fox.x + 2\n    elif keyboard.up:\n        fox.y = fox.y - 2\n\
    \    elif keyboard.down:\n        fox.y = fox.y + 2\n\n    coin_collected = fox.colliderect(coin)\n\
    \n    if coin_collected:\n        score = score + 10\n        place_coin()\n\n\
    clock.schedule(time_up, 7.0)\nplace_coin()\n```\n```\n\nThis will increase the\
