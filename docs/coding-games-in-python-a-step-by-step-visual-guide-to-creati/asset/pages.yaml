    \ close it, the code you typed is gone forever. When you are working on a game,\
    \ you should use IDLE's editor window. This will let you save your code. It also\
    \ has built-in tools to help you write your programs and troubleshoot any errors.\n\
    \n> > **The editor window**\n> >\n> > To open the editor window in IDLE, click\
    \ on the **File** menu at the top and choose **New File**. An empty editor will\
    \ then appear. You'll use the editor window to write the programs for the games\
    \ in this book.\n\nYou type in the code here. This program prints a list that\
    \ tells you which numbers are even and which ones are odd.\n\nThe name of the\
    \ file is shown here.\n\nYou can run Python programs from this menu, but you will\
    \ run Pygame Zero programs a different way.\n\nThe menu bar for the editor window\
    \ is different from the one for the shell window.\n\nAnything you tell Python\
    \ to print gets displayed in the shell window.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_22_0.png)\n\
    \n```\n```python\nfor count in range(10):\n    if ((count % 2) == 0):\n      \
    \  print(count)\n        print(\"is even\")\n    else:\n        print(count)\n\
    \        print(\"is odd\")\n```\n```\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_22_1.png)\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_22_2.png)\n\n# ### EXPERT TIPS\n\n\
