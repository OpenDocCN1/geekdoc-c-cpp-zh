  md: "# ### 3. Return a value\n\nRather than printing out the score, you might want\
    \ to use it elsewhere in your code. You can ask to get a value out of a function\
    \ to use later. This is called “returning” a value. Type in the keyword `return`\
    \ before the value you want it to return in each case. Try switching your `print`\
    \ statements to `return` statements.\n\n```\n```python\ndef fruit_score(fruit):\n\
    \    if fruit == \"apple\":\n        return 10\n    elif fruit == \"orange\":\n\
    \        return 5\n```\n```\n\nDon’t use parentheses with `return` statements.\n\
    \nThe values are returned for use later in the code. They will not appear in the\
    \ shell.\n\n# EXPERT TIPS\n\n# ## Indentation Errors\n\nPython uses indentation\
    \ to understand where a block of code starts and stops. An “IndentationError”\
    \ appears when something is wrong with the way you’ve structured the code. Remember\
    \ that if a line of code ends with a colon (:), the next line needs to be indented.\
    \ If Python does not add them automatically, use the **Space bar** to manually\
    \ insert four spaces.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_44_0.png)\n\n\
    # ### 4. Using the return value\n\nYou can use the return value of a function\
    \ elsewhere in your code. In this case, we make two calls to the function—one\
    \ for each fruit. We then add these results together to get a total score. Add\
    \ this code underneath what you wrote in Step 3 and then go to the **Run** menu\
    \ and click **Run Module**.\n\n```\n```python\nreturn 5\n\napple_score = fruit_score(\"\
    apple\")\norange_score = fruit_score(\"orange\")\n\ntotal = fruit_score(\"apple\"\
    ) + fruit_score(\"orange\")\nprint(total)\n```\n```\n\nThe two return values are\
    \ added together.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_44_1.png)\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_44_2.png)"
