- pgno: 71
  md: '# How to build

    Follow the Numbers


    Can you connect all the dots in the correct order? Challenge yourself to finish
    the game as quickly as you can. Be careful, however—one wrong click and you’ll
    have to start all over again.


    # What happens


    At the beginning of the game, ten dots appear at random positions on the screen,
    each with a number next to it. You need to click on the dots in the correct order
    to connect them. The game will finish once you’ve connected all the dots together.
    But if you make a mistake, all the lines will disappear and you’ll have to start
    from the very first dot again.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_71_0.png)


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_71_1.png)


    # ◁ Dots and lines


    The dots appear at random positions on the screen. When you click on the correct
    dot, a line will be drawn between it and the previous dot you clicked on.'
  merge: -1
  img_proc: true
