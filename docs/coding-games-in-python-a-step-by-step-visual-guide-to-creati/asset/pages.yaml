- pgno: 30
  md: '# ## Using numbers


    Variables can be used to store numbers, which can then be used in calculations.
    You can use them with symbols, just like you do in math. Be careful with multiplication
    and division, though, because they use different symbols from the ones you use
    at school.


    | Symbol | Meaning |

    |---|---|

    | + | add |

    | − | subtract |

    | * | multiply |

    | / | divide |


    # ### 1. A simple calculation


    Type this code into the shell window. It uses two variables, x and y, which store
    integers to perform a simple calculation. Press Enter to see the answer.


    ```

    ```text

    >>> x = 2

    >>> y = x * 3

    >>> print(y)

    6

    ```

    ```


    Create a new variable, x, and assign the value 2 to it.


    Multiply by 3 and assign the result to another variable, y.


    Print the value assigned to y.


    The result of the calculation.


    # ### 2. Change a value


    To change the value of a variable, just assign a new value to it. In this code,
    assign the value 5 to x. Print the value assigned to y again. What do you think
    the result will be?


    ```

    ```text

    >>> x = 5

    >>> print(y)

    6

    ```

    ```


    Change the value of x.


    The result hasn''t changed—next we''ll find out why.


    # ### 3. Update the value


    The value of y needs to be updated to get the correct result. To do this, you
    need to run the y = x * 3 calculation again. Now the code assigns the new value
    to y after x has been changed.


    ```

    ```text

    >>> x = 5

    >>> y = x * 3

    >>> print(y)

    15

    ```

    ```


    You need to redo the calculation to update the value of y.


    # ### LINGO

    ## Integers and floats


    In coding, different types of numbers can be stored in variables. Whole numbers
    are called “integers,” and numbers with a decimal point in them are called “floats.”
    Integers are usually used to count things, like a player’s score, whereas floats
    are usually used for measurements, such as temperature.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_30_0.png)


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_30_1.png)'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# # Working with strings


    A string is any data made up of a sequence of letters or other characters. Words
    and sentences are stored as strings. In Python, most programs use at least one
    string. Any character that you can type on your keyboard can be stored in a string.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_31_0.png)


    # ## Strings in variables


    Strings can be assigned to variables. Type this code into the shell window. It
    assigns the string **Martin** to the name variable and then displays it. Strings
    must be written between quotation marks to show where they start and end.


    ```

    ```python

    >>> name = "Martin"

    >>> print(name)

    Martin

    ```

    ```


    Quotation marks tell the computer that it’s a string.


    Press Enter to print the string.


    # ## Joining strings together


    Variables can be combined to create new ones. For example, you can add two strings
    and store the combination in a new variable. Type this code into the shell window
    to try this out. You can change the greeting and the name to make a new message.


    ```

    ```python

    >>> greeting = "Hello "

    >>> name = "Martin"

    >>> message = greeting + name

    >>> print(message)

    Hello Martin

    ```

    ```


    Remember the quotation marks, and leave a space after Hello.


    Remember the space after the greeting.


    The **+** symbol can be used to join strings together.


    **message** is a new variable that contains the greeting and **name** variables.


    # ## EXPERT TIPS


    # ### Length of a string


    For some programs, it’s useful to be able to count the number of characters in
    a string. You can do this using the function **len()**. A function is a useful
    operation that contains multiple lines of code, so you don’t have to enter them
    manually. To find out the number of characters in the string **Hello Martin**,
    type this line of code into the shell after you’ve created the string, then hit
    **Enter**.


    ```

    ```python

    >>> len(message)

    12

    ```

    ```


    The number of characters, including spaces, is counted.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_31_1.png)'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# ## Making lists


    A list is used to store a collection of data. It can hold many different values
    and keep them in order. For example, a list can store a deck of cards for a game,
    such as Snap, so the code knows which card to deal next. The position of each
    value in the list is identified with a number, starting from 0. You can use these
    numbers to change list values.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_32_0.png)


    # ### 1. More than one variable


    Imagine you’re coding a multiplayer game and want to have a different variable
    for each card. You would need 52 variables to store a whole deck of cards, but
    we’ll just work with six for now.


    ```

    ```python

    >>> card1 = "1 hearts"

    >>> card2 = "2 hearts"

    >>> card3 = "3 hearts"

    >>> card4 = "4 hearts"

    >>> card5 = "5 hearts"

    >>> card6 = "6 hearts"

    ```

    ```


    There’s no need to type this code out.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_32_1.png)


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_32_2.png)


    # ### 2. List in a variable


    It would be much easier to use a list to store all the values of the cards instead
    of using up so many variables individually. To create a list, surround the values
    you want to store with square brackets.


    ```

    ```python

    >>> cards = ["1 hearts", "2 hearts", "3 hearts", "4 hearts", "5 hearts", "6 hearts"]

    ```

    ```


    The list is assigned to the variable **cards**.


    The values must be separated by commas.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_32_3.png)


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_32_4.png)


    # ### 3. Getting items from a list


    It’s easy to work with a list once you have all your values in it. To get an item
    from a list, type the name of the list, followed by the item’s position in the
    list within square parentheses. But watch out—in Python, the first position in
    a list is 0, not 1. Now try getting different cards out of your cards list.


    ```

    ```python

    >>> cards[0]

    >>> "1 hearts"


    >>> cards[5]

    >>> "6 hearts"

    ```

    ```


    This line gets the first value in the list.


    This is the last value in our list.


    For our small list, the last position is 5, but for the entire cards list it would
    be 51.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_32_5.png)'
  merge: -1
  img_proc: true
- pgno: 33
  md: "# # Making decisions\n\nPlaying a game involves making decisions about what\
    \ to do next. These are often based on answers to questions. For example, “Do\
    \ I have any lives left?”, “Is someone chasing me?”; “Have I beaten the highest\
    \ score?”\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_33_0.png)\n\n# ## Comparisons\n\
    \nComputers also make decisions about what to do next by asking questions. These\
    \ questions usually involve comparing two values. For instance, is one number\
    \ bigger than the other? If it is, the computer might skip a block of code that\
    \ it would otherwise have run.\n\n```\n```python\n>>> answer_one = True\n>>> answer_two\
    \ = False\n```\n```\n\nVariable\nBoolean value\n\n# ### Boolean values\n\nThe\
    \ questions that computers ask only have two possible answers: True or False.\
    \ Python calls these two values Boolean values, and they must always start with\
    \ a capital letter. You can store a Boolean value in a variable.\n\n| Symbol |\
    \ Meaning |\n|---|---|\n| `==` | equal to |\n| `!=` | not equal to |\n| `<` |\
    \ less than |\n| `>` | greater than |\n\n# ### Logical operators\n\nThe symbols\
    \ and words shown here are called “logical operators”, and they help computers\
    \ make comparisons in order to ask questions.\n\n# EXPERT TIPS\n\n## Equals signs\n\
    \n> > In Python, there are two types of equals sign: a single equals sign `=`\
    \ and a double equals sign `==`. These signs have different meanings. You use\
    \ a single equals sign when you want to store a value in a variable. For example,\
    \ `lives = 10` stores the value 10 in the variable lives. However, you use a double\
    \ equals sign when you want to compare two values.\n\nThis sets the value of the\
    \ variable.\n\nThis compares your age with the variable.\n\n```\n```python\n>>>\
    \ age == 10\n>>> if age == 10:\n    print(\"You are ten years old.\")\n```\n```\n\
    \nThe code prints the message if the two match."
  merge: -1
  img_proc: true
- pgno: 34
  md: '# # Monsters and coins


    Let’s try an example in the shell window. You can use the variables **monsters**
    and **coins** to represent three monsters and four coins, respectively. Type in
    the following code.


    ```

    >>> monsters = 3

    >>> coins = 4

    ```


    This value is stored in the variable **monsters**.


    This variable stores the number of coins.


    # ▽ Let’s compare


    Now type the following lines of code to compare the values in the two variables.
    After typing each line, press **Enter** and Python will tell you if the statements
    are True or False.


    ```

    >>> coins > monsters

    True

    ```


    This expression is True because the number of coins is greater than the number
    of monsters.


    ```

    >>> monsters == coins

    False

    ```


    This expression is False because the number of monsters and the number of coins
    aren’t equal.


    ```

    >>> monsters < coins

    True

    ```


    This expression is True because the number of monsters is less than the number
    of coins.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_34_0.png)


    # LINGO

    ## Boolean expressions


    Statements that contain variables and values and use logical operators always
    give you a Boolean value—True or False. Because of this, these statements are
    called Boolean expressions. All of the statements about monsters and coins in
    the examples are Boolean expressions.


    ```

    >>> coins > monsters

    True

    ```


    coins is a variable.


    monsters is a variable.


    > is a logical operator.


    True is a Boolean value.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_34_1.png)


    # ▽ Multiple comparisons


    In Python, you can also combine more than one comparison by using the logical
    operators **and** and **or**.


    ```

    >>> (monsters == 3) and (coins == 4)

    True

    ```


    When using **and**, both the comparisons need to be correct for the Boolean value
    to be True.


    When using **or**, only one of the comparisons needs to be given the Boolean value
    to be True.


    ```

    >>> (monsters == 7) or (coins == 4)

    True

    ```'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# # Level up


    Imagine you''re creating a game that has two levels. To get to Level 2, you need
    to have at least four magic snails and a score of more than 100 points. At this
    point, you have 110 points but only three magic snails. Use the shell window to
    see if you can still get to Level 2. First, create variables for the score and
    number of snails collected and assign the correct values to them. Then type the
    rules for getting to Level 2 as a Boolean expression.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_35_0.png)


    ```

    >>> score = 110

    >>> snails = 3

    >>> (score > 100) and (snails >= 4)

    False

    ```


    Store values in variables.


    This is a Boolean expression meaning "score greater than 100 and snails more than
    or equal to 4"


    This shows you cannot progress to Level 2 yet.


    # # Branching


    Sometimes you need to make decisions when playing a game. Should you turn right
    to investigate the library or turn left to look at the kitchen? Computer programs
    often contain code that runs only in certain situations. This means the computer
    makes decisions about which parts of the code to run.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_35_1.png)


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_35_2.png)


    +   - Eye on the ball: Imagine you''re playing a soccer game and you need to decide
    which way to aim the ball at the goal. You could ask yourself, "Is the goalkeeper
    near the left side of the goal?" If he is, you aim at the right side of the goal.
    If he isn''t, you aim left. In Python, the different routes through a program
    lead to different blocks of code. The computer uses a Boolean expression, or a
    condition, to decide which blocks to run.'
  merge: -1
  img_proc: true
- pgno: 36
  md: "# ▽ **One branch**\n\nThe simplest type of branching command is an if statement.\
    \ It only has one branch, which the computer takes if the condition is True.\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_36_0.png)\n\n“Behold! I grant thee\
    \ the title... Enchanter!”\n\nThis comparison is the condition.\n\n```\nspells\
    \ = 11\nif (spells > 10):\n    print(\"You gained the title Enchanter!\")\n```\n\
    \nThis branch runs if the condition is True.\n\n# **How it works**\n\nIn this\
    \ example, the program checks to see the number of spells you’ve cast. If it’s\
    \ more than ten, the program prints “You gained the title Enchanter!” If the number\
    \ of spells you cast is less than ten, the message is not printed.\n\n# ▽ **Two\
    \ branches**\n\nWhat if you want the program to do one thing if a condition is\
    \ True, but another if it’s False? In this case, you need a command with two possible\
    \ branches, called an if-else statement.\n\n```\ngame_over = True\nif game_over:\n\
    \    print(\"Game Over!\")\nelse:\n    print(\"Keep playing!\")\n```\n\nThis block\
    \ runs if the condition is False.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_36_1.png)\n\
    \nThis block runs if the condition is True.\n\n# **How it works**\n\nIn this example,\
    \ there’s a variable called game_over, which is set to True. The if statement\
    \ checks to see if game_over is True. If it is, the program prints “Game Over!”\
    \ If it isn’t, the else statement runs, to print “Keep playing!” Try running this\
    \ code with game_over set to True, then False, to see this in action.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_36_2.png)\n\
    \nThis is the first condition.\n\n```\nghosts = 3\nif ghosts > 1:\n    print(\"\
    It’s so spoooky!\")\nelif ghosts > 0:\n    print(\"Get that ghost!\")\nelse:\n\
    \    print(\"Ghosts all gone!\")\n```\n\nThis block runs if the second condition\
    \ is True.\n\nThis block runs if both conditions are False.\n\n# ▽ **More than\
    \ two branches**\n\nWhen there are more than two possible paths, the command elif\
    \ (short for “else-if”) can be used in your program. In the following example,\
    \ you need to capture several ghosts in one go.\n\n# **How it works**\n\nIn this\
    \ program, the variable ghosts has been set to 3, so the first branch is True\
    \ and the program prints “It’s so spoooky!” But if the value in ghosts was 1,\
    \ the first branch would be False, so the second branch would run, printing “Get\
    \ that ghost!” If neither of the above branches are True, the program moves on\
    \ to the third branch to print “Ghosts all gone!” An elif statement must always\
    \ come after an if and before else."
  merge: -1
  img_proc: true
