    \ the mouse, so the clock would only update after each mouse click. To fix this,\
    \ add this code. This function is called 60 times a second. Each call also calls\
    \ the `draw()` function, so the clock stays up to date.\n\n```\n```python\nfrom\
    \ time import time\n```\n```\n\nPut this code at the top of your program to use\
    \ the Time module.\n\n```\n```python\ndef update():\n    pass\n```\n```\n\nYou\
    \ don’t need to replace `pass` with any actual code.\n\n# **EXPERT TIPS**\n\n\
    # ## `time()`\n\nThe `time()` function might give you an unexpected result. It\
    \ calculates the time that’s passed since an “epoch,” which is the date an operating\
    \ system considers to be the “start of time.” Windows machines will tell you how\
    \ many seconds have passed since January 1, 1601! You can use this simple calculation\
    \ below to work out how long it actually took the player to complete the game.\n\
    \n```\n```python\ntotal_time = end_time - start_time\n```\n```\n\nThis calculates\
    \ the total time elapsed.\n\n# **EXPERT TIPS**\n\n# ## `round()`\n\nThe `time()`\
    \ function calculates time to lots of decimal places. You can use the `round()`\
    \ function to round it to a certain number of decimal places, which will make\
    \ it easier to read. `round()` takes two parameters—the number to round up or\
    \ down and the number of decimal places to shorten it to.\n\n```\n```python\n\
    >>> round(5.75, 1)\n5.8\n```\n```\n\nThis is the number of decimal places you\
    \ want to round it to.\n\nThis is the number you want to round up."
