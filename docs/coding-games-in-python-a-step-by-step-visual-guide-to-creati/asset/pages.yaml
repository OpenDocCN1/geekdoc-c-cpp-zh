- pgno: 132
  md: "# EXPERT TIPS\n\n# Keeping score\n\nImagine the current high scores are 12,\
    \ 10, 8, and a player scores 11. If your code just replaced each score you’ve\
    \ beaten with the new score, you’d end up with 12, 11, 11, which wouldn’t be right.\
    \ To avoid this, your code needs to compare the player’s score with the top score\
    \ first. 11 is less than 12, so it doesn’t replace it. It then needs to move on\
    \ to the second-highest score. The next one, 11 is greater than 10, so it replaces\
    \ it. Now that 11 is on the scoreboard, the code needs to check if the score that\
    \ was just replaced, is greater than the score currently in third place. Because\
    \ 10 is greater than 8, it replaces it, and 8 is removed altogether.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_132_0.png)\n\
    \n# 27  Find the highest scores\n\nNow write some code that will check if the\
    \ current score has been any of the three high scores. Add this code under the\
    \ lines from Step 26.\n\n```\nhigh_scores = line.split()\nfor high_score in high_scores:\n\
    \    if (score > int(high_score)):\n        scores.append(str(score) + \" \")\n\
    \        score = int(high_score)\n    else:\n        scores.append(str(high_score)\
    \ + \" \")\n```\n\nThis loops through the list of high scores.\n\nThis checks\
    \ if the player’s score is higher than the existing high scores.\n\nThis sets\
    \ score to the high score that was just beaten.\n\nIf the player hasn’t beaten\
    \ the high score in question, that current high score is added to the list.\n\n\
    If the player’s score is higher than an existing high score, this adds it to the\
    \ list.\n\n# 28  Write the high scores in the file\n\nUse write() to write the\
    \ new high score to the high-scores.txt file. Add this code under the code from\
    \ Step 27.\n\n```\nscores.append(str(high_score) + \" \")\nwith open(filename,\
    \ \"w\") as file:\n    for high_score in scores:\n        file.write(high_score)\n\
    ```\n\nThis block writes the new high scores to the .txt file.\n\nThis opens the\
    \ high-scores.txt file to be written to."
  merge: -1
  img_proc: true
- pgno: 133
  md: "# EXPERT TIPS\n\n# File handling\n\nIn Balloon Flight, you've used a .txt file\
    \ to store the high scores. A file like this can be opened and assigned to a variable.\
    \ The main functions that you need to handle the file are open(), read(), and\
    \ write().\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_133_0.png)\n\n▷ open()\
    \ takes two parameters, the file name and the “mode,” which tells Python what\
    \ you want to do with the file. There are four modes in Python: r for reading,\
    \ w for writing, a for adding to the end of a file, and r+ for reading and writing.\n\
    \n```\nfile = open(\"names.txt\", \"r\")\n```\n\nName of the file\nMode\n\n▽ Use\
    \ the read() function to read an entire file.\n\n```\nnames = file.read()\n```\n\
    \n▽ You can also just read a single line, rather than the whole file.\n\n```\n\
