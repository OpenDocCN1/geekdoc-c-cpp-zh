- pgno: 191
  md: "# ## 22 Schedule a call\n\nNext add some code to schedule a call to the `update_lairs()`\
    \ function once every second. Add this line under the code from Step 21.\n\n```\n\
    ```python\nupdate_egg(lair)\n```\n```\n\n```\n```python\nclock.schedule_interval(update_lairs,\
    \ 1)\n```\n```\n\nThis function schedules a call to another function at regular\
    \ intervals.\n\nThe number of seconds between each function call can be changed\
    \ by updating this number.\n\n# ## 23 Wake the sleeping dragon\n\nNow you need\
    \ to check if the dragon has slept long enough. To do this, you need to compare\
    \ the `sleep_counter` with the `sleep_length` set for that dragon. If it's time\
    \ to wake the dragon, the sleeping dragon image will be updated and the `sleep_counter`\
    \ will be reset to 0. If not, the `sleep_counter` will be increased by one. Add\
    \ this code under the line from Step 22.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_191_0.png)\n\
    \n```\n```python\ndef update_sleeping_dragon(lair):\n    if lair[\"sleep_counter\"\
    ] >= lair[\"sleep_length\"]:\n        lair[\"dragon\"].image = \"dragon-awake\"\
    \n        lair[\"sleep_counter\"] = 0\n    else:\n        lair[\"sleep_counter\"\
    ] += 1\n```\n```\n\nThis checks if the `sleep_counter` is greater than or equal\
    \ to the `sleep_length` set for the dragon.\n\nThis resets the dragon's `sleep_counter`\
    \ to 0.\n\nThis increases the `sleep_counter` by one.\n\n# ## 24 Send the dragon\
    \ to sleep\n\nIf the dragon has been awake for long enough, it needs to be sent\
    \ back to sleep. The function needed to do this is similar to the one you defined\
    \ in the previous step. However, unlike `sleep_length`, which is different for\
    \ all the dragons, the time they should be awake for is the same, so you'll use\
    \ the constant `DRAGON_WAKE_TIME`. Add this code under what you typed in Step\
    \ 23.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_191_1.png)\n\n```\n```python\n\
    def update_waking_dragon(lair):\n    if lair[\"wake_counter\"] >= DRAGON_WAKE_TIME:\n\
    \        lair[\"dragon\"].image = \"dragon-asleep\"\n        lair[\"wake_counter\"\
    ] = 0\n    else:\n        lair[\"wake_counter\"] += 1\n```\n```\n\nThis checks\
    \ if the dragon has been awake long enough.\n\nThis updates the dragon image.\n\
    \nThis resets the dragon's `wake_counter` to 0.\n\nThis adds one to the `wake_counter`."
  merge: -1
  img_proc: true
