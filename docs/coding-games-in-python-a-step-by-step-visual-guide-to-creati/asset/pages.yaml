  md: "# EXPERT TIPS\n# Graphics in Pygame\n\nPython uses coordinates to identify\
    \ all the places in a window where an object could be. This means that every place\
    \ can be identified by using two numbers. The first number is the x coordinate,\
    \ which shows how far to the right an object is. The second number is the y coordinate,\
    \ which shows how far down the object is. Coordinates are written in parentheses,\
    \ with the x coordinate first, like this: (x, y). In math, the coordinate (0,\
    \ 0) is usually at the bottom left, but in computer graphics, it’s almost always\
    \ at the top left.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_55_0.png)\n\n#\
    \ ## 10. Running the function\n\nAfter you’ve written the function to place the\
    \ apple on the screen, you need to tell Python to run it. Add this extra line\
    \ of code to run the function called `place_apple()`.\n\n```\n```python\ndef place_apple():\n\
    \    apple.x = 300\n    apple.y = 200\n\nplace_apple()\n```\n```\n\nThis function\
    \ places the apple at coordinates (300, 200).\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_55_1.png)\n\
    \n# ## 11. Test it again\n\nSave your file and then run the code from the command\
    \ line. Remember, you can press the **Up** arrow in the command line to quickly\
    \ choose a previous command, then press **Enter**. This time the apple will appear\
    \ at the point (300, 200).\n\nThe apple is placed at coordinates (300, 200).\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_55_2.png)"
