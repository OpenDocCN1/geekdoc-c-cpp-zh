- pgno: 92
  md: "# 16. Place the stars\n\nIn this step, you'll use the `layout_stars()` function\
    \ to place all the stars in the right position. First you need to work out the\
    \ number of gaps you need between the stars. This number will be one more than\
    \ the number of stars on the screen. For example, if there are two stars on the\
    \ screen, there will be three gaps. The size of each gap can be worked out by\
    \ dividing the width of the screen by the total number of gaps. You also need\
    \ to shuffle the position of the stars so that the red star doesn't appear at\
    \ the same position every time. Replace `pass` under `def layout_stars(stars_to_layout)`\
    \ with the code below.\n\nThis divides the width of the screen by the number of\
    \ gaps.\n\n```\n```python\ndef layout_stars(stars_to_layout):\n    number_of_gaps\
    \ = len(stars_to_layout) + 1\n    gap_size = WIDTH / number_of_gaps\n    random.shuffle(stars_to_layout)\n\
    \    for index, star in enumerate(stars_to_layout):\n        new_x_pos = (index\
    \ + 1) * gap_size\n        star.x = new_x_pos\n```\n```\n\nThis calculates the\
    \ number of gaps on the screen.\n\nThis shuffles the position of the stars along\
    \ the x-axis.\n\nThis block sets the position of the current star along the x-axis\
    \ by multiplying the position of the star in the list by the size of the gap.\n\
    \n# 17. Test again\n\nRun the program one more time to see what's changed in the\
    \ code.\n\nThe gap between the edge of the screen and each star is the same size\
    \ as the gap between the two stars. This gap is represented by the yellow dotted\
    \ line here.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_92_0.png)"
  merge: -1
  img_proc: true
- pgno: 93
  md: "# 18 **Animate the stars**\n\nNow that you have a few stars on the screen,\
    \ it’s time to add animation and bring this game to life. You need to write some\
    \ code to move each star down the screen. You’ll also have to define the duration\
    \ of the animation so the stars move faster as the levels progress. You’ll set\
    \ the star’s anchor to the bottom so that the animation stops as soon as the star\
    \ reaches the bottom of the screen. Replace pass under `def animate_stars(stars_to_animate)`\
    \ from Step 11 with the code below.\n\n# Lingo\n# Anchor\n\nIn computer graphics,\
    \ “anchor” refers to a point on a shape. This point is used to determine the shape’s\
    \ position on the screen. For example, if the anchor of a square is the bottom-left\
    \ corner, when you set the position of the square to (0, 0), its bottom-left corner\
    \ is placed exactly at the (0, 0) coordinates.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_93_0.png)\n\
    \nThis works out the duration of the animation by subtracting the current level\
    \ from the default start speed of the star. The higher the level, the shorter\
    \ the duration, so the faster the animation.\n\n```\n```python\ndef animate_stars(stars_to_animate):\n\
    \    for star in stars_to_animate:\n        duration = START_SPEED - current_level\n\
    \        star.anchor = (\"center\", \"bottom\")\n        animation = animate(star,\
    \ duration=duration, on_finished=handle_game_over, y=HEIGHT)\n        animations.append(animation)\n\
    ```\n```\n\nThis sets the star’s anchor at the bottom of the star image.\n\nThis\
    \ calls the `handle_game_over()` function when the animation is complete.\n\n\
    # 19 **Game over**\n\nNext you need to define the `handle_game_over()` function,\
    \ which will end the game if the player makes a mistake. Type the code shown in\
    \ black after the code from Step 18.\n\n```\n```python\nanimations.append(animation)\n\
    \ndef handle_game_over():\n    global game_over\n    game_over = True\n```\n```\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_93_1.png)"
  merge: -1
  img_proc: true
- pgno: 94
  md: "# ## EXPERT TIPS\n# Animate function\n\nanimate() is a very useful function\
    \ in Pygame Zero’s library. It makes it really easy to move an Actor on the screen.\
    \ This function takes a number of parameters:\n\n* The first parameter is always\
    \ the Actor that you want to animate.\n* `tween=` This optional parameter can\
    \ be used to change the behavior of the animation.\n* `duration=` This parameter\
    \ is the number of seconds the animation lasts for.\n\n`on_finished=` This is\
    \ an optional parameter that allows you to pass a function that you want to call\
    \ once the animation is finished. In Red Alert, you use this parameter to end\
    \ the game when the star reaches the bottom of the screen.\n\nThe final parameters\
    \ are the properties of the Actor you want to animate. There can be more than\
    \ one property. For example, if the Actor is at (0, 0) coordinates and you want\
    \ to move it to (100, 0), the `animate()` function will move the Actor to the\
    \ right by 100 pixels. This move will be smooth and will last as many seconds\
    \ as you set the `duration` parameter.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_94_0.png)\n\
    \n# ## 20 Handle mouse clicks\n\nIt's time to create a function that allows the\
    \ player to interact with the game. Use Pygame Zero's `on_mouse_down()` function\
    \ to do this. This function is called whenever the player clicks the mouse. Then\
    \ use the `collidepoint()` function to check if the player has clicked on a star.\
    \ If they have, the code will check whether that star was red or not. Type this\
    \ code under the lines from Step 19.\n\n```\ngame_over = True\n\ndef on_mouse_down(pos):\n\
    \    global stars, current_level\n    for star in stars:\n        if star.collidepoint(pos):\n\
    \            if \"red\" in star.image:\n                red_star_clicked()\n \
    \           else:\n                handle_game_over()\n```\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_94_1.png)"
  merge: -1
  img_proc: true
- pgno: 95
  md: "# ## 21 Click a red star\n\nIn this game, when the player clicks on a red star,\
    \ the program stops the animation of the current set of stars on the screen and\
    \ moves the game to the next level. If the player is on the final level, `game_complete`\
    \ is set to `True` and the game ends. Add this code after the lines from Step\
    \ 20.\n\n```\n```python\nhandle_game_over()\n\ndef red_star_click():\n    global\
    \ current_level, stars, animations, game_complete\n    stop_animations(animations)\n\
    \    if current_level == FINAL_LEVEL:\n        game_complete = True\n    else:\n\
    \        current_level = current_level + 1\n        stars = []\n        animations\
    \ = []\n```\n```\n\nThis function stops the animations when the player clicks\
    \ on a red star.\n\nThis block runs if the player is on the final level.\n\nThis\
    \ increases the current level by one.\n\nThis block resets the stars and the animations\
    \ on screen.\n\n# ## 22 Stop the animations\n\nNow you need to define the `stop_animations()`\
    \ function. This function stops the stars from moving by looping over the list\
    \ and calling `stop()` on each animation if it is currently running.\n\n```\n\
    ```python\nanimations = []\n\ndef stop_animations(animations_to_stop):\n    for\
    \ animation in animations_to_stop:\n        if animation.running:\n          \
    \  animation.stop()\n```\n```\n\n> > I don't think you can build a wall in time\
    \ to stop them!\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_95_0.png)"
  merge: -1
  img_proc: true
