  md: '# ## How it works


    You start this program by setting up functions that will generate a sequence of
    dance moves, create a countdown, and then display the moves on the screen. The
    game will keep checking if you have pressed an arrow key and if it was the correct
    one. If you make a mistake, the game will end.


    # ## Expert tips

    ### Adding music


    In this game you will need to add some music for your dancer to move to. Pygame
    Zero has some special commands that make it quite easy to do this. Each time you
    add music to a game, set up a folder called `music` within your game''s main folder,
    so that Pygame Zero knows where to find the audio files.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_141_0.png)


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_141_1.png)


    Start → Start music → Generate moves → Show countdown → Display moves → Display
    “Dance!” → Check the key pressed by the player → Did it match the move? → If yes,
    see which move to check next; if no, End. Continue checking until all moves in
    the sequence have been checked.


    # ### Dance Challenge flowchart


    This simple flowchart shows how the game fits together and how your actions affect
    what happens next. If you manage to copy all the moves in the sequence in the
    right order, the game will loop around to create a new sequence. This will continue
    to happen until you make a mistake.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_141_2.png)'
