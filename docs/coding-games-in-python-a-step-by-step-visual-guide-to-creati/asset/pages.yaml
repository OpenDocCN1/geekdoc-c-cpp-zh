- pgno: 189
  md: "# ### 17 Draw the counters\n\nNext you’ll define the `draw_counters()` function.\
    \ It takes two parameters—`eggs_collected` and `lives`. Their values will be displayed\
    \ in the bottom-left corner of the game screen. Replace the code inside your `draw_counters(eggs_collected,\
    \ lives)` with the code shown below.\n\n```\n```python\ndef draw_counters(eggs_collected,\
    \ lives):\n    screen.blit(\"egg-count\", (0, HEIGHT - 30))\n    screen.draw.text(str(eggs_collected),\n\
    \                     fontsize=40,\n                     pos=(30, HEIGHT - 30),\n\
    \                     color=FONT_COLOR)\n    screen.blit(\"life-count\", (60,\
    \ HEIGHT - 30))\n    screen.draw.text(str(lives),\n                     fontsize=40,\n\
    \                     pos=(90, HEIGHT - 30),\n                     color=FONT_COLOR)\n\
    ```\n```\n\nThis draws an icon to represent the number of eggs collected.\n\n\
    > > That’s enough eggs for one day.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_189_0.png)\n\
    \nThis draws an icon to represent the number of lives the player has left.\n\n\
    # ### 18 Move the hero\n\nWith everything set up, it’s time to add some code that\
    \ will make the hero move on the screen. You’ll use the `update()` function to\
    \ do this. If the player presses an arrow key, this code will make the hero move\
    \ in that direction by the number of pixels assigned to `MOVE_DISTANCE`. You also\
    \ need to add a call to the `check_for_collisions()` function, which you’ll define\
    \ later. Type this code after the lines from Step 17.\n\n```\n```python\ndef update():\n\
    \    if keyboard.right:\n        hero.x += MOVE_DISTANCE\n        if hero.x >\
    \ WIDTH:\n            hero.x = WIDTH\n    elif keyboard.left:\n        hero.x\
    \ -= MOVE_DISTANCE\n        if hero.x < 0:\n            hero.x = 0\n    elif keyboard.down:\n\
    \        hero.y += MOVE_DISTANCE\n        if hero.y > HEIGHT:\n            hero.y\
    \ = HEIGHT\n    elif keyboard.up:\n        hero.y -= MOVE_DISTANCE\n        if\
    \ hero.y < 0:\n            hero.y = 0\n    check_for_collisions()\n```\n```\n\n\
    > > Hey, move!  \n> > That’s my spot.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_189_1.png)"
  merge: -1
  img_proc: true
