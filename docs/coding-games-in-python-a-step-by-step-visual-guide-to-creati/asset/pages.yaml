- pgno: 48
  md: "# Logic errors\n\nSometimes you may not get any error messages, but your code\
    \ still won’t work the way you want it to. This is because, as far as Python is\
    \ concerned, there’s nothing wrong with the program, but the logic of the code\
    \ is incorrect. This is called a logic error. You might have missed an important\
    \ line of code, or maybe you’ve put in the right instructions but in the wrong\
    \ order.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_48_0.png)\n\n2 × 2 = 4  \n\
    2 × 3 = 6  \n2 × 4 = 8  \n2 × 5 = 10  \n6 × 2 = 12\n\n> “Something isn’t quite\
    \ right! I can feel it!”\n\n```\n```python\nprint(\"You lost a life!\")\nprint(lives)\n\
    lives = lives - 1\n```\n```\n\n> There are no errors in the code, but the last\
    \ two lines are in the wrong order.\n\n# ▷ Fixing logic\n\nLogic errors can be\
    \ the hardest to find and fix. You can only get better at it with more experience.\
    \ To make logic errors easier to find, run your code frequently to test it. If\
    \ you think there is an error, go through each line of code carefully. For example,\
    \ when checking the value assigned to a variable at different stages in the program,\
    \ try using a `print()` statement to spot any errors.\n\n# 〈 Can you spot the\
    \ bug?\n\nThis code will run with no error messages, but it contains a logic error.\
    \ When the player loses a life, the value of lives is shown on the screen before\
    \ the number of lives is reduced by one. That means the player will see the wrong\
    \ number of lives remaining! To fix it, you’d have to move the instruction `print(lives)`\
    \ to the end.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_48_1.png)\n\n# EXPERT\
    \ TIPS\n\n# Bug-busting checklist\n\nCoding can get frustrating sometimes, and\
    \ you might feel as if you’ll never be able to find a solution. But don’t give\
    \ up! If you follow the tips in this handy checklist, you’ll be able to identify\
    \ most errors.\n\n+   **Ask yourself...**\n+   \n+   - Have you typed the code\
    \ exactly as it is in the book? Pay extra attention to indentation and spaces.\n\
    +   - Is everything spelled correctly?\n+   - Do you have extra spaces at the\
    \ start of a line?\n+   - Have you confused any numbers for letters, such as 0\
    \ and O?\n+   - Have you used the correct case for all the letters?\n+   - Do\
    \ opening parentheses have a matching closing parenthesis? `()` `[]`\n+   - Does\
    \ every quotation mark have a matching closing quotation mark?\n+   - Have you\
    \ asked someone else to check your code for you and compare it with the book?\n\
    +   - Have you saved your code since you last made changes?\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_48_2.png)\n\
    \n> “Should I be worried?”"
