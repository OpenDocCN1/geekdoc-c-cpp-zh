- pgno: 73
  md: '# ## How it works


    This game uses Python''s `randint()` function to randomly choose x and y coordinates
    for each of the dots, and then places them all on the screen. It uses the `on_mouse_down()`
    function to know when the player has clicked on a dot. If the player clicks on
    the correct dot, and it''s not the first dot, a line is drawn between the current
    dot and the previous dot. If the player clicks on the wrong dot, or clicks anywhere
    else on the screen, all the lines are deleted and the player has to start again.
    The game ends once the player has connected all the dots.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_73_0.png)


    > > This is easy... Just follow the numbers!


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_73_1.png)


    > > Really? I still don''t get it!


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_73_2.png)


    # ### Follow the Numbers flowchart


    This game checks to see if the player has clicked on a dot and if that dot matches
    the value in the `next_dot` variable. The program will continue to run until there
    are no more dots to connect.'
  merge: -1
  img_proc: true
