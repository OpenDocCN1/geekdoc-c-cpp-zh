- pgno: 111
  md: "# ### 20 Correct answers\n\nNow you need to tell Python what you want the program\
    \ to do if the player gets an answer correct. You need to increase the current\
    \ score, and then get the next question. If there aren't any questions left, the\
    \ game should end. Replace `pass` under `def correct_answer()` from Step 3 with\
    \ this code.\n\n```\n~~~python\ndef correct_answer():\n    global question, score,\
    \ time_left\n    score = score + 1\n    if questions:\n        question = questions.pop(0)\n\
    \        time_left = 10\n    else:\n        print(\"End of questions\")\n    \
    \    game_over()\n~~~\n```\n\nThis increases the score by one.\n\nThis gets the\
    \ next question if there are any more questions left in the list.\n\nThis resets\
    \ the timer back to ten seconds.\n\nThis block runs if there are no more questions\
    \ in the list.\n\nThis displays a message in the Command Prompt or Terminal window.\n\
    \n# ### 21 Answering questions\n\nNext add some code that will run when the player\
    \ clicks on an answer box. This code will check to see which box has been clicked\
    \ on, and then print the result in the Command Prompt or Terminal window. Replace\
    \ `pass` under the `on_mouse_down(pos)` function from Step 3 with this code.\n\
    \nThis line checks which box has been clicked on.\n\n```\n~~~python\ndef on_mouse_down(pos):\n\
    \    index = 1\n    for box in answer_boxes:\n        if box.collidepoint(pos):\n\
    \            print(\"Clicked on answer \" + str(index))\n        index = index\
    \ + 1\n~~~\n```\n\nThe variable index holds a number that represents the position\
    \ of the answer box in the list.\n\nThe variable index increases by one and moves\
    \ to the next answer box in the list.\n\nThis displays a message in the Command\
    \ Prompt or Terminal window.\n\n# ### 22 Click the boxes\n\nRun your code again\
    \ and click on each answer box that appears on the screen. You should see messages\
    \ in the Command Prompt or Terminal window telling you which box you clicked on.\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_111_0.png)"
  merge: -1
  img_proc: true
- pgno: 112
  md: "# ### 23. Check the answer\n\nNow you need to update the body of the `on_mouse_down(pos)`\
    \ function from Step 21. Add the following code that will run if the player clicks\
    \ on a box with the correct answer.\n\n```\n```python\ndef on_mouse_down(pos):\n\
    \    index -= 1\n    for box in answer_boxes:\n        if box.collidepoint(pos):\n\
    \            print(\"Clicked on answer \" + str(index))\n            if index\
    \ == question[5]:\n                print(\"You got it correct!\")\n          \
    \      correct_answer()\n            index = index + 1\n```\n```\n\nThis checks\
    \ if the player has clicked on the correct answer box.\n\nThe item at position\
    \ five in each question list is the number that corresponds to the correct answer.\n\
    \n> > Wow! Tina has gotten all the answers correct!\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_112_0.png)\n\
    \n# ### 24. End the game\n\nIf the player clicks on a wrong answer, the game should\
    \ end. Update the code under `def on_mouse_down(pos)` one last time and use an\
    \ else statement to run the `game_over()` function if the player selects a wrong\
    \ answer. Add the code shown in black below.\n\n```\n```python\ndef on_mouse_down(pos):\n\
    \    index -= 1\n    for box in answer_boxes:\n        if box.collidepoint(pos):\n\
    \            print(\"Clicked on answer \" + str(index))\n            if index\
    \ == question[5]:\n                print(\"You got it correct!\")\n          \
    \      correct_answer()\n            else:\n                game_over()\n    \
    \        index = index + 1\n```\n```\n\nThis block runs if the box clicked on\
    \ doesn't hold the correct answer.\n\n> > One more point and the game is over!\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_112_1.png)"
  merge: -1
  img_proc: true
- pgno: 113
  md: "# ### 25 Update the timer\n\nNow you need to update the code under `def update_time_left()`\
    \ from Step 3. This will decrease the number of seconds by one every time the\
    \ function is run. Type the following code.\n\n```\n```python\ndef update_time_left():\n\
    \    global time_left\n\n    if time_left:\n        time_left = time_left - 1\n\
    \    else:\n        game_over()\n```\n```\n\nIf there's still time left on the\
    \ timer, this decreases it by one.\n\nThis ends the game when the timer runs out.\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_113_0.png)\n\n# ### 26 Schedule the\
    \ timer\n\nFinally, you need to update the `update_time_left()` function so that\
    \ it runs automatically once every second. You can use Pygame Zero's clock tool\
    \ to do this. Add this line of code to the very bottom of your program.\n\n```\n\
    ```python\nglobal time_left\n\nif time_left:\n    time_left = time_left - 1\n\
    else:\n    game_over()\n\nclock.schedule_interval(update_time_left, 1.0)\n```\n\
    ```\n\nThis calls the `update_time_left()` function once every second.\n\n# ###\
    \ 27 Get quizzing!\n\nThat's it! Run your game and try it out. Hopefully, you'll\
    \ be able to answer all the questions correctly. Remember, if your screen doesn't\
    \ look right, you'll have to go back to your code and double it. Read every line\
    \ carefully and make sure your code matches the steps exactly. Have fun quizzing\
    \ your friends!\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_113_1.png)\n\nThe\
    \ player needs to click on the correct answer before the time runs out."
