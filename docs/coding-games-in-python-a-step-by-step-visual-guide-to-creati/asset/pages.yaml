  md: "# Balloon fight\n\nIn this example, the program asks if you want to throw a\
    \ water balloon. If your answer is y, it prints “Splash!!” and asks if you want\
    \ to throw another water balloon. If your answer is n, the program prints “Goodbye!”\
    \ and ends.\n\nThis line gets the value of answer (used in loop condition).\n\n\
    ```\n```python\nanswer = input(\"Throw a water balloon? (y/n)\")\nwhile answer\
    \ == \"y\":\n    print(\"Splash!!\")\n    answer = input(\"Throw another water\
    \ balloon? (y/n)\")\nprint(\"Goodbye!\")\n```\n```\n\nThis line gets the new value\
    \ of answer (used in loop condition).\n\nWhen the loop is complete, this line\
    \ prints “Goodbye!”\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_40_0.png)\n\n\
    > “It's really wet in here!”\n\n# How it works\n\nThe loop condition here is answer\
    \ == \"y\", which means you want to throw a water balloon. The loop body prints\
    \ “Splash!!” to show a balloon being thrown and asks if you want to throw another.\
    \ If your answer is y, the loop condition is True and the loop is repeated. If\
    \ your answer is n (or anything other than y), the loop condition is False and\
    \ the program exits the loop and prints “Goodbye!” before ending.\n\n# Infinite\
    \ loops\n\nSometimes, you might want a loop to repeat for as long as the program\
    \ is running. This can be done with an infinite loop. You can make an infinite\
    \ loop by setting the loop condition to True, so that it keeps repeating a block\
    \ of code forever!\n\n```\n```python\n>>> while True:\n    print(\"This is an\
    \ infinite loop!\")\n```\n```\n\nThere is no False option to escape the loop.\n\
    \n# Making an escape\n\nIf you don’t want to run an infinite loop, it’s important\
    \ to make sure the body of a while loop does something that could make the loop\
    \ condition False. But don’t worry if you accidentally code a program with an\
    \ infinite loop—you can escape it by holding down the Ctrl key and pressing the\
    \ C key along with it.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_40_1.png)\n\
    \n> “They got away!”"
  merge: -1
  img_proc: true
- pgno: 41
  md: '# # Functions


    Functions are really handy tools for all coders. They let you name useful chunks
    of code so that you can use them over and over again without having to type the
    whole thing out each time—you just have to type in the name! Python comes with
    some built-in functions, but you can also write your own to handle tasks specific
    to your games.


    # ## Using functions


    When you want to use one of Python’s built-in functions, all you need to do is
    “call” it by typing out its name followed by a pair of empty parentheses. This
    tells Python to run the code saved in that function. If you need to give a function
    some data to use, it goes inside the parentheses. This is called a “parameter.”


    # ## Built-in functions


    Python comes with a number of built-in functions. They allow you to perform a
    variety of tasks, from printing messages to converting one type of data to another.


    This calls the `print()` function with a string parameter.


    ```

    ```python

    >>> print("This is a parameter")

    This is a parameter

    ```

    ```


    The string parameter is printed.


    # `print()`


    One of the most commonly used functions is `print()`. This function lets you display
    a string (a series of letters, numbers, or other characters) on the screen. The
    string is a parameter in this case.


    # Function terms


    +   - **Call** When you want to use a function, you “call” it by typing the name
    of the function, followed by parentheses, which may contain a parameter.

    +   - **Define** When you use the `def` keyword and write your own code for a
    function, you are “defining” that function.

    +   - **Parameter** A parameter is a piece of data (information) that you give
    a function to use.

    +   - **Return value** A return value is data that you pass from a function back
    to the main code by using the keyword `return`.


    > > I need to build this very carefully!


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_41_0.png)'
