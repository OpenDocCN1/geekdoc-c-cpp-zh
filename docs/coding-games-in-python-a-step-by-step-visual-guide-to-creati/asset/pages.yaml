- pgno: 184
  md: "# ## 5 Declare the constants\n\nYou need to declare the constants at the start\
    \ of the game.\n\nIn this game, you'll use constants to determine many things,\
    \ including the hero's starting position and the number of eggs the player needs\
    \ to collect to win the game. All of these constants will be used later in the\
    \ code. Type this under the line from Step 4.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_184_0.png)\n\
    \nDon't forget to save your work.\n\n```\n    import math\n\n    WIDTH = 800\n\
    \    HEIGHT = 600\n    CENTER_X = WIDTH / 2\n    CENTER_Y = HEIGHT / 2\n    CENTER\
    \ = (CENTER_X, CENTER_Y)\n    FONT_COLOR = (0, 0, 0)\n    EGG_TARGET = 20\n  \
    \  HERO_START = (200, 300)\n    ATTACK_DISTANCE = 200\n    DRAGON_WAKE_TIME =\
    \ 2\n    EGG_HIDE_TIME = 2\n    MOVE_DISTANCE = 5\n```\n\nThese constants define\
    \ the size of the game window.\n\nThis sets the number of eggs needed to win the\
    \ game.\n\nThis sets the hero's position at the start of the game.\n\nThis sets\
    \ the number of seconds the eggs are hidden.\n\nThis sets the font color to black.\n\
    \nThis is the distance in pixels at which a dragon can attack the hero.\n\nThis\
    \ is the number of seconds the dragons stay awake.\n\nThis is the number of pixels\
    \ the hero moves by with each key press.\n\n# ## 6 Declare the global variables\n\
    \nAfter the constants, you need to declare the global variables. They're a lot\
    \ like constants because they're usually declared at the top of the program. However,\
    \ unlike constants, their values change when they're used throughout the program\
    \ to track the game's progress. Type this code next.\n\n> > Check page 74 to learn\
    \ more about global variables.\n\n```\n    MOVE_DISTANCE = 5\n    lives = 3\n\
    \    eggs_collected = 0\n    game_over = False\n    game_complete = False\n  \
    \  reset_required = False\n```\n\nThis tracks the number of eggs collected.\n\n\
    This variable tracks if the player has won.\n\nThis variable tracks the number\
    \ of lives remaining.\n\nThis variable tracks if the game is over.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_184_1.png)"
  merge: -1
  img_proc: true
- pgno: 185
  md: "# ## Create the lairs\n\nEach dragon in this game has its own lair with a certain\
    \ number of eggs and an easy, medium, or hard difficulty level. You can use Python's\
    \ dictionaries to keep track of all the elements needed to create these lairs.\
    \ Each dictionary includes Actors for the dragons and eggs, and variables for\
    \ tracking each dragon's sleep cycle. Begin by creating a dictionary for the easiest\
    \ lair. Carefully type these lines under the code from Step 6.\n\n```\n```python\n\
    reset_required = False\n\neasy_lair = {\n    \"dragon\": Actor(\"dragon-asleep\"\
    , pos=(600, 100)),\n    \"eggs\": Actor(\"one-egg\", pos=(400, 100)),\n    \"\
    egg_count\": 1,\n    \"egg_hidden\": False,\n    \"egg_hide_counter\": 0,\n  \
    \  \"sleep_length\": 10,\n    \"sleep_counter\": 0,\n    \"wake_counter\": 0\n\
    }\n```\n```\n\n# ### EXPERT TIPS\n\n# ## Dictionaries\n\nIn Python, using a dictionary\
    \ is another way to store information. It's like a list, but with a label attached\
    \ to every item. This label is known as the \"key\" and the item it's attached\
    \ to is called the \"value.\" You can even create a dictionary in which the values\
    \ are other dictionaries. This is called \"nesting,\" and it allows you to store\
    \ the pieces of your game in a structured way.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_185_0.png)\n\
    \n# ## Medium lair\n\nNext add a dictionary for the lair with medium difficulty.\
    \ The code for this is a lot like the code in the previous step, but some of the\
    \ values are different.\n\n```\n```python\nmedium_lair = {\n    \"dragon\": Actor(\"\
    dragon-asleep\", pos=(600, 300)),\n    \"eggs\": Actor(\"two-eggs\", pos=(400,\
    \ 300)),\n    \"egg_count\": 2,\n    \"egg_hidden\": False,\n    \"egg_hide_counter\"\
    : 0,\n    \"sleep_length\": 7,\n    \"sleep_counter\": 0,\n    \"wake_counter\"\
    : 0\n}\n```\n```\n\nThese are the coordinates for the dragon in this lair.\n\n\
    This checks if the eggs are currently hidden.\n\nThis tracks the dragon's sleep\
    \ cycle.\n\nThis sets the coordinates of the eggs."
  merge: -1
  img_proc: true
