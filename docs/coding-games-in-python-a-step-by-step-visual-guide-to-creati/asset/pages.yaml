  md: '# # It’s gardening time!


    It will take some preparation to get the garden ready. Begin by setting up the
    folders and downloading the images you’ll need.


    > > These are going to look great in my garden.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_160_0.png)


    # ## 1. Get started


    Open IDLE and create an empty file by clicking on the **File** menu and choosing
    **New File**.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_160_1.png)


    # ## 2. Save the game


    Go to your python-games folder and create another folder called **happy-garden**.
    From the **File** menu, choose **Save As...** and save the program as *garden.py*
    inside the happy-garden folder.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_160_2.png)


    # ## 3. Set up an image folder


    Within the happy-garden folder, create another folder by right-clicking and choosing
    **New Folder**. Name it *images*. It will be used to store all the images you
    need for this game.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_160_3.png)


