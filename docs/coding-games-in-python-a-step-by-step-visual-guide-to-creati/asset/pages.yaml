  md: "# # Hacks and tweaks\n\nYou’ve built a great game, but don’t limit yourself\
    \ to just five questions. Take Big Quiz to the next level by tweaking some of\
    \ its rules. Here are some suggestions to get you started.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_114_0.png)\n\
    \n# ▷ **Take the hint**\n\nYou can give the player a hint by displaying the correct\
    \ answer box in the Command Prompt or Terminal window if they press the **H**\
    \ key. Here is some code you could use to do this.\n\n```\n```python\ndef on_key_up(key):\n\
    \    if key == keys.H:\n        print(\"The correct answer is box number %s\"\
    \ % question[5])\n```\n```\n\n```\n```python\ndef on_key_up(key):\n    global\
    \ score\n    if key == keys.H:\n        print(\"The correct answer is box number\
    \ %s\" % question[5])\n    if key == keys.SPACE:\n        score = score - 1\n\
    \        correct_answer()\n```\n```\n\nThis block first decreases the player’s\
    \ score by one and then runs the **correct_answer()** function, which increases\
    \ it by one, keeping the score the same.\n\n# ◁ **Skip a question**\n\nYou could\
    \ add some more code to the **on_key_up(key)** function that allows the player\
    \ to skip a question by pressing the **Space bar**. Skipping a question means\
    \ they move on to the next question, but without scoring a point. Here’s one way\
    \ of doing it.\n\n# ▷ **More questions**\n\nYou can play this game over and over\
    \ again, but to keep it interesting, you can change the questions or even add\
    \ some more. Here are a few examples of questions that you might want to use.\
    \ You can always add some of your own! If you add extra questions, what else in\
    \ the code will you need to update?\n\n```\n```python\nq6 = [\"What is a quarter\
    \ of 200?\",\n      \"50\", \"100\", \"25\", \"150\", 1]\n\nq7 = [\"Which is the\
    \ largest state in the USA?\",\n      \"Wyoming\", \"Alaska\", \"Florida\", \"\
    Texas\", 2]\n\nq8 = [\"How many wives did Henry VIII have?\",\n      \"Eight\"\
    , \"Four\", \"Six\", \"One\", 3]\n```\n```"
