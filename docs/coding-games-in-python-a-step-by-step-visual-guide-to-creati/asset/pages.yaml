    the screen. Then you’ll create the `update()` function to check the player’s actions
    and update the different elements of the game. Both these functions are called
    many times every second, which will allow you to animate the Actors in the game.
    You’ll also use the `clock.schedule_interval()` function to wake up the dragons
    and send them to sleep at regular intervals.


