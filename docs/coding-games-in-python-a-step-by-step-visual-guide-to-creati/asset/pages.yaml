  md: '# Plan the interface


    When building this game, you need to think about the way it looks, or its “interface”.
    The player needs to be able to see the question, its possible answers, and a timer
    that shows how long they’ve got left. Here’s a sketch of how you might want the
    interface to look.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_105_0.png)


    # Wireframes


    Computer game designers can plan their game interfaces using wireframes. These
    are diagrams that show the different parts of an interface that the player sees
    on screen. They can be drawn by hand or made using a simple drawing tool on a
    computer. By doing this, the interface can be tested, and any changes to the design
    can be made before writing the code.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_105_1.png)'
  merge: -1
  img_proc: true
