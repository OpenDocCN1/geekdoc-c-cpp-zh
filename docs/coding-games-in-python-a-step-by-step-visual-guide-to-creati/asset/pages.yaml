- pgno: 19
  md: "# # Installing Pygame Zero\n\nNow it’s time to add some extra tools to help\
    \ you build great games. In this book, you’ll need two additional modules—Pygame\
    \ and Pygame Zero. These are not included with Python, so you need to install\
    \ them separately.\n\n# ## Installing Pygame Zero on Windows\n\nFollow these steps\
    \ to install the latest versions of Pygame and Pygame Zero on your Windows computer.\
    \ Your machine needs to be connected to the Internet to complete some of these\
    \ steps.\n\n# Expert Tips\n\n# ### Admin access\n\nMake sure you're signed into\
    \ your computer as an admin; otherwise, the system won't let you install things\
    \ properly. Always ask permission before installing new software on someone's\
    \ computer.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_19_0.png)\n\n+   1. **Open\
    \ the Command Prompt**\n+   \n+      Click **Start**. Scroll down and open the\
    \ **Windows System** folder. Click **Command Prompt**. If you can’t find it, try\
    \ searching for it. You’ll need to type in some commands and press **Enter** to\
    \ run each one. Make sure you spell everything correctly and put spaces in the\
    \ right places or it won’t work.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_19_1.png)\n\
    \nLook out for this thumbnail in the menu.\n\n+   2. **Install a package manager**\n\
    +   \n+      A package manager called “pip” should come with Python when you install\
    \ it. It’s a tool that makes it easier to install Pygame Zero and other Python\
    \ modules. Type this command into the Command Prompt and press **Enter**—it will\
    \ check if pip is on your computer and install it if it is not.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_19_2.png)\n\
    \n+   3. **Install Pygame**\n+   \n+      Once the package manager is installed,\
    \ type the following command and press **Enter**. This uses pip to install Pygame.\n\
    \n```\n```bash\npip install pygame\n```\n```\n\n+   4. **Install Pygame Zero**\n\
    +   \n+      Finally, type this command. When you press **Enter**, this will install\
    \ Pygame Zero, also known as pgzero for short.\n\n```\n```bash\npip install pgzero\n\
    ```\n```"
  merge: -1
  img_proc: true
