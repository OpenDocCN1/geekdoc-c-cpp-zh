  md: "# 9. Draw the Actors\n\nNow use the draw() function to display the dots and\
    \ their number labels on the screen. The function screen.draw.text() expects a\
    \ string as an input, but since the value stored in number is an integer, you\
    \ need to use the str() function to convert it into a string. Add this code below\
    \ the commands from Step 8.\n\nThis sets the background color to black.\n\n```\n\
    dots.append(actor)\n\ndef draw():\n    screen.fill(\"black\")\n    number = 1\n\
    \    for dot in dots:\n        screen.draw.text(str(number), \\\n            (dot.pos[0],\
    \ dot.pos[1] + 12))\n        dot.draw()\n        number = number + 1\n```\n\n\
    This creates a variable to keep track of the current number label.\n\nThese lines\
    \ draw each dot on the screen along with a number label.\n\n# 10. Draw the lines\n\
    \nNext add this code to the end of the draw() function to draw the lines. Until\
    \ the player clicks on the first two dots, the lines list will remain empty, so\
    \ the function won't draw any lines on the screen.\n\n```\nnumber = number + 1\n\
    for line in lines:\n    screen.draw.line(line[0], line[1], (100, 0, 0))\n```\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_76_0.png)\n\n# EXPERT TIPS\nLine function\n\
    \nThis function draws a line between two points on the screen—starting at point\
    \ x and ending at point y. You can change the color of the line to red (R), green\
    \ (G), blue (B), or even a mix of all three (RGB), by placing a color by values\
    \ between 0 (none of the color) and 255 (the maximum amount of the color). For\
    \ example, (0, 0, 100) sets the color of the line to blue. You can use some colors\
    \ by typing in their names, but RGB values let you use lots of different shades.\n\
    \n```\nscreen.draw.line(x, y, (0, 0, 100))\n```\n\nThese numbers can change depending\
