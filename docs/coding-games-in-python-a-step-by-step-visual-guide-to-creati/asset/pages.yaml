  md: "# 27 Check for collisions\n\nYou now need to define the `check_for_collisions()`\
    \ function from Step 19. The code in this function will loop over each lair dictionary\
    \ and check if the hero has touched an egg and if the hero is close enough to\
    \ an awake dragon to get attacked. Replace `pass` under `def check_for_collisions()`\
    \ with the code shown below.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_193_0.png)\n\
    \n```\n~~~python\nlair[\"egg_hide_counter\"] += 1\n\ndef check_for_collisions():\n\
    \    global lairs, eggs_collected, lives, reset_required, game_complete\n    for\
    \ lair in lairs:\n        if lair[\"egg_hidden\"] is False:\n            check_for_egg_collision(lair)\n\
    \        if lair[\"dragon\"].image == \"dragon-awake\" and reset_required is False:\n\
    \            check_for_dragon_collision(lair)\n~~~\n```\n\nThis function is called\
    \ if the eggs are not hidden.\n\nThis function is called if the dragon is awake\
    \ and the hero's position is not being reset.\n\nThis makes sure the player doesn't\
    \ lose a life when the hero is being moved back to the start position.\n\n# EXPERT\
    \ TIPS\n\n# colliderect()\n\nThe colliderect() function gets its name from a combination\
    \ of two words—collide and rectangle. Pygame places an invisible rectangle around\
    \ each element on the screen. If you want to detect a collision between two objects,\
    \ you can check if the rectangles around them are overlapping with each other.\
    \ Sometimes Pygame detects a collision even if two objects appear to be slightly\
    \ apart. This is because even when the objects are not touching each other, the\
    \ rectangles around them can still overlap.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_193_1.png)"
  merge: -1
  img_proc: true
- pgno: 194
  md: "# ## 28 Dragon collisions\n\nIf the hero gets too close to an awake dragon,\
    \ the player will lose a life. You’ll use the `check_for_dragon_collision()` function\
    \ to calculate this distance. Add this code under what you typed in Step 27.\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_194_0.png)\n\n```\n```python\ncheck_for_dragon_collision(lair)\n\
    \ndef check_for_dragon_collision(lair):\n    x_distance = hero.x - lair[\"dragon\"\
    ].x\n    y_distance = hero.y - lair[\"dragon\"].y\n    distance = math.hypot(x_distance,\
    \ y_distance)\n    if distance < ATTACK_DISTANCE:\n        handle_dragon_collision()\n\
    ```\n```\n\nThis calculates the horizontal and vertical distances between the\
    \ dragon and the hero.\n\nThis finds the distance between the dragon and the hero\
    \ in a straight line.\n\nThis function is called if the distance between the hero\
    \ and dragon is less than ATTACK_DISTANCE.\n\n# ## 29 Reset hero\n\nIf the player\
    \ loses a life, the hero’s position needs to be reset to the starting position.\
    \ You’ll use the `animate()` function to do this. In your game, this function\
    \ takes three parameters—the hero Actor, the hero’s starting position, and the\
    \ subtract_life() function. Add the code shown in black here.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_194_1.png)\n\
    \n```\n```python\ndistance = math.hypot(x_distance, y_distance)\nif distance <\
    \ ATTACK_DISTANCE:\n    handle_dragon_collision()\n```\n```\n\n```\n```python\n\
    def handle_dragon_collision():\n    global reset_required\n    reset_required\
    \ = True\n    animate(hero, pos=HERO_START, on_finished=subtract_life)\n```\n\
    ```\n\nThis function is called when the animation is complete."
  merge: -1
  img_proc: true
- pgno: 195
  md: "# 30  Egg collisions\n\nYou now need to add a function that will check if the\
    \ hero has touched an egg or not. This function uses colliderect() to check this.\
    \ If the hero touches an egg, the egg_count variable will be increased by the\
    \ number of eggs in that lair. If the egg count reaches the target, the game_complete\
    \ variable will be set to True and the player will win the game.\n\n```\n```python\n\
    def check_for_egg_collision(lair):\n    global eggs_collected, game_complete\n\
    \    if hero.colliderect(lair[\"eggs\"]):\n        lair[\"egg_hidden\"] = True\n\
    \        eggs_collected = lair[\"egg_count\"]\n        if eggs_collected >= EGG_TARGET:\n\
    \            game_complete = True\n```\n```\n\nThis adds the number of eggs for\
    \ the current lair to the player's egg count.\n\nThis checks if the number of\
    \ eggs collected is greater than or equal to the EGG_TARGET.\n\n# 31  Lose a life\n\
    \nLastly, you need to define the subtract_life() function. Every time the player\
    \ loses a life, this function will update the number of lives remaining. If there\
    \ are no more lives left, the game_over variable will be set to True and the game\
    \ will end.\n\n```\n```python\ndef subtract_life():\n    global lives, reset_required,\
    \ game_over\n    lives -= 1\n    if lives == 0:\n        game_over = True\n  \
    \      reset_required = False\n```\n```\n\nThis variable is set to False, as the\
    \ hero is already at the starting position.\n\n# 32  Time to play\n\nYou are now\
    \ ready for the quest. Try to collect all 20 eggs to win the game, but watch out\
    \ for those dragons!\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_195_0.png)"
  merge: -1
  img_proc: true
