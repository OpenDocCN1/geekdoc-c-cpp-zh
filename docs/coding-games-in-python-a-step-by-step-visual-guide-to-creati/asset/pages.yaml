    is being pressed, or if the fox is touching a coin.


    # Getting started


    Follow these steps to build the game.

    First set up a new file and import the relevant modules. Then draw the Actors
    and define the functions to run the game. Good luck!


    # Get set up


    Create a new folder called *coin-collector*. Then open IDLE and create an empty
    file by going to the **File** menu and choosing **New File**. Select **Save As...**
    from the menu and save the file as *coin.py* in the *coin-collector* folder.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_62_1.png)'
