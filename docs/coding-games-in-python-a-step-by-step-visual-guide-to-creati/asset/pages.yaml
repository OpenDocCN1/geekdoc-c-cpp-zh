- pgno: 119
  md: '# # How to build Balloon Flight


    Take control of your own hot-air balloon and try to avoid the obstacles that come
    your way as you fly.


    # ## What happens


    When the game starts, a hot-air balloon appears in the middle of the screen. You
    need to use the mouse button to make the balloon rise or fall. The challenge is
    to keep the balloon in the air without hitting any birds, houses, or trees. For
    every obstacle you avoid, you''ll score one point. But as soon as you hit one,
    the game is over.


    > A cloudy backdrop sets the scene.


    Pygame Zero Game


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_119_0.png)


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_119_1.png)


    ◁ **Balloon** The balloon begins to drop as soon as the game starts. You can make
    it rise again by clicking the mouse.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_119_2.png)


    ◁ **Obstacles** The obstacles keep appearing at random positions. The player needs
    to avoid all the obstacles to stay in the game.'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'Watch out for the bird as it flies across the screen.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_120_0.png)


    The clouds are part of the background, so you don''t need to avoid them.


    The balloon moves up when you''re pressing the mouse button and down when you''re
    not pressing it.


    # ### ◁ Up in the air


    The program creates the illusion of motion by making the obstacles appear at random
    intervals and moving them along the x-axis.'
