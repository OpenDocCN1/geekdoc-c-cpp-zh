  md: "# Move the fangflower\n\nUnlike other flowers, the fangflowers don’t stay in\
    \ one place. They move all over the garden trying to zap the cow. In this step,\
    \ you’ll add the code that generates the velocity of each fangflower along the\
    \ x-axis and y-axis. The fangflowers will use a combination of these two velocities\
    \ to move up, down, side to side, or diagonally. Add the following code under\
    \ def velocity() from Step 29.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_171_0.png)\n\
    \n> Remember, we talked about velocity on page 160.\n\nThis combination of the\
    \ two velocities affect a fangflower’s movement.\n\nThis is one of eight different\
    \ directions a fangflower can move in.\n\n```\n```python\ndef velocity():\n  \
    \  random_dir = randint(0, 1)\n    random_velocity = randint(2, 3)\n    if random_dir\
    \ == 0:\n        return -random_velocity\n    else:\n        return random_velocity\n\
    ```\n```\n\nThis generates the velocity of the fangflower with no direction yet.\n\
    \nIf the direction is 0, this returns a negative velocity.\n\nThis line generates\
    \ a number that represents the direction of the fangflower.\n\nIf the direction\
    \ is 1, this returns a positive velocity."
