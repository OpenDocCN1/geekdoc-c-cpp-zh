  md: "# Making your own functions\n\n> **EXPERT TIPS**\n> \n> ### Naming your functions\n\
    > \n> It's important to give your functions accurate names that explain what they\
    \ do. This will help you understand the code. Names can contain letters, numbers,\
    \ and underscores, but they should always begin with a letter. You can't use spaces,\
    \ so if there are multiple words in the name of your function, separate them by\
    \ using underscores instead. For example, if you were creating a function to end\
    \ the game, you could name it game_over().\n\nThere isn't a built-in function\
    \ for everything, so you need to know how to write, or “define,” your own. A function\
    \ should have one clear purpose and a name that describes what it does. Follow\
    \ these steps to create a function that calculates a player's score.\n\n# 1 Define\
    \ the function\n\nLet's create a function to keep score in a game. Open an editor\
    \ window in IDLE and save it as functions.py. Then type in the code below, making\
    \ sure you get all the indents right. After each step, save the file, go to the\
    \ Run menu, and click Run Module.\n\n```\n```\ndef fruit_score():\n    print(10)\n\
    \nfruit_score()\n```\n```\n\n+   - Use the def keyword to define a function.\n\
    +   - This function doesn't take a parameter.\n+   - This is the code you're storing\
    \ in the function.\n+   - This calls the function, running the code you've stored\
    \ in it.\n+   - The score is displayed in the shell.\n\n10\n\n# 2 Add some parameters\n\
    \nThe function works well so far, but what if you want to have different scores\
    \ for different fruits you collect? For the function to know which score to print,\
    \ it needs to know which fruit you have collected. Imagine you get ten points\
    \ for an apple, but five points for an orange. You can do this by adding a parameter\
    \ to the function.\n\n```\n```\ndef fruit_score(fruit):\n    if fruit == \"apple\"\
    :\n        print(10)\n    elif fruit == \"orange\":\n        print(5)\n\nfruit_score(\"\
    apple\")\nfruit_score(\"orange\")\n```\n```\n\n+   - The function now takes a\
    \ parameter.\n+   - These lines give a value to the parameter.\n+   - The function\
    \ is called twice—once with each parameter.\n+   - The score that gets printed\
    \ depends on whether the parameter is apple or orange.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_43_0.png)\n\
    \n10\n5"
