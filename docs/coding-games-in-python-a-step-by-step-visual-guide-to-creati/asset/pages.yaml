- pgno: 25
  md: '# Running your program


    Because your games use Pygame Zero, you usually have to run them in a different
    way from normal Python programs. It isn''t difficult once you get used to it,
    however.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_25_0.png)


    +   6. **Open Command Prompt or Terminal window**

    +      To run the program, you can use the command line. If you''re using a Windows
    computer, this is in the Command Prompt app. If you''re on a Mac, open the Terminal
    app.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_25_1.png)


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_25_2.png)


    This is what the icon for Command Prompt looks like.


    This is what the icon for the Terminal window looks like.


    +   7. **Type in the Pygame Zero command**

    +      To tell Pygame Zero to run the game, type `pgzrun` into the command line
    and leave a space, but don''t press **Enter** yet!


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_25_3.png)


    Don''t forget to leave a space after `pgzrun`.


    +   8. **Drag and drop the IDLE file**

    +      Keep the app open, and using Explorer (Windows) or Finder (Mac), go to
    the folder where you saved your program. Once you find it, drag and drop the `.py`
    file into the command line.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_25_4.png)


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_25_5.png)


    Drag and drop `hello.py` into the Command Prompt or Terminal window.


    The location of your **IDLE** file will appear here when you drop it in.


    +   9. **Run the program**

    +      Now that you''ve typed in the `pgzrun` command and your computer knows
    where to find the **IDLE** file, press **Enter**. This will launch Pygame Zero.


    +   10. **Final screen**

    +       If your program is working correctly, you''ll see a window with a ''Hello''
    message written in the top-left corner of the screen. Good job! Now it''s time
    to become a Python games coder!'
  merge: -1
  img_proc: true
- pgno: 26
  md: "# EXPERT TIPS\n\n# Rebooting programs\n\nWhen you’re building a program, you\
    \ need to run the code frequently to check for bugs. To save time, you can press\
    \ the **Up** arrow key in Command Prompt or Terminal to see your recent commands.\
    \ You can then press **Enter** to run one of them again. If your game is still\
    \ running, you need to close it before rerunning your code. If you don’t, nothing\
    \ will happen!\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_26_0.png)\n\n# Running\
    \ your program using IDLE\n\nIt’s possible to run your Pygame Zero programs using\
    \ IDLE. To do this, you need to add two extra lines to your code. It’s a good\
    \ idea to wait until you have finish writing your program before doing this.\n\
    \n+   1. Type `import pgzrun` at the very top of your program and `pgzrun.go()`\
    \ at the very end. The entire code for your game should now sit between these\
    \ two lines.\n\n+   2. To run the game in IDLE go to the **Run** menu and click\
    \ **Run Module**, or just press the **F5** key.\n\n```\n```python\nimport pgzrun\n\
    \ndef draw():\n    screen.draw.text(\"Hello\", topleft=(10, 10))\n\npgzrun.go()\n\
    ```\n```\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_26_1.png)\n\n# IMPORTANT!\n\
    \n# Fix mistakes\n\nIf nothing happens when you run one of your programs, or if\
    \ you get an error message—don’t panic! It’s normal to experience errors (these\
    \ are called “bugs”) when coding a program. If an error message appears, ask yourself\
    \ the following questions:\n\n+   - Does the code match the given example exactly?\n\
    +   - Have I saved the program in the right folder?\n+   - Have I typed `pgzrun`\
    \ correctly?\n+   - Are Pygame and Pygame Zero installed correctly?\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_26_2.png)"
