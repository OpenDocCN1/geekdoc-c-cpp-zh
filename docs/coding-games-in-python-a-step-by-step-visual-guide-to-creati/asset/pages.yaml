  md: "# Thinking caps on!\n\nThere may be a time limit to answer the questions, but\
    \ not to build the game! Follow these steps carefully to build your own quiz show\
    \ to play with your friends and family.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_104_0.png)\n\
    \n+   1. **First steps**\n+      Create a new folder called big-quiz in your python-games\
    \ folder. Then open IDLE and create an empty file by going to the **File** menu\
    \ and choosing **New File**. Select **Save As...** from the same menu and save\
    \ the file as quiz.py in the big-quiz folder.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_104_1.png)\n\
    \n+   2. **Set the screen size**\n+      Next you need to define the size of the\
    \ playing area. Add this code to the very top of your program to set the width\
    \ and height of the game screen.\n\n```\n    WIDTH = 1280\n    HEIGHT = 720\n\
    ```\n\nThese values are in pixels.\n\n+   3. **Create the stubs**\n+      You\
