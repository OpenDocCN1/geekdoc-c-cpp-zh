  md: "# EXPERT TIPS\n\n# Coordinates\n\nIn most programming languages, the coordinates\
    \ (0, 0) refer to the top-left corner of the screen. Subtracting 50 pixels from\
    \ the y-coordinate in `on_mouse_down()` makes the balloon go 50 pixels closer\
    \ to 0 on the y-axis, which is the top of the screen. Therefore, the balloon goes\
    \ up.\n\n# 13. Reacting to mouse clicks\n\nNow you need to define two event handler\
    \ functions—`on_mouse_down()` to make the balloon rise if the player pushes down\
    \ on the mouse button, and `on_mouse_up()` to let the balloon fall if they release\
    \ the button. Add this code under what you typed in Step 11.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_126_0.png)\n\
    \nThese functions handle the mouse button presses.\n\n```\n```python\nelse:\n\
    \    display_high_scores()\n\ndef on_mouse_down():\n    global up\n    up = True\n\
    \    balloon.y -= 50\n\ndef on_mouse_up():\n    global up\n    up = False\n```\n\
    ```\n\n# EXPERT TIPS\n\n# Shorthand calculations\n\nWith Python, you can perform\
    \ a calculation using a variable and then store the result in the same variable.\
    \ For example, to add 1 to a variable called `a`, you would usually write: `a\
    \ = a + 1`.\n\nA shorter way to write this calculation and still get the same\
    \ result is `a += 1`. You can also do this with subtraction, multiplication, and\
    \ division. For example:\n\n`a = a - 1` is the same as `a -= 1`\n`a = a / 1` is\
    \ the same as `a /= 1`\n`a = a * 1` is the same as `a *= 1`\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_126_1.png)"
  merge: -1
  img_proc: true
- pgno: 127
  md: "# 14. Make the bird flap\n\nTo make the bird realistic, add a function to make\
    \ it look like it's flapping its wings. You don't need to do this for both images.\n\
    \n```\ndef flap():\n    global bird_up\n    if bird_up:\n        bird.image =\
    \ \"bird-down\"\n        bird_up = False\n    else:\n        bird.image = \"bird-up\"\
    \n        bird_up = True\n```\n\nIf the bird's wings are up, this code will change\
    \ its image to the one where the bird's wings are down.\n\n# EXPERT TIPS\n\n##\
    \ Actor animations\n\nYou can make your Actors look like they're moving by using\
    \ two or more different images of the same Actor. For example, in this game, there\
    \ are two images of a bird—one with its wings up and one with its wings down.\
    \ By alternating between the two images, it looks as if the bird is flapping its\
    \ wings. The same function could make a person look like they're dancing, or a\
    \ frog look like it's jumping!\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_127_0.png)\n\
    \n# 15. Create the update() function\n\nNow you need to create a function to update\
    \ the game. Remember, update() is a built-in function that automatically runs\
    \ 60 times a second, so you don't need to call it. Add this code right after the\
    \ lines from Step 14.\n\n```\ndef update():\n    global game_over, score, number_of_updates\n\
    ```\n\nThis line declares the variables the function must change.\n\n# 16. Adding\
    \ in gravity\n\nNext add some code to make the balloon move down when the player\
    \ isn't pressing the mouse button. Add this code to the update() function from\
    \ Step 15.\n\n```\nglobal game_over, score, number_of_updates\nif not game_over:\n\
    \    if not up:\n        balloon.y += 1\n```\n\nIf the mouse button is not being\
    \ pressed, this moves the balloon down by one pixel.\n\n# 17. Test your code\n\
    \nLet's run the code again. This time you'll see the same screen as in Step 12,\
    \ but the balloon should react to mouse clicks.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_127_1.png)"
