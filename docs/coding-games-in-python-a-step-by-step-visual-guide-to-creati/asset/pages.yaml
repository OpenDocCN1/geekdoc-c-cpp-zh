    \ some stars and display messages on the screen. Add this code under what you\
    \ typed in Step 7.\n\n```\ncurrent_level = 1\nstars = []\nanimations = []\n\n\
    def draw():\n    global stars, current_level, game_over, game_complete\n    screen.clear()\n\
    \    screen.blit(\"space\", (0, 0))\n    if game_over:\n        display_message(\"\
    GAME OVER\", \"Try again.\")\n    elif game_complete:\n        display_message(\"\
    YOU WON!\", \"Well done.\")\n    else:\n        for star in stars:\n         \
    \   star.draw()\n```\n\nThese are the global variables used in this function.\n\
    \nThis adds a background image to the game window.\n\nWhen the game is over or\
    \ complete, this block displays the relevant message on the screen.\n\nThis block\
    \ draws the stars on the screen."
