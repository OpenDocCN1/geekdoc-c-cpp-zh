  md: "# ## 6 Drawing the apple on the screen\n\nNext you need to “draw” the apple\
    \ on the screen. To do this, you can use a built-in Pygame Zero function called\
    \ `draw()`. This function is used to redraw the game screen. For example, if a\
    \ character has moved or a score has changed, you can use this function to update\
    \ the screen with those changes. Write this code beneath your previous code.\n\
    \n```\n```python\napple = Actor(\"apple\")\n\ndef draw():\n    screen.clear()\n\
    \    apple.draw()\n```\n```\n\nThis function is called `draw()`.\n\nThis clears\
    \ the screen.\n\nRemember, you need four blank spaces here.\n\nThis line draws\
    \ the apple on the screen.\n\n# ## 7 Test the code\n\nNow it’s time to test the\
    \ code. Run the program by using the command line in the Command Prompt or Terminal\
    \ window. Check out pages 24–25 if you need to remind yourself how to do this.\n\
    \n```\n```text\npgzrun\n```\n```\n\nDrag and drop your shoot.py file here to run\
    \ it.\n\n> > If you need help running your game, check pages 24–25.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_54_0.png)\n\
    \n# ## 8 First screen\n\nIf your code is working properly, you should see this\
    \ screen. If it’s not, or if you get an error message, go back and check your\
    \ code to find any bugs.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_54_1.png)\n\
    \nA blank game window with an apple in the top-left corner of the screen should\
    \ appear.\n\n# ## 9 Placing the apple\n\nAt the moment, the apple appears in the\
    \ top-left corner of the game window. You can change the code to place the apple\
    \ exactly where you want it on the screen. Write this function, which will place\
