  md: "# 15. **Time's up!**\n\nNow let’s fill in the code for the `time_up()` function.\
    \ In this function, set the game_over Boolean variable to True, which will tell\
    \ the program to quit the game when the function is called. Type in the following\
    \ code.\n\n```\n```python\ndef time_up():\n    global game_over\n    game_over\
    \ = True\n```\n```\n\nRemember to delete the `pass` keyword and then add these\
    \ lines.\n\n# 16. **Set the timer**\n\nNow that `time_up()` is defined, the program\
    \ needs to run it. But it needs to run seven seconds after the game starts. You\
    \ can use Pygame Zero’s built-in tool `clock` to do this. This tool lets you program\
    \ the call a function after a specified amount of time. Add this line in the code\
    \ as shown here.\n\n```\n```python\nclock.schedule(time_up, 7.0)\nplace_coin()\n\
    ```\n```\n\nThis line will run the function `time_up()` seven seconds after the\
    \ game starts.\n\n# 17. **Ending the game**\n\nThe game starts and then seven\
    \ seconds later, `clock.schedule` will run the `time_up()` function, which ends\
    \ the game. But the game still needs to show the player’s final score. For this,\
    \ you need to add in one more bit of code to the `draw()` function.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_66_0.png)\n\
    \n```\n```python\ndef draw():\n    screen.fill(\"green\")\n    fox.draw()\n  \
    \  coin.draw()\n    screen.draw.text(\"Score: \" + str(score), color=\"black\"\
    , topleft=(10, 10))\n\n    if game_over:\n        screen.fill(\"pink\")\n    \
    \    screen.draw.text(\"Final Score: \" + str(score), topleft=(10, 10), fontsize=60)\n\
    ```\n```\n\nIf the variable `game_over` is True, this will turn the screen pink.\n\
    \nThe final score is shown on the screen.\n\nThis command sets the size of the\
    \ text shown on the screen.\n\n# 18. **Using update()**\n\nThe final function\
    \ you need to define is `update()`. This is a built-in Pygame Zero function, which\
    \ means that unlike the other functions, you don’t need to worry about when to\
    \ run it. Once you’ve defined it, Pygame Zero will run it automatically—60 times\
    \ a second! Delete `pass` under `def update()` and add this code. It will move\
    \ the fox to the left if the left keyboard arrow is pressed.\n\n```\n```python\n\
    def update():\n    if keyboard.left:\n        fox.x = fox.x - 2\n```\n```\n\n\
    This moves the fox two pixels to the left if the left arrow is pressed."
