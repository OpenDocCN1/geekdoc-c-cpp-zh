    \ from Step 3 with this code.\n\n```\n```python\ndef game_over():\n    global\
    \ question, time_left\n    message = \"Game over. You got %s questions correct\"\
    \ % str(score)\n    question = [message, \"\", \"\", \"\", 5]\n    time_left =\
    \ 0\n```\n```\n\nThis creates a message that will show the player’s final score.\n\
    \nSince there’s no correct answer here, it’s set to 5, which isn’t on the list.\n\
    \nThe final message is displayed instead of another question. This will set all\
    \ possible answers to a dash because you don’t want the player to be able to answer.\n\
    \nThis sets the time to zero when the game ends."
