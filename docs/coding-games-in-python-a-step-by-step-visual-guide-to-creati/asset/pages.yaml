  md: "![](img/3188b147f991a51de14dcd2bb4b4c42e_80_0.png)\n\n# ▷ **In record time**\n\
    \nYou can use the system clock to time how long it takes a player to connect all\
    \ the dots. You could then try to beat your friends’ times! To time the game,\
    \ you’ll need to use the `time()` function. Once the game is complete, you can\
