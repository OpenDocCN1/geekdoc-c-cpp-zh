- pgno: 21
  md: '# # Using IDLE


    In IDLE, you can work in two different windows. The editor window can be used
    to write and save programs, while the shell window runs Python instructions immediately.


    # ## The shell window


    When you open IDLE, the shell window pops up. This is the best place to get started
    because you don’t have to create a new file first. You just type the code directly
    into the shell window.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_21_0.png)


    ```

    >>> from turtle import *

    >>> forward(200)

    >>> left(90)

    >>> forward(300)

    ```


    These four lines of code are a simple drawing program—try it out for yourself.


    You type in code at the >>> prompt.


    This line shows the version of Python you have.


    The text here will depend on your operating system.


    # ▽ Working in the shell


    You can use the shell window to test out snippets of code before you add them
    into a bigger program. The code you type can be run right away, and any messages
    or “bugs” (errors) are displayed.


    # EXPERT TIPS


    # ### Different windows


    To help you know which window you should put your code in, we’ve given each window
    in IDLE a different color.


    +   - Shell window

    +   - Editor window


    ```

    >>> print(''You’ve unlocked a new level!'')


    >>> 123 + 456 * (7 / 8)


    >>> ''''.join(reversed(''Time to play''))

    ```


    # △ Give the shell a test run


    Type each of these code snippets into the shell window and press Enter after each
    one. The first line displays a message and the second line does a calculation.
    Can you figure out what the third line does?'
  merge: -1
  img_proc: true
- pgno: 22
