    \ a loop that checks if you have clicked on the apple or not.\n\n# ## Get shooting!\n\
    \nAre you ready to code? In this program, you'll start by drawing an apple on\
    \ the screen, then you'll learn to place it at random points before you start\
    \ shooting it. Ready? Let's get coding!\n\n+   1. **Open IDLE**  \n+      Create\
    \ an empty file in IDLE by going to the **File** menu and choosing **New File**.\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_52_1.png)\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_52_2.png)"
