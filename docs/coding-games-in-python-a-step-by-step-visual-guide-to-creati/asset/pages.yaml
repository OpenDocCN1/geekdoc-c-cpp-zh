  md: "# ## Counting down\n\nYou don't want your players to be looking away when the\
    \ next set of moves to memorize is displayed. Add a function that displays 3,\
    \ 2, and then 1 with a one-second pause between each number. You'll actually count\
    \ down from 4, but because the `countdown()` function begins by subtracting one\
    \ from `count`, the number 4 doesn't appear on the screen long enough to be seen.\
    \ Replace `pass` under `def countdown()` from Step 13 with this code.\n\n```\n\
    ```python\ndef countdown():\n    global count, game_over, show_countdown\n   \
    \ if count > 1:\n        count = count - 1\n        clock.schedule(countdown,\
    \ 1)\n    else:\n        show_countdown = False\n        display_moves()\n   \
    \ return\n```\n```\n\nThis updates the value in count by subtracting one.\n\n\
    This line schedules another call to the `countdown()` function in one second.\n\
    \nThis removes the countdown from the screen if count is less than or equal to\
    \ one.\n\n# ## Expert tips\n\n# ### Recursive functions\n\nBoth `display_moves()`\
    \ and `countdown()` are functions that call themselves. These are known as recursive\
    \ functions. Because Pygame Zero redraws the screen thousands of times every second,\
    \ you need your recursive functions to schedule a call to themselves one whole\
    \ second later. Otherwise, the moves and the countdown would be displayed too\
    \ fast for even the most eagle-eyed player to see!\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_149_0.png)\n\
    \n# ## Show the countdown\n\nNow that you've defined a function for the countdown,\
    \ you need to add some code to the `draw()` function to display it. You will also\
    \ need to display “Dance!” when a new set of moves has been shown, so the player\
    \ knows when to start entering the moves using the arrow keys. Add this code to\
    \ the `draw()` function that you started in Step 10.\n\n```\n```python\nscreen.draw.text(\"\
    Score: \",\n                 str(score), color=\"black\",\n                 topleft=(10,\
    \ 10))\n\nif say_dance:\n    screen.draw.text(\"Dance!\", color=\"black\",\n \
    \                    topleft=(CENTER_X - 65, 150), fontsize=60)\n\nif show_countdown:\n\
    \    screen.draw.text(str(count), color=\"black\",\n                     topleft=(CENTER_X\
    \ - 8, 150), fontsize=60)\n\nreturn\n```\n```\n\nThis line draws the word “Dance!”\
    \ on the screen in black.\n\nThis line displays the current value of count on\
