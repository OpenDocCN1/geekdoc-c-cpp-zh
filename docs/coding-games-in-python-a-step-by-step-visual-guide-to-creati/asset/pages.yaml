- pgno: 56
  md: "# ## 12 Dealing with clicks\n\nNow it's time to write the code that will run\
    \ when you press the mouse. Pygame Zero has a built-in function called `on_mouse_down()`,\
    \ which is run every time you click the mouse. Type this code in the code added\
    \ in Step 9 and Step 10, then run it from the command line. You should see the\
    \ message \"Good shot!\" in the Command Prompt or Terminal window each time you\
    \ click the mouse.\n\n```\n    def place_apple():\n        apple.x = 300\n   \
    \     apple.y = 200\n\n    def on_mouse_down(pos):\n        print(\"Good shot!\"\
    )\n        place_apple()\n\n    place_apple()\n```\n\nProgrammers sometimes add\
    \ blank lines to make their code neater, but they aren't necessary. Python ignores\
    \ blank lines completely.\n\n# ## 13 Adding some logic\n\nAt this point, the \"\
    Good shot!\" message is displayed every time you click the mouse, but we only\
    \ want it to show if the player actually hits the apple. You can do this by amending\
    \ the code from Steps 10 and 12 to include an if statement. This code checks if\
    \ the apple and the mouse cursor are in the same position. If they are, the message\
    \ is displayed.\n\npos is the position of the cursor when you click the mouse.\n\
    \n```\n    def on_mouse_down(pos):\n        if apple.collidepoint(pos):\n    \
    \        print(\"Good shot!\")\n            place_apple()\n```\n\nMake sure the\
    \ bottom two lines now start with eight spaces.\n\nThis function checks if the\
    \ cursor is in the same position as the apple.\n\n# ### EXPERT TIPS\n\n# ### Indents\n\
    \nPython uses indents to separate different blocks of code. If your indents are\
    \ wrong, Python won't know how to read your code, and you'll end up with a bug!\
    \ Each indent is made up of four spaces, and code can be indented more than once—for\
    \ example, by eight spaces. Sometimes IDLE adds the indents for you, but if you're\
    \ moving the code around, like in Step 13, you might need to indent it yourself.\
    \ You can do this by entering the correct number of spaces.\n\nWhoa! Good shot!\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_56_0.png)\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_56_1.png)"
  merge: -1
  img_proc: true
- pgno: 57
  md: "# 14 Missed a shot? Game over!\n\nAdd some more logic to your code, so that\
    \ if you miss a shot and don't click on the apple, it quits the game. Try it out!\n\
    \n```\n    if apple.collidepoint(pos):\n        print(\"Good shot!\")\n      \
    \  place_apple()\n    else:\n        print(\"You missed!\")\n        quit()\n\
    ```\n\nThis command quits the game by stopping the program completely.\n\n# 15\
    \ Importing Random\n\nThe game is very easy at this point, because the apple is\
    \ always drawn at the same place on the screen. You can use Python's Random module\
    \ to make the game more challenging by placing the apple at a random point on\
    \ the screen each time it is drawn. First, add this code at the very top of your\
    \ program.\n\n```\n    from random import randint\n    apple = Actor(\"apple\"\
    )\n```\n\nThis imports the function randint() from Python's Random module.\n\n\
    # 16 Using Random\n\nChange the code you typed in Step 9 to look like this. The\
    \ code will now use the randint() function to pick a random number between 10\
    \ and 800 for the x coordinate and a random number between 10 and 600 for the\
    \ y coordinate.\n\n```\n    def place_apple():\n        apple.x = randint(10,\
    \ 800)\n        apple.y = randint(10, 600)\n```\n\nThis function picks a random\
    \ number for each coordinate.\n\n# 17 Time to shoot!\n\nYou did it! Run your program\
    \ to play the game. Each time you 'shoot' the apple, it will move to a random\
    \ place on the screen for you to 'shoot' again.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_57_0.png)\n\
    \n# EXPERT TIPS\n\n# Random numbers\n\nRolling a dice, picking a card from a deck,\
    \ or tossing a coin are all actions that you can simulate by generating a random\
    \ number. You can read more about how to use Python's Random module by going to\
    \ the **Help** menu and clicking **Python Docs**.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_57_1.png)"
