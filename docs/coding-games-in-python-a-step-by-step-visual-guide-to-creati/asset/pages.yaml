  md: "# # Fixing bugs\n\nIf there’s an error, or a “bug,” in your code, Python will\
    \ show an error message. These messages can be a bit confusing sometimes, but\
    \ they tell you what is wrong with your code and how to fix it.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_45_0.png)\n\
    \n# ## Error alert\n\nIn IDLE, both the editor and shell windows can display an\
    \ error message when something unexpected happens. This message highlights the\
    \ error and shows you which line of code to find it in.\n\n# ▽ Messages in Command\
    \ Prompt/Terminal\n\nError messages in Pygame Zero are shown in the Command Prompt\
    \ or Terminal window. When an error is discovered, the program will stop running\
    \ and will tell you what the error is and where to look for it in the code.\n\n\
    ```\n```text\nFile \"/Library/Frameworks/Python.framework/Versions/3.6/bin/python\"\
    , line 11, in <module>\n    load_game(...)\nFile \"/Library/Frameworks/Python.framework/Versions/3.6/lib/python3.6/site-packages/\n\
    pygame/runner.py\", line 87, in main\n    exec(code, mod.__dict__)\n         \
    \                     The error is on line 2.\nFile \"score.py\", line 2, in <module>\n\
    \    print(\"Game Over! Score \" + score)\n                              This\
    \ is a type error.\nTypeError: must be str, not int\n```\n```\n\n# EXPERT TIPS\n\
    \n# ## Catching bugs\n\nWhen you see an error in the Command Prompt (Windows)\
    \ or Terminal (Mac), look at the line number. Go back to your code in IDLE and\
    \ click anywhere in the file. The line number will be displayed at the bottom-right\
    \ corner of the screen—for example, Ln: 12. Then use the **Up** or **Down** arrow\
    \ to find the line with the error in it.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_45_1.png)"
