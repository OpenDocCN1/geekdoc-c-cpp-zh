  md: "# ### 13. Add a new function\n\nWhen you ran the program just then, you probably\
    \ noticed that nothing happened when you clicked on the dots. To fix this, add\
    \ the `on_mouse_down(pos)` function under the code from Step 10.\n\n```\n```python\n\
    def on_mouse_down(pos):\n    global next_dot\n    global lines\n```\n```\n\nYou\
    \ have to add this code to let the function change the values of the global variables\
    \ `next_dot` and `lines`.\n\n# ### 14. Connect the dots\n\nYou now need to make\
    \ the dots respond to the mouse clicks. Add these lines under `def on_mouse_down(pos)`\
    \ from Step 13.\n\n```\n```python\nglobal lines\nif dots[next_dot].collidepoint(pos):\n\
    \    if next_dot:\n        lines.append((dots[next_dot - 1].pos, dots[next_dot].pos))\n\
    \        next_dot = next_dot + 1\n    else:\n        lines = []\n        next_dot\
    \ = 0\n```\n```\n\nThis line checks if the player has clicked on the next dot\
    \ in the sequence.\n\nThis line checks if the player has already clicked on the\
    \ first dot.\n\nThis sets `next_dot` to the next number.\n\nThis draws a line\
    \ between the current dot and the previous one.\n\nIf the player clicks on the\
    \ wrong dot, this sets the `next_dot` back to the first one and deletes all the\
    \ lines.\n\n# ### 15. Time to connect\n\nAnd it’s done! Now that you’ve finished\
    \ writing the code, save it and run it from the command line to start playing.\
    \ Don’t forget, you need to connect all the dots as fast as you can!\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_78_0.png)\n\
    \n# ## EXPERT TIPS\n### Collisions\n\nYou can use the `collidepoint()` function\
    \ to check if the position of the mouse click matches the position of an Actor.\n\
    \nThis creates an Actor with the dot image.\n\nThis passes the position of the\
    \ mouse click to the `on_mouse_down()` function.\n\n```\n```python\ndot = Actor(\"\
    dot\")\n\ndef on_mouse_down(pos):\n    if dot.collidepoint(pos):\n        print(\"\
    Ouch\")\n```\n```\n\nIf the mouse click position and the dot position match, “Ouch”\
    \ is printed in the shell."
