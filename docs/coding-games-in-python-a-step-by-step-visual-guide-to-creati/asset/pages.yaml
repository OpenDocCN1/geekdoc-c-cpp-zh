  md: "# 32. Update the fangflowers\n\nIt’s time for the fangflowers to start moving.\
    \ The code in this step will be called every time the `update()` function runs.\
    \ It will also keep the fangflowers inside the garden by making them bounce off\
    \ the edges of the game screen. Replace `pass` under `def update_fangflowers()`\
    \ from Step 29 with this code. There’s a lot of tricky code here, so type it in\
    \ carefully.\n\n```\n```python\ndef update_fangflowers():\n    global fangflower_list,\
    \ game_over\n    if not game_over:\n        index = 0\n        for fangflower\
    \ in fangflower_list:\n            fangflower_vx = fangflower_vx_list[index]\n\
    \            fangflower_vy = fangflower_vy_list[index]\n            fangflower.x\
    \ = fangflower.x + fangflower_vx\n            fangflower.y = fangflower.y + fangflower_vy\n\
    \            if fangflower.left < 0:\n                fangflower_vx_list[index]\
    \ = -fangflower_vx\n            if fangflower.right > WIDTH:\n               \
    \ fangflower_vx_list[index] = -fangflower_vx\n            if fangflower.top <\
    \ 150:\n                fangflower_vy_list[index] = -fangflower_vy\n         \
    \   if fangflower.bottom > HEIGHT:\n                fangflower_vy_list[index]\
    \ = -fangflower_vy\n            index = index + 1\n    return\n```\n```\n\nThese\
    \ are the global variables used in this function.\n\nThis loops over all the fangflowers\
    \ in the list.\n\nThese get the x and y velocities of the fangflower.\n\nThese\
    \ get the new position of the fangflower.\n\nThis variable helps the program keep\
    \ track of which item in the list it’s dealing with.\n\nIf the fangflower touches\
    \ the left edge of the screen, this will make it start moving to the right.\n\n\
