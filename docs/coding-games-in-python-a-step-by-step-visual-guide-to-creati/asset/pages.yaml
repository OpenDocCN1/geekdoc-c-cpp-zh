  md: "# Mutation\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_170_0.png)\n\nIt's time\
    \ for your harmless flowers to turn into carnivorous fangflowers. Even worse,\
    \ the code will change one random flower into a fangflower every 20 seconds after\
    \ the first mutation. Replace pass under the mutate() method with the code below.\
    \ There's a lot of code to add here, so be extra careful.\n\nThese three lists\
    \ will store the velocities of a particular fangflower at the same index number.\n\
    \n| index | 0 | 1 | 2 | 3 |\n|---|---|---|---|---|\n| fangflower_list | fangflower\
    \ | fangflower | fangflower | fangflower |\n| fangflower_vx_list | 2 → | 0 | −1\
    \ ← | 3 → |\n| fangflower_vy_list | −3 ↑ | 1 ↓ | 0 | 2 ↓ |\n\nIf the game is not\
    \ over and there are still flowers left to mutate, this block of code will run.\n\
    \nThese are the global variables needed in this function.\n\n```\n```python\n\
    def mutate():\n    global fangflower_list, fangflower_vx_list, fangflower_vy_list\n\
    \    global fangflower_vx_list, game_over\n    if not game_over and flower_list:\n\
    \        rand_flower = randint(0, len(flower_list) - 1)\n        fangflower_pos_x\
    \ = flower_list[rand_flower].x\n        fangflower_pos_y = flower_list[rand_flower].y\n\
    \        del flower_list[rand_flower]\n        fangflower = Actor(\"fangflower\"\
    )\n        fangflower.pos = fangflower_pos_x, fangflower_pos_y\n        fangflower_vx\
    \ = velocity()\n        fangflower_vy = velocity()\n        fangflower = fangflower_list.append(fangflower)\n\
    \        fangflower_vx_list.append(fangflower_vx)\n        fangflower_vy_list.append(fangflower_vy)\n\
    \        clock.schedule(mutate, 20)\n    return\n```\n```\n\nThis line picks a\
    \ random flower to mutate.\n\nThis line removes the mutated flower from the list\
    \ of flowers.\n\nThis line sets the fangflower at the same position as the flower\
    \ it mutated from.\n\nThis sets how fast the fangflower is moving left or right\
    \ on the screen.\n\nThis sets how fast the fangflower is moving up or down on\
    \ the screen.\n\nThe fangflower's velocities are added to these lists.\n\nThis\
    \ line schedules a call to mutate a flower every 20 seconds.\n\nThis adds a new\
    \ fangflower to the list of fangflowers."
