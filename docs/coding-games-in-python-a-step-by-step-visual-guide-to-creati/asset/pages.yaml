  md: '# Type errors


    These errors occur when you put the wrong type of data in the code. For example,
    if the code is expecting a number but you give it a string, it won’t work.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_47_0.png)


    ```

    ```python

    lives_remaining = lives_remaining - "one"

    ```

    ```


    This keeps track of the number of lives a player is left with.


    lives_remaining stores whole numbers, or integers, so it doesn’t make sense to
    minus the string “one” from it. You need to use the digit 1 instead.


    ```

    ```python

    score = 100 > "high_score"

    ```

    ```


    It doesn’t make sense to check if a number is greater than a string, because they
    are different data types.


    Removing the quotation marks around high_score would make this code work properly.


    ```

    ```python

    players = ["Martin", "Craig", "Claire", "Daniel"]

    find_highest_score(players)

    ```

    ```


    This function expects a list of integers, but instead it has been assigned a list
    of strings representing players’ names.


    # Examples of type errors


    Type errors occur when you code something that doesn’t make sense. Subtracting
    a string from a number, comparing different data types, or trying to find the
    highest number in a list of strings are all type errors.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_47_1.png)


    # Name errors


    A name error occurs when you try to use a variable or function that hasn’t been
    created yet. To avoid this, you must remember to define all variables and functions
    before using them.


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_47_2.png)


    # ▷ Example of a name error


    This code will give you a name error if you try to display the contents of a variable
    before creating it. Remember, you need to create the variable first.


    ```

    ```python

    print("Welcome " + player_name)

    player_name = "Martin"

    ```

    ```


    You need to assign “Martin” to the variable player_name first.'
