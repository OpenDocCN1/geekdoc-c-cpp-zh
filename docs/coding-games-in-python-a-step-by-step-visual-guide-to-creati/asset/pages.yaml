- pgno: 29
  md: "# # Creating variables\n\nVariables are used to store and label pieces of information.\
    \ You’ll use them a lot in your code—for example, to hold your current score or\
    \ keep track of how many lives you have left.\n\n# ## How to create a variable\n\
    \nYou need to give each variable a name that describes what data is stored inside\
    \ it. What the variable stores is called its value. Type the name followed by\
    \ an equals sign, then type the value, with a space between each part. This is\
    \ called “assigning a value” to the variable.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_29_0.png)\n\
    \n# ### Storage box\n\nA variable is like a box with a name label. You can store\
    \ data in the box and then use it many times to find the data again when you need\
    \ to use it.\n\n+   1. **Assign a value**  \n+      Open IDLE’s shell window.\
    \ Type this line of code to create a variable called `score` and assign a value\
    \ to it.\n\n```\n```python\n>>> score = 0\n```\n```\n\nThis is the variable’s\
    \ name.\n\nThis is the value stored in the variable.\n\n+   2. **Print the value**\
    \  \n+      Now type `print(score)` into the window after the code you typed in\
    \ Step 1. Press **Enter** to see what happens.\n\n```\n```python\n>>> score =\
    \ 0\n>>> print(score)\n0\n```\n```\n\nThis is the value of score.\n\nThe `print()`\
    \ function displays the value of the variable in the parentheses.\n\n# ## EXPERT\
    \ TIPS\n### Naming variables\n\nAlways choose a meaningful name for each variable\
    \ in your programs. For example, a variable for tracking the number of attempts\
    \ a player has left could be called `attempts_remaining`, rather than just `attempts`\
    \ or `a`. Variable names can contain letters, numbers, and underscores, but they\
    \ should always start with a letter. Follow these rules and you won’t go wrong.\n\
    \n+   **Dos and don’ts**\n+   \n+   - Always start the variable’s name with a\
    \ letter.\n+   - Any letter or number can be used in the name.\n+   - Symbols\
    \ such as `-`, `/`, `#`, `@` aren’t allowed.\n+   - Do not use spaces. An underscore\
    \ (`_`) can be used instead.\n+   - Uppercase (capital) and lowercase letters\
    \ are different. Python will treat `Score` and `score` as two different variables.\n\
    +   - Avoid words that are used in Python or Pygame Zero as commands, such as\
    \ “function” or “screen”."
  merge: -1
