  md: "# How to build  \nShoot the Fruit\n\nThis simple shooting game is a fun way\
    \ to practice your aim. When the apple appears, click on it to “shoot” it. Aim\
    \ carefully though, because if you miss, the game is over!\n\n# What happens\n\
    \nWhen the game starts, an apple appears on the screen for you to “shoot”. If\
    \ you hit it, a “Good shot!” message pops up, and the apple appears at another\
    \ point on the screen. But if you miss, a “You missed!” message is shown, and\
    \ the game ends.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_51_0.png)\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_51_1.png)\n\
    \nThe default color of the game screen is black.\n\nYou can customize your game\
    \ by changing the fruit that appears on the screen.\n\n△ Aim... Fire!  \nYou need\
    \ to stay alert at all times while playing this game. Lose your focus and you\
    \ may miss the shot!"
