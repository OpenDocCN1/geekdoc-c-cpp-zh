  md: "# Syntax errors\n\nThe structure of statements used in a coding language is\
    \ known as syntax. A syntax error means that you've typed something wrong. You\
    \ could have missed a part of a statement or misspelled a word. Syntax errors\
    \ are the easiest mistakes to fix. Go to the line with the error and change what\
    \ you've mistyped.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_46_0.png)\n\n#\
    \ ▷ Mistakes to watch out for\n\n+   - Do your opening and closing parentheses\
    \ match?\n+   - Are you missing a quotation mark?\n+   - Have you spelled everything\
    \ correctly?\n+   - These are the main causes of syntax errors.\n\n```\nprint(score\n\
    ```\n\nThe closing parenthesis is missing.\n\n```\nhorse = Actor(\"horse)\n```\n\
    \nThe closing quotation mark is missing.\n\n```\nhrse.draw()\n```\n\nThis is a\
    \ spelling mistake. It's supposed to be referencing the variable named “horse”,\
    \ so it should be horse.draw().\n\n# Indentation errors\n\nPython uses indentation\
    \ to show where blocks of code begin and end. Indentation errors are displayed\
    \ if you make a mistake with the structure of the code. If a line of code ends\
    \ with a colon, you must indent the next line. Python automatically indents after\
    \ colons, but you can also do it manually by adding four spaces.\n\n```\nif play:\n\
    horse.draw()\n```\n\nNot leaving any spaces here will cause an indentation error.\n\
    \n```\nif play:\n    horse.draw()\n```\n\nIndenting the code by adding four spaces\
    \ will fix this error.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_46_1.png)\n\
    \n# 〈 Indent each new block\n\nPython programs usually have blocks of code within\
    \ other blocks, such as an if statement inside a loop. Every line in a block must\
    \ be indented by the same amount. This can be done for each indent by pressing\
    \ the Space bar four times. Even though Python automatically indents after colons,\
    \ you should get used to checking if the indentation is correct."
  merge: -1
  img_proc: true
