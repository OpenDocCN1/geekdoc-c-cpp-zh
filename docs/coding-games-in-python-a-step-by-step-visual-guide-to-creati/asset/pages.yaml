  md: "# # Glossary\n\n**animation**  \nA process in which images are displayed one\
    \ after another to make it look like something’s moving.\n\n**Boolean expression**\
    \  \nA statement that is either True or False, leading to two possible outcomes.\n\
    \n**branch**  \nA point in a program where different options are available to\
    \ choose from.\n\n**bug**  \nAn error in a program’s code that makes it behave\
    \ in an unexpected way.\n\n**call**  \nTo use a function in a program.\n\n**command\
    \ line**  \nThe screen that lets you enter commands into the Command Prompt or\
    \ Terminal window.\n\n**Command Prompt**  \nAn application on Windows computers\
    \ that allows a user to enter and execute commands.\n\n**comment**  \nA text note\
    \ added to a program that makes the code easier to understand and is ignored by\
    \ the program when it runs.\n\n**condition**  \nA “True or False” statement used\
    \ to make a decision in a program. See also *Boolean expression*.\n\n**constant**\
    \  \nA variable whose value should stay the same throughout a program. Programmers\
    \ use capital letters when naming constants to let other programmers know that\
    \ their values should not be changed. See also *variable*.\n\n**coordinates**\
    \  \nA pair of numbers that pinpoint an exact location. Usually written as (x,\
    \ y).\n\n**data**  \nInformation, such as text, symbols, and numerical values.\n\
    \n**dictionary**  \nA collection of data items stored in pairs, such as countries\
    \ and their capital cities.\n\n**debug**  \nTo look for and correct errors in\
    \ a program.\n\n**encryption**  \nA way of encoding data so that only certain\
    \ people can read or access it.\n\n**event**  \nSomething a computer program can\
    \ react to, such as a key being pressed or the mouse being clicked.\n\n**file**\
    \  \nA collection of data stored with a name.\n\n**flag variable**  \nA variable\
    \ that can take two states, such as True and False.\n\n**float**  \nA number with\
    \ a decimal point in it.\n\n**flowchart**  \nA diagram that shows a program as\
    \ a sequence of steps and decisions.\n\n**function**  \nCode that carries out\
    \ a specific task. Also called a procedure, subprogram, or subroutine.\n\n**global\
    \ variable**  \nA variable that can be used throughout every part of a program.\
    \ See also *local variable*.\n\n**graphics**  \nVisual elements on a screen, such\
    \ as text, pictures, icons, and symbols.\n\n**GUI**  \nThe GUI, or graphical user\
    \ interface, is the name for the buttons and windows that make up the part of\
    \ a program you can see and interact with.\n\n**hack**  \nAn ingenious change\
    \ to code that makes it do something new or simplifies it. (Also, accessing a\
    \ computer without permission.)\n\n**hacker**  \nA person who breaks into a computer\
    \ system. “White hat” hackers work for computer security companies and look for\
    \ problems in order to fix them. “Black hat” hackers break into computer systems\
    \ to cause harm or to make profit from them.\n\n**indent**  \nWhen a block of\
    \ code is placed farther to the right than the previous block. An indent is usually\
    \ four spaces. Every line in a particular block of code must be indented by the\
    \ same amount.\n\n**index number**  \nA number given to an item in a list. In\
    \ Python, the index number of the first item will be 0, the second item 1, and\
    \ so on."
