  md: "# 15. Create a list for the questions\n\nNext you need to add some code to\
    \ keep the questions in order. You can do this using a list, just like you did\
    \ for the answer boxes in Step 8. Add this line under the code from Step 14.\n\
    \n```\nq5 = [\"Where are the pyramids?\",\n     \"India\", \"Egypt\", \"Morocco\"\
    , \"Canada\", 2]\n```\n\n```\nquestions = [q1, q2, q3, q4, q5]\n```\n\nThis lists\
    \ all the questions.\n\n# 16. Add a function\n\nIn a real-life quiz, the quizmaster\
    \ begins by picking up the first question from the top of a list. In Python, you\
    \ can do the same thing by using the pop() function. This function removes the\
    \ first item from the list, which makes the second item move to the top of the\
    \ list. So in your code, pop() will remove q1, and q2 will take its place. Type\
    \ this code next.\n\n```\nquestions = [q1, q2, q3, q4, q5]\nquestion = questions.pop(0)\n\
    ```\n\nThis gets the first question from the questions list and stores it in a\
    \ variable called question.\n\n> **EXPERT TIPS**\n> \n> ### Pop the stack\n> \n\
    > When you place items in a list, Python stacks them on top of each other. The\
    \ first item in the list appears at the top of the stack. Using the pop() function\
    \ removes an item from the top of the stack.\n\n# 17. Display the boxes\n\nNow\
    \ you need to update the draw() function to display the questions and the timer\
    \ on the screen. Use a for loop to draw the possible answers inside the answer\
    \ boxes. Add this code to the draw() function under what you typed in Step 9.\n\
    \n```\nscreen.draw.filled_rect(main_box, \"sky blue\")\nscreen.draw.filled_rect(timer_box,\
    \ \"sky blue\")\n\nfor box in answer_boxes:\n    screen.draw.filled_rect(box,\
    \ \"orange\")\n\nscreen.draw.textbox(str(time_left), timer_box, color=(\"black\"\
    ))\nscreen.draw.textbox(question[0], main_box, color=(\"black\"))\n\nindex = 1\n\
    for box in answer_boxes:\n    screen.draw.textbox(question[index], box, color=(\"\
    black\"))\n    index = index + 1\n```\n\nThis line displays the number of seconds\
    \ remaining in the timer box.\n\nThis displays the question in the main box.\n\
    \nThese lines draw each possible answer in an answer box."
  merge: -1
  img_proc: true
