  md: "# # Playing with loops\n\nWhen you’re coding a game, you often need to run\
    \ the same bit of code several times, but it would be pretty boring if you had\
    \ to type it in every single time. Luckily, you can use a loop to run the same\
    \ block of code over and over again. There are many different types of loops.\n\
    \n# ## “For” loops\n\nWhen you know exactly how many times you want a loop to\
    \ repeat, you can use a for loop. In this example, the code prints “You are the\
    \ high scorer!” ten times. Try out the code for yourself in the shell window.\n\
    \n```\n```python\n>>> for count in range(1, 11):\n        print(\"You are the\
    \ high scorer!\")\n```\n```\n\nThis is the loop variable.\n\nThe code that gets\
    \ repeated is known as the “loop body.”\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_37_0.png)\n\
    \n# ### Loop variable\n\nThe loop variable keeps track of how many times the loop\
    \ has run so far. At the start of the loop, it’s equal to the first number in\
    \ the range. The second time around, it’s equal to the second number in the range,\
    \ and so on. Once it completes the second-to-last number in the range, the loop\
    \ stops.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_37_1.png)\n\n# ### Loop body\n\
    \nThe block of code that gets repeated in a loop is called the loop body. You\
    \ must always indent the commands in the body four spaces from the beginning of\
    \ the line that starts the for loop.\n\n# ## EXPERT TIPS\n### Range\n\nIn Python,\
    \ the word range followed by two numbers in parentheses stands for “all the numbers\
    \ in the list from the first number to the second-to-last number.” Therefore,\
    \ range(1, 5) contains the numbers 1, 2, 3, and 4, but not 5, so the loop runs\
    \ four times.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_37_2.png)"
  merge: -1
  img_proc: true
- pgno: 38
  md: "# ## Looping over a list\n\nGaming programs often use a collection of items\
    \ grouped together in a list. If you want to do something with each item on the\
    \ list, you can use a `for` loop.\n\n> > Page 31 will help you out with lists.\n\
    \n![](img/3188b147f991a51de14dcd2bb4b4c42e_38_0.png)\n\n# ### Listing robots\n\
    \nIn this example, there is a list that contains the names of three robots that\
    \ the player has to escape from in a game.\n\n```\n```python\n>>> robots = [\"\
    Bing\", \"Bleep\", \"Bloop\"]\n>>> for robot in robots:\n    print(\"I am a robot.\
    \ My name is \" + robot)\n```\n```\n\nPython will add one of the robots’ names\
    \ here.\n\nrobot is a temporary variable that moves along the robots list each\
    \ time the loop runs.\n\n# ### How it works\n\nWe create a temporary variable\
    \ called robot that holds a single item in the list. The value in robot is updated\
    \ each time around the loop, so that it holds Bing, then Bleep, and finally Bloop.\
    \ Once it reaches the end of the list, the loop stops.\n\n# ## Looping over two\
    \ lists\n\nPython can loop through a list from start to finish more or less automatically.\
    \ But if you want to loop through two lists at once, you need to use an extra\
    \ variable to tell Python to move through both lists.\n\n![](img/3188b147f991a51de14dcd2bb4b4c42e_38_1.png)\n\
    \n# ### Robots with colors\n\nIn this example, we have two lists. One is called\
    \ robots and holds the names of the robots. The other is called colors and tells\
    \ you the color of each robot. This program uses a variable called index to move\
    \ through both lists, printing out each robot’s name and also what color it is.\n\
    \nindex will help Python move through both lists in order.\n\nThis line updates\
    \ index so Python moves through the lists with each loop.\n\n```\n```python\n\
    >>> robots = [\"Bing\", \"Bleep\", \"Bloop\"]\n>>> colors = [\"red\", \"orange\"\
    , \"purple\"]\n>>> index = 0\n>>> for each in robots:\n    print(\"My name is\
    \ \" + robots[index] + \" I am \" + colors[index])\n    index = index + 1\n```\n\
    ```\n\nThe index variable keeps track of the position each list is at."
  merge: -1
  img_proc: true
- pgno: 39
  md: '![](img/3188b147f991a51de14dcd2bb4b4c42e_39_0.png)


    # ### How it works


    `robots[index]` and `colors[index]` both use the value of `index` to decide which
    item in their list to print. Since `index` is set to 0 to begin with, both lists
    will start with the first item—remember the first position in Python lists is
    always 0, not 1. Since Bing is at position 0 of the list robots and red is at
    position 0 of the list colors, that means Bing is red. Each time the loop runs,
    it adds 1 to `index`, moving each list onto the next item, so Bleep will be orange
    and Bloop will be purple. The loop will continue until it reaches the end of the
    lists.


    # ## “While” loops


    Sometimes, while coding a program, you might not know exactly how many times you
    want a loop to repeat. Don’t worry! In this case, you can use a while loop.


    # ### Loop condition


    A while loop includes a question whose answer can either be `True` or `False`.
    This is called a loop condition. The while loop will only start if the answer
    to the loop condition is `True`. Imagine you are playing a game where a castle
    is guarded by a dragon that checks if you have the magic key. “Do you have the
    magic key?” would be the loop condition and the castle would be the loop body.
    If you have the magic key, the loop condition is `True` and you can enter the
    castle. But if you don’t have the key, the loop condition is `False`, so you can’t
    get into the loop!


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_39_1.png)


    > > Dude, when are we supposed to stop?


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_39_2.png)


    > > Nobody enters without the magic key!


    # ### EXPERT TIPS


    # ### Indentation error


    Just like the `for` loop, the code in the body of a `while` loop must be four
    spaces further in than the line starting the loop. If you don’t do this, Python
    will show an error message saying “unexpected indent.”


    ![](img/3188b147f991a51de14dcd2bb4b4c42e_39_3.png)'
  merge: -1
