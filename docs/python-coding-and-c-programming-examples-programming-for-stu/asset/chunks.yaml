    from datetime import date\n# creating the date object of today's date\ncurrent_date\
    \ = date.today()\n# printing the current date\nprint(\"Current date: \", current_date)\n\
    # extracting the year, month and day\nprint(\"Current year:\", current_date.year)\n\
    print(\"Current month:\", current_date.month)\nprint(\"Current day:\", current_date.day)\n\
    ```\nOUTPUT\nCurrent date: 2020-07-30\nyear: 2020\nmonth: 7\nday: 30\n\n---\n\n\
    # Python Lists\n\n## For Adding, removing elements in the list\n\n### `append()`\
    \ Method\nIt is used to add / append an item to the list (that will be passed\
    \ as parameter).\n\n### Syntax\n`list.append(element)`\n\n```python\n# Declaring\
    \ a list with integer and string elements\nlist = [10, 20, 30, \"New Delhi\",\
    \ \"Mumbai\"]\n# printing list\nprint \"List elements are: \", list\n# adding\
    \ elements\nlist.append(40)\nlist.append(50)\nlist.append(\"Chennai\")\n# printing\
    \ list after adding elements\nprint \"List elements: \", list\n```\nOutput\nList\
    \ elements are: [10, 20, 30, 'New Delhi', 'Mumbai']\nList elements are: [10, 20,\
    \ 30, 'New Delhi', 'Mumbai', 40, 50, 'Chennai']\n\n### `pop()` Method\nUsing this\
    \ to remove / pop an item from the list.\n\n### Syntax\n`list.pop()`\n\n```python\n\
    # Declaring a list with integer and string elements\nlist = [10, 20, 30, \"New\
    \ Delhi\", \"Mumbai\"]\n# printing list\nprint \"List elements are: \", list\n\
    # adding elements\nlist.append(40)\nlist.append(50)\nlist.append(\"Chennai\")\n\
    # printing list after adding elements\nprint \"List elements: \", list\n# removing\
    \ elements\nlist.pop()\n# printing list after removing elements\nprint \"List\
    \ elements: \", list\n```\nOutput\nList elements are: [10, 20, 30, 'New Delhi',\
    \ 'Mumbai']\nList elements are: [10, 20, 30, 'New Delhi', 'Mumbai', 40, 50, 'Chennai']\n\
    List elements are: [10, 20, 30, 'New Delhi', 'Mumbai', 40, 50]\n\n---\n\n## Program\
    \ to find the differences of two lists\n\nGiven two integer lists, we will find\
    \ the differences, i.e. the elements that not exist in the second lists.\n\n###\
    \ Example\nInput:\nList1 = [10, 20, 30, 40, 50]\nList2 = [10, 20, 30, 60, 70]\n\
    Output:\nDifferent elements:[40, 50]\n\n### Program\n```python\n# list1 - first\
    \ list of the integers\n# lists2 - second list of the integers\nlist1 = [10, 20,\
    \ 30, 40, 50]\nlist2 = [10, 20, 30, 60, 70]\n# printing lists\nprint \"list1:\"\
    , list1\nprint \"list2:\", list2\n# finding and printing differences of the lists\n\
    print \"Difference elements:\"\nprint (set(list1) - set(list2))\n```\nOutput\n\
    list1: [10, 20, 30, 40, 50]\nlist2: [10, 20, 30, 60, 70]\nDifference elements:\
    \ [40, 50]\n\n### Program 2\nWith mixed element type, print 1) the elements that\
    \ do not exist in list 2 and 2) those that not exist in list 1.\n```python\n#\
    \ list1 - first list with mixed type elements\n# lists2 - second list with mixed\
    \ type elements\nlist1 = [\"Amit\", \"Shukla\", 21, \"New Delhi\"]\nlist2 = [\"\
    Aman\", \"Shukla\", 21, \"Mumbai\"]\n# printing lists\nprint \"list1:\", list1\n\
    print \"list2:\", list2\n# finding and printing differences of the lists\nprint\
    \ \"Elements not exists in list2:\"\nprint (set(list1) - set(list2))\nprint \"\
    Elements not exists in list1:\"\nprint (set(list2) - set(list1))\n```\nOutput\n\
    list1: ['Amit', 'Shukla', 21, 'New Delhi']\nlist2: ['Aman', 'Shukla', 21', 'Mumbai']\n\
    Elements not exists in list2: ['Amit', 'New Delhi']\nElements not exists in list1:\
    \ ['Aman', 'Mumbai']\n\n---\n\n## Program to remove duplicate elements from the\
    \ list\n\n### Example\nInput:\nlist1: [10, 20, 10, 20, 30, 40, 30, 50]\nOutput:\n\
    List after removing duplicate elements\nlist2: [10, 20, 30, 40, 50]\n\n### Logic\n\
    It is too easy to implement the program by adding elements one by one to another\
    \ list by checking whether or not element is available in the new list. Let's\
    \ assume that 20 is available in list 1 three times, and when we add 20 (first\
    \ occurrence) to list 2, it will be added, but when we add 20 (second occurrence)\
    \ to list 2, condition will be false and element will not be added to list. And\
    \ finally, without duplicate elements we'll get list.\n\n### Program\n```python\n\
    # declare list\nlist1 = [10, 20, 10, 20, 30, 40, 30, 50]\n# creating another list\
    \ with unique elements\nlist2 = []\n# appending elements\nfor n in list1:\n  \
    \  if n not in list2:\n        list2.append(n)\n# printing the lists\nprint \"\
    Original list\"\nprint \"list1:\", list1\nprint \"List after removing duplicate\
    \ elements\"\nprint \"list2:\", list2\n```\nOutput\nOriginal list\nlist1: [10,\
    \ 20, 10, 20, 30, 40, 30, 50]\nList after removing duplicate elements\nlist2:\
    \ [10, 20, 30, 40, 50]\n\n---\n\n## Program (By User defines function)\n\n###\
    \ Function to remove duplicates\n```python\ndef removeDuplicates (list1):\n  \
    \  # declare another list\n    list2 = []\n    # appending elements\n    for n\
    \ in list1:\n        if n not in list2:\n            list2.append(n)\n    return\
    \ list2\n\n# Main code\n# declare a list\nlist1 = [10, 20, 10, 20, 30, 40, 30,\
    \ 50]\n# print the list\nprint \"Original list: \", list1\nprint \"List after\
    \ duplicate remove: \", removeDuplicates(list1)\n```\nOutput\nOriginal list: [10,\
    \ 20, 10, 20, 30, 40, 30, 50]\nList after duplicate remove: [10, 20, 30, 40, 50]\n\
    \n---\n\n# Create three lists of numbers, their squares and cubes\n\n### Example\n\
