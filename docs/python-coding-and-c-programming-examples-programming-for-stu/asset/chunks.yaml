    ## ASCII value of character in Python

    In python, we use the function `ord()` to obtain an ASCII code of a character.
    `ord()` accepts a character, returns its ASCII value.


    Syntax: `ord(character)`


    Example:

    Input: `char_var = ''A''`

    Function call: `ord(char_var)`

    Output: `65`


    ### python program to print ASCII# value of a given character

    ```python

    # Assigning character to a variable

    char_var = ''A''

    # printing ASCII code

    print("ASCII value of " + char_var + " is = ", ord(char_var))


    char_var = ''x''

    # printing ASCII code

    print("ASCII value of " + char_var + " is = ", ord(char_var))


    char_var = ''9''

    # printing ASCII code

    print("ASCII value of " + char_var + " is = ", ord(char_var))

    ```

    Output:

    ```

    ASCII value of A is =  65

    ASCII value of x is =  120

    ASCII value of 9 is =  57

    ```


    ## Calculate simple interest

    We use the following formula to calculate simple interest,

    `(P * R * T) / 100`


    Where,

    * `P` – Principle amount

    * `R` – Rate of the interest, and

    * `T` – Time in the years

