    \ square (num):\n    return (num* num)\n```\n获取立方的函数：\n```python\ndef cube (num):\n\
    \    return (num* num* num)\n```\n\n### 程序\n```python\n# python 程序，用于求给定数字的\n\
    # 平和立方\n# 用户定义方法求平方\ndef square (num):\n    return (num*num)\n\n# 用户定义方法求立方\n\
