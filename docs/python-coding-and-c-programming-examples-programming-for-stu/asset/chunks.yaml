    /*交换存储在 data 变量中的十六进制值的第 1 位和第 2 位*/\nint main() {\n    unsigned char data = 0xA;\
    \ // 十进制值\n    // 从 data 中获取第 1 位\n    unsigned char bit_1 = (data >> 1) & 1;\n\
    \    // 从 data 中获取第 2 位\n    unsigned char bit_2 = (data >> 2) & 1;\n    // 获取\
    \ bit_1 和 bit_2 的异或结果\n    unsigned char xor_of_bit = bit_1 ^ bit_2;\n    printf(\"\
    After swapping the bits, data value is: %X\", data ^ (xor_of_bit << 1 | xor_of_bit\
    \ << 2));\n    return 0;\n}\n```\n交换位后，data 值为：C\n\n## 使用四种方法交换数字程序\n1. 使用第三变量\n\
    2. 不使用第三变量\n3. 使用 异或运算符\n4. 使用简单语句\n\n```c\n//使用四种方法交换数字的 C 程序。\n#include <stdio.h>\n\
    int main() {\n    int a,b,t;\n    printf(\" Enter value of A ?\");\n    scanf(\"\
    %d\",&a);\n    printf(\" Enter value of B ?\");\n    scanf(\"%d\",&b);\n    printf(\"\
    \\n Before swapping : A=%d, B=%d\",a,b);\n\n    /*第一种方法：使用第三变量*/\n    t=a;\n \
    \   a=b;\n    b=t;\n    printf(\"\\n After swapping (First method) : A=%d, B=%d\"\
    ,a,b);\n\n    /*第二种方法：不使用第三变量*/\n    a=a+b;\n    b=a-b;\n    a=a-b;\n    printf(\"\
    \\n After swapping (second method) : A=%d, B=%d\",a,b);\n\n    /*第三种方法：使用异或*/\n\
    \    a^=b;\n    b^=a;\n    a^=b;\n    printf(\"\\n After swapping (third method)\
    \ : A=%d, B=%d\",a,b);\n\n    /*第四种方法（单语句）*/\n    a=a+b-(b=a);\n    printf(\"\\\
    n After swapping (fourth method) : A=%d, B=%d\",a,b);\n    return 0;\n}\n```\n\
    Output:\nEnter value of A ? 100\nEnter value of B ? 200\nBefore swapping : A=100,\
    \ B=200\nAfter swapping (First method) : A=200, B=100\nAfter swapping (second\
    \ method) : A=200, B=100\nAfter swapping (third method) : A=200, B=100\nAfter\
    \ swapping (fourth method) : A=200, B=100\n\n## 年龄计算器（计算年龄的 C 程序）\n```c\n/*年龄计算器（计算年龄的\
    \ C 程序）。*/\n#include <stdio.h>\n#include <time.h>\n/*检查年份是否为闰年*/\nint isLeapYear(int\
    \ year, int mon) {\n    int flag = 0;\n    if (year % 100 == 0) {\n        if\
    \ (year % 400 == 0) {\n            if (mon == 2) {\n                flag = 1;\n\
    \            }\n        }\n    } else if (year % 4 == 0) {\n        if (mon ==\
    \ 2) {\n            flag = 1;\n        }\n    }\n    return (flag);\n}\n\nint\
    \ main() {\n    int flag = 0;\n    time_t t;\n    struct tm *info;\n    int year,\
    \ month, day;\n    /*输入生日*/\n    printf(\"Enter birth date (DD/MM/YYYY): \");\n\
    \    scanf(\"%d/%d/%d\", &day, &month, &year);\n    /*检查是否闰年*/\n    if (isLeapYear(year,\
    \ month)) {\n        flag = 1;\n    }\n    /*获取当前时间*/\n    t = time(NULL);\n \
    \   info = localtime(&t);\n    /*计算年龄*/\n    int age = (1900 + info->tm_year)\
    \ - year;\n    if (info->tm_mon + 1 < month || (info->tm_mon + 1 == month && info->tm_mday\
    \ < day)) {\n        age--;\n    }\n    printf(\"Your age is: %d\\n\", age);\n\
    \    return 0;\n}\n```\n\n## 计算利息的 C 程序\n```c\n/*计算利息的 C 程序.*/\n#include <stdio.h>\n\
