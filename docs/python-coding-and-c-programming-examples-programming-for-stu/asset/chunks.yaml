    \ 70 90]]\nmat2...\n[[10 20 30]\n [40 50 60]\n [70 80 90]]\n\n---\n\n# Python\
    \ Date & Time Programs\n\n## Python program to print current hour, minute, second\
    \ and microsecond\n\n### Steps\n1. Import the `datetime` class, from “datetime\
