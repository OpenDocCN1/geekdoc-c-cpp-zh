  trans: "\n\n# 程序：字符串操作\n\n## 声明、赋值字符串 (1)\n使用单引号 `'string'`\n```python\nstr1 = 'Hello\
    \ world, How are you?'\n```\n\n## 声明、赋值字符串 (2)\n使用双引号 `\"string\"`\n```python\n\
    str2 = \"Hello world, How are you?\"\n```\n\n## 声明赋值字符串 (3)\n使用三单引号 `'''string'''`\n\
    ```python\nstr3 = '''Hello world, How are you?'''\n```\n\n## 声明赋值字符串 (4)\n使用三双引号\
    \ `\"\"\"string\"\"\"`\n```python\nstr4 = \"\"\"Hello world, How are you?\"\"\"\
    \n```\n\n## 声明、赋值多行字符串 (5)\n三双引号允许赋值多行字符串\n```python\nstr5 = '''Hello world,How\
    \ are you?'''\n```\n\n## 打印字符串\n```python\nprint \"str1: \", str1\nprint \"str2:\
    \ \", str2\nprint \"str3: \", str3\nprint \"str4: \", str4\nprint \"str5: \",\
    \ str5\n```\n**输出：**\n```\nstr1:  Hello world, How are you?\nstr2:  Hello world,\
    \ How are you?\nstr3:  Hello world, How are you?\nstr4:  Hello world, How are\
    \ you ?\nstr5:  Hello world,How are you?\n```\n\n## 访问并打印字符串中的字符\n**示例：**\n**输入：**\
    \ `str: \"Hello world\"`\n**输出：**\n```\n第一个字符: H\n第二个字符: e\n最后一个字符: d\n倒数第二个字符:\
    \ l\n从索引 0 到 4 的字符: Hello\n以此类推...\n\n# 程序：访问字符串中的字符\n\n## 声明、赋值字符串\n```python\n\
    str = \"Hello world\"\n# 打印完整字符串\nprint \"str:\", str\n# 打印第一个字符\nprint \"str[0]:\"\
    , str[0]\n# 打印第二个字符\nprint \"str[1]:\", str[1]\n# 打印最后一个字符\nprint \"str[-1]:\"\
    , str[-1]\n# 打印倒数第二个字符\nprint \"str[-2]:\", str[-2]\n# 打印从索引 0 到 4 的字符，即前 5 个字符\n\
    print \"str[0:5]:\", str[0:5]\n# 打印从索引 2 到倒数第二个索引的字符\nprint \"str[2,-2]:\", str[2:-2]\n\
    # 逐个字符打印字符串\nprint \"str:\"\nfor i in str:\n    print i,#变量后加逗号\n    # 它不会打印换行\n\
    ```\n**输出：**\n```\nstr: Hello world\nstr[0]: H\nstr[1]: e\nstr[-1]: d\nstr[-2]:\
    \ l\nstr[0:5]: Hell\nstr[2,-2]: llo wor\nstr:H e l l o    w o r l d\n```\n\n##\
    \ 字符串单词及其长度程序\n**示例：**\n**输入：** `str = \"Hello World How are you?\"`\n**输出：**\n\
    ```\nHello ( 5 )\nWorld ( 5 )\nHow ( 3 )\nare ( 3 )\nyou? ( 4 )\n```\n\n### String.split()\
    \ 方法\n为了将字符串拆分为单词，我们使用 `split()` 方法，这是一个内置方法，它根据给定的分隔符将字符串拆分为子字符串（单词）。\n\n**split()\
    \ 方法语法：** `String.split(delimiter)`\n\n**解释：**\n例如有一个字符串 `str = \"ABC PQR XYZ\"\
    `，我们想用空格将其拆分为单词，那么这里的空格就是分隔符。语句为 `str.split(\" \")`，将字符串拆分为单词，然后输出为 `\"ABC\" \"\
    PQR\" \"XYZ.\"`。\n\n## 程序：将字符串拆分为单词并打印单词长度的函数\n```python\ndef splitString (str):\n\
    \    # 按空格拆分字符串\n    str = str.split (' ')\n    # 遍历字符串中的单词\n    for words in\
    \ str:\n        print words,\" (\", len (words), \")\"\n\n# 主代码\n# 声明字符串并赋值\n\
    str = \"Hello World How are you?\"\n# 调用函数\nsplitString(str)\n```\n**输出：**\n```\n\
    Hello  ( 5 )\nWorld  ( 5 )\nHow  ( 3 )\nare  ( 3 )\nyou?  ( 4 )\n```\n\n## 统计字符串中的元音\n\
    **示例：**\n**输入：** `Str = \"Hello world\"`\n**输出：**\n```\n元音总数: 3\n```\n\n## 程序：统计字符串中的元音\n\
    ```python\n# 声明、赋值字符串\nstr = \"Hello world\"\n# 声明计数\ncount = 0\n# 遍历并检查每个字符\n\
    for i in str:\n    # 检查元音条件\n    if( i=='A' or i=='a' or i=='E' or i=='e'\n  \
    \  or i=='I' or i=='i' or i=='O' or i=='o'\n    or i=='U' or i=='u'):\n      \
    \  count +=1;#打印计数\nprint \"Total vowels are: \", count\n```\n**输出：**\n```\n元音总数:\
    \  3\n```\n\n## 使用乘法运算符创建字符串多个副本\n使用乘法运算符创建字符串的多个副本，将使用 `*`。\n\n**示例：**\n**输入：**\
    \ `str1 = \"Hello\"`, `n = 3`\n**逻辑：** `str2 = str1*3`\n\n## 程序：创建 N 个给定字符串的 Python\
    \ 程序\n```python\n# 输入：字符串和 N\nstr1 = \"Hello\"\nn = 3\n# 创建副本\nstr2 = str1 * 3\n\
    # 打印\nprint \"str1: \", str1\nprint \"str2: \", str2\n```\n**输出：**\n```\nstr1:\
    \  Hello\nstr2:  HelloHello\n```\n\n---\n\n# C 语言示例\n## 初学者 C 语言示例\n\n## 求两个数字之和和平均值的\
    \ C 程序\n```c\n/* 求两个数字的和和平均值的 C 语言*/\n#include <stdio.h>\nint main(){\n    int\
    \ a,b,sum;\n    float avg;\n    printf(\"输入第一个数字 :\");\n    scanf(\"%d\",&a);\n\
    \    printf(\"输入第二个数字 :\");\n    scanf(\"%d\",&b);\n    sum=a+b;\n    avg= (float)(a+b)/2;\n\
    \    printf(\"\\n 和为 %d\",a,sum);\n    printf(\"\\n 平均值为 %f\",avg);\n    return\
    \ 0;\n}\n```\n**输出：**\n```\n输入第一个数字 :10\n输入第二个数字 :15\n和为 25\n平均值为 12.500000\n\
