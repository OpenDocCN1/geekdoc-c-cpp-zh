    ## Python 中字符的 ASCII 值

    在 python 中，我们使用 `ord()` 函数来获取字符的 ASCII 码。`ord()` 接受一个字符并返回其 ASCII 值。


    语法：`ord(character)`


    示例：

    输入：`char_var = ''A''`

    函数调用：`ord(char_var)`

    输出：`65`


    ### 打印给定字符 ASCII 值的 Python 程序

    ```python

    # 将字符赋值给变量

    char_var = ''A''

    # 打印 ASCII 码

    print("ASCII value of " + char_var + " is = ", ord(char_var))


    char_var = ''x''

    # 打印 ASCII 码

    print("ASCII value of " + char_var + " is = ", ord(char_var))


    char_var = ''9''

    # 打印 ASCII 码

    print("ASCII value of " + char_var + " is = ", ord(char_var))

    ```

    输出：

    ```

    ASCII value of A is =  65

    ASCII value of x is =  120

    ASCII value of 9 is =  57

    ```


    ## 计算单利

    我们使用以下公式计算单利：

    `(P * R * T) / 100`


    其中，

    * `P` – 本金金额

    * `R` – 利率，以及

    * `T` – 以年为单位的时间


