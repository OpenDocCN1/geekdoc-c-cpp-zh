    \ 2020-07-30 14:43:52.294475\nCurrent hour = 14\nCurrent minute = 43\nCurrent\
    \ second = 52\nCurrent microsecond = 294475\n\n---\n\n## Python code to print\
    \ today's year, month and day\n\nIn the example below – python program is implemented\
    \ to print the current year, month and day.\n\n### CODE\n```python\n# Python program\
