- fmt: "\n# PROGRAM: String Operations\n\n## Declare, assign string (1)\nUsing single\
    \ quotes `'string'`\n```python\nstr1 = 'Hello world, How are you?'\n```\n\n##\
    \ Declare, assign string (2)\nUsing double quotes `\"string\"`\n```python\nstr2\
    \ = \"Hello world, How are you?\"\n```\n\n## Declare assign string (3)\nUsing\
    \ triple single quotes `'''string'''`\n```python\nstr3 = '''Hello world, How are\
    \ you?'''\n```\n\n## Declare assign string (4)\nUsing triple double quotes `\"\
    \"\"string\"\"\"`\n```python\nstr4 = \"\"\"Hello world, How are you?\"\"\"\n```\n\
    \n## Declare, assign multi-line string (5)\nTriple double quotes allows to assign\
    \ multi-line string\n```python\nstr5 = '''Hello world,How are you?'''\n```\n\n\
    ## print the string\n```python\nprint \"str1: \", str1\nprint \"str2: \", str2\n\
    print \"str3: \", str3\nprint \"str4: \", str4\nprint \"str5: \", str5\n```\n\
    **Output:**\n```\nstr1:  Hello world, How are you?\nstr2:  Hello world, How are\
    \ you?\nstr3:  Hello world, How are you?\nstr4:  Hello world, How are you ?\n\
    str5:  Hello world,How are you?\n```\n\n## Access and print characters from the\
    \ string\n**Example:**\n**Input:** `str: \"Hello world\"`\n**Output:**\n```\n\
    First character: H\nSecond character: e\nLast character: d\nSecond last character:\
    \ l\nCharacters from 0th to 4th index: Hello\nAnd, so on...\n\n# PROGRAM: Access\
    \ characters in string\n\n## declare, assign string\n```python\nstr = \"Hello\
    \ world\"\n# print complete string\nprint \"str:\", str\n# print first character\n\
    print \"str[0]:\", str[0]\n# print second character\nprint \"str[1]:\", str[1]\n\
    # print last character\nprint \"str[-1]:\", str[-1]\n# print second last character\n\
    print \"str[-2]:\", str[-2]\n# print characters from 0th to 4th index i.e. first\
    \ 5 characters\nprint \"str[0:5]:\", str[0:5]\n# print characters from 2nd index\
    \ to 2nd last index\nprint \"str[2,-2]:\", str[2:-2]\n# print string character\
    \ by character\nprint \"str:\"\nfor i in str:\n    print i,#comma after the variable\n\
    \    # it does not print new line\n```\n**Output:**\n```\nstr: Hello world\nstr[0]:\
    \ H\nstr[1]: e\nstr[-1]: d\nstr[-2]: l\nstr[0:5]: Hell\nstr[2,-2]: llo wor\nstr:H\
    \ e l l o    w o r l d\n```\n\n## Program to print words with their length of\
    \ a string\n**Example:**\n**Input:** `str = \"Hello World How are you?\"`\n**Output:**\n\
    ```\nHello ( 5 )\nWorld ( 5 )\nHow ( 3 )\nare ( 3 )\nyou? ( 4 )\n```\n\n### String.split()\
    \ Method\nTo split the string into words, we use the method `split()`, an inbuilt\
    \ method that splits the string into sub-string (words) defined by the given delimiter.\n\
    \n**split() Method Syntax:** `String.split(delimiter)`\n\n**EXPLANATION:**\nFor\
    \ example, there's a string `str = \"ABC PQR XYZ\"` and we want to break it into\
    \ words using space to divide it, then space here would be delimiter. The statement\
    \ will be `str.split(\" \")` to break the string into words, and then output will\
    \ be `\"ABC\" \"PQR\" \"XYZ.\"`.\n\n## PROGRAM: Function to split into words and\
    \ print words with its length\n```python\ndef splitString (str):\n    # split\
    \ the string by spaces\n    str = str.split (' ')\n    # iterate words in string\n\
    \    for words in str:\n        print words,\" (\", len (words), \")\"\n\n# Main\
    \ code\n# declare string and assign values\nstr = \"Hello World How are you?\"\
    \n# call the function\nsplitString(str)\n```\n**Output:**\n```\nHello  ( 5 )\n\
    World  ( 5 )\nHow  ( 3 )\nare  ( 3 )\nyou?  ( 4 )\n```\n\n## Count vowels in a\
    \ string\n**Example:**\n**Input:** `Str = \"Hello world\"`\n**Output:**\n```\n\
    Total vowels are: 3\n```\n\n## PROGRAM: count vowels in a string\n```python\n\
    # declare, assign string\nstr = \"Hello world\"\n# declare count\ncount = 0\n\
    # iterate and check each character\nfor i in str:\n    # check the conditions\
    \ for vowels\n    if( i=='A' or i=='a' or i=='E' or i=='e'\n    or i=='I' or i=='i'\
    \ or i=='O' or i=='o'\n    or i=='U' or i=='u'):\n        count +=1;# print count\n\
    print \"Total vowels are: \", count\n```\n**Output:**\n```\nTotal vowels are:\
    \  3\n```\n\n## Create multiple copies of a string by using multiplication operator\n\
    Using multiplication operator to create multiple copies of a string, the multiplication\
    \ operator (`*`) will be used.\n\n**Example:**\n**Input:** `str1 = \"Hello\"`,\
    \ `n = 3`\n**logic:** `str2 = str1*3`\n\n## PROGRAM: Python program to create\
    \ N copies of a given string\n```python\n# define inputs: string and N\nstr1 =\
