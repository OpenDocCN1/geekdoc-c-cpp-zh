    输入利率 : \"))\nt = float(input(\"输入年份（年）: \"))\n# 计算单利\nsi = (p*r*t)/100\n# 打印这些值\n\
    print(\"Principle amount: \", p)\nprint(\"Interest rate    : \", r)\nprint(\"\
    Time in years    : \", t)\nprint(\"Simple Interest : \", si)\n```\n\n### 输出\n\
    **第一次运行：**\n输入本金金额：10000\n输入利率：3.5\n输入年份（年）:1\n本金金额：   10000.0\n利率    ：   3.5\n\
    年份    ：1.0\n单利 ：  350.0\n\n**第二次运行：**\n输入本金金额：250000\n输入利率：36\n输入年份（年）:1\n本金金额：\
    \   250000.0\n利率    ：   36.0\n年份    ：1.0\n单利 ：  90000.0\n\n---\n\n# 复利程序\n\n##\
    \ 计算复利\n我们使用以下公式计算复利：\n`P(1 + R / 100) T`\n其中，\n`P` – 本金金额\n`R` – 利率，以及\n`T` –\
    \ 年份（年）\n\n## 示例：\n输入：\n`p = 250000`\n`r = 36`\n`t = 1`\n`# formulaic`\n`ci =\
    \  p * (pow((1 + r / 100), t))`\n`print(ci)`\n输出：\n`339999.99999999994`\n\n##\
    \ Python 程序\n```python\n# Python program to find compound interest\np = float(input(\"\
    输入本金金额 : \"))\nr = float(input(\"输入利率 : \"))\nt = float(input(\"输入年份（年）: \"))\n\
    # 计算复利\nci =  p * (pow((1 + r / 100), t))\n# 打印这些值\nprint(\"Principle amount \
    \ : \", p)\nprint(\"Interest rate      : \", r)\nprint(\"Time in years     : \"\
    , t)\nprint(\"compound Interest : \", ci)\n```\n\n### 输出\n**第一次运行：**\n输入本金金额：10000\n\
    输入利率：3.5\n输入年份（年）:1\n本金金额：   10000.0\n利率      ：   3.5\n年份     ：1.0\n复利 ：  10350.0\n\
    \n**第二次运行：**\n输入本金金额：250000\n输入利率：36\n输入年份（年）:1\n本金金额：   250000.0\n利率      ： \
    \  36.0\n年份     ：1.0\n复利 ：  339999.99999999994\n\n---\n\n# 闰年程序\n\n## 检查给定年份是否为闰年的\
    \ Python 程序\n闰年是指能被 4 整除的年份，但世纪年（以 00 结尾的年份）除外。世纪年如果能被 400 整除，则为闰年。在这里，用户提供一个年份，我们将测试该年份是否为闰年。\n\
    \n### 1) 使用 calendar 模块\n在解决问题之前，我们先简单了解一下 `calendar` 模块。`calendar` 模块是 Python\
    \ 内置的，为我们提供了各种函数来解决与日期、月份和年份相关的问题。\n\n```python\n# 模块\nimport calendar\n# 输入年份\n\
    year=int(input('输入年份: '))\nleap_year=calendar.isleap(year)\n# 检查闰年\nif leap_year:\
    \ # 检查条件\n    print('该年份是闰年。')\nelse:\n    print('该年份不是闰年。')\n```\n### 输出\n**运行\
    \ 1：**\n输入年份：2020\n该年份是闰年。\n**运行 2：**\n输入年份：2021\n该年份不是闰年。\n\n### 2) 通过简单的检查方法\n\
    正如我们所知，我们需要测试目标年份是否为闰年。因此，我们在这里引入条件并尝试编写 Python 程序。\n\n```python\n# 输入年份\ny=int(input('输入年份:\
    \ '))\n# 检查非世纪年\nif y%400==0 or y%4==0 and y%100!=0:\n    print('该年份是闰年。')\nelse:\n\
    \    print('该年份不是闰年。')\n```\n### 输出\n**运行 1：**\n输入年份：2020\n该年份是闰年。\n**运行 2：**\n\
    输入年份：2021\n该年份不是闰年。\n\n---\n\n# 附加示例\n\n## 示例 1：If-Else\n输入：\n`p = 250000`\n`r\
    \ = 36`\n`t = 1`\n`formulasi = (p*r*t)/100`\n`print(si)`\n输出：\n`90000`\n\n## 示例\
    \ 2：简单 If-Else\n输入一个数字并判断是正数还是负数。\n```python\nnum = int(input(\"输入数字: \"))\nif\
    \ num > 0:\n    print(\"正数\")\nelse:\n    print(\"负数\")\n```\n\n## 示例 3：寻找较大\n\
    比较两个数字并判断哪个更大。\n```python\na = int(input(\"输入第一个数字: \"))\nb = int(input(\"输入第二个数字:\
    \ \"))\nif a > b:\n    print(\"A 较大\")\nelse:\n    print(\"B 较大\")\n```\n\n##\
    \ 示例 4：嵌套 If-Else\n比较两个数字并判断哪个更大。\n```python\na = int(input(\"输入第一个数字: \"))\n\
    b = int(input(\"输入第二个数字: \"))\nif a > b:\n    print(\"A 较大\")\nelse:\n    print(\"\
    B 较大\")\n```\n\n## 示例 5：If-Elif-Else\n根据销售金额计算折扣。\n```python\namt = int(input(\"\
    输入销售金额: \"))\nif amt <= 5000:\n    disc = amt * 0.05\nelif amt <= 15000:\n   \
    \ disc = amt * 0.1\nelif amt <= 25000:\n    disc = amt * 0.2\nelse:\n    disc\
    \ = amt * 0.3\nprint(\"折扣 : \", disc)\n```\n\n## 示例 6：计算器\n设计一个简单的计算器进行加、减、乘、除运算。\n\
    ```python\nprint(\"计算器\")\nprint(\"1.加法\")\nprint(\"2.减法\")\nprint(\"3.乘法\")\n\
    print(\"4.除法\")\nch = int(input(\"输入选择(1-4): \"))\nif ch == 1:\n    a = int(input(\"\
    输入 A:\"))\n    b = int(input(\"输入 B:\"))\n    print(\"和 = \", a+b)\nelif ch ==\
    \ 2:\n    a = int(input(\"输入 A:\"))\n    b = int(input(\"输入 B:\"))\n    print(\"\
    差 = \", a-b)\nelif ch == 3:\n    a = int(input(\"输入 A:\"))\n    b = int(input(\"\
    输入 B:\"))\n    print(\"积 = \", a*b)\nelif ch == 4:\n    a = int(input(\"输入 A:\"\
    ))\n    b = int(input(\"输入 B:\"))\n    print(\"商 = \", a/b)\nelse:\n    print(\"\
    无效选择\")\n```\n\n"
