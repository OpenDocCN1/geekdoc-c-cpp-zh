    # printing matrix using loop (matrix form)\nprint(\"Matrix is: \")\nfor i in range(3):\n\
    \    for j in range(3):\n        print(mat[i][j], end = \")\n    print() # prints\
    \ new line\n```\n\n---\n\n### Using `numpy.array()`\n```python\nmat = numpy.array([[\
    \ 10 , 20 , 30 ],[40 , 50 , 60 ],[ 70 , 70 , 90 ])\n```\n\n### Using `numpy.matrix()`\n\
