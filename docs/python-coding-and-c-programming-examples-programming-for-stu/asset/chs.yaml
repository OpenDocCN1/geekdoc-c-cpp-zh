  print \"str[2,-2]:\", str[2:-2]\n#### 逐个字符打印字符串\nprint \"str:\"\nfor i in str:\n\
  \    print i,#变量后加逗号\n    # 它不会打印换行\n```\n**输出：**\n```\nstr: Hello world\nstr[0]:\
  \ H\nstr[1]: e\nstr[-1]: d\nstr[-2]: l\nstr[0:5]: Hell\nstr[2,-2]: llo wor\nstr:H\
  \ e l l o    w o r l d\n```\n\n## 字符串单词及其长度程序\n**示例：**\n**输入：** `str = \"Hello World\
  \ How are you?\"`\n**输出：**\n```\nHello ( 5 )\nWorld ( 5 )\nHow ( 3 )\nare ( 3 )\n\
  you? ( 4 )\n```\n\n### String.split() 方法\n为了将字符串拆分为单词，我们使用 `split()` 方法，这是一个内置方法，它根据给定的分隔符将字符串拆分为子字符串（单词）。\n\
  \n**split() 方法语法：** `String.split(delimiter)`\n\n**解释：**\n例如有一个字符串 `str = \"ABC\
  \ PQR XYZ\"`，我们想用空格将其拆分为单词，那么这里的空格就是分隔符。语句为 `str.split(\" \")`，将字符串拆分为单词，然后输出为 `\"\
  ABC\" \"PQR\" \"XYZ.\"`。\n\n## 程序：将字符串拆分为单词并打印单词长度的函数\n```python\ndef splitString\
  \ (str):\n    # 按空格拆分字符串\n    str = str.split (' ')\n    # 遍历字符串中的单词\n    for words\
  \ in str:\n        print words,\" (\", len (words), \")\"\n\n#### 主代码\n#### 声明字符串并赋值\n\
  str = \"Hello World How are you?\"\n#### 调用函数\nsplitString(str)\n```\n**输出：**\n\
  ```\nHello  ( 5 )\nWorld  ( 5 )\nHow  ( 3 )\nare  ( 3 )\nyou?  ( 4 )\n```\n\n##\
  \ 统计字符串中的元音\n**示例：**\n**输入：** `Str = \"Hello world\"`\n**输出：**\n```\n元音总数: 3\n```\n\
  \n## 程序：统计字符串中的元音\n```python\n# 声明、赋值字符串\nstr = \"Hello world\"\n#### 声明计数\ncount\
  \ = 0\n#### 遍历并检查每个字符\nfor i in str:\n    # 检查元音条件\n    if( i=='A' or i=='a' or\
  \ i=='E' or i=='e'\n    or i=='I' or i=='i' or i=='O' or i=='o'\n    or i=='U' or\
  \ i=='u'):\n        count +=1;#打印计数\nprint \"Total vowels are: \", count\n```\n\
  **输出：**\n```\n元音总数:  3\n```\n\n## 使用乘法运算符创建字符串多个副本\n使用乘法运算符创建字符串的多个副本，将使用 `*`。\n\
