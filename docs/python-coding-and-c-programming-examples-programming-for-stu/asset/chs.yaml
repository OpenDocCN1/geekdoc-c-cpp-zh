  \ square(number))\nprint \"Cube of {0} is {1}\".format(number, cube (number))\n\
  ```\n输出\n输入一个整数：6\nsquare of 6 is 36\nCube of 6 is 216\n\n---\n\n## 根据交易记录计算银行账户净额\n\
  \n### 示例\n输入：\n输入交易：D 10000\n继续吗？(Y 为是)：Y\n输入交易：W 5000\n继续吗？(Y 为是)：Y\n输入交易：D 2000\n\
  继续吗？(Y 为是)：Y\n输入交易：W 100\n继续吗？(Y 为是)：N\n输出：\n净额：6900\n\n### 程序\n```python\n####\
  \ 根据输入计算银行净额\n#### \"D\" 代表存款，“W\" 代表取款\n#### 为主金额定义一个变量\nnet_amount = 0\nwhile\
  \ True:\n    # 输入交易\n    str = raw_input (\"Enter transaction: \")\n    # 获取类型和金额并到列表中\n\
  \    # 用空格分隔\n    transaction = str.split(\" \")\n    # 获取交易类型和金额的值\n    # 存储在分离的变量中\n\
  \    type = transaction [0]\n    amount = int (transaction [1])\n    if type==\"\
  D\" or type==\"d\":\n        net_amount += amount\n    elif type==\"W\" or type==\"\
  w\":\n        net_amount -= amount\n    else:\n        pass\n    # 输入选择\n    str\
  \ = raw_input (\"want to continue (Y for yes) : \")\n    if not (str[0] ==\"Y\"\
  \ or str[0] ==\"y\") :\n        # 跳出循环\n        break\n#### 打印净额\nprint \"Net amount:\
  \ \", net_amount\n```\n输出\n输入交易：D 10000 \nwant to continue (Y for yes) : Y\n输入交易：W\
  \ 5000\nwant to continue (Y for yes) : Y\n输入交易：D 2000\nwant to continue (Y for yes)\
  \ : Y\n输入交易：W 100\nwant to continue (Y for yes) : N\nNet amount: 6900\n\n---\n\n\
  ## Python 程序中温度的转换\n\n从摄氏度到华氏度，反之亦然\n\n### 使用的公式\n摄氏度到华氏度：`°C= (5/9)*(°F-32)`\n\
  华氏度到摄氏度：`°F= (9/5)*(°C) + 32`\n\n### 程序\n```python\n# 定义一个函数转换\n# 摄氏度温度到华氏度\ndef\
  \ Celsius_to_Fahrenheit(c) :\n    f = (9/5)*c + 32\n    return f\n\n# 定义一个函数转换\n\
  # 华氏度温度到摄氏度\ndef Fahrenheit_to_Celsius(f) :\n    c = (5/9)*(f - 32)\n    return\
  \ c\n\n#### 驱动代码\nif __name__ == \"__main__\" :\n    c = 36\n    print(c, \"degree\
  \ celsius is equal to:\",Celsius_to_Fahrenheit(c),\"Fahrenheit\")\n    f = 98\n\
  \    print(f,\"Fahrenheit is equal to:\",Fahrenheit_to_Celsius(f),\"degree celsius\"\
  )\n```\n输出\n36 degree celsius is equal to: 96.8 Fahrenheit\n98 Fahrenheit is equal\
  \ to: 36.666666666666667 degree Celsius\n\n---\n\n## 将米转换为码的 Python 程序\n\n关键：`1\
