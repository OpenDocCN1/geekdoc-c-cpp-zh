  \ `28.8979s9183673468`，您的状态是：健康。\n\n## 用 Python 写函数求给定数字的平方和立方\n\n### 示例\n输入：\n\
  输入一个整数：6\n输出：\n6 的平方是 36\n6 的立方是 216\n\n获取平方的函数：\n```python\ndef square (num):\n\
  \    return (num* num)\n```\n获取立方的函数：\n```python\ndef cube (num):\n    return (num*\
  \ num* num)\n```\n\n### 程序\n```python\n# python 程序，用于求给定数字的\n# 平和立方\n#### 用户定义方法求平方\n\
  def square (num):\n    return (num*num)\n\n#### 用户定义方法求立方\ndef cube (num):\n   \
