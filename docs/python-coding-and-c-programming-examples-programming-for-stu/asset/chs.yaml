  ```\n输出\nmat1...\n[[10 20 30]\n [40 50 60]\n [70 70 90]]\nmat2...\n[[10 20 30]\n\
  \ [40 50 60]\n [70 80 90]]\n\n---\n\n## Python 日期与时间程序\n\n#### 打印当前小时、分钟、秒和微秒的 Python\
  \ 程序\n\n### 步骤\n1. 从“datetime 模块”导入 `datetime` 类。\n2. 通过调用 `datetime` 类的 `now()`\
  \ 函数创建对象。\n3. 使用 `datetime.now()` 对象提取并打印当前的小时、分钟、秒和微秒。\n\n### 程序\n```python\n#\
  \ 打印当前小时、\n# 分钟、秒和微秒的 Python 程序\n#### 从 datetime 模块导入 datetime 类\nfrom datetime\
  \ import datetime\n#### 创建对象\nobj_now = datetime.now()\n#### 打印当前日期时间\nprint(\"\
  Current date & time: \", obj_now)\n# 提取并打印当前的\n# 小时、分钟、秒和微秒\nprint(\"Current hour\
  \ =\", obj_now.hour)\nprint(\"Current minute =\", obj_now.minute)\nprint(\"Current\
  \ second =\", obj_now.second)\nprint(\"Current microsecond =\", obj_now.microsecond)\n\
  ```\n输出\nCurrent date & time: 2020-07-30 14:43:52.294475\nCurrent hour = 14\nCurrent\
  \ minute = 43\nCurrent second = 52\nCurrent microsecond = 294475\n\n---\n\n## Python\
  \ 代码打印今天的年、月、日\n\n下面的示例——Python 程序打印当前的年、月、日。\n\n### 代码\n```python\n#### 打印今天的年、月、日的程序\n\
  #### 导入 date 类\nfrom datetime import date\n#### 创建今天的对象\ncurrent_date = date.today()\n\
  #### 打印当前日期\nprint(\"Current date: \", current_date)\n#### 提取年、月、日\nprint(\"Current\
  \ year:\", current_date.year)\nprint(\"Current month:\", current_date.month)\nprint(\"\
  Current day:\", current_date.day)\n```\n输出\nCurrent date: 2020-07-30\nyear: 2020\n\
  month: 7\nday: 30\n\n---\n\n## Python 列表\n\n## 在列表中添加元素\n\n### `append()` 方法\n用于向列表添加项（将作为参数传递）。\n\
  \n### 语法\n`list.append(element)`\n\n```python\n#### 定义一个包含整数和字符串的列表\nlist = [10,\
  \ 20, 30, \"New Delhi\"]\n#### 打印列表\nprint \"List elements: \", list\n#### 添加元素\n\
  list.append(40)\nlist.append(50)\nlist.append(\"Chennai\")\n#### 添加元素后打印列表\nprint\
  \ \"List elements: \", list\n```\n输出\nList elements are: [10, 20, 30, 'New Delhi',\
  \ 40, 50, 'Chennai']\n\n### `pop()` 方法\n用于从列表中移除项。\n\n### 语法\n`list.pop()`\n\n```python\n\
  #### 定义一个包含整数和字符串的列表\nlist = [10, 20, 30, \"New Delhi\", \"Mumbai\"]\n#### 打印列表\n\
  print \"List elements: \", list\n#### 添加元素\nlist.append(40)\nlist.append(50)\nlist.append(\"\
  Chennai\")\n#### 添加元素后打印列表\nprint \"List elements: \", list\n#### 移除元素\nlist.pop()\n\
  #### 移除元素后打印列表\nprint \"List elements: \", list\n```\n输出\nList elements are: [10,\
  \ 20, 30, 'New Delhi', 'Mumbai', 40, 50, 'Chennai']\nList elements are: [10, 20,\
  \ 30, 'New Delhi', 'Mumbai', 40, 50, 'Chennai']\nList elements are: [10, 20, 30,\
  \ 'New Delhi', 'Mumbai', 40, 50]\n\n---\n\n## 两个列表的差异\n\n给定两个整数列表，我们将找到差异，即不在第二个列表中的元素。\n\
  \n### 示例\n输入：\nList1 = [10, 20, 30, 40, 50]\nList2 = [10, 20, 30, 60, 70]\n输出：\n\
  Different elements:[40, 50]\n\n### 程序\n```python\n#### list1 - 第一个整数列表\n#### list2\
  \ - 第二个整数列表\nlist1 = [10, 20, 30, 40, 50]\nlist2 = [10, 20, 30, 60, 70]\n#### 打印列表\n\
  print \"list1:\", list1\nprint \"list2:\", list2\n#### 查找并打印列表的差异\nprint \"Difference\
  \ elements:\"\nprint (set(list1) - set(list2))\n```\n输出\nlist1: [10, 20, 30, 40,\
  \ 50]\nlist2: [10, 20, 30, 60, 70]\nDifference elements: [40, 50]\n\n### 程序 2\n\
