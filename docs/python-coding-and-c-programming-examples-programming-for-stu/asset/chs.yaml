  \ d\n倒数第二个字符: l\n从索引 0 到 4 的字符: Hello\n以此类推...\n\n### 程序：访问字符串中的字符\n\n## 声明、赋值字符串\n\
  ```python\nstr = \"Hello world\"\n#### 打印完整字符串\nprint \"str:\", str\n#### 打印第一个字符\n\
