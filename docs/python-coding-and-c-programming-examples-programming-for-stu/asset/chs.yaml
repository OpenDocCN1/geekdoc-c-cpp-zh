- "# Python 编码与 C 语言编程示例：小白编程指南\n\n\n\n![](img/image_rsrc22G.jpg)\n\n\n\n## Python\
  \ 中字符的 ASCII 值\n在 python 中，我们使用 `ord()` 函数来获取字符的 ASCII 码。`ord()` 接受一个字符并返回其 ASCII\
  \ 值。\n\n语法：`ord(character)`\n\n示例：\n输入：`char_var = 'A'`\n函数调用：`ord(char_var)`\n\
  输出：`65`\n\n### 打印给定字符 ASCII 值的 Python 程序\n```python\n## 将字符赋值给变量\nchar_var = 'A'\n\
  ### 打印 ASCII 码\nprint(\"ASCII value of \" + char_var + \" is = \", ord(char_var))\n\
  \nchar_var = 'x'\n### 打印 ASCII 码\nprint(\"ASCII value of \" + char_var + \" is =\
  \ \", ord(char_var))\n\nchar_var = '9'\n### 打印 ASCII 码\nprint(\"ASCII value of \"\
  \ + char_var + \" is = \", ord(char_var))\n```\n输出：\n```\nASCII value of A is =\
  \  65\nASCII value of x is =  120\nASCII value of 9 is =  57\n```\n\n#### 计算单利\n\
  我们使用以下公式计算单利：\n`(P * R * T) / 100`\n\n其中，\n* `P` – 本金金额\n* `R` – 利率，以及\n* `T` –\
  \ 以年为单位的时间\n\n\n\n\n\n### 单利程序\n\n### 示例：\n输入：\n`p = 250000`\n`r = 36`\n`t = 1`\n\
  `formulasi = (p*r*t)/100`\n`print(si)`\n输出：\n`90000`\n\n### 单利的 Python 程序\n```python\n\
  #### Python program to find simple interest\np = float(input(\"输入本金金额 : \"))\nr\
  \ = float(input(\"输入利率 : \"))\nt = float(input(\"输入年份（年）: \"))\n#### 计算单利\nsi =\
  \ (p*r*t)/100\n#### 打印这些值\nprint(\"Principle amount: \", p)\nprint(\"Interest rate\
  \    : \", r)\nprint(\"Time in years    : \", t)\nprint(\"Simple Interest : \",\
  \ si)\n```\n\n#### 输出\n**第一次运行：**\n输入本金金额：10000\n输入利率：3.5\n输入年份（年）:1\n本金金额：   10000.0\n\
  利率    ：   3.5\n年份    ：1.0\n单利 ：  350.0\n\n**第二次运行：**\n输入本金金额：250000\n输入利率：36\n输入年份（年）:1\n\
  本金金额：   250000.0\n利率    ：   36.0\n年份    ：1.0\n单利 ：  90000.0\n\n---\n\n### 复利程序\n\
  \n#### 计算复利\n我们使用以下公式计算复利：\n`P(1 + R / 100) T`\n其中，\n`P` – 本金金额\n`R` – 利率，以及\n`T`\
  \ – 年份（年）\n\n### 示例：\n输入：\n`p = 250000`\n`r = 36`\n`t = 1`\n`# formulaic`\n`ci =\
  \  p * (pow((1 + r / 100), t))`\n`print(ci)`\n输出：\n`339999.99999999994`\n\n### Python\
  \ 程序\n```python\n#### Python program to find compound interest\np = float(input(\"\
  输入本金金额 : \"))\nr = float(input(\"输入利率 : \"))\nt = float(input(\"输入年份（年）: \"))\n\
  #### 计算复利\nci =  p * (pow((1 + r / 100), t))\n#### 打印这些值\nprint(\"Principle amount\
  \  : \", p)\nprint(\"Interest rate      : \", r)\nprint(\"Time in years     : \"\
  , t)\nprint(\"compound Interest : \", ci)\n```\n\n#### 输出\n**第一次运行：**\n输入本金金额：10000\n\
  输入利率：3.5\n输入年份（年）:1\n本金金额：   10000.0\n利率      ：   3.5\n年份     ：1.0\n复利 ：  10350.0\n\
  \n**第二次运行：**\n输入本金金额：250000\n输入利率：36\n输入年份（年）:1\n本金金额：   250000.0\n利率      ：   36.0\n\
  年份     ：1.0\n复利 ：  339999.99999999994\n\n---\n\n## 闰年程序\n\n### 检查给定年份是否为闰年的 Python\
  \ 程序\n闰年是指能被 4 整除的年份，但世纪年（以 00 结尾的年份）除外。世纪年如果能被 400 整除，则为闰年。在这里，用户提供一个年份，我们将测试该年份是否为闰年。\n\
  \n#### 1) 使用 calendar 模块\n在解决问题之前，我们先简单了解一下 `calendar` 模块。`calendar` 模块是 Python\
  \ 内置的，为我们提供了各种函数来解决与日期、月份和年份相关的问题。\n\n```python\n### 模块\nimport calendar\n#### 输入年份\n\
  year=int(input('输入年份: '))\nleap_year=calendar.isleap(year)\n#### 检查闰年\nif leap_year:\
  \ # 检查条件\n    print('该年份是闰年。')\nelse:\n    print('该年份不是闰年。')\n```\n#### 输出\n**运行\
  \ 1：**\n输入年份：2020\n该年份是闰年。\n**运行 2：**\n输入年份：2021\n该年份不是闰年。\n\n#### 2) 通过简单的检查方法\n\
  正如我们所知，我们需要测试目标年份是否为闰年。因此，我们在这里引入条件并尝试编写 Python 程序。\n\n```python\n#### 输入年份\ny=int(input('输入年份:\
  \ '))\n#### 检查非世纪年\nif y%400==0 or y%4==0 and y%100!=0:\n    print('该年份是闰年。')\n\
  else:\n    print('该年份不是闰年。')\n```\n#### 输出\n**运行 1：**\n输入年份：2020\n该年份是闰年。\n**运行\
  \ 2：**\n输入年份：2021\n该年份不是闰年。\n\n---\n\n### 附加示例\n\n### 示例 1：If-Else\n输入：\n`p = 250000`\n\
