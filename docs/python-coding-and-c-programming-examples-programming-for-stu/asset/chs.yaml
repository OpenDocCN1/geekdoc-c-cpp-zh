  \ 简单程序\n/*计算数字阶乘的 C 程序.*/\n```c\n#include <stdio.h>\nint main() {\n    int num,i;\n\
  \    long int fact;\n    printf(\"Enter an integer number: \");\n    scanf(\"%d\"\
  ,&num);\n    /*从 num 到 1 的乘积*/\n    fact = 1;\n    for(i=num; i>=1; i--)\n     \
  \   fact = fact*i;\n    printf(\"\\nFactorial of %d is = %ld\",num,fact);\n    return\
  \ 0;\n}\n```\nOutput:\nEnter an integer number: 7\nFactorial of 7 is = 5040\n\n\
  ## 自定义函数\n/*使用函数：计算数字阶乘的 C 程序.*/\n```c\n#include <stdio.h>\n/*函数：factorial，用于计算给定数字的阶乘*/\n\
  long int factorial(int n) {\n    int i;\n    long int fact=1;\n    if(n==1) return\
  \ fact;\n    for(i=n; i>=1; i--)\n        fact = fact * i;\n    return fact;\n}\n\
  \nint main() {\n    int num;\n    printf(\"Enter an integer number :\");\n    scanf(\"\
  %d\",&num);\n    printf(\"\\nFactorial of %d is = %ld\",num,factorial(num));\n \
  \   return 0;\n}\n```\nExample:\n输入数字: `0x0` (十六进制)\n输入数字的二进制:`00001010`\n交换第 1\
  \ 位和第 2 位后将变为：`00001100`\n输出: 数字将为：`0xC` (十六进制)\n\n```c\n#include <stdio.h>\n/*交换存储在\
  \ data 变量中的十六进制值的第 1 位和第 2 位*/\nint main() {\n    unsigned char data = 0xA; // 十进制值\n\
  \    // 从 data 中获取第 1 位\n    unsigned char bit_1 = (data >> 1) & 1;\n    // 从 data\
  \ 中获取第 2 位\n    unsigned char bit_2 = (data >> 2) & 1;\n    // 获取 bit_1 和 bit_2\
  \ 的异或结果\n    unsigned char xor_of_bit = bit_1 ^ bit_2;\n    printf(\"After swapping\
  \ the bits, data value is: %X\", data ^ (xor_of_bit << 1 | xor_of_bit << 2));\n\
  \    return 0;\n}\n```\n交换位后，data 值为：C\n\n## 使用四种方法交换数字程序\n1. 使用第三变量\n2. 不使用第三变量\n\
  3. 使用 异或运算符\n4. 使用简单语句\n\n```c\n//使用四种方法交换数字的 C 程序。\n#include <stdio.h>\nint main()\
  \ {\n    int a,b,t;\n    printf(\" Enter value of A ?\");\n    scanf(\"%d\",&a);\n\
  \    printf(\" Enter value of B ?\");\n    scanf(\"%d\",&b);\n    printf(\"\\n Before\
  \ swapping : A=%d, B=%d\",a,b);\n\n    /*第一种方法：使用第三变量*/\n    t=a;\n    a=b;\n  \
  \  b=t;\n    printf(\"\\n After swapping (First method) : A=%d, B=%d\",a,b);\n\n\
  \    /*第二种方法：不使用第三变量*/\n    a=a+b;\n    b=a-b;\n    a=a-b;\n    printf(\"\\n After\
  \ swapping (second method) : A=%d, B=%d\",a,b);\n\n    /*第三种方法：使用异或*/\n    a^=b;\n\
