  ,a,b);\n\n    /*第四种方法（单语句）*/\n    a=a+b-(b=a);\n    printf(\"\\n After swapping\
  \ (fourth method) : A=%d, B=%d\",a,b);\n    return 0;\n}\n```\nOutput:\nEnter value\
