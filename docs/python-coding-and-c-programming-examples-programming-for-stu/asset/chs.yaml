  print(\"mat[2][1]: \", mat[2][1])\nprint(\"mat[2][2]: \", mat[2][2])\n#### 使用循环打印矩阵（矩阵形式）\n\
  print(\"Matrix is: \")\nfor i in range(3):\n    for j in range(3):\n        print(mat[i][j],\
  \ end = \")\n    print() # 打印换行\n```\n\n---\n\n### 使用 `numpy.array()`\n```python\n\
  import numpy as np\nmat = np.array([[ 10 , 20 , 30 ],[40 , 50 , 60 ],[ 70 , 70 ,\
