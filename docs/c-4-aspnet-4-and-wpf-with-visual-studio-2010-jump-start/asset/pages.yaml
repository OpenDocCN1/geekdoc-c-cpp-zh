  md: "```\n}\n// The number of pages paginated so far.\n// This example has exactly\
    \ 4 pages.\npublic override int PageCount\n{\n    get { return 4; }\n}\n\n// The\
    \ suggested page size.\npublic override Size PageSize\n{\n    get { return m_PageSize;\
    \ }\n    set { m_PageSize = value; }\n}\n\n// The element currently being paginated.\n\
    public override IDocumentPaginatorSource Source\n{\n    get { return null; }\n\
    }\n}\n```\n\n# DATA BINDING\n\nWPF data binding lets you bind a target to a data\
    \ source so the target automatically displays the value in the data source. For\
    \ example, this lets you:\n\n+   - Make a `ListBox` display an array of values\
    \ defined in XAML code.\n+   - Make a `ListBox` display a list of objects created\
    \ in code-behind.\n+   - Make a `TreeView` build a hierarchical display of objects\
    \ created in code-behind.\n+   - Make `TextBoxes`, `Labels`, and other controls\
    \ display additional detail about the currently selected item in a `ListBox`,\
    \ `ComboBox`, or `TreeView`.\n\nAdditional WPF data-binding features let you sort,\
    \ filter, and group data; let the user modify a control to update a data source;\
    \ and validate changes to data.\n\n# Binding Basics\n\nData bindings have these\
    \ four basic pieces:\n\n+   - **Target** — The object that will use the result\
    \ of the binding\n+   - **Target Property** — The target object’s property that\
    \ will use the result\n+   - **Source** — The object that provides a value for\
    \ the target object to use\n+   - **Path** — A path that locates the value within\
    \ the source object"
  merge: -1
  img_proc: true
- pgno: 108
  md: "As a trivial example, suppose you want to bind a Label control's Content property\
    \ so that the Label displays whatever you type in a TextBox. If the Label control\
    \ is named lblResult and the TextBox is named txtTypeHere, then you would need\
    \ to create a binding where:\n\n+   - The target is lblResult (the control where\
    \ you want the binding's result to go).\n+   - The target property is Content\
    \ (you want the Label to display the result in its Content property).\n+   - The\
    \ source is txtTypeHere (the object providing the value).\n+   - The path is Text\
    \ (the path to the data in the source object, in this case, the TextBox's Text\
    \ property).\n\nThe TextBoxToLabel example program shown here demonstrates this\
    \ kind of simple binding. When you type in the textbox, the two labels below it\
    \ echo whatever you type.\n\nThe following XAML code shows how the program works:\n\
    \n![](img/7954dcc7dd1d929d072aec8e9531b6cc_108_0.png)\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_108_1.png)\n\
    \n```\n<StackPanel Margin=\"5\">\n    <TextBox Name=\"txtTypeHere\" Margin=\"\
    5\" Height=\"30\" VerticalAlignment=\"Top\" Text=\"Type here!\"/>\n    <Label\
    \ Margin=\"5\" BorderBrush=\"Yellow\" BorderThickness=\"1\">\n        <Binding\
    \ ElementName=\"txtTypeHere\" Path=\"Text\"/>\n    </Label>\n    <Label Margin=\"\
    5\" BorderBrush=\"Yellow\" BorderThickness=\"1\" Content=\"{Binding ElementName=txtTypeHere,\
    \ Path=Text}\"/>\n</StackPanel>\n```\n\nThe PersonSource example program shown\
    \ in the next figure uses a binding with its Source property set to display information\
    \ about a Person object.\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_108_2.png)\n\
    \nThe PersonSource example program defines a Person class with the properties\
    \ FirstName, LastName, and NetWorth. The program's XAML code includes the following\
    \ namespace definition so it can use the class:\n\n```\nxmlns:local=\"clr-namespace:PersonSource\"\
    \n```"
  merge: -1
  img_proc: true
- pgno: 109
  md: "The following code shows how the program's XAML code defines a static resource\
    \ named a_person that is a Person object:\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_109_0.png)\n\
    \n```\n<Window.Resources>\n    <local:Person x:Key=\"a_person\" FirstName=\"Bill\"\
    \n        LastName=\"Gates\" NetWorth=\"40000000000\"/>\n</Window.Resources>\n\
    ```\n\nWPF Programmer's Reference 9780470477229 PersonSource\n\nThe following\
    \ code shows how the program uses bindings to display the Person object's FirstName,\
    \ LastName, and NetWorth values. It uses binding Source properties to identify\
    \ the Person object that provides the values.\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_109_1.png)\n\
    \n```\n<Label Grid.Row=\"1\" Grid.Column=\"0\" Content=\"First Name:\"/>\n<Label\
    \ Grid.Row=\"1\" Grid.Column=\"1\"\n    Content=\"{Binding Source={StaticResource\
    \ a_person}, Path=FirstName}\"/>\n\n<Label Grid.Row=\"2\" Grid.Column=\"0\" Content=\"\
    Last Name:\"/>\n<Label Grid.Row=\"2\" Grid.Column=\"1\"\n    Content=\"{Binding\
    \ Source={StaticResource a_person}, Path=LastName}\"/>\n\n<Label Grid.Row=\"3\"\
    \ Grid.Column=\"0\" Content=\"NetWorth:\"/>\n<Label Grid.Row=\"3\" Grid.Column=\"\
    1\"\n    Content=\"{Binding Source={StaticResource a_person}, Path=NetWorth}\"\
    />\n```\n\nWPF Programmer's Reference 9780470477229 PersonSource\n\n# RelativeSource\n\
    \nThe binding's RelativeSource property lets you specify a source object by its\
    \ relationship to the target control. One situation in which this is useful is\
    \ when you want to bind two properties on the same control.\n\nThe TypeAColor\
    \ example program shown in the next figure binds the TextBox's Background property\
    \ to its Text property, so when you type the name of a color, the control uses\
    \ that color as its background.\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_109_2.png)\n\
    \nThe following code shows how the TypeAColor program binds the TextBox's Background\
    \ property to its Text property:\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_109_3.png)\n\
    \n```\n<TextBox Margin=\"10\" Height=\"30\" VerticalAlignment=\"Top\"\n    Background=\"\
    {Binding RelativeSource={RelativeSource Self}, Path=Text}\"/>\n```\n\nWPF Programmer's\
    \ Reference 9780470477229 TypeAColor"
  merge: -1
