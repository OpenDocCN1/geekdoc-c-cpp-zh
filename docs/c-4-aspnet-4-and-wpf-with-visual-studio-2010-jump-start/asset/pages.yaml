    \ namespace as you might expect. With that said, it\ndoesn’t also mean that you\
    \ need to move everything over to the new System.Runtime.Caching\nnamespace to\
    \ make sure you are following the strategic path of Microsoft, because the two\
    \ caches\nare managed together under the covers.\n\nThis section runs through\
