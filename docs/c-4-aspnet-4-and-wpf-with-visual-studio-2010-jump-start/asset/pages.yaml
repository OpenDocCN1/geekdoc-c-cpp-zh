- pgno: 73
  md: '# WPF


    # PROGRAMMER''S REFERENCE


    # Windows Presentation Foundation

    with C# 2010 and .NET 4


    # CODE-BEHIND FILES


    Whenever you add a window to a project, Expression Blend or Visual Studio adds
    a corresponding code-behind file. The file has the same name as the XAML file
    with the extra extension cs (for C#) or vb (for Visual Basic). For example, when
    you create a new WPF project in C#, the project includes the initial window in
    the file Window1.xaml and the corresponding code-behind file Window1.xaml.cs.


    If you''re using Visual Studio, then you can edit the code-behind file and take
    full advantage of Visual Studio''s powerful code-editing features such as keyword
    highlighting and IntelliSense.


    # EXAMPLE CODE


    The source code, which is available for download on the book''s web site at www.wrox.com,
    includes several example applications that all do the same thing but use different
    techniques for attaching code-behind to the user interface.


    This figure shows one of the programs in action. You can drag the scrollbars or
    enter values in the textboxes to set the red, green, and blue components of the
    color displayed on the right. If you click on the Apply button, the program sets
    the window''s background color to match the current sample.


    ![](img/7954dcc7dd1d929d072aec8e9531b6cc_73_0.png)


    YOU CAN DOWNLOAD THE CODE FOUND IN THIS SECTION. VISIT WROX.COM AND SEARCH FOR
    ISBN 9780470477229'
  merge: -1
  img_proc: true
- pgno: 74
  md: "The ImageColors example program, which is shown in the next figure, demonstrates\
    \ all of the different techniques for attaching UI elements to code-behind in\
    \ a single program. The program's different buttons are attached to event handlers\
    \ in different ways. Download the C# or Visual Basic version of this program from\
    \ the book's web site to see the details.\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_74_0.png)\n\
    \n# EVENT NAME ATTRIBUTES\n\nThe first way to attach code-behind to a control's\
    \ events uses an attribute in the XAML code. The attribute's name is the same\
    \ as the event that you want to catch. Its value is the name of the event handler\
    \ in the code-behind.\n\nFor example, the following XAML code defines a Button\
    \ named btnApply. The Click attribute indicates that the routine btnApply_Click\
    \ catches the control's Click event handler.\n\n```\n<Button Content=\"Apply\"\
    \ IsDefault=\"True\"\nName=\"btnApply\" Click=\"btnApply_Click\"/>\n```\n\nUnfortunately,\
    \ if you simply add the event handler declaration to the XAML code, the program\
    \ won't run. If you try to execute it in Expression Blend or Visual Studio, you'll\
    \ receive an error that says your program doesn't contain a definition for the\
    \ event handler routine.\n\nThe following C# code handles the event declared in\
    \ the previous XAML code:\n\n```\nprivate void btnApply_Click(object sender, RoutedEventArgs\
    \ e)\n{\n    this.Background = borSample.Background;\n}\n```\n\nThis code catches\
    \ the btnApply Button's Click event and sets the window's Background property\
    \ to the value used by the borSample control's Background property (more details\
    \ on this shortly).\n\nYour code doesn't need to do anything special to wire up\
    \ the event handler to catch the event — Expression Blend and Visual Studio take\
    \ care of that for you."
  merge: -1
  img_proc: true
- pgno: 75
  md: "The following XAML fragment shows how the EventNameAttributes example program\
    \ determines which event handlers catch the key events raised by the program's\
    \ Apply button, and the scrollbar and textbox that control the color's red component.\
    \ The code for the other scrollbars and textboxes is similar.\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_75_0.png)\n\
    \n```\n<ScrollBar Orientation=\"Horizontal\" Minimum=\"0\" Maximum=\"255\"\nGrid.Row=\"\
    0\" Grid.Column=\"0\" Value=\"255\"\nName=\"scrRed\" ValueChanged=\"scrRed_ValueChanged\"\
    />\n\n<TextBox Margin=\"2\" Grid.Row=\"0\" Grid.Column=\"1\" Text=\"255\"\nHorizontalContentAlignment=\"\
    Right\" VerticalContentAlignment=\"Center\"\nName=\"txtRed\" TextChanged=\"txtRed_TextChanged\"\
    />\n\n<Button Grid.Row=\"3\" Grid.Column=\"0\" Grid.ColumnSpan=\"3\" Width=\"\
    100\" Height=\"40\"\nContent=\"Apply\" IsDefault=\"True\"\nName=\"btnApply\" Click=\"\
