    \nThe PrintWindow program requires references to the ReachFramework and System.Printing\
    \ libraries. In Visual Studio, open the Project menu and select “Add Reference.”\
    \ Select these two libraries and click OK.\n\nTo make working with the libraries\
    \ easier, the program includes the following using statements:\n\n```\nusing System.Printing;\n\
    using System.Windows.Media.Effects;\n```"
