    IL_0066:  ldloc.0\nIL_0067:  ldfld    object DeCompile.DynamicClass::DynValue\n\
    IL_006c:  callvirt instance void class [mscorlib]System.Action`3\n    <class [System.Core]System.Runtime.CompilerServices.CallSite,\
    \ class\n[mscorlib]System.Type,object>::Invoke(10,11,12)\nIL_0071:  nop\nIL_0072:\
    \  call     string [mscorlib]System.Console::ReadLine()\nIL_0077:  pop\nIL_0078:\
    \  ret\n} // end of method Program::Main\n```\n\nSo it's safe to say that the\
    \ C# compiler is doing a little extra work to support the dynamic type. Looking\
    \ at the generated code, you can see references to System.Runtime.CompilerServices.CallSite\
    \ and System.Runtime.CompilerServices.CallSiteBinder.\n\nThe CallSite is a type\
    \ that handles the lookup at runtime. When a call is made on a dynamic object\
    \ at runtime, something has to go and look at that object to see if the member\
    \ really exists. The call site caches this information so the lookup doesn't have\
    \ to be performed repeatedly. Without this process, performance in looping structures\
    \ would be questionable.\n\nAfter the CallSite does the member lookup, the CallSiteBinder\
    \ is invoked. It takes the information from the call site and generates an expression\
    \ tree representing the operation the binder is bound to.\n\nThere is obviously\
    \ a lot going on here. Great care has been taken to optimize what would appear\
    \ to be a very complex operation. It should be obvious that while using the dynamic\
    \ type can be useful, it does come with a price.\n\n# CODE CONTRACTS\n\nDesign-by-contracts\
    \ is an idea from the Eiffel programming language. Now .NET 4 includes classes\
    \ for static and runtime checks of code within the namespace System.Diagnostics.Contracts\
    \ that can be used by all .NET languages.\n\nWith this functionality you can define\
    \ preconditions, postconditions, and invariants within a method. The preconditions\
    \ lists what requirements the parameters must fulfill, the postconditions define\
    \ the requirements on returned data, and the invariants define the requirements\
    \ of variables within the method itself.\n\nContract information can be compiled\
    \ both into the debug and the release code. It is also possible to define a separate\
    \ contract assembly, and many checks can also be made statically without running\
    \ the application. You can also define contracts on interfaces that cause the\
    \ implementations of the interface to fulfill the contracts. Contract tools can\
    \ rewrite the assembly to inject contract checks"
