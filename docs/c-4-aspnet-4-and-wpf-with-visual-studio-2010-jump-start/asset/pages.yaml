  md: "# PROFESSIONAL\nC# 4 and .NET 4\n\n# COVARIANCE AND CONTRA-VARIANCE\n\nPrevious\
    \ to .NET 4, generic interfaces were invariant. .NET 4 adds an important extension\
    \ for generic interfaces and generic delegates with covariance and contra-variance.\
    \ Covariance and contra-variance are about the conversion of types with argument\
    \ and return types. For example, can you pass a Rectangle to a method that requests\
    \ a Shape? Let's get into examples to see the advantages of these extensions.\n\
    \nWith .NET, parameter types are covariant. Assume you have the classes Shape\
    \ and Rectangle, and Rectangle derives from the Shape base class. The Display()\
    \ method is declared to accept an object of the Shape type as its parameter:\n\
    \n```\npublic void Display(Shape o) { }\n```\n\nNow you can pass any object that\
    \ derives from the Shape base class. Because Rectangle derives from Shape, a Rectangle\
    \ fulfills all the requirements of a Shape and the compiler accepts this method\
    \ call:\n\n```\nRectangle r = new Rectangle { Width= 5, Height=2.5};\nDisplay(r);\n\
    ```\n\nReturn types of methods are contra-variant. When a method returns a Shape\
    \ it is not possible to assign it to a Rectangle because a Shape is not necessarily\
    \ always a Rectangle. The opposite is possible. If a method returns a Rectangle\
    \ as the GetRectangle() method,\n\n```\npublic Rectangle GetRectangle();\n```\n\
    \nthe result can be assigned to a Shape.\n\n```\nShape s = GetRectangle();\n```\n\
    \nBefore version 4 of the .NET Framework, this behavior was not possible with\
    \ generics. With C# 4, the language is extended to support covariance and contra-variance\
    \ with generic interfaces and generic delegates. Let's start by defining a Shape\
    \ base class and a Rectangle class:\n\n```\npublic class Shape\n{\n    public\
    \ double Width { get; set; }\n    public double Height { get; set; }\n    public\
    \ override string ToString()\n```"
