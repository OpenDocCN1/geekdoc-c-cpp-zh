  md: "The following code fragment shows the key pieces of the ShapesPaginator class:\n\
    \n![](img/7954dcc7dd1d929d072aec8e9531b6cc_106_0.png)\n\n```\n```csharp\nclass\
    \ ShapesPaginator : DocumentPaginator\n{\n    private Size m_PageSize;\n\n   \
    \ // Save the page size.\n    public ShapesPaginator(Size page_size)\n    {\n\
    \        m_PageSize = page_size;\n    }\n\n    // Return the needed page.\n  \
    \  public override DocumentPage GetPage(int pageNumber)\n    {\n        const\
    \ double WID = 600;\n        const double HGT = 800;\n\n        Grid drawing_grid\
    \ = new Grid();\n        drawing_grid.Width = m_PageSize.Width;\n        drawing_grid.Height\
    \ = m_PageSize.Height;\n\n        switch (pageNumber)\n        {\n           \
    \ case 0: // Ellipse\n                Ellipse ell = new Ellipse();\n         \
    \       ell.Fill = Brushes.Orange;\n                ell.Stroke = Brushes.Blue;\n\
    \                ell.StrokeThickness = 1;\n                ell.HorizontalAlignment\
    \ = HorizontalAlignment.Center;\n                ell.VerticalAlignment = VerticalAlignment.Center;\n\
    \                ell.Width = WID;\n                ell.Height = HGT;\n       \
    \         drawing_grid.Children.Add(ell);\n                break;\n\n        \
    \    ... Code for other pages omitted ...\n\n        }\n\n        // Arrange to\
    \ make the controls draw themselves.\n        Rect rect = new Rect(new Point(0,\
    \ 0), m_PageSize);\n        drawing_grid.Arrange(rect);\n\n        // Return a\
    \ DocumentPage wrapping the grid.\n        return new DocumentPage(drawing_grid);\n\
    \    }\n\n    // If pagination is in progress and PageCount is not final, return\
    \ False.\n    // If pagination is complete and PageCount is final, return True.\n\
    \    // In this example, there is no pagination to do.\n    public override bool\
    \ IsPageCountValid\n    {\n        get { return true; }\n    }\n}\n```\n```"
