  md: "contract defines that the result returned (Contract.Result<int>()) is larger\
    \ than the old value from the argument x (Contract.OldValue<int>(x)).\n\n```\n\
    static int ReturnLargerThanInput(int x)\n{\n    Contract.Ensures(Contract.Result<int>()\
    \ > Contract.OldValue<int>(x));\n    return x + 3;\n}\n```\n\nIf a method returns\
    \ values with the out modifier instead of just with the return statement, conditions\
    \ can be defined with ValueAtReturn(). The following contract defines that the\
    \ x variable must be larger than 5 and smaller than 20 on return, and with the\
    \ y variable modulo 5 must equal 0 on return.\n\n```\nstatic void OutParameters(out\
    \ int x, out int y)\n{\n    Contract.Ensures(Contract.ValueAtReturn<int>(out x)\
    \ > 5 &&\n    Contract.Ensures(Contract.ValueAtReturn<int>(out x) < 20);\n   \
    \ Contract.Ensures(Contract.ValueAtReturn<int>(out y) % 5 == 0);\n    x = 8;\n\
    \    y = 10;\n}\n```\n\n# Invariants\n\nInvariants define contracts for variables\
    \ during the method lifetime. Contract.Requires() defines input requirements,\
    \ Contract.Ensures() defines requirements on method end. Contract.Invariant()\
    \ defines conditions that must succeed during the whole lifetime of the method.\n\
    \n```\nstatic void Invariant(ref int x)\n{\n    Contract.Invariant(x > 5);\n \
    \   x = 3;\n    Console.WriteLine(\"invariant value: {0}\", x);\n    x = 9;\n\
    }\n```\n\nPro C# 4 9780470502259 code snippet CodeContractsSamples/Program.cs\n\
    \n![](img/7954dcc7dd1d929d072aec8e9531b6cc_19_0.png)\n\n# Contracts for Interfaces\n\
    \nWith interfaces you can define methods, properties, and events that a class\
    \ that derives from the interface must implement. With the interface declaration\
    \ you cannot define how the interface must be implemented. Now this is possible\
    \ using code contracts.\n\nTake a look at the following interface. The interface\
    \ IPerson defines FirstName, LastName, and Age properties, and the method ChangeName().\
    \ What's special with this interface is just the attribute ContractClass. This\
    \ attribute is applied to the interface IPerson and defines that the PersonContract\
    \ class is used as the code contract for this interface.\n\n```\n[ContractClass(typeof(PersonContract))]\n\
    public interface IPerson\n{\n    string FirstName { get; set; }\n```\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_19_1.png)"
