    \ finished\nloop 76 finished\nThe operation was canceled.\n```\n```\n\n# Cancellation\
    \ of Tasks\n\nThe same cancellation pattern is used with tasks. First, a new CancellationTokenSource\
    \ is created. If you need just one cancellation token, you can use a default one\
    \ by accessing Task.Factory.CancellationToken. Then, similar to the previous code,\
    \ a new task is created that sends a cancel request to this cancellationSource\
    \ by invoking the Cancel() method after 500 milliseconds. The task doing the major\
    \ work within a loop receives the cancellation token via the TaskFactory object.\
    \ The cancellation token is assigned to the TaskFactory by setting it in the constructor.\
    \ This cancellation token is used by the task to check if cancellation is requested\
    \ by checking the IsCancellationRequested property of the CancellationToken.\n\
    \n![](img/7954dcc7dd1d929d072aec8e9531b6cc_31_0.png)\n\n```\n```csharp\nvar cts\
    \ = new CancellationTokenSource();\ncts.Token.Register(() =>\n    Console.WriteLine(\"\
    *** task canceled\"));\n\n// start a task that sends a cancel to the\n// cts after\
    \ 500 ms\nTask.Factory.StartNew(() =>\n{\n    Thread.Sleep(500);\n    cts.Cancel();\n\
    });\n\nvar factory = new TaskFactory(cancellationTokenSource.Token);\nTask t1\
    \ = factory.StartNew(new Action<object>(f =>\n{\n    Console.WriteLine(\"in task\"\
    );\n    for (int i = 0; i < 20; i++)\n    {\n        Thread.Sleep(100);\n    \
    \    CancellationToken ct = (f as TaskFactory).CancellationToken;\n        if\
    \ (ct.IsCancellationRequested)\n        {\n            Console.WriteLine(\"canceling\
    \ was requested, \" +\n                \"canceling from within the task\");\n\
    \            ct.ThrowIfCancellationRequested();\n            break;\n        }\n\
    \        Console.WriteLine(\"in loop\");\n    }\n}));\n```\n```"
