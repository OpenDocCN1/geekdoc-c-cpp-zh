    # EXTENDING <OUTPUTCACHE>


    With the release of ASP.NET 4, you are now able to extend how the OutputCache
    directive works and have it instead work off your own custom means to caching.
    This means that you can wire the OutputCache directive to any type of caching
    means including distributed caches, cloud caches, disc, XML, or anything else
    you can dream up.


    To accomplish this, you are required to create a custom output-cache provider
    as a class and this class will need to inherit from the new System.Web.Caching.OutputCacheProvider
    class. To inherit from OutputCacheProvider, you must override the Add(), Get(),
    Remove(), and Set() methods to implement your custom version of output caching.'
