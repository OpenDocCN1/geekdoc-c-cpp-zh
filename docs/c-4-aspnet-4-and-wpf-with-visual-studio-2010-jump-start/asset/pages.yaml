  md: "> Tuples are explained earlier in the \"Tuples\" section.\n\nWhen defining\
    \ a task to invoke the method TaskWithResult, the generic class Task<Result> is\
    \ used. The generic parameter defines the return type. With the constructor, the\
    \ method is passed to the Func delegate, and the second parameter defines the\
    \ input value. Because this task needs two input values in the object parameter,\
    \ a tuple is created as well. Next, the task is started. The Result property of\
    \ the Task instance t1 blocks and waits until the task is completed. Upon task\
    \ completion, the Result property contains the result from the task.\n\n```\n\
    ```csharp\nvar t1 = new Task<Tuple<int,int>>(TaskWithResult,\n    Tuple.Create<int,\
    \ int>(8, 3));\nt1.Start();\nConsole.WriteLine(t1.Result);\nt1.Wait();\nConsole.WriteLine(\"\
    result from task: {0} {1}\", t1.Result.Item1,\n    t1.Result.Item2);\n```\n```\n\
    \n# PARALLEL CLASS\n\nAnother abstraction of threads that is new with .NET 4 is\
    \ the Parallel class. This class defines static methods for a parallel for and\
    \ foreach. With the language defined for for and foreach, the loop is run from\
    \ one thread. The Parallel class uses multiple tasks and, thus, multiple threads\
    \ for this job.\n\nWhile the Parallel.For() and Parallel.ForEach() methods invoke\
    \ the same method several times, Parallel.Invoke() allows invoking different methods\
    \ concurrently.\n\n# Looping with the Parallel.For Method\n\nThe Parallel.For()\
    \ method is similar to the C# for loop statement to do a task a number of times.\
    \ With the Parallel.For(), the iterations run in parallel. The order of iteration\
    \ is not defined.\n\nWith the For() method, the first two parameters define the\
    \ start and end of the loop. The sample has the iterations from 0 to 9. The third\
    \ parameter is an Action<int> delegate. The integer parameter is the iteration\
    \ of the loop that is passed to the method referenced by the delegate. The return\
    \ type of Parallel.For() is the struct ParallelLoopResult, which provides information\
    \ if the loop is completed.\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_25_0.png)\n\
    \n```\n```csharp\nParallelLoopResult result =\n    Parallel.For(0, 10, i =>\n\
    \    {\n        Console.WriteLine(\"{0}, task: {1}, thread: {2}\", i,\n      \
    \      Task.CurrentId, Thread.CurrentThread.ManagedThreadId);\n        Thread.Sleep(10);\n\
    \    });\nConsole.WriteLine(result.IsCompleted);\n```\n```"
