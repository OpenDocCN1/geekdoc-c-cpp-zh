  md: "# Starting Tasks\n\nTo start a task, you can use either the TaskFactory or\
    \ the constructor of the Task and the Start() method. The Task constructor just\
    \ gives you more flexibility in creating the task.\n\nWhen starting a task, an\
    \ instance of the Task class can be created and the code that should run can be\
    \ assigned, with an Action or Action<object> delegate, with either no parameters\
    \ or one object parameter. This is similar to what you saw with the Thread class.\
    \ Here, a method is defined without a parameter. In the implementation, the ID\
    \ of the task is written to the console.\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_22_0.png)\n\
    \n```\n```csharp\nstatic void TaskMethod()\n{\n    Console.WriteLine(\"running\
    \ in a task\");\n    Console.WriteLine(\"Task id: {0}\", Task.CurrentId);\n}\n\
    ```\n```\n\nPro C# 4 9780470502259 code snippet TaskSamples\\Program.cs\n\nIn\
    \ the previous code, you can see different ways to start a new task. The first\
    \ way is with an instantiated TaskFactory, where the method TaskMethod is passed\
    \ to the StartNew() method, and the task is immediately started. The second approach\
    \ uses the constructor of the Task class. When the Task object is instantiated,\
    \ the task does not run immediately. Instead, it is given the status Created.\
    \ The task is then started by calling the Start() method of the Task class. With\
    \ the Task class, instead of invoking the Start() method, you can invoke the RunSynchronously()\
    \ method. This way, the task is started as well, but it is running in the current\
    \ thread of the caller, and the caller needs to wait until the task finishes.\
    \ By default, the task runs asynchronously.\n\n```\n```csharp\n// using task factory\n\
    TaskFactory tf = new TaskFactory();\nTask t1 = tf.StartNew(TaskMethod);\n\n//\
    \ using the task factory via a task\nTask t2 = Task.Factory.StartNew(TaskMethod);\n\
    \n// using Task constructor\nTask t3 = new Task(TaskMethod);\nt3.Start();\n```\n\
    ```\n\nWith both the Task constructor and the StartNew() method of the TaskFactory,\
    \ you can pass values from the enumeration TaskCreationOptions. Setting the option\
    \ LongRunning, you can inform the task scheduler that the task takes a long time,\
    \ so the scheduler will more likely use a new thread. If the task should be attached\
    \ to a parent task and, thus, should be canceled if the parent were canceled,\
    \ set the option AttachToParent. The value PreferFairness means that the scheduler\
    \ should take first tasks that are already waiting. That's not the default case\
    \ if a task is created within another task. If tasks create additional work using\
    \ child tasks, child tasks are preferred to other tasks. They are not waiting\
    \ last in the thread pool queue for the work to be done. If these tasks should\
    \ be handled in a fair manner to all other tasks, set the option to PreferFairness.\n\
    \n```\n```csharp\nTask t4 = new Task(TaskMethod, TaskCreationOptions.PreferFairness);\n\
    t4.Start();\n```\n```"
  merge: -1
