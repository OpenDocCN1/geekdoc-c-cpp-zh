- pgno: 11
  md: "would occur. The exception that is raised is `RuntimeBinderException`. The\
    \ `RuntimeBinder` is the object in the runtime that evaluates the call to see\
    \ if `Person` really does support the method that was called.\n\nUnlike the `var`\
    \ keyword, an object that is defined as `dynamic` can change type during runtime.\
    \ Remember, when the `var` keyword is used, the determination of the object's\
    \ type is delayed. Once the type is defined, it can't be changed. Not only can\
    \ you change the type of a dynamic object, you can change it many times. This\
    \ differs from casting an object from one type to another. When you cast an object\
    \ you are creating a new object with a different but compatible type. For example,\
    \ you cannot cast an `int` to a `Person` object. In the following example, you\
    \ can see that if the object is a `dynamic` object, you can change it from `int`\
    \ to `Person`:\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_11_0.png)\n\n```\n\
    ```csharp\ndynamic dyn;\n\ndyn = 100;\nConsole.WriteLine(dyn.GetType());\nConsole.WriteLine(dyn);\n\
    \ndyn = \"This is a string\";\nConsole.WriteLine(dyn.GetType());\nConsole.WriteLine(dyn);\n\
    \ndyn = new Person() { FirstName = \"Bugs\", LastName = \"Bunny\" };\nConsole.WriteLine(dyn.GetType());\n\
    Console.WriteLine(\"{0} {1}\", dyn.FirstName, dyn.LastName);\n```\n```\n\n*Pro\
    \ C# 4.9780470502259 code snippet DynamicProgram.cs*\n\nExecuting this code would\
    \ show that the `dyn` object actually changes type from `System.Int32` to `System.String`\
    \ to `Person`. If `dyn` had been declared as an `int` or `string`, the code would\
    \ not have compiled.\n\nThere are a couple of limitations to the dynamic type.\
    \ A dynamic object does not support extension methods. Anonymous functions (Lambda\
    \ expressions) also cannot be used as parameters to a dynamic method call, thus\
    \ LINQ does not work well with dynamic objects. Most LINQ calls are extension\
    \ methods and Lambda expressions are used as arguments to those extension methods.\n\
    \n# # Dynamic Behind the Scenes\n\nSo what's going on behind the scenes to make\
    \ this happen? C# is still a statically typed language. That hasn't changed. Take\
    \ a look at the IL (Intermediate Language) that's generated when the `dynamic`\
    \ type is used.\n\nFirst, this is the example C# code that you're looking at:\n\
    \n```\n```csharp\nusing System;\n\nnamespace DeCompile\n{\n    class Program\n\
    \    {\n        static void Main(string[] args)\n```\n```"
