  md: '# # PROFESSIONAL ASP.NET 4 in C# and VB


    # ## CHART SERVER CONTROL


    One of the newest controls available to you now with ASP.NET 4 is the Chart server
    control. This control made its way into the core part of ASP.NET through a previous
    acquisition of the Dundas charting company and is a great control for getting
    you up and running with some good-looking charts.


    The new Chart server control supports many chart types including:


    +   - Point

    +   - FastPoint

    +   - Bubble

    +   - Line

    +   - Spline

    +   - StepLine

    +   - FastLine

    +   - Bar

    +   - StackedBar

    +   - StackedBar100

    +   - Column

    +   - StackedColumn

    +   - StackedColumn100

    +   - Area

    +   - SplineArea

    +   - StackedArea

    +   - StackedArea100

    +   - Pie

    +   - Doughnut

    +   - Stock

    +   - CandleStick

    +   - Range

    +   - SplineRange

    +   - RangeBar

    +   - RangeColumn

    +   - Radar

    +   - Polar

    +   - ErrorBar

    +   - BoxPlot

    +   - Renko

    +   - ThreeLineBreak

    +   - Kagi

    +   - PointAndFigure

    +   - Funnel

    +   - Pyramid'
