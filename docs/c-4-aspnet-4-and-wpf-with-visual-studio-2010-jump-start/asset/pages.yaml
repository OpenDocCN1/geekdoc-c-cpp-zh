  md: "```\n<EventTrigger.Actions>\n    <BeginStoryboard Storyboard=\"{StaticResource\
    \ sbSmallSize}\" />\n</EventTrigger.Actions>\n</Style.Triggers>\n</Style>\n```\n\
    \nA program could use the following code to define a button that uses this style:\n\
    \n```\n<Button Style=\"{StaticResource btnEventSbSize}\"\nContent=\"New Size\"\
    />\n```\n\n# Storyboards\n\nNow that you understand how to start a storyboard,\
    \ it's time to learn how to build one. A storyboard is an object that defines\
    \ a timeline for one or more animations.\n\nAn animation manages the transition\
    \ of a property from one value to another over time. An animation can include\
    \ a start time indicating when the transition should begin and a duration telling\
    \ how long the animation should last.\n\nThe animation classes let you specify\
    \ what you want done and then ignore how it is done. You say you want a property\
    \ changed to a certain value over the next 3 seconds, and the animation classes\
    \ figure out how to do it.\n\nSpecific kinds of animations handle changes to properties\
    \ of different data types such as Double, Color, String, Thickness, and many others.\n\
    \nThe following code shows a simple Storyboard containing five DoubleAnimation\
    \ objects. This is the Storyboard that the CentralizedTriggers program uses to\
    \ move the first thumbnail into the viewing area.\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_87_0.png)\n\
    \n```\n<Storyboard x:Key=\"sbImg1\">\n    <DoubleAnimation Duration=\"0:0:0.5\"\
    \ To=\"120\"\n        Storyboard.TargetName=\"img1\"\n        Storyboard.TargetProperty=\"\
    (Canvas.Left)\" />\n    <DoubleAnimation Duration=\"0:0:0.5\" To=\"0\"\n     \
    \   Storyboard.TargetName=\"img1\"\n        Storyboard.TargetProperty=\"(Canvas.Top)\"\
    \ />\n    <DoubleAnimation Duration=\"0:0:0.5\" To=\"485\"\n        Storyboard.TargetName=\"\
    img1\"\n        Storyboard.TargetProperty=\"Width\" />\n    <DoubleAnimation Duration=\"\
    0:0:0.5\" To=\"400\"\n        Storyboard.TargetName=\"img1\"\n        Storyboard.TargetProperty=\"\
    Height\" />\n    <DoubleAnimation Duration=\"0:0:0.5\" To=\"1\"\n        Storyboard.TargetName=\"\
    img1\"\n        Storyboard.TargetProperty=\"Opacity\" />\n</Storyboard>\n```"
