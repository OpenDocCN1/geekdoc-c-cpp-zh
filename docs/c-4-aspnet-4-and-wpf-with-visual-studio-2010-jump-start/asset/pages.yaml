  md: 'The disabled button on the left looks washed-out and doesn''t respond to the
    user.


    The second button labeled Default has a different border from that of the other
    buttons. If no other button has the focus when the user presses the [Enter] key,
    that Button fires its Click event. In the previous figure, the TextBox has the
    focus, so pressing the [Enter] key will fire the default Button.


    The next figure shows the program when the mouse is over Button 3. The button
    under the mouse becomes less transparent. Notice that the focus is still in the
    TextBox (you can see the caret in this figure), so the default button still shows
    its distinctive border.


    ![](img/7954dcc7dd1d929d072aec8e9531b6cc_94_0.png)


    The next figure shows the program when the user presses the mouse down on Button
    3.


    ![](img/7954dcc7dd1d929d072aec8e9531b6cc_94_1.png)


    At this point, the pressed button is opaque. Pressing the button also moves focus
    to that button. Because focus is now on Button 3, the default button is no longer
    defaulted. In fact, no button is defaulted right now. Button 3 has the focus so
    it will fire if the user presses [Enter] but it is not defaulted so it won''t
    display the default border even after the user releases the mouse.


    If you drag the mouse off the button while it is still pressed, the button returns
    to its focused “mouse over” appearance. If you then release the mouse, no mouse
    click occurs.


    > You can download the example program from the WPF Programmer''s Reference (9780470477229)
    web site to see the details.


    # Researching Control Templates


    To effectively build templates, you need to learn what behaviors the control provides
    for you and what behaviors you need to provide for it. You also need to determine
    what events the control provides so that you know when you have a chance to make
    the control take action.


    So, how do you learn what properties and template bindings are available?'
