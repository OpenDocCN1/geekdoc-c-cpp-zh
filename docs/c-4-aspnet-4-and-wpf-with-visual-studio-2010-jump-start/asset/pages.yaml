- pgno: 60
  md: 'Another outstanding feature found in this release of the .NET Framework is
    the WCF Data Services framework. This feature enables you to easily create a cloud
    interface to your client applications that provides everything from simple read
    capabilities to a full CRUD model (create, read, update, and delete functions).
    This feature was previously referred to as ADO.NET Data Services.


    When you are working with ASP.NET, there is now a lot more focus on putting work
    down on the client as well as the server. In the past, much of the development
    focused on performing as much on the server as possible and delivering completed
    operations and UI back down to the client simply for viewing. With the release
    of “smart clients” and AJAX-enabled applications, much of the work is now being
    offloaded to the client. WCF Data Services makes exposing back-end capabilities
    over the wire to enable more work to be performed on the client even easier than
    before.


    WCF Data Services works to create a services layer to your back-end data source.
    Doing so yourself, especially if you are working with a full CRUD model, means
    a lot of work. WCF Data Services allow you to get a service layer that is URI-driven.
    The following figure shows the general architecture when you’re working with WCF
    Data Services.


    ![](img/7954dcc7dd1d929d072aec8e9531b6cc_60_0.png)


    As you can see from this figure, the WCF Data Services layer is not the layer
    that interacts with the database. Instead, you are working with an EDM layer that
    is the mapping layer between the data store and the cloud-based interface. When
    working with your EDM, you are able to use LINQ to SQL and LINQ to Entities.


    WCF Data Services allow you to quickly expose interactions with the application’s
    underlying data source as RESTful-based services. The current version of WCF Data
    Services allows you to work with the datastores using JSON or Atom-based XML.
    Again, JSON is what ASP.NET AJAX uses for doing out-of-bounds calls to get around
    doing a complete page refresh.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# # CREATING YOUR FIRST SERVICE


    Figuring out how to build a complete services layer to your database for all create,
    read, update, and delete functions would take some serious time and thought. However,
    WCF Data Services makes this task much more feasible, as you will see as you work
    through this first example.


    To build a services layer, first create a standard ASP.NET Web Application called
    Web_ADONETDS in either Visual Basic or C#. Note, you need to use the .NET Framework
    3.5 SP1 along with Visual Studio 2008 SP1 or the .NET Framework 4 with Visual
    Studio 2010 for this example to work.


    This, of course, creates a standard Web application that is not different from
    normal. Because WCF Data Services works from an underlying database, you will
    need to add one. For this example, add the NORTHWND.mdf database. Place this database
    within the App_Data folder of your project.


    # ## Adding Your Entity Data Model


    After you have the database in place, you next create an Entity Data Model that
    WCF Data Services will work with. To do this, right-click on your project and
    select Add ⇨ New Item from the list of options in the provided menu.


    The Add New Item dialog appears. As illustrated here, add an ADO.NET Entity Data
    Model to your project.


    ![](img/7954dcc7dd1d929d072aec8e9531b6cc_61_0.png)


    As shown in the figure, name your ADO.NET Entity Data Model file Northwind.edmx.
    When you create the Northwind.edmx file by clicking Add, the Entity Data Model
    Wizard appears, offering you the option of creating an empty EDM or creating one
    from a pre-existing database. For this example, choose the option to create one
    from the pre-existing (Northwind) database. Then click Next in the wizard.'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'The next screen of the wizard will find your NORTHWIND.mdf database and pre-define
    the connection settings and how they will be stored within your application. The
    next figure presents this second screen of the wizard.


    ![](img/7954dcc7dd1d929d072aec8e9531b6cc_62_0.png)


    In the previous screenshot, notice that the connection string and the locations
    of the mapping details are going to be stored within the web.config file. You
    can also see on this screen that you are naming the instance of the model NORTHWINDEntities
    in the text box at the bottom of the wizard. This name is important to note because
    you will use it later in this example.


    The next screen allows you to select the tables, views, or stored procedures that
    will be part of the model. For this example, select the check box next to the
    Table item in the tree view to select all the tables in the database, as shown
    in the next figure.


    ![](img/7954dcc7dd1d929d072aec8e9531b6cc_62_1.png)'
