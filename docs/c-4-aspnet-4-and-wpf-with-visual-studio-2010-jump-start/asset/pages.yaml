    {\n    Console.WriteLine(\"bar\");\n}\n```\n```\n\n*Pro C# 4 9780470502259 code\
    \ snippet ParallelSamples\\Program.cs*\n\n# ## CANCELLATION FRAMEWORK\n\n.NET\
    \ 4 includes a new cancellation framework to allow the canceling of long-running\
    \ tasks in a standard manner. Every blocking call should support this mechanism.\
    \ As of today, of course, not every blocking call implements this new technology,\
    \ but more and more are doing so. Among the technologies that offer this mechanism\
    \ already are tasks, concurrent collection classes, and Parallel LINQ, as well\
    \ as several synchronization mechanisms.\n\nThe cancellation framework is based\
    \ on cooperative behavior; it is not forceful. A long-running task checks if it\
    \ is canceled and returns control.\n\nA method that supports cancellation accepts\
    \ a `CancellationToken` parameter. This class defines the property `IsCancellationRequested`,\
    \ where a long operation can check if it should abort. Other ways for a long operation\
    \ to check for cancellation are to use a `WaitHandle` property that is signaled\
    \ when the token is canceled, or to use the `Register()` method. The `Register()`\
    \ method accepts parameters of type `Action` and `ICancelableOperation`. The method\
    \ that is referenced by the `Action` delegate is invoked when the token is canceled.\
    \ This is similar to the `ICancelableOperation`, where the `Cancel()` method of\
    \ an object implementing this interface is invoked when the cancellation is done.\n\
    \n# ### Cancellation of Parallel.For\n\nLet's start with a simple example using\
    \ the `Parallel.For()` method. The `Parallel` class provides overloads for the\
    \ `For()` method, where you can pass parameter of type `ParallelOptions`. With\
    \ the `ParallelOptions`, you can pass a `CancellationToken`. The `CancellationToken`\
    \ is generated by creating a `CancellationTokenSource`. `CancellationTokenSource`\
    \ implements the interface `ICancelableOperation` and, thus, can be registered\
    \ with the `CancellationToken` and allows cancellation with the `Cancel()` method.\
    \ To cancel the parallel loop, a new task is created to invoke the `Cancel()`\
    \ method of the `CancellationTokenSource` after 500 milliseconds.\n\nWithin the\
    \ implementation of the `For()` loop, the `Parallel` class verifies the outcome\
    \ of the `CancellationToken` and cancels the operation. Upon cancellation, the\
    \ `For()` method throws an exception of type `OperationCanceledException`, which\
    \ is caught in the example. With the `CancellationToken`, it is possible to register\
    \ for information when the cancellation is done. This"
  merge: -1
