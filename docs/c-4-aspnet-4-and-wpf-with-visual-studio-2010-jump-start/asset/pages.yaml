    \ *Pro C# 4 9780470502259 code snippet Variance1/Program.cs*\n\n# ## Contra-Variance\
    \ with Generic Interfaces\n\nA generic interface is contra-variant if the generic\
    \ type is annotated with the `in` keyword. This way the interface is only allowed\
    \ to use generic type `T` as input to its methods:\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_8_1.png)\n\
    \n```\n```csharp\npublic interface IDisplay<in T>\n{\n    void Show(T item);\n\
    }\n```\n```\n\n> *Pro C# 4 9780470502259 code snippet Variance1/IDisplay.cs*\n\
    \nThe `ShapeDisplay` class implements `IDisplay<Shape>` and uses a `Shape` object\
    \ as an input parameter:\n\n```\n```csharp\npublic class ShapeDisplay : IDisplay<Shape>\n\
    ```\n```\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_8_2.png)"
