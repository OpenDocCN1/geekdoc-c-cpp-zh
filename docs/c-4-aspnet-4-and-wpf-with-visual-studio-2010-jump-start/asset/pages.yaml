    \ of the preceding code is what you would need just for an ASP.NET AJAX page.\n\
    \n# BUILDING AN ASP.NET WEB PACKAGE\n\nOne of the easiest ways to deploy your\
    \ Web application is to use the new built-in publishing features from Visual Studio\
    \ 2010. Behind the scenes, this new capability uses Microsoft’s Web Deployment\
    \ Tool, also known as MSDeploy, which means that if you want to deploy this tool\
    \ to your server this server must have MSDeploy on the machine for the hydration\
    \ of your application to actually work.\n\nThe package that is created and passed\
    \ around is an actual physical file — a .zip file. This .zip file contains everything\
    \ you need to redeploy your Web application with all of its settings into the\
    \ new environment. In addition to the .zip file, it also includes a manifest file\
    \ and a command file that are used to initiate the installation of the package\
    \ on the host machine.\n\nThe first way in which this application can be deployed\
    \ is to use the new 1-Click Publishing capability found in Visual Studio 2010.\
    \ To do this, right-click on the project within the Visual Studio Solution Explorer\
    \ and select the Publish option from the provided menu. The Publish Web dialog\
    \ appears, as shown in the following figure.\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_68_0.png)"
  merge: -1
  img_proc: true
- pgno: 69
  md: 'Because many developers are continually deploying their Web applications to
    their testing, staging, and production environments, there is a capability to
    store your deployment options in a profile that you can use again and again. Also
    notice in the dialog in the previous figure that the build configuration is set
    to Release for this deployment. This setting comes from what you have set in the
    toolbar of Visual Studio 2010 before you select the Publish option.


    The Publish Web dialog contains the following options as defined in the following
    table.


    | SETTING | DESCRIPTION |

    |---|---|

    | Profile name | The name of your saved profile. This provides you the ability
    to reuse your settings as a default for repeated deployments. |

    | Build Configuration | Specifies whether the build compilation will be done in
    either the Debug or Release mode. You can first establish this setting from the
    toolbar of Visual Studio. |

    | Publish Method | The method you want to employ for the deployment. The possible
    options include MSDeploy Publish, FTP, File System, and FPSE. |

    | Service URL | Specifies the location of the MSDeploy on the host server. This
    URL points to the actual IIS handler that has the MSDeploy capability and will
    be constructed similar to http://myhostserver:8172/ MsDeploy .axd. |

    | Site/Application | Specifies the location where your application will be deployed.
    Here you can specify the site as well as the virtual directory to place the application.
    An example of this is MyDomain.com/MyApplication. |

    | Mark as IIS application on destination | If this option is selected, IIS will
    treat the endpoint defined in the Site/Application textbox as the application
    root. |

    | Do not delete extra files on destination | If this option is not selected, the
    1-Click Publishing option will first delete everything on the host server location
    before applying the files and settings. |

    | Allow Untrusted Certificate | If this option is selected, you will trust certificates
    that are self-published or certificates that don’t match the URL of the destination.
    |

    | User Name | The username used for IIS connections. |

    | Password | The password used for IIS connections. |

    | Save password | Specifies to the Visual Studio publishing feature whether to
    save the password in the profile. |


    Besides using the MSDeploy option, you will find that the other options provided
    through the new Publish Web dialog are even simpler. The following figure shows
    you the settings for the other three deployment options provided.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '![](img/7954dcc7dd1d929d072aec8e9531b6cc_70_0.png)


    In this figure you can see some standard settings for doing deployments using
    FTP, the file system, or FrontPage Server Extensions.


    The interesting thing with the MSDeploy capabilities that Visual Studio 2010 now
    works with is that instead of just connecting to a remote MSDeploy handler and
    running your deployment real-time, you can also create an MSDeploy package that
    can be run at any time.


    Visual Studio 2010 now includes the ability to create these packages that can
    then be e-mailed or by other means provided to someone else to run on their systems.
    To create a Web deployment package, right-click on the project within the Visual
    Studio Solution Explorer and choose the Create Package option from the provided
    menu.


    When you select the Create Package option, the progress of the package creation
    appears in the Visual Studio status bar. After you''re notified that the Publish
    succeeded, you can find the entire package in your application''s obj folder,
    such as


    ```

    C:\Users\Evjen\Documents\Visual Studio 10\

    Projects\MyWebApplication\MyWebApplication\obj\Release\Package

    ```'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'Within this folder are all the files that constitute the package. The following
    figure presents these files.


    ![](img/7954dcc7dd1d929d072aec8e9531b6cc_71_0.png)


    All of these files constitute the package that you can use in the deployment process.


    +   - The `MyWebApplication.deploy.cmd` file is what your infrastructure team
    would use to run on the host machine (which has MSDeploy) to install the application
    and all the settings that are required for the application.

    +   - The other files, `MyWebApplication.SetParameters.xml` and `MyWebApplication.SourceManifest.xml`,
    are used to define the settings used in the installation process.

    +   - The final file, `MyWebApplication.zip`, contains the contents of the application.


    With this package, passing another team the installation required for your application
    is easy. A nice example of this usage is if you are deploying to a Web farm because
    multiple deployments need to occur and you want these deployments to all be the
    same. Running your installations from this single package ensures this similarity.


    The other nice advantage to this package system is that it allows you to save
    your previous deployments, and if you need to go back and verify deployments,
    you can easily grab hold of a saved package. It also makes rollbacks easy for
    your deployment process.'
  merge: -1
  img_proc: true
