- pgno: 43
  md: '# ASP.NET AJAX CONTROL TOOLKIT


    With the install of the .NET Framework 4 and through using Visual Studio 2010,
    you will find a few controls available that allow you to build ASP.NET applications
    with server-side AJAX capabilities. This is the framework to take your applications
    to the next level because you can accomplish so much with it, including adding
    specific AJAX capabilities to your user and custom server controls. Every AJAX
    enhancement added to your application will make your application seem more fluid
    and responsive to the end user.


    You might be wondering where the big AJAX-enabled server controls are for this
    edition of Visual Studio 2010 if this is indeed a new world for building Web applications.
    The reason you do not see a new section of AJAX server controls is that Microsoft
    has treated them as an open source project instead of just blending them into
    Visual Studio 2010.


    Developers at Microsoft and in the community have been working on a series of
    AJAX-capable server controls that you can use in your ASP.NET applications. These
    controls are collectively called the ASP.NET AJAX Control Toolkit. Recently, Microsoft
    has made the ASP.NET AJAX Control Toolkit a part of the Microsoft AJAX Library
    found at www.asp.net/ajaxlibrary. Downloading the library, you will find that
    it now also includes the complete AJAX Control Toolkit. The following figure shows
    the download page for the AJAX Library.


    ![](img/7954dcc7dd1d929d072aec8e9531b6cc_43_0.png)'
  merge: -1
  img_proc: true
