  md: "```\n</DataTemplate.Resources>\n<StackPanel>\n    <Grid>\n        <TextBlock\
    \ Text=\"{Binding Name}\"/>\n        <Image Source=\"{Binding Picture}\"\n   \
    \            Height=\"50\"/>\n        <Grid>\n            <TextBox Text=\"{Binding\
    \ Stats}\"/>\n        </StackPanel>\n    </DataTemplate>\n</ListBox.ItemTemplate>\n\
    ```\n\nMost of this code uses Styles to define properties for the controls that\
    \ will display the item's data.\n\nThe StackPanel at the end contains those controls.\
    \ The controls that actually display the data are:\n\n+   - A TextBlock bound\
    \ to the Planet item's Name property\n+   - An Image bound to the Planet's Picture\
    \ property\n+   - A TextBox bound to the Planet's Stats property\n\n# TreeView\
    \ Templates\n\nThe TreeView control works a bit differently than the ListBox and\
    \ ComboBox because it displays hierarchical data instead of items in a simple\
    \ list.\n\nIn a TreeView, you must specify two things at each node in the tree\
    \ — the data to display for that node and the path to follow deeper into the tree.\n\
    \nThe OrgChartTreeView example program shown in the next figure displays a company\
    \ organizational chart with departments displayed either by managers or by projects.\
    \ To make understanding the items easier, region names are red, department names\
    \ are blue and end in the word department, manager names are shown in blue boxes,\
    \ project names are shown in goldenrod boxes, and employee names are plain black\
    \ text.\n\nThe TreeView on the left shows regions, each region's departments,\
    \ each department's managers, and each manager's direct report employees. The\
    \ TreeView on the right shows regions, each region's projects, each department's\
    \ projects, and each project's team members.\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_111_0.png)"
  merge: -1
  img_proc: true
- pgno: 112
  md: "The TreeView controls that produce these two displays include HierarchicalDataTemplate\
    \ objects in their Resources sections to describe what the control should do at\
    \ each node. For example, the following code shows how the controls handle Region\
    \ objects:\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_112_0.png)\n\n```\n<HierarchicalDataTemplate\n\
    DataType=\"(x:Type local:Region)\"\nItemsSource=\"{Binding Path=Departments}\"\
    >\n    <TextBlock Text=\"{Binding Path=RegionName}\" Foreground=\"Red\">\n   \
    \     <TextBlock.BitmapEffect>\n            <OuterGlowBitmapEffect/>\n       \
    \ </TextBlock.BitmapEffect>\n    </TextBlock>\n</HierarchicalDataTemplate>\n```\n\
    \nThe TreeView on the left in the previous figure uses the following HierarchicalDataTemplate\
    \ to display data for a Department object:\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_112_1.png)\n\
    \n```\n<HierarchicalDataTemplate\nDataType=\"(x:Type local:Department)\"\nItemsSource=\"\
    {Binding Path=Managers}\">\n    <TextBlock Text=\"{Binding Path=Name}\" Foreground=\"\
    Blue\"/>\n</HierarchicalDataTemplate>\n```\n\nContrast that code with the following\
    \ code used by the TreeView on the right in the previous figure:\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_112_2.png)\n\
    \n```\n<HierarchicalDataTemplate\nDataType=\"(x:Type local:Department)\"\nItemsSource=\"\
    {Binding Path=Projects}\">\n    <TextBlock Text=\"{Binding Path=Name}\" Foreground=\"\
    Blue\"/>\n</HierarchicalDataTemplate>\n```\n\n# Binding Database Objects\n\nADO.NET\
    \ provides objects that interact with relational databases. Because they are objects,\
    \ you can bind them to controls much as you can bind the objects described earlier\
    \ in this section. Because these objects are more complicated than those you would\
    \ typically build yourself, binding them is a little more complicated.\n\nThe\
    \ basic strategy is to open the database in code-behind as you would for any other\
    \ ADO.NET application. Load data into DataSet, DataTable, and other ADO.NET objects,\
    \ and then bind them to the application's controls.\n\nYou can think of a DataTable\
    \ as similar to a collection of DataRow objects and a DataSet as similar to a\
    \ collection of DataTables, so the binding syntax isn't totally unfamiliar.\n\n\
    The StudentData example program shown in the next figure demonstrates ADO.NET\
    \ binding. This program loads its data from the StudentData.mdb Microsoft Access\
    \ database."
  merge: -1
  img_proc: true
