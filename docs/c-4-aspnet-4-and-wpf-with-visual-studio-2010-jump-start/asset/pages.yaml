    <DoubleAnimationUsingKeyFrames

    Storyboard.TargetName="ellShadow"

    Storyboard.TargetProperty="Opacity">

    <SplineDoubleKeyFrame KeyTime="0:0:1"

    KeySpline="0.5,0 1,1"

    Value="1"/>

    </DoubleAnimationUsingKeyFrames>

    </ParallelTimeline>

    </Storyboard>

    ```


    The Storyboard contains two ParallelTimeline objects that run independently. The
    first waits 1 second until the ball is touching the “ground” and then uses a MediaTimeline
    object to play the sound effect.


    ![](img/7954dcc7dd1d929d072aec8e9531b6cc_90_0.png)


    The second ParallelTimeline contains two DoubleAnimationUsingKeyframes objects,
    one to control the ball''s Canvas.Top property and one to control the shadow''s
    Opacity. As the ball''s animation moves the ball downward, the shadow''s animation
    makes the shadow more opaque. When the animations end, the ball is touching the
    “ground,” and the shadow is fully opaque.


    # TEMPLATES


    Properties and styles determine a control''s appearance and behavior.


    In contrast, templates determine a control''s structure. They determine what components
    make up the control and how those components interact to provide the control''s
    features.'
  merge: -1
  img_proc: true
- pgno: 91
  md: "# Template Overview\n\nIf you look closely at the next figure, you can see\
    \ that a `Slider` control has a bunch of parts including:\n\n+   - A border\n\
    +   - Tick marks\n+   - A background\n+   - Clickable areas on the background\
    \ (basically anywhere between the top of the control and its tick marks vertically)\
    \ that change the current value\n+   - A Thumb indicating the current value that\
    \ you can drag back and forth\n+   - Selection indicators (the little black triangles)\
    \ that indicate a selected range\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_91_0.png)\n\
    \nThese features are provided by the pieces that make up the `Slider`.\n\nA `template`\
    \ determines what the pieces are that make up a control. It determines the control's\
    \ components together with their styles, triggers, and everything else that is\
    \ needed by the control.\n\n# ContentPresenter\n\nThe ContentPresenter is an object\
    \ that WPF provides to display whatever it is that the control should display.\
    \ You can place the ContentPresenter in whatever control hierarchy you build for\
    \ the template, and it will display the content.\n\nFor example, the following\
    \ code shows an extremely simple Label template:\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_91_1.png)\n\
    \n```\n```xml\n<Window.Resources>\n    <ControlTemplate x:Key=\"temSimpleLabel\"\
    \ TargetType=\"Label\">\n        <Border BorderBrush=\"Red\" BorderThickness=\"\
    1\">\n            <ContentPresenter/>\n        </Border>\n    </ControlTemplate>\n\
    </Window.Resources>\n```\n```\n\nThe SimpleLabelTemplate example program shown\
    \ in the next figure displays two Labels. The one on the left uses no template,\
    \ while the one on the right uses the temSimpleLabel template.\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_91_2.png)"
  merge: -1
  img_proc: true
- pgno: 92
  md: "# Template Binding\n\nIf you compare the two Labels in the previous figure,\
    \ you'll see that even this simple example has some potential problems. Because\
    \ the template's Border control includes explicit values for its BorderBrush and\
    \ BorderThickness properties, it overrides any values set in the code that creates\
    \ the Label. The Border control also doesn't specify a Background, so it uses\
    \ its default transparent background.\n\nThis means the templated control doesn't\
    \ display the correct background or border. It also doesn't honor the requested\
    \ HorizontalContentAlignment and VerticalContentAlignment values.\n\nFortunately,\
    \ a template can learn about some of the properties set on the client control\
    \ by using a template binding. For example, the following code fragment sets the\
    \ Background property for a piece of the template to the value set for the control's\
    \ Background property:\n\n```\n```xml\nBackground=\"{TemplateBinding Background}\"\
    \n```\n```\n\nThe following code shows a better version of the Label template\
    \ that honors several of the control's background and foreground properties:\n\
    \nAvailable for download on Wrox.com\n\n```\n```xml\n<ControlTemplate x:Key=\"\
    temBetterLabel\" TargetType=\"Label\">\n    <Border\n        Background=\"{TemplateBinding\
    \ Background}\"\n        BorderBrush=\"{TemplateBinding BorderBrush}\"\n     \
    \   BorderThickness=\"{TemplateBinding BorderThickness}\">\n        <ContentPresenter\
    \ Margin=\"4\"\n            HorizontalAlignment=\"{TemplateBinding HorizontalContentAlignment}\"\
    \n            VerticalAlignment=\"{TemplateBinding VerticalContentAlignment}\"\
    />\n    </Border>\n</ControlTemplate>\n```\n```\n\nWPF Programmer's Reference\
    \ 9780470477229 BetterLabelTemplate\n\nThe BetterLabelTemplate example program\
    \ shown here uses this template to display a Label that looks much more like one\
    \ that has no template.\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_92_0.png)\n\
    \n# Template Events\n\nTo make a template control respond to events, you can add\
    \ property and event triggers to the template much as you previously added them\
    \ to styles.\n\nIn addition to events caused by user actions such as moving or\
    \ pressing the mouse, controls must respond to changes in state. For example,\
    \ although a Label mostly just sits around doing nothing, it should also change\
    \ its appearance when it is disabled."
  merge: -1
  img_proc: true
- pgno: 93
  md: "The DisabledLabelTemplate example program shown here uses a template that gives\
    \ a disabled Label a distinctive appearance.\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_93_0.png)\n\
    \nThe following code shows the template that gives the disabled Label its appearance:\n\
    \nAvailable for download on Wrox.com\n\n```\n```xml\n<ControlTemplate x:Key=\"\
    temWrappedLabel\" TargetType=\"Label\">\n    <Grid>\n        <Border Name=\"brdMain\"\
    \n                Background=\"{TemplateBinding Background}\"\n              \
    \  BorderBrush=\"{TemplateBinding BorderBrush}\"\n                BorderThickness=\"\
    {TemplateBinding BorderThickness}\">\n            <TextBlock Name=\"txtbContent\"\
    \n                       Margin=\"4\"\n                       TextWrapping=\"\
    Wrap\"\n                       Text=\"{TemplateBinding ContentPresenter.Content}\"\
    />\n        </Border>\n        <Canvas Name=\"canDisabled\" Opacity=\"0\">\n \
    \           <Canvas.Background>\n                <LinearGradientBrush StartPoint=\"\
    0,0\" EndPoint=\"3,3\"\n                                     MappingMode=\"Absolute\"\
    \n                                     SpreadMethod=\"Repeat\">\n            \
    \        <GradientStop Color=\"LightGray\" Offset=\"0\"/>\n                  \
    \  <GradientStop Color=\"Black\" Offset=\"1\"/>\n                </LinearGradientBrush>\n\
    \            </Canvas.Background>\n        </Canvas>\n    </Grid>\n    <ControlTemplate.Triggers>\n\
    \        <Trigger Property=\"IsEnabled\" Value=\"False\">\n            <Setter\
    \ TargetName=\"canDisabled\" Property=\"Opacity\" Value=\"0.5\"/>\n          \
    \  <Setter TargetName=\"txtbContent\" Property=\"Foreground\" Value=\"Gray\"/>\n\
    \        </Trigger>\n    </ControlTemplate.Triggers>\n</ControlTemplate>\n```\n\
    ```\n\n# Glass Button\n\nThe GlassButton example program shown here uses a template\
    \ to give its buttons a glassy appearance.\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_93_1.png)"
