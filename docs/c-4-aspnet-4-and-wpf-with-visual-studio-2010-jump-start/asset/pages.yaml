- pgno: 85
  md: "The program uses several Styles to make building the list of images easier.\
    \ They’re rather long, so they aren’t shown here. You can download the example\
    \ program from the book’s web site and take a look if you like.\n\nThe bottom\
    \ of the program’s window contains a series of StackPanel controls, each of which\
    \ holds an Image and a Label. The following code shows how the program displays\
    \ the controls for the Engineering department on the right:\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_85_0.png)\n\
    \n```\n```xml\n<StackPanel Style=\"{StaticResource DepartmentStackPanel}\">\n\
    \    <Image Source=\"Engineering.jpg\" />\n    <Label Style=\"{StaticResource\
    \ ImageLabelStyle}\" Content=\"Engineering\" />\n</StackPanel>\n```\n```\n\nThe\
    \ key is the DepartmentStackPanel Style defined in the following code:\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_85_1.png)\n\
    \n```\n```xml\n<ScaleTransform x:Key=\"BigScale\" ScaleX=\"1.1\" ScaleY=\"1.1\"\
    />\n\n<Style x:Key=\"DepartmentStackPanel\" TargetType=\"StackPanel\">\n    <Setter\
    \ Property=\"Margin\" Value=\"10\"/>\n    <Setter Property=\"Opacity\" Value=\"\
    0.5\"/>\n    <Setter Property=\"Background\" Value=\"Transparent\"/>\n    <Style.Triggers>\n\
    \        <Trigger Property=\"IsMouseOver\" Value=\"True\">\n            <Setter\
    \ Property=\"Opacity\" Value=\"1\"/>\n            <Setter Property=\"LayoutTransform\"\
    \n                    Value=\"{StaticResource BigScale}\"/>\n        </Trigger>\n\
    \    </Style.Triggers>\n</Style>\n```\n```\n\n# EVENT TRIGGERS AND ANIMATION\n\
    \nAn event trigger lets you detect when an event occurs. Animation lets you change\
    \ property values in a series of smoothly varying steps. Together, for example,\
    \ you can make a Button detect the MouseOver event and use animation to enlarge\
    \ the Button, providing graphical feedback similar to the experience provided\
    \ by the previous property event.\n\n# Event Triggers\n\nA *property trigger*\
    \ takes action when a control’s property has a certain value.\n\nIn contrast,\
    \ an *event trigger* takes action when a control event occurs. Rather than acting\
    \ when the IsMouseOver property is True, an event trigger might take action when\
    \ the MouseEnter event fires, indicating that the mouse moved over the control.\
    \ Another event could take some other action when the MouseLeave event fires,\
    \ which occurs when the mouse moves off the control."
