  md: "# IsMouseOver Triggers\n\nOne common type of property trigger takes action\
    \ when the user moves the mouse over something. These triggers execute their Setters\
    \ when the IsMouseOver property is True.\n\nThe following XAML code defines an\
    \ unnamed Button Style. It sets some basic values and then defines a Trigger that\
    \ executes when the IsMouseOver property is True. When the mouse moves over the\
    \ Button, the Trigger makes the Button bigger and makes its font larger and bold.\n\
    \n![](img/7954dcc7dd1d929d072aec8e9531b6cc_84_0.png)\n\n```\n<Style TargetType=\"\
    Button\">\n  <Setter Property=\"VerticalAlignment\" Value=\"Top\"/>\n  <Setter\
    \ Property=\"Margin\" Value=\"10\"/>\n  <Setter Property=\"Background\" Value=\"\
    Violet\"/>\n  <Setter Property=\"Width\" Value=\"100\"/>\n  <Setter Property=\"\
    Height\" Value=\"30\"/>\n  <Setter Property=\"FontSize\" Value=\"16\"/>\n  <Style.Triggers>\n\
    \    <Trigger Property=\"IsMouseOver\" Value=\"True\">\n      <Setter Property=\"\
    Width\" Value=\"105\"/>\n      <Setter Property=\"Height\" Value=\"50\"/>\n  \
    \    <Setter Property=\"FontSize\" Value=\"20\"/>\n      <Setter Property=\"FontWeight\"\
    \ Value=\"Bold\"/>\n    </Trigger>\n  </Style.Triggers>\n</Style>\n```\n\nThe\
    \ IsMouseOverTriggers example program shown here uses this code to provide feedback\
    \ when the mouse is over a button.\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_84_1.png)\n\
    \n# Setting Opacity\n\nThe ImageTriggers example program shown in the next figure\
    \ uses Triggers to highlight the image under the mouse.\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_84_2.png)"
