- pgno: 110
  md: "# ListBox and ComboBox Templates\n\nThe ListBox and ComboBox controls have\
    \ an ItemTemplate property that determines how each item is displayed. These templates\
    \ are somewhat similar to the templates described in the “Templates” section.\n\
    \nThe template can hold whatever controls you like to represent the control’s\
    \ items. Usually many of these controls are bound to the properties of whatever\
    \ item the control is currently displaying.\n\nThe Planets example program shown\
    \ in the next figure displays an array of Planet objects in a ListBox on the left\
    \ and in a ComboBox on the right.\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_110_0.png)\n\
    \nThe following code shows the ItemTemplate used by the program’s ListBox:\n\n\
    Available for download on Virox.com\n\n```\n<ListBox.ItemTemplate>\n  <DataTemplate>\n\
    \    <DataTemplate.Resources>\n      <!--  The ListBoxItem style must be set in\
    \ ListBox.Resources.  -->\n      <Style TargetType=\"TextBlock\">\n        <Setter\
    \ Property=\"Margin\" Value=\"3\"/>\n        <Setter Property=\"HorizontalAlignment\"\
    \ Value=\"Left\"/>\n        <Setter Property=\"VerticalAlignment\" Value=\"Center\"\
    />\n        <Setter Property=\"FontSize\" Value=\"20\"/>\n        <Setter Property=\"\
    FontWeight\" Value=\"Bold\"/>\n        <Setter Property=\"Foreground\" Value=\"\
    Blue\"/>\n      </Style>\n      <Style TargetType=\"Image\">\n        <Setter\
    \ Property=\"Height\" Value=\"50\"/>\n        <Setter Property=\"Margin\" Value=\"\
    3\"/>\n        <Setter Property=\"Stretch\" Value=\"Uniform\"/>\n        <Setter\
    \ Property=\"HorizontalAlignment\" Value=\"Right\"/>\n      </Style>\n      <Style\
    \ TargetType=\"TextBox\">\n        <Setter Property=\"Margin\" Value=\"3\"/>\n\
    \        <Setter Property=\"Width\" Value=\"250\"/>\n        <Setter Property=\"\
    Background\" Value=\"SkyBlue\"/>\n        <Setter Property=\"TextWrapping\" Value=\"\
    Wrap\"/>\n        <Setter Property=\"IsReadOnly\" Value=\"True\"/>\n      </Style>\n\
    ```"
  merge: -1
  img_proc: true
