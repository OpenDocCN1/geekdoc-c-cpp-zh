- pgno: 21
  md: "Now a class implementing the IPerson interface must fulfill all the contract\
    \ requirements. The class Person is a simple implementation of the interface that\
    \ fulfills the contract.\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_21_0.png)\n\
    \n```\n```csharp\npublic class Person : IPerson\n{\n    public Person(string firstName,\
    \ string lastName)\n    {\n        this.FirstName = firstName;\n        this.LastName\
    \ = lastName;\n    }\n\n    public string FirstName { get; private set; }\n  \
    \  public string LastName { get; private set; }\n    public int Age { get; set;\
    \ }\n\n    public void ChangeName(string firstName, string lastName)\n    {\n\
    \        this.FirstName = firstName;\n        this.LastName = lastName;\n    }\n\
    }\n```\n```\n\nPro C# 9780470502259 code snippet CodeContractsSamples/Person.cs\n\
    \nWhen using the class Person, the contract must also be fulfilled. For example,\
    \ it's not allowed to assign null to a property:\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_21_1.png)\n\
    \n```\n```csharp\nvar p = new Person { FirstName = \"Tom\", LastName = null };\
    \ // contract error\n```\n```\n\nPro C# 9780470502259 code snippet CodeContractsSamples/Program.cs\n\
    \nIt's also not allowed to assign an invalid value to the Age property:\n\n```\n\
    ```csharp\nvar p = new Person { FirstName = \"Tom\", LastName = \"Turbo\" };\n\
    p.Age = 133; // contract error\n```\n```\n\n# TASKS\n\n.NET 4 includes the new\
    \ namespace System.Threading.Tasks, which contains classes to abstract threading\
    \ functionality. Behind the scenes, ThreadPool is used. A task represents some\
    \ unit of work that should be done. This unit of work can run in a separate thread;\
    \ and it is also possible to start a task in a synchronized manner, which results\
    \ in a wait for the calling thread. With tasks, you have an abstraction layer\
    \ but also a lot of control over the underlying threads.\n\nTasks allow much more\
    \ flexibility in organizing the work you need to do. For example, you can define\
    \ continuation work — what should be done after a task is complete. This can be\
    \ differentiated whether the task was successful or not. Also, you can organize\
    \ tasks in a hierarchy. For example, a parent task can create new children tasks.\
    \ This can create a dependency, so that canceling a parent task also cancels its\
    \ child tasks."
