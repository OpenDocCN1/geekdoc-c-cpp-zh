    \n# PRINTING VISUAL OBJECTS\n\nOne of the central classes for printing in WPF\
    \ is PrintDialog. This class provides methods for letting the user pick a printer,\
    \ interacting with print queues, and sending output to the printer.\n\nNormally\
    \ there are three steps to printing:\n\n+   1. Create a new PrintDialog object\
    \ and use its ShowDialog method to display it to the user.\n+   2. Check ShowDialog's\
    \ return result to see if the user clicked OK.\n+   3. Use the PrintDialog's methods\
    \ to generate a printout."
