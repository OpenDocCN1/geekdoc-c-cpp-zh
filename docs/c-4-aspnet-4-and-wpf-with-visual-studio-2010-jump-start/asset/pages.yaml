  md: "![](img/7954dcc7dd1d929d072aec8e9531b6cc_78_0.png)\n\nUsing resources simplifies\
    \ the code by converting relatively complex property elements into simpler attribute\
    \ elements.\n\nThe resources also allow you to easily change the appearance of\
    \ all of the buttons at once.\n\n# Merged Resource Dictionaries\n\nA resource\
    \ dictionary lets several controls share the same values. Merged resource dictionaries\
    \ let several windows or even applications share the same resource values.\n\n\
    To merge a resource dictionary, create a XAML file that has a ResourceDictionary\
    \ object as its root element. Give the element namespace attributes as you would\
    \ a Window, and place resources inside the dictionary.\n\nThe following code shows\
    \ part of a resource dictionary file named RectangleResources.xaml. This file\
    \ defines resources that the MultiWindowResources example program uses to define\
    \ Rectangle properties. (To save space, I've omitted some of the resources.)\n\
    \n![](img/7954dcc7dd1d929d072aec8e9531b6cc_78_1.png)\n\n```\n```xml\n<ResourceDictionary\n\
    xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\nxmlns:x=\"\
    http://schemas.microsoft.com/winfx/2006/xaml\"\nxmlns:sys=\"clr-namespace:System;assembly=mscorlib\"\
    >\n<!-- Resource dictionary entries should be defined here. -->\n<sys:Double x:Key=\"\
    rectWidth\">140</sys:Double>\n<sys:Double x:Key=\"rectHeight\">50</sys:Double>\n\
    <sys:Double x:Key=\"rectRadX\">5</sys:Double>\n<sys:Double x:Key=\"rectRadY\"\
    >20</sys:Double>\n... More resources omitted ...\n</ResourceDictionary>\n```\n\
    ```\n\nThe following code shows how the MultiWindowResources program uses this\
    \ resource dictionary. The Window1 XAML file uses a ResourceDictionary.MergedDictionaries\
    \ element that contains a reference to the dictionary file.\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_78_2.png)\n\
    \n```\n```xml\n<Window.Resources>\n  <ResourceDictionary>\n    <ResourceDictionary.MergedDictionaries>\n\
    \      <ResourceDictionary Source=\"RectangleResources.xaml\"/>\n    </ResourceDictionary.MergedDictionaries>\n\
    \  </ResourceDictionary>\n</Window.Resources>\n```\n```"
