    \ web page at msdn.microsoft.com/cc278075 (VS.95).aspx. That page provides links\
    \ to other pages that describe the features available to different control templates.\n\
    \nThese web pages also show the default templates used by the controls. The Button\
    \ control’s default template is 84 lines long and fairly complicated. Some are\
