    \n```\nstatic void Main()\n{\n    //...\n    IDisplay<Shape> shapeDisplay = new\
    \ ShapeDisplay();\n    IDisplay<Rectangle> rectangleDisplay = shapeDisplay;\n\
    \    rectangleDisplay.Show(rectangles[0]);\n}\n```\n\nPro C# 4 9780470502259 code\
    \ snippet Variance/Program.cs\n\n# TUPLES\n\nArrays combine objects of the same\
    \ type; tuples can combine objects of different types. Tuples have the origin\
    \ in functional programming languages such as F# where they are used often. With\
    \ .NET 4, tuples are available with the .NET Framework for all .NET languages.\n\
    \n.NET 4 defines eight generic Tuple classes and one static Tuple class that act\
    \ as a factory of tuples. The different generic Tuple classes are here for supporting\
    \ a different number of elements; e.g., Tuple<T1> contains one element, Tuple<T1,\
    \ T2> contains two elements, and so on.\n\nThe method Divide() demonstrates returning\
    \ a tuple with two members — Tuple<int, int>. The parameters of the generic class\
    \ define the types of the members, which are both integers. The tuple is created\
    \ with the static Create() method of the static Tuple class. Again, the generic\
    \ parameters of the Create() method define the type of tuple that is instantiated.\
    \ The newly created tuple is initialized with the result and reminder variables\
    \ to return the result of the division:\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_9_1.png)\n\
    \n```\npublic static Tuple<int, int> Divide(int dividend, int divisor)\n{\n  \
    \  int result = dividend / divisor;\n    int reminder = dividend % divisor;\n\
    \    return Tuple.Create<int, int>(result, reminder);\n}\n```\n\nPro C# 4 9780470502259\
    \ code snippet TuplesSample/Program.cs"
