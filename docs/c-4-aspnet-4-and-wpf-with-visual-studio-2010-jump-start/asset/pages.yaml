  md: "The following code shows invoking the Divide() method. The items of the tuple\
    \ can be accessed with the properties Item1 and Item2;\n\n```\n```csharp\nvar\
    \ result = Divide(5, 2);\nConsole.WriteLine(\"result of division: {0}, reminder:\
    \ {1}\",\n    result.Item1, result.Item2);\n```\n```\n\nIn case you have more\
    \ than eight items that should be included in a tuple, you can use the Tuple class\
    \ definition with eight parameters. The last template parameter is named TRest\
    \ to indicate that you must pass a tuple itself. That way you can create tuples\
    \ with any number of parameters.\n\nTo demonstrate this functionality:\n\n```\n\
    ```csharp\npublic class Tuple<T1, T2, T3, T4, T5, T6, T7, TRest>\n```\n```\n\n\
    Here, the last template parameter is a tuple type itself, so you can create a\
    \ tuple with any number of items:\n\n```\n```csharp\nvar tuple = Tuple.Create<string,\
    \ string, string, int, int, int, double,\n    Tuple<int, int>>(\n    \"Stephanie\"\
    , \"Alina\", \"Nagel\", 2009, 6, 2, 1.37,\n    Tuple.Create<int, int>(52, 3490));\n\
    ```\n```\n\n# THE DYNAMIC TYPE\n\nThe dynamic type allows you to write code that\
    \ will bypass compile time type checking. The compiler will assume that whatever\
    \ operation is defined for an object of type dynamic is valid. If that operation\
    \ isn't valid, the error won't be detected until runtime. This is shown in the\
    \ following example:\n\n```\n```csharp\nclass Program\n{\n    static void Main(string[]\
    \ args)\n    {\n        var staticPerson = new Person();\n        dynamic dynamicPerson\
    \ = new Person();\n        staticPerson.GetFullName(\"John\", \"Smith\");\n  \
    \      dynamicPerson.GetFullName(\"John\", \"Smith\");\n    }\n}\nclass Person\n\
    {\n    public string FirstName { get; set; }\n    public string LastName { get;\
    \ set; }\n    public string GetFullName()\n    {\n        return string.Concat(FirstName,\
    \ \" \", LastName);\n    }\n}\n```\n```\n\nThis example will not compile because\
    \ of the call to staticPerson.GetFullName(). There isn't a method on the Person\
    \ object that takes two parameters, so the compiler raises the error. If that\
    \ line of code were to be commented out, the example would compile. If executed,\
    \ a runtime error"
