- pgno: 48
  md: "After you have your custom implementation in place, the next step is to configure\
    \ this in a configuration file: the machine.config or the web.config file. Some\
    \ changes have been made to the <outputCache> element in the configuration file\
    \ to allow you to apply your custom cache extensions.\n\nThe <outputCache> element\
    \ is found within the <caching> section of the configuration file and it now includes\
    \ a new <providers> subelement.\n\n```\n<caching>\n  <outputCache>\n    <providers>\n\
    \    </providers>\n  </outputCache>\n</caching>\n```\n\nWithin the new <providers>\
    \ element, you can nest an <add> element to make the appropriate references to\
    \ your new output cache capability you built by deriving from the OutputCacheProvider\
    \ class.\n\n```\n<caching>\n  <outputCache defaultProvider=\"AspNetInternalProvider\"\
    >\n    <providers>\n      <add name=\"myDistributedCacheExtension\"\n        \
    \   type=\"Wrox.OutputCacheExtension.DistributedCacheProvider,\n           DistributedCacheProvider\"\
    \ />\n    </providers>\n  </outputCache>\n</caching>\n```\n\nWith this new <add>\
    \ element in place, your new extended output cache is available to use. One new\
    \ addition here to also pay attention to is the new defaultProvider attribute\
    \ within the <outputCache> element. In this case, it is set to AspNetInternalProvider,\
    \ which is the default setting in the configuration file. This means that by default\
    \ the output cache works as it always has done and stores its cache in the memory\
    \ of the computer that the program is running.\n\nWith your own output cache provider\
    \ in place, you can now point to this provider through the OutputCache directive\
    \ on the page as defined here:\n\n```\n<%@ OutputCache Duration=\"90\" VaryByParam=\"\
    *\"\n    providerName=\"myDistributedCacheExtension\" %>\n```\n\nIf the provider\
    \ name isn't defined, then the provider that is defined in the configuration's\
    \ defaultProvider attribute is utilized.\n\n# .NET 4'S NEW OBJECT CACHING OPTION\n\
    \nFrom what you have seen so far with the System.Web.Caching.Cache object, you\
    \ can see that it is quite powerful and allows for you to even create a custom\
    \ cache. This extensibility and power has changed under the hood of the Cache\
    \ object, though.\n\nDriving this is the System.Runtime.Caching.dll, as what was\
    \ in the System.Web version has been refactored out and everything was rebuilt\
    \ into the new namespace of System.Runtime.Caching."
  merge: -1
  img_proc: true
- pgno: 49
  md: "The reason for this change wasn’t so much for the ASP.NET developer, but instead\
    \ for other applica-\ntion types such as Windows Forms, Windows Presentation Foundation\
    \ apps, and more. The reason\nfor this is that the System.Web.Caching.Cache object\
    \ was so useful that other application devel-\nopers were bringing over the System.Web\
    \ namespace into their projects to make use of this object.\nSo, to get away from\
    \ a Windows Forms developer needing to bring the System.Web.dll into their\nproject\
    \ just to use the Cache object it provided, this was all extracted out and extended\
    \ with the\nSystem.Runtime.Caching namespace.\n\nAs an ASP.NET developer, you\
    \ can still make use of the System.Web.Caching.Cache object just\nas you did in\
    \ all the prior versions of ASP.NET. It isn’t going away. However, it is important\
    \ to\nnote that as the .NET Framework evolves, the .NET team will be making its\
