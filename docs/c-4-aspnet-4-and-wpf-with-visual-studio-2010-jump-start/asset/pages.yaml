    Pro C# 4 9780470502259 code snippet CodeContractsSamples\\IPerson.cs\n\nThe class\
    \ PersonContract implements the interface IPerson and defines code contracts for\
    \ all the members. The attribute PureAttribute means that the method or property\
    \ may not change state of a class instance. This is defined with the get accessors\
    \ of the properties but can also be defined with all methods that are not allowed\
    \ to change state. The FirstName and LastName get accessors also define that the\
    \ result must be a string with Contract.Result(). The get accessor of the Age\
    \ property defines a postcondition and ensures that the returned value is between\
    \ 0 and 120. The set accessor of the FirstName and LastName properties requires\
    \ that the value passed is not null. The set accessor of the Age property defines\
    \ a precondition that the passed value is between 0 and 120.\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_20_0.png)\n\
    \n```\n```csharp\n[ContractClassFor(typeof(IPerson))]\npublic sealed class PersonContract\
    \ : IPerson\n{\n    string IPerson.FirstName\n    {\n        [Pure] get { return\
    \ Contract.Result<String>(); }\n        set { Contract.Requires(value != null);\
    \ }\n    }\n    string IPerson.LastName\n    {\n        [Pure] get { return Contract.Result<String>();\
    \ }\n        set { Contract.Requires(value != null); }\n    }\n    int IPerson.Age\n\
    \    {\n        [Pure]\n        get\n        {\n            Contract.Ensures(Contract.Result<int>()\
    \ >= 0 &&\n                             Contract.Result<int>() < 121);\n     \
    \       return Contract.Result<int>();\n        }\n        set\n        {\n  \
    \          Contract.Requires(value >= 0 && value < 121);\n        }\n    }\n \
    \   void IPerson.ChangeName(string firstName, string lastName)\n    {\n      \
    \  Contract.Requires(firstName != null);\n        Contract.Requires(lastName !=\
    \ null);\n    }\n}\n```\n```\n\nPro C# 4 9780470502259 code snippet CodeContractsSamples\\\
    PersonContract.cs"
