  md: "![](img/7954dcc7dd1d929d072aec8e9531b6cc_102_0.png)\n\nThe SimplePrintWindow\
    \ example program uses the following code to perform these three steps:\n\n```\n\
    // Display the print dialog.\nPrintDialog pd = new PrintDialog();\n\n// See if\
    \ the user clicked OK.\nif (pd.ShowDialog() == true)\n{\n    // Print.\n    pd.PrintVisual(this,\
    \ \"New Customer\");\n}\n```\n\nWPF Programmer's Reference 9780470477229 SimplePrintWindow\n\
    \nThis is remarkably simple, but it has an unfortunate drawback: WPF tries to\
    \ draw the visual in the upper-left corner of the paper. Since printers generally\
    \ cannot print all the way to the edges of the paper, the result is chopped off.\n\
    \nRather than passing the program's window into the PrintVisual method, you can\
    \ make a hierarchy of controls that contains an image of the window. That hierarchy\
    \ can use Grids, Viewboxes, Images, Rectangles, and any other control that you\
    \ want to produce the results. It can even include extra controls to produce such\
    \ items as a page header and footer.\n\nThe PrintWindow example program shown\
    \ in the next figure uses this approach to print its window centered at either\
    \ normal or enlarged scale. Click on the “Print Centered” button to print the\
    \ window at its normal scale. Click on the “Print Stretched” button to print the\
