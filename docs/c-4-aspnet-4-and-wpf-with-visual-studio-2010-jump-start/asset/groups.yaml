    A *property trigger* 在控件的属性具有特定值时采取行动。\n\n与之相反，*event trigger* 在控件事件发生时采取行动。与在\
    \ IsMouseOver 属性为 True 时采取行动不同，事件触发器可能在 MouseEnter 事件触发时采取行动，表示鼠标移入了控件。另一个事件可能在\
