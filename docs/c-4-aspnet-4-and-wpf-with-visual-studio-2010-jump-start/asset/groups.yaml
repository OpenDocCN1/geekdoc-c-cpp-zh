    Program.cs\n\n## 取消框架\n\n.NET 4 包含一个新的取消框架，以标准方式允许取消长时间运行的任务。每个阻塞调用都应支持此机制。当然，截至目前，并非每个阻塞调用都实现了这项新技术，但越来越多地实现了。已经提供此机制的技术包括任务、并发集合类和\
    \ Parallel LINQ，以及几种同步机制。\n\n取消框架基于协作行为；它不是强制性的。长时间运行的任务会检查是否被取消并返回控制权。\n\n支持取消的方法接受一个\
    \ `CancellationToken` 参数。此类定义了属性 `IsCancellationRequested`，长时间操作可以在其中检查是否应中止。长时间操作检查取消的其他方式是使用在令牌被取消时发出信号的\
    \ `WaitHandle` 属性，或使用 `Register()` 方法。`Register()` 方法接受类型为 `Action` 和 `ICancelableOperation`\
    \ 的参数。当令牌被取消时，由 `Action` 委托引用的方法将被调用。这类似于 `ICancelableOperation`，其中在取消完成时实现此接口的对象的\
    \ `Cancel()` 方法将被调用。\n\n### Parallel.For 的取消\n\n让我们从一个使用 `Parallel.For()` 方法的简单示例开始。`Parallel`\
    \ 类为 `For()` 方法提供了重载，其中可以传递类型为 `ParallelOptions` 的参数。使用 `ParallelOptions`，可以传递一个\
    \ `CancellationToken`。`CancellationToken` 是通过创建 `CancellationTokenSource` 生成的。`CancellationTokenSource`\
    \ 实现接口 `ICancelableOperation`，因此可以与 `CancellationToken` 注册并允许通过 `Cancel()` 方法取消。为了取消并行循环，会创建一个新任务，在\
    \ 500 毫秒后调用 `CancellationTokenSource` 的 `Cancel()` 方法。\n\n在 `For()` 循环的实现中，`Parallel`\
    \ 类会验证 `CancellationToken` 的结果并取消操作。取消后，`For()` 方法会抛出类型为 `OperationCanceledException`\
    \ 的异常，在示例中会被捕获。使用 `CancellationToken`，可以注册在取消完成时获取信息。这是通过调用 `Register()` 方法并传递在取消时被调用的委托来实现的。\n\
    \n![](img/7954dcc7dd1d929d072aec8e9531b6cc_30_0.png)\n\n```csharp\nvar cts = new\
    \ CancellationTokenSource();\ncts.Token.Register(() => \n    Console.WriteLine(\"\
    *** token canceled\"));\n\n// start a task that sends a cancel after 500 ms\n\
    new Task(() => \n{\n    Thread.Sleep(500);\n    cts.Cancel(false);\n}).Start();\n\
    \ntry\n{\n    ParallelLoopResult result = \n        Parallel.For(0, 100,\n   \
    \         new ParallelOptions()\n            {\n                CancellationToken\
    \ = cts.Token,\n            },\n            x =>\n            {\n            \
    \    Console.WriteLine(\"loop {0} started\", x);\n                int sum = 0;\n\
    \                for (int i = 0; i < 100; i++)\n                {\n          \
    \          Thread.Sleep(2);\n                    sum += i;\n                }\n\
    \                Console.WriteLine(\"loop {0} finished\", x);\n            });\n\
    }\ncatch (OperationCanceledException ex)\n{\n    Console.WriteLine(ex.Message);\n\
    }\n```\n\nPro C# 4 9780470502259 代码片段 CancellationSamples/Program.cs\n\n运行应用程序时，您将获得类似以下输出。迭代\
    \ 0、1、25、26、50、51、75 和 76 都已启动。这是在四核 CPU 系统上进行的。由于取消，所有其他迭代在启动前被取消。已启动的迭代被允许完成，因为取消始终以协作方式进行，以避免在迭代中途取消时资源泄漏的风险。\n\
    \n```text\nloop 0 started\nloop 50 started\nloop 25 started\nloop 75 started\n\
    loop 50 finished\nloop 25 finished\nloop 0 finished\n```\n\n```text\nloop 1 started\n\
    loop 26 started\nloop 51 started\nloop 75 finished\nloop 76 started\n*** token\
    \ canceled\nloop 1 finished\nloop 51 finished\nloop 26 finished\nloop 76 finished\n\
    The operation was canceled.\n```\n\n### 任务的取消\n\n任务也使用相同的取消模式。首先，创建一个新的 CancellationTokenSource。如果只需要一个取消令牌，可以通过访问\
    \ Task.Factory.CancellationToken 使用默认令牌。然后，与之前的代码类似，会创建一个新任务，在 500 毫秒后通过调用 Cancel()\
    \ 方法向此 cancellationSource 发送取消请求。在循环中执行主要工作的任务通过 TaskFactory 对象接收取消令牌。取消令牌通过在构造函数中设置它分配给\
    \ TaskFactory。任务使用此取消令牌通过检查 CancellationToken 的 IsCancellationRequested 属性来检查是否请求取消。\n\
    \n![](img/7954dcc7dd1d929d072aec8e9531b6cc_31_0.png)\n\n```csharp\nvar cts = new\
    \ CancellationTokenSource();\ncts.Token.Register(() =>\n    Console.WriteLine(\"\
    *** task canceled\"));\n\n// start a task that sends a cancel to the\n// cts after\
    \ 500 ms\nTask.Factory.StartNew(() =>\n{\n    Thread.Sleep(500);\n    cts.Cancel();\n\
    });\n\nvar factory = new TaskFactory(cancellationTokenSource.Token);\nTask t1\
    \ = factory.StartNew(new Action<object>(f =>\n{\n    Console.WriteLine(\"in task\"\
    );\n    for (int i = 0; i < 20; i++)\n    {\n        Thread.Sleep(100);\n    \
    \    CancellationToken ct = (f as TaskFactory).CancellationToken;\n        if\
    \ (ct.IsCancellationRequested)\n        {\n            Console.WriteLine(\"canceling\
    \ was requested, \" +\n                \"canceling from within the task\");\n\
    \            ct.ThrowIfCancellationRequested();\n            break;\n        }\n\
    \        Console.WriteLine(\"in loop\");\n    }\n    Console.WriteLine(\"task\
    \ finished without cancellation\");\n}), factory, cts.Token);\n\ntry\n{\n    t1.Wait();\n\
    }\ncatch (Exception ex)\n{\n    Console.WriteLine(\"exception: {0}, {1}\", ex.GetType().Name,\n\
    \        ex.Message);\n    if (ex.InnerException != null)\n    {\n        Console.WriteLine(\"\
    inner exception: {0}, {1}\",\n            ex.InnerException.GetType().Name,\n\
    \            ex.InnerException.Message);\n    }\n    Console.WriteLine(\"status\
    \ of the task: {0}\", t1.Status);\n}\n```\n\nPro C# 4 9780470502259 代码片段 CancellationSamples/Program.cs\n\
    \n运行应用程序时，可以看到任务启动，运行几个循环，然后收到取消请求。任务被取消并抛出 TaskCanceledException，该异常由方法调用 `ThrowIfCancellationRequested()`\
    \ 引发。调用方等待任务时，可以看到异常 AggregateException 被捕获，并且包含内部异常 TaskCanceledException。这用于取消的层次结构，例如，如果在也被取消的任务中运行\
    \ Parallel.For。任务的最终状态为 Canceled。\n\n```text\n    in task\n    in loop\n    in\
    \ loop\n    in loop\n    in loop\n    *** task canceled\n    canceling was requested,\
    \ canceling from within the task\n    exception AggregateException, One or more\
    \ errors occurred.\n    inner exception TaskCanceledException, A task was canceled.\n\
    \    status of the task: Canceled\n```\n\n## 任务栏和跳转列表\n\nWindows 7 有一个新的任务栏。在任务栏中，您不仅可以看到正在运行的应用程序，还可以看到快速访问图标。用户可以将最常用的应用程序固定以便快速访问。当您将鼠标悬停在任务栏项目上时，可以看到当前正在运行的应用程序的预览。项目还可以具有视觉状态，以便用户可以从任务栏项目接收反馈。您是否使用资源管理器复制了一些大文件？您可以在资源管理器项目上看到进度信息。进度信息以视觉状态显示。任务栏的另一个功能是跳转列表。右键单击任务栏按钮会打开跳转列表。此列表可按应用程序自定义。使用\
    \ Microsoft Outlook，您可以直接进入收件箱、日历、联系人和任务，或创建新电子邮件。使用 Microsoft Word，您可以打开最近的文档。\n"
