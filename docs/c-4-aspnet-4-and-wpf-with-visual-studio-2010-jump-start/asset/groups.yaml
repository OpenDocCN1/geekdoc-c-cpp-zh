    ## ASP.NET MVC


    Model-View-Controller (MVC) has been an important architectural pattern in computer
    science for many years. Originally named Thing-Model-View-Editor in 1979, it was
    later simplified to Model-View-Controller. It is a powerful and elegant means
    of separating concerns within an application and applies itself extremely well
    to Web applications. Its explicit separation of concerns does add a small amount
    of extra complexity to an application''s design, but the extraordinary benefits
    outweigh the extra effort. It''s been used in dozens of frameworks since its introduction.
    You can find MVC in Java and C++, on Mac and on Windows, and inside literally
    dozens of frameworks.


    Understanding the core concepts of MVC is critical to using it effectively. This
    section discusses the history of the MVC pattern, as well as how it is used in
    Web programming today.


    ASP.NET MVC 1.0 shipped as a downloadable add-on to Visual Studio 2008. Now in
    Visual Studio 2010, ASP.NET MVC 2 ships built-in. This section also covers some
    of the limitations of ASP.NET Web forms and how ASP.NET MVC attempts to release
    the developer from those limitations.


    > The content of this selection is adapted from Professional ASP.NET MVC 1.0 by
    Rob Conery, Scott Hanselman, Phil Haack, and Scott Guthrie (Wiley, 2009). For
    more in-depth coverage of this topic, we recommend you check out that book.


    ## Defining Model-View-Controller


    Model-View-Controller (MVC) is an architectural pattern used to separate an application
    into three main aspects:


    - The Model: A set of classes that describes the data you''re working with as
    well as the business rules for how the data can be changed and manipulated

    - The View: The application''s user interface (UI)

    - The Controller: A set of classes that handles communication from the user, overall
    application flow, and application-specific logic


    This pattern is used frequently in Web programming. With ASP.NET MVC, it''s translated
    roughly to the following:


    - The Models are the classes that represent the domain in which you are interested.
    These domain objects often encapsulate data stored in a database as well as code
    used to manipulate the data and enforce domain-specific business logic. With ASP.NET
    MVC, this is most likely a data access layer of some kind using a tool like LINQ
    to SQL, Entity Framework, or NHibernate, combined with custom code containing
    domain-specific logic.

    - The View is a dynamically generated page. In ASP.NET MVC, you implement it via
    the `System.Web.Mvc.ViewPage` class, which inherits from `System.Web.UI.Page`.

    - The Controller is a special class that manages the relationship between the
    View and Model. It talks to the Model, and it decides which View to render (if
    any). In ASP.NET MVC, this class is conventionally denoted by the suffix `"Controller."`


    ## PRODUCT TEAM ASIDE


    ScottGu, or “The Gu,” is legendary for prototyping cool stuff, and if he sees
    you in the hallway and he has his laptop, you won’t be able to escape as he says,
    “Dude! Check this out!” His enthusiasm is infectious.


    As the legend goes, at the Austin ALT.NET conference in October of 2007 in Redmond,
    Washington, ScottGu showed a group of developers “this cool thing he wrote on
    a plane” and asked whether they saw the need and what they thought of it. It was
    a hit. In fact, a number of people were involved with the original prototype,
    codenamed “Scalene.” Eilon Lipton e-mailed the first prototype to the team in
    September of 2007, and he and ScottGu bounced prototypes, code, and ideas back
    and forth via e-mail, and still do!


    ## Model-View-Controller and ASP.NET


    ASP.NET MVC relies on many of the same core strategies that the other MVC platforms
    use, plus it offers the benefits of compiled and managed code and exploits new
    language features in .NET 3.5 and above within VB9 and C# such as lambdas and
    anonymous types. Each of the MVC frameworks used on the web usually share in some
    fundamental tenets:


    - Convention over Configuration

    - Don’t repeat yourself (also known as the DRY principle)

    - Plugability whenever possible

    - Try to be helpful, but if necessary, get out of the developer’s way


    ## Serving Methods, Not Files


    Web servers initially served up HTML stored in static files on disk. As dynamic
    Web pages gained prominence, Web servers served HTML generated on the fly from
    dynamic scripts that were also located on disk. With MVC, serving up HTML is a
    little different. The URL tells the routing mechanism which Controller to instantiate
    and which action method to call and supplies the required arguments to that method.
    The Controller’s method then decides which View to use, and that View then does
    the rendering.


    Rather than having a direct relationship between the URL and a file living on
    the Web server’s hard drive, a relationship exists between the URL and a method
    on a controller object. ASP.NET MVC implements the “front controller” variant
    of the MVC pattern, and the Controller sits in front of everything except the
    routing subsystem.


    A good way to conceive of the way that MVC works in a Web scenario is that MVC
    serves up the results of method calls, not dynamically generated (also known as
    scripted) pages. In fact, we heard a speaker once call this “RPC for the Web,”
    which is particularly apt, although quite a bit narrower in scope.

