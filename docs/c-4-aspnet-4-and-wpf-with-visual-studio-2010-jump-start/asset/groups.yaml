  - "[PAGE 95]\n\nOne good source of information is Microsoft’s “Control Styles and\
    \ Templates” web page at msdn.microsoft.com/cc278075 (VS.95).aspx. That page provides\
    \ links to other pages that describe the features available to different control\
    \ templates.\n\nThese web pages also show the default templates used by the controls.\
    \ The Button control’s default template is 84 lines long and fairly complicated.\
    \ Some are much longer and much more complex.\n\nIn addition to using Microsoft’s\
    \ web pages, you can make a control tell you about its template. The ShowTemplate\
    \ example program displays the default template for a control. In the following\
    \ figure, that control is the Slider in the upper-left corner. To see the template\
    \ used by a different kind of control, replace the Slider with a different control,\
    \ name it Target, and run the program.\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_95_0.png)\n\
    \nThe ShowTemplate program uses the following code to display the Target control’s\
    \ template:\n\n```\nprivate void btnShowTemplate_Click(object sender, RoutedEventArgs\
    \ e)\n{\n    XmlWriterSettings writer_settings = new XmlWriterSettings();\n  \
    \  writer_settings.Indent = true;\n    writer_settings.IndentChars = \"    \"\
    ;\n    writer_settings.NewLineOnAttributes = true;\n\n    StringBuilder sb = new\
    \ StringBuilder();\n    XmlWriter xml_writer = XmlWriter.Create(sb, writer_settings);\n\
    \n    XamlWriter.Save(Target.Template, xml_writer);\n\n    txtResult.Text = sb.ToString();\n\
    }\n```\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_95_1.png)"
  - "[PAGE 96]\n\n# SKINS\n\nThemes let a program automatically change to match the\
