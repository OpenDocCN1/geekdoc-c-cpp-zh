    To make building complex scenes easier, it''s helpful to have a library of code-behind
    routines that you can use to build these more complex shapes.


    The RectanglesAndBoxes example program shown in the next figure demonstrates routines
    that draw textured rectangles (the ground), boxes (the truncated pyramids and
    cubes), cylinders and cones (the truncated cone under the globe), and spheres
    (the globe).


    ![](img/7954dcc7dd1d929d072aec8e9531b6cc_125_0.png)


    Unfortunately, some of these routines are fairly long and complicated (drawing
    a sphere and mapping a texture onto it takes some work), so they are not shown
    here. Download the example program from the book''s web page to see the details.


