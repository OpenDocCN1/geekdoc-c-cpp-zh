    require that the normal have length 1. Alternatively, they may call a length 1
    normal a unit normal.


    Note that a triangle has two normals that point in opposite directions. If the
    triangle is lying flat on a table, then one normal points toward the ceiling,
    and the other points toward the floor.


    The right-hand rule lets you use the order of the points that define the triangle
    to determine which normal is which.


    To use the right-hand rule, picture the triangle ABC that you are building in
    3D space. Place your right index finger along the triangle’s first segment AB
    as shown in the next figure. Then bend your middle finger inward so it lies along
    the segment AC. If you’ve done it right, then your thumb (the blue arrow) points
    toward the triangle''s “outside.” The *outer normal* is the normal that lies on
    the same side of the triangle as your thumb.


    ![](img/7954dcc7dd1d929d072aec8e9531b6cc_121_0.png)


    Why should you care about the right-hand rule and outwardly-oriented normals?
    Direct3D uses the triangle''s orientation to decide whether it should draw the
    triangle. If the outwardly-oriented normal points *toward* the camera''s viewing
    position, then Direct3D draws the triangle. If the outwardly-oriented normal points
    *away from* the camera''s viewing position, then Direct3D doesn''t draw the triangle.


    ### Normals


    As you''ll see in the section “Lighting” later, a triangle''s normal not only
    determines whether it''s visible, but it also helps determine the triangle''s
    color. That means more accurate normals give more accurate colors.


    Left to its own devices, Direct3D finds a triangle''s normal by performing some
    calculations using the points that define the triangle. (It lines up its virtual
    fingers to apply the right-hand rule.)


    For objects defined by flat surfaces such as cubes, octahedrons, and other polyhedrons,
    that works well. For smooth surfaces such as spheres, cylinders, and torii (donuts),
    it doesn''t work as well because the normal at one part of a triangle on the object''s
    surface points in a slightly different direction from the normals at other points.


    The `MeshGeometry3D` object''s `Normals` property lets you tell the drawing engine
    what normals to use for the points defined by the object''s `Positions` property.
    The engine still uses the calculated normal to decide whether to draw a triangle,
    but it uses the normals you supply to color the triangle.


    ### TextureCoordinates


    The `TextureCoordinates` property is a collection that determines how points are
    mapped to positions on a material''s surface. You specify a point''s position
    on the surface by giving the coordinates of the point on the brush used by the
    material to draw the surface.


    The two most useful kinds of cameras in WPF are perspective and orthographic.


    In a *perspective view*, parallel lines seem to merge toward a vanishing point
    and objects farther away from the camera appear smaller. Since this is similar
    to the way you see things in real life, the result of a perspective camera is
    more realistic.


    In an *orthographic view*, parallel lines remain parallel and objects that have
    the same size appear to have the same size even if one is farther from the camera
    than another. While this is less *realistic*, orthographic views can be useful
    for engineering diagrams and other drawings where you might want to perform measurements.


    The CameraTypes example program shown in the next figure displays images of the
    same scene with both kinds of cameras.


    ![](img/7954dcc7dd1d929d072aec8e9531b6cc_123_0.png)


    ## Lighting


    The color that you see in a scene depends on both the lights in the scene and
    on the materials used by the objects. The next section discusses materials in
    detail. This section considers only lights.


    WPF provides several kinds of lights that provide different effects. The following
    list summarizes these kinds of lights:


    - **Ambient Light** — This is light that comes from all directions and hits every
    surface equally. It''s the reason you can see what''s under your desk even if
    no light is shining directly there. Most scenes need at least some ambient light.

    - **Directional Light** — This light shines in a particular direction as if the
    light is infinitely far away. Light from the Sun is a close approximation of directional
    light, at least on a local scale, because the Sun is practically infinitely far
    away compared to the objects near you.

    - **Point Light** — This light originates at a point in space and shines radially
    on the objects around it. Note that the light itself is invisible, so you won''t
    see a bright spot as you would if you had a real lightbulb in the scene.

    - **Spot Light** — This light shines a cone into the scene. Objects directly in
    front of the cone receive the full light, with objects farther to the sides receiving
    less.

    '
  mdcn: '

    A `FlowDocument` 对象表示流文档本身。The `FlowDocument` 的子对象必须是派生自 `Block` 类的对象。These include
    `BlockUIContainer`、`List`、`Paragraph`、`Section` 和 `Table`。


    ## 三维绘图


    WPF 依赖于 Microsoft 的 DirectX 技术来提供高质量的多媒体支持。


    我最喜欢 DirectX 的部分之一是 Direct3D，这是一个三维（3D）绘图库。


    下一幅图所示的 TexturedBlock 示例程序显示了一个简单的立方体，其侧面由各种材质制成，放置在砖块和草地上。你可以使用滑块实时旋转场景。


    ![](img/7954dcc7dd1d929d072aec8e9531b6cc_119_0.png)


    不幸的是，编写 Direct3D 代码来显示这类对象相当复杂。第一个也是最烦人的任务之一是弄清楚用户计算机上有哪些图形硬件可用。


    幸运的是，WPF 的 3D 绘图对象会为你处理此设置。


    这并不意味着其余过程很容易。生成一个 3D 场景需要相当多的工作，因为需要考虑许多复杂的因素，但至少 WPF 处理了初始化和重绘。


    下一节解释了简单 3D 场景的基本结构和几何形状。其后的章节将更详细地描述摄像机、光照和材质。


    ## Basic Structure


    `Viewport3D` 控件显示一个 3D 场景。你可以把它想象成通向 3D 空间的一个窗口。


    `Viewport3D` 对象的 `Camera` 属性定义用于查看场景的摄像机。


    `Viewport3D` 应包含一个或多个定义场景中项目的 `ModelVisual3D` 对象。`ModelVisual3D` 的 `Content` 属性应包含视觉对象。


    通常，Content 属性包含一个定义整个场景的单个 GeometryModel3D 对象，或一个包含 GeometryModel3D 对象集合的 Model3DGroup
    对象。


    每个 GeometryModel3D 对象可以定义任意数量的三角形，因此单个 GeometryModel3D 对象可以产生非常复杂的结果。由于三角形甚至不需要相互连接，GeometryModel3D
    可以定义几个独立的物理对象。


    问题在于单个 GeometryModel3D 只能有一个材质，因此任何独立对象都会具有相似的外观。


    “Materials” 部分稍后会更详细地描述材质。


    GeometryModel3D 对象的两个最重要的属性是 Material（刚才已描述）和 Geometry。Geometry 属性应包含一个单个 MeshGeometry3D
    对象，该对象定义构成对象的三角形。


    MeshGeometry3D 有四个定义其三角形的关键属性：Positions、TriangleIndices、Normals 和 TextureCoordinates。以下各节描述这些属性。


    ## Positions


    MeshGeometry3D 的 Positions 属性是一个 3D 点坐标值列表。你可以用空格或逗号分隔列表中的坐标。


    例如，值 "1,0,1 -1,0,1 1,0,-1 -1,0,-1" 定义了 Y = 0 平面中 X 和 Z 为 1 或 -1 的四个点。这定义了一个以原点为中心、宽两单位的正方形。


    ## TriangleIndices


    TriangleIndices 属性给出指向 Positions 数组的索引列表，这些索引给出构成对象三角形的点。请注意，三角形可以自由共享 Positions
    属性定义的点。


    ## Outward Orientation


    垂直指向三角形的向量称为该三角形（或任何其他表面）的法线或表面法线。有时人们要求法线的长度为 1。或者，他们可能称长度为 1 的法线为单位法线。


    请注意，三角形有两个指向相反方向的法线。如果三角形平放在桌子上，则一个法线指向天花板，另一个指向地板。


    右手定则让你可以使用定义三角形的点的顺序来确定哪个法线是哪个。


    要使用右手定则，想象你在 3D 空间中构建的三角形 ABC。按照下一幅图所示，将你的右手食指沿着三角形的第一个线段 AB 放置。然后弯曲你的中指使其沿着线段
    AC。如果操作正确，那么你的拇指（蓝色箭头）指向三角形的“外部”。*外法线* 是与你的拇指位于三角形同一侧的法线。


    ![](img/7954dcc7dd1d929d072aec8e9531b6cc_121_0.png)


    为什么要关心右手定则和朝外的法线？Direct3D 使用三角形的方向来决定是否绘制三角形。如果朝外的法线指向 *朝向* 相机的观察位置，则 Direct3D
    绘制三角形。如果朝外的法线指向 *远离* 相机的观察位置，则 Direct3D 不绘制三角形。


    ### Normals


    正如你在稍后的“Lighting”部分会看到的，三角形的法线不仅决定其是否可见，还有助于确定三角形的颜色。这意味着更精确的法线会产生更精确的颜色。


    处于无人干预状态时，Direct3D 通过使用定义三角形的点进行一些计算来找到三角形的法线。（它排列其虚拟手指以应用右手定则。）


    对于由平面表面定义的物体，如立方体、八面体和其他多面体，这效果很好。对于光滑表面，如球体、圆柱体和圆环（甜甜圈），效果就不太好，因为物体表面上一个三角形某一部分的法线指向与其它点的法线略有不同的方向。


    `MeshGeometry3D` 对象的 `Normals` 属性让你可以告诉绘图引擎对对象 `Positions` 属性定义的点使用哪些法线。引擎仍然使用计算出的法线来决定是否绘制三角形，但它使用你提供的法线来着色三角形。


    ### TextureCoordinates


    `TextureCoordinates` 属性是一个集合，用于确定点如何映射到材质表面的位置。你通过给出材质用于绘制表面的画刷上该点的坐标来指定点在表面上的位置。


    WPF 中最有用的两种摄像机是透视和正交。


    在 *透视视图* 中，平行线似乎向消失点汇聚，离相机更远的物体看起来更小。由于这与你在现实生活中看到事物的方式相似，因此透视相机的结果更真实。


    在 *正交视图* 中，平行线保持平行，并且大小相同的物体看起来大小相同，即使其中一个离相机更远。虽然这更不 *真实*，但正交视图对于工程图和其他可能需要进行测量的绘图很有用。


    下一幅图所示的 CameraTypes 示例程序显示了使用这两种摄像机拍摄的同一场景的图像。


    ![](img/7954dcc7dd1d929d072aec8e9531b6cc_123_0.png)


    ## Lighting


    你在场景中看到的颜色取决于场景中的光线和物体使用的材质。下一节将详细讨论材质。本节仅考虑光线。


    WPF 提供了几种提供不同效果的光线。以下列表总结了这些光线类型：


    - **环境光** — 这是来自各个方向并均匀照射每个表面的光。它是你即使没有光直接照射也能看到桌子底下东西的原因。大多数场景至少需要一些环境光。

    - **平行光** — 这种光沿特定方向照射，就好像光源无限远一样。太阳光是平行光的近似值，至少在局部尺度上是如此，因为与你附近的物体相比，太阳实际上无限遥远。

    - **点光源** — 这种光源自空间中的一点，并向周围物体径向照射。请注意，光本身是不可见的，因此你不会看到明亮的斑点，就像场景中有一个真正的灯泡一样。

    - **聚光灯** — 这种光向场景中投射一个锥形。锥形正前方的物体接收到全部光线，而更靠侧面的物体接收到的光线较少。

    '
