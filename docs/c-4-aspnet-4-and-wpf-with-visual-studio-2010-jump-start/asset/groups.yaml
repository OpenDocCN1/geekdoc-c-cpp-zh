    \  <BeginStoryboard Storyboard=\"{StaticResource sbSmallSize}\" />\n</EventTrigger.Actions>\n\
    </Style.Triggers>\n</Style>\n```\n\n程序可以使用以下代码定义一个使用此样式的按钮：\n\n```xml\n<Button\
    \ Style=\"{StaticResource btnEventSbSize}\"\nContent=\"New Size\"/>\n```\n\n###\
    \ 故事板\n\n现在你已经了解如何启动一个故事板，是时候学习如何构建一个故事板了。故事板是一个对象，用于定义一个或多个动画的时间线。\n\n动画管理属性随时间从一个值到另一个值的过渡。动画可以包含一个开始时间，表示过渡应开始的时间，以及一个持续时间，表示动画应持续多久。\n\
    \n动画类让你指定想要完成的操作，然后忽略其实现方式。你只需说明希望在接下来的 3 秒内将某个属性更改为特定值，动画类就会计算出如何实现。\n\n特定类型的动画处理不同数据类型属性的更改，例如\
    \ Double、Color、String、Thickness 等。\n\n以下代码展示了一个包含五个 DoubleAnimation 对象的简单 Storyboard。这是\
    \ CentralizedTriggers 程序用来将第一个缩略图移入查看区域的 Storyboard。\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_87_0.png)\n\
    \n```xml\n<Storyboard x:Key=\"sbImg1\">\n    <DoubleAnimation Duration=\"0:0:0.5\"\
    \ To=\"120\"\n        Storyboard.TargetName=\"img1\"\n        Storyboard.TargetProperty=\"\
    (Canvas.Left)\" />\n    <DoubleAnimation Duration=\"0:0:0.5\" To=\"0\"\n     \
    \   Storyboard.TargetName=\"img1\"\n        Storyboard.TargetProperty=\"(Canvas.Top)\"\
    \ />\n    <DoubleAnimation Duration=\"0:0:0.5\" To=\"485\"\n        Storyboard.TargetName=\"\
    img1\"\n        Storyboard.TargetProperty=\"Width\" />\n    <DoubleAnimation Duration=\"\
    0:0:0.5\" To=\"400\"\n        Storyboard.TargetName=\"img1\"\n        Storyboard.TargetProperty=\"\
    Height\" />\n    <DoubleAnimation Duration=\"0:0:0.5\" To=\"1\"\n        Storyboard.TargetName=\"\
    img1\"\n        Storyboard.TargetProperty=\"Opacity\" />\n</Storyboard>\n```\n\
    \n第一个动画使控件 `img1` 的 `Canvas.Left` 属性从其当前值（无论是什么）在一 0.5 秒间隔内变为 120。第二个动画类似地在相同的\
    \ 0.5 秒内将控件的 `Canvas.Top` 属性更改为 0。\n\n第三个和第四个动画分别将 `img1` 控件的 `Width` 和 `Height`\
    \ 属性更改为 485 和 400。最后一个动画将控件的 `Opacity` 更改为 1，使其完全不透明。\n\n### 动画类型\n\nWPF 提供了许多用于为不同数据类型属性设置动画的类。以下表格列出了具有对应动画类的\
    \ 数据类型。例如，你可以使用 `Int32Animation` 类为 32 位整数属性设置动画。\n\n|  |  |  |  |\n|---|---|---|---|\n\
    | Boolean | Int16 | Point3D | String |\n| Byte | Int32 | Quaternion | Thickness\
    \ |\n| Char | Int64 | Rect | Vector |\n| Color | Matrix | Rotation3D | Vector3D\
    \ |\n| Decimal | Object | Single |  |\n| Double | Point | Size |  |\n\n这些数据类型大多数都有两种动画类。第一种后缀为\
    \ `Animation`，执行属性值的简单线性插值，使得属性值根据已用时间在起始值和结束值之间按比例设置。当 `Duration` 过了 1/4 时，值将处于起始值和结束值之间四分之一的位置。\n\
    \n第二种动画类的后缀为 `AnimationUsingKeyFrames`。这种类型的动画在访问中间的特定关键值时将属性从一个值更改为另一个值。你可以使用几种不同的对象来指定关键帧值，而关键帧类的类型决定了动画如何移动到帧的值。\n\
    \n最常见的关键帧对象类型以线性方式、使用样条曲线或离散方式移动到其关键值。一些其他关键帧动画可以使它们的值沿路径跟随。\n\n例如，你可以使用路径动画将控件沿椭圆边框或一系列曲线移动。\n\
    \n此处所示的 RovingButtonWithPath 示例程序将一个 `Button` 沿黑色所示的路径移动。随着移动，`Button` 会旋转以匹配该点曲线的角度。\n\
    \n![](img/7954dcc7dd1d929d072aec8e9531b6cc_88_0.png)\n\nRovingButtonWithPath 程序使用以下代码为其\
    \ Button 设置动画：\n\n```xml\n<PathGeometry x:Key=\"pathMove\"\nFigures=\"M 10,85\n\
    A 100,70 0 1 1 210,85\nA 100,70 0 1 0 410,85\nA 130,70 0 1 0 150,85\nA 70,70 0\
    \ 1 1 10,85\"/>\n<Storyboard x:Key=\"sbMoveButton\" RepeatBehavior=\"Forever\"\
    >\n<DoubleAnimationUsingPath Duration=\"0:0:4\"\nStoryboard.TargetName=\"btnMover\"\
    \nStoryboard.TargetProperty=\"(Canvas.Left)\"\nSource=\"X\"\nPathGeometry=\"{StaticResource\
    \ pathMove}\"/>\n<DoubleAnimationUsingPath Duration=\"0:0:4\"\nStoryboard.TargetName=\"\
    btnMover\"\nStoryboard.TargetProperty=\"(Canvas.Top)\"\nSource=\"Y\"\nPathGeometry=\"\
    {StaticResource pathMove}\"/>\n<DoubleAnimationUsingPath Duration=\"0:0:4\"\n\
    Storyboard.TargetName=\"btnMover\"\nStoryboard.TargetProperty=\"RenderTransform.Angle\"\
    \nSource=\"Angle\"\nPathGeometry=\"{StaticResource pathMove}\"/>\n</Storyboard>\n\
    ```\n\nWPF 程序员参考 9780470477229 RovingButtonWithPath\n\n代码首先创建了一个 PathGeometry\
    \ 对象来定义路径。然后在 sbMoveButton Storyboard 中使用该对象。\n\nStoryboard 的第一个 DoubleAnimationUsingPath\
    \ 对象更改 Button 的 Canvas.Left 属性。Source 属性指示属性应随着动画沿路径进行而设置为路径的 X 坐标。\n\n类似地，第二个\
    \ DoubleAnimationUsingPath 对象使 Button 的 Canvas.Top 属性随着动画进行而匹配路径的 Y 坐标。\n\nButton\
    \ 的定义包含一个 RenderTransform 对象，该对象最初将 Button 旋转 -90 度。最后一个动画对象使 Button 的 `RenderTransform.Angle`\
    \ 属性在动画期间匹配路径的 Angle。\n\n### 媒体与时间线\n\nBeginStoryboard、PauseStoryboard 以及其他 Storyboard\
    \ 控制类实际上只是操作包装器——执行操作的对象，而不是表示“物理”对象（如按钮、标签和网格）。另一个有用的操作包装器是 SoundPlayerAction，它播放音频文件。\n\
    \n下一幅图中所显示的 BouncingBall 示例程序使用以下 Storyboard 使其红色球上下弹跳，并在球每次撞击“地面”时播放音效。\n\n```xml\n\
    <!-- One Storyboard to rule them all. -->\n<Storyboard x:Key=\"sbBounce\" RepeatBehavior=\"\
    Forever\">\n<!-- Play the sound after 1 second. -->\n<ParallelTimeline BeginTime=\"\
    0:0:0\">\n<MediaTimeline BeginTime=\"0:0:1\" Source=\"boing.wav\"\n```\n"
