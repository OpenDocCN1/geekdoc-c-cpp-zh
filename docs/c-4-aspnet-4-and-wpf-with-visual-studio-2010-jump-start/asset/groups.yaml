  md: "\n## Continuation Tasks\n\nWith tasks, you can specify that after a task is\
    \ finished another specific task should start to run, for example, a new task\
    \ that uses a result from the previous one or that should do some cleanup if the\
    \ previous task failed.\n\nWhereas the task handler has either no parameter or\
    \ one object parameter, the continuation handler has a parameter of type `Task`.\
    \ Here, you can access information about the originating task.\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_23_0.png)\n\
    \n```csharp\nstatic void DoOnFirst()\n{\n    Console.WriteLine(\"doing some task\
    \ {0}\", Task.CurrentId);\n    Thread.Sleep(3000);\n}\n\nstatic void DoOnSecond(Task\
    \ t)\n{\n    Console.WriteLine(\"task {0} finished\", t.Id);\n    Console.WriteLine(\"\
    this task id {0}\", Task.CurrentId);\n    Console.WriteLine(\"do some cleanup\"\
    );\n    Thread.Sleep(3000);\n}\n```\n\n> *Pro C# 4 9780470502259 code snippet\
    \ TaskSamples/Program.cs*\n\nA continuation task is defined by invoking the `ContinueWith`\
    \ method on a task. You could also use the `TaskFactory` for this. `t1.ContinueWith(DoOnSecond)`\
    \ means that a new task invoking the method `DoOnSecond()` should be started as\
    \ soon as the task `t1` is finished. You can start multiple tasks when one task\
    \ is finished, and a continuation task can also have another continuation task,\
    \ as this example demonstrates.\n\n```csharp\nTask t1 = new Task(DoOnFirst);\n\
    Task t2 = t1.ContinueWith(DoOnSecond);\nTask t3 = t1.ContinueWith(DoOnSecond);\n\
    Task t4 = t2.ContinueWith(DoOnSecond);\n```\n\nThe continuation tasks so far were\
    \ always started when the previous task was finished, no matter how the previous\
    \ task was finished. With values from `TaskContinuationOptions`, you can define\
    \ that a continuation task should only start if the originating task was successful\
    \ (or faulted). Some of the possible values are `OnlyOnFaulted`, `NotOnFaulted`,\
    \ `OnlyOnCanceled`, `NotOnCanceled`, and `OnlyOnRanToCompletion`.\n\n```csharp\n\
    Task t5 = t1.ContinueWith(DoOnError,\n                        TaskContinuationOptions.OnlyOnFaulted);\n\
    ```\n\n## Task Hierarchies\n\nWith task continuations, one task is started after\
    \ another. Tasks can also form a hierarchy. When a task itself starts a new task,\
    \ a parent/child hierarchy is started.\n\nIn the code snippet that follows, within\
    \ the task of the parent, a new task is created. The code to create a child task\
    \ is the same as creating a parent task. The only difference is that the task\
    \ is created from within another task.\n\n> Tuples are explained earlier in the\
    \ \"Tuples\" section.\n\nWhen defining a task to invoke the method TaskWithResult,\
    \ the generic class `Task<Result>` is used. The generic parameter defines the\
    \ return type. With the constructor, the method is passed to the Func delegate,\
    \ and the second parameter defines the input value. Because this task needs two\
    \ input values in the object parameter, a tuple is created as well. Next, the\
    \ task is started. The Result property of the Task instance t1 blocks and waits\
    \ until the task is completed. Upon task completion, the Result property contains\
    \ the result from the task.\n\n```csharp\nvar t1 = new Task<Tuple<int,int>>(TaskWithResult,\n\
    \    Tuple.Create<int, int>(8, 3));\nt1.Start();\nConsole.WriteLine(t1.Result);\n\
    t1.Wait();\nConsole.WriteLine(\"result from task: {0} {1}\", t1.Result.Item1,\n\
    \    t1.Result.Item2);\n```\n\n## Parallel Class\n\nAnother abstraction of threads\
    \ that is new with .NET 4 is the Parallel class. This class defines static methods\
    \ for a parallel for and foreach. With the language defined for for and foreach,\
    \ the loop is run from one thread. The Parallel class uses multiple tasks and,\
    \ thus, multiple threads for this job.\n\nWhile the `Parallel.For()` and `Parallel.ForEach()`\
    \ methods invoke the same method several times, `Parallel.Invoke()` allows invoking\
    \ different methods concurrently.\n\n### Looping with the Parallel.For Method\n\
    \nThe `Parallel.For()` method is similar to the C# for loop statement to do a\
    \ task a number of times. With the `Parallel.For()`, the iterations run in parallel.\
    \ The order of iteration is not defined.\n\nWith the `For()` method, the first\
    \ two parameters define the start and end of the loop. The sample has the iterations\
    \ from 0 to 9. The third parameter is an `Action<int>` delegate. The integer parameter\
    \ is the iteration of the loop that is passed to the method referenced by the\
    \ delegate. The return type of `Parallel.For()` is the struct ParallelLoopResult,\
    \ which provides information if the loop is completed.\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_25_0.png)\n\
    \n```csharp\nParallelLoopResult result =\n    Parallel.For(0, 10, i =>\n    {\n\
    \        Console.WriteLine(\"{0}, task: {1}, thread: {2}\", i,\n            Task.CurrentId,\
    \ Thread.CurrentThread.ManagedThreadId);\n        Thread.Sleep(10);\n    });\n\
    Console.WriteLine(result.IsCompleted);\n```\n\nIn the body of the `Parallel.For()`,\
    \ the index, task identifier, and thread identifier are written to the console.\
    \ As you can see from this output, the order is not guaranteed. This run of the\
    \ program had the order 0-5-1-6-2... with three tasks and three threads.\n\n```\n\
    0, task: 1, thread: 1\n5, task: 2, thread: 3\n1, task: 3, thread: 4\n6, task:\
    \ 2, thread: 3\n2, task: 1, thread: 1\n4, task: 3, thread: 4\n7, task: 2, thread:\
    \ 3\n3, task: 1, thread: 1\n8, task: 3, thread: 4\n9, task: 3, thread: 4\nTrue\n\
    ```\n\nYou can also break the `Parallel.For()` early. A method overload of the\
    \ `For()` method accepts a third parameter of type `Action<int, ParallelLoopState>`.\
    \ By defining a method with these parameters, you can influence the outcome of\
    \ the loop by invoking the `Break()` or `Stop()` methods of the `ParallelLoopState`.\n\
    \nRemember, the order of iterations is not defined.\n\n```\nParallelLoopResult\
    \ result =\n    Parallel.For(10, 40, (int i, ParallelLoopState pls) =>\n    {\n\
    \        Console.WriteLine(\"i: {0} task {1}\", i, Task.CurrentId);\n        Thread.Sleep(10);\n\
    \        if (i > 15)\n            pls.Break();\n    });\nConsole.WriteLine(result.IsCompleted);\n\
    Console.WriteLine(\"lowest break iteration: {0}\",\n    result.LowestBreakIteration);\n\
    ```\n\nThis run of the application demonstrates that the iteration breaks up with\
    \ a value higher than 15, but other tasks can simultaneously run and tasks with\
    \ other values can run. With the help of the LowestBreakIteration property, you\
    \ can decide to ignore results from other tasks.\n\n```\n10 task 1\n25 task 2\n\
    11 task 1\n13 task 3\n12 task 1\n14 task 3\n16 task 1\n15 task 3\nFalse\nlowest\
    \ break iteration: 16\n```\n\n`Parallel.For()` might use several threads to do\
    \ the loops. If you need an initialization that should be done with every thread,\
    \ you can use the `Parallel.For<TLocal>()` method. The generic version of the\
    \ For method accepts — besides the from and to values — three delegate parameters.\
    \ The first parameter is of type `Func<TLocal>`. Because the example here uses\
    \ a string for TLocal, the method needs to be defined as `Func<string>`, a method\
    \ returning a string. This method is invoked only once for each thread that is\
    \ used to do the iterations.\n\nThe second delegate parameter defines the delegate\
    \ for the body. In the example, the parameter is of type `Func<int, ParallelLoopState,\
    \ string, string>`. The first parameter is the loop iteration; the second parameter,\
    \ `ParallelLoopState`, allows for stopping the loop, as you saw earlier. With\
    \ the third parameter, the body method receives the value that is returned from\
    \ the init method. The body method also needs to return a value of the type that\
    \ was defined with the generic For parameter.\n\nThe last parameter of the `For()`\
    \ method specifies a delegate, `Action<TLocal>`; in the example, a string is received.\
    \ This method again is called only once for each thread; this is a thread exit\
    \ method.\n\n```\nParallel.For<string>(0, 20,\n() =>\n{\n    // invoked once for\
    \ each thread\n    Console.WriteLine(\"init thread {0}, task {1}\",\n        Thread.CurrentThread.ManagedThreadId,\
    \ Task.CurrentId);\n    return String.Format(\"t {0}\",\n        Thread.CurrentThread.ManagedThreadId);\n\
    },\n(i, pls, str1) =>\n{\n    // invoked for each member\n    Console.WriteLine(\"\
    body i {0} str1 {1} thread {2} task {3}\", i,\n        str1, Thread.CurrentThread.ManagedThreadId,\n\
    \        Task.CurrentId);\n    Thread.Sleep(10);\n    return String.Format(\"\
    i {0}\", i);\n},\n(str1) =>\n{\n    // final action on each thread\n    Console.WriteLine(\"\
    finally {0}\", str1);\n});\n```\n\nThe result of one time running this program\
    \ is shown here:\n\n```\ninit thread 1, task 1\nbody i 0 str1 t1 thread 1 task\
    \ 1\nbody i 1 str1 i 0 thread 1 task 1\ninit thread 3, task 2\nbody i 10 str1\
    \ t3 thread 3 task 2\ninit thread 4, task 3\nbody i 3 str1 t4 thread 4 task 3\n\
    body i 2 str1 i 1 thread 1 task 1\nbody i 11 str1 i 10 thread 3 task 2\nbody i\
    \ 4 str1 i 3 thread 4 task 3\nbody i 6 str1 i 2 thread 1 task 1\nbody i 12 str1\
    \ i 11 thread 3 task 2\nbody i 5 str1 i 4 thread 4 task 3\nbody i 7 str1 i 6 thread\
    \ 1 task 1\nbody i 13 str1 i 12 thread 3 task 2\n```\n"
  mdcn: "\n## 延续任务\n\n使用任务时，可以指定在某个任务完成后另一个特定任务应开始运行，例如，使用前一个任务结果的新任务，或在前一个任务失败时执行一些清理操作。\n\
    \n而任务处理程序要么没有参数，要么有一个对象参数，延续处理程序具有类型为 `Task` 的参数。在此，您可以访问有关源任务的信息。\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_23_0.png)\n\
    \n```csharp\nstatic void DoOnFirst()\n{\n    Console.WriteLine(\"doing some task\
    \ {0}\", Task.CurrentId);\n    Thread.Sleep(3000);\n}\n\nstatic void DoOnSecond(Task\
    \ t)\n{\n    Console.WriteLine(\"task {0} finished\", t.Id);\n    Console.WriteLine(\"\
    this task id {0}\", Task.CurrentId);\n    Console.WriteLine(\"do some cleanup\"\
    );\n    Thread.Sleep(3000);\n}\n```\n\n> *Pro C# 4 9780470502259 代码片段 TaskSamples/Program.cs*\n\
    \n延续任务是通过在任务上调用 `ContinueWith` 方法来定义的。您也可以为此使用 `TaskFactory`。`t1.ContinueWith(DoOnSecond)`\
    \ 表示应尽快在任务 `t1` 完成后启动一个调用方法 `DoOnSecond()` 的新任务。当一个任务完成后可以启动多个任务，并且延续任务也可以有另一个延续任务，正如本示例所示。\n\
    \n```csharp\nTask t1 = new Task(DoOnFirst);\nTask t2 = t1.ContinueWith(DoOnSecond);\n\
    Task t3 = t1.ContinueWith(DoOnSecond);\nTask t4 = t2.ContinueWith(DoOnSecond);\n\
    ```\n\n到目前为止的延续任务总是在前一个任务完成后启动，无论前一个任务是如何完成的。使用来自 `TaskContinuationOptions` 的值，您可以定义延续任务只有在源任务成功（或出现故障）时才应启动。一些可能的值是\
    \ `OnlyOnFaulted`、`NotOnFaulted`、`OnlyOnCanceled`、`NotOnCanceled` 和 `OnlyOnRanToCompletion`。\n\
    \n```csharp\nTask t5 = t1.ContinueWith(DoOnError,\n                        TaskContinuationOptions.OnlyOnFaulted);\n\
    ```\n\n## 任务层次结构\n\n使用任务延续，一个任务在另一个任务之后启动。任务也可以形成层次结构。当一个任务本身启动一个新任务时，就会启动父/子层次结构。\n\
    \n在下面的代码片段中，在父任务的任务内，创建了一个新任务。创建子任务的代码与创建父任务的代码相同。唯一的区别是任务是在另一个任务内部创建的。\n\n> 元组在“元组”部分中已提前解释。\n\
    \n当定义任务以调用方法 TaskWithResult 时，使用泛型类 `Task<Result>`。泛型参数定义返回类型。使用构造函数，将方法传递给 Func\
    \ 委托，第二个参数定义输入值。因为此任务需要在对象参数中需要两个输入值，因此也创建了一个元组。接下来，启动任务。Task 实例 t1 的 Result 属性会阻塞并等待任务完成。任务完成后，Result\
    \ 属性包含来自任务的结果。\n\n```csharp\nvar t1 = new Task<Tuple<int,int>>(TaskWithResult,\n\
    \    Tuple.Create<int, int>(8, 3));\nt1.Start();\nConsole.WriteLine(t1.Result);\n\
    t1.Wait();\nConsole.WriteLine(\"result from task: {0} {1}\", t1.Result.Item1,\n\
    \    t1.Result.Item2);\n```\n\n## Parallel 类\n\n另一个在 .NET 4 中新增的线程抽象是 Parallel\
    \ 类。该类为并行 for 和 foreach 定义了静态方法。使用为 for 和 foreach 定义的语言，循环由一个线程运行。Parallel 类使用多个任务，从而使用多个线程来完成此工作。\n\
    \n虽然 `Parallel.For()` 和 `Parallel.ForEach()` 方法多次调用相同的方法，但 `Parallel.Invoke()`\
    \ 允许并发调用不同的方法。\n\n### 使用 Parallel.For 方法进行循环\n\n`Parallel.For()` 方法类似于 C# 的 for\
    \ 循环语句，用于多次执行任务。使用 `Parallel.For()`，迭代会并行运行。迭代顺序未定义。\n\n在 `For()` 方法中，前两个参数定义循环的开始和结束。示例中的迭代从\
    \ 0 到 9。第三个参数是 `Action<int>` 委托。整数参数是传递给委托引用的方法的循环迭代。`Parallel.For()` 的返回类型是 struct\
    \ ParallelLoopResult，它提供循环是否完成的信息。\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_25_0.png)\n\
    \n```csharp\nParallelLoopResult result =\n    Parallel.For(0, 10, i =>\n    {\n\
    \        Console.WriteLine(\"{0}, task: {1}, thread: {2}\", i,\n            Task.CurrentId,\
    \ Thread.CurrentThread.ManagedThreadId);\n        Thread.Sleep(10);\n    });\n\
    Console.WriteLine(result.IsCompleted);\n```\n\n在 `Parallel.For()` 的主体中，索引、任务标识符和线程标识符被写入控制台。如输出所示，顺序无法保证。此次程序运行的顺序为\
    \ 0-5-1-6-2...，使用了三个任务和三个线程。\n\n```\n0, task: 1, thread: 1\n5, task: 2, thread:\
    \ 3\n1, task: 3, thread: 4\n6, task: 2, thread: 3\n2, task: 1, thread: 1\n4, task:\
    \ 3, thread: 4\n7, task: 2, thread: 3\n3, task: 1, thread: 1\n8, task: 3, thread:\
    \ 4\n9, task: 3, thread: 4\nTrue\n```\n\n您也可以提前中断 `Parallel.For()`。`For()` 方法的重载接受第三个参数，其类型为\
    \ `Action<int, ParallelLoopState>`。通过定义具有这些参数的方法，您可以通过调用 `ParallelLoopState` 的\
    \ `Break()` 或 `Stop()` 方法来影响循环的结果。\n\n请记住，迭代的顺序未定义。\n\n```\nParallelLoopResult\
    \ result =\n    Parallel.For(10, 40, (int i, ParallelLoopState pls) =>\n    {\n\
    \        Console.WriteLine(\"i: {0} task {1}\", i, Task.CurrentId);\n        Thread.Sleep(10);\n\
    \        if (i > 15)\n            pls.Break();\n    });\nConsole.WriteLine(result.IsCompleted);\n\
    Console.WriteLine(\"lowest break iteration: {0}\",\n    result.LowestBreakIteration);\n\
    ```\n\n此次应用程序运行演示了迭代在值大于 15 时中断，但其他任务可以同时运行，并且具有其他值的任务也可以运行。在 LowestBreakIteration\
    \ 属性的帮助下，您可以决定忽略其他任务的结果。\n\n```\n10 task 1\n25 task 2\n11 task 1\n13 task 3\n\
    12 task 1\n14 task 3\n16 task 1\n15 task 3\nFalse\nlowest break iteration: 16\n\
    ```\n\n`Parallel.For()` 可能使用多个线程来执行循环。如果您需要为每个线程执行一次初始化，可以使用 `Parallel.For<TLocal>()`\
    \ 方法。For 方法的泛型版本除了 from 和 to 值外，还接受三个委托参数。第一个参数的类型为 `Func<TLocal>`。由于此示例中 TLocal\
    \ 使用 string，因此方法需要定义为 `Func<string>`，即返回字符串的方法。此方法仅对用于执行迭代的每个线程调用一次。\n\n第二个委托参数定义了主体的委托。在示例中，参数的类型为\
    \ `Func<int, ParallelLoopState, string, string>`。第一个参数是循环迭代；第二个参数 `ParallelLoopState`\
    \ 允许停止循环，如您之前所见。通过第三个参数，主体方法接收从 init 方法返回的值。主体方法也需要返回使用泛型 For 参数定义的类型的值。\n\n`For()`\
    \ 方法的最后一个参数指定一个委托，`Action<TLocal>`；在示例中，接收一个字符串。此方法再次仅对每个线程调用一次；这是线程退出方法。\n\n\
    ```\nParallel.For<string>(0, 20,\n() =>\n{\n    // invoked once for each thread\n\
    \    Console.WriteLine(\"init thread {0}, task {1}\",\n        Thread.CurrentThread.ManagedThreadId,\
    \ Task.CurrentId);\n    return String.Format(\"t {0}\",\n        Thread.CurrentThread.ManagedThreadId);\n\
    },\n(i, pls, str1) =>\n{\n    // invoked for each member\n    Console.WriteLine(\"\
    body i {0} str1 {1} thread {2} task {3}\", i,\n        str1, Thread.CurrentThread.ManagedThreadId,\n\
    \        Task.CurrentId);\n    Thread.Sleep(10);\n    return String.Format(\"\
