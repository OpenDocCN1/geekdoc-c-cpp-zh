    \ 和其他控件显示 `ListBox`、`ComboBox` 或 `TreeView` 中当前选中项的额外详细信息。\n\n额外的 WPF 数据绑定功能让你可以排序、过滤和分组数据；让用户修改控件以更新数据源；并验证对数据的更改。\n\
    \n### 绑定基础\n\n数据绑定有以下四个基本部分：\n\n- **目标** — 将使用绑定结果的对象\n- **目标属性** — 将使用结果的目标对象的属性\n\
