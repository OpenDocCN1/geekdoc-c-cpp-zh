    \n![](img/7954dcc7dd1d929d072aec8e9531b6cc_96_1.png)\n\n# Resource Skins\n\nThe\
    \ program ResourceDictionaries shown in the previous two figures uses two different\
    \ sets of resources to change its appearance at design time.\n\nThe following\
    \ code shows the window’s resource dictionary. The inner ResourceDictionary elements\
    \ load two different resource dictionaries. Because dictionaries loaded later\
    \ override those loaded earlier, you can change the application’s appearance by\
    \ changing the order of these two elements. (As shown here, the Red.xaml dictionary\
    \ is loaded second, so the program uses its red interface.)\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_96_2.png)\n\
    \n```\n```xml\n<Window.Resources>\n    <ResourceDictionary>\n        <ResourceDictionary.MergedDictionaries>\n\
    \            <ResourceDictionary Source=\"ResBlue.xaml\" />\n            <ResourceDictionary\
    \ Source=\"ResRed.xaml\" />\n        </ResourceDictionary.MergedDictionaries>\n\
    \    </ResourceDictionary>\n</Window.Resources>\n```\n```"
  - "[PAGE 97]\n\nWhile the program ResourceDictionaries can display two different\
    \ appearances, you need to modify the program at design time to pick the skin\
    \ you want.\n\nThe Skins example program is very similar to the program ResourceDictionaries\
    \ except that it can change skins at run time. To make that possible, most of\
    \ its resources are dynamic rather than static. The program also contains two\
    \ new user interface elements: an Image and a Label.\n\nWhen it displays its red\
    \ interface, this program adds a small Image in its upper-right corner. This Image\
    \ has a context menu that displays the choices Red and Blue (shown on the left\
    \ in the next figure), which let you pick between the red and blue skins.\n\n\
    ![](img/7954dcc7dd1d929d072aec8e9531b6cc_97_0.png)\n\nThe program's blue interface\
    \ displays a label in its upper-right corner (on the right in the previous figure)\
    \ that displays the same context menu.\n\nThe following code shows how the program\
    \ displays its Options textbox on the blue interface:\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_97_1.png)\n\
    \n```\n<Label MouseDown=\"Options_MouseDown\"\nGrid.Row=\"0\" Grid.Column=\"2\"\
    \ Margin=\"2\"\nContent=\"Options\" FontSize=\"10\"\nHorizontalAlignment=\"Right\"\
    \ VerticalAlignment=\"Top\"\nForeground=\"Black\" BorderBrush=\"Black\"\nBorderThickness=\"\
    1\"\nVisibility=\"{DynamicResource visBlue}\"\n>\n  <Label.Background>\n    <LinearGradientBrush\
    \ StartPoint=\"0,0\" EndPoint=\"0,1\">\n      <GradientStop Color=\"Lime\" Offset=\"\
    0\"/>\n      <GradientStop Color=\"Green\" Offset=\"1\"/>\n    </LinearGradientBrush>\n\
    \  </Label.Background>\n  <Label.ContextMenu>\n    <ContextMenu Name=\"ctxOptions\"\
    >\n      <MenuItem Header=\"Red\" Background=\"Pink\"\n                Foreground=\"\
    Red\"\n                Click=\"ctxSkin_Click\" Tag=\"ResRed.xaml\"/>\n      <MenuItem\
    \ Header=\"Blue\" Background=\"LightBlue\"\n                Foreground=\"Blue\"\
    \n                Click=\"ctxSkin_Click\" Tag=\"ResBlue.xaml\"/>\n    </ContextMenu>\n\
    \  </Label.ContextMenu>\n</Label>\n```"
  - "[PAGE 98]\n\nThis code contains four real points of interest:\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_98_0.png)\n\
    \n1. First, the Label's MouseDown event triggers the Options_MouseDown event handler.\
    \ This routine, which is shown in the following code, displays the context menu\
    \ by setting the ContextMenu's IsOpen property to True:\n\n```\n```csharp\n//\
    \ Display the options context menu.\nprivate void Options_MouseDown(object sender,\
    \ RoutedEventArgs e)\n{\n    ctxOptions.IsOpen = true;\n}\n```\n```\n\n2. Second,\
    \ the Label's Visibility property is set to the value of the visBlue static resource.\
    \ This resource has the value True in the Blue resource dictionary and False in\
    \ the Red resource dictionary. This means that the Label is visible only in the\
    \ blue interface. The red interface's skin-changing Image uses a similar visRed\
    \ resource that is only True in the red interface.\n\n3. Third, the context menu's\
    \ items have a Tag property that names the XAML resource file that they load.\
    \ For example, the Blue menu item has its Tag set to ResBlue.xaml. The program\
    \ uses the Tag property to figure out which file to load when the user picks a\
    \ menu item.\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_98_1.png)\n\n4. Finally,\
    \ both of the context menu's items fire the ctxSkin_Click event handler shown\
    \ in the following code to load the appropriate skin:\n\n```\n```csharp\n// Use\
    \ the selected skin.\nprivate void ctxSkin_Click(object sender, RoutedEventArgs\
    \ e)\n{\n    // Get the context menu item that was clicked.\n    MenuItem menu_item\
    \ = (MenuItem)sender;\n\n    // Create a new resource dictionary, using the\n\
    \    // menu item's Tag property as the dictionary URI.\n    ResourceDictionary\
    \ dict = new ResourceDictionary();\n    dict.Source = new Uri((String)menu_item.Tag,\
    \ UriKind.Relative);\n\n    // Remove all but the first dictionary.\n    while\
    \ (App.Current.Resources.MergedDictionaries.Count > 1)\n    {\n        App.Current.Resources.MergedDictionaries.RemoveAt(1);\n\
    \    }\n\n    // Install the new dictionary.\n    App.Current.Resources.MergedDictionaries.Add(dict);\n\
    }\n```\n```\n\nThis code gets the menu item that triggered the event and looks\
    \ at the item's Tag property to see which resource file to load. It creates a\
    \ ResourceDictionary object loaded from the file, removes old resource dictionaries\
    \ from the application's MergedDictionaries collection, and adds the new dictionary."
  - '[PAGE 99]


    # Animated Skins


    The skins described in the previous section use separate resource dictionaries
    to provide different appearances. The program''s XAML file sets its control properties
    to resource values so that when you change the resource values, the interface
    changes accordingly.


    Another way to change property values is to use property animation. This section
    explains briefly how to use animation to provide skinning.


    XAML files allow you to define triggers that launch storyboards that represent
    property animations. For example, when the user presses the mouse down over a
    rectangle, the XAML code can run a storyboard that varies the `Rectangle''s Width`
    property smoothly from 100 to 200 over a 1-second period.


    The AnimatedSkins example program uses this technique to provide skinning. The
    next two figures show the program displaying its green skin and its blue skin.


    ![](img/7954dcc7dd1d929d072aec8e9531b6cc_99_0.png)


    ![](img/7954dcc7dd1d929d072aec8e9531b6cc_99_1.png)


    When you click the appropriate control, a trigger launches a storyboard that:


    +   - Resizes the main window and changes its `Background` brush.

    +   - Hides and displays the small blue or green ellipses in the upper-right corner
    that you click to switch skins.

    +   - Moves `Labels`.

    +   - Resizes, moves, and changes the corner radii of the rectangles that act
    as buttons.

    +   - Changes the `Fill` and `Stroke` brushes for the rectangles pretending to
    be buttons.

    +   - Changes the text displayed in the `Labels`.

    +   - Moves and resizes the `Image`.

    +   - Changes the background and foreground colors.'
