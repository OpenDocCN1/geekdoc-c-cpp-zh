    # # PROFESSIONAL ASP.NET 4 in C# and VB


    # ## CHART SERVER CONTROL


    One of the newest controls available to you now with ASP.NET 4 is the Chart server
    control. This control made its way into the core part of ASP.NET through a previous
    acquisition of the Dundas charting company and is a great control for getting
    you up and running with some good-looking charts.


    The new Chart server control supports many chart types including:


    +   - Point

    +   - FastPoint

    +   - Bubble

    +   - Line

    +   - Spline

    +   - StepLine

    +   - FastLine

    +   - Bar

    +   - StackedBar

    +   - StackedBar100

    +   - Column

    +   - StackedColumn

    +   - StackedColumn100

    +   - Area

    +   - SplineArea

    +   - StackedArea

    +   - StackedArea100

    +   - Pie

    +   - Doughnut

    +   - Stock

    +   - CandleStick

    +   - Range

    +   - SplineRange

    +   - RangeBar

    +   - RangeColumn

    +   - Radar

    +   - Polar

    +   - ErrorBar

    +   - BoxPlot

    +   - Renko

    +   - ThreeLineBreak

    +   - Kagi

    +   - PointAndFigure

    +   - Funnel

    +   - Pyramid'
  - '[PAGE 40]


    Those are a lot of different chart styles! You can find the Chart server control
    in the toolbox of Visual Studio 2010 underneath the Data tab. It is part of the
    System.Web.DataVisualization namespace.


    When you drag it from the toolbox and place it on the design surface of your page,
    you are presented with a visual representation of the chart type that you are
    going to use. The next figure shows an example.


    ![](img/7954dcc7dd1d929d072aec8e9531b6cc_40_0.png)


    Open up the smart tag for the control, and you find that you can assign a data
    provider for the chart as well as select the chart type you are interested in
    using. Changing the chart type gives you a sample of what that chart looks like
    (even if you are not yet working with any underlying data) in the design view
    of the IDE. The smart tag is shown in the next figure.


    ![](img/7954dcc7dd1d929d072aec8e9531b6cc_40_1.png)


    There is a lot to this control, probably more than all the others and this single
    control could almost warrant a book on its own. To get you up and running with
    this chart server control, follow this simple example.


    Create a new web application and add the AdventureWorks database to your App_Data
    folder within the application. After that is accomplished, drag and drop the Chart
    server control onto the design surface of your page. From the smart tag of the
    control, select <New Data Source> from the'
  - "[PAGE 41]\n\ndrop-down menu when choosing your data source. Work your way through\
    \ this wizard making sure that you are choosing a SQL data source as your option.\
    \ As you work through the wizard, you are going to want to choose the option that\
    \ allows you to choose a custom SQL statement and use the following SQL for this\
    \ operation:\n\n```\nSELECT TOP (5) Production.Product.Name, Sales.SalesOrderDetail.OrderQty\n\
    FROM Sales.SalesOrderDetail INNER JOIN Production.Product\nON Sales.SalesOrderDetail.ProductID\
    \ = Production.Product.ProductID\nORDER BY Sales.SalesOrderDetail.OrderQty DESC\n\
    ```\n\nWith that in place and the new chart server control bound to this data\
    \ source control, you now find that you have more options in the smart tag of\
    \ the chart server control, as shown in this figure.\n\nNow you can select the\
    \ series data members and choose what is on the x-axis and what is on the y-axis.\
    \ You can see that I have assigned the Name of the product to be on the X-axis\
    \ and the quantity ordered to be on the y-axis. After widening the chart's width\
    \ a bit, you end up with code similar to the following in Listing 3-52.\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_41_0.png)\n\
    \n# Pro ASP.NET 9780470502204 Listing 3-52: Charting with the new Chart server\
    \ control\n\n```\n<%@ Page Language=\"C#\" AutoEventWireup=\"true\"\nCodeBehind=\"\
    WebForm1.aspx.cs\" Inherits=\"WebServerControls.WebForm1\" %>\n<%@ Register Assembly=\"\
    System.Web.DataVisualization, Version=4.0.0.0\",\n    Culture=\"neutral\", PublicKeyToken=\"\
