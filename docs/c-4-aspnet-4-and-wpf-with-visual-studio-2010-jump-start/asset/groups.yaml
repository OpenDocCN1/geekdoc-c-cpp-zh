    \ with the readme.txt document. With a JumpPath item, you can define a file that\
    \ should be listed in the Jump List to start the application from the file. JumpPath\
    \ defines a Path property for assigning the filename. Using a JumpPath item requires\
    \ that the file extension be registered with the application. Otherwise, the registration\
    \ of the items is rejected. To find the reasons for items being rejected, you\
    \ can register a handler to the `JumpItemsRejected` event. Here, you can get a\
    \ list of the rejected items (`RejectedItems`) and the reasons for them (`RejectionReasons`).\n\
    \n```csharp\nvar jumpItems = new List<JumpTask>();\nvar workingDirectory = Environment.CurrentDirectory;\n\
    var windowsDirectory = Environment.GetFolderPath(\n    Environment.SpecialFolder.Windows);\n\
    var notepadPath = System.IO.Path.Combine(windowsDirectory,\n    \"Notepad.exe\"\
    );\n\njumpItems.Add(new JumpTask\n{\n    CustomCategory = \"Read Me\",\n    Title\
    \ = \"Read Me\",\n    Description = \"Open read me in Notepad.\",\n    ApplicationPath\
    \ = notepadPath,\n    IconResourcePath = notepadPath,\n    WorkingDirectory =\
    \ workingDirectory,\n    Arguments = \"readme.txt\"\n});\n\nvar jumpList = new\
    \ JumpList(jumpItems, true, true);\njumpList.JumpItemsRejected += (sender, e1)\
    \ =>\n{\n    var sb = new StringBuilder();\n    for (int i = 0; i < e1.RejectedItems.Count;\
    \ i++)\n    {\n        if (e1.RejectedItems[i] is JumpPath)\n            sb.Append((e1.RejectedItems[i]\
    \ as JumpPath).Path);\n        if (e1.RejectedItems[i] is JumpTask)\n        \
    \    sb.Append((e1.RejectedItems[i] as JumpTask).\n                ApplicationPath);\n\
    \        sb.Append(e1.RejectionReasons[i]);\n        sb.AppendLine();\n    }\n\
    \    MessageBox.Show(sb.ToString());\n};\n\nJumpList.SetJumpList(Application.Current,\
    \ jumpList);\n```\n\nWhen you run the application and click the right mouse button,\
    \ you see the Jump List, as shown here.\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_37_0.png)\n\
    \n> To use the taskbar and Jump List from Windows Forms applications, you can\
    \ use extensions defined in the Windows API Code Pack.\n"
