    ## 这是 Web Forms 4.0 吗？


    我们在与人们谈论 ASP.NET MVC 时听到的主要担忧之一是其发布意味着 Web Forms 的死亡。这完全不属实。ASP.NET MVC 并不是 ASP.NET
    Web forms 4.0。它是 Web Forms 的替代方案，并且是框架中完全受支持的一部分。虽然 Web Forms 仍在以新创新和新发展不断前进，但
    ASP.NET MVC 将继续作为微软完全支持的并行替代方案。


    有一种有趣的看法方式是参考这些技术所在的命名空间。如果你能指出一个命名空间并说，“这就是 ASP.NET 所在的地方”，那就是 `System.Web` 命名空间。ASP.NET
    MVC 位于 `System.Web.Mvc` 命名空间中。它不是 `System.Mvc`，也不是 `System.Web2`。


    虽然 ASP.NET MVC 今天对于 Visual Studio 2008 用户来说是一个可单独下载的 Web 组件（通常由 ASP.NET 团队称为超出频道的
    [OOB] 发布），但它已被合并到 .NET Framework 4 中，并且开箱即内置于 Visual Studio 2010 中。这巩固了 ASP.NET
    MVC 作为 ASP.NET 本身基本组成部分的地位。


    ## 为什么不用 Web Forms？


    在 ASP.NET Web forms 中，你创建一个 `System.Web.UI.Page` 的实例并在其上放置“server controls”（例如一个日历和一些按钮），以便用户输入或查看信息。然后你将这些控件连接到
    `System.Web.UI.Page` 上的事件以实现交互性。此页面随后被编译，并且当被 ASP.NET 运行时调用时，会创建一个服务器端控件树，树中的每个控件都经历事件生命周期，它自行渲染，结果作为
    HTML 返回。因此，一种新的 Web 美学开始出现——Web forms 在 HTTP 之上层叠事件和状态管理——一种真正无状态的协议。


    为什么需要这种抽象？记住 Web Forms 是为非常习惯 Visual Basic 6 的微软开发社区引入的。使用 VB6 的开发人员会将按钮拖到设计表面，双击按钮，就会为他们即时创建一个
    `Button_Click` 事件处理程序方法。这是一种创建业务应用程序的极其强大的方式，并让每个人对快速应用程序开发（RAD）工具感到兴奋。当开发人员开始使用经典
    ASP 时，与他们在 Visual Basic 中习惯的丰富环境相比，这是一个很大的倒退。好与坏，Web Forms 将那种快速应用程序开发体验带到了 Web。


    然而，随着 Web 的成熟，越来越多的人开始接受他们对 HTML 的理解，以及 CSS（Cascading Style Sheets）和 XHTML 的引入，一种新的
    Web 美学开始出现。Web Forms 对开发人员来说仍然极其高效，使他们能够非常快速地创建基于 Web 的业务线应用程序。然而，它生成的 HTML 看起来，嗯，生成的，有时可能会冒犯那些手工制作
    XHTML 和 CSS 站点的审美。Web Forms 概念如 ViewState 和 Postback 事件模型有其位置，但许多开发人员希望有一个更低层的替代方案，它不仅拥抱
    HTML，还拥抱 HTTP 本身。


    此外，Web Forms 的架构也使得通过当前单元测试工具如 NUnit、MbUnit 和 xUnit.NET 进行测试变得困难。ASP.NET Web forms
    并不是以单元测试为目标设计的，虽然网络上可以找到一些技巧，但可以公平地说 Web Forms 不太适合测试驱动开发。ASP.NET MVC 提供了对 HTML
    的绝对控制，不否认 HTTP 的存在，并且从一开始就以可测试性为目标而设计。


    ## ASP.NET MVC 完全不同！


    是的，ASP.NET MVC 完全不同。这就是重点。它建立在与 Web Forms 非常不同的价值观和架构原则体系之上。ASP.NET MVC 注重可扩展性、可测试性和灵活性。它非常轻量级，并且不会对你如何使用它做出太多假设——除了它假设你欣赏
    Model-View-Controller 模式之外。


    不同的开发人员和不同的项目有不同的需求。如果 ASP.NET MVC 满足你的需求，就使用它。如果不满足，就不要使用它。无论如何，不要害怕。


    ## 为什么“(ASP.NET > ASP.NET MVC) == True”


    创建你的第一个 MVC 应用程序相当直接。你可以使用任何版本的 Visual Studio 2010 来创建基本应用程序，包括 Express、Standard、Professional
    或 Team Edition。


    如果你没有使用 Visual Studio 2010，第一步是在你的 2008 开发机上安装 MVC 框架。从 www.asp.net/mvc 开始，通过下载最新版本。如果你喜欢走在边缘，通常可以在
    www.codeplex.com/aspnet 上获得 ASP.NET MVC 未来版本。


    你下载的是一个 Visual Studio 项目模板集，它会为你创建 ASP.NET MVC Web 应用程序。你以前用过这些——每个新的 ASP.NET
    Web site 和 ASP.NET Web application 都基于一组模板。模板将被安装到 Visual Studio 中，引用程序集将被安装到
    C:\Program Files\Microsoft ASP.NET。


    安装 ASP.NET MVC 后，你就可以使用 Visual Studio 2008 创建 ASP.NET MVC 应用程序了。不过，如果你使用的是 Visual
    Studio 2010，那么你需要按照以下步骤操作：


    - 1. 通过选择 File -> New Project 打开 Visual Studio 2010。

    - 2. 从 New Project 对话框中，如下图所示，选择 ASP.NET MVC 2 Web Application。


    ![](img/7954dcc7dd1d929d072aec8e9531b6cc_58_0.png)


    .NET Framework 此版本中另一个出色的功能是 WCF Data Services 框架。此功能使你能够轻松为客户端应用程序创建云接口，提供从简单读取功能到完整的
    CRUD 模型（create、read、update、and delete functions）的一切。此功能以前被称为 ADO.NET Data Services。


    当你使用 ASP.NET 时，现在对客户端和服务器的工作都有更多关注。过去，大多数开发都集中在尽可能多地在服务器上执行，并将完成的运算和 UI 交付回客户端仅供查看。随着“smart
    clients”和 AJAX-enabled 应用程序的发布，现在许多工作被卸载到客户端。WCF Data Services 使通过线路公开后端功能以在客户端执行更多工作变得比以前更容易。


    WCF Data Services 用于为你的后端数据源创建服务层。自己实现这一点，尤其是使用完整的 CRUD 模型时，需要大量工作。WCF Data Services
    允许你获得一个基于 URI 驱动的服务层。以下图示显示了使用 WCF Data Services 时的总体架构。


    ![](img/7954dcc7dd1d929d072aec8e9531b6cc_60_0.png)


    如图所示，WCF Data Services 层不是与数据库交互的层。相反，你正在使用一个 EDM 层，它是数据存储与基于云的接口之间的映射层。在使用你的
    EDM 时，你可以使用 LINQ to SQL 和 LINQ to Entities。


    WCF Data Services 允许你快速将应用程序底层数据源的交互作为 RESTful-based 服务公开。当前版本的 WCF Data Services
    允许你使用 JSON 或 Atom-based XML 与数据存储工作。同样，JSON 是 ASP.NET AJAX 用于执行 out-of-bounds
    调用以避免完整页面刷新的方式。


    ## 创建你的第一个服务


    弄清楚如何为数据库构建完整的服务层以处理所有 create、read、update 和 delete 函数需要大量的时间和思考。然而，正如你在完成这个第一个示例时所看到的那样，WCF
    Data Services 使这项任务变得更加可行。


    要构建服务层，首先在 Visual Basic 或 C# 中创建一个名为 Web_ADONETDS 的标准 ASP.NET Web Application。注意，你需要使用
    .NET Framework 3.5 SP1 以及 Visual Studio 2008 SP1 或 .NET Framework 4 与 Visual Studio
    2010 才能使此示例工作。


    这当然创建了一个与正常情况不同的标准 Web 应用程序。因为 WCF Data Services 基于底层数据库工作，所以你需要添加一个数据库。对于此示例，添加
    NORTHWND.mdf 数据库。将此数据库放置在项目的 App_Data 文件夹内。


    ### 添加你的实体数据模型


    在数据库就位后，你接下来创建一个 WCF Data Services 将使用的 Entity Data Model。为此，右键单击你的项目并从提供的菜单选项列表中选择
    Add ⇨ New Item。


    Add New Item 对话框出现。如图所示，将 ADO.NET Entity Data Model 添加到你的项目中。


    ![](img/7954dcc7dd1d929d072aec8e9531b6cc_61_0.png)


    如图所示，将你的 ADO.NET Entity Data Model 文件命名为 Northwind.edmx。当你通过单击 Add 创建 Northwind.edmx
    文件时，Entity Data Model Wizard 出现，提供创建空 EDM 或从预先存在的数据库创建的选项。对于此示例，选择从预先存在的（Northwind）数据库创建的选项。然后在向导中单击
    Next。

    '
