    ## ASP.NET MVC


    模型-视图-控制器（MVC）多年来一直是计算机科学中一个重要的架构模式。最初在 1979 年命名为 Thing-Model-View-Editor，后来简化为
    Model-View-Controller。它是一种强大而优雅的方式，用于在应用程序内部分离关注点，并且非常适用于 Web 应用程序。其明确的关注点分离确实为应用程序设计增加了少量额外复杂性，但非凡的好处超过了额外的努力。自引入以来，它已被数十个框架使用。你可以在
    Java 和 C++ 中找到 MVC，在 Mac 和 Windows 上，以及在数十个框架内部。


    理解 MVC 的核心概念对于有效使用它至关重要。本节讨论了 MVC 模式的历史，以及它在当今 Web 编程中的使用方式。


    ASP.NET MVC 1.0 作为 Visual Studio 2008 的可下载插件发布。现在在 Visual Studio 2010 中，ASP.NET
    MVC 2 已内置。本节还涵盖了 ASP.NET Web 窗体的一些限制以及 ASP.NET MVC 如何尝试使开发人员摆脱这些限制。


    > 本选段的内容改编自 Rob Conery、Scott Hanselman、Phil Haack 和 Scott Guthrie 合著的《Professional
    ASP.NET MVC 1.0》（Wiley，2009）。有关该主题的更深入介绍，我们建议你查阅该书。


    ## 定义模型-视图-控制器


    模型-视图-控制器（MVC）是一种架构模式，用于将应用程序分离为三个主要方面：


    - 模型：描述你正在处理的数据以及数据如何被更改和操作业务规则的一组类

    - 视图：应用程序的用户界面（UI）

    - 控制器：处理用户通信、整体应用程序流程和特定于应用程序的逻辑的一组类


    该模式在 Web 编程中经常使用。在 ASP.NET MVC 中，它大致翻译为以下内容：


    - 模型是表示你感兴趣的域的类。这些域对象通常封装存储在数据库中的数据以及用于操作数据并强制执行特定于域的业务逻辑的代码。在 ASP.NET MVC 中，这很可能是一种数据访问层，使用
    LINQ to SQL、Entity Framework 或 NHibernate 等工具，结合包含特定于域的逻辑的自定义代码。

    - 视图是动态生成的页面。在 ASP.NET MVC 中，你通过继承自 `System.Web.UI.Page` 的 `System.Web.Mvc.ViewPage`
    类来实现它。

    - 控制器是一个特殊类，管理视图和模型之间的关系。它与模型对话，并决定要渲染哪个视图（如果有）。在 ASP.NET MVC 中，该类通常以后缀 `"Controller."`
    表示。


    ## 产品团队旁白


    ScottGu，或称“The Gu”，以原型制作酷炫事物而闻名，如果他在走廊里看到你并且手里拿着笔记本电脑，你就无法逃脱，因为他会说：“伙计！看看这个！”他的热情具有感染力。


    传说中，在 2007 年 10 月于华盛顿州雷德蒙德举行的奥斯汀 ALT.NET 大会上，ScottGu 向一群开发人员展示了他“在飞机上写的这个很酷的东西”，并询问他们是否看到了需求以及他们对此的看法。这很受欢迎。事实上，许多人参与了最初代号为“Scalene”的原型。Eilon
    Lipton 于 2007 年 9 月通过电子邮件向团队发送了第一个原型，他和 ScottGu 通过电子邮件来回交流原型、代码和想法，至今仍在继续！


    ## 模型-视图-控制器与 ASP.NET


    ASP.NET MVC 依赖于其他 MVC 平台使用的许多相同核心策略，同时它提供了编译和托管代码的好处，并利用 .NET 3.5 及以上版本中 VB9 和
    C# 中的新语言特性，如 lambda 和匿名类型。Web 上使用的每个 MVC 框架通常都共享一些基本原则：


    - 约定优于配置

    - 不要重复自己（也称为 DRY 原则）

    - 尽可能可插拔

    - 尽量提供帮助，但如果必要，请让开开发者的道路


    ## 提供方法，而非文件


    Web 服务器最初提供存储在磁盘上静态文件中的 HTML。随着动态网页变得突出，Web 服务器提供从磁盘上动态脚本即时生成的 HTML。使用 MVC，提供
    HTML 有点不同。URL 告诉路由机制实例化哪个控制器以及调用哪个操作方法，并为该方法提供所需参数。然后控制器的操作方法决定使用哪个视图，然后该视图进行渲染。


    而不是在 URL 与 Web 服务器硬盘上存在的文件之间存在直接关系，URL 与控制器对象上的方法之间存在关系。ASP.NET MVC 实现了 MVC 模式的“前端控制器”变体，控制器位于路由子系统之外的一切之前。


    设想 MVC 在 Web 场景中工作方式的一个好方法是，MVC 提供方法调用的结果，而不是动态生成（也称为脚本化）的页面。事实上，我们曾听一位演讲者称之为“Web
    上的 RPC”，这非常贴切，尽管范围要窄得多。

