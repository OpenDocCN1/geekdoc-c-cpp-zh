    \n## Professional C# 4 and .NET 4\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_5_0.png)\n\
    \n## 协变与逆变\n\n在 .NET 4 之前，泛型接口是不变的。.NET 4 通过协变和逆变为泛型接口和泛型委托增加了一项重要扩展。协变和逆变涉及具有参数类型和返回类型的类型转换。例如，能否将\
    \ Rectangle 传递给要求 Shape 的方法？让我们通过示例来看看这些扩展的优势。\n\n在 .NET 中，参数类型是协变的。假设有 Shape\
    \ 和 Rectangle 两个类，且 Rectangle 派生自 Shape 基类。Display() 方法声明为接受 Shape 类型的对象作为其参数：\n\
    \n```csharp\npublic void Display(Shape o) { }\n```\n\n现在可以传递任何派生自 Shape 基类的对象。由于\
    \ Rectangle 派生自 Shape，Rectangle 满足 Shape 的所有要求，编译器会接受此方法调用：\n\n```csharp\nRectangle\
    \ r = new Rectangle { Width = 5, Height = 2.5 };\nDisplay(r);\n```\n\n方法的返回类型是逆变的。当方法返回\
    \ Shape 时，不能将其赋给 Rectangle，因为 Shape 不一定始终是 Rectangle。反过来则可以。如果方法像 GetRectangle()\
    \ 方法那样返回 Rectangle，\n\n```csharp\npublic Rectangle GetRectangle();\n```\n\n结果可以赋给\
    \ Shape。\n\n```csharp\nShape s = GetRectangle();\n```\n\n在 .NET Framework 第 4\
    \ 版之前，泛型无法实现这种行为。在 C# 4 中，语言经过扩展，支持泛型接口和泛型委托的协变与逆变。我们先定义 Shape 基类和 Rectangle 类：\n\
    \n```csharp\npublic class Shape\n{\n    public double Width { get; set; }\n  \
    \  public double Height { get; set; }\n    public override string ToString()\n\
    ```\n\n### 泛型接口的协变\n\n```csharp\nget\n{\n    if (index < 0 || index >= data.Length)\n\
    \        throw new ArgumentOutOfRangeException(\"index\");\n    return data[index];\n\
    }\npublic int Count\n{\n    get\n    {\n        return data.Length;\n    }\n}\n\
    ```\n\n> Pro C# 4 9780470502259 代码片段 Variance1/RectangleCollection.cs\n\n`RectangleCollection.GetRectangles()`\
    \ 方法返回一个实现 `IEnumerable<Rectangle>` 接口的 `RectangleCollection`，因此可以将返回值赋给 `IEnumerable<Rectangle>`\
    \ 类型的变量 `rectangle`。由于该接口是协变的，也可以将返回的值赋给 `IEnumerable<Shape>` 类型的变量。`Shape` 并不需要\
    \ `Rectangle` 所提供的额外内容。在 `for` 循环中使用 `shapes` 变量、接口的索引器和 `Count` 属性：\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_8_0.png)\n\
    \n```csharp\nstatic void Main()\n{\n    IEnumerable<Rectangle> rectangles = RectangleCollection.GetRectangles();\n\
    \    IEnumerable<Shape> shapes = rectangles;\n\n    for (int i = 0; i < shapes.Count;\
    \ i++)\n    {\n        Console.WriteLine(shapes[i]);\n    }\n}\n```\n\n> Pro C#\
    \ 4 9780470502259 代码片段 Variance1/Program.cs\n\n### 泛型接口的逆变\n\n如果泛型类型用 `in` 关键字标注，则该泛型接口是逆变的。这样，接口只允许将泛型类型\
    \ `T` 用作其方法的输入：\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_8_1.png)\n\n```csharp\n\
    public interface IDisplay<in T>\n{\n    void Show(T item);\n}\n```\n\n> Pro C#\
    \ 4 9780470502259 代码片段 Variance1/IDisplay.cs\n\n`ShapeDisplay` 类实现 `IDisplay<Shape>`，并使用\
    \ `Shape` 对象作为输入参数：\n\n```csharp\npublic class ShapeDisplay : IDisplay<Shape>\n\
    {\n    public void Show(Shape s)\n    {\n        Console.WriteLine(\"{0} Width:\
    \ {1}, Height: {2}\", s.GetType().Name, s.Width, s.Height);\n    }\n}\n```\n\n\
    > Pro C# 4 9780470502259 代码片段 Variance/ShapeDisplay.cs\n\n创建 ShapeDisplay 的新实例会返回\
    \ IDisplay<Shape>，并将其赋给 shapeDisplay 变量。由于 IDisplay<T> 是逆变的，可以将结果赋给 IDisplay<Rectangle>，其中\
    \ Rectangle 派生自 Shape。这一次，接口的方法仅将泛型类型定义为输入，而 Rectangle 满足 Shape 的所有要求：\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_9_0.png)\n\
    \n```csharp\nstatic void Main()\n{\n    //...\n    IDisplay<Shape> shapeDisplay\
    \ = new ShapeDisplay();\n    IDisplay<Rectangle> rectangleDisplay = shapeDisplay;\n\
    \    rectangleDisplay.Show(rectangles[0]);\n}\n```\n\n> Pro C# 4 9780470502259\
    \ 代码片段 Variance/Program.cs\n\n## 元组\n\n数组组合相同类型的对象；元组可以组合不同类型的对象。元组起源于 F# 等函数式编程语言，在这些语言中经常使用。在\
    \ .NET 4 中，.NET Framework 为所有 .NET 语言提供了元组。\n\n.NET 4 定义了八个泛型 Tuple 类和一个静态 Tuple\
    \ 类，后者充当元组的工厂。不同的泛型 Tuple 类用于支持不同数量的元素；例如，Tuple<T1> 包含一个元素，Tuple<T1, T2> 包含两个元素，依此类推。\n\
    \nDivide() 方法演示返回一个包含两个成员的元组——Tuple<int, int>。泛型类的参数定义成员的类型，这两个成员都是整数。该元组使用静态\
    \ Tuple 类的静态 Create() 方法创建。同样，Create() 方法的泛型参数定义所实例化元组的类型。新创建的元组用 result 和 remainder\
    \ 变量初始化，以返回除法结果：\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_9_1.png)\n\n```csharp\n\
    public static Tuple<int, int> Divide(int dividend, int divisor)\n{\n    int result\
    \ = dividend / divisor;\n    int remainder = dividend % divisor;\n    return Tuple.Create<int,\
    \ int>(result, remainder);\n}\n```\n\n> Pro C# 4 9780470502259 代码片段 TuplesSample/Program.cs\n\
