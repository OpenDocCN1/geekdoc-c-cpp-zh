    \ the control take action.\n\nSo, how do you learn what properties and template\
    \ bindings are available?\n"
  mdcn: "\nStoryboard.TargetName=\"medBoing\"/>\n</ParallelTimeline>\n\n<!-- Move\
    \ the ball and its shadow. -->\n<ParallelTimeline BeginTime=\"0:0:0\" AutoReverse=\"\
    True\">\n<DoubleAnimationUsingKeyFrames\nStoryboard.TargetName=\"ellBall\"\nStoryboard.TargetProperty=\"\
    (Canvas.Top)\"\n<SplineDoubleKeyFrame KeyTime=\"0:0:1\"\nKeySpline=\"0.5,0 1,1\"\
    \nValue=\"120\"/>\n</DoubleAnimationUsingKeyFrames>\n<DoubleAnimationUsingKeyFrames\n\
    Storyboard.TargetName=\"ellShadow\"\nStoryboard.TargetProperty=\"Opacity\">\n\
    <SplineDoubleKeyFrame KeyTime=\"0:0:1\"\nKeySpline=\"0.5,0 1,1\"\nValue=\"1\"\
    />\n</DoubleAnimationUsingKeyFrames>\n</ParallelTimeline>\n</Storyboard>\n\nStoryboard\
    \ 包含两个独立运行的 ParallelTimeline 对象。第一个等待 1 秒，直到球触及“地面”，然后使用 MediaTimeline 对象播放音效。\n\
    \n![](img/7954dcc7dd1d929d072aec8e9531b6cc_90_0.png)\n\n第二个 ParallelTimeline 包含两个\
    \ DoubleAnimationUsingKeyframes 对象，一个控制球的 Canvas.Top 属性，一个控制阴影的 Opacity。随着球的动画将球向下移动，阴影的动画使阴影变得更不透明。当动画结束时，球触及“地面”，阴影完全不透明。\n\
    \n## 模板\n\n属性和样式决定了控件的外观和行为。\n\n相比之下，模板决定了控件的结构。它们决定了构成控件的组件以及这些组件如何交互以提供控件的功能。\n\
    \n### 模板概述\n\n仔细观察下图，你可以看到 `Slider` 控件包含许多部分，包括：\n\n- 边框\n- 刻度标记\n- 背景\n- 背景上的可点击区域（基本上是控件顶部与其刻度标记之间垂直的任何位置），可更改当前值\n\
    - 表示当前值且可拖动来回的 Thumb\n- 选择指示器（小黑三角）指示所选范围\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_91_0.png)\n\
    \n这些功能由构成 `Slider` 的各个部分提供。\n\n`template` 决定了构成控件的各个部分。它决定了控件的组件及其样式、触发器以及控件所需的一切其他内容。\n\
    \n### 内容呈现器\n\nContentPresenter 是 WPF 提供的一个对象，用于显示控件应显示的内容。你可以将 ContentPresenter\
    \ 放置在为模板构建的任何控件层次结构中，它将显示内容。\n\n例如，以下代码展示了一个极其简单的 Label 模板：\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_91_1.png)\n\
    \n```xml\n<Window.Resources>\n    <ControlTemplate x:Key=\"temSimpleLabel\" TargetType=\"\
    Label\">\n        <Border BorderBrush=\"Red\" BorderThickness=\"1\">\n       \
    \     <ContentPresenter/>\n        </Border>\n    </ControlTemplate>\n</Window.Resources>\n\
    ```\n\nSimpleLabelTemplate 示例程序在下图中显示了两个 Labels。左侧的一个不使用模板，而右侧的一个使用 temSimpleLabel\
    \ 模板。\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_91_2.png)\n\n### 模板绑定\n\n如果比较上图中两个\
    \ Labels，你会发现即使这个简单示例也存在一些潜在问题。因为模板的 Border 控件为其 BorderBrush 和 BorderThickness\
    \ 属性包含了显式值，它会覆盖在创建 Label 的代码中设置的值。Border 控件也没有指定 Background，因此它使用默认的透明背景。\n\n\
    这意味着使用模板的控件不会显示正确的背景或边框。它也不尊重请求的 HorizontalContentAlignment 和 VerticalContentAlignment\
    \ 值。\n\n幸运的是，模板可以通过使用模板绑定来了解客户端控件上设置的一些属性。例如，以下代码片段将模板中某部分的 Background 属性设置为控件的\
    \ Background 属性所设置的值：\n\n```xml\nBackground=\"{TemplateBinding Background}\"\n\
    ```\n\n以下代码展示了更好的 Label 模板版本，它尊重控件的多个背景和前景属性：\n\n可在 Wrox.com 上下载\n\n```xml\n<ControlTemplate\
    \ x:Key=\"temBetterLabel\" TargetType=\"Label\">\n    <Border\n        Background=\"\
    {TemplateBinding Background}\"\n        BorderBrush=\"{TemplateBinding BorderBrush}\"\
    \n        BorderThickness=\"{TemplateBinding BorderThickness}\">\n        <ContentPresenter\
    \ Margin=\"4\"\n            HorizontalAlignment=\"{TemplateBinding HorizontalContentAlignment}\"\
    \n            VerticalAlignment=\"{TemplateBinding VerticalContentAlignment}\"\
    />\n    </Border>\n</ControlTemplate>\n```\n\nWPF 程序员参考 9780470477229 BetterLabelTemplate\n\
    \nBetterLabelTemplate 示例程序在此使用此模板显示一个看起来更像未使用模板的 Label。\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_92_0.png)\n\
    \n### 模板事件\n\n要使模板控件响应事件，你可以像之前向样式添加那样向模板添加属性和事件触发器。\n\n除了由用户操作（如移动或按下鼠标）引起的事件外，控件还必须响应状态变化。例如，尽管\
    \ Label 大多只是静止不动，但当它被禁用时也应改变其外观。\n\n此处显示的 DisabledLabelTemplate 示例程序使用一个模板为禁用的\
    \ Label 提供独特的外观。\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_93_0.png)\n\n以下代码展示了为禁用\
    \ Label 提供外观的模板：\n\n可在 Wrox.com 上下载\n\n```xml\n<ControlTemplate x:Key=\"temWrappedLabel\"\
    \ TargetType=\"Label\">\n    <Grid>\n        <Border Name=\"brdMain\"\n      \
    \          Background=\"{TemplateBinding Background}\"\n                BorderBrush=\"\
    {TemplateBinding BorderBrush}\"\n                BorderThickness=\"{TemplateBinding\
    \ BorderThickness}\">\n            <TextBlock Name=\"txtbContent\"\n         \
    \              Margin=\"4\"\n                       TextWrapping=\"Wrap\"\n  \
    \                     Text=\"{TemplateBinding ContentPresenter.Content}\"/>\n\
    \        </Border>\n        <Canvas Name=\"canDisabled\" Opacity=\"0\">\n    \
    \        <Canvas.Background>\n                <LinearGradientBrush StartPoint=\"\
    0,0\" EndPoint=\"3,3\"\n                                     MappingMode=\"Absolute\"\
    \n                                     SpreadMethod=\"Repeat\">\n            \
    \        <GradientStop Color=\"LightGray\" Offset=\"0\"/>\n                  \
    \  <GradientStop Color=\"Black\" Offset=\"1\"/>\n                </LinearGradientBrush>\n\
    \            </Canvas.Background>\n        </Canvas>\n    </Grid>\n    <ControlTemplate.Triggers>\n\
    \        <Trigger Property=\"IsEnabled\" Value=\"False\">\n            <Setter\
    \ TargetName=\"canDisabled\" Property=\"Opacity\" Value=\"0.5\"/>\n          \
    \  <Setter TargetName=\"txtbContent\" Property=\"Foreground\" Value=\"Gray\"/>\n\
    \        </Trigger>\n    </ControlTemplate.Triggers>\n</ControlTemplate>\n```\n\
    \n### 玻璃按钮\n\n此处显示的 GlassButton 示例程序使用模板为其按钮提供玻璃般的外观。\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_93_1.png)\n\
    \n左侧的禁用按钮看起来褪色且不响应用户。\n\n第二个标记为 Default 的按钮与其他按钮的边框不同。如果用户按下 [Enter] 键时没有其他按钮获得焦点，则该\
    \ Button 会触发其 Click 事件。在上图中，TextBox 具有焦点，因此按下 [Enter] 键会触发默认按钮。\n\n下图显示鼠标悬停在 Button\
    \ 3 上时的程序。鼠标下的按钮变得不那么透明。请注意，焦点仍在 TextBox 中（你可以在此图中看到插入符号），因此默认按钮仍显示其独特的边框。\n\n\
    ![](img/7954dcc7dd1d929d072aec8e9531b6cc_94_0.png)\n\n下图显示用户在 Button 3 上按下鼠标时的程序。\n\
    \n![](img/7954dcc7dd1d929d072aec8e9531b6cc_94_1.png)\n\n此时，按下的按钮是不透明的。按下按钮还会将焦点移动到该按钮。因为焦点现在在\
    \ Button 3 上，默认按钮不再是默认的。事实上，现在没有任何按钮是默认的。Button 3 具有焦点，因此如果用户按下 [Enter] 就会触发，但它不是默认的，所以即使用户释放鼠标后也不会显示默认边框。\n\
    \n如果在按钮仍被按住时将鼠标拖离按钮，按钮会恢复其获得焦点的“鼠标悬停”外观。如果随后释放鼠标，则不会发生鼠标点击。\n\n> 你可以从 WPF Programmer's\
    \ Reference（9780470477229）网站下载示例程序以查看详细信息。\n\n### 研究控件模板\n\n要有效地构建模板，你需要了解控件为你提供了哪些行为以及你需要为其提供哪些行为。你还需要确定控件提供的事件，以便知道何时有机会使控件采取行动。\n\
    \n那么，如何了解有哪些属性和模板绑定可用呢？\n"
