    \n- 3. 从下载中选择 AjaxControlToolkit.dll。找到 DLL 并单击 Open 后，Choose Toolbox Items 对话框将更改为包含该\
    \ DLL 中包含的控件。控件在对话框中突出显示，并且已为您预先选择（如下图所示）。\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_45_1.png)\n\
    \n- 4. 单击 OK，ASP.NET AJAX 控件工具包的控件将被添加到 Visual Studio 工具箱中。下图展示了最终结果。\n"
