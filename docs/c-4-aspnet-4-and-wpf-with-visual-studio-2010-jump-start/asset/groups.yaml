    \ is a packaged set of appearances and behaviors that can give an application\
    \ (or part of an application) a distinctive appearance while still allowing it\
    \ to provide its key features.\n\nFor example, the next two figures show the ResourceDictionaries\
    \ example program (see the “Merged Resource Dictionaries” section) displaying\
