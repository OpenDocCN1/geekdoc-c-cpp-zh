    # EXTENDING <OUTPUTCACHE>


    With the release of ASP.NET 4, you are now able to extend how the OutputCache
    directive works and have it instead work off your own custom means to caching.
    This means that you can wire the OutputCache directive to any type of caching
    means including distributed caches, cloud caches, disc, XML, or anything else
    you can dream up.


    To accomplish this, you are required to create a custom output-cache provider
    as a class and this class will need to inherit from the new System.Web.Caching.OutputCacheProvider
    class. To inherit from OutputCacheProvider, you must override the Add(), Get(),
    Remove(), and Set() methods to implement your custom version of output caching.'
  - "[PAGE 48]\n\nAfter you have your custom implementation in place, the next step\
    \ is to configure this in a configuration file: the machine.config or the web.config\
    \ file. Some changes have been made to the <outputCache> element in the configuration\
    \ file to allow you to apply your custom cache extensions.\n\nThe <outputCache>\
    \ element is found within the <caching> section of the configuration file and\
    \ it now includes a new <providers> subelement.\n\n```\n<caching>\n  <outputCache>\n\
    \    <providers>\n    </providers>\n  </outputCache>\n</caching>\n```\n\nWithin\
    \ the new <providers> element, you can nest an <add> element to make the appropriate\
    \ references to your new output cache capability you built by deriving from the\
    \ OutputCacheProvider class.\n\n```\n<caching>\n  <outputCache defaultProvider=\"\
    AspNetInternalProvider\">\n    <providers>\n      <add name=\"myDistributedCacheExtension\"\
    \n           type=\"Wrox.OutputCacheExtension.DistributedCacheProvider,\n    \
    \       DistributedCacheProvider\" />\n    </providers>\n  </outputCache>\n</caching>\n\
    ```\n\nWith this new <add> element in place, your new extended output cache is\
    \ available to use. One new addition here to also pay attention to is the new\
    \ defaultProvider attribute within the <outputCache> element. In this case, it\
    \ is set to AspNetInternalProvider, which is the default setting in the configuration\
    \ file. This means that by default the output cache works as it always has done\
    \ and stores its cache in the memory of the computer that the program is running.\n\
    \nWith your own output cache provider in place, you can now point to this provider\
    \ through the OutputCache directive on the page as defined here:\n\n```\n<%@ OutputCache\
    \ Duration=\"90\" VaryByParam=\"*\"\n    providerName=\"myDistributedCacheExtension\"\
    \ %>\n```\n\nIf the provider name isn't defined, then the provider that is defined\
    \ in the configuration's defaultProvider attribute is utilized.\n\n# .NET 4'S\
    \ NEW OBJECT CACHING OPTION\n\nFrom what you have seen so far with the System.Web.Caching.Cache\
    \ object, you can see that it is quite powerful and allows for you to even create\
    \ a custom cache. This extensibility and power has changed under the hood of the\
    \ Cache object, though.\n\nDriving this is the System.Runtime.Caching.dll, as\
    \ what was in the System.Web version has been refactored out and everything was\
    \ rebuilt into the new namespace of System.Runtime.Caching."
  - "[PAGE 49]\n\nThe reason for this change wasn’t so much for the ASP.NET developer,\
    \ but instead for other applica-\ntion types such as Windows Forms, Windows Presentation\
    \ Foundation apps, and more. The reason\nfor this is that the System.Web.Caching.Cache\
    \ object was so useful that other application devel-\nopers were bringing over\
    \ the System.Web namespace into their projects to make use of this object.\nSo,\
    \ to get away from a Windows Forms developer needing to bring the System.Web.dll\
    \ into their\nproject just to use the Cache object it provided, this was all extracted\
    \ out and extended with the\nSystem.Runtime.Caching namespace.\n\nAs an ASP.NET\
    \ developer, you can still make use of the System.Web.Caching.Cache object just\n\
    as you did in all the prior versions of ASP.NET. It isn’t going away. However,\
    \ it is important to\nnote that as the .NET Framework evolves, the .NET team will\
    \ be making its investments into the\nSystem.Runtime.Caching namespace rather\
    \ than System.Web.Caching. This means that over\ntime, you will most likely see\
    \ additional enhancements in the System.Runtime.Caching version\nthat don’t appear\
    \ in the System.Web.Caching namespace as you might expect. With that said, it\n\
    doesn’t also mean that you need to move everything over to the new System.Runtime.Caching\n\
    namespace to make sure you are following the strategic path of Microsoft, because\
    \ the two caches\nare managed together under the covers.\n\nThis section runs\
    \ through an example of using the cache from the System.Runtime.Caching\nnamespace.\
    \ For this example, the ASP.NET page simply uses a Label control that shows the\
    \ name\nof a user that is stored in an XML file. The first step is to create an\
    \ XML file and name the file\nUsername.xml. This simple file is presented here\
    \ in the following listing.\n\n# Pro ASP.NET 9780470502204 Listing 22-5: The contents\
    \ of the Username.xml file\n\n```\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
    \ ?>\n<usernames>\n    <user>Bill Evjen</user>\n</usernames>\n```\n```\n\nWith\
    \ this XML file sitting in the root of your drive, now turn your attention to\
    \ the Default.aspx\ncode behind page to use the name in the file and present it\
    \ into a single Label control on the page.\nThe code behind for the Default.aspx\
    \ page is presented here in the following listing.\n\n# Pro ASP.NET 9780470502204\
    \ Listing 22-6: Using the System.Runtime.Caching namespace\n\n```\n```vb\nImports\
    \ System\nImports System.Collections.Generic\nImports System.Linq\nImports System.Runtime.Caching\n\
    Imports System.Xml.Linq\n\nPartial Public Class _Default\n    Inherits System.Web.UI.Page\n\
    \n    Protected Sub Page_Load(ByVal sender As Object, _\n            ByVal e As\
    \ EventArgs) Handles Me.Load\n\n        Dim cache As ObjectCache = MemoryCache.Default\n\
    \n        Dim usernameFromXml As String = _\n            TryCast(cache(\"userFromXml\"\
    ), String)\n\n        If usernameFromXml Is Nothing Then\n```\n```"
