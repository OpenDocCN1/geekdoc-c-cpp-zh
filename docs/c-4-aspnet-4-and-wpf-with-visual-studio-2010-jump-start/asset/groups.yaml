  mdcn: "\n以下代码演示如何调用 `Divide()` 方法。元组的各项可通过属性 `Item1` 和 `Item2` 访问；\n\n```csharp\n\
    var result = Divide(5, 2);\nConsole.WriteLine(\"result of division: {0}, remainder:\
    \ {1}\",\n    result.Item1, result.Item2);\n```\n\n如果元组中需要包含超过八项，可以使用带八个参数的 `Tuple`\
    \ 类定义。最后一个模板参数名为 `TRest`，表示必须传入一个元组本身。这样就能创建包含任意数量参数的元组。\n\n为演示此功能：\n\n```csharp\n\
    public class Tuple<T1, T2, T3, T4, T5, T6, T7, TRest>\n```\n\n在这里，最后一个模板参数本身就是一个元组类型，因此可以创建包含任意数量项的元组：\n\
    \n```csharp\nvar tuple = Tuple.Create<string, string, string, int, int, int, double,\n\
    \    Tuple<int, int>>(\n    \"Stephanie\", \"Alina\", \"Nagel\", 2009, 6, 2, 1.37,\n\
    \    Tuple.Create<int, int>(52, 3490));\n```\n\n## 动态类型\n\n动态类型允许编写绕过编译时类型检查的代码。编译器会假定为\
    \ dynamic 类型对象定义的任何操作都是有效的。如果该操作无效，错误要到运行时才会被发现。以下示例展示了这一点：\n\n```csharp\nclass\
    \ Program\n{\n    static void Main(string[] args)\n    {\n        var staticPerson\
    \ = new Person();\n        dynamic dynamicPerson = new Person();\n        staticPerson.GetFullName(\"\
    John\", \"Smith\");\n        dynamicPerson.GetFullName(\"John\", \"Smith\");\n\
    \    }\n}\nclass Person\n{\n    public string FirstName { get; set; }\n    public\
    \ string LastName { get; set; }\n    public string GetFullName()\n    {\n    \
    \    return string.Concat(FirstName, \" \", LastName);\n    }\n}\n```\n\n此示例无法编译，因为调用了\
    \ `staticPerson.GetFullName()`。`Person` 对象上没有接受两个参数的方法，因此编译器会报错。如果将那一行代码注释掉，示例就能编译。如果执行，则会发生运行时错误。引发的异常是\
    \ `RuntimeBinderException`。`RuntimeBinder` 是运行时中负责计算该调用的对象，用于检查 `Person` 是否真的支持被调用的方法。\n\
    \n与 `var` 关键字不同，定义为 `dynamic` 的对象可以在运行时改变类型。请记住，使用 `var` 关键字时，对象类型的确定被推迟。一旦类型确定，就不能更改。你不仅可以更改动态对象的类型，还可以多次更改。这与将对象从一种类型强制转换为另一种类型不同。强制转换对象时，你创建的是一个具有不同但兼容类型的新对象。例如，不能将\
    \ `int` 强制转换为 `Person` 对象。在以下示例中可以看到，如果对象是 `dynamic` 对象，就可以将它从 `int` 更改为 `Person`：\n\
    \n![](img/7954dcc7dd1d929d072aec8e9531b6cc_11_0.png)\n\n```csharp\ndynamic dyn;\n\
    \ndyn = 100;\nConsole.WriteLine(dyn.GetType());\nConsole.WriteLine(dyn);\n\ndyn\
    \ = \"This is a string\";\nConsole.WriteLine(dyn.GetType());\nConsole.WriteLine(dyn);\n\
    \ndyn = new Person() { FirstName = \"Bugs\", LastName = \"Bunny\" };\nConsole.WriteLine(dyn.GetType());\n\
    Console.WriteLine(\"{0} {1}\", dyn.FirstName, dyn.LastName);\n```\n\n*Pro C# 4.0\
    \ 9780470502259 代码片段 DynamicProgram.cs*\n\n执行这段代码会显示，`dyn` 对象实际上从 `System.Int32`\
    \ 类型变为 `System.String` 类型，再变为 `Person` 类型。如果 `dyn` 被声明为 `int` 或 `string`，这段代码就无法编译。\n\
    \n动态类型有几个限制。动态对象不支持扩展方法。匿名函数（Lambda 表达式）也不能用作动态方法调用的参数，因此 LINQ 无法很好地配合动态对象使用。大多数\
    \ LINQ 调用都是扩展方法，而 Lambda 表达式被用作这些扩展方法的参数。\n\n## 动态类型幕后\n\n那么，幕后发生了什么来实现这一点？C#\
    \ 仍然是静态类型语言。这一点没有改变。请看使用 `dynamic` 类型时生成的 IL（中间语言）。\n\n首先，下面是所查看的示例 C# 代码：\n\n\
    ```csharp\nusing System;\n\nnamespace DeCompile\n{\n    class Program\n    {\n\
