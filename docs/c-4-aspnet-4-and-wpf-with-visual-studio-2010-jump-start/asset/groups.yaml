    \ requires as the first argument the object of the application, which is returned\
    \ from the Application.Current property. The second argument requires an object\
    \ of type JumpList. The jumpList is created with a JumpList constructor passing\
    \ JumpItem elements and two Boolean values. By default, a Jump List contains frequent\
    \ and recent items. Setting the Boolean values, you can influence this default\
    \ behavior. The items you can add to a JumpList derive from the baseclass JumpItem.\
    \ The classes available are JumpTask and JumpPath. With JumpTask, you can define\
    \ a program that should be started when the user selects this item from the Jump\
    \ List. JumpTask defines the properties that are needed to start the application\
    \ and give information to the user, which are CustomCategory, Title, Description,\
    \ ApplicationPath, IconResourcePath, WorkingDirectory, and Arguments. With the\
    \ JumpTask that is defined in the code snippet, notepad.exe is started and initialized\
    \ with the readme.txt document. With a JumpPath item, you can define a file that\
    \ should be listed in the Jump List to start the application from the file. JumpPath\
    \ defines a Path property for assigning the filename. Using a JumpPath item requires\
    \ that the file extension be registered with the application. Otherwise, the registration\
    \ of the items is rejected. To find the reasons for items being rejected, you"
