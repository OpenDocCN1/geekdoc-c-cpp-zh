  mdcn: "\n除了允许多个窗体或应用程序使用相同的资源外，合并字典还允许单个窗口加载多个资源字典。如果你希望使用单独的字典来保存不同的资源组，这会很方便。例如，你可能有单独的字典来保存按钮资源、标签资源和列表资源。\n\
    \n你还可以在同一应用程序中使用多个资源字典，以便轻松地在不同外观之间切换。例如，ResourceDictionaries 示例程序使用以下代码合并 ResBlue.xaml\
    \ 和 ResRed.xaml 这两个资源字典：\n\n可在 Wrox.com 下载\n\n```\n<Window.Resources>\n    <ResourceDictionary>\n\
    \        <ResourceDictionary.MergedDictionaries>\n            <ResourceDictionary\
    \ Source=\"ResBlue.xaml\"/>\n            <ResourceDictionary Source=\"ResRed.xaml\"\
    />\n        </ResourceDictionary.MergedDictionaries>\n    </ResourceDictionary>\n\
    </Window.Resources>\n```\n\n由于 ResRed.xaml 文件是第二个加载的，因此该文件中的资源值优先。下图显示了 ResourceDictionaries\
    \ 程序使用此资源字典中的值。\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_80_0.png)\n\n只需交换这两个资源字典的顺序，就可以完全改变应用程序的外观。下图显示了\
    \ ResourceDictionaries 程序使用 ResBlue.xaml 资源字典中的值。\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_80_1.png)\n\
    \n后面的“皮肤”一节将说明如何在运行时以类似方式切换应用程序的外观。\n\n## 样式和属性触发器\n\n我们刚刚查看了资源——可以分配给控件、使它们具有共同外观和行为的命名属性值。\n\
    \n遗憾的是，资源常常导致冗长而复杂的代码。如果一组控件共享许多属性值，那么将这些属性转换为资源就需要使用冗长的 StaticResource 或 DynamicResource\
    \ 关键字进行大量重复。\n\n样式（Style）是一种特殊资源，它让你可以提取这种冗余并将其集中起来，就像其他资源让你集中属性值一样。样式让你可以定义属性值包，一次性地将其应用于控件，而不必逐个将单个资源值应用于控件。\n\
    \n### 简化属性\n\n样式将应作为一组设置的属性值打包在一起。它以一个包含在资源字典中的 Style 元素开始。你可以根据希望其可用范围，将 Style\
    \ 放在任意资源字典中。例如，如果你希望某个 Style 对整个项目可见，就把它放在 App.xaml 文件的 Application.Resources\
    \ 节中；如果你希望该 Style 对窗口上的每个控件可见，就把它放在 Window.Resources 节中；如果你希望它仅对 StackPanel 内的控件可见，就把它放在\
    \ StackPanel.Resources 节中。\n\n样式可以有一个 x:Key 特性来为其命名，以及一个 TargetType 特性来指示它应应用到的控件类型。（下一节将详细介绍这些特性。）\n\
    \n在 Style 元素内部，Setter 和 EventSetter 元素分别定义样式的属性值和事件处理程序。\n\nSetter 设置属性的值。它接受两个特性——Property\
    \ 和 Value——分别给出要设置的属性及其应取的值。该值可以是像 Red 或 7 这样的简单特性值，也可以是像画笔这样指定更复杂内容的元素特性。\n\n\
    RedRectangles 示例程序使用以下代码定义名为 RedRectStyle 的 Style，该样式应用于 Rectangle。Stroke、StrokeThickness、Width、Height\
    \ 和 Margin 设置器使用属性特性语法提供简单值，而 Fill 设置器使用属性元素语法将其值设置为 RadialGradientBrush 对象。\n\
    \n![](img/7954dcc7dd1d929d072aec8e9531b6cc_81_0.png)\n\n```\n<Style x:Key=\"RedRectStyle\"\
    \ TargetType=\"Rectangle\">\n  <Setter Property=\"Stroke\" Value=\"Red\"/>\n \
    \ <Setter Property=\"StrokeThickness\" Value=\"5\"/>\n  <Setter Property=\"Width\"\
    \ Value=\"100\"/>\n  <Setter Property=\"Height\" Value=\"50\"/>\n  <Setter Property=\"\
    Margin\" Value=\"5\"/>\n  <Setter Property=\"Fill\">\n    <Setter.Value>\n   \
    \   <RadialGradientBrush>\n        <GradientStop Color=\"Red\" Offset=\"0\"/>\n\
    \        <GradientStop Color=\"White\" Offset=\"1\"/>\n      </RadialGradientBrush>\n\
    \    </Setter.Value>\n  </Setter>\n</Style>\n```\n\n你可以像使用任何其他资源一样使用样式。只需将 “Style”\
    \ 属性设置为样式的键。\n\nRedRectangles 示例程序使用以下代码显示三个使用 RedRectStyle 样式的红色 Rectangle：\n\
    \n```\n<StackPanel Orientation=\"Horizontal\">\n<Rectangle Style=\"{StaticResource\
    \ RedRectStyle}\" />\n<Rectangle Style=\"{StaticResource RedRectStyle}\" />\n\
    <Rectangle Style=\"{StaticResource RedRectStyle}\" />\n</StackPanel>\n```\n\n\
    WPF 程序员参考 9780470477229 RedRectangles\n\n请注意样式在多大程度上简化了这段代码。如果没有该样式，每个 Rectangle\
    \ 都需要有自己的 Stroke、StrokeThickness、Width、Height、Margin 和 Fill 属性。\n\n下图显示了正在运行的\
    \ RedRectangles 程序。\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_82_0.png)\n\n\
    ### 未命名样式\n\n在前几节描述的所有样式中，Style 元素都包含一个 x:Key 特性来为样式命名。然后控件使用 StaticResource 关键字引用该名称。\n\
    \n相反，如果省略该特性并包含 TargetType，那么生成的未命名样式将应用于该样式作用域内所有 TargetType 类型的控件。例如，下面的 Style\
    \ 应用于该样式作用域内的每个 Button，因此每个 Button 都显示为黄色背景和红色前景：\n\n```\n<Style TargetType=\"\
    Button\">\n<Setter Property=\"Background\" Value=\"Yellow\" />\n<Setter Property=\"\
    Foreground\" Value=\"Red\" />\n</Style>\n```\n\n下图所示的 UnnamedStyles 示例程序定义了四个未命名样式。以下列表描述了这些样式为其类设置的属性：\n\
    \n- Image — Width = 100，Height = 100，Stretch = Uniform，BitmapEffect = 投影\n- Label\
    \ — FontFamily = Comic Sans MS，FontSize = 18，FontWeight = bold，HorizontalAlignment\
    \ = center，BitmapEffect = 浅蓝色外发光\n- Button — FontFamily = Arial，FontSize = 12，Height\
    \ = 20，Background = 蓝白线性渐变\n- StackPanel — Margin = 5\n\n### IsMouseOver 触发器\n\
    \n一种常见的属性触发器会在用户将鼠标移到某个对象上时采取行动。当 IsMouseOver 属性为 True 时，这些触发器会执行其 Setter。\n\n\
    以下 XAML 代码定义了一个未命名的 Button Style。它设置一些基本值，然后定义一个在 IsMouseOver 属性为 True 时执行的 Trigger。当鼠标移到\
    \ Button 上时，Trigger 会使 Button 变大，并使其字体更大且加粗。\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_84_0.png)\n\
    \n```\n<Style TargetType=\"Button\">\n  <Setter Property=\"VerticalAlignment\"\
    \ Value=\"Top\"/>\n  <Setter Property=\"Margin\" Value=\"10\"/>\n  <Setter Property=\"\
    Background\" Value=\"Violet\"/>\n  <Setter Property=\"Width\" Value=\"100\"/>\n\
    \  <Setter Property=\"Height\" Value=\"30\"/>\n  <Setter Property=\"FontSize\"\
    \ Value=\"16\"/>\n  <Style.Triggers>\n    <Trigger Property=\"IsMouseOver\" Value=\"\
    True\">\n      <Setter Property=\"Width\" Value=\"105\"/>\n      <Setter Property=\"\
    Height\" Value=\"50\"/>\n      <Setter Property=\"FontSize\" Value=\"20\"/>\n\
    \      <Setter Property=\"FontWeight\" Value=\"Bold\"/>\n    </Trigger>\n  </Style.Triggers>\n\
    </Style>\n```\n\n此处所示的 IsMouseOverTriggers 示例程序使用这段代码在鼠标位于按钮上时提供反馈。\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_84_1.png)\n\
    \n### 设置不透明度\n\n下图所示的 ImageTriggers 示例程序使用触发器突出显示鼠标下方的图像。\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_84_2.png)\n\
    \n"
