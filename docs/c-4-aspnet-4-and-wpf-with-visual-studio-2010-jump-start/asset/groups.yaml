    \ currently being paginated.\npublic override IDocumentPaginatorSource Source\n\
    {\n    get { return null; }\n}\n}\n```\n\n# DATA BINDING\n\nWPF data binding lets\
    \ you bind a target to a data source so the target automatically displays the\
    \ value in the data source. For example, this lets you:\n\n+   - Make a `ListBox`\
    \ display an array of values defined in XAML code.\n+   - Make a `ListBox` display\
    \ a list of objects created in code-behind.\n+   - Make a `TreeView` build a hierarchical\
    \ display of objects created in code-behind.\n+   - Make `TextBoxes`, `Labels`,\
    \ and other controls display additional detail about the currently selected item\
    \ in a `ListBox`, `ComboBox`, or `TreeView`.\n\nAdditional WPF data-binding features\
    \ let you sort, filter, and group data; let the user modify a control to update\
    \ a data source; and validate changes to data.\n\n# Binding Basics\n\nData bindings\
    \ have these four basic pieces:\n\n+   - **Target** — The object that will use\
    \ the result of the binding\n+   - **Target Property** — The target object’s property\
    \ that will use the result\n+   - **Source** — The object that provides a value\
    \ for the target object to use\n+   - **Path** — A path that locates the value\
    \ within the source object"
  - "[PAGE 108]\n\nAs a trivial example, suppose you want to bind a Label control's\
    \ Content property so that the Label displays whatever you type in a TextBox.\
    \ If the Label control is named lblResult and the TextBox is named txtTypeHere,\
    \ then you would need to create a binding where:\n\n+   - The target is lblResult\
    \ (the control where you want the binding's result to go).\n+   - The target property\
    \ is Content (you want the Label to display the result in its Content property).\n\
    +   - The source is txtTypeHere (the object providing the value).\n+   - The path\
    \ is Text (the path to the data in the source object, in this case, the TextBox's\
    \ Text property).\n\nThe TextBoxToLabel example program shown here demonstrates\
    \ this kind of simple binding. When you type in the textbox, the two labels below\
