    is configurable as well. You can get to these settings by either clicking on the
    Open IntelliTrace Settings from the IntelliTrace toolbar or by selecting Tools
    > Options and selecting IntelliTrace from the items in the left side of the dialog.
    On the General tab of the IntelliTrace section (shown in the next figure), you
