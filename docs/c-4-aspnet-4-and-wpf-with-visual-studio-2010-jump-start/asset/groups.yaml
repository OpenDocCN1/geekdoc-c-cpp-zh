  md: "\nThe ImageColors example program, which is shown in the next figure, demonstrates\
    \ all of the different techniques for attaching UI elements to code-behind in\
    \ a single program. The program's different buttons are attached to event handlers\
    \ in different ways. Download the C# or Visual Basic version of this program from\
    \ the book's web site to see the details.\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_74_0.png)\n\
    \n## EVENT NAME ATTRIBUTES\n\nThe first way to attach code-behind to a control's\
    \ events uses an attribute in the XAML code. The attribute's name is the same\
    \ as the event that you want to catch. Its value is the name of the event handler\
    \ in the code-behind.\n\nFor example, the following XAML code defines a Button\
    \ named btnApply. The Click attribute indicates that the routine btnApply_Click\
    \ catches the control's Click event handler.\n\n```xml\n<Button Content=\"Apply\"\
    \ IsDefault=\"True\"\nName=\"btnApply\" Click=\"btnApply_Click\"/>\n```\n\nUnfortunately,\
    \ if you simply add the event handler declaration to the XAML code, the program\
    \ won't run. If you try to execute it in Expression Blend or Visual Studio, you'll\
    \ receive an error that says your program doesn't contain a definition for the\
    \ event handler routine.\n\nThe following C# code handles the event declared in\
    \ the previous XAML code:\n\n```csharp\nprivate void btnApply_Click(object sender,\
    \ RoutedEventArgs e)\n{\n    this.Background = borSample.Background;\n}\n```\n\
    \nThis code catches the btnApply Button's Click event and sets the window's Background\
    \ property to the value used by the borSample control's Background property (more\
    \ details on this shortly).\n\nYour code doesn't need to do anything special to\
    \ wire up the event handler to catch the event — Expression Blend and Visual Studio\
    \ take care of that for you.\n\nThe following XAML fragment shows how the EventNameAttributes\
    \ example program determines which event handlers catch the key events raised\
    \ by the program's Apply button, and the scrollbar and textbox that control the\
    \ color's red component. The code for the other scrollbars and textboxes is similar.\n\
    \n![](img/7954dcc7dd1d929d072aec8e9531b6cc_75_0.png)\n\n```xml\n<ScrollBar Orientation=\"\
    Horizontal\" Minimum=\"0\" Maximum=\"255\"\nGrid.Row=\"0\" Grid.Column=\"0\" Value=\"\
    255\"\nName=\"scrRed\" ValueChanged=\"scrRed_ValueChanged\"/>\n\n<TextBox Margin=\"\
    2\" Grid.Row=\"0\" Grid.Column=\"1\" Text=\"255\"\nHorizontalContentAlignment=\"\
    Right\" VerticalContentAlignment=\"Center\"\nName=\"txtRed\" TextChanged=\"txtRed_TextChanged\"\
    />\n\n<Button Grid.Row=\"3\" Grid.Column=\"0\" Grid.ColumnSpan=\"3\" Width=\"\
    100\" Height=\"40\"\nContent=\"Apply\" IsDefault=\"True\"\nName=\"btnApply\" Click=\"\
    btnApply_Click\"/>\n```\n\nThe following C# fragment shows how the EventNameAttributes\
    \ program responds when you use the first scrollbar or textbox to change the red\
    \ color component, and when you click on the Apply button. The event handlers\
    \ for the other scrollbars and textboxes are similar.\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_75_1.png)\n\
    \n```csharp\n// A ScrollBar has been changed. Update the corresponding TextBox.\n\
    private void scrRed_ValueChanged(object sender,\nRoutedPropertyChangedEventArgs<double>\
    \ e)\n{\n    if (txtRed == null) return;\n    txtRed.Text = ((int)scrRed.Value).ToString();\n\
    \    ShowSample();\n}\n\n// A TextBox has been changed. Update the corresponding\
    \ ScrollBar.\nprivate void txtRed_TextChanged(object sender,\nTextChangedEventArgs\
    \ e)\n{\n    // Keep the value within bounds.\n    int value;\n    try {\n   \
    \     value = int.Parse(txtRed.Text);\n    } catch {\n        value = 0;\n   \
    \ }\n\n    if (value < 0) value = 0;\n    if (value > 255) value = 255;\n    txtRed.Text\
    \ = value.ToString();\n\n    if (scrRed == null) return;\n    scrRed.Value = value;\n\
    \    ShowSample();\n}\n\n// Display a sample of the color.\nprivate void ShowSample()\n\
    {\n    if (borSample == null) return;\n\n    byte r, g, b;\n    try {\n      \
    \  r = byte.Parse(txtRed.Text);\n    } catch {\n        r = 0;\n    }\n    try\
    \ {\n        g = byte.Parse(txtGreen.Text);\n    } catch {\n        g = 0;\n \
    \   }\n    try {\n        b = byte.Parse(txtBlue.Text);\n    } catch {\n     \
    \   b = 0;\n    }\n    borSample.Background = new SolidColorBrush(Color.FromRgb(r,\
    \ g, b));\n}\n```\n\n> *WPF Programmer's Reference 9780470477229 EventNameAttributes*\n\
