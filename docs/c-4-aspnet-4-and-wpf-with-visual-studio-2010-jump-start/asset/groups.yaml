  - "[PAGE 23]\n\n# # Continuation Tasks\n\nWith tasks, you can specify that after\
    \ a task is finished another specific task should start to run, for example, a\
    \ new task that uses a result from the previous one or that should do some cleanup\
    \ if the previous task failed.\n\nWhereas the task handler has either no parameter\
    \ or one object parameter, the continuation handler has a parameter of type `Task`.\
    \ Here, you can access information about the originating task.\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_23_0.png)\n\
    \n```\n```csharp\nstatic void DoOnFirst()\n{\n    Console.WriteLine(\"doing some\
    \ task {0}\", Task.CurrentId);\n    Thread.Sleep(3000);\n}\n\nstatic void DoOnSecond(Task\
    \ t)\n{\n    Console.WriteLine(\"task {0} finished\", t.Id);\n    Console.WriteLine(\"\
    this task id {0}\", Task.CurrentId);\n    Console.WriteLine(\"do some cleanup\"\
    );\n    Thread.Sleep(3000);\n}\n```\n```\n\n> *Pro C# 4 9780470502259 code snippet\
    \ TaskSamples/Program.cs*\n\nA continuation task is defined by invoking the `ContinueWith`\
    \ method on a task. You could also use the `TaskFactory` for this. `t1.OnContinueWith(DoOnSecond)`\
    \ means that a new task invoking the method `DoOnSecond()` should be started as\
    \ soon as the task `t1` is finished. You can start multiple tasks when one task\
    \ is finished, and a continuation task can also have another continuation task,\
    \ as this example demonstrates.\n\n```\n```csharp\nTask t1 = new Task(DoOnFirst);\n\
    Task t2 = t1.ContinueWith(DoOnSecond);\nTask t3 = t1.ContinueWith(DoOnSecond);\n\
    Task t4 = t2.ContinueWith(DoOnSecond);\n```\n```\n\nThe continuation tasks so\
    \ far were always started when the previous task was finished, no matter how the\
    \ previous task was finished. With values from `TaskContinuationOptions`, you\
    \ can define that a continuation task should only start if the originating task\
    \ was successful (or faulted). Some of the possible values are `OnlyOnFaulted`,\
    \ `NotOnFaulted`, `OnlyOnCanceled`, `NotOnCanceled`, and `OnlyOnRanToCompletion`.\n\
    \n```\n```csharp\nTask t5 = t1.ContinueWith(DoOnError,\n                     \
    \   TaskContinuationOptions.OnlyOnFaulted);\n```\n```\n\n# # Task Hierarchies\n\
    \nWith task continuations, one task is started after another. Tasks can also form\
    \ a hierarchy. When a task itself starts a new task, a parent/child hierarchy\
    \ is started.\n\nIn the code snippet that follows, within the task of the parent,\
    \ a new task is created. The code to create a child task is the same as creating\
    \ a parent task. The only difference is that the task is created from within another\
    \ task."
