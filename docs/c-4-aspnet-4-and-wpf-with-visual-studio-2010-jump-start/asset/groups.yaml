  - "[PAGE 80]\n\nIn addition to allowing multiple forms or applications to use the\
    \ same resources, merged dictionaries allow a single window to load more than\
    \ one resource dictionary. This can be handy if you want to use separate dictionaries\
    \ to hold different groups of resources. For example, you might have separate\
    \ dictionaries to hold button resources, label resources, and list resources.\n\
    \nYou can also use multiple resource dictionaries in the same application to switch\
    \ easily between different appearances. For example, the ResourceDictionaries\
    \ example program uses the following code to merge two resource dictionaries,\
    \ ResBlue.xaml and ResRed.xaml:\n\nAvailable for download on Wrox.com\n\n```\n\
    <Window.Resources>\n    <ResourceDictionary>\n        <ResourceDictionary.MergedDictionaries>\n\
    \            <ResourceDictionary Source=\"ResBlue.xaml\"/>\n            <ResourceDictionary\
    \ Source=\"ResRed.xaml\"/>\n        </ResourceDictionary.MergedDictionaries>\n\
    \    </ResourceDictionary>\n</Window.Resources>\n```\n\nBecause the file ResRed.xaml\
    \ is loaded second, the resource values in that file take precedence. This figure\
    \ shows the ResourceDictionaries program using the values in this resource dictionary.\n\
    \n![](img/7954dcc7dd1d929d072aec8e9531b6cc_80_0.png)\n\nBy simply switching the\
    \ order of these two resource dictionaries, you can completely change the application's\
    \ appearance. The following figure shows the ResourceDictionaries program using\
    \ the values in the ResBlue.xaml resource dictionary.\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_80_1.png)\n\
    \nThe later section “Skins” explains how to switch an application’s appearance\
    \ in a similar manner at run time."
  - "[PAGE 81]\n\n# STYLES AND PROPERTY TRIGGERS\n\nWe just looked at resources —\
    \ named property values that you can assign to controls to give them a common\
    \ appearance and behavior.\n\nUnfortunately, resources often lead to long and\
    \ complicated code. If a group of controls shares many property values, then converting\
    \ the properties into resources requires a lot of repetition using the verbose\
    \ StaticResource or DynamicResource keywords.\n\nA Style is a special kind of\
    \ resource that lets you extract this redundancy and centralize it, much as other\
    \ resources let you centralize property values. Styles let you define packages\
    \ of property values that you can apply to a control all at once instead of applying\
    \ individual resource values to the control one at a time.\n\n# Simplifying Properties\n\
    \nA style packages property values that should be set as a group. It begins with\
    \ a Style element contained in a resource dictionary. You can place the Style\
    \ in any resource dictionary depending on how widely you want it to be available.\
    \ For example, if you want a Style to be visible to the entire project, place\
    \ it in the Application.Resources section in the App.xaml file; if you want the\
    \ Style visible to every control on a window, place it in the Window.Resources\
    \ section; and if you want it to be visible only to controls inside a StackPanel,\
    \ place it inside the StackPanel.Resources section.\n\nA style can have an x:Key\
    \ attribute to give it a name and a TargetType attribute to indicate the kind\
    \ of control to which it should apply. (The next section says more about these\
    \ attributes.)\n\nInside the Style element, Setter and EventSetter elements define\
    \ the style's property values and event handlers, respectively.\n\nA Setter sets\
    \ a property's value. It takes two attributes — Property and Value — that give\
    \ the property to be set and the value it should take. The value can be a simple\
    \ attribute value like Red or 7, or it can be an element attribute specifying\
    \ something more complex like a brush.\n\nThe RedRectangles example program uses\
    \ the following code to define a Style named RedRectStyle that applies to Rectangles.\
    \ The Stroke, StrokeThickness, Width, Height, and Margin setters use property\
    \ attribute syntax to provide simple values, while the Fill setter uses property\
    \ element syntax to set its value to a RadialGradientBrush object.\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_81_0.png)\n\
    \n```\n<Style x:Key=\"RedRectStyle\" TargetType=\"Rectangle\">\n  <Setter Property=\"\
    Stroke\" Value=\"Red\"/>\n  <Setter Property=\"StrokeThickness\" Value=\"5\"/>\n\
    \  <Setter Property=\"Width\" Value=\"100\"/>\n  <Setter Property=\"Height\" Value=\"\
    50\"/>\n  <Setter Property=\"Margin\" Value=\"5\"/>\n  <Setter Property=\"Fill\"\
    >\n    <Setter.Value>\n      <RadialGradientBrush>\n        <GradientStop Color=\"\
    Red\" Offset=\"0\"/>\n        <GradientStop Color=\"White\" Offset=\"1\"/>\n \
    \     </RadialGradientBrush>\n    </Setter.Value>\n  </Setter>\n</Style>\n```"
  - '[PAGE 82]


    You can use a style just as you use any other resource. Simply set the “Style”
    property to the style’s key.


    The RedRectangles example program uses the following code to display three red
    Rectangles that use the RedRectStyle style:


    ```

    <StackPanel Orientation="Horizontal">

    <Rectangle Style="{StaticResource RedRectStyle}" />

    <Rectangle Style="{StaticResource RedRectStyle}" />

    <Rectangle Style="{StaticResource RedRectStyle}" />

    </StackPanel>

    ```


    WPF Programmer''s Reference 9780470477229 RedRectangles


    Notice how much the style simplifies this code. Without the the style, each Rectangle
    would need to have its own Stroke, StrokeThickness, Width, Height, Margin, and
    Fill properties.


    This figure shows the RedRectangles program in action.


    ![](img/7954dcc7dd1d929d072aec8e9531b6cc_82_0.png)


    # Unnamed Styles


    In all of the styles described in the previous sections, the Style element included
    an x:Key attribute to give the style a name. Then controls used the StaticResource
    keyword to refer to the name.


    In contrast, if you omit the attribute and include a TargetType, then the resulting
    unnamed style applies to all controls of the TargetType within the style’s scope.
    For example, the following Style applies to every Button within the style’s scope,
    so every Button appears with a yellow background and a red foreground:


    ```

    <Style TargetType="Button">

    <Setter Property="Background" Value="Yellow" />

    <Setter Property="Foreground" Value="Red" />

    </Style>

    ```


    The UnnamedStyles example program shown in the next figure defines four unnamed
    styles. The following list describes the properties that those styles set for
    their classes:


    +   - Image — Width = 100, Height = 100, Stretch = Uniform, BitmapEffect = drop
    shadow

    +   - Label — FontFamily = Comic Sans MS, FontSize = 18, FontWeight = bold, HorizontalAlignment
    = center, BitmapEffect = light blue outer glow

    +   - Button — FontFamily = Arial, FontSize = 12, Height = 20, Background = blue
    and white linear gradient

    +   - StackPanel — Margin = 5'
