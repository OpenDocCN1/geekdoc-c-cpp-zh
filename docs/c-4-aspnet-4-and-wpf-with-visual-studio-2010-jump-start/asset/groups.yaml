    \n# PARALLEL CLASS\n\nAnother abstraction of threads that is new with .NET 4 is\
    \ the Parallel class. This class defines static methods for a parallel for and\
    \ foreach. With the language defined for for and foreach, the loop is run from\
    \ one thread. The Parallel class uses multiple tasks and, thus, multiple threads\
    \ for this job.\n\nWhile the Parallel.For() and Parallel.ForEach() methods invoke\
    \ the same method several times, Parallel.Invoke() allows invoking different methods\
    \ concurrently.\n\n# Looping with the Parallel.For Method\n\nThe Parallel.For()\
