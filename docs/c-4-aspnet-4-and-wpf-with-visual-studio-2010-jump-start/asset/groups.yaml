    A `FlowDocument` object represents the flow document itself. The `FlowDocument`''s
    children must be objects that are derived from the `Block` class. These include
    `BlockUIContainer`, `List`, `Paragraph`, `Section`, and `Table`.


    # THREE-DIMENSIONAL DRAWING


    WPF relies on Microsoft''s DirectX technologies for high-quality multimedia support.


    One of my favorite parts of DirectX is Direct3D, the three-dimensional (3D) drawing
    library.


    The TexturedBlock example program shown in the next figure displays a simple cube
    with sides made of various materials sitting on a brick and grass surface. You
    can use the sliders to rotate the scene in real time.


    ![](img/7954dcc7dd1d929d072aec8e9531b6cc_119_0.png)


    Unfortunately, writing Direct3D code to display these types of objects is fairly
    involved. One of the first and most annoying tasks is figuring out what graphics
    hardware is available on the user''s computer.


    Fortunately, WPF''s 3D drawing objects handle this setup for you.


    That doesn''t mean that the rest of the process is easy. Producing a 3D scene
    requires a fair amount of work because there are many complicated factors to consider,
    but at least WPF takes care of initialization and redrawing.


    The following section explains the basic structure and geometry of a simple 3D
    scene. The sections after that describe cameras, lighting, and materials in greater
    detail.


    # Basic Structure


    The `Viewport3D` control displays a 3D scene. You can think of it as a window
    leading into 3D space.


    The `Viewport3D` object''s `Camera` property defines the camera used to view the
    scene.


    The `Viewport3D` should contain one or more `ModelVisual3D` objects that define
    the items in the scene. The `ModelVisual3D`''s `Content` property should contain
    the visual objects.'
  - '[PAGE 120]


    Typically, the Content property holds either a single GeometryModel3D object that
    defines the entire scene or a Model3DGroup object that holds a collection of GeometryModel3D
    objects.


    Each GeometryModel3D object can define any number of triangles, so a single GeometryModel3D
    object can produce a very complicated result. Since the triangles don’t even need
    to be connected to each other, a GeometryModel3D could define several separate
    physical objects.


    The catch is that a single GeometryModel3D can only have one material, so any
    separate objects would have a similar appearance.


    The “Materials” section later describes materials in greater detail.


    The GeometryModel3D object’s two most important properties are Material (which
    was just described) and Geometry. The Geometry property should contain a single
    MeshGeometry3D object that defines the triangles that make up the object.


    MeshGeometry3D has four key properties that define its triangles: Positions, TriangleIndices,
    Normals, and TextureCoordinates. The following sections describe these properties.


    # Positions


    The MeshGeometry3D’s Positions property is a list of 3D point coordinate values.
    You can separate the coordinates in the list by spaces or commas.


    For example, the value "1,0,1 -1,0,1 1,0,-1 -1,0,-1" defines the four points in
    the Y = 0 plane where X and Z are 1 or -1. This defines a square two units wide
    centered at the origin.


    # TriangleIndices


    The TriangleIndices property gives a list of indexes into the Positions array
    that give the points that make up the object’s triangles. Note that the triangles
    are free to share the points defined by the Positions property.


    # Outward Orientation


    A vector that points perpendicularly to a triangle is called a normal or surface
    normal for the triangle (or any other surface for that matter). Sometimes people
    require that the normal have length 1. Alternatively, they may call a length 1
    normal a unit normal.


    Note that a triangle has two normals that point in opposite directions. If the
    triangle is lying flat on a table, then one normal points toward the ceiling,
    and the other points toward the floor.


    The right-hand rule lets you use the order of the points that define the triangle
    to determine which normal is which.


    To use the right-hand rule, picture the triangle ABC that you are building in
    3D space. Place your right index finger along the triangle’s first segment AB
    as shown in the next figure. Then bend your middle finger inward so it lies along
    the segment AC. If you’ve done it right, then your thumb (the'
  - '[PAGE 121]


    blue arrow) points toward the triangle''s “outside.” The *outer normal* is the
    normal that lies on the same side of the triangle as your thumb.


    ![](img/7954dcc7dd1d929d072aec8e9531b6cc_121_0.png)


    Why should you care about the right-hand rule and outwardly-oriented normals?
    Direct3D uses the triangle''s orientation to decide whether it should draw the
    triangle. If the outwardly-oriented normal points *toward* the camera''s viewing
    position, then Direct3D draws the triangle. If the outwardly-oriented normal points
    *away from* the camera''s viewing position, then Direct3D doesn''t draw the triangle.


    # ## Normals


    As you''ll see in the section “Lighting” later, a triangle''s normal not only
    determines whether it''s visible, but it also helps determine the triangle''s
    color. That means more accurate normals give more accurate colors.


    Left to its own devices, Direct3D finds a triangle''s normal by performing some
    calculations using the points that define the triangle. (It lines up its virtual
    fingers to apply the right-hand rule.)


    For objects defined by flat surfaces such as cubes, octahedrons, and other polyhedrons,
    that works well. For smooth surfaces such as spheres, cylinders, and torii (donuts),
    it doesn''t work as well because the normal at one part of a triangle on the object''s
    surface points in a slightly different direction from the normals at other points.


    The `MeshGeometry3D` object''s `Normals` property lets you tell the drawing engine
    what normals to use for the points defined by the object''s `Positions` property.
    The engine still uses the calculated normal to decide whether to draw a triangle,
    but it uses the normals you supply to color the triangle.


    # ## TextureCoordinates


    The `TextureCoordinates` property is a collection that determines how points are
    mapped to positions on a material''s surface. You specify a point''s position
    on the surface by giving the coordinates of the point on the brush used by the
    material to draw the surface.'
  - '[PAGE 122]


