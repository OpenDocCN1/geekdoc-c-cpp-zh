    \ %>\n<%@ Register Assembly=\"System.Web.DataVisualization, Version=4.0.0.0\"\
    ,\n    Culture=\"neutral\", PublicKeyToken=\"31bf3856ad364e35\"\n    Namespace=\"\
    System.Web.UI.DataVisualization.Charting\" TagPrefix=\"asp\" %>\n\n<html xmlns=\"\
    http://www.w3.org/1999/xhtml\">\n<head runat=\"server\">\n    <title>MultiView\
    \ Server Control</title>\n</head>\n<body>\n<form id=\"form1\" runat=\"server\"\
    >\n<div>\n<asp:Chart ID=\"Chart1\" runat=\"server\"\n    DataSourceID=\"SqlDataSource1\"\
    \n    Width=\"500px\">\n    <Series>\n        <asp:Series ChartType=\"Bar\" Name=\"\
    Series1\"\n            XValueMember=\"Name\"\n            YValueMembers=\"OrderQty\"\
    \ YValuesPerPoint=\"2\">\n        </asp:Series>\n    </Series>\n    <ChartAreas>\n\
    \        <asp:ChartArea Name=\"ChartArea1\">\n        </asp:ChartArea>\n    </ChartAreas>\n\
    </asp:Chart>\n<asp:SqlDataSource ID=\"SqlDataSource1\" runat=\"server\"\n    ConnectionString=\"\
    <%$ ConnectionStrings:ConnectionString %>\"\n    SelectCommand=\"SELECT TOP (5)\
    \ Production.Product.Name,\nSales.SalesOrderDetail.OrderQty FROM Sales.SalesOrderDetail\n\
    INNER JOIN Production.Product ON\nSales.SalesOrderDetail.ProductID =\nProduction.Product.ProductID\
    \ ORDER BY\nSales.SalesOrderDetail.OrderQty DESC\"\n</asp:SqlDataSource>\n</div>\n\
    </form>\n</body>\n</html>\n```\n\n从中可以看出，连接所有内容所需的代码并不多。最值得注意的是，将此图表服务器控件放置在页面上实际上在页面顶部添加了一个\
    \ @Register 指令。这与大多数 ASP.NET 服务器控件不同。\n\n在此控件的 `<Series>` 元素中，您可以根据需要拥有任意数量的系列，当并排绘制多个项目（如两个或多个股票的价格时间序列）时，这非常常见。\n\
    \n运行此代码，您将获得与此处展示类似的结果。\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_42_0.png)\n\
    \n### ASP.NET AJAX 控件工具包\n\n安装 .NET Framework 4 并使用 Visual Studio 2010 后，您会发现一些可用的控件，允许您构建具有服务器端\
    \ AJAX 功能的 ASP.NET 应用程序。这是让您的应用程序更上一层楼的框架，因为您可以用它实现很多功能，包括为用户和自定义服务器控件添加特定的 AJAX\
    \ 功能。添加到应用程序中的每个 AJAX 增强功能都会让应用程序对最终用户来说更流畅、更具响应性。\n\n如果这是构建 Web 应用程序的新世界，您可能会想知道\
    \ Visual Studio 2010 此版本的大型 AJAX 启用服务器控件在哪里。您看不到新的 AJAX 服务器控件部分的原因是 Microsoft\
    \ 将它们视为开源项目，而不是简单地将其融入 Visual Studio 2010。\n\nMicrosoft 和社区的开发人员一直在开发一系列可用于 ASP.NET\
