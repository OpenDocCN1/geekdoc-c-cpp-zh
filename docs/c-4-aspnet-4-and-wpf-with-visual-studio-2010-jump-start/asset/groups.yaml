    \n然后终端用户可以滚动浏览颜色选项，并在用户选择其中一种颜色后，弹出窗口消失，十六进制颜色代码显示在 TextBox 中。此最终结果在此处呈现。\n\n\
    ![](img/7954dcc7dd1d929d072aec8e9531b6cc_47_1.png)\n\n## 扩展 <OUTPUTCACHE>\n\n\
    随着 ASP.NET 4 的发布，您现在能够扩展 OutputCache 指令的工作方式，并使其改用您自己的自定义缓存方式。这意味着您可以将 OutputCache\
    \ 指令连接到任何类型的缓存方式，包括分布式缓存、云缓存、磁盘、XML 或您能想到的任何其他方式。\n\n为此，您需要创建一个自定义输出缓存提供程序作为类，并且该类需要继承自新的\
    \ System.Web.Caching.OutputCacheProvider 类。要继承 OutputCacheProvider，您必须重写 Add()、Get()、Remove()\
    \ 和 Set() 方法以实现您自定义的输出缓存版本。\n\n在您完成自定义实现后，下一步是在配置文件中进行配置：machine.config 或 web.config\
    \ 文件。配置文件中的 <outputCache> 元素已进行一些更改，以便您可以应用自定义缓存扩展。\n\n<outputCache> 元素位于配置文件的\
    \ <caching> 部分中，现在它包含了一个新的 <providers> 子元素。\n\n```\n<caching>\n  <outputCache>\n\
