    The first animation makes the `Canvas.Left` property of the control `img1` change
    from its current value (whatever it is) to 120 over a 0.5-second interval. The
    second animation similarly changes the control''s `Canvas.Top` property to 0 over
    the same 0.5 second.


    The third and fourth animations change the `img1` control''s `Width` and `Height`
    properties to 485 and 400, respectively. The final animation changes the control''s
    `Opacity` to 1 so it is completely opaque.


    # Animation Types


    WPF provides many classes for animating properties with different data types.
    The following table lists data types that have corresponding animation classes.
    For example, you can use the `Int32Animation` class to animate a 32-bit integer
    property.


    | Boolean | Int16 | Point3D | String |

    | Byte | Int32 | Quaternion | Thickness |

    | Char | Int64 | Rect | Vector |

    | Color | Matrix | Rotation3D | Vector3D |

    | Decimal | Object | Single |  |

    | Double | Point | Size |  |


    Most of these data types have two kinds of animation classes. The first has the
    suffix `Animation` and performs a simple linear interpolation of the property''s
    values so that the property''s value is set proportionally between the start and
    finish values based on the elapsed time. When the `Duration` is 1/4 over, the
    value will be one-fourth of the way between the start and finish values.


    The second type of animation class has the suffix `AnimationUsingKeyFrames`. This
    type of animation changes a property from one value to another while visiting
    specific key values in between. You can use several different kinds of objects
    to specify key frame values, and the type of key frame class determines how the
    animation moves to the frame''s value.


    The most common types of key frame objects move to their key values linearly,
    using a spline, or discretely. A few other key frame animations can make their
    values follow a path.


    For example, you can use a path animation to move a control along the border of
    an ellipse or a series of curves.


    The RovingButtonWithPath example program shown in here moves a `Button` along
    the path shown in black. As it moves, the `Button` rotates to match the curve''s
    angle at that point.


    ![](img/7954dcc7dd1d929d072aec8e9531b6cc_88_0.png)'
  - '[PAGE 89]


    The RovingButtonWithPath program uses the following code to animate its Button:


    ```

    <PathGeometry x:Key="pathMove"

    Figures="M 10,85

    A 100,70 0 1 1 210,85

    A 100,70 0 1 0 410,85

    A 130,70 0 1 0 150,85

    A 70,70 0 1 1 10,85"/>

    <Storyboard x:Key="sbMoveButton" RepeatBehavior="Forever">

    <DoubleAnimationUsingPath Duration="0:0:4"

    Storyboard.TargetName="btnMover"

    Storyboard.TargetProperty="(Canvas.Left)"

    Source="X"

    PathGeometry="{StaticResource pathMove}"/>

    <DoubleAnimationUsingPath Duration="0:0:4"

    Storyboard.TargetName="btnMover"

    Storyboard.TargetProperty="(Canvas.Top)"

    Source="Y"

    PathGeometry="{StaticResource pathMove}"/>

    <DoubleAnimationUsingPath Duration="0:0:4"

    Storyboard.TargetName="btnMover"

    Storyboard.TargetProperty="RenderTransform.Angle"

    Source="Angle"

    PathGeometry="{StaticResource pathMove}"/>

    </Storyboard>

    ```


    WPF Programmer''s Reference 9780470477229 RovingButtonWithPath


    The code first creates a PathGeometry object to define the path. It then uses
    that object in the sbMoveButton Storyboard.


    The Storyboard''s first DoubleAnimationUsingPath object changes the Button''s
    Canvas.Left property. The Source attribute indicates that the property should
    be set to the path''s X coordinate as the animation progresses over the path.


    Similarly, the second DoubleAnimationUsingPath object makes the Button''s Canvas.Top
    property match the path''s Y coordinate as the animation progresses.


    The Button''s definition includes a RenderTransform object that initially rotates
    the Button by -90 degrees. The final animation object makes the Button''s Transform.Angle
    property match the path''s Angle during the animation.


    # Media and Timelines


    The BeginStoryboard, PauseStoryboard, and other Storyboard control classes are
    really just action wrappers — objects that perform actions rather than representing
    “physical” objects such as buttons, labels, and grids. Another useful action wrapper
    is SoundPlayerAction, which plays an audio file.


    The BouncingBall example program shown in the next figure uses the following Storyboard
    to make its red ball bounce up and down while playing a sound effect each time
    the ball hits the “ground.”


    ```

    <!-- One Storyboard to rule them all. -->

    <Storyboard x:Key="sbBounce" RepeatBehavior="Forever">

    <!-- Play the sound after 1 second. -->

    <ParallelTimeline BeginTime="0:0:0">

    <MediaTimeline BeginTime="0:0:1" Source="boing.wav"

    ```'
