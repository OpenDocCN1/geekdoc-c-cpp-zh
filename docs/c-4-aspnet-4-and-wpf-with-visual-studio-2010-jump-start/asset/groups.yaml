  - "[PAGE 34]\n\nTo configure the taskbar item, the namespace System.Windows.Shell\
    \ contains a dependency property for the Window class to add taskbar information.\
    \ The TaskbarItemInfo property can contain a TaskbarItemInfo element. With TaskbarItemInfo,\
    \ you can set the Description property, which is shown as tooltip information.\
    \ With the properties ProgressState and ProgressValue, feedback can be given on\
    \ a current state of the application. ProgressState is of type TaskbarItemProgressState,\
    \ which defines the enumeration values None, Intermediate, Normal, Error, and\
    \ Paused. Depending on the value of this setting, progress indicators are shown\
    \ on the taskbar item. The Overlay property allows you to define an image that\
    \ is displayed over the icon in the taskbar. This property will be set from code-behind.\n\
    \nThe taskbar item can contain a ThumbButtonInfoCollection, which is assigned\
    \ to the ThumbButtonInfos property of the TaskbarItemInfo. Here, you can add buttons\
    \ of type ThumbButtonInfo, which are displayed in the preview of the application.\
    \ The sample contains two ThumbButtonInfo elements, which have Command set to\
    \ the same commands as the play and stop Button elements created previously. With\
    \ these buttons, you can control the application in the same way as with the other\
    \ Button elements in the application. The image for the buttons in the taskbar\
    \ is taken from resources with the keys StartImage and StopImage.\n\n```\n<Window.TaskbarItemInfo>\n\
    \    <TaskbarItemInfo x:Name=\"taskBarItem\" Description=\"Sample Application\"\
    >\n        <TaskbarItemInfo.ThumbButtonInfos>\n            <ThumbButtonInfo IsEnabled=\"\
    True\" Command=\"MediaCommands.Play\"\n                CommandTargets=\"{Binding\
    \ ElementName=buttonPlay}\"\n                Description=\"Play\"\n          \
    \      ImageSource=\"{StaticResource StartImage}\" />\n            <ThumbButtonInfo\
    \ IsEnabled=\"True\" Command=\"MediaCommands.Stop\"\n                CommandTargets=\"\
    {Binding ElementName=buttonStop}\"\n                Description=\"Stop\"\n   \
    \             ImageSource=\"{StaticResource StopImage}\" />\n        </TaskbarItemInfo.ThumbButtonInfos>\n\
    \    </TaskbarItemInfo>\n</Window.TaskbarItemInfo>\n```\n\nThe images referenced\
