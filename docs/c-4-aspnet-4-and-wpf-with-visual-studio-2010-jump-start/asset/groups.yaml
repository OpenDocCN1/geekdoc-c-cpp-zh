    \ Language=\"C#\" %>\n<%@ Register Assembly=\"AjaxControlToolkit\" Namespace=\"\
    AjaxControlToolkit\" TagPrefix=\"asp\" %>\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
    >\n<head runat=\"server\">\n<title>ColorPickerExtender</title>\n</head>\n<body>\n\
    ```\n\n```\n<form id=\"form1\" runat=\"server\">\n<div>\n<asp:ToolkitScriptManager\
    \ ID=\"ToolkitScriptManager1\" runat=\"server\">\n</asp:ToolkitScriptManager>\n\
    <br />\nPick your favorite color:<br />\n<asp:TextBox ID=\"TextBox1\" runat=\"\
    server\"></asp:TextBox>\n<asp:ColorPickerExtender ID=\"ColorPickerExtender1\"\n\
    runat=\"server\" TargetControlID=\"TextBox1\">\n</asp:ColorPickerExtender>\n</div>\n\
    </form>\n</body>\n</html>\n```\n\nWhen this page opens, you simply have a single\
    \ TextBox server control on the page. Applying focus to this TextBox control pops\
    \ up the color selector, as illustrated here in black and white in the next figure.\n\
    \n![](img/7954dcc7dd1d929d072aec8e9531b6cc_47_0.png)\n\nThe end user then can\
    \ scroll across the color options and after the user selects one of these colors,\
    \ the pop-up disappears and the hexadecimal color code is shown in the TextBox.\
    \ This end result is presented here.\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_47_1.png)\n\
    \n## EXTENDING <OUTPUTCACHE>\n\nWith the release of ASP.NET 4, you are now able\
    \ to extend how the OutputCache directive works and have it instead work off your\
    \ own custom means to caching. This means that you can wire the OutputCache directive\
    \ to any type of caching means including distributed caches, cloud caches, disc,\
    \ XML, or anything else you can dream up.\n\nTo accomplish this, you are required\
    \ to create a custom output-cache provider as a class and this class will need\
    \ to inherit from the new System.Web.Caching.OutputCacheProvider class. To inherit\
    \ from OutputCacheProvider, you must override the Add(), Get(), Remove(), and\
    \ Set() methods to implement your custom version of output caching.\n\nAfter you\
    \ have your custom implementation in place, the next step is to configure this\
    \ in a configuration file: the machine.config or the web.config file. Some changes\
    \ have been made to the <outputCache> element in the configuration file to allow\
    \ you to apply your custom cache extensions.\n\nThe <outputCache> element is found\
    \ within the <caching> section of the configuration file and it now includes a\
    \ new <providers> subelement.\n\n```\n<caching>\n  <outputCache>\n    <providers>\n\
    \    </providers>\n  </outputCache>\n</caching>\n```\n\nWithin the new <providers>\
    \ element, you can nest an <add> element to make the appropriate references to\
    \ your new output cache capability you built by deriving from the OutputCacheProvider\
    \ class.\n\n```\n<caching>\n  <outputCache defaultProvider=\"AspNetInternalProvider\"\
    >\n    <providers>\n      <add name=\"myDistributedCacheExtension\"\n        \
    \   type=\"Wrox.OutputCacheExtension.DistributedCacheProvider,\n           DistributedCacheProvider\"\
    \ />\n    </providers>\n  </outputCache>\n</caching>\n```\n\nWith this new <add>\
    \ element in place, your new extended output cache is available to use. One new\
    \ addition here to also pay attention to is the new defaultProvider attribute\
    \ within the <outputCache> element. In this case, it is set to AspNetInternalProvider,\
    \ which is the default setting in the configuration file. This means that by default\
    \ the output cache works as it always has done and stores its cache in the memory\
    \ of the computer that the program is running.\n\nWith your own output cache provider\
    \ in place, you can now point to this provider through the OutputCache directive\
    \ on the page as defined here:\n\n```\n<%@ OutputCache Duration=\"90\" VaryByParam=\"\
    *\"\n    providerName=\"myDistributedCacheExtension\" %>\n```\n\nIf the provider\
    \ name isn't defined, then the provider that is defined in the configuration's\
    \ defaultProvider attribute is utilized.\n\n## .NET 4'S NEW OBJECT CACHING OPTION\n\
    \nFrom what you have seen so far with the System.Web.Caching.Cache object, you\
    \ can see that it is quite powerful and allows for you to even create a custom\
    \ cache. This extensibility and power has changed under the hood of the Cache\
    \ object, though.\n\nDriving this is the System.Runtime.Caching.dll, as what was\
    \ in the System.Web version has been refactored out and everything was rebuilt\
    \ into the new namespace of System.Runtime.Caching.\n\nThe reason for this change\
    \ wasn’t so much for the ASP.NET developer, but instead for other application\
    \ types such as Windows Forms, Windows Presentation Foundation apps, and more.\
    \ The reason for this is that the System.Web.Caching.Cache object was so useful\
    \ that other application developers were bringing over the System.Web namespace\
    \ into their projects to make use of this object. So, to get away from a Windows\
    \ Forms developer needing to bring the System.Web.dll into their project just\
    \ to use the Cache object it provided, this was all extracted out and extended\
    \ with the System.Runtime.Caching namespace.\n\nAs an ASP.NET developer, you can\
    \ still make use of the System.Web.Caching.Cache object just as you did in all\
    \ the prior versions of ASP.NET. It isn’t going away. However, it is important\
    \ to note that as the .NET Framework evolves, the .NET team will be making its\
    \ investments into the System.Runtime.Caching namespace rather than System.Web.Caching.\
    \ This means that over time, you will most likely see additional enhancements\
    \ in the System.Runtime.Caching version that don’t appear in the System.Web.Caching\
    \ namespace as you might expect. With that said, it doesn’t also mean that you\
    \ need to move everything over to the new System.Runtime.Caching namespace to\
    \ make sure you are following the strategic path of Microsoft, because the two\
    \ caches are managed together under the covers.\n\nThis section runs through an\
    \ example of using the cache from the System.Runtime.Caching namespace. For this\
    \ example, the ASP.NET page simply uses a Label control that shows the name of\
    \ a user that is stored in an XML file. The first step is to create an XML file\
    \ and name the file Username.xml. This simple file is presented here in the following\
    \ listing.\n\n### Pro ASP.NET 9780470502204 Listing 22-5: The contents of the\
    \ Username.xml file\n\n```\n<?xml version=\"1.0\" encoding=\"utf-8\" ?>\n<usernames>\n\
    \    <user>Bill Evjen</user>\n</usernames>\n```\n\nWith this XML file sitting\
    \ in the root of your drive, now turn your attention to the Default.aspx code\
    \ behind page to use the name in the file and present it into a single Label control\
    \ on the page. The code behind for the Default.aspx page is presented here in\
    \ the following listing.\n\n### Pro ASP.NET 9780470502204 Listing 22-6: Using\
    \ the System.Runtime.Caching namespace\n\n```\nImports System\nImports System.Collections.Generic\n\
    Imports System.Linq\nImports System.Runtime.Caching\nImports System.Xml.Linq\n\
    \nPartial Public Class _Default\n    Inherits System.Web.UI.Page\n\n    Protected\
    \ Sub Page_Load(ByVal sender As Object, _\n            ByVal e As EventArgs) Handles\
    \ Me.Load\n\n        Dim cache As ObjectCache = MemoryCache.Default\n\n      \
    \  Dim usernameFromXml As String = _\n            TryCast(cache(\"userFromXml\"\
    ), String)\n\n        If usernameFromXml Is Nothing Then\nDim userFilePath As\
    \ New List(Of String)()\nuserFilePath.Add(\"C:\\Username.xml\")\nDim policy As\
    \ New CacheItemPolicy()\npolicy.ChangeMonitors.Add(New HostFileChangeMonitor(userFilePath))\n\
    Dim xdoc As XDocument = XDocument.Load(\"C:\\Username.xml\")\nDim query = From\
    \ u In xdoc.Elements(\"usernames\") Select u.Value\nusernameFromXml = query.First().ToString()\n\
    cache.Set(\"userFromXml\", usernameFromXml, policy)\nEnd If\nLabel1.Text = usernameFromXml\n\
    End Sub\nEnd Class\n```\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_50_0.png)\n\
    \n```\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    using System.Runtime.Caching;\nusing System.Xml.Linq;\n\nnamespace RuntimeCaching\n\
    {\n    public partial class Default : System.Web.UI.Page\n    {\n        protected\
    \ void Page_Load(object sender, EventArgs e)\n        {\n            ObjectCache\
    \ cache = MemoryCache.Default;\n\n            string usernameFromXml = cache[\"\
    userFromXml\"] as string;\n\n            if (usernameFromXml == null)\n      \
    \      {\n                List<string> userFilePath = new List<string>();\n  \
    \              userFilePath.Add(@\"C:\\Username.xml\");\n\n                CacheItemPolicy\
    \ policy = new CacheItemPolicy();\n                policy.ChangeMonitors.Add(new\
    \ HostFileChangeMonitor(userFilePath));\n\n                XDocument xdoc = XDocument.Load(@\"\
    C:\\Username.xml\");\n                var query = from u in xdoc.Elements(\"usernames\"\
    )\n                            select u.Value;\n\n                usernameFromXml\
    \ = query.First().ToString();\n\n                cache.Set(\"userFromXml\", usernameFromXml,\
    \ policy);\n            }\n\n            Label1.Text = usernameFromXml;\n    \
    \    }\n    }\n}\n```\n"
