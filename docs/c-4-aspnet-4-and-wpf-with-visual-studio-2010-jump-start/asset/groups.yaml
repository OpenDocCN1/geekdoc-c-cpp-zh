    \ www.asp.net/ajaxlibrary 找到的 Microsoft AJAX 库的一部分。下载该库后，您会发现它现在还包含完整的 AJAX 控件工具包。下图显示了\
    \ AJAX 库的下载页面。\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_43_0.png)\n\n要进行设置，请从上述网站\
    \ www.asp.net/ajaxlibrary 下载 .zip 文件，并在计算机上的所需位置解压缩。然后按照以下步骤操作：\n\n- 1. 将控件安装到\
    \ Visual Studio。向 Visual Studio 2010 工具箱添加控件非常容易。右键单击工具箱并从提供的菜单中选择 Add Tab。为选项卡命名——在本示例中，选项卡名为\
    \ AJAX Controls。\n\n- 2. 在工具箱中新建选项卡后，右键单击该选项卡并从提供的菜单中选择 Choose Items，如下图所示。Choose\
