    \      <add name=\"myDistributedCacheExtension\"\n           type=\"Wrox.OutputCacheExtension.DistributedCacheProvider,\n\
    \           DistributedCacheProvider\" />\n    </providers>\n  </outputCache>\n\
    </caching>\n```\n\n放置此新的 <add> 元素后，您新的扩展输出缓存即可使用。这里还有一个需要注意的新增内容是 <outputCache>\
    \ 元素中的新 defaultProvider 属性。在此情况下，它设置为 AspNetInternalProvider，这是配置文件中的默认设置。这意味着默认情况下，输出缓存的工作方式与以往相同，并将缓存存储在程序运行的计算机的内存中。\n\
    \n在您自己的输出缓存提供程序就位后，您现在可以通过页面上的 OutputCache 指令指向此提供程序，如下所示定义：\n\n```\n<%@ OutputCache\
    \ Duration=\"90\" VaryByParam=\"*\"\n    providerName=\"myDistributedCacheExtension\"\
    \ %>\n```\n\n如果未定义提供程序名称，则会使用配置中 defaultProvider 属性中定义的提供程序。\n\n## .NET 4 的新对象缓存选项\n\
    \n从迄今为止您对 System.Web.Caching.Cache 对象的了解来看，您可以看到它功能强大，甚至允许您创建自定义缓存。然而，Cache 对象的内部实现已经发生了变化。\n\
    \n推动这一变化的是 System.Runtime.Caching.dll，因为 System.Web 版本中的内容已被重构出来，并且所有内容都已重建到新的\
    \ System.Runtime.Caching 命名空间中。\n\n这种更改的原因并非主要针对 ASP.NET 开发人员，而是针对其他类型的应用程序，例如\
