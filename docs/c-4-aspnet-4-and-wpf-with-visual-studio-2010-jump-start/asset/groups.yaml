    From this, you can see that there isn''t much code needed to wire everything up.
    Most notably, you can see that putting this Chart server control on your page
    actually added a @Register directive to the top of the page. This is unlike most
    of the ASP.NET server controls.


    Within the <Series> element of this control, you can have as many series as you
    want, and this is something that is quite common when charting multiple items
    side by side (such as a time series of prices for two or more stocks).


    Running this code, you get results similar to what is presented here.


