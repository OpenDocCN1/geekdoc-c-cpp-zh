    \ =\n            XpsDocument.CreateXpsDocumentWriter(xps_doc);\n        doc_writer.Write(fdContents);\n\
    \        xps_doc.Close();\n    }\n}\n\n### 流文档\n\n流文档会根据需要重新排列其内容，以适应容纳它的容器。如果将查看控件设得又高又窄，文档会重新组织其内容以适应。从这个意义上说，这种文档类似于简单的网页，在调整浏览器大小时会重新排列其内容。\n\
