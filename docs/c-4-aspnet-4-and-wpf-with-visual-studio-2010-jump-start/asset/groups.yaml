    \ StartPoint=\"0,0\" EndPoint=\"0,1\">\n      <GradientStop Color=\"Lime\" Offset=\"\
    0\"/>\n      <GradientStop Color=\"Green\" Offset=\"1\"/>\n    </LinearGradientBrush>\n\
    \  </Label.Background>\n  <Label.ContextMenu>\n    <ContextMenu Name=\"ctxOptions\"\
    >\n      <MenuItem Header=\"Red\" Background=\"Pink\"\n                Foreground=\"\
    Red\"\n                Click=\"ctxSkin_Click\" Tag=\"ResRed.xaml\"/>\n      <MenuItem\
    \ Header=\"Blue\" Background=\"LightBlue\"\n                Foreground=\"Blue\"\
    \n                Click=\"ctxSkin_Click\" Tag=\"ResBlue.xaml\"/>\n    </ContextMenu>\n\
    \  </Label.ContextMenu>\n</Label>\n```\n\nThis code contains four real points\
    \ of interest:\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_98_0.png)\n\n- **1.**\
    \ First, the Label's MouseDown event triggers the Options_MouseDown event handler.\
    \ This routine, which is shown in the following code, displays the context menu\
    \ by setting the ContextMenu's IsOpen property to True:\n\n```csharp\n// Display\
    \ the options context menu.\nprivate void Options_MouseDown(object sender, RoutedEventArgs\
    \ e)\n{\n    ctxOptions.IsOpen = true;\n}\n```\n\n- **2.** Second, the Label's\
    \ Visibility property is set to the value of the visBlue static resource. This\
    \ resource has the value True in the Blue resource dictionary and False in the\
    \ Red resource dictionary. This means that the Label is visible only in the blue\
    \ interface. The red interface's skin-changing Image uses a similar visRed resource\
    \ that is only True in the red interface.\n\n- **3.** Third, the context menu's\
    \ items have a Tag property that names the XAML resource file that they load.\
    \ For example, the Blue menu item has its Tag set to ResBlue.xaml. The program\
    \ uses the Tag property to figure out which file to load when the user picks a\
    \ menu item.\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_98_1.png)\n\n- **4.**\
    \ Finally, both of the context menu's items fire the ctxSkin_Click event handler\
    \ shown in the following code to load the appropriate skin:\n\n```csharp\n// Use\
    \ the selected skin.\nprivate void ctxSkin_Click(object sender, RoutedEventArgs\
    \ e)\n{\n    // Get the context menu item that was clicked.\n    MenuItem menu_item\
    \ = (MenuItem)sender;\n\n    // Create a new resource dictionary, using the\n\
    \    // menu item's Tag property as the dictionary URI.\n    ResourceDictionary\
    \ dict = new ResourceDictionary();\n    dict.Source = new Uri((String)menu_item.Tag,\
    \ UriKind.Relative);\n\n    // Remove all but the first dictionary.\n    while\
    \ (App.Current.Resources.MergedDictionaries.Count > 1)\n    {\n        App.Current.Resources.MergedDictionaries.RemoveAt(1);\n\
    \    }\n\n    // Install the new dictionary.\n    App.Current.Resources.MergedDictionaries.Add(dict);\n\
    }\n```\n\nThis code gets the menu item that triggered the event and looks at the\
    \ item's Tag property to see which resource file to load. It creates a ResourceDictionary\
    \ object loaded from the file, removes old resource dictionaries from the application's\
    \ MergedDictionaries collection, and adds the new dictionary.\n\n### Animated\
    \ Skins\n\nThe skins described in the previous section use separate resource dictionaries\
    \ to provide different appearances. The program's XAML file sets its control properties\
    \ to resource values so that when you change the resource values, the interface\
    \ changes accordingly.\n\nAnother way to change property values is to use property\
    \ animation. This section explains briefly how to use animation to provide skinning.\n\
    \nXAML files allow you to define triggers that launch storyboards that represent\
    \ property animations. For example, when the user presses the mouse down over\
    \ a rectangle, the XAML code can run a storyboard that varies the `Rectangle's\
    \ Width` property smoothly from 100 to 200 over a 1-second period.\n\nThe AnimatedSkins\
    \ example program uses this technique to provide skinning. The next two figures\
    \ show the program displaying its green skin and its blue skin.\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_99_0.png)\n\
    \n![](img/7954dcc7dd1d929d072aec8e9531b6cc_99_1.png)\n\nWhen you click the appropriate\
    \ control, a trigger launches a storyboard that:\n\n- Resizes the main window\
    \ and changes its `Background` brush.\n- Hides and displays the small blue or\
    \ green ellipses in the upper-right corner that you click to switch skins.\n-\
    \ Moves `Labels`.\n- Resizes, moves, and changes the corner radii of the rectangles\
    \ that act as buttons.\n- Changes the `Fill` and `Stroke` brushes for the rectangles\
    \ pretending to be buttons.\n- Changes the text displayed in the `Labels`.\n-\
    \ Moves and resizes the `Image`.\n- Changes the background and foreground colors.\n"
  mdcn: "\n一个很好的信息来源是 Microsoft 的“控件样式和模板”网页，网址为 msdn.microsoft.com/cc278075 (VS.95).aspx。该页面提供了指向其他页面的链接，这些页面描述了不同控件模板可用的功能。\n\
    \n这些网页还展示了控件使用的默认模板。Button 控件的默认模板长达 84 行，相当复杂。有些模板更长、更复杂。\n\n除使用 Microsoft 的网页外，您还可以让控件告诉您其模板信息。ShowTemplate\
    \ 示例程序会显示控件的默认模板。在下图中，该控件是左上角的 Slider。要查看不同类型控件使用的模板，请用另一个控件替换 Slider，将其命名为 Target，然后运行程序。\n\
    \n![](img/7954dcc7dd1d929d072aec8e9531b6cc_95_0.png)\n\nShowTemplate 程序使用以下代码显示\
    \ Target 控件的模板：\n\n```csharp\nprivate void btnShowTemplate_Click(object sender,\
    \ RoutedEventArgs e)\n{\n    XmlWriterSettings writer_settings = new XmlWriterSettings();\n\
    \    writer_settings.Indent = true;\n    writer_settings.IndentChars = \"    \"\
    ;\n    writer_settings.NewLineOnAttributes = true;\n\n    StringBuilder sb = new\
    \ StringBuilder();\n    XmlWriter xml_writer = XmlWriter.Create(sb, writer_settings);\n\
    \n    XamlWriter.Save(Target.Template, xml_writer);\n\n    txtResult.Text = sb.ToString();\n\
    }\n```\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_95_1.png)\n\n## 皮肤\n\n主题可让程序自动更改以匹配系统的其余外观。\n\
    \n皮肤更有趣。皮肤是一组打包的外观和行为，可以使应用程序（或应用程序的一部分）具有独特的外观，同时仍能提供其关键功能。\n\n例如，下两幅图显示了 ResourceDictionaries\
    \ 示例程序（参见“合并资源字典”部分）显示两种截然不同的外观。它在两幅图中都是同一个程序，并且包含相同的控件——只是稍微重新排列，并使用不同的颜色、字体等等。\n\
    \n![](img/7954dcc7dd1d929d072aec8e9531b6cc_96_0.png)\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_96_1.png)\n\
    \n### 资源皮肤\n\n前两幅图所示的 ResourceDictionaries 程序使用两组不同的资源在设计时更改其外观。\n\n以下代码显示了窗口的资源字典。内部的\
    \ ResourceDictionary 元素加载了两个不同的资源字典。由于后加载的字典会覆盖先加载的字典，因此您可以通过更改这两个元素的顺序来更改应用程序的外观。（如图所示，Red.xaml\
    \ 字典第二个加载，因此程序使用其红色界面。）\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_96_2.png)\n\
    \n```xml\n<Window.Resources>\n    <ResourceDictionary>\n        <ResourceDictionary.MergedDictionaries>\n\
    \            <ResourceDictionary Source=\"ResBlue.xaml\" />\n            <ResourceDictionary\
    \ Source=\"ResRed.xaml\" />\n        </ResourceDictionary.MergedDictionaries>\n\
    \    </ResourceDictionary>\n</Window.Resources>\n```\n\n虽然 ResourceDictionaries\
    \ 程序可以显示两种不同的外观，但您需要在设计时修改程序以选择想要的皮肤。\n\nSkins 示例程序与 ResourceDictionaries 程序非常相似，只是它可以在运行时更改皮肤。为了实现这一点，其大部分资源是动态的而不是静态的。该程序还包含两个新的用户界面元素：一个\
    \ Image 和一个 Label。\n\n当它显示红色界面时，此程序在其右上角添加一个小的 Image。此 Image 具有一个上下文菜单，显示 Red\
    \ 和 Blue 选项（在下图中左侧显示），可让您在红色和蓝色皮肤之间进行选择。\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_97_0.png)\n\
    \n程序的蓝色界面在其右上角显示一个标签（在前一图中右侧），该标签显示相同的上下文菜单。\n\n以下代码显示了程序如何在蓝色界面上显示其 Options 文本框：\n\
    \n![](img/7954dcc7dd1d929d072aec8e9531b6cc_97_1.png)\n\n```xml\n<Label MouseDown=\"\
    Options_MouseDown\"\nGrid.Row=\"0\" Grid.Column=\"2\" Margin=\"2\"\nContent=\"\
    Options\" FontSize=\"10\"\nHorizontalAlignment=\"Right\" VerticalAlignment=\"\
    Top\"\nForeground=\"Black\" BorderBrush=\"Black\"\nBorderThickness=\"1\"\nVisibility=\"\
    {DynamicResource visBlue}\"\n>\n  <Label.Background>\n    <LinearGradientBrush\
    \ StartPoint=\"0,0\" EndPoint=\"0,1\">\n      <GradientStop Color=\"Lime\" Offset=\"\
    0\"/>\n      <GradientStop Color=\"Green\" Offset=\"1\"/>\n    </LinearGradientBrush>\n\
    \  </Label.Background>\n  <Label.ContextMenu>\n    <ContextMenu Name=\"ctxOptions\"\
    >\n      <MenuItem Header=\"Red\" Background=\"Pink\"\n                Foreground=\"\
    Red\"\n                Click=\"ctxSkin_Click\" Tag=\"ResRed.xaml\"/>\n      <MenuItem\
    \ Header=\"Blue\" Background=\"LightBlue\"\n                Foreground=\"Blue\"\
    \n                Click=\"ctxSkin_Click\" Tag=\"ResBlue.xaml\"/>\n    </ContextMenu>\n\
    \  </Label.ContextMenu>\n</Label>\n```\n\n此代码包含四个真正值得关注的点：\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_98_0.png)\n\
    \n- **1.** 首先，Label 的 MouseDown 事件会触发 Options_MouseDown 事件处理程序。此例程在以下代码中显示，通过将\
    \ ContextMenu 的 IsOpen 属性设置为 True 来显示上下文菜单：\n\n```csharp\n// Display the options\
    \ context menu.\nprivate void Options_MouseDown(object sender, RoutedEventArgs\
    \ e)\n{\n    ctxOptions.IsOpen = true;\n}\n```\n\n- **2.** 其次，Label 的 Visibility\
    \ 属性被设置为 visBlue 静态资源的值。此资源在 Blue 资源字典中的值为 True，在 Red 资源字典中的值为 False。这意味着 Label\
    \ 仅在蓝色界面中可见。红色界面的换肤 Image 使用类似的 visRed 资源，该资源仅在红色界面中为 True。\n\n- **3.** 第三，上下文菜单的项具有一个\
    \ Tag 属性，该属性命名了它们加载的 XAML 资源文件。例如，Blue 菜单项的 Tag 设置为 ResBlue.xaml。程序使用 Tag 属性来确定在用户选择菜单项时加载哪个文件。\n\
    \n![](img/7954dcc7dd1d929d072aec8e9531b6cc_98_1.png)\n\n- **4.** 最后，上下文菜单的两个项都会触发以下代码中显示的\
    \ ctxSkin_Click 事件处理程序以加载适当的皮肤：\n\n```csharp\n// Use the selected skin.\nprivate\
    \ void ctxSkin_Click(object sender, RoutedEventArgs e)\n{\n    // Get the context\
    \ menu item that was clicked.\n    MenuItem menu_item = (MenuItem)sender;\n\n\
    \    // Create a new resource dictionary, using the\n    // menu item's Tag property\
    \ as the dictionary URI.\n    ResourceDictionary dict = new ResourceDictionary();\n\
    \    dict.Source = new Uri((String)menu_item.Tag, UriKind.Relative);\n\n    //\
    \ Remove all but the first dictionary.\n    while (App.Current.Resources.MergedDictionaries.Count\
    \ > 1)\n    {\n        App.Current.Resources.MergedDictionaries.RemoveAt(1);\n\
    \    }\n\n    // Install the new dictionary.\n    App.Current.Resources.MergedDictionaries.Add(dict);\n\
    }\n```\n\n此代码获取触发事件的菜单项，并查看该项的 Tag 属性以查看要加载哪个资源文件。它创建从文件中加载的 ResourceDictionary\
    \ 对象，从应用程序的 MergedDictionaries 集合中删除旧的资源字典，并添加新的字典。\n\n### 动画皮肤\n\n上一节中描述的皮肤使用单独的资源字典来提供不同的外观。程序的\
    \ XAML 文件将其控件属性设置为资源值，因此当您更改资源值时，界面会相应更改。\n\n另一种更改属性值的方法是使用属性动画。本节简要说明如何使用动画提供换肤功能。\n\
    \nXAML 文件允许您定义触发器以启动代表属性动画的故事板。例如，当用户在矩形上按下鼠标时，XAML 代码可以运行一个故事板，使 `Rectangle's\
    \ Width` 属性在 1 秒内平滑地从 100 变为 200。\n\nAnimatedSkins 示例程序使用此技术提供换肤功能。下两幅图显示了程序显示其绿色皮肤和蓝色皮肤。\n\
    \n![](img/7954dcc7dd1d929d072aec8e9531b6cc_99_0.png)\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_99_1.png)\n\
    \n当您点击适当的控件时，触发器会启动一个故事板，该故事板会：\n\n- 调整主窗口大小并更改其 `Background` 画刷。\n- 隐藏并显示您点击以切换皮肤的右上角的小蓝色或绿色椭圆。\n\
    - 移动 `Labels`。\n- 调整充当按钮的矩形的大小、移动位置并更改其圆角半径。\n- 更改伪装成按钮的矩形的 `Fill` 和 `Stroke`\
    \ 画刷。\n- 更改 `Labels` 中显示的文本。\n- 移动并调整 `Image` 的大小。\n- 更改背景和前景颜色。\n"
