    \ encoding=\"utf-8\" standalone=\"yes\" ?>\n<service xml:base=\"http://localhost:4113/NorthwindDataService.svc/\"\
    \nxmlns:atom=\"http://www.w3.org/2005/Atom\"\nxmlns:app=\"http://www.w3.org/2007/app\"\
    \nxmlns=\"http://www.w3.org/2007/app\">\n  <workspace>\n    <atom:title>Default</atom:title>\n\
    \  </workspace>\n</service>\n```\n\n如果看不到此 XML，则需要通过选择 Tools ▸ Internet Options\
    \ 关闭 IE 浏览器的订阅源阅读功能。从提供的对话框中，选择 Content 选项卡，并在 Feeds 部分单击 Select 按钮。从那里，你可以取消选中“Turn\
    \ on feed reading”复选框。\n\n前面 XML 的结果本应是模型中存在的所有可用集合的列表，但默认情况下，WCF 数据服务会锁定所有内容。要从模型中解锁这些集合，请返回到\
    \ `InitializeService()` 函数并添加以下加粗代码，如以下列表所示：\n\n### Pro ASP.NET 9780470502204\
    \ Listing 31-35: 打开服务以便从可用表中进行读取\n\n```vb\nImports System.Data.Services\nImports\
    \ System.Linq\nImports System.ServiceModel.Web\n\nPublic Class NorthwindDataService\n\
    \    Inherits DataService(Of NORTHWINDEntities)\n\n    Public Shared Sub InitializeService(ByVal\
    \ config _\n        As IDataServiceConfiguration)\n        config.SetEntitySetAccessRule(\"\
    *\", EntitySetRights.AllRead)\n    End Sub\n\nEnd Class\n```\n\n```csharp\nusing\
    \ System;\nusing System.Collections.Generic;\nusing System.Data.Services;\nusing\
    \ System.Linq;\nusing System.ServiceModel.Web;\nusing System.Web;\n\nnamespace\
    \ Web_ADONETDS\n{\n    public class NorthwindDataService : DataService<NORTHWINDEntities>\n\
    \    {\n        public static void\n            InitializeService(IDataServiceConfiguration\
    \ config)\n        {\n            config.SetEntitySetAccessRule(\"*\",\n     \
    \           EntitySetRights.AllRead);\n        }\n    }\n}\n```\n\n在这种情况下，每个表都已打开以供访问。访问这些表的所有人都有读取它们的权限，但没有写入或删除的能力。所有表都是通过使用星号\
    \ (*) 指定的，并且底层数据的权限通过将 EntitySetRights 枚举设置为 AllRead 而设为只读。\n\n现在，编译并在浏览器中运行此服务时，你会看到以下\
    \ XML 片段：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\" standalone=\"yes\"\
    ?>\n<service xml:base=\"http://localhost:4113/NorthwindDataService.svc/\"\nxmlns:atom=\"\
    http://www.w3.org/2005/Atom\"\nxmlns:app=\"http://www.w3.org/2007/app\"\nxmlns=\"\
    http://www.w3.org/2007/app\">\n  <workspace>\n    <atom:title>Default</atom:title>\n\
    \    <collection href=\"Categories\">\n      <atom:title>Categories</atom:title>\n\
    \    </collection>\n    <collection href=\"CustomerDemographics\">\n      <atom:title>CustomerDemographics</atom:title>\n\
    \    </collection>\n    <collection href=\"Customers\">\n      <atom:title>Customers</atom:title>\n\
    \    </collection>\n    <collection href=\"Employees\">\n      <atom:title>Employees</atom:title>\n\
    \    </collection>\n    <collection href=\"Order_Details\">\n      <atom:title>Order_Details</atom:title>\n\
