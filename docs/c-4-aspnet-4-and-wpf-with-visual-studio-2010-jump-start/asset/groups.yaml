    # ColorPickerExtender


    One of the difficult data points to retrieve from an end user is color. This particular
    data point is tough to define if you are using just text. If you have an open
    selection of colors, how does the end user define a darker shade of blue? For
    this reason, you have the ColorPickerExtender to quickly and easily extend something
    like a TextBox control to a tool that makes this selection process a breeze. The
    following code listing shows a quick and easy way to do this task.


