    <form id=\"form1\" runat=\"server\">\n<div>\n<asp:Chart ID=\"Chart1\" runat=\"\
    server\"\n    DataSourceID=\"SqlDataSource1\"\n    Width=\"500px\">\n    <Series>\n\
    \        <asp:Series ChartType=\"Bar\" Name=\"Series1\"\n            XValueMember=\"\
    Name\"\n            YValueMembers=\"OrderQty\" YValuesPerPoint=\"2\">\n      \
    \  </asp:Series>\n    </Series>\n    <ChartAreas>\n        <asp:ChartArea Name=\"\
    ChartArea1\">\n        </asp:ChartArea>\n    </ChartAreas>\n</asp:Chart>\n<asp:SqlDataSource\
    \ ID=\"SqlDataSource1\" runat=\"server\"\n    ConnectionString=\"<%$ ConnectionStrings:ConnectionString\
    \ %>\"\n    SelectCommand=\"SELECT TOP (5) Production.Product.Name,\nSales.SalesOrderDetail.OrderQty\
    \ FROM Sales.SalesOrderDetail\nINNER JOIN Production.Product ON\nSales.SalesOrderDetail.ProductID\
    \ =\nProduction.Product.ProductID ORDER BY\nSales.SalesOrderDetail.OrderQty DESC\"\
    \n</asp:SqlDataSource>\n</div>\n</form>\n</body>\n</html>\n```\n\nFrom this, you\
    \ can see that there isn't much code needed to wire everything up. Most notably,\
    \ you can see that putting this Chart server control on your page actually added\
    \ a @Register directive to the top of the page. This is unlike most of the ASP.NET\
    \ server controls.\n\nWithin the `<Series>` element of this control, you can have\
    \ as many series as you want, and this is something that is quite common when\
    \ charting multiple items side by side (such as a time series of prices for two\
    \ or more stocks).\n\nRunning this code, you get results similar to what is presented\
    \ here.\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_42_0.png)\n\n### ASP.NET AJAX\
    \ Control Toolkit\n\nWith the install of the .NET Framework 4 and through using\
    \ Visual Studio 2010, you will find a few controls available that allow you to\
    \ build ASP.NET applications with server-side AJAX capabilities. This is the framework\
    \ to take your applications to the next level because you can accomplish so much\
    \ with it, including adding specific AJAX capabilities to your user and custom\
    \ server controls. Every AJAX enhancement added to your application will make\
    \ your application seem more fluid and responsive to the end user.\n\nYou might\
    \ be wondering where the big AJAX-enabled server controls are for this edition\
    \ of Visual Studio 2010 if this is indeed a new world for building Web applications.\
    \ The reason you do not see a new section of AJAX server controls is that Microsoft\
    \ has treated them as an open source project instead of just blending them into\
    \ Visual Studio 2010.\n\nDevelopers at Microsoft and in the community have been\
    \ working on a series of AJAX-capable server controls that you can use in your\
    \ ASP.NET applications. These controls are collectively called the ASP.NET AJAX\
    \ Control Toolkit. Recently, Microsoft has made the ASP.NET AJAX Control Toolkit\
    \ a part of the Microsoft AJAX Library found at www.asp.net/ajaxlibrary. Downloading\
    \ the library, you will find that it now also includes the complete AJAX Control\
    \ Toolkit. The following figure shows the download page for the AJAX Library.\n\
    \n![](img/7954dcc7dd1d929d072aec8e9531b6cc_43_0.png)\n\nTo get set up, download\
    \ the .zip file from the aforementioned site at www.asp.net/ajaxlibrary and unzip\
    \ it where you want on your machine. Then follow these steps:\n\n- 1. Install\
    \ the controls into Visual Studio. Adding the controls to your Visual Studio 2010\
    \ Toolbox is very easy. Right-click in the Toolbox and select Add Tab from the\
    \ provided menu. Name the tab as you want — for this example, the tab is called\
    \ AJAX Controls.\n\n- 2. With the new tab in your Toolbox, right-click the tab\
    \ and select Choose Items from the provided menu, as illustrated in the next figure.\
    \ The Choose Toolbox Items dialog appears.\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_45_0.png)\n\
    \n- 3. Select the AjaxControlToolkit.dll from the download. When you find the\
    \ DLL and click Open, the Choose Toolbox Items dialog changes to include the controls\
    \ that are contained within this DLL. The controls are highlighted in the dialog\
    \ and are already selected for you (as shown in the next figure).\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_45_1.png)\n\
    \n- 4. Click OK, and the ASP.NET AJAX Control Toolkit's controls will be added\
    \ to your Visual Studio Toolbox. The next figure presents the end result.\n"
