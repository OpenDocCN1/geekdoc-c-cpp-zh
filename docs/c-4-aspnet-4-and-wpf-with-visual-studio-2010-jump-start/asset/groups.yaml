  - "[PAGE 116]\n\n# ## Fixed Documents\n\nA *fixed document* displays its contents\
    \ in exactly the same size and position whenever you view it. If you resize the\
    \ control that holds the document, parts of the document may not fit, but they\
    \ won't be moved. In that sense, this kind of document is similar to a PDF (Portable\
    \ Document Format) file.\n\n# ## Building XPS Documents\n\nWhen it defined fixed\
    \ documents, Microsoft also defined *XML Paper Specification (XPS)* files. An\
    \ *XPS file* is a fixed document saved in a special format that can be read and\
    \ displayed by certain programs such as recent versions of Internet Explorer.\n\
    \nOne of the most flexible ways you can make an XPS document is to use Microsoft\
    \ Word. Simply create a Word document containing any text, graphics, lists, or\
    \ other content that you want, and then export it as an XPS document.\n\nMicrosoft\
    \ Word 2007 can export files in XPS (or PDF) format, but you need to install an\
    \ add-in first. As of this writing, you can install the add-in by following the\
    \ instructions on Microsoft's \"2007 Microsoft Office Add-in: Microsoft Save as\
    \ PDF or XPS\" download page at r.office.microsoft.com/r/rlidMSAddinPDFXPS. (If\
    \ the page has moved so you can't find it, go to Microsoft's Download Center at\
    \ www.microsoft.com/downloads and search for \"Save as PDF or XPS.\")\n\nAfter\
    \ you install the add-in, simply click on the Windows icon in Word's upper-left\
    \ corner to expand the main file menu. Click on the arrow next to the \"Save As\"\
    \ command, and select the \"PDF or XPS\" item.\n\nIf you don't have Microsoft\
    \ Word but are running the Microsoft Windows 7 operating system, you can still\
    \ create XPS documents relatively easily. Use Notepad, WordPad, or some other\
    \ editor to create the document. Next print it, selecting Microsoft XPS Document\
    \ Writer as the printer. The writer will prompt you for the file where you want\
    \ to save the result.\n\nYou can even display a web page in a browser such as\
    \ Firefox or Internet Explorer, print it, and select Microsoft XPS Document Writer\
    \ as the printer.\n\n# ## Displaying XPS Documents\n\nAfter you have created an\
    \ XPS file, you have several options for displaying it.\n\nThe Microsoft XPS Viewer,\
    \ which is installed by default in Windows 7 and integrated into Internet Explorer\
    \ 6.0 and higher, can display XPS files. By default, .xps files are associated\
    \ with Internet Explorer, so you can probably just double-click on the file to\
    \ view it.\n\nYou can also download Microsoft XPS Viewer or Microsoft XPS Essentials\
    \ Pack (which contains a stand-alone viewer) at www.microsoft.com/whdc/xps/viewxps.mspx.\n\
    \nFinally, you can make a WPF application display an XPS file inside a `DocumentViewer`\
    \ control. To do that, first add a reference to the ReachFramework library.\n\n\
    In Visual Studio, open the Project menu and select \"Add Reference.\" On the Add\
    \ Reference dialog, select the .NET tab, select the ReachFramework entry, and\
    \ click OK.\n\nNow you can write code-behind to load an XPS document into a `DocumentViewer`\
    \ control. To make using the necessary classes easier, you can add the following\
    \ `using` statement to the program:\n\n```\n    using System.Windows.Xps.Packaging;\n\
    ```"
  - "[PAGE 117]\n\nThe following code loads the file “Fixed Document.xps” when the\
    \ program’s window loads:\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_117_0.png)\n\
    \n```\n// Load the XPS document.\nprivate void Window_Loaded(object sender, RoutedEventArgs\
    \ e)\n{\n    // Note: Mark the file as \"Copy if newer\".\n    // to make a copy\
    \ go in the output directory.\n    XpsDocument xps_doc = new XpsDocument(\"Fixed\
    \ Document.xps\",\n        System.IO.FileAccess.Read);\n    docViewer.Document\
    \ = xps_doc.GetFixedDocumentSequence();\n}\n```\n\n# Building Fixed Documents\
    \ in XAML\n\nBuilding an XPS document is easy with Microsoft Word, WordPad, or\
    \ some other external program, but sometimes it’s more convenient to build a fixed\
    \ document in XAML or code-behind. For example, you might want a program to generate\
    \ a report at run time and display it as a fixed document.\n\nBuilding a fixed\
    \ document in XAML code isn’t too complicated, although it is a lot of work because\
    \ it’s a fairly verbose format.\n\nStart by creating a DocumentViewer to hold\
    \ the document. Give it any properties and resources it needs (such as a background),\
    \ and place a FixedDocument object inside it.\n\nThe FixedDocument object should\
    \ contain one or more PageContent objects that define its pages.\n\nYou can set\
    \ each PageContent object’s Width and Height properties to determine the size\
    \ of the page.\n\nInside the PageContent, place a FixedPage object to define the\
    \ page’s contents.\n\nInside the FixedPage, you can place controls such as StackPanel,\
    \ Grid, TextBlock, and Border to create the page’s contents.\n\nThe SimpleFixedDocument\
    \ example program shown in the next figure draws four fixed pages that contain\
    \ simple shapes and labels.\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_117_1.png)"
  - "[PAGE 118]\n\n# Saving XPS Files\n\nHaving gone to the trouble of building a\
    \ fixed document in XAML or code-behind, you might want to save it as an XPS file.\n\
    \nTo save a fixed document into an XPS file, open a project in Visual Studio and\
    \ add references to the ReachFramework and System.Printing libraries. To make\
    \ using the libraries easier, you can add the following using statements to the\
    \ program:\n\n```\nusing System.Windows.Xps;\nusing System.Windows.Xps.Packaging;\n\
    ```\n\nNext, create an XpsDocument object to write into the file that you want\
    \ to create. Make an XpsDocumentWriter associated with the document object, and\
    \ use its Write method to write the FixedDocument into the file.\n\nThe SaveFixedDocument\
    \ example program uses the following code to save its FixedDocument object named\
    \ fdContents into a file.\n\n![](img/7954dcc7dd1d929d072aec8e9531b6cc_118_0.png)\n\
    \n```\n// Save as an XPS file.\nprivate void mnuFileSave_Click(System.Object sender,\
    \ System.Windows.RoutedEventArgs e)\n{\n    // Get the file name.\n    Microsoft.Win32.SaveFileDialog\
    \ dlg =\n        new Microsoft.Win32.SaveFileDialog();\n    dlg.FileName = \"\
    Shapes\";\n    dlg.DefaultExt = \".xps\";\n    dlg.Filter = \"XPS Documents (.xps)|*.xps|All\
    \ Files (*.*)|*.*\";\n    if (dlg.ShowDialog() == true)\n    {\n        // Save\
    \ the document.\n        // Make an XPS document.\n        XpsDocument xps_doc\
    \ = new XpsDocument(dlg.FileName,\n            System.IO.FileAccess.Write);\n\n\
    \        // Make an XPS document writer.\n        XpsDocumentWriter doc_writer\
    \ =\n            XpsDocument.CreateXpsDocumentWriter(xps_doc);\n        doc_writer.Write(fdContents);\n\
    \        xps_doc.Close();\n    }\n}\n```\n\n# Flow Documents\n\nA flow document\
    \ rearranges its contents as necessary to fit the container that is holding it.\
    \ If you make the viewing control tall and thin, the document reorganizes its\
    \ contents to fit. In that sense, this kind of document is similar to a simple\
    \ web page that rearranges its contents when you resize the browser.\n\nA WPF\
    \ program displays flow documents inside one of three kinds of viewers:\nFlowDocumentPageViewer,\
    \ FlowDocumentReader, or FlowDocumentScrollViewer. S"
