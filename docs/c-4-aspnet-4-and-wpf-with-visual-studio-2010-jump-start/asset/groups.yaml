    # ASP.NET MVC Is Totally Different!


    Yes, ASP.NET MVC is totally different. That’s the whole point. It’s built on top
    of a system of values and architectural principles that is very different from
    those in Web forms. ASP.NET MVC values extensibility, testability, and flexibility.
    It’s very lightweight and doesn’t make a lot of assumptions on how you will use
    it — aside from the fact that it assumes you appreciate the Model-View-Controller
    pattern.


    Different developers and different projects have different needs. If ASP.NET MVC
    meets your needs, use it. If it doesn’t, don’t use it. Either way, don’t be afraid.


    # Why “(ASP.NET > ASP.NET MVC) == True”


    Creating your first MVC application is fairly straightforward. You can use any
    version of Visual Studio 2010 to create the basic application, including Express,
    Standard, Professional, or Team Edition.


    If you’re NOT using Visual Studio 2010, the first order of business is to install
    the MVC Framework on your 2008 development box. Start at www.asp.net/mvc by downloading
    the latest release. If you like living on the edge, you can often get ASP.NET
    MVC future releases at www.codeplex.com/aspnet.


    What you’re downloading is a set of Visual Studio project templates that will
    create your ASP.NET MVC Web application for you. You’ve used these before — every
    new ASP.NET Web site and ASP.NET Web application is based on a set of templates.
    The templates will be installed in Visual Studio, and the reference assemblies
    will be installed in C:\Program Files\Microsoft ASP.NET.


    After you’ve installed ASP.NET MVC, you’re ready to create an ASP.NET MVC application
    using Visual Studio 2008. Though, if you are using Visual Studio 10, then you
    are going to want to follow these steps:


    +   1. Open Visual Studio 2010 by selecting File -> New Project.

    +   2. From the New Project dialog box, shown in the next figure, select ASP.NET
    MVC 2 Web Application.


    ![](img/7954dcc7dd1d929d072aec8e9531b6cc_58_0.png)'
