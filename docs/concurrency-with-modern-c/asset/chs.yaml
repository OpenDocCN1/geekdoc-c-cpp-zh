  \ 停止令牌 (Stop Tokens)\n\n协作连接线程的额外功能基于 `std::stop_token`、`std::stop_callback` 和 `std::stop_source`。\n\
  \n#### `std::stop_token`、`std::stop_source` 和 `std::stop_callback`\n\n`stop_token`、`std::stop_callback`\
  \ 或 `std::stop_source` 能够异步请求停止执行或询问执行是否收到了停止信号。`std::stop_token` 可以传递给操作，之后可用于主动轮询令牌的停止请求，或通过\
  \ `std::stop_callback` 注册回调。停止请求由 `std::stop_source` 发送。该信号影响所有关联的 `std::stop_token`。三个类\
  \ `std::stop_source`、`std::stop_token` 和 `std::stop_callback` 共享关联的停止状态的所有权。调用 `request_stop()`、`stop_requested()`\
  \ 和 `stop_possible()` 是原子操作。\n\n组件 `std::stop_source` 和 `std::stop_token` 为停止处理提供了以下属性。\n\
  \n`std::stop_source src` 的方法：\n\n| **方法** | **描述** |\n| --- | --- |\n| `src.get_token()`\
  \ | 如果 `!stop_possible()`，则构造一个不共享停止状态的 `stop_token` 对象。否则，构造一个与 `*this` 共享停止状态所有权的\
  \ `stop_token` 对象。 |\n| `src.stop_possible()` | 如果停止源可用，则为 `true`。 |\n| `src.stop_requested()`\
  \ | 如果已发送停止信号，则为 `true`。 |\n| `src.stop_possible()` | 如果可以发送停止信号，则为 `true`。 |\n\n\
  `std::stop_token` 的方法：\n\n| **方法** | **描述** |\n| --- | --- |\n| `stoken.stop_possible()`\
  \ | 如果可以发送停止信号，则为 `true`。 |\n| `stoken.stop_requested()` | 如果已发送停止信号，则为 `true`。\
  \ |\n| `stoken.stop_possible()` | 如果可以发送停止信号，则为 `true`。 |\n\n`std::stop_callback`\
  \ 的方法：\n\n| **方法** | **描述** |\n| --- | --- |\n| `cb.stop_possible()` | 如果可以发送停止信号，则为\
  \ `true`。 |\n| `cb.stop_requested()` | 如果已发送停止信号，则为 `true`。 |\n| `cb.stop_possible()`\
  \ | 如果可以发送停止信号，则为 `true`。 |\n\n等待，原文在表格中存在格式问题。根据提供的文本内容重新对齐：\n\n`std::stop_source\
  \ src` 的方法：\n\n| **方法** | **描述** |\n| --- | --- |\n| `src.get_token()` | 如果 `!stop_possible()`，则构造一个不共享停止状态的\
  \ `stop_token` 对象。否则，构造一个与 `*this` 共享停止状态所有权的 `stop_token` 对象。 |\n| `src.stop_possible()`\
  \ | 如果停止源可用，则为 `true`。 |\n| `src.stop_requested()` | 如果已发送停止信号，则为 `true`。 |\n| `src.stop_possible()`\
  \ | 如果可以发送停止信号，则为 `true`。 |\n\n`std::stop_token` 的方法：\n\n| **方法** | **描述** |\n|\
  \ --- | --- |\n| `stoken.stop_possible()` | 如果可以发送停止信号，则为 `true`。 |\n| `stoken.stop_requested()`\
  \ | 如果已发送停止信号，则为 `true`。 |\n| `stoken.stop_possible()` | 如果可以发送停止信号，则为 `true`。 |\n\
  \n实际上，提供的原始文本在表格处非常错乱。我会在保持语义的同时对其清理。\n\n\n\n\n\n```cpp\n 1 template <class Predicate>\n\
  \ 2 bool wait_until(Lock& lock, \n 3                 Predicate pred, \n 4      \
  \           stop_token stoken);\n 5                 \n 6 template <class Clock,\
  \ class Duration, class Predicate>\n 7 bool wait_until(Lock& lock, \n 8        \
  \         const chrono::time_point<Clock, Duration>& abs_time, \n 9            \
  \     Predicate pred,\n10                 stop_token stoken);\n11 \n12 template\
  \ <class Rep, class Period, class Predicate>\n13 bool wait_for(Lock& lock, \n14\
  \               const chrono::duration<Rep, Period>& rel_time, \n15            \
  \   Predicate pred, \n16               stop_token stoken);\n```\n\n###三个新的 wait\
  \ 重载\n\n这些新的重载需要一个谓词（predicate）。这些版本确保了如果传递的 `std::stop_token stoken` 发出中断信号时能够获得通知。这三个重载等同于以下表达式。它们返回一个布尔值，指示谓词评估结果是否为\
  \ `true`。该返回的布尔值独立于是否请求了停止或是否触发了超时。\n\n```cpp\n// wait_until in lines 1 - 4\nwhile(!pred()\
  \ && !stoken.stop_requested()) {\n    wait(lock, [&pred, &stoken] {\n        return\
  \ pred() || stoken.stop_requested();\n    });\n}\nreturn pred();\n\n// wait_until\
  \ in lines 6 - 10\nwhile(!pred() && !stoken.stop_requested() && Clock::now() < abs_time)\
  \ {\n    cv.wait_until(lock,\n                  abs_time,\n                  [&pred,\
  \ &stoken] {\n                      return pred() || stoken.stop_requested();\n\
  \                  });\n}\nreturn pred();\n\n// wait_for in lines 12 - 16\nreturn\
  \ wait_until(lock, \n                  chrono::steady_clock::now() + rel_time, \n\
  \                  std::move(pred), \n                  std::move(stoken)\n    \
  \              );\n```\n\n### 三个重载的等价表达式\n\n在等待调用之后，你可以检查是否发生了停止请求。\n\n```cpp\n\
  cv.wait_until(lock, predicate, stoken);\nif (stoken.stop_requested()){\n    // 发生了中断\n\
  }\n```\n\n### 使用 `wait` 处理中断\n\n下面的示例展示了带有停止请求的条件变量的使用。\n\n```cpp\n 1 // waitUntilStopRequest.cpp\n\
  \ 2 \n 3 #include \"condition_variable_any2.hpp\"\n 4 #include \"jthread.hpp\"\n\
  \ 5 \n 6 #include <iostream>\n 7 #include <chrono>\n 8 #include <mutex>\n 9 #include\
  \ <thread>\n10 \n11 using namespace std::literals;\n12 \n13 std::mutex mutex_;\n\
  14 std::condition_variable_any2 condVar;\n15 \n16 bool dataReady;\n17 \n18 void\
  \ receiver(std::stop_token stopToken){\n19 \n20     std::cout << \"Waiting\" <<\
  \ std::endl;\n21 \n22     std::unique_lock<std::mutex> lck(mutex_);\n23     bool\
  \ ret = condVar.wait_until(lck, []{return dataReady;}, stopToken);\n24     if (ret){\n\
  25         std::cout << \"Notification received: \" << std::endl;\n26     }\n27\
  \     else{\n28          std::cout << \"Stop request received\" << std::endl;\n\
  29     }\n30 }\n31 \n32 void sender(){\n33 \n34     std::this_thread::sleep_for(5ms);\n\
  35     {\n36         std::lock_guard<std::mutex> lck(mutex_);\n37         dataReady\
  \ = true;\n38         std::cout << \"Send notification\"  << std::endl;\n39    \
  \ }\n40     condVar.notify_one();\n41 \n42 }\n43 \n44 int main(){\n45 \n46   std::cout\
  \ << std::endl;\n47 \n48   std::jthread t1(receiver);\n49   std::jthread t2(sender);\n\
  50 \n51   t1.request_stop();\n52 \n53   t1.join();\n54   t2.join();\n55 \n56   std::cout\
  \ << std::endl;\n57 \n58 }\n```\n\n### 带停止请求的条件变量的使用\n\n`receiver` 线程（第 18-30 行）正在等待\
  \ `sender` 线程（第 32-42 行）的通知。在 `sender` 线程于第 40 行发送通知之前，`main` 线程在第 51 行触发了停止请求。程序的输出显示停止请求发生在通知之前。\n\
  \n![Usage of callbacks](img/cpp20_23----waitUntilStopRequest.png)\n\n回调的使用\n\n###\
  \ 原子智能指针\n\n一个 `std::shared_ptr` 由一个控制块和其资源组成。控制块是线程安全的，但对资源的访问不是。这意味着修改引用计数器是一个原子操作，你能够保证资源会被恰好删除一次。这些是\
  \ `std::shared_ptr` 提供的保证。\n\n### 倒计时器 (Latches) 与屏障 (Barriers)\n\nLatches 和 Barriers\
  \ 是简单的线程同步机制，允许某些线程阻塞直到计数器变为零。起初，不要将新的 barriers 与 [内存屏障](chap05.xhtml_chapterMemorySSSBarriers）（也称为\
  \ fences）混淆。在 C++20 中，我们获得了两种 latches 和 barriers：`std::latch` 和 `std::barrier`。\n\
  \n\n\n\n\n现在，我仔细查看了 `std::latch` 的接口。\n\n### 锁 `lat` 的方法\n\n| **方法** | **描述** |\n\
  | --- | --- |\n| `lat.count_down(upd = 1)` | 原子性将计数器减去 `upd`。 |\n| `lat.try_wait()`\
  \ | 返回 `counter == 0`。 |\n| `lat.wait()` | 如果 `counter == 0`，则立即返回。否则阻塞直到 `counter\
  \ == 0`。 |\n| `lat.arrive_and_wait(update = 1)` | 等于 `count_down(upd); wait();`。\
  \ |\n\n`upd` 的默认值为 `1`。`lat.try_wait()` 调用正如其名所示，它永远不会等待。\n\n这里是来自 [N4204](http://www.open-std.org/jtc1/sc22/wg21/docs/papers/2014/n4204.html)\
  \ 提议的一个简短代码段。\n\n```\n 1 void DoWork(threadpool* pool) {\n 2   latch completion_latch(NTASKS);\n\
  \ 3   for (int i = 0; i < NTASKS; ++i) {\n 4     pool->add_task([&] {\n 5      \
  \ // 执行工作\n 6       ...\n 7       completion_latch.count_down();\n 8       }));\n\
  \ 9   }\n10   // 阻塞直到工作完成\n11   completion_latch.wait();\n12 }\n```\n\n### std::latch\n\
  \n我在它的构造函数中将 `std::latch completion_latch` 设置为 `NTASKS`（第 2 行）。线程池执行 `NTASKS`（第\
  \ 4-8 行）。在每个任务结束时（第 7 行），计数器减 1。第 11 行是运行 `DoWork` 函数的线程以及因此该小工作流的屏障。该线程被阻塞，直到所有任务完成。\n\
  \n`std::barrier` 与 `std::latch` 类似。\n\n### std::barrier\n\n`std::latch` 和 `std::barrier`\
  \ 之间有两个区别。首先，你可以多次使用 `std::barrier`，其次，你可以为下一个阶段（迭代）设置计数器。在计数器变为零后，所谓的完成步骤会立即开始。在这个完成步骤中，会调用一个可调用单元。`std::barrier`\
  \ 在其构造函数中获取其可调用对象。该可调用对象必须返回一个数字。这个数字设置了下一次迭代的计数器。返回值为 -1 表示计数器保持不变。不允许出现小于 -1 的数字。\n\
  \n完成步骤执行以下操作：\n\n1. 所有线程被阻塞。\n2. 任意一个线程被解阻塞并执行可调用单元。\n3. 如果完成阶段结束，所有线程被解阻塞。\n\n\
  ### 屏障 `bar` 的方法\n\n| **方法** | **描述** |\n| --- | --- |\n| `bar.arrive(upd)` | 原子性将计数器减去\
  \ `upd`。 |\n| `bar.wait()` | 在同步点阻塞，直到完成步骤结束。 |\n| `bar.arrive_and_wait()` | 等于\
  \ `wait(arrive())` |\n| `bar.arrive_and_drop()` | 将所有后续阶段的初始预期计数减 1。 |\n\n这是一个演示\
  \ `std::barrier` 用法的简短示例。\n\n```\n 1 void DoWork() {\n 2   Tasks& tasks;\n 3   int\
  \ initial_threads;\n 4   int n_threads{NTASKS}; \n 5   atomic<int> current_threads(initial_threads);\n\
  \ 6   vector<thread*> workers;\n 7 \n 8   // 创建一个屏障，并设置一个每次屏障计数\n 9   //计数时都会被调用的\
  \ lambda。如果有一个或多个\n10   // 活跃线程已完成，减少线程数量。\n 11   std::function rf = [&]{ return\
  \ current_threads; };\n 12   barrier task_barrier(n_threads, rf);\n 13 \n 14   for\
  \ (int i = 0; i < n_threads; ++i) {\n 15     workers.push_back(new thread([&] {\n\
  \ 16       bool active = true;\n 17       while(active) {\n 18         Task task\
  \ = tasks.get();\n 19         // 执行任务\n 20         ...\n 21         if (finished(task))\
  \ {\n 22           current_threads--;\n 23           active = false;\n 24      \
  \   }\n 25         task_barrier.arrive_and_wait();\n 26       }\n 27     });\n 28\
  \   }\n 29 \n 30   // 读取任务的每个阶段，直到所有阶段完成。\n 31   while (!finished()) {\n 32    \
  \ GetNextStage(tasks);\n 33   }\n 34 }\n```\n\n### std::barrier\n\n第 12 行的 `barrier`\
  \ 用于协调多个多次执行任务的线程。线程数量为 `n_threads`（第 4 行）。每个线程在第 18 行通过 `tasks.get()` 获取任务，执行任务并阻塞\
  \ - 一旦它完成任务（第 25 行）- 直到所有线程都完成任务。第 25 行的 `task_barrier` 用于协调多个多次执行任务的线程。线程数量为 `n_threads`（第\
  \ 4 行）。每个线程在第 18 行通过 `tasks.get()` 获取任务，执行任务并阻塞 - 一旦它完成任务（第 25 行）- 直到所有线程都完成任务。第\
