  \n# 激活对象 (Active Object)\n\n## 更多信息\n\n* [面向模式的软件架构：并发与网络对象的模式](https://www.dre.vanderbilt.edu/~schmidt/POSA/POSA2/)\n\
  * [优先使用激活对象而非裸线程 (Herb Sutter)](http://www.drdobbs.com/parallel/prefer-using-active-objects-instead-of-n/225700095)\n\
  * [C++11 中的激活对象实现](https://github.com/lightful/syscpp/)\n\n# 监视对象 (Monitor Object)\n\
  \n监视对象（Monitor Object）设计模式同步并发方法的执行，确保对象对象内只有一个方法在运行。它还允许对象的方法协作调度它们的执行序列。该模式也称为线程安全的被动对象（Thread-Safe\
  \ Passive Object）。\n\n## 要求\n\n如果多个线程并发访问一个共享对象，必须满足以下要求：\n\n1.  由于并发访问，共享对象必须保护免受非同步读写操作的影响，以避免数据竞态。\n\
  2.  必要的同步处理应该是实现的一部分，而不是接口的一部分。\n3.  当线程完成对共享对象的操作时，应该触发一个通知，以便下一个线程可以使用该共享对象。这种机制有助于避免死锁\
  \ 并提高系统的整体性能。\n4.  在方法执行后，共享对象的不变性（invariants）必须保持。\n\n这四项要求的解决方案是监视对象。客户端（线程）可以访问监视对象的同步方法，由于监视锁的存在，在任何给定时刻只有一个同步方法可以运行。每个监视对象都有一个监视条件（monitor\
  \ condition），用于通知等待客户端。\n\n## 组件\n\n监视对象由四个组件组成。\n\n![Monitor Object](img/ArchitecturePatterns----MonitorObject.jpg)\n\
  \n1. **监视对象 (Monitor Object)**：监视对象支持一个或多个方法。每个客户端必须通过这些方法访问对象。每个方法都在客户端的线程中运行。\n\
  2. **同步方法 (Synchronised methods)**：同步方法是监视对象支持的方法。在任何给定时刻只能有一个方法在执行。线程安全接口有助于区分监视对象的接口方法（同步方法）和实现方法。\n\
  3. **监视锁 (Monitor lock)**：每个监视对象都有一个监视锁，确保在任何给定时刻最多有一个客户端可以访问监视对象。\n4. **监视条件 (Monitor\
  \ condition)**：监视条件允许不同的线程在监视对象上调度它们的方法调用。当当前客户端完成对同步方法的调用时，下一个等待的客户端将被唤醒，以调用监视对象上的同步方法。\n\
  \n虽然监视锁确保了对同步方法的独占访问，但监视条件保证了客户端的最小等待。\n\n*   当客户端调用监视对象上的同步方法时，它必须首先锁定全局监视锁。如果客户端成功，则执行同步方法并在结束时解锁监视锁。如果客户端失败，则客户端被阻塞。\n\
  *   当客户端因为无法进展而被阻塞时，它会等待监视条件发送通知。该通知发生在监视锁解锁时。通知可以发送给一个或所有等待的客户端。通常，等待意味着资源友好的睡眠，与忙等形成对比。\n\
  *   当客户端收到恢复的通知时，它锁定监视锁并执行同步方法。在同步方法结束时，解锁监视锁并发送监视条件通知，以指示下一个客户端可以执行其同步方法。\n\n##\
  \ 优点与缺点\n\n监视对象的优缺点是什么？\n\n*   **优点**：\n    *   客户端感知不到监视对象的隐式同步。同步完全封装在实现中。\n \
  \   *   被调用的同步方法最终会被自动调度。监视条件的通知/等待机制表现得像一个简单的调度器。\n*   **缺点**：\n    *   更改同步方法的同步机制通常非常困难，因为功能和同步之间是强耦合的。\n\
  \    *   当同步方法直接或间接地调用同一个监视对象时，可能会发生死锁。\n\n以下示例定义了一个 `ThreadSafeQueue`（线程安全队列）。\n\
  \n```cpp\n 1 // monitorObject.cpp\n 2 \n 3 #include <condition_variable>\n 4 #include\
  \ <functional>\n 5 #include <queue>\n 6 #include <iostream>\n 7 #include <mutex>\n\
  \ 8 #include <random>\n 9 #include <thread>\n10 \n11 template <typename T>\n12 class\
  \ Monitor{\n13 public:\n14     void lock() {\n15         monitMutex.lock();\n16\
  \     }\n17     void unlock() {\n\n\n\n\n该示例的核心思想是将监视对象（Monitor Object）封装在一个类中，因此可以被复用。`Monitor`\
  \ 类使用``std::recursive_mutex`` 作为监视锁，使用``std::condition_variable_any`` 作为监视条件。与``std::condition_variable``不同，`std::condition_variable_any``接受递归互斥锁。两者都声明为\
  \ `mutable`，因此可以在常量方法中使用。`Monitor` 类提供了监视对象应该支持的最小接口。\n\n第 34-55 行的 `ThreadSafeQueue`\
  \ 扩展了第 53 行的 `std::queue`，提供了线程安全的接口。`ThreadSafeQueue` 继承自 `Monitor` 类并使用其方法来支持同步方法\
  \ `add` 和 `get`。`add` 和 `get` 方法使用监视锁来保护监视对象，特别是非线程安全的 `myQueue`。当新项被添加到 `myQueue`\
  \ 时，`add` 会通知等待的线程。这种通知是线程安全的。从具有相同类作为模板参数的基类派生子类是 C++ 中一种常用的惯用法，被称为`CRTP`：`class\
  \ ThreadSafeQueue: public Monitor<ThreadSafeQueue<T>>`。理解这种模式的关键观察点是第 54 行：`ThreadSafeQueue<T>&\
  \ derived = static_cast<ThreadSafeQueue<T>&>(*this)`。该表达式将 `this` 指针强制转换为派生类。第 72\
  \ 行的监视对象 `safeQueue` 使用第 73 行和 74 行的 lambda 函数在同步的 `safeQueue` 中添加或删除数字。`ThreadSafeQueue`\
  \ 本身是一个类模板，可以持有任意类型的值。100 个客户端向 `safeQueue`（第 77 行）添加 100 个 1-6 之间的随机数，同时 100 个客户端并发从\
  \ `safeQueue` 中移除这 100 个数字。程序的输出显示了数字和使用线程的 ID。\n\n![Monitor Object](img/ArchitecturePatterns----monitorObject.png)\n\
  \n## 监视对象 (Monitor Object)\n\n`Active Object` 和监视对象相似，但在几个重要点上有所不同。这两种架构模式都对共享对象的访问同步。活动对象的方法在不同的线程中执行，而监视对象的方法在同一个线程中执行。活动对象将其方法调用与方法执行的解耦得更好，因此更容易维护。\n\
  \n### 更多信息\n\n* [Pattern-Oriented Software Architecture: Patterns for Concurrent\
  \ and Networked Objects](https://www.dre.vanderbilt.edu/~schmidt/POSA/POSA2/)\n\n\
  ## 半同步/半异步 (Half-Sync/Half-Async)\n\n半同步/半异步架构模式将并发系统中的异步和同步服务处理解耦，以便在不适度降低性能的情况下简化编程。该模式引入了两个相互通信的层，一个用于异步服务处理，一个用于同步服务处理。\n\
  \n![Half-Sync/Half-Async](img/ArchitecturePatterns----HalfSyncAsync.jpg)\n\n###\
  \ 半同步/半异步\n\n半同步/半异步模式通常用于服务器的事件循环或图形用户界面。事件循环的典型工作流是接受客户端或用户事件，将请求插入队列，并在单独的线程中同步处理请求。异步接受请求确保了效率，而同步处理简化了请求的处理。异步层和同步服务层被分为两层，由队列在两者之间进行协调。异步层由低级系统服务组成（如中断），而同步层由高级服务组成（如数据库查询或文件操作）。异步层和同步层可以通过队列层相互通信。\n\
  \n### 优点与缺点\n\n半同步/半异步模式的优点和缺点是什么？\n\n* 优点：\n    * 异步和同步服务的清晰分离。低级系统服务在异步层处理，高级服务在同步层处理处理。\n\
  \    * 队列层确保了异步层和同步层之间的松散耦合。\n    * 清晰的分离使得软件更容易理解、调试、维护和扩展。\n    * 同步服务中的阻塞不会影响异步服务。\n\
  * 缺点：\n    * 异步层和同步层之间的边界跨越可能会产生开销。边界跨越通常涉及内核空间和用户空间之间的上下文切换，因为异步服务通常运行在内核空间，而同步服务运行在用户空间。\n\
  \    * 层之间的严格分离要求数据要么被复制，要么是不可变的。\n\n半同步/半异步模式通常用于事件复用和分发框架，例如 Reactor 或 Proactor\
  \ 模式。\n\n## Reactor\n\nReactor 模式是一种事件驱动框架，用于将服务请求并发复用分发到不同的服务提供者。Reactor 模式也称为分发器（dispatcher）或通知器（notifier）。\n\
  \n### 要求\n\n服务器应该并发处理更多的客户端请求。每个客户端请求都有一个唯一标识，以便映射到服务提供者。必须满足以下点：Reactor 应该：\n\n\
  * 不阻塞。\n* 支持最大吞吐量，避免不必要的上下文切换，从而避免数据同步。\n* 易于扩展以支持改进或新的服务。\n* 使用复杂的同步机制。\n\n###\
  \ 解决方案\n\n对于每种支持的服务类型，实现一个满足特定客户端请求的事件处理器。将该处理器注册到 Reactor 中。Reactor 使用事件复用同步等待所有传入的事件。当事件到达时，Reactor\
  \ 被通知并将其分发给特定的服务。\n\n### 组件\n\n![Reactor](img/ArchitecturePatterns----Reactor.jpg)\n\
  \nReactor\n\n* **句柄 (Handles)**：\n    * 句柄识别不同的事件源，如网络连接、打开的文件或 GUI 事件。\n    * 事件源产生事件，并在关联的句柄上进行队列。\n\
  * **同步事件复用器 (Synchronous event demultiplexer)**：\n    * 同步事件复用等待一个或多个指示事件。它在句柄可以处理事件之前保持阻塞。\n\
  * **事件处理器 (Event handler)**：\n    * 事件处理器定义处理指示事件的接口。\n    * 事件处理器定义应用程序支持的服务。\n\
  * **具体事件处理器 (Concrete event handler)**：\n    * 具体事件处理器实现事件处理器定义的应用程序接口。\n* **Reactor**：\n\
  \    * Reactor 支持注册和注销具体事件处理器的接口。\n    * Reactor 使用同步事件复用器（如系统调用 [`select`](https://en.wikipedia.org/wiki/Select_(Unix))、[`epoll`](https://en.wikipedia.org/wiki/Epoll)\
  \ 或 [`WaitForMultipleObjects`](https://docs.microsoft.com/en-us/windows/desktop/api/synchapi/nf-synchapi-waitformultipleobjects)）来等待指示事件。\n\
  \    * Reactor 将事件映射到具体的事件处理器。\n    * Reactor 管理事件循环的生命周期。\n\n\n\n\n\nReactor（而非应用）等待指示事件，以便对事件进行多路复用和分发。具体的事件处理器注册在\
  \ Reactor 内部。Reactor 反转了控制流。由 Reactor（而非应用）等待指示事件并调用具体的事件处理器。这种控制流的反转通常被称为[好莱坞原则](https://en.wikipedia.org/wiki/Inversion_of_control)。\n\
  \n下面的代码片段展示了 C++ 框架[适应自适应通信环境 (ACE)](https://www.dre.vanderbilt.edu/~schmidt/ACE.html)\
  \ 的事件循环。\n\n```cpp\n 1 // CTRL c\n 2 SignalHandler *mutateTimer1= new SignalHandler(\
  \ timerId1 );\n 3 \n4 // CTRL z\n 5 SignalHandler *mutateTimer2= new SignalHandler(\
  \ timerId2 );\n 6 \n 7 ACE_Reactor::instance()->register_handler( SIGINT, mutateTimer1);\
  \ \n 8 ACE_Reactor::instance()->register_handler( SIGTSTP, mutateTimer2);\n 9 \n\
  10 \n11 // \"run\" the timer.\n12 Timer::instance ()->wait_for_event ();\n```\n\n\
  ACE 的事件循环\n\n第 2 行和第 5 行定义了键盘事件 `CTRL c` 和 `CTRL z` 的信号处理器。第 7 行和第 8 行注册了它们。事件循环在第\
  \ 12 行开始。\n\n### 优缺点\n\nReactor 模式的优缺点是什么？\n\n*   优点：\n    *   框架与应用逻辑的清晰分离。\n \
  \   *   各种具体事件处理器的模块化。\n    *   接口与实现的分离使得服务易于适配或扩展。\n    *   整体结构支持并发执行。\n*   缺点：\n\
  \    *   需要一个事件多路复用系统调用。\n    *   长时间运行的事件处理器可能会阻塞 Reactor。\n    *   控制流的反转使得测试和调试变得更加困难。\n\
  \n半同步/半异步模式通常用于 Reactor 模式，以便在单独线程中响应客户端请求。\n\nProactor 模式是 Reactor 模式的异步变体。Reactor\
  \ 模式同步地对事件处理器进行多路复用和分发，而 Proactor 模式则是异步的。\n\n### Proactor\n\nProactor 模式使事件驱动应用程序能够对服务请求进行多路复用和分发，这些是由异步操作的完成触发的。\n\
  \n### 要求\n\n服务器等事件驱动应用程序的性能通常可以通过异步处理多个服务请求来提高。为了实现这种性能，事件驱动应用程序必须同步处理多个事件，避免昂贵的数据同步或上下文切换。此外，新或改进的服务应该易于集成，且应用程序应该免受多线程和同步挑战的影响。\n\
  \n### 解决方案\n\n将应用程序服务分为两个部分：应该异步运行的长耗时操作，以及处理长耗时异步操作结果的完成处理器。完成处理器的处理与 Reactor 模式中事件处理器的处理非常，但异步操作通常是操作系统的工作。与\
  \ Reactor 模式一样，Proactor 模式定义了一个事件循环。\n\n这里是 Proactor 模式相对于 Reactor 模式的独特之处。启动一个如连接请求之类的异步操作，并在不阻塞调用者线程的情况下执行操作。当长耗时操作完成后，它会将一个完成事件放入完成事件队列中。Proactor\
  \ 使用异步事件多路复用器在队列上等待。异步事件多路复用器从队列中移除完成事件，Proactor 将其分发给特定的完成处理器。该完成处理器处理异步操作的结果。\n\
  \n### 组件\n\nProactor 包含九个组件。\n\n![Proactor](img/ArchitecturePatterns----Proactor.png)\n\
  \nProactor\n\n*   **句柄 (Handle)**：\n    *   代表操作系统的实体，如 socket，它可以生成完成事件。\n*   **异步操作\
  \ (Asynchronous operation)**：\n    *   通常是异步执行的长耗时操作。这可以是对 socket 的读或写操作。\n*   **异步操作处理器\
  \ (Asynchronous operation processor)**：\n    *   执行异步操作并在完成后将完成事件入队完成事件队列。\n*  \
  \ **完成处理器 (Completion handler)**：\n    *   定义了用于处理异步操作结果的接口。\n*   **具体完成处理器 (Concrete\
  \ completion handler)**：\n    *   以特定特定的方式处理异步操作的结果。\n*   **完成事件队列 (Completion event\
  \ queue)**：\n    *   缓冲完成事件，直到异步事件多路复用器将其取出。\n*   **异步事件多路复用器 (Asynchronous event\
  \ demultiplexer)**：\n    *   在等待完成事件队列发生完成事件时可能会阻塞。\n    *   从完成事件队列中移除完成事件。\n*\
  \   **Proactor**：\n    *   调用异步事件多路复用器来取出完成事件。\n    *   对完成事件进行多路复用和分发并调用具体完成处理器。\n\
  *   **发起者 (Initiator)**：\n    *   调用异步操作。\n    *   它与异步操作处理器交互。\n\n### 优缺点\n\nProactor\
  \ 模式的优缺点是什么？\n\n*   优点：\n    *   应用程序将与应用无关的异步功能与特定应用功能分离。\n    *   Proactor 的接口可以在支持不同异步事件多路复用的各种操作系统上使用。\n\
  \    *   应用程序不需要启动新线程，因为长耗时异步操作在调用者线程中运行。\n    *   Proactor 模式可以避免上下文切换的开销。\n  \
  \  *   应用程序不启动线程，因此不需要同步。\n*   缺点：\n    *   为了最高效地应用 Proactor 模式，操作系统应支持异步操作。\n\
  \    *   由于操作启动和完成之间在时间和空间上的分离，调试或测试程序非常困难。\n    *   调用异步操作和维护完成事件需要内存。\n\n####\
  \ 更多信息\n\n*   [自适应通信环境 (ACE)](https://en.wikipedia.org/wiki/Adaptive_Communication_Environment)\n\
  *   [Boost.Asio](https://www.boost.org/doc/libs/69_0/doc/html/boost_asio.html)\n\
  *   [面向模式的软件架构：并发和网络对象的模式](https://www.dre.vanderbilt.edu/~schmidt/POSA/POSA2/)\n\
  \n## 最佳实践\n\n本章为你提供了在现代 C++ 中编写良好的、快速并发程序的简单规则。多线程，特别是并行性和并发，在 C++ 中是一个相当新的话题；因此，在未来几年将会发现更多的最佳实践。请不要将本章的规则视为完整的列表，而是一个随时间演变的必要起点。这对于并行\
  \ STL 特别是如此。在更新此本书（2018/12）时，C++17 的并行算法仅部分可用；因此现在制定其最佳实践为时过早。\n\n### 通用\n\n让我们从适用于原子操作和线程的一些通用最佳实践开始。\n\
  \n#### 代码审查\n\n代码审查应该是每个专业软件开发过程的一部分。当你处理并发时，这一点尤为重要。并发本质上是复杂的，需要深思熟虑的分析和经验。\n\n\
  \n\n\n为了使审查最高效，请在审查之前将你想要讨论的代码发送给审查者。明确指出哪些不变性适用于你的代码。审查者应该有足够的时间在正式审查开始之前对代码进行分析。\n\
  \n还不服吗？让我给你举个例子。你还记得`std::shared_lock` 章节中 `readerWriterLock.cpp` 程序中的数据竞态 吗？\n\n\
  ```cpp\n 1 // readerWriterLock.cpp\n 2 \n3 #include <iostream>\n 4 #include <map>\n\
  \ 5 #include <shared_mutex>\n 6 #include <string>\n 7 #include <thread>\n 8 \n9\
