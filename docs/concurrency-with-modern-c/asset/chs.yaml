  10                                    {\"Ritchie\", 1983}};\n11 \n12 std::shared_timed_mutex\
  \ teleBookMutex;\n13 \n14 void addToTeleBook(const std::string& na, int tele){\n\
  15   std::lock_guard<std::shared_timed_mutex> writerLock(teleBookMutex);\n16   std::cout\
  \ << \"\\nSTARTING UPDATE \" << na;\n17   std::this_thread::sleep_for(std::chrono::milliseconds(500));\n\
  18   teleBook[na]= tele;\n19   std::cout << \" ... ENDING UPDATE \" << na << std::endl;\n\
  20 }\n21 \n22 void printNumber(const std::string& na){\n23   std::shared_lock<std::shared_timed_mutex>\
  \ readerLock(teleBookMutex);\n24   std::cout << na << \": \" << teleBook[na];\n\
  25 }\n26 \n27 int main(){\n28 \n29   std::cout << std::endl;\n30 \n31   std::thread\
  \ reader1([]{ printNumber(\"Scott\"); });\n32   std::thread reader2([]{ printNumber(\"\
  Ritchie\"); });\n33   std::thread w1([]{ addToTeleBook(\"Scott\",1968); });\n34\
  \   std::thread reader3([]{ printNumber(\"Dijkstra\"); });\n35   std::thread reader4([]{\
  \ printNumber(\"Scott\"); });\n36   std::thread w2([]{ addToTeleBook(\"Bjarne\"\
  ,1965); });\n37   std::thread reader5([]{ printNumber(\"Scott\"); });\n38   std::thread\
  \ reader6([]{ printNumber(\"Ritchie\"); });\n39   std::thread reader7([]{ printNumber(\"\
  Scott\"); });\n40   std::thread reader8([]{ printNumber(\"Bjarne\"); });\n41 \n\
  42   reader1.join();\n43   reader2.join();\n44   reader3.join();\n45   reader4.join();\n\
  46   reader5.join();\n47   reader6.join();\n48   reader7.join();\n49   reader8.join();\n\
  50   w1.join();\n51   w2.join();\n52 \n53   std::cout << std::endl;\n54 \n55   std::cout\
  \ << \"\\The new telephone book\" << std::endl;\n56   for (auto teleIt: teleBook){\n\
  57     std::cout << teleIt.first << \": \" << teleIt.second << std::endl;\n58  \
  \ }\n59 \n60   std::cout << std::endl;\n61 \n62 }\n```\n\n### 读写锁\n\n问题在于第 24 行的调用\
  \ `teleBook[na]` 可能会修改电话簿。你可以通过将读取线程 `reader8` 放在其他读取线程之前来诱发数据竞态。我在 C++ 研讨会中使用这个程序作为一种练习。练习的内容是找出数据竞态。大约\
  \ 10% 的参与者能在 5 分钟内发现数据竞态。\n\n#### 最小化可变数据的共享\n\n你应该最小化可变数据的数据共享，原因有两个：性能和安全性。安全性主要涉及数据竞态。在本节中，我将重点讨论性能。我将在接下来的最佳实践部分处理正确性问题。\n\
  \n在计算 Vector 的和 章节中，我进行了一项详尽的性能研究。求和 `std::vector` 中的值有多快？\n\n这是单线程求和的关键部分。\n\n\
  ```cpp\n...\n\nconstexpr long long size = 100000000;\n\nstd::cout << std::endl;\n\
  \nstd::vector<int> randValues;\nrandValues.reserve(size);\n\n// random values\n\
  std::random_device seed;std.mt19937 engine(seed());\nstd::uniform_int_distribution<>\
  \ uniformDist(1, 10);\n\nconst unsigned long long sum = std::accumulate(randValues.begin(),\
  \ \n                                               randValues.end(), 0);\n\n...\n\
  ```\n\n#### 单线程求和\n\n随后，我在四个线程上执行了求和。我最初简单地使用了一个共享的求和变量。\n\n```cpp\n...\n\nvoid\
  \ sumUp(unsigned long long& sum, const std::vector<int>& val){\nstd::shared_lock<std::shared_timed_mutex>\
  \ readerLock(teleBookMutex);\n   std::cout << na << \": \" << teleBook[na];\n}\n\
  ```\n\n#### 多线程求和\n\n(注：此处原文内容不完整，翻译已根据提供的片段进行处理)\n\n\n\n\n\n对于应该在编译时创建实例的用户定义类型，有一些限制条件。\n\
  \n## `constexpr` 构造函数\n\n*   只能通过常量表达式调用。\n*   不能使用异常处理。\n* 必须声明为 `default` 或 `delete`，或者函数体必须为空（C++11）。\n\
  \n## `constexpr` 用户定义类型\n\n*   不能有虚基类。\n*   要求每个基类对象和每个非静态成员都必须在构造函数的初始化列表中初始化，或者直接在类体中初始化。因此，每个被使用的构造函数（例如基类的构造函数）都必须是\
  \ `constexpr` 构造函数，且所应用的初始化器必须是常量表达式。\n\n[cppreference.com（https://en.cppreference.com/w/cpp/language/constexpr）](https://en.cppreference.com/w/cpp/language/constexpr)\
  \ 为 `constexpr` 用户定义类型提供了额外信息。为了将理论付诸，我定义了类 `MyInt`。`MyInt` 展示了上述要点。该类还拥有 `constexpr`\
  \ 方法。\n\n```cpp\n 1 // userdefinedTypes.cpp\n 2 \n 3 #include <iostream>\n 4 #include\
  \ <ostream>\n 5 \n 6 class MyInt{\n 7 public:\n 8     constexpr MyInt()= default;\n\
  \ 9     constexpr MyInt(int fir, int sec): myVal1(fir), myVal2(sec){}\n10     MyInt(int\
  \ i){\n11         myVal1= i - 2;\n12         myVal2= i + 3;\n13     }\n14   \n15\
  \     constexpr int getSum() const { return myVal1 + myVal2; }\n16   \n17     friend\
  \ std::ostream& operator<< (std::ostream &out, const MyInt& myInt){\n18        \
  \ out << \"(\" << myInt.myVal1 << \",\" << myInt.myVal2 << \")\";  \n19        \
  \ return out;\n20      }\n21 \n22 private:\n23     int myVal1= 1998;\n24     int\
  \ myVal2= 2003;\n25 \n26 };\n27 \n28 int main(){\n29   \n30     std::cout << std::endl;\n\
  31   \n32     constexpr MyInt myIntConst1;\n33   \n34     constexpr int sec = 2014;\n\
  35     constexpr MyInt myIntConst2(2011, sec);\n36     std::cout << \"myIntConst2.getSum():\
  \ \" << myIntConst2.getSum() << std::endl;\n37   \n38     int arr[myIntConst2.getSum()];\n\
  39     static_assert( myIntConst2.getSum() == 4025, \"2011 + 2014 should be 4025\"\
  \ );\n40   \n41     std::cout << std::endl;\n42   \n43 }\n```\n\n## 不可变用户定义类型\n\n\
  `MyInt` 类有两个 `constexpr` 构造函数：一个默认构造函数（第 8 行）和一个接受两个参数的构造函数（第 9 行）。此外，该类有两个方法，但只有\
  \ `getSum` 方法是常量表达式。我将该方法声明为 `const`，因为与 C++11 不同，C++14 中的 `constexpr` 方法不再自动是 `const`\
  \ 的。如果我想在 `constexpr` 对象中使用变量 `myVal1` 和 `myVal2`（第 23 和第 24 行），有两种定义方式：第一，我可以在构造函数的初始化列表中初始化它们（第\
  \ 9 行）；第二，我可以在类体中初始化它们（第 23 和第 24 行）。构造函数初始化列表中的优先级更高。\n\n第 38 行和第 39 行显示我可以在常量表达式中调用\
  \ `constexpr` 方法。这是程序的输出。\n\n![使用 `constexpr` 对象](img/BestPractices----userdefinedTypes.png)\n\
  \n## 使用 `constexpr` 对象\n\n我想再次显式地强调这一点：**`constexpr` 对象只能使用 `constexpr` 方法。**\n\n\
  像 Haskell 这样的函数式编程语言由于没有可变数据，因此非常适合并发编程。\n\n### 使用纯函数\n\nHaskell 被称为纯函数式语言，因为它基于纯函数。纯函数是指在给定相同参数时总是相同相同结果函数。它没有副作用，因此不能改变程序的状态。\n\
  \n纯函数从并发的角度来看具有显著优势。它们可以重新排序或自动在另一个线程上运行。\n\nC++ 中的函数默认是不纯的。以下三个函数都是纯的，但每个函数都有不同的特征。\n\
  \n```cpp\nint powFunc(int m, int n){\n    if (n == 0) return 1;\n    return m *\
  \ powFunc(m, n-1);\n}\n```\n\n`powFunc` 是一个在运行的普通函数。\n\n```cpp\ntemplate<int m,\
  \ int n>\nstruct PowMeta{\n    static int const value = m * PowMeta<m, n-1>::value;\n\
  };\n\ntemplate<int m>\nstruct PowMeta<m, 0>{\n    static int const value = 1;\n\
  };\n```\n\n`PowMeta` 是所谓的元函数，因为它在编译时运行。\n\n```cpp\nconstexpr int powConst(int m,\
  \ int n){\n    if (n == 0) return 1;\n    return m * powConst(m, n-1);\n}\n```\n\
  \n`powConst` 是一个在编译时运行的 `constexpr` 函数。\n\n## 使用正确的抽象\n\n使用 `constexpr` 有很多方法。在这个示例中，我使用了\
  \ `constexpr` 用户定义类型。\n\n\n\n\n\n`std::thread` 是原生线程的一个薄层封装。这意味着我对 Windows 线程的大小以及\
  \ [POSIX 线程](https://en.wikipedia.org/wiki/POSIX_Threads) 感感兴趣，因为它们在大多数情况下都会被内部使用。\n\
  \n*   Windows 系统：关于[线程栈栈大小](https://msdn.microsoft.com/en-us/library/windows/desktop/ms686774(v=vs.85).aspx)\
  \ 的帖子给了我答案：1 MB。\n*   POSIX 系统：[pthread_create](http://man7.org/linux/man-pages/man3/pthread_create.3.html)\
  \ 手页给我的答案：2MB。这是 i386 和 x86_64 架构的大小。如果你想知道其他支持 POSIX 的架构的大小，这里有：\n\n![`std::thread`\
  \ 的栈大小](img/BestPractices----threadStackSize.png)\n\n`std::thread` 的栈大小\n\n## 创建\n\
  \n我没有找到关于创建线程需要多长时间的数据。为了获得直观的感觉，我在 Linux 和 Windows 上进行了一个简单的性能测试。\n\n我在桌面级电脑上使用了\
  \ GCC 6.2.1，在笔记本电脑上使用了 `cl.exe` 进行性能测试。`cl.exe` 是 Microsoft Visual Studio 2017 的一部分。我以最大优化编译了程序。这意味着在\
  \ Linux 上使用标志 `O3`，在 Windows 上使用 `Ox`。\n\n这是我的小型测试程序。\n\n```\n 1 // threadCreationPerformance.cpp\n\
  \ 2 \n 3 #include <chrono>\n 4 #include <iostream>\n 5 #include <thread>\n 6 \n\
  \ 7 static const long long numThreads= 1'000'000;\n 8 \n 9 int main(){\n10 \n11\
  \     auto start = std::chrono::system_clock::now();\n12 \n13     for (volatile\
  \ int i = 0; i < numThreads; ++i) std::thread([]{}).detach();\n14 \n15     std::chrono::duration<double>\
  \ dur= std::chrono::system_clock::now() - start;\n16     std::cout << \"time: \"\
  \ << dur.count() << \" seconds\" << std::endl;\n17 \n18 }\n```\n\n线程创建的小型性能测试\n\n\
  程序创建了 100 万个线程，它们执行第 13 行的空 lambda 函数。这是 Linux 和 Windows 的数据：\n\n### Linux\n\n![Linux\
  \ 上的线程创建](img/BestPractices----threadCreationLinux.png)\n\nLinux 上的线程创建\n\n这意味着创建一个线程大约花费了\
  \ 14.5 sec / 1000000 = **在 Linux 上为 14.5 微秒**。\n\n### Windows\n\n![Windows 上的线程创建](img/BestPractices----threadCreationWindows.png)\n\
  \nWindows 上的线程创建\n\n线程创建大约花费了 44 sec / 1000000 = **在 Windows 上为 44 微秒**。\n\n反过来来说。你可以在一秒内**Linux\
  \ 上创建约 6.9 万个线程，在 Windows 上创建约 2.3 万个线程**。\n\n### 使用任务代替线程\n\n```\n 1 // asyncVersusThread.cpp\n\
  \ 2 \n 3 #include <future>\n 4 #include <thread>\n 5 #include <iostream>\n 6 \n\
  \ 7 int main(){\n 8 \n9   std::cout << std::endl;\n10 \n11   int res;\n12   std::thread\
  \ t([&]{ res = 2000 + 11; });\n13   t.join();\n14   std::cout << \"res: \" << res\
  \ << std::endl;             \n15 \n16   auto fut= std::async([]{ return 2000 + 11;\
  \ });\n17   std::cout << \"fut.get(): \" << fut.get() << std::endl;   \n18 \n19\
  \   std::cout << std::endl;   \n20 \n21 }\n```\n\nstd::async 对比线程\n\n根据该程序，有许多优选任务而非线程的原因。主要原因如下：\n\
  \n*   你可以使用安全的通信通道来返回通信结果。如果你使用共享变量，则必须对它的访问进行同步。\n*   你可以相当容易地向调用者返回值、通知和异常。\n\n\
  通过扩展 futures，我们获得了组合 futures 并构建高度复杂工作流的能力。这些工作流基于回调 `then`，以及组合 `when_any` 和 `when_all`。\n\
  \n### 如果分离了线程，请务必极其小心\n\n以下代码片段需要我们完全关注。\n\n```cpp\nstd::string s{\"C++11\"}\n\n\
  std::thread t([&s]{ std::cout << s << std::endl; });\nt.detach();\n```\n\n由于线程 `t`\
  \ 与其创建者的生命周期分离，两个竞态条件会导致未定义行为。\n\n1.  线程 `t` 可能会超过其创建者的寿命。后果是 `t` 引用了一个不存在的 `std::string`。\n\
  2.  程序在线程 `t` 完成工作之前就会关闭，因为输出流 `std::cout` 的生命周期绑定到主线程的生命周期。\n\n### 考虑使用线程\n\n如果\
  \ `t` 与其创建者的生命周期分离，两个竞态条件会导致未定义行为。\n\n1.  线程 `t` 可能会超过其创建者的寿命。后果是 `t` 引用了一个不存在的\
  \ `std::string`。\n2.  程序在线程 `t` 完成工作之前就会关闭，因为输出流 `std::cout` 的生命周期绑定到主线程的生命周期。\n\
  \n### 拷贝\n\n如果 `t` 与其创建者的生命周期分离，两个竞态条件会导致未定义行为。\n\n1.  线程 `t` 可能会超过其创建者的寿命。后果是 `t`\
  \ 引用了一个不存在的 `std::string`。\n2.  程序在线程 `t` 完成工作之前就会关闭，因为输出流 `std::cout` 的生命周期绑定到主线程的生命周期。\n\
  \n### 数据共享\n\n如果 `t` 与其创建者的生命周期分离，两个竞态条件会导致未定义行为。\n\n1.  线程 `t` 可能会超过其创建者的寿命。后果是\
  \ `t` 引用了一个不存在的 `std::string`。\n2.  程序在线程 `t` 完成工作之前就会关闭，因为输出流 `std::cout` 的生命周期绑定到主线程的生命周期。\n\
  \n### 独立的线程\n\n这个例子故意设计得很简单。我让主线程睡眠一秒，以确保它超过子线程 `t1` 和 `t2` 的寿命。这当然没有适当的同步，但它有助于说明我的观点。\n\
  \n```cpp\n 1 // threadSharesOwnership.cpp\n 2 \n 3 #include <iostream>\n 4 #include\
  \ <thread>\n 5 \n6 using namespace std::chrono_literals;\n 7 \n8 struct MyInt{\n\
  9   int val{2017};\n10   ~MyInt(){\n11     std::cout << \"Good Bye\" << std::endl;\n\
  12   }\n13 };\n14 \n15 void showNumber(MyInt* myInt){\n16     std::cout << myInt->val\
  \ << std::endl;\n17 }\n18 \n19 void threadCreator(){\n20     MyInt* tmpInt= new\
  \ MyInt; \n21     \n23     std::thread t1(showNumber, tmpInt);\n23     std::thread\
  \ t2(showNumber, tmpInt);\n24     \n25     t1.detach();\n26     t2.detach();\n27\
  \ }\n28 \n29 int main(){\n30     \n31     std::cout << std::endl;\n32     \n33 \
  \    threadCreator();\n34     std::this_thread::sleep_for(1s);\n35     \n36    \
  \ std::cout << std::endl;\n37     \n38 }\n```\n\n程序中的关键问题是：谁负责删除 `tmpInt`？是线程 `t1`（第\
  \ 22 行）、线程 `t2`（第 23 行），还是函数本身？由于我无法预测每个线程的运行时间，我选择了内存泄漏。结果是，第 10 行的 `MyInt` 析构函数从未被调用：\n\
  \n\n\n\n```cpp\n 1 // threadSharesOwnershipSharedPtr.cpp\n 2 \n 3 #include <iostream>\n\
  \ 4 #include <memory>\n 5 #include <thread>\n 6 \n 7 using namespace std::literals::chrono_literals;\n\
  \ 8 \n 9 struct MyInt{\n10   int val{2017};\n11   ~MyInt(){\n12     std::cout <<\
  \ \"Good Bye\" << std::endl;\n13   }\n14 };\n15 \n16 void showNumber(std::shared_ptr<MyInt>\
  \ myInt){    \n17     std::cout << myInt->val << std::endl;\n18 }\n19 \n20 void\
  \ threadCreator(){\n21     auto sharedPtr = std::make_shared<MyInt>();   \n22 \n\
  23     std::thread t1(showNumber, sharedPtr);\n24     std::thread t2(showNumber,\
  \ sharedPtr);\n25 \n26     t1.detach();\n27     t2.detach();\n28 }\n29 \n30 int\
  \ main(){\n31     \n32     std::cout << std::endl;\n33 \n34     threadCreator();\n\
  35     std::this_thread::sleep_for(1s);\n36 \n37     std::cout << std::endl;\n38\
  \ \n39 }\n```\n```\n\n无关的线程通过 `std::shared_ptr` 共享所有权。\n\n源代码需要两处小的改动。首先，第 21 行的指针变成了\
  \ `std::shared_ptr`，其次，第 16 行的 `showNumber` 函数接收的是智能指针而不是裸指针。\n\n### 尽量减少持有锁的时间\n\
  \n如果你持有锁，则只有一个线程可以进入临界区域并执行。\n\n```cpp\nvoid setDataReadyBad(){\n    std::lock_guard<std::mutex>\
  \ lck(mutex_);\n    mySharedWork = {1, 0, 3};\n    dataReady = true;\n    std::cout\
  \ << \"Data prepared\" << std::endl;\n    condVar.notify_one();\n}             \
  \                   // 解互斥\n\nvoid setDataReadyGood(){\n    mySharedWork = {1, 0,\
  \ 3};\n    {\n        std::lock_guard<std::mutex> lck(mutex_);\n        dataReady\
  \ = true;       \n    }                           // 解互斥\n    std::cout << \"Data\
  \ prepared\" << std::endl;\n    condVar.notify_one();\n}\n```\n\n`setDataReadyBad`\
  \ 和 `setDataReadyGood` 函数是条件变量的通知组件。变量 `dataReady` 是为了防止虚假唤醒和丢失唤醒。由于 `dataReady`\
  \ 是非原子变量，必须使用锁 `lck` 进行同步。为了让锁的生存尽可能短，请使用人工作用域（`{ ... }`），如在 `setDataReadyGood`\
  \ 函数中所示。\n\n### 将互斥锁放入锁\n\n你不应该在没有锁的情况下使用互斥锁。\n\n```cpp\nstd::mutex m;\nm.lock();\n\
  // 临界区域\nm.unlock();\n```\n\n临界区域可能会发生意外情况，或者你忘记解锁互斥锁：结果是相同的。如果你不解锁互斥锁，另一个需要该锁的线程会被阻塞，你最终会导致死锁。\n\
  \n得益于自动处理底层互斥锁的锁，发生死锁的风险大大降低。根据 RAII 范式，锁会在构造函数中自动绑定其互斥锁并在析构函数中释放它。\n\n```cpp\n\
  {\n  std::mutex m,\n  std::lock_guard<std::mutex> lockGuard(m);\n  // 临界区域\n}  \
  \        // 解互斥\n```\n\n人工作用域（`{ ... }`）确保了锁的生存周期自动结束；因此，底层互斥锁被解锁。\n\n### 尝试在同一时刻最多锁定一个互斥锁\n\
  \n当然，有时在同一时刻需要多个互斥锁。在这种情况下，你可能会成为竞态条件的受害者，导致如后续章节所示的死锁](#chap20.xhtml_chapterXXXDeadlocks）；因此，尽量避免在同一时刻持有多个互斥锁。\n\
  \n### 给你的锁命名\n\n如果你使用没有命名的锁（如 `std::lock_guard`），它将会被立即销毁。\n\n```cpp\n{\n    std::mutex\
  \ m,\n    std::lock_guard<std::mutex>{m};\n    // 临界区域\n} \n```\n\n在这个看似普通的代码片段中，`std::lock_guard`\
  \ 被立即销毁。因此，后续的临界区域是在没有同步的情况下执行的。C++ 标准中的锁遵循相同的模式。它们会锁定自己的互斥锁。\n\n```cpp\n 1 // threadSharesOwnershipSharedPtr.cpp\n\
  \ 2 \n 3 #include <iostream>\n 4 #include <memory>\n 5 #include <thread>\n 6 \n\
  \ 7 using namespace std::literals::chrono_literals;\n 8 \n 9 struct MyInt{\n10 \
  \  int val{2017};\n11   ~MyInt(){\n12     std::cout << \"Good Bye\" << std::endl;\n\
  13   }\n14 };\n15 \n16 void showNumber(std::shared_ptr<MyInt> myInt){    \n17  \
  \   std::cout << myInt->val << std::endl;\n18 }\n19 \n20 void threadCreator(){\n\
  21     auto sharedPtr = std::make_shared<MyInt>();   \n22 \n23     std::thread t1(showNumber,\
  \ sharedPtr);\n24     std::thread t2(showNumber, sharedPtr);\n25 \n26     t1.detach();\n\
  27     t2.detach();\n28 }\n29 \n30 int main(){\n31     \n32     std::cout << std::endl;\n\
  33 \n34     threadCreator();\n35     std::this_thread::sleep_for(1s);\n36 \n37 \
  \    std::cout << std::endl;\n38 \n39 }\n```\n\n\n\n\n*   启动一个新线程并尝试锁定互斥锁 `m`，会导致死锁。\n\
  *   锁定另一个互斥锁 `m2`，你可能会遇到死锁，因为你同时锁定了两个互斥锁 `m` 和 `m2`。\n*   没有直接或间接地尝试锁定互斥锁 `m`；一切看起来都很正常。之所以用“看起来”，是因为你的同事可能会修改该函数，或者函数是动态链接的，导致你得到了一个不同的版本。发生什么皆不可知。\n\
  *   按照预期工作，但你可能会遇到性能问题，因为你不知道函数 `unknownFunction` 需要花费多长时间。\n\n要解决这个问题，请使用局部变量。\n\
  \n```\nauto tempVar = unknownFunction();\nstd::mutex m, \n{\n  std::lock_guard<std::mutex>\
  \ lockGuard(m);\n  sharedVariable = tempVar;\n}\n```\n\n这种额外的间接层解决了所有问题。`tempVar`\
  \ 是局部变量，因此它不会成为数据竞态的受害者。这意味着你可以在没有同步机制的情况下调用 `unknownFunction`。此外，持有锁的时间被减少到了最低：仅将\
  \ `tempVar` 的值赋值给 `sharedVariable`。\n\n### 条件变量\n\n通过通知来同步线程是一个简单的概念，但条件变量让这项任务变得非常具有挑战性。主要原因是条件变量没有状态。\n\
  \n*   如果条件变量收到了通知，它可能是错误的（虚假唤醒）。\n*   如果条件变量在准备就绪之前收到了通知，则该通知就会丢失（丢失的唤醒）。\n\n####\
  \ 不要在使用没有谓词的情况下条件变量\n\n在没有谓词的情况下使用条件变量会导致竞态条件。\n\n```cpp\n 1 // conditionVariableLostWakeup.cpp\n\
  \ 2 \n3 #include <condition_variable>\n 4 #include <mutex>\n 5 #include <thread>\n\
  \ 6 \n  std::mutex mutex_;\n8 std::condition_variable condVar;\n 9 \n10 void waitingForWork(){\n\
  11     std::unique_lock<std::mutex> lck(mutex_);\n12     condVar.wait(lck);    \
  \                      \n13     // do the work\n14 }\n15 \n16 void setDataReady(){\n\
  17     condVar.notify_one();                        \n18 }\n19 \n20 int main(){\n\
  21 \n22   std::thread t1(setDataReady);\n23   std::thread t2(waitingForWork);  \
  \             \n24 \n25   t1.join();\n26   t2.join();\n27   \n28 }\n```\n\n没有谓词的条件变量\n\
  \n如果线程 `t1` 在线程 `t2` 之前运行，你就会得到死锁。`t1` 在 `t2` 接收之前发送了通知。通知丢失了。这种情况经常发生，因为线程 `t1`\
  \ 在线程 `t2` 之前启动，且线程 `t1` 需要的工作较少。\n\n在工作流中添加一个 bool 变量 `dataReady` 解决了这个问题。`dataReady`\
  \ 还能防止虚假唤醒，因为等待的线程首先会检查通知是否来自正确的线程。\n\n```cpp\n 1 // conditionVarialbleLostWakeupSolved.cpp\n\
  \ 2 \n3 #include <condition_variable>\n 4 #include <mutex>\n 5 #include <thread>\n\
  \ 6 \n 7 std::mutex mutex_;\n8 std::condition_variable condVar;\n 9 \n10 bool dataReady{false};\n\
  11 \n12 void waitingForWork(){\n13     std::unique_lock<std::mutex> lck(mutex_);\n\
  14     condVar.wait(lck, []{ return dataReady; });\n15     // do the work \n16 }\n\
  17 \n18 void setDataReady(){\n19     {\n20       std::lock_guard<std::mutex> lck(mutex_);\n\
  21       dataReady = true;\n22     }\n23     condVar.notify_one();\n24 }\n25 \n\
  26 int main(){\n27 \n28   std::thread t1(waitingForWork);\n29   std::thread t2(setDataReady);\n\
  30 \n31   t1.join();\n32   t2.join();\n33   \n34 }\n```\n\n带有谓词的条件变量\n\n#### 使用\
  \ Promises 和 Futures 代替条件变量\n\n对于一次性通知，promises 和 futures 是更好的选择。程序 `conditioVarialbleLostWakeupSolved.cpp`的工作流可以直接用\
  \ promise 和 future 实现。\n\n```cpp\n 1 // notificationWithPromiseAndFuture.cpp\n 2\
  \ \n3 #include <future>\n 4 #include <utility>\n 5 \n6 void waitingForWork(std::future<void>&&\
  \ fut){\n7     fut.wait();\n8     // do the work\n9 }\n10 void setDataReady(std::promise<void>\
  \ prom){\n11     prom.set_value();\n12 }\n13 \n14 int main(){\n15 \n16   std::promise<void>\
  \ sendReady;\n17   std::future<void> fut = sendReady.get_future();\n18 \n19   std::thread\
  \ t1(waitingForWork, std::move(fut));\n20   std::thread t2(setDataReady, std::move(sendReady));\n\
  21 \n22   t1.join();\n23   t2.join();\n24 }\n```\n\n使用 promise 和 future 的通知\n\n\n\
  \n\n\n共享变量的`Thread-safe initialisation` 有多种方式实现。你可以依赖 C++ 运行时的保证，例如常量表达式、块作用域内的静态变量，或者使用函数\
  \ `std::call_once` 配合标志 `std::once_flag`。我们使用 C++ 编程；因此，你可以利用极其复杂的获取-释放语义（acquire-release\
  \ semantic）基于原子操作来构建你的抽象。除非必要，否则根本不要这样做。这意味着，如果你通过测量关键代码路径的性能确定了瓶颈；只有当你知道自己手工编写的版本优于语言的默认保证时，才进行修改。\n\
  \n## 不要重复轮子\n\n编写线程安全的数据结构是一项非常有挑战性的工作。编写无锁数据结构要困难得多；因此，请使用现有的库，如 [Boost.Lockfree](http://www.boost.org/doc/libs/1_66_0/doc/html/lockfree.html)\
  \ 或 [CDS](http://%20http://libcds.sourceforge.net/)。\n\n### Boost.Lockfree\n\nBoost.Lockfree\
  \ 支持三种不同的数据结构：\n\n- **Queue (队列)**：一个无锁的多生产者/多消费者队列\n- **Stack (栈)**：一个无锁的多生产者/多消费者栈\n\
  - **spsc_queue**：一个无等待的单生产者/单消费者队列（通常称为环形缓冲区）\n\n### CDS\n\nCDS 代表并发数据结构（Concurrent\
  \ Data Structures），包含许多侵入式（非所有）和非侵入式（所有）容器。标准模板库（STL）的容器是非侵入式的，因为它们会自动管理自己的元素。\n\
  \n- **Stacks (栈)**（无锁）\n- **Queues (队列)** 和 **priority-queues (优先队列)**（无锁）\n- **Ordered\
  \ lists (有序列表)**\n- **Ordered sets (有序集合)** 和 **maps (映射)**（无锁和基于锁）\n- **Unordered\
  \ sets (无序集合)** 和 **maps (映射)**（无锁和基于锁）\n\n# 数据结构\n\n## 基于锁的数据结构\n\n当多个线程共享数据结构且该数据结构是可变的时，你必须保护数据结构免受并发访问。从概念上讲，保护可以从外部或从内部进行。从外部意味着由调用者（应用程序）负责保护数据。这种外部视角是我目前为止在本书中主要使用的视角。从内部意味着数据结构负责保护自己。一个保护自己以确保不会出现\
  \ [data race]（数据竞态）的数据结构被称为线程安全的。这种内部视角是我在本章和下一章中要介绍的视角。\n\n我想明确强调的是，如果没有以前作者的帮助，我永远无法写出一本关于并发的书。这一说法对于关于并发数据结构的章节尤其如此。因此，我的书深受\
  \ Maurice Herlihy 和 Nir Shavit 著的 [The Art of Multiprocessing Programming](https://www.oreilly.com/library/view/the-art-of/9780123705914/)\
  \ 以及 Anthony Williams 著的 [C++ Concurrency in Action](https://www.manning.com/books/c-plus-plus-concurrency-in-action)\
  \ 的影响。\n\n首先，在设计并发数据结构时，你需要记住哪些通用考虑因素？\n\n### 通用考虑因素\n\n实现线程安全的数据结构是特殊的。在我深入探讨这些特殊问题之前，这里有一个简要的概述，包含了你必须回答的问题。\n\
  \n- **锁策略 (Locking Strategy)**：数据结构是否应该支持粗粒度或细粒度锁？粗粒度锁可能更容易实现，但会引入竞争。\n- **接口的粒度\
  \ (Granularity of the Interface)**：线程安全数据结构的接口越大，对该数据结构并发使用的推理就越困难。\n- **典型使用模式\
  \ (Typical Usage Pattern)**：当读取者主要使用你的数据结构时，你不应该为写入者进行优化。\n- **避免漏洞 (Avoidance of\
  \ Loopholes)**：不要将你数据结构的内部实现传递给客户端。\n- **竞争 (Contention)**：并发的客户端请求频繁还是经常使用你的数据结构？\n\
  - **可扩展性 (Scalability)**：当并发客户端数量增加或数据结构有界限时，你数据结构的性能特征如何？\n- **不变性 (Invariants)**：当数据结构被使用时，必须满足哪些不变性？\n\
  - **异常 (Exceptions)**：发生异常时会发生什么？\n\n当然，这些考虑因素是相互依赖的。例如，使用粗粒度锁策略可以让你更容易思考接口的粒度和不变性。相比之下，它可能会增加数据结构上的竞争并破坏可扩展性。\n\
  \n### 锁策略 (Locking Strategy)\n\n数据结构是否应该支持粗粒度或细粒度锁？首先，我指的粗粒度锁是什么？粗粒度锁意味着在某时刻只有一个线程使用数据结构。使用单个锁的\
  \ 线程安全接口模式是实现粗粒度锁的一种典型方式。以下是线程安全接口模式的直接想法。\n\n- 所有接口方法（`public`）都应该使用锁。\n- 所有实现方法（`protected`\
  \ 和 `private`）不能使用锁。\n- 接口方法只调用 `protected` 或 `private` 方法，而不调用 `public` 方法。\n\n\
  线程安全接口模式有两个优点：所有公共方法在设计上都是线程安全的，且在设计上是无死锁的。线程安全接口模式在设计上是无线程。我假设以下实现可以说明我的观点：\n\n\
  ```cpp\nthreadSafeInterface.cpp\n#include <iostream>\n#include <mutex>\n#include\
  \ <thread>\n\nclass Critical{\n\npublic:\n    void interface1() const {\n      \
  \  std::lock_guard<std::mutex> lockGuard(mut);\n        implementation1();\n   \
  \ }\n    void interface2(){\n        std::lock_guard<std::mutex> lockGuard(mut);\n\
  \        implementation2();\n        implementation3();\n        implementation1();\n\
  \    }\nprivate: \n    void implementation1() const {\n        std::cout << \"implementation1:\
  \ \" \n                  << std::this_thread::get_id() << std::endl;\n    }\n  \
  \  void implementation2(){\n        std::cout << \"    implementation2: \" \n  \
  \                << std::this_thread::get_id() << std::endl;\n    }\n    void implementation3(){\
  \    \n        std::cout << \"        implementation3: \" \n                  <<\
  \ std::this_thread::get_id() << std::endl;\n    }\n   \nmutable std::mutex mut;\n\
  };\n\nint main(){\n    \n    std::cout << std::endl;\n    \n    std::thread t1([]{\
  \ \n        const Critical crit;\n        crit.interface1();\n    });\n    \n  \
  \  std::thread t2([]{\n        Critical crit;\n        crit.interface2();\n    \
  \    crit.interface1();\n    });\n    \n    Critical crit;\n    crit.interface1();\n\
  \    crit.interface2();\n    \n    t1.join();\n    t2.join();\n    \n    std::cout\
  \ << std::endl;\n    \n}\n```\n\n线程安全接口模式听起来很有前景，但也有明显的缺点。实现线程安全接口的数据结构是一个瓶颈，因为在某时刻只有一个线程可以使用该数据结构。这种特性意味着，如果你有许多线程并发地在数据结构上，你应该寻找更细粒度的锁。例如，与其用一个锁保护整个单链表的接口，不如你可以在单链表的每个节点上使用锁。\n\
  \n#### 接口的粒度 (Granularity of the Interface)\n\n\n\n\n\n想象一下，你想为 `std::deque` 实现一个基于锁的包装器\
  \ `ThreadSafeQueue`。下面的代码段给出了 `ThreadSafeQueue` 的大致概念。\n\n```cpp\nclass ThreadSafeQueue{\n\
  \    ...\npublic:\n    bool empty() const;\n    std::shared_ptr<int> pop();\n  \
  \  ...\nprivate:\n    std::deque<int> data;\n    ...\n};\n```\n\n为了简单起见，我只显示了 `empty`\
  \ 和 `pop` 两个方法。`empty` 返回 `ThreadSafeQueue` 是否为空，`pop` 返回并移除 `ThreadSafeQueue` 的头部元素。这个接口的粒度太不对！为什么呢？假设有两个线程想要对同一个\
  \ `threadSafeQueue` 执行以下函数。\n\n```cpp\nThreadSafeQueue threadSafeQueue;\n\nstd::shared_ptr<int>\
  \ getHead(){\n    if (!threadSafeQueue.empty()){\n        auto head = threadSafeQueue.pop();\n\
  \        return head;\n    }\n    return std::shared_ptr<int>();\n}\n...\nstd::thread\
  \ t1([&]{ auto res = getHead();\n                  ...\n                  });\n\
  std::thread t2([&]{ auto res = getHead();\n                  ...\n             \
  \     });\n```\n\n这段代码存在一个竞态条件，可能会导致未定义行为。在检查 `!threadSafeQueue.empty()`（队列不为空）与通过\
  \ `threadSafeQueue.pop()` 移除头部元素之间，存在一个时间窗口。例如，可能会发生以下交替。\n\n### 使用 `ThreadSafeQueue`\
  \ 的未定义行为\n\n| `thread t1` | `thread t2` |\n| :--- | :--- |\n| (1) `!threadSafeQueue.empty()\
  \ == true` | |\n| | (2) `!threadSafeQueue.empty() == true` |\n| (3) `auto head =\
  \ threadSafeQueue.pop();` | |\n| | (4) `auto head = threadSafeQueue.pop();` |\n\n\
  如果 `threadSafeQueue` 只有一个元素，那么来自线程 `t2` 的第二个 `threadSafeQueue.pop()` 调用将产生未定义行为。尽管这两个方法分本身都是线程安全的，但这两个方法的组合却会导致未定义行为。接口将同步\
  \ `threadSafeQueue` 访问的负担压在了客户端身上。这远非理想。\n\n改变 `ThreadSafeQueue` 上方法的粒度可以非常优雅地解决这个问题。只需将\
  \ `empty` 和 `pop` 两个调用合并为一个方法即可。\n\n```cpp\nclass ThreadSafeQueue{\n    ...\npublic:\n\
  \    std::shared_ptr<int> tryPop(){\n        std::lock_guard<std::mutex> queLock(queMute);\n\
  \        if (!data.empty()){\n            auto head = data.pop();\n            return\
  \ head;\n        }\n        return std::shared_ptr<int>();\n    }\n    ...\nprivate:\n\
  \    std::deque<int> data;\n    mutable std::lock_mutex queMutex;\n    ...\n};\n\
  ```\n\n### 典型使用模式\n\n数据结构的典型使用模式是读访问。读写锁 允许你针对读访问进行优化。当你将一个 `std::shared_timed_mutex`\
  \ 放入 `std::shared_lock` 中时，锁将变为共享锁；但当你将一个 `std::shared_timed_mutex` 放入 `std::lock_guard`\
  \ 或 `std::unique_lock` 中时，你获得的是斥锁。\n\n电话簿是一种读取频率远高于修改频率的数据结构，因此是读写锁的理想候选者。让我先从互斥锁开始以获得一个初始的性能数据。我有一本包含大约\
  \ 89,000 条目的的电话簿。十个线程按任意顺序读取 89,000 个名字，而一个线程为每十个姓的电话号码加 1。当然，所有线程都在同时运行。\n\n下面的图片显示了电话簿的一部分。你可以看到姓名/电话对之间用冒号分隔，而姓名与号码之间用逗号隔开。\n\
