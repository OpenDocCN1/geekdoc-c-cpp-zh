  ```\n\n# 使用 fetch_add 方法对向量进行求和\n\n现在我们获得的性能与上一个示例相似；`operator +=` 和 `fetch_add`\
  \ 之间几乎没有区别。\n\n![Summation with an atomic on Linux](img/CaseStudies----synchronisationWithFetchAdd.png)\n\
  \nLinux 上使用原子操作进行求和\n\n![Summation with an atomic on Windows](img/CaseStudies----synchronisationWithFetchAdd_win.png)\n\
  \nWindows 上使用原子操作进行求和\n\n尽管原子操作上的 `+=` 操作和 `fetch_add` 方法之间没有性能差异，但 `fetch_add`\
  \ 有一个优势：它允许我显式地弱内存排序并应用松弛语义（relaxed semantic）。\n\n## 使用松弛语义使用 `fetch_add` 方法\n\n\
  ```\n 1 // synchronisationWithFetchAddRelaxed.cpp\n 2 \n 3 ...\n 4 \n 5 void sumUp(std::atomic<unsigned\
  \ long long>& sum, const std::vector<int>& val, \n 6            unsigned long long\
  \ beg, unsigned long long end){\n 7     for (auto it = beg; it < end; ++it){\n 8\
  \         sum.fetch_add(val[it], std::memory_order_relaxed);\n 9     }\n10 }\n11\
  \ \n12 ...\n```\n\n原子对象的默认行为是顺序一致性。这一说法对于原子的加法和赋值，当然对于 `fetch_add` 方法来说都是的，但我们可以进一步优化。我将求和表达式中的内存排序调整为松弛语义：`sum.fetch_add(val[it],\
  \ std::memory_order_relaxed)`。松弛语义是最弱的内存排序；因此也是我优化的终点。\n\n松弛语义在这种用例中是可行的，因为我们有两个保证：每次通过\
  \ `fetch_add` 进行加法都是原子性的，并且线程会在 `join` 调用处同步。\n\n由于使用了最弱的内存模型，我们获得了最好的性能。\n\n![Summation\
  \ with a relaxed atomic on Linux](img/CaseStudies----synchronisationWithFetchAddRelaxed.png)\n\
  \nLinux 上使用松弛原子进行求和\n\n![Summation with a relaxed atomic on Windows](img/CaseStudies----synchronisationWithFetchAddRelaxed_win.png)\n\
  \nWindows 上使用松弛原子进行求和\n\n## 使用共享变量的所有多线程数据\n\n性能数字的单位是秒。\n\n所有多线程求和的性能\n\n| **操作系统\
  \ (编译器)** | **std::lock_guard** | **atomic +=** | **fetch_add** | **fetch_add (relaxed)**\
  \ |\n\n| --- | --- | --- | --- | --- |\n| Linux (GCC) | 20.81 | 7.78 | 7.87 | 7.66\
  \ |\n| Windows (cl.exe) | 6.22 | 15.73 | 15.78 | 15.01 |\n\n性能数字的结果并不尽人意。使用松弛语义的共享原子变量并借助四个线程计算总和，比使用单线程配合\
  \ `std::accumulate` 算法要慢约 100 倍。\n\n让我们结合之前的两种加数策略。我使用四个线程并尽可能地减少线程之间的同步。\n\n###\
  \ 线程局部求和\n\n有不同的方法可以减少同步。我可以使用本地变量、线程本地数据和任务。\n\n### 使用局部变量\n\n由于每个线程都可以使用本地求和变量，因此可以在不需要同步的情况下完成工作。同步只在累加局部变量时才是必要的。局部变量的求和是必须保护的临界区域。可以通过多种方式实现。简单提到：由于只发生了四次加法，从性能角度来看，使用哪种同步并不重要。我使用了\
  \ `std::lock_guard`、一个具有顺序一致性的原子对象以及用于求和的松弛语义。\n\n#### `std::lock_guard`\n\n```cpp\n\
  \ 1 // localVariable.cpp\n 2 \n 3 #include <mutex>\n 4 #include <chrono>\n 5 #include\
  \ <iostream>\n 6 #include <random>\n 7 #include <thread>\n 8 #include <utility>\n\
  \ 9 #include <vector>\n10 \n11 constexpr long long size = 100000000;   \n12 \n13\
  \ constexpr long long fir =  25000000;\n14 constexpr long long sec =  50000000;\n\
  15 constexpr long long thi =  75000000;\n16 constexpr long long fou = 100000000;\n\
  17 \n18 std::mutex myMutex;\n19 \n20 void sumUp(unsigned long long& sum, const std::vector<int>&\
  \ val, \n21            unsigned long long beg, unsigned long long end){\n22    \
  \ unsigned long long tmpSum{};\n23     for (auto i = beg; i < end; ++i){\n24   \
  \      tmpSum += val[i];\n25     }\n26     std::lock_guard<std::mutex> lockGuard(myMutex);\n\
  27     sum += tmpSum;\n28 }\n29 \n30 int main(){\n31 \n32   std::cout << std::endl;\n\
  33 \n34   std::vector<int> randValues;\n35   randValues.reserve(size);\n36 \n37\
  \   std::mt19937 engine;\n38   std::uniform_int_distribution<> uniformDist(1, 10);\n\
  39 \n40   const auto sta = std::chrono::system_clock::now();\n41 \n42   std::thread\
  \ t1(sumUp, std::ref(sum), std::ref(randValues), 0, fir);\n43   std::thread t2(sumUp,\
  \ std::ref(sum), std::ref(randValues), fir, sec);\n44   std::thread t3(sumUp, std::ref(sum),\
  \ std::ref(randValues), sec, thi);\n45   std::thread t4(sumUp, std::ref(sum), std::ref(randValues),\
  \ thi, fou);\n46 \n47   t1.join();\n48   t2.join();\n49   t3.join();\n50   t4.join();\n\
  51 \n52   const std::chrono::duration<double> dur=std::chrono::system_clock::now()\
  \ - sta;\n53 \n54   std::cout << \"Time for \" << dur.count() \n55             <<\
  \ \" seconds\" << std::endl;\n56   std::cout << \"Result: \" << sum << std::endl;\n\
  57 \n58   std::cout << std::endl;\n59 }\n```\n\n使用 `std::lock_guard` 的最小同步求和\n\n\
  第 26 行和第 27 行是关键。这些是将局部求和结果 `tmpSum` 加到全局变量 `sum` 的行。\n\n![Summation with a local\
  \ variable on Linux](img/CaseStudies----localVariable.png)\n\nLinux 上使用局部变量的求和\n\
  \n![Summation with a local variable on Windows](img/CaseStudies----localVariable_win.png)\n\
  \nWindows 上使用局部变量的求和\n\n在接下来的两种使用局部变量变体中，只有 `sumUp` 函数发生了变化；因此我只显示该函数。整个程序请参考源代码。\n\
  \n#### 使用顺序一致性的原子变量\n\n我们将非原子的全局求和变量 `sum` 替换为原子变量。\n\n```cpp\n 1 // localVariableAtomic.cpp\n\
  \ 2 \n 3 ...\n 4 \n 5 void sumUp(std::atomic<unsigned long long>& sum, const std::vector<int>&\
  \ val, \n 6            unsigned long long beg, unsigned long long end){\n 7    \
  \ unsigned long long tmpSum{};\n 8     for (auto i = beg; i < end; ++i){\n 9   \
  \      tmpSum += val[i];\n10     }\n11     sum+= tmpSum;\n12 }\n13 \n14 ...\n```\n\
  \n使用原子变量和最小同步的向量求和\n\n这里是性能数据。\n\n![Summation with a local variable on Linux](img/CaseStudies----localVariableAtomic.png)\n\
  \nLinux 上使用局部变量的求和\n\n![Summation with a local variable on Windows](img/CaseStudies----localVariableAtomic_win.png)\n\
  \nWindows 上使用局部变量的求和\n\n#### 使用松弛语义的原子变量\n\n我们可以做得更好。现在我使用松弛语义代替默认内存排序。这是定义良好的，因为我们需要的保证是所有的加法都发生且是原子的。\n\
  \n\n\n\n\n```cpp\n 1 // localVariableAtomicRelaxed.cpp\n 2 \n 3 void sumUp(std::atomic<unsigned\
  \ long long>& sum, const std::vector<int>& val, \n 4            unsigned long long\
  \ beg, unsigned long long end){\n 5     unsigned int long long tmpSum{};\n 6   \
  \  for (auto i = beg; i < end; ++i){\n 7         tmpSum += val[i];\n 8     }\n 9\
  \     sum.fetch_add(tmpSum, std::memory_order_relaxed);\n10 }\n11 \n12 ...\n```\n\
  \n# 使用最小同步和松弛语义原子操作对所向量，使用 `std::lock_guard` 还是使用具有顺序一致性或松弛语义的原子操作都没有区别。\n\n![在\
  \ Linux 上使用局部变量进行求和](img/CaseStudies----localVariableAtomicRelaxed.png)\nLinux 上使用局部变量进行求和\n\
  \n![在 Windows 上使用局部变量进行求和](img/CaseStudies----localVariableAtomicRelaxed_win.png)\n\
  Windows 上使用局部变量进行求和\n\n线程本地数据是局部数据的特殊类型。它的生命周期绑定线程的作用范围，而不是函数的作用范围，例如此示例中的变量 `tmpSum`。\n\
  \n### 使用线程本地数据\n\n线程本地数据属于创建它的线程；它仅在需要时才创建。线程本地数据是局部求和变量 `tmpSum` 的理想选择。\n\n```cpp\n\
  \ 1 // threadLocalSummation.cpp\n 2 \n 3 #include <atomic>\n 4 #include <chrono>\n\
  \ 5 #include <iostream>\n 6 #include <random>\n 7 #include <thread>\n 8 #include\
  \ <utility>\n 9 #include <vector>\n10 \n11 constexpr long long size = 100000000;\
  \   \n12 \n13 constexpr long long fir =  25000000;\n14 constexpr long long sec =\
  \  50000000;\n15 constexpr long long thi =  75000000;\n16 constexpr long long fou\
  \ = 100000000;\n17 \n18 thread_local unsigned long long tmpSum = 0;\n19 \n20 void\
  \ sumUp(std::atomic<unsigned long long>& sum, const std::vector<int>& val, \n21\
  \            unsigned long long beg, unsigned long long end){\n22     for (auto\
  \ i = beg; i < end; ++i){\n23         tmpSum += val[i];\n24     }\n25     sum.fetch_add(tmpSum,\
  \ std::memory_order_relaxed);\n26 }\n27 \n28 int main(){\n29 \n30   std::cout <<\
  \ std::endl;\n31 \n32   std::vector<int> randValues;\n33   randValues.reserve(size);\n\
  34 \n35   std::mt19937 engine;\n36   std::uniform_int_distribution<> uniformDist(1,\
  \ 10);\n37   for (long long i = 0; i < size; ++i) \n39       randValues.push_back(uniformDist(engine));\n\
  39 \n40   std::atomic<unsigned long long> sum{}; \n41   const auto sta = std::chrono::system_clock::now();\n\
  42 \n43   std::thread t1(sumUp, std::ref(sum), std::ref(randValues), 0, fir);\n\
  44   std::thread t2(sumUp, std::ref(sum), std::ref(randValues), fir, sec);\n45 \
  \  std::thread t3(sumUp, std::ref(sum), std::ref(randValues), sec, thi);\n46   std::thread\
  \ t4(sumUp, std::ref(sum), std::ref(randValues), thi, fou);   \n47 \n48   t1.join();\n\
  49   t2.join();\n50   t3.join();\n51   t4.join();\n52 \n53   const std::chrono::duration<double>\
  \ dur= \n54         std::chrono::system_clock::now() - sta;\n55 \n56   std::cout\
  \ << \"Time for addition \" << dur.count() \n57             << \" seconds\" << std::endl;\n\
  58   std::cout << \"Result: \" << sum << std::endl;\n59 \n60   std::cout << std::endl;\n\
  61 \n62 }\n```\n\n使用线程本地数据进行最小同步的向量求和\n\n我在第 18 行声明了线程本地变量 `tmpSum`，并在第 23 行和 25\
  \ 行将其进行加法。\n\n以下是使用线程本地数据的性能数据。\n\n![在 Linux 上使用线程本地变量求和](img/CaseStudies----threadLocalSummation.png)\n\
  Linux 上使用线程本地变量求和\n\n![在 Windows 上使用线程本地变量求和](img/CaseStudies----threadLocalSummation_win.png)\n\
  Windows 上使用线程本地变量求和\n\n在最后一个场景中，我使用了任务（tasks）。\n\n### 使用任务\n\n使用任务，我们可以在不需要显式同步的情况下完成整个工作。每个部分求和都在单独线程中执行，最终求和在\
  \ `main` 线程中进行。这里是程序：\n\n```cpp\n1 // tasksSummation.cpp\n2 \n3 #include <chrono>\n\
  4 #include <future>\n5 #include <iostream>\n6 #include <random>\n7 #include <thread>\n\
  8 #include <utility>\n9 #include <vector>\n10 \n11 constexpr long long size = 100000000;\
  \   \n12 \n13 constexpr long long fir =  25000000;\n14 constexpr long long sec =\
  \  50000000;\n15 constexpr long long thi =  75000000;\n16 constexpr long long fou\
  \ = 100000000;\n17 \n18 void sumUp(std::promise<unsigned long long>&& prom, const\
  \ std::vector<int>& val, \n19            unsigned long long beg, unsigned long long\
  \ end){\n20     unsigned long long sum{};\n21     for (auto i = beg; i < end; ++i){\n\
  22         sum += val[i];\n23     }\n24     prom.set_value(sum);\n25 }\n26 \n27\
  \ int main(){\n28 \n29   std::cout << std::endl;\n30 \n31   std::vector<int> randValues;\n\
  32   randValues.reserve(size);\n33 \n34   std::mt19937 engine;\n35   std::uniform_int_distribution<>\
  \ uniformDist(1, 10);\n36   for (long long i = 0; i < size; ++i) \n37       randValues.push_back(uniformDist(engine));\n\
  38 \n39   std::promise<unsigned long long> prom1;\n40   std::promise<unsigned long\
  \ long> prom2;\n41   std::promise<unsigned long long> prom3;\n42   std::promise<unsigned\
  \ long long> prom4;\n43 \n44   auto fut1 = prom1.get_future();\n45   auto fut2 =\
  \ prom2.get_future();\n46   auto fut3 = prom3.get_future();\n47   auto fut4 = prom4.get_future();\n\
  48 \n49   const auto sta = std::chrono::system_clock::now();\n50 \n51   std::thread\
  \ t1(sumUp, std::move(prom1), std::ref(randValues), 0, fir);\n52   std::thread t2(sumUp,\
  \ std::move(prom2), std::ref(randValues), fir, sec);\n53   std::thread t3(sumUp,\
  \ std::move(prom3), std::ref(randValues), sec, thi);\n54   std::thread t4(sumUp,\
  \ std::move(prom4), std::ref(randValues), thi, fou);\n55 \n56   auto sum = fut1.get()\
  \ + fut2.get() + fut3.get() + fut4.get();\n57 \n58   std::chrono::duration<double>\
  \ dur = std::chrono::system_clock::now() - sta;\n59   std::cout << \"Time for addition\
  \ \" << dur.count() \n60             << \" seconds\" << std::endl;\n61   std::cout\
  \ << \"Result: \" << sum << std::endl;\n62 \n63   t1.join();\n64   t2.join();\n\
  65   t3.join();\n66   t4.join();\n67 \n68   std::cout << std::endl;\n69 }\n```\n\
  \n使用任务进行最小同步的向量求和\n\n我在第 39-47 行定义了四个 `promise` 以及相关的 `future`。在第 51-54 行，每个 `promise`\
  \ 都被移动到它的线程中。`promise` 只能移动不能拷贝。线程执行 `sumUp` 函数（第 18-25 行）。`sumUp` 的第一个参数是右值引用 `promise`。`futures`\
  \ 在第 56 行通过阻塞的 `get` 调用请求求和结果。\n\n![在 Linux 上使用局部变量求和](img/CaseStudies----tasksSummation.png)\n\
  Linux 上使用局部变量求和\n\n![在 Windows 上使用局部变量求和](img/CaseStudies----tasksSummation_win.png)\n\
  Windows 上使用局部变量求和\n\n为了结束本节，这里是所有性能数据的概述。\n\n### 线程本地求和的所有数据\n\n使用局部变量或任务来计算部分求和，或者使用原子操作等各种同步机制，并没有很大区别。只有线程本地数据似乎会让程序运行慢一点点。这一观察适用于\
  \ Linux 和 Windows。不要对 Linux 相对于 Windows 的更高性能感到惊讶。该程序是针对 4 核优化的，而我的 Windows 笔记本只有两个核心。单位是秒。\n\
  \n所有线程本地求和的性能\n\n| 操作系统 (编译器) | `std::lock_guard` | 使用顺序一致性的原子操作 | 使用松弛语义的原子操作 |\
  \ 线程本地数据 | 任务 |\n| --- | --- | --- | --- | --- | --- |\n| Linux (GCC) | 0.03 | 0.03\
  \ | 0.03 | 0.04 | 0.03 |\n| Windows (cl.exe) | 0.10 | 0.10 | 0.10 | 0.20 | 0.10\
  \ |\n\n\n\n\n我想请大家关注一个非常迷人的点。向量线程本地多线程求和的速度大约是单线程求和的两倍。在理想情况下，我预期性能会有四倍的提升，因为线程之间几乎不需要同步。原因究竟是什么？\n\
  \n# 向量求加：结论\n\n## 单线程\n基于范围的 `for` 循环和 STL 算法 `std::accumulate` 处于同一性能范围内。在优化版本中，编译器在求加用例中使用了优化的向量化\
  \ [SIMD](https://en.wikipedia.org/wiki/SIMD) 指令（`SSE` 或 `AVX`）。因此，循环计数器每次增加 4（`SSE`）或\
  \ 8（`AVX`）。\n\n## 使用共享变量的多线程\n使用共享变量作为求加变量说明了一个点：同步是非常昂贵的，应该尽可能避免。虽尽管我使用了原子变量，甚至打破了顺序一致性，但这四个线程的速度仍然比单线程慢了\
  \ 100 倍。从性能角度来看，最小化昂贵的同步必须是我们的首要目标。\n\n## 线程本地求加\n线程本地求加的速度仅比单线程基于范围的 `for` 循环或\
  \ `std::accumulate` 快两倍。尽管四个线程都可以独立工作，事实依然如此。这让我很惊讶，因为我原以为会有近四倍的提升。更令我惊讶的是，我的四个核心并没有被充分利用。\n\
  \n![四个核心的利用率](img/CaseStudies----threadUtilization.png)\n四个核心的利用率\n\n原因很简单：核心从内存获取数据的速度不够快。执行过程是[内存受限的](https://en.wikipedia.org/wiki/Memory_bound_function)。或者换句话说，内存拖慢了核心。下面的图片显示了内存瓶颈。\n\
  \n![内存瓶颈](img/CaseStudies----MemoryArchitecture.png)\n内存瓶颈\n\n[Roofline 模型](https://en.wikipedia.org/wiki/Roofline_model)\
  \ 是一种直观的性能模型，用于为运行在多核或许多核架构上的应用程序提供性能估算。该模型取决于架构的峰值性能、峰值带宽和算术强度。\n\n### 单例的线程安全初始化\n\
  \n在开始这个案例研究之前，请让我强调一下：我不提倡使用单例模式。因此，让我带着一个警告开始本章——关于单例的线程安全初始化。\n\n我想通过一个短小的插曲开始对单例线程安全初始化的讨论。\n\
  \n## 双重检查锁定模式\n[双重检查锁定](http://www.cs.wustl.edu/~schmidt/PDF/DC-Locking.pdf) 模式是以线程安全的方式初始化单例的经典方法。听起来像是既定的最佳实践或某种模式，但它更是一种[反模式](https://en.wikipedia.org/wiki/Anti-pattern)。它假设了传统实现中的某些保证，而\
  \ Java、C# 或 C++ 内存模型已经不再提供这些保证。错误的假设是单例的创建是一个原子操作；因此，看似是线程安全的解决方案并不是线程安全的。\n\n什么是双重检查锁定模式？实现线程安全单例的第一种思想是用锁来保护单例的初始化。\n\
  \n```cpp\n 1 std::mutex myMutex;\n 2 \n 3 class MySingleton{\n 4 public:  \n 5 \
  \  static MySingleton& getInstance(){    \n 6     std::lock_guard<mutex> myLock(myMutex);\
  \      \n 7     if(!instance) instance = new MySingleton();    \n 8     return *instance;\
  \  \n 9   }\n10 private:  \n11   MySingleton() = default; \n12   ~MySingleton()\
  \ = default;\n13   MySingleton(const MySingleton&) = delete;  \n14   MySingleton&\
  \ operator= (const MySingleton&) = delete;\n15   static MySingleton* instance;\n\
  16 };\n17 \n18 MySingleton* MySingleton::instance = nullptr;\n```\n使用锁的线程安全初始化\n\
  \n有问题吗？有，也没有。有，是因为存在相当大的性能代价。没有，是因为该实现是线程安全的。重量级锁保护了第 7 行中对单例的每次访问。这也适用于读取访问，而在\
  \ `MySingleton` 初始构造之后，这种访问是不必要的。这时，双重检查锁定模式救了了场。让我们来看下 `getInstance` 函数。\n\n```cpp\n\
  1 static MySingleton& getInstance(){    \n2   if (!instance){                  \
  \                 // 检查\n3     lock_guard<mutex> myLock(myMutex);              //\
  \ 加锁\n4     if(!instance) instance = new MySingleton();     // 检查\n5   } \n6   return\
  \ *instance; \n7 }\n```\n双重检查锁定模式\n\n我没有使用重量级锁，而是在第 2 行使用轻量级的指针比较。如果获取到空指针，我会在单例上应用重量级锁（第\
  \ 3 行）。因为在第 2 行的指针比较和第 3 行的加锁调用之间，另一个另一个线程初始化单例，所以我必须在第 4 行执行额外的指针比较。所以这个名字显而易见：两次检查，一次加锁。\n\
  \n聪明吗？是的。线程安全吗？不是。\n\n问题在哪里？第 4 行的调用 `instance= new MySingleton()` 包含至少三个步骤\n\n\
  1. 为 `MySingleton` 分配内存\n2. 初始化 `MySingleton` 对象\n3. 让 `instance` 指向完全初始化的 `MySingleton`\
  \ 对象\n\n问题在于 C++ 运行时并不保证步骤按此顺序执行。例如，处理器可能会将步骤重排为 1、3、2。因此，在第一步中，分配了内存；而在第二步中，`instance`\
  \ 指向了一个未初始化的单例。如果恰好在此时另一个线程 `t2` 尝试访问单例并进行指针比较，比较成功了。结果是 `t2` 指向了一个未初始化的单例，程序的行为是未定义的。\n\
  \n## 性能测量\n我想测量访问单例的开销。为了基准计时，我顺序地访问单例 4000 万次。当然，第一次访问初始化了单例对象。相比之下，四个线程的访问是并发的。我只对性能数字感兴趣，因此汇总了四个线程的执行时间。我使用块作用域的静态变量（Meyers\
  \ 单例）、锁 `std::lock_guard`、`std::call_once` 函数结合 `std::once_flag`以及结合具有顺序一致性和获取释放语义的原子操作来进行测量。\n\
  \n## Linux (GCC) 与 Windows (cl.exe) 结果对比\n程序运行在两台 PC 上。我带有 GCC 编译器的 Linux PC 有四个核心，而带有\
  \ cl.exe 编译器的 Windows PC 有两个核心。我使用最高优化级别编译程序。请参考本章开的我的设置详情。\n\n我想回答两个问题：\n\n1. 各种单例实现的性能数字是多少？\n\
  2. Linux (GCC) 和 Windows (cl.exe) 之间是否存在显著差异？\n\n最后，我将所有数字汇总成表。\n\n在展示各种多线程实现的性能数字之前，这里是顺序执行程序。`getInstance`\
  \ 方法在 C++03 标准下不是线程安全的。\n\n\n\n\n```\n 1 // singletonSingleThreaded.cpp\n 2 \n 3\
  \ #include <chrono>\n 4 #include <iostream>\n 5 \n 6 constexpr auto tenMill = 10000000;\n\
  \ 7 \n 8 class MySingleton{\n 9 public:\n10   static MySingleton& getInstance(){\n\
  11     static MySingleton instance;\n12     volatile int dummy{};\n13     return\
  \ instance;\n14   }\n15 private:\n16   MySingleton() = default;\n17   ~MySingleton()\
  \ = default;\n18   MySingleton(const MySingleton&) = delete;\n19   MySingleton&\
  \ operator=(const MySingleton&) = delete;\n20   \n21 };\n22 \n23 int main(){\n24\
  \     \n25   constexpr auto fourtyMill = 4 * tenMill;\n26 \n27   const auto begin=\
  \ std::chrono::system_clock::now();\n28 \n29   for ( size_t i = 0; i <= fourtyMill;\
  \ ++i){\n30     MySingleton::getInstance();\n31   }\n32 \n33   const auto end =\
  \ std::chrono::system_clock::now() - begin;\n34 \n35   std::cout << std::chrono::duration<double>(end).count()\
  \ << std::endl;\n36 \n37 }\n```\n\n# 单线程单例实现\n\n作为参考实现，我使用了所谓的 Meyers 单例，它以 [Scott\
  \ Meyers](https://en.wikipedia.org/wiki/Scott_Meyers) 的名字命名。这种实现的优雅之处在于，第 11 行的单例对象是一个具有块作用域的静态变量；因此，`instance`\
  \ 只初始化一次。初始化发生在第一次执行静态方法 `getInstance`（第 10 - 14 行）时。\n\n以下是单线程用例的参考数据值。\n\n![Meyers\
  \ Singelton on Linux (single theaded)](img/CaseStudies----singletonSingleThreaded_opt.png)\n\
  \nLinux 上的 Meyers 单例（单线程）\n\n![Meyers Singleton on Windows (single theaded)](img/CaseStudies----singletonSingleThreaded_win_opt.png)\n\
  \nWindows 上的 Meyers 单例（单线程）\n\nMeyers 单例的魅力在于它在 C++11 中变得线程安全。\n\n## 安全的 Meyers\
  \ 单例\n\nC++11 标准保证具有块作用域的静态变量以线程安全的方式初始化。Meyers 单例使用了块作用域的静态变量，所以我们已经完成了。剩下的工作是为多线程用例重写之前使用的经典\
  \ Meyers 单例。\n\n```\n 1 // singletonMeyers.cpp\n 2 \n 3 #include <chrono>\n 4 #include\
  \ <iostream>\n 5 #include <future>\n 6 \n 7 constexpr auto tenMill = 10000000;\n\
  \ 8 \n 9 class MySingleton{\n10 public:\n11   static MySingleton& getInstance(){\n\
  12     static MySingleton instance;\n13     volatile int dummy{};\n14     return\
  \ instance;\n15   }\n16 private:\n17   MySingleton() = default;\n18   ~MySingleton()\
  \ = default;\n19   MySingleton(const MySingleton&) = delete;\n20   MySingleton&\
  \ operator=(const MySingleton&) = delete;\n21 \n22 };\n23 \n24 std::chrono::duration<double>\
  \ getTime(){\n25 \n26   auto begin = std::chrono::system_clock::now();\n27   for(size_t\
  \ i = 0; i <= tenMill; ++i){\n28       MySingleton::getInstance();\n29   }\n30 \
  \  return std::chrono::system_clock::now() - begin;\n31 \n32 };\n33 \n34 int main(){\n\
  35 \n36     auto fut1= std::async(std::launch::async, getTime);\n37     auto fut2=\
  \ std::async(std::launch::async, getTime);\n38     auto fut3= std::async(std::launch::async,\
  \ getTime);\n39     auto fut4= std::async(std::launch::async, getTime);\n40 \n41\
  \     const auto total= fut1.get() + fut2.get() + fut3.get() + fut4.get();\n42 \n\
  43     std::cout << total.count() << std::endl;\n44 \n45 }\n```\n\n多线程用例中的 Meyers-单例\n\
  \n我在函数 `getTime` 中使用了该单例对象（第 24 - 32 行）。该函数由第 36 - 39 行的四个 promise 执行。关联的 future\
  \ 结果在第 41 行相加。就这些了。只缺少执行时间。\n\n![Meyers Singleton on Linux (multi threaded)](img/CaseStudies----singletonMeyers_opt.png)\n\
  \nLinux 上的 Meyers 单例（多线程）\n\n![Meyers Singleton on Windows (multi threaded)](img/CaseStudies----singletonMeyers_win_opt.png)\n\
  \nWindows 上的 Meyers 单例（多线程）\n\n让我们来看看最显而易见的一种：使用锁。\n\n## `std::lock_guard`\n\n`std::lock_guard`\
  \ 保证了单例的初始化是线程安全的。\n\n```\n 1 // singletonLock.cpp\n 2 \n 3 #include <chrono>\n\
  \ 4 #include <iostream>\n 5 #include <future>\n 6 #include <mutex>\n 7 \n 8 constexpr\
  \ auto tenMill = 10000000;\n 9 \n10 std::mutex myMutex;\n11 \n12 class MySingleton{\n\
  13 public:\n14   static MySingleton& getInstance(){\n15     std::lock_guard<std::mutex>\
  \ myLock(myMutex);\n16     if (!instance){\n17         instance= new MySingleton();\n\
  18     }\n19     volatile int dummy{};\n20     return *instance;\n21   }\n22 private:\n\
  23   MySingleton() = default;\n24   ~MySingleton() = default;\n25   MySingleton(const\
  \ MySingleton&) = delete;\n26   MySingleton& operator=(const MySingleton&) = delete;\n\
  27 \n28   static MySingleton* instance;\n29 };\n30 \n31 MySingleton* MySingleton::instance\
  \ = nullptr;\n32 \n33 ...\n```\n\n使用锁的线程安全单例\n\n你可能已经猜到这种方法很慢。\n\n![Multi-threaded\
  \ singleton on Linux using a lock](img/CaseStudies----singletonLock_opt.png)\n\n\
  使用锁的 Linux 多线程单例\n\n![Multi-threaded singleton on Windows using a lock](img/CaseStudies----singletonLock_win_opt.png)\n\
  \n使用锁的 Windows 多线程单例\n\n单安全的下一个版本也是基于多线程库的：它使用了 `std::call_once`。\n\n### `std::call_once`\
  \ 与 `std::once_flag`\n\n你可以将 std::call_once 与 std::once_flag 使用来注册可调用对象，以确保只有一个调用对象以线程安全的方式执行。\n\
  \n```\n 1 // singletonCallOnce.cpp\n 2 \n 3 #include <chrono>\n 4 #include <iostream>\n\
  \ 5 #include <future>\n 6 #include <mutex>\n 7 #include <thread>\n 8 \n 9 constexpr\
  \ auto tenMill = 10000000;\n10 \n11 class MySingleton{\n12 public:\n13   static\
  \ MySingleton& getInstance(){\n14     std::call_once(initInstanceFlag, &MySingleton::initSingleton);\n\
  15     volatile int dummy{};\n16     return *instance;\n17   }\n18 private:\n19\
  \   MySingleton() = default;\n20   ~MySingleton() = default;\n21   MySingleton(const\
  \ MySingleton&) = delete;\n22   MySingleton& operator=(const MySingleton&) = delete;\n\
  23 \n24   static MySingleton* instance;\n25   static std::once_flag initInstanceFlag;\n\
  26 \n27   static void initSingleton(){\n28     instance= new MySingleton;\n29  \
  \ }\n30 };\n31 \n32 MySingleton* MySingleton::instance = nullptr;\n33 std::once_flag\
  \ MySingleton::initInstanceFlag;\n34 \n35 ...\n```\n\n使用 `std::call_once` 和 `std::once_flag`\
  \ 的线程安全单例\n\n这里是性能数据。\n\n![Multi-threaded singleton on Linux using `std::call_once`\
  \ and `std::once_flag`](img/CaseStudies----singletonCallOnce_opt.png)\n\nLinux 上使用\
  \ `std::call_once` 和 `std::once_flag` 的多线程单例\n\n![Multi-threaded singleton on Windows\
  \ using `std::call_once` and `std::once_flag`](img/CaseStudies----singletonCallOnce_win_opt.png)\n\
  \nWindows 上使用 `std::call_once` 和 `std::once_flag` 的多线程单例\n\n## 原子变量\n\n使用原子变量，我的实现变得更有挑战性。我甚至可以为我的原子操作指定内存排序。以下两种线程安全的单例实现基于之前提到的双检查锁定模式。\n\
  \n#### 顺序一致性\n\n在我的第一个实现中，我使用了原子操作但没有显式指定内存排序；因此适用顺序一致性。\n\n\n\n\n\n```\n 1 // singletonSequentialConsistency.cpp\n\
  \ 2 \n3 #include <atomic>\n 4 #include <iostream>\n 5 #include <future>\n 6 #include\
  \ <mutex>\n 7 #include <thread>\n 8 \n9 constexpr auto tenMill = 10000000;\n10 \n\
  11 class MySingleton{\n12 public:\n13   static MySingleton* getInstance(){\n14 \
  \    MySingleton* sin = instance.load();\n15     if (!sin){\n16       std::lock_guard<std::mutex>\
  \ myLock(myMutex);\n17       sin = instance.load(std::memory_order_relaxed);\n18\
  \       if(!sin){\n19         sin= new MySingleton();\n20         instance.store(sin);\n\
  21       }\n22     }\n23     volatile int dummy{};\n24     return sin;\n25   }\n\
  26 private:\n27   MySingleton() = default;\n28   ~MySingleton() = default;\n29 \
  \  MySingleton(const MySingleton&) = delete;\n30   MySingleton& operator=(const\
  \ MySingleton&) = delete;\n31 \n32   static std::atomic<MySingleton*> instance;\n\
  33   static std::mutex myMutex;\n34 };\n35 \n36 \n37 std::atomic<MySingleton*> MySingleton::instance;\n\
  38 std::mutex MySingleton::myMutex;\n39 \n40 ...\n```\n\n# 使用具有顺序一致性的原子操作线程安全的单例\n\
  \n与双重检查锁定（double-checked locking）模式不同，我现在可以了第 19 行的表达式 `sin= new MySingleton()`\
  \ 发生在第 20 行的存储表达式 `instance.store(sin)` 之前。这是因为原子操作默认使用的内存顺序是顺序性（sequential consistency）。查看第\
  \ 17 行：`sin = instance.load(std::memory_order_relaxed)`。这个额外的加载是必要的，因为在第 14 行的第一次加载和第\
  \ 16 行的锁的使用之间，另一个线程可能会介入并改变 `instance` 的值。\n\n![Linux 上使用原子的多线程单例](img/CaseStudies----singletonSequentialConsistency_opt.png)\n\
  \nLinux 上使用原子的多线程单例\n\n![Windows 上使用原子的多线程单例](img/CaseStudies----singletonSequentialConsistency_win_opt.png)\n\
  \nWindows 上使用原子的多线程单例\n\n我们可以进一步优化程序。\n\n## 获取-释放语义 (Acquire-release semantic)\n\
  \n让我们仔细观察之前使用原子操作实现的线程安全的单例模式。第 14 行中对单例的加载（或读取）是一个获取（acquire）操作，第 20 行的存储（或写入）是一个释放（release）操作。这两个操作都发生在同一个原子变量上。因此，顺序一致性是多余的。C++11\
  \ 标准保证释放操作与同一个原子变量上的获取操作同步，并建立了一个顺序限制。这意味着所有之前的读写操作都不能移动到释放操作之后，且所有随后的读写操作都不能移动到获取操作之前。\n\
  \n这些是实现线程安全的单例所需的最小保证。\n\n```\n 1 // singletonAcquireRelease.cpp\n 2 \n3 #include\
  \ <atomic>\n 4 #include <iostream>\n 5 #include <future>\n 6 #include <mutex>\n\
  \ 7 #include <thread>\n 8 \n9 constexpr auto tenMill = 10000000;\n10 \n11 class\
  \ MySingleton{\n12 public:\n13   static MySingleton* getInstance(){\n14     MySingleton*\
  \ sin = instance.load(std::memory_order_acquire);\n15     if (!sin){\n16       std::lock_guard<std::mutex>\
  \ myLock(myMutex);\n17       sin = instance.load(std::memory_order_relaxed);\n18\
  \       if(!sin){\n19         sin = new MySingleton();\n20         instance.store(sin,\
  \ std::memory_order_release);\n21       }\n22     }   \n23     volatile int dummy{};\n\
  24     return sin;\n25   }\n26 private:\n27   MySingleton() = default;\n28   ~MySingleton()\
  \ = default;\n29   MySingleton(const MySingleton&) = delete;\n30   MySingleton&\
  \ operator=(const MySingleton&) = delete;\n31 \n32   static std::atomic<MySingleton*>\
  \ instance;\n33   std::mutex myMutex;\n34 };\n35 \n36 \n37 std::atomic<MySingleton*>\
  \ MySingleton::instance;\n38 std::mutex MySingleton::myMutex;\n39 \n40 ...\n```\n\
  \n使用获取-释放语义原子操作线程安全的单例\n\n获取-释放语义的性能与顺序一致性相似。\n\n![Linux 上使用原子的多线程单例](img/CaseStudies----singletonAcquireRelease_opt.png)\n\
  \nLinux 上使用原子的多线程单例\n\n![Windows 上使用原子的多线程单例](img/CaseStudies----singletonAcquireRelease_win_opt.png)\n\
  \nWindows 上使用原子的多线程单例\n\n这并不意外，因为在 x86 架构上，两种内存顺序非常相似。在 [ARMv7](https://en.wikipedia.org/wiki/ARMv7)\
  \ 上，我们可能会看到更明显的性能差异。\n\n## 所有实现的性能\n\n[PowerPC](https://en.wikipedia.org/wiki/PowerPC)\
  \ 架构在性能数据上可能会有更显著的差异。\n\n| 操作系统 | 双重检查 | 顺序一致性 | 获取-释放 |\n| --- | --- | --- | ---\
  \ |\n| Linux (GCC) | 0.03 | 0.04 | 0.03 |\n| Windows (cl) | 0.02 | 0.03 | 0.02 |\n\
  \n## 实现线程安全的单例的性能\n\n我想强调的是，这些是实现线程安全的单例所需的最小保证。\n\n实现线程安全的单例的性能\n\n我想强调的是，这些是实现线程安全的单例所需的最小保证。\n\
  \n我也列出了所有 `x` 和 `y` 的可能值，如下表所示。这些这些的。\n\n### 使用 CppMem 进行持续优化\n\n我从一个小程序开始并逐步进行改进。[CppMem](http://svr-pes20-cppmem.cam.ac.uk/)\
  \ 是一个用于探索代码片段的交互工具。首先，这里是小程序：\n\n```\n 1 // ongoingOptimisation.cpp\n 2 \n3 #include\
  \ <iostream>\n 4 #include <thread>\n 5 \n6 int x = 0;\n7 int y = 0;\n8 \n9 void\
  \ writing(){\n10   x = 2000;\n11   y = 11;\n12 }\n13 \n14 void reading(){ \n15 \
  \  std::cout << \"y: \" << y << \" \";\n16   std::cout << \"x: \" << x << std::endl;\n\
  17 }\n18 \n19 int main(){\n20   std::thread thread1(writing);\n21   std::thread\
  \ thread2(reading);\n22   thread1.join();\n23   thread2.join();\n24 }\n```\n\n持续优化的参考程序\n\
  \n在持续优化过程中，我有两个问题：\n\n1. 程序是良好的吗？特别是是否存在数据竞态（data-race）？\n2. `x` 和 `y` 的哪些值是可能的？\n\
  \n第一个问题通常很难回答。在第一步中，我对第一个问题的答案进行思考，在第二步中，我使用 CMem 验证我的推理。一旦回答了第一个问题，第二个答案就可以从第一个答案中很容易得出。我也在表格中列出了所有\
  \ `x` 和 `y` 的可能值。\n\n![参考程序](img/CaseStudies----ongoingOptimisation.png)\n\n参考程序\n\
  \n这个程序非常简单。它由两个线程 `thread1` 和 `thread2` 组成`thread1` 写入 `x` 和 `y`。`thread2` 按照相反顺序读取\
  \ `x` 和 `y`。这个想法听起来很直接，但即使在这个简单的程序中，我们也得到了三种不同的结果：\n\n\n\n\n# 易变变量 (Volatile variables)\n\
  \n在我开始持续优化过程之前，你应该对 CppMem 有基本的了解。CppMem 章节为你提供了一个简要介绍。\n\n## CppMem：非原子变量\n\n点击运行按钮会显示存在数据竞态（data\
  \ race）。准确地说，它有两个数据竞态。变量 `x` 和变量 `y` 的访问都没有受到保护。结果是程序具有未定义行为（undefined behaviour）。在\
  \ C++ 术语中，这意味着程序具有所谓的“着火语义”（catch fire semantic）；因此，所有结果都是可能的。你的电脑 甚至会着火。\n\n所以，我们无法确定\
  \ `x` 和 `y` 的值。\n\n这些是我对 `int` 的思考。现在我们应该看看 CppMem 是如何报告程序的未定义行为的。\n\nCppMem 允许我将程序简化到极简。\n\
  \n```cpp\n 1 int main() {\n 2   int x = 0; \n 3   int y = 0;\n 4   {{{ { \n 5  \
  \       x = 2000; \n 6         y = 11;\n 7       }\n 8   ||| {\n 9         y;\n\
  10         x;\n11       }  \n12   }}}\n13 }\n```\n\n### CppMem：未同步访问\n\n你可以在 CppMem\
  \ 中通过大括号（第 4 行和第 12 行）和管道符号（第 8 行）来定义一个线程。第 4 行和第 7 行（或第 8 行和第 11 行）中的额外大括号定义了线程的工作包。因为我对变量\
  \ `x` 和 `y` 的输出感兴趣，所以我只在第 9 行和第 10 行中读取了它们。\n\n以上是 CppMem 的理论部分，现在来看实践。\n\n### 分析\n\
  \n当我执行程序时，CppMem 报错（1）（红色显示），指出四种可能的线程交错执行之一不是无竞态的。只有第一次执行是一致的。现在我可以使用 CppMem 在四种执行之间切换（2），并分析带注释的图（3）。\n\
  \n![非原子变量的数据竞态](img/CaseStudies----FullExection.png)\n\n非原子变量的数据竞态\n\n通过分析各种图表，你可以充分利用\
  \ CppMem。\n\n#### 第一次执行\n\n我们可以从以下图表中得出什么结论？\n\n![第一次执行](img/CaseStudies----first.png)\n\
  \n第一次执行\n\n图中的节点表示程序的表达式，边表示表达式之间的关系。在我的解释中，我引用了名称 (a) 到 (f)。从此图的注释中得出什么结论？\n\n\
  *   `a:Wna x = 0`：第一个表达式 (a)，它是对 `x` 的非原子写入。\n*   `sb` (顺序优先 sequenced-before)：第一个表达式\
  \ (a) 的写入发生在第二个表达式 (b) 的写入之前。这些关系也存在于 (c) 与 (d)、以及 (e) 与 (f) 之间。\n*   `rf` (读取 read\
  \ from)：表达式 (e) 从表达式 (b) 读取 `y` 的值。相应地，(f) 从 (a) 读取。\n*   `sw` (同步 synchronizes-with)：表达式\
  \ (a) 与 (f) 同步。这种关系的建立是因为表达式 (f) 发生在单独线程中。创建线程是一个同步点。线程创建之前发生的一切在线程中都是可见的。出于对称性，(b)\
  \ 和 (e) 之间也存在这种情况。\n*   `dr` (数据竞态 data race)：这里在变量 `x` 和 `y` 的读写之间存在数据竞态。程序具有未定义行为。\n\
  \n接三次执行是不一致的。\n\n#### 第二次执行\n\n![第二次执行](img/CaseStudies----second.png)\n\n第二次执行\n\
  \n在这次不一致的执行中，表达式 (e) 从表达式 (d) 读取 `y` 值。(d) 的写入与 (e) 的读取并发发生。\n\n#### 第三次执行\n\n![第三次执行](img/CaseStudies----third.png)\n\
  \n第三次执行\n\n这次执行与上一次执行是对称的。表达式 (f) 同时从 (c) 读取。\n\n#### 第四次执行\n\n![第四次执行](img/CaseStudies----four.png)\n\
  \n第四次执行\n\n现在一切都错了。表达式 (e) 和 (f) 同时从表达式 (d) 和 (c) 读取。\n\n#### 短要结论\n\n尽管我只使用了 CppMem\
  \ 的默认配置，但我获得了很多价值信息和见解。特别是，CppMem 图表显示：\n\n*   `x` 和 `y` 的所有种组合都是可能的：(0,0), (11,0),\
  \ (0,2000) 和 (11,2000)。\n*   程序至少有一个数据竞态，因此具有未定义行为。\n*   四种可能的执行中只有一个是一致的。\n\n示例中对\
  \ `x` 和 `y` 的访问没有同步，我们得到了数据竞态；因此产生了未定义行为。同步最明显的方法是使用锁。\n\n### CppMem：锁\n\n两个线程 `thread1`\
  \ 和 `thread2` 使用同一个互斥锁，封装在 `std::lock_guard` 中。\n\n```cpp\n 1 // ongoingOptimisationLock.cpp\n\
  \ 2 \n 3 #include <iostream>\n 4 #include <mutex>\n 5 #include <thread>\n 6 \n 7\
  \ std::atomic<int> x{0};\n 8 std::atomic<int> y{0};\n 9 \n10 std::mutex mut;\n 11\
  \ \n 12 void writing(){\n 13   std::lock_guard<std::mutex> lock(mut);\n 14   x =\
  \ 2000;\n 15   y = 11;\n 16 }\n 17 \n 18 void reading(){\n 19   std::lock_guard<std::mutex>\
  \ lock(mut);\n 20   std::cout << \"y: \" << y.load() << \" \";\n 21   std::cout\
  \ << \"x: \" << x.load() << std::endl;\n 22 }\n 23 \n 24 int main(){\n 25   std::thread\
  \ thread1(writing);\n 26   std::thread thread2(reading);\n 27   thread1.join();\n\
  \ 28   thread2.join();\n 29 };\n```\n（注：提示中锁部分的代码块不完整，我根据文本逻辑进行了格式化）。\n\n\n\n\n\
  让我用 CppMem 来验证我的推理。\n\n## CppMem\n\n以下是 CppMem 中对应的程序。\n\n```cpp\n 1 int main(){\n\
  \ 2   atomic_int x = 0; \n 3   atomic_int y = 0;\n 4   {{{ { \n 5         x.store(2000,\
  \ memory_order_relaxed);\n 6         y.store(11, memory_order_release);\n 7    \
  \   }\n 8   ||| {\n 9         y.load(memory_order_acquire);\n10         x.load(memory_order_relaxed);\n\
  11       } \n12   }}}\n13 }\n```\n\n**CppMem: 原子操作（顺序一致性）**\n\n首先，简单介绍语法。CppMem\
