  # 电话簿上的共享锁\n\n你不应该将 `Linux(GCC)` 的性能与 `Windows(cl.exe)` 的性能进行比较，因为底层的计算机是不可比拟的。相反，你应该在在两个平台上比较互斥锁与共享锁的相对性能。这些数据非常惊惊讶。\n\
  \n## Linux (GCC)\n\n###### 互斥锁\n\n![初始的电话簿](img/DataStructures----exclusiveLockingTelebookLinux.png)\n\
  \n初始电话簿\n\n### 共享锁\n\n![初始的电话簿](img/DataStructures----sharedLockingTelebookLinux.png)\n\
  \n初始电话簿\n\n在 Linux 上，互斥锁比共享锁慢约 15%。这个差异低于我的预期，因为读写比例为 100 比 1。\n\n## Windows (cl.exe)\n\
  \n###### 互斥锁\n\n![初始的电话簿](img/DataStructures----exclusiveLockingTelebookWindows.png)\n\
  \n初始电话簿\n\n### 共享锁\n\n![初始的电话簿](img/DataStructures----sharedLockingTelebookWindows.png)\n\
  \n初始电话簿\n\n老实说，Windows 的数据让我很惊讶，因为 Windows 上的共享锁比互斥锁慢两倍。似乎同时使用 `std::shared_lock`、`std::lock_guard`\
  \ 和 `std::shared_time_mutex` 是一项重量级操作，以至于共享反而得不偿失。\n\n## 避免漏洞\n\n不要将你数据结构的内部实现传递给客户端。内部实现可以通过引用或指针传递到外部世界。向数据结构传递任意调用对象会打开一个漏洞，这种漏洞很难被发现。\n\
  \n```cpp\n 1 // lockDouble.cpp\n 2 \n 3 #include <future>\n 4 #include <iostream>\n\
  \ 5 #include <mutex>\n 6 \n 7 class LockDouble{\n 8     public:\n 9         double\
  \ get() const {\n10             std::lock_guard<std::mutex> lockDoubGuard(lockDoubMutex);\n\
  11             return lockDoub;\n12         }\n13     \n14         void set(double\
  \ val) {\n15             std::lock_guard<std::mutex> lockDoubGuard(lockDoubMutex);\n\
  16             lockDoub = val;\n17         }\n18     \n19         template <typename\
  \ Func>\n20         void apply(Func func){\n21             std::lock_guard<std::mutex>\
  \ lockDoubGuard(lockDoubMutex);\n22             func(lockDoub);\n23         }\n\
  24     \n25 \n26     private:\n27         double lockDoub{};\n28         mutable\
  \ std::mutex lockDoubMutex;\n29     \n30 };\n31 \n32 int main(){\n33     \n34  \
  \   LockDouble lck1;\n35     \n36     auto fut1 = std::async([&lck1]{ lck1.set(20.11);\
  \ });\n37     auto fut2 = std::async([&lck1]{ std::cout << lck1.get() << std::endl;\
  \ });\n38     \n39     double* loophole = nullptr;\n40     lck1.apply(&loophole\
  \ mutable { loophole = &d; });\n41     *loophole = 11.22;\n42     \n43     auto\
  \ fut3 = std::async([&lck1]{ std::cout << lck1.get() << std::endl; });\n44     \n\
  45 }\n```\n\n### 接口中的漏洞\n\n`LockDouble` 类拥有清晰的接口。对变量 `lockDouble` 的每次访问都由放入 `std::lock_guard`\
  \ 中的同一个互斥锁 `lockDoubMutex` 保护。`get` 方法返回一个副本，而不是 `lockDouble` 的非 const 引用。如果 `get`\
  \ 方法返回的是 `lockDouble` 的非 const 引用，客户端可以在不持有锁的情况下修改内部状态。\n\n\n\n\n# Windows 上的显式求和\n\
  \n### 带同步的单线程求和 (lock)\n\n相比之下，带有额外同步的范围 for 循环。我只展示与非同步版本相比的代码差异。\n\n```cpp\n//\
  \ calculateWithLock.cpp\n\n...\n\nstd::mutex myMutex;\n\nfor (auto i: randValues){\n\
  \  std::lock_guard<std::mutex> myLockGuard(myMutex);\n  sum += i;\n}\n\n...\n```\n\
  \n通过锁对求和变量对 vector 进行求和\n\n相应的，Linux 的性能数据如下\n\n![Linux 上使用锁的单线程求和](img/DataStructures----CalculateWithLock.png)\n\
  \nLinux 上使用锁的单线程求和\n\n以及 Windows。\n\n![Windows 上使用锁的单线程求和](img/DataStructures----CalculateWithLock_win.PNG)\n\
  \nWindows 上使用锁的单线程求和\n\n### 比较\n\n当然，非同步版本的速度比使用锁的版本快约 50 到 150 倍。这种差异在 Linux 和\
  \ Windows 上都是如此。性能数据似乎明确反对使用锁，但你必须考虑到这是一项同步密集型任务。此外，当你只需要同步几次时，锁可能是你最佳且性能足够的版本。\n\
  \n#### 可扩展性\n\n当并发客户端数量增加或数据结构变得有界时，你的数据结构的性能特征如何？这些是你必须回答的两个问题。可扩展性意味着数据结构的客户端数量与吞吐量之间存在\
  \ 1 对 1 的关系。\n\n*   例如，当你有一个有一个生产者/消费者的线程安全队列时，每个额外的生产者或消费者都必须阻塞，直到上一个完成。这种阻塞限制对于线程安全的多生产者/多消费者队列并不适用。为了简单起见，我将第二种场景称为\
  \ n/n 关系。`n` 也可以是 1。第二种场景的问题是生产者是否可以满足所有消费者，反之亦然。如果不能，生产者或消费者必须等待，这会影响可扩展性。\n\n\
  *   当你的数据结构是一个有界线程安全队列时，你不能期望完美的可扩展性，因为生产者/消费者会在某一点上不同步调。生产者和消费者之间内部使用的缓冲区可以将它们解耦，但无法解决原始问题。\n\
  \n让我为第 并发架构 章中具体的 `ThreadSafeQueue` 回答这两个问题。\n\n```cpp\n 1 template <typename T>\n\
  \ 2 class Monitor{\n 3 public:\n 4     void lock() const {\n 5         monitMutex.lock();\n\
  \ 6     }\n 7     void unlock() const {\n 8         monitMutex.unlock();\n 9   \
  \  }\n10     \n 11     void notify_one() const noexcept {\n 12         monitCond.notify_one();\n\
  \ 13     }\n 14     void wait() const {\n 15         std::unique_lock<std::recursive_mutex>\
  \ monitLock(monitMutex);\n 16         monitCond.wait(monitLock);\n 17     }\n 18\
  \     \n 19 private:\n 20     mutable std::recursive_mutex monitMutex;\n 21    \
  \ mutable std::condition_variable_any monitCond;\n 22 };\n 23 \n 24 template <typename\
  \ T>\n 25 class ThreadSafeQueue: public Monitor<ThreadSafeQueue<T>>{\n 26 public:\n\
  \ 27     void add(T val){ \n 28         derived.lock();\n 29         myQueue.push(val);\n\
  \ 30         derived.unlock();\n 31         derived.notify_one();\n 32     } \n\
  \ 33     \n 34     T get(){ \n 35         derived.lock();\n 36         while (myQueue.empty())\
  \ derived.wait();\n 37         auto val = myQueue.front();\n 38         myQueue.pop();\n\
  \ 39         derived.unlock();\n 40         return val;\n 41     }\n 42 private:\n\
  \ 43     std::queue<T> myQueue;\n 44     ThreadSafeQueue<T>& derived = static_cast<ThreadSafeQueue<T>&>(*this);\n\
  \ 45 };\n```\n\n监控器对象 (Monitor Object)\n\n`add` 方法（第 27 行）向 `std::queue` 添加类型为 `T`\
  \ 的元素，而 `get` 方法（第 34 行）从 `std::queue` 中移除元素。`ThreadSafeQueue` 类实现了监控器对象。监控器对象设计模式同步并发方法的执行，以确保对象内一次只有一个方法在运行。当生产者完成任务时，一个消费者将通过\
  \ `std::condition_variable_any`（第 21 行）收到通知。`std::recursive_mutex`（第 20 行）保护对内部队列的修改。这个描述足以回答我们的两个问题。如果你想了解更多关于这种架构模式的知识，请阅读上一章\
  \ Monitor Object。\n\n*   显而易见，如果没有可用值，消费者可能会在第 36 行被阻塞。\n\n*   第二个问题很容易回答，因为该线程安全队列不是有界的。\n\
  \n#### 不变性 (Invariants)\n\n不变性是一个始终为的条件或关系。例如，所有账户的贷方和债务总和在任何时候都应该为 0。对于以下程序，不变性是不成立的。\n\
  \n```cpp\n// invariant.cpp\n#include <functional>\n#include <iostream>\n#include\
  \ <mutex>\n#include <numeric>\n#include <random>\n#include <thread>\n#include <vector>\n\
  #include <chrono>\n\nusing namespace std::chrono_literals;\n\ntemplate <typename\
  \ T>\nclass Monitor{\npublic:\n    void lock() const {\n        monitMutex.lock();\n\
  \    }\n    void unlock() const {\n        monitMutex.unlock();\n    }\n    \n \
  \   void notify_one() const noexcept {\n        monitCond.notify_one();\n    }\n\
  \    void wait() const {\n        std::unique_lock<std::recursive_mutex> monitLock(monitMutex);\n\
  \        monitCond.wait(monitLock);\n    }\n    \n    private:\n    mutable std::recursive_mutex\
  \ monitMutex;\n    mutable std::condition_variable_any monitCond;\n};\n\ntemplate\
  \ <typename T>\nclass ThreadSafeQueue: public Monitor<ThreadSafeQueue<T>>{\npublic:\n\
  \    void add(T val){ \n        derived.lock();\n        myQueue.push(val);\n  \
  \      derived.unlock();\n        derived.notify_one();\n    } \n    \n    T get(){\
  \ \n        derived.lock();\n        while (myQueue.empty()) derived.wait();\n \
  \       auto val = myQueue.front();\n        myQueue.pop();\n        derived.unlock();\n\
  \        return val;\n    }\nprivate:\n    std::queue<T> myQueue;\n    ThreadSafeQueue<T>&\
  \ derived = static_cast<ThreadSafeQueue<T>&>(*this);\n};\n\nint main() {\n    //\
  \ 实现逻辑\n    return 0;\n}\n```\n\n\n\n当然，将 `deposit` 和 `takeOff` 调用放入一个临界区中就能保证不变性。\n\
  \n### 异常\n\n如果发生异常，应该发生什么？这个问题的答案取决于你用于创建线程的数据结构。这里有几种可选方案：\n\n*   `std::thread`：当创建的线程抛出异常时，将调用\
  \ `std::terminate`。这意味着 `std::terminate` 会传递给`main`线程。\n*   任务：诸如 `std::async`、`std::packaged_task`。结果是默认调用了\
  \ [`std::abort`](https://en.cppreference.com/w/cpp/utility/program/abort)，导致程序非正常终止。\n\
  \n现在，是时候在实践中考虑这些问题了。通常，并发数据结构是栈和队列。\n\n### 并发栈\n\n首先：什么是栈？\n\n让我顺序实现并发栈。\n\n####\
  \ 一个简化的实现\n\n```cpp\n 1 // concurrentStackPush.cpp\n 2 \n3 #include <list>\n 4 #include\
  \ <mutex>\n 5 #include <stack>\n 6 #include <string>\n 7 #include <utility>\n 8\
  \ #include <vector>\n 9 \n10 template<typename T, template <typename, typename>\
  \ class Cont = std::deque> \n11 class ConcurrentStackPush{\n12 public:\n13     void\
  \ push(T val){\n14         std::lock_guard<std::mutex> lockStack(mutexStack);\n\
  15         myStack.push(std::move(val));\n16     }\n17     ConcurrentStackPush()\
  \ = default;\n18     ConcurrentStackPush(const ConcurrentStackPush&) = delete;\n\
  19     ConcurrentStackPush& operator= (const ConcurrentStackPush&) = delete;   \n\
  20 private:\n21     mutable std::mutex mutexStack;\n22     std::stack<T, Cont<T,\
  \ std::allocator<T>>> myStack;\n23 };\n24 \n25 int main(){\n26 \n27     ConcurrentStackPush<int>\
  \ conStack;\n28     conStack.push(5);\n29 \n30     ConcurrentStackPush<double, std::vector>\
  \ conStack2;\n31     conStack2.push(5.5);\n32 \n33     ConcurrentStackPush<std::string,\
  \ std::list> conStack3;\n34     conStack3.push(\"hello\");\n35 \n36 }\n```\n\n一个支持\
  \ push 的并发栈\n\n从并发的角度来看，类型 `ConcurrentStackPush` 支持 `push` 方法（第 13-16 行），该方法将新元素拷贝到内部的\
  \ `myStack`（第 22 行）。得于第 21 行的 `mutexStack`，拷贝操作是线程安全的。我假设你对第二个模板参数感到困惑：`template\
  \ <typename, typename> class Cont = std::deque`。第二个模板参数是所谓的模板模板参数。它的默认值是 `std::deque`。`Cont`\
  \ 是用于存放元素的容器。`Cont` 需要其参数的类型和分配器。在第 22 行中，你看到了参数 `Cont` 的用法。`Cont` 是内部 `std::stack`\
  \ 的第二个参数。第 27、30 和 33 行显示了你如何用各种容器实例化 `ConcurrentStackPush`。`conStack`（第 27 行）使用\
  \ `std::deque`。`contStack2`（第 30 行）使用 `std::vector`，而 `contStack2`（第 33 行）使用 `std::list`。\n\
  \n[`std::stack`](http://en.cppreference.com/w/cpp/container/stack) 和接下来的 [`std::queue`](http://en.cppreference.com/w/cpp/container/queue)\
  \ 是所谓的容器适配器，因为它们使用现有的容器并支持类似栈或类似队列的接口。\n\n你可能会问自己，为什么我在单线程环境中使用 `ConcurrentStackPush`，以及为什么我没有显示任何输出，这里是我的回答：仅有一个\
  \ `push` 方法太限制了。`ConcurrentStackPush` 应该只作为一个完整实现的起点。\n\n#### 一个完整的实现\n\n根据信息框栈，我的并发栈至少应该支持\
  \ `push`、`pop` 和 `top` 方法。\n\n你可能认为，直接对之前的类型 `ConcurrentStackPush` 进行扩展就可以了。\n\n\
  ```cpp\ntemplate<typename T, template <typename, typename> class Cont = std::deque>\n\
  class ConcurrentStackBroken{\npublic:\n    void push(T val){\n        std::lock_guard<std::mutex>\
  \ lockStack(mutexStack);\n        myStack.push(std::move(val));\n    }\n    void\
  \ pop(){\n        std::lock_guard<std::mutex> lockStack(mutexStack);\n        myStack.pop();\n\
  \    }\n    T& top(){\n        std::lock_guard<std::mutex> lockStack(mutexStack);\n\
  \        return myStack.top();\n    }\n    ConcurrentStackBroken() = default;\n\
  \    ConcurrentStackBroken(const ConcurrentStackBroken&) = delete;\n    ConcurrentStackBroken&\
  \ operator= (const ConcurrentStackBroken&) = delete;\nprivate:\n    mutable std::mutex\
  \ mutexStack;\n    std::stack<T, Cont<T, std::allocator<T>>> myStack;\n};\n```\n\
  \n一个错误的并发栈\n\n`ConcurrentStackBroken` 除了 `push` 方法外，还有 `pop` 和 `top`。`top` 方法返回一个引用。该引用可以用于修改元素数据竞态所示。\n\
  \n首先，`top` 方法返回一个引用。第二个更复杂。\n\n```cpp\nint main(){\n\n    ConcurrentStackBroken<int>\
  \ conStack;\n    conStack.push(5);\n\n    auto fut = std::async(std::launch::async,\
  \ [&conStack]{ conStack.top() += 5; });\n    auto fut2 = std::async(std::launch::async,\
  \ [&conStack]{ std::cout << conStack.top() << std::endl; });\n\n}\n```\n\n返回引用\n\
  \n问题在于 `top` 方法后接 `pop` 方法不是原子操作。让我们看看我的意思。\n\n```cpp\nint main(){\n\n    ConcurrentStackBroken<int>\
  \ conStack;\n    constexpr auto SENTINEL = std::numeric_limits<int>::min();\n  \
  \  conStack.push(SENTINEL);\n    conStack.push(5);\n\n    auto saveRemove = [&conStack]{\
  \ if (conStack.top() != SENTINEL) conStack.pop(); };\n\n    auto fut = std::async(std::launch::async,\
  \ saveRemove);\n    auto fut2 = std::async(std::launch::async, saveRemove);\n  \
  \  auto fut3 = std::async(std::launch::async, saveRemove);\n\n}\n```\n\n`top` 和\
  \ `pop` 不是原子的\n\n为了确保 `ConcurrentStackBroken` 在我 `pop` 之前始终有一个元素，我对其 `push` 了一个\
  \ `SENTINEL`。`SENTINEL` 是并发数据结构应该保持的不变性。lambda 函数 `saveRemove` 应用了我的协议。`saveRemove`\
  \ 中的问题是，基于对 `contStack` 有元素的错误假设，可能会发生发生 `pop` 操作。当然，三个 `std::async` 都会交织，因此可能会发生以下操作序列。`top`\
  \ 和 `pop` 操作不会交织，因为它们使用同一个互斥锁。\n\n```\nconStack.top() // 关联 `fut`\nconStack.top()\
  \ // 关联 `fut2`\nconStack.top() // 关联 `fut3`\nconStack.pop() // 关联 `fut`\nconStack.pop()\
  \ // 关联 `fut2`    // (2)\nconStack.pop() // 关联 `fut3`    // (3)\n```\n\n一种可能的交织\n\
  \n\n\n所构建的操作序列是致命的。通过调用 `(2)`，`SENTINEL` 被移除，因此破坏了不不变性。调用 `(3)` 导致了未定义行为，因为对 `std::stack`\
  \ 上的 `pop` 调用会触发内部容器的 `pop_back` 调用。在空容器上调用 `pop_back` 是未定义行为。\n\n更改并发数据结构的接口通常是克服并发问题的一种可行方法。在这种情况下，我更改了接口的粒度，并将\
  \ `top` 和 `pop` 方法合并为一个方法 `topAndPop`。当然，这种 `top` 和 `pop` 方法的组合违反了[单一职责原则](https://en.wikipedia.org/wiki/Single_responsibility_principle)。\n\
  \n```cpp\n 1 // concurrentStack.cpp`\n 2 \n3 #include <future>\n 4 #include <limits>\n\
  \ 5 #include <iostream>\n 6 #include <mutex>\n 7 #include <stack>\n 8 #include <stdexcept>\n\
  \ 9 #include <utility>\n10 \n11 template<typename T, template <typename, typename>\
  \ class Cont = std::deque> \n12 class ConcurrentStackBroken{\n13 public:\n14   \
  \  void push(T val){\n15         std::lock_guard<std::mutex> lockStack(mutexStack);\n\
  16         myStack.push(std::move(val));\n17     }\n18     T topAndPop(){\n19  \
  \       std::lock_guard<std::mutex> lockStack(mutexStack);\n20         if ( myStack.empty()\
  \ ) throw std::out_of_range(\"The stack is empty!\");\n21         auto val = myStack.top();\n\
  22         myStack.pop();\n23         return val;\n24     } \n25     ConcurrentStackBroken()\
  \ = default;\n26     ConcurrentStackBroken(const ConcurrentStackBroken&) = delete;\n\
  27     ConcurrentStackBroken& operator= (const ConcurrentStackBroken&) = delete;\
  \ \n28 private:\n29     mutable std::mutex mutexStack;\n30     std::stack<T, Cont<T,\
  \ std::allocator<T>>> myStack;\n31 };\n33 \n34 int main(){\n35 \n36     ConcurrentStackBroken<int>\
  \ conStack;\n37 \n38     auto fut = std::async([&conStack]{ conStack.push(2011);\
  \ });\n39     auto fut1 = std::async([&conStack]{ conStack.push(2014); });\n40 \
  \    auto fut2 = std::async([&conStack]{ conStack.push(2017); });\n41 \n42     auto\
  \ fut3 = std::async([&conStack]{ return conStack.topAndPop(); });\n43     auto fut4\
  \ = std::async([&conStack]{ return conStack.topAndPop(); });\n44     auto fut5 =\
  \ std::async([&conStack]{ return conStack.topAndPop(); });\n45 \n46     fut.get(),\
  \ fut1.get(), fut2.get();\n47 \n48     std::cout << fut3.get() << std::endl;\n49\
  \     std::cout << fut4.get() << std::endl;\n50     std::cout << fut5.get() << std::endl;\n\
  51 \n52 }\n```\n\n## 并发栈\n\n`topAndPop` 方法（第 18 - 24 行）返回的是副本而不是像之前的 `top` 方法那样的引用。在空容器上调用\
  \ `pop` 是未定义行为。如果栈为空，我更倾向于抛出 `std::out_of_range` 异常（第 20 行）。返回一个特殊的非值或返回一个 [`std::optional`](https://en.cppreference.com/w/cpp/utility/optional)\
  \ 也是一个有效选项。拷贝值有一个缺点。如果值的拷贝构造函数抛出了如 [`std::bad_alloc`](https://en.cppreference.com/w/cpp/memory/new/bad_alloc)\
  \ 的异常，该值将会丢失。\n\n调用 `fut.get(), fut1.get(), fut2.get()`（第 45 行）确保了相关的 promise 会执行。如果你不指定启动策略，promise\
  \ 可能会在调用者的线程中惰性执行。惰性意味着当仅当 future 通过 `get` 或 `wait` 请求其结果时，promise 才会执行。在单独线程中启动\
  \ promise 也是一个有效选项：\n\n```cpp\n auto fut = std::async(std::launch::asnyc, [&conStack]{\
  \ conStack.push(2011); });\n    auto fut1 = std::async(std::launch::asnyc, [&conStack]{\
  \ conStack.push(2014); });\n    auto fut2 = std::async(std::launch::asnyc, [&conStack]{\
  \ conStack.push(2017); });\n```\n\n## 在单独线程中启动每个 promise\n\n最后是程序的输出：\n\n![A Concurrent\
  \ Stack](img/DataStructures----concurrentStack.PNG)\n\n## 并发栈\n\n### 并发队列\n\n根据并发栈\
  \ 章节，我想回答这个问题：什么是队列？\n\n基于我对并发栈的讨论，并发队列的第一个实现非常相似。\n\n#### 粗粒度锁\n\n让我们直接开始吧。我的第一个实现将\
  \ `front` 和 `pop` 方法合并为 `frontAndPop` 方法。相比之下，`push` 方法将元素添加到队列末尾。`back` 方法对于 [`queue`](https://en.wikipedia.org/wiki/Queue_(abstract_data_type))\
  \ 来说是可选的，它返回队列的最后一个元素。老实说，关于是否支持 `back` 方法：\n\n1. 不支持 `back` 限制了接口，因为你永远无法获取最后一个元素。\n\
  2. 将 `back` 和 `push` 合并为一个方法 `backAndPush`。在这种情况下，`backAndPush` 应该返回 `push` 操作之前的值。这种组合看起来很有前景，但有两个严重的问题。首先，旧值必须被拷贝，因为引用或指针会破坏同步。这种拷贝操作是一种性能开销。其次，拷贝构造函数可能会抛出异常。\n\
  3. 分别支持 `back` 和 `push` 方法会引入数据竞态。假设用户对最后一个元素做了假设。现在，对于并发栈来说已经很直观了。如下：\n\n#####\
  \ 一个错误的实现\n\n\n\n\n因此，与其使用单个互斥锁进行粗粒度锁定，不如使用两个互斥锁的细粒度锁定来减少同步。\n\n```cpp\ntemplate<typename\
  \ T, template <typename, typename> class Cont = std::deque> \nclass ConcurrentQueue{\n\
  public:\n\n    void push(T val){\n        std::lock_guard<std::mutex> lockStack(mutexBackQueue);\n\
  \        myQueue.push(std::move(val));\n    }\n    T frontAndPop(){\n        std::lock_guard<std::mutex>\
  \ lockStack(mutexFrontQueue);\n        if (myQueue.empty()) throw std::out_of_range(\"\
  The queue is empty!\");\n        auto val = myQueue.front();\n        myQueue.pop();\n\
  \        return val;\n    } \n    ConcurrentQueue() = default;\n    ConcurrentQueue(const\
  \ ConcurrentQueue&) = delete;\n    ConcurrentQueue& operator= (const ConcurrentQueue&)\
  \ = delete; \nprivate:\n    mutable std::mutex mutexFrontQueue;\n    mutable std::mutex\
  \ mutexBackQueue;\n    std::queue<T, Cont<T, std::allocator<T>>> myQueue;\n};\n\
  ```\n\n## 细粒度并发队列的错误实现\n\n这里存在一个问题，导致实现是不正确的。当队列为空时，`push` 和 `pop` 操作的是同一个元素，这会导致数据竞态。通过添加元素将\
  \ `push` 操作与 `pop` 操作分离，可以解决这个问题。\n\n我无法基于 `std::queue` 提供的抽象来实现细粒度并发队列。现在，我必须自己来实现。首先，队列是如何实现的呢？\n\
  \n### 简单队列\n\n实现队列的一种直接方法是使用单链表。单链意味着一个节点指向下一个节点，但反之不然。此外，`head` 指针指向数据结构的头部，`tail`\
  \ 指针指向尾部。可以从队列中移除（`pop`）元素或添加（`push`）元素。通过将 `head` 指针移动一个位置从队列中移除元素。由于并发原因，移除操作还会返回旧的\
  \ `head` 节点。通过让之前的 `tail` 节点指向新节点来添加元素。移除和添加操作会调整 `head` 和 `tail` 指针。\n\n![简单队列](img/DataStructures----SimpleQueue.png)\n\
  \n#### 简单队列\n\n以下是简单队列的实现。\n\n```cpp\n 1 // simpleQueue.cpp\n 2 \n 3 #include <iostream>\n\
  \ 4 #include <memory>\n 5 #include <utility>\n 6 \n 7 template <typename T>\n 8\
  \ class Queue{\n 9 private:\n10     struct Node{\n11         T data;\n12       \
  \  std::unique_ptr<Node> next;\n13         Node(T data_): data(std::move(data_)){}\n\
  14     };\n15     std::unique_ptr<Node> head;\n16     Node* tail;\n17 public:\n\
  18     Queue(): tail(nullptr){};\n19     std::unique_ptr<T> pop(){\n20         if\
  \ (!head) throw std::out_of_range(\"The queue is empty!\");\n21         std::unique_ptr<T>\
  \ res = std::make_unique<T>(std::move(head->data));\n22         std::unique_ptr<Node>\
  \ oldHead = std::move(head);\n23         head = std::move(oldHead->next);\n24  \
  \       if (!head) tail = nullptr;\n25         return res;\n26     }\n27     void\
  \ push(T val){\n28         std::unique_ptr<Node> newNode = std::make_unique<Node>(Node(std::move(val)));\n\
  29         Node* newTail = newNode.get();\n30         if (tail) tail->next= std::move(newNode);\n\
  31         else head = std::move(newNode);\n32         tail = newTail;\n33     }\n\
  34     Queue(const Queue& other) = delete;\n35     Queue& operator=(const Queue&\
  \ other) = delete;\n36 };\n37 \n38 int main(){\n39     \n40     std::cout << std::endl;\n\
  41     \n42     Queue<int> myQueue;\n43     myQueue.push(1998);\n44     myQueue.push(2003);\n\
  45     std::cout << *myQueue.pop() << std::endl;\n46     std::cout << *myQueue.pop()\
  \ << std::endl;\n47     myQueue.push(2011);\n48     myQueue.push(2014);\n49    \
  \ std::cout << *myQueue.pop() << std::endl;\n50     myQueue.push(2017);\n51    \
  \ myQueue.push(2020);\n52     std::cout << *myQueue.pop() << std::endl;\n53    \
