  \ 停止令牌 (Stop Tokens)\n\n协作连接线程的额外功能基于 `std::stop_token`、`std::stop_callback` 和 `std::stop_source`。\n\
  \n#### `std::stop_token`、`std::stop_source` 和 `std::stop_callback`\n\n`stop_token`、`std::stop_callback`\
  \ 或 `std::stop_source` 能够异步请求停止执行或询问执行是否收到了停止信号。`std::stop_token` 可以传递给操作，之后可用于主动轮询令牌的停止请求，或通过\
  \ `std::stop_callback` 注册回调。停止请求由 `std::stop_source` 发送。该信号影响所有关联的 `std::stop_token`。三个类\
  \ `std::stop_source`、`std::stop_token` 和 `std::stop_callback` 共享关联的停止状态的所有权。调用 `request_stop()`、`stop_requested()`\
