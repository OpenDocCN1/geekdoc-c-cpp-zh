  \ `23`。\n\n3. `18` happens-before `26`。\n\n然而，故事变得更加有趣。现在我们来谈谈内存障。\n\n ` ` ` ` `\
  \ ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` `\
  \ ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` 内存障。\n\n### 内存障\n\n将程序移植到内存内存是非常直接的。第一步是添加具有释放和获取语义的内存障。当然，我只能将获取或释放操作替换为相应的内存障。接下来，我将获取或释放语义的原子操作改为松弛语义（第\
  \ 19 和 24 行）。\n\n```cpp\n 1 // acquireReleaseFences.cpp\n 2 \n 3 #include <atomic>\n\
  \ 4 #include <thread>\n 5 #include <iostream>\n 6 #include <string>\n 7 \n 8 using\
  \ namespace std;\n 9  \n10 atomic<string*> ptr;\n11 int data;\n12 atomic<int> atoData;\n\
  13  \n14 void producer(){\n15     string* p  = new string(\"C++11\");\n16     data\
  \ = 2011;\n17     atoData.store(2014, memory_order_relaxed);\n18     atomic_thread_fence(memory_order_release);\n\
  19     ptr.store(p, memory_order_relaxed);\n20 }\n21  \n22 void consumer(){\n23\
  \     string* p2;\n24     while (!(p2 = ptr.load(memory_order_relaxed)));\n25  \
  \   atomic_thread_fence(memory_order_acquire);\n26     cout << \"*p2: \" << *p2\
  \ << endl;\n27     cout << \"data: \" << data << endl;\n28     cout << \"atoData:\
  \ \" << atoData.load(memory_order_relaxed) << endl;\n29 }\n30  \n31 int main(){\n\
  32     \n33     cout << endl;\n34     \n35     thread t1(producer);\n36     thread\
  \ t2(consumer);\n37     \n38     t1.join();\n39     t2.join();\n40     \n41    \
  \ delete ptr;\n42     \n43     cout << endl;\n44     \n45 }\n```\n\n使用内存障的获取-释放排序\n\
  \n第一步是添加具有释放和获取语义的内存障。当然，我只能将获取或释放操作替换为相应的内存障。关键点是，释放内存障与获取内存障建立了 *synchronizes-with*\
  \ 关系，从而建立了 *inter-thread happens-before* 关系。\n\n这是程序的输出。\n\n![Synchronisation with\
  \ fences](img/MemoryModel----acquireReleaseAcquireReleaseFences.png)\n\n对于更视觉化的读者，这里是整个关系的图示。\n\
  \n![Acquire-release semantic with fences](img/MemoryModel----acquireReleaseFences.png)\n\
  \n\n\n\n# 使用栅障的获取-释放语义\n\n核心问题是：为什么获取栅障（acquire fence）之后的操作能看到释放栅障（release fence）之前操作的效果？这种保证很有趣，因为\
  \ `data` 是一个非原子变量，且 `atoData.store` 使用了宽松（relaxed）语义。这本意味着它们可以被重序；然而，得益于 `std::atomic_thread_fence(std::memory_order_release)`\
  \ 作为一种释放操作，结合 `std::atomic_thread_fence(std::memory_order_acquire)`，两者都不会被重序。\n\n\
  为了清晰起见，这里用更简洁的形式复述了整个推理过程。\n\n1. 获取和释放栅障防止了跨越栅障的原子操作与非原子操作重排序。\n2. 消费者线程 `t2` 阻塞在\
  \ `while (!(p2= ptr.load(std::memory_order_relaxed)))` 循环中，直到生产者线程 `t1` 设置了指针 `ptr.store(p,std.memory_order_relaxed)`。\n\
  3. 释放栅障“同步（synchronizes-with）”获取栅障。\n4. 最后，所有在释放栅障之前“发生于（happen-before）”的宽松或非原子操作的效果在获取栅障之后都是可见的。\n\
  \n你甚至可以在程序 `acquireRelease.cpp` 中原子变量上的获取和释放操作，与程序 `acquireReleaseFence.cpp` 中的获取和释放栅障混合使用，而不会影响“同步（synchronize-with）”关系。\n\
  \n## std::atomic_signal_fence\n\n`std::atomic_signal_fence` 在线程与同一线程上执行的信号处理程序（signal\
  \ handler）之间，建立了非原子访问与宽松原子访问之间的内存同步排序。下面的程序展示了 `std::atomic_signal_fence` 的用法。\n\
  \n```\n 1 // atomicSignal.cpp\n 2 \n3 #include <atomic>\n 4 #include <cassert>\n\
  \ 5 #include <csignal>\n 6 \n7 std::atomic<bool> a{false};\n 8 std::atomic<bool>\
  \ b{false};\n 9\n10 extern \"C\" void handler(int) {\n11     if (a.load(std::memory_order_relaxed))\
  \ {\n12         std::atomic_signal_fence(std::memory_order_acquire);\n13       \
  \  assert(b.load(std::memory_order_relaxed));\n14     }\n15 }\n16 \n17 int main()\
  \ {\n18     \n19     std::signal(SIGTERM, handler);\n20 \n21     b.store(true, std::memory_order_relaxed);\n\
  22     std::atomic_signal_fence(std::memory_order_release);\n23     a.store(true,\
  \ std::memory_order_relaxed);\n24 \n25 }\n```\n\n### 与信号处理程序的同步\n\n首先，我在第 19 行为特定的信号\
  \ `SIGTERM` 设置了信号处理程序 `handler`。`SIGTERM` 是程序的终止请求。`std::atomic_signal_fence` 分别在释放操作\
  \ `std::atomic_signal_fence(std::memory_order_release)`（第 22 行）和获取操作 `std::atomic_signal_fence(std::memory_order_acquire)`（第\
  \ 12 行）之间建立了一个获取-释放栅障。这意味着特别是释放操作不能跨越释放栅障（第 22 行）重序，且获取操作不能跨越获取栅障（第 11 行）重序。因此，第\
  \ 13 行的断言 `assert(b.load(std::memory_order_relaxed))` 永远不会触发，因为如果 `a.store(true,\
  \ std::memory_order_relaxed)`（第 23 行）发生了，`b.store(true, std::memory_order_relaxed)`（第\
