  \ #include <thread>\n 6 \n7 class Sleeper{\n 8   public:\n 9     Sleeper(int& i_):\
  \ i{i_}{};\n10     void operator() (int k){\n11       for (unsigned int j = 0; j\
  \ <= 5; ++j){\n12         std::this_thread::sleep_for(std::chrono::milliseconds(100));\n\
  13         i += k;\n14       }\n15       std::cout << std::this_thread::get_id()\
  \ << std::endl;\n16     }\n17   private:\n18     int& i;\n19 };\n20 \n21 \n22 int\
  \ main(){\n23 \n24   std::cout << std::endl;\n25 \n26   int valSleeper = 1000;\n\
  27   std::thread t(Sleeper(valSleeper), 5);\n28   t.detach();\n29   std::cout <<\
