  \ 简单队列\n\n简单队列使用 `std::unique_ptr` 来管理节点的生命周期。`tail` 是原始指针，因为 `push(T val)` 会创建一个新节点并更新\
  \ `tail` 指针。`pop` 方法返回值并调整 `head` 指针；如果队列变空，则 `tail` 被设置为 `nullptr`。`push` 方法通过链接现有的\
  \ `tail->next` 来添加新节点。如果队列为空，则 `head` 被设置为新节点。由于 `push` 和 `pop` 之间的数据竞态，该实现不是线程安全的。\n\
  \n\n\n带有哨兵节点的简单队列与之前没有哨兵节点的队列之间的区别并不大。首先，`head` 和 `tail` 被初始化指向哨兵节点。让我们先分析 `pop`\
  \ 方法。第 20 行随后检查队列在逻辑上是否为空；这意味着队列仅包含哨兵节点。`push` 方法的变化比 `pop` 方法更多。首先，创建一个新的哨兵节点（第\
  \ 28 行），它成为 `tail` 指向的末尾节点（第 29 行和第 32 行）。旧哨兵节点指向新的哨兵节点（第 30 行）并获取值 `val`（第 31 行）。\n\
  \n如所预期，使用带哨兵节点队列的程序输出与之前没有哨兵节点的队列相同。\n\n![带哨兵节点的简单队列用法](img/DataStructures----SimpleQueueWithDummy.png)\n\
  \n### 带有哨兵节点的简单队列用法\n\n现在，我完成了重构。带哨兵节点的队列的关键观察是：`push` 方法和 `pop` 方法几乎完全在不同的两端工作。这种分离允许为每个端使用一个互斥锁（mutex）。只有\
  \ `pop` 方法中的检查 `(head.get() == tail)`（第 20 行）需要两个互斥锁。这并不糟糕，因为这个临界区的持续时间很短。\n\n带着这些知识，让我把这些组合在一起，最终实现具有细粒度锁的并发队列。\n\
  \n### 实现\n\n队列的同步基于两个互斥锁。一个互斥锁保护队列头部，另一个互斥锁保护队列尾部。最后一个问题是：将这两个互斥锁放在哪里？为了获得最大性能，临界区应该越短越好。这意味着对于\
  \ `pop` 方法，整个方法必须被保护；但对于 `push` 方法，只有使用队列尾部的指令需要保护。其他操作是局部的，因此本身是线程安全的。\n\n```cpp\n\
  \ 1 // concurrentQueueFineLocking.cpp\n 2 \n3 #include <future>\n 4 #include <iostream>\n\
  \ 5 #include <memory>\n 6 #include <mutex>\n 7 #include <utility>\n 8 \n 9 template\
  \ <typename T>\n10 class ConcurrentQueue{\n11 private:\n12     struct Node{\n13\
  \         T data;\n14         std::unique_ptr<Node> next;\n15         Node(T data_):\
  \ data(std::move(data_)){}\n16     };\n17     std::unique_ptr<Node> head;\n18  \
  \   Node* tail;\n19     std::mutex headMutex;\n20     std::mutex tailMutex;\n21\
  \ public:\n22     ConcurrentQueue(): head(new Node(T{})), tail(head.get()){};\n\
  23     std::unique_ptr<T> pop(){\n24         std::lock_guard<std::mutex> headLock(headMutex);\n\
  25         {\n26             std::lock_guard<std::mutex> tailLock(tailMutex);\n\
  27             if (head.get() == tail) throw std::out_of_range(\"The queue is empty!\"\
  );\n28         }\n29         std::unique_ptr<T> res = std::make_unique<T>(std::move(head->data));\n\
  30         std::unique_ptr<Node> oldHead = std::move(head);\n31         head = std::move(oldHead->next);\n\
  32         if (!head) tail = nullptr;\n33         return res;\n34     }\n35    \
  \ void push(T val){\n36         std::unique_ptr<Node> dummyNode = std::make_unique<Node>(Node(T{}));\n\
  37         Node* newTail = dummyNode.get();\n38         std::lock_guard<std::mutex>\
  \ tailLock(tailMutex);\n39         tail->next= std::move(dummyNode);\n40       \
  \  tail->data = val;\n41         tail = newTail;\n42     }\n43     ConcurrentQueue(const\
  \ ConcurrentQueue& other) = delete;\n44     ConcurrentQueue& operator=(const ConcurrentQueue&\
  \ other) = delete;\n45 };\n46 \n47 int main(){\n48     \n59     std::cout << std::endl;\n\
  50     \n51     ConcurrentQueue<int> conQueue;\n52     \n53     auto fut = std::async([&conQueue]{\
  \ conQueue.push(2011); });\n54     auto fut1 = std::async([&conQueue]{ conQueue.push(2014);\
  \ });\n55     auto fut2 = std::async([&conQueue]{ conQueue.push(2017); });\n56 \
  \    \n57     auto fut3 = std::async([&conQueue]{ return *conQueue.pop(); });\n\
  58     auto fut4 = std::async([&conQueue]{ return *conQueue.pop(); });\n59     auto\
  \ fut5 = std::async([&conQueue]{ return *conQueue.pop(); });\n60     \n61     fut.get(),\
  \ fut1.get(), fut2.get();\n62     \n63     std::cout << fut3.get() << std::endl;\n\
  64     std::cout << fut4.get() << std::endl;\n65     std::cout << fut5.get() <<\
  \ std::endl;\n66     \n67     std::cout << std::endl;\n68     \n69 }\n```\n\n###\
  \ 细粒度锁的并发队列\n\n首先：该实现是线程安全的吗？`ConcurrentQueue` 只有两个方法。对共享单链表 `Nodes` 的操作由两个互斥锁保护。`headMutex`（第\
  \ 19 行）负责保护数据结构的头部，`tailMutex`（第 20 行）负责保护数据结构的尾部。唯一可能同时操作单链表头部和尾部的操作由两个互斥锁共同保护（第\
  \ 27 行）。因此，`ConcurrentQueue` 是无数据竞态的。你应该避免在同一时间获取多个互斥锁，因为如果两个互斥锁以不同的顺序被获取，可能会导致死锁。尽管\
  \ `pop` 方法先获取 `headMutex`（第 24 行），后获取 `tailMutex`（第 26 行），但不存在死锁风险，因为互斥锁总是以相同的顺序获取。\n\
  \n执行细粒度并发队列的结果符合预期。\n\n![细粒度锁的并发队列](img/DataStructures----concurrentQueueFineLocking.png)\n\
  \n### 有时会出现异常\n\n有时程序运行会抛出异常。由于我的设计决定，这种异常是可以的。当队列为空时我在 `pop` 方法中抛出了 `std::out_of_range`\
  \ 异常。与其抛出异常，更适当的策略是等待。\n\n#### 等待值\n\n使用 `std::condition_variable` 可以让 `pop` 调用在值可用时进行等待。\n\
  \n\n\n```cpp\n 1 // concurrentQueueFineLockingWithWaiting.cpp\n 2 \n #include <condition_variable>\n\
  \ #include <future>\n #include <iostream>\n #include <memory>\n #include <mutex>\n\
  \ #include <utility>\n 9\ntemplate <typename T>\n class Queue{\n private:\n    \
  \ struct Node{\n         T data;\n         std::unique_ptr<Node> next;\n       \
  \  Node(T data_): data(std::move(data_)){}\n     };\n     std::unique_ptr<Node>\
  \ head;\n     Node* tail;\n     std::mutex headMutex;\n     std::mutex tailMutex;\n\
  \     std::condition_variable condVar;\n public:\n     Queue(): head(new Node(T{})),\
  \ tail(head.get()){};\n     std::unique_ptr<T> pop(){\n         std::lock_guard<std::mutex>\
  \ headLock(headMutex);\n         {\n             std::unique_lock<std::mutex> tailLock(tailMutex);\n\
  \             if (head.get() == tail) condVar.wait(tailLock);\n         }\n    \
  \     std::unique_ptr<T> res = std::make_unique<T>(std::move(head->data));\n   \
  \      std::unique_ptr<Node> oldHead = std::move(head);\n         head = std::move(oldHead->next);\n\
  \         if (!head) tail = nullptr;\n         return res;\n     }\n     void push(T\
  \ val){\n         std::unique_ptr<Node> dummyNode = std::make_unique<Node>(Node(T{}));\n\
  \         Node* newTail = dummyNode.get();\n         {\n             std::unique_lock<std::mutex>\
  \ tailLock(tailMutex);\n             tail->next= std::move(dummyNode);\n       \
  \      tail->data = val;\n             tail = newTail;\n         }\n         condVar.notify_one();\n\
  \     }\n     Queue(const Queue& other) = delete;\n     Queue& operator=(const Queue&\
  \ other) = delete;\n };\n \nint main(){\n     \n     std::cout << std::endl;\n \
  \    \n     Queue<int> conQueue;\n     \n     auto fut = std::async([&conQueue]{\
  \ conQueue.push(2011); });\n     auto fut1 = std::async([&conQueue]{ conQueue.push(2014);\
  \ });\n     auto fut2 = std::async([&conQueue]{ conQueue.push(2017); });\n     \n\
  \     auto fut3 = std::async([&conQueue]{ return *conQueue.pop(); });\n     auto\
  \ fut4 = std::async([&conQueue]{ return *conQueue.pop(); });\n     auto fut5 = std::async([&conQueue]{\
  \ return *conQueue.pop(); });\n     \n     fut.get(), fut1.get(), fut2.get();\n\
  \     \n     std::cout << fut3.get() << std::endl;\n     std::cout << fut4.get()\
  \ << std::endl;\n     std::cout << fut5.get() << std::endl;\n     \n     std::cout\
  \ << std::endl;\n \n }\n```\n\n# 带有细粒度锁和等待机制的并发队列\n\n对之前的细粒度锁并发队列的修改是非常微小的。如果没有可用可用值，`pop()`\
  \ 调用会在第 29 行等待。`std::condition_variable` 需要 `std::unique_lock` 而不是 `std::lock_guard`。`push()`\
  \ 调用通过 `condVar.notify_one()` 通知其等待者有新值可用可用（第 46 行）。`condVar.notify_one()` 本身是线程安全的，因此不需要同步。也许，你漏掉了\
  \ `wait()` 调用（第 29 行）中的谓词。这个谓词应该防止[虚假唤醒]和[丢失的唤醒]。这种保护恰好是条件 `head.get() == tail`\
  \ 的要完成的任务。\n\n这张截图结束了我关于基于锁的并发队列的介绍。\n\n![带有细粒度锁和等待机制的并发队列](img/DataStructures----concurrentQueueFineLockingWithWaiting.png)\n\
