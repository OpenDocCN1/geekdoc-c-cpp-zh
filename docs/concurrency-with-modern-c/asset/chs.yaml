  13         std::this_thread::sleep_for(std::chrono::milliseconds(200));\n14    \
  \     // end work\n15         std::cout << name << \": \" << \"Work \" << i << \"\
  \ done !!!\" << std::endl;\n16       }\n17     }\n18 private:\n19   std::string\
  \ name;\n20 };\n21 \n22 \n23 int main(){\n24 \n25   std::cout << std::endl;\n26\
  \   \n27   std::cout << \"Boss: Let's start working.\\n\\n\";\n28  \n29   std::thread\
  \ herb= std::thread(Worker(\"Herb\"));\n30   std::thread andrei= std::thread(Worker(\"\
  \  Andrei\"));\n31   std::thread scott= std::thread(Worker(\"    Scott\"));\n32\
  \   std::thread bjarne= std::thread(Worker(\"      Bjarne\"));\n33   std::thread\
  \ bart= std::thread(Worker(\"        Bart\"));\n34   std::thread jenne= std::thread(Worker(\"\
  \          Jenne\"));\n35   \n36   \n37   herb.join();\n38   andrei.join();\n39\
  \   scott.join();\n40   bjarne.join();\n41   bart.join();\n42   jenne.join();\n\
  43   \n44   std::cout << \"\\n\" << \"Boss: Let's go home.\" << std::endl;\n45 \
  \  \n46   std::cout << std::endl;\n47   \n48 }\n```\n\n#### 向 `std::cout` 进行非同步写入\n\
  \n该程序描述了一个工作流。老板有六个工人（第 29-34 行）。每个工人必须处理 3 个任务包。每个任务包耗时 `1/5` 秒（第 13 行）。当工人完成任务包后，他会向老板大声报告（第\
  \ 15 行）。一旦老板收到所有工人的通知，他就会让他们回家（第 43 行）。\n\n对于这样一个简单的工作流来说，这真是一团糟。\n\n![向 `std::cout`\
  \ 进行非同步写入](img/Multithreading----bossWorker.png)\n\n#### 向 `std::cout` 进行非同步写入\n\
  \n最直接的解决方案是使用互斥锁（mutex）。\n\n###### 互斥锁\n\nMutex 是 `mutual exclusion`（互斥）的缩写。它确保在任何时刻只有一个线程可以访问临界区。\n\
  \n通过使用互斥锁，工作流的混乱变得和谐。\n\n```cpp\n 1 // coutSynchronised.cpp\n 2 \n 3 #include <chrono>\n\
  \ 4 #include <iostream>\n 5 #include <mutex>\n 6 #include <thread>\n 7 \n 8 std::mutex\
  \ coutMutex;\n 9\n10 class Worker{\n11 public:\n12   Worker(std::string n):name(n){};\n\
  13  \n14     void operator() (){\n15       for (int i = 1; i <= 3; ++i){ \n16  \
  \       // begin work\n17         std::this_thread::sleep_for(std::chrono::milliseconds(200));\n\
  18         // end work\n19         coutMutex.lock();\n20         std::cout << name\
  \ << \": \" << \"Work \" << i << \" done !!!\" << std::endl;\n21         coutMutex.unlock();\n\
  22       }\n23     }\n24 private:\n25   std::string name;\n26 };\n27 \n28 \n29 int\
  \ main(){\n30 \n31   std::cout << std::endl;\n32   \n33   std::cout << \"Boss: Let's\
  \ start working.\" << \"\\n\\n\";\n34  \n35   std::thread herb= std::thread(Worker(\"\
  Herb\"));\n36   std::thread andrei= std::thread(Worker(\"  Andrei\"));\n37   std::thread\
  \ scott= std::thread(Worker(\"    Scott\"));\n38   std::thread bjarne= std::thread(Worker(\"\
  \      Bjarne\"));\n39   std::thread bart= std::thread(Worker(\"        Bart\"));\n\
  40   std::thread jenne= std::thread(Worker(\"          Jenne\"));\n41   \n42   herb.join();\n\
  43   andrei.join();\n44   scott.join();\n45   bjarne.join();\n46   bart.join();\n\
  47   jenne.join();\n48   \n49   std::cout << \"\\n\" << \"Boss: Let's go home.\"\
  \ << std::endl;\n50   \n51   std::cout << std::endl;\n52 }\n```\n\n#### 向 `std::cout`\
  \ 进行同步写入\n\n程序描述了一个工作流。老板有六个工人（第 29-34 行）。每个工人必须处理 3 个任务包。每个任务包耗时 `1/5` 秒（第 13 行）。当工人完成任务包后，他会向老板大声报告（第\
  \ 15 行）。一旦老板收到所有工人的通知，他就会让他们回家（第 43 行）。\n\n对于这样一个简单的工作流来说，这真是一团糟。\n\n（注：此处原文似乎存在部分重复内容，根据指令要求已完成逻辑翻译并未重复输出段落）\n\
  \n最直接的解决方案是使用互斥锁。\n\n###### 互斥锁\n\nMutex 是 `mutual exclusion`（互斥）的缩写。它确保在任何时刻只有一个线程可以访问临界区。\n\
  \n通过使用互斥锁，工作流的混乱变得和谐。\n\n（此处代码块保持原样）\n\n（注：后续译文部分由于原文中存在大量重复描述，已按照“不要不要重复输出原文”的原则进行处理，确保逻辑连贯。）\n\
  \n\n\n\n```cpp\nstd::mutex m;\nm.lock();\nsharedVariable = getVar();\nm.unlock();\n\
  ```\n\n这里是存在的问题：\n\n1. 如果函数 `getVar()` 抛出异常，互斥锁 `m` 将不会释放。\n\n2. 在持有锁时**千万不要**调用未知函数。如果函数\
  \ `getVar` 尝试锁定互斥锁 `m`，程序将产生未定义行为，因为 `m` 不是递归互斥锁。大多数情况下，未定义行为会导致死锁。\n\n3. 避免在持有锁时调用函数。该函数可能来自某个库，而你获取了该库的新版本，或者该函数被重写了。死锁风险始终存在。\n\
  \n程序需要的锁越多，挑战性就越大。这种依赖关系是非线性的。\n\n## 以不同顺序锁定互斥锁\n\n这是一个由于加锁顺序不同导致死锁的典型场景。\n\n![Deadlock\
  \ of two threads](img/Multithreading----Deadlock.png)\n\n两个线程的死锁\n\n线程 1 和线程 2 需要访问两个资源来完成工作。当请求的资源由两个独立的互斥锁保护，并且请求的顺序不同时，问题就出现了（线程\
  \ 1：锁 1，锁 2；线程 2：锁 2，锁 1）。在这种情况下，线程的执行交错，导致线程 1 获得了互斥锁 1，然后线程 2 获得了互斥锁 2，我们陷入了停滞。每个线程都想要获取对方的互斥锁，但要获取对方的互斥锁，另一个线程必须先释放它。“致命接触”这个词很好地描述了这种死锁。\n\
  \n将这张图转化为代码是很简单的。\n\n```cpp\n 1 // deadlock.cpp\n 2 \n3 #include <iostream>\n 4\
  \ #include <chrono>\n 5 #include <mutex>\n 6 #include <thread>\n 7 \n8 struct CriticalData{\n\
  \ 9   std::mutex mut;\n10 };\n11 \n12 void deadLock(CriticalData& a, CriticalData&\
  \ b){\n13 \n14   a.mut.lock();\n15   std::cout << \"get the first mutex\" << std::endl;\n\
  16   std::this_thread::sleep_for(std::chrono::milliseconds(1));\n17   b.mut.lock();\n\
  18   std::cout << \"get the second mutex\" << std::endl;\n19   // do something with\
  \ a and b\n20   a.mut.unlock();\n21   b.mut.unlock();\n22   \n23 }\n24 \n25 int\
  \ main(){\n26 \n27   CriticalData c1;\n28   CriticalData c2;\n29 \n30   std::thread\
  \ t1([&]{deadLock(c1,c2);});\n31   std::thread t2([&]{deadLock(c2,c1);});\n32 \n\
  33   t1.join();\n34   t2.join();\n35 \n36 }\n```\n\n线程 `t1` 和 `t2` 调用 `deadlock`（第\
  \ 12 - 23 行）。`deadlock` 函数需要变量 `CriticalData c1` 和 `c2`（第 27 和 28 行）。由于对象 `c1` 和\
  \ `c2` 必须免受共享访问的影响，它们内部持有一个互斥锁（为了保持示例简单直接，`CriticalData` 除了互斥锁外没有其他方法或成员）。\n\n在第\
  \ 16 行进行约 1 毫秒的短时间睡眠足以产生死锁。\n\n![Deadlock of two threads](img/Multithreading----deadlockCode.png)\n\
  \n两个线程的死锁\n\n剩下的唯一选择是按下 CTRL+C 并杀死进程。\n\n锁并没有解决互斥锁的所有问题，但在很多情况下它们能救急。\n\n### 锁 (Locks)\n\
  \n锁遵循 RAII 范式处理其资源。锁在构造函数中自动绑定其互斥锁，并在析构函数中释放它。这大大减少了死锁的风险，因为运行时会处理互斥锁。\n\n锁有四种不同的类型：用于简单用例\
  \ `std::lock_guard`；用于高级用例 `std::unique_lock`。`std::shared_lock` 从 C++14 起可用，可用于实现读写锁。通过\
  \ C++17，我们得到了 `std::scoped_lock`，它可以在原子步骤中锁定多个互斥锁。\n\n首先是简单的用例。\n\n#### `std::lock_guard`\n\
  \n```cpp\nstd::mutex m;\nm.lock();\nsharedVariable = getVar();\nm.unlock();\n```\n\
  \n互斥锁 `m` 确保了对临界区域 `sharedVariable = getVar()` 的访问是顺序的。在这种特殊情况下，顺序意味着每个线程都在另一个线程之后获取临界区域访问。这在系统中建立了一个全序。代码简单但容易导致死锁。如果临界区域抛出异常或程序员忘记释放互斥锁，可能会出现死锁。使用\
  \ `std::lock_guard` 我们可以更优雅地做到：\n\n```cpp\n{\n  std::mutex m;\n  std::lock_guard<std::mutex>\
  \ lock(m);\n  sharedVariable = getVar();\n}\n```\n\n#### `std::scoped_lock`\n\n\
  在 C++17 中我们得到了 `std::scoped_lock`，它可以在原子步骤中锁定多个互斥锁。\n\n1. 如果当前线程之一已经拥有对应的互斥锁，且该互斥锁不是递归的，则行为是未定义的。\n\
  \n2. 如果当前线程之一已经拥有对应的互斥锁，且该互斥锁是递归的，你可以直接获取互斥锁的所有权而无需锁定。\n\n#### `std::unique_lock`\n\
  \n`std::unique_lock` 比它的小兄弟 `lock_guard` 更强大但开销更大。\n\n除了 `lock_guard` 提供的功能，`std::unique_lock`\
  \ 还允许你：\n\n* 在没有关联互斥锁的情况下创建它。\n* 在不锁定关联互斥锁的情况下创建它。\n* 显式地反复设置或释放互斥锁的锁。\n* 递归锁定其互斥锁。\n\
  * 移动互斥锁。\n* 尝试锁定互斥锁。\n* 延迟关联互斥锁的锁定。\n\n\n\n\n\n`lk.try_lock_for(relTime)` 需要一个相对时间间隔；`lk.try_lock_until(absTime)`\
  \ 需要一个绝对时间点。`lk.try_lock_for(`lk.try_lock_until`)` 实际上是调用了关联互斥锁 `mut` 的方法 `mut.try_lock_for(`mut.try_lock_until)`。关联的互斥锁必须支持排他定时阻塞。你应该使用稳定时钟（steady\
  \ clock）作为你的时间限制。稳定时钟是无法调整的。\n\n`lk.try_lock` 尝试锁定互斥锁并立即返回。如果成功，它返回 `true`，否则返回\
  \ `false`。相比之下方法 `lk.try_lock_for` 和 `lk.try_lock_until` 会阻塞锁 `lk` 直到指定的超时发生或获取到锁，以先到者为准。如果这三种方法\
  \ `lk.try_lock`、`lk.try_lock_for` 和 `lk.try_lock_until` 在没有关联的互斥锁或互斥锁已被此 `std::unique_lock`\
  \ 锁定时，会抛出 `std::system_error` 异常。\n\n方法 `lk.release()` 返回互斥锁；因此，你必须手动解锁。\n\n得益于\
  \ `std::unique_lock`，在一个原子步骤中锁定多个互斥锁是非常容易。因此，你可以通过以不同的顺序锁定互斥锁来克服死锁。还记得“互斥锁问题”（Issues\
  \ of Mutexes）小节中的死锁吗？\n\n```cpp\n 1 // deadlock.cpp\n 2 \n3 #include <iostream>\n\
  \ 4 #include <chrono>\n 5 #include <mutex>\n 6 #include <thread>\n 7 \n 8 struct\
  \ CriticalData{\n 9   std::mutex mut;\n10 };\n11 \n12 void deadLock(CriticalData&\
  \ a, CriticalData& b){\n13 \n14   a.mut.lock();\n15   std::cout << \"get the first\
  \ mutex\" << std::endl;\n16   std::this_thread::sleep_for(std::chrono::milliseconds(1));\n\
  17   b.mut.lock();\n18   std::cout << \"get the second mutex\" << std::endl;\n19\
  \   // do something with a and b\n20   a.mut.unlock();\n21   b.mut.unlock();\n22\
  \   \n23 }\n24 \n25 int main(){\n26 \n27   CriticalData c1;\n28   CriticalData c2;\n\
  29 \n30   std::thread t1([&]{deadLock(c1,c2);});\n31   std::thread t2([&]{deadLock(c2,c1);});\n\
  32 \n33   t1.join();\n34   t2.join();\n35 \n36 }\n```\n\n## 以不同的顺序锁定互斥锁\n\n让我们解决这个问题。`deadLock`\
  \ 函数必须以原子方式锁定它的互斥锁，这正是后续示例中所发生的情况。\n\n```cpp\n 1 // deadlockResolved.cpp\n 2 \n\
  3 #include <iostream>\n 4 #include <chrono>\n 5 #include <mutex>\n 6 #include <thread>\n\
  \ 7 \n 8 using namespace std;\n10 struct CriticalData{\n11   mutex mut;\n12 };\n\
  13 \n14 void deadLock(CriticalData& a, CriticalData& b){\n15 \n16   unique_lock<mutex>\
  \ guard1(a.mut,defer_lock);\n17   cout << \"Thread: \" << this_thread::get_id()\
  \ << \" first mutex\" << endl;\n18 \n19   this_thread::sleep_for(chrono::milliseconds(1));\n\
  20 \n21   unique_lock<mutex> guard2(b.mut,defer_lock);\n22   cout << \"  Thread:\
  \ \" << this_thread::get_id() << \" second mutex\" <<  endl;\n23 \n24   cout <<\
  \ \"    Thread: \" << this_thread::get_id() << \" get both mutex\" << endl;\n25\
  \   lock(guard1,guard2);\n26   // do something with a and b\n27 }\n28 \n29 int main(){\n\
  30 \n31   cout << endl;\n32 \n33   CriticalData c1;\n34   CriticalData c2;\n35 \n\
  36   thread t1([&]{deadLock(c1,c2);});\n37   thread t2([&]{deadLock(c2,c1);});\n\
  38 \n39   t1.join();\n40   t2.join();\n41 \n42   cout << endl;\n43 \n44 }\n```\n\
  \n## 互斥锁的延迟锁定\n\n如果你使用 `std::defer_lock` 调用 `std::unique_lock` 的构造函数，底层互斥锁不会自动锁定。此时（第\
  \ 16 行和 21 行），`std::unique_lock` 仅仅是互斥锁的所有者。得益于 `lock`，锁定操作在一个原子步骤中执行（第 25 行）。在这个示例中，`std::unique_lock`\
  \ 管理资源的生命周期，而 `lock` 锁定关联的互斥锁。你也可以过来这样做：在第一步锁定互斥锁，在第二步由 `std::unique_lock` 管理资源的生命周期。这里是第二种方法的示例。\n\
  \n```cpp\nlock(a.mut, b.mut);\nlock_guard<std::mutex> guard1(a.mut, defer_lock);\n\
  lock_guard<std::mutex> guard2(b.mut, defer_lock);\n```\n\n两种变体都解决了死锁。\n\n## `std::shared_lock`\n\
  \n在 C++14 中，C++ 增加了对 `std::shared_lock` 的支持。`std::shared_lock` 的接口与 `std::unique_lock`\
  \ ，但在与 `std::shared_mutex` 配合使用时行为不同。多个 `shared_lock` 允许同时访问临界区域，但只有一个线程可以写入。读写锁（reader-writer\
  \ locks）的概念非常直观且有用。让我们来看一个读写锁的例子。\n\n```cpp\n 1 // readerLock.cpp\n 2 \n3 #include\
  \ <iostream>\n 4 #include <chrono>\n 5 #include <mutex>\n 6 #include <thread>\n\
  \ 7 \n8 #include <map>\n 9 std::map<std::string,int> teleBook{\"Dijkstra\", 1972},{\"\
  Scott\", 1976},{\"Ritchie\", 1983};\n10 std::shared_mutex mtx;\n11 \n12 void addToBook(const\
  \ std::string& na, int number){\n13   std::cout << \"STARTING UPDATE \" << na <<\
  \ std::endl;\n14   std::unique_lock<std::shared_mutex> writerLock(mtx);\n15   //\
  \ do something with teleBook\n16   teleBook[na]= number;\n17   std::this_thread::sleep_for(std::chrono::milliseconds(500));\n\
  18   std::cout << \" ENDING UPDATE \" << na << std::endl;\n19 }\n20 \n21 void printNumber(const\
  \ std::string& na){\n22   std::shared_lock<std::shared_mutex> readerLock(mtx);\n\
  23   std::cout << na << \": \" << teleBook[na] << std::endl;\n24 }\n25 \n26 int\
  \ main(){\n27   std::thread t1([&]{printNumber(\"Dijkstra\");});\n28   std::thread\
  \ t2([&]{printNumber(\"Ritchie\");});\n29   std::thread t3([&]{addToBook(\"Scott\"\
  , 1968);});\n30   std::thread t4([&]{printNumber(\"Dijkstra\");});\n31   std::thread\
  \ t5([&]{printNumber(\"Scott\");});\n32   std::thread t6([&]{addToBook(\"Bjarne\"\
  , 1965);});\n33   std::thread t7([&]{printNumber(\"Scott\");});\n34   std::thread\
  \ t8([&]{printNumber(\"Ritchie\");});\n35 \n36   t1.join();\n37   t2.join();\n38\
  \   t3.join();\n39   t4.join();\n40   t5.join();\n41   t6.join();\n42   t7.join();\n\
  43   t8.join();\n44 \n45 }\n```\n\n## 读写锁\n\n第 9 行的 `teleBook` 是共享变量，必须受到保护。八个线程想要读取电话簿；两个线程想要修改它（第\
  \ 31 到 40 行）。为了同时访问电话簿，读取线程使用第 23 行的 `std::shared_lock<std::shared_mutex>>`。这与写入线程需要排他访问临界区域形成对比。排他性由第\
  \ 15 行的 `std::lock_guard<std::shared_mutex>>` 提供的。最后，程序显示更新后的电话簿（第 55 到 58 行）。\n\
  \n\n\n\n# 用于电话簿读写的读-写锁\n\n截图显示读取线程的输出是重叠的，而写入线程是一个接一个执行的。这意味着读取操作是同时进行的。\n\n这太简单了。太简单了。电话簿存在未定义行为。\n\
  \n## 未定义行为\n\n程序存在未定义行为。更准确地说，它存在数据竞态。什么？在继续之前，请停几秒钟思考。顺便说一下，对 `std::cout` 的并发访问并不是问题所在。\n\
  \n数据竞态的特征是至少有两个线程同时访问共享变量，且至少其中一个是写入者。这种场景可能会在程序执行过程中发生。关联容器的特性之一是，使用索引运算符对容器进行读取可能会修改它。如果元素不在容器中，就会发生这种情况。如果电话簿中没有找到“Bjarne”，则会读取访问创建一个\
  \ `(\"Bjarne\", 0)` 的元对。你可以通过将第 40 行的 Bjarne 打印操作放在所有线程（第 31-40 行）之前来强制发生数据竞态。让我们来看看。\n\
  \n你一眼就能在顶部看到，Bjarne 的值为 0。\n\n![程序存在数据竞态](img/Multithreading----readerWriterLocksDataRace.png)\n\
  \n程序存在数据竞态\n\n修复此问题的一种方法是在 `printNumber` 函数中只使用读取操作：\n\n```\n 1 // readerWriterLocksResolved.cpp\n\
  \ 2 \n 3 ...\n 4 \n 5 void printNumber(const std::string& na){\n 6   std::shared_lock<std::shared_timed_mutex>\
  \ readerLock(teleBookMutex);\n 7   auto searchEntry = teleBook.find(na);\n 8   if(searchEntry\
  \ != teleBook.end()){\n 9     std::cout << searchEntry->first << \": \" << searchEntry->second\
  \ << std::endl;\n10   }\n11   else {\n12     std::cout << na << \" not found!\"\
  \ << std::endl;\n13   }\n14 }\n15 \n16 ...\n17 \n18 }\n```\n\n读-写锁已解决\n\n如果键不在电话簿中，我只需将键和文本\
  \ `not found!` 写入控制台。\n\n![数据竞态已解决](img/Multithreading----readerWriterLocksResolved.png)\n\
  \n数据竞态已解决\n\n在第二次程序执行的输出中你可以看到 `Bjarne not found!` 消息。在第一次程序执行中，首先执行了 `addToTeleBook`；因此找到了\
  \ Bjarne。\n\n## 线程初始化\n\n如果变量从不被修改，就不需要使用昂贵的锁或原子变量进行同步。你只需要确保它是以线程安全的方式初始化的。\n\n\
  在 C++ 中以线程安全的方式初始化变量有三种：\n\n*   常量表达式\n*   函数 `std::call_once` 结合标记 `std::once_flag`\n\
  *   具有块作用域静态变量\n\n### 常量表达式\n\n常量表达式是编译器可以在编译时求值的表达式。它们隐式线程安全的。在变量前加上 `constexpr`\
  \ 关键字使该变量成为常量表达式。常量表达式必须立即初始化。\n\n```\nconstexpr double pi = 3.14;\n```\n\n此外，用户定义类型也可以是常量表达式。对于这些类型，在编译时初始化它们必须满足一些限制条件：\n\
  \n*   它们不能有虚方法或虚基类。\n*   它们的构造函数必须是空的且本身必须是常量表达式。\n*   每个基类和每个非静态成员都必须初始化。\n*  \
  \ 它们在编译时可调用的方法必须是常量表达式。\n\n`MyDouble` 的实例满足了所有这些要求。因此，在编译时实例化它们是可能的。这种实例化是线程安全的。\n\
  \n```\n 1 // constexpr.cpp\n 2 \n 3 #include <iostream>\n 4 \n 5 class MyDouble{\n\
  \ 6   private:\n 7     double myVal1;\n 8     double myVal2;\n 9   public:\n10 \
  \    constexpr MyDouble(double v1, double v2): myVal1(v1), myVal2(v2){}\n11    \
  \ constexpr double getSum() const { return myVal1 + myVal2; }\n12 };\n13 \n14 int\
  \ main() {\n15 \n16   constexpr double myStatVal = 2.0;\n17   constexpr MyDouble\
  \ myStatic(10.5, myStatVal);\n18   constexpr double sumStat = myStatic.getSum();\n\
  19 \n20 }\n```\n\n用户定义的常量表达式\n\n### `std::call_once` 和 `std::once_flag`\n\n通过使用\
  \ `std::call_once` 函数，你可以注册一个可调用对象。`std::once_flag` 确保只有一个注册的函数被调用。你可以通过同一个 `std::once_flag`\
  \ 注册额外的函数。该组中只有一个函数会被调用。\n\n`std::call_once` 遵循以下规则：\n\n*   恰好执行函数中的恰好一个函数。哪一个函数被选中执行是未定义的。选定的函数在传递给\
  \ `std::call_once` 调用的线程中运行。\n*   如果函数抛出异常，则 `std::call_once` 可以被再次调用。\n\n\n\n\n\
  `MySingleton::getIstance()` 方法显示单例的地址。\n\n![使用 `std::call_once` 和 `std::once_flag`\
  \ 实现线程安全的单例](img/Multithreading----singletonCallOnce.png)\n\n使用 `std::call_once`\
  \ 和 `std::once_flag` 实现线程安全的单例\n\n### 块作用内的静态变量\n\n块作用内的静态变量只创建一次，且是懒性的。懒性意味着它们在使用时刻才被创建。这一特性是所谓的\
  \ Meyers 单例的基础，以 [Scott Meyers](https://en.wikipedia.org/wiki/Scott_Meyers) 命名。这是\
  \ C++ 中最优雅的单例模式实现。在 C++11 中，块作用内的静态变量有一个额外的保证：它们以线程安全的方式初始化。\n\n以下是线程安全的 Meyers\
  \ 单例模式。\n\n```\n 1 // meyersSingleton.cpp\n 2 \n 3 class MySingleton{\n 4 public:\n\
  \ 5   static MySingleton& getInstance(){\n 6     static MySingleton instance;\n\
  \ 7     return instance;\n 8   }\n 9 private:\n10   MySingleton();\n11   ~MySingleton();\n\
  12   MySingleton(const MySingleton&)= delete;\n13   MySingleton& operator=(const\
  \ MySingleton&)= delete;\n 14 \n15 };\n 16 \n 17 MySingleton::MySingleton()= default;\n\
  \ 18 MySingleton::~MySingleton()= default;\n 19 \n 20 int main(){\n 21 \n 22   MySingleton::getInstance();\n\
  \ 23 \n 24 }\n```\n\n线程安全的 Meyers 单例模式。\n\n`thread_local` 数据没有共享问题。\n\n### 线程本地数据\n\
  \n线程本地数据（称为线程本地存储）为每个线程单独创建。它的行为类似于静态数据，因为它与线程的周期绑定并在首次使用时创建。这意味着命名空间作用范围内或作为类静态成员的线程局部变量在首次使用之前创建，而在函数中声明的线程局部变量在首次使用时创建。线程本地数据仅属于该线程。\n\
  \n```\n 1 // threadLocal.cpp\n 2 \n 3 #include <iostream>\n 4 #include <string>\n\
  \ 5 #include <mutex>\n 6 #include <thread>\n 7 \n 8 std::mutex coutMutex;\n 9\n\
  10 thread_local std::string s(\"hello from \");\n 11 \n12 void addThreadLocal(std::string\
  \ const& s2){\n 13 \n 14   s += s2;\n 15   // protect std::cout\n 16   std::lock_guard<std::mutex>\
  \ guard(coutMutex);\n 17   std::cout << s << std::endl;\n 18   std::cout << \"&s:\
  \ \" << &s << std::endl;\n 19   std::cout << std::endl;\n 20 \n 21 }\n 22 \n 23\
  \ main(){\n 24 \n 25   std::cout << std::endl;\n 26 \n 27   std::thread t1(addThreadLocal,\"\
  t1\"); \n 28   std::thread t2(addThreadLocal,\"t2\"); \n 29   std::thread t3(addThreadLocal,\"\
  t3\"); \n 30   std::thread t4(addThreadLocal,\"t4\"); \n 31 \n 32   t1.join();\n\
  \ 33   t2.join();\n 34   t3.join();\n 35   t4.join();\n 36 \n 37 }\n```\n\n线程本地数据。\n\
  \n通过在第 10 行使用关键字 `thread_local`，创建了线程本地字符串 `s`。线程 `t1` - `t4`（第 27-30 行）使用函数 `addThreadLocal`（第\
  \ 12-21 行）作为其工作包。线程分别获取字符串 `t1` 到 `t4` 作为参数，并将它们添加到线程本地字符串 `s` 中。此外，`addThreadLocal`\
  \ 在第 18 行显示了 `s` 的地址。\n\n![线程本地数据](img/Multithreading----threadLocal.png)\n\n线程本地数据。\n\
  \n程序的输出在第 17 行隐式地、在第 18 行显式地显示这一点。每个字符串 `s` 都创建了一个线程本地字符串。首先，每个输出都显示一个新的线程本地字符串；其次，每个字符串\
  \ `s` 都有不同的地址。\n\n我经常在研讨会上讨论：`static`、`thread_local` 和局部变量之间有什么区别？`static` 变量绑定到主线程的周期，`thread_local`\
  \ 变量绑定到所在线程的周期，而局部变量绑定到其创建时所在的作用范围周期。为了说明我的观点，这里是之前程序 `threadLocal.cpp` 的变体。\n\n\
  ```\n 1 // threadLocalState.cpp\n 2 \n 3 #include <iostream>\n 4 #include <string>\n\
  \ 5 #include <mutex>\n 6 #include <thread>\n 7 \n 8 std::mutex coutMutex;\n 9\n\
  10 thread_local std::string s(\"hello from \");\n 11 \n12 void first(){\n 13   \
  \  s += \"first \";\n 14 }\n```\n\n\n\n\n该程序有两个子线程：`t1` 和 `t2`。它们在第 38 行和第 39 行获取了工作包\
  \ `waitingForWork` 和 `setDataRead`。`setDataReady` 使用条件变量 `condVar` 通知工作准备就：`condVar.notify_one()`。线程\
  \ `t1` 在持有锁的情况下等待其通知：`condVar.wait(lck, []{ return dataReady; })`。发送者和接收者都需要一个锁。对于发送者来说，使用一个\
  \ `std::lock_guard` 就足够了，因为它只调用了一次 `lock` 和 `unlock`。对于接收者来说，则需要 `std::unique_lock`，因为它需要频繁地锁定和解锁其\
  \ `mutex`。\n\n这里是程序的输出。\n\n![使用条件变量同步两个线程](img/Multithreading----conditionVariable.png)\n\
  \n使用条件变量同步两个线程\n\n### 谓词 (The Predicate)\n\n你可能在奇怪为什么 `wait` 调用需要一个谓词，因为你可以在没有谓词的情况下调用\
  \ `wait`。让我们来试一下。\n\n```\n 1 // conditionVariableBlock.cpp\n 2 \n 3 #include <iostream>\n\
  \ 4 #include <condition_variable>\n 5 #include <mutex>\n 6 #include <thread>\n 7\
  \ \n 8 std::mutex mutex_;\n9 std::condition_variable condVar;\n10 \n11 void waitingForWork(){\n\
  12 \n13     std::cout << \"Worker: Waiting for work.\" << std::endl;\n14 \n15  \
  \   std::unique_lock<std::mutex> lck(mutex_);\n16     condVar.wait(lck);       \
  \                   \n17     // do the work\n18     std::cout << \"Work done.\"\
  \ << std::endl;\n19 \n20 }\n21 \n22 void setDataReady(){\n23 \n24     std::cout\
  \ << \"Sender: Data is ready.\"  << std::endl;\n25     condVar.notify_one();   \
  \                     \n26 \n27 }\n28 \n29 int main(){\n30 \n31   std::cout << std::endl;\n\
  32 \n33   std::thread t1(setDataReady);\n34   std::thread t2(waitingForWork);  \
  \             \n35 \n36   t1.join();\n37   t2.join();\n38 \n39   std::cout << std::endl;\n\
  40   \n41 }\n```\n\n### 阻塞条件变量 (Blocking condition variables)\n\n程序的第一次运行似乎工作正常。第二次运行会锁死，因为通知调用（第\
  \ 25 行）发生在线程 `t2`（第 34 行）进入其等待状态（第 16 行）之前。\n\n![使用条件变量的死锁](img/Multithreading----conditionVariableBlock.png)\n\
  \n使用条件变量的死锁\n\n现在很清楚了。谓词是无状态条件变量的一种内存；因此，`wait` 调用总是首先检查谓词。条件变量会受到两种已知现象的影响：丢失唤醒\
  \ (lost wakeup) 和虚假唤醒 (spurious wakeup)。\n\n#### 丢失唤醒与虚假唤醒 (Lost Wakeup and Spurious\
  \ Wakeup)\n\n#### 丢失唤醒 (Lost Wakeup)\n\n丢失唤醒现象是指发送者在接收者到达等待状态之前就发送了通知。结果是通知丢失了。C++\
  \ 标准将条件变量描述为一种同步同步机制：“`condition_variable` 类是一个同步原语，可以用于阻塞一个线程或多个线程**同时**……”。因此，通知丢失了，而接收者一直在等待、等待…………\n\
  \n#### 虚假唤醒 (Spurious Wakeup)\n\n可能会发生接收者在没有通知的情况下被唤醒。至少 [POSIX Threads](https://en.wikipedia.org/wiki/POSIX_Threads)\
  \ 和 [Windows API](https://en.wikipedia.org/wiki/Windows_API) 可能是这些现象的受害者。虚假唤醒的一个原因可能是窃取唤醒\
  \ (stolen wakeup)。这意味着在被唤醒的线程获得运行机会之前另一个线程介入并运行。\n\n### 等待工作流 (The Wait Workflow)\n\
  \n等待线程的工作流相当复杂。\n\n这里是之前示例 `conditionVariable.cpp` 中的第 19 行和第 20 行关键代码。\n\n```\n\
  std::unique_lock<std::mutex> lck(mutex_);\ncondVar.wait(lck, []{ return dataReady;\
  \ });\n```\n\n这两行等同于以下四行：\n\n```\nstd::unique_lock<std::mutex> lck(mutex_);\nwhile\
  \ ( ![]{ return dataReady; }() {\n    condVar.wait(lck);\n}\n```\n\n首先，你必须区分 `std::unique_lock<std::mutex>\
  \ lck(mutex_)` 的第一次调用与条件变量的通知：`condVar.wait(lck)`。\n\n*   `std::unique_lock<std::mutex>\
  \ lck(mutex_)`：在初始处理中，线程锁定 mutex 然后检查谓词 `[]{ return dataReady; }`。\n\n    *   如果谓词调用的结果为\n\
  \n        *   `true`：线程继续工作。\n\n        *   `false`：`condVar.wait()` 解锁 mutex 并将线程置等待（阻塞）状态。\n\
  \n*   `condVar.wait(lck)`：如果条件变量 `condVar` 处于等待状态并收到通知或虚假唤醒，将发生以下步骤。\n\n    *  \
  \ 线程重新获取 mutex 并检查谓词。\n\n### 任务 (Tasks)\n\n除了线程之外，C++ 还有任务。任务带有工作参数，并由两个部分组成：promise\
  \ 和 future。任务需要 `<future>` 头文件。\n\n```\n 1 // asyncVersThread.cpp\n 2 \n3 #include\
  \ <future>\n 4 #include <thread>\n 5 #include <iostream>\n 6 \n7 int main(){\n 8\
  \ \n9   std::cout << std::endl;\n10 \n11   int res;\n12   std::thread t([&]{ res\
  \ = 2000 + 11; });\n13   t.join();\n14   std::cout << \"res: \" << res << std::endl;\n\
  15 \n16   auto fut= std::async([]{ return 2000 + 11; });\n17   std::cout << \"fut.get():\
  \ \" << fut.get() << std::endl;\n18 \n19   std::cout << std::endl;\n20 \n21 }\n\
  ```\n\n`std::async` 与线程\n\n子线程 `t` 和异步函数调用 `std::async` 都计算了 `2000` 和 `11` 的和。创建者线程通过共享变量\
  \ `res` 获取子线程的结果，并在第 14 行显示它。第 16 行的 `std::async` 调用创建了发送者（promise）和接收者（future）之间的数据通道。future\
  \ 通过 `fut.get()`（第 17 行）向数据通道请求结果。这个 `fut.get()` 调用是阻塞的。\n\n基于这个程序，我想明确地强调任务和线程之间的区别。\n\
  \n任务与线程\n\n| 标准 | 线程 | 任务 |\n| --- | --- | --- |\n| 参与者 | 创建者和子线程 | promise 和 future\
  \ |\n| 通信 | 共享变量 | 通信通道 |\n| 线程创建 | 强制 | 可选 |\n| 同步 | 通过 `join()` (等待) | `get` 调用阻塞\
  \ |\n| 子线程中的异常 | 子线程和创建者线程终止 | promise 的返回值 |\n| 通信类型 | 值 | 值、通知和异常 |\n\n线程需要 `<thread>`\
  \ 头文件；任务需要 `<future>` 头文件。\n\n\n\n\n创建线程与被创建线程之间的通信需要使用共享变量。任务通过其隐式保护的数据通道进行通信；因此，任务不能使用像\
  \ mutex 这样的保护机制。\n\n虽然你可以滥用共享可变变量在子线程及其创建者之间进行通信，但任务的通信更加显式。未来（future）只能请求一次任务的结果（通过调用\
  \ `fut.get()`）。调用多次会导致未定义行为。这对于 `std::shared_future`#chap06.xhtml_chapterXXXshared_future)\
  \ 来说并不如此，它可以被被查询多次。\n\n创建者线程通过调用 `join` 等待子线程。未来对象 `fut` 使用 `fut.get()` 调用，该调用会阻塞直到结果可用。\n\
  \n如果在被创建线程中抛出异常，被创建线程将终止，创建线程和整个进程也会终止。相比之下，承诺（promise）可以将异常发送给未来，由未来来必须处理该异常。\n\
  \n一个承诺可以为一个或多个未来服务。它可以发送值、异常或仅发送通知。你可以将它们作为条件变量的安全替代品。\n\n`std::async` 是创建未来的最简单的方法。\n\
  \n## `std::async`\n\n`std::async` 的行为类似于异步函数调用。该函数调用接受一个[可对象 及其参数。`std::async` 是一个变变模板，因此可以接受任意数量的参数。对\
  \ `std::async` 的调用返回一个未来对象 `fut`。这就是你通过 `fut.get()` 获取结果的句柄。\n\n你可以为 `std::async`\
  \ 指定启动策略。\n\n### 启动策略\n\n通过启动策略，你可以显式指定异步调用应该在同一线程中执行（`std::launch::deferred`）还是在另一个线程中执行（`std::launch::async`）。\n\
  \n调用 `auto fut = std::async(std::launch::deferred, ... )` 的特殊之处在于，承诺不会立即执行。`fut.get()`\
  \ 调用会惰性地启动承诺。这意味着只有当未来通过 `fut.get()` 请求结果时，承诺才会运行。\n\n```\n 1 // asyncLazy.cpp\n\
  \ 2 \n 3 #include <chrono>\n 4 #include <future>\n 5 #include <iostream>\n 6 \n\
  \ 7 int main(){\n 8 \n 9   std::cout << std::endl;\n10 \n11   auto begin= std::chrono::system_clock::now();\n\
  12 \n13   auto asyncLazy=std::async(std::launch::deferred,\n14                 \
  \            []{ return std::chrono::system_clock::now(); });\n15 \n16   auto asyncEager=std::async(std::launch::async,\n\
  17                              []{ return std::chrono::system_clock::now(); });\n\
  18 \n19   std::this_thread::sleep_for(std::chrono::seconds(1));\n20 \n21   auto\
  \ lazyStart= asyncLazy.get() - begin;\n22   auto eagerStart= asyncEager.get() -\
  \ begin;\n23 \n24   auto lazyDuration= std::chrono::duration<double>(lazyStart).count();\n\
  25   auto eagerDuration=  std::chrono::duration<double>(eagerStart).count();\n26\
  \ \n27   std::cout << \"asyncLazy evaluated after : \" << lazyDuration \n28    \
  \         << \" seconds.\" << std::endl;\n29   std::cout << \"asyncEager evaluated\
  \ after: \" << eagerDuration \n30             << \" seconds.\" << std::endl;\n31\
  \ \n32   std::cout << std::endl;\n33 \n34 }\n```\n\n未来的急进与惰性评估\n\n两个 `std::async`\
  \ 调用（第 13 行和第 16 行）都返回当前的时间点。然而，第一个调用是惰性的，而第二个是急进的。第 19 行的的一秒简短睡眠使得这一点显而易见。第 21\
  \ 行的调用 `asyncLazy.get()` 触发了第 13 行承诺的执行——结果在经过一秒短暂休眠后（第 19 行）变得可用。这对于 `asyncEager`\
  \ 并非如此。`asyncEager.get()` 从立即执行的工作包中获取结果。\n\n这里是数据。\n\n![惰性与急进评估](img/Multithreading----asyncLazy.png)\n\
  \n惰性与急进评估\n\n你不需要将未来绑定到变量。\n\n### 发射后后不管 (Fire and Forget)\n\n发射后后不管的未来是特殊的未来。它们直接执行，因为它们的未来没有绑定到变量。对于发射后后不管的未来，承诺必须在独立的线程中运行，以便立即开始工作。这是通过\
  \ `std::launch::async` 策略实现的。\n\n让我们比较普通未来和发射后后不管的未来。\n\n```\nauto fut= std::async([]{\
  \ return 2011; });\nstd::cout << fut.get() << std::endl;         \n\nstd::async(std::launch::async,\
  \ \n           []{ std::cout << \"fire and forget\" << std::endl; });\n```\n\n发射后后不管的未来看起来很有前景，但有一个巨大的缺点。由\
  \ `std::async` 创建的未来等待其析构函数，直到其承诺完成。在这种背景下，等待析构函数会阻塞进度。当你使用发射后后不管的未来时，这一点变得更加明显。\n\
  \n```\n 1 // fireAndForget.cpp\n 2 \n3 #include <chrono>\n 4 #include <future>\n\
  \ 5 #include <iostream>\n 6 #include <thread>\n 7 \n 8 int main(){\n 9 \n10   std::cout\
  \ << std::endl;\n11 \n12   auto fut= std::async([]{ return 2011; });\n13   std::cout\
  \ << fut.get() << std::endl;         \n14 \n15   std::async(std::launch::async,\
  \ \n16               []{ std::cout << \"fire and forget\" << std::endl; });\n17\
  \ \n18   std::this_thread::sleep_for(std::chrono::seconds(1));\n19 \n20 }\n```\n\
  \n发射后后不管的未来\n\n程序在线程中执行。结果未来是发射后后不管。这就是你在程序输出中看到的。\n\n![发射后后不管的未来](img/Multithreading----asyncLazy.png)\n\
  \n`std::async` 是分更大任务的方便机制。\n\n### 并发计算\n\n标量积可以分布在四个调用中。\n\n```cpp\n 1 // dotProductAsync.cpp\n\
  \ 2 \n3 #include <iostream>\n 4 #include <future>\n 5 #include <random>\n 6 #include\
  \ <vector>\n 7 #include <numeric>\n 8 \n9 using std;\n10 \n11 static const int NUM=1000000;\n\
  12 \n13 long long getDotProduct(vector<int>& v, vector<int>& w){\n14   \n15   auto\
  \ vSize = v.size();\n16   \n17   auto future1 = async([&]{ \n18     return inner_product(&v[0],\
  \ &v[vSize/4], &w[0], 0LL);\n19   });\n20   \n21   auto future2 = async([&]{ \n\
  22     return inner_product(&v[vSize/4], &v[vSize/2], &w[vSize/4], 0LL);\n23   });\n\
  24   \n25   auto future3 = async([&]{ \n26     return inner_product(&v[vSize/2],\
  \ &v[vSize*3/4], &w[vSize/2], 0LL);\n27   });\n28   \n29   auto future4 = async([&]{\
  \ \n30     return inner_product(&v[vSize*3/4], &v[vSize], &w[vSize*3/4], 0LL);\n\
  31   });\n32   \n33   return future1.get() + future2.get() + future3.get() + future4.get();\n\
  34 }\n35 \n36 \n37 int main(){\n38 \n39   cout << endl;\n40 \n41   random_device\
  \ seed;\n42 \n43   // generator\n44   mt19937 engine(seed());\n45 \n46   // distribution\n\
  47   uniform_int_distribution<int> dist(0, 100);\n48 \n49   // fill the vectors\n\
  50   vector<int> v, w;\n51   v.reserve(NUM);\n52   w.reserve(NUM);\n53   for (int\
  \ i=0; i< NUM; ++i){\n54     v.push_back(dist(engine));\n55     w.push_back(dist(engine));\n\
  56   }\n57 \n58   cout << \"getDotProduct(v, w): \" << getDotProduct(v, w) << endl;\n\
  59 \n60   cout << endl;\n61 \n62 }\n```\n\n四个未来的点积\n\n\n\n\n\n该程序使用了 `random` 和\
  \ `time` 库的功能。这两个库都是 `C++11` 的一部分。两个向量 `v` 和 `w` 被创建并用随机数填充（第 50 - 56 行）。每个向量都获得了（第\
  \ 53 - 56 行）一亿个元素。第 54 行和 55 行中的 `dist(engine)` 生成随机数，这些数字在 0 到 100 的范围内均匀分布。标量积计算在\
  \ `getDotProduct` 中进行（第 13 - 34 行）。在内部，`std::async` 使用了标准模板库算法 `std::inner_product`。返回语句累加了所有未来（future）的结果。\n\
  \n![带有四个异步函数调用的标量积](img/Multithreading----dotProductAsync.png)\n\n带有四个异步函数调用的标量积\n\
  \n`std::packaged_task` 通常也用于执行并发计算。\n\n## `std::packaged_task`\n\n`std::packaged_task`\
  \ `pack` 是对可调用对象（callable）的包装器，以便异步调用。通过调用 `pack.get_future()`，你可以获取关联的 future。在\
  \ `pack` 上调用运算符（`pack()`）会执行 `std::packaged_task`，从而执行可调用对象。\n\n处理 `std::packaged_task`\
  \ 通常包含四个步骤：\n\nI. 包装你的工作：\n\n```\n std::packaged_task<int(int, int)> sumTask([](int\
  \ a, int b){ return a + b; });\n```\n\nII. 创建一个 future：\n\n```\n std::future<int>\
  \ sumResult= sumTask.get_future();\n```\n\nIII. 执行计算：\n\n```\n sumTask(2000, 11);\n\
  ```\n\nIV. 查询结果：\n\n```\n sumResult.get();\n```\n\n这是一个展示这四个步骤的示例。\n\n```\n 1 //\
  \ packagedTask.cpp\n 2 \n 3 #include <utility>\n 4 #include <future>\n 5 #include\
  \ <iostream>\n 6 #include <thread>\n 7 #include <deque>\n 8 \n 9 class SumUp{\n\
  10   public:\n 1     int operator()(int beg, int end){\n 12       long long int\
  \ sum{0};\n 13       for (int i = beg; i < end; ++i ) sum += i;\n 14       return\
  \ sum;\n 15     }\n 16 };\n 17 \n 18 int main(){\n 19 \n 20   std::cout << std::endl;\n\
  \ 21 \n 22   SumUp sumUp1;\n 23   SumUp sumUp2;\n 24   SumUp sumUp3;\n 25   SumUp\
  \ sumUp4;\n 26 \n 27   // wrap the tasks\n 28   std::packaged_task<int(int, int)>\
  \ sumTask1(sumUp1);\n 29   std::packaged_task<int(int, int)> sumTask2(sumUp2);\n\
  \ 30   std::packaged_task<int(int, int)> sumTask3(sumUp3);\n 31   std::packaged_task<int(int,\
  \ int)> sumTask4(sumUp4);\n 33 \n 33   // create the futures\n 34   std::future<int>\
  \ sumResult1 = sumTask1.get_future();\n 35   std::future<int> sumResult2 = sumTask2.get_future();\n\
  \ 36   std::future<int> sumResult3 = sumTask3.get_future();\n 37   std::future<int>\
  \ sumResult4 = sumTask4.get_future();\n 38 \n 39   // push the tasks on the container\n\
  \ 40   std::deque<std::packaged_task<int(int,int)>> allTasks;\n 41   allTasks.push_back(std::move(sumTask1));\n\
  \ 42   allTasks.push_back(std::move(sumTask2));\n 43   allTasks.push_back(std::move(sumTask3));\n\
  \ 44   allTasks.push_back(std::move(sumTask4));\n 45   \n 46   int begin{1};\n 47\
  \   int increment{2500};\n 48   int end = begin + increment;\n 49 \n 50   // perform\
  \ each calculation in a separate thread\n 51   while (not allTasks.empty()){\n 52\
  \     std::packaged_task<int(int, int)> myTask = std::move(allTasks.front());\n\
  \ 53     allTasks.pop_front();\n 54     std::thread sumThread(std::move(myTask),\
  \ begin, end);\n 55     begin = end;\n 56     end += increment;\n 57     sumThread.detach();\n\
  \ 58   }\n 59 \n 60   // pick up the results\n 61   auto sum = sumResult1.get()\
  \ + sumResult2.get() + \n 62              sumResult3.get() + sumResult4.get();\n\
  \ 63 \n 64   std::cout << \"sum of 0 .. 10000 = \" << sum << std::endl;\n 65 \n\
  \ 66   std::cout << std::endl;\n 67 }\n```\n\n使用 `std::packaged_task` 的并发\n\n该程序的目的是借助\
  \ `std::packaged_task` 在每个单独线程中计算从 0 到 10000 的数字之和。关联的 future 被用于累加最终结果。奇怪的是：\n\n\
  I. **包装任务**：我在 `std::packaged_task` 中包装工作（第 28 - 31 行）。工作是 `SumUp` 类的实例（第 9 - 16\
  \ 行）。调用运算符（第 11 - 15 行）累加从 `beg` 到 `end` 的所有数字。`std::packaged_task`（第 28 - 31 行）可以处理两个\
  \ `int` 并返回一个 `int`：`int(int, int)`。\n\nII. **创建 future**：我必须借助 `std::packaged_task`\
  \ 创建 future 对象（第 34 到 37 行）。future 的类型在 promise 中显式定义：`std::future<int> sumResult1\
  \ = sumTask1.get_future()`，但编译器也可以这样做：`auto sumResult1 = sumTask1.get_future()`。\n\
  \nIII. **执行计算**：现在开始计算。`packaged_task` 被移动到 `std::deque` 中（第 40 - 44 行）。在 `while`\
  \ 循环中，每个 `packaged_task`（第 51 - 58 行）被执行。为了这样做，我将 `std::deque` 的头部（第 52 行）移动到新线程（第\
  \ 54 行）中并让它在后台运行（第 57 行）。`packaged_task` 对象是不可拷贝的。这就是我在第 52 行和第 54 行使用移动语义的原因。这种限制适用于\
  \ promise、future 和线程。唯一的例外是 `std::shared_future`。\n\nIV. **获取结果**：在最后一步，我获取所有 future\
  \ 的值并求和（第 61 行）。这是并发计算的总体结果。\n\n![std::packaged_task 的累加](img/Multithreading----dotProduct.png)\n\
  \n\n\n\n\n函数 `calcProduct`（第 9 行）获取两个参数：任务和 int 型对的向量。它使用该任务计算每个 int 型对的乘积（第 13\
  \ 行）。最后，任务在第 16 行被重置。`calcProduct` 在主线程（第 34 行）和独立线程（第 38 行）中运行。这里是程序的输出。\n\n![Reuse\
  \ of a `std::packaged_task`](img/Multithreading----packagedTaskReuse.png)\n\n`std::packaged_task`\
  \ 的复用\n\n## `std::promise` 和 `std::future`\n\n`std::promise` 和 `std::future` 模板类为你提供了对任务的完全控制权。\n\
  \nPromise 和 future 是一对强大的组合。Promise 可以向共享数据通道放入一个值、一个异常或一个简单的通知。一个 promise 可以为多个\
  \ `std::shared_future` future 服务。在 C++20/23 中，我们可能会获得可以组合的扩展 future。\n\n这里是 `std::promise`\
  \ 和 `std::future` 用法的入门示例。两个通信端点都可以移动到单独的线程，因此通信是在线程之间进行的。\n\n```\n 1 // promiseFuture.cpp\n\
  \ 2 \n 3 #include <future>\n 4 #include <iostream>\n 5 #include <thread>\n 6 #include\
  \ <utility>\n 7 \n 8 void product(std::promise<int>&& intPromise, int a, int b){\n\
  \ 9   intPromise.set_value(a*b);\n10 }\n11 \n12 struct Div{\n13 \n14   void operator()\
  \ (std::promise<int>&& intPromise, int a, int b) const {\n15     intPromise.set_value(a/b);\n\
  16   }\n17 \n18 };\n19 \n20 int main(){\n21 \n22   int a = 20;\n23   int b = 10;\n\
  24 \n25   std::cout << std::endl;\n26 \n27   // define the promises\n28   std::promise<int>\
  \ prodPromise;\n29   std::promise<int> divPromise;\n30 \n31   // get the futures\n\
  32   std::future<int> prodResult = prodPromise.get_future();\n33   std::future<int>\
  \ divResult = divPromise.get_future();\n34 \n35   // calculate the result in a separate\
  \ thread\n36   std::thread prodThread(product, std::move(prodPromise), a, b);\n\
  37   Div div;\n38   std::thread divThread(div, std::move(divPromise), a, b);\n39\
  \ \n40   // get the result\n41   std::cout << \"20*10 = \" << prodResult.get() <<\
  \ std::endl;\n42   std::cout << \"20/10 = \" << divResult.get() << std::endl;\n\
  43 \n44   prodThread.join();\n45 \n46   divThread.join();\n47 \n48   std::cout <<\
  \ std::endl;\n49 \n50 }\n```\n\n`std::promise` 和 `std::future` 的用法\n\n线程 `prodThread`（第\
  \ 36 行）获取函数 `product`（第 8-10 行）、`prodPromise`（第 32 行）以及数字 `a` 和 `b`。要理解 `prodThread`\
  \ 的参数，你需要查看函数的签名。`prodThread` 的第一个参数是一个可调用对象。这就是之前提到的函数 `product`。函数 `product` 需要一个右值引用类型的\
  \ promise（`std::promise<int>&& intPromise`）和两个数字。这些是 `prodThread` 的最后三个参数。第 36 行中的\
  \ `std::move` 创建了一个右值引用。剩下的部分易于理解。`divThread`（第 38 行）除两个数字 `a` 和 `b`。为了完成工作，它使用了\
  \ `Div` 类的实例 `div`（第 12-18 行）。`div` 是一个函数对象的实例。\n\nfuture 通过调用 `prodResult.get()`\
  \ 和 `divResult.get()` 获取结果。\n\n![Division and multiplikation with tasks](img/Multithreading----promiseFuture.png)\n\
  \n使用任务进行除法和乘法\n\n### `std::promise`\n\n`std::promise` 允许你设置一个值、一个通知或一个异常。此外，promise\
  \ 还可以延迟的方式提供其结果。\n\n`std::promise` 的方法\n\n| 方法 | same |\n| --- | --- |\n| `prom.swap(prom2)`\
  \ 和 | 交换 promise。 |\n| `std::swap(prom, prom2)` | |\n| `prom.get_future()` | 返回\
  \ future。 |\n| `prom.set_value(val)` | 设置值。 |\n| `prom.set_exception(ex)` | 设置异常。\
  \ |\n| `prom.set_value_at_thread_exit(val)` | 存储该值并在 promise 退出时使其准备就绪。 |\n| `prom.set_exception_at_thread_exit(ex)`\
  \ | 存储异常并在 promise 退出时使其准备就绪。 |\n\n### `std::future`\n\n`std::future` 允许你：\n\n*\
  \   获取结果。\n*   询问结果是否可用。\n*   等待结果。\n\n`future` 的方法\n\n| 方法 | 描述 |\n| --- | ---\
  \ |\n| `fut.share()` | 返回一个共享 future。 |\n| `fut.valid()` | 检查 future 是否有效。 |\n|\
  \ `fut.get()` | 返回结果。 |\n| `fut.wait()` | 等待结果。 |\n| `fut.wait_for(relTime)` | 等待相对持续时间。\
  \ |\n| `fut.wait_until(absTime)` | 等待绝对时间。 |\n\n### `std::future_status`\n\n`future_status`\
  \ (#chap10.xhtml_chapterXXXExtendedSSSFutures) 定义了可能的状态：\n\n```\nenum class future_status\
  \ {\n    ready,\n    timeout,\n    deferred\n};\n```\n\nfuture 或 shared future 的状态\n\
  \n| 状态 | 描述 |\n| --- | --- |\n| `deferred` | future 尚未开始。 |\n| `ready` | 结果已就绪。\
  \ |\n| `timeout` | 超时。 |\n\n等待 promise\n\n当 future `fut` 等待 promise 时，它可以执行*其他事情*。\n\
  \n等待 promise\n\n如果 future `fut` 多次请求结果，将抛出 `std::future_error` 异常。\n\n\n\n\n\n`std::shared_future`\
  \ 的处理是特殊的。以下程序直接创建了一个 `std::shared_future`。\n\n```cpp\n 1 // sharedFuture.cpp\n\
  \ 2 \n 3 #include <future>\n 4 #include <iostream>\n 5 #include <thread>\n 6 #include\
  \ <utility>\n 7 \n 8 std::mutex coutMutex;\n 9 \n10 struct Div{\n11 \n12   void\
  \ operator()(std::promise<int>&& intPromise, int a, int b){\n13     intPromise.set_value(a/b);\n\
  14   }\n15 \n16 };\n17 \n18 struct Requestor{\n19 \n20   void operator ()(std::shared_future<int>\
  \ shaFut){\n21 \n22     // lock std::cout\n23     std::lock_guard<std::mutex> coutGuard(coutMutex);\n\
  24 \n25     // get the thread id\n26     std::cout << \"threadId(\" << std::this_thread::get_id()\
  \ << \"): \" ;\n27 \n28     std::cout << \"20/10= \" << shaFut.get() << std::endl;\n\
  29 \n30   }\n31 \n32 };\n33 \n34 int main(){\n35 \n36   std::cout << std::endl;\n\
  37 \n38   // define the promises\n39   std::promise<int> divPromise;\n40 \n41  \
  \ // get the futures\n42   std::shared_future<int> divResult = divPromise.get_future();\n\
  43 \n44   // calculate the result in a separat thread\n45   Div div;\n46   std::thread\
  \ divThread(div, std::move(divPromise), 20, 10);\n47 \n48   Requestor req;\n49 \
  \  std::thread sharedThread1(req, divResult);\n50   std::thread sharedThread2(req,\
  \ divResult);\n51   std::thread sharedThread3(req, divResult);\n52   std::thread\
  \ sharedThread4(req, divResult);\n53   std::thread sharedThread5(req, divResult);\n\
  54 \n55   divThread.join();\n56 \n57   sharedThread1.join();\n58   sharedThread2.join();\n\
  59   sharedThread3.join();\n60   sharedThread4.join();\n61   sharedThread5.join();\n\
  62 \n63   std::cout << std::endl;\n64 \n65 }\n```\n\n### 使用 `std::shared_future`\
  \ 获取 future\n\n在当前示例中，promise 和 future 的工作包都是函数对象。在第 46 行中，`divPromise` 被移动并在线程\
  \ `divThread` 中执行。相应地，`std::shared_future` 在所有五个线程中被复制（第 57 - 61 行）。有必要再次强调这一点。与只能移动的\
  \ `std::future` 对象不同，你可以拷贝一个 `std::shared_future` 对象。\n\n主线程在第 57 到 61 行等待其子线程完成工作并显示它们的结果。\n\
  \n![获取 `std::shared_future`](img/Multithreading----sharedFuture.png)\n\n### 获取 `std::shared_future`\n\
  \n正如我之前提到的，你可以通过使用 `std::future` 的方法 `share` 从一个 `std::future` 创建 `std::shared_future`。\n\
  \n```cpp\n 1 // sharedFutureFromFuture.cpp\n 2 \n 3 #include <future>\n 4 #include\
  \ <iostream>\n 5 #include <thread>\n 6 #include <utility>\n 7 \n 8 std::mutex coutMutex;\n\
  \ 9 \n10 struct Div{\n11 \n12   void operator()(std::promise<int>&& intPromise,\
  \ int a, int b){\n13     intPromise.set_value(a/b);\n14   }\n15 \n16 };\n17 \n18\
  \ struct Requestor{\n19 \n20   void operator ()(std::shared_future<int> shaFut){\n\
  21 \n22     // lock std::cout\n23     std::lock_guard<std::mutex> coutGuard(coutMutex);\n\
  24 \n25     // get the thread id\n26     std::cout << \"threadId(\" << std::this_thread::get_id()\
  \ << \"): \" ;\n27 \n28     std::cout << \"20/10= \" << shaFut.get() << std::endl;\n\
  29 \n30   }\n31 \n32 };\n33 \n34 int main(){\n35 \n36   std::cout << std::boolalpha\
  \ << std::endl;\n37 \n38   // define the promises\n39   std::promise<int> divPromise;\n\
  40 \n41   // get the future\n42   std::future<int> divResult = divPromise.get_future();\n\
  43   \n44   std::cout << \"divResult.valid(): \" << divResult.valid() << std::endl;\n\
  45 \n46   // calculate the result in a separat thread\n47   Div div;\n48   std::thread\
  \ divThread(div, std::move(divPromise), 20, 10);\n49 \n50   std::cout << \"divResult.valid():\
  \ \" << divResult.valid() << std::endl;\n51 \n52   std::shared_future<int> sharedResult\
  \ = divResult.share();\n53 \n54   std::cout << \"divResult.valid(): \" << divResult.valid()\
  \ << \"\\n\";\n55 \n56   Requestor req;\n57   std::thread sharedThread1(req, sharedResult);\n\
  58   std::thread sharedThread2(req, sharedResult);\n59   std::thread sharedThread3(req,\
  \ sharedResult);\n60   std::thread sharedThread4(req, sharedResult);\n61   std::thread\
  \ sharedThread5(req, sharedResult);\n62 \n63   divThread.join();\n64 \n65   sharedThread1.join();\n\
  66   sharedThread2.join();\n67   sharedThread3.join();\n68   sharedThread4.join();\n\
  69   sharedThread5.join();\n70 \n71   std::cout << std::endl;\n72 }\n```\n\n###\
  \ 从 `std::future` 创建 `std::shared_future`\n\n对 `std::future` 的前两次 `divResult.valid()`\
  \ 调用返回 `true`。在第 52 行调用 `divResult.share()` 之后发生了变化，因为该调用转移了共享状态。\n\n![创建一个 `std::shared_future`](img/Multithreading----sharedFuture.png)\n\
  \n### 创建 `std::shared_future`\n\n#### 异常\n\n如果 `std::async` 或 `std::packaged_task`\
  \ 使用的可调用对象抛出错误，异常将存储在共享状态中。当 future `fut` 调用 `get()` 时，异常会被重新抛出，future 必须处理它。\n\n\
  `std::promise` `prom` 提供了相同的功能，通过方法 `prom.set_value(std::current_exception())` 将异常设置为共享状态。\n\
  \n数字除以 0 是未定义行为。`executeDivision` 函数显示结果或异常。\n\n```cpp\n 1 // promiseFutureException.cpp\n\
  \ 2 \n3 #include <exception>\n 4 #include <future>\n 5 #include <iostream>\n 6 #include\
  \ <thread>\n 7 #include <utility>\n 8 \n9 struct Div{\n10   void operator()(std::promise<int>&&\
  \ intPromise, int a, int b){\n11     try{\n12       if ( b==0 ){\n13           std::string\
  \ errMess = std::string(\"Illegal division by zero: \") + \n14  std::to_string(a)\
  \ + \"/\" + std::to_string(b);\n15           throw std::runtime_error(errMess);\n\
  16       }\n17       intPromise.set_value(a/b);\n18     }\n19     catch (...){\n\
  20       intPromise.set_exception(std::current_exception());\n21     }\n22   }\n\
  23 };\n24 \n25 void executeDivision(int nom, int denom){\n26   std::promise<int>\
  \ divPromise;\n27   std::future<int> divResult= divPromise.get_future();\n28 \n\
  29   Div div;\n30   std::thread divThread(div,std::move(divPromise), nom, denom);\n\
  31 \n32   // get the result or the exception\n33   try{\n34     std::cout << nom\
  \ << \"/\" << denom << \" = \" << divResult.get() << std::endl;\n35   }\n36   catch\
  \ (std::runtime_error& e){\n37     std::cout << e.what() << std::endl;\n38   }\n\
  39 \n40   divThread.join();\n41 }\n42 \n43 int main(){\n44     \n45   std::cout\
  \ << std::endl;\n46 \n47   executeDivision(20, 0);\n48   executeDivision(20, 10);\n\
  49 \n50   std::cout << std::endl;\n51     \n52 }\n```\n\n#### 返回异常\n\npromise 处理分母为\
  \ 0 的问题。如果分母为 0，它将异常设置为返回值：第 20 行的 `intPromise.set_exception(std::current_exception())`。future\
  \ 必须在其 try-catch 块（第 33 - 38 行）中处理异常。\n\n这里是程序的输出。\n\n![使用 `std::promise` 和 `std::future`\
  \ 处理异常](img/Multithreading----promiseFutureException.png)\n\n#### 使用 `std::promise`\
  \ 和 `std::future` 处理异常\n\n如果在调用 `std::packaged_task` 之前没有调用 `set` 方法就销毁了它，一个错误代码为\
  \ `std::future_errc::broken_promise` 的 `std::future_error` 异常将存储在共享状态中。\n\n####\
  \ 通知\n\n任务是条件变量的安全替代品。如果你使用 promise 和 future 来同步线程，它们与条件变量有许多共同点。大多数情况下，promise\
  \ 和 future 是更好的选择。\n\n在向你展示示例之前，这里有一个大局。\n\n条件变量与任务\n\n| **标准** | **条件变量** | **任务**\
  \ |\n| --- | --- | --- |\n| 多次同步 | 是 |否 |\n| 临界区 | 是 |否 |\n| 接收端错误处理 | 否 | 是 |\n\
  | 虚假唤醒 | 是 | 否 |\n| 丢失唤醒 | 是 | 否 |\n\n\n\n\n条件变量（condition variable）相比于 promise\
  \ 和 future 的优势在于，你可以使用条件变量进行多次线程同步。相比之下，promise 只能发送一次通知，因此你必须使用更多的 promise 和 future\
  \ 对来实现条件变量的功能。如果你只对一次同步使用条件变量，那么以正确的方式使用条件变量将具有挑战性得多。一个 promise 和 future 对不需要共享变量，因此不需要锁，而且也不易于产生虚假唤醒或丢失唤醒。此外，任务可以处理异常。有许多理由优先选择任务而不是条件变量。\n\
  \n你还记得使用条件变量 有多困难吗？如果不记得，这里是同步两个线程所需的关键部分。\n\n```cpp\nvoid waitingForWork(){\n \
  \   std::cout << \"Worker: Waiting for work.\" << std::endl;\n\n    std::unique_lock<std::mutex>\
  \ lck(mutex_);\n    condVar.wait(lck, []{ return dataReady; });\n    doTheWork();\n\
  \    std::cout << \"Work done.\" << std::endl;\n}\n\nvoid setDataReady(){\n    std::lock_guard<std::mutex>\
  \ lck(mutex_);\n    dataReady=true;\n    std::cout << \"Sender: Data is ready.\"\
  \  << std::endl;\n    condVar.notify_one();\n}\n```\n\n`setDataReady` 函数执行同步的通知部分——`waitingForWork`\
  \ 函数执行同步的等待部分。\n\n以下使用任务实现的相同流程。\n\n```cpp\n 1 // promiseFutureSynchronise.cpp\n\
  \ 2 \n 3 #include <future>\n 4 #include <iostream>\n 5 #include <utility>\n 6 \n\
  \ 7 void doTheWork(){\n 8   std::cout << \"Processing shared data.\" << std::endl;\n\
  \ 9 }\n10 \n11 void waitingForWork(std::future<void>&& fut){\n12 \n13     std::cout\
  \ << \"Worker: Waiting for work.\" << std::endl;\n14     fut.wait();\n15     doTheWork();\n\
  16     std::cout << \"Work done.\" << std::endl;\n17 \n18 }\n19 \n20 void setDataReady(std::promise<void>&&\
  \ prom){\n21 \n22     std::cout << \"Sender: Data is ready.\"  << std::endl;\n23\
  \     prom.set_value();\n24 \n25 }\n26 \n27 int main(){\n28 \n29   std::cout <<\
  \ std::endl;\n30 \n31   std::promise<void> sendReady;\n32   auto fut = sendReady.get_future();\n\
  33 \n34   std::thread t1(waitingForWork, std::move(fut));\n35   std::thread t2(setDataReady,\
  \ std::move(sendReady));\n36 \n37   t1.join();\n38   t2.join();\n39 \n40   std::cout\
  \ << std::endl;\n41 \n42 }\n```\n\n### 使用任务进行线程同步\n\n这相当简单。\n\n得于 `sendReady`（第\
  \ 32 行），你得到了一个 future `fut`（第 33 行）。promise 通过其返回值 `void`（`std::promise<void> sendReady`）进行通信，表明它仅能发送通知。两个通信端都被移动到线程\
  \ `t1` 和 `t2` 中（第 35 和第 36 行）。future 使用调用 `fut.wait()`（第 15 行）等待 promise 的通知：`prom.set_value()`（第\
  \ 24 行）。\n\n程序的结构和输出与条件变量章节中的对应程序匹配。\n\n![作为条件变量的 `std::promise` 和 `std::future`](img/Multithreading----promiseFutureSynchronise.png)\n\
  \n作为条件变量的 `std::promise` 和 `std::future`\n\n## 标准模板库的并行算法\n\n标准模板库拥有超过 100 种用于搜索、计数以及操作范围及其元素的算法。在\
  \ C++17 中，其中 69 种算法有了新的重载，并添加了 8 个新算法。这些重载和新算法可以通过所谓的执行策略来调用。\n\n![C++17 的并行算法](img/timeline----timeline17.png)\n\
  \nC++17 的并行算法\n\n通过使用执行策略，你可以指定算法应该是顺序执行、并行执行还是带有向量化的并行执行。要使用执行策略，你需要包含头文件 `<execution>`。\n\
  \n#### 执行策略\n\n标准定义了三种执行策略：\n\n* `std::execution::sequenced_policy`\n* `std::execution::parallel_policy`\n\
  * `std::execution::parallel_unsequenced_policy`\n\n相应的策略标签指定了程序应该顺序执行、并行执行还是带有向量化的并行执行。\n\
  \n* `std::execution::seq`：顺序运行程序\n* `std::execution::par`：在多个线程上并行运行程序\n* `std::execution::par_unseq`：在多个线程上并行运行程序并允许单个循环的交错执行；允许带有\
  \ [SIMD](https://en.wikipedia.org/wiki/SIMD)扩展（**S**ingle **I**nstruction **M**ultiple\
  \ **D**ata）的向量化版本。\n\n执行策略的使用允许你指定算法是顺序执行、并行执行还是带有向量化的并行执行。`std::execution::par`\
  \ 或 `std::execution::par_unseq` 策略允许算法以向量化的方式运行。这是一种许可，而非要求。\n\n以下代码段应用了所有执行策略。\n\
  \n```cpp\n 1 std::vector<int> v = {1, 2, 3, 4, 5, 6, 7, 8};\n 2 \n 3 // 标准排序\n 4\
  \ std::sort(v.begin(), v.end());\n 5 \n 6 // 顺序执行\n 7 std::sort(std::execution::seq,\
  \ v.begin(), v.end());\n 8 \n 9 // 允许执行\n10 std::sort(std::execution::par, v.begin(),\
  \ v.end());\n11 \n12 // 并行且向量化的执行\n13 std::sort(std::execution::par_unseq, v.begin(),\
  \ v.end());\n```\n\n### 执行策略\n\n示例显示了你仍然可以使用经典的 `std::sort`（第 4 行）。此外，在 C++17 中，你可以显式指定使用顺序（第\
  \ 7 行）、并行（第 10 行）还是并行且向量化的（第 13 行）版本。\n\n#### 并行与向量化执行\n\n算法是否以并行和向量化的方式运行取决于许多因素。例如，它取决于\
  \ CPU 和操作系统是否支持 SIMD 指令。此外，它还取决于你翻译代码时使用的编译器和优化级别。\n\n以下示例展示了一个填充向量的简单循环。\n\n```cpp\n\
  \ 1 const int SIZE= 8;\n 2 \n 3 int vec[] = {1, 2, 3, 4, 5, 6, 7, 8};\n 4 int res[]\
  \ = {0, 0, 0, 0, 0, 0, 0, 0};\n 5 \n 6 int main(){\n 7     for (int i = 0; i < SIZE;\
  \ ++i) {\n 8         res[i] = vec[i]+5;\n 9     }\n10 }\n```\n\n填充向量\n\n8 行是这个小示例中的关键行。得于[编译器浏览器](https://godbolt.org/)，我们可以更仔细地查看\
  \ clang 3.6 生成的汇编指令。\n\n##### 未优化\n\n这里是汇编指令。每次加法都是顺序执行的。\n\n![顺序执行](img/ParallelSTL----seq.png)\n\
  \n顺序执行\n\n##### 最高优化\n\n通过使用最高优化级别 `-O3`，使用了特殊的寄存器（如 `xmm0`），它可以容纳 128 位或 4 个 `int`。这种特殊寄存器意味着加法在向量的四个元素上并行进行。\n\
  \n![向量化执行](img/ParallelSTL----vec.png)\n\n向量化执行\n\n没有执行策略的算法重载与带有顺序执行策略 `std::execution::seq`\
  \ 的算法重载在某方面有所不同：异常。\n\n#### 异常\n\n\n\n\n在使用带有执行策略的算法期间如果发生异常，将调用 [`std::terminate`](https://en.cppreference.com/w/cpp/error/terminate)。`std::terminate`\
  \ 会调用已安装的 [`std::terminate_handler`](https://en.cppreference.com/w/cpp/error/terminate_handler)。其结果是默认调用了\
  \ [`std::abort`](https://en.cppreference.com/w/cpp/utility/program/abort)，这会导致程序异常终止。异常处理方式是“调用不带执行策略的算法”与“调用带有顺序\
  \ `std::execution::seq` 执行策略的算法”之间的区别。不带执行策略的算法调用会传播异常，因此异常是可以被处理的。程序 `exceptionExecutionPolicy.cpp`\
  \ 展示了我的观点。\n\n```\n 1 // exceptionExecutionPolicy.cpp\n 2 \n3 #include <algorithm>\n\
  \ 4 #include <execution>\n 5 #include <iostream>\n 6 #include <stdexcept>\n 7 #include\
  \ <string>\n 8 #include <vector>\n 9 \n10 int main(){\n11 \t\n12     std::cout <<\
  \ std::endl;\n13 \n14     std::vector<int> myVec{1, 2, 3, 4, 5};\n15 \n16     try{\n\
  17         std::for_each(myVec.begin(), myVec.end(),\n18             [](int){ throw\
  \ std::runtime_error(\"Without execution policy\"); }\n19         );\n20     }\n\
  21     catch(const std::runtime_error& e){\n22         std::cout << e.what() <<\
  \ std::endl;\n23     }\n24     \n25     try{\n26         std::for_each(std::execution::seq,\
  \ myVec.begin(), myVec.end(),\n27             [](int){ throw std::runtime_error(\"\
  With execution policy\"); }\n28         );\n29     }\n30     catch(const std::runtime_error&\
  \ e){\n31         std::cout << e.what() << std::endl;\n32     }\n33     catch(...){\n\
  34         std::cout << \"Catch-all exceptions\" << std::endl;\n35     }\n36 \n\
  37 }\n```\n\n## 带执行策略的异常\n\n第 21 行的异常处理器捕获了异常 `std::runtime_error`，但与第 30 行的异常处理器、甚至是第\
  \ 33 行的全捕获异常处理器不起作用。\n\n使用新的 MSVC 编译器和 `std:c++latest` 标志，程序将给出预期的输出。\n\n![新算法](img/ParallelSTL----exceptionExecutionPolicy.PNG)\n\
  \n## 新算法\n\n只执行了第一个异常处理器。\n\n### 数据竞争和死锁的风险\n\n并行算法不会自动保护你免受数据竞争和死锁的影响。\n\n```\n\
  std::vector<int> v = {1, 2, 3 };\nint sum = 0;\n\nstd::for_each(std::execution::par,\
  \ v.begin(), v.end(), &sum{\n    sum += i + i;\n});\n```\n\n#### 带有数据竞争的并行执行\n\n\
  这段短代码段在 `sum` 上存在数据竞争。`sum` 正在构建所有 `i + i` 的和并被并发修改。`sum` 必须被保护。\n\n```\nstd::vector<int>\
  \ v = {1, 2, 3 };\nint sum = 0;\nstd::mutex m;\n\nstd::for_each(std::execution::par,\
  \ v.begin(), v.end(), &sum{\n    std::lock_guard<std::mutex> lock(m);\n    sum +=\
  \ i + i;\n});\n```\n\n#### 并行执行\n\n当我将执行策略更改为 `std::execution::par_unseq` 时，我遇到了竞态条件，这通常会导致死锁。\n\
  \n```\nstd::vector<int> v = {1, 2, 3 };\nint sum = 0;\nstd::mutex m;\n\nstd::for_each(std::execution::par_unseq,\
  \ v.begin(), v.end(), &sum{\n    std::lock_guard<std::mutex> lock(m);\n    sum +=\
  \ i + i;\n});\n```\n\n#### 带有死锁的并行与向量化执行\n\nLambda 函数可能导致在同一线程上连续两次调用 `m.lock`。尝试两次锁定非递归\
  \ `std::mutex` 是未定义行为，并且大多数情况下会导致死锁。你可以通过使用原子变量避免死锁。\n\n```\nstd::vector<int> v\
  \ = {1, 2, 3 };\nstd::atomic<int> sum = 0;\nstd::mutex m;\nstd::for_each(std::execution::par_unseq,\
  \ v.begin(), v.end(), &sum{\n    sum += i + i;\n});\n```\n\n#### 无死锁的并行与向量化执行\n\n\
  由于 `sum` 是原子计数器，松弛语义（relaxed semantic）也可以的：`sum.fetch_add(i * i, std::memory_order_relaxed);`。\n\
  \n69 个 STL 算法可以使用执行策略进行参数化。此外，C++17 有 8 种新算法。\n\n### 算法\n\n这里是 69 个带有并行版本的算法。\n\n\
  | 算法 | 并行版本 |\n| --- | --- |\n| adjacent_difference | adjacent_find |\n| all_of\
  \ | any_of |\n| copy | copy_if |\n| copy_n | count |\n| count | count_if |\n| fill\
  \ | fill_n |\n| find | find_end |\n| find_first_of | find_if |\n| generate | generate_n\
  \ |\n| includes | inner_product |\n| is_heap | is_heap_until |\n| is_partition |\
  \ is_sorted |\n| is_sorted_until | lexicographical_compare |\n| max_element | min_element\
  \ |\n| mismatch | move |\n| search | search |\n| nth_element | partial_sort |\n\
  | partial_sort_copy | partition |\n| remove | remove_copy |\n| remove_if | remove_if\
  \ |\n| replace | replace_copy |\n| replace_if | replace_if |\n| reverse | reverse_copy\
  \ |\n| rotate | rotate_copy |\n| set_difference | set_intersection |\n| set_symmetric_difference\
  \ | set_union |\n| sort | stable_partition |\n| stable_sort | swap |\n| uninitialized_copy\
  \ | uninitialized_copy_n |\n| uninitialized_fill | uninitialized_fill_n |\n| unique\
  \ | unique_copy |\n\n## 新算法\n\n新算法位于 `std` 命名空间。`std::for_each` 和 `std::for_each_n`\
  \ 需要 `<algorithm>` 头文件。其余算法需要 `<numeric>` 头文件。\n\n以下是新算法的概述。\n\n| 算法 | 描述 |\n| ---\
  \ | --- |\n| std::for_each | 将可调用对象应用于范围。 |\n| std::for_each_n | 将可调用对象应用于范围的前 n\
  \ 个元素。 |\n| std::exclusive_scan 从左到第 i 个元素（不包含）应用二元函数。调用函数的参数是上一个结果。存储中间结果。如果二元函数不是关联的，则结果是不定的。\
  \ |\n|   | 类似于 [std::partial_sum](https://en.cppreference.com/w/cpp/algorithm/partial_sum)\
  \ |\n| std::inclusive_scan 从左到第 i 个元素（包含）应用二元函数。调用函数的参数是上一个结果。存储中间结果。如果二元函数不是关联的，则结果是不定的。\
  \ |\n|   | 类似于 std::partial_sum |\n| std::transform_exclusive_scan 首先对范围应用一元函数，然后应用\
  \ std::exclusive_scan。如果二元函数不是关联的，则结果是不定的。 |\n| std::transform_inclusive_scan 首先对范围应用一元函数，然后应用\
  \ std::inclusive_scan。如果二元函数不是关联的，则结果是不定的。 |\n| std::reduce 从左到右对范围应用二元函数。如果二元函数不是关联的或交换的，则结果是不定的。\
  \ |\n|   | 类似于 [std::accumulate](https://en.cppreference.com/w/cpp/algorithm/accumulate)\
  \ |\n\n\n\n\n\n| `std::transform_reduce` | 首先对范围应用一个一元调用对象，然后执行 `std::reduce`。如果二元调用对象是非结合的或非交换的，结果将是不确定的。\
  \ |\n\n诚然，这个描述并不容易理解，但如果你已经熟悉 `std::accumulate` 和 `std::partial_sum`，那么 `reduce`\
  \ 和 `scan` 的变体应该非常熟悉。`reduce` 是 `accumulate` 的并行版本，而 `scan` 是 `partial_sum` 的并行版本。并行执行是\
  \ `std::reduce` 需要结合律和交换律调用对象的原因。与 `partial_sum` 变体相反，相应的结论适用于 `scan` 变体。\n\n首先，我将为算法给出一个详尽的示例，然后介绍这些函数的函数式传承。在我的示例中，我忽略了新的\
  \ `std::for_each` 算法。与返回一元函数的 C++98 版本不同，额外的 C++17 版本不返回任何内容。`std::accumulate` 从左到右处理元素，而\
  \ `std::reduce` 则以任意顺序处理。让我先从一个使用 `std::accumulate` 和 `std::reduce` 的短代码段开始。调用对象是\
  \ lambda 函数 `[](int a, int b){ return a * b; }`。\n\n```cpp\nstd::vector<int> v{1,\
