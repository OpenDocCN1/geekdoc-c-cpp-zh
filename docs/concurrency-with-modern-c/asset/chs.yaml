  62     \n63 }\n```\n\n# 线程安全接口\n\n包括主线程在内的三个线程都使用了 `Critical` 实例。得益于线程安全接口，所有对公共\
  \ API 的调用都是同步的。第 35 行的互斥锁 `mut` 被标记为 `mutable`，因此可以在常量方法 `implementation1` 中使用。\n\
  \n线程安全接口的优点有三点：\n\n1. 互斥锁不支持递归调用。在 C++ 中，对非递归互斥锁进行递归调用是未定义行为，通常会导致死锁。\n2. 程序 使用了最少的锁定，因此也使用了最少的同步。如果在\
  \ `Critical` 类的每个公共或私有方法中使用简单的 `std::recursive_mutex`，将导致开开销更大的同步。\n3. 从用户的角度来看，`Critical`\
  \ 使用起来非常简单，因为同步仅仅是一个实现细节。\n\n程序的输出显示了三个线程的交替执行情况。\n\n![线程安全接口](img/SynchronisationPatterns----threadSafeInterface.png)\n\
  \n## 线程安全接口\n\n虽然线程安全接口看起来很容易实现，但你必须记住两个严重的危险性。\n\n### 危险性\n\n在类中使用静态成员或拥有虚接口需要特别小心。\n\
  \n#### 静态成员\n\n当你的类拥有一个非常量的静态成员时，你必须对该类实例的所有方法调用进行同步。\n\n```cpp\n 1 class Critical{\n\
  \ 2     \n 3 public:\n 4     void interface1() const {\n 5         std::lock_guard<std::mutex>\
  \ lockGuard(mut);\n 6         implementation1();\n 7     }\n 8     void interface2(){\n\
  \ 9         std::lock_guard<std::mutex> lockGuard(mut);\n10         implementation2();\n\
  11         implementation3();\n12         implementation1();\n13     }\n 14    \
  \ \n15 private: \n16     void implementation1() const {\n17         std::cout <<\
  \ \"implementation1: \" \n18                   << std::this_thread::get_id() <<\
  \ std::endl;\n19         ++called;\n20     }\n21     void implementation2(){\n22\
  \         std::cout << \"    implementation2: \" \n23                   << std::this_thread::get_id()\
  \ << std::endl;\n24         ++called;\n25     }\n26     void implementation3(){\
  \    \n27         std::cout << \"        implementation3: \" \n28              \
  \     << std::this_thread::get_id() << std::endl;\n29         ++called;\n30    \
  \ }\n31     \n32     inline static int called{0};\n33     inline static std::mutex\
  \ mut;\n34 \n35 };\n```\n\n### 带有静态成员的线程安全接口\n\n`Critical` 类现在有一个静态成员 `called`（第\
  \ 32 行），用于计算实现函数的调用次数。`Critical` 的所有实例都使用同一个静态成员 `called`，因此必须同步。在这种情况下，临界区域包含了所有的\
  \ `Critical` 实例。\n\n#### 虚\n\n当你重写虚接口函数时，即使该函数是私有的，重写函数也应该拥有锁。\n\n```cpp\n 1 //\
  \ threadSafeInterface.cpp\n 2 \n 3 #include <iostream>\n 4 #include <mutex>\n 5\
  \ #include <thread>\n 6 \n7 class Critical{\n 8 \n 9 public:\n10     void interface1()\
  \ const {\n11         std::lock_guard<std::mutex> lockGuard(mut);\n12         implementation1();\n\
  13     }\n14     void interface2(){\n15         std::lock_guard<std::mutex> lockGuard(mut);\n\
  16         implementation2();\n17         implementation3();\n18         implementation1();\n\
  19     }\n20 private: \n21     void implementation1() const {\n22         std::cout\
  \ << \"implementation1: \" \n23                   << std::this_thread::get_id()\
  \ << std::endl;\n24     }\n25     void implementation2(){\n26         std::cout\
  \ << \"    implementation2: \" \n27                   << std::this_thread::get_id()\
  \ << std::endl;\n28     }\n29     void implementation3(){    \n30         std::cout\
  \ << \"        implementation3: \" \n31                   << std::this_thread::get_id()\
  \ << std::endl;\n32     }\n33   \n34 \n35     mutable std::mutex mut;\n36 \n37 };\n\
  38 \n39 int main(){\n40     \n41     std::cout << std::endl;\n42     \n43     std::thread\
  \ t1([]{ \n44         const Critical crit;\n45         crit.interface1();\n46  \
  \   });\n47     \n48     std::thread t2([]{\n49         Critical crit;\n50     \
  \    crit.interface2();\n51         crit.interface1();\n52     });\n53     \n54\
  \     Critical crit;\n55     crit.interface1();\n56     crit.interface2();\n57 \
  \    \n58     t1.join();\n59     t2.join();    \n60     \n61     std::cout << std::endl;\n\
  62     \n63 }\n```\n\n### 带有虚方法的线程安全接口\n\n虽然线程安全接口看起来很容易实现，但你必须记住两个严重的危险性。\n\n\n\
  \n\n```cpp\nvoid waitingForWork(){\n    std::cout << \"Worker: Waiting for work.\"\
  \ << std::endl;\n    std::unique_lock<std::mutex> lck(mutex_);\n    condVar.wait(lck,\
  \ []{ return dataReady; });\n    doTheWork();\n    std::cout << \"Work done.\" <<\
  \ std::endl;\n}\n\nvoid setDataReady(){\n    {\n      std::lock_guard<std::mutex>\
  \ lck(mutex_);\n      dataReady = true;\n    }\n    std::cout << \"Sender: Data\
  \ is ready.\"  << std::endl;\n    condVar.notify_one();\n}\n```\n\n### Future/promise\
  \ 对\n\n```cpp\nvoid waitingForWork(std::future<void>&& fut){\n\n    std::cout <<\
  \ \"Worker: Waiting for work.\" << std::endl;\n    fut.wait();\n    doTheWork();\n\
  \    std::cout << \"Work done.\" << std::endl;\n\n}\n\nvoid setDataReady(std::promise<void>&&\
  \ prom){\n\n    std::cout << \"Sender: Data is ready.\"  << std::endl;\n    prom.set_value();\n\
  \n}\n```\n\n### 拉取原则 (Pull Principle)\n\n与其被动地等待状态变化，你可以主动请求。这种拉取原则在 C++ 中并没有原生支持，但例如可以使用原子操作来实现。\n\
  \n```cpp\nstd::vector<int> mySharedWork;\nstd::atomic<bool> dataReady(false);\n\n\
  void waitingForWork(){\n    std::cout << \"Waiting \" << std::endl;\n    while (!dataReady.load()){\
  \                \n        std::this_thread::sleep_for(std::chrono::milliseconds(5));\n\
  \    }\n    mySharedWork[1] = 2;                     \n    std::cout << \"Work done\
  \ \" << std::endl;\n}\n\nvoid setDataReady(){\n    mySharedWork = {1, 0, 3};   \
  \               \n    dataReady = true;                          \n    std::cout\
  \ << \"Data prepared\" << std::endl;\n}\n```\n\n### 有无时间边界的等待\n\n条件变量和 future 有三种等待方法：`wait`、`wait_for`\
  \ 和 `wait_until`。`wait_for`变体需要一个时间时长，而 `wait_until` 变体需要一个时间点。为了不让你感到，，在本节中跳过了没有时间边界的等待（`wait`）。推送原则的最后一个小节已经提供了两个示例。\n\
  \n各种等待策略中的消费者线程等待时长 `steady_clock::now() + dur`。如果 promise 已就绪，它会请求值；如果没有，它只显示自己的\
  \ ID：`this_thread::get_it()`。\n\n```cpp\nvoid producer(promise<int>&& prom){\n \
  \   cout << \"PRODUCING THE VALUE 2011\\n\\n\"; \n    this_thread::sleep_for(seconds(5));\n\
  \    prom.set_value(2011);\n}\n\nvoid consumer(shared_future<int> fut,\n       \
  \       steady_clock::duration dur){\n    const auto start = steady_clock::now();\n\
  \    future_status status= fut.wait_until(steady_clock::now() + dur);\n    if (\
  \ status == future_status::ready ){\n        lock_guard<mutex> lockCout(coutMutex);\n\
  \        cout << this_thread::get_id() << \" ready => Result: \" << fut.get() \n\
  \             << endl;\n    }\n    else{\n        lock_guard<mutex> lockCout(coutMutex);\n\
  \        cout << this_thread::get_id() << \" stopped waiting.\" << endl;\n    }\n\
  \    const auto end= steady_clock::now();\n    lock_guard<mutex> lockCout(coutMutex);\n\
  \    cout << this_thread::get_id() << \" waiting time: \" \n         << getDifference(start,end)\
  \ << \" ms\" << endl;\n}\n```\n\n### 通知一个或所有等待线程\n\n`notify_one` 唤醒一个等待线程，`notify_all`\
  \ 唤醒所有等待线程。使用 `notify_one` 时你无法保证哪一个会被唤醒。其他条件变量仍保持等待状态。这在 `std::future` 中是不可能的，因为\
  \ future 和 promise 之间是一对一的关联。如果你想模拟一对多的关联，请使用 `std::shared_future` 而不是 `std::future`，因为\
  \ `std::shared_future` 是可以拷贝的。\n\n下面的程序展示了 promise 和 future 之间一对一和一对多的简单工作流。\n\n\
  ```cpp\n 1 // bossWorker.cpp\n 2 \n 3 #include <future>\n 4 #include <chrono>\n\
  \ 5 #include <iostream>\n 6 #include <random>\n 7 #include <string>\n 8 #include\
  \ <thread>\n 9 #include <utility>\n10 \n11 int getRandomTime(int start, int end){\n\
  12   \n13   std::random_device seed;\n14   std::mt19937 engine(seed());\n15   std::mt19937\
  \ engine(seed());\n16   std::mt19937 engine(seed());\n17   std::mt19937 engine(seed());\n\
  18   std::mt19937 engine(seed());\n19   std::mt19937 engine(seed());\n20   std::mt19937\
  \ engine(seed());\n21   std::mt19937 engine(seed());\n22   std::mt19937 engine(seed());\n\
  23   std::mt19937 engine(seed());\n24   std::mt19937 engine(seed());\n25   std::mt19937\
  \ engine(seed());\n26   std::mt19937 engine(seed());\n27   std::mt19937 engine(seed());\n\
  28   std::mt19937 engine(seed());\n29   std::mt19937 engine(seed());\n30   std::mt19937\
  \ engine(seed());\nint getRandomTime(int start, int end){\n```\n\n\n\n\n本章介绍的三个模式都是经典。这些模式在极具价值的[Pattern-Oriented\
  \ Software Architecture: Patterns for Concurrent and Networked Objects](https://www.dre.vanderbilt.edu/~schmidt/POSA/POSA2/)\
  \ 书中有非常详尽的解释。本章的目标是概述活动对象 Active Object、监控对象 Monitor Object 以及半同步/半异步 Half-Sync/Half-Async\
  \ 模式。与上一章同步模式 Synchronisation Patterns 一样，我将从 C++ 的视角来看。在深入介绍这三个模式之前，这里是这些模式的概要。\n\
  \n- `Active Object`（活动对象）设计模式对于每个位于独立控制线程的对象，将方法的执行与方法的调用解耦。其目标是通过异步方法调用和用于处理请求的调度器来引入并发。[Wikipedia:\
  \ Active object](https://en.wikipedia.org/wiki/Active_object)\n- `Monitor Object`（监控对象）设计模式对并发方法的执行进行同步，确保同一时间只有一个方法在对象内部运行。它还允许对象的方法协作地调度其执行序列。[Pattern-Oriented\
  \ Software Architecture: Patterns for Concurrent and Networked Objects](https://www.dre.vanderbilt.edu/~schmidt/POSA/POSA2/)\n\
  \n这两个模式都对方法的调用进行了同步和调度。主要区别在于，Active Object 在不同的线程中执行方法，而 Monitor 在与客户端相同的线程中执行。与关注子系统的\
  \ Active Object 和 Monitor Object（因此通常被称为设计模式）不同，以下模式具有系统视角，因此被称为架构模式。\n\n- `Half-Sync/Half-Async`（半同步/半异步）架构模式将并发系统中的异步和同步服务处理解耦，以便在不不度降低性能的情况下简化编程。该模式引入了两个相互通信的层，一个用于异步服务处理，另一个用于同步服务处理。[Pattern-Oriented\
  \ Software Architecture: Patterns for Concurrent and Networked Objects](https://www.dre.vanderbilt.edu/~schmidt/POSA/POSA2/)\n\
  \n## Active Object (活动对象)\n\nActive Object 设计模式对于每个位于独立控制线程的对象，将方法的执行与方法的调用解耦。其目标是通过异步方法调用和用于处理请求的调度器来引入并发。[Wikipedia:\
  \ Active object](https://en.wikipedia.org/wiki/Active_object)。这种模式也称为并发对象（Concurrent\
  \ Object）。\n\n这里是关于 Active Object 的更多细节。客户端的方法调用发送到代理（proxy），它代表 Active Object 的接口。执行者（servant）提供了\
  \ Active Object 的实现，它运行在独立的线程中。在运行时，代理将调用转换为对执行者的方法调用。这些方法调用由调度器（scheduler）存到激活列表（activation\
  \ list）中。调度器的事件循环与执行者在同一个线程中运行，从激活列表中取出方法调用并将其派发到执行者上。客户端通过代理的未来（future）获取结果。\n\n\
  ### Components\n\nActive Object 模式由六个组件组成：\n\n1. `proxy`（代理）为 Active Object 上可访问的方法提供接口。代理触发方法请求对象的构造，该对象进入激活列表。代理在与客户端相同的线程中运行。\n\
  2. `method request`（方法请求）类定义了 Active Object 执行执行的接口。\n3. `activation list`（激活列表）维护待处理的方法请求。激活列表将客户端线程与\
  \ Active Object 线程解耦。代理插入方法请求，调度器移除它们。\n4. `scheduler`（调度器）在与代理不同的线程中运行。它在 Active\
  \ Object 的线程中运行，并决定执行激活列表中下一个方法请求。\n5. `servant`（执行者）实现 Active Object 并运行在 Active\
  \ Object 的线程中。执行者支持代理的接口。\n6. `future`（未来）由代理创建。未来允许客户端获取 Active Object 上方法调用的结果。客户端可以等待结果或轮询结果。\n\
  \n下图显示了消息序列。\n\n![Active Object](img/ArchitecturePatterns----ActiveObject.jpg)\n\
  \n### Advantages and Disadvantages\n\n在展示 Active Object 模式的最小实现之前，这里是使用它的优缺点。\n\n\
  **优点：**\n- 同步只需要在 Active Object 的线程中进行，而不需要在客户端线程中。\n- 客户端（用户）与服务器（实现者）之间清晰的分离。同步挑战在实现者侧。\n\
  - 由于客户端请求的异步执行，提高了系统的吞吐量。调用计算密集型方法不会阻塞整个系统。\n- 调度器可以实现各种策略来执行待处理请求。如果是这样，任务可以以不同于入队列的顺序执行。\n\
  \n**缺点：**\n- 如果方法请求过于细粒，Active Object 模式（如代理、激活列表和调度器）的性能开销可能过大。\n- 由于调度器的策略和操作系统的调度，调试\
  \ Active Object 模式通常非常困难。当任务以不同于入队列的顺序执行时，这一点尤为真实。\n\n### Implementation\n\n以下示例展示了\
  \ Active Object 模式的简单实现。特别地，我没有定义 `method request` 类，它应该由代理和执行者来实现。此外，调度器仅在被要求时执行下一个任务。\n\
