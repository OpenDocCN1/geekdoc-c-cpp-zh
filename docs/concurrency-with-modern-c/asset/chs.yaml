  \ 68     \n69     NoLock noLock;\n70     StrategizedLocking stratLock1{noLock};\n\
  \ 71     \n72     {\n73         ExclusiveLock exLock;\n74         StrategizedLocking\
  \ stratLock2{exLock};\n75         {\n76             SharedLock sharLock;\n77   \
  \          StrategizedLocking startLock3{sharLock};\n78         }\n79     }\n 80\
