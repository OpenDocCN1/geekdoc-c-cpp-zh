  \ C++、Python 和 Haskell 等主题的文章，也乐于在会议上演讲。2016 年，我决定开始创业。我组织并主持了关于现代 C++ 和 Python\
  \ 的研讨会。\n\n## 我的特殊情况\n\n我在奥伯斯塔多夫（Oberstdorf）接受髋关节手术时开始编写《现代 C++ 并发》（Concurrency\
  \ With Modern C++）。正式地说，那是对我左髋关节的全人工关节置换。我在医院和康复中心期间写了这本书的前半部分。诚地说，在这个充满挑战的时期，写书对我帮助很大。\n\
  \n![](img/signatur----RainerGrimmSmall.png)\n\n# 快速概述\n\n## 现代 C++ 并发\n\n随着 C++11\
  \ 标准的发布，C++ 拥有了多线程库和内存模型。该库包含了原子变量、线程、锁和条件变量等基础构建块。这是未来的 C++ 标准（如 C++20 和 C++23）在此基础上建立更高抽象的基础。然而，C++11\
  \ 已经引入了任务（tasks），它们提供了比上述基础构建块更高的抽象。\n\n![C++ 中的并发](img/timeline----timeline.png)\n\
  \n### C++ 中的并发\n\n粗而言之，你可以将 C++ 的并发故事分为三个演进步骤。\n\n### C++11 和 C++14：基础\n\n多线程在 C++11\
  \ 中引入。这种支持由两部分组成：定义良好的内存模型和标准化的线程接口。C++14 在 C++ 的多线程设施中增加了读写锁。\n\n#### 内存模型\n\n\
  多线程的基础是定义良好的内存模型。该内存模型必须处理以下方面：\n\n*   原子操作：可以在不被打断的情况下执行的操作。\n*   操作的偏序排序：一个不能重排的操作序列。\n\
  *   操作的可见性效果：保证对共享变量的操作何时对其他线程可见。\n\nC++ 内存模型的设计灵感源于它的前身：Java 内存模型。然而，与 Java 内存模型不同，C++\
  \ 允许我们打破顺序一致性的约束，这是原子操作的默认行为。\n\n顺序一致性提供了两个保证：\n\n1.  程序的指令按照源代码的顺序执行。\n2.  所有线程上的所有操作存在一个全局顺序。\n\
  \n内存模型基于原子数据类型上的原子操作（短原子类型）。\n\n##### 原子类型\n\nC++ 拥有一组简单的原子数据类型。这些包括许多变种的布尔值、字符、数字和指针。你可以使用类模板\
  \ `std::atomic` 定义自己的原子数据类型。原子类型建立了同步和排序约束，这些约束也可能适用于非原子类型。\n\n标准化的线程接口是 C++ 并发的核心。\n\
  \n## 多线程\n\nC++ 中的多线程由线程、共享数据的同步原语、线程本地数据和任务组成。\n\n### 线程\n\n`std::thread`作为其工作包。可调用单元可以是一个命名函数、函数对象或\
  \ lambda 函数。\n\n线程的创建者负责它的生命周期。新线程的可执行单元随着可调用单元的结束而结束。创建者要么等待创建的线程 `t` 完成（`t.join()`），要么从创建的线程中分离（`t.detach()`）。如果没有对线程\
  \ `t` 执行 `t.join()` 或 `t.detach()`，则该线程是可连接（joinable）。可连接线程在析构函数中调用 `std::terminate`，程序将终止。\n\
  \n与创建者分离的线程通常被称为守护线程，因为它们在后台运行。\n\n`std::thread` 是一个变变模板。这意味着它可以接收任意数量的参数；由可调用单元或线程获取这些参数。\n\
  \n##### 共享数据\n\n如果有多个线程同时使用一个共享变量，且该变量是可变的（非 const），你必须协调对该变量的访问。同时读写共享变量是数据竞态，因此是未定义行为。在\
  \ C++ 中，对共享变量的访问协调是通过互斥锁和锁实现的。\n\n###### 互斥锁\n\n互斥锁（*mutual exclusion*）保证任何时刻只有一个线程可以访问共享变量。互斥锁锁定和解锁共享变量所属的临界区域。C++\
  \ 有五种不同的互斥锁。它们可以递归锁定、尝试锁定以及带或不带时间限制锁定。甚至互斥锁也可以同时共享一个锁。\n\n###### 锁\n\n你应该将互斥锁封装在锁。C++\
  \ 有用于简单场景的 `std::lock_guard` / `std::scoped_lock`，以及用于高级用例的 `std::unique_lock` /\
  \ `std::shared_lock`例如显式锁定或解锁互斥锁。\n\n\n\n\n\n随着 C++17 的到来，C++ 的并发发生了巨大变化，特别是标准模板库\
  \ (STL) 中的并行算法。C++11 和 C++14 仅提供了并发的基础构建块。这些工具适用于库或框架的开发者，但不适用于应用程序开发者。C++11 和 C++14\
  \ 中的多线程在 C++17 中变成了 C++ 并发编程的“汇编语言”！\n\n## 执行策略 (Execution Policy)\n\n在 C++17 中，大多数\
  \ STL 算法都提供了并行实现。这使得你能够通过所谓的执行策略来调用算法。该策略指定了算法是顺序执行（`std::execution::seq`）、并行执行（`std::execution::par`），还是带有额外向量化的并行执行（`std::execution::par_unseq`）。\n\
  \n## 新算法\n\n除了已有的并行或并行且向量化执行重载版本的 69 个算法外，我们还获得了八个额外的算法。这些新算法非常适合并行归约、扫描或转换。\n\n\
  ## 近期未来：C++20\n\n![C++20 中的并发](img/timeline----timeline20.png)\n\nC++20 中的并发\n\n\
  2019 年 6 月，C++20 标准已经出炉了。以下是我们将获得的特性。\n\n### `std::jthread`\n\n`std::jthread` 是\
  \ `std::thread` 的增强版。除了 `std::thread` 的功能外，`std::jthread` 可以发送中断信号并自动等待已启动线程完成（join）。\n\
  \n### 原子智能指针 (Atomic Smart Pointers)\n\n智能指针 [`std::shared_ptr`](http://en.cppreference.com/w/cpp/memory/shared_ptr)\
  \ 和 [`std::weak_ptr`](http://en.cppreference.com/w/cpp/memory/weak_ptr) 在并发程序中存在概念性问题。它们本质上共享可变状态；因此，容易发生数据竞态，从而导致未定义行为。`std::shared_ptr`\
  \ 和 `std::weak_ptr` 保证引用计数器的增减是原子操作，且资源会被精确删除一次，但它们任何一个都无法保证资源的访问是原子的。新的原子智能指针 `std::atomic<std::shared_ptr<T>>`\
  \ 和 `std::atomic<std::weak_ptr<T>>` 解决了这个问题。两者都是 `std::atomic` 的部分模板特化。\n\n### 栅与屏障\
  \ (Latches and Barriers)\n\nC++14 没有信号量。信号量用于控制对有限数量资源的访问。不用担心了，因为 C++20 引入了栅和屏障。你可以使用栅和屏障在同步点等待计数器变为零。栅和屏障之间的区别是\
  \ `std::latch` 只能使用一次，而 `std::barrier` 可以使用多次。此外，`std::barrier` 可以在每次迭代后调整其计数器。\n\
  \n### 信号量 (Semaphores)\n\n计数信号量 是一种特殊的信号量，其计数器大于零。计数器在信号量创建时初始化。获取信号量减少计数器，释放信号量增加计数器。\n\
  \n### 协程 (Coroutines)\n\n协程 是可以在挂起和恢复执行的同时保持其状态的函数。协程通常是操作系统、事件循环、无限列表或流水线中实现协作任务的首选方法。\n\
  \n## 案例研究 (Case Studies)\n\n在介绍内存模型理论和多线程接口后，我将理论应用到几个案例研究中。\n\n### 计算向量之和\n\n计算向量之和\
  \ 有多种实现方式。你可以顺序执行，也可以在数据共享最大或最小化的情况下并发执行。性能数据差异巨大。\n\n### 单例的线程安全初始化\n\n单例的线程安全初始化\
  \ 是共享变量线程安全初始化的经典用例。有许多方法，性能特性各异。\n\n### 使用 CppMem 进行持续优化\n\n我从一个小程序开始，并不断改进它。我验证了使用\
  \ CppMem 进行持续优化过程的每一步。[CppMem](http://svr-pes20-cppmem.cl.cam.ac.uk/cppmem/) 是一个交互工具，用于使用\
  \ C++ 内存模型探索小型代码段的行为。\n\n## 未来：C++23\n\n![C++20 中的并发](img/timeline----timeline23.png)\n\
  \nC++20 中的并发\n\n预测未来是很困难的（尤其是[尼尔·玻尔](https://en.wikipedia.org/wiki/Niels_Bohr)）。\n\
  \n### 执行器 (Executors)\n\n执行器由一组关于在、何时以及如何运行调用单元的规则组成。它们是在任意线程、线程池甚至单线程上执行调用单元的基本构建块。C++20/23\
  \ 中的扩展未来依赖于它们，但也取决于 STL 的并行算法以及 C++20 的新并发特性，如栅与屏障、协程、事务内存和任务块。\n\n### 扩展未来\n\n\
  C++11 引入的称为任务和未来提供了很多功能，但也有缺点：任务无法组合成强大的工作流。这种限制在 C++20/23 的扩展未来 中不再存在。因此，扩展未来会在其前驱（`then`）就绪、任一前驱（`when_any`）或所有前驱（`when_all`）就绪时就绪。\n\
  \n### 事务内存\n\n事务内存 基于数据库理论中事务的思想。事务提供了 ACID 数据库事务的前三个属性：**原子性 (Atomicity)**、**一致性\
  \ (Consistency)** 和**隔离性 (Isolation)**。数据库特有的持久性（Durability）并不适用于提议的 C++ 事务内存。新标准有两种口味事务内存：同步块和原子块。它们都按全顺序执行，并且就像受全局锁保护一样。与同步块不同，原子块不能执行事务安全代码。\n\
  \n### 任务块\n\n任务块 在 C++ 中实现了分叉-连接范式。以下图表说明了任务块的核心思想：你有一个启动任务的分叉阶段，以及一个同步这些任务的连接阶段。\n\
  \n![任务块](img/cpp20_23----ForkJoin.png)\n\n### 数据并行向量库\n\n数据并行向量库 通过向量类型提供数据并行（SIMD）编程。SIMD\
  \ 意味着对许多数据并行执行一次操作。\n\n\n\n\n\n模式 是顶尖专家总结的最佳实践。它们“……表达了特定上下文、问题与解决方案之间的关系。”[Christopher\
  \ Alexander](https://en.wikipedia.org/wiki/Christopher_Alexander)。从更具概念性的角度思考并发编程的挑战具有许多益处。与更具概念性的并发模式不同，本章提供了克服并发挑战的实务建议和最佳实践。\n\
  \n## 同步 (Synchronisation)\n\n产生数据竞态的必要先决条件是共享的可变状态。同步模式 归纳为两个问题：处理共享和处理变异。\n\n##\
  \ 并发架构 (Concurrent Architecture)\n\n并发架构 章节介绍了三种模式。活动对象模式和监视对象模式用于同步和调度方法调用。第三种模式半同步/半异步侧重于架构，解耦了并发系统中的异步和同步服务处理。\n\
  \n## 最佳实践 (Best Practices)\n\n并发编程本质上是复杂的，因此不仅在通用领域，在多线程以及内存模型拥有最佳实践非常有意义。\n\n##\
  \ 数据结构 (Data Structures)\n\n## 挑战 (Challenges)\n\n编写并发程序本质上是复杂的。如果你只使用 C++11 和 C++14\
  \ 特性，情况尤其如此。因此，我详细描述了最具有挑战性的问题。我希望如果我花一整个章节来讨论并发编程的挑战，你会更意识到这些陷阱。我将介绍诸如竞态条件、数据竞态和死锁等挑战。\n\
  \n## 时间库 (Time Library)\n\n时间库是 C++ 并发设施的关键组件。你通常会让线程睡眠特定的持续时间或者直到某个特定的时间点。时间库由：时间点、时间段和时钟。\n\
  \n## CppMem\n\nCppMem 是一个深入研究内存模型的交互工具。它提供了两个非常有价值的服务：首先，你可以验证你的无锁代码；其次，你可以分析你的无锁代码，从而对你的代码有更健壮的理解。我在书中经常使用\
  \ CppMem。由于 CppMem 的配置选项和见解相当具有挑战性，本章让你对 CppMem 有基本的了解。\n\n## 术语表 (Glossary)\n\n\
  术语表包含了对最核心术语的非详尽解释。\n\n# 细节 (The Details)\n\n## 内存模型 (Memory Model)\n\n多线程的基础是良好的内存模型。从读者的角度来看，它包含两个方面。一方面，它具有巨大的复杂性，往往违背我们的直觉；另一方面，它对于深入理解多线程挑战非常有帮助。\n\
  \n然而，首先，什么是内存模型？\n\n### 内存模型基础 (Basics of the Memory Model)\n\n从并发的角度来看，内存模型有两个主要方面：\n\
  \n* 什么是内存位置（memory location）？\n* 如果两个线程访问同一个内存位置会发生什么？\n\n让我回答这两个问题。\n\n### 什么是内存位置？\n\
  \n根据 [cppreference.com](http://en.cppreference.com/w/cpp/language/memory_model)，内存位置是：\n\
  \n* 一个标量类型的对象（算术类型、指针类型、枚举类型，或 `std::nullptr_t`），\n* 或者是非零长度的最大连续位域字段序列。\n\n这里有一个内存位置的示例：\n\
  \n```\nstruct S {\n    char a;        // 内存位置 #1\n    int b : 5;     // 内存位置 #2\n\
  \    int c : 11,    // 内存位置 #2 (继续)\n          : 0,\n        d : 8;     // 内存位置\
  \ #3\n    int e;         // 内存位置 #4\n    double f;      // 内存位置 #5\n    std::string\
  \ g; // 多个内存位置\n};\n```\n\n首先，对象 `obj` 由七个子对象组成，两个位域字段 `b` 和 `c` 共享同一个内存位置。\n\n\
  以下是一些重要的观察：\n\n* 每个变量都是一个对象。\n* 标量类型占据一个内存位置。\n* 相邻的位域字段（`b` 和 `c`）共享同一个内存位置。\n\
  * \n\n现在，进入多线程的关键部分。\n\n### 如果两个线程访问同一个内存位置会发生什么？\n\n如果两个线程访问同一个内存位置——位域字段可以共享内存位置——且至少有一个线程想要修改它，那么你的程序存在数据竞态，除非\n\
  \n1. 该内存位置是通过原子操作修改的。\n2. 一个访问发生在另一个访问之前（happens-before）。\n\n第二种情况非常，因为同步原语（如斥锁）建立了发生顺序关系。这些发生顺序关系基于原子操作，通常也适用于非原子操作。内存排序\
  \ 定义了导致发生顺序关系的细节，因此是内存模型的关键部分。\n\n这是我对内存模型的首次正式描述。现在，我想给你一个内存模型的心理模型。\n\n### 契约\
  \ (The Contract)\n\n契约是程序员与系统之间的。系统由生成机器码的编译器、执行机器码的处理器以及存储程序状态的不同缓存组成。每个参与者都想优化自己的部分。例如，编译器使用寄存器或修改循环；处理器进行乱序执行或分支预测；缓存应用预取指令或缓冲值。结果是——在理想情况下——一个定义良好的、针对硬件平台充分优化的可执行文件。\n\
  \n\n\n\n\n在 C++11 之前，只有一种契约。C++ 语言规范并不包含多线程或原子操作。系统只识别一种控制流，因此优化可执行文件的机会非常有限。系统的关键点在于向程序员保证：程序观察到的行为与源代码中的指令序列相对应。当然，这意味着并没有内存模型。取而代之的是顺序点的概念。`顺序点`是程序中的点，在该点，之前的所有指令的效果必须是可见的。函数执行的开始或结束都是顺序点。当你调用带有两个参数的函数时，C++\
  \ 标准并不保证哪个参数先被求值，因此行为是未定义的。原因很直接——逗号运算符不是顺序点，这在 C++ 中也没有改变。\n\n从 C++11 开始，一切都改变了。C++11\
  \ 是第一个感知到多线程的标准。线程具有“良定义”行为的原因是 C++ 内存模型，该模型深受 [Java 内存模型](https://en.wikipedia.org/wiki/Java_memory_model)\
  \ 的启发，但 C++ 内存模型一如既往地更进了一步。程序员在处理共享变量时必须遵守一些规则以获得“良定义”的程序。如果存在至少数据竞态，程序就是未定义的。正如我提到的，如果你的线程共享可变数据，你就必须意识到数据竞态。任务比线程或条件变量易用得多。\n\
  \n通过原子操作，我们进入了专家领域。我们越是削弱 C++ 内存模型，这一点就越明显。当我们使用原子操作时，经常会谈论无锁编程。我在本小节中讨论了弱规则和强规则。事实上，顺序一致性被称为强内存模型，而宽松语义被称为弱内存模型。\n\
  \n## 基础\n\nC++ 内存模型必须处理以下几点：\n\n*   原子操作：可以不中断地执行的操作。\n*   操作的偏序：不能被重排序的操作序列。\n\
  *   操作的可见性：保证对共享变量的操作对其他线程可见。\n\n契约的基础是针对原子操作的操作，这些操作具有两个特征：它们从定义上来说是原子的或不可分割的，并且它们对程序执行创建了同步和顺序约束。这些同步和顺序约束也适用于非原子操作的操作。一方面，对原子变量的操作始终是原子的，但另一方面，你可以根据需求定制同步和顺序约束。\n\
  \n## 挑战 \n\n我们越是削弱内存模型，就越会把注意力转移到其他事情上，例如：\n\n*   程序具有更大的优化潜力。\n*   程序可能的控制流数量呈指数级增长。\n\
  *   我们处于专家领域。\n*   程序违背了我们的直觉。\n*   我们应用了微优化。\n\n为了处理多线程，我们应该成为专家。在我们想要处理原子操作（顺序一致性）时，我们应该为下一个专家水平开启大门。当我们谈论获取-释放语义或宽松语义时会发生什么？我们向更高（或更深）的下一个专家水平推进。\n\
  \n![专家级别](img/MemoryModel----ExpertLevels.png)\n\n### 专家级别\n\n现在，我们深入研究 C++ 内存模型，并从无锁编程开始。在我们的旅途中，我将介绍原子操作及其操作。一旦我们完成了基础知识，将是内存模型的不同层次。起点是简单直观的顺序一致性，接下来是获取-释放语义，而不那么直观的宽松语义则是我们旅程的终点。\n\
  \n让我们从原子操作开始。\n\n### 原子操作\n\n原子操作是 C++ 内存模型的基础。默认情况下，内存模型的强版本适用于原子操作；因此，理解强内存模型的特征非常有意义。\n\
  \n#### 强内存模型与弱内存模型\n\n正如你可能已经从契约：挑战 小节中了解到的，当我提到强内存模型时指的是顺序一致性，而提到弱内存模型时指的是宽松语义。\n\
  \n##### 强内存模型\n\nJava 5.0 在 2004 年获得了其当前的内存模型，C++ 则在 2011 年。在此之前，Java 拥有一个错误的内存模型，而\
  \ C++ 没有内存模型。那些认为这是一个漫长过程终点的人完全错了。多线程编程的基础已经有 40 到 50 年的历史了。[Leslie Lamport](https://en.wikipedia.org/wiki/Leslie_Lamport)\
  \ 在 1979 年定义了顺序一致性的概念。\n\n顺序一致性提供了两个保证：\n\n*   程序的指令按照编写的顺序执行。\n*   存在一个全局顺序。\n\n\
  在我深入研究这两个保证之前，我想明确强调，这些陈述仅适用于原子操作，但会影响非操作。\n\n这张图显示了两个线程。每个线程分别存储其变量 `x` 或 `y`，加载另一个变量\
  \ `y` 或 `x`，并存储在变量 `res1` 或 `res2` 中。\n\n![两个原子操作](img/MemoryModel----twoAtomics.png)\n\
  \n#### 两个原子操作\n\n由于变量是原子的，操作是原子的。默认情况下，适用顺序一致性。问题是：语句可以以什么顺序执行？\n\n顺序一致性的第一个保证是指令按照源代码中定义的顺序执行。这很简单。存储操作不会超过加载操作。\n\
  \n顺序一致性的第二个保证是所有线程的指令必须遵循一个全局顺序。在上述案例中，这意味着线程 2 看到线程 1 操作顺序与其执行顺序一致。这是关键观察。线程 2\
  \ 按照线程 1 的源码顺序看到所有的操作。从线程 1 的角度来看也是如此。你可以将特征二考虑为所有线程必须遵守的全局时钟。全局时钟就是全局顺序。时钟每跳动一次，就会发生一次原子操作，但你不知道是哪一个。\n\
  \n我们的谜题还没有结束。我们仍然需要两个线程的不同交叉执行。因此，两个线程的六种交叉执行是可能的。\n\n![两个线程的六种交叉执行](img/MemoryModel----atomicInterleaving.png)\n\
  \n#### 两个线程的六种交叉执行\n\n这很简单吧？这就是顺序一致性，也称为强内存模型。\n\n##### 弱内存模型\n\n让我们再次参考程序员与系统之间的契约](#chap05.xhtml_chapterXXXTheCCCContract)。\n\
  \n\n\n\n在这个特定的示例中，程序员使用了原子操作。他遵守了契约要求的义务。系统保证了定义良好的程序行为，且没有数据竞态。此外，系统可以以任何组合执行这四种操作。如果程序员使用松语义（relaxed\
  \ semantic），契约的支柱将发生巨大变化。一方面，程序员要理解两个线程之间可能的交错执行将变得困难得多；另一方面，系统拥有了更多的优化空间。\n\n使用松语义——也称为弱内存模型——这四种操作可能存在更多的组合。这种反直觉的行为是，线程\
  \ 1 可能会以不同的顺序看到线程 2 的操作，因此不存在全局时钟的视图。从线程 1 的角度来看，操作 `res2= x.load()` 可能会超过 `y.store(1)`。线程\
  \ 1 或线程 2 甚至可能不按照源代码定义的顺序执行操作。例如，线程 2 可以先执行 `res2= x.load()`，然后执行 `y.store(1)`。\n\
  \n在顺序一致性和松语义之间还有几个模型。最重要的模型是获取-释放语义（acquire-release semantic）。通过获取-释放语义，程序员必须遵守比顺序一致性更弱的规则。相比之下，系统拥有更多的优化可能性。获取-释放语义是深入理解多线程编程中同步和部分排序的关键，因为线程在代码中特定的同步点进行同步。如果没有这些同步点，线程、任务或条件变量将无法有定义良好的行为。\n\
  \n在最后一节中，我介绍了顺序一致性作为原子操作的默认行为。这意味着什么？你可以为每个原子操作指定内存顺序。如果没有指定内存顺序，则应用顺序一致性，这意味着标志\
  \ `std::memory_order_seq_cst` 会被隐式地应用到原子变量的每一次操作上。\n\n因此，这段代码\n\n```\nx.store(1);\n\
  res = x.load();\n```\n\n等于以下这段代码：\n\n```\nx.store(1, std::memory_order_seq_cst);\n\
  res = x.load(std::memory_order_seq_cst);\n```\n\n为了简单起见，我在本书中使用了第一种形式。现在是时候深入研究\
  \ C++ 内存模型中的原子操作了。我们从基础的 `std::atomic_flag` 开始。\n\n### 原子标志\n\n`std::atomic_flag`\
  \ 是一个原子布尔值。它有清除（clear）和设置（set）两种状态。为了简单起见，我将清除状态称为 `false`，将设置状态称为 `true`。它的 `clear`\
  \ 方法允许你将其值设置为 `false`。通过 `test_and_set` 方法，你可以将值设回 `true` 并返回旧值。没有方法可以查询当前值。这在 C++20\
  \ 中发生了改变。在 C++20 中，`std::atomic_flag` 有了一个 `test` 方法，并通过 `notify_one`、`notify_all`\
  \ 和 `wait` 方法用于线程同步。\n\n`std::atomic_flag` 的所有操作\n\n| 方法 | 说明 |\n| --- | --- |\n\
  | `clear` | 清除原子标志。 |\n| `test_and_set` | 设置原子标志并返回旧值。 |\n| `test` (C++20) | 返回状态。\
  \ |\n| `notify_one` (C++20) | 解除一个原子等待操作的阻塞。 |\n| `notify_all` (C++20) | 解除所有原子等待操作的阻塞。\
  \ |\n| `wait` (C++20) | 阻塞直到被通知。 |\n| | 首先将其与旧的（预期）值进行比较，以防止虚假唤醒。 |\n\n要使用 `std::atomic_flag`，必须使用常量\
  \ `ATOMIC_FLAG_INIT` 将其初始化为 `false`。\n\n`std::atomic_flag` 有两个显著属性。\n\n`std::atomic_flag`\
  \ 是\n\n*   唯一的无锁原子变量。如果保证了系统范围内的进展，则非阻塞算法是无锁的。\n*   高层线程抽象的构建块。\n\n唯一的无锁原子变量？其余更强大的原子变量可以根据\
  \ C++ 标准，在内部使用互斥锁来提供其功能。这些剩余的原子变量有一个名为 `is_lock_free` 方法，用于检查该原子变量内部是否使用了互斥锁。在流行的微处理器架构上，我得到的答案总是\
  \ `true`。你应该意识到这一点，并且如果你想编写无锁程序，请在目标系统上进行检查。\n\n`std::atomic_flag` 的接口足够构建一个自旋锁（spinlock）。通过自旋锁，你可以像使用互斥锁一样保护临界区域。\n\
  \n示例展示了如何借助 `std::atomic_flag` 实现自旋锁：\n\n```cpp\n 1 // spinLock.cpp\n 2 \n 3 #include\
  \ <atomic>\n 4 #include <thread>\n 5 \n 6 class Spinlock{\n 7   std::atomic_flag\
  \ flag = ATOMIC_FLAG_INIT;\n 8 public:\n 9 \n10   void lock(){\n11     while( flag.test_and_set()\
  \ );\n12   }\n13 \n14   void unlock(){\n15     flag.clear();\n16   }\n17 \n18 };\n\
  19 \n20 Spinlock spin;\n21 \n22 void workResource(){\n23   spin.lock();\n24   //临界区域\n\
  25   spin.unlock();\n26 }\n27 \n28 \n29 int main(){\n30 \n31   std::thread t(workResource);\n\
  32   std::thread t2(workResource);\n33 \n34   t.join();\n35   t2.join();\n36 }\n\
  ```\n\n使用 `std::atomic_flag` 的自旋锁\n\n线程 `t` 和 `t2`（31 和 32）都在竞争临界区域。为了简单起见，`std::atomic_flag`\
  \ —— 类似于互斥锁——拥有 `lock` 和 `unlock` 方法（14 - 16）。\n\n使用自旋锁等待\n\n\n\n\n\n如果该理论是正确的，那么我\
  \ PC 的四个核心之一被充分利用了。这正是发生的情况。看这张截图。\n\n![睡眠两秒的自旋锁](img/MemoryModel----spinLockSleep.png)\n\
  \n## 睡眠两秒的自旋锁\n\n截图清楚地显示我的 PC 上一个核心的负载达到了 100%。每次都有一个不同的核心在执行忙等待（busy waiting）。\n\
  \n现在我用 `mutex` 代替 `spinlock`。让我们看看会发生什么。\n\n```cpp\n 1 // mutex.cpp\n 2 \n3 #include\
  \ <mutex>\n 4 #include <thread>\n 5 \n6 std::mutex mut;\n 7 \n8 void workOnResource(){\n\
  9   mut.lock();\n10   std::this_thread::sleep_for(std::chrono::milliseconds(5000));\n\
  11   mut.unlock();\n12 }\n13 \n14 int main(){\n15 \n16   std::thread t(workOnResource);\n\
  17   std::thread t2(workOnResource);\n18 \n19   t.join();\n20   t2.join();\n21 \n\
  22 }\n```\n\n## 使用 mutex 等待\n\n尽管我执行了多次程序，但我并没有观察到任何核心有显著的负载。\n\n![睡眠两秒的互斥锁](img/MemoryModel----mutex.png)\n\
  \n## 睡眠两秒的互斥锁\n\n让我们更进一步，从基础构建块 `std::atomic_flag` 进阶到高级原子类型：类模板 `std::atomic`。\n\
  \n### 类模板 `std::atomic`\n\n这里有多种变体类模板 `std::atomic` 可用。`std::atomic<bool>` 和 `std::atomic<user-defined\
  \ type>` 使用主模板。对于指针 `std::atomic<T*>` 提供了部分特化，对于整数类型 `std::atomic<integral type>`\
  \ 提供了完全特化，在 C++20 中对于浮点数类型提供了 `std::atomic<floating-point>`。整数类型和浮点类型的完全特化行为相似，因此，我将它们统称为算术类型。\n\
  \n原子布尔值和原子用户定义类型支持相同的接口。原子指针扩展了原子布尔值的接口。算术类型也是如此：它们扩展了原子指针的接口。\n\n`std::atomic`\
  \ 各种变体的缺点是，你无法保证它们是无锁的（lock-free）。\n\n#### `std::atomic<bool>`\n\n让我们从 bool 开始：`std::atomic<bool>`\
  \ 使用主模板。`std::atomic<bool>` 比 `std::atomic_flag` 提供的功能得多。它可以被显式地设置为 `true` 或 `false`。`std::atomic<bool>`\
  \ 已经足够同步两个线程，因此，可以用 `std::atomic<bool>` 实现一种条件变量。\n\n让我们先用条件变量来同步两个线程。\n\n```cpp\n\
  \ 1 // conditionVariable.cpp\n 2 \n3 #include <condition_variable>\n 4 #include\
  \ <iostream>\n 5 #include <thread>\n 6 #include <vector>\n 7 \n8 std::vector<int>\
  \ mySharedWork;\n9 std::mutex mutex_;\n10 std::condition_variable condVar;\n11 bool\
  \ dataReady{false};\n12 \n13 void waitingForWork(){\n14     std::cout << \"Waiting\
  \ \" << std::endl;\n15     std::unique_lock<std::mutex> lck(mutex_);\n16     condVar.wait(lck,\
  \ []{ return dataReady; });\n17     mySharedWork[1] = 2;\n18     std::cout << \"\
  Work done \" << std::endl;\n19 }\n20 \n21 void setDataReady(){\n22     mySharedWork\
  \ = {1, 0, 3};\n23     {\n24         std::lock_guard<std::mutex> lck(mutex_);\n\
  25         dataReady = true;\n26     }\n27     std::cout << \"Data prepared\" <<\
  \ std::endl;\n28     condVar.notify_one();\n29 }\n30 int main(){\n31     \n32  \
  \ std::cout << std::endl;\n33 \n34   std::thread t1(waitingForWork);\n35   std::thread\
  \ t2(setDataReady);\n36 \n37   t1.join();\n38   t2.join();\n39 \n40   for (auto\
  \ v: mySharedWork){\n41       std::cout << v << \" \";\n42   }\n43       \n44  \
  \ std::cout << \"\\n\\n\";\n45 \n46 }\n```\n\n## 条件变量的使用\n\n让我对这个程序简单说几句。关于条件变量的深入讨论，请阅读该章节。\n\
  \n `t1` 在第 17 行等待线程 `t2` 的通知。两个线程使用同一个条件变量 `condVar` 并在同一个 `mutex_` 上同步。工作流是如何运行的？\n\
  \n* 线程 `t1`:\n    * 准备工作包 `mySharedWork = {1, 0, 3}`\n    * 将非原子布尔值 `dataReady`\
  \ 设置为 `true`\n    * 发送通知 `condVar.notify_one()`\n* 线程 `t2`:\n    * 在持有锁 `lck` 的情况下等待\
  \ `condVar.wait(lck, []{ return dataReady; })`\n    * 获取通知后继续执行 `mySharedWork[1]\
  \ = 2`\n\n线程 `t1` 设置为 `true` 的布尔值 `dataReady` 以及线程 `t2` 检查的 lambda 函数 `[]{ return\
  \ dataReady; }` 代表一种无状态条件变量。条件变量有两种现象：\n\n1. 虚假唤醒（spurious wakeup）：接收者被唤醒尽管没有通知发生；\n\
  2. 丢失唤醒（lost wakeup）：发送者在接收者处于等待状态之前发送了通知。\n\n现在使用 `std::atomic<bool>` 实现。\n\n```cpp\n\
  \ 1 // atomicCondition.cpp\n 2 \n3 #include <atomic>\n 4 #include <chrono>\n 5 #include\
  \ <iostream>\n 6 #include <thread>\n 7 #include <vector>\n 8 \n9 std::vector<int>\
  \ mySharedWork;\n10 std::atomic<bool> dataReady(false);\n11 \n12 void waitingForWork(){\n\
  13     std::cout << \"Waiting \" << std::endl;\n14     while (!dataReady.load()){\
  \                \n15         std::this_thread::sleep_for(std::chrono::milliseconds(5));\n\
  16     }\n17     mySharedWork[1] = 2;                     \n18     std::cout <<\
  \ \"Work done \" << std::endl;\n19 }\n20 \n21 void setDataReady(){\n22     mySharedWork\
  \ = {1, 0, 3};                  \n23     dataReady = true;                     \
  \     \n24     std::cout << \"Data prepared\" << std::endl;\n25 }\n26 \n27 int main(){\n\
  28     \n29   std::cout << std::endl;\n30 \n31   std::thread t1(waitingForWork);\n\
  32   std::thread t2(setDataReady);\n33 \n34   t1.join();\n35   t2.join();\n36 \n\
  37   for (auto v: mySharedWork){\n38       std::cout << v << \" \";\n39   }\n40\
  \       \n41 \n42   std::cout << \"\\n\\n\";\n43 \n44 }\n```\n\n## 使用 `std::atomic<bool>`\
  \ 实现条件变量\n\n什么能保证第 17 行在第 14 行之后执行？或者更广泛地说，保证线程 `t1` 执行 `mySharedWork[1] = 2` 在线程\
  \ `t2` 执行了 `mySharedWork = {1, 0, 3}` 之后。\n\n`std::atomic<bool>` 以及 `std::atomic`\
  \ 的其他完全或部分特化支持所有原子操作的基础：`compare_exchange_strong` 和 `compare_exchange_weak`。\n\n\
  \n\n\n函数的弱形式（weak forms）允许发生虚假失败，即即使在它们相等的情况下，也会表现得像 `*this != expected` 一样。当比较并交换（compare-and-exchange）位于循环中时，弱版本在某些平台上可能具有更好的性能。\n\
  \n除了布尔值外，还有针对指针、整数和用户定义类型的原子类型。用户定义类型的规则是独特的。\n\n`std::atomic` 的所有变体都支持 CAS 操作。\n\
  \n### 用户定义原子类型 `std::atomic<user-defined type>`\n\n得益于类模板 `std::atomic`，你可以定义自定义的原子类型。\n\
  \n如果你将用户定义类型用于原子类型 `std::atomic<user-defined type>`，那么对该类型有许多严格的限制。原子类型 `std::atomic<user-defined\
  \ type>` 支持与 `std::atomic<bool>` 相同的接口。\n\n以下是用户定义类型成为原子类型的限制条件：\n\n* 用户定义类型的拷贝赋值运算符，以及其所有基类和所有非静态成员的拷贝赋值运算符必须是平凡的（trivial）。这意味着你不能定义拷贝赋值运算符，但你可以通过\
  \ [`default`](http://en.cppreference.com/w/cpp/keyword/default) 向编译器请求它。\n* 用户定义类型不能有虚方法或虚基类。\n\
  * 用户定义类型必须是位操作级可比较的，以便可以使用 C 函数 [memcpy](http://en.cppreference.com/w/cpp/string/byte/memcpy)\
  \ 或 [memcmp](http://en.cppreference.com/w/cpp/string/byte/memcmp)。\n\n如果 `user-defined\
  \ type` 的大小不超过 `int` 的大小，大多数主流平台都可以为 `std::atomic<user-defined type>` 使用原子操作。\n\n\
  ### `std::atomic<T*>`\n\n`std::atomic<T*>` 是类模板 `std::atomic` 的部分特化。原子指针 `std::atomic<T*>`\
  \ 支持 `std::atomic<bool>` 或 `std::atomic<user-defined type>` 支持的所有方法。它的行为类似于普通指针\
  \ `T*`。`std::atomic<T*>` 支持指针算术以及前/后增/减操作。\n\n看一眼这个简短的示例。\n\n```cpp\nint intArray[5];\n\
  std::atomic<int*> p(intArray);\np++;\nassert(p.load() == &intArray[1]);\np+=1;\n\
  assert(p.load() == &intArray[2]);\n--p;\nassert(p.load() == &intArray[1]);\n```\n\
  \n在 C++11 中，存在已知算术数据类型的原子类型。\n\n### `std::atomic<arithmetic type>`\n\n对于每个整数类型，`std::atomic`都有一个完全特化版本\
  \ `std::atomic<integral type>`。`std::atomic<integral type>` 支持 `std::atomic<T*>`\
  \ 支持的所有操作以及更多。此外，在 C++20 中，我们获得了针对已知浮点类型的原子类型。首先，算术类型存在哪些特化版本？以下是详情：\n\n* 字符类型：`char`、`char8_t`\
  \ (C++20)、`char16_t`、`char32_t` 和 `wchar_t`\n* 标准有符号整数类型：`signed char`、`short`、`int`、`long`\
  \ 和 `long long`\n* 标准无符号整数类型：`unsigned char`、`unsigned short`、`unsigned int`、`unsigned\
  \ long` 和 `unsigned long long`\n* 在头文件 [`cstdint>`](http://en.cppreference.com/w/cpp/header/cstdint)\
  \ 中定义的额外整数类型：\n    * `int8_t`、`int16_t`、`int32_t` 和 `int64_t`（精确为 8、16、32 和 64 位的有符号整数）\n\
  \    * `uint8_t`、`uint16_t`、`uint32_t` 和 `uint64_t`（精确为 8、16、32 和 64 位的无符号整数）\n\
  \    * `int_fast8_t`、`int_fast16_t`、`int_fast32_t` 和 `int_fast64_t`（至少 8、16、32 和\
  \ 64 位的最快有符号整数）\n    * `uint_fast8_t`、`uint_fast16_t`、`uint_fast32_t` 和 `uint_fast64_t`（至少\
  \ 8、16、32 和 64 位的最快无符号整数）\n    * `int_least8_t`、`int_least16_t`、`int_least32_t`\
  \ 和 `int_least64_t`（至少 8、16、32 和 64 位的最小有符号整数）\n    * `uint_least8_t`、`uint_least16_t`、`uint_least32_t`\
  \ 和 `uint_least64_t`（至少 8、16、32 和 64 位的最小无符号整数）\n    * `intmax_t` 和 `uintmax_t`（最大有符号和无符号整数）\n\
  \    * `intptr_t` 和 `uintptr_t`（有符号和无符号指针）\n* 浮点数类型：`float`、`double` 和 `long double`\n\
  \n`std::atomic<arithmetic type>` 支持 `+=`、`-=`、`&=`、`|=` 和 `^=` 等复合赋值。`std::atomic<integral\
  \ type>` 返回旧值。`++x` 和 `x--` 是可用的。\n\n\n\n\n| `std::atomic_uint_least16_t` | `std::atomic<std::uint_least16_t>`\
  \ |\n| `std::atomic_int_least32_t` | `std::atomic<std::int_least32_t>` |\n| `std::atomic_uint_least32_t`\
  \ | `std::atomic<std::uint_least32_t>` |\n| `std::atomic_int_least64_t` | `std::atomic<std::int_least64_t>`\
  \ |\n| `std::atomic_uint_least64_t` | `std::atomic<std::uint_least64_t>` |\n| `std::atomic_int_fast8_t`\
  \ | `std::atomic<std::int_fast8_t>` |\n| `std::atomic_uint_fast8_t` | `std::atomic<std::uint_fast8_t>`\
  \ |\n| `std::atomic_int_fast16_t` | `std::atomic<std::int_fast16_t>` |\n| `std::atomic_uint_fast16_t`\
  \ | `std::atomic<std::uint_fast16_t>` |\n| `std::atomic_int_fast32_t` | `std::atomic<std::int_fast32_t>`\
  \ |\n| `std::atomic_uint_fast32_t` | `std::atomic<std::uint_fast32_t>` |\n| `std::atomic_int_fast64_t`\
  \ | `std::atomic<std::int_fast64_t>` |\n| `std::atomic_uint_fast64_t` | `std::atomic<std::uint_fast64_t>`\
  \ |\n| `std::atomic_intptr_t` | `std::atomic<std::intptr_t>` |\n| `std::atomic_uintptr_t`\
  \ | `std::atomic<std::uintptr_t>` |\n| `std::atomic_size_t` | `std::atomic<std::size_t>`\
  \ |\n| `std::atomic_ptrdiff_t` | `std::atomic<std::ptrdiff_t>` |\n| `std::atomic_intmax_t`\
  \ | `std::atomic<std::intmax_t>` |\n| `std::atomic_uintmax_t` | `std::atomic<std::uintmax_t>`\
  \ |\n| `std::atomic_signed_lock_free` (C++20) | `std::atomic<signed integral>` |\n\
  | `std::atomic_unsigned_lock_free` (C++20) | `std::atomic<unsigned integral>` |\n\
  \n类型别名 `atomic_signed_lock_free` 和 `atomic_unsigned_lock_free` 是原子类型的特化，其模板参数为有符号或无符号的整数类型。只有支持无锁整数特化的实现才提供这些别名。实现可以选择最高效的整数特化版本。\n\
  \n### 所有原子操作\n\n首先，是原子类型上所有操作的列表。\n\n#### `atomic` 的所有操作\n\n| 方法 | 描述 |\n| --- |\
  \ --- |\n| `test_and_set` | 原子性地将标志位设置为 `true` 并返回旧值。 |\n| `clear` | 原子性地将标志位设置为\
  \ `false`。 |\n| `is_lock_free` | 检查原子对象是否为无锁。 |\n| `load` | 原子性地返回原子的值。 |\n| `store`\
  \ | 原子性地用非原子值替换原子的值。 |\n| `exchange` | 原子性地将值替换为新值。返回旧值。 |\n| `compare_exchange_strong`\
  \ | 原子性地比较并最终交换值。详情请参见此处。 |\n| `compare_exchange_weak` | |\n| `fetch_add`, `+=`\
  \ | 原子性地加上（或减去）值。 |\n| `fetch_sub`, `-=` | 返回旧值。 |\n| `fetch_or`, `|=` | 原子性地与值进行位位（或、与、异或）操作。\
  \ |\n| `fetch_and`, `&=` | 返回旧值。 |\n| `fetch_xor`, `^=` | |\n| `++`, `--` | 递增或递减（前置和后置）原子对象。\
  \ |\n| `notify_one` (C++20) | 解阻塞一个原子等待操作。 |\n| `notify_all` (C++20) | 解阻塞所有原子等待操作。\
  \ |\n| `wait` (C++20) | 阻塞直到被通知。 |\n| | 将自身与 `old` 值进行比较，以防止虚假唤醒和丢失的唤醒。 |\n| | 如果\
  \ `old` 值不相等，则返回。 |\n\n原子类型没有拷贝构造函数或拷贝赋值运算符，但它们支持从底层内置类型的赋值以及向隐式转换。复合赋值运算符返回新值；而\
  \ `fetch` 系列操作则返回旧值。\n\n```cpp\nstd::atomic<long long> atomObj(0);\natomObj += 5;\
  \ // 返回 0\nlong long x = atomObj.load(); // 返回 5\n```\n\n复合赋值运算符返回新值；而 `fetch` 系列操作则返回旧值。\n\
  \n\n\n\n\n`std::shared_ptr` 提供的保证由 [Boost](http://www.boost.org/doc/libs/1_57_0/libs/smart_ptr/shared_ptr.htm#ThreadSafety)\
  \ 描述。\n\n1. 一个 `shared_ptr` 实例可以被多个线程同时“读取”（仅使用常数操作进行访问）。\n2. 不同的 `shared_ptr` 实例可以被多个线程同时“写入”（使用如\
  \ `operator=` 或 `reset` 等可变操作进行访问）（即使这些实例是副本，并且底层共享相同的引用计数也是如此）。\n\n为了让这两个陈述更清晰，我来展示一个简单的示例。当你在线程中拷贝\
  \ `std::shared_ptr` 时，一切都是正常的。\n\n```\n1 std::shared_ptr<int> ptr = std::make_shared<int>(2011);\n\
  2 \n3 for (auto i = 0; i < 10; i++){\n4    std::thread([ptr]{                  \
  \         \n5      std::shared_ptr<int> localPtr(ptr);       \n6      localPtr =\
  \ std::make_shared<int>(2014);     \n7     }).detach(); \n8 }\n```\n\n### `std::shared_ptr`\
  \ 的线程安全拷贝\n\n让我们先看第 5 行。通过为 `std::shared_ptr localPtr` 使用拷贝构造，只使用了控制块。这是线程安全的。第\
  \ 6 行稍微有趣一点。`localPtr` 被设置为一个新的 `std::shared_ptr`。从多线程的角度来看，这不是一个问题：lambda 函数（第\
  \ 4 行）通过拷贝绑定了 `ptr`。因此，对 `localPtr` 的修改发生在副本上。\n\n如果我通过引用获取 `std::shared_ptr`，情况就会发生剧烈变化。\n\
  \n```\n1 std::shared_ptr<int> ptr = std::make_shared<int>(2011);  \n2 \n3 for (auto\
  \ i = 0; i < 10; i++){\n4    std::thread([&ptr]{                         \n5   \
  \   ptr = std::make_shared<int>(2014);         \n6    }).detach(); \n7 }\n```\n\n\
  ### `std::shared_ptr` 上的数据竞态\n\nlambda 函数在第 4 行通过引用绑定了 `std::shared_ptr ptr`。这意味着赋值操作（第\
  \ 5 行）可能变成对底层资源的并发读写；因此，程序将具有未定义行为。\n\n诚然，上一个例子并不容易实现。在多线程环境中，`std::shared_ptr`\
  \ 需要特别注意。`std::shared_ptr` 是 C++ 中唯一存在原子操作的非原子数据类型。\n\n### `std::shared_ptr` 的原子操作\n\
  \n针对 `std::shared_ptr` 有特殊的原子操作：`load`、`store`、`compare_and_exchange`。通过使用显式变体你甚至可以指定内存排序。以下是\
  \ `std::shared_ptr` 的自由原子操作。\n\n```\nstd::atomic_is_lock_free(std::shared_ptr)\n\
  std::atomic_load(std::shared_ptr)\nstd::atomic_load_explicit(std::shared_ptr)\n\
  std::atomic_store(std::shared_ptr)\nstd::atomic_store_explicit(std::shared_ptr)\n\
  std::atomic_exchange(std::shared_ptr)\nstd::atomic_exchange_explicit(std::shared_ptr)\n\
  std::atomic_compare_exchange_weak(std::shared_ptr)\nstd::atomic_compare_exchange_strong(std::shared_ptr)\n\
  std::atomic_compare_exchange_weak_explicit(std::shared_ptr)\nstd::atomic_compare_exchange_strong_explicit(std::shared_ptr)\n\
  ```\n\n### `std::shared_ptr` 的原子操作实现\n\n详情请参阅 [cppreference.com](http://en.cppreference.com/w/cpp/memory/shared_ptr)。现在以线程安全的方式修改在线程中引用绑定的共享指针变得简单了。\n\
  \n```\n1 std::shared_ptr<int> ptr = std::make_shared<int>(2011);\n2 \n3 for (auto\
  \ i = 0;i < 10; i++){\n4    std::thread([&ptr]{ \n5      auto localPtr = std::make_shared<int>(2014);\n\
  6      std::atomic_store(&ptr, localPtr);            \n7    }).detach(); \n8 }\n\
  ```\n\n### 解决 `std::shared_ptr` 的数据竞态\n\n在表达式 `auto localPtr = std::make_shared<int>(2014)`\
  \ 中对 `std::shared_ptr ptr` 的更新是线程安全的。一切正常吗？不！最后，我们需要原子智能指针。\n\n让我们跳转到 C++20。\n\n\
  ### 类模板 `std::atomic_ref` (C++20)\n\n类模板 `std::atomic_ref` 将原子操作应用于被引用的非原子对象。因此，对原子对象的并发写入和读取不会导致数据竞态。被引用对象的生命周期必须超过\
  \ `atomic_ref` 的生命周期。使用 `atomic_ref` 访问被引用对象的子对象是未良好定义的。\n\n根据 `std::atomic`，`std::atomic_ref`\
  \ 可以被特化并支持特化版本。\n\n#### `std::atomic_ref`\n\n主模板 `std::atomic_ref` 可以被用 `TriviallyCopyable`\
  \ 类型实例化。\n\n```cpp\nstruct Counters {\n    int a;\n    int b;\n};\n\nstd::atomic_ref<Counters>\
  \ counter;\n```\n\n#### `std::atomic_ref` 的特化\n\n`std::atomic_ref` 可以针对指针类型或算术类型进行特化。\n\
  \n#### 针对算术类型的特化\n\n标准为浮点类型提供了特化。\n\n### 所有原子操作\n\n首先，这是 `atomic_ref` 的所有操作列表。\n\
  \n`atomic_ref` 的所有操作\n\n| 方法 | 描述 |\n| --- | --- |\n| `is_lock_free` | 检查 `atomic_ref`\
  \ 对象是否无锁。 |\n| `load` | 原子地返回对象的值。 |\n| `store` | 原子地用非原子替换对象的值。 |\n| `exchange`\
  \ | 原子地将引用对象的值替换为新值。 |\n| `compare_exchange_strong` | 原子地比较并最终交换引用对象的值。详情见此处。 |\n\
  | `compare_exchange_weak` | |\n| `fetch_add`, `+=` | 原子地对引用对象加上（减去）该值。 |\n| `fetch_sub`,\
  \ `-=` | |\n| `fetch_or`, `&#124;=` | 原子地对引用对象执行位或、位与和位异或操作。 |\n| `fetch_and`, `&=`\
  \ | |\n| `fetch_xor`, `^=` | |\n| `++`, `--` | 递增或递减（前置和后置）引用对象。 |\n| `notify_one`\
  \ | 唤醒一个原子等待操作。 |\n| `notify_all` | 唤醒所有原子等待操作。 |\n| `wait` | 阻塞直到被通知。 |\n\n\n\n\
  \n\n|   | 与 `old` 值进行比较，以防止虚假唤醒和丢失唤醒。 |\n|   | 如果 `old` 值比较后结果不相等，则返回。 |\n\n复合赋值运算符返回新值；而获取（fetch）类的变体则返回旧值。\n\
  \n每个方法都支持一个额外的内存顺序参数。内存顺序参数的默认值是 `std::memory_order_seq_cst`，但你也可以使用 `std::memory_order_relaxed`、`std::memory_order_consume`、`std::memory_order_acquire`、`std::memory_order_release`\
  \ 或 `std::memory_order_acq_rel`。`compare_exchange_strong` 和 `compare_exchange_weak`\
  \ 方法可以使用两个内存顺序参数：一个用于成功情况，另一个用于失败情况。如果你只显式提供一个内存顺序，它将同时用于成功和失败情况。更多细节请参阅内存顺序。\n\n\
  当然，并不是所有的操作都适用于 `std::atomic_ref` 所引用的所有类型。下表显示了取决于 `std::atomic_ref` 引用类型的所有原子操作列表。\n\
  \n### 取决于 `std::atomic_ref` 引用类型的所有原子操作\n\n| 方法 | `atomic_ref<T>` | `atomic_ref<integral>`\
  \ | `atomic_ref<floating>` | `atomic_ref<T*>` |\n| --- | --- | --- | --- | --- |\n\
  | `is_lock_free` | yes | yes | yes | yes |\n| `load` | yes | yes | yes | yes |\n\
  | `store` | yes | yes | yes | yes |\n| `exchange` | yes | yes | yes | yes |\n| `compare_exchange_strong`\
  \ | yes | yes | yes | yes |\n| `compare_exchange_weak` | yes | yes | yes | yes |\n\
  | `fetch_add`, `+=` | | yes | yes | yes |\n| `fetch_sub`, `-=` | | yes | yes | yes\
  \ |\n| `fetch_or`, `|=` | | yes | | |\n| `fetch_and`, `&=` | | yes | | |\n| `fetch_xor`,\
  \ `^=` | | yes | | | |\n| `++`, `--` | | yes | | yes |\n| `notify_one` | yes | yes\
  \ | yes | yes |\n| `notify_all` | yes | yes | yes | yes |\n| `wait` | yes | yes\
  \ | yes | yes |\n\n原子操作及其原子操作是内存模型的基础构建模块。它们建立了适用于原子操作和非原子操作的同步和排序约束。让我们更深入地查看同步和排序约束。\n\
  \n##### 同步与排序约束\n\n你无法配置原子数据类型的原子性，但你可以精确地调整原子操作的同步和排序约束。调整同步和排序约束是 C++ 特有的可能性，这在\
  \ C# 或 Java 的内存模型中是不可能的。\n\nC++ 有六种不同的内存模型变体。关键问题是它们的特征是什么？\n\n#### C++ 中内存顺序的六种变体\n\
  \n我们已经知道 C++ 有六种内存顺序变体。原子操作的默认值是 `std::memory_order_seq_cst`。该表达式表示顺序一致性。此外，你也可以显式指定其他五种之一。那么\
  \ C++ 提供了提供了什么？\n\n```\nenum memory_order{\n    memory_order_relaxed,\n    memory_order_consume,\n\
  \    memory_order_acquire,\n    memory_order_release,\n    memory_order_acq_rel,\n\
  \    memory_order_seq_cst\n}\n```\n\n#### 内存顺序\n\n为了分类这六种内存顺序，回答两个问题很有帮助：\n\n1.\
  \ 哪种原子操作应该使用哪种内存模型？\n2. 六种变体定义了哪些同步和排序约束？\n\n我的计划非常简单：我回答这两个问题。\n\n##### 原子操作的类型\n\
  \n有三种不同的操作：\n\n* 读操作：`memory_order_acquire` 和 `memory_order_consume`\n* 写操作：`memory_order_release`\n\
  * 读-修改-写操作：`memory_order_acq_rel` 和 `memory_order_seq_cst`\n\n`memory_order_relaxed`\
  \ 没有定义任何同步和排序约束。它不属于这种分类法。\n\n下表根据原子操作的读写特征对其进行了排序。\n\n##### 原子操作的特征\n\n| 操作 | 读\
  \ | 写 | 读-修改-写 |\n| --- | --- | --- | --- |\n| `test_and_set` | | | yes |\n| `clear`\
  \ | | yes | |\n| `is_lock_free` | yes | | |\n| `load` | yes | | |\n| `store` | |\
  \ yes | |\n| `exchange` | | yes | |\n| `compare_exchange_strong` | | | yes |\n|\
  \ `compare_exchange_weak` | | | yes |\n| `fetch_add`, `+=` | | | yes |\n| `fetch_sub`,\
  \ `-=` | | | yes |\n| `fetch_or`, `|=` | | yes | |\n| `fetch_and`, `&=` | | yes\
  \ | |\n| `fetch_xor`, `^=` | | yes | |\n| `++`, `--` | | yes | | yes |\n| `notify_one`\
  \ | yes | yes | yes |\n| `notify_all` | yes | yes | yes |\n| `wait` | yes | yes\
  \ | yes |\n\n##### 同步与排序约束\n\n粗俗来说，C++ 有三种不同类型的同步和排序约束：\n\n* 顺序一致性：`std::memory_order_seq_cst`\n\
  * 获取-释放：`memory_order_consume`、`memory_order_acquire`、`memory_order_release` 和 `memory_order_acq_rel`\n\
  * 松弛：`memory_order_relaxed`\n\n虽然顺序一致性建立了线程间的全局顺序，获取-释放语义建立了同一原子变量读写操作之间的排序。松弛语义仅保证原子\
  \ `m` 的修改顺序。修改顺序意味着特定原子 `m` 的所有修改遵循某种全排序。因此，线程对原子对象的读取不会看到比已观察到的更“旧”的值。\n\n不同的内存模型及其对原子和非原子操作的影响使得\
  \ C++ 内存模型成为一个有趣且具有挑战的话题。让我们讨论顺序一致性、获取-释放语义和松弛语义的同步与排序约束。\n\n#### 顺序一致性\n\n让我们深入探讨顺序一致性。顺序一致性的关键在于所有线程的操作遵循一个宇宙时钟。这个全局时钟使其变得非常直观。\n\
  \n顺序一致性的直观是有代价的。缺点是系统必须同步线程。\n\n读-修改-写操作还有一个保证：它们提供最新的值。以下程序通过顺序一致性同步了生产者和消费者线程。\n\
  \n```\n 1 // producerConsumer.cpp\n 2 \n 3 #include <atomic>\n 4 #include <iostream>\n\
  \ 5 #include <string>\n 6 #include <thread>\n 7 \n 8 std::string work;\n 9 std::atomic<bool>\
  \ ready(false);\n 10 \n 11 void consumer(){\n 12   while(!ready.load()){}\n 13 \
  \  std::cout<< work << std::endl;    \n 14 }\n 15 \n 16 void producer(){\n 17  \
  \ work= \"done\";\n 18   ready=true; \n 19 }\n 20 \n 21 int main(){\n 22   std::thread\
  \ prod(producer);\n 23   std::thread con(consumer);\n 24   prod.join(); \n 25  \
  \ con.join();\n 26 }\n```\n\n##### 使用顺序一致性的生产者-消费者同步\n\n该程序的输出并不非常有趣。\n\n\n\n\n\n\
  ![具有顺序一致性的生产者-消费者同步](img/MemoryModel----producerConsumer.png)\n\n# 具有顺序一致性的生产者-消费者同步\n\
  \n由于顺序一致性，程序的执行是确定性的。它的输出始终是“done”。\n\n该图描绘了操作的序列。消费者线程在 `while` 循环中等待，直到原子变量 `ready`\
  \ 被设置为 `true`。当这种情况发生时，消费者线程继续执行其工作。\n\n![顺序一致性的执行顺序](img/MemoryModel----SequenzielleKonsistenz.png)\n\
  \n## 顺序一致性的执行顺序\n\n要理解程序总是返回“done”其实非常容易。我们只需要用用顺序一致性的两个特性：一方面，两个线程都按照源代码的顺序执行它们的指令；另一方面，每个线程以相同的顺序看到另一个线程的操作。两个线程都遵循同一个全局时钟。这种同步也同样适用于\
  \ - 通过借助 `while(!ready.load()){}` 循环 - 实现了生产者和消费者线程之间的同步。\n\n我可以使用内存排序的术语更正式地解释这种推理。以下是形式化版本：\n\
  \n1. `work= \"done\"` *顺序先于* (sequenced-before) `ready = true`\n   **⇒** `work=\
  \ \"done\"` *发生于* (happens-before) `ready = true`\n\n2. `while(!ready.load()){}`\
  \ *顺序先于* `std::cout << work << std::endl`\n   **⇒** `while(!ready.load()){}` *发生于*\
  \ `std::cout<< work << std::endl`\n\n3. `ready= true` *同步于* (synchronizes-with)\
  \ `while(!ready.load()){}`\n   **⇒** `ready= true` *线程间发生于* (inter-thread happens-before)\
  \ `while (!ready.load()){}`\n   **⇒** `ready= true` *发生于* `while (!ready.load()){}`\n\
  \n最终结论：由于 *happens-before* 关系具有传递性，可以得出 `work = \"done\"` *发生于* `ready= true` *发生于*\
  \ `while(!ready.load()){}` *发生于* `std::cout<< work << std::endl`\n\n在顺序一致性中，一个线程会以相同的顺序看到另一个线程的操作，因此看到所有其他线程的操作。如果我们对原子操作使用获取-释放（acquire-release）语义，顺序一致性的关键特性就不再成立。获取-释放语义是\
  \ C# 和 Java 并不遵循的领域。这也是我们的直觉开始减弱的领域。\n\n## 获取-释放语义\n\n在获取-释放语义中，线程之间没有全局同步；只有**同一个原子变量上的**原子操作之间存在同步。一个线程对某个原子变量的写操作与另一个线程对该原子变量的读操作同步。\n\
  \n获取-释放语义基于一个基本思想：释放操作（release operation）与同一原子变量上的获取操作（acquire operation）同步，并建立一个顺序约束。该顺序约束意味着所有的读写操作都不能移动到释放操作之后，且所有的读写操作不能移动到获取操作之前。\n\
  \n什么是获取操作或释放操作？使用 `load` 或 `test_and_set` 读取原子变量是获取操作。还有更多：释放锁或互斥锁 *同步于* 获取锁或互斥锁。线程的构造\
  \ *同步于* 可调用对象的调用。线程的完成 *同步于* `join` 调用。任务的可调用对象的完成 *同步于* 对 future 上的 `wait` 或 `get`\
  \ 调用。获取和释放操作是成对出现的。\n\n记住这幅图会有很大帮助。\n\n![关键区域](img/MemoryModel----criticalRegion.png)\n\
  \n## 关键区域\n\n现在，让我们再次看一眼 std::atomic_flag 节节中的自旋锁。我们可以更高效地编写它，因为同步是通过原子标记 `flag`\
  \ 完成的。因此，应用了获取-释放语义。\n\n```\n 1 // spinlockAcquireRelease.cpp\n 2 \n 3 #include\
  \ <atomic>\n 4 #include <thread>\n 5 \n6 class Spinlock{\n 7   std::atomic_flag\
  \ flag;\n 8 public:\n 9   Spinlock(): flag(ATOMIC_FLAG_INIT) {}\n10 \n11   void\
  \ lock(){\n12     while(flag.test_and_set(std::memory_order_acquire));\n13   }\n\
  14 \n15   void unlock(){\n16     flag.clear(std::memory_order_release);\n17   }\n\
  18 };\n19 \n20 Spinlock spin;\n21 \n22 void workOnResource(){\n23   spin.lock();\n\
  24   // shared resource\n25   spin.unlock();\n26 }\n27 \n28 \n29 int main(){\n30\
  \ \n31   std::thread t(workOnResource);\n32   std::thread t2(workOnResource);\n\
  33 \n34   t.join();\n35   t2.join();\n36 \n37 }\n```\n\n### 具有获取-释放语义的自旋锁\n\n第 16\
  \ 行的 `flag.clear` 调用是一个释放操作，第 12 行的 `flag.test_and_set` 调用是一个获取操作，且获取与释放操作同步。两个线程之间的重量同步被获取-释放语义所取代。\n\
  \n### 传递性\n\n在下面的示例中，`t2` 是 `t1` 和 `t3` 之间的连接。\n\n```\n1 // transitivity.cpp\n 2\
  \ \n3 #include <atomic>\n 4 #include <iostream>\n 5 #include <thread>\n 6 #include\
  \ <vector>\n 7 \n8 std::vector<int> mySharedWork;\n9 std::atomic<bool> dataProduced(false);\n\
  10 std::atomic<bool> dataConsumed(false);\n11 \n12 void dataProducer(){\n13    \
  \ mySharedWork = {1,3};\n14     dataProduced.store(true, std::memory_order_release);\n\
  15 }\n16 \n17 void deliveryBoy(){\n18     while(!dataProduced.load(std::memory_order_acquire));\n\
  19     dataConsumed.store(true, std::memory_order_release);\n20 }\n21 \n22 void\
  \ dataConsumer(){\n23     while(!dataConsumed.load(std::memory_order_acquire));\n\
  24     mySharedWork[1] = 2;\n25 }\n26 \n27 int main(){\n28     \n29   std::cout\
  \ << std::endl;\n30 \n31   std::thread t1(dataConsumer);\n32   std::thread t2(deliveryBoy);\n\
  33   std::thread t3(dataProducer);\n34 \n35   t1.join();\n36   t2.join();\n37  \
  \ t3.join();\n38   \n39   for (auto v: mySharedWork){\n40       std::cout << v <<\
  \ \" \";\n41   }\n42       \n43   std::cout << \"\\n\\n\";\n44   \n45 }\n```\n\n\
  # 获取-释放语义的传递性\n\n程序的输出是确定性的。`mySharedWork` 拥有值 1、2 和 3。\n\n![程序 transitivity.cpp\
  \ 的输出](img/MemoryModel----trans.png)\n\n程序 transitivity.cpp 的输出\n\n有两个重要的观察：\n\n\
  1. 线程 `t2` 在第 18 行等待，直到线程 `t3` 将 `dataProduced` 设置为 `true`（第 14 行）。\n\n2. 线程 `t1`\
  \ 在第 23 行等待，直到线程 `t2` 将 `dataConsumed` 设置为 `true`（第 19 行）。\n\n\n\n\n让我用一张图表来解释剩余部分。\n\
  \n![获取-释放语义的传递性](img/MemoryModel----transitivity.PNG)\n\n# 获取-释放语义的传递性\n\n图中核心部分是箭头。\n\
  \n* `蓝色` 箭头是 `sequenced-before`（顺序化-先于）关系。这意味着一个线程中的所有操作都是按照源代码的顺序执行的。\n* `红色` 箭头是\
  \ `synchronizes-with`（同步）关系。其原因是针对同一个原子变量的原子操作具有获取-释放语义。原子变量之间的同步（因此线程之间的同步）发生在特定的点。\n\
  * `sequenced-before` 建立了 `happens-before`（发生于）关系，并通过 `synchronizes-with` 建立了 `inter-thread\
  \ happens-before`（线程间发生于）关系。\n\n其余非常简单。指令的 `happens-before` 和 `inter-thread happens-before`\
  \ 顺序对应于从上到下的箭头方向。最后，我们保证了 `mySharedWork[1] == 2` 是最后执行的。\n\n释放操作 `synchronizes-with`\
  \ 同一个原子变量上的获取操作，因此我们可以轻松地同步线程，**如果** ……。典型的误解在于这个**如果**。\n\n## 典型的误解\n\n我写关于获取-释放语义的典型误解的动力是什么？我的很多读者和学生已经掉进了这个陷阱。让我们来看这个直观的情况。\n\
  \n### 包含等待的情况\n\n这里有一个简单的程序作为起点。\n\n```\n 1 // acquireReleaseWithWaiting.cpp\n 2\
  \ \n 3 #include <atomic>\n 4 #include <iostream>\n 5 #include <thread>\n 6 #include\
  \ <vector>\n 7 \n 8 std::vector<int> mySharedWork;\n 9 std::atomic<bool> dataProduced(false);\n\
  10 \n11 void dataProducer(){\n12     mySharedWork = {1, 0, 3};\n13     dataProduced.store(true,\
  \ std::memory_order_release);\n14 }\n15 \n16 void dataConsumer(){\n17     while(\
  \ !dataProduced.load(std::memory_order_acquire) );\n18     mySharedWork[1] = 2;\n\
  19 }\n20 \n21 int main(){\n22     \n23   std::cout << std::endl;\n24 \n25   std::thread\
  \ t1(dataConsumer);\n26   std::thread t2(dataProducer);\n27 \n28   t1.join();\n\
  29   t2.join();\n30   \n31   for (auto v: mySharedWork){\n32       std::cout <<\
  \ v << \" \";\n33   }\n34       \n35   std::cout << \"\\n\\n\";\n36   \n37 }\n```\n\
  \n### 带有等待的获取-释放\n\n第 17 行的消费者线程 `t1` 等待第 13 行的生产者线程 `t2` 将 `dataProduced` 设置为 `true`。`dataProduced`\
  \ 是守护符，它保证了对非原子变量 `mySharedWork` 的访问是同步的。同步意味着生产者线程 `t2` 初始化了 `mySharedWork`，然后消费者线程\
  \ `t2` 通过将 `mySharedWork[1]` 设置为 `2` 完成了工作。该程序是定义良好的。\n\n![执行 acquireReleaseWithWaiting\
  \ 程序](img/MemoryModel----acquireReleaseWithWaiting.png)\n\n执行 acquireReleaseWithWaiting\
  \ 程序\n\n图表显示了线程内部的 `happens-before` 关系以及线程之间的 `synchronizes-with` 关系。`synchronizes-with`\
  \ 建立了 `inter-thread happens-before` 关系。其余的推理是 `happens-before` 关系的传递性。\n\n最后得出 `mySharedWork\
  \ = {1, 0, 3}` `happens-before` `mySharedWork[1] = 2`。\n\n![带有等待的获取-释放语义](img/MemoryModel----withWaiting.png)\n\
  \n### 带有等待的获取-释放语义\n\n这种推理中经常缺失哪个方面？**如果**。\n\n### 如果 ……\n\n如果第 17 行的消费者线程 `t1`\
  \ 不等待第 13 行的生产者线程 `t2` 会发生什么？\n\n```\n 1 // acquireReleaseWithoutWaiting.cpp\n 2\
  \ \n 3 #include <atomic>\n 4 #include <iostream>\n 5 #include <thread>\n 6 #include\
  \ <vector>\n 7 \n 8 std::vector<int> mySharedWork;\n 9 std::atomic<bool> dataProduced(false);\n\
  10 \n11 void dataProducer(){\n12     mySharedWork = {1, 0, 3};\n13     dataProduced.store(true,\
  \ std::memory_order_release);\n14 }\n15 \n16 void dataConsumer(){\n17     dataProduced.load(std::memory_order_acquire);\n\
  18     mySharedWork[1] = 2;\n19 }\n20 \n21 int main(){\n22     \n23   std::cout\
  \ << std::endl;\n24 \n25   std::thread t1(dataConsumer);\n26   std::thread t2(dataProducer);\n\
  27 \n28   t1.join();\n29   t2.join();\n30   \n31   for (auto v: mySharedWork){\n\
  32       std::cout << v << \" \";\n33   }\n34       \n35   std::cout << \"\\n\\\
  n\";\n36   \n37 }\n```\n\n不带等待的获取-释放\n\n由于在 `mySharedWork` 上存在数据竞争，该程序具有未定义行为。\n\
  \n![获取-释放语义的未定义行为](img/MemoryModel----acquireReleaseWithWaiting.png)\n\n\n\n\n这对于第二次调用\
  \ `atom.fetch_sub(1, std::memory_order_acquire)` 并不适用。这是一个读取-修改-写入操作，且没有 `std::memory_order_release`\
  \ 标签。这意味着特别是，第二次调用 `atom.fetch_sub(1, std::memory_order_acquire)` 并没有与第一次同步（synchronize-with），在\
  \ `sharedVariable` 上可能会发生数据竞态。可能由于由于释放序列（release sequence），这种情况并没有发生。释放序列扩展到了第二次调用\
  \ `atom.fetch_sub(1, std::memory_order_acquire)`；因此，第二次调用 `atom.fetch_sub(1, std::memory_order_acquire)`\
  \ 与第一次调用存在“发生于”（happens-before）的关系。\n\n最后，这里是程序的输出。\n\n![释放序列](img/MemoryModel----releaseSequence.png)\n\
  \n释放序列\n\n更正式地说，释放序列的定义参考 [N4659: Working Draft, Standard for Programming Language\
  \ C++](http://www.open-std.org/jtc1/sc22/wg21/docs/papers/2017/n4659.pdf)。\n\n如果你仔细遵循我的解释（例如在挑战\
  \ 小节所示），你可能预期接下来是松弛语义；但我先来看内存模型 `std::memory_order_consume`，它与 `std::memory_order_acquire`\
  \ 非常相似。\n\n### `std::memory_order_consume`\n\n`std::memory_order_consume` 是六种内存排序中最传奇的。基于两个原因：首先，`std::memory_order_consume`\
  \ 极其难以理解；其次——这未来可能会改变——目前没有编译器支持它。在 C++17 中情况变得更糟了。官方表述是：“释放-消费排序的规范正在修订中，暂时不建议使用\
  \ `memory_order_consume`。”\n\n一个实现 C++11 标准的编译器怎么不支持 `std::memory_order_consume`\
  \ 内存模型呢？答案是编译器将 `std::memory_order_consume` 映射到了 `std::memory_order_acquire`。这种映射是可以接受的，因为两者都是加载（load）或获取（acquire）操作。`std::memory_order_consume`\
  \ 相比 `std::memory_order_acquire` 需要更弱的同步和排序限制。因此，释放-获取排序可能比释放-消费排序慢，但是（这是关键点）——它是**定义良好的**（well-defined）。\n\
  \n为了理解释放-消费排序，将其与释放-获取排序进行比较是一个好主意。在接下来的小节中，我明确地讨论释放-获取排序，而不是获取-释放语义，以强调 `std::memory_order_consume`\
  \ 和 `std::memory_order_acquire` 之间的强关系。\n\n#### 释放-获取排序\n\n作为起点，让我们使用下面这个包含两个线程\
  \ `t1` 和 `t2` 的程序。`t1` 扮演生产者角色，`t2` 扮演消费者角色。原子变量 `ptr` 帮助同步生产者和消费者。\n\n```\n 1 //\
  \ acquireRelease.cpp\n 2 \n3 #include <atomic>\n 4 #include <thread>\n 5 #include\
  \ <iostream>\n 6 #include <string>\n 7 \n 8 using namespace std;\n 9  \n10 atomic<string*>\
  \ ptr;\n11 int data;\n12 atomic<int> atoData;\n 13  \n14 void producer(){\n15  \
  \   string* p  = new string(\"C++11\");\n16     data = 2011;\n17     atoData.store(2014,\
  \ memory_order_relaxed);\n18     ptr.store(p, memory_order_release);\n19 }\n20 \
  \ \n21 void consumer(){\n22     string* p2;\n23     while (!(p2 = ptr.load(memory_order_acquire)));\n\
  24     cout << \"*p2: \" << *p2 << endl;\n25     cout << \"data: \" << data << endl;\n\
  26     cout << \"atoData: \" << atoData.load(memory_order_relaxed) << endl;\n27\
  \ }\n28  \n29 int main(){\n30     \n31     cout << endl;\n32     \n33     thread\
  \ t1(producer);\n34     thread t2(consumer);\n35     \n36     t1.join();\n37   \
  \  t2.join();\n38     \n39     cout << endl;\n40     \n41 }\n```\n\n释放-获取排序\n\n\
  在分析程序之前，我想介绍一个微小的变体。\n\n#### 释放-消费排序\n\n我将第 21 行的内存排序 `std::memory_order_acquire`\
  \ 替换为 `std::memory_order_consume`。\n\n```\n 1 // acquireConsume.cpp\n 2 \n3 #include\
  \ <atomic>\n 4 #include <thread>\n 5 #include <iostream>\n 6 #include <string>\n\
  \ 7 \n 8 using namespace std;\n 9  \n10 atomic<string*> ptr;\n11 int data;\n12 atomic<int>\
  \ atoData;\n 13  \n14 void producer(){\n15     string* p  = new string(\"C++11\"\
  );\n16     data = 2011;\n17     atoData.store(2014, memory_order_relaxed);\n18 \
  \    ptr.store(p, memory_order_release);\n19 }\n20  \n21 void consumer(){\n22  \
  \   string* p2;\n23     while (!(p2 = ptr.load(memory_order_acquire)));\n24    \
  \ cout << \"*p2: \" << *p2 << endl;\n25     cout << \"data: \" << data << endl;\n\
  26     cout << \"atoData: \" << atoData.load(memory_order_relaxed) << endl;\n27\
  \ }\n28  \n29 int main(){\n30     \n31     cout << endl;\n32     \n33     thread\
  \ t1(producer);\n34     thread t2(consumer);\n35     \n36     t1.join();\n37   \
  \  t2.join();\n38     \n39     cout << endl;\n40     \n41 }\n```\n\n释放-获取排序\n\n\
  现在程序具有未定义行为。这个表述是非常具有假设性的的，因为 GCC 5.4 将 `std::memory_order_consume` 实现为 `std::order_acquire`。程序的输出是相同的。\n\
  \n![释放-获取与释放-消费排序](img/MemoryModel----acquireConsume.png)\n\n释放-获取与释放-消费排序\n\n\n\
  \n\n\n表达式 `ptr.store(p, std::memory_order_release)` 优于（dependency-ordered-before）表达式\
  \ `while (!(p2 = ptr.load(std::memory_order_consume)))`，因为接下来的行 `std::cout << \"\
  *p2: \" << *p2 << std::endl` 被读取为加载操作的结果。此外还有：`while (!(p2 = ptr.load(std::memory_order_consume))`\
  \ 传递依赖（carries-a-dependency-to）给 `std::cout << \"*p2: \" << *p2 << std::endl`，因为\
  \ `*p2` 的输出使用了 `ptr.load` 操作的结果。\n\n我们无法保证 `data` 和 `atoData` 的输出。因为它们与 `ptr.load`\
  \ 操作之间都不存在依赖传递（carries-a-dependency）关系。情况更糟的是：由于 `data` 是一个非原子变量，变量 `data` 上存在数据竞态。原因是两个线程可以同时访问\
  \ `data`，且线程 `t1` 想要修改 `data`。因此，该程序具有未定义行为。\n\n最后，我们达到了松弛语义（relaxed semantic）。\n\
  \n## 松弛语义\n\n松弛语义是光谱的另一端。松弛语义是所有内存模型中最弱的，它只保证原子的修改顺序。这意味着原子变量上的所有修改都按照某个特定的总顺序发生。\n\
  \n## 无同步和排序限制\n\n这非常简单。如果没有规则，我们就无法违反它们。然而，这又太简单了；程序应该具有良好定义的行为。良好定义（well-defined）的行为特别意味着，你通常使用更强内存排序的同步和排序限制来控制具有松弛语义的操作。这是如何工作的？线程可能会以任意顺序看到另一个线程的影响，因此你必须确保程序中存在某些点，使得所有线程上的所有操作都得到同步。\n\
  \n原子操作的一个典型例子（其操作顺序并不重要）是计数器。对于计数器来说，关键观察不在于不同线程递增计数器的顺序；关键观察在于所有的递增都是原子的，并且所有的递增都在最后完成。请看以下示例。\n\
  \n```cpp\n 1 // relaxed.cpp\n 2 \n3 #include <vector>\n 4 #include <iostream>\n\
  \ 5 #include <thread>\n 6 #include <atomic>\n 7  \n 8 std::atomic<int> count = {0};\n\
  \ 9  \n10 void add()\n11 {\n12     for (int n = 0; n < 1000; ++n) {\n13        \
  \ count.fetch_add(1, std::memory_order_relaxed);\n14     }\n15 }\n16  \n17 int main()\n\
  18 {\n19     std::vector<std::thread> v;\n20     for (int n = 0; n < 10; ++n) {\n\
  21         v.emplace_back(add);\n22     }\n23     for (auto& t : v) {\n24      \
  \   t.join();\n25     }\n26     std::cout << \"Final counter value is \" << count\
  \ << '\\n';\n27 }\n```\n\n### 使用松弛语义的计数器\n\n最令人兴奋的三行是 13、24 和 26。\n\n在第 13 行中，使用松弛语义递增原子数字\
  \ `count`，因此我们保证了该操作是原子的。`fetch_add` 操作在 `count` 上建立了排序。`add` 函数（第 10-15 行）是线程的工作包。每个线程在第\
  \ 21 行获取其工作包。\n\n线程的创建是一个同步点——另一个是第 24 行的 `t.join()`。\n\n创建者线程在第 24 行与其所有子线程同步。它通过\
  \ `t.join()` 调用等待直到所有子线程完成。`t.join()` 是原子操作结果被发布的原因。更正式地说：`t.join()` 是一个释放操作（release\
  \ operation）。\n\n结论是，第 13 行的递增操作与第 26 行对计数器 `count` 的读取之间存在发生于（happens-before）的关系。\n\
  \n结果是程序始终返回 10000。无聊吗？不，这令人安心！\n\n![松弛语义的原子计数器](img/MemoryModel----relaxed.png)\n\
  \n使用松弛语义的原子计数器的典型例子是 `std::shared_ptr` 的引用计数器。松弛语义仅适用于递增操作。递增引用计数器的关键属性是该操作是原子的。递增操作的顺序并不重要。松弛语义不适用于引用计数的减少。这些操作的析构函数需要获取-释放（acquire-release）语义。\n\
  \n`std::atomic_thread_fence` 的基本思想是在不使用原子操作的情况下建立线程之间的同步和排序限制。\n\n## 屏障 (Fences)\n\
  \nC++ 支持两种类型的屏障：`std::atomic_thread_fence` 和 `std::atomic_signal_fence`。\n\n* `std::atomic_thread_fence`：同步线程之间的内存访问。\n\
  * `std::atomic_signal_fence`：在信号处理器与在同一线程上运行的代码之间进行同步。\n\n### std::atomic_thread_fence\n\
  \n`std::atomic_thread_fence` 防止特定操作跨越屏障。它们通常被称为屏障（fences）。如果使用非原子或具有松弛语义的操作，重排序的风险始终存在。\n\
  \n\n\n\n当然，与其编写 `std::atomic_thread_fence()`，你也可以显式地编写 `std::atomic_thread_fence(std::memory_order_seq_cst)`。顺序一致性\
  \ 默认应用于内存障（fences）。如果你对全屏内存障使用顺序一致性，则 `std::atomic_thread_fence` 将遵循全局顺序。\n\n##\
  \ 获取内存障 (Acquire fence)\n\n![Acquire fence](img/MemoryModel----AcquireFence.png)\n\
  \n获取内存障\n\n## 释放内存障 (Release fence)\n\n![Release fence](img/MemoryModel----ReleaseFence.png)\n\
  \n释放内存障\n\n这三种内存障可以用更简洁的方式描绘出来。\n\n## 内存障一览\n\n![All fences at a glance](img/MemoryModel----loadStore.png)\n\
  \n所有内存障一览\n\n获取内存障和释放内存障保证了与具有获取-释放语义的原子操作类似的同步和排序约束。\n\n### 获取-释放内存障\n\n获取和释放内存障与具有获取-释放语义的原子操作之间最明显的区别在于，内存障不需要原子变量。还有一种更细微的区别：获取内存障和释放内存障比对应的原子操作重量得多。\n\
  \n### 原子操作与内存障\n\n为了简单起见，当我使用内存障或具有获取语义的原子操作时，我统称其为获取操作。释放操作也是如此。\n\n获取操作和释放操作的核心思想是它们在线程之间建立了同步和排序约束。这些同步和排序约束也适用于松弛（relaxed）语义的原子操作或非原子操作。注意，获取和释放操作是成对出现的。此外，对具有获取-释放语义的原子变量的操作必须作用于同一个原子变量。尽管如此，我现在将孤立地观察这些操作。\n\
  \n让我们从获取操作开始。\n\n### 获取操作 (Acquire Operation)\n\n在内存排序被设置为 `std::memory_order_acquire`\
  \ 的原子变量上执行加载（读）操作就是获取操作。\n\n![Atomic operation with acquire semantic](img/MemoryModel----acquireOperation.png)\n\
  \n具有获取语义的原子操作\n\n内存排序设置为 `std::memory_order_acquire` 的 `std::atomic_thread_fence`\
  \ 对内存访问的重排序施加了更严格的约束：\n\n![Fence with acquire semantic](img/MemoryModel----AcquireFence.png)\n\
  \n具有获取语义的内存障\n\n这种比较强调了两点：\n\n1. 具有获取语义的内存障建立了更强的排序约束。虽然原子变量上的获取操作和内存障上的获取操作都要求任何读或写操作不能移动到获取操作之前，但获取内存障提供了额外的保证：没有任何读操作可以移动到获取内存障之后。\n\
  \n2. 松弛语义对于读取原子变量 `var` 是足够的。得益于 `std::atomicc_thread_fence(std::memory_order_acquire)`，该操作无法移动到获取内存障之后。\n\
  \n对于释放内存障，也可以得出类似的观察。\n\n### 释放操作 (Release Operation)\n\n在内存排序被设置为 `std::memory_order_release`\
  \ 的原子变量上执行存储（写）操作就是释放操作。\n\n![Atomic operation with release semantic](img/MemoryModel----releaseOperation.png)\n\
  \n具有释放语义的原子操作\n\n这是释放内存障对应的对应图像。\n\n![Fence with release semantic](img/MemoryModel----ReleaseFence.png)\n\
  \n具有释放语义的内存障\n\n除了释放操作对原子变量 `var` 施加的约束外，释放内存障还保证了两个属性：\n\n1. 存储操作不能移动到内存障之前。\n\n\
  2. 变量 `var` 使用松弛语义是足够的。\n\n然而，现在是时候进一步构建一个使用内存障的程序了。\n\n### 使用原子变量或内存障进行同步\n\n作为一个起点，我实现了一个典型的获取-释放语义的生产者-消费者流。最初，我使用原子操作，然后切换到内存障。\n\
  \n### 原子操作\n\n让我们从原子操作开始，因为我们大多数人对它们熟悉。\n\n```cpp\n 1 // acquireRelease.cpp\n 2\
  \ \n 3 #include <atomic>\n 4 #include <thread>\n 5 #include <iostream>\n 6 #include\
  \ <string>\n 7 \n 8 using namespace std;\n 9  \n10 atomic<string*> ptr;\n11 int\
  \ data;\n12 atomic<int> atoData;\n13  \n14 void producer(){\n15     string* p  =\
  \ new string(\"C++11\");\n16     data = 2011;\n17     atoData.store(2014, memory_order_relaxed);\n\
  18     ptr.store(p, memory_order_release);\n19 }\n20  \n21 void consumer(){\n22\
  \     string* p2;\n23     while (!(p2 = ptr.load(memory_order_acquire)));\n24  \
  \   cout << \"*p2: \" << *p2 << endl;\n25     cout << \"data: \" << data << endl;\n\
  26     cout << \"atoData: \" << atoData.load(memory_order_relaxed) << endl;\n27\
  \ }\n28  \n29 int main(){\n30     \n31     cout << endl;\n32     \n33     thread\
  \ t1(producer);\n34     thread t2(consumer);\n35     \n36     t1.join();\n37   \
  \  t2.join();\n38     \n39     cout << endl;\n40     \n41 }\n```\n\n使用原子操作的获取-释放排序\n\
