  \n## 使用自动连接的 `std::jthread`\n\n### 中断 `std::jthread`\n\n为了让你有一个大致的概念，让我展示一个简单的示例。\n\
  \n```cpp\n 1 // interruptJthread.cpp\n 2 \n 3 #include \"jthread.hpp\"\n 4 #include\
  \ <chrono>\n 5 #include <iostream>\n 6 \n 7 using namespace::std::literals;\n 8\
  \ \n 9 int main(){\n10     \n11     std::cout << std::endl;\n12     \n13     std::jthread\
  \ nonInterruptable([]{ \n14         int counter{0};\n15         while (counter <\
  \ 10){\n16             std::this_thread::sleep_for(0.2s);\n17             std::cerr\
  \ << \"nonInterruptable: \" << counter << std::endl; \n18             ++counter;\n\
  19         }\n20     });\n21     \n22     std::jthread interruptable([](std::stop_token\
  \ stoken){ \n23         int counter{0};\n24         while (counter < 10){\n25  \
  \           std::this_thread::sleep_for(0.2s);\n26             if (stoken.stop_requested())\
  \ return;\n27             std::cerr << \"interruptable: \" << counter << std::endl;\
  \ \n28             ++counter;\n29         }\n30     });\n31     \n32     std::this_thread::sleep_for(1s);\n\
  33     \n34     std::cerr << std::endl;\n35     std::cerr << \"Main thread interrupts\
  \ both jthreads\" << std::endl;\n36     nonInterruptable.request_stop();\n37   \
  \  interruptable.request_stop();\n38     \n39     std::cout << std::endl;\n40  \
  \   \n41 }\n```\n\n### 中断不可中断和可中断的 `std::jthread`\n\n我在主程序中启动了两个线程 `nonInterruptable`\
  \ 和 `interruptable`（第 13 和 22 行）。与线程 `nonInterruptable` 不同，线程 `interruptable` 获得了一个\
  \ `std::stop_token` 并在第 26 行使用它来检查是否被中断：`stoken.stop_requested()`。在发生中断的情况下，lambda\
  \ 函数会返回，因此线程结束。调用 `interruptable.request_stop()`（第 37 行）触发了线程的结束。这对于之前的调用 `nonInterruptable.request_stop()`\
  \ 不适用，后者没有效果。\n\n![中断不可中断和可中断的 std::jthread](img/cpp20_23----interruptJthread.png)\n\
