  \n* `std::for_each_n` 在 Haskell 中被称为 `map`。\n* `std::exclusive_scan` 和 `std::inclusive_scan`\
  \ 在 Haskell 中被称为 `scanl` 和 `scanl1`。\n* `std::transform_exclusive_scan` 和 `std::transform_inclusive_scan`\
  \ 是 Haskell 函数 `map` 与 `scanl`（或 `scanl1）的组合。\n* `std::reduce` 在 Haskell 中被称为 `foldl`\
  \ 或 `foldl1`。\n* `transform_reduce` 是 Haskell 函数 `map` 与 `foldl` 或 `foldl1` 的组合。\n\
  \n在向你们展示 Haskell 的实际运行之前，让我先对这些不同的函数做简单的介绍。\n\n* `map` 将函数应用于列表。\n* `foldl` 和 `foldl1`\
  \ 将二元操作应用于列表，并将列表归约为一个值。与 `foldl1` 相比，`foldl` 需要一个初始值。\n* `scanl` 和 `scanl1` 采用与\
  \ `foldl` 和 `foldl1` 相同的策略，但它们产生所有的中间结果，因此返回一个列表。\n* `foldl`、`foldl1`、`scanl` 和\
  \ `scanl1` 从左侧开始工作。\n\n让我们来看一下 Haskell 函数。这是 Haskell 的解释器 Shell。\n\n![New algorithms\
  \ in Haskell](img/ParallelSTL----newAlgorithmHaskell.png)\n\n## Haskell 中的新算法\n\n\
