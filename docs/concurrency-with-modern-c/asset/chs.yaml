  32 \n33 }\n```\n\n### 通过引用向线程传递参数\n\n问题是：`valSleeper` 在第 29 行的值是多少？`valSleeper`\
  \ 是一个全局变量。线程 `t` 获取的工作任务包是一个包含变量 `valSleeper` 和数字 5 的函数对象（第 27 行）。关键观察是，线程通过引用获取\
  \ `valSleeper`（第 9 行），并与主线程分离（第 28 行）。接下来，它执行函数对象的调用运算符（第 10-16 行）。在这一方法中，它从 0 计数到\
  \ 5，每次迭代睡眠 1/10 秒，并将 `i` 递增 `k`。最后，它在屏幕上显示自己的 ID。根据[Nach Adam Riese](https://de.wikipedia.org/wiki/Liste_gefl%C3%BCgelter_Worte/N#Nach_Adam_Riese)（一句德国谚语），结果应该是\
  \ 1000 + 6 * 5 = 1030。\n\n然而，发生了什么？情况非常糟糕。\n\n![带引用的未定义行为](img/Multithreading----Sleeper.png)\n\
  \n## 带引用的未定义行为\n\n程序有两个奇怪的属性。首先，`valSleeper` 是 1000，其次，没有显示 ID。\n\n程序至少有两个问题：\n\n\
  1. `valSleeper` 被所有线程共享。这是一个数据竞态，因为线程可能同时读写 `valSleeper`。\n2. 主线程的生命周期在子线程执行计算或将其\
  \ ID 写入 `std::cout` 之前结束了。\n\n这两个问题都是竞态条件，因为程序的结果取决于操作的交替。竞态条件是数据竞态的原因。\n\n修复数据竞态非常简单。`valSleeper`\
  \ 应该使用原子操作](#chap20.xhtml_chapterAtomics)或锁](#chap20.xhtml_chapterLocks)来保护。为了解决\
  \ `std::cout` 的问题，你必须 join 线程而不是 detach。以下是修改后的 `main` 函数：\n\n```cpp\nint main(){\n\
  \  std::cout << std::endl;\n  int valSleeper = 1000;\n  std::thread t(Sleeper(valSleeper),\
  \ 5);\n  t.join();\n  std::cout << \"valSleeper = \" << valSleeper << std::endl;\n\
  \  std::cout << std::endl;\n}\n```\n\n现在我们得到了预期的输出。\n\n![修复的未定义行为](img/Multithreading----threadJoin.png)\
  \ 修复的未定义行为\n\n[thread](https://en.cppreference.com/w/cpp/thread) 的接口\n\n[thread](https://en.cppreference.com/w/cpp/thread)\
  \ 的方法\n\n| \n\n这里是 `thread` 方法的实际用法。关于 `thread` 的更多细节，请参考 [cpp.com](https://en.cppreference.com/w/cpp/thread)。\n\
  \n| 方法 | 描述 |\n| :--- | :--- |\n| `join()` | 等待线程完成。 |\n| `detach()` | 让线程独立于创建者。\
  \ |\n| `joinable()` | 检查线程是否可以连接。 |\n| `get_id()` | 返回线程的标识。 |\n| `hardware_concurrency()`\
  \ | 返回支持的并发线程数。 |\n| `sleep_until(point)` | 让线程睡眠到某个时间点。 |\n| `sleep_for(duration)`\
  \ | 让线程睡眠一段持续时间。 |\n| `yield()` | 允许系统运行另一个线程。 |\n| `swap(other)` | 交换线程。 |\n\n\
