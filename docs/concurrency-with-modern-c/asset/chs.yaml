  \ }\n```\n```\n\n# 一个贪婪生成器函数\n\n当然，我正在通过 `getNumbers` 重造轮子，因为这项工作自 C++11 起就可以使用\
  \ [`std::iota`](http://en.cppreference.com/w/cpp/algorithm/iota) 来完成了。\n\n为了完整起见，这里是输出结果。\n\
  \n![生成器函数](img/cpp20_23----greedyGenerator.png)\n\n# 一个生成器函数\n\n关于这个程序有两个至关重要的观察。一方面，第\
  \ 8 行的向量 `numbers` 总是获取所有值。即使我只对包含 1000 个元素的向量中的前 5 个元素感兴趣，这一点依然成立。另一方面，将 `getNumbers`\
  \ 函数转换为惰性生成器（lazy generator）是非常容易。\n\n```\n 1 // lazyGenerator.cpp\n 2 \n 3 #include\
  \ <iostream>\n 4 #include <vector>\n 5 \n 6 generator<int> generatorForNumbers(int\
  \ begin, int inc = 1){\n 7   \n 8   for (int i = begin;; i += inc){\n 9     co_yield\
  \ i;\n10   }\n11   \n12 }\n13   \n14 int main(){\n15   \n16   std::cout << std::endl;\n\
  17   \n18   const auto numbers= generatorForNumbers(-10);\n19   \n20   for (int\
  \ i= 1; i <= 20; ++i) std::cout << numbers << \" \";\n22   \n23   std::cout << \"\
  \\n\\n\";\n24   \n25   for (auto n: generatorForNumbers(0, 5)) std::cout << n <<\
  \ \" \";\n26   \n27   std::cout << \"\\n\\n\";\n28   \n29 }\n```\n\n# 一个惰性生成器函数\n\
  \n虽然 `greedyGenerator.cpp` 文件中的 `getNumbers` 函数返回一个 `std::vector<int>`，但 `lazyGenerator.cpp`\
  \ 中的协程 `generatorForNumbers` 返回一个生成器。第 18 行的生成器 `numbers` 或第 24 行的 `generatorForNumbers(0,\
  \ 5)` 会根据请求返回一个新数字。基于范围的 for 循环触发了查询。更准确地说，协程的查询通过 `co_yield i` 返回值 `i` 并立即挂起其执行。如果请求了新值，协程将恰好在该处恢复执行。\n\
  \n第 24 行的表达式 `generatorForNumbers(0, 5)` 是生成器的即时用法。\n\n我想明确地强调一点。协程 `generatorForNumbers`\
  \ 创建了一个无限数据流，因为第 8 行的 for 循环没有结束条件。如果我请求有限数量的值（如第 20 行所示），这是没。但这对于第 24 行并不成立，因为没有结束条件。因此，该表达式将*永远运行*。\n\
  \n由于协程对 C++ 来说是一个新概念，我想提供关于它们的更多细节。\n\n## 细节\n\n### 典型用例\n\n协程是编写[事件驱动应用程序](https://en.wikipedia.org/wiki/Event-driven_programming)\
  \ 的常用方式。事件驱动应用程序可以是模拟、游戏、服务器、用户界面甚至是算法。协程通常用于[协作式多任务](https://de.wikipedia.org/wiki/Multitasking)。协作式多任务的关键在于每个任务根据需要花费相应的时间。协作式多任务与抢占式多任务形成对比，后者我们有一个调度器来决定每个任务获得\
  \ CPU 的时长。\n\n有不同类型的协程。\n\n### 底层概念\n\nC++20 中的协程是非对称的（asymmetric）、一类的（first-class）且无栈的（stackless）。\n\
  \n**非对称**协程的工作流会返回调用者。这对于对称协程并不成立。对称协程可以将工作流委托给另一个协程。\n\n**一类**协程类似于“一类函数”，因为协程的行为像数据。行为像数据意味着你可以将它们作为函数的参数或返回值，或者将它们存储在变量中。\n\
  \n**无栈**协程使其能够挂起和恢复顶层协程。协程的执行和从协程的产出（yielding）会返回调用者。\n\n### 设计目标\n\nC++20 中的协程是非对称的、一类的且无栈的。\n\
  \n**非对称**协程的工作流会返回调用者。这对于对称协程并不成立。对称协程可以将工作流委托给另一个协程。\n\n**一类**协程类似于“一类函数”，因为协程的行为像数据。行为像数据意味着你可以将它们作为函数的参数或返回值，或者将它们存储在变量中。\n\
  \n**无栈**协程使其能够挂起和恢复顶层协程。协程的执行和从协程的产出（yielding）会返回调用者。\n\n（注：由于原文中存在大量重复的段落，根据指令“不要重复输出原文”，此处已仅翻译核心内容，未罗列原文中完全重复的文本块。）\n\
  \n\n\n该服务器非常简单，因为它在同一个线程中按顺序处理每个请求。服务器监听端口 443（第 1 行），接受其连接（第 3 行），从客户端读取入站数据（第\
  \ 4 行），并将答案写入客户端（第 6 行）。第 3、4 和 6 行中的所有调用都是阻塞的。\n\n得益于 `co_await`，这些阻塞调用现在可以挂起和恢复。\n\
  \n```\n1 Acceptor acceptor{443};\n2 while (true){\n3     Socket socket= co_await\
  \ acceptor.accept();           \n4     auto request= co_await socket.read();   \
  \           \n5     auto response= handleRequest(request);     \n6     co_await\
  \ socket.write(response);                 \n7 } \n```\n\n# 等待服务器\n\n## 框架\n\n编写协程的框架由\
  \ 20 多个函数组成，你只需要实现部分，部分可以覆盖。因此，你可以根据需求定制协程。\n\n协程由三部分组成：承诺对象（promise object）、协程句柄（coroutine\
  \ handle）和协程帧（coroutine frame）。\n\n- **承诺对象**：承诺对象在协程内部进行操作，并通过承诺对象交付其结果。\n- **协程句柄**：协程句柄是一个非所有权的句柄，用于从外部恢复或销毁协程帧。\n\
  - **协程帧**：协程帧是一个内部的、通常在堆上分配的状态。它包含了上述的承诺对象、协程的拷贝参数、挂起点的表示、生命周期在当前挂起点之前结束的局部变量，以及生命周期超过当前挂起点的局部变量。\n\
  \n为了优化协程的分配，需要满足两个条件：\n\n1. 协程的生命周期必须嵌套在调用者的生命周期内部。\n2. 协程的调用者知道协程帧的大小。\n\n### 简化工作流\n\
  \n当你在函数中使用 `co_yield`、`co_await` 或 `co_return` 时，该函数就了一个协程，编译器将其体转换为等价于以下行的内容。\n\
  \n```\n 1 {\n 2   Promise promise;\n 3   co_await promise.initial_suspend();\n 4\
  \   try\n 5\n 6     <function body>\n 7   }\n 8   catch (...)\n 9   {\n10     promise.unhandled_exception();\n\
  11   }\n12 FinalSuspend:\n13   co_await promise.final_suspend();\n14 }\n```\n\n\
  ### 协程的体\n\n协程的简化工作流由以下阶段组成。\n\n- **协程开始执行**\n    - 如果必要，分配协程帧\n    - 将所有函数参数拷贝到协程帧\n\
  \    - 创建承诺对象 `promise`\n    - 调用 `promise.get_return_object()` 创建协程句柄并将其保存在局部变量中。调用的结果将在协程首次挂起时返回给调用者。\n\
  \    - 调用 `promise.initial_suspend()` 并 `co_await` 其结果。承诺类型通常对于积极启动的协程返回 `suspend_never`，或对于懒性启动的协程返回\
  \ `suspend_always`。\n    - 当 `co_await promise.initial_suspend()` 恢复时，执行协程体。\n\n\
  - **协程到达挂起点**\n    - 将返回对象（`promise.get_return_object()`）返回给恢复该协程的调用者。\n\n- **协程到达\
  \ `co_return`**\n    - 对于 `co_return` 或 `co_return expression`（其中 `expression` 类型为\
  \ `void`），调用 `promise.return_void()`\n    - 对于 `co_return expression`（其中 `expression`\
  \ 为非 `void` 类型），调用 `promise.return_value(expression)`\n    - 销毁所有在栈上创建的变量\n    -\
  \ 调用 `promise.final_suspend()` 并 `co_await` 其结果。\n\n- **协程被销毁（通过 `co_return`、未捕获的异常或协程句柄）**\n\
  \    - 销毁承诺对象\n    - 调用函数参数的析构函数\n    - 释放协程帧使用的内存\n    - 将控制权交回调用者\n\n当协程因未捕获的异常结束时，会发生：：\n\
  \n- 在 `catch` 块中捕获异常并调用 `promise.unhandled_exception()`\n- 调用 `promise.final_suspend()`\
  \ 并 `co_await` 其结果。\n\n让我们将这一理论付诸实践。\n\n### 使用 `co_yield` 的无限数据流\n\n以下程序产生一个无限数据流。协程\
  \ `getNext` 使用 `co_yield` 创建从 `start` 开始的数据流，并在请求时提供按 `step` 增的下一个值。\n\n```cpp\n\
  1 // infiniteDataStream.cpp\n2 \n3 #include <experimental/coroutine>\n4 #include\
  \ <memory>\n5 #include <iostream>\n6 \n7 template<typename T>\n8 struct Generator\
  \ {\n9     \n10     struct promise_type;\n11     using handle_type = std::experimental::coroutine_handle<promise_type>;\n\
  12     \n13     Generator(handle_type h): coro(h) {}                         //\
  \ (3)\n14     handle_type coro;\n15     std::shared_ptr<T> value;\n```\n\n\n\n\n\
  2. 调用 `promise.get_return_object()`并将结果存储在本地变量中。\n\n3. 创建生成器。\n\n4. 调用 `promise.initial_suspend()`。生成器是懒加载的，因此始终会挂起。\n\
  \n5. 请求下一个值，如果生成器已被消费，则返回。\n\n6. 由 `co_yield` 调用触发。随后下一个值变得可用。\n\n7. 获取下一个值。\n\n\
  在后续的迭代中，仅执行步骤 5 和 6。\n\n### 使用 `co_await` 进行线程同步\n\n线程同步是一个典型的用例。一个线程准备工作包，另一个线程在进行等待。可以使用条件变量、承诺和未来以及原子布尔值来创建“发送者/接收者”工作流。得益于协程，线程同步变得非常简单，且没有了条件变量固有的风险，如虚假唤醒和丢失唤醒。\n\
  \n```cpp\n 1 // senderReceiver.cpp\n  2 \n  3 #include <experimental/coroutine>\n\
  \  4 #include <chrono>\n  5 #include <iostream>\n  6 #include <functional>\n  7\
  \ #include <string>\n  8 #include <stdexcept>\n  9 #include <atomic>\n 10 #include\
  \ <thread>\n 11 \n 12 class Event\n 13 {\n 14 public:\n 15 \n  16   Event() = default;\n\
  \  17 \n  18   Event(const Event&) = delete;\n  19   Event(Event&&) = delete;\n\
  \  20   Event& operator=(const Event&) = delete;\n  21   Event& operator=(Event&&)\
  \ = delete;\n  22 \n  23   class Awaiter;\n  24   Awaiter operator co_await() const\
  \ ;\n  25 \n  26   void notify() ;\n  27 \n  28 private:\n  29 \n  30   friend class\
  \ Awaiter;\n  31   \n  32   mutable std::atomic<void*> suspendedWaiter{nullptr};\n\
  \  33   mutable std::atomic<bool> notified{false};\n  34 \n  35 };\n 36 \n 37 class\
  \ Event::Awaiter\n 38 {\n 39 public:\n 40   Awaiter(const Event& eve): event(eve){}\n\
  \  41 \n  42   bool await_ready() const ;\n  43   bool await_suspend(std::experimental::coroutine_handle<>\
  \ corHandle) ;\n  44   void await_resume() {}\n  45 \n 46 private:\n 47   friend\
  \ class Event;\n 48 \n  49   const Event& event;\n 50   std::experimental::coroutine_handle<>\
  \ coroutineHandle;\n 51 };\n 53 \n 54 bool Event::Awaiter::await_ready() const {\n\
  \ 55   \n 56   // allow at most one waiter\n 57   if (event.suspendedWaiter.load()\
  \ != nullptr){\n 58     throw std::runtime_error(\"More than one waiter is not valid\"\
  );\n 59   }\n 60   \n 61   // evaluated.notified == false; suspends the coroutine\n\
  \ 62   // evaluated.notified == true; the coroutine is executed such as a usual\
  \ function\n 63   return event.notified;\n 64 }\n 65 \n 66 bool Event::Awaiter::await_suspend(std::experimental::coroutine_handle<>\
  \ corHandle) {\n 67   \n 68   coroutineHandle = corHandle;\n 69   \n 70   if (event.notified)\
  \ return false;\n 72   \n 73   // store the waiter for later notification\n 74 \
  \  event.suspendedWaiter.store(this);\n 75   \n 76   return true;\n 77 }\n 78 \n\
  \ 79 void Event::notify()  {\n 80   notified = true;\n 81   \n 82   // try to load\
  \ the waiter\n 83   auto* waiter = static_cast<Awaiter*>(suspendedWaiter.load());\n\
  \ 84   \n 85   // check if a waiter is available\n 86   if (waiter != nullptr) {\n\
  \ 87       // resume the coroutine => await_resume\n 88       waiter->coroutineHandle.resume();\n\
  \ 89   }\n 90 }\n 91 \n 92 Event::Awaiter Event::operator co_await() const \n 93\
  \ {\n 94   return Awaiter{ *this };\n 95 }\n 96 \n 97 struct Task{\n 98   struct\
  \ promise_type{\n 99     Task get_return_object() { return {}; }\n1100    std::experimental::suspend_never\
  \ initial_suspend() { return {}; }\n 101    std::experimental::suspend_never final_suspend()\
  \ { return {}; }\n 102    void unhandled_exception() {}\n 103    void return_void()\
  \ {}\n 104  };\n 105 };\n 106 \n 107 Task receiver(Event& event){\n 108   auto start\
  \ = std::chrono::steady_clock::now();\n 109   co_await event;\n 110   auto end =\
  \ std::chrono::steady_clock::now();\n 111   std::chrono::duration<double> elapsed\
  \ = end - start;\n 112   std::cout << \"Waited \" << elapsed.count() << \" seconds.\"\
  \ << std::endl;\n 113 }\n 114 \n 115 int main(){\n 116   using namespace std::chrono_literals;\n\
  \ 117   Event event{};\n 118   std::thread senderThread1([&event]{\n 119     std::this_thread::sleep_for(2s);\n\
  \ 120     event.notify();\n 121   });\n 122   std::thread senderThread2([&event]{\n\
  \ 123     std::cout << \"Notification before waiting\" << std::endl;\n 124     co_await\
  \ event;\n 125     std::cout << \"Got the notification!\" << std::endl;\n 126  \
  \ });\n 127   \n 128   senderThread1.join();\n 129   senderThread2.join();\n 130\
  \ }\n```\n\n\n\n让我们先来看 `event1` 和第一个工作流。`event1` 在 `receiverThread1` 启动之前就发送了它的通知。调用\
  \ `event1`（第 122 行）触发了 `notify` 方法（第 77 到 88 行）。首先设置了通知标记，然后调用 `auto* waiter = static_cast<Awaiter*>(suspendedWaiter.load());`\
  \ 加载了潜在的 `waiter`。在这种情况下，`waiter` 是 `nullptr`，因为它之前没有被设置。这意味着第 86 行对 `waiter` 后续的\
  \ `resume` 调用没有被执行。随后执行的函数 `await_ready`（第 53 - 63 行）首先检查是否有多个一个 `waiter`。在这种情况下，我抛出了一个\
  \ `std::runtime` 异常。该方法的关键部分是返回值。`event.notification` 已经在 `notify` 方法中被设置为 `true`。在这种情况下，`true`\
  \ 协程没有被挂起，而是像普通函数一样执行。\n\n在第二个工作流中，`co_await event2` 调用发生在 `event2` 发送其通知之前。`co_wait\
  \ event2` 触发了调用 `await_ready`（第 53 行）。与第一个工作流的主要区别是现在 `event.notified` 为 `false`。这个\
  \ `false` 值导致协程挂起。技术上，执行了方法 `await_suspend`（第 65 - 75 行）。`await_suspend` 获取协程句柄\
  \ `corHandle` 并将其存储在变量 `coroutineHandle` 中以便以后调用（第 67 行）。当然，以后调用意味着恢复。其次，`waiter`\
  \ 被存储在变量 `suspendedWaiter` 中。当随后 `event2.notify` 触发其通知时，执行 `notify` 方法（第 77 行）。与第一个工作流的区别是条件\
  \ `waiter != nullptr` 为 `true`。结果是 `waiter` 使用 `coroutineHandle` 恢复协程。\n\n# 案例研究\n\
  \n在提供了关于内存模型 和多线程接口 的理论后，我现在将这些理论应用于实践，并为你提供一些性能数据。\n\n你应该对这些性能数据持保留态度。我不关心 Linux\
  \ 和 Windows 上算法每种变体的精确数字。我更感兴趣的是直观地感受哪些算法可能有效，哪些算法可能无效。我并不是在比较我的 Linux 桌面电脑和 Windows\
  \ 笔记本电脑的绝对数字，而是我想知道某些算法是否在 Linux 或 Windows 上运行得更好。\n\n### 计算向量之和\n\n相 `std::vector`\
  \ 元素的最快方法是什么？为了得到答案，我用 `std::vector` 填充了一的一亿个在 1 到 10 之间的任意但[均匀分布](https://en.wikipedia.org/wiki/Uniform_distribution_(continuous))\
  \ 的数字。任务是用各种方法计算这些数字的和。我使用单线程相加的性能作为参考执行时间。我将讨论原子操作、锁、线程本地数据 和任务。\n\n让我们从单线程场景开始。\n\
  \n### 向量的单线程相加\n\n直接的策略是在基于范围的 for 循环中相加。\n\n### 基于范围的 for 循环\n\n求和发生在第 27 行。\n\n\
  ```cpp\n 1 // calculateWithLoop.cpp\n 2 \n 3 #include <chrono>\n 4 #include <iostream>\n\
  \ 5 #include <random>\n 6 #include <vector>\n 7 \n 8 constexpr long long size =\
  \ 100000000;\n 9 \n10 int main(){\n11 \n12   std::cout << std::endl;\n13 \n14  \
  \ std::vector<int> randValues;\n15   randValues.reserve(size);\n16 \n17   // random\
  \ values\n18   std::random_device seed;\n19   std::mt19937 engine(seed());\n20 \
  \  std::uniform_int_distribution<> uniformDist(1, 10);\n21   for (long long i =\
  \ 0 ; i < size ; ++i) \n22        randValues.push_back(uniformDist(engine));\n23\n\
  24   const auto sta = std::chrono::steady_clock::now();\n25 \n26   unsigned long\
  \ long sum = {};\n27   for (auto n: randValues) sum += n;\n28 \n29   const std::chrono::duration<double>\
  \ dur = \n30         std::chrono::steady_clock::now() - sta;\n31         \n32  \
  \ std::cout << \"Time for addition \" << dur.count() \n33             << \" seconds\"\
  \ << std::endl;\n34   std::cout << \"Result: \" << sum << std::endl;\n35 \n36  \
  \ std::cout << std::endl;\n37 \n38 }\n```\n\n在基于范围的 for 循环中对向量求\n\n我的电脑有多快？\n\n\
  ![Linux 上的显式求和](img/CaseStudies----CalculateWithLoop)\n\nLinux 上的显式求和\n\n![Windows\
  \ 上的显式求和](img/CaseStudies----CalculateWithLoop)\n\nWindows 上的显式求和\n\n你不应该显式使用循环。大多数情况下你可以使用标准库中的算法。\n\
  \n### 使用 `std::accumulate` 求和\n\n`std::accumulate` 是计算向量和的正确方法。为了简单起见，我展示了 `std::accumulate`\
  \ 的应用。整个源代码可以在资源中找到。\n\n```cpp\n// calculateWithStd.cpp\n\n...\n\nconst unsigned\
  \ long long sum = std::accumulate(randValues.begin(),\n                        \
  \                       randValues.end(), 0);\n\n...\n```\n\n使用 `std::accumulate`\
  \ 对向量求\n\n在 Linux 上，`std::accumulate` 的性能与基于范围的 for 循环相当。然而，在 Windows 上使用 `std::accumulate`\
  \ 有巨大的差异，性能好得多。\n\n![使用 std::accumulate 求和](img/CaseStudies----CalculateWithStd)\n\
  \nLinux 上的 std::accumulate 求和\n\n![使用 std::accumulate 求和](img/CaseStudies----CalculateWithStd)\n\
  \nWindows 上的 std::accumulate 求和\n\n现在我们有了参考的计时数据。让我运行两个额外的单线程场景。一个使用锁，另一个使用原子操作。为什么？我们得到了性能数据，说明在没有竞争的情况下，锁或原子操作的开销有多大。\n\
  \n### 使用锁保护\n\n如果我用锁保护求和访问，我得到了两个问题的答案：\n\n1. 在没有竞争的情况下，同步开销有多大？\n2. 在理想情况下，锁有多快？\n\
  \n我只展示了 `std::lock_guard` 的应用。整个源代码是资源的一部分。\n\n```cpp\n// calculateWithLock.cpp\n\
  \n...\n\nstd::mutex myMutex;\n\nfor (auto i: randValues){\n  std::lock_guard<std::mutex>\
  \ myLockGuard(myMutex);\n  sum += i;\n}\n\n...\n```\n\n使用锁对向量求和\n\n执行时间正如预期：对受保护变量\
  \ `sum` 的访问变慢了。\n\n![单线程锁求和](img/CaseStudies----CalculateWithLock)\n\nLinux 上的单线程锁求和\n\
  \n![单线程锁求和](img/CaseStudies----CalculateWithLock)\n\nWindows 上的单线程锁求和\n\n没有竞争的情况下，使用\
  \ `std::lock_guard` 比使用 `std::accumulate` 慢了 50 到 150 倍。\n\n### 使用原子操作保护\n\n相应地，对于原子操作，我有与锁相同的问题。\n\
  \n1. 原子操作的同步开销有多大？\n2. 在没有竞争的情况下，原子操作可以有多快？\n\n我还有一个额外的问题；原子操作与锁相比的性能差异是多少？\n\n\n\
  \n\n```cpp\n 1 // calculateWithAtomic.cpp\n 2 \n 3 #include <atomic>\n 4 #include\
  \ <chrono>\n 5 #include <iostream>\n 6 #include <numeric>\n 7 #include <random>\n\
  \ 8 #include <vector>\n 9 \n10 constexpr long long size = 100000000;\n 11 \n12 int\
  \ main(){\n13 \n14   std::cout << std::endl;\n15 \n16   std::vector<int> randValues;\n\
  17   randValues.reserve(size);\n18 \n19   // random values\n20   std::random_device\
  \ seed;\n21   std::mt19937 engine(seed());\n22   std::uniform_int_distribution<>\
  \ uniformDist(1, 10);\n23   for (long long i = 0 ; i < size ; ++i) \n24       randValues.push_back(uniformDist(engine));\n\
  25   \n26   std::atomic<unsigned long long> sum = {};\n27   std::cout << std::boolalpha\
  \ << \"sum.is_lock_free(): \" \n28             << sum.is_lock_free() << std::endl;\n\
  29   std::cout << std::endl;\n30  \n31   auto sta = std::chrono::steady_clock::now();\n\
  32 \n33   for (auto i: randValues) sum += i;\n34  \n35   std::chrono::duration<double>\
  \ dur = std::chrono::steady_clock::now() - sta;\n36   \n37   \n38   std::cout <<\
  \ \"Time for addition \" << dur.count() \n39             << \" seconds\" << std::endl;\n\
  40   std::cout << \"Result: \" << sum << std::endl;\n41     \n42   std::cout <<\
  \ std::endl;\n43   \n44   sum = 0;\n45   sta = std::chrono::steady_clock::now();\n\
  46   \n47   for (auto i: randValues) sum.fetch_add(i);\n48   \n49   dur = std::chrono::steady_clock::now()\
  \ - sta;\n50   std::cout << \"Time for addition \" << dur.count() \n51         \
  \    << \" seconds\" << std::endl;\n52   std::cout << \"Result: \" << sum << std::endl;\n\
  53     \n54   std::cout << std::endl;\n55 \n56 }\n```\n\n# 使用原子变量作为求和变量对向量求和\n\n\
  首先，我在第 28 行检查了原子变量 `sum` 是否带有锁。这至关重要，因为否则使用锁和原子操作将没有区别。在我所知的所有主流平台上，原子操作都是无锁的。其次，我用两种方式计算了求和。我在第\
  \ 33 行使用了 `+= 运算符`，在第 45 行使用了 `fetch_add` 方法。在单线程情况下，这两种变体的性能相当；但是，对于 `fetch_add`，我可以显式地指定内存顺序。关于这一点，将在下一个小节中详细介绍。\n\
