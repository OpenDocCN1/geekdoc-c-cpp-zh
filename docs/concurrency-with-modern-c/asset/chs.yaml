  \n### 指令序列\n\n我已经为每条指令序列分配了对应的图。\n\n![指令序列](img/CaseStudies----atomicInterleavingEng.png)\n\
  \n指令序列\n\n让我从比较直观的情况开始。\n\n*   **(1)**：将图 (1) 分配给序列 (1) 相当简单。在序列 (1) 中，`x` 和 `y`\
  \ 的值为 0，因为 `y.load()` 和 `x.load()` 在操作 `x.store(2000)` 和 `y.store(11)` 之前执行了。\n\
  *   **(6)**：执行 (6) 的推理原理类似。`y` 的值为 11，`x` 的值为 2000，因为所有的加载操作发生在所有的存储操作之后。\n*   **(2),\
  \ (3), (4), (5)**：现在来看更有趣的情况，即 `y` 的值为 `0`，而 `x` 的值为 `2000`。图中的黄色箭头 (sc) 是我推理的关键，因为它们代表指令序列。例如，让我们看看执行\
  \ (2)。\n    *   **(2)**：图 (2) 中黄色箭头 (sc) 的序列是：写入 `x = 2000` ⇒ 读取 `y = 0` ⇒ 写入 `y\
  \ = 11` ⇒ 读取 `x = 2000`。这个序列对应于第二次线程交织 (2) 的指令序列。\n\n让我们用 acquire-release 语义来打破顺序一致性。\n\
  \n#### CppMem: 带有 Acquire-Release 语义的原子操作\n\nacquire-release 语义 中的同步发生在同一个原子变量的操作之间。这种针对同一个原子变量操作的同步，与顺序一致性中线程之间的同步形成对比。由于这一事实，acquire-release\
  \ 语义更轻量，因此速度更快。\n\n以下是带有 acquire-release 语义的程序。\n\n```cpp\n 1 ongoingAcquireRelease.cpp\n\
  \ 2 #include <atomic>\n 3 #include <iostream>\n 4 #include <thread>\n 5 \n 6 std::atomic<int>\
  \ x{0};\n 7 std::atomic<int> y{0};\n 8 \n 9 void writing(){\n10   x.store(2000,\
  \ memory_order_relaxed);\n11   y.store(11, memory_order_release);\n12 }\n 13 \n\
  14 void reading(){\n15   std::cout << y.load(memory_order_acquire) << \" \";\n16\
  \   std::cout << x.load(memory_order_relaxed) << std::endl;\n17 }\n 18 \n19 int\
  \ main(){\n20   std::thread t1(writing);\n21   std::thread t2(reading);\n22   t1.join();\n\
  23   t2.join();\n24 };\n```\n\n\n\n\n我仅参考三个执行情况一致的图。这些图显示了 `y` 的 store-release 操作与\
  \ `y` 的 load-acquire 操作之间存在 acquire-release 语义。无论 `y` 的读取操作 `(rf)` 发生在主线程还是独立线程都没有区别。图表使用带有\
  \ `sw` 注角的箭头显示了 `synchronizes-with`（同步）关系。\n\n### (y = 0, x = 0) 的执行\n\n![Execution\
  \ for (y = 0, x = 0)](img/CaseStudies----first_ar.png)\n\n(y = 0, x = 0) 的执行\n\n\
  ### (y = 0, x = 2000) 的执行\n\n![Execution for (y = 0, x = 2000)](img/CaseStudies----second_ar.png)\n\
  \n(y = 0, x = 2000) 的执行\n\n### (y = 11, x = 2000) 的执行\n\n![Execution for (y = 11,\
  \ x = 2000)](img/CaseStudies----third_ar.png)\n\n(y = 11, x = 2000) 的执行\n\n`x` 不一定是原子性的。这是我第一个且错误的假设。看原因所在。\n\
  \n#### CppMem：原子与非原子操作\n\n在应用 acquire-release 语义时，一个典型的误解是假设 acquire 操作在等待 release\
  \ 操作。基于这一错误假设，你可能认为 `x` 不一定非得是原子变量，我们可以进一步优化程序。\n\n```cpp\n 1 // ongoingOptimisationAcquireReleaseBroken.cpp\n\
  \ 2 \n3 #include <atomic>\n 4 #include <iostream>\n 5 #include <thread>\n 6 \n7\
  \ int x = 0;\n 8 std::atomic<int> y{0};\n 9\n10 void writing(){  \n11   x = 2000;\
  \  \n12   y.store(11, std::memory_order_release);\n13 }\n14 \n15 void reading(){\
  \  \n16   std::cout << y.load(std::memory_order_acquire) << \" \";  \n17   std::cout\
  \ << x << std::endl;\n18 }\n19 \n20 int main(){\n21   std::thread thread1(writing);\n\
  22   std::thread thread2(reading);\n23   thread1.join();\n24   thread2.join();\n\
  25 };\n```\n\n带有原子与非原子操作的持续优化\n\n程序在 `x` 上存在数据竞态，因此存在未定义行为。acquire-release 语义保证了，如果\
  \ `y.store(11, std::memory_order_release)` (第 12 行) 在 `y.load(std::memory_order_acquire)`\
  \ (第 16 行)之前执行，那么 `x = 2000` (第 11 行)就会在读取 `x` (第 17 行)之前执行。否则，`x` 的读取将与 `x` 的写入同时执行。因此我们对共享变量进行了并发访问，且其中一个是写操作。根据定义，这就是数据竞态。\n\
  \n为了让我的观点更清晰，让我使用 CppMem。\n\n## CppMem\n\n```cpp\n 1 int main(){\n 2   int x = 0;\n\
  \ 3   atomic_int y = 0;\n 4   {{{ { \n 5       x = 2000;\n 6       y.store(11, memory_order_release);\n\
  \ 7       }\n 8   ||| {\n 9       y.load(memory_order_acquire);\n10       x;\n11\
  \       }\n12   }}}\n13 }\n```\n\nCppMem：原子与非原子操作\n\n数据竞态发生在一个线程正在写入 `x = 2000`\
  \ 而另一个线程正在读取 `x` 时。我们在对应的黄色箭头上得到了 `dr` 符号（data race）。\n\n![A data race](img/CaseStudies----raceAcquireRelease.png)\n\
  \n数据竞态\n\n持续优化过程最后一步仍然缺失：relaxed（松）语义。\n\n#### CppMem：带有松语义的原子操作\n\n使用 relaxed 语义，我们对原子操作没有同步和排序限制，仅保证操作的原子性。\n\
  \n```cpp\n 1 // ongoingOptimisationRelaxedSemantic.cpp\n 2 \n3 #include <atomic>\n\
  \ 4 #include <iostream>\n 5 #include <thread>\n 6 \n7 std::atomic<int> x{0};\n 8\
  \ std::atomic<int> y{0};\n 9\n10 void writing(){  \n11   x.store(2000, std::memory_order_relaxed);\
  \  \n12   y.store(11, std::memory_order_relaxed);\n13 }\n14 \n15 void reading(){\
  \  \n16   std::cout << y.load(std::memory_order_relaxed) << \" \";  \n17   std::cout\
  \ << x.load(std::memory_order_relaxed) << std::endl;\n18 }\n19 \n20 int main(){\n\
  21   std::thread thread1(writing);\n22   std::thread thread2(reading);\n23   thread1.join();\n\
  24   thread2.join();\n25 };\n```\n\n带有原子与非原子操作的持续优化\n\n程序在 `x` 上存在数据竞态，因此存在未定义行为。acquire-release\
  \ 语义保证了如果 `y.store(11, std::memory_order_release)` (第 12 行) 在 `y.load(std::memory_order_acquire)`\
  \ (第 16 行)之前执行，那么 `x = 2000` (第 11 行)就会在读取 `x` (第 17 行)之前执行。否则，`x` 的读取将与 `x` 的写入同时执行。因此我们对共享变量进行了并发访问，且其中一个是写操作。根据定义，这就是数据竞态。\n\
  \n为了让我的观点更清晰，让我使用 CppMem。\n\n```cpp\n 1 int main(){\n 2   int x = 0;\n 3   atomic_int\
  \ y = 0;\n 4   {{{ { \n 5       x = 2000;\n 6       y.store(11, memory_order_release);\n\
  \ 7       }\n 8   ||| {\n 9       y.load(memory_order_acquire);\n10       x;\n11\
  \       }\n12   }}}\n13 }\n```\n\nCppMem：原子与非原子操作\n\n数据竞态发生在一个线程正在写入 `x = 2000`\
  \ 而另一个线程正在读取 `x` 时。我们在对应的黄色箭头上得到了 `dr` 符号（data race）。\n\n![A data race](img/CaseStudies----raceAcquireRelease.png)\n\
  \n数据竞态\n\n持续优化过程最后一步仍然缺失：relaxed（松）语义。\n\n#### CppMem：带有松语义的原子操作\n\n使用 relaxed 语义，我们对原子操作没有同步和排序限制，仅保证操作的原子性。\n\
  \n```cpp\n 1 // ongoingOptimisationRelaxedSemantic.cpp\n 2 \n3 #include <atomic>\n\
  \ 4 #include <iostream>\n 5 #include <thread>\n 6 \n7 std::atomic<int> x{0};\n 8\
  \ std::atomic<int> y{0};\n 9\n10 void writing(){  \n11   x.store(2000, std::memory_order_relaxed);\
  \  \n12   y.store(11, std::memory_order_relaxed);\n13 }\n14 \n15 void reading(){\
  \  \n16   std::cout << y.load(std::memory_order_relaxed) << \" \";  \n17   std::cout\
  \ << x.load(std::memory_order_relaxed) << std::endl;\n18 }\n19 \n20 int main(){\n\
  21   std::thread thread1(writing);\n22   std::thread thread2(reading);\n23   thread1.join();\n\
  24   thread2.join();\n25 };\n```\n\n## Future：C++\n\n本章的目标非常简单：让你了解 C++ 将来的并发特性。\n\
  \n### 执行器 (Executors)\n\n执行器是 C++ 执行的基础构建块，扮演着与容器分配器类似的角色。诸如 `async`标准模板库并行算法 future\
  \ 的延续、任务块，或者 `post`、`dispatch` 或 `defer` 调用（[Networking TS](https://en.cppreference.com/w/cpp/experimental/networking）。此外，目前没有标准化的执行方法。以下是\
  \ [P0761 提案](http://www.open-std.org/jtc1/wg21/docs/2018/p0761r.pdf) 的示例。\n\n```cpp\n\
  void parallel_for(int facility, int n, function<void(int)> f) {\n  if(facility ==\
  \ OPENMP) {\n    #pragma omp parallel for\n    for(int i = 0; i < n; ++i) {\n  \
  \    f(i);\n    }\n  }\nelse if(facility == GPU) {\n  parallel_for_kernel<<<n>>>(f);\n\
  }\nelse if(facility == THREAD_POOL) {\n  thread_pool.submit(n, f);\n  }\n}\n```\n\
  \n各种 parallel_for 实现\n\n此 `parallel_for` 函数存在一些问题。\n\n\n\n\n*   像 `parallel_for`\
  \ 这样简单的函数维护起来完全是`复杂的`。如果需要支持新的算法或新的并行范式，复杂性会变得越来越糟糕。\n*   函数的每个分支都有不同的`synchronisation`（同步）属性。[OpenMP](https://en.wikipedia.org/wiki/OpenMP)\
  \ 可能会阻塞直到所有派生的线程完成，GPU 运行通常是异步的，而线程池可能会阻塞也可能不。同步不足可能导致数据竞态或死锁。在最好的情况下，你只会得到竞态条件。\n\
  *   `parallel_for` 循环太**`restrictive`（限制性）**。例如，没有办法在函数中使用你的线程池代替全局线程池：`global_thread_pool_variable.submit(n,\
  \ f);`。\n\n## 漫长的道路\n\n在 2018 年 10 月，已有许多关于执行器（executors）的提案被编写，且许多设计决策仍处于开放状态。预期是它们将成为\
  \ C++23 的一部分。单向执行甚至可能在 C++20 中标准化。本章主要基于针对执行器设计的提案 [P0761](http://www.open-std.org/jtc1/sc22/wg21/docs/papers/2018/p0761r2.pdf)，以及它们在\
  \ [P0443](http://open-std.org/JTC1/SC22/WG21/docs/papers/2018/p0443r7.html) 和 [P1244](http://www.open-std.org/jtc1/sc22/wg21/docs/papers/2018/p1244r0.html)\
  \ 中的正式描述。P0443（一种用于 C++ 的统一执行器提案）提了单向执行，它可能是 C++20 的一部分；而 P1244（用于统一执行器提案的依赖执行）提了依赖执行，它可能是\
  \ C++23 的一部分。本章还提到了相对较新的“适度执行器提案” [P1055](http://open-std.org/JTC1/SC22/WG21/docs/papers/2018/p1055r0.pdf)。\n\
  \n## 什么是执行器？\n\n首先，什么是执行器？执行器由一组关于在`哪里`、`何时`以及`如何`运行可调用单元的规则组成。\n*   **哪里**(Where)：可调用单元可以在内部或外部处理器上运行，结果从内部或外部处理器读回。\n\
  *   **何时**(When)：可调用单元可以立即运行，也可以调度在稍后运行。\n*   **如何**(How)：可调用单元可以在 CPU 或 GPU 上运行，甚至以向量化的方式执行。\n\
  \n更正式地说，每个执行器都拥有与所执行的执行函数相关的属性。\n\n### 执行器属性\n\n你可以通过两种方式将这些属性与执行器关联：`execution::require`\
  \ 或 `execution::prefer`。\n\n1.  **方向性** (Directionality)：执行函数可以是“触发后遗忘”类型（`execution::oneway`）、返回一个\
  \ future（`execution::twoway`）或返回一个延续（`execution::then`）。\n2.  **基数** (Cardinality)：执行函数可以创建一个（`execution::single`）或多个执行代理（`execution::bulk`）。\n\
  3.  **阻塞** (Blocking)：函数可能会阻塞也可以不。有三个互斥的阻塞属性：`execution::blocking.never`、`execution::blocking.possibly`\
  \ 和 `execution::blocking.always`。\n4.  **延续** (Continuations)：任务可能在客户端的调用线程上执行（`execution::continuation`）或不执行（`execution::not_continuation`）。\n\
  5.  **Future 任务提交**：指定可能未完成的工作（`exection::outstanding_work.tracked`）或否（`execution::outstanding_work.untracked`）：\n\
  6.  **批量前向进展保证**：指定批量创建的执行代理的互斥前向进展保证：`execution::bulk_sequenced_execution`、`execution::bulk_parallel_execution`\
  \ 和 `execution::bulk_unsequenced_execution`。\n7.  **线程执行映射保证**：每个执行代理应该映射到一个新线程上（`execution::new_thread_execution_mapping`）还是否（`execution::thread_execution_mapping`）。\n\
  8.  **分配器** (Allocators)：将分配器（`execution::allocator`）与执行器关联。\n\n你甚至定义自己的属性。\n\n\
  ## 示例\n\n### 使用执行器\n\n以下是几个代码片段展示了执行器的用法：\n\n#### `std::async` 承诺\n\n```cpp\n//\
  \ 通过某种手段获取执行器\nmy_executor_type my_executor = ...\n\n// 使用我的执行器启动异步任务\nauto future\
  \ = std::async(my_executor, [] {\n    std::cout << \"Hello world, from a new execution\
  \ agent!\" << std::endl;\n});\n```\n执行 `std::async`\n\n#### STL 算法 `std::for_each`\n\
  \n```cpp\n// 通过某种手段获取执行器\nmy_executor_type my_executor = ...\n\n// 在我的执行器上“执行”并行的\
  \ for_each\nstd::for_each(std::execution::par.on(my_executor), \n              data.begin(),\
  \ data.end(), func);\n```\n在 `my_executor` 上并行执行 `std::for_each`\n\n#### 使用默认执行器的网络\
  \ TS：接收客户端连接\n\n```cpp\n// 通过某种手段获取接收器\ntcp::acceptor my_acceptor = ...\n\n// 执行异步接收操作\n\
  acceptor.async_accept(\n    [](std::error_code ec, tcp::socket new_connection)\n\
  \    {\n      ...\n    }\n  );\n```\n\n 使用线程池的网络 TS：接收客户端连接\n\n```cpp\n// 通过某种手段获取接收器\n\
  tcp::acceptor my_acceptor = ...\n\n// 获取特定的线程池执行器\nauto thread_pool_executor = ...\n\
  \n// 执行异步接收操作\nacceptor.async_accept(\n    std::experimental::net::bind_executor(thread_pool_executor,\n\
  \      [](std::error_code ec, tcp::socket new_connection)\n      {\n        ...\n\
  \      }\n    )\n  );\n```\n`std::experimental::net::bind_executor` 函数允许它使用特定的执行器。在这种情况下，完成处理程序在线程池上运行。\n\
  \n使用执行器需要获取它。\n\n### 获取执行器\n\n有多种获取执行器的方法：\n\n#### 执行上下文 `static_thread_pool`\n\n\
  ```cpp\n// 创建具有 4 个线程的线程池\nstatic_thread_pool pool(4);\n\n// 从线程池获取执行器\nauto exec\
  \ = pool.executor();\n\n// 使用该执行器运行长时间任务\nauto task1 = long_running_task(exec);\n\
  ```\n来自执行上下文\n\n#### 执行策略 `std::execution::par`\n\n```cpp\n// 获取 par 关联的执行器\nauto\
  \ par_exec = std::execution::par.executor();\n\n// 使用该执行器运行长时间任务\nauto task2 = long_running_task(par_exec);\n\
  ```\n来自执行策略\n\n#### 系统执行器\n\n这是默认执行器，通常使用线程执行。在未指定其他执行器时使用它。\n\n#### 执行器适配\n\n```cpp\n\
  // 从线程池获取执行器\nauto exec = pool.executor();\n\n// 将线程池执行器封装在 logging_executor 中\n\
  logging_executor<decltype(exec)> logging_exec(exec);\n\n// 在并行排序中使用日志执行器\nstd::sort(std::execution::par.on(logging_exec),\
  \ my_data.begin(), my_data.end());\n```\n来自执行器适配器\n\n`logging_executor` 在代码片段中是\
  \ `pool` 执行器的封装。\n\n## 执行器概念的目标\n\n根据提案 [P1055](http://open-std.org/JTC1/SC22/WG21/docs/papers/2018/p1055r0.pdf)，执行器概念的目标是什么？\n\
  \n1.  **可批处理** (Batchable)：控制可调用单元转换成本与其大小之间的权衡。\n2.  **异构性** (Heterogenous)：允许可调用单元在异构环境中运行并取回结果。\n\
  \n\n\n\n\n3. **可排序 (Orderable)**：指定可调用对象调用的顺序。目标包括顺序保证，例如 [LIFO](https://en.wikipedia.org/wiki/Stack_(abstract_data_type))（**后进先出**）、[FIFO](https://en.wikipedia.org/wiki/FIFO_(computing_and_electronics))（**先入先**）执行、优先级或时间限制，甚至是顺序执行。\n\
  \n4. **可控 (Controllable)**：可调用对象必须能够指向特定的计算资源、被延迟甚至被取消。\n\n5. **可继续 (Continuable)**：控制异步可调用对象需要信号。这些信号必须指示结果是否可用、是否发生错误、调用何时完成，或者调用者是否想要取消调用。应该允许显式启动调用或停止正在启动的。\n\
  \n6. **可分层 (Layerable)**：层次结构允许在不增加简单用例复杂性的情况下添加功能。\n\n7. **可用性 (Usable)**：实现者和用户的易用性应该是主要目标。\n\
  \n8. **可组合性 (Composable)**：允许用户扩展执行器以实现标准库之外的功能。\n\n9. **最小性 (Minimal)**：执行器概念中不应存在任何可以通过该概念之上的库从外部添加的内容。\n\
  \n### 术语\n\n该提案 [P0761](http://www.open-std.org/jtc1/sc22/wg21/docs/papers/2018/p0761r2.pdf)\
  \ 为可调用对象的执行定义了几个新术语：\n\n* **执行资源 (Execution resource)**：是能够执行可调用对象的硬件和/或软件能力的实例。执行单元的范围可以从\
  \ SIMD 向量单元到管理大量线程集合的整个运行时。如 CPU 或 GPU 等执行资源是异构的，因为它们具有不同的自由度和限制。\n\n* **执行上下文 (Execution\
  \ context)**：是一个程序对象，代表特定的执行资源集合以及存在于这些资源内部的执行代理。典型示例是线程池或分布式或异构运行时。\n\n* **执行代理\
  \ (Execution agent)**：是特定执行上下文的执行单元，映射到执行资源上对可调用对象的单次调用。典型示例是 CPU 线程或 GPU 执行单元。\n\
  \n* **执行器 (Executor)**：是一个与特定执行上下文相关的对象。它提供一个或多个执行函数，用于从可调用函数对象创建执行代理。\n\n### 执行函数\n\
  \n根据上段，执行器提供一个或多个执行函数来从可调用对象创建执行代理。执行器必须至少支持以下六个函数之一。\n\n执行器的执行函数：\n\n| **名称 (Name)**\
  \ | **基数 (Cardinality)** | **方向 (Direction)** |\n| --- | --- | --- |\n| `execute`\
  \ | `single` | `oneway` |\n| `twoway_execute` | `single` | `twoway` |\n| `then_execute`\
  \ | `single` | `then` |\n| `bulk_execute` | `bulk` | `oneway` |\n| `bulk_twoway_execute`\
  \ | `bulk` | `twoway` |\n| `bulk_then_execute` | `bulk` | `then` |\n\n每个执行函数都有两个属性：基数和方向。\n\
  \n* 基数 (Cardinality)\n    * `single`：创建一个执行代理\n    * `bulk`：创建一个一组执行代理\n* 方向 (Direction)\n\
  \    * `oneway`：创建一个执行代理且不返回结果\n    * `twoway`：创建一个执行代理并返回一个 future，可以使用它等待执行完成\n\
  \    * `then`：创建一个执行代理并返回一个 future，可以使用它等待执行完成。在给定的 future `pred` 准备绪后，执行代理才开始执行。\n\
  \n让我用更非正式的方式解释一下这些执行函数。\n\n它们都接受一个可调用对象。\n\n#### 单数基数 (Single Cardinality)\n\n单数基数非常直观。`oneway`\
  \ 执行函数是一个“发后即忘”的任务，并返回 `void`。它与 发后即忘 future 非常相似，但它不会在 future 的析构函数中自动阻塞。`twoway`\
  \ 执行函数返回一个 future，可以使用它来获取结果。它的行为类似于 `std::promise`#chap06.xhtml_chapterXXXpromise)，它返回关联的\
  \ `std::future` 句柄。在 `then` 情况下，它是一种延续（continuation）。它返回你一个 future，但只有在提供的 future\
  \ `pred` 变为 `ready` 状态时，执行代理才会运行。\n\n#### 批量基数 (Bulk Cardinality)\n\n批量基数情况更为复杂。这些函数创建一组执行代理，每个执行代理都调用给定的可调用对象\
  \ `f`。它们返回的是结果工厂的结果，而不是由执行代理调用的单个可调用对象 `f` 的结果。`f` 的第一个参数是形状参数（shape parameter），是一个整数类型，代表代理类型的索引。后续参数是如果是\
  \ `twoway` 执行器时的结果工厂，以及一个形状工厂（shape factory），后者由所有代理共享。由共享工厂创建的共享参数的其生命周期与代理的生命周期绑定。它们都被统称为工厂，因为它们通过执行可调用对象来产生值，并在代理之前运行。客户端负责通过该结果工厂来歧义正确的结果。\n\
  \n当使用函数 `bulk_then_execute` 时，可调用对象 `f` 将其前驱任务 future 作为额外参数。可调用对象 `f` 通过引用接收结果、共享参数和前驱任务，因为没有哪个代理是所有者。\n\
  \n#### `execution::require`\n\n如何确定你的执行器支持特定的执行函数？\n\n在特殊情况下，你是知道的。\n\n```\nvoid\
  \ concrete_context(const my_oneway_single_executor& ex)\n{\n  auto task = ...;\n\
  \  ex.execute(task);\n}\n```\n\n使用单向单执行器\n\n在通用情况下，你可以使用函数 `execution::require`\
  \ 来请求它。\n\n```cpp\ntemplate<class Executor>\nvoid generic_context(const Executor&\
  \ ex)\n{\n  auto task = ...;\n\n  // 确保通过 execution::require 可以 .toway_execute\n\
  \  execution::require(ex, execution::single, execution::twoway).toway_execute(task);\n\
  }\n```\n\n请求一个双向执行的单执行器\n\n#### 原型实现\n\n根据提案 [P0443R5](http://www.open-std.org/jtc1/sc22/wg21/docs/papers/2018/p0443r5.html)，有一个执行器提案的原型实现。这个原型实现极大帮助我深入理解了特别是批量基数的情况。\n\
  \n\n\n\n\n```\n 1 // executor.cpp\n 2 \n 3 #include <atomic>\n 4 #include <experimental/thread_pool>\n\
  \ 5 #include <iostream>\n 6 #include <utility>\n 7 \n 8 namespace execution = std::experimental::execution;\n\
  \ 9 using std::experimental::static_thread_pool;\n10 using std::experimental::executors_v1::future;\n\
  11 \n12 int main(){\n13     \n14     static_thread_pool pool{4};\n15     auto ex\
  \ = pool.executor();\n16 \n17     // 单路，单任务。\n18     ex.execute([]{ std::cout <<\
  \ \"We made it!\" << std::endl; });\n19   \n20     std::cout << std::endl;\n21 \n\
  22     // 双路，单任务。\n23     future<int> f1 = ex.twoway_execute([]{ return 42; });\n\
  24     f1.wait();\n25     std::cout << \"The result is: \" << f1.get() << std::endl;\n\
  26   \n27     std::cout << std::endl;\n28 \n29     // 单路，批量任务。\n30     ex.bulk_execute([](int\
  \ n, int& sha){ \n31         std::cout << \"part \" << n << \": \" << \"shared:\
  \ \" << sha <<  \"\\n\"; \n32         }, 8, \n33         []{ return 0; }\n34   \
  \  );\n35   \n36     std::cout << std::endl;\n37 \n38     // 双路，批量，void 结果。\n39\
  \     future<void> f2 = ex.bulk_twoway_execute(\n40         [](int n, std::atomic<short>&\
  \ m){\n41             std::cout << \"async part \" << n ;\n42             std::cout\
  \ << \" atom: \" << m++ << std::endl;\n43         }, 8, \n44         []{}, \n45\
  \         []{\n46             std::atomic<short> atom(0);\n47             return\
  \ std::ref(atom); \n48         }\n49     );\n50     f2.wait();\n51     std::cout\
  \ << \"bulk result available\" << std::endl;\n52   \n53     std::cout << std::endl;\n\
  54 \n55     // 双路，批量，非 void 结果。\n56     future<double> f3 = ex.bulk_twoway_execute(\n\
  57         [](int n, double&, int &){ \n58             std::cout << \"async part\
  \ \" << n << \" \";\n59             std::cout << std::this_thread::get_id() << std::endl;\n\
  60         }, 8, \n61         []{ \n62             std::cout << \"Result factory:\
  \ \" \n63                       << std::this_thread::get_id() << std::endl;\n64\
  \             return 123.456; }, \n65         []{ \n66             std::cout <<\
  \ \"Shared Parameter: \" \n67                       << std::this_thread::get_id()\
  \ << std::endl;\n68             return 0; }\n69     );\n70     f3.wait();\n71  \
  \   std::cout << \"bulk result is \" << f3.get() << std::endl;\n72   \n73 }\n```\n\
  \n# 执行器的原型实现\n\n该程序使用一个包含四个线程的线程池作为执行器（第 `14` 行和 `15` 行）。第 `18` 行和 `23` 行使用了单基数的执行函数，并创建了两个单基数的代理。后者是一个\
  \ `twoway` 执行函数，因此它返回一个结果。\n\n第 `30`、`39` 行和 `56` 行中的剩余执行函数是批量基数的。每个函数创建了八个代理（第\
  \ `32` 行、`43` 行和 `60` 行）。在第一种情况下，可调用对象显示索引 `n` 和由第 `33` 行共享工厂创建的共享值 `sha`。下一个执行函数\
  \ `bulk_twoway_execute` 更有趣。尽管它的结果工厂返回 `void`，但共享状态是原子变量 `atom`。每个代理都将其值加一（第 `42`\
  \ 行）。得益于结果工厂，最后一个执行函数（第 `56` 行到 `69` 行）返回结果 `123.456`。看到可调用对象的执行、结果的执行以及共享工厂的执行中涉及了多少线程是非常有趣的。程序的输出显示结果和共享工厂在同一个线程中运行，但代理在不同的线程中运行。\n\
  \n![执行器的原型实现](img/cpp20_23----executor.png)\n\n## 扩展的 Future\n\n以 promise 和 future\
  \ 形式的任务在 C++11 中具有毁誉参半评价。一方面，它们比线程或条件变量易用得多；另一方面，它们有一个巨大的缺陷：它们无法被组合。C++20/23 克服了这一缺陷。\n\
  \n我曾写过关于 `std::async`、`std::packaged_task` 或 `std::promise` 以及 `std::future` 形式的任务。详情请此处：任务。\n\
  \n### `std::async`、`std::packaged_task`、`std::promise` 和 `std::future`\n\n以 promise\
  \ 和 future 形式的任务在 C++11 中具有毁誉参半评价。一方面，它们比线程或条件变量易用得多；另一方面，它们有一个巨大的缺陷：它们无法被组合。C++20/23\
  \ 克服了这一缺陷。\n\n我曾写过关于 `std::async`、`std::packaged_task` 或 `std::promise` 以及 `std::future`\
  \ 形式的任务。详情请此处：任务。\n\n### `twoway_execute`\n\n以 promise 和 future 形式的任务在 C++11 中具有毁誉参半评价。一方面，它们比线程或条件变量易用得多；另一方面，它们有一个巨大的缺陷：它们无法被组合。C++20/23\
  \ 克服了这一缺陷。\n\n我曾写过关于 `std::async`、`std::packaged_task` 或 `std::promise` 以及 `std::future`\
  \ 形式的任务。详情请此处：任务。\n\n### `bulk_twoway_execute`\n\n以 promise 和 future 形式的任务在 C++11\
  \ 中具有毁誉参半评价。一方面，它们比线程或条件变量易用得多；另一方面，它们有一个巨大的缺陷：它们无法被组合。C++20/23 克服了这一缺陷。\n\n我曾写过关于\
  \ `std::async`、`std::packaged_task` 或 `std::promise` 以及 `std::future` 形式的任务。详情请此处：任务。\n\
  \n### `then`\n\n以 promise 和 future 形式的任务在 C++11 中具有毁誉参半评价。一方面，它们比线程或条件变量易用得多；另一方面，它们有一个巨大的缺陷：它们无法被组合。C++20/23\
  \ 克服了这一缺陷。\n\n### `valid`\n\n以 promise 和 future 形式的任务在 C++11 中具有毁誉参半评价。一方面，它们比线程或条件变量易用得多；另一方面，它们有一个巨大的缺陷：它们无法被组合。C++20/23\
  \ 克服了这一缺陷。\n\n### `ready`\n\n以 promise 和 future 形式的任务在 C++11 中具有毁誉参半评价。一方面，它们比线程或条件变量易用得多；另一方面，它们有一个巨大的缺陷：它们无法被组合。C++20/23\
  \ 克服了这一缺陷。\n\n### `make_ready_future`\n\n```\n1 #include <future>\n2 using namespace\
  \ std;\n3 int main() {\n4 \n5   future<int> f1 = async([] { return 123; });\n6 \
  \  future<string> f2 = f1.then([](future<int> f) {\n7     return to_string(f.get());\
  \      // 这里 .get() 不会阻塞\n8   });\n9 \n10   auto myResult= f2.get();\n11 \n12 }\n\
  ```\n\n\n\n\n因此，只有当 `(x > 0)` 成立时，结果才必须通过 promise 计算。\n\n简要说明：这两个函数都是 monad 中返回函数的辅助。现在让我们开始介绍未来的组合。\n\
  \n## `std::when_any` 和 `std::when_all`\n\n这两个函数有很多共同点。\n\n首先，让我们看看输入。\n\n```cpp\n\
  template < class InputIt >\nauto when_any(InputIt first, InputIt last)\n    -> future<when_any_result<\n\
  \t          std::vector<typename std::iterator_traits<InputIt>::value_type>>>;\n\
  \ntemplate < class... Futures >\nauto when_any(Futures&&... futures)\n    -> future<when_any_result<std::tuple<std::decay_t<Futures>...>>>;\n\
  \ntemplate < class InputIt >\nauto when_all(InputIt first, InputIt last)\n    ->\
  \ future<std::vector<typename std::iterator_traits<InputIt>::value_type>>;\n\ntemplate\
  \ < class... Futures >\nauto when_all(Futures&&... futures)\n    -> future<std::tuple<std::decay_t<Futures>...>>;\n\
  ```\n\n### when_any 和 when_all\n\n这两个函数都接受一对用于 future 范围的迭代器或任意数量的 future。主要的区别在于，在迭代器对的情况下，future\
  \ 必须是相同类型；而在任意数量 future 的情况下，future 可以具有不同的类型，甚至可以使用 `std::future` 和 `std::shared_future`。\n\
  \n函数的输出取决于使用的是迭代器对还是任意数量的 future（变长模板参数）。这两个函数都返回一个 future。如果使用迭代器对，你将得到一个存储在 `std::vector`\
  \ 中的未来未来：`future<vector<future<R>>>`。如果你使用变长模板参数，你将得到一个存储在 `std::tuple` 中的未来未来：`future<tuple<future<R0>,\
  \ future<R1>, ... >>`。\n\n这涵盖了它们的共同点。如果所有输入 future（`when_all`）就绪，或者任意一个输入 future（`when_any`）就绪，这两个函数返回的\
  \ future 就会就绪。\n\n接下来的两个示例展示了 `std::when_all` 和 `std::when_any` 的用法。\n\n### `std::when_all`\n\
  \n```cpp\n 1 #include <future>\n 2 \n 3 using namespace std;\n 4 \n 5 int main()\
  \ {\n 6 \n 7   shared_future<int> shared_future1 = async([] { return intResult(125);\
  \ });\n 8   future<string> future2 = async([]() { return stringResult(\"hi\"); });\n\
  \ 9\n10   future<tuple<shared_future<int>, future<string>>> all_f = \n11       \
  \  when_all(shared_future1, future2);\n12 \n13   future<int> result = all_f.then(\n\
  14         [](future<tuple<shared_future<int>, future<string>>> f){ \n15       \
  \    return doWork(f.get()); \n16         });\n17 \n18   auto myResult = result.get();\n\
  19 \n20 }\n```\n\n使用 `std::when_all` 进行 future 组合\n\nfuture `all_f`（第 10 行）组合了 future\
  \ `shared_future1`（第 7 行）和 `future2`（第 8 行）。如果所有底层 future 都就绪，则执行第 13 行中的 future\
  \ `result`。在这种情况下，执行第 15 行中的 future `all_f`。结果在 future `result` 中，并可以在第 18 行使用。\n\
  \n### `std::when_any`\n\n```cpp\n 1 #include <future>\n 2 #include <vector>\n 3\
  \ \n 4 using namespace std;\n 5 \n 6 int main(){\n 7 \n 8   vector<future<int>>\
  \ v{ .... };\n 9   auto future_any = when_any(v.begin(), v.end());\n10 \n11   when_any_result<vector<future<int>>>\
  \ result = future_any.get();\n12 \n13   future<int>& ready_future = result.futures[result.index];\n\
  14 \n15   auto myResult = ready_future.get();\n16 \n17 }\n```\n\n使用 `std::when_any`\
  \ 进行 future 组合\n\n`when_any` 中的 future 可以被第 11 行中的 `result` 获取。`result` 提供了指示哪个输入\
  \ future 已就绪的信息。如果不使用 `when_any_result`，你必须询问每个 future 是否就绪。这很繁琐。\n\n`future_any`\
  \ 是只要其中一个输入 future 就绪，它就会就绪的 future。第 11 行的 `future_any.get()` 返回 future `result`。通过使用\
  \ `result.futures[result.index]`（第 13 行），你得到了 `ready_future`，得益于 `ready_future.get()`，你可以获取任务的结果。\n\
  \n无论是已经标准化的 还是 [concurrency TS v1 futures](http://en.cppreference.com/w/cpp/experimental/concurrency)，都“没有它们所要求的通用、表达力或强大”\
  \ [P0701r1](http://www.open-std.org/jtc1/sc22/wg21/docs/papers/2017/p0701r1.html)。此外，作为执行某些操作的基础构建的\
  \ executors 必须与新的 futures 统一。\n\n## 统一的 futures\n\n已经标准化的 futures 以及来自 concurrency\
  \ TS 1 的 futures 有什么缺点？\n\n### 缺点\n\n前面提到的文档对 futures 的缺陷给出了极佳的描述。\n\n## `future/promise`\
  \ 不应与 `std::thread` 执行代理耦合\n\nC++11 只有一个执行器：`std::thread`。因此，futures 和 `std::thread`\
  \ 是不可分割的。这随着 C++17 和 STL 并行算法的出现发生了变化。随着可以使用来配置 future 的新执行器的出现，这种变化发生了更大的变化。例如，future\
  \ 可能会运行在单独线程中、线程池中，或者仅仅按顺序执行。\n\n## `.then` 延续是在哪里调用的？\n\n假设你有一个像下面示例那样的简单延续。\n\n\
  ```cpp\nfuture<int> f1 = async([] { return 123; });\nfuture<string> f2 = f1.then([](future<int>\
  \ f) {\n    return to_string(f.get());\n});\n```\n\n带有 `std::future` 的延续\n\n问题是：延续应该在哪里运行？有几种可能性：\n\
  \n1. 消费者侧（Consumer Side）：消费者总是执行延续。\n2. 生产者侧（Producer Side）：生产者总是执行延续。\n3. `inline_executor`\
  \ 语义：如果共享状态在设置时已就绪，则消费者执行延续；如果共享状态在设置时未就绪，则生产者执行延续。\n4. `thread_executor` 语义：一个新的\
  \ `std::thread` 执行延续。\n\n特别是，前两种可能性有一个巨大的缺点：它们会阻塞。在第一种情况下，消费者阻塞直到生产者就绪。在第二种情况下，生产者阻塞直到消费者就绪。\n\
  \n以下是文档 [P0701r1](http://www.open-std.org/jtc1/sc22/wg21/docs/papers/2017/p0701r1.html)\
  \ 中执行器的一些良好案例：\n\n```cpp\nauto i = std::async(thread_pool, f).then(g).then(h);\n\
  // f, g 和 h 都在 thread_pool 上执行。\n\nauto i = std::async(thread_pool, f).then(g, gpu).then(h);\n\
  // f 在 thread_pool 上执行，g 和 h 在 gpu 上执行。\n\nauto i = std::async(inline_executor,\
  \ f).then(g).then(h);\n// h(g(f())) 在调用代理中执行。\n```\n\n## 执行器传递\n\n### 将 futures\
  \ 传递给 `.then`\n\n由于传递的是 future 而不是值，所以语法很复杂。首先是正确但冗长的的版本：\n\n```cpp\nstd::future<int>\
  \ f1 = async([] { return 123; });\nstd::future<string> f2 = f1.then([](std::future<int>\
  \ f) {\n    return to_string(f.get());\n});\n```\n\n传递值的延续\n\n现在，我假设我可以传递值，因为 `to_string`\
  \ 对 `std::future<int>` 有重载。\n\n```cpp\nstd::future<int> f1 = async([] { return 123;\
  \ });\nstd::future<string> f2 = f1.then(std::to_string); \n```\n\n## `when_all`\
  \ 和 `when_any` 的返回类型很复杂\n\n关于`std::when_all` 和 `std::when_any` 的章节展示了它们相当复杂的用法。\n\
  \n## 析构函数中的条件阻塞必须消除\n\n遗忘式 future 很有前景，但有一个巨大的缺点。由 `std::async` 创建的 future 会在析构函数上等待，直到其\
  \ promise 完成。看似并发的操作实际上是顺序执行的。\n\n我们在引用章节中描述了 Fire and Forget Futures 的特殊行为。\n\n\
  \n\n\n\n# 立即值与未来值应当易于组合\n\n在 C++11 中，没有方便的方法来创建一个 future。我们必须从一个 promise 开始。\n\n\
  ```cpp\nstd::promise<std::string> p;\nstd::future<std::string> fut = p.get_future();\n\
  p.set_value(\"hello\"); \n```\n\n## 在当前标准中创建 future\n\n这可能会随着 `std::make_ready_future`(#chap10.xhtml_chapterXXXmake_ready_futureZZZmake_exceptional_future)\
  \ 函数在并发 TS v1 中的引入而改变。\n\n```cpp\nstd::future<std::string> fut = make_ready_future(\"\
  hello\"); \n```\n\n## 在并发 TS v1 中创建 future\n\n使用 future 和非 future 参数将使我们的工作变得更加舒适。\n\
  \n```cpp\nbool f(std::string, double, int);\n\nstd::future<std::string> a = /* ...\
  \ */;\nstd::future<int>    c = /* ... */;\n\nstd::future<bool> d1 = when_all(a,\
  \ make_ready_future(3.14), c).then(f);  \n// f(a.get(), 3.14, c.get())\n\nstd::future<bool>\
  \ d2 = when_all(a, 3.14, c).then(f);  \n// f(a.get(), 3.14, c.get())\n```\n\n##\
  \ 使用 future 和非 future 参数\n\n在并发 ts v1 中，形式 `d1` 和形式 `d2` 都是可能的。\n\n## 五个新概念\n\n\
  在提案 [1054R0](http://www.open-std.org/jtc1/sc22/wg21/docs/papers/2018/p1054r0.html)\
  \ 中，针对 futures 和 promises 有五个新概念。\n\n- `FutureContinuation`：可调用对象，以 future 的值或异常作为参数被调用。\n\
  - `SemiFuture`：可以绑定到执行器（executor），这是一个能产生 `ContinuableFuture` 的操作（`f = sf.via(exec)`）。\n\
  - `ContinuableFuture`：对 `SemiFuture` 的细化，其实例可以附加一个 `FutureContinuation`（`f.then(c)`），当\
  \ future 就绪时，它会在 future 关联的执行器上执行。\n- `SharedFuture`：对 `ContinuableFuture` 的细化，其实例可以附加多个\
  \ `FutureContinuation`。\n- `Promise`：每个 promise 都与一个 future 关联，并通过值或异常使 future 就绪。\n\
  \n该论文还提供了这些新概念的声明。\n\n```cpp\ntemplate <typename T>\nstruct FutureContinuation\n\
  {\n  // 至少存在这两个重载中的之一：\n  auto operator()(T value);\n  auto operator()(exception_arg_t,\
  \ exception_ptr exception);\n};\n\ntemplate <typename T>\nstruct SemiFuture\n{\n\
  \  template <typename Executor>\n  ContinuableFuture<Executor, T> via(Executor&&\
  \ exec) &&;\n};\n\ntemplate <typename Executor, typename T>\nstruct ContinuableFuture\n\
  {\n  template <typename RExecutor>\n  ContinuableFuture<RExecutor, T> via(RExecutor&&\
  \ exec) &&;\n\n  template <typename Continuation>\n  ContinuableFuture<Executor,\
  \ auto> then(Continuation&& c) &&;\n};\n\ntemplate <typename Executor, typename\
  \ T>\nstruct SharedFuture\n{\n  template <typename RExecutor>\n  ContinuableFuture<RExecutor,\
  \ auto> via(RExecutor&& exec);\n\n  template <typename Continuation>\n  SharedFuture<Executor,\
  \ auto> then(Continuation&& c);\n};\n\ntemplate <typename T>\nstruct Promise\n{\n\
  \  void set_value(T value) &&;\n\n  template <typename Error>\n  void set_exception(Error\
  \ exception) &&;\n  bool valid() const;\n};\n```\n\n用于 futures 和 promises 的五个新概念\n\
  \n基于概念的声明，这里有几点观察：\n\n- `FutureContinuation` 可以用值或异常进行调用。它是一个可调用单元，用于消耗 future 的值或异常。\n\
  - 所有 futures（`SemiFuture`、`ContinuableFuture` 和 `SharedFuture`）都有一个 `via` 方法，接受一个执行器并返回一个\
  \ `ContinuableFuture`。`via` 允许通过使用不同的执行器从一种 future 类型转换为另一种。\n- 只有 `ContinuableFuture`\
  \ 或 `SharedFuture` 拥有用于延续的 `then` 方法。`then` 方法接受一个 `FutureContinuation` 并返回一个 `ContinuableFuture`。\n\
  - `SharedFuture` 是一个非唯一所有的、可拷贝的 future。\n- `Promise` 可以设置值或异常。\n\n## 未来工作\n\n提案\
  \ [1054R0](http://www.open-std.org/jtc1/sc22/wg21/docs/papers/2018/p1054r0.html)\
  \ 留了一些未解决的问题。\n\n- futures 和 promises 的向前进展保证。\n- 从非并发执行代理使用 futures 和 promises\
  \ 时的同步要求。\n- `std::future/std::promise` 的互操作性。\n- future 的解包（unwrapping），包括 `future<future<T>>`\
  \ 和更高级的形式。\n- `when_all/when_any`。\n- `async`。\n\n### 事务内存\n\n提案 [1054R0](http://www.open-std.org/jtc1/sc22/wg21/docs/papers/2018/p1054r0.html)\
  \ 留了一些未解决的问题。\n\n- futures 和 promises 的向前进展保证。\n- 从非并发执行代理使用 futures 和 promises\
  \ 时的同步要求。\n- `std::future/std::promise` 的互操作性。\n- future 的解包，包括 `future<future<T>>`\
  \ 和更高级的形式。\n- `when_all/when_any`。\n- `async`。\n\n 事务内存\n\n事务内存基于事务的思想。事务内存使得线程工作变得更加容易，原因有两个：首先消除了数据竞态和死锁，其次事务是可组合的。\n\
  \n事务具有以下属性：**A**原子性（Atomicity）、**C**一致性（Consistency）、**I**隔离性（Isolation）和**D**持久性（Durability），即\
  \ ACID。\n\n#### ACID \n\n原子性、一致性和隔离对于原子块意味着什么？\n\n```cpp\natomic{\n    statement1;\n\
  \    statement2;\n    statement3;\n}\n```\n\n原子块\n\n原子性：块中的语句要么全部执行，要么都不执行。\n\n\
  一致性：系统始终处于一致状态。\n\n隔离性：每个事务都彼此隔离。\n\n这些属性是如何应用的？事务记住其初始状态并在不需要同步的情况下执行。总顺序。如果在执行期间发生冲突，事务将被中断并恢复到初始状态。这种回滚会导致事务重新执行。如果事务结束时初始状态仍然，则事务提交。冲突通常通过标记的状态引用检测。\n\
  \n事务是一种推测性的操作，只有当初始状态有效时提交。与互斥相比，它是一种乐观的方法。事务不需要同步。只有在没有发生冲突时才会发布。互斥是一种悲观的方法。首先，互斥确保没有其他线程进入临界区；接下来，当线程是互斥锁的所有者时，它进入临界区，因此所有其他线程被阻塞。\n\
  \nC++ 支持两种类型的事务内存：同步块和原子块。\n\n#### 同步块和原子块\n\n到为止我只写了事务。现在我写同步块和原子块。它们都可以相互封装。更具体地说，同步块不是事务，因为它们可以执行事务安全的代码。事务安全的代码示例是如控制台输出等无法撤销的代码。因此，同步块通常被称为宽松块。\n\
  \n##### 同步块\n\n同步块的行为就像有一个全局锁保护它们。这意味着所有同步块都遵循一个总顺序，特别是：同步块的所有更改在下一个同步块中都是可见的。同步块之间存在*同步化*关系，因为事务的提交与下一次事务的开始同步。经典的互斥锁保护程序的临界区域，而同步块的全局锁保护整个程序。\n\
  \n这就是为什么以下程序是定义的：\n\n\n\n\n\n```cpp\n 1 // synchronized.cpp\n 2 \n 3 #include <iostream>\n\
  \ 4 #include <vector>\n 5 #include <thread>\n 6 \n 7 int i= 0;\n 8 \n 9 void increment(){\n\
  10   synchronized{ \n11     std::cout << ++i << \" ,\";\n12   }\n13 }\n14 \n15 int\
  \ main(){\n16   \n17   std::cout << std::endl;\n18     \n19   std::vector<std::thread>\
  \ vecSyn(10);\n20   for(auto& thr: vecSyn)\n21     thr = std::thread([]{ for(int\
  \ n = 0; n < 10; ++n) increment(); });\n22   for(auto& thr: vecSyn) thr.join();\n\
  23   \n24   std::cout << \"\\n\\n\";\n25   \n26 } \n```\n\n# 同一个同步块\n\n尽管第 7 行的变量\
  \ `i` 是一个全局变量，且同步块中的操作并不是事务安全的（transaction-unsafe），但该程序是有定义良好的。十个线程并发地调用 `increment`\
  \ 函数（第 21 行）十次，增加第 11 行中的变量 `i`。对 `i` 和 `std::cout` 的访问发生在一个全顺序中。这就是同步块的特性。\n\n\
  程序返回了预期的结果。`i` 的值按递增顺序写入，并用逗号分隔。为了完整起见，这里是输出结果。\n\n![使用同步块递增](img/cpp20_23----synchronized.png)\n\
  \n## 使用同步块递增\n\n数据竞态呢？在使用同步块时也会出现数据竞态。对源代码进行微小的修改就会引入数据竞态。\n\n```cpp\n 1 // nonsynchronized.cpp\n\
  \ 2 \n 3 #include <chrono>\n 4 #include <iostream>\n 5 #include <vector>\n 6 #include\
  \ <thread>\n 7 \n 8 using namespace std::chrono_literals;\n 9 using namespace std;\n\
  10 \n11 int i= 0;\n12 \n13 void increment(){\n14   synchronized{ \n15     cout <<\
  \ ++i << \" ,\";\n16     this_thread::sleep_for(1ns);\n17   }\n18 }\n19 \n20 int\
  \ main(){\n21   \n22   cout << endl;\n23     \n24   vector<thread> vecSyn(10);\n\
  25   vector<thread> vecUnsyn(10);\n26     \n27   for(auto& thr: vecSyn)\n28    \
  \ thr = thread([]{ for(int n = 0; n < 10; ++n) increment(); });\n29   for(auto&\
  \ thr: vecUnsyn)\n30     thr = thread([]{ for(int n = 0; n < 10; ++n) cout << ++i\
  \ << \" ,\"; });\n31     \n32   for(auto& thr: vecSyn) thr.join();\n33   for(auto&\
  \ thr: vecUnsyn) thr.join();\n34   \n35   cout << \"\\n\\n\";\n36   \n37 }\n```\n\
  \n# 使用同步块的数据竞态\n\n为了观察数据竞态，我让同步块睡眠了一个纳秒（第 16 行）。同时，我在没有使用同步块的情况下访问了输出流 `std::cout`（第\
  \ 30 行）。总共有 20 个线程增加了全局变量 `i`，其中一半没有进行同步。输出显示了该问题。\n\n![使用同步块的数据竞态](img/cpp20_23----nonsynchronizedEdit.png)\n\
  \n## 使用同步块的数据竞态\n\n我在输出结果中的问题处画了红圈。这些位置是至少有两个线程同时写入 `std::cout` 的地方。C++11 标准保证了字符是原子性写入的；这并不是问题。更糟糕的是变量\
  \ `i` 被至少两个线程写入。这是一个数据竞态；因此，该程序具有未定义行为。如果你仔细观察输出，你会看到数据竞态正在发生。计数器的最终结果是 199，但本应是\
  \ 200。这意味着计数器的某个中间值被覆盖了。\n\n同步块的全顺序同样适用于原子块（atomic blocks）。\n\n### 原子块\n\n你可以在同步块中执行事务不安全的代码，但在原子块中不行。原子块有三种形式：`atomic_noexcept`、`atomic_commit`\
  \ 和 `atomic_cancel`。这三个后缀 `_noexcept`、`_commit` 和 `_cancel` 定义了原子块如何管理异常：\n\n####\
  \ `atomic_noexcept`\n\n如果抛出异常，将调用 `std::abort` 导致程序终止。\n\n#### `atomic_cancel`\n\
  \n在默认情况下，会调用 `std::abort`。如果抛出一个负责结束事务的事务安全异常，则不成立。在这种情况下，事务被取消，并恢复到初始状态。\n\n####\
  \ `atomic_commit`\n\n如果抛出异常，事务将被提交（commit）。\n\n\n\n\n\n`traverse` 是一个函数模板，它会在其树的每个节点上调用函数\
  \ `f`。关键字 `define_task_block` 定义了任务块。任务块 `tb` 可以在该块中启动一个新的任务。第 6 行和第 7 行树的左右分支正发生了这种情况。第\
  \ 9 行是任务块的结束，因此也是同步点。\n\n你可以使用函数 `define_task_block` 或函数 `define_task_block_restore_thread`\
  \ 来定义任务块。\n\n### `define_task_block` 与 `define_task_block_restore_thread`\n\n两者细微的区别在于，`define_task_block_restore_thread`\
  \ 函数与 `define_task_block` 函数不同，它保证任务块的创建线程与任务块执行后运行的线程是同一个线程。\n\n```\n 1 ...\n 2\
  \ define_task_block(&{  \n 3   tb.run([&]{[] func(); });\n 4   define_task_block_restore_thread(&{\n\
  \ 5     tb.run(&; });\n 6     define_task_block(&{\n 7        tb.run([&]{ func3();\
  \ }\n 8     });\n 9     ...\n10     ...\n11   });\n12   ...\n13   ...\n14 });\n\
  15 ...\n16 ... \n```\n\n#### `define_task_block_restore_thread` 比较\n\n任务块确保了最外层任务块（第\
  \ 2-14 行）的创建线程与完成任务块后执行语句的线程完全相同。这意味着执行第 2 行的线程与执行第 15 行和 16 行的线程是同一个。这种保证不适用于嵌套的任务块；因此，第\
  \ 6-8 行任务块的创建线程不会自动执行第 9 行和 10 行。如果你需要这种保证，应该使用函数 `define_task_block_restore_thread`（第\
  \ 4 行）。现在，执行第 4 行的创建线程与执行第 12 行和 13 行的线程同一个。\n\n### 接口\n\n任务块的接口非常有限。你不能构造、销毁、拷贝或移动\
  \ `task_block` 类的对象；你必须使用函数 `define_task_block` 或 `define_task_block_restore_thread`。任务块\
  \ `tb` 在定义的活动任务块作用域内，因此可以启动新任务（`tb.run`）或等待（`tb.wait`）直到任务完成。\n\n```\n1 define_task_block(&{\
  \  \n2   tb.run([&]{ process(x1, x2) });\n3   if (x2 == x3) tb.wait();\n4   process(x3,\
  \ x4);\n5 }); \n```\n\n#### 任务块的最小接口\n\n这段代码段在做什么？第 2 行启动了一个新任务。该任务需要数据 `x1` 和 `x2`。第\
  \ 4 行使用了数据 `x3` 和 `x4`。如果 `x2 == x3` 为真，则必须保护变量免受共享访问。这就是为什么任务块 `tb` 等待第 2 行的任务完成的原因。\n\
  \n如果函数 `task_block::run` 或 `task_block::wait` 检测到当前任务块中存在待处理异常，它们将抛出一个类型为 `task_cancelled_exception`\
  \ 的异常。\n\n### 调度器\n\n调度器管理哪个线程正在运行。这意味着由谁执行任务不再是程序员的责任。线程只是一个实现细节。\n\n执行新创建的任务有两种策略。父节点代表创建线程，子节点代表新任务。\n\
  \n#### 窃取 (Child stealing)\n\n调度器窃取任务并执行它。\n\n#### 父级窃取 (Parent stealing)\n\n任务块\
  \ `tb` 本身执行任务。现在调度器窃取父节点。\n\n提议 [N4441](http://www.open-std.org/jtc1/sc22/wg21/docs/papers/2015/n4411.pdf)\
  \ 支持这两种策略。\n\n### 数据并行向量库\n\n数据并行向量库通过向量类型提供数据并行（SIMD）编程。[SIMD](https://en.wikipedia.org/wiki/SIMD)\
  \ 代表单指令多数据，意味着对许多数据并行执行一个操作。每个现代处理器架构都提供了 SIMD 扩展，但目前没有标准的 C++ 接口来使用它们。下表概述了各种 SIMD\
  \ 扩展。\n\n#### SIMD 扩展\n\n| 架构 | SIMD 扩展 | 器宽度 |\n| --- | --- | --- |\n| ARM 32 /\
  \ 64 | NEON | 128 bit |\n| Power / PowerPC | AltiVec | 128 bit |\n| | VSX | 128\
  \ bit |\n| x86 / AMD 64 | MMX / 3DNow | 64 bit |\n| | SSE | 128 bit |\n| | AVX /\
  \ AVX2 / AVX-512 | 128 bit / 256 bit / 512 bit |\n\n例如，[SSE](https://en.wikipedia.org/wiki/SSE)\
  \ 允许你并行执行操作。\n\n#### 数据并行向量\n\n数据并行向量库提供数据并行编程。\n\n```cpp\ntemplate <typename T,\
  \ typename Abi>\nclass simd {\n    // ...\n};\n```\n\n任务块的最小接口提供了各种操作。\n\n#### 数据并行向量的接口\n\
  \n数据并行向量库提供数据并行编程。\n\n```cpp\ntemplate <typename T, typename Abi>\nclass simd {\n\
  \    // ...\n};\n```\n\n#### 标签\n\n数据并行向量库提供了 ABI 和对齐的标签。\n\n##### ABI 标签\n\nABI\
  \ 标签指示元素的数量。\n\n| ABI 标签 | 描述 |\n| --- | --- |\n| `scalar` | 类型 |\n| `fixed_size`\
  \ | 类型 |\n| `compatible` | 兼容性类型 |\n| `native` | 最优效的类型 |\n| `max_fixed_size` |\
  \ 保证支持的类型 |\n\n##### 对齐标签\n\n对齐标签指示元素的对齐。\n\n| 对齐标签 | 描述 |\n| --- | --- |\n| `element_tag`\
  \ 和 `element_aligned` | 指示元素对齐类型 |\n| `vector_tag` 和 `vector_aligned` | 指示向量对齐类型\
  \ |\n| `overaligned_tag` 和 `overaligned` | 指示指定的对齐 |\n\n##### Where 表达式\n\nWhere\
  \ 表达式抽象了元素的操作。\n\n| Where 表达式 | 描述 |\n| --- | --- |\n| `const_where_expression`\
  \ | 选择非变异操作的元素 |\n| `where_expression` | 选择变异操作的元素 |\n| `where` | 生成 `const_where_expression`\
  \ 和 `where_expression` |\n\n##### 转换\n\n转换操作在 SIMD 对象和单个对象之间进行元素级转换、拆分或合并。\n\n|\
  \ Where 表达式 | 描述 |\n| --- | --- |\n| `simd_cast` 和 `static_simd_cast` | 执行元素级静态转换\
  \ |\n| `to_fixed_size`, `to_compatible` 和 `to_native` | 执行元素级 ABI 转换 |\n| `split`\
  \ | 将单个 SIMD 对象拆分为多个对象 |\n| `concat` | 将多个 SIMD 对象合并为单个 SIMD 对象 |\n\n##### 算法\n\n\
  SIMD 算法应用于两个 SIMD 对象并返回一个 SIMD 对象。\n\n| 算法 | 描述 |\n| --- | --- |\n| `min` | 元素级执行\
  \ `min` 操作并返回 SIMD 对象 |\n| `max` | 元素级执行 `max` 操作并返回 SIMD 对象 |\n| `minmax` | 元素级执行\
  \ `minmax` 操作并返回 SIMD 对象 |\n| `clamp` | 元素级执行 `clamp` 操作并返回 SIMD 对象 |\n\n\n\n\n\n\
  *   `v[i] < lo[i]: sim[i] = lo[i]`\n*   `lo[i] < v[i] < hi[i]: sim[i] = vi[i]`\n\
  *   `hi[i] < v[i]: sim[i] = hi[i]`\n\n## 归 (Reduction)\n\n归将 SIMD 向量还原为单个元素。\n\n\
  ### 归\n\n| 归 | 描述 |\n| --- | --- |\n| `reduce` | 将 SIMD 向量还原为单个元素。 |\n| `hmin` |\
  \ 返回最小元素。 |\n| `hmax` | 返回最大元素。 |\n\n## 掩码归 (Mask Reduction)\n\n仅将谓词应用于 SIMD 向量\
  \ `v[i]` 中满足 `mask m[i] == true` 的元素。\n\n### 掩码归\n\n| 掩码归 | 描述 |\n| --- | --- |\n\
  | `all_of, any_of, none_of`, 和 `some_of` | 对每个掩码 `m[i] == true` 的元素 `v[i]` 应用谓词。\
  \ |\n| `popcount` | 返回真值的数量。 |\n| `find_first_set` 和 `find_last_set` | 返回第一个或最后一个真值的位置。\
  \ |\n\n## 特性 (Traits)\n\nTraits 在编译时为你提供 SIMD 特性。\n\n### 特性\n\n| 特性 | 描述 |\n| ---\
  \ | --- |\n| `is_abi_tag` 和 `is_abi_tag_v` | 检查类型是否为 ABI tag 类型。 |\n| `is_simd`\
  \ 和 `is_simd_v` | 检查类型是否为 SIMD 类型。 |\n| `is_simd_mask` 和 `is_simd_mask_v` | 检查类型是否为\
  \ simd_mask 类型。 |\n| `is_simd_flag_type` 和 `is_simd_flag_type_v` | 检查类型是否为 SIMD\
  \ 标志类型。 |\n| `simd_size` 和 `simd_size_v` | 返回给定元素类型和 ABI 的元素数量。 |\n| `memory_alignment`\
  \ 和 `memory_alignment_v` | 为 `vector_aligned` 返回适当的对齐方式。 |\n| `abi_for_size` 和 `abi_for_size_t`\
  \ | 为给元素类型和数量返回 ABI 类型。 |\n\n# 模式 (Patterns)\n\n## 模式与最佳实践\n\n本章的目标是让你了解什么是模式，以及它们有什么用。我的务实观点是非正式的，并且是基于\
  \ C++ 视角的。对于该主题的更正式、更全面的讨论，我提供了进一步文献的链接。\n\n首先：什么是模式？\n\n### 模式\n\n“每个模式都是一个三部分的规则，表达了特定语境、问题与解决方案之间的关系。”[克里斯托弗·亚历山德](https://en.wikipedia.org/wiki/Christopher_Alexander)\
  \ \n\n通俗地说，模式是针对特定领域设计挑战的成熟且有文档记录的解决方案。\n\n### 历史\n\n模式之父是上述的克里斯托弗·亚历山德，他关于城市、建筑和通用施工的以人为本的设计模式对软件设计具有开创性意义。1994\
  \ 年，所谓的“四人帮”（Eric Gamma, Richard Helm, Ralph Johnson 和 John Vlissides）出版了他们的书籍[设计模式：可用面向对象软件的基础](https://en.wikipedia.org/wiki/Design_Patterns)。该书包含了\
  \ 23 种针对面向对象软件设计的模式。这些模式分为三类：创建型、结构型和行为型。这本书为整个软件行业定义了词汇。以下是一些最著名的设计模式：\n\n*   创建型\n\
  \    *   工厂方法模式\n    *   单例模式\n*   结构型\n    *   适配器\n    *   桥接\n    *   组合\n  \
  \  *   装饰器\n    *   外观\n    *   代理\n*   行为型\n    *   命令\n    *   迭代器\n    *   观察者\n\
  \    *   策略\n    *   模板方法\n    *   访问者\n\n一年后，Frank Buschmann, Regine Meunier, Hans\
  \ Rohnert, Peter Sommerlad 和 Michael Vlissides 出版了《面向模式的软件架构》（POSA）。书中分为架构模式、设计模式和模式模式。以下是一些广为人知的设计模式：\n\
  \n*   架构模式\n    *   层\n    *   管道与过滤器\n    *   代理人\n    *   模型-视图控制器\n    *   主/从\n\
  \    *   发布-订阅\n*   设计模式\n    *   计数器\n*   模式模式\n\n这三类之间有什么区别？架构模式关注整个系统，设计模式关注子系统之间的交互，而模式模式是模式在给定编程语言中的实现。POSA\
  \ 系列的五本书有不同的关注重点：并发与网络对象模式（第 2 卷）、资源管理模式（第 3 卷）、分布式计算模式（第 4 卷），以及模式语言（第 5 卷）。\n\n\
  ### 无价的价值\n\n模式为一般的软件开发带来了巨大的价值。当然，这对于并发领域也是如此。这种价值可以归结为三点：良好的术语、改进的文档以及学习优秀实践。\n\
  \n良好的术语意味着软件开发者现在可以使用通用且无歧的词汇。误解或冗长的解释主要是过去的问题。如果软件开发者询问关于如何实现相似算法的建议，答案可能简单如：使用策略模式。如果软件开发者熟悉策略模式，他们可以立即考虑使用的后果；如果不知道，他们可以查阅文献。\n\
  \n\n\n\n\n模式（Pattern）代表最佳实践，反模式（anti-pattern）代表教训，或者用 [Andrew Koenig](https://en.wikipedia.org/wiki/Andrew_Koenig_(programmer))\
  \ 的话：“那些描述了解决问题的糟糕方案并导致了糟糕局面的方法。”如果你仔细阅读关于并发模式的文献，经常会发现双重检查锁定模式。双重检查锁定模式的核心思想一句话概括：以优化的方式对共享状态进行线程初始化。这种共享状态通常是一个[单例](https://en.wikipedia.org/wiki/Singleton_pattern)。我特意将双重检查锁定模式放在本书的案例研究章节中，是为了明确强调：幼稚地使用双重检查锁定模式可能会导致未定义行为。双重检查锁的问题本质上归结为单例模式的问题。\n\
  \n如果你想使用单例模式，必须考虑以下挑战：\n\n*   首先，单例是一个全局对象。由于这一事实，单例的使用大多数情况下在接口中是不可见的。结果是，使用单例的代码中存在一个隐藏依赖。\n\
  *   单例是一个静态对象，因此一旦创建就永远不会被销毁。它的生命周期随着程序的生命周期而结束。\n*   如果你的类静态成员（如单例）依赖于定义在另一个单元中的另一个静态成员，你无法保证哪一个先初始化。失败的概率是\
  \ 50%。\n*   当仅仅一个类的实例就能完成工作时，通常会使用单例。许多开发者使用单例是为了证明他们知道设计模式。\n\n## 同步模式\n\n在处理并发时，主要的关注点是共享的可变异状态，或者正如\
  \ [Tony Van Eerd](https://github.com/tvaneerd) 在他的 CppCon 2014 演讲“Lock-free by Example”中所说：“忘掉你在幼儿园学到的东西（即：停止共享）”。\n\
  \n![可变、共享状态](img/SynchronisationPatterns----MutableShared.png)\n\n可变、共享状态\n\n数据竞态的必要条件是可变的、共享的状态。如果你处理了共享或变异，就不会发生数据竞态。这正是接下来的两个章节的重点：处理共享和处理变异。\n\
  \n### 处理共享\n\n如果你不共享，就不会发生数据竞态。不共享意味着你的线程在局部变量上工作。这可以通过拷贝值、使用线程特定存储，或者通过受保护的数据通道将结果传递给未来对象。这一节中的模式非常显而易见，但为了完整起见，我将带简短说明并介绍它们。\n\
  \n#### 拷贝值\n\n如果一个线程通过拷贝而非引用获取其参数，则不需要对任何数据的访问进行同步。既不会发生数据竞态，也不可能出现生命周期问题。#####\
  \ 引用引起的数据竞态\n\n以下程序启动了三个线程。一个线程通过拷贝获取参数，另一个通过引用获取，最后一个通过常量引用获取。\n\n```cpp\n 1 //\
  \ copiedValueDataRace.cpp\n 2 \n 3 #include <functional>\n 4 #include <iostream>\n\
  \ 5 #include <string>\n 6 #include <thread>\n 7 \n 8 using namespace std::chrono_literals;\n\
  \ 9 \n10 void byCopy(bool b){\n11     std::this_thread::sleep_for(1ms);\n12    \
  \ std::cout << \"byCopy: \" << b << std::endl;\n13 }\n14 \n15 void byReference(bool&\
  \ b){\n16     std::this_thread::sleep_for(1ms);\n17     std::cout << \"byReference:\
  \ \" << b << std::endl;\n18 }\n19 \n20 void byConstReference(const bool& b){\n21\
  \     std::this_thread::sleep_for(1ms);\n22     std::cout << \"byConstReference:\
  \ \" << b << std::endl;\n23 }\n24 \n25 int main(){\n26 \n27     std::cout << std::boolalpha\
  \ << std::endl;\n28 \n29     bool shared{false};\n30 \n31     std::thread t1(byCopy,\
  \ shared);\n32     std::thread t2(byReference, std::ref(shared));\n33     std::thread\
  \ t3(byConstReference, std::cref(shared));\n34 \n35     shared = true;\n36 \n37\
  \     t1.join();\n38     t2.join();\n39     t3.join();\n40 \n41     std::cout <<\
  \ std::endl;\n42 \n43 }\n```\n\n引用引起的数据竞态\n\n程序 `images/SynchronisationPatterns----MutableShared.png`\
  \ 的输出显示线程 `t1` 获取初始值，而 `t2` 和 `t3` 可能会看到更新后的值。\n\n#### 当引用拷贝时\n\n你可能认为上一个示例 `copiedValueDataRace.cpp`\
  \ 中的线程 `t3` 可以直接替换为 `std::thread t3(byConstReference, shared)`。程序 `perConstReference.cpp`\
  \ 使用了不可拷贝类型。\n\n```cpp\n 1 // perConstReference.cpp\n 2 \n 3 #include <thread>\n\
  \ 4 \n5 class NonCopyableClass{\n 6     public:\n 7 \n 8     // 生成的默认构造函数\n 9  \
  \   NonCopyableClass() = default;\n10 \n11     // 禁止拷贝\n12     NonCopyableClass&\
  \ operator = (const NonCopyableClass&) = delete;\n13     NonCopyableClass (const\
  \ NonCopyableClass&) = delete;\n14   \n15 };\n16 \n17 void perConstReference(const\
  \ NonCopyableClass& nonCopy){}\n18 \n19 int main(){\n20 \n21     NonCopyableClass\
  \ nonCopy;\n22 \n23     perConstReference(nonCopy);\n24 \n25     std::thread t(perConstReference,\
  \ nonCopy);\n26     t.join();\n27 \n28 }\n```\n\n对象 `nonCopy`（第 21 行）是拷贝的。如果我用参数\
  \ `nonCopy` 调用函数 `perConstReference`，这是没有问题的，因为该函数按常量引用接受参数。在线程 `t` 中（第 25 行）使用相同的函数会导致\
  \ GCC 6 生成超过 300 行的详尽编译错误：\n\n![详细的错误信息](img/SynchronisationPatterns----numberOfLinesPerConstReference.png)\n\
  \n错误信息中的重要部分是截图中间的红色文字：“error: use of deleted function”。类 `NonCopyableClass` 的拷贝构造函数是不可用的。\n\
  \n##### 引用引起的生命周期问题\n\n如果你的线程通过引用使用参数并将其脱离（detach），你必须极其小心。小型程序 `copiedValueLifetimeIssues.cpp`\
  \ 具有未定义行为。\n\n\n\n\n\n```cpp\n 1 // copiedValueLifetimeIssues.cpp\n 2 \n 3 #include\
  \ <iostream>\n 4 #include <string>\n 5 #include <thread>\n 6 \n 7 void executeTwoThreads(){\n\
  \ 8     \n 9     const std::string localString(\"local string\");\n10     \n11 \
  \    std::thread t1([localString]{\n12         std::cout << \"Per Copy: \" << localString\
  \ << std::endl;\n13     });\n14     \n15      std::thread t2([&localString]{\n16\
  \         std::cout << \"Per Reference: \" << localString << std::endl;\n17    \
  \ });\n18     \n19     t1.detach();\n20     t2.detach();\n21 }\n22     \n23 using\
  \ namespace std::chrono_literals;\n24 \n25 int main(){\n26     \n27     std::cout\
  \ << std::endl;\n28     \n29     executeTwoThreads();\n30     \n31     std::this_thread::sleep_for(1s);\n\
  32     \n33     std::cout << std::endl;\n34     \n35 }\n```\n\n# 引用的生命周期问题\n\n`executeTwoThreads`（第\
  \ 7-21 行）启动了两个线程。两个线程都已分离（第 19 和 20 行）并打印局部变量 `localString`（第 9 行）。第一个线程通过拷贝捕获局部变量，第二个线程通过引用捕获局部变量。为了简单起见，在两种情况下我都使用\
  \ Lambda 函数来绑定参数。\n\n由于 `executeTwoThreads` 函数没有等待两个线程完成，线程 `t2` 引用的是局部字符串，而该字符串绑定到调用函数的生命周期上。这是未定义行为。有趣的是，在\
  \ GCC 6 中，最大优化的执行文件 `-O3` 似乎有效，而未优化的执行文件会崩溃。\n\n![引用的生命周期问题](img/SynchronisationPatterns----copiedValueLifetimeIssues.png)\n\
  \n## 引用的生命周期问题\n\n### 进一步信息\n\n* [Pattern-Oriented Software Architecture: A Pattern\
  \ Language for Distributed Computing](http://www.dre.vanderbilt.edu/~schmidt/POSA/POSA4/)\n\
  \n### 线程本地存储\n\n线程特定或线程本地存储（thread-local storage）允许多个线程通过全局访问点使用本地存储。通过使用 `thread_local`\
  \ 存储说明符，变量变为线程局部变量。这意味着你可以在没有同步的情况下线程局部变量。\n\n这是一个典型的用例。假设你想计算向量 `randValues` 中所有元素的和。使用基于范围的\
  \ for 循环来完成它可以是直接的。\n\n```cpp\n// calculateWithLoop.cpp\n\n... \n\nunsigned long\
  \ long sum = {};\nfor (auto n: randValues) sum += n;\n```\n\n但你的 PC 有四个核心。因此，你将顺序执行程序转换为并发程序。\n\
  \n```cpp\n// threadLocalSummation.cpp\n\n...\n\nthread_local unsigned long long\
  \ tmpSum = 0;\n\nvoid sumUp(std::atomic<unsigned long long>& sum, const std::vector<int>&\
  \ val, \n           unsigned long long beg, unsigned long long end){\n    for (auto\
  \ i = beg; i < end; ++i){\n        tmpSum += val[i];\n    }\n    sum.fetch_add(tmpSum,\
  \ std::memory_order_relaxed);\n}\n\n... \n\nstd::atomic<unsigned long long> sum{};\
  \ \n\nstd::thread t1(sumUp, std::ref(sum), std::ref(randValues), 0, fir);\nstd::thread\
  \ t2(sumUp, std::ref(sum), std::ref(randValues), fir, sec);\nstd::thread t3(sumUp,\
  \ std::ref(sum), std::ref(randValues), sec, thi);\nstd::thread t4(sumUp, std::ref(sum),\
  \ std::ref(randValues), thi, fou);\n```\n\n你将基于范围的 for 循环放入一个函数中，让每个线程在线程局部变量 `tmpSum`\
  \ 中计算和的分之一。`sum.fetch_add(tmpSum, std::memory_order_relaxed)` 行最终将原子 `sum` 中的所有值相加。\n\
  \n我已经在章节 计算向量之和 中讨论过求和向量所有元素的各种方法。你可以学习整个程序……\n\n### 进一步信息\n\n* [ValueObject](https://martinfowler.com/bliki/ValueObject.html)\n\
  \n* [Pattern-Oriented Software Architecture: Patterns for Concurrent and Networked\
  \ Objects](https://www.dre.vanderbilt.edu/~schmidt/POSA/POSA2/)\n\n### 未来\n\nC++11\
  \ 提供了三种口味的 futures 和 promise：`std::async`、`std::packaged_task` 以及 `std::promise`\
  \ 和 `std::future` 对。promise 一词可以追溯到 70 年代。future 是一个只读占位符，用于存放由可写 promise 设置的值。从同步的角度来看，promise/future\
  \ 对的属性属性是它们两者都通过一个受保护的数据通道连接在一起。\n\n在实现 future 时需要做出一些决策。\n\n* future 可以隐式或显式地通过\
  \ `get` 调用请求其值，例如在 C++ 中。\n\n* future 可以尽早地或惰性地启动计算。如果你使用 `std::async`，会创建一个新线程并立即启动。而使用\
  \ `std::launch::deferred`，则由系统启动任务。\n\n```cpp\nauto lazyEager = std::async([]{ return\
  \ \"Eager\"; });\nauto lazy = std::async(std::launch::deferred, []{ return \"Lazy\"\
  ; });\nauto eager = std::async(std::launch::async, []{ return \"Eager\"; });\n\n\
  lazyEager.get();\nlazy.get();\neager.get();\n```\n\n* 如果值可用，future 可以阻塞或抛出异常。此外，你可以带有超时进行等待（`wait_for`\
  \ 和 `wait_until`）。\n\n* 实现 future 有多种方式：[协程](https://en.wikipedia.org/wiki/Coroutine)、[生成器](https://en.wikipedia.org/wiki/Generator_(programming)))\
  \ 或[通道](https://en.wikipedia.org/wiki/Channel_(programming))。\n\n### 进一步信息\n\n*\
  \ [Futures and promises](https://en.wikipedia.org/wiki/Futures_and_promises)\n\n\
  ## 处理变异\n\n如果不并发地读写数据，就不会发生数据竞态。实现此点的简单方法是使用不可变值。除了这种最佳实践，还有两种典型的策略。首先，通过锁来保护[临界区]，例如作用域锁或策略锁](#chap13.xhtml_chapterXXXStrategizedSSlockingSSSBOOPatternBCBC)。在面向对象的设计中，临界区通常是一个包含接口的对象。线程安全接口保护整个对象。其次，修改线程在完成工作后只需信号。这是保护挂起策略。\n\
  \n### 作用域锁\n\n作用域锁是应用于互斥锁的 RAII（资源获取初始化）概念。这种惯式的核心思想是将资源的获取和释放与对象的生命周期绑定。正如其名所示，对象的生命周期是有作用域的。作用域特别意味着\
  \ C++ 运行时负责调用对象的析构函数，从而释放资源。\n\n`ScopedLock` 类实现了作用域锁。\n\n\n\n\n\n```cpp\n 1 //\
  \ scopedLock.cpp\n 2 \n 3 #include <iostream>\n 4 #include <mutex>\n 5 #include\
  \ <new>\n 6 #include <string>\n 7 #include <utility>\n 8 \n 9 class ScopedLock{\n\
  10   private:\n11     std::mutex& mut;\n12   public:\n13     explicit ScopedLock(std::mutex&\
  \ m): mut(m){\n14         mut.lock();\n15         std::cout <<  \"Lock the mutex:\
  \ \" << &mut <<   std::endl;\n16     }\n17     ~ScopedLock(){\n18         std::cout\
  \ << \"Release the mutex: \" << &mut << std::endl;\n19         mut.unlock();\n20\
  \     }\n21 };\n22 \n23 int main(){\n24 \n25   std::cout << std::endl;\n26 \n27\
  \   std::mutex mutex1;\n28   ScopedLock scopedLock1{mutex1};\n29 \n30   std::cout\
  \ << \"\\nBefore local scope\" << std::endl;\n31   {\n32     std::mutex mutex2;\n\
  33     ScopedLock scopedLock2{mutex2};\n34   }\n35   std::cout << \"After local\
  \ scope\" << std::endl;\n36 \n37   std::cout << \"\\nBefore try-catch block\" <<\
  \ std::endl;\n38   try{\n39       std::mutex mutex3;\n40       ScopedLock scopedLock3{mutex3};\n\
  41       throw std::bad_alloc();\n42   }   \n43   catch (std::bad_alloc& e){\n44\
  \       std::cout << e.what();\n45   }\n46   std::cout << \"\\nAfter try-catch block\"\
  \ << std::endl;\n47 \n48   std::cout << std::endl;\n49 \n50 }\n```\n\n# 作用域锁 (Scoped\
  \ Locking)\n\n`ScopedLock` 通过引用获取互斥量（第 13 行）。互斥量在构造函数中锁定（第 15 行），并在析构函数中解锁（第 19\
  \ 行）。得益于 RAII 范式，对象的销毁以及互斥量的解锁会自动完成。\n\n![作用域锁的确定性析构](img/SynchronisationPatterns----scopedLock.png)\n\
  \n## 作用域锁的确定性析构\n\n`scopedLock1` 的作用域在 main 函数结束时结束。因此，`mutex1` 被解锁。第 34 行的 `mutex2`\
  \ 和第 42 行的 `mutex3` 也是如此。对于 `mutex3` 来说这意味着即使发生异常，`scopedLock3` 的析构函数也会调用。有趣的是，`mutex3`\
  \ 重复了 `mutex2` 的内存，因为两者的地址相同。\n\nC++17 支持四种变体锁。C++ 提供了 `std::lock_guard` / `std::scoped_lock`\
  \ 用于简单场景，并提供了 `std::unique_lock` / `std::shared_lock` 用于高级用例，例如显式地锁定或解锁互斥量。你可以在子节\
  \ 锁 中阅读所有细节。\n\n### 更多信息\n\n* [面向模式的软件架构：并发与网络对象的模式](https://www.dre.vanderbilt.edu/~schmidt/POSA/POSA2/)\n\
  \n# 策略锁 (Strategized Locking)\n\n想象一下，你正在编写一个库的代码，它应该被用于包括并发领域在内的各种领域。为了安全起见，你用锁\
  \ 保护了[临界区]。如果你的库现在运行在单线程环境中，你就会遇到性能问题，因为你实现了一个必要的昂贵同步机制。现在，策略锁来救你的急了。\n\n策略锁是将策略模式应用于锁的理念。这意味着，将你的锁定策略封装在一个对象中，并使其成为系统的一个可插拔组件。首先：什么是策略模式？\n\
  \n## 策略模式\n\n![策略模式](img/SynchronisationPatterns----StrategyPattern.png)\n\n###\
  \ 策略模式\n\n策略模式是书籍 [设计模式：可重用面向对象软件元素](https://en.wikipedia.org/wiki/Design_Patterns)\
  \ 中的经典行为模式之一。它也被称为策略（policy）。核心思想是定义一组算法，并将每个算法封装在一个对象中，使其成为一个可插拔组件。\n\n```cpp\n\
  \ 1 // strategy.cpp\n 2 \n 3 #include <iostream>\n 4 #include <memory>\n 5 \n 6\
  \ class Strategy {\n 7 public:\n 8     virtual void operator()() = 0;\n 9     virtual\
  \ ~Strategy() = default;\n10 };\n 11 \n12 class Context {\n13     std::shared_ptr<Strategy>\
  \ _strat;\n14 public:\n15     explicit Context() : _strat(nullptr) {}\n16     void\
  \ setStrategy(std::shared_ptr<Strategy> strat)  { _strat = strat; }\n17     void\
  \ strategy()  { if (_strat) (*_strat)(); }\n18 };\n19 \n20 class Strategy1 : public\
  \ Strategy {\n21     void operator()() override {\n22         std::cout << \"Foo\"\
  \ << std::endl;\n23     }\n24 };\n25 \n26 class Strategy2 : public Strategy {\n\
  27     void operator()() override {\n28         std::cout << \"Bar\" << std::endl;\n\
  29     }\n30 };\n31 \n32 class Strategy3 : public Strategy {\n33     void operator()()\
  \ override {\n34         std::cout << \"FooBar\" << std::endl;\n35     }\n36 };\n\
  37 \n38 int main() {\n39     \n40     std::cout << std::endl;\n41     Context con;\n\
  42     \n43     con.setStrategy(std::shared_ptr<Strategy>(new Strategy1));\n44 \
  \    con.strategy();\n45 \n46     con.setStrategy(std::shared_ptr<Strategy>(new\
  \ Strategy2));\n47     con.strategy();\n48 \n49     con.setStrategy(std::shared_ptr<Strategy>(new\
  \ Strategy3));\n50     con.strategy();\n51     \n52     std::cout << std::endl;\n\
  53 }\n```\n\n### 策略应用\n\n### 实现\n\n实现策略锁有两种典型的实现方式：运行时多态（面向对象）或编译时多态（模板）。这两种实现方式各有优劣。\n\
  \n*   优点：\n    *   运行时多态：\n        *   允许在运行时配置锁定策略。\n        *   对于具有面向对象背景的开发者来说更容易理解。\n\
  \    *   编译时多态：\n        *   没有抽象开销。\n        *   具有平坦的层次结构。\n*   缺点：\n    *   运行时多态：\n\
  \        *   需要额外的指针间接。\n        *   可能会有深层派生层次结构。\n    *   编译时多态：\n        *  \
  \ 在错误情况下可能会生成非常冗长的信息。\n\n在这些理论讨论之后，我两种变体实现了策略锁。在我的示例中，策略锁支持锁定、互斥锁和共享锁。为了简单起见，我在内部使用了已有的互斥量。此外，策略锁模拟了作用域锁。\n\
  \n#### 运行时多态\n\n程序 `strategizedLockingRuntime.cpp` 展示了三个不同的互斥量。\n\n\n\n\n\n```cpp\n\
