  \   });\n47     \n48     std::thread t2([]{\n49         Critical crit;\n50     \
  \    crit.interface2();\n51         crit.interface1();\n52     });\n53     \n54\
  \     Critical crit;\n55     crit.interface1();\n56     crit.interface2();\n57 \
