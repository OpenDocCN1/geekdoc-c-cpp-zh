    # Early praise for Deliver Audacious Web Apps with Ember 2


    Deliver Audacious Web Apps with Ember 2 provides a clear and thorough introduction
    to the powerful and elegant Ember framework. Developers looking to learn Ember
    or level up their Ember skills should read this book.


    | → | Nell Shamrell-Harrington |

    | | Software development engineer, Chef |


    Ember brought back the fun of Rails, this time for single-page applications with
    great performance.


    | → | Federico Tomassetti |

    | | Software engineer |


    If you’re considering Ember for your next JavaScript project, buy this book. I
    felt like I’d leveled up after every chapter.


    | → | Stephen Orr |

    | | Senior software engineer, Impact Applications |


    # Acknowledgments


    Every book is the result of a lot of behind-the-scenes effort, particularly if
    that book was written by a first-time author. The following people were very helpful
    to me in creating this book.


    To the Ember core team and the Ember community: Thank you for making a product
    that was fun to learn and to write about. The web is better off because you volunteered
    your time. Thank you!


    To my technical reviewers, Alessandro Bahgat, Jacob Chae, Javier Collado, Jeremy
    Frens, Kenneth Geisshirt, Alexander Henry, Eric Hung, Jan Nonnen, Stephen Orr,
    Shreerang Patwardhan, Martijn Reuvers, Brian Schau, Nell Shamrell-Harrington,
    Tibor Simic, Charley Stran, Federico Tomassetti, Paul Waring, Nick Watts, and
    Stephen Wolff: Thank you for lending your time and expertise to this project.
    Your comments made this a much better book than I would have written alone.

