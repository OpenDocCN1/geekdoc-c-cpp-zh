    每个用户界面都由不同的控件组组成，例如菜单、表格或表单，这些组可以自然地划分为模板（或我们接下来将看到的组件）。在开发 Ember 程序时，一个良好的设计步骤是查看你计划中的用户界面，并在相关的控件组周围画出边界。一旦你定义了可以用一个数据模型表示的控件组，你就拥有了一个模板！让我们来看看具体是如何创建模板的。


    ## 创建模板


    当你在使用 `Ember CLI` 创建一个路由（route）时，系统会为你创建一个模板，供你在该路由内使用。如果你使用了 `--pod` 标记，新路由的模板将位于该路由的目录下，并命名为
    `template.hbs`。否则，它位于 `templates` 目录，并命名为 `myroute.hbs`，其中“myroute”是你定义的路由名称。决定何时使用
    `--pod` 标记主要出于对项目组织结构的考量，你应该根据符合自己逻辑的方式做决定。我更倾向于将相关的模板和路由放在同一个目录下，因此我选择使用 `--pod`
    标记。


    当 `Ember CLI` 以这种方式创建新模板时，它在模板中添加的唯一内容是用于子路由的 `{{outlet}}` 表达式。剩下的部分由你来添加！让我们来看另一个更有趣的模板：笔记本（notebooks）模板：


    | [ch3/ember-note/app/notebooks/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch3/ember-note/app/notebooks/template.hbs)
    |

    | ​  | |<div></div> |

    | ​  | |<div class="col-md-3"></div> |

    | ​  | |<div>Notebooks</div></div> |

    | ​  | |<div> |

    | ​  | |title: {{input value=title}} |

    | ​  | |<button {{action ''addNotebook''}}>Add</button> |

    | ​  | |</div></div> |

    | ​  | |<div></div> |

    | ​  | |<<ul>> |

    | ​  | |{{#each model as |notebook|}} |

    | ​  | |{{#link-to ''notebooks.notes'' notebook.id}} |

    | ​  | |<li>{{notebook.title}}</li> |

    | ​  | |{{/link-to}} |

    | ​  | |{{else}} |

    | ​  | |<div>No notebooks found</div> |

    | ​  | |{{/each}} |

    | ​  | |</ul></div> |

    | ​  | |</div></div> |

    | ​  | |</div> |

    | ​  | |<div class="col-md-9"></div> |

    | ​  | |{{outlet}} |

    | ​  | |</div></div> |

    | ​  | |</div> |


    在模板中，你会看到 HTML 和 Handlebars 表达式（即任何双大括号内的内容）的混合体。这段特定的代码包含了一些用于结构的 HTML 标签，但最有趣的是
    Handlebars 表达式。现在让我们来看一个非常重要的表达式。


    ## 将模板关联在一起


    该模板中的一个 Handlebars 表达式是 `{{#each}}`。它代表了一个基础的循环结构。回想一下，每个模板都仅绑定到一个路由和一个控制器（controller）。路由的作用之一是为其关联的模板提供数据。这里路由为笔记本模板提供了一个从零到多个笔记本对象的列表。`{{#each}}`
    表达式会对每个笔记本对象进行求值。如果路由提供了一个空列表，表达式的 `{{else}}` 部分将被执行，页面将向用户显示“No notebooks found”。


    随后，列表中的每个笔记本对象都会执行以下代码块：


    | ​  | |<div> |

    | ​  | |{{#link-to ''notebooks.notes'' notebook.id}} |

    | ​  | |{{notebook.title}}{{/link-to}} |

    | ​  | |</div> |


    这是一个 `{{link-to}}` 表达式。在运行时，这个 `{{#link-to}}` 代码段会被求值为大致如下 HTML：


    | ​  | |<a id="ember100" class="ember-view" href="notebooks/10/notes/1">Notebook</a>
    |


    让我们拆解这个链接。`{{#link-to}}` 表达式会生成一个路由，包括每个必要的路径段。在这种情况下，我们已经处于 notebooks 路由，并且已经为一个
    id 值为“10”的用户加载了它。我们正尝试从那里导航到 notes 子路由，并带上 id 为“1”的笔记本。


    虽然这段 HTML 有趣，但最重要的是 Ember 如何使用这个链接。当你点击链接时，Ember 会将当前 URL 更新为 `http://localhost:4200/notebooks/1/notes/1`（数字可能会略有不同，但其他段落应该是相同的）。Ember
    将笔记本的模板渲染到应用程序模板中的 `{{outlet}}` 中，并将 notes 模板渲染到笔记本模板中的 `{{outlet}}` 中。然后你可以为
    notes 路由添加子路由，依此类推。


    下面的图插说明了 URL 段与嵌套模板之间的关系。


    ![images/route-diagram-1.png](img/route-diagram-1.png)


    URL 与应用中具体位置（包括已加载的数据）之间的关系是 Ember 的杀手级功能之一。当这样使用时，URL 变为了用户当前位置（用户在应用的哪个部分）以及当前加载数据（显示的是哪条记录）的完整表示。生成的
    URL 在加载时将始终显示相同的信息，这使得于分享。


    在开发真实世界的应用时，你的目标是以符合逻辑的方式向用户展示信息。这些信息几乎总是在数据项之间存在关系，而这些关系会导致层级结构。为了显示分级数据，你的用户界面将具有屏幕或小组件的层级。在
    Ember 中，这些屏幕或小组件是由模板封装的。因此，虽然模板几乎是一个独立的功能单元，但你还需要根据与其相邻模板的关系来考虑它。


    按层级结构排列模板并使用 URL 捕应用状态的能力是 Ember 最有用的功能之一。但关于模板，还有很多对开发者非常有用的信息。接下来，让我们来看看如何使用
    Handlebars 表达式来渲染某些控件。


    ## 使用表达式渲染控件


    到为止，我们一直使用原生控件来演示 Ember 的模板系统。但 Handlebars 表达式语言和 Ember 的辅助类能够渲染丰富得的内容。在本节中，我们将介绍
    Ember 中最常用的控件。我们将从如何显示静态数据开始，然后讨论条件判断和循环。最后我们将访问输入控件，并以链接结束。


