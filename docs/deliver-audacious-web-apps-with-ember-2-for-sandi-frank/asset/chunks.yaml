    controller. The value may be bound or unbound. If it’s bound, it won’t need quotes;
    if it’s unbound, you provide the exact string you want to set into the value of
    the field, within quotes.


    The action property is bound to the Return key press event. When Return is pressed,
    the named action is called. A number of other user events may be bound by setting
    the name of the event to an action (for example, enter="actionName"). They are
    as follows:


    *   enter


    *   escape-press


    *   focus-in


    *   focus-out


    *   insert-newline


    *   key-press


    By providing an action for each of these user events, you trigger actions within
    your controller or route, which can be used to load data, execute validation,
    or write to persistent storage. In the next section we’ll see how to assign an
    action to a generic HTML element. But let’s spend a bit more time on the {{input}}
    expression first.


    The {{input}} expression can also be used to render a check box by setting the
    type to checkbox. Similar to the text type, there are a number configurable properties:


    *   autofocus


    *   checked


    *   disabled


    *   form


    *   indeterminate


    *   name


    *   tabindex


