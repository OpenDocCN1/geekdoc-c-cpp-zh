    If that’s something like what you’re seeing, congratulations! You’ve completed
    your first step in learning Ember. Have a drink, take a walk, or just relax how
    you see fit.


    Ember Addon: Ember CLI Mirage


    You can see that we jumped through a few hoops to get a back end working with
    Ember CLI. Ember CLI’s HTTP Mocks are a great way to serve up data using a mock
    server, but I want to mention one other alternative called Ember CLI Mirage.


    Ember CLI Mirage is an Ember addon that accomplishes many of the same goals as
    Ember CLI’s HTTP Mocks, but does so entirely client-side (that is, without requiring
    you to stand up a Node server to serve mock data). An Ember addon is a packaged
    piece of code that a community member has shared and published to a repository,
    generally npm, for use by the broader community.


    Ember CLI Mirage allows you to create mock data services that run in your browser
    or in your continuous integration environment. This enables your test classes
    to test your model layer without requiring an existing back-end server, even a
    mock one.


    Throughout the book I’ll mention Ember addons that are worth looking into. Often
    these will represent an alternative way of performing a task we discussed in the
    book, or a more mature way of performing a task we performed in a simple way.
    I make no claims as to whether or not these addons are production-grade. At a
    minimum, they should be useful for helping you to further explore the Ember ecosystem
    and to use as a tool for additional learning, as all are open source. We’ll cover
    addons in their own chapter in Chapter 9, [​*Building and Using Ember Addons*​](#f_0060.html_addons).


    For the complete documentation on how to use Ember CLI Mirage, take a look at
    [http://www.ember-cli-mirage.com](http://www.ember-cli-mirage.com).


    ## Next Steps


    We covered a large number of ideas in this first chapter. You’ve seen a small
    example of each of the major classes in Ember and written a sample application
    that makes use of a data-aware service. Still, there’s a lot more to Ember than
    what we’ve covered, and you have a lot left to learn before we’re done. Our next
    step is to begin to build the user interface, first by digging deeper into routes.


