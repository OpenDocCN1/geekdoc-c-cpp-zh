  trans: "\n\n```javascript\ntest('it counts notes', function(assert) {\n  var notebook\
    \ = this.subject({ title: 'my notebook' });\n  var note;\n  var noteCount = Math.floor(Math.random()\
    \ * (10 - 1) + 1);\n\n  Ember.run(() => {\n    for(var i = 0; i < noteCount; i++)\
    \ {\n      note = this.store().createRecord('note');\n      notebook.get('notes').addObject(note);\n\
    \    }\n  });\n\n  assert.equal(notebook.noteCount(),noteCount);\n});\n```\n\n\
    首先，我们需要修改导入项以包含 `Ember` 类。（稍后我们就会看到原因。）完成后，我们在文件末尾添加了一个新测试，描述为“it counts notes（它能计算笔记数量）”。这些描述将被测试运行器使用，用于告诉你它正在运行哪项测试。\n\
    \n接下来，我们将进行一些设置工作。调用 `this.subject()` 会创建一个 `notebook` 类的实例，我们将用它进行测试。然后，我们将初始化一个名为\
    \ `note` 的变量，并向其中填充笔记实例。我们还会创建一个 1 到 10 之间的随机数，以测试是否向笔记本添加了正确数量的笔记实例。\n\n这里我们将使用之前导入的\
    \ `Ember` 实例。由于我们即将执行的工作是异步的且带有副作用的，测试运行器要求我们自己在自己的运行循环（run loop）中执行这些工作。在运行循环内部，我们将使用之前的随机数生成预期的笔记实例数量，然后将它们添加到笔记本中。\n\
    \n到此时，你可能不确定何时该使用 `Ember.run`，何时不该使用。请放心，测试运行器非常清楚某个测试无法运行的原因，并提供错误消息指示你的代码需要\
    \ `Ember.run`。除此之外，关于 `Ember.run` 的细节主要在你开发 `Ember` 本身而不是使用 `Ember` 时才相关。\n\n\
    完成设置工作后，我们将通过断言 `noteCount` 方法返回的记录数量（即之前声明的随机数）来运行实际测试。我们的测试应该会通过，这样我们就可以少一个需要担心的方法，可以睡得安稳一点了。\n\
    \n### 随机数生成\n\n| | |\n| --- --- |\n| ![images/aside-icons/warning.png](img/warning.png)\
    \ | 如果涉及安全性，随机数生成是一个危险领域。我们之前使用的 `Math.random` 函数在我们用法下是没问题的，但你不应该将其用于任何对安全性有要求的场景，例如为双重身份验证或验证码生成随机值，因为\
    \ `Math.random` 的输出不是真正的随机。在这种情况下，最好使用 `RandomSource.getRandomValues()` 函数，该函数在\
    \ Mozilla Developer Network 上有文档：[`developer.mozilla.org/en-US/docs/Web/API/RandomSource/getRandomValues`](https://developer.mozilla.org/en-US/docs/Web/API/RandomSource/getRandomValues)。\
    \ |\n\n现在，让我们来看看如何对组件进行单元测试。\n\n#### 组件的单元测试\n\n正如我之前提到的，我们希望将单元测试集中在尚未被框架测试的代码上。另一个判断一个类是否适合进行单元测试的标准是，它是否依赖于难以模拟的外部依赖（例如\
    \ `Ember Data` 存储）。我们的 `edit-note` 组件目前有两个动作：`saveNote` 和 `closeNote`。让我们快速回顾一下该类：\n\
    \n`ch8/ember-note/app/components/edit-note/component.js` (http://media.pragprog.com/titles/mwjsember/code/ch8/ember-note/app/components/edit-note/component.js)\n\
    \n```javascript\nimport Ember from 'ember';\n\nexport default Ember.Component.extend({\n\
    \  actions: {\n    saveNote: function() {\n      this.get('note').save();\n  \
    \  },\n    closeNote: function() {\n      this.sendAction('close');\n    }\n \
    \ }\n});\n```\n\n在后台，`saveNote` 正在调用存储来保存数据，因此此方法将需要依赖验收测试。尽管如此，我们仍然可以在某种程度上对其进行单元测试。单元测试更好的候选对象是\
    \ `closeNote` 动作，它只是将动作引用到传递给组件的类。这个类可以很容易被模拟。\n\n让我们对 `edit-note` 模板进行细微调整。为每个按钮添加一个\
    \ `id` 参数，如下所示：\n\n`ch8/ember-note/app/components/edit-note/template.hbs` (http://media.pragprog.com/titles/mwjsember/code/ch8/ember-note/app/components/edit-note/template.hbs)\n\
    \n```html\n<div>\n  <input value=title>\n  <button id=\"save\" action=\"saveNote\"\
    >Save</button>\n  <button id=\"close\" action=\"closeNote\">Close</button>\n</div>\n\
    <div>\n  <textarea rows=10 cols=60 value=body></textarea>\n</div>\n```\n\n你稍后就会明白我们添加了这些内容。让我们通过回顾该类并添加几个测试，来看看如何为该组件编写测试：\n\
    \n`ch8/ember-note/tests/components/edit-note/test.js`\n\n```javascript\nimport\
    \ { moduleForComponent, test } from 'ember-qunit';\nimport Ember from 'ember';\n\
    \nmoduleForComponent('edit-note', {\n  needs: ['component:markdown-html']\n});\n\
    \ntest('it renders', function(assert) {\n  assert.expect(2);\n  // 创建组件实例\n  var\
    \ component = this.subject();\n  assert.equal(component._state, 'preRender');\n\
    \  // 将组件渲染到页面\n  this.render();\n  assert.equal(component._state, 'inDOM');\n\
    });\n\ntest('it saves', function(assert) {\n  var component = this.subject();\n\
    \  this.render();\n  var saveTarget = {\n    save: function() {\n      assert.ok(true,\
    \ 'saved the note');\n    }\n  };\n  Ember.run(() => {\n    component.set('note',\
    \ saveTarget);\n  });\n  this.$().find('#save').click();\n});\n\ntest('it closes',\
    \ function(assert) {\n  var component = this.subject();\n  this.render();\n  var\
    \ closeTarget = {\n    closeAction: function() {\n      assert.ok(true, 'closed\
    \ the window');\n    }\n  };\n  component.set('close', 'closeAction');\n  component.set('targetObject',\
    \ closeTarget);\n  this.$().find('#close').click();\n});\n```\n\n我们再次添加了 `Ember`\
    \ 类，因为我们将在其中一个测试中使用用到运行循环。在 `moduleForComponent` 中，我们添加了对 `markdown-html` 插件的依赖，以便测试框架知道在渲染\
    \ `edit-note` 组件时使用该类。\n\n“it renders”测试是 Ember CLI 的组件测试样板代码。我们没有对其进行修改。\n\n"
- fmt: "\nOur first test is the “it saves” test. As we’ve seen in our model test,\
    \ the first task of this test is to create an instance of the object to be tested.\
    \ We then render it to the “screen.” Once that setup work is performed, we create\
    \ a mock object to act in the role of a note model. This mock object needs to\
    \ contain just one method: the `save` method. In this case, because we want to\
    \ verify that this method is properly called by the component, we put our assertion\
    \ in this method. If the method is called, the referenced message will be printed\
    \ and the test will pass.\n\nWith our mock object created, we use the `Ember.run`\
    \ method to wrap the `component.set` action, since the re-render caused by the\
    \ model change will happen asynchronously and have side effects (namely, updating\
    \ the DOM). Then, we force a click action on the named button object. This causes\
    \ the component’s `saveNote` action to fire, which is supposed to run the `save`\
    \ function on the mock object. Because it does, our test passes.\n\nThe “it closes”\
    \ test is rather similar. We get a component instance, render it, and create a\
    \ mock object that contains the method we want to run. The significant difference\
    \ is in how we link up the test objects.\n\nBecause our assignments have no side\
    \ effects, we’re able to run them without using the `Ember.run` loop. We set the\
    \ value of the template’s `close` parameter to the function we plan to run from\
    \ the mock object, and set `targetObject` to our mock object. In a running app,\
    \ the route that includes this component plays the role of the target. Because\
    \ the `closeNote` action uses `sendAction` to do its work, the click in our test\
    \ calls out to our `closeAction` in the mock object, and our test passes.\n\n\
    Of course, your components may have different custom code that requires testing.\
    \ These two examples are good for some component-specific features, such as confirming\
    \ that the component properly handles the passed-in model and confirming that\
    \ it properly handles referred actions.\n\nAs I mentioned earlier, unit tests\
    \ are best for testing features that don’t have a lot of interaction with app-wide\
    \ code or require complicated mocks. The primary type of object we haven’t covered\
    \ yet is routes. The reason we won’t spend much time on unit testing routes is\
    \ that they have a great deal of interaction with app-wide code. As such, they\
    \ are much better candidates for acceptance testing than unit testing.\n\nYou’re\
    \ likely to write a number of unit tests that address object types besides models\
    \ or components. While the details will vary by implementation, the ideas will\
    \ be the same. Start with the test blueprint that `Ember CLI` creates and add\
    \ to it as needed to confirm the behavior you’ve added to your classes as you\
    \ go.\n\nUnit testing is great for working at a low level, but at some point you’ll\
    \ want to be able to test a more complete cycle of behavior. For that, you have\
    \ acceptance testing, which we’ll take a look next.\n\n### Writing Acceptance\
    \ Tests\n\nAcceptance tests are used to test a sequence of events through the\
    \ application to ensure that the correct result is achieved. It’s a good way to\
    \ work your way through a set of screens and give them a spin. Due to this, they\
    \ require a bit more work on our end to get up and running, but they are a powerful\
    \ way to confirm functionality and even detect regressions as you’re adding code.\n\
    \nIn our case, we’ll work through a relatively small example. We’re going to write\
    \ an acceptance test to confirm that our register route is properly registering\
    \ valid users. We’ll create a test that starts the app, navigates to the register\
    \ route, fills out the field and clicks the button, and then confirms that the\
    \ correct message is displayed.\n\nBecause acceptance tests are so tailored to\
    \ your app, they aren’t generated by `Ember CLI` as you go along. To start the\
    \ acceptance test, run the following command from your project root:\n\n```bash\n\
    $ ember generate acceptance-test register\n```\n\nThis command creates a boilerplate\
    \ acceptance test for the route named in the command. Let’s go ahead and modify\
    \ it to look like the following:\n\n```javascript\nimport Ember from 'ember';\n\
    import { module, test } from 'qunit';\nimport startApp from 'ember-note/tests/helpers/start-app';\n\
    \nvar application;\n\nmodule('Acceptance | register', {\n  beforeEach: function()\
    \ {\n    application = startApp();\n  },\n\n  afterEach: function() {\n    Ember.run(application,\
    \ 'destroy');\n  }\n});\n\ntest('visiting /register', function(assert) {\n  visit('/register');\n\
    \n  fillIn('#name', 'test@pragprog.com');\n  click('#register');\n\n  andThen(function()\
    \ {\n    assert.equal(find('#message').trim(), 'A user with test@pragprog.com\
    \ was added!');\n    assert.equal(currentURL(), '/register');\n  });\n});\n```\n\
    \nWe’re going to rely on some attributes again, so update the template to look\
    \ like this (with id for the input, button, and message):\n\n```handlebars\n<div\
    \ class=\"col-12\">\n  <input id=\"name\" value={{name}}>\n  <button id=\"register\"\
    \ {{action \"addNew\"}}>Add User</button>\n</div>\n<div id=\"message\" class=\"\
    col-12\">\n  {{message}}\n</div>\n```\n"
  raw: 'Our first test is the “it saves” test. As we’ve seen in our model test, the
    first task of this test is to create an instance of the object to be tested. We
    then render it to the “screen.” Once that setup work is performed, we create a
    mock object to act in the role of a note model. This mock object needs to contain
    just one method: the save method. In this case, because we want to verify that
    this method is properly called by the component, we put our assertion in this
    method. If the method is called, the referenced message will be printed and the
    test will pass.


    With our mock object created, we use the Ember.run method to wrap the component.set
    action, since the re-render caused by the model change will happen asynchronously
    and have side effects (namely, updating the DOM). Then, we force a click action
    on the named button object. This causes the component’s saveNote action to fire,
    which is supposed to run the save function on the mock object. Because it does,
    our test passes.


    The “it closes” test is rather similar. We get a component instance, render it,
    and create a mock object that contains the method we want to run. The significant
    difference is in how we link up the test objects.


    Because our assignments have no side effects, we’re able to run them without using
    the Ember.run loop. We set the value of the template’s close parameter to the
    function we plan to run from the mock object, and set targetObject to our mock
    object. In a running app, the route that includes this component plays the role
    of the target. Because the closeNote action uses sendAction to do its work, the
    click in our test calls out to our closeAction in the mock object, and our test
    passes.


    Of course, your components may have different custom code that requires testing.
    These two examples are good for some component-specific features, such as confirming
    that the component properly handles the passed-in model and confirming that it
    properly handles referred actions.


    As I mentioned earlier, unit tests are best for testing features that don’t have
    a lot of interaction with app-wide code or require complicated mocks. The primary
    type of object we haven’t covered yet is routes. The reason we won’t spend much
    time on unit testing routes is that they have a great deal of interaction with
    app-wide code. As such, they are much better candidates for acceptance testing
    than unit testing.


    You’re likely to write a number of unit tests that address object types besides
    models or components. While the details will vary by implementation, the ideas
    will be the same. Start with the test blueprint that Ember CLI creates and add
    to it as needed to confirm the behavior you’ve added to your classes as you go.


    Unit testing is great for working at a low level, but at some point you’ll want
    to be able to test a more complete cycle of behavior. For that, you have acceptance
    testing, which we’ll take a look at next.


    ### Writing Acceptance Tests


    Acceptance tests are used to test a sequence of events through the application
    to ensure that the correct result is achieved. It’s a good way to work your way
    through a set of screens and give them a spin. Due to this, they require a bit
    more work on our end to get up and running, but they are a powerful way to confirm
    functionality and even detect regressions as you’re adding code.


    In our case, we’ll work through a relatively small example. We’re going to write
    an acceptance test to confirm that our register route is properly registering
    valid users. We’ll create a test that starts the app, navigates to the register
    route, fills out the field and clicks the button, and then confirms that the correct
    message is displayed.


    Because acceptance tests are so tailored to your app, they aren’t generated by
    Ember CLI as you go along. To start the acceptance test, run the following command
    from your project root:


    | ​  | $ ember generate acceptance-test register |


    This command creates a boilerplate acceptance test for the route named in the
    command. Let’s go ahead and modify it to look like the following:


    | [ch8/ember-note/tests/acceptance/register-test.js](http://media.pragprog.com/titles/mwjsember/code/ch8/ember-note/tests/acceptance/register-test.js)
    |


    | ​  | ​**import**​ Ember from ​*''ember''*​; |


    | ​  | ​**import**​ { module, test } from ​*''qunit''*​; |


    | ​  | ​**import**​ startApp from ​*''ember-note/tests/helpers/start-app''*​;
    |


    | ​  |  |


    | ​  | ​**var**​ application; |


    | ​  |  |


    | ​  | module(​*''Acceptance &#124; register''*​, { |


    | ​  | beforeEach: ​**function**​() { |


    | ​  | application = startApp(); |


    | ​  | }, |


    | ​  |  |


    | ​  | afterEach: ​**function**​() { |


    | ​  | Ember.run(application, ​*''destroy''*​); |


    | ​  | } |


    | ​  | }); |


    | ​  |  |


    | ​  | test(​*''visiting /register''*​, ​**function**​(assert) { |


    | ​  | visit(​*''/register''*​); |


    | ​  |  |


    | ​  | fillIn(​*''#name''*​,​*''test@pragprog.com''*​); |


    | ​  | click(​*''#register''*​); |


    | ​  |  |


    | ​  | andThen(​**function**​() { |


    | ​  | assert.equal(find(​*''#message''*​).text().trim(), |


    | ​  | ​*''A new user with the name "test@pragprog.com" was added!''*​); |


    | ​  | assert.equal(currentURL(), ​*''/register''*​); |


    | ​  | }); |


    | ​  | }); |


    We’re going to rely on some id attributes again, so update the register template
    to look like this (with id attributes for the input, button, and message div):


    | [ch8/ember-note/app/register/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch8/ember-note/app/register/template.hbs)
    |


    | ​  | ​**<div**​ class=​*"col-md-12"*​​**>**​ |


    | ​  | Register new user: {{input id=''name'' value=name}} |


    | ​  | ​**<button**​ id=​*''register''*​ {{action ''addNew''}}​**>**​Add​**</button>**​
    |


    | ​  | ​**</div>**​ |


    | ​  | ​**<div**​ id=​*''message''*​ class=​*"col-md-12"*​​**>**​ |


    | ​  | {{message}} |


    | ​  | ​**</div>**​ |


    This test looks a little different from the unit tests we’ve been writing. The
    first difference you’ll notice is that we’re actually creating an instance of
    the full application. We’ll need to do this in order to test cross-cutting features.
    beforeEach creates our app instance, and afterEach destroys it.


    Next, the first step in our actual test is to navigate to the chosen URL. Because
    we want to test that we can register successfully, we populate the name text field
    with our desired value, and then click the register button.


    Once we’ve clicked the button, we wrap our assertions in the andThen function,
    so we respect any asynchronous functions that came before. When it’s ready, the
    andThen block verifies that the correct message is displayed, and that we haven’t
    been redirected to another route.


    Acceptance tests and unit tests offer a good deal of coverage of your code. By
    relying on these as needed, you can do a lot to ensure that you capture bugs and
    don’t introduce new ones when code changes. Still, bugs will eventually get through,
    and that’s when you’ll need the Ember Inspector.


    ### Debugging with the Ember Inspector


    Try as we might, sometimes writing good tests just isn’t enough. There will be
    times when you’ll need to debug your application, and you won’t be able to do
    it just by looking at code running in your tests. Luckily, Ember has a special
    solution for you to use in just this case: the Ember Inspector.


    The Ember Inspector is a browser addon that helps you to debug your Ember app
    by giving you deep access into the app’s object model using Ember nomenclature.
    It’s available by searching for “ember inspector” in the Chrome Web Store^([[9]](#f_0059.html_FOOTNOTE-9))
    or via the Firefox Addons site.^([[10]](#f_0059.html_FOOTNOTE-10)) Go ahead and
    install into one of those browsers, then reload the app.


    Once you’ve installed the Ember Inspector, you can access it by opening the developer
    tools in your browser. The Inspector allows you to visualize the state of each
    of your Ember objects. If you set a breakpoint in your code, the Inspector will
    display the state of your application at that breakpoint.'
