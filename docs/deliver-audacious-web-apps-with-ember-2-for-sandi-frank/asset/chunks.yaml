  trans: "\n\n```javascript\n{\n  'notebooks': {\n    id: req.params.id\n  }\n});\n\
    \nnotebooksRouter.delete('/:id', function(req, res) {\n  res.status(204).end();\n\
    });\n\napp.use('/api/notebooks', notebooksRouter);\n};\n```\n\n我们还需要定义模型类。运行此命令来为\
    \ notebook 类型定义一个模型类：\n\n```bash\n$ ember generate model notebook\n```\n\n关于模型的后续后续会有更多内容。现在，请将以下代码添加到你的\
    \ `notebook.js` 文件（ch2/ember-note/app/models/notebook.js）中：\n\n```javascript\n\
    import DS from 'ember-data';\n\nexport default DS.Model.extend({\n  title: DS.attr('string'),\n\
    \  user: DS.belongsTo('user'),\n  notes: DS.hasMany('note')\n});\n```\n\n我们还将为\
    \ note 对象定义 mock 服务（模拟服务）和模型，notebook 正依赖于它。运行以下命令：\n\n```bash\n$ ember generate\
    \ http-mock notes\n```\n\n并使用此代码更新生成的服务（ch2/ember-note/server/mocks/notes.js）：\n\
    \n```javascript\nmodule.exports = function(app) {\n  var express = require('express');\n\
    \  var notesRouter = express.Router();\n  var bodyParser = require('body-parser');\n\
    \  app.use(bodyParser.json());\n  var nedb = require('nedb');\n  var noteDB =\
    \ new nedb({ filename: 'notes', autoload: true});\n\n  notesRouter.get('/', function(req,\
    \ res) {\n    noteDB.find(req.query).exec(function(error,notes) {\n      res.send({\n\
    \        'notes': notes\n      });\n    });\n  });\n\n  notesRouter.post('/',\
    \ function(req, res) {\n    noteDB.find({}).sort({id: -1}).limit(1).exec(function(err,notes)\
    \ {\n      if (notes.length != 0)\n        req.body.note.id = notes[0].id + 1;\n\
    \      else\n        req.body.note.id = 1;\n      noteDB.insert(req.body.note,function(err,newNote)\
    \ {\n        res.status(201);\n        res.send(\n          JSON.stringify(\n\
    \          {\n            note : newNote\n          }))\n        );\n      });\n\
    \    });\n  });\n\n  notesRouter.get('/:id', function(req, res) {\n    res.send({\n\
    \      'notes': {\n        id: req.params.id\n      }\n    });\n  });\n\n  notesRouter.put('/:id',\
    \ function(req, res) {\n    var id = parseInt(req.params.id);\n    noteDB.update({id:\
    \ id}, {$set: req.body.note},\n      function(err, numReplaced, newNotes) {\n\
    \        res.send({\n          'notes': {\n            id: id\n          }\n \
    \       });\n      }\n    );\n  });\n\n  notesRouter.delete('/:id', function(req,\
    \ res) {\n    var id = parseInt(req.params.id);\n    noteDB.remove({id: id},function(err,numRemoved)\
    \ {\n      res.status(204).end();\n    });\n  });\n\n  app.use('/api/notes', notesRouter);\n\
    };\n```\n\n现在运行此命令创建模型：\n\n```bash\n$ ember generate note\n```\n\n并按如下定义模型（ch2/ember-note/app/models/note.js）：\n\
    \n```javascript\nimport DS from 'ember-data';\n\nexport default DS.Model.extend({\n\
    \  title: DS.attr('string'),\n  body: DS.attr('string'),\n  notebook: DS.belongsTo('notebook')\n\
    });\n```\n\n如果你现在对模型有任何疑问，不要担心。我们将在第 5 章“数据建模”中讨论这些内容。随着 notebooks Web 服务的启动，我们准备好为\
    \ notebooks 路由创建模板了。正如你所学的，模板用于渲染路由的用户界面。在这种情况下，我们想要创建一个允许用户执行两件事的界面：(1) 创建一个新的\
    \ notebook，以及 (2) 显示现有 notebook 的列表。这里是你需要创建模板（ch2/ember-note/app/notebooks/template.hbs）：\n\
    \n```handlebars\n<div>\n  <div class=\"col-md-3\">\n    <div>Notebooks</div>\n\
    \    <div>\n      title: {{input value=title}}\n      <button {{action 'addNotebook'}}>Add</button>\n\
    \    </div>\n    <div>\n      <ul>\n        {{#each model as notebook}}\n    \
    \      {{#link-to 'notebooks.notes' notebook.id}}\n            <li>{{notebook.title}}</li>\n\
    \          {{/link-to}}\n        {{else}}\n          <div>No notebooks found</div>\n\
    \        {{/each}}\n      </ul>\n    </div>\n  </div>\n  <div class=\"col-md-9\"\
    >\n    {{outlet}}\n  </div>\n</div>\n```\n\n我现在暂时不会在模板代码上花费过多时间——我们将在下一章中进行更详细的讨论。我希望你注意的是，我们直接在模板中引用了模型。正如我在在本章开头提到的，在没有直接创建控制器类的情况下，我们可以依赖基础\
    \ `Ember.Controller` 类的默认功能。该类有一个 `model` 变量，默认情况下，它会调用路由的 `model` 钩子来填充该变量。\n\
    \n对于 notebooks 路由，Ember Data 查询返回零或多个行。在 `template.hbs` 文件中，引用的 `model` 是默认控制器包含的变量。为了获取变量中的数据，我们正在使用\
    \ `{{#each}}` 表达式，它遍历模型实例列表。控制器中的 `model` 变量可以包含单个模型实例或模型实例的数组。\n\n我们的模板在无序列表中显示\
    \ notebooks 的标题。我们稍后会深入探讨模板和表达式细节。现在，你的列表可能是空的。让我们看看如何使用 action 添加列表并刷新模板以显示它们。将此代码添加到\
    \ notebooks 路由的 actions 哈希函数中（ch2/ember-note/app/notebooks/route.js）：\n\n```javascript\n\
    addNotebook: function() {\n  var notebook = this.store.createRecord('notebook',\
    \ {\n    title: this.controller.get('title'),\n    user: this.controllerFor('application').get('user')\n\
    \  });\n  notebook.save().then(() => {\n    console.log('save successful');\n\
    \    this.controller.set('title',null);\n    this.refresh();\n  }, function()\
    \ {\n    console.log('save failed');\n  });\n}\n```\n\n"
- fmt: "\nWe’ve focused in this section on the parts of a `Route` implementation that\
    \ relate to displaying data. We’ve had to touch on a few other concepts as well,\
    \ such as templates and models, which we’ll cover in more detail later in the\
    \ book. Don’t worry if you don’t fully understand these right now. There’s a lot\
    \ more to discuss. What I hope you understand is how to use path segments, the\
    \ model hook, and the related navigation functions like `transitionTo` to work\
    \ with data. The rest of this chapter will focus largely on navigation between\
    \ routes, and on creating a hierarchy of routes in your application. We’ll start\
    \ there by adding the first route that will be a child to the routes we’ve created:\
    \ the note route.\n\n## Nest Routes\n\nSo far we’ve only added routes that sit\
    \ one level below the application route. Let’s get a bit further into the weeds\
    \ and add a child route of a child route, also known as a nested route. Run this\
    \ command:\n\n```bash\n$ ember generate route notebooks/notes --pod\n```\n\nThis\
    \ route will be used to display all notes that are part of a given notebook. As\
    \ you might expect, the previous command created a new entry in the Router. I’ve\
    \ added the following path segment information to `app/router.js`:\n\n```javascript\n\
    this.route(\"notebooks\", { path: \"notebooks/:user_id\" }, function() {\n  this.route(\"\
    notes\", { path: \"notes/:notebook_id\" }, function() {});\n});\n```\n\nDefine\
    \ the route class by updating it to look like the following (we’ll need this later).\n\
    \n```javascript\n// ch2/ember-note/app/notebooks/notes/route.js\nimport Ember\
    \ from 'ember';\n\nexport default Ember.Route.extend({\n  model: function(params)\
    \ {\n    return this.store.query('note', {notebook:params.notebook_id});\n  },\n\
    \  actions: {\n    addNote: function() {\n      this.store.findRecord('notebook',\n\
    \      this.paramsFor('notebooks.notes').notebook_id).then(\n        (notebook)\
    \ => {\n          console.log(notebook);\n          var note = this.store.createRecord('note',\
    \ {\n            title : this.controller.get('title'),\n            notebook:\
    \ notebook\n          });\n          console.log(note);\n          note.save().then(()\
    \ => {\n            console.log('save successful');\n            this.controller.set('title',null);\n\
    \            this.refresh();\n          }, function() {\n            console.log('save\
    \ failed');\n          });\n        });\n    },\n    deleteNote: function(note)\
    \ {\n      console.log('deleting note with title ' + note.get('title'));\n   \
    \   note.deleteRecord();\n      note.save();\n    }\n  }\n});\n```\n\nAnd your\
    \ new notes template should look like this:\n\n```handlebars\n{{! ch2/ember-note/app/notebooks/notes/template.hbs}}\n\
    <div class=\"col-md-12\">\n  Notes\n</div>\n<div>\n  <div class=\"col-md-4\">\n\
    \    <div>\n      title: {{input value=title}}<button {{action 'addNote'}}>Add</button>\n\
    \    </div>\n    <div>\n      <ul>\n        {{#each model as |note|}}\n      \
    \  <li>\n          {{#link-to 'notebooks.notes.note' note.id}}\n          {{/link-to}}\n\
    \          <button {{action 'deleteNote' note}}>Delete</button>\n        </li>\n\
    \        {{/each}}\n      </ul>\n    </div>\n  </div>\n</div>\n```\n"
  raw: 'We’ve focused in this section on the parts of a Route implementation that
    relate to displaying data. We’ve had to touch on a few other concepts as well,
    such as templates and models, which we’ll cover in more detail later in the book.
    Don’t worry if you don’t fully understand these right now. There’s a lot more
    to discuss. What I hope you understand is how to use path segments, the model
    hook, and the related navigation functions like transitionTo to work with data.
    The rest of this chapter will focus largely on navigation between routes, and
    on creating a hierarchy of routes in your application. We’ll start there by adding
    the first route that will be a child to the routes we’ve created: the note route.


    ## Nest Routes


    So far we’ve only added routes that sit one level below the application route.
    Let’s get a bit further into the weeds and add a child route of a child route,
    also known as a nested route. Run this command:


    | ​  | $ ember generate route notebooks/notes --pod |


    This route will be used to display all notes that are part of a given notebook.
    As you might expect, the previous command created a new entry in the Router. I’ve
    added the following path segment information to app/router.js:


    | ​  | this.route(​*"notebooks"*​, { path:​*"notebooks/:user_id"*​}, ​**function**​()
    { |


    | ​  | this.route(​*"notes"*​, { path:​*"notes/:notebook_id"*​}, ​**function**​()
    {}); |


    | ​  | }); |


    Define the route class by updating it to look like the following (we’ll need this
    later).


    | [ch2/ember-note/app/notebooks/notes/route.js](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/notebooks/notes/route.js)
    |


    | ​  | ​**import**​ Ember from ​*''ember''*​; |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ Ember.Route.extend({ |


    | ​  | model: ​**function**​(params) { |


    | ​  | ​**return**​ this.store.query(​*''note''*​, {notebook:params.notebook_id});
    |


    | ​  | }, |


    | ​  | actions: { |


    | ​  | addNote: ​**function**​() { |


    | ​  | this.store.findRecord(​*''notebook''*​, |


    | ​  | this.paramsFor(​*''notebooks.notes''*​).notebook_id).then( |


    | ​  | (notebook) => { |


    | ​  | console.log(notebook); |


    | ​  | ​**var**​ note = this.store.createRecord(​*''note''*​, { |


    | ​  | title : this.controller.get(​*''title''*​), |


    | ​  | notebook: notebook |


    | ​  | }); |


    | ​  | console.log(note); |


    | ​  | note.save().then(() => { |


    | ​  | console.log(​*''save successful''*​); |


    | ​  | this.controller.set(​*''title''*​,null); |


    | ​  | this.refresh(); |


    | ​  | }, ​**function**​() { |


    | ​  | console.log(​*''save failed''*​); |


    | ​  | }); |


    | ​  | }); |


    | ​  | }, |


    | ​  | deleteNote: ​**function**​(note) { |


    | ​  | console.log(​*''deleting note with title ''*​ + note.get(​*''title''*​));
    |


    | ​  | note.deleteRecord(); |


    | ​  | note.save(); |


    | ​  | } |


    | ​  | } |


    | ​  | }); |


    And your new notes template should look like this:


    | [ch2/ember-note/app/notebooks/notes/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/notebooks/notes/template.hbs)
    |


    | ​  | ​**<div**​ class=​*"col-md-12"*​​**>**​ |


    | ​  | Notes |


    | ​  | ​**</div>**​ |


    | ​  | ​**<div>**​ |


    | ​  | ​**<div**​ class=​*"col-md-4"*​​**>**​ |


    | ​  | ​**<div>**​ |


    | ​  | title: {{input value=title}} ​**<button**​ {{action ''addNote''}}​**>**​Add​**</button>**​
    |


    | ​  | ​**</div>**​ |


    | ​  | ​**<div>**​ |


    | ​  | ​**<ul>**​ |


    | ​  | {{#each model as &#124;note&#124;}} |


    | ​  | ​**<li>**​ |


    | ​  | {{#link-to ''notebooks.notes.note'' note.id}} |


    | ​  | {{note.title}} |


    | ​  | {{/link-to}} |


    | ​  | ​**<button**​ {{action ''deleteNote'' note}}​**>**​delete​**</button>**​
    |


    | ​  | ​**</li>**​ |


    | ​  | {{/each}} |


    | ​  | ​**</ul>**​ |


    | ​  | ​**</div>**​ |


    | ​  | ​**</div>**​ |


    | ​  | ​**<div**​ class=​*"col-md-8"*​​**>**​ |


    | ​  | {{outlet}} |


    | ​  | ​**</div>**​ |


    | ​  | ​**</div>**​ |


    This is known as a nested route, so called because it resides, and only has meaning,
    as a child of the notebooks route. The command also created the route’s files,
    route.js and template.hbs, under notebooks/notes, a new directory. We filled out
    the implementations earlier.


    | The Missing Note Route |


    | --- |


    | ![images/aside-icons/warning.png](images/aside-icons/warning.png) | If you look
    closely at the new notes template, you’ll notice we added a link to a child route
    that doesn’t yet exist. This is why you don’t see newly added notes if you add
    them. Ember isn’t able to render the link because the child route is missing,
    and there’s likely an error in your browser console. Don’t worry! We’ll get to
    defining the note route in Chapter 4, [​*Building In Reuse with Components*​](#f_0029.html_components).
    |


    You can navigate to this route and define it, just as you would the notebooks
    route, except that your {{#link-to}} expression resides in the notebooks template.
    We’ll spend more time with the notes route and adding a child route to it in Chapter
    4, when we build a feature to edit notes. Let’s look at a few more options for
    navigation before we wrap up our exploration of routes.


    ## Transition Between Routes


    Many times you will want to move from one section of your app to another in response
    to an action. Ember provides you with a few options to do this. One such option
    is the transitionTo function. We’ve used this previously to transition from the
    login route to the notebooks route:


    | [ch2/ember-note/app/login/route.js](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/login/route.js)
    |


    | ​  | this.transitionTo(​*''notebooks''*​, user.get(​*''id''*​)); |


    The first argument to this function is the name of the route you’re transitioning
    to. You can provide either a top-level route, such as notebooks, or a nested route,
    such as notebooks.notes. You can provide other information as well, such as a
    specific model, in the second argument to the function. If you provide a model,
    the receiving route will use that model when rendering. If you provide a literal,
    as we’ve done here, the receiving route will call its model hook, and use that
    literal as a parameter to load the model.


    This is one simple way to move from one route to another. It’s important to note
    that the target route will be rendered into the same {{outlet}} as the calling
    route is currently rendered into. If you want to really get fancy, the render
    function is for you, and we’ll look at that next.


    ## Render Templates into Named Outlets


    In addition to the transtionTo function, Ember provides a function with more fine-grained
    control over transitions: the render function. Using the render function, you
    can not only control which route you’re rendering, but also where you’re rendering
    it and what data and controller to use.


    So far, we’ve only used the default {{outlet}} expressions to contain our templates.
    Ember also allows you to create named outlets, simply by providing a name to the
    outlet: {{outlet ’namedOutlet’}}.


    If you want to use the render function, you’ll need to name the affected outlets.
    The render function accepts a name, which represents the name of the template
    you want to render, and an options object. The options object can have any of
    the following parameters:


    | into | This is the name of the template you want to render your template into.
    If you leave this parameter out, Ember will use the parent template of the template
    that you named earlier. |


    | outlet | This is the name of the outlet on the template named in the into parameter.
    If this parameter is left out, Ember uses the default outlet. |


    | controller | The controller class to use in rendering the new template. If not
    defined, Ember will use the default. |


    | model | An instance of the model class to use in rendering the new template.
    Ember will run the target route’s model hook if not specified. |'
