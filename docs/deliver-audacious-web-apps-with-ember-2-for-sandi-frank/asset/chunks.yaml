    如果你好奇，可以尝试一下 `Inspector`。一个很好的开始方法是在留在登录页面时加载 `Inspector`。在登录之前，切换到 `Inspector`
    中的 `Data` 标签页。一旦登录，你应该能看到用户和笔记本模型类型开始反映出你已经加载了数据。


    另一个实用的功能是 `Deprecations`（弃用）标签页。该标签页可以帮助你识别 `Ember` 框架过时的用法。如果你有正在迁移到 `Ember 2`
    的现有代码，这对于迁移工作将非常有帮助。


    最后，`Inspector` 的 `Container`（容器）标签页（如图所示）显示了你创建的每一个对象，以及 Ember 为你创建的一些对象。这在观察对象中的数据（例如注入的服务，如我们的
    `session` 对象）时会非常有用。


    ![images/inspector.png](img/inspector.png)


    对于像 `Ember` 这样深层基于浏览器的对象模型，你需要丰富的调试工具。与许多事情一样，`Ember` 以一种有用且直观的方式解决了这个问题。在结束本章之前，让我们来看看你如何使用
    `Ember CLI` 创建可部署的 `Ember` 制物。


    ## 部署你的应用


    走到这一步路漫长，但你终于准备好部署你的应用了。你可能把它部署到开发服务器，也可能是生产服务器。无论哪种，你都会把它发布在某个处让世界看到。


    `Ember CLI` 自带了一个命令，用于为应用程序创建一个可部署的产物集。从命令行提示符运行以下：


    ```

    $ ember build

    ```


    这默认运行你构建的开发版本。生成的产物将位于 `ember-note/dist` 目录。这些产物包括一个以应用命名的 JavaScript 文件和样式表（`ember-note.js`
    和 `ember-note.css`），以及一个包含这些文件依赖项的文件（`vendor.js` 和 `vendor.css`）。此外还包含许多其他文件以支持测试用程序，以及
    `crossdomain.xml` 和 `robots.txt`，当然还有你的根 `index.html`。


    但如果你想部署到生产环境，你有不同的需求。如果你查看 `ember-note.js`、`ember-note.css`、`vendor.js` 和 `vendor.css`
    文件，它们相对容易阅读和调试。但它们也是臃肿的，而且名称始终相同，这意味着它们加载缓慢且会被浏览器缓存。


    要部署生产级构建，你需要运行带有设置了 `--environment production` 标志的 `ember build` 命令。这会生成这些文件的版本，它们在适当的地方进行了压缩，并进行了唯一命名以防止被缓存。测试文件被排除在外。这些产物可以放在你选择的高性能
    Web 服务器上，你的应用就准备好面向世界了。这是另一个被 `Ember` 经常解决的难题。


    ## 下一步工作


    我们已经看到了 `Ember CLI` 如何帮助你构建、测试、调试和部署应用。但我们还没有结束。在通过 `Ember` 交付你的杀手应用的过程中，你可能使用了一些插件（addons），并创建了一些你认为其他人会需要的代码。在最后一章中，我们将详细查看如何查找并安装插件到你的应用中。我们还将看到如何发布插件，是发布到供自己的应用共享的私有仓库，还是发布到与世界共享的公共仓库。


