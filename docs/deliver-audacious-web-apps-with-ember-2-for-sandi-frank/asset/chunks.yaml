    *   root.loaded.updated.inFlight


    *   root.loading


    In general, these states are fairly self-explantory, but the following nuances
    are worth mentioning: uncommitted means that a record has not yet been saved to
    persistent storage, inFlight means that a save is in process (recall that saves
    are asynchronous), and saved means a record has been saved to persistent storage.


    By getting a list of all records in the store, it’s possible to run a background
    save process on an interval basis and have data saved without requiring user action.


    ### Purging Records From the Store


    There may also be times when you want to eject records from the store without
    saving them. Consider the case where a user is navigating away from a record without
    having changed data. You can keep the record loaded into the cache, and it will
    be there when you need it later. Or, if you’re interested in limiting the size
    of your cache, or in discarding unsaved changes, you may want to eject the record.
    To do this, call the following:


    | ​  | ​**if**​(record.hasDirtyAttributes()) { |


    | ​  | record.rollbackAttributes(); |


    | ​  | } |


    | ​  | this.store.unloadRecord(record); |


    The method unloadRecord is used to remove records from the store. However, you’ll
    note that we checked the state of the record before unloading it using hasDirtyAttributes.
    This determines whether the record has changes that require a save. The unloadRecord
    method will not remove a dirty object from the cache, so we use the rollbackAttributes
    method first to discard changes, and then we can drop the record from the store.
    As of this writing, this is the only way to discard records from the cache; the
    cache itself does not discard records based on aging.


    Ember Addon: Fireplace


    Perhaps you’d like to totally avoid creating your own back end. If that’s the
    case, you might be interested in Firebase, and an Ember addon known as Fireplace.


    Firebase is an API-as-a-Service provider that you can use to host a custom API
    that you define. Hosted at [https://www.firebase.com](https://www.firebase.com),
    this commercial product lets you quickly spin up an API that you can use in a
    JavaScript, iOS, or Android app.


    While Firebase is a cool product, the Ember addon is what I find really interesting.
    This addon, maintained at [https://github.com/rlivsey/fireplace](https://github.com/rlivsey/fireplace)
    and documented at [http://livsey.org/fireplace/](http://livsey.org/fireplace/),
    wraps the Firebase JavaScript client in an Ember addon, and exposes the features
    of Firebase to your app via an Ember Data store. By simply signing up at Firebase
    and dropping this addon into your project, you can easily get up and running with
    a full back-end API.


    ## Next Steps


    Ember Data can be quite helpful when working with RESTful APIs. As we’ve seen,
    it offers a robust feature set for dealing with data that you obtain from such
    a server. However, we’ve only covered the easy part of the story. You may often
    need to deal with an API that, for one reason or another, doesn’t follow the conventions
    Ember Data expects. There’s no need to give up on Ember Data if you find out your
    API doesn’t conform to its expectations. This is why, despite being focused primarily
    on the front end, it’s important to understand the HTTP traffic Ember Data generates.
    In the next chapter, you’ll learn about a few Ember Data features that allow you
    to work with an API that follows its own rules, and about how to make such APIs
    do what you want them to do.


    Copyright © 2015, The Pragmatic Bookshelf.


    # Chapter 6


    Reading Nonstandard APIs


    One of the core principles of Ember is to value convention over configuration.
    As such, Ember Data is quite easy to use with a RESTful API that uses the conventions
    discussed in [​*Work with Records*​](#f_0038.html_crud). However, at some point
    you’ll almost certainly come into contact with an API that doesn’t follow these
    conventions.'
