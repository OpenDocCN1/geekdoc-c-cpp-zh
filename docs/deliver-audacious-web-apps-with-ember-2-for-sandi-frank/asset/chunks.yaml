    at how to use a route to load and display data via the route’s model hook.


    ## Set Your Model


    When we’re working with a route, the model hook is used to load and supply the
    necessary data. As we’ve seen, not every route will implement its model hook,
    but most will. The model hook is a function, defined within an instance of a Route
    class, that loads the data to be displayed by that route.


    In the EmberNote app, we haven’t yet built a route that makes use of the model
    hook. Let’s do so now. When a user signs in via the login action, we use the transitionTo
    function to transition to the notebooks route. Let’s define that route now, and
    along the way we’ll see how to use the model hook.


    The notebooks route has a simple purpose: to display a list of the notebooks a
    user has created in EmberNote. A notebook is a collection of notes, so clicking
    on a notebook in the notebooks route will then display a list of that notebook’s
    notes. Here’s the notebooks route:


    | [ch2/ember-note/app/notebooks/route.js](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/notebooks/route.js)
    |


    | ​  | ​**import**​ Ember from ​*''ember''*​; |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ Ember.Route.extend({ |


    | ​  | model: ​**function**​(params) { |


    | ​  | ​**return**​ this.store.query(​*''notebook''*​,{user: params.user_id});
    |


    | ​  | }, |


    | ​  | actions: { |


    | ​  | } |


    | ​  | }); |


    Similar to the login route, notebooks uses the ES6 module format and begins with
    the necessary import statement. Further, we defined it using the --pod command-line
    flag, so the file is called route.js and resides in the app/notebooks path, and
    the definition uses the export default Ember.Route.extend form.


    The model hook is the first block in the body of our Route. It’s defined as a
    function, which is executed by Ember when the route is loaded. You’ll also note
    that an object, known as params, is passed to this function. We’ll come back to
    this shortly.


    The body of the model hook contains some Ember Data code to load the logged-in
    user’s notebooks. We’ll cover Ember Data further in Chapter 5, [​*Modeling Your
    Data*​](#f_0035.html_chp.models), so let’s focus on the route-specific portions
    of the code now. This line of code causes Ember Data to query for notebook objects
    that are owned by the user with params.user_id. So where does this user_id come
    from?


    To provide the params object to the route, and specifically the user_id, we need
    to use a path segment in our route definition. Let’s look at the definition of
    the notebooks route in the router.js file:


    | [ch2/ember-note/app/router.js](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/router.js)
    |


    | ​  | this.route(​*''notebooks''*​, { path:​*''notebooks/:user_id''*​}, ​**function**​()
    {}); |


    This is how you use the Router class to define a route with a path segment. In
    Ember, a path segment is used to provide a value that can be used to load a record
    in the route. For this route, we’re using the id of the logged-on user to identify
    the notebooks we want to load. Defining your route this way in the Router class,
    and then using the params object in the Route, allows you to provide the data
    necessary to load the notebooks. Of course, the object that initiated the navigation
    to this route needs to add that data to the path in the first place. In our case,
    we need to modify the transitionTo function in the login route to provide this
    data:


    | [ch2/ember-note/app/login/route.js](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/login/route.js)
    |


    | ​  | this.transitionTo(​*''notebooks''*​, user.get(​*''id''*​)); |


    With the correct data, we’re able to initiate a query against our API to get the
    current user’s notebook data.


    | Security Note |


    | --- |


    | ![images/aside-icons/tip.png](images/aside-icons/tip.png) | Using path segments
    to pass data between routes is an extremely useful feature of Ember, but it’s
    easy to use in a way that can be insecure. Placing cleartext data in your URL
    is a potential risk, given that it’s easy for a malicious user to change in an
    attempt to break your application’s security. This is known as a direct object
    reference vulnerability, and you can read more about it at [https://www.owasp.org/index.php/Top_10_2010-A4-Insecure_Direct_Object_References](https://www.owasp.org/index.php/Top_10_2010-A4-Insecure_Direct_Object_References).
    |


