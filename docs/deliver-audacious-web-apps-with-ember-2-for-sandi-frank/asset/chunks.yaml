    \ 插件。\n\nEmber Auth 项目是一个用于为 Ember 应用添加身份验证的库。除其他外，它允许你针对自己的服务器或支持 OAuth 的外部服务进行身份验证。一旦验证通过，你可以使用\
    \ Ember Auth 对请求进行授权，通过防止未经授权的用户来实现。\n\n然而，Ember Auth 本身并不是插件。要在 Ember CLI 中使用它，你需要\
    \ Ember CLI 插件，它封装了 Ember Auth 代码并使其能够安装。这是 Ember CLI 如何共享良好想法的好例子。像 Ember Auth\
    \ 这样的代码库在项目中只需一个命令即可获取。\n\nEmber CLI Auth 插件的完整文档位于 [`github.com/simplabs/ember-cli-auth`](https://github.com/simplabs/ember-cli-auth)。\n\
    \n现在我们有了会话对象，我们需要让需要它的类型能够使用。首先，我们将此实例以 `session:main` 的名称注册到 `application` 对象。使用\
    \ `register` 方法会创建一个会话对象的单例并在应用中共享。然后我们可以使用此单例在原本无法共享的对象之间共享数据。\n\n注册对象后，接下来的两行代码将此对象注入到\
    \ `adapter` 和 `route` 类型工厂中。`inject` 函数的第一个参数是你想要注入的类型。第二个参数是你想在该类型下提供的对象的属性名称，第三个参数是我们注册对象的名称。初始化器中的剩余代码用于帮助组织执行顺序，正如我们在下一章中看到的。\n\
    \n现在我们已经准备好了用于存储会话的初始化器，让我们修改登录路由以使用它：\n\n[ch6/ember-note/app/login/route.js](http://media.pragprog.com/titles/mwjsember/code/ch6/ember-note/app/login/route.js)\n\
    \n```javascript\nimport Ember from 'ember';\n\nexport default Ember.Route.extend({\n\
    \  actions: {\n    login: function() {\n      this.store.query('user', {\n   \
    \     name: this.controller.get('name')\n      }).then((users) => {\n```\n\n"
