    . The `if` statement ensures that we only add this header if the user has logged\
    \ on. We’re using Ember’s notion of a computed property to set the header. A computed\
    \ property takes the result of a function and assigns it to the property. The\
    \ property function passes any required dependencies to the function—in this case\
    \ we need the `session.user` object. We set the \"username\" header to the \"\
    name\" field from the logged-on user object. This ensures that each HTTP request\
    \ from our adapter will have this header, which can be used for API keys, user\
    \ authentication/authorization, and so forth.\n\nThis is just one possible way\
    \ to use dependency injection, a topic we cover in more detail in Chapter 7, [Reusing\
    \ Code in Ember](#f_0049.html_ch7).\n\n### Adding a Custom API Hostname\n\nIt\
    \ took a bit of work to get there, but using initializers, injection, and a session\
