    There are many other similar methods, each of which supports a specific data operation,
    such as extractCreateRecord, but the most relevant ones are in essence just an
    alias for either extractSingle or extractArray. However, if your API requires
    that different operation types receive different treatment, it’s worth knowing
    that these options are out there.


    ## Tie Adapters and Serializers to Your Model Class


    There are two ways to go about implementing the adapter/serializer pattern in
    your app. We’ve actually used both so far. For common changes that you want to
    share across all REST requests, such as adding a user token, you modify the application
    adapter or serializer that Ember CLI creates for you, located at ember-note/app/adapters/application.js
    and ember-note/app/serializers/application.js. If you want to create a model-specific
    adapter or serializer, you run one of the following commands:


    | ​  | $ ember generate serializer mymodel |


    | ​  |  |


    | ​  | or |


    | ​  |  |


    | ​  | $ ember generate adapter mymodel |


    This creates an adapter or serializer that will be applied to requests for data
    of the given type. You can then implement the features we described earlier, without
    worrying that they will be applied unnecessarily to other model types.


    Now that we’ve explored how to use an alternate API, let’s get rid of the notebook
    adapter and serializer, and change our application-wide RESTAdapter back. From
    a command line, run the following commands:


    | ​  | $ ember destroy adapter notebook |


    | ​  | $ ember destroy serializer notebook |


    Then modify the namespace property in the ember-note/app/adapters/application.js
    file as follows:


    | ​  | namespace: ​*"api"*​ |


    You can leave the headers in place; there’s no reason they should be removed.
    With our brisk tour through nonconforming APIs at an end, we’re ready for our
    next step.


    ## Next Steps


    The RESTAdapter and RESTSerializer classes offer a lot more than we’ve been able
    to cover here. These classes provide a powerful means of using Ember Data to work
    with just about any API, so I encourage you to explore these further if you run
    into a scenario we haven’t covered. We’ve now seen a lot of the core features
    of Ember and Ember Data, but there’s more for us yet. Ember offers a variety of
    options for extending this core and for using the framework itself to link classes
    together to help increase the utility of the classes you create. In the next chapter,
    we’ll extend Ember by making commonly needed utilities available throughout your
    app.


