  trans: "\n在此示例中，我们假设已经创建了一个用户特定的翻译对象并将其注入到 transform（转换）中。这将允许我们计算使用用户货币汇率的翻译。transform\
    \ 本身仅负责在模型请求原生币种信息时介入。一个需要使用 transform 的示例模型类看起来如下：\n\n```javascript\nimport DS\
    \ from \"ember-data\";\n\nexport default DS.Model.extend({\n  toAccount: DS.attr('string'),\n\
    \  fromAccount: DS.attr('string'),\n  amount: DS.attr('native-currency') // 原生币种的金额\n\
    });\n```\n\n如果不使用 transform，相同的数据可以如下所示表示：\n\n```javascript\nimport DS from \"\
    ember-data\";\n\nexport default DS.Model.extend({\n  toAccount: DS.attr('string'),\n\
    \  fromAccount: DS.attr('string'),\n  amount: DS.attr('number') // 数据存储中保留的 USD\
    \ 金额\n});\n```\n\ntransform 既用于反序列化数据（即从其存储格式翻译为显示格式），也用于序列化数据。这意味着你可以以选定的格式进行显示，但在需要保存时，`serialize`\
    \ 函数会介入并将数据转换回相应的格式，以保持与数据库预期一致。\n\n# 下一步工作\n\n我们在一起的大部分时间里都在学习如何构建 Ember 应用。构建应用很棒，但你想让它呈现在人们面前，对吧？在接下来的两个章节中，你将学习更多关于\
    \ Ember CLI 的知识，这对部署和发布非常有帮助。接下来，你将学习如何使用它来管理依赖，并从你的 Ember 代码构建可部署的产物。作为该过程的一部分，我们还将如何使用\
    \ Ember CLI 提供的测试钩子（test hooks），以便对我们的代码充满信心。\n\nCopyright © 2015, The Pragmatic\
    \ Bookshelf.\n\n# 第 8 章：构建、测试和部署你的 Ember 应用\n\n到目前，我们已经在构建应用的功能方面做了大量工作。但在完成之前，还有另一个重要领域我们需要处理。我们需要花些时间思考如何让我们的应用准备好投入生产环境。\n\
    \nEmber CLI 为我们完成了其中的许多工作，但作为开发者，了解一些幕后正在发生的事情对你有帮助。首先，我们将查看 Ember CLI 如何从你创建的代码中准备出一个可用的应用程序版本。然后，我们在这章的大部分范围内讨论\
    \ Ember CLI 如何帮助你测试应用。最后，我们将查看 Ember CLI 如何帮助你部署你的应用程序。\n\n让我们从查看 Ember CLI 如何构建你的应用程序代码并保持其随时供你运行开始。\n\
    \n## 构建你的应用\n\n如果你在 JavaScript（或任何其他软件开发工具）中工作了很久，你可能熟悉一个共同的障碍：构建系统。就像语言一样，每个人对于给定语言什么种构建构建系统都有不同的意见。与此选择密切相关的是你对依赖管理的选择。选择一个构建和依赖管理工具是一个挑战，而配置选定的工具集是另一个挑战。幸运的是，Ember\
    \ CLI 优雅地为你解决了这个问题。\n\n### 获取你的依赖\n\n当你第一次安装 Ember CLI 时，它包含了最新版本的 Ember。作为 Ember\
    \ 2.x 发布周期的一部分，Ember 核心和 Ember CLI 将同步发布计划。因此，如果你想升级 Ember CLI，Ember 也应该随之升级。你可以在项目目录下以管理员身份运行以下命令来升级\
    \ Ember CLI：\n\n```bash\n$ npm uninstall -g ember-cli\n$ npm cache clean\n$ bower\
    \ cache clean\n$ npm install -g ember-cli\n$ npm install ember-cli --save-dev\n\
    $ rm -rf node_modules bower_components dist tmp\n$ npm install\n$ bower install\n\
    $ ember init\n```\n\n前三个命令从 npm 包管理系统中删除了当前版本的 Ember CLI，并从 npm 和 Bower 缓存中清除相关文件。接下来，安装最新的\
    \ Ember CLI 并使其全局可用（由 `-g` 标志定义），同时将其安装到你项目的 `package.json` 文件中（我们使用了 `--save-dev`\
    \ 标志）。\n\n然后，为了安全起见，我们删除了应用中包含依赖项和构建版本的四个目录。接下来的两个命令将 `package.json` 和 `bower.json`\
    \ 中列出的所有依赖重新安装到你的本地组件目录中。最后，`ember init` 对你当前的代码库重新运行所有的 Ember CLI 蓝图（blueprints）以寻找更改。你每次运行\
    \ `ember generate` 时都使用了这些蓝图，因为蓝图可能会发生，所以重新应用它们是比较好的。该命令给了你确认每个差异（diff）的机会。\n\n\
    有时你可能只想更新其中一个依赖项而不更新 Ember CLI。由于 Ember CLI 依赖于 Bower，你只需运行以下命令即可安装依赖：\n\n```bash\n\
    $ bower install my-dependency --save\n```\n\n这将更新 `bower.json`。\n\n### 在本地运行你的应用\n\
    \n当你编码或更改依赖项时，Ember CLI 会保持本地部署最新，假设你启动了一个运行中的实例。正如我们在书中一直看到的，当你运行 `ember serve`\
    \ 命令时，它会启动 watchman 服务。当 watchman 检测到你应用文件中的一个变化时，它会触发应用的重新构建。此外，当你浏览应用时，本地部署的版本包含一个\
    \ WebSocket 客户端监控变化并在必要时重新加载应用。这非常方便，特别是当你快速编码并希望同样快速看到更改时。当你快速编码时，你想要做的另一件事就是编写测试用例。我们现在来看看如何这样做。\n\
    \n## 测试并调试你的应用\n\n我一直都在保守一个小秘密。当你运行 `ember generate` 时，Ember CLI 不仅为你生成类，还为你生成测试脚架。事实上，它们已经完整到可以运行（尽管覆盖率并不高）。如果你过去在为\
    \ JavaScript 客户端代码应用良好的测试实践遇到困难的人，那么你最后的理由已经消失了。\n\n### 测试执行\n\n让我们首先查看 Ember\
    \ CLI 在我们工作期间创建的测试结果。打开提示符，导航到 EmberNote 项目根目录，并运行以下命令：\n\n```bash\n$ ember test\n\
    ```\n\n当你运行此命令时，你应该能看到控制台充满了输出。Ember CLI 首先构建你的应用，然后运行它一直以来生成的测试。\n\n查看测试的第二种方法。在同一个命令行提示符，按下\
    \ `Ctrl-C`，这将暂停 `ember test` 的输出。它应该会报告几个失败的测试，我们稍后会讨论。首先，从命令行运行 `ember serve`。然后，将浏览器指向\
    \ `localhost:4200/tests`。\n\n"
- fmt: "\nIn your browser, you’ll see the results of your tests displayed. Scroll\
    \ through the results and you should see the failing tests. Before we fix a few\
    \ of these failing tests (and yes, the tests do require some tweaking), let’s\
    \ talk a little bit about the tooling Ember CLI uses to accomplish test execution.\n\
    \nWhen you run the `ember test` command from the command line, Ember CLI spins\
    \ up a `PhantomJS` instance. PhantomJS is a headless web browser (a browser with\
    \ no user interface), written entirely in JavaScript. By using PhantomJS, you’re\
    \ able to execute your tests as part of a continuous integration process. Continuous\
    \ integration is the practice of regularly compiling your software with an automated\
    \ process on a dedicated build machine. Using continuous integration, you can\
    \ check if errors have been introduced by new changes. If you adopt continuous\
    \ integration, your tests should be run during the build process. Using PhantomJS\
    \ allows your testing to occur without requiring a traditional browser be installed\
    \ on the continuous integration machine.\n\nWhen you run the tests by visiting\
    \ `localhost:4200/tests`, you’re actually using an Ember application that Ember\
    \ CLI builds as you update your app. This app is built to run your tests and display\
    \ the results to you. It runs every test, and offers you a few options to determine\
    \ which test results you want to see.\n\nBoth of these methods for reviewing your\
    \ test results are useful, and both have a place in your development plans. Throughout\
    \ the rest of the chapter, we’ll rely on the test app viewable at `localhost:4200`,\
    \ as it offers a slightly better user experience.\n\nWith a way to look at our\
    \ test results, let’s start by writing the more foundational of the tests we’re\
    \ going to write: unit tests.\n\n## Writing Unit Tests\n\nOne benefit of being\
    \ able to use a module-based approach to JavaScript is that we can think in a\
    \ modular fashion about our tests as well. Ember CLI creates one test module for\
    \ each app module we create. Let’s see one of those now. When you created the\
    \ note model class, Ember CLI created a test in a file called `note-test.js`,\
    \ in the `ember-note/tests/unit` directory. The generated file looks like this:\n\
    \n```javascript\n// ch8/ember-note/tests/unit/models/notebook-test.js\nimport\
    \ {\n  moduleForModel,\n  test\n} from 'ember-qunit';\n\nmoduleForModel('notebook',\
    \ 'Unit | Model | notebook', {\n  // Specify the other units that are required\
    \ for this test.\n  needs: [];\n});\n\ntest('it exists', function(assert) {\n\
    \  var model = this.subject();\n  // var store = this.store();\n  assert.ok(!!model);\n\
    });\n```\n\nThe import block pulls in the `moduleForModel` and `test` functions\
    \ from `ember-qunit`. These functions are used in the test class to load the class\
    \ we want to test and then execute a test against it, respectively.\n\n| QUnit,\
    \ ember-test-helpers, and ember-qunit |\n| :--- |\n| To test using the `ember\
    \ test` command or via the browser, you’ll primarily rely on three test frameworks:\
    \ `QUnit` ([http://qunitjs.com]), `ember-test-helpers` ([https://github.com/switchfly/ember-test-helpers]),\
    \ and `ember-qunit` ([https://github.com/rwjblue/ember-qunit]).Each of these plays\
    \ a role in providing some of the code you write for test cases. `QUnit` is a\
    \ generic JavaScript testing framework written originally for jQuery; `ember-test-helpers`\
    \ is an Ember-specific set of test harnesses that requires a specific test framework,\
    \ such as `QUnit`, to function; and `ember-qunit` glues the two of these together.\
    \ |\n\n### Test Case Dependencies\n\nThis generated unit test will confirm the\
    \ most fundamental behavior: that an instance of the note model class can be created.\
    \ And right now, this test is a failing test. If you look at the test result,\
    \ you should see a message that reads something like “No model was found for notebook.”\
    \ Why is it reporting that it can’t find the notebook model? Because the note\
    \ model class contains a `belongsTo` reference to notebook. Let’s fix that. Change\
    \ the `needs` array of your test case to look like this:\n\n```javascript\n//\
    \ ch8/ember-note/tests/unit/models/notebook-test.js\nneeds: [\n  'model:user',\n\
    \  'model:note'\n];\n```\n\nOnce you make that change, the failing notebook model\
    \ tests should pass. Rerun your tests via the browser to confirm. If you want\
    \ a clean set of tests, also update the serializer test as follows:\n\n```javascript\n\
    // ch8/ember-note/tests/unit/serializers/application-test.js\nmoduleForModel('user',\
    \ 'Unit | Serializer | application', {\n  // Specify the units\n  needs: ['model']\n\
    });\n```\n\nThis change updates the serializer test to rely on the model, which\
    \ does exist. You may note the note test is failing. We’ll come to it soon.\n\n\
    ### Unit Testing Models\n\nUnder many circumstances, you may not need to write\
    \ test cases for your models. If your classes rely solely on framework behavior,\
    \ as ours do, you won’t even need to write them. But let’s complicate things for\
    \ ourselves a bit, and add a function to our model that counts the number of notes\
    \ associated to the instance. Update your model to look like this:\n\n```javascript\n\
    // ch8/ember-note/app/models/notebook.js\nimport DS from 'ember-data';\n\nexport\
    \ default DS.Model.extend({\n  title: DS.attr('string'),\n  user: DS.belongsTo('user'),\n\
    \  notes: DS.hasMany('note'),\n  noteCount: function() {\n    return this.get('notes.length');\n\
    \  }\n});\n```\n\nThe `noteCount` function gets the `notes` attribute, which points\
    \ to the array of associated, and returns the length of that array. That’s what\
    \ it’s meant to do. Now, let’s write a test that confirms this. Update your `notebook-test.js`\
    \ file to look like:\n\n```javascript\n// ch8/ember-note/tests/unit/models/notebook-test.js\n\
    import {\n  moduleForModel,\n  test\n} from 'ember-qunit';\nimport Ember from\
    \ 'ember';\n\nmoduleForModel('notebook', 'Unit | Model | notebook', {\n  // Specify\
    \ the other units that are required for this test.\n  needs: [\n    'model:user',\n\
    \    'model:note'\n  ];\n});\n\ntest('it exists', function(assert) {\n  var model\
    \ = this.subject();\n  // var store = this.store();\n  assert.ok(!!model);\n});\n\
    ```\n"
