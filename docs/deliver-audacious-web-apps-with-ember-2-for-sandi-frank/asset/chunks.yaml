    该文件是由 Ember CLI 构建的，除了我们对标题的修改外，它与我们创建新应用时 Ember CLI 生成的完全一样。你可能会注意到此文件中没有对任何模板的引用。`{{content-for}}`
    钩子是为了 Ember CLI 插件准备的，但我们没有使用它们。那么，我们的应用是如何开始渲染的呢？


