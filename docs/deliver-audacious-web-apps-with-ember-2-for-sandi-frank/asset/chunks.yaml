    Now that we’ve seen a good deal of how to customize your adapters, let’s take
    a look at how to translate an idiosyncratic API into the conventions Ember Data
    model classes expect, by making use of RESTSerializer.


    ## Use Serializers to Access Legacy APIs


    As much as we might hope to leave them behind, sometimes we need to work with
    a legacy API. We don’t have to throw out our entire model layer, though. By making
    use of RESTSerializer, we can take the raw data returned by this API and get it
    into the form we expect.


    With Ember Data, a serializer is a class that takes a block of data and translates
    it into a different form for storage in an external context. For example, a serializer
    can be used to modify attribute names to match your expected format. You can take
    a raw JSON payload and alter its structure to match your model layer or remove
    extraneous information. And you can serialize your model data back into the format
    the servers expects and save it.


    | RESTful Calls from Ember Data |


    | --- |


    | ![images/aside-icons/important.png](images/aside-icons/important.png) | It’s
    important to keep in mind that while you can change many things about the JSON
    payloads that move back and forth—and even alter the expected name of your endpoint
    as we’ll see shortly—you’re still using the same HTTP verbs to interrogate your
    API. With RESTAdapter and RESTSerializer, you can change a lot, but your API is
    still subject to the same conventions in that regard. |


    Now that we have a parallel API, let’s mess with it a bit more to learn how to
    use these features. Let’s start by implementing the serialize and normalize methods.


    ### Serializing Data


    Let’s make a change to how the notebook data type is written to the database.
    We’ll create a per-type serializer for the notebook class, so that only this data
    type is impacted by the changes. Run the following Ember CLI command to create
    this new serializer:


    | ​  | $ ember generate serializer notebook |


    This command creates an empty stub class. Now, let’s assume that this alternate
    notebook endpoint uses a slightly different capitalization format for data attributes:
    it uses a class-like capitalization format. For example, instead of "title", the
    field will be known as "Title".


    Classes that extend RESTSerializer are used to make changes to data that is obtained
    from or sent to the server. Our alternate API uses a different capitalization
    scheme. Within the notebook model class, the attributes are camel-cased. Our API
    expects records to be stored in class-cased attributes. So, when a record is saved,
    the conventional model attribute names need to be converted from camel-case to
    class-case. Take a look at the serialize method:


    | [ch6/ember-note/app/serializers/notebook.js](http://media.pragprog.com/titles/mwjsember/code/ch6/ember-note/app/serializers/notebook.js)
    |


    | ​  | ​**import**​ DS from ​*''ember-data''*​; |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ DS.RESTSerializer.extend({ |


    | ​  | normalize: ​**function**​(typeClass, hash, prop) { |


    | ​  | hash.title = hash.Title; |


    | ​  | ​**delete**​ hash.Title; |


    | ​  | hash.user = hash.User; |


    | ​  | ​**delete**​ hash.User; |


    | ​  | ​**return**​ this._super(typeClass, hash, prop); |


    | ​  | }, |


    | ​  | serialize: ​**function**​(snapshot, options) { |


    | ​  | ​**var**​ json = { |


    | ​  | Title: snapshot.attr(​*''title''*​), |


    | ​  | User: snapshot.belongsTo(​*''user''*​).id |


    | ​  | }; |


    | ​  | ​**return**​ json; |


    | ​  | }, |


    | ​  | }); |


    The serialize method is used to modify records on their way to the server. If
    you implement this method in your RESTSerializer implementation, you can control
    the JSON body of your HTTP request to match your API’s expectations. Both new
    records and changes to records will funnel through this method. The snapshot parameter
    represents a model record at the time the serialize method is called. The options
    parameter contains a hash with one attribute: includeId. This attribute will be
    set by the calling adapter. When you’re creating a new record, this will be set
    to true, otherwise false.


    Our serialize method creates a JSON hash, but alters the keys by replacing the
    camel-cased keys with class-cased keys. The values stay the same. At present,
    our API endpoint determines the value of the id field, so we don’t need to worry
    about it.


    Earlier in this chapter, we changed how we store the user object so that we store
    it in a session. As a result, we need to make one minor change to the notebooks
    route to use the session object. Update the addNotebook action to the following:


    | [ch6/ember-note/app/notebooks/route.js](http://media.pragprog.com/titles/mwjsember/code/ch6/ember-note/app/notebooks/route.js)
    |


