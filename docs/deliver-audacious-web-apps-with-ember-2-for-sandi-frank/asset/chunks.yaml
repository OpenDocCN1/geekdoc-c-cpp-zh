  trans: "\n\n在本节中，我们不仅涵盖了路由（routes），为了构建一个良好的示例，你现在需要关注的关键元素是 `{{#link-to}}` 表达式、`transitionTo`\
    \ 函数以及 actions 哈希（hash）。正如在 `application.hbs` 模板中所使用的`{{#link-to}}` 表达式允许用户在点击生成的链接时，将登录路由的\
    \ `template.hbs` 加载到 `application.hbs` 中的 `{{outlet}}`。要实现这一功能，我们需要在 `router.js`\
    \ 中定义登录路由。`{{link-}}` 表达式是让父路由将子路由加载到其 outlet 的方法之一。\n\n实现导航另一种方法是使用如 `transitionTo`\
    \ 之类的函数在路由之间移动。正如在登录路由中所，它接收当前加载的路由（由调用函数的实例确定），并用函数调用中指定的路由替换它。正如我们在示例中提到的，我们可以使用此函数不仅指示要加载哪个路由，还可以指示应该加载哪条记录。稍后在我们查看设置路由模型（model）时，我们将看到更多关于目标路由如何知道加载哪条记录的内容。\n\
    \n最后，actions 哈希用于定义动作名称与相关函数之间的键值对。这个概念并非特定于路由，稍后我们会看到更多示例，但值得注意的是，处理动作的一种选择就是以这种方式将动作添加到路由中。\n\
    \n现在我们更深入地理解什么是路由以及如何使用它，让我们来看看如何通过路由的模型钩子（model hook）来加载和显示数据。\n\n## 设置你的模型 (Set\
    \ Your Model)\n\n当我们处理路由时，model hook 用于加载并提供必要的数据。正如我们所看到的，并不是每个路由都会实现它的 model\
    \ hook，但大多数路由都会。model hook 是一个函数，定义在 `Route` 类的实例中，用于加载由该路由显示的数据。\n\n在 EmberNote\
    \ 应用中，我们还没有构建使用 model hook 的路由。现在我们来构建一个。当用户通过登录 action 登录时，我们使用 `transitionTo`\
    \ 函数跳转到 notebooks 路由。让我们现在定义该路由，在此过程中我们将看到如何使用 model hook。\n\nnotebooks 路由有一个简单的目的：显示用户在\
    \ EmberNote 中创建的笔记本（notebooks）列表。笔记本是笔记的集合，因此在 notebooks 路由中点击笔记本将显示该笔记本的笔记列表。以下是\
    \ notebooks 路由：\n\n```javascript\n// ch2/ember-note/app/notebooks/route.js\nimport\
    \ Ember from 'ember';\n\nexport default Ember.Route.extend({\n  model: function(params)\
    \ {\n    return this.store.query('notebook',{user: params.user_id});\n  },\n \
    \ actions: {\n  }\n});\n```\n\n与登录路由类似，notebooks 使用 ES6 模块格式并以必要的 import 语句开头。此外，我们使用\
    \ `--pod` 命令行标志定义它，因此文件名为 `route.js` 并位于 `app/notebooks` 路径，且定义使用了 `export default\
    \ Ember.Route.extend` 形式。\n\nmodel hook 是我们 `Route` 主体中的第一个块。它被定义为一个函数，当路由加载时由\
    \ Ember 执行。你还会注意到，一个名为 `params` 的对象被传递给这个函数。我们稍后会回到这里。\n\nmodel hook 的正体包含了一些\
    \ Ember Data 代码，用于加载登录用户的笔记本。我们将在第 5 章 [建模你的数据 (Modeling Your Data)] 中进一步介绍 Ember\
    \ Data，因此现在让我们关注代码中特定于路由的部分。这行代码导致 Ember Data 查询由 `params.user_id` 用户拥有的笔记本对象。那么这个\
    \ `user_id` 是哪里来的呢？\n\n为了向路由提供 `params` 对象，特别是 `user_id`，我们需要在路由定义中使用路径段（path\
    \ segment）。让我们查看 `router.js` 文件中 notebooks 路由的定义：\n\n```javascript\n// ch2/ember-note/app/router.js\n\
    this.route('notebooks', { path:'notebooks/:user_id'}, function() {});\n```\n\n\
    这就是你如何使用 `Router` 类定义带有路径段的路由。在 Ember 中，路径段被用于提供一个值，该值可以用于在路由中加载记录。对于此路由，我们正在使用登录用户的\
    \ id 来标识我们想要加载的笔记本。在 `Router` 类中以这种方式定义路由，然后在 `Route` 中使用 `params` 对象，允许你提供加载笔记本所需的数据。当然，发起导航到此路由的对象首先需要将该数据添加到路径中。在我们的案例中，我们需要修改路由中\
    \ `application.js`（注：此处原文应为 route.js）中的 `transitionTo` 函数来提供这些数据：\n\n```javascript\n\
    // ch2/ember-note/app/route.js\nthis.transitionTo('notebooks', user);\n```\n\n\
    **安全注意**：在路由之间使用路径段是 Ember 的有用功能，但很容易以不安全的方式使用。在 URL 中放置明文是一个潜在风险，因为恶意用户可以很容易更改它。这被称为直接对象漏洞（direct\
    \ object vulnerability）。\n\n接下来，我们需要定义 mock（模拟数据）。为此，运行以下命令来创建 mock 服务并为路由提供 REST\
    \ API：\n\n`ember generate mock`\n\n然后我们用以下代码填充生成的文件（我将不会详细解释发生什么；它与我们用于用户的代码本质相同）：\n\
    \n```javascript\n// ch2/ember-note/server/notebooks.js\nmodule.exports = function(app)\
    \ {\n  var express = require('express');\n  var notebooksRouter = express.Router();\n\
    \  var bodyParser = require('body-parser');\n  app.use(bodyParser.json());\n \
    \ var nedb = require('nedb');\n  var notebookDB = new nedb({ filename: 'notebooks',\
    \ autoload: true});\n\n  notebooksRouter.get('/', function(req, res) {\n    notebookDB.find(req.query).exec(function(error,\
    \ notebooks) {\n      res.send({\n        'notebooks': notebooks\n      });\n\
    \    });\n  });\n\n  notebooksRouter.post('/', function(req, res) {\n    notebookDB.find({}).sort({id:\
    \ -1}).limit(1).exec(function(err,notebooks) {\n      if(notebooks.length != 0)\n\
    \        req.body.notebook.id = notebooks[0].id + 1;\n      else\n        req.body.notebook.id\
    \ = 1;\n      notebookDB.insert(req.body.notebook,function(err,newNotebook) {\n\
    \        res.status(201);\n        res.send(\n          JSON.stringify({\n   \
    \         notebook : newNotebook\n          }));\n      });\n    })\n  });\n\n\
    \  notebooksRouter.get('/:id', function(req, res) { \n    res.send({\n      'notebooks':\
    \ {\n        id: req.params.id\n      }\n    });\n  });\n\n  notebooksRouter.put('/:id',\
    \ function(req, res) {\n    res.send({\n```\n"
- fmt: "\n```javascript\n{\n  'notebooks': {\n    id: req.params.id\n  }\n});\n\n\
    notebooksRouter.delete('/:id', function(req, res) {\n  res.status(204).end();\n\
    });\n\napp.use('/api/notebooks', notebooksRouter);\n};\n```\n\nWe also need to\
    \ define the model class. Run this command to define a model class for the notebook\
    \ type:\n\n```bash\n$ ember generate model notebook\n```\n\nThere’s much more\
    \ to come on models later. Right now, add the following code to your `notebook.js`\
    \ file (ch2/ember-note/app/models/notebook.js):\n\n```javascript\nimport DS from\
    \ 'ember-data';\n\nexport default DS.Model.extend({\n  title: DS.attr('string'),\n\
    \  user: DS.belongsTo('user'),\n  notes: DS.hasMany('note')\n});\n```\n\nWe’ll\
    \ also go ahead and define the mock service and model for the note object, which\
    \ notebook relies on. Run the following command:\n\n```bash\n$ ember generate\
    \ http-mock notes\n```\n\nAnd update the resulting service with this code (ch2/ember-note/server/mocks/notes.js):\n\
    \n```javascript\nmodule.exports = function(app) {\n  var express = require('express');\n\
    \  var notesRouter = express.Router();\n  var bodyParser = require('body-parser');\n\
    \  app.use(bodyParser.json());\n  var nedb = require('nedb');\n  var noteDB =\
    \ new nedb({ filename: 'notes', autoload: true});\n\n  notesRouter.get('/', function(req,\
    \ res) {\n    noteDB.find(req.query).exec(function(error,notes) {\n      res.send({\n\
    \        'notes': notes\n      });\n    });\n  });\n\n  notesRouter.post('/',\
    \ function(req, res) {\n    noteDB.find({}).sort({id: -1}).limit(1).exec(function(err,notes)\
    \ {\n      if (notes.length != 0)\n        req.body.note.id = notes[0].id + 1;\n\
    \      else\n        req.body.note.id = 1;\n      noteDB.insert(req.body.note,function(err,newNote)\
    \ {\n        res.status(201);\n        res.send(\n          JSON.stringify(\n\
    \          {\n            note : newNote\n          }))\n        );\n      });\n\
    \    });\n  });\n\n  notesRouter.get('/:id', function(req, res) {\n    res.send({\n\
    \      'notes': {\n        id: req.params.id\n      }\n    });\n  });\n\n  notesRouter.put('/:id',\
    \ function(req, res) {\n    var id = parseInt(req.params.id);\n    noteDB.update({id:\
    \ id}, {$set: req.body.note},\n      function(err, numReplaced, newNotes) {\n\
    \        res.send({\n          'notes': {\n            id: id\n          }\n \
    \       });\n      }\n    );\n  });\n\n  notesRouter.delete('/:id', function(req,\
    \ res) {\n    var id = parseInt(req.params.id);\n    noteDB.remove({id: id},function(err,numRemoved)\
    \ {\n      res.status(204).end();\n    });\n  });\n\n  app.use('/api/notes', notesRouter);\n\
    };\n```\n\nNow run this command to create the model:\n\n```bash\n$ ember generate\
    \ note\n```\n\nAnd define the model as follows (ch2/ember-note/app/models/note.js):\n\
    \n```javascript\nimport DS from 'ember-data';\n\nexport default DS.Model.extend({\n\
    \  title: DS.attr('string'),\n  body: DS.attr('string'),\n  notebook: DS.belongsTo('notebook')\n\
    });\n```\n\nDon’t worry if you have questions about the model now. We’ll discuss\
    \ these in Chapter 5, Modeling Your Data. With the notebooks web service up we’re\
    \ ready to create the template for the notebooks route. As you’ve learned, the\
    \ template is used to render the user interface for a route. In this case we want\
    \ to create an interface that allows users to do two things: (1) create a new\
    \ notebook, and (2) display the list of existing notebooks. Here’s the template\
    \ that you’ll want to create (ch2/ember-note/app/notebooks/template.hbs):\n\n\
    ```handlebars\n<div>\n  <div class=\"col-md-3\">\n    <div>Notebooks</div>\n \
    \   <div>\n      title: {{input value=title}}\n      <button {{action 'addNotebook'}}>Add</button>\n\
    \    </div>\n    <div>\n      <ul>\n        {{#each model as notebook}}\n    \
    \      {{#link-to 'notebooks.notes' notebook.id}}\n            <li>{{notebook.title}}</li>\n\
    \          {{/link-to}}\n        {{else}}\n          <div>No notebooks found</div>\n\
    \        {{/each}}\n      </ul>\n    </div>\n  </div>\n  <div class=\"col-md-9\"\
    >\n    {{outlet}}\n  </div>\n</div>\n```\n\nI won’t dwell too much on the template\
    \ code now—we’ll go into more detail in the next chapter. What I’d like you to\
    \ notice is that we’re directly referencing the model from our template. As I\
    \ mentioned earlier in this chapter, in the absence of directly creating a controller\
    \ class, we can rely on default functionality of the base `Ember.Controller` class.\
    \ This class has a `model` variable, and by default it calls the route’s `model`\
    \ hook to populate this variable.\n\nFor the notebooks route, the Ember Data query\
    \ returns zero or more rows. In the `template.hbs` file, the `model` referenced\
    \ is the variable contained the default controller. To get at the data in the\
    \ variable, we’re using an `{{#each}}` expression, which loops along a list of\
    \ model instances. The `model` variable in a controller can contain either a single\
    \ model instance or an array of model instances.\n\nOur template displays the\
    \ notebooks titles in an unordered list. We’ll dig into the details of the template\
    \ and expressions later. For now, your list is probably empty. Let’s see how to\
    \ use actions to add to the list and reload your template so they’re displayed.\
    \ Add this code to the actions hash in your notebooks route (ch2/ember-note/app/notebooks/route.js):\n\
    \n```javascript\naddNotebook: function() {\n  var notebook = this.store.createRecord('notebook',\
    \ {\n    title: this.controller.get('title'),\n    user: this.controllerFor('application').get('user')\n\
    \  });\n  notebook.save().then(() => {\n    console.log('save successful');\n\
    \    this.controller.set('title',null);\n    this.refresh();\n  }, function()\
    \ {\n    console.log('save failed');\n  });\n}\n```\n"
