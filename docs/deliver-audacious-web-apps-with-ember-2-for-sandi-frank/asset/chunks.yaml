    \  return this._super(typeClass, hash, prop);\n}\n```\n\n这个函数非常简单：它将类大写（class-cased）键中的值映射到相应的驼峰命名（camel-cased）键上，然后删除这些条目。\n\
    \n有时你可能想在 `normalize` 函数中执行其他操作，例如删除不需要的数据点或添加新数据。以下代码在负载中分配了一个当前时间的属性。\n\n```javascript\n\
    normalize: function(type, hash, prop) {\n  hash['currentTime'] = new Date();\n\
    \  this._super(type, hash, prop);\n}\n```\n\n这些参数代表了数据类型（即模型类）、要使用的 hash 键名（例如我们之前示例中的\
    \ \"notebooks\"）以及从服务器返回的负载。记住要带上参数调用 `this._super`，以确保父类的 `normalize` 方法被调用，并且你定义的\
    \ `normalizeHash` 操作能够运行。\n\n### 允许 Adapter 查询非传统 API\n\n此时，你对序列化器（serializer）所做的更改将允许你以新\
    \ API 的格式进行保存，但你还无法查询数据。在查询之前，你需要为你的笔记本模型创建一个新的 `RESTAdapter`。开始之前，运行以下命令：\n\n\
    ```\n$ ember generate adapter notebook\n```\n\n这会在 `ember-note/app/adapters/notebook.js`\
    \ 处创建一个存根类。\n\n我们需要创建一个新 adapter 的原因是为了模型类中的属性名与 API 中的属性名之间大小写的差异。如果不创建这个 adapter，查询参数\
    \ `{user : 1}` 将找不到任何记录，因为 API 中的属性名为 `User`。为了解决这个问题，请按照如下方式实现 adapter 类：\n\n\
    `ch6/ember-note/app/adapters/notebook.js`\n\n```javascript\nimport ApplicationAdapter\
    \ from './application';\nimport Ember from 'ember';\n\nexport default ApplicationAdapter.extend({\n\
    \  query: function(store, type, query) {\n    var keys = Object.keys(query);\n\
    \    for(var i = 0; i < keys.length; i++) {\n      var key = keys[i];\n      var\
    \ classifiedKey = Ember.String.classify(key);\n      query[classifiedKey] = query[key];\n\
    \      delete query[key];\n    }\n    return this._super(store, type, query);\n\
    \  }\n});\n```\n\n我们正在扩展 `query` 方法，以便在查询到达服务器之前对其进行拦截。当我们像 notebooks 路由中使用参数哈希进行查询时，adapter\
    \ 上调用的就是这个方法。我们的代码获取了键为驼峰命名的键值对，并将其替换为 API 预期的格式的键值对。然后它将控制权交给父类方法来执行查询。这使得我们的查询能够被\
    \ API 正确识别。如果你登录应用，你应该能够添加新笔记本，并看到新笔记本出现在列表中，就像在我们更改后端 API 之前的一样。\n\n### 适配路径名称（Adapt\
    \ to Path Name）\n\n你不仅可以使用 `RESTAdapter` 更改属性，还可以更改路径。默认情况下，Ember Data 尝试将类名转变为复数形式。由于某些原因，这可能是不准确的。如果是这样，你可以使用\
    \ `pathType`，它的定义如下：\n\n```javascript\npathType: function(type) {\n  if (type\
    \ === 'notebook') {\n    return 'notebooks';\n  }\n}\n```\n\n`pathType` 方法接收类名作为参数，并返回相应的路径。\n\
    \n### 修改负载（Change the Payload）\n\n我们已经涵盖了大部分场景。最后还有一种情况：你可能需要使用一个只能返回复合记录的 API，例如一个包含子记录作为子节点（而不是独立节点）的\
    \ API 响应。\n\n假设对笔记本的查询返回了如下格式的数据：\n\n```json\n{\n  \"notebooks\": {\n    \"id\"\
    : 1,\n    \"title\": \"notebook one\",\n    \"description\": \"description one\"\
    ,\n    \"notes\": [\n      {\n        \"id\": 1,\n        \"title\": \"note one\"\
    ,\n        \"description\": \"description one\"\n      },\n      {\n        \"\
    id\": 2,\n        \"title\": \"note two\",\n        \"description\": \"description\
    \ two\"\n      }\n    ]\n  }\n}\n```\n\n注意，“notes\" 节点嵌套在 \"notebooks\" 对象内部。这并不是\
    \ Ember 预期的负载格式。Ember Data 预期同等信息具有以下负载结构：\n\n```json\n{\n  \"notebooks\": {\n\
    \    \"id\": 1,\n    \"title\": \"notebook one\",\n    \"description\": \"description\
    \ one\",\n    \"notes\": [1, 2]\n  },\n  \"notes\": [\n    {\n      \"id\": 1,\n\
    \      \"title\": \"note one\",\n      \"description\": \"description one\"\n\
    \    },\n    {\n      \"id\": 2,\n      \"title\": \"note two\",\n      \"description\"\
    : \"description two\"\n    }\n  ]\n}\n```\n\n"
