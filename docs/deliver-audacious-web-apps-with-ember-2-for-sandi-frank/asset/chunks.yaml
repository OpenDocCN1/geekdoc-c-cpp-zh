    \ You can accomplish this in a few ways.\n\nFirst, it’s possible to set the value\
    \ in the calling template, like this:\n\n```handlebars\n{{edit-note note=model\
    \ close=\"close\" tagName=\"span\"}}\n```\n\nYou can also set the value in the\
    \ class itself, like this:\n\n```javascript\nimport Ember from 'ember';\n\nexport\
