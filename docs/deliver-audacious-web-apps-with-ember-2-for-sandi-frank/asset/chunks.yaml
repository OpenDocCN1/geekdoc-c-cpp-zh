    \ \"{{ }}\" 字符隔开的代码部分。Handlebars 是 Ember 使用的表达式语言，用于描述 Ember 模板中与 Ember 应用程序代码相关的某些片段。在整书中你会看到很多\
    \ Ember 使用 Handlebars 表达式的示例，它们始终使用“{{ }}\" 字符。Ember 附带了一个编译器，可以将 Handlebars 模板表达式转换为\
    \ DOM 对象，正如我们在编译模板 中看到的那样。\n\n正如我们之前看到的，每个应用都由一个路由层次组成。`application.hbs` 文件中的\
    \ `{{#link-to}}` 表达式用于生成超链接，点击后会将 `register` 路由加载到 `{{outlet}}` 中。\n\n你可能在想 `Application`\
    \ 路由是在哪里定义的。在特定情况下，由于我们没有任何特定的操作处理或数据加载需要执行，我们不需要定义路由类；我们可以简单地依靠 Ember 使用默认行为动态创建路由实现。\n\
    \n到目前我们看到的所有代码都搭建了应用程序的最少配置。现在，让我们看看如何通过构建 `register` 路由为我们的应用添加功能。\n\n### 构建\
    \ Register 路由\n\n正如之前讨论的，`register` 路由将允许用户通过选择用户名来注册 EmberNote 应用程序。当我们使用 CLI\
    \ 创建此路由时，创建了以下文件（注意，这是 `route.js`，与 `router.js` 不同）：\n\n| [ch1/ember-note/app/register/route.js](http://media.pragprog.com/titles/mwjsember/code/ch1/ember-note/app/register/route.js)\
