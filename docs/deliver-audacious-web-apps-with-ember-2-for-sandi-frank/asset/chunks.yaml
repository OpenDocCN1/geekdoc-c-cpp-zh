  trans: "\n\n在 Ember 应用中，你所有的功能都组织在路由（routes）之下。路由本质上是一个 URL 分段，如 *嵌套路由* 所示。因此，我们的下一步是使用\
    \ Ember CLI 来创建一个路由。打开一个新的命令行终端，在你的 `ember-note` 项目根目录下，运行以下命令：\n\n```bash\n$\
    \ ember generate route register --pod\n```\n\n在 `generate` 命令中添加 `--pod` 标志时，会创建一个名为\
    \ `register` 的目录，其中包含了添加你的路由所需的文件：`route.js` 和 `template.hbs`。它们目前是空的，你将根据需要填充它们的内容以创建路由的功能。通常情况下，当你想要按功能组织项目时（即创建一个包含\
    \ `route.js` 和 `template.hbs` 文件的 `register` 目录），而不是按对象类型组织时，你会使用 pod。\n\n早些时候，当你使用\
    \ `ember new` 命令创建应用时，创建了以下四个文件：`index.html`、`app.js`、`router.js` 和 `application.hbs`。随后，`ember\
    \ generate` 命令会编辑你应用目录下的 `router.js` 文件。我们将在使用 Router 类来组织你的应用 中深入探讨这一点，但 `router.js`\
    \ 类用于实现应用内部路由的层次结构。\n\n如果你运行 `ember generate` 命令但漏掉了 `--pod` 标志，Ember CLI 仍然会创建相同的对象，但它不在\
    \ `register` 目录中创建一个名为 `route.js` 的文件，而是在 `route` 目录下创建一个名为 `register.js` 文件。对于我们而言，最好在一个位置看到路由所需的每个文件，因此我们将在本书书中始终使用\
    \ `--pod` 标志。\n\n让我们来看一下到为止创建的每一个文件。\n\n### index.html\n\n该文件是你的应用的起点。它是当你运行 `ember\
    \ new ember-note` 命令时创建的。让我们来看看。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    <meta charset=\"utf-8\">\n<meta http-equiv=\"X-UA-Compatible\" content=\"IE=edge\"\
    >\n<title>EmberNote</title>\n<meta name=\"description\" content=\"\">\n<meta name=\"\
    viewport\" content=\"width=device-width,initial-scale=1\">\n{{content-for 'head'}}\n\
    <link rel=\"stylesheet\" href=\"assets/vendor.css\">\n<link rel=\"stylesheet\"\
    \ href=\"assets/ember-note.css\">\n{{content-for 'head-footer'}}\n</head>\n<body>\n\
    {{content-for 'body'}}\n<script src=\"assets/vendor.js\"></script>\n<script src=\"\
    assets/ember-note.js\"></script>\n{{content-for 'body-footer'}}\n</body>\n</html>\n\
    ```\n\n`index.html` 的大部分内容是创建起始页面的 HTML 模板代码。Ember CLI 添加了两个名为 `vendor.css` 和\
    \ `ember-note.css` 的样式表来美化应用。在本书中我们不会对样式表做太多操作，但你应该知道 `vendor.css` 将捕获你引入应用的任何第三方代码中使用的样式，而\
    \ `ember-note.css` 用于你定义的样式。\n\n`vendor.js` 和 `ember-note.js` 的情况也是如此的。Ember CLI\
    \ 构建过程会为你在应用中使用的所有第三方代码创建一个文件，名为 `vendor.js`，并为你的应用代码创建一个文件，名为 `ember-note.js`。它们包含在\
    \ `index.html` 中。\n\n你可能还会注意到 `{{content-for}}` 表达式。这些允许你使用 Ember CLI 插件在页面中包含额外内容。\n\
    \n### app.js\n\n`app.js` 文件用于创建 Ember 环境。看看下面的代码：\n\n```javascript\nimport Ember\
    \ from 'ember';\nimport Resolver from 'ember/resolver';\nimport loadizers from\
    \ 'ember/initializers';\nimport config from './config/environment';\n\nvar App;\n\
    \nApp = Ember.Application({\n  modulePrefix: config.modulePrefix,\n  podPrefix:\
    \ config.podPrefix,\n  resolver: Resolver\n});\n\nloadizers(App, config.modulePrefix);\n\
    \nexport default App;\n```\n\n如果你是一个还没有看过 ECMAScript 2015 的资深开发者，前几行可能会让你大掉下巴。ECMAScript\
    \ 是 ECMA 国际组织指定的 JavaScript 语言的正式名称，而 ECMAScript 2015（也称为 ES6）是该标准的最新发布。当你开始以模块化的方式编写代码时。\n\
    \n`app.js` 中代码的目的是设置应用范围内的构造。其中一个 `Resolver` 用于在整个应用中查找类。`modulePrefix` 变量被设置为\
    \ `ember-note`，如你在设置应用时定义的那样。`podPrefix` 没有设置，因为我们的项目配置中尚未定义，而该配置是从 `config/environment`\
    \ 读取的。\n\n### router.js\n\n`router.js` 文件是你可以真正开始看到 Ember 如何工作的地方。Ember 最基础的功能之一是路由（route）的概念。简单来说，路由是应用中的一个位置。如果你将应用视为页面或页面区域的集合，每个区域嵌套在另一个内部，那么每个页面都对应一个路由。而位于\
    \ `router.js` 中定义的 `Router` 类就是你定义应用结构的地方。让我们来看看：\n\n```javascript\nimport Ember\
    \ from 'ember';\nimport config from './config/environment';\n\nvar Router = Ember.Router.extend({\n\
    \  location: config.locationType\n});\n\nRouter.map(function() {\n  this.route('register');\n\
    });\n\nexport default Router;\n```\n\n"
- fmt: "\nBut `Router.map` is where the real action happens. As you can see, we’ve\
    \ already created a route called `register`. This route was added to the `Router`\
    \ when we ran the `ember generate route register --pod` command. A number of other\
    \ files were also generated, and we’ll edit those files to create our registration\
    \ feature in a moment. The `register` route appears to be a top-level route, but\
    \ is actually at the first level of child routes beneath a default route for the\
    \ application. Let’s look at that default route by way of its associated template.\n\
    \n#### application.hbs\n\nEach application has a root route, the `Application`\
    \ route. Further, each route corresponds to exactly one template. A template is\
    \ a chunk of your user interface. In the case of the `application` route, this\
    \ template is defined in `application.hbs`. Let’s modify this template now to\
    \ look like the following:\n\n| [ch1/ember-note/app/templates/application.hbs](http://media.pragprog.com/titles/mwjsember/code/ch1/ember-note/app/templates/application.hbs)\
    \ |\n| :--- |\n| `<div class=\"container\">` |\n| `<div class=\"row\">` |\n| `<div\
    \ class=\"col-md-2\">` |\n| Welcome to EmberNote |\n| `</div>` |\n| `<div class=\"\
    col-md-10\">` |\n| `{{#link-to 'register'}}register{{/link-to}}` |\n| `</div>`\
    \ |\n| `</div>` |\n| `<div class=\"row\">` |\n| `<div>` |\n| `{{outlet}}` |\n\
