    # 第 9 章：构建和使用 Ember 插件


    在整本书中，我们看到了许多 `Ember` 插件的示例。插件是用于 `Ember` 应用程序的模块化代码段。插件可以让你的工作变得更容易，而围绕创建和共享
    `Ember` 插件的社区精神是使用 `Ember` 最具吸引力的原因之一。


    在本章中，我们将深入研究插件的生命周期。首先，你将学习如何安装插件，我们之前在嵌套组件 中已经提到过，但稍后我们会进行更详细的介绍。接下来，我们将讨论如何开发自己的插件，然后让其他
    `Ember` 开发者可以使用它，这样你就可以分享你制作的酷东西了。没有什么比回馈社区更令人满足感的了（除非是制作了被广泛使用的东西而获得的炫耀权利）。


    首先，让我们回顾如何将插件安装到我们的应用中。


    ## 安装 Ember 插件


    从技术上讲，Ember 插件并不是 `Ember` 的功能，而是 `Ember CLI` 的。这种区别很重要，因为如果你决定在不使用 `Ember CLI`
    的情况下使用 `Ember`，本章将不再适用。如果你想要插件，你需要 `Ember CLI`。


    当你查看如何获取 `Ember` 插件时，这一点就显而易见了。我们已经在嵌套组件 中做过一次，当时我们引入了 `ember-showdown` 插件来格式化文本。为了获取该插件，我们在
    `ember-note` 目录下运行了以下命令：


    ```

    $ ember install ember-showdown

    ```


    当你运行此命令时，`Ember CLI` 会在 npm 数据库中搜索所需的插件并将其安装到项目的 `node_modules` 目录中。你可以像使用其他代码一样使用该插件。插件的文档（通常包含在
    `README.md` 文件中）应该描述如何使用该插件。


    发现可用插件有多种方法。我的偏好（我在写这本书时经常使用）是通过 Ember Observer。1 Ember Observer 提供了一个存储在 npm
    中的插件目录，但通过对这些插件进行评分来评估它们的健康状况和成熟度。这些指标告诉你插件是否开源、代码、测试和文档的质量、插件持续集成实践的质量、插件是否活跃维护以及插件在
    GitHub 上的人气。一旦找到了你想使用的插件，`README.md` 文件通常会告诉你如何使用。


    ## 开发你自己的插件


    如果你使用 `Ember` 和 `Ember CLI` 足够久，你会发现你需要在应用之间共享代码，无论是让多个应用指向私有 Git 仓库中的插件，还是通过
    npm 公开发发布你的插件。我们已经看到了如何在应用内获取和使用第三方插件。现在，让我们讨论如何创建一个可以在应用间共享甚至供他人使用的插件。


    Ember 插件的一个自然用途是创建一个复用的 Web 组件库。存在许多此类库包含复用的 Web 控件，如按钮或菜单栏；我们在书中讨论过几个。让我们现在就开始创建一个小型库，包含单个控件：一个
    Bootstrap 风格的下拉列表，我们将用它来替换 EmberNote 应用中的笔记本列表，改为笔记本记录的下拉列表。当用户从列表中选择一项时，该下拉列表将切换到选定的笔记本。


    我们将首先使用 Ember CLI 创建插件的基本结构。


    ### 创建插件


