    # 使用循环和条件语句控制模板


    Ember 有多种不同的方法来控制模板中显示的内容。其中一种构造是 `{{if}}` 表达式。`{{if}}` 表达式根据提供的属性为真，还是为假、null、未定义（undefined）或空数组
    `[]`，来渲染模板的一个区域（或不渲染）。哦，JavaScript 的特性。）


    要使用 `{{if}}` 表达式，你需要像这样将你想要条件包含的代码块围起来：


    | ​  | {{#if condition}} |

    | ​  | <div>HELLO</div> |

    | ​  | {{else}} |

    | ​  | <div>never mind</div> |

    | ​  | {{/if}} |


    Ember 将这种表达式称为**块级表达式（block expression）**，因为一段模板代码被该表达式所包围。块级表达式需要一个开始标签和一个结束标签（例如
    `{{#if}}` 和 `{{/if}}`）。在这种情况下，如果 `condition` 为真，将渲染“HELLO”；否则将渲染“never mind”。


    Ember 还允许你将条件链在一起，而不是将它们嵌套在 `{{else}}` 块中。如果你有两个、三个或四十七个需要链在一起的条件，你可以这样做：


    | ​  | {{#if condition}} |

    | ​  | <div>HELLO</div> |

    | ​  | {{else if condition2}} |

    | ​  | <div>never mind</div> |

    | ​  | {{else if condition3}} |

    | ​  | <div>WAT</div> |

    | ​  | {{else}} |

    | ​  | <div>go away</div> |

    | ​  | {{/if}} |


    你也可以通过使用内联 if（inline if）来简化标准的 `{{if}}` 语法：


    `{{if condition ''on'' ''off''}}`


    内联条件的第二个第三三个参数可以包含属性或字符串，但仅此而已。`{{if}}` 表达式有一个兄弟表达式叫做 `{{unless}}`。当你只有一个执行结果需要渲染表达式的主体，且你不希望通过对条件进行“否定”（not）操作来让事情变得复杂时，请使用此表达式：


    | ​  | {{unless hasChrome}} |

    | ​  | 运行此应用需要 Chrome 浏览器。 |

    | ​  | {{/unless}} |


    除非用户拥有 Chrome 浏览器，否则将显示仅限使用 Chrome 的警告。`hasChrome` 变量是由底层模型或路由属性提供的值，并不是 Ember
    的标准部分。是的，你也可以使用 `{{if}}`，但这种表达式和属性的组合读起来更清晰一些。你会发现我们在 `application.hbs` 模板中使用了这些表达式。


    在本章早些时候，你已经看到过使用 `{{each}}` 遍历项目列表的代码，所以我不再重复它。我提醒你，`{{each}}` 要求你的控制器引用一个记录列表作为它的模型。


    # 绑定输入字段


    到目前为止我们看到的每个表达式都是为了显示静态文本。Ember 的许多强大之处源于它将可编辑字段链接到控制器（controller）的能力，因此我们也需要使用输入字段。让我们现在更新示例以使用输入字段。


    首先查看笔记本模板：


    `ch3/ember-note/app/notebooks/template.hbs`


    | ​  | title: {{input value=title}} |

    | ​  | <button {{action ''addNotebook''}}>Add</button> |


    像这样的极简 `{{input}}` 表达式会渲染以下 HTML：


    `<input type="text" value="Notebook Title" />`


    我们没有显式地为输入字段定义类型，但 Ember 默认将其设置为 "text"。另一个选项是显式设置，如下：


    `{{input type="text" value=title}}`


    这渲染等效的 HTML。如果你仔细观察，会发现 `type` 属性被设置为带引号的字符串，而 `value` 被设置为不带引号的字符串。这种区别非常重要。带引号的字符串将按照字面量在
    HTML 中渲染；不带引号的字符串将渲染给定控制器属性的值。


    输入输入字段还可以设置以下 HTML 属性：


    `accept`, `autocomplete`, `autofocus`, `autosave`, `disabled`, `form`, `formaction`,
    `formenctype`, `formmethod`, `formnovalidate`, `formtarget`, `height`, `inputmode`,
    `max`, `maxlength`, `min`, `multiple`, `name`, `pattern`, `placeholder`, `readonly`,
    `required`, `selectionDirection`, `size`, `spellcheck`, `step`, `tabindex`, `value`,
    `width`。


    除了 HTML 属性外，`{{input}}` 表达式支持事件处理器，或者在 Ember 中被称为**动作（actions）**。你可以这样从你的 `{{input}}`
    表达式链接到动作：


    `{{input type="text" value=name action="execute"}}`


    在在上一个示例中，`value` 属性绑定到底层控制器的变量上。`value` 可能是绑定的也可能是未绑定的。如果设置为控制器属性，则不需要引号；否则它们将被设置为提供的任何值。可以绑定以下事件：


    *   `enter`

    *   `escape-press`

    *   `focus-in`

    *   `focus-out`

    *   `insert-newline`

    *   `key-press`

    *   `newline`

    *   `name`

    *   `onclick`

    *   `onchange`

    *   `keydown`

    *   `keypress`

    *   `blur`

    *   `input`

    *   `mousedown`

    *   `mouseup`

    *   `mouseenter`

    *   `mouseout`

    *   `contextmenu`

    *   `onload`

    *   `scroll`

    *   `wheel`

    *   `copy`

    *   `cut`

    *   `paste`


    等等，让我们重新关注 `{{input}}` 表达式。`{{input}}` 表达式还可以通过将 `type` 设置为 `checkbox` 来渲染复选框。与文本类型类似，它有很多可配置属性。总之，以下
    HTML 属性可用于 `{{input}}` 表达式：


    *   `autofocus`

    *   `checked`

    *   `disabled`

    *   `name`

    *   `tabindex`


    有时你想在一个字段中捕捉更多的文本。在这种情况下可以使用 `{{textarea}}` 表达式。`{{textarea}}` 的工作方式与 `{{input}}`
    类似，值绑定到属性。


    `{{textarea value=property rows=5 cols=40}}`


    你看到我们设置了一些 HTML 属性：`rows` 和 `cols`。与一样，如果设置为控制器属性，它们将取值；否则它们将被设置为提供的任何值。总之，以下
    HTML 属性可用于 `{{textarea}}` 表达式：


    *   `autofocus`

    *   `cols`

    *   `disabled`

    *   `form`

    *   `maxlength`

    *   `name`

    *   `placeholder`

    *   `readonly`

    *   `required`

    *   `rows`

    *   `selectionDirection`

    *   `selectionEnd`

    *   `selectionStart`

    *   `spellcheck`

    *   `value`

    *   `wrap`


    这些是将属性链接到用户界面的三种最基本的方法。你可能认为这有局限性，如果这是 Ember 中创建复用控件的唯一方法，确实如此。然而还有另一种方法，我们将在下一章节看到。


    # 将动作绑定到路由


    你的用户界面需要做两件事：显示数据和响应用户输入。我们已经看了第一个；现在开始第二个。


    你的路由（Route）与你的模板有一一对应的关系，它有一组供模板使用的函数，称为动作（actions）。正如你预期的那样，Ember 有一种表达式可以将 HTML
    元素动作与路由链接：`{{action}}` 表达式。


