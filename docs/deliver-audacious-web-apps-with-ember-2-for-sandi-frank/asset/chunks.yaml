    \ the user record stored in the session when we save a new notebook.\n\nIf the\
    \ `serialize` method takes data from Ember Data’s expected format and converts\
    \ it so the API can consume it, the `normalize` method does the opposite. We’re\
    \ already making use of this in our `RESTSerializer`. Let’s see how.\n\n### Normalizing\
    \ Data\n\nThe `normalize` method is defined in the base implementation of `RESTSerializer`.\
    \ It is this implementation that we rely on. Because we’re performing a fairly\
    \ straightforward normalization of our data and changing the case of the keys,\
    \ all we need to do is define this function. Let’s look again at the code:\n\n\
    ```javascript\nnormalize: function(typeClass, hash, prop) {\n  hash.title = hash.Title;\n\
    \  delete hash.Title;\n  hash.user = hash.User;\n  delete hash.User;\n  return\
    \ this._super(typeClass, hash, prop);\n}\n```\n\nThis function is simple: it maps\
    \ the values held in class-cased keys onto the corresponding camel-cased keys,\
    \ then deletes the class-cased entries.\n\nAt times there may be other work that\
    \ you want to do in the `normalize` function, such as deleting unnecessary data\
    \ points or adding new data. The following assigns a property in your payload\
    \ with the current time.\n\n```javascript\nnormalize: function(type, hash, prop)\
    \ {\n  hash['currentTime'] = new Date();\n  this._super(type, hash, prop);\n}\n\
    ```\n\nThese parameters represent the data type (that is, the model class), the\
    \ name of the hash key to use (such as \"notebooks\" in our previous example),\
    \ and the payload returned from the server. It’s important to remember to call\
    \ `this._super` with the parameters to ensure that the superclass `normalize`\
    \ method is called and your defined `normalizeHash` operations are run.\n\n###\
    \ Allow the Adapter to Query a Nonconventional API\n\nAt this point, the changes\
    \ you’ve made to the serializer will let you save into the new API’s format, but\
    \ you won’t be able to query data. Before you can query, you need to create a\
    \ new `RESTAdapter` for your notebook model. To begin, run the following command:\n\
    \n```\n$ ember generate adapter notebook\n```\n\nThis creates a stub class at\
    \ `ember-note/app/adapters/notebook.js`.\n\nThe reason we need to create a new\
    \ adapter is to account for the difference in case between the attribute names\
    \ in our model class and the attribute names in the API. Without creating this\
    \ adapter, a query parameter of `{user : 1}` will find no records because the\
    \ attribute in the API is called `User`. To address this, implement the adapter\
    \ class as follows:\n\n`ch6/ember-note/app/adapters/notebook.js`\n\n```javascript\n\
    import ApplicationAdapter from './application';\nimport Ember from 'ember';\n\n\
    export default ApplicationAdapter.extend({\n  query: function(store, type, query)\
    \ {\n    var keys = Object.keys(query);\n    for(var i = 0; i < keys.length; i++)\
    \ {\n      var key = keys[i];\n      var classifiedKey = Ember.String.classify(key);\n\
    \      query[classifiedKey] = query[key];\n      delete query[key];\n    }\n \
    \   return this._super(store, type, query);\n  }\n});\n```\n\nWe’re extending\
    \ the `query` method to intercept queries before they get to the server. This\
    \ is the method that’s called on the adapter when we query using a parameter hash,\
    \ as we do in the notebooks route. Our code takes the key-value pairs with the\
    \ keys in camel-case, and replaces them with key-value pairs in the case expected\
    \ by the API. It then passes control to the superclass method to execute the query.\
    \ This enables our query to be properly recognized by the API. If you log in to\
    \ the app, you should be able to add new notebooks, and see the new notebooks\
    \ appear in your list, just as they did before we changed the back-end API.\n\n\
