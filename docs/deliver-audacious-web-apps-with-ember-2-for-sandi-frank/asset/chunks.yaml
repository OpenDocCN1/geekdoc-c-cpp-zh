    is that it’s possible to access certain common objects in various parts of the
    framework by using injection in some app-wide context.


    In this case, the saveNote function is simply responsible for saving the note
    record. It relies on the fact that the note record comes with its own save logic,
    and calls that function.


    In the template, the following line of code links the saveNote action to the save
    button:


    | [ch4/ember-note/app/components/edit-note/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch4/ember-note/app/components/edit-note/template.hbs)
    |


    | ​  | ​**<button**​ {{action "saveNote"}}​**>**​save​**</button>**​ |


    Like with a garden-variety template/route pairing, clicking this button executes
    the saveNote action.


    Component-scoped actions, such as saveNote, have a somewhat more limited use case
    than referred actions. They can only operate on data that’s in the component’s
    scope (that is, data that was passed in by the calling template), or on injected
    objects. If you’re okay being bound by those restrictions, then it’s a good idea
    to keep as much of the component’s logic self-contained as possible.


    However, if you’d like to defer to the calling route/template to define the actual
    behavior, you can do that using a sent action.


    ### Sending Actions


    Ember components also provide the ability to link the component’s template to
    an action in the calling route, or further up the route hierarchy. A sent action
    is this ability. We’ll define one in edit-note.


    At first glance, the closeNote action looks no different than the saveNote action.
    However, rather than executing in the component context, it uses the sendAction
    method to request that the containing route handle the action. Let’s follow this
    code through the various classes and templates it affects.


    First, in the edit-note template, the following code is used to map the action
    to the close button:


    | [ch4/ember-note/app/components/edit-note/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch4/ember-note/app/components/edit-note/template.hbs)
    |


    | ​  | ​**<button**​ {{action "closeNote"}}​**>**​close​**</button>**​ |


    This results in the underlying closeNote function being called in the component’s
    action map. That function looks like this:


    | [ch4/ember-note/app/components/edit-note/component.js](http://media.pragprog.com/titles/mwjsember/code/ch4/ember-note/app/components/edit-note/component.js)
    |


    | ​  | closeNote: ​**function**​() { |


    | ​  | this.sendAction(​*''close''*​); |


    | ​  | } |


    This is where it gets interesting—and powerful. The sendAction method takes a
    string parameter, but that string isn’t the name of the function that will be
    called on the containing route. It’s actually the value of the component’s property,
    which was set by the containing template, and which points to the function on
    the containing route. Here’s what the containing template looks like:


    | [ch4/ember-note/app/notebooks/notes/note/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch4/ember-note/app/notebooks/notes/note/template.hbs)
    |


    | ​  | {{edit-note note=model close="close"}} |


    On the left side of the close="close" assignment, we define the name of the component
    parameter we’ll use to hold the action. This matches the string passed to sendAction
    in the closeNote action. On the right side of the assignment, we use the name
    of the action in the route. The underlying route should look like this:


    | [ch4/ember-note/app/notebooks/notes/note/route.js](http://media.pragprog.com/titles/mwjsember/code/ch4/ember-note/app/notebooks/notes/note/route.js)
    |


    | ​  | ​**import**​ Ember from ​*''ember''*​; |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ Ember.Route.extend({ |


    | ​  | model: ​**function**​(params) { |


    | ​  | ​**return**​ this.store.findRecord(​*''note''*​, params.note_id); |


    | ​  | }, |


    | ​  |  |


    | ​  | actions: { |


    | ​  | close: ​**function**​() { |


    | ​  | this.transitionTo(​*''notebooks.notes''*​); |


    | ​  | } |


    | ​  | } |


    | ​  | }); |


    You see the close action defined here. In this case, it defines a simple route
    transition, with the effect of moving one step upward in the route hierarchy,
    and closing out the edit-note screen in the process.


    As mentioned earlier, this is a very powerful construct. In essence, sendAction
    allows you to define a component with placeholder actions, the exact result of
    which can be determined by the containing route. This adds greatly to the reuse
    of components, because it allows them to be used in different contexts but still
    describe part of the behavior, while allowing the calling context to fill in the
    details.


    The sendAction method has one other wrinkle. If you call sendAction without passing
    a string parameter indicating the name of the property, the method assumes you’re
    looking for an action defined with the property name action, and acts accordingly.
    This might be useful in cases when a component is likely to have just one associated
    action, but I prefer the named property form of the method, as I think it adds
    clarity.


    As we’ve seen, components are able to respond to actions either by defining the
    behavior explicitly within the component or by referring the action to the component’s
    calling context. You’ll use both of these, depending on your needs. Before we
    wrap up our discussion on components, let’s take a look at one more way for a
    component to respond to user events.


    ### Listening for Events


    Using an action to respond to events is a simple way to link logic to a component.
    It’s also possible to execute code in an event-driven manner.


    In Ember every component is based on the Ember.View class, even the ones like
    {{input}} that ship with the framework. We haven’t touched on views because they
    aren’t a concept you need to know to build apps with Ember. They’re important
    mainly if you’re developing the Ember framework.


    In this case, though, knowing about views is helpful. Because each component is
    based on a view, you can respond to any event that a view can respond to. For
    instance, if you’re designing a stateful <div> tag, you might want to handle the
    click event, and change the state of your <div> when the click occurs, like this:


    | ​  | ​**import**​ Ember from ​*''ember''*​; |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ Ember.Component.extend({ |


    | ​  | click: ​**function**​(event) { |


    | ​  | ​*//Change the state here*​ |


    | ​  | } |


    | ​  | }); |


    This offers you another means of responding to user input in your component. By
    relying on the view, you gain access to a variety of events, which are too numerous
    to list here.^([[8]](#f_0034.html_FOOTNOTE-8))


    Ember Addon: Ember CLI Materialize


    Components are all about taking a commonly used snippet of HTML from your app,
    extracting it into a separate object, and reusing that object throughout. When
    you add a CSS stylesheet to that model, you can create a coherent set of user
    interface elements that follow a standardized design.'
