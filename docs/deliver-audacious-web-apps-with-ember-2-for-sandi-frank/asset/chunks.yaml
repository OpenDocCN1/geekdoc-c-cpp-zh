    # 第 5 章：数据建模（Modeling Your Data）


    Ember 作为一个前端 Web 框架可以提供丰富的内容。到为止，我们几乎完全集中在你的应用程序的渲染和导航上。但当你构建应用时，最终会想要包含数据。Ember
    为此提供解决方案：Ember Data。


    Ember Data 将许多功能封装在一个小型库中。它为你的 Web 客户端提供了一种简单的建模方法，在应用中包含简单的记录。它从 RESTful 服务读取数据，缓存加载的数据，并将这些记录持久化回服务器。


    在本章中，你将学习如何使用 Ember Data 从 RESTful 服务访问数据。我们将关注一个设计良好的 RESTful 服务，它对我们的应用程序几乎不需要配置。通过查看我们目前为止向
    EmberNote 添加的所有数据相关代码，你将看到 Ember Data 是如何工作的。让我们从查看目前创建的模型类开始。


    ## 定义你的模型（Define Your Models）


    一个 Ember Data 模型类表示某种持久化存储中的记录。由于我们是在 Web 上工作，这种持久化存储很可能是通过 RESTful API 访问的。一个
    Ember Data 记录是模型类的实例，实际上持有数据；模型仅仅是记录的定义。记录最重要的部分是它所维护的数据。让我们来看看如何定义记录维护哪些数据。


    ### 定义模型的字段（Defining a Model’s Fields）


    与我们创建的每个类一样，我们首先通过运行 Ember CLI 命令来获取类的存根版本以定义模型。在 *添加数据服务* 中，我们运行了以下命令来生成 User
    模型类。


    | | `$ ember generate model user` |


    该类的存根版本没有字段。我们将添加它们，使我们的类看起来像这样：


    | [`ch5/ember-note/app/models/user.js`](http://media.pragprog.com/titles/mwjsember/code/ch5/ember-note/app/models/user.js)
    |

    | | `import DS from ''ember-data'';` |

    | | |

    | | `export default DS.Model.extend({` |

    | | `name: DS.attr(''string'')` |

    | | `});` |


    使用 Ember Data，你的模型定义非常简单。你的模型有一组字段，你可以在类中以键值对的形式定义它们。键（key）是在你在模板内部引用数据的方式（即 `user.name`）。


    当你定义一个字段时，你有几种定义字段类型的选项。如果你正在添加一个用于存储单个值的字段，你将使用 `DS.attr`。调用此函数会在你的模型中创建一个字段。不带参数调用此函数，模型将简单接受传递给它的任何数据类型。


    或者，你可以给它一个类型，称为转换（Transform），Ember Data 将获取你的 API 提供的原始数据并尝试使其符合你提供的类型。这就是我们的
    `user.js` 示例所做的。Ember Data 提供了四个可用的默认选项：`string`、`number`、`Boolean` 和 `date`。如果需要，你可以定义自己的
    Transform 实现，但我们目前用基础知识即可。


    你还可以为你的字段定义一个默认值。例如，如果你对 `DS.attr` 的调用如下所示：


    | | `name: DS.attr("string", {defaultValue: "Matt"})` |


    如果给定的记录没有 `name` 的值，则将使用值 `Matt`。


    ### 定义模型关系（Defining Model Relationships）


    你的模型类可能拥有包含记录（甚至是记录列表）的字段，而不是基本数据类型。Ember Data 通过使用两种构造：`DS.hasMany` 和 `DS.belongsTo`
    使这成为可能。为了看到示例，让我们看看 `notebook.js` 文件：


    | [`ch5/ember-note/app/models/notebook.js`](http://media.pragprog.com/titles/mwjsember/code/ch5/ember-note/app/models/notebook.js)
    |

    | | `import DS from ''ember-data'';` |

    | | |

    | | `export default DS.Model.extend({` |

    | | `title: DS.attr(''string''),` |

    | | `user: DS.belongsTo(''user''),` |

    | | `notes: DS.hasMany(''note'')` |

    | | `});` |


    `hasMany` 和 `belongsTo` 函数都定义了调用类与另一个模型之间的关系。此函数的参数是另一个模型的名称。在笔记本示例中，我们在 `belongsTo`
    中引用用户模型，在 `hasMany` 中引用笔记模型。从语义上来说这是合理的：笔记本属于一个用户并拥有许多笔记。


    ![images/notebook-relationships.png](img/notebook-relationships.png)


    双向遍历模型关系通常是理想的。例如，从笔记的角度，你可以包含一个指向笔记本的 `belongsTo` 关系。而从用户的角度，你可以包含一个指向笔记本的 `hasMany`
    关系。


    当然，模型关系的基数并不总是一对多或多对一。如果你想要一对一关系，只需在两边都使用 `belongsTo` 即可。对于多对多，双方都应该是 `hasMany`。


    现在你对如何定义模型类有了更好的理解，你将需要学习如何填充它们。让我们看看如何从服务器加载数据。


    ## 从 RESTful 服务加载数据（Load Data from RESTful Services）


    当使用 Ember 构建应用程序时，你的数据很可能来自 RESTful 服务。RESTful 服务使用 HTTP 作为数据查询和交付机制。根据 HTTP 请求，它可以被用于向调用逻辑返回数据，或以某种方式修改数据存储。


    Ember 项目非常渴望将 Web 社区的最佳想法引入 Ember 框架，Ember Data 对 RESTful 服务的使用也不例外。通过简单地声明你的模型类，你就可以使用
    `DS.Store` 对象从你的服务器获取数据，假设 RESTful 服务暴露了预期的 API。


    虽然我们不会深入探讨 RESTful 服务的实现，但在本章的其余部分，我们将记录 Ember 发出的请求的 URL。在 *使用序列化器访问旧 API* 中，我们将涵盖如何使用
    Ember Data 不符合预期的 API。


