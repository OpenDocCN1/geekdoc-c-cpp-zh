    \n在 Ember Data 中，序列化器（serializer）是一个类，它接收数据块并将其转换为外部上下文的另一种形式。例如，可以使用序列化器修改属性名称以匹配你预期的格式。你可以获取一个原始\
    \ JSON 负载并更改其结构以匹配你的模型层，或者删除多余信息。你还可以将模型数据序列化回服务器期望的格式并保存。\n\n| 来自 Ember Data\
    \ 的 RESTful 调用 |\n| --- |\n| ![images/aside-icons/important.png](img/important.png)\
