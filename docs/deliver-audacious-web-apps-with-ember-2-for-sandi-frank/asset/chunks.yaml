  trans: "\nEmber 组件是一个非常棒的构意，团队在实现它们方面值得巨大的赞誉。截至本文，W3C 正在制定一项关于自定义元素（custom elements）的规范，这与\
    \ Ember 希望使用组件的方式非常相似。Ember 并没有等待 W3C 确定规范（这可能花费很长时间），而是直接推进了它们的实现。\n\n在 W3C 规范中，自定义元素是由开发者定义的、浏览器能够理解并渲染的\
    \ DOM 元素。它允许开发者为 DOM 元素定义用户界面和操作行为，就像组件实现一样。该规范一旦获得批准，最终将成为 HTML 语言的一部分，从而减少对自定义框架支持的需求。\n\
    \nEmber 团队密切关注标准的制定过程，因此只要你保持更新 Ember 版本，就可以放心认为你的组件在规范发布后将符合规范。正在进行中的规范在 GitHub\
    \ 上编写，你可以随时通过访问 [`w3c.github.io/webcomponents/spec/custom/`](https://w3c.github.io/webcomponents/spec/custom/)\
    \ 来阅读它。如果你感兴趣，可以看一看！\n\n这里还演示了另外三个功能：操作处理、组件嵌套和 `{{yield}}` 标签。我们将在 处理操作 中查看操作处理。接下来我们处理另外两个。\n\
    \n## 组件嵌套\n\n使用 Ember 组件的强大之处很大源于可以将在应用程序中反复出现的 HTML 标签组合，并创建一个捕获该组合的可重用表达式。为了让该功能更加强大，Ember\
    \ 组件是可以嵌套的。也就是说，你可以在一个组件内部调用另一个组件，它可以按照你预期的方式工作。\n\n对于我们新的 `edit-note` 模板，我们已经在这样做了。对\
    \ `{{markdown-to-html markdown=note.body}}` 的引用使用了另一个组件 `markdown-to-html`。我们还没有获取这个组件，所以这个引用将无法工作。\n\
    \n`markdown-to-html` 组件是一个 Ember addon（扩展插件）的一部分。Ember addon 是一个实用到足够、可以在多个应用程序之间共享的库。它可以通过\
    \ npm 公开发布（例如我们正在使用的这种），也可以保留在私有仓库中。我们将在第 9 章介绍更多关于 Ember addon、构建和使用 Ember Addons\
    \ 的内容。\n\n要安装该 addon 组件，请运行以下命令：\n\n```bash\n$ ember install ember-cli-showdown\n\
    ```\n\n此时，如果你的服务器正在运行，你可能需要按 `Ctrl-C` 然后运行 `ember serve` 来重启。当你运行此命令时，EmberNote\
    \ 应用将更新，以包含对 `ember-cli-showdown` addon 的依赖，其中包含了 `markdown-to-html` 组件。该 addon\
    \ 以及任何所需的依赖将被下载，并提供给 Ember CLI 用于与应用程序一起构建和部署。\n\n让我们来看看是如何使用这个 addon 的。在我们的 `edit-note`\
    \ 组件模板中，我们有如下行代码：\n\n```handlebars\n{{markdown-to-html markdown=note.body}}\n\
    ```\n\n就像使用 `{{input}}` 表达式创建文本字段，或使用 `{{edit-note}}` 表达式创建 `edit-note` 组件一样，我们使用\
    \ `{{markdown-to-html}}` 来引用 `markdown-to-html` 组件。这里的不同在于我们将一个组件嵌套在另一个组件内部。因此，我们能够使用的属性数据是已经存在包含组件中的属性数据。\n\
    \n上一个表达式中的 `markdown` 属性用于捕获组件将用来渲染 HTML 的属性。对于一个内容用 Markdown 编写的笔记，该组件将使用该内容，对内容应用\
    \ Markdown 处理器，并渲染生成的 HTML。嵌套组件可以很好地工作，只要你记得在构建子组件时只使用来自父作用域的属性。\n\n现在你已经看到了如何通过嵌套来组合组件，让我们来看看组件如何允许调用模板将内容注入到组件中。\n\
    \n## 使用 Yield 表达式\n\n在 `edit-note` 模板中，我们包含了一个 `{{yield}}` 表达式。该表达式允许调用模板将内容包含到组件中。让我们来看一个例子。\n\
    \n在 `ember-note/app/notebooks/notes/note/template.hbs` 的笔记模板中，进行以下更新：\n\n```handlebars\n\
    {{#edit-note note=model close=\"close\"}}\n  Notebook: {{model.notebook.title}}\n\
    {{/edit-note}}\n```\n\n我们将 `edit-note` 表达式从内联表单改为块形式，并包含了一个主体。该主体将在组件中 `{{yield}}`\
    \ 标签的位置被渲染。然而，它是由笔记模板执行的。\n\n这很重要，因为这意味着你可以访问不同作用域的信息，即调用模板的作用域。在这个例子中，由于我们将整个笔记模型传递给\
    \ `edit-note` 组件，因此它可以看到该模型中的每个字段。但是，如果我们只传递了笔记对象的体（body），那么它就只能看到部分，而只有调用模板才能看到完整的模型对象。\n\
    \n这种作用域（scope）的概念在设计操作时也需要考虑，正如我们很快将看到的。现在，让我们来看看如何调整根元素。\n\n### 修改组件的根元素\n\n\
    当你创建一个组件时，为该组件生成的 HTML 位于一个根元素内部。默认情况下，Ember 使用 `div` 标签作为根元素。然而，在某些情况下，你可能希望将你的组件封装在不同的根元素中。任何\
    \ HTML5 元素都是有效的选择。\n\n要将组件的根元素设置为 `div` 以外的其他内容，你需要设置 `tagName` 属性。你可以通过几种方式实现这一点。\n\
    \n首先，可以在调用模板中设置该值，如下：\n\n```handlebars\n{{edit-note note=model close=\"close\"\
    \ tagName=\"span\"}}\n```\n\n你也可以在类本身中设置值，如下：\n\n```javascript\nimport Ember from\
    \ 'ember';\n\nexport default Ember.Component.extend({\n  tagName: 'span'\n});\n\
    ```\n\n这与在调用模板中设置属性具有相同的效果。如果你同时使用了两种机制但设置了不同的值，则由调用模板设置的值胜出。\n\n我们已经讨论了许多与 Ember\
    \ 组件相关的显示问题。组件还能够定义自包含的操作处理代码。让我们转向那里。\n\n## 处理操作\n\n与组件可以渲染自己的内容并接受来自调用模板（或组件）的内容类似，组件也可以定义自己的操作，也可以将操作引用回调用上下文。\n\
    \n很容易理解为什么会有这个功能。在某些情况下，例如组件 UI 的 UI 操作，你可能倾向于不依赖调用上下文，甚至不让调用上下文看到你正在做什么。在其他情况下，例如导航，你希望调用上下文定义期望的行为。\n\
    \n还有一些用例介于两者之间，例如保存记录。如果你将整个记录传递给组件，你可以在那里保存它。否则，你可能需要在调用上下保存它。\n\n### 调用组件操作\n\
    \n当我们使用 Ember CLI 创建组件时，它会在我们的项目中添加一个名为 `ember-note/app/components/edit-note/component.js`\
    \ 的文件。我们将在这里定义操作处理程序。\n\n打开该文件，添加以下代码：\n"
- fmt: "\n```javascript\n// ch4/ember-note/app/components/edit-note/component.js\n\
    import Ember from 'ember';\n\nexport default Ember.Component.extend({\n  actions:\
    \ {\n    saveNote: function() {\n      this.get('note').save();\n    },\n    closeNote:\
    \ function() {\n      this.sendAction('close');\n    }\n  }\n});\n```\n\nAs you\
    \ can see, there’s not much difference between how we define actions in a component\
    \ and how we define actions in a route. The `actions` hash is used to map functions\
    \ to the names of those functions, just like with a route.\n\nThe action function\
    \ implementations can access any properties that have been passed to the component\
    \ or injected into the component at the class level. We haven’t covered injection\
    \ yet, and we don’t use it here. For now, all you need to know is that it’s possible\
    \ to access certain common objects in various parts of the framework by using\
    \ injection in some app-wide context.\n\nIn this case, the `saveNote` function\
    \ is simply responsible for saving the note record. It relies on the fact that\
    \ the note record comes with its own save logic, and calls that function.\n\n\
    In the template, the following line of code links the `saveNote` action to the\
    \ save button:\n\n```hbs\n<!-- ch4/ember-note/app/components/edit-note/template.hbs\n\
    <button {{action \"saveNote\"}}>save</button>\n```\n\nLike with a garden-variety\
    \ template/route pairing, clicking this button executes the `saveNote` action.\n\
    \nComponent-scoped actions, such as `saveNote`, have a somewhat more limited use\
    \ case than referred actions. They can only operate on data that’s in the component’s\
    \ scope (that is, data that was passed in by the calling template), or on injected\
    \ objects. If you’re okay being bound by those restrictions, then it’s a good\
    \ idea to keep as much of the component’s logic self-contained as possible.\n\n\
    However, if you’d like to defer to the calling route/template to define the actual\
    \ behavior, you can do that using a sent action.\n\n### Sending Actions\n\nEmber\
    \ components also provide the ability to link the component’s template to an action\
    \ in the calling route, or further up the route hierarchy. A sent action is this\
    \ ability. We’ll define one in `edit-note`.\n\nAt first glance, the `closeNote`\
    \ action looks no different than the `saveNote` action. However, rather than executing\
    \ in the component context, it uses the `sendAction` method to request that the\
    \ containing route handle the action. Let’s follow this code through the various\
    \ classes and templates it affects.\n\nFirst, in the `edit-note` template, the\
    \ following code is used to map the action to the close button:\n\n```hbs\n<!--\
    \ ch4/ember-note/app/components/edit-note/template.hbs\n<button {{action \"closeNote\"\
    }}>close</button>\n```\n\nThis results in the underlying `closeNote` function\
    \ being called in the component’s action map. That function looks like this:\n\
    \n```javascript\n// ch4/ember-note/app/components/edit-note/component.js\ncloseNote:\
    \ function() {\n  this.sendAction('close');\n}\n```\n\nThis is where it gets interesting—and\
    \ powerful. The `sendAction` method takes a string parameter, but that string\
    \ isn’t the name of the function that will be called on the containing route.\
    \ It’s actually the value of the component’s property, which was set by the containing\
    \ template, and which points to the function on the containing route. Here’s what\
    \ the containing template looks like:\n\n```hbs\n<!-- ch4/ember-note/app/notebooks/notes/note/template.hbs\n\
    {{edit-note note=model close=\"close\"}}\n```\n\nOn the left side of the `close=\"\
    close\"` assignment, we define the name of the component parameter we’ll use to\
    \ hold the action. This matches the string passed to `sendAction` in the `closeNote`\
    \ action. On the right side of the assignment, we use the name of the action in\
    \ the route. The underlying route should look like this:\n\n```javascript\n//\
    \ ch4/ember-note/app/notebooks/notes/note/route.js\nimport Ember from 'ember';\n\
    \nexport default Ember.Route.extend({\n  model: function(params) {\n    return\
    \ this.store.findRecord('note', params);\n  },\n  actions: {\n    close: function()\
    \ {\n      this.transitionTo('notebooks.notes');\n    }\n  }\n});\n```\n\nYou\
    \ see the `close` action defined here. In this case, it defines a simple transition,\
    \ closing out the edit-note.\n\n### Listening for Events\n\nUsing an action to\
    \ respond to events is a simple way to link logic to a component. It’s also possible\
    \ to execute code in an event-driven manner.\n\nIn Ember every component is based\
    \ on the `Ember.View` class, even the ones like `{{input}}` ship with the framework.\
    \ We haven’t touched on views because they aren’t a concept you need to know to\
    \ build apps with Ember. They’re important mainly if you’re developing the Ember\
    \ framework.\n\nIn this case, though, knowing about views is helpful. Because\
    \ each component is based on a view, you can respond to any event that a view\
    \ can respond to. For instance, if you’re designing a stateful `div` tag, you\
    \ might want to handle the click event, and change the state of your `div` when\
    \ the click occurs, like this:\n\n```javascript\nimport Ember from 'ember';\n\n\
    export default Ember.Component.extend({\n  click: function(event) {\n    // Change\
    \ the state here\n  }\n});\n```\n\nThis offers you another means of responding\
    \ to user input in your component. By relying on the view, you gain access to\
    \ a variety of events, which are too numerous to list here.\n"
