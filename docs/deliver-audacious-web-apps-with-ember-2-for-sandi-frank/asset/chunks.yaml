  trans: "\nEmber 和 Ember CLI 提供了两种在开发期间为应用提供数据的方法：固定件（fixtures）和模拟服务（mock services）。虽然固定件的设置更简单，但模拟服务能够让你更完整地测试代码，因为它要求你实现访问\
    \ RESTful 服务所需的所有内容。因此，我们在本书中使用模拟服务。如果你更关注的是对核心 Ember 类的测试，而不担心数据访问层的测试，你可能考虑使用固定件，固定件本质上是带有硬编码数据和简单访问方法的类。\n\
    \n事实上，我们比模拟服务又更进了一步：我们的服务将在重启后持久化数据，这样当我们在我们构建应用时，我们还能看到数据的累积。Ember CLI 创建的默认模拟服务并不具备这一点，尽管在正常情况下开发应用时这种行为可能更好，但我更希望我们的数据在服务重启后依然存在，这样我们在学习示例时就能保持测试数据。现在，让我们看看模拟服务是如何工作的。\n\
    \n## 创建用户模型\n\n我们首先为用户对象创建一个模型类。目前，我们的用户包含一个数据属性：名称。让我们使用 Ember CLI 生成一个存根类（stub\
    \ class）。\n\n```\n$ ember generate model user\n```\n\n以下是该类，并添加了实现细节：\n\n[ch1/ember-note/app/models/user.js](http://media.pragprog.com/titles/mwjsember/code/ch1/ember-note/app/models/user.js)\n\
    \n```javascript\nimport DS from 'ember-data';\n\nexport default DS.Model.extend({\n\
    \  name: DS.attr('string')\n});\n```\n\n该类依赖 Ember Data 库来创建一个 `Model` 实例，其中只有一个属性名为\
    \ `name`。该属性的类型为字符串，意味着它将持有文本。如此。这就是我们建模用户对象所需的一切。现在，为了与计划创建的服务交互，我们需要一个 `RESTAdapter`\
    \ 和一个 `RESTSerializer`。\n\n 设置适配器和序列化器\n\n要创建 `RESTAdapter`，运行以下命令：\n\n```bash\n\
    $ ember generate adapter application\n```\n\n这创建了一个整个应用程序使用的 `RESTAdapter`，这就是为什么将其命名为\
    \ `application`。现在，编辑生成的文件使其看起来如下所示：\n\n[ch1/ember-note/app/adapters/application.js](http://media.pragprog.com/titles/mwjsember/code/ch1/ember-note/app/adapters/application.js)\n\
    \n```javascript\nimport DS from 'ember-data';\n\nexport default DS.RESTAdapter.extend({\n\
    \  namespace: 'api'\n});\n```\n\n同样，要创建 `RESTSerializer`，运行此命令：\n\n```bash\n$\
    \ ember generate serializer application\n```\n\n生成的类看起来像这样：\n\n[ch1/ember-note/app/serializers/application.js](http://media.pragprog.com/titles/mwjsember/code/ch1/ember-note/app/serializers/application.js)\n\
    \n```javascript\nimport DS from 'ember-data';\n\nexport default DS.RESTSerializer.extend({});\n\
    ```\n\n`RESTAdapter` 只有一个目的：定义服务器上的路径，我们可以在该路径找到我们的 RESTful 服务。`RESTSerializer`\
    \ 是一个空实现，因为我们正在使用默认功能。由于我们将创建一个为每个模型对象暴露预期 API 的服务，这就是我们需要做的全部。我们将在 适配非传统 API\
    \ 和 使用序列化器访问遗留 API 中更多地介绍这些内容。\n\n通常情况下，这就是你 Ember 开发的终点。创建一个提供数据的服务通常不在你使用 Ember\
    \ 开发的范围内，因为 Ember 是一个前端框架，而不是用于开发 REST 服务的。正如我之前所说的，我们正在创建一个应用可以用于测试的模拟服务，然后通过使数据持久化来更进了一步。\n\
    \n## 使数据持久化\n\n为了让我们的数据持久化，我们需要能够做到两件目前还无法做的事情。首先，我们需要一个存放数据的地方。为此，我们将使用 `NEDB`\
    \ 项目，它是一个用于 Node 的嵌入式数据存储。这是一个用于开发数据存储（如我们的）的极棒的工具。对于生产数据存储，你可能需要更健壮的东西。在 `ember-note`\
    \ 目录下运行以下命令（`--save-dev` 标志使该项成为仅开发依赖，而不是生产依赖）：\n\n```bash\n$ npm install nedb\
    \ --save-dev\n```\n\n这使得 `NEDB` 项目可用。当 Ember Data 存储在在注册路由中保存我们的新用户记录时，它会通过 HTTP\
    \ 向我们的模拟服务 `POST` 数据。因此，我们还需要能够解析传入的 HTTP 请求体。获取以下库来实现此操作：\n\n```bash\n$ npm install\
    \ body-parser --save-dev\n```\n\n现在我们准备好运行以下命令来创建我们的模拟服务：\n\n```bash\n$ ember\
    \ generate mock users\n```\n\n服务创建后，我们只需要添加几行代码来使用我们刚刚添加的库，并响应请求。查看以下代码，它实现了数据持久化：\n\
    \n```javascript\nmodule.exports = function(app) {\n  var express = require('express');\n\
    \  var usersRouter = express.Router();\n\n  // 在此服务中使用 body-parser\n  var bodyParser\
    \ = require('body-parser');\n  app.use(bodyParser.json());\n\n  // 如果不存在则创建一个嵌入式表\n\
    \  var nedb = require('nedb');\n  var userDB = new nedb({ filename: 'users', autoload:\
    \ true });\n\n  // POST URL 用于创建记录\n  usersRouter.post('/', function(req, res)\
    \ {\n    // 查找最近创建的记录并用它设置请求 id\n    userDB.find({}).sort({id: -1}).limit(1).exec(function(err,\
    \ users) {\n      if (users.length != 0) {\n        req.body.id = users[0].id\
    \ + 1;\n      } else {\n        req.body.id = 1;\n      }\n\n      // 将新记录插入我们的数据存储，并将新创建的记录返回给\
    \ Ember\n      userDB.insert(req.body, function(err, newUser) {\n        res.status(201);\n\
    \        res.send(JSON.stringify(newUser));\n\n        // 现在我们不会触碰这些由 Ember 创建的其他代码\n\
    \        usersRouter.get('/', function(req, res) {\n          res.send({\n   \
    \         'users': []\n          });\n        });\n\n        usersRouter.get('/:id',\
    \ function(req, res) {\n          res.send({\n            'users': {\n       \
    \       id: req.params.id\n            }\n          });\n        });\n\n     \
    \   usersRouter.put('/:id', function(req, res) {\n        });\n\n        usersRouter.delete('/:id',\
    \ function(req, res) {\n          res.status(204).end();\n        });\n      });\n\
    \    });\n  });\n\n  app.use('/api/users', usersRouter);\n};\n```\n\n到此，我们就准备好尝试我们的注册功能了。如果尚未运行，进入命令行并运行以下命令启动应用（如果已经在运行，你可能需要按\
    \ Ctrl-C 停止它，然后重新启动）：\n\n```bash\n$ ember serve\n```\n\n然后导航到 localhost:4200，点击注册链接，提供用户名并点击\
