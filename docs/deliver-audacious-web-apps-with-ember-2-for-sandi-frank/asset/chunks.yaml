    The changes to the register route are very similar to the changes we made to the
    notes route. First, we need to import the ValidationFunctions mixin. Then we refer
    to it when we extend the Ember.Route, so the mixin will be made part of the new
    route. Then, as we did in the notes route, we call it using this.isValidEmail,
    and proceed with the addNew action if the validation passes. We display a message
    to the user if not.


    While we’ve defined isValidLength and isValidEmail as functions, these properties
    could have just as easily held a value. If they had, the including class (in this
    case, the notes route) would have access to them, just like it has access to the
    functions.


    Ember Addon: Validation


    Our example validation class is great for illustrating the ideas behind a mixin,
    but it’s nowhere near mature. For a much more complete example of how to use a
    mixin to perform validation, check out the ember-validations addon, published
    by Dockyard. Dockyard is a major part of the team behind Ember and Ember CLI.


    To make use of ember-validations within your app, you install it by running the
    following command from your project root:


    | ​  | $ ember install ember-validations |


    This addon makes use of the ability to add properties to a class using a mixin.
    To add validation rules to a class, you initialize a property called validations.
    This property holds a JSON object, consisting of name-value pairs. The names are
    the properties on the class that you wish to validate, and the values are a JSON
    object containing the rules you want to apply to that property. For example, take
    a look at this code from the ember-validations documentation:


    | ​  | ​**export**​ ​**default**​ Ember.Object.extend(EmberValidations.Mixin,{
    |


    | ​  | validations: { |


    | ​  | firstName: { |


    | ​  | presence: true, |


    | ​  | length: { minimum: 5 } |


    | ​  | }, |


    | ​  | age: { |


    | ​  | numericality: true |


    | ​  | } |


    | ​  | } |


    | ​  | }); |


    Adding the validations property to an object, like you’re doing here, activates
    this addon for the object. The validation rules you want to apply are then contained
    in the validations property. The containing object will then be validated to ensure
    that the firstName property is populated and has a minimum length of 5\. The age
    is validated to ensure that it’s a number. There are several other validation
    options, such as format, which is used to test a regular expression, and inclusion,
    which provides a list of values that the property must match.


    Each validation can provide a custom message, and the mixin provides a property
    called isValid to let you know whether or not the object contains valid data.
    This property will be updated each time a property is set. The messages can be
    accessed by referencing a property called errors.propertyName on the object. These
    messages can then be displayed to users to give them a chance to update the property
    value.


    For the complete documentation, take a look at [https://github.com/dockyard/ember-validations](https://github.com/dockyard/ember-validations).


    Mixins are a great way to share code, but Ember has even more to offer. Sometimes,
    you’ll want to share access to state or to services. Ember has a way to do that
    called dependency injection, which you’ll learn about next.


    ## Share Services with Dependency Injection


    The features we’ve covered so far help you implement a sound design by creating
    reusable classes and sharing them across objects. Mixins and utilities are great
    for abstracting behavior, but for more complex abstractions, you’ll want to create
    a service and use dependency injection to sprinkle it throughout your app.


    “Service” can be interpreted to mean different things, so let’s start by defining
    what we mean by a service. A service is a self-contained unit of functionality.
    It provides unrelated objects access to its functionality in a loosely coupled
    way. Ember relies on a few services out of the box. For instance, the application’s
    instance of Ember.Router is a good example of a service: it manages the URL hierarchy
    in a single place and provides access to that hierarchy to other objects, particularly
    instances of Ember.Route, via the this.router property. Another example is Ember
    Data, which is a service that’s made available throughout the app for data access
    via the store property.


    For a service to be made available in a loosely coupled way, Ember needs to provide
    a way to get that service to the objects that need it. It does this via dependency
    injection. Dependency injection is the means of providing a service to the object
    that relies on it. The goal of dependency injection is to provide this service
    in such a way as for the client to have minimal knowledge of the service.


    In the dependency injection pattern, the service (that is, the dependency) is
    instantiated external to the client, and later injected into the client. Ember,
    therefore, needs a place to both instantiate the dependency and inject it into
    the client. Let’s take a look at initializers.


    ### Using Initializers


    To make dependency injection work, Ember must do some work during the initial
    load of the app into the browser. It’s important that this take place very early
    in the app’s life cycle, since the type of services that typically use dependency
    injection are often used in many different places throughout the app. To accomplish
    this, you can use the Ember.Application.initializer function.


    This function accepts an object, whose only requirement is that it define a function
    called initialize. This function is used to perform whatever work you need done
    at startup time.


    We’ve already used initializers in [​*Creating and Injecting a User Session*​](#f_0041.html_session),
    but we’re going to create a second one now to centralize logging behavior. Run
    the following command:


    | ​  | $ ember generate initializer logger |


    When we run this command, Ember CLI creates an empty initializer stub:


    | ​  | ​**export**​ ​**function**​ initialize(​*/* container, application */*​)
    { |


    | ​  | ​*// application.inject(''route'', ''foo'', ''service:foo'');*​ |


    | ​  | } |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ { |


    | ​  | name: ​*''logger''*​, |


    | ​  | initialize: initialize |


    | ​  | }; |


    When your user first opens your app, the initialize function will be run for each
    initializer you’ve created. Of course, you may need to control the order in which
    they run. For that, Ember follows the order you define. If you notice, the initializer
    includes a name attribute.


    You may also use an attribute called before and one called after. Each attribute
    accepts either a string or an array of strings. The before and after attributes
    use the name property of other initializers to determine an execution order. If
    an array is passed to these attributes, then each of the initializers in the array
    is considered.


    Initializers can be used for any app-wide work you need to perform, but one of
    their chief use cases is for dependency injection. Let’s take a look at that now.


    ### Injecting Classes


    When you’re designing your app with a service-based approach in mind, you create
    objects that are made to be reused throughout the app. We’ve seen a few approaches
    to distributing such objects, but my favorite is to use dependency injection.'
