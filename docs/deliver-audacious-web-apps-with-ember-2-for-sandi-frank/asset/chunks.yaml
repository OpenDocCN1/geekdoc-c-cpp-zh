    # 《Deliver Audacious Web Apps with Ember 2》早期好评


    使用 Ember 2 构建大胆的 Web 应用为强大且优雅的 Ember 框架提供了清晰的介绍。想要学习 Ember 或提升 Ember 技能的开发者应该读这本书。


    | → Nell Shamrell-Harrington |

    | | Chef 开发工程师 |


    Ember 带回了 Rails 的乐趣，这次是针对性能良好的单页应用。


    | → Federico Tomassetti |

    | | 软件工程师 |


    如果你考虑在下一个 JavaScript 项目中使用 Ember，请买这本书。每读完一章，我都感觉自己提升了水平。


    | → Stephen Orr |

    | | Impact Applications 高级软件工程师


    # 致谢


    每本书都是幕后努力的结果，特别是当这本书是由第一次作者编写时。以下人员对我创作本书提供了极大帮助。


    感谢 Ember 核心团队和 Ember 社区：感谢你们制作了一个既好学又有趣的产品。因为你们的无私投入，网络变得更好。感谢！


    感谢我的技术评审员 Alessandro Bahgat, Jacob Chae, Javier Collado, Jeremy Frens, Kenneth
    Geisshirt, Alexander Henry, Eric Hung, Jan Nonnen, Stephen Orr, Shreerang Patwardhan,
    Martijn Reuvers, Brian Schau, Nell Shamrell-Harrington, Tibor Simic, Charley Stran,
    Federico Tomassetti, Paul Waring, Nick Watts 以及 Stephen Wolff：感谢你们为这个项目投入的时间和专业知识。你们的建议让这本书比我独自编写的要好得多。


