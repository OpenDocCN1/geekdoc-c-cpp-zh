    \ extensible Ember is. We’ll see more on this in the next chapter.\n\nIn addition\
    \ to the properties we’ve covered, the `RESTAdapter` also allows you to customize\
    \ the hostname used for the API call, like this:\n\n```javascript\nexport default\
    \ DS.RESTAdapter.extend({\n  hostname: 'https://embernote.example.com'\n})\n```\n\
    \nThis is useful in cases when your API might reside on a different subdomain\
    \ from your Ember code.\n\nNow that we’ve seen a good deal of how to customize\
    \ your adapters, let’s take a look at how to translate an idiosyncratic API into\
    \ the conventions Ember Data model classes expect, by making use of `RESTSerializer`.\n\
    \n## Use Serializers to Access Legacy APIs\n\nAs much as we might hope to leave\
    \ them behind, sometimes we need to work with a legacy API. We don’t have to throw\
    \ out our entire model layer, though. By making use of `RESTSerializer`, we can\
    \ take the raw data returned by this API and get it into the form we expect.\n\
    \nWith Ember Data, a serializer is a class that takes a block of data and translates\
    \ it into a different form for an external context. For example, a serializer\
    \ can be used to modify attribute names to match your expected format. You can\
    \ take a raw JSON payload and alter its structure to match your model layer or\
    \ remove extraneous information. And you can serialize your model data back into\
    \ the format the servers expects and save it.\n\n| RESTful Calls from Ember Data\
    \ |\n| --- |\n| ![images/aside-icons/important.png](images/aside-icons/important.png)\
    \ | It’s important to keep in mind that while you can change many things about\
    \ the JSON payloads that move back and forth—and even alter the expected name\
    \ of your endpoint as we’ll see shortly—you’re still using the same HTTP verbs\
    \ to interrogate your API. With `RESTAdapter` and `RESTSerializer`, you can change\
    \ a lot, but your API is still subject to the same conventions in that regard.\
    \ |\n\nNow that we have a parallel API, let’s mess with it a bit more to learn\
    \ how to use these features. Let’s start by implementing the `serialize` and `normalize`\
    \ methods.\n\n### Serializing Data\n\nLet’s make a change to how the notebook\
    \ data type is written to the database. We’ll create a per-type serializer for\
    \ the `notebook` class, so that only this data type is impacted by the changes.\
    \ Run the following Ember CLI command to create this new serializer:\n\n`$ generate\
    \ serializer notebook`\n\nThis command creates an empty stub. Now, let’s assume\
    \ this alternate API uses a different capitalization for attributes: it uses class-case.\
    \ Classes that extend `RESTSerializer` are used to modify data that is obtained\
    \ or sent to the server. Take a look at the serialize method:\n\n[ch6/ember-note/app/serializers/notebook.js](http://media.pragprog.com/titles/mwjsember/code/ch6/ember-note/app/serializers/notebook.js)\n\
    \n```javascript\nimport DS from 'ember-data';\n\nexport default DS.RESTSerializer.extend({\n\
    \  normalize: function(typeClass, hash) {\n    hash.title = hash;\n    delete\
    \ hash.title;\n    hash.user = hash;\n    delete hash.user;\n    return this._super(typeClass,\
    \ hash);\n  },\n  serialize: function(snapshot, options) {\n    var json = {\n\
    \      Title: snapshot.attr('title'),\n      User: snapshot.belongsTo('user').id\n\
