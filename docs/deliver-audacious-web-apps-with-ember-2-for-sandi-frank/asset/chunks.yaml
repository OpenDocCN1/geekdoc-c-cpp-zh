  trans: "\n在处理浏览器端缓存时，你需要意识到其他用户可能已经修改了缓存数据。存储器（store）不会在每次更改发生时都保持更新，因此如果记录可以被他人修改，那么在需要使用它们时从服务器重新加载记录是一个好主意。为了实现这一点，Ember\
    \ Data 为 `findRecord` 和 `findAll` 提供了 `reload` 标记。例如，如果我们想在加载路由（route）时确保获取了共享笔记记录的最新更改，我们应该调用以下代码：\n\
    \n```javascript\nmodel: function(params) {\n  this.store.findRecord(\"note\",\
    \ params.id, { reload:true })\n}\n```\n\n使用 `reload:true` 将始终确保你从服务器获取记录并包含最新的更改。\n\
    \n实现此目的还有第二种方法，假设你已经有了该记录的句柄（handle）。如果记录已加载到缓存中，`findRecord` 会调用该记录实例的 `reload`\
    \ 方法。如果你已经拥有该记录，可以执行以下操作来从服务器刷新该对象：\n\n```javascript\nrecord.reload();\n```\n\n\
    `DS.Store` 还包含一个方法，可以从服务器拉取给定类型的所有记录，无论缓存状态如何。执行此操作，请调用带有 `reload:true` 的 `findAll`\
    \ 方法：\n\n```javascript\nmodel: function(params) {\n  this.store.findAll(\"note\"\
    , { reload:true });\n}\n```\n\n你可能认为，确保拥有最新数据的唯一方法是使用 `reload` 参数。这种说法部分正确，因为\
    \ `findRecord` 和 `findAll` 方法将返回已经缓存在存储器中的记录（如果存在的话）。然而，`DS.Store` 提供了一种从存储器中剔除给定类型所有记录的方法：\n\
    \n```javascript\nmodel: function(param) {\n  // 在查找我的数据之前，刷新缓存\n  this.store.unloadAll(\"\
    note\");\n  // 现在获取我的记录\n  return this.store.query(\"note\", {notebook: param.notebook_id});\n\
    }\n```\n\n调用 `unloadAll` 将为后续的查询方法提供一个干净的起点。当你想要对存储器执行命名参数查询（named-parameter queries），同时确保其返回的结果是服务器的最新数据时，这非常有用。\n\
    \n`DS.Store` 拥有许多方法用于处理服务器 API 以及将 API 调用结果存储在浏览器驻留仓库中。正如你所预期的，它还提供了许多方法在记录加载后处理这些记录。在下一节中，我们将查看如何使用\
    \ Ember Data 来使用从 API 获取的记录。\n\n## 操作记录（Work with Records）\n\n虽然 `DS.Store` 类中的许多方法处理加载和缓存记录列表，但你的应用程序也经常直接处理记录。有时你会使用存储器，有时你会调用记录本身上的的方法。让我们从一个从存储器调用的方法开始，学习如何使用\
    \ Ember 应用程序添加数据。\n\n### 创建记录\n\n为了让用户觉得你的应用程序有用，他们需要能够向持久化存储中添加数据。我们已经在 EmberNote\
    \ 应用中看到了这一点，用户可以在那里添加他们自己的笔记本和笔记。现在我们来看部分代码。在 `notebooks` 路由中，我们添加了一个让用户添加笔记本的功能：\n\
    \n`ch5/ember-note/app/notebooks/route.js`\n\n```javascript\naddNotebook: function()\
    \ {\n  var notebook = this.store.createRecord('notebook', {\n    title: this.controller.get('title'),\n\
    \    user: this.controllerFor('application').get('user')\n  });\n  notebook.save().then(()\
    \ => {\n    console.log('save successful');\n    this.controller.set('title',null);\n\
    \    this.refresh();\n  }, function() {\n    console.log('save failed');\n  });\n\
    }\n```\n\n通过以下代码在存储器中创建新笔记本：`var notebook = this.store.createRecord('notebook',\
    \ {...});`。`createRecord` 方法接受两个参数。第一个参数是你想要创建的记录的模型（model type）。在这种情况下，它是 `notebook`\
    \ 类型。第二个参数是属性列表，由一组键值对组成。键应该与所引模型实现中定义的属性名称匹配。值随后被设置为每个属性的值。在这种情况下，我们从控制器的字段中提取值，并使用它们来填充新记录。\n\
    \n#### 保存新记录\n\n![images/aside-icons/important.png](img/important.png) 重要的是要意识到\
    \ `createRecord` 并不会导致写入持久化存储。此新记录在调用下一块代码之前仅只存在于存储器中。要将此记录写入持久化存储，你必须在目标记录上调用\
    \ `save` 方法。`save` 方法返回一个 `Promise`，它可以解析为成功或失败。当 `Promise` 解析时，结果 `Promise` 上的\
    \ `then` 方法会被调用，当失败时则调用第二个回调。当 `save` 方法被调用时，存储器会准备一个请求。例如，如果我们想创建一个标题为“new note”、描述为“description”且属于\
    \ 12 的笔记，请求将如下所示：\n\n```text\nPOST /api/notes\n{note: \"new note\", body: \"description\"\
    , notebook: \"12\"}\n```\n\n#### 监控请求/响应\n\n![images/aside-icons/tip.png](img/tip.png)\
    \ 当你练习这些示例时，关注请求/响应流量会有帮助。Chrome、Firefox、Safari 和 Internet Explorer 都有内置的开发者工具，允许你观察流量。这对于进一步研究\
    \ Ember Data 非常有用。注意此请求没有请求参数。我们只是向针对模型类型的通用 URL `/api/notes` 发送 POST。该 URL 的\
    \ `POST` 方法专门用于与创建新记录相关的请求，它不用于更新请求，更新请求使用 `PUT` 方法。\n\n现在我们已经看到了如何添加新记录，让我们来看看如何修改现有记录。\n\
    \n#### 更新记录\n\n创建记录和更新记录的方法没有太大区别：你对拥有想要保存的数据记录调用 `save` 方法。主要的区别在于 Ember Data\
    \ 如何将操作转换为 HTTP 请求。\n\n当对已存在于持久化存储中的记录调用 `save` 时，这将产生指向 API 的 HTTP `PUT` 请求。例如，在\
    \ `edit-note` 路由中，我们使用以下操作来保存：\n\n`ch4/ember-note/app/components/edit-note/component.js`\n\
    \n```javascript\nimport Ember from 'ember';\n\nexport default Ember.Component.extend({\n\
    \  actions: {\n    saveNote: function() {\n      this.get('note').save();\n  \
    \  },\n    closeNote: function() {\n      this.sendAction('close');\n    }\n \
    \ }\n});\n```\n\n笔记记录在保存时，会产生类似所示的 HTTP 请求：\n\n```text\nPUT \"/api/notes/12\"\n\
    {note: {title: \"edited note\", body: \"edited description\", notebook: \"12\"\
    }}\n```\n"
