    ### Normalizing Data


    The normalize method is defined in the base implementation of RESTSerializer.
    It is this implementation that we rely on. Because we’re performing a fairly straightforward
    normalization of our data and changing the case of the keys, all we need to do
    is define this function. Let’s look again at the code:


    | ​  | normalize: ​**function**​(typeClass, hash, prop) { |


    | ​  | hash.title = hash.Title; |


    | ​  | ​**delete**​ hash.Title; |


    | ​  | hash.user = hash.User; |


    | ​  | ​**delete**​ hash.User; |


    | ​  | ​**return**​ this._super(typeClass, hash, prop); |


    | ​  | } |


    This function is simple: it maps the values held in class-cased keys onto the
    corresponding camel-cased keys, then deletes the class-cased entries.


    At times there may be other work that you want to do in the normalize function,
    such as deleting unnecessary data points or adding new data. The following assigns
    a property in your payload with the current time.


    | ​  | normalize: ​**function**​(type, hash, prop) { |


    | ​  | hash[​*''currentTime''*​] = ​**new**​ Date(); |


    | ​  | this._super(type, hash, prop); |


    | ​  | } |


    These parameters represent the data type (that is, the model class), the name
    of the hash key to use (such as "notebooks" in our previous example), and the
    payload returned from the server. It’s important to remember to call this._super
    with the parameters to ensure that the superclass normalize method is called and
    your defined normalizeHash operations are run.


    ## Allow the Adapter to Query a Nonconventional API


    At this point, the changes you’ve made to the serializer will let you save into
    the new API’s format, but you won’t be able to query data. Before you can query,
    you need to create a new RESTAdapter for your notebook model. To begin, run the
    following command:


    | ​  | $ ember generate adapter notebook |


    This creates a stub class at ember-note/app/adapters/notebook.js.


    The reason we need to create a new adapter is to account for the difference in
    case between the attribute names in our model class and the attribute names in
    the API. Without creating this adapter, a query parameter of {user : 1} will find
    no records because the attribute in the API is called User. To address this, implement
    the adapter class as follows:


    | [ch6/ember-note/app/adapters/notebook.js](http://media.pragprog.com/titles/mwjsember/code/ch6/ember-note/app/adapters/notebook.js)
    |


    | ​  | ​**import**​ ApplicationAdapter from ​*''./application''*​; |


    | ​  | ​**import**​ Ember from ​*''ember''*​; |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ ApplicationAdapter.extend({ |


    | ​  | query: ​**function**​(store, type, query) { |


    | ​  | ​**var**​ keys = Object.keys(query); |


    | ​  | ​**for**​(​**var**​ i = 0; i < keys.length; i++) { |


    | ​  | ​**var**​ key = keys[i]; |


    | ​  | ​**var**​ classifiedKey = Ember.String.classify(key); |


    | ​  | query[classifiedKey] = query[key]; |


    | ​  | ​**delete**​ query[key]; |


    | ​  | } |


    | ​  | ​**return**​ this._super(store, type, query); |


    | ​  | } |


    | ​  | }); |


    We’re extending the query method to intercept queries before they get to the server.
    This is the method that’s called on the adapter when we query using a parameter
    hash, as we do in the notebooks route. Our code takes the key-value pairs with
    the keys in camel-case, and replaces them with key-value pairs in the case expected
    by the API. It then passes control to the superclass method to execute the query.
    This enables our query to be properly recognized by the API. If you log in to
    the app, you should be able to add new notebooks, and see the new notebooks appear
    in your list, just as they did before we changed the back-end API.


    ## Adapt to Path Name Variations


    Not only is there a means of changing the attribute names using RESTAdapter, but
    you can alter the path to match as well. By default, Ember Data attempts to pluralize
    the name of the class to arrive at the API path, so a model class called notebook
    will use an endpoint path of notebooks. For any number of reasons, this may not
    be accurate. If so, you can use the pathForType method to address this need, like
    this:


    | ​  | pathForType: ​**function**​(type) { |


    | ​  | ​**if**​(type === ​*''notebook''*​) |


    | ​  | ​**return**​ ​*''poorly-named-endpoint''*​; |


    | ​  | } |


    As you can see, this method takes the model class name as an argument, and converts
    it into either a different value altogether or a somehow modified version of the
    name by changing the case, adding underscores, and so forth. This allows you to
    adapt to variations in naming conventions on the endpoint URL.


    ## Change the Payload Root


    There’s a similar method in RESTSerializer that allows you to accept a JSON payload
    from the server and determine the correct type based on the name of the root key.
    Take the following payload:


    | ​  | { |


    | ​  | "Notebooks" : { |


    | ​  | ​*//Your payload data here!*​ |


    | ​  | } |


    | ​  | } |


    If you implement the modelNameFromPayloadKey function, you can alter the value
    of the root key, which allows Ember Data to properly look up the associated model
    class and handle the payload accordingly, like this:


    | ​  | modelNameFromPayloadKey: ​**function**​(root) { |


    | ​  | ​**return**​ Ember.String.camelize(root); |


    | ​  | } |


    This converts "Notebooks" into "notebooks" and allows Ember Data to find the appropriate
    model class to use for the payload.


    Of course, to save back to the server, you’ll need to reverse the action you took
    in modelNameFromPayloadKey. You can implement this in payloadKeyFromModelName:


    | ​  | payloadKeyFromModelName: ​**function**​(modelName) { |


    | ​  | ​**return**​ Ember.String.classify(modelName); |


    | ​  | } |


    This converts "notebooks" back to "Notebooks", which lets you save the payload
    back into a server with that expected format.


    ## Modify the Payload in Flight


    We’ve covered most of the scenarios you’re likely to see when working with a RESTful
    API. There is one last scenario, though. You may need to use an API that is only
    capable of returning composite records, such as an API response that includes
    child records as a child node in your JSON payload, rather than as a separate
    node altogether.


