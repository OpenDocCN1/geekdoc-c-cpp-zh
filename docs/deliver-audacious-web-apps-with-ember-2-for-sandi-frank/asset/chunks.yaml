    \ `serialize` 方法：\n\n[ch6/ember-note/app/serializers/notebook.js](http://media.pragprog.com/titles/mwjsember/code/ch6/ember-note/app/serializers/notebook.js)\n\
    \n```javascript\nimport DS from 'ember-data';\n\nexport default DS.RESTSerializer.extend({\n\
