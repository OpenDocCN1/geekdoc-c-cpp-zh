    致 Pragmatic Bookshelf 团队，包括 Andy Hunt, Dave Thomas, Susannah Davidson Pfalzer,
    Janet Furlow 以及其他对制作做过贡献的同事：你们帮助我将这本书打造成了我们希望大家都能为在上面签下名字感到自豪的作品。


    致我的编辑 Katharine Dvorak：这本书不仅有我的份，也有你的。你的指导和见解对我帮助极大，如果没有它们，这本书的长度会增加一倍，而有用信息却减少一半。我迫不及待要开始下一本书了！


    致我的好朋友兼同期作者 Sharone Williams：感谢你对我因截止日期压力而产生的幻觉表示共鸣。知道你同样在“文字矿场”中拼搏，这种感觉是无法估量的帮助。


    致我的父母：感谢你们为我付出的一切牺牲，并教我努力工作、尝试新事物。我希望你们像我一样为这本书感到自豪。


    最重要的，致我的妻子和儿子：你们的耐心、支持和爱对我意味着一切，没有你们，我既无法开始也无法完成这本书。感谢你们的一切！


    Matt White `matt@mattwhite.co` 2015 年 10 月 版权 ©2015, The Pragmatic Bookshelf。


    # 引言：为什么选择 Ember？


    当你考虑编写一个 Web 应用时，最让你兴奋的是什么？是期待编写框架代码，还是期待为用户交付功能？如果你像我一样，功能才是令人兴奋的部分，而框架的存在是为了服务功能。现在，想象一下，有一组开发者一直在寻找
    Web 应用前端开发的最佳实践，并将他们发现的内容编码成一个框架。想象一下，如果你不再担心编写胶水代码（glue code），而是把时间花在兴奋的事情上，你的工作会有何不同？


    Ember 是一个开源 JavaScript 框架，维护在 `http://emberjs.com` 和 GitHub 上，它能加速 Web 应用的开发。它提供了你所需的大部分前端基础设施，让你能够花费精力创建一个出色的应用程序。如果你使用
    Ember，你将编写更少的代码、更简单的代码。而更简单的代码就是更好的代码。通过在 JavaScript 中引入面向对象的设计原则来帮助你以合理的方式组织代码，Ember
    让你从模块化的角度进行思考。这使得你的应用程序更容易创建和维护。


    在本书中，你将学习如何创建大胆的 Web 应用，并通过让 Ember 承担繁重工作来高效地完成。你将使用 Ember 的路由系统构建具有丰富界面和简单、可共享
    URL 的单页应用。你将创建可重用的 UI 组件和模板，并将它们组合成高度可用的、复杂的应用程序。你将使用 Ember Data 读写 RESTful 服务。你将学习使用
    Ember 插件（addons）来共享代码，并使用他人分享的代码。你将学习使用 Ember CLI 和 QUnit 来组织、构建和测试你的应用程序。


    ## 本书是什么，不是什么


    本书是对 Ember 2、Ember Data 和 Ember CLI 核心功能的简明介绍。这些功能依赖于 Node.js、`npm` 和 Handlebars，但我们不会详细阐述这些依赖项。


    本书不是关于 Ember、Ember Data 或 Ember CLI 的详尽参考书。


    ## 谁应该读这本书？


    本书面向初接触 Ember 的 Web 开发者。如果你使用过 React 或 Angular 等其他框架，或者使用过 jQuery，那么 Ember 的某些部分对你来说应该是熟悉的。


    ## 本书的结构


    在第一章中，我们将首先通过安装 Ember 和 Ember CLI 来搭建开发环境。接下来，我们将开始构建贯穿本书的应用程序。我们将使用 Ember CLI
    创建该应用及其第一个功能：注册页面。最后，我们将通过构建一个用于测试的基础的、感知数据的后端来为该页面提供支持。


    在接下来的三章中，我们将专注于使用 Ember 构建应用程序。在第 5 章和第 6 章中，我们将学习使用 Ember Data。第 7 章讨论 Ember
    的路由系统。第 8 章和第 9 章将通过学习如何使用 Ember CLI 进行构建和部署来结束。


    本书的一个不同之处是，每一章都建立在前一章的基础上。在整书中，我们将一直使用 Ember CLI 进行构建、测试和部署。


    ## 哪里寻求帮助


    本书中的所有代码示例都可以在网上找到。此外，还有一个讨论论坛，你可以在那里提问并提供反馈。


    # 第一章：使用 Ember 启动你的应用程序


    在本章中，我们将通过学习 Ember 和 Ember CLI 的一些核心功能来快速起步。首先，我们将通过安装 Ember 和 Ember CLI 来搭建开发环境。接下来，我们将开始构建贯穿本书的应用程序。我们将使用
    Ember CLI 创建该应用及其第一个功能：注册页面。最后，我们将通过构建一个用于测试的基础的、感知数据的后端来为该页面提供支持。让我们从安装 Ember
    和 Ember CLI 开始吧。


    ## 安装 Ember 和 Ember CLI


    Ember CLI 是用于构建 Ember 应用的命令行界面，它是团队获取框架库的首选方式。通常情况下，Ember 非常关注 Ember 开发者所说的“开发者工程学”（developer
    ergonomics）。他们希望让你作为开发者的生活更轻松。Ember CLI 正是基于这种精神创建。正如你在整书中看到的，Ember CLI 能够轻松处理许多模板化任务，例如构建和部署、执行测试、添加文件以创建新功能等。同样重要的是，它允许对类使用新的基于模块的语法。这大大提高了你代码的清晰度。我们在本书中将使用
    Ember CLI，所以让我们从安装它开始吧。


