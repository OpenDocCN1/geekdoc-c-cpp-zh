    JavaScript 开发。Ember 用于创建浏览器驻留应用。


    首先，让我们安装 `Node` 和 `npm`，以及 `Git`。`Node` 自带了 `npm`，但 `npm` 更新非常频繁，因此有必要确认你拥有的是最新版本。请访问相关网站为你的特定平台安装这些工具的最新版本。你的
    `Node` 安装至少应为 `0.12` 版本以支持 Ember CLI 工具链。如果你已经安装了 `Node`，你可能需要先卸载现有版本。


    后两个安装是 `Bower` 所要求的。`npm` 是一个包管理器，用于构建在 `Node` 中运行的代码，或与在 `Node` 中运行的工具配合。`Git`
    是分布式版本控制系统。请根据各自网站的安装说明安装这三者。


    | 安装 |

    | --- |

    | ![images/aside-icons/tip.png](img/tip.png) | 在安装这些工具的每一个时，你可能希望以管理员用户的身份运行。在
    Linux/BSD/OS X 系统上，你可能需要使用 `sudo` 前缀来执行，而在 Windows 上，你需要以具有管理员权限的用户身份登录。与许多安装过程一样，可能会出现问题，因此如果发生问题，请前往
    [`pragprog.com`](http://pragprog.com) 上的书籍论坛，我们将共同解决。 |


    安装好这些工具后，你可以从命令行获取 `Bower`：


    | | ```bash$ npm install -g bower ``` |


    你应该能看到几行命令输出，表示 `Bower` 及其依赖项已拉取到你的机器上。`-g` 命令选项要求 `Node` 安装 `Bower` 并使其全局可用，而不是将其限制在特定项目中。一旦
    `Bower` 完成安装（你会看到命令输出停止并返回命令提示符），你就可以安装 `PhantomJS`：


    | | ```bash$ npm install -g phantomjs ``` |


    同样，你应该能看到一些命令输出，告诉你 `PhantomJS` 已成功安装。有了这些工具，你就可以准备好获取 Ember CLI 了：


    | | ```bash$ npm install -g ember-cli ``` |


    安装 `Ember CLI` 会导致 Ember 框架库以及 CLI 本身被安装。现在你有了 `Ember` 和 `Ember CLI`，我们可以开始编写代码了。


    # 开始你的应用


    Ember CLI 采用以应用为中心的方法。你做的第一件事是创建应用，你创建的每个模块都是该应用的一部分。因此我们将遵循这种做法，在一个应用的范围内探索 Ember
    的所有核心概念。


    我们将编写一个名为 `EmberNote` 的应用，它是 Evernote（基于网络的笔记应用）的精简克隆。我们的第一步是创建应用的仓库（之所以这样做是因为
    Ember CLI 假设你将使用 `Git` 作为版本控制系统）。


    ### 创建应用仓库


    打开命令提示符，导航到存放代码的位置，并运行以下命令：


    | | ```bash$ ember new ember-note ``` |


    这将为你的应用创建一个新目录。如果出现任何问题，请查看后面的提示。


    | 使用 Ember CLI 创建新项目 |

    | --- |

    | ![images/aside-icons/important.png](img/important.png) | 截至本文时，Ember CLI 在创建新仓库时可能会发生可能的竞态条件。如果你看到类似
    `ENOENT, open ’ember/package.json''` 的错误，你可能遇到了此错误。通常，`ember new` 命令在第二次尝试时会成功。在某些非
    Windows 系统上，你可能看到关于未安装 `watchman` 的控制台警告。Ember CLI 使用 `watchman` 监控你的文件系统变化，并在你开发
    Ember 应用时将其实时部署到本地服务器。有 `watchman` 是好事（即使仅仅是为了避免此错误），但它不是必须的。如果没有 `watchman`，Ember
    CLI 使用一个名为 `NodeWatcher` 的工具实现相同。如果你想安装 `watchman`，请访问 [`facebook.github.io/watchman/docs/install.html`](https://facebook.github.io/watchman/docs/install.html)
    获取特定平台的安装说明。 |


    在我们编写 UI 代码之前，让我们也安装 Bootstrap 样式表，这样我们就可以享受一个看起来不像 20 世纪 90 年初的 UI。在新创建的 `ember-note`
    目录的命令提示符中，运行以下命令：


    | | ```bash$ cd ember-note ``` |

    | | ```bash$ npm install ``` |

    | | ```bash$ bower install ``` |

    | | ```bash$ bower install bootstrap --save ``` |


    然后将这些行添加到 `ember-note/ember-cli-build.js` 中，位于最后一行代码之前：


    | | ```javascriptapp.import(''bower_components/bootstrap/dist/css/bootstrap.css'');
    ``` |

    | | ```javascriptapp.import(''bower_components/bootstrap/dist/js/bootstrap.js'');
    ``` |

    | | ```javascriptapp.import(''bower_components/bootstrap/dist/css/bootstrap.min.css'');
    ``` |


    ### 运行你的应用


    让我们运行应用看看效果。在你的 new-note 目录的命令提示符中，运行以下命令：


    | | ```bash$ ember serve ``` |


    你应该看到一些命令输出，告诉你构建成功且你的应用正在运行在端口 200... |

