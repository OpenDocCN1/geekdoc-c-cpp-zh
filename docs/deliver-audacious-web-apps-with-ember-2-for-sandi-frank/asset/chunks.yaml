    | ​  | { |


    | ​  | "notebooks": { |


    | ​  | "id": 1, |


    | ​  | "title": ​*"notebook one"*​, |


    | ​  | "description": ​*"description one"*​, |


    | ​  | "notes": [{ |


    | ​  | "id": 1, |


    | ​  | "title": ​*"note one"*​, |


    | ​  | "description": ​*"description one"*​ |


    | ​  | },{ |


    | ​  | "id": 2, |


    | ​  | "title": ​*"note two"*​, |


    | ​  | "description": ​*"description two"*​ |


