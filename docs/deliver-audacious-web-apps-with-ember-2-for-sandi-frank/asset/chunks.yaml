  raw: 'In this example, we assume that a user-specific translation object has been
    created and injected into the transform. This will allow us to compute translations
    that use the user’s currency translation rate. The transform itself is simply
    responsible for stepping in when a model requests information in the native currency.
    An example model class that needs to use the transform would look like this:


    | ​  | ​**import**​ DS from ​*"ember-data"*​; |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ DS.Model.extend({ |


    | ​  | toAccount: DS.attr(​*''string''*​), |


    | ​  | fromAccount: DS.attr(​*''string''*​), |


    | ​  | amount: DS.attr(​*''native-currency''*​) ​*// Amount in native currency*​
    |


    | ​  | }); |


    The same data could be represented without using the transform like this:


    | ​  | ​**import**​ DS from ​*"ember-data"*​; |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ DS.Model.extend({ |


    | ​  | toAccount: DS.attr(​*''string''*​), |


    | ​  | fromAccount: DS.attr(​*''string''*​), |


    | ​  | amount: DS.attr(​*''number''*​) ​*// Amount in USD as kept in the data
    store*​ |


    | ​  | }); |


    The transform works both to deserialize the data (that is, translate from its
    stored format to its displayed format), and to serialize the data. This means
    that you can display in your chosen format, but when it’s time to save, the serialize
    function steps in and converts the data back into the appropriate format, to remain
    consistent with the database’s expectations.


    ## Next Steps


    We spent the majority of our time together learning how to build Ember apps. Building
    an app is great, but you want to get it in front of people, right? In the next
    two chapters you’ll learn a bit more about Ember CLI, which helps greatly in the
    deploy and release process. Next up, you’ll learn how to use it to manage dependencies
    and build a deployable artifact from your Ember code. As part of that process,
    we’ll also look at how to use the test hooks Ember CLI provides so that we can
    be confident in our code.


    Copyright © 2015, The Pragmatic Bookshelf.


    # Chapter 8


    Building, Testing, and Deploying Your Ember Apps


    We’ve done a great deal of work so far building our app’s features. But there’s
    another important area we need to address before we’re done. We need to spend
    some time thinking about how to make our app ready for production.


    Ember CLI does a lot of this work for us, but it will help you as a developer
    to understand a little of what’s going on behind the scenes. To begin, we’ll take
    a look at how Ember CLI prepares a usable version of your application from the
    code you create. Then, we’ll spend the majority of this chapter discussing how
    Ember CLI helps you test your app. Last, we’ll take a look at how Ember CLI helps
    you deploy your application.


    Let’s get started by looking at how Ember CLI builds your application code and
    keeps it ready for you to run at a moment’s notice.


    ## Build Your App


    If you’ve worked in JavaScript (or any other software development tool) for long
    you’re probably familiar with one common roadblock: the build system. Like with
    languages, everybody has a different opinion about what is the best build system
    for a given language. Closely related to this choice is your choice of dependency
    management. Choosing a build and dependency management tool is one challenge;
    configuring the chosen toolset is another. Thankfully, Ember CLI elegantly solves
    this issue for you.


    ### Getting Your Dependencies


    When you first install Ember CLI, it includes the most current version of Ember.
    As part of the Ember 2.x release cycle, the Ember core and Ember CLI will synchronize
    release schedules. As such, if you want to upgrade Ember CLI, Ember should follow.
    You can upgrade Ember CLI by running the following commands as an administrative
    user in your project directory:


    | ​  | $ npm uninstall -g ember-cli |


    | ​  | $ npm cache clean |


    | ​  | $ bower cache clean |


    | ​  | $ npm install -g ember-cli |


    | ​  | $ npm install ember-cli --save-dev |


    | ​  | $ ​**rm**​ -rf node_modules bower_components dist tmp |


    | ​  | $ npm install |


    | ​  | $ bower install |


    | ​  | $ ember init |


    The first three commands remove the current version of Ember CLI from the npm
    package management system and clear out related files from both the npm and Bower
    caches. Next, the latest Ember CLI is installed and made available globally (as
    defined by the -g flag), and also installed into your project’s package.json file
    (where we use the --save-dev flag).


    Then, to be safe, we remove the four directories in our app that contain dependencies
    and built versions of our apps. The next two commands reinstall all of the dependencies
    listed in package.json and bower.json into your local components directories.
    Lastly, ember init reruns all of the Ember CLI blueprints against your current
    codebase to look for changes. You’ve used these blueprints every time you’ve run
    ember generate, and because the blueprints can change, it’s good to reapply them.
    The command gives you the chance to approve each diff listed, so you’re aware
    of what’s changed by this command. Be careful here—some of the changes might remove
    code you want to keep, depending on what’s changed in Ember CLI, so it’s best
    to be cautious. You’re using a good version control system, right?


    There may be times when you want to simply update one of your dependencies without
    updating Ember CLI. Because Ember CLI relies on Bower, you can simply install
    an updated dependency by running the following:


    | ​  | $ bower install my-dependency --save |


    This will update your bower.json so the dependency becomes part of your project.


    ### Running Your App Locally


    As you’re coding or changing dependencies, Ember CLI keeps the local deployment
    up to date, assuming you have a running instance launched via the ember serve
    command. Ember CLI builds a locally deployable version of the app, including your
    mock server, and starts this app.


    As we’ve seen throughout the book, when you run the ember serve command, it launches
    the watchman service. When watchman detects a change in one of your app’s files,
    it triggers a rebuild of the app. Further, when you browse to the app, the locally
    deployed version contains a WebSockets client that monitors for changes and reloads
    your app in the browser if necessary. This is pretty handy, particularly when
    you’re coding fast and want to see changes just as fast. One other thing you’ll
    want to do when you’re coding fast is to write test cases. We’ll see how to do
    that now.


    ## Test and Debug Your App


    I’ve been keeping a little secret this whole time. Ember CLI doesn’t just generate
    your classes for you when you run an ember generate. It generates test harnesses
    for you as well. In fact, they are complete enough to be runnable (though they
    don’t offer much in the way of coverage). If you’re among those who have had a
    hard time in the past with applying good testing practices to your JavaScript
    client code, your last excuse just fell away.


    ### Test Execution


    Let’s start by reviewing the current test results for the tests that Ember CLI
    has created as we work. Open a command prompt, navigate to the root of the EmberNote
    project, and run the following:


    | ​  | $ ember test |


    When you run this command, you should see your console filling with output. Ember
    CLI will first build your app, then run the tests it has been generating throughout
    your work.


    There’s a second way to view your tests. From the same command prompt, press Ctrl-C,
    which halts the paused output of ember test. It should report a few failing tests,
    which we’ll get to in a moment. First, run ember serve from the command line.
    Then, point your browser at localhost:4200/tests.'
