    \ 字段允许我们输入名称。`<button {{action 'addNew'}}` 触发 `addNew` 操作。`{{message}}` 字段显示状态。`{{input}}`\
    \ 字段允许我们输入名称。`<button {{action 'addNew'}}` 触发 `addNew` 操作。`{{message}}` 字段显示状态。`{{input}}`\
    \ 字段允许我们输入名称。...（此处由于原文重复，已按要求处理）\n\n修改 register 路由，使其看起来如下：\n\n我们在这里还依赖于一些新的\
    \ ES2015 语法。代码 `() =>` 被称为箭头函数，它能让我们在 `then` 函数体内部继续使用 `this`，并且 `this` 将继续指向路由对象。`createRecord`\
    \ 的调用使用 Ember Data 框架创建一个模型对象的新实例，随后的 `save` 调用将把该记录保存到持久化存储中。Ember Data 提供了通过\
    \ RESTful 服务访问数据的能力。在测试所有这些之前，我们需要为 Ember Data 设置一个模拟服务，以及一个使用这些数据的模型对象。现在就开始吧。\n\
    \n修改 register 路由，使其看起来如下：\n\n```javascript\nimport Ember from 'ember';\n\nexport\
    \ default Ember.Route.extend({\n  actions: {\n    addNew: function() {\n     \
    \ var user = this.store.createRecord('user', {\n        name: this.controller.get('name')\n\
    \      });\n      user.save().then(() => {\n        console.log('save successful');\n\
    \        this.controller.set('message', 'A new user with the name ' + this.controller.get('name')\
    \ + ' was added!');\n        this.controller.set('name',null);\n      }, function()\
    \ {\n        console.log('save failed');\n      });\n    }\n  }\n});\n```\n\n\
    我们在这里做的第一件事是给路由添加一个 `actions` 哈希。hash 是一个键值对列表。在这种情况下，键是函数名，值是函数定义。我们有一个函数，`addNew`。这个函数将在我们点击用户界面中的按钮时被调用，因为它是像模板中那样定义的。\n"
- fmt: "\nEmber and Ember CLI offer two ways to provide data to your app during development:\
    \ fixtures and mock services. While fixtures are easier to set up, mock services\
    \ offer you the ability to more fully test your code by requiring you to implement\
    \ everything required to access a RESTful service. So we use mock services in\
    \ this book. If you’re more concerned with testing your core Ember classes, and\
    \ you’re not worried about data access layer testing, you might consider fixtures,\
    \ which are essentially classes with hardcoded data and simple access methods.\n\
    \nIn fact, we go an extra step beyond mock services: our services will persist\
    \ data across a restart so that as we build the app we’ll also see data accumulate.\
    \ The default mock services created by Ember CLI don’t do this, and although this\
    \ behavior might be preferable for developing an app under normal circumstances,\
    \ I’d prefer that our data survive a service restart so that our test data is\
    \ maintained as we work through the examples. So, let’s see how a mock service\
    \ works.\n\n## Creating the User Model\n\nWe start by creating a model class for\
    \ our user object. At the moment, our user consists of one data attribute: the\
    \ name. Let’s use Ember CLI to generate a stub class.\n\n```\n$ ember generate\
    \ model user\n```\n\nHere’s the class, with implementation details added in:\n\
    \n[ch1/ember-note/app/models/user.js](http://media.pragprog.com/titles/mwjsember/code/ch1/ember-note/app/models/user.js)\n\
    \n```javascript\nimport DS from 'ember-data';\n\nexport default DS.Model.extend({\n\
    \  name: DS.attr('string')\n});\n```\n\nThis class relies on the Ember Data libraries\
    \ to create an instance of a `Model`, with a single attribute called `name`. This\
    \ attribute has a type of string, meaning it will hold text. That’s it. This is\
    \ all we need to model our user object. Now, to interact with the service we’re\
    \ planning to create, we need a `RESTAdapter` and a `RESTSerializer`.\n\n## Setting\
    \ up the Adapter and Serializer\n\nTo create our `RESTAdapter`, run the following\
    \ command:\n\n```bash\n$ ember generate adapter application\n```\n\nThis creates\
    \ a `RESTAdapter` that will be used by the entire application, which is why we\
    \ named it `application`. Now, edit the resulting file so it looks like this:\n\
    \n[ch1/ember-note/app/adapters/application.js](http://media.pragprog.com/titles/mwjsember/code/ch1/ember-note/app/adapters/application.js)\n\
    \n```javascript\nimport DS from 'ember-data';\n\nexport default DS.RESTAdapter.extend({\n\
    \  namespace: 'api'\n});\n```\n\nSimilarly, to create the `RESTSerializer`, run\
    \ this command:\n\n```bash\n$ ember generate serializer application\n```\n\nAnd\
    \ the resulting class will look like this:\n\n[ch1/ember-note/app/serializers/application.js](http://media.pragprog.com/titles/mwjsember/code/ch1/ember-note/app/serializers/application.js)\n\
    \n```javascript\nimport DS from 'ember-data';\n\nexport default DS.RESTSerializer.extend({});\n\
    ```\n\nThe `RESTAdapter` has just one purpose: to define the path on the server\
    \ where we can find our RESTful service. The `RESTSerializer` is an empty implementation,\
    \ as we’re using default functionality. Because we’re going to create a service\
    \ that exposes the expected API for each model object, this is all we need to\
    \ do. We’ll see a lot more on these in [Adapt to a Nonconventional API](#f_0041.html_adapters)\
    \ and [Use Serializers to Access Legacy APIs](#f_0042.html_serializers).\n\nGenerally,\
    \ this is where your Ember development would stop. Creating a service to provide\
    \ data is generally out of the scope of what you’d be doing with Ember, which\
    \ is a front-end framework, and not for developing REST services. As I said earlier,\
    \ we’re creating a mock service that our app can use for testing and then taking\
    \ it one step further by making the data persistent.\n\n## Making Data Persistent\n\
    \nTo make our data persistent, we need to be able to do two things that we can’t\
    \ do just yet. First, we need a place to put the data. For that we’ll use the\
    \ `NEDB` project, which is an embedded datastore for use with Node. This is a\
    \ great tool to use for development datastores, such as ours. You’ll likely want\
    \ something more robust for production datastores. Run the following command from\
    \ within your `ember-note` directory (the `--save-dev` flag makes this dev-only\
    \ dependency, not a production dependency):\n\n```bash\n$ npm install nedb --save-dev\n\
    ```\n\nThis makes the `NEDB` project available. When the Ember Data store saves\
    \ our new user record in the register route, it `POST`s data to our mock service\
    \ over HTTP. So we also need to be able to parse the body of the incoming HTTP\
    \ request. Get the following library to do this:\n\n```bash\n$ npm install body-parser\
    \ --save-dev\n```\n\nNow we’re ready to create our mock service by running the\
    \ following command:\n\n```bash\n$ ember generate mock users\n```\n\nWith our\
    \ service created, we just need to add a few lines of code to use the libraries\
    \ we just added, and to respond to a request. Take a look at the following code,\
    \ which makes data persistent:\n\n```javascript\nmodule.exports = function(app)\
    \ {\n  var express = require('express');\n  var usersRouter = express.Router();\n\
    \n  // Use body-parser in this service\n  var bodyParser = require('body-parser');\n\
    \  app.use(bodyParser.json());\n\n  // Create an embedded table if it doesn't\
    \ exist\n  var nedb = require('nedb');\n  var userDB = new nedb({ filename: 'users',\
    \ autoload: true });\n\n  // The POST URL is used to create a new record\n   usersRouter.post('/',\
    \ function(req, res) {\n    // Look for the recently created record and use it\
    \ to set id of incoming request\n    userDB.find({}).sort({id: -1}).limit(1).exec(function(err,\
    \ users) {\n      if (users.length != 0) {\n        req.body.id = users[0].id\
    \ + 1;\n      } else {\n        req.body.id = 1;\n      }\n\n      // Insert the\
    \ new record into our datastore, and return the newly created record to Ember\n\
    \      userDB.insert(req.body, function(err, newUser) {\n        res.status(201);\n\
    \        res.send(JSON.stringify(\n       // For now, we won't touch the rest\
    \ of this code, which was created by Ember\n       usersRouter.get('/', function(req,\
    \ res) {\n        res.send({\n          'users': []\n        });\n      });\n\n\
    \       usersRouter.get('/:id', function(req, res) {\n        res.send({\n   \
    \       'users': {\n            id: req.params.id\n          }\n        });\n\
    \      });\n\n       usersRouter.put('/:id', function(req, res) {\n      });\n\
    \n       usersRouter.delete('/:id', function(req, res) {\n        res.status(204).end();\n\
    \      });\n    }));\n    });\n  });\n\n  app.use('/api/users', usersRouter);\n\
    };\n```\n\nAnd with that, we’re ready to try out our register feature. If it’s\
    \ not already running, go to a command line and start your app by running the\
    \ following (if it’s already running, you may want to stop it by pressing Ctrl-C,\
    \ then start it again):\n\n```bash\n$ ember serve\n```\n\nThen navigate to localhost:4200,\
    \ click the register link, provide a username, and click Add. You should see a\
    \ message that says your user was added, as shown here.\n\n![images/new-user.png](images/new-user.png)\n\
    \nIf you want to verify, you can look at the users file in the ember-note directory.\
    \ You should see something like this:\n"
  raw: 'Ember and Ember CLI offer two ways to provide data to your app during development:
    fixtures and mock services. While fixtures are easier to set up, mock services
    offer you the ability to more fully test your code by requiring you to implement
    everything required to access a RESTful service. So we use mock services in this
    book. If you’re more concerned with testing your core Ember classes, and you’re
    not worried about data access layer testing, you might consider fixtures, which
    are essentially classes with hardcoded data and simple access methods.


    In fact, we go an extra step beyond mock services: our services will persist data
    across a restart so that as we build the app we’ll also see data accumulate. The
    default mock services created by Ember CLI don’t do this, and although this behavior
    might be preferable for developing an app under normal circumstances, I’d prefer
    that our data survive a service restart so that our test data is maintained as
    we work through the examples. So, let’s see how a mock service works.


    We start by creating a model class for our user object. At the moment, our user
    consists of one data attribute: the name. Let’s use Ember CLI to generate a stub
    class.


    | ​  | $ ember generate model user |


    Here’s the class, with implementation details added in:


    | [ch1/ember-note/app/models/user.js](http://media.pragprog.com/titles/mwjsember/code/ch1/ember-note/app/models/user.js)
    |


    | ​  | ​**import**​ DS from ​*''ember-data''*​; |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ DS.Model.extend({ |


    | ​  | name: DS.attr(​*''string''*​) |


    | ​  | }); |


    This class relies on the Ember Data libraries to create an instance of a Model,
    with a single attribute called name. This attribute has a type of string, meaning
    it will hold text. That’s it. This is all we need to model our user object. Now,
    to interact with the service we’re planning to create, we need a RESTAdapter and
    a RESTSerializer.


    To create our RESTAdapter, run the following command:


    | ​  | $ ember generate adapter application |


    This creates a RESTAdapter that will be used by the entire application, which
    is why we named it application. Now, edit the resulting file so it looks like
    this:


    | [ch1/ember-note/app/adapters/application.js](http://media.pragprog.com/titles/mwjsember/code/ch1/ember-note/app/adapters/application.js)
    |


    | ​  | ​**import**​ DS from ​*''ember-data''*​; |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ DS.RESTAdapter.extend({ |


    | ​  | namespace: ​*''api''*​ |


    | ​  | }); |


    Similarly, to create the RESTSerializer, run this command:


    | ​  | $ ember generate serializer application |


    And the resulting class will look like this:


    | [ch1/ember-note/app/serializers/application.js](http://media.pragprog.com/titles/mwjsember/code/ch1/ember-note/app/serializers/application.js)
    |


    | ​  | ​**import**​ DS from ​*''ember-data''*​; |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ DS.RESTSerializer.extend({}); |


    The RESTAdapter has just one purpose: to define the path on the server where we
    can find our RESTful service. The RESTSerializer is an empty implementation, as
    we’re using default functionality. Because we’re going to create a service that
    exposes the expected API for each model object, this is all we need to do. We’ll
    see a lot more on these in [​*Adapt to a Nonconventional API*​](#f_0041.html_adapters)
    and [​*Use Serializers to Access Legacy APIs*​](#f_0042.html_serializers).


    Generally, this is where your Ember development would stop. Creating a service
    to provide data is generally out of the scope of what you’d be doing with Ember,
    which is a front-end framework, and not for developing REST services. As I said
    earlier, we’re creating a mock service that our app can use for testing and then
    taking it one step further by making the data persistent.


    To make our data persistent, we need to be able to do two things that we can’t
    do just yet. First, we need a place to put the data. For that we’ll use the NEDB
    project, which is an embedded datastore for use with Node. This is a great tool
    to use for development datastores, such as ours. You’ll likely want something
    more robust for production datastores. Run the following command from within your
    ember-note directory (the --save-dev flag makes this a dev-only dependency, not
    a production dependency):


    | ​  | $ npm install nedb --save-dev |


    This makes the NEDB project available. When the Ember Data store saves our new
    user record in the register route, it POSTs data to our mock service over HTTP.
    So we also need to be able to parse the body of the incoming HTTP request. Get
    the following library to do this:


    | ​  | $ npm install body-parser --save-dev |


    Now we’re ready to create our mock service by running the following command:


    | ​  | $ ember generate http-mock users |


    With our service created, we just need to add a few lines of code to make use
    of the libraries we just added, and to respond to a request to create a new record.
    Take a look at the following code, which makes changes to the basic mock service
    that let it store data in NEDB:


    | [ch1/ember-note/server/mocks/users.js](http://media.pragprog.com/titles/mwjsember/code/ch1/ember-note/server/mocks/users.js)
    |


    | ​  | module.exports = ​**function**​(app) { |


    | ​  | ​**var**​ express = require(​*''express''*​); |


    | ​  | ​**var**​ usersRouter = express.Router(); |


    | ​  |  |


    | ​  | ​*// Use the body-parser library in this service*​ |


    | ​  | ​**var**​ bodyParser = require(​*''body-parser''*​); |


    | ​  | app.use(bodyParser.json()); |


    | ​  |  |


    | ​  | ​*// Create an embedded table using NEDB if it doesn''t yet exist*​ |


    | ​  | ​**var**​ nedb = require(​*''nedb''*​); |


    | ​  | ​**var**​ userDB = ​**new**​ nedb({ filename : ​*''users''*​, autoload:
    true}); |


    | ​  |  |


    | ​  | ​*// The POST URL is used to create a new record*​ |


    | ​  | usersRouter.post(​*''/''*​, ​**function**​(req, res) { |


    | ​  |  |


    | ​  | ​*// Look for the most recently created record and use it to set the id*​
    |


    | ​  | ​*// field of our incoming record, which is required by Ember Data*​ |


    | ​  | userDB.find({}).sort({id : -1}).limit(1).exec(​**function**​(err,users)
    { |


    | ​  | ​**if**​(users.length != 0) |


    | ​  | req.body.user.id = users[0].id + 1; |


    | ​  | ​**else**​ |


    | ​  | req.body.user.id = 1; |


    | ​  |  |


    | ​  | ​*// Insert the new record into our datastore, and return the newly*​ |


    | ​  | ​*// created record to Ember Data*​ |


    | ​  | userDB.insert(req.body.user, ​**function**​(err,newUser) { |


    | ​  | res.status(201); |


    | ​  | res.send( |


    | ​  | JSON.stringify( |


    | ​  | { |


    | ​  | user : newUser |


    | ​  | })); |


    | ​  | }); |


    | ​  | }) |


    | ​  | }); |


    | ​  |  |


    | ​  | ​*// For now, we won''t touch the rest of this code, which was created
    by*​ |


    | ​  | ​*// Ember CLI*​ |


    | ​  | usersRouter.get(​*''/''*​, ​**function**​(req, res) { |


    | ​  | res.send({ |


    | ​  | ''users'': [] |


    | ​  | }); |


    | ​  | }); |


    | ​  |  |


    | ​  | usersRouter.get(​*''/:id''*​, ​**function**​(req, res) { |


    | ​  | res.send({ |


    | ​  | ''users'': { |


    | ​  | id: req.params.id |


    | ​  | } |


    | ​  | }); |


    | ​  | }); |


    | ​  |  |


    | ​  | usersRouter.put(​*''/:id''*​, ​**function**​(req, res) { |


    | ​  | }); |


    | ​  |  |


    | ​  | usersRouter.​**delete**​(​*''/:id''*​, ​**function**​(req, res) { |


    | ​  | res.status(204).end(); |


    | ​  | }); |


    | ​  |  |


    | ​  | app.use(​*''/api/users''*​, usersRouter); |


    | ​  | }; |


    And with that, we’re ready to try out our register feature. If it’s not already
    running, go to a command line and start your app by running the following (if
    it’s already running, you may want to stop it by pressing Ctrl-C, then start it
    again):


    | ​  | $ ember serve |


    Then navigate to localhost:4200, click the register link, provide a username,
    and click Add. You should see a message that says your user was added, as shown
    here.


    ![images/new-user.png](images/new-user.png)


    If you want to verify, you can look at the users file in the ember-note directory.
    You should see something like this:'
