    Ember 在许多方面都是一个成熟的框架，并提供了许多开箱即用的优秀特性。然而，许多功能对很多开发者可能有用，但并不属于核心框架。这就是为什么 Ember
    生态系统中最具吸引力的特性之一是 Ember 插件（addon）。


    此外，Ember 的内容远比我们在这里涵盖的要。Ember 团队在维护项目文档方面做得非常出色。如果你遇到我们没有讨论过的用例，很有可能 Ember 本身已经考虑了它，或者有相应的插件可以实现。因此，请查看
    Ember 网站上的文档或 Ember Observer！


    ### Ember 项目


    Ember 项目始终向前发展，在任何时候都有许多正在开发中的优秀功能，这些功能无疑对你非常有帮助。我会尽力保持这本书的更新性，但也鼓励你查看以下资源以跟上项目动态：


    * Ember 官网：[`emberjs.com`](http://emberjs.com)

    * GitHub 上的 Ember：[`github.com/emberjs`](https://github.com/emberjs)

    * Ember CLI：[`www.ember-cli.com`](http://www.ember-cli.com)

    * Ember Weekly：[`emberweekly.com`](http://emberweekly.com)

    * Ember Observer：[`emberobserver.com`](http://emberobserver.com)


    最后，我想感谢你花时间阅读这本书。我希望你发现它对你有帮助。如果你有任何意见或疑虑，请通过论坛 [`forums.pragprog.com/forums/368`](https://forums.pragprog.com/forums/368)
    或勘误说明页面 [`pragprog.com/titles/mwjsember/errata`](https://pragprog.com/titles/mwjsember/errata)
    与我们分享。编程愉快！


    #### 脚脚


