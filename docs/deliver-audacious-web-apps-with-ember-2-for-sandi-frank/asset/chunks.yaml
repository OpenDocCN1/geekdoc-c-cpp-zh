    ### Adding a Custom API Hostname


    It took a bit of work to get there, but using initializers, injection, and a session
    object to provide header data to RESTAdapter was a good demonstration of how extensible
    Ember is. We’ll see more on this in the next chapter.


    In addition to the properties we’ve covered, the RESTAdapter also allows you to
