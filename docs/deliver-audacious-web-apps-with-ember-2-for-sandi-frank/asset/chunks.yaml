  trans: "\n\n为了帮助实现，Ember Data 提供了一系列类用于将非标准 API 适配以遵循 Ember 其他部分期望的约定。这可以简单到仅将属性名称从一种命名规范转换为另一种，也可以复杂到使用\
    \ Ember Data 在传输过程中修改 JSON。\n\n在本章中，我们将查看如何使用 Ember Data 来处理你可能会遇到的任何标准或非标准 API。\n\
    \n## 适配非惯规 API\n\n到目前为止，EmberNote API 一直沿用了 Ember Data 期望 API 遵循的约定。在本章中，我们首先创建一个不遵循传统约定的\
    \ EmberNote API 并行版本。然后，我们将使用新版本来学习如何让 Ember Data 适配此类 API。\n\n要开始这个过程，你需要为我们创建的每个模拟服务器文件创建一个副本。获取\
    \ `ember-note/server/mocks` 目录中的每个文件，复制它，并在文件扩展名之前的文件名尾添加 `-alt-api`，这样 `notes.js`\
    \ 就会变成 `notes-alt-api.js`。不要忘记保留原文件在位。在每个 `-alt-api` 文件中，我们创建 NEDB 数据文件的地方，通过在名称后添加\
    \ `-alt` 来更改数据文件的名称，如下：\n\n```javascript\nvar noteDB = new nedb({ filename : 'notes-alt',\
    \ autoload: true});\n```\n\n然后，在每个新文件的底部，将监听器 URL 修改为包含 `api` 路径段：\n\n```javascript\n\
    app.use('/api/alt/notes', notesRouter);\n```\n\n运行 `ember serve` 命令以你的应用使用新 API\
    \ 。\n\n### 为你的 API 添加请求头\n\n随着这个新 API 的运行，让我们如下修改 `RESTAdapter`：\n\n[ch6/ember-note/app/adapters/application.js](http://media.pragprog.com/titles/mwjsember/code/ch6/ember-note/app/adapters/application.js)\n\
    \n```javascript\nimport DS from 'ember-data';\n\nexport default DS.RESTAdapter.extend({\n\
    \  namespace: 'api/alt',\n});\n```\n\n对 `namespace` 的这一简单更改将导致适配器向备用 API 端点发送请求。如果你现在在浏览器中加载\
    \ EmberNote，你会发现你之前注册的用户无法登录，因为我们创建了新的底层数据存储。在生产应用中你不需要这样做，但由于我们的模拟服务器端点运行在同一个\
    \ Node 实例中，我们必须创建单独的数据存储来绕过使用 NEDB 重复加载同一个存储的限制。\n\n除了设置 API 端点路径外，`RESTAdapter`\
    \ 还有其他自定义选项。例如，许多 API 需要 HTTP 请求头来识别用户。`RESTAdapter` 包含一个名为 `headers` 的属性，你可以根据需要对其设置。让我们修改\
    \ EmberNote，在用户登录后在每个请求中添加用户令牌作为头。\n\n为了从我们的 `RESTAdapter` 内部填充请求头，我们需要一种向适配器提供用户数据的方法。这些用户数据在用户首次登录时在登录路由中是可以用的。之前，当我们想在用户路由之外获取用户数据时，简单地使用了\
    \ `controllerFor` 方法。然而，此方法在我们的 `RESTAdapter` 内部不可用。为了从适配器获取用户信息，我们需要使用 Ember\
    \ 的高级功能之一：依赖注入。我们之前使用过依赖注入——事实上，每当我们在路由或控制器中调用 `this.store` 时都是如此。让我们看看如何创建自己的对象供依赖注入使用。\n\
    \n### 创建并注入用户会话\n\n我们将创建一个名为 `Session` 的类，并使用它来存储我们想要在类之间共享的信息。我们将使用一个初始化器来初始化此类类并使其可用。初始化器是在\
    \ Ember 应用首次在浏览器启动时运行的函数，它在通过依赖注入提供对象时非常有用。要创建一个初始化器，从 EmberNote 根目录下运行以下 Ember\
    \ CLI 命令：\n\n```bash\n$ ember generate initializer session\n```\n\n此命令为你的初始化器生成一个存根（stub）。向存根添加以下代码以完成初始化器：\n\
    \n[ch6/ember-note/app/initializers/session.js](http://media.pragprog.com/titles/mwjsember/code/ch6/ember-note/app/initializers/session.js)\n\
    \n```javascript\nimport Ember from 'ember';\n\nexport function initialize(container,application)\
    \ {\n  var session = Ember.Object.extend();\n  application.register('session:main',\
    \ session);\n  application.inject('adapter', 'session', 'session:main');\n  application.inject('route',\
