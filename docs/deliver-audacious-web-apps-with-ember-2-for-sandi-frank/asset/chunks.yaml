  trans: "\n\n当你创建一个插件（addon）时，你并不是在创建一个属于现有应用程序的类。你实际上是在创建一个全新的代码库。因此，自第 1 章以来的第一次，我们将离开\
    \ `ember-note` 目录树，并为此插件创建一个新的目录结构。首先，导航到 `ember-note` 目录的父目录。然后，以管理员权限的用户身份运行以下命令，这将创建一个新目录：\n\
    \n```bash\n$ ember addon ember-bs-dropdown\n```\n\n就像你创建 EmberNote 时一样，此命令会为你的插件创建完整的目录结构。在我们开发该插件的过程中，我们将介绍该结构中最重要的部分。\n\
    \n由于我们要创建一个 Bootstrap 风格的下拉菜单，因此我们的插件需要 Bootstrap 样式表。进入新创建的插件目录并安装 Bootstrap。\n\
    \n```bash\n$ cd ember-bs-dropdown\n$ bower install bootstrap --save\n```\n\n由于我们之前已经安装过\
    \ Bootstrap，`bower install` 命令会检查本地缓存中的 Bootstrap。它很可能会缓存中找到 Bootstrap，但我们仍然需要运行此命令，因为它还会将\
    \ Bootstrap 作为依赖项添加到插件中。`bower install` 命令通过编辑插件的 `bower.json` 文件来包含 Bootstrap\
    \ 以实现此操作。现在你的项目已经有了 Bootstrap，我们准备好生成我们的组件了。运行以下命令：\n\n```bash\n$ ember generate\
    \ component bs-dropdown --pod\n```\n\n这些应该对你来说都很熟悉。到目前为止，创建插件和应用程序最大的区别仅仅在于初始命令：应用程序使用\
    \ `ember new`；插件使用 `ember addon`。\n\n如果你查看插件的目录结构，它也是你熟悉的，但有一个例外：在顶层有一个插件目录，它与应用程序目录处于同一级。\n\
    \n这在起初可能让人感到困惑，但这样做充分充分。当你在 Ember 应用程序中包含插件时，插件代码会被放置在应用程序的 `node_modules` 目录中。然而，像其他东西一样，你可能想要扩展插件模块。应用程序目录中的文件成为你应用程序命名空间的一部分，并可以被你的应用程序扩展，如图所示。\n\
    \n![images/addon-app.png](img/addon-app.png)\n\n之前当我们运行 `ember generate component\
    \ bs-dropdown --pod` 命令时，它生成了三个文件。其中两个是使用标准组件生成的 `component.js` 和 `template.hbs`\
    \ 文件。让我们来看这些文件。\n\n首先，生成的组件看起来像：\n\n```javascript\n// ch9/ember-bs-dropdown/addon/components/bs-dropdown/component.js\n\
    import Ember from 'ember';\nimport layout from './template';\n\nexport default\
    \ Ember.Component.extend({\n  layout: layout\n});\n```\n\n我们不需要对生成的代码进行任何更改，因为我们不会构建一个非常复杂的组件。我们的目标只是构建一个下拉菜单，可以用它导航到\
    \ notes 路由。所以这些就是我们需要的。之前的类简单地实例化了一个组件。我们的模板稍微详细一点：\n\n```handlebars\n// ch9/ember-bs-dropdown/addon/components/bs-dropdown/template.hbs\n\
    <div class=\"dropdown\">\n  <button class=\"btn btn-default dropdown-toggle\"\
    \ type=\"button\"\n          id=\"dropdownMenu1\" data-toggle=\"dropdown\" aria-haspopup=\"\
    true\"\n          aria-expanded=\"true\">\n    {{dropdownName}}\n    <span class=\"\
    caret\"></span>\n  </button>\n  <ul class=\"dropdown-menu\" aria-labelledby=\"\
    dropdownMenu1\">\n    {{#each model as list}}\n      <li>{{#link-to route list.id}}{{list.title}}{{/link-to}}</li\n\
    \    {{/each}}\n  </ul>\n</div>\n{{yield}}\n```\n\n这些代码大部分是创建下拉菜单的 Bootstrap 样板代码。`{{dropdownName}}`\
    \ 表达式用于将值传递给组件，该值将作为下拉菜单的默认显示值。`{{each}}` 表达式遍历传入的可显示项目模型。每个项目都会变成下拉菜单中的单行。\n\n\
    下拉菜单中的每一行都由 `{{link-to}}` 表达式组成。在构建这些表达式时，我们依赖三部分数据。首先，我们传入目标路由名称，这样我们就知道该去哪里。然后，我们使用记录的\
    \ `id` 作为 `link-to` 的参数，并将记录的 `title` 作为显示值。\n\n让我们快速看一下在应用程序中创建的组件：\n\n```javascript\n\
    // ch9/ember-bs-dropdown/addon/components/bs-dropdown/component.js\nimport Ember\
    \ from 'ember';\nimport layout from './template';\n\nexport default Ember.Component.extend({\n\
    \  layout: layout\n});\n```\n\n这些就是我们需要的。之前的类简单地实例化了一个组件。我们的模板稍微详细一点：\n\n这些代码大部分是创建下拉菜单的\
    \ Bootstrap 样板代码。`{{dropdownName}}` 表达式用于将值传递给组件，该值将作为下拉菜单的默认显示值。`{{each}}` 表达式遍历传入的可显示项目模型。每个项目都会变成下拉菜单中的单行。\n\
    \n下拉菜单中的每一行都由 `{{link-to}}` 表达式组成。在构建这些表达式时，我们依赖三部分数据。首先，我们传入目标路由名称，这样我们就知道该去哪里。然后，我们使用记录的\
    \ `id` 作为 `link-to` 的参数，并将记录的 `title` 作为显示值。\n\n这就是开发插件所需的所有内容。我们需要做一些工作来使其可用。首先，我们需要告诉\
    \ Ember CLI 在构建插件时使用 HTMLBars。从项目中运行以下命令：\n\n```bash\n$ npm install htmlbars --save\n\
    ```\n\n我们还需要确保插件带有 Bootstrap 文件构建。然而，我们不会使用 `ember-build.js` 文件来实现。每个应用程序只有一个\
    \ `ember-build.js`，所以即使我们将 Bootstrap 资源添加到插件的 `ember-build.js` 中，应用程序在包含它时也会忽略插件的\
    \ `ember-build.js` 并使用它自己的。相反，我们在插件的入口 `index.js` 中添加这些资源：\n\n```javascript\n\
    /* jshint node: true */\n'use strict';\n\nmodule.exports = {\n  name: 'ember-bs-dropdown',\n\
    \  included: function(app) {\n    app.import('bower_components/bootstrap/dist/css/bootstrap.css');\n\
    \    app.import('bower_components/bootstrap/dist/css/bootstrap.css.map', {\n \
    \     destDir: 'assets'\n    });\n    app.import('bower_components/bootstrap/dist/js/bootstrap.min.js');\n\
    \  }\n};\n```\n\n"
- fmt: "\nThe addon is now ready to be used in the EmberNote app. First, we need to\
    \ make the addon visible to EmberNote. While using your local environment for\
    \ both the `ember-bs-dropdown` addon and the EmberNote app, you can use a set\
    \ of `npm` commands to make the addon package available locally. We’ll see how\
    \ to publish addons to `npm` or a private repository in [Publishing Your Addon](#f_0062.html_publishing-addons).\n\
    \nTo make your local npm cache aware of the addon, run the following command from\
    \ the `ember-bs-dropdown` directory:\n\n```bash\n$ npm link\n```\n\nThis command\
    \ creates a symbolic link from the local npm cache to your addon project. This\
    \ link allows other projects on your local machine to use your addon, with one\
    \ additional step. Your local app needs to also create a link to the Ember addon.\
    \ So, from the ember-note- directory, run the following command:\n\n```bash\n\
    $ npm link ember-bs-dropdown\n```\n\nThe EmberNote app is now able to locate the\
    \ addon we’ve created. However, while we’ve given the app a path to see the addon,\
    \ it’s still not aware of it. If you have a running instance of `ember serve`,\
    \ stop it now. Then, add the following line to the very bottom of the `devDependencies`\
    \ section of the EmberNote `package.json` file, which is in the root directory\
    \ (be sure to add a comma to the end of the preceding line):\n\n```json\n\"ember-bs-dropdown\"\
    : \"*\"\n```\n\nNow, when we next run `ember serve`, the app will see the drop-down\
    \ component. Don’t try it just yet; we have one more change to make to the EmberNote\
    \ app first. Open the notebooks template and modify it to look like the following:\n\
    \n```handlebars\n<!-- ch9/ember-note/app/notebooks/template.hbs -->\n<div>\n \
    \ <div class=\"col-md-3\">\n    Notebooks\n  </div>\n  <div>\n    title: {{input\
    \ value=title}}\n    <button {{action 'addNotebook'}}>Add</button>\n  </div>\n\
    \  {{bs-dropdown model=model route='notebooks.notes'\n    dropdownName='Notebooks'}}\n\
    \  </div>\n  <div class=\"col-md-9\">\n    {{outlet}}\n  </div>\n</div>\n```\n\
    \nWe’ve switched out a great deal of code for our new addon component. We use\
    \ the `{{bs-dropdown}}` expression to refer to our custom component. The `model=model`\
    \ portion of the expression passes the notebooks model into the component. Because\
    \ this model class contains the right properties, namely the `id` and `title`\
    \ properties, it should work just fine. We pass the `notebooks.notes` route name\
    \ as the destination route for the drop-down, and “Notebooks” as the default drop-down\
    \ value.\n\nBefore this will work, we need to make one last change to the app.\
    \ We need to remove the Bootstrap assets from our `ember-cli-build.js`. If we\
    \ leave them in, the `ember serve` command complains that we’ve defined them twice.\
    \ Because we’re now relying on a Bootstrap-derived addon for our components, we’ll\
    \ let it define the version we use. Change the `ember-cli-build.js` file to look\
    \ like this:\n\n```javascript\n/* ch9/ember-note/ember-cli-build.js */\n/* global\
    \ require, module */\nvar EmberApp = require('ember-cli/lib/broccoli/ember-app');\n\
    \nmodule.exports = function(defaults) {\n  var app = new EmberApp(defaults, {\n\
    \    // Add options here\n  });\n\n  // Use `app.import` to add additional libraries\
    \ to the generated\n  // output files.\n  // If you need to use different assets\
    \ in different\n  // environments, specify an object as the first parameter. That\n\
    \  // object's keys should be the environment name and the values\n  // should\
    \ be the asset to use in that environment.\n  // If the library that you are including\
    \ contains AMD or ES6\n  return app;\n};\n```\n"
  raw: 'The addon is now ready to be used in the EmberNote app. First, we need to
    make the addon visible to EmberNote. While using your local environment for both
    the ember-bs-dropdown addon and the EmberNote app, you can use a set of npm commands
    to make the addon package available locally. We’ll see how to publish addons to
    npm or a private repository in [​*Publishing Your Addon*​](#f_0062.html_publishing-addons).


    To make your local npm cache aware of the addon, run the following command from
    the ember-bs-dropdown directory:


    | ​  | $ npm link |


    This command creates a symbolic link from the local npm cache to your addon project.
    This link allows other projects on your local machine to use your addon, with
    one additional step. Your local app needs to also create a link to the Ember addon.
    So, from the ember-note directory, run the following command:


    | ​  | $ npm link ember-bs-dropdown |


    The EmberNote app is now able to locate the addon we’ve created. However, while
    we’ve given the app a path to see the addon, it’s still not aware of it. If you
    have a running instance of ember serve, stop it now. Then, add the following line
    to the very bottom of the devDependencies section of the EmberNote package.json
    file, which is in the root directory (be sure to add a comma to the end of the
    preceding line):


    | ​  | ​*"ember-bs-dropdown"*​: ​*"*"*​ |


    Now, when we next run ember serve, the app will see the drop-down component. Don’t
    try it just yet; we have one more change to make to the EmberNote app first. Open
    the notebooks template and modify it to look like the following:


    | [ch9/ember-note/app/notebooks/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch9/ember-note/app/notebooks/template.hbs)
    |


    | ​  | ​**<div>**​ |


    | ​  | ​**<div**​ class=​*"col-md-3"*​​**>**​ |


    | ​  | ​**<div>**​Notebooks​**</div>**​ |


    | ​  | ​**<div>**​ |


    | ​  | title: {{input value=title}} |


    | ​  | ​**<button**​ {{action ''addNotebook''}}​**>**​Add​**</button>**​ |


    | ​  | ​**</div>**​ |


    | ​  | {{bs-dropdown model=model route=''notebooks.notes'' |


    | ​  | dropdownName=''Notebooks''}} |


    | ​  | ​**</div>**​ |


    | ​  | ​**<div**​ class=​*"col-md-9"*​​**>**​ |


    | ​  | {{outlet}} |


    | ​  | ​**</div>**​ |


    | ​  | ​**</div>**​ |


    We’ve switched out a great deal of code for our new addon component. We use the
    {{bs-dropdown}} expression to refer to our custom component. The model=model portion
    of the expression passes the notebooks model into the component. Because this
    model class contains the right properties, namely the id and title properties,
    it should work just fine. We pass the notebooks.notes route name as the destination
    route for the drop-down, and “Notebooks” as the default drop-down value.


    Before this will work, we need to make one last change to the app. We need to
    remove the Bootstrap assets from our ember-cli-build.js. If we leave them in,
    the ember serve command complains that we’ve defined them twice. Because we’re
    now relying on a Bootstrap-derived addon for our components, we’ll let it define
    the version we use. Change the ember-cli-build.js file to look like this:


    | [ch9/ember-note/ember-cli-build.js](http://media.pragprog.com/titles/mwjsember/code/ch9/ember-note/ember-cli-build.js)
    |


    | ​  | ​*/* global require, module */*​ |


    | ​  | ​**var**​ EmberApp = require(​*''ember-cli/lib/broccoli/ember-app''*​);
    |


    | ​  |  |


    | ​  | module.exports = ​**function**​(defaults) { |


    | ​  | ​**var**​ app = ​**new**​ EmberApp(defaults, { |


    | ​  | ​*// Add options here*​ |


    | ​  | }); |


    | ​  |  |


    | ​  | ​*// Use `app.import` to add additional libraries to the generated*​ |


    | ​  | ​*// output files.*​ |


    | ​  | ​*//*​ |


    | ​  | ​*// If you need to use different assets in different*​ |


    | ​  | ​*// environments, specify an object as the first parameter. That*​ |


    | ​  | ​*// object''s keys should be the environment name and the values*​ |


    | ​  | ​*// should be the asset to use in that environment.*​ |


    | ​  | ​*//*​ |


    | ​  | ​*// If the library that you are including contains AMD or ES6*​ |


    | ​  | ​*// modules that you would like to import into your application*​ |


    | ​  | ​*// please specify an object with the list of modules as keys*​ |


    | ​  | ​*// along with the exports of each module as its value.*​ |


    | ​  |  |


    | ​  | ​**return**​ app.toTree(); |


    | ​  | }; |


    This file now looks just like it did when we started the book. From a command
    line, run ember serve and you should see that our drop-down is in use. You can
    use it to choose the notebook you wish to review, and the related notes will be
    loaded into the notes route.


    Ember CLI offers a number of other ways to test your addon. It provides a dummy
    app within the addon project (under tests/dummy), as well as the ability to write
    test cases with QUnit. I chose to focus on using the EmberNote app for testing,
    but when you’re building a real addon, you’ll want to rely on those as well.


    Now that you have an addon ready to share, how do you get it out into the world?
    The last stop on our journey is one where we’ll learn to give back to others who
    have helped pave the path for us. Let’s learn how to publish an addon and share
    it with the world.


    ### Publishing Your Addon


    So you’ve made something cool, and you’re very proud of it. So proud that you
    think others might benefit from using it as well, either within your company or
    out in the world at large. Let’s learn now how to share our addon code with the
    world.


    #### Publishing Privately


    Sometimes you make something cool, but it’s proprietary. For whatever reason,
    you can’t totally open-source your addon. But you also want to make sure that
    multiple apps can benefit. Luckily, you can publish an addon to a private repository.


    Ember CLI supports the use of privately published addons with a single command.
    Just store your addon code in a Git repository, and you can simply run the ember
    install command using the repository’s URL as the addon name. Your addon will
    be installed into your project, and you can continue to use it just as if it were
    published publicly.


    #### Publishing to npm


    Of course, the fame, glory, and riches of publishing a hit open source Ember addon
    might be too enticing to pass up. If that’s the case, you can publish your addon
    to npm.


    When you created your addon, Ember CLI created a package.json file. Contained
    within that file are the two attributes required to publish your package: name
    and version. That’s all you need.


    Before you can publish it, you need to be registered with npm. If you haven’t
    already done so, run npm adduser to add a user to the [https://npmjs.com](https://npmjs.com)
    site. Once you’ve logged in as this user, you can then run npm publish to publish
    your new addon, and it will be publicly available via the npm site.


    When you’re ready to release a new version, you can bump the version number using
    npm version, and provide an update_type of either patch, minor, or major, depending
    on the nature of your change.


    Once your addon package is published, other developers can access it via the ember
    install command, just like they would any other addon. And you can be happy that
    you’ve given a little something back to the community.


    ## Next Steps


    We’ve come to the end of our road together, and there’s still plenty to be learned.
    Before we part ways, here are a few suggestions on what you can do next to continue
    working with Ember and supporting the community.


    There are many ways to support the Ember community, including contributing to
    the core framework or writing online about your use of Ember. These are strongly
    encouraged. However, the ability to share code that others might find useful via
    Ember addons is another great way to give back.'
