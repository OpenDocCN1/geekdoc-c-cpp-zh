    Google’s Material Design spec (found at [http://www.google.com/design/spec/material-design/introduction.html](http://www.google.com/design/spec/material-design/introduction.html))
    is one such standardized design, but how do you use such a set of principles in
    Ember?


    The Ember CLI Materialize addon is a project that attempts to answer that question.
    It is both an Ember CLI wrapper for the Materialize CSS framework and a library
    of related components. By including Ember CLI Materialize in your project, you
    can take advantage of the stylesheet and components to jump-start the design of
    your application, and extend it as needed.


    The full documentation for Ember CLI Materialize can be found at [http://github.com/sgasser/ember-cli-materialize](http://github.com/sgasser/ember-cli-materialize),
    along with a link to a demo site demonstrating the addon and its components.


    ## Next Steps


    In Ember 2, components are an increasingly important part of the framework. By
    combining the ideas behind templates and routes in a self-contained, reusable
    manner, they allow you to create your own set of controls that can be applied
    to common problems throughout the app. Now that we’ve seen components, we’ve touched
    on most of the major aspects of the user interface layer of Ember. It’s time now
    to turn to the data layer and learn how Ember works with RESTful services using
    Ember Data.


