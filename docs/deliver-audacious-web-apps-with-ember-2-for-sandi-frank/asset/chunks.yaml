  trans: "\n为了完成此转换，你需要在你的 `RESTSerializer` 实现中实现 `extractArray` 方法。该方法允许你对负载（payload）进行任何重新格式化或清理。以下是该方法的示例实现：\n\
    \n```javascript\nextractArray: function(store, type, payload) {\n  // 你可以在这里对\
    \ payload 进行处理，然后传递给父类\n  return this._super(store, type, payload);\n}\n```\n\n\
    `payload` 方法参数是来自服务器的原始响应。你的实现可能会获取此 `payload`，对其进行任何必要的调整以符合 Ember Data 预期的格式，然后将其传递给方法的父类实例。一些常见的操作可能包括更改负载的结构或删除不需要的信息（例如你的模型中未定义的属性）。这让你你能够使用即使是最不规范的\
    \ API 响应，同时充分利用 Ember Data 的功能。\n\n当负载是对包含多行查询的响应（例如 `findMany`）时，会使用此方法。有一个并行的方法名为\
    \ `extractSingle`，它起相同的作用，但它作用于仅包含一条记录的响应（例如 `find` 或 `save`）。该方法的签名包含一个额外的参数，如下所示：\n\
    \n```javascript\nextractSingle: function(store, type, payload, recordId) {\n \
    \ // 你可以在这里对 payload 进行处理，然后传递给父类\n  return this._super(store, type, payload,\
    \ recordId);\n}\n```\n\n还有许多其他类似的方法，每个方法都支持特定的数据操作（例如 `extractCreateRecord`），但本质上，最相关的方法只是\
    \ `extractSingle` 或 `extractArray` 的别名。然而，如果你的 API 要求对不同操作类型进行不同的处理，那么知道这些选项的存在是有用的。\n\
    \n## 将适配器（Adapters）和序列化器（Serializers）绑定到模型类\n\n在应用中实现适配器/序列化器模式有两种方法。目前为止我们实际上都用过了。对于你想在所有\
    \ REST 请求中共享的更改（例如添加用户令牌），你需要修改 Ember CLI 为你创建的应用适配器或序列化器，它们位于 `ember-note/app/adapters/application.js`\
    \ 和 `ember-note/app/serializers/application.js`。如果你想创建一个特定模型的适配器或序列化器，可以运行以下命令之一：\n\
    \n```bash\n$ ember generate serializer mymodel\n```\n\n或\n\n```bash\n$ ember generate\
    \ adapter mymodel\n```\n\n这会创建一个适用于给定类型数据请求的适配器或序列化器。然后你就可以实现我们之前描述的功能，而不必担心它们会被不必要地应用到其他模型类型。\n\
    \n现在我们已经探索了如何使用替代 API，让我们删除 notebook 适配器和序列化器，并将应用范围内的 `RESTAdapter` 改回。从命令行运行以下命令：\n\
    \n```bash\n$ ember destroy adapter notebook\n$ ember destroy serializer notebook\n\
    ```\n\n然后按照 `ember-note/app/adapters/application.js` 文件中的 `namespace` 属性如下：\n\n\
    ```javascript\nnamespace: \"api\"\n```\n\n你可以保留头部信息（headers）；没有理由删除它们。在我们对非规范\
    \ API 的快速游览结束后，我们准备好进行下一步。\n\n## 下一步工作\n\n`RESTAdapter` 和 `RESTSerializer` 类提供的功能比我们在这里涵盖的要多。这些类提供了使用\
    \ Ember Data 处理几乎任何 API 的强大手段，因此，如果你遇到了我们没有涵盖的情况，我鼓励你进一步探索。我们现在已经了解了 Ember 和 Ember\
    \ Data 的许多核心功能，但我们还有更多内容要学习。Ember 为扩展此核心提供了多种选项，并可以使用框架本身将类连接起来，以帮助增加你创建的类的实用性。在下一章中，我们将通过在整个应用中提供常用的实用工具程序来扩展\
    \ Ember。\n\nCopyright © 2015, The Pragmatic Bookshelf.\n\n# 第 7 章：在 Ember 中重用代码\n\
    \n我们花费了大量时间学习 Ember 的核心功能。我们已经看到了如何使用这些核心功能构建 Web 应用，以及如何通过 Ember 的主见性（opinionated）结构来快速构建。\n\
    \n这种结构不仅为你提供了构建应用核心的方法，还提供了在系统不同部分之间共享代码的几种方法。它提供了通过准备任何必要的对象来引导你的应用的能力。并提供了将数据值从一个上下文翻译到另一个上下文的能力（例如货币转换）。\n\
    \n在本章中，我们将查看如何使用 Ember 和 Ember CLI 在 Ember 的主见性结构之上叠加应用特定的抽象，以便你将合理的设计应用于 EmberNote\
    \ 的逻辑中。让我们从最基础的抽象级别开始：工具类（utility class）。\n\n## 使用工具类抽象常用函数\n\n在对象之间共享代码的方法之一是创建一个简单的工具函数。Ember\
    \ CLI 包含一个用于创建可以导入到其他类中的工具函数的蓝图。严格来说，以这种方式创建工具函数与其说是 Ember 核心框架的功能，不如说是 Ember\
    \ CLI 的功能。我们将在第 8 章探索你的应用时，讨论 Ember CLI 如何让这些及其他功能成为可能。\n\n创建工具函数的目标是为可能存在不同类中的逻辑提供一个单一的地方。我说“无关”，是因为如果类之间是相关的，正如我们所看到的，使用混入（mixin）会更好。\n\
    \n数据验证是可能存在于工具函数中的逻辑的一个良好例子。有很多理由你可能需要验证数据。你可能需要验证字符串是否为有效的电子邮件、电话号码或邮政编码。你可能需要验证字符串的长度，或者它是否为有效日期。无论如何，你可能在无关的上下文中中使用这种验证，因此验证是一个很好的开始用例。\n\
    \n为了我们的目的，假设我们要验证 EmberNote 的标题长度是否在 0 到 140 之间。我们将创建一个工具函数来执行此操作，并在日志路由中使用该函数。首先，从项目根目录运行以下命令：\n\
    \n```bash\n$ ember generate util is-valid-length\n```\n\n该命令创建了一个空的工具函数，如下：\n\n\
    ```javascript\nexport default function isValidLength() {\n  return true;\n}\n\
    ```\n\n为了添加实际逻辑，进行以下更改：\n\n```javascript\nexport default function isValidLength(value,\
    \ min, max) {\n  return !(value.length <= min || value.length > max);\n}\n```\n\
    \n该函数的具体实现细节没有其形式重要。你会注意到命令使用了短横线分隔的 `is-valid-length`，而函数名为 `isValidLength`。Ember\
    \ CLI 在创建函数时执行了该转换，并记录名为 `is-valid-length.js` 的文件中。现在我们有了函数，该如何引用它呢？请看对日志路由的以下更新：\n\
    \n"
