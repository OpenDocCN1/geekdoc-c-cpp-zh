- fmt: "\nIt’s worth noting that while we’ll use `Node` to run the Ember CLI development\
    \ tools, Ember itself isn’t a server-side framework, despite the fact that `Node`\
    \ supports server-side JavaScript development. Ember is used for creating browser-resident\
    \ apps.\n\nTo begin, let’s install `Node` and `npm`, as well as `Git`. `Node`\
    \ comes with `npm`, but `npm` is updated frequently, so it’s worth confirming\
    \ that you have the latest. Please visit the sites to install the most recent\
    \ version of these tools for your particular platform. Your `Node` install should\
    \ be at least version `0.12` to support Ember CLI tooling. If you already have\
    \ `Node` installed, you may need to uninstall the existing version first.\n\n\
    The latter two installs are required by `Bower`. `npm` is a package manager for\
    \ code built to run within `Node`, or to be used with a tool that runs in `Node`.\
    \ `Git` is a distributed version control system. Install all three using the installation\
    \ instructions at the respective sites.\n\n| Installation |\n| --- |\n| ![images/aside-icons/tip.png](images/aside-icons/tip.png)\
    \ | When installing each of these tools, you’ll want to be running as an administrative\
    \ user. On a Linux/BSD/OS X system, you’ll probably want to use the `sudo` prefix\
    \ to do this, and on Windows, you’ll need to be signed in as a user with admin\
    \ rights. As with many installations, there are things that can go wrong, so if\
    \ an issue arises, head to the book’s forum on [http://pragprog.com](http://pragprog.com)\
    \ and we’ll work through it together. |\n\nWith these tools installed, you can\
    \ get `Bower` from a command line:\n\n| | ```bash$ npm install -g bower ``` |\n\
    \nYou should see several lines of command output, indicating that `Bower` and\
    \ its dependencies have been pulled onto your machine. The `-g` command option\
    \ asks `Node` to install `Bower` and make it available globally, rather than restricting\
    \ it to a specific project. Once `Bower` has finished installing (you’ll see the\
    \ command output stop and be returned to the command prompt), you can install\
    \ `PhantomJS`:\n\n| | ```bash$ npm install -g phantomjs ``` |\n\nAgain, you should\
    \ see some command output that tells you `PhantomJS` was installed successfully.\
    \ With these tools, you’re ready to get Ember CLI:\n\n| | ```bash$ npm install\
    \ -g ember-cli ``` |\n\nInstalling `Ember CLI` causes the Ember framework libraries\
    \ to be installed, along with the CLI itself. Now that you have `Ember` and `Ember\
    \ CLI`, we’re ready to start coding.\n\n# Start Your App\n\nEmber CLI takes a\
    \ very app-centric approach. The first thing you do is to create the app, and\
    \ every module you create is part of that app. As a result, we’re going to follow\
    \ suit, and explore all of Ember’s key concepts in the context of one app.\n\n\
    We’ll be writing an app called `EmberNote`, a slimmed-down clone of Evernote,\
    \ the web-based note-taking app. Our first step is to create the app’s repository\
    \ (so called because Ember CLI assumes you’ll be using `Git` as a version control\
    \ system).\n\n### Creating the App Repository\n\nOpen a command prompt, navigate\
    \ to a location where you keep your code, and run the following command:\n\n|\
    \ | ```bash$ ember new ember-note ``` |\n\nThis will create a new directory for\
    \ your app. Take a look at the tip that follows if any issues arise.\n\n| New\
    \ Projects with Ember CLI |\n| --- |\n| ![images/aside-icons/important.png](images/aside-icons/important.png)\
    \ | As of this writing, there’s a probable race condition that can occur with\
    \ Ember CLI when creating a new repository. If you see an error that looks something\
    \ like this: `ENOENT, open ’ember/package.json’, you may have run into this error.\
    \ Usually, the `ember new` command succeeds on the second try. On certain non-Windows\
    \ systems, you may also see a console warning about not having `watchman` installed.\
    \ Ember CLI uses `watchman` to monitor your filesystem for changes and live deploys\
    \ them to your local server as you’re working on your Ember app. It’s good to\
    \ have `watchman`, if for no other reason than to avoid seeing this error, but\
    \ it’s not necessary. Without `watchman`, Ember CLI uses a tool called `NodeWatcher`\
    \ for the same purpose. If you want to install `watchman`, visit [https://facebook.github.io/watchman/docs/install.html]\
    \ for platform-specific installation instructions. |\n\nBefore we write our UI\
    \ code, let’s also install a Bootstrap stylesheet so we can enjoy a UI that doesn’t\
    \ look like it’s from the early 1990s. From a command prompt in the newly created\
    \ `ember-note` directory, run the following commands:\n\n| | ```bash$ cd ember-note\
    \ ``` |\n| | ```bash$ npm install ``` |\n| | ```bash$ bower install ``` |\n| |\
    \ ```bash$ bower install bootstrap --save ``` |\n\nThen add these lines to `ember-note/ember-cli-build.js`,\
    \ right before the last line of code:\n\n| | ```javascriptapp.import('bower_components/bootstrap/dist/css/bootstrap.css');\
    \ ``` |\n| | ```javascriptapp.import('bower_components/bootstrap/dist/js/bootstrap.js');\
    \ ``` |\n| | ```javascriptapp.import('bower_components/bootstrap/dist/css/bootstrap.min.css');\
    \ ``` |\n\nWait, let me re-check the source text provided for the code block to\
    \ ensure accuracy. The source text says:\n`| | app.import('bower_components/bootstrap/dist/css/bootstrap.css');\
