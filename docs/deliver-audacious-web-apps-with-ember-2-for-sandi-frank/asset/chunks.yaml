    };\n```\n\n第一块代码定义了该初始化器的 `initialize` 方法。该方法接收 `container` 和 `application` 实例。在方法内部，我们扩展了\
    \ `Ember.Object`并将结果赋值给 `session`。\n\n### Ember 插件：Ember CLI Auth\n\n我们的示例会话对象是一个开始，但我们可能需要更多的身份验证和会话管理。Ember\
