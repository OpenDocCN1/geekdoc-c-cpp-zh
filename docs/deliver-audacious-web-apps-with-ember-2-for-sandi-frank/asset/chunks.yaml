- fmt: "\nAs with many notions in the programming world, there’s some debate over\
    \ what constitutes a RESTful API. (Often this takes the form of “Your API isn’t\
    \ RESTful!” “No, YOUR API isn’t RESTful!”) Leaving all of that aside, let’s talk\
    \ about how RESTful APIs are meant to be used with Ember Data.\n\nGenerally speaking,\
    \ a RESTful service is a means of using a uniform resource identifier to access\
    \ data and execute functions. RESTful services often, but not always, use HTTP\
    \ as a transport protocol. Each unique URI and verb combination defines an action\
    \ and the related record (or set of records) to use when applying that action.\
    \ For example, if you want to get the note record with id `24`, you can make a\
    \ `GET` request of `/note/24` and expect to get the current state of the record,\
    \ if it exists.\n\nThe implementation of a RESTful API is beyond the scope of\
    \ this book, with the exception of the mock services we’ve been creating (and\
    \ don’t use these in a production environment, please). You might use any number\
    \ of technologies to implement one, such as Ruby on Rails, Node.js, Java, or .NET.\
    \ The choice is yours.\n\nOnce you’ve defined a model class, you’ll want to be\
    \ able to load data from that class’s API endpoint. Before you can do that, your\
    \ app will need to declare an instance of the `DS.RESTAdapter` class. Let’s look\
    \ at the one we declared for the EmberNote project:\n\n`ch5/ember-note/app/adapters/application.js`\n\
    \n```javascript\nimport DS from 'ember-data';\n\nexport default DS.RESTAdapter.extend({\n\
    \  namespace: 'api'\n});\n```\n\nThis adapter is as terse as it gets. The single\
    \ function of this implementation of `RESTAdapter` is to identify the API’s root\
    \ URL. In general, an adapter is able to be responsible for much more than this,\
    \ but we’ll start with a simple one for now and cover adapters in greater detail\
    \ in [Adapt to a Nonconventional API](#f_0041.html_adapters).\n\nWith this adapter\
    \ in place, we’re ready to begin querying the API for records.\n\n### Querying\
    \ the API\n\nWhen we first began working with Ember Data, we used it to display\
    \ a list of notebooks that the logged-on user owned. As you can see from our definition,\
    \ each notebook record belongs to one user:\n\n`ch5/ember-note/app/models/notebook.js`\n\
    \n```javascript\nimport DS from 'ember-data';\n\nexport default DS.Model.extend({\n\
    \  title: DS.attr('string'),\n  user: DS.belongsTo('user'),\n  notes: DS.hasMany('note')\n\
    });\n```\n\nGiven that model, we used the model hook of the notebooks route to\
