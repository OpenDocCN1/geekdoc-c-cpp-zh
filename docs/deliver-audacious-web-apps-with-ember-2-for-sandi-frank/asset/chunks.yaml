    ### Binding Input Fields


    Every expression we’ve seen thus far is geared toward displaying static text.
    A lot of Ember’s power comes from its ability to link editable fields to the controller,
    so we need to use input fields as well. Let’s update our example to use input
    fields now.


    Start by taking a look at the notebooks template:


    | [ch3/ember-note/app/notebooks/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch3/ember-note/app/notebooks/template.hbs)
    |


    | ​  | title: {{input value=title}} |


    | ​  | ​**<button**​ {{action ''addNotebook''}}​**>**​Add​**</button>**​ |


    A minimal {{input}} expression such as this renders the following HTML:


    | ​  | ​**<input**​ type=​*"text"*​ value=​*"Notebook Title"*​ ​**/>**​ |


    We didn’t explicitly define a type for the input field, but Ember set it to "text"
    by default. The other option is to set it explicitly, like this:


    | ​  | {{input type="text" value=title}} |


    This renders the equivalent HTML. If you look closely you’ll see that the type
    attribute is set to a quoted string, while value is set to an unquoted string.
    This distinction is important. A quoted string will be rendered in the HTML exactly
    as written; an unquoted string will render the value of the given controller property.


    The following HTML attributes can also be set for an input field:


    | accept | autocomplete | autofocus | autosave | disabled |


    | form | formaction | formenctype | formmethod | formnovalidate |


    | formtarget | height | inputmode | max | maxlength |


    | min | multiple | name | pattern | placeholder |


    | readonly | required | selectionDirection | size | spellcheck |


    | step | tabindex | value | width |  |


    In addition to HTML attributes, the {{input}} expression supports event handlers,
    or actions, as they are known in Ember. You can link to an action from your {{input}}
    expression like so:


    | ​  | {{input type="text" value=name action="execute"}} |


