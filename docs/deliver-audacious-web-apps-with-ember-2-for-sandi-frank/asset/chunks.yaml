    Now run this command to create the model:


    | ​  | $ ember generate model note |


    And define the model as follows:


    | [ch2/ember-note/app/models/note.js](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/models/note.js)
    |


    | ​  | ​**import**​ DS from ​*''ember-data''*​; |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ DS.Model.extend({ |


    | ​  | title: DS.attr(​*''string''*​), |


    | ​  | body: DS.attr(​*''string''*​), |


    | ​  | notebook: DS.belongsTo(​*''notebook''*​) |


    | ​  | }); |


    Don’t worry if you have questions about the model classes now. We’ll discuss these
    in Chapter 5, [​*Modeling Your Data*​](#f_0035.html_chp.models). With the notebooks
    web service set up we’re ready to create the template for the notebooks route.
    As you’ve learned, the template is used to render the user interface for a route.
    In this case we want to create an interface that allows users to do two things:
    (1) create a new notebook, and (2) display the list of existing notebooks. Here’s
    the template that you’ll want to create:


    | [ch2/ember-note/app/notebooks/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/notebooks/template.hbs)
    |


    | ​  | ​**<div>**​ |


    | ​  | ​**<div**​ class=​*"col-md-3"*​​**>**​ |


    | ​  | ​**<div>**​Notebooks​**</div>**​ |


    | ​  | ​**<div>**​ |


    | ​  | title: {{input value=title}} |


    | ​  | ​**<button**​ {{action ''addNotebook''}}​**>**​Add​**</button>**​ |


    | ​  | ​**</div>**​ |


    | ​  | ​**<div>**​ |


    | ​  | ​**<ul>**​ |


    | ​  | {{#each model as &#124;notebook&#124;}} |


    | ​  | {{#link-to ''notebooks.notes'' notebook.id}} |


    | ​  | ​**<li>**​{{notebook.title}}​**</li>**​ |


    | ​  | {{/link-to}} |


    | ​  | {{else}} |


    | ​  | ​**<div>**​No notebooks found​**</div>**​ |


    | ​  | {{/each}} |


    | ​  | ​**</ul>**​ |


    | ​  | ​**</div>**​ |


    | ​  | ​**</div>**​ |


    | ​  | ​**<div**​ class=​*"col-md-9"*​​**>**​ |


    | ​  | {{outlet}} |


    | ​  | ​**</div>**​ |


    | ​  | ​**</div>**​ |


    I won’t dwell too much on the template code now—we’ll go into more detail in the
    next chapter. What I’d like you to notice is that we’re directly referencing the
    model from our template. As I mentioned earlier in this chapter, in the absence
    of directly creating a controller class, we can rely on default functionality
    of the base Ember.Controller class. This class has a model variable, and by default
    it calls the route’s model hook to populate this variable.


    For the notebooks route, the Ember Data query returns zero or more rows. In the
    template.hbs file, the model referenced is the variable contained the default
    controller. To get at the data in the variable, we’re using an {{#each}} expression,
    which loops along a list of model instances. The model variable in a controller
    can contain either a single model instance or an array of model instances.


    Our template displays the notebooks titles in an unordered list. We’ll dig into
    the details of the template and expressions later. For now, your list is probably
    empty. Let’s see how to use actions to add to the list and reload your template
    so they’re displayed. Add this code to the actions hash in your notebooks route:


    | [ch2/ember-note/app/notebooks/route.js](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/notebooks/route.js)
    |


    | ​  | addNotebook: ​**function**​() { |


    | ​  | ​**var**​ notebook = this.store.createRecord(​*''notebook''*​, { |


    | ​  | title: this.controller.get(​*''title''*​), |


    | ​  | user: this.controllerFor(​*''application''*​).get(​*''user''*​) |


    | ​  | }); |


    | ​  | notebook.save().then(() => { |


    | ​  | console.log(​*''save successful''*​); |


    | ​  | this.controller.set(​*''title''*​,null); |


    | ​  | this.refresh(); |


    | ​  | }, ​**function**​() { |


    | ​  | console.log(​*''save failed''*​); |


    | ​  | }); |


    | ​  | } |


    This action uses Ember Data to create a new record. It populates the record with
    values from our template and populates the user field of our notebook model by
    loading the data from the application controller: user: this.controllerFor(’application’).get(’user’).


    Once the record has been saved with Ember Data, we clear out the UI fields and
    then refresh the list using this.refresh(). This reloads the model from the server
    and displays your new record.'
