  trans: "\n\n这也引发了关于 Ember 默认结构的一个点。每个单独的路由对应对应一个模板。对于应用路由（application route），它是\
    \ `application.hbs` 模板。对于我们生成的每个路由，假设你使用了 `--pod` 标记，它就是路由文件夹中定义的 `template.hbs`\
    \ 模板；否则，模板将以路由命名，并存放在 `templates` 文件夹中。\n\n现在让我们创建登录路由（login route）。此路由需要允许用户登录\
    \ EmberNote 应用程序。它应该可以通过主页上的链接进行访问（就像之前的 `register` 路由一样），并允许以前注册的用户使用其用户名登录。一旦他们登录，他们应该被重定向到他们的笔记本列表（我们目前为止生成的另一个路由）。此外，一旦他们登录后，`register`\
    \ 和 `login` 链接就不应再出现。\n\n为了实现这一点，我们将对以下文件进行修改：\n\n* `app/template/application.hbs`：添加导航以允许用户加载登录路由，并在用户登录后隐藏到\
    \ `register` 和 `login` 的导航。\n* `app/login/route.js`：定义登录动作（action）。\n* `app/login/template.hbs`：定义登录路由的用户界面。\n\
    \n要到达登录路由，我们首先需要通过 `application.hbs` 文件使其可用。编辑该文件使其如下所示：\n\n```html\n<div class=\"\
    container\">\n  <div class=\"row\">\n    <div class=\"col-md-2\">\n      Welcome\
    \ to EmberNote\n    </div>\n    <div class=\"col-md-10\">\n      {{#if user}}\n\
    \        Hello, {{user.name}}\n      {{/if}}\n      {{#unless user}}\n       \
    \ {{#link-to 'register'}}register{{/link-to}}&nbsp;\n        {{#link-to 'login'}}login{{/link-to}}\n\
    \      {{/unless}}\n    </div>\n  </div>\n  <div class=\"row\">\n    <div>\n \
    \     {{outlet}}\n    </div>\n  </div>\n</div>\n```\n\n\n\n你对该文件所做的第一个添加是一个 `{{#if}}`\
    \ 表达式。该表达式包含的文本仅在表达式求值为真时才会显示。在这种情况下，如果应用控制器（application controller）的 `user` 属性有一个值，则会显示用户名。我们将在查看下一个登录路由时，了解此用户属性是如何设置的。\n\
    \n下一部分位于 `{{#unless}}` 表达式内部，当 `user` 属性缺失时显示。它包含了指向 `register` 路由以及我们新登录路由的 `{{#link-to}}`\
    \ 导航项。\n\n当用户点击登录路由链接时，他们会被带到 `localhost:4200/login`。登录模板被渲染到 `{{outlet}}` 中，这意味着模板的内容将显示在\
    \ `{{outlet}}` 表达式定义的占位符中。定义在 `app/login/template.hbs` 中的登录模板如下：\n\n```html\n\
    <div class=\"col-md-12\">\n  Login: {{input value=name}}<button {{action 'login'}}>Login</button>\n\
    </div>\n```\n\n这个与登录路由关联的模板只有两个元素。`{{input}}` 表达式显示一个 HTML 文本输入框，并从 `name` 属性获取其值。`{{action}}`\
    \ 表达式会在 `Route` 中执行登录动作，我们将在下一步定义该 `Route`。\n\n所有这些内容在登录路由类中结合在一起，如下：\n\n```javascript\n\
    import Ember from 'ember';\n\nexport default Ember.Route.extend({\n  actions:\
    \ {\n    login: function() {\n      this.store.query('user', {\n        name:\
    \ this.name\n      }).then((users) => {\n        if (users.length === 1) {\n \
    \         var user = users[0];\n          this.set('user', user);\n          this.transitionTo('notebooks');\n\
    \        } else {\n          console.log('unexpected result');\n        }\n  \
    \    });\n    }\n  }\n});\n```\n"
- fmt: "\nWe’ve covered more than just routes in this section to let us build a good\
    \ example. The key elements for you to focus on now are the `{{#link-to}}` expression,\
    \ the `transitionTo` function, and the actions hash. As used in the `application.hbs`\
    \ template, the `{{#link-to}}` expression allows the user to load the login route’s\
    \ `template.hbs` into the `{{outlet}}` in `application.hbs`, when the resulting\
    \ link is clicked. For this to work, we need the login route defined in `router.js`.\
    \ The `{{link-}}` expression is one way of causing the parent route to load a\
    \ child route into its outlet.\n\nAnother way to implement navigation is by using\
    \ functions like `transitionTo` to move between routes. As used in the login route,\
    \ it takes the currently loaded route (as determined by the instance calling the\
    \ function), and replaces it with the route named in the function call. As noted\
    \ in our example, we can use this function to indicate not only which route to\
    \ load, but also which record it should load. We’ll see more on how the destination\
    \ route knows which record to load when we look at setting a route’s model shortly.\n\
    \nLast, the actions hash is used to define name-value pairs of actions and their\
    \ related functions. This concept isn’t route-specific, and we’ll see more examples\
    \ of this later, but it’s worth noting that one option for action handling is\
    \ to add your actions to a route in this way.\n\nNow we understand more of what\
    \ a route is and how it’s used, let’s take a look at how to use a route to load\
    \ and display data via the route’s model hook.\n\n## Set Your Model\n\nWhen we’re\
    \ working with a route, the model hook is used to load and supply the necessary\
    \ data. As we’ve seen, not every route will implement its model hook, but most\
    \ will. The model hook is a function, defined within an instance of a `Route`\
    \ class, that loads the data to be displayed by that route.\n\nIn the EmberNote\
    \ app, we haven’t yet built a route that makes use of the model hook. Let’s do\
    \ so now. When a user signs in via the login action, we use the `transitionTo`\
    \ function to transition to the notebooks route. Let’s define that route now,\
    \ and along the way we’ll see how to use the model hook.\n\nThe notebooks route\
    \ has a simple purpose: to display a list of the notebooks a user has created\
    \ in EmberNote. A notebook is a collection of notes, so clicking on a notebook\
    \ in the notebooks route will then display a list of that notebook’s notes. Here’s\
    \ the notebooks route:\n\n```javascript\n// ch2/ember-note/app/notebooks/route.js\n\
    import Ember from 'ember';\n\nexport default Ember.Route.extend({\n  model: function(params)\
    \ {\n    return this.store.query('notebook',{user: params.user_id});\n  },\n \
    \ actions: {\n  }\n});\n```\n\nSimilar to the login route, notebooks uses the\
    \ ES6 module format and begins with the necessary import statement. Further, we\
    \ defined it using the `--pod` command-line flag, so the file is called `route.js`\
    \ and resides in the `app/notebooks` path, and the definition uses the `export\
    \ default Ember.Route.extend` form.\n\nThe model hook is the first block in the\
    \ body of our `Route`. It’s defined as a function, which is executed by Ember\
    \ when the route is loaded. You’ll also note that an object, known as `params`,\
    \ is passed to this function. We’ll come back to this shortly.\n\nThe body of\
    \ the model hook contains some Ember Data code to load the logged-in user’s notebooks.\
    \ We’ll cover Ember Data further in Chapter 5, [Modeling Your Data], so let’s\
    \ focus on the route-specific portions of the code now. This line of code causes\
    \ Ember Data to query for notebook objects that are owned by the user with `params.user_id`.\
    \ So where does this `user_id` come from?\n\nTo provide the `params` object to\
    \ the route, and specifically the `user_id`, we need to use a path segment in\
    \ our route definition. Let’s look at the definition of the notebooks route in\
    \ the `router.js` file:\n\n```javascript\n// ch2/ember-note/app/router.js\nthis.route('notebooks',\
    \ { path:'notebooks/:user_id'}, function() {});\n```\n\nThis is how you use the\
    \ `Router` class to define a route with a path segment. In Ember, a path segment\
    \ is used to provide a value that can be used to load a record in the route. For\
    \ this route, we’re using the id of the logged-on user to identify the notebooks\
    \ we want to load. Defining your route this way in the `Router` class, and then\
    \ using the `params` object in the `Route`, allows you to provide the data necessary\
    \ to load the notebooks. Of course, the object that initiated the navigation to\
    \ this route needs to add that data to the path in the first place. In our case,\
    \ we need to modify the `transitionTo` function in the route to provide this data:\n\
    \n```javascript\n// ch2/ember-note/app/route.js\nthis.transitionTo('notebooks',\
    \ user);\n```\n\n**Security Note**: Using path segments between routes is a useful\
    \ feature of Ember, but it’s easy to use in a way that can be insecure. Placing\
    \ cleartext in the URL is a potential risk, given it is easy a malicious user\
    \ to change. This is known as direct object vulnerability.\n\nNext, we need to\
    \ define the mock. To do this, run the following command to create the mock service\
    \ and provide a REST API to the route:\n\n`ember generate mock`\n\nWe then populate\
    \ the resulting file with the following code (I won’t go through the full explanation\
    \ of what’s happening; it’s in essence the same code we used for users):\n\n```javascript\n\
    // ch2/ember-note/server/notebooks.js\nmodule.exports = function(app) {\n  var\
    \ express = require('express');\n  var notebooksRouter = express.Router();\n \
    \ var bodyParser = require('body-parser');\n  app.use(bodyParser.json());\n  var\
    \ nedb = require('nedb');\n  var notebookDB = new nedb({ filename: 'notebooks',\
    \ autoload: true});\n\n  notebooksRouter.get('/', function(req, res) {\n    notebookDB.find(req.query).exec(function(error,\
    \ notebooks) {\n      res.send({\n        'notebooks': notebooks\n      });\n\
    \    });\n  });\n\n  notebooksRouter.post('/', function(req, res) {\n    notebookDB.find({}).sort({id:\
    \ -1}).limit(1).exec(function(err,notebooks) {\n      if(notebooks.length != 0)\n\
    \        req.body.notebook.id = notebooks[0].id + 1;\n      else\n        req.body.notebook.id\
    \ = 1;\n      notebookDB.insert(req.body.notebook,function(err,newNotebook) {\n\
    \        res.status(201);\n        res.send(\n          JSON.stringify({\n   \
    \         notebook : newNotebook\n          }));\n      });\n    })\n  });\n\n\
    \  notebooksRouter.get('/:id', function(req, res) { \n    res.send({\n      'notebooks':\
    \ {\n        id: req.params.id\n      }\n    });\n  });\n\n  notebooksRouter.put('/:id',\
    \ function(req, res) {\n    res.send({\n```\n"
