    \ and alert the user that we’re not going to save the record if the title fails\
    \ validation.\n\nIt’s worth noting that the new function is referred to as `isValidLength`\
    \ in its definition in `is-valid-length.js`, and in both the import and invocation\
    \ in the notes route. Once you define the function in the file and import it into\
    \ another class, you use it as though it were defined in the class to which it\
    \ was imported.\n\nIf you want to create a single function that can be imported\
    \ and used throughout your app, utility functions can help. However, it’s also\
    \ often helpful to share a collection of such functions. One way to do this is\
    \ to create a mixin, and then include it into the classes that need to use it.\
    \ Let’s take a look at that now.\n\n## Share Code with Mixins\n\nWhile utilities\
    \ are a useful way to share one function, they don’t cover every possible need.\
    \ Our validation utility function could have been more useful if it were in the\
    \ form of a collection of functions that could be used in many places. To do this,\
    \ we can create a mixin. In Ember, a mixin is a collection of properties and functions\
    \ that can be used in any class that depends on them. The definition of these\
    \ properties and functions resides in the mixin, and is available in any class\
    \ that takes advantage of the mixin.\n\nBecause a mixin can contain properties\
    \ and functions, it can be used not only to abstract behavior, but to abstract\
    \ state as well. When a class inherits this mixin, the properties and functions\
    \ of that mixin become part of the definition of the inheriting class. A utility\
    \ function can be used to perform operations on a piece of data passed to it,\
    \ whereas a mixin can be used for operations and state.\n\nNow, let’s see how\
    \ to create our mixin. From a command line, run the following Ember CLI command:\n\
    \n```bash\n$ ember generate mixin validation-functions\n```\n\nWe’re going to\
    \ add two validation routines to this library. We’ll create one that performs\
    \ the same length validation as we performed in the utility. The second will check\
    \ whether a string represents a valid email address.\n\nUpdate the newly created\
    \ mixin class to the following:\n\n[ch7/ember-note/app/mixins/validation-functions.js](http://media.pragprog.com/titles/mwjsember/code/ch7/ember-note/app/mixins/validation-functions.js)\n\
