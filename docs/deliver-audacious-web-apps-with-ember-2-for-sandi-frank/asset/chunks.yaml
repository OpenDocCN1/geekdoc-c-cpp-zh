  trans: "\n在你的浏览器中，你将看到显示的测试结果。滚动结果，你应该能看到失败的测试。在我们修复其中一些失败的测试之前（是的，这些测试确实需要一些调整），让我们先简单聊一下\
    \ Ember CLI 用于完成测试执行的工具。\n\n当你从命令行运行 `ember test` 命令时，Ember CLI 会启动一个 `PhantomJS`\
    \ 实例。PhantomJS 是一个无头 Web 浏览器（没有用户界面的浏览器），完全用 JavaScript 编写。通过使用 PhantomJS，你可以将测试作为持续集成（continuous\
    \ integration）过程的一部分来执行。持续集成是在专用的构建机器上通过自动化过程定期编译软件的实践。使用持续集成，你可以检查新更改是否引入了错误。如果你采用了持续集成，那么你的测试应该在构建过程中运行。使用\
    \ PhantomJS 允许你的测试在不需要在持续集成机器上安装传统浏览器的情况下进行。\n\n当你通过访问 `localhost:4200/tests`\
    \ 运行测试时，你实际上在使用 Ember CLI 在你更新应用时构建的 Ember 应用程序。该应用构建用于运行你的测试并将结果展示给你。它会运行每一个测试，并为你提供几个选项来决定你想查看哪些测试结果。\n\
    \n这两种查看测试结果的方法都是很有用的，并且在你的开发计划中都占有一席。在本章的剩余部分中，我们将依赖于 `localhost:4200` 可见的测试视图，因为它提供了稍微更好的用户体验。\n\
    \n既然有了查看测试结果的方法，让我们从编写我们要编写的最基础的测试开始：单元测试（unit tests）。\n\n## 编写单元测试\n\n使用模块化方法处理\
    \ JavaScript 的用处是，我们可以以模块化的方式考虑我们的测试。Ember CLI 为我们创建每个应用模块创建一个测试模块。让我们现在来看其中一个。当你创建\
    \ note 模型类时，Ember CLI 在 `ember-note/tests/unit` 目录下创建了一个名为 `note-test.js` 的测试文件。生成的文件如下：\n\
    \n```javascript\n// ch8/ember-note/tests/unit/models/notebook-test.js\nimport\
    \ {\n  moduleForModel,\n  test\n} from 'ember-qunit';\n\nmoduleForModel('notebook',\
    \ 'Unit | Model | notebook', {\n  // 指定此此测试所需的其他单元。\n  needs: [];\n});\n\ntest('it\
    \ exists', function(assert) {\n  var model = this.subject();\n  // var store =\
    \ this.store();\n  assert.ok(!!model);\n});\n```\n\n`import` 块从 `ember-qunit`\
    \ 引入了 `moduleForModel` 和 `test` 函数。这些函数在测试类中分别用于加载我们想要测试的类，然后对它执行测试。\n\n| QUnit,\
    \ ember-test-helpers, 和 ember-qunit |\n| :--- |\n| 如果要使用 `ember test` 命令或通过浏览器进行测试，主要主要依赖三个测试框架：`QUnit`\
    \ ([http://qunitjs.com])、`ember-test-helpers` ([https://github.com/switchfly/ember-test-helpers])\
    \ 以及 `ember-qunit` ([https://github.com/rwjblue/ember-qunit])。这些框架中的每一个都为你为测试用例编写的某些代码起着作用。`QUnit`\
    \ 是最初为 jQuery 编写的通用 JavaScript 测试框架；`ember-test-helpers` 是一组 Ember 特有的测试吊架，它需要特定的测试框架（如\
    \ `QUnit`）才能运行；而 `ember-qunit` 将两者结合在一起。 |\n\n### 测试用例依赖\n\n这个生成的单元测试将确认最基础的行为：可以创建\
    \ note 模型类的实例。现在，这个测试是一个失败的测试。如果你查看测试结果，你应该会看到一条类似“No model was found for notebook（未找到\
    \ notebook 模型）”的消息。为什么它报告说找不到 notebook 模型呢？因为 note 模型类包含一个指向 notebook 的 `belongsTo`\
    \ 引用。让我们修复它。将你的测试用例的 `needs` 数组更改如下所示：\n\n```javascript\n// ch8/ember-note/tests/unit/models/notebook-test.js\n\
    needs: [\n  'model:user',\n  'model:note'\n];\n```\n\n一旦你做了该更改，失败的 notebook 模型测试应该就会通过。通过浏览器重新运行测试以确认。如果你想要一组整洁的测试，请按如下更新序列化（serializer）测试：\n\
    \n```javascript\n// ch8/ember-note/tests/unit/serializers/application-test.js\n\
    moduleForModel('user', 'Unit | Serializer | application', {\n  // 指定单元\n  needs:\
    \ ['model']\n});\n```\n\n此更改更新了序列化测试，使其依赖于模型，而该模型确实存在。你可能会注意到 note 测试正在失败。我们很快就会处理它。\n\
    \n### 模型的单元测试\n\n在许多情况下，你可能不需要为你的模型编写测试用例。如果你的类完全依赖于框架的行为（就像我们的类那样），你甚至不需要编写它们。但让我们把事情变得稍微复杂一点，在我们的模型中添加一个函数，用于计算与实例关联的\
    \ note 数量。更新你的模型如下：\n\n```javascript\n// ch8/ember-note/app/models/notebook.js\n\
    import DS from 'ember-data';\n\nexport default DS.Model.extend({\n  title: DS.attr('string'),\n\
    \  user: DS.belongsTo('user'),\n  notes: DS.hasMany('note'),\n  noteCount: function()\
    \ {\n    return this.get('notes.length');\n  }\n});\n```\n\n`noteCount` 函数获取 `notes`\
    \ 属性（它指向关联数组），并返回该数组的长度。这就是它的本意。现在，让我们写一个确认此此点的测试。将你的 `notebook-test.js` 文件更新为：\n\
    \n```javascript\n// ch8/ember-note/tests/unit/models/notebook-test.js\nimport\
    \ {\n  moduleForModel,\n  test\n} from 'ember-qunit';\nimport Ember from 'ember';\n\
    \nmoduleForModel('notebook', 'Unit | Model | notebook', {\n  // 指定此测试所需的其他单元。\n\
    \  needs: [\n    'model:user',\n    'model:note'\n  ];\n});\n\ntest('it exists',\
    \ function(assert) {\n  var model = this.subject();\n  // var store = this.store();\n\
    \  assert.ok(!!model);\n});\n```\n\n"
