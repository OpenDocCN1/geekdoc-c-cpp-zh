    这与为新记录生成的 HTTP `POST` 请求有相似之处。每个请求都包含一个要保存的记录的 JSON 表示。每个记录都使用相同的端点 `/api/notes`。然而，当
    `save` 方法感知到已存在记录时，它会使用 `PUT` 动词；为了标识记录，它会在 URL 中添加一个路径段，该段包含记录中 `id` 字段的值。通过该请求，API
    预期根据请求提供的内容保存记录的更改。


    ### 删除记录


    当然，你的用户有时会犯错，或者想要丢弃某些数据。为此，你可能希望让他们删除记录。Ember Data 提供了两种不同的方法来实现这一点。第一种与我们目前为止看到的方法相似。让我们稍微扩展一下
    EmberNote，允许用户在 `notebooks/notes` 路由中删除笔记。让我们从向笔记列表添加一个删除按钮开始。请确保模板看起来如下所示：


    | [ch5/ember-note/app/notebooks/notes/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch5/ember-note/app/notebooks/notes/template.hbs)
    |

    | ​  | `<div class="col-md-12">`​ |

    | ​  | Notes |

    | ​  | `</div>`​ |

    | ​  | `<div>`​ |

    | ​  | `<div class="col-md-4">`​ |

    | ​  | `<div>`​ |

    | ​  | title: {{input value=title}} `<button {{action ''addNote''}}}}>Add</button>`​
    |

    | ​  | `</div>`​ |

    | ​  | `<div>`​ |

