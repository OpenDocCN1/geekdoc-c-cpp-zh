    | ​  | `note.save();` |

    | ​  | `}` |


    对 `deleteRecord` 的调用并没有从后端完全删除它。如你所见，你还需要对记录调用 `save` 才能将其完全删除。


    与其他方法一样，`save` 会导致向 API 发起 HTTP 请求，这次是一个删除请求：


    ```

    DELETE "/api/notes/12"

    ```


    由于我们正在删除记录，因此不需要除了 URL 中的 ID 之外提供任何额外信息。API 知道它需要知道的一切，并返回成功或失败。


    与其他操作不同，删除也有一种简写形式。`destroyRecord` 方法将直接从服务器删除记录，而无需先调用 `save`。我个人倾向于强调可读性和看起来熟悉的代码，因此我往往倾向于使用
    `deleteRecord` 形式，但这个选项是存在的。


    现在让我们来看看如何确定记录的状态，这可以帮助你决定是否以及需要对它进行什么操作。


    ### 获取记录的状态


    我们构建 EmberNote 时，在保存记录方面是以操作为驱动的，但你可能偶尔想作为后台进程保存记录。在这种模式下，你将希望使用记录的状态来确定要保存哪些记录。要获取记录的状态，调用以下代码：


    ```

    var state = record.get(''currentState.stateName'');

    ```


    记录的状态可以取以下值之一：


    - `root.deleted.saved`

    - `root.deleted.uncommitted`

    - `root.deleted.inFlight`

    - `root.empty`

    - `root.new.saved`

    - `root.new.uncommitted`

    - `root.new.inFlight`

    - `root.new`

    - `root.loaded.saved`

    - `root.loaded.uncommitted`

    - `root.loaded.inFlight`

    - `root.loaded`

    - `root.modified.saved`

    - `root.modified.uncommitted`

    - `root.modified.inFlight`

    - `root.modified`

    - `root.deleted`


    ### 删除记录


    我们构建 EmberNote 时，在保存记录方面是以操作为驱动的，但你可能偶尔作为后台进程保存记录。在这种模式下，你将希望使用记录的状态来确定要保存哪些记录。要获取记录的状态，调用以下代码：


    ```

    var state = record.get(''currentState.stateName'');

    ```


    记录的状态可以取以下值之一：


    - `root.deleted.saved`

    - `root.deleted.uncommitted`

    - `root.deleted.inFlight`

    - `root.empty`

    - `root.new.saved`

    - `root.new.uncommitted`

    - `root.new.inFlight`

    - `root.new`

    - `root.loaded.saved`

    - `root.loaded.uncommitted`

    - `root.loaded.inFlight`

    - `root.loaded`

    - `root.modified.saved`

    - `root.modified.uncommitted`

    - `root.modified.inFlight`

    - `root.modified`

    - `root.deleted`


    ### Ember 插件：Fireplace


    你可能希望完全避免创建后端。如果是这样，你可能对 Firebase 以及一个名为 Fireplace 的 Ember 插件感兴趣。


    Firebase 是一个 API 即服务提供商，你可以用它来托管自定义的 API。位于 [`www.firebase.com`](https://www.firebase.com)
    的商业产品让你快速启动一个可以在应用程序中使用的 API。


    虽然 Firebase 是一个很酷的产品，但我真正感兴趣的是这个插件。该插件维护在 [`github.com/rlsey/fireplace`](https://github.com/rlsey/fireplace)，文档位于
    [`livsey.org/fireplace/`](http://livsey.org/fireplace/)。它将 Firebase 客户端封装在 Ember
    插件中，通过 Ember Data store 将 Firebase 的功能暴露给你的应用程序。


    ### 后续


    Ember Data 在处理 RESTful API 时非常有用。正如我们所看到的，它为从此类服务器获取的数据提供了强大的功能 set。然而，我们只涵盖了故事简单部分。你可能经常需要处理由于某些原因不符合
    Ember Data 预期的 API。如果你发现 API 不符合其预期，也不必放弃 Ember Data。这就是为什么尽管主要关注前端，理解 Ember Data
    生成的 HTTP 流量至关重要。在下一章节中，你将学习一些 Ember Data 特性，它们允许你与遵循自身规则的 API 工作，以及如何让此类 API 实现你的需求。


