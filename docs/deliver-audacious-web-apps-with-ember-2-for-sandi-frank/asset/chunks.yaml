  trans: "\n\n正如编程世界中的许多概念一样，对于什么构成了 RESTful API 存在一些争议。（这通常表现为：“你的 API 不符合 RESTful\
    \ 标准！”“不，是你的 API 不符合 RESTful！”）抛开这些不谈，让我们聊聊如何在 Ember Data 中使用 RESTful API。\n\n\
    通常来说，RESTful 服务是一种使用统一资源标识符来访问数据和执行函数的手段。RESTful 服务通常（但并非总是）使用 HTTP 作为传输协议。每个唯一的\
    \ URI 和动词组合都定义了一个操作，以及应用该操作时使用的相关记录（或一组记录）。例如，如果你想获取 ID 为 `24` 的笔记记录，可以对 `/note/24`\
    \ 发起 `GET` 请求，并期望在记录记录存在时获取到其当前状态。\n\nRESTful API 的实现超出了本书的范围，但我们一直在创建的模拟服务除外（请不要在生产环境中使用这些）。你可能使用任何技术来实现它，例如\
    \ Ruby on Rails、Node.js、Java 或 .NET。选择权交给你。\n\n一旦你定义了模型类，你就会希望能够从该类的 API 端点加载数据。在在此之前，你的应用需要声明\
    \ `DS.RESTAdapter` 类的实例。让我们看看为 EmberNote 项目定义的那个：\n\n`ch5/ember-note/app/adapters/application.js`\n\
    \n```javascript\nimport DS from 'ember-data';\n\nexport default DS.RESTAdapter.extend({\n\
    \  namespace: 'api'\n});\n```\n\n这个适配器极其简洁。这个 `RESTAdapter` 实现的唯一功能就是标识 API 的根\
    \ URL。通常，适配器可以负责比这多的内容，但我们现在将从一个简单的开始，并在适配非传统 API 中更详细地介绍适配器。\n\n有了这个适配器，我们就可以开始查询\
    \ API 中的记录了。\n\n### 查询 API\n\n当我们开始使用 Ember Data 时，我们用它来显示登录用户拥有的笔记本列表。从我们的定义可以看出，每个笔记本记录都属于一个用户：\n\
    \n`ch5/ember-note/app/models/notebook.js`\n\n```javascript\nimport DS from 'ember-data';\n\
    \nexport default DS.Model.extend({\n  title: DS.attr('string'),\n  user: DS.belongsTo('user'),\n\
    \  notes: DS.hasMany('note')\n});\n```\n\n给定该模型，我们使用了笔记本路由的 model hook 来从 API\
    \ 加载数据：\n\n`ch5/ember-note/app/notebooks/route.js`\n\n```javascript\nimport Ember\
    \ from 'ember';\n\nexport default Ember.Route.extend({\n  model: function(params)\
    \ {\n    return this.store.query('notebook',{user: params.user_id});\n  },\n \
    \ actions: {\n    addNotebook: function() {\n      var notebook = this.store.createRecord('notebook',\
    \ {\n        title: this.controller.get('title'),\n        user: this.controllerFor('application').get('user')\n\
    \      });\n      notebook.save().then(() => {\n        console.log('save successful');\n\
    \        this.controller.set('title',null);\n        this.refresh();\n      },\
    \ function() {\n        console.log('save failed');\n      });\n    }\n  }\n});\n\
    ```\n\n正如你从设置你的模型 中记得的那样，model hook 用于获取将要使用的数据。\n\n"
- fmt: "\nWhen working with a browser-side cache, you’ll need to be aware of scenarios\
    \ when other users may have modified cached data. The store isn’t kept up to date\
    \ with each change as it occurs, so it’s a good idea to reload records from the\
    \ server when you need to use them, if they are able to be modified by others.\
    \ To do this, Ember Data provides the `reload` flag for `findRecord` and `findAll`.\
    \ For example, if we want to make sure we have the most recent changes to a shared\
    \ note record when we load our route, we would call the following:\n\n```javascript\n\
    model: function(params) {\n  this.store.findRecord(\"note\", params.id, { reload:true\
    \ })\n}\n```\n\nUsing `reload:true` will always ensure that you get the record\
    \ from the server and include the most recent changes.\n\nThere’s a second way\
    \ to accomplish this, assuming you have a handle on the record. If a record has\
    \ already been loaded in the cache, `findRecord` calls the `reload` method on\
    \ the record instance. If you already have the record, you can do the following\
    \ to refresh this object from the server:\n\n```javascript\nrecord.reload();\n\
    ```\n\n`DS.Store` also contains a method to pull all records of a given type from\
    \ the server, regardless of cache state. To do this, call the `findAll` method\
    \ with `reload:true`:\n\n```javascript\nmodel: function(params) {\n  this.store.findAll(\"\
    note\", { reload:true });\n}\n```\n\nYou may be thinking that the only way to\
    \ guarantee you have the most recent data is to use the `reload` parameter. This\
    \ is partially true, because the `findRecord` and `findAll` methods will return\
    \ records already cached in the store, if any exist. However, `DS.Store` provides\
    \ a way to evict all records of a given type from the store:\n\n```javascript\n\
    model: function(param) {\n  // Before looking for my data, flush the cache\n \
    \ this.store.unloadAll(\"note\");\n  // Now get my records\n  return this.store.query(\"\
    note\", {notebook: param.notebook_id});\n}\n```\n\nCalling `unloadAll` will result\
    \ in a clean slate for the following query method to work with. This is useful\
    \ when you want to be able to execute named-parameter queries against the store,\
    \ while making sure that the results it returns are the most recent data from\
    \ the server.\n\n`DS.Store` has a number of methods for working with server APIs\
    \ and for storing results of API calls in a browser-resident repository. As you’d\
    \ expect, it also provides a number of ways of dealing with those records once\
    \ they’ve been loaded. In the next section we’ll look at how to use Ember Data\
    \ to use the records we get from the API.\n\n## Work with Records\n\nWhile many\
    \ of the methods in the `DS.Store` class deal with loading and caching lists of\
    \ records, your app will also often work with records directly. Sometimes you’ll\
    \ use the store, and sometimes you’ll call methods on the record itself. Let’s\
    \ start with one that we call from the store, and learn how we can add data with\
    \ the Ember app.\n\n### Creating Records\n\nFor users to find your app useful,\
    \ they need to be able to add data to persistent storage. We’ve seen this already\
    \ in the EmberNote application, where users add their own notebooks and notes.\
    \ Let’s take a look at that code now. In the notebooks route, we added a feature\
    \ that let users add a notebook:\n\n`ch5/ember-note/app/notebooks/route.js`\n\n\
    ```javascript\naddNotebook: function() {\n  var notebook = this.store.createRecord('notebook',\
    \ {\n    title: this.controller.get('title'),\n    user: this.controllerFor('application').get('user')\n\
    \  });\n  notebook.save().then(() => {\n    console.log('save successful');\n\
    \    this.controller.set('title',null);\n    this.refresh();\n  }, function()\
    \ {\n    console.log('save failed');\n  });\n}\n```\n\nThe new notebook is created\
    \ in the store by the following code: `var notebook = this.store.createRecord('notebook',\
    \ {...});`. The `createRecord` method takes two parameters. The first parameter\
    \ is the model type of the record you want to create. In this case it’s a `notebook`\
    \ type. The second parameter is a properties list, consisting of a set of key-value\
    \ pairs. The keys should match the names of attributes as defined in the referenced\
    \ model implementation. The values are then set as the value of each attribute.\
    \ In this case we’re pulling the values out of fields in our controller and using\
    \ them to populate the new record.\n\n#### Saving New Records\n\n![images/aside-icons/important.png](images/aside-icons/important.png)\
    \ It’s important to realize that `createRecord` does not result in being written\
    \ to persistent storage. This new record lives only in the store until the next\
    \ block of code is called. To write this record to persistent storage, you must\
    \ call the `save` method on the desired record. The `save` method returns a `Promise`,\
    \ which can resolve to success or failure. The `then` method on the resulting\
    \ `Promise` is called when the Promise resolves, and the second when it does.\
    \ As the save method is called, the store prepares a request. For example, if\
    \ we wanted to create a note with a title “new note,” a description of “description,”\
    \ and belonging to 12, the request would look like this:\n\n```text\nPOST /api/notes\n\
    {note: \"new note\", body: \"description\", notebook: \"12\"}\n```\n\n#### Monitoring\
    \ Request/Response\n\n![images/aside-icons/tip.png](images/aside-icons/tip.png)\
    \ As you’re working through these examples, it can be helpful to keep an eye on\
    \ the request/response traffic. Chrome, Firefox, Safari, and Internet Explorer\
    \ all have built-in developer tools that allow you to observe the traffic. This\
    \ is very useful in investigating Ember Data further. Observe that there are no\
    \ request parameters for this request. We’re simply POSTing to a generic URL for\
    \ the model type: `/api/notes`. The `POST` method for this URL is reserved for\
    \ receiving requests that relate exclusively to the creation of new records, and\
    \ it’s not used for update requests, which use the `PUT` method.\n\nNow that we’ve\
    \ seen how to add new records, let’s look at how to modify existing records.\n\
    \n### Updating Records\n\nThere’s not much difference between how you create a\
    \ record and how you update one: you call the `save` method on a record that has\
    \ the data you want to save. The big difference comes in how Ember Data translates\
    \ the action into an HTTP request.\n\nWhen a `save` is called on a record that\
    \ already exists in persistent storage, this results in an HTTP `PUT` request\
    \ to the API. For example, in the edit-note route, we used the following action\
    \ to save:\n\n`ch4/ember-note/app/components/edit-note/component.js`\n\n```javascript\n\
    import Ember from 'ember';\n\nexport default Ember.Component.extend({\n  actions:\
    \ {\n    saveNote: function() {\n      this.get('note').save();\n    },\n    closeNote:\
    \ function() {\n      this.sendAction('close');\n    }\n  }\n});\n```\n\nThe note\
    \ record, when saved, results in an HTTP request that looks something like this:\n\
    \n```text\nPUT \"/api/notes/12\"\n{note: {title: \"edited note\", body: \"edited\
    \ description\", notebook: \"12\"}}\n```\n"
