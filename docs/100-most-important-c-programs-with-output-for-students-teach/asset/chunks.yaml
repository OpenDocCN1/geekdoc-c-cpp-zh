    \ 3`\n\n## 13. 编写一个使用三元运算符寻找四个数中最小值的程序。\n\n```c\n# include <stdio.h>\n# include\
    \ <conio.h>\n\nmain( )\n{\n    int a,b,c,d,small;\n    printf(\"Enter value a:\
