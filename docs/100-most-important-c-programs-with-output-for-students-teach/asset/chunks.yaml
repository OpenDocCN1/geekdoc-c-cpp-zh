- fmt: "\n# 136. Write a program to display ATM transaction.\n\n## Quick MCQ:\n\n\
    ## Answers-\n\n## Interview Q & A:\n\n## 1. Write a program to perform addition,\
    \ subtraction, multiplication and division.\n\n```c\n#include<stdio.h>\n#include<conio.h>\n\
    \nint main()\n{\n    int first, second, add, subtract, multiply;\n    float divide;\n\
    \    printf(\"Enter two integers:\\n\");\n    scanf(\"%d%d\", &first, &second);\n\
    \    add = first + second;\n    subtract = first - second;\n    multiply = first\
    \ * second;\n    divide = first / (float)second;\n    printf(\"Sum = %d\\n\",add);\n\
    \    printf(\"Difference = %d\\n\",subtract);\n    printf(\"Multiplication = %d\\\
    n\",multiply);\n    printf(\"Division = %.2f\\n\",divide);\n    return 0;\n  \
    \  getch();\n}\n```\n\nSample Output:\n```\nEnter two integers:\n3\n5\nSum = 8\n\
    Difference = -2\nMultiplication = 15\nDivision = 0.60\n```\n\n## 2. How to add\
    \ two numbers without using the plus operator?\n\n```c\n#include<stdio.h>\n#include<conio.h>\n\
    \nint main()\n{\n    int a,b;\n    int sum;\n    printf(\"Enter any two integers:\
    \ \");\n    scanf(\"%d%d\",&a,&b);\n    sum = a - ~b -1;\n    printf(\"Sum of\
    \ two integers: %d\",sum);\n    return 0;\n    getch();\n}\n```\n\nSample output:\n\
    ```\nEnter any two integers: 5, 10\nSum of two integers: 15\n```\n\nFormula:\n\
    In C `~` is 1's complement operator. This is equivalent to:\n`~b = -(b + 1)`\n\
    So, `a - ~b -1`\n`= a-[-(b + 1)] -1`\n`= a + b + 1 - 1`\n`= a + b`\n\n## 3. How\
    \ to subtract two numbers without using the subtraction operator ?\n\n```c\n#include<stdio.h>\n\
    #include<conio.h>\n\nint main()\n{\n    int a,b;\n    int subtract;\n    printf(\"\
    Enter any two integers: \");\n    scanf(\"%d%d\",&a,&b);\n    subtract = a + ~b\
    \ + 1;\n    printf(\"Difference of two integers: %d\",subtract);\n    return 0;\n\
    \    getch();\n}\n```\n\nSample Output:\n```\nEnter any two integers: 5, 4\nDifference\
    \ of two integers: 1\n```\n\nFormula:\nIn C `~` is 1's complement operator. This\
    \ is equivalent to:\n`~b = -(b + 1)`\nSo, `a + ~b +1`\n`= a+[-(b + 1)] +1`\n`=\
    \ a - b - 1 + 1`\n`= a - b`\n\n## 4. Write a program for swapping of two numbers.\n\
    \n```c\n#include<stdio.h>\n#include<conio.h>\n\nint main()\n{\n    int a,b,temp;\n\
    \    printf(\"Enter any two integers: \");\n    scanf(\"%d%d\",&a,&b);\n    printf(\"\
    Before swapping: a = %d, b=%d\",a,b);\n    temp = a;\n    a = b;\n    b = temp;\n\
    \    printf(\"\\nAfter swapping: a = %d, b=%d\",a,b);\n    return 0;\n    getch();\n\
    }\n```\n\nSample output:\n```\nEnter any two integers: 3, 6\nBefore swapping:\
    \ a = 3, b=6\nAfter swapping: a = 6, b=6\n```\n\n## 5. Write a program to add\
    \ digits of a number or calculate sum of digits.\n\n```c\n#include<stdio.h>\n\
    #include<conio.h>\n\nint main()\n{\n    int num,sum=0,r;\n    printf(\"Enter a\
    \ number: \");\n    scanf(\"%d\",&num);\n    while(num)\n    {\n        r=num%10;\n\
    \        num=num/10;\n        sum=sum+r;\n    }\n    printf(\"Sum of digits of\
    \ number:  %d\",sum);\n    return 0;\n    getch();\n}\n```\n\nSample output:\n\
    ```\nEnter a number: 123\nSum of digits of number:  6\n```\n\n## 6. Write a program\
    \ to print complex number.\n\n```c\n#include<stdio.h>\n#include<conio.h>\n\nint\
    \ main()\n{\n    int a,b;\n    printf(\"Enter the real part of complex number:\
    \ \");\n    scanf(\"%d\",&a);\n    printf(\"Enter the imaginary part of complex\
    \ number: \");\n    scanf(\"%d\",&b);\n    printf(\"\\nComplex number is: %d%+di\"\
    ,a,b );\n    return 0;\n    getch();\n}\n```\n\nSample output:\n```\nEnter the\
    \ real part of complex number: 4\nEnter the imaginary part of complex number:\
    \ 2\nComplex number is: 4+2i\n```\nComplex numbers definition: Complex numbers\
    \ are two dimensional numbers i.e. consists real part and imaginary part. Complex\
    \ numbers are written as `a + ib` where `a` and `b` are real numbers.\n\n## 7.\
    \ Write a program to check whether input is a vowel.\n\n```c\n#include<stdio.h>\n\
    #include<conio.h>\n\nint main()\n{\n    char ch;\n    printf(\"Enter a character:\\\
    n\");\n    scanf(\"%c\", &ch);\n    if (ch == 'a' || ch == 'A' || ch == 'e' ||\
    \ ch == 'E' || ch == 'i' || ch == 'I' || ch =='o' || ch=='O' || ch == 'u' || ch\
    \ == 'U')\n    printf(\"%c is a vowel.\\n\", ch);\n    else\n    printf(\"%c is\
    \ not a vowel.\\n\", ch);\n    return 0;\n    getch();\n}\n```\n\nSample Output:\n\
    ```\nEnter a character: i\ni is a vowel\n```\n\n## 8. Write a program to check\
    \ if given integer is positive or negative.\n\n```c\n#include<stdio.h>\n#include<conio.h>\n\
    \nint main()\n{\n    int number;\n    printf(\"Enter a number: \\n\");\n    scanf(\"\
    %d\", &number);\n    if (number >= 0)\n    printf(\"%d is positive number \\n\"\
    , number);\n    else\n    printf(\"%d is negative number \\n\", number);\n   \
    \ getch();\n}\n```\n\nSample Output:\n```\nEnter a number: -4\n-4 is negative\
    \ number\n```\n\n## 9. Write a program to find the area of trapezium.\n\n```c\n\
    #include<stdio.h>\n#include<conio.h>\n\nint main()\n{\n    float b1,b2,h;\n  \
    \  float area;\n    printf(\"Enter the size of two bases and height of the trapezium:\
    \ \");\n    scanf(\"%f%f%f\",b1,&b2,&h);\n    area = 0.5 * ( b1 + b2 ) * h;\n\
    \    printf(\"Area of trapezium is: %.3f\",area);\n    return 0;\n    getch();\n\
    }\n```\n\nSample output:\n```\nEnter the size of two bases and height of the trapezium:\
    \ 5, 8, 3\nArea of trapezium is: 19.500\n```\nFormula of trapezium: `Area = (1/2)\
    \ * (a + b) * h`\n\n## 10. Write a program for swapping of two numbers using function\
    \ (call by value).\n\n```c\n#include<stdio.h>\n#include<conio.h>\n\nvoid swap(int\
    \ a, int b)\n{\n    int temp;\n    temp = a;\n    a = b;\n    b = temp;\n}\n\n\
    int main()\n{\n    int num1 = 10,num2 = 30;\n    printf(\"Before swapping:\\n\
    \ num1 = %d\\n num2 = %d\\n\", num1,num2);\n    swap(num1, num2);\n    printf(\"\
    After swapping:\\n num1 = %d\\n num2 = %d \\n\", num1,num2);\n    return 0;\n\
    \    getch();\n}\n```\n\nSample Output:\n```\nBefore swapping:\nnum1 = 10\nnum2\
    \ = 30\nAfter swapping:\nnum1 = 10\nnum2 = 30\n```\n*(Note: The sample output\
    \ in the original text shows no change, which is expected for call by value)*.\n\
    \n## 11. Write a program to find greatest number between three numbers.\n\n```c\n\
    #include<stdio.h>\n#include<conio.h>\n\nint main()\n{\n    int a,b,c;\n    printf(\"\
    \\nEnter 3 numbers: \");\n    scanf(\"%d %d %d\",&a,&b,&c);\n    if(a-b>0 && a-c>0)\n\
    \    printf(\"\\nGreatest is a :%d\",a);\n    else\n    if(b-c>0)\n    printf(\"\
    \\nGreatest is b :%d\",b);\n    else\n    printf(\"\\nGreatest is c :%d\",c);\n\
    \    return 0;\n    getch();\n}\n```\n\nSample output:\n```\nEnter 3 numbers:\
    \ 2, 6, 4\nGreatest is b: 6\n```\n\n## 12. Write a program to find greatest number\
    \ among four numbers by ternary operator.\n\n```c\n#include<stdio.h>\n# include<conio.h>\n\
    \nmain( )\n{\n    int a,b,c,d,big;\n    printf(\"Enter value a:\");\n    scanf(\"\
    %d\",&a);\n    printf(\"Enter the value of b:\");\n    scanf(\"%d\",&b);\n   \
    \ printf(\"Enter the value of c:\");\n    scanf(\"%d\",&c);\n    printf(\"Enter\
    \ the value of d:\");\n    scanf(\"%d\",&d);\n    big=(a>b)?(a>c)?(a>d)?a:d:(c>d)?c:d:(b>c)?(b>d)?b:d:(c>d)?c:d;\n\
    \    printf(\"Biggest of the given 4 numbers is: %d\",big);\n    getch();\n}\n\
    ```\n\nSample output:\n```\nEnter value a: 8\nEnter the value of b: 4\nEnter the\
    \ value of c: 9\nEnter the value of d: 6\nBiggest of the given 4 numbers is: 9\n\
    ```\n\n### Ternary Operator\nThe ternary operator is an operator that takes three\
    \ arguments. The first argument is a comparison argument, the second is the result\
    \ upon a true comparison, and the third is the result upon a false comparison.\
    \ It is commonly referred to as Conditional Operator.\nIn computer programming,\
    \ `?:` is a ternary operator that is part of the syntax for a basic conditional\
    \ expression in several programming languages.\nSyntax: `expression 1 ? expression\
    \ 2 : expression 3`\n\n## 13. Write a program to find smallest number among four\
    \ numbers by using ternary operator.\n\n```c\n# include <stdio.h>\n# include <conio.h>\n\
    \nmain( )\n{\n    int a,b,c,d,small;\n    printf(\"Enter value a: \");\n    scanf(\"\
    %d\",&a);\n    printf(\"Enter the value of b: \");\n    scanf(\"%d\",&b);\n  \
    \  printf(\"Enter the value of c: \");\n    scanf(\"%d\",&c);\n    printf(\"Enter\
    \ the value of d: \");\n    scanf(\"%d\",&d);\n    small=(a<b)?(a<c)?(a<d)?a:d:(c<d)?c:d:(b<c)?(b<d)?b:d:(c<d)?c:d;\n\
    \    printf(\"Smallest of the given 4 numbers is: %d\",small);\n    getch();\n\
