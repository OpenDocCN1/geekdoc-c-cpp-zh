    \n公式：\n在 C 语言中 `~` 是按位取反运算符。它相当于：\n`~b = -(b + 1)`\n所以，`a - ~b -1`\n`= a-[-(b\
    \ + 1)] -1`\n`= a + b + 1 - 1`\n`= a + b`\n\n## 3. 如何在不使用减法运算符的情况下两个两个数？\n\n```c\n\
