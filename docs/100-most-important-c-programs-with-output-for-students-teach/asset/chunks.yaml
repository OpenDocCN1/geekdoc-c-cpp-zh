    \ and variable definition ?\n\nDeclaration associates type to the variable whereas\
    \ definition gives the value to the variable.\n\nQ.3 What is the default value\
    \ of local and global variables ?\n\nLocal variables get garbage value and global\
    \ variables get a value 0 by default.\n\nQ.4 is it possible to create your own\
    \ header files ?\n\nYes, it is possible to create a customized header file. Just\
    \ include in it the function prototypes that you want to use in your program,\
    \ and use the #include directive followed by the name of your header file.\n\n\
    Q.5 What is the use of a semicolon (;) at the end of every program statement ?\n\
    \nIt has to do with the parsing process and compilation of the code. A semicolon\
    \ acts as a delimiter, so that the compiler knows where each statement ends, and\
    \ can proceed to divide the statement into smaller elements for syntax checking.\n\
    \nQ.6 Can I use  “int” data type to store the value 32768? Why ?\n\nNo. “int”\
    \ data type is capable of storing values from -32768 to 32767\\. To store 32768,\
    \ you can use “long int” instead. You can also use “unsigned int”, assuming you\
    \ don’t intend to store negative values.\n\nQ.7 In C language, the variables NAME,\
    \ name, and Name are all the same. TRUE or FALSE ?\n\nFALSE. C language is a case\
    \ sensitive language. Therefore, NAME, name and Name are three uniquely different\
    \ variables.\n\nQ.8 What is wrong with this statement? myName = “Robin”;\n\nYou\
