    No. `if` command can only be used to compare numerical values and single character
    values. For comparing string values, there is another function called `strcmp`
    that deals specifically with strings.


    ### Q.11 What is the difference between the expression `++a` and `a++`?


    In the first expression, the increment would happen first on variable `a`, and
    the resulting value will be the one to be used. This is also known as a prefix
    increment. In the second expression, the current value of variable `a` would the
    one to be used in an operation, before the value of `a` itself is incremented.
    This is also known as postfix increment.


    ### Q. 12 How a negative integer is stored?


    Get the two''s compliment of the same positive integer. Eg: `1101` (-5)


    - Step-1? One''s compliment of `5`: `1010`

    - Step-2? Add `1` to above, giving `1011`, which is `-5`.


    ### Q.13 How many operators are there under the category of ternary operators?


    There is only one operator and is conditional operator `? :` .


    ### Q.14 Does a break is required by default case in switch statement?


    Yes, if it is not appearing as the last case and if we do not want the control
    to flow to the following case after default if any.


    ### Q.15 Which key word is used to perform unconditional branching?


    `goto`


    ### Q.16 Which function can be used to release the dynamic allocated memory?


    `free()`


    ### Q.17 What is a pointer on pointer?


    It''s a pointer variable which can hold the address of another pointer variable.
    It de-refers twice to point to the data held by the designated pointer variable.


    Eg: `int x = 5, *p=&x, **q=&p;`


    ### Q.18 What is the advantage of declaring void pointers?


    When we do not know what type of the memory address the pointer variable is going
    to hold, then we declare a void pointer for such.


    ### Q.19 When to user `->` (arrow) operator?


    If the structure/union variable is a pointer variable, to access structure/union
    elements the arrow operator is used.


    ### Q.20 What is a nested structure?


    A structure containing an element of another structure as its member is referred
    so.


