  \ 10. 编写一个使用函数（值传递）交换两个数的程序。\n\n```c\n#include<stdio.h>\n#include<conio.h>\n\nvoid\
  \ swap(int a, int b)\n{\n    int temp;\n    temp = a;\n    a = b;\n    b = temp;\n\
  }\n\nint main()\n{\n    int num1 = 10,num2 = 30;\n    printf(\"Before swapping:\\\
  n num1 = %d\\n num2 = %d\\n\",num1,num2);\n    swap(num1,num2);\n    printf(\"After\
  \ swapping:\\n num1 = %d\\n num2 = %d \\n\",num1,num2);\n    return 0;\n    getch();\n\
  }\n```\n\n示例输出：\n```\nBefore swapping:\nnum1 = 10\nnum2 = 30\nAfter swapping:\n\
  num1 = 10\nnum2 = 30\n```\n（注：原文中的示例输出没有变化，这对于值传递来说是预期的。）\n\n## 11. 编写一个寻找三个数之间最大值的程序。\n\
  \n```c\n#include<stdio.h>\n#include<conio.h>\n\nint main()\n{\n    int a,b,c;\n\
  \    printf(\"\\nEnter 3 numbers: \");\n    scanf(\"%d %d %d\",&a,&b,&c);\n    if(a-b>0\
  \ && a-c>0)\n    printf(\"\\nGreatest is a :%d\",a);\n    else\n    if(b-c>0)\n\
  \    printf(\"\\nGreatest is b :%d\",b);\n    else\n    printf(\"\\nGreatest is\
  \ c :%d\",c);\n    return 0;\n    getch();\n}\n```\n\n示例输出：\n```\nEnter 3 numbers:\
  \ 2, 6, 4\nGreatest is b: 6\n```\n\n## 12. 编写一个使用三元运算符寻找四个数中最大值的程序。\n\n```c\n#include<stdio.h>\n\
  # include<conio.h>\n\nmain( )\n{\n    int a,b,c,d,big;\n    printf(\"Enter value\
  \ a:\");\n    scanf(\"%d\",&a);\n    printf(\"Enter the value of b:\");\n    scanf(\"\
  %d\",&b);\n    printf(\"Enter the value of c:\");\n    scanf(\"%d\",&c);\n    printf(\"\
  Enter the value of d:\");\n    scanf(\"%d\",&d);\n    big=(a>b)?(a>c)?(a>d)?a:d:(c>d)?c:d:(b>c)?(b>d)?b:d:(c>d)?c:d;\n\
  \    printf(\"Biggest of the given 4 numbers is: %d\",big);\n    getch();\n}\n```\n\
  \n示例输出：\n```\nEnter value a: 8\nEnter the value of b: 4\nEnter the value of c: 9\n\
  Enter the value of d: 6\nBiggest of the given 4 numbers is: 9\n```\n\n### 三元运算符\n\
  三元运算符是一个接受三个参数的运算符。第一个参数是比较参数，第二个是为真时的结果，第三个是为假时的结果。它通常被称为条件运算符。\n在计算机编程中，`?:` 是许多编程语言中基础条件表达式的一部分。\n\
  语法：`expression 1 ? expression 2 : expression 3`\n\n## 13. 编写一个使用三元运算符寻找四个数中最小值的程序。\n\
  \n```c\n# include <stdio.h>\n# include <conio.h>\n\nmain( )\n{\n    int a,b,c,d,small;\n\
  \    printf(\"Enter value a: \");\n    scanf(\"%d\",&a);\n    printf(\"Enter the\
  \ value of b: \");\n    scanf(\"%d\",&b);\n    printf(\"Enter the value of c: \"\
  );\n    scanf(\"%d\",&c);\n    printf(\"Enter the value of d: \");\n    scanf(\"\
  %d\",&d);\n    small=(a<b)?(a<c)?(a<d)?a:d:(c<d)?c:d:(b<c)?(b<d)?b:d:(c<d)?c:d;\n\
  \    printf(\"Smallest of the given 4 numbers is: %d\",small);\n    getch();\n}\n\
