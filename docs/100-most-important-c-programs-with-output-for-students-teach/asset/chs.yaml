  \    quotient=decimalNumber;\n    while(quotient!=0)\n    {\n        octalNumber[i++]=\
  \ quotient % 8;\n        quotient = quotient / 8;\n    }\n    printf(\"Equivalent\
  \ octal value of decimal number %ld: \",decimalNumber);\n    for(j = i -1;j> 0;j--)\n\
