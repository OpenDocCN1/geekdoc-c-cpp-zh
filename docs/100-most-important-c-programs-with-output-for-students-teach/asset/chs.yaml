  \ 28) b, 29) b, 30) c\n\n# 面试问答：\n\nQ.1 程序没有 `main()` 函数可以编译吗？\n可以编译，但不能执行，因为执行需要\
  \ `main()` 函数的定义。\n\nQ.2 变量声明和变量定义之间有什么区别？\n声明为变量关联类型，而定义是为变量赋值。\n\nQ.3 局部变量和全局变量的默认值是什么？\n\
  局部变量获得垃圾值，全局变量获得值 0。\n\nQ.4 可以创建自己的头文件吗？\n可以，可以创建自定义的头文件。只需在其中包含你想在程序中使用的函数原型，并使用\
  \ `#include` 指令后跟你的头文件名称即可。\n\nQ.5 每个程序语句末尾分号（`;`）的作用是什么？\n这与代码的解析过程和编译有关。分号充当分隔符，让编译器知道每条语句何时结束，并可以继续将语句拆分为较小的元素进行语法检查。\n\
  \nQ.6 我可以使用 `int` 类型来存储值 32768 吗？为什么？\n不可以。`int` 类型能够存储从 -32768 到 32767 的值。\n\n\n\
  \n\n`if` 命令只能用于比较数值和单字符值。对于字符串值的比较，有一个名为 `strcmp` 的函数，它专门用于处理字符串。\n\n### Q.11 表达式\
  \ `++a` 和 `a++` 之间有什么区别？\n\n在第一个表达式中，增量操作会先发生于变量 `a`，并使用得到的结果作为值。这也被称为前缀增量。在第二个表达式中，变量\
  \ `a` 的当前值将先用于操作，然后 `a` 本身的值才会递增。这也被称为后置增量。\n\n### Q. 12 负整数是如何存储的？\n\n获取相同正整数的补码。例如：`1101`\
  \ (-5)\n\n- 步骤-1？取 `5` 的反码：`1010`\n- 步骤-2？在上述基础上加 `1`，得到 `1011`，即为 `-5`。\n\n###\
  \ Q.13 三元运算符分类下有多少个运算符？\n\n只有一个运算符，即条件运算符 `? :` `。\n\n### Q.14 switch 语句中的 default\
  \ case 默认需要 break 吗？\n\n是的，如果它不是最后一个 case，并且我们不希望控制流在执行 default 之后流到下一个 case（如果有的话）。\n\
  \n### Q.15 使用哪个关键字可以执行无条件分支？\n\n`goto`\n\n### Q.16 哪个函数可以释放动态分配的内存？\n\n`free()`\n\
  \n### Q.17 什么是指针的指针（二级指针）？\n\n它是一个可以存放另一个指针变量地址的指针变量。通过两次引用来指向指定指针变量所持的数据。\n\n例如：`int\
  \ x = 5, *p=&x, **q=&p;`\n\n### Q.18 声明 void 指针的优势是什么？当我们不知道指针变量将持有什么种类型的内存地址时，我们就为此声明一个\
  \ void 指针。\n\n### Q.19 何时使用 `->`（箭头）运算符？\n\n如果结构体/联合体变量是一个指针变量，则使用箭头运算符来访问结构体/联合体的元素。\n\
  \n### Q.20 什么是嵌套结构？\n\n包含另一个结构体的元素作为其成员的结构被称为嵌套结构。\n\n感谢阅读我的书。希望你已经从这本书中中学到了很多编程知识。\n\
