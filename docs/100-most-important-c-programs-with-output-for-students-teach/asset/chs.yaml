  ```\nEnter any binary number: 1101\nEquivalent decimal value: 13\n```\n公式：\n二进制系统：它是\
  \ 2 进制，使用数字 0 和 1。\n十进制系统：它是 10 进制，使用数字 0 到 9。\n从二进制转十进制的方法：将每个位数字从右侧乘以 1, 2, 4,\
  \ 8, 16 等，然后相加。\n二进制转十进制示例：\n例如，我们要将二进制数 10111 转换为十进制：\nStep 1: 1 * 1 = 1\nStep\
  \ 2: 1 * 2 = 2\nStep 3: 1 * 4 = 4\nStep 4: 1 * 8 = 8\nStep 5: 0 * 16 = 0\nStep 6:\
  \ 1 * 32 = 32\n其十进制值：1 + 2 + 4 + 8 + 0 + 32 = 47\n即 (101111)2 = (47)10\n\n## 54.\
  \ 写一个十进制转八进制的转换器。\n\n```c\n#include<stdio.h>\n#include<conio.h>\n\nint main()\n\
