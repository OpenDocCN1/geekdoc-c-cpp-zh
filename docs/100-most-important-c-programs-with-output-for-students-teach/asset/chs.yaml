  ```\nEnter any decimal number: 50\nEquivalent octal value of decimal number 50:\
  \ 62\n```\n算法：\n八进制系统：它是 8 进制，使用数字 0 到 7。\n十进制系统：它是 10 进制，使用数字 0 到 9。\n十进制转八进制转换方法：\n\
  Step 1: 将原始十进制除以 8\nStep 2: 将商除以 8\nStep 3: 重复步骤 2，直到商为 0。\n结果八进制数将是每步余数的倒序排列。\n\
  十进制转八进制示例：\n例如，我们将十进制数 525 转换为八进制。\nStep 1: 525 / 8 Remainder : 5 , Quotient : 65\n\
  Step 2: 65 / 8 Remainder : 1 , Quotient : 8\nStep 3: 8 / 8 Remainder : 0 , Quotient\
  \ : 1\nStep 4: 1 / 8 Remainder : 1 , Quotient : 0\n所以对应的八进制数是：1015\n即 (525)10 =\
  \ (1015)8\n\n# 55. 如何将大位二进制数转换为十六进制。\n\n```c\n#include<stdio.h>\n#include<conio.h>\n\
