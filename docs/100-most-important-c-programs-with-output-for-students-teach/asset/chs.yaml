  \ hexadecimal value: \");\n\nwhile(j>=0)\n{\n    printf(\"%c\",hexaDecimal[j--]);\n\
  }\n\nreturn 0;\n\ngetch();\n}\n```\n\n### Sample output\n```\nEnter any number any\
  \ binary number: 1010011011100011110\n001001111011110001000100011101110111011110\n\
  Equivalent hexadecimal value: 14DC789EF111DDDE\n```\n\n### Formula\n#### 二进制转十六进制的转换方法：\n\
  **步骤 1**: 将二进制数从右侧每 4 位一组进行排列。\n\n**步骤 2**: 将每组替换为以下值：\n\n| 二进制数 | 十六进制值 |\n| :---\
  \ | :--- |\n| 0000 | 0 |\n| 0001 | 1 |\n| 0010 | 2 |\n| 0011 | 3 |\n| 0100 | 4 |\n\
  | 0101 | 5 |\n| 0110 | 6 |\n| 0111 | 7 |\n| 1000 | 8 |\n| 1001 | 9 |\n| 1010 | A\
  \ |\n| 1011 | B |\n| 1100 | C |\n| 1101 | D |\n| 1110 | E |\n| 1111 | F |\n\n####\
  \ 二进制转十六进制的示例：\n例如，我们想要将二进制数 `11011010101001101` 转换为十六进制。\n\n**步骤 1**: `0001 1011\
  \ 0101 0100 1101`\n**步骤 2**: `1 B 5 4 D`\n所以 `(1011010101001101)2 = (1B54D)16`\n\
