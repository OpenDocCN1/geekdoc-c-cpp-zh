  \n```c\n#include<stdio.h>\n#include<conio.h>\n\nint main()\n{\n    int first, second,\
  \ add, subtract, multiply;\n    float divide;\n    printf(\"Enter two integers:\\\
  n\");\n    scanf(\"%d%d\", &first, &second);\n    add = first + second;\n    subtract\
  \ = first - second;\n    multiply = first * second;\n    divide = first / (float)second;\n\
  \    printf(\"Sum = %d\\n\",add);\n    printf(\"Difference = %d\\n\",subtract);\n\
  \    printf(\"Multiplication = %d\\n\",multiply);\n    printf(\"Division = %.2f\\\
  n\",divide);\n    return 0;\n    getch();\n}\n```\n\n示例输出：\n```\nEnter two integers:\n\
  3\n5\nSum = 8\nDifference = -2\nMultiplication = 15\nDivision = 0.60\n```\n\n##\
  \ 2. 如何在不使用加法运算符的情况下两个数？\n\n```c\n#include<stdio.h>\n#include<conio.h>\n\nint main()\n\
  {\n    int a,b;\n    int sum;\n    printf(\"Enter any two integers: \");\n    scanf(\"\
  %d%d\",&a,&b);\n    sum = a - ~b -1;\n    printf(\"Sum of two integers: %d\",sum);\n\
  \    return 0;\n    getch();\n}\n```\n\n示例输出：\n```\nEnter any two integers: 5, 10\n\
  Sum of two integers: 15\n```\n\n公式：\n在 C 语言中 `~` 是按位取反运算符。它相当于：\n`~b = -(b + 1)`\n\
  所以，`a - ~b -1`\n`= a-[-(b + 1)] -1`\n`= a + b + 1 - 1`\n`= a + b`\n\n## 3. 如何在不使用减法运算符的情况下两个两个数？\n\
  \n```c\n#include<stdio.h>\n#include<conio.h>\n\nint main()\n{\n    int a,b;\n  \
  \  int subtract;\n    printf(\"Enter any two integers: \");\n    scanf(\"%d%d\"\
  ,&a,&b);\n    subtract = a + ~b + 1;\n    printf(\"Difference of two integers: %d\"\
  ,subtract);\n    return 0;\n    getch();\n}\n```\n\n示例输出：\n```\nEnter any two integers:\
  \ 5, 4\nDifference of two integers: 1\n```\n\n公式：\n在 C 语言中 `~` 是按位取反运算符。它相当于：\n\
  `~b = -(b + 1)`\n所以，`a + ~b +1`\n`= a+[-(b + 1)] +1`\n`= a - b - 1 + 1`\n`= a -\
  \ b`\n\n## 4. 编写一个交换两个数的程序。\n\n```c\n#include<stdio.h>\n#include<conio.h>\n\nint\
  \ main()\n{\n    int a,b,temp;\n    printf(\"Enter any two integers: \");\n    scanf(\"\
  %d%d\",&a,&b);\n    printf(\"Before swapping: a = %d, b=%d\",a,b);\n    temp = a;\n\
  \    a = b;\n    b = temp;\n    printf(\"\\nAfter swapping: a = %d, b=%d\",a,b);\n\
  \    return 0;\n    getch();\n}\n```\n\n示例输出：\n```\nEnter any two integers: 3, 6\n\
  Before swapping: a = 3, b=6\nAfter swapping: a = 6, b=6\n```\n\n## 5. 编写一个计算数字各位位或计算数字之和的程序。\n\
  \n```c\n#include<stdio.h>\n#include<conio.h>\n\nint main()\n{\n    int num,sum=0,r;\n\
  \    printf(\"Enter a number: \");\n    scanf(\"%d\",&num);\n    while(num)\n  \
  \  {\n        r=num%10;\n        num=num/10;\n        sum=sum+r;\n    }\n    printf(\"\
  Sum of digits of number:  %d\",sum);\n    return 0;\n    getch();\n}\n```\n\n示例输出：\n\
  ```\nEnter a number: 123\nSum of digits of number:  6\n```\n\n## 6. 编写一个打印复数的程序。\n\
