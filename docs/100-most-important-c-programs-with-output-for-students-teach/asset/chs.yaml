  ## 14. 编写一个使用动态内存分配寻找最大元素的程序。\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n\
  #include <conio.h>\n\nint main()\n{\n    int i,n;\n    float *data;\n}\n```\n\n\n\
  \n\n\n```c\nprintf(\"Enter total number of elements(1 to 100): \");\nscanf(\"%d\"\
  ,&n);\ndata=(float*)calloc(n,sizeof(float));\nif(data==NULL)\n{\n    printf(\"Error!!!\
  \ memory not allocated.\");\n    exit(0);\n}\nprintf(\"\\n\");\nfor(i=0;i<n;++i)\n\
  {\n    printf(\"Enter Number %d: \",i+1);\n    scanf(\"%f\",data+i);\n}\nfor(i=1;i<n;++i)\n\
  {\n    if(*data<*(data+i))\n        *data=*(data+i);\n}\nprintf(\"Largest element\
  \ = %.2f\",*data);\nreturn 0;\ngetch();\n```\n\n示例输出：\n输入元素总个数 (1 到 100): 10\n输入数字\
  \ 1: 5\n输入数字 2: 8\n输入数字 3: 6.2\n输入数字 4: 5.4\n输入数字 5: 30\n输入数字 6: -7\n输入数字 7: -56\n\
  输入数字 8: 53\n输入数字 9: 56\n输入数字 10: 34\n最大元素 = 56.00\n\n### 动态内存分配\n\n数组的确切大小在编译时是未知的，即编译器将编程语言编写的代码编译成可执行格式的时间。你最初声明的数组大小有时不足，有时又超过。动态内存分配允许程序在运行时获取更多内存空间，或者在不需要空间时释放空间。\n\
  \n虽然 C 语言本身没有任何动态分配内存的技术，但在 `\"stdlib.h\"` 下有 4 个库函数用于动态内存分配。\n\n| 函数 | 函数用途 |\n\
  | :--- | :--- |\n| `malloc()` | 分配请求的字节数并返回分配空间第一个字节的指针。语法：`ptr=(cast-type*)malloc(byte-size)`\
  \ |\n| `calloc()` | 为数组元素分配空间，初始化为零，然后返回内存指针。语法：`ptr=(cast-type*)calloc(n,element-size);`\
  \ |\n| `free()` | 释放之前分配的空间。语法：`free(ptr);` |\n| `realloc()` | 改变之前分配的大小。语法：`ptr=realloc(ptr,newsize);`\
  \ |\n\n### 15. 写一个程序打印 1 到 100 之间的完美数。\n\n```c\n#include<stdio.h>\n#include<conio.h>\n\
  int main()\n{\n    int n,i,sum;\n    printf(\"Perfect numbers are: \");\n    for(n=1;n<=100;n++)\n\
  \    {\n        i=1;\n        sum = 0;\n        while(i<n)\n        {\n        \
  \    if(n%i==0)\n                sum=sum+i;\n            i++;\n        }\n     \
  \   if(sum==n)\n        printf(\"%d \",n);\n    }\n    return 0;\n    getch();\n\
  }\n```\n示例输出：\n完美数有: 6, 28\n\n#### 完美数的定义\n什么是完美数？\n完美数是一个正整数，其除该数本身以外的所有因数之和等于该数本身。例如，6\
  \ 是一个完美数，因为 6 的因数是 1、2 和 3。它的因数之和为 `1+2+3=6`。注意：6 是最小的完美数。下一个完美数是 28，因为 `1+2+4+7+14=28`。一些完美数有：496,\
  \ 8128。\n\n### 16. 写一个程序反转给定的数字。\n\n```c\n#include<stdio.h>\n#include<conio.h>\n\
