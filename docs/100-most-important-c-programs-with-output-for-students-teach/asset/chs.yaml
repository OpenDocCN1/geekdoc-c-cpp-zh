  \     binaryNumber[i] = binaryNumber[i] -48;\n        ++i;\n    }\n    --i;\n  \
  \  while(i-2>=0)\n    {\n```\n\n\n\n\n\n```c\ntemp = binaryNumber[i-3] *8 + binaryNumber[i-2]\
  \ *4 + binaryNumber[i-1] *2 + binaryNumber[i];\n\nif(temp > 9)\n    hexaDecimal[j++]\
  \ = temp + 55;\nelse\n    hexaDecimal[j++] = temp + 48;\n\ni=i-4;\n}\n\nif(i ==\
  \ 1)\n    hexaDecimal[j] = binaryNumber[i-1] *2 + binaryNumber[i] + 48;\nelse if(i==0)\n\
