    弗兰克思考了片刻。“如果你当时跳过了重复工作呢？如果你当时只使用深度优先搜索呢？”


    “我们会掉进一个长长的死胡同并耗光咖啡，”她回答道，“我开始不是就告诉过你它救了我的命吗？”


    “有道理。那是运气问题。最近的补给站可能在长度为五的深度优先搜索之后。”


    “哈！你比这更清楚，弗兰克。你总能找到幸运或倒霉的问题。迭代加深可以帮助你应对极端倒霉的情况。它限制了你在任何迭代中可以走多远。”


    “其他算法也能做到，”他反驳道。


    梅维斯皱起眉。“我没说迭代加深是唯一能救我们的算法。我说它是我们使用的那一个。从以后我一直用它。”


    有一次我甚至用它追踪了一群愤怒的乌鱼，就在它们在首府港口喷墨水之前。噢，那将是一场大混乱。有些时候我在想，我是不是该由让他们去做的。国王的反应将是无价的。


    弗兰克思考了很久，想着迭代加深是否能在这里救他。通过更早地停止搜索，他可以回溯并追踪那个神秘联盟的线索。但那样他就不会遵循最高优先的线索了。


    他摇摇头。“我还是坚持我常用的搜索方式，”他终于说道。


    梅维斯严肃地点头，看向海洋。“好吧，弗兰克。但要小心，你没多少时间，长死胡同的代价是高昂的。对于任何算法，你至少应该考虑如何保护自己免遇到最坏的情况。”


    # 警察算法 101：迭代加深


    节选德雷克（Drecker）教授的讲座


    迭代加深是深度优先搜索的一种改进，它重复执行深度限制的深度优先搜索。在迭代加深的第 $k$ 次迭代（或轮次）中，算法执行 $max-depth = k$ 的深度限制搜索。

    再次考虑从 A 市开始搜索嫌疑人的例子。


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_138_0.png)


    我们从深度优先搜索开始，但在第一个节点 A 后停止。这相当于将自己限制在仅搜索犯罪现场。


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_138_1.png)


    下一次迭代重启深度优先搜索，但允许它探索一个城市范围。我们覆盖了邻近城市，访问了 A、B 和 D。


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_139_0.png)


    下一次迭代重启深度优先搜索，但允许它探索一个城市范围。我们覆盖了邻近城市，访问了 A、B 和 D。


    下一次迭代重启深度优先搜索，但允许它探索一个城市范围。我们覆盖了邻近城市，访问了 A、B 和 D。


    虽然迭代加深增加了计算成本，但它有优势。它结合了深度优先搜索的内存效率和广度优先搜索的完整性。


    # 倒排索引


    目录确实提供了书籍主题的索引。但目录对于这种搜索来说组织方式是错误的。它是按照出现的顺序列主题的。如果你想知道接下来是什么，这种排序很不错。


