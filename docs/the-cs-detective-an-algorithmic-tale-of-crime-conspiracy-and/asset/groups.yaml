    # Difficult Search Problems


    Get out,” repeated Dr. Loop.


    “I’m here on official police business,” Frank responded, not moving from his chair.
    He could hear soft footsteps behind him as whoever held the crossbow moved forward.


    “Unlikely,” said Dr. Loop. “I’ve known Captain Donovan a long time, and he’s not
    the sort to rely on private investigators. As I recall, he takes particular pleasure
    in developing novel threats to keep busybodies away from active cases.


    Frank started to reach into his pocket.


    “No sudden moves,” said a gruff voice behind him. Frank felt his temper flare.
    He hated having crossbows pointed at him, an admittedly common experience in his
    profession. “I’m getting a parchment,” he said through gritted teeth.


    “Get it slowly then,” said the voice. “If you move quickly, I will shoot.


    Frank groaned silently. Only one type of person spoke like that—Booleans. Booleans’
    black-and-white view of the world made them particularly effective as security
    guards. You couldn’t talk yourself out of trouble with a Boolean. Either you were
    breaking the rules, or you weren’t.'
- md: '

    Frank moved extra slowly as he retrieved the captain''s letter. He leaned forward,
    taking a full minute to place the letter on the desk. He didn''t sit back. The
    less he moved, the better.


    After studying the note for a while, Dr. Loop nodded to her guard. Frank heard
    the crossbow''s safety snap. He exhaled in relief and leaned back in the chair.
    Dr. Loop waved the guard out of the room.


    "You had Captain Donovan write you a letter of introduction?" asked Dr. Loop.


    "As you said, it''s a sensitive topic," replied Frank.


    "And you probably heard of my reputation." Dr. Loop chuckled.


    "I took your class," Frank muttered, but Dr. Loop didn''t hear.


    "So you''re investigating the thefts. What do you want to know?"


    In an instant his demeanor had changed completely. His eyes rapidly scanned his
    face, as though analyzing every reaction. All traces of pleasantry were gone;
    his voice was all business. Frank wondered how much of his pleasant chit-chat
    had been an act. Wizard Criminology was a dangerous field, and Dr. Loop had survived
    a long time.


    "What magical protections do police stations have?" asked Frank.


    "Basic alerting spells," said Dr. Loop. "They will tell you if someone uses magic
    in the station, but they won''t prevent it."


    "Why not a magical barrier?"


    "Not practical," explained the professor. "The police force uses too many wizard
    consultants. They need to be cast divining spells on the evidence, truth spells
    for the prisoners, magical mirroring spells for the records, and reheating spells
    for lunch."


    Frank nodded, remembering the conversation about magical priority queues.


    "It would be too expensive anyway," added Dr. Loop. "Only the royal castle and
    prison have more than the basic alerting spells. The castle has a bunch of protection
    spells, but no dampening spells. Marcus does too much work there for the king."


    "So someone could use magic in the castle?" Frank confirmed.


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_238_0.png)


    "They could," replied Dr. Loop, "but it wouldn''t be wise. The castle has a dozen
    protective spells that will block offensive magic. King Fredrick also employs
    a half-dozen wizard guards. They''re junior, but they can undo a basic curse.
    And then there is Marcus. Few wizards would want to cross him."


    "What about artifacts?"


    "Ah. Now that''s a good question. It depends on the artifact. The castle has protection
    against weaponized artifacts, of course, but nothing can protect all artifacts.
    There are simply too many varieties. Since most artifacts do not require new magic
    (having been previously enchanted), not even the spell-blocking spells in the
    prison could help here."


    "What?" asked Frank. "I thought the prison was immune to all magic. They don''t
    keep wizards there? In fact, isn''t Exponentent there? He tried to destroy the
    entire kingdom with magic. Why don''t they just block all magical artifacts from
    working?"


    Dr. Loop gave a dry laugh. "Sorry to disappoint you, but you can''t block all
    the artifacts. Don''t worry, though; the royal wizards keep the most powerful
    ones well guarded. And all prisoners are thoroughly searched when they arrive."


    "What other protection does the prison have?" asked Frank, panic building as the
    pieces started to fall into place.


    "Spell of Difficult Searching?" interrupted Frank.


    "It is not new."


    "What does the Spell of Difficult Searching do?" asked Frank, a feeling of dread.


    "It makes it hard to find things," Frank explained. "If you''re looking for a
    specific person or object, the spell scrambles the magical environment. It''s
    like trying to find a needle in a haystack, but the haystack is moving."

