    \ efficiency for the algorithms.\n\nHowever, many search spaces come with constraints\
    \ on how you move from state to state. If you are searching a castle in the physical\
    \ world, you can't jump arbitrarily between rooms—you have to traverse the halls\
    \ and rooms in between. Similar constraints can also apply in the computational\
    \ realm for data structures like graphs or linked lists.\n\nEven in cases where\
    \ you can jump between states, it is often useful to picture backtracking as moving\
    \ through previous states on your way to explore new states. In the algorithmic\
    \ world, this can be significantly less costly than physically retracing your\
    \ route. However, the processes are conceptually similar: you back up the search\
    \ and proceed down a different avenue.\n\nIn the following lectures, we'll see\
    \ many examples of searches that backtrack when they hit dead ends. And once you\
