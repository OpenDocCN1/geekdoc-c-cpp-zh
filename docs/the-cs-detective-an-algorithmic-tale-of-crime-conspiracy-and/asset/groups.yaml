    到此为止，算法是在搜索空间的基础上提出的，在这些空间中，算法可以从任意状态高效地跳转到另一个任意状态。例如，在数组中，你只需要通过索引就可以轻松检查任何位置的值。在酒店走廊里，你可以在房间之间自由奔跑。这种灵活性为算法提供了效率。


    然而，许多搜索空间对状态与状态之间的移动是有限制的。如果你在物理世界中搜寻一座城堡，你不能在房间之间任意跳跃——你必须穿过其间的走廊和房间。类似的限制也适用于图或链表等计算领域中的数据结构。


    即使在可以在状态之间跳转的情况下，将回溯（backtracking）想象成在探索新状态的过程中回到之前的状态通常也是很有用的。在算法世界中，这种做法的成本比物理上重新走一遍要低得多。然而，这些过程在概念上是相似的：你撤回搜索并沿着另一条路径继续。


    在接下来的课程中，我们将看到许多在遇到死胡同时进行回溯的搜索示例。一旦你加入了这支队伍，你遇到的死胡同将比你想象的要多。


