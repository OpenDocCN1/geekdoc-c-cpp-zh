    clam chowder and Wednesday night sea shanty contests. With any luck, one of his
    contacts would turn up before the day was out. After all, the Crab''s Pinch was
    the only place to go in Usb. So Frank planted himself at a table in the back corner,
    ordered the chowder, and waited.


    It wasn''t long before a freelance smuggler named Mavis entered the dank little
    bar. Careful by nature, Mavis had never technically been convicted of a crime,
    though it was well-known that she''d once set her own ship on fire to destroy
    evidence. Frank got along with her well enough, at least once he''d left the force,
    and they even exchanged the occasional scrap of information.


    Frank, having nursed his chowder for a solid hour, finally pushed away his bowl
