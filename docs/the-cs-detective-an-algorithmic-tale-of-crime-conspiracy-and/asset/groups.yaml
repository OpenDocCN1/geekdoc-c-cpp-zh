    “How does that help?” asked Frank. “She’s just repeating the information that’s
    in the table of contents.”


    Yes. She repeated information, but she used a different order. She organized the
    index at the back in order of the terms. For each term, she listed the pages where
    it occurred.


    Frank stared at him, waiting. But the owner seemed to have finished. “So?” Frank
    prompted.


    “You only need to look up the term you want, and the index directs you to the
    corresponding pages!” he exclaimed. “No more muddling through the table of contents.
    Your search becomes a lookup.”


    “But you still need to search the index to find the correct term, right?” asked
    Frank.


    Well, yes. Since the index is sorted alphabetically by the terms, you can just
    use binary search.


    “What if the item appears on a lot of pages?”


    “You need to check them all,” Cloaksworth conceded.


    “What if you are looking for a few terms?” asked Frank. Like three colors of thread?”


    “Ah! Now that’s where it gets interesting,” said Cloaksworth. You just need to
    check the pages they have in common. You can find those by intersecting the sets
    of page numbers. That means going through the lists and finding the elements that
    occur in every list. If you have enough terms, you can usually narrow down the
    pages they’re to just on one or two.


    The other day I had to look up a navy blue and royal blue cloak with wooden buttons.
    I can tell you there aren’t many of those in the world. In fact, just one group
    uses that combination—the Association of Amateur Weather Forecasters. Until last
    year, they had been using navy blue and dark turquoise, but they were forced to
    change. The Association of Professional Weather Forecasters claimed, rightfully,
    the colors were too similar to their own navy blue and light turquoise.


    | Blue, Navy | 10 | 11 | 72 | 101 |

    | Blue, Royal | 11 | 13 | 75 | 119 | 991 |

    | Buttons, Wood | 5 | 10 | 11 | 307 | 309 |


    Frank thought about it for a moment and nodded. “Interesting idea,” he allowed.
    He could immediately see how such indexes could be applied to other information
    sources. Police records were always sorted by date. Using this new technique,
    you could also index them by the type of crime or the location. These indexes
    could make research orders of magnitude more efficient.


    “I wonder if it will catch on for other books,” Frank mused.

    “Unlikely,” the shop owner scoffed. “Few topics in this world are complicated
    enough to require an index. Not every topic is as rich as cloaking.”


    As he spoke, the shop owner searched through and proceeded to flip rapidly through
    the book. “Police cloak,” he said at last. “The departments of Bool and Functionia
    use those colors. So a few of the capital police force’s departments. Accounting,
    Payroll, Records, and Advisory Signage, I believe. All different designs, of course
    I expect the cloak is a new issue, given the state of the threads. Police officers
