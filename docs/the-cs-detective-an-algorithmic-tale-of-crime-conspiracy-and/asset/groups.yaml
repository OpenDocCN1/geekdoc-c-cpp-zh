    “如果你只是在找几个术语呢？”弗兰克问道，“比如三种颜色的线？”


    “啊！那才是有意思的地方，”克洛克斯沃斯说。你只需要检查它们共同拥有的页面。你可以通过对页码集合取交集找到这些页面。这意味着遍历列表并找到在每个列表中都出现的元素。如果你有足够的术语，通常可以将它们所在的页面范围缩小到只有一两个页面。


    前几天，我必须查找一件带有木质纽扣的藏蓝色和皇家蓝色的斗篷。我可以告诉你，世界上这种组合的并不多。事实上，只有一个团体在使用这种组合——业余气象预报协会。直到去年，他们一直使用海军蓝色和深青色，但他们被迫更改了。专业气象预报协会理直气壮地声这些颜色与其海军蓝色和浅青色太相似了。


    | Blue, Navy | 10 | 11 | 72 | 101 |

    | Blue, Royal | 11 | 13 | 75 | 119 | 991 |

    | Buttons, Wood | 5 | 10 | 11 | 307 | 309 |


    弗兰克思考了一会儿，点了点头。“很有主意，”他赞许道。他立刻看出这种索引如何应用到其他信息源。警察记录总是按日期排序的。使用这种新技术，你也可以按犯罪类型或地点对它们建立索引。这些索引可以让研究效率提高几个数量级。


    “我想知道这是否会在其他书上流行，”弗兰克思索道。

    “不太可能，”店主嘲笑道，“这个世界上很少有主题复杂到需要索引。并不是每个主题都像斗篷制作那样丰富。”


    他边说，店主一边搜索，并快速地翻阅那本书。“警察斗篷，”他终于说道。“Bool 部门和 Functionia 部门使用那些颜色。所以是首都警察部队的几个部门。会计、工资、记录和建议告示牌部门，我没记错。当然，设计都不同，考虑到线的状态，我预计这件斗篷是新发行的。警察往往倾向于很快磨损斗篷，特别是在建议告示牌部门。”


    店主看着他。“除了它们可能来自四个部门中的某一个新警察斗篷，并且被施了魔法咒之外？”


    弗兰克等待着。

    “呃……没有，”克洛克斯沃斯最后说道，“就是这些。”

    弗兰克点了点头。“谢谢，”他说。他拿起线，转身离开。当他打开门时，他听到了一声轻微的抽气声，知道店主看到了他战壕斗篷底部磨损的边缘。


    # 警察算法 101：倒排索引

    德雷克教授讲座摘要


    倒排索引是一种计算数据结构，类似于书籍的索引。它提供了从目标值到数据中这些值出现位置的映射。当给定值在数据中反复出现或可能出现时，倒排索引 特别有用。


    考虑我们关于二分查找课程中的例子——检查会计账以查找与特定商户的交易。账本按交易单号递增排序，表示交易记录的顺序。


    | 101 August 16 | Zed’s Coffee | 8.00 |

    | 102 August 15 | Bob’s Pizza | 20.00 |

    | 103 August 15 | Wands and More | 150.00 |

    | 104 August 15 | Spell Shoppe | 100.00 |

    | 105 August 16 | Zed’s Coffee | 8.00 |

    | 106 August 16 | Spell Shoppe | 50.00 |

    | 107 August 17 | Zed’s Coffee | 8.00 |

    | 108 August 17 | Hospital | 250.00 |


    虽然这种排序允许我们高效地查找给定交易 ID 的信息，但它不能帮助我们追踪特定商户的交易。一种方案是按商户名称重新排序条目。然而，这我们需要复制整个账本，成本可能很高。


    相反，我们可以建立一个额外的数据结构：以商户名称为键的倒排索引。对于每个商户，我们存储所有相关交易 ID 的列表。由于我们已经知道如何通过 ID 高效查找任何交易，现在我们可以……


    | Bob''s Pizza | 102 |

    | Hospital | 108 |

    | Spell Shoppe | 104, 106 |

    | Wands and More | 103 |

    | Zed''s Coffee | 101, 105, 107 |


    倒排索引是时间和内存使用之间权衡的极佳例子。


    # 二分查找陷阱


    专业间谍经常花费大量时间计划如果被发现后将如何反应。他们为各种场景开发了一套复杂的背景故事，解释从跟踪某人到在皇宫里带着窃听设备和假乌龟被发现的一切情况。然而，现实中的情况很少会进展那么顺利，惊讶的抽气声实际上很常见。在这种情况下，弗兰克甚至曾希望有一刻恐慌以供利用。然而，对方一如既往地保持了专业。没有恐慌。没有出现惊讶的空隙。


