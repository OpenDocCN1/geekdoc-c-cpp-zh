    # POLICE ALGORITHMS 101: ARRAYS

    Excerpt from Professor Drecker’s Lecture


    Arrays are simple data structures that allow you to store multiple values. An
    array is like a row of bins. Each bin can store a single piece of information,
    such as a number or a character.


    | Value: | 20 | 15 | 19 | 1 | 10 | 1 | 5 | 33 | 9 |

    | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |

    | Index: | 0 | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 |


    The structure of an array means you can access any value (or element) within the
    array, whether to write to it or read from it, by specifying its location, or
    *index*, within the array. Many programming languages use 0-indexed arrays, which
    means the first value of the array resides at index 0, the second at index 1,
    and commonly, you reference the value at index *i* of array $A$ as $A[i]$; for
    example, the third element of array $A$ would be $A[2]$ and equal to 19.


    You likely recognize this structure from your introductory tour of the holding
    cells in the capital''s police station yesterday. The king personally suggested
    the use of indexed, single-person cells to streamline the retrieval of prisoners.
    Each station is equipped with an array of four to eight holding cells, depending
    on the size of the local criminal population.'
