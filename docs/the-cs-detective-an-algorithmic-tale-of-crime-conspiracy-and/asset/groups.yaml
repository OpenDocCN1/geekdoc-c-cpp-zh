    The tail almost ran into him as she hurried around the corner.


    “Hi,” said Frank. “Why are you following me?” He tried for a conversational, nonchalant
    tone—something he couldn’t pull off even under normal circumstances. It was at
    best a growl, though he did manage to avoid shouting.


    Professional spies often devote considerable time to planning how they will react
    if discovered. They develop a portfolio of complex backstories for a range of
    scenarios, explaining away everything from following someone to being discovered
    in the royal palace with a listening device and a fake turtle. They dream of smooth
    recoveries and effortless lies. However, things rarely go so well in reality,
    and gasps of surprise are actually quite common. In this case, Frank had even
    been hoping for a moment of panic to exploit.


    True to form, however, the remained professional. There was no panic. There was
    no gap of surprise. The only indication that anything had gone wrong was the brief
    flash of anger in her eyes right before she flung down a smoke bomb and vanished.


    Even without the smoke bomb, the spy would have been too fast for Frank. By the
    time he grabbed for her, he could hear her footsteps pounding down the street.
    He cursed and plunged through the smoke after her.


    Within half a block, Frank had resigned himself to yet another depth-first search.
    He had chased enough petty thieves through the city to know how it would go. The
    spy would likely turn off the main road soon, hoping to get out of sight. It wasn’t
    a bad strategy in general, but it wouldn’t work here. This part of the city had
    few side streets, and most of them were dead ends.


    As he ran, he visualized the streets as a graph, with the intersections and dead
    ends as nodes where he would have to make decisions and the roads in between as
    the graph’s edges—paths that got him from one decision point to another.'
