    最后，他添加了单词 RUN，并分配了 1 的优先级。他很清楚，如果他到了那个选项，说明该放弃了。他必须找另一个地方躲藏。


    优先级队列现在有 32 个选项。结果是一份长长的待试组合列表。最顶端是优先级最高的组合 1-2-3。弗兰克尝试了，但什么也没有发生。


