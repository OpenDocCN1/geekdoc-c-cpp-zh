    the only place to go in Usb. So Frank planted himself at a table in the back corner,
    ordered the chowder, and waited.


    It wasn''t long before a freelance smuggler named Mavis entered the dank little
    bar. Careful by nature, Mavis had never technically been convicted of a crime,
    though it was well-known that she''d once set her own ship on fire to destroy
    evidence. Frank got along with her well enough, at least once he''d left the force,
    and they even exchanged the occasional scrap of information.


    Frank, having nursed his chowder for a solid hour, finally pushed away his bowl
    and motioned to Mavis. She hesitated a moment by the door before jostling her
    way through the bar.


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_43_0.png)


    "Mavis," said Frank as she joined him in the corner, "how are you?"


    "I was doing a lot better 10 minutes ago," she spat.


    Before Frank could ask, Officer Notation strode through the door and held up her
    hands. "Ladies and gentlemen," she called. "If I could have your attention for
    a moment. I''m looking for a cart that came through here two nights ago.


    Frank cursed under his breath. So much for his lead.


    "I come in from the dawn run, hoping for a bowl of hot chowder and a few minutes
    of peace," Mavis complained. "Instead I get this copper clammering about donkey
    carts."


    Frank laughed dryly. "And until she goes away, you can''t unload your cargo. Right?"


    Mavis scowled at him but didn''t object. Usb had never found success in either
    the fishing or shipping industries. The port did, however, appeal to those criminals
    concerned with moving merchandise without dealing with nosy government officials.
    Frank would wager a month''s rent that there wasn''t a single ship at dock that
    wasn''t smuggling something.


    “Do you know anything about the cart?” Frank dropped his voice to just above a
    whisper.

    Mavis shrugged. “There’s always carts on the docks. This is a port, Frank. People
    move things.”


    “This is a special cart,” Frank pressed. “A bunch of individual animal pens, like
    a giant array on wheels.”


    “Sounds fancy,” said Mavis. “But I haven’t heard of any ships moving animals.
    I might have heard a rumor about a crate or two of miniature turtles, but nothing
    large enough to need a pen. You sure it came through here?”


    Frank nodded. The smell had been like a fish-scented air freshener in an outhouse,
    and a few places smelled as bad.


    “Anybody casting off that time?” he asked. If the thieves transported the stolen
    documents this far, they wouldn’t have waited around.


    “Only the Retry Loop,” said Mavis. “And I’m only telling you that because it’s
    public knowledge. I don’t know what it was carrying, and I don’t care.”


    “Do you know when it returns?” asked Frank.


    “Got back into port 19 hours ago,” replied Mavis. “Don’t know what it was carrying
    then either.”


    Frank smiled widely. “Sounds like it’s time for me to take a stroll around town,”
    he said.


    Mavis smiled halfheartedly at him and turned to flag down a waiter.


    Frank made less than 20 meters down the pier before Officer Notation marched up
    beside him.


    “Mr. Runtime, this is my investigation,” she began. “If you have information—”


    Frank stopped, causing her to pull up short. “What exactly are you investigating,
    Officer?” he asked.


    It was better than Frank had hoped. Notation opened and closed her mouth few times
    as a red flush spread up her neck.


    “The captain doesn''t know you''re here, does he?” Frank asked. “This isn''t exactly
    an official investigation.”

