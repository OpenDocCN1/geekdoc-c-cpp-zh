    ![](img/e29fc41ddce7c5429aacfb7f918a9728_221_0.png)


    Frank stopped and swore as realization dawned. Socks had to be involved. With
    a familiar sense of *I knew I shouldn''t trust anyone*, Frank replayed the events
    of the last few days in his mind, this time recognizing the signs. He should have
    seen it when when Socks''s staff "accidentally" ignited the papers in the cell
    and destroyed the evidence. He should have realized that someone had tipped off
    the spy about his visit to the cloak shop. He should have at at least wondered
    about the absurd and conveniently timed rescue with the barrels of pickled eels.
    But above all else, he should have been absolutely certain from the moment Socks
    incorrectly inserted a node into the binary tree. No expert in binary trees would
    ever make that mistake by accident. It was true that he''d been suspicious the
    whole time, but then again, Frank suspected everyone all the time.


    The realization left him with even more questions. The Where and When were unanswered
    again. If Socks had been feeding them false information, Frank had to question
    everything. What were the wizards going to do, and how were they going to do it?
    Knowing the Why would also be nice, but Frank found that whenever he foiled elaborate
    plots, the perpetrators tended to babble on about'
  - '[PAGE 222]


    Why without provocation. By this point, he''d also given up on sneaking out for
    food, closing that question for now with a growling stomach.


    How does the mask fit in?” Frank muttered to himself. If the thieves were planning
    to attack the castle, could they still use the mask? Or would Marcus''s ID badges
    render it useless? Did they just need it to break into the police station? And
    what records were the thieves after? Frank started enumerating the questions in
    his notebook. They quickly outnumbered the clues.


    Frank thought about his next step. With such a limited timeline, he needed to
    push far into the realm of heuristics—rules of thumb that point algorithms in
    the right direction. For example, when searching for a lost turtle, Frank used
    the common “Check nearby first” heuristic, because turtles are slow. When seeking
    the freshest pot of coffee in the station, he relied on “Check the fullest cauldron
    because it was often the most recently made. And when navigating to a tall castle
    in an unknown city, “Walk in the direction of the castle first” had usually gotten
    him there after only a few dead ends. Heuristics weren’t perfect, but they provided
    useful information.


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_222_0.png)


    During his time on the police force, Frank had come to trust one heuristic above
    all others: follow the most concrete clues first. Specific names and physical
    evidence always trumped general suspicions and rumors.'
