    |   | 7 | | |


    It was the type of unnecessary movement that Frank made it policy to avoid.

    "No," said Frank. "Too much backtracking. We''re better off going depth-first
    here."

    "Depth-first search. Depth-first search," Socks mumbled to himself as though willing
    the spell into his memory. "I—I don''t think I remember—"

    Frank waved him off, and strode confidently down the corridor.

    "We don''t need a spell for this one. I''ve been doing depth-first searches for
    buildings since you were in diapers."

    "No backtracking with depth-first search then?" asked Socks.

    "There''s backtracking with most search algorithms. But backtracking in a depth-first
    search is better suited for walking."

    "Um... I see."

    "No, you don''t," said Frank bluntly. "If you don''t know the algorithm, just
    ask. Pretending to know algorithms is a recipe for disaster. I''ve seen too many
    rookies tripped up to bad searches. Good kids, like you."

    "Okay. What is depth-first search?" Socks asked.

    "It''s a simple algorithm," explained Frank. "Basically we explore deeply down
    each path. We go down one path until we hit a dead end. Then we backtrack to the
    most recent path that we didn''t take and try that. We''ll stop when we find the
    target."


    "In this case, we’re going to use clockwise ordering. Whenever we have multiple
    options, we’ll try north, east, south, then west—avoiding paths we’ve already
    tried, of course. We’ll use the same ordering at every intersection, so we’ll
    always prefer going north if we can. But in this case we have only one option,
    so we start by going south."


