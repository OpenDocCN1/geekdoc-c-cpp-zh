    [content]

    # POLICE ALGORITHMS 101: STACKS AND QUEUES

    Excerpt from Professor Drecker’s Lecture


    Stacks and queues are two simple structures for storing data. At first glance,
    both data structures resemble nothing more than lists of values. How these two
    data structures differ, though, is in how data is inserted or removed.


    A stack is a last-in, first-out data structure that operates much like the pile
    of papers you''ll find on every officer''s desk. New elements are *pushed* onto
    the top of the stack, and elements are removed by being *popped* off the top of
    the stack. If five elements are pushed onto an empty stack in the order 1, 2,
    3, 4, 5, they will be popped off in the reverse order, 5, 4, 3, 2, 1. Of course,
    as soon as your pile of papers is gone, your captain will just give you paperwork.


    You can implement stacks using an array and a single variable to track the index
    corresponding to the top of the stack. When you push a new element onto the stack,
    you add it to the next open slot in the array: index = top + 1. You also increment
    the top index accordingly.


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_112_0.png)


    When you pop an element off the stack, you can again use the top index to find
    the correct element. You can then remove this from the array and decrement the
    top index accordingly.


    | 1 | 1 | 2 | 3 | 5 | | | | |

    | 1 | 1 | 2 | 3 | | | | |


    Of course, you must be careful when adding elements to an array of fixed size
    to avoid going past the end of the array.


    A queue is a first-in, first-out data structure, much like a line of suspects
    waiting to be processed. New elements are enqueued at the back of the queue, and
    elements are removed by being dequeued from the front. If five elements are enqueued
    in an empty queue in the order 1, 2, 3, 4, 5, they will be dequeued in the same
    order, 1, 2, 3, 4, 5.


    Queues can also be implemented with arrays. In this case, you need to track two
    indexes—the first and last element in the queue. When you enqueue a new element,
    you add it behind the current last element and increment the back index.


    | 1 | 1 | 2 | 3 | 5 | | | | |

    | 1 | 1 | 2 | 3 | 5 | 8 | | | |


    And when you dequeue an element, you remove the front element in an empty front
    and increment the back index accordingly.


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_114_0.png)


    As you enqueue and dequeue elements in a fixed array, a block of empty space will
    build up at the front of the array. While you can design the queue to wrap, you
    must take care during both enqueuing and dequeuing to handle indexes being incremented
    past the end of the array.


    # — 13 —

    Stacks and Queues for Search


    Frank shook the image of burnt bread from his mind and returned to the present
    situation—trapped in a small cell filled with parchment about to burst into flame.
    The fire was still small, burning the loose sheets at the edge of the piles. But
    once the large stacks fully caught fire, the heat would be unbearable.


    Socks crawled to the door and leaned against it. "Is it locked?" he asked.


    Frank swallowed half a dozen snarky answers and simply nodded. "Can you open it?"
    he asked. "It''s an old two-pin lock. It can''t have many combinations."


    Socks shook his head. "There''s no time. I know a spell to weaken the metal."


