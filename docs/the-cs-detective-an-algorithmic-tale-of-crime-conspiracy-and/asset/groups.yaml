    ## 回溯以继续搜索


    泥墙港甚至没有配得上它那平平无奇的名字。它算不上是个港口；那摇摇欲坠的木码头最多只能停下两艘中等体只。泥墙本身——在理论上是一道20英尺高的土城墙——实际上从未真正建造过，只是在这里和那里通过环绕城市三分之一的2英尺高的小土丘来暗示它的存在。


    弗兰克跨过泥土丘，走向城里唯一的家商店，诺塔和袜子克斯跟在他身后。


