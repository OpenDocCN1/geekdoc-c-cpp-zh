    # POLICE ALGORITHMS 101: STACKS AND QUEUES

    Excerpt from Professor Drecker''s Lecture


    The key to efficient algorithms is information. How we organize information and
    the data structures we use can have a significant impact not only on the efficiency
    of the algorithm but also on how the algorithm actually functions. For a simple
    example of the importance of data structures, consider the breadth-first search
    and depth-first search from the previous lessons. While the algorithms are conceptually
    similar, whether we maintain our list of leads in either a stack or a queue significantly
    changes how the searches progress.


    You want to be careful when choosing your data structures. Data structures should
    enable the algorithm. Imagine what would happen if we stored a list of sorted
    numbers in a graph. Even if we maintain the sorted property, we can''t perform
    an efficient binary search over the data because graphs limit how we access the
    data. Unlike arrays, graphs don''t have indexes with which we can access the values.
    Instead, we are forced to perform a linear scan, moving from one node to the next
    via the graph''s edges.


    # — 14 —


    # Let’s Split Up: Parallelized Search


    “That happened?” asked Officer Notation, who stood by the gate. Frank studied
    her as he tried to catch his breath. She was concerned? Confused?

    “We were attacked!” Socks blurted out. “We were trapped in a cell and everything
    was on fire! But I used a metal weakening spell so we could escape.” He looked
    quite pleased with himself.

    “Attacked?” asked Notation. “Who attacked you? Did you see them? What did they
    look like?”

    “No,” admitted Socks. “He snuck up behind me.”

    “Frank?” asked Notation, turning to Frank.

    Frank shook his head. “All I saw was Socks flying at me.

    “I bet he was big,” offered Socks. “A giant thug. And he was stealthy. Maybe a
    trained assassin.”

    Frank rolled his eyes. “Sorry, kid. He was an amateur. Professional assassins
    don’t lock people in cells and run away.”

    “But the fire,” said Socks.

    “Your staff started the fire,” Frank reminded him. “You dropped it on the papers.”

    “Papers?” asked Notation. “Did you find the logs? Do you know what they were after?”


    Frank and Socks looked at each other. Notation glanced from one to the other.
    Finally, Frank spoke, “The logs are gone. Our junior wizard here dropped his staff
    and poof—fire everywhere. Any clues are gone now.”


    Socks turned a deep shade of red and stared at the ground. “Gone,” asked Notation.
    “Everything’s gone? Are you sure?” “Yeah,” said Frank. He nodded toward the smoke
    trickling from the door.


    “What about the person who attacked you?” asked Notation. “I didn’t get a look
    at him,” said Frank. “I don’t suppose you saw anything?” he asked. The question
    came out sharper than he intended, but after being attacked, getting trapped in
    a burning room, and fleeing a darkened prison, he didn’t feel like pulling any
    punches.


    “No,” said she calmly. “There was nothing around the front.” “No tracks near any
    of the doors?” asked Frank. “Anything that could give us a clue about our attacker?”


    Notation shook her head. “Nothing,” she said. “It looked as though no one had
    been around the other side in months.”


    Frank nodded, but didn’t speak. Something felt wrong. Either the attacker had
    cleverly slipped by Notation through the same gate they had used, or she wasn’t
    telling them something. How long had she been away from the gate? And why had
    she stayed outside? Frank decided not to press the issue. “All right. Let’s head
    back to the boat.”


    “Now what?” asked Socks as they made their way toward the water.


    “Time to backtrack,” said Frank. “No clues here.”


    “Backtrack to where?”


    “The open clues,” Frank answered. “We investigate the leads we still have left.”
    He paused for a moment, weighing his options. “I think it’s time to parallelize
    the search.”


    “Really?” asked Notation.


    “Parallelize?” asked Socks.


    “It means we split up and explore different parts of the search space.”


    “But,” objected Socks, “I’m not an officer or a private investigator. I don’t
    know what to do. Shouldn’t I stay with one of you?”


    “No. Okay,” agreed Notation. “How do we divide up the work?”


    Frank knew the key to an efficient parallel algorithm was making sure that the
    benefit of using multiple workers was worth the cost of dividing up the work.
    Parallelizing work involves a certain amount of overhead. The problem needs to
    be broken into pieces. Each worker has to get a task, get ready to do it, and
    then actually do it. And then at the end, the work has to be recombined. Parallelizing
    a simple task can sometimes be more costly than just solving it out. However,
    when the problem gets large enough, parallelization can greatly accelerate an
    algorithm.


    “Easy,” said Frank. “Socks, I need you to talk to your wizard friends. Ask them
    if they know about a group called the League of something. The thugs on the boat
    said they were working for a league before Rebecca Vinetette interrupted them.
    Judging by previous cases, the name will be something evil like the League of
    Power-Hungry Maniacs or the League of Darkness. Evil leagues tend not to be subtle
    with their names. Find out everything you can about this group.”


    “That’s not much to go on,” Socks complained.

    “Notation,” continued Frank. “I need you to pull all police transfer records for
    the last six months.” While he didn’t like the idea of leeway leading this lead
    to Notation, she was the only one who could get the records easily. If he tried
    to collect them himself, he would be met with suspicious looks and a small barricade
    of paperwork. The capital police department used paperwork with the same determination
    and effectiveness.


    “Transfers?” asked Notation, clearly surprised. “Why?”

    “Call it a hunch,” Frank lied. “We’ll meet at my office tomorrow morning and combine
    our information.”


    “What about you?” asked Notation. Her voice now carried a note of irritation.
    She obviously knew Frank wasn’t telling her the whole story.


    Frank gave her an innocent smile. “I have to go shopping.”

