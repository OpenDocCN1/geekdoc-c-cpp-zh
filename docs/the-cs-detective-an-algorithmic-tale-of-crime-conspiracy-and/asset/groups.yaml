    "And the convoy?"


    "Rotten crossbowes," said the captain. "And one of the cart wheels—back left,
    I think. It should be in the report."


    "What about the swords? The axes?"


    You never did bother to read the reports. The thieves also used the Spell of Accelerated
    Rusting. It''s not particularly advanced magic, but it is effective.


    "It doesn''t say what they stole," Frank noted. "No mention of the mask."


    The captain raised his eyebrows. "You know about the mask? That''s highly classified."


    Frank shrugged. "You''re paying me to find information," he said, leaving out
    the fact that Socks let this information slip only by accident. It never paid
    to let your clients know how much of your success was due to other people''s stupidity.


    "It''s worrying," Frank said the captain. "That''s a powerful artifact. Add in
    the anonymous tip we received about a possible attack on the castle, and the whole
    force is on alert. We''ve had to pull people off other posts to step up security."


    "I''ve heard the same thing about the castle," Frank admitted. He flipped through
    the documents once more. "No leads on the attackers."


    "We''ve heard some rumors, but nothing solid. At least nothing firm enough to
    put in a report."


    "What about your officers?" asked Frank. "Do you have any suspects there?"


    The captain studied him before responding. Frank knew the captain would never
    come to him if he didn''t suspect an inside job. But there was a substantial gap
    between a general flicker of suspicion and a short list of names.


    "No," said the captain. "I haven''t found anything yet. There''s no thread running
    through the thefts. Different stations. Different officers on duty. Even different
    departments."


    Frank nodded silently while he turned the thefts over in his mind. He had hit
    the same dead end with the internal transfers. There had been at least one new
    transfer on duty for each incident, but never the same officer twice. Frank had
    briefly considered the possibility of a broad conspiracy throughout the entire
    rookie class, discarded it immediately. Anyone capable of coordinating such a
    massive thefts, at least something that didn’t involve alerting every station
    within a hundred miles.


    “And Officer Notation?” Frank asked.


    The captain looked genuinely taken aback. “What about her?”


    “Is she on your list?” asked Frank.


    “She was on duty that night, so she’s on my list,” he said. “But she’s near the
    bottom. Notation’s a good kid. She’s green, but she’s dedicated to the force.”


    “Did you know she’s been investigating the theft herself?”


    The captain frowned. “I suppose it shouldn’t surprise me. As I said, she’s dedicated.
    Where did you run into her?”


    “Crannock’s farm,” said Frank. “She tagged along for a while after that.”


    “Did she show now? And?”


    “I don’t trust her,” said Frank.


    “You don’t trust anyone, Frank.”


    Frank sighed. “It’s more than that,” he said. “Just let me know if you notice
    anything strange.”


    “What about you?” prompted the captain. “What have you found?”


    Frank proceeded to give him a quick summary. He told the captain how he had followed
    a tip to Crannock’s farm and picked up a trail of clues that led him to Usb, the
    Vinettees ship, and Rebecca Vinetteet.


    At this news, the captain interrupted him with a chuckle. “Another run-in with
    the Vinettees, Frank? Rebecca too. I’m surprised you''re still walking around.
    How many of them have you put behind bars?”


    “Not enough,” Frank said.


    “Fair,” conceded the captain. “How’d you get out of there?”


    “A wizard showed up and started flinging barrels of pickled eels,” Frank said
    as though this were a perfectly normal occurrence.


    The captain gaped at him. “What?”


    “A junior wizard by the name of Socks,” Frank explained. “He’s an apprentice to
    a wizard named Gretchen. Apparently the king brought in a few senior wizards to
    help with the case.”


    “I can’t say that I’ve ever heard of Gretchen, but it doesn’t surprise me that
    the king brought the wizards in,” said the captain. “After the attack on the convoy,
    the king has mobilized everyone he can. Every Princess Ann is returning from her
    latest quest. She arrives back at the castle tomorrow.”


    That single sentence spoke volumes as to the severity of the situation. Princess
    Ann was almost constantly away leading missions, quests, or critical negotiations.
    For her to return, the situation must be bad.


    “Princess Ann is coming back?” asked Frank.


    “She thinks this recent attack might be related to the League of Unnecessary Complexity.”


    “The League of Unnecessary Complexity?”


    “It all comes back to the evil wizard, Exponentious,” explained the captain. You
    know, the one who tried to destroy the kingdom.”


    Frank nodded. He clearly remembered the terror that swept through the kingdom
    when Exponentious attacked. These days, the tale of his campaign was told in hushed
    voices around the campfire to scare junior wizards and knights.


    The captain continued, then, “He’s been safely locked away in the royal prison
    since, but Princess Ann is worried that he wasn’t acting alone. That maybe he
    have followers, accomplices, admirers, something like that.”

