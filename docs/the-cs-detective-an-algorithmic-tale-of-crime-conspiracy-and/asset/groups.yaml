    弗兰克想要寻找罪犯，他的搜索空间是首都附近的每一个人。


    弗兰克向后坐在椅子上，揉了揉眼睛。这是一个巨大的搜索问题，在一个罪犯横云的城市里寻找一个特定的罪犯。但他见过更糟糕的了。


    既然他已经定义了问题，就可以开始制定算法了。线性搜索是不可行的；他负担不起询问城市里的每一个人。他也可以排除他在学院学习过的许多其他更花哨的算法。对于这样的问题，他必须回到他的基础搜索算法工具箱中——那是私家侦探最信赖的朋友。


    弗兰克在羊皮纸上做了一记笔记。他有要寻找的目标，知道搜索空间，并且有了算法。是时候开始工作了。


    # 警察算法 101：搜索问题

    德雷克尔教授讲座摘录


    在这节课上，我们将讨论用于解决搜索问题的几种不同算法（以及相关数据结构）。搜索问题被定义为任何要求我们在可能值空间（搜索空间）中寻找特定值（或目标）的问题。


    你们中毕业后并成为警察的同学，会发现自己每天都会面临这类问题。搜索问题的这个广泛定义涵盖了许多不同的计算问题，从在警察日志中搜索特定条目，到在藏身点寻找房间，再到寻找符合某些标准的逮捕记录。这节课不会是详尽的——那需要多年时间——我将在教学过程中给你们提供一些基础且重要的算法示例。


    本节课描述的算法将具有三个共同组件：


    - **目标 (Target)**：你正在搜索的数据。目标可以是一个特定值，也可以是一个标志搜索成功完成的标准。

    - **搜索空间 (Search space)**：测试目标的所有可能的集合。例如，搜索空间可以是一个值列表或图中的所有节点。搜索空间中的单个可能性被称为*状态（state）*。

    - **搜索算法 (Search algorithm)**：执行搜索的特定步骤或指令集。


    某些搜索问题将具有额外的要求或复杂性，我们将在讲解不同算法时涉及这些内容。


    # 针对线人的穷举搜索


    “高效算法的关键在于信息。”这是德雷克尔教授的格言，在每节警察算法课开始时，他对学员们大声吼，是如此凶猛，足以永久地烙印在弗兰克的记忆中。“一个好的算法取决于发现数据中的结构并利用它。它取决于信息。”


    弗兰克想起这里，露出了微笑，他转入三比特街（Three Bit Lane），那是一条凹凸不平的土路，两旁错落着破旧酒吧和高端咖啡馆。他对一对路过的骑士礼貌地点头示意，骑士穿着盔甲抖动走过时发出哐当声，他在心里记下离开前要来一杯三倍浓缩咖啡。首先他需要信息，一些能引导他搜索的东西。他确切知道从哪里开始。


    “玻璃盒子比利利”现在已经在某一家店里，静静地坐着，听着房间里飘过的交谈声。人们并不是故意在比利利面前说话；他们只是没有注意到他在。比利利被赋予了一项显著的天赋：完全的不起眼。无论他尝试做什么，比利利身上的某些特质让人们根本注意不到他。也许是因为他苍白的皮肤或瘦小的体型；也许是因为他那极其平庸的穿衣品。无论如何，比利利很久以前决定利用他的这项天赋来偷听、收集信息，并将其卖给任何愿意购买的人。


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_23_0.png)


    弗兰克盯着三比特街上紧挨在一起的八家店面，心想比利会选择哪一家。他在脑海中过过了六种搜索算法，但这是没有意义的。弗兰克没有任何信息可以依据。比利可能在其中任何一个酒吧或咖啡馆里。


    他不得不使用穷举搜索——简单地尝试所有可能性，直到找到比利。这让他不太舒服。多年的侦探和私家调查经验告诉他，几乎总是有比穷举搜索更好的算法，而他讨厌诉诸如此低效的方法。


    弗兰克嘟囔着开始了他的搜索。他走进了街上的第一家酒吧，“绝对值馆”（The Absolute Value）。


    酒保是一个名叫阿比（Abe）的坏脾男人，他在弗兰克进入时瞪着他，并特意把手伸到了柜台下面。信息很明确：“我现在手里拿着武器。我让你猜猜是什么种。但如果你骚扰我，我会让你近距离观察。”


    “我不想惹任何麻烦，”弗兰克举起双手说，“我只是来找比利的。”


    “噢，比利不在，”酒保说。

    弗兰克几乎因松口气而笑了。“那我就走了，”他说。

    阿比简短地点了点头，看着弗兰克离开，他的手依然在柜台下。


    弗兰克深吸了几气，在凉的空气中摇了摇头。阿比记仇的时间比弗兰克遇到过的任何人都要长。不过话说回来，弗兰克逮捕了他的四个兄弟。


    街上的下一家店是“鲁莽布尔值馆”（The Brazen Boolean），一家采用典型布尔风格——黑白配色装饰的现代咖啡馆。布尔城（City of Bool）的居民以对逻辑绝对概念的狂热奉献而闻名，将一切都视为真（True）或假（False）。（注：原文后续部分存在大量重复的OCR错误文本，已根据要求进行清理处理。）

    '
