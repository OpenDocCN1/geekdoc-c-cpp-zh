    # 嫌疑人的二叉搜索树


    弗兰克一跛一脚回到办公室，发现袜子正在等他。年轻的巫师坐在弗兰克的椅子上，无无聊赖地转着。弗兰克盯着他看，直到袜子意识到了自己的错误。他低声道歉了几句，从椅子上跳了起来。


    “你发现了什么？”弗兰克问。


    袜子耸了耸肩。“没什么用的。”


    “什么都没有？”弗兰克催促道。


    “巫师们都没有听说过任何新联盟，”袜子快速补充道，“上一个成立的巫师联盟是魔法糖果联盟。他们是去年为了应对劣质薄荷糖涌入而成立的。你还记得那些口感很重的糖片吗？前几分钟吃起来像薄荷味，但接下来的六小时里都会留下一松针的回味。它们就像是为了恶作剧而设计的。魔法糖果联盟解决了薄荷糖，然后扩展到了巧克力和太糖。该联盟有六家糖果店和四个推销车——”


    “别的呢？”弗兰克打断了他。


    袜子摇了摇头。“我也问了俱乐部和协会，”弗兰克提道，“唯一的这类组织是巴贝维尔巫师保龄协会，但他们只维持了一个月。显然，巴贝维尔并没有那么多喜欢打保龄的巫师。”


    弗兰克叹了口气。他并没有对袜子的调查抱有太大期望，但完全一无获的消息仍然让他感到失望。


    “你呢？”袜子问。


    “我，”弗兰克回答道，“我有一个新线索。”


    “真的吗？是什么？”


    还没等弗兰克回答，记录官笔记本砰砰响地闯进办公室，抱着一大叠厚得离谱的书。她走到弗兰克的桌子前，把书堆了过去。桌子在重量下凹了下去。


    “过去一年所有的转调和分配记录，”她喘着气说，“现在你可以告诉我为什么要我把这些拖到这儿了吗？”


    “我们需要找到一次转调，”弗兰克说。


    “我明白，”记录官说，“但如果你告诉我是哪一次调，我可以直接在那里查。”


    “我不知道是哪一次，”弗兰克解释道。这话半真半假。即使他知道，他还是会让记录官带上所有的记录。他在搜索期间必须在场。他需要确保没有遗漏任何人。


    “好吧，”记录官说，“我们要找什么？”


    “我们先从 50 到 70 天前的任何可疑转调开始，”弗兰克说。那些是监狱里从账本上撕掉的页面的大致日期。“这是一个范围搜索。我们要找到在日期范围内的所有转调。”


    记录官呻吟道。“这些请求是按请求官员的原始所在地排序的，然后按官员姓名排序的。它们不是按请求日期索引的。我们必须检查每一条请求。这需要好几个小时。”


    “不，”弗兰克向她保证道，“因为我们要用魔法。”


    袜子惊讶地抬头。“魔法？”他问道，“我不懂范围搜索法术。”


    “你懂二叉搜索树，”弗兰克回答道。


    “为什么要用树呢？”记录官问，“如果我们只做一次搜索的话？”


    弗兰克耸了耸肩。“我猜我们最终想要进行一次以上的搜索。如果袜子用魔法建立树——”


    “但我不知道怎么做范围搜索，”袜子抗议道。


    “把树建起来，我给你看。”


    “好吧——”


    “没什么，”弗兰克说。


    “噢，得了吧，”记录官没耐烦道，“自从监狱那以后，你就一直隐瞒着什么。我们为什么要看请求？你为什么以前没提到过它们？你发现了什么？”


    “正如我所说——”


    “我不信。你对我瞒了什么。”


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_167_0.png)


    “找到了，”袜子喊道，“至少我是这么认为的。一分钟后就知道。”


    袜子转向那堆账本，开始低声念动咒语。他在纸张上方戏剧性地挥动手臂，但完全没有必要。随着一道闪光，空气中出现了一棵巨大的二叉搜索树，树中的每个节点都代表自那次转调以来的天数。节点悬挂在空中，用电线连接着。


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_167_1.png)


    “现在进行范围搜索，”弗兰克说。


    “我不知道怎么——”袜子开始说，但弗兰克挥手打断了他。“我们将使用改进的深度优先搜索，”弗兰克解释道，“从顶节点，即根节点开始，向下遍历树。在每个节点处，首先检查节点本身是否在范围内。如果是的话，比如这里的
    55 天，我们就把它保存到列表里。否则，我们就忽略它。”


    “等一下，”袜子说，“我会让列表里的节点闪烁不同的颜色。绿色怎么样？”


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_168_0.png)


