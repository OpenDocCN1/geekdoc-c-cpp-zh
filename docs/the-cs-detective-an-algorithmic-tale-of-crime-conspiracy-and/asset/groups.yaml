    A plan started to form in Frank''s mind. The Vinettees’ crews always arranged
    themselves in order of seniority. It had nothing something to do with mentorship—the
    most junior crew member served as a new hire''s mentor and so forth up the ranks.
    In group situations, they all tended to stand next to their mentors.


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_62_0.png)


    The circle of thugs was nothing more than a sorted array that had been bent into
    a loop. Binary search would almost work here, but it would have to be adapted
    to fit the organization of the data: a circle, rather than a straight line of
    values. Unfortunately, this meant that Frank didn’t know where the array started
    or ended. Quickly he developed a new algorithm to efficiently search for the most
    senior crew member. In this case, efficiency meant both minimizing the number
    of thugs with whom he would have to converse and maximizing his chances of getting
    answers before they caught on.


    He turned to the woman on the thug’s right. “How about you? Are you the veteran
    here then?


