    "And how many leads did you have?" asked the captain. "Let’s say on average."


    "On average?" Notation thought about this for a moment. "Between two and five,
    I guess."


    "You want me to use one of the department’s priority queues to help you scan through
    a list of two to five elements?" If the captain had used his customary growl,
    the question might have sounded less harsh. Instead, his calm patience made it
    excruciatingly clear how idiotic he found the whole discussion.


    Notation flushed. "Well, priority queues aren’t that expensive. . ." she started,
    but trailed off.


    "Look, Officer Notation," said the captain. "I agree that priority queues are
    great for best-first search. After this meeting, I may order a whole new set,
    for each detective. But you don’t need one right now. To start with, you don’t
    have enough leads. More importantly, you aren’t even on this case."


    Notation’s face had reddened progressively throughout the lecture, and it had
    now already achieved the complexion of beet soup. She took a deep breath, looked
    the captain straight in the eye, and mumbled, "I understand, sir."


    Frank felt a surge of pity. Notation had made a rookie mistake, overoptimizing
    the solution. He had to hand it to her—the idea of using priority queues for tracking
    leads was perfectly reasonable. In fact, he’d been using a priority queue this
    entire time. However, his timing on the question couldn’t have been worse.


    "Notation," the captain continued, "you’ve got a lot of promise here. You’re bright,
    and you have good instincts. But you have to learn to follow orders. Don’t end
    up like Frank here."


    Notation opened her mouth to protest. Then she glanced at Frank, grimaced, and
    closed her mouth without a word of argument. She nodded curtly, snapped a salute,
    and strode from the office.


    "And you, Frank, have work to do. Get going."


    Frank turned and followed Notation out, not bothering with even a nod.


    Frank waited until they had reached the stairs before speaking.

    “You know… there’s a wizard in the Orb district that can make you an inexpensive
    priority queue. His name is Heaperous, actually. I think that’s how he got into
    data structures in the first place. With a name like Heaperous, I suppose it’s
    an inevitability. Anyway, the priority queue won’t be pretty, but it’ll work.
    He only works mornings, though, so you’ll have to wait ‘til tomorrow.”

    Notation stopped walking and gave him a suspicious look. “Why are you telling
    me this, Frank?”

    Frank forced his face into his best sympathetic look. “I’ve been on the receiving
    end of many of the captain’s speeches. And, more importantly, I know how valuable
    a good data structure can be during an investigation.”

    “If data structures are so valuable, why don’t you use a priority queue?” she
    shot back.

    Frank shot her an irritated look. “Of course I use a priority queue. I’ve been
    using one since we started. Did you think I’ve been keeping all the clues in my
    head? I’m too old for that sort of thing.”

    “What?” exclaimed Notation. “You’ve been using a priority queue this whole time.
    Why didn’t you say anything to the captain?”

    Frank laughed at this. “You have a lot to learn about the captain, rookie. First
    off, you never interrupt him while he’s ranting about anything. I once saw a detective
    put on desk duty for a month because she derailed a rant about tofu. It wasn’t
    even a particularly good rant. He’d got stuck alternating between its squishy
    texture and its lack of taste.”

    Notation stared at Frank, apparently at a loss for words.


    “The point is,” Frank continued, “sometimes you need to take matters into your
    own hands. If a priority queue will help you, don’t wait for the requisition process.
    Just go out and buy one.”


    Notation considered this advice. Finally, she nodded. "I guess that buying my
    own equipment wouldn''t technically violate any policies. Thank you, Frank."


    The excitement on Notation''s face almost made Frank guilty. Any wizard shop in
    town could make a priority queue, and most would match Heaperous''s prices. But
    Heaperous''s shop in the Orb district was the farthest one still within city limits,
    and Frank needed to make sure Notation stayed out the way for a little while longer.


    ## POLICE ALGORITHMS 101: PRIORITY QUEUES

    Excerpt from Professor Drecker''s Lecture


    Of all the data structures you''ll encounter during your career in the police
    force, I guarantee that priority queues will be the most valuable. Like stacks
    and queues, priority queues are data structures that allow you to insert data
    and later remove it in a specific order. Where stacks and queues enforce orderings
    determined by when an element was inserted, priority queues order the data by
    decreasing priority. The next element removed is the highest-priority element
    in the queue, regardless of when it was inserted.


    Each item inserted into a priority queue must also have a priority, or score.
    This could be the value of the element itself or a value computed by a different
    function.


    Consider this example of prioritizing noise complaints based on their severity.
    If you inserted the complaints in the following order:


    - “The crowd at the Exponentiated Espresso” (score = 3)

    - “Crab’s Pinch sea shanty contest” (score = 6)

    - “Farmer Swinson’s rabbit” (score = 1)

    - “Farmer Swinson’s rooster” (score = 5)

    - “Farmer Swinson” (score = 7)


    You would retrieve them from the priority queue as:


    - “Farmer Swinson” (score = 7)

    - “Crab’s Pinch sea shanty contest” (score = 6)

    - “Farmer Swinson’s rooster” (score = 5)

    - “The crowd at the Exponentiated Espresso” (score = 3)

    - “Farmer Swinson’s rabbit” (score = 1)


    Note that there are no guarantees that the data will be sorted within the priority
    queue, only that it is extracted in order. As you’ll see in later lectures, data
    structures called heaps are an efficient way of implementing priority queues that
    do not keep the data in fully sorted order.


    The capital’s station uses a variety of priority functions. As you might expect,
    the queue most hotly debated is the vacation priority queue. This queue is ordered
    solely by the officer’s number of unused vacation days. Despite previous requests,
    no additional priority is given for the niceness of the vacation spot. Upcoming
    trips to glaciers, beaches, and swamps are treated equally. Instead, the queue
    prioritizes based on one measure of fairness to ensure that the next officer to
    go vacation is the one who has taken the fewest vacation days this year.


    ## Priority Queues for Lock Picking


    A group of thugs was waiting outside the door to Frank''s office. They were trying
    to blend in, but Frank spotted them a block away. One sat on a bench, pretending
    to read a paper while his eyes darted around. Three others stood near the corner,
    arguing loudly about a sporting match. As he neared, Frank realized they were
    discussing completely different sports. One thug raged about the officiating at
    the last polo match, another interjected with tips about an upcoming horse race,
    and the third seemed content with just saying “sports” at regular intervals.


    Only the spy succeeded in being inconspicuous. She was waiting across the street,
    where she leaned against the wall. If he hadn''t darted earlier, Frank might have
    overlooked her. She was good. Or, more accurately, the thugs were really bad.


    Without breaking stride, Frank turned and started down a side street. He knew
    this part of town well and was sure he could lose his pursuers. He just had to
    buy himself enough time to get into the safe house. Getting in could take a while,
    unless he remembered the combination on the first try.


    ![](img/e29fc41ddce7c5429aacfb7f91a9728_215_0.png)


    Frank made it half a block before he heard the shouts and pounding footsteps behind
    him. The spy must have alerted the others.


    Frank broke into a run. The footsteps behind him followed suit.


    Frank cut left sharply, heading into a narrow alley. Frank emerged from the alley
    onto Flag Street and pulled a quick U-turn, heading into the store on the corner.
