  - '[PAGE 249]


    "They’re involved with the wizard Exponentious: followers, accomplices, or maybe
    just admirers,” Frank explained.


    "Exponentious! exclaimed Notation. The evil wizard? Isn''t he in prison for trying
    to destroy the whole kingdom?”


    "Yeah, that''s him—the really bad wizard. Didn''t I mention he was the one Socks
    was going to rescue?” asked Frank.


    Notation glared back at him.


    "You misunderstand,” said Socks. “The kingdom wouldn’t be in ruins. It would have
    been saved. Once Exponentious comes to power, we’ll witness a new golden age.
    He—


    "He’s insane,” interrupted Frank. “He would have ruined the kingdom.”


    Off to the side Notation noted in agreement. “I have to agree with Frank on this
    one.”


    Socks’ eyes shone with fury. He jumped to his feet, flinging back his cloak. He
    swung his staff and began chanting a long incantation, whirling the staff in a
    complex pattern. Socks pointed the staff directly at Frank and finished the spell.


    Frank watched calmly as absolutely nothing happened. Notation rolled her eyes.


    "Done now?” Frank asked. “You have to know magic doesn’t work in here.”


    "Yeah, I just—” Socks started, slumped in defeat. He broke off suddenly and bolted
    for the door. Before Notation could fire, Socks swung his staff at the crossbow.
    She stepped out of range and repositioned herself, mildly disappointed at the
    pathetic escape attempt. At the same time, Frank grabbed the back of Socks’ robe
    and pulled him to a stop. The kid’s arms windmilled as he fought to break free.


    With a grunt, Frank heaved on the robe and Socks stumbled back into the cell,
    toppling to retrieve the fallen staff. It was useless for magic, but could still
    raise a nasty welt. Then he strode out. As soon as he was clear, Notation slammed
    the door.'
  - '[PAGE 250]


    # Epilogue


    Notation was waiting in the hall when Frank emerged from the captain’s office.
    “How''d it go?” she asked the moment he shut the door.


    “Well enough,” said Frank. “He didn’t yell, and I’ve got another three months’
    rent for my office.” He held up a small bag of coins.


    “That’s it?” asked Notation, “What were you expecting?” asked Frank. “A commendation?
    They don’t give commendations to private eyes. But I hear you got one, and a promotion.
    Well done, Detective Notation. It’s quite a step up.


    Notation blushed. “Thank you,” she said. “But what about you? I thought …maybe…”


    “You thought the captain would ask me to come back,” Frank filled in. “In fact,
    he tells me you recommended it.”


    Notation turned a bright shade of red. “You’re a skilled detective,” she said.


    Frank laughed. “He didn’t offer me a job.” Seeing the look on Notation’s face,
    he added, “Don’t take it personally. He was never going to offer me a spot on
    the force again. The captain and I have a long history, longer than a single case
    can erase. Anyway, the private eye life suits me better.”'
  - '[PAGE 251]


    "So you just go back to . ."

    "Hunting someone’s lost dragon?"

    "Yeah," said Notation. "That."

    As a matter of fact, I’ve been presented with a new opportunity.

    He held up his hand to stop her before she could get too excited, and added, "As
    an independent contractor."

    "What is it?" asked Notation.

    It appears there’s a league of wizards out there, trying to free

    Exponentially and take over the kingdom."

    Notation smiled. "I’m familiar with them. I seem to recall that I

    recently helped arrest one of their more active members."


    "One of their more active members, yes, and dedicated members,

    for sure. But it’s possible that he was also one of the less capable

    members. Princess Ann is concerned that Socks’s attempted prison

    break will inspire some of the league’s more senior and competent

    members."


    "So you’re investigating the League of Unnecessary Complexity?

    As an independent contractor, of course."


    Frank nodded. "It’s a tough search problem—find all the mem-

    bers of a secret evil organization. But it just so happens that search

    problems are my specialty."


