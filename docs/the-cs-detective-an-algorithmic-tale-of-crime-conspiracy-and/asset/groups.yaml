    这是弗兰克职业生涯中唯一忽略的一次启发式算法，当时“玻璃盒比利利”（Glass Box Billy）针对一起即将发生的抢劫案提供了多条提示。首先，比利利告诉了弗兰克逃生推车的确切等待位置、型号以及轮子吱声的音调。其次，比利利传达了一个传言，那是飞镖比赛期间在欢呼声间隙听到的：瑞贝卡·维内特（Rebecca
    Vinettee）亲自参与了其中，而且目标与鱼有关。


    弗兰克忽略了所有优秀的警察算法，决定直接追捕瑞贝卡·维内特。他知道她在他们装上推车之前就会消失，可能会使用另一条路线返回藏身处。他必须在她的消失之前抓住她。他驻守了首都的鱼类市场（Fish
    Depot），那里距离逃生车的位置只有两个街路。


    正如上尉后来用过分大声的叫解释的那样，鱼类市场恰好在反方向两个街路。另一方面，球体商场（Orb Emporium）距离逃生车只有四分之一个街路。一个与维内特家族完全没有关系的派党偷走了
    64 个高品质玻璃球和 2 个原型立方体球，将它们装上逃生车，开车离去，轮子的吱吱声正如比利所指出的那样令人心烦。弗兰克对比利提示的描述，以及他坚持增加一条“永远怀疑维内特家族”的新启发式规则，并没有说服上尉。


    然而，在目前的案件中，弗兰克连模糊的线索都快没有了。他耗尽了大部分具体的线索，进入了推测和怀疑的领域。如果他想再取得任何进展，他就需要更多信息。他转向他第二个最信任的启发式：当陷入死胡同时，收集更多信息。他需要更多关于那个面具的信息，它是如何被使用的，以及什么样的魔法防御可以阻止它。在这种情况下，这意味着要找到一个专家。


    ## 警察算法 101：启发式

    德雷克教授讲座节选


    启发式（Heuristics）是帮助算法指向正确方向的经验法则。虽然你无疑听到一些警察将启发式蔑低为随机猜测，但你也会看到这些警察诉诸过去对他们有效的技术和经验法则。重要的是要意识到，启发式和所有信息一样，质量参差不齐。


    启发式最清晰的例子之一是在物理世界中导航。无论你是在迷宫中徘徊、寻找未知城市，还是仅仅在寻找食堂，你会发现自己正在使用启发式来引导搜索。面对两条路，你会先尝试哪一条？一种常见且通常可靠的启发式是根据简化的距离测量对选项进行优先级排序。我最喜欢使用的是“直线距离”：如果路径上没有任何障碍，目标有多远？在实践中，这种启发式意味着我总是选择看起来在接近目标的路——即至少起始方向是正确的路。这样我可能会遇到几次胡同，但总的来说，我发现这是一个很好的启发式。


    当然，也有许多糟糕的启发式。在没有经过适当审查的情况下就使用新启发式的警察可能会发现自己陷入深度困境。几年前，一名年轻警察创建了一个特别糟糕的启发式。在破获走私环团获得前所未有的成功后，他脑子里认为所有调查必须从码头开始。问题在于，这个启发式是错误的。它并没有帮助他的调查指向正确的方向。事实上，它经常导致他直接陷入死胡同。在
    18 次失败的调查后，他的上尉安排他永久巡逻码头。


    启发式不应该是随机猜测。它们需要包含某些有用信息，并针对正确的问题进行定制。


    ## 政治与学术中的“堆”


    第二天一早，弗兰克溜出安全屋，穿过城市来到警察学院。一旦进入校园，被警察、学员和退休警察包围着，他感到放松了。当他横穿操场走向学院的教职工办公楼时，他甚至露出了灿烂的微笑。


    弗兰克多年没有进这栋大楼了。按照惯例，教授们保持开门政策，允许学生随时来提问。现实中，很少学生会利用这种机会，他们宁愿等到考试前一晚才意识到自己不知道多少。弗兰克往往坚持得更久，直到他坐下考试时才意识到自己的无知。


    快速浏览教职工目录显示，卢普博士（Dr. Loop）占据了大楼顶层唯一的办公室。弗兰克并不意外奇。教职工楼奇特的设计使得办公室分配在最好的时候也是一个充满争议的话题。每一层的办公室数量恰好是下一层的一半，这意味着不仅随着高度升高视野越来越好，每个办公室的面积也增加了一倍。在多年的激烈斗争后，院长实施了严格的基于职级的优先分配制度——任何办公室的占据者其任期（tenure）必须比正下方办公室的任何人都要长。实际上，他将教职工楼变成了一个大的基于职级的“堆”。


