    # POLICE ALGORITHMS 101: ARRAYS

    Excerpt from Professor Drecker’s Lecture


    Arrays are simple data structures that allow you to store multiple values. An
    array is like a row of bins. Each bin can store a single piece of information,
    such as a number or a character.


    | Value: | 20 | 15 | 19 |

    | :--- | :--- | :--- | :--- |

    | Index: | 0 | 1 | 2 |


    The structure of an array means you can access any value within the array, whether
    to write to or read from it, by specifying its index. Many programming languages
    use 0-indexed arrays, meaning the first value of array $A$ resides at index 0,
    the second at index 1, the third element of $A$ would be $A[2]$. Each station
    is equipped with an array of four to eight, depending on the size of the local
    population.


    # —4 —

    Strings and Hidden Messages


    Frank shook off Officer Notation and left through the back gate, where a large
    sign faced the road. For years the Crannocks had used this sign to broadcast coded
    messages. These days it was something of a tourist attraction for visiting criminals.


    The sign itself was an AnyText model. It held arrays of letters, each letter,
    space, or punctuation mark took up a single slot in an array, meaning the board
    could hold a total of 36 characters—enough to advertise a whole range of illegal
    activities. Every Monday morning, one of the Crannocks would drag a basket of
    letters to the sign and individually place the appropriate character in each slot.


    During his first week on the force, Frank’s partner had brought him out here to
    “check the board.” The message at the time—Apple picker wanted. What slugs?—sound
    innocuous enough to Frank. The Crannocks were looking for an apple picker to help
    with the harvest and were offering to get rid of people’s slugs. When he said
    this to his partner, a 20-year veteran, she laughed.


    | A P P L E | P I K E R |

    | :--- | :--- |

    | W A N T E D . | |

    | G O T | S L U G S ? |


    “And the slugs?” Frank asked.


    “Illegal slug racing,” she replied. “They hold races here every few months. You’ll
    get to know that one.”


    By the end of his first year, Frank had become an expert at reading the board.
    The only time in the past few years that Frank had a hard time deciphering a criminal
    tip from the board was during the wizard Exponentious’ attack on the kingdom.
    Exponentious had unleashed the Spell of Incorrect Indexes on all the kingdom’s
    ArrayDesignBoards. As its name implied, the spell changed the indexes, so the
    locations Mrs. Crannock thought she was setting the letters to were wrong. For
    a week, the Crannocks’ board held gibberish.

