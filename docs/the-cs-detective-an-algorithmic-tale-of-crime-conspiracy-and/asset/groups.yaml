    img/29fc41ddce7c5429aac7f91a728_68_png


    ## 适配你的：二分查找

    Drecker 教授讲座节选


    你面对的每一个计算问题都有完美的解决方案。学者们花费了多年研究广泛的问题并编写了解决方案。但在你所在的领域，你会发现新的问题。如果你离开这门课程时只背了一张算法表，你很快就会发现自己的麻烦。为了处理新问题，理解算法的工作原理以及如何将其应用于问题至关重要。二分查找背后的基本思想——利用数据中的结构反复减半搜索空间——比特定应用的细节更重要。你可以将二分查找适配到搜索（但仍已排序的）数组，甚至确定你搜索的最佳温度直到准确为止。


    ## 袜子（Socks）：插曲与引言


