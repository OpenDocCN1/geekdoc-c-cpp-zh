    # Iterative Deepening Can Save Your Life


    know that look,” said Mavis. Frank looked up at the TCP Flyer''s captain in annoyance.
    He preferred to brood quietly, and this was the second interruption in 10 minutes.


    “What look?” he growled.


    “That look,” she said, waving in Frank’s general direction. “You’re questioning
    your search and wondering if you spent too much time on dead ends.


    “Why would I be doing that?” Frank asked.


    “I heard what the kid said,” Mavis explained. “You’re suddenly on a tight timeline,
    and we have least another hour before we get back to Us.


    Frank nodded. “If this piece of junk—


    “Hey, now. Just because you’re questioning your search doesn’t give you a reason
    to insult my ship.”


    “Yeah. I suppose,” Frank mumbled by way of apology.


    He had been running through the leads in his mind, wondering if one of them would
    have provided quicker answers. He knew the log entries were good leads—as good
    as he could hope to find in a case like this. But they’d be time-consuming. He’d
    spent almost a full day traveling between ports on the TCP Flyer.


    With a grunt, Mavis lowered herself and sat next to Frank.

    “Iterative deepening?”


    Frank shrugged. The thought had occurred to him. Iterative deepening was a cross
    between a pure depth-first search and a breadth-first search. The algorithm searched
    in rounds, each round being a depth-first search that was limited to a given path
    length.


    “Never was a fan,” Frank admitted. He''d never been able to stom-repeating parts
    of the search over and over each iteration. So much of the work seemed to be wasted.


    Mavis laughed. “You haven''t faced enough dead ends then.”

    Frank raised an eyebrow. “You''re talking to a private investigator. I ran into
    more dead ends than correct paths.


    “Ever lose a criminal because of one?” asked Mavis.


    “A few times,” Frank admitted.


    Then you should appreciate iterative deepening,” said Mavis.

    When I first saw it in action, I was annoyed by the restarts too.

    But it''s saved my life more than once.


    Restarting a search over and over saved your life?” asked Frank.

    “Limiting how far I could explore along the wrong path saved me,” corrected Mavis.


    “When did iterative deepening save your life?” asked Frank, unable to keep the
    skepticism from his voice.


    Mavis stared out the ocean. “Well . . the first time was when I was just a kid.
    I was an apprentice on a vessel called Void Star. It was an amazing ship; it could
    carry anything. Anyway, we were lost in the middle of the Razor Ridges—a dense
    series of volcanic peaks that effectively form a maze—and we were running out
    of provisions.


    “Water?” answered Mavis. “We had at least two weeks’ worth of food. We were low
    on coffee, and that was bad news for the ship. Without coffee, the first mate
    would get twitchy and sing depressing shanties.”


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_132_0.png)


    “That doesn’t sound too bad.”


    “Without coffee, the man’s singing attracted every vicious bird in an eight-mile
    radius.”


    Frank winced at the thought.


    “Anyway,” continued Mavis, “coffee was vital for the ship. The captain estimated
    we had less than two days to find an island with a station. She knew there had
    to be one close, but didn’t know exactly where. You see, we’d lost the map during
    an impromptu paper airplane contest. And with the dense fog, we wouldn’t see the
    station until we were right on top of it.”


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_132_1.png)


    “We started off searching for an island with coffee. I was still green in those
    days and hadn’t heard of iterative deepening, so I boldly suggested a depth-first
    search. The captain just laughed and told me she’d never trust a depth-first search
    in the Razor Ridges—too many dead ends.


    Well. She gridded off the sea into one-mile-square chunks. One mile was about
    as far as you could see through the fog, so we would need to be in the same grid
    square as the supply station to see it. Then we set about exploring with iterative
    deepening. We used a depth-first search, but limited it to a single one-cell step.
    We used a classic north, east, south, west ordering, backtracking to the starting
    location each time. We didn’t find anything in this first step, but at least we
    were efficient about it. Within a few hours, we had eliminated all neighboring
    grid squares.”


