    “你共有几条线索？”队长问道，“按平均水平来说。”


    “平均水平？”诺顿（Notation）思索了片刻，“我想在两到五条之间。”


    “你想让我用部门里的一个优先队列，来帮你扫描一个只有两到五个元素的列表？”如果队长用了他一贯的咆哮，这个提问听起来可能没那么刻薄。相反，他那冷静的耐心让诺顿清晰地感觉到，他觉得这整场对话是多么愚蠢。


    诺顿脸红了。“额，优先队列并不算昂贵……”她开始说道，但声音渐渐小了下去。


    “听着，诺顿警官，”队长说，“我同意优先队列非常适合最佳优先搜索。等完这次会议，我可能会为每位侦探订购一套全新的。但你现在不需要。首先，你的线索还不够。更重要的是，你根本没参与这起案子。”


    在整个教训过程中，诺顿的脸逐渐变得通红，现在已经红成了像甜菜汤一样的色色。她深吸了一口气，直视着队长的眼睛，低声说道：“我明白了，长官。”


    弗兰克（Frank）感到一阵同情。诺顿犯了一个新手的错误，过度优化了解决方案。他不得不佩服她——使用优先队列来追踪线索的想法完全合理。事实上，他从直都在使用一个优先队列。然而，他提问的时机不能再糟糕不过了。


    “诺顿，”队长继续道，“你很有潜力。你很聪明，直觉也很好。但你必须学会服从命令。别变得像弗兰克这样。”


    诺顿张嘴想抗议。接着她看了弗兰克一眼，皱起脸，一言不发地闭上了嘴。她简短地了点头，行了个礼，大步离开了办公室。


    “还有你，弗兰克，你有工作要做。快去吧。”


    弗兰克转身跟着诺顿走了出去，甚至连点头都没给。


    弗兰克等他们走到楼梯口才开口。

    “你知道吗……球区（Orb district）有个巫师，能给你做一个廉价的优先队列。他的名字其实叫希珀斯（Heaperous）。我想他最初就是这样进入数据结构的。叫着希珀斯这样的名字，我想这是必然的。总之，那个优先队列不会好看，但好用。不过他只在上午上班，所以你得等到明天。”

    诺顿停下脚步，给了他一个怀疑的眼神。“你为什么要告诉我这些，弗兰克？”

    弗兰克努力脸上露出一副最同情的表情。“我曾听过队长的很多次演讲。更重要的是，我知道在调查期间，一个良好的数据结构是多么宝贵。”

    “如果数据结构这么宝贵，你为什么不使用优先队列呢？”她反驳道。


    弗兰克恼怒地看了她一眼。“我当然在使用优先队列。从我们开始我一直在用。你以为我把所有线索都记在脑子里吗？我太老了，玩不转那套。”

    “什么？”诺顿惊呼道，“你一直在用优先队列？你为什么不跟队长说呢？”

    弗兰克对此笑了笑。“你对队长还有很多要学的，新手。首先，当他在抱怨任何事情时，你永远不要打断他。我曾见过一个侦探因为带偏了一场关于豆腐的抱怨而被罚了一个月的月台值。那甚至还不是一场讲得特别精彩的抱怨。他当时卡在豆腐的软糯口感和索然无味之间反复切换。”

    诺顿盯着弗兰克，显然无言以对。


    “重点是，”弗兰克继续道，“有时你需要亲力而为。如果优先队列对你有帮助，就不要等申请流程。直接出去买一个吧。”


    诺顿考虑了下建议。最后，她点了点头。“我想，买自己的设备在技术上可能并不违反任何政策。谢谢你，弗兰克。”


    诺顿脸上的兴奋神情几乎让弗兰克感到愧疚。镇上任何一家巫师店都能制作优先队列，而且大多数价格都能和希珀斯相当。但希珀斯在球区的店已经是市范围内最远的一家，而弗兰克需要确保诺顿再多躲开一会儿。


    ## 警察算法 101：优先队列

    德雷克教授（Professor Drecker）讲座节选


    在你警察生涯中会遇到的所有数据结构中，我保证优先队列是最有。就像栈（stacks）和队列（queues）一样，优先队列允许你按特定顺序插入数据并在之后移除数据。栈和队列执行由元素插入时间决定的顺序，而优先队列按优先级递减对数据进行排序。下一个移除的元素是队列中优先级最高的元素，无论它是何时插入的。


    插入到优先队列的每个项目也必须有一个优先级，或分数。这可以是元素本身的值，也可以是由不同函数计算出的值。


    考虑这个根据严重对噪音投诉进行优先级排序的例子。如果你按照以下顺序插入投诉：


    - “指数级咖啡馆（Exponentiated Espresso）的人群”（得分 = 3）

    - “螃蟹之爪海歌大赛”（得分 = 6）

    - “斯文森农民（Farmer Swinson）的兔子”（得分 = 1）

    - “斯文森农民的公鸡”（得分 = 5）

    - “斯文森”（得分 = 7）


    你将按顺序从优先队列中检索它们：


    - “斯文森”（得分 = 7）

    - “螃蟹之爪海歌大赛”（得分 = 6）

    - “斯文森农民的公鸡”（得分 = 5）

    - “指数级咖啡馆的人群”（得分 = 3）

    - “斯文森农民的兔子”（得分 = 1）


    注意，并不保证数据会在优先队列内完全排序，只保证按顺序提取。正如你在随后的讲座中看到的，称为堆（heaps）的数据结构是实现优先队列的一种高效方式。


    警察局使用多种优先级函数。正如你所预期的，最受激烈讨论的队列是休假队列。该队列完全根据警官未使用的休假天数排序。尽管有之前的请求，不会根据休假地的优坏给予额外优先级。冰川、海滩和沼泽被同等对待。相反，队列根据公平性衡量进行优先级排序，确保下一个休假警官是今年休假最少的人。


    ## 用于破锁的优先队列

