    这一次，我们再次发现嫌疑人躲在 H 市——尽管这一次在搜索过程中，我们采取了不同的路径。


    与广度优先搜索一样，我们通过跟踪之前访问过的节点来避免重复探索节点。如果你想避免陷入无尽的循环并反复检查相同的节点，这种检查就尤为重要。在上面的示例中，我们完全避免了将之前见过的节点（无论已探索过还是未探索过）添加到我们的列表中。


    # — 12 —

    ## 食堂的栈与队列


    弗兰克蹲下身，冲向门口。他推推拉拉，门撞击在锁上发出咣当响响和砰砰声。他抓住锈迹斑斑的铁杆，全身用力推拉，但只是发出了更响亮的金属撞击声。


    弗兰克看向袜子（Socks），希望这位年轻的巫师会某种弯曲铁棒的咒语。鉴于这种情况，他有信心袜子甚至会同意使用开锁咒。但当弗兰克的目光落在冒烟的羊皮堆和向天花板升起的缕缕烟时，他愣住了。一个烟雾弥绕的厨房画面在他脑中闪过，勾起了他在学院第一年被遗忘的记忆。他几乎能听到厨师的叫喊。弗兰克用力闭上眼睛，试图将那段记忆赶走。


    在学院的前两个月里，弗兰克在课程和食堂的工读工作之间取得了平衡。这份工作并不光鲜；他们不让新来的学生洗碗，更不用说准备食物了。相反，弗兰克每周要花 15 小时，将大量的干净托盘、盘子和餐具从厨房运到食堂的各个位置。


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_107_0.png)


    尽管工作性质很枯燥，但弗兰克发现自己很享受其中。“看看我！我正在破坏你们的工作。我是‘反跑跑工’，”对着三个正在清理桌子并往垃圾桶里装脏盘子的服务生大喊。他曾试图打破学校两分钟内运送盘子最多的纪录，但并未成功。他创造了一个全新的食堂游戏，叫作“扔汤勺”。但直到他偶然遇到希彭斯教授（Professor
    Heappens），他才真正从这份工作中中学到了一些东西。


    “呃。有些数据结构根本不该出现在食堂，”希彭斯教授一边研究食物选择，一边大声嘀咕道。


    下午 2:30，午餐高峰期已经过去，弗兰克正忙着把一叠碗运到汤站。虽然那话不是针对他，但他发现自己自己在问教授：“什么数据结构？”


    “栈（Stacks）”希彭斯教授抬头看着弗兰克，“栈几乎从不属于食堂。”


    “当然有，”弗兰克回答道，带着一种只有新生和真正无知者才能表现出的确定性。他低头看了看手里抱着的一叠碗。“碗栈。盘子栈。煎饼栈。”


    希彭斯教授做了一个不屑顾的手的手，开始走开。“你对数据结构又懂些什么？”


    “还能怎么摆盘子呢？”弗兰克问，“如果你把它们首尾相接排开，会占用太多空间。”


    教授停下脚步，用深表忧虑的神情盯着弗兰克。过了近一分钟，他问道：“你知道栈和队列的区别吗？”


    弗兰克摇了摇头。他还没上过《礼貌数据结构。“栈是一种后进先出（last-in, first-out）的数据结构，”教授解释道，“它有两个操作。你可以把某东西推（push）到栈的顶部。或者你可以从栈顶弹出（pop）某个东西。”


    他指了指在队前方等待的一叠盘子。“就像那里的盘子栈一样。你可以把一个盘子推到栈上。”


    他把自己的空盘放在了栈的最上方。


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_108_0.png)


    “或者你可以从顶部弹出一个盘子。”他抓起了自己的盘子。


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_108_1.png)


    “每当你从栈中弹出某物时，你得到的是栈上最新的项。最旧的项会留在栈底，直到你弹掉了它上面的所有东西。”


    “那呢？”弗兰克问，“这有什么错？”


    弗兰克试图回忆上一次看到栈变空是什么时候，但连那个画面都想不起来。


    “五年了！”希彭斯教授大喊道，“我知道，因为我标记过。五年来，底部的那个盘子一直闲置状态，而像你这样的学生把其他干净的盘子堆在上面。它就那样坐在那里，边缘积满了灰尘。”


    弗兰克看了一眼盛满土豆泥的大木碗。一个厨师正在把它重新装满。他手里拿着一个大锅，正高兴地将新鲜的土豆泥舀进碗里。弗兰克过了一刻才意识到，旧的食物只是被埋在了下面。他的胃里翻了一海。


    “多久了？”他沙着嗓问，其实并不想知道。“别担心。他们至少每周清洗一次盛菜碗，所以旧的土豆泥没满一周。”


    弗兰克并没有感到安心。他反而感到不适。他快速扫视了一下食堂，发现到处都是后进先出的模式。当他走到沙拉酱桶时停了下来，胃里充斥着恶心和恐慌。


    “我们可以做什么？”他问。


    “队列（Queues）”教授回答道。队列简直是为食堂设计的。


    “队列？”弗兰克问。


    先进先出（first-in, first-out）数据结构，”希彭斯教授解释道，“和栈一样，它们也存储物品并有两个操作。你可以将某东西入队（enqueue）到队列末尾。或者你可以从前端出队（dequeue）。这样，你拿出的总是最旧的项。”


    弗兰克试图想象总是从栈底部拿盘子。“但怎么做？”


    “这就是数据结构的工作方式。看那个三明治队伍；它就是一个队列。现在里面有四个人，排在前面的人等得最久。”


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_110_0.png)


    就在希彭斯教授说这句话时，又有一个加入了队伍。“看，他们是从末尾入队的！”他注意到。


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_110_1.png)


    “而且是从前端出队的，”教授愉快地说，“这个食堂需要更多的队列。每个食堂都需要队列。”


