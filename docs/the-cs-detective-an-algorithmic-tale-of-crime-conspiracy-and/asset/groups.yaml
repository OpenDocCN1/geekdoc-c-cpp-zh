    # — 23 —

    Best-First Search: A Detective’s Most Trusted Tool


    Captain Donovan’s office hadn''t changed much in the last five years. The same
    desk sat in the center of the room, its surface clear aside from four baskets
    labeled “In,” “Out,” “To File,” and “To Burn.” A handful of new charcoal sketches
    adorned the wall, in addition to the large number Frank already recognized. Only
    the family pictures—charcoal sketches of the captain’s two kids and a family portrait—gave
    any indication of the passage of time.


    “Have a seat, Frank,” said the captain without looking up from his paperwork.


    Frank looked back to the chairs in front of the captain’s desk and thought back
    to the last time he’d sat in this office—his last day as a cop. He’d finally assembled
    enough evidence to go after Rebecca Vinetet yet again, even if some of his methods
    bordered on dangerously randomized. The captain hadn’t seen the same way, though.
    His focus has been on Frank’s blatant disregard for protocol rather than the new
    evidence. Pushing back the memory, Frank slumped into the right-hand chair and
    waited.


    Finally, the captain signed the form, placed it in the “Out” basket, and met Frank’s
    stare. “What’ve you found?”


    “It’s much bigger than a few missing files,” Frank replied.'
