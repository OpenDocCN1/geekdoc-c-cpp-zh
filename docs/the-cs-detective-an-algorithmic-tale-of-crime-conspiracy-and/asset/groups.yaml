    they simply weren''t good enough. But, from the looks of it, someone was on the
    case and Frank was already behind.


    He slid through the open front door and joined the officer and Mr. Crannock in
    the foyer. Mr. Crannock shot him disgusted look but didn''t seem surprised to
    see him. The officer, however, seemed caught off guard.


    “Who are you?” she demanded, turning on him with parchment and quill in hand.


    Frank ignored her. “Mr. Crannock,” he said. “So wonderful to see you again.”


    “Come to harass us, too?” Crannock asked. “You''re not welcome here, Frank.”


    “I’m not looking for a welcome,” replied Frank. “I’m looking for your wife. I
    have a few simple questions for her.”


    The officer stared at him. “Frank?” she asked. “Frank Runtime? Former detective
    turned private eye. What are you doing here? Someone lose a pet dragon?” she scoffed.


    Frank ignored her again. “Your wife, Mr. Crannock. Where can I find her?”


    The old man threw up his hands. “She didn’t do anything! She’s gone straight,
    you know. For real this time.” His acting wasn’t half-bad for an amateur.


    Frank smiled; he knew his effect was unnerving. Sure enough, Crannock cringle.


