    “我不是那个意思，”Socks 坚持道，“如果树变得不平衡怎么办？”


    “这可能会发生，”Frank 承认道，“当你向二叉搜索树中添加元素时，生成的树可能是不平衡的。不过，我们的搜索算法仍然可以工作。”


    “但在不平衡的树上搜索效率可能很低，”Socks 抗议道。


    “这确实如此，”Frank 承认道。


    向树中添加节点可能会抵消平衡二叉搜索树的主要优势之一：即它让许多算法变得高效。每当你大约将平衡二叉搜索树的节点数量翻倍时，只需要增加一层。这意味着对于简单的搜索（例如查找一个元素），你可以在数据量翻倍的同时，仅为搜索增加一个步骤。然而，Socks
    是对的：这种效率只在树是平衡的情况下才适用。在最坏的情况下，树会形成一条长线，你被迫沿着它进行搜索。而且当你添加任意值时，无法保证树会保持平衡。”


    “我们得冒这个险，”Frank 终于宣布道。


    “但是——”


    “如果我们的搜索没有没那么高效，我愿意接受。为了不用带着那些其他书从头构建树，这付出的代价很小。它们看起来很重。”


    ## 警察算法 101：二叉搜索树

    ### Drecker 教授讲座节选


    向二叉搜索树中添加节点与搜索目标值相似。我们从树的根开始，向下移动，就像寻找要插入的值一样。根据我们要插入的新值是小于还是大于当前节点的值，向左或向右移动。当我们到达死胡同时，下降结束：即在正确方向上没有子节点的节点。此时，我们可以创建一个新节点并使其成为（左或右）子节点。


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_182_0.png)


    插入单个元素的成本与树的深度成线性比例关系。然而，我们无法保证在插入新节点时树仍能保持平衡。事实上，取决于插入的顺序，树很容易变得不平衡并产生深层的分支。例如，如果我们按排序顺序插入数字，所有的添加都将进入同一个分支。


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_182_1.png)


    ## 二叉搜索树属性


    “等等，”Frank 说，“那错了了。”

    刚刚插入完一个节点的 Socks 惊讶地看了过来。“怎么了？”


    “你刚刚插入的那个节点，”Frank 说，“它的位置不对。”

    Socks 紧盯着那棵树。“但是 63 比 60 大，所以它应该放在右子树里。”


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_184_0.png)


    “但它比它的爷爷节点 61 大，所以它应该去那个节点的右子树。你把它放在左子树了。二叉搜索树的关键属性之一是，左子树中的所有节点都小于当前节点，而右子树中的所有节点都大。”


    “我清楚，”Socks 小声说。


    “那它为什么在左子树里？”Frank 问道。


    “我犯错了，”Socks 说。


    “你是如何错过 63 比 61 大这点的？”Frank 问道。


    “我……我是从 60 开始的，”Socks 承认道。


    “什么？”


    “这个，我最近插入了节点 60……而且 63 离 60 很近……所以我直接从 60 开始并把它插在下面。”


    “你没有从根节点开始？”Frank 严厉地问道。


    “我觉得这样会更快，”Socks 说，“我可以跳过树的大部分区域。”


    “结果你却把它放错位置了。你还走了多少次捷径？”


    “几个，”Socks 承认道。


    在他终于冷静下来后，Frank 深吸了几气，观察了那棵树。


    “我们必须进行穷尽搜索，”他咬牙说道，“如果树不保持二叉搜索树属性，我们就无法安全地进行任何剪枝。我们必须检查每个节点。”


    “嘿，”Socks 突然说，“我们把它放进树的时候就得检查了每个节点。我们为什么不直接做穷尽搜索呢？”


    “分摊成本，”Frank 说，“我希望以后用这棵树进行多次搜索。我怀疑范围搜索只会限于 50 天到 70 天。随着我们获得更多证据，我们可能会进行不同的范围搜索。也许我们甚至需要进行几次精确搜索。构建树的成本将分摊到多次搜索中，总工作量会降低——可能低得多。分摊成本考虑的是系列搜索的总成本，从而将构建树的成本分散到多次搜索中。”


    “噢，”Socks 说，“就像我的魔法按钮树一样。”

