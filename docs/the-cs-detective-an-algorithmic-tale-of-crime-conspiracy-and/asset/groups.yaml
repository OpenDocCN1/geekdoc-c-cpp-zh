    # 致读者的话


    本书侧重于计算思维和搜索算法。通过故事从高层面上介绍并说明了计算概念，探索了这些概念背后的动机以及它们在非计算机领域的应用。本书并非一本详尽的教材，这些故事也旨在替代计算机科学的严谨技术描述。相反，它们旨在用作插图：补充完整概念并帮助理解。


    本书涵盖了多种计算方法，这些方法都属于“搜索算法”这一广义类别。概念首先在故事的背景下呈现，然后在每章末尾以讲义笔记的形式在书中进行更具技术性的解释。读者可以安全地跳过这些技术章节，而不会错过任何故事情。


    本书假设读者具备一些基础计算机科学概念，但不需要掌握任何特定的编程语言。书中的算法适用于多种编程语言和问题领域。


    # — 1 —

    ## 搜索问题


    门在没敲门的情况下开了——只有合链的吱呀声宣告了客人的到来。弗兰克正要拿他的十字弩，但又停住了。如果是维内特人（Vinettees）来找他，他们会敲门的——用斧头敲。进门的无论是谁都想谈谈。弗兰克转而拿起杯子，喝光了剩下的已经凉的咖啡。


    “多诺万船长，”当男人进来时他说，“什么风让您来到这个华华社区？我以为您已经不再流于十五街以下了。”


    “好久不见了，”船长简单地说，“过得怎么样，弗兰克？”


    “极了，”弗兰克干涩地回答，眼睛盯着船长在房间里慢悠悠绕圈。


    多诺万扫视着弗兰克破旧的办公室。他红色的军官袍在他身后轻轻晃动。“私家探的工作过得如何？”


    “够付账单，”弗兰克撒谎道。


    船长点了点头。他停顿了一下，然后走向书架浏览起内容。


    “那么，这是一次社交性访问吗？”弗兰克说，“我是不是该问问玛琳和孩子的近况了？”


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_15_0.png)


    “他们很好，”多诺万头也不回地回答道。玛琳的乌龟美容业务最近很不错。比尔去年加入了警队。维罗妮卡是个会计师，这完全是我们意想不到的——”


    “我其实不是在问这个，”弗兰克中断道。


    船长耸了耸肩。他从架子上取下一本书，翻看着页码。弗兰克伸长脖子看向封面——警察学院年鉴：第二十一届。


    “你想怎样，船长？”弗兰克质问道。


    船长终于对上了弗兰克的目光。“你需要你的帮助，弗兰克，”他说。


    弗兰克直起身子。在弗兰克离开部队后的五年里，船长恰好来过他两次，两次都是为了警告他远离活跃案件。威胁一直是弗兰克意料之中的，但现在看起来船长似乎遇到了某种特殊的问题——也许那种意味着弗兰克欠租生涯将终结的问题。


    “我不在部队里了，”弗兰克漫不在经地说，“你为什么不找一个你信任的探员来做呢？”


    “我需要部队之外的人，”船长说，“别装了，弗兰克。如果你不知道我坐在这里意味着什么，你就不是我需要的人。”


    弗兰克咯笑道。“内鬼？在你们部队里？”


    更糟。昨晚有人闯入了警局的档案记录室，偷走了500多卷卷轴。


    “他们想要什么？”弗兰克问。他下意识地在椅子上向前倾身，去拿一卷新卷轴和一支羽毛笔。这个动作对他来说是自动的就像喝咖啡或避楼梯一样。


    “不知道，”多诺万说，“没有规律。他们偷走了整排架的文件，从财产纠纷到费用报告无所包。他们拿走了我们记录的杀手、名人、私家探员、公证人的账本……他们甚至拿走了斯文森农民（Farmer
    Swinson）的两箱噪音投诉信。但其他书架完全没有被碰过。我们统计至少有512份文件丢失。”


    “也许是斯文森农民的邻居之一，”弗兰克开玩笑道，“他们一定听到只要区区百次投诉，实习生就会去你家里给你上严厉的教训。”


    多诺万船长没忙回答。他只是怜悯地盯着，直到弗兰克清了清嗓子打破了沉默。“所以，你想找到这些文件？”


    船长摇了摇头。“我想让你找到小偷。我们有这些文件的备份。我想知道他们需要什么信息，以及他们打算如何处理这些信息。”


    “一个搜索问题，”弗兰克思索道。在他在部队期间，他的两个特长是搜索问题和惹恼船长。


    “国王知道吗？”弗兰克问。


    “我昨天向他简报了了，”船长说，语气中带着一丝不耐烦，“那个疯子魔法师的问题在于，国王坚持要求对每件事进行每日简报。”两年前，一个名叫“指数（Exponentious）”的权力妄狂魔法师试图摧毁整个王国。从那以后，弗雷德里克国王亲自主持了王国安全性的全面升级，出台了300多项安全规定，其中至少有5条涉及10层以下政府建筑内官方文件的存储。


    “不过我不能怪他，”多诺万抱怨道，“那是一次险万的。如果不是因为公主，谁知道王国会变成什么样。”


    弗兰克沉默地点头。“国王对这件事产生了个人兴趣，”船长继续不耐烦地说道，“他想要所有的细节：负责此案的人是谁？我们搜查过建筑了吗？我们正在使用什么算法？”


    弗兰克忍住笑，琢磨着这个提议。为首都做咨询工作会是一笔好钱。但话说回来，按照自己的方式总是能得到结果。


    “我料是如此，”船长最后回答。他从斗篷里取出一个薄文件夹，丢在弗兰克的桌子上。


    “我会联系你的，”多诺万说。然后，礼貌地离开了办公室。


    三个小时和十二杯咖啡后，弗兰克蜷缩在桌旁，第七次翻看那个薄文件夹。字迹在闪烁的烛光下跳动，但并没有提供任何新的见解。他们并没有太多线索。船长给了他一份丢失文件清单和当晚的值班表，但别无他。


    最后，弗兰克夸张地叹了口气，拿起一张羊纸开始做笔记。


