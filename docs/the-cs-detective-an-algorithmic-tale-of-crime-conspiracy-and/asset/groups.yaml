    # POLICE ALGORITHMS 101: INVERTED INDEXES

    Excerpt from Professor Drecker’s Lecture


    An inverted index is a computational data structure similar to the index of a
    book. It provides a mapping from target values to the location in the data where
    those values occur. Inverted indexes are especially useful when a given value
    occurs, or might occur, repeatedly throughout the data.


    Consider an example from our lecture on binary search—checking an accounting ledger
    for transactions with a particular merchant. The ledgers are sorted by increasing
    transaction number, indicating the order in which the transactions were recorded.


    | 101 August 16 | Zed’s Coffee | 8.00 |

    | 102 August 15 | Bob’s Pizza | 20.00 |

    | 103 August 15 | Wands and More | 150.00 |

    | 104 August 15 | Spell Shoppe | 100.00 |

    | 105 August 16 | Zed’s Coffee | 8.00 |

    | 106 August 16 | Spell Shoppe | 50.00 |

    | 107 August 17 | Zed’s Coffee | 8.00 |

    | 108 August 17 | Hospital | 250.00 |


    While this ordering allows us to efficiently find information for a given transaction
    ID, it doesn’t help us trace transactions to a particular merchant. One option
    would be to re-sort the entries by merchant name. However, this requires us to
    make a copy of the entire ledger, which can be costly.


    Instead, we can build an additional data structure: an inverted index, keyed by
    merchant name. For each merchant, we then store a list of all the relevant transaction
    IDs. Since we already know how to efficiently look up any transaction by its ID,
    we can now...


    | Bob''s Pizza | 102 |

    | Hospital | 108 |

    | Spell Shoppe | 104, 106 |

    | Wands and More | 103 |

    | Zed''s Coffee | 101, 105, 107 |


    Inverted indexes are a great example of trade-off between time and memory usage.


    # A Binary Search Trap


    Professional spies often devote considerable time to planning how they will react
    if discovered. They develop a portfolio of complex backstories for a range of
    scenarios, explaining away everything from following someone to being discovered
    in the palace with a listening device and a fake turtle. However, things rarely
    go so well in reality, and gasps of surprise are actually common. In this case,
    Frank had even been hoping for a moment of panic to exploit. True to form, however,
    the remained professional. There was no panic. There was no gap of surprise.

