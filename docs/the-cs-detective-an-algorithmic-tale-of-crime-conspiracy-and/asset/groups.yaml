    # 警察算法 101：字典树

    德雷克教授教授座的摘录


    字典树是基于树的数据结构，允许用户根据字符串的前缀高效搜索字符串。像二叉搜索树一样，字典树从根节点开始，并在向下推进时分支。在字典树中，每个分支决策都基于字符串的下一个元素。因此，字典树中的节点可以有两个以上的子节点。


