    spread out in the hold and formed a loose circle around Frank and Notation.


    “Ladies and gentlemen,” said Frank. We have concluded our inspection and it appears
    that you are not carrying any rotting eels. Thank you for your patience as we
    strive to ensure the safety of this kingdom’s food supply. We''ll be on our way
    now.”


    By way of reply, two of the larger thugs grabbed Frank’s arms. Together they lifted
    him off the ground and proceeded to carry him back onto the deck. Years of experience
    had prepared Frank for this reaction and he had developed a technique for positioning
    himself so as to minimize discomfort, but he could still feel the bruises forming
    under their powerful grip.


    “Hey!” Notation’s shout indicated that she was being similarly escorted out.


    Frank blinked as they emerged into the sunlight. The men carried him to the middle
    of the deck and dumped him on the wooden floor. Notation thudded next to him,
    and the thugs again formed a loose circle around them.


    “What’s the plan then?” asked Frank. “Lock us away? Drop us over the side? Hand
    over to your boss’s employer?”


    The man shrugged. “Don’t look at me, I’ve only been working here for fifteen days.”


    “A newbie, huh?” said Frank.


    The Viniettes were fanatical about limiting information. They only shared their
    plans with the most senior person on the crew. New hires were required to prove
    their loyalty as they worked up the ranks. To get any useful information, Frank
    would need to find the most senior person aboard.


    A plan started to form in Frank''s mind. The Vinettees’ crews always arranged
    themselves in order of seniority. It had nothing something to do with mentorship—the
    most junior crew member served as a new hire''s mentor and so forth up the ranks.
    In group situations, they all tended to stand next to their mentors.


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_62_0.png)


    The circle of thugs was nothing more than a sorted array that had been bent into
    a loop. Binary search would almost work here, but it would have to be adapted
    to fit the organization of the data: a circle, rather than a straight line of
    values. Unfortunately, this meant that Frank didn’t know where the array started
    or ended. Quickly he developed a new algorithm to efficiently search for the most
    senior crew member. In this case, efficiency meant both minimizing the number
    of thugs with whom he would have to converse and maximizing his chances of getting
    answers before they caught on.


    He turned to the woman on the thug’s right. “How about you? Are you the veteran
    here then?


    “Nineteen days,” she said.


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_62_1.png)


    Now Frank expected that he had an ordering—that seniority increased as he went
    counterclockwise around the circle. But he couldn''t be sure yet. As absurd as
    the possibility was, Fifteen-Days and Nineteen-Days could be the most junior and
    senior thugs, respectively. He had been careless with choosing how to start searches
    before; it never ended well. He need another data point. So he chose the middle
    of the remaining range of thugs.


    “How about you?” he asked a woman across Fifteen-Days. “Thirty-seven days,” replied
    the thug. “What’s it to you?”


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_63_0.png)


    With this piece of information, his hunch of a counterclockwise ordering was confirmed.
    Therefore, he discarded everyone between Fifteen-Days and the person before Thirty-Seven-Days
    from consideration—the most senior thug, if it wasn’t Thirty-Seven-Days, would
    have to be counterclockwise from her, but before Fifteen-Days.


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_63_1.png)


    Frank stifled a rising swell of annoyance. He had never faced such a junior crew
    before. He actually felt a little insulted. “This is getting embarrassing,” Frank
    said to their captors. “We were caught by a bunch of newbies. What are you all,
    the backup team?”


    “What are you doing?” whispered Notation.


    “A modified binary search,” Frank growled back. Notation sighed. “I figured that
    out. It looks like you’re searching for the most senior one. You’re not exactly
    being subtle. But why? And how do you know they’re standing in order?”


    Frank ignored her. He took a deep breath and refocused on the task at hand. He
    didn’t know how much time he had before The Boss showed up. “And you?” “This is
    my third day,” replied the man, hesitantly.


    “Come on!” shouted Frank. “Really?”


