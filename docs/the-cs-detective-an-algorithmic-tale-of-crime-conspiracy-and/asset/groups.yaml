    *大顶堆*（max heap）是一种基于二叉树的数据结构，节点与其子节点之间维持着特殊的顺序关系。具体来说，堆根据*堆属性*存储元素，对于大顶堆，该属性规定树中任何节点的值都大于（或等于）其下方的所有元素。这种结构允许大顶堆高效地支持几个重要操作：(1)
    高效找到最大元素，(2) 删除最大元素以及(3) 插入任意元素。这三个操作使得堆成为实现优先级队列的理想数据结构。


