    # 结识弗兰克·运行时（Frank Runtime）。

    名誉扫地的前侦探。

    硬汉私家侦探。

    搜索专家。


    当一起抢劫案发生在警察总部时，就要依靠弗兰克·运行时和他那丰富的搜索技能来抓捕罪犯了。在这部侦探故事中，你将学习如何使用算法工具来破案。运行时用二分搜索搜查走私者的船只，用搜索树跟踪间谍，用深度优先搜索逃离监狱，并用优先级队列打开锁具。在无所不知的符号法警官（Officer
    Notation）和笨拙的跟脚虫索克斯（Socks）的加入下，他通过最佳优先搜索追踪了一系列线索，揭开了一个深层阴谋。每一章都介绍了一个惊心动魄的转折，并对应一个新的算法概念，最后以技术总结结束。


    《计算机侦探》非常适合计算机科学学生和业余侦探，它为学习算法增添了趣味色彩。


    # 跟随弗兰克的任务并学习：


    - 最佳优先搜索、深度优先搜索、迭代加深、并行化、二分搜索等背后的算法

    - 基础计算概念，如字符串、数组、栈和队列

    - 如何将搜索算法适配到……

    - 在……中使用以及应用常识启发式方法的高效算法


