    # POLICE ALGORITHMS 101:


    ## DATA STRUCTURES AND SEARCH


    Excerpt from Professor Drecker''s Lecture


    As we''ve discussed in lectures throughout the semester, the data structures we
    use impact both how an algorithm functions and how efficient it is. During the
    lectures on depth-first search and breadth-first search, we looked at how the
    difference between stacks and queues impacted the search order. The use of priority
    queues for best-first search is another great example of the impact of data structures.


    Conceptually, best-first search is similar to both breadth-first and depth-first
    search. At each step in the algorithm, we are choosing a single new state to explore.
    The key difference is how we order our exploration of new states. Using a priority
    queue allows us to efficiently pick the most promising next state. Best-first
    search and priority queues are perfect complements and make an extremely efficient
    data structure–algorithm combination.


