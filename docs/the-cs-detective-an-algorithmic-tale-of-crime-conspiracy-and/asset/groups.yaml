    “那运输队呢？”


    “弩全坏了，”队长说道，“还有一辆车轮——我想是后左侧的。这应该记在报告里。”


    “剑呢？还有斧头呢？”


    你从不不屑于读那些报告。那些小偷们还使用了**加速生锈术**。这并不是什么特别高超的魔法，但确实很有效。


    “报告里没说他们偷了什么，”弗兰克指出，“没有提到那个面具。”


    队长挑起眉毛。“你知道那个面具？那是高度机密。”


    弗兰克耸了耸肩。“你付钱是让我找情报，”他说道，隐瞒了“袜子”只是无意中透露出这个信息的事实。让客户知道你的成功有多大程度上归于他人的愚蠢，从来不是划算的。


    “这令人担心，”弗兰克对队长说，“那是一件强大的神器。再加上我们收到的关于城堡可能遭到袭击的匿名举报，整个部队都处于警备状态。我们不得不从其他岗位抽调人员来加强安保。”


    “关于城堡我也听到了一样，”弗兰克承认道。他再次翻阅了文件。“没有关于袭击者的线索。”


    “我们听到了一些传闻，但还没有实锤。至少没有确凿到能进报告的内容。”


    “你的军官们呢？”弗兰克问，“你那里有嫌疑人吗？”


    队长观察了他他后才回答。弗兰克知道，如果不是怀疑有内鬼，队长绝不会来找他。但泛泛的怀疑与一份简短的名单之间存在着巨大的差距。


    “没有，”队长说，“我还没有发现任何异常。这些盗窃案之间没有线索。不同的哨站。不同的值班军官。甚至是不同的部门。”


    弗兰克沉默地点头，在脑海中反复思索这些盗窃案。他在内部调动上遇到了遇到了同样的死胡同。每次事件至少有一名新调入的人在岗，但从没有同一个官员出现过两次。弗兰克曾短暂考虑过整个新兵班中存在广泛阴谋的可能性，但立刻将其否之。任何能够协调如此大规模盗窃行动的人，至少不会让方圆百英里的每个站所都警觉。


    “那么笔记本军官呢？”弗兰克问。


    队长看起来很吃惊。“她怎么了？”


    “她在你的名单上吗？”弗兰克问。


    “她那天晚上在岗，所以她在我的名单上，”他说道，“但排在很后面。笔记本是个好孩子。她虽然没经验，但对部队很忠诚。”


    “你知道她一直在自己调查那起盗案吗？”


    队长皱起眉。“我想这不应该让我感到惊讶。正如我所说，她很投入。你是在哪里遇到她的？”


    “克拉诺克的农场，”弗兰克说，“在那之后她跟了一会儿。”


    “她露面了吗？然后呢？”


    “我不信任她，”弗兰克说。


    “你谁都不信，弗兰克。”


    弗兰克叹了口气。“不仅于此，”他说，“如果你发现任何异常，请务告诉我。”


    “你呢？”队长催促道，“你发现了什么？”


    弗兰克开始向他做一个简要总结。他告诉队长，自己如何根据线索来到克拉诺克的农场，并发现了一系列线索，引导他找到了乌斯、维内特的船，以及丽贝卡·维内特。


    听到这个消息，队长大笑着打断了他。“又和维内特一家碰面了，弗兰克？连丽贝卡也是。我很惊讶你居然还能走路。你把他们中的几个人关进了监狱？”


    “还不够，”弗兰克说。


    “也是，”队长承认道，“你是怎么从那里出来的？”


    “一个魔法师出现了，开始扔桶腌渍鳗鱼，”弗兰克说道，仿佛这是再正常不过的事。


    队长张口看着他。“什么？”


    “一个叫‘袜子’的初级魔法师，”弗兰克解释道，“他是格雷琴这位魔法师的学徒。显然，国王请了几位高级魔法师来协助处理此案。”

