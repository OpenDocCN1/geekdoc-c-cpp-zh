    # 警察算法 101：


    ## 数据结构与搜索


    德雷克教授讲座节选


    正如我们在整个学期的课程中讨论的那样，我们使用的数据结构既影响算法的运行，也影响它的效率。在深度优先搜索和广度优先搜索的课程中，我们查看了栈和队列之间的差异如何影响搜索顺序。使用优先级队列进行最佳优先搜索是数据结构影响的另一个绝例子。


    从概念上说，最佳优先搜索与广度优先和深度优先搜索都相似。在算法的每一步中，我们都选择一个新状态进行探索。关键在于我们如何对新状态的探索排序。使用优先级队列允许我们高效地选择最有可能的下一个状态。最佳优先搜索和优先级队列是完美的互补，形成了极高效的数据结构-算法组合。


