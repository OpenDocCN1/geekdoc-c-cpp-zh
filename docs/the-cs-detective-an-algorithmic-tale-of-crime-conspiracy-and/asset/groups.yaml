    “但是火，”袜子克斯说。

    “是你的法杖引起火的，”弗兰克提醒他，“你把它掉在纸上了。”

    “纸？”诺言问，“你们找到日志了吗？你们知道他们在找什么吗？”


    弗兰克和袜子克斯互相看着。诺言在两人之间看了一眼。最后，弗兰克开口了：“日志没了。我们这儿的初级巫师掉了他的法杖，然后砰——到处都是火。任何线索现在全都没了。”


    袜子克斯脸涨得通，盯着地面。“全了，”诺言问道，“全都没了？你确定吗？”“是的，”弗兰克说。他指了指门口渗出的烟雾。


    “那个攻击你们的人呢？”诺言问。“我没看清他的脸，”弗兰克说，“我不认为你看到了什么？”他问道。这个问题的语气比他预想的要尖锐，但在遭到攻击、被困在燃烧的房间并从黑暗的监狱逃生后，他觉得没必要留情了。


    “没有，”她冷静地说道，“前面周围什么都没有。“任何门附近都没有痕迹吗？”弗兰克问，“有什么能给我们提供关于攻击者线索的吗？”


    诺言摇了摇头。“什么都没有，”她说，“看起来对面好几个月没人来过了。”


    弗兰克点头，但没有说话。感觉不对劲。要么攻击者巧妙地通过他们用过的那扇门溜过了诺言，要么她对他们隐瞒了什么。她离开大门多久了？为什么一直留在外面？弗兰克决定不追问这个问题。“好吧。我们回船上。”


    “现在怎么办？”袜子克斯在走向水边时问道。


    “是时候回溯了，”弗兰克说，“这里没有线索。”


    “回溯到哪里？”


    “回到开放的线索，”弗兰克回答道，“我们调查剩下的线索。”他停顿了一下，权衡自己的选择。“我觉得是时候并行搜索了。”


    “真的吗？”诺言问。


    “并行？”袜子克斯问。


    “意思是我们分头探索搜索空间的不同部分。”


    “但是，”袜子克斯反对道，“我既不是警察也不是私家侦探。我不知道该做什么。我不应该跟着你们其中一个吗？”


    “不。好的，”诺言同意道，“我们如何分配工作？”


    弗兰克知道，高效并行算法的关键在于确保使用多个工作者的收益大于分配工作的成本。并行化工作涉及一定的开销。问题需要被拆分成碎片。每个工作者必须获得任务，准备好执行，然后实际执行。最后，工作必须重新合并。并行化一个简单任务有时比直接解决它成本更高。然而，当问题足够大时，并行化可以大大加速算法。


    “简单，”弗兰克说，“袜子克斯，我你需要和你的巫师朋友聊天。问问他们是否知道一个叫‘……联盟’的团体。船上的流氓说在瑞贝卡·维内特特打断他们之前，他们正在为某个联盟工作。根据之前的案件，这个名字会很邪恶，比如‘权欲狂人联盟’或‘黑暗联盟’。邪恶联盟的名字通常不含蓄。尽一切寻找有关这个小组的信息。”


    “这没什么可查，”袜子克斯抱怨道。

    “诺言，”弗兰克继续说，“我需要调取过去六个月所有的警察调动记录。”虽然他不不喜欢让线索引向诺言，但她是唯一能方便获取记录的人。如果他尝试自己收集，将会遇到怀疑的目光和层层叠叠的文书。首都警察部门处理文书的手段同样坚定且有效。


    “调动？”诺言问道，显然很惊讶，“为什么？”

    “权当直觉吧，”弗兰克撒谎道，“我们明天早上在我办公室见面，汇总我们的信息。”


    “你呢？”诺言问。她的语气现在带着一丝烦躁。她显然知道弗兰克没有说出全部。


    弗兰克给了她一个无辜的微笑。“我要去购物。”


