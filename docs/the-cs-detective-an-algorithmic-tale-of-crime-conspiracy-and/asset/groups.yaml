    # Acknowledgments


    I am tremendously grateful to all the people who contributed to, worked on, and
    supported this book.


    I would like to start by thanking the whole team at Starch Press. In particular,
    I would like to thank Liz Chadwick and Riley Hoffman for their excellent help,
    guidance, and suggestions during the editing process. Liz''s brilliant suggestions
    were invaluable for keeping the story focused and moving. I am also grateful for
    her ideas in shaping the lecture notes format of the technical sections. Thank
    you to Bill Pollock and Tyler Ortman for their support, and a special thanks to
    Bill for suggesting the title. I would also like to thank Carlos Bueno for pointing
    me to No Starch Press.


    Thank you to Miran Lipovača for his amazing illustrations. They truly capture
    the characters and the story.


    Thank you to Heidi Newton for her thorough and insightful technical review. Her
    work was vital in ensuring the concepts came across both accurately and understandably.
    I appreciate the number of times she warned of explanations being too technical
    and thus inaccessible to students.


    A tremendous thanks goes out to all the people who slogged through earlier versions
    of this book and provided valuable feedback: John Bull, Mike Hochberg, Edith Kubica,
    Regan Lee, and Kristen “Kit” Stubbs, PhD. Thank you to Ilana Schwarz, who edited
    the earlier version of the manuscript and helped smooth out many of the rough
    edges.


    A deep thank you to my family for their support. In particular, thank you to my
    parents for supporting my interest in computer science as a kid and for providing
    significant encouragement for this book.

