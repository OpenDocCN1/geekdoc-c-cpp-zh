    弗兰克动作格外缓慢地取回船长的信。他身体前倾，花了整整一分钟才把信放在办公桌上。他没有坐回椅子。动得越少越好。


    在研究了一会儿笔记后，卢普博士向他的卫兵示意了一下。弗兰克听到弩箭的保险栓弹开的声音。他松了一口气，靠在椅子上。卢普博士挥了挥手让卫兵出了房间。


    “你让多诺万船长给你写了封介绍信？”卢普博士问道。


    “正如你所说，这是一个敏感的话题，”弗兰克回答道。


    “而且你可能听过我的名声，”卢普博士咯笑道。


    “我上过你的课，”弗兰克低声念道，但卢普博士没听到。


    “所以你在调查盗窃案。你想知道什么？”


    转瞬间，他的神态完全变了。他的眼神快速扫过他的脸，仿佛在分析每一个反应。所有的客气消失得无踪；他的声音变得公事公办。弗兰克在想，那些愉快的寒暄有多少是在演戏。魔法犯罪学是一个危险的领域，而卢普博士生存了这么久。


    “警察局有什么魔法保护措施？”弗兰克问道。


    “基础警报法术，”卢普博士说，“如果有人在局里使用魔法，它们会提醒你，但不能阻止。”


    “为什么没有魔法屏障呢？”


    “不现实，”教授解释道，“警察部队使用了太多的巫顾问。他们需要对证据施放占卜术，对囚犯施放真言咒，对记录施放镜像咒，以及对午餐施放加热咒。”


    弗兰克点了点头，想起了关于魔法优先级队列的对话。


    “反正那也太贵了，”卢普博士补充道，“只有皇家城堡和监狱拥有比基础警报术更多的东西。城堡有一系列保护咒，但没有削弱咒。马库斯在国王那里做的工作太多了。”


    “所以有人可以在城堡里使用魔法？”弗兰克确认道。


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_238_0.png)


    “可以，”卢普博士回答道，“但那样并不明智。城堡有十几种保护咒可以拦截攻击性魔法。弗雷德里克国王还雇佣了六名巫师卫兵。他们是初级，但可以解除基础诅咒。还有马库斯。很少有巫师想得罪他。”


    “那法器呢？”


    “啊。这是一个好问题。取决于法器。城堡当然对武器化法器有防御，但没有任何东西能保护所有的法器。种类实在太多了。由于大多数法器不需要新的魔法（因为之前已经被施过魔法），即使是监狱里的禁魔法术在这里也无能为力。”


    “什么？”弗兰克问，“我以为监狱对所有魔法都是免疫的。他们不在那里留巫师吗？事实上，指数（Exponentent）不是就在那里吗？他曾试图用魔法摧毁整个王国。他们为什么不直接阻止所有法器运作呢？”


    卢普博士干笑了一下。“很抱歉让你失望，但你无法阻止所有的法器。不过别担心，皇家巫师会严守护最强大的那些。而且所有囚犯在到达时都会经过彻底检查。”


    “监狱还有什么保护措施？”弗兰克问道，随着碎片开始拼凑完整，恐慌感油然而生。


    “困难搜索法术？”弗兰克打断道。


    “那不是新奇了。”


    “困难搜索法术有什么作用？”弗兰克问道，心中充满了恐惧。


    “它让寻找东西变得困难，”弗兰克解释道，“如果你在寻找某个特定的人或物体，法术会扰乱魔法环境。这就像是在草堆中找针，但那堆草堆是在移动的。”

