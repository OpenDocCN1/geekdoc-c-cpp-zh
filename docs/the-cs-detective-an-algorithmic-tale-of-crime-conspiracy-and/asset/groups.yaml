    # 警察算法 101：字符串

    Drecker 教授讲座节选


    数组不仅存储数字列表；它们还可以用于存储文本字符字符串。许多编程语言使用数组来实现字符串。数组中的每个区块存储单个字符，该字符可以是字母、数字、符号或空格。与其他数据数组一样，这些字符串中的字符可以通过它们在数组中的索引直接访问。


    | | H | E | L | L | O | ! |

    |---|---|---|---|---|---|---|

    | 索引 | 0 | 1 | 2 | 3 | 4 | 5 |


    在你的警察职业生涯中，你将对这种文本表示法*非常*熟悉。所有标准警察表格都要求警官在*每*页页顶部的 32 块数组中记录他们的姓名。在一个典型的月里，你将填写超过
    400 个这样的数组。


    ## -- 5 --

    二分查找走私货的船


    Usb 港仅仅是一个渔村。十二栋饱经风霜的建筑聚集在一个条长码头的尽头。几处微弱的活动包围着最近的抵达者，但除此之外，小镇安静得令人心安。


    弗兰克径直走向“蟹钳酒吧”（Crab''s Pinch），那是一家以贝蛤浓汤和周三晚上的海歌比赛而闻名的渔民酒吧。如果运气好的话，他的某个联系人会在今天结束前出现。毕竟，“蟹钳酒吧”是
    Usb 唯一去的地方。于是弗兰克在后角的一个桌子旁坐下，点了一份浓汤开始等待。


    没过多久，一个名叫梅维斯的自由职业走私者进入了这间潮湿的小酒吧。梅维斯天性谨慎，从技术上上说，她从未被裁定过罪，尽管众所周知她曾放火了自己的船以销毁证据。弗兰克和她相处得不错，至少在他离开警察部队之后是这样，他们甚至偶尔交换信息。


    弗兰克喝了整整一小时的浓汤，终于推开碗，向梅维斯比了比手。她在门口犹豫了一片刻，然后挤进了酒吧。


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_43_0.png)


    “梅维斯，”弗兰克在她加入他角落时说，“你好吗？”


    “我 10 分钟前感觉好多了，”她吐口道。


    在弗兰克开口问之前，符号警官（Officer Notation）穿过门，举起手。“女士们先生们，”她大喊道，“请大家留意。我在寻找一辆两晚前经过这里的推车。”


    弗兰克低声咒骂道。他的线索就这样了。


    “我是从清晨跑回来的，希望能喝一碗热汤并得到几分钟清静，”梅维斯抱怨道，“结果我得到这个警察在那儿叫嚷什么驴推车。”


    弗兰克干笑了一下。“而且在她离开之前，你没法卸掉你的货物。对吧？”


    梅维斯瞪了他，但没有反对。Usb 在渔业或航运业从未取得过成功。然而，这个港口吸引了那些想要移动货物而不愿与多管政府官员交道的罪犯。弗兰克愿意赌一个月房租，赌码头头没有一艘船不是在走私东西。


    “你对那辆推车知道什么吗？”弗兰克压低声音几乎是耳语。梅维斯耸耸肩。“码头总有推车。这是一个港口，弗兰克。人们移动东西。”


    “这是一辆特殊的推车，”弗兰克追问。“一群独立的动物圈，像一个轮子上的巨大数组。”


