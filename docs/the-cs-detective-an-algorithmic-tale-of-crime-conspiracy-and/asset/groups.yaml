    “That’s not what I mean,” insisted Socks. “What if the tree becomes unbalanced?”


    “It could happen,” admitted Frank. “When you’re adding elements to a binary search
    tree, the resulting tree might be unbalanced. Our search algorithm will still
    work, though.”


    “But searches could be inefficient on an unbalanced tree,” protested Socks.


    “That’s true,” admitted Frank.


    Adding nodes to a tree could cancel out one of the major advantages of a balanced
    binary search tree: that it makes many algorithms efficient. Each time you approximately
    double the number of nodes in a balanced binary search tree, you only need to
    add a single level. This means for a simple search, such as looking up an element,
    you can double the amount of data while adding only one more step to your search.
    However, Socks was correct: this efficiency applies only if the tree is balanced.
    In the worst case, the tree forms a long line that you’re forced to search along.
    And when you’re adding arbitrary values, there are no guarantees that the tree
    will remain balanced.


    “We’ll have to risk it,” Frank declared finally.


    “But—“


    “If our search isn’t as efficient as it could be, I’m willing to live with that.
    It’s a small price to pay for not having to carry those other books with us to
    build the tree from scratch. They looked heavy.”


    ## POLICE ALGORITHMS 101: BINARY SEARCH TREES

    ###cerpt from Professor Drecker''s Lecture


    Adding nodes to a binary search tree is similar to searching for a target value.
    We start at the root of the tree and progress downward as though searching for
    the value to insert. We progress to the left or right depending on whether the
    new value we''re inserting is smaller or larger than the value at the current
    node. The descent ends when we reach a dead end: a node without a child in the
    correct direction. At this point, we can create a new node and make it the (left
    or right) child.


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_182_0.png)


    The cost of inserting a single element scales linearly with the depth of the tree.
    However, we have no guarantees that the tree will remain balanced as new nodes
    are inserted. In fact, it is easy for a tree to become unbalanced, with deep branches,
    depending on the order of insertions. For example, if we insert numbers in sorted
    order, all the additions can go down a single branch.


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_182_1.png)


    ## The Binary Search Tree Property


    “Wait,” Frank said. “That’s wrong.”

    Socks, who had just finished inserting a node, looked in surprise. “What?”


    “The node you just inserted,” said Frank. “It’s in the wrong place.”

    Socks peered at the tree. “But 63 is larger than 60, so it goes in the right-hand
    subtree.”


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_184_0.png)


    “But it’s greater than its great-grandparent 61, so it should have gone to that
    node’s right subtree. You have it down the left subtree. One of the key properties
    of a binary search tree is that all nodes in the left subtree are less than the
    current node, and all nodes in the right subtree are larger.”


    “I know that,” said Socks quietly.


    “Then why is it in the left subtree?” Frank asked.


    “I made a mistake,” said Socks.


    “How did you miss that 63 is larger than 61?” Frank asked.


    “I . . I started at 60,” Socks admitted.


    “What?”


    “Well, I had recently inserted node 60 . . . and 63 is close to 60 . . . so I
    just started at 60 and inserted it below that.”


    “You didn’t start at the root?” Frank snapped.


    “I figured this would be faster,” said Socks. “I got to skip down most of the
    tree.”


    “You ended up putting it in the wrong place. How many other shortcuts have you
    taken?”


    “A few,” admitted Socks.


    After he had finally calmed down, Frank took a few deep breaths and surveyed the
    tree.


    “We’ll have to do an exhaustive search,” he said through gritted teeth. “If the
    tree doesn’t maintain the binary search tree property, we can’t safely do any
    pruning. We’ll have to check each node.”


    “Hey,” said Socks suddenly. “We had to check each node to put it in the tree.
    Why didn’t we just do an exhaustive search?”


    “Amortized cost,” Frank said. “I was hoping to use the tree for bunch of searches
    in the future. I doubt 50 days to 70 days will be the only range searches. As
    we get more evidence, we might do different range searches. Maybe we would even
    need to do a few exact searches. The cost of building the tree would be averaged
    out over many searches, and the overall effort would be lower—possibly much lower.
    Amortized cost considers the total cost for a bunch of searches and thus spreads
    the cost of building the tree over many searches.”


