    ![](img/e29fc41ddce7c5429aacfb7f918a9728_65_1.png)


    Bingo. “Really?” said Frank. “What are you doing here?”

    The thug frowned. “What do you mean?”


    “The Vinetees usually reserve their senior henchmen for more important tasks.
    Babysitting a shipment of smuggled cabbages seems like a waste of your time,”
    he said, struggling to remember whether there had been anything about cabbages
    in the log. It was a reasonable bluff anyway. All smugglers dealt with cabbages
