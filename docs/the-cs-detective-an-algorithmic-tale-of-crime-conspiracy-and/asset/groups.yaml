    弗兰克点头。那气味就像厕所里的鱼味空气清新剂，有几个地方闻起来也那么糟糕。


    “那时候有人离开吗？”他问。如果小偷们把偷来的文件运这么远，他们就不会在那里等。


    “只有‘重试循环’Retry Loop），”梅维斯说，“我告诉你是因为这是公开信息。我不知道它载了什么，我不在乎。”


    “你知道它什么时候回来吗？”弗兰克问。


    “19 小时前回到港口的，”梅维斯回答道，“我那时也不知道它载了什么。”


    弗兰克灿烂地笑了。“看起来我是时候该在城里转转了，”他说。


    梅维斯敷衍地对他笑了笑，转去招手示意一名服务生。


    弗兰克在码头上走得不到 20 米，符号警官就走到了他身边。


    “运行时先生（Mr. Runtime），这是我的调查，”她开始说道，“如果你有线索——”


    弗兰克停了下来，让她停下了脚步。“警官，你到底在调查什么？”他问。


    情况比弗兰克预想的要好。符号官张了几次嘴，脸红晕蔓到了脖子上。


    “船长不知道你在这儿，对吧？”弗兰克问。“这并不完全是一次正式调查。”

