    # — 26 —

    Heuristics in Search


    Frank spent the night alternately reviewing clues, watching out the windows for
    Vineette thugs, and bemoaning the safe house’s lack of food. Soon, he realized
    that it wasn''t just food that was missing. The apartment lacked the standard
    equipment—blank notebooks, quills, and sturdy furniture—found in every police
    building. Once he thought to look for it, Frank quickly located a large “For Rent”
    sign in the window. He was just lucky the police hadn''t rented it out or changed
    the combination yet.


    After a few hours, Frank convinced himself the Vineettes wouldn''t find him. He
    abandoned the windows, began to pace the empty apartment, and focused on the case.
    The When and Where were easy—the clues suggested an attack on the castle tomorrow
    night. Unfortunately, aside from the When and Where, Frank still didn''t have
    any answers. In particular, the Who, Why, How, and Could-I-Sneak-Out-for-Food-Without-the-Vineettes-Seeing-Me
    remained important questions.


    After an hour of pacing while trying to fill in the remaining details, Frank had
    started to doubt even the When and Where. An attack on the castle seemed too obvious,
    and the police were already prepared for it. Even Socks was telling everyone he
    knew to watch for it.'
