    The captain thought about this for a moment, then said, “I don’t think she’s the
    type. My gut says she’s a good officer. But I’m not sure who to trust right now.
    She shouldn’t be working the case anyway. It’s not her assignment.”


    “Thank you,” Frank said.


    “Any other transfers I should look into?”


    Frank shook his head. “Some of the rookies were at the various crime scenes, but
    there’s no common thread. No one could have been involved in more than one theft.
    So unless you have a class of traitors, I think it’s a dead end.”


    “That’s good work, Frank,” said the captain. “One of the nicest examples of best-first
    search I’ve seen in years.”


    Frank smiled. Even within the force, few people would bother to refer to this
    type of investigation as best-first search. More often, a person would say “I’m
    looking into things” or “I’m following up on some leads.”


    Despite this lack of recognition, best-first search was a staple for every police
    officer, ranking up with other vital tools like a notebook and a pair of comfortable
    shoes. In best-first search, you kept a list of current leads promising one to
    follow, and followed it. Once you had followed that lead, you simply picked the
    next one to follow. Any new clues found along the way were added to the list.
    It was the best tool to solve many cases.


    “Anything else?” asked the captain.


    Frank shook his head.


    “All right,” said the captain. “Keep at it then. If the League of Unnecessary
    Complexity really does exist and is behind this, then we’re in a lot deeper than
    I thought. You better watch your back, Frank.”'
