    “The sorting doesn’t help us here,” answered Frank. “We don’t know the time. Sorted
    data only helps when it’s sorted by a useful dimension. They didn’t bother to
    sort by suspiciousness.”


    “Oh. It’s the Weather Records problem,” said Notation.

    “What problem?” asked Frank.


    “It’s an illustration of sorting data by the wrong value doesn’t help a search,”
    explained Notation. “Professor Decker gave the example of finding the coldest
    day in the last 10 years. If the logs are sorted by day, you can use binary search
    to efficiently find any specific day. But that doesn’t help us to find the coldest
    day, so we’d still have to scan through all the data. I hadn’t expected to see
    such a clear example outside of class, though.”


    “Welcome to the real world,” said Frank. Out here, you have to check when the
    structure in the data is helpful to you and when it isn’t. Don''t worry, it’s
    a common rookie mistake.


    He could see Notation bristle at his words and tried not to enjoy his reaction
    too much. Every rookie came out of the academy thinking they knew it all, and
    every one had a lot to learn. Notation was getting off easy with a lecture. His
    own education with binary search had involved hours of scooping through barrels
    of pig waste while he questioned his career choice.


    After about three minutes, they found their only clue. The Retry Loop had recently
    made two suspicious stops, at the Port of Mudwood and Frayed Cable Island. Even
    for smugglers, these were strange destinations. The Port of Mudwood boasted little
    territory beyond its outlying mud farms. And Frayed Cable Island was even more
    desolate; the small, rocky island possessed only a single building—now abandoned
    Iron Ring.


    ## POLICE ALGORITHMS 101: BINARY SEARCH

    ### Excerpts from Professor Decker


    The key to binary search is that the data must be sorted. If the data is not sorted,
    you cannot use binary search. For example, if you have a list of transactions
    sorted by transaction ID, binary search is a great way to find a specific transaction.
    But if you want to find a transaction by date, and the list is only sorted by
    ID, you''ll have to check every transaction in the list.


    However, this also means that the entries in other fields, such as the actual
    date, the merchant''s name, or the transaction amount, are *not* in sorted order.
    What if you''re interested in finding transactions above a certain amount or with
    a known merchant? Does the sorting help you? No, you would still find yourself
    using an exhaustive search. Knowing that transaction 105 was at Zed''s Coffee
    doesn''t tell you anything about the merchants or amounts before or after that
    one.


    | Date | Merchant | Amount |

    | :--- | :--- | :--- |

    | 2023-01-01 | Zed''s Coffee | $10.00 |

    | 2023-01-02 | Bob''s Pizza | $20.00 |

    | 2023-01-03 | Wands and More | $15.00 |

    | 2023-01-04 | Spell Shoppe | $100.00 |

    | 2023-01-05 | Zed''s Coffee | $8.00 |

    | 2023-01-06 | Spell Shoppe | $50.00 |

    | 2023-01-07 | Zed''s Coffee | $8.00 |

    | 2023-01-08 | Hospital | $250.00 |


    ## Adapting Algorithms for a Daring Escape


    Heavy footsteps pounded the wooden deck above. Frank glanced around, assessing
    their limited options. The only hatch led up to the deck and the new arrivals.
    The hold itself was nearly empty, the crew having unloaded the cargo upon arriving
    in Usb. Trying to hide here would amount to standing in a corner and whispering
    “You can’t see me.”


    As Frank listed and discarded every possible option, including the rarely effective
    ploy of lying down and playing dead, he saw Notation pull out her badge and stand
    at attention.


    “What are you thinking?” he hissed.


    “I am an officer of the law on an official investigation,” explained Notation.

