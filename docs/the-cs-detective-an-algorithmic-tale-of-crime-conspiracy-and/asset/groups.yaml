    # 警察算法 101：

    ## 广度优先搜索

    德雷克教授（Professor Drecker）讲座节选


    广度优先搜索是一种按照遇到搜索状态的顺序探索它们的算法。换句话说，它总是尝试探索最旧的未搜索状态。


    你可以将广度优先搜索可视化为维护一个已知但未探索状态的列表（更正式地说，是一个 `queue`）。在每一步中，算法从队列头部选取下一个要探索的状态。当算法发现新选项时，它将其添加到队列尾部，确保在移动到新选项之前已探索所有之前的选项。


    通过它如何探索图来描述广度优先搜索是有帮助的。图是由单个节点组成的数据结构，边连接这些节点。如果两个节点通过一条边连接，我们称它们为邻居，这意味着你可以在这些节点之间移动。在你的培训期间，你至少学习过一张图——王国高速地图。这张地图将每个城市表示为节点，将连接它们的公路表示为边。确保你有一份良好的副本。罪犯倾向于逃离城市，你需要知道他们最可能去哪些邻市。


    搜索王国高速地图是一个经典的图搜索问题。我们的搜索状态是图的节点——地图上的城市。假设 A 城市发生了一起案件，你的任务是找到逃亡的罪犯。


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_91_0.png)


    广度优先搜索沿着不断扩张的边界探索，在进入任何 X+1 步的节点之前，检查距离初始节点 X 步的每个节点。当你探索 A 城市后，它的两个邻居 B 和 D 被添加到队列中。队列中没有其他城市，所以
    B 是你将访问的下一个城市。


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_91_1.png)


    如果每个节点都有许多邻居，维护待探索节点队列可能会消耗大量内存。这种内存需求在大规模搜索问题中可能是非常昂贵的。作为一名警官，你会想要准备一些笔记本。


