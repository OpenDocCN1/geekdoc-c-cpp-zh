    # Binary Search Trees for Suspects


    Frank limped back into his office to find Socks waiting. The young wizard sat
    in Frank’s chair, spinning idly. Frank glared until Socks realized his mistake.
    He mumbled an apology and jumped out of the chair.


    “What did you find?” Frank asked.


    Socks shrugged. “Nothing useful.”


    “Nothing?” Frank prompted.


    “None of the wizards had heard of any new leagues,” Socks added quickly. “The
    last wizarding league formed was the League of Magical Confectioners. They formed
    last year in response to the influx of subpar mints. Do you remember the grainy
    tablets served? They tasted like mint for the first few minutes but left an aftertaste
    of pine needles for the next six hours. It was like they were meant to be a prank.
    The League of Magical Confectioners fixed the mint situation, and then branched
    out into chocolates and toffees. The league has six candy shops and four carts—”


    “Nothing else?” Frank interrupted.


    Socks shook his head. “I also asked about clubs and associations,” Frank offered.
    “The only new one was the Babbageville Wizards Bowling Association, and they lasted
    less than a month. Apparently there just aren''t many wizards in Babbageville
    who like to bowl.”


    Frank sighed. He hadn''t expected much from Socks''s investigation, but the complete
    lack of news still managed to disappoint him.


    “How about you?” Socks asked.


    “Yeah,” replied Frank. “I got a new lead.”


    “Really? What is it?”


    Before Frank could answer, Officer Notation banged noisily into the office carrying
    an absurdly large stack of books. She made it to Frank’s desk and dropped the
    stack. The desk sagged under the weight.


    “All the transfer and assignment ledgers for the past year,” she panted. “Now
    you can tell me why I dragged these here?”


    “We need to find a transfer,” said Frank.


    “I figured that,” said Notation. “But if you told me which transfer, I could have
    just looked it up there.”


    “I don’t know which transfer,” explained Frank. It was half true. Even if he had
    known, he would have still asked Notation to bring all the records. He needed
    to be there during the search. He needed to make sure no one was missed.


    “Okay,” said Notation. “What are we looking for?”


    “We’ll start with any suspicious transfer between 50 and 70 days ago,” said Frank.
    Those were the approximate dates of the pages that had been torn from the ledger
    in the prison. “It’s a range search. We want to find all the transfers in a range
    of dates.”


    Notation groaned. “These requests are sorted by the original location of the requesting
    officer and then by officer name. They aren’t indexed by the date of the request.
    We’ll have to go through every request. It’ll take hours.”


    “No, it won’t,” Frank assured her. “Because we’re going to use magic.”


    Socks looked up in surprise. “Magic?” he asked. “I don’t know range search spells.”


    “You know binary search trees,” responded Frank.


    “Why bother with a tree?” asked Notation. “If we’re just doing one search?”


    Frank shrugged. “My guess is that we’ll ultimately want to do more than one search.
    If Socks builds the tree with magic—”


    “But I don’t know how to do a range search,” Socks protested.


    “Build the tree and I’ll show you.”


    “Okay—”


    “Nothing,” Frank said.


    “Oh, come off it,” Notation snapped. “Ever since the prison, you’ve been holding
    something back. Why are we looking at requests? How come you never mentioned them
    before? What did you find?”


    “As I said—”


    “I don’t buy it. You aren’t telling me something.”


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_167_0.png)


    "Got it," called Socks. "I think so, at least. We''ll see in a minute."


    Socks turned to the stack of ledgers and began muttering an incantation. He waved
    his arms dramatically but entirely unnecessarily over the paper. With a flash,
    a large binary search tree appeared in the air with each node in the tree representing
    the number of days since that transfer. The nodes hung in the air, connected by
    electric lines.


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_167_1.png)


    "Now range search,” said Frank.


    “I don’t know how to—” started Socks, but Frank waved him off. “We’ll use a modified
    depth-first search,” Frank explained. “Start at the top node, the root node, and
    explore down the tree. At each node, first check if the node itself falls into
    the range. If it does, like 55 days here, we’ll save it to our list. Otherwise,
    we ignore it.”


    “Hold on a second,” said Socks. “I’ll make the nodes in our list glow a different
    color. What about green?”


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_168_0.png)


    “Whatever,” Frank replied. “After we check the current node, we check whether
    we need to explore either child. We explore the left and right subtrees if, and
    only if, they have nodes in the correct range.”


    “Recursively?” asked Socks.


    Frank waited for Notation to jump in with one of her formal definitions, but she
    remained stubbornly. He sighed and explained, “Recursively just means we apply
    the same algorithm to sub-problems. In this case, we apply the same search to
    each child. We treat them the same way we do to the root node. Just check whether
    we need to explore the children, and if so, apply the same steps. If the current
    node’s value is less than the lower end of the range, we know everything in the
    subtree falls below our range and we can skip that subtree. Alternatively, if
    the current node’s value is greater than the lower end of our range, we will need
    to continue our search on the left child. The same logic applies to the right
    subtree. If the current node’s value is greater than the higher end of our range,
    we can skip the right subtree. Otherwise, we repeat our search on the right child.


    In this case, our range is 50 to 70, and the left child can have values up to
    55, nodes in that subtree fall within our range, so we need to explore the left
    child. The right child can have values above 55, which also overlaps our range,
    so we need to explore that as well. Start with the left child.


    Now we have 22 days," continued Frank. "We don''t put it on our list. And because
    everything in the left subtree has to be less than 22, we don''t need to explore
    that path either."


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_169_0.png)


    "We call this pruning," added Notation. "Because it''s like cutting off the branch
    of a tree."


    When Frank looked over, she scowled as she remembered she wasn''t talking to him
    and felt silent.


    "So we only explore the right child," said Frank.


    "Recursively!" added Socks with all much glee.


    “Yes, recursively,” agreed Frank dryly. “Now we get 38. Again, it doesn’t go on
    the list, and we can skip the left branch.”


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_170_0.png)


    “But we need to recursively explore the right branch,” said Socks, who was thoroughly
    enjoying the new algorithm. Frank nodded.


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_170_1.png)


    The next node had no children. It was a dead end. “Now what?” asked Socks.


    “Same thing as in a depth-first search,” said Frank. “We back- and take unexplored
    paths until we’ve searched the whole tree. In this case, we’ve already pruned
    a lot of paths, so we need to backtrack to the root.”


    The search progressed down the root’s right subtree. New matches were added to
    the result list, incompatible paths were pruned, and compatible paths were explored
    recursively.


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_171_0.png)

    ![](img/e29fc41ddce7c5429aacfb7f918a9728_171_1.png)

    ![](img/e29fc41ddce7c5429aacfb7f918a9728_171_2.png)

    ![](img/e29fc41ddce7c5429aacfb7f918a9728_171_3.png)

    ![](img/e29fc41ddce7c5429aacfb7f918a9728_172_0.png)


    By the end, they had identified a handful of transfers that fell within the target
    range. Frank studied the list intently, looking for anything suspicious.


    “Nothing,” he growled in disbelief. “There’s nothing here.”

