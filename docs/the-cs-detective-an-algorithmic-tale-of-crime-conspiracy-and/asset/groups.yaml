    He gave each of those priority of 10.


    Then he moved on to other triples of the same number. If the code had once been
    1-1-1, why not use 2-2-2? The safe houses were rarely used enough that it paid
    to keep the combinations simple. He listed 19 untried triplets, giving them priorities
    of 5. The priority queue now held 22 possibilities.


    Then he quickly ran through the birthdays of the officers responsible for the
    safe houses. That added another 6 combinations, which he assigned priorities of
    8. He added the birthdays of every other officer he could remember, dropping the
    priority to 2 for those.


    Finally he added the word RUN and assigned it priority of 1. He knew full well
    if he reached that option, it was time to give up. He would have to find another
    place to hide.


    The priority queue now held 32 options. The result was a long list of possible
    combinations to try. At the top was the highest-priority combination, 1-2-3. Frank
    tried it, but nothing happened.


    He swore and removed the combination from the priority queue. A new highest-priority
    combination popped to the top.


    Before he could try the next combination, a thought struck him. Maybe they used
    some variation of the old combination. He had known plenty of officers to use
    one combination for their locker and its reverse for their luggage. The officer
    in charge of the safe houses have done something similar here? Frank added 3-2-1
    to the bottom of his list with a priority of 9.


    Neither 1-1-2 or 1-3-5 worked, exhausted all of the priority-10 combinations.
    Frank crossed them off and added their reversed combinations, 2-1-1 and 5-3-1,
    to the bottom of the list. Again he used priority 9, figuring that a reversed
    combination would be easy for people to remember.


    He read the next-highest-priority combination, 3-2-1, from the top of the list.
    It was one of the combinations he had recently added. That was the magic of priority
    queues: no matter order you added the items, you always got the best entry next.'
