    “为什么不直接用广度优先搜索呢？”弗兰克（Frank）问，“你实际上一直在这么做。你的搜索在向外探索，离起点越来越远。”


    梅维斯点了点头。“广度优先搜索和迭代加深有很多共同点。但你忘记了一个关键点。我们丢失了地图。在没有地图的情况下，在广度优先搜索中很难追踪你未探索的状态。你如何记住你的前沿？迭代加深允许我们向外探索，而不需要显式地记住所有未探索的状态。我们只是遵循了一条深度限制的路径。


