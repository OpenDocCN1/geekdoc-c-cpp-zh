    ## Backtracking to Keep the Search Going


    The Port of Mudwall didn''t even live up to its unimpressive name. It wasn''t
    much of a port; the rickety wooden dock could fit no more than two modestly sized
    ships. The mudwall itself, in theory a 20-foot-tall earthen city wall, had never
    actually been constructed, and was only hinted at here and there with 2-foot-tall
    humps surrounding about a third of the city.


    Frank stepped over the dirt hump and made his way to the sole shop in the city,
    with Notation and Socks trailing along behind him.


    As they entered the store, the shopkeeper''s face transformed from surprise to
    outright delight with the progression of a powerful sneeze. He knocked a stack
    of carrot-themed tourist pamphlets off the counter as he hurried to greet them.


    “Hello!” he nearly shouted. “Welcome to Mudwall!”


    “Information,” said Frank.


    The shopkeeper’s face dropped. “Oh,” he said. “You’re not here for the Carrot
    Festival, then?”


    “Carrot Festival?” asked Notation.

    The shopkeeper nodded. “It’s the 50th annual Carrot Festival later this week.”


    “You get a lot of visitors for that?” she asked.


    “Not recently,” admitted the shopkeeper. “Mudwall isn’t the tourist draw that
    it used to be. Not since G’Raph started hosting his Mud Radish Festival. People
    would rather go there for the big-city atmosphere.”


    Notation and Socks looked at each other. Socks mouthed, “What’s a mud radish?”
    Notation shrugged.


    “What do you know about a ship that came through here a few days ago?” Frank asked.


    “What ship?” asked the shopkeeper. “We haven’t had a ship here in a few months.
    We’ve had a few donkey carts pass through the coastal road. But no ships.”


    “Are you sure?” asked Notation. “Because we are on an official investigation,
    and it is very important that you tell us anything you might know about all ships
    that have come through here recently.”


    “I would have known if there was a ship,” said the shopkeeper. “I have a wonderful
    view of the dock from my window. Even if I hadn’t seen it, I would have heard
    about it. We don’t get many ships days. People would’ve been all excited. For
    Carrots, our three-person marching band, usually greets each ship. I certainly
    would have heard them.”


    Notation looked as though she was preparing for a new round of questions, but
    Frank cut in first. “Thank you, sir,” he said. “We appreciate your time.”


    He herded Notation and Socks from the building and back into the muddy street.


    “Do you think he was telling the truth?” asked Notation. Frank nodded, scanning
    the street. He seemed genuinely surprised at the mention of a ship,” he said.
    “But it wouldn’t hurt to ask around a bit more.”


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_80_0.png)


    They interviewed a dozen of the town''s residents, a sample that made up approximately
    half the population, before admitting defeat. No one had seen a ship. No one had
    heard of anyone seeing a ship. And no one could even understand why a ship would
    visit. The port clearly didn’t receive much traffic.


    “Maybe it came at night,” mused Notation as they walked the dock toward the TCP
    Flyer. “They sent a small party ashore on a rowboat, handed off the documents,
    and left. Someone could have been waiting with a cart right here.” She pointed
    to an arbitrary plank on the dock, which didn’t look any more or less suspicious
    than its neighbors.


    “Maybe,” said Frank. “It doesn’t matter, though. Without a witness, there’s no
    trail.”


    “What does that mean? We can’t find them? The investigation is over?” asked Socks.


    Frank grunted a laugh. “No, kid. Dead ends are part of investigation work. That’s
    why we use a backtracking search,”


    Socks stared blankly back at Frank. When comprehension failed to dawn on the boy’s
    face, Frank added, “We keep exploring along the most promising lead.”


    “So you have other leads?” asked Socks.

    “A few,” admitted Frank. “If we hit a dead end, we return to a previous state
    and try a different option.”


    POLICE ALGORITHMS 101: BACKTRACKING

    Excerpt from Professor Drecker''s Lecture


    Almost every investigation will involve some backtracking.

    Even the best officers can''t always follow clues in a straight

    path from start to finish. The world is filled with useless

    information, ambiguous clues, and red herrings. On top of

    that, you''ll make mistakes. It''s important to know how

    to backtrack a search when you hit a dead end. Simply put,

    this means backing up your search to a previous state and

    trying a different option.

