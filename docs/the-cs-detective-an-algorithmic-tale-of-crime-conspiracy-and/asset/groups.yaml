    在货舱内散开来，在弗兰克和Notation周围形成了一个松散的圆圈。


    “女士们，先生们，”弗兰克说道，“我们的检查已经结束，看起来你们没有携带任何腐烂的鳗鱼。感谢你们的耐心，我们正努力确保这个王国食物供应的安全。我们现在该离开了。”


    作为回礼，两个体型较大的暴徒抓住了弗兰克的手臂。他们合力将他抬离地面，带他回到了甲板。多年的经验让弗兰克对这种反应早有准备，他已经出了一了一种定位技巧来尽量减少不适，但他仍然感觉到在他们强有力的握下，淤青正在形成。


    “嘿！”Notation的叫声表明她也被同样带了出去。


    当他们出现在阳光下时，弗兰克眨了眨眼睛。男人们将他带到甲板中央，把他丢在木地板上。Notation重重地落在在他身边，暴徒再次在他们周围形成了一个松散的圆圈。


    “那么计划是什么？”弗兰克问，“把我们锁起来？扔进海里？交给你们老板的雇主？”


    男人耸了耸肩。“别看我，我才在这里工作了十五天。”


    “个新手，哈？”弗兰克说。


    维尼特家族（Viniettes）对限制信息非常狂热。他们只与船上资历最深的人分享计划。新员工在晋升过程中必须证明自己的忠诚。为了获得任何有用的信息，弗兰克需要找到船上资历最高的人。


    一个计划在弗兰克的脑中开始形成。维尼特家族的船员总是按照资历顺序排列。这与导师制无关——最资级的船员担任新人的导师，并以此类推。在群体场合，他们都倾向于站在自己的导师旁边。


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_62_0.png)


    暴徒组成的圆圈无非一个被弯曲成环的排序数组。二分查找法在这里几乎可行，但必须对其进行调整以适应数据的结构：一个圆圈，而不是数值值的直线。不幸的是，这意味着弗兰克并不知道数组从哪里开始或结束。他迅速开发了一种新算法，以高效地寻找资历最高的船员。在这种情况下，效率意味着既尽可能减少需要他交谈的暴徒数量，又最大限度地在他们察觉之前获得答案的概率。


    他转向暴徒右侧的女人。“你呢？你是这这里的老兵吗？”


    “十九天了，”她说。


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_62_1.png)


    现在弗兰克认为他们有一个排序——即资历随着他逆时针绕圆圈移动而增加。但他还不能确定。尽管这种可能性很荒谬，但“十五天”和“十九天”可能分别是资历最浅和最深的暴徒。他之前在选择搜索起点时太粗心了，结果通常不妙。他需要另一个数据点。于是，他选择了剩余暴徒范围的中间。


    “你呢？”他询问“十五天”对面的一个女人。“三十七了，”暴徒回答道，“关你什么事？”


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_63_0.png)


    有了这条信息，他对逆时针排序的直觉得到了证实。因此，他排除了“十五天”和“三十七天”之前那个人之间的所有人——如果资历最深的暴徒不是“三十七天”，那么也必须在她的逆时针方向，但在“十五天”之前。


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_63_1.png)


    弗兰克克制住升起的恼意。他从未遇到过这么资历的船员。他实际上感到有些受侮辱。“这太令人尴尬了，”弗兰克对他们的捕禁者说，“我们被一群新手抓住了。你们都是什么，后备小组吗？”


    “你在做什么？”Notation低声说。


    “改进后的二分查找，”弗兰克低吼道。Notation叹了口气。“我猜到了。看起来你是在寻找资历最高的那个。你的动作并不隐蔽。但为什么？而且你怎么知道他们是按顺序站位的？”


    弗兰克忽略了她。他深吸了一气，重新专注于眼下的任务。他不知道在老板出现之前他还有多少时间。“你呢？”“这是我的第三天，”那个男人犹豫地回答道。


    “得吧！”弗兰克喊道，“真的吗？”


    “三天？你不是在接受训练之类的？”Notation问道，听起来是真的好奇。


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_64_0.png)


    弗兰克再次完善了他的范围，考虑到资历最高的人不可能是“三天”、“十五天”或其之间的任何人。


    弗兰克再次将剩余范围一分为二。“你一定是个相对老兵了，对吧？”弗兰克问。


    “呃……这是我的第一天，先生，”暴徒结结巴巴地说。当所有人的注意力都转向他时，他开始满头大汗。


    弗兰克低声咒骂了一句。

