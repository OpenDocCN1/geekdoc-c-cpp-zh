    Frank didn''t waste any time. He hurried through the shop and exited through a
    back door that led into the alley. The spy stood only 10 feet away, her back to
    Frank. As quietly as he could, Frank retreated down the alley and made his way
    to the safe house. If he was lucky and the thugs didn''t think to ask the shopkeeper
    about him, he had bought some time.


    At the safe house door, Frank fumbled with the combination lock. He spun the dial
    to 1, around to 1, and finally back to 1 again. Admitted, it was a simple code.
    The lock didn''t open.


    Frank swore. Someone must have changed the combination since he''d last been here.
    He considered try to find the combination, which might take him a long time, or
    he could find another place to hide. Unable to think of anywhere safe that that
    didn''t take him past the thugs again, he turned back to the lock.


    Since time was short, Frank needed to be efficient. The lock required three numbers,
    1–20, so he faced 8,000 possible combinations. He didn''t have time for a breadth-first
    search or a depth-first search. Instead he would have to rely on a limited-first
    search and some liberal guessing; he would have to trust his gut. He withdrew
    his priority queue from his pocket, wiped it clean, and started jotting down combinations.
    With each combination, he added a priority—how he felt it would be. He started
    with some common police combinations:


    +   1-2-3

