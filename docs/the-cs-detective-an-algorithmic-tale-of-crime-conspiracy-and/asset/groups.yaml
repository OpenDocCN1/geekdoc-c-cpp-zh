    如果目标值大于当前值，搜索将向右进行：


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_157_0.png)


    当找到目标值或到达死胡同时，搜索结束。在后一种情况下，我们可以断定目标值不在树中。


    如果二叉搜索树中每个节点的左子树和右子树节点数相同，我们称该二叉搜索树是完美平衡的。在这种情况下，每当树节点数量大约翻倍时，树的深度就会增加。


    搜索的计算成本与目标值在树中的深度成正比。树越深，我们需要进行的比较就越多。


