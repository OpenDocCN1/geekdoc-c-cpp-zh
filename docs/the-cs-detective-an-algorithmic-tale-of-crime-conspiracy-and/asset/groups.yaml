    search）和一些大胆的猜测；他必须相信自己的直觉。他从口袋里拿出优先级队列，将其擦干净，开始记录组合。对于每个组合，他都添加了一个优先级——他觉得那个组合会如何。他从一些常见的警察密码开始：


