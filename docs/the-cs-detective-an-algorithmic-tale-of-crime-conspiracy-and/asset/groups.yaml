    \ wanted to find a criminal, his search space was every person in the vicinity\
    \ of the capital.\n\nFrank sat back and rubbed his eyes. It was a big search problem,\
    \ finding a specific criminal in a city of criminals. But he had seen worse.\n\
    \nNow that he had defined the problem, he could start on an algorithm. A linear\
    \ search was out; he couldn't afford to question everyone in the city. He could\
    \ also rule out many of the other, fancier algorithms he had studied in the academy.\
    \ For a problem like this, he would have to go back to his toolkit of basic search\
    \ algorithms—the private investigator's most trusted friends.\n\nFrank made a\
    \ note on the parchment. He had the target to find, he knew the search space,\
    \ and he had his algorithm. It was time to get to work.\n\n# POLICE ALGORITHMS\
    \ 101: SEARCH PROBLEMS\nExcerpt from Professor Drecker's Lecture\n\nIn this class\
    \ we'll discuss several different algorithms (and related data structures) for\
    \ solving search problems. A search problem is defined as any problem that requires\
    \ us to find a specific value (or target) within a space of possible values (a\
    \ search space).\n\nThose of you who graduate and go on to become police officers\
    \ will find yourselves facing problems that fall into this category every single\
    \ day. This broad definition of a search problem encompasses a lot of different\
    \ computational problems, from searching the police log for a specific entry to\
    \ finding rooms within a hideout to finding all arrest records that match some\
