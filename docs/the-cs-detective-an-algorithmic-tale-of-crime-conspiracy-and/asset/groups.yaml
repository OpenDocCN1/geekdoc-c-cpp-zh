    # 警察算法 101：

    期末考试复习课

    Drecker 教授讲座节选


    如果你从这门课中只学到一件事，那应该是：高效算法的关键在于信息。在处理新问题时，花时间去理解问题的结构及其数据。问题的结构越丰富化，你利用这些信息的潜力就越大。正如你所看到的，在排序数组中查找一个值比在完全随机的数组中要容易得多。有时，你甚至可以构建辅助数据结构（如堆或倒排索引）来提供你所需的结构。无论如何，你的第一步始终应该是理解问题。


    ## 搜索终止


    凌晨 12:01，门咯吱一声开开了，一名守兵将头探进阴暗的囚室。他用手电筒缓慢地扫过房间，直到目光落在了睡眠中的囚犯身上。


    “主人？”守兵轻声叫道。


    囚犯动了动，坐起来，看着守兵。


    “主人，我——”守兵刚开口，但因一声急促的喘息而中断了。


    弗兰在监狱床上向他挥了挥手。


    守兵转身想跑，但 Notation（符号）拿着一把巨大的弩箭走进了门口。


    “我……我只是在巡逻，”守兵说道。


    弗兰咯出声笑，摇了摇头。“把手电筒。慢点，”他指示道，“我这位朋友刚从警察学院毕业，听说她在弩箭的使用上拿了最高分。”


    “实际上，我是第二，”Notation 站在门口说道。


    弗兰叹了口气。“真的吗？这是你唯一一次决定谦虚吗？”


    “抱歉。我只是想准确一点。”


    “这是威胁，Notation。你是被允许对威胁进行修饰的。”


    “抱歉，”她重复道。

    “无论如何，重点没变。她有一把弩箭，而且除了同学中的另外一个人，她比任何人都更懂使用。请把手电筒交出来。”


    守兵的眼睛在房间里环视，寻找逃生之路。发现无路后，他缓慢向前倾，将手电筒递给了弗兰。当弗兰伸手去接时，守兵身体一侧，朝他的头部挥了过去。火光在空气中嘶嘶作响。


    弗兰向左侧倾斜避开了火焰的尖端。守兵旋转准备下一次挥击，但弗兰站起身，在 Notation 从背后推守兵时，从他手中夺过了手电筒。守兵踉跄着，狼狈地摔在床上。


    弗兰摇了摇头。“显而易见的，小子，”他说，“试图用手电筒打我。执行得太糟糕了。连边都没摸着。不过，我会给你的尝试加分的，”


    守兵傻呆地回看着弗兰。


    “现在把那张愚蠢的面具摘了。我们知道是你，Socks（袜子）。”

    “袜子？那是谁？我没听过任何叫袜子的人，”守兵说道，语气完全没有说服力。


    “袜子，摘下面具，”弗兰重复道。

    守兵犹豫了一刻，手伸向脑后解开了一个搭扣。随着一阵奇怪的旋转声充斥着囚室，他的脸融化并重组成了一只精复杂的面具。随后，守兵将面具从脸上取，露出了 Socks。


    “你是怎么知道的？”Socks 问道。


    “很多小细节，”弗兰说道，“首先，你跟了我们，但直到 Vinetees 帮把我们包围时才暴露身份。他们名声凶狠，”


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_245_0.png)


    但在向囚犯炫耀时，他们并不是最聪明的帮。他们真正的威胁是意外泄露你的计划。但你的故事足够拙劣，足以令人置信。


    “不过，你在断裂电缆处的动作没那么可信。是你掉落的法杖摧毁了证据。你看起来被监狱外的大门难住了，但在你自己的生命受到危险时，立刻抓住了一个金属弱化咒。你甚至使用了加速生锈咒，那正是上次在攻击车队时用的一模一样的咒。


    “你还拒绝帮忙开监狱外的锁，直到我建议自己爬过去，”Notation 补充道，“我猜你是想在我们发现文件时在场。”


    “为什么不直接质问我呢？”Socks 问道。


    “我还不确定该问谁，”弗兰承认道。他指向 Notation，她依然站在门口拿着弩箭。“Notation 反应得快一点。她告诉我她在监狱之后就开始怀疑你，但还没有什么实锤。当我建议进行并行搜索时，这让她无法一直监控你。”


    “我老实说以为 Frank 建议并行搜索是为了让你消失一会，”Notation 承认道。


    弗兰决定永远不提那个目标是把他们两个赶走。在那个时刻，他对 Notation 的怀疑甚至超过了对 Socks。他建议并行搜索是为了让他能独自追踪那些线索。


    “我必须承认，”弗兰继续道，“你在整个监狱期间的演技相当不错。我真的以为有人伏击了你。当时，攻击者没有留下来这困扰了我，但我忽略了直觉。我本应该早点发现的。


    “但我不理解的一点是，你为什么要关门。为什么不直接‘绊倒’并掉法杖呢？”


    Socks 耸了耸肩。“门是个意外。我不是故意把我们锁在里面。我假装摔倒时，我的袖子卡在了上面。”


    “门是个意外。我不是故意把我们锁在里面。我假装摔倒时，我的袖子卡在了上面。”


    “你演得很好，”弗兰说，“但最重要的是，你知道自己就在城堡里。”


    “你演得很好，”弗兰说，“但最重要的是，你知道自己就在城堡里。”


