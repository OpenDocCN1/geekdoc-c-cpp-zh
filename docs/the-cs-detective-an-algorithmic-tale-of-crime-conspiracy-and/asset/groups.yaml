    # POLICE ALGORITHMS 101:

    ## BREADTH-FIRST SEARCH

    Excerpt from Professor Drecker’s Lecture


    Breadth-first search is an algorithm that explores search states in the order
    in which they are encountered. In other words, it always attempts to explore the
    oldest unsearched state first.


    You can visualize breadth-first search as keeping a list (or, more formally, a
    `queue`) of known but unexplored states. At each step, the algorithm picks the
    next state to explore from the front of the queue. As the algorithm discovers
    new options, it adds them to the back of the queue, to make sure all previous
    options are explored before it moves on to new options.


    It’s helpful to describe breadth-first search in terms of how it explores a graph.
    A graph is a data structure composed of individual nodes, with edges linking those
    nodes. If two nodes are connected by an edge, we say they are neighbors, which
    means you can move between those nodes. During your orientation, you studied at
    least one graph—the Kingdom Highway Map. This map represents each city as a node
    and the highways connecting them as edges. Make sure you own a good copy of that
    map. Criminals have a tendency to flee the city, and you''ll need to know which
    neighboring cities they are most likely to go.


    Searching the Kingdom Highway Map is a classic graph search problem. Our search
    states are the nodes of the graph—the cities on the map. Imagine that a crime
    has occurred in city A and it is your job to find the fleeing criminal.


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_91_0.png)


    Breadth-first search explores along an expanding frontier, checking each node
    X steps away from the initial node before proceeding to any nodes X+1 steps away.
    After you explore city A, its two neighbors, B and D, are added to the back of
    the queue. No other cities were in the queue, so B is the next city you''ll visit.


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_91_1.png)


    If each node has many neighbors, maintaining the queue of nodes to explore can
    use a large amount of memory. This memory requirement can become expensive in
    large search problems. As an officer, you''ll want to invest in a number of good
