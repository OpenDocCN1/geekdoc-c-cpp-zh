    他们总是向列表末尾添加项目，那么下一个要探索的方格可能远得令人恼。即使在空网格中，没有墙壁挡路，你可能会发现自己正徒步回到搜索空间的另一端。


    | | | | | |

    |---|---|---|---||

    | 4 | 1 | 2 | 5 |

    | 8 | 3 | 6 | |

    |   | 7 | | | |


    这正是弗兰克制定政策要避免的无用移动。

    “不，”弗兰克说，“回溯得太多了。我们在这里最好用深度优先搜索。”

    “深度优先搜索。深度优先搜索，”袜子自言自语地嘟囔着，仿佛想把这个咒语刻进记忆里。“我——我不觉得我记记得了——”

    弗兰克挥了挥手打断了他，径直地走在走廊上。

    “这个我们不需要咒语。从你穿尿布开始，我就一直在对建筑进行深度优先搜索了。”

    “那么深度优先搜索就不需要回溯了吗？”袜子问。

    “大多数搜索算法都有回溯。但深度优先搜索中的回溯更适合行走。”

    “嗯……我明白了。”

    “不，你不明白，”弗兰克直率地说，“如果你不知道算法，就问。假装自己懂算法是导致灾难的根源。我见过太多新手被糟糕的搜索害了跟头。就像像你这样的好孩子。”

    “好的。深度优先搜索是什么？”袜子问。

    “这是一个简单的算法，”弗兰克解释道，“基本上我们沿着每条路径深入探索。我们沿着一条路走，直到遇到胡同。然后我们回溯到最近一条未走的路径并尝试它。当我们找到目标时停止。”


    “在这种情况下，我们将使用顺时针顺序。每当我们有多个选择时，我们会尝试北、东、南、西——当然，会避免已经尝试过的路径。我们在每个路口都会使用相同的顺序，所以如果可以，我们会总是优先向北。但在这种情况下我们只有一个选择，所以我们从向南开始。”


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_99_0.png)


    就在弗兰克说话时，他们到达了第一个决策点。弗兰克观察了各个选项。他们是从北边来的，所以他选择了东——这是他顺序中下一个未探索的方向。在离开路口之前，他从口袋里掏出一个粉笔，在墙上画了一个小小的标记。


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_99_1.png)


    在又过了两个路口后——先向北，后向东——他们到达了第一个胡同。到目前为止，房间要么完全为空，要么只包含一个奇怪的牢室——牢室是房间内的封闭空间。由于完全缺乏其他区分特征，弗兰克在每个房间的墙上写了一个数字，并在脑中将该数字与在那里发现的不同霉菌形成联系起来。


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_100_0.png)


    “现在我们回溯到上一个房间，5号房间，那里有像马一样的霉菌，”弗兰克在他们原路返回时解释道。这次他们选择了5号房间唯一的未探索选项，向西走。不幸的是，他们立即撞到了另一个胡同——一个长着复杂的绿色和蓝色绒毛花朵图案的空房间。


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_100_1.png)


    他们回溯通过最近一个选项已耗尽的路口，直到在4号房间有了新选择。东边的选项是一个胡同，他们已经探索过北边的选项，所以这次他们向南走。


    他们冒险穿过了两个新的空房间（8和9），唯一的区别是出现了一块巨大的橙色霉菌形成的乳乳石，他们尽可能远离它。橙色霉菌并不以结构稳定性而闻名。在撞到另一个胡同后，他们发现自己一直原路回到了2号房间的第一个路口。


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_100_2.png)


    废弃监狱中的深度优先搜索 87


    “如果我们错过了了呢？”袜子用他现在标志性的忧虑语气问道，“或者我们最终陷入了循环呢？我们可能会永远困在那里！”


    弗兰克叹了一声。“听着，孩子。这不是我第一次进行深度搜索。我知道我在做什么。”


    “但是有循环。”


    “你认为我为什么要在墙上做标记？”弗兰克问，“如果我们避开已经探索过的通道，就能避免进入循环。”


    弗兰克是在一次警察算法练习中学会这门课的。在全班同学的注视下，弗兰克在树篱迷宫中绕了六圈，直到他听到另一个学生大声开玩笑道：“他又又来了。”


    他们向迷宫深处探索，顺着蜿蜒的路径，并在胡同处回溯。


