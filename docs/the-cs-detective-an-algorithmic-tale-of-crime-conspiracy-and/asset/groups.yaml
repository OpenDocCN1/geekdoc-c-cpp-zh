- md: "\nFrank wanted to find a criminal, his search space was every person in the\
    \ vicinity of the capital.\n\nFrank sat back and rubbed his eyes. It was a big\
    \ search problem, finding a specific criminal in a city of criminals. But he had\
    \ seen worse.\n\nNow that he had defined the problem, he could start on an algorithm.\
    \ A linear search was out; he couldn't afford to question everyone in the city.\
    \ He could also rule out many of the other, fancier algorithms he had studied\
    \ in the academy. For a problem like this, he would have to go back to his toolkit\
    \ of basic search algorithms—the private investigator's most trusted friends.\n\
    \nFrank made a note on the parchment. He had the target to find, he knew the search\
    \ space, and he had his algorithm. It was time to get to work.\n\n# POLICE ALGORITHMS\
    \ 101: SEARCH PROBLEMS\nExcerpt from Professor Drecker's Lecture\n\nIn this class\
    \ we'll discuss several different algorithms (and related data structures) for\
    \ solving search problems. A search problem is defined as any problem that requires\
    \ us to find a specific value (or target) within a space of possible values (a\
    \ search space).\n\nThose of you who graduate and go on to become police officers\
    \ will find yourselves facing problems that fall into this category every single\
    \ day. This broad definition of a search problem encompasses a lot of different\
    \ computational problems, from searching the police log for a specific entry to\
    \ finding rooms within a hideout to finding all arrest records that match some\
    \ criteria. This class won't be exhaustive—that would take years—but I'll give\
    \ you some examples of basic and important algorithms as we go.\n\nThe algorithms\
    \ described in this class will have three common components:\n\n- **Target**:\
    \ The piece of data you're searching for. The target can be either a specific\
    \ value or a criterion that signifies the successful completion of a search.\n\
    - **Search space**: The set of all possibilities to test for the target. For example,\
    \ the search space could be a list of values or all the nodes in a graph. A single\
    \ possibility within the search space is called a *state*.\n- **Search algorithm**:\
    \ The set of specific steps or instructions for conducting the search.\n\nSome\
    \ search problems will have additional requirements or complexities, which we'll\
    \ touch upon as we go over different algorithms.\n\n# Exhaustive Search for an\
    \ Informant\n\n\"The key to efficient algorithms is information.\" It was Professor\
    \ Drecker's mantra, barked at the cadets at the start of every Police Algorithms\
    \ class, ferociously enough to sear itself permanently into Frank's memory. \"\
    A good algorithm depends on finding the structure in the data and using it. It\
    \ depends on information.\"\n\nFrank smiled to himself at the memory as he turned\
    \ onto Three Bit Lane, a rutted dirt road lined with a combination of seedy bars\
    \ and upscale coffee shops. He nodded politely to a pair of passing knights, who\
    \ clanged as they jittered past in their armor, and made a mental note to grab\
    \ a Triple-Bold Espresso before he left. First he needed information, something\
    \ to help guide his search. He knew exactly where to start.\n\nGlass Box Billy\
    \ would be in one of the establishments by now, sitting quietly and listening\
    \ to the wisps of conversation drifting through the room. People didn't mean to\
    \ say things around Billy; they simply didn't notice he was. Billy had been blessed\
    \ with a single notable talent: utter inconspicuousness. Whatever he tried, there\
    \ was something about Billy that meant people just didn't notice him. Maybe it\
    \ was his pale skin or his small physique; maybe it was his exceptionally mundane\
    \ taste in clothing. Whatever it was, Billy had long ago decided to put his one\
    \ talent to use by eavesdropping, collecting information, and selling it to anyone\
    \ who would buy.\n\n![](img/e29fc41ddce7c5429aacfb7f918a9728_23_0.png)\n\nFrank\
    \ eyed the eight storefronts hunched together in Three Bit Lane and wondered which\
    \ Billy would have chosen. He ran through half a dozen search algorithms in his\
    \ head, but it was pointless. Frank didn’t have any information to go on. Billy\
    \ could be in any one of the bars or coffee shops.\n\nHe’d have to use an exhaustive\
    \ search—simply try all the possibilities until he found Billy. It didn’t sit\
    \ well with him. Years of the detective and private investigation game had taught\
    \ him that there was almost always a better algorithm than exhaustive search,\
