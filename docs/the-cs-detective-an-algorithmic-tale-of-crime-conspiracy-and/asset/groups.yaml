    # POLICE ALGORITHMS 101:

    ## PARALLEL ALGORITHMS


    Excerpt from Professor Drecker’s Lecture


    A parallel algorithm breaks up a problem into multiple pieces, performs the computation
    on those pieces at (approximately) the same time, and then combines the results
    when all pieces are finished. It divides up the work among different workers,
    allowing them to complete the task faster than a single worker could. Consider
    our favorite example: searching an abandoned building for a suspect. The more
    officers you have, the more rooms you can check at the same time and the faster
    you can find the suspect.


    continued


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_128_0.png)


    If you have 30 rooms and 30 officers, they can kick in all the doors at once.


    The key to an efficient parallel algorithm is to efficiently divide the work into
    independent units and then recombine it. Some problems are trivial to parallelize.
    For example, if you are searching a large stack of scrolls for a particular clue,
    you can easily divide the work by giving each worker a subset of the scrolls.


    However, other algorithms are much more difficult or even impossible to parallelize.
    Even if you have 100 officers, you can''t question any suspect any faster. It''s
    an inherently serial problem. You need to base your next question on the suspect''s
    previous answers. And, perhaps more importantly, a suspect can answer only one
    question at a time. I''ve seen eight officers shouting questions at the same time.
    The interrogation doesn''t go any faster.


    Another aspect to consider when parallelizing algorithms is whether the efficiency
    is even worth the overhead. A parallel algorithm requires additional setup time
    to divide the work, as well as completion time to merge the results back together.
    Individual tasks have to be assigned to different workers, often requiring some
    amount of communication. Consider the task of searching an unsorted array with
    only three values. By the time the setup is complete, a single person could have
    likely scanned through the array many times over.


