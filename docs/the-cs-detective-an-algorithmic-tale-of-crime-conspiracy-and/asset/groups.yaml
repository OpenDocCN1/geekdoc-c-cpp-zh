    # POLICE ALGORITHMS 101:

    FINAL EXAM REVIEW SESSION

    Excerpt from Professor Drecker''s Lecture


    If you learned only one thing from this class, it should be that the key to efficient
    algorithms is information. When approaching a new problem, take the time to understand
    the structure of the problem and its data. The more structure of the problem has,
    the more potential you have to utilize this information. As you''ve seen, finding
    a value in a sorted array is significantly easier than in a completely random
    array. Sometime you can even build auxiliary data structures, such as heaps or
    inverted indexes, to provide the structure you need. Regardless, your first step
    should always be to understand the problem.


    ## Search Termination


    At 12:01 AM, the door squeaked open and a guard poked his head into the dark prison
    cell. He scanned the room slowly with a torch, until his gaze landed on the sleeping
    prisoner.


    “Master?” called the guard softly.


    The prisoner stirred, sat up, and looked at the guard.


    “Master, I—” started the guard, but he broke off with a strangled gasp.


    Frank waved at him from the prison bed.


    The guard turned to run, but Notation stepped into the doorway holding a large
    crossbow.


    “I ... I was just doing my rounds,” said the guard.


    Frank grunted a laugh and shook his head. “Hand over the torch. Slowly,” he instructed.
    “My friend here just graduated from the police academy, and I’m told she just
    scored top marks in crossbow usage.


    “I was second, actually,” said Notation from the doorway.


    Frank sighed. “Really? This is the one time you decide to be modest?”


    “Sorry. I just wanted to be accurate.”


    “It’s a threat, Notation. You’re allowed to embellish threats.”


    “Sorry,” she repeated.

    “Anyway,” the point remains. She has a crossbow and knows how to use it better
    than all but one of her classmates. Please hand over the torch.


    The guard''s eyes darted around the room, searching for an escape. Finding none,
    he slowly leaned forward and offered the torch to Frank. As Frank reached for
    it, the guard shifted and swung it at his head. The fire hissed through the air.


    Frank leaned left to avoid the flaming tip. The guard pivoted for another swing,
    but Frank stood and plucked the torch from his hands as Notation shoved the guard
    from behind. He stumbled and fell in an awkward heap on the bed.


    Frank shook his head. “Obvious move, kid,” he said. “Trying to hit me with a torch.
    Awful execution. Didn''t even come close. I''ll give you credit for trying, though,”


    The guard blinked dumbly back at Frank.


    “Now take off that stupid mask. We know it''s you, Socks.”

    “Socks? Who is that? I''ve never heard of anyone named Socks,” said the guard,
    completely unconvincingly.


    “Socks, take off the mask,” repeated Frank.

    The guard hesitated for a moment before reaching behind his neck and undoing a
    clasp. A strange whirling sound filled the cell as his face melted and reformed
    into an elaborate mask. The guard then lowered the mask from his face to reveal
    Socks.


    “How did you know?” asked Socks.


    “Many little things,” said Frank. “First, you followed us, but didn''t reveal
    yourself until the Vinetees had us cornered. They have a fierce reputation


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_245_0.png)


    but aren’t the most clever gang when it comes to gloating to their prisoners.
    They posed the real threat of accidentally revealing your plans. But your story
    was pathetic enough to be believable.


