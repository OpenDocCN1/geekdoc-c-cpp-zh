    这种我我会努力遗忘的事情。即使我知道一些微小的细节，比如谁可能帮过物流，也不值冒这个风险——以免一醒来发现我的鞋里塞满了牛粪。


    弗兰克盯着他看，但比利已经沉默了。对于一个以分享信息为生计的人来说，比利有一个不爱说话的怪癖。“牛粪？”弗兰克问。


    比利点点头，但没有再多说什么。


    “你可没法更具体了，对吧？”弗兰克问，“我们谈论的是北牦还是南牦？”


    “这重要吗？”比利问道，“重点是，如果我知道是谁安排的交通工具，我根本不会记得它。特别是如果那些人恰好在离城五英里外的一座大农场，他们可以轻易让某人消失。如果那个农场的家族有非法活动史，而且幽默感不健康，那就更是双加严重了。不，在这种情况下，记住任何事情绝对都不利健康。”


    “太遗憾了，”弗兰克笑着说，“那也许下次吧。”他指了指硬币，“以后记住事情的动力。”


    说完，弗兰克站起身离开了“指数浓缩咖啡馆”。他向左转，继续沿着街道向上走。一旦离开“三比特街”，他就可以绕道前往克拉诺克的农场——那是唯一与比利的描述相似的农场。


    当他经过那座破旧的登记处时，他注意到一个影子闪进了附近的小巷子。他低声咒了一句，但继续前行。当然，他已经被跟踪了；上尉在访问时并不算谨慎。


    等他离开城市来到通往克拉诺克农场的崎岖土路上时，他发现自己心情不错。比利没给他多少，但即使是一点点信息也可能意味着高效搜索算法与穷举算法之间的区别。


    # 警察算法 101：穷举搜索

    德雷克教授讲座节选


    穷举搜索算法在整个搜索空间内为目标值搜索每一个可能性。最常见的穷举搜索是线性搜索，它只是按顺序检查所有不同的可能性。


    考虑一下当你追逐劫匪进入一家废弃酒店二楼走廊时发生的情况。走廊有30扇门，全部关着。如果你遵循了正确的警察程序，你的搭档已经封锁了对面的楼梯，劫匪被困在这一楼的某处。你如何找到他？你是随机选门，来来回去直到运气好吗？不！你沿着走廊搜索，一扇一扇地踢开门。


    或者考虑一种扫描数字列表（数组）以寻找目标值的算法。算法沿着列表从一个数字移动到另一个，依次检查每个值以免遗漏任何一个，并在到达目标时停止。如果我们在数组中寻找数字5，那么搜索过程如下：


    | 1 | 13 | 2 | 34 | 5 | 8 | 1 | 21 | 3 |

    |---|---|---|---|---|---|---|---|---|

    | 1 | 13 | 2 | 34 | 5 | 8 | 1 | 21 | 3 |

