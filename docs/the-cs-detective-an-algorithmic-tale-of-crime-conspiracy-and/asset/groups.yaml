    “Demise?” Notation squeaked. Rebecca nodded at the circle of henchmen, and they
    advanced, drawing an assortment of weaponry from their expensive suits like magicians
    performing elaborate acts. One man produced a three-foot-long spiked club from
    under his tie; another slide a broadsword out of her sleeve. Then, to everyone’s
    surprise, a barrel landed on the deck with a loud thwack and burst open, spraying
    eels across the planks.


    img/29fc41ddce7c5429aac7f91a728_68_png


    ## ADAPTING YOUR: BINARY SEARCH

    Excerpt from Professor Drecker’s Lecture


    Every computational problem you face is going to have a nice solution. Scholars
    have spent years studying a vast range of problems and writing up solutions. But
    in the field you’ll find new wrinkles. If you leave this class having memorized
    a sheet of algorithms, you’re soon to find yourself in trouble. In order to handle
    novel problems it is important to understand how an algorithm works and how it
    can be adapted to problems. The basic idea behind binary search—using the structure
    in the data to repeatedly halve the search space—is more important than the details
    of a particular application. You can adapt binary search to search (but still
    sorted) arrays or even determine the optimal temperature for your search until
    it’s right.


    ## Socks: An Interlude and Introduction


    Chaos erupted on the deck as the thugs danced away from the pickling juices and
    eels. A second barrel landed moment later, sending out a fresh wave. The eels,
    by the look of them, measured around four feet from end to end and threatened
    to trip and tangle everyone. A group of three thugs fell into a heap as they tried
    to escape. Frank jumped to his feet, grabbed Notation’s arm, and yanked her.


    “What’s going on?” she shouted as a third barrel sailed over their heads and hit
    the railing.


    “No idea,” said Frank. “But now is our chance. This way!” He pulled Notation toward
    the ship’s edge. Alongside the ship bobbed a small, nondescript but oddly familiar
    schooner loaded with barrels. A teenage boy, dressed in wizard’s robes, was rolling
    a new barrel onto a contraption composed of planks.


    img/29fc41ddce7c5429aac7f91a728_71_png


    “We should jump for it,” said Notation.


    “Jump,” agreed Frank, eyeing the other ship. He didn’t recognize the boy but figured
    that he must be an enemy of the thugs. Nobody in their right mind would fling
    pickled eels at them unless they were already at war. Then again, very few people
    in their right mind would choose eels as a weapon under any circumstance. Notation
    nodded, pulled herself onto the railing, and jumped without hesitation. She sailed
    through the air, clearing the gap easily, and landed on the schooner’s deck.


    Frank pulled himself up onto the railing, muttered a handful of curse words, and
    hesitated again as he balanced on the wooden beam. Then, after counting to three,
    he jumped. Frank missed the schooner by two feet and plunged into the freezing
    water. He surfaced in time to see another barrel soar overhead. He paused briefly
    to wonder if the boy was still fleeing eels or whether he had moved onto something
    else—soft cheeses, perhaps. Notation reached down and pulled him onto the ship.
    He got to his feet and began wringing out his cloak while he assessed their situation.
    The teenager was continuing his barrage. Sailors hurried around the deck, pushing
    the smaller ship away with long wooden poles.


    “Mavis?” Frank called loudly. “I know you’re somewhere.” Mavis appeared a second
    later from the hold. “He paid for the cargo,” she said, pointing at the teenager.
    “It’s up to him how he wants to unload it.”


    “I thought you couldn’t—” Mavis waved him off. “I owed the thugs one anyway,”
    she explained. “Last month they stole one of my caches—17 bushels of carrots!”
    Frank stared at her in amazement. Going against the thugs was dangerous business.
    A hundred bushels of carrots wouldn’t be close to it. “Don’t look at me like that,
    Frank,” she said. “I’m not doing this out of the goodness of my heart. It’s a
    paid contract. Simple as that. Socks made it worth my while.”


    “Socks?” asked Frank.


    “Socks?” asked Notation. Mavis motion toward the boy, then shrugged. “That’s what
    he called himself. In my business, you don’t press for real names.”


    “You didn’t ask for official identification before letting him board?” asked Notation.
    Mavis gave her a skeptical look.


    By now, Mavis’s crew had gotten the TCP Flyer turned around, and they were heading
    out to sea. Dirty sails were hoisted into the air, blocking Socks’s barrel throwing.
    He took a last long look at the deck, smiled, and—


    “What mask?” asked Frank.

