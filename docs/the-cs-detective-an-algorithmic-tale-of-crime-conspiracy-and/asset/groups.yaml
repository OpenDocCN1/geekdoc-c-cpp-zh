    # 警察算法 101：栈与队列

    Drecker 教授讲座摘要


    栈（Stack）和队列（Queue）是两种存储数据的简单结构。从上看，这两种数据结构看起来就像数值列表。然而，这两种数据结构的区别在于数据插入或移除的方式。


    栈是一种后进先出（LIFO）的数据结构，其工作方式类似于你在每个警官办公桌上都能看到的一叠纸。新元素被*推入*（push）到栈顶，元素则通过从栈顶*弹出*（pop）来移除。如果按照
    1, 2, 3, 4, 5 的顺序向空栈中推入五个元素，它们将以相反的顺序 5, 4, 3, 2, 1 被弹出。当然，一旦你那叠纸处理完了，你的队长又会给你带来一堆文书工作了。


    你可以使用数组和一个变量（用于跟踪栈顶对应的索引）来实现栈。当你向栈中推入一个新元素时，你将其添加到数组的下一个空槽中：`index = top + 1`。你还需要相应地增加
    `top` 索引。


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_112_0.png)


    当你从栈中弹出一个元素时，你可以再次使用 `top` 索引来找到正确的元素。你可以将其从数组中移除并相应地减少 `top` 索引。


    | 1 | 1 | 2 | 3 | 5 | | | | |

    | 1 | 1 | 2 | 3 | | | | | |


    当然，在向固定大小的数组添加元素时，必须小心避免越界数组末尾。


    队列是一种先进后出（FIFO）的数据结构，非常类似于等待处理的嫌疑人队伍。新元素在队列队尾入队（enqueue），元素通过从队头队（dequeue）来移除。如果按照
    1, 2, 3, 4, 5 的顺序向空队列入队五个元素，它们将按照相同的顺序 1, 2, 3, 4, 5 出队。


    队列也可以用数组实现。在这种情况下，你需要跟踪两个索引——队列中的第一个元素和最后一个元素。当你入队一个新元素时，你将其添加到当前最后一个元素之后并增加后端索引。


    | 1 | 1 | 2 | 3 | 5 | | | | |

    | 1 | 1 | 2 | 3 | 5 | 8 | | | | |


    当队列出队一个元素时，你移除队头的元素并相应地增加后端索引。


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_114_0.png)


    当你在固定数组中入队和出队元素时，数组前端会堆积出一块空空间。虽然你可以将队列设计成环形，但在入队和出队过程中，你必须小心处理索引增加到数组之外的情况。


    # — 13 —

    用于搜索的栈与队列


    弗兰克从脑海中甩掉焦黑面包的画面，回到现实状况——他被困在一个装满了即将燃烧的羊皮纸的小隔间里。火还很小，烧着纸堆边缘的散落的纸张。但一旦大叠纸完全点燃，热量将变得无法忍。


    索克斯爬到门边，靠在门上。“锁着吗？”他问。


    弗兰克咽下了半打个讽刺的回答，只是点了点头。“你能打开它吗？”他问，“这是一个旧的双销钉锁，组合应该不会很多。”


    索克斯摇了摇头。“没时间了。我知道一种可以削弱金属的咒语。”


    他取出法杖立即开始工作，低声吟念着咒语并用手抚过栅栏。锈斑在他的手下绽放，并蔓延到金属上。不到一分钟后，索克斯退后了。那扇门看起来完全生锈了，尽管仍然是金属制成的。


    “栅栏应该被显著削弱了，”他说。他退后一步，带着期待的看着弗兰克，仿佛在说：“你可以随时撞开这扇门。”


    弗兰克向后退了几步，打量着门。“有多弱？我们说的是像牙签那么弱，还是像厚木板那么弱？”


    “嗯……比普通金属弱得多，”索克斯回答道，“我加了很多锈。栅栏很厚，但我觉得它们现在应该很弱了。”


    弗兰克呻吟了一声。他深吸一口气冲了过去，压低肩膀猛地撞在门上。冲击震动了他的全身，但他撞破了。


    弗兰克四倒在地板上，一团铁锈颗粒和烟子的浑浊混合物在他上方盘旋。


    索克斯急快跑到他身边。“你还好吗？”他看向门，露出了灿烂的笑容。“成功了！”他说道，脸上洋着自豪的光芒，“它们真的很弱吗？感觉怎么样？”


    “像一英寸厚的松木一样，”弗兰克说，“非常疼。”


    笑容稍稍暗淡。“噢。”


    弗兰克撑起身来。他的肩膀在作痛，而且他会受一个严重的……


