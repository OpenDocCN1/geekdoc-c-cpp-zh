    他在脑海中过着未来几天的的时间线，心想他们是否有足够的时间。即使有三个人并行搜索，也不能保证他们能覆盖足够的区域。更糟糕的是，在 TCP 飞艇号靠岸之前，他们甚至无法开始并行搜索。在此之前，他们全都被困在了船上。


    # 警察算法 101：

    ## 并行算法


    节选自德雷克教授的讲座


    并行算法将一个问题分成多个部分，在（大约）相同的时间对这些部分进行计算，并在所有部分完成后合并结果。它将工作分配给不同的执行者，使他们能够比单个执行者更快地完成任务。考虑我们最喜爱的例子：在一个废弃的建筑中寻找嫌疑人。警察越多，你们同时能检查的房间就越多，找到嫌疑人的速度也越快。


    继续


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_128_0.png)


    如果你有 30 个房间和 30 名警察，他们可以同时踢开所有的门。


    高效并行算法的关键在于将工作高效划分为独立的单元，然后将其重新组合。有些问题很容易并行化。例如，如果你在一叠大卷轴中寻找特定的线索，你可以通过给每个执行者一子集卷轴来轻松地分配工作。


    然而，其他算法并行化要困难得多，甚至无法实现。即使你有 100 名警察，你也无法更快地审问任何嫌疑人。这本质上是一个串行问题。你需要根据嫌疑人之前的回答来提出下一个问题。而且，也许重要的是，嫌疑人一次只能回答一个问题。我见过八个警察同时大声提问。审问并不会因此更快。


    并行化算法时需要考虑的另一个方面是，这种效率是否值得这些开销。并行算法需要额外的设置时间来划分工作，以及将结果合并回来的时间。单个任务必须分配给不同的执行者，通常需要某种程度的通信。考虑在只有三个值的情况下搜索一个无序数组的任务。等设置完成，一个人可能已经对数组进行了很多次扫描了。


