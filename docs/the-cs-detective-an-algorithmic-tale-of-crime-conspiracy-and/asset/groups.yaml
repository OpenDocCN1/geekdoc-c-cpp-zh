    “弗兰克？”诺言转向弗兰克问道。

    弗兰克摇了摇头。“我只看到袜子克斯朝我飞过来。”

    “我敢打赌他很大，”袜子克斯提议道，“一个大流氓。而且他很隐行。也许是个受过训练的刺客。”

