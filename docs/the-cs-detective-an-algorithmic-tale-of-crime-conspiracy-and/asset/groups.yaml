    # POLICE ALGORITHMS 101: STACKS AND QUEUES

    Excerpt from Professor Drecker’s Lecture


    Stacks and queues are two simple structures for storing data. At first glance,
    both data structures resemble nothing more than lists of values. How these two
    data structures differ, though, is in how data is inserted or removed.


    A stack is a last-in, first-out data structure that operates much like the pile
    of papers you''ll find on every officer''s desk. New elements are *pushed* onto
    the top of the stack, and elements are removed by being *popped* off the top of
    the stack. If five elements are pushed onto an empty stack in the order 1, 2,
    3, 4, 5, they will be popped off in the reverse order, 5, 4, 3, 2, 1. Of course,
    as soon as your pile of papers is gone, your captain will just give you paperwork.


    You can implement stacks using an array and a single variable to track the index
    corresponding to the top of the stack. When you push a new element onto the stack,
    you add it to the next open slot in the array: index = top + 1. You also increment
    the top index accordingly.


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_112_0.png)


    When you pop an element off the stack, you can again use the top index to find
    the correct element. You can then remove this from the array and decrement the
    top index accordingly.


    continued'
