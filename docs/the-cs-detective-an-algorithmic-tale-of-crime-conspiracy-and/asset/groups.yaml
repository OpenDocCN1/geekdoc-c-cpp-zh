    size, the volume of paperwork was enormous. Paperwork seemed to grow quadratically
    with the size of any government organization, and the capital police station had
    more officers than any other two stations combined. Even without the stolen scrolls,
    the room was packed full.


    Luckily, the record officers kept the information well organized. As per the king''s
    regulation The Storage of Paperwork and Other Flat Work Products for Agencies
    of More Than 10 People, every document was categorized and stored by subject.
    Large portions of shelves were dedicated to such topics as arrest reports, expense
    reports, transfers, guard rotations, and noise complaints.


    The room itself was organized like a giant trie. Tries, also known as prefix tries,
    are data structures that allow efficient searches over sets of strings. Conceptually
    similar to binary search trees, tries start at a root node and branch out as they
    move down. However, tries are optimized for searching strings instead of numeric
    values. At each node, the trie splits the data based on the question “What is
    the next letter in the string?” Thus, each node in a trie can have many children,
    one for each letter in the alphabet. This structure lets you efficiently search
    for any string by following a single path down the trie, choosing the next node
    based solely on the next letter in your target string.


    Frank had once seen a demonstration of a magic trie at a wizards'' convention.
    The neon orange trie had hung in the air, storing the names of the thousand potion
    ingredients carried by that vendor. For simplicity, the trie showed only the non-empty
    branches. Customers could use the trie to quickly determine which ingredients
    were in stock. For example, they could see the vendor carried batnip by taking
    the B, A, T, N, I, and P branches. And they could quickly tell that baby powder
    was out of stock because the subtree under BA didn''t have a branch corresponding
    to B.'
