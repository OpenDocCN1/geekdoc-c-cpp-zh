    展览名为“举起P”。阿莉娜请了三位巫师，用魔法实时升起一个二叉搜索梯，根据画中描梨的数量对绘画进行分类。以梨为中心的静物在当年是一场狂热，这种现象后来被归咎于苹果产的质量糟糕。虽然不像第二年对吐司雕塑的痴迷那样尴尬，但梨热在艺术史课上仍然经常被讨论，即便在那里也只是低声地，带着厌恶的神情。七位助手每人手里拿着一幅画梨的草画，走进了画廊。他们按1到23的顺序排列。


