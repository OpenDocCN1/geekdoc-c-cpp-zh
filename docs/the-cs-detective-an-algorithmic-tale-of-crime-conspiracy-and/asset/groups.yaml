    Even as Frank spoke, they reached their first decision point. Frank surveyed the
    options. They had come from the north, so he chose east—the next unexplored direction
    in his ordering. Before leaving the intersection, he retrieved a piece of chalk
    from his pocket and made a small mark on the wall.


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_99_1.png)


    After two more intersections—turning north, then east—they reached their first
    dead end. So far the rooms had either completely empty or contained only the odd
    prison cell—the cells being enclosures within the rooms. With the complete lack
    of other distinguishing characteristics, Frank chalked a number onto a wall in
    each room and linked that number in his mind to the different mold formations
    he found there.


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_100_0.png)


    "Now we backtrack to the last room, room 5, with the mold that looked like a horse,"
    explained Frank as they retraced their steps. This time they chose the only unexplored
    option from room 5, heading west. Unfortunately, they immediately hit another
    dead end—an empty room that sported a complex floral pattern of green and blue
    fuzz.


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_100_1.png)


    They backtracked through the most recent intersection whose options had been exhausted
