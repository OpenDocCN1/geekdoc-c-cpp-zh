    “困难，确实。很多优秀的邪恶巫师都逃了或担任了具有商业价值的中立职位。然而，寻找帮助并非不可能。只能说维内提家族做出了恰当的安排。他们找到了一位愿意提供某些魔法援助的巫师，以换他们在其他领域的服务。”


    她朝梯子挥了挥手。诚然，在二叉搜索树陷阱方面，他没有卡蒂娅那样。她是一个真正的艺术家。但他的工作足够了。


    “信不信由，你几乎就下去了。你只差了一个梯子。密码是26。我们显然不想让他更改太多的梯子——足以困住任何试图重用旧密码的人。差一点点。”


