    前两条街道被证明是在浪费时间。他发现的最接近犯罪活动的情况，是一群在墙上涂涂鸦的小孩。他们用带电荷的记号笔写着“递归团队”和“递归万岁”。他继续着自己的搜寻。


    又过了几个死胡同后，正当弗兰克打算放弃时，他在泥地中发现了一条通往开放式下水道栅的足迹。他靠在墙上喘了一口气气。这定是他的逃生路线。


    弗兰克向黑暗的洞里望去，但什么也没看到。他顺着下水道栅降下去，落在一个木制平台上。他蹲下身，尽可能让自己缩得像目标一样小，扫描着这个黑暗的房间。平台固定在粗糙的石墙上，俯瞰着一个至少延伸50英尺深的房间。唯一的光线从上方的开口倾射下来，像一个巨大的聚光灯照在远处的地板上。就在他观察时，间谍穿过光圈，向对面的墙跑去。她现在已经甩在他身后了。


    弗兰克审视了自己的选择。下方还有其他平台，相隔约20英尺，由铁梯连接。当他注意到地板上嵌入的一个小黄质标签时，他大声咒骂道。他正站在一个二叉搜索梯的顶端。


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_151_0.png)


    二叉搜索梯最初是由古怪的画廊老板艾琳·布兰奇（Alena Branche）设计的，用来组织绘画。它们实际上是巨大的二叉搜索树——一种旨在实现高效搜索的数据结构。这种结构组织得像一棵巨大的倒立的树，顶部有一个平台，技术上称为*根节点*。每个平台向下分出最多两把梯子，每把梯子通向一个不同的*子节点*——下方一层的另一个平台。整个结构随着下降不断分支，提供了多种路径。


    艾琳是一个对微小细节极度狂热的人，她最初利用这种结构根据画中描绘的草的数量来组织绘画。她执行了一种简单的组织方案：当你站在任何平台上时，可以保证左梯子下方（左*子树*中）的所有画中的草数量都少于当前平台的画。而右梯子下方（右*子树*中）的所有画中的草数量更多。通过从顶部开始，你甚至可以选择下降的路径，以找到具有特定数量草叶的画。


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_152_0.png)


    遗憾的是，由于二叉搜索梯体积巨大且需要不断攀爬，这类梯子在艺术界从未真正流行起来，但它们很快被犯罪世界采纳并改进了。二叉搜索梯陷阱（艾琳作品的危险实现）是由初级法师卡蒂·拉德特费尔尔（Katia
    Laddertfell）在为维内蒂家族（Vinettees）工作期间开发的。卡蒂没有放置画，而是在每个平台上放置了一个数字标签，并创建了一个允许安全通过这棵树的数字密码。在设计树和放置标签时，她保持了二叉搜索树的特性——任何节点左子树的值始终小于节点本身，而右子树的值始终大于。在这棵新的武器化二叉搜索树中，只有一条路径是安全的，那就是通往最底部节点密码值的路径。如果你知道密码，就可以像执行该值的搜索一样下降树。在每一层，你可以将密码的值与当前平台的值进行比较，并相应地选择左或右梯。因此，维内蒂家族的暴徒只需要记忆一个密码，而不是一系列梯子选择。考虑到该组织的援助质量，这种简单性至关重要。


    如果你不知道密码并选择了错误的梯子，就会触发有时致命、有时仅是心理创伤的陷阱。典型的危险包括诅咒的梯子、毒蜘蛛、落石、飞镖枪、旋转刀片，在某些情况下还有魔法侮辱——入侵者会被五层针对其外貌、气味或普遍智力的日益恶毒观察所打击士气。


    弗兰克上一次面对维内蒂家族的二叉搜索梯时，一个线人给了他密码——数字10。这个数字让弗兰克能够不被发现地潜入藏身点，并让三个维内蒂人措手不及。只有瑞贝卡逃了。


    如果他知道这个陷阱的密码，他可能还有机会抓住间谍。


    弗兰克盯着他所站的根节点平台上的标签：50。如果他是正确的，维内蒂家族重复了密码，他需要沿着梯子搜索10。由于10小于50，他需要进入左子树。


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_153_0.png)


    弗兰克嘟囔着一串预防性的咒骂，向左梯移动并开始向下。这段旅程证明是愉快且无意外的。没有蜘蛛。没有旋转刀片。甚至连一个侮辱都没有。


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_154_0.png)


    在下一个平台上，弗兰克发现了一个标记为5的标签。由于10大于5，他知道路径在右侧。

