    # POLICE ALGORITHMS 101: BINARY SEARCH TREES

    Excerpt from Professor Drecker''s Lecture


    The range search algorithm on a binary search tree is similar to the search for
    a single value. The algorithm starts at the top node and recursively explores
    down the tree. At each node, it makes decisions based on three questions:


    - 1. Should this node be added to the results? The current value should be added
    to the results if, and only if, it falls within the range.

    - 2. Should the left subtree be explored? The algorithm should recursively explore
    the left subtree if there is a left child and the value of the current node is
    greater than the value in the range. In that case, there could be a node in the
    left subtree that falls within the range.

    - 3. Should the right subtree be explored? The algorithm should recursively explore
    the right subtree if there is a right child and the value of the current node
    is less than the largest value in the range. In that case, there could be a node
    in the right subtree that falls within the range.


    The advantage of using a binary search tree for range search is that you may be
    able to save computation by pruning out large amounts of the search space.


    Consider the following binary tree:


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_174_0.png)


    If you are searching for all values within the range [8, 20], you need to visit
    and evaluate only 7 of the 25 nodes (visited nodes are shaded):


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_174_1.png)


    Similarly, if you are searching within the range [70, 80], you need to visit and
    evaluate only 6 of the 25 nodes:


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_174_2.png)


    It''s important to note that visiting a node doesn''t necessarily mean that it
    will appear in the result list. Both of the example searches still have to visit
    nodes that fall outside the range, because those nodes'' subtrees could contain
    values within the range.


    As with a search for a single value, using a binary search tree for range search
    is efficient only if you''re conducting multiple searches. Constructing a binary
    search tree is more expensive than doing a linear scan through the data. However,
    the cost of building a tree can be spread out over many searches to make the average
    cost per search lower.


    ## Adding Suspects to the Search Tree


    Frank studied the list of transfers for a few more minutes but failed to see anything
    suspicious. None of the recent transfer destinations were even remotely close
    to the capital, where most of the thefts had been to the city of Easterville—50
    miles away—and the “Reason for Transfer” listed by the young officer''s captain
    had been “a persistent smell of feet.”


    “This is everyone?” Frank asked, turning to Notation.


    “Yes,” said Notation defensively. “This is every officer who transferred between
    stations in the last year.


    Frank frowned. The definition sounded wrong to him. It sounded incomplete. “What
    about initial transfers?” asked Frank.


    “From the academy?” asked Notation.


    “Yes,” said Frank. “What about transfers from the academy?”


    “Well,” said Notation. “Those would be probationary initial transfers. They would
    be recorded in different ledgers.”


    Frank nodded slowly. His mind raced.


    “I can get—” Notation started.


    “No need,” Frank interrupted. “I promised the captain an update by this afternoon.
    I can pick up the ledgers then.


    “You’re going to see the captain?” asked Notation, surprised.


    “Updating your clients is part of the life of a private eye,” said Frank.


    “You can also tell the captain about Gretchen’s theory,” added Socks.


    “What theory?” asked Notation, her eyes darting between Frank and Socks.


    “Frank didn’t tell you?” asked Socks.


    “No,” said Notation, through clenched teeth, “he did not.” Her hands were balled
    into fists at her side, but her face clearly said that she would very much prefer
    to use one of them to punch Frank in the nose.


    “My mentor Gretchen thinks there will be an attack on the castle tomorrow night,”
    said Socks.


    “She does?” asked Notation. Then, turning to Frank, she added, “That seems like
    a useful piece of information. Why didn’t you tell me?”


    “It’s just speculation,” replied Frank with a shrug, but he avoided his eye.


    Frank balked. He hadn’t expected that. People usually dreaded updating Donovan
    unless they could open the conversation with “Great news!” or “You’ll never guess
    what we found.” Going into his office with an update consisting of equal parts
    dead ends, unexplored leads, and life-threatening situations invited a loud and
    colorful lecture. Frank wouldn’t even be considering it if he didn’t need information
    himself.


    “I need you to follow up on something else,” said Frank after only a brief pause.
    “Parallelized search, remember?” He reached into his pocket and felt around but
    found only his notepad, a few food wrappers, and an old empty snail shell. The
    shell was a souvenir from his last case, a nasty affair involving a percussion
    band and numerous noise complaints. He pulled it from his pocket.


    “See if you can find anything about this,” he said. A shell? Notation asked. “What
    does it have to do?”


    Reluctantly, Notation took the shell. As she turned it over, she muttered, “I
    don’t know.”

