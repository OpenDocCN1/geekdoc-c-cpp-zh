    # — 4 —

    Strings and Hidden Messages


    Frank shook off Officer Notation and left through the back gate of the farm, where
    a large sign faced the road. For years the Crannocks had used this sign to broadcast
    coded messages about various illegal activities. These days it was something of
    a tourist attraction for visiting criminals—a place thugs took their younger protégés
    and gathered to reminisce about stories that invariably began “Back in my day...”


    The sign itself was An AnyText model. It held 3 arrays of letters, each letter,
    space, or punctuation mark took up a single slot in an array, meaning the board
    could hold a total of 36 individual characters—enough to advertise a whole range
    of illegal activities. Every Monday morning, one of the Crannocks would drag a
    basket of letters to the sign and individually place the appropriate character
    in each slot of the array.


    During his first week on the force, Frank’s partner had brought him out here to
    “check the board.” The message at the time—Apple picker wanted. What slugs?—sound
    innocuous enough to Frank. The Crannocks were looking for an apple picker to help
    with the harvest and were offering to get rid of people’s slugs. When he said
    this to his partner, a 20-year veteran, she laughed.'
