    # POLICE ALGORITHMS 101:

    BINARY SEARCH TREES

    Excerpt from Professor Drecker''s Lecture


    You can create binary search trees from a sorted array by recursively dividing
    the elements into smaller subsets. At each level, the middle value is chosen as
    the node at that level. If there is an even number of elements, you can use either
    of the two middle elements.


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_163_0.png)


    Once the root node has been created, both the left and right subsets will then
    independently split in the same way. Conceptually, we split the sorted array into
    left and right arrays and apply the same algorithm on each of those arrays.


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_163_1.png)


    Note that during construction, it is not actually necessary to split or copy the
    array. The algorithm can use a single array by simply tracking the indexes of
    the lowest and highest value in the current branch.


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_163_2.png)'
