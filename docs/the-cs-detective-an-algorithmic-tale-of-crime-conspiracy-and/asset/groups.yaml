    # POLICE ALGORITHMS 101: HEAPS

    Excerpt from Professor Drecker''s Lecture


    A *max heap* is a binary tree-based data structure that maintains a special ordered
    relationship between a node and its children. Specifically, a heap stores the
    elements according to the *heap property*, which for a max heap states that the
    value at any node in the tree is larger (or equal to) every element below it.
    This structure allows the max heap to efficiently support several important operations:
    (1) efficiently finding the largest element, (2) removing the largest element,
    and (3) inserting an arbitrary element. These three operations make heaps ideal
    data structures for implementing priority queues.


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_232_0.png)


    Heaps are often visualized as trees, though they''re easy to implement as arrays,
    where each element in the array corresponds to a node in the tree, with the root
    node at index 0, as shown in the following diagram. Child node indexes are defined
    relative to the indexes of their parents. Specifically, a node at index $i$ has
    children at indexes $2i + 1$ and $2i + 2$. So the node at index 1 will have a
    child at index $(2 \times 1) + 1 = 3$, and at $(2 \times 1) + 2 = 4$, as shown
    in the diagram.'
  - '[PAGE 233]


    | 0 | 1 | 2 | 3 | 4 | 5 |

    |---|---|---|---|---|--|

    | 55 | 33 | 15 | 5 | 18 | 3 |


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_233_0.png)


    Alternatively, heap implementations just skip array index 0 for simplicity. The
    root node is instead placed at index 1. In this case, a node at index $i$ has
    children at indexes $2i$ and $2i + 1$, making the index computations simpler.
    Either way, the indexing scheme allows the algorithm to compute the index of a
    child based on the parent, and a parent based on the child.


    Since the root node (the first element in the array) always corresponds to the
    maximum value in a max heap, you can always find this value in constant time (that
    is, in the same amount of time no matter how many values are in the array). This
    allows a user to efficiently look up the highest-valued item on the priority queue.


    If you want to add an element or remove the max element, the processes are more
    complicated, as they require first breaking and then restoring the heap property.


    You add a new element to the heap by first appending it to the back of the array
    (the first empty space in the bottom level of the tree). This new value might
    be larger than its parent, which would break the heap property, so you need to
    push this node up the tree until it is no longer larger than its parent and the
    heap property is restored. More formally, if the new value is larger than the
    value of its parent node,'
  - '[PAGE 234]


    you bubble it up by swapping it with its parent. For example, if we were to add
    60 to the preceding heap, we would insert it at the bottom and swap it upward
    twice, because at both levels it is larger than its parent node.


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_234_0.png)


    Removal of the max element is similar. The original max value is swapped with
    the last element of the array, making the last element the new root node.


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_234_1.png)


    Then the original max value (current last element) is deleted. We have now deleted
    the correct node, but likely broken the heap property in the process.


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_234_2.png)


    continued'
  - '[PAGE 235]


    Starting at the new root node, we walk that node down the tree in order to restore
    the heap property. At each level we compare that node’s value to both its children.
    If it is smaller than either of its children, we move the new root node downward
    to restore the heap property by swapping places with the larger of its two children.
    The downward swaps terminate when there are no larger children.


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_235_0.png)


    Both insertion of new elements and deletion of the maximum element require us
    to walk at most one path between the top and bottom of the tree. Since we can
    approximately double the number of nodes in a heap while adding only a single
    level of new nodes to the bottom, the operations can be fast even for large heaps.
    Specifically, we can double the number of nodes and add only one additional step
    to both of these operations! Furthermore, both operations guarantee that the tree
    remains balanced, so future operations will be efficient.'
