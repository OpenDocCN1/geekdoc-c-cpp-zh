    “我总是这么做的，”弗兰回答道。他正要站起来，但停顿了一下。

    “还有一个问题。你知道 Notation 是怎么知道 ArrayCart 的吗？”

    “我不知道，”上官说，此时目光越过弗兰看向别，“我们为什么不去问问她呢？看起来她现在正站在我的办公室外。”


    # 警用算法 101：最佳优先搜索

    Drecker 教授讲义节选


    如果你从这门课中只记住一个算法，那应该是**最佳优先搜索（best-first search）**。这个算法将成为你在警局最强大的工具。在每一个案件中你都会需要它。而且，它终将是终极手段。


    最佳优先搜索是一种根据分数或评分函数来选择下一个探索状态的算法。每个新发现的搜索状态都会被赋予一个分数，分数对应于算法认为该状态的好坏程度。例如，你可以根据包含目标值的概率（如果你能估算出来的话）或调查中线索的质量来对状态进行标记。在每一步中，算法都会选择探索分数最高的状态。你可以将最佳优先搜索的操作想象为维护一个待尝试状态的排序列表。


    最佳优先搜索也可以用于最小化与每个状态相关的成本，例如该状态到终点的估计距离。在这种情况下，算法会选择使成本最小的下一个状态。


    考虑一个非常简单的迷宫，你已知起点和终点的坐标。你可以为搜索空间中的每个


    状态标记一个成本，该成本等于该状态到终点的距离。


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_203_0.png)


    例如，你可以使用哈曼距离——到目标的总垂直距离加上到目标的总水平距离。这个标签并不一定意味着这个状态能带你到达那里，但它确实为搜索算法提供了一个信号。


    # 开始


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_204_0.png)


    随着搜索的进行，它将探索不同的状态（用阴影圆表示），找到新的未探索状态，并将这些未探索状态添加到待尝试状态列表中（用虚线圈圈）。在每次迭代中，搜索都会根据分数或成本选择最佳的未探索状态。在这个例子中，这意味着选择成本最小的状态。


    # 开始


    # 开始


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_204_1.png)


    结束


    结束


    继续


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_205_0.png)


    一旦我们找到终点状态，就可以终止搜索。在这个例子中，我们只需要探索略多于一半的状态。例如，我们从未选择过探索距离为 4 的第二个状态，因为我们总有更好的选择先尝试。


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_205_1.png)


    当你在外执行时，必须决定如何确定线索的优先级。根据案件的不同，你可能想从最出新的线索或最具体的信息开始。无论如何，你都应该始终优先考虑你的搜索。


    # — 24 —


    # 调查中的优先级队列


    “多纳万上官，”Notation 走进办公室时脱口而出。

    “我想就我在工作时间之外进行未经授权的调查向你诚恳道歉。但这是我的调查——和弗兰的调查一样，而且如果他正在汇报——”


    “Notation 警官，这到底是怎么变成你的调查的？”上官打断道，“我以为我分配给你的是那个假冒悠悠球案。你为什么会在克拉诺克的农场调查被盗窃的文件件呢？”


    “我当时在追溯一条线索——”Notation 开始说道。


    “你在追溯一条线索？”上官打断道，“在你的任何报告中我都没有看到任何关于 ArrayCart 的事情。”


    “那是那天早上让我想到的，”Notation 解释道。


    “你决定追溯这条线索，而不是向负责的侦探汇报？”弗兰皱了皱眉。上官痴迷于遵循调查的规程。“那是那天早上让我想到的，”Notation 再次解释道。


    “你决定追溯这条线索，而不是向负责的侦探汇报？”弗兰皱了皱眉。上官痴迷于遵循调查的规程。“在上官的个人违规名单上，未报告线索的排名在使用数据结构之上。从 Notation
    的表情中，他能看出她在想同样的事情。”


    “我当时已经在农场附近了，”她说，“而且——”

    “线索是什么？”弗兰问。Notation 惊讶地转向他，也许是震惊于他竟然忘记了她在那儿。“我想起了失案当晚的一些事，”她说，“我正刚写完夜间报告时，看到看到窗外有一辆奇怪的推车。我当时没觉得什么，因为优先级队列总是使用奇怪的推车。我以为那是一个死胡同。”她转向上官，眼中充满恳求。“那看起来机会很小，”她解释道，“在知道更多情况之前，我不想汇报它。”


    “然后你加入了了几天的调查，”上官说。

    “我们发现了一些很有前景的线索，”Notation 说道。

    “Notation 警官，”上官严厉地说，“我不在乎你是否被一个前警察误导了。程序的存在是有理由的。你没有遵守它们。”

    Notation 缩了缩，但没有抗议。“我明白了，先生。”

    “不，”上官说，“我不确定你是否明白了。但你会有充足的时间考虑这件事的。在接到进一步通知之前，你负责值班。”


    上官转向弗兰，结束了会议。当她转身离开时，Notation 的眼睛盯着墙上挂着的腓德里克国王肖像。她似乎陷入了片刻的沉思。“上官，”她突然说道，“你有优先级队列吗？”弗兰花了一点时间才联系起关系，但最终想起来了。他的其中一个教授在课上滔滔不绝地讲过腓德里克国王是如何普及优先级队列的。


    img/e29fc41ddce7c5429aacfb7f918a9728_208_0.png)


    在成为国王之前，腓德里克举行接见来听取王国公民的诉求和担忧。由于行程紧凑且公民投诉众多，他被迫开发了一种优先级排序方案。一个国王只能预期处理这么多投诉。首先，腓德里克尝试了投诉栈，处理最近的投诉，但后来错过了最重要的。然后他尝试了投诉队列，处理最旧的投诉，但又错过了。最后，他采用了一种新的数据结构——优先级队列——允许他首先处理最重要的投诉。


    “优先级队列？”上官问，显然被这个突然的问题搞懵了。几乎没人敢在上官的讲座中发言。


    “数据结构，”Notation 解释道，显然处于自动驾驶状态，“它们像普通的队列一样：你可以入队和出队。但它们要求每个元素都有优先级分数——衡量重要性的标准。当你弹出一个元素时，优先级队列总是给你下一个最重要的元素。”


    看到上官和弗兰一脸空白，Notation 继续举例。“如果我插入了四个优先级分别为 1,2,4,3 的元素，我会按照 4,3,2,1 的顺序提取它们。”


    “我知道优先级队列，”上官说，“我们用它们来存储投诉列表。噪音越大优先级越高，我们总是处理最严重的情况。我听它们也被用于处理沼泽附近的小投诉。尽管那里的一切似乎都有同高的优先级——难以忍受。但你想表达什么？”


    “你有吗？”Notation 问。


    上官摇了摇头，困制着他的愤怒。“没有多余的，”他说，“我们已经用了所有的优先级队列——一个用于噪音投诉，三个用于不同类型的犯罪，一个用于通缉名单，一个用于休假申请。为什么？”


    “最佳优先搜索，”Notation 说。


    “最佳优先搜索？”上官问。弗兰告诉我他已经在使用最佳优先搜索了。


    “没错，”弗兰确认道。


    “优先级队列会让它更高效，”Notation 解释道，“每当我们发现新线索时，都可以将其放入优先级队列，并附上表示该线索质量的分数。然后，当我们准备探索下一个线索时，从优先级队列中取出。我们总能得到下一个最好的线索。”


    弗兰叹了口气摇了摇头。他非常了解上官，知道这将如何发展。上官擅长他自己的教学时刻。他不会大吼或咒骂，而是会冷静地引导一名新警官意识到自己的愚蠢。“你是怎么做的？”上官用耐心的语气问道。这看起来不会有好好结果。


    “我把线索记在笔记本里，”Notation 回答道，“每当我们准备探索新线索时，我都会扫描整个线索列表找到最好的那个。”


