  mdcn: "\n\n“他们正和魔法师指数（Exponentious）有关：追随者、同犯，或者也许只是仰慕者，”弗兰克解释道。\n\n“指数！”Notation惊呼道，“那个邪恶的魔法师？他不是因为试图摧毁整个王国而在入狱了吗？”\n\
    \n“没错，就是他——那个非常坏的魔法师。我没提到过他是袜子（Socks）打算救援的人吗？”弗兰克问道。\n\nNotation瞪着他。\n\n“你误会了，”袜子说道，“王国不会沦为废墟。它会被拯救的。一旦指数执掌权力，我们将见证一个新的黄金时代。他——”\n\
    \n“他疯了，”弗兰克打断道，“他会毁掉王国的。”\n\nNotation在旁边赞同地点了点头。“关于这一点，我同意弗兰克的观点。”\n\n袜子的眼中闪烁着愤怒。他跳了起来，甩开斗篷。他挥动着法杖，开始吟唱一段长长的咒语，法杖划出一个复杂的复杂的旋转。袜子将法杖直接指向弗兰克并完成了咒语。\n\
    \n弗兰克冷静地看着，什么也没有发生。Notation翻了个白眼。\n\n“结束了吗？”弗兰克问，“你得知道魔法在这里不起作用的。”\n\n“是 own，我只是——”袜子开始说，挫败地瘫了。他突然停住，冲向门口。在Notation来得发射之前，袜子挥动法杖击向弩。她躲开了攻击范围并重新定位，对这种可怜的逃脱尝试略显失望。与此同时，弗兰克抓住了袜子的袍子并将他拉停。这小孩子在挣扎挣脱时手臂像风扇一样挥动。\n\
    \n弗兰克哼了一声，用力拽袍子，袜子踉跄着跌回牢房，倒地捡起掉落的法杖。它对魔法没用，但仍然能肿起一个大包包。然后他大步走了出去。他一离开，Notation就砰关上了门。\n\
    \n## 结语\n\n当弗兰克从长官办公室出来时，Notation正在走廊里等着。“怎么样？”在他关上门的一瞬间就问道。\n\n“还可以，”弗兰克说，“他没叫闹，我又拿到了办公室三个月的租金。”他举起一小袋硬币。\n\
    \n“就这些？”Notation问道，“你预期什么？”弗兰克问道，“表扬？他们不给私家侦探表扬。但我听你获得了一个表扬，还升职了。做得好，Notation侦探。这是一个很大的跨越。”\n\
    \nNotation脸红了。“谢谢，”她说，“但你呢？我以为你……也许……”\n\n“你以为长官会请我回来的，”弗兰克补充道。“事实上，他告诉我是你推荐的。”\n\
    \nNotation的脸变得通红。“你是个很干练的侦探，”她说。\n\n弗兰克笑了起来。“他没给我提供工作。”看到Notation脸上的表情，他补充道，“别介意。他永远不会再给我警队的名额了。长官和我我有很长的历史，比一个案件能抹去的要得多。总之，私家侦探的生活更适合我。”\n\
    \n“所以你就直接回去……”\n“去寻找某人丢失的龙吗？”\n“是的，”Notation说，“就是那样。”\n\n事实上，我获得了一个新的机会。在她变得太兴奋之前，他举手止住了她，并补充道，“作为一个独立承包商。”\n\
    “是什么？”Notation问道。\n“看来外面有一个魔法师联盟，试图释放指数并接管王国。”\nNotation笑了。“我熟悉他们。我似乎记得我最近帮助逮捕了他们其中一个比较活跃的成员。”\n\
    \n“他们其中一个比较活跃的成员，是的，而且是忠诚的成员。但他可能也是那些能力较弱的成员之一。安公主担心袜子的越狱尝试会激励联盟中一些更资深、更有能力的成员。”\n\
    \n“所以你正在调查‘不必要复杂联盟’（League of Unnecessary Complexity）？当然，是以独立承包商的身份。”\n\n弗兰克点了点头。“这是一个棘手的搜索问题——找到一个秘密邪恶组织的所有成员。但恰巧搜索问题正是我的专长。”\n\
