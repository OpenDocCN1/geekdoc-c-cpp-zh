    “胡萝卜节？”诺塔问。

    店主点头。“本周晚些时候是第50届年度胡萝卜节。”


    “这能吸引很多游客吗？”她问。


    “最近没有，”店主承认道，“泥墙不再像以前那样有吸引力了。自从格拉夫（G’Raph）开始举办他的泥萝卜节（Mud Radish Festival）之后。人们更愿意去那里感受大城市的氛围。”


    诺塔和袜子克斯互相看了。袜子克斯口型道：“泥萝卜是什么？”诺塔耸了耸肩。


    “对几天前经过这里的一艘船了解什么？”弗兰克问。


    “什么船？”店主问，“我们好几个月没见过船进这里了。有几辆驴车经过过沿海公路。但没有船。”


    “你确定吗？”诺塔问，“因为我们正在进行一项官方调查，你告诉我们任何关于最近进过这里的所有船只的信息都非常重要。”


    “如果有船，我会知道的，”店主说，“从我的窗户可以看到码头的极佳视野。即使我没看到，我也会听说的。我们没有很多船只的日子。人们本该很兴奋的。我们三个人的胡萝卜行进乐队通常会迎接每一艘船。我肯定会听到他们的声音。”


    诺塔看起来正准备进行新一轮的提问，但弗兰克先插了话。“谢谢你，先生，”他说，“感谢您的抽空。”


    他领着诺塔和袜子克斯离开建筑，回到泥泞的街道上。


    “你觉得他说的是实话吗？”诺塔问。弗兰克点头，扫视着街道。在提到船时，他似乎是发心地感到惊讶，”他说，“但再多向周围问问问也没什么坏处。”


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_80_0.png)


    他们采访了镇上的十几名居民，样本大约占总人口的一半，最后才承认放弃。没有人见过船。也没有人听说有人见过船。而且没有人能理解为什么会有船造访这里。这个港口显然流量并不大。


    “也许它们是晚上来的，”诺塔在他们沿着码头走向TCP飞行号（TCP Flyer）时沉思道，“它们派了一小拨人上岸，交了文件，然后离开了。有人可能就在这里等着。”她指着码头上随机的一块木板，那块木板和周围的看起来没什么特别的。


    “也许吧，”弗兰克说，“但不重要。没有证人，就没有线索。”


    “这意味着什么？我们找不到他们？调查结束了吗？”袜子克斯问。


    弗兰克冷笑一声。“不，孩子，死胡同是调查工作的一部分。这就是为什么我们使用回溯搜索，”

