    Once again, we find our suspect hiding in city H— although this time we travel
    a different path during our search.


    As with breadth-first search, we avoid exploring nodes more than once by keeping
    track of previously visited nodes. This check is particularly important if you
    want to avoid falling into endless loops, checking the same nodes over and over
    again. In the above example, we avoid adding previously seen nodes (either explored
    or unexplored) to our list altogether.


    # — 12 —

    ## Cafeteria Stacks and Queues


    Frank pushed himself into a crouch and hurried to the door. Heged and pulled,
    rattling and thumping the door against its lock. He grasped the rusted iron bars
    and threw his full weight into the effort, but succeeded only in producing louder
    clanking sounds.


    Frank turned to Socks, hoping the young wizard knew a bar-bending spell. Given
    the circumstances, he felt confident that Socks would even consent to using a
    lock-picking spell. But as Frank’s eye caught the smoldering stacks of parchment
    and the trails of smoke wisping to the ceiling, he froze. An image of a smoke-filled
    kitchen flashed across his mind, dredging up forgotten memories of his first year
    in the academy. He could almost hear the cook shouting. Frank shut his eyes hard,
    trying to force the memory away.


    During his first two months at the academy, Frank had balanced his classes with
    a work-study job in the school cafeteria. The job wasn''t anything glamorous;
    they didn''t let new arrivals wash dishes, let alone prepare the food. Instead,
    Frank spent 15 hours a week transporting loads of clean trays, plates, and cutlery
    from the kitchen to the appropriate locations in the cafeteria.


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_107_0.png)


    Despite the tedious nature of the work, Frank found himself enjoying it. “Look
    at me! I''m undoing your work. I''m the anti-busboy,” he would shout to the trio
    of busboys clearing tables and filling bins with dirty dishes. Unsuccessfully
    tried to break the school record for the most number of dishes transported in
    two minutes. He created an entirely new cafeteria game called Fling the Spoon.
    But it wasn''t until a fortuitous run-in with Professor Heappens that he actually
    learned something from the job.


    “Ugh. There are some data structures that just don''t belong in the cafeteria,”
    Professor Heappens muttered loudly as he studied the food options.


    At 2:30 in the afternoon, the lunch rush had vanished, and Frank was hard at transporting
    a load of bowls to the soup station. Though the comment wasn''t directed at him,
    he found himself asking the professor, “What data structures?”


    “Stacks,” Professor Heappens said, looking up at Frank. “Stacks almost never belong
    in a cafeteria.”


    “Sure they do,” Frank replied with the level of certainty that only new students
    and the truly ignorant can muster. He nodded down at the stack of bowls he was
    carrying. “Stacks of bowls. Stacks of plates. Stacks of pancakes.”


    Professor Heappens made a dismissive gesture and started walking away. “What do
    you know about data structures anyway?”


    “How else are you supposed to arrange plates?” Frank asked. “If you laid them
    out end to end, they would take too much room.”


    The professor stopped and stared at Frank with an expression of profound concern.
    After nearly a minute, he asked, “Do you know the difference between a stack and
    a queue?”


    Frank shook his head. He hadn''t taken Polite Data Structures yet. “A stack is
    a last-in, first-out data structure,” explained the professor. “It has two operations.
    You can push something onto the top of the stack. Or you can pop something off
    the top of the stack.”


    He gestured at the stack of plates waiting at the front of the line. “It''s just
    like the stack of plates over there. You can push a plate onto the stack.”


    He placed his empty plate on top of the stack.


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_108_0.png)


    “Or you can pop a plate off the top.” He grabbed his plate.


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_108_1.png)


    And whenever you pop something off a stack, you get the newest item on the stack.
    The oldest item will stay at the bottom of the stack until you have popped off
    everything above it.


    “So?” Frank asked. “What’s wrong with that?”


    Frank tried to recall the last time he had seen the stack empty, but couldn''t
    even conjure the image.


    "Five years!” shouted Professor Heappens. “I know, because I marked it. For five
    years that bottom plate has sat unused, while students like yourself dump other
    clean plates on top. It sits there collecting dust around the edges.


    Frank glanced over the large wooden bowl of mashed potatoes. A cook was in the
    process of refilling it. He held a large pot in one hand and was gleefully ladling
    fresh mashed potatoes into the bowl. It took a moment for Frank to realize the
    older food was simply being buried. His stomach turned.


    "How long?” he croaked, not really wanting to know the answer. “Don''t worry.
    They wash out the serving bowl at least once a week, so the old mashed potatoes
    are less than a week old.


    Frank didn''t feel reassured. He felt rather ill. A quick scan of the cafeteria
    showed the last-in, first-out pattern everywhere. He stopped when he reached the
    vats of salad dressing, his stomach roiling with a mixture of nausea and panic.


    "What can we do?” he asked.


    "Queues,” responded the professor. Queues were practically designed for cafeterias.


    "Queues?” asked Frank.


    "First-in, first-out data structures,” explained Professor Heappens. Like stacks,
    they also store things and have two operations. You can enqueue something by adding
    it to the back of the queue. Or you can dequeue something by taking it from the
    front. That way, you are always taking out the oldest item.


    Frank tried to picture always taking the bottom plate from a stack. “But how?”


    “That’s just how the data structure works. Look at the sandwich line; it’s a queue.
    Right now it has four people in it, and the person at the front has been waiting
    the longest.”


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_110_0.png)


    Even as Professor Heappens said that, another person joined the line. “See, they
    enqueue at the back!” he noted.


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_110_1.png)


    “And dequeue at the front,” said the professor happily. “What this cafeteria needs
    is more queues. Every cafeteria needs queues.”

