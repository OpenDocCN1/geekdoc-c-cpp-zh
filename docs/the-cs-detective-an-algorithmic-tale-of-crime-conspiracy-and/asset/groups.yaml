    What if you had just used depth-first search?”


    “We would have gone down a long dead end and run out of coffee,” she replied.
    “Didn’t I start by telling you it saved my life?”


    “Fair enough. But that’s a matter of luck. The nearest supply-station could have
    been down a depth-first search of length five.”


    “Ha! You know better than that, Frank. You can always find lucky or unlucky problems.
    Iterative deepening can help you hedge against really unlucky cases. It bounds
    how far away you can go on any iteration.”


    “Other algorithms do that too,” he countered.


    Mavis scowled. “I didn’t say iterative deepening was the only algorithm that could
    have saved us. I said it was the one we used. And I have used it ever since.”


    Once I even used it to track down an angry shoal of squid before they inked the
    capital’s harbor. Oh, it would have been a grand mess. Some days I wonder if I
    should have just let them do it. The king’s reaction would have been priceless.


    Frank thought for a long while, wondering if iterative deepening could have saved
    him here. By cutting off the search sooner, he could have backtracked and followed
    up on the threads of the mysterious league. But then he wouldn''t have been following
    the highest-priority lead.


    He shook his head. “I’ll stick with my usual searches,” he said finally.


    Mavis nodded solemnly and looked over the ocean. “Fair enough, Frank. But be careful,
    you don’t have much time and long dead ends can be costly. With any algorithm,
    you should at least think about how to protect yourself from running into the
    worst-case problems.”


    # POLICE ALGORITHMS 101: ITERATIVE DEEPENING


    Excerpt from Professor Drecker''s Lecture


    Iterative deepening is a modification of depth-first search that repeatedly performs
    limited depth-first searches. During iteration (or round) $k$ of iterative deepening,
    the algorithm performs a depth-limited search with $max-depth = k$.

    Consider again the example of searching for a suspect starting from city A.


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_138_0.png)


    We start with a depth-first search but cut it off after the first node, A. This
    corresponds to limiting ourselves to searching just the scene of the crime.


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_138_1.png)


    The next iteration restarts the depth-first search but allows it to explore one
    city away. We cover the close cities, visiting A, B, and D.


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_139_0.png)


    The next iteration restarts the depth-first search but allows it to explore one
    city away. We cover the close cities, visiting A, B, and D.


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_139_1.png)


    The next iteration restarts the depth-first search but allows it to explore one
    city away. We cover the close cities, visiting A, B, and D.


    While iterative deepening increases computational cost, it has advantages. It
    combines the memory efficiency of depth-first search with the completeness of
    breadth-first search.


    # Inverted Indexes


    And it is true that the table of contents provides an index into books’ subjects.
    But the table of contents is organized all wrong for this type of search. It lists
    topics by the order in which they occur. That’s a fine ordering if you want to
    know what comes next.

