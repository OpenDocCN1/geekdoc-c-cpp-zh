    "One more question. Do you know how Notation knew about the ArrayCart?"

    "I don''t," said the captain, now looking past Frank. "Why don''t we ask her?
    It looks like she''s standing outside my office at this very moment."


    # POLICE ALGORITHMS 101: BEST-FIRST SEARCH

    Excerpt from Professor Drecker''s Lecture


    If you remember only one algorithm from this course, it should be best-first search.
    This algorithm will be your best tool on the force. You will need it on every
    case. And, of course, it will be the final.


    Best-first search is an algorithm that chooses the next state to explore based
    on a score or score function. Each newly discovered search state is given a score
    that corresponds to how good the algorithm believes it to be. For example, you
    might label states by their probability of containing the target value (if you
    can estimate it) or or the quality of a lead in an investigation. At each step,
    the algorithm chooses to explore the state with the highest score. You can visualize
    the operation of best-first search as keeping a sorted list of states to try next.


    Best-first search can also be used to minimize the costs associated with each
    state, such as the estimated distance of the state to the goal. In this case,
    the algorithm chooses the next state by which one most minimizes the cost.


    Consider a very simple maze where you know the coordinates of the start and the
    goal locations. You can label each


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_203_0.png)


    state in the search space with a cost equal to the distance from that state to
    the goal. For example, you could use the Manhattan distance—the total vertical
    distance to the goal plus the total horizontal distance to the goal. This label
    doesn''t necessarily mean that this state will get you there, but it does provide
    a signal for the search algorithm.


    # Start


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_204_0.png)


    As the search progresses, it will explore different states (shown as shaded circles),
    find new unexplored states, and add the unexplored states to the list of states
    to try (enclosed in dashed circles). In each iteration, the search selects the
    best unexplored state according to the score or cost. In this example, this means
    selecting the state with the smallest cost.


    # Start


    # Start


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_204_1.png)


    End


    End


    continued


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_205_0.png)


    We can terminate the search as soon as we find the end state. In this example,
    we only need to explore a little over half the states. For example, we never chose
    to explore the second state of distance 4, because we always had a better option
    to try first.


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_205_1.png)


    When you''re in the field, you''ll have to determine how to prioritize leads.
    Depending on the case, you might want to start with the freshest leads or the
    most concrete information. Regardless, you should always be prioritizing your
    search.


    # — 24 —


    # Priority Queues for Investigations


    Captain Donavan,” Notation blurted as she came into the office.

    “I’d like to personally apologize for conducting an unauthorized investigation
    outside of working hours. But this is my investigation-as much as Frank’s, and
    if he’s briefing—


    “And how exactly did it become your investigation, Officer Notation?” interrupted
    the captain. “I thought I had assigned you to the counterfeit yo-yo-case. Why
    were you at Crannock’s farm investigating stolen papers?”


    “I was following a lead—” started Notation.


    “You were following a lead?” interrupted the captain. “I didn’t see thing about
    an ArrayCart in any of your reports.”


    “It occurred to me that morning,” explained Notation.


    “You decided to pursue this lead instead of reporting it to the detective in charge?”
    Frank winced. The captain was obsessed with following protocol for an investigation.
    “It occurred to me that morning,” explained Notation.


    “You decided to pursue this lead instead of reporting it to the detective in charge?”
    Frank winced. The captain was obsessed with following protocol for an investigation.
    “On the captain’s personal list of violations, the failure to report a lead ranked
    somewhere above the use of data structures. From Notation’s expression, he could
    tell she was thinking the same thing.


    “I was already near the farm,” she said. “And—”

    “What was the lead?” asked Frank. Notation turned to him in surprise, either shocked
    that he''d simply forgotten that she was there. “I remembered something from the
    night of the theft,” she said. “I just finished my nightly report when I saw an
    odd cart out the window. I didn’t think anything of it, because the priority queues
    are always using strange carts. I figured it was a dead end.” She turned to the
    captain, her eyes pleading. “It seemed like such a long shot,” she explained.
    “I didn’t want to report it until I knew more.”


    “And then you joined the investigation for almost days,” said the captain.

    “We found some promising leads,” offered Notation.

    “Officer Notation,” the captain snapped. “I didn’t care if you were led astray
    by a former police. Procedures exist for a reason. You didn’t follow them.”

    Notation shuddered, but didn’t protest. “I understand, sir.”

    “No,” said the captain. “I’m not sure you do. But you’ll have plenty of time to
    think about it. You’re on desk duty until further notice.”


    The captain turned to Frank, he said, ending the meeting. As she turned to leave,
    Notation''s eyes fixed on the portrait of King Frederick hanging on the wall.
    She seemed lost in thought for a moment. “Captain,” she said suddenly. “Do you
    have any priority queues?” Frank took a moment to make the connection, but finally
    remembered. One of his professors had droned on in class about how King Frederick
    popularized priority queues.


    img/e29fc41ddce7c5429aacfb7f918a9728_208_0.png)


    Before he became king, Frederick held audience to hear the complaints and concerns
    of the kingdom''s citizens. Due to his tight schedule and the abundance of the
    citizenry''s complaints, he had been forced to develop a prioritization scheme.
    A prince could only be expected to endure so many complaints at a time.


    First Frederick had tried a complaint stack, hearing the most recent complaints,
    but then he missed older complaints. Then he tried a complaint queue, hearing
    the oldest complaints, but then he missed recent complaints. Finally, he employed
    a new data structure—the priority queue—which allowed him to hear the most important
    complaints first.


    “Priority queues?” asked the captain, clearly thrown off by the sudden question.
    Almost nobody dared speak following a lecture from the captain. They simply shuffled
    out of the office or, in some cases, spent the next few hours huddled in a dark
    broom closet.


    “Data structures,” explained Notation, apparently on autopilot. “They’re like
    regular queues: you enqueue and dequeue items. But they also require each item
    to have a priority score—a measure of importance. When you dequeue an item, the
    priority queue always gives you the next most important item.”


    Seeing blank stares from both the captain and Frank, Notation pressed on with
    an example. “If I inserted four items, with priorities 1, 2, 4, and 3, I would
    extract them in the order 4, 3, 2, 1.”


    “I know what priority queues are,” said the captain. “We use them for storing
    the list of noise complaints. The louder noises get higher priority, so we are
    always addressing the worst cases first. I heard they use them for small complaints
    near the sewage marshes as well. Although it seems like everything there would
    have an equally high priority—unbearable. But what''s your point?”


    “Do you have any?” Notation asked.


    The captain shook his head, confusion still keeping his anger in check. “None
    to spare,” he said. “We’re using all of the priority queues we have—one for noise
    complaints, three for different types of crimes, one for the most wanted list,
    and one for vacation requests. Why?”


    “Best-first search,” said Notation.


    “Best-first search?” asked the Captain. Frank told me that he was already using
    best-first search.


    “That’s right,” confirmed Frank.


    “A priority queue would make it more efficient,” explained Notation. “Each time
    we find a new lead, we could put it into the priority queue with a score indicating
    how good a lead is. Then, when we’re ready to explore the next lead, we take one
    off the priority queue. We’ll always get the next best lead.


    Frank sighed and shook his head. He knew the captain well enough to see how this
    was going to go. The captain excelled at his own brand of teaching moments. He
    wouldn’t yell or curse, but would calmly lead a new officer into realizing their
    own stupidity. “How were you doing it?” asked the captain in a patient tone. This
    was not going to end well.


    “I keep the leads in a notebook,” responded Notation. Each time we’re ready to
    explore a new lead, I scan through the entire list of leads to find the best one.

