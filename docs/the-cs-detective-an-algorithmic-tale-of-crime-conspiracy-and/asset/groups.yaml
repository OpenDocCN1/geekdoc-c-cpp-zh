    "I graduated over 10 years ago."


    "Is that so?” Dr. Loop shrugged again. “After a while, all the kids just blend
    together."


    "Okay,” Frank said, desperately trying to regain his train of thought. “Right.
    I need to know about security spells."


    "Oh, I don''t teach magic,” explained Dr. Loop. “I teach Wizard Criminology, it’s
    the study of—"


    "I took your class,” Frank interrupted. “I don''t want to know how to perform
    spells. I want to know what types of security spells exist. Particularly in police
    stations."


    Dr. Loop’s expression suddenly grew hard. “That’s very sensitive information,”
    she said, her voice cold. “Known only to a few people."


    "That’s why I’m here,” said Frank.


    "Why, exactly, do you need this information?” she asked.


    "I’m investigating a theft at the Capital Police Station,” he shot back. First
    the blathering story, now she was grilling him? He didn’t have time for this."


    "I will need to see your badge,” prompted Dr. Loop. She made a beckoning motion
    with her hand.


    Frank reached into his trench cloak and retrieved his Private Investigator badge.
    He tossed it on the desk.


    "A PI?” Dr. Loop laughed. Then, her voice grew hard again. “Get out of my office."


    "Doctor Loop—” started Frank, but stopped at the sound of a crossbow being cocked.'
