    德雷克教授讲座节录


    高效算法的关键在于信息。组织信息的方式以及我们使用的数据结构不仅会影响算法的效率，还会影响算法的实际运行方式。关于数据结构重要性的简单例子，请考虑之前课程中的广度优先搜索和深度优先搜索。虽然这些算法在概念上是类似的，但我们将线索列表维护在栈还是队列中，会显著改变搜索的进展。


