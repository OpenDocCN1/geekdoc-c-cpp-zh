    If the target value is greater than the current value, the search progresses to
    the right:


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_157_0.png)


    The search ends when either the target value is found or we reach a dead end.
    In the latter case, we can definitively say that the target value is not in the
    tree.


    We say that the binary search tree is perfectly balanced if every node in the
    tree has the same number of nodes in its left subtree as in its right subtree.
    In this case, the depth of the tree grows by one each time we approximately double
    the number of nodes in the tree.


    The computational cost of a search is proportional to the depth of the target
    value in the tree. The deeper the tree, the more comparisons we have to perform.'
