    # 警察算法 101：二叉搜索树

    Drecker 教授讲座摘要


    二叉搜索树上的范围搜索算法与搜索单个值相似。该算法从根节点开始递归地向下遍历树。在每个节点处，它会根据三个问题做出决策：


    - 1. 此节点应该被加入结果中吗？仅当当前值处于范围内时，才将其加入结果中。

    - 2. 是否应该探索左子树？如果存在左孩子且当前节点的值大于范围内的最小值，则算法应该递归探索左子树。在这种情况下，左子树中可能存在落在范围内的节点。

    - 3. 是否应该探索右子树？如果存在右孩子且当前节点的值小于范围内的最大值，则算法应该递归探索右子树。在这种情况下，右子树中可能存在落在范围内的节点。


    使用二叉搜索树进行范围搜索的优势在于，可以通过剪枝大量的搜索空间来节省计算。


    考虑以下二叉树：


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_174_0.png)


    如果你正在搜索范围 [8, 20] 内内的所有值，你只需要访问并评估 25 个节点中的 7 个（访问过的节点为阴影部分）：


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_174_1.png)


    同样，如果你在范围 [70, 80] 内进行搜索，你只需要访问并评估 25 个节点中的 6 个：


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_174_2.png)


    需要注意的是，访问节点并不意味着它一定会出现在结果列表中。这两个示例搜索都必须访问落在范围外的节点，因为这些节点的子树可能包含范围内的值。


    与搜索单个值一样，只有在进行多次搜索时，使用二叉搜索树进行范围搜索才是高效的。构建二叉搜索树的成本比对数据进行线性扫描要高。然而，构建树的成本可以分到多次搜索中，从而降低每次搜索的平均成本。


    ## 将嫌疑人添加到搜索树


    Frank 又看了几分钟的转调名单，但没有发现任何可疑之处。最近的转调目的地离首都都远远远，大多数盗窃案都发生在距离 50 英里的伊斯维尔城——而年轻警官的上长列出的“转调原因”是“一种挥之不去的脚味”。


    “这就是所有人了？”Frank 转向 Notation 问道。


    “是的，”Notation 防护地道，“这是过去一年在不同站点之间转调的所有官员。”


    Frank 皱了皱眉。这个定义听起来不对。听起来不完整。“那初始转调呢？”Frank 问。


    “来自学院的？”Notation 问。


    “是的，”Frank 说，“从学院毕业后的转调呢？”


    “嗯，”Notation 说，“那些是试用期初始转调。它们会记录在不同的账本上。”


    Frank 缓慢地点头，脑海中飞速运转。


    “我可以去——”Notation 刚开口。


    “不用，”Frank 打断她，“我答应了上长今天下午前提供更新。我那时可以去拿账本。”


    “你要见上长？”Notation 惊讶地问。


    “向客户汇报进展是私家探生活的一部分，”Frank 说。


    “你也可以把 Gretchen 的理论告诉上长，”Socks 补充道。


    “什么理论？”Notation 问道，她的眼睛在 Frank 和 Socks 之间游移。


    “Frank 没告诉你吗？”Socks 问。


    “没有，”Notation 咬牙切道，“他没说。”她的手在身体两侧握成拳头，但她的脸清楚地表明她非常想用其中一只拳打向 Frank 的鼻子。


    “我的导师 Gretchen 认为今晚城堡会被袭击，”Socks 说。


    “她是这么说的吗？”Notation 问。然后转向 Frank 补充道，“这似乎是一个很有用的信息。你为什么不告诉我？”


    “那只是推测，”Frank 耸了肩回答道，但他避开了她的目光。


    Frank 愣了一下。他没预料到这个。人们通常害怕向 Donovan 汇报，除非他们可以用“好消息！”或“你猜不到我们发现了什么”来开启对话。带着一个由死胡同、未探索的线索和生命威胁等组成的进展进入他的办公室，会招来一场响亮且形象丰富的斥责。如果不是自己需要信息，Frank
    根本不会考虑这样做。


    “我需要你跟进另一件事，”Frank 在短暂停顿后说道，“并行搜索，记得吗？”他伸手进口袋摸了索，但只找到了笔记本、几个食物包装纸和一个旧的空蜗壳。那个壳壳是他上一个案件的纪念品，那是一起涉及打击乐队和大量噪音投诉的恶性事件。他从口袋里掏出它。


    “看看你能不能找到关于这个的什么，”他说。一个蜗壳？Notation 问。“这有什么关系？”


    Notation 不情愿地接过了蜗壳。当她翻过它时，低声念道：“我不知道。”


