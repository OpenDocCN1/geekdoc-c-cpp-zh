    a bad shipment of Usb Greytails."


    "I’m on an official—" started Notation.

    "No," interrupted Vinetee. "You are not on an official investigation, Officer
    Notation. I know all the officers currently assigned to official investigations,
    from grand theft the way to slug racing. My sources keep me informed about such
    things, and you are not on any of their lists. But you are trespassing on my ship.
    So the question is what to do with you?


    "I thought the question was why?" said Frank.

    "Mr. Runtime," said Rebecca Vinetee with exaggerated patience. Please do not underestimate
    me. I know the why. I knew the who, when, what, and even the how before you did.
    I also know the who.


