  md: '# POLICE ALGORITHMS 101: TRIES

    Excerpt from Professor Drecker''s Lecture


    Tries are tree-based data structures that allow the user to efficiently search
    for strings based on the string''s prefix. Like binary search trees, tries start
    at a root node and branch out as they progress downward. In tries, each branching
    decision is based on the next element of the string. Thus, a node in a trie can
    have more than two children.


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_193_0.png)


    As with a binary tree, we only need to include nodes that have data. This example
    is constructed from the words zap, zen, zone, and zoom. Since we don''t include
    zonk, we don''t need to have a subtree under the K branch of ZON.


    Note that we don''t need to store the actual prefixes in the nodes; they can be
    reconstructed from the path through the'
  merge: -1
  pgno: 193
- img_proc: true
  md: 'tree. However, it can be useful to store one additional bit of information
    in each node: whether that node represents the end of a valid word. This allows
    us to distinguish between inserted words and prefixes of inserted words. For example,
    we could tell whether the word zoo had been inserted into a tree that also contains
    the word zoom.


    Searching a trie is similar to searching a binary search tree. An algorithm starts
    at the top of the tri and progresses downward. At each node, the algorithm selects
    the branch corresponding to the next letter in the target string. For example,
    if we were searching for zen, we would follow the path from Z, through the branch
    for E, and then the branch for N.


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_194_0.png)'
