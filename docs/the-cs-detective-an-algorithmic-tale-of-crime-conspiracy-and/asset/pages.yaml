  md: '“That’s not what I mean,” insisted Socks. “What if the tree becomes unbalanced?”


    “It could happen,” admitted Frank. “When you’re adding elements to a binary search
    tree, the resulting tree might be unbalanced. Our search algorithm will still
    work, though.”


    “But searches could be inefficient on an unbalanced tree,” pro-tested Socks.


    “That’s true,” admitted Frank.


    Adding nodes to a tree could cancel out one of the major advantages of a balanced
    binary search tree: that it makes many algorithms efficient. Each time you approximately
    double the number of nodes in a balanced binary search tree, you only need to
    add a single level. This means for a simple search, such as looking up an element,
    you can double the amount of data while adding only one more step to your search.
    However, Socks was correct: this efficiency applies only if the tree is balanced.
    In the worst case, the tree forms a long line that you’re forced to search along.
    And when you’re adding arbitrary values, there are no guarantees that the tree
    will remain balanced.


    “We’ll have to risk it,” Frank declared finally.


    “But—“


    If our search isn’t as efficient as it could be, I’m willing to live with that.
    It’s a small price to pay for not having to carry those other books with us to
