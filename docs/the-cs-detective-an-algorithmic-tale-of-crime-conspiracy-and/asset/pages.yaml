- img_proc: true
  md: 'individual nodes, with edges linking those nodes. If two nodes are connected
    by an edge, we say they are neighbors, which means you can move between those
    nodes. During your orientation, you studied at least one graph—the Kingdom Highway
    Map. This map represents each city as a node and the highways connecting them
    as edges. Make sure you own a good copy of that map. Criminals have a tendency
    to flee the city, and you''ll need to know which neighboring cities they are most
    likely to go.


    Searching the Kingdom Highway Map is a classic graph search problem. Our search
    states are the nodes of the graph—the cities on the map. Imagine that a crime
    has occurred in city A and it is your job to find the fleeing criminal.


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_91_0.png)


    Breadth-first search explores along an expanding frontier, checking each node
    X steps away from the initial node before proceeding to any nodes X+1 steps away.
    After you explore city A, its two neighbors, B and D, are added to the back of
    the queue. No other cities were in the queue, so B is the next city you''ll visit.


