  md: '# POLICE ALGORITHMS 101: BINARY SEARCH II

    Excerpts from Professor Drecker''s Lecture


    The key to efficient algorithms is information. In the case of binary search,
    we require that the data be sorted and that we have information on how that data
    is sorted. In order to rule out (or prune) large regions of the search space,
    the algorithm must be able to guarantee that the target value can''t be in that
    region. We can only do that if we know how the values behave as we move along
    the array. In computational problems, we say the array is sorted if all its values
    are arranged in increasing (or decreasing) order.


    However, just because the data is sorted by one dimension doesn''t mean that you
    will be able to binary search along another dimension. Say you''re searching an
    accounting ledger for clues. Ledgers are sorted by transaction number, which indicates
    when the transaction was recorded. This means that the transaction number for
    each entry will be less than the transaction number for the following entry. If
    the current entry has a transaction number of 105, we know that all entries before
    it will have transaction numbers less than 105 and all entries after it will have
    transaction numbers greater than 105.


    | 101 August 16 | Zed''s Coffee | 8.00 |

    | 102 August 15 | Bob''s Pizza | 20.00 |

    | 103 August 15 | Wands and More | 150.00 |

    | 104 August 15 | Spell Shoppe | 100.00 |

    | 105 August 16 | Zed''s Coffee | 8.00 |

    | 106 August 16 | Spell Shoppe | 50.00 |

    | 107 August 17 | Zed''s Coffee | 8.00 |

    | 108 August 17 | Hospital | 250.00 |


    continued'
  merge: -1
  pgno: 58
- img_proc: true
  md: 'However, this also means that the entries in other fields, such as the actual
    date of the transaction, the merchant''s name, or the transaction amount, are
    *not* in sorted order. What if you''re interested in finding transactions above
    a certain suspicious amount or with a known weapons merchant? Does the sorting
    help you here? No, you would still find yourself using an exhaustive linear search.
    Knowing that transaction 105 was at Zed''s Coffee doesn''t tell you anything about
    the merchants or amounts in transactions before or after that one.


    Similarly, if you sorted the ledger in increasing order of transaction amount,
    this would allow you to quickly find all transactions costing $250, but it would
    not help you search for a given transaction date, ID, or merchant.'
