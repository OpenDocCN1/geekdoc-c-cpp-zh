- img_proc: true
  md: 'Up until this point, algorithms have been presented on search spaces where
    they can efficiently jump from any state to any other arbitrary state. For example,
    in an array, you can easily examine the value at any location using just its index.
    And in a hotel hallway, you can run between rooms. This flexibility provides efficiency
    for the algorithms.


    However, many search spaces come with constraints on how you move from state to
    state. If you are searching a castle in the physical world, you can''t jump arbitrarily
    between rooms—you have to traverse the halls and rooms in between. Similar constraints
    can also apply in the computational realm for data structures like graphs or linked
    lists.


    Even in cases where you can jump between states, it is often useful to picture
    backtracking as moving through previous states on your way to explore new states.
    In the algorithmic world, this can be significantly less costly than physically
    retracing your route. However, the processes are conceptually similar: you back
    up the search and proceed down a different avenue.


    In the following lectures, we''ll see many examples of searches that backtrack
    when they hit dead ends. And once you join the force, you''ll experience more
    dead ends than you ever imagined.'
