    # POLICE ALGORITHMS 101:

    BREADTH-FIRST SEARCH

    Excerpt from Professor Drecker’s Lecture


    Breadth-first search is an algorithm that explores search states in the order
    in which they are encountered. In other words, it always attempts to explore the
    oldest unsearched state first.


    You can visualize breadth-first search as keeping a list (or, more formally, a
    `queue`) of known but unexplored states. At each step, the algorithm picks the
    next state to explore from the front of the queue. As the algorithm discovers
    new options, it adds them to the back of the queue, to make sure all previous
    options are explored before it moves on to new options.


    It’s helpful to describe breadth-first search in terms of how it explores a graph.
    A graph is a data structure composed of


    continued'
