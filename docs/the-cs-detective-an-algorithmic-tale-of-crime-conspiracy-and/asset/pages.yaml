  md: '# # POLICE ALGORITHMS 101:

    BINARY SEARCH TREES

    Excerpt from Professor Drecker''s Lecture


    The range search algorithm on a binary search tree is similar to the search for
    a single value. The algorithm starts at the top node and recursively explores
    down the tree. At each node, it makes decisions based on three questions:


    +   1. Should this node be added to the results? The current value should be added
    to the results if, and only if, it falls within the range.

    2. Should the left subtree be explored? The algorithm should recursively explore
    the left subtree if there is a left child and the value of the current node is
    greater than the value in the range. In that case, there could be a node in the
    left subtree that falls within the range.

    3. Should the right subtree be explored? The algorithm should recursively explore
    the right subtree if there is a right child and the value of the current node
    is less than the largest value in the range. In that case, there could be a node
    in the right subtree that falls within the range.


    The advantage of using a binary search tree for range search is that you may be
    able to save computation by pruning out large amounts of the search space.'
  merge: -1
