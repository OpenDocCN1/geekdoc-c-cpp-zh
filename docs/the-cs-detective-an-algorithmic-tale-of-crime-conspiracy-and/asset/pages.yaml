  md: '# MEET FRANK RUNTIME.

    DISGRACED EX-DETECTIVE.

    HARD-BOILED PRIVATE EYE.

    SEARCH EXPERT.


    When a robbery hits police headquarters, it''s up to Frank Runtime and his extensive
    search skills to catch the culprits. In this detective story, you''ll learn how
    to use algorithmic tools to solve the case. Runtime scouts smugglers'' boats with
    binary search, tails spies with a search tree, escapes a prison with depth-first
    search, and picks locks with priority queues. Joined by know-it-all Officer Notation
    and inept tag-along Socks, he follows a series of leads in a best-first search
    that unravels a deep conspiracy. Each chapter introduces a thrilling twist matched
    with a new algorithmic concept, ending with a technical recap.


    Perfect for computer science students and amateur sleuth alike, The CS Detective
