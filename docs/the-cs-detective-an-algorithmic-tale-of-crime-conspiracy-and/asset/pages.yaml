  md: '# POLICE ALGORITHMS 101:

    BINARY SEARCH TREES

    Excerpt from Professor Drecker''s Lecture


    Adding nodes to a binary search tree is similar to searching for a target value.
    We start at the root of the tree and progress downward as though searching for
    the value to insert. We progress to the left or right depending on whether the
    new value we''re inserting is smaller or larger than the value at the current
    node. The descent ends when we reach a dead end: a node without a child in the
    correct direction. At this point, we can create a new node and make it the (left
    or right) child.


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_182_0.png)


    The cost of inserting a single element scales linearly with the depth of the tree.
    However, we have no guarantees that the tree will remain balanced as new nodes
    are inserted. In fact, it is easy for a tree to become unbalanced, with deep branches,
    depending on the order of insertions. For example, if we insert numbers in sorted
    order, all the additions can go down a single branch.


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_182_1.png)'
