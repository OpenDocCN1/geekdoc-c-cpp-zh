    # POLICE ALGORITHMS 101:

    BINARY SEARCH TREES


    Excerpt from Professor Drecker’s Lecture


    As we have seen in this lecture, we can use information about the structure of
    a binary search tree to search efficiently. Not only that, but we can add and
    remove nodes from trees. However, whenever we change a data structure, it is vitally
    important to ensure that we’re not violating the properties that we use.


    For binary search trees, it is important to maintain the binary search tree property.
    This property states that (1) the values of the data in the left node (and all
    its children) are less than or equal to the value of the current node and (2)
    the values of the data in the right node (and all its children) are greater than
    or equal to the value of the current node. If we violate this property, we no
    longer have a binary search tree, and we can’t prune branches of the tree during
    a search.'
