  md: '# POLICE ALGORITHMS 101: EXHAUSTIVE SEARCH

    Excerpt from Professor Drecker’s Lecture


    An exhaustive search algorithm searches every possibility in the entire search
    space for the target value. The most common exhaustive search is a linear search,
    which simply checks all the different possibilities in order.


    Consider what happens when you chase a robber into the second-floor hallway of
    an abandoned hotel. The hall has 30 doors, all of them closed. If you followed
    correct police procedures, your partner has already blocked off the opposite staircase,
    and the robber is trapped somewhere on that floor. How do you find him? Do you
    pick random doors, running back and forth until you get lucky? No! You search
    down the hall, kicking in one door at a time.


    Or consider an algorithm that scans a list of numbers (an array), searching for
    a target value. The algorithm moves along the list from number to number, checking
    each value in turn so as not to miss any, and stops when it reaches the target.
    If we are searching an array for the number 5, then the search would progress
    as follows:


    | 1 | 13 | 2 | 34 | 5 | 8 | 1 | 21 | 3 |


    | 1 | 13 | 2 | 34 | 5 | 8 | 1 | 21 | 3 |


    | 1 | 13 | 2 | 34 | 5 | 8 | 1 | 21 | 3 |


    continued'
  merge: -1
  pgno: 28
- img_proc: true
  md: '| 1 | 13 | 2 | 34 | 5 | 8 | 1 | 21 | 3 |


    | 1 | 13 | 2 | 34 | 5 | 8 | 1 | 21 | 3 |


    The advantage of linear search algorithms is that they are simple to implement
    in the field and they work even on unstructured data. You don''t have to make
    any assumptions about which room the robber chose; you just check everything.
    The downside is that exhaustive algorithms are often not the most efficient algorithm
    if the data has structure that can be used. If you know where the robber went,
    you can save yourself from kicking a lot of doors by using that information.


    The key to efficient algorithms is information!'
