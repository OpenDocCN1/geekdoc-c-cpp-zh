    # POLICE ALGORITHMS 101: BEST-FIRST SEARCH

    Excerpt from Professor Drecker''s Lecture


    If you remember only one algorithm from this course, it should be best-first search.
    This algorithm will be your best tool on the force. You will need it on every
    case. And, of course, it will be the final.


    Best-first search is an algorithm that chooses the next state to explore based
    on a score or score function. Each newly discovered search state is given a score
    that corresponds to how good the algorithm believes it to be. For example, you
    might label states by their probability of containing the target value (if you
    can estimate it) or or the quality of a lead in an investigation. At each step,
    the algorithm chooses to explore the state with the highest score. You can visualize
    the operation of best-first search as keeping a sorted list of states to try next.


    Best-first search can also be used to minimize the costs associated with each
    state, such as the estimated distance of the state to the goal. In this case,
    the algorithm chooses the next state by which one most minimizes the cost.


    Consider a very simple maze where you know the coordinates of the start and the
    goal locations. You can label each


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_203_0.png)'
  merge: -1
  pgno: 203
- img_proc: true
  md: 'state in the search space with a cost equal to the distance from that state
    to the goal. For example, you could use the Manhattan distance—the total vertical
    distance to the goal plus the total horizontal distance to the goal. This label
    doesn''t necessarily mean that this state will get you there, but it does provide
    a signal for the search algorithm.


    # Start


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_204_0.png)


    As the search progresses, it will explore different states (shown as shaded circles),
    find new unexplored states, and add the unexplored states to the list of states
    to try (enclosed in dashed circles). In each iteration, the search selects the
    best unexplored state according to the score or cost. In this example, this means
    selecting the state with the smallest cost.


