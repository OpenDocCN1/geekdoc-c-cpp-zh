    “I wasn''t actually asking,” Frank interrupted.


    The captain shrugged. He pulled a book from the shelf and leafed through the pages.
    Frank craned his neck to see the cover—Police Academy Yearbook: Class XXI.


    “What do you want, Captain?” Frank demanded.


    The captain met Frank’s stare at last. “I need your help, Frank,” he said.


    Frank straightened. In the five years since Frank had left the force, the captain
    had paid him exactly two visits, and both had been to warn him to stay away from
    active cases. Threats were all Frank had come to expect, but now it seemed the
    captain had a special kind of problem—perhaps the kind that would mean an end
    to Frank’s delinquent rent.


    “I’m not on the force anymore,” Frank said airily. “Why don’t you get one of your
    trusted detectives to do it?


    “I need someone outside of the force,” said the captain. “Drop the act, Frank.
    If you don’t know what it means for me to be here, you’re not the person I need.”'
