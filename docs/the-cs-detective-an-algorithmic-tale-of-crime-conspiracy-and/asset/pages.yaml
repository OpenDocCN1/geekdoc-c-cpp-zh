  md: '# — 1 —

    Search Problems


    The door opened without a knock—only the hinge’s creak announced the visitor.
    Frank started for his crossbow, but pulled up short. If the Vinettees were coming
    for him, they would have knocked—with an axe. Whoever was coming through the door
    must want to talk. Frank reached for his mug instead and downed the remainder
    of his now-cold coffee.


    "Captain Donovan," he said as the man entered. "What brings you to this fine neighborhood?
    I thought you didn’t venture below Fifteenth Street anymore."


    "It’s been a while," the captain said simply. "How’ve you been, Frank?


    "Spectacular," Frank answered dryly, eyeing the captain as he walked a slow circuit
    around the room.


    Donovan scanned Frank’s shabby office. His red officer’s cloak swished gently
    behind him. "How’s the private eye game?",


    "It pays the bills," Frank lied.


    The captain nodded. He paused for a moment, then moved to the bookshelf and browsed
    the contents.


    "So is this a social visit then? Frank said. "Should I be asking after Marlene
    and the kids?"'
