  md: '# Exhaustive Search for an Informant


    The key to efficient algorithms is information." It was Professor Drecker''s mantra,
    barked at the cadets at the start of every Police Algorithms class, ferociously
    enough to sear itself permanently into Frank''s memory. "A good algorithm depends
    on finding the structure in the data and using it. It depends on information."


    Frank smiled to himself at the memory as he turned onto Three Bit Lane, a rutted
    dirt road lined with a combination of seedy bars and upscale coffee shops. He
    nodded politely to a pair of passing knights, who clanged as they jittered past
    in their armor, and made a mental note to grab a Triple-Bold Espresso before he
    left. First he needed information, something to help guide his search. He knew
    exactly where to start.


    Glass Box Billy would be in one of the establishments by now, sitting quietly
    and listening to the wisps of conversation drifting through the room. People didn''t
    mean to say things around Billy; they simply didn''t notice he was. Billy had
    been blessed with a single notable talent: utter inconspicuousness. Whatever he
    tried, there was something about Billy that meant people just didn''t notice him.
    Maybe it was his pale skin or his small physique; maybe it was'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'his exceptionally mundane taste in clothing. Whatever it was, Billy had long
    ago decided to put his one talent to use by eavesdropping, collecting information,
    and selling it to anyone who would buy.


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_23_0.png)


    Frank eyed the eight storefronts hunched together in Three Bit Lane and wondered
    which Billy would have chosen. He ran through half a dozen search algorithms in
    his head, but it was pointless. Frank didn’t have any information to go on. Billy
    could be in any one of the bars or coffee shops.


    He’d have to use an exhaustive search—simply try all the possibilities until he
    found Billy. It didn’t sit well with him. Years of the detective and private investigation
    game had taught him that there was almost always a better algorithm than exhaustive
    search, and he hated resorting to something so inefficient.


    Grumbling, Frank started his search. He walked into the first bar on the street,
    The Absolute Value.'
