  md: '# POLICE ALGORITHMS 101:

    DEPTH-FIRST SEARCH


    Excerpt from Professor Drecker''s Lecture


    Unlike breadth-first search, depth-first search is an algorithm that explores
    more recently encountered search states first. The algorithm progresses down paths
    until it hits either the target or a dead end.


    As with breadth-first search, you can visualize a list (in this case, a stack)
    of known but unexplored states. At each step, the algorithm picks the next state
    to explore from the top of the stack. But unlike breadth-first search, depth-first
    search adds new options to the top of the stack.


    Consider our graph example from the lecture on breadth-first search. Remember,
    graphs are data structures composed of individual nodes and edges linking those
    nodes. They can be used to represent all sorts of concepts, like city maps, networks
    of criminals, or even the layout of a castle. We''ll use the Kingdom Highway Map
    from the same lecture and start our search from city A—the scene of the crime.


    ![](img/e29fc41ddce7c5429aacfb7f918a9728_104_0.png)


    Depth-first search explores down one path until it hits a dead end (or a node
    it has already explored). In this way, the algorithm prioritizes exploring deeply
    down paths over exploring broadly over the options, as in breadth-first search.


    continued'
