    # POLICE ALGORITHMS 101:

    ADAPTING YOUR BINARY SEARCH

    Excerpt from Professor Drecker’s Lecture


    Not every computational problem you face your career is going to have a nice,
    prepackaged solution. Sure, scholars have spent years studying a vast range of
    problems and writing up solutions. But in the field you’ll find new problems with
    new wrinkles. If you leave this class having just memorized a sheet of algorithms,
    you’re soon going to find yourself in deep trouble.


    In order to handle novel problems, it is important to understand how an algorithm
    works and how it can be adapted to new problems. The basic idea behind binary
    search—using the structure in the data to repeatedly halve the search space—is
    more important than the details of a particular application. You can adapt binary
    search to search circular (but still sorted) arrays or even determine the optimal
    temperature for your coffee, by testing warmer and cooler coffee until it’s“right.”'
