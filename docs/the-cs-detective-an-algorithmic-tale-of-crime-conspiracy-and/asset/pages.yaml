  md: '# ABOUT THE AUTHOR


    Jeremy Kubica is a principal engineer at Google working on machine learning and
    algorithms. He has a PhD in robotics from Carnegie Mellon University and a BS
    in computer science from Cornell University. He spent his graduate school years
    creating algorithms to detect killer asteroids (actually stopping them was, of
    course, left as “future work”). Kubica is the author of the popular Computational
    Fairy Tales blog.


    # ABOUT THE TECHNICAL REVIEWER


    Heidi Newton has a BSc from the University of Canterbury, New Zealand, and an
    MSc from Victoria University of Wellington, New Zealand, both in computer science.
    She works for the University of Canterbury’s computer science education research
    group and Code Avengers, and on the side carries out related tutoring and consultancy
    work. Her current focus is on improving teaching resources for computer science
    and programming.'
