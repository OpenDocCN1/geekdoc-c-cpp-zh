  md: '# A Note to Readers


    This book focuses on computational thinking and search algorithms. The stories
    introduce and illustrate computational concepts at a high level, exploring the
    motivation behind them and their application in a noncomputer domain. This book
    is not a comprehensive text, and the stories are not intended as a substitute
    for a solid technical description of computer science. Instead, they are meant
    to be used as illustrations: they supplement the full concept and aid understanding.


    The book covers a variety of computational approaches that all share the broad
    categorization of search algorithms. Concepts are presented first within the context
    of the story, and then explained more technically in a section laid out as lecture
    notes at the end of each chapter. Readers can safely skip these technical sections
    without missing any of the story.


    This book assumes some experience with basic computer science concepts but does
    not require knowledge of any specific programming language. The algorithms in
    this book are meant to apply to a range of programming languages and problem domains.'
  merge: -1
