    # POLICE ALGORITHMS 101: SEARCH PROBLEMS

    Excerpt from Professor Drecker''s Lecture


    In this class we''ll discuss several different algorithms (and related data structures)
    for solving search problems. A search problem is defined as any problem that requires
    us to find a specific value (or target) within a space of possible values (a search
    space).


    Those of you who graduate and go on to become police officers will find yourselves
    facing problems that fall into this category every single day. This broad definition
    of a search problem encompasses a lot of different computational problems, from
    searching the police log for a specific entry to finding rooms within a hideout
    to finding all arrest records that match some criteria. This class won''t'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'be exhaustive—that would take years—but I''ll give you some examples of basic
    and important algorithms as we go.


    The algorithms described in this class will have three common components:


    **Target** The piece of data you''re searching for. The target can be either a
    specific value or a criterion that signifies the successful completion of a search.


    **Search space** The set of all possibilities to test for the target. For example,
    the search space could be a list of values or all the nodes in a graph. A single
    possibility within the search space is called a *state*.


    **Search algorithm** The set of specific steps or instructions for conducting
    the search.


    Some search problems will have additional requirements or complexities, which
    we''ll touch upon as we go over different algorithms.'
