    # 6.2 Single Pole Filters


    A block diagram of a single pole filter is shown in Figure 6.1.


    The difference equation is as follows:


    y(n) = a<sub>0</sub>x(n) - b<sub>1</sub>y(n - 1) (6.3)


    # 6.2.1 First-Order LPF and HPF


    Specify:


    +   * f<sub>c</sub>, the corner frequency


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_166_0.png)


    Figure 6.1: The first-order feed-back filter and difference equation.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_166_1.png)


    Figure 6.2: The first-order LPF has a single pole and zero on the real axis.


    The design equations are as follows:


    | LPF | HPF |

    | --- | --- |

    | \(\theta_c = 2\pi f_c/f_s\) | \(\theta_c = 2\pi f_c/f_s\) |

    | \(\gamma = 2 - \cos(\theta_c)\) | \(\gamma = 2 + \cos(\theta_c)\) |

    | \(b_1 = \sqrt{\gamma^2 - 1} - \gamma\) | \(b_1 = \gamma - \sqrt{\gamma^2 - 1}\)
    |

    | \(a_0 = 1 + b_1\) | \(a_0 = 1 - b_1\) |

    (6.4)'
