    The next algorithm building block is the scalar multiplication operation. It is
    a sample-by-sample operator that simply multiplies the input samples by a coefficient.
    The multiplication operator is used in just about every DSP algorithm around.
    Figure 1.22 shows the multiplication operator in action. The inputs are simply
    scaled by the coefficients.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_33_0.png)


    Figure 1.20: Two common ways to draw a delay; the one-sample delay is represented
    with the z^-1. Both versions are equivalent.'
