    # ## 5.4.2 Frequencies Above and Below ±Nyquist


    The sampling theorem sets up the Nyquist criteria with regards to completely recovering
    the original, band-limited signal without aliasing. However, frequencies above
    Nyquist and all the way up to the sampling frequency are also allowed mathematically.
    And in theory, any frequency could enter the system and you could sample it without
    limiting Nyquist. For a frequency or phase response plot, the frequencies from
    Nyquist up to the sampling frequency are a mirror image about Nyquist. This is
    another way to divide up the 2π range by going from 0 Hz to the sampling frequency
    (Figure 5.10).


