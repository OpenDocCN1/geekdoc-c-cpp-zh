  md: '# 1.15 Gain, Attenuation, and Phase Inversion


    As shown in Figure 1.25, a simple coefficient multiplier will handle the three
    basic audio processing functions of gain, attenuation, and inversion. If the coefficient
    is a negative number, phase inversion will be the result. If the coefficient has
    a magnitude less than 1.0, attenuation will occur, while amplification occurs
    if the magnitude is greater than 1.0.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_35_0.png)


    Figure 1.24: The difference equations relate the input(s) to the output via mathematical
    operations


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_35_1.png)


