    # 6.4 Analog Filter to Digital Filter Conversion


    A more widely used approach to filter design is to first start with the classic
    analog designs and then convert them into digital versions. There''s good reason
    to do this because there are many excellent analog designs already done for us.
    We just need a way to make them work in our digital world. While analog filter
    design is outside the scope of the book, there are many similarities between the
    two design worlds. For example, both analog and digital filter design involve
    a transfer function that you manipulate to produce poles and zeros. They also
    both use a transform to get from the time domain to the frequency domain. A fundamental
    difference is that in analog, there is no Nyquist restriction and all frequencies
    from $-\infty$ to $+\infty$ are included. Also, in analog, reactive components
    or circuits like inductors, capacitors, and gyrators (a circuit that simulates
    an inductor) are used to create the phase shift that is at the heart of the filtering
    operation. Table 6.1 summarizes the similarities and differences.


    # Table 6.1: The differences between analog and digital filter design technique.


    | Digital | Analog |

    |---|---|

    | • Uses a transfer function to relate I/O | • Uses a transfer function to relate
    I/O |

    | • Delay elements create phase shift | • Reactive components create phase shift
    |

    | • Uses the z transform (sampled time to frequency) | • Uses the Laplace transform
    (continuous time to frequency) |

    | • Poles and zeros in the z-plane | • Poles and zeros in the s-plane |

    | • Nyquist limitation | • All frequencies from $-\infty$ to $+\infty$ allowed
    |

    | • Poles must be inside the unit circle for stable operation | • Poles must be
    in the left-hand part of the s-plane for stable operation |


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_171_0.png)'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# Figure 6.10: Comparison of the unit circle in the z-plane with the s-plane.


    In Figure 6.10 you can see the s-plane on the right—it is also a complex plane.
    The real axis is named the \(\sigma\) axis and the imaginary axis is the \(j\omega\)
    axis. The \(j\omega\) axis is the frequency axis and it spans \(-\infty\) to \(+\infty\)
    rad/sec. The unit circle maps to the portion on the \(j\omega\) axis between -Nyquist
    and +Nyquist. In order to transform an analog filter design into a digital filter
    design, we need a mapping system to get the poles and zeros from the s-plane to
    become poles and zeros in the z-plane. Once we have that, the coefficients that
    produce those poles and zeros in the digital locations can be calculated. In the
    analog world, poles that are close to the \(j\omega\) axis will result in poles
    that are close to the unit circle in the digital world. The problem is that poles
    and zeros can exist anywhere along the \(j\omega\) axis, even at frequencies outside
    the digital Nyquist zone. It is common for analog designs to have a pole or a
    zero at \(-\infty\) and/or \(+\infty\) on either the \(\sigma\) and/or \(j\omega\)
    axis.


    In Figure 6.11 you can see the problem: the pair of zeros close to the \(j\omega\)
    axis at \(\frac{1}{2}\) Nyquist will map to locations close to the unit circle
    at the \(\frac{1}{2}\) Nyquist angles. But what about the pair of poles that are
    outside the Nyquist frequency in the s-plane? The other way to think about the
    issue is that in the analog s-plane, the entire left-hand side, including all
    the infinite frequencies, must map to the interior of the unit circle in the z-plane.
    Also, the entire right-hand plane must map to the exterior of the unit circle,
    as shown in Figure 6.12.


    So, what we need is a mathematical device to make the transformation from the
    s-plane to the z-plane. It must map an infinitely large area into the unit circle.
    Fortunately, many of these mathematical transforms already exist. The one best
    suited for us is called the bilinear transform, and we can use it to transform
    an analog transfer function, \(H(s)\) into a digital one, \(H(z)\).


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_172_0.png)


    # Figure 6.11: Mapping the poles and zeros from the analog s-plane to the digital
    z-plane.'
  merge: -1
  img_proc: true
- pgno: 173
  md: '![](img/b54974d0a4317ec82d7ae02126d10a6f_173_0.png)


    Figure 6.12: Mapping the infinitely large left-hand plane into the finite space
    inside the unit circle and the right-hand plane into the exterior of the unit
    circle.


    We wish to convert an analog transfer function H(s) into a sampled equivalent
    H(z). Effectively, this means we need a way to sample the continuous s-plane to
    produce the sampled z-plane version. In other words, we need to create a sampled
    analog transfer function H<sub>s</sub>(s) where the subscript s stands for “sampled.”
    We seek to find a function g(z) such that Equation 6.9 holds true.


    ```

    H(s) \xrightarrow{s=g(z)} H(z) \tag{6.9}

    ```


    Since the sample interval is T, then the term \(e^{j\omega T}\) would correspond
    to one sample in time. So, if we evaluate H(z) by letting \(z = e^{j\omega T}\)
    then we will arrive at the sampled analog transfer function H<sub>s</sub>(s) in
    Equation 6.10:


    ```

    H(s) \xrightarrow{s=g(z)} H(z) \xrightarrow{z=e^{j\omega T}} H_s(s) \tag{6.10}

    ```


    To solve, we note that s = j\(\omega\) (the analog definition of s) and z = \(e^{j\omega
    T}\) to get Equation 6.11:


    ```

    z = e^{sT} \\

    ln(z) = ln(e^{sT}) \\

    ln(z) = sT \tag{6.11}

    ```


    or'
