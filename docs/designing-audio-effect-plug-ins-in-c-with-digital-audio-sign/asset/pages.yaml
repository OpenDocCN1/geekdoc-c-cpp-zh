- pgno: 289
  md: '![](img/b54974d0a4317ec82d7ae02126d10a6f_289_0.png)


    # Figure 9.9: One cycle minus one sample of a sinusoid. The table is indexed with
    the value $i$ which starts at 0; the last entry in the table is at $i = 1023$
    and it is the sample just before the waveform starts all over again.


    ```

    inc = L \frac{f_{desired}}{f_s} (9.7)

    ```


    $L$ is the table length and $f_{desired}$ is the target frequency. The increment
    value you get back will be used to skip through the table, moving forward by $inc$
    during each sample interval. If $inc$ is less than 1.0, then the desired frequency
    is below the table frequency, and if it is above 1.0 it must be greater than the
    table frequency. If the $inc$ is 2.0, then the resulting frequency is twice the
    table frequency. Most likely, the $inc$ value is going to be noninteger and will
    therefore consist of an integer part and a fractional part. For example, if $inc
    = 24.9836$ then the integer part would be 24 and the fractional part 0.9836. Here,
    the integer part is called $int$ and the fractional part is called $frac$.


    As with the delay module you built in Chapter 8, there are several options for
    dealing with the fractional part of the increment value. You could:


    +   - Truncate the value, and forget $frac$.

    +   - Linearly interpolate the table $frac$ distance between $int$ and $int +
    1$.

    +   - Use polynomial interpolation or another interpolation method instead of
    linear interpolation.


    If you truncate the $inc$ value, then you have multiple problems—the note you
    synthesize won''t be exactly in tune. Additionally, it will be distorted because
    of the inaccuracy in the transcription out of the table. Linear and polynomial
    interpolation both overcome these problems, though there is still distortion in
    the output. The industry standard is a fourth-order Lagrange interpolation on
    the wave table, where the neighboring four points (two to the left and two to
    the right) of the target interpolated value are used.


    Before we code a wave table oscillator, there is one thing you need to be aware
    of: the danger of a wave table is that the cycle of data stored inside might be
    full of aliasing components. In other words, you can create a table of data that
    could have never made it past the input low-pass filter (LPF) if it were an analog
    signal being sampled. We will be doing just that and creating some signals that
    do'
