  md: '# Figure 9.2: Initial conditions that would have produced a sinusoid whose
    first output sample is 0.0.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_278_0.png)


    # Figure 9.3: The direct form oscillator is really the feedback side of the bi-quad
    structure.


    Specify:


    +   * $f_o$, desired oscillation frequency


    The design equations are as follows:


    ```

    \(\theta = \frac{2\pi f_o}{f_s}\)

    \(b_1 = -2\cos(\theta)\)

    \(b_2 = 1.0\)

    (9.3)

    ```


    Initial conditions:


    ```

    y(n - 1) = sin(-10)

    y(n - 2) = sin(-20)

    ```


    # 9.2 Design a Direct Form Oscillator Plug-In


    In our first version of the direct form oscillator we are going to make it as
    simple as possible by restarting the oscillator when the user changes the oscillator
    frequency. This means we are going to recalculate the initial conditions as if
    the oscillator was starting from a phase of 0 degrees and the first sample out
    would have a value of 0.0. After we have that up and running, we will modify it
    to change frequency on the fly, automatically back-calculating the initial conditions
    for any given output sample. Here are the oscillator''s specifications:


    +   * Monophonic sinusoidal oscillator.

    +   * We will need to implement a second-order feed-back block.

    +   * We will need a slider for the user to control the oscillation frequency
    in Hz.

    +   * We will need a cookFrequency() function to calculate our coefficients and
    reset our initial conditions when the user moves the frequency slider.

    +   * The oscillator''s range will be 200 Hz to 6 kHz.'
