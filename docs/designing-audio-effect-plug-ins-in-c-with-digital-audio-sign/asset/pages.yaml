    RackAFX has a powerful built-in module called FIR Designer that lets you use two
    popular methods to design FIR filters: the optimal method and the frequency sampling
    method. The optimal method is sometimes called the “Parks–McClellan algorithm.”
    When the module first opens, you will see the new controls at the right side,
