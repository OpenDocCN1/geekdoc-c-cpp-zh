    Figure 13.3 shows the feed-forward and feedback topologies for dynamics processors.
    There is some debate as to which is best; we''ll stay out of that argument and
    design the feed-forward version first. Then, you can design a feedback version
    for yourself. Both designs include a detector/computer and a digitally controlled
    amplifier/attenuator (DCA). The detector analyzes the input signal and computes
    a new gain value to be applied to the signal. The detector/computer block lies
    in the side-chain of the circuit.


    Because the compressor and downward expander are both gain reduction devices,
    an additional stage of make-up gain is required. In some designs, the make-up
    gain is calculated in the side-chain while in others it sits outside of the DCA.
    Both accomplish the same task. We are going to add another gain stage at the input
    (similar to the mod filter in Chapter 12) to drive the detector; this pre-gain
    block is useful when the source material is very low in amplitude, making it difficult
    to trigger the detector.


    Figure 13.4 shows the block diagram of the first dynamic processor plug-in.


    Figure 13.4 labels the input and control signals as follows:


