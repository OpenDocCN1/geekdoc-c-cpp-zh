- pgno: 335
  md: 'In addition to the extra algorithms in Sections 10.1 and 10.2, next are some
    more designs for you to experiment with. Remember to figure out the UI first then
    code it using the modules we''ve already built.


    # 10.6.1 Stereo Cross-Flanger/Chorus (Korg Triton®)


    Like the quadrature version, the only difference between the flanger and chorus
    is in the module setting—the same block diagram is used for both. The LFO can
    be engaged in normal or quadrature phase (Figure 10.14).


    # 10.6.2 Multi-Flanger (Sony DPS-M7®)


    The DPS-M7 has some intensely thick modulation algorithms. This one has two flanger
    circuits that can be combined in parallel or series on either channel. The channels
    are also cross mixable. Each module marked “flanger” contains a complete flanger
    module: depth, rate, feedback, and wet/dry. Note also the use of pre-delays with
    feedback too. All LFOs and pre-delays are independent and fully adjustable (Figure
    10.15).


    # 10.6.3 Bass Chorus


    The bass chorus in Figure 10.16 splits the signal into low-frequency and high-frequency
    components and then only processes the high-frequency component. This leaves the
    fundamental intact. The comb filtering of the chorus effect smears time according
    to how much delay is being used. For the bass guitar, this results in a decreased
    fundamental with an ambiguous transient edge or starting point. Because bass players
    need to provide a defined beat, the bass chorus will preserve this aspect of the
    instrument. If you want to implement this effect, use the Linkwitz–Riley low-pass
    and high-pass filters to split the signal. Invert the output of one of the filters—it
    doesn''t matter which one—so that their phase responses sum properly.'
  merge: -1
  img_proc: true
