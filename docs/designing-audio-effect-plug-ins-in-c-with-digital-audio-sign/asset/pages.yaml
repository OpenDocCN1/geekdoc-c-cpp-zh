  md: 'Calculate the filter coefficients $a_0$ to $a_{N/2}$ with Equation 8.5:


    ```

    For $N =$ odd

    $$a_n = \frac{1}{N} \left[ H(0) + 2 \sum_{i=1}^{(N-1)/2} |H(i)| \cos \left[ 2\pi
    i \left[ n - \frac{N-1}{2} \right] / N \right] \right]$$


    For $N =$ even

    $$a_n = \frac{1}{N} \left[ H(0) + 2 \sum_{i=1}^{N/2-1} |H(i)| \cos \left[ 2\pi
    i \left[ n - \frac{N-1}{2} \right] / N \right] \right]$$

    ```


    Note: This produces half the coefficients; the other half are a mirror image,
    as shown in the example below. Because the IR is guaranteed to be symmetrical
    about its center, it produces a linear phase FIR filter every time.


    Example: Design an LPF with a cutoff of 5.5 kHz, $f_s = 44.1$ kHz, $N = 16$.


    # Solution:


    +   1. $N = 16$, which produces eight sampled points in the frequency domain with
    a spacing of 2.756 kHz.

    +   2. Sample the plot, producing the magnitude response, $H(i)$ (Figure 8.13).


    For this plot notice that:


    +   * The plot is linear in frequency. To design a frequency sampling method filter
    by hand, it is often easier to start with a linear frequency axis.

    +   * The point at Nyquist is not used; it is there to pin down the response that
    would occur after Nyquist.


    The sampled frequency response is read directly off the plot: (0 dB = 1.0, -60
    dB = 0.001).


    ```

    $|H(i)| = \{ 1.0, 1.0, 1.0, 0.001, 0.001, 0.001, 0.001, 0.001 \}$

    ```


    +   1. Use Equation 8.5 to extract IR $h(n)$, which are the coefficients, $a_n$.


    +   $a_0 = 0.04858366\n$a_1 = 0.00364087\n$a_2 = -0.05199205\n$a_3 = -0.07047625\n$a_4
    = -0.02194221\n$a_5 = 0.08695625\n$a_6 = 0.21101949\n$a_7 = 0.29421023\n$a_8 =
    0.29421023\n$a_9 = 0.21101949\n$a_{10} = 0.08695625\n$a_{11} = -0.02194221'
