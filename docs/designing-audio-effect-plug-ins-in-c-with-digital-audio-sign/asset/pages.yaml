  md: 'The last filter topology to study is the bi-quadratic (or bi-quad) filter.
    The bi-quad consists of two second-order components: a second-order feed-forward
    and a second-order feed-back filter combined together as shown in the block diagram
    in Figure 5.61. The resulting transfer function will have two quadratic equations,
    thus the name.


    The difference equation is as follows:


    ```

    y(n) = a_0x(n) + a_1x(n - 1) + a_2x(n - 2) - b_1y(n - 1) - b_2y(n - 2)   (5.86)

    ```


    # Steps 1 to 3: Take the z transform of the difference equation to get the transfer
    function, then factor out a_0 as the scalar gain coefficient


    ```

    y(n) = a_0x(n) + a_1x(n - 1) + a_2x(n - 2) - b_1y(n - 1) - b_2y(n - 2)

    Y(z) = a_0X(z) + a_1X(z)z^{-1} + a_2X(z)z^{-2} - b_1Y(z)z^{-1} - b_2Y(z)z^{-2}

    ```


    Separate variables:


    ```

    Y(z) + b_1Y(z)z^{-1} + b_2Y(z)z^{-2} = a_0X(z) + a_1X(z)z^{-1} + a_2X(z)z^{-2}

    Y(z)[1 + b_1z^{-1} + b_2z^{-2}] = X(z)[a_0 + a_1z^{-1} + a_2z^{-2}]

    ```


    Form transfer function


    ```

    H(z) = \frac{Y(z)}{X(z)} = \frac{a_0 + a_1z^{-1} + a_2z^{-2}}{1 + b_1z^{-1} +
    b_2z^{-2}}

    ```


    Factor out a_0


    ```

    H(z) = a_0 \frac{1 + \alpha_1z^{-1} + \alpha_2z^{-2}}{1 + b_1z^{-1} + b_2z^{-2}}   (5.87)

    ```


    where


    ```

    \alpha_1 = \frac{a_1}{a_0}

    \alpha_2 = \frac{a_2}{a_0}

    ```


