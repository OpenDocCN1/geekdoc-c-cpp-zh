    # 1.11 The One-Sample Delay


    Whereas analog processing circuits like tone-controls use capacitors and inductors
    to alter the phase and delay of the analog signal, digital algorithms use time-delay
    instead. You will uncover the math and science behind this fact later on in Chapters
    4 and 5 when you start to use it. In algorithm'
