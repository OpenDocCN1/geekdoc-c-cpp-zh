  md: 'This transfer function has one pole and one zero and both are first order.
    Like the other first-order cases, we can find the pole and zero by inspection
    of the transfer function:


    ```

    H(z) = a_0 \frac{1 + \alpha_1 z^{-1}}{1 + b_1 z^{-1}}

    \tag{5.80}

    = a_0 \frac{1 + \frac{\alpha_1}{z}}{1 + \frac{b_1}{z}}

    ```


    In the numerator, you can see that if \(z = -\alpha_1\) the numerator will go
    to zero and the transfer function will go to zero. In the denominator, you can
    see that if \(z = -b_1\) the denominator will go to zero and the transfer function
    will go to infinity. Therefore we have a zero at \(z = -\alpha_1\) and a pole
    at \(z = -b_1\). For this example, use the following values for the coefficients:
    \(a_0 = 1.0, a_1 = -0.92, b_1 = -0.71\). Then, \(\alpha_1 = -0.92\), and so we
    now have a zero at \(z = -\alpha_1 = 0.92 + j0\) and a pole at \(z = -b_1 = 0.71
    + j0\). The pole/zero pair are plotted in Figure 5.53.


    Evaluating the frequency response when you have mixed poles and zeros is the same
    as before, but you have to implement both magnitude steps.


    +   - Locate each evaluation frequency on the outer rim of the unit circle.

    +   - Draw a line from the point on the circle to *each zero* and measure the
    length of these vectors. Do it for each evaluation frequency.

    +   - Draw a line from the point on the circle to *each pole* and measure the
    length of these vectors. Do it for each evaluation frequency.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_154_0.png)


    **Figure 5.53:** The pole and zero are both purely real and plotted on the real
    axis in the z-plane.


    +   - Multiply all the zero magnitudes together.

    +   - Multiply all the *inverse* pole magnitudes together.

    +   - Divide the zero magnitude by the pole magnitude for the final result at
    that frequency.


    Mathematically, this last rule looks like Equation 5.81:'
