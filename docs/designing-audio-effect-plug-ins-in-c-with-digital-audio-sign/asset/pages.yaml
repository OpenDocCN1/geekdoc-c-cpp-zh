    # 2.5 The Applications Programming Interface


    In order for the client-server scheme to work, both the client and DLL/plug-in
    must agree on the naming of the functions. This includes the creation function
    and all of the functions that the client will be able to call on the plug-in object.
    The plug-in might have other functions that the client doesn''t know about, but
    they must agree on a basic set of them. Additionally, rules must be set up to
    define the sequence of function calls; the plug-in''s author (that''s you) will
    need to understand how the client intends to use the object.


    The client must make sure that once it establishes these rules it adheres to them
    in future versions to avoid breaking the plug-in. On the other hand, the plug-in
    must also promise to implement the basic required functions to make the plug-in
    work. So, you can see that there is an implied contract between the client and
    DLL server. This contract is the applications programming interface or API. It
    is a definition of the functions an object must implement to be considered a proper
    plug-in as well as any additional functions that may be called or overridden.
    It defines the function prototypes and describes how the functions will be called
