    \ series or parallel multiple modulation.\n+   - Use an LFO to modulate the carrier\
    \ frequency.\n\n# 14.3 Design a Wave Shaper Plug-In\n\nWave shaping is a method\
    \ of nonlinear processing that adds harmonics to the input signal as a result.\
    \ It is used in synthesizers and distortion algorithms. Because harmonics are\
    \ added to the signal, wave shapers suffer from aliasing problems, like the ring\
    \ modulator. The process of wave shaping is simple because no memory elements\
    \ are required. You treat the input signal x as the argument to a function. The\
    \ function is often a trigonometric or polynomial function. An interesting function\
    \ to use is the arctangent. It is part of a family of functions called sigmoid\
    \ functions. Sigmoid functions produce S-shaped curves. The amplitude transfer\
    \ function of a vacuum tube generally resembles a sigmoid, so this function can\
    \ be used to try to mimic a tube sound. Figure 14.3 shows the arctangent function\
    \ atan(kx), where k controls the amplitude of the input value and thus the amount\
    \ of nonlinear processing applied. The exact equation is shown in Equation 14.2,\
    \ where a normalization factor has been added to restrict the output to the range\
    \ of -1 to +1. You can see in Figure 14.3 that with k = 1, the input/output relationship\
    \ is nearly linear. As k increases, the S-shaped curve emerges and adds gain.\
    \ For example, with k = 5 and x(n) = 0.25, y(n) is about 0.6.\n\n```\ny(n) = \\\
    frac{1}{\\arctan(k)} \\arctan(kx(n)) (14.2)\n```\n\nAsymmetrical distortion can\
    \ be implemented easily by using two different k-values, one for positive input\
    \ samples and the other for negative ones. This asymmetrical distortion is found\
    \ in Class-A tube circuits. Cascading multiple stages will result in more harmonic\
    \ distortion. In some amplifiers, many stages are cascaded in series. Class A\
    \ tube circuits also invert the signal. This means that the"
