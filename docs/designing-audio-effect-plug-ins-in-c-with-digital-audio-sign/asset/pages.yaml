    with the coefficient placed outside the triangle; this is another common way to
    designate it. (a) Simple scalar multiplication by an arbitrary value “a”. (b)
    Gain is accomplished with a coefficient magnitude greater than one. (c) Attenuation
    reduces the size of the input value with a coefficient that is less than one.
    (d) Phase inversion turns the signal upside down by using a negative coefficient;
    a value of –1.0 perfectly inverts the signal.


