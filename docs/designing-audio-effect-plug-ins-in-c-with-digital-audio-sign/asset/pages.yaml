    \ interpolation method. Since it's linear interpolation, a line is drawn between\
    \ the adjacent samples and the interpolated value is found on the line at 0.7183\
    \ the distance between the two samples.\n\nIn polynomial interpolation such as\
    \ LaGrange interpolation, a curve is drawn between the points (or a series of\
    \ points), and then the interpolated value is found on that curve. There are several\
    \ ways to"
