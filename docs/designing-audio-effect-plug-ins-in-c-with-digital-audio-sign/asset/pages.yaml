    # 6.5 Effect of Poles or Zeros at Infinity


    In the analog transfer function (Equation 6.19) of the previous example, you can
    see that there is an analog pole at s = -1 since that would make the transfer
    function go to infinity, and there is a zero at s = \infty because that will cause
    H(s) to become 0.0. There is also a zero at s = -\infty. Interestingly, these
    two infinity values are in the same location because the reality is that the sand
    j\omega axis actually wrap around an infinitely large sphere and touch each other
    at \pm\infty. So, in this first-order case engineers only show the single zero
    at infinity and they use the one at -\infty so this transfer function''s pole
    and zero would be plotted like Figure 6.16 in the s-plane. For low-pass zeros
    at infinity, the bilinear transform maps the zero at infinity to z = -1 (Nyquist)
    (Figure 6.17).'
