    # 5.3 Time Delay as a Math Operator


    The next piece of DSP theory you need to understand is the concept of time delay
    as a mathematical operator. This will be pretty easy since we are going to exploit
    the simple mathematical behavior of the $e^{j\omega t}$ function. First, consider
    a complex sinusoid and a delayed complex sinusoid (Figure 5.4).


    How does the delay of $n$ seconds change the complex sinusoid equation? Since
    positive time goes in the positive $x$ direction, a delay of $n$ seconds is a
    shifting of $-n$ seconds. In the complex sinusoid equation, you would then replace
    $t$ with $t-n$. In other words, any point on the delayed curve is the same as
    the nondelayed curve minus $n$ seconds. Therefore, the delayed sinusoid is


    ```

    Delayed sinusoid = $e^{j\omega(t-n)}$ (5.10)

    ```


    But, by using the polynomial behavior of $e$ and running Equation 5.5 in reverse,
    you can rewrite it as shown in Equation 5.11:


    ```

    $e^{j\omega(t-n)} = e^{j\omega t} e^{-j\omega n}$ (5.11)

    ```


    It’s a subtle mathematical equation but it says a lot: if you want to delay a
    complex sinusoid by $n$ seconds, multiply it by $e^{-j\omega n}$—this allows us
    to express time delay as a mathematical operator.'
