- pgno: 17
  md: '# Introduction


    When I started teaching in the Music Engineering Technology Program at the University
    of Miami in 1996, we were writing signal processing algorithms in digital signal
    processing (DSP) assembly language and loading them on to DSP evaluation boards
    for testing. We had also just begun teaching a software plug-in programming class,
    since computers were finally at the point where native processing was feasible.
    I began teaching Microsoft''s DirectX® in 1997 and immediately began a book/manual
    on converting DSP algorithms into C++ code for the DirectX platform. A year later
    I had my first manuscript of what would be a thick DirectX programming book. However,
    I had two problems on my hands: first, DirectX is bloated with Common Object Model
    (COM) programming, and it seemed like the lion''s share of the book was really
    devoted to teaching basic COM skills rather than converting audio signal processing
    algorithms into C++, creating a graphical user interface (GUI), and handling user
    input. More importantly, developers had dropped DirectX in favor of a new, lean,
    cross-platform compatible plug-in format called Steinberg VST®, written in “straight”
    C++ without the need for operating system (OS) specific components. After taking
    one look at the Virtual Studio Technology (VST) applications programming interface
    (API), I immediately dropped all DirectX development, wrote VST plug-ins all summer,
    and then switched to teaching it the following year. And, I put my now-obsolete
    manuscript on the shelf.


    After half a dozen semesters teaching VST programming, a few things had become
    clear. For any given project, the students were spending more time dealing with
    setting up and maintaining a GUI than they were with the audio signal processing
    code. Instead of being on the Internet to look for cool processing algorithms,
    they were searching for knob and switch bitmaps. While I can certainly appreciate
    a nice-looking GUI, I was trying to teach audio signal processing and not graphic
    design. I next spent some time trying to come up with some kind of way to speed
    up the GUI programming, and I wrote a helper program that let students define
    lists of variable names, data types, minimum, maximum, and initial values. Then
    it would synthesize the code for handling part of the GUI interaction. The actual
    GUI itself was another problem, and I spent years trying to come up with a way
    to free the students (and myself) from dealing with the hassles of designing and
    maintaining a GUI. Around 2004, as a result of a consulting job, I needed to come
    up with a simple C++ based audio signal processing API—my own plug-in format.
    I would also need to write my own plug-in client, the software that would load
    and process data through my plug-ins. I was determined to write an API that was
    far simpler and leaner than even VST. And, I wanted my client software to handle
    100% of the GUI details so I could focus on the signal processing work for my
    consulting client. This would also make great software to teach audio signal processing
    and plug-in programming simultaneously.


    Since 2009 I''ve been using my RackAFX™ software in the classroom at both the
    graduate and undergraduate levels. My students never cease to amaze me with what
    they design. Currently, RackAFX runs on the Windows® OS and generates plug-ins
    that are compatible with it and optionally VST as well. You can develop your plug-in
    in RackAFX, then use it in any Windows VST client.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'RackAFX runs in tandem with Microsoft Visual Studio compilers, even the free
    ones. It sets up your project files, writes GUI code for you, and allows you to
    remotely launch some compiler functions from its control surface. Once you understand
    how the RackAFX API works, learning other commercial plug-in in APIs will be much
    easier because most plug-in APIs share similar methods and set-up sequences. And,
    since RackAFX plug-ins are written in C++, the plug-in objects can be compiled
    on different platforms and embedded (or wrapped) to operate in just about any
    signal processing environment. We are currently running RackAFX plug-ins in Apple''s
    iOS® in one of my other classes.


    In the fall of 2010 I began writing and handing out chapters, one at a time, to
    students in a graduate-level class. The chapters combined DSP theory, audio algorithms,
    and programming in the proportions I had always wanted, including difference equations
    and derivations that were fully worked out. The RackAFX API requires zero GUI
    programming. It isn''t tied to a licensed product that I have to worry will become
    obsolete or will change in complexity or underlying design. Most importantly,
    if you can learn to write RackAFX plug-ins, you can learn to write for just about
    any other API on the platform you choose. See Appendix A for more information.


    Those initial grad students helped shape the direction and flow of the book (perhaps
    without knowing it). I wanted the book to be aimed at people with programming
    skills who wanted to get into audio signal processing or the other way around.
    Academic types that are tired of using mathematical software to try to do real-time
    signal processing should also benefit. The API does not require a steep learning
