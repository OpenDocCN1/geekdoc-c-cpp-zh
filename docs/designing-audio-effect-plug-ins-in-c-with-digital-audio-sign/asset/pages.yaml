- pgno: 176
  md: 'For BPF and BSF:


    +   - Specify \(\omega_{dL}\) and \(\omega_{dH}\), the lower and upper corner
    frequencies of the digital filter.

    +   - Calculate the two analog corner frequencies with Equation 6.16:


    ```

    \(\omega_{al} = \tan \left[ \frac{\omega_{dl} f_s}{2} \right]\)

    \(\omega_{aH} = \tan \left[ \frac{\omega_{dH} f_s}{2} \right]\)

    \(\omega_0^2 = \omega_{al} \omega_{aH}\)

    \(W = \omega_{aH} - \omega_{al}\)

    (6.16)

    ```


    Next, scale the filter with Equation 6.17:


    | Filter Type | Scaling Factor |

    | :--- | :--- |

    | LPF | \(s = \frac{s}{\omega_a}\) |

    | HPF | \(s = \frac{\omega_a}{s}\) |

    | BPF | \(s = \frac{s^2 + \omega_0^2}{Ws}\) |

    | BSF | \(s = \frac{Ws}{s^2 + \omega_0^2}\) |

    (6.17)


    # Example:


    Convert the basic resistor-capacitor (RC) analog LPF in Figure 6.14 into a digital
    LPF. The sample rate is 44.1 kHz and the desired cutoff frequency is 1 kHz.


    Step 1: Get the normalized \(H(s)\):


    ```

    \(H(j\omega) = \frac{1}{j\omega RC + 1}\)

    Let \(s = j\omega\)

    Normalize by setting RC = 1

    \(H(s) = \frac{1}{s + 1}\)

    (6.18)

    ```


    Step 2: Calculate the pre-warped analog cutoff:


    ```

    \(f_c = 1 \text{ kHz}\)

    \(\omega_d = 2\pi f_c = 6283.2 \text{ rad/sec}\)

    (6.19)

    \(\omega_a = \tan \left( \frac{\omega_d T}{2} \right) = \tan \left[ \frac{(6283.2)(1/44100)}{2}
    \right] = 0.07136\)

    (6.20)

    ```'
