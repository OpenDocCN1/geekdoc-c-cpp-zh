    # 7.2.2 The Effect of Feedback


    When you add feedback to the delay, two things happen: first, for long delays
    your ear will hear discrete repeating echoes that decay away after the signal
    is removed. As the delay time gets shorter and shorter, the echoes merge, begin
    to ping, and then the actual filtering (which has been going on all the time)
    now dominates what you hear.


    In Figure 7.16, you can see the effect of feedback on the impulse response. The
    initial impulse is the one through the dry path, and the next identical-sized
    one is the first output of the delay line. The echoes decay, being reduced 90%
    on each trip through the filter. To understand the effect on frequency response,
    write the transfer function and take the z transform. To make it easier to find
    the pole frequencies, let the feedback value become 100% or 1.0, as shown in the
    block diagram in Figure 7.17; even though we know this would result in oscillation,
    it will make calculating the frequencies easier.'
