    The transfer function of the filter is the ratio of output to input. The frequency
    response of the filter is the magnitude of the transfer function evaluated at
    different frequencies across its spectrum. The phase response of the filter is
    the argument (or angle) of the transfer function evaluated at different frequencies
    across its spectrum. To produce the frequency and phase response graphs, you evaluate
    the function for various values of \(\omega\) then find the magnitude and argument
    at each frequency. The evaluation uses Euler''s equation to replace the e term
    and produce the real and imaginary components.


    What is so significant about this is that the transfer function is not dependent
    on time even though the input and output signals are functions of time. The transfer
    function (Equation 5.14) is only dependent on frequency \(\omega\), so we call
    it \(H(\omega)\).


    \(H(\omega) = a_0 + a_1 e^{-j\omega 1}\) (5.14)


