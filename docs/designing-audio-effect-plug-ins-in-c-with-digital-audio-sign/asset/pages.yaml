  md: "```\n```cpp\nbool __stdcall CSimpleHPF::processAudioFrame(float* pInputBuffer,\
    \ float*\npOutputBuffer, UINT uNumChannels)\n{\n    // Do LEFT (MONO)\n    //\n\
    \    // Input sample is x(n)\n    float xn = pInputBuffer[0];\n\n    // READ:\
    \ Delay sample is x(n-1)\n    float xn_1 = m_f_z1_left;\n\n    // Difference Equation\n\
    \    float yn = m_f_a0_left*xn + m_f_a1_left*xn_1;\n\n    // WRITE: Delay with\
    \ current x(n)\n    m_f_z1_left = xn;\n\n    // Output sample is y(n)\n    pOutputBuffer[0]\
    \ = yn;\n}\n```\n```\n\nOK, now it's your turn to implement the other channel.\
    \ Give it a try by yourself before proceeding. You should have something like\
    \ this for the rest of the function:\n\n```\n```cpp\n// Mono-In, Stereo-Out (AUX\
    \ Effect)\nif(uNumInputChannels == 1 && uNumOutputChannels == 2)\n    pOutputBuffer[1]\
    \ = yn;\n\n// Stereo-In, Stereo-Out (INSERT Effect)\nif(uNumInputChannels == 2\
    \ && uNumOutputChannels == 2)\n{\n    // Input sample is x(n)\n    float xn =\
    \ pInputBuffer[1];\n\n    // Delay sample is x(n-1)\n    float xn_1 = m_f_z1_right;\n\
    \n    // Difference Equation\n    float yn = m_f_a0_right*xn + m_f_a1_right*xn_1;\n\
    \n    // Populate Delay with current x(n)\n    m_f_z1_right = xn;\n\n    // Output\
    \ sample is y(n)\n    pOutputBuffer[1] = yn;\n}\n\nreturn true;\n}\n```\n```\n\
    \nFlush out delay elements in preparation for each play event in the plug-in.\
    \ You generally do not want old data sitting inside these storage registers. The\
    \ only exceptions are delay-looping effects where you exploit the old data. This\
    \ is done in prepareForPlay().\n\n# userInterfaceChange()\n\n+   * Store the new\
