  md: 'then used RackAFX to check our results. We also classified the filters into
    IIR and Finite Impulse Response (FIR) types.


    # IIR Filters


    +   - Any filter with a feed-back path is IIR in nature, even if it has feed-forward
    branches as well.

    +   - The feed-back paths in IIR filters produce poles in the z-plane and the
    poles cause gain to occur in the magnitude response.

    +   - An IIR filter can blow up when its output steadily increases toward infinity,
    which occurs when the poles are located outside the unit circle.

    +   - If the IIR filter also has feed-forward branches it will produce zeros as
    well as poles.

    +   - IIR filters can have fast transient responses but may ring.


    # FIR Filters


    The FIR filter only has feed-forward paths.


    +   - It only produces zeros in the z-plane.

    +   - The FIR filter is unconditionally stable since its output can only go to
    zero in the worst case.

    +   - FIR filters will have slower transient responses because of the time smearing
    they do on the impulse response.

    +   - The more delay elements in the FIR, the poorer the transient response becomes.


