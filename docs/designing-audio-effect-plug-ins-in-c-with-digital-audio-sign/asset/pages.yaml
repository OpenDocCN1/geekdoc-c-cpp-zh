    # 12.4 Design an Envelope Follower Plug-In


    While the straight-up mod filter is pretty interesting, it has a mechanical quality
    about it due to the LFO modulations. This might not be an issue for a synthesizer,
    but it does not sound musically dynamic. We can correlate the modulation to the
    musical input signal by implementing an envelope follower, which uses the amplitude
    envelope of the input signal to control the filter parameters. For example, we
    can code it so that when the input signal has a high amplitude, the $f_c$ is modulated
    *up* to a higher value, and of course as the plug-in creators, we can also do
    the opposite kind of modulation.

    The envelope follower requires an audio envelope detector, and you can use one
    built into RackAFX. We will use the same second-order LPF as the filter to modulate;
    then you can try different filter types on your own. First, take a look at the
    block diagram in Figure 12.8.


    The parameters are as follows:


    +   - Pre-gain: 0 to +20 dB of pre-gain to drive the detection circuit

    +   - Threshold (the value the signal has to cross to engage the detector)

    +   - Envelope attack time (mSec)

    +   - Envelope release time (mSec)

    +   - Up/down mod control (determines whether positive amplitude excursions result
    in positive or negative $f_c$ excursions)

