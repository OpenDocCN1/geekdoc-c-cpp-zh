- pgno: 486
  md: "The fundamental difference in the processing functions is in how the data arrives.\
    \ In RackAFX, the default mechanism is that it arrives in frames, where each frame\
    \ is a sample from each channel. The frames arrive as pointers to buffers. In\
    \ VST, the audio is processed in buffers of frames, rather than single frames.\
    \ Figure A.3 shows a two-channel in and two-channel out VST setup.\n\n![](img/b54974d0a4317ec82d7ae02126d10a6f_486_0.png)\n\
    \n# Figure A.3: VST audio data is delivered in buffers of frames.\n\nInstead of\
    \ passing a pointer to a buffer, you pass a pointer to a buffer of pointers, or\
    \ float** variables. The processReplacing() method also passes you a count of\
    \ the number of frames. You use these variables to iterate through and access\
    \ your audio data. VST was designed to allow you to have any number of input and\
    \ output channels, which you specify in the constructor. The parameters that are\
    \ passed to the processReplacing() method are as follows:\n\n+   - float** inputs:\
    \ A pointer to a buffer of pointers to input buffers\n+   - float** outputs: A\
    \ pointer to a buffer of pointers to output buffers\n+   - Long sampleframes:\
    \ The count of frames in each buffer\n\n```\nvoid CDelay::processReplacing(float\
    \ **inputs, float **outputs, long sampleframes)\n{\n    // pick up pointers to\
    \ buffers\n    float *inL = inputs[0];\n    float *inR = inputs[1];\n    float\
    \ *outL = outputs[0];\n    float *outR = outputs[1];\n\n    UINT uFrameCount =\
    \ 0;\n\n    while (--sampleFrames > 0)\n    {\n        // pick up samples from\
    \ buffers\n        float fxnL = inL[uFrameCount];\n        float fxnR = inR[uFrameCount];\n\
    \n        // calculate and write out\n        outL[uFrameCount] = doLeftDelayFunction(fxnL);\n\
    \        outR[uFrameCount] = doRightDelayFunction(fxnR);\n\n        // inc frame\
    \ counter\n        uFrameCount++;\n    }\n}\n```\n\nYou can now see the similarities\
    \ and differences in RackAFX and VST:"
