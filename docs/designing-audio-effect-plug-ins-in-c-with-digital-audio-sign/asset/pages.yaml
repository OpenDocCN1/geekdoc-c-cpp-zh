  md: 'they are added together in equal ratios. What about other frequencies like
    ½ and ¼ Nyquist? They are a bit more laborious to work through but worth the effort.
    By now you can see how the data moves through the filter, so let’s use a table
    (Table 4.1) and move the data through it instead. The ½ Nyquist sequence is x(n)
    = {..., 0, +1.0, 0.0, -1.0, 0.0, +1.0, 0.0, ...}.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_88_0.png)


    Figure 4.10: The input and output sequences for the filter in Figure 4.6 at DC
    or 0 Hz.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_88_1.png)


    Figure 4.11: The Nyquist sequence is applied to the filter. Notice how the delay
    element has been zeroed out. The output for the first iteration is y(n) = 0.5.'
