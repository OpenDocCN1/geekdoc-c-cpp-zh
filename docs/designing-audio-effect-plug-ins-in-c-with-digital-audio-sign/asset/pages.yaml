    # 8.5 Complementary Filter Design for Linear Phase FIR Filters


    This technique results in a complementary filter, rotated about the center of
    the Nyquist bandwidth, that is, rotated about Nyquist/2. To convert an LPF to
    HPF or vice versa on a linear phase FIR:


    For N = even


    +   Multiply the even-numbered coefficients by -1.


    For N = odd


    +   Multiply the odd-numbered coefficients by -1.


    This will rotate the frequency response around Nyquist/2 such that an LPF will
    become an HPF.'
