  md: "```\nvoid CModFilter::calculateLPFCoeffs(float fCutoffFreq, float fQ, CBiquad*\
    \ pFilter)\n{\n    // use same terms as book\n    float theta_c = 2.0f*pi*fCutoffFreq/(float)m_nSampleRate;\n\
    \    float d = 1.0f/fQ;\n\n    float fBetaNumerator = 1.0 - ((d/2.0)*(sin(theta_c)));\n\
    \    float fBetaDenominator = 1.0 + ((d/2.0)*(sin(theta_c)));\n\n    float fBeta\
    \ = 0.5*(fBetaNumerator/fBetaDenominator);\n\n    float fGamma = (0.5 + fBeta)*(cos(theta_c));\n\
    \n    float fAlpha = (0.5 + fBeta - fGamma)/2.0;\n\n    // apply to filter\n \
    \   pFilter->m_f_a0 = fAlpha;\n    pFilter->m_f_a1 = 2.0f*fAlpha;\n    pFilter->m_f_a2\
    \ = fAlpha;\n    pFilter->m_f_b1 = -2.0f*fGamma;\n    pFilter->m_f_b2 = 2.0f*fBeta;\n\
    }\n```\n\n# prepareForPlay()\n\n+   - Flush delays in LPFs.\n+   - Set up the\
