  md: '# 3.12 Design a High-Frequency Tone Control with Volume Plug-In


    This final example will show you how to deal with more than one slider control
    by simply adding a volume-in-dB control to the block diagram. The plan is to add
    another slider to the existing plug-in; the new slider will control the overall
    volume of the plug-in in dB. You already know how to implement both parts of it,
    so this exercise is really more about adding new controls to an existing project.


    # 3.12.1 Project: SimpleHPF


    Open your SimpleHPF project in RackAFX using the Open button or the menu/toolbar
    items.


    # 3.12.2 SimpleHPF GUI


    Add the new volume slider: Right-click on the second slider group and add a new
    slider for the volume control, in dB, and use the exact same variable name and
    settings as in the VolumedB project. You should end up with a GUI like that in
    Figure 3.21.


    # 3.12.3 SimpleHPF.h File


    Add your own m_fVolume variable to handle the cooked volume data, just as before.


    ```

    // Add your code here:

