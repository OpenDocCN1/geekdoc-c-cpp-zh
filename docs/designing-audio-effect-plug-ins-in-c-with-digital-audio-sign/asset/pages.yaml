    \    float fLookAheadOut = 0;\n    m_RightDelay.processAudio(&InputBuffer[1],\
    \ &fLookAheadOut);\n\n    etc..\n}\n```\n\n# 13.5 Design a Spectral Compressor/Expander\
    \ Plug-In\n\nIn this project, you will design a spectral dynamics processor. A\
    \ spectral processor splits up the input signal into two or more frequency bands,\
    \ then applies signal processing independently to each band. Finally, the processed\
    \ filtered outputs are summed to produce the final output. In this way, you can\
    \ apply signal processing to only one band of frequencies, or apply different\
    \ types of processing to different bands. In this design, we will create a two-band\
    \ spectral compressor/expander. We will use complementary low-pass filter (LPF)\
    \ and high-pass filter (HPF) units to split the incoming audio into two bands:\
    \ low-frequency (LF) and high-frequency (HF). Then, we will process each band\
    \ independently and recombine the outputs as shown in Figure 13.11. You can compress,\
    \ say, only the HF content to squash cymbals and other sibilance. Or you can smooth\
    \ out the bass by compressing it slightly, or any combination of both that you\
    \ like.\n\nTake a look at Figure 13.8 and check out the features. The input LPF\
    \ and HPF are adjusted with a single fc control. This means their cut-off points\
    \ are always overlapping. The outputs are processed through two independent dynamics\
    \ processors with independent make-up gains, then the results are summed back\
    \ together. This means the UI is going to contain a lot of sliders. But, RackAFX\
    \ will be taking care of most of the GUI details. We need to focus on the input\
    \ filter-bank first.\n\nFor the input LPF and HPF we will be using a special variant\
    \ on the Butterworth filter called the Linkwitz-Riley filter (Equation 13.3).\
    \ It has the same second-order roll-off as the Butterworth, but the cutoff point\
    \ is -6 dB rather than -3 dB so that recombining the filtered signals results\
    \ in a flat response. Remember that filters alter the phase response as well,\
    \ so recombining them in parallel offers a special problem with how the phases\
    \ recombine. For the two signals to recombine properly, you must invert one of\
    \ the filter outputs. It doesn't matter whether you invert the LPF or HPF output\
    \ as long as you invert one of them. This is specific to the Linkwitz-Riley filters.\
    \ The filter design equations are shown from Chapter 6."
