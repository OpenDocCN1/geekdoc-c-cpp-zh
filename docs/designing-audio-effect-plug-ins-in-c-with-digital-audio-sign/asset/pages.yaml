    mode can be set for peak, MS, or RMS. Because audio signals must be on the range
    of –1.0 to +1.0 in RackAFX, this means that the squaring function of the MS and
    RMS modes will produce a value that is less than the instantaneous value. In RMS
    mode, the MS value is square-rooted, which makes the resulting envelope even smaller.
    Thus, you need to use care with the MS and RMS modes. In this envelope follower,
    we will use the RMS value to trigger our dynamic filter.


    The time constant determines how fast the detector rises or falls to its maximum
    (1.0) and minimum (0.0) values. In an analog circuit, the resistor–capacitor (RC)
    rise and fall times are only 63.3% of the edge. In digital systems, the value
    is usually 80% to 99%. The envelope detector has a control to allow you to change
    the time constant from the very fast (digital) version or the slower (analog)
    version. We''ll try both types in the envelope follower plug-in.


