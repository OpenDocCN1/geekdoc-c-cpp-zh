- pgno: 324
  md: "| Chorus | 7 | 20-40 | 50/50 | Typically 0 |\n|---|---|---|---|---|\n\n```\n\
    ```cpp\ncase Chorus:\n{\n  m_fMinDelay_mSec = 5;\n  m_fMaxDelay_mSec = 30;\n \
    \ m_DDL.m_fWetLevel_pct = 50.0;\n  m_DDL.m_fInputAttenuation = 1.0;\n  break;\n\
    }\ndefault: // is Flanger\n{\n  m_fMinDelay_mSec = 0;\n  m_fMaxDelay_mSec = 7;\n\
    \  m_DDL.m_fWetLevel_pct = 50.0;\n  m_DDL.m_fFeedback_pct = m_fFeedback_pct;\n\
    \  break;\n}\n```\n```\n\nWrite the calculateDelayOffset() function. It works\
    \ by taking the LFO value from 0 to 1.0 and mapping it on to the range from min\
    \ to max delay. Then, this value is scaled by the depth percent value so that\
    \ at 100% the maximum range is used. For the chorus, we effectively move the operating\
    \ range and chorus center by adding a delay offset to the minimum value, then\
    \ using that as the starting (reference) point in the calculation.\n\n```\n```cpp\n\
    // calculateDelayOffset():\n/*\n fLFOSample: a value from 0.0 to 1.0 from the\
    \ LFO object\n\n returns: the calculated delay time in mSec for each effect\n\n\
    \ NOTES: - the range for the flanger/vibrato is simply mapped from min to max\n\
    \         starting at min: fLFOSample*(m_fMaxDelay_mSec - m_fMinDelay_mSec) +\n\
    \         m_fMinDelay_mSec\n     \n     - the range for the Chorus includes the\
    \ starting offset\n        fStart = m_fMinDelay_mSec + m_fChorusOffset;\n*/\n\
    if(m_uModType == Flanger || m_uModType == Vibrato)\n{\n  // flanger 0-1 gets mapped\
    \ to 0->maxdelay\n  return (m_fModDepth_pct/100.0)*(fLFOSample*(m_fMaxDelay_mSec\
    \ -\n  m_fMinDelay_mSec)) + m_fMinDelay_mSec;\n}\nelse if(m_uModType == Chorus)\n\
    {\n  // chorus adds starting offset to move delay range\n  float fStart = m_fMinDelay_mSec\
    \ + m_fChorusOffset;\n  return (m_fModDepth_pct/100.0)*(fLFOSample*(m_fMaxDelay_mSec\
    \ -\n  m_fMinDelay_mSec)) + fStart;\n}\n```\n```\n\n# 10.3.5 PrepareForPlay()\n\
    \n+   - Forward the call to prepareForPlay() on the member objects.\n+   - Reset\
    \ and start up the LFO in unipolar mode."
