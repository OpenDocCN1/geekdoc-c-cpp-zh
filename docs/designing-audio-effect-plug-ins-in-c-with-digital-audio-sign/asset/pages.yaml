    # # 12.5 Envelope Detection


    Software envelope detectors are based on the analog circuits that preceded them.
    The two basic types of detectors are half-wave and full-wave, depending on whether
    they track either the positive or negative portion of the input waveform (half-wave)
    or both portions (fullwave). Many of the classic hardware devices used the half-wave
    version. Either the positive or negative portion may be tracked. The circuit consists
    of a diode to half-wave-rectify the signal, followed by a “tank” capacitor. The
    capacitor charges and discharges along with the audio signal. The attack knob
    is a potentiometer in series with the diode; it controls the rate at which the
    cap charges. The release knob is a potentiometer connected to ground through which
    the cap discharges. The RC combinations (one for the charging side and the other
    for the discharging side) create the attack and release times of the detector
    (Figure 12.9). The positive portion of the waveform is detected and tracks the
    input according to the attack and release times (Figures 12.10 and 12.11).


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_409_0.png)


    Figure 12.9: A simple positive half-wave detector.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_409_1.png)


    Figure 12.10: Detector output (solid dark line) with short attack and release
    times.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_409_2.png)'
