    # B.2 The Vector Joystick Control


    RackAFX also has a dedicated vector joystick control that communicates with your
    plug-in. Dave Smith designed the first vector synthesizers for Sequential Circuits,
    Inc. and then later for Yamaha and Korg. The vector joystick is a combination
    of a traditional x/y track-pad and an exponential joystick. The calculation documentation
    is available on the website. In the original synthesizers, the vector joystick
    was used to program or alter in real time the mixture of two or four different
    waveforms. The position of the joystick determines the mix ratios, which are not
    linear but rather exponential. In RackAFX, you can use the joystick to alter up
    to four different parameters at once, exponentially. In addition, a linear x/y
    value of the joystick location is available for your plug-in. Figure B.5 shows
    the vector joystick and components.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_495_2.png)


    Figure B.5: The RackAFX vector joystick.


    The joystick is arranged in a diagonal with four corners labeled A, B, C, D, clockwise;
    this is in keeping with Dave Smith''s original lingo. As the joystick moves around,
    a new set of mix ratios is generated and appears in the mix blurb. The mix ratios
    will always add up to 1.0. In the center, the'
  merge: -1
  img_proc: true
- pgno: 496
  md: 'ratios are all 0.25. A second set of values also exists, the AC-mix and the
    BD-mix, which are linear. On the AC axis, 0 is at the A apex and 1.0 is at the
    C corner. On the BD axis, 0 is at D and 1.0 is at B. In the center position, the
    AC-mix is 0.5 and the BD-mix is also 0.5. Figure B.6 shows the joystick roughly
    three-quarters of the way from the origin to the A corner. However, the mix blurb
    shows the value of A to be 0.79, but the other three have dropped off substantially.
    With the joystick all the way in the A corner, the ratios are {A, B, C, D} = {1,
    0, 0, 0} and interestingly, as Figure B.7 demonstrates, when the joystick is halfway
    between A and B on the outer edge of the diamond, the A/B ratio is 50/50 while
    the rest are 0. In Figure B.7, the AC-mix is 0.25 and the BD-mix is 0.75.


    By sweeping around the field, you can generate many different combinations. You
    could use these combinations as mix ratios for something in your plug-in. Or,
    you could use them to control any parameter or other aspect of the plug-in that
    you like. You are responsible for mapping the 0.0 to 1.0 values to your plug-in''s
    parameters. The vector joystick does not connect to any variable in your plug-in;
    like the assignable buttons, these passive controls simply tell you when they''ve
    moved. When the joystick moves, a function called joystickControlChange() is called.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_496_0.png)


    # Figure B.6: The exponential mix ratios are evident in the vector joystick.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_496_1.png)


    # Figure B.7: This position results in the 50/50 mix of A/B only. AC-mix = 0.25,
    BD-mix = 0.75.'
