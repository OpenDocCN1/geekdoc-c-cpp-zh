    \nIn this function, you tie all the member objects together by creating variables\
    \ to pass into/out of their processAudio() functions. By stepping through the\
    \ code, you can see just how the series and parallel elements are connected. You\
    \ can always go back and make this code more streamlined by removing intermediate\
    \ variables, and so on. The four outputs of each comb filter bank are mixed at\
    \ 15% ratios with alternating signs.\n\n```\nbool __stdcall CReverb::processAudioFrame(float*\
    \ pInputBuffer, float* pOutputBuffer, UINT uNumInputChannels, UINT uNumOutputChannels)\n\
