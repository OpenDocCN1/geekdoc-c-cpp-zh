- pgno: 70
  md: 'next chapter, it''s worth it to go ahead and build a plug-in that uses it.
    After this exercise, you will be able to build almost any kind of DSP filter that
    uses one-sample-delay elements—and that''s a lot of DSP filters. The later examples
    in the book will not be as detailed regarding the operation of RackAFX and your
    C++ compiler, so be sure you understand how to manipulate the software as needed
    to complete the project. Figure 3.16 shows the block diagram for the filter.


    The design equation is as follows:


    ```

    0.0 <= a1 <= 0.49

    a0 = a1 - 1.0

    (3.3)

    ```


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_70_0.png)


    # Figure 3.16: The HF tone control block diagram.


    You already know that the coefficients a0 and a1 will become float member variables
    in our plug-in. But what about the one-sample-delay element, z^-1? In hardware,
    this would be a register to store the sample for one clock period. In software,
    it simply becomes another float variable, but it must be able to persist over
    the lifetime of a processing cycle. Therefore, like the coefficients, it will
    become a float member variable of our plug-in object.


    You will do an example using arrays of floats in Chapter 7 when you implement
    digital delay lines that require long strings of z^-1 elements. For now, we need
    to implement the single z^-1 element in the block diagram. Right away, we need
    to decide if we are going to support multichannel (stereo) operation.


    The last rule is really important and it is easy to get into trouble if you do
    not follow it. Unless the algorithm specifically deals with multichannel data,
    you will need to implement a separate algorithm for each channel, which means
    having separate coefficient and data (z^-1) elements for each channel. Even if
    you might be able to share the coefficients, you can never share the delay elements.
    We will need to declare variables for the following:


    +   * Left channel a0 and a1 variables

    +   * Left channel z^-1 variable

    +   * Right channel a0 and a1 variables

    +   * Right channel z^-1 variable


    Delay elements will become float member variables in your plug-in object. For
    single-delay elements, you can simply assign separate variables. For multiple-sample-delay
    elements you may also use float arrays to store the data.'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'A DSP filtering algorithm, which is only described in mono or single channel
    format, that is, one input, x(n), and one output, y(n), cannot share delay elements
    between multiple channels. This means that you must duplicate your algorithms
    so that you have one set of variables for the left channel and one for the right
    channel.


    # ## 3.11.1 Project: SimpleHPF


    This plug-in is going to implement a very primitive HF (high frequency) tone control
    that behaves like a high-pass filter. It will attenuate low frequencies, leaving
    only the highest frequencies intact. Using the same method as before, create a
    new project named “SimpleHPF.” Check your compiler to make sure the project was
    created properly.


    # ## 3.11.2 SimpleHPF GUI


    This simple plug-in will only have one slider that will control the value of the
    a1 coefficient. The other coefficient is calculated from it. The specifications
    show that a1 varies between 0 and 0.49. Set up the slider according to the properties
    in Table 3.2.


    # ## 3.11.3 SimpleHPF.h File


    To figure out what the CSimpleHPF object is going to have to do, first write the
    difference equation. Examine it and figure out which components are going to become
    coefficients and which are going to be memory locations. Also, figure out any
    intermediate variables you might need. You can figure out the difference equation
    by using the rules you learned in Chapter 1 to chart the input and output signals.
    Make sure you understand how this equation is formed from the block diagram in
    Figure 3.17.


    The difference equation is as follows:


    y(n) = a0x(n) + a1x(n – 1) (3.4)


    Next, figure out which block diagram components become variables in your C++ code.
    The coefficients a0 and a1 will become a float member variable in the code. Even
    though we might be tempted to share the coefficients, these are separate left
    and right algorithms that have separate delay elements, so let’s implement two
    sets, one each for the left and right channels.


    **Table 3.2: The slider properties for the SimpleHPF project.**


    | Slider Property | Value |

    | :--- | :--- |

    | Control name | a1 |

    | Units | |

    | Variable type | float |

    | Variable name | m_fslider_a1 |

    | Low limit | 0.0 |'
