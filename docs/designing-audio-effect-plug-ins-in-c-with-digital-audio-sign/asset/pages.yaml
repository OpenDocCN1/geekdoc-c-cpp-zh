    \ -> fAPF_2_Out\n    float fAPF_2_Out = 0;\n    m_InputAPF_2.processAudio(&fAPF_1_Out,\
    \ &fAPF_2_Out);\n    // fAPF_2_Out -> fInputLPF\n    float fInputLPF = 0;\n  \
