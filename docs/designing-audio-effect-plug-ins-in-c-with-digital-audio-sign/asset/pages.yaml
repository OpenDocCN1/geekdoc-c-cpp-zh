    The problem with this setup is that the pole radii are no longer the same (circular
    in the z plane) and we know that this produces coloration in the signal. The solution
    (Jot 1992) was to add a correction filter at the end of the whole system, T(z),
    whose magnitude is proportional to the inverse square root of the frequency-dependent
    reverb time, RT60(\(\omega\)). This is shown in Figure 11.34.


    Finally, Figure 11.35 shows a generalized version of the FDN. It does not include
    the absorptive loss components (either static k values or H_LPFs) for clarity.
    The feedback matrix is always square, N x N, where N is the number of delay lines.
    Because it is square, it can be made to be unitary.


