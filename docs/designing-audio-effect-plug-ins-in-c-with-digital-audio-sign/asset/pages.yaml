    # 9.4 Wave Table Oscillators


    A wave table oscillator is, as its name implies, a table-based system for creating
    periodic signals. A circular buffer is preloaded with one cycle, minus one sample,
    of a waveform. The waveform may be mathematical (sin, cos, pulse, square, saw,
    triangle, etc.) or it might be arbitrary or a recorded signal. The basic idea
    is that you read through the table and output samples from it. Consider a table
    of 1024 samples consisting of one cycle of a sinusoid, minus one sample (Figure
    9.9).


    Suppose you start at i = 0 and during each sample period, you read out one value
    and advance to the next. At the end of the buffer, you wrap around and start all
    over. If you did read out one value per sample period, what would be the resulting
    frequency of the waveform?


    The answer is f_table = fs/L when the index increment is exactly 1.0 through the
    table. For a 1024-point wave table at a 44,100 Hz sample rate, the table frequency
    is 43.06 Hz. If you happen to really need a super precise sinusoid at exactly
    43.06 Hz, then this method will produce nearly perfect results. The only factor
    is the precision of the sinusoid loaded into the table. If you had a saw-tooth
    waveform stored in the table, it too would have a fundamental frequency of 43.06
    Hz.


    Most likely, you are going to want to make any arbitrary frequency you like, perhaps
    with an emphasis on musical pitch frequencies. With the exception of the note
    A, these are going to be floating-point numbers with fractional parts. To make
    any frequency, you calculate the inc value with Equation 9.7:'
