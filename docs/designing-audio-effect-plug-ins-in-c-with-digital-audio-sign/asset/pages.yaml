- pgno: 81
  md: 'things in the constructor, such as hold pointers with garbage values or try
    to access memory that hasn''t been allocated, it may crash RackAFX when it first
    starts up. If your DLL behaves really badly, you might even wound the OS too.
    This is a difficult issue to avoid without complicated rules for commissioning
    and decommissioning the plug-in. Additionally, you will have the same problem
    if you are developing a commercial plug-in and you are using a third-party client;
    most of these are designed to first open all the DLLs in their plug-in folder
    and check to make sure the plug-ins can be instantiated. If you write a bad DLL,
    you might also crash these clients and/or the OS. In at least one commercially
    available client, if your plug-in crashes during startup, it will not be loaded
    again in future launches. When RackAFX loads your DLL, it does some error checking
    to try to make sure your plug-in is legal, but it can''t check the validity of
    your construction code.


    If RackAFX crashes each time you open it, remove the last DLL you were working
    on from the PlugIns folder. Alternatively, you can remove all the DLLs—you will
    want to copy them and restore them later when you find the bad DLL that caused
    the crashing. Writing a DLL is challenging and fun, but since you are writing
    a component, you can wind up with crashes like this.'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'During the course of this book you will learn how to implement the following
    effects:


    +   - EQs/tone controls

    +   - Delay

    +   - Flanger/chorus

    +   - Compressor/limiter/tremolo

    +   - Reverb

    +   - Modulated filters/phaser


    The EQ/tone control theory is the most difficult of all the effects to explain
    in a simple way. These effects are based on DSP filter theory which involves complex
    algebra, that is, the algebra of complex numbers. Complex numbers contain real
    and imaginary parts. There are two basic ways to explain basic DSP theory. The
    first is intuitive and involves no complex math but requires some bookkeeping
    and can be tedious. The second method uses complex algebra to solve the problem.


    We’ll start with the intuitive method, and then (optionally, if you desire) make
    the leap into complex math. Don’t worry—we don’t want to get mired down in theory
    and forget the fun part, which is making audio effects. If you skip the second
    part, you will still be able to code EQ and tone control plug-ins, but you will
    better understand where the equations come from if you know a little theory too.
    The transfer functions you will learn along the way will reappear in many effects
    algorithms.


    In Figure 4.1 you can see the –6 dB/octave roll-off indicative of a first-order
    filter. A digital version of the analog filter should have the same shape and
    roll-off. A key difference is that the digital filter will not operate beyond
    the Nyquist frequency.


    The phase response plot shows the relative phases of different frequencies upon
    exiting the filter. During the filtering process, the phases of different frequencies
    get shifted forward or backward. In Figure 4.2, the 1 kHz frequency is shifted
    by –45 degrees compared to the input. At very high frequencies, the phase shift
    approaches –90 degrees. This phase shift is not a side effect of the filtering
    but an integral part of how it works.


    To understand the ramifications of the phase shifting, consider a complex waveform
    entering the filter. Fourier showed that a complex, continuous waveform could
    be decomposed into a set of sinusoids with different frequencies and amplitudes.
    Figure 4.3 shows a filter in action. The input is decomposed into four sinusoids,
    a fundamental, and three harmonics. The peak-amplitudes of the components are
    shown as dark bars to the left of the y axes.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '![](img/b54974d0a4317ec82d7ae02126d10a6f_83_0.png)


    # Figure 4.1: The fundamental analysis tool for a DSP filter is its frequency
    response plot. This graph shows how the filter amplifies or attenuates certain
    bands of frequencies.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_83_1.png)


    # Figure 4.2: The phase response plot of the analog filter in Figure 4.1 shows
    how the phase of the output is shifted across frequencies.


    We observe several features of the output:


    +   - The composite waveform is smoothed out.

    +   - The amplitude and phase shift of the fundamental are unchanged.

    +   - The three harmonics have decreasing amplitudes and more phase shift as you
    go higher in frequency.


    Figure 4.4 shows the same filter with the information plotted differently; here,
    the amplitudes and phases are plotted against frequency rather than dealing with
    a set of time-domain sinusoids. You can see by the output frequency response plot
    that this filter is a kind of low-pass filter. Its curve is similar to Figure
    4.1, the analog equivalent.'
