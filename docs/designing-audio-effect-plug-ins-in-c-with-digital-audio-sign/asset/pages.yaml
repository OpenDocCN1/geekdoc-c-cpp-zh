  md: 'client to maintain. During subsequent calls to the DLL, the client passes the
    pointer back to the DLL as a function argument so that it may operate on the persistent
    data. This is shown in Figure 2.3. When the DLL is no longer needed, it clears
    the memory by deleting the structure.


    In the C++ programming language, the class data type defines an object that is
    a collection of member variables and member functions which can operate on those
    variables. By packaging a plug-in as a C++ class, you get several advantages:
    first, all the benefits of C++ (encapsulation, polymorphism, etc.) are available
    during the coding process. Second, rather than allocating a data structure and
