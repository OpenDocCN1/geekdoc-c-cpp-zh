  md: '![](img/b54974d0a4317ec82d7ae02126d10a6f_478_0.png)


    # Figure A.1: The VST Compatible switch reveals three options for the GUI.


    +   • Use RackAFX custom GUI: If you have the proper version of RackAFX, this
    button will be enabled. Choosing this option will allow the GUI you create with
    GUI designer (Appendix B) to be used by the VST client. It will look and work
    identically to the one you create in RackAFX. You do not have to provide any extra
    code for this option.


    +   • I will write my own GUI: If you have the skills to do this, then you can
    check this box and write your own GUI. The client will call a method on your plug-in
    to launch your GUI. All details of the GUI are your responsibility and you must
    provide the code and have the necessary resource editor.


    For the last option, first look in the PlugIn.h file and find the flag and three
    methods you need to override.


    ```

    // set this to TRUE if you have your own GUI to use; not for RackAFX GUIs

    bool m_bUserCustomGUI;

    ```


    First, set the m_bUserCustomGUI flag to “true” in your constructor. This will
    tell the client that you have your own GUI. Next, override the following three
    methods:


    ```

    // for user (NOT RackAFX) generated resources/GUIs

    virtual void __stdcall showGUI(HWND hParentWnd);

    virtual void __stdcall hideGUI(HWND hParentWnd);

    virtual void __stdcall refreshGUI(HWND hParentWnd);

    ```


    +   • The client calls showGUI() to show it.

    +   • The client calls hideGUI() to hide it.

    +   • The client calls refreshGUI() to update it. See Appendix B for more information
    about updating.


    In the three methods, the argument is the client''s window handle. You will need
    to create your child window using the client''s handle as your parent. If you
    don''t know what that means, you probably shouldn''t be using this option.


    # A.2 Wrapping Your RackAFX Plug-In


    Your RackAFX plug-in will compile on Windows (Visual Studio) or Mac (Xcode) because
    it is pure C++ with some #define statements added to split out the Windows- and
    Mac-specific components. The audio signal processing and GUI component objects
    are all done in C++ so your plug-in object can be wrapped with an outer C++ object
    that translates function calls from the VST or AU client into RackAFX function
    calls. This is exactly what happens when you choose the “Make VST Compatible”'
