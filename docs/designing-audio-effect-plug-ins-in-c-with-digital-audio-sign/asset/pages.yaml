- pgno: 243
  md: '# # Audio Filter Designs: FIR Filters


    Infinite impulse response (IIR) filters have several attractive properties:


    +   - They only require a few delay elements and math operations.

    +   - You can design them directly in the z-plane.

    +   - You can use existing analog designs and convert them to digital with the
    Bilinear z-Transform (BZT); the fact that IIR topologies somewhat resemble the
    signal flow in analog filters emphasizes their relationship.

    +   - You can get extreme resonance/gain by placing poles very near the unit circle.

    +   - You can make filters, EQs, and so on with controls that link to the coefficients
    directly or indirectly for real-time manipulation of the plug-in.


    Their main drawback is that they can become unstable and blow up, or oscillate.
    Their impulse responses (IRs) can be infinite. Finite impulse response (FIR) filters
    have all zeros and a finite IR. They are unconditionally stable so their designs
    can never blow up. However, they can put out all zeros, a constant value, a series
    of clicks or pulses, or other erroneous output, but they don''t actually go unstable.


    You can also make a linear phase filter with an FIR, just like the simple feed-forward
    (FF) topology you analyzed in Chapters 5 and 6; a linear phase filter is impossible
    to make with an IIR topology, although you can approximate it by adding phase
    compensation filters. However, the one thing that separates FIR filters from all
    other kinds, including analog counterpart filters, is that their coefficients
    $a_0, a_1, ..., a_N$ are the IR of the filter. You proved that when you manually
    pushed an impulse through the simple FF filter in Chapter 4, and then again when
    taking the $z$ transform of the IR of the same filter in Chapter 5.


    # ## 8.1 The IR Revisited: Convolution


    In Chapter 1 you saw how the digitized signal was reconstructed into its analog
    version by filtering through an ideal low-pass filter (LPF). When the series of
    impulses is filtered, the resulting set of sin(x)/x pulses overlap with each other
    and their responses all add up linearly. The addition of all the smaller curves
    and damped oscillations reconstructs the inter-sample curves and damped fluctuations
    (Figure 8.1).


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_243_0.png)'
  merge: -1
  img_proc: true
- pgno: 244
  md: '# Figure 8.1: The sin(x)/x outputs of the LPF are summed together to reconstruct
    the original band-limited input waveform.


    In the time domain, you can see how the IR of each sample is overlaid on the others
    and that the summing together of the peaks and valleys of the sin(x)/x shape ultimately
    creates the portions in between the samples which appeared to have been lost during
    the sampling process.


    The process of overlaying the IR on top of the input stream of impulses x(n) and
    adding up the results to get the final time domain output y(n) is called convolution.
    Convolution is a mathematical operation used in many fields of science; digital
    audio processing is just one of them. The mathematical symbol for convolution
    is * which can be confusing because this is used to represent the multiplication
    operation in C/C++. In the above example, you convolved the input signal x(n)
    with the IR h(n) by overlaying the h(n) signal on top of each input impulse, then
    summing up signals to create the final output y(n). Mathematically, you would
    write this as Equation 8.1:


    ```

    y(n) = x(n) * h(n)  (8.1)

    ```


    Visually, it''s easy to understand the concept of overlaying the signals and adding
    them to get the final result, but how do you describe that mathematically? The
    answer is that this kind of operation is a special circumstance of a more generalized
    operation of convolution. Mathematically, convolution for discrete signals is
    described in Equation 8.2:


    ```

    c(n) = f(n) * g(n) = \sum_{m=-\infty}^{+\infty} f(m)g(n - m)  (8.2)

    ```


    In this case, f and g are two generalized signals and neither of them has to be
    an IR. Convolution is commutative, so that f * g = g * f, or Equation 8.3:


    ```

    c(n) = f(n) * g(n) = \sum_{m=-\infty}^{+\infty} f(m)g(n - m)

    c(n) = g(n) * f(n) = \sum_{m=-\infty}^{+\infty} g(m)f(n - m)  (8.3)

    ```


    > If you know how a system affects one single impulse, you can exactly predict
    how it will affect a stream of impulses (i.e., a signal) by doing the time domain
    overlay. If you have the IR of a system, you have the algorithm for the system
    coded in a single function.


    The operation this equation is describing is not simple. On the right-hand side
    of Equation 8.3 the function f(n) is one signal while the function g(n - m) represents
    the second signal reversed in time. The multiplication/summation of the two across
    -∞ to +∞ describes the process of sliding the two signals over each other to create
    overlapping areas. On each iteration, the area under the curve of overlap between
    g(n - m) and f(n) is computed. This results in a third (output) signal c(n). This
    signal c(n) is made up of the overlapping area of the two input signals. This
    operation is shown graphically in Figures 8.2 and 8.3.


    Thus, the convolution of two arbitrary signals is quite involved mathematically.
    If the two signals'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'have any complexity at all, the resulting convolution signal is generally not
    distinguishable as a linear combination of the two. If you know the IR of a system
    h(n), you can convolve it with the input signal x(n) to produce the output signal
    y(n). This is the equivalent of multiplying the transfer function H(z) with the
    input signal X(z) to produce the output Y(z). Thus convolution in the time domain
    is multiplication in the frequency (z) domain (Equation 8.4).


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_245_0.png)


    Figure 8.2: Two signals f and g are convolved. These are discrete signals but
    the sample symbols have been removed to make it easier to see; instead they are
    shown as continuous. In the first step, c(0), one of the signals is reversed and
    the two are pushed up next to each other. As the convolution progresses through
    each step c(1) to c(4), the overlapping areas are calculated and stored.


    y(n) = x(n) * h(n) ↔ Y(z) = X(z)H(z) (8.4)


    To understand how a FF filter implements convolution first rearrange the block
    diagram. Let''s consider a long FIR filter with N + 1 coefficients in Figure 8.4.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_245_1.png)


    Figure 8.3: The convolution of f and g results in c(n), consisting of five samples
    c(0) through c(4), which represent the overlap areas.'
  merge: -1
  img_proc: true
- pgno: 246
  md: '![](img/b54974d0a4317ec82d7ae02126d10a6f_246_0.png)


    Figure 8.4: The familiar FIR feed-forward structure expanded out to $N$ delay
    taps with $N + 1$ coefficients. It is important to see that there is one less
    delay element than coefficients since $a_0$ is multiplied against the original
    undelayed signal.


    Next, mentally rotate the structure so it looks like Figure 8.5. In Figure 8.5
    you can see that at any given time, a portion of the input signal $x(n)$ is trapped
    in the delay line. On each sample period, the input signal slides to the right
    and a summation is formed with the product of the coefficients and the samples
    $x(n - d)$. The words “sliding, summation and product” are key here—they’re the
    same words used to describe convolution.


    In Figure 8.6, the input signal $x(n)$ moves through the delay line being convolved
    with the IR on each sample period. Since each sample in the delay line is an impulse,
    and each impulse is symmetrical when reversed, this is the same as conceptually
    overlapping the IR on top of each sample and scaling by the sample value. The
    result is the final summation of all the peaks and valleys of the IR with the
    delayed signal $x(n)$. Thus, an FIR filter exactly implements discrete convolution
    in the time domain. This ultimately gives us a whole new way to filter a signal—by
    convolving against an impulse.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '![](img/b54974d0a4317ec82d7ae02126d10a6f_247_0.png)


    Figure 8.5: This rotated version is sometimes called a transverse delay line or
    a transverse structure.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_247_1.png)


    Figure 8.6: You can also think of the coefficients as being frozen in the h(n)
    buffer while the input signal marches one sample to the right on each iteration.


    So, if an ideal LPF has an IR in the shape sin(x)/x and we sample the IR, we get
    a discrete IR h(n). The more samples we take, the more accurate our version of
    the IR becomes. This introduces the first way to design a FIR filter: find an
