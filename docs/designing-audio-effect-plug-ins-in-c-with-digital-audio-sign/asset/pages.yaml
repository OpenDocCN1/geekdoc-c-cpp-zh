    # 6.3.2 Smith-Angell Improved Resonator


    A block diagram of a Smith-Angell improved resonator is shown in Figure 6.8.


    The difference equation is as follows:


    ```

    y(n) = a_0x(n) + a_2x(n - 2) - b_1y(n - 1) - b_2y(n - 2) \qquad (6.7)

    ```'
