    \        fInputSample += pInputBuffer[1];\n        // attenuate by 0.5\n     \
    \   fInputSample *= 0.5;\n    }\n    // begin the series/parallel signal push\n\
    \    // Pre-Delay\n    float fPreDelayOut = 0;\n    m_PreDelay.processAudio(&fInputSample,\
    \ &fPreDelayOut);\n    // Pre-Delay Out -> fAPF_1_Out\n    float fAPF_1_Out =\
