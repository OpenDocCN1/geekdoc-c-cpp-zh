    # 6.6.4 Second-Order Butterworth LPF and HPF


    Specify:


    +   * \(f_c\), corner frequency


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_184_0.png)


    Figure 6.23: Second-order BSF responses: \(f_c = 1\) kHz, bandwidth = 500 Hz (narrowest),
    2 kHz, = kHz, and 10 kHz (widest).


    Butterworth low-pass and high-pass filters are specialized versions of the ordinary
    second-order low-pass filter. Their Q values are fixed at 0.707, which is the
    largest value it can assume before peaking in the frequency response is observed.


    The design equations are as follows:


    LPF

    \(C = \frac{1}{\tan(\pi f_c / f_s)}\)

    \(a_0 = \frac{1}{1 + \sqrt{2}C + C^2}\)

    \(a_1 = 2a_0\)

    \(a_2 = a_0\)

    \(b_1 = 2a_0(1 - C^2)\)

    \(b_2 = a_0(1 - \sqrt{2}C + C^2)\)


    HPF

    \(C = \tan(\pi f_c / f_s)\)

    \(a_0 = \frac{1}{1 + \sqrt{2}C + C^2}\)

    \(a_1 = -2a_0\)

    \(a_2 = a_0\)

    \(b_1 = 2a_0(C^2 - 1)\)

    \(b_2 = a_0(1 - \sqrt{2}C + C^2)\)


    (6.37)


    # 6.6.5 Second-Order Butterworth BPF and BSF'
