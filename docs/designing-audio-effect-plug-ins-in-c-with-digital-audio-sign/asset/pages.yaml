- pgno: 340
  md: '# # Reverb Algorithms


    Reverb algorithms might represent the Holy Grail of audio signal processing. They
    have an appeal that seems universal, perhaps because we live in a reverberant
    world. Our ears are time-integrating devices that use time domain cues and transients
    for information, so we are sensitive to anything that manipulates these cues.
    In this chapter, we discuss reverb algorithms as applied mainly to room simulation.
    There are two general ways to create the reverberation effect:


    +   * Reverb by direct convolution—the physical approach.

    +   * Reverb by simulation—the perceptual approach.


    In the physical approach, the impulse response of a room is convolved with the
    input signal in a large finite impulse response (FIR) filter. For large rooms,
    these impulse responses might be = to 10 seconds. In the mid 1990s, Gardner developed
    a hybrid system for fast convolution that combined direct convolution with block
    fast Fourier transform (FFT) processing (Gardner 1995). Around the same time,
    Reilly and McGrath (1995) described a new commercially available system that could
    process 262,144-tap FIR filters for convolving impulses over = seconds in length.
    The required processing power is sometimes too large to be practical in a plug-in.
    Aside from the computing expense, another drawback to this approach is that an
    impulse response is frozen in time, and measures the room at one location only,
    under a certain set of conditions. To create a reverb unit (or reverberator) that
    is general enough to provide many different reverbs of different spaces would
    require a large library of impulse response files. In addition, its parameters
    can''t be adjusted in real time.


    The perceptual approach aims to simulate the reverberation with enough quality
    to fool the ears and give the same perception of real reverb but with much less
    processing power. The advantages are numerous, from the minimal processing required
    to the ability to vary many parameters in real time. Browne (2001) proposed a
    hybrid system combining a short impulse response convolution along with recursive
    filtering, combining both approaches. There are several key engineers who developed
    much of the theory still in use today. These include Schroeder''s (1962) initial
    work in the early 1960s with continued research and contributions from Moorer,
    Griesinger, Gerzon, Gardner, Jot, Chaigne, Smith, Roscosso, and others across
    the decades. Most of this chapter is owed to their work in the field. We will
    focus on the perceptual approach and try to find computationally efficient algorithms
    for interesting reverberation effects.


    Griesinger (1989) states that it is impossible to perfectly emulate the natural
    reverberation of a real room and thus the algorithms will always be approximations.
    It seems that the area of reverberation design has the most empirically derived
    or trial-and-error research of just about any audio signal processing field. There
    is no single “correct” way to implement a reverb algorithm, so this chapter focuses
    on giving you many different reverberator modules to experiment with.'
  merge: -1
  img_proc: true
- pgno: 341
  md: '# 11.1 Anatomy of a Room Impulse Response


    The first place to start is by examining impulse responses of actual rooms. There
    are several popular methods for capturing the impulse response, from cap pistols
    and balloons to deconvolution of chirp signals and pseudo random sequences. The
    resulting time domain plot is useful for investigating the properties of reverberation.


    Figure 11.1 shows the impulse response plots for two very different spaces; a
    large concert hall and a cathedral. The initial impulse is followed by a brief
    delay called the pre-delay. As the impulse pressure wave expands, it comes into
    contact with the nearby structures—walls, floor, and ceiling—and the first echoes
    appear. These initial echoes, called early reflections, are important to the simulation
    of reverb because of the auditory cues we get from them. The pressure wave continues
    to expand and more reflections occur, with reflected signal upon reflected signal
    piling on top of each other while decaying in energy. The resulting reverb “tail”
    is called late reverberation or subsequent reverberation.


    The top impulse response in Figure 11.1 is a modern concert hall designed for
    a pleasing reverberant quality. The initial reflections are from irregularly shaped
    back and side walls and they pile up in amplitude; they are also piling up in
    density, shown as the impulse gets “fatter” in the middle section. The dense reverberant
    tail follows, which decays in an exponential fashion, and the sound pressure energy
    is absorbed by the seats and acoustical room treatments. The cathedral is a different
    story.


    After a short pre-delay, a few large early reflections arrive from the nearby
    structures but they don’t increase in amplitude or density in the same way as
    the hall. The reverb’s decay is also much longer in time as there is little in
    the cathedral to absorb the sound pressure.


    The block diagram in Figure 11.2 shows the three components we observe. However,
    there is debate as to whether or not this is a good way to break the problem down.
    Some feel that the reverb algorithm should not need to separate out the early
    reflections from the late reverberation. In other words, a good algorithm will
    create all of the reverberation aspects at once.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_341_0.png)


    Figure 11.1: The impulse responses of a large hall and cathedral.'
  merge: -1
  img_proc: true
- pgno: 342
  md: '![](img/b54974d0a4317ec82d7ae02126d10a6f_342_0.png)


    # 11.1.1 RT60: The Reverb Time


    The most common measurement for reverb is the RT60 reverb time. Reverb time is
    measured by first stimulating the room into a reverberant state, then turning
    off the source and plotting the pressure-squared level as a function of time.
    The amount of time it takes for this energy decay curve to drop by 60 dB is the
    reverb time, or RT60. Sabine''s (1973) pioneering work in this area leads to the
    following formula in Equation 11.1:


    $$RT_{60} = 0.5 \frac{V_R}{S_R A_{Rave}}$$ (11.1)


    where


    +   - \(V_R\) = volume of room in ft³

    +   - \(S_R\) = surface area of room in ft²

    +   - \(A_{RAve}\) = average absorption coefficient


    Sabine measured and tabulated the absorption coefficients for various materials.
    The units are given in Sabines. A room made of several materials is first partitioned
    to find the partial surface area of each material type, then the average is found
    by weighting the areas with the absorption coefficients and summed. The reverb
    time is probably the most common control, found on just about every kind of reverb
    plug-in.


    # 11.2 Echoes and Modes


    In Schroeder''s early work, he postulates that a natural sounding artificial reverberator
    has both a large echo density and a colorless frequency response. The echo density
    is simply the number of echoes per second that a listener experiences in a given
    position in the reverberant environment (Equation 11.2).


    $$E_D = \frac{\text{echoes}}{\text{second}}$$ (11.2)


    If the echo density is too low the ear discerns the individual echoes and a fluttering
    sound is the result. As the echo density increases, the echoes fuse together,
    producing a wash of sound. Schroeder (1962) postulated that for a natural-sounding
    reverb, the echo density needs to be 1000 echoes/second. Greisinger (1989) increases
    this to 10,000 echoes/second or more. Statistically, the'
  merge: -1
  img_proc: true
- pgno: 343
  md: 'echo density is shown in Equation 11.3, which reveals that the echoes build
    up as the square of time


    Echo density \(\propto \frac{4\pi c^3}{V_R}t^2\) (11.3)


    where

    c = speed of sound

    t = time

    \(V_R\) = volume of room


    Reverb is often modeled statistically as decaying white noise, which implies that
    ideal reverberant rooms have flat frequency responses. A room''s geometry can
    be used to predict its frequency response. The dimensions of the room can be used
    to calculate the frequencies that will naturally resonate as the wave bounces
    back and forth between parallel surfaces. An untreated rectangular room will have
    multiple resonances and anti-resonances.


    Given a rectangular room with length, width, and height of \(l, w,\) and \(h\),
    the resonances are found in Equation 11.4, a well-known and useful equation for
    predicting room resonances, also called *modes* (Beranek 1986). As the frequency
    increases, so do the number of resonances.


    \(f_r = \frac{c}{2}\sqrt{(\frac{n_x}{l})^2 + (\frac{n_y}{w})^2 + (\frac{n_z}{h})^2}\)
    (11.4)


    where

    \(n_x, n_y, n_z =\) half wave numbers \(0, 1, 2, 3...\)

    \(l, w, h =\) length(x), width(y) and height(z) of the room


    Above a certain frequency the resonances overlap and fuse together. Each resonant
    frequency has its own envelope whose curve is bell (band-pass filter [BPF]) shaped,
    meaning that it has a peak resonance at the mode frequency, but is still excitable
    at frequencies around it and thus the quality factor (\(Q\)) of the curve relates
    to this excitability. The number of resonances increases with frequency. Figure
    11.3 shows a fictitious room example with the bell-shaped resonances.


    The modal density is the number of resonant peaks per Hz. Physicists call the
    resonant frequencies or modes *eigenfrequencies* (note this is not an acoustics-specific
    term; an eigenfrequency is the resonant frequency of any system). Schroeder''s
    second postulation is that for a colorless frequency response, the modal density
    should be 0.15 eigenfrequencies/Hz or one eigenfrequency every 6.67 Hz or approximately
    3000 resonances spread across the audio spectrum. Thus, it makes sense that good
    reverberant environments have interesting geometries with many nonparallel walls.
    The multitude of resonances is created by the many paths an impulse can take from
    the source to the listener. Kuttruff (1991) derived the approximation for the
    modal density as it relates to the volume of the room and modal frequency. Equation
    11.5 shows that the resonances build up as the square of frequency.'
  merge: -1
  img_proc: true
- pgno: 344
  md: '![](img/b54974d0a4317ec82d7ae02126d10a6f_344_0.png)


    Figure 11.3: The resonances of a room all contribute to create the final frequency
    response. When the bandwidths of the modes overlap, they fuse together. The dotted
    line represents the combined frequency response.


    # Schroeder''s rules for natural reverb:


    +   - Echo density: At least 1000 echoes/sec (Greisinger: 10,000 echoes/sec)

    +   - Modal density: At least 0.15 eigenfrequencies/Hz


    In physical rooms we know that:


    +   - Echo density increases with the square of time.

    +   - Modal density increases with the square of frequency.


    ```

    D_m = \frac{4\pi V_R f_m^2}{c^3} \quad (11.5)

    ```


    where


    $V_R = \text{volume of the room}$

    $f_m = \text{modal frequency in question}$


    The energy decay relief plot (or EDR) shows how the energy decays over both frequency
    and time for a given impulse response of a room. Figure 11.4 shows a very simple
    fictitious EDR.


    In Figure 11.4, notice that the frequency axis comes out of the page; low frequencies
    are in the back. It also shows that this room has a resonant peak, which forms
    almost right away in time. In an EDR, the modal density is shown across the z-axis
    (frequency) while the echo density appears across the x-axis (time). This simplified
    plot shows just one resonance and no echo density build-up for ease of viewing.
    Figure 11.5 shows the EDR of an actual room, in this case a theater. The eigenfrequencies
    are visible as the ridges that run perpendicularly to the frequency axis.'
  merge: -1
  img_proc: true
- pgno: 345
  md: '![](img/b54974d0a4317ec82d7ae02126d10a6f_345_0.png)


    # Figure 11.4: The EDR shows time (x-axis), frequency (z-axis) and amplitude (y-axis)
    of the energy decay of a room.


    Figure 11.6 shows the EDR for a cathedral. In this case, the echo pile-ups are
    clearly visible running perpendicular to the time axis. Comparing both EDRs shows
    that both rooms have high echo and modal densities; therefore, they should be
    good reverberant spaces. Both EDRs show an initial high frequency roll-off and,
    especially in the theater''s case, the high frequencies decay faster than the
    low frequencies. The high-frequency decay is a property of the treatment of the
    room surfaces along with the fact that the air absorbs high frequencies more easily
    than low frequencies. The high-frequency energy decay in the theater is caused
    by the carpet, seats, and acoustic treatment which the cathedral lacks. Therefore,
    for a good quality reverb, we will need to take this high-frequency decay into
    account along with the echo and modal density.


    Reverb algorithms are typically made of arrangement of modules called reverberator
    modules. From our basic observations we can tell that good reverberator modules
    are going to produce dense echoes along with a large number of resonances. If
    the resonances are distributed properly across the spectrum, the reverb will sound
    flat. If they are not, there will be metallic pinging and other annoyances that
    will color the frequency response in an unnatural way. The majority of the rest
    of the chapter is devoted to revealing, analyzing, and explaining these building
    blocks and the algorithms that use them. The best place to start is with Schroeder''s
    reverb modules.'
  merge: -1
  img_proc: true
- pgno: 346
  md: '![](img/b54974d0a4317ec82d7ae02126d10a6f_346_0.png)


    Figure 11.5: An EDR for a theater.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_346_1.png)


    Figure 11.6: An EDR for a cathedral.


    # 11.3 The Comb Filter Reverberator


    One of the reverberator modules that Schroeder proposed is a comb filter. Remember
    that we are looking for modules that produce echoes and the comb filter with feedback
    will do just that. The comb filter reverberator is familiar looking because it''s
    also the delay with feedback algorithm you studied in Chapter 7. We derived the
    difference equation and transfer function for the comb filter in Figure 11.7 in
    Chapter 7:


    ```

    y(n) = x(n-D) + gy(n-D)

    ```


    and


    ```

    H(z) = \frac{z^{-D}}{1 - gz^{-D}}

    ```'
  merge: -1
  img_proc: true
- pgno: 347
  md: 'We also performed a pole-zero analysis and generated frequency plots. We showed
    that the feedback path caused a series of poles evenly spaced around the inside
    of the unit circle. The resulting impulse response is easy to predict as the echo
    recirculates through the feedback path, being attenuated by multiplying by g each
    time through the loop.


    While Figure 11.8 might look simple, the results certainly trend in the right
    direction. The frequency response plot shows a set of resonant peaks that could
    correspond to a room''s eigenfrequencies and the impulse response shows a set
    of decaying impulses, mimicking the energy loss as the echoes bounce off of surfaces.
    The modal density for a comb filter is given by Jot and Chaigne (1991) in Equation
    11.7.


    ```

    M_d = \frac{D}{f_s}

    \Delta f = \frac{f_s}{D}

    (11.7)

    ```


    where


    +   - D = the delay length

    +   - f_s = the sample rate


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_347_0.png)


    Figure 11.7: The basic comb filter.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_347_1.png)


    Figure 11.8: The poles in the z-plane produce the resonances. The feedback that
    creates those poles also recirculates and scales the echoes by g. In this example,
    D = 8 samples, feedback = 80%.'
  merge: -1
  img_proc: true
- pgno: 348
  md: 'So, the comb filter produces $D$ resonances across DC to $f_s$ (or D/2 resonances
    from DC to Nyquist) with each resonance separated by $\Delta f = f_s/D$. This
    is exactly what we found when we analyzed the comb filter in Chapter 7. In order
    to get Schroeder''s desired 0.15 eigenfrequencies/Hz from DC to 20 kHz at $f_s
    = 44,100$, you would need $D = 6622$. This also makes sense because we need about
    3000 (D/2) resonances to cover the range from DC to 20 kHz. The problem is that
    while we will get the desired number of resonances, they will be linearly spaced
    rather than piling up as the square of frequency, as Equation 11.5 predicts. Additionally,
    it will take 6622 samples (~150 mSec with a 44.1 kHz sample rate) before the reverberator
    begins outputting samples. Schroeder was able to achieve high density by placing
    comb filters in parallel, then summing the results. This would then cause the
    comb filter responses to overlap, however, care must be taken when choosing the
    delay lengths—if they are mathematically related then resonances or anti-resonances
    will color the sound.


    Figure 11.9 shows an example of four comb filters in parallel. Each has its own
    delay time (D1–D4) and gain (g1–g4). However, care must be taken with the gain
    values. As you remember from Chapter 7, the value of $g$ alone determines the
    pole radii. If the poles of each filter have the same radii, their impulses will
    decay at the same rate. This is desirable since it mimics the uncolored reverberation
    pattern. If the pole radii are different for the different comb filters then the
    resulting reverberation will have undesirable coloration in it. The pole radii
    are given in Equation 11.8 by Gardner (Kahrs and Brandenberg 1998). The relationship
    between the pole radii, the delay $D$ and the reverb time $RT_{60}$ is given in
    Equation 11.9.


    ```

    where

    $$r = g^{1D}$$ (11.8)

    $g = \text{the feedback gain}$

    $D = \text{the delay length}$

    $$RT_{60} = \frac{3DT_s}{\log(1/g)}$$

    or

    $$1/g = 10^{\frac{3DT_s}{RT_{60}}}$$

    or

    $$g = 10^{\frac{-3DT_s}{RT_{60}}}$$ (11.9)

    $T_s \text{ is the sample period}$

    ```'
  merge: -1
  img_proc: true
- pgno: 349
  md: '![](img/b54974d0a4317ec82d7ae02126d10a6f_349_0.png)


    # Figure 11.9: Four comb filters in parallel.


    This means we can control the reverb time by using the gain factor or the delay
    length D. The tradeoff is that if we increase g to increase reverb time, the poles
    get very near the unit circle, causing resonances. If we increase D, then the
    echoes become distinctly audible rather than smearing together. This means that
    there is a tradeoff of the modal density versus the echo density in the design.
    The modal density for a parallel bank of N comb filters in Equation 11.10 is given
    by Jot (1991). From Equation 11.10 you can see that the modal density remains
    constant across all frequencies, which is not what happens in real rooms where
