- pgno: 177
  md: '![](img/b54974d0a4317ec82d7ae02126d10a6f_177_0.png)


    Figure 6.14: A simple analog RC low-pass filter.


    Step 3: De-normalize the analog transfer function H(s) with the appropriate factor:


    H(s) = \frac{1}{s + 1}


    s = \frac{s}{\omega_a} \text{ because this is an LPF}


    \hat{H}(s) = \frac{1}{s/\omega_a + 1} = \frac{1}{s/0.07136 + 1}


    = \frac{0.07136}{s + 0.07136}


    (6.21)


    Step 4: Apply the BZT:


    H(z) = \hat{H}(s)|_{s=(z-1)/(z+1)}


    = \frac{0.07136}{\frac{z-1}{z+1} + 0.07136}


    = \frac{0.07136(z+1)}{z-1 + 0.07136(z+1)}


    = \frac{0.07136z + 0.07136}{z - 1 + 0.07136z + 0.07136}


    = \frac{0.07136z + 0.07136}{z + 0.07136z - 0.9286}


    (6.22)


    Get into standard H(z) format:


    = \frac{0.07136 + 0.07136z^{-1}}{1 + 0.07136 - 0.9286z^{-1}}


    H(z) = \frac{0.0667 + 0.0667z^{-1}}{1 - 0.8667z^{-1}} = \frac{a_0 + a_1z^{-1}}{1
    + b_1z^{-1}}


    Equation 6.22 is in the format that we need with the numerator and denominator
    properly formed to observe the coefficients. From the transfer function, you can
    see that:


    +   - a_0 = 0.0667

    +   - a_1 = 0.0667

    +   - b_1 = -0.8667'
