    # 6.6.7 First- and Second-Order APF


    Specify:


    +   - fc, corner frequency

    +   - Q, steepness of phase shift at fc (second-order only)


    The design equations are as follows:


    | First-Order APF | Second-Order APF |

    |---|---|

    | \(\alpha = \frac{\tan(\pi f_c / f_s) - 1}{\tan(\pi f_c / f_s) + 1}\) | \(\alpha
    = \frac{\tan(\pi Q f_c / f_s) - 1}{\tan(\pi Q f_c / f_s) + 1}\) |

    | | \(\beta = -\cos \theta_c\) |

    | \(a_0 = \alpha\) | \(a_0 = -\alpha\) |

    | \(a_1 = 1.0\) | \(a_1 = \beta(1 - \alpha)\) |

    | \(a_2 = 0.0\) | \(\alpha_2 = 1.0\) |

    | \(b_1 = \alpha\) | \(b_1 = \beta(1 - \alpha)\) |

    | \(b_2 = 0.0\) | \(b_2 = -\alpha\) |


    # 6.7 Audio Specific Filters


    The basic classical filters provide many functions in audio and can be very musical
    (e.g., resonant low-pass filters in synthesizers) but you also need filters that
    are very audio specific. These filters are found all throughout plug-ins and have
    been used in mixing consoles and other audio gear for decades. These designs are
    often not found in DSP textbooks because of their specific audio-only functions.
    These filters include:'
  merge: -1
  img_proc: true
- pgno: 188
  md: '+   - Shelving filters

    +   - Parametric EQ

    +   - Graphic EQ


    These all require a slightly modified bi-quad structure. The reason is that these
    filters require mixing the original, unfiltered input directly with the output
    in a mix ratio. The ratio is controlled by two more coefficients, c0 and d0.


    # 6.7.1 Modified Bi-Quad


    You can see that the filter in Figure 6.27 is a bi-quad with two extra coefficients,
    c0 and d0, which make the wet-dry mix ratio needed for these filter types.


    # 6.7.2 First-Order Shelving Filters


    Low shelving


    Specify:


    +   - fc, low shelf frequency

    +   - Low-frequency gain/attenuation in dB


    High shelving


    Specify:


    +   - fc, high shelf frequency

    +   - High-frequency gain/attenuation in dB


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_188_0.png)


    Figure 6.27: The modified bi-quad required for audio filters.


    The design equations are as follows:'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'Low Shelving

    \(\theta_c = 2\pi f_c / f_s\)

    \(\mu = 10^{Gain(dB)/20}\)

    \(\beta = \frac{4}{1 + \mu}\)

    \(\delta = \beta \tan(\theta_c / 2)\)

    \(\gamma = \frac{1 - \delta}{1 + \delta}\)

    \(a_0 = \frac{1 - \gamma}{2}\)

    \(a_1 = \frac{1 - \gamma}{2}\)

    \(a_2 = 0.0\)

    \(b_1 = -\gamma\)

    \(b_2 = 0.0\)

    \(c_0 = \mu - 1.0\)

    \(d_0 = 1.0\)


    High Shelving

    \(\theta_c = 2\pi f_c / f_s\)

    \(\mu = 10^{Gain(dB)/20}\)

    \(\beta = \frac{1 + \mu}{4}\)

    \(\delta = \beta \tan(\theta_c / 2)\)

    \(\gamma = \frac{1 - \delta}{1 + \delta}\)

    \(a_0 = \frac{1 + \gamma}{2}\)

    \(a_1 = - \left( \frac{1 + \gamma}{2} \right)\)

    \(a_2 = 0.0\)

    \(b_1 = -\gamma\)

    \(b_2 = 0.0\)

    \(c_0 = \mu - 1.0\)

    \(d_0 = 1.0\)


    (6.41)


    Shelving filters are used in many tone controls, especially when there are only
