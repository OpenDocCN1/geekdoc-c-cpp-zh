    +   - Add parallel compression—a dry path that mixes with the effected signal
    in a user-chosen ratio.

    +   - Try alternate side-chain configurations (next).


    # 13.6 Alternate Side-Chain Configurations


    As Reiss points out, there are several different configurations for the contents
    of the side-chain. The version we’ve used so far is a standard linear timing placement
    configuration. One alternate configuration is called the biased configuration,
    in which the attack and release levels start at the threshold, not zero. Figure
    13.13 shows this configuration. Reiss notes that this has the effect of allowing
    the release part of the envelope to fade out when the input drops below the threshold.
    If you want to try to implement this one, you will need to make a modification
    to the built-in CEnvelopeDetector object to set the low limit levels of the attack
    and release times—which depend on the linear magnitude of the signal—to match
    the threshold (which is in dB).


    The other two configurations involve the location of the attack and release controls.
    In the post-gain configuration shown in Figure 13.14 the attack and release controls
    follow the output of the gain computer and are not intermixed with the RMS detector.
    The post-gain configuration can also be implemented in RackAFX. You will need
    to use two CEnvelopeDetectors. The first one runs in RMS mode with zero attack
    and zero release times. It feeds the gain calculator. The second detector follows
    the gain computer, runs in PEAK mode and has the user-controlled attack and release
    controls connected to it. Example code is available at the www.willpirkle.com.


    A second variation called log-domain, shown in Figure 13.15, places the timing
    controls after the gain computer but before the conversion to the linear domain.
    It could also be implemented using an extra detector placed in the proper location
    in the side-chain.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_464_0.png)


    Figure 13.13: In the biased configuration, the threshold is used to set the attack
    and release starting levels.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_464_1.png)


    Figure 13.14: The post-gain configuration with timing controls placed after the
    gain computer.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_464_2.png)'
