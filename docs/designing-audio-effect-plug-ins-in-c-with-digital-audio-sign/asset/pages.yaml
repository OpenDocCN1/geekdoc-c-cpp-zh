- pgno: 477
  md: '# The VST® and AU® Plug-In APIs


    Once you learn how to design plug-ins with RackAFX you will find that learning
    other plug-in application programming interfaces (APIs) is fairly straightforward.
    The main reason is that most of the plug-in APIs share very similar structuring
    and function calls as RackAFX. An analogy might be learning to fly: once you have
    the fundamentals of solo flight internalized, learning to fly different kinds
    of airplanes is a matter of understanding the peculiarities of each one. You don''t
    need to worry about the principles of lift, drag, pitch, and yaw after you''ve
    mastered them. The current popular plug-in APIs include Steinberg''s Virtual Studio
    Technology (VST), Apple Computer''s Audio Units (AU), and Avid''s Avid Audio eXtension
    (AAX)® formats. If you want to write for these APIs, the first step is to set
    up a developer account with the manufacturers via their websites. Once you have
    an account you can download their API documentation and SDKs (software development
    kits), which include sample code templates. The VST and AU APIs are publicly documented,
    while AAX is not. Like RackAFX, VST plug-ins are written in straight C++ without
    the need for external frameworks or foundation classes. AU plug-ins are not and
    require a good working knowledge of Mac programming to develop. Once you have
    a RackAFX plug-in, how can you make it work in other plug-in APIs?


    # A.1 Compiling as a VST Plug-In in Windows


    The simplest way to use your RackAFX plug-in in a third-party client is to take
    advantage of the fact that you can set your project to compile as a dynamic link
    library (DLL) that is compatible with both RackAFX and VST on the Windows operating
    system (OS). You can enable this functionality when you create your project or
    later in development. If you already have a project in development, use File →
    Edit Project or the Edit button on the user interface (UI). On the edit project
    dialog, check the “Make VST Compatible” box, as shown in Figure A.1. The resulting
    DLL will work with both RackAFX and any Windows VST client. Just copy the DLL
    from your /PlugIns folder to the designated VST folder for the client.


    The GUI options are as follows:


    +   - Use VST client''s GUI: VST clients will provide you with a *default interface*
    whose look and feel are determined by the client''s manufacturer. These range
    from a simple bank of sliders to more elaborate GUIs. The client will query your
    plug-in for control information and build the GUI at run time. You do not have
    to provide any extra code for this option.'
  merge: -1
  img_proc: true
