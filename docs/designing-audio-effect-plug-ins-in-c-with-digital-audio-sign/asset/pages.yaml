- pgno: 273
  md: 'smoothes a signal without affecting high-frequency transients, consider the
    following example.


    Example: Design a five-point median filter and test with example.


    Consider this input sequence: x = {1, 2, 1, 0, 1, 2, 3, 3, 2, 1, 8, 9, 9, 7, 5,
    5, 4} in Figure 8.31.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_273_0.png)


    # Figure 8.30: The block diagram of a five-point median filter implementation.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_273_1.png)


    # Figure 8.31: The first four windows of the median filter produce an output sequence
    {1,1,1,2}.


    You can see a transient edge where the signal jumps from 1 to 9 and then another
    transient where it drops from 9 to 7 to 5. The first window operates on the first
    five samples and sorts them from low to high. Then, the median value is chosen
    as the output. The median value is shown in a box in the center of each window.
    You can see the smoothing effect immediately—the first three samples out of the
    filter are all 1, even though the first three samples vary from 1 to 2. Figures
    8.32 and 8.33 show the result of median filtering the signal in Figure 8.31.


    FIR filters can be complicated to design and long convolutions in direct form
    are slow. You can use the FIR design tools when you need to create linear-phase
    filters with very steep roll offs (optimal method) or filters with arbitrary frequency
    responses (frequency sampling method). You might also want to investigate other
    FIR designs such as the windowing method and the recursive frequency sampling
    method.'
