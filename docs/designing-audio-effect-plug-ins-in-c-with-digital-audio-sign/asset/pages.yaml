  md: 'y(n) = a_0x(n) + a_1x(n - 1) + a_2x(n - 2)

    Y(z) = a_0X(z) + a_1X(z)z^{-1} + a_2X(z)z^{-2}

    = X(z)[a_0 + a_1z^{-1} + a_2z^{-2}]


    Form the transfer function H(z):


    H(z) = \frac{output}{input} = \frac{Y(z)}{X(z)} = a_0 + a_1z^{-1} + a_2z^{-2}


    # Step 3: Factor out a_0 as the scalar gain coefficient


    We''ll need to make some substitutions to get this in the form we are used to,
    shown in Equation 5.55:


    H(z) = a_0 + a_1z^{-1} + a_2z^{-2}

    Let \alpha_1 = \frac{a_1}{a_0} \quad \alpha_2 = \frac{a_2}{a_0}

    H(z) = a_0(1 + \alpha_1z^{-1} + \alpha_2z^{-2})


    # Step 4: Estimate the frequency response


    First, this is a pure feed-forward filter, so you know there will only be nontrivial
    zeros; there are no poles to deal with. This transfer function is a second-order
    function because of the z^{-2} term. In fact, this is a quadratic equation. In
    order to find the poles or zeros, you need to first factor this equation and find
    the roots. The problem is that this is a complex equation, and the roots could
    be real, imaginary, or a combination of both. The mathematical break that we get
    is that our coefficients \alpha_1 and \alpha_2 are real numbers. The only way
    that could work out is if the locations of the zeros are complex conjugates of
    one another. When you multiply complex conjugates together the imaginary component
    disappears. So, with some algebra, you can arrive at the deduction shown in Equation
    5.56:


    H(z) = 1 + \alpha_1z^{-1} + \alpha_2z^{-2}


    can be factored as


    H(z) = (1 - Z_1z^{-1})(1 - Z_2z^{-1})


    where


    Z_1 = Re^{j\theta} = a + jb

    Z_2 = Re^{-j\theta} = a - jb


    This analysis results in two zeros, Z_1 and Z_2, located at complex conjugate
    positions in the z-plane. Figure 5.34 shows an arbitrary conjugate pair of zeros
    plotted in the z-plane. You can see how they are at complementary angles to one
    another with the same radii. Remember, any arbitrary point in the z-plane is located
    at Re^{j\theta} and the outer rim of the circle is evaluated for R = 1 and \theta
    between -\pi and +\pi (or 0 to 2\pi).'
