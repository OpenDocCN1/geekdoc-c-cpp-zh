    # 6.7.5 Cascaded Graphic EQ: Non-Constant-Q


    Specify:


    +   - \(f_c\), center frequency

    +   - Gain/attenuation in dB


    The graphic EQ is a fixed Q variation on the parametric EQ. In a graphic EQ, the
    user only has control over the boost and cut of a set of filters tuned to fixed
    center frequencies. The Q that is used will depend on the boost or cut settings
    as well as the number of bands of EQ. For non-constant-Q graphic EQs, the method
    of finding the proper Q can be difficult because the bandwidth will change for
    various settings of the boost/cut. The value for Q is sometimes chosen so that
    when all the'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'controls are set to the maximum boost or cut values, the frequency response
    is as flat as possible.


    The Q for constant-Q filters is easy to calculate knowing the number of bands
    split across the 10 octaves of audio. It is a good starting point for developing
    a non-constant-Q EQ plug-in; experimentation may be needed to find the ideal Q
    for your particular design. You might also allow the user to adjust the value
    within reason. The equation relating Q to the number of EQ bands is Equation 6.44.


    ```

    N = \frac{\text{Number of modules}}{10}


    Q = \frac{\sqrt{2^N}}{2^N - 1}


    (6.44)

    ```


    For a 10-band graphic EQ, Q = 1.414, while for a 31-band (aka 1/3 octave) EQ,
    Q = 4.32. The center frequencies of the bands are usually found with the following
    International Organization for Standardization (ISO) standard equation:


    ```

    q = \frac{\text{Number of bands}}{10}


