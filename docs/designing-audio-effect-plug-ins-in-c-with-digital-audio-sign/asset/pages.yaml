    \ = m_fFeedback_pct;\n\n    // cook it\n    m_DDL.cookVariables();\n}\n```\n\n\
    Write the cookModType() function using the information in Table 10.3—this method\
    \ is called when the user changes the effect type.\n\n```\n/* cookMod() function:\n\
    */\nFlanger    Min Delay (mSec)   Max delay (mSec)   Wet/Dry(%)   Feedback(%)\n\
    Vibrato    0                   7-10               50/50        -100 to +100\n\
    Chorus     5                   20-40              50/50        -100 to +100\n\
    */\nvoid CModDelayModule::cookModType()\n{\n    switch(m_uModType)\n    {\n  \
    \      case Flanger:\n        {\n            m_fMinDelay_mSec = 0;\n         \
    \   m_fMaxDelay_mSec = 7;\n            m_DDL.m_fWetLevel_pct = 50.0;\n       \
    \     m_DDL.m_fFeedback_pct = m_fFeedback_pct;\n            break;\n        }\n\
    \        case Vibrato:\n        {\n            m_fMinDelay_mSec = 0;\n       \
    \     m_fMaxDelay_mSec = 7;\n            m_DDL.m_fWetLevel_pct = 100.0;\n    \
    \        m_DDL.m_fFeedback_pct = 0.0; // NOTE! no FB for vibrato\n        }\n\
    \    }\n}\n```\n\nTable 10.3: The default delay line settings for the various\
    \ effects.\n\n| | Min Delay(mSec) | Max Delay(mSec) | Wet/Dry(%) | Feedback(%)\
    \ |\n|---|---|---|---|---|\n| Flanger | 0 | 7-10 | 50/50 | -100 to +100 |\n| Vibrato\
    \ | 0 | 7-10 | 100/0 | 0 |"
