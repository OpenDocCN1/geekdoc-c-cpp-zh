  md: "+   • Depth = 50%, the gain will swing from 0.5 to 1.0\n\nFor auto-panning,\
    \ a depth of 0 yields no effect while 100% pans the signal through the full left–right\
    \ stereo field. The panning is calculated using the constant power pan rule (Equation\
    \ 14.1). In fact, any plug-in you design that has a pan control on it needs to\
    \ use the same calculation. Instead of linearly adjusting the left and right gains,\
    \ they follow the curves of the first quarter cycle of a sin/cos pair. This way,\
    \ they overlap at the 0.707 points. It should be noted that there are other panning\
    \ schemes, but this one seems to be the most common. The LFO must be in bipolar\
    \ mode for this to work easily.\n\n```\np = \\frac{\\pi}{4}(\\text{LFO} + 1)\n\
    \nGain_L = \\cos(p)\nGain_R = \\sin(p)\nLFO is bipolar\n```\n\n# 14.1.1 Project:\
    \ TremoloPanner\n\nCreate the project and name it “TremoloPanner.” There are no\
    \ other objects or options to add.\n\n# 14.1.2 TremoloPanner: GUI\n\nWe need rate\
    \ and depth controls for the LFO and buttons to change the LFO type and the operational\
    \ mode of the plug-in shown in Table 14.1.\n\n# TremoloPanner.h File\n\nWe need\
    \ to add a wave table object and two gain calculation functions, one for the tremolo\
