  md: '![](img/b54974d0a4317ec82d7ae02126d10a6f_502_0.png)


    # Figure B.12: The finished reverb GUI.


    Figure B.12 shows my finished reverb GUI. I chose the white background just to
    make it easier to print. After you are done, go back to the prototype view and
    rebuild your plug-in. You need this rebuild to embed the new GUI information into
    your code. The GUI styles are coded into UINT arrays in your control variables
    as well as the plug-in object.


    See the website for more details on the encoding. Now, load your plug-in. You
    will notice that the blue knob button on the toolbar is now active. You can open
    your GUI with that button or the menu item View S Custom Plug-In GUI. Figure B.13
    shows the finished GUI. The designer automatically crops it to fit the controls
    you''ve placed on it. When you alter the new GUI controls, the RackAFX controls
    change as well (but not the other way around).


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_502_1.png)


    # Figure B.13: The reverb GUI in action!'
