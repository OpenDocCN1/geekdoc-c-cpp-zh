- pgno: 49
  md: '# # Writing Plug-Ins with RackAFX


    The RackAFX plug-in designer will help you write your plug-in. When you create
    a new RackAFX project, it will set up a new Visual C++ project folder for you
    and populate your project with all the files you will need. It will automatically
    create a new derived class based on the name of your project. When you set up
    graphical user interface (GUI) controls like sliders and buttons, it will write
    and maintain the code for you. You will be switching back and forth between RackAFX
    and your C++ compiler. There are buttons on the RackAFX GUI that will let you
    jump to the compiler as well as launch compiler functions like rebuilding and
    debugging. You will use RackAFX to maintain your GUI and your compiler to write
    the signal processing code.


    # ## 3.1 Building the DLL


    RackAFX sets up your compiler to deliver your freshly built dynamic link libraries
    (DLL) to the /PlugIns folder in the RackAFX application directory. If you ever
    want to see, move, or delete your DLL you can find this folder by using the menu
    item PlugIn > Open PlugIns Folder. Each time you create a new project, RackAFX
    creates a pass-through plug-in by default; you are urged to build and test the
    DLL right after creating the new project to check your audio input/output (I/O)
    and any other connections. You then write over the pass-through code with your
    own processing algorithm.


    After a successful build, you use RackAFX to test and debug the plug-in. You tell
    RackAFX to load the DLL and create your plug-in. The client needs to handle four
    basic operations during the lifecycle of your component:


    +   1. Creation of the plug-in

    +   2. Maintaining the UI

    +   3. Playing and processing audio through the plug-in

    +   4. Destruction of the plug-in


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_49_0.png)'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'Figure 3.1: The new operator in createObject() dynamically creates your plug-in,
    which calls your constructor; the constructor in turn calls initUI() to create
    and initialize the user controls.


    # 3.2 Creation


    When you load a plug-in in RackAFX, you are actually passing the system a path
    to the DLL you''ve created. RackAFX uses an operating system (OS) function call
    to load the DLL into its process space. Once the DLL is loaded, RackAFX first
    runs a compatibility test, then requests a pointer to the creation method called
    createObject(). It uses this pointer to call the method and the DLL returns a
    newly created instance of your plug-in cast as the PlugIn* base class type. From
    that point on, the RackAFX client can call any of the base class methods on your
    object. Figure 3.1 shows the flow of operation during the creation phase.


    Your constructor is where all your variables will be initialized. The very first
    line of code in the constructor has been written for you; it calls initUI(), which
    is a method that handles the creation and set up of your GUI controls. You never
    need to modify the initUI() method; RackAFX maintains this code for you.


    # 3.3 The GUI


    When you set up GUI elements such as sliders and buttons, RackAFX adds member
    variables to the .h file of your derived plug-in class. Each slider or button
    group controls one variable in your code. You set up each control with minimum,
    maximum, and initial values as well as supplying the variable name and data type.
    As the user moves the control, RackAFX calculates the variable''s new value and
    delivers it to your plug-in automatically, updating it in real time. In some cases,
    this is all you will need and there is nothing left to write. In other cases,
    you will need to perform more calculations or logic processing in addition to
    just changing the control variable. So, in addition to changing and updating your
    internal GUI variable, RackAFX will also call the userInterfaceChange() method
    on your plug-in, shown in Figure 3.2.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_50_0.png)


    Figure 3.2: The sequence of events when the user moves the control with ID = 2
    starts with a hidden change to the underlying linked variable, followed by a call
    to userInterfaceChange() passing the control''s ID value as the parameter.


    # 3.4 Processing Audio'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'When the user loads an audio file and hits the Play button, a two-step sequence
    of events occurs. First, the client calls prepareForPlay() on the plug-in. The
    plug-in will do any last initializations it needs before audio begins streaming.
    prepareForPlay() is one of the most important functions to deal with. Your plug-in
    has variables declared in it (see PlugIn.h) that contain information about the
    currently selected audio file:


    ```

    // information about the current playing-wave file

    int m_nNumWAVEChannels;

    int m_nSampleRate;

    int m_nBitDepth;

    ```


    Just prior to calling prepareForPlay(), the client sets these values on your plug-in
    object. The reason this is done at this point is that the user can load multiple
    audio file types of varying channels (mono or stereo), sample rates, and bit depths
    at any time; thus, this is a per-play method. Many algorithms require these values
    to be known before certain things can be created or initialized. Almost all filtering
    plug-ins require the sample rate in order to calculate their parameters correctly.
    After prepareForPlay() returns, audio begins streaming. When audio streams, the
    client repeatedly calls processAudioFrame(), passing it input and output buffer
    pointers as shown in Figure 3.3. This continues until the user hits Pause or Stop.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_51_0.png)


    **Figure 3.3:** The sequence of events during the play/process operation; audio
    data from the file is processed in the plug-in and sent to the audio adapter for
    monitoring.


    # ## 3.5 Destruction


    When the user unloads the DLL either manually or by loading another plug-in, the
    client first deletes the plug-in object from memory, which calls the destructor.
    Any dynamically declared variables or'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'buffers need to be deleted here. After destruction, the client unloads the
    DLL from the process space.


    # 3.6 Your First Plug-Ins


    You can break the audio processing down into two very fundamental types:


    +   1. Processing that only works on the current audio sample; requires no memory
    elements

    +   2. Processing that requires the current _and_ past audio samples; requires
    memory elements


    We''ll start with the first type and make a simple volume control. After that,
    we''ll design a simple Audio Equalizer (EQ) control that will require memory elements.
    You will need the following installed on your computer:


    +   - RackAFX

    +   - Microsoft Visual C++ Express® 2008 or 2010 (both are free from Microsoft)

    +   - Microsoft Visual C++ Professional® 2008 or 2010


    There is no advantage to having the full version of Visual C++ (aka VC++) in RackAFX
    programming unless you plan on using your own GUI resources. Make sure that Visual
    C++ is installed on the same machine as RackAFX. See the website www.willpirkle.com
    for updates on supported compiler platforms. Once you understand the flow of writing
    and testing your plug-ins, you will find that you can move easily and swiftly
    through the rest of the book''s projects because they all follow the same design
    pattern and the design chapters will use the same conventions for each project.


    # 3.6.1 Project: Yourplugin


    The first step will always be the creation of a new project. In this phase, RackAFX
    creates the C++ project directory and files along with a derived class based on
    the project name.


    # 3.6.2 Yourplugin GUI


    Next, you lay out your GUI controls based on the algorithm you are following and
    decide on the variable data types and names that will connect the GUI elements
    to your plug-in. This generally starts with writing the difference equation(s)
    for the algorithm. Variables in the difference equation will map to member variables
    and GUI controls in your plug-in. Abstracting the GUI from the algorithm requires
    that you decide which parameters you want the user to be able to adjust, as well
    as the variable names, min, max, and initial values, and data types. You can change
    your mind later and remove GUI elements or alter their parameters. A full-featured
    GUI designer allows you to finalize your plug-in''s controls and package them
    in a neat and clean GUI. Often during the prototyping phase, you set up many sliders
    and controls and work on the voicing of the plug-in. Then, you hide some of them
    for the final product, only allowing the user access to a specific set of controls
    over a specific set range of values. This last step is part of the voicing of
    the final product.


    # 3.6.3 Yourplugin.h File'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'The next phase involves adding your own member variables and member methods
    to the derived plug-in class. The variables and methods will depend on the algorithm
    you are implementing. In the first plug-in there are no extra variables or methods
    to supply.


    # 3.6.4 Yourplugin.cpp File


    In this step, you will add the new member method implementations (if you have
    any). Then, you will step through the .cpp file, altering and filling in the base
    class methods, typically in this order:


    +   1. Constructor

    +   2. prepareForPlay()

    +   3. userInterfaceChange()

    +   4. processAudioFrame()


    Once these methods have been implemented, you will technically have a working
    plug-in.


    # 3.6.5 Building and Testing


    Finally, you will build the DLL, finding and fixing any issues. After the build
    succeeds, you can load it into the RackAFX client. You can use audio files, the
    oscillator, or your sound adapter input as the audio stimulus for your plug-in.
    You can run your plug-in in three modes: Insert, Mono > Stereo AUX, or Stereo
    > Stereo AUX to mimic the various ways a plug-in is used in a digital audio workstation
    (DAW).


    # 3.6.6 Creating and Saving Presets


    The presets are created and maintained on the main RackAFX UI. After you load
    your plug-in you can move the controls as you like and then save them as a preset.
    You use the Save Preset button on the toolbar. The presets will be saved inside
    a file until the next time you compile your plug-in; after that, the presets will
    be built into the DLL. You can add, modify, or delete the presets any time the
    plug-in is loaded.


    # 3.6.7 GUI Designer


    Once you have debugged and finished your plug-in, you can optionally use the GUI
    designer to create a compact, visually appealing GUI. See Appendix B and the website
    www.willpirkle.com for the latest details on using the GUI designer tools. In
    general, the book skips the GUI designer phase because it is so open ended; you
    are free to layout your final GUI however you wish. Check the website often for
    the latest news and example GUIs as well as video tutorials.


    # 3.7 Design a Volume Control Plug-In


    The easiest meaningful plug-in to write is a volume control, which uses a single
    scaling variable, a2, depicted in Figure 3.4.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '![](img/b54974d0a4317ec82d7ae02126d10a6f_54_0.png)


    # Figure 3.4: The volume control block diagram.


    > Coefficients in a block diagram (or transfer function or algorithm) become float
    member variables in your plug-in code.


    +   - a_2 = 0: Mute

    +   - a_2 = 1.0: Max volume


    The output samples y(n) are a scaled version of the input x(n) and the scaling
    factor is named a_2. a_2 is called a coefficient in the algorithm. The algorithm
    states that a_2 will vary between 0 (mute) and 1.0 (full volume).


    # 3.8 Set up RackAFX for Use


    Start the RackAFX software. You will start in prototype view, where you will see
    a blank control surface as shown in Figure 3.5. Your GUI may look slightly different
    or have different background images.


    The control surface is what you use to create your UI. It is full of assignable
    controls you can connect to your plug-in''s variables. The surface consists of:


    +   - 40 assignable sliders (continuous controls).

    +   - Universal LCD control with 1024 more continuous controls.

    +   - Project controls (open, load, edit, rebuild, debug, jump to C++).

    +   - Vector joystick (advanced, see website for more details).

    +   - Assignable buttons.

    +   - 10 assignable LED meters.

    +   - Plug-in routing controls to test insert and aux effect modes.

    +   - Prototype tab, the main GUI.

    +   - GUI designer tab, which opens the designer for editing; you must have GUI
    controls declared first. See the website for more details.


    The menu and toolbar consist of two parts: the left and right side. The left side
    (Figure 3.6) implements the majority of the software functionality, while the
    right side (Figure 3.7) maintains lists.'
  merge: -1
  img_proc: true
