    Next, calculate the poles and zeros of the transfer function. We can see that
    this is a pure feed-forward filter in its current state so there are only zeros.
    We need to find the roots of the equation for H (z):


    0 = 1 + z^{-D}

    = z^{D} + 1

    z^{D} = -1

    Let z = e^{j\omega}

    e^{jD\omega} = -1


    Apply Euler

    cos(Do) + j sin(Do) = -1


    The roots (zeros) of the function lie wherever Do causes the equation to evaluate
    to -1 +j0, and we know this will happen when Equation 7.6 holds true.


    cos(\theta) + j sin(\theta) = -1 + j0

    if

    \theta = \pm \pi, \pm 3\pi, \pm 5\pi, etc...


