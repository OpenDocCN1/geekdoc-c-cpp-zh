- pgno: 494
  md: '![](img/b54974d0a4317ec82d7ae02126d10a6f_494_0.png)


    Figure B.1: The New button pops up the slider properties to add a control to the
    LCD.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_494_1.png)


    Figure B.2: The LCD is loaded with three controls.


    An alternative way to use the LCD control is for global operations (like effects
    configurations) or to store presets, either because you need more than RackAFX
    provides or you need to write your own methods for loading and storing data. You
    can use the enumerated list variable to create up to 256 individual string names.
    You can also take advantage of a feature of the LCD control: You can use the underscore
    (_) to separate strings in your list (you can''t have spaces in an enumerated
    name). When the LCD control uses them, it replaces the underscores with single
    white spaces. This allows you much more flexibility than the radio buttons or
    normal sliders provide. For example, you could set up a preset list with names
    like “Heavy_Lead,” “Liquid_Pad,” “Lush_Space,” and so on. Then, you can use the
    up/down arrows to place your “presets” control at the top of the control list.
    Now, as shown in Figure B.4, the user can select one of your custom presets (remember,
    it’s up to you to code your own preset format) and then scroll to adjust the other
    controls. The underscores have been replaced with spaces.'
