    # ## 2.7 The RackAFX Philosophy and API


    The fundamental idea behind the RackAFX software is to provide a platform for
    rapidly developing real-time audio signal processing plug-ins with a minimum of
    coding, especially with regard to the UI. In fact, most of the details of the
    connection between the RackAFX plug-in and the RackAFX UI screen are hidden from
    the developer so that he or she may concentrate more on the audio signal processing
    part and less on the UI details.


