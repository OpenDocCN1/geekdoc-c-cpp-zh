    # 7.3 Design a DDL Module Plug-In


    In the previous projects, it was easy enough to simply declare left and right
    delay elements and coefficients for our simple filters. However, as the filters
    become more complex, this becomes more tedious and is also bad coding practice
    since we have replicated some code. For educational purposes, it is better to
    split the code out at first, but now it''s time to think modularly. More complicated
    delay effects like the stereo cross feedback or LCR (left center right) delay
    will be easier to implement if we have a flexible delay module to work with. In
    this project, you will create a DDL module that you can use in many other projects.
    It is going to be a slight modification on the above DDL + wet/dry control. Here
    are the specifications:


    +   - Implements an n-sample delay line, user controllable, up to 2 seconds of
    delay.

    +   - Delay is given in milliseconds.

    +   - Has feedback capable of –100% to +100% operation.

    +   - Has wet/dry mix ratio control; 50/50 is an equal mix while 100/0 is full
    wet (delay only).

    +   - Allows the feedback sample to be taken from the delay line, or supplied
    “outside” the module; the reason for this will become evident later.

    +   - Allows access to the current feedback output sample. This allows you to
    insert other effects into the feedback path by using the switch to choose feedback_in;
    it also allows for cross coupling the feedback paths of stereo modules.'
