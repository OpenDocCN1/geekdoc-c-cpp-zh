- pgno: 326
  md: "```\nbool __stdcall CModDelayModule::processAudioFrame(float* pInputBuffer,\
    \ float*\n        pOutputBuffer, UINT uNumInputChannels,\n        UINT uNumOutputChannels)\n\
    {\n    // Do LEFT (MONO) Channel\n    //\n    // 1. Get LFO Values, normal and\
    \ quad phase\n    float fYn = 0;\n    float fYqn = 0;\n    m_LFO.doOscillate(&fYn,\
    \ &fYn, &fYqn);\n\n    // 2. calculate delay offset\n    float fDelay = 0.0;\n\
    \    if(m_uLFOPhase == quad)\n        fDelay = calculateDelayOffset(fYqn); //\
    \ quadrature LFO\n    else\n        fDelay = calculateDelayOffset(fYn); // normal\
    \ LFO\n\n    // 3. set the delay & cook\n    m_DDL.m_fDelay_ms = fDelay;\n   \
    \ m_DDL.cookVariables();\n\n    // 4. get the delay output one channel in/one\
    \ channel out\n    m_DDL.processAudioFrame(&pInputBuffer[0], &pOutputBuffer[0],\
    \ 1, 1);\n\n    // Mono-In, Stereo-Out (AUX Effect)\n    // if(uNumInputChannels\
    \ == 1 && uNumOutputChannels == 2)\n    pOutputBuffer[1] = pOutputBuffer[0];\n\
    \n    // Stereo-In, Stereo-Out (INSERT Effect)\n    // if(uNumInputChannels ==\
    \ 2 && uNumOutputChannels == 2)\n    pOutputBuffer[1] = pOutputBuffer[0];\n\n\
    \    return true;\n}\n```\n\nBuild and test the module. Be sure to listen to the\
    \ flanger as the delay hits the zero point.\n\n# 10.3.6 Challenge\n\nAdd another\
    \ radio button switch to turn on or off TZF that we employ. To turn off TZF, set\
    \ the minimum delay time for flanging to a nonzero value (try 0.1 mSec to begin\
    \ with) in the cookModType() method. You now have a working modulated delay module\
    \ that can be combined in many ways to create a wide variety of modulated delay\
    \ effects. Let's try a couple of them now.\n\n# 10.4 Design a Stereo Quadrature\
    \ Flanger Plug-In\n\nThe block diagram of the stereo quad flanger is shown in\
    \ Figure 10.5 and it consists of two identical flanger delay lines running off\
    \ of LFO values that are in quadrature phase. Since our mod delay module has a\
    \ built-in LFO and delay, we can assemble this plug-in quickly.\n\n# 10.4.1 Project:\
    \ StereoQuadFlanger\n\nMake sure to add all the existing modules when you create\
    \ the new StereoQuadFlanger project:\n\n+   • ModDelayModule.h."
