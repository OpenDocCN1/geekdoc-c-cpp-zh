    # B.3 Using the sendUpdateGUI() Method


    This is a perfect place to explain how to use the sendUpdateGUI() method. You
    can force the user interface (UI) (RackAFX or a custom graphical user interface
    [GUI]) to change its settings based on your internal variable values. This is
    opposite the normal flow where the GUI calculates and alters your variables. In
    this case, you alter your own variable and tell the GUI to update accordingly.
    This can be used to move sliders in real time or toggle radio buttons programmatically.
    The joystick drop lists present an interesting use of this method. Suppose you
    wanted to have four identical lists that represent the joystick corners, such
    as {A, B, C, D} = {SINE, SAW, TRIANGLE, NOISE} and the user will move the joystick
    to produce a mixture of low-frequency oscillators (LFOs) in your plug-in. You
    would like the lists to contain the same values, but you would like to initialize
    them with other values than the first one. For example, you might want the initial
    state of the boxes to show SINE for A, SAW for B, NOISE for C, and TRIANGLE for
    D (notice this is different than the order of the list) too. When you set up the
    enumerated list, you give it a list variable to connect to (e.g., m_uApexA) and
    a list that goes along with that. By clicking “Use Existing String List,” then
    double-clicking on any of the items in the list, you can legally share your string
    lists. This is something we did not cover in the book chapters because it is a
    more advanced feature. Then, in your code (prepareForPlay() or wherever you need
    to) you can alter your own unsigned integer type (UINT) variables then call sendUpdateGUI()
    to show the changes. For example, to initialize the drop lists as described above,
    you would add this code to your prepareForPlay() method:


    ```

    // set my variables

    m_uApexA = SINE;

    m_uApexB = SAW;

    m_uApexC = NOISE;

    m_uApexD = TRIANGLE;


    // tell the GUI to change accordingly

    sendUpdateGUI();

    ```


    Theoretically, you can do this from any point in the code except the constructor
    (because the messaging pointer isn''t assigned until after construction), even
    from the joystick handler if needed. However, you should never initiate client
    communication like this in the processAudioFrame() method as it relies on a slow
    window-messaging system. This is true for other plug-in formats as well. Remember
    that you can use the sendUpdateGUI() method to alter the GUI for any of the RackAFX
    4 Plug-In connected variables.'
  merge: -1
  img_proc: true
- pgno: 499
  md: '# B.4 Using GUI Designer


    RackAFX has a powerful GUI designer that lets you arrange visually appealing GUIs
    in a matter of just a few moments. The GUI designer is always being updated with
    more features, so always check the latest additions at the website. Depending
    on which version you have, your GUI designer will look more or less like that
    shown in Figure B.8. The flow of operations is as follows:


    +   1. In prototype view (the main RackAFX view), you assemble your plug-in. You
    create controls, give them min, max, and initial values, connect them to variables,
    and so on. Because this is a development mode, you will probably change some controls,
    add or remove them, and so on. Also, because we are prototyping, we can set up
    a bunch of controls we really would not want the user to be able to adjust in
    the final plug-in. An excellent example is the reverb plug-in; once we''ve got
    those parallel comb filters tuned, we don''t want the user messing with them.

    +   2. After your plug-in is complete, debugged, and ready to go, you click on
    the GUI Designer tab to reveal the blank GUI surface, shown in Figure B.8.

    +   3. You drag and drop controls from the left side and arrange them however
    you like on the surface. Because they have transparent backgrounds, they can be
    overlapped.

    +   4. For the slider, radio buttons, and knob controls, you must connect the
    control with the variable in your plug-in that it will control.

    +   5. The LCD and vector joystick controls don''t need any additional setup.


    Suppose after testing we decide that the final GUI for the reverb project needs
    to have the following controls, while hiding all the others:


    +   • Pre-delay time

    +   • Pre-delay attenuation

    +   • Bandwidth


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_499_0.png)


    Figure B.8: The GUI Designer.'
  merge: -1
  img_proc: true
- pgno: 500
  md: '![](img/b54974d0a4317ec82d7ae02126d10a6f_500_0.png)


    # Figure B.9: Customizing a knob by right-clicking it.


    +   - Damping

    +   - RT60

    +   - Wet/dry


    Any of the prototype''s sliders can be dragged and dropped either as knobs or
    sliders using the palette on the left. Figure B.9 shows the GUI designer after
    one knob control has been placed and mapped to the pre-delay time. A second knob
    has just been dropped next to it. Right-clicking on the knob itself pops up another
    customization box. Here you can do the following:


    +   - Connect the knob to a variable via the drop list.

    +   - Change the appearance of the knob and dot combination.

    +   - Change the edit box behavior, hide it, or change its colors.

    +   - Set all the other knobs to match this one.


    You can do similar things for the radio buttons, meter, or the slider control,
    as shown in the pop-up boxes in Figures B.10 and B.11. The current GUI designer
    rules are as follows:


    +   - For sliders, you link to a control variable, just like the knobs. You can
    customize many aspects of the slider control''s appearance.

    +   - When you run out of continuous controls (sliders) you can''t drag any more
    knobs/slider controls.

    +   - Each time you drag a knob or slider, you must set it up before dragging
    any other knobs or sliders.

    +   - The joystick can have its colors altered and you can set the program button
    to look like the assignable buttons. There can be only one joystick.

    +   - You can change the IN and OUT button bitmaps for the assignable buttons.
    There can be only one assignable button bank.

    +   - You can add any continuous control (slider) to the GUI LCD group; it is
    a separate entity from the one on your main RackAFX GUI. Here I added bandwidth
    and damping. There can be only one LCD control.'
  merge: -1
  img_proc: true
- pgno: 501
  md: '+   - When you drag meter controls, RackAFX starts with the leftmost meter
    on the main GUI and automatically links your control variable for you. It then
    moves from left to right as you drag and drop meters. If you need to skip meters,
    add all the meters first, then remove the ones you don''t want.

    +   - When you add radio button controls, RackAFX starts with the topmost button
    bank on the main GUI and automatically links your control variable for you. It
    then moves from top to bottom as you drag the radio buttons. If you need to skip
    button banks, add all of them first, then remove the ones you don''t want. The
    buttons banks are highly customizable.


