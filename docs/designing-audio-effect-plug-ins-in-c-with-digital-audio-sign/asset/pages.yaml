    \ of channels to process)\n+   - bool: &ioSilence (indicates no processing, if\
    \ true)\n\nHere is the AU process function for a volume plug-in.\n\n```\nvoid\
    \ AURVolume::AUVolumeKernel::Process(const Float32\t\t*inSourceP,\n\t\t\t\t\t\t\
    \t\tFloat32\t\t*inDestP,\n\t\t\t\t\t\t\t\tUInt32\tinFramesToProcess,\n\t\t\t\t\
    \t\t\t\tUInt32\tinNumChannels,\n\t\t\t\t\t\t\t\tbool\t\t&ioSilence)\n{\n\t// setup\
