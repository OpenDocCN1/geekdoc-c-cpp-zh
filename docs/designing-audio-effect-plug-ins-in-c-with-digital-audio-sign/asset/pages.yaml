- pgno: 440
  md: "```\n// calculate the compressor G(n) value from the Detector output\nfloat\
    \ CDynamicsProcessor::calcCompressorGain(float fDetectorValue, float fThreshold,\n\
    \                                             float fRatio, float fKneeWidth,\
    \ bool bLimit)\n{\n    // slope variable\n    float CS = 1.0 - 1.0/fRatio; //\
    \ [Eq. 13.1]\n\n    // limiting is infinite ratio thus CS->1.0\n    if(bLimit)\n\
    \        CS = 1;\n\n    // soft-knee with detection value in range?\n    if(fKneeWidth\
    \ > 0 && fDetectorValue > (fThreshold - fKneeWidth/2.0) &&\n       fDetectorValue\
    \ < fThreshold + fKneeWidth/2.0)\n    {\n        // setup for Lagrange\n     \
    \   double x[2];\n        double y[2];\n        x[0] = fThreshold - fKneeWidth/2.0;\n\
    \        x[1] = fThreshold + fKneeWidth/2.0;\n        y[1] = min(0, x[1]); //\
    \ top limit is 0dBFS\n        y[0] = 0; // CS = 0 for 1:1 ratio\n        y[1]\
    \ = CS; // current CS\n\n        // interpolate & overwrite CS\n        CS = lagpol(&x[0],\
    \ &y[0], 2, fDetectorValue);\n    }\n\n    // compute gain; threshold and detection\
    \ values are in dB\n    float y6 = CS*(fThreshold - fDetectorValue); // [Eq. 13.1]\n\
    \n    // clamp; this allows ratios of 1:1 to still operate\n    y6 = min(0, y6);\n\
    \n    // convert back to linear\n    return pow(10.0, y6/20.0);\n}\n```\n\n# prepareForPlay()\n\
    \n+   • Initialize the detector objects; note the boolean flags that set the analog/digital\
    \ and log or linear calculation; we use log."
