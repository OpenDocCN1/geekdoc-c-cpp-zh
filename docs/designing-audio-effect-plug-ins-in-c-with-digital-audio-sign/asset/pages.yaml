    # Figure 8.26: The IR for the 104th-order optimal method LPF.


    # Experiment:


    +   - Load a wave file and audition the filter.

    +   - Try the other filter types (HPF, BPF, BSF).

    +   - Adjust the order control noting when the Remez exchange algorithm fails
    to converge or the filter blows up.

    +   - Try to find the lowest possible filter order to just match the desired specifications.

    +   - Save IR files with various filters you design.

    +   - Copy and paste the IR code into your own convolution plug-in.


    # 8.10 Design a Convolution Plug-In


    In order to implement the convolution (FIR) algorithm you need to use the delay
    line theory from the last chapter. The filters often need hundreds or thousands
    of delay elements and you know that a circular buffer works perfectly for storing
    and updating a sequence of x(n), x(n - 1), x(n - 2)... . In addition, the IR will
    need to be stored in a buffer and accessed sequentially with a pointer like the
    input buffer. The convolution equation in Equation 8.2 accumulates from -∞ to
    +∞ which uses both past and future data. We can only use past data and so we only
    need half of the equation. The generalized FIR convolution equation is Equation
    8.7:


    ```

    y(n) = h₀x(n) + h₁x(n - 1) + h₂x(n - 2) + ... + hₘ(n - M) ........................
    (8.7)

    ```


    The number of delay elements is M-1 since the first term h₀x(n) operates on the
    current, undelayed input signal. So, a 64-tap FIR requires 63 delay elements.
    Remember from Chapter 7 that when we access a circular buffer and write the current
    input sample, we are overwriting the oldest sample, x(n - M) but we can use this
    to our advantage in this case by using a 64-element circular buffer to implement
    a 64-tap FIR and by writing in the first sample before doing the convolution operation.
    This will give us a buffer with x(n) through x(n - M - 1) lined up and ready for
    access. We will have an identically sized buffer to store the IR, h(n). During
    the convolution operation we zip through both buffers at the same time, accumulating
    the product of each operation. The only tricky thing is that the IR buffer will
    be reading sequentially from top to bottom exactly once each sample period to
    create the sequence h(0), h(1), h(2), and so on. The input buffer will be circular
    and reading backwards to create the sequence x(n), n(n - 1), x(n - 2), and so
    on, shown graphically in Figure 8.27.'
  merge: -1
  img_proc: true
