    \ and resume()\n\nprepareForPlay() is special for RackAFX because it is called\
    \ after the sample rate is set. In VST, this is done in setSampleRate(). We also\
    \ use prepareForPlay() to flush out our delay line buffers and do any other preparations\
    \ for the next run of the plug-in. The resume() function is called when the VST\
    \ plug-in is turned on so we can flush buffers there.\n\n```\nvoid CDelay::setSampleRate(float\
    \ sampleRate)\n{\n\t// Left\n\tif(m_pLeftBuffer)\n\t\tdelete m_pLeftBuffer;\n\n\
    \t// Create a 2 second buffer\n\tm_pLeftBuffer = new float[2*(int) sampleRate];\n\
    \n\t// Right\n\tif(m_pRightBuffer)\n\t\tdelete m_pRightBuffer;\n\n\t// Create\
    \ a 2 second buffer\n\tm_pRightBuffer = new float[2*(int) sampleRate];\n\n\t//\
    \ flush buffers\n\tmemset (m_pLeftBuffer, 0, 2*(int) sampleRate * sizeof (float));\n\
    \tmemset (m_pRightBuffer, 0, 2*(int) sampleRate * sizeof (float));\n}\n```\n\n\
    ```\nvoid CDelay::resume()\n{\n\t// flush buffer\n\tmemset (m_pLeftBuffer, 0,\
    \ 2*(int) sampleRate * sizeof (float));\n\tmemset (m_pRightBuffer, 0, 2*(int)\
    \ sampleRate * sizeof (float));\n\n\t// reset read/write indices, etc...\n\tm_nReadIndex\
    \ = 0;\n\tm_nWriteIndex = 0;\n\n\tetc...\n}\n```\n\n# processAudioFrame() → processReplacing()"
