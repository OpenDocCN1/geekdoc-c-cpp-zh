    }

    ```


    Of course you could also write a function to calculate and populate the IR buffers,
    but this one is short enough to code by hand if you want.


    The frequency response (Figure 8.29) of an MA filter is always an LPF. The more
    samples that are averaged, the more stop-band attenuation and the more zeros get
    inserted into the z-plane. For this filter there is a pair of complex conjugate
    zeros which produce two null points in the response.


    You can see this is a pretty poor LPF compared to some of the optimal filter designs,
    but these filters can be very useful, for example to smooth the response of an
    audio detector output or to insert in the feedback path of a delay line module
    to gently roll off high frequencies on each pass through the delay. You can get
    better stop-band attenuation by increasing the order of the filter. This will
    also effectively pull in the corner frequency, which looks like about 2.5 kHz
    here. Experiment with higher-order MA filters, or add a slider to let the user
    adjust the window size. This exact filter already exists as a RackAFX module called
    a “Smoothing Filter” for you to experiment with.


