  md: '![](img/b54974d0a4317ec82d7ae02126d10a6f_371_0.png)


    # Figure 11.36: The absorbent APF features an LPF and attenuator in line with
    the delay element.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_371_1.png)


    # Figure 11.37: Dahl and Jot''s late reverberator using a unitary feedback matrix
    M and absorbent APFs.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_371_2.png)


    # Figure 11.38: The FDN and diffusion network from the GA reverb.


    Two different FDNs were used; the normal four-delay line and the delay and LPF
    in series (Figure 11.35, but without the correction filter on the output). An
    impulse response was taken for the target listening environment. The GA fitness
    function used the time domain envelope of the target impulse response for the
    matching criteria on the output of the system. During each iteration, the top
    35% of offspring candidates were kept and inter-mated. Mutation rates of 10% for
    the delay coefficients and 5% for the LPF cutoff frequencies were used. More details
    can be found in the original reference.


    We''ve analyzed many types of reverberator building blocks and complete algorithms.
    By now you should be able to see that reverb design is fairly open-ended. An example
    room reverb design follows.


    # 11.15 An Example Room Reverb


    For an example reverb, we have assembled a combination of reverberator modules
    to implement a mono-in, stereo-out reverb. The reverb is based on many of the
    modules and classic algorithms we''ve'
  merge: -1
  img_proc: true
- pgno: 372
  md: 'studied so far. The idea is to produce a realistic-sounding algorithm that
    uses several of the more common reverberator modules so that you can use it as
    a springboard for your own designs. It is a good place to start your experiments
    because it features a variety of reverberator modules to help you get a better
    understanding of how the parameters change the overall reverb sound. Figure 11.39
    shows the stereo impulse response for the factory preset; notice the pre-delay,
    early reflections, and late reverb sections are all present. Figure 11.40 shows
    the block diagram and graphical user interface (GUI) components for the example
    reverb. The complete algorithm consists of the following:


    +   - Pre-delay with output attenuation.

    +   - Input LPF ("bandwidth").

    +   - Two input APF diffusion modules.

    +   - Two parallel comb filter banks; four comb filters per bank; one bank for
    left output, one for right.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_372_0.png)


    **Figure 11.39: A stereo impulse response of the reverb plug-in, 100% wet output.**


    +   - Two comb filters in each bank are LPF-comb filters.

    +   - Each parallel comb filter bank feeds an output LPF ("damping").

    +   - The output LPF damping control also adjusts the LPF-comb filter g values.

    +   - Each output LPF feeds an output APF diffusion module.

    +   - A single RT60 Control for all comb filter gain variables.

    +   - Individual APF and LPF controls for all parameters.


    You can see many familiar components of this algorithm. The inputs are summed
    together to form a mono-signal and the left and right outputs are taken from two
    separate parallel comb filter echo generation units. The input bandwidth and output
    damping filters are the same as the Dattorro version but they also control the
    LPF-comb filter cutoffs. The parallel comb filter banks are reminiscent of the
    Schroeder and Moorer algorithms. These reverb algorithms often contain multiple
    instances of the same kinds of filters—APF, Comb, LPFComb, and so on. RackAFX
    provides you with several of these stock objects to use in your plug-ins. This
    will allow you to quickly assemble variations on the algorithms. Here are some
    key points for the design:'
  merge: -1
  img_proc: true
- pgno: 373
  md: '+   • We follow Schroeder''s rule of about 1:1.5 ratio for shortest to longest
    comb filter delay (27.50 to 39.34 is our range, almost exactly 1:1.5).

    +   • The RT60 time is used to calculate the gain variables for the comb filters
    for a less colored sound.

    +   • The diffusion APFs alternate the sign of the g coefficient to create inverted/normal
    diffusion.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_373_0.png)


    # Figure 11.40: The room reverb algorithm.


    +   • Adjusting the input APF delays has an effect on early reflections.

    +   • Adjusting the output APF delays has a tonal coloration effect on the final
    reverb.

    +   • The key to less ringing/metallic sound is getting the parallel comb filter
    delays just right, and not violating the 1:1.5 rule.

    +   • The parallel comb filter attenuators, c0—c7 are hard-coded as 0.15, but
    there are several ways you could experiment with this, or allow the user to control
    it. They also have alternating signs, which was found to greatly reduce pinging.

    +   • You can also provide unequal weighting such that the shorter (or longer)
    combs are more (or less) emphasized.


