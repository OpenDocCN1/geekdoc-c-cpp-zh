    +   2. Establish the communication mechanism for functions to be called.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_39_0.png)


    Figure 2.2: The process address space is a 4-gigabyte memory map starting at address
    0x00000000 and going to 0xFFFFFFFF. When the client is launched it is placed inside
    the memory space. (a) An in-process DLL communicates directly with the client
