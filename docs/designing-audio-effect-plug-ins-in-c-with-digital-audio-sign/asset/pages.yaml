- pgno: 240
  md: '# 7.9.1 Advanced DDL Module


    The more flexible module in Figure 7.33 allows the parent to have access to the
    input and pre-wet output of the delay line and the input and output of the feedback
    path. Another module (low-pass filter, for example) could be inserted here or
    it could be used for more crossed-delay modes.


    # 7.9.2 Delay with LPF in Feedback Loop


    Analog delays suffer a high frequency loss on each path through the delay line/feedback
    path. This can be modeled with a LPF in the feedback path, as shown in Figure
    7.34. You can try first- or second-order filters with or without resonance for
    a variety of interesting delay effects. For other ideas, try changing the type
    (LPF, high-pass filter, band-pass filter, band-stop filter) or location (before
    or after the fb coefficient). Be careful with adding resonant or high-gain filters
    in the feedback loop. You could also inject some filtered white noise into the
    feedback path to simulate the noisy characteristics of typical analog delays.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_240_0.png)


    Figure 7.33: A DDL module with more input and feedback path options.


    # 7.9.3 Multi-Tap Delay


    The multi-tap delay line shown in Figure 7.35 produces four separate delays from
    one unit. Only the longest delay is fed back in this version. You create the multiple
    taps by simply declaring more read index values (m_nReadIndexTap_1, m_nReadIndexTap_2,
    etc.); the multiple taps are used and incremented exactly the same as the single
    tap case.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_240_1.png)


    Figure 7.34: An analog delay modeled with an LPF in the feedback loop.'
  merge: -1
  img_proc: true
