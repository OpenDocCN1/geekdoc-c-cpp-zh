- pgno: 466
  md: '# Miscellaneous Plug-Ins


    There are a few effects left over that didn''t have an exact chapter to reside
    in, so they are presented here. Interestingly, they are some of the simplest to
    implement but can have a massive sonic impact on the audio they process. These
    effects include


    +   * Tremolo

    +   * Auto-panning

    +   * Ring modulation

    +   * Wave shaping


    # 14.1 Design a Tremolo/Panning Plug-In


    The tremolo is a modulated amplitude effect that uses a low-frequency oscillator
    (LFO) to directly modulate the output. The LFO waveform is usually triangular
    or sinusoidal. If the LFO is a square wave, it produces a gapping effect, where
    intermittent chunks of audio are alternatively muted then restored to unity gain.
    An auto-panning algorithm pans the signal from left to right following an LFO.
    Since they are both amplitude-based effects we can combine them into one plug-in.
    The block diagrams are shown in Figure 14.1.


    We will allow the user to switch between tremolo and auto-panning modes. For the
    tremolo, the LFO will be in unipolar mode, swinging between 0 and 1.0, and the
    LFO depth will modulate the amplitude of the input signal. The only tricky part
    is to decide how far below 1.0 the effect will reduce gain. For the tremolo, we
    define the depth as follows:


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_466_0.png)


    Figure 14.1: (a) A tremolo effect uses an LFO to modulate the amplitude of the
    input. (b) The auto-panning plug-in uses the LFO to calculate scaling values for
    the two digitally controlled amplifiers DCA L and DCA R to pan the signal from
    the left to the right.


    +   * Depth = 100%, the gain will swing from 0.0 to 1.0

    +   * Depth = 75%, the gain will swing from 0.25 to 1.0'
