- pgno: 203
  md: '# Delay Effects and Circular Buffers


    Before we can start looking at some finite impulse response (FIR) algorithms,
    we need to deal with the concept of long delay lines or circular buffers. Not
    only are they used for the delay effects, but also they are needed to make long
    FIR filters. In this chapter we''ll take a break from the DSP filter algorithms
    and develop some digital delays. If you think back to the infinite impulse response
    (IIR) filters you''ve worked on so far you will remember that after implementing
    the difference equation, you need to shuffle the z^-1 delay element values. You
    do this by overwriting the delays backwards, like this:


    ```

    m_f_z2 = m_f_z1;

    m_f_z1 = xn; // xn is the input sample

    ```


    Suppose you had a filter that was higher than a second-order one and you had to
    implement z^-4 using discrete variables for each delay element. You might wind
    up writing something like this to do the shuffling:


    ```

    m_f_z4 = m_f_z3;

    m_f_z3 = m_f_z2;

    m_f_z2 = m_f_z1;

    m_f_z1 = xn; // xn is the input sample

    ```


    But what happens when the delay line gets really long, like z^-1024 or, for a
    1-second digital delay, z^-44100? It''s going to be difficult to implement the
    delay shuffling this way. Not only would it be tedious to code, it would also
    be very inefficient to have to implement all those read/write operations each
    sample period. The answer to the problem of long delay lines is called circular
    buffering.


    Digital signal processors (DSPs) have an interesting feature in the address generation
    unit (AGU), which allows you to declare a buffer of data to be addressed circularly.
    This kind of addressing is not built into the C++ programming language''s array
    access operation. We will have to code the mechanism ourselves. When you declare
    a buffer, the addressing is linear.


    This means that the pointer will add or subtract the offset you provide and move
    linearly to the next location. Suppose you declare a buffer of floats like this:


    ```

    float Buffer[1024];

    ```


    and a pointer to the buffer:


    ```

    float* pBuffer = &Buffer[0];

    ```


    and then you enter a loop which accesses the data, incrementing by five addresses
    each time through the loop:'
  merge: -1
  img_proc: true
- pgno: 204
  md: "```\nfor(int n=0; n<someNumber; n+=5)\n{\n    float data = pBuffer[n];\n}\n\
    ```\n\nWhat happens if the pointer is accessed outside the buffer, as shown in\
    \ Figure 7.1 ? Usually a crash or debug halt. You always have to be careful when\
    \ setting up a loop like that one to make sure the pointer never accesses outside\
    \ the buffer. But what if you are stuck with a certain sized buffer and a different\
    \ sized loop so that you are never sure if the pointer is going to go outside\
    \ the buffer on the next iteration? In a DSP chip, when you declare a buffer to\
    \ be circular, you are setting up a pointer access mechanism. Reads and writes\
    \ are made with a pointer, which is incremented or decremented by some amount\
    \ to generate the next access location. If the amount of offset causes the pointer\
    \ to go outside the bounds of the buffer, it automatically wraps to the other\
    \ side, including the amount of offset, as depicted in Figure 7.2.\n\n![](img/b54974d0a4317ec82d7ae02126d10a6f_204_0.png)\n\
    \nFigure 7.1: After several accesses, the pointer goes outside the buffer into\
    \ an unknown location, usually resulting in a crash.\n\n![](img/b54974d0a4317ec82d7ae02126d10a6f_204_1.png)\n\
    \nFigure 7.2: In a circular buffer, the pointer is automatically wrapped back\
    \ to the top and offset by the proper amount to continue the access-by-five-samples\
    \ loop.\n\nCircular buffers are useful in audio signal processing. You can create\
    \ circular buffers of audio samples or buffers of coefficients and loop through\
    \ and access them automatically. Let's start with the most obvious use and make\
    \ a digital delay effect.\n\n# 7.1 The Basic Digital Delay"
  merge: -1
  img_proc: true
- pgno: 205
  md: 'The digital delay effect or DDL (digital delay line) consists of a long buffer
    for storing audio samples. The samples enter one end of the buffer and come out
    the other end after D samples of delay, which corresponds to D sample periods.
    A feedback path allows for delay regeneration, or repeated echoes, as shown in
    Figure 7.3. With the feedback control fb set to 0, there is only a single delayed
    sample. With any other value, repeated echoes will form at the rate corresponding
    to the length of the delay line. The block diagram is shown in Figure 7.3.


    The difference equation is as follows:


    ```

    y(n) = x(n-D) + fb * y(n-D) (7.1)

    ```


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_205_0.png)


    # Figure 7.3: Basic DDL.


    From the difference equation in Equation 7.1, you can see that the output consists
    of an input sample delayed by D samples plus a scaled version of the output at
    that time, fb * y(n-D). The sequence of accessing the delay line during the processAudioFrame()
    function is as follows:


    +   1. Read the output value, y(n), from the DDL and write it to the output buffer.

    +   2. Form the product fb * y(n).

