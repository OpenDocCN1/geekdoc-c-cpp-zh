  md: '# For feed-back filters:


    +   - The closer the evaluation frequency is to the pole, the more gain it receives.

    +   - If a pole is *on* the unit circle, the magnitude would theoretically go
    to infinity, and it would produce an oscillator, ringing forever at the pole frequency.


    You blew up the first-order feed-back filter as an exercise in Chapter 4. All
    feedback filters are prone to blowing up when their poles go outside the unit
    circle. We can now continue with the estimation process for our standard four
    evaluation frequencies. This time, we''ll convert the raw magnitude values into
    dB. The reason for doing this is that there will be a very wide range of values
    that will be difficult to sketch if we don''t use dB. Follow the evaluation sequence
    in Figures 5.45 through 5.48. Finally, you can put it all together to form the
    frequency response plot in Figure 5.49.


    +   In a digital filter:

    +   - Zeros may be located anywhere in the z-plane, inside, on, or outside the
    unit circle since the filter is always stable; it''s output can''t go lower than
    0.0.

    +   - Poles must be located inside the unit circle.

    +   - If a pole is on the unit circle, it produces an oscillator.

    +   - If a pole is outside the unit circle, the filter blows up as the output
    goes to infinity.


