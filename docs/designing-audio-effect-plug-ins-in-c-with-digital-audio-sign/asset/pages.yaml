- pgno: 37
  md: 'A plug-in is a software component that interfaces with another piece of software
    called the client in order to extend the client''s capabilities in some way. For
    example, Internet browsers use plug-ins that implement added functions like searching
    and text messaging. In computer audio systems, a plug-in is usually an audio effect
    of some kind. However, a plug-in could also implement an oscilloscope or frequency
    analyzer function. Synthesizer plug-ins extend the client''s functionality by
    working as musical instruments.


    In order to start writing plug-ins, you need to know how the plug-in connects
    to and communicates with the client. Windows® plug-ins are typically packaged
    as dynamic link library, or DLL, files. Apple® plug-ins are packaged in a *bundle*
    which is configured as a *component*. The main difference between the two is in
    the lingo their designers use to describe them. Rather then try to accommodate
    both DLL and component labels during this discussion, we will just use DLL to
    describe both in conceptual form. Specific programmatic differences in the formats
    will be addressed and can be found on the website www.willpirkle.com.


    # 2.1 Static and Dynamic Linking


    C++ compilers include sets of precompiled libraries of functions for you to use
    in your projects. Perhaps the most common of these is the math library. If you
    try to use the sin() method you will typically get an error when you compile stating
    that “sin() is not defined.” In order to use this function you need to link to
    the library that contains it. The way you do this is by placing #include <math.h>
    at the top of your file. Depending on your compiler, you might also need to tell
    it to link to math.lib. When you do this, you are statically linking to the math.h
    library, a precompiled set of math functions in a .lib file. Static linking is
    also called implicit linking. When the compiler comes across a math function,
    it replaces the function call with the precompiled code from the library. In this
    way, the extra code is compiled *into* your executable. You cannot un-compile
    the math functions. Why would you do this? Suppose a bug is found in the sin()
    function and the math.h library has to be re-compiled and redistributed. You would
    then have to re-compile your software with the new math.h library to get the bug
    fix.


    The solution is to link to the functions at run time. This means that these precompiled
    functions will exist in a separate file, which your executable will know about
    and communicate with, but only after it starts running. This kind of linking is
    called dynamic linking or explicit linking and is shown in Figure 2.1. The file
    that contains the precompiled functions is the DLL. It is more complicated because
    extra steps must be taken during run-time operation rather than relying on code
    compiled directly into the executable. The advantage is that if a bug is found
    in the library, you only need to redistribute the newly compiled file rather than
    re-compiling your executable. The other advantage is'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'that the way this system is set up—a client that connects to a component at
    run time—works perfectly as a way to extend the functionality of a client without
    the client knowing anything about the component when it is compiled. This is simplified
    when the DLL is loaded into the same virtual address space as the client. If you
    already understand this, you can skip the next section; otherwise, read on.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_38_0.png)


    # 2.2 Virtual Address Space and DLL Access


    When you start a program (client) in a Windows 32-bit operating system (OS), the
    first thing that happens is the OS creates a new virtual machine and virtual address
    space. The maximum amount of memory that can be accessed by a 32-bit microprocessor
    is 2^32 or about 4 gigabytes of memory. The client executable believes it has
    a full 4 gigabytes of memory and that its executable is loaded into part of this
    memory block. This block of memory is also called the process address space. The
    OS is responsible for maintaining this illusion for the client as well as all
    the other executables that are running on the system. This is done through virtualization
    of the microprocessor, memory, and peripherals.


    While that topic could be the subject of another book, the main thing you need
    to know is that typically when the client loads the DLL and begins the communication
    process, the DLL is loaded into the same virtual address space as the client.
    This means that the client code might as well have the DLL code compiled into
    it since the addressing requires no translation. It should be noted that a DLL
    can be loaded into another process space or even on another machine across a network.
    In this case it is called an “out of process DLL”; however, inter-process communication
    is complicated and requires OS and/or network function calls. We will not be considering
    out of process DLLs here. With the DLL in the same process address space as the
    client, there is no extra overhead and the communication uses in-process addressing.
    Both types are shown in Figure 2.2.


    In order to use the code in a DLL the client must perform two activities:'
  merge: -1
  img_proc: true
