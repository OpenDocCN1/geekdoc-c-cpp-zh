    \        float fControlD,\n                                             float\
    \ FACMix,\n                                             float FBDMix)\n{\n   \
    \ // add your code here\n\n    return true;\n}\n```\n\nYou can see that RackAFX\
    \ leaves you a comment on the coding of the joystick location. The six variables\
