    Inspection of the block diagram in Figure 11.10 reveals that this is a rather
    complex feed-back/feed-forward structure. We need to extract the difference equation
    so we can synthesize the reverb unit. To start, we label the nodes $c(n)$ and
    $d(n)$ in the block diagram, then fashion the output $y(n)$ with respect to them:


    ```

    $c(n) = x(n) + gd(n)$

    $d(n) = c(n)z^{-D}$

    $y(n) = -gx(n) + (1-g^2)d(n)$

    (11.13)

    ```


    Now, we expand out the internal nodes and use the familiar time and frequency
    shifting properties of the $z$ transform to continue Equation 11.14.


    ```

    $d(n) = c(n)z^{-D}$

    $= x(n-D) + gd(n-D)$

    $y(n) = -gx(n) + (1-g^2)[x(n-D) + gd(n-D)]$

    (11.14)

    ```


    Examining the last term in Equation 11.14, $d(n-D)$, we can rearrange Equation
    11.13 to continue and get Equation 11.15:


    ```

    $d(n) = \frac{y(n)+gx(n)}{(1-g^2)}$

    so

    $d(n-D) = \frac{y(n-D)+gx(n-D)}{(1-g^2)}$

    (11.15)

    ```


    Substituting Equation 11.15 back into Equation 11.14 you get the difference equation
    in Equation 11.16:


    ```

    $y(n) = -gx(n) + (1-g^2)\left[x(n-D) + g\left(\frac{y(n-D)+gx(n-D)}{(1-g^2)}\right)\right]$

    $= -gx(n) + (1-g^2)x(n-D) + gy(n-D) + g^2x(n-D)$

    $= -gx(n) + x(n-D) + gy(n-D)$

    (11.16)

    ```


