- pgno: 448
  md: 'A problem with the detector circuit is that for any non-zero attack and release
    time settings, the detector output lags behind the input in time. Remember from
    Chapter 12 how the output of the detector tracks the input signal, as shown in
    Figure 13.8. The dark line is the detector output, which is clearly lagging behind
    the input.


    Since the detector output lags, the gain reduction actually misses the event that
    needs to be attenuated. In the digital world, we can accommodate for this detector
    lag by using a look-ahead technique. We can''t look ahead into the future of a
    signal, but we can delay the present. If we insert a delay line in the forward
    signal path (not the side-chain) we can make up for the detector delay so that
    the detector begins charging before the signal actually gets to the DCA, as shown
    in Figure 13.9.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_448_0.png)


    # Figure 13.8: The detector output with the medium attack and medium decay times.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_448_1.png)


    # Figure 13.9: The look-ahead compressor block diagram.


    You can use the CDelay object that comes as a “stock reverb object” and add it
    to your project now for our look-ahead pre-delay. Do this by using the Edit button
    and edit the project. Check the box marked “Stock Reverb Objects” and then hit
    OK. Your compiler will ask you if you want to reload the project, so answer yes.
    You will then have the reverb objects included in your project. We’ll add a single
    new slider to control the look-ahead time. Remember when using the CDelay-based
    objects that you need to make sure you initialize the object to have the same
    maximum delay time as your slider. The amount of look-ahead delay will depend
    on the compressor settings. We’ll make the maximum value match our maximum attack
    time of 300 mSec.


    # 13.3.1 DynamicsProcessor: GUI


    Ada new slider for the look-ahead delay time in mSec using Table 13.3.


    # Table 13.3: The look-ahead slider properties.'
