- pgno: 410
  md: "# Figure 12.11: Detector output (solid dark line) with medium attack and release\
    \ times.\n\nIn analog RC circuits, the cap charges and discharges exponentially,\
    \ as shown in Figure 12.12. The analog attack time is calculated as the time it\
    \ takes to reach 63.2% of the full charge, while the release time is the time\
    \ to release from the fully charged state down to 36.8% of the full charge. Different\
    \ combinations of R and C change these times. A digital envelope detector differs\
    \ in the percent levels; it uses 99% and 1% as the attack and release destination\
    \ values. The curves remain exponential.\n\nIt is well worth noting that there\
    \ are several approaches for designing a software algorithm for the analog envelope\
    \ detector. Orfanidis (1996) suggests using a full-wave rectifier followed by\
    \ an LPF with separate attack and release time constants. Zölzer (2011) suggests\
    \ a mean-squarer followed by an LPF with only a single time constant. In either\
    \ case, a running average is constantly measured and updated on each sample interval.\
    \ The CEnvelopeDetector (Figure 12.13) implements a similar method using a half-wave\
    \ rectifier followed by an LPF whose input is scaled by the attack or release\
    \ time, depending on whether the signal is rising above the current envelope output\
    \ or falling below it. You can find the original code source in the references\
    \ (musicdsp.org).\n\nThe attack and release times are conveniently calculated\
    \ from your controls in milliseconds. The calculations are shown in Equation 12.1:\n\
    \n```\nτ_a = e^(TCattack_in_mSec * SampleRate * 0.001)\nand\nτ_r = e^(TCrelease_in_mSec\
    \ * SampleRate * 0.001)\nwhere\nTC_analog = log(0.368)\nTC_digital = log(0.01)\n\
    (12.1)\n```\n\nThe code for the difference equation is:\n\n```\nif(fInput > m_fEnvelope)\n\
    \    m_fEnvelope = m_fAttackTime * (m_fEnvelope - fInput) + fInput;\nelse\n  \
    \  m_fEnvelope = m_fReleaseTime * (m_fEnvelope - fInput) + fInput;\n```\n\n![](img/b54974d0a4317ec82d7ae02126d10a6f_410_0.png)\n\
    \n# Figure 12.12: Analog attack and release times."
