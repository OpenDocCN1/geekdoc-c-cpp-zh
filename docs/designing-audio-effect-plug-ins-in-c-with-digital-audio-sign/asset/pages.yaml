    # 11.11 Modulated APF and Comb/APF Reverb


    The modulated delay line can be used to further increase time smearing and echo
    density by using it in an APF module. The low-frequency oscillator (LFO) rate
    is kept low (<1 Hz) and the depth also very low (10–20 samples) to ensure that
    the detuning and chorusing effect is not overly obvious. In 1997, Dattorro presented
    a plate reverb algorithm “in the style of Greisinger,” revealing the use of a
    modulated APF. He also notes that the modulated filter technically mimics a room
    whose walls are slowly moving back and forth.


    Frenette (2000) showed that the use of modulated delay lines could reduce the
    computational requirements without a perceptual reduction in quality of reverb.
    Frenette used modulated comb filters (chorus modules) in addition to modulated
    APFs to further reduce the overall complexity and memory requirements. The modulated
    APF is shown in Figure 11.27.


    The modulated APF in Figure 11.27 modulates only the very end of the delay line,
    producing a delay described by Equation 11.29:


    Delay = ξ^(-D + d n(T)) (11.29)'
