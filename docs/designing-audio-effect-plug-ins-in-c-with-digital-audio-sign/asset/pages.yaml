    if

    w = \(\pm \frac{k\pi}{D} k = 1, 3, 5, ..., D\)

    w = \(\pm \frac{\pi}{2}\)

    ```


    There are two zeros, one at +\(\pi\)/2 and the other at -\(\pi\)/2. Plot those
    on the unit circle in the z-plane and you can see what the frequency response
    will be, shown in Figure 7.11. You can see from Figure 7.11 that the zeros produce
    a notch (zero of transmission) at \(\pm\pi\)/2. In fact, when the delay time is
    very small, your ears hear the effect as a frequency response change; your ears
