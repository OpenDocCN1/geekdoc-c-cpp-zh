    # 4.3 First-Order Feed-Back Filter


    A first-order feed-back filter is shown in Figure 4.22.


    The difference equation is as follows:


    y(n) = a₀x(n) – b₁y(n – 1) (4.2)


    You can see the feed-back nature of the filter; the output y(n) is fed back into
    the summer through a one-sample-delay z⁻¹ element. Notice that the feedback coefficient
    has a negative sign in front of it and the difference equation reflects this with
    the –b₁ term. The negative sign is for mathematical convenience and will make
    more sense in the next chapter when we analyze the difference equations in more
    detail. Also notice that there is no b₀ coefficient—there will not be a b₀ coefficient
    in any of the feed-back filters. To analyze this without math requires going through
    the same procedure as before, analyzing the amplitude and phase of the basic test
    signals. Another option would be to code it as a plug-in in RackAFX and map the
    coefficients directly to the sliders as you did in the previous example. Then,
    you can experiment with the coefficients and see how they affect the filter''s
    frequency, phase, DC/step, and impulse responses.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_97_0.png)


    Figure 4.22: First-order feed-back filter block diagram.


