    # 6.6 Generic Bi-Quad Designs


    The following classical analog filters are converted to digital and implemented
    as bi-quad topologies:


    +   - LPF (low-pass filter)

    +   - HPF (high-pass filter)

    +   - BPF (band-pass filter)

    +   - BSF (band-stop filter)

    +   - Second-order Butterworth LPF and HPF

    +   - Second-order Linkwitz-Riley LPF and HPF (good for crossovers)

    +   - First- and second-order all-pass filters (APF)


    Low-pass and high-pass filters are characterized by their corner frequency $f_c$
    and (for second-order and higher) their $Q$ or resonant peaking value. A $Q$ of
    0.707 is the highest value $Q$ can assume before peaking occurs. It is called
    the Butterworth or maximally flat response. With a $Q$ of 0.707 the –3 dB'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'point of the filter will be exactly at \(f_c\). For these designs, once the
    \(Q\) rises above 0.707, it will correspond to the peak frequency and not the
    –3 dB frequency. Equations 6.26 through 6.29 relate the \(Q\), peak frequency,
    –3 dB frequency, and the peak magnitude values.


    \(f_{-3\text{dB}} = f_c \sqrt{\left(\frac{1}{2Q^2} - 1\right) + \sqrt{\left(\frac{1}{2Q^2}
    - 1\right)^2 + 1}}\) (6.26)


    \(f_c = \frac{f_{-3\text{dB}}}{\sqrt{\left(\frac{1}{2Q^2} - 1\right) + \sqrt{\left(\frac{1}{2Q^2}
    - 1\right)^2 + 1}}}\) (6.27)


    \(\text{Peak gain} = \frac{Q^2}{\sqrt{Q^2 - 0.25}} \quad (Q > 0.707 \text{ only})\)
    (6.28)


    \(\text{Peak}_{\text{dB}} = 20 \log(\text{peak gain})\) (6.29)


    Band-pass, band-stop, graphic, and parametric EQs are specified by their center
    frequency \(f_c\) and \(Q\) or bandwidth (Equation 6.30). Depending on the filter,
    the arithmetic (Equation 6.31) or geometric (Equation 6.32) mean is used to relate
    \(f_c\) and the band edges \(f_U\) and \(f_L\).


    \(Q = \frac{f_c}{BW}\) (6.30)


    \(\text{Arithmetic mean} = f_c = \frac{f_U - f_L}{2}\) (6.31)


    \(\text{Geometric mean} = f_c = \sqrt{f_U f_L}\) (6.32)


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_181_0.png)


    **Figure 6.20: Generic bi-quad structure.**


    The block diagram is shown in Figure 6.20.


    The difference equation is as follows:


    \(y(n) = a_0 x(n) + a_1 x(n-1) + a_2 x(n-2) - b_1 y(n-1) - b_2 y(n-2)\) (6.33)'
