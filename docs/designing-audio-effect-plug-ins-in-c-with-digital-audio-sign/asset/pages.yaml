  md: '![](img/b54974d0a4317ec82d7ae02126d10a6f_368_0.png)


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_368_1.png)


    It is a unitary matrix. This reverberator would ring forever because of 1.0 gain
    values. Jot proposed adding an absorptive coefficient k to each delay line. For
    a colorless reverb, the value for k in Equation 11.32 is given by Jot.


    ```

    where


    $$k = -\gamma^M$$


    $$M = \text{the length of the delay}$$

    $$\gamma = \text{the decay factor, set by the user}$$


    (11.32)

    ```


    In Figure 11.33, each delay line undergoes the proper attenuation to keep the
    reverb colorless. However, it does not include the frequency dependent absorptive
    losses we noted from the energy decay relief diagrams. To accomplish this, Jot
    then suggested inserting LPFs instead of the static attenuators. The LPF magnitudes
    are cleverly chosen in relation to the frequency-dependent reverb time, RT$_{60}(\omega)$
    in Equation 11.33:


    ```

    $$20 \log(|h|) = \frac{-60 T_s}{RT_{60}(\omega)} M$$


    (11.33)

    ```'
