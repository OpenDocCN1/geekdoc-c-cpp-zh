  md: '# 7.7 Design a Stereo Crossed-Feedback Delay Plug-In


    A crossed-feedback delay is implemented by crossing the feedback paths of the
    two delay lines. We will add this functionality to the existing StereoDelay project.
    This is where we will use the external feedback option that we built into the
    module. In Figure 7.31 you can trace the feedback paths to see that they are crossed
    into the opposite delay line. You will be surprised at how easy it is to convert
    the delay into a crossed-feedback delay:


    +   - Enable the external feedback function with the boolean flag.

    +   - Use the getCurrentFeedbackOutput() and setCurrentFeedbackInput() functions
    to “cross the beams” of the feedback paths.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_236_0.png)


    Figure 7.31: Block diagram of the crossed-feedback delay.


    # 7.8 Enumerated Slider Variables


    You can see from Figure 7.31 that there is a new slider control for the GUI to
    select between normal and crossed-feedback operation. You can take advantage of
    RackAFX''s enumerated UINT variable to make a slider that selects between multiple
    enumerated values, like a multi-position switch. In our case, we only have two
    positions right now: normal and cross.


    Right-click on a slider to bring up the properties dialog and add a new slider/variable
    combination, as shown in Figure 7.32. Choose “enum” for the data type and create
    a variable called m_uDelayType —the variable will be an unsigned integer type
    (UINT). The low, high, and initial value cells will no longer be editable; RackAFX
    will figure them out depending on what you type in the enumerated variable box.
    You type in the values separated by commas. The first value will be the default
    value.


    In the box at the bottom, type in the strings which will be shown in the slider
    control (keep them'
