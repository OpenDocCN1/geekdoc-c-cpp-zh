- pgno: 313
  md: 'Perhaps the most interesting kinds of audio effects, from both listening and
    engineering standpoints, are the modulated delay effects. They include the chorus
    and flanger/vibrato; additionally, modulated delays are also found in some reverb
    algorithms. These time-varying filters are actually quite sophisticated and fun
    to implement, and we have gone to great lengths to create useful sub-modules.
    These include the digital delay effect or DDL (digital delay line) module and
    the wave table oscillator. If you can design, build, and implement modulated delay
    effects, then you are well on your way to proficiency in audio effects coding.
    These effects have parameters and coefficients which change on every sample period.


    Figure 10.1a shows the standard delay line or DDL. The output is fed back via
    the fb coefficient. The delay is constant until the user changes it to another
    fixed value. In the modulated delay line (MDL) in Figure 10.1b the amount of delay
    is constantly changing over time. The system only uses a portion of the total
    available delay amount.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_313_0.png)


    Figure 10.1: (a) A static delay and (b) modulated delay effect.


    The modulation depth relates to the size of the portion of the delay line that
    is being read. The modulation rate is the speed at which the read index moves
    back and forth over the modulated delay section. A low-frequency oscillator (LFO)
    is used to modulate the delay amount and the LFO can be just about any kind of
    waveform, even noise. The most common waveforms are triangle and sinusoid. In
    order to make a modulated delay effect, you first need to make a delay line, and
    then modify it to constantly change and update the read location on each sample
    interval.'
  merge: -1
  img_proc: true
- pgno: 314
  md: '# 10.1 The Flanger/Vibrato Effect


    The flanger effect gets its name from the original analog method of running two
    tape machines slightly out of sync with each other by placing a thumb on the flange
    (the ring that holds the tape) of one machine''s reel and applying pressure to
    slow down the tape ever so slightly. Other variations include rubbing the flange
    circularly. The effect creates a time-varying delay that falls out of sync, then
    back in sync with the first tape machine. The effect has been compared to the
    whoosh of a jet engine, or the sound of a phaser effect. No matter how you define
    it, the flanger has a unique sound. The effect is heard on numerous recordings.


    In order to simulate the flanger effect, you need a delay line whose read index
    moves away from, then back to the top or starting point of the delay. When the
    read pointer is back to the top, there is no delay and as it moves away from the
    write index, the pitch is modulated down. When the index turns around and moves
    back, the pitch is modulated up—this is the Doppler effect in practice. When the
    output of the modulated delay is sent 100% wet, with no dry signal, the effect
    is that of vibrato—the pitch shifts up and down as the pointer moves back and
    forth. When the dry signal is mixed with the wet signal, the pitch shifting changes
    into the flanging effect. The amount of delay time varies between 0 and about
    7–10 mSec; at a 44,100 Hz sample rate, this corresponds to around 308 to 410 samples.
    Feedback is usually added to increase the effect by creating resonances or anti-resonances,
    depending on whether the feedback is normal or inverted.


    Figure 10.2 shows the two states of the modulator with increasing and decreasing
    pitch shifting due to the Doppler effect. Figure 10.3 shows alternate ways of
    diagramming the same modulator. The vibrato and flanger are the same effect underneath
    the hood—it’s only the mix ratio that determines which effect you have. Because
    the delay is constantly moving around we are once again faced with options on
    how to handle the fractional delay that is required; after you calculate the number
    of samples of delay (which will most likely have a fractional component) you can


    +   - Truncate the value and just use the integer part.

    +   - Round the value up or down.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_314_0.png)


    Figure 10.2: (a) As the delay increases, the pitch drops. At the end of the delay,
    the index turns around and begins heading back toward the write index (b), increasing
    the pitch; the maximum delay here is about 10 mSec at 44,100 Hz.'
  merge: -1
  img_proc: true
- pgno: 315
  md: '![](img/b54974d0a4317ec82d7ae02126d10a6f_315_0.png)


    Figure 10.3: (a) The simplest form of the flanger/vibrato effect. The dotted lines
    show the limits of the delay modulation, from 0.0 (no delay) to the full range,
    \( z^{-D} \) samples. (b) An alternate version shows the LFO connection to the
    modulation index to the delay line.


    +   - Interpolate the delayed value using linear or polynomial interpolation.

    +   - Use an all-pass filter to make the fractional delay (see the Bibliography).


    The flanger/vibrato controls consist of:


    +   - Modulation depth: how much of the available range is used.

    +   - Modulation rate: the rate of the LFO driving the modulation.

    +   - LFO type: usually sinusoidal or triangular, but may be anything.

    +   - Feedback: as with the normal delay, the feedback has a big effect on the
    final product.

    +   - Wet/dry control: 100% wet = vibrato; 50/50 = flanger.


    As shown in Figure 10.4, the flanger/vibrato technically always starts with 0.0
    samples of delay. Because of this, we''d like to have a LFO that can generate
    a unipolar output from 0.0 to +1.0, which we can then map to a range of delays,
    from 0 to about 410 samples or so. Figure 10.5 shows a stereo version of the flanger.
    A common LFO modulates both delay lines, but the phases are off by 90 degrees,
    putting them in quadrature or quad-phase. The effect is interesting as the two
    LFOs seem to chase each other, one on the left and the other on the right.


    The flanger technically modulates the delay right down to 0 samples. For analog
    tape flanging, this occurs when the two tape machines come back into perfect synchronization.
    This is called through-zero flanging or TZF. This means that for an instant, the
    output is double the input value. For low frequencies and/or high feedback values,
    this can cause a problem when the flanger delay time is between 0 and about 0.1
    mSec and the waveform is at a peak location. In this case, large valued'
  merge: -1
  img_proc: true
- pgno: 316
  md: 'samples near each other on the waveform sum together, producing an increased
    and sometimes distorted bass response.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_316_0.png)


    Figure 10.4: Two modulation depth settings; zero is always the minimum delay.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_316_1.png)


    Figure 10.5: A stereo quadrature flanger; the dotted lines at the LFO show its
    90-degree offset modulation. The max depth spans the entire delay line.


    Table 10.1: Delay times for the flanger and chorus effects.


    | | Min Delay(mSec) | Max Delay(mSec) | Feedback(%) |

    |---|---|---|---|

    | Flanger | 0 | 7–10 | –90 to +90 |

    | Chorus | 7 | 20–40 | Typically 0 |


    # 10.2 The Chorus Effect


    The chorus effect appeared in the late 1970s and was used on countless recordings
    during the 1980s,'
  merge: -1
  img_proc: true
- pgno: 317
  md: 'becoming a signature sound effect of that decade. The chorusing effect can
    produce a range of effects from a subtle moving sheen to a swirling sea-sick de-tuned
    madness. Like the flanger, it is also based on a modulated delay line, driven
    by an LFO. Although different manufacturers adopted different designs, the basic
    algorithm for a single chorusing unit is the same. The differences between a flanger
    and chorus are shown in Table 10.1.


    +   - Analog chorus units typically do not use any feedback (because our DDL module
    already has feedback, we can keep it for experimentation purposes).

    +   - The range of delay times over which the device operates is the most significant
    difference.


    The read index is modulated about the center of the pointer but the center is
    set to avoid the keep-out zone (Figures 10.6 and 10.7). Also, the modulation depth
    and the location of the center of the delay area vary across manufacturers (Figure
    10.8).


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_317_0.png)


    Figure 10.6: The basic chorus module. Note the feedback path is optional and not
    found in typical analog chorus units. The gray area is the flanger keep-out zone.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_317_1.png)


    Figure 10.7: An alternative block diagram that describes the same chorus module.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_317_2.png)


    Figure 10.8: (a) and (b) are two different chorus modules with the same maximum
    depth (dotted lines) but a different center of operation.


    Many variations on the basic chorus module exist, including:'
  merge: -1
  img_proc: true
- pgno: 318
  md: '+   - Multiple chorus modules with different centers of operation

    +   - Different LFO frequency or LFO phases applied to different modules

    +   - Series modules

    +   - Parallel modules

    +   - Bass modules with a low-pass filter/high-pass filter on the front end


    Figure 10.9 shows the stereo quad chorus with the left and right LFOs out of sync
    by 90 degrees. In this permutation, the maximum depths of the left and right channels
    are independent, as well as the ability to adjust them. The flowchart for the
    basic modulated delay effect for each processAudioFrame() is shown in Figure 10.10.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_318_0.png)


    Figure 10.9: A stereo quadrature chorus; feedback paths are optional.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_318_1.png)


    Figure 10.10: The flowchart for modulated delay effects.


    You will use the DDL module to do most of the low-level work and generate the
    delayed values. The LFO will generate values that will be used to calculate the
    current delay offset. Since the LFO is varying, the delay offset will need to
    be recalculated on each sample interval.


    # 10.3 Design a Flanger/Vibrato/Chorus Plug-In


    Now we get down to the business of coding these effects. Because of the large
    number of variations,'
  merge: -1
  img_proc: true
- pgno: 319
  md: 'we should start by coding a module that can be used in larger parent plug-in
    objects. Figure 10.11 shows the block diagram.


    We will provide several user interface (UI) components to control the plug-in
    and their variables are available for a parent plug-in to use as well. We will
    use the existing DDL module and wave table oscillator plug-ins. Since the DDL
    module has feedback path control, there will be many ways to combine these modules
    into sophisticated units. The controls we will provide for the user are discussed
    next. The plan of operation is as follows:


    +   - LFO: needs to be set up to run unipolar and with the non-band-limited tables.

    +   - The chorus delay offset control will effectively move the center of operation
    for the modulated delay.

    +   - The vibrato mode will force the feedback value to 0.0% since it does not
    sound good with feedback.


    +   - prepareForPlay()

    +     - Reset the LFO and start it by setting the m_bNoteOn flag; also set up
    the LFO and DDL modules.

    +     - Set the DDL m_nSampleRate variable; it needs this value to initialize
    its buffer properly.

    +     - Forward the prepareForPlay() call to the child objects, LFO and DDL.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_319_0.png)


    Figure 10.11: Generic modulated delay block diagram; it can be any type of flanger/vibrato/chorus.


    +   - processAudioFrame()

    +     - Call the doOscillate() function on the LFO.

    +     - Use the LFO value to calculate a delay offset in milliseconds for the
    DDL module.

    +     - Write the new delay time to the DDL module and call its cooking function.

    +     - Call processAudioFrame() on the DDL module to get the current output sample.


    +   - userInterfaceChange()

    +     - Call the update functions for the LFO and DDL.

    +     - Call the type switching function to change from flanger to vibrato and
    chorus.


