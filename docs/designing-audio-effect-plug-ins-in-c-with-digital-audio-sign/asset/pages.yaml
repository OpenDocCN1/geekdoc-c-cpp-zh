    \n    m_LFO.m_uPolarity = 1; // 0 = bipolar, 1 = unipolar\n    m_LFO.m_uTableMode\
    \ = 0; // normal, no band limiting\n    m_LFO.reset(); // reset it\n\n    // Initialize\n\
    \    cookModType();\n    updateLFO();\n    updateDDL();\n\n    // start the LFO!\n\
    \    m_LFO.m_bNoteOn = true;\n\n    return true;\n}\n```\n\n# userInterfaceChange()\n\
    \n+   - Call the update functions and cook the mod type. We won't bother with\
    \ the switch/case statement since changes to any slider will require updates of\
    \ the LFO and DDL.\n+   - Make sure your nControlIndex values match your GUI components.\n\
    \n```\nbool __stdcall CModDelayModule::userInterfaceChange(int nControlIndex)\n\
    {\n    // change the min/max limits; set wet/dry and Feedback\n    if(nControlIndex\
    \ == 41) // 41 is mod type switch\n        cookModType();\n\n    // else just\
