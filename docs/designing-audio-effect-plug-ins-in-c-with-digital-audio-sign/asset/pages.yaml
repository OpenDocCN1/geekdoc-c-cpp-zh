  md: "The calcCompressorGain() and calcDownwardExpanderGain() functions are identical\
    \ to the last project you did, so you can cut and paste them. The calculateFilterBankCoeffs()\
    \ function is pretty straightforward and follows the design equations for the\
    \ Linkwitz–Riley filters. Since all the filters share the same cutoff, they are\
    \ pretty easy to deal with.\n\n```\n// all filters have same cutoff frequency;\
    \ only need LPF and HPF calcs\nvoid CSpectralDynamics::calculateFilterBankCoeffs(float\
    \ fCutoffFreq)\n{\n    // Shared Factors:\n    float omega_c = pi*fCutoffFreq;\n\
    \    float theta_c = pi*fCutoffFreq/(float)m_nSampleRate;\n\n    float k = omega_c/tan(theta_c);\n\
    \    float k_squared = k*k;\n\n    float omega_c_squared = omega_c*omega_c;\n\n\
    \    float fDenominator = k_squared + omega_c_squared + 2.0f*k*omega_c;\n\n  \
    \  float fb1_Num = -2.0f*k_squared + 2.0f*omega_c_squared;\n    float fb2_Num\
    \ = -2.0f*k*omega_c + k_squared + omega_c_squared;\n\n    // the LPF coeffs\n\
    \    float a0 = omega_c_squared/fDenominator;\n    float a1 = 2.0f*omega_c_squared/fDenominator;\n\
    \    float a2 = a0;\n    float b1 = fb1_Num/fDenominator;\n    float b2 = fb2_Num/fDenominator;\n\
    \n    // set the LPFs\n    m_LeftLPF.m_f_a0 = a0;\n    m_LeftLPF.m_f_a1 = a1;\n\
    \    m_LeftLPF.m_f_a2 = a2;\n    m_LeftLPF.m_f_b1 = b1;\n    m_LeftLPF.m_f_b2\
    \ = b2;\n\n    // right\n    m_RightLPF.m_f_a0 = a0;\n    m_RightLPF.m_f_a1 =\
