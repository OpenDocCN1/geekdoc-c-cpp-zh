    fControlA = 0.25\nfControlB = 0.25\nfControlC = 0.25\nfControlD = 0.25\n\nAC Mix\
    \ - projection on X Axis (0 -> 1)\nBD Mix - projection on Y Axis (0 -> 1)\n*/\n\
    \nbool __stdcall CVolume::joystickControlChange(float fControlA,\n           \
