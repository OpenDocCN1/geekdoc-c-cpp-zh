  md: '\(\pm 5\pi\), and so on. So the actual solution to find the roots becomes Equation
    7.7:


    ```

    cos(Dw) + j sin(Dw) = -1 + j0

    if

    Dw = \(\pm \pi, \pm 3\pi, \pm 5\pi, ... \pm N\pi\)

    until

    N > D-1

    or

    zeros at w = \(\pm \frac{k\pi}{D} k = 1, 3, 5, ..., D\)

    ```


    After N > D - 1, the whole mathematical sequence repeats again, cycling through
    odd multiples of p. This means that there are D zeros spread equally around the
    unit circle. This makes sense—the fundamental theorem of algebra predicts D roots
    for a polynomial of order D. Now consider the simple case of D = 2 samples; we
    get Equation 7.8:


