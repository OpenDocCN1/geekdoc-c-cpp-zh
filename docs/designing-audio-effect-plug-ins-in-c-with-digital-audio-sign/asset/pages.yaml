- pgno: 175
  md: 'The tan() function is linear at low values of \(\omega\) but becomes more nonlinear
    as the frequency increases. At low frequencies, the analog and digital frequencies
    map closely. At high frequencies, the digital frequencies become warped and do
    not map properly to the analog counterparts. This means that a given analog design
    with a cutoff frequency \(f_c\) might have the wrong digital cutoff frequency
    after the conversion.


    The solution is to pre-warp the analog filter so that its cutoff frequency is
    in the wrong location in the analog domain, but will wind up in the correct location
    in the digital domain. To pre-warp the analog filter, you just use the same equation
    (Equation 6.14) applied to the cutoff frequency of the analog filter. When you
    combine all the operations you get the bilinear Z transform, or BZT. The step-by-step
    method of conversion is as follows (Ifeachor 1993):


    +   1. Start with an analog filter with a normalized transfer function \(H(s)\)—"normalized"
    means the cutoff frequency is set to \(\omega = 1\) rad/sec; this is the typical
    way analog transfer functions are described and specified.


    +   2. Choose the cutoff frequency of the digital filter \(\omega_d\); get the
    pre-warped analog corner frequency using Equation 6.15:


    ```

    \(\omega_a = \tan \left[ \frac{\omega_d / f_s}{2} \right]\) (6.15)

    ```


    +   3. Scale the normalized filter''s cutoff frequency out to the new analog cutoff
    \(\omega_a\) by replacing \(s\) with \(s/\omega_a\) in the analog transfer function.


    +   4. Apply the bilinear transform by replacing \(s\) with Equation 6.13: \(z-1\)


    ```

    \(s = \frac{z - 1}{z + 1}\) (6.13)

    ```


    +   5. Manipulate the transfer function \(H(z)\) algebraically to get it into
    the familiar form so you can identify the coefficients (format the numerator and
    denominator to match the transfer functions you studied in the last chapter);
    this is often the most difficult part.


    NOTE: This only works for LPF designs but, fortunately, there are easy conversions.
    The difference is in the step where you scale the analog filter''s cutoff frequency
    just before applying the bilinear transform. How it works is described next.


    For LPF and HPF:


    +   • Specify \(\omega_d\), the desired digital cutoff frequency.


    +   • Calculate the pre-warped analog cutoff with Equation 6.14:


    ```

    \(\omega_a = \tan \left[ \frac{\omega_d / f_s}{2} \right]\) (6.14)


    where

    \(\omega_a\) = the analog frequency

    \(\omega_d\) = the mapped digital frequency

    \(f_s\) = the sample rate

    ```'
