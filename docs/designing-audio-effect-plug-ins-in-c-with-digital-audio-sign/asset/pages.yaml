- pgno: 167
  md: 'These simple first-order filters work by moving the pole back and forth across
    the real axis while holding a fixed zero at Nyquist. When the pole is on the right
    side of the unit circle, low frequencies are gained up due to their close proximity
    to the pole. High frequencies are close to the zero and get attenuated (Figure
    6.2). This produces the low-pass response in Figure 6.3.


    When the pole/zero pair are reversed, the opposite effect happens and the high
    frequencies are now boosted with low frequencies attenuated. There is also a zero
    at 0 Hz. This produces the high-pass response. These are simple but very useful
    designs and are found in many effects including delay and reverb algorithms.


    # 6.3 Resonators


    A resonator is a band-pass filter that can be made to have a very narrow peak.
    The simple version uses a second-order feed-back topology.


    # 6.3.1 Simple Resonator


    A block diagram of a simple resonator is shown in Figure 6.4.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_167_0.png)


    Figure 6.3: Linear and log frequency responses of the one-pole low-pass filter
    with $f_c = 1$ kHz.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '![](img/b54974d0a4317ec82d7ae02126d10a6f_168_0.png)


    # Figure 6.4: Second-order feed-back filter block diagram.


    The difference equation is as follows:


    y(n) = a_0x(n) - b_1y(n-1) - b_2y(n-2) \quad (6.5)


    Specify:


    +   - f_c, center frequency

    +   - BW, 3 dB bandwidth; or Q, quality factor


    The design equations are as follows:


    \theta_c = 2\pi f_c / f_s

    W = f / Q

    b_2 = e^{(-2\pi \frac{BW}{f_s})}

    b_1 = \frac{-4b_2}{1+b_2} \cos(\theta_c)

    a_0 = (1-b_2)\sqrt{1 - \frac{b_1^2}{4b_2}} \quad (6.6)


    The resonator works by simple manipulation of the conjugate pairs formed with
    the second-order feed-back network. The b_2 term controls the distance out to
    the pole which makes the resonant peak sharper (when the pole is close to the
    unit circle) or wider (when the pole is farther away from the unit circle). The
    b_1 and b_2 terms control the angle of the pole, which controls the center frequency,
    shown in Figure 6.5. The a_0 term is used to scale the filter so its peak output
    is always normalized to unity gain or 0 dB.


    The drawback to this design is that it is only symmetrical in frequency response
    at one frequency, \pi/2, when the low-frequency and high-frequency magnitude vectors
    are symmetrical. At all other frequencies, the response is shifted asymmetrically.
    When the pole is in the first quadrant, it is nearer to the low frequencies than
    high frequencies and so the low end is boosted (Figure 6.6). The opposite happens
    (Figure 6.7) when the pole moves to the second quadrant and the high frequencies
    get the boost. The solution to the asymmetry problem is a really useful filter,
    especially for making filter banks of extremely narrow band-pass filters.'
