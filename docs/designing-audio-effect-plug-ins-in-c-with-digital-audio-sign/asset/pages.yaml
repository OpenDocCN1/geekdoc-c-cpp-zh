    # 4.5 Observations


    In doing these exercises, you have made a lot of progress—you know how to implement
    both feed-forward and feed-back filters in a plug-in. You also have a good intuitive
    knowledge about how the coefficients control the filter type. Plus you got to
    blow up a filter, so that is pretty cool. Here are some observations.


    # 4.5.1 General


    +   - Feed-forward and feed-back topologies can both make high-pass or low-pass-shaped
    filter responses.

    +   - The coefficients of the filter ultimately determine the kind of filter and
    what it sounds like.

    +   - The phase shift introduced by the delay element(s) is responsible for the
    filtering operation.


    # 4.5.2 Feed-Forward Filters


    +   - Operate by making some frequencies go to zero; in the case of a0 = 1.0 and
    a1 = 1.0, the Nyquist frequency went to zero; this is called a *zero of transmission*
    or a *zero frequency* or just a *zero*.

    +   - The step and impulse responses show smearing. The amount of smearing is
    exactly equal to the total amount of delay in the feed-forward branches.

    +   - Don''t blow up.

    +   - Are called *finite impulse response* (FIR) filters because their impulse
    responses, though they may be smeared, are always finite in length.


    # 4.5.3 Feed-Back Filters


    +   - Operate by making some frequencies go to infinity; in the case of a0 = 1.0
    and b1 = 1.0, the Nyquist frequency went to infinity and with a0 = 1.0 and b1
    = -1.0, DC or 0 Hz went to infinity; this is called a *pole of transmission* or
    a *pole frequency* or just a *pole*.

    +   - The step and impulse responses show overshoot and ringing or smearing depending
    on the coefficients. The amount of ringing or smearing is proportional to the
    amount of feedback.

    +   - Can blow up (or go unstable) under some conditions.

    +   - Are called *infinite impulse response* (IIR) filters because their impulse
    responses can become infinite.


    The problem now is that we want to be able to specify the filter in a way that
    makes sense in audio—a low-pass filter with a cut-off of 100 Hz or a band-pass
    filter with a Q of 10 and center frequency of 1.2 kHz. What we need is a better
    way to analyze the filtering than just randomly trying coefficients, and we need
    methods to come up with filter coefficients based on how we specify the filter.
    In the next chapter, we''ll work on the basic DSP theory that will make this happen.'
