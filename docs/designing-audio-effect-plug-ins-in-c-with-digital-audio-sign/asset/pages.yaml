  md: "# 8.11.2 Lagrange Interpolator\n\nChoose:\n\nN = number of points to interpolate,\
    \ minimum = 2\n\nCalculate:\n\na_j = \\prod_{k=0, k \\neq j}^n \\frac{x - x_k}{x_j\
    \ - x_k} (8.9)\n\nThe Lagrange interpolator uses a polynomial of order j - 1 to\
    \ interpolate across the window of points that you give it. The window is of length\
    \ j in the above equation. This is a complex filter because the coefficients change\
    \ every sample period and they are based on the window of input values, x0 to\
    \ xj. This filter can be implemented as a pure math function call. To facilitate\
    \ your coding, a Lagrange interpolation function is implemented in your pluginconstants.h\
    \ file:\n\n```\n/*\nFunction: lagrpol() implements n-order Lagrange Interpolation\n\
    Inputs: double* x Pointer to an array containing the x-coordinates of the input\
    \ values\n        double* y Pointer to an array containing the y-coordinates of\
    \ the input values\n        int n The order of the interpolator, this is also\
    \ the length of the x,y input arrays\n        double xbar The x-coordinates whose\
    \ y-value we want to interpolate\nReturns The interpolated value y at xbar. xbar\
    \ ideally is between the middle two values in the input array, but can be anywhere\
    \ within the limits, which is needed for interpolating the first few or last few\
    \ samples in a table with a fixed size.\n*/\n```\n\n# 8.11.3 Median Filter\n\n\
    Choose:\n\nN = number of points in window = odd\n\nCalculate:\n\nAcquire samples\
    \ in windows of N values, then sort and choose the median value as the output.\n\
    \nThe median filter (Figure 8.30) is a very interesting and somewhat strange algorithm.\
    \ It has no IR or frequency response. It smoothes an input signal, which is an\
    \ LPF type of operation, but it preserves transient edges, which is very un-LPF\
    \ in nature. It has applications in noise reduction without losing high-frequency\
    \ transients. Its central algorithm uses a sorting mechanism to sort the window\
    \ of data by amplitude. The median value is chosen from the sorting operation\
    \ as the output. When the next sample arrives, the window is re-sorted and the\
    \ next median value is obtained. To understand how it"
