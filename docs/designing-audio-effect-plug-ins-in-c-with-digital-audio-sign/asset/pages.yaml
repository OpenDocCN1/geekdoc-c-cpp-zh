    # 6.7.3 Second-Order Parametric/Peaking Filter: Non-Constant-Q


    Specify:


    +   - \(f_c\), center frequency

    +   - \(Q\) quality factor

    +   - Gain/attenuation in dB


    Parametric EQs allow you to adjust the center frequency, \(Q\) and boost or cut
    creating any arbitrary bumps or notches in the frequency response (Figure 6.30).
    The parametric EQ is a variation on the ordinary band-pass and band-stop filters
    that generates symmetrical boost/cut curves and mixes in the dry signal to create
    the final response. A true digital parametric EQ not only has independent controls,'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'but each control only varies one coefficient in the filter. The parametric
    EQs in this section afford the same frequency response but adjustments in any
    parameter require a recalculation of all the coefficients. These filters are also
    called peaking filters.


    This parametric EQ is not constant-Q, which means the bandwidth varies depending
    on the boost/cut value. Some analog filters have the same issue, although there
    is occasional debate over whether or not this is desirable in an EQ design. Figure
    6.29 shows this EQ with three different boost curves with a center frequency of
    1 kHz and Q = 1.0; therefore, the bandwidth should also be 1000 Hz.


    Note: These filter coefficients contain the tan() function, which is undefined
    at π/2 and then flips negative between π/2 and π. The argument is θc/2Q, so care
    must be taken with these filters to ensure that θc/2Q does not fall on the range
    of π/2 to π. One solution is to clamp the value of θc/2Q so that it never equals
    or exceeds π/2.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_190_0.png)


    Figure 6.29: The non-constant-Q peaking filter has different bandwidths for different
    gain values; the bandwidth widens as the gain is reduced. fc = 1 kHz, Q = 0.707.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_190_1.png)


    Figure 6.30: A set of responses for the non-constant-Q parametric/peaking filter
    with a variety of boost/cut settings. fc = 1 kHz, Q = 2.


