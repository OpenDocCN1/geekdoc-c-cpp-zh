    The four rules:


    \(e^a e^b = e^{(a+b)}\) or \(e^{ja} e^{jb} = e^{j(a+b)t}\)

    \(\frac{e^a}{e^b} = e^{(a-b)}\) or \(\frac{e^{ja}}{e^{jb}} = e^{j(a-b)t}\)

