    # 11.14 Other FDN Reverbs


    Smith (1985) developed a variation on the FDN theme with his waveguide reverberators.
    Each waveguide consists of a two delay lines that move in opposite directions
    with coupling coefficients for connecting waveguides together. Any number of waveguides
    may be connected in any geometric pattern or shape, leading to a generalized set
    of scattering matrices. The scattering matrices are similar to the feedback matrices—they
    contain the coefficients that control the waveguide junction gains. The scattering
    matrices may also be made to be lossless by adhering to mathematical conditions
    involving the matrices’ eigenvalues and eigenvectors (Smith and Rocchesso 1994).


    Dahl and Jot (2000) proposed another UFDN type of reverb algorithm based on a
    structure they call the absorbent all-pass filter (AAPF). Figure 11.36 shows the
    block diagram of the AAPF which consists of a standard delaying APF with an LPF
    inserted in signal path. They combined an early reflections block that consisted
    of a multi-tapped delay line with a late reverberation block. In their late reverberation
    model, they use series AAPFs in a UFDN loop as shown in Figure 11.37. The block
    marked M is the unitary feedback matrix that mixes and creates the inputs for
    the filter loops.


    Chemistruck, Marcolini, and Pirkle (2012) also experimented with FDNs for reverb
    algorithms. They used the genetic algorithm (GA) to generate coefficients for
    feedback delay and filtering blocks in their proposed system. A random unitary
    matrix generator was coded to seed the GA so that the starting point is a UFDN.
    Their overall algorithm block diagram consists of a four-delay line FDN followed
    by a diffusion block, as shown in Figure 11.38. The GA was only used to find the
    delay network coefficients while the diffusion block remained constant throughout.'
