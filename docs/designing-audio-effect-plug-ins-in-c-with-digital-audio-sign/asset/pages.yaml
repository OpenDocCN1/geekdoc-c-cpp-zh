  md: '![](img/b54974d0a4317ec82d7ae02126d10a6f_454_0.png)


    # Figure 13.11: A two-band spectral compressor.


    ```

    LPF                                      HPF

    θc = πfc/fs                              θc = πfc/fs

    Ωc = πfc                                 Ωc = πfc

    κ = Ωc / tan(θc)                         κ = Ωc / tan(θc)

    δ = κ² + Ωc² + 2κΩc                      δ = κ² + Ωc² + 2κΩc

    a0 = Ωc² / δ                             a0 = κ² / δ

    a1 = 2Ωc² / δ                            a1 = -2κ² / δ

    a2 = Ωc² / δ                             a2 = κ² / δ

    b1 = (-2κ² + 2Ωc²) / δ                   b1 = (-2κ² + 2Ωc²) / δ

    b2 = (-2κΩc + κ² + Ωc²) / δ              b2 = (-2κΩc + κ² + Ωc²) / δ

    ```


    Because these are second-order filters, we can use RackAFX''s built-in bi-quad
    to do the filtering; all we need to do is supply the calculation of the coefficients.
    Thus, we''re going to need to design a stereo dynamics processor with independent
    attack, release, threshold, ratio, and gain make-up controls. We will need a shared
    fc control for the two filters. Although this plug-in shares most of the features
    of the previous project, for simplicity there are a few modifications:


    +   - This design will not include the look-ahead function.

    +   - The knee width will be a common shared control that both bands will use.


