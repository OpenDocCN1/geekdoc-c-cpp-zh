  md: 'option; when the client requests a VST object, it receives one with your plug-in
    embedded inside as a member object. The wrapper object then forwards calls to
    your plug-in and returns information or audio data to the client, as shown in
    Figure A.2. Your plug-in exposes an interface of public methods (gray boxes).
    The wrapper exposes its API specific methods (white boxes) which the client calls.
    The translation usually involves a simple forwarding method call. Sometimes more
    than one wrapper method connects to a single plug-in method. Other times, the
    wrapper method only needs to return a success code or special string so there
    is nothing to call on the plug-in object.


    If you want to write a wrapper object, it is fairly straightforward, as you will
