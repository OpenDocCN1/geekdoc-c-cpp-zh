    # 11.9 Stereo Reverberation


    Conducting listening tests, Schroeder (1984) found that listeners overwhelmingly
    preferred a stereo reverb to a mono version of the same algorithm. Both Schroeder
    and Moorer''s reverbs can be adapted for stereo usage. In fact, this scheme can
    be used with just about any reverb consisting of comb APFs. The first thing to
    note is that mathematically, there is no reason why you can''t place the APFs
    before the comb filters since their transfer functions multiply in the z domain.
    Then, the individual outputs of the comb filters can be combined through a mixing
    matrix to provide the left and right outputs. The mixing matrix is an array of
    weighting values for each comb filter''s output. Jot proposed that the matrix
    be orthogonal for the most uncorrelated output. The mixing matrix is shown in
    Equation 11.28. The rows are the outputs of the comb filters and the columns are
    left and right. Figure 11.19 shows a mixing matrix for the left channel of a Schroeder
    reverb unit.'
