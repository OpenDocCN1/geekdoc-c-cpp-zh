  md: '![](img/b54974d0a4317ec82d7ae02126d10a6f_89_0.png)


    # Figure 4.12: The second iteration at Nyquist produces an output y(n) = 0.


    # Table 4.1: The manual labor continues as we work through the ½ Nyquist frequency.


    | x(n) | x(n - 1) | y(n) = 0.5x(n) + 0.5x(n - 1) |

    |---|---|---|

    | 0 | 0 | 0 |

    | 1 | 0 | 0.5 |

    | 0 | 1 | 0.5 |

    | -1 | 0 | -0.5 |

    | 0 | -1 | -0.5 |

    | 1 | 0 | 0.5 |

    | 0 | 1 | 0.5 |

    | -1 | 0 | -0.5 |

    | 0 | -1 | -0.5 |


    Can you see how x(n) becomes x(n - 1) for the next row? The x(n - 1) column holds
    a one-sample-delayed version of the input x(n). The output is y(n) = {0, +0.5,
    +0.5, -0.5, -0.5, +0.5, +0.5}.'
  merge: -1
