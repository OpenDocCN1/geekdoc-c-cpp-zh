    # 6.9 The Massberg Analog-Matched Low-Pass Filter


    At the 131st Audio Engineering Society Convention in 2011, Michael Massberg presented
    a solution to the clamming problem producing first- and second-order low-pass
    filters that very closely match their analog counterparts near and at the Nyquist
    frequency. It takes advantage of the fact that a shelving filter with a very high
    upper shelf frequency has a roll-off portion that very closely resembles the roll-off
    of a low-pass filter. In a nutshell, the idea is to design a shelving filter whose
    upper shelf frequency is above Nyquist. In the range from DC to Nyquist, it will
    resemble a low-pass filter (Figure 6.38). A unique matching scheme is applied
    to force the two responses to match their gains exactly at a point halfway between
    the gain at DC and the gain at Nyquist in decibels, with a slight error at points
    above that frequency. The result is a filter that has an excellent approximation
    to the analog response it is trying to mimic.


    Massberg used first- and second-order shelving filters to produce analog-matched
    low-pass filters applying the bilinear transform to produce the final result.
    Figure 6.39 shows a comparison of the standard digital LPF and the Massberg LPF.


    # 6.9.1 First-Order Massberg LPF


    Specify:


    +   • $f_c$, corner frequency


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_199_0.png)


    Figure 6.38: The Massberg filter uses a shelving filter as a prototype. In the
    range from DC to Nyquist, it very closely resembles the desired low-pass filter.
    The two curves are displaced slightly.'
