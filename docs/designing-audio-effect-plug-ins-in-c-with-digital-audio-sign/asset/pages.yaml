  md: 'carrier, as shown in Figure 14.2. This is technically amplitude modulation
    or frequency mixing. The resulting signal contains sum and difference pairs of
    each frequency present in the signal. For example, if the carrier is 250 Hz and
    the input signal is 1 kHz, the output will consist of two frequencies, 1 kHz –
    250 Hz = 750 Hz and 1 kHz + 250 Hz = 1.25 kHz. The original input signal at 1
    kHz is gone. For complex audio signals, this process happens for every frequency
    component that the signal contains. The resulting output can sound nothing like
    the input. Drums change their pitches and full spectrum signals become obliterated.
    Because of the sum and difference pair, aliasing will occur when the sum signal
    goes outside Nyquist. One way to handle the aliasing is to band-split the signal
    just like the spectral compressor and only process the lower frequencies. Though
    not a perfect solution, it will at least alleviate some of the aliasing. The ring
    modulator project here only implements the frequency modulation without addressing
    aliasing problems.


