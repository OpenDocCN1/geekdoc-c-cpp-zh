    # 8.8 The Optimal (Parks–McClellan) Method


    FIR filters produce all zeros in the z-plane. You can see the effect of these
    zeros in the frequency sampling method filters we designed—they create the notches
    and humps in the frequency response. In general, we seek to minimize the humps
    in the pass band and set some kind of limit for the largest lobe we see in the
    stop band. In the frequency sampling filters, we changed the design specifications
    or the order of the filter to get a response that satisfied our initial desired
    response to some extent. The optimal method is an algorithm for designing classical
    filters (LPF, HPF, BPF, BSF). You can create filters with extremely steep roll-off
    edges that would be difficult to synthesize in the analog domain. The word “optimal”
    comes from the engineering phrase “optimal in the Chebychev way,” which describes
    a filter design with a certain kind of rippling in the pass band and stop band.


    The LPF in Figure 8.23 might be specified like this:


    +   - Pass-band ripple: less than 0.1 dB

    +   - Stop-band attenuation: greater than –24 dB


    The pass-band ripple (0.1 dB) and stop-band attenuation (–24 dB) are converted
    into weighting values using Equation 8.6:


    ```

    Pass-band-weight = (10^(p_ripple/20)) - 1

    Stop-band-weight = (10^(s_atten/20))

    (8.6)

    ```


    The optimal method uses these weighting values in its design calculation. The
    weightings give'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'acceptable error tolerances in each band. It the weights are equal, then there
    will be an equal deviation from the ideal in both bands. This is called an equiripple
    design. The specifications for the optimal method are:


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_260_0.png)


    Figure 8.23: An FIR LPF can be specified by the acceptable ripple in the pass
    band (barely observable here) and the minimum stop-band attenuation.


    +   - The pass-band and stop-band frequencies

    +   - The maximum pass-band ripple and minimum stop-band attenuation

    +   - The order of the filter (the number of zeros in the frequency response)


    The algorithm works by first distributing the zeros out equally across the frequency
    axis. This is going to produce a series of humps in the pass band (the ripple)
    and lobes in the stop band. The ripples and lobes will produce a set of maxima
    and minima frequencies. The problem is that for a given specification, the locations
    of the extremal frequencies are not known before hand. The optimal method must
    use a search algorithm to iteratively move the locations around until a solution
    is found that is within the tolerance of the specifications. The optimal method
    uses an algorithm called the Remez exchange method to iteratively move the zeros
    around until a solution converges. It must be noted that the Remez exchange algorithm
    is not guaranteed to converge for a given set of specifications.


    Once the Remez exchange method finds the locations of the extremal frequencies,
    the resulting H(f) graph is sampled using the frequency sampling method to produce
    the IR, which is the set of FIR filter coefficients. To summarize the method:


    +   - Specify the filter parameter and order.

    +   - Equally distribute zeros across the spectrum.

    +   - Set the pass-band and stop-band weights.

    +   - Use the Remez exchange algorithm to iteratively find the location of the
    zeros.

    +   - Sample the resulting frequency response to produce the final IR.


    # 8.9 Using RackAFX''s Optimal Method Tool


    RackAFX lets you design any of the four classical filter types using the equiripple
    weighting for the pass band and stop band. BPF and BSF filters have an additional
    band edge to specify, but the meaning of pass-band ripple and stop-band attenuation
    is the same for all filter types. You can start with an LPF design by clicking
    on the Optimal button. Try the following filter specifications:'
