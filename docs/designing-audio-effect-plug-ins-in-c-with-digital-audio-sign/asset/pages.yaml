- pgno: 106
  md: '![](img/b54974d0a4317ec82d7ae02126d10a6f_106_0.png)


    # Figure 5.1: Sine, cosine, and sinusoid signals.


    Euler''s equation is shown below:


    ```

    e^{j\theta} = \cos(\theta) + j\sin(\theta)

    j = \sqrt{-1}

    (5.2)

    ```


    You can see that it includes both sine and cosine functions. The j term is the
    imaginary number, the square root of -1 (mathematicians call it i but since that
    represents current in engineering, we rename it j instead). The j is known as
    the phase rotation operator; multiplying a function by j rotates the phase by
    90 degrees.


    Suppose you want to shift the phase of a waveform by 180°, thereby inverting it.
    Mathematically, you can do this by multiplying the waveform by -1, inverting the
    values of all its points. Suppose you wanted to invert the waveform again (which
    would bring it back to its original shape)—you could do that by multiplying by
    -1 again. But suppose that you only wanted to shift the phase by 90°? Is there
    a number (η) you could use as a multiplier to shift by 90°? In other words,


    ```

    90-degree shifted waveform = (originalwaveform) (η)

    ```


    You don''t know what η is yet, but you can figure it out. Suppose you then wanted
    to shift the waveform by another 90 degrees, which would be the same as shifting
    the original waveform by 180 degrees. You would multiply it by η again. You''d
    then have the following:


    ```

    180-degree shifted waveform = (originalwaveform) (η)(η)

    = (originalwaveform) (η)²

    = (originalwaveform) (-1)

    ```


    This leads to Equation 5.3:'
  merge: -1
  img_proc: true
- pgno: 107
  md: '\(\eta^2 = -1\)

    \(\eta = \sqrt{-1} = j\)

    (5.3)


    So, you can perform a conceptual 90-degree phase shift by multiplying a waveform
    by \(j\). A \(-90\)-degree phase shift is accomplished by multiplying by \(-j\).
    Some other useful relationships with \(j\) are


    \(j^2 = -1\)

    \(\frac{1}{j} = -j\)

    (5.4)


    Euler''s equation is complex and contains a real part (cos) and imaginary part
    (sin), and the plus sign (+) in the equation is not a literal addition—you can''t
    add real and imaginary numbers together. In a complex number of the format A +
