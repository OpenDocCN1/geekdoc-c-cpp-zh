    The point in the input/output plot where the signal hits the threshold, thereby
    engaging the device, is called the knee of the compression curve. With a hard
    knee the signal is either above the threshold or below it and the device kicks
    in and out accordingly. The soft-knee compressor allows the gain control to change
    more slowly over a width of dB around the threshold called the knee width (W).
    In this way, the device moves more smoothly into and out of compression or downward
    expansion. Figure 13.5 compares hard- and soft-knee curves.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_436_0.png)


    # Figure 13.5: Hard and soft-knee compression curves.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_436_1.png)


    # Figure 13.6: Setting up the endpoints for interpolating the CS value for a soft-knee
    compressor.


    There are several approaches to generating the soft-knee portion of the curve
    when calculating the gain reduction value. Curve fitting by interpolating across
    the knee width is popular. There are a variety of different ways to implement
    the curve fitting. We already have a Lagrange interpolator in the software, so
    we can use this to fit a second-order polynomial curve to the knee. This is done
    by altering the CS or ES values. The two values above and below the threshold
    are the x values, while the two values of the slope variable at the end points
    are the y components. When the detector signal is in the knee zone around the
    threshold, we use its value to calculate a new slope. Figure 13.6 shows an example.
    The knee width (W) is 10 dB with a -40 dB threshold. For a compression ratio of
    1:4, CS is 0.75. Therefore, the soft-knee CS will vary between 0 at -45 dB to
    0.75 at -35 dB. The'
