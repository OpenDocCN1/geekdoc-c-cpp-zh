    \ &fOutputFrame[0], 2, 2);\n\n        // inc frame counter\n        uFrameCount++;\n\
    \    }\n}\n```\n\n# A.6 AU Overview\n\nVST was a bit more complex in that you\
    \ had to do some of the GUI work yourself. Whether you write one from scratch\
    \ or wrap the RackAFX plug-in, you are still stuck with the default GUI. AU plug-ins\
    \ are another order of magnitude in complexity. The actual audio processing function\
    \ is fairly simple. The large majority of the work goes into setting up the default\
    \ GUI and maintaining your presets. Unlike both RackAFX and VST, AU plug-ins are\
    \ not ANSI C/C++; they require the Audio Units and Core Foundation components,\
    \ so you need to be familiar with Mac programming if you are going to get into\
    \ AU programming. AU uses two base class objects together to implement a plug-in.\
    \ When you create a new Audio Unit plug-in in XCode, it sets up the derived classes\
    \ for you, one from each base class. You then override methods on both of them.\n\
    \n+   • AUEffectBase handles the GUI controls and any other non-audio-processing\
    \ details.\n+   • AUKernelBase handles the processing and reset controls.\n\n\
    # A.6.1 Default GUI\n\nSuppose we have a simple volume plug-in with just one volume\
    \ control. AU calls a control a “parameter.” Similar to VST, you first define\
    \ an enumerated list of UINT constant values in your Plugin.h file where “Plugin”\
    \ is the name and you have derived it from the AUEffectBase base class. These\
    \ constants are the control ID values, just as before.\n\n```\nenum {\n    kParam_One\
    \ = 0,\n    //Add your parameters here... increment kNumberOfParameters\n    kNumberOfParameters=1\n\
    };\n```"
