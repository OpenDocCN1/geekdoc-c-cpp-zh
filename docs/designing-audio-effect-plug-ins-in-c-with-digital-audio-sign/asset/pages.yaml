  md: '![](img/b54974d0a4317ec82d7ae02126d10a6f_241_0.png)


    Figure 7.35: A four-tap multi-tap delay line.


    You can also experiment with multiple feedback paths, filters, or setting your
    tap times using BPM and musical rhythms (e.g., delays on eighth and quarter notes).


    # 7.9.4 Ping-Pong Delay


    Figure 7.36 shows how the ping-pong delay cycles the delay back and forth between
