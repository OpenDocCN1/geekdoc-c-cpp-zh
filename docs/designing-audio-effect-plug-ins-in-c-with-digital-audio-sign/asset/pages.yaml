    \ delay, we are limiting the user to choosing delays that are multiples of the\
    \ sample period, about 23 uSec. You might think that is enough accuracy; however,\
    \ there are several instances where this won't be enough. The first is the case\
    \ of a delay that is beats-per-minute (BPM) synchronized (e.g., delay is set to\
    \ a multiple of the song's BPM to create synchronized echoes or percussion effects).\
    \ The second case is that of modulated delays like chorus and flanging, which\
    \ require smooth modulations from one delay time to another. Linear interpolation\
    \ will provide acceptable results.\n\nSuppose our delay is in a state where we\
