    = 2\pi f\), but do we really care about the frequency in Hz? In Chapter 4 when
    you analyzed the same filter, you applied DC, Nyquist, \(\frac{1}{2}\) Nyquist,
    and \(\frac{1}{4}\) Nyquist without thinking about the actual sampling frequency.
    This is called normalized frequency and is usually the way you want to proceed
    in analyzing DSP filters. The actual sampling rate determines Nyquist but the
    overall frequency range (0 Hz to Nyquist) is what we care about. To normalize
    the frequency, you let f= 1 Hz in \(\omega = 2\pi f\), then \(\omega\) varies
    from 0 to \(2\pi\) or across a \(2\pi\) range. There is also one detail we have
    to be aware of: negative frequencies.


