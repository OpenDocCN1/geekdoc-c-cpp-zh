    # 9.7 Band-Limited Additive Wave Tables


    If you looked at the analyzer''s fast Fourier transform (FFT) window you saw an
    abundance of upper harmonics in the saw-tooth, triangle, and square waves. That
    is because mathematically, these waveforms contain harmonics out to infinite frequency.
    Equations 9.8 through 9.10 show the Fourier series equations for these waveforms.


    ```

    y(n)_{SAW} = \sum_{k=1}^{\infty} (-1)^{k+1} \frac{1}{k} \sin(k \omega n T)

    = [ \sin(\omega n T) - \frac{1}{2} \sin(2 \omega n T) + \frac{1}{3} \sin(3 \omega
    n T) - \frac{1}{4} \sin(4 \omega n T) + ... ]

    (9.8)

    ```


    The saw-tooth waveform has both even and odd harmonics scaled according to (1/k):
    \propto 1


    ```

    y(n)_{TRI} = \sum_{k=0}^{\infty} (-1)^k \frac{1}{(2k + 1)^2} \sin((2k + 1) \omega
    n T)

    = [ \sin(\omega n T) - \frac{1}{9} \sin(3 \omega n T) + \frac{1}{25} \sin(5 \omega
    n T) - \frac{1}{49} \sin(7 \omega n T) + ... ]

    (9.9)

    ```


    The triangle waveform has only odd harmonics. The (-1)^k term alternates the signs
    of the harmonics. The harmonic amplitudes drop off at a rate given by 1/(2k +
    1)^2 which is exponential in nature.


    ```

    y(n)_{SQUARE} = \sum_{k=0}^{\infty} \frac{1}{2k + 1} \sin((2k + 1) \omega n T)

    = [ \sin(\omega n T) + \frac{1}{3} \sin(3 \omega n T) + \frac{1}{5} \sin(5 \omega
    n T) + \frac{1}{7} \sin(7 \omega n T) + ... ]

    (9.10)

    ```


    The square wave is also composed of odd harmonics like the triangle wave. The
    harmonic amplitudes drop off at a rate of 1/(2k + 1), which is not as severe as
    the triangle wave. Therefore, the square wave has higher-sounding harmonics and
    a more gritty texture.


    Using these Fourier series equations, you can implement Fourier synthesis (or
    additive synthesis) to build up a waveform that is band-limited to Nyquist. Let''s
    modify the existing wave table oscillator to optionally use band-limited tables
    instead. The first version will be somewhat primitive, but will be a beginning
    source that you can use to make much more advanced synthesizer oscillators. This
    version will also span the frequencies of the piano.


    The highest note on a piano is C8, vibrating at about 4186 Hz. Five times this
    value is 20,930 Hz, which is just barely below Nyquist. This means that we can
    synthesize our tables with the fundamental plus the next five harmonics (also
    called partials) of the series given in Equations 9.8 through 9.10 and create
    our band-limited tables. The tables will therefore potentially contain the fundamental,
    2nd, 3rd, 4th, 5th, and 6th harmonics. In order to do this, you need to modify
    the plug-in to allow for another mode: normal or band-limited. You can do this
    with another enumerated UINT'
