    # 11.13 Generalized Feedback Delay Network Reverbs


    Another approach to reverberation is to realize that the listener is experiencing
    dense echoes caused by multiple reflections off of surfaces along with potentially
    constructive or destructive interference. The generalized feedback delay network
    (FDN) approach began with Gerzon''s work in 1972 on preserving energy in multichannel
    reverberators. It was continued by Stautner and Puckette (1982) as well as Jot
    and Chaigne (1991). Generally speaking, the idea is to model the room with some
    number of delay lines with potential feedback paths to and from every delay line
    in the system. The inputs and outputs of each delay line are also scaled by some
    values b and c. Consider a simple version that consists of two delay lines with
    feedback paths to and from each one shown in Figure 11.31.


    If you look at Figure 11.31 and think about Schroeder''s parallel comb filter
    bank, you can see that this is a variation, indeed a generalization, on the structure.
    In the general FDN, every possible feedback path is accounted for. Additionally,
    each delay line has input and output amplitude controls. If you let b1, b2, c1,
    and c2 all equal 1.0 and set g12 and g22 to 0.0, you get Schroeder''s parallel
    comb filter network exactly. Notice how the feedback coefficients are labeled:


    +   - g11: Feedback from delay line 1 into delay line 1

    +   - g12: Feedback from delay line 1 into delay line 2

    +   - g21: Feedback from delay line 2 into delay line 1

    +   - g22: Feedback from delay line 2 into delay line 2'
  merge: -1
  img_proc: true
- pgno: 367
  md: '![](img/b54974d0a4317ec82d7ae02126d10a6f_367_0.png)


    # Figure 11.31: A two-delay-line feedback network.


    An equivalent way to look at Figure 11.31 is shown in Figure 11.32. You can see
    that the feedback coefficients have been grouped together in what looks like a
    linear algebra matrix. The total energy is preserved if the matrix of coefficients
    is unitary. A unitary matrix multiplied by its transpose matrix results in the
    identity matrix. The transpose matrix is formed by turning the rows into columns
    and vice versa. These matrices are square. The identity matrix is a square matrix
    whose diagonal values are all 1. An FDN that uses a unitary matrix for its coefficients
    is called a unitary feedback delay network or UFDN.


    Examine the gain matrix $G$ in Equation 11.31:


    ```

    $$ G = \begin{bmatrix} 0 & 1 \\ -1 & 0 \end{bmatrix} $$

    ```


    Then multiplying it by its transpose yields


    ```

    $$ GG^T = \begin{bmatrix} 0 & 1 \\ -1 & 0 \end{bmatrix} \begin{bmatrix} 0 & -1
    \\ 1 & 0 \end{bmatrix} = \begin{bmatrix} 1 & 0 \\ 0 & 1 \end{bmatrix} \quad \dots
    \quad (11.31) $$

    ```'
  merge: -1
  img_proc: true
