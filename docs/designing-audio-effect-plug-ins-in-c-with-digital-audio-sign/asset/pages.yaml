  img_proc: true
- pgno: 185
  md: 'Specify:


    +   - $f_c$, corner frequency

    +   - $BW$, bandwidth of peak/notch = $f_c/Q$


    Butterworth BPF and BSF are made by cascading (BPF) or paralleling (BSF) a Butterworth
    LPF and Butterworth HPF.


    Note: These filter coefficients contain the tan() function, which is undefined
    at $\pi/2$ and then flips negative between $\pi/2$ and p. The argument is $\pi
    f_c BW/f_s$, so care must be taken with these filters to ensure that $\pi f_c
    BW/f_s$ does not fall on the range of $\pi/2$ to $\pi$. One solution is to clamp
    the value of $\pi f_c BW/f_s$ so that it never equals or exceeds $\pi/2$.


    The design equations are as follows:


    | BPF | BSF |

    |---|---|

    | $C = \frac{1}{\tan(\pi f_c BW/f_s)}$ | $C = \tan(\pi f_c BW/f_s)$ |

    | $D = 2 \cos(2\pi f_c/f_s)$ | $D = 2 \cos(2\pi f_c/f_s)$ |

    | $a_0 = \frac{1}{1 + C}$ | $a_0 = \frac{1}{1 + C}$ |

    | $a_1 = 0.0$ | $a_1 = -a_0 D$ |

    | $a_2 = -a_0$ | $a_2 = a_0$ |

    | $b_1 = -a_0(CD)$ | $b_1 = -a_0 D$ |

    | $b_2 = a_0(C - 1)$ | $b_2 = a_0(1 - C)$ |


    # 6.6.6 Second-Order Linkwitz–Riley LPF and HPF


    Specify:


    +   - $f_c$, corner frequency (–6 dB)


    Second-order Linkwitz–Riley LPFs and HPFs are designed to have an attenuation
    of –6 dB at the corner frequency rather than the standard –3 dB, shown in Figure
    6.24. When these filters are placed in parallel with the same cutoff frequency,
    their outputs sum exactly and the resulting response is flat. They are often used
    in crossovers. We use them for the spectral dynamics processor later on.


    The design equations are as follows:'
  merge: -1
  img_proc: true
- pgno: 186
  md: '| Variable | LPF | HPF |

    | :--- | :--- | :--- |

    | \(\theta_c\) | \(\pi f_c / f_s\) | \(\pi f_c / f_s\) |

    | \(\Omega_c\) | \(\tan(\theta_c)\) | \(\tan(\theta_c)\) |

    | \(\kappa\) | \(\frac{\Omega_c}{\tan(\theta_c)}\) | \(\frac{\Omega_c}{\tan(\theta_c)}\)
    |

    | \(\delta\) | \(\kappa^2 + \Omega_c^2 + 2\kappa\Omega_c\) | \(\kappa^2 + \Omega_c^2
    + 2\kappa\Omega_c\) |

    | \(a_0\) | \(\frac{\Omega_c^2}{\delta}\) | \(\frac{\kappa^2}{\delta}\) |

    | \(a_1\) | \(2\frac{\Omega_c^2}{\delta}\) | \(\frac{-2\kappa^2}{\delta}\) |

    | \(a_2\) | \(\frac{\Omega_c^2}{\delta}\) | \(\frac{\kappa^2}{\delta}\) |

    | \(b_1\) | \(\frac{-2\kappa^2 + 2\Omega_c^2}{\delta}\) | \(\frac{-2\kappa^2 +
    2\Omega_c^2}{\delta}\) |

    | \(b_2\) | \(\frac{-2\kappa\Omega_c + \kappa^2 + \Omega_c^2}{\delta}\) | \(\frac{-2\kappa\Omega_c
    + \kappa^2 + \Omega_c^2}{\delta}\) |


    All pass filters have interesting designs that yield equally interesting results.
    Their frequency responses are perfectly flat from DC to Nyquist. However, the
    phase responses are the same as those in first- and second-order LPFs. You get
    all of the phase shift but none of the frequency response change. These filters
    can be found in crossovers and reverb algorithms. They are also used for the phaser
    effect. APFs are designed with pole-zero pairs whose pole/zero radii are reciprocals
    of one another. For a first-order APF, the pole lies somewhere on the real axis
    inside the unit circle at radius R. The zero lies outside the unit circle at radius
    1/R (Figure 6.25).


    If you think about the geometric interpretation and analysis of the transfer function,
    as you move around the unit circle, your vector distances from the pole and zero
    will always be reciprocals, or 1/each other. The amplitude response is then flat
    but the phase response *does* change because it is not based on the distance to
    the point in question but rather on the angle of incidence of the ray line drawn
    from the analysis point to the pole or zero. The second-order APF has complementary
    poles and zeros also at reciprocal radii (Figure 6.26).


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_186_0.png)


    Figure 6.24: A comparison between Butterworth and Linkwitz–Riley filters each
    with \(f_c = 1\) kHz; the Linkwitz–Riley filter is down –6 dB at \(f_c\).'
