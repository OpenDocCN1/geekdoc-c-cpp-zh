- pgno: 165
  md: '# # Audio Filter Designs: IIR Filters


    It''s time to put the theory into practice and make some audio filters and equalizers
    (EQs). You know that the coefficients of a filter determine its frequency response
    and other characteristics. But how do you find the coefficients? There are two
    fundamental ways to find the coefficients of the infinite impulse response (IIR)
    filter:


    +   - Direct z-plane design

    +   - Analog filter to digital filter conversion


    This chapter uses the following filter naming conventions:


    +   - LPF: Low-pass filter

    +   - HPF: High-pass filter

    +   - BPF: Band-pass filter

    +   - BSF: Band-stop filter


    # ## 6.1 Direct z-Plane Design


    In this first category of design techniques, you manipulate the poles and zeros
    directly in the z-plane to create the response you want. You take advantage of
    the simple equations that relate the coefficients to the pole/zero locations.
    Consider the bi-quad. Equation 6.1 shows the numerator. Equation 6.2 shows the
    denominator.


    ```

