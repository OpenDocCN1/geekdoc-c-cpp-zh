    # ## 11.7 The Low-Pass Filter–Comb Reverberator


    One of the things missing from the original Schroeder reverb is the fact that
    in a real room, high frequencies decay much more rapidly than low frequencies,
    as shown in the EDRs of Figure 11.6 (Moorer 1979). Placing a low-pass filter (LPF)
    in the comb filter''s feedback path will roll off the high-frequency content of
    successive echoes exponentially, which is what we want. The LPF–comb reverberator
    block diagram is shown in Figure 11.16.


    The LPF is chosen to be a one-pole feedback type (infinite impulse response [IIR])
    so that it will introduce not only low-pass filtering, but also its own impulse
    response into the echoes going through the feedback path. In Figure 11.17 the
    LPF is shown in the dotted box; notice that it is turned around backward to follow
    the flow of the feedback path.


    To find the difference equation, it is easier to start in the frequency domain
    with the z transforms of the comb and first-order feed-forward filter, since we
    are already familiar with them by now (Equation 11.22).'
