    # ## 5.13 Estimating the Frequency Response: Zeros


    An interesting property of the z-plane and z transform is that you can measure
    the frequency response graphically on the z-plane. In the simplest case of only
    one zero, the method is as follows:


    +   - Locate each evaluation frequency on the outer rim of the unit circle.

    +   - Draw a line from the point on the circle to the zero and measure the length
    of this vector. Do it for each evaluation frequency.

    +   - The lengths of the lines will be the magnitudes at each frequency in the
    frequency response.


    In Figure 5.24 you can see the complete operation, first drawing and measuring
    the lines—you can use graph paper and a ruler, if you want—then building the frequency
    response plot from them. Notice also that the magnitude of a line drawn from Nyquist
    to the zero at -1 has a length of zero. The lengths of the vectors are the mathematical
    definition of magnitude and you are evaluating the whole filter at once. These
    z-plane plots are going to be useful for filter design. You can also derive the
    phase response, which involves measuring the angles of incidence of each vector
    on the zero. With multiple zeros, it becomes cumbersome. But, estimating the frequency
    response is pretty simple, even for more complex filters.


    You might notice that even though this frequency response looks like the one we
    produced earlier, the gain values are not the same. In this filter, the gain is
    2.0 at DC, and in ours, it''s half of that. In fact, this filter''s magnitudes
    at the evaluation frequencies are all twice what ours are.'
