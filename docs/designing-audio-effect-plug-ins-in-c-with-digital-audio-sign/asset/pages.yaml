    \ AUVolume::GetParameterInfo(AudioUnitScope\n    inScope,\n    AudioUnitParameterID\
    \    inParameterID,\n    AudioUnitParameterInfo  &outParameterInfo)\n{\n    <SNIP\
    \ SNIP SNIP>\n    switch(inParameterID)\n    {\n    case kParam_One:\n       \
    \ AUBase::FillInParameterName (outParameterInfo, kParameterOneName,\n        false);\n\
    \        outParameterInfo.unit = kAudioUnitParameterUnit_LinearGain;\n       \
    \ outParameterInfo.minValue = 0.0;\n        outParameterInfo.maxValue = 1;\n \
    \       outParameterInfo.defaultValue = kDefaultValue_ParamOne;\n        break;\n\
    \    default:\n        result = kAudioUnitErr_InvalidParameter;\n        break;\n\
    \    }\n}\n```\n\nHere, when the Client queries the plug-in on its first parameter\
    \ (kParam_One) it fills out a structure about the control. You can see the minimum,\
    \ maximum, and default values being set. The “unit” variable of the structure\
    \ is set to kAudioUnitParameterUnit_LinearGain. A linear gain control moves between\
    \ 0 and 1.0. Another example is kAudioUnitParameterUnit_Boolean, which specifies\
    \ a boolean control variable. What is interesting here is that you don’t declare\
    \ the actual variable that stores the control data. The variable is a float variable\
    \ that the framework stores for you. You tell the framework what kind of variable\
    \ it represents. When you need to get or set the variable, you use GetParameter()\
    \ and SetParameter(), which get and set a float data type.\n\n# A.6.2 Signal Processing\n\
    \nThe AU processing function is simply named Process(). The audio data moves in\
    \ buffers. The buffers can contain any arbitrary number of channels with the simplest\
    \ systems being N × N or equal input/outputs. Although the inNumChannels variable\
    \ is passed to the function, it is always set to 1.0 for the current version of\
    \ AU. This is OK for mono or when you don’t need to process channels independently.\
    \ A boolean flag is passed to the method, indicating the mute condition and the\
    \ function simply returns without processing. The parameters that are passed to\
    \ the Process() method are as follows:"
