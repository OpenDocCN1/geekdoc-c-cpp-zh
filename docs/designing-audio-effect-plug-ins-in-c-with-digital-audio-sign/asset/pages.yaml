    # 4.1 First-Order Feed-Forward Filter


    In order to get a grip on the nature of digital filtering, start with the first-order
    feed-forward filter shown in a block diagram in Figure 4.5. You''ve already seen
    a version of it in the HPF tone control you coded in the last chapter.


    The difference equation is as follows:


    ```

    y(n) = a₀x(n) + a₁x(n – 1) (4.1)

    ```'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'You can tell why it''s called feed forward—the input branches feed forward
    into the summer. The signal flows from input to output. There is no feedback from
    the output back to the input. Now, suppose we let the coefficients $a_0$ and $a_1$
    both equal 0.5 in Figure 4.6.


    In order to analyze this filter we can go the easy but tedious route or the difficult
    but elegant route. Let''s start with the easy way. In order to figure out what
    this does, you apply the five basic digital test signals you learned in Chapter
    1 to the filter and then manually push the values through and see what comes out.
    You only need a pencil and paper or a simple calculator. The five waveforms we
    want to test are:


    +   1. DC (0 Hz)

    +   2. Nyquist

    +   3. ½ Nyquist

    +   4. ¼ Nyquist

    +   5. Impulse


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_85_0.png)


    Figure 4.5: The first-order feed-forward filter.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_85_1.png)


    Figure 4.6: What kind of filter is this? What are its frequency and phase responses?


    For each audio sample that enters there are two phases to the operation:


    +   1. Read phase: The sample is read in and the output is formed using the difference
    equation and the previous sample in the delay register.

    +   2. Write phase: The delay element is overwritten with the input value—the
    sample stored in the single $z^{-1}$ register is effectively lost.


    Start with the DC/step input and begin sequentially applying the samples into
    the filter shown in Figures 4.7 through 4.10.


    Now, observe the amplitude and phase shift of the input versus output—the output
    amplitude'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'eventually settles out to a constant 1.0 or unity gain condition, so at DC
    or 0 Hz, the output equals the input. However, there is a one sample delay in
    the response, causing the leading edge of the step-input to be smeared out by
    one sample interval. This time smearing is a normal consequence of the filtering.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_86_0.png)


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_86_1.png)


    Figure 4.7: On the first iteration the input sample is used in the difference
    equation to create the output, x(n) = 0, y(n) = 0 and then the input is shifted
    into the delay register.


    In a feed-forward filter, the amount of time smearing is equal to the maximum
    delayed path through the feed-forward branches.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_86_2.png)


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_86_3.png)


    Figure 4.8: The process continues with each sample. Here the input 1.0 is combined
    with the previous input; the second output y(n) = 0.5.'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'Next, repeat the process for the Nyquist frequency (DC and Nyquist are the
    easiest, so we''ll do them first). The filter behaves in an entirely different
    way when presented with Nyquist (Figures 4.11 through 4.14).


    Now, make your observations about amplitude and phase. The amplitude at Nyquist
    eventually becomes zero after the one-sample-delay time. The phase is hard to
    tell because the signal has vanished. Why did the amplitude drop all the way to
    zero at Nyquist? The answer is one of the keys to understanding digital filter
    theory: the one-sample delay introduced exactly 180 degrees of phase shift at
    the Nyquist frequency and caused it to cancel out when recombined with the input
    branch through $a_0$.


    Delay elements create phase shifts in the signal. The amount of phase shift depends
    on the amount of delay as well as the frequency in question.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_87_0.png)


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_87_1.png)


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_87_2.png)


    Figure 4.9: The sequence continues until we observe a repeating pattern; 1.0 is
    repeating here.


    In the case of Nyquist, the one-sample delay is exactly enough to cancel out the
    original signal when'
  merge: -1
  img_proc: true
