    \ fLFOSample, float* pLeftVolume,\n                               float* pRightVolume);\n\
    // END OF USER CODE -------------------------------------- //\n```\n\n# Table\
    \ 14.1: TremoloPanner graphical user interface (GUI) controls.\n\n| Slider Property\
