    # 11.8 Moorer''s Reverberator


    Moorer proposed a similar design to Schroeder''s reverberator which uses a parallel
    bank of LPF-comb filters. Because the LPFs remove energy from the system, more
    units are needed in parallel for a given reverb time. Moorer''s reverb sounds
    better because it mimics the high-frequency losses of a real room.


    In Figure 11.18 you can see the differences from Schroeder''s reverb—there are
    more comb units and only one all-pass on the output. The same care must be taken
    to ensure the pole radii of the comb filters are still the same, using Equation
    11.9 to set them according to the desired reverb time. Table 11.1 shows Moorer''s
    preset values for a reverb time of about 2 seconds.


