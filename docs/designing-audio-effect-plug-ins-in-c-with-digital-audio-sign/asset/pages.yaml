    # 11.6 Schroeder''s Reverberator


    Schroeder combined a parallel comb filter bank with two APFs to create his first
    design. The comb filters produce the long series of echoes and the APFs multiply
    the echoes, overlaying their own decaying impulse response on top of each comb
    echo. The resulting reverberation unit, shown in Figure 11.15, sounds marginal
    but it is very simple to implement.


    Schroeder suggests that the ratio of smallest to largest delay in the comb filters
    should be about 1:1.5 and originally specified a range of 30–45 mSec in total.
    The 1:1.5 ratio rule turns out to be useful for just about any set of parallel
    comb filters.


    The comb filters should have the following properties:


    +   - Choose the delays to have the 1:1.5 ratio above.

    +   - Choose delay times that have no common factors (e.g., 2191, 2971, 3253,
    3307).

    +   - Set the gain values according to Equation 11.9.'
