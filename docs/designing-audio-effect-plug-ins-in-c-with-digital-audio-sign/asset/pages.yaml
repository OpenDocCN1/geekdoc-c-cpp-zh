- pgno: 277
  md: '![](img/b54974d0a4317ec82d7ae02126d10a6f_277_0.png)


    # Figure 9.1: The direct form sinusoidal oscillator z-plane and block diagram.


    You can see that the block diagram in Figure 9.1 has no input. Oscillators do
    not have inputs; instead they have initial conditions which, once started, will
    cause eternal oscillation. DSP theory suggests that kick-starting the system with
    an impulse will cause it to self-oscillate, which it does. However, the amplitude
    and phase are dependent on the frequency, \(\theta\). For an oscillator, we would
    like to precisely control the amplitude and starting phase so that they are exact.
    If we are trying to create a sinusoid with an initial phase offset of 0 degrees,
    then the first sample out of our oscillator at \(n = 0\) would be 0.0, and the
    second sample out would be \(\sin(\omega n T)\) where \(n\) 51 and \(T = 1/f_s\).


    # 9.1.1 Initial Conditions


    Suppose we want to generate the above sinusoid, oscillating at 500 Hz. If we want
    the first sample out to be 0.0, then continue rising after that, we need to initialize
    the delays as if a sinusoid had been oscillating, up to the point when we turn
    on the oscillator. So we can set our initial state by preloading those last two
    samples into the delays in our oscillator/filter, as shown in Figure 9.2.


    The sinusoid is oscillating at \(\sin(\omega n T)\) where \(n = 0, 1, 2, 3 \dots\)
    after the oscillator starts and \(T\) is the sample period. The previous two samples
    with \(f_o = 500\) Hz and \(f_s = 44,100\) Hz would be \(\sin(\omega(-1T))\) and
    \(\sin(\omega(-2T))\), which are \(-0.0712\) and \(-0.1532\), respectively. The
    direct form oscillator block diagram is shown in Figure 9.3.


    The difference equation is as follows:


    ```

    y(n) = -b_1 y(n - 1) - b_2 y(n - 2)  (9.2)

    ```


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_277_1.png)'
  merge: -1
  img_proc: true
