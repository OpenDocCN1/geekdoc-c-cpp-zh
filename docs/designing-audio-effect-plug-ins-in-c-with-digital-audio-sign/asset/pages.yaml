- pgno: 105
  md: 'You want to get a grip on the underlying digital signal processing (DSP) theory
    of filters for several reasons. It helps to understand the anatomy of the filter
    because you have to implement it in code; a deeper understanding of the theory
    can only help your coding strategy. Also, the same DSP filter analysis and mathematical
    models can be applied to other effects including delay, chorusing, reverb, and
    compression. In order to intuitively understand the foundation of DSP theory,
    you need to review some math and engineering concepts.


    # 5.1 The Complex Sinusoid


    The analysis and design of digital filters uses the sinusoid as its basic stimulus
    function. Since Fourier showed that a signal can be decomposed into sinusoids,
    if you know how the system reacts to a sinusoidal stimulus at a bunch of different
    frequencies, you can plot the frequency and phase responses like you did by hand
    in the last chapter. This is akin to the impulse response—since the input signal
    is a train of impulses of varying amplitudes, if you know how the filter responds
    to a single impulse, you can figure out how it will respond to multiple impulses.
    You also did this by hand when you took the impulse response of the low-pass filter.


    Everyone is familiar with the sine and cosine functions—sine and cosine are related
    by an offset of 90 degrees and the sine function starts at zero, whereas cosine
    starts at 1.0. In Figure 5.1 you can identify the sine and cosine waveforms by
    their starting position. But what about the sine-like waveform that starts at
    an arbitrary time in the lower plot? Is it a sine that has been phase shifted
    backwards or a cosine that has been phase shifted forward? You have to be careful
    how you answer because sine and cosine have different mathematical properties;
    their derivatives are not the same and it usually becomes difficult when you try
    to multiply them or combine them in complex ways. Add a phase offset to the argument
    of the sin() or cos() function and then it really turns into a mess when you do
    algebra and calculus with them. What you need is a function that behaves in a
    sinusoidal manner, encapsulates both sine and cosine functions, and is easy to
    deal with mathematically. Such a function exists, and it’s called the complex
    sinusoid:


    ```

    Complex sinusoid = e^{jωt} ........ (5.1)

    ```'
