    # 8.4 The Frequency Sampling Method


    The frequency sampling method is really interesting because it lets you design
    any kind of frequency response you want—it can be any arbitrary shape and it does
    not have to be a classical filter type (LPF, high-pass filter [HPF], band-pass
    filter [BPF], band-stop filter [BSF]), but you can make these types if you want
    to. The frequency sampling method involves these steps:


    +   1. Decide on a desired frequency response and plot it in the frequency domain.

    +   2. Sample the frequency response at evenly spaced intervals determined by
    the filter order you choose.

    +   3. Take the inverse discrete cosine-transform (DCT) of the sampled frequency
    response to get the sampled IR (the DCT is simply the real part of the fast Fourier
    transform [FFT]).

    +   4. Load the sampled IR into a convolver and go.


    # 8.4.1 Linear-Phase FIR Using the Frequency Sampling Method


    Choose:


    N = number of coefficients


    Calculate:


    For N = odd:


    +   • (N + 1)/2 = number of samples in frequency domain, starting at 0 Hz


    For N = even


    +   • N/2 = number of samples in frequency domain, starting at 0 Hz Δf = fs/N
    = frequency spacing, starting at 0 Hz'
