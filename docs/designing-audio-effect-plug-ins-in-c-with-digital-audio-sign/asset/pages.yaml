- pgno: 276
  md: 'Oscillators find several uses in audio effects and plug-ins. The obvious use
    is as an audio test signal like the one RackAFX provides on the main interface.
    Additive synthesis of musical sounds uses multiple sinusoidal oscillators at harmonic
    frequencies to create complex waveforms. Wavetable synthesis stores a periodic
    waveform in a table for interpolation and playback when the musician strikes a
    key or a MIDI message is sent. Low-frequency oscillators (LFOs) are used in the
    design of modulated delay lines and modulated filters. Oscillators broadly fall
    into two categories: direct calculation and table lookup. We desire oscillators
    that have several important features:


    +   - Stability over a wide range of frequencies

    +   - No aliasing

    +   - Purity of sinusoid (low THD+N) for sinusoidal oscillators

    +   - Quadrature phase outputs

    +   - Simplicity of calculation


    # 9.1 Direct Form Oscillator


    We can make a sinusoidal oscillator by placing a pair of poles directly on the
    unit circle in the z-plane. This produces a sinusoid at the pole angle (or frequency).
    The radius of the pole is always 1.0. Using the fundamental digital signal processing
    (DSP) z-plane equations, we can directly write the transfer function and difference
    equations:


    ```

    H(z) = a_0 [\frac{1}{1 + b_1 z^{-1} + b_2 z^{-2}}]

    = a_0 [\frac{1}{1 - 2R\cos(\Theta)z^{-1} + R^2 z^{-2}}]

    y(n) = 2\cos(\Theta)y(n - 1) - y(n - 2)

    ```


    Since the pole radius is 1.0, then the b2 coefficient is 1.0 as well. The b1 coefficient
    is then -2cos(0), where theta is the pole frequency from 0 to pi.'
