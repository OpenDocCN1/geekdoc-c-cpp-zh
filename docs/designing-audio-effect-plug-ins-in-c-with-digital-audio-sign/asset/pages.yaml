    Figure 7.36: The ping-pong delay builds on the cross-feedback delay by crossing
    the inputs as well as the feedback paths to produce the back and forth ping-pong
    effect. You will probably want to design the advanced DDL module first and use
    its input, output, and feedback ports.'
