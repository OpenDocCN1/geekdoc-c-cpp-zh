- pgno: 33
  md: 'diagrams, a delay is represented by a box with the letter z inside. The z-term
    will have an exponent such as z^-5 or z^+2 or z^0—the exponent codes the delay
    in samples following the same bookkeeping rules, with negative (-) exponents representing
    a delay in time backward (past samples) and positive (+) representing delay in
    forward time (future samples). You call z the delay operator and as it turns out,
    time-delay will be treated as a mathematical operation.


    You are probably asking yourself how you can have a positive delay toward the
    future, and the answer is that you can''t for real-time signal processing. In
    real-time processing you never know what sample is going to come in next. However,
    in non-real-time processing (for example, an audio file that you are processing
    offline) you do know the future samples because they are in the file. Figure 1.20
    shows two common ways to denote a one-sample delay in an algorithm block diagram.


    # Delay rules:


    +   - Each time a sample goes into the delay register (memory location), the previously
    stored sample is ejected.

    +   - The ejected sample can be used for processing or deleted.

    +   - The delay elements can be cascaded together with the output of one feeding
    the input of the next to create more delay time.


    If a sample x(n) goes into the one-sample delay element, then what do you call
    the sample that is ejected? It''s the previous sample that came in, one sample
    interval in the past. So, the output sample is x(n - 1). In Figure 1.21 you can
    see how delay elements can be cascaded with outputs taken at multiple locations
    generating multiple samples to use in the algorithm.


