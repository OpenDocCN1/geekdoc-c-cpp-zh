- pgno: 433
  md: '# Dynamics Processing


    Dynamics processors are designed to automatically control the amplitude, or gain,
    of an audio signal and consist of two families: compressors and expanders. Technically
    speaking, compressors and expanders both change the gain of a signal after its
    level rises above a predetermined threshold value. A compressor reduces the gain
    of the signal once it goes over the threshold. An expander raises the gain of
    a signal after it crosses above the threshold. With the exception of noise reduction
    systems, true expanders are rare since they can easily cause instabilities, runaway
    gain, and distortion. What is normally called an “expander” today is technically
    a downward expander. A downward expander reduces the gain of a signal after it
    drops below the threshold. We will be designing a downward expander but will use
    the common lingo and refer to it simply as an expander. Both compressors and expanders
    require the user to decide on the threshold of operation as well as a ratio value
    that tells the device how much gain reduction to implement.


    Figure 13.1 shows the input/output transfer functions for the compressor family.
    The line marked 1:1 is unity gain. A given input x(dB) results in the same output
    y (dB). Above the threshold, the output level is compressed according to the ratio.
    For example, above the threshold on the 2:1 line, every 1 dB increase in 1 dB
    at the input results in an increase of only 0.5 dB at the output. On the 4:1 line,
    each 1 dB input increase results in a 0.25 dB output increase. On the ∞:1 line,
    increasing the input amplitude beyond the threshold results in no output increase
    at all, thus y(dB) is limited to the threshold value. This version of the device
    is called a limiter and represents the most extreme form of compression.


    Figure 13.2 shows the input/output transfer functions for the expander family.
    The ratios are reversed. You can see that as the signal falls below the threshold,
    it is attenuated by the ratio amount. For example, below the threshold on the
    1:2 line, every decrease in 1dB at the input results in a decrease of 2 dB at
    the output. On the 1: ∞ line, when the input falls below the threshold it receives
    infinite attenuation, that is, it is muted. This version of the device is called
    a gate (or noise gate) and represents the most extreme form of downward expansion.
    Perhaps the most important aspect of both families is that their gain reduction
    curves are linear for logarithmic axes. These devices operate in the log domain.
    The two families of dynamics processors yield four combinations: compression and
    limiting, and expansion and gating. We will implement all four of them.'
