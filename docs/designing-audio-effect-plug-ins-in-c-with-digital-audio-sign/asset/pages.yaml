- pgno: 57
  md: '# Figure 3.9: The preferences interface.


    In the preferences you need to:


    +   1. Choose your default folders for projects, WAVE files, and default WAVE
    files. You can use whatever directory you want for your project folder and you
    can also open projects from any other folder at any time; the default is simply
    for conveniently grouping all your projects together.

    +   2. Choose a Visual C++ compiler.

    +   3. Set the C++ options. Enable C++ Control/Switching should be left on for
