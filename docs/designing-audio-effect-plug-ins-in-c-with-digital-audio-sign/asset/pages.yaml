    # 5.14 Filter Gain Control


    The last thing you need to do is remove the overall gain factor from the transfer
    function so that overall filter gain (or attenuation) can be controlled by just
    one variable. This is actually pretty simple to do, but requires re-working the
    transfer function a bit. The idea is to pull out the $a_0$ variable as a multiplier
    for the whole function. This way, it behaves like a volume knob, gaining the whole
    filter up or down. The way you do it is to normalize the filter by $a_0$ (Equation
    5.34):


    ```

    H(z) = a_0 + a_1 z^{-1}

    = \frac{a_0}{a_0} + \frac{a_1}{a_0} z^{-1}

    = a_0 \left[ 1 + \frac{a_1}{a_0} z^{-1} \right]

    Let \alpha_1 = \frac{a_1}{a_0}

    H(z) = a_0 [1 + \alpha_1 z^{-1}]

    (5.34)

    ```


    By normalizing by $a_0$ and using the $\alpha_1$ variable you can produce a transfer
    function that looks basically the same in the polynomial but pulls $a_0$ out as
    a scalar multiplier—a gain control. Where is the zero of the new transfer function
    in Equation 5.35?


    ```

    H(z) = a_0 [1 + \alpha_1 z^{-1}]

    = a_0 \left[ 1 + \frac{\alpha_1}{z} \right]

    (5.35)

    ```


    Once again, by inspection we can tell that if z = -\alpha_1 then the function
    will become 0 regardless of the value of a_0. This transfer function has a zero
    at -\alpha_1. If you plug our values of a_0 = a_1 = 0.5, you still get the same
    zero at -1.0. The difference is in the gain of the filter.


    After extracting the magnitude response from the z-plane plot, scale it by your
    a_0 value. This makes the response in Figure 5.24 match our others because everything
    gets multiplied by a_0 = 0.5. The idea of controlling the gain independently of
    the magnitude response is useful in audio filters, so we will keep it and use
    it in all future analyses.'
