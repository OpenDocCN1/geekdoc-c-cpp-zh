- pgno: 392
  md: '# Modulated Filter Effects


    Modulated filter effects alter one or more filter parameters with other signals
    called control signals. The filter parameters might include cutoff frequency,
    Q, bandwidth, filter type, or overall gain. The control signals are usually periodic
    low-frequency oscillators (LFOs), a signal envelope, an envelope generator (EG)
    or even another audio signal. In the modulated delay effects, the LFO control
    signal changed the delay amount of the signal. In modulated filter effects, the
    filter parameters are the ones that are changing. In this chapter you will design
    and implement the following effects:


    +   - Mod filter using an LFO

    +   - Envelope follower using an audio detector

    +   - Phaser


    The phaser is a specialized effect that uses a bank of all-pass filters (APFs)
    to try to brute force delay the signal to make a flanging effect. An LFO modulates
    the depth of the APFs. In


    Figure 12.1 you can see a simple modulated filter. The filter type is a low-pass
    filter (LPF). The control signal is an LFO. The control parameter is the cutoff
    frequency of the filter.


    In Figure 12.2, an EG moves the filter parameter. An EG is triggered by some external
    event, such as a note-on or -off event, or possibly triggered when the input level
    crosses a threshold. A modulated filter might have multiple parameters controlled
    by multiple control signals. For example, Figure 12.3 shows another LPF that has
    two modulation sources for two different parameters.


    In Figure 12.3 you can see a new module labeled envelope detector; it detects
    and follows the peak, mean-squared (MS), or root-mean-squared (RMS) value of the
    control signal which is the input signal here. The control signal could be taken
    from other sources such as another audio signal or a complex LFO signal. The effect
    in Figure 12.2 has a special name too: it is called an envelope follower.


    ![](img/b54974d0a4317ec82d7ae02126d10a6f_392_0.png)


    Figure 12.1: A simple LFO-modulated LPF.'
