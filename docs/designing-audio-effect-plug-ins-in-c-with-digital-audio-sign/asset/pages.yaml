    The abundant time smearing suggested that this might be a viable option. Unfortunately
    the consensus was that this reverb sounded metallic and that it didn''t build
    up the echo density fast enough. Schroeder''s original series APFs started with
    the maximum delay in the first module (about 100 mSec) and then decreased by 0.3
    for each successive module, through five modules. Gardner (1992) noted that Schroeder
