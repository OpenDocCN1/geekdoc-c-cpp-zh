  \n### 使用 printf() 和 fprintf() 进行格式化输出\n\n到为止，输出函数只显示了字符和字符串。那么数字呢？要显示数字，你必须使用 C\
  \ 标准语言库的格式化输出函数 `printf()` 和 `fprintf()`。这些函数也可以显示字符串和字符。你在 第 7 节 中正式接触了 `printf()`，并在之后的几乎每一节中都使用了它。本节提供了剩余的细节。\n\
  \n`printf()` 和 `fprintf()` 这两个函数是相同的，但 `printf()` 始终将输出发送到 `stdout`，而 `fprintf()`\
  \ 指定输出流。`fprintf()` 通常用于输出到磁盘文件。它在 第 17 节 中有所介绍。\n\n`printf()` 函数接受任意数量的参数，至少有一个。第一个也是唯一必须的参数是格式字符串，它告诉\
  \ `printf()` 如何格式化输出。可选参数是你想显示的变量和表达式的值。看下面这几个简单的例子，在进入细节之前，让你对 `printf()` 有个直观的感受：\n\
  \n![Image](img/squf.jpg) 语句 `printf(\"Hello, world.\");` 在屏幕上显示消息 `Hello, world.`。这是一个使用\
  \ `printf()` 仅带一个参数（即格式字符串）的例子。在这种情况下，格式字符串只包含一个用于在屏幕上显示的字面量字符串。\n\n![Image](img/squf.jpg)\
  \ 语句 `printf(\"%d\", i);` 在屏幕上显示整数变量 `i` 的值。格式字符串只包含格式指定符 `%d`，它告诉 `printf()` 显示一个十进制整数。第二个参数\
  \ `i` 是要显示值的变量名。\n\n![Image](img/squf.jpg) 语句 `printf(\"%d plus %d equals %d.\"\
  , a, b, a+b);` 在屏幕上显示 `2 plus 3 equals 5`（假设 `a` 和 `b` 是值分别为 `2` 和 `3` 的整数变量）。这种对\
  \ `printf()` 使用包含四个参数：一个包含字面量文本和格式指定符的格式字符串，以及两个变量和一个要显示值的表达式。\n\n现在让我们更详细地查看 `printf()`\
  \ 格式字符串。它可能包含以下内容：\n\n![Image](img/squf.jpg) 零、一个或多个转换命令，它们告诉 `printf()` 如何显示其参数列表中的值。一个转换命令由\
  \ `%` 后跟一个或多个字符组成。\n\n![Image](img/squf.jpg) 不属于转换命令的字符，按原样显示。\n\n第三个例子的格式字符串是 `%d\
  \ plus %d equals %d`。在这种情况下，三个 `%d` 是转换命令，字符串的其余部分（包括空格）是直接显示的字面字符。\n\n现在你可以拆解转换命令了。命令的组件在这里给出并在后文中进行解释。括号中的组件是可选的。\n\
  \n点击此处查看代码图像\n\n`%[flag][field_width][.[precision]][l] conversion_char`\n\n`conversion_char`\
  \ 是转换命令中唯一必须的部分（`%` 除外）。表 14.5 列出了转换字符及其含义。\n\n![Image](img/14tab05.jpg)\n\n**表\
  \ 14.5** `printf()` 和 `fprintf()` 的转换字符\n\n你可以将 `l` 修饰符放在转换字符正之前。当 `l` 修饰符应用于转换字符\
  \ `o`, `u`, `X`, `i`, `d`, `b`, `E`, `f`, `g` 或 `G` 时，它指定参数为 `long` 类型而不是 `int`\
  \ 类型。当 `ll` 修饰符应用于转换字符时，它指定参数为 `long long`。\n\n精度指定符由小数点 `.` 本身或后跟一个数字组成。精度指定符仅应用于\
  \ `e`, `E`, `f`, `g` 或 `s`，它指定小数点右侧的位数。\n\n字段宽度指定符决定输出的最小字符数。该指定符可以是：\n\n![Image](img/squf.jpg)\
  \ 不以 0 开头的十进制。输出用空格填充。\n\n![Image](img/squf.jpg) 以 0 开头的十进制。输出用零填充。\n\n![Image](img/squf.jpg)\
  \ `*` 字符。下一个参数（必须是 `int`）被用作字段宽度。例如，如果 `w` 是值为 `10` 的 `int`，语句 `printf(\"%*d\",\
  \ w);` 将打印宽度为 `10` 的 `a`。\n\n如果没有指定字段宽度，或者指定的宽度小于输出，输出将按需要宽度。\n\n`printf()` 格式字符串的最后部分是标志，它紧跟在\
  \ `%` 字符后面。有四种标志：\n\n![Image](img/353.jpg)\n\n当你使用 `printf()` 时，格式字符串可以是双引号内的字面量。它也可以是存储在内存中的空终止字符串，在这种情况下向\
  \ `printf()` 传递指针。例如，此语句\n\n点击此处查看代码图像\n\n`char *fmt = \"The answer is %f.\";`\n\
  `printf(fmt, x);`\n\n等于此语句\n\n点击此处查看代码图像\n\n`printf(\"The answer is %f.\", x);`\n\
