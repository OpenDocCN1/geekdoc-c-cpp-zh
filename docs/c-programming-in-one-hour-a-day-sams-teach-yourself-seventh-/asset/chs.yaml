  \ C 源代码文件中搜索字符串 `\"printf()\"`，程序应该列出所有调用 `printf()` 函数的行。\n\n## 10. 列表 18.13 展示了一个从\
  \ `stdin` 输入整数的函数。编写一个函数 `get_float()`，从 `stdin` 输入一个浮点值。\n\n# 课程 19. 从函数中获取更多功能\n\
  \n如你现在所知，函数是 C 语言的核心。在本章中，你将学习更多在程序中使用函数的方法，包括：\n\n*   将指针作为参数传递给函数\n*   将 `void`\
  \ 类型指针作为参数传递\n*   使用可变参数的函数\n*   从函数返回指针\n\n这些主题中的一些在书中之前提到过，但本节提供了更详细的信息。\n\n###\
  \ 将指针传递给函数\n\n向函数传递参数的默认方法是按值传递。*按值传递*意味着函数接收的是参数值的副本。这种方法有三个步骤：\n\n1. 对参数表达式求值。\n\
  2. 将结果复制到 `stack`（栈），这是内存中的一个临时存储区域。\n3. 函数从 `stack` 中检索参数值。\n\n要点是，如果传递变量作为参数，函数中的代码无法修改该变量的值。图\
  \ 19.1 插图了按值传递参数。在这种情况下，参数是一个简单类型 `int` 变量，但对于其他变量类型和更复杂的表达式，原理相同。\n\n**图 19.1**\
  \ 按值传递参数。函数无法修改原始参数变量。\n\n当变量按值传递给函数时，函数可以访问变量的值，但无法访问变量的原始副本。因此，函数中的代码无法修改原始变量。这就是按值传递成为参数传递默认方法的主要原因：函数外部的数据受到了防止意外修改的。\n\
  \n还有另一种向函数传递参数的方法。对于基本数据类型（`char`、`short`、`int`、`long`、`long long`、`float`、`double`\
  \ 和 `long double`）和结构，可以按值传递。另一种方法是传递变量的指针而不是变量本身。这种传递参数的方法被称为*引用传递*。由于函数拥有实际变量的地址，因此它可以修改变量的值。\n\
  \n正如你在课程 9 中所学习到的，“理解指针”，引用传递是将数组传递给函数的唯一方法；按值传递数组是不可能的。然而，对于其他数据类型，你可以使用任一种方法。如果你的程序使用大型结构体，按值传递可能会导致程序耗尽栈空间。除了这个考虑外，按引用传递代替按值传递既有优势也有劣势：\n\
  \n引用传递的优势是函数可以修改参数变量的值。\n\n引用传递的劣势是函数可以修改参数变量的值。\n\n“什么？”你可能会，“既是优势又是劣势？”是的。这完全取决于具体情况。如果你的程序要求函数修改参数变量，那么引用传递是一个优势。如果没有这种需求，那么由于存在意外修改的可能性，它就是一个劣势。\n\
  \n你可能在奇怪为什么不使用函数的返回值来修改参数变量。你当然可以这样做，如下例所示：\n\n```c\nx = half(x);\n\nfloat half(float\
  \ y)\n{\n    return y/2;\n}\n```\n\n但请记住，函数只能返回一个值。通过按引用传递一个或多个参数，你使函数能够向调用程序“返回”多个值。图\
  \ 19.2 插图了单个参数的引用传递。\n\n**图 19.2** 引用传递允许函数修改原始参数变量。\n\n\n\n\n\n此程序演示了按值传递和按引用传递变量的区别。第\
  \ 5 行和第 6 行包含了程序中调用的两个函数的原型。在第 5 行中，注意 `by_value()` 函数接收三个 `int` 类型的参数。相比之下，第 6\
  \ 行定义的 `_by_ref()` 接收三个指向 `int` 类型变量的指针作为参数。第 26 行和第 33 行中这两个函数的函数头与原型的格式相同。这两个函数的函数体相似，但并不完全相同。两个函数都向传递给它们的三个变量赋值为\
  \ `0`。在 `by_value()` 函数中，`0` 直接赋值给变量。在 `by_ref()` 函数中，使用了指针，因此在赋值之前必须对指针进行解引用。\n\
  \n每个函数都由 `main()` 调用一次。首先，在第 10 行为要传递的三个变量分配了除 `0` 以外的值。第 12 行将这些值打印到屏幕上。第 15 行调用两个函数中的第一个函数\
  \ `by_value()`。第 17 行再次打印这三个变量。注意它们没有发生变化。`by_value()` 函数按值接收变量，因此无法改变它们的原始内容。第\
  \ 20 行调用 `by_ref()`，第 22 行再次打印这些值。这一次，所有值都变为了 `0`。按引用传递变量让 `by_ref()` 能够访问变量的实际内容。\n\
  \n你可以编写一个函数，其中某些参数按引用接收，另一些则按值接收。只需记住在函数内部分清它们，使用间接运算符（`*`）对按引用传递的参数进行解引用。\n\n***\n\
  \n### Do\n\n- 如果你不想改变原始值，**请**按值传递变量。\n- **请记住**使用间接运算符对传递给函数的引用变量进行解引用。\n\n***\n\
  \n### Don’t\n\n- **不要**必要按值传递大量数据，可能会耗尽栈空间。\n- **不要**忘记按引用传递的变量应该是一个指针。\n\n***\n\
  \n### void 指针类型（Type void Pointers）\n\n你可能已经在函数声明中使用过 `void` 关键字，用于指定函数不接受参数或没有返回值。你也可以使用\
  \ `void`\n\n关键字创建一个通用指针——一个可以指向任何类型数据对象的指针。例如，语句\n\n```c\nvoid *ptr;\n```\n\n这将\
  \ `ptr` 声明为通用指针。`ptr` 指向某些内容，你还没有指定具体是什么。\n\n`void` 类型指针最常见的用途是声明函数参数。你可能想创建一个可以处理不同类型参数的函数。你可以一次向它传递一个\
  \ `int` 类型，下一次传递一个 `float` 类型，依此类推。通过声明函数接收一个 `void` 指针作为参数，你就不再限制它只接受单一数据类型。如果你声明函数接收\
  \ `void` 指针作为参数，你就可以向函数传递任何东西的指针。\n\n这是一个简单的示例：你想写一个函数，接受一个数值变量作为参数并将其除以 2，将结果返回到参数变量。因此，如果变量\
  \ `val` 存储值为 4，在调用 `half(val)` 后，变量 `val` 等于 2。因为你想修改参数，所以你按引用传递它。因为你想对 C 语言的任何数值数据类型使用该函数，所以你声明函数接收一个\
  \ `void` 指针：\n\n```c\nvoid half(void *val);\n```\n\n现在你可以调用该函数，传递任何指针作为参数。然而，你还需要另外一点。虽然你可以在不知道\
  \ `void` 指针指向什么数据类型的情况下传递它，但你不能对指针进行解引用。在函数代码对指针执行任何操作之前，它必须知道数据类型。你通过类型转换（typecast）来实现这一点，这仅仅是告诉程序将此\
  \ `void` 指针视为指向特定 `type` 的指针。如果 `pval` 是一个 `void` 指针，你对其进行如下转换：\n\n```c\n(type *)pval\n\
  ```\n\n在这里，`type` 是适当的数据类型。要告诉程序 `pval` 是指向 `int` 类型的指针，请编写\n\n```c\n(int *)pval\n\
  ```\n\n解引用指针——即访问 `pval` 所指向的 `int`——编写为\n\n```c\n*(int *)pval\n```\n\n类型转换在第 21\
  \ “处理内存”中有更详细的介绍。回到原始主题（向函数传递 `void` 指针），你可以看到要使用该指针，函数必须知道它所指向的数据类型。在你编写的这个将参数除以\
  \ 2 的函数中，有四种可能的类型将被使用：`int`、`long`、`float` 和 `double`。除了向要除以 2 的变量传递 `void` 指针外，你必须告诉函数\
  \ `void` 指针指向这四种类型中的哪一种。你可以如下修改函数定义：\n\n```c\nvoid half(void *pval, char type);\n\
  ```\n\n根据参数 `type`，函数将 `void` 指针 `pval` 转换为相应的类型。然后就可以解引用指针并使用指向变量的值。`half()` 函数的最终版本显示在列表\
  \ 19.2 中。\n\n#### 列表 19.2：typecast.c - 使用 void 指针向函数传递数据类型\n\n```c\n#include <stdio.h>\n\
  void half(void *pval, char type);\n\nint main() {\n    // 初始化每个类型。\n    int i =\
  \ 20;\n    long l = 1000;\n    float f = 2.456;\n    double d = 123.0444;\n\n  \
  \  // 显示它们的初始值。\n    printf(\"%d\", i);\n    printf(\"%ld\", l);\n    printf(\"\
  %f\", f);\n    printf(\"%lf\\n\", d);\n\n    // 为每个变量调用 half().\n    half(&i, 'i');\n\
  \    half(&l, 'l');\n    half(&d, 'd');\n    half(&f, 'f');\n\n    // 显示它们的新值。\n\
  \    printf(\"%d\", i);\n    printf(\"%ld\", l);\n    printf(\"%f\", f);\n    printf(\"\
  %lf\\n\", d);\n    return(0);\n}\n\nvoid half(void *pval, char type) {\n    // 根据\
  \ type 的值，将指针\n    // 适当转换并除以 2。\n    switch (type) {\n        case 'i':\n     \
  \       {\n                *((int *)pval /= 2;\n                break;\n       \
  \     }\n        case 'l':\n            {\n                *((long *)pval /= 2;\n\
  \                break;\n            }\n        case 'f':\n            {\n     \
  \           *((float *)pval /= 2;\n                break;\n            }\n     \
  \   case 'd':\n            {\n                *((double *)pval /= 2;\n         \
  \       break;\n            }\n    }\n}\n```\n\n\n\n\n你可能认为，传递指向变量的类型会降低函数的灵活性。如果函数不需要知道所指向的数据对象的类型，它将更具通用性，但并不是\
  \ C 语言的工作方式。在解引用 `void` 指针之前，你必须将其强制转换为特定类型。通过这种方法，你只需要编写一个函数。如果你不使用 `void` 指针，则需要编写四个独立的函数——每种数据类型一个。\n\
  \n***\n\n## 做法 (Do)\n\n**务必**在使用 `void` 指针所指向的值时，对其进行强制类型转换。\n\n***\n\n## 不要 (Don’t)\n\
  \n**不要**尝试对 `void` 指针进行加减操作。\n\n***\n\n### 使用具有变数量参数的函数\n\n你已经使用过几个库函数，例如 `printf()`\
  \ 和 `scanf()`，它们接受变数量的参数。你可以编写自己的接受变参数列表的函数。带有变长参数列表函数的程序必须包含头文件 `stdarg.h`。\n\n\
  当你声明一个接受变参数列表的函数时，首先列出固定参数——即始终存在的参数。（必须至少有一个固定参数。）然后在参数列表的末尾包含一个省略号（`...`），表示向函数传递了零或多个额外参数。在讨论期间，请记住参数和参数的区别，正如第\
  \ 5 节“在函数中封装代码”中所解释的。\n\n函数如何知道特定调用中传递了多少个参数？你告诉它。其中一个固定参数告知函数参数的总数。例如，当你使用 `printf()`\
  \ 函数时，格式字符串中转换说明符的数量告诉函数应该期望多少个额外参数。更直接地，函数的固定参数之一可以是额外参数的数量。稍后看到的示例使用了这种方法，但你首先需要查看\
  \ C 语言提供的处理变参数列表的工具。\n\n函数还必须知道变参数列表中每个参数的类型。在 `printf()` 的案例中，转换说明符指示了每个参数的类型。在其他情况下（如下例所示），变参数列表中的所有参数都是相同类型，因此没有问题。要创建一个在变长参数列表中接受不同类型的函数，你必须设计一种传递参数类型信息的方法。例如，你可以使用字符代码，就像在列表\
  \ 19.2 中的 `half()` 函数中所做的那样。\n\n使用变参数列表的工具定义在 `stdarg.h` 中。这些工具在函数内部用于检索变参数列表中的参数。它们如下：\n\
  \n![图像](img/page_517.jpg)\n\n我们已经概述了这些宏如何在函数中使用，并包含了一个示例。当函数被调用时，函数中的代码必须遵循以下步骤来访问其参数：\n\
  \n**1.** 声明一个 `va_list` 类型的指针变量。该指针用于访问各个参数。虽然不是必须，但将此变量命名为 `arg_ptr` 是常见做法。\n\n\
  **2.** 调用宏 `va_start()`，并将指针 `arg_ptr` 以及最后一个固定参数的名字传递给它。宏 `va_start()` 没有返回值；它初始化指针\
  \ `arg_ptr` 指向变列表中的第一个参数。\n\n**3.** 获取每个参数，调用 `va_arg()`，并传递指针 `arg_ptr` 和下一个参数的数据类型。`va_arg()`\
  \ 的返回值是下一个参数的值。如果函数在变参数列表中接收了 `n` 个参数，则调用 `n` 次 `va_arg()` 以按照函数调用列出的顺序检索参数。\n\n\
  **4.** 当变参数列表中的所有参数都被检索后，调用 `va_end()` 并传递指针 `arg_ptr`。在某些实现中，此宏不执行操作，但在另一些实现中，它会执行必要的清理工作。你应该养成调用\
  \ `va_end()` 的习惯，以防使用了需要它的 C 实现。\n\n现在来看该示例：列表 19.3 中的 `average()` 函数计算一个整数列表的算术平均值。该程序向函数传递了一个固定参数，指示额外参数的数量，随后是数字列表。\n\
  \n输入 ![图像](img/down-arrow.jpg)\n\n**列表 19.3** `variableaverage.c`: 使用变长参数列表\n\n\
  点击此处查看代码图像\n\n***\n\n```c\n1:  // variableaverage.c--带有变长参数列表的函数。\n2:\n3:  #include\
  \ <stdio.h>\n4:  #include <stdarg.h>\n5:\n6:  float average(int num, ...);\n7:\n\
  8:  int main( void )\n9:  {\n10:   printf(\"The first average is %.2f\\n\", average(5,\
  \ 1, 2, 3, 4, 5));\n11:   printf(\"The second average is %.2f\\n\", average(5, 10,\
  \ 20, 30, 40));\n12:   return 0;\n13: }\n14:\n15: float average(int num, ...)\n\
  16: {\n17:   va_list arg_ptr;\n18:   int count, total = 0;\n19:   va_start(arg_ptr,\
  \ num);\n20:\n21:   for (count = 0; count < num; count++) {\n22:     total += va_arg(arg_ptr,\
  \ int);\n23:   }\n24:   va_end(arg_ptr);\n25:\n26:   return ((float)total/num);\n\
  27: }\n```\n\n***\n\n输出 ![图像](img/down-arrow.jpg)\n\n点击此处查看代码图像\n\n***\n\nThe first\
  \ average is 3.000000.\n\nThe second average is 20.000000.\n\n***\n\n分析 ![图像](img/down-arrow.jpg)\n\
  \n***\n\n### 返回指针的函数\n\n在之前的章节中，你已经看到了几个来自 C 标准库的返回指针的函数。你可以编写自己的返回指针的函数。正如你预期的那样，间接运算符（`*`）在函数声明和定义中都需要使用。声明的通用形式为\n\
  \n\n\n\n\ntype *func(parameter_list);\n\n该语句声明了一个函数 `func()`，该函数返回一个指向 `type` 的指针。以下是两个具体的示例：\n\
  \n点击此处查看代码图像\n\n```c\ndouble *func1(parameter_list);\n\nstruct address *func2(parameter_list);\n\
  ```\n\n第一行声明了一个返回指向 `double` 类型指针的函数。第二行声明了一个返回指向 `address` 类型指针的函数（你假设 `address`\
  \ 是一个用户定义的结构体）。\n\n不要将返回指针的函数与指向函数的指针混淆。如果你在声明中额外添加一对括号，你声明的就是一个指向函数的指针，如这两个示例所示：\n\
  \n点击此处查看代码图像\n\n```c\ndouble (*func)(...);    // 指返回 double 的函数的指针。\ndouble *func(...);\
  \      // 返回指向 double 指针的函数。\n```\n\n既然你已经掌握了声明格式，那么如何使用返回指针的函数呢？这种函数并没有特别的——你使用它们就像使用任何其他函数一样，将它们的返回值赋值给相应类型的变量（在这种情况下是指针）。由于函数调用是一个\
  \ C 表达式，你可以在任何可以使用该类型指针的地方使用它。\n\n`列表 19.4` 展示了一个简单的示例，该函数接收两个参数并确定哪一个较大。列表显示了实现此目的的两种方法：一个函数返回\
  \ `int`，另一个返回指向 `int` 的指针。\n\n输入 ![Image](img/down-arrow.jpg)\n\n**列表 19.4** pointerreturn.c:\
  \ 从函数返回指针\n\n点击此处查看代码图像\n\n***\n\n```c\n1:  // pointerreturn.c--返回指针的函数。\n2:\n3:\
  \  #include <stdio.h>\n4:\n5:  int larger1(int x, int y);\n6:  int *larger2(int\
  \ *x, int *y);\n7:\n8:  int main( void )\n9:  {\n10:     int a, b, bigger1, *bigger2;\n\
  11:\n12:     printf(\"Enter two integer values: \");\n13:     scanf(\"%d %d\", &a,\
  \ &b);\n14:\n15:     bigger1 = larger1(a, b);\n16:     printf(\"\\nThe larger value\
  \ is %d.\", bigger1);\n17:     bigger2 = larger2(&a, &b);\n18:     printf(\"\\nThe\
  \ larger value is %d.\\n\", *bigger2);\n19:     return(0);\n20: }\n21:\n22: int\
  \ larger1(int x, int y)\n23: {\n24:     if (y > x)\n25:          return y;\n26:\
  \     return x;\n27: }\n28:\n29: int *larger2(int *x, int *y)\n30: {\n31:     if\
  \ (*y > *x)\n32:          return y;\n33:\n34:     return x;\n35: }\n```\n\n***\n\
  \n输出 ![Image](img/down-arrow.jpg)\n\n点击此处查看代码图像\n\n***\n\n输入两个整数值: 1111 3000\n\n\
  较大的值是 3000。\n较大的值是 3000。\n\n***\n\n分析 ![Image](img/down-arrow.jpg)\n\n***\n\n这是一个相对容易理解的程序。第\
  \ 5 行和第 6 行包含两个函数的原型。第一个 `larger1()` 接收两个 `int` 变量并返回一个 `int`。第二个 `larger2()` 接收两个指向\
  \ `int` 变量的指针并返回一个指向 `int` 的指针。第 8–20 行的 `main()` 函数非常直接。第 10 行声明了四个变量。`a` 和 `b`\
  \ 保存要比较的两个变量。`bigger1` 和 `bigger2` 分别存储 `larger1()` 和 `larger2()` 函数的返回值。注意 `bigger2`\
  \ 是指向 `int` 的指针，而 `bigger1` 仅仅是一个 `int`。\n\n第 15 行用两个 `int` 值 `a` 和 `b` 调用了 `larger1()`。函数的返回值被赋值给\
  \ `bigger1`。第 17 行用 `a` 和 `b` 的地址调用了 `larger2()`。函数的返回值被赋值给 `bigger2`。\n\n### 总结\n\
  \n在本章中，你学习了如何声明返回指针的函数。你学习了按值传递和按引用传递参数的区别。你还看到了 `void` 指针如何指向任何数据类型。最后，你还学会了如何使用\
  \ `stdarg.h` 中的宏来编写具有可变参数的函数，这提供了极大的灵活性。\n\n### 问答\n\n**Q 传递指针是常见做法吗？**\n\n**A**\
  \ 绝对是！很多情况下，函数需要修改变量，这可以通过两种方法实现。第一种是使用全局变量；第二种是传递指针给函数。只有当几乎每个函数都使用它时，才建议使用第一方案。\n\
