  \\nFloor: %lf\", floor(x));\n16:     if ( x >= 0 )\n17:         printf(\"\\nSquare\
  \ root: %lf\", sqrt(x));\n18:     else\n19:         printf(\"\\nNegative \");\n\
  20:     printf(\"\\nCosine: %lf\", cos(x));\n21:     printf(\"Enter a whole number:\
