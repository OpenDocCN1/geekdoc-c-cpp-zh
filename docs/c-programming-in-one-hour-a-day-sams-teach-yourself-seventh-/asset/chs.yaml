  ?~\");\n```\n\n### 总结\n\n在本节课程完成后，你已经准备好编写自己的 C 程序了。通过结合 `printf()`、`puts()` 和 `scanf()`\
  \ 函数以及你在前面的课程中学习的程序控制语句，你已经拥有了编写简单程序所需的工具。\n\n屏幕显示通过 `printf()` 和 `puts()` 函数实现。`puts()`\
  \ 函数只能显示文本消息，而 `printf()` 可以显示文本消息和变量。这两个函数都使用转义序列处理特殊字符和打印控制。\n\n`scanf()` 函数从键盘读取一个或多个数值，并根据转换说明符解释每个值。每个值都会被赋值给一个程序变量。\n\
  \n在本节课程的结束时，你学习了三元序列。你学习了三元序列是转换为字符等效值特殊代码。\n\n### 问答\n\n**问 如果 `printf()` 能完成 `puts()`\
  \ 能做的一切以及更多，为什么我应该使用 `puts()` 呢？**\n\n**答** 因为 `printf()` 做的更多，它有额外的开销。当你尝试编写一个小型、高效的程序，或者当你的程序变大且资源宝贵时，你应该利用\
  \ `puts()` 较小的开销。通常情况下，你应该使用可用的最简单资源。\n\n**问 当我使用 `printf()`、`puts()` 或 `scanf()`\
  \ 时，为什么我需要包含 `stdio.h`？**\n\n**答** `stdio.h` 包含了标准输入输出函数的原型声明。`printf()`、`puts()`\
  \ 和 `scanf()` 是这些标准函数中的三个。尝试运行一个不带 `stdio.h` 头文件的程序，看看错误和警告。\n\n**问 如果我在 `scanf()`\
  \ 变量上漏掉了取地址运算符 `&` 会发生什么？**\n\n**答** 这是一个很容易犯的错误。如果你忘记了取地址运算符，可能会发生不可预测的结果。当你阅读第\
