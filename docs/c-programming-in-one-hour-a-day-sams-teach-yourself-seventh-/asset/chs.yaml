  Indianapolis, IN 46290 USA\n\n## 读者服务\n\n访问我们的网站并在 [informit.com/register](http://informit.com/register)\
  \ 注册本书，以便方便地获取本书可能提供的任何更新、下载或错误说明。\n\n## 引言\n\n正如标题所暗示的那样，这本书的设计目的是让你通过 22 节每节一小时的课程自学\
  \ C 语言。尽管面临 C++、Java 和 C# 等语言的激烈竞争，但 C 仍然是初学者编程的首选语言。正如第 1 节中“C 入门”详细说明的原因所示，选择\
  \ C 作为你的编程语言绝出错。\n\n你选择这本书作为学习 C 语言的工具是一个明智的决定。虽然有很多关于 C 语言的书，但本书以最符合逻辑且最易学习的顺序介绍了\
  \ C。前六个版本一直位列畅销榜，事实表明读者们是认同的！本书的设计是让你每天顺序完成课程。你不需要任何之前的编程经验；虽然其他语言（如 BASIC）的经验可能会帮助你学得更快。此外，本书对你的计算机或编译器不作任何假设；本书专注于教授\
  \ C 语言，无论你使用的是 PC、Mac 还是 UNIX 系统。\n\n### 本书的特殊之处\n\n本书包含了一些特殊之处，帮助你走通 C 的启蒙之路。语法框向你展示如何使用特定的\
  \ C 概念。每个框都提供了具体的示例以及对 C 命令或概念的完整解释。要感受语法框的风格，请看以下示例。（不要尝试理解这些内容；你甚至还没到第 1 节！）\n\
  \n### 语法\n\n点击此处查看代码图像\n\n```c\n#include <stdio.h>\n\nprintf( format-string[,arguments,...]);\n\
  ```\n\n`printf()` 是接受系列参数的函数，每个参数对应给定格式字符串中的转换说明符。它将格式化后的信息打印到标准输出设备（通常是显示屏）。使用\
  \ `printf()` 时，你需要包含标准输入输出头文件 `stdio.h`。\n\n`format-string` 是必须的；但参数是可选的。对于每个参数，必须有一个转换说明符。格式字符串还可以包含转义序列。以下是\
  \ `printf()` 的调用示例及其输出。\n\n**示例 1**\n\n点击此处查看代码图像\n\n```c\n#include <stdio.h>\n\n\
  int main( void )\n{\n    printf( \"This is an example of something printed!\");\n\
  }\n```\n\n**示例 1 输出**\n\n点击此处查看代码图像\n\nThis is an example of something printed!\n\
  \n**示例 2**\n\n点击此处查看代码图像\n\n```c\nprintf( \"This prints a character, %c\\na number,\
  \ %d\\na floating point,\n%f\", 'z', 123, 456.789 );\n```\n\n**示例 2 输出**\n\nThis\
  \ prints a character, z\na number, 123\na floating point, 456.789\n\n* * *\n\n本书的另一个特征是\
  \ DO/DON’T（要做/不要）框，它们为你提供了做什么和不做什么的提示。\n\n* * *\n\n做\n\n**做** 阅读本节的剩余部分。它解释了出现在每节末尾的工作坊（Workshop）部分。\n\
  \n* * *\n\n不要\n\n**不要** 跳过任何测验题或练习题。如果你能完成本节的工作坊，就可以开始学习新内容了。\n\n* * *\n\n你还会遇到\
  \ Tip（提示）、Note（备注）和 Caution（注意）框。Tip 提供了处理 C 的有用快捷方法和技巧。Note 提供了增强 C 概念解释的特殊细节。Caution\
  \ 帮助你避免潜在问题。\n\n大量的示例程序说明了 C 的特性和概念，以便你将其应用到自己的程序中。每个程序的讨论都分为三个部分：程序本身、所需的输入及其生成的输出，以及对程序如何运行的逐行分析。这些部分由特殊图标指示。\n\
  \n每节课都以一个问答（Q&A）部分结束，其中包含与该节材料相关的常见问题解答。每节末尾还有一个工作坊。它包含测验题和练习题。测验测试你对该节介绍的概念的掌握情况。如果你想检查答案，或者你遇到了瓶颈，答案可以在附录\
  \ D 中找到。\n\n仅仅通过读这本书是学不会 C 的。漏洞（bug）是 C 程序中的错误。如果你遇到困难，这些答案可以在附录 D 中找到。\n\n### 书中约定\n\
  \n本书使用不同的字体帮助你区分 C 代码和普通英语。实际 C 代码以 `monospace`（等宽字体）显示。在程序的输入输出示例中，用户输入的内容加粗显示。占位符——代表你实际输入的术语——以斜体显示。新或重要的术语以*斜体*显示。\n\
  \n# 第一部分：C 基础\n\n## 第 1 节 C 入门\n\n欢迎学习《每天小时自学 C 语言》！这节课将开启你成为精通 C 程序员的导师，你将学习：\n\
  \n![图像](img/squf.jpg) 为什么 C 是编程语言的极佳选择\n![图像](img/squf.jpg) 程序开发周期中的步骤\n![图像](img/squf.jpg)\
  \ 如何编写、编译和运行你的第一个 C 程序\n![图像](img/squf.jpg) 编译器和链接器生成的错误信息\n\n### C 语言的简史\n\n你可能好奇\
  \ C 语言的起源以及它的名字是怎么来的。C 语言是由 Dennis Ritchie 于 1972 年在贝尔实验室创建的。该语言的创建有一个特定目的：设计 UNIX\
  \ 操作系统（用于许多计算机）。从一开始开始，C 的初衷就是实用的——让忙碌的程序员能够完成工作。\n\n由于 C 是一种强大且灵活的语言，它的使用迅速扩展到了贝尔实验室之外。各地的程序员开始用它编写各种程序。很快，不同的机构开始使用自己的\
  \ C 版本，实现之间的细微差异开始让程序员感到头疼。为了解决这个问题，美国国家标准协会（ANSI）于 1983 年成立了一个委员会来建立 C 的标准定义，被称为\
  \ ANSI 标准 C。除少数例外外，每个现代 C 编译器都有能力遵循这一标准。\n\n* * *\n\n备注\n\n尽管 C 很少变化，但最近的更改发生在 2011\
  \ 年的 ANSI C11 标准。该标准为该语言增加了一些本书涵盖的新功能。然而，旧的编译器可能不支持这些最新的标准。\n\n* * *\n\n现在，名字呢？C\
  \ 语言之所以这样命名，是因为它的前身被称为 B。B 语言是由贝尔实验室的 Ken Thompson 开发的。你可以猜它为什么叫 B。\n\n### 为什么要使用\
  \ C？\n\n\n\n\n\n在当今的计算机编程世界中，你可以选择许多高级语言，例如 C、Perl、BASIC、Java、PHP 和 C#。这些都是适用于大多数编程任务的优秀语言。尽管如此，仍有几个原因让许多计算机专业人士认为\
  \ C 处于列表的首位：\n\n![Image](img/squf.jpg) C 是一种强大且灵活的语言。你用 C 能实现的内容仅限于你的想象力。这种语言不对你施加任何限制。C\
  \ 被用于各种项目，如操作系统、文字处理器、图形处理、电子表格，甚至是其他语言的编译器。\n\n![Image](img/squf.jpg) C 是一种深受专业程序员欢迎的流行语言。因此，有各种\
  \ C 编译器和实用的辅助工具。\n\n![Image](img/squf.jpg) C 是一种可移植的语言。`Portable` 意味着为一种计算机系统（例如\
  \ IBM PC）编写的 C 程序可以在另一个系统上编译并运行（也许是 DEC VAX 系统），而无需或仅需少量修改。此外，使用 Microsoft Windows\
  \ 操作系统编写的程序可以移动到运行 Linux 的机器上，而无需或仅需少量修改。C ANSI 标准（C 编译器的规则集）增强了可移植性。\n\n![Image](img/squf.jpg)\
  \ C 是一种语言简洁的语言，只包含少数术语，称为 `keywords`（关键字），它们构成了该语言功能的基础。你可能认为拥有更多关键字（有时称为 `reserved\
  \ words`）的语言会更强大。事实并非如此。当你用 C 编程时，你会发现它可以被用来完成任何任务。\n\n![Image](img/squf.jpg) C\
  \ 是模块化的。C 代码可以（也应该）写在称为 `functions`（函数）的程序。这些函数可以在其他应用程序或程序中重用。通过向函数传递信息，你可以创建有用且可重代码。\n\
  \n正如这些特性所示，C 是你学习第一门编程语言的绝选择。C++ 呢？你可能听过 C++ 以及名为 `object-oriented programming`\
  \ 的编程技术。你可能好奇 C 和 C++ 之间有什么差异，以及你是否应该自学 C++ 而不是 C。\n\n别担心！C++ 是 C 的超集，这意味着 C++ 包含了\
  \ C 的所有内容，并增加了用于面向对象编程的新特性。如果你继续学习 C++，你对 C 学到的几乎所有内容仍然适用于 C++ 超集。在学习 C 的过程中，你不仅在学习今天最强大、流行的编程语言之一，还在为面向对象编程做准备。\n\
  \n另一种备受关注的语言是 Java。Java 像 C++ 一样基于 C。如果你以后决定学习 Java，你会发现从 C 中中学到的几乎所有内容都可以应用。\n\n\
  这些语言中最最新的是 C#（读作“See-Sharp”）。像 C++ 和 Java 一样，C# 是一种源自 C 的面向对象语言。再次，你会发现从 C 中中学到的很多内容直接适用于\
  \ C# 编程。\n\n***\n\n### Note\n\n许多后学习 C 的人选择学习 C++、Java 或 C#。先学习 C 会让增加额外语言变得容易得多。\n\
  \n***\n\n### 准备编程\n\n在解决问题时，你应该采取某些步骤。首先，你必须定义问题。如果你不知道问题是什么，你就找不到解决方案！当你知道问题是什么时，你就可以制定一个计划来修复它。当你有了计划，通常就可以实施它。计划实施后，你必须测试结果以查看问题是否已解决。你可以将同样的逻辑应用于许多其他领域，包括编程。\n\
  \n在 C 中创建程序（或者说用任何语言编写计算机程序）时，你应该遵循类似的步骤序列：\n\n1. 确定程序的目标。\n2. 确定你想在编写程序时使用的方法。\n\
  3. 创建程序来解决问题。\n4. 运行程序查看结果。\n\n目标的一个示例（见第 1 步）可能是编写文字处理器或数据库程序。更简单的目标是在屏幕上显示你的名字。如果你没有目标，你就不会在写程序，所以你已经完成了第一步。\n\
  \n第二步是确定你想用来编写程序的方法。你需要计算机程序来解决问题吗？你应该跟踪哪些信息？应该使用哪些公式？在这一步中，你应该尝试确定你需要知道什么，以及按什么顺序实施解决方案。\n\
  \n例如，假设有人要求你写一个程序来确定圆内部的面积。第 1 步完成了，因为你知道你的目标：确定圆内面积。第 2 步是确定确定面积需要知道什么。在这个例子中，假设程序用户将提供圆的半径。得知这一点，你可以应用公式\
  \ `πr²` 来获得答案。现在你有了所需的要素，可以继续执行第 3 步和第 4 步，这被称为程序开发周期。\n\n### 程序开发周期\n\n程序开发周期有自己的步骤。在第一步中，你使用编辑器创建一个包含你源代码的磁盘文件。在第二步中，你编译源代码创建一个对象文件。在第三步中，你将编译后的代码链接创建一个可执行文件。第四步是运行程序以查看它是否按原计划工作。\n\
  \n#### 创建源代码\n\n`Source code`（源代码）是一系列用于指示计算机执行所需任务的语句或命令。如前提到的，程序开发周期的第一步是在编辑器中输入源代码。例如，这里有一行源代码：\n\
  \n```c\nprintf(\"Hello, Mom!\");\n```\n\n这条语句指示计算机在屏幕显示 `Hello, Mom!`。（现在不用担心这条语句是如何工作的。）\n\
  \n##### 使用编辑器\n\n大多数 C 编程是在集成开发环境（IDE）中进行的，它允许你在环境中输入程序并编译程序，以及调试和构建应用程序。（这些概念你以后会接触。）你不必使用内置编辑器，但它可能是最合理的。然而，大多数计算机系统都包含可以作为编辑器的程序。如果你使用\
  \ Linux 或 UNIX 系统，可以使用 `ed`、`ex`、`edit`、`emacs` 或 `vi` 等编辑器。如果你使用 Microsoft Windows，则\
  \ `Notepad` 或 `WordPad` 可用。\n\n大多数文字处理器使用特殊代码来格式化文档。这些代码无法被其他程序正确读取。美国信息交换标准（ASCII）规定了一种几乎任何程序（包括\
  \ C）都可以使用的标准文本格式。许多文字处理器（如 WordPerfect、Microsoft Word、WordPad 和 WordStar）可以以 ASCII\
  \ 格式保存源文件（作为文本文件而非文档）。当你想要将文字处理的文件保存为 ASCII 文件时，在保存时选择 ASCII 或文本选项。\n\n\n\n\n虽然你可能能理解\
  \ C 源代码（至少在读完这本书后你就能了），但你的计算机不能。计算机需要数字的、或称`binary`的`machine language`指令。在你的 C 程序在计算机上运行之前，它必须从源代码翻译成机器语言。这种翻译是程序开发的第二步，由一个名为`compiler`的程序执行。编译器将你的源代码文件作为输入，并生成一个包含与源代码语句对应的机器语言指令的磁盘文件。编译器创建的机器语言指令是\
  \ `object code`，而包含它们的磁盘文件是 `object file`。\n\n### 注意事项\n\n本书涵盖了 ANSI 标准 C。这意味着你使用哪种\
  \ C 编译器并不重要，只要它遵循 ANSI 标准即可。并不是所有的编译器都支持这些标准。当前 C 标准的特定名称为 `ISO/IEC 9899:2011`。与其使用这个复杂的名称，本书将该标准称为\
  \ `C11`。\n\n使用你的图形化 IDE，编译变得非常简单。在大多数图形环境中，你可以通过选择编译图标或从菜单中选择某项来编译程序列表。代码编译完成后，选择运行图标或从菜单中选择项目即可执行程序。你应该检查编译器的手册，获取有关编译和运行程序的具体细节。你可以免费下载的\
  \ `Code::Blocks` 程序就是一个图形化开发环境的示例，它拥有大多数操作系统的版本。还有其他图形化开发环境，既有免费也有付费，适用于几乎所有可能的平台。只需选择你喜欢的即可。\n\
  \n编译完成后，你就获得了一个对象文件。如果你查看编译所在目录或文件夹中的文件列表，你应该能找到一个与你的源文件名相同、但扩展名为 `.obj`（而不是 `.c`）的文件。`.obj`\
  \ 扩展被识别为对象文件并由链接器（linker）使用。在 Linux 或 `UNIX` 系统上，编译器创建扩展名为 `.o` 而不是 `.obj` 的对象文件。\n\
  \n### 链接创建可执行文件\n\n在运行程序之前，还需要最后一步。ANSI C 语言定义的一部分是一个函数库，其中包含了预定义函数的 `object code`（已经编译的代码）。`predefined\
  \ function` 包含了已经写好的 C 代码，并以备来即用的形式随你的编译器包一起提供。\n\n在上一个示例中使用的 `printf()` 函数是一个 `library\
  \ function`。这些库函数执行频繁需要的任务，例如在屏幕上显示信息和从磁盘文件中读取数据。如果你的程序使用了这些函数的任何一个（几乎没有程序是不使用至少一个的），那么源代码编译时产生的对象文件必须与来自函数库的对象代码结合，以创建最终的可执行程序。（`Executable`\
  \ 意味着程序可以在你的计算机上运行或执行。）这个过程被称为 `linking`，它由一个名为（你猜对了）`linker`的程序执行。\n\n[图 1.1] 显示了从源代码到对象代码再到可执行程序的演过程。\n\
  \n![Image](img/01fig01.jpg)\n\n**图 1.1** 你编写的 C 源代码由编译器转换为对象代码，然后由链接器转换为可执行文件。\n\
  \n### 完成开发周期\n\n当你的程序被编译并链接创建一个可执行文件时，你可以通过点击运行按钮（如果你仍在 IDE 中）或双击程序图标（就像运行任何其他程序一样）来运行它。如果你运行程序并得到的结果与你的预期不同，你需要回到第一步。你必须识别导致问题的原因并在源代码中进行修正。当你对源代码进行更改时，你需要重新编译并链接程序，以创建一个修正后的可执行文件版本。你不断遵循这个循环，直到程序执行得完全符合你的意图。\n\
  \n关于编译和链接的最后一点说明：虽然编译和链接被认为是两个独立的步骤，但大多数编译器将它们合为一个步骤完成。图形化开发环境通常提供合并或分开进行编译和链接的。无论通过什么方法完成编译和链接，都要理解这两个过程即使通过一个命令完成，也是两个独立的动作。\n\
  \n#### C 开发周期\n\n**步骤 1.** 使用编辑器编辑器编写你的源代码。按照传统，C 源代码文件的扩展名为 `.c`（例如，`myprog.c`、`database.c`\
  \ 等）。\n\n**步骤 2.**** 使用编译器编译程序。如果编译器在程序中没有发现任何错误，它就会生成一个对象文件。编译器生成的对象文件扩展名为 `.obj`\
  \ 或 `.o`，且与源文件同相同。（例如，`myprog.c` 编译为 `myprog.obj` 或 `myprog.o`。）如果编译器发现错误，它会报告这些错误。你必须返回步骤\
  \ 1，在你的源代码中进行修正。\n\n**步骤 3.**** 使用链接器链接程序。如果没有发生错误，链接器将生成一个位于扩展名为 `.exe` 的磁盘文件中的可执行程序，且与对象文件同名。（例如，`myprog.obj`\
  \ 被链接创建为 `myprog.exe`。）\n\n**步骤 4.** 执行程序。你应该测试以确定它是否运行正常。如果不是，重新从步骤 1 开始，对你的源代码进行修改和添加。\n\
  \n[图 1.2] 显示了程序开发的步骤。对于除了简单的程序以外的所有程序，在完成程序之前，你可能会多次经历这个序列。即使是经验最丰富的程序员也无法坐下来只用一步就写出一个完整的、无错误的程序！由于你反复运行编辑-编译-测试循环，你必须熟悉你的工具：编辑器、编译器和链接器。\n\
  \n![Image](img/01fig02.jpg)\n\n**图 1.2** 程序涉及涉及步骤。\n\n### 你的第一个程序\n\n你可能急于尝试你的第一个\
  \ C 程序。为了帮助你熟悉你的编译器，`Listing 1.1` 包含一个供你练习的快速程序。你现在可能无法理解一切，但你应该对编写、编译和运行真实程序的过程有一个感觉。\n\
  \n这个演示使用了名为 `hello.c` 的程序，它的功能仅仅是在屏幕上显示 `Hello, World!` 字样。这个程序是 C 编程的传统入门，非常适合你学习。`hello.c`\
  \ 的源代码在 `Listing 1.1` 中。当你输入此列表时，不要包含左侧的行号。这些数字将在贯书中书中分析你编写的程序。\n\n**LISTING 1.1**\
  \ HELLO.C.\n\n```c\n#include <stdio.h>\n\nint main(void)\n{\n    printf(\"Hello,\
  \ World!\\n\");\n    return 0;\n}\n```\n\n\n\n\n1. 在你的 C 程序将所在的目录中启动编辑器。如前所述，你可以使用任何文本编辑器，但大多数\
  \ C 编译器都带有一个 IDE，它可以让你在一个方便的设置中完成输入、编译和链接程序。请检查你的手册，看看你的编译器是否提供了 IDE。\n\n2. 使用键盘输入\
  \ `hello.c` 源代码，内容要与 列表 1.1 所示完全一致。在每行的末尾按回车键。\n\n***\n\n注意：\n\n不要输入行号或冒号。这些仅供参考。\n\
  \n***\n\n3. 保存源代码。你应该将文件命名为 `hello.c`。\n\n4. 通过列出目录或文件夹中的文件，验证 `hello.c` 是否在磁盘上。你应该在列表中看到\
  \ `hello.c`。\n\n5. 编译并链接 `hello.c`。执行编译器手册指定的相应命令。你应该会收到一条显示没有错误或警告的消息。\n\n6. 检查编译器信息。如果没有收到任何错误或警告，说明一切正常。\n\
  \n如果你在输入程序时犯了错误，编译器会捕获它并显示错误消息。例如，如果你将 `printf` 单词拼错为 `prntf`，你会看到类似下方的消息：\n\n点击此处查看代码图像\n\
  \n`Error: undefined symbols:_prntf in hello.c (hello.OBJ)`\n\n7. 如果显示此或任何其他错误消息，请返回第\
  \ 2 步。在编辑器中打开 `hello.c` 文件。仔细将你的文件内容与 列表 1.1 进行比较，进行任何必要的修正，并继续执行第 3 步。\n\n8. 你的第一个\
  \ C 程序现在应该已经编译并准备好运行。如果你显示所有名为 `hello`（带有任何扩展名）的文件目录列表，你应该看到以下内容：\n\n- `hello.c`，你用编辑器创建的源代码文件\n\
  - `hello.obj` 或 `hello.o`，包含 `hello.c` 的目标代码\n- `hello.exe`，当你编译和链接 `hello.c` 时创建的可执行程序\n\
  \n9. 要想*执行*或运行 `hello.exe`，只需输入 `hello`。屏幕上会显示消息 `Hello, World!`。\n\n恭喜！你刚刚输入、编译并运行了你的第一个\
  \ C 程序。诚然地，`hello.c` 是一个没有做任何用处的简单程序，但这是一个开始。事实上，今天大多数专家 C 程序员都是以这种方式开始学习 C 的——通过编译\
  \ `hello.c`——所以你并不孤单。\n\n### 编译错误\n\n当编译器在源代码中发现它无法编译的内容时，就会发生编译错误。拼写错误、排版错误或其他十几种情况中的任何一种都可能导致编译器卡住。幸运的是，现代编译器不仅仅是卡住；它们还会告诉你它们卡在了什么地方，以及问题在哪里！这使得发现和纠正源代码中的错误变得更容易。\n\
  \n这一点可以通过在你之前输入的 `hello.c` 程序中引入一个蓄意的错误来解释。如果你已经完成了那个示例（你应该这样做的），那么现在你的磁盘上有一份 `hello.c`\
  \ 副本。使用你的编辑器，将光标移动到包含 `printf()` 调用的行尾，并删除末尾的分号。`hello.c` 现在看起来应该像 列表 1.2。\n\n**列表\
  \ 1.2** `hello2.c` - 带有错误的 `hello.c`。\n\n点击此处查看代码图像\n\n***\n\n```\n1:  #include\
  \ <stdio.h>\n2:\n3:  int main(void)\n4:  {\n5:      printf(\"Hello, World!\")\n\
  6:      return 0;\n7:  }\n```\n\n***\n\n接下来，保存文件。现在你准备好编译它了。输入编译命令。由于你引入了错误，编译没有完成。相反，编译器显示了类似下方的消息：\n\
  \n点击此处查看代码图像\n\n`hello.c(6) : Error: ';' expected`\n\n查看这一行，你可以看到它包含三个部分：\n\n![图像](img/16tab01.jpg)\n\
  \n这条消息非常有信息量，它告诉你在 `hello.c` 的第 6 行中编译器期望找到一个分号但并没有找到。然而，你知道分号实际上是从第 5 行省略的，所以存在差异。你面临着一个谜团：为什么编译器在第\
  \ 6 行报告错误，而实际上分号是在第 5 行漏掉的？答案在于 C 语言并不在乎换行符之类的内容。属于 `printf()` 语句后的分号可以放置在下一行。（尽管这样做看起来会很困惑，因此是一种糟糕的编程习惯。）只有在在第\
  \ 6 行遇到下一个命令（`return`）之后，编译器才确定缺少分号。因此，编译器报告错误在第 6 行。\n\n这出了关于 C 编译器和错误消息的一个不可否认的事实。虽然编译器在检测和定位错误方面很聪明，但它并不是爱因斯坦。利用你对\
  \ C 语言的知识，你可以确定任何错误的位置。\n\n***\n\n注意：报告的错误可能取决于编译器。在大多数情况下，错误消息应该让你对问题所在之处有个了解。\n\
  \n***\n\n在离开此主题之前，看另一个编译错误的示例。再次在编辑器中加载 `hello.c` 并进行以下更改：\n\n1. 替换第 5 行末尾的分号。\n\
  2. 删除 `Hello` 单词之前的双引号。\n\n保存文件到磁盘并再次编译。这次，编译器应该显示类似下方的错误消息：\n\n点击此处查看代码图像\n\n`hello.c(5)\
  \ : Error: undefined identifier 'Hello'`\n`hello.c(7) : Lexical error: unterminated\
  \ string`\n`Lexical error: unterminated string`\n`Lexical error: unterminated string`\n\
  `Fatal error: premature end of source file`\n\n第一条错误消息正确找到了错误，将其位于第 5 行的 `Hello`。错误消息\
  \ `undefined identifier` 编译器不知道如何处理单词 `Hello`，因为它不再包含在引号内。然而，报告的其他四个错误是什么？这些错误你现在不需要担心，它们说明了\
  \ C 程序中的单个错误有时会导致多个错误消息。\n\n从这一切中学到的教训是：如果编译器报告了多个错误，而你只能找到一个，尽管修复那个错误并重新编译。你可能会发现你的单一修正就是所需要的，程序将无错误地编译。\n\
  \n链接错误消息\n\n链接错误相对罕见，通常是由于拼错了 C 库函数的名称引起的。在这种情况下，你会得到一个 `Error: undefined symbols:`\
  \ 错误消息，后面跟着拼错误的名称（带有下划线）。当你纠正了拼写后，问题就会消失。\n\n\n\n\n错误是程序开发过程中不可避免的 en。你的 `C` 编译器会检测源代码中的错误并显示错误信息，告知你错误的性质和位置。利用这些信息，你可以编辑源代码来纠正错误。然而，请记住，编译器并不总是能准确地报告错误的性质和位置。有时，你需要根据你对\
  \ `C` 的知识来追踪导致特定错误消息的的确切原因。\n\n### 问答\n\n**问 如果我想给某人一个我编写的程序，我需要给他哪些文件？**\n\n**答**\
  \ `C` 的优点之一是它是一种编译型语言。这意味着在源代码被编译后，你将得到一个可执行程序。这个可执行程序是一个独立的程序。如果你想给所有拥有电脑的朋友发送\
  \ `hello`，这是可以的。你只需要给他们提供可执行程序 `hello.exe` 即可。他们不需要源文件 `hello.c` 或对象文件 `hello.obj`。他们也不需要拥有\
  \ `C` 编译器。你的朋友或你提供可执行文件的人需要使用和你相同类型的机器——例如 PC、Macintosh、Linux 机器。\n\n**问 在创建可执行文件后，我需要保留源文件\
  \ (.c) 或对象文件 (.obj) 吗？**\n\n**答** 如果你删除了源文件，将来将无法对程序进行任何修改，因此你应该保留该文件。对象文件则是另一回事。保留对象的理由有很多，但这超出了你目前的范围。目前，在获得可执行文件后你可以删除对象文件。如果你需要对象文件，可以重新编译源代码。\n\
  \n大多数 IDE 除了源文件（`.c`）、对象文件（`.obj` 或 `.o`）和可执行文件外还会创建文件。只要你保留了源文件（`.c`），你就可以重新创建其他文件。\n\
  \n**问 如果我的编译器带有一个编辑器，我必须使用它吗？**\n\n**答** 绝对不需要。你可以使用任何编辑器，只要它以文本格式保存源代码即可。如果编译器自带编辑器，你应该尝试使用它。如果你更喜欢另一个编辑器，就用那一个。我使用一个单独购买的编辑器，尽管我所有的编译器都有自己的编辑器。编译器自带的编辑器正在变得越来越好。有些可以自动对你的\
  \ `C` 代码进行格式化。另一些会对源代码的不同部分进行着色，以便更容易发现错误。\n\n**问 如果我只有 C++ 编译器而没有 C 编译器，该怎么办？**\n\
  \n**答** 如本节所述，`C++` 是 `C` 的超集。这意味着你可以使用 `C++` 编译器来编译 `C` 程序。\n\n**问 我可以忽略警告消息吗？**\n\
  \n**答** 一些警告消息不影响程序的运行，而另一些会。如果编译器给了你警告消息，它信号表明某些地方不对劲。大多数编译器允许你设置警告级别。通过设置警告级别，你可以只获取最严重的警告，也可以获取所有警告（包括最细微的）。有些编译器甚至提供了中间的各种级别。在你的程序中，你应该查看每个警告并做出判断。最好的方法总是尝试编写完全没有任何警告或错误的所有程序。（如果存在错误，你的编译器将不会创建可执行文件。）\n\
  \n### 工作练习\n\n工作练习提供了测验题来帮助你巩固对所涵盖内容的理解，并提供了练习让你获得使用所学内容的经验。在继续下一节之前，尝试理解测验和练习的答案。答案位于附录\
  \ D 中的“答案”。\n\n#### 测验\n\n**1.** 给出 `C` 成为编程语言最佳选择的三个理由。\n\n**2.** 编译器是做什么的？\n\n\
