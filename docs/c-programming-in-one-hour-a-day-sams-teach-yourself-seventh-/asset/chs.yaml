  \ 也可以实现同样的效果。\n\n### 比较字符串\n\n对字符串进行比较以判断它们是否相等。如果不相等，则一个字符串“大于”或“小于”另一个字符串。“大于”和“小于”的判断是根据字符的\
  \ ASCII 码进行的。对于字母，这等同于字母顺序，但有一个奇怪的例外：所有大写字母都“小于”小写字母。这是因为大写字母 A–Z 的 ASCII 码为 65–90，而小写字母\
  \ a–z 表示为 97–122。因此，通过这些 C 函数进行评估时，`\"ZEBRA\"` 被认为小于 `\"apple\"`。\n\nANSI C 库包含了两种类型字符串比较的函数：比较整个字符串和比较特定数量的字符。\n\
  \n#### 比较整个字符串\n\n`strcmp()` 函数逐字符地比较两个字符串。其原型为\n\n点击此处查看代码图像\n\n```\nint strcmp(const\
  \ char *str1, const char *str2);\n```\n\n参数 `str1` 和 `str2` 是指向待比较字符串的指针。函数的返回值参见表\
  \ 18.1。列表 18.6 展示了 `strcmp()`。它比较两个字符串，\n\n点击此处查看代码图像\n\n`str1` 和 `str2` 是指向待比较字符串的指针。函数的返回值参见表\
  \ 18.1。列表 18.6 展示了 `strcmp()`。它比较两个字符串，\n\n表 18.1 `strcmp()` 返回的值\n\n![Image](img/down-arrow.jpg)\n\
