  \ 更容易地输入）。然而，编写你自己的专门化输入函数通常是值得的。你可以在第 19 节“从函数获取更多信息”中看到一些自定义函数的示例。\n\n#### 做法\n\
  如果你只使用标准输入文件 (`stdin`)，**务必**使用 `gets()` 和 `scanf()` 函数代替 `fgets()` 和 `fscanf()`\
  \ 函数。\n\n#### 不要\n**不要**忘记检查输入流中是否有额外字符。\n\n#### 控制输出到屏幕\n\n屏幕输出函数与输入函数类似，分为三大大类：字符输出、行输出和格式化输出。你在早期的课程中已经接触了其中一些函数。本节将详细介绍它们。\n\
  \n#### 使用 `putchar()`、`putc()` 和 `fputc()` 进行字符输出\n\nC 库的字符输出函数向流发送单个字符。`putchar()`\
  \ 函数将其输出发送到 `stdout`（通常是屏幕）。`fputc()` 和 `putc()` 函数将输出发送到参数列表中指定的流。\n\n##### 使用\
  \ `putchar()` 函数\n\n`putchar` 的原型位于 `stdio.h` 中，如下所示：\n\n```c\nint putchar(int c);\n\
  ```\n\n该函数将存储在 `c` 中的字符写入 `stdout`。虽然原型指定了 `int` 类型的参数，但你传递给 `putchar()` 的是 `char`\
  \ 类型。只要其值适合字符（即在 0 到 255 范围范围内），你也可以给它传递 `int` 类型。该函数返回刚刚写入的字符，如果发生错误，则返回 `EOF`。记住\
  \ `EOF` 等于 `-1`，因此它也可以作为 `int` 函数的返回值。你在列表 14.2 中见过 `putchar()`。列表 14.10 显示了 ASCII\
  \ 值在 32 到 127 之间的字符。\n\n列表 14.10 putchar.c putchar() 函数\n```c\n// putchar.c 展示了\
  \ putchar().\n#include <stdio.h>\nint main() {\n    int count;\n    for (count =\
  \ 32; count < 128; count++) {\n        putchar(count++);\n    }\n    return 0;\n\
  }\n```\n\n你也可以用 `putchar()` 函数显示字符串（如列表 14.11 所示），尽管其他函数更适合此处。\n\n列表 14.11 putchar.c\
  \ 用 putchar 显示字符串\n```c\n/* 使用 putchar 显示字符串。 */\n#include <stdio.h>\n#define MAXSTRING\
  \ 80\nchar message[] = \"Displayed with putchar().\";\nint main() {\n    int count;\n\
  \    for (count = 0; count < MAXSTRING; count++) {\n        /* 寻找字符串结尾。找到时，写入换行符并退出循环。\
  \ */\n        if (message[count] == '\\0') {\n            putchar('\\n');\n    \
  \        break;\n        }\n        else\n            /* 如果未找到结尾，写入下一个字符。 */\n \
  \           putchar(message[count]);\n    }\n    return 0;\n}\n```\n\n##### 使用 `putc()`\
  \ 和 `fputc()` 函数\n\n`putc()` 和 `fputc()` 函数执行相同的操作——向指定的流发送单个字符。`putc()` 是 `fputc()`\
  \ 的宏实现。你将在第 22 节“高级编译器使用”中学习宏。现在，只需坚持使用 `fputc()`。它的原型是\n\n```c\nint fputc(int c,\
  \ FILE *fp);\n```\n\n`FILE *fp` 部分可能会让你困惑。你通过此参数向 `fputc()` 输出流。（你将在第 17 节学习更多。）如果你指定\
  \ `stdout` 为流，`fputc()` 的行为与 `putchar()` 完全相同。\n\n#### 使用 `puts()` 和 `fputs()` 进行字符串输出\n\
  \n你的程序显示字符串比显示单个字符多。库函数 `puts()` 显示字符串。`fputs()` 将字符串发送指定的流；否则，它与 `puts()` 相同。`puts()`\
  \ 的原型是\n\n```c\nint puts(char *cp);\n```\n\n`*cp` 是指向要显示的字符串第一个字符的指针。`puts()` 函数显示包含但不包括终止空字符的整个字符串，并在结尾添加一个换行符。然后\
  \ `puts()` 在成功时返回正值，失败时返回 `EOF`。\n\n\n\n\n你可以使用 `puts()` 函数来显示任何类型的字符串，如 列表 14.12\
