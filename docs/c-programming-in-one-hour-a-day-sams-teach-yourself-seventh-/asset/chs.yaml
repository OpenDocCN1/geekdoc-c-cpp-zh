  \ `buf1` 中的偏移量，该偏移量指向第一个不在 `buf2` 中的字符。第 22–25 行评估了返回值并打印适当的消息。\n\n**Do**\n**DO**\
  \ 忘记 C 是大小敏感的。\n\n**Don’t**\n**DON’T** 忘记 `A` 和 `a` 是不同的。\n\n### 字符串转数字\n\n有时，你需要将数字的字符串表示转换为实际的变量。例如，字符串\
  \ `\"123\"` 可以转换为值为 `123` 的 `int` 类型变量。可以使用四个函数来转换字符串。它们在后面的章节进行了解释，其原型在 `stdlib.h`\
  \ 中。\n\n#### 字符串转整数\n\n库函数 `atoi()` 将字符串转换为整数。它的原型是：\n\n```c\nint atoi(const char\
  \ *ptr);\n```\n\n`atoi()` 函数将 `ptr` 指向的字符串转换为整数。除了数字，字符串还可以包含前导空格以及 `+` 或 `–` 号。转换从字符串开始，直到遇到不可转换字符（例如字母或标点符号）。生成的整数返回给调用程序。如果没有找到可转换字符，`atoi()`\
  \ 返回 `0`。表格 18.2 列出了示例。\n\n![Image](img/18tab02.jpg)\n\n**表格 18.2** 使用 `atoi()`\
  \ 进行字符串转数字\n\n第一个示例是简单而易见的。在第二个示例中，你可能会困惑为什么 `\".6\"` 没有转换。记住这是字符串到整数的转换。浮点部分被丢弃了。\n\
  \n第三个示例也是简单而易见的；函数理解加号并将其视为数字的一部分。第四个示例使用了 `\"twelve\"`。`atoi()` 函数无法翻译单词；它只看到字符。因为字符串没有以数字开头，`atoi()`\
  \ 返回 `0`。最后一个示例也是如此。\n\n#### 字符串转长整数\n\n库函数 `atol()` 工作方式与 `atoi()` 完全一样，只是它返回的是\
  \ `long` 类型。它的原型是：\n\n```c\nlong atol(const char *ptr);\n```\n\n\n\n与 `atoi()` 和\
  \ `atol()` 函数一样，`atoll()` 函数将字符串值转换为 `long long` 值。`atoll()` 函数的原型如下：\n\n```c\n\
  long long atoll(const char *ptr);\n```\n\n### 将字符串转换为浮点数值\n\n`atof()` 函数将字符串转换为\
  \ `double` 类型。其原型为所示：\n\n```c\ndouble atof(const char *str);\n```\n\n参数 `str` 指向要转换的字符串。该字符串可以包含前导空白字符以及\
  \ `+` 或 `–` 字符。数字可以包含数字 0–9、小数点以及指数指示符 `E` 或 `e`。如果没有可转换的字符，`atof()` 返回 `0`。表 18.3\
  \ 列出了使用 `atof()` 的一些示例。\n\n![Image](img/18tab03.jpg)\n\n**表 18.3** 使用 `atof()` 进行字符串到数字的转换\n\
  \n列表 18.12 展示了 `atof()` 的用法。它允许你输入自己的字符串进行转换。\n\n输入 ![Image](img/down-arrow.jpg)\n\
  \n**列表 18.12** stringtodouble.c: 使用 `atof()` 将字符串转换为 `double` 类型数值变量\n\n```c\n1:\
  \  // stringtodouble.c--Demonstration of atof().\n2:\n\n3:  #include <string.h>\n\
  4:  #include <stdio.h>\n5:  #include <stdlib.h>\n6:\n7:  int main( void )\n8:  {\n\
  9:      char buf[80];\n10:     double d;\n11:\n12:     while (1)\n13:     {\n14:\
  \          printf(\"\\nEnter 要转换的字符串（留空行退出):    \");\n15:          gets(buf);\n\
  16:\n17:          if ( strlen(buf) == 0 )\n18:              break;\n19:\n20:   \
  \       d = atof( buf );\n21:\n22:          printf(\"The converted value is %f.\"\
  , d);\n23:     }\n24:     return(0);\n25: }\n```\n\n输出 ![Image](img/down-arrow.jpg)\n\
  \n```\nEnter the string to convert (blank to exit):     1009.12\nThe converted value\
  \ is 1009.120000.\nEnter the string to convert (blank to exit):     abc\nThe converted\
  \ value is 0.000000.\nEnter the string to convert (blank to exit):     3\nThe converted\
  \ value is 3.000000.\nEnter the string to convert (blank to exit):\n```\n\n分析 ![Image](img/down-arrow.jpg)\n\
  \n第 12–23 行的 `while` 循环让程序持续运行，直到你输入空行。第 14 行和第 15 行提示输入值。第 17 行检查是否输入了空行。如果是，程序将跳出\
  \ `while` 循环并结束。第 20 行调用 `atof()`，将输入的值（`buf`）转换为 `double` 类型 `d`。第 22 行打印最终结果。\n\
  \n### 字符测试函数\n\n头文件 `ctype.h` 包含了许多测试字符的函数，这些函数根据字符是否满足特定条件来返回 `TRUE` 或 `FALSE`。例如，它是字母还是数字？`isxxxx()`\
  \ 函数实际上是定义在 `ctype.h` 中的宏。你将在第 22 节 “[高级编译器的使用”中学习关于宏的知识。届时，你可能想查看 `ctype.h` 中的定义以了解它们是如何运作的。现在，你只需要了解它们是如何使用的。\n\
  \n所有的 `isxxxx()` 宏都具有相同的原型：\n\n```c\nint isxxxx(int ch);\n```\n\n在前行中，`ch` 是被测试的字符。如果满足条件，则返回\
  \ `TRUE`（非零），如果不满足则返回 `FALSE`（零）。表 18.4 列出了完整的 `isxxxx()` 宏集合。\n\n![Image](img/18tab04.jpg)\n\
  \n**表 18.4** `isxxxx()` 宏\n\n你可以使用字符测试宏做很多有趣的事情。例如列表 18.13 中的 `get_int()` 函数。该函数从\
  \ `stdin` 输入一个整数并作为 `int` 变量返回。该函数跳过空白字符，如果第一个非空白字符不是数字，则返回 `0`。\n\n输入 ![Image](img/down-arrow.jpg)\n\
  \n**列表 18.13** integer.c: 使用 `isxxxx()` 宏实现输入整数的函数\n\n```c\n1:  //integer.cUsing\
  \ character-test macros to create an integer\n2:  // create an integer input function.\n\
  3:\n4:  #include <stdio.h>\n5:  #include <ctype.h>\n6:\n7:  int get_int(void);\n\
  8:\n9:  int main( void )\n10: {\n11:     int x;\n12:     x = get_int();\n13:   \
  \  printf(\"You entered %d.\\n\", x);\n14:     return 0;\n15: }\n16:\n17: int get_int(void)\n\
  18: {\n19:     int ch, i, sign = 1;\n20:\n21:     // Skip any leading whitespace.\n\
  22:\n23:     while ( isspace(ch = getchar()) );\n24:\n25:     /* If the first character\
  \ is nonnumeric, unget\n26:     the character and return 0. */\n27:\n28:     if\
  \ (ch != '-' && ch != '+' && !isdigit(ch) && ch != EOF)\n29:     {\n30:        \
  \ ungetc(ch, stdin);\n31:         return 0;\n32:     }\n33:\n34:     /* If the first\
  \ character is a minus sign, set\n35:     sign accordingly. */\n36:\n37:     if\
  \ (ch == '-')\n38:         sign = -1;\n39:\n40:     /* If the first character was\
  \ a plus or minus sign,\n41:     get the next character. */\n42:\n43:     if (ch\
  \ == '+' || ch == '-')\n44:         ch = getchar();\n45:\n46:     /* Read characters\
  \ until a nondigit is input. Assign\n47:     values, multiplied by proper power\
  \ of 10, to i. */\n48:\n49:     for (i = 0; isdigit(ch); ch = getchar())\n50:  \
  \       i = 10 * i + (ch - '0');\n51:\n52:     // Make result negative if sign is\
  \ negative.\n53:\n54:     i *= sign;\n55:\n56:     /* If EOF was not encountered,\
  \ a nondigit character\n57:     must have been read in, so unget it. */\n58:\n59:\
  \     if (ch != EOF)\n60:         ungetc(ch, stdin);\n61:\n62:     // Return the\
  \ input value.\n63:     return i;\n64: }\n```\n\n输出 ![Image](img/down-arrow.jpg)\n\
  \n```\n-100\nYou entered -100.\nabc3.145\nYou entered 0.\n9 9 9\nYou entered 9.\n\
  2.5\nYou entered 2.\n```\n\n分析 ![Image](img/down-arrow.jpg)\n\n程序使用了第 32 行和第 62\
  \ 行的库函数 `ungetc()`，你在第 14 节 “与屏幕、打印机和键盘交互”中学习过它。记住，此函数会将字符“退回”到指定的流中。返回的字符是程序下一次从该流读取字符时的第一个输入的字符。这是必要的，因为当\
  \ `get_int()` 函数读取非数字字符时，你希望把它放回去。\n\n\n\n\n函数的核心是第 51 行和 52 行的 `for` 循环，只要获取的字符是数字，它就会继续获取。第\
  \ 52 行起初可能会让人有些困惑。这行代码将输入的单个字符转换为数字。从你的数字中减去字符 `'0'` 可以将字符数字转换为真实的数字（记住 ASCII 值）。当获得正确的数值后，将这些数字乘以\
  \ 10 的适当幂。`for` 循环会一直进行，直到输入了非数字字符。在此时，第 56 行将符号应用于数字，使其完成转换。\n\n在返回之前，程序需要进行一些清理工作。如果最后一个数字不是文件末尾，则需要将其放回（以防在其他地方需要）。第\
  \ 62 行在第 66 行返回之前执行了此操作。\n\n***\n\n### 注意\n尽管这个程序很简单，但它并不用户友好。作为一个额外的编程练习，请尝试修改程序以改进用户界面。\n\
  \n***\n\n### 做到\n**务必**利用可用的字符串函数。\n\n***\n\n### 不要做\n**不要**混淆字符和数字。很容易忘记字符 `\"\
  1\"` 与数字 `1` 并不是一回事。\n\n***\n\n### 大小写的 ANSI 支持\n尽管某些编译器包含了将字符串转换为小写或大写的函数（如 `strlwr()`\
  \ 和 `strupr()`），但它们并不是 ANSI 标准的一部分。然而，ANSI 标准确实定义了两个将信息转换为大写或小写的宏。与 `isxxxx()` 宏一起，还有两个\
  \ ANSI 定义的用于更改字符大小写的宏：`toupper()` 和 `tolower()`。你可以在 Listing 18.14 中看到这些宏的使用。\n\n\
  输入 ![Image](img/down-arrow.jpg)\n\n**列表 18.14** stringconversion.c: 使用 `tolower()`\
  \ 和 `toupper()` 字符串中字符的大小\n\n点击此处查看代码图像\n\n***\n\n```c\n1:  // 字符转换函数 tolower()\
  \ 和 toupper().\n2: #include <ctype.h>\n3: #include <stdio.h>\n4: #include <string.h>\n\
  5:\n6: int main( void )\n7: {\n8:      char buf[80];\n9:      int  ctr;\n10:\n11:\
  \      while (1)\n12:      {\n13:          puts(\"\\nEnter 一行文本，按回车键退出。\");\n14:\
  \          gets(buf);\n15:\n16:          if ( strlen(buf) == 0 )\n17:          \
  \    break;\n18:\n19:          for ( ctr = 0; ctr< strlen(buf); ctr++)\n20:    \
  \      {\n21:              printf(\"%c\", tolower(buf[ctr]));\n22:          }\n\
  23:\n24:          printf(\"\\n\");\n25:          for ( ctr = 0; ctr< strlen(buf);\
  \ ctr++)\n26:          {\n27:              printf(\"%c\", toupper(buf[ctr]));\n\
  28:          }\n29:          printf(\"\\n\");\n30:      }\n31:      return(0);\n\
  32: }\n```\n\n***\n\n输出 ![Image](img/down-arrow.jpg)\n\n点击此处查看代码图像\n\n***\n\n输入一行文本，按回车键退出。\n\
