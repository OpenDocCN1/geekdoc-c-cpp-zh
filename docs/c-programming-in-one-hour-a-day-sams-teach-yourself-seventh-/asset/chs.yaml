  ```\n\n列表 8.2，`teamstats.c` 展示了二维数组的使用。该程序使用数组来存储四场比赛中五名篮球球员的得分总和。\n\n输入 ![Image](img/down-arrow.jpg)\n\
  \n**列表 8.2** scoring.c：存储五个球员在四场比赛中的得分\n\n点击此处查看代码图像\n\n***\n\n```c\n1: // scoring.c:\
