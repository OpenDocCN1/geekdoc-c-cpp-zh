  \ string,test string) returns 0\n\ninput first string, blank to exit: zebra\nsecond\
  \ string: aardark\nstrcmp(zebra,aardark) returns 1\n\n* * *\n\n注意\n\n在某些 UNIX 系统上，字符串比较函数在字符串不同时不一定返回\
  \ `-1`。然而，它们总是返回一个非零值。ANSI 标准规定返回值是小于、等于或大于零。\n\n* * *\n\n分析 ![Image](img/down-arrow.jpg)\n\
