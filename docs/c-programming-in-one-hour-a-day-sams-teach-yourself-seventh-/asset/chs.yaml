  \ 你的编译器是通过一个命令同时完成链接和编译，还是必须输入单独的命令？\n\n**6.** 你的 `C` 源文件应该使用什么扩展名？\n\n**7.** `FILENAME.TXT`\
  \ 是一个 `C` 源文件的有效名称吗？\n\n**8.** 如果你运行编译后的程序没有按预期工作，你应该做什么？\n\n**9.** 什么是机器语言？\n\n\
  **10.** 链接器是做什么的？\n\n#### 练习\n\n**1.** 使用文本编辑器查看生成的对象文件。它看起来像源代码一样吗？列表 1（退出时不要保存此文件。）\n\
