  \n### 作用域的重要性\n\n为了理解变量作用域的重要性，你需要回想在第 5 节中关于结构化编程的讨论。结构化方法将程序划分为执行特定任务的独立函数。为了实现真正的独立性，每个函数的变量都必须与其它函数代码引起的干扰隔离开来。通过隔离每个函数的数据，你可以确保函数在执行其任务时，不会被程序的其他部分“横插脚”。正如你很快就会学到的，通过在函数内部定义变量，你可以从程序的其他部分“隐藏”这些变量。\n\
  \n如果你认为函数之间完全的数据隔离并不总是所理想的，那么你是正确的。你很快就会发现，通过指定变量的作用域，程序员对隔离程度具有很大的控制权。\n\n### 创建外部变量\n\
  \n外部变量是定义在任何函数之外的变量。这意味着在 `main()` 外部也是，因为 `main()` 是一个函数。到目前为止，书中大多数变量定义都是外部的，放置在\
  \ `main()` 开始之前的源代码中。外部变量有时被称为全局变量。\n\n注意：如果在定义外部变量时没有显式地初始化它（给它赋值），编译器会将其初始化为 `0`。\n\
  \n### 外部作用域\n\n外部变量的作用域是整个程序。这意味着外部变量在 `main()` 以及程序中的每一个其他函数中都是可见的。例如，列表 12.1 中的变量\
  \ `x` 就是外部变量。正如你编译和运行程序时看到的，`x` 在 `main()` 和 `print_value()` 函数内部都是可见的，并且在你可能添加到程序的任何其他函数中都应该是可见的。\n\
  \n严格来说，说外部变量的作用域是整个程序是不准确的。相反，作用域是包含变量定义的整个源文件。如果整个程序包含在一个源文件中，那么这两个作用域就是等效的。大多数中等型的\
  \ C 程序都包含在一个文件中，你现在编写的程序也是如此。然而，程序的源代码可能包含在两个或多个单独的文件中。你将在第 22 节中学习如何以及为什么要这样做，并看到在这些情况下对外部变量所需的特殊处理。\n\
  \n### 使用外部变量\n\n虽然到目前示例程序使用了外部变量，但在实际操作中你应该很少使用它们。为什么？因为当你使用外部变量时，你违反了结构化编程核心的模块独立性原则。模块独立性是指每个函数（模块）包含执行其任务所需的所有代码和数据。\n\
  \n\n\n\n此程序打印两次 `x` 的值：第一次在第 13 行作为 `main()` 的部分，第二次在第 22 行作为 `print_value()` 的部分。第\
  \ 5 行将 `x` 定义为类型 `int` 的变量并赋值 `999`。第 11 行和 21 行将 `x` 声明为 `extern int`。注意变量定义（为变量分配存储空间）与\
  \ `extern` 声明的区别。后者表示：“此函数使用一个名称和类型特定的外部变量，该变量在别处定义”。在这种情况下，严格来说，不需要 `extern` 声明——即使没有第\
  \ 11 行和 21 行，程序也能正常运行。然而，如果 `print_value()` 函数与变量 `x` 的全局声明（第 5 行）位于不同的代码模块，则需要\
  \ `extern` 声明。\n\n如果你删除了第 5 行对 `x` 的定义，该列表在某些平台上仍然可以编译，但在其他平台上会报错。然而，你会发现，即使编译成功，在运行程序时也会给出错误。这是因为函数期望\
  \ `x` 在别处已定义。\n\n### 创建局部变量\n\n*局部变量*是指在函数内部定义的变量。局部变量的作用范围局限于定义它的函数。第 5 节描述了函数内部的局部变量、如何定义它们以及它们的优点。编译器不会自动将局部变量初始化为\
  \ `0`。如果你在定义局部变量时没有对其初始化，它将具有未定义值或*垃圾*值。在第一次使用局部变量之前，你必须显式地为它们赋值。\n\n变量也可以是 `main()`\
  \ 函数的局部变量。列表 12.2 中的 `x` 就是这种情况。它在 `main()` 内部定义，正如编译和执行该程序所示，它也只在 `main()`可见。\n\
  \n#### 应 (Do)\n\n- **应当**使用局部变量处理循环计数器等项目。\n- **应当**使用局部变量将变量包含的值与程序的其余部分隔离。\n\n\
  #### 不要 (Don't)\n\n- 如果程序大多数函数不需要外部变量，则**不要**使用外部变量。\n\n#### 静态变量与自动变量\n\n局部变量默认是*自动的*。这意味着局部变量在每次调用函数时都会重新创建，并在执行离开函数时被销毁。在实践中，这意味着自动变量不会在定义它的函数调用之间保留其值。\n\
  \n假设你的程序有一个使用局部变量 `x` 的函数。同样假设在第一次调用它时，函数给 `x` 赋值为 `100`。执行返回到调用程序，并在稍后再次调用该函数。变量\
  \ `x` 仍然持有值 `100` 吗？不，没有。变量 `x` 的第一个实例在第一次调用执行离开函数时就被销毁了。当再次调用函数时，创建了 `x` 的新实例。旧的\
  \ `x` 消失了。\n\n如果函数需要在调用之间保留局部变量的值怎么办？例如，打印函数可能需要记住发送到打印机的行数，以确定何时需要开始新页。为了让局部变量在调用之间保留其值，必须使用\
  \ `static` 关键字将其定义为*静态的*，例如：\n\n点击此处查看代码\n\n```\nvoid print(int x)\n{\n    static\
  \ int lineCount;\n    /* Additional code goes here */\n}\n```\n\n列表 12.4 展示了自动局部变量和静态局部变量之间的区别。\n\
  \n**列表 12.4** static.c：自动与静态局部变量的区别\n\n点击此处查看代码\n\n```c\n1:  // static.c--演示自动和静态局部变量。\n\
  2:  #include <stdio.h>\n3:  void func1(void);\n4:  int main( void )\n5:  {\n6: \
  \     int count;\n7:\n8:      for (count = 0; count < 20; count++)\n9:      {\n\
  10:          printf(\"At iteration %d: \", count);\n11:          func1();\n12: \
  \     }\n13:\n14:      return 0;\n15: }\n16:\n17: void func1(void)\n18: {\n19: \
  \     static int x = 0;\n20:      int y;\n21:\n22:      printf(\"x = %d, y = %d\\\
  n\", x++, y++);\n23: }\n```\n\n输入 ![Image](img/down-arrow.jpg)\n\n\n\n\n\n由于 `automatic`\
  \ 是局部变量的默认类型，因此在变量定义中不需要特意指定。如果你想，可以在定义中在 `type` 关键字之前包含 `auto` 关键字，如下：\n\n点击此处查看代码图像\n\
  \n```c\nvoid func1(int y)\n{\n    auto int count;\n    /* 此处有额外的代码 */\n}\n```\n\n\
  ### 参数的作用域\n\n包含在函数头参数列表中的变量具有`local scope`（局部作用域）。例如，以下函数：\n\n点击此处查看代码图像\n\n```c\n\
  void func1(int x)\n{\n    int y;\n    /* 此处有额外的代码 */\n}\n```\n\n`x` 和 `y` 都是局部变量，作用域是整个函数\
  \ `func1()`。当然，`x` 最初包含调用程序传递给函数的任何值。在你使用该值之后，可以像使用任何其他局部变量一样使用 `x`。\n\n由于参数变量始终从作为相应参数传递的值开始，因此将它们视为静态的或自动的是没有意义的。\n\
  \n### 外部静态变量\n\n你可以通过在定义中包含 `static` 关键字使外部变量变为静态的：\n\n点击此处查看代码图像\n\n```c\nstatic\
  \ float rate;\nint main( void )\n{\n    /* 此处有额外的代码 */\n}\n```\n\n普通外部变量与静态外部变量之间的区别在于作用域。普通外部变量对文件中的所有函数可见的，并且可以被其他文件中的函数以及定义点之后的任何位置使用。静态外部变量仅对其所在文件中的函数以及定义点之后的位置可见。\n\
  \n这些区别显然大部分时候适用于源代码包含在两个或多个文件中的程序。该主题将在第 22 节 中介绍。\n\n### 寄存器变量\n\n`register` 关键字用于建议编译器将自动局部变量存储在`processor\
  \ register`（处理器寄存器）中而不是普通内存中。什么是处理器寄存器，使用它的优势是什么？\n\n你计算机的中央处理器（CPU）包含几个称为 `registers`（寄存器）的数据存储位置。实际的数据操作（如加法和除法）是在\
  \ CPU 寄存器中进行的。为了处理数据，CPU 必须将数据从内存移动到寄存器，执行操作，然后将数据移回内存。在内存之间移动数据需要有限的时间。如果某个变量一开始就可以留在寄存器中，那么对该变量的操作将快得多。\n\
  \n通过在自动变量的定义中使用 `register` 关键字，你要求编译器将该变量存储在寄存器中。看下面的示例：\n\n点击此处查看代码图像\n\n```c\n\
  void func1(void)\n{\n    register int x;\n    /* 此处有额外的代码 */\n}\n```\n\n注意，你是在 `ask`（请求），而不是\
  \ `tell`（命令）。根据程序的需要，变量可能可能没有可用的寄存器。如果没有可用的寄存器，编译器会将该变量视为普通的自动变量。换句话说，`register`\
  \ 关键字是一个建议，而不是指令。`register` 存储类的优势对于函数频繁使用的变量最大，例如循环的计数器变量。\n\n`register` 关键字只能用于简单的数值变量，不能用于数组或结构体。此外，它不能用于静态或外部存储类。你不能定义指向寄存器变量的指针。\n\
  \n过去十年的编译器倾向于通过你优化你的代码，使得 `register` 关键字在很大程度上变得不再。我不建议使用 `register` 关键字，但万一你在旧代码中遇到它，了解它是值得的。\n\
  \n***\n\n#### 应当（Do）\n\n**应当**初始化局部变量，否则你将不知道它们包含什么值。\n\n**应当**初始化全局变量，尽管它们默认被初始化为\
  \ `0`。如果你始终初始化变量，就可以避免像忘记初始化局部变量这样的问题。\n\n***\n\n### 避免（Don’t）\n\n**不要**如果变量只需要在少数几个函数中使用，就将所有变量声明为全局变量。将它们作为函数参数传递通常更好。\n\
  \n**不要**将寄存器变量用于非数值值、结构体或数组。\n\n***\n\n### 局部变量与 main() 函数\n\n到为止关于局部变量的所有内容也适用于\
  \ `main()` 以及所有其他函数。严格来说，`main()` 是一个和其他任何函数一样的函数。当程序从你的操作系统启动时，会调用 `main()` 函数，当程序终止时，控制权从\
  \ `main()` 返回给操作系统。\n\n这意味着定义在 `main()` 中的局部变量是在程序开始时创建的，它们的生命周期在程序结束时结束。静态局部变量在\
  \ `main()` 调用之间保留其值的概念实际上是没有意义的：变量无法在程序执行之间保持存在。因此，在 `main()` 内部，自动局部变量和静态局部变量没有区别。你可以在\
  \ `main()` 中定义一个局部变量为静态的，但没有实际效果。\n\n***\n\n**应当**记住 `main()` 是一个和其他任何函数一样的函数。\n\
  \n***\n\n**不要**在 `main()` 中声明静态变量，因为这样做毫无益处。\n\n***\n\n### 你应该使用哪种存储类？\n\n当你决定使用何种存储类时，参考表\
  \ 12.1 可能会有帮助，它总结了五种类。\n\n**表 12.1** C 的五种存储类\n\n当你决定使用存储类时，应尽可能使用自动存储类。以下是需要遵循的指南：\n\
  - 给每个变量分配自动存储类。\n- 在 `main()` 的其他函数中，如果变量的值在调用之间必须保留，则将其设为静态。\n- 如果变量被大多数或所有函数使用，请将其定义为外部存储类。\n\
  \n### 局部变量与块\n\n到为止，本节仅讨论了局部于函数的变量。这是局部变量的主要用法，但你可以定义局部于任何程序块（任何大括号包围的区域）的变量。列表\
  \ 12.5 显示了一个示例。\n\n输入 ![](img/-arrow.jpg)\n\n**列表 12.5** block.c：在程序块中定义局部变量\n\n\
  点击此处查看代码图像\n\n***\n\n```c\n/* 展示块内的局部变量。 */\n```\n\n```c\n#include <stdio.h>\n\n\
  int main( void )\n{\n    /* 定义局部于 main() 的变量。 */\n    int count = 0;\n\n    printf(\"\
  \\n 块外部，count = %d\", count);\n\n    /* 开始块。 */\n    {\n        /* 定义局部块的变量。 */\n\
  \        int count = 999;\n        printf(\"\\n 块内部，count = %d\", count);\n    }\n\
  \n    printf(\"\\n 块外部再次，count = %d\\n\", count);\n    return 0;\n}\n```\n\n***\n\
  \n输出 ![](img/-arrow.jpg)\n\n点击此处查看代码图像\n\n***\n\n块外部，count = 0\n\n块内部，count = 999\n\
  \n块外部再次，count = 0\n\n***\n\n\n\n\n\n在该程序中，块内部定义的 `count` 与块外部定义的 `count` 是相互独立的。第\
  \ 9 行将 `count` 定义为类型为 `int` 的变量并赋值为 `0`。由于它在 `main()` 的开头声明，因此可以在整个 `main()` 函数中使用。在第\
  \ 11 行，打印变量 `count`，其值为 `0`。第 14 行到第 19 行定义了一个块，在块内部定义了另一个 `count` 变量，同样是一个 `int`\
  \ 类型的变量。该 `count` 变量在第 17 行初始化为 `999`。第 18 行打印了块内 `count` 变量的值 `999`。由于块在第 19 行结束，第\
  \ 21 行的打印语句使用的是 `main()` 函数第 9 行最初声明的原始 `count`。\n\n这种局部变量的使用在 C 语言编程中并不常见，你可能永远不会发现需要它。它最常见的用法可能是程序员试图在程序中隔离某个问题。你可以临时用大括号隔离部分代码段，并建立局部变量来帮助追踪问题。另一个优势是变量声明/初始化可以放置在靠近其使用的地方，这有助于理解程序。\n\
  \n### 做（Do）\n**应该**在块的开头（临时）使用变量来帮助追踪问题。\n\n### 不要（Don’t）\n**不要**尝试在函数开头或块开头以外任何地方放置变量定义。\n\
  \n**不要** 除非能让程序更清晰，否则不要在块的开头定义变量。\n\n### 总结（Summary）\n本节涵盖了与 C 变量存储类相关的作用域和生命周期概念。每个\
  \ C 变量（无论是简单变量、数组、结构体还是其他）都有特定的存储类，它决定了两点：变量的作用域（即该变量在程序的何位置可见）以及它的生命周期（即变量在内存中持续多久）。\n\
  \n正确使用存储类是结构化编程的一个重要方面。通过将大多数变量限制在使用它们的函数内部，你可以增强函数之间的独立性。除非有特定理由将其变为外部或静态，否则应给变量赋予自动存储类。\n\
  \n### 问答（Q&A）\n**Q 如果全局变量可以在程序的任何地方使用，为什么不把所有变量都变成全局变量？****\n\n**A** 随着程序变得越来越，它们将包含越来越多的变量。全局变量在程序运行期间一直占用内存，而自动局部变量仅在定义它的函数执行时占用内存。因此，使用局部变量可以减少内存占用。然而，更重要的是，局部变量的使用大大减少了程序不同部分之间发生意外交互的可能性，从而减少了程序\
  \ Bug 并遵循了结构化编程的原则。\n\n**Q 第 11 节，“实现结构体、联合体和 typedef](#ch11.xhtml_ch11)”指出作用域影响结构体实例，但不影响结构体标签或主体。为什么作用域不影响结构体标签或主体？****\n\
  \n**A** 当你声明一个没有实例的结构体时，你是在创建一个模板或定义，而不是实际声明任何变量。只有当你创建结构体的实例时，你才声明了一个占用内存并具有作用域的变量。因此，你可以将结构体主体留在任何函数之外，而对内存没有实际影响。许多程序员将带有标签的常用结构体主体放入头文件中，然后在需要创建结构体实例时包含这些头文件。（头文件在第\
  \ 22 节](#ch22.xhtml_ch22) 中介绍。）**\n\n**Q 计算机如何知道同名的全局变量和局部变量之间的区别？****\n\n**A**\
  \ 这个问题的答案超出了本书的范围。需要知道的是，当声明一个与全局变量同名的局部变量时，当局部变量处于作用域内（在定义它的函数内部），程序会临时忽略该全局变量。它会继续忽略该全局变量，直到局部变量离开作用域。\n\
  \n**Q 只要变量类型不同，我可以声明同名的局部变量和全局变量吗？****\n\n**A** 可以的。当你声明一个与全局变量同名的局部变量时，它是一个完全不同的变量。这意味着你可以将其设为任何你想要的类型。然而，在声明同名的全局和局部变量时你应该小心。有些程序员会在所有全局变量名前前加上缀“g”（例如，使用\
  \ `gCount` 而不是 `Count`）。这在源码中清楚了哪些变量是全局的，哪些是局部的。\n\n### 工作坊（Workshop）\n工作坊提供了测验题帮助你巩固对涵盖内容的理解，并提供了练习让你获得使用所学内容的经验。\n\
