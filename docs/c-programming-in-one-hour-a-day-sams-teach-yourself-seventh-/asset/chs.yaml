  #include <stdio.h>\nint x, y;\n\nint main( void )\n{\n    for ( x = 0; x < 10; x++,\
  \ printf(\"\\n\") )\n    for ( y = 0; y < 10; y++ )\n        printf(\"X\" );\n \
  \   return 0;\n}\n```\n\n**4.** 错误排除：以下程序有一个问题。在编辑器中输入它并编译它。哪些行生成了错误消息？\n\n```\n\
  #include <stdio.h>\nint main( void );\n{\n    printf(\"Keep looking!\");\n    printf(\"\
  You'll find it!\\n\" );\n    return 0;\n}\n```\n\n**5.** 错误排除：以下程序有一个问题。在编辑器中输入它并编译它。哪些行生成了问题？\n\
  \n```\n#include <stdio.h>\nint main( void )\n{\n    printf(\"This is a program with\
  \ a \" );\n    do_it(\"problem!\");\n    return 0;\n}\n```\n\n**6.** 对练习 3 中的程序进行以下更改。重新编译并运行此程序。现在程序是做什么的？\n\
  \n```\nprintf(\"%c\", 1 );\n```\n\n## 第 2 节 C 程序的组件\n\n每个 `C` 程序由多个组件以特定方式组合。。的大部分内容都在解释这些不同的程序组件以及你如何使用它们。为了说明整体情况，我们应该首先回顾一个完整的（尽管很小）`C`\
  \ 程序并识别其所有组件。在本节中你将学习：\n\n![Image](img/squf.jpg) 短 C 程序的组件\n\n![Image](img/squf.jpg)\
  \ 每个程序组件的用途\n\n![Image](img/squf.jpg) 如何编译和运行示例程序\n\n### 一个短 C 程序\n\n\n\n\n\nListing\
  \ 2.1 展示了 `bigyear.c` 的源代码。这是一个简单的程序。它所做的只是接受键盘输入的出生年份，并计算某人在哪一年会达到特定年龄。在现阶段，不要担心理解程序运行的细节。现在的重点在于让你对\
  \ C 程序的各个部分有一个基本的熟悉，以便你更好地理解书中后面列出的代码列表。\n\n在查看示例程序之前，你需要了解什么是函数，因为函数是 C 语言的核心。`function`\
  \ 是程序中一段独立的代码，用于执行特定任务并被赋予了一个名称。通过引用函数的名称，你的程序可以执行函数中的代码。程序还可以向函数发送名为 `arguments,`（参数）的信息，函数也可以向程序的主体部分返回信息。C\
  \ 函数有两种类型：`library functions`（库函数），它是 C 编译器包的一部分；以及你作为程序员创建的 `user-defined functions`（自定义函数）。你将在书中学习这两种函数。\n\
  \n请注意，与书中所有的代码列表一样，Listing 2.1 中的行号并不是程序的一部分。它们仅用于识别之用，所以请不要输入它们。\n\n输入 ![Image](img/down-arrow.jpg)\n\
  \n**列表 2.1** bigyear.c -- 计算某人在哪一年达到特定年龄的程序\n\n点击此处查看代码图像\n\n* * *\n\n```c\n1: \
  \ /* 计算某人在哪一年达到特定年龄的程序 */\n2:  #include <stdio.h>\n3:  #define TARGET_AGE 88\n4:\n\
  5:  int year1, year2;\n6:\n7:  int calcYear(int year1);\n8:\n9:  int main(void)\n\
  10:  {\n11:      // 用户输入出生年份\n12:      printf(\"What year was the subject born?\
  \ \");\n13:      printf(\"Enter as a 4-digit year (YYYY): \");\n14:      scanf(\"\
  \ %d\", &year1);\n15:\n16:      // 计算未来的年份并显示出来\n17:      year2 = calcYear(year1);\n\
  18:\n19:      printf(\"Someone born in %d will be %d in %d.\",\n20:            \
  \      year1, TARGET_AGE, year2);\n21:\n22:      return 0;\n23:  }\n24:\n25:  /*\
  \ 获取未来年份的函数 */\n26:  int calcYear(int year1)\n27:  {\n28:      return(year1+TARGET_AGE);\n\
  29:  }\n```\n\n输出 ![Image](img/down-arrow.jpg)\n\n点击此处查看代码图像\n\n* * *\n\n对象是在哪一年生的？1963\n\
  \n出生于 1963 年的人将在 2051 年 88 岁。\n\n### 程序组件\n\n以下章节描述了上述示例程序的各种组件。包含行号是为了让你轻松识别所讨论的程序部分。\n\
  \n#### main() 函数（第 9 到第 23 行）\n\n每个可执行 C 程序所需要的唯一组件是 `main()` 函数。在最简单的形式中，`main()`\
  \ 函数由名称 `main` 后面跟一对包含 `void` 单词的括号 (`(void)`) 和一对大括号 (`{}`) 组成。你可以省略 `void` 单词，程序在大多数编译器上仍然有效。ANSI\
  \ 标准规定你应该包含 `void` 单词，以便你知道没有内容发送到 `main` 函数。\n\n大括号内部是构成程序主体的语句。在正常情况下，程序执行从 `main()`\
  \ 中的第一条语句开始，在 `main()` 中的最后一个语句结束。根据 ANSI 标准，在这个示例中你需要包含唯一语句是第 22 行的 `return` 语句。\n\
  \n#### #include 和 #define 指令（第 2 和第 3 行）\n\n`#include` 指令指示 C 编译器在编译期间将包含文件的内容添加到你的程序中。`include\
  \ file`（包含文件）是一个独立的磁盘文件，包含了你的程序或编译器可以使用的信息。其中几个文件（有时称为 `header files`，头文件）是随编译器一起提供的。你很少需要修改这些文件中的信息；这就是为什么它们与你的源代码分开的原因。包含文件应该都具有\
  \ `.h` 扩展名（用于头文件）。\n\n#### 变量定义（第 5 行）\n\n*variable*（变量）是分配给内存位置的名称，用于存储信息。在 C 语言中，变量必须在使用之前进行定义。在示例程序中，第\
  \ 5 行的定义 `int year1, year2;` 定义了两个各持有整数值的变量。\n\n#### 函数原型（第 7 行）\n\n`function prototype`（函数原型）为\
  \ C 编译器提供了函数的名称和参数。它在函数使用之前出现。函数原型不同于 *function definition*（函数定义），后者包含了构成函数的实际语句。\n\
  \n#### 程序语句（第 12, 13, 14, 17, 19, 20, 22 和 28 行）\n\nC 程序的实际工作是由其语句完成的。C 语句在屏幕上显示信息、读取键盘输入、执行数学运算、调用函数、读取磁盘文件以及程序执行的所有其他操作。书的大部分内容用于教你各种\
  \ C 语句。现在，请记住在你的源代码中，C 语句通常每行一条，并始终以分号结束。\n\n\n\n\n\n### return 语句\n\n第 22 行和 28\
  \ 行包含 `return` 语句。第 28 行的 `return` 语句是函数 `calcYear()` 的一部分。它通过向变量 `year1` 加上 `#define`\
  \ 常量 `TARGET_AGE` 来计算某人达到特定年龄时对应的年份，并将结果返回给调用 `calcYear()` 的程序。第 22 行的 `return`\
  \ 语句在程序结束之前向操作系统返回一个值为 `0` 的。\n\n## 函数定义（第 26 行至第 29 行）\n\n在介绍程序 `bigyear.c` 之前定义函数时，提到了两种函数——库函数和用户定义函数。`printf()`\
  \ 和 `scanf()` 语句是第一类函数的示例，而第 26 行至 29 行名为 `calcYear()` 的函数是一个用户定义函数。正如名称所示，用户定义函数是由程序员在程序开发期间编写的。该函数将一个创建常量的值加到一个年份，并将答案（另一个年份）返回给调用它的程序。在第\
  \ 5 节 的“将代码封装在函数中”中，你将学习正确使用函数是良好的 C 编程规范的重要部分。\n\n注意，在真实的 C 程序中，你可能不会为像加两个数字这样简单的任务使用函数。在这里这样做仅用于演示目的。\n\
  \n## 程序注释（第 1 行、11 行、16 行和 25 行）\n\n程序中任何以 `/*` 开头并以 `*/` 结尾的部分，或者任何以 `//` 开头的单行都称为注释。编译器会忽略所有注释，因此它们对程序的运行方式完全没有影响。你可以在注释中放入任何想要的内容，而它不会修改你程序的运行方式。第一种注释可以跨越行的一部分、整行或多行。这里有三个示例：\n\
  \n点击此处查看代码图像\n\n```c\n/* 一个单行注释 */\n\nint a,b,c; /* 部分行注释 */\n\n/* 这是一个\n\n跨越\n\n\
  多行的注释 */\n```\n\n你不应该使用嵌套注释。嵌套注释是指放入另一个注释中的注释。大多数编译器不会接受以下内容：\n\n```c\n/*\n\n/*\
  \ 嵌套注释 */\n\n*/\n```\n\n某些编译器允许嵌套注释。虽然这种功能可能很吸引人，但你应该避免这样做。因为 C 语言的优点之一是移植性，使用嵌套注释等功能可能会限制你代码的移植性。嵌套注释还可能导致难以发现的问题。\n\
  \n第二种注释样式（以两个连续的正斜杠（`//`）开头的）仅用于单行注释。两个正斜杠告诉编译器忽略从这里到行尾的所有内容。\n\n点击此处查看代码图像\n\n\
  ```c\n// 这一整行都是注释\n\nint x; // 注释从斜杠开始\n```\n\n许多初级程序员认为程序注释是没必要的且浪费时间的。这是一个错误！当你编写代码时，程序的运行逻辑可能非常清晰；但随着你的程序变得越来越大越复杂，或者当你需要修改\
  \ 6 个月前编写的程序时，注释是无价之宝。现在是养成大量使用注释来记录你所有编程结构和操作的习惯了。你可以使用你喜好的任何一种注释样式。书中的程序贯穿使用了这两种样式。\n\
  \n***\n\n### 要做的\n\n**务必**在程序的源代码中添加丰富的注释，特别是在那些对你或以后可能需要修改它的人可能不清晰的语句或函数附近。\n\n\
  **务必**学习开发会有帮助的风格。过于简练或晦涩的风格没有帮助。冗长的风格可能会导致你花在注释上的时间比编程还多。\n\n***\n\n### 不要做的\n\n\
  **不要**对已经清晰的语句添加不必要的注释。例如，输入：\n\n点击此处查看代码图像\n\n```c\n/* 以下内容将在屏幕上打印 Hello\n\nWorld!\
  \ */\n\nprintf(\"Hello World!\");\n```\n\n这可能有点做得过头了，至少在你完全熟悉 `printf()` 函数及其工作原理时。\n\
  \n***\n\n## 使用大括号（第 10 行、23 行、27 行和 29 行）\n\n你使用大括号 `{}` 来包含构成每个 C 函数的程序行——包括 `main()`\
  \ 函数。封装在大括号内的一组或多个语句被称为一个块（block）。正如你在随后的课程中看到的，C 语言对块有许多用途。\n\n## 运行程序\n\n花时间输入、编译并运行\
