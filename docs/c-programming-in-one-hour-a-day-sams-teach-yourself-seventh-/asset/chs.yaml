  \ 40 行改为以下内容来消除第 39 行：\n\n点击此处查看代码图像\n\n```c\nprintf( \"\\n\\n1 - Beep Computer\"\
  \ );\n```\n\n然而，保留第 39 行会让程序更易读。\n\n查看 `main()` 函数，第 14 行和第 15 行包含 `printf()` 语句演示了打印问号以及单引号和双引号所需的转义序列。你可能不需要经常使用这些标点符号，但当使用时如果忘记转义序列，可能不会产生编译器错误，而是产生意之外的打印序列。第\
  \ 16 行开始了一个 `while` 循环。只要 `choice` 不等于 `QUIT`，`while` 循环语句就会持续循环。由于 `QUIT` 是一个常量，你可以将其替换为\
