  ?~\");\n```\n\n### 总结\n\n在本节课程完成后，你已经准备好编写自己的 C 程序了。通过结合 `printf()`、`puts()` 和 `scanf()`\
  \ 函数以及你在前面的课程中学习的程序控制语句，你已经拥有了编写简单程序所需的工具。\n\n屏幕显示通过 `printf()` 和 `puts()` 函数实现。`puts()`\
