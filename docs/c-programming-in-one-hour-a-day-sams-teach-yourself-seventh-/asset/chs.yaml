  ```c\n/* ex02-05 */\n#include <stdio.h>\n#include <string.h>\n\nint main(void)\n\
  {\n    char buffer[256];\n\n    printf( \"输入你的名字并按 <Enter>:\\n\");\n    fgets( buffer\
  \ );\n    printf( \"\\n 你的名字有 %d 个字符和空格!\", strlen( buffer ));\n\n    return 0;\n\
  }\n```\n\n\n\n\n\n在学习变量之前，你需要稍微了解一下计算机内存的运行机制。\n\n## 了解你的计算机内存\n\n如果你已经了解了计算机内存是如何运行的，可以跳过本节。如果你不确定，请继续阅读。了解你的计算机内存及其工作原理可以帮助你更好地理解\
  \ C 语言的某些方面。\n\n计算机在运行时使用随机存取存储器（RAM）来存储信息。RAM 通常位于你的计算机内部。RAM 是易失性的（volatile），这意味着它会根据需要频繁擦除并被新信息。易失性也意味着\
  \ RAM 只在计算机开启时才会“记忆”内容，当你关闭计算机时它会丢失信息。\n\n每台计算机都安装了一定量的 RAM。系统的 RAM 容量通常以吉字节（GB）为单位，例如\
  \ 1GB、2GB、4GB、8GB 或更多。1 吉字节内存等于 1,024 兆（MB）。1 兆内存等于 1,024 千字节（KB）。1 千字节内存由 1,024\
  \ 字节（byte）。因此，一个拥有 4GB 内存的系统实际上拥有 4×1,024 MB 或 4×1,024×1,024 KB，即 4,194,304 KB 的\
  \ RAM。这相当于 4,194,304KB×1,024 字节，总计为 4,294,967,296 字节的 RAM。\n\n`byte` 是计算机数据存储的基本单位。第\
  \ 21 “处理内存”有更多关于字节的信息。目前，表 3.1 可以让你了解存储某些类型的数据需要多少字节。\n\n![Image](img/03tab01.jpg)\n\
  \n**表 3.1** 存储数据所需的内存空间\n\n你计算机中的 RAM 是顺序组织的，一个字节紧接一个字节。每个内存字节都有一个唯一的地址，可以用于标识它。该地址可以将该内存字节与其他所有字节区分开来。内存位置按顺序分配地址，从零开始一直增加到系统限制。目前，你不需要担心地址；它们都由\
  \ C 编译器自动处理。\n\n你计算机的 RAM 有多种用途，但作为程序员，你只需要关注数据存储。数据是你 C 程序运行时处理的信息。无论你的程序是维护地址列表、监控股市、记录家庭预算，还是跟踪猪花肉的价格，这些信息（名称、股价、支出金额或猪肉期货）在程序运行时都存储在计算机的\
  \ RAM 中。\n\n现在，你已经对内存存储的基本原理有了初步了解，可以回到 C 语言编程，并学习 C 如何使用内存来存储信息。\n\n## 使用变量存储信息\n\
  \n`variable`（变量）是计算机内存中一个带有命名的数据存储位置。通过在程序中使用变量名，你实际上引用了存储在该处的数据。\n\n### 变量名\n\n\
  要在 C 程序中使用变量，你必须必须如何如何创建变量名。在 C 语言中，变量名必须遵守以下规则：\n\n![Image](img/squf.jpg) 名称可以包含字母（a\
  \ 到 z 和 A 到 Z）、数字（0 到 9）和下划线字符（`_`）。\n\n![Image](img/squf.jpg) 名称的第一个字符必须是字母。下划线也是法的起始字符，但不建议在名称开头使用。数字（0\
  \ 到 9）不能作为第一个字符。\n\n![Image](img/squf.jpg) 区分大小写（即大写和小写字母）。C 语言是区分大小写的，因此，名称 `count`\
  \ 和 `Count` 代表两个不同的变量。\n\n![Image](img/squf.jpg) C 关键字不能用作变量名。关键字是 C 语言的一部分单词。（C\
  \ 关键字的完整列表可以在附录 B“C/C++ 保留字”找到。）\n\n以下列表包含了一些合法和非法的 C 变量名示例：\n\n![Image](img/039tab01.jpg)\n\
  \n由于 C 语言区分大小写，名称 `percent`、`PERCENT` 和 `Percent` 被视为三个不同的变量。C 程序员通常在变量名中仅使用小写字母，尽管这不是强制要求的。使用全大写字母通常保留给常量名（在本节稍后的部分将介绍）。\n\
  \n对于许多编译器来说，C 变量名的长度最多可达 31 个字符。（实际上可以比这更长，但编译器只查看名称的前 31 个字符。）有了这种灵活性，你可以创建反映所存储存储的变量名。例如，一个计算贷款还款的程序可以将基础利率的值存储在名为\
  \ `interest_rate` 的变量中。变量名有助于让其用法变得清晰。你也可以创建一个名为 `x` 甚至 `ozzy_osborne` 的变量；这对 C\
  \ 编译器来说没有区别。然而，对于其他查看源码的人来说，该变量的使用将远没有那么清晰。虽然输入描述性变量名可能多花一点时间，但程序清晰度的提高是值得的。\n\n\
  对于多个单词创建的变量名有许多命名规范。你已经见过一种风格：`interest_rate`。使用下划线分隔变量名中的单词使其易于理解。另一种风格被称为驼峰命名法。不是使用空格，而是每个单词的首字母大写。不是\
  \ `interest_rate`，变量应该是 `InterestRate`。驼峰命名法越来越流行，因为输入大写字母比输入下划线更容易。本书使用了下划线，因为它对大多数人来说更容易读。你应该决定采用哪种风格。\n\
  \n使用描述性变量名。采用一种风格来命名变量。使用全大写字母。不要以下划线开头变量名。\n\n### 数值变量类型\n\nC 提供了多种数值变量类型。你需要不同类型的变量是因为不同的数值有不同的内存存储需求，并且对它们进行数学操作的难易程度也不同。C\
  \ 的数值变量分为以下大类：\n\n![Image](img/squf.jpg) 整数变量持有没有小数部分的值（即只有整数）。整数变量有两种形式：有符号整数变量可以持有正负值，而无符号整数变量只能持有正值（和\
  \ 0）。\n\n![Image](img/squf.jpg) 浮点变量持有带有小数部分的值（即实数）。\n\n在这些类别中的每一个都有两个或两种特定的变量类型。这些类型总结在表\
  \ 3.2 中，该表还显示了存储每个类型单个变量通常需要的内存（字节字节）。\n\n![Image](img/03tab02.jpg)\n\n**表 3.2**\
  \ C 的数值数据类型\n\n\n\n\n\n`Approximate range`（范围）是指给定变量可以包含的最大值和最小值。（由于空间限制，未列出这些变量值的的确切范围。）`Precision`（精度）是变量存储的准确性。（例如，如果你计算\
  \ 1/3，答案是 `0.33333...`，其中 3 无限延伸。精度为 7 的变量将存储 7 个 3。）\n\n参考表 3.2，你可能会发现 `int` 和\
  \ `long` 变量类型是相同的。为什么需要两种不同的类型呢？在 64 位特尔系统（PC）上，列出的 `int` 和 `long` 变量类型的大小确实是相同的，但在其他类型的硬件上，它们可能不同。记住，C\
  \ 是一种灵活、可移植的语言，因此它为这两种类型提供了不同的关键字。如果你在 PC 上工作，可以交替使用 `int` 和 `long`。\n\n不需要特殊的关键字来使整数变量带符号；整数变量默认就是带符号的。不过，如果你想的话，也可以包含\
  \ `signed` 关键字。表 3.2 中显示的关键字用于变量声明，我们将在下一节中讨论。\n\n列表 3.1 帮助你确定变量在你特定计算机上占的大小。如果你的输出与列表后显示的输出不匹配，请不要惊讶。\n\
  \n输入 ![Image](img/down-arrow.jpg)\n\n**列表 3.1** `sizeof.c` - 一个显示变量类型大小的程序\n\n点击此处查看代码图像\n\
  \n```c\n1:   /* sizeof.c--用于告知 C 变量大小的程序 */\n2:   /*单位为字节 */\n3:\n4:   #include\
  \ <stdio.h>\n5:\n6:   int main(void)\n7:   {\n8:       printf( \"\\nA char     \
