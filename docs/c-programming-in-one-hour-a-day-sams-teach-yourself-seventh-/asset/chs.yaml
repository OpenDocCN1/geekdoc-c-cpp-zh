  \ 之间）。第 22 行打印 `dest` 的原始值，第 24 行将用户指定的字符数从 `source` 复制到 `dest`，第 26 行打印最终的 `dest`。注意：请确保复制的字符数没有超过目标数组的大小。此外，请注意\
  \ `strncpy()` 不添加终止符。\n\n### 字符串拼接\n\n如果你熟悉拼接（concatenation）这个术语，可能会问：“它是什么？”“它合法吗？”它的意思是连接两个字符串——将一个字符串接到另一个的末尾——在大多数它是合法的。C\
  \ 标准库包含两个拼接函数——`strcat()` 和 `strncat()`——它们都需要头文件 `string.h`。\n\n#### 使用 strcat()\
  \ 函数\n\n`strcat()` 的原型是\n\n点击此处查看代码图像\n\n```\nchar *strcat(char *str1, const char\
  \ *str2);\n```\n\n该函数将 `str2` 的副本附加到 `str1` 的末尾，并将空字符移动到新字符串的末尾。你必须为 `str1` 分配足够的空间来容纳结果。`strcat()`\
  \ 的返回值指向 `str1` 的指针。列表 18.4 演示了 `strcat()`。\n\n输入 ![Image](img/down-arrow.jpg)\n\
