  \n**8.** 编写一个显示数字二进制值的程序。例如，如果用户输入 `3`，程序应该显示 `00000011`。（提示：你需要使用位运算符。）\n\n## 第\
  \ 22 课。高级编译器使用\n\n这是你的 C 语言学习旅程的最后一节课。此时，你实际上已经学习了使用 C 语言语法编程所需的几乎所有关键主题。本节涵盖了 C\
  \ 的一些额外特性。你将学习\n\n![Image](img/squf.jpg) 使用多个源文件编程\n\n![Image](img/squf.jpg) 使用\
  \ C 处理器\n\n![Image](img/squf.jpg) 使用命令行参数\n\n### 多源文件编程\n\n到为止，你所有的 C 程序都由单个源代码文件组成（当然不包括头文件）。单个源代码文件通常就是你需要的，特别是对于小型程序，但你也可以将一个程序的源代码划分到两个或多个文件中，这种做法被称为*模块化编程*。你为什么要这样做呢？下面的章节将解释。\n\
  \n#### 模块化编程的优势\n\n使用模块化编程的主要原因与结构化编程及其对函数的依赖。随着你成为一名经验丰富的程序员，你会开发出更通用的函数，这些函数不仅可以用最初编写编写的程序，还可以用于其他程序。例如，你可能会编写一组用于在屏幕上显示信息的通用函数。通过将这些函数保留在单独文件中，你可以在其他同样显示信息的程序中再次使用它们。当你编写一个由多个源文件的程序时，每个源文件被称为一个*模块*。\n\
  \n#### 模块化编程技术\n\n一个 C 程序只能有一个 `main()` 函数。包含 `main()` 函数的模块被称为*主模块*，其他模块被称为*次模块*。每个次模块通常关联一个单独的头文件。（将在本节稍晚时候学习为什么）。现在，看几个简单的示例，来说说明多模块编程的基础知识。列表\
  \ 22.1、22.2 和 22.3 分别显示了一个从用户处输入数字并显示其平方的程序的主模块、次模块和头文件。\n\n输入 ![Image](img/down-arrow.jpg)\n\
  \n**列表 22.1** list2101.c：主模块\n\n点击此处查看代码图像\n\n* * *\n\n```c\n1:  /* list2101.c--输入一个数字并显示其平方。\
  \ */\n2:\n3:  #include <stdio.h>\n4:  #include \"calc.h\"\n5:\n6:  int main( void\
  \ )\n7:  {\n8:      int x;\n9:\n10:     printf(\"Enter an integer value: \");\n\
  11:     scanf(\"%d\", &x);\n12:     printf(\"\\nThe square of %d is %ld.\\n\", x,\
  \ sqr(x));\n13:     return(0);\n14: }\n```\n\n* * *\n\n输入 ![Image](img/down-arrow.jpg)\n\
  \n**列表 22.2** calc.c：次模块\n\n点击此处查看代码图像\n\n* * *\n\n```c\n1:  /* 包含计算函数的模块。 */\n\
  2:\n3:  #include \"calc.h\"\n4:\n5:  long sqr(int x)\n6:  {\n7:      return ((long)x\
  \ * x);\n8:  }\n```\n\n* * *\n\n输入 ![Image](img/down-arrow.jpg)\n\n**列表 22.3** calc.h：calc.c\
  \ 的头文件\n\n点击此处查看代码图像\n\n* * *\n\n```c\n1:  /* calc.h--calc.c 的头文件。 */\n2:\n3:  long\
  \ sqr(int x);\n4:\n5:  /* end of calc.h */\n```\n\n* * *\n\n输出 ![Image](img/down-arrow.jpg)\n\
  \n点击此处查看代码图像\n\n* * *\n\nEnter an integer value: 100\n\nThe square of 100 is 10000\n\
  \n* * *\n\n分析 ![Image](img/down-arrow.jpg)\n\n* * *\n\n现在详细查看这三个文件的组件。头文件 `calc.h`\
  \ 包含 `sqr()` 函数的原型。次模块 `calc.c` 包含 `sqr()` 函数的定义。注意头文件名包含在引号内，而不是尖括号内。（将在本节稍晚时候学习为什么。）主模块\
  \ `list2101.c` 包含 `main()` 函数。该模块也包含了 `calc.h`。\n\n\n\n\n辅助模块应该包含通用实用函数——也就是说你可能想在其他程序使用的函数。一种常见的做法是为每种类型的函数创建一个辅助模块——例如，用于键盘函数的\
  \ `keyboard.c`，用于屏幕显示函数的 `screen.c`，依此类推。要编译并链接两个以上的模块，请将项目中的所有源文件包含在内。\n\n主模块当然应该包含\
  \ `main()` 以及任何其他与程序相关的函数（意味着它们没有通用实用性）。\n\n通常每个辅助模块都有一个头文件。每个文件的名称与相关的模块相同，但扩展名为\
  \ `.h`。在头文件中，请放置以下内容：\n\n![Image](img/squf.jpg) 辅助模块中函数的原型\n\n![Image](img/squf.jpg)\
  \ 模块中使用的任何符号常量和宏的 `#define` 指令\n\n![Image](img/squf.jpg) 模块中使用的任何结构体或外部变量的定义\n\n\
  由于此头文件可能被包含在多个源文件中，你希望防止它的部分被编译多次。你可以通过使用条件编译的预处理器指令（在本文的稍后部分讨论）来实现这一点。\n\n## 外部变量与模块化编程\n\
  \n在许多情况下，主模块和辅助模块之间唯一的数据通信是通过传递给函数和从函数的参数。在这种情况下，你不需要对数据可见性采取特殊步骤；但如果在两个模块中都可见的外部变量呢？\n\
  \n回想 第 12 节 中的“理解变量作用域”，外部变量是指定义在任何函数之外的变量。外部变量在其声明的整个源代码文件中都是可见。然而，它不会自动在其他模块中可见。要让它可见，你必须在每个模块中使用\
  \ `extern` 关键字声明该变量。例如，如果你在主模块中声明了一个外部变量：\n\n```c\nfloat interest_rate;\n```\n\n\
  你通过在在该模块中包含以下声明（在任何函数之外），使 `interest_rate` 在辅助模块中可见：\n\n```c\nextern float interest_rate;\n\
  ```\n\n`extern` 关键字告诉编译器 `interest_rate` 的原始声明（为它分配存储空间的那个声明）位于其他地方，但该变量应该在该模块中可见。所有\
  \ `extern` 变量具有静态存储期，并且对模块中的所有函数都可见。图 2.5 展示了在多模块程序中使用 `extern` 关键字。\n\n![Image](img/22fig05.jpg)\n\
  \n**图 22.5** 使用 `extern` 关键字使外部变量跨模块可见。\n\n***\n\n### 注意事项\n\n如果你使用了 `extern` 声明但实际上没有在其他地方声明该变量，就会得到一个错误。此错误可能发生在链接最终程序时或运行时。\n\
  \n***\n\n在图 22.5 中，变量 `x` 在三个模块中都是可见的。相比之下，`y` 只在主模块和辅助模块 1 中可见。\n\n***\n\n### 做法\n\
  \n**应该**在它们自己的源文件中创建通用函数。这样，它们就可以被链接到任何需要它们的其他程序中。\n\n***\n\n### 忌\n\n**不要**如果一个多个模块包含\
  \ `main()` 函数，请不要尝试一起编译多个源文件。你只能有一个 `main()`。（任何命名的函数也只能有一个。）\n\n**不要**在一起编译多个文件时始终使用\
  \ C 源文件。如果你将源文件编译成对象文件，仅在文件发生更改时重新编译。这可以节省大量时间。\n\n***\n\n## C 预处理器\n\n预处理器是所有 C\
  \ 编译器的一部分。当你编译程序时，预处理器首先处理代码。在大多数编译器中，预处理器是根据 `#define` 指令处理源代码的。预处理器是类型敏感的。在编译时，使用条件编译的预处理器指令（在本文的稍后部分讨论）。你需要了解的是带有\
  \ `#` 符号的预处理器指令。\n\n### #define 预处理器指令\n\n使用 `#define` 来创建符号常量。\n\n### #define 预处理器指令\n\
  \n`#define` 指令有两种用途：创建符号常量和宏。\n\n### 使用 #define 的替换宏\n\n回想第 3 节 中的“存储变量与常量”，虽然该术语用于描述符号常量，但使用\
  \ `#define` 来创建替换宏。通过 `#define` 替换文本。例如，为了将 `text1` 替换为 `text2`，你编写：\n\n```c\n#define\
  \ text1 text2\n```\n\n这种指令会导致预处理器将代码中出现的每个 `text1` 替换为 `text2`。因此，源代码中的以下行：\n\n\
  ```c\nresult = text1;\n```\n\n被替换为：\n\n```c\nresult = text2;\n```\n\n效果与使用编辑器的搜索-替换功能将每个\
  \ `MAX` 替换为 `1000` 的。\n\n```c\n#define MAX 1000\n```\n\n在预处理期间，源代码中的：\n\n```c\n\
  x = y * MAX;\nz = MAX - 12;\n```\n\n将变为：\n\n```c\nx = y * 1000;\nz = 1000 - 12;\n\
  ```\n\n原始源文件并没有被更改，相反创建了一个临时副本。注意，`#define` 并不限于创建符号常量。例如，你可以写：\n\n```c\n#define\
  \ ZINGBOFFLE printf(\"Hello, world.\");\n```\n\n尽管没有理由这样做。\n\n### 使用 #define 创建函数宏\n\
  \n你也可以使用 `#define` 指令来创建函数宏。函数宏是一种简写类型，使用简单的内容表示更复杂的内容。之所以称为“函数”，是因为这种类型的宏可以接受参数，就像真正的\
  \ C 函数一样。函数宏的一个优点是它们的参数不是类型敏感的。因此，你可以将任何数值类型传递给期望数值参数的函数宏。\n\n现在看一个例子。预处理器指令\n\n\
  ```c\n#define HALFOF(value) ((value)/2)\n```\n\n定义了一个名为 `HALFOF` 的宏，它接受名为 `value`\
  \ 的参数。每当预处理器在源代码中遇到 `HALFOF(value)` 时，它就会替换为定义文本并根据需要插入参数。因此，源代码行\n\n```c\nresult\
  \ = HALFOF(10);\n```\n\n被替换为：\n\n```c\nresult = ((10)/2);\n```\n\n同样，程序行\n\n```c\n\
  printf(\"%f\", HALFOF(x[1] + y[2]));\n```\n\n被替换为：\n\n```c\nprintf(\"%f\", ((x[1]\
  \ + y[2])/2));\n```\n\n一个宏可以有多个参数，并且每个参数在替换文本中可以使用多次。例如，下面这个计算五个数值平均值的宏有五个参数：\n\n\
  \n\n\n\n点击此处查看代码图像\n\n```c\n#define AVG5(v, w, x, y, z) (((v)+(w)+(x)+(y)+(z))/5)\n\
  ```\n\n接这个宏使用了条件运算符来确定两个值中的较大者，它还对它的每个参数都使用了两次。（你已经在第 4 节中学习过条件运算符，即“C 程序的组成部分：语句、表达式和运算符”。）\n\
  \n点击此处查看代码图像\n\n```c\n#define LARGER(x, y) ((x) > (y) ? (x) : (y))\n```\n\n宏可以拥有任意数量的参数，但列表中的所有参数都必须在替换字符串中使用。例如，这个宏定义：\n\
  \n点击此处查看代码图像\n\n```c\n#define ADD(x, y, z) ((x) + (y))\n```\n\n是无效的，因为参数 `z` 没有在替换字符串中使用。此外，当你调用宏时，必须向它传递正确数量的参数。\n\
  \n当你编写宏定义时，左括号必须紧跟在宏名后面；不能有任何空格。左括号告诉预处理器正在定义的是一个函数宏，而不是一个简单的符号常量类型替换。看下面的定义：\n\n\
  点击此处查看代码图像\n\n```c\n#define SUM (x, y, z) ((x)+(y)+(z))\n```\n\n由于 `SUM` 和 `(` 之间存在空格，预处理器将其视为一个简单的替换宏。源代码中\
  \ `SUM` 的每一个出现处都会被替换为 `(x, y, z) ((x)+(y)+(z))`，这显然不是你想要的。\n\n还要注意，在替换字符串中，每个参数都被括在括号内。这对于避免在将表达式作为参数传递给宏时产生意外的副作用是必要的。看下面这个没有带括号定义的宏示例：\n\
  \n```c\n#define SQUARE(x) x*x\n```\n\n如果你用一个简单的变量作为参数调用这个宏，那没有问题。但如果你传递一个表达式作为参数会呢？\n\
  \n```c\nresult = SQUARE(x + y);\n```\n\n生成的宏展开如下，这并没有得到正确的结果：\n\n```c\nresult =\
  \ x + y * x + y;\n```\n\n如果你使用括号，就可以避免这个问题，正如这个示例所示：\n\n```c\n#define SQUARE(x)\
  \ (x)*(x)\n```\n\n该定义展开为下面这一行，它得到了正确的结果：\n\n```c\nresult = (x + y)*(x + y);\n```\n\
  \n你可以通过使用字符串化运算符（`#`）（有时称为字符串字面量运算符）在宏定义中获得额外的灵活性。当替换字符串中的宏参数前面有 `#` 时，该参数在宏展开时会被转换为一个带引号的字符串。因此，如果你定义一个宏为：\n\
  \n```c\n#define OUT(x) printf(#x)\n```\n\n并用以下语句调用它：\n\n```c\nOUT(Hello Mom);\n\
  ```\n\n它将展开为该语句：\n\n```c\nprintf(\"Hello Mom\");\n```\n\n字符串化运算符执行的转换考虑了特殊字符。因此，如果参数中的字符通常需要转义字符，`#`\
  \ 运算符会在该字符前插入一个反斜杠。继续上面的示例，调用\n\n```c\nOUT(\"Hello Mom\");\n```\n\n展开为\n\n```c\n\
  printf(\"\\\"Hello Mom\\\"\");\n```\n\n`#` 运算符在列表 22.4 中进行了演示。首先，你需要查看宏中使用的另一个运算符，连接运算符（`##`）。该运算符在宏展开中连接或合并两个字符串。它不包含引号或对转义字符的特殊处理。它的主要用途是创建\
  \ C 源代码序列。例如，如果你定义并调用一个宏如下：\n\n```c\n#define CHOP(x) func ## x\n```\n\n```c\nsalad\
  \ = CHOP(3)(q, w);\n```\n\n第二行中调用的宏展开为：\n\n```c\nsalad = func3 (q, w);\n```\n\n\
  你可以看到，通过使用 `##` 运算符，你决定了调用哪个函数。你实际上修改了 C 源代码。\n\n列表 22.4 展示了一种使用 `#` 运算符的方法示例。\n\
  \n输入 ![Image](img/down-arrow.jpg)\n\n**列表 22.4**  macrorepl.c: 在宏展开中使用 `#` 运算符\n\
  \n点击此处查看代码图像\n\n* *\n\n```c\n1:  // macrorepl.c--演示了宏展开中的 # 运算符。\n2:\n3:  #include\
  \ <stdio.h>\n4:\n5:  #define OUT(x) printf(#x \" is equal to %d.\\n\", x)\n6:\n\
  7:  int main( void )\n8:  {\n9:    int value = 123;\n10:   OUT(value);\n11:   return(0);\n\
  12: }\n```\n\n* *\n\n输出 ![Image](img/down-arrow.jpg)\n\n* *\n\nvalue is equal to\
  \ 123. \n\n分析 ![Image](img/down-arrow.jpg)\n\n* *\n\nvalue is equal to 123. \n\n\
  ![Image](img/down-arrow.jpg)\n\n* *\n\n点击此处查看代码图像\n\n```c\nprintf(\"value\" is equal\
  \ to %d.\\n\", value);\n```\n\n\n\n\n指定要包含的文件的第二种方法是将文件名包含在双引号中：`#include \"myfile.h\"\
  `。在这种情况下，预处理器不会搜索标准目录；相反，它会在正在编译的源文件所在的目录中查找。通常情况下，你编写的头文件应该与 C 源代码文件保存在同一个目录中，并使用双引号对其进行包含。标准目录留给由编译器提供的头文件。\n\
  \n## 使用 #if, #elif, #else 和 #endif\n\n这四个预处理器指令控制着条件编译。*条件编译*一词意味着只有在满足某些条件时，C 源代码块才会被编译。在许多方面，`#if`\
  \ 族预处理器指令的工作方式类似于 C 语言的 `if` 语句。区别在于，`if` 控制某些语句是否被执行，而 `#if` 控制这些语句是否被编译。\n\n`#if`\
  \ 块的结构如下：\n\n点击此处查看代码图像\n\n```\n#if condition_1\n  statement_block_1\n#elif condition_2\n\
  \  statement_block_2\n  ...\n#elif condition_n\n  statement_block_n\n#else\n  default_statement_block\n\
  #endif\n```\n\n`#if` 使用的测试表达式几乎可以是任何求值为常数的表达式。你不能使用 `sizeof()` 运算符、类型转换或 `float`\
  \ 类型。通常情况下，你使用 `#if` 来测试用 `#define` 指令创建的符号常量。\n\n每个 `statement_block` 由一个或多个任意类型的\
  \ C 语句组成，包括预处理器指令。它们不需要包含在大括号中，尽管可以包含。\n\n`#if` 和 `#endif` 指令是必须的，但 `#elif` 和 `#else`\
  \ 是可选的。你可以有任意数量的 `#elif` 指令，但只有一个 `#else`。当编译器遇到 `#if` 指令时，它会测试关联条件。如果结果为 `TRUE`（非零），则编译\
  \ `#if` 后的语句。如果结果为 `FALSE`（零），编译器将顺序测试每个 `#elif` 指令关联的条件。第一个 `TRUE #elif` 关联的语句将被编译。如果没有条件求结果为\
  \ `TRUE`，则编译 `#else` 指令后的语句。\n\n注意，在情况下，`#if...#endif` 结构中最多只有一个语句块会被编译。如果编译器没有找到\
  \ `#else` 指令，它可能不会编译任何语句。\n\n这些条件编译指令的可能用途仅限于你的想象。这里有一个例子：假设你正在编写一个使用大量国家特定信息的程序。这些信息包含在每个国家的头文件中。当你为不同的国家编译程序时，你可以像下面所示所示使用\
  \ `#if...#endif` 结构：\n\n```\n#if ENGLAND == 1\n#include \"england.h\"\n#elif FRANCE\
  \ == 1\n#include \"france.h\"\n#elif ITALY == 1\n#include \"italy.h\"\n#else\n#include\
  \ \"usa.h\"\n#endif\n```\n\n然后，通过使用 `#define` 定义适当的符号常量，你可以控制在编译期间包含哪个头文件。\n\n##\
  \ 使用 #if...#endif 帮助调试\n\n`#if...#endif` 的另一个常见用途是在程序中包含条件调试代码。你可以定义一个设置为 `1` 或\
  \ `0` 的 `DEBUG` 符号常量。在整个程序中，你可以如下所示插入调试代码：\n\n```\n#if DEBUG == 1\n  debugging code\
  \ here\n#endif\n```\n\n在程序开发期间，如果你定义 `DEBUG` 为 `1`，则会包含调试代码以帮助跟踪任何错误。在程序正常运行后，你可以将\
  \ `DEBUG` 重新定义为 `0` 并重新编译程序，不再包含调试代码。\n\n在编写条件编译指令时，`defined()` 运算符非常有用。该运算符测试特定名称是否已定义。因此，表达式\n\
  \n`defined( NAME )`\n求结果为 `TRUE` 或 `FALSE`，取决于 `NAME` 是否被定义。通过使用 `defined()`，你可以根据之前的定义来控制编译，而不必考虑名称的具体值。参考之前的调试代码示例，你可以如下重写\
  \ `#if...#endif` 部分：\n\n```\n#if defined( DEBUG )\n  debugging code here\n#endif\n\
  ```\n\n你也可以使用 `defined()` 仅在某个名称之前未被定义时，才为该名称分配一个定义。如下所示使用 `NOT` 运算符（`!`）：\n\n点击此处查看代码图像\n\
  \n```\n#if !defined( TRUE )     /* 如果 TRUE 未被定义。 */\n#define TRUE 1\n#endif\n```\n\
  \n注意，`defined()` 运算符并不要求名称被定义为特定的内容。例如，在以下程序行之后，名称 `RED` 被定义了，但并不是任何特定的内容：\n\n```\n\
  #define RED\n```\n\n尽管如此，表达式 `defined( RED )` 仍然求结果为 `TRUE`。当然，源代码中 `RED` 的出现会被移除且不替换为任何内容，因此你必须小心。\n\
  \n## 避免头文件的多次包含\n\n随着程序的增长，或者当你更频繁地使用头文件时，你会面临不小心多次包含头文件的风险。这可能导致编译器产生困惑。使用你学过的指令，你可以轻松地避免这种情况。查看\
  \ `22.5` 中的示例。\n\n**列表 22.5：prog.h：使用预处理器指令头文件**\n\n点击此处查看代码图像\n\n```\n// 用于防止重复包含的\
  \ prog.h\n#if defined( prog_h )\n  // 文件已经包含过了\n#else\n  #define prog_h\n  // 头信息在这里...\n\
  #endif\n```\n\n检查此头文件做了什么。在第 3 行，它检查 `prog_h` 是否定义。它没有，因此跳转到 `#else` 语句。在 `#else`\
  \ 之后的第一件事是定义 `prog_h`，这样后续的包含将跳过主体。第 7 到 11 行可以包含任意的命令或声明。\n\n> **提示**：你应该在你创建的所有头文件中包含如\
  \ `22.5` 所示的预处理器检查。这可以防止它们被多次包含。\n\n## #undef 指令\n\n`#undef` 指令与 `#define` 相反；它移除名称的定义。这是一个示例：\n\
  \n点击此处查看代码图像\n\n```\n#define DEBUG 1\n//程序的此部分，DEBUG 的出现\n// 被替换为 1，表达式 defined(\
  \ DEBUG ) 为 TRUE。\n\n#undef DEBUG\n//程序的此部分，DEBUG 的出现\n// 不会被替换，表达式 defined( DEBUG\
  \ ) 为 FALSE。\n```\n\n你可以使用 `#undef` 和 `#define` 创建一个仅在源代码部分定义的名称。你可以像前面解释的那样结合 `#if`\
  \ 指令使用，对条件编译进行更多控制。\n\n### 预定义宏\n\n大多数编译器都有许多预定义宏。其中最有用的是 `_ _DATE_ _`、`_ _TIME_\
  \ _`、`_ _LINE_ _` 和 `_ _FILE_ _`。注意，每个这些宏的前后都有双下划线。这样做是为了防止你重新定义它们，理论上程序员不太可能创建带有开头和结尾下划线的自定义定义。\n\
  \n\n\n\n这些宏的工作方式与本节之前描述的宏相同。当预处理器遇到这些宏之一时，它会将宏替换为该宏的代码。`_DATE_` 和 `_TIME_` 会被替换为当前的日期和时间。这是源文件预编译时的日期和时间。在处理不同版本的程序时，这些信息非常有用。通过让程序显示其编译日期和时间，你可以判断运行的是程序的最新版本还是早期的版本。\n\
  \n另外两个宏更有价值。`_LINE_` 会被替换为当前源文件的行号，`_FILE_` 会被替换为当前源代码的文件。在调试程序或处理错误时，这两个宏是最佳选择。考虑以下\
  \ `printf()` 语句：\n\n点击此处查看代码图像\n\n```\n31:\n32: printf( \"Program %s: (%d) Error\
  \ opening file \", _FILE__, _LINE_ );\n33:\n```\n\n如果这些行是一个名为 `myprog.c` 的程序的一部分，它们将打印出\n\
  \n点击此处查看代码图像\n\nProgram myprog.c: (32) Error opening file\n\n这在目前似乎并不重要，但随着你的程序增长并跨越多个源文件，寻找错误会变得更加困难。使用\
  \ `_LINE_` 和 `_FILE_` 会调试变得简单得多。\n\n***\n\n## Do\n\n**务必**使用 `_LINE_` 和 `_FILE_`\
  \ 宏让你的错误信息更有帮助。\n\n**务必**给传递给宏的值加上括号。这可以防止错误。例如，使用这种写法：\n\n```c\n#define CUBE(x)\
  \   (x)*(x)*(x)\n```\n\n而不是这种写法：\n\n```c\n#define CUBE(x)   x*x*x\n```\n\n***\n\n\
  ## Don’t\n\n**不要**在使用 `#if` 语句时忘记 `#endif`。\n\n***\n\n## 使用命令行参数\n\n你的 C 程序可以访问通过命令行传递给程序的参数。这指的是启动程序时，在程序名之后输入的信息。例如，如果你在\
  \ `C:\\>` 提示符下启动名为 `progname` 的程序，你可以输入\n\n```cmd\nC:\\>progname smith jones\n```\n\
  \n这两个命令行参数 `smith` 和 `jones` 可以在程序执行期间被程序获取。你可以将这些信息视为传递给程序 `main()` 函数的参数。此类命令行参数允许在程序启动时而不是执行期间向程序传递信息，这在有时非常方便。你可以传递任意数量的命令行参数。注意，命令行参数只能在\
  \ `main()` 中获取。要做到这一点，请如下方式声明 `main()`：\n\n```c\nmain(int argc, char *argv[])\n\
  {\n    /* 语句在此处 */\n}\n```\n\n第一个参数 `argc` 是一个整数，表示可用命令行参数的数量。该值至少为 `1`，因为程序名被算作第一个参数。参数\
  \ `argv[]` 是一个指向字符串的指针数组。该数组的有效下标从 `0` 到 `argc - 1`。指针 `argv[0]` 指向程序名（包括路径信息），`argv[1]`\
  \ 指向程序名后的第一个参数，依此类推。注意，`argc` 和 `argv[]` 的名称并不是必须的——你可以使用任何喜欢的有效 C 变量名来接收命令行参数。然而，这两个名称传统上用于此目的，所以你可能应该坚持使用它们。\n\
  \n命令行通过任何空白字符划分为不同的参数。如果你需要传递一个包含空格的参数，请将整个参数括在双引号中。例如，如果你输入\n\n```cmd\nC:>progname\
  \ smith \"and jones\"\n```\n\n`smith` 是第一个参数（由 `argv[1]` 指向）；`and jones` 是第二个（由\
  \ `argv[2]` 指向）。列表 22.6 展示了如何在程序中访问命令行参数。\n\n**列表 22.6** `commandargs.c`: 向 `main()`\
  \ 传递命令行参数\n\n点击此处查看代码图像\n\n***\n\n```c\n1:  // commandargs.c-- 访问命令行参数。\n2:\n3:\
  \  #include <stdio.h>\n4:\n5:  int main(int argc, char *argv[])\n6:  {\n7:     \
