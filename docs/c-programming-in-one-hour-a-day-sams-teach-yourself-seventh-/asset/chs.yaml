  \ 的大小等于 `int` 的大小。\n\n### 注意\n\n表 3.2 中列出的关键字用于变量声明，我们将在下一节中讨论。\n\n### 变量声明\n\n\
  在你可以使用一个变量之前，它必须被声明。变量声明告诉编译器变量名称和类型。如果你的程序尝试使用未声明的变量，编译器会生成错误信息。变量声明具有以下形式：\n\n\
  `typename varname;`\n\n`typename` 指定变量类型，必须是表 3.2 中的关键字之一。你可以通过逗号分隔变量名在同一行声明多个相同类型的变量：\n\
  \n```c\nint count, number, start; /* 三个整数变量 */\nfloat percent, total; /* 两个浮点变量\
  \ */\n```\n\n在第 12 节中，你了解到变量声明在源代码的位置很重要，因为它影响了程序使用变量的方式。现在你可以将所有变量声明放在 `main()`\
  \ 函数之前。\n\n### typedef 关键字\n\n`typedef` 关键字用于为现有数据类型创建新名称。本质上，`typedef` 创建了一个别名。例如，语句\n\
  \n`typedef int integer;`\n\n创建 `integer` 作为 `int` 的别名。你就可以可以使用 `integer` 来定义 `int`\
  \ 类型的变量，如下所示：\n\n```c\ninteger count;\n```\n\n注意 `typedef` 并没有创建新的数据类型；它允许你对预定义数据类型使用不同的名称。`typedef`\
  \ 最常用的用法涉及聚合数据类型，正如第 11 节](#ch11.xhtml_ch11)中“实现结构、联合体和类型定义”所解释的。聚合数据类型由本节介绍的数据类型的组合组成。\n\
  \n### 初始化变量\n\n当你声明变量时，你指示编译器为变量留出存储空间。然而，存储在该空间中的值——即变量的值——是没有定义的。它可能是 0，也可能是某些随机的“垃圾”值。在使用变量之前，你应该始终将其初始化为一个已知值。你可以通过使用赋值语句独立于变量定义来实现这一点，如下所示：\n\
  \n\n\n\n```c\nint count;   //为 count 分配存储空间\ncount = 0;   //将 0 存储在 count 中\n```\n\
  \n注意此语句使用了等号（=`），它是 C 语言的赋值运算符，将在第 4 中的“C 程序的组成：语句、表达式和运算符”中进一步讨论。目前，你需要意识到编程中的等号与代数中的等号是不相同的。如果你写下：\n\
  \n```c\nx = 12\n```\n\n在代数式中，你是在陈述一个事实：“x 等于 12”。但在 C 中，它的意思完全不同。在 C 中，它的意思是“将值\
  \ `12` 赋值给名为 `x` 的变量”。\n\n你也可以声明变量时对其进行初始化。这样做请在声明语句的变量名后加上等号和所需的初始值：\n\n点击查看代码图像\n\
  \n```c\nint count = 0;\ndouble percent = 0.01, taxrate = 28.5;\n```\n\n第一个语句声明了一个名为\
  \ `count` 的整型变量并将其初始化为 `0`。第二个语句声明了两个 `double` 类型变量并对它们进行了初始化。第一个 `percent` 被初始化为\
  \ `0.01`。第二个 `taxrate` 被初始化为 `28.5`。\n\n注意不要用允许范围的值初始化变量。以下是两个超出范围的初始化示例：\n\n```c\n\
  short weight = 100000;\nunsigned int value = -2500;\n```\n\nC 编译器可能不会捕捉此类错误。你的程序可能会编译并链接，但在程序运行时你可能会得到意想不到的结果。\n\
  \n***\n\n### 应当 (Do)\n\n- **务必**了解变量类型在你的计算机中所占的字节数。\n- **应当**使用 `typedef` 让你的程序更具可读性。\n\
  - **尽可能**在声明变量时就对其进行初始化。\n\n***\n\n### 不要 (Don’t)\n\n- **不要**使用未初始化的变量。结果可能是不可预测的。\n\
  - 如果你只存储整数，**不要**使用 `float` 或 `double` 变量。尽管它们可以工作，但使用它们效率低下。\n- 如果变量的类型无法容纳，**不要**尝试将太大或太小的数字放入变量中。\n\
  - **不要**将负数放入 `unsigned` 类型的变量中。\n\n***\n\n### 常量 (Constants)\n\n与变量类似，*常量*（constant）是程序使用的数据存储位置。与变量不同，常量中存储的值在程序执行期间不能更改。C\
  \ 语言有两种类型的常量，每种都有其特定的用途：\n\n![Image](img/squf.jpg) 字面常量\n\n![Image](img/squf.jpg)\
  \ 符号常量\n\n#### 字面常量 (Literal Constants)\n\n*字面常量*（literal constant）是在需要的地方直接输入到源代码中的值。以下是两个示例：\n\
  \n```c\nint count = 20;\nfloat tax_rate = 0.28;\n```\n\n`20` 和 `0.28` 是字面常量。前面的语句将这些值存储在变量\
  \ `count` 和 `tax_rate` 中。注意，这些常量中有一个包含一个小数点，而另一个没有。小数点的存在与否区分了浮点型常量和整型常量。\n\n带有小数点的字面常量是浮点型常量，并被\
  \ C 编译器表示为双精度数。浮点型常量可以使用标准的十进制表示法，如这些示例所示：\n\n```\n123.456\n0.019\n100.\n```\n\n\
  注意第三个常量 `100.` 即使它是一个整数，也带有小数点书写的。（也就是说，它没有小数部分。）小数点会导致 C 编译器将该常量视为双精度值。如果没有小数点，它被视为整型常量。\n\
  \n浮点型常量还可以用科学计数法表示。你可能在高中数学中回想起过科学计数法将一个数表示为小数部分乘以 10 的正幂或负幂。科学计数法在表示极大和极小的值时特别有用。在\
  \ C 中，科学计数法写为一个小数数字，后面紧跟一个 `E` 或 `e` 以及指数：\n\n![Image](img/p0047_01.jpg)\n\n一个不带小数点的常量被编译器表示为整数。整型常量可以用三种不同的表示法编写：\n\
  \n![Image](img/squf.jpg) 以任何非 0 数字开头的常量被解释为十进制整数（即标准的十进制计数系统）。十进制常量可以包含数字 0 到 9\
  \ 以及一个开头的负号或正号。（如果没有开头的负号或正号，则假设常量为正数。）\n\n![Image](img/squf.jpg) 以数字 0 开头的常量被解释为八进制整数（八进制计数系统）。八进制常量可以包含数字\
  \ 0 到 7 以及一个开头的负号或正号。\n\n![Image](img/squf.jpg) 以 0x 或 0X 开头的常量被解释为十六进制常量（十六进制计数系统）。十六进制常量可以包含数字\
  \ 0 到 9、字母 A 到 F 以及一个开头的负号或正号。\n\n#### 符号常量 (Symbolic Constants)\n\n*符号常量*（symbolic\
  \ constant）是通过名称（符号）表示的常量。与变量不同，常量中存储的值在程序执行期间不能更改。C 语言有两种类型的常量，每种都有其特定的用途：\n\n\n\
  \n\n注意`#define` 行并不以分号（`;`）结尾。`#define` 语句可以放在源代码的任何地方，但定义的常量仅对该 `#define` 指令之后的源代码部分有效。最常见的情况下，程序员会将所有的\
  \ `#define` 语句放在一起，通常位于文件开头且 `main()` 函数开始之前。\n\n### #define 是如何工作的\n`#define` 指令的精确操作是指示编译器执行如下：“在源代码中，将\
  \ `CONSTNAME` 替换为字面量。”其效果与你使用编辑器遍历源代码并手动进行更改完全相同。注意，`#define` 不替换作为较长名称的一部分、双引号内或程序注释一部分的目标实例。例如，在以下代码中，第二行和第三行中的\
  \ `PI` 实例将不会被更改：\n\n点击此处查看代码图像\n\n```c\n#define PI 3.14159\n\n/* You have defined\
  \ a constant for PI. */\n\n#define PIPETTE 100\n```\n\n***\n\n注意\n`#define` 指令是\
  \ C 语言的预处理器指令之一，在第 22 “高级编译的使用”中会有更详细的讨论。\n\n***\n\n### 使用 const 关键字定义常量\n定义符号常量的第二方法是使用\
  \ `const` 关键字。`const` 是可以应用于任何变量声明的修饰符。声明为 `const` 的变量在程序执行时不能被修改。值在声明时初始化，然后被禁止更改。以下是一些示例：\n\
  \n点击此处查看代码图像\n\n```c\nconst int count = 100;\n\nconst float pi = 3.14159;\n\nconst\
  \ long debt = 12000000, float tax_rate = 0.21;\n```\n\n`const` 影响声明行上的所有变量。在最后一行中，`debt`\
  \ 和 `tax_rate` 是符号常量。顺便提一下，在这个示例中，`debt` 被声明为 `long`，而 `tax_rate` 被声明为 `float`。\n\
  \n如果你的程序尝试修改 `const` 变量，编译器会生成错误消息。以下代码将产生错误：\n\n点击此处查看代码图像\n\n```c\nconst int count\
  \ = 100;\n\ncount = 200;      /* 无法编译！不能重新分配或更改 */\n               /* 常量的值 */\n\
  ```\n\n使用 `#define` 指令创建的符号常量与使用 `const` 关键字创建的常量之间有什么实际区别？这些区别涉及到指针和变量作用域。指针和变量作用域是\
  \ C 编程的两个重要方面，你可以在第 9 节“理解指针”以及第 12 节中学习它们。\n\n现在来看一个演示变量声明以及字面量和符号常量使用的程序。代码列表\
  \ 3.2 提示你输入跑步的圈数和出生年份。它会计算并显示你覆盖的英里数和今年的年龄。你可以使用第 1 节“开始 C 语言”中的步骤来输入、编译并运行此程序。\n\
  \n***\n\n注意\n如今大多数 C 程序员在声明常量时使用 `const` 而不是 `#define`。\n\n***\n\n输入 ![Image](img/down-arrow.jpg)\n\
  \n**列表 3.2** const.c - 一个演示变量和常量使用的程序\n\n点击此处查看代码图像\n\n***\n\n```c\n1:   /* 演示变量和常量\
  \ */\n2:     #include <stdio.h>\n3:\n4:     /* 定义一个常量将圈数转换为英里 */\n5:     #define\
  \ LAPS_PER_MILE 4\n6:\n7:     /* 定义当前年份的常量 */\n8:     const int CURRENT_YEAR = 2013;\n\
  9:\n10:    /* 声明所需的变量 */\n11:    float miles_covered;\n12:    int laps_run, year_of_birth,\
  \ current_age;\n13:\n14:    int main( void )\n15:    {\n16:        /* 从用户处输入数据 */\n\
  17:\n18:        printf(\"How many laps did you run \");\n19:        scanf(\"%d\"\
  , &laps_run);\n20:        printf(\"Enter your year of birth: \");\n21:        scanf(\"\
  %d\", &year_of_birth);\n22:\n23:        /* 执行转换 */\n24:        miles_covered = (float)laps_run/LAPS_PER_MILE;\n\
  25:        current_age = CURRENT_YEAR - year_of_birth;\n26:\n27:        /* 在屏幕上显示结果\
  \ */\n28:        printf(\"\\nYou ran %.2f miles\", miles_covered);\n29:        printf(\"\
  \\nNot bad for turning %d this year!\\n\", current_age);\n30:\n31:        return\
  \ 0;\n32:    }\n```\n\n\n\n\n本节探讨了数值变量，C 程序在执行期间使用它们来存储数据。你已经看到数值变量大致分为两类：整数型和浮点型。在每类中都有特定的变量类型。对于特定的应用程序，使用哪种变量类型（如\
  \ `int`、`long`、`float` 或 `double`）取决于要存储在变量中的数据性质。你还看到在 C 程序中，必须在使用变量之前对其进行声明。变量声明告知编译器变量的名称和类型。\n\
  \n你还学习了 C 的两种常量类型：字面量常量和符号常量。与变量不同，常量的值在程序执行期间不能改变。每当需要值时，你直接在源代码中输入字面量常量。符号常量被分配一个名称，在需要该常量值的地方使用该名称。可以使用\
  \ `#define` 指令或 `const` 关键字创建符号常量。\n\n### 问答\n\nQ 为什么不不总是使用较大的变量（如 `long int` 和\
  \ `double`）而不是 `int` 和 `float` 变量，这样就可以存储更大的数字了？\n\nA `long int` 变量占用的 RAM 比较小的\
  \ `int` 多。在较小的程序中，这不是问题。然而，随着程序变得越来越大，你应该尝试高效地使用内存内存。如果你认为用户将输入大于 `int` 或 `long`\
  \ 最大尺寸的数字，请进行必要的调整，但请记住，即使用户输入的数字落在较小变量尺寸的范围内，你进行的任何数学运算（包括加法或乘法）都可能产生超出范围的结果。\n\
  \nQ 如果我给整数赋值一个带小数的数字会发生什么？\n\nA 你可以将带小数的数字赋值给 `int` 变量。如果你使用常量变量，编译器可能会给出一个警告。所赋值的值将截断小数部分。例如，如果你将\
  \ `3.14` 赋值给名为 `pi` 的整数变量，`pi` 将只包含 `3`。`.14` 将被切掉并丢弃。\n\nQ 如果我将一个数字放入一个无法容纳它的类型中会发生什么？\n\
  \nA 许多编译器允许这样做而不发出任何错误。数字会溢出以适应空间，因此结果将是不正确的。例如，如果你将 `32768` 赋值给类型为 `short` 的 2\
  \ 字节符号变量，该变量实际上将包含值 `–32768`。如果你给该变量赋值 `65535`，它实际上包含值 `–1`。通过减去该字段能容纳的最大值，通常就能得到将存储的值。\n\
  \nQ 如果我将负数放入无符号变量中会发生什么？\n\nA 正如前一个回答所示，如果你这样做，编译器可能不会发出任何错误。编译器执行的溢出处理与你赋值一个过大的数字是一样的。例如，如果你将\
  \ `–1` 赋值给一个 2 字节长的无符号 `int` 变量，编译器会在变量中放入尽可能最大的数字（`65535`）。\n\nQ 使用 `#define` 指令创建的符号常量与使用\
  \ `const` 关键字创建的符号常量有什么实践上的区别？\n\nA 区别在于指针和变量作用域。指针和变量作用域是 C 编程的两个重要方面，将在第 9 节和第\
  \ 12 节中介绍。\n\n### 工作坊\n\n工作坊提供了测验帮助你巩固对所涵盖内容的理解，并提供了练习让你获得使用所学知识的经验。\n\n#### Quiz\n\
  \n1. 整数变量和浮点变量之间有什么区别？\n\n2. 给出使用双精度浮点变量（类型 `double`）而不是单精度浮点变量（类型 `float`）的两个理由。\n\
  \n3. 在为变量分配大一时，你知道哪五条规则总是成立的？\n\n4. 使用符号常量代替字面量常量的两个优点是什么？\n\n5. 展示两种定义名为 `MAXIMUM`\
  \ 值为 `100` 的符号常量的方法。\n\n6. C 变量名中允许哪些字符？\n\n7. 在创建变量和常量名称时，你应该遵循哪些指南？\n\n8. 符号常量和字面量常量之间有什么区别？\n\
  \n9. `int` 可以内容的最小值是多少？\n\n#### Exercises\n\n1. 用什么类型最适合存储以下内容？\n\na. 最近\nb. 朋友的数量。\n\
  c. 半径。\nd. 年薪。\ne. 成本。\nf. 假设为 100。\ng. 初始。\nh. 温度。\ni. 净值。\nj. 距离。\n\n2. 为第 1 题确定变量名。\n\
  \n3.为第 2 题编写声明。\n\n4. 以下哪些变量名是有效的？\n\na. `123variable`\nb. `x`\nc. `total_score`\n\
  d. `Weight#s`\ne. `one`\nf. `gross-cost`\ng. `RADIUS`\nh. `Radius`\ni. `radius`\n\
  j. `this_is_a_variable_to_hold_the_width`\n\n## 第 4 节 C 程序的组成：语句、表达式和运算符\n\nC 程序由语句组成，大多数语句由表达式和运算符组成。编写\
  \ C 程序需要理解语句、表达式和运算符。在本节中，你将学习：\n\n![Image](img/squf.jpg) 什么是语句\n\n![Image](img/squf.jpg)\
  \ 什么是表达式\n\n![Image](img/squf.jpg) 如何使用数学、关系和逻辑运算符\n\n![Image](img/squf.jpg) 什么是运算符优先级\n\
  \n![Image](img/squf.jpg) `if` 语句\n\n### 语句\n\n*语句*是指导计算机执行某些任务的完整指令。在 C 中，语句通常一行一个，尽管有些语句跨多行。C\
  \ 语句始终以分号结束（预处理器指令如 `#define` 和 `#include` 除外，这些将在第 22 节“高级编译器使用””中讨论）。你已经接触了一些\
  \ C 的语句类型，例如：\n\n`x = 2 + 3;`\n\n这是一个赋值语句。它指示计算机将 `3` 加 `2` 的结果赋值给变量 `x`。其他类型的语句将在书中需要时介绍。\n\
  \n#### 空格对语句的影响\n\n*空格*指的是源代码中的空格、水平制表符、垂直制表符和空行。C 编译器对空格不敏感。当编译器读取源代码中的语句时，它会寻找语句中的字符和终止分号，但会忽略空格。因此，语句\n\
  \n```\nx=2+3;\n```\n\n等同于这条语句：\n\n```\nx = 2 + 3;\n```\n\n也等同于这个：\n\n```\nx       =\n\
  2\n\n       +\n\n3       ;\n```\n\n\n\n这为你格式化源代码提供了极大的灵活性。你不应该使用像上一个示例那样的格式。语句应该每行一个，并对变量和操作符周围的间留采用标准的方案。如果你遵循本书书中使用的格式约定，那么你的情况将会很顺利。随着你经验的增加，你可能会发现自己更倾向于细微的差异。关键在于保持你的源代码的可读性。\n\
  \nC 语言不忽略空白字符的规则有一个例外。在字面量字符串常量内部，制表符和空格不会被忽略；它们被视为字符串的一部分。一个 `string` 是字符的序列。字面量字符串常量是包含在引号内并由编译器字面地解释的字符串，一个空格对应一个空格。字面量字符串的一个示例是：\n\
  \n\"How now brown cow\"\n\n这个字面量字符串与以下不同：\n\n\"How    now    brown      cow\"\n\n\
  这种差异是由于额外的空格导致的。对于字面量字符串，C 会跟踪空白字符。\n\n尽管这种做法非常糟糕，但以下代码在 C 中是合法的：\n\n```\nprintf(\n\
  \n\"Hello, world!\"\n);\n```\n\n然而，这种是不合法的：\n\n```c\nprintf(\"Hello,\n\nworld!\"\
  );\n```\n\n要折断字面量字符串常量行，你必须在换行之前使用反斜杠字符（`\\`）。因此，以下内容是合法的：\n\n```c\nprintf(\"Hello,\\\
  \n\nworld!\");\n```\n\n## 创建空语句\n\n如果你在某行单独放置一个分号，你就创建了一个 `null statement`（空语句）。空语句是不执行任何操作的语句。这在\
  \ C 语言中是完全合。在本书的后面部分，你将学习空语句如何有用。\n\n## 编写复合语句\n\n`compound statement`（复合语句），也称为\
  \ `block`（块），是一组被大括号括起来的两个或多个 C 语句。这是一个块的示例：\n\n```c\n{\n    printf(\"Hello, \"\
  );\n    printf(\"world!\");\n}\n```\n\n在 C 中，块可以使用任何可以使用单个语句的地方。书中到处都有这样的示例。注意，闭合括号可以以不同的方式放置。以下内容与前一个示例等效：\n\
  \n```c\n{printf(\"Hello, \");\nprintf(\"world!\");}\n```\n\n将大括号放在单独的行上是一个好主意，使得块的开始和结束清晰可见。将大括号放在单独的行上也更容易看出你是否漏掉了一个。\n\
  \n***\n\n## 应当 (Do) \n\n- **要** 在语句中使用空白字符的方式上保持一致。\n- **要** 将块大括号放在单独的行上。这使得代码更容易读。\n\
  - **要** 对齐块大括号，以便于找到块的开始和结束。\n\n***\n\n## 不要 (Don’t) \n\n- **不要** 在没有需要的情况下将单个语句跨越多行。如果可能，请将语句限制在一行内。\n\
  - **不要** 忘记使用正斜杠将字符字符串延续到第二行。\n\n***\n\n## 理解表达式\n\n在 C 中，一个 `expression`（表达式）是任何求值为数值的内容。C\
  \ 表达式有各种复杂程度之分。\n\n### 简单表达式\n\n最简单的 C 表达式由单个项目组成：一个简单的变量、字面量常量或符号常量。这里有四个表达式：\n\
  \n![Image](img/060tab01.jpg)\n\n`literal constant`（字面量常量）求值为它自身的值。`symbolic constant`（符号常量）求值为当你使用\
  \ `#define` 指令创建它时赋予的值。变量求值为程序赋值给它的当前值。\n\n### 复杂表达式\n\n`Complex expressions`（复杂表达式）由操作符连接的简单表达式组成，例如：\n\
  \n`2 + 8`\n\n是一个由子表达式 `2` 和 `8` 以及加操作符 `+` 组成的表达式。正如你所知道的，表达式 `2 + 8` 求值为 `10`。你可以编写极其复杂的\
  \ C 表达式：\n\n点击查看代码图像\n\n`1.25 / 8 + 5 * rate + rate * rate / cost`\n\n当表达式包含多个操作符时，表达式的评估取决于操作符优先级。操作符优先的概念将在本节后面介绍，所有\
  \ C 操作符的细节也是如此。\n\nC 表达式可以变得更有趣。看下面的赋值语句：\n\n```c\nx = a + 10;\n```\n\n该语句对表达式 `a\
  \ + 10` 求值并将结果赋值给 `x`。此外，整个语句 `x = a + 10` 是一个表达式，求值为等号左侧变量的值。\n\n因此，你可以编写如下的语句，它将表达式\
  \ `a + 10` 的值同时赋值给变量 `x` 和 `y`：\n\n```c\ny = x = a + 10;\n```\n\n你也可以写像这样的语句：\n\n\
  ```c\nx = 6 + (y = 4 + 5);\n```\n\n该语句的结果是 `y` 的值为 `9`，`x` 的值为 `15`。注意括号，这是语句通过编译所必需的。括号的使用将在本节后面介绍。\n\
  \n***\n\n## 注意事项\n\n除了书中各处注的少数例外外，赋值语句不应嵌套在其他表达式中。\n\n***\n\n## 操作符\n\n`operator`（操作符）是一个指示\
  \ C 执行某些操作的符号。`operand`（操作数）是操作符作用的对象。在 C 中，所有操作数都是表达式。操作符分为几类：\n\n![Image](img/squf.jpg)\
  \ 赋值操作符\n![Image](img/squf.jpg) 数学操作符\n![Image](img/squf.jpg) 关系操作符\n![Image](img/squf.jpg)\
  \ 逻辑操作符\n\n### 赋值操作符\n\n操作符对一个或多个操作数执行某些操作。赋值操作符是等号（`=`）。它在编程中的用法与数学中不同。如果你写\n\n\
  ```c\nx = y;\n```\n\n在 C 程序中这并不意味着 `x` 等于 `y`。相反，它意味着“将 `y` 的值赋值给 `x`”。在赋值语句中，右侧可以是任何表达式，左侧必须是一个变量。因此，格式如下：\n\
  \n```c\nvariable = expression;\n```\n\n执行时，`expression` 求值并将结果赋值给 `variable`。\n\n\
  ### 数学操作符\n\nC 的数学操作符执行加法和减法等数学操作。它有两个元运算符和一个二运算符。\n\n#### 元数学操作符\n\n`unary mathematical\
  \ operators`（元数学操作符）之所以命名是因为它们只需要一个操作数。C 有两个元操作符，列在表 4.1](#ch04_xhtml_ch04tab1)中。\n\
  \n![Image](img/04tab01.jpg)\n\n**表 4.1** C 元数学操作符\n\n递增和递减运算符只能用于变量，不能用于常量。执行的操作是对操作数加一或减一。换句话说，语句\n\
  \n```c\n++x;\n--y;\n```\n\n等于这些语句：\n\n```c\nx = x + 1;\ny = y - 1;\n```\n\n参考表 4.1](#ch04_xhtml_ch04tab1)，你可以看到任何元操作符都可以放在其操作数之前（*前缀*模式）之后（*后缀*模式）。这两种模式并不等效。区别在于执行递增或递减的时机：\n\
  \n![Image](img/squf.jpg) 使用前缀模式时，递增和递减运算符在操作数用于包含表达式之前对其进行修改。\n\n![Image](img/squf.jpg)\
  \ 使用后缀模式时，递增和递减运算符在操作数用于包含表达式之后对其进行修改。\n\n一个示例应该让这一点更清楚。看这两个语句：\n\n```c\nx = 10;\n\
  y = x++;\n```\n\n执行这些语句后，`x` 的值为 `11`，`y` 的值为 `10`。`x` 的值被赋值给了 `y`，然后 `x` 递增了。相比之下，以下语句导致\
  \ `y` 和 `x` 的值为 `11`。`x` 递增了，然后将其值赋值给 `y`：\n\n```c\nx = 10;\ny = ++x;\n```\n\n\n\
  \n\n请记住 `=` 是赋值运算符，而不是等值语句。作为一个类比，可以将 `=` 想象为“复印”运算符。语句 `y = x` 意味着将 `x` 复制到 `y`。在复制完成后，对\
  \ `x` 的后续更改对 `y` 没有任何影响。\n\n列表 4.1 中的程序说明了前缀模式和后缀模式之间的区别。\n\n输入 ![Image](img/down-arrow.jpg)\n\
  \n**列表 4.1** unary.c：演示前缀和后置模式\n\n点击此处查看代码图像\n\n* * *\n\n```c\n1:  /* 演示一元运算符的前缀和后置模式\
  \ */\n2:\n3:  #include <stdio.h>\n4:\n5:  int a, b;\n6:\n7:  int main( void )\n\
  8:  {\n9:      // 将 a 和 b 设置为 0 开始\n10:         a = b = 0;\n11:\n12:         //\
  \ 从增量运算符开始\n13:         // 打印它们，每次递减一次。\n14:         // b 使用前缀模式，a 使用后置模式\n15:\n\
  16:         printf(\"Count up!\\n\");\n17:         printf(\"Post     Pre\\n\");\n\
  18:         printf(\"%d      %d\\n\", a++, ++b);\n19:         printf(\"%d      %d\\\
  n\", a++, ++b);\n20:         printf(\"%d      %d\\n\", a++, ++b);\n21:         printf(\"\
  %d      %d\\n\", a++, ++b);\n22:         printf(\"%d      %d\\n\", a++, ++b);\n\
  23:\n24:         printf(\"\\nCurrent values of a and b:\\n\");\n25:         printf(\"\
  %d      %d\\n\\n\", a, b);\n26:\n27:         printf(\"Count down!\\n\");\n28:  \
  \       printf(\"\\nPost  Pre\");\n29:         printf(\"\\n%d     %d\", a--, --b);\n\
  30:         printf(\"\\n%d     %d\", a--, --b);\n31:         printf(\"\\n%d    \
  \ %d\", a--, --b);\n32:         printf(\"\\n%d     %d\", a--, --b);\n33:       \
  \  printf(\"\\n%d     %d\\n\", a--, --b);\n34:\n35:         return 0;\n36: }\n```\n\
  \n输出 ![Image](img/down-arrow.jpg)\n\n点击此处查看代码图像\n\n* * *\n\nCount up!\n\nPost  \
  \  Pre\n0      1\n1      2\n2      3\n3      4\n4      5\nCurrent values of a and\
  \ b;\n5      5\nCount Down!\nPost  Pre\n5      4\n4      3\n3      2\n2      1\n\
  1      0\n\n分析 ![Image](img/down-arrow.jpg)\n\n* * *\n\n该程序在第 5 行声明了两个变量 `a` 和 `b`。在第\
  \ 10 行，变量被设置为值 `0`。第一批 `printf` 语句（第 18 到 22 行）用于使用一元运算符计数到 5。对于每一行，`a` 会被打印并递增，而\
  \ `b` 在此之前先递增。在最后一个增量运算符之后，额外的 `printf` 语句（第 25 行）证明了两个变量都等于 5。\n\n对于第二批 `printf()`（第\
  \ 29 到 33 行），`a` 和 `b` 都被递减。在打印 `a` 之后，它被递减，而 `b` 在打印之前先被递减。\n\n* * *\n\n### 注意\n\
  \n在第 2 节 的“C 程序的组件”中，你学习了另一个运算符 `sizeof`。虽然你可能倾向于认为运算符应该像符号，但 `sizeof` 关键字实际上被认为是一个运算符。\n\
  \n* * *\n\n### 数学运算符\n\nC 的二元运算符接受两个操作数。表 4.2 列出了二元运算符，其中包括在计算器上常见的各种操作。\n\n![Image](img/04tab02.jpg)\n\
  \n**表 4.2** C 的数学运算符\n\n参考表 4.2，前四个运算符对你来说应该是熟悉的，使用它们时不应该遇到困难。第五个运算符——模（modulus），可能是新的。模运算返回第一个操作数除以第二个操作数时的余数。例如，11\
  \ 模 4 等于 3（即 4 可以除进 11 二次，余 3）。这里是更多例子：\n\n10 模 9 等于 1\n10 模 5 等于 0\n40 模 6 等于 4\n\
  \n列表 4.2 说明了你如何使用模运算符将大量的秒数转换为小时、分钟和秒。\n\n输入 ![Image](img/down-arrow.jpg)\n\n**列表\
  \ 4.2** seconds.c：演示模运算符\n\n点击此处查看代码图像\n\n* * *\n\n```c\n1:  /* 演示模运算符。 */\n2: \
  \ /* 输入秒数，并转换为小时、 */\n3:  /* 分钟和秒。 */\n4:\n5:  #include <stdio.h>\n6:\n7:  /* 定义常量\
  \ */\n8:\n9:  #define SECS_PER_MIN 60\n10: #define SECS_PER_HOUR 3600\n11:\n12:\
  \ unsigned seconds, minutes, hours, secs_left, mins_left;\n13:\n14: int main( void\
  \ )\n15: {\n16:     /* 输入秒数 */\n17:\n18:     printf(\"Enter number of seconds (<\
  \ 65000): \");\n19:     scanf(\"%d\", &seconds);\n20:\n21:     hours = seconds /\
  \ SECS_PER_HOUR;\n22:     minutes = seconds / SECS_PER_MIN;\n23:     mins_left =\
  \ seconds % SECS_PER_MIN;\n24:     secs_left = seconds % SECS_PER_MIN;\n25:\n26:\
  \     printf(\"%u seconds is equal to \", seconds);\n27:     printf(\"%u h, %u m,\
  \ and %u s\\n\", hours, mins_left, secs_left);\n28:\n29:     return 0;\n30: }\n\
  ```\n\n输出 ![Image](img/down-arrow.jpg)\n\n点击此处查看代码图像\n\n* * *\n\nEnter number of\
  \ seconds (< 65000): 3666\n3666 seconds is equal to 1 h, 1 m, and 6 s\n\n输出 ![Image](img/down-arrow.jpg)\n\
  \n点击此处查看代码图像\n\n* * *\n\nEnter number of seconds (< 65000): 10000\n10000 seconds\
  \ is equal to 2 h, 46 m, and 40 s\n\n分析 ![Image](img/down-arrow.jpg)\n\n* * *\n\n\
  seconds.c 程序遵循了之前所有程序都遵循的格式。第 1 到 3 行提供了一些注释，说明了程序的功能。第 4 行是空白，使程序更具可读性。就像语句和表达式中的空白一样，空行会被编译器忽略。第\
  \ 5 行包含了此程序所需的头文件。第 9 行和第 10 行定义了两个常量 `SECS_PER_MIN` 和 `SECS_PER_HOUR`，使语句更易读。第\
  \ 12 行声明了所有将要使用的变量。有些人选择每行单独声明一个变量，而不是全部写在一行。两种方法都是正确的。\n\n\n\n\n显然，对于操作执行的顺序需要一些规则。这种顺序被称为`operator\
  \ precedence`（运算符优先级），在 C 语言中有严格的规定。每个运算符都有特定的优先级。当评估表达式时，优先级高的运算符先执行。表 4.3 列出了\
  \ C 语言数学算运算符的优先级。数字 1 优先级最高，因此最先。\n\n![Image](img/04tab03.jpg)\n\n**表 4.3** C 数学算运算符的优先级\n\
  \n查看表 4.3，你可以看到在任何 C 表达式中，操作都按照以下顺序执行：\n\n![Image](img/squf.jpg) 一元增和自减\n\n![Image](img/squf.jpg)\
  \ 乘法、除法和取模\n\n![Image](img/squf.jpg) 加法和减法\n\n如果一个表达式包含多个相同优先级的运算符，通常按照它们在表达式中出现的顺序从左到右执行。例如，在下面的表达式中，`%`\
  \ 和 `*` 具有相同的优先级，但 `%` 是最左侧的运算符，因此先执行：\n\n```\n12 % 5 * 2\n```\n\n该表达式计算结果为 4（`12\
  \ % 5` 结果为 2；2 乘以 2 是 4）。\n\n回到之前的例子，你会发现语句 `x = 4 + 5 * 3;` 将值 `19` 赋值给 `x`，因为乘法在加法之前执行。\n\
  \n如果优先级顺序没有按照你的需要评估表达式怎么办？使用上一个例子，如果你想先将 4 加 5，然后将和乘以 3 呢？C 语言使用括号来修改评估顺序。包含在括号中的子表达式先被评估，而不考虑运算符的优先级。因此，你可以写成：\n\
  \n```\nx = (4 + 5) * 3;\n```\n\n括号内的表达式 `4 + 5` 先被评估，因此赋值给 `x` 的值为 `27`。\n\n你可以在表达式中使用多个和嵌套的括号。当括号嵌套时，评估从最内层的表达式向外进行。看下面这个复杂的表达式：\n\
  \n```\nx = 25 - (2 * (10 + (8 / 2)));\n```\n\n该表达式的评估过程如下：\n\n**1.** 最内层的表达式 `8\
  \ / 2` 先被评估，得到值 `4`：\n\n```\nx = 25 - (2 * (10 + 4))\n```\n\n**2.** 向外移动，评估下一个表达式\
  \ `10 + 4`，得到值 `14`：\n\n```\nx = 25 - (2 * 14)\n```\n\n**3.** 最后（或最外层）表达式 `2 * 14,`\
  \ 被评估，得到值 `28`：\n\n```\nx = 25 - 28\n```\n\n**4.** 最终表达式 `25 – 28` 被评估，将值 `-3` 赋值给变量\
  \ `x`：\n\n```\nx = -3\n```\n\n为了清晰起见，你可能想在某些表达式中使用括号，即使它们不需要修改运算符优先级。括号必须始终成对出现，否则编译器会生成错误信息。\n\
  \n### 子表达式的评估顺序\n\n如上一节提到的，如果 C 表达式包含多个具有相同优先级的运算符，它们将从左到右进行评估。例如，在表达式中：\n\n```\n\
  w * x / y * z\n```\n\n`w` 先乘以 `x`，乘法的结果再除以 `y`，除法的结果再乘以 `z`。\n\n然而，跨越优先级级别，并没有保证从左到右的顺序。看这个表达式：\n\
  \n```\nw * x / y + z / y\n```\n\n由于优先级关系，乘法和除法在加法之前执行。但是，C 语言并没有指定子表达式 `w * x /\
  \ y` 是在 `z / y` 之前还是之后评估。你可能不清楚这为什么重要。看另一个例子：\n\n```\nw * x / ++y + z / y\n```\n\
  \n如果先评估左侧子表达式，那么在评估第二个表达式时，`y` 会递增。如果先评估右侧表达式，`y` 则不会递增，且结果也不同。因此，在编程时你应该避免这种不确定的表达式。\n\
  \n在本节的末尾，章节“重温运算符优先级”列出了所有 C 运算符的优先级。\n\n* * *\n\n### 要 (Do)\n\n**要**使用括号使表达式评估的顺序清晰。\n\
  \n* * *\n\n### 不要 (Don’t)\n\n**不要**把表达式复杂化。将一个表达式拆分为两个或多个语句通常更清晰。当你使用一元运算符（----）或（`++）时尤其如此。\n\
  \n* * *\n\n### 关系运算符\n\n你可以使用 C 语言的关系运算符来比较表达式，提问诸如“x 是否大于 100?”或“y 是否等于 0?”等问题。包含关系运算符的表达式评估结果为真\
  \ (`1`）或假 (`0`）。表 4.4 列出了 C 语言的六个关系运算符。\n\n![Image](img/04tab04.jpg)\n\n**表 4.4**\
  \ C 的关系运算符\n\n表 4.5 显示了关系运算符的一些用法。这些示例使用了常量，但原理也适用于变量。\n\n![Image](img/04tab03.jpg)\n\
  \n**表 4.5** 关系运算符的使用\n\n* * *\n\n### 注意 (Note)\n\n“真”被视为“是”，等于 `1`。“假”被视为“否”，等于\
  \ `0`。\n\n* * *\n\n### 要 (Do)\n\n**要**学习 C 如何解释真和假。在处理关系运算符时，真等于 `1`，假等于 `0`。\n\n\
  * * *\n\n### 不要 (Don’t)\n\n**不要**混淆关系运算符 `==` 和赋值运算符 `=`。这是 C 程序员最常见的错误之一。\n\n*\
  \ * *\n\n### if 语句\n\n关系运算符主要用于构建 `if` 和 `while` 语句中的关系表达式，将在第 6 节中详细介绍。现在，我们学习\
  \ `if` 语句的基础，展示关系运算符如何用于*控制语句*。\n\n你可能会什么是控制语句。程序中的语句通常从上到下、按照它们在代码中的顺序执行。控制语句修改语句的执行顺序。控制语句可以导致某些语句执行多次或不执行，取决于情况。`if`\
  \ 语句是 C 的控制语句之一。其他的，如 `do` 和 `while`，将在第 6 节中介绍。\n\n在基本形式下，`if` 语句评估一个表达式根据结果引导程序执行。`if`\
  \ 语句的形式如下：\n\n```\nif (expression)\n{\n    statement;\n}\n```\n\n如果表达式为真，则执行语句。如果表达式为假，则不执行语句。无论何种，执行流都会进入\
  \ `if` 语句之后的代码。注意，`if (`expression`)` 行和 `statement;` 行共同构成完整的 `if` 语句；它们不是独立的语句。\n\
  \n`if` 语句可以通过复合语句或块来控制多个语句的执行。在本节之前的定义，块是用花括号括的两个或多个语句。块可以使用任何可以使用单个语句的地方。因此，你可以这样写\
  \ `if` 语句：\n\n点击此处查看图像\n\n```\nif (expression)\n{\n    statement1;\n    statement2;\n\
  \    /* 额外的代码在这里 */\n    statementn;\n}\n```\n\n* * *\n\n### 要 (Do)\n\n**要**记住，如果一天内编程过多，你会得“C\
  \ 病”。\n\n**要**对块内的语句进行缩进，以便于阅读。这包括 `if` 语句块内部的语句。\n\n* * *\n\n### 不要 (Don’t)\n\n\
  * * *\n\n* * *\n\n### 警告 (Caution)\n\n\n\n\n不要在 `if` 语句的表达式末尾加分号。一个 `if` 语句应该以紧随其后的条件语句结束。在下面的示例中，由于分号的存在，`statement1`\
  \ 无论 `x` 是否等于 `2` 都会执行。分号导致每一行都被视为一个独立的语句，而不是像预期的那样作为一个整体执行：\n\n点击此处查看代码图像\n\n```\n\
  if( x == 2);          /* 分号不该属于这里！ */\n\nstatement1;\n```\n\n编译器通常不会对这个错误产生报错。\n\
  \n***\n\n在你的编程中，`if` 语句最常与关系表达式配合；换句话说，“只有当某条件为真时，执行后续语句。”这里有一个示例：\n\n```\nif (x\
  \ > y)\n    y = x;\n```\n\n这段代码仅在 `x` 大于 `y` 的情况下将 `x` 的值赋给 `y`。如果 `x` 不大于 `y`，则不发生赋值。列表\
  \ 4.3 展示了 `if` 语句的使用。\n\n输入 ![Image](img/down-arrow.jpg)\n\n**列表 4.3** agechecker.c：演示\
