  上一次 printf() 输出了 20 个字符。\n\n### 何时使用 `fprintf()`\n\n如前文所述，库函数 `fprintf()` 与 `printf()`\
  \ 相同，不同在于你可以指定输出发送到的流。`fprintf()` 的主要用途涉及磁盘文件，正如函数指针和链表 中解释的那样。这里还有两种用法，见此处的解释。\n\
  \n#### 使用 `stderr`\n\nC 语言的预定义流之一是 `stderr`（标准错误）。程序的错误信息传统上被发送到流 `stderr` 而不是 `stdout`。为什么要这样做呢？\n\
  \n正如你所学的，输出到 `stdout` 的内容可以重定向到显示屏幕以外的目标。如果 `stdout` 被重定向，用户可能察觉不到程序发送到 `stdout`\
  \ 的任何错误信息。通过将错误信息重定向到 `stderr`，你可以确保用户始终能看到它们。\n\n将错误信息发送到 `stderr`：\n\n```c\nvoid\
  \ error_message(char *msg)\n{\n    fprintf(stderr, \"%s\\n\", msg);\n}\n```\n\n\n\
