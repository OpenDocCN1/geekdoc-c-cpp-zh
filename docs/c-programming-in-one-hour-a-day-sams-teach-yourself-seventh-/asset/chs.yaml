  23:     return 0;\n24: }\n```\n（注：源代码代码破碎，已根据标准 C 实践进行了重构。）*\n\n## 处理时间\n\nC 库包含几个让你处理时间的函数。在\
  \ C 中，*times* 指日期。函数原型以及许多函数使用的结构体定义都在 `time.h` 中。\n\n### 表示时间\n\nC 函数用两种方式表示时间。更基础的方法是自\
  \ 1970 年 1 月 1 日以来的秒数。负值用于表示该日期之前。这些时间值存储为 `long`。在 `time.h` 中，`time_t` 和 `clock_t`\
  \ 符号都定义为 `long`。\n\n第二种方法是将时间分解为组件：年、月、日等。对于这种时间，时间函数使用如下结构体 `tm`：\n\n```c\nstruct\
  \ tm {\n  int tm_sec;  // 分后的秒 [0,59]\n  int tm_min;  // 小时后的分 [0,59]\n  int tm_hour;\
  \ // 午夜后的小时 [0,23]\n  int tm_mday; // 月中的几几 [1,31]\n  int tm_mon;  // 从 1 月起的月份\
  \ [0,11]\n  int tm_year; // 自 1900 年起的年份\n  int tm_wday;  // 从周日起的周数 [0,6]\n  int\
  \ tm_yday;  // 从 1 月 1 日起的日数 [0,365]\n  int tm_isdst;//日光令时标志\n};\n```\n\n#### 获取当前时间\n\
  \n要获取系统内部时钟设置的当前时间，请使用 `time()` 函数。其原型为\n\n```c\ntime_t time(time_t *timeptr);\n\
  ```\n\n\n\n\n\n请记住，`time_t` 在 `time.h` 中定义为 `long` 的别名。`time()` 函数返回自 1970 年 1 月\
  \ 1 日午夜以来经过的秒数。如果传递给它非 `NULL` 指针，`time()` 还会将此值存储在 `timeptr` 指向的 `time_t` 类型变量中。因此，为了在类型\
  \ `time_t` 的变量 `now` 中存储当前时间，你可以写道：\n\n```c\ntime_t now;\nnow = time(0);\n```\n\n\
  你也可以写成：\n\n```c\ntime_t now;\ntime_t *ptr_now = &now;\ntime(ptr_now);\n```\n\n##\
  \ 在时间表示之间转换\n\n知道自 1970 年 1 月 1 日以来的秒数并不总是有用。因此，C 语言提供了使用 `localtime()` 函数将表示为 `time_t`\
  \ 值的时间转换为 `tm` 结构体的方法。`tm` 结构包含日、月、年和其他时间信息，其格式更适合显示和打印。该函数的原型是\n\n点击此处查看代码图像\n\n\
  ```c\nstruct tm *localtime(time_t *ptr);\n```\n\n此函数返回一个指向静态类型 `tm` 结构体的指针，因此你不需要声明\
  \ `tm` 结构体类型即可使用——只需要一个指向 `tm` 类型的指针。这个静态结构在每次调用 `localtime()` 时都会被重用和覆盖；如果你想保存返回的值，你的程序必须声明一个独立的\
  \ `tm` 结构体并从静态结构中复制值。\n\n反向转换——从类型 `tm` 结构体到类型 `time_t` 值——通过 `mktime()` 函数完成。其原型是\n\
  \n点击此处查看代码图像\n\n```c\ntime_t mktime(struct tm *ntime);\n```\n\n此函数返回 1970 年 1 月\
  \ 1 日午夜与 `ntime` 指向的 `tm` 结构体所表示的时间之间的秒数。\n\n## 显示时间\n\n要将时间转换为适合显示的格式化字符串，请使用 `ctime()`\
  \ 和 `asctime()` 函数。这两个函数都返回具有特定格式的字符串形式的时间。它们的区别在于 `ctime()` 接收的是类型 `time_t` 值的时间，而\
  \ `asctime()` 接收的是类型 `tm` 结构体的时间。它们的原型是\n\n点击此处查看代码图像\n\n```c\nchar *asctime(struct\
  \ tm *ptr);\nchar *ctime(time_t *ptr);\n```\n\n这两个函数都返回指向静态的、空结尾的 26 字符字符串的指针，该字符串按以下格式给出函数参数的时间：\n\
  \nThu Jun 13 10:22:23 1991\n\n时间按 24 小时“军事”时间格式化。这两个函数都使用一个静态字符串，并在每次调用时对其进行覆盖。\n\
  \n为了对时间的格式有更多控制，请使用 `strftime()` 函数。该函数接收类型为 `tm` 结构体的时间。它根据格式字符串对时间进行格式化。该函数的原型是\n\
  \n点击此处查看代码图像\n\n```c\nsize_t strftime(char *s, size_t max, char *fmt, struct tm\
  \ *ptr);\n```\n\n此函数获取 `ptr` 指向的 `tm` 结构体时间，根据格式字符串 `fmt` 进行格式化，并将结果作为空结尾字符串写入 `s`\
  \ 指向的内存位置。参数 `max` 应该指定在 `s` 上分配的空间。如果生成的字符串（包括结尾的空字符）超过 `max` 个字符，函数返回 `0`，且字符串\
  \ `s` 无效。否则，函数返回写入的字符数——`strlen(s)`。\n\n格式字符串由 表 20.1 中的一个或多个转换说明符组成。\n\n**表 20.1**\
  \ 可用于 `strftime()` 的转换说明符\n\n## 计算时间差\n\n你可以使用 `difftime()` 宏计算两个时间之间的秒数差，它减去两个\
  \ `time_t` 值并返回差值。其原型是\n\n点击此处查看代码图像\n\n```c\ndouble difftime(time_t later, time_t\
  \ earlier);\n```\n\n此函数从 `later` 中减去 `earlier` 并返回差值，即两个时间之间的秒数。`difftime()` 的常见用途是计算经过的时间，如\
  \ 列表 20.2 中（以及与其他时间操作）所示。\n\n你可以使用 `clock()` 函数确定不同类型的时长，它返回自程序开始执行以来经过的时间，单位为 1/100\
  \ 秒。其原型是\n\n```c\nclock_t clock(void);\n```\n\n要确定程序某部分的持续时间，请调用两次 `clock()`——在过程发生之前之后——并减去两个返回值。\n\
  \n### 使用时间函数\n\n列表 20.2 展示了如何使用 C 库函数。\n\n![Image](img/down-arrow.jpg)\n\n**列表 20.2**\
  \ whattime.c: 使用 C 库函数\n\n点击此处查看代码图像\n\n```c\n/* 使用时间函数。 */\n#include <stdio.h>\n\
  #include <time.h>\n\nint main( void )\n{\n    time_t start, finish, now;\n    struct\
  \ tm *ptr;\n    char *c, buf1[80];\n    double duration;\n\n    /* 记录时间。 */\n  \
  \  start = time(0);\n\n    /* 使用另一种方法记录当前时间。 */\n    time(&now);\n\n    /* 将 time_t\
  \ 值转换为 tm 结构体。 */\n    ptr = localtime(&now);\n\n    /* 创建并显示当前时间的格式化字符串。 */\n \
  \   c = asctime(ptr);\n    puts(c);\n\n    /* 现在使用 strftime 函数创建不同版本的时间。 */\n  \
  \  strftime(buf1, 80, \"This is week %U of the year %Y\", ptr);\n    puts(buf1);\n\
  \n    strftime(buf1, 80, \"Today is %A, %x\", ptr);\n    puts(buf1);\n\n    strftime(buf1,\
  \ 80, \"It is %M past hour %I.\", ptr);\n    puts(buf1);\n\n    /* 现在获取当前时间并计算程序时长。\
  \ */\n    finish = time(0);\n    duration = difftime(finish, start);\n    printf(\"\
  \\nExecution time using time() = %f seconds.\\n\", duration);\n\n    /* 同时使用 clock()\
  \ 以百分分之一秒为显示程序时长。 */\n    printf(\"\\nExecution time using clock() = %ld hundredths\
  \ of sec.\\n\", clock());\n\n    return(0);\n}\n```\n\n\n\n程序在第 15 行记录了它的起始时间。这是通过调用\
  \ `time()` 实现的。随后程序以另一种方式执行了几乎相同的操作。第 20 行没有使用 `time()` 函数的返回值，而是向 `time()` 传递了变量\
  \ `now` 的指针。正如第 22 行注释中所解释的，第 24 行将 `now` 的 `time_t` 值转换为 `tm` 结构体类型。程序的后续几部分以各种格式将当前时间的值打印到屏幕。第\
  \ 29 行使用 `asctime()` 函数将信息赋值给字符指针 `c`。第 30 行打印格式化后的信息。然后程序等待用户按回车键。\n\n第 36 至 46\
  \ 行使用 `strftime()` 函数以三种不同的格式打印日期。参考 表 20.1，你应该确定这些行打印了什么内容。\n\n程序随后在第 50 行再次确定时间。这是程序的结束时间。第\
  \ 51 行使用此结束时间结合起始时间，通过 `difftime()` 函数计算程序的运行时长。该值在第 52 行打印。程序最后通过打印来自 `clock()`\
  \ 函数的程序执行时间而结束。\n\n### 错误处理\n\nC 标准库包含了各种函数和宏，帮助你处理程序错误。\n\n#### assert() 宏\n\n\
  `assert()` 宏可以诊断程序 bug。它定义在 `assert.h` 中，其原型为：\n\n```\nvoid assert(int expression);\n\
  ```\n\n参数 `expression` 可以是你想要测试的任何内容——变量或任何 C 表达式。如果 `expression` 求值为 `TRUE`，则 `assert()`\
  \ 什么都不做。如果 `expression` 求值为 `FALSE`，`assert()` 会在 `stderr` 上显示错误信息并终止程序执行。\n\n你如何使用\
  \ `assert()`？它最常用于追踪程序 bug（这与编译错误不同）。bug 不会阻止程序编译，但会导致程序给出错误结果或运行不正常（例如死锁）。例如，你正在编写的一段财务分析程序可能会偶尔给出错误的答案。你怀疑问题是由变量\
  \ `interest_rate` 赋值了负值引起的，而这种情况本不应该发生。为了检查这一点，在程序中使用 `interest_rate` 的位置放置语句\n\n\
  ```\nassert(interest_rate >= 0);\n```\n\n如果变量确实变成了负数，`assert()` 宏会警告你。然后你可以检查相关代码以定位问题根源。\n\
