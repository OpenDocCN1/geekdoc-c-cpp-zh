  \n***\n\n**10.** 每当你使用 `rand()` 函数时，在程序的开头添加以下行是一个好主意：`srand ( time( NULL));`。此函数调用是为了确保你每次运行程序时都能不同的数字。\n\
  \n\n\n\n\n下一步是将变量 `rate` 的地址存储在变量 `p_rate` 中。因为 `p_rate` 现在包含了 `rate` 的地址，它指示了 `rate`\
  \ 在内存中存储的位置。在 C 语言术语中，`p_rate` *指向* `rate`，或者说是指向 `rate` 的指针。这在图 9.3 中所示。\n\n![Image](img/09fig03.jpg)\n\
  \n**图 9.3** 变量 `p_rate` 包含变量 `rate` 的地址，因此它是指向 `rate` 的指针。\n\n总结来说，指针是一个包含另一个变量地址的变量。现在你可以开始研究在\
  \ C 程序中使用指针的具体细节了。\n\n### 指针与简单变量\n\n在刚刚的示例中，指针变量指向一个简单（即非数组）变量。本节将向你展示如何创建和使用指向简单变量的指针。\n\
  \n#### 声明指针\n\n指针是一个数值变量，和所有变量一样，在使用之前必须进行声明。指针变量名遵循与其他变量相同的规则，并且必须是唯一的。本节采用一种约定：指向变量\
  \ `name` 的指针称为 `p_name`。然而，这并不是必须；只要符合 C 语言的命名规则，你可以为指针命名任何名称。\n\n指针的声明采用以下形式：\n\
  \n```\ntypename *ptrname;\n```\n\n其中 `typename` 是 C 语言的任意变量类型，并指示指针所指向变量的类型。星号（`*`）是间接运算符，它表示\
  \ `ptrname` 是一个指向 `typename` 的指针，而不是 `typename` 类型的变量。指针可以与非指针变量一起声明。这里是更多示例：\n\n\
  点击此处查看代码图像\n\n```c\nchar *ch1, *ch2;           /* ch1 和 ch2 都是指向 char 类型的指针 */\n\
  float *value, percent;    /* value 是指向 float 类型的指针，\n                          \
  \ /* percent 是普通的 float 变量 */\n```\n\n**注意**\n\n`*` 符号既用作间接运算符，也用作乘法运算符。不要担心编译器会感到困惑。`*`\
  \ 使用的上下文总是为编译器提供足够的信息，来判断你是指间接还是乘法。\n\n#### 初始化指针\n\n现在你已经声明了指针，你可以用它做什么呢？在让它指向某些东西之前，你无法对其任何操作。和普通变量一样，未初始化的指针可以使用，但结果是不可预测的且可能是灾难性的。在指针持有变量地址之前，它是没用的。地址不会通过魔法存储在指针中；你的程序必须通过地址运算符——取地址符（`&`）将其存入。当放在变量名之前时，地址运算符返回该变量的地址。因此，你使用如下形式的语句初始化指针：\n\
  \n```\npointer = &variable;\n```\n\n请参考图 9.3 中的示例。初始化变量 `p_rate` 指向变量 `rate` 的程序语句为：\n\
  \n点击此处查看代码图像\n\n```c\np_rate = &rate;     /* 将 rate 的地址赋值给 p_rate */\n```\n\n该语句将\
  \ `rate` 的地址赋值给 `p_rate`。在初始化之前，`p_rate` 没有指向任何特定的内容。初始化之后，`p_rate` 是指向 `rate` 的指针。\n\
  \n#### 使用指针\n\n现在你已经知道了如何声明和初始化指针，你可能好奇如何使用它们。间接运算符（`*`）再次发挥作用。当 `*` 位于指针名之前时，它指的是所指向的变量。\n\
  \n考虑之前的示例，其中指针 `p_rate` 已经初始化为指向变量 `rate`。如果你写 `*p_rate`，这个指针变量就会引用变量 `rate`的内容。如果你想打印\
  \ `rate` 的值（在示例中为 `100`），你可以写：\n\n```c\nprintf(\"%d\", rate);\n```\n\n或者你可以写这句语句：\n\
  \n```c\nprintf(\"%d\", *p_rate);\n```\n\n在 C 语言中，这两个语句是等价的。通过变量名访问变量的内容被称为*直接访问*。通过指向变量的指针访问变量的内容被称为*间接访问*或*间接引用*。图\
  \ 9.4 显示，指针名前面加上间接运算符时，指的是的是所指向变量的值。\n\n![Image](img/09fig04.jpg)\n\n**图 9.4** 指针与间接运算符的使用。\n\
  \n停下来思考这些内容。指针是 C 语言不可或缺的一部分，理解它们至关重要。指针曾困扰许多人，所以如果你感到有些困惑，不要担心。\n\n\n\n\n\n之前的讨论忽略了不同变量类型占用不同内存大小这一事实。对于常见的\
  \ PC 操作系统，`short` 占用 2 字节，`float` 占用 4 字节，以此此类推。内存中的每一个字节都有其自己的地址，因此一个多字节变量实际上占据了多个地址。\n\
  \n那么，指针是如何处理多字节变量的地址的呢？其工作原理如下：变量的地址实际上是它所占用的第一个（最低）字节的地址。可以通过一个声明并初始化三个变量的示例来说说明：\n\
  \n```c\nshort vshort = 12252;\nchar vchar = 90;\nfloat vfloat = 1200.156004;\n```\n\
  \n这些变量存储在内存中，如图 9.5 所示。在图中，`short` 变量占用 2 字节，`char` 变量占用 1 字节，而 `float` 变量占用 4 字节。\n\
  \n![Image](img/09fig05.jpg)\n\n**图 9.5** 不同类型的数值变量在内存中占据不同大小的存储空间。现在声明并初始化指向这三个变量的指针：\n\
  \n点击此处查看代码图像\n\n```c\nint *p_vshort;\nchar *p_vchar;\nfloat *p_vfloat;\n\n/* additional\
  \ code goes here */\n\np_vshort = &vshort;\np_vchar = &vchar;\np_vfloat = &vfloat;\n\
  ```\n\n每个指针都等于所指向变量的第一个字节的地址。因此，`p_vshort` 等于 `1000`，`p_vchar` 等于 `1003`，`p_vfloat`\
  \ 等于 `1006`。但请记住，每个指针都声明为指向特定类型的变量。编译器知道指向 `short` 类型的指针指向 2 字节中的第一个，指向 `float`\
  \ 类型的指针指向 4 字节中的第一个，以此此类推。这在图 9.6 中得到了所示。\n\n![Image](img/09fig06.jpg)\n\n**图 9.6**\
  \ 编译器知道指针所指向变量的大小。\n\n**注意**\n\n图 9.5 和 9.6 显示了三个变量之间的一些空位置。这是为了视觉上的清晰。在实际操作中，大多数\
  \ C 编译器会将这三个变量存储在相邻的内存位置，之间没有未使用的字节。你不能依赖这两种情况。\n\n### 指针与数组\n\n在处理简单变量时，指针非常有用，但在处理数组时更有帮助。指针和数组之间存在一种特殊关系。实际上，当你使用第\
  \ 8 节中学习的数组表示法时，你是在不知情的情况下使用了指针。接下来的章节将解释其原理。\n\n#### 数组名作为指针\n\n不带括号的数组名是指向数组第一个元素的指针。因此，如果你声明一个数组\
  \ `data[]`，`data` 就是第一个元素的地址。“等一下，”你可能会说，“你不需要取地址运算符来获取地址吗？”是的。你也可以使用表达式 `&data[0]`\
  \ 来获取数组的地址。在 C 语言中，关系 `data == &data[0]` 是 true。\n\n你已经看到数组名是指向数组的指针。数组名是一个指针常量；它不能被更改，并在整个程序运行期间保持固定。这有道理：如果你更改了它的值，它将指向其他地方，而不是数组（数组保持在固定位置）。但是，你可以声明一个指针变量并将其初始化为指向数组。例如，以下代码将指针变量\
  \ `p_array` 初始化为 `array` 第元素的地址：\n\n```c\nint array[100], *p_array;\n/* additional\
  \ code goes here */\np_array = array;\n```\n\n由于 `p_array` 是一个指针变量，它可以被修改为指向其他地方。与数组名\
  \ `array` 不同，`p_array` 没有被锁定指向第一个元素。你如何切换到 `array` 的其他元素呢？首先，你需要查看数组是如何存储在内存中的。\n\
  \n#### 数组元素的存储\n\n正如你从第 8 节中所记得，数组元素存储在连续的内存位置，第一个元素位于最低地址。随后的数组元素（索引大于 0 的元素）存储在更高的地址。具体高多少取决于数组的数据类型（`char`、`int`、`float`\
  \ 等）。\n\n以一个 `short` 数组为例。正如你在第 3 节中所学习的，单个 `short` 变量可以占用 2 字节内存。因此，每个数组元素位于前一个元素上方\
  \ 2 字节，每个数组元素的地址比前一个元素的地址大 2。另一方面，`float` 类型可以占用 4 字节。在 `float` 类型数组中，每个数组元素位于前一个元素上方\
  \ 4 字节，每个数组元素的地址比前一个元素的地址大 4。\n\n图 9.7 展示了 `short` 数组和 `float` 数组的存储及其关系。\n\n![Image](img/09fig05.jpg)\n\
  \n**图 9.7** 不同类型数组的存储。\n\n通过查看图 9.7，你可以看到以下关系是 true：\n\n1. `x == 1000`\n2. `&x[0]\
  \ == 1000`\n3. `x[1] == 1002`\n4. `expenses == 1250`\n5. `&expenses[0] == 1250`\n\
  6. `expenses[1] == 1254`\n\n`x` 不带括号的数组名是数组第一个元素的地址。你也可以看到 `x[0]` 于 `1000`。第 2 行显示了这一点。它可以这样理解：“数组\
  \ `x` 的第一个元素的地址是 `1000`。”第 3 行显示，下标为 `1` 的元素地址是 `1002`。再次，图 9.7 证实了这一点。\n\n你如何使用指针来访问这些连续元素？从这些示例中可以看出，访问\
  \ `short` 数组需要指针增加 2，而访问 `float` 数组需要增加 4。你可以总结说，要访问特定数据类型数组的连续元素，指针需要增加 `sizeof(datatype)`。从第\
  \ 3 节中记得，`sizeof()` 运算符返回 C 数据类型的大小。\n\n列表 9.2 通过声明 `short`、`float` 和 `double` 类型数组并显示连续元素的地址，说明了地址与元素之间的关系。输入\
  \ ![Image](img/down-arrow.jpg)\n\n**列表 9.2** arraysize.c: 显示连续元素的地址\n\n点击此处查看代码图像\n\
  \n```c\n1:  /* 展示不同数据类型数组的 */\n2:  /*元素之间的关系。 */\n3:\n4: #include <stdio.h>\n5:\n\
  6:  /* 声明计数器和三个数组。 */\n7:  int ctr;\n8:  short array_s[10];\n9:  float array_f[10];\n\
  10: double array_d[10];\n11:\n12: int main( void )\n13: {\n14:     /* 打印表格表头 */\n\
  15:\n16:     printf(\"\\t\\tShort\\t\\tFloat\\t\\tDouble\");\n17:\n18:     printf(\"\
  \\n================================\");\n19:     printf(\"========================\"\
  );\n20:\n21:     /* 打印每个数组元素的地址。 */\n22:\n23:     for (ctr = 0; ctr < 10; ctr++)\n\
  24:         printf(\"\\nElement %d:\\t%p\\t\\t%p\\t\\t%p\", ctr, (void*)&array_s[ctr],\
  \ (void*)&array_f[ctr], (void*)&array_d[ctr]);\n```\n\n\n\n\n```c\n25:         \
  \    &array_s[ctr], &array_f[ctr], &array_d[ctr]);\n26:\n27:     printf(\"\\n================================\"\
  );\n28:     printf(\"========================\\n\");\n29:\n30:     return 0;\n31:\
  \ }\n```\n\n***\n\n输出 ![Image](img/down-arrow.jpg)\n\n点击此处查看代码图像\n\n***\n\n    \
  \          Short           Float           Double\n==========================================================\n\
  Element 0:      4210896         4210752          4210816\nElement 1:      4210898\
  \         4210756          4210824\nElement 2:      4210900         4210760    \
  \      4210832\nElement 3:      4210902         4210764          4210840\nElement\
  \ 4:      4210904         4210768          4210848\nElement 5:      4210906    \
  \     4210772          4210856\nElement 6:      4210908         4210776        \
  \  4210864\nElement 7:      4210910         4210780          4210872\nElement 8:\
  \      4210912         4210784          4210880\nElement 9:      4210914       \
  \  4210788          4210888\n==========================================================\n\
  \n### 分析 ![Image](img/down-arrow.jpg)\n\n***\n\n你的系统显示的精确地址将与这些不同，但关系是相同的。在输出输出中，`short`\
  \ 元素之间有 2 字节，`float` 元素之间有 4 字节，`double` 元素之间有 8 字节。\n\n***\n\n### 注意事项\n\n某些机器对变量类型使用不同的大小。如果你的机器与之不同，之前的输出可能会有不同大小的间隙；然而，这些间隙是一致的。\n\
  \n***\n\n此列表利用了第 7 节中过的转义字符，“读写信息的基础。”第 16 行和第 24 行的 `printf()` 调用使用制表符转义字符 (`\\\
  t`) 来通过对齐列帮助格式化表格。\n\n更仔细查看列表 9.2，你可以看到在第 8、9 和 10 行创建了三个数组。第 8 行声明了 `short` 类型数组\
  \ `array_s`，第 9 行声明了 `float` 类型数组 `array_f`，第 10 行声明了 `double` 类型数组 `array_d`。第\
  \ 16 行打印了表格表头。第 18 行和 19 行结合第 27 行和 28 行在数据的顶部底部打印了虚线。第 23、24 和 25 行是一个 `for` 循环，打印每一行。首先打印元素\
  \ `ctr`，随后打印三个数组中每个元素的地址。\n\n#### 指针算术\n\n你有一个指向数组第一个元素的指针；该指针必须增加等于数组中存储数据的大小的量。你如何使用指针表示法访问数组元素呢？你使用指针算术。你可能会想：“这正是我需要的，另一种需要学习的算术！”别担心。指针算术非常简单，它让使用指针变得容易得多。你只需要关注两种操作：递和递减。\n\
  \n##### 指针递增\n\n当你递增指针时，你增加了它的值。例如，当你将指针递增 1 时，指针算术会自动增加指针的值，使其指向下一个数组元素。换句话说，C\
  \ 知道指针指向的数据类型（根据指针声明），并根据数据的大小增加指针中存储的地址。\n\n假设 `ptr_to_short` 是一个指向 `short` 数组某些元素的指针变量。如果你执行语句\
  \ `ptr_to_short++`，`ptr_to_short` 的值将增加 `short` 的大小（通常为 2 字节），现在 `ptr_to_short`\
  \ 指向下一个数组元素。同样，如果 `ptr_to_float` 指向 `float` 数组的一个元素，语句 `ptr_to_float++` 将增加 `ptr_to_float`\
  \ 的值以 `float` 的大小（通常为 4 字节）。\n\n对于大于 1 的递增也是如此。如果你给指针加上值 `n`，C 会将指针增加 `n` 个关联数据类型的数组元素。因此，`ptr_to_short\
  \ += 4` 将将 `ptr_to_short` 中存储的值增加 8（假设 `short` 是 2 字节），因此它指向前方四个元素。同样，`ptr_to_float\
  \ += 10` 将增加 `ptr_to_float` 中存储的值 40（假设 `float` 是 4 字节），因此它指向前方 10 个元素。\n\n#####\
  \ 指针递减\n\n适用于递增指针的相同概念也适用于递减指针。递减指针实际上是增加一个负值的特例。如果你使用 `--` 或 `-=` 运算符递减指针，指针算术会自动调整以适应数组元素的大小。列表\
  \ 9.3 展示了如何使用指针算术访问数组元素。通过递增指针，程序可以有效地遍历数组的所有元素。\n\n输入 ![Image](img/down-arrow.jpg)\n\
  \n**列表 9.3** `ptr_math.c`: 使用指针算术和指针表示法访问数组元素\n\n点击此处查看代码图像\n\n\n\n\n你可能认为，这个程序完全可以使用数组下标表示法而完全抛弃指针。这确实如此，在像这样简单的编程任务中，使用指针表示法并没有提供任何主要优势。然而，当你开始编写更复杂的程序时，你会发现使用指针是有益的。\n\
  \n记住，你不能对指针常量进行递增和递减操作。（不带括号的数组名就是一个`pointer constant`。）同样要记住，当你操作指向数组元素的指针时，C 编译器并不会跟踪数组的起始和结束位置。如果你不小心，可能会递增或递减指针，使其指向数组之前或之后内存中的某处。那里确实存储了某些内容，但它们并不是数组元素。你应该跟踪指针以及它们所指向的位置。\n\
  \n## 其他指针操作\n\n你可能想要使用的另一种指针算术操作被称为“求差值运算”（`differencing`），它指的是两个指针相减。如果你有两个指向同一个数组中不同元素的指针，你可以相减它们并找出它们之间相距多远。再次，指针算术会自动对结果进行缩放，使其引代数组元素的个数。因此，如果\
  \ `ptr1` 和 `ptr2` 指向数组（任意类型）的元素，下面的表达式可以告诉你这些元素相距多远：\n\n```\nptr1 - ptr2\n```\n\n\
  你也可以比较指针。指针比较仅在指向同一个数组的指针之间有效。在这种情况下，关系运算符 `==`、`!=`、`>`、`<`、`>=` 和 `<=` 可以正常工作。低数组元素（即下标较小的元素）的地址总是比高数组元素。因此，如果\
  \ `ptr1` 和 `ptr2` 指向同一个数组的元素，比较\n\n```c\nptr1 < ptr2\n```\n\n如果 `ptr1` 指向数组中比 `ptr2`\
  \ 早的成员，则结果为真。\n\n这涵盖了所有允许的指针操作。许多可以在普通变量上执行的算术操作（如乘法和除法）对于指针来说没有意义。C 编译器不允许这些操作。例如，如果\
  \ `ptr` 是一个指针，那么语句\n\n```c\nptr *= 2;\n```\n\n将生成错误信息。表 9.1 列出了你可以对指针进行的所有操作，这些操作在本节中都已涵盖。\n\
  \n![Image](img/09tab01.jpg)\n\n**表 9.1** 指针操作\n\n## 指针注意事项\n\n当你编写使用指针的程序时，必须避免一种严重错误：在赋值语句的左侧使用未初始化的指针。例如，以下语句声明了一个指向\
  \ `int` own 指针：\n\n```c\nint *ptr;\n```\n\n这个指针尚未初始化，所以它没有指向任何地方。更准确地说，它没有指向任何`已知`的内容。未初始化的指针有某个值，你只是不知道它是什么。在很多情况下，它是\
  \ 0。如果你在赋值语句中使用未初始化的指针，会发生这种情况：\n\n```c\nptr = 12;\n```\n\n值 `12` 被赋值给 `ptr` 所指向的任何地址。该地址可以是内存中的几乎任何位置——存储操作系统的地方，或程序代码的某处。存储在那里的\
  \ `12` 可能会覆盖某些重要信息，结果可能是从奇怪的程序错误到整个系统崩溃的任何情况。\n\n赋值语句的左侧是使用未初始化指针最危险的地方。其他错误虽然不严重，但在程序的任何地方使用未初始化指针也可能导致这些问题，因此请确保在使用程序的指针之前已对其进行了正确的初始化。你必须自己这样做；不要假设编译器会为你这样做。\n\
  \n***\n\n## 要做的 (Do)\n\n**要**记住，对指针进行加或减操作会根据它所指向的数据类型的大小来改变指针。它不是改变 1，也不是按增加的数值改变（除非它是指向\
  \ 1 字节字符的指针）。\n\n**要**理解你计算机上变量类型的大小。正如你开始观察到的那样，在处理指针和内存时，你需要知道变量的大小。\n\n***\n\n\
  ## 不要做的 (Don’t)\n\n**不要**尝试对指针执行除法、乘法和取模等数学运算。指针的加法（递增）和减法（求差）是可以接受的。\n\n**不要**尝试递增或递减数组变量。将指针指向数组的起始地址并对其进行递增（参见列表\
  \ 9.3）。\n\n***\n\n## 数组下标表示法与指针\n\n不带括号的数组名是数组第一个元素的指针。因此，你可以使用间接操作符访问第一个数组元素。如果\
  \ `array[]` 是声明的数组，表达式 `*array` 是数组的第一个元素，`*(array + 1)` 是数组的第二个元素，依此类推。如果对整个数组进行泛化，以下关系成立：\n\
  \n```c\n*(array) == array[0]\n*(array + 1) == array[1]\n*(array + 2) == array[2]\n\
  ...\n*(array + n) == array[n]\n```\n\n这说明了数组下标表示法和数组指针表示法之间的等效性。你可以在程序中使用其中任何一种；C\
  \ 编译器将它们视为使用指针访问数组数据的两种不同方式。\n\n## 将数组传递给函数\n\n本节已经讨论了 C 语言中指针和数组之间存在的特殊关系。当你需要将数组作为参数传递时，这种关系就会派上用场。将数组传递给函数的唯一方法是使用指针。\n\
  \n正如你在第 5 节中学学的，“参数”是调用程序传递给函数的值。它可以是 `int`、`float` 或任何其他简单类型，但它必须是一个单一值。它不能是数组。如果你需要传递整个数组怎么办？其实你可以有一个指向数组的指针，而该指针就是一个单一数值（数组第一个元素的地址）。如果你将该值传递给函数，函数就知道了数组并可以使用指针表示法访问。\n\
  \n考虑另一个问题。如果你写一个接受数组作为参数的函数，你希望该函数能够处理不同大小的数组。例如，你可以写一个寻找数组中最大元素的函数。如果该函数仅限于处理固定大小的数组，它将大打不再。\n\
  \n函数如何知道它所接收的数组的大小？记住，传递给函数的是数组第一个元素的指针。有两种方法可以让函数知道数组的大小。\n\n你可以在最后一个数组元素存储一个特殊值。当函数处理数组时，会在每个元素中查找该值。当找到该值时，说明数组已经结尾。这种方法的缺点是强制你预留一个值作为数组结束指示，限制了你在数组中存储真实数据的灵活性。\n\
  \n另一种方法更灵活、直接，也是本书使用的方法：将数组的大小作为参数传递给函数。这是一个简单类型 `int` 参数。因此，函数接收了两个参数：指向数组第一个元素的指针和一个指定数组元素个数的整数。\n\
  \n列表 9.4 从用户接受一组值并将其存储在数组中。然后它调用名为 `largest()` 的函数，传递数组（包括指针和大小）。该函数找到数组中的最大值并返回给调用程序。\n\
