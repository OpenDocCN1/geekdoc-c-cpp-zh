  ## 第 7 节：信息读写的基础\n\n在你创建的大多数程序中，你需要在屏幕上显示信息或从键盘接收输入。之前课程中介绍的许多程序都执行过这些任务，但你可能并不完全理解具体是如何实现的。在本节中，你将学习：\n\
  \n![Image](img/squf.jpg) C 语言输入输出语句的基础\n\n![Image](img/squf.jpg) 如何使用库函数 `printf()`\
  \ 和 `puts()` 在屏幕上显示信息\n\n![Image](img/squf.jpg) 如何对屏幕上显示的信息进行格式化\n\n![Image](img/squf.jpg)\
  \ 如何使用库函数 `scanf()` 读取键盘输入的数据\n\n本节并非对这些主题进行彻底介绍，但它提供了足够的信息，让你开始编写真实的程序。这些主题将在书中后部分进行更详细介绍。\n\
  \n### 在屏幕上显示信息\n\n你可能希望大部分程序都能在屏幕上显示信息。显示信息的两种常用方法是使用 C 库函数 `printf()` 和 `puts()`。\n\
  \n#### printf() 函数\n\n`printf()` 函数是标准 C 库的一部分，并包含在 ANSI 标准中。它可能是程序在屏幕上显示数据最通用的方法。你已经在本书的许多示例中看到过\
  \ `printf()` 的用法了。现在你可以了解 `printf()` 是如何工作的。\n\n在屏幕上打印文本消息非常简单。只需调用 `printf()` 函数，并传递用双引号括起来所需的消息即可。例如，要在屏幕上显示\
  \ `How Now Brown Cow!`，你可以写道：\n\n点击此处查看代码图片\n\n```c\nprintf(\"How Now Brown Cow!\"\
  );\n```\n\n然而，除了文本消息外，你经常需要显示程序变量的值。这比只显示消息要复杂一点。例如，假设你想在屏幕上显示数值变量 `myNumber` 的值，并带有一些标识性文本。此外，你希望信息从新的一行开头开始。你可以如下所示使用\
  \ `printf()` 函数：\n\n点击此处查看代码图片\n\n```c\nprintf(\"\\nThe value of myNumber is %d\"\
  , myNumber);\n```\n\n假设 `myNumber` 的值为 `12`，最终屏幕显示结果为：\n\nThe value of myNumber\
  \ is 12\n\n在这个示例中，向 `printf()` 传递了两个参数。第一个参数用双引号括起来，被称为*格式字符串*（format string）。第二个参数是变量名（`myNumber`），它包含要打印的值。\n\
  \n#### printf() 格式字符串\n\n`printf()` 格式字符串指定了输出的格式。格式字符串有三种可能的组件：\n\n![Image](img/squf.jpg)\
  \ *字面文本*（Literal text）将按照格式字符串中输入的内容完全显示。在前面的示例中，从 `T`（在 `The` 中）开始到 `%`（但不包括 `%`）为止的字符组成了一个字面字符串。\n\
  \n![Image](img/squf.jpg) *转义序列*（escape sequence）提供了特殊的格式控制。转义序列由一个反斜杠（`\\`）后跟一个字符组成。在前面的示例中，`\\\
  n` 就是转义序列。它被称为*换行符*（newline character），意思是“移动到下一行的开头”。列表中的项使用了 `\\t` 字符来制表。转义序列也用于打印特定的字符。常用的转义序列列在表\
  \ 7.1 中。\n\n![Image](img/squf.jpg) **表 7.1** 最常用的转义序列\n\n![Image](img/squf.jpg)\
  \ *转换说明符*（conversion specifier）由百分号（`%`）后跟一个字符组成。示例中的转换说明符是 `%d`。转换说明符告诉 `printf()`\
  \ 如何解释被打印的变量。`%d` 告诉 `printf()` 将变量视为有符号整数。\n\n##### printf() 转义序列\n\n转义序列用于控制输出的位置。它们用于打印具有特殊含义的字符。例如，为了打印单个反斜杠字符，你需要在格式字符串中包含双反斜杠（`\\\
  \\`）。第一个反斜杠告诉 `printf()` 第二个是字面字符，而不是转义序列的开头。通常情况下，反斜杠告诉 `printf()` 以特殊方式解释后面的字符。这里是一些例子：\n\
  \n![Image](img/14701.jpg)\n\n表 7.1 列出了 C 语言常用的转义序列。\n\n![Image](img/down-arrow.jpg)\n\
  \n**列表 7.1** escape.c: 使用 `printf()` 转义序列\n\n\n\n\n\n点击此处查看代码图像\n\n* * *\n\n“欢迎使用菜单程序”\n\
  \n你准备好做出选择了吗？\n\n1 - 计算机蜂鸣\n2 - 显示报告\n3 - 退出\n\n输入选择：1\n\n计算机正在蜂鸣\n\n1 - 计算机蜂鸣\n\
  2 - 显示报告\n3 - 退出\n\n输入选择：2\n\n示例报告\n\n```\nSequence      Meaning\n=========    \
  \  =======\n\\a            铃声（警报）\n\\b            退格键\n...            ...\n```\n\
  \n1 - 计算机蜂鸣\n2 - 显示报告\n3 - 退出\n\n输入选择：3\n\n你选择了退出！\n\n* * *\n\n代码列表 7.1 与之前的示例相比似乎很长，但它提供了一些值得注意的补充内容。第\
  \ 3 行包含了 `stdio.h` 头文件，因为此列表中使用了 `printf()`。在第 5 行，定义了一个名为 `QUIT` 的常量。根据第 3 节“存储信息：变量与常量”，你已经知道\
  \ `#define` 使使用常量 `QUIT` 等同于使用值 `3`。第 7 行和第 8 行是函数原型。此程序有两个函数：`get_menu_choice()`\
  \ 和 `print_report()`。`get_menu_choice()` 函数定义在第 33 到 51 行。这与代码列表 6.5 中的菜单函数相似。第\
