  \ 15 行到第 26 行包含了第一个 `while` 命令及其语句。第 18 行到第 22 行还包含一个嵌套的 `while` 循环，其所有语句都是外部 `while`\
  \ 的一部分。\n\n外部循环在 `ctr` 小于 `5` 时继续执行（第 15 行）。只要 `ctr` 小于 `5`，第 17 行将 `nbr` 设置为 `0`，第\
  \ 18 行到第 22 行（嵌套的 `while` 语句）在变量 `nbr` 中收集一个数字，第 24 行将数字放入 `array`，第 25 行增加 `ctr`\
