  #### union 关键字\n\n点击此处查看代码\n\n```c\nunion tag {\n    union_member(s);\n    /* 此处可以包含额外的语句\
  \ */\n} instance;\n```\n\n`union` 关键字用于声明联合体。联合体是一个一个或多个变量（联合体成员）的集合，这些变量被分组在一个单一名称下。此外，这些联合体成员中的每一个都占据相同的内存区域。\n\
  \n`union` 关键字标识联合体定义的开始。其后面跟着一个 `tag`，这是赋予给联合体的名称。`tag` 之后是用花括号括起来的联合体成员。还可以定义一个实例（instance），即联合体的实际声明。如果你只定义了结构而不定义实例，它只是一个模板，可以在稍后在程序中使用它来声明结构。以下是模板的格式：\n\
  \n点击此处查看代码\n\n```c\nunion tag {\n    union_member(s);\n    /* 此处可以包含额外的语句 */\n};\n\
  ```\n\n要使用该模板，你可以使用以下格式：\n\n```c\nunion tag instance;\n```\n\n要使用这种格式，你必须之前已经声明了具有给定\
  \ `tag` 的联合体。\n\n**示例 1**\n\n点击此处查看代码\n\n```c\n/* 一个名为 tag 的联合体模板 */\nunion tag\
  \ {\n    int nbr;\n    char character;\n}\n/* 使用该联合体模板 */\nunion tag mixed_variable;\n\
  ```\n\n**示例 2**\n\n点击此处查看代码\n\n```c\n/* 同时声明联合体和实例 */\nunion generic_type_tag {\n\
  \    char c;\n    int i;\n    float f;\n    double d;\n} generic;\n```\n\n**示例 3**\n\
  \n点击此处查看代码\n\n```c\n/* 初始化一个联合体。 */\nunion date_tag {\n    char full_date[9];\n\
  \    struct part_date_tag {\n        char month[2];\n        char break_value1;\n\
  \        char day[2];\n        char break_value2;\n        char year[2];\n    }\
  \ part_date;\n} date = {\"01/01/97\"};\n```\n\n***\n\n列表 11.8 展示了联合体更具实用的用法。虽然这种用法非常简单，但它是联合体最常用的用法之一。\n\
