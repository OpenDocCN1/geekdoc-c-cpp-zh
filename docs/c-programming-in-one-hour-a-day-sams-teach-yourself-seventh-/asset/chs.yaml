  \ 度）包含 2π 弧度。\n\n### 三角函数\n\n三角函数执行某些图形和工程应用中使用的计算：\n\n![Image](img/506tab01.jpg)\n\
  \n### 指数和对数函数\n\n指数函数和对数函数用于某些类型的数学计算：\n\n![Image](img/507tab01.jpg)\n\n### 双曲函数\n\
  \n双曲函数执行双曲三角计算：\n\n![Image](img/507tab02.jpg)\n\n### 其他数学函数\n\n标准 C 库包含以下杂项数学函数：\n\
  \n![Image](img/507tab03.jpg)\n\n### 数学函数的演示\n\n整个书籍可以充满了演示数学函数的 201 程序，展示了这些函数。\n\
  \n![Image](img/down-arrow.jpg) **列表 20.1** math.c 使用 C 库\n\n点击此处查看代码图片 三角函数\n\n\
  ```c\n1: // math.c 展示了一些数学函数\n2: #include <stdio.h>\n3: #include <math.h>\n4: \n\
  5: int main( void )\n6: {\n7:     double x;\n8:     int power;\n9:\n10:     printf(\"\
  Enter a number: \");\n11:     scanf(\"%lf\", &x);\n12:\n13:     printf(\"\\nOriginal\
