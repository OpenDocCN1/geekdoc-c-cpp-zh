  \ `1` 到 `10` 之间的数字是有效的，因此在用户输入有效数字之前，继续程序没有意义。第 18 行到第 22 行阻止了继续。该 `while` 语句规定，当数字小于\
  \ `1` 或大于 `10` 时，程序应该打印输入数字的消息，然后获取该数字。\n\n第 28 行和第 29 行打印存储在 `array` 中的值。注意，由于\
  \ `while` 语句已经处理了变量 `ctr`，因此 `for` 命令可以重用它。从零开始并每次加一，`for` 循环执行五次，打印 `ctr` 加一的值（因为计数从零开始）并打印\
  \ `array` 中对应的值。\n\n为了额外的练习，此程序中有两个你可以更改的地方。第一个是程序接受的值。尝试让它接受 `1` 到 `100`，而不是 `1`\
  \ 到 `10`。你还可以还可以更改它接受的数值数量。目前，它允许五个数字。尝试让它接受 10 个。\n\n* *\n\n### 做\n\n如果你需要在循环内部进行初始化和递增，**务必**使用\
  \ `for` 语句代替 `while` 语句。`for` 语句将初始化、条件和递增语句整合在一起。`while` 语句则不然。\n\n* *\n\n### 不要\n\
  \n如果没有必要，**请不要**使用以下约定：\n\n```c\nwhile (x)\n```\n\n相反，请使用这种约定：\n\n```c\nwhile (x\
  \ != 0)\n```\n\n虽然两种方法都有效，但在调试（尝试查找代码中的问题）时，后一种更清晰。编译时，它们产生的代码几乎相同。\n\n#### do...while\
  \ 循环\n\nC 语言的第三种循环结构是 `do...while` 循环，只要指定的条件为真，它就会执行一个语句块。`do...while` 循环在循环结束时测试条件，而不是在开始时（正如\
  \ `for` 循环和 `while` 循环所做）。\n\n`do...while` 循环的结构如下：\n\n```c\ndo\n    statement\n\
  while (condition);\n```\n\n`condition` 是任何 C 表达式，`statement` 是单个或复合 C 语句。当程序执行到\
  \ `do...while` 语句时，会发生以下事件：\n\n**1.** 执行 `statement` 中的语句。\n**2.** 求值 `condition`。如果为真，执行返回到步骤\
  \ 1。如果为假，循环终止。\n\n`do...while` 循环的操作如图 4 所示。\n\n**图 4** `do...while` 循环的操作。`do...while`\
  \ 循环的语句至少执行一次。这是因为测试在循环结束时评估的，而不是开始处。相比之下，`for` 和 `while` 循环在循环开始时评估，因此如果条件为假，关联语句就不会执行。`do...while`\
  \ 循环的使用频率较低。\n\n**列表 6.5: 简单的 do...while**\n\n```c\n/* 展示简单的 do...while 语句 */\n\
  #include <stdio.h>\n\nint get_menu_choice( void );\n\nint main( void )\n{\n    int\
  \ choice;\n    choice = get_menu_choice();\n    printf(\"You chose Option %d\\n\"\
  , choice);\n    return 0;\n}\n\nint get_menu_choice( void )\n{\n    int selection\
  \ = 0;\n    do\n    {\n        printf(\"\\n1 - 添加记录\");\n        printf(\"\\n2 -\
  \ 修改记录\");\n        printf(\"\\n3 - 删除记录\");\n        printf(\"\\n4 - 退出\");\n \
  \       printf(\"\\nEnter 选择: \");\n        scanf(\"%d\", &selection);\n    }while\
  \ ( selection < 1 || selection > 4 );\n\n    return selection;\n}\n```\n\n* *\n\n\
  输出 ![Image](img/down-arrow.jpg)\n\n点击此处查看代码图像\n\n* *\n\n1 - 添加记录\n2 - 修改记录\n3 -\
  \ 删除记录\n4 - 退出\n输入选择: 8\n1 - 添加记录\n2 - 修改记录\n3 - 删除记录\n4 - 退出\n输入选择: 4\n你选择了选项 4\n\
  \n\n\n\n第 18 到 37 行包含 `get_menu_choice()`。该函数在屏幕上显示菜单（第 24 到 30 行），然后获取选择。因为你至少需要显示一次菜单才能获得答案，所以使用\
  \ `do...while` 循环是合适的。在这个程序中，菜单会一直显示，直到输入有效的选择为止。第 34 行包含 `do...while` 语句的 `while`\
  \ 部分，并验证命名为 `selection` 的选择值的值。如果输入的值不在 `1` 到 `4` 之间，菜单将重新显示，并提示用户输入新值。当输入了有效选择时，程序继续执行到第\
  \ 36 行，该行返回变量 `selection` 中的值。\n\n### 语法\n\n#### do...while 语句\n\n```c\ndo\n{\n\
  \    statement(s)\n}while (condition);\n```\n\n`condition` 是任何有效的 C 表达式，通常是一个关系表达式。当\
  \ `condition` 求值为假（零）时，`while` 语句终止，执行流跳转到 `while` 语句之后的第一条语句；否则，程序跳回 `do`，并执行 `statement(s)`\
  \ 中的 C 语句。\n\n`statement(s)` 是是一个单个 C 语句或一个语句块，在第一次通过循环时执行，之后只要 `condition` 保持为真就会一直执行。\n\
  \n`do...while` 语句是一种 C 循环语句。它允许在 `condition` 保持为真（非零）的情况下重复执行语句或语句块。与 `while` 语句不同，`do...while`\
  \ 循环至少执行一次其语句。\n\n#### 示例 1\n\n点击此处查看代码图像\n\n```c\n/* 即使条件失败也会打印！ */\nint x = 10;\n\
  do\n{\n    printf(\"\\nThe value of x is %d\", x );\n}while (x != 10);\n```\n\n\
  #### 示例 2\n\n点击此处查看代码图像\n\n```c\n/* 获取数字，直到数字大于 99 为止 */\nint nbr;\ndo\n{\n    scanf(\"\
  %d\", &nbr );\n}while (nbr <= 99);\n```\n\n#### 示例 3\n\n点击此处查看代码图像\n\n```c\n/* 允许用户输入最多\
  \ 10 个整数      */\n/* 值存储在名为 value 的数组中。如果输入 99 */\n/* 循环将停止                    \
  \        */\nint value[10];\nint ctr = 0;\nint nbr;\ndo\n{\n    puts(\"Enter a number,\
  \ 99 to quit \");\n    scanf( \"%d\", &nbr);\n    value[ctr] = nbr;\n    ctr++;\n\
  }while (ctr < 10 && nbr != 99);\n```\n\n### 嵌套循环\n\n“嵌套循环”指的是包含另一个循环的循环。你已经见过一些嵌套语句的示例。C\
  \ 语言对循环嵌套没有限制，但每个内层循环必须完全包含在外层循环之内；你不能拥有重叠的循环。因此，以下是不允许的：\n\n点击此处查看代码图像\n\n```c\n\
  for ( count = 1; count < 100; count++)\n{\n    do\n    {\n        /* do...while\
  \ loop */\n    } /* end of for loop */\n    }while (x != 0);\n```\n\n如果 `do...while`\
  \ 循环完全放在 `for` 循环内部，则没有问题：\n\n点击此处查看代码图像\n\n```c\nfor(count = 1; count < 100; count++)\n\
  {\n    do\n    {\n        /* do...while loop */\n    }while (x != 0);\n} /* end\
  \ of for loop */\n```\n\n当你使用嵌套循环时，记住在内层循环中进行的更改可能会影响外层循环。然而，注意内层循环可能独立于外层循环中的任何变量；在本示例中它们并非如此。在上例中，如果内层的\
  \ `do...while` 循环修改了 `count` 的值，外层 `for` 循环执行的次数就会受到影响。良好的缩进风格会让带有嵌套循环的代码更容易读。每一层循环都应该比上一层再多缩进一步。这清晰地标记了与每个循环相关的代码。\n\
  \n### 应当\n\n**当**你知道一个循环应该执行一次时，请使用 `do...while` 循环。\n\n### 不要\n\n**不要**尝试让循环重叠。\n\
  \n### 总结\n\n在本本节后，你几乎已经准备好使用 `for`、`while` 和 `do...while` 了。这些结构中的每一个都允许程序执行零次、一次或多次。`while`\
  \ 语句在 `condition` 为真时运行。`do...while` 语句始终至少执行一次语句。C 语言允许循环嵌套，但它们必须完全位于另一个循环之内。\n\
  \n\n\n\n\n```c\nfor (x = 0; x < 100, x++) ;\n```\n\n#### 4. 当执行以下语句后，`ctr` 的值是多少？\n\
