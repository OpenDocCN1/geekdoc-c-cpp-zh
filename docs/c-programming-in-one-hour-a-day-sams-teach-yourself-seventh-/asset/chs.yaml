  \n**8.** 以下代码声明了什么？\n\n**a.** `int *var1;`\n\n**b.** `int var2;`\n\n**c.** `int\
  \ **var3;`\n\n**9.** 以下代码声明了什么？\n\n**a.** `int a[3][12];`\n\n**b.** `int (*b)[12];`\n\
  \n**c.** `int *c[12];`\n\n#### 练习题\n\n**1.** 编写一条语句声明一个包含 10 个 `char` 类型指针的数组。\n\
  \n**2. 漏洞排查 (BUG BUSTER):** 以下代码有任何问题吗？\n\n```c\nint x[3][12];\nint *ptr[12];\n\
  ptr = x;\n```\n\n*因为有多种解决方案，本练习题不提供答案。*\n\n**3. 自行练习:** 编写一个程序声明一个 12×12 的字符数组。在每隔一个元素的位置放置\
  \ X。使用一个指向数组的指针以网格格式将值打印到屏幕上。\n\n## 第 16 课：函数指针和链表\n\n在上一节课中，你学习了一些利用指针的新方法，特别是在数组方面。在本节中，你将进一步加深你对指针的认知，学习一些将为你的创作增加显著编程能力的技巧。在本节中，你将学习：\n\
  \n![Image](img/squf.jpg) 如何声明函数指针\n\n![Image](img/squf.jpg) 如何使用指针创建链表\n\n### 使用函数指针\n\
  \n函数指针提供了调用函数的另一种方式。“等一下，”你可能会想，“你怎么能有一个函数的指针呢？指针不应该持有变量存储的地址吗？”\n\n嗯，既是又不是。指针持有地址这一点是对的，但它不一定是变量所在的地址。当你的程序运行时，每个函数的代码都会从特定的地址开始加载到内存中。函数指针持有函数的起始地址。为什么要使用函数指针？它提供了一种更灵活的调用函数的方法。它允许程序从几个函数中进行选择，选择适用于当前情况的一个。\n\
  \n#### 声明函数指针\n\n与所有变量一样，你在使用函数指针之前必须声明它。通用格式如下：\n\n点击此处查看代码图像\n\n`type (*ptr_to_func)(parameter_list);`\n\
  \n该语句将 `ptr_to_func` 声明为指向函数的指针。以下是一些具体的示例：\n\n点击此处查看代码图像\n\n```c\nint (*func1)(int\
  \ x);\nvoid (*func2)(double y, double z);\nchar (*func3)(char *p[]);\nvoid (*func4)();\n\
  ```\n\n第一行将 `func1` 声明接受一个 `int` 参数并返回 `int` 的指针。第二行将 `func2` 声明接受两个 `double` 参数且返回类型为\
  \ `void` 的指针（无返回值）。第三行将 `func3` 声明为接受一个 `char` 指针数组作为参数并返回 `char` 的指针。最后一行将 `func4`\
  \ 声明为不接受参数且返回类型为 `void` 的指针。\n\n为什么在指针名周围需要加括号？为什么你不能像第一个示例那样写：\n\n```c\nint *func1(int\
  \ x);\n```\n\n原因在于间接运算符 `*` 的优先级。它的优先级较低，低于参数列表周围的括号。上述没有第一组括号的声明将 `func1` 声明为一个返回\
  \ `int` 类型指针的函数。（返回指针的函数将在第 19 课 “从函数获取更多”中介绍。）当你声明函数指针时，始终记住在指针名和间接运算符周围加上括号，否则可能会遇到麻烦。\n\
  \n#### 初始化和使用函数指针\n\n函数指针不仅必须声明，还需要初始化指向某个地方。这个“地方”当然是一个函数。被指向的函数并没有特殊。唯一的要求是它的返回类型和参数列表与指针声明的返回类型和参数列表匹配。例如，以下代码声明并定义了一个函数以及指向该函数的指针：\n\
  \n点击此处查看代码图像\n\n```c\nfloat square(float x); // 函数原型。\nfloat (*ptr)(float x); //\
  \ 指针声明。\n\nfloat square(float x) // 函数定义。\n{\n    return x * x;\n}\n```\n\n\n\n\n\
  由于函数 `square()` 和指针 `ptr` 具有相同的参数和返回类型，你可以按照如下方式初始化 `ptr` 指向 `square`：\n\n```c\n\
  ptr = square;\n```\n\n然后你可以按照如下方式使用指针调用该函数：\n\n```c\nanswer = ptr(x);\n```\n\n就是如此简单。要查看一个真实的示例，请编译并运行\
  \ 列表 16.1，该示例声明并初始化了一个函数指针，然后调用了两次函数：第一次使用函数名，第二次使用指针。两次调用都会产生相同的结果。\n\n输入 ![Image](img/down-arrow.jpg)\n\
  \n**列表 16.1** `ptrfunc.c`：使用函数指针调用函数\n\n点击此处查看代码图像\n\n```c\n1:  // ptrfunc.c-- 声明和使用函数指针的演示。\n\
  2:\n3:  #include <stdio.h>\n4:\n5:  // 函数原型。\n6:\n7:  double square(double x);\n\
  8:\n9:  // 指针声明。\n10:\n11: double (*ptr)(double x);\n12:\n13: int main( void )\n\
  14: {\n15:     // 初始化 p 指向 square()。\n16:\n17:      ptr = square;\n18:\n19:    \
  \ // 用两种方式调用 square()。\n20:      printf(\"%f  %f\\n\", square(6.6), ptr(6.6));\n\
  21:      return 0;\n22: }\n23:\n24: double square(double x)\n25: {\n26:      return\
  \ x * x;\n27: }\n```\n\n输出 ![Image](img/down-arrow.jpg)\n\n```\n43.560000  43.560000\n\
  ```\n\n### 注意\n值的精度可能会导致某些数字显示为与输入的完全不相同的值。例如，正确答案 `43.56` 可能会显示为 `43.559999`。\n\
  \n第 7 行声明了函数 `square()`，第 11 行声明了指针 `ptr`，它指向包含一个 `double` 参数并返回 `double` 值的函数，这与\
  \ `square()` 的声明相匹配。第 17 行将指针 `ptr` 设置为 `square`。注意 `square` 或 `ptr` 都没有使用括号。第 20\
  \ 行打印了调用 `square()` 和 `ptr()` 的返回值。\n\n不带括号的函数名是一个指向该函数的指针。（这听起来和数组的情况相似，不是吗？）声明并使用独立函数指针的意义何在？嗯，函数名本身是一个指针常量，不能被更改（再次，与数组形成类比）。与之相反，指针变量是可以更改的。具体来说，它可以根据需要被使其指向不同的函数。\n\
  \n列表 16.2 调用了一个函数，并向其传递了一个整数参数。根据参数的值，该函数会初始化一个指针指向其他三个函数之一，然后使用该指针调用相应的函数。这三个函数中的每一个都会在屏幕上显示特定的特定的消息。\n\
  \n输入 ![Image](img/down-arrow.jpg)\n\n**列表 16.2** `ptrfunc2.c`：根据程序情况使用指针调用不同的函数\n\
  \n点击此处查看代码图像\n\n```c\n1:  /* ptrfunc2.c-- 使用指针调用不同的函数。 */\n2:\n3:  #include <stdio.h>\n\
  4:\n5:  /* 函数原型。 */\n6:\n7:  void func1(int x);\n8:  void one(void);\n9:  void two(void);\n\
  10: void other(void);\n11:\n12:  int main( void )\n13: {\n14:      int nbr;\n15:\n\
  16:      for (;;)\n17:      {\n18:          puts(\"\\nEnter 1 到 10 之间的整数，0 退出：\"\
  );\n19:          scanf(\"%d\", &nbr);\n20:\n21:          if (nbr == 0)\n22:    \
  \          break;\n23:          func1(nbr);\n24:      }\n25:      return 0;\n26:\
  \ }\n27:\n28: void func1(int val)\n29: {\n30:  /* 指向函数的指针。 */\n31:\n32:  void (*ptr)(void);\n\
  33:\n34:  if (val == 1)\n35:      ptr = one;\n36:  else if (val == 2)\n37:     \
  \ ptr = two;\n38:  else\n39:      ptr = other;\n40:  ptr();\n41: }\n42:\n43: void\
  \ one(void)\n44: {\n45:      puts(\"你输入了 1.\");\n46: }\n47:\n48: void two(void)\n\
  49: {\n50:      puts(\"你输入了 2.\");\n51: }\n```\n\n输出 ![Image](img/down-arrow.jpg)\n\
  \n点击此处查看代码图像\n\n```\nEnter 1 到 10 之间的整数，0 退出：\n1\n你输入了 1。\nEnter 1 到 10 之间的整数，0\
  \ 退出：\n2\n你输入了 2。\nEnter 1 到 10 之间的整数，0 退出：\n9\n你输入了其他数字。\nEnter 1 到 10 之间的整数，0\
  \ 退出：\n0\n```\n\n### 分析\n该程序使用第 16 行的无限循环，直到输入 0 为止。当输入非零值时，该值被传递给 `func1()`。注意，第\
  \ 32 行定义的 `ptr` 在 `func1()` 内部是局部的，因为程序的其他部分不需要访问它。第 34 到 39 行将 `ptr` 设置为相应的函数。第\
  \ 41 行通过 `ptr()` 调用该函数。\n\n当然，这个程序只是为了演示。现在你可以学习另一种调用不同函数的方法：将指针作为参数传递。列表 16.3 是\
  \ 列表 16.2 的修订版。\n\n![Image](img/down-arrow.jpg)\n\n**列表 16.3** `passptr.c`：将指针作为参数传递给函数\n\
  \n\n\n\n\n你可能会使用函数指针的编程场景之一是需要排序时。有时，你可能希望使用不同的排序规则。例如，你可能在某一次按字母顺序排序，而在另一次按字母倒序顺序排序。通过使用函数指针，你的程序可以调用正确的排序函数。更准确地说，通常调用的是不同的比较函数。\n\
  \n回看上一节中的代码列表 15.7。在 `sort()` 函数中，实际的排序顺序由 `strcmp()` 库函数的返回值决定，该函数告诉程序给定字符串是另一个字符串的“小于”还是“大于”。如果你写了两个比较函数呢——一个是按字母顺序排序（A\
  \ 小于 Z），另一个按字母倒序顺序排序（Z 小于 A）？程序可以询问用户他想要的顺序，并通过使用指针，排序函数可以调用适当的比较函数。代码列表 16.4 修改了代码列表\
  \ 15.7 以包含这一功能。\n\n输入 ![Image](img/ 将它们显示在屏幕上。\n4:    #include <stdlib.h>\n5:  \
  \  #include <stdio.h>\n6:    #include <string.h>\n7:\n8:    #define MAXLINES 25\n\
  9:\n10:  int get_lines(char *lines[]);\n11:  void sort(char *p[], int n, int sort_type);\n\
  12:  void print_strings(char *p[], int n);\n13:  int alpha(char *p1, char *p2);\n\
  14:  int reverse(char *p1, char *p2);\n15:\n16:  char *lines[MAXLINES];\n17:\n18:\
  \  int main( void )\n19:  {\n20:      int number_of_lines, sort_type;\n21:\n22:\
  \      // 从键盘读取行。\n23:\n24:      number_of_lines = get_lines(lines);\n25:\n26: \
  \     if ( number_of_lines < 0 )\n27:      {\n28:          puts(\"Memory allocation\
  \ error\");\n29:          exit(-1);\n30:      }\n31:\n32:      puts(\"Enter 0 for\
  \ reverse order sort, 1 for alphabetical:\" );\n33:      scanf(\"%d\", &sort_type);\n\
  34:\n35:      sort(lines, number_of_lines, sort_type);\n36:      print_strings(lines,\
  \ number_of_lines);\n37:      return 0;\n38:  }\n39:\n40:  int get_lines(char *lines[])\n\
  41:  {\n42:      int n = 0;\n43:      char buffer[80];  // 每行的临时存储区。\n44:\n45: \
  \     puts(\"Enter one line at time; enter a blank when done.\");\n46:\n47:    \
  \  while (n < MAXLINES && gets(buffer) != 0 && buffer[0] != '\\0')\n48:      {\n\
  49:          if ((lines[n] = (char *)malloc(strlen(buffer)+1)) == NULL)\n50:   \
  \       return -1;\n51:          strcpy( lines[n++], buffer );\n52:      }\n53:\
  \      return n;\n54:\n55:  } // End of get_lines()\n56:\n57:  void sort(char *p[],\
  \ int n, int sort_type)\n58:  {\n59:      int a, b;\n60:      char *x;\n61:\n62:\
  \      // 函数指针。\n63:      int (*compare)(char *s1, char *s2);\n64:\n65:      //\
  \ 初始化指针，根据参数 sort_type\n66:      // 指向适当函数。\n67:\n68:      compare = (sort_type)\
  \ ? reverse : alpha;\n69:\n70:      for (a = 1; a < n; a++)\n71:      {\n72:   \
  \       for (b = 0; b < n-1; b++)\n73:          {\n74:              if (compare(p[b],\
  \ p[b+1]) > 0)\n75:              {\n76:                  x = p[b];\n77:        \
  \          p[b] = p[b+1];\n78:                  p[b+1] = x;\n79:              }\n\
  80:          }\n81:      }\n82:  } // end of sort()\n83:\n84:  void print_strings(char\
  \ *p[], int n)\n85:  {\n86:      int count;\n87:\n88:      for (count = 0; count\
  \ < n; count++)\n89:          printf(\"%s\\n\", p[count]);\n90:  }\n91:\n92:  int\
  \ alpha(char *p1, char *p2)\n93:  // 字母顺序比较。\n94:  {\n95:      return(strcmp(p2,\
  \ p1));\n96:  }\n97:\n98:  int reverse(char *p1, char *p2)\n99: // 字母倒序比较。\n100:\
  \ {\n101:     return(strcmp(p1, p2));\n102: }\n```\n\n* * *\n\n输出 ![Image](img/down-arrow.jpg)\n\
  \n* * *\n\n`main()` 函数中的第 32 和第 33 行提示用户所需的排序顺序。输入的值被存放在 `sort_type` 中。该值被传递给 `sort()`\
  \ 函数，连同 代码列表 15.7 中描述的其他信息一起。`sort()` 函数包含几处更改。第 64 行声明了一个名为 `compare()` 的函数指针，该函数接受两个字符指针（字符串）作为参数。第\
  \ 69 行根据 `sort_type` 的值将 `compare()` 指向列表中添加的两个新函数之一。这两个新函数是 `alpha()` 和 `reverse()`。`alpha()`\
  \ 使用 `strcmp()` 库函数的方式与其在 代码列表 15.7 中使用的完全一样。\n\n\n\n\n\n注意在图 16.1 中，每个 `person`\
  \ 结构都指向下一个 `person` 结构。最后一个 `person` 结构不指向任何内容。链表中的最后一个元素是通过其指针元素被赋值为 `NULL` 来标识的。\n\
  \n**注意**\n构成链表链接的结构可以称为链表的 `links`（链接）、`nodes`（节点）或 `elements`（元素）。\n\n你已经看到链表中的最后一个链接是如何被标识的。那么第一个链接呢？它是通过一个特殊的指针（不是结构体）指针，称为\
  \ `head pointer`（头指针）来标识的。`head pointer` 始终指向链表的第一个元素。第一个元素包含一个指向第二个元素的指针；第二个元素包含一个指向第三个元素的指针，依此类推，直到你遇到一个指针为\
  \ `NULL` 的元素。如果整个列表为空（不包含任何链接），则将 `head pointer` 设置为 `NULL`。图 16.2 展示了在列表开始之前和添加第一个列表元素之后头指针的状态。\n\
  \n![Image](img/16fig02.jpg)\n**FIGURE 16.2** 链表的头指针。\n\n**注意**\n`head pointer` 是指向链表中第一个元素的指针。`head\
  \ pointer` 有时也称为第一个元素指针或顶端指针（top pointer）。\n\n## 操作链表\n\n当你操作链表时，可以添加、删除或修改元素或链接。修改元素并没有真正的挑战；然而，添加和删除元素则具有挑战性。如前所述，列表元素是通过指针连接的。添加和删除元素的大部分工作由操作这些指针组成。你可以将元素添加到链表的开头、中间或末尾；这决定了指针必须如何更改。\n\
  \n在本节的稍后部分中，你可以找到一个简单的链表演示，以及一个更复杂的运行程序。不过，在进入代码细节之前，检查你对链表需要执行的某些操作是一个好主意。对于这些章节，请继续使用之前引入的\
  \ `person` 结构。\n\n### 准备工作\n\n在开始链表之前，你必须定义将用于列表的数据结构，并且声明头指针。因为列表开始时是空的，所以 `head\
  \ pointer` 应该初始化为 `NULL`。你还需要一个指向你的列表结构类型的额外指针，用于添加记录。（你可能需要多个一个指针，正如你很快就会看到的）。以下是操作方法：\n\
  \n```c\nstruct person {\n  char name[20];\n  struct person *next;\n};\n\nstruct\
  \ person *head;\n\nhead = NULL;\n```\n\n### 在列表开头添加元素\n\n如果 `head pointer` 为 `NULL`，则列表为空，新元素将是它的唯一成员。如果\
  \ `head pointer` 不为 `NULL`，则列表已经包含一个或多个元素。然而，无论在何种情况下，在列表开头添加新元素的步骤都是相同的：\n\n**1.**\
  \ 创建你的结构体实例，使用 `malloc()` 分配内存空间。\n**2.** 将新元素的 `next` 指针设置为 `head pointer` 的当前值。如果列表为空，这将是\
  \ `NULL`；否则，将是第一个元素的地址。\n**3.** 让 `head pointer` 指向新元素。\n\n以下是执行此任务的代码：\n\n```c\n\
  new = (person*)malloc(sizeof(struct person));\nnew->next = head;\nhead = new\n```\n\
  \n注意 `malloc()` 经过了类型转换，以便其返回值为正确的类型——指向 `person` 数据结构的指针。\n\n**警告**\n以正确的顺序切换指针是非常重要的。如果你先重新分配\
  \ `head pointer`，你将丢失整个链表！\n\n图 16.3 展示了向空列表添加新元素的过程，图 16.4 展示了向现有列表添加第一个元素。\n\n\
  ![Image](img/16fig03.jpg)\n**FIGURE 16.3** 向空列表添加新元素。\n\n![Image](img/16fig04.jpg)\n\
  **FIGURE 16.4** 向现有列表添加第一个元素。\n\n注意 `malloc()` 用于为新元素分配内存。每当添加一个新元素时，只为它分配所需的内存。也可以使用\
  \ `calloc()` 函数。你应该意识到这两者之间的区别。主要区别在于 `calloc()` 会初始化新元素；而 `malloc()` 则不会。\n\n**警告**\n\
  在这些代码片段中，没有检查 `malloc()` 的返回值以确保内存已成功分配。在实际程序中，你应该始终检查内存分配函数的返回值。\n\n**提示**\n在声明指针时，你应该始终将其初始化为\
  \ `NULL`。永远不要让指针处于未初始化状态。这样做异于自找麻烦。\n\n### 在列表末尾添加元素\n\n要向链表末尾添加元素，你从 `head pointer`\
  \ 开始遍历列表，直到找到最后一个元素。找到它后，遵循以下步骤：\n\n**1.** 创建你的结构体实例，使用 `malloc()` 分配内存空间。\n**2.**\
  \ 将最后一个元素中的 `next` 指针指向新元素（该地址由 `malloc()` 返回）。\n**3.** 将新元素中的 `next` 指针设置为 `NULL`，以指示它是列表中的最后一个项。\n\
  \n以下是代码：\n\n```c\nperson *current;\n...\ncurrent = head;\nwhile (current->next !=\
  \ NULL)\n  current = current->next;\nnew = (person*)malloc(sizeof(struct person));\n\
  current->next = new;\nnew->next = NULL;\n```\n\n图 16.5 展示了向链表末尾添加新元素的过程。\n\n![Image](img/16fig05.jpg)\n\
  **FIGURE 16.5** 向链表末尾添加新元素。\n\n### 在列表中间添加元素\n\n当你操作链表时，大多数时间你在列表中间的某个地方添加元素。你放置新元素的的确切位置取决于你如何维护列表——例如，如果它是根据一个或多个数据元素进行排序的。那么，这个过程需要你首先定位新元素应该所在的列表位置，然后添加它。\n\
  \n**1.** 在列表中定位新元素将放置之后的现有元素。将其命名为 `marker element`（标记元素）。\n**2.** 创建你的结构体实例，使用\
  \ `malloc()` 分配内存空间。\n**3.** 将 `marker element` 的 `next` 指针指向新元素（该地址由 `malloc()`\
  \ 返回）。\n**4.** 将新元素的 `next` 指针指向 `marker element` 原指向的元素。\n\n代码可能像这样：\n\n```c\n\
  person *marker;\n/* 此处设置 marker 指向目标列表位置 */\n...\nnew = (LINK)malloc(sizeof(PERSON));\n\
  new->next = marker->next;\nmarker->next = new;\n```\n\n图 16.6 展示了这一过程。\n\n![Image](img/16fig06.jpg)\n\
  **FIGURE 16.6** 在链表中间添加新元素。\n\n### 从列表中删除元素\n\n从链表中删除元素只是操作指针的简单问题。具体过程取决于元素在列表中的位置：\n\
  \n![Image](img/squf.jpg) 要删除第一个元素，将 `head pointer` 指向列表中的第二个元素。\n\n![Image](img/squf.jpg)\
  \ 要删除最后一个元素，将倒数第二个元素的 `next` 指针设置为 `NULL`。\n\n![Image](img/squf.jpg) 要删除其他任何元素，将被删除元素之前的元素的\
  \ `next` 指针指向被删除元素之后的元素。\n\n\n\n\n此外，从列表中移除的元素的内存应该被释放，这样程序就不会占用比它需要的更多的内存。（这被称为内存泄漏。）释放内存是通过\
  \ `free()` 函数完成的，该函数在第 21 节“处理内存””中进行了详细解释。以下是删除链表中第一个元素的代码：\n\n```c\ntemp = head;\n\
  head = head->next;\nfree(temp);\n```\n\n这段代码删除列表中的最后一个元素：\n\n点击此处查看代码图像\n\n```c\n\
  person *current1, *current2;\ncurrent1 = head;\ncurrent2= current1->next;\nwhile\
  \ (current2->next != NULL)\n{\n    current1 = current2;\n    current2= current1->next;\n\
  }\nfree(current1->next);\ncurrent1->next = null;\nif (head == current1)\n    head\
  \ = null;\n```\n\n最后，以下代码从列表内部删除一个元素：\n\n点击此处查看代码图像\n\n```c\nperson *current1, *current2;\n\
  /* 此处编写代码使 current1 指向 */\n/* 被删除元素的前一个元素。 */\ncurrent2 = current1->next;\nfree(current1->next);\n\
  current1->next = current2->next;\n```\n\n在执行完上述任何一个过程后，被删除的元素将从列表中移除，因为列表中没有指针指向它。\n\
  \n### 简单的链表演示\n\n列表 16.5 演示了使用链表的基本知识。这个程序显然仅用于演示目的，因为它不接受用户输入，除了显示执行最基础链表任务所需的代码外，没有做任何有用的事。程序执行了以下操作：\n\
  \n1. 它定义了一个结构以及列表所需的指针。\n2. 它向列表中添加第一个元素。\n3. 它在列表末尾添加一个元素。\n4. 它在列表中间添加一个元素。\n\
  5. 它在屏幕上显示列表内容。\n\n输入 ![Image](img/down-arrow.jpg)\n\n**列表 16.5** linkdemo.c: 链表的基础\n\
  \n点击此处查看代码图像\n\n* *\n\n```c\n1:  /* linkdemo.c--演示了使用 */\n2:  /* 链表的基础知识。 */\n3:\n\
  4:  #include <stdlib.h>\n5:  #include <stdio.h>\n6:  #include <string.h>\n7:\n8:\
  \  /* 列表数据结构。 */\n9:  struct data {\n10:      char name[20];\n11:      struct data\
