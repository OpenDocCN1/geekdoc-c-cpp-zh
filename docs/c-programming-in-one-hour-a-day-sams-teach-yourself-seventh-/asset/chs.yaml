  \ 在成功时返回 `0`，发生错误时返回 `-1`。错误可能由以下原因（以及其他）：\n- `oldname` 不存在。\n- 以名为 `newname` 的文件已存在。\n\
  - 你尝试重命名到另一个磁盘。\n\n列表 17.9 展示了 `rename()` 的用法。\n\n输入 ![Image](img/down-arrow.jpg)\n\
