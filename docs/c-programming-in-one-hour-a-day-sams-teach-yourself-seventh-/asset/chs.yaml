  \n`copy_file()` 函数工作得非常完美，让你能够复制从小型文本文件到大文件的任何内容。然而，它确实有局限性。如果目标文件已经存在，该函数会在不询问的情况下直接删除它。对你来说，一个很好的编程练习是修改\
  \ `copy_file()` 以检查目标文件是否存在，然后询问用户是否覆盖旧文件。列表 17.10 中的 `main()` 应该看起来熟悉。它与 列表 17.9\
  \ 中的 `main()` 几乎相同，区别仅在于第 14 行。该函数没有使用 `rename()`，而是使用了 `copy()`。由于 C 语言没有 `copy()`\
  \ 函数，因此第 24 行到 60 行创建了一个。第 31 行和 32 行以二进制只读模式打开源文件 `fold`。第 36 行到 40 行以二进制只写模式打开目标文件\
  \ `fnew`。注意，第 38 行在打开目标文件出错时会关闭源文件。第 46 行到 54 行的 `while` 循环执行了文件的实际复制操作。第 48 行从源文件\
  \ `fold` 中获取一个字符。第 50 行检查是否读取到了文件结束标记。如果已到达文件末尾，则执行 `break` 语句退出 `while` 循环。如果未到达文件末尾，则将字符写入目标文件\
  \ `fnew`。第 56 行和 57 行在返回到 `main()` 之前关闭了这两个文件。\n\n### 使用临时文件\n\n某些程序在执行期间会使用一个或多个临时文件。临时文件是由程序创建、在执行期间用于某些目的的文件。在\
  \ C 标准库中，`tmpnam()` 函数可以生成一个文件名，其原型如下：\n\n```c\nchar *tmpnam(char *s);\n```\n\n\
  参数 `s` 必须是一个足够存储文件名的字符数组。如果传递 `NULL`，则函数返回一个指向动态分配内存的指针，在这种情况下，你必须使用 `free()` 释放该内存。`tmpnam()`\
  \ 返回的文件名不会与任何现有文件冲突。\n\n你可以通过以下代码片段创建并删除临时文件：\n\n```c\nchar tempname[80];\nFILE\
  \ *tmpfile;\ntmpnam(tempname);\ntmpfile = fopen(tempname, \"w\");  /* 使用适当模式 */\n\
  fclose(tmpfile);\nremove(tempname);\n```\n\n`tmpnam()` 只是生成文件名，它并没有实际创建任何文件。列表 17.11\
  \ 展示了使用 `tmpnam()` 的两种方法。\n\n列表 17.11 tempfile.c: 使用临时文件的方法\n\n点击此处查看代码图像\n\n\n\n\
  \n最后，C 提供了一些基础的文件管理函数，使你能够删除和重命名磁盘文件。在本节中，你已经自己编写了一个复制文件的函数。\n\n### 问答\n\n**问 在使用\
  \ `remove()`、`rename()`、`fopen()` 和其他文件函数时，我可以在文件名中使用驱动器号和路径吗？**\n\n**答** 可以的。你可以使用带有路径和驱动器号的完整文件名，也可以只使用文件名本身。如果你只使用文件名，函数将在当前目录中查找该文件。请记住，在使用反斜杠(`\\\
  `）时，你需要使用转义序列。还要记住，UNIX 使用斜杠（`/`）作为目录分隔符。\n\n**问 我可以读取文件末尾之后的内容吗？**\n\n**答** 可以的。你也可以读取文件开头之前的内容。这种读取结果可能是灾难性的。读取文件就像处理数组一样。你查看的是内存中的偏移量。如果你在使用\
  \ `fseek()`，应该检查确保你没有超出文件末尾。\n\n**问 如果我不关闭文件会发生什么？**\n\n**答** 关闭任何已打开的文件是良好的编程习惯。默认情况下，文件在程序退出时应该会被关闭；然而，你不应该依赖这一点。如果文件没有关闭，你以后可能无法再次访问它，因为操作系统会认为该文件正在使用。\n\
  \n**问 我可以同时打开多少个文件？**\n\n**答** 这个问题无法用一个简单的数字回答。打开文件数量的限制基于你操作系统设置的变量。更多信息请参阅你的操作系统手册。\n\
  \n**问 我可以使用随机访问函数按顺序读取文件吗？**\n\n**答** 在顺序读取文件时，不需要使用像 `fseek()` 这样的函数。因为文件指针停留在它最后所在的位置，这正是你顺序读取时所需的位置。你可以使用\
  \ `fseek()` 来按顺序读取文件；但这样做并没有任何益处。\n\n### 工作坊\n\n工作坊提供了测验题来帮助你巩固对所涵盖内容的理解，并提供了练习来提供使用所学知识的经验。\n\
