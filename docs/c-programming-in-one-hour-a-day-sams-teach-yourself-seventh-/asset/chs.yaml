  \ `buf2` 中的字符。第 22–25 行评估了返回值并打印适当的消息。\n\n### `strpbrk()` 函数\n\n库函数 `strpbrk()`\
  \ 与 `strcspn()` 类似，它在一个字符串中搜索另一个字符串中包含的任何字符的首次出现位置。它的不同之处在于搜索时不包含终止的空字符。该函数的原型定义定义如下：\n\
