  \ `strchr()` 函数解释的那样，你可以通过从 `strpbrk()` 返回的指针减去指针 `str1` 来获取 `str1` 中首次匹配的偏移量（当然，前提它不是\
  \ `NULL`）。例如，将列表 18.9 第 20 行的 `strcspn()` 替换为 `strpbrk()`。\n\n### `strstr()` 函数\n\
  \n最后一个且可能最有用的 C 字符串搜索函数是 `strstr()`。该函数在另一个字符串中搜索一个字符串的首次出现，并且搜索的是整个字符串，而不仅仅是字符串中的单个字符。它的原型是：\n\
  \n点击此处查看代码图像\n\n```c\nchar *strstr(const char *str1, const char *str2);\n```\n\n\
  `strstr()` 函数返回一个指向 `str1` 中 `str2` 首次出现位置的指针。如果没有找到匹配项，该函数返回 `NULL`。如果 `str2` 的长度为\
  \ `0`，函数返回 `str1`。当 `strstr()` 找到匹配时，你可以像之前为 `strchr()` 解释的那样，通过指针减法获取 `str2` 在\
  \ `str1` 中的偏移量。`strstr()` 使用的匹配过程是大小敏感的。列表 18.11 展示了如何使用 `strstr()`。\n\n输入 ![Image](img/down-arrow.jpg)\n\
