  \ `var`。你需要将 `var` 作为参数传递给函数吗？**\n\n**5.** 程序可以拥有同名的全局变量和局部变量吗？编写一个使用同名全局和局部变量的程序来证明你的答案。**\n\
  \n\n\n\n```\n{\n    char star = '*';\n    puts( \"\\nIt has a problem\\n\" );\n\
  \    for ( int ctr2 = 0; ctr2 < 25; ctr2++ )\n    {\n        printf( \"%c\", star);\n\
  \    }\n}\n```\n\n### 7. 漏洞排除：以下代码哪里错了？\n\n点击此处查看代码图像\n\n```c\n/*统计 0 到 100 之间偶数的个数。\
  \ */\n#include <stdio.h>\n\nint main( void )\n{\n    int x = 1;\n    static int\
  \ tally = 0;\n    for (x = 0; x < 101; x++)\n    {\n        if (x % 2 == 0)  /*如果\
  \ x 是偶数...*/\n        tally++;         /*将 tally 加 1。\n    }\n    printf(\"There\
  \ are %d even numbers.\\n\", tally);\n    return 0;\n}\n```\n\n### 8. 漏洞排除：以下程序有什么问题吗？\n\
