  \n**7. 自行尝试：** 编写一个像计算器一样的程序。该程序应该允许加法、减法、乘法除法。\n\n## 第 14 节。处理屏幕、打印机和键盘\n\n几乎每个程序必须执行输入和输出。程序处理输入输出的程度通常是判断程序用性的最佳标准。你已经学会了如何执行一些基本的输入输出。在本节中，你将学习\n\
  \n![Image](img/squf.jpg) C 如何使用流进行输入输出\n\n![Image](img/squf.jpg) 从键盘接受输入的各种方式\n\n\
  ![Image](img/squf.jpg) 在屏幕上显示文本和数值数据的方法\n\n![Image](img/squf.jpg) 如何将输出发送打印机\n\n\
  ![Image](img/squf.jpg) 如何重定向程序的输入输出\n\n### 流与 C\n\n在进入程序输入输出的细节之前，你需要学习流。所有的 C 输入输出都是通过流完成的，无论输入来自哪里或输出去向何处。正如你后面看到的，这种处理所有输入输出的标准方法对程序员具有明显的优势。当然，这意味着理解流是什么以及它们如何工作至关重要。首先，你需要确切知道\
  \ `input`（输入）和 `output`（输出）的意思。\n\n#### 什么是程序输入输出？\n\n正如你在书中之前学到的，C 程序在执行时会将数据保留在随机存存储器（RAM）中。这些数据以程序声明的变量、结构体和数组的形式存在。这些数据从哪里来？程序可以用它们做什么？\n\
  \n![Image](img/squf.jpg) 数据可以来自程序的外部某些位置。从外部位置移动到 RAM 供程序访问的数据被称为 `input`。键盘和磁盘文件是程序输入的最常见来源。\n\
  \n![Image](img/squf.jpg) 数据也可以发送到程序的外部位置；这被称为 `output`。输出最常见目标是屏幕、打印机和磁盘文件。\n\n\
  输入源和输出目标统称为设备。键盘是一个设备，屏幕是一个设备，以此此类推。某些设备（键盘）仅限输入，另一些（屏幕）仅限输出，而还有一些（磁盘）两者皆。\n\n####\
  \ 什么是流？\n\n`stream`（流）是字符序列。更准确地说，它是字节序列。流入程序的字节序列是输入流；流出程序的字节序列是输出流。流的主要优势是输入/输出与设备无关。程序员不需要担心它们源于何处或去往。每个\
  \ C 流都连接到一个文件。在此背景下，`file`（文件）并不是指磁盘。它是流与实际设备之间的中间步骤。\n\n#### 文本流与二进制流\n\nC 流分为两种：文本和二进制。文本流仅包含字符，例如发送到屏幕的文本数据。文本流组织成行，每行可达\
  \ 255 个字符，并以换行符结束。文本流中的某些字符被识别为具有特殊含义，例如换行符。本节讨论的是文本流。\n\n`binary`（二进制）流可以处理任何类型的数据，包括但不限于文本数据。二进制流中的数据字节不会以任何特殊方式翻译或解释；它们按原样读写。二进制流主要用于磁盘文件，将在第\
  \ 17 节中介绍。\n\n#### 预定义流\n\nC 的 ANSI 标准三个预定义流，也称为标准输入输出文件。这些流在 C 程序开始执行时自动打开，并在程序终止时关闭。程序员不需要任何特殊操作来使这些流可用。表\
  \ 14.1 列出了标准流及其通常连接的设备。所有标准流都是文本模式流。\n\n![Image](img/14tab01.jpg)\n\n**表 14.1**三个标准流\n\
  \n* * *\n\n注意\n\n在 DOS 时代，有两个额外的流：`stdprn`（打印机端口）和 `stdaux`（串口）。然而，这些从未是 ANSI 标准，仅由\
  \ DOS 和 Windows 支持。考虑到 C 语言的一个显著优势是可移植性，你应该坚持使用表 14.1 列出的三个流，这样你就不会遇到任何问题。\n\n\n\
  \n\n你实际上已经在在使用其中两个流了。每当你使用 `printf()` 或 `puts()` 函数在屏幕上显示文本时，你就会使用 `stdout` 流。同样，当你使用\
  \ `gets()` 或 `scanf()` 读取键盘输入时，你使用的是 `stdin` 流。标准流是自动打开的，但其他流（例如用于操作磁盘上存储信息的流）必须显式地打开。你将在第\
  \ 17 中学习如何这样做。本节的剩余部分将介绍标准流。\n\n## 使用 C 的流函数\n\nC 标准库有许多处理流输入输出的函数。这些函数大部分分为两种类型：一种是始终使用标准流之一，另一种是需要程序员指定特定的流。这些函数列在表\
  \ 14.2 中。此表并没有列出 C 的所有输入/输出函数，本节也未涵盖表中的所有函数。\n\n![Image](img/14tab02.jpg)\n\n**表\
  \ 14.2** 标准库的流输入/输出函数\n\n所有这些函数都要求包含 `stdio.h`。`perror()` 函数可能还需要 `stdlib.h`。`vprintf()`\
  \ 和 `vfprintf()` 函数还需要 `stdargs.h`。在 UNIX 系统上，`vprintf()` 和 `vfprintf()` 可能还需要 `varargs.h`。你的编译器的库引用会说明是否需要额外的或替代的头文件。\n\
  \n### 示例\n\n列表 14.1 中的短程序演示了流的等效性。\n\n**列表 14.1** stream.c：流的等效性\n\n点击此处查看代码\n\n\
  ```\n1:  // stream.c--演示流输入输出的等效性。 */\n2:  #include <stdio.h>\n3:\n4:  int main(\
  \ void )\n5:  {\n6:      char buffer[256];\n7:\n8:      /* 输入一行，然后立即输出它。 */\n9:\n\
  10:     puts(gets(buffer));\n11:\n12:     return 0;\n13: }\n```\n\n在第 10 行，使用 `gets()`\
  \ 函数从键盘（`stdin`）输入一行文本。由于 `gets()` 返回指向字符串的指针，它可以作为 `puts()` 的参数，由 `puts()` 在屏幕上（`stdout`）显示该字符串。运行时，该程序从用户处输入一行文本并立即在屏幕上显示该字符串。\n\
  \n### 做\n\n**要**利用 C 提供的标准输入/输出流。\n\n### 不要\n\n**不要**不必要地重命名或更改标准流。\n\n**不要**尝试将如\
  \ `stdin` 等输入流用于 `fprintf()` 等输出函数。\n\n对于学习 C 语言编程的初学者来说，`gets()` 可以的。然而，对于真实世界的程序，你应该使用\
  \ `fgets()`（在本节稍后部分解释），因为 `gets()` 对程序安全构成了一些风险。\n\n## 接受键盘输入\n\n大多数 C 程序都需要某种形式的键盘输入（即来自\
  \ `stdin` 流）。输入函数分为三个层级的层次结构：字符输入、行输入和格式化输入。\n\n### 字符输入\n\n字符输入函数每次从流中读取一个字符。当被调用时，这些函数中的每一个都会返回流中的下一个字符，或者在到达末尾或发生错误时返回\
  \ `EOF`。`EOF` 是在 `stdio.h` 中定义为 `-1` 的符号常量。字符输入函数在缓冲和回显（echo）方面有所不同：\n\n![Image](img/squf.jpg)\
  \ 某些字符输入是*缓冲的*。这意味着操作系统会在按下回车键之前将所有字符保留在临时存储空间，然后系统将字符发送到 `stdin` 流。其他是*无缓冲的*，这意味着一旦按键，每个字符就会发送到\
  \ `stdin`。\n\n![Image](img/squf.jpg) 某些输入函数会在接收每个字符时自动*回显*到 `stdout`。其他的不回显；字符被发送到\
  \ `stdin` 而不是 `stdout`。由于 `stdout` 被分配给屏幕，因此输入在那里回显。\n\n接下来的章节将解释缓冲、无缓冲、回显和不回显字符输入的用法。\n\
  \n#### getchar() 函数\n\n`getchar()` 函数从流 `stdin` 获取下一个字符。它提供了带回显的缓冲字符输入，其原型为：\n\n\
  ```\nint getchar(void);\n```\n\n`getchar()` 的用法在列表 14.2 中演示。注意，本节稍后详细解释的 `putchar()`\
  \ 函数仅仅在屏幕上显示单个字符。\n\n输入 ![Image](img/down-arrow.jpg)\n\n**列表 14.2** getchar.c：`getchar()`\
  \ 函数\n\n点击此处查看代码\n\n```\n1:  // getchar.c--演示 getchar() 函数。\n2:  #include <stdio.h>\n\
  3:\n4:  int main( void )\n5:  {\n6:      int ch;\n7:\n8:      while ((ch = getchar())\
  \ != '\\n')\n9:          putchar(ch);\n10: }\n```\n\n*(注：由于提供的文本存在大量重复和碎片化，此处已根据逻辑整合了完整的内容翻译。)*\n\
  \n\n\n\n由于 `getch()` 是无缓冲的，它会在按下按键时立即返回每个字符，而无需等待用户按下回车键。由于 `getch()` 不回显其输入，字符不会显示在屏幕上。Listing\
  \ 14.4 演示了 `getch()` 的用法。\n\n***\n\n### 注意\nListing 14.4 使用了 `getch()`，它不符合 ANSI\
  \ 标准。在使用非 ANSI 函数时，你应该小心，因为无法保证所有编译器都支持它们。如果你从 Listing 14.4 中遇到错误，可能是因为你的编译器不支持\
  \ `getch()`。\n\n***\n\n输入 ![Image](img/down-arrow.jpg)\n\n**代码列表 14.4** getch.c:\
  \ 使用 `getch()` 函数\n\n点击此处查看代码图像\n\n***\n\n```c\n1:  /* 演示 getch() 函数。 */\n2:  /*\
  \ 非 ANSI 代码 */\n3:  #include <stdio.h>\n4:  #include <conio.h>\n5:\n6:  int main(\
  \ void )\n7:  {\n8:      int ch;\n9:\n10:      while ((ch = getch()) != '\\r')\n\
  11:          putchar(ch);\n12:\n13:      return 0;\n14: }\n```\n\n***\n\n输出 ![Image](img/down-arrow.jpg)\n\
  \n***\n\n### 测试 getch() 函数\n\n分析 ![Image](img/down-arrow.jpg)\n\n***\n\n当此程序运行时，`getch()`\
  \ 会在你按下按键时立即返回每个字符——它不会等待你按下回车键。没有回显，所以每个字符显示在屏幕上的唯一原因是调用了 `putchar()`。为了更好地理解 `getch()`\
  \ 如何工作，请在第 10 行末尾添加一个分号并删除第 11 行（`putchar(ch)`）。当你重新运行程序时，你会发现输入的任何内容都没有回显到屏幕上。`getch()`\
  \ 函数在获取字符时不将其回显到屏幕上。你知道字符被接收了是因为原始列表使用了 `putchar()` 来显示它们。\n\n为什么这个程序将每个字符与 `\\\
  r` 比较而不是 `\\n` ？代码 `\\r` 是回车字符的转义序列。当你按下回车键时，键盘设备会将回车发送到 `stdin`。有缓冲的字符输入函数会将回车转换为换行符，因此程序必须测试\
  \ `\\n` 来判断是否按了回车键。无缓冲的字符输入函数不进行转换，因此回车被输入为 `\\r`，这就是程序必须测试的。\n\nListing 14.5 使用\
  \ `getch()` 输入一整行文本。运行此程序清楚地说明了 `getch()` 不回显其输入。除了将 `getch()` 替换为 `getchar()` 之外，此程序与\
  \ Listing 14.3 几乎相同。\n\n输入 ![Image](img/down-arrow.jpg)\n\n**代码列表 14.5** getch2.c:\
  \ 使用 `getch()` 函数输入一整行\n\n点击此处查看代码图像\n\n***\n\n```c\n1:  // getch2.c--使用 getch()\
  \ 输入字符串。\n2:  // 非 ANSI 代码\n3:  #include <stdio.h>\n4:  #include <conio.h>\n5:\n\
  6:  #define MAX 80\n7:\n8:  int main( void )\n9:  {\n10:      char ch, buffer[MAX+1];\n\
  11:      int x = 0;\n12:\n13:      while ((ch = getch()) != '\\r' && x < MAX)\n\
  14:          buffer[x++] = ch;\n15:\n16:      buffer[x] = '\\0';\n17:\n18:     \
  \ printf(\"%s\", buffer);\n19:\n20:      return 0;\n21: }\n```\n\n***\n\n输出 ![Image](img/down-arrow.jpg)\n\
  \n***\n\n这是一个字符串\n\n***\n\n### 注意\n记住 `getch()` 不是 ANSI 标准命令。这意味着 `getch()` 不是 ANSI\
  \ 标准命令。这意味着 `getch()` 不是 ANSI 标准命令。\n\n### getch() 函数\nListing 14.4 使用 `getch()`，它不符合\
  \ ANSI 标准。在使用非 ANSI 函数时，你应该小心，因为 `getch()` 通过 `putchar()` 返回每个字符。Listing 14.4 使用\
  \ `getch()`，它不符合 ANSI 标准。在使用非 ANSI 函数时，你应该小心，因为无法保证所有编译器都支持它们。如果你从 Listing 14.4\
  \ 中遇到错误，可能是因为你的编译器不支持 `getch()`。\n\n### getc() 和 fgetc() 函数\n`getc()` 和 `fgetc()`\
  \ 用于读取字符。\n\n### 使用 ungetc() “撤回”字符\n`ungetc()` 将字符放回流中。\n\n\n\n\n\n`fgets()` 库函数与\
  \ `gets()` 相似，它们都是从输入流中读取一行文本。它更加灵活，因为它允许程序员指定要使用的特定输入流以及允许输入的最大字符数。`fgets()` 函数通常用于从磁盘文件输入文本，这部分在第\
  \ 17 节 中有所介绍。若要从 `stdin` 进行输入，你需要将 `stdin` 指定为输入流。`fgets()` 的原型如下：\n\n点击此处查看代码图像\n\
  \n```c\nchar *fgets(char *str, int n, FILE *fp);\n```\n\n最后一个参数 `FILE *fp` 用于指定输入流。目前，简单地将标准输入流\
  \ `stdin` 作为流参数指定即可。\n\n指针 `str` 指明输入字符串存储的位置。参数 `n` 指定了输入的最大字符数。`fgets()` 函数从输入流中读取字符，直到遇到换行符、结束符（EOF）或读取了\
  \ `n - 1` 个字符。换行符包含在字符串中，并在存储前以 `\\0` 终止。`fgets()` 的返回值与之前描述 `gets()` 的描述相同。\n\n\
  严格来说，`fgets()` 并不输入单行文本（如果你将行定义为以换行符结尾的字符序列）。如果一行包含多于 `n - 1` 个字符，它读取的内容将少于整行。当与\
  \ `stdin` 使用时，在按下回车键之前，`fgets()` 不返回，但只有前 `n - 1` 个字符会被存储在字符串中。只有当换行符出现在前 `n - 1`\
  \ 个字符内时，它才会包含在字符串中。列表 14.6 展示了 `fgets()` 函数。\n\n输入 ![Image](img/down-arrow.jpg)\n\
  \n**列表 14.6** fgets.c：使用 `fgets()` 函数进行键盘输入\n\n点击此处查看代码图像\n\n***\n\n```c\n1:  /*\
  \ 展示了 fgets() 函数。 */\n2:\n3:  #include <stdio.h>\n4:\n5:  #define MAXLEN 10\n6:\n\
  7:  int main( void )\n8:  {\n9:      char buffer[MAXLEN];\n10:\n11:     puts(\"\
  每次输入一行文本；输入空格退出。\");\n12:\n13:     while (1)\n14:     {\n15:          fgets(buffer,\
  \ MAXLEN, stdin);\n16:\n17:          if (buffer[0] == '\\n')\n18:              break;\n\
  19:\n20:          puts(buffer);\n21:     }\n22:     return 0;\n23: }\n```\n\n***\n\
  \n输出 ![Image](img/down-arrow.jpg)\n\n点击此处查看代码图像\n\n***\n\n每次输入一行文本；输入空格退出。\n玫瑰是红色的\n\
  玫瑰是\n红色的\n紫色是蓝色的\n紫色是\n蓝色的\nC 语言编程\nC 程\n是为像你这样的人准备的！\n是为像你\n这样的人\n准备的！\n\n第 15\
  \ 行包含 `fgets()` 函数。运行程序时，尝试输入长度小于和大于 `MAXLEN` 的行以观察会发生什么。如果输入了大于 `MAXLEN` 的行，第一次调用\
  \ `fgets()` 会读取前 `MAXLEN - 1` 个字符；剩余字符将留在键盘缓冲区中，由下一次调用 `fgets()` 或任何其他从 `stdin`\
  \ 读取的函数读取。当输入空行时程序退出（第 17 行和第 18 行）。\n\n### 处理格式化输入\n\n到目前为止的输入函数简单地从输入流中获取一个或多个字符并将它们存内存中的某处。没有对输入进行任何解释或格式化，你仍然没有办法输入数值变量。例如，你如何从键盘输入值\
  \ `12.86` 并将其赋值给 `float` 类型变量呢？引入 `scanf()` 和 `fscanf()` 函数。你已经在第 7 节“信息读写的基础”中接触过\
  \ `scanf()`。本节将详细解释它的用法。\n\n这两个函数完全相同，除了 `scanf()` 始终使用 `stdin`，而用户可以在 `fscanf()`\
  \ 中指定输入流。本节涵盖了 `scanf()`；`fscanf()` 通常用于磁盘文件输入，并在第 17 节 中有所介绍。\n\n#### scanf() 函数的参数\n\
  \n`scanf()` 函数接受任意数量的参数；至少需要两个。第一个参数是格式字符串，它使用特殊字符告诉 `scanf()` 如何解释输入。第二个及后续参数是用于接收输入数据的变量的地址。这里有一个例子：\n\
  \n```c\nscanf(\"%d\", &x);\n```\n\n第一个参数 `\"%d\"` 是格式字符串。在这种情况下，`%d` 告诉 `scanf()`\
  \ 寻找一个带符号的整数值。第二个参数使用地址运算符 `&` 将输入值赋值给变量 `x`。现在你可以查看格式字符串的细节。\n\n`scanf()` 格式字符串可以包含以下内容：\n\
  \n![Image](img/squf.jpg) 空格和制表符，它们会被忽略。（它们可以使格式字符串更具可读性。）\n\n![Image](img/squf.jpg)\
  \ 字符（包含但不包括 `%`），与输入中的非空白字符进行匹配。\n\n![Image](img/squf.jpg) 一个或多个*转换说明*，由 `%` 字符和特殊字符组成。通常，格式字符串中每个变量对应一个转换说明。\n\
  \n`scanf()` 函数按照顺序将格式字符串中的转换说明应用于输入字段。*输入字段*是一系列非空白字符，在遇到下一个空白字符或达到指定的字段宽度时结束。转换说明包括：\n\
  \n![Image](img/squf.jpg) 紧跟在 `%` 的可选赋值抑制标志 `*`。如果存在，该字符告诉 `scanf()` 执行相应的转换，但不将其赋值给任何变量。\n\
  \n![Image](img/squf.jpg) 下一个组件字段宽度也是可选的。字段宽度是一个十进制，指定输入字段的字符宽度。换句话说，字段宽度指定了 `scanf()`\
  \ 应该从 `stdin` 读取多少个字符。如果未指定字段宽度，输入字段将延伸到下一个空白字符。\n\n![Image](img/squf.jpg) 下一个组件是可选的精度修饰符，这是一个单个字符\
  \ `h`、`l` 或 `L`。如果存在，精度修饰符会改变随其后的类型说明符的含义。细节将在本节后面给出。\n\n除了 `%` 之外，转换说明的唯一必需组件是类型说明符。类型说明符是一个或多个字符，告诉\
  \ `scanf()` 如何解释输入。这些字符在表 14.3 中列出并描述。参数列列出了相应所需的类型。例如，类型说明符 `d` 需要 `int *`（`int`\
  \ 类型的指针）。\n\n![Image](img/14tab03.jpg)\n\n**表 14.3** `scanf()` 转换说明中使用的类型说明符字符\n\
  \n在查看 `scanf()` 的示例之前，你需要了解精度修饰符，它们在表 14.4 中列出。\n\n![Image](img/14tab04.jpg)\n\n\
  **表 14.4** 精度修饰符\n\n\n\n\n\n来自 `scanf()` 的输入是缓冲的；在用户按下回车键之前，实际上不会从 `stdin` 接收到任何字符。随后，整行字符会从\
  \ `stdin` “到达”，并由 `scanf()` 按顺序进行处理。只有当接收到的输入足够匹配格式字符串中的规范时，`scanf()` 的执行才会返回。此外，`scanf()`\
  \ 只会从 `stdin` 读取足够满足其格式字符串的字符。如果存在多余的、不需要的字符（如果有的话），它们将留在 `stdin` 中等待。这些字符可能会导致问题。仔细观察\
  \ `scanf()` 的操作就可以看看它是如何的。\n\n当执行 `scanf()` 的调用且用户输入了一行内容时，可能会出现三种情况。对于这些示例，假设正在执行\
  \ `scanf(\"%d %d\", &x, &y);`；换句话说，`scanf()` 期望两个十进制整数。以下是各种可能性：\n\n![Image](img/squf.jpg)\
  \ 用户输入的行与格式字符串匹配。例如，假设用户输入了 `12 14` 然后按回车键。在这种情况下，没有问题。`scanf()` 得到了满足，`stdin` 中没有留下任何字符。\n\
  \n![Image](img/squf.jpg) 用户输入的行元素太少，无法匹配格式字符串。例如，假设用户输入了 `12` 然后按回车键。在这种情况下，`scanf()`\
  \ 继续等待缺失的输入。接收输入后，执行继续，`stdin` 中没有留下任何字符。\n\n![Image](img/squf.jpg) 用户输入的行元素多于格式字符串的要求。例如，假设用户输入\
  \ `12 14 16` 然后按回车键。在这种情况下，`scanf()` 读取了 `12` 和 `14` 然后返回。多余的字符 `1` 和 `6` 被留在 `stdin`\
  \ 中等待。\n\n正是这第三种情况（特别是那些留下的字符）可能会导致问题。只要你的程序运行，它们就会一直等待，直到程序下一次从 `stdin` 读取输入。那时，留下的字符将最先被读取，先于用户此时输入的任何内容。这显而易见会如何导致错误。例如，以下代码要求用户输入一个整数，然后是一个字符串：\n\
  \n点击此处查看代码图像\n\n```\nputs(\"Enter your age.\");\nscanf(\"%d\", &age);\nputs(\"Enter\
  \ your first name.\");\nscanf(\"%s\", name);\n```\n\n假设，例如，作为第一个提示的响应，用户决定很精确并输入了\
  \ `29.00` 然后按回车键。第一次调用 `scanf()` 寻找一个整数，因此它从 `stdin` 读取字符 `29`并将值 `29` 赋值给变量 `age`。字符\
  \ `.00` 被留在 `stdin` 中等待。下一次调用 `scanf()` 寻找一个字符串。它去 `stdin` 获取输入并发现 `.00` 在那里等待。结果是将字符串\
  \ `.00` 赋值给 `name`。\n\n如何避免这个问题？如果你使用程序的人在输入信息时从不出错，那是一个解决方案——但这相当不切实际。\n\n更好的解决方案是在提示用户输入之前，确保\
  \ `stdin` 中没有多余字符在等待。你可以通过调用 `gets()` 来实现，它会从 `stdin` 读取任何剩余字符，直到并包括行尾。与其直接在程序中调用\
