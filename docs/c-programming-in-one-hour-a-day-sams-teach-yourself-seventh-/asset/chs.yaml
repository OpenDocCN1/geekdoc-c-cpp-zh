  45: // 清除 stdin 中任何等待的字符。\n46: {\n47:     char junk[80];\n48:     gets(junk);\n\
  49: }\n```\n\n输出 ![Image](img/down-arrow.jpg)\n```\nEnter 5 floating-point numerical\
  \ values.\n3.14159\n9.99\n1.50\n1000.0001\nEnter a name for the file.\nkey numbers.txt\n\
