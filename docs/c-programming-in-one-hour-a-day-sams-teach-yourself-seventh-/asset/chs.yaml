  \ } };\n14:\n15:     /* ptr 是一个指向 4 个 int 数组的指针。 */\n16:\n17:     int (*ptr)[4],\
  \ count;\n18:\n19:     /* 设置 ptr 指向 multi 的第一个元素。 */\n20:\n21:     ptr = multi;\n\
  22:\n23:     /* 在每次循环中，ptr 递增以指向 multi 的下一个 */\n24:     /* 元素（即下一个 4 元素整数数组）。 */\n\
  25:\n26:     for (count = 0; count < 3; count++)\n27:         printarray_1(ptr++);\n\
  28:\n29:     puts(\"\\n\\nPress Enter...\");\n30:     getchar();\n31:     printarray_2(multi,\
  \ 3);\n32:     printf(\"\\n\");\n33:     return 0;\n34: }\n35:\n36: void printarray_1(int\
  \ (*ptr)[4])\n37: {\n38: /* 打印单个四个元素整数数组的元素。 */\n39: /* p 是一个指向 int 类型的指针。你必须使用类型转换\
  \ */\n40: /* 使 p 等于 ptr 中的地址。 */\n41:\n42:     int *p, count;\n43:     p = (int\
  \ *)ptr;\n44:\n45:     for (count = 0; count < 4; count++)\n46:         printf(\"\
  \\n%d\", *p++);\n47: }\n48:\n49: void printarray_2(int (*ptr)[4], int n)\n50: {\n\
