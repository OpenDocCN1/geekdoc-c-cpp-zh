  \ 开始的。\n\n***\n\n## 使用多维数组\n\n多维数组具有多个下标。二维数组有两个下标，三维数组有三个下标，依此类推。C 语言数组的维度数量没有限制。（数组的总大小是有限制的，在本节的稍后部分会讨论。）\n\
  \n例如，你可能会编写一个玩跳棋的程序。棋盘包含 64 个方格，排列成 8 行 8 列。你的程序可以将棋盘表示为二维数组，如下所示：\n\n```c\nint\
  \ checker[8][8];\n```\n\n生成的数组有 64 个元素：`checker[0][0]`、`checker[0][1]`、`checker[0][2]`...`checker[7][6]`、`checker[7][7]`。该二维数组的结构如图\
  \ 8.3 所示。\n\n![Image](img/08fig03.jpg)\n\n**图 8.3** 二维数组具有行和列结构。\n\n同样，三维数组可以被看作立方体。四维数组（及更高）可能最好留给你的想象力。所有数组无论有多少维，都是在内存中顺序存储的。关于数组存储的更多细节将在第\
  \ 15 节“指针的指针和指针数组”中介绍。\n\n### 数组的命名与声明\n\n为数组命名的规则与变量名规则相同，详见第 3 节“存储信息：变量与常量”。数组名必须是唯一的。它不能用于另一个数组或任何其他标识符（变量、常量等）。正如你可能意识到的，数组声明的形式与非数组变量的声明相同，数组中的元素数量必须紧跟在数组名后的方括号内。当你声明数组时，可以使用字面量常量（如前面的示例所示）或使用通过\
  \ `#define` 指令创建的符号常量来指定元素数量。因此，以下代码：\n\n```c\n#define MONTHS 12\n\nint array[MONTHS];\n\
  ```\n\n等于以下语句：\n\n```c\nint array[12];\n```\n\n然而，对于大多数编译器，你不能使用 `const` 关键字创建的符号常量来声明数组元素：\n\
