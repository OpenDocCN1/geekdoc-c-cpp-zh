  \ 语句；而不会跳出无限 `while` 循环。`exit()` 函数终止程序。你将在下一节学习更多关于 `exit()` 函数的内容。\n\n### 语法\n\
  \n#### switch 语句\n\n点击此处查看代码图像\n\n```c\nswitch (expression)\n{\n    case template_1:\
  \ statement(s);\n    case template_2: statement(s);\n    ...\n    case template_n:\
  \ statement(s);\n    default: statement(s);\n}\n```\n\n`switch` 允许从单个表达式进入多个分支。它比多层嵌套的\
  \ `if` 语句更高效且更容易遵循。`switch` 语句评估一个表达式，然后跳转到与表达式结果匹配的 `case` 语句。如果没有值匹配表达式的结果，控制将跳转到\
  \ `default` 语句。如果没有 `default` 语句，控制将跳转到 `switch` 语句的结束。\n\n程序流将从 `case` 语句向下继续，除非遇到\
  \ `break` 语句。如果发生了这种情况，控制将跳转到 `switch` 语句的结束。\n\n**示例 1**\n\n点击此处查看代码图像\n\n```c\n\
  switch (letter)\n{\n    case 'A':\n    case 'a':\n        printf(\"You entered A\"\
  );\n        break;\n    case 'B':\n    case 'b':\n        printf(\"You entered B\"\
  );\n        break;\n    ...\n    ...\n    default:\n        printf(\"I't have a\
  \ case for %c\", letter);\n}\n```\n\n**示例 2**\n\n点击此处查看代码图像\n\n```c\nswitch (number)\n\
  {\n    case 0:\n        puts(\"Your number is 0 or less.\");\n    case 1:\n    \
  \    puts(\"Your number is 1 or less.\");\n    case 2:\n        puts(\"Your number\
  \ is 2 or less.\");\n    case 3:\n        puts(\"Your number is 3 or less.\");\n\
  \    ...\n    ...\n    case 99:\n        puts(\"Your number is 99 or less.\");\n\
  \        break;\n    default:\n        puts(\"Your number is greater than 99.\"\
  );\n}\n```\n\n由于前几个 `case` 语句没有 `break` 语句，此示例会找到匹配数字的 `case`，并从该点开始打印每一个 `case`\
  \ 直到 `case 99` 中的 `break`。如果数字是 `3`，你会被告知你的数字等于 `3` 或少、`4` 或少、`5` 或少，直到 `99` 或少。程序会继续打印直到遇到\
  \ `case 99` 中的 `break` 语句。\n\n#### 做到\n- **应当**在 `switch` 语句中使用 `default` 情况，即使你认为已经涵盖了所有可能的情况。\n\
  - **应当**如果对同一个变量评估超过两个条件，请使用 `switch` 语句而不是 `if` 语句。\n- **应当**对齐你的 `case` 语句，以便于阅读。\n\
  \n#### 避免\n- **不要**忘记在你的 `switch` 语句需要时使用 `break` 语句。\n\n### 退出程序\n\n一个 C 程序通常在执行到\
  \ `main()` 函数的右大括号时终止。然而，你可以通过调用库函数 `exit()` 在任何时候终止程序。你还可以指定一个或多个在终止时自动执行的函数。\n\
  \n#### exit() 函数\n\n`exit()` 函数终止程序并将并将权还给系统。该函数接受一个 `int` 类型的参数，该参数被传回操作系统以指示程序的成功或失败。`exit()`\
  \ 函数的语法如下：\n\n```c\nexit(status);\n```\n\n如果 `status` 的值为 `0`，则表示程序正常终止。值 `1` 表示程序因某种错误终止。返回值通常被忽略。要使用\
  \ `exit()` 函数，程序必须包含头文件 `stdlib.h`。该头文件还定义了两个符号常量，作为 `exit()` 函数的参数使用：\n\n```c\n\
  #define EXIT_SUCCESS 0\n#define EXIT_FAILURE 1\n```\n\n因此，要以返回值 `0` 退出，请调用 `exit(EXIT_SUCCESS)`；对于返回值\
  \ `1`，调用 `exit(EXIT_FAILURE)`。\n\n#### 做到\n- **应当**在出现问题时使用 `exit()` 命令退出程序。\n-\
  \ **应当**向 `exit()` 函数传递有意义的值。\n\n### 总结\n\n本节涵盖了与程序控制相关的各种主题。你学习了 `goto` 语句以及为什么你应该避免它。你看到\
  \ `break` 和 `continue` 语句对循环提供了额外的控制，你还学习了如何使用 `exit()` 函数来控制终止。\n\n### 问答\n\n**Q:\
  \ 使用 switch 语句还是嵌套循环更好？**\n**A:** 如果你正在检查一个可以取两个以上值的变量，`switch` 语句几乎总是更好的。生成的代码更易读。如果你正在检查一个真/假条件，请使用\
  \ `if` 语句。\n\n**Q: 为什么我应该避免 goto 语句？**\n**A:** 当你第一次看到 `goto` 语句时，很容易相信它可能很有用。然而，`goto`\
  \ 引起的问题比它解决的要多。`goto` 语句是一种无结构的命令，会将你带到程序的另一个点。许多*调试器*（帮助你追踪程序问题的软件）无法正确地查询 `goto`。`goto`\
  \ 语句还会导致*面条*代码——即到处乱跑的代码。\n\n**Q: 为什么不是所有的编译器都拥有相同的函数？**\n**A:** 在这里，你看到某些 C 函数在所有编译器或所有计算机系统中都是不可用的。例如，`sleep()`\
  \ 在 Borland C 编译器中可用，但在 Microsoft 编译器中不可用。尽管所有 ANSI 编译器都遵循标准，但这些标准并不禁止编译器制造商添加额外的功能。他们通过创建和包含新函数来实现这一点。每个编译器制造商通常都会添加一些他们认为对用户有帮助的函数。\n\
