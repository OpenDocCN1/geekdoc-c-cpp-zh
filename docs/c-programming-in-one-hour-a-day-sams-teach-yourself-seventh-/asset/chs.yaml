  \ 21 行打印换行符、一条消息，然后是三次蜂鸣。如果用户选择 `2`，第 25 行调用函数 `print_report()`。\n\n* * *\n\n###\
  \ 提示\n\n控制第 16-27 行顶部菜单的 `while` 循环将至少运行一次，因此 `do...while` 循环可能是更好的选择，尽管如何设置代码始终取决于个人喜好。然而，作为一个有趣的额外作业，可以考虑调整此列表，以将循环改为\
  \ `do...while` 循环。\n\n* * *\n\n`print_report()` 函数定义在第 53 到 61 行。这个简单的函数展示了使用 `printf()`\
  \ 和转义序列向屏幕打印格式化信息的简易性。你已经见过换行符了。第 56 到 60 行还使用了制表符转义字符 `\\t`。正如上一节所示，制表符字符可以垂直对齐报告的列。第\
  \ 58 行和第 59 行起初看起来可能令人困惑，但如果你从左向右开始处理，它们是有意义的。第 58 行打印一个换行（`\\n`）、一个反斜杠（`\\`）、字母\
  \ `a`，然后是制表符（`\\t\\t`）。该行以描述性文本 `(bell (alert))` 结束。第 59 行遵循相同的格式。\n\n此程序打印了表 7.1\
  \ 的前两行，以及报告标题和列标题。在本节末的练习 9 中，你将通过打印表的其余部分来完成此程序。\n\n#### printf() 转换说明符\n\n格式字符串必须为每个打印的变量包含一个转换说明符。`printf()`\
  \ 函数将根据相应转换说明符的指示显示每个变量。你可以在第 14 节“屏幕、打印机和键盘的操作”中学习更多此类过程。现在，请确保使用与打印变量类型对应的转换说明符。\n\
  \n具体是什么意思？如果你打印一个有符号十进制整数（类型 `int` 和 `long`），请使用 `%d` 转换说明符。对于无符号十进制整数（类型 `unsigned\
  \ int` 和 `unsigned long`），使用 `%u`。对于浮点数变量（类型 `float` 和 `double`），使用 `%f` 说明符。你经常需要的转换说明符列在表\
  \ 7.2 中。\n\n**表 7.2 最常用的说明符**\n\n* * *\n\n#### 注意\n\n任何使用 `printf()` 的程序都应该包含头文件\
  \ `stdio.h`。\n\n* * *\n\n说明符的字面文本是指任何不属于转义序列或转换说明符的内容。字面文本直接按原文打印。那么打印多个变量的值呢？单个\
  \ `printf()` 语句可以打印无限数量的变量，但格式字符串必须为每个变量包含一个转换说明符。转换说明符从左到右与变量配对。如果你写点击此处查看代码图像\n\
  \n```c\nprintf(\"Rate = %f, amount = %d\", rate, amount);\n```\n\n则变量 `rate` 与 `%f`\
  \ 说明符配对，变量 `amount` 与 `%d` 说明符配对。转换说明符在格式字符串中的位置决定了输出。如果传递 `printf()` 的变量多于说明符，则未匹配的变量将不会被打印。如果说明符多于变量，则未匹配的说明符将打印“垃圾内容”。转换说明符并不限制变量的值。参数可以是任何表达式。例如，为了打印\
  \ `x` 和 `y` 的和，你可以写：\n\n```c\ntotal = x + y;\nprintf(\"%d\", total);\n```\n\n列表\
  \ 7.2 演示了 `printf()`的用法。第 14 节提供了更多关于 `printf()`的细节。\n\n**列表 7.2 nums.c: 使用 printf()\
  \ 显示数值**\n\n点击此处查看代码图像\n\n```c\n1:  /* printf() 显示数值。 */\n2:\n3:  #include <stdio.h>\n\
  4:\n5:  int a = 2, b = 10, c = 50;\n6:  float f = 1.05, g = 25.5, h = -0.1;\n7:\n\
  8:  int main( )\n9:  {\n10:     printf(\"\\n 不带制表符的数值: %d %d %d\", a, b, c);\n11:\
  \     printf(\"\\n 带制表符的数值: \\t%d \\t%d \\t%d\", a, b, c);\n12:\n13:     printf(\"\
  \\n 单行显示浮点数: \\t%f\\t%f\\t%f\", f, g, h);\n14:     printf(\"\\n 三行显示浮点数: \\n\\t%f\\\
  n\\t%f\\n\\t%f\", f, g, h);\n15:\n16:     printf(\"\\n 速率为 %f%%\", f);\n17:    \
  \ printf(\"\\n 保留两位小数为 %.2f%%\", f);\n18:     printf(\"\\n 保留一位小数为 %.1f%%\", f);\n\
  19:     printf(\"\\n%f/%f = %f\\n\", g, f, g / f);\n20:\n21:     return 0;\n22:\
  \ }\n```\n\n* * *\n\n输出 ![Image](img/down-arrow.jpg)\n\n点击此处查看代码图像\n\n* * *\n\n\
  ```\n不带制表符的数值: 2 10 50\n带制表符的数值:      2      10      50\n单行显示浮点数:      1.050000\
  \      25.500000      -0.100000\n三行显示浮点数:\n      1.050000\n      25.500000\n   \
  \   -0.100000\n速率为 1.050000%\n保留两位小数为 1.05%\n保留一位小数为 1.0%\n25.500000/1.050000 =\
  \ 24.285715\n```\n\n\n\nListing 7.2 打印了八行信息。第 10 行和第 11 行分别打印三个小数：`a`、`b` 和 `c`。第\
  \ 10 行不带制表符打印，而第 11 行带制表符打印。第 13 行和第 14 行分别打印三个 `float` 变量：`f`、`g` 和 `h`。第 13 行将它们打印在一行，第\
  \ 14 行将其打印在三行。第 16 行打印一个 `float` 变量 `f`，后面跟着百分号。由于百分号通常是打印变量的指令，因此必须连续放置两个百分号来打印单个百分号。这与反斜杠转义字符完全相同。\n\
  \n第 17 行和第 18 行介绍了一个新概念。每当你打印浮点变量时，C 默认将其打印为六位小数。即使你定义的变量小数点后只有一位数字（如 5.5），当 C 使用\
  \ `%f` 转换说明符打印它时，也会显示为 5.500000。这可能不符合你的需求，因此 C 有一种简单的方法来减少打印的小数位数。如你在第 17 行和第 18\
  \ 行所示，在说明符的 `%` 和 `f` 之间添加句点（`.`）和一个数字，指示编译器只打印你设置的小数位数。不过有一个警告：C 是截断数字而不是四舍五入。因此，1.05\
  \ 变成 1.0 而不是 1.1。第 19 行显示了最后一个概念。在转换说明符中打印值时，你不一定使用变量。你也可以使用如 `g / f` 等表达式，甚至是常量。\n\
  \n***\n\n### 应当 (Do)\n\n**请记住**，在多个 `printf()` 语句中打印多行信息时，使用换行转义字符。\n\n***\n\n###\
  \ 不要 (Don’t)\n\n**不要**尝试将多行文本放在某一个 `printf()` 语句中。在大多数情况下，使用多个打印语句打印多行，比只使用一个带有多个换行（`\\\
  n`）转义字符的语句更清晰。\n\n**不要**拼错 `stdio.h`。许多 C 程序员会不小心写成 `studio.h`；然而，其中没有 `u`。它代表 STanDard\
  \ I/O（标准输入输出）。\n\n***\n\n### 语法 (Syntax)\n\n#### printf() 函数\n\n点击此处查看代码\n\n```c\n\
  #include <stdio.h>\n\nprintf( format-string[,arguments,...]);\n```\n\n`printf()`\
  \ 是一个接受系列参数的函数，每个参数都应用于给定格式字符串中的转换说明符。`printf()` 将格式化后的信息打印到标准输出设备（通常是显示器）。使用 `printf()`\
  \ 时，你需要包含标准输入输出头文件 `stdio.h`。格式字符串是必选的，但参数是可选的。对于每个参数，必须有一个对应的转换说明符。表 7.2 列出了最常用的转换说明符。\n\
  \n格式字符串还可以包含转义序列。表 7.1 列出了最常用的转义序列。\n\n以下是 `printf()` 的调用示例及其输出：\n\n**示例 1 输入**\n\
  \n点击此处查看代码\n\n```c\n#include <stdio.h>\n\nint main( void )\n{\n    printf(\"This\
  \ is an example of something printed!\");\n    return 0;\n}\n```\n\n**示例 1 输出**\n\
  \n点击此处查看代码\n\n```\nThis is an example of something printed!\n```\n\n**示例 2 输入**\n\
  \n点击此处查看代码\n\n```c\nprintf(\"This prints a character, %c\\na number, %d\\na floating\
  \ \\\npoint, %f\", 'z', 123, 456.789 );\n```\n\n**示例 2 输出**\n\n```\nThis prints\
  \ a character, z\na number, 123\na floating point, 456.789\n```\n\n***\n\n### 提示\
  \ (Tip)\n\n你可能会在第二个示例中发现 `printf()` 函数使用了一个换行到第二行的字符串。在第一行的末尾，正斜杠（`\\`）表示字符串延续到下一行。编译器将这两行视为一行。\n\
  \n***\n\n#### 使用 puts() 显示消息\n\n`puts()` 函数也可以用于在屏幕上显示文本消息，但它不能显示数值变量。`puts()` 函数接受单个字符串作为参数并显示它，在末自动添加换行符。例如，语句\n\
  \n```c\nputs(\"Hello, world.\");\n```\n\n与以下操作相同：\n\n```c\nprintf(\"Hello, world.\\\
  n\");\n```\n\n你可以在传递给 `puts()` 的字符串中包含转义序列（包括 `\\n`）。它们的效果与在 `printf()` 中使用相同。（最常用的转义序列请参阅\
  \ 表 7.1。）\n\n就像 `printf()` 一样，任何使用 `puts()` 的程序都应该包含头文件 `stdio.h`。注意，`stdio.h` 是必须的。\n\
  \n***\n\n### 应当 (Do)\n\n在多个 `printf()` 语句中打印多行信息时，使用换行转义字符。\n\n***\n\n### 不要 (Don’t)\n\
  \n**不要**尝试将多行文本放在某一个 `printf()` 语句中。在大多数情况下，使用多个打印语句打印多行，比只使用一个带有多个换行（`\\n`）转义字符的语句更清晰。\n\
  \n**不要**拼错 `stdio.h`。许多 C 程序员会不小心写成 `studio.h`；然而，其中没有 `u`。它代表 STanDard I/O（标准输入输出）。\n\
