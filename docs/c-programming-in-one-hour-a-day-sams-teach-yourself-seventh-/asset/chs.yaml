  \n**9。** 编写一个名为 `addarrays()` 的函数，它接受两个相同大小数组并将每个元素相加。\n\n## 第 10 节：处理字符和字符串\n\n\
  *字符*是单个字母、数字、标点符号或其他符号*字符串*是任何字符序列。字符和字符串在许多应用程序中非常有用。在本节中你将学习：\n\n- 使用 C 的 `char`\
  \ 数据类型存储单个字符\n- 创建 `char` 数组存储多字符字符串\n- 初始化字符和字符串\n- 使用指针处理字符串\n- 输出和输入字符与字符串\n\n\
  ### char 类型\n\nC 使用 `char` 数据类型来存储字符。你在第 3 节“存储信息：变量与常量”中见过 `char` 是 C 的整数类型之一。如果\
  \ `char` 是数值类型，它如何用于存储字符？\n\n答案在于 C 存储字符的方式。计算机内存以数值形式存储所有数据。没有直接存储字符的方法。但是每个字符都有对应的数值代码。这被称为\
  \ *ASCII 代码*或 *ASCII 字符集*。（*ASCII* 代表美国标准信息交换。）该代码为大小写字母、数字数字、标点符号和其他符号分配了 0 到 255\
  \ 之间的值。ASCII 字符集列在附录 A“ASCII 表”。\n\n> 注意：ASCII 代码和 ASCII 字符集针对单字节字符集系统。在那些多字节字符集的系统中，你将使用不同的字符集。然而，这超出了本书的范围。\n\
  \n\n\n\n\n在此处，你可能会感到有些困惑。如果 `C` 将字符存储为数字，那么你的程序如何知道一个给定的类型 `char` 变量是字符还是数字呢？正如你之后将学到的，将变量声明为\
  \ `char` 类型是不够的；你必须对该变量进行其他操作：\n\n![Image](img/squf.jpg) 如果 `char` 变量被用于 C 程序中某个需要字符的地方，它就会被解释为字符。\n\
  \n![Image](img/squf.jpg) 如果 `char` 变量被用于 C 程序中某个需要数字的地方，它就会被解释为数字。\n\n这让你对 `C` 如何使用数值型数据类型来存储字符数据有了初步的了解。现在，你可以继续学习细节了。\n\
  \n## 使用字符变量\n\n和其他变量一样，你必须在使用 `char` 之前对其进行声明，并且你可以在声明时对其进行初始化。以下是一些示例：\n\n点击此处查看代码图像\n\
  \n```c\nchar a, b, c;               /* 声明三个未初始化的 char 变量 */\nchar code = 'x';  \
  \          /* 声明名为 code 的 char 变量 */\n                            /* 并在其中存储字符 x\
  \ */\ncode = '!';                /* 在名为 code 的变量中存储 ! */\n```\n\n要创建字面字符常量，你需要将单个字符括在单引号中。编译器会自动将字面字符常量转换为相应的\
  \ ASCII 码，并将数值代码值赋值给变量。\n\n你可以通过 `#define` 指令或 `const` 关键字来创建符号字符常量：\n\n点击此处查看代码图像\n\
  \n```c\n#define EX 'x'\nchar code = EX;             /* 设置 code 等于 'x' */\nconst\
  \ char A = 'Z';\n```\n\n现在你已经知道了如何声明和初始化字符变量了，是时候进行演示了。列表 10.1 使用你在第 7 节中学过的 `printf()`\
  \ 函数以及“信息读取和写入的基础”，说明了字符存储的数值本质。`printf()` 函数可以用于打印字符和数字。格式字符串 `%c` 指令 `printf()`\
  \ 打印字符，而 `%d` 则指示它打印一个十进制整数。列表 10.1 初始化了两个 `char` 类型变量并打印了每一个，首先作为字符，然后作为数字。\n\n\
  输入 ![Image](img/down-arrow.jpg)\n\n**列表 10.1** chartest.c：类型 `char` 变量的数值本质\n\n\
  点击此处查看代码图像\n\n```c\n1:  /* chartest.c--演示 char 变量的数值本质 */\n2:\n3:  #include <stdio.h>\n\
  4:\n5:  /* 声明并初始化两个 char 变量 */\n6:\n7:  char c1 = 'a';\n8:  char c2 = 90;\n9:\n\
  10: int main( void )\n11: {\n12:      /* 将变量 c1 作为字符打印，然后作为数字 */\n13:\n14:     \
  \ printf(\"\\nAs a character, variable c1 is %c\", c1);\n15:      printf(\"\\nAs\
  \ a number, variable c1 is %d\", c1);\n16:\n17:      /* 对变量 c2 执行相同的操作 */\n18:\n\
  19:      printf(\"\\nAs a character, variable c2 is %c\", c2);\n20:      printf(\"\
  \\nAs a number, variable c2 is %d\\n\", c2);\n21:\n22:      return 0;\n23: }\n```\n\
  \n输出 ![Image](img/down-arrow.jpg)\n\n点击此处查看代码图像\n\n```\nAs a character, variable\
  \ c1 is a\nAs a number, variable c1 is 97\nAs a character, variable c2 is Z\nAs\
  \ a number, variable c2 is 90\n```\n\n分析 ![Image](img/down-arrow.jpg)\n\n你在第 3 节中学习过，`char`\
  \ 类型变量的允许范围仅到 `127`，而 ASCII 码可以到 `255`。ASCII 码实际上被分为两个部分。标准 ASCII 码只到 `127`；这个范围包含了所有字母、数字、标点符号和其他符号。从\
  \ `128` 到 `255` 的代码是扩展 ASCII 码，代表特殊字符，如外国字母和图形（完整列表请参见附录 A）。）。因此，对于标准文本，你可以使用 `char`\
  \ 变量；如果你想打印扩展 ASCII，则必须使用 `unsigned char`。列表 10.2 打印了部分扩展 ASCII。\n\n输入 ![Image](img/down-arrow.jpg)\n\
  \n**列表 10.2** ascii.c：打印扩展字符\n\n点击此处查看代码图像\n\n```c\n1:  /* ascii.c--打印扩展字符 */\n\
  2:\n3:  #include <stdio.h>\n4:\n5:  /* 必须使用 unsigned 用于扩展 ASCII */\n6:\n7:  unsigned\
  \ char mychar;\n8:\n9:  int main( void )\n10: {\n11:     /* 扩展 ASCII 码 */\n12: \
  \    for (mychar = 180; mychar < 204; mychar++) {\n13:         printf(\"ASCII code\
  \ %d is %c\\n\", mychar, mychar);\n14:     }\n15:\n16:     return 0;\n17: }\n```\n\
  \n\n\n\n\n“但是等一下，”你可能会说，“这是一个 10 元素的数组，为什么它只能容纳九个字符呢？”在 C 语言中，字符串被定义为以空字符结尾字符序列。空字符是由\
  \ `\\0` 表示的特殊字符。尽管它由两个字符（反斜杠和零）表示，但空字符被解释为单个字符，其 ASCII 值为 `0`。它是 C 语言的转义序列之一。\n\n\
  ### 注意\n转义序列在第 7 Lesson 中介绍过。\n\n例如，当一个 C 程序存储字符串 `Alabama` 时，它存储了七个字符 `A`、`l`、`a`、`b`、`a`、`m`\
  \ 和 `a`，随后是空字符 `\\0`，共八个字符。因此，字符数组可以存储长度比数组元素总数减一的字符串。\n\n### 初始化字符数组\n和其他其他 C 数据类型一样，字符数组可以在声明时初始化。字符数组可以逐元素赋值，如下所示：\n\
  \n点击此处查看代码图像\n\n```\nchar string[10] = { 'A', 'l', 'a', 'b', 'a', 'm', 'a', '\\\
  0' };\n```\n\n然而，使用字面量字符串更加方便，字面量字符串是包含在双引号中的字符序列：\n\n```c\nchar string[10] = \"\
  Alabama\";\n```\n\n当你在程序中使用字面量字符串时，编译器会自动在字符串末尾添加终止空字符。如果你在声明数组时不指定下标的数量，编译器将为你计算数组的大小。因此，下面这行代码创建并初始化了一个八元素数组：\n\
  \n```c\nchar string[] = \"Alabama\";\n```\n\n记住，字符串需要一个终止空字符。处理字符串的 C 函数（在第 18 Lesson“处理字符串”中介绍）通过寻找空字符来确定字符串长度。这些函数没有其他方法来识别字符串的结束。如果缺少空字符，你的程序会认为字符串一直延伸到内存中的下一个空字符。这种错误可能会导致棘手的程序\
  \ bug。\n\n### 字符串与指针\n你已经看到字符串存储在 `char` 类型的数组中，字符串的末尾（可能没有占用整个数组）由空字符标记。由于字符串末尾已被标记，你定义一个给定字符串只需要指向其起始位置的内容。（*points*\
  \ 是准确的词吗？确实是！）\n\n有了这个提示，你可能已经领先于课程了一节。从第 9 Lesson“理解指针”中，你已经知道数组名是指向数组第一个元素的指针。因此，对于存储在数组中的字符串，你只需要数组名即可访问它。事实上，使用数组名是\
  \ C 语言访问字符串的标准方法。\n\n更准确地说，使用数组名访问字符串是 C 库函数所期望的方法。C 标准库包含了许多处理字符串的函数。（这些函数在第 18\
  \ Lesson 中介绍过。）要将字符串传递给这些函数之一一个，你只需传递数组名即可。本章稍后讨论的字符串显示函数 `printf()` 和 `puts()`\
  \ 也是如此。\n\n你可能注意到刚才提到了“存储在数组中的字符串”。这是否意味着某些字符串并不是存储在数组中的？事实确实如此，下一节将解释原因。\n\n###\
  \ 不使用数组的字符串\n从上一节中，你知道字符串是由数组名和空字符定义的。数组名是指向字符串起始位置的 `char` 指针。空标记标记字符串的结束。字符串在数组中占据的实际空间是次要的。事实上，数组的唯一用途是为字符串提供分配空间。\n\
  \n如果你能找到一些无需分配数组的内存存储空间呢？那么你就可以将带有终止空字符的字符串存储在那里。指向第一个字符的指针可以用来指定字符串的开头，就像字符串存储在分配的数组中一样。如何寻找内存存储空间？有两种方法：一种是在程序编译时为字面量字符串分配空间，另一种是在程序执行时使用\
  \ `malloc()` 函数分配空间，这一过程被称为动态分配。\n\n### 在编译时分配字符串空间\n如前所述，字符串的开头由一个指向 `char` 类型变量的指针指示。你可能记得如何声明这样的指针：\n\
  \n```c\nchar *message;\n```\n\n这条语句声明了一个指向名为 `message` 的 `char` 类型变量的指针。它现在没有指向任何内容，但如果你将指针声明改为：\n\
  \n点击此处查看代码图像\n\n```c\nchar *message = \"Great Caesar\\'s Ghost!\";\n```\n\n当这条语句执行时，字符串\
  \ `Great Caesar's Ghost!`（带有终止空字符）被存储在内存的某处，指针 `message` 初始化为指向字符串的第一个字符。不用担心字符串存储在内存的哪个位置；编译器会自动处理它。定义后，`message`\
  \ 是指向字符串的指针。\n\n### malloc() 函数\n`malloc()` 函数是 C 语言内存分配函数之一。当你调用 `malloc()` 时，你传递的是所需的字节数。`malloc()`\
  \ 寻找并保留一块内存，并返回内存块第一个字节的地址。\n\n#### 语法\n```c\n#include <stdlib.h>\n\nvoid *malloc(size_t\
  \ size);\n```\n\n`malloc()` 分配 `size` 中指定的字节数的内存块。通过 `malloc()` 按需分配内存而不是在程序启动时一次性分配，你可以更高效地使用计算机内存。使用\
  \ `malloc()` 时，你需要包含 `stdlib.h` 头文件。某些编译器有其他可以包含的头文件；为了移植性，最好包含 `stdlib.h`。\n\n\
  `malloc()` 返回指向分配内存块的指针。如果 `malloc()` 无法分配所需的内存，它返回空。每当你尝试分配内存时，即使分配的内存很少，也应该检查返回值。\n\
  \n**示例 1**\n点击此处查看代码图像\n\n```c\n#include <stdlib.h>\n#include <stdio.h>\n\nint main(\
  \ void )\n{\n    /* 为 100 字符字符串分配内存 */\n    char *str;\n    str = (char *) malloc(100);\n\
  \    if (str == NULL)\n    {\n        printf( \"Not enough memory to allocate buffer\\\
  n\");\n        exit(1);\n    }\n    printf( \"String was allocated!\\n\" );\n  \
  \  return 0;\n}\n```\n\n**示例 2**\n点击此处查看代码图像\n\n\n\n\n\n```c\n/* 为一个包含 50 个整数的数组分配内存\
  \ */\n\nint *numbers;\n\nnumbers = (int *) malloc(50 * sizeof(int));\n```\n\n###\
  \ 示例 3\n\n点击此处查看代码图像\n\n```c\n/* 为一个包含 10 个浮点数值值的数组分配内存 */\n\nfloat *numbers;\n\n\
  numbers = (float *) malloc(10 * sizeof(float));\n```\n\n### 使用 `malloc()` 函数\n\n\
  你可以使用 `malloc()` 来分配内存以存储单个 `char` 类型。首先，声明一个指向 `char` 类型的指针：\n\n```c\nchar *ptr;\n\
  ```\n\n接下来，调用 `malloc()` 并传递所需内存块的大小。因为 `char` 类型通常占用 1 字节，所以你需要一个 1 字节的内存块。`malloc()`\
  \ 返回的值被赋值给该指针：\n\n```c\nptr = malloc(1);\n```\n\n该语句分配了一个 1 字节的内存块，并将其地址赋值给 `ptr`。与在程序中声明的变量不同，这字节内存没有名称。只有指针可以引用该变量。例如，要在此处存储字符\
  \ `'x'`，你可以写道：\n\n```c\n*ptr = 'x';\n```\n\n使用 `malloc()` 为字符串分配存储空间与使用 `malloc()`\
  \ 为单个 `char` 类型变量分配空间几乎完全相同。主要的区别在于你需要知道需要分配的空间大小——即字符串中字符的最大数量。这个最大值取决于你的程序的需求。在本例中，假设你想为一个长度为\
  \ 99 个字符的字符串分配空间，加上 1 个用于终止的空字符，总共 100 字节。首先，你声明一个指向 `char` 类型的指针，然后调用 `malloc()`：\n\
  \n```c\nchar *ptr;\nptr = malloc(100);\n```\n\n现在 `ptr` 指向一个预留的 100 字节块，该块可以用于字符串的存储和操作。你可以使用\
  \ `ptr`，就像你的程序通过以下数组声明显式分配了该空间一样：\n\n```c\nchar ptr[100];\n```\n\n使用 `malloc()`\
  \ 让你的程序能够根据需要分配存储空间。当然，可用空间不是无限的；它取决于计算机安装的内存量以及程序的其他存储需求。如果没有足够的内存，`malloc()` 返回\
  \ `null` (`0`)。你的程序应该测试 `malloc()` 的返回值，以便确认请求的内存已成功分配。你始终应该将 `malloc()` 的返回值与 `stdlib.h`\
  \ 中定义的符号常量 `NULL` 进行比较。列表 10.3 示例了 `malloc()` 的用法。任何使用 `malloc()` 的程序都必须 `#include`\
  \ 头文件 `stdlib.h`。\n\n### 提示\n\n在上面的示例中使用了字面量来为字符分配空间。你始终应该将你正在分配空间的数据类型的大小乘以你想要的空间数量。之前的分配假设字符仅存储在\
  \ 1 字节中。如果一个字符存储在超过 1 字节，那么之前的示例将覆盖内存的其他区域。例如：\n\n```c\nptr = malloc(100);\n```\n\
  \n实际上应该声明为：\n\n点击此处查看代码图像\n\n```c\nptr = malloc( 100 * sizeof(char));\n```\n\n输入\
  \ ![图像](img/down-arrow.jpg)\n\n**列表 10.3** memalloc.c: 使用 `malloc()` 函数为字符串数据分配存储空间\n\
  \n点击此处查看代码图像\n\n```c\n1:  /* memalloc.c--演示如何使用 malloc() 分配存储 */\n2:  /* 字符串数据的空间。\
  \ */\n3:\n4:  #include <stdio.h>\n5:  #include <stdlib.h>\n6:\n7:  char count, *ptr,\
  \ *p;\n8:\n9:  int main( void )\n10: {\n11:     /* 分配一个 35 字节的块。测试是否成功。 */\n12:\
  \     /* exit() 库函数终止程序。 */\n13:\n14:     ptr = malloc(35 * sizeof(char));\n15:\n\
  16:     if (ptr == NULL)\n17:     {\n18:         puts(\"Memory allocation error.\"\
  );\n19:         return 1;\n20:     }\n21:\n22:     /* 用值 65 到 90 填充字符串， */\n23:\
  \     /* 这些值是 A-Z 的 ASCII 码。 */\n24:\n25:     /* p 是用于遍历字符串的指针。 */\n26:     /* 你希望\
  \ ptr 保持指向字符串的 */\n27:     /* 起头。 */\n28:\n29:     p = ptr;\n30:     for (count\
  \ = 65; count < 91; count++)\n31:         *p = count;\n32:         p++;\n33:\n34:\
  \     /* 附加空字符。 */\n35:     *p = '\\0';\n36:\n37:     /* 显示字符串。 */\n38:     puts(ptr);\n\
  39:\n40:     /* 释放分配的内存。 */\n41:     free(ptr);\n42:\n43:     return 0;\n44: }\n\
  ```\n\n\n\n\n\n`a_string` 指向 `\"NO\"`。如果你尝试将 `\"YES\"` 赋值给此数组，可能会引发严重的问题。数组最初只能容三个字符——`'N'`、`'O'`\
  \ 和一个空字符。`\"YES\"` 是四个字符——`'Y'`、`'E'`、`'S'` 和一个空字符。你无法知道第四个字符（空字符）覆盖了什么内容。\n\n***\n\
  \n### 显示字符串和字符\n\n如果你的程序使用了字符串数据，它可能需要在某个时刻在屏幕上显示数据。字符串显示通常使用 `puts()` 函数或 `printf()`\
  \ 函数完成。\n\n#### puts() 函数\n\n你已经在本书前面的几个程序中见过 `puts()` 库函数了。`puts()` 函数将字符串显示在屏幕上——这也就是它名字的由来。指向要显示的字符串的指针是\
  \ `puts()` 接收的参数。由于字面量字符串会被求值为一个指向字符串的指针，因此 `puts()` 既可以显示字面量字符串，也可以显示字符串变量。`puts()`\
  \ 函数会自动在其显示的每个字符串末尾插入一个换行符，因此每个后续用 `puts()` 显示的字符串都会单独成行。\n\n列表 10.4 演示了 `puts()`\
  \ 的用法。\n\n输入 ![Image](img/down-arrow.jpg)\n\n**列表 10.4** put.c: 使用 `puts()` 函数在屏幕上显示文本\n\
  \n点击此处查看代码图像\n\n***\n\n```c\n1: /* Demonstrates displaying strings with puts().\
  \ */\n2:\n3: #include <stdio.h>\n4:\n5: char *message1 = \"C\";\n6: char *message2\
  \ = \"is the\";\n7: char *message3 = \"best\";\n8: char *message4 = \"programming\"\
  ;\n9: char *message5 = \"language!!\";\n10:\n11: int main( void )\n12: {\n13:  \
  \   puts(message1);\n14:     puts(message2);\n15:     puts(message3);\n16:     puts(message4);\n\
  17:     puts(message5);\n18:\n19:     return 0;\n20: }\n```\n\n***\n\nOutput ![Image](img/down-arrow.jpg)\n\
  \n***\n\n```\nC\nis the\nbest\nprogramming\nlanguage!!\n```\n\nAnalysis ![Image](img/down-arrow.jpg)\n\
  \n***\n\n这是一个非常容易理解的列表。因为 `puts()` 是标准输出函数，因此需要包含 `stdio.h` 头文件，如第 3 行所示。第 5 行到第\
  \ 9 行声明并初始化了五个不同的消息变量。这些变量中的每一个都是字符指针，或字符串变量。第 13 行到第 17 行使用 `puts()` 函数打印了每个字符串。\n\
  \n#### printf() 函数\n\n你也可以使用 `printf()` 库函数来显示字符串。回想 第 77 节，`printf()` 使用格式字符串和转换说明符来格式化输出。要显示字符串，请使用转换说明符\
  \ `%s`。\n\n当 `printf()` 在其格式字符串中遇到 `%s` 时，函数会将 `%s` 与其参数列表中对应的参数相匹配。对于字符串，该参数必须指向你想要显示的字符串的指针。`printf()`\
  \ 函数将字符串显示在屏幕上，直到遇到字符串的终止空字符为止，例如：\n\n点击此处查看代码图像\n\n```c\nchar *str = \"A message\
  \ to display\";\nprintf(\"%s\", str);\n```\n\n你还可以显示多个字符串，并将它们与字面文本和数值变量混合：点击此处查看代码图像\n\
  \n```c\nchar *bank = \"First Federal\";\nchar *name = \"John Doe\";\nint balance\
  \ = 1000;\nprintf(\"The balance at %s for %s is %d.\", bank, name, balance);\n```\n\
  \n结果输出是 点击此处查看代码图像\n\n```\nThe balance at First Federal for John Doe is 1000.\n\
  ```\n\n目前，这些信息应该足够你在程序中显示字符串数据了。使用 `printf()` 的完整细节请参阅 第 14 节“处理屏幕、打印机和键盘”。\n\n\
  ### 从键盘读取字符串\n\n除了显示字符串外，程序通常还需要接受用户输入的字符串数据。C 语言库有两个函数可以用于此目的：`gets()` 和 `scanf()`。然而，在从键盘读取字符串之前，你必须有一个地方来存放它。你可以使用两种方法之一——数组声明或\
  \ `malloc()` 函数来为字符串存储创建空间。\n\n#### 使用 gets() 函数输入字符串\n\n`gets()` 函数从键盘获取字符串。当调用\
  \ `gets()` 时，它会读取键盘上输入的所有字符直到遇到第一个换行符（通过按下 Enter 键产生）。该函数会丢弃换行符，添加一个空字符，并将字符串交给调用它的程序。字符串存储在传递给\
  \ `gets()` 的 `char` 类型指针所指示的位置。使用 `gets()` 的程序必须 `#include` 文件 `stdio.h`。列表 10.5\
  \ 展示了一个示例。\n\n输入 ![Image](img/down-arrow.jpg)\n\n**列表 10.5** get.c: 使用 `gets()`\
  \ 从键盘输入数据\n\n点击此处查看代码图像\n\n***\n\n```c\n1: /* Demonstrates displaying strings with\
  \ puts(). */\n2:\n3: #include <stdio.h>\n4:\n5: /* Allocate an array to hold input.\
  \ */\n6:\n7: char input[257];\n8:\n9: int main( void )\n10: {\n11:     puts(\"Enter\
  \ some text, then Enter:\");\n12:     gets(input);\n13:     printf(\"You entered:\
  \ %s\\n\", input);\n14:\n15:     return 0;\n16: }\n```\n\n***\n\nOutput ![Image](img/down-arrow.jpg)\n\
  \n点击此处查看代码图像\n\n***\n\n```\nEnter some text, then Enter:\nThis is a test\nYou entered:\
  \ This is a test\n```\n\nAnalysis ![Image](img/down-arrow.jpg)\n\n在这个示例中，`gets()`\
  \ 的参数是 `input`，它是 `char` 数组的名字，因此是一个指向数组第一个元素的指针。数组在第 7 行声明为 257 个元素。因为大多数屏幕上的最大行长度是\
  \ 256 个字符，这个数组的大小为最可能的输入行提供了空间（加上 `gets()` 添加的空字符）。\n\n`gets()` 函数有一个返回值，之前的示例中被忽略了。`gets()`\
  \ 返回一个 `char` 类型指针，指向字符串存储的地址。是的，这就是传递给 `gets()` 的值，但通过这种方式将值返回给程序可以让程序测试空行。列表 10.6\
  \ 显示了如何这样做。\n\n输入 ![Image](img/down-arrow.jpg)\n\n**列表 10.6** getback.c: 使用返回值测试空行输入\n\
  \n点击此处查看代码图像\n\n***\n\n```c\n1: /* getback.c--Demonstrates using gets() return value.\
  \ */\n2:\n3: #include <stdio.h>\n4:\n5: /* Declare a character array to hold input,\
  \ and a pointer. */\n6:\n7: char input[257], *ptr;\n8:\n9: int main( void )\n10:\
  \ {\n11:     /* Display instructions. */\n12:\n13:     puts(\"Enter text a line\
  \ at a time, then Enter.\");\n14:     puts(\"Enter a blank line when done.\");\n\
  15:\n16:     /* Loop as long as input is not a blank line. */\n17:\n18:     while\
  \ ( *(ptr = gets(input)) != '\\0')\n19:         printf(\"You entered %s\\n\", input);\n\
  20:\n21:     puts(\"Thank you and good-bye\\n\");\n22:\n23:     return 0;\n24: }\n\
  ```\n\n***\n\nOutput ![Image](img/down-arrow.jpg)\n\n点击此处查看代码图像\n\n***\n\n```\n\
  Enter text a line at a time, then Enter.\nEnter a blank line when done.\n```\n\n\
  \n\n\n现在你可以看到程序是如何运行的。如果你在响应第 18 行时输入空行（即你只是按了回车键），该字符串（包含 0 个字符）仍然会被存储，并在末尾以空字符结尾。由于字符串的长度为\
  \ 0，空字符被存储在第一个位置。这正是 `gets()` 返回值所指向的位置，因此如果你测试该位置并发现是一个空字符，你就知道输入了一个空行。\n\n列表 10.6\
  \ 在第 18 行的 `while` 语句中执行了此测试。该语句有点复杂，所以请仔细查看各个细节。图 10.1 描述了该语句的组成部分。\n\n![Image](img/10fig01.jpg)\n\
  \n**图 10.1** 用于测试空行输入的 `while` 语句的组成部分。\n\n* * *\n\n**注意**\n\n由于无法总是知道 `gets()`\
  \ 将读取多少个字符，而且 `gets()` 会继续向缓冲区边界之外存储字符，因此使用该函数时应谨慎。\n\n* * *\n\n**1.** `gets()`\
  \ 函数接受键盘的输入，直到遇到换行符为止。\n\n**2.** 输入的字符串在减去换行符并带有尾空字符后，被存储在 `input` 指向的内存位置中。\n\n\
  **3.** 字符串的地址（与 `input` 的值相同）被返回给指针 `ptr`。\n\n**4.** *赋值语句*是一个表达式，其求值结果赋值运算符左侧变量的值。因此，整个表达式\
  \ `ptr = gets(input)` 的求值是 `ptr` 的值。通过将此表达式括在括号中并在其前面加上间接运算符（`*`），你可以获得所指地址处存储的值。这当然是输入字符串的第一个字符。\n\
  \n**5.** 如果输入字符串的第一个字符不是空字符（即没有输入空行），则比较运算符返回 `true`，执行 `while` 循环。如果第一个字符是空字符（即已输入空行），则比较运算符返回\
  \ `false`，`while` 循环终止。\n\n当你使用 `gets()` 或任何其他使用指针存储数据的函数时，请确保指针指向已分配的空间。很容易犯下这样的错误：\n\
  \n```\nchar *ptr;\ngets(ptr);\n```\n\n指针 `ptr` 已声明但未初始化。它指向某个地方，但你并不知道在哪里。`gets()`\
  \ 函数不知道 `ptr` 尚未初始化指向某个地方，所以它直接将入的字符串存储在 `ptr` 中包含的任何地址上。该字符串可能会覆盖某些重要内容，例如程序代码或操作系统。大多数编译器都不会捕获这类错误，因此你，作为程序员，必须保持警惕。\n\
  \n### 语法\n\n#### gets() 函数\n\n```c\n#include <stdio.h>\n\nchar *gets(char *str);\n\
  ```\n\n`gets()` 函数从标准输入设备（通常是键盘）获取一个字符串 `str`。该字符串由直到读取换行符为止输入的任何字符组成。在这一点上，字符串末尾会附加一个空字符。\n\
  \n然后 `gets()` 函数返回指向刚刚读取的字符串的指针。如果获取字符串时出现问题，`gets()` 返回空。\n\n**示例**\n\n点击此处查看代码图像\n\
  \n```c\n/* gets() example */\n#include <stdio.h>\n\nchar line[256];int main( void\
  \ )\n{\n    printf( \"Enter a string:\\n\");\n    gets( line );\n    printf( \"\\\
  nYou entered the following string:\\n\" );\n    printf( \"%s\\n\", line );\n}\n\
  ```\n\n* * *\n\n#### 使用 scanf() 函数输入字符串\n\n你已经在第 7  中看到 `scanf()` 库函数接受来自键盘的数值数据输入。该函数也可以输入字符串。记住\
  \ `scanf()` 使用一个*格式字符串*来告诉它如何读取输入的信息。要读取字符串，在 `scanf()` 的格式字符串中包含指定符 `%s`。与 `gets()`\
  \ 一样，`scanf()` 传递的是一个指向字符串存储位置的指针。\n\n`scanf()` 如何决定字符串的开始和结束？开始是遇到的第一个非空白字符。结束可以通过两种方式之一指定。如果你在格式字符串中使用\
  \ `%s`，字符串将一直持续到（但不包括）下一个空白字符（空格、制表符或换行符）。如果你使用 `%ns`（其中 `n` 是指定字段宽的整数常量），`scanf()`\
  \ 将接受接 `n` 个字符或直到下一个空白字符，以先到者为准。\n\n你可以通过在格式字符串中包含多个 `%s` 来使用 `scanf()` 读取多个字符串。对于格式字符串中的每个\
  \ `%s`，`scanf()` 按照前面的规则找到请求的字符串。例如：\n\n```c\nscanf(\"%s%s%s\", s1, s2, s3);\n```\n\
  \n对于该语句输入 `January February`，`January` 被赋值给 `s1`，`February` 被赋值给 `s2`，`March` 被赋值给\
  \ `s3`。\n\n使用字段宽度指定符如何？如果你执行\n\n```c\nscanf(\"%3s%3s%3s\",\n```\n\n并在响应输入 `September`，`Sep`\
  \ 被赋值给 `s1`，`tem` 被赋值给 `s2`，`ber` 被赋值给 `s3`。\n\n如果输入的字符串少于或多于 `scanf()` 预期的数量？如果输入的字符串少于，`scanf()`\
  \ 会继续等待直到它们被输入。例如，对于语句：\n\n```c\nscanf(\"%s%s\", s1, s2);\n```\n\n你输入 `January February`，`January`\
  \ 被赋值给 `s1`，`February` 被赋值给 `s2`（在第一个 `scanf()` 调用中）。`March` 则剩余（在键盘缓冲区中），并在第二个\
  \ `scanf()` 调用中被赋值给 `s3`。\n\n`scanf()` 函数有一个返回值，等于输入的项目数。返回值通常被忽略。当你只读取文本时，`gets()`\
  \ 函数通常比 `scanf()` 好。记住在第 7  输入数值变量时必须使用地址运算符（`&`）。当你读取文本和数值数据的组合时，最好使用 `scanf()`\
  \ 函数。这通过列表 10.7 所示。\n\n**列表 10.7** input.c: 使用 `scanf()` 输入数值和文本\n\n点击此处查看代码图像\n\
  \n* * *\n\n1:/* 展示使用 scanf() 输入数值和文本。 */\n2:\n3:#include <stdio.h>\n4:\n5:char lname[257],\
  \ fname[257];\n6:int count, id_num;\n7:\n8:int main( void )\n9:{\n10:    :���/*\
  \ 提示用户。 */\n11:\n12:    :���puts(\"Enter last name, first name, ID number separated\"\
  );\n13:    :���puts(\"by spaces, then press Enter.\");\n14:\n15:    :���/* 输入三个数据项。\
  \ */\n16:\n17:    :���count = scanf(\"%s%s%d\", lname, fname, &id_num);\n18:\n19:\
  \    :���/* 显示数据。 */\n20:\n21:    :���printf(\"%d items entered: %s %s %d \\n\"\
  , count, fname, lname, id_num);\n22:\n23:    :���return 0;\n24:}\n\n\n\n记住 `scanf()`\
  \ 要求将变量的地址作为参数。在列表 10.7 中，`lname` 和 `fname` 是指针（即地址），因此它们不需要取地址运算符（`&`）。相比之下，`id_num`\
  \ 是一个普通的变量名，因此在第 17 行传递给 `scanf()` 时，它需要 `&`。\n\n***\n\n### 提示\n\n此程序演示了 `scanf()`\
  \ 函数的一个局限性。假设你需要输入的第一个名字包含两个单词，比如 Mary Ellen 怎样？由于空格的存在，`scanf()` 函数只会将 `Mary` 放入\
  \ `fname` 变量中，尽管“Mary Ellen”是一个完全可以接受的字符串。因此，你可能需要为名字的两个部分创建两个变量，或者要求用户不带空格地输入名字。出于这个原因，`gets()`\
  \ 可以成为从用户处获取字符串更有效的工具，特别是当字符串中包含空格时。\n\n***\n\n有些程序员认为使用 `scanf()` 进行数据输入容易出错。他们倾向于使用\
  \ `gets()` 输入所有数据（包括数字和字符串），然后让程序分离这些数字并将它们转换为数值变量。此类技术超出了本书的涵盖范围，但它们会是很好的编程练习。对于该任务，你需要用到第\
  \ 18 中介绍的字符串处理函数。\n\n### 总结\n\n本节介绍了 C 语言的 `char` 数据类型。`char` 类型的一种用途是存储单个字符。你看到字符实际上是以数字形式存储的：ASCII\
  \ 码为每个字符分配了一个数值代码。因此，你也可以使用 `char` 类型来存储小的整数值。`signed` 和 `unsigned char` 类型都是可用的。\n\
  \n字符串是以空字符终止的字符序列。字符串可以用于存储文本数据。C 将字符串存储在 `char` 类型的数组中。要存储一个长度为 `n` 的字符串，你需要一个拥有\
  \ `n+1` 个元素的 `char` 类型数组。\n\n你可以使用如 `malloc()` 等内存分配函数使你的程序更具动态性。通过使用 `malloc()`，你可以为程序分配正确数量的内存。如果没有这些函数，你就必须猜测程序所需的内存存储量。你的估计可能会偏高，因此你会分配比实际需要更多的内存。当你完成对已分配内存的使用后，应该始终花时间使用\
  \ `free()` 函数将其返回给系统。\n\n### 问答\n\n**问 字符串和字符数组有什么区别？**\n\n**答** 字符串被定义为以空字符结尾的字符序列。数组是字符序列。因此，字符串是一个空终止的字符数组。\n\
  \n如果你定义了一个 `char` 类型的数组，为数组分配的实际存储空间是指定的大小，而不是减 1 的大小。你受限于该大小；无法存储更大的字符串。这里有一个例子：\n\
  \n点击此处查看代码图像\n\n```c\nchar state[10]=\"Minneapolis\";      /* 错误！字符串比数组长。 */\n\n\
  char state2[10]=\"MN\";               /* OK，但浪费了空间，因为 */\n                     \
  \              /* 字符串比数组短。 */\n```\n\n相反，如果你定义了一个 `char` 类型指针，这些限制就不适用。该变量仅是指针的存储空间。实际字符串存储在内存的其他地方（但你不需要担心在内存的哪个位置）。没有长度限制，也没有浪费空间。实际字符串存储在别处。指针可以指向任何长度的字符串。\n\
  \n**问 为什么我不直接声明大数组来存放值，而不是使用 `malloc()` 等内存分配函数？**\n\n**答** 虽然声明大数组看起来更简单，但这并不是内存的有效利用。当你编写像本节中这样的小程序时，使用\
  \ `malloc()` 函数代替数组可能看起来微不足道，但随着你的程序变大，你希望只在需要时分配内存。用完内存后，可以通过 `free` 将其归还。当你释放内存时，程序其他部分的另一个变量或数组就可以使用它(第\
  \ 21 节，“处理内存”涵盖了释放已分配内存的内容。）\n\n**问 是否所有电脑都支持扩展 ASCII 字符集？**\n\n**答** 不是。大多数 PC\
  \ 都支持扩展 ASCII 集合。一些旧 PC 不支持，但缺乏这种支持的旧 PC 数量正在减少。大多数程序员使用扩展集中的线条字符和块状字符。\n\n此外，许多国际字符集包含的字符比\
  \ ASCII 提供的多。这些字符通常存储在 `wchar_t` 类型变量中，而不是 `char` 类型变量。`wchar_t` 定义在 `stddef.h`\
  \ 头文件中。它可以用于存放较大的字符。查看 ANSI 文档获取有关使用 `wchar_t` 和其他字符集的更多信息。\n\n**问 如果我将字符串放入一个较小的数组会发生什么？**\n\
  \n**答** 这可能导致错误。\n\n### 工作坊\n\n工作坊提供了问题来帮助你巩固理解。\n\n### 测验\n\n**1 字符串和字符数组有什么区别？**\n\
