  \ 17 行，为 `myPoint` 的成员进行了赋值。如前所述，赋值是通过使用结构体变量名、后跟成员运算符（`.`）、最后是成员名称完成的。在第 19 行和第\
  \ 20 行，这些相同的变量被用于 `printf` 语句中。\n\n### 语法\n\n#### struct 关键字\n\n点击此处查看代码图像\n\n```c\n\
  struct tag {\n    structure_member(s);\n    /* 此处可以放置额外的语句 */\n} instance;\n```\n\
  \n`struct` 关键字用于声明结构体。结构体是一组一个或多个变量（`structure_members`）的集合，它们被归类在一个名称下以便于操作。这些变量不需要是相同的类型，也不必须是简单变量。结构体还可以包含数组、指针和其他结构体。\n\
  \n关键字 `struct` 标识结构体定义的开始。它后面跟着一个标签，该标签是赋予结构体的名称。标签之后是括在括号内的结构体成员。也可以定义一个 `instance`，即结构体的实际声明。如果你在不定义实例的情况下定义结构体，它只是一个模板（或定义），可以在程序的后半部分用于声明结构体。以下是模板的格式：\n\
  \n点击此处查看代码图像\n\n```c\nstruct tag {\n    structure_member(s);\n    /* 此处可以放置额外的语句\
  \ */\n};\n```\n\n要使用该模板，你可以使用以下格式：\n\n`struct tag instance;`\n\n要使用此格式，你必须之前已经声明了给定标签的结构体。\n\
