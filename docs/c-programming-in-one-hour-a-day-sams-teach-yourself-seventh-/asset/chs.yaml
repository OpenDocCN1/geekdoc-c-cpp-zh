  \ 将忽略它并继续关闭其他的。\n\n### 返回值\n0。\n\n## feof()\n`feof()` 函数检查流是否到达文件结束标志。当关联的输入操作因为\
  \ EOF 失败时，该标志会被设置。\n\n### 返回值\n如果文件结束标志被设置，则返回非零，否则返回 0。\n\n## fflush()\n`fflush()`\
  \ 函数刷新指定流的缓冲区数据。这确保了写入缓冲区的所有数据都被发送到相应的文件。\n\n### 返回值\n成功时返回 0，错误时返回 EOF。\n\n## fgetc()\n\
  `fgetc()` 函数从指定的输入流读取单个字符。\n\n### 返回值\n返回读取的字符，如果发生错误或到达 EOF 则返回 EOF。\n\n## fgets()\n\
  `fgets()` 函数从指定的输入流读取一行字符，直到遇到换行符、到达文件结束或达到限制。\n\n### 返回值\n返回指向读取的字符串的指针（包括空字符），或者在错误时返回\
  \ NULL。\n\n## 文件管理\n文件管理操作涉及打开、关闭和操作文件流。\n\n## floor()\n`floor()` 函数返回小于或等于给定浮点数的最大整数值。\n\
  \n## flushall()\n`flushall()` 函数刷新所有缓冲区输出流。\n\n## fmod()\n`fmod()` 函数返回一个浮点数除以另一个数的数。\n\
  \n## fopen()\n`fopen()` 函数以读取、写入或两种模式打开文件。\n\n### 返回值\n成功时返回指向新文件流的指针，错误时返回 NULL。\n\
  \n### 格式化输入\n`scanf()`\n`scanf()` 函数从标准输入流读取格式化输入。\n\n### 格式化输出\n`fprintf()`\n`fprintf()`\
  \ 函数将格式化数据写入指定的输出流。\n\n`printf()`\n`printf()` 函数将格式化数据写入标准输出流。\n\n### 转换字符\n转换字符用于格式化函数，以指定数据如何被解释或格式化。\n\
