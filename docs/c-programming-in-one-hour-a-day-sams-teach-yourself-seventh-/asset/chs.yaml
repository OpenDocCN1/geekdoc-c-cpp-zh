  \ `coord` 结构类型）：\n\n点击此处查看代码图像\n\n```c\nstruct rectangle {\n    struct coord topleft;\n\
  \    struct coord bottomrt;\n};\n```\n\n该语句定义了一个 `rectangle` 类型的结构，它包含了两个 `coord`\
