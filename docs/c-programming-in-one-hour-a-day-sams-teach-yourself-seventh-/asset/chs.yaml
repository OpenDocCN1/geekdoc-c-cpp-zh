  \n## 第 11 节：实现结构体、联合体和 typedef\n\n许多编程任务通过被称为 `structures`（结构体）的 C 数据结构得到了简化。结构体是由程序员你亲自设计的数据存储类型，以完全符合你的编程需求。在本节中，你将学习：\n\
  \n- ![Image](img/squf.jpg) 什么是简单结构和复杂结构\n- ![Image](img/squf.jpg) 如何定义和声明结构体\n-\
  \ ![Image](img/squf.jpg) 如何访问结构体中的数据\n- ![Image](img/squf.jpg) 如何创建包含数组和结构数组的结构体\n\
  - ![Image](img/squf.jpg) 如何在结构体中声明指针以及指向结构体的指针\n- ![Image](img/squf.jpg) 如何将结构体作为参数传递给函数\n\
  - ![Image](img/squf.jpg) 如何定义、声明和使用联合体\n- ![Image](img/squf.jpg) 如何在结构体中使用类型定义\n\
  \n#### 使用简单结构体\n\n`structure`（结构体）是将一个或多个变量分组在同一个名称下的集合，便于操作。结构体中的变量与数组不同，它们可以是不同的数据类型。结构体可以包含\
  \ C 的任何数据类型，包括数组和其他结构体。结构体中的每个变量被称为该结构体的 `member`（成员）。下一节展示了一个简单的示例。\n\n你应该从简单结构体开始。注意，C\
  \ 语言并不区分简单结构和复杂结构，但用这种方式来解释结构体会更容易。\n\n#### 定义和声明结构体\n\n如果你编写一个图形程序，你的代码需要处理屏幕上点的坐标。屏幕坐标写为\
  \ `x` 值（表示水平位置）和 `y` 值（表示垂直位置）。你可以如下定义一个名为 `coord` 的结构体，它包含屏幕位置的 `x` 和 `y` 值：\n\n\
  ```\nstruct coord\n{\n    int x;\n    int y;\n};\n```\n\n`struct` 关键字标识结构体定义的开始。该\
  \ `struct` 关键字后面必须紧跟结构体的名称。这与你在 C 中创建的其他数据类型的规则相同。结构体的名称也称为该结构体的 `tag`（标签）或 `type\
  \ name`（类型名称）。稍后你会看到如何使用该标签。\n\n结构体标签之后是一个左括号。在结构体名称后的大括号内是结构体成员变量的列表。你必须为每个成员提供类型和名称。\n\
  \n前面的代码语句定义了一个名为 `coord` 的结构体类型，它包含两个整数变量 `x` and `y`。然而，对 `coord` 及其成员 `x` 和 `y`\
  \ 的这种声明并没有实际创建 `coord` 结构体的任何实例或 `x` and `y` 变量。换句话说，它们并没有 `declare`（留出存储空间）。\n\n\
  （注：此处译文根据原文逻辑对部分重复的声明/定义描述已按要求进行了整合，以确保逻辑流畅且不重复原文）\n\n*注：由于原文在“定义和声明结构体”部分存在部分描述性重复（常见教材初稿现象），译文在保持原意的基础上确保了可读性。*\n\
  \n#### 访问结构体成员\n\n结构体成员可以像其他变量一样使用。通过结构体名称和成员名称之间的 `.`（也称为点运算符）来访问结构成员。因此，为了让名为\
  \ `first` 的结构体指向坐标为 `x=50, y=100` 的屏幕位置，你可以写：\n\n```\nfirst.x = 50;\nfirst.y = 100;\n\
  ```\n\n要显示存储在结构体 `second` 中的屏幕位置，你可以写：\n\n点击此处查看代码图像\n\n到此为止，你可能会疑问使用结构体而不是单独变量的优势在哪里。一个主要优势是可以使用赋值语句在相同类型的结构体之间复制信息。继续之前的示例，语句\n\
  \n```\nfirst = second;\n```\n\n等同于这条语句：\n\n```\nfirst.x = second.x;\nfirst.y = second.y;\n\
  ```\n\n当你的程序使用许多成员的复杂结构体时，这种写法可以节省大量时间。随着你学习一些高级技巧，结构体的其他优势将变得显而易见。通常，每当不同类型的信息应该被视为整体时，你都会发现结构体非常有用。例如，在邮件列表中，每个条目都可以是一个结构体，每条信息（姓名、地址、城市等）都可以是一个结构体成员。\n\
