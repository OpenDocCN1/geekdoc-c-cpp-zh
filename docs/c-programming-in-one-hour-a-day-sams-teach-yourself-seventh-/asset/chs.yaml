  \ 15.5 中的程序来说这一点，使其使用函数来显示字符串。修改后的程序如列表 15.6 所示。\n\n## 综合示例\n\n现在是时候来看一个综合示例了。代码列表\
  \ 15.7 使用你学过的许多技术。如果你从零开始编写程序，你会这样设计：\n\n1. 接收输入直到输入空行。\n2. 排序。\n3. 显示。\n\n这个列表建议程序至少有三个函数：一个用于输入，一个用于排序，一个用于显示。现在你可以独立设计每个函数。你需要输入函数（称为\
  \ `get_lines()`）做什么？再次列出：\n\n1. 跟踪行数，并在完成后将其返回给调用程序。\n2. 不允许输入超过预设数量的行。\n3. 为每行分配存储空间。\n\
  4. 通过存储指针来跟踪所有行。\n5. 输入空行时返回调用程序。\n\n现在考虑第二个函数，即对行进行排序。它可以被称为 `sort()`。（真原创，对吧？）所使用的排序技术是一种简单的暴力的法，比较相邻字符串，如果第二个字符串小于第一个则进行交换。更准确地说，该函数比较数组中相邻的两个字符串，并在必要时交换指针。\n\
  \n为了确保排序完成，你必须从头尾遍历数组，比较每对字符串并在必要时进行交换。对于一个包含 *n* 个元素的数组，你需要遍历数组 *n–1* 次。为什么这是必要的呢？\n\
  \n你每次遍历数组，给定元素最多移动一个位置。例如，如果应该是第一个字符串实际上位于最后一个位置，第一次遍历数组会将其移动到倒数第二个位置，第二次遍历数组会再向上移动一个位置，以此此类推。它需要\
  \ *n–1* 次才能移动到它所属的第一位置。\n\n注意，这是一种低效且不优雅的排序方法。然而，它很容易实现和理解，对于示例程序排序的短列表来说绰有余。\n\n\
  最后一个函数在屏幕上显示排序后的行。实际上，它已经在列表 15.6 中写过了；只需进行微调即可在列表 15.7 中使用。\n\n\n\n\n\n# 列表 15.7\
  \ sort.c：一个从键盘读取文本行、按字母顺序排序并显示排序列表的程序\n\n点击此处查看代码图像\n\n```c\n1:   // sort.c--从键盘输入一个字符串列表，\n\
  2:   // 对它们进行排序，然后在屏幕上显示它们。\n3:   #include <stdlib.h>\n4:   #include <stdio.h>\n\
  5:   #include <string.h>\n6:\n7:   #define MAXLINES 25\n8:\n9:   int get_lines(char\
  \ *lines[]);\n10:  void sort(char *p[], int n);\n11:  void print_strings(char *p[],\
  \ int n);\n12:\n13:  char *lines[MAXLINES];\n14:\n15:  int main( void )\n16:  {\n\
  17:      int number_of_lines;\n18:\n19:      // 从键盘读取行。\n20:\n21:      number_of_lines\
  \ = get_lines(lines);\n22:\n23:      if ( number_of_lines < 0 )\n24:      {\n25:\
  \          puts(\" Memory allocation error\");\n26:          exit(-1);\n27:    \
  \  }\n28:\n29:      sort(lines, number_of_lines);\n30:      print_strings(lines,\
  \ number_of_lines);\n31:      return 0;\n32:  }\n33:\n34:  int get_lines(char *lines[])\n\
  35:  {\n36:      int n = 0;\n37:      char buffer[80];  // 每一行的临时存储。\n38:\n39: \
  \     puts(\"每次输入一行；完成后输入空行回结束。\");\n40:\n41:      while ((n < MAXLINES) && (gets(buffer)\
  \ != 0) &&\n42:              (buffer[0] != '\\0'))\n43:      {\n44:          if\
  \ ((lines[n] = (char *)malloc(strlen(buffer)+1)) == NULL)\n45:              return\
  \ -1;\n46:          strcpy( lines[n++], buffer );\n47:      }\n48:      return n;\n\
  49:\n50:  } // get_lines() 结束\n51:\n52:  void sort(char *p[], int n)\n53:  {\n54:\
  \      int a, b;\n55:      char *tmp;\n56:\n57:      for (a = 1; a < n; a++)\n58:\
  \      {\n59:          for (b = 0; b < n-1; b++)\n60:          {\n61:          \
  \    if (strcmp(p[b], p[b+1]) > 0)\n62:              {\n63:                  tmp\
  \ = p[b];\n64:                  p[b] = p[b+1];\n65:                  p[b+1] = tmp;\n\
  66:              }\n67:          }\n68:      }\n69:  }\n70:\n71:  void print_strings(char\
  \ *p[], int n)\n72:  {\n73:      int count;\n74:\n75:      for (count = 0; count\
  \ < n; count++)\n76:          printf(\"%s\\n\", p[count]);\n77:  }\n```\n\n## 分析\n\
  \n你将这些检查这个程序的一些细节。程序使用了几个库函数来执行各种类型的字符串操作。在这里对它们进行了解释，并在第 18 节操作字符串 中提供了更详细的介绍。使用这些函数的程序必须包含\
  \ `string.h` 头文件。\n\n在 `get_lines()` 函数中，输入由第 41 行和 42 行的 `while` 语句控制，其读取如下（合并为一行）：\n\
  \n```c\nwhile ((n < MAXLINES) && (gets(buffer) != 0) && (buffer[0] != '\\0'))\n\
  ```\n\n`while` 测试的条件包含三个部分。第一部分 `n < MAXLINES` 确保尚未输入最大行数。第二部分 `gets(buffer) !=\
  \ 0` 调用 `gets()` 库函数从键盘读取一行到 `buffer` 中，并验证是否发生了文件结束或其他错误。第三部分 `buffer[0] != '\\\
  0'` 验证输入的行的第一个字符不是空字符，空字符将表示输入了空行。\n\n如果无法满足这三个条件中的任何一个，`while` 循环将终止，执行流将以输入的行数作为返回值返回给调用程序。如果三个条件都满足，则执行第\
  \ 44 行的后续 `if` 语句：\n\n```c\nif ((lines[n] = (char *)malloc(strlen(buffer)+1)) ==\
  \ NULL)\n```\n\n该语句调用 `malloc()` 为刚刚输入的字符串分配空间。`strlen()` 函数返回作为参数传递的字符串长度；该值加了\
  \ 1，以便 `malloc()` 为字符串及其终止空字符分配空间。第 44 行 `malloc()` 之前的 `(char *)` 是一个类型转换，它指定了\
  \ `malloc()` 返回的指针类型，在本例中类型为指向 `char` 类型的指针。你可以在第 21 节 中学习更多关于类型转换的知识。\n\n你可能记得库函数\
  \ `malloc()` 返回一个指针。该语句将 `malloc()` 返回的指针值赋值给指针数组相应的元素。如果 `malloc()` 返回 `NULL`，`if`\
  \ 循环将带有 `-1` 的返回值返回给调用程序。`main()` 中的代码测试了 `get_lines()` 的返回值，并检查返回值是否小于零；23 行到 27\
  \ 行报告内存分配错误并终止程序。\n\n如果内存分配成功，程序使用第 46 行的 `strcpy()` 函数将字符串从临时存储位置 `buffer` 复制到\
  \ `malloc()` 刚刚分配的空间。然后 `while` 循环重复，获取另一行输入。\n\n当 `get_lines()` 执行返回 `main()` 后，完成了以下工作（假设没有内存分配错误）：\n\
  \n- 若干行文本已从键盘读取并以终止字符串的形式存储在内存中。\n- 数组 `lines[]` 包含了所有字符串的指针。指针的顺序是输入的顺序。\n- 变量\
  \ `number_of_lines` 保存了行数。\n\n现在是排序时间了。记住，你并不是在移动字符串，而是移动数组 `lines[]` 中指针的顺序。查看\
  \ `sort()` 函数中的代码。它包含一个嵌套在另一个内部的 `for` 循环（5768 行）。外层循环执行 `number_of_lines-1` 次。外层循环每执行一次，内部循环遍历数组指针，比较\
  \ `(string n)` 和 `(string n+1)`，`n` 从 0 到 `number_of_lines-1`。比较由 61 行的库函数 `strcmp()`\
  \ 执行，它传递了两个字符串的指针。`strcmp()` 函数返回以下值：\n\n- 如果第一个字符串大于第二个字符串，返回大于零的值。\n- 如果两个字符串相同，返回零。\n\
  - 如果第二个字符串大于第一个字符串，返回小于零的值。\n\n在程序中，`strcmp()` 返回大于零的值意味着第一个字符串“大于”第二个字符串，必须交换它们。（也就是说，它们在\
  \ `lines[]` 中的指针必须交换）。这是通过一个临时变量 `tmp` 完成的。\n\n当程序执行从 `sort()` 返回时，`lines[]` 中的指针已正确排序：指向“最小”字符串的指针在\
  \ `lines[0]` 中，指向“次小”的指针在 `lines[1]` 中，依此类推。例如，假设你按此顺序输入了以下五行内容：\n\ndog\napple\n\
  zoo\nprogram\nmerry\n\n调用 `sort()` 之前的状况见图 15.5，从 `sort()` 返回后的情况见图 15.6。\n\n\n\n\
  \n最后，程序调用 `print_strings()` 函数在屏幕上显示排序后的字符串列表。你可能在本节之前的示例中已经对这个函数很熟悉了。\n\n列表 15.7\
  \ 中的程序是你到目前为止遇到过的复杂的程序。它使用了之前课程中涵盖的许多 C 语言编程技术。在前面的说明的帮助下，你可以遵循程序的运行过程并理解每一步。如果你发现某些地方不清楚，请回顾本书中的相关章节直到你理解为止。\n\
  \n### 总结\n\n本节涵盖了指针的一些高级用法。正如你现在可能意识到的那样，指针是 C 语言的核心部分。不使用指针的 C 程序非常罕见。你学习了如何使用指针的指针，以及指针数组在处理字符串时是多么有用的。你还学习了\
  \ C 如何将多维数组处理为数组的数组，并了解了如何对这类数组使用指针。\n\n### 问答\n\n**问 指针的指针可以嵌套多少层？**\n\n**答 你需要检查你的编译器手册来确定是否存在限制。很少有理由让指针超过三层（指向指针的指针的指针）。大多数程序程序很少超过两层。**\n\
  \n**问 字符串指针和字符数组指针之间有区别吗？**\n\n**答 没有。字符串可以被视为一个字符数组。**\n\n### 工作坊\n\n工作坊提供了测验题来帮助你巩固对所涵盖内容的理解，并提供了练习让你获得使用所学知识的经验。\n\
