  \n点击此处查看代码图像\n\n```c\n1:  // stringcompare.c--The strcmp() function.\n2:\n3:  #include\
  \ <stdio.h>\n4:  #include <string.h>\n5:\n6:  int main( void )\n7:  {\n8:      char\
  \ str1[80], str2[80];\n9:      int x;\n10:\n11:     while (1)\n12:     {\n13:  \
  \        /* Input two strings. */\n14:          printf(\"\\nInput the first string,\
  \ blank to exit: \");\n15:          gets(str1);\n16:          if ( strlen(str1)\
  \ == 0 )\n17:              break;\n18:          printf(\"\\nInput the second string:\
  \ \");\n19:          gets(str2);\n20:          /* Compare them and display the result.\
  \ */\n21:          x = strcmp(str1, str2);\n22:          printf(\"\\nstrcmp(%s,%s)\
  \ returns %d\\n\", str1, str2, x);\n23:     }\n24:     return 0;\n25: }\n```\n\n\
  * * *\n\n输出 ![Image](img/down-arrow.jpg)\n\n点击此处查看代码图像\n\n* * *\n\n输入 first string,\
  \ blank to exit: Smith\nsecond string: SMITH\nstrcmp(Smith,SMITH) returns -1\n\n\
