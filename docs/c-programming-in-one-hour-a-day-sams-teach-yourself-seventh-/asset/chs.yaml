  \ (Understanding Unions)\n\n*联合体*（Unions）与结构体相似。联合体的声明和使用方法与结构体相同。联合体与结构体的区别在于，它一次只能使用其中一个成员。其原因很简单：联合体的所有成员占用相同的内存区域——它们是堆叠在一起的。\n\
  \n#### 定义、声明和初始化联合体 (Defining, Declaring, and Initializing Unions)\n\n联合体的定义和声明方式类似于结构体。声明中的唯一区别是使用了\
  \ `union` 关键字而不是 `struct`。要定义一个由 `char` 变量和一个整数变量组成的联合体，你可以写如下代码：\n\n```c\nunion\
  \ shared\n{\n    char c;\n    int i;\n};\n```\n\n这个联合体 `shared` 可以用于创建联合体实例，该实例可以容纳字符值\
  \ `c` 或整数值 `i`。这是因为联合体成员共用内存空间。图 11.7 展示 `shared` 在内存中的情况。\n\n```c\nunion shared\n\
  {\n    char c;\n    int i;\n};\n```\n\n这个联合体 `shared` 可以用于创建一个联合体实例，该实例可以容纳字符值 `c`\
  \ 或整数值 `i`。这是因为联合体成员共用内存空间。图 11.7 展示 `shared` 在内存中的情况。点击此处查看代码图像\n\n```c\nunion\
  \ shared\n{\n    char c;\n    int i;\n};\n\n```\n\nEnter the donor's first and last\
