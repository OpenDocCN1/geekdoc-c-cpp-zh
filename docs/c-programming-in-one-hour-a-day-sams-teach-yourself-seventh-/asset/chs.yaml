  ### 使用 strncat() 函数\n\n库函数 `strncat()` 同样执行字符串拼接，但它允许你指定源字符串中有多少字符被追加到目标字符串的末尾。其原型为\n\
  \n点击此处查看代码图像\n\n```\nchar *strncat(char *str1, const char *str2, size_t n);\n```\n\
  \n如果 `str2` 包含超过 `n` 个字符，则将前 `n` 个字符追加到 `str1` 的末尾。如果 `str2` 包含少于 `n` 个字符，则将 `str2`\
  \ 全部追加到 `str1` 的末尾。无论哪情况下，结果字符串末尾都会添加一个终止空字符。你必须为 `str1` 分配足够的空间来存放结果字符串。该函数返回指向\
  \ `str1` 的指针。列表 18.5 使用 `strncat()` 生成与列表 18.4 相同的输出。\n\n输入 ![Image](img/down-arrow.jpg)\n\
  \n**列表 18.5** stringcat2.c: 使用 `strncat()` 函数拼接字符串\n\n点击此处查看代码图像\n\n* * *\n\n```c\n\
