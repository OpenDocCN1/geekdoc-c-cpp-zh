  \ %f, %f, and %f\\n.\",\n18: f1, f2, f3, f4, f5);\n20: fclose(fp);\n21: return(0);\n\
  22: }\n```\n\n* *\n\n输出 ![Image](img/down-arrow.jpg)\n\n点击此处查看代码图像\n\n* *\n\n值为\
  \ 123.449997, 87.000999, 100.019997, 0.004560, 和 1.000500\n\n* *\n\n### 注意\n\n数值的精度可能会导致某些数字的显示值与你输入的精确值不一致。例如，`100.02`\
  \ 可能会显示为 `10.01999`。\n\n* *\n\n### 分析 ![Image](img/down-arrow.jpg)\n\n* *\n\n该程序从你创建的文件读取五个值，并将它们显示在屏幕上。第\
  \ 10 行的 `fopen()` 调用以读取模式打开文件。它还会检查文件是否正确打开。如果文件没有打开，第 12 行会显示错误消息，程序退出（第 13 行）。第\
  \ 16 行演示了 `fscanf()` 函数的使用。除了第一个参数外，`fscanf()` 与你整本书中一直在使用的 `scanf()` 相同。第一个参数指向你想让程序读取的文件。你可以对\
  \ `fscanf()` 进行进一步的实验，通过你的编程编辑器创建输入文件，并观察 `fscanf()` 如何读取数据。\n\n#### 字符输入与输出\n\n\
  当与磁盘文件一起使用时，“字符 I/O”（character I/O）一语指的是单个字符以及字符行。记住，一行是一个由换行符终止的零或多个字符的序列。对于文本模式文件，请使用字符\
  \ I/O。接下来的章节描述了字符 I/O 函数，然后你将看到一个演示程序。\n\n##### 字符输入\n\n有三个字符输入函数用于从文件读取：`getc()`\
  \ 和 `fgetc()` 用于单个字符，`fgets()` 用于行。\n\n###### getc() 和 fgetc() 函数\n\n`getc()` 和\
  \ `fgetc()` 函数是相同的，可以互换使用。它们从指定的流中输入单个字符。以下是 `getc()` 的原型声明，它位于 `stdio.h` 中：\n\n\
  ```c\nint getc(FILE *fp);\n```\n\n参数 `fp` 是文件打开时由 `fopen()` 返回的指针。该函数返回输入的字符，或者发生错误时返回\
  \ `EOF`。\n\n你已经在早的程序中见过 `getc()` 用于从键盘输入字符。这是 C 语言流灵活性的另一个例子——同一个函数可以用于键盘输入或文件输入。\n\
  \n如果 `getc()` 和 `fgetc()` 返回的是单个字符，为什么它们的原型声明为返回 `int` 类型呢？原因是，在读取文件时，你需要读取文件结束标记（EOF），该标记在某些系统上不是\
  \ `char` 类型，而是 `int` 类型。你可以在稍后在列表 17.10 中看到 `getc()` 的用法。\n\n* *\n\n### 注意\n\n`getchar()`\
  \ 函数也用于读取字符。然而，它是从 `stdin` 流而不是你指定的读取读取的。\n\n* *\n\n###### fgets() 函数\n\n要从文件中读取行字符，请使用\
  \ `fgets()` 库函数。其原型为：\n\n点击此处查看代码图像\n\n```c\nchar *fgets(char *str, int n, FILE\
  \ *fp);\n```\n\n参数 `str` 是指向缓冲区的指针，输入将存储在其中。`n` 是允许输入的字符数。`fp` 是文件打开时由 `fopen()`\
  \ 返回的 `FILE` 类型指针。\n\n当调用 `fgets()` 时，它从 `fp` 读取字符到内存中，从 `str` 指向的位置开始。持续读取字符直到遇到换行符或读取了\
  \ `n-1` 个字符为止，以先者为准。通过将 `n` 设置为为缓冲区 `str` 分配的字节数，可以防止输入覆盖分配空间之外的内存。（`n-1` 是为了给 `fgets()`\
  \ 在字符串末尾添加的终止符 `\\0` 留出空间。）如果成功，`fgets()` 返回 `str`。可能会发生两种错误，如返回值 `NULL` 所示：\n\n\
  ![Image](img/squf.jpg) 如果在分配任何字符之前遇到读取错误或 `EOF`，`fgets()` 返回 `NULL`。\n\n##### 字符输出\n\
  \n你需要了解几个输出函数：`putc()`、`fputc()`、`puts()` 和 `fputs()`。\n\n###### putc() 和 fputc()\
  \ 函数\n\n`putc()` 和 `fputc()` 函数向指定的流写入单个字符。`putc()` 在 `stdio.h` 中的原型为：\n\n```c\n\
  int putc(int ch, FILE *fp);\n```\n\n参数 `ch` 是要输出的字符，`fp` 是文件打开时由 `fopen()` 返回的指针。该函数返回写入的字符（如果成功），发生错误时返回\
  \ `EOF`。`fputc()` 在 `stdio.h` 中的原型为：\n\n```c\nint fputc(int ch, FILE *fp);\n```\n\
  \n* *\n\n### 注意\n\n`putchar()` 函数也用于写入字符。然而，它是从 `stdout` 流而不是你指定的流写入的。\n\n* *\n\n\
  ###### fputs() 函数\n\n要向流写入行字符，请使用库函数 `fputs()`。该函数的工作原理与第 14 节中的 `puts()` 相似。不同在于在使用\
  \ `fputs()` 时，你可以指定输出流。此外，`fputs()` 不会在字符串末尾添加换行符；如果你需要，必须显式包含。它的原型为：\n\n```c\n\
  int fputs(char *str, FILE *fp);\n```\n\n参数 `str` 是指向要写入的空终止字符串的指针，`fp` 是文件打开时由 `fopen()`\
  \ 返回的 `FILE` 指。指向 `str` 的字符串被写入文件，但不包括终止符 `\\0`。成功时返回负值，错误时返回负值。\n\n#### 直接文件输入与输出\n\
  \n当你保存数据以便以后由相同或不同的 C 程序读取时，通常使用直接文件 I/O。直接 I/O 仅用于二进制模式文件。在直接输出中，数据块从内存写入磁盘。直接输入则反之：数据块从磁盘文件读取到内存中。例如，单个直接输出函数调用可以将整个\
  \ `double` 类型的数组写入磁盘，而单个直接输入函数调用可以将整个数组从磁盘读回内存。直接 I/O 函数是 `fread()` 和 `fwrite()`。\n\
  \n##### fwrite() 函数\n\n`fwrite()` 库函数将内存中的数据块写入二进制模式文件。它在 `stdio.h` 中的原型为：\n\n```c\n\
  int fwrite(void *buf, int size, int count, FILE *fp);\n```\n\n参数 `buf` 是指向要写入文件的数据的内存区域的指针。该指针类型为\
  \ `void`；它可以指向任何类型。\n\n\n\n\n\n参数 `size` 指定单个数据项的大小（以字节为单位），而 `count` 指定要写入的项数。例如，如果你想保存一个包含\
  \ 100 个元素的整数数组，那么 `size` 将为 `2`（因为每个 `int` 占用 2 个字节），而 `count` 将为 `100`（因为该数组包含\
  \ 100 个元素）。要获取 `size` 参数，可以使用 `sizeof()` 运算符。\n\n参数 `fp` 显然是指向 `FILE` 类型的指针，该指针是在文件打开时由\
  \ `fopen()` 返回的。`fwrite()` 函数（此处原文为 `fwrite()`）在成功时返回写入的项数；如果返回的值小于 `count`，则意味着发生了错误。为了检查错误，你通常按如下方式编写\
  \ `fwrite()`：\n\n点击此处查看代码图片\n\n```\nif( (fwrite(buf, size, count, fp)) != count)\n\
  \    fprintf(stderr, \"Error writing to file.\");\n```\n\n以下是使用 `fwrite()` 的一些示例。要向文件写入单个类型\
  \ `double` 变量 `x`，请使用如下：\n\n点击此处查看代码图片\n\n```\nfwrite(&x, sizeof(double), 1, fp);\n\
  ```\n\n要向文件写入包含 50 个 `address` 类型结构体的数组 `data[]`，你有两种选择：\n\n点击此处查看代码图片\n\n```\n\
  fwrite(data, sizeof(address), 50, fp);\nfwrite(data, sizeof(data), 1, fp);\n```\n\
  \n第一方法将数组作为 50 个元素写入，每个元素的大小为单个 `address` 结构体的大小。第二种方法将数组视为单个元素。这两种方法的效果完全相同。\n\n\
  下一节将解释 `fread()`，然后展示一个演示 `fread()` 和 `fwrite()` 的程序。\n\n### `fread()` 函数\n\n`fread()`\
  \ 库函数从二进制模式文件读取块数据到内存中。它在 `stdio.h` 中的原型为：\n\n点击此处查看代码图片\n\n```\nint fread(void\
  \ *buf, int size, int count, FILE *fp);\n```\n\n参数 `buf` 是指向接收从文件中读取数据的内存区域的指针。与\
  \ `fwrite()` 一样，指针类型为 `void`。\n\n参数 `size` 指定正在读取的单个数据项的大小（字节为单位），`count` 指定要读取的项数。注意这些参数是如何与\
  \ `fwrite()` 使用的参数对应的。同样，通常使用 `sizeof()` 运算符来提供 `size` 参数。参数 `fp`（一如既往）是指向 `FILE`\
  \ 类型的指针，是在文件打开时由 `fopen()` 返回的。`fread()` 函数返回读取的项数；如果到达文件末尾或发生错误，该值可能小于 `count`。\n\
  \n列表 17.4 展示了 `fwrite()` 和 `fread()` 的用法。\n\n输入 ![Image](img/down-arrow.jpg)\n\n\
  **列表 17.4** direct.c: 使用 `fwrite()` 和 `fread()` 进行直接文件访问\n\n点击此处查看代码图片\n\n***\n\n\
  ```\n1:    // direct.c--使用 fwrite() 和 fread() 进行直接文件 I/O。\n2:    #include <stdlib.h>\n\
  3:    #include <stdio.h>\n4:\n5:    #define SIZE 20\n6:\n7:    int main( void )\n\
  8:    {\n9:        int count, array1[SIZE], array2[SIZE];\n10:       FILE *fp;\n\
  11:\n12:      /* 初始化 array1[]. */\n13:\n14:      for (count = 0; count < SIZE; count++)\n\
  15:           array1[count] = 2 * count;\n16:\n17:      /* 打开二进制模式文件。 */\n18:\n\
  19:      if ( (fp = fopen(\"direct.txt\", \"wb\")) == NULL)\n20:      {\n21:   \
  \        fprintf(stderr, \"Error opening file.\");\n22:           exit(1);\n23:\
  \      }\n24:      /* 将 array1[] 保存到文件。 */\n25:\n26:      if (fwrite(array1, sizeof(int),\
  \ SIZE, fp) != SIZE)\n27:      {\n28:           fprintf(stderr, \"Error writing\
  \ to file.\");\n29:           exit(1);\n30:      }\n31:\n32:      fclose(fp);\n\
  33:\n34:      /* 现在以二进制模式打开同一个文件进行读取。 */\n35:\n36:      if ( (fp = fopen(\"direct.txt\"\
  , \"rb\")) == NULL)\n37:      {\n38:           fprintf(stderr, \"Error opening file.\"\
  );\n39:           exit(1);\n40:      }\n41:\n42:      /*将数据读取到 array2[]. */\n43:\n\
  44:      if (fread(array2, sizeof(int), SIZE, fp) != SIZE)\n45:      {\n46:    \
  \       fprintf(stderr, \"Error reading file.\");\n47:           exit(1);\n48: \
  \     }\n49:\n50:      fclose(fp);\n51:\n52:      /* 现在显示两个数组以证明它们是相同的。 */\n53:\n\
  54:      for (count = 0; count < SIZE; count++)\n55:           printf(\"%d\\t%d\\\
  n\", array1[count], array2[count]);\n56:      return(0);\n57:    }\n```\n\n\n\n\
  与文件流关联的缓冲区充当流（面向字符的）与磁盘硬件（面向块的）之间的接口。当你的程序向流写入数据时，这些数据会被保存在缓冲区中，直到缓冲区被填满，然后缓冲区的整个内容将作为一个块写入磁盘。从磁盘文件读取数据时，也会发生类似的过程。缓冲区的创建和操作由操作系统处理，并且是完全自动的；你不需要担心它。（C\
  \ 语言确实提供了一些用于缓冲区操作的函数，但它们超出了本书的讨论范围。）\n\n在实际操作中，这种缓冲区操作意味着，在程序执行期间，你的程序写入磁盘的数据可能仍然在缓冲区中，而不是在磁盘上。如果你的程序挂起、发生断电或出现其他问题，留在缓冲区中的数据可能会丢失，你将不知道磁盘文件中包含什么内容。\n\
  \n你可以通过 `fflush()` 或 `flushall()` 库函数在不关闭流的情况下刷新流的缓冲区。当你想在继续使用该文件的同时将文件的缓冲区写入磁盘时，请使用\
  \ `fflush()`。使用 `flushall()` 刷新所有打开流的缓冲区。这两个函数的原型如下：\n\n```\nint fflush(FILE *fp);\n\
  int flushall(void);\n```\n\n参数 `fp` 是打开文件时 `fopen()` 返回的 `FILE` 指针。如果文件是以写模式打开的，`fflush()`\
  \ 将其缓冲区写入磁盘。如果文件是以读模式打开的，缓冲区将被清除。函数 `fflush()` 成功时返回 `0`，发生错误时返回 `EOF`。函数 `flushall()`\
  \ 返回打开流的数量。\n\n***\n\n## 应当 (Do)\n\n**应当**在尝试读写文件之前先打开它。\n\n**应当**在 `fwrite()` 和\
  \ `fread()` 函数配合配合 `sizeof()` 运算符。\n\n**应当**关闭所有你已打开的文件。\n\n***\n\n## 避免 (Don’t)\n\
  \n**不要**假设文件访问是安全的。在执行读、写或打开操作后，始终要检查以确保函数正常工作。\n\n**不要**除非你有关闭所有流的理由，否则不要使用 `fcloseall()`。\n\
  \n***\n\n### 理解顺序访问与随机文件访问\n\n每个打开的文件都关联有一个文件位置指示器。该指示器指定了读和写操作在文件中发生的位置。位置始终以距离文件开头的字节数给出。当打开一个新文件时，位置指示器始终位于文件开头，位置\
  \ 0。（因为文件是新的且长度为 0，所以没有其他位置可以指示。）当打开一个现有文件时，如果是以追加模式打开，则位置指示器位于文件末尾；如果是以任何其他模式打开，则位置指示器位于文件开头。\n\
  \n本节之前介绍的文件 I/O 函数使用了该位置指示器，尽管这些操作是在后台完成的。写和读操作发生在位置指示器所在的位置，并同时更新位置指示器。例如，如果你打开一个文件进行读取，并读取了\
  \ 10 个字节，你就输入了文件中的前 10 个字节（位置 0 到 9 的字节）。读取操作后，位置指示器位于位置 10，下一次读取操作将从那里开始。因此，如果你想顺序读取文件中的所有数据或顺序向文件写入数据，你就不需要担心位置指示器。流\
  \ I/O 函数会自动处理它。\n\n当你需要更多控制时，请使用 C 库函数，这些函数允许你确定并更改文件位置指示器的值。通过控制位置指示器，你可以实现随机文件访问。在这里，*随机*意味着你可以从文件的任何位置读取数据或向该位置写入数据，而无需读取或写入之前所有的数据。\n\
  \n#### ftell() 和 rewind() 函数\n\n要将位置指示器设置为文件开头，请使用库函数 `rewind()`。它的原型在 `stdio.h`\
  \ 中：\n\n```\nvoid rewind(FILE *fp);\n```\n\n参数 `fp` 是与流关联的 `FILE` 指针。调用 `rewind()`\
  \ 后，文件的位置指示器被设置为文件开头（第 0 字节）。如果你从文件中读取了一些数据，并想在不关闭并重新打开文件的情况下从头开始读取，请使用 `rewind()`。\n\
  \n要确定文件位置指示器的值，请使用 `ftell()`。该函数的原型位于 `stdio.h`：\n\n```\nlong ftell(FILE *fp);\n\
  ```\n\n参数 `fp` 是打开文件时 `fopen()` 返回的 `FILE` 指针。函数 `ftell()` 返回一个 `long` 类型，表示当前文件距离开头的字节数。（第一个字节位于位置\
  \ 0。）如果发生错误，`ftell()` 返回 `-1L`（类型 `long -1`）。\n\n为了感受 `rewind()` 和 `ftell()` 的操作，请查看列表\
  \ 17.5。\n\n输入 ![Image](img/down-arrow.jpg)\n\n**列表 17.5** fileposition.c: 使用 `ftell()`\
  \ 和 `rewind()`\n\n点击此处查看代码图像\n\n***\n\n```c\n// fileposition.c--演示了 ftell() 和 rewind().\n\
  #include <stdlib.h>\n#include <stdio.h>\n\n#define BUFLEN 6\n\nchar msg[] = \"abcdefghijklmnopqrstuvwxyz\"\
  ;\n\nint main( ) {\n    FILE *fp;\n    char buf[BUFLEN];\n\n    if (fp = fopen(\"\
  fileposition.txt\", \"w\")) == NULL) {\n        fprintf(stderr, \"打开文件错误.\");\n\
  \        exit(1);\n    }\n\n    if (fputs(msg, fp) == EOF) {\n        fprintf(stderr,\
  \ \"写入文件错误.\");\n        exit(1);\n    }\n\n    fclose(fp);\n\n    // 现在以读模式打开文件。\n\
  \    if (fp = fopen(\"file position.txt\", \"r\")) == NULL) {\n        fprintf(stderr,\
  \ \"打开文件错误.\");\n        exit(1);\n    }\n    printf(\"\\n 打开打开后，位置 = %ld\", ftell(fp));\n\
  \n    // 读取 5 个字节。\n    fgets(buf, BUFLEN, fp);\n    printf(\"\\n 读取 %s 后，位置 = %ld\"\
  , buf, ftell(fp));\n\n    // 读取下一个 5 个字节。\n    fgets(buf, BUFLEN, fp);\n    printf(\"\
  \\n 下一个 5 个字节是 %s，现在位置 = %ld\", buf, ftell(fp));\n\n    // 回置流。\n    rewind(fp);\n\
  \    printf(\"\\n\\n 回置后，位置回到了 %ld\", ftell(fp));\n\n    //再次读取 5 个字节。\n    fgets(buf,\
  \ BUFLEN, fp);\n    printf(\"\\n 从头开始读取：%s\\n\", buf);\n    fclose(fp);\n    return(0);\n\
  }\n```\n\n***\n\n输出 ![Image](img/down-arrow.jpg)\n\n点击此处查看代码图像\n\n***\n\n打开打开后，位置\
  \ = 0\n读取 abcde 后，位置 = 5\n下一个 5 个字节是 fghij，现在位置 = 10\n回置后，位置回到了 0\n从头开始读取：abcde\n\
  \n分析 ![Image](img/down-arrow.jpg)\n\n***\n\n此程序向名为 `file position.txt` 的文件写入字符串\
  \ `msg`。消息包含字母表中的 26 个字母，按顺序排列。第 14 到 18 行以写模式打开 `file position.txt` 并测试是否成功打开。第\
  \ 20 到 24 行使用 `fputs()` 将 `msg` 写入文件并检查写入是否成功。第 26 行使用 `fclose()` 关闭文件，完成了程序其他部分可以使用文件的创建。\n\
  \n\n\n第 30 到 34 行再次打开了文件，但这次是为了读取。第 35 行打印了 `ftell()` 的返回值。请注意，此位置位于文件的开头。第 39 行执行了\
  \ `fgets()` 并读取了五个字符。第 40 行打印了这五个字符和新的文件位置。注意，`ftell()` 返回了正确的偏移量。第 50 行调用 `rewind()`\
  \ 将指针移回文件开头，随后在第 52 行再次打印了文件位置。这应该能向你确认 `rewind()` 重置了位置。第 57 行的额外读取操作进一步证实了程序确实已经回到了文件开头。第\
  \ 59 行在程序结束前关闭了文件。\n\n### fseek() 函数\n\n通过库函数 `fseek()`，可以对流的位置指示器进行更精确的控制。通过使用\
  \ `fseek()`，你可以将位置指示器设置到文件中的任何位置。该函数在 `stdio.h` 中的原型定义如下：\n\n点击此处查看代码图片\n\n```\n\
  int fseek(FILE *fp, long offset, int origin);\n```\n\n参数 `fp` 是与文件相关的 `FILE` 指针。位置指示器需要移动的距离由字节数\
  \ `offset` 表示。参数 `origin` 指定了移动的相对起始点。`origin` 有三个可能的值，其符号常量定义在 `io.h` 中，如 表 17.2\
  \ 所示。\n\n![Image](img/17tab02.jpg)\n\n**表 17.2** `fseek()` 可能的 Origin 值\n\n如果指示器移动成功，函数\
  \ `fseek()` 返回 `0`；如果发生错误，则返回非零。列表 17.6 使用 `fseek()` 进行文件的随机访问。\n\n输入 ![Image](img/down-arrow.jpg)\n\
  \n**列表 17.6** randomfile.c：使用 `fseek()` 进行随机文件访问\n\n点击此处查看代码图片\n\n```\n1:  /* randomfile.c--Random\
  \ access with fseek(). */\n2:\n3:  #include <stdlib.h>\n4:  #include <stdio.h>\n\
  5:\n6:  #define MAX 50\n7:\n8:  int main( void )\n9:  {\n10:      FILE *fp;\n11:\
  \      int data, count, array[MAX];\n12:      long offset;\n13:\n14:      /* Initialize\
  \ the array. */\n15:\n16:      for (count = 0; count < MAX; count++)\n17:      \
  \    array[count] = count * 10;\n18:\n19:      /* Open a binary file for writing.\
  \ */\n20:\n21:      if ( (fp = fopen(\"RANDOM.DAT\", \"wb\")) == NULL)\n22:    \
  \  {\n23:          fprintf(stderr, \"\\nError opening file.\");\n24:          exit(1);\n\
