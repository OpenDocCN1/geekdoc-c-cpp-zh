  \n### 总结\n\n\n\n\n\n本节向你介绍了指针，这是 C 编程中的核心部分。指针是一个存储另一个变量地址的变量；指针被称为“指向”它所持有的地址的变量。使用指针时需要的两个运算符是取地址操作符（`&`）和间接操作符（`*`）。当将取地址操作符放在变量名之前时，它返回变量的地址。当将间接操作符放在指针名之前时，它返回所指向的变量的内容。\n\
  \n指针和数组之间存在着特殊的关系。不带括号的数组名是指向该数组第一个元素的指针。指针算术的特殊特性使得使用指针访问数组元素变得非常简单。数组下标表示法实际上是指针表示法的一种特殊形式。\n\
  \n你还学习了如何通过传递数组的指针将数组作为参数传递给函数。当函数知道数组的地址和长度时，它可以使用指针表示法或下标表示法访问数组元素。\n\n### 问答\n\
  \n**问 为什么指针在 C 语言中如此重要？**\n\n**答** 指针让你对计算机和数据有更多的控制权。与函数配合使用时，指针允许你修改传递的变量的值，无论这些变量源何处。在第\
  \ 15 节和第 16 节“函数指针和链表”中，你将学习到指针的额外用途。\n\n**问 编译器如何区分用于乘法、取值和声明指针的星号？**\n\n**答**\
  \ 编译器根据星号 `*` 使用所处的上下文来解释其不同的用途。如果正在评估的语句以变量类型开头，则可以假定 `*` 是用于声明指针的。如果 `*` 用于已声明为指针的变量，但不在变量声明中，则假设\
  \ `*` 是用于间接引用（取值）。如果它用于数学表达式，但不是与指针变量一起使用，则 `*` 可以被认为是乘法操作符。\n\n**问 如果我对指针使用取地址操作符会发生什么？**\n\
  \n**答** 你将得到指针变量地址。记住，指针只是另一个存储它所指向的变量地址的变量。\n\n**问 变量总是存储在相同的位置吗？**\n\n**答** 不。程序每次运行时，其变量都可能存储在计算机内部的不同地址上。你不永远应该给指针分配一个常量地址值。\n\
