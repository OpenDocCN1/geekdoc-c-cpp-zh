  \n5. 独立完成：修改上一个练习中的程序，允许用户指定排序是升序还是降序。\n\n## 第 17 own：使用磁盘文件\n\n你编写的大多数程序都使用写入硬盘驱动的文件。这些文件包含用于各种目的的信息：数据存储、配置信息等。在本节中，你将学习：\n\
  \n- 如何将流与磁盘文件关联\n- 关于 C 的两种磁盘文件类型\n- 打开文件的命令\n- 如何向文件写入数据\n- 从文件中读取数据\n- 何时关闭文件\n\
  - 磁盘文件管理\n- 使用临时文件\n\n### 将流与磁盘文件关联\n\n正如你在 `ch14.xhtml_ch14` 中学习的“与屏幕、打印机和键盘交互”，C\
  \ 通过流来执行所有的输入输出，包括磁盘文件。你已经看到过如何使用连接到键盘等特定设备的 C 预定义流。磁盘文件管理涉及处理这些文件，而使用临时文件是另一种实用的技术。\n\
  \n### 理解磁盘文件的类型\n\n正如你在 `ch14.xhtml_ch14` 中学习的，C 流有两种类型：文本和二进制。你必须理解这种区别，以便使用正确的模式。文本流与文本模式文件关联。文本模式文件由行组成。每行以一个或多个字符结束。重要的是记住，“行”不等同于\
  \ C 字符串；它没有 `NULL` 字符。在 Windows 中，它是回车换行符（CR-LF）组合。\n\n二进制流与二进制模式文件关联。任何所有数据在写入和读取时都保持不变，不分行，也不使用行结束字符。\
  \ \n\n\n\n某些文件 I/O 函数局限于一种模式，而另一些函数可以使用任意模式。本节将教你会在哪些函数上使用何种模式。\n\n### 使用文件名\n\n\
  每个磁盘文件都有一个名称，处理磁盘文件时必须使用文件名。文件名以字符串形式存储，就像其他文本数据一样。建立文件名可接受内容的规则在不同的操作系统之间有所不同。\n\
  \nC 程序中的文件名也可以包含路径信息。路径指定了文件所在的驱动器和/或目录（或文件夹）。如果你指定了一个没有路径的文件名，将假设该文件位于操作系统当前指定的默认位置。良好的编程习惯是始终在文件名中指定路径信息。\n\
  \n\n\n\n\n点击此处查看代码图像\n\n```c\nchar *filename = \"c:\\\\data\\\\list.txt\";\n```\n\
  \n然而，当在运行程序时，如果你使用键盘输入文件名，只需输入单个反斜杠即可。\n\n并不是所有系统都使用反斜杠作为目录分隔符。例如，UNIX 使用正斜杠（`/`）。\n\
  \n### 打开文件\n\n创建一个与磁盘文件关联的流的过程被称为`打开文件`。当你打开一个一个文件时，该文件就可以用于读取（意味着数据从文件输入到程序）、写入（意味着将程序中的数据保存到文件中）或二者兼之。当你完成对该文件的操作后，必须将其关闭。关闭文件将在本节的稍后部分介绍。\n\
  \n要打开文件，你使用 `fopen()` 库函数。`fopen()` 的原型定义位于 `stdio.h` 中，读取如下：\n\n点击此处查看代码图像\n\n\
  ```c\nFILE *fopen(const char *filename, const char *mode);\n```\n\n该原型告诉你 `fopen()`\
  \ 返回一个类型为 `FILE` 的指针，它是 `stdio.h` 中声明的一个结构体。`FILE` 结构体的成员被程序在各种文件访问操作中使用，但你不需要担心它们。然而，对于每个你想打开的文件，你必须声明一个类型为\
  \ `FILE` 的指针。当你调用 `fopen()` 时，该函数会创建一个 `FILE` 结构体的实例并返回指向该结构的指针。你在对文件的所有后续操作中都会使用此指针。如果\
  \ `fopen()` 失败，它将返回 `NULL`。这种失败可能是由硬件错误引起，例如尝试打开一个未连接的闪存驱动器上的文件。\n\n参数 `filename`\
  \ 是要打开的文件名。如前所述，`filename` 可以并且应该包含路径规范。`filename` 参数可以是一个用双引号括的字面量字符串，也可以是指指向字符串变量的指针。\n\
  \n参数 `mode` 指定打开文件的模式。在此上下文中，`mode` 控制文件是二进制格式还是文本格式，以及是读取、写入还是二者兼之。`mode` 的允许值列在\
  \ 表 17.1 中。\n\n![Image](img/17tab01.jpg)\n\n**表 17.1** `fopen()` 函数的 mode 值\n\n\
  默认文件模式是文本模式。要以二进制模式打开文件，你可以在 `mode` 参数后追加一个 `b`。因此，`mode` 参数为 `a` 将以文本模式打开文件进行追加，而\
  \ `ab` 则将以二进制模式打开文件进行追加。\n\n请记住，如果发生错误，`fopen()` 会返回 `NULL`。导致返回值为 `NULL` 的错误情况包括：\n\
  \n![Image](img/squf.jpg) 使用了无效的文件名。\n\n![Image](img/squf.jpg) 尝试在未就绪的磁盘上打开文件。（例如，驱动器门未关闭或磁盘未格式化。）\n\
  \n![Image](img/squf.jpg) 尝试在不存在的目录或不存在的磁盘驱动器上打开文件。\n\n![Image](img/squf.jpg) 尝试以\
  \ `r` 模式打开一个不存在的文件。\n\n每当你使用 `fopen()` 时，你都需要测试是否发生了错误。目前还没有准确判断具体发生了哪种错误，但你可以向用户显示一条消息并尝试重新打开文件，或者结束程序。大多数\
  \ C 编译器都包含非 ANSI 扩展，允许你获取有关错误性质的信息；相关信息请参考你的编译器文档。\n\n列表 17.1 展示了 `fopen()`。\n\n\
  输入 ![Image](img/down-arrow.jpg)\n\n**列表 17.1** openfiles.c: 使用 `fopen()` 以各种模式打开磁盘文件\n\
  \n点击此处查看代码图像\n\n```c\n1:  // openfiles.c--演示了 fopen() 函数。\n2:  #include <stdlib.h>\n\
  3:  #include <stdio.h>\n4:\n5:  int main( void )\n6:  {\n7:      FILE *fp;\n8: \
  \     char ch, filename[40], mode[4];\n9:\n10:      while (1)\n11:      {\n12:\n\
  13:          // 输入文件名和模式。\n14:\n15:          puts(\"\\nEnter a filename: \");\n\
  16:          gets(filename);\n17:          puts(\"\\nEnter a mode (max 3 characters):\
  \ \");\n18:          gets(mode);\n19:\n20:          // 尝试打开文件。\n21:\n22:       \
  \   if ( (fp = fopen( filename, mode )) != NULL )\n23:          {\n24:         \
  \     printf(\"\\nSuccessful %s in mode %s.\\n\",\n25:              filename, mode);\n\
  26:              fclose(fp);\n27:              puts(\"Enter x to exit, any other\
  \ to continue.\");\n28:              if ( (ch = getc(stdin)) == 'x')\n29:      \
  \        break;\n30:          else\n31:              continue;\n32:      }\n33:\
  \      else\n34:      {\n35:          fprintf(stderr, \"\\nError opening %s in mode\
  \ %s.\\n\",\n36:          filename, mode);\n37:          puts(\"Enter x to exit,\
  \ any other to try again.\");\n38:          if ( (ch = getc(stdin)) == 'x')\n39:\
  \              break;\n40:          else\n41:              continue;\n42:      }\n\
  43:  }\n44:  return 0;\n45: }\n```\n\n输出 ![Image](img/down-arrow.jpg)\n\n```text\n\
  Enter a filename: file.txt\nEnter a mode (max 3 characters): a+\nSuccessful file.txt\
  \ in mode a+.\nEnter x to exit, any other to continue.\nEnter a filename: file.txt\n\
  Enter a mode (max 3 characters): w\nSuccessful file.txt in mode w.\nEnter x to exit,\
  \ any other to continue.\nEnter a filename: file.txt\nEnter a mode (max 3 characters):\
  \ r\nError opening file.txt in mode r.\nEnter x to exit, any other to try again.\n\
  x\n```\n\n分析 ![Image](img/down-arrow.jpg)\n\n该程序在第 15 到 18 行提示输入文件名和模式。获取名称后，第 22\
  \ 行尝试打开文件并将指针赋值给 `fp`。作为良好的编程示例，第 22 行的 `if` 语句检查指针是否不等于 `NULL`。如果 `fp` 不等于 `NULL`，则打印一条消息表示打开成功，用户可以继续。如果文件指针为\
  \ `NULL`，则执行 `else` 条件。第 33 到 42 行的 `else` 条件打印一条消息说明出现了问题，然后提示用户决定程序是否继续。\n\n你可以尝试不同的文件名和模式，看看哪些会产生错误。在上面的输出中，你可以看到尝试以\
  \ `r` 模式打开 `file.txt` 导致了错误，因为该文件在磁盘上不存在。如果发生错误，你可以重新输入信息或退出程序。\n\n 读写文件数据\n\n使用磁盘文件的程序可以向文件写入数据、从文件读取数据，或二者的结合。你可以通过三种方式向磁盘写入数据：\n\
  \n![Image](img/squf.jpg) 你可以使用格式化输出将格式化数据保存到文件中。你应该只将格式化输出用于文本模式文件。格式化输出的主要用途是创建包含文本和数值数据的文件，供电子表格或数据库等程序读取。你很少、甚至不使用格式化输出来创建一个以后由\
  \ C 程序再次读取的文件。\n\n![Image](img/squf.jpg) 你可以使用字符输出将单个字符或字符行保存到文件中。虽然在技术上可以在二进制模式文件使用字符输出，但这可能很复杂。你应该将字符模式输出限制在文本文件中。字符输出的主要用途是保存文本（而非数值）数据，以便供\
  \ C 语言以及其他程序（如文字处理器）读取。\n\n\n\n\n\n![Image](img/squf.jpg) 你可以使用直接输出将内存中的部分内容直接保存到磁盘文件中。这种方法仅适用于二进制文件。直接输出是\
  \ C 程序保存数据以供以后使用的最佳方法。\n\n当你想要从文件中读取数据时，你有同样的三种选择：格式化输入、字符输入或直接输入。你在特定情况下使用的输入类型几乎完全取决于所读文件的性质。通常情况下，你会按照保存数据时使用的相同模式来读取数据，但这并不是强制性要求。然而，以不同于写入时的模式来读取文件，需要你对\
  \ C 语言和文件格式有详尽的了解。\n\n之前对三种类型文件输入和输出的描述暗示了每种输出类型最适合的任务。这绝不是一套 set 严格的规则。C 语言是灵活的（这是它的优点之一！），因此一个聪明的程序员可以使任何类型的文件输出适应几乎任何需求。作为一名初级程序员，如果你在最初阶段遵循这些指南，可能会发现更容易一些。\n\
  \n## 格式化文件输入与输出\n\n格式化文件 I/O 处理以特定方式格式化的文本和数值数据。它与使用 `printf()` 和 `scanf()` 函数进行的格式化键盘输入和屏幕输出直接类比，正如第\
  \ 14 节 中描述的那。先讨论格式化输出，然后是输入。\n\n### 格式化文件输出\n\n格式化文件输出通过库函数 `fprintf()` 完成。`fprintf()`\
  \ 的原型在头文件 `stdio.h` 中，其读取如下：\n\n```c\nint fprintf(FILE *fp, char *fmt, ...);\n```\n\
  \n第一个参数是一个指向 `FILE` 类型的指针。要向特定的磁盘文件写入数据，你需要传递通过 `fopen()` 打开文件时返回的指针。\n\n第二个参数是格式字符串。你在第\
  \ 14 节 关于 `printf()` 的讨论中已经学习过格式字符串。`fprintf()` 使用的格式字符串遵循与 `printf()` 完全相同的规则。详情请参阅第\
  \ 14 节。\n\n最后一个参数是 `...`。这意味着什么？在函数原型中，省略号表示可变数量的参数。换句话说，除了文件指针和格式字符串参数外，`fprintf()`\
  \ 接收零、一个或多个额外的参数。这和 `printf()` 一样。这些参数是要输出到指定流的变量名称。\n\n记住，`fprintf()` 的工作方式与 `printf()`\
  \ 相同，只是它将输出发送到参数列表中指定的流中。事实上，如果你指定的流参数为 `stdout`，则 `fprintf()` 与 `printf()` 完全相同。\n\
  \nListing 17.2 展示了 `fprintf()` 的用法。\n\n输入 ![Image](img/down-arrow.jpg)\n\n**列表 17.2**\
  \ numberfile.c: `fprintf()` 格式化输出对文件和对 `stdout` 的等效性\n\n```c\n1:  // numberfile.c--演示了\
  \ fprintf() 函数。\n2:  #include <stdlib.h>\n3:  #include <stdio.h>\n4:\n5:  void clear_kb(void);\n\
  6:\n7:  int main( void )\n8:  {\n9:      FILE *fp;\n10:     float data[5];\n11:\
