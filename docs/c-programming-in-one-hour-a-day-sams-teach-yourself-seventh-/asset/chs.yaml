  \ 22 行退出；否则，在第 24 行执行 `strncmp()`，并在第 26 行打印结果。\n\n### 字符串搜索\n\nC 库包含许多搜索字符串的函数。换句话说，这些函数确定一个字符串是否出现在另一个字符串中，如果是，出现在哪里。你可以从六个字符串搜索函数中选择，它们都需要头文件\
  \ `string.h`：\n\n![Image](img/squf.jpg) `strchr()`\n\n![Image](img/squf.jpg) `strrchr()`\n\
  \n![Image](img/squf.jpg) `strcspn()`\n\n![Image](img/squf.jpg) `strspn()`\n\n![Image](img/squf.jpg)\
  \ `strpbrk()`\n\n![Image](img/squf.jpg) `strstr()`\n\n#### strchr() 函数\n\n`strchr()`\
  \ 函数在字符串中查找指定字符的首次出现位置。其原型如下\n\n点击此处查看代码图像\n\n```c\nchar *strchr(const char *str,\
  \ int ch);\n```\n\n函数 `strchr()` 从左到右搜索 `str`，直到找到字符 `ch` 或找到终止空字符。如果找到了 `ch`，则返回指向该字符的指针。如果没有找到，则返回\
  \ `NULL`。\n\n当 `strchr()` 找到字符时，它返回指向该字符的指针。已知 `str` 是指向字符串第一个字符的指针，你可以通过从 `strchr()`\
  \ 返回的指针值减去 `str` 来获取找到字符的位置。列表 18.8 说明了这一点。记住字符串中的第一个字符位于位置 `0`。像 C 的许多字符串函数一样，`strchr()`\
  \ 是区分大小写的，因此它报告在字符串 `\"raffle\"` 中未找到字符 `\"F\"`。\n\n输入 ![Image](img/down-arrow.jpg)\n\
  \n**列表 18.8** stringsearch1.c：使用 `strchr()` 在字符串中搜索单个字符\n\n点击此处查看代码图像\n\n* * *\n\
  \n```c\n1:  // string1.c--使用 strchr() 搜索单个字符\n2:\n3:  #include <stdio.h>\n4:  #include\
  \ <string.h>\n5:\n6:  int main( void )\n7:  {\n8:       char *loc, buf[80];\n9:\
  \       int ch;\n10:\n11:      // 输入字符串和字符。\n12:\n13:      printf(\"Enter the string\
  \ to be searched: \");\n14:      gets(buf);\n15:      printf(\"Enter the character\
  \ to search for: \");\n16:      ch = getchar();\n17:\n18:      // 执行搜索。\n19:\n20:\
  \      loc = strchr(buf, ch);\n21:\n22:      if ( loc == NULL )\n23:          printf(\"\
  The character %c was not found.\", ch);\n24:      else\n25:          printf(\"The\
  \ character %c was found at position %d.\\n\",\n26:                      ch, loc-buf);\n\
  27:      return(0);\n28: }\n```\n\n* * *\n\n输出 ![Image](img/down-arrow.jpg)\n\n\
  点击此处查看代码图像\n\n* * *\n\nEnter the string to be searched: raffle\nEnter the character\
  \ to search for: f\nThe character f was found at position 4.\n\n\n\n\n\n点击此处查看代码图像\n\
  \n```c\nsize_t strspn(const char *str1, const char *str2);\n```\n\n`strspn()` 函数搜索\
  \ `str1`，将其逐个字符地与 `str2` 中包含的字符进行比较。它返回 `str1` 中第一个与 `str2` 中的字符不匹配的字符的位置。换句话说，`strspn()`\
  \ 返回 `str1` 起段的长度，该段完全由 `str2` 中找到的字符组成。如果没有匹配的字符，则返回 `0`。列表 18.10 展示了 `strspn()`\
  \ 的用法。\n\n输入 ![Image](img/down-arrow.jpg)\n\n**列表 18.10** stringsearch3.c: 使用 `strspn()`\
  \ 查找第一个非匹配字符\n\n点击此处查看代码图像\n\n```c\n1:  /* 使用 strspn() 进行搜索。 */\n2:\n3:  #include\
  \ <stdio.h>\n4:  #include <string.h>\n5:\n6:  int main( void )\n7:  {\n8:      char\
