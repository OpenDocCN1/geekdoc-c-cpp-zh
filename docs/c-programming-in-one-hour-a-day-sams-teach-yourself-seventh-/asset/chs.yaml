  \ 不等于 `5`”为假，因此 `0` 被赋值给 `a`。\n\n重申，关系运算符用于创建关系表达式，对表达式之间的关系提问。关系表达式返回的数值 `1`（代表真）或\
  \ `0`（代表假）。\n\n#### 关系运算符的优先级\n\n与本节之前讨论的数学运算符一样，每个关系运算符都有优先级，这决定了它们在多运算符表达式中的执行顺序。同样，你可以使用括号来修改使用关系运算符的表达式中的优先级。\n\
  \n\n\n\n正如你可能猜到的那样，C 语言的逻辑运算符也有优先级顺序，包括在它们之间以及与其他运算符之间的关系。`!` 运算符的优先级与一元数学运算符 `++`\
  \ 和 `--` 相同。因此，`!` 的优先级高于所有的关系运算符和所有的二元数学运算符。\n\n相比之下，`&&` 和 `||` 运算符的优先级低得多，低于所有的数学和关系运算符，尽管\
  \ `&&` 的优先级高于 `||`。和 C 的所有运算符一样，在使用逻辑运算符时，你可以使用括号来修改求值顺序。考虑以下示例：\n\n你想编写一个逻辑表达式，使其进行三个独立的比较：\n\
  \n1. `a` 是否小于 `b`？\n2. `a` 是否小于 `c`？\n3. `c` 是否小于 `d`？\n\n你希望当条件 3 为真且条件 1 或条件 2\
  \ 其中之一为真时，整个逻辑表达式为真。你可能会写成\n\n`a < b || a < c && c < d`\n\n然而，这不会符合你的预期。因为 `&&`\
  \ 运算符的优先级高于 `||`，该表达式等同于\n\n`a < b || (a < c && c < d)`\n\n并且当 `(a < b)` 为真时，结果为真，无论关系\
  \ `(a < c)` 和 `(c < d)` 是否为真。你需要写成\n\n`(a < b || a < c) && c < d`\n\n这强制 `||` 在\
  \ `&&` 之前被求值。这在 列表 4.6 中显示，该列表评估了两种编写方式的表达式。变量设置使得如果编写正确，表达式的求值结果应为假（`0`）。\n\n输入\
  \ ![Image](img/down-arrow.jpg)\n\n**列表 4.6** LogicalOrder.c：逻辑运算符优先级\n\n点击此处查看代码图片\n\
  \n```\n1:   #include <stdio.h>\n2:\n3:    /* 初始化变量。注意 c 并不小于 d， */\n4:   /* 这是测试的条件之一。\
  \ */\n5:   /* 因此，整个表达式的求值结果应为假。 */\n6:\n7:    int a = 5, b = 6, c = 5, d = 1;\n\
  8:    int x;\n9:\n10:   int main( void )\n11:   {\n12:       /* 不带括号求值表达式 */\n13:\n\
  14:       x = a < b || a < c && c < d;\n15:       printf(\"\\nWithout parentheses\
  \ the expression evaluates as %d\", x);\n16:\n17:       /* 使用括号求值表达式 */\n18:\n19:\
  \       x = (a < b || a < c) && c < d;\n20:       printf(\"\\nWith parentheses the\
  \ expression evaluates as %d\\n\", x);\n21:       return 0;\n22:   }\n```\n\n输出\
  \ ![Image](img/down-arrow.jpg)\n点击此处查看代码图片\n\n不带括号时表达式的求值结果为 1\n带括号时表达式的求值结果为 0\n\
  \n分析 ![Image](img/down-arrow.jpg)\n\n输入并运行此列表。注意打印出的表达式两个值是不同的。此程序在第 7 行初始化了四个用于使用的变量。第\
  \ 8 行声明了 `x` 用于存储和打印结果。第 14 行和第 19 行使用了逻辑运算符。第 14 行没有使用括号，因此结果由运算符优先级决定。第 19 行使用括号改变了表达式的顺序。\n\
  \n### 复合赋值运算符\n\nC 的复合赋值运算符提供了将二元数学运算与赋值结合的快捷方法。例如，假设你想将 `x` 的值增加 5，换句话说，给 `x` 加\
  \ 5 并将结果赋给 `x`。你可以写\n\n`x = x + 5;`\n\n使用复合赋值运算符（你可以将其视为赋值的快捷方法），你会写\n\n`x += 5;`\n\
  \n在更通用的表示中，复合赋值运算符具有以下语法（其中 `op` 代表二元运算符）：\n\n`exp1 op= exp2`\n\n这等同于写\n\n`exp1\
  \ = exp1 op2;`\n\n你可以使用之前讨论过的二元数学运算符创建复合赋值运算符。表 4.10 列出了一些示例。\n\n![Image](img/04tab10.jpg)\n\
  \n**表 4.10** 复合赋值运算符示例\n\n复合运算符提供了方便的快捷方式，当赋值运算符左侧的变量名称很长，其优势尤为明显。与其他所有赋值语句一样，复合赋值语句是一个表达式，其求值结果为赋予左侧的值。因此，执行以下语句会导致\
  \ `x` 和 `z` 的值都变为 14：\n\n`x = 12;`\n`z += 2;`\n\n### 条件运算符\n\n条件运算符是 C 唯一的三元运算符，意味着它接受三个操作数。它的语法是\n\
  \n`exp1 ? exp2 : exp3;`\n\n如果 `exp1` 求值为真（即非零），整个表达式的求值结果为 `exp2` 的值。如果 `exp1` 求值为假（即为零），整个表达式的求值结果为\
  \ `exp3` 的值。例如，当 `y` 为真时，求值结果为 `x`；当 `y` 为假时，求值结果为 `100`：\n\n`x = y ? x : 100;`\n\
  \n可能你注意到条件运算符的功能有点像 `if` 语句。前述语句也可以写成：\n\n```\nif (x > y)\n    z = x;\nelse\n  \
  \  z = y;\n```\n\n条件运算符不能在所有情况下替代 `if...else` 结构，但它更简洁。条件运算符也可以用于使用 `if` 语句的地方，例如\
  \ `printf` 函数调用内部：\n\n点击此处查看代码图片\n\n```c\nprintf(\" The larger value is %d\", ((x\
  \ > y) ? x : y );\n``` 逗号运算符\n\n逗号在 C 中经常用作简单的标记，用于分隔变量声明、函数参数等。在某些情况下，逗号作为运算符而非简单的分隔符。你可以通过逗号分隔两个表达式来形成一个表达式。结果如下：\n\
  \n![Image](img/squf.jpg) 两个表达式都会求值，先求值左侧表达式。\n\n![Image](img/squf.jpg) 整个表达式的求值结果为右侧表达式的值。\n\
  \n例如，以下语句将 `b` 的值赋给 `x`，然后增加 `a`，最后增加 `b`：\n\n`x = (a++, b++);`\n\n由于 `++` 运算符采用后置模式，`b`\
  \ 的值在增加之前赋给 `x`。使用括号是必要的，因为逗号运算符的优先级低于赋值运算符。\n\n正如你在下一节将学的，逗号运算符最常见的用法是 `for` 语句。\n\
  \n**应该**使用逻辑运算符 `&&` 和 `||` 来代替嵌套 `if` 语句。\n\n**不要**将赋值运算符（`=`）与等于运算符（`==`）混淆。\n\
  \n### 重温运算符优先级\n\n表 4.11 按优先级递减顺序列出了 C 运算符。位于同一行的运算符具有相同的优先级。\n\n![Image](img/04tab11.jpg)\n\
  \n**表 4.11** C 运算符优先级\n\n在熟悉优先级顺序之前，这是一个可以经常参考的表。你可能会发现以后需要它。\n\n### 总结\n\n本节涵盖了大量内容。你学习了什么是\
  \ C 语句，了空白字符对 C 编译器不敏感，以及语句始终以分号结束。你还学习了复合语句（或块）是由大括号括起来的两个或多个语句组成的，它可以用于任何可以使用单个语句的地方。\n\
  \n\n\n许多语句是由表达式和操作符组合而成的。记住，表达式是任何可以求值为数值结果的内容。复杂的表达式可以包含许多更简单的表达式，这些被称为子表达式。\n\n\
  操作符是 C 语言符号，指示计算机对一个或多个表达式执行操作。某些操作符是单元元的，这意味着它们对单个操作数进行操作。然而，C 语言的大多数操作符是二元的，对两个操作数进行操作。其中一种操作符——条件运算符——是三元元的。C\
  \ 语言的操作符具有定义的优先级层次，这决定了包含多个操作符的表达式中操作执行的顺序。\n\n### 运算符\n\n本节涵盖的 C 运算符分为三类：\n\n![Image](img/squf.jpg)\
  \ 算术运算符对其操作数执行算术运算（例如，加法）。\n\n![Image](img/squf.jpg) 关系运算符在其操作数之间进行比较（例如，大于）。\n\n\
  ![Image](img/squf.jpg) 逻辑运算符对布真/假表达式进行操作。记住 C 语言使用 `0` 和 `1` 分别表示假和真，任何非零值都会被解释为真。\n\
  \n你还学习了 C 语言的 `if` 语句，它允许你根据关系表达式的求来控制程序的执行。\n\n### 问答\n\n**Q 空格和空行对程序的运行有什么什么影响？**\n\
  \n**A** 空白（行、空格和制表符）使代码列表更具可读性。当程序被编译时，空白会被删除，因此对可执行程序没有影响。出于如此，你应该使用空白让你的程序更易读。\n\
  \n**Q 编写复合 `if` 语句还是嵌套多个 `if` 语句更好？**\n\n**A** 你应该让代码易于理解。如果你嵌套了 `if` 语句，它们将像本节所示那样进行求值。如果你使用单个复合语句，表达式将一直求值，直到整个语句求值为假。\n\
  \n**Q 单元运算符和二元运算符之间的区别是什么？**\n\n**A** 正如名称所示，单元运算符作用于一个变量，而二元运算符作用于两个。\n\n**Q 减法运算符\
  \ `-` 是二元的还是单元的？**\n\n**A** 它两者皆是！编译器足够智能，知道你正在使用哪一种。它根据表达式中变量的数量来判断使用哪种形式。在下面的语句中，它是单元的：\n\
  \n```\nx = -y;\n```\n\n与之对应的下面的二元用法：\n\n```\nx = a - b;\n```\n\n**Q 负数被视为真还是假？**\n\
  \n**A** 记住 `0` 是假，任何其他值都是真。这包括负数。\n\n### 工作坊\n\n工作坊提供了了测验题来帮助你巩固对所涵盖内容的理解，并提供了练习来提供使用所学知识的机会。\n\
