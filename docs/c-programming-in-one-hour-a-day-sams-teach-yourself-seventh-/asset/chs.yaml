  \ C 程序的主要组件。你学到每个每个 C 程序唯一要求的部分是 `main()` 函数。你还学到程序的实际工作是由程序语句完成的，这些语句指示计算机执行你所想要的操作。你还接触了变量和变量定义，并学习了如何在源代码中使用注释。\n\
  \n除了 `main()` 函数外，C 程序可以使用两种类型的辅助函数：作为编译器包一部分提供的库函数，以及由程序员创建的用户定义函数。接下来的几节课程将对你在本节中看到的\
  \ C 程序的许多部分进行更详细的介绍。\n\n### 问答\n\n**Q 注释对程序有什么影响？**\n\n**A 注释是给程序员看的。** 当编译器将源代码转换为目标代码时，它会丢弃注释和空白字符。这意味着它们对可执行程序没有影响。带有大量注释的程序执行速度与注释很少的程序一样快。注释确实会让你的源文件变大，但这通常不需要担心。总结来说，你应该使用注释和空白使得你的源代码尽可能易于理解和维护。**\n\
  \n**Q 语句和块之间有什么区别？**\n\n**A 块是一组被大括号 (`{}`) 包围的语句。块可以使用可以使用语句语句的地方。**\n\n**Q 我如何找到哪些可用的库函数？**\n\
  \n**A 许多编译器都附带专门用于记录库函数的在线文档。它们通常按字母顺序排列。附录 C，“常用 C 函数](#app03.xhtml_app03)”列出了许多可用函数。在你开始理解更多\
  \ C 之后，阅读该附录将是一个好主意，这样你就不会重写库函数了（造轮子是没有意义的！）****\n\n### 工作坊\n\n工作坊提供了测验题来帮助你巩固对涵盖内容的理解，并提供了练习让你获得使用所学知识的经验。\n\
