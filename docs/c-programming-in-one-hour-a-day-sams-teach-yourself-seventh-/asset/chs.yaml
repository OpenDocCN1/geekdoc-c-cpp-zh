  \ `atexit()` 库函数。）\n\n## 第 18 。处理字符串\n\nC 语言存储在字符串中的文本数据是许多程序的重要部分。到目前为止，你已经学习了\
  \ C 程序如何存储字符串以及你如何输入和输出字符串。C 还提供了用于其他类型字符串操作的函数。在本节中，你将学习\n\n![Image](img/squf.jpg)\
  \ 如何确定字符串的长度\n\n![Image](img/squf.jpg) 如何复制和合并字符串\n\n### 确定字符串长度\n\n你应该记得之前的章节记住，在\
  \ C 中，字符串是一个字符序列，其开头由指针指示，结尾由空字符标记。有时，你需要知道字符串的长度——即它包含的字符数。长度可以通过 `strlen()` 获取。你可能对\
  \ `size_t` 返回类型感到疑惑。该类型在 `string.h` 中定义为 `unsigned`，因此 `strlen()` 函数返回一个无符号整数。传递给\
  \ `strlen` 的参数是你想知道长度的字符串指针。列表 18.1](#ch18.xhtml_ch18lis01) 展示了 `strlen()`。\n\n\
  #### 列表 18.1 使用 strlen() 函数\n\n```c\n#include <stdio.h>\n#include <string.h>\n\n\
  int main( void )\n{\n    size_t length;\n    char buf[80];\n    while (1)\n    {\n\
  \        puts(\"\\nEnter 一行文本，按空行退出。\");\n        gets(buf);\n        length = strlen(buf);\n\
  \        if (length != 0)\n            printf(\"\\n 该行有 %u 长。\", length);\n    \
  \    else\n            break;\n    }\n    return(0);\n}\n```\n\n### 分析\n\n这个程序仅仅演示了\
  \ `strlen()` 的用法。第 13 行和第 14 行显示消息并获取字符串 `buf`。第 16 行使用 `strlen()` 将 `buf` 的长度赋值给变量\
  \ `length`。第 18 行通过检查长度是否为 0 来检查字符串是否为空。如果不为空，第 19 行打印字符串的大小。\n\n### 复制字符串\n\n\n\
  \n\nC 库有两个用于复制字符串的函数。由于 C 处理字符串的方式，你不能像在其他计算机语言中那样简单地将一个字符串赋值给另一个。你必须将源字符串从它的内存位置复制到目标字符串的内存位置。字符串复制函数是\
  \ `strcpy()` 和 `strncpy()`。这些函数需要头文件 `string.h`。\n\n### strcpy() 函数\n\n库函数 `strcpy()`\
  \ 将整个字符串复制到另一个内存位置。它的原型定义如下：\n\n点击此处查看代码图像\n\n```\nchar *strcpy( char *destination,\
  \ const char *source );\n```\n\n函数 `strcpy()` 将 `source` 指向的字符串（包括终止空字符 `\\0`）复制到\
  \ `destination` 指向的位置。其返回值是指向新字符串 `destination` 的指针。\n\n当使用 `strcpy()` 时，你必须先为目标字符串分配存储空间。该函数无法得知\
  \ `destination` 是否指向已分配的空间。如果未分配空间，该函数将从 `destination` 开始覆盖 `strlen(source)` 字节的内存。这可能会导致不可预测的问题。`strcpy()`\
  \ 的用法在列表 18.2 中所示。\n\n> 注意：当程序使用 `malloc()` 分配内存时（如列表 18.2 所示），良好的编程实践要求在程序结束使用内存时使用\
  \ `free()` 函数释放内存。你可以在第 21 “处理内存](#ch21.xhtml_ch21)”中学习 `free()`。\n\n输入 ![Image](img/down-arrow.jpg)\n\
  \n**列表 18.2** stringcopy.c：在使用 `strcpy()` 之前，你必须为目标字符串分配存储空间\n\n点击此处查看代码图像\n\n```\n\
  1:  // stringcopy.c--演示 strcpy().\n2:  #include <stdlib.h>\n3:  #include <stdio.h>\n\
  4:  #include <string.h>\n5:\n6:  char source[] = \"The source string.\";\n7:\n8:\
  \  int main( void )\n9:  {\n10:      char dest1[80];\n11:      char *dest2, *dest3;\n\
  12:\n13:      printf(\"\\nsource: %s\", source );\n14:\n15:      // 复制到 dest1 是可以，因为\
  \ dest1 指向\n16:      // 80 字节已分配的空间。\n17:\n18:      strcpy(dest1, source);\n19:\
  \      printf(\"\\ndest1:  %s\", dest1);\n20:\n21:      // 要复制到 dest2，你必须分配空间。\n\
