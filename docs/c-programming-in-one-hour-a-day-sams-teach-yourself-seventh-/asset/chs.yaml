  \n**1.** `puts()` 和 `printf()` 之间的区别是什么？\n...（此处省略重复部分）\n\n\n\n`array`（数组）是数据存储位置的集合，每个位置存储相同类型的数据，并具有相同的名称。数组中的每个存储位置被称为\
  \ `array element`（数组元素）。为什么在程序中需要数组？这个问题可以通过一个例子来回答。\n\n如果你正在记录 2014 年的业务开支，并按月份分类收据，你可以为每个月的收据准备一个文件夹，但拥有一个有\
  \ 12 个隔间的单个文件夹会更方便。\n\n将这个例子扩展到计算机编程中。假设你正在设计一个程序来跟踪业务开支。该程序可以声明 12 个独立的变量，每个变量代表一个月的支出总额。这种方法比比为收据准备\
  \ 12 个独立的文件夹。然而，良好的编程习惯是使用一个包含 12 个元素的数组，将每个月的总额存储在对应的数组元素中。这种方法类似于将收据存在一个有 12 个隔间的单个文件夹中。图\
  \ 8.1 展示了使用单独变量和使用数组之间的区别。\n\n![Image](img/08fig01.jpg)\n\n**图 8.1** 变量就像独立的文件夹，而数组就像一个带有许多隔间的单个文件夹。\n\
  \n## 使用一维数组\n\n`single-dimensional array`（一维数组）只有一个下标。`subscript`（下标）是跟在数组名称后的括号数字。这个数字可以标识数组中单个元素的数量。通过例子可以清楚地说明这一点。对于业务开支程序，你可以使用以下行来声明一个\
  \ `float` 类型的数组：\n\n```c\nfloat expenses[12];\n```\n\n该数组命名为 `expenses`，包含 12 个元素。12\
  \ 个元素中的每一个都等同于一个单独的 `float` 变量。\n\nC 语言的所有数据类型都可以用于数组。C 语言的数组元素始终从 0 开始编号，因此 `expenses`\
  \ 的 12 个元素编号为 0 到 11。在前面的示例中，1 月份的支出总额将存储在 `expenses[0]`，2 月份的在 `expenses[1]`，依此类推。12\
  \ 月份的支出总额将在 `expenses[11]` 中。\n\n当你声明数组时，编译器会分配一个足够容纳整个数组的内存块。单个数组元素存储在连续的内存位置，如图\
  \ 8.2 所示。\n\n![Image](img/08fig02.jpg)\n\n**图 8.2** 数组元素存储在连续的内存位置中。\n\n在源代码中声明数组的位置很重要。与不属于数组的变量一样，声明的位置会影响程序如何使用该数组。声明位置的影响将在第\
  \ 12 节 中的“理解变量作用域”中进行更详细的介绍。现在，将你的数组声明与其他变量声明放在一起。\n\n数组元素可以在程序中任何可以使用同类型非数组变量的地方。通过使用数组名后跟方括号括起的元素下标来访问数组的单个元素。例如，以下语句将值\
  \ `89.95` 存储在第二个数组元素中。（记住，第一个数组元素是 `expenses[0]`，而不是 `expenses[1]`）：\n\n```c\nexpenses[1]\
  \ = 89.95;\n```\n\n同样，语句\n\n```c\nexpenses[10] = expenses[11];\n```\n\n将存储在数组元素\
  \ `expenses[11]` 中的值复制赋值给数组元素 `expenses[10]`。当你引用数组元素时，数组下标可以是字面常数（如这些示例所示）。然而，你的程序经常可能会使用\
  \ C 整数变量或表达式，甚至是另一个数组元素作为下标。以下是一些例子：\n\n```c\nfloat expenses[100];\nint a[10];\n\
  \n/* 此处是额外的语句 */\n\nexpenses[i] = 100;         // i 是一个整数变量\nexpenses[2 + 3] = 100;\
  \  // 等同于 expenses[5]\nexpenses[a[2]] = 100;   // a[] 是整数数组\n```\n\n上一个例子可能需要解释。例如，如果你有一个名为\
  \ `a[]` 的整数数组，并且值 `8` 存储在元素 `a[2]` 中，那么编写\n\n```c\nexpenses[a[2]]\n```\n\n与编写\n\n\
  ```c\nexpenses[8];\n```\n\n的效果相同。\n\n当你使用数组时，请记住元素编号方案：在一个包含 `n` 个元素的数组中，允许的下标范围是从\
  \ 0 到 `n`–1。如果你使用下标值 `n`，可能会导致程序错误。C 编译器并不识别你的程序使用的数组下标是否越界。你的程序可以编译并链接，但越界下标通常产生错误结果。\n\
  \n***\n\n> **注意**\n> 记住数组元素从 `0` 开始，而不是 `1`。还要记住最后一个元素比数组元素的个数少 1。例如，一个包含 10 个元素的数组包含\
  \ `0` 到 `9` 的元素。\n\n***\n\n\n\n\n程序的流程与你之前看到的列表类似。第 1 行以一条注释开始，描述了程序的功能。注意，注释中包含了程序名\
  \ `expenses.c`。当注释中包含程序名时，你就知道正在查看哪一个程序。这在查看列表打印输出时很有帮助。\n\n第 5 行包含一条额外的注释，解释了声明的变量。第\
  \ 7 行声明了一个拥有 13 个元素的数组。在这个程序中只需要 12 个元素（每个月一个），但声明了 13 个。第 9 行声明了一个 `total` 变量，将在数组填充后使用。第\
  \ 15 到 19 行的 `for` 循环忽略了元素 `0`。这让程序可以使用元素 `1` 到 `12`，这些直接对应于 12 个月。回到第 8 行，声明了一个变量\
