  \ struct data PERSON;\n17: typedef PERSON *LINK;\n18:\n19: int main( void )\n20:\
  \ {\n21:    /* 头指针、新元素指针和当前元素指针。 */\n22:    LINK head = NULL;\n23:    LINK new =\
  \ NULL;\n24:    LINK current = NULL;\n25:\n26:    /* 添加第一个列表元素。我们不 */\n27:    /*\
  \ 假设列表是空的，尽管在 */\n28:    /* 这个演示程序中它总是是的。 */\n29:\n30:    new = (LINK)malloc(sizeof(PERSON));\n\
  31:    new->next = head;\n32:    head = new;\n33:    strcpy(new->name, \"Abigail\"\
  );\n34:\n35:    /* 在列表末尾添加一个元素。 */\n36:    /* 我们假设列表至少包含一个元素。 */\n37:\n38:    current\
  \ = head;\n39:    while (current->next != NULL)\n40:    {\n41:      current = current->next;\n\
  42:    }\n43:\n44:    new = (LINK)malloc(sizeof(PERSON));\n45:    current->next\
  \ = new;\n46:    new->next = NULL;\n47:    strcpy(new->name, \"Carolyn\");\n48:\n\
  49:    /* 在第二个位置添加新元素。 */\n50:    new = (LINK)malloc(sizeof(PERSON));\n51:    new->next\
  \ = head->next;\n52:    head->next = new;\n53:    strcpy(new->name, \"Beatrice\"\
  );\n54:\n55:    /* 按顺序打印所有数据。 */\n56:    current = head;\n57:    while (current\
  \ != NULL)\n58:    {\n59:      printf(\"\\n%s\", current->name);\n60:      current\
  \ = current->next;\n61:    }\n62:\n63:    printf(\"\\n\");\n64:\n65:    return 0;\n\
  66: }\n```\n\n输出 ![Image](img/down-arrow.jpg)\n\nAbigail\nBeatrice\nCarolyn\n\n\
  分析：\n\n9-12 行定义了列表的数据结构。16-17 行为结构体及其指向它的指针定义了 `typedef`。22-24 行定义了头指针、新元素指针和当前元素指针。26-33\
  \ 行添加了第一个列表元素。我们不假设列表是空的，尽管在这个演示程序中它总是空的。30 行使用 `malloc` 分配 `PERSON` 大内存；31 行让 `new->next`\
  \ 指向 `head`；32 行让 `head` 指向 `new`；33 行将 \"Abigail\" 赋值给 `new->name`。35-48 行在列表末尾添加元素。我们假设列表至少包含一个元素。38\
  \ 行将 `current` 指向 `head`；39-42 行循环直到 `current->next` 为空，`current` 指向最后一个元素。44 行使用\
  \ `malloc` 分配 `PERSON` 大内存；45 行让 `current->next` 指向 `new`；46 行将 `new->next` 设为 `NULL`；47\
  \ 行将 \"Carolyn\" 赋值给 `new->name`。49-54 行在第二个位置添加新元素。50 行使用 `malloc` 分配 `PERSON`\
  \ 大内存；51 行让 `new->next` 指向 `head->next`；52 行让 `head->next` 指向 `new`；53 行将 \"Beatrice\"\
  \ 赋值给 `new->name`。55-62 行按顺序打印所有数据。56 行将 `current` 指向 `head`；57-61 行循环直到 `current`\
  \ 为空，打印 `current->name` 并让 `current` 指向下一个元素。\n\n---\n\n### 实现链表\n\n现在你已经学会了向列表添加元素的方法，是时候看看它们的操作了。列表\
  \ 16.6 是一个相当长的程序，使用链表来存储字符列表。这些字符使用链表存储在内存中。这些字符可以是名称、地址或任何数据。为了保持示例简单，每个节点只存储一个字符。\n\
  \n这个链表程序复杂之处在于它在添加元素时会排序。当然，这正是该程序的价值所在。元素根据其值被添加到开头、中间或末尾。链始终是有排序的。如果你写一个简单的将元素添加到末尾的程序，逻辑会简单得多。然而，程序的实用性也会降低。\n\
  \n\n\n\n# 目的：实现链表\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n\n#ifndef NULL\n\
  \  #define NULL 0\n#endif\n\n/* 列表数据结构 */\nstruct list\n{\n    int ch;      /* 使用\
  \ int 来存储字符 */\n    struct list *next_rec;\n};\n\n/* 结构体和指针的类型定义 */\ntypedef struct\
  \ list LIST;\ntypedef LIST *LISTPTR;\n\n/* 函数原型声明 */\nLISTPTR add_to_list( int,\
  \ LISTPTR );\nvoid show_list(LISTPTR);\nvoid free_memory_list(LISTPTR);\n\nint main(\
  \ void )\n{\n    LISTPTR first = NULL;  /* 头指针 */\n    int i = 0;\n    int ch;\n\
  \    char trash[256];      /* 清空 stdin 缓冲区 */\n\n    while ( i++ < 5 )     /* 根据输入的\
  \ 5 个项目构建列表 */\n    {\n        ch = 0;\n        printf(\"\\nEnter 字符 %d, \", i);\n\
  \n        do\n        {\n            printf(\"\\n 必须是 a 到 z 之间的字母: \");\n      \
  \      ch = getc(stdin);  /* 获取缓冲区中的下一个字符 */\n            gets(trash);      /* 缓冲区中的垃圾字符\
  \ */\n        } while( (ch < 'a' || ch > 'z') && (ch < 'A' || ch > 'Z'));\n\n  \
  \      first = add_to_list( ch, first );\n    }\n\n    show_list( first );     \
  \     /* 输出整个链表 */\n    free_memory_list( first );  /* 释放所有内存 */\n    return 0;\n\
  }\n```\n\n/*========================================================*\n* 函数: add_to_list()\n\
  * 目的：在列表中插入新节点\n* 输入：int ch = 要存储的字符\n*       LISTPTR first = 原始头指针的地址\n* 返回：头指针的地址\
  \ (first)\n*================================================________*/\n\n```c\n\
  LISTPTR add_to_list( int ch, LISTPTR first )\n{\n    LISTPTR new_rec = NULL;   \
  \   /* 存储新节点的地址 */\n    LISTPTR tmp_rec = NULL;      /* 存储临时指针          */\n   \
  \ LISTPTR prev_rec = NULL;\n\n    /* 分配内存。 */\n    new_rec = (LISTPTR)malloc(sizeof(LIST));\n\
  \    if (!new_rec)  /* 无法分配内存 */\n    {\n        printf(\"\\n 无法分配内存!\\n\");\n \
  \       exit(1);\n    }\n\n    /* 设置新节点的数据 */\n    new_rec->ch = ch;\n    new_rec->next_rec\
  \ = NULL;\n\n    if (first == NULL)  /* 将第一个节点加入列表 */\n    {\n        first = new_rec;\n\
  \        new_rec->next_rec = NULL;  /* 冗余但安全 */\n    }\n    else  /* 不是第一个节点 */\n\
  \    {\n        /* 检查是否在第一个节点之前插入 */\n        if ( new_rec->ch < first->ch)\n  \
  \      {\n            new_rec->next_rec = first;\n            first = new_rec;\n\
  \        }\n        else  /* 添加到中间或末尾 */\n        {\n            tmp_rec = first->next_rec;\n\
  \            prev_rec = first;\n\n            /* 检查插入的位置。 */\n            if ( tmp_rec\
  \ == NULL )\n            {\n                /* 正在将第二个节点添加到末尾 */\n              \
  \  prev_rec->next_rec = new_rec;\n            }\n            else\n            {\n\
  \                /* 检查是否在中间插入 */\n                while (( tmp_rec->next_rec !=\
  \ NULL))\n                {\n                    if( new_rec->ch < tmp_rec->ch )\n\
  \                    {\n                        new_rec->next_rec = tmp_rec;\n \
  \                       if (new_rec->next_rec != prev_rec->next_rec)\n         \
  \               {\n                            printf(\"ERROR\");\n            \
  \                getc(stdin);\n                            exit(0);\n          \
  \              }\n                        prev_rec->next_rec = new_rec;\n      \
  \                  break;  /* 已添加；退出 */\n                    }\n               \
  \     else\n                    {\n                        tmp_rec = tmp_rec->next_rec;\n\
  \                        prev_rec = prev_rec->next_rec;\n                    }\n\
  \                }\n\n                /* 检查是否添加到末尾 */\n                if (tmp_rec->next_rec\
  \ == NULL)\n                {\n                    if (new_rec->ch < tmp_rec->ch\
  \ ) /* 14 末尾 */\n                    {\n                        new_rec->next_rec\
  \ = tmp_rec;\n                        prev_rec->next_rec = new_rec;\n          \
  \          }\n                    else  /* 在末尾 */\n                    {\n     \
  \                   tmp_rec->next_rec = new_rec;\n                        new_rec->next_rec\
  \ = NULL;  /* 冗余 */\n                    }\n                }\n            }\n \
  \       }\n    }\n    return(first);\n}\n```\n\n/*========================================================*\n\
  * 函数: show_list\n* 目的：显示列表中当前的内容\n*========================================================*/\n\
  \n```c\nvoid show_list( LISTPTR first )\n{\n    LISTPTR cur_ptr;\n    int counter\
  \ = 1;\n\n    printf(\"\\n 节点地址  位置  数据  下一节点地址\\n\");\n    printf(\"========  ========\
  \  ====  =============\\n\");\n\n    cur_ptr = first;\n    while (cur_ptr != NULL\
  \ )\n    {\n        printf(\"  %p  \", cur_ptr );\n        printf(\"    %d  %c\"\
  , counter++, cur_ptr->ch);\n        printf(\"    %p\\n\",cur_ptr->next_rec);\n \
  \       cur_ptr = cur_ptr->next_rec;\n    }\n}\n```\n\n/*========================================================*\n\
  * 函数: free_memory_list\n* 目的：释放列表的所有内存\n*========================================================*/\n\
  \n```c\nvoid free_memory_list(LISTPTR first)\n{\n    LISTPTR cur_ptr, next_rec;\n\
  \    cur_ptr = first;      /* 从开始开始 */\n\n    while (cur_ptr != NULL)    /* 一直到链表结束\
  \ */\n    {\n        next_rec = cur_ptr->next_rec;  /* 获取下一个节点的地址 */\n        free(cur_ptr);\
  \                 /* 释放当前节点 */\n        cur_ptr = next_rec;            /* 调整当前节点\
  \ */\n    }\n}\n```\n\n输出 ![Image](img/down-arrow.jpg)\n\n点击此处查看代码图片\n\n输入字符 1,\n\
  必须是 a 到 z 之间的字母: q\n输入字符 2,\n必须是 a 到 z 之间的字母: b\n输入字符 3,\n必须是 a 到 z 之间的字母: z\n输入字符\
  \ 4,\n必须是 a 到 z 之间的字母: c\n输入字符 5,\n必须是 a 到 z 之间的字母: a\n节点地址  位置  数据  下一节点地址\n========\
  \  ========  ====  =============\n  2224A0        1       a      222470\n  222470\
  \        2       b      222490\n  222490        3       c      222450\n  222450\
  \        4       q      222480\n  222480        5       z      0\n\n\n\n\n\nListing\
  \ 16.6 开头的几项内容应该是熟悉的或容易理解的。第 9 到 11 行检查 `NULL` 的值是否已经定义。如果没有定义，第 10 行将其定义为 `0`。第\
  \ 14 到 22 行定义了链表的结构，并声明了类型定义，以便于对结构和指针进行操作。\n\n`main()` 函数应该易于跟读。第 31 行声明了一个名为 `first`\
  \ 的头指针。注意它被初始化为 `NULL`。请记住，永远不要让指针处于未初始化的状态。第 36 到 49 行包含一个 `while` 循环，用于从用户获取五个字符。在重复五次的外层\
  \ `while` 循环内部，使用 `do...while` 结构来确保输入的每个字符都是字母。同样也可以方便地使用 `isalpha()` 函数。\n\n获取数据片段后，会调用\
  \ `add_to_list()`。指向列表开头的指针和要添加到列表中的数据被传递给该函数。\n\n`main()` 函数通过调用 `show_list()`\
  \ 来显示列表数据，然后调用 `free_memory_list()` 释放所有用于存储链表中链接的内存。这两个函数的工作方式相似。它们都使用头指针 `first`\
  \ 从链表开始开始。使用 `while` 循环通过 `next_ptr` 值从一个链接移动到下一个。当 `next_ptr` 等于 `NULL` 时，到达链表末尾，函数返回。\n\
  \n此列表中最重要的（也是最复杂的！）函数是第 56 到 149 行的 `add_to_list()`。第 66 到 68 行声明了三个可以用于指向三个不同链接的指针。`new_rec`\
  \ 指针指向要添加的新链接。`tmp_rec` 指针指向正被评估的列表中的当前链接。如果列表中有多个一个链接，`prev_rec` 指针指向已评估过的上一个链接。\n\
  \n第 71 行为正在添加的新链接分配内存。`new_rec` 指针被设置为 `malloc()` 返回的值。如果无法分配内存，第 74 和 75 行将打印错误信息并退出程序。如果内存分配成功，程序继续执行。\n\
  \n第 79 行将结构中的数据设置为传递给此函数的数据。这仅包括将传递给函数的字符 `ch` 赋值给新记录的字符字段 (`new_rec->ch`)。在更复杂的程序中，这可能涉及多个字段的赋值。第\
  \ 80 行将新记录中的 `next_rec` 设置为 `NULL`，以防止它指向某个随机位置。\n\n第 82 行通过检查列表中是否存在链接来开始“添加链接”的逻辑。如果要添加的链接是列表中的第一个链接（如头指针\
  \ `first` 为 `NULL` 所示），则只需将头指针设置为新指针，操作完成。\n\n如果该链接不是第一个，函数将会在第 87 行的 `else` 分支中继续执行。第\
  \ 90 行检查新链接是否位于列表开头。正如你应该记得的，这是添加链接的三种情况之一。如果链接确实在开头，第 92 行将新链接的 `next_rec` 指针指向之前的“第一个”链接。第\
  \ 93 行随后将头指针 `first` 指向新链接。这导致新链接被添加到列表开头。\n\n如果新链接不是添加到空列表的第一个链接，且它是被添加到现有列表的开头，那么你知道它一定位于列表的中间或末尾。第\
  \ 97 和 98 行设置了之前声明的 `tmp_rec` 和 `prev_rec` 指针。指针 `tmp_rec` 设置为列表中第二个链接的地址，`prev_rec`\
  \ 设置为列表的第一个链接。\n\n你应该注意，如果列表中只有一个链接，`tmp_rec` 将等于 `NULL`。这是因为 `tmp_rec` 被设置为第一个链接的\
  \ `next_ptr`，而其等于 `NULL`。第 102 行检查这种特殊情况。如果 `tmp_rec` 为 `NULL`，你就知道这是添加到列表的第二个链接。因为你知道新链接不在第一个链接之前，它只能位于末尾。为了实现这一点，只需将\
  \ `prev_rec->next_ptr` 设置为新链接，然后操作完成。\n\n如果 `tmp_rec` 指针不是 `NULL`，你就知道列表中已经有两个以上的链接。第\
  \ 110 到 129 行的 `while` 语句遍历剩余链接，以确定新链接应该放置的位置。第 112 行检查新链接的数据值是否小于当前指向的链接。如果是，你就知道这就是想要添加链接的地方。如果新数据大于当前链接的数据，则需要查看列表中的下一个链接。\n\
  \n\n\n\n本课程进一步深化了你对指针的知识和经验。你已经学习了如何声明和使用函数指针，这是一个重要且灵活的编程工具。最后，你学习了如何实现链表，一种强大且灵活的数据存储方法。虽然最后两节涵盖了复杂的课题，但它们也同样令人兴奋。凭借你对指针的新知识，你正在真正接触\
  \ C 语言的一些特性。强大和灵活性是 C 成为如此流行语言的主要原因之一。\n\n### 问答\n\n`ch16.xhtml_ch16as01` 是否有必要使用本节介绍的概念来充分利用\
  \ C 语言？\n\n`ch16.xhtml_ch16qa1` 你可以在不使用任何高级概念的情况下使用 C；但是，你无法充分利用 C 提供的威力。如本节所示的指针操作可以让许多编程任务变得更简单更高效。\n\
  \n`ch16.xhtml_ch16as02` 函数指针在其他什么时候有用吗？\n\n`ch16.xhtml_ch16qa2` 是的。函数指针也用于菜单。根据菜单返回的值，将指针指向根据菜单选择应该被调用的函数。\n\
  \n`ch16.xhtml_ch16as03` 说出链表的两个主要优势。\n\n`ch16.xhtml_ch16qa03` 其一：链表的大小可以在程序运行时增加或缩小；不需要在编写代码时预定义。其二：很容易保持链表的排序，因为元素可以地在列表的任何地方添加或删除。\n\
  \n### 工作坊\n\n工作坊提供了测验帮助你巩固对内容的理解，并通过练习让你获得所学知识的经验。\n\n#### 测验\n\n`app04.xhtml_ch16ans01`\
