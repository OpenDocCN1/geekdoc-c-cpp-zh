  \ `perror()` 函数一起使用。\n\n`errno.h` 的定义包含一个名为 `errno` 的外部整数。如果发生错误，许多库函数会为该变量赋值。`errno.h`\
  \ 文件还定义了一组用于这些错误的符号常常量，列在 表 20.2 中。\n\n![Image](img/20tab02.jpg)\n\n**表 20.2** 在\
  \ `errno.h` 中定义的错误常量\n\n你有两种方式使用 `errno`。某些函数通过其返回值信号错误的发生。如果发生了这种情况，你可以测试 `errno`\
  \ 的值来确定错误的性质并采取适当行动。否则，当你没有特定指示表明发生了错误时，你可以测试 `errno`。如果它非零，则说明发生了错误，`errno` 的特定值指示了错误的性质。在处理错误后，务必将\
  \ `errno` 重置为零。下一节解释 `perror()`，然后 列表 20.4 演示了 `errno` 的用法。\n\n#### perror() 函数\n\
  \n`perror()` 函数是 C 错误处理工具之一。调用时，`perror()` 会在 `stderr` 上显示一条描述库函数调用或系统调用期间发生的最近错误的消息。其原型在\
  \ `stdio.h` 中为：\n\n```\nvoid perror(const char *msg);\n```\n\n参数 `msg` 指向一个可选的用户自定义消息。该消息首先被打印，随后跟着一个冒号和描述最近错误的实现的定义消息。如果你在调用\
  \ `perror()` 时没有发生错误，显示的消息是 `no error`。\n\n\n\n\n调用 `perror()` 并对处理错误情况不起任何作用。采取行动取决于程序本身。该操作可能包括提示用户执行某些操作，例如终止程序。程序所采取的操作可以通过测试\
  \ `errno` 的值以及错误的性质来确定。请注意，程序在使用外部变量 `errno` 时并不需要包含头文件 `errno.h`。只有当你的程序使用了表 20.2\
  \ 中列出的符号错误常量时，才需要该头文件。列表 20.4 演示了如何使用 `perror()` 和 `errno` 处理运行时错误。\n\n输入 ![Image](img/down-arrow.jpg)\n\
  \n**列表 20.4** `perror.c`: 使用 `perror()` 和 `errno` 处理运行时错误\n\n点击此处查看代码图像\n\n```\n\
