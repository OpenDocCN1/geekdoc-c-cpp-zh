  \n## 第 13 节高级程序控制\n\n第 6 节，“程序控制](#ch06.xhtml_ch06)”介绍了几个 C 语言控制语句，它们用于控制程序中其他语句的执行。本节涵盖了程序控制更高级的方面，包括\
  \ `goto` 语句以及你对循环可以进行的一些有趣操作。在本节中，你将学习：\n\n![Image](img/squf.jpg)\n- 如何使用 `break`\
  \ 和 `continue` 语句\n- 什么是无限循环以及你可能使用它们的原因\n- 什么是 `goto` 语句以及你应该避免它的原因\n- 如何使用 `switch`\
  \ 语句\n- 如何控制退出程序\n- 如何在完成后执行函数\n- 如何在程序中执行命令\n\n### 结束循环\n\n在第 6 节中，你学习了 `for` 循环、`while`\
  \ 循环和 `do...while` 循环如何控制执行。这些循环结构不执行、一次或多次执行一段 C 语句块。在所有情况下，循环的终止或退出取决于特定条件。然而，你可能希望对循环执行进行更多控制。`break`\
  \ 和 `continue` 语句提供了这种控制。\n\n#### break 语句\n\n`break` 语句只能放置在 `for` 循环、`while` 循环或\
  \ `do...while` 循环体中。（在 `switch` 语句中也是有效的，但稍后介绍。）当遇到 `break` 语句时，执行立即退出循环。以下是一个示例：点击此处查看代码图像\n\
  \n```c\nfor ( count = 0; count < 10; count++ )\n{\n    if ( count == 5 )\n    break;\n\
  }\n```\n\n`for` 循环本身会执行 10 次。在第六次迭代时，`count` 等于 5，`break` 语句执行导致 `for` 循环终止。执行跳转到\
  \ `for` 循环后面的语句。当嵌套循环内部遇到 `break` 语句时，它只会退出最内层循环。列表 13.1 展示了 `break` 的用法![Image](img/down-arrow.jpg)\n\
  \n**列表 13.1** breaking.c：使用 `break` 语句\n\n点击此处查看代码图像\n\n```c\n// 展示 break 语句。\n\
  include <stdio.h>\n\nchar s[] = \"This is a test string. It contains two sentences.\"\
  ;\n\nint main( void )\n{\n    int count;\n    printf(\"\\nOriginal string: %s\"\
  , s);\n    for (count = 0; s[count]!='0'; count++)\n    {\n        if (s[count]\
  \ == '.')\n        {\n            s[count+1] = '\\0';\n            break;  /* 结束循环\
  \ */\n        }\n    }\n    printf(\"\\nModified string: %s\\n\", s);\n    return\
  \ 0;\n}\n```\n\n输出![Image](img/down-arrow.jpg) 点击此处查看代码图像\n\nOriginal string: This\
  \ is a test string. It contains two sentences.\nModified string: This is a test\
  \ string.\n\n分析![Image](img/down-arrow.jpg)\n\n此程序从字符串中提取第一个句子。它逐字符搜索句号（句子的结束）。这是在第\
  \ 13 到 20 行的 `for` 循环中完成的。第 13 行开始 `for` 循环，递增 `count` 以遍历字符串 `s` 中的字符。第 15 行检查字符串中的当前字符是否为句号。如果是，则在句号后面插入一个空字符（第\
  \ 17 行）。这实际上裁剪了字符串。裁剪字符串后，你不再需要继续循环，因此第 18 行的 `break` 语句迅速终止循环并将控制传给循环后的第 21 行。如果没有找到句号，字符串就不会被更改。\n\
  \n循环可以包含多个 `break` 语句，但只有执行的第一个 `break`（如果有）有效。如果没有执行 `break`，循环将根据其测试条件正常终止。图 13.1\
  \ 显示了 `break` 语句的操作。\n\n![Image](img/13fig01.jpg)\n\n**图 13.1** `break` 和 `continue`\
  \ 语句的操作。\n\n### 语法\n\n#### break 语句\n\n`break;`\n\n`break` 用于循环或 `switch` 语句内部。它导致程序控制立即退出当前循环（`for`、`while`\
  \ 或 `do...while`）或 `switch` 语句。循环不再继续迭代；循环或 `switch` 语句后的第一个语句将执行。\n\n**示例**\n\n\
  点击此处查看代码图像\n\n```c\nint x;\nprintf ( \"Counting from 1 to 10\\n\" );\n/* 在 for 循环中没有条件会导致无限循环\
  \ */\nfor( x = 1; ; x++ )\n{\n    if( x == 10 )  /*检查值是否为 10 */\n        break;\
  \      /* 结束循环 */\n    printf( \"\\n%d\", x );\n}\n```\n\n#### continue 语句\n\n与\
  \ `break` 语句一样，`continue` 语句只能放置在 `for` 循环、`while` 循环或 `do...while` 循环体内。当执行 `continue`\
  \ 语句时，封装循环的下一次迭代立即开始。`continue` 语句和循环结束之间的语句不会执行。`continue` 的操作在图 13.1 中所示。注意这与\
  \ `break` 语句的操作不同。\n\n列表 13.2 使用 `continue` 语句。该程序接受键盘的一行输入，然后显示删除所有小写元音后的内容。\n\n\
  \n\n\n\n```c\nint main( void )\n{\n    // 声明一个输入缓冲区和一个计数器变量。\n    char buffer[81];\n\
  \    int ctr;\n\n    // 输入一行文本。\n    puts(\"Enter a line of text:\");\n    gets(buffer);\n\
  \n    // 遍历字符串，只显示\n    // 不是小写元音的字符。\n    for (ctr = 0; buffer[ctr] !='\\0'; ctr++)\n\
  \    {\n        // 如果字符是小写元音，循环循环\n        // 而不显示。\n        if (buffer[ctr] ==\
  \ 'a' || buffer[ctr] == 'e'\n          || buffer[ctr] == 'i' || buffer[ctr] == 'o'\n\
  \          || buffer[ctr] == 'u')\n            continue;\n\n        // 如果不是元音，则显示它。\n\
  \        putchar(buffer[ctr]);\n    }\n    return 0;\n}\n```\n\n输出 ![Image](img/down-arrow.jpg)\n\
  \n输入一行文本：\nThis is a line of text\nThs s  ln f txt\n\n分析 ![Image](img/down-arrow.jpg)\n\
  \n虽然这不是最实用的程序，但它有效地使用了 `continue` 语句。第 9 行和第 10 行声明了程序的变量。`buffer[]` 存储用户在第 15 行输入的字符串。另一个变量\
  \ `ctr` 遍历数组 `buffer[]` 的元素，而第 20 到 34 行的 `for` 循环搜索元音。对于循环中的每个字母，第 26 到 28 行的 `if`\
  \ 语句会将该字母与小写元音进行比较。如果匹配，则执行 `continue` 语句，将控制返回到第 20 行的 `for` 语句。如果字母不是元音，控制传递到循环的下一个部分即第\
  \ 33 行。第 33 行包含一个新的库函数 `putchar()`，它在屏幕上显示单个字符。\n\n## 语法\n\n#### continue 语句\n\n\
  `continue;`\n\n`continue` 用于循环内部。它导致程序的控制跳过当前循环迭代的剩余部分，并开始下一次迭代。\n\n**示例**\n\n点击此处查看代码图像\n\
  \n```c\nint x;\nprintf(\"Printing only the even numbers from 1 to 10\\n\");\nfor(\
  \ x = 1; x <= 10; x++ )\n{\n    if( x % 2 != 0 )    /* 检查数字是否不是偶数 */\n        continue;\
  \      /*下一个实例 x */\n    printf( \"\\n%d\", x );\n}\n```\n\n### goto 语句\n\n`goto`\
  \ 语句是 C 语言的无条件跳转或**分支**语句之一。当程序执行到 `goto` 语句时，执行会立即跳转或分支到 `goto` 语句指定的位置。该语句是无条件的，因为当遇到\
  \ `goto` 语句时，执行总是会分支；该分支不依赖于任何程序条件（例如 `if` 语句）。\n\n`goto` 语句的目标由行首紧跟冒号的文本标签（label）标识。目标标签可以单独占一行，也可以位于包含\
  \ C 语句的行的行首。在程序中，每个目标必须是唯一的。\n\n`goto` 语句及其目标必须在同一个函数中，但它们可以位于不同的块中。请查看列表 13.3，这是一个使用\
  \ `goto` 语句的简单程序。\n\n**列表 13.3 gotoIt.c: 使用 goto 语句**\n\n```c\n1: gotoIt.c--演示 goto\
  \ 语句\n2:\n3: #include <stdio.h>\n4:\n5: int main( void )\n6: {\n7:     int n;\n\
  8:\n9: start:\n10:\n11: puts(\"Enter a number between 0 and 10: \");\n12: scanf(\"\
  %d\", &n);\n13:\n14: if (n < 0 || n > 10 )\n15: goto start;\n16: else if (n == 0)\n\
  17: goto location0;\n18: else if (n == 1)\n19: goto location1;\n20: else\n21: goto\
  \ location2;\n22:\n23: location0:\n24: puts(\"You entered 0.\\n\");\n25: goto end;\n\
  26:\n27: location1:\n28: puts(\"You entered 1.\\n\");\n29: goto end;\n30:\n31: location2:\n\
  32: puts(\"You entered something between 2 and 10.\\n\");\n33:\n34: end:\n35: return\
  \ 0;\n36: }\n```\n\n输出 ![Image](img/down-arrow.jpg)\n点击此处查看代码图像\n\n输入一个 0 到 10 之间的数字：\n\
  1\nYou entered 1.\n\n输出 ![Image](img/down-arrow.jpg)\n点击此处查看代码图像\n\n输入一个 0 到 10\
  \ 之间的数字：\n9\nYou entered something between 2 and 10.\n\n分析 ![Image](img/down-arrow.jpg)\n\
  \n这是一个接受 0 到 10 之间数字的简单程序。如果数字不在 0 到 10 之间，程序使用第 15 行的 `goto` 语句跳转到第 9 行的 `start`。否则，程序在第\
  \ 16 行检查数字是否等于 0。如果是，第 17 行的 `goto` 语句将控制发送到 `location0`（第 23 行），它在第 24 行打印一条语句并执行另一个\
  \ `goto`。第 25 行的 `goto` 将控制发送到程序末尾的 `end`。程序对值 1 以及所有 2 到 10 之间的值整体执行相同的逻辑。\n\n\
  `goto` 语句的目标可以出现在代码中该语句的之前，也可以出现在之后。如前所述，唯一的限制是 `goto` 和目标必须在同一个函数中。然而，它们可以位于不同的块中。你可以使用\
  \ `goto` 将执行转移进入和退出循环（例如 `for` 语句），但你不应该这样做。事实上，我们强烈建议你不要在程序的任何地方使用 `goto` 语句。原因有两个：\n\
  \n![Image](img/squf.jpg) 你不需要它。没有哪种编程任务需要 `goto` 语句。你始终可以使用 C 语言的其他分支语句编写必要的代码。\n\
  \n![Image](img/squf.jpg) 它是危险的。`goto` 语句看起来可能是某些编程问题的理想解决方案，但很容易被滥用。当程序执行通过 `goto`\
  \ 语句进行分支时，不会保留执行是从哪里来的记录，因此执行可能会随心所欲地穿过程序。这种类型的编程被称为*面条代码*（spaghetti code）。\n\n\
  一些仔细的程序员可以写出使用 `goto` 的完美程序。在某些情况下，审智地使用 `goto` 可能是编程问题的最简单解决方案。然而，它绝不是唯一的解决方案。如果你忽略了此警告，至少请小心！\n\
  \n**做**\n**尽管可能**避免使用 `goto` 语句。（这总是可能的！）。\n\n**不要**\n**不要**混淆 `break` 和 `continue`。`break`\
  \ 结束循环，而 `continue` 开始循环的下一次迭代。\n\n#### 语法\n\n#### goto 语句\n\n`goto location;`\n\
  \n`location` 是一个标签语句，标识执行跳转的位置。*标签语句*由一个标识符后跟一个冒号以及可选的 C 语句组成：\n\n`location: statement;`\n\
  \n你也可以将标签单独放在一行。这样做时，有些程序员喜欢在后面跟一个空语句（单独的分号）；尽管这并不是强制要求的：\n\n`location:`\n\n###\
  \ 无限循环\n\n什么是无限循环，你为什么会在程序中需要它？无限循环是指如果听之任将永远运行的循环。它可以是 `for` 循环、`while` 循环或 `do...while`\
  \ 循环。例如，如果你编写\n\n点击此处查看代码图像\n\n```c\nwhile (1)\n{\n    /* 额外的代码在这里 */\n}\n```\n\n\
  你就创建了一个无限循环。`while` 测试的条件是常量 `1`，它始终为真且无法被程序更改。由于 `1` 永远无法改变，因此循环永远不会终止。\n\n在前面的节中，你看到\
  \ `break` 语句可以用于退出循环。没有 `break` 语句，无限循环将是毫无用处的。有了 `break`，你可以利用无限循环。\n\n你也可以像下面一样创建一个无限的\
  \ `for` 循环：\n\n\n\n\n\n点击此处查看代码图像\n\n```c\nfor (;;)\n{\n    /* 此处添加额外的代码 */\n}\n\
  ```\n\n或者一个无限 `do...while` 循环，如下：\n\n点击此处查看代码图像\n\n```c\ndo\n{\n    /* 此处添加额外的代码\
  \ */\n} while (1);\n```\n\n这三种循环类型的原理是相同的。在接下来的示例中，使用了 `while` 循环。\n\n### 无限循环\n\
  \n当需要测试许多条件来确定循环是否应该终止时，可以使用无限循环。在 `while` 语句后的括号中包含所有测试条件可能会很困难。在循环体中单独测试这些条件，然后根据需要执行\
  \ `break` 退出可能会更容易一些。通常情况下，如果有其他替代方案，你应该尝试避免使用无限循环。\n\n无限循环还可以创建一个引导程序运行的菜单系统。你可能还记得第\
  \ 5 节 中的“在函数中封装代码”，程序的 `main()` 函数通常充当“交通警察”的角色，在执行程序实际工作的各种函数之间引导执行。这通常通过某种类型的菜单来实现：向用户显示一个选择列表，用户通过选择其中一项进行输入。可用选择之一应该是终止程序。当做出选择时，使用\
  \ C 语言的决策语句之一相应地引导程序执行。\n\n列表 13.4 展示了一个菜单系统。\n\n输入 ![Image](img/down-arrow.jpg)\n\
  \n**列表 13.4** menu.c: 使用无限循环实现菜单系统\n\n点击此处查看代码图像\n\n```c\n1:  /* menu.c--演示如何使用无限循环实现\
  \ */\n2:  /* 菜单系统。 */\n3:  #include <stdio.h>\n4:  #define DELAY  150000000    \
  \   /* 用于延迟循环。 */\n5:\n6:  int menu(void);\n7:  void delay(void);\n8:\n9:  int main(\
  \ void )\n10: {\n11:     int choice;\n12:\n13:     while (1)\n14:     {\n15:\n16:\
  \      /* 获取用户的选择。 */\n17:\n18:      choice = menu();\n19:\n20:      /* 根据输入进行分支处理。\
  \ */\n21:\n22:      if (choice == 1)\n23:      {\n24:          puts(\"\\n 执行任务 A.\"\
  );\n25:          delay();\n26:      }\n27:      else if (choice == 2)\n28:     \
  \     {\n29:              puts(\"\\n 执行任务 B.\");\n30:              delay();\n31:\
  \          }\n32:      else if (choice == 3)\n33:          {\n34:              puts(\"\
  \\n 执行任务 C.\");\n35:              delay();\n36:          }\n37:      else if (choice\
  \ == 4)\n38:          {\n39:              puts(\"\\n 执行任务 D.\");\n40:          \
  \    delay();\n41:          }\n42:      else if (choice == 5)    /* 退出程序。 */\n43:\
  \          {\n44:              puts(\"\\n 退出程序...\\n\");\n45:              delay();\n\
  46:              break;\n47:          }\n48:      else\n49:      {\n50:        \
  \  puts(\"\\n 选择无效，请重试。\");\n51:          delay();\n52:      }\n53:     }\n54: \
  \    return 0;\n55: }\n56:\n57: /* 显示菜单并输入用户的选择。 */\n58: int menu(void)\n59: {\n\
  60:     int reply;\n61:\n62:     puts(\"输入 1 执行任务 A。\");\n63:     puts(\"输入 2 执行任务\
  \ B。\");\n64:     puts(\"输入 3 执行任务 C。\");\n65:     puts(\"输入 4 执行任务 D。\");\n66:\
  \     puts(\"输入 5 退出程序。\");\n67:\n68:     scanf(\"%d\", &reply);\n69:\n70:     return\
  \ reply;\n71: }\n72:\n73: void delay( void )\n74: {\n75:     long x;\n76:     for\
  \ ( x = 0; x < DELAY; x++)\n77:         ;\n78: }\n```\n\n输出 ![Image](img/down-arrow.jpg)\n\
  \n点击此处查看代码图像\n\n```\n输入 1 执行任务 A。\n输入 2 执行任务 B。\n输入 3 执行任务 C。\n输入 4 执行任务 D。\n输入\
  \ 5 退出程序。\n1\n执行任务 A.\n输入 1 执行任务 A。\n输入 2 执行任务 B。\n...\n```\n\n\n\n\n```c\n23: \
  \           puts(\"You entered 5.\");\n24:        default:\n25:            puts(\"\
  Out of range, try again.\");\n26:      }\n27:\n28:      return 0;\n29: }\n```\n\n\
  输出 ![Image](img/down-arrow.jpg)\n\n点击此处查看代码图像\n\n输入 1 到 5 之间的数字：\n2\n你输入了 2。\n你输入了\
  \ 3。\n你输入了 4。\n你输入了 5。\n超出范围，请重试。\n\n分析 ![Image](img/down-arrow.jpg)\n\n嗯，这显然不对对，对吧？看起来\
  \ `switch` 语句找到了第一个匹配的模板，然后执行了其后的的所有内容（而不只是与模板关联的语句）。事实确实是这样；然而，这正是 `switch` 预期的工作方式。实际上，它执行了一个跳转到匹配模板的\
  \ `goto`。为了确保只执行与匹配模板关联的语句，请需要在的地方包含一个 `break` 语句。列表 13.6 显示了使用 `break` 语句重写的程序。现在它运行正常了。\n\
