  \n\n\n\n本节向你展示了如何使用结构体（structures），这是一种满足程序需求而设计的数据类型。结构体可以包含 C 语言的任何数据类型，包括其他结构体、指针和数组。结构体中的每个数据项被称为\
  \ `member`（成员），通过在结构体名称和成员名称之间使用结构体成员运算符（`.`）来访问。结构体可以单独使用，也可以在数组中使用。\n\n联合体（Unions）与结构体相似。联合体和结构体的主要区别在于，联合体将其所有成员存储在同一区域内。这意味着联合体一次只能使用其中一个成员。\n\
  \n## Q&A\n\n**Q 有什么理由在不声明实例的情况下声明结构体吗？**\n\n**A** 在本节中，你看到了两种声明结构体的方法。第一种是同时声明结构体、标签（tag）和实例。第二种是只声明结构体和标签而不声明实例。之后可以使用\
  \ `struct` 关键字、标签和实例名称来声明实例。使用第二种方法是常见的编程习惯。许多程序员在声明结构体和标签时不声明任何实例，而是在程序的后面再声明实例。下一节将描述变量的作用域。作用域适用于实例，但不适用于标签或结构体主体。\n\
  \n**Q 使用 typedef 还是结构体标签更常见？**\n\n**A** 许多程序员使用 `typedef` 来使代码更易读，但这在实践中没有太大区别。有很多包含函数的插件库可供购买。这些插件通常会有许多\
  \ `typedef` 以体现产品的独特性。这在数据库插件产品中尤其如此。\n\n**Q 我可以简单地用赋值运算符将一个结构体赋值给另一个吗？**\n\n**A**\
  \ 既可以也不行。新版本的 C 编译器允许你将一个结构体赋值给另一个，但旧版本可能不允许。在旧版本的 C 中，你可能需要单独为结构体的每个成员赋值。联合体也是如此。\n\
  \n**Q 联合体有多大？**\n\n**A** 因为联合体中的每个成员都存储在同一个内存位置，所以存储联合体所需的空间等于最大成员的大小。\n\n## Workshop\n\
