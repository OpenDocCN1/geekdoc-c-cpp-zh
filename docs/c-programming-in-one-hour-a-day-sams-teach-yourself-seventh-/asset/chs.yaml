  \n* * *\n\n* * *\n\n### 注意\n\n接下来的分析重点于与函数直接相关的程序部分，而不是解释整个程序。\n\n* * *\n\n### 分析\
  \ ![Image](img/down-arrow.jpg)\n\n* * *\n\n第 4 行包含*函数原型*（function prototype），它是程序稍后出现的函数模型。函数原型包含函数的名称、必须传递给它的任何变量列表和类型，以及它返回的变量类型（如果有）。查看第\
  \ 4 行，你可以看出函数名为 `cube`，它需要一个 `long` 类型的变量，并且它将返回一个 `long` 类型的值。传递给函数的变量称为*参数*（arguments），它们被括在函数名后的括号中。在这个示例中，函数有一个参数：`long\
  \ x`。函数名之前的关键字表示函数返回的变量类型。在这种情况下，返回的是 `long` 类型的变量。\n\n第 12 行调用了函数 `cube`并将变量 `input`\
  \ 作为函数的参数传递给它。函数的返回值赋值给变量 `answer`。请注意，`input` 和 `answer` 都在第 6 行声明为 `long` 类型的变量。这与第\
  \ 4 行函数原型中使用的类型相匹配。\n\n函数本身被称为*函数定义*（function definition）。在这种情况下，函数名为 `cube`，包含在第\
  \ 21 到 27 行之间。与原型一样，函数定义包含几个部分。函数从第 21 行的函数头开始。*函数头*（function header）位于函数的开头，并给出函数的名称（在这种情况下，名称是\
  \ `cube`）。头部也给出了函数的名称。\n\n\n\n\n\n`function definition` 是实际的函数。定义包含了将要执行的代码。如果原型包含变量名，那么函数定义的第一行（称为\
  \ `function header`）应该与函数原型相同，但分号除外。函数头不应以分号结尾。此外，尽管原型中的参数变量名是可选的，但在函数头中必须包含。紧跟在函数头之后的是函数体，它包含了函数将执行的语句。函数体应该以左括号开始并以右括号结束。如果函数的返回类型是\
  \ `void` 以外任何类型，应该包含一个 `return` 语句，返回一个与返回类型匹配的值。如果你愿意，始终可以在 `void` 类型的函数中包含一个不带返回值的\
  \ `return` 语句。这并无害，而且在所有函数中包含 `return` 语句是一个良好的习惯——患于未于于然！\n\n## 函数原型示例\n\n点击此处查看代码图像\n\
  \n```c\ndouble squared( double number );\nvoid print_report( int report_number );\n\
  int get_menu_choice( void );\n```\n\n## 函数定义示例\n\n点击此处查看代码图像\n\n```c\ndouble squared(\
  \ double number )            /* function header */\n{                          \
  \                 /* opening bracket */\n    return( number * number );        \
  \   /* function body */\n}                                           /* closing\
  \ bracket */\n\nvoid print_report( int report_number )\n{\n    if( report_number\
  \ == 1 )\n        puts( \"Printing Report 1\" );\n    else\n        puts( \"Not\
  \ printing Report 1\" );\n    return;\n}\n```\n\n***\n\n### 函数与结构化编程\n\n通过在 C 程序中使用函数，你可以练习\
  \ `structured programming`，其中单个程序任务由独立的程序代码段执行。“独立的程序代码段”听起来就像前面提到的函数定义的一部分，不是吗？函数和结构化编程密切相关。\n\
  \n### 结构化编程的优势\n\n为什么结构化编程如此伟大？有两个重要的原因：\n\n![Image](img/squf.jpg) 编写结构化程序更容易，因为复杂的编程问题被分解成许多较小、更简单的任务。每个任务都由一个函数执行，在函数内部，代码和变量与程序的其余部分隔离离开。通过逐个处理这些相对简单的任务，你可以进展得更快。\n\
  \n![Image](img/squf.jpg) 调试结构化程序更容易。如果你的程序存在 `bug`（导致其运行不正常的问题），结构化设计可以易于将问题定位到特定的代码段（例如特定的函数）。\n\
  \n结构化编程的另一个优势是可以通过重用代码段来节省时间。如果你在一个程序里写了一个函数来执行特定任务，你就可以快速方便地将其用于另一个执行相同任务的程序中。即使新程序需要完成略有不同的任务，你通常也会发现修改之前创建的函数比从头写一个新的更容易。考虑一下你使用了多少次\
  \ `printf()` 和 `scanf()` 这两个函数，尽管你可能没有见过它们包含的代码。如果你的函数是为了执行单个任务而创建的，在其他程序中使用它们就会容易得多。\n\
  \n### 规划结构化程序\n\n如果你打算编写结构化程序，首先需要进行一些规划。这种规划应该在编写第一行代码之前进行，通常只需要纸和笔就能完成。你的计划应该是程序执行的特定任务列表。从程序功能的全局想法开始。如果你正在计划一个管理联系人（姓名和地址列表）的程序，你希望程序做什么？这里是一些显而易见的：\n\
  \n![Image](img/squf.jpg) 输入新的姓名和地址。\n\n![Image](img/squf.jpg) 修改现有条目。\n\n![Image](img/squf.jpg)\
  \ 按姓氏排序条目。\n\n![Image](img/squf.jpg) 打印邮件标签。\n\n有了这个列表，你就将程序分为四个主要任务，每个任务都可以分配给一个函数。现在你可以更进一步，将这些任务划分为子任务。例如，“输入新的姓名和地址”任务可以细分为以下子任务：\n\
  \n![Image](img/squf.jpg) 输入新的姓名和地址。\n\n![Image](img/squf.jpg) 修改现有条目。\n\n![Image](img/squf.jpg)\
  \ 按姓氏排序条目。\n\n![Image](img/squf.jpg) 打印邮件标签。\n\n同样，“修改现有条目”任务可以如下进行细分：\n\n![Image](img/squf.jpg)\
  \ 输入新的姓名和地址。\n\n![Image](img/squf.jpg) 修改现有条目。\n\n![Image](img/squf.jpg) 按姓氏排序条目。\n\
  \n![Image](img/squf.jpg) 打印邮件标签。\n\n\n\n\n**`不要`** 尝试在一个函数中完成所有工作。一个函数应该执行单一的任务，例如从文件中读取信息。\n\
  \n* * *\n\n## 编写函数\n\n编写函数的第一步是确定你想让函数做什么。一旦明确了这一点，编写函数的实际操作机制并不特别困难。\n\n### 函数头\n\
  \n每个函数的第一行都是函数头，它包含三个部分，每个部分都有其特定的功能。它们在图 5.3 中显示，并在后续章节中进行了解释。\n\n![Image](img/05fig03.jpg)\n\
  \n**图 5.3** 函数头的三个组成部分。\n\n### 函数返回值\n\n函数的返回值指定了函数返回给调用程序的数据类型。函数的返回值可以是 C 语言的任何数据类型。这包括\
  \ `char`、`int`、`long`、`float` 或 `double`。你也可以使用 `void` 作为返回值来定义一个不返回值的函数。以下是一些示例：\n\
  \n点击此处查看代码图像\n\n```\nint func1(...)         /* 返回 int 类型。   */\nfloat func2(...)\
  \        /* 返回 float 类型。 */\nvoid func3(...)         /* 什么都不返回。      */\n```\n\n\
  在这些示例中，你可以看到 `func1` 返回一个整数，`func2` 返回一个浮点数，而 `func3` 不返回任何内容。\n\n### 函数名\n\n你可以为函数命名任何名称，只要你遵循\
  \ C 变量的命名规则（参见第 3 节，“存储数据：变量与常量](#ch03.xhtml_ch03)”）。在 C 程序中，函数名必须是唯一的（不能分配给任何其他函数或变量）。分配一个反映函数功能的名称是一个好主意。\n\
  \n### 参数列表\n\n许多函数使用*参数*（arguments），它们是在函数被调用时传递给函数的值。函数需要知道期望什么种类型的参数——每个参数的数据类型。你可以向函数传递\
  \ C 语言的任何数据类型。参数类型信息通过函数头中的参数列表提供。\n\n对于每个传递给函数的参数，参数列表必须包含一个条目。该条目指定了参数的数据类型和名称。例如，这里是列表\
  \ 5.1 中函数的头：\n\n```\nlong cube(long x)\n```\n\n参数列表由 `long x` 组成，指定该函数接受一个 `long`\
  \ 类型参数，由参数 `x` 表示。如果有多个参数，每个参数之间必须用逗号隔开。函数头\n\n点击此处查看代码图像\n\n```\nvoid func1(int\
  \ x, float y, char z)\n```\n\n指定了一个具有三个参数的函数：名为 `x` 的 `int` 类型、名为 `y` 的 `float`\
  \ 类型以及名为 `z` 的 `char` 类型。某些函数不接受参数，在这种情况下，参数列表应该包含 `void`，如下：\n\n```c\nint func2(void)\n\
  ```\n\n* * *\n\n注意\n\n不要在函数头的结尾放置分号。如果你错误地包含了分号，编译器将生成错误信息。\n\n* * *\n\n有时，参数（parameter）和实参（argument）之间的区别会引起混淆。*参数*是函数头中的一个条目；它充当实参的“占位符”。函数的参数是固定的；它们在程序执行期间不会改变。\n\
  \n*实参*是调用程序传递给函数的实际值。每次调用函数时，都可以传递不同的实参。在 C 语言中，函数每次被调用必须传递相同数量和类型的实参，但实参的值可以不同。在函数内部，通过相应的参数名来访问实参。\n\
  \n一个示例会让这一点更清晰。列表 5.2 展示了一个包含一个函数的简单程序，该函数被调用了三次。\n\n输入 ![Image](img/down-arrow.jpg)\n\
  \n**列表 5.2** halfof.c: 实参与参数的区别\n\n点击此处查看代码图像\n\n* * *\n\n```\n1:    // 说明了实参与参数之间的区别。\n\
  2:\n3:    #include <stdio.h>\n4:\n5:    float x = 3.5, y = 65.11, z;\n6:\n7:   \
  \ float half_of(float k);\n8:\n9:    int main( void )\n10: {\n11:        // 在此调用中，x\
  \ 是 half_of() 的实参。\n12:        z = half_of(x);\n13:        z = half_of(y);\n14:\
  \        z = half_of(z);\n15:    }\n16:\n17: float half_of(float k) {\n18:    return\
  \ k / 2;\n19: }\n```\n（注：原文提供的代码块是碎片化/噪音；我已根据文中提供的上下文将其重构为标准的 C 结构以保持语义值）。*\n\n\n\
  \n局部变量的声明方式与其他任何变量相同，使用了你在第 3 中学习过的相同变量类型和命名规则。局部变量可以在声明时进行初始化。你可以在函数中声明 C 的任何变量类型。以下是在函数内声明四个局部变量的示例：\n\
  \n点击此处查看代码图像\n\n```c\nint func1(int y)\n{\n    int a, b = 10;\n    float rate;\n\
  \    double cost = 12.55;\n    /* function code goes here... */\n}\n```\n\n上述声明创建了局部变量\
  \ `a`、`b`、`rate` 和 `cost`，它们可以被函数代码使用。注意，函数参数被视为变量声明，因此函数参数列表中的变量（如果有）也是可用的。\n\n\
  当你在函数中声明并使用变量时，它与程序中其他地方声明的任何变量完全独立且不同。即使变量具有相同的名称也是也是如此。列表 5.3 演示了这种独立性。\n\n输入\
  \ ![Image](img/down-arrow.jpg)\n\n**列表 5.3** var.c: 局部变量演示\n\n点击此处查看代码图像\n\n* *\
  \ *\n\n```c\n1:   /* Demonstrates local variables. */\n2:\n3:   #include <stdio.h>\n\
  4:\n5:   int x = 1, y = 2;\n6:\n7:   void demo(void);\n8:\n9:   int main( void )\n\
  10: {\n11:     printf(\"\\nBefore calling demo(), x = %d and y = %d.\", x, y);\n\
  12:     demo();\n13:     printf(\"\\nAfter calling demo(), x = %d and y = %d\\n.\"\
  , x, y);\n14:\n15:     return 0;\n16: }\n17:\n18: void demo(void)\n19: {\n20:  \
  \   /* Declare and initialize two local variables. */\n21:\n22:     int x = 88,\
  \ y = 99;\n23:\n24:     /* Display their values. */\n25:\n26:     printf(\"\\nWithin\
  \ demo(), x = %d and y = %d.\", x, y);\n27: }\n```\n\n输出 ![Image](img/down-arrow.jpg)\n\
  \n点击此处查看代码图像\n\n* * *\n\n调用 demo() 之前，x = 1 y = 2。\n\n在 demo() 中，x = 88 y = 99。\n\
  调用 demo() 后，x = 1 y = 2。\n\n* * *\n\n分析 ![Image](img/down-arrow.jpg)\n\n* * *\n\n\
  列表 5.3 与本课前两个程序相似。第 5 行声明了变量 `x` 和 `y`。这些变量在任何函数之外声明，因此被视为全局变量。第 7 行包含了演示函数的原型，命名为\
  \ `demo()`。它不接受任何参数，因此原型中带有 `void`。它也不返回任何值，因此其返回类型为 `void`。第 9 行开始了 `main()` 函数，它非常简单。首先，在第\
  \ 11 行调用 `printf()` 显示 `x` 和 `y` 的值，然后调用 `demo()` 函数。注意 `demo()` 在第 22 行声明了它自己的\
  \ `x` 和 `y` 局部版本。第 26 行显示局部变量优先于任何其他变量。在调用 demo 函数后，第 13 行再次打印 `x` 和 `y` 的值。由于你已经不在\
  \ `demo()` 中了，因此打印的是原始的全局值。\n\n如你所见，函数中的局部变量 `x` 和 `y` 与函数外部声明的全局变量 `x` 和 `y` 完全独立。有三条规则规定了函数中变量的使用：\n\
  \n![Image](img/squf.jpg) 要在函数中使用变量，必须在函数头或或函数体中声明它（全局变量除外，全局变量将在第 12 中介绍）。\n\n![Image](img/squf.jpg)\
  \ 如果函数要从调用程序获取值，该值必须作为参数传递。\n\n![Image](img/squf.jpg) 如果调用程序要从函数获取值，该值必须从函数显式返回。\n\
  \n老实说，这些“规则”并没有被严格遵守，因为你将在本书的后后部分学习如何绕过它们。然而，目前请遵循这些规则，你就不会遇到麻烦。\n\n将函数的变量与其他程序变量分开是函数具有独立性的方法之一。函数可以使用自己的一组局部变量执行任何你想要的数据处理。无需担心这些操作会对程序的其他部分产生意料之外的影响。此外，如果你使用函数局部变量，那么当你需要在新程序中完成相同任务时，更容易将该函数剪切粘贴到另一个程序中。\n\
  \n### 函数语句\n\n函数内部可以包含的语句几乎没有限制。函数内部唯一不能做的是定义另一个函数。然而，可以使用所有其他 C 语句，包括循环（将在第 6 ）中介绍）、`if`\
  \ 语句和赋值语句。你可以调用库函数和其他用户定义的函数。\n\n关于函数的长度？没有确定的答案，但从经验来看，函数很少超过 25 或 30 行。随着编程经验的增加，你将更擅长判断何时拆分。\n\
  \n### 返回值\n\n从函数返回值，使用 `return` 关键字，后跟一个表达式。当执行到 `return` 语句时，会终止函数并将值传回调用程序。函数的返回值是表达式的值。考虑这个：\n\
  \n```c\nint func1(int var)\n{\n    int x;\n    /* code goes here... */\n    return\
  \ x;\n}\n```\n\n当此函数被调用时，体内的语句执行到 `return`。`return` 右侧的表达式可以是任何有效表达式。函数可以包含多个 `return`\
  \ 语句。第一个执行的 `return` 将起作用。多个 `return` 语句可以是从函数返回不同值的有效方法，如列表 5.4 所示。\n\n输入 ![Image](img/down-arrow.jpg)\n\
  \n**列表 5.4** roomassign.c: 函数中的返回语句\n\n点击此处查看代码图像\n\n* * *\n\n```c\n1:   /* Demonstrates\
  \ return statements in a function. */\n2:\n3:   #include <stdio.h>\n4:\n5:   char\
  \ last_init;\n6:\n7:   int room;\n8:\n9:   int room_assign( char last_init);\n10:\n\
  11:  int main( void )\n12: {\n13:     puts(\"Enter the first initial of your last\
  \ name: \");\n14:     scanf(\"%c\", &last_init);\n15:\n16:     room = room_assign(last_init);\n\
  17:\n18:     printf(\"\\nYou need to report to room %d.\", room);\n19:\n20:    \
  \ return 0;\n21: }\n22:\n23: int room_assign( char li)\n24: {\n25:     // This if\
  \ statement tests whether the first initial is A-M 或 N-Z\n26:     // with 第一组被分配房间\
  \ 1045，其余分配 1055\n27:\n28:     // The or part of the statement lets us check both\
  \ lower and uppercase \n29:\n30:     if ((li >= 'a' && li <= 'm') || (li >= 'A'\
  \ && li <= 'M'))\n31:         return 1045;\n32:     else\n33:         return 1055;\n\
  34: }\n```\n\n\n\n\n\n输出 ![Image](img/down-arrow.jpg)\n\n点击此处查看代码图像\n\n输入你姓名的首字母：\n\
  \nd\n\n你需要前往 1045 房。\n\n输出 ![Image](img/down-arrow.jpg)\n\n点击此处查看代码图像\n\n输入你姓名的首字母：\n\
  \nR\n\n你需要前往 1055 房。\n\n分析 ![Image](img/down-arrow.jpg)\n\n与其他示例一样，列表 5.4 以注释开头，用于描述程序的功能（第\
  \ 1 行）。包含了 `stdio.h` 头文件，以便使用标准输入输出函数，这些函数允许程序在屏幕上显示信息并获取用户输入。第 8 行是 `room_assign()`\
  \ 的函数原型。注意 `room_assign()` 接收一个 `char` 变量作为参数并返回一个 `int`。第 15 行使用 `last_init` 调用了\
  \ `room_assign()`。该函数包含多个 `return` 语句。函数使用 `if` 语句检查 `li`（`main()` 中的 `last_init`\
  \ 传递给函数中的 `li`）是否在“A”和“M”之间或“a”和“m”之间。如果是，第 30 行执行 `return` 语句，函数立即结束。在这种情况下，第 31\
  \ 行和 32 行被忽略。如果首字母不在“a”到“m”之间（首字母在“n”到“z”之间），则触发 `else` 子句，并执行第 32 行的 `return` 语句。你应该能看到取决于传递给函数\
  \ `room_assign()` 的参数，会执行第一个或第二个 `return` 语句，并将适当的值传回调用它的函数。\n\n关于此程序的最后一点说明。第 12\
  \ 行是一个你以前未见过的新函数。`puts()`——意思是 *put string*（输出字符串）——是一个简单的函数，用于将字符串显示到标准输出（通常是计算机屏幕）。字符串将在第\
  \ 10 中的“处理字符和字符串”中介绍。（目前，知道它们只是带引号的文本即可。）\n\n记住，函数的返回值有一个类型，该类型在函数头和函数原型中指定。函数返回的值必须类型相同，否则编译器会生成错误信息。\n\
  \n## 注意\n\n结构化编程建议函数中只有一个入口和一个出口。这意味着你应该尝试在函数内部只保留一个 `return` 语句。然而，在某些情况下，具有多个\
  \ `return` 语句的程序可能更易阅读和维护。在这种情况下，可维护性应优先。\n\n## 函数原型\n\n程序应该为它所使用的每个函数包含一个原型。你在列表\
  \ 5.1 的第 4 行看到过函数原型的示例，其他列表中也有函数原型。什么是函数原型？为什么需要它？\n\n从早先的示例中你可以看到，函数的原型与函数头是完全相同的，只是在末尾添加了分号。与函数头一样，函数原型包含了关于函数的返回类型、名称和参数的信息。原型的工作是告诉编译器关于该函数的信息。通过提供函数返回类型、名称和参数的信息，编译器可以在每次源代码调用该函数时进行检查，并验证你是否传递了正确数量和类型的参数，以及是否正确地使用了返回值。如果不匹配，编译器会生成错误信息。\n\
  \n严格来说，函数原型不需要与函数头完全匹配。参数名称可以不同，只要它们的类型和数量相同且顺序一致。没有理由让函数头和原型不匹配；保持它们一致会让源代码更易理解。匹配这两者也能让编写程序变得更容易。当你完成一个函数定义时，使用编辑器的剪切和粘贴功能复制函数头并创建原型。务必在原型的末尾添加分号。\n\
  \n函数原型应该放在源代码的什么位置？它们应该放在第一个函数开始之前。为了可读性，最好将所有原型分组在一个位置。\n\n## 应当 (Do)\n\n- **应当**\
  \ 尽可能使用局部变量。\n- **应当** 将每个函数限制为单一任务。\n\n## 不要 (Don’t)\n\n- **不要**尝试返回一个与函数类型不同的值。\n\
  - **不要**让函数变得过长。如果一个函数开始变得很长，尝试将其拆分为独立的、较小的任务。\n- **不要**在不需要的情况下使用多个 `return` 语句。你应该尽可能只使用一个\
  \ `return`；然而，有时使用多个 `return` 语句更容易更清晰。\n\n## 向函数传递参数\n\n要向函数传递参数，可以在函数名后的括号中列出它们。参数的数量和每个参数的类型必须与函数头和原型中的参数匹配。例如，如果定义一个函数接收两个\
  \ `int` 参数，则你必须恰好传递两个 `int` 参数——不多不少。如果你尝试传递错误的数量或类型，编译器可以检测到。图 5.5 显示了将参数传递给函数。\n\
  \n![Image](img/05fig.jpg)\n\n**图 5 函数中的多个参数**\n\n## 调用函数\n\n调用函数有两种方法。任何函数都可以通过在语句中使用其名称和参数列表来调用，如下例所示。如果函数有返回值，它会被丢弃。\n\
  \n```c\nwait(12);\n```\n\n第二种方法适用于具有返回值的函数。因为这些函数会产生值（即它们的返回值），它们是有效的 C 表达式，可以用于任何可以使用\
  \ C 表达式的地方。你已经见过将返回值的表达式作为赋值语句的右侧。这里有更多例子。\n\n在以下示例中，`half_of()` 是函数的参数：\n\n点击此处查看代码图像\n\
  \n```c\nprintf(\"Half of %d is %d.\", x, half_of(x));\n```\n\n首先，调用函数 `half_of()`\
  \ 并传递 `x` 的值。当 `half_of()` 返回后，程序调用 `printf()` 并使用 `\"Half of %d is %d.\"`、`x` 和\
  \ `half_of(x)`。\n\n在第二个示例中，表达式使用了多个函数：\n\n```c\ny = half_of(x) + half_of(z);\n```\n\
  \n虽然 `half_of()` 被使用了两次，但第二次调用可以是任何其他函数。以下代码显示了相同的语句，但并非在同一行：\n\n```c\na = half_of(x);\n\
  b = half_of(z);\ny = a + b;\n```\n\n\n\n\n\n以下两个示例展示了使用函数返回值的有效方法。在这里，函数被用于 `if`\
  \ 语句：\n\n点击此处查看代码图片\n\n```c\nif ( half_of(x) > 10 )\n{\n    /* statements; */  \
  \        /* 这些可以是任何语句! */\n}\n```\n\n如果函数的返回值符合标准（在这种情况下，如果 `half_of()` 返回的值大于 10），则\
  \ `if` 语句为真，并执行其内部的语句。如果返回的值不符合标准，则 `if` 块中的语句将不会被执行。\n\n接下来的示例甚至更好：\n\n点击此处查看代码图片\n\
  \n```c\nif ( do_a_process() != OKAY )\n{\n    /* statements; */          /* 执行错误例程\
  \ */\n}\n```\n\n同样，这里没有提供具体的语句，`do_a_process()` 也不是真实的函数；然而，这是一个重要的示例。检查进程的返回值以确定其是否运行正常。如果没有正常运行，则由语句处理任何错误处理或清理工作。这通常用于访问文件信息、比较值以及分配内存。\n\
  \n***\n\n### 注意事项\n\n如果你尝试将 `void` 返回类型的函数作为表达式使用，编译器会生成错误消息。\n\n***\n\n### 应当\n\
  \n- **务必**向函数传递参数，以使函数具有通用性从而实现可重用。\n- **务必**利用将函数放入表达式中的能力。\n\n***\n\n### 不要\n\n\
  - **不要**通过在单个语句中堆放大量函数来使语句变得难以理解。只有在函数不会让代码更加混乱的情况下，你才应该将它们放入语句中。\n\n***\n\n###\
  \ 递归\n\n*递归*一词是指函数直接或间接地调用自身的情况。*间接递归*发生在一个函数调用另一个函数，而该函数又调用第一个函数时。C 语言允许递归函数，它们在某些情况下非常有用。\n\
  \n例如，可以使用递归计算数字的阶乘。数字 `x` 的阶乘写为 `x!`，计算方法如下：\n\n点击此处查看代码图片\n\n`x! = x * (x-1) *\
  \ (x-2) * (x-3) * ... * (2) * 1`\n\n然而，你也可以这样计算 `x!`：\n\n`x! = x * (x-1)!`\n\n更进一步，你可以使用相同的步骤计算\
  \ `(x-1)!`：\n\n`(x-1)! = (x-1) * (x-2)!`\n\n你继续递归地计算，直到变为 `1`，此时计算就结束了。列表 5.5 中的程序使用了递归函数来计算阶乘。由于程序使用了\
  \ `unsigned` 整数，因此输入值被限制为 `8`；`9` 及更大值的阶乘超出了整数的允许范围。\n\n输入 ![Image](img/down-arrow.jpg)\n\
  \n**列表 5.5** recurse.c: 使用递归函数计算阶乘\n\n点击此处查看代码图片\n\n```c\n1:    /* 演示函数递归。计算 */\n\
  2:    /* 数字的阶乘。 */\n3:\n4:    #include <stdio.h>\n5:\n6:    unsigned int f, x;\n\
  7:    unsigned int factorial(unsigned int a);\n8:\n9:    int main( void )\n10: \
  \  {\n11:       puts(\"输入 1 到 8 之间的整数值: \");\n12:       scanf(\"%d\", &x);\n13:\n\
  14:      if( x > 8 || x < 1)\n15:      {\n16:          printf(\"仅接受 1 到 8 之间的值!\"\
  );\n17:      }\n18:      else\n19:      {\n20:          f = factorial(x);\n21: \
  \         printf(\"%u factorial equals %u\\n\", x, f);\n22:      }\n23:\n24:   }\n\
  25:\n26: unsigned int factorial(unsigned int a)\n27: {\n28:     if (a == 1)\n29:\
  \         return 1;\n30:     else\n31:     {\n32:         a *= factorial(a-1);\n\
  33:         return a;\n34:     }\n35: }\n```\n\n***\n\n\n\n\n\n本节向你介绍了函数，这是 C 语言编程的重要部分。函数是执行特定任务的独立代码段。当你的程序需要执行某项任务时，它会调用执行该任务的函数。函数对于结构化编程至关重要——这是一种强调模块化、自顶而下的程序设计方法。结构化编程可以创建更高效的程序，而且对于你这个程序员来说也更容易使用。\n\
  \n你还学习了函数由头部和函数体组成。头部包含关于函数的返回类型、名称和参数的信息。函数体包含了局部变量声明以及调用函数时执行的 C 语言语句。最后，你看到局部变量——即在函数内部声明的变量——与在其他地方定义的任何程序变量完全独立。\n\
  \n### Q&A\n\nQ **如果我需要从函数返回多个值怎么办？**]\n\nA 很多时候，你需要从函数返回多个值，或者更常见的是，你想要更改发送给函数的值，并在函数结束后保留该更改。这一过程将在第\
  \ 19 节“从函数获取更多值”中进行介绍。\n\nQ **我如何知道什么是好的函数名？**]\n\nA 有效的函数命名与有效的变量命名相似。良好的函数名应该尽可能具体地描述函数的功能。\n\
  \nQ **当变量在列表顶部、`main()` 之前声明时，它们可以在任何地方使用，但局部变量只能在特定的函数中使用。为什么不直接将 `main()` 之前的所有内容都声明为全局变量呢？**]\n\
  \nA 变量的作用将在第 12 节中详细讨论。届时你将了解到为什么在函数内部局部声明变量比在 `main()` 之前全局声明变量更好。\n\nQ **使用递归还有哪些其他方法？**]\n\
  \nA 阶乘函数是使用递归的一个典型示例。许多统计计算中都需要阶乘数。递归只是一种循环；但它与其他循环有一个不同点。在递归中，每次调用递归函数时，都会创建一个新的变量集。这在下一节要学的其他循环中是不成立的。\n\
  \nQ **`main()` 必须是程序中的第一个函数吗？**]\n\nA 不是。在 C 语言的标准中，`main()` 函数是第一个执行的函数；但它可以被放置在源文件的任何位置。大多数人将其放在开头或结尾，以便于查找。\n\
