  \ Jayne Hatton gave $450.00.\n```\n\n这个联合体 `shared` 可以用于创建一个联合体实例，该实例可以容纳字符值 `c`\
  \ 或整数值 `i`。这是因为联合体成员共用内存空间。图 11.7 展示 `shared` 在内存中的情况。\n\n#### 访问成员 (Accessing Members)\n\
  \n单个联合体成员可以与结构体相同的方式被访问——使用点运算符（`.`）。然而，由于联合体成员是重叠，一次只能访问其中一个。\n\n```c\nunion shared\
  \ {\n    char c;\n    int i;\n    long l;\n    float f;\n    double d;\n} s;\n\n\
  int main( void ) {\n    s.c = '$';\n    printf(\"\\n c = %c\", s.c);\n    s.i =\
  \ 65572;\n    printf(\"\\n i = %d\", s.i);\n    s.l = 65572;\n    printf(\"\\n l\
