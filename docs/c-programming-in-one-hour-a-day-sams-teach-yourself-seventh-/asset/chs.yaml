  \ n< 27)\n17:             break;\n18:     }\n19:\n20:     printf(\"\\nBeforencpy\
  \ destination = %s\", dest);\n21:     strncpy(dest, source, n);\n22:\n23:     printf(\"\
  \\nAfterncpy destination = %s\", dest);\n24:     return(0);\n25: }\n```\n\n输出 ![Image](img/down-arrow.jpg)\n\
  \nEnter the number of characters to copy (0-26)\n15\nBeforencpy destination = ................\n\
  Afterncpy destination = abcdefghijkl\n\n分析 ![Image](img/down-arrow.jpg)\n\n除了演示\
