  \ (*ptr)[4]);\n7:  void printarray_2(int (*ptr)[4], int n);\n8:\n9:  int main( void\
  \ )\n10: {\n11:     int  multi[3][4] = { { 1, 2, 3, 4 },\n12:                  \
