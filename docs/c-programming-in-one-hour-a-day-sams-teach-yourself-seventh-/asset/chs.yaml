  \ 处理字符串\n\n\n\n\n传递给 `comp()` 的参数是指针指针，这产生了另一个问题。你将搜索键存储在 `buf[]` 中，并且知道数组名（在此例中为\
  \ `buf`）是数组的指针。然而，你需要传递的不是 `buf` 本身，而是指向 `buf` 的指针。问题在于 `buf` 是一个指针常量，而不是指针变量。`buf`\
  \ 本身在内存中没有地址；它是一个求值为数组地址的符号。因此，你不能通过在 `buf` 前使用取地址符（如 `&buf`）来创建一个指向 `buf` 的指针。\n\
  \n该怎么办？首先创建一个指针变量并将 `buf` 的值赋值给它。在程序中，这个指针变量的名字为 `key`。由于 `key` 是一个指针变量，它有一个地址，你可以创建一个包含该地址的指针——在这种情况下为\
  \ `key1`。当你最后调用 `bsearch()` 时，第一个参数是 `key1`，这是一个指向键字符串指针的指针。`bsearch()` 函数将该参数传递给\
  \ `comp()`，一切都能正常工作。\n\n***\n\n### 应该 (Do)\n\n**应该**查看你编译器的文档或 ANSI 文档，查看你可以使用的其他标准函数。\n\
