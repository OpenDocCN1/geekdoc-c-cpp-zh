  \ = { 8, 45, 0 };\n```\n\n* * *\n\n### 使用更复杂的结构\n\n现在你已经接触了简单的结构，可以继续学习更有趣且复杂的结构类型。这些是包含其他结构体作为成员的结构，以及包含数组作为成员的结构。\n\
  \n#### 在其他结构中包含结构体\n\n如前所述，C 结构可以包含 C 语言的任何数据类型。例如，结构体可以包含其他结构体。前一个示例可以扩展以说明这一点。\n\
