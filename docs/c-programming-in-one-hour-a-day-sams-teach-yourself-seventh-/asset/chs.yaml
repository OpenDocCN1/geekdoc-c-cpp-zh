  \n### 总结\n\n本节介绍了数组，这种强大的数据存储方法允许用相同的名称组合相同类型的项。数组中的单个元素使用下标来标识。与普通变量一样，数组在使用之前必须声明。可以在声明数组时可选地初始化。\n\
  \n### 问答\n\n**问 如果我使用的下标超过了数组的范围会怎样？**\n\n**答 如果你使用了超出数组声明范围的下标，程序可能会编译并运行。然而，这种错误的结果是不可预测的。在错误开始引起问题后，这种错误可能很难发现，因此在初始化和访问数组元素时要小心。**\n\
  \n**问 如果我不初始化数组就使用它会怎样？**\n\n**答 这种错误不会产生编译器错误。如果你初始化数组，数组元素可以是任何值。你可能会得到不可预测的结果。你应该始终初始化变量和数组，以便知道它们内部的内容。第\
  \ 12 节向你介绍了一个不需要初始化的例外。目前，请安全起见。**\n\n**问 数组可以有多少维？**\n\n**答 正如本节所述，你可以拥有任意数量的维度。随着维度的增加，你使用的数据存储空间也越多。你应该只按需要的大小声明数组，以避免浪费存储空间。**\n\
  \n\n\n\n\n# 答 如果你声明了两个数组，你无法将它们相加。必须逐个对元素进行加法。练习 10 说明了这一点。不过，你可以创建一个可以将两个数组相加的函数。该函数仍然需要逐个对元素进行元素。\n\
  \n## 问 为什么使用数组比单独变量更好？**\n\n# 答 使用数组，你可以用一个名称将相同类型的值分组。在列表 8.3 中，存储了 1,000 个值。创建\
  \ 1,000 个变量名并并将每个都初始化为随机数将花费大量的打字时间。通过使用数组，你让这项任务变得简单了。\n\n## 问 如果你在编写程序时不知道数组需要多大，该怎么办？**\n\
  \n# 答 C 语言中有一些函数允许你动态为变量和数组分配空间。这些函数将在第 15 中介绍。\n\n## 工作坊\n\n工作坊提供了测验题帮助你巩固对所涵盖内容的理解，并提供了练习让你获得使用所学知识的经验。\n\
