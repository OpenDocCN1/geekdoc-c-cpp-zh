  \ 12 个月中的每个月接受一个值。注意第 18 行上的 `scanf()` 函数使用了数组元素。在第 7 行中，`expenses` 数组被声明为 `float`，因此使用了\
  \ `%f`。地址运算符（`&`）也放置在数组元素之前，就像它是一个普通的 `float` 类型变量而不是数组元素一样。\n\n第 23 到 27 行包含第二个\
  \ `for` 循环，用于打印刚刚输入的值。正如上一节讨论过的，在百分比符号和 `f` 之间添加 `.2`（`%.2f`）可以打印小数点后保留两位的浮点数，这种格式在打印财务总计时更有意义。额外的格式命令将在第\
