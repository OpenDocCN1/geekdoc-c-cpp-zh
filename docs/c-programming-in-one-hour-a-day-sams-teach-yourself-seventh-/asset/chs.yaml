  \n***\n\n### 工作坊\n工作坊提供了问题来帮助你巩固所学内容。\n\n由于解法多种，以下练习题不提供答案。\n\n\n\n\n\n## 5. 编写一个程序，分别提示用户输入姓、名和中间名。然后将姓名存储在一个新字符串中，格式为：首字母、句点、空格、中间名首字母、句点、空格和姓。例如，如果输入\
