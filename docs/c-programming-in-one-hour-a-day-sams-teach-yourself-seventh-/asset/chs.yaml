  46:      /* and display it, quitting when -1 is entered. */\n47:\n48:      while\
  \ (1)\n49:      {\n50:          printf(\"\\nEnter element to read, 0-%d, -1 to quit:\
  \ \",MAX-1);\n51:          scanf(\"%ld\", &offset);\n52:\n53:          if (offset\
  \ < 0)\n54:              break;\n55:          else if (offset > MAX-1)\n56:    \
  \          continue;\n57:\n58:          /* Move the position indicator to the specified\
  \ element. */\n59:\n60:          if ( (fseek(fp, (offset*sizeof(int)), SEEK_SET))\
  \ != 0)\n61:          {\n62:              fprintf(stderr, \"\\nError using fseek().\"\
  );\n63:              exit(1);\n64:          }\n65:\n66:          /* Read in a single\
  \ integer. */\n67:\n68:          fread(&data, sizeof(int), 1, fp);\n69:        \
  \  printf(\"\\nElement %ld has value %d.\", offset, data);\n70:      }\n71:\n72:\
  \      fclose(fp);\n73:      return(0);\n74: }\n```\n\n输出 ![Image](img/down-arrow.jpg)\n\
