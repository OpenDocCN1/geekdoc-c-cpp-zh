  \ 读取足够满足其格式字符串的字符。如果存在多余的、不需要的字符（如果有的话），它们将留在 `stdin` 中等待。这些字符可能会导致问题。仔细观察 `scanf()`\
  \ 的操作就可以看看它是如何的。\n\n当执行 `scanf()` 的调用且用户输入了一行内容时，可能会出现三种情况。对于这些示例，假设正在执行 `scanf(\"\
  %d %d\", &x, &y);`；换句话说，`scanf()` 期望两个十进制整数。以下是各种可能性：\n\n![Image](img/squf.jpg)\
