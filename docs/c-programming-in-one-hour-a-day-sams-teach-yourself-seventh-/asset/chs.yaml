  \ 执行相同排序所需的时间进行比较。**\n\n\n\n\nC 的所有数据对象都有特定的类型。数值型变量可以是 `int` 或 `float`，指针可以是指向\
  \ `double` 或 `char` 的指针，依此类推。程序通常要求在表达式和语句中组合不同的类型。在这些情况下，会发生什么呢？有时 C 会自动处理不同的类型，因此你不需要担心。在其他情况下，你必须显式地将一种数据类型转换为另一种类型，以避免错误的结果。你在前面的章节中已经见过这种情况，即在在使用\
  \ `void` 指针之前，你必须将其转换或强制类型转换为特定类型。在这种情况和其他其他情况下，你需要清楚地了解何时需要显式类型转换，以及当没有应用适当的转换时会导致哪些类型的错误。接下来的章节将介绍\
  \ C 的自动类型和显式类型转换。\n\n## 自动类型转换\n\n顾如其名，自动类型转换是由 C 编译器自动执行的，不需要你进行任何操作。然而，你应该了解正在发生的情况，以便理解\
  \ C 是如何评估表达式的。\n\n***\n\n注意\n\n自动类型转换通常被称为 `implicit`（隐式）转换。\n\n***\n\n### 表达式中的类型提升\n\
  \n当对 C 表达式进行求值时，结果的值具有特定的数据类型。如果表达式中的所有组件具有相同类型，则结果类型也是该类型。例如，如果 `x` 和 `y` 都是 `int`\
  \ 类型，那么以下表达式也是 `int` 类型：\n\n```\nx + y\n```\n\n如果表达式的组件具有不同类型怎么办？在这种情况下，表达式的类型与其最全面的组件类型相同。从最不全面到最全面，数值数据类型的顺序为：\n\
  \n* `char`\n* `short`\n* `int`\n* `long`\n* `long long`\n* `float`\n* `double`\n\
  * `long double`\n\n因此，包含 `int` 和 `char` 的表达式求值为 `int` 类型，包含 `long` 和 `float` 的表达式求值为为\
  \ `float` 类型，依此类推。\n\n在创建表达式时，编译器一次使用两个变量或值。例如，如果你有表达式：\n\n```\nY + X * 2\n```\n\
  \n编译器会首先使用操作数 `X` 和操作数 `2`。计算完成后，它将使用结果和操作数 `Y`。\n\n在表达式内部，单个操作数会根据需要提升，以匹配表达式中相关的操作数。对于表达式中的每个二元运算符，操作数会成对进行提升。当然，如果两个操作数的类型相同，则不需要提升。如果它们不同，则提升将遵循以下规则：\n\
  \n![Image](img/squf.jpg) 如果其中一个操作数是 `long double`，另一个操作数将提升为 `long double` 类型\n\n\
  ![Image](img/squf.jpg) 如果其中一个操作数是 `double`，另一个操作数将提升为 `double` 类型\n\n![Image](img/squf.jpg)\
  \ 如果其中一个操作数是 `float`，另一个操作数将提升为 `float` 类型\n\n![Image](img/squf.jpg) 如果其中一个操作数是\
  \ `long`，另一个操作数将转换为 `long` 类型。\n\n例如，如果 `x` 是 `int` 且 `y` 是 `float`，求值表达式 `x/y`\
  \ 会导致 `x` 在表达式求值之前被提升为 `float` 类型。这并不意味着变量 `x` 的类型被改变了。这意味着创建了 `x` 的 `float` 类型副本并将其用于表达式求值。正如你刚刚学到的，表达式的值是\
  \ `float` 类型。同样，如果 `x` 是 `double` 类型而 `y` 是 `float` 类型，则 `y` 将提升为 `double`。\n\n\
  ### 通过赋值进行转换\n\n提升也发生在赋值运算符处。赋值语句右侧的表达式始终提升为赋值运算符左侧数据对象的类型。注意，这可能会导致“降级”而非提升。如果\
  \ `f` 是 `float` 类型而 `i` 是 `int` 类型，则在此赋值语句中，`i` 被提升为 `float` 类型：\n\n```\nf = i;\n\
  ```\n\n相比之下，赋值语句\n\n```\ni = f;\n```\n\n会导致 `f` 降级为 `int` 类型。在赋值给 `i` 时，它的小数部分会丢失。请记住，`f`\
  \ 本身完全没有改变；提升只影响该的副本。因此，在执行以下语句后：\n\n```c\nfloat f = 1.23;\nint i;\ni = f;\n```\n\
  \n变量 `i` 的值为 `1`，而 `f` 的值仍为 `1.23`。正如这个示例所示，当浮点数转换为整数类型时，小数部分会丢失。\n\n***\n\n注意\n\
  \n大多数编译器在变量在没有显式要求的情况下被降级时，会给出警告。\n\n***\n\n你应该意识到，当整数类型转换为浮点类型时，结果的浮点值可能与整数值不完全匹配。这是因为计算机内部使用的浮点格式无法准确表示每一个可能的整数。例如，以下代码可能导致显示\
  \ 2.999995 而不是 3：\n\n```c\nfloat f;\nint i = 3;\nf = i;\nprintf(\"%f\", f);\n```\n\
  \n在大多数情况下，由此引起的任何精度损失都是微不足道的。然而，为了确保万无，请将整数值保留在 `short`、`int`、`long` 或 `long long`\
  \ 变量中。\n\n为了避免这种不准确性，你必须将一个 `int` 类型变量强制转换为 `float` 类型。如果其中一个变量被强制转换为 `float` 类型，根据之前的规则，另一个变量将自动提升为\
  \ `float` 类型，表达式的值也是 `float` 类型。这样，答案的小数部分就得以保留。为了演示这一点，请修改源代码中的第 8 行，使赋值语句如下所示：\n\
  \n```c\nf1 = (float)i1/i2;\n```\n\n\n\n\n程序随后显示正确答案。\n\n## 注意\n\n在更复杂的表达式中，你可能想要转换不止一个值。\n\
  \n### 指针的转换\n\n你已经接触过指针的转换。正如你在第 19 节“从函数获取更多内容”中所所示，类型为 `void` 的指针是一个通用指针；它可以指向任何地方。在使用\
  \ `void` 指针之前，你必须将其转换为适当的类型。请注意，在给指针赋值或将其与 `NULL` 比较时，不需要对其进行转换。然而，在对其进行解引用或执行指针算术之前，你必须对其进行转换。关于\
  \ `void` 指针转换的更多细节，请复习第 19 节。\n\n#### 要 (Do)\n\n在必要时**要**使用转换来提升或降低变量的值。\n\n####\
  \ 不要 (Don’t)\n\n**不要**仅仅为了防止编译器警告而使用转换。你可能会发现使用转换可以消除警告，但在通过这种方式消除警告之前，务必理解你为什么收到警告。\n\
  \n### 分配内存存储空间\n\nC 库包含了在运行时分配内存存储空间的函数，这一过程被称为*动态内存分配*。这种技术与在程序源代码中声明变量、结构体和数组来显式分配内存相比，具有显著优势。后者方法被称为*静态内存分配*，它要求你在编写程序时确切地知道需要多少内存。动态内存分配允许程序在执行过程中对内存需求（如用户输入）做出反应。所有处理动态内存分配的函数都需要头文件\
  \ `stdlib.h`；对于某些编译器，还需要 `malloc.h`。请注意，所有的分配函数都返回类型 `void` 指针。正如你在第 19 节中所学习到的，类型\
  \ `void` 指针在使用之前必须转换为适当的类型。\n\n在讨论细节之前，有必要简单介绍一下内存分配。这到底意味着什么？每台计算机都安装了一定量的内存（随机访问存储器，或\
  \ RAM）。内存容量随系统而异。当你运行程序时（无论是文字处理程序、图形程序还是你自己写的 C 程序），程序都会从磁盘加载到计算机内存中。程序占据的内存空间包括程序代码，以及程序所有静态数据的空间——即在源代码中声明的数据项。剩余的内存就是可以使用本节中的函数进行分配的可用内存。\n\
  \n有多少内存可供分配？这完全取决于情况。如果你在一个只安装了适量内存的系统上运行一个大型程序，可用内存将将很少。相反，当一个小型程序运行在具有数 GB 内存的系统上，将大量的内存可用。这意味着你的程序不能对内存的可用性做任何假设。当调用内存分配函数时，你必须检查其返回值以确保内存分配成功。此外，你的程序必须优雅地处理内存分配请求失败的情况。在本节的稍后部分，你将学习一种确定确切可用内存量的技术。\n\
  \n还要注意，你的操作系统可能会对内存可用性产生影响。某些操作系统仅提供部分物理 RAM。相比之下，UNIX 通常为程序提供所有物理 RAM。让事情更复杂的是，某些操作系统（如\
  \ Windows）提供了虚拟内存，允许将硬盘上的存储空间像 RAM 一样被分配。在这种情况下，程序可用的内存量不仅包括安装的 RAM，还包括磁盘上的虚拟内存空间。\n\
  \n在大多数情况下，这些操作系统在内存分配上的差异对你来说应该是透明的。如果你使用 C 函数之一来分配内存，调用要么成功要么失败，你不需要担心正在发生的细节。\n\
  \n#### 使用 malloc() 函数分配内存\n\n在较早的课程中，你学习了如何使用 `malloc()` 库函数为字符串分配存储空间。当然，`malloc()`\
  \ 函数并不局限于为字符串分配内存；它可以为任何存储需求分配空间。该函数按字节分配内存。回想一下 `malloc()` 的原型：\n\n```\nvoid *malloc(size_t\
  \ num);\n```\n\n参数 `size_t` 在 `stdlib.h` 中被定义为 `unsigned`。`malloc()` 函数分配 `num`\
  \ 字节的存储空间，并返回指向第一个字节的指针。如果无法分配请求的存储空间或 `num == 0`，该函数返回 `NULL`。如果你仍然对其操作有些不清楚，请复习第\
  \ 10 节中“处理字符和字符串”的“`malloc()` 函数”部分。\n\n#### 使用 calloc() 函数分配内存\n\n`calloc()` 函数也分配内存。`calloc()`\
  \ 分配一组对象，而不是像 `malloc()` 那样分配一组字节。其函数原型为：\n\n点击此处查看代码图像\n\n```\nvoid *calloc(size_t\
  \ num, size_t size);\n```\n\n记住，在大多数编译器上，`size_t` 是 `unsigned` 的别名。参数 `num` 是要分配的对象数量，`size`\
  \ 是每个对象的大小（字节）。如果分配成功，所有分配的内存将被清零（设置为 `0`），该函数返回一个指向第一个字节的指针。如果分配失败或 `num` 或 `size`\
  \ 为 `0`，该函数返回 `NULL`。列表 21.2 展示了 `calloc()` 的用法。\n\n点击此处查看代码图像\n\n* * *\n1: /* calloc--演示\
  \ calloc(). */\n2: #include <stdlib.h>\n3: #include <stdio.h>\n4: \n5: int main(\
  \ void )\n6: {\n7:     unsigned long num;\n8:     int *ptr;\n9: \n10:    printf(\"\
  Enter the number of type int to allocate: \");\n11:    scanf(\"%ld\", &num);\n12:\
  \ \n13:    ptr = (int*)calloc(num, sizeof(long));\n14: \n15:    if (ptr != NULL)\n\
  16:        puts(\"Memory allocation was successful.\");\n17:    else\n18:      \
  \  puts(\"Memory allocation failed.\");\n19: \n20:    return(0);\n21: }\n```\n\n\
  #### 使用 realloc() 函数分配更多内存\n\n`realloc()` 函数更改之前用 `malloc()` 或 `calloc()` 分配的内存块的大小。其函数原型为：\n\
  \n点击此处查看代码图像\n\n```\nvoid *realloc(void *ptr, size_t size);\n```\n\n参数 `ptr` 是指向原始内存块的指针。新大小由\
  \ `size` 指定（单位为字节）。`realloc()` 有几种可能的结果：\n\n\n\n\n\n![Image](img/squf.jpg) 如果存在足够的空间来扩展\
  \ `ptr` 指向的内存块，则分配额外的内存并返回 `ptr`。\n\n![Image](img/squf.jpg) 如果当前位置没有足够的空间来扩展现有的内存块，则会分配一个大小为\
  \ `size` 的新块，并将现有数据从旧块拷贝到新块的开头。旧块被释放，且函数返回指向新块的指针。\n\n![Image](img/squf.jpg) 如果\
  \ `ptr` 参数为 `NULL`，则函数的作用类似于 `malloc()`，即分配一个大小为 `size` 字节的内存块并返回指向它的的指针。\n\n![Image](img/squf.jpg)\
  \ 如果参数 `size` 为 `0`，则释放 `ptr` 所指向的内存，且函数返回 `NULL`。\n\n![Image](img/squf.jpg) 如果内存不足以进行重新分配（无论是扩展旧块还是分配新块），则函数返回\
  \ `NULL`，且原始内存块保持不变。\n\nListing 21.3 展示了 `realloc()` 的用法。\n\n输入 ![Image](img/down-arrow.jpg)\n\
  \n**列表 21.3** 重用内存 mem.c：使用 `realloc()` 增加动态分配内存块的大小\n\n点击此处查看代码图像\n\n* * *\n\n\
  ```c\n1:  // reusingmem.c--Using realloc() to change memory allocation.\n2:\n3:\
  \  #include <stdio.h>\n4:  #include <stdlib.h>\n5:  #include <string.h>\n6:\n7:\
  \  int main( void )\n8:  {\n9:      char buf[80], *message;\n10:\n11:      // 输入一个字符串。\n\
  12:\n13:      puts(\"Enter a line of text.\");\n14:      gets(buf);\n15:\n16:  \
  \    // 分配初始块并将字符串拷贝到其中。\n17:\n18:      message = realloc(NULL, strlen(buf)+1);\n\
  19:      strcpy(message, buf);\n20:\n21:      // 显示消息。\n22:\n23:      puts(message);\n\
  24:\n25:      // 从用户处获取另一个字符串。\n26:\n27:      puts(\"Enter another line of text.\"\
  );\n28:      gets(buf);\n29:\n30:      // 增加分配空间，然后将字符串拼接上去。\n31:\n32:      message\
  \ = realloc(message,(strlen(message) + strlen(buf)+1));\n33:      strcat(message,\
  \ buf);\n34:\n35:      // 显示新消息。\n36:      puts(message);\n37:      return(0);\n\
  38: }\n```\n* * *\n\n输出 ![Image](img/down-arrow.jpg)\n\n点击此处查看代码图像\n\n* * *\n\n\
  输入一行文本。\n这是第一行文本。\n这是第一行文本。\n输入另一行文本。\n这是第二行文本。\n这是第一行文本.这是第二行文本。\n\n* * *\n\n分析\
  \ ![Image](img/down-arrow.jpg)\n\n* * *\n\n该程序在第 14 行获取输入字符串，将其读入名为 `buf` 的字符数组中。然后将该字符串拷贝到\
  \ `message` 指向的内存位置（第 19 行）。`message` 是第 18 行使用 `realloc()` 分配的。即使没有之前的分配也调用了 `realloc()`。通过通过\
  \ `NULL` 作为第一个参数，`realloc()` 知道这是第一次分配。\n\n第 28 行在 `buf` 缓冲区获取了第二个字符串。该字符串被拼接到 `message`\
  \ 中已有的字符串之后。由于 `message` 的大小仅够容纳第一个字符串，因此需要重新分配空间以同时容纳第一个和第二个字符串。这正是第 32 行所做的。程序通过打印最终拼接后的字符串而结束。\n\
  \n### 使用 free() 函数释放内存\n\n当你使用 `malloc()` 或 `calloc()` 分配内存时，该内存是从程序可用的动态内存池中获取的。这个池有时被称为*堆*（heap），它是有限的——有一个限制。当你的程序完成对某个特定动态分配内存块的使用时，你应该释放（free）该内存，以便供以后使用。要释放动态分配的内存，请使用\
  \ `free()`。它的原型是 `void free(void *ptr);`\n\n`free()` 函数释放由 `ptr` 指向的内存。这些内存必须是通过\
  \ `malloc()`、`calloc()` 或 `realloc()` 分配的。如果 `ptr` 为 `NULL`，`free()` 将什么都不做。列表 21.4\
  \ 展示了 `free()` 函数。\n\n ![Image](img/down-arrow.jpg)\n\n**列表 21.4** freem.c：使用 `free()`\
  \ 释放之前分配的内存\n\n点击此处查看代码图像\n\n* * *\n\n```c\n1:  // freem.c--Using free() to release\
  \ previously allocated memory.\n2:\n3:  #include <stdio.h>\n4:  #include <stdlib.h>\n\
  5:  #include <string.h>\n6:\n7:  #define BLOCKSIZE 3000000\n8:\n9:  int main( void\
  \ )\n10: {\n11:     void *ptr1, *ptr2;\n12:\n13:     // 分配一个块。\n14:     ptr1 = malloc(BLOCKSIZE);\n\
  15:     if (ptr1 != NULL)\n16:         // 分配成功。\n17:         printf(\"\\nFirst allocation\
  \ of %d bytes successful.\", BLOCKSIZE);\n18:     else\n19:     {\n20:         //\
  \ 分配失败。\n21:         printf(\"\\nAttempt to allocate %d bytes failed.\\n\", BLOCKSIZE);\n\
  22:         exit(1);\n23:     }\n24:\n25:     // 尝试分配另一个块。\n26:     ptr2 = malloc(BLOCKSIZE);\n\
  27:     if (ptr2 != NULL)\n28:         // 分配成功。\n29:         printf(\"\\nSecond\
  \ allocation of %d bytes successful.\", BLOCKSIZE);\n30:     else\n31:     {\n32:\
  \         // 分配失败。\n33:         printf(\"\\nAttempt to allocate %d bytes failed.\\\
  n\", BLOCKSIZE);\n34:         // 释放第一个块。\n35:         free(ptr1);\n36:         printf(\"\
  \\nFreeing first block.\");\n37:         // 再次尝试分配。\n38:         ptr2 = malloc(BLOCKSIZE);\n\
  39:         if (ptr2 != NULL)\n40:             // 分配成功。\n41:             printf(\"\
  \\nAfter free(), allocation of %d bytes successful.\\n\", BLOCKSIZE);\n42:     \
  \    else\n43:         {\n44:             // 分配失败。\n45:             printf(\"\\\
  nAttempt to allocate %d bytes failed.\\n\", BLOCKSIZE);\n46:             exit(1);\n\
  47:         }\n48:     }\n49:\n50:     // 释放内存块。\n51:     free(ptr1);\n52:     free(ptr2);\n\
  53:\n54:     return(0);\n55: }\n```\n* * *\n\n输出 ![Image](img/down-arrow.jpg)\n\n\
  点击此处查看代码图像\n\n* * *\n\nFirst allocation of 3000000 bytes bytes successful.\nSecond\
  \ allocation of 3000000 bytes bytes successful.\n\n* * *\n\n分析 ![Image](img/down-arrow.jpg)\n\
  \n* * *\n\n该程序尝试动态分配两个内存块。它使用定义的常量 `BLOCKSIZE` 来决定分配多少。第 15 行使用 `malloc()` 进行第一次分配。第\
  \ 17 行到第 23 行通过判断返回值是否等于 `NULL` 来检查分配状态。显示一条消息说明分配状态。如果分配失败，程序退出。第 27 行尝试分配另一个块，再次检查分配是否成功（第\
  \ 29 行到第 36 行）。如果第二次分配成功，调用 `exit()` 结束程序。如果未成功，打印一条消息说明分配内存失败。然后释放第一个块并再次尝试分配第二个块。\n\
  \n\n\n\n使用 `memset()` 将内存内存初始化为指定的值。由于该函数只能使用 `char` 类型作为初始化值，因此在处理除 `char` 类型以外的数据类型块时，它并不好用，除非你想将其初始化为\
  \ `0`。换句话说，使用 `memset()` 将 `int` 类型数组初始化为值 `99` 并不是高效的，但你可以将所有数组元素初始化为值 `0`。在列表\
  \ 21.5 中演示了 `memset()`。\n\n### 使用 `memcpy()` 函数复制内存\n\n`memcpy()` 在内存块之间拷贝数据字节，内存块有时被称为*缓冲区*（buffers）。该函数不关心所复制的数据类型——它只是简单地进行精确的字节拷贝。函数原型如下：\n\
  \n点击此处查看代码图像\n\n```\nvoid *memcpy(void *dest, void *src, size_t count);\n```\n\n\
  参数 `dest` 和 `src` 分别指向目标和源内存块。`count` 指定要拷贝的字节数。返回值是 `dest`。如果两个内存块重叠，该函数可能无法正常运行——`src`\
  \ 中的某些数据在被拷贝之前可能会被覆盖。请使用接下来讨论的 `memmove()` 函数来处理重叠的内存块。`memcpy()`将在列表 21.5 中演示。\n\
  \n### 使用 `memmove()` 函数移动内存\n\n`memmove()` 与 `memcpy()` 非常相似，都是从一个内存块拷贝指定数量字节到另一个。然而，它更灵活，因为它能够正确地处理重叠的内存块。由于\
  \ `memmove()` 可以完成 `memcpy()` 能做的所有工作（增加了处理重叠块的灵活性），你很少、甚至没有理由使用 `memcpy()`。其原型为：\n\
  \n点击此处查看代码图像\n\n```\nvoid *memmove(void *dest, void *src, size_t count);\n```\n\n\
  `dest` 和 `src` 指向目标和源内存块，`count` 指定要拷贝的字节数。返回值是 `dest`。如果块重叠，该函数可以确保重叠区域的源数据在被覆盖之前完成拷贝。列表\
  \ 21.5 演示了 `memset()`、`memcpy()` 和 `memmove()`。\n\n输入 ![Image](img/down-arrow.jpg)\n\
  \n**列表 21.5** memfunctions.c：`memset()`、`memcpy()` 和 `memmove()` 的演示\n\n点击此处查看代码图像\n\
  \n***\n\n```c\n1:  // memfunctions.c--演示 memset(), memcpy(), 和 memmove().\n2:\n\
  3:  #include <stdio.h>\n4:  #include <string.h>\n4:\n5:  char message1[60] = \"\
  Four score and seven years ago ...\";\n6:  char message2[60] = \"abcdefghijklmnopqrstuvwxyz\"\
  ;\n7:  char temp[60];\n8:\n9:  int main( void )\n10: {\n11:     printf(\"\\nmessage1[]\
  \ before memset():\\t%s\", message1);\n12:     memset(message1 + 5, '@', 10);\n\
  13:     printf(\"\\nmessage1[] after memset():\\t%s\", message1);\n14:\n15:    \
  \ strcpy(temp, message2);\n16:     printf(\"\\n\\nOriginal message: %s\", temp);\n\
  17:     memcpy(temp + 4, temp + 16, 10);\n18:     printf(\"\\nAfter memcpy() without\
  \ overlap:\\t%s\", temp);\n19:     strcpy(temp, message2);\n20:     memcpy(temp\
  \ + 6, temp + 4, 10);\n21:     printf(\"\\nAfter memcpy() with overlap:\\t%s\",\
  \ temp);\n22:\n23:     strcpy(temp, message2);\n24:     printf(\"\\n\\nOriginal\
  \ message: %s\", temp);\n25:     memmove(temp + 4, temp + 16, 10);\n26:     printf(\"\
  \\nAfter memmove() without overlap:\\t%s\", temp);\n27:     strcpy(temp, message2);\n\
  28:     memmove(temp + 6, temp + 4, 10);\n29:     printf(\"\\nAfter memmove() with\
  \ overlap:\\t%s\\n\", temp);\n30:     return 0;\n31: }\n```\n\n### 位操作\n\n如你可能所知，数据存储的最基本单位是位（bit）。在某些情况下，在程序中操作单个位是有用的。C\
  \ 语言有几种工具来实现这一点。\n\n位运算符允许你操作单个位。记住，位是数据存储的最小可能单位，它只有两个可能的值：`0` 或 `1`。位运算符只能用于整数类型：`char`、`int`\
  \ 和 `long`。在继续介绍本节之前，你应该熟悉二进制表示法——计算机存储整数的方式。位运算符最频繁的使用场景是你的程序直接与系统硬件交互——这个主题超出了本书的范围。不过，它们也有其他用途，将在下介绍。\n\
  \n#### 移位运算符\n\n两个移位运算符将整数位移动指定的位数。`<<` 运算符向左移位，`>>` 运算符向右移位。这些二进制运算符的语法为\n\n```\n\
  x << n\n```\n\n和\n\n```\nx >> n\n```\n\n每个运算符将 `x` 中的位按指定方向移动 `n` 位。对于右移，变量的高位 `n`\
  \ 位将填充零；对于左移，变量的低位 `n` 位将填充零。这里有几个例子：\n\n![Image](img/p549_01.jpg)\n\n在某些情况下，你可以使用移位运算符将整数变量乘以或除以\
  \ 2 的幂。将整数左移 *n* 位与乘以 $2^n$ 的效果相同，向右移整数则与除以 $2^n$ 的效果相同。左移乘法的结果仅在没有溢出的情况下才准确——即没有位因移出高位而“丢失”。右移除法是整数除法，结果中的任何小数部分都会丢失。例如，如果你试图将值\
  \ `5`（二进制 `00000101`）右移一位以实现除以 2，结果是 `2`（二进制 `00000010`），而不是正确的 `2.5`，因为小数部分（`.5`）丢失了。列表\
  \ 21.6 演示了移位运算符。\n\n\n\n\n点击此处查看代码图片\n\n```c\n// shiftit.c--Demonstrating the shift\
  \ operators.\n\n#include <stdio.h>\n\nint main( void )\n{\n    unsigned int y, x\
  \ = 255;\n    int count;\n\n    printf(\"Decimal\\t\\tshift left by\\tresult\\n\"\
  );\n\n    for (count = 1; count < 8; count++)\n    {\n        y = x << count;\n\
  \        printf(\"%d\\t\\t%d\\t\\t%d\\n\", x, count, y);\n    }\n    printf(\"\\\
  n\\nDecimal\\t\\tshift right by\\tresult\\n\");\n\n    for (count = 1; count < 8;\
  \ count++)\n    {\n        y = x >> count;\n        printf(\"%d\\t\\t%d\\t\\t%d\\\
  n\", x, count, y);\n    }\n    return(0);\n}\n```\n\n输出 ![Image](img/down-arrow.jpg)\n\
  \n点击此处查看代码图片\n\nDecimal         shift left by    result\n255             1     \
  \          510\n255             2               1020\n255             3        \
  \       2040\n255             4               4080\n255             5          \
  \     8160\n255             6               16320\n255             7           \
  \    32640\nDecimal         shift right by   result\n255             1         \
  \      127\n255             2               63\n255             3              \
  \ 31\n255             4               15\n255             5               7\n255\
  \             6               3\n255             7               1\n\n### 位运算逻辑运算符\n\
  \n三种位运算逻辑运算符用于操作整数数据类型中的单个位，如表 21.1 所示。这些运算符的名称与你之前章节中中学的 `TRUE`/`FALSE` 逻辑运算符相似，但它们的操作方式不同。\n\
  \n**表 21.1 位运算逻辑运算符**\n\n这些都是二进制运算符，根据操作数中的位将结果中的位设置为 `1` 或 `0`。它们的操作方式如下：\n\n-\
  \ 位与 `AND`（与）：仅当两个操作数的位都为 `1` 时，才将结果中的位设置为 `1`；否则，该位设置为 `0`。`AND` 运算符用于关闭或清除值中的更多位。\n\
  - 位包含或 `OR`（包含或）：仅当两个操作数的对应位都为 `0` 时，才将结果中的位设置为 `0`；否则，该位设置为 `1`。`OR` 运算符用于开启或设置值中的更多位。\n\
  - 位异或 `OR`（异或）：当对应位不同时（如果一个为 `1` 另一个为 `0`），则将结果中的位设置为 `1`；否则，该位设置为 `0`。\n\n以下是这些运算符工作方式示例：\n\
  \n你刚刚读到位 `AND` 和位包含或 `OR` 可以分别用于清除或设置整数中的指定位。这意味着什么呢？假设有一个 `char` 变量，并且你想确保位置 `0`\
  \ 和 `4` 的位被清除（即等于 `0`），而其他位保持原有值。如果你将该变量与二进制值为 `11101110` 的第二个值进行 `AND` 操作，你将得到想要的结果。在第二个值为\
  \ `1` 的每个位置，结果将具有与原变量中相同的值（`0` 或 `1`）：\n\n`0 & 1 == 0`\n`1 & 1 == 1`\n\n在第二个值为 `0`\
  \ 的每个位置，无论原变量中存在的值是什么，结果都将为 `0`：\n\n`0 & 0 == 0`\n`1 & 0 == 0`\n\n使用 `OR` 设置位的方法类似。在第二个值为\
  \ `1` 的每个位置，结果都将为 `1`；在第二个值为 `0` 的每个位置，结果将保持不变：\n\n`0 | 1 == 1`\n`1 | 1 == 1`\n\
  `0 | 0 == 0`\n`1 | 0 == 1`\n\n### 补码运算符\n\n涵盖的最后一个位运算运算符是补码运算符 `~`。这是一个一元运算符。它的作用是反转操作数中的每一个位，将所有的\
  \ `0` 变为 `1`，反之亦然。例如，`~254`（二进制 `11111110`）的结果为 `1`（二进制 `00000001`）。\n\n本节中的所有示例都使用了包含\
  \ 8 位的 `char` 变量。对于较大的变量，如 `int` 和 `long`，工作原理完全相同。\n\n### 结构中的位域\n\n最后一个与位相关的话题是结构中位域的使用。在第\
  \ 11 节“实现结构体、联合体和 typedef”，你学习了如何定义自己的数据结构，并对其进行自定义以适应程序的数据需求。通过使用位域，你可以实现更大程度的自定义。*位域*是一个包含指定位数的结构成员。使用位域可以实现更大的自定义并节省内存。位域的类型是\
  \ `unsigned`，通过在成员名后加上冒号和位数来指定位域的大小。要定义一个名为 `dental` 的 1 位成员，另一个名为 `college` 的 1\
  \ 位成员，以及一个名为 `health` 的 2 位成员，你写如下：\n\n点击此处查看代码图片\n\n```c\nstruct emp_data\n{\n\
  \    unsigned dental : 1;\n    unsigned college : 1;\n    unsigned health : 2;\n\
  \    ...\n};\n```\n\n省略号（`...`）表示其他结构成员。可以是位域，也可以是由普通数据类型组成的字段。注意，位域必须放在结构定义中任何非位域结构成员之前。要访问位域，像访问任何结构成员一样使用结构成员运算符。对于示例，你可以将结构定义扩展得更有用：\n\
  \n点击此处查看代码图片\n\n```c\nstruct emp_data\n{\n    unsigned dental : 1;\n    unsigned\
  \ college : 1;\n    unsigned health : 2;\n    char fname[20];\n    char lname[20];\n\
  \    char ssnumber[10];\n};\n```\n\n你可以声明一个结构体数组：\n\n```c\nstruct emp_data workers[100];\n\
  ```\n\n要给数组第一个元素赋值，可以如下所示：\n\n```c\nworkers[0].dental = 1;\nworkers[0].college =\
  \ 0;\nworkers[0].health = 2;\nstrcpy(workers[0].fname, \"Mildred\");\n```\n\n\n\n\
  \n\n在处理 1 位位域（bit fields）时，如果你使用值为 `1` 和 `0` 的符号常量 `YES` 和 `NO`，你的代码自然会更清晰。无论何种情况，你都将每个位域视为一个具有给定位数的型无符号整数。对于具有\
  \ `n` 位的位域，可以赋值的值范围从 `0` 到 `2^n^(-1)`。如果你尝试为位域分配一个超出范围的值，编译器不会报告错误，但你将得到不可预测的结果。\n\
  \n## 做法 (Do)\n在处理位操作时，**务必**使用定义的常量 `YES`、`NO` 或 `TRUE` 和 `FALSE`。这些符号比 `1` 和 `0`\
  \ 更容易阅读和理解。\n\n## 不要 (Don’t)\n**不要**定义一个占 8 位或 16 位的位域。这些与 `char` 或 `int` 类型等其他可用变量相同。\n\
  \n### 总结\n今天的课程涵盖了 C 语言编程的各种主题。你学习了如何在运行时分配、重新分配和释放内存，并看到了可以让你在为程序数据分配存储空间时具有灵活性的命令。你还看到了如何以及何时对变量和指针使用类型转换。忘记类型转换或不当使用类型转换是导致难以发现的程序\
  \ bug 的常见原因，因此这是一个值得复习的话题。你还学习了如何使用 `memset()`、`memcpy()` 和 `memmove()` 函数来操作内存块。最后，你了解了在程序中操作和使用单个位的方法。\n\
  \n### 问答 (Q&A)\n**Q 动态内存分配的优势是什么？为什么我不能直接在源代码中声明我需要的存储空间？**\n\n**A** 如果你在你在源代码中声明所有数据存储空间，你的程序可用的内存量将是固定的。你必须在编写程序时就提前需要多少内存。动态内存分配允许你的程序根据当前情况和用户输入控制使用的内存量。程序可以使用它需要的任何内存，只要不超过计算机可用内存的限制。\n\
  \n**Q 我为什么会需要释放内存？**\n\n**A** 当你刚学习 C 语言时，程序并不大。随着程序的增长，它们对内存的使用随之增加。你应该尝试编写程序尽可能高效地使用内存。当你完成内存的使用后，应该释放它。如果你编写的程序运行多任务环境中，其他应用程序可能需要你未使用的内存。虽然某些系统会在程序结束时自动返回内存，但并非所有系统都如此。\n\
  \n**Q 如果我不调用 `realloc()` 就复用字符串会发生什么？**\n\n**A** 如果你使用的字符串已经分配了足够的空间，就不需要调用 `realloc()`。当你的当前字符串不够大时，调用\
  \ `realloc()`。记住，C 编译器允许你做几乎任何事情，甚至是你不该做的事！只要新字符串的长度等于或小于原始字符串分配的空间，你就可以用一个更大的字符串覆盖原来的字符串。然而，如果新字符串更大，你还可以覆盖内存中该字符串之后的任何内容。这些内容可能是空的，也可能是至关重要的数据。如果你需要更大的分配内存段，请调用\
  \ `realloc()`。\n\n**Q `memset()`、`memcpy()` 和 `memmove()` 函数的优势是什么？为什么我不能直接用带有赋值语句的循环来初始化或复制内存？**\n\
  \n**A** 在某些情况下，你可以使用带有赋值语句的循环来初始化内存。事实上，有时这是唯一的方法——例如，将所有 `float` 类型数组的元素设置为值 `1.23`。但在其他情况下，内存尚未被分配给数组或列表，此时\
  \ `mem...()` 函数是你的唯一选择。还有一些时候，循环和赋值语句可以工作，但 `mem...()` 函数更简单、更快速。\n\n**Q 我应该在什么时候使用移位运算符和位按逻辑运算符？**\n\
  \n**A** 这些运算符最常见的用法是程序直接与计算机硬件进行交互时——这种任务通常需要生成和解释特定的位模式。这个主题超出了本书的范畴。即使你永远不需要直接操作硬件，在某些情况下你也可以使用移位运算符将整数值除以或乘以\
  \ 2 的幂。\n\n**Q 使用位域真的能获益这么多吗？**\n\n**A** 是的，使用位域你可以获得很多收益。（这里是双关语！）考虑一种与本章示例类似的情况，一个文件包含调查信息。人们被要求回答\
  \ `TRUE` 或 `FALSE`。如果你询问 10,000 个人并将每个答案存储为 `char`，将需要 10,000 字节。如果你使用位域，需要的空间要少得多。\n\
