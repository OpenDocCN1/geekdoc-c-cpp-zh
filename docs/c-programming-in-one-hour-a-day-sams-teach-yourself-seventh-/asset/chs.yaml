  55:\n56:     for (count = 0; count < (4 * n); count++)\n57:         printf(\"\\\
  n%d\", *p++);\n58: }\n```\n\n***\n\n输出 ![Image](img/down-arrow.jpg)\n\n***\n\n1\n\
