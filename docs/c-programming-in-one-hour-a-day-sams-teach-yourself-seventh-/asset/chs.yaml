  \ 将代码封装在函数中\n\n函数是 C 语言的核心，也是 C 语言设计哲学。你已经接触了 C 的一些库函数，这些是作为编译器提供的完整函数。本节涵盖了用户定义函数，正如名称所示，这些是由你——程序员定义并创建的函数。在本节中学习：\n\
  \n![Image](img/squf.jpg) 什么是函数以及它的组成部分\n\n![Image](img/squf.jpg) 使用函数进行结构化编程的优势\n\
  \n![Image](img/squf.jpg) 如何创建一个函数\n\n![Image](img/squf.jpg) 如何在函数中声明局部变量\n\n![Image](img/squf.jpg)\
  \ 如何从函数向程序返回值\n\n![Image](img/squf.jpg) 如何向函数传递参数\n\n### 理解函数\n\n要理解函数，你只需要理解函数是什么以及如何使用它们。\n\
  \n#### 函数定义\n\n首先是定义：*函数*是一个命名的、独立的 C 代码段，执行特定任务并可选地向调用程序返回一个值。现在看看这个定义的各个部分：\n\n\
  ![Image](img/squf.jpg) *函数是命名的*。每个函数都有唯一的名称。通过在程序的其他部分使用该名称，你可以执行包含的语句。这被称为*调用*函数。函数可以从另一个函数调用。\n\
  \n\n\n\n![Image](img/squf.jpg) *函数执行特定的任务*。这是定义中简单的一部分。任务是程序作为其整体操作的一部分必须执行的离散工作，例如向打印机发送一行文本、将数组按数值顺序排序，或计算立方根。\n\
  \n![Image](img/squf.jpg) *函数可以向调用程序返回一个值*。当你的程序调用一个函数时，它包含的语句就会被执行。如果你想这样做，这些语句可以将信息传回给调用程序。\n\
  \n定义一个函数就是这些了。在查看下一节时，请记住之前的定义。\n\n## 示例说明\n\n`Listing 5.1` 包含一个用户定义的函数。\n\n输入 ![Image](img/down-arrow.jpg)\n\
  \n**列表 5.1** `cube.c`: 使用函数计算数字立方方的程序\n\n点击此处查看代码图像\n\n* * *\n\n```\n1:    // Demonstrates\
  \ a simple function\n2:    #include <stdio.h>\n3:\n4:    long cube(long x);\n5:\n\
  6:    long input, answer;\n7:\n8:    int main( void )\n9:    {\n10:      printf(\"\
  Enter an integer value: \");\n11:      scanf(\"%ld\", &input);\n12:      answer\
  \ = cube(input);\n13:      /* Note: %ld is the conversion specifier for\n14:   \
  \       a long integer */\n15:      printf(\"\\nThe cube of %ld is %ld.\\n\", input,\
  \ answer);\n16:\n17:      return 0;\n18:  }\n19:\n20:  // Function: cube() - Calculates\
  \ the cubed value of a variable\n21:  long cube(long x)\n22:  {\n23:      long x_cubed;\n\
