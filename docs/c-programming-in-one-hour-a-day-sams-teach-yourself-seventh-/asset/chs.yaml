  \ 确切告诉你每个变量类型占用多少字节。如果你使用标准的 64 位 PC（或旧的 32 位 PC），你的数字应该与表 3.2 中的数字匹配。\n\n不要尝试理解程序的所有组件。虽然某些项目是新的（例如\
  \ `sizeof`），但其他项目看起来应该很熟悉。第 1 行和第 2 行是关于程序名称和简要描述的注释。第 4 行包含了标准输入输出头文件，以便在屏幕上打印。这是一个简单的程序，只包含一个函数\
  \ `main()`（第 7 行到第 24 行）。第 8 行到第 21 行是程序的主体。每一行都打印每个变量类型的大小文本描述，这是使用 `sizeof` 运算符完成的。程序的第\
