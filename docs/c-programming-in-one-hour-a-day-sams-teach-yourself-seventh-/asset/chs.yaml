  , s.c);\n    s.i = 65572;\n    printf(\"\\n i = %d\", s.i);\n    s.l = 65572;\n\
  \    printf(\"\\n l = %ld\", s.l);\n    s.f = 0.000000;\n    printf(\"\\n f = %f\"\
  , s.f);\n    s.d = 123456789.8765;\n    printf(\"\\nd = %f\\n\", s.d);\n    return\
