  \ 20 行）。\n\n### 结构体与指针\n\n由于指针是 C 语言中如此重要的一部分，发现它们可以与结构体一起使用并不意外。你可以将指针作为结构体成员，也可以声明指向结构体的指针。这些主题将在后续章节中介绍。\n\
  \n#### 将指针作为结构体成员\n\n在使用指针作为结构体成员时，你拥有完全的灵活性。指针成员的声明方式与非结构体成员的指针相同——即使用间接运算符（`*`）。这里有一个例子：\n\
  \n```c\nstruct data\n{\n    int *value;\n    int *rate;\n} first;\n```\n\n这些语句定义并声明了一个结构体，其两个成员都是指向\
  \ `int` 类型的指针。与所有指针一样，仅声明它们是不够的；你必须初始化它们以指向某个地方。记住，这可以通过给它们赋值变量的地址来实现。如果 `cost`\
  \ 和 `interest` 已经声明为 `int` 类型变量，你可以写：\n\n```c\nfirst.value = &cost;\nfirst.rate\
  \ = &interest;\n```\n\n现在指针已经初始化，你就可以像第 9 节中解释的那样，使用间接运算符（`*`）来求值存储在每个成员中的内容。表达式\
  \ `*first.value` 计算 `cost` 的值，表达式 `*first.rate` 计算 `interest` 的值。\n\n作为结构体成员最频繁使用的指针类型可能是指向\
  \ `char` 类型的指针。回想第 10 节中的“处理字符和字符串”：一个*字符串*是由一系列字符组成的，由指向字符串第一个字符的指针和一个指示字符串结束的空字符界定。为了刷新记忆，你可以像下面这样声明指向\
  \ `char` 类型的指针并将其初始化指向一个字符串：\n\n点击此处查看代码图像\n\n```c\nchar *p_message;\np_message\
  \ = \"Teach Yourself C In One Hour a Day\";\n```\n\n你也可以对结构体成员的 `char` 类型指针执行同样的操作：\n\
  \n点击此处查看代码图像\n\n```c\nstruct msg {\n    char *p1;\n    char *p2;\n} myptrs;\n\n\
  myptrs.p1 = \"Teach Yourself C In One Hour a Day\";\nmyptrs.p2 = \"By SAMS Publishing\"\
  ;\n```\n\n图 11.4 展示了执行这些语句的结果。结构体的每个指针成员都指向存储在内存其他地方字符串的第一个字节。相比之下，图 11.3 显示了数据如何在包含\
  \ `char` 类型数组的结构体中存储。\n\n![Image](img/11fig04.jpg)\n\n**图 11.4** 包含指向 `char` 指针的结构体。\n\
  \n你可以在任何地方使用指针成员。例如，为了打印字符串，你会写：\n\n```c\nprintf(\"%s %s\", myptrs.p1, myptrs.p2);\n\
  ```\n\n使用 `char` 数组作为结构体成员与使用 `char` 指针之间有什么区别？这两种都是方法，在此所示：\n\n```c\nstruct msg\
  \ {\n    char p1[30];\n    char p2[30];\n} myptrs;\n```\n\n等等，如果你定义了一个 `char` 数组，字符串直接存储在结构体内部。如果你使用指针，字符串存储在其他地方，而指针只持有地址。\n\
  \n#### 创建指向结构体的指针\n\n在 C 程序中，你可以声明并使用指向结构体的指针，就像使用指向任何其他数据存储类型的指针一样。正如你稍在课程中看到的，当把结构体作为参数传递给函数时，经常使用指向结构体的指针。指向结构体的指针还用于一种被称为链表的强大数据存储方法。链表将在第\
  \ 16 节中的“函数指针与链表](#ch16.xhtml_ch16)”中探讨。\n\n现在，来看看你的程序如何创建和使用指向结构体的指针。首先，定义一个结构体：\n\
  \n```c\nstruct part {\n    short number;\n    char name[10];\n};\n```\n\n现在声明一个指向\
  \ `part` 的指针：\n\n```c\nstruct part *p_part;\n```\n\n记住，声明中的间接运算符（`*`）表示 `p_part`\
  \ 是指向 `part` 的指针，而不是 `part` 类型。\n\n现在可以初始化指针吗？不能，因为虽然定义了结构体 `part`，但还没有声明它的实例。记住，声明不是定义，定义是为数据对象分配内存存储空间。因为指针需要指向的内存地址，所以在任何东西指向它之前，你必须声明一个\
  \ `part` 类型的实例。这是声明：\n\n```c\nstruct part gizmo;\n```\n\n现在你可以执行指针初始化：\n\n```c\n\
  p_part = &gizmo;\n```\n\n\n\n\n\n此语句将 `gizmo` 的地址赋值给 `p_part`。（回想第 9 节中的取地址运算符 `&`。）图\
  \ 11.5 显示了结构与指向该结构体的指针之间的关系。\n\n![Image](img/11fig05.jpg)\n\n**图 11.5** 指向结构体的指针指向结构体的第一个字节。\n\
  \n现在你已经有了一个指向结构 `gizmo` 的指针，该如何使用它呢？一种方法是使用间接运算符（`*`）。回想第 9 节中的内容，如果 `ptr` 是指向数据对象的指针，那么表达式\
  \ `*ptr` 指的是该指针所指向的对象。\n\n将此应用于当前示例，你知道 `p_part` 是一个指向结构 `gizmo` 的指针，因此 `*p_part`\
  \ 指的是 `gizmo`。然后你应用结构成员运算符（`.`）来访问 `gizmo` 的各个成员。要将值 `100` 赋值给 `gizmo.number`，你可以写：\n\
  \n```\n(*p_part).number = 100;\n```\n\n`*p_part` 必须用括号起来，因为结构成员运算符（`.`）的优先级高于间接运算符（`*`）。\n\
  \n使用指向结构体的指针访问结构成员的另一种方法是使用*间接成员运算符*，它由字符 `->`（一个连字符后跟大于号）组成。（注意，当它们这样结合在一起使用时，C\
  \ 将它们视为一个单一运算符，而不是两个。）该符号位于指针名和成员名之间。例如，要使用 `p_part` 指针访问 `gizmo` 的 `number` 成员，你会写：\n\
  \n```\np_part->number\n```\n\n看另一个示例，如果 `str` 是一个结构，`p_str` 是指向 `str` 的指针，而 `memb`\
  \ 是 `str` 的一个成员，你可以通过写来访问 `str.memb`：\n\n```\np_str->memb\n```\n\n因此，访问结构成员有三种方式：\n\
  \n![Image](img/squf.jpg) 使用结构名称\n\n![Image](img/squf.jpg) 使用间接运算符（`*`）指向结构的指针\n\n\
  ![Image](img/squf.jpg) 使用间接成员运算符（`->`）指向结构的指针\n\n如果 `p_str` 是指向结构 `str` 的指针，以下三个表达式都是等价的：\n\
  \n```\nstr.memb\n(*p_str).memb\np_str->memb\n```\n\n* * *\n\n### 注释\n\n某些人将间接成员运算符称为*结构指针运算符*。\n\
  \n* * *\n\n#### 使用指针和结构体数组\n\n你已经看到结构体数组可以是一个强大的编程工具，指向结构体的指针也是如此。你可以将两者结合，使用指针来访问数组元素中的结构。\n\
  \n为了说明这一点，这里有一个来自早些示例的结构定义：\n\n```c\nstruct part\n{\n    short number;\n    char\
  \ name[10];\n};\n```\n\n在定义 `part` 结构之后，你可以声明一个类型为 `part` 的数组：\n\n```c\nstruct part\
  \ data[100];\n```\n\n接下来，你可以声明一个类型为 `part` 的指针，并将其初始化指向数组 `data` 中的第一个结构：\n\n```c\n\
  struct part *p_part;\np_part = &data[0];\n```\n\n回想，不带括号的数组名是指向数组第一个元素的指针，因此第二行也可以写成：\n\
  \n```c\np_part = data;\n```\n\n你现在有一个类型为 `part` 的结构体数组和一个指向数组第一个元素的指针（即数组中的第一个结构）。例如，你可以使用以下语句打印第一个元素的内容：\n\
  \n点击此处查看代码\n\n```\nprintf(\"%d %s\", p_part->number, p_part->name);\n```\n\n你想打印整个数组怎么办？你可能会使用\
  \ `for` 循环，每次迭代打印一个数组元素。为了使用指针法访问，你必须更改指针 `p_part`，使其每次迭代都指向下一个数组元素（即数组中的下一个结构）。如何做到这一点？\n\
  \nC 的指针算术提供了帮助。单元增运算符 `++` 应用于指针时有特殊含义：意味着“将指针增加其指向的对象的大小”。另一种说法，如果你有一个指向类型为 `obj`\
  \ 的对象的指针 `ptr`，那么语句\n\n```\nptr++;\nptr += sizeof(obj);\n```\n\n指针算术的方面对于数组特别相关，因为数组元素是顺序存储的。如果指针指向数组元素\
  \ `n`，用 `++` 运算符增加指针会导致它指向 `n + 1`。这在图 11.6 中所示，该图显示了一个名为 `x[]` 的数组（例如包含两个 `short`\
  \ 成员，每个 2 字节）。指针 `ptr` 初始化指向 `x[0]`；每次 `ptr` 递增，它就会指向下一个数组元素。\n\n![Image](img/11fig06.jpg)\n\
  \n**图 11.6** 每次递增，指针移动到下一个数组元素。\n\n\n\n\n\n与其他数据类型一样，结构体也可以作为参数传递给函数。列表 11.6 展示了如何进行这种操作。此程序是对列表\
  \ 11.3 中所示程序的修改。它使用函数从传递的结构体中并在屏幕上显示信息，而列表 11.3 使用的是`main()` 函数中的语句。\n\n输入 ![Image](img/down-arrow.jpg)\n\
  \n**列表 11.6** `structfunc.c`: 将结构体作为函数参数传递\n\n点击此处查看代码图像\n\n* * *\n\n```c\n1:  //\
  \ structfunc.c--演示了将结构体传递给函数。\n2:\n3:  #include <stdio.h>\n4:\n5:  /* 定义并声明一个结构体来存储数据。\
  \ */\n6:\n7:  struct data {\n8:      float amount;\n9:      char fname[30];\n10:\
  \     char lname[30];\n11: } rec;\n12:\n13: /* 函数原型。该函数没有返回值， */\n14: /* 它接收一个类型为\
  \ data 的结构体作为唯一的参数。 */\n15:\n16: void print_rec(struct data diplayRec);\n17:\n18:\
  \ int main( void )\n19: {\n20:      /* 从键盘输入数据。 */\n21:\n22:      printf(\"Enter\
  \ the donor's first and last names,\\n\");\n23:      printf(\"separated by a space:\
  \ \");\n24:      scanf(\"%s %s\", rec.fname, rec.lname);\n25:\n26:      printf(\"\
  \\nEnter the donation amount: \");\n27:      scanf(\"%f\", &rec.amount);\n28:\n\
  29:      /* 调用显示函数。 */\n30:      print_rec( rec );\n31:\n32:      return 0;\n33:\
  \ }\n34: void print_rec(struct data displayRec)\n35: {\n36:      printf(\"\\nDonor\
  \ %s %s gave $%.2f.\\n\", displayRec.fname,\n37:                  displayRec.lname,\
  \ displayRec.amount);\n38: }\n```\n\n* * *\n\n输出 ![Image](img/down-arrow.jpg)\n\n\
  点击此处查看代码图像\n\n* * *\n\n```\nEnter the donor's first and last names,\nseparated by\
  \ a space: Jayne Hatton\nEnter the donation amount: 450\nDonor Jayne Hatton gave\
  \ $450.00.\n```\n\n* * *\n\n分析 ![Image](img/down-arrow.jpg)\n\n* * *\n\n查看第 16 行，你可以看到接收结构体的函数的函数原型。就像处理任何其他要传递的数据类型一样，你必须包含适当参数。在这种情况下，它是一个类型为\
  \ `data` 的结构体。这在第 34 行的函数头中重复出现。在调用函数时，你只需要传递结构体实例名称——在这种情况下为 `rec`（第 30 行）。仅此而已。将结构体传递给函数与传递简单变量没有太大区别。\n\
  \n你也可以通过传递结构体的地址（即指向结构体的指针）将结构体传递给函数。事实上，在 C 语言的旧版本中，这是将结构体作为参数传递的唯一方法。现在不再了，但你可能会看到仍在使用这种方法的旧程序。如果你将结构体指针作为参数传递，请记住你必须在函数中使用间接成员运算符（`->`）来访问结构体成员。你也可以在引用格式化为\
  \ `(*ptr).<member>` 时使用点运算符。\n\n* * *\n\n### 应当 (Do)\n\n- **务必**利用声明结构体指针——特别是使用结构体数组时。\n\
  - **务必**在处理结构体指针时使用间接成员运算符（`->`）。\n\n* * *\n\n### 不要 (Don’t)\n\n- **不要**混淆数组和结构体。\n\
  - **不要**忘记，当递增指针时，它移动的距离等于它所指向的数据的大小。对于结构体指针来说，这就是结构体的大小。\n\n* * *\n\n### 理解联合体\
  \ (Understanding Unions)\n\n*联合体*（Unions）与结构体相似。联合体的声明和使用方法与结构体相同。联合体与结构体的区别在于，它一次只能使用其中一个成员。其原因很简单：联合体的所有成员占用相同的内存区域——它们是堆叠在一起的。\n\
  \n#### 定义、声明和初始化联合体 (Defining, Declaring, and Initializing Unions)\n\n联合体的定义和声明方式类似于结构体。声明中的唯一区别是使用了\
  \ `union` 关键字而不是 `struct`。要定义一个由 `char` 变量和一个整数变量组成的简单联合体，你可以写如下代码：\n\n```c\nunion\
  \ shared\n{\n    char c;\n    int i;\n};\n```\n\n这个联合体 `shared` 可以用于创建联合体实例，该实例可以包含字符值\
  \ `c` 或整数值 `i`。这个联合体 `shared` 可以被用于创建一个可以容纳字符值 `c` 或整数值 `i` 的联合体实例。这是因为联合体成员共用内存空间。图\
  \ 11.7 展示 `shared` 在内存中的情况。\n\n```c\nunion shared\n{\n    char c;\n    int i;\n\
  };\n```\n\n这个联合体 `shared` 可以用于创建一个联合体实例，该实例可以容纳字符值 `c` 或整数值 `i`。这是因为联合体成员共用内存空间。图\
  \ 11.7 展示 `shared` 在内存中的情况。\n\n```c\nunion shared\n{\n    char c;\n    int i;\n\
  };\n```\n\n这个联合体 `shared` 可以用于创建一个联合体实例，该实例可以容纳字符值 `c` 或整数值 `i`。这是因为联合体成员共用内存空间。图\
  \ 11.7 展示 `shared` 在内存中的情况。点击此处查看代码图像\n\n```c\nunion shared\n{\n    char c;\n  \
  \  int i;\n};\n\n\n\nEnter the donor's first and last names,\nseparated by a space:\
  \ Jayne Hatton\nEnter the donation amount: 450\nDonor Jayne Hatton gave $450.00.\n\
  ```\n\n这个联合体 `shared` 可以用于创建一个联合体实例，该实例可以容纳字符值 `c` 或整数值 `i`。这是因为联合体成员共用内存空间。图 11.7\
  \ 展示 `shared` 在内存中的情况。\n\n```c\nunion shared\n{\n    char c;\n    int i;\n};\n```\n\
  \n这个联合体 `shared` 可以用于创建一个联合体实例，该实例可以容纳字符值 `c` 或整数值 `i`。这是因为联合体成员共用内存空间。图 11.7 展示\
  \ `shared` 在内存中的情况。\n\n```c\nunion shared\n{\n    char c;\n    int i;\n};\n```\n\
  \n这个联合体 `shared` 可以用于创建一个联合体实例，该实例可以容纳字符值 `c` 或整数值 `i`。这是因为联合体成员共用内存空间。图 11.7 展示\
  \ `shared` 在内存中的情况。图 11.7\n\n```c\nunion shared\n{\n    char c;\n    int i;\n};\n\
  ```\n\n这个联合体 `shared` 可以用于创建一个联合体实例，该实例可以容纳字符值 `c` 或整数值 `i`。这是因为联合体成员共用内存空间。图 11.7\
  \ 展示 `shared` 在内存中的情况。\n\n```c\nunion shared\n{\n    char c;\n    int i;\n};\n```\n\
  \n这个联合体 `shared` 可以用于创建一个联合体实例，该实例可以容纳字符值 `c` 或整数值 `i`。这是因为联合体成员共用内存空间。图 11.7 展示\
  \ `shared` 在内存中的情况。\n\n#### 访问成员 (Accessing Members)\n\n单个联合体成员可以与结构体相同的方式被访问——使用点运算符（`.`）。然而，由于联合体成员是重叠，一次只能访问其中一个。\n\
  \n```c\nunion shared {\n    char c;\n    int i;\n    long l;\n    float f;\n   \
