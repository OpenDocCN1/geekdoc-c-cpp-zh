  23:\n24:      var.type = CHARACTER;\n25:      var.shared.c = '$';\n26:      print_function(\
  \ var );\n27:\n28:      var.type = FLOAT;\n29:      var.shared.f = (float) 12345.6790;\n\
  30:      print_function( var );\n31:\n32:      var.type = 'x';\n33:      var.shared.i\
  \ = 11;\n34:      print_function( var );\n35:      return 0;\n36:  }\n37:  void\
  \ print_function( struct generic_tag generic )\n38:  {\n39:      printf(\"\\nThe\
  \ generic value is...\");\n40:      switch( generic.type )\n41:      {\n42:    \
  \      case CHARACTER: printf(\"%c\", generic.shared.c);\n43:          break;\n\
  44:          case INTEGER: printf(\"%d\", generic.shared.i);\n45:          break;\n\
  46:          case FLOAT: printf(\"%f\", generic.shared.f);\n47:          break;\n\
  48:          default: printf(\"%c\\n\", generic.type);\n49:          break;\n50:\
