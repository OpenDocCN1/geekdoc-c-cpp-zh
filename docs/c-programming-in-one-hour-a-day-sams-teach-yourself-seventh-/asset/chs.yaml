  \ `EOF`。\n\n### 文件管理函数\n\n*文件管理*一术是指处理现有文件——而不是从它们读取或向它们写入——而是删除、重命名和复制它们。C 标准库包含了删除和重命名文件的函数，你也可以编写自己的文件复制程序。\n\
  \n#### 删除文件\n\n要删除文件，你需使用库函数 `remove()`。它的原型定义在 `stdio.h` 中，如下所示：\n\n点击此处查看代码图像\n\
  \n```c\nint remove( const char *filename );\n```\n\n变量 `*filename` 是指向要删除的文件名的指针。（参见本节较早关于文件名的“使用文件名”章节。）所指定文件不能处于打开状态。如果文件存在，它会被删除，且\
  \ `remove()` 返回 `0`。如果文件不存在、它是只读的、你没有足够的访问权限，或者发生了其他错误，`remove()` 返回 `-1`。\n\n列表\
  \ 17.8 展示了 `remove()` 的用法。请小心：如果你 `remove()` 了一个文件，它将永远消失。\n\n输入 ![Image](img/down-arrow.jpg)\n\
