  \n### strncpy() 函数\n\n`strncpy()` 函数与 `strcpy()` 类似，不同之处 `strncpy()` 允许你指定复制多少个字符。它的原型是\n\
  \n点击此处查看代码图像\n\n```\nchar *strncpy(char *destination, const char *source, size_t\
  \ n);\n```\n\n参数 `destination` 和 `source` 是指向目标和字符串的指针。该函数最多将 `source` 的前 `n` 个字符复制到\
  \ `destination`。如果 `source` 长度小于 `n`，会在 `source` 末尾添加足够的空字符，使得共复制 `n` 个字符到 `destination`。如果\
  \ `source` 长度大于 `n`，则不在 `destination` 中添加终止符 `\\0`。函数的返回值为 `destination`。列表 18.3\
  \ 演示了 `strncpy()` 的用法。\n\n输入 ![Image](img/down-arrow.jpg)\n\n**列表 18.3** stringcopy2.c：strncpy()\
  \ 函数\n\n点击此处查看代码图像\n\n```\n1:  /* stringcopy2.c--使用 strncpy. */\n2:  #include <stdio.h>\n\
  3:  #include <string.h>\n4:\n5:  char dest[] = \"................\";\n6:  char source[]\
  \ = \"ghijklmnopqrstuvwxyz\";\n7:\n8:  int main( void )\n9:  {\n10:     size_t n;\n\
  11:\n12:     while (1)\n13:     {\n14:         puts(\"Enter the number of characters\
