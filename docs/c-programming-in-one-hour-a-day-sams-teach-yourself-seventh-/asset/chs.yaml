  errno = 2.\n\n### 做 (Do)\n\n**做** 在你的程序中检查可能的错误。永远不要假设一切都是如好的。\n\n### 不要 (Don’t)\n\
  \n**不要** 如果你不使用表 20.2 中列出的符号错误常量，则不要包含 `errno.h` 头文件。\n\n### 搜索与排序 (Searching and\
  \ Sorting)\n\n程序执行的最常见任务之一是数据的搜索和排序。C 标准库包含了你可以用于每项任务的通用函数。\n\n#### 使用 `bsearch()`\
  \ 搜索\n\n库函数 `bsearch()` 对数据数组执行二分查找，寻找与键匹配的数组元素。要使用 `bsearch()`，数组必须按升序排序。此外，程序必须提供\
  \ `bsearch()` 使用的比较函数，以判断一个数据项是大于、小于还是等于另一个项。`bsearch()` 的原型在 `stdlib.h` 中：\n\n\
  点击此处查看代码图像\n\n```\nvoid *bsearch(const void *key, const void *base, size_t num,\
  \ size_t width,\nint (*cmp)(const void *element1, const void *element2));\n```\n\
  \n这是一个相当复杂的原型。`key` 指向要搜索的项，`base` 指向数组的第一个元素，`num` 是数组中元素的个数，`width` 是一个元素的大小（字节）。`cmp`\
  \ 是一个指向比较函数的指针。比较函数的规则与前节描述的 `bsearch()` 使用的比较函数规则相同：你通常对 `bsearch()` 和 `qsort()`\
  \ 使用同一个比较函数。函数 `bsearch()` 返回指向它找到的元素的指针，如果未找到匹配项则返回 `NULL`。\n\n二分查找算法非常高效；每次比较都会排除数组的一半。例如，一个包含\
  \ 1,000 个元素的数组可以通过 10 次比较完成搜索，一个包含 16,000 个元素的数组可以通过 14 次比较完成搜索。通常，二分查找搜索一个包含 2^n\
  \ 个元素的数组需要 $n$ 次比较。\n\n#### 使用 `qsort()` 排序\n\n库函数 `qsort()` 是 C.A.R. Hoare 发明的快速排序算法的实现。该函数将数组排序为有序。通常结果是升序的，但\
  \ `qsort()` 也可以用于降序。该函数原型定义在 `stdlib.h` 中：\n\n点击此处查看代码图像\n\n```\nvoid qsort(void\
  \ *base, size_t num, size_t size, int (*cmp)(const void *element1, const void *element2));\n\
  ```\n\n参数 `base` 指向数组的第一个元素，`num` 是数组中元素的个数，`size` 是一个数组元素的大小（字节）。参数 `cmp` 是一个指向比较函数的指针。比较函数的规则与前节描述的\
  \ `bsearch()` 使用的比较函数规则相同。函数 `qsort()` 没有返回值。\n\n#### 搜索与排序：两个演示\n\n列表 20.5 演示了\
  \ `qsort()` 和 `bsearch()` 的用法。该程序对值数组进行排序和搜索。注意使用了非 ANSI 函数 `getch()`。如果你的编译器不支持它，你应该将其替换为\
  \ ANSI 标准函数 `getchar()`。\n\n\n\n\n\n# 列表 20.5 searchandsort.c：使用 `qsort()` 和 `bsearch()`\
