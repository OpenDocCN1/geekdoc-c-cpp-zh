  **3.** 在一个声明了 `n` 个元素的一维数组中，最后一个元素的下标是什么？\n\n**4.** 如果你的程序尝试访问越界下标的数组元素，会发生什么？\n\
  \n**5.** 你如何声明多维数组？\n\n**6.** 数组使用以下语句声明。该数组共有多少个元素？\n\n```c\nint array[2][3][5][8];\n\
  ```\n\n**7.** 问题 6 中数组的第十个元素的名称是什么？\n\n### 练习题\n\n**1.** 编写一行 C 程序代码，声明三个一维整数数组，分别名为\
