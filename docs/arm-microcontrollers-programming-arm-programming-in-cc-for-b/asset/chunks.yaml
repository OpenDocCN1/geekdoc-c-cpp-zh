    * * *


    5\. Modulus Assignment (%=)


    What is Modulus Assignment


    The modulus assignment operator (%=) calculates the remainder when a variable
    is divided by a value and assigns that remainder back to the variable. It’s useful
    for cyclic counters, wrapping values, and modular arithmetic.


    Use Purpose


    ● Wrap Values: Useful for keeping values within a specified range, such as indices
    in circular buffers.


    ●      Cyclic Counters: Keeps a counter within a fixed range.


    Syntax


    a %= b;


    Syntax Explanation


    ●      a: The variable to be updated.


    ●      b: The modulus.


    ● %=: Calculates the remainder of  a / b and assigns it to a.


    Simple Code Example


    int index =  10;


    index %=  3; // Equivalent to index = index % 3


    Code Example Explanation


    ● Calculates the remainder of 10 divided by 3, resulting in  index holding the
    value 1\. This is helpful for applications like cycling through a limited range
    of values.


    Notes


    Modulus assignment is commonly used in managing cyclic data or wrapping values
    around a fixed range.


    Warnings


    Ensure the modulus is non-zero, as dividing by zero will cause an error.


    * * *


    Relevant Project Section


    Project Name


    Speed Control and Directional LED Indicator


    Project Goal


    Use compound operators to control motor speed and LED indicators based on speed
    thresholds. The system will adjust the motor speed up and down using compound
    operators, while an LED indicator shows the current speed range.


    Requirement Components


    ●      ARM Microcontroller (e.g., STM32)


    ●      Motor connected to a PWM output pin


    ●      LED connected to a digital output pin


    Component Connection Table


    | Component | Microcontroller Pin | Additional Notes |


    | Motor | PWM Output Pin (e.g., PB4) | Speed controlled by PWM |


    | LED | Digital Output Pin (e.g., PC3) | Indicates speed threshold |


    Connection Analysis


    The motor speed is controlled using a PWM output, which is adjusted by compound
    operators. The LED provides visual feedback based on speed thresholds, indicating
    when the motor speed exceeds certain values.


    Program Software Setup


    1.  Create a new project in STM32CubeIDE or Keil uVision.


    2.  Configure PWM for motor speed control and the LED as a digital output.


    Project Code


    #include  "stm32f4xx.h" // Device-specific header for STM32


    void configurePWM()  {


    RCC->APB1ENR |= RCC_APB1ENR_TIM3EN;  // Enable TIM3 clock


    TIM3->CCMR1 |= TIM_CCMR1_OC1M_PWM1; // Set TIM3 Channel 1 to PWM mode


    TIM3->CCR1 =  128;                    // Set initial duty cycle


    TIM3->CR1 |= TIM_CR1_CEN;            // Enable TIM3


    }


    void configureLED()  {


    RCC->AHB1ENR |= RCC_AHB1ENR_GPIOCEN;  // Enable GPIOC clock


    GPIOC->MODER |=  (1  <<  6);            // Set PC3 as output


    }


    void increaseSpeed(int  *speed)  {


    *speed +=  20;                        // Increase speed by 20


    }


    void decreaseSpeed(int  *speed)  {


    *speed -=  20;                        // Decrease speed by 20


    }


    int main()  {


    configurePWM();      // Set up PWM for motor control


    configureLED();      // Set up LED as an indicator


    int speed =  100;


    TIM3->CCR1 = speed;  // Set initial motor speed


    while  (1)  {


    if  (speed >=  200)  {


    GPIOC->BSRR =  (1  <<  3);      // Turn on LED if speed exceeds threshold


    }  else  {


    GPIOC->BSRR =  (1  <<  (3  +  16));  // Turn off LED


    }


    // Example usage of compound operators to adjust speed


    increaseSpeed(&speed);


    if  (speed >  255)  {


    speed =  255;                 // Limit speed to max PWM value


    }


    TIM3->CCR1 = speed;              // Update motor speed


    decreaseSpeed(&speed);


    if  (speed <  0)  {


    speed =  0;                   // Limit speed to minimum


    }


    TIM3->CCR1 = speed;              // Update motor speed


    }


    }


    Save and Run


    1.  Save, compile, and upload the code to the ARM microcontroller.


    2.  Observe the motor speed adjustments and the LED indicator based on speed thresholds.


    Check Output


    ● The motor speed should adjust up and down based on compound operator calculations,
    and the LED should turn on if the speed reaches a specified threshold, demonstrating
    effective use of compound operators.


    ## Maths


    Chapter Overview


    Mathematical functions are essential for performing complex calculations in embedded
    programming. ARM microcontrollers support several math functions through the C
    standard library, allowing developers to perform operations such as absolute value,
    power, square root, and trigonometric calculations. This chapter will explore
    commonly used math functions and how to apply them in embedded applications.


    Chapter Goal


    ●      Understand the function and syntax of essential math functions in C.


    ●      Learn to use these functions for embedded applications involving calculations.


    ● Implement a project to demonstrate practical applications of math functions
    in ARM microcontroller programming.


    Rules


    ● Optimize Calculations: Use integer math for simpler operations to save processing
    time.


    ● Check Valid Inputs: Ensure input values are within valid ranges for each function.


    ● Avoid Precision Loss: When using floating-point math, be mindful of precision
    limitations.


    ● Use Math Functions Sparingly: Math functions can be resource-intensive on microcontrollers,
    so use them only when necessary.


    Brief Introduction to Math Functions


    Math functions in C enable a range of calculations beyond basic arithmetic. Common
    math functions include absolute value (abs), power (pow), square root (sqrt),
    and trigonometric functions (sin,  cos). These functions are essential in sensor
    data processing, control algorithms, and various real-world embedded applications.


    Syntax Table


    | Serial No | Topic | Syntax | Simple Example |


    | 1 | Absolute Value | abs(x) | int y = abs(-5); |


    | 2 | Power | pow(x, y) | double res = pow(2, 3); |


    | 3 | Square Root | sqrt(x) | double res = sqrt(16); |


    | 4 | Trigonometry (Sine) | sin(x) | double s = sin(angle); |


    | 5 | Trigonometry (Cosine) | cos(x) | double c = cos(angle); |


    * * *


    Detailed Breakdown for Each Command


    1\. Absolute Value (abs)


    What is Absolute Value


    The absolute value function (abs) returns the positive value of a number. It’s
    often used in embedded systems to handle sensor data where only magnitude is relevant.


    Use Purpose


    ● Get Magnitude: Useful when the direction of a value is not needed, only the
    magnitude.'
