    ## Comparison Operators


    Chapter Overview


    Comparison operators are essential in embedded programming, allowing us to make
    decisions based on the comparison of values. ARM microcontrollers use comparison
    operators to compare sensor readings, input values, and control variables. This
    chapter will cover the syntax, purpose, and practical examples of each comparison
    operator.


    Chapter Goal


    ●      Understand the function and syntax of comparison operators.


    ●      Learn how to apply comparison operators in conditional statements.


    ●      Implement a project that demonstrates comparison operators in a real-world
    application.


    Rules


    ● Use Proper Data Types: Ensure the operands have compatible types for accurate
    comparison.


    ● Avoid Unintended Comparisons: Be careful with floating-point comparisons, as
    precision errors may affect results.


    ●      Chain Conditions with Logic: Use logical operators for more complex conditions.


    ● Beware of Assignment Errors: Avoid using = instead of  == in conditional statements.


    Brief Introduction to Comparison Operators


    Comparison operators allow us to compare two values, returning a boolean result
    (true or  false). These operators are commonly used in  if statements, loops,
    and other control structures to determine program flow. Common comparison operators
    include equal to (==), not equal to (!=), greater than (>), less than (<), greater
    than or equal to (>=), and less than or equal to (<=).


    Syntax Table


    | Serial No | Topic | Syntax | Simple Example |


    | 1 | Equal To | a == b | if (temp == 100) |


    | 2 | Not Equal To | a != b | if (status != READY) |


    | 3 | Greater Than | a > b | if (speed > 50) |


    | 4 | Less Than | a < b | if (distance < 100) |


    | 5 | Greater Than or Equal To | a >= b | if (voltage >= 3.3) |


    | 6 | Less Than or Equal To | a <= b | if (count <= 10) |


    * * *


    Detailed Breakdown for Each Command


    1\. Equal To (==)


    What is Equal To


    The equal to operator (==) checks if two values are the same. It’s used to compare
    variables or constants, returning  true if they are equal and  false otherwise.


    Use Purpose


    ●      Check Equality: Used to verify if two values are the same.


    ●      Conditional Decision: Essential in  if statements for decision-making.


    Syntax


    if  (a == b)  {


    // Code to execute if a equals b


    }


    Syntax Explanation


    ●      if: The keyword initiating a conditional statement.


    ● a == b: The comparison expression checking if a is equal to b.


    Simple Code Example


    if  (sensorValue ==  100)  {


    activateAlarm();


    }


    Code Example Explanation


    ● If  sensorValue equals 100, the  activateAlarm() function is called. This demonstrates
    how the equal to operator is used to trigger specific actions based on matching
    conditions.


    Notes


    Use  == only when comparing values, as using = by mistake assigns values instead
    of comparing them.


    Warnings


    Avoid comparing floating-point values directly with  == due to potential precision
    errors.


    * * *


    2\. Not Equal To (!=)


    What is Not Equal To


    The not equal to operator (!=) checks if two values are different. It returns  true
    if they are not equal and  false if they are the same.


    Use Purpose


    ●      Confirm Inequality: Used to ensure that two values do not match.


    ●      Conditional Checks: Useful for validation and ensuring variables have specific
    values.


    Syntax


    if  (a != b)  {


    // Code to execute if a is not equal to b


    }


    Syntax Explanation


    ●      if: Starts the conditional statement.


    ● a != b: The comparison expression, returning  true if a and b are not equal.


    Simple Code Example


    if  (status != READY)  {


    delay();


    }


    Code Example Explanation


    ● If  status is not equal to  READY, the  delay() function is called, demonstrating
    the use of  != to handle non-matching conditions.


    Notes


    Use  != to check inequality, especially in situations where a specific value should
    be avoided.


    Warnings


    Avoid using  != with floating-point values to prevent precision-related issues.


    * * *


    3\. Greater Than (>)


    What is Greater Than


    The greater than operator (>) checks if the first value is larger than the second.
    It’s useful for comparing values in control applications.


    Use Purpose


    ● Compare Magnitudes: Used to confirm if one value is larger than another.


    ●      Conditional Execution: Often used in threshold-based conditions.


    Syntax


    if  (a > b)  {


    // Code to execute if a is greater than b


    }


    Syntax Explanation


    ●      if: Starts the conditional check.


    ● a > b: The comparison expression, which returns  true if a is greater than b.


    Simple Code Example


    if  (speed >  50)  {


    limitSpeed();


    }


    Code Example Explanation


    ● If  speed is greater than 50,  limitSpeed() is called. This demonstrates the
    greater than operator for conditions where a maximum threshold is needed.


    Notes


    Useful in situations where maximum limits or thresholds must be respected.


    Warnings


    Be careful with unsigned values in comparisons, as they may lead to unexpected
    results.


    * * *


    4\. Less Than (<)


    What is Less Than


    The less than operator (<) checks if the first value is smaller than the second.
    It’s commonly used in minimum threshold checks.


    Use Purpose


    ● Confirm Lower Limits: Ensures a value does not fall below a certain level.


    ●      Conditional Bounds: Useful in setting minimum thresholds for values.


    Syntax


    if  (a < b)  {


    // Code to execute if a is less than b


    }


    Syntax Explanation


    ●      if: Begins the conditional statement.


    ●      a < b: Returns  true if a is less than b.


    Simple Code Example


    if  (temperature <  20)  {


    turnHeaterOn();


    }


    Code Example Explanation


    ● If  temperature is below 20, the  turnHeaterOn() function runs, showing how  a
    < b can be used to control minimum limits.


    Notes


    Often used in safety limits to ensure values don’t go too low.


    Warnings


    Comparisons involving negative values should be carefully managed, as unsigned
    types may yield unexpected results.


    * * *


    5\. Greater Than or Equal To (>=)


    What is Greater Than or Equal To


    The greater than or equal to operator (>=) checks if the first value is larger
    than or equal to the second, making it useful in threshold-based decision-making.


    Use Purpose


    ● Check Upper Bound or Equal: Validates if a value meets or exceeds a required
    threshold.


    ●      Range Confirmation: Often used to confirm values are within acceptable
    ranges.


    Syntax


    if  (a >= b)  {


    // Code to execute if a is greater than or equal to b


    }


    Syntax Explanation


    ●      if: Begins the conditional structure.


    ● a >= b: Evaluates to  true if a is greater than or equal to b.


    Simple Code Example


    if  (voltage >=  3.3)  {


    startProcess();


    }


    Code Example Explanation


    ● If  voltage is 3.3V or higher,  startProcess() is called, demonstrating the
    use of  >= in threshold-based decision-making.


    Notes


    Ideal for applications requiring minimum acceptable levels.


    Warnings


    Ensure comparison values match data type ranges to avoid overflow or underflow.


    * * *


    6\. Less Than or Equal To (<=)


    What is Less Than or Equal To


    The less than or equal to operator (<=) checks if the first value is smaller than
    or equal to the second. It is commonly used in range and boundary checks.


