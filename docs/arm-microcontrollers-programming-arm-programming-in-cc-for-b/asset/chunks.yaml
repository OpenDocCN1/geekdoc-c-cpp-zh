    ●      Byte-Level Data: Often used for flags or small integers.


    Syntax


    char varName;


    Syntax Explanation


    ●      char: Specifies a single-byte character data type.


    ●      varName: The unique name given to the variable.


    Simple Code Example


    char grade =  ''A'';


    Code Example Explanation


    ● Declares a character variable  grade and assigns it the ASCII character  ''A''.


    Notes


    Characters are stored as integer ASCII values, making them useful for text-based
    data.


    Warnings


    Some compilers interpret  char as signed by default, limiting its range to -128
    to 127\. To avoid ambiguity, specify  unsigned char if necessary.


    * * *


    5\. Floating-Point


    What is Floating-Point


    The  float data type stores decimal values and is ideal for applications requiring
    fractional values, such as sensor measurements or scientific calculations.


    Use Purpose


    ●      Precision Required: Needed when calculations or measurements require fractional
    precision.


    ● Sensor Data: Ideal for real-world data like temperature or distance that includes
    decimal values.


    Syntax


    float varName;


    Syntax Explanation


    ●      float: Declares a floating-point data type, capable of holding decimal
    values.


    ●      varName: The name given to the variable.


    Simple Code Example


    float temperature =  36.5;


    Code Example Explanation


    ●      Declares a  float variable  temperature initialized to  36.5.


    Notes


    Floating-point calculations can be slower on microcontrollers, as they require
    more processing power and memory.


    Warnings


    Excessive use of floats can reduce performance in memory-constrained systems.


    * * *


    6\. Double Precision


    What is Double Precision


    The  double data type provides double the precision of  float, allowing for high-accuracy
    calculations, though at a higher memory cost.


    Use Purpose


    ●      High Precision Calculations: Needed when  float precision is insufficient.


    ●      Scientific Data: Used in calculations where high accuracy is essential.


    Syntax


    double varName;


    Syntax Explanation


    ●      double: Indicates double-precision floating-point, offering more precision
    than  float.


    ●      varName: The name of the variable.


    Simple Code Example


    double preciseValue =  3.1415926535;


    Code Example Explanation'
