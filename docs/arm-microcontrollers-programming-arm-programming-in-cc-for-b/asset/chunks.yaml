    5\. Constant Declaration


    What is Constant Declaration


    A constant is a variable whose value is fixed at the time of declaration and cannot
    be altered throughout the program’s execution. Constants are useful for defining
    stable parameters, such as mathematical constants or hardware configurations,
    which should not change during runtime.


    Use Purpose


    ● Fixed Parameters: Suitable for values that remain unchanged, like buffer sizes
    or conversion factors.


    ● Code Readability: Provides a meaningful name to important values, making the
    code easier to interpret and maintain.


    Syntax


    const type varName =  value;


    Syntax Explanation


    ● const: A keyword indicating that the variable is read-only and cannot be modified
    after initialization.


    ●      type: Specifies the data type of the constant (e.g.,  int,  float).


    ● varName: A descriptive name in uppercase (often a convention for constants)
    to distinguish it from variables that can change.


    ● value: The initial and unchangeable value assigned to the constant, matching
    the data type of  varName.


    Simple Code Example


    const  int MAX_LIMIT =  100; // Defines a constant with a value of 100


    Code Example Explanation


    ● Declares a constant integer  MAX_LIMIT with a fixed value of  100. This value
    cannot be changed during program execution, ensuring  MAX_LIMIT consistently represents  100
    whenever accessed in the code.


    Notes


    Constants make programs more readable and prevent accidental modification of important
    values.


    Warnings


