  trans: "\n\n## 处理传感器数据\n- 处理传感器数据：确保值始终为正数，这可以简化计算。\n\n### 语法\n```c\nint result\
    \ = abs(x);\n```\n\n### 语法解释\n- `result`：存储 `x` 的绝对值。\n- `abs(x)`：计算 `x` 的绝对值，`x`\
    \ 应该是一个整数。\n\n### 简单代码示例\n```c\nint value = -10;\nint magnitude = abs(value);\
    \ // Result 为 10\n```\n\n### 代码示例解释\n- 将 `value` 转换为其绝对值，演示了如何仅获取数值的幅度，这在距离计算等应用中很有帮助。\n\
    \n### 注意\n对于浮点值，请使用 `fabs` 而不是 `abs`。\n\n### 警告\n确保 `x` 是整数；对浮点值使用 `abs` 需要使用\
    \ `fabs`。\n\n***\n\n## 2. 幂 (pow)\n\n### 什么是幂\n幂函数 `pow` 将数字提升到特定的指数次方。它经常用于涉及指数增长、衰减或缩放因子的嵌入式应用。\n\
    \n### 用途\n- **数值幂运算**：在科学或缩放计算中计算指数值。\n- **控制算法**：用于涉及非线性控制律或函数的应用。\n\n### 语法\n\
    ```c\ndouble result = pow(x, y);\n```\n\n### 语法解释\n- `result`：存储 `x` 的 `y` 次方的的结果。\n\
    - `pow(x, y)`：将 `x` 提升到 `y` 次方，其中 `x` 和 `y` 是浮点数。\n\n### 简单代码示例\n```c\ndouble\
    \ voltage = pow(2, 3); // Result 为 8.0\n```\n\n### 代码示例解释\n- 计算 `2` 的 `3` 次方，适用于计算需要缩放因子或幂的情况。\n\
    \n### 注意\n在整数值上使用 `pow` 可能会导致浮点结果；必要时请转换为整数。\n\n### 警告\n避免对非整数指数使用负基数，因为这会导致未定义的结果。\n\
    \n***\n\n## 3. 平方根 (sqrt)\n\n### 什么是平方根\n平方根函数 `sqrt` 计算一个数的平方根。它通常用于几何、物理计算和归一化过程。\n\
    \n### 用途\n- **计算距离**：经常用于计算空间坐标应用距离。\n- **归一化**：用于嵌入式控制系统中的数值缩放。\n\n### 语法\n```c\n\
    double result = sqrt(x);\n```\n\n### 语法解释\n- `result`：存储 `x` 的平方根。\n- `sqrt(x)`：计算\
    \ `x` 的平方根，`x` 应该是一个非负浮点数。\n\n### 简单代码示例\n```c\ndouble distance = sqrt(16); //\
    \ Result 为 4.0\n```\n\n### 代码示例解释\n- 计算 `16` 的平方根，这是距离和空间计算中的常用操作。\n\n### 注意\n\
    `sqrt` 仅适用于非负值；否则将返回 `NaN`（非数字）。\n\n### 警告\n避免向 `sqrt` 传递负值，因为在实数范围内其结果是未定义的。\n\
    \n***\n\n## 4. 三角函数 (正弦 - sin)\n\n### 什么是正弦函数\n正弦函数 `sin` 计算角度的正弦值，通常以弧度为单位。这对于涉及旋转、波形或振荡的应用至关重要。\n\
    \n### 用途\n- **波形生成**：用于信号处理或 PWM 波形。\n- **角度计算**：用于三角计算，例如将角度转换为笛卡尔坐标。\n\n###\
    \ 语法\n```c\ndouble result = sin(x);\n```\n\n### 语法解释\n- `result`：存储 `x` 的正弦值。\n\
    - `sin(x)`：计算 `x` 的正弦值，`x` 应该是弧度。\n\n### 简单代码示例\n```c\ndouble angle = 1.57; //\
    \ 约为 π/2 弧度\ndouble sineValue = sin(angle); // Result 约为 1.0\n```\n\n### 代码示例解释\n\
    - 计算 `π/2` 弧度（90 度）的正弦值，用于计算角度和振荡。\n\n### 注意\n必要时，通过乘以 `π/180` 将角度转换为弧度。\n\n###\
    \ 警告\n确保角度是弧度而非角度，以获得准确的结果。\n\n***\n\n## 5. 三角函数 (余弦 - cos)\n\n### 什么是余弦函数\n余弦函数\
    \ `cos` 计算角度的余弦值，同样以弧度为单位。它用于波形、旋转和计算沿轴的投影。\n\n### 用途\n- **向量计算**：用于计算投影或旋转。\n\
    - **波形分析**：经常应用于信号处理中的相位偏移或生成余弦波。\n\n### 语法\n```c\ndouble result = cos(x);\n```\n\
    \n### 语法解释\n- `result`：存储 `x` 的余弦值。\n- `cos(x)`：计算 `x` 的余弦值，其中 `x` 应该是弧度。\n\n\
    ### 简单代码示例\n```c\ndouble angle = 1.57; // 约为 π/2 弧度\ndouble cosineValue = cos(angle);\
    \ // Result 约为 0.0\n```\n\n### 代码示例解释\n- 计算 `π/2` 弧度（90 度）的余弦值，演示了余弦在基于角度的计算中的作用。\n\
    \n### 注意\n在使用 `cos` 时，`sin` 一样将角度转换为弧度。\n\n### 警告\n确保输入角度为弧度；错误的输入可能导致意想不到的结果。\n\
    \n***\n\n## 相关项目部分\n\n### 项目名称\n机器人导航的距离与角度计算\n\n### 项目目标\n使用数学函数根据传感器输入计算运动的距离和方向。项目将使用绝对值、幂运算和平方根。\n\
    \n### 要求\n使用绝对值、幂运算和平方根计算距离和角度。\n\n### 组件表格\n| 组件 | 微控制器 | 注意 |\n| :--- | :---\
    \ | :--- |\n| 超声波传感器 | PA0 | ADC 输入 |\n| 舵机 | PB4 | PWM 输出 |\n| LED | PC3 | 数字输出\
    \ |\n\n### 项目代码\n```c\n#include \"stm324xx.h\"\n#include <math.h>\n\nvoid configureADC()\
    \ {\n    RCC->APB2ENR |= RCC_APB2EN_ADC1; // 开启 ADC1\n    ADC1->CR2 |= ADC_CR2_ADON;\n\
    }\n\nvoid configurePWM() {\n    RCC->APB1ENR |= RCC_APB1EN_TIM3; // 开启 TIM3\n\
    \    TIM3->CCMR1 |= TIM_CCMR1_OCM1; // 设置通道 1 为 PWM\n    TIM3->CCR1 = 28; // 初始占空\n\
    \    TIM3->CR1 |= TIM_CR1_CEN; // 开启 TIM3\n}\n\nvoid configureLED() {\n    RCC->AHB1ENR\
    \ |= RCC_AHB1EN_GPIOC; // 开启 GPIOC\n    GPIOC->MODER |= (1 << 6); // 设置 PC3 为输出\n\
    }\n\nuint16_t readADC() {\n    ADC1->CR2 |= ADC_CR2_SWSTART; // 开始转换\n    while\
    \ (!(ADC1->SR & ADC_SR_EOC)); // 等待转换完成\n    return ADC1->DR; // 读取 ADC 结果\n}\n\
    \nvoid setServoAngle(double angle) {\n    int dutyCycle = (int)(angle * 180 /\
    \ M_PI); // 弧度角度\n    TIM3->CCR1 = dutyCycle;\n}\n\nint main() {\n    configureADC();\
    \ // 配置 ADC\n    configurePWM(); // 配置舵机 PWM\n    configureLED(); // 配置 LED 阈值\n\
    \n    double distance;\n    uint16_t sensorData;\n\n    while (1) {\n        sensorData\
    \ = readADC(); // 读取距离传感器数据\n        distance = sqrt(pow(sensorData, 2)); // 计算距离幅度\n\
    \n        if (distance < 50.0) { // 阈值检查\n            GPIOC->BSRR = (1 << 3);\
    \ // 如果距离小于阈值则开启 LED\n        } else {\n            GPIOC->BSRR = (1 << (3 + 16));\
    \ // 关闭 LED\n        }\n\n        double angle = atan2(sensorData, distance);\
    \ // 计算方向角度\n        setServoAngle(angle); // 调整舵机到计算角度\n    }\n}\n```\n\n###\
    \ 保存并运行\n1.  保存、编译并将代码上传到 ARM 微控制器。\n\n"
