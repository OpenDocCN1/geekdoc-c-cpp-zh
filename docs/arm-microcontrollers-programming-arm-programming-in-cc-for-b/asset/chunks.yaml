  trans: "\n\n# 代码示例解释\n\n-   将 `SPI1` 配置为主设备并启用它。`SPI1` 现在可以通过 `SPI` 总线与连接到微控制器的从设备通信。\n\
    \n## 注意事项\n根据连接的的外围设备的规范，设置 `SPI` 速度、极性和相位。\n\n## 警告\n设置不当（例如错误的极性或相位）可能会导致无法与外部设备正常通信。\n\
    \n***\n\n## 相关项目章节\n\n### 项目名称\n基于中断停止的 PWM 电机速度控制\n\n### 项目目标\n使用 `PWM` 控制电机的速度，并在按下按钮时利用外部中断立即停止电机。\n\
    \n### 需求组件\n- `ARM 微控制器`（例如 `STM32`）\n- 连接到 `PWM` 输出引脚的 `直流电机`\n- 连接到外部中断引脚的 `推按键`\n\
    \n### 组件连接连接表\n| 组件 | 微控制器引脚 | 额外备注 |\n| :--- | :--- | :--- |\n| `直流电机` | `PWM\
    \ 输出引脚`（例如 `PB4`） | 控制电机速度 |\n| `推按键` | `外部中断引脚`（例如 `PA0`） | 按下触发电机停止 |\n\n###\
    \ 连接分析\n电机连接到 `PWM` 输出引脚，以根据占空比控制其速度。推按键连接到外部中断引脚，该引脚触发 `ISR` 立即停止电机。\n\n## 程序软件设置\n\
    1. 在 `STM32CubeIDE` 或 `Keil uVision` 中创建一个新项目。\n2. 配置定时器用于 `PWM` 输出以控制电机的速度。\n\
    3. 在按钮引脚上设置外部中断，以便在按下时停止电机。\n\n## 项目代码\n```cpp\n#include \"stm32f4xx.h\" // STM32\
    \ 设备特定头文件\n\nvoid configurePWM()  {\n  RCC->APB1ENR |= RCC_APB1ENR_TIM3EN;  //\
    \ 启用 TIM3 时钟\n  TIM3->CCMR1 |= TIM_CCMR1_OC1M_PWM1; // 将 TIM3 通道 1 设置为 PWM 模式\n\
    \  TIM3->CCR1 =  128;                 // 设置初始占空比为 50%\n  TIM3->CR1 |= TIM_CR1_CEN;\
    \           // 启用 TIM3\n}\n\nvoid configureInterrupt()  {\n  RCC->APB2ENR |= RCC_APB2ENR_SYSCFGEN;\
    \  // 启用系统配置控制器\n  EXTI->IMR |=  (1  <<  0);              // 取消线 0 (PA0) 的断屏蔽\n\
    \  EXTI->RTSR |=  (1  <<  0);             // 在上升沿触发中断\n  NVIC_SetPriority(EXTI0_IRQn,\
    \  2);      // 设置中断优先级\n  NVIC_EnableIRQ(EXTI0_IRQn);           // 在 NVIC 中启用\
    \ EXTI0 中断\n}\n\nvoid EXTI0_IRQHandler(void)  {\n  if  (EXTI->PR &  (1  <<  0))\
    \  { // 检查是否触发了 EXTI 线 0\n    TIM3->CCR1 =  0;                 // 通过将占空比置为 0 停止电机\n\
    \    EXTI->PR |=  (1  <<  0);         // 清除挂起中断\n  }\n}\n\nint main()  {\n  configurePWM();\
    \    // 设置用于电机控制的 PWM\n  configureInterrupt();  // 设置停止按钮的外部中断\n  while  (1) \
    \ {\n    // 主循环，如有需要可以根据其他因素调整 PWM\n  }\n}\n```\n\n## 保存并运行\n1. 保存、编译并将代码上传到 `ARM`\
    \ 微控制器。\n2. 按下按钮停止电机，演示 `PWM` 和中断功能。\n\n## 检查输出\n- 电机速度最初应由 `PWM` 占空比设置，按下按钮应立即停止电机，表明\
    \ `PWM` 和外部中断使用成功。\n\n## 控制结构\n\n### 章节概述\n控制结构允许嵌入式程序做出决策、根据条件执行代码，并根据某些条件重复操作。`ARM`\
    \ 微控制器使用 `if`、`for`、`while` 和 `switch` 等控制结构来创建动态、响应且高效的代码。本章将通过实际示例探索每个控制结构的语法和用处。\n\
    \n### 章节目标\n- 理解并实现控制结构以管理程序流。\n- 学习使用条件语句和循环来控制微控制器任务。\n- 实现一个在真实场景中演示控制结构的实用项目。\n\
    \n### 规则\n- **条件判断**：使用 `if` 进行决策。\n- **循环**：使用 `for` 和 `while` 重复任务。\n- **Switch**：使用\
    \ `switch` 处理多个条件。\n\n### 控制结构简介绍\n控制结构允许嵌入式程序做出决策、根据条件执行代码，并根据某些条件重复操作。`ARM`\
    \ 微控制器使用 `if`、`for`、`while` 和 `switch` 等控制结构来创建动态、响应且高效的代码。\n\n### 语法表\n|  | 主题\
    \ | 语法 |\n| :--- | :--- | :--- |\n| 1 | If 语句 | `if (condition)` |\n| 2 | For\
    \ 循环 | `for (initialization; condition; update)` |\n| 3 | While 循环 | `while (condition)`\
    \ |\n| 4 | Do-While 循环 | `do { ... } while (condition)` |\n| 5 | Switch 语句 | `switch\
    \ (variable)` |\n\n***\n\n## 1. If 语句\n\n### 什么是 If 语句\n`if` 语句允许程序在满足条件时执行代码块。它是决策的主要工具。\n\
    \n### 用途\n- **条件执行**：根据条件执行代码。\n- **决策**：通过评估真值控制程序流。\n\n### 语法\n```cpp\nif (condition)\
    \ {\n  // 执行代码\n}\n```\n\n### 语法解释\n- `if`：条件结构的关键字。\n- `condition`：评估为真或假的表达式。\n\
    - `{ code }`：在真时执行的块。\n\n### 示例代码\n```cpp\nif (sensorValue > 100) {\n  LEDOn();\n\
    }\n```\n\n### 示例解释\n如果 `sensorValue` 大于 100，则调用 `LEDOn()`，演示基于数据的决策。\n\n### 注意事项\n\
    `if` 语句可以使用 `else if` 进行扩展。\n\n### 警告\n在条件中使用复杂的表达式可能会降低执行速度。\n\n***\n\n## 2.\
    \ For 循环\n\n### 什么是 For 循环\n`for` 循环按指定的次数重复代码块，由初始化、条件和更新表达式控制。\n\n### 用途\n-\
    \ **迭代执行**：按设定次数执行代码。\n- **控制循环**：适用于具有已知重复限制的任务。\n\n### 语法\n```cpp\nfor (initialization;\
    \ condition; update) {\n  // 执行代码\n}\n```\n\n### 语法解释\n- `initialization`：设置起点，通常通过声明计数器变量。\n\
    - `condition`：只要该表达式为真，循环继续。\n- `update`：在每次迭代后调整计数器或变量。\n\n### 示例代码\n```cpp\n\
    for (int i = 0; i < 10; i++) {\n  toggleLED();\n}\n```\n\n### 示例解释\n`toggleLED()`\
    \ 被调用 10 次。当 `i` 小于 10 时循环运行，每次 `i` 增加 1。\n\n### 注意事项\n`for` 循环对于具有精确计数的任务非常高效。\n\
    \n***\n\n## 3. While 循环\n\n### 什么是 While 循环\n`while` 循环在指定条件为真时重复执行代码块，适用于根据外部因素进行无限循环。\n\
    \n### 用途\n- **条件循环**：在条件保持为真时重复执行代码。\n- **持续监控**：适用于无设定次数的传感器或输入监控。\n\n### 语法\n\
    ```cpp\nwhile (condition) {\n  // 执行代码\n}\n```\n\n"
- fmt: "\n## 3. While Loop\n\n- `while`: The keyword that starts the loop.\n- `condition`:\
    \ An expression evaluated before each iteration, determining whether the loop\
    \ should continue.\n\n### Simple Code Example\n```\nwhile (sensorValue < 50) {\n\
    \    adjustOutput();\n}\n```\n\n### Code Example Explanation\n- As long as `sensorValue`\
    \ is less than 50, `adjustOutput()` will continue to run. When `sensorValue` reaches\
    \ 50 or more, the loop exits.\n\n### Notes\n`while` loops are effective for monitoring\
    \ conditions that may change based on real-time data.\n\n### Warnings\nAvoid infinite\
    \ loops by ensuring the condition will eventually become false, or by including\
    \ a `break` condition.\n\n***\n\n## 4. Do-While Loop\n\n### What is Do-While Loop\n\
    The `do-while` loop executes a code block at least once and then repeats it as\
    \ long as the condition is true. It’s useful for tasks that need an initial execution\
    \ regardless of conditions.\n\n### Use Purpose\n- **Guaranteed First Execution**:\
    \ Ensures code runs at least once, even if the condition is false.\n- **Condition-Based\
    \ Repeating**: Useful for repeated tasks with variable conditions.\n\n### Syntax\n\
    ```\ndo {\n    // Code to execute\n} while (condition);\n```\n\n### Syntax Explanation\n\
    - `do`: Starts the loop by executing the block once.\n- `condition`: Checked after\
    \ each iteration to decide if the loop should continue.\n\n### Simple Code Example\n\
    ```\ndo {\n    calibrateSensor();\n} while (sensorStatus != READY);\n```\n\n###\
    \ Code Example Explanation\n- The `calibrateSensor()` function runs at least once\
    \ and continues to run until `sensorStatus` equals `READY`.\n\n### Notes\nThe\
    \ `do-while` loop guarantees that the code block will run once, even if the condition\
    \ is initially false.\n\n### Warnings\nEnsure the loop has an exit condition to\
    \ prevent infinite repetition.\n\n***\n\n## 5. Switch Statement\n\n### What is\
    \ Switch Statement\nThe `switch` statement allows the program to execute different\
    \ code based on the value of a variable, making it ideal for multi-condition checks.\n\
    \n### Use Purpose\n- **Efficient Multi-Case Handling**: Reduces complexity in\
    \ code with multiple options.\n- **Alternative to If-Else Chains**: Provides a\
    \ more readable structure for handling several distinct values.\n\n### Syntax\n\
    ```\nswitch (variable) {\n    case value1:\n        // Code for case value1\n\
    \        break;\n    case value2:\n        // Code for case value2\n        break;\n\
    \    default:\n        // Code for all other cases\n        break;\n}\n```\n\n\
    ### Syntax Explanation\n- `switch`: Begins the multi-case control structure.\n\
    - `variable`: The expression or variable evaluated by the `switch`.\n- `case`:\
    \ Specifies each possible value for `variable`, with code to execute if it matches.\n\
    - `break`: Exits the `switch` after executing a case to prevent “fall-through.”\n\
    \n### Simple Code Example\n```\nswitch (buttonState) {\n    case 1:\n        LED_On();\n\
    \        break;\n    case 2:\n        LED_Off();\n        break;\n    default:\n\
    \        LED_Toggle();\n        break;\n}\n```\n\n### Code Example Explanation\n\
    - Based on `buttonState`, the `switch` toggles an LED, turns it on, or turns it\
    \ off. The `break` statements ensure each case executes independently.\n\n###\
    \ Notes\n`switch` statements work only with integer, character, or enumerated\
    \ types.\n\n### Warnings\nAlways include a `default` case to handle unexpected\
    \ values and prevent undefined behavior.\n\n***\n\n## Relevant Project Section\n\
    \n### Project Name\nTemperature-Controlled Fan System\n\n### Project Goal\nUse\
    \ control structures to manage a fan’s operation based on temperature readings\
    \ from a sensor. The fan speed adjusts according to the temperature range, and\
    \ an emergency shutdown occurs if the temperature exceeds a threshold.\n\n###\
    \ Requirement Components\n- `ARM` Microcontroller (e.g., `STM32`)\n- Temperature\
    \ sensor connected to an `ADC` pin\n- Fan connected to a `PWM` output pin\n- `LED`\
    \ for emergency indication\n\n### Component Connection Table\n| Component | Microcontroller\
    \ Pin | Additional Notes |\n| :--- | :--- | :--- |\n| Temperature Sensor | `ADC`\
    \ Input Pin (e.g., `PA0`) | Provides analog temperature input |\n| Fan | `PWM`\
    \ Output Pin (e.g., `PB4`) | Controls fan speed |\n| LED | Digital Output Pin\
    \ (e.g., `PC3`) | Indicates emergency state |\n\n### Connection Analysis\nThe\
    \ temperature sensor provides real-time readings to the microcontroller, which\
    \ adjusts the fan’s speed using `PWM` based on the temperature range. If the temperature\
    \ exceeds a safety threshold, the `LED` turns on, indicating an emergency state.\n\
    \n### Program Software Setup\n1. Create a new project in `STM32CubeIDE` or `Keil\
    \ uVision`.\n2. Configure the `ADC` to read the temperature sensor data.\n3. Set\
    \ up `PWM` for the fan control and configure the `LED` as a digital output.\n\n\
    ### Project Code\n```cpp\n#include \"stm32f4xx.h\" // Device-specific header for\
    \ STM32\n\nvoid configureADC() {\n    RCC->APB2ENR |= RCC_APB2ENR_ADC1EN;  //\
    \ Enable ADC1 clock\n    ADC1->CR2 |= ADC_CR2_ADON;           // Enable ADC1\n\
    }\n\nvoid configurePWM() {\n    RCC->APB1ENR |= RCC_APB1ENR_TIM3EN;  // Enable\
    \ TIM3 clock\n    RCC->APB2ENR |= RCC_APB2ENR_GPIOCEN; // Enable GPIOC clock\n\
    \    GPIOC->MODER |= (2 << (2 * 3));      // Set PC3 as output\n    TIM3->CCMR1\
    \ |= (6 << 4);            // Set PWM mode 1 1\n    TIM3->CCR1 = 500;         \
    \          // Set duty cycle\n    TIM3->CR1 |= 1;                      // Enable\
    \ counter\n}\n\nint main() {\n    uint16_t temperature;\n    configureADC();\n\
    \    configurePWM();\n    \n    while (1) {\n        // Read ADC logic\n     \
    \   ADC1->CR2 |= ADC_CR2_SWSTART;\n        while (!(ADC1->SR & ADC_SR_EOC));\n\
    \        temperature = ADC1->DR;\n\n        switch (temperature) {\n         \
    \   case 1:\n                GPIOC->BSRR = (1 << 3); // LED On\n             \
    \   break;\n            case 2:\n                GPIOC->BSRR = (1 << (3+16));\
    \ // LED Off\n                break;\n            default:\n                GPIOC->BSRR\
    \ = (1 << 3); // Toggle logic\n                break;\n        }\n    }\n}\n```\n\
