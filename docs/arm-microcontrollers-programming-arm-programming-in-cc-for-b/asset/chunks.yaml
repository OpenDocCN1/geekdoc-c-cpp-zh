    TIM3->CCMR1 |= TIM_CCMR1_OC1M_PWM1; // Set TIM3 Channel 1 to PWM mode


    TIM3->CCR1 =  128;                    // Set initial duty cycle to 50%


    TIM3->CR1 |= TIM_CR1_CEN;            // Enable TIM3


    }


    void configureInterrupt()  {


    RCC->APB2ENR |= RCC_APB2ENR_SYSCFGEN;  // Enable system configuration controller


    EXTI->IMR |=  (1  <<  0);                 // Unmask interrupt on line 0 (PA0)


    EXTI->RTSR |=  (1  <<  0);                // Trigger interrupt on rising edge


    NVIC_SetPriority(EXTI0_IRQn,  2);       // Set interrupt priority


    NVIC_EnableIRQ(EXTI0_IRQn);            // Enable EXTI0 interrupt in NVIC


    }


    void EXTI0_IRQHandler(void)  {


    if  (EXTI->PR &  (1  <<  0))  {       // Check if EXTI line 0 was triggered


    TIM3->CCR1 =  0;              // Stop motor by setting duty cycle to 0


    EXTI->PR |=  (1  <<  0);        // Clear the pending interrupt


    }


    }


    int main()  {


    configurePWM();       // Set up PWM for motor control


    configureInterrupt();  // Set up external interrupt for stop button


    while  (1)  {


    // Main loop where PWM can be adjusted based on other factors if needed


    }


    }


    Save and Run


    1.  Save, compile, and upload the code to the ARM microcontroller.


    2.  Press the button to stop the motor, demonstrating PWM and interrupt functionality.


    Check Output


    ● The motor speed should initially be set by the PWM duty cycle, and pressing
    the button should instantly stop the motor, indicating the successful use of PWM
    and external interrupts.


    ## Control Structure


    Chapter Overview


    Control structures allow embedded programs to make decisions, execute code conditionally,
    and repeat actions based on certain conditions. ARM microcontrollers use control
    structures such as  if,  for,  while, and  switch to create dynamic, responsive,
    and efficient code. This chapter will explore the syntax and use of each control
    structure with practical examples.


    Chapter Goal


    ●      Understand and implement control structures to manage program flow.


    ●      Learn to use conditional statements and loops to control microcontroller
    tasks.


    ●      Implement a practical project demonstrating control structures in a real-world
    scenario.


    Rules


    ● Conditionals: Use  if statements to evaluate true or false conditions for decision-making.


    ● Loops: Use  for or  while loops to repeat tasks based on conditions or counters.


    ●      Switch Statements: Use  switch for multi-case decisions to improve readability.


    ● Break and Continue: Use  break to exit loops and  continue to skip loop iterations
    selectively.


    Brief Introduction to Control Structures


    Control structures in embedded C programming allow programs to execute specific
    sections of code based on conditions. Common structures include  if for conditional
    decisions,  for and  while for looping, and  switch for handling multiple conditions.
    By controlling program flow, we can respond to sensor data, user inputs, and other
    real-time events effectively.


    Syntax Table


    | Serial No | Topic | Syntax | Simple Example |


    | 1 | If Statement | if (condition) { /* code */ } | if (sensorValue > 100) {
    } |


    | 2 | For Loop | for (init; condition; update) { /* code */ } | for (int i = 0;
    i < 10; i++) { } |


    | 3 | While Loop | while (condition) { /* code */ } | while (count < 10) { } |


    | 4 | Do-While Loop | do { /* code */ } while (condition); | do { } while (i <
    5); |


    | 5 | Switch Statement | switch (variable) { case x: /* code */; } | switch (state)
    { case 1: } |


    * * *


    Detailed Breakdown for Each Command


    1\. If Statement


    What is If Statement


    The  if statement allows the program to execute a block of code only if a specified
    condition is true. It’s the primary tool for decision-making in embedded programming.


    Use Purpose


    ●      Conditional Execution: Executes code blocks based on real-time conditions.


    ●      Decision-Making: Helps control program flow by evaluating true or false
    conditions.


    Syntax


    if  (condition)  {


    // Code to execute if condition is true


    }


    Syntax Explanation


    ●      if: The keyword that starts the conditional structure.


    ● condition: An expression evaluated as true or false, often involving comparisons
    like  ==, >, or <.


    ● { /* code */ }: The code block that executes if the condition is true.


    Simple Code Example


    if  (sensorValue >  100)  {


    LED_On();


    }


    Code Example Explanation


    ● If  sensorValue is greater than 100, the  LED_On() function is called to turn
    on an LED, demonstrating conditional control based on sensor data.


    Notes


    If statements can be extended with  else if and  else for more complex decision-making.


    Warnings


    Avoid complex expressions in the condition as they can slow down program execution,
    especially in time-sensitive applications.


    * * *


    2\. For Loop


    What is For Loop


    The  for loop repeats a block of code a specified number of times, controlled
    by an initialization, a condition, and an update expression.


    Use Purpose


    ●      Iterative Execution: Executes code repeatedly for a set number of times.


    ● Controlled Looping: Ideal for tasks with known repetition limits, such as counting
    or iterating through arrays.


    Syntax


    for  (initialization; condition; update)  {


    // Code to execute on each iteration


    }


    Syntax Explanation


    ● initialization: Sets the starting point, usually by declaring and initializing
    a counter variable.


    ●      condition: The loop continues as long as this expression is true.


    ●      update: Adjusts the counter or variables after each iteration.


    Simple Code Example


    for  (int i =  0; i <  10; i++)  {


    toggleLED();


    }


    Code Example Explanation


    ● The  toggleLED() function is called 10 times. The loop runs while i is less
    than 10, and i increments by 1 with each iteration.


    Notes


    For loops are efficient for repeating tasks with precise counts.


    Warnings


    Avoid modifying the loop variable inside the loop, as it may lead to unintended
    behavior.


    * * *


    3\. While Loop


    What is While Loop


    The  while loop repeats a block of code as long as a specified condition is true,
    useful for indefinite looping based on external factors like sensor readings.


    Use Purpose


    ●      Conditional Looping: Executes code repeatedly while a condition remains
    true.


