    \n## 章节目标\n● 理解比较运算符的功能和语法。\n● 学习如何在条件语句中使用比较运算符。\n● 实现一个在真实世界应用中演示比较运算符的项目。\n\
    \n## 规则\n● 使用适当的数据类型：确保操作数具有兼容的类型以进行准确比较。\n● 避免非预期的比较：小心处理浮点数比较，因为精度误差可能会影响结果。\n\
    ● 使用逻辑链连接条件：使用逻辑运算符处理更复杂的条件。\n● 警惕赋值错误：避免在条件语句中使用 `=` 代替 `==`。\n\n## 比较运算符简介绍\n\
    比较运算符允许我们比较两个值，并返回一个布尔结果（真或假）。这些运算符常用于 `if` 语句、循环和其他控制结构，以确定程序流。常见的比较运算符包括等于 (`==`)、不等于\
    \ (`!=`)、大于 (`>`)、小于 (`<`)、大于等于 (`>=`）和小于等于 (`<=`)。\n\n## 语法表\n\n| 序号 | 主题 | 语法\
    \ | 简单示例 |\n| :--- | :--- | :--- | :--- |\n| 1 | 等于 | `a == b` | `if (temp ==\
    \ 100)` |\n| 2 | 不等于 | `a != b` | `if (status != READY)` |\n| 3 | 大于 | `a > b`\
    \ | `if (speed > 50)` |\n| 4 | 小于 | `a < b` | `if (distance < 100)` |\n| 5 | 大于等于\
    \ | `a >= b` | `if (voltage >= 3.3)` |\n| 6 | 小于等于 | `a <= b` | `if (count <=\
    \ 10)` |\n\n## 命令详细详解\n\n### 1. 等于 (==)\n**什么是等于**\n等于运算符 (`==`) 检查两个值是否相同。用于比较变量或常量，如果它们相等则返回真，否则返回假。\n\
    \n**用途**\n● 检查相等性：用于验证两个值是否相同。\n● 条件决策：在 `if` 语句中进行决策至关重要。\n\n**语法**\n```c\nif\
    \ (a == b) {\n    // 如果 a 等于 b 执行的代码\n}\n```\n\n**语法解释**\n● `if`: 启动语句的关键字。\n\
    ● `a == b`: 检查 `a` 是否等于 `b` 的比较表达式。\n\n**简单代码示例**\n```c\nif (sensorValue == 100)\
    \ {\n    activateAlarm();\n}\n```\n\n**代码示例解释**\n● 如果 `sensorValue` 等于 100，则调用\
    \ `activateAlarm()`。这展示了如何使用 `==`。\n\n**注意**\n仅在比较值时使用 `==`，使用 `=` 进行赋值。\n\n**警告**\n\
    避免直接使用 `==` 比较浮点数值。\n\n### 2. 不等于 (!=) \n**什么是不等于**\n不等于运算符 (`!=`) 检查两个值是否不同。如果它们不等则返回真，如果相同则返回假。\n\
    \n**用途**\n● 确认不相等性：用于确保两个值不匹配。\n● 条件检查：有助于验证并确保变量具有特定值。\n\n**语法**\n```c\nif (a\
    \ != b) {\n    // 如果 a 不等于 b 执行的代码\n}\n```\n\n**语法解释**\n● `if`: 启动语句。\n● `a !=\
    \ b`: 比较表达式，如果 `a` 和 `b` 不等则返回真。\n\n**简单代码示例**\n```c\nif (status != READY) {\n\
    \    delay();\n}\n```\n\n**代码示例解释**\n● 如果 `status` 不等于 `READY`，则调用 `delay()`，展示了如何使用\
    \ `!=` 处理不匹配的情况。\n\n**注意**\n使用 `!=` 检查不相等性，特别是在应该避免特定值的情况下。\n\n**警告**\n避免在浮点数值上使用\
    \ `!=` 以防止与精度相关的问题。\n\n### 3. 大于 (>)\n**什么是大于**\n大于运算符 (`>`) 检查第一个值是否大于第二个值。它在控制应用中的值比较中有用。\n\
    \n**用途**\n● 比较大小：用于确认一个值是否大于另一个值。\n● 条件决策：在逻辑判断中至关重要。\n\n**语法**\n```c\nif (a >\
    \ b) {\n    // 如果 a 大于 b 执行的代码\n}\n```\n\n**语法解释**\n● `if`: 启动语句。\n● `a > b`:\
    \ 检查 `a` 是否大于 `b` 的比较表达式。\n\n**简单代码示例**\n```c\nif (speed > 50) {\n    // 执行操作\n\
    }\n```\n\n**代码示例解释**\n● 如果 `speed` 大于 50，则执行操作。这展示了大于运算符的用法。\n\n**注意**\n用于比较阈值的比较。\n\
    \n**警告**\n在处理浮点数精度问题时要小心。\n\n### 4. 小于 (<)\n**什么是小于**\n小于运算符 (`<`) 检查第一个值是否小于第二个值。它在控制应用的值比较中有用。\n\
    \n**用途**\n● 确认下限：用于确认一个值是否小于另一个值。\n● 条件检查：用于设置阈值。\n\n**语法**\n```c\nif (a < b)\
    \ {\n    // 如果 a 小于 b 执行的代码\n}\n```\n\n**语法解释**\n● `if`: 启动语句。\n● `a < b`: 检查\
    \ `a` 是否小于 `b` 的比较表达式。\n\n**简单代码示例**\n```c\nif (distance < 100) {\n    // 执行操作\n\
    }\n```\n\n**代码示例解释**\n● 如果 `distance` 小于 100，则执行操作。这展示了小于运算符的用法。\n\n**注意**\n用于设置下限的比较。\n\
    \n**警告**\n在处理浮点数精度问题时要小心。\n\n### 5. 大于等于 (>=)\n**什么是大于等于**\n大于等于运算符 (`>=`) 检查第一个值是否大于或等于第二个值。它在比较应用中非常有用。\n\
    \n**用途**\n● 检查上限或相等：用于验证一个值是否达到或超过阈值。\n● 范围确认：用于确认值在接受范围内。\n\n**语法**\n```c\nif\
    \ (a >= b) {\n    // 如果 a 大于或等于 b 执行的代码\n}\n```\n\n**语法解释**\n● `if`: 启动语句。\n●\
    \ `a >= b`: 如果 `a` 大于或等于 `b` 则返回真。\n\n**简单代码示例**\n```c\nif (voltage >= 3.3) {\n\
    \    startProcess();\n}\n```\n\n**代码示例解释**\n● 如果 `voltage` 大于或等于 3.3，则调用 `startProcess()`，这展示了在决策中使用\
    \ `>=`。\n\n**注意**\n适用于需要最小接受水平的应用。\n\n**警告**\n确保比较值与数据类型范围匹配以防止溢出或欠溢。\n\n### 6.\
