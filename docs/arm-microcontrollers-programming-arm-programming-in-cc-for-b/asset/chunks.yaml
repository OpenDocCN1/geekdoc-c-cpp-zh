    \ `RS` 和 `EN` 允许在命令模式和数据模式之间切换。对比度引脚上的电位器可以调整可见度。\n\n## 程序软件设置\n\n1. 在 `STM32CubeIDE`\
    \ 或 `Keil uVision` 中创建一个新项目。\n2. 为每个 LCD 引脚（`RS`、`EN` 和 `D4-D7`）配置 `GPIO`。\n3.\
    \ 实现代码以初始化 `LCD` 并显示消息。\n\n## 项目代码\n\n```c\n#include \"stm32f4xx.h\" // STM32\
    \ 设备专有头文件\n\nvoid delay(int ms) {\n    for (volatile int i = 0; i < ms * 1000;\
    \ i++); // 简单的延迟循环\n}\n\nvoid pulseEnable() {\n    GPIOA->BSRR = (1 << 1); //\
    \ 将 EN 置高\n    delay(1);\n    GPIOA->BSRR = (1 << (1 + 16)); // 将 EN 置低\n}\n\n\
    void sendCommand(uint8_t cmd) {\n    GPIOA->BSRR = (1 << (0 + 16)); // RS 置低表示命令\n\
    \    GPIOB->ODR = (cmd & 0xF0); // 发送高 4 位\n    pulseEnable();\n    GPIOB->ODR\
    \ = (cmd << 4); // 发送低 4 位\n    pulseEnable();\n    delay(2);\n}\n\nvoid sendData(uint8_t\
    \ data) {\n    GPIOA->BSRR = (1 << 0); // RS 置高表示数据\n    GPIOB->ODR = (data &\
    \ 0xF0); // 发送高 4 位\n    pulseEnable();\n    GPIOB->ODR = (data << 4); // 发送低\
    \ 4 位\n    pulseEnable();\n    delay(2);\n}\n\nvoid initLCD() {\n    GPIOA->MODER\
    \ |= (1 << (0 * 2)) | (1 << (1 * 2)); // 设置 PA0, PA1 为输出 (RS, EN)\n    GPIOB->MODER\
    \ |= 0x00000055; // 设置 PB0-PB3 为输出 (D4-D7)\n    delay(20); // 延迟\n    sendCommand(0x02);\
    \ // 以 4 位模式初始化\n    sendCommand(0x28); // 2 行，5x8 字体\n    sendCommand(0x0C);\
    \ // 显示开启，光标关闭\n    sendCommand(0x06); // 光标递增\n    sendCommand(0x01); // 清除显示\n\
    }\n\nvoid setCursor(int row, int col) {\n    int address = (row == 0 ? 0x80 :\
    \ 0xC0) + col;\n    sendCommand(address);\n}\n\nint main() {\n    initLCD(); //\
    \ 初始化 LCD\n    setCursor(0, 0); // 设置光标到第一行开头\n    sendData('H'); // 显示 \"Hello,\
    \ World!\"\n    sendData('e');\n    sendData('l');\n    sendData('l');\n    sendData('o');\n\
    \    sendData(',');\n    sendData(' ');\n    sendData('W');\n    sendData('o');\n\
    \    sendData('r');\n    sendData('l');\n    sendData('d');\n    sendData('!');\n\
    \    setCursor(1, 0); // 设置光标到第二行\n    sendData('A'); // 显示自定义消息第二行\n    sendData('R');\n\
    \    sendData(' ');\n    sendData('M');\n    sendData('C');\n    sendData('U');\n\
    \    while (1);\n}\n```\n\n## 保存并运行\n\n1. 保存、编译并将代码上传到 `ARM 微控制器` 中。\n2. `LCD`\
    \ 应该在第一行显示 \"Hello, World!\"，第二行显示 \"ARM MCU\"。\n\n## 检查输出\n\n确认 `LCD` 正确显示 \"\
    Hello, World!\" 和 \"ARM MCU\"。如有需要，调整对比度。\n\n## Wi-Fi IoT 应用\n\n### 章节概述\nWi-Fi\
    \ 连接性让 ARM 微控制器具备接入互联网的能力，使其能够远程控制、监控和数据记录等 IoT 功能。通过连接到 Wi-Fi 网络，微控制器可以与云服务、移动应用程序或\
    \ Web 服务器通信，使其成为智能设备的理想选择。本章提供了关于配置 Wi-Fi 模块、管理 HTTP 请求以及实现 Wi-Fi 控制项目的详尽指南。\n\
    \n### 章节目标\n- 学习将 Wi-Fi 模块与 ARM 微控制器接口以用于 IoT 应用。\n- 掌握用于发送和接收命令的 HTTP 请求基础。\n\
    - 完成通过 Wi-Fi 控制 LED 的项目。\n\n### 规则\n- **确保 Wi-Fi 模块电源稳定**：Wi-Fi 模块在传输过程中消耗功率；请确保电源稳定。\n\
    - **使用兼容的波特率**：确认微控制器与 Wi-Fi 模块之间的波特率匹配。\n- **检查网络凭据**：确保 `SSID` 和密码准确以实现成功连接。\n\
    - **优雅地处理网络错误**：针对连接失败和超时实现错误检查以提高可靠性。\n\n"
- fmt: "\n# Warnings\nIncorrect IP or closed ports will prevent a successful connection.\n\
    \n***\n\n## 4. Send HTTP Request\n\n### What is Send HTTP Request\nSending an\
    \ HTTP request transmits data to a server. This command specifies the number of\
    \ bytes to send, followed by the actual HTTP request data.\n\n### Use Purpose\n\
    - **Transmit Data**: Used to send data to a web server.\n- **IoT Control**: Facilitates\
    \ sending control commands over HTTP.\n\n### Syntax\n```\nAT+CIPSEND=<length>\n\
    ```\n\n### Syntax Explanation\n- `AT+CIPSEND`: Command to initiate data transmission.\n\
    - `<length>`: Length of the data (in bytes) to be transmitted.\n\n### Simple Code\
    \ Example\n```c\nsendCommand(\"AT+CIPSEND=20\");\nsendCommand(\"GET /LED=ON HTTP/1.1\\\
    r\\n\\r\\n\");\n```\n\n### Code Example Explanation\n- Prepares to send a 20-character\
    \ HTTP GET request to control the LED.\n\n### Notes\nEnsure the data length matches\
    \ the actual data sent to prevent errors.\n\n### Warnings\nMismatched data length\
    \ may cause incomplete transmissions.\n\n***\n\n## 5. Close Connection\n\n###\
    \ What is Close Connection\nClosing the connection releases resources and prepares\
    \ the module for future connections.\n\n### Use Purpose\n- **End Communication**:\
    \ Closes the TCP connection to the server.\n- **Free Resources**: Ensures the\
    \ module can make new connections.\n\n### Syntax\n```\nAT+CIPCLOSE\n```\n\n###\
    \ Syntax Explanation\n- `AT+CIPCLOSE`: Command to close the active TCP connection.\n\
    \n### Simple Code Example\n```c\nsendCommand(\"AT+CIPCLOSE\");\n```\n\n### Code\
    \ Example Explanation\n- Closes the connection, preparing the module for new commands.\n\
    \n### Notes\nAlways close connections to manage resources effectively.\n\n###\
    \ Warnings\nLeaving connections open may lead to network issues and resource constraints.\n\
    \n***\n\n## Relevant Project Section\n\n### Project Name\nWi-Fi LED Control\n\n\
    ### Project Goal\nControl an LED on the ARM microcontroller remotely through Wi-Fi\
    \ by sending commands over HTTP. This project demonstrates the use of Wi-Fi for\
    \ remote control, an essential component in IoT applications.\n\n### Requirement\
    \ Components\n- ARM Microcontroller (e.g., `STM32`)\n- Wi-Fi module (e.g., `ESP8266`)\
    \ connected to `UART`\n- LED connected to a `GPIO` pin\n- Access to a Wi-Fi network\
    \ and a web server or smartphone app to send HTTP requests\n\n### Component Connection\
    \ Table\n| Component | Microcontroller Pin | Additional Notes |\n| :--- | :---\
    \ | :--- |\n| Wi-Fi Module | `UART TX/RX Pins` (e.g., `PA2`, `PA3`) | Enables\
    \ communication with `ESP8266` |\n| LED | Digital Output Pin (e.g., `PC3`) | LED\
    \ toggled via Wi-Fi commands |\n\n### Connection Analysis\nThe ARM microcontroller\
    \ connects to the Wi-Fi module over `UART`, sending and receiving AT commands.\
    \ When an HTTP request is received, the microcontroller interprets the command\
    \ to toggle the LED state.\n\n### Program Software Setup\n1. Create a new project\
    \ in `STM32CubeIDE` or `Keil uVision`.\n2. Configure `UART` for Wi-Fi module communication\
    \ and `GPIO` for LED control.\n3. Implement code to process HTTP requests and\
    \ toggle the LED based on commands.\n\n### Project Code\n```c\n#include \"stm32f4xx.h\"\
    \ // Device-specific header for STM32\n#include <stdio.h>\n#include <string.h>\n\
    \nvoid configureUART() {\n    RCC->APB1ENR |= RCC_APB1ENR_USART2EN;  // Enable\
    \ USART2 clock\n    USART2->BRR = 0x0683;                   // Set baud rate to\
    \ 9600\n    USART2->CR1 |= USART_CR1_UE | USART_CR1_TE | USART_CR1_RE; // Enable\
    \ UART\n}\n\nvoid configureLED() {\n    RCC->AHB1ENR |= RCC_AHB1ENR_GPIOCEN; \
    \ // Enable GPIOC clock\n    GPIOC->MODER |= (1 << 6);               // Set PC3\
    \ as output\n}\n\nvoid sendCommand(const char *command) {\n    for (size_t i =\
    \ 0; i < strlen(command); i++) {\n        while (!(USART2->SR & USART_SR_TXE));\
    \  // Wait for TX ready\n        USART2->DR = command[i];             // Send\
    \ character\n    }\n    while (!(USART2->SR & USART_SR_TC));       // Wait for\
    \ transfer\n}\n\nvoid toggleLED(const char *response) {\n    if (strstr(response,\
    \ \"LED=ON\")) {\n        GPIOC->BSRR = (1 << 3);             // Turn on LED\n\
    \    } else if (strstr(response, \"LED=OFF\")) {\n        GPIOC->BSRR = (1 <<\
    \ (3 + 16));      // Turn off LED\n    }\n}\n\nint main() {\n    configureUART();\
    \  // Set up UART for Wi-Fi\n    configureLED();   // Set up LED control\n   \
    \ sendCommand(\"AT+RST\\r\\n\");  // Reset module\n    sendCommand(\"AT+CWJAP=\\\
    \"HomeWiFi\\\",\\\"12345\\\"\\r\\n\");  // Connect to\n    sendCommand(\"AT+CIPSTART=\\\
    \"TCP\\\",\\\"192.168.1.5\\\",80\\r\\n\");  //\n\n    // Wait for a request; toggle\
    \ LED based on command in response\n    char response[50];  // Hypothetical buffer\
    \ for response\n    // Here, code to listen and fill response based on received\
    \ data\n    toggleLED(response);  // Toggle LED based on received response\n \
    \   sendCommand(\"AT+CIPCLOSE\\r\\n\");  // Close the connection\n}\n```\n\n###\
    \ Save and Run\n1. Save, compile, and upload the code to the ARM microcontroller.\n\
    2. Open a web browser or use a smartphone app to send HTTP requests (`LED=ON`\
    \ or `LED=OFF`) to control the LED.\n\n### Check Output\n- When the command `LED=ON`\
    \ is sent, the LED should turn on.\n- When `LED=OFF` is sent, the LED should turn\
    \ off, demonstrating remote control via Wi-Fi.\n"
  raw: 'Warnings


    Incorrect IP or closed ports will prevent a successful connection.


    * * *


    4\. Send HTTP Request


    What is Send HTTP Request


    Sending an HTTP request transmits data to a server. This command specifies the
    number of bytes to send, followed by the actual HTTP request data.


    Use Purpose


    ●      Transmit Data: Used to send data to a web server.


    ●      IoT Control: Facilitates sending control commands over HTTP.


    Syntax


    AT+CIPSEND=<length>


    Syntax Explanation


    ●      AT+CIPSEND: Command to initiate data transmission.


    ●      <length>: Length of the data (in bytes) to be transmitted.


    Simple Code Example


    sendCommand("AT+CIPSEND=20");


    sendCommand("GET /LED=ON HTTP/1.1\r\n\r\n");


    Code Example Explanation


    ● Prepares to send a 20-character HTTP GET request to control the LED.


    Notes


    Ensure the data length matches the actual data sent to prevent errors.


    Warnings


    Mismatched data length may cause incomplete transmissions.


    * * *


    5\. Close Connection


    What is Close Connection


    Closing the connection releases resources and prepares the module for future connections.


    Use Purpose


    ●      End Communication: Closes the TCP connection to the server.


    ●      Free Resources: Ensures the module can make new connections.


    Syntax


    AT+CIPCLOSE


    Syntax Explanation


    ●      AT+CIPCLOSE: Command to close the active TCP connection.


    Simple Code Example


    sendCommand("AT+CIPCLOSE");


    Code Example Explanation


    ●      Closes the connection, preparing the module for new commands.


    Notes


    Always close connections to manage resources effectively.


    Warnings


    Leaving connections open may lead to network issues and resource constraints.


    * * *


    Relevant Project Section


    Project Name


    Wi-Fi LED Control


    Project Goal


    Control an LED on the ARM microcontroller remotely through Wi-Fi by sending commands
    over HTTP. This project demonstrates the use of Wi-Fi for remote control, an essential
    component in IoT applications.


    Requirement Components


    ●      ARM Microcontroller (e.g., STM32)


    ●      Wi-Fi module (e.g., ESP8266) connected to UART


    ●      LED connected to a GPIO pin


    ● Access to a Wi-Fi network and a web server or smartphone app to send HTTP requests


    Component Connection Table


    | Component | Microcontroller Pin | Additional Notes |


    | Wi-Fi Module | UART TX/RX Pins (e.g., PA2, PA3) | Enables communication with
    ESP8266 |


    | LED | Digital Output Pin (e.g., PC3) | LED toggled via Wi-Fi commands |


    Connection Analysis


    The ARM microcontroller connects to the Wi-Fi module over UART, sending and receiving
    AT commands. When an HTTP request is received, the microcontroller interprets
    the command to toggle the LED state.


    Program Software Setup


    1.  Create a new project in STM32CubeIDE or Keil uVision.


    2.  Configure UART for Wi-Fi module communication and GPIO for LED control.


    3.  Implement code to process HTTP requests and toggle the LED based on commands.


    Project Code


    #include  "stm32f4xx.h" // Device-specific header for STM32


    #include  <stdio.h>


    #include  <string.h>


    void configureUART()  {


    RCC->APB1ENR |= RCC_APB1ENR_USART2EN;  // Enable USART2 clock


    USART2->BRR =  0x0683;                  // Set baud rate to 9600


    USART2->CR1 |= USART_CR1_UE | USART_CR1_TE | USART_CR1_RE; // Enable UART


    }


    void configureLED()  {


    RCC->AHB1ENR |= RCC_AHB1ENR_GPIOCEN;  // Enable GPIOC clock


    GPIOC->MODER |=  (1  <<  6);             // Set PC3 as output


    }


    void sendCommand(const  char  *command)  {


    for  (size_t i =  0; i < strlen(command); i++)  {


    while  (!(USART2->SR & USART_SR_TXE));  // Wait for TX ready


    USART2->DR = command[i];               // Send character


    }


    while  (!(USART2->SR & USART_SR_TC));       // Wait for transfer


    }


    void toggleLED(const  char  *response)  {


    if  (strstr(response,  "LED=ON"))  {


    GPIOC->BSRR =  (1  <<  3);  // Turn on LED


    }  else  if  (strstr(response,  "LED=OFF"))  {


    GPIOC->BSRR =  (1  <<  (3  +  16));  // Turn off LED


    }


    }


    int main()  {


    configureUART();  // Set up UART for Wi-Fi


    configureLED();   // Set up LED control


    sendCommand("AT+RST\r\n");        // Reset module


    sendCommand("AT+CWJAP=\"HomeWiFi\",\"12345\"\r\n");  // Connect to


    sendCommand("AT+CIPSTART=\"TCP\",\"192.168.1.5\",80\r\n");  //


    // Wait for a request; toggle LED based on command in response


    char response[50];  // Hypothetical buffer for response


    // Here, code to listen and fill response based on received data


    toggleLED(response);  // Toggle LED based on received response


    sendCommand("AT+CIPCLOSE\r\n");  // Close the connection


    }


    Save and Run


    1.  Save, compile, and upload the code to the ARM microcontroller.


    2.  Open a web browser or use a smartphone app to send HTTP requests (LED=ON or  LED=OFF)
    to control the LED.


    Check Output


    ●      When the command  LED=ON is sent, the LED should turn on.


    ● When  LED=OFF is sent, the LED should turn off, demonstrating remote control
    via Wi-Fi.'
