    ● priority: The priority level (lower numbers indicate higher priority), allowing
    the microcontroller to prioritize certain interrupts.


    Simple Code Example


    NVIC_SetPriority(EXTI0_IRQn,  2); // Set EXTI0 interrupt priority to 2


    Code Example Explanation


    ● This line sets the priority level of the EXTI0 interrupt to 2\. Other interrupts
