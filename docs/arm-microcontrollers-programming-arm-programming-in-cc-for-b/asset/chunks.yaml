    ## Random Numbers


    Chapter Overview


    Random number generation is crucial for various applications in embedded systems,
    such as creating unpredictable behaviors, generating unique IDs, or simulating
    random events. ARM microcontrollers can produce pseudo-random numbers using functions
    from the C standard library. This chapter explores how to generate and use random
    numbers effectively in ARM-based systems.


    Chapter Goal


    ● Understand the role and limitations of random number generation in ARM microcontrollers.


    ●      Learn to set up random number generation using  rand and  srand.


    ● Implement a project demonstrating practical applications of random numbers in
    embedded systems.


    Rules


    ● Seed Random Numbers: Use  srand to seed the random number generator for varied
    results.


    ● Define Range: Limit random numbers to the required range to avoid excessive
    processing.


    ● Avoid Frequent Resets: Seeding should be done only once per session to avoid
    predictable patterns.


    ● Use Random Numbers Efficiently: Random generation is resource-intensive; use
    it only when necessary.


    Brief Introduction to Random Numbers


    In C, the  rand function provides a pseudo-random number, typically seeded with  srand
    for variability. ARM microcontrollers can use these functions to introduce randomness
    into embedded applications. However, these are not truly random but pseudo-random,
    following a deterministic sequence that changes based on the seed value.


    Syntax Table


    | Serial No | Topic | Syntax | Simple Example |


    | 1 | Seed Random | srand(seed); | srand(100); |


    | 2 | Generate Random | int r = rand(); | int r = rand(); |


    | 3 | Range Limiting | r % range | int r = rand() % 10; |


    | 4 | Random Range with Offset | (rand() % range) + offset | int r = (rand() %
    20) + 10; |


    * * *


    Detailed Breakdown for Each Command


    1\. Seed Random (srand)


    What is Seed Random


    The  srand function seeds the random number generator with a starting value, ensuring
    that each program run can generate a different sequence of random numbers.


    Use Purpose


    ●      Initialize Random Sequence: Sets the starting point for generating random
    numbers.


    ●      Ensure Variability: Changing the seed results in a different random sequence.


    Syntax


    srand(seed);


    Syntax Explanation


    ●      srand: Initializes the random number generator.


    ● seed: A unique value (usually from a timer or sensor) that ensures different
    random sequences.


    Simple Code Example


    srand(100); // Seed with fixed value for testing


    Code Example Explanation


    ● Sets a fixed seed value of 100, which results in a predictable random sequence,
    useful in testing. For true randomness, the seed should vary each run.


    Notes


    Use an unpredictable seed, like a timer value, for greater randomness.


    Warnings


    Avoid reseeding frequently; doing so resets the sequence, leading to repetitive
    patterns.


    * * *


    2\. Generate Random (rand)


    What is Generate Random


    The  rand function returns a pseudo-random integer between 0 and  RAND_MAX. This
    value can then be modified to fit specific ranges as needed.


    Use Purpose


    ●      Create Random Values: Provides a base random integer.


    ● Flexible Random Range: By combining  rand with modulus or offset, generate values
    in any desired range.


    Syntax


    int r = rand();


    Syntax Explanation


    ●      int r: The variable where the random number is stored.


    ●      rand(): Generates a pseudo-random integer.


    Simple Code Example


    int randomValue = rand();


    Code Example Explanation


    ● Calls  rand() to produce a random integer, storing it in  randomValue. By itself,  rand
    produces values between 0 and  RAND_MAX.


    Notes


    Using  rand without modifying the range will yield results within 0 to  RAND_MAX.


    Warnings


    Repeatedly calling  rand without seeding with  srand may produce the same sequence
    of values.


    * * *


    3\. Range Limiting (%)


    What is Range Limiting


    The modulus operator (%) restricts a random number to a specific range by returning
    the remainder when dividing by a chosen number.


    Use Purpose


    ● Restrict to Range: Keeps random values within a defined range (e.g., 0 to 9).


    ●      Efficient for Small Ranges: Commonly used when small ranges are required.


    Syntax


    int r = rand()  % range;


    Syntax Explanation


    ● rand() % range: The remainder after dividing  rand() by  range, which restricts
    the output to between 0 and  range - 1.


    Simple Code Example


    int number = rand()  %  10; // Random number between 0 and 9


    Code Example Explanation


    ● Limits the random number to values between 0 and 9, making it suitable for applications
    like selecting array indices.


    Notes


    The modulus operator does not shift the range, so results start from 0.


    Warnings


    For uneven divisions,  rand() % range may slightly favor lower numbers due to
    the distribution of remainders.


    * * *


    4\. Random Range with Offset


    What is Random Range with Offset


    Combining modulus with addition, a random number can be generated within any custom
    range. For instance,  (rand() % 10) + 5 produces a random number between 5 and
    14.


    Use Purpose


    ●      Set Arbitrary Ranges: Defines a starting point and limits the range.


    ● Flexible Offset Application: Useful in cases where the random number must start
    from a non-zero value.


    Syntax


    int r =  (rand()  % range)  + offset;


    Syntax Explanation


    ● rand() % range: Limits the random number to between 0 and  range - 1.


    ●      + offset: Shifts the range up by the  offset value.


    Simple Code Example


    int r =  (rand()  %  20)  +  10; // Random number between 10 and 29


    Code Example Explanation


    ● Generates random numbers from 10 to 29, useful when specific ranges are required,
    such as generating sensor-like fluctuations.


    Notes


    Always confirm the range and offset values to ensure correct random ranges.


    Warnings


    Avoid large ranges that might exceed integer limits, especially with constrained
    microcontroller environments.


    * * *


    Relevant Project Section


    Project Name


    Randomized LED Blinking Pattern


    Project Goal


    Create a project that uses random numbers to control the blinking pattern of an
    LED, simulating an unpredictable or dynamic light pattern. Each blink interval
    and duration will vary based on random values.'
