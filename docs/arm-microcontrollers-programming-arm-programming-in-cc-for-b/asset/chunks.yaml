    \n##### 注意事项\n逻辑或 `||` 也使用短路求，所以如果第一个条件为真，则不会计算第二个。\n\n##### 警告\n避免过于复杂的布尔表达式，这可能会降低可读性。\n\
    \n***\n\n#### 3. 逻辑非 (!)\n##### 什么是逻辑非\n逻辑非运算符 `!` 反转条件的布尔值。如果条件为 `true`，`!` 会让其变为\
    \ `false`，反之亦然。\n\n##### 使用目的\n\n"
