    * * *


    2\. Set PWM Duty Cycle


    What is Setting PWM Duty Cycle


    The duty cycle determines the “on” time of the PWM signal within each cycle. By
    adjusting this value, we can control the average voltage output, influencing device
    performance.


    Use Purpose


    ●      Control Power Output: Varying duty cycle controls power to devices.


    ● Fine-Tuned Control: Allows precision control over devices like motors (speed)
    and LEDs (brightness).


    Syntax


    TIMx->CCR1 = dutyCycle;


    Syntax Explanation


    ●      TIMx: The timer module used for PWM generation.


    ● CCR1: Capture/Compare Register 1, which stores the duty cycle value for channel
    1.


    ● dutyCycle: The value representing the desired duty cycle, typically between
    0 (0%) and the timer’s maximum value (100%).


    Simple Code Example


    TIM3->CCR1 =  128; // Set 50% duty cycle on TIM3 Channel 1


    Code Example Explanation


    ● This line sets the duty cycle of TIM3 Channel 1 to 50% (assuming an 8-bit resolution
    with 255 as the maximum).


    Notes


    The maximum value of  CCR1 is determined by the timer’s resolution, which is usually
    set by the  ARR (Auto-Reload Register) of the timer.


    Warnings


    Setting a duty cycle that exceeds the timer’s configured range may result in an
    incorrect signal or unexpected behavior.


    * * *


    3\. Enable External Interrupt


    What is Enabling External Interrupt


    Enabling an external interrupt configures the microcontroller to respond to an
    external signal (like a button press) by interrupting regular program execution.


    Use Purpose


    ●      Event-Driven Response: Allows the microcontroller to respond immediately
    to external events.


    ● Power Efficiency: Reduces the need for polling by relying on interrupts to trigger
    events.


    Syntax


    EXTI->IMR |=  (1  << line);


    Syntax Explanation


    ●      EXTI: The external interrupt controller, which manages external interrupt
    sources.


    ● IMR: Interrupt Mask Register, used to enable or disable interrupts for specific
    external lines.


    ● (1 << line): Sets the bit for the specified external interrupt line (e.g.,  line
    0 for EXTI0).


    Simple Code Example


    EXTI->IMR |=  (1  <<  0); // Enable interrupt for EXTI line 0


    Code Example Explanation


    ● Enables the interrupt for external line 0, allowing it to trigger an ISR when
    an external event (e.g., button press) occurs on this line.


    Notes


    Pairing an interrupt with a debounce algorithm for mechanical switches is often
    necessary to avoid repeated triggers from a single press.


    Warnings


    Enabling multiple external interrupts on the same line without setting priorities
    may lead to conflicts.


    * * *


    4\. Configure Interrupt Priority


    What is Configuring Interrupt Priority


    Setting the interrupt priority ensures that critical interrupts are processed
    first, allowing less important interrupts to wait if necessary.


    Use Purpose


    ● Prioritize Critical Functions: Ensures high-priority tasks are completed first
    in a multi-interrupt environment.


    ● Optimize System Response: Allows the microcontroller to handle important events
    with minimal delay.


    Syntax


