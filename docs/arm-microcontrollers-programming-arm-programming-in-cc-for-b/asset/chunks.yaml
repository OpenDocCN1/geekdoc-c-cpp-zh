    2\. Global Variable


    What is Global Variable


    A global variable is declared outside of any function, typically at the beginning
    of the program, and is accessible from any function in the program. It retains
    its value for the entire duration of the program and occupies memory for the program''s
    lifecycle.


    Use Purpose


    ● Data Sharing: Allows multiple functions to share data without passing the variable
    as a parameter.


    ● Persistent State: Retains its value across all function calls and program execution.


    Syntax


    type varName;


    Syntax Explanation


    ● type: Indicates the data type of the global variable (e.g.,  int,  float).


    ● varName: The name of the global variable, which should be descriptive, as it
    can be accessed from any part of the program.


