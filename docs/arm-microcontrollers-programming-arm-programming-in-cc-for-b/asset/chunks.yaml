    \ a pull-up resistor.\n\n3.  Write code to read the button input and toggle the\
    \ LED output accordingly.\n\nProject Code\n\n#include  \"stm32f4xx.h\" // Include\
    \ device-specific header\n\nvoid configureGPIO()  {\n\n// Enable GPIOA clock\n\
    \nRCC->AHB1ENR |= RCC_AHB1ENR_GPIOAEN;\n\n// Set PA5 as output\n\nGPIOA->MODER\
    \ |=  (1  <<  10);       // Set bit 10 to 1 for output mode on PA5\n\n// Set PA3\
    \ as input with pull-up\n\nGPIOA->MODER &=  ~(3  <<  6);       // Clear bits 6\
    \ and 7 for input mode on PA3\n\nGPIOA->PUPDR |=  (1  <<  6);        // Set pull-up\
    \ resistor on PA3\n\n}\n\nvoid toggleLED()  {\n\nGPIOA->ODR ^=  (1  <<  5);  //\
    \ Toggle PA5\n\n}\n\nint main()  {\n\nconfigureGPIO();  // Configure GPIO settings\n\
    \nwhile  (1)  {\n\nif  (!(GPIOA->IDR &  (1  <<  3)))  {  // Check if PA3 is LOW\
    \ (button pressed)\n\ntoggleLED();                 // Toggle LED\n\nfor  (volatile\
    \  int i =  0; i <  100000; i++);  // Simple debounce delay\n\n}\n\n}\n\n}\n\n\
    Save and Run\n\n1.  Save, compile, and upload the code to your ARM microcontroller.\n\
    \n2.  Press the button to toggle the LED on and off.\n\nCheck Output\n\n● The\
    \ LED should toggle between ON and OFF states each time the button is pressed,\
    \ demonstrating both input and output functionality.\n\n## Analog I/O\n\nAnalog\
    \ I/O in C for ARM Microcontrollers\n\nChapter Overview\n\nAnalog Input/Output\
    \ (I/O) is essential for embedded systems that interface with analog sensors (e.g.,\
    \ temperature sensors) or actuators. ARM microcontrollers utilize ADC (Analog-to-Digital\
    \ Conversion) for reading analog inputs and DAC (Digital-to-Analog Conversion)\
    \ for generating analog outputs. This chapter will explore configuring ADC and\
    \ DAC, reading analog signals, converting digital values to analog, and calculations\
    \ for accurately interpreting sensor values.\n\nChapter Goal\n\n●      Understand\
    \ ADC and DAC configurations for ARM microcontrollers.\n\n●      Learn to read\
    \ analog inputs and produce analog outputs.\n\n● Implement a project to demonstrate\
    \ analog I/O by reading a sensor and controlling an output device.\n\nRules\n\n\
    ● ADC Resolution: Choose an ADC resolution that balances accuracy with speed (e.g.,\
    \ 8-bit, 10-bit, or 12-bit).\n\n● Reference Voltage: Set an appropriate reference\
    \ voltage to ensure accurate ADC readings.\n\n● Scaling and Mapping: Use calculations\
    \ to convert ADC values into meaningful units like voltage or temperature.\n\n\
    ● DAC Resolution: Select a DAC resolution that meets the precision requirements\
    \ of the application.\n\nExplanation of ADC Voltage Calculation\n\nAn ADC (Analog-to-Digital\
    \ Converter) converts an analog input voltage into a digital value. To calculate\
    \ the corresponding voltage for a given ADC digital value, we use this formula:\n\
    \n![](image_rsrc7B5.jpg)\n\nLet’s break this formula into components to understand\
    \ better:\n\nWhat is an ADC?\n\n*   An ADC samples an analog signal (voltage)\
    \ and converts it into a digital number.\n\n*   The range of values the ADC can\
    \ output depends on its resolution, which is defined by the number of bits it\
    \ uses.\n\nExample ADC Resolution Calculation\n\nFor a 10-bit ADC\n\nThe resolution\
    \ of an ADC is determined by the formula:\n\n![](image_rsrc7B6.jpg)\n\nWhere:\n\
    \n*   n=Number of bits of the ADC\n\nFor a 10-bit ADC, the resolution is 2^10\
    \ = 1024 levels (values from 0 to 1023).\n\nThis means the ADC has 1024 possible\
    \ levels, ranging from 0 to 1023.\n\nFor a 12-bit ADC\n\nFor a 12-bit ADC, the\
    \ resolution is:\n\n![](image_rsrc7B6.jpg)\n\nFor a 12-bit ADC, the resolution\
    \ is 2^12 =  4096levels (values from 0 to  4096).\n\nUnderstanding the Formula\n\
    \n(a) Normalized Value\n\nThe normalized value is calculated as:\n\n![](image_rsrc7B7.jpg)\n\
    \nThis part gives the proportion of the reference voltage represented by the ADC\
    \ value.\n\nFor example:\n\n*   If the ADC Value is 512 (halfway in a 10-bit range),\
    \ this fraction would be\n\n![](image_rsrc7B8.jpg)\n\nThis means the ADC value\
    \ represents 50% of the reference voltage.\n\nReference Voltage\n\n*   The reference\
    \ voltage defines the maximum voltage the ADC can measure.\n\n*   If the reference\
    \ voltage is 3.3V, the ADC will map:\n\n    *   0to 0V\n\n    *   1023 (or Max\
    \ ADC Value) to 3.3\n\n(c) Multiply by Reference Voltage\n\n*   Multiplying the\
    \ normalized value by the reference voltage converts the proportion into the actual\
    \ voltage.\n\nStep-by-Step Example\n\nImagine a system with:\n\n*   A 10-bit ADC\
    \ (Max ADC Value = 102310231023)\n\n*   A Reference Voltage of 5.0V5.0V5.0V\n\n\
    *   A raw ADC reading of 256\n\nStep 1: Normalize the ADC Value\n\n![](image_rsrc7B9.jpg)\n\
    \nStep 2: Multiply by the Reference Voltage\n\nVoltage=0.25×5.0=1.25V\n\nSo, an\
    \ ADC value of 256 corresponds to 1.25V.\n\nVisualisation\n\n*   ADC Resolution:\
    \ 10-bit\n\n*   Reference Voltage: 3.3V\n\n| ADC Value | Proportion (ADCValue/1023)\
    \ | Voltage (V) |\n\n| 0 | 0/1023=0.0 | 0.0V |\n\n| 256 | 256/1023≈0.25 | 0.25×3.3=0.825V\
    \ |\n\n| 512 | 512/1023≈0.5 | 0.5×3.3=1.65V |\n\n| 768 | 768/1023≈0.75 | 0.75×3.3=2.475V\
    \ |\n\n| 1023 | 1023/1023=1.0 | 1.0×3.3=3.3V |\n\nSyntax Table\n\n| Serial No\
    \ | Topic | Syntax | Simple Example |\n\n| 1 | Configure ADC | `ADCx->CR2 | =\
    \ ADC_CR2_ADON;` |\n\n| 2 | Start ADC Conversion | `ADCx->CR2 | = ADC_CR2_SWSTART;`\
    \ |\n\n| 3 | Read ADC Value | ADCx->DR | int adcValue = ADC1->DR; |\n\n| 4 | Configure\
    \ DAC | `DAC->CR | = DAC_CR_EN1;` |\n\n| 5 | Write DAC Value | DAC->DHR12R1 =\
    \ value; | DAC->DHR12R1 = 2048; |\n\n* * *\n\nDetailed Breakdown for Each Command\n\
    \n1\\. Configure ADC\n\nWhat is Configuring ADC\n\nConfiguring the ADC (Analog-to-Digital\
    \ Converter) is essential to initiate it for reading analog inputs. Configuration\
    \ includes enabling the ADC, setting the desired resolution, and selecting the\
    \ input channel.\n\nUse Purpose\n\n●      Activate ADC for Conversions: Enables\
    \ ADC to start analog-to-digital conversion.\n\n● Prepare for Accurate Analog\
    \ Readings: Ensures ADC is configured to process inputs with appropriate resolution\
    \ and reference voltage.\n\nSyntax\n\nADCx->CR2 |= ADC_CR2_ADON;\n\nSyntax Explanation\n\
    \n● ADCx: The ADC module identifier (e.g.,  ADC1,  ADC2) that will process the\
    \ analog input.\n\n● CR2: Control Register 2 of the ADC, which contains critical\
    \ control settings for ADC operation.\n\n● ADC_CR2_ADON: The specific bit in \
    \ CR2 that enables the ADC module. Setting this bit (ADON) initiates the ADC,\
    \ making it ready for conversions.\n\nSimple Code Example\n\nADC1->CR2 |= ADC_CR2_ADON;\
    \ // Enable ADC1\n\nCode Example Explanation\n\n● This line of code enables ADC1\
    \ by setting the  ADON bit in  CR2, which powers up the ADC module and prepares\
    \ it for analog-to-digital conversions.\n\nNotes\n\nEnsure the ADC clock is enabled\
    \ in the microcontroller’s RCC (Reset and Clock Control) configuration before\
    \ setting up the ADC, as it often requires a dedicated clock source.\n\nWarnings\n\
    \nFailing to enable the ADC clock before configuring it may lead to errors or\
    \ undefined behavior.\n\n* * *\n\n2\\. Start ADC Conversion\n\nWhat is Starting\
    \ ADC Conversion\n\nStarting ADC conversion triggers the ADC to sample an analog\
    \ input signal and convert it to a digital value. This step initiates the actual\
    \ data acquisition from an analog source.\n\nUse Purpose"
