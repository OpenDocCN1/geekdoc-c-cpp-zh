    3\. Write to EEPROM


    What is Write to EEPROM


    Writing to EEPROM stores data in non-volatile memory, making it persistent after
    reset. EEPROM writes are used for saving configurations or critical data that
    should remain after power loss.


    Use Purpose


    ●      Store Persistent Data: Writes data that needs to survive across sessions.


    ●      Save Configuration Changes: Useful for saving settings permanently.


    Syntax


    HAL_FLASHEx_DATAEEPROM_Unlock();


    *(__IO uint32_t*)address = data;


    HAL_FLASHEx_DATAEEPROM_Lock();


    Syntax Explanation


    ●      HAL_FLASHEx_DATAEEPROM_Unlock(): Unlocks EEPROM for writing.


    ●      *(__IO uint32_t*)address = data;: Writes  data to the specified EEPROM
    address.


    ●      HAL_FLASHEx_DATAEEPROM_Lock(): Locks EEPROM after the write operation.


    Simple Code Example


    HAL_FLASHEx_DATAEEPROM_Unlock();


    *(__IO uint32_t*)0x08080000  =  1234; // Write 1234 to EEPROM address


    HAL_FLASHEx_DATAEEPROM_Lock();


    Code Example Explanation


    ● Unlocks EEPROM, writes  1234 to a specified address in EEPROM, then locks it,
    ensuring data safety.


    Notes


    EEPROM has limited write cycles, so avoid writing frequently to prolong memory
    life.


    Warnings


    Be careful with EEPROM addresses; incorrect addresses may lead to data corruption.


