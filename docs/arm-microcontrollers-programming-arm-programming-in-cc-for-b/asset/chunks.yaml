    4\. Do-While Loop


    What is Do-While Loop


    The  do-while loop executes a code block at least once and then repeats it as
    long as the condition is true. It’s useful for tasks that need an initial execution
    regardless of conditions.


    Use Purpose


    ● Guaranteed First Execution: Ensures code runs at least once, even if the condition
    is false.


    ●      Condition-Based Repeating: Useful for repeated tasks with variable conditions.


    Syntax


    do  {


    // Code to execute


    }  while  (condition);


    Syntax Explanation


    ●      do: Starts the loop by executing the block once.


    ● condition: Checked after each iteration to decide if the loop should continue.


    Simple Code Example


    do  {


    calibrateSensor();


    }  while  (sensorStatus != READY);


    Code Example Explanation


    ● The  calibrateSensor() function runs at least once and continues to run until  sensorStatus
    equals  READY.


