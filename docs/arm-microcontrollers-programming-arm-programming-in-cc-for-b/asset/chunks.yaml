    Connection Analysis


    The button is connected to a GPIO input pin, allowing the program to detect each
    press. The project uses local, static, and global variables to manage the button
    press count and display it via serial communication.


    Program Software Setup


    1.  Create a new project in STM32CubeIDE or Keil uVision.


    2.  Configure the GPIO pin as an input for the button, and set up serial communication
    if needed.


    3.  Define variables with appropriate scope to manage button press count.


    Project Code


    #include  <stdio.h>


    #include  <stdint.h>


    int pressCounter =  0; // Global variable for total button presses


    void buttonPress()  {


    static  int localPressCount =  0; // Static variable to persist count within function


    int currentPress =  1;            // Local variable to represent button press
    state


    if  (currentPress)  {


    pressCounter++;       // Modify global counter


    localPressCount++;    // Modify static local counter


    printf("Global Count: %d, Local Count: %d\n", pressCounter, localPressCount);


    }


    }


    int main()  {


    // Assume setup code here for GPIO and serial communication


    while  (1)  {


    buttonPress();  // Call function on button press


    }


    return  0;


    }


    Save and Run


    1.  Save, compile, and upload the code to the ARM microcontroller.


    2.  Open a serial monitor to view the button press count as the button is pressed.


    Check Output


    ● The output should show the global and local (static) counts incrementing with
    each button press, illustrating how variable scope controls memory and data persistence.


    ## Digital I/O


