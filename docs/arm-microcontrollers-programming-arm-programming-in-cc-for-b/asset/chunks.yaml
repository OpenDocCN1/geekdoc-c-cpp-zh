    is widely used in embedded programming for accumulating values, updating counters,
    or combining data.


    Use Purpose


    ● Accumulate Values: Used to add sensor data, counts, or other cumulative data
    points.


    ●      Calculate Sums: Essential for arithmetic calculations where sums are needed.


    Syntax


    result = a + b;


    Syntax Explanation


    ●      result: The variable storing the result of the addition.


    ● a and b: The operands to be added, which can be variables or constants.


    Simple Code Example


    int total =  0;


    int newValue =  5;


    total = total + newValue;


    Code Example Explanation


    ● Adds  newValue to  total, updating the  total variable. This approach is often
    used in loops to accumulate values.


    Notes


    Addition is an efficient operator, but in embedded systems, ensure the variable
    has enough range to store the result.


    Warnings


    Integer overflow may occur if the sum exceeds the variable''s storage limit.


    * * *


    2\. Subtraction


    What is Subtraction


    The subtraction operator (-) calculates the difference between two values. It
    is commonly used in embedded applications to determine changes or offsets in sensor
    values or counters.


    Use Purpose


    ● Calculate Differences: Used to find the difference between two readings, such
    as target and actual positions.


    ●      Adjust Counts: Useful for decrementing counters or adjusting values.


    Syntax


    result = a - b;


    Syntax Explanation


    ●      result: Stores the difference between a and b.


    ●      a and b: The values to be subtracted.


    Simple Code Example


    int difference =  10  -  3;


    Code Example Explanation


    ● The result of  10 - 3 is stored in  difference, showing how subtraction can
    calculate the offset.


    Notes


    Subtraction can be used with signed integers to represent negative results.


    Warnings


    Be mindful of underflow, especially with unsigned integers, as results can wrap
    around unexpectedly.


    * * *


    3\. Multiplication


    What is Multiplication


    The multiplication operator (*) calculates the product of two values. In embedded
    applications, it is commonly used to scale values, calculate areas, or convert
    units.


    Use Purpose


    ●      Scaling Data: Used to amplify sensor readings or adjust units.


    ●      Mathematical Calculations: Useful for formulas requiring products.


    Syntax


    result = a * b;


    Syntax Explanation


    ●      result: The variable that stores the product of a and b.


    ●      a and b: The multiplicands (values being multiplied).


    Simple Code Example


    int area = length * width;


    Code Example Explanation


    ● The  area is calculated by multiplying  length by  width, useful in applications
    like geometry calculations.


    Notes


    Multiplication is slower on microcontrollers without hardware multiply support,
    so optimize usage.


    Warnings


    Avoid overflow by ensuring results fit within the variable’s data range.


    * * *


    4\. Division


    What is Division


    The division operator (/) divides one value by another, returning the quotient.
    It’s commonly used in scaling and normalization of sensor data.


    Use Purpose


    ●      Normalize Values: Converts values into desired units or scales.


    ●      Calculate Ratios: Useful in calculating relationships between measurements.


    Syntax


    result = a / b;


    Syntax Explanation


    ●      result: Stores the quotient of the division.


    ●      a: The dividend, or number to be divided.


    ●      b: The divisor, or number to divide by.


    Simple Code Example


    int average = total / count;


    Code Example Explanation


    ● Calculates the average by dividing  total by  count, demonstrating division
    for mean values.


    Notes


    For integer division, any remainder is discarded. Use floating-point for decimal
    results.


    Warnings


    Division by zero results in an error. Always verify that the divisor is non-zero.


    * * *


    5\. Modulus (Remainder)


    What is Modulus


    The modulus operator (%) returns the remainder of a division operation. It’s often
    used in embedded programming for tasks like checking even/odd values or wrapping
    counters.


    Use Purpose


    ●      Check Even/Odd: Determine if a number is divisible by another.


    ●      Manage Wrapping: Useful for circular buffers and periodic checks.


    Syntax


    result = a % b;


    Syntax Explanation


    ●      result: Stores the remainder of a divided by b.


    ●      a: The dividend.


    ●      b: The divisor, which cannot be zero.


    Simple Code Example


    int remainder =  10  %  3; // remainder is 1


    Code Example Explanation


    ● 10 % 3 gives 1, which is stored in  remainder. This operation is useful in cases
    like modular arithmetic.


    Notes


    Modulus is typically used with integers and is not applicable to floating-point
    types.


    Warnings


    Division by zero applies to modulus as well; ensure the divisor is non-zero.


    * * *


    6\. Increment


    What is Increment


    The increment operator (++) increases a variable’s value by one. It’s commonly
    used for counters and loops.


    Use Purpose


    ●      Counting: Efficiently increases counters in loops or conditionals.


    ●      Simple Arithmetic: Adds 1 without requiring + and = operators.


    Syntax


    a++;


    Syntax Explanation


    ● a++ or  ++a: Increases the variable a by 1.  a++ is post-increment, while  ++a
    is pre-increment.


    Simple Code Example


    int count =  0;


    count++;


    Code Example Explanation


    ●      Increases  count by one, demonstrating increment in counting scenarios.


    Notes


    Use pre-increment (++a) when possible in loops for slightly better performance.


    Warnings


    Ensure variables are within range; repeated increments can overflow.


    * * *


    7\. Decrement


    What is Decrement


    The decrement operator (--) decreases a variable’s value by one. Commonly used
    in counters or loops for reverse counting.


    Use Purpose


    ●      Reverse Counting: Efficiently decreases counters in loops.


    ●      Simple Arithmetic: Subtracts 1 without requiring - and =.


    Syntax


    a--;


    Syntax Explanation


    ● a-- or  --a: Decreases a by 1.  a-- is post-decrement, while  --a is pre-decrement.


    Simple Code Example


    int count =  10;


    count--;


    Code Example Explanation


    ●      Decreases  count by one, useful for loop conditions and countdowns.


    Notes


    Use decrement in loops where counting backward is needed, such as countdowns.


    Warnings


    Ensure variables are within range, as decrementing below zero in unsigned types
    can cause wrap-around.


    * * *


    Relevant Project Section


    Project Name


    Temperature Data Processing with Arithmetic Operations


    Project Goal


    Process temperature sensor data using arithmetic operations to calculate averages,
    detect temperature trends, and control an LED indicator based on thresholds.


    Requirement Components


    ●      ARM Microcontroller (e.g., STM32)


    ●      Temperature sensor connected to an ADC pin


    ●      LED connected to a digital output pin


    Component Connection Table


    | Component | Microcontroller Pin | Additional Notes |


    | Temperature Sensor | ADC Input Pin (e.g., PA0) | Analog input for readings |


    | LED | Digital Output Pin (e.g., PC3) | Indicates temperature status |


    Connection Analysis


    The temperature sensor provides analog readings, which are converted to digital
    and processed using arithmetic operations. The LED turns on if the average temperature
    exceeds a defined threshold.


    Program Software Setup


    1.  Create a new project in STM32CubeIDE or Keil uVision.


    2.  Configure ADC for temperature sensor input.


    3.  Configure LED as a digital output for visual indication.


    Project Code


    #include  "stm32f4xx.h" // Device-specific header for STM32


    void configureADC()  {


    RCC->APB2ENR |= RCC_APB2ENR_ADC1EN;  // Enable ADC1 clock


    ADC1->CR2 |= ADC_CR2_ADON;           // Enable ADC1


    }


    void configureLED()  {


    RCC->AHB1ENR |= RCC_AHB1ENR_GPIOCEN;  // Enable GPIOC clock


    GPIOC->MODER |=  (1  <<  6);            // Set PC3 as output


    }


    uint16_t readADC()  {


    ADC1->CR2 |= ADC_CR2_SWSTART;        // Start ADC conversion


    while  (!(ADC1->SR & ADC_SR_EOC));    // Wait for conversion complete


    return ADC1->DR;                     // Read ADC result


    }


