    Syntax


    int result = abs(x);


    Syntax Explanation


    ●      result: Stores the absolute value of x.


    ● abs(x): Calculates the absolute value of x, which should be an integer.


    Simple Code Example


    int  value  =  -10;


    int magnitude = abs(value); // Result is 10


    Code Example Explanation


    ● Converts  value to its absolute equivalent, demonstrating how to retrieve only
    the magnitude of a number, which is helpful in applications like distance calculations.


    Notes


    For floating-point values, use  fabs instead of  abs.


    Warnings


    Ensure x is an integer; using  abs with floating-point values requires  fabs.


    * * *


    2\. Power (pow)


    What is Power


    The power function (pow) raises a number to a specific exponent. It’s frequently
    used in embedded applications that involve exponential growth, decay, or scaling
    factors.


    Use Purpose


    ●      Exponentiate Values: Computes exponential values in scientific or scaling
    calculations.


    ●      Control Algorithms: Useful in applications involving nonlinear control
    laws or functions.


    Syntax


    double result = pow(x, y);


    Syntax Explanation


    ● result: Stores the result of x raised to the power of y.


    ● pow(x, y): Raises x to the y power, where x and y are floating-point numbers.


    Simple Code Example


    double voltage = pow(2,  3); // Result is 8.0


    Code Example Explanation


    ● Raises 2 to the power of 3, useful in cases where scaling factors or powers
    are needed for calculations.


    Notes


    Using  pow on integer values can lead to floating-point results; cast to integer
    if necessary.


    Warnings


    Avoid negative bases with non-integer exponents, as this can lead to undefined
    results.


    * * *


    3\. Square Root (sqrt)


    What is Square Root


    The square root function (sqrt) calculates the square root of a number. It’s commonly
    used in geometry, physics calculations, and normalization processes.


    Use Purpose


    ● Calculate Distance: Often used to compute distances in applications involving
    spatial coordinates.


    ●      Normalization: Useful for scaling values in embedded control systems.


    Syntax


    double result = sqrt(x);


    Syntax Explanation


    ●      result: Stores the square root of x.


    ● sqrt(x): Calculates the square root of x, which should be a non-negative floating-point
    number.


    Simple Code Example


    double distance = sqrt(16); // Result is 4.0


    Code Example Explanation


    ● Calculates the square root of 16, a common operation in distance and spatial
    calculations.


    Notes


    Use only non-negative values with  sqrt; otherwise, it returns NaN (Not a Number).


    Warnings


    Avoid passing negative values to  sqrt, as the result is undefined in real numbers.


    * * *


    4\. Trigonometry (Sine -  sin)


    What is Sine Function


    The sine function (sin) calculates the sine of an angle, typically in radians.
    This is essential in applications involving rotations, waveforms, or oscillations.


    Use Purpose


    ●      Waveform Generation: Useful in signal processing or PWM waveforms.


    ● Angle Calculations: Used in trigonometric calculations, such as converting angles
    to Cartesian coordinates.


    Syntax


    double result = sin(x);


    Syntax Explanation


    ●      result: Stores the sine of x.


    ●      sin(x): Calculates the sine of x, which should be in radians.


    Simple Code Example


    double angle =  1.57; // Approximately π/2 radians


    double sineValue = sin(angle); // Result is approximately 1.0


    Code Example Explanation


    ● Computes the sine of π/2 radians (90 degrees), useful in calculating angles
    and oscillations.


    Notes


    Convert degrees to radians by multiplying with π/180 if necessary.


    Warnings


    Ensure angles are in radians, not degrees, for accurate results.


    * * *


    5\. Trigonometry (Cosine -  cos)


    What is Cosine Function


    The cosine function (cos) calculates the cosine of an angle, also in radians.
    It’s used in waveforms, rotations, and calculating projections along an axis.


    Use Purpose


    ●      Vector Calculations: Useful for calculating projections or rotations.


    ● Waveform Analysis: Often applied in signal processing for phase shifts or generating
    cosine waves.


    Syntax


    double result = cos(x);


    Syntax Explanation


    ●      result: Stores the cosine of x.


    ● cos(x): Calculates the cosine of x, where x should be in radians.


    Simple Code Example


    double angle =  1.57; // Approximately π/2 radians


    double cosineValue = cos(angle); // Result is approximately 0.0


    Code Example Explanation


    ● Computes the cosine of π/2 radians (90 degrees), demonstrating cosine’s role
    in angle-based calculations.


    Notes


    Like  sin, angles should be converted to radians when using  cos.


    Warnings


    Ensure input angles are in radians; incorrect inputs may lead to unexpected results.


    * * *


    Relevant Project Section


    Project Name


    Distance and Angle Calculation for Robotic Navigation


    Project Goal


    Use math functions to calculate the distance and direction of movement based on
    sensor inputs. The project will use absolute values, power, and square root functions
    to compute distances and angles for navigation.


    Requirement Components


    ●      ARM Microcontroller (e.g., STM32)


    ●      Ultrasonic distance sensor connected to an ADC pin


    ●      Servo motor controlled by PWM for directional adjustment


    ●      LED indicator for distance threshold alerts


    Component Connection Table


    | Component | Microcontroller Pin | Additional Notes |


    | Ultrasonic Distance Sensor | ADC Input Pin (e.g., PA0) | Provides distance measurement
    data |


    | Servo Motor | PWM Output Pin (e.g., PB4) | Adjusts based on calculated direction
    |


    | LED | Digital Output Pin (e.g., PC3) | Alerts if the distance is too short |


    Connection Analysis


    The distance sensor provides analog readings used to calculate the absolute distance
    and direction using trigonometric functions. The servo motor adjusts based on
    calculated angles, while the LED alerts if the distance is below a safe threshold.


    Program Software Setup


    1.  Create a new project in STM32CubeIDE or Keil uVision.


    2.  Configure the ADC for distance sensor input, PWM for servo motor control,
    and digital output for LED.


    Project Code


    #include  "stm32f4xx.h" // Device-specific header for STM32


    #include  <math.h>       // Include math library


    void configureADC()  {


    RCC->APB2ENR |= RCC_APB2ENR_ADC1EN;  // Enable ADC1 clock


    ADC1->CR2 |= ADC_CR2_ADON;           // Enable ADC1


    }


    void configurePWM()  {


    RCC->APB1ENR |= RCC_APB1ENR_TIM3EN;  // Enable TIM3 clock


    TIM3->CCMR1 |= TIM_CCMR1_OC1M_PWM1; // Set TIM3 Channel 1 to PWM mode


    TIM3->CCR1 =  128;                    // Set initial duty cycle


    TIM3->CR1 |= TIM_CR1_CEN;            // Enable TIM3


    }


    void configureLED()  {


    RCC->AHB1ENR |= RCC_AHB1ENR_GPIOCEN;  // Enable GPIOC clock


    GPIOC->MODER |=  (1  <<  6);            // Set PC3 as output


    }


    uint16_t readADC()  {


    ADC1->CR2 |= ADC_CR2_SWSTART;        // Start ADC conversion


    while  (!(ADC1->SR & ADC_SR_EOC));    // Wait for conversion complete


    return ADC1->DR;                     // Read ADC result


    }


    void setServoAngle(double angle)  {


    int dutyCycle =  (int)(angle *  180  / M_PI); // Convert radians to degrees for
    PWM


    TIM3->CCR1 = dutyCycle;


    }


    int main()  {


    configureADC();          // Set up ADC


    configurePWM();          // Set up PWM for servo motor


    configureLED();          // Set up LED for threshold alerts


    double distance;


    uint16_t sensorData;  


    while  (1)  {


    sensorData = readADC();               // Read distance sensor data


    distance = sqrt(pow(sensorData,  2));  // Calculate distance magnitude      


    if  (distance <  50.0)  {                // Threshold check


    GPIOC->BSRR =  (1  <<  3);           // Turn on LED if distance is below threshold


    }  else  {


    GPIOC->BSRR =  (1  <<  (3  +  16));    // Turn off LED


    }


    double angle = atan2(sensorData, distance);  // Calculate angle for direction


    setServoAngle(angle);                 // Adjust servo to calculated angle


    }


    Save and Run


    1.  Save, compile, and upload the code to the ARM microcontroller.'
