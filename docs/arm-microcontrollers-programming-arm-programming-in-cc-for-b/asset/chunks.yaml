    Data types in C define the type and size of data a variable can hold. They are
    particularly important in ARM micro microcontroller programming, where memory
    constraints and processing efficiency are critical. ARM microcontrollers support
    a variety of data types, including integers, floating-point numbers, characters,
    and fixed-width types, each suited for specific use cases. This chapter will explore
    the different data types in C, their uses, and practical applications in ARM-based
    embedded systems.


    ## Chapter Goal


    - Understand the primary data types available in C programming for ARM microcontrollers.

    - Learn to choose data types based on memory requirements and precision needs.

    - Implement a practical project to demonstrate the usage of different data types
    in an ARM microcontroller program.


    ## Rules


    - Choose Data Types Carefully: Optimize memory usage by selecting the smallest
    appropriate data type.

    - Signed vs. Unsigned: Use signed types for values that can be negative, and unsigned
    types for values that are always positive.

    - Standard Integer Types: Use fixed-width integer types like `int8_t`, `uint16_t`
    to ensure cross-platform compatibility.

    - Floating-Point Limitations: Use `float` and `double` sparingly, as they consume
    more memory and processing power.


    ## Brief Introduction to Data Types


    Data types determine the kind of values a variable can hold and the amount of
    memory it occupies. Embedded systems often require efficient memory usage, making
    the choice of data types crucial. ARM microcontrollers support integers, floating-point
    numbers, and custom data types that help manage resources effectively while maintaining
    precision.


    ## Syntax Table


    | Serial No | Topic | Syntax | Simple Example |

    | :--- | :--- | :--- | :--- |

    | 1 | Integer | `int varName;` | `int count;` |

    | 2 | Unsigned Integer | `unsigned int varName;` | `unsigned int age;` |

    | 3 | Short Integer | `short varName;` | `short temp;` |

    | 4 | Character | `char varName;` | `char grade;` |

    | 5 | Floating-Point | `float varName;` | `float temperature;` |

    | 6 | Double Precision | `double varName;` | `double preciseValue;` |

    | 7 | Fixed-Width Int | `int8_t varName;` | `int8_t smallValue;` |


    ***


    ## Detailed Breakdown for Each Data Type


    ### 1. Integer


    #### What is Integer

    The `int` data type is a fundamental data type used to store whole numbers (without
    decimal points). This type is generally the default choice for counting and basic
    calculations in embedded programs.


    #### Use Purpose

    - General Counting: Useful for counters in loops or functions.

    - Basic Arithmetic: Suitable for operations that don’t require decimals, such
    as indexing or basic counters.


    #### Syntax

    ```c

    int varName;

    ```


    #### Syntax Explanation

    - `int`: The keyword that defines a variable as an integer, capable of storing
    both positive and negative whole numbers.

    - `varName`: The unique name given to the variable, following naming conventions
    for clarity.


    #### Simple Code Example

    ```c

    int count = 10;

    ```


    #### Code Example Explanation

    - Declares an integer variable `count` and initializes it with the value `10`.
    This variable can be updated or modified during the program.


    #### Notes

    The range of `int` may vary depending on the ARM architecture (usually -32768
    to 32767 on 16-bit systems or -2147483648 to 2147483647 on 32-bit systems).


    #### Warnings

    Using `int` for large values in memory-constrained environments may be inefficient.
    Consider using smaller types if the range allows.


    ***


    ### 2. Unsigned Integer


    #### What is Unsigned Integer

    The `unsigned int` data type is an integer type that only holds non-negative values.
    It effectively doubles the positive range of a regular integer by discarding negative
    values.


    #### Use Purpose

    - Non-Negative Values: Ideal for values that are inherently positive, like counts,
    ages, or distances.

    - Larger Positive Range: Use when a larger maximum value is required without needing
    negative values.


    #### Syntax

    ```c

    unsigned int varName;

    ```


    #### Syntax Explanation

    - `unsigned`: Specifies that the integer variable will only hold non-negative
    values, effectively doubling its range for positive numbers.

    - `int`: Indicates the data type as an integer.


    #### Simple Code Example

    ```c

    unsigned int age = 25;

    ```


    #### Code Example Explanation

    - Declares an unsigned integer variable `age` with an initial value of `25`. This
    variable cannot hold negative values.


    #### Notes

    The unsigned integer data type can store positive values up to twice the range
    of a standard integer, maximizing the range for non-negative data.


    #### Warnings

    Assigning negative values to unsigned variables can cause overflow, leading to
    unexpected results.


    ***


    ### 3. Short Integer


    #### What is Short Integer

    `short` is a smaller integer type, occupying less memory than a standard integer,
    making it useful for applications with tight memory constraints.


    #### Use Purpose

    - Memory Optimization: Use when storage space is limited, and only a small numeric
    range is needed.

    - Small-Scale Counting: Suitable for counters or values within a limited range.


    #### Syntax

    ```c

    short varName;

    ```


    #### Syntax Explanation

    - `short`: Indicates a smaller integer type with a reduced range and memory requirement.

    - `varName`: The name assigned to the variable, used to store and retrieve values
    in the program.


    #### Simple Code Example

    ```c

    short temp = -20;

    ```


    #### Code Example Explanation

    - Declares a short integer variable `temp` and initializes it with `-20`.


    #### Notes

    The `short` type typically has a range from -32768 to 32767 on 16-bit systems.


    #### Warnings

    Avoid using `short` for values that might exceed its limited range.


    ***


    ### 4. Character


    #### What is Character

    The `char` data type represents a single character, typically using 1 byte of
    memory. It’s often used to store ASCII values or small numeric flags.


    #### Use Purpose

    - Character Data: Store a single letter or symbol for display or communication.

    - Byte-Level Data: Often used for flags or small integers.


    #### Syntax

    ```c

    char varName;

    ```


    #### Syntax Explanation

    - `char`: Specifies a single-byte character data type.

    - `varName`: The unique name given to the variable.


    #### Simple Code Example

    ```c

    char grade = ''A'';

    ```


    #### Code Example Explanation

    - Declares a character variable `grade` and assigns it the ASCII character `''A''`.


    #### Notes

    Characters are stored as integer ASCII values, making them useful for text-based
    data.


    #### Warnings

    Some compilers interpret `char` as signed by default, limiting its range to -128
    to 127. To avoid ambiguity, specify `unsigned char` if necessary.


    ***


    ### 5. Floating-Point


    #### What is Floating-Point

    The `float` data type stores decimal values and is ideal for applications requiring
    fractional values.


    #### Use Purpose

    - Precision Required: Needed when calculations or measurements require fractional
    precision.

    - Sensor Data: Ideal for real-world data like temperature or distance that includes
    decimal values.


    #### Syntax

    ```c

    float varName;

    ```


    #### Syntax Explanation

    - `float`: Declares a floating-point data type, capable of holding decimal values.

    - `varName`: The name given to the variable.


    #### Simple Code Example

    ```c

    float temperature = 36.5;

    ```


    #### Code Example Explanation

    - Declares a `float` variable `temperature` initialized to `36.5`.


    #### Notes

    Floating-point calculations can be slower on microcontrollers, as they require
    more processing power and memory.


    #### Warnings

    Excessive use of floats can reduce performance in memory-constrained systems.


    ***


    ### 6. Double Precision


    #### What is Double Precision

    The `double` data type provides double the precision of `float`, allowing for
    high-accuracy calculations, though at a higher memory cost.


    #### Use Purpose

    - High Precision Calculations: Needed when `float` precision is insufficient.

    - Scientific Data: Used in calculations where high accuracy is essential.


    #### Syntax

    ```c

    double varName;

    ```


    #### Syntax Explanation

    - `double`: Indicates double-precision floating-point, offering more precision
    than `float`.

    - `varName`: The name of the variable.


    #### Simple Code Example

    ```c

    double preciseValue = 3.1415926535;

    ```


    #### Code Example Explanation

