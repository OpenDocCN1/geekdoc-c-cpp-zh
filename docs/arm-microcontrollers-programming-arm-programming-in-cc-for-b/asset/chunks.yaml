    Relevant Project Section


    Project Name


    Non-Volatile Settings Storage with EEPROM


    Project Goal


    Store user settings (such as a threshold value) in EEPROM, allowing the system
    to retrieve these settings on startup. This demonstrates EEPROM usage for persistent
    storage and proper memory management.


    Requirement Components


    ●      ARM Microcontroller (e.g., STM32)


    ●      EEPROM (built-in on certain STM32 models)


    ●      Button and LED for threshold indication


    Component Connection Table


    | Component | Microcontroller Pin | Additional Notes |


    | Push Button | Digital Input Pin (e.g., PA1) | Changes threshold setting |


    | LED | Digital Output Pin (e.g., PC3) | Indicates threshold reached |


    Connection Analysis


    The push button changes a threshold value stored in EEPROM, and the LED lights
    up when the current value reaches or exceeds the threshold. The system can retrieve
    the threshold setting on startup, allowing persistent storage and memory management.


    Program Software Setup


    1.  Create a new project in STM32CubeIDE or Keil uVision.


    2.  Configure GPIO for button input and LED output.


    3.  Implement EEPROM read and write operations to store the threshold value.


    Project Code


    #include  "stm32f4xx.h" // Device-specific header for STM32


    #define EEPROM_ADDRESS 0x08080000 // Starting address for EEPROM


    #define THRESHOLD_DEFAULT 50       // Default threshold value


    void configureLED()  {


    RCC->AHB1ENR |= RCC_AHB1ENR_GPIOCEN;  // Enable GPIOC clock


    GPIOC->MODER |=  (1  <<  6);             // Set PC3 as output


    }


    void configureButton()  {


    RCC->AHB1ENR |= RCC_AHB1ENR_GPIOAEN;  // Enable GPIOA clock


    GPIOA->PUPDR |=  (1  <<  2);             // Enable pull-up for PA1


    }


    int readEEPROM()  {


    HAL_FLASHEx_DATAEEPROM_Unlock();


    int threshold =  *(__IO int*)EEPROM_ADDRESS; // Read threshold from EEPROM


    HAL_FLASHEx_DATAEEPROM_Lock();


    return threshold;


    }


    void writeEEPROM(int  value)  {


    HAL_FLASHEx_DATAEEPROM_Unlock();


    *(__IO int*)EEPROM_ADDRESS =  value;  // Write value to EEPROM


    HAL_FLASHEx_DATAEEPROM_Lock();


    }


    int main()  {


    configureLED();


    configureButton();


    int threshold = readEEPROM();


    if  (threshold ==  -1)  { // If no valid data, set to default


    threshold = THRESHOLD_DEFAULT;


    writeEEPROM(threshold);


    }


    while  (1)  {


    if  ((GPIOA->IDR &  (1  <<  1))  ==  0)  {  // Button pressed


    threshold +=  10;                 // Increase threshold


    writeEEPROM(threshold);          // Save new threshold to EEPROM


    }


    int sensorValue = getSensorReading();  // Hypothetical sensor reading


    if  (sensorValue >= threshold)  {


    GPIOC->BSRR =  (1  <<  3);  // Turn on LED if threshold reached


    }  else  {


    GPIOC->BSRR =  (1  <<  (3  +  16));  // Turn off LED


    }


    }


    }


    Save and Run


    1.  Save, compile, and upload the code to the ARM microcontroller.


    2.  Press the button to update the threshold value and observe the EEPROM storing
    and retrieving the value.


    Check Output


    ● The LED should turn on when the sensor reading meets or exceeds the threshold.
    The threshold value should be retained across power cycles.


    ## Communication


    Chapter Overview


    Communication protocols enable ARM microcontrollers to exchange data with other
    microcontrollers, sensors, and peripheral devices. ARM microcontrollers commonly
    support protocols like UART, SPI, and I2C, each designed for specific communication
    needs. This chapter will explore configuring these protocols, understanding their
    syntax, and applying them in a project for real-world interfacing.


    Chapter Goal


    ●      Understand and configure communication protocols on ARM microcontrollers.


    ●      Learn how to establish serial connections for data transmission.


    ● Implement a project that demonstrates serial communication between the microcontroller
    and a peripheral device.


    Rules


    ● Choose Appropriate Protocol: Use UART for simple serial communication, I2C for
    multi-device communication, and SPI for high-speed data transfer.


    ● Check Baud Rate and Clock Settings: Ensure that baud rates or clock speeds are
    compatible between communicating devices.


    ● Verify Data Transmission: Use checksums or acknowledgments where possible to
    confirm data accuracy.


    ● Use Correct Pull-ups for I2C: External pull-up resistors are often required
    for I2C communication lines.


    Brief Introduction to Communication Protocols


    Communication protocols in ARM microcontrollers facilitate data exchange with
    peripherals and other devices. UART is commonly used for simple, asynchronous
    serial communication. I2C allows multi-device communication over two wires, while
    SPI is used for high-speed data transfer over four wires. Understanding these
    protocols enables versatile communication setups in embedded systems.


