  trans: "\n\n```cpp\nvoid increment()  {\n  counter++;  // 修改全局变量\n}\n```\n\n###\
    \ 代码示例解释\n- `counter` 是一个在任何函数之外声明的全局变量，使其在 `increment` 函数和程序中的任何其他函数中被访问。变量 `counter`\
    \ 初始化为 0，并在所有对 `increment` 的调用中保留其值。\n\n### 注意事项\n全局变量可以通过消除在函数之间传递变量的需求来简化代码。然而，应该节慎使用它们，以避免过度的内存占用并保持程序的模块化。\n\
    \n### 警告\n过度使用全局变量会使调试变得困难，因为任何函数都可以更改它们的值，导致意外的运行。\n\n***\n\n## 3. 静态局部变量\n\n\
    ### 什么是静态局部变量\n静态局部变量声明在函数内部，但在该函数的多次调用之间会保留其值。与普通局部变量不同，静态局部变量只初始化一次，且其值在跨函数调用时持续，而不会重新初始化。\n\
    \n### 使用目的\n- **持久化数据存储**：在多次调用函数时保持变量数据完整，同时不会让该变量变为全局可见。\n- **内存效率**：将变量的可访问性限制在函数内，同时保留其值。\n\
    \n### 语法\n`static type varName = value;`\n\n### 语法解释\n- `static`：一个关键字，使变量在函数调用之间保留值，同时将其范围限制在声明它的函数内。\n\
    - `type`：指定静态变量的数据类型（例如 `int`、`float`）。\n- `varName`：变量名，应反映其在函数中的用途和目的。\n- `value`：可选的初始值。除非被修改，否则变量将在函数调用中保留此初始值。\n\
    \n### 简单代码示例\n```cpp\nvoid toggleState()  {\n  static int state = 0;  // 静态局部变量\n\
    \  state = !state;\n}\n```\n\n### 代码示例解释\n- 在 `toggleState` 函数中，`state` 是静态局部变量，因此它在调用之间保留保留值。每当调用\
    \ `toggleState` 时，该变量会在 0 和 1 之间切换。与普通局部变量不同，`state` 只初始化一次，且其内存会在整个程序运行期间保持分配状态。\n\
    \n### 注意事项\n静态变量通常用于必须在跨函数调用时记住、但程序其他部分不需要的数据。\n\n### 警告\n静态变量在程序的整个运行期间内都会占用内存，尽管它们仅在特定函数内可访问。请谨慎使用它们以避免过度的内存占用。\n\
    \n***\n\n## 4. 变量修改\n\n### 什么是变量修改\n修改变量允许你根据程序的当前需求更新其值。这在编程中至关重要，因为许多操作依赖于数据的更改，例如计数器、传感器值和用户输入。\n\
    \n### 使用目的\n- **动态数据管理**：根据程序条件或用户操作更改变量值。\n- **状态跟踪**：跟踪不断变化的条件，例如循环计数器、标志位或累加和。\n\
    \n### 语法\n`varName = newValue;`\n\n### 语法解释\n- `varName`：你想要修改的值的变量名。它必须先在可访问的作用范围内（例如全局作用域、函数作用域）声明。\n\
    - `newValue`：分配给变量的新值，其应与 `varName` 的数据类型匹配。\n\n### 简单代码示例\n```cpp\nint counter\
    \ = 5;\ncounter = 10; // 修改 counter 的值\n```\n\n### 代码示例解释\n- 最初，`counter` 设置为\
    \ 5。下一行将 `counter` 更新为 10，演示了变量如何根据程序逻辑或输入动态变化。此新值将覆盖旧值并一直保持直到再次被更改。\n\n### 注意事项\n\
    变量修改对于任何需要实时更新程序（如传感器、计数器和控制系统）都是基础。\n\n### 警告\n确保新值在变量的范围和类型限制内，以避免潜在的溢出或数据损坏。\n\
    \n***\n\n## 5. 常量声明\n\n### 什么是常量声明\n常量是一个其值在声明时就固定的，并且在整个程序执行过程中无法更改的变量。常量常用于定义稳定的参数，例如数学常数或硬件配置，这些参数在运行期间不应更改。\n\
    \n### 使用目的\n- **固定参数**：适用于保持不变的值，如缓冲区大小或转换因子。\n- **代码可读性**：为重要值提供有意义的名字，使代码更容易解释和维护。\n\
    \n### 语法\n`const type varName = value;`\n\n### 语法解释\n- `const`：一个关键字，表示该变量是只读的，初始化后无法修改。\n\
    - `type`：指定常量的数据类型（例如 `int`、`float`）。\n- `varName`：使用大写的描述性名称（通常是常量约定），以区别于可以更改的变量。\n\
    - `value`：分配给常量的初始且不可更改的值，与 `varName` 的数据类型匹配。\n\n### 简单代码示例\n```cpp\nconst int\
    \ MAX_LIMIT = 100; // 定义一个值为 100 的常量\n```\n\n### 代码示例解释\n- 了一个固定值为 100 的整数常量 `MAX_LIMIT`。此值在程序执行期间不能更改，确保在代码中每次访问\
    \ `MAX_LIMIT` 时它始终代表 100。\n\n### 注意事项\n常量使程序更具可读性，并防止意外修改重要值。\n\n### 警告\n尝试修改常量将导致编译错误，因为常量在设计上是只读的。\n\
    \n***\n\n## 相关项目章节\n\n### 项目名称\n带有持久化状态的按钮按下计数器\n\n### 项目目标\n实现一个按钮按下计数器，使用局部、静态和全局变量来计数并保留多次按下的状态。该项目演示了变量管理、持久性和范围选择。\n\
    \n### 项目组件\n- ARM 微控制器（如 STM32）\n- 连接到 GPIO 引脚的按钮\n- 串口通信输出\n\n### 组件连接表格\n| 组件\
    \ | 微控制器引脚 | 备注 |\n| :--- | :--- | :--- |\n| 按钮 | GPIO 输入引 | 检测按下 |\n| 串口接口 |\
    \ TX, RX (可选) | 用于显示 |\n\n### 连接分析\n按钮连接到 GPIO 输入引，允许程序检测每次按下。该项目使用局部、静态和全局变量来管理按下计数，并通过串口通信显示。\n\
    \n### 程序软件设置\n1. 在 STM32CubeIDE 或 Keil uVision 中创建一个项目。\n2. 将 GPIO 引脚配置为输入，根据需要设置串口通信。\n\
    3. 在适当的作用范围内定义变量以管理按下计数。\n\n### 项目代码\n```cpp\n#include <stdio.h>\n#include <stdint.h>\n\
    \nint pressCounter = 0; // 用于总按下次数的全局变量\n\nvoid buttonPress() {\n  static int\
    \ localPressCount = 0; // 在函数内持久化计数的静态变量\n  int currentPress = 1; // 代表按下状态的局部变量\n\
    \n  if (currentPress) {\n    pressCounter++; // 修改全局计数器\n    localPressCount++;\
    \ // 修改静态局部计数器\n    printf(\"Global Count: %d, Local Count: %d\\n\", pressCounter,\
    \ localPressCount);\n  }\n}\n\nint main() {\n  // 此处假设 GPIO 和串口通信的设置代码\n  while\
    \ (1) {\n    buttonPress(); // 按下按钮时调用函数\n  }\n  return 0;\n}\n```\n\n### 保存并运行\n\
    1. 保存、编译并将代码上传到 ARM 微控制器。\n2. 打开串口监视器，在按下按钮时查看计数。\n\n### 检查输出\n- 输出应显示全局和局部（静态）计数随每次按下而递增，说明了变量作用域如何控制内存和数据持久性。\n\
    \n## 数字 I/O\n章节概述\n\n"
- fmt: "\n# Digital Input/Output (I/O) is fundamental in embedded systems programming,\
    \ allowing the microcontroller to interact with external devices by reading digital\
    \ signals or controlling digital outputs. ARM microcontrollers offer flexible\
    \ digital I/O control through `GPIO` (General Purpose Input/Output) pins, which\
    \ can be configured as either input or output. This chapter will explore how to\
    \ configure and use digital I/O in ARM microcontrollers.\n\n## Chapter Goal\n\n\
    - Understand how to configure GPIO pins for digital I/O.\n- Learn to read from\
    \ input pins and control output pins.\n- Implement a project to demonstrate digital\
    \ I/O concepts by controlling an LED using a button.\n\n## Rules\n\n- Pin Mode:\
    \ Set each GPIO pin as either input or output depending on its intended use.\n\
    - Pull-Up/Pull-Down Resistors: Enable internal pull-up or pull-down resistors\
    \ for stable input readings.\n- Debouncing: Use software or hardware techniques\
    \ to prevent false readings from button presses.\n- Pin State: Ensure output pins\
    \ are properly set to HIGH or LOW, and input pins are properly read.\n\n## Brief\
    \ Introduction to Digital I/O\n\nDigital I/O pins allow ARM microcontrollers to\
    \ interface with external hardware. Digital input reads HIGH or LOW signals, while\
    \ digital output sets pins to HIGH or LOW, controlling devices like LEDs or relays.\
    \ GPIO pins must be configured as either input or output, with optional internal\
    \ pull-up or pull-down resistors to stabilize input readings.\n\n## Syntax Table\n\
    \n| Serial No | Topic | Syntax | Simple Example |\n| :--- | :--- | :--- | :---\
    \ |\n| 1 | Set GPIO Pin as Output | `GPIOx->MODER |= (1 << (2*pinNumber));` |\
    \ |\n| 2 | Set GPIO Pin as Input | `GPIOx->MODER &= ~(3 << (2*pinNumber));` |\
    \ `GPIOA->MODER &= ~(3 << 6);` |\n| 3 | Set Output High | `GPIOx->BSRR = (1 <<\
    \ pinNumber);` | `GPIOA->BSRR = (1 << 5);` |\n| 4 | Set Output Low | `GPIOx->BSRR\
    \ = (1 << (pinNumber + 16));` | `GPIOA->BSRR = (1 << 21);` |\n| 5 | Read Input\
    \ State | `GPIOx->IDR & (1 << pinNumber);` | `GPIOA->IDR & (1 << 5);` |\n\n***\n\
    \n## Detailed Breakdown for Each Command\n\n### 1. Set GPIO Pin as Output\n\n\
    #### What is Setting GPIO Pin as Output\nConfiguring a GPIO pin as an output allows\
    \ the microcontroller to control external devices, such as LEDs or motors, by\
    \ setting the pin’s state to HIGH or LOW.\n\n#### Use Purpose\n- Control External\
    \ Devices: Sets the pin’s state to control attached hardware like LEDs.\n- Digital\
    \ Output Signal: Enables the pin to send digital signals (HIGH or LOW).\n\n####\
    \ Syntax\n```\nGPIOx->MODER |= (1 << (2 * pinNumber));\n```\n\n#### Syntax Explanation\n\
    - `GPIOx`: The specific GPIO port (e.g., `GPIOA`, `GPIOB`) where the pin is located.\n\
    - `MODER`: The mode register that controls whether each pin is set as input or\
    \ output.\n- `(1 << (2 * pinNumber))`: Sets the desired pin to output mode by\
    \ shifting 1 left by `2 * pinNumber` bits. The `*2` accounts for the two-bit configuration\
    \ required for each pin in the `MODER` register.\n\n#### Simple Code Example\n\
    ```\nGPIOA->MODER |= (1 << 10); // Set PA5 as output\n```\n\n#### Code Example\
    \ Explanation\n- Configures `PA5` (pin 5 on GPIO port A) as an output. This pin\
    \ can now be controlled as either HIGH or LOW to control connected devices like\
    \ an LED.\n\n#### Notes\nEnsure that only the correct bits are set in `MODER`\
    \ to avoid affecting other pins.\n\n#### Warnings\nIncorrectly setting a pin as\
    \ output may damage the pin if connected to an external voltage source. Double-check\
    \ pin configuration before applying power.\n\n***\n\n### 2. Set GPIO Pin as Input\n\
    \n#### What is Setting GPIO Pin as Input\nConfiguring a GPIO pin as input enables\
    \ the microcontroller to read signals from external components, such as buttons\
    \ or sensors.\n\n#### Use Purpose\n- Read Digital Signals: Reads signals like\
    \ button presses or sensor outputs.\n- Digital Input Monitoring: Allows the pin\
    \ to sense whether it’s in a HIGH or LOW state.\n\n#### Syntax\n```\nGPIOx->MODER\
    \ &= ~(3 << (2 * pinNumber));\n```\n\n#### Syntax Explanation\n- `GPIOx`: The\
    \ GPIO port where the pin is located (e.g., `GPIOA`, `GPIOB`).\n- `MODER`: The\
    \ mode register that controls each pin's mode.\n- `~(3 << (2 * pinNumber))`: Clears\
    \ both bits for the specified pin to set it as input, where 3 represents binary\
    \ `11` (cleared with `~` for input mode).\n\n#### Simple Code Example\n```\nGPIOA->MODER\
    \ &= ~(3 << 6); // Set PA3 as input\n```\n\n#### Code Example Explanation\n- Configures\
    \ `PA3` as an input, enabling it to read digital signals, such as a button’s state.\n\
    \n#### Notes\nInput pins may require pull-up or pull-down resistors to stabilize\
    \ the signal and prevent floating states.\n\n#### Warnings\nLeaving input pins\
    \ floating (not connected to a stable voltage) can cause unpredictable behavior.\n\
    \n***\n\n### 3. Set Output High\n\n#### What is Setting Output High\nSetting an\
    \ output pin HIGH sends a voltage (e.g., 3.3V) to the connected device, which\
    \ can turn on an LED or activate a relay.\n\n#### Use Purpose\n- Activate Connected\
    \ Device: Provides power or signal to devices like LEDs or relays.\n\n#### Syntax\n\
    ```\nGPIOx->BSRR = (1 << pinNumber);\n```\n\n#### Syntax Explanation\n- `GPIOx`:\
    \ The GPIO port where the pin is located.\n- `BSRR`: The Bit Set/Reset Register.\n\
    - `(1 << pinNumber)`: Shifts 1 left by `pinNumber` to set the bit.\n\n#### Simple\
    \ Code Example\n```\nGPIOA->BSRR = (1 << 5); // Set PA5 HIGH\n```\n\n#### Code\
    \ Example Explanation\n- Sets `PA5` to HIGH, turning on connected devices like\
    \ an LED.\n\n#### Notes\nUsing the `BSRR` register is efficient for setting other\
    \ pins.\n\n#### Warnings\nAvoid setting a pin HIGH if it is connected directly\
    \ to ground.\n\n***\n\n### 4. Set Output Low\n\n#### What is Setting Output Low\n\
    Setting an output pin LOW grounds the pin, turning off devices like LEDs.\n\n\
    #### Use Purpose\n- Deactivate Devices: Cuts off power or signal to devices.\n\
    - Digital LOW Signal: Sets the pin to LOW.\n\n#### Syntax\n```\nGPIOx->BSRR =\
    \ (1 << (pinNumber + 16));\n```\n\n#### Syntax Explanation\n- `GPIOx`: The GPIO\
    \ port where the pin is located.\n- `BSRR`: The Bit Set/Reset Register.\n- `(1\
    \ << (pinNumber + 16))`: Shifts 1 left by `pinNumber + 16` to reset the bit.\n\
    \n#### Simple Code Example\n```\nGPIOA->BSRR = (1 << 21); // Set PA5 LOW\n```\n\
    \n#### Code Example Explanation\n- Sets `PA5` to LOW, turning off connected devices\
    \ like an LED.\n\n#### Notes\nThe `BSRR` register only affects the specified pin.\n\
    \n#### Warnings\nMake sure the correct pin is selected; otherwise unintended pins\
    \ may be affected.\n\n***\n\n### 5. Read Input State\n\n#### What is Reading Input\
    \ State\nReading the state of an input pin allows the microcontroller to detect\
    \ if the pin is in a HIGH or LOW state, which is essential for reading button\
    \ presses or sensor signals.\n\n#### Syntax\n```\nGPIOx->IDR & (1 << pinNumber);\n\
    ```\n\n#### Syntax Explanation\n- `GPIOx`: The GPIO port where the pin is located.\n\
    - `IDR`: The Input Data Register, which holds the current state of each pin in\
    \ the port.\n- `& (1 << pinNumber)`: Performs a bitwise AND with 1 shifted by\
    \ `pinNumber` to isolate the state of the specific pin.\n\n#### Simple Code Example\n\
    ```\nif (GPIOA->IDR & (1 << 5)) { // Check if PA5 is HIGH\n    // Do something\
    \ if PA5 is HIGH\n}\n```\n\n#### Code Example Explanation\n- Checks if `PA5` is\
    \ in the HIGH state. If true, the code within the `if` statement executes.\n\n\
    #### Notes\nReading the input state is a non-destructive operation, so the state\
    \ remains unchanged.\n\n#### Warnings\nMake sure the pin is configured as input;\
    \ reading an output-configured pin may yield undefined results.\n"
  raw: 'Digital Input/Output (I/O) is fundamental in embedded systems programming,
    allowing the microcontroller to interact with external devices by reading digital
    signals or controlling digital outputs. ARM microcontrollers offer flexible digital
    I/O control through GPIO (General Purpose Input/Output) pins, which can be configured
    as either input or output. This chapter will explore how to configure and use
    digital I/O in ARM microcontrollers.


    Chapter Goal


    ●      Understand how to configure GPIO pins for digital I/O.


    ●      Learn to read from input pins and control output pins.


    ● Implement a project to demonstrate digital I/O concepts by controlling an LED
    using a button.


    Rules


    ● Pin Mode: Set each GPIO pin as either input or output depending on its intended
    use.


    ● Pull-Up/Pull-Down Resistors: Enable internal pull-up or pull-down resistors
    for stable input readings.


    ● Debouncing: Use software or hardware techniques to prevent false readings from
    button presses.


    ● Pin State: Ensure output pins are properly set to HIGH or LOW, and input pins
    are properly read.


    Brief Introduction to Digital I/O


    Digital I/O pins allow ARM microcontrollers to interface with external hardware.
    Digital input reads HIGH or LOW signals, while digital output sets pins to HIGH
    or LOW, controlling devices like LEDs or relays. GPIO pins must be configured
    as either input or output, with optional internal pull-up or pull-down resistors
    to stabilize input readings.


    Syntax Table


    | Serial No | Topic | Syntax | Simple Example |


    | 1 | Set GPIO Pin as Output | `GPIOx->MODER | = (1 << (2*pinNumber));` |


    | 2 | Set GPIO Pin as Input | GPIOx->MODER &= ~(3 << (2*pinNumber)); | GPIOA->MODER
    &= ~(3 << 6); |


    | 3 | Set Output High | GPIOx->BSRR = (1 << pinNumber); | GPIOA->BSRR = (1 <<
    5); |


    | 4 | Set Output Low | GPIOx->BSRR = (1 << (pinNumber + 16)); | GPIOA->BSRR =
    (1 << 21); |


    | 5 | Read Input State | GPIOx->IDR & (1 << pinNumber); | GPIOA->IDR & (1 << 5);
    |


    * * *


    Detailed Breakdown for Each Command


    1\. Set GPIO Pin as Output


    What is Setting GPIO Pin as Output


    Configuring a GPIO pin as an output allows the microcontroller to control external
    devices, such as LEDs or motors, by setting the pin’s state to HIGH or LOW.


    Use Purpose


    ● Control External Devices: Sets the pin’s state to control attached hardware
    like LEDs.


    ● Digital Output Signal: Enables the pin to send digital signals (HIGH or LOW).


    Syntax


    GPIOx->MODER |=  (1  <<  (2  * pinNumber));


    Syntax Explanation


    ● GPIOx: The specific GPIO port (e.g.,  GPIOA,  GPIOB) where the pin is located.


    ● MODER: The mode register that controls whether each pin is set as input or output.


    ● (1 << (2 * pinNumber)): Sets the desired pin to output mode by shifting 1 left
    by  2 * pinNumber bits. The  *2 accounts for the two-bit configuration required
    for each pin in the  MODER register.


    Simple Code Example


    GPIOA->MODER |=  (1  <<  10); // Set PA5 as output


    Code Example Explanation


    ● Configures  PA5 (pin 5 on GPIO port A) as an output. This pin can now be controlled
    as either HIGH or LOW to control connected devices like an LED.


    Notes


    Ensure that only the correct bits are set in  MODER to avoid affecting other pins.


    Warnings


    Incorrectly setting a pin as output may damage the pin if connected to an external
    voltage source. Double-check pin configuration before applying power.


    * * *


    2\. Set GPIO Pin as Input


    What is Setting GPIO Pin as Input


    Configuring a GPIO pin as input enables the microcontroller to read signals from
    external components, such as buttons or sensors.


    Use Purpose


    ●      Read Digital Signals: Reads signals like button presses or sensor outputs.


    ● Digital Input Monitoring: Allows the pin to sense whether it’s in a HIGH or
    LOW state.


    Syntax


    GPIOx->MODER &=  ~(3  <<  (2  * pinNumber));


    Syntax Explanation


    ● GPIOx: The GPIO port where the pin is located (e.g.,  GPIOA,  GPIOB).


    ●      MODER: The mode register that controls each pin''s mode.


    ● ~(3 << (2 * pinNumber)): Clears both bits for the specified pin to set it as
    input, where 3 represents binary  11 (cleared with ~ for input mode).


    Simple Code Example


    GPIOA->MODER &=  ~(3  <<  6); // Set PA3 as input


    Code Example Explanation


    ● Configures  PA3 as an input, enabling it to read digital signals, such as a
    button’s state.


    Notes


    Input pins may require pull-up or pull-down resistors to stabilize the signal
    and prevent floating states.


    Warnings


    Leaving input pins floating (not connected to a stable voltage) can cause unpredictable
    behavior.


    * * *


    3\. Set Output High


    What is Setting Output High


    Setting an output pin HIGH sends a voltage (e.g., 3.3V) to the connected device,
    which can turn on an LED or activate a relay.


    Use Purpose


    ● Activate Connected Device: Provides power or signal to devices like LEDs or
    relays.


    ● Digital HIGH Signal: Sets the pin to a HIGH state, enabling digital control.


    Syntax


    GPIOx->BSRR =  (1  << pinNumber);


    Syntax Explanation


    ●      GPIOx: The GPIO port where the pin is located.


    ●      BSRR: The Bit Set/Reset Register, used for setting or resetting pins.


    ● (1 << pinNumber): Shifts 1 left by the number of the pin to set it HIGH without
    affecting other pins.


    Simple Code Example


    GPIOA->BSRR =  (1  <<  5); // Set PA5 HIGH


    Code Example Explanation


    ● Sets  PA5 to HIGH, turning on a connected device like an LED if attached to
    the pin.


    Notes


    Using the  BSRR register is efficient for setting and resetting without modifying
    other pins in the port.


    Warnings


    Avoid setting an output pin HIGH if it is connected directly to ground, as it
    may cause a short circuit.


    * * *


    4\. Set Output Low


    What is Setting Output Low


    Setting an output pin LOW grounds the pin, turning off connected devices like
    LEDs or stopping current to a circuit.


    Use Purpose


    ●      Turn Off Devices: Cuts off power or signal to deactivate devices.


    ●      Digital LOW Signal: Sets the pin to a LOW state.


    Syntax


    GPIOx->BSRR =  (1  <<  (pinNumber +  16));


    Syntax Explanation


    ●      GPIOx: The GPIO port where the pin is located.


    ● BSRR: The Bit Set/Reset Register, which can set pins LOW by shifting 1 left
    by  pinNumber + 16 bits.


    ● (1 << (pinNumber + 16)): Shifts 1 by  pinNumber + 16 to reset the specific pin
    to LOW.


    Simple Code Example


    GPIOA->BSRR =  (1  <<  21); // Set PA5 LOW


    Code Example Explanation


    ●      Sets  PA5 to LOW, turning off any connected devices like LEDs.


    Notes


    Setting the pin LOW using the  BSRR register only affects the specified pin, leaving
    other pins unchanged.


    Warnings


    Make sure the correct pin is selected; otherwise, unintended pins may be affected.


    * * *


    5\. Read Input State


    What is Reading Input State


    Reading the state of an input pin allows the microcontroller to detect if the
    pin is in a HIGH or LOW state, which is essential for reading button presses or
    sensor signals.


    Use Purpose


    ● Detect Digital Signals: Identifies whether a button is pressed or a sensor is
    activated.


    ●      Logic Checking: Monitors state changes on input pins.


    Syntax


    GPIOx->IDR &  (1  << pinNumber);


    Syntax Explanation


    ●      GPIOx: The GPIO port where the pin is located.


    ● IDR: The Input Data Register, which holds the current state of each pin in the
    port.


    ● & (1 << pinNumber): Performs a bitwise AND with 1 shifted by  pinNumber to isolate
    the state of the specific pin.


    Simple Code Example


    if  (GPIOA->IDR &  (1  <<  5))  { // Check if PA5 is HIGH


    // Do something if PA5 is HIGH


    }


    Code Example Explanation


    ● Checks if  PA5 is in the HIGH state. If true, the code within the  if statement
    executes, enabling logic based on the input state.


    Notes


    Reading the input state is a non-destructive operation, so the state remains unchanged.


    Warnings


    Make sure the pin is configured as input; reading an output-configured pin may
    yield undefined results.


    * * *


    Relevant Project Section


    Project Name


    Button-Controlled LED


    Project Goal'
