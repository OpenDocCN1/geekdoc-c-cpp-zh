    5\. Switch Statement


    What is Switch Statement


    The  switch statement allows the program to execute different code based on the
    value of a variable, making it ideal for multi-condition checks.


    Use Purpose


    ●      Efficient Multi-Case Handling: Reduces complexity in code with multiple
    options.


    ● Alternative to If-Else Chains: Provides a more readable structure for handling
    several distinct values.


    Syntax


    switch  (variable)  {


    case value1:


    // Code for case value1


    break;


    case value2:


    // Code for case value2


    break;


    default:


    // Code for all other cases


    break;


    }


    Syntax Explanation


    ●      switch: Begins the multi-case control structure.


    ●      variable: The expression or variable evaluated by the switch.


    ● case: Specifies each possible value for  variable, with code to execute if it
    matches.


    ●      break: Exits the switch after executing a case to prevent “fall-through.”


    Simple Code Example


    switch  (buttonState)  {


    case  1:


    LED_On();


    break;


    case  2:


    LED_Off();


    break;


    default:


    LED_Toggle();


    break;


    }


    Code Example Explanation


    ● Based on  buttonState, the switch toggles an LED, turns it on, or turns it off.
    The  break statements ensure each case executes independently.


    Notes


    Switch statements work only with integer, character, or enumerated types.


    Warnings


    Always include a  default case to handle unexpected values and prevent undefined
    behavior.


    * * *


    Relevant Project Section


    Project Name


    Temperature-Controlled Fan System


    Project Goal


    Use control structures to manage a fan’s operation based on temperature readings
    from a sensor. The fan speed adjusts according to the temperature range, and an
    emergency shutdown occurs if the temperature exceeds a threshold.


    Requirement Components


    ●      ARM Microcontroller (e.g., STM32)


    ●      Temperature sensor connected to an ADC pin


    ●      Fan connected to a PWM output pin


    ●      LED for emergency indication


    Component Connection Table


    | Component | Microcontroller Pin | Additional Notes |


    | Temperature Sensor | ADC Input Pin (e.g., PA0) | Provides analog temperature
    input |


    | Fan | PWM Output Pin (e.g., PB4) | Controls fan speed |


    | LED | Digital Output Pin (e.g., PC3) | Indicates emergency state |


    Connection Analysis


    The temperature sensor provides real-time readings to the microcontroller, which
    adjusts the fan’s speed using PWM based on the temperature range. If the temperature
    exceeds a safety threshold, the LED turns on, indicating an emergency state.


    Program Software Setup


    1.  Create a new project in STM32CubeIDE or Keil uVision.


    2.  Configure the ADC to read the temperature sensor data.


    3.  Set up PWM for the fan control and configure the LED as a digital output.


    Project Code


    #include  "stm32f4xx.h" // Device-specific header for STM32


    void configureADC()  {


    RCC->APB2ENR |= RCC_APB2ENR_ADC1EN;  // Enable ADC1 clock


    ADC1->CR2 |= ADC_CR2_ADON;           // Enable ADC1


    }


    void configurePWM()  {


    RCC->APB1ENR |= RCC_APB1ENR_TIM3EN;  // Enable TIM3 clock


    TIM3->CCMR1 |= TIM_CCMR1_OC1M_PWM1; // Set TIM3 Channel 1 to PWM mode


    TIM3->CCR1 =  128;                    // Set initial duty cycle


    TIM3->CR1 |= TIM_CR1_CEN;            // Enable TIM3


    }


    uint16_t readADC()  {


    ADC1->CR2 |= ADC_CR2_SWSTART;        // Start ADC conversion


    while  (!(ADC1->SR & ADC_SR_EOC));    // Wait for conversion complete


    return ADC1->DR;                     // Read ADC result


    }


    int main()  {


    configureADC();       // Set up ADC


    configurePWM();       // Set up PWM for fan control


    uint16_t temperature;


    while  (1)  {


    temperature = readADC();  // Read temperature value


    if  (temperature >  200)  {     // Emergency threshold


    GPIOC->BSRR =  (1  <<  3);  // Turn on LED


    TIM3->CCR1 =  0;          // Turn off fan


    }  else  if  (temperature >  150)  {


    TIM3->CCR1 =  200;        // Set fan speed to 80%


    }  else  if  (temperature >  100)  {


    TIM3->CCR1 =  128;        // Set fan speed to 50%


    }  else  {


    TIM3->CCR1 =  64;         // Set fan speed to 25%


    }


    }


    }


    Save and Run


    1.  Save, compile, and upload the code to the ARM microcontroller.


    2.  Observe the fan speed adjusting according to temperature and the LED turning
    on if an emergency condition is detected.


    Check Output


    ● The fan speed should increase as temperature rises, and the LED should activate
    if the temperature exceeds a critical threshold, demonstrating the control structure’s
    effectiveness.


