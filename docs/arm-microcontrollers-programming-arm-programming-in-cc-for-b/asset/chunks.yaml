  trans: "\n\n- `~RCC_APB1ENR_TIM3EN`: 清除 `TIM3` 时钟允许位，停止电源。\n\n### 简单代码示例\n```c\n\
    RCC->APB1ENR &=  ~RCC_APB1ENR_TIM3EN; // Disable TIM3 时钟\n```\n\n### 代码示例解释\n\
    - 禁用 `TIM3` 时钟，在不需要定时器时节省功率。\n\n### 注意事项\n在空闲时关闭外设电源以延长电池寿命。\n\n### 警告\n确保没有正在运行的进程依赖于已禁的外设。\n\
    \n***\n\n# 5. 禁用未使用的外设\n\n### 什么是禁用未使用的外设\n禁用未使用的外设（如定时器）通过停止特定的硬件模块来降低功耗。\n\n\
    ### 用途\n- **节省功率**：停止非活动模块的电源。\n- **控制外设使用**：帮助管理哪些外设被供电。\n\n### 语法\n```c\nTIM3->CR1\
    \ &=  ~TIM_CR1_CEN;\n```\n\n### 语法解释\n- `TIM3`: 定时器 3 外设。\n- `CR1`: 控制寄存器 1。\n\
    - `~TIM_CR1_CEN`: 清除允许位，停止定时器。\n\n### 简单代码示例\n```c\nTIM3->CR1 &=  ~TIM_CR1_CEN;\
    \ // 禁用 TIM3 定时器\n```\n\n### 代码示例解释\n- 在不需要时禁用 `TIM3` 定时器，降低功耗。\n\n### 注意事项\n\
    禁用外设可以防止意外的资源使用并节省功率。\n\n### 警告\n注意不要停止正在执行的任务所需的外设。\n\n***\n\n## 相关项目章节\n\n####\
    \ 项目名称\n低功耗传感器数据记录器\n\n#### 项目目标\n开发一个数据记录器，能够周期性地读取传感器数据，并在读取之间进入低功耗模式以延长电池寿命。程序通过仅对所需的外设供电并在空闲时使用睡眠模式来优化性能。\n\
    \n#### 组件\n- ARM 微控制器（例如 `STM32`）\n- 连接到 ADC 引脚的温度传感器\n- 用于数据记录的外部存储（可选）\n\n####\
    \ 组件连接表\n| 组件 | 微控制器引脚 | 额外备注 |\n| :--- | :--- | :--- |\n| 温度传感器 | ADC 输入引脚（例如\
    \ `PA0`） | 提供周期读取的模拟数据 |\n| 存储接口 | 通信引脚 | 用于存储记录的数据（可选） |\n\n#### 连接分析\n微控制器周期性地读取温度传感器，在记录数据的同时，通过在读取之间进入低功耗睡眠模式来节省功率。控制外设时钟以减少功耗。\n\
    \n### 程序软件设置\n1. 在 `STM32CubeIDE` 或 `Keil uVision` 中创建一个新项目。\n2. 配置 `ADC` 用于温度读取以及用于数据记录的可选通信。\n\
    3. 实现代码以管理低功耗模式并优化外设使用。\n\n### 项目代码\n```c\n#include  \"stm32f4xx.h\" // STM32\
    \ 设备特定头文件\n\nvoid configureADC()  {\n  RCC->APB2ENR |= RCC_APB2ENR_ADC1EN;  //\
    \ 开启 ADC1 时钟\n  ADC1->CR2 |= ADC_CR2_ADON;              // 开启 ADC1\n}\n\nvoid\
    \ enableLowPowerMode()  {\n  // 进入低功耗模式 (WFI - 等待中断)\n  __WFI();\n}\n\nuint16_t\
    \ readTemperature()  {\n  ADC1->CR2 |= ADC_CR2_SWSTART;       // 开始 ADC 转换\n \
    \ while  (!(ADC1->SR & ADC_SR_EOC));   // 等待完成\n  return ADC1->DR;           \
    \        // 返回 ADC 结果\n}\n\nint main()  {\n  configureADC();  // 为传感器设置 ADC\n\
    \  while  (1)  {\n    uint16_t tempValue = readTemperature();  // 读取温度传感器\n  \
    \  // 可选：将 tempValue 记录到外部存储\n    enableLowPowerMode();  // 进入低功耗模式直到下一次唤醒\n \
    \ }\n}\n```\n\n### 保存并运行\n1. 保存、编译并将代码上传到 ARM 微控制器。\n2. 通过监控温度读取期间的低功耗模式来观察功耗的减少。\n\
    \n### 检查输出\n- 微控制器应读取温度传感器，如果适用则记录数据，然后进入低功耗睡眠模式，通过减少不必要的功耗来有效延长电池寿命。\n\n## 内存管理与\
    \ EEPROM 使用\n\n### 章节概述\n内存管理在嵌入式系统中至关重要，可确保有效利用可用内存，特别是在处理临时数据、常量非易失性存储时。ARM\
    \ 微控制器通常包含 `EEPROM`（电可擦除可编程只读存储），用于在电源周期之间保留数据。本章涵盖了有效的内存管理技术，包括 `EEPROM` 访问，以优化\
    \ ARM 微控制器中的数据存储。\n\n### 章节目标\n- 理解 ARM 微控制器中的内存管理以及在 `RAM` 和 `EEPROM` 中管理数据的技术。\n\
    - 学习从 `EEPROM` 存储和检索用于非易性存储的数据。\n- 实现一个演示实际内存管理和 `EEPROM` 使用的项目。\n\n### 规则\n-\
    \ 避免不必要的内存使用。\n- 尽量减少 `EEPROM` 写入。\n- 根据需要使用 `volatile`。\n- 使用后清除内存。\n\n### 内存管理与\
    \ EEPROM 简介介绍\nARM 微控制器的内存管理涉及 `RAM` 和 `EEPROM`。`RAM` 用于易失性。\n\n### 语法表\n| 序号\
    \ | 主题 | 语法 | 简单示例 |\n| :--- | :--- | :--- | :--- |\n| 1 | 在 RAM 中声明变量 | `type\
    \ varName;` | `int counter;` |\n| 2 | 从 EEPROM 读取 | `HAL_FLASHEx_DATAEEPROM_Unlock();\
    \ ...` | `data = *(__IO uint32_t*)address;` |\n| 3 | 写入 EEPROM | `HAL_FLASHEx_DATAEEPROM_Unlock();\
    \ ...` | `*(__IO uint32_t*)address = data;` |\n| 4 | 释放内存 | `free(pointer);` |\
    \ `free(data);` |\n| 5 | 声明 变量 | `volatile type varName;` | `volatile int flag;`\
    \ |\n\n***\n\n## 命令详解\n\n### 1. 在 RAM 中声明变量\n#### 声明变量\n在 `RAM` 中声明变量提供临时存储。`RAM`\
    \ 变量会在重置时丢失。\n\n#### 用途\n- 临时存储：仅在执行期间持有。\n- 频繁访问：适用于计数器和缓冲区。\n\n#### 语法\n```c\n\
    type varName;\n```\n#### 语法解释\n- `type`: 数据类型（例如 `int`, `float`）。\n- `varName`:\
    \ 变量名。\n\n#### 简单代码示例\n```c\nint counter;\n```\n#### 代码示例解释\n- 在 `RAM` 中声明整数 `counter`。该变量在重置时会被清除，适用于跟踪状态。\n\
    \n#### 注意事项\n`RAM` 变量访问速度更快，但是易失性的。\n\n#### 警告\n在资源受限的微控制器上过度使用内存。\n\n***\n\n\
    ### 2. 从 EEPROM 读取\n#### 从 EEPROM 读取\n从 `EEPROM` 读取存储在非易失性内存中的数据，数据在掉电或重置后依然存在。`EEPROM`\
    \ 读取适用于配置数据、校准常量和用户设置。\n\n#### 用途\n- 获取持久数据：访问重置后保留的数据。\n- 配置设置：加载永久存储的设置。\n\n\
    #### 语法\n```c\nHAL_FLASHEx_DATAEEPROM_Unlock();\ndata = *(__IO uint32_t*)address;\n\
    HAL_FLASHEx_DATAEEPROM_Lock();\n```\n#### 语法解释\n- `HAL_FLASHEx_DATAEEPROM_Unlock()`：解锁\
    \ `EEPROM` 以访问。\n- `data = *(__IO uint32_t*)address;`：读取 `EEPROM` 地址的数据。\n- `HAL_FLASHEx_DATAEEPROM_Lock()`：读取后锁定\
    \ `EEPROM`。\n\n#### 简单代码示例\n```c\nHAL_FLASHEx_DATAEEPROM_Unlock();\nint data =\
    \  *(__IO uint32_t*)0x08080000; // 从 EEPROM 地址读取\nHAL_FLASHEx_DATAEEPROM_Lock();\n\
    ```\n#### 代码示例解释\n解锁 `EEPROM`，从指定的 `EEPROM` 地址读取一个整数，然后锁定 `EEPROM`，确保数据完整性。\n\n\
    #### 注意事项\n仅对需要长期保存的数据使用 `EEPROM`，以避免频繁的读写。\n\n"
