- fmt: "\n## Open a Bluetooth terminal app on your mobile device, connect to the `HC-05`\
    \ module, and send the commands `'1'` (to turn on the LED) or `'0'` (to turn it\
    \ off).\n\n### Check Output\n● When you send `'1'` over Bluetooth, the LED on\
    \ the microcontroller should turn on.\n● When you send `'0'`, the LED should turn\
    \ off, demonstrating remote control via Bluetooth.\n\n## 7 Segment\n\n### Chapter\
    \ Overview\n7-segment displays are widely used to display numerical data in embedded\
    \ systems. These displays can represent numbers and some characters by lighting\
    \ up specific segments, making them useful for applications like clocks, counters,\
    \ and measurement displays. This chapter explores how to interface a 7-segment\
    \ display with an ARM microcontroller, focusing on controlling individual segments\
    \ to display different numbers.\n\n### Chapter Goal\n● Understand the structure\
    \ and working principles of 7-segment displays.\n● Learn how to interface and\
    \ control a 7-segment display using `GPIO` pins on an ARM microcontroller.\n●\
    \ Implement a project that displays numbers on a 7-segment display.\n\n### Rules\n\
    ● Check Display Type: Identify whether the 7-segment display is common anode or\
    \ common cathode, as it affects the segment control logic.\n● Use GPIO Pins Efficiently:\
    \ Allocate `GPIO` pins specifically for segments, ensuring they can drive sufficient\
    \ current.\n● Avoid Excessive Current: Use current-limiting resistors to protect\
    \ segments and prevent excessive current draw.\n● Use Delays for Multiplexing:\
    \ For multiple digits, use delays or timer-based multiplexing to display numbers\
    \ sequentially.\n\n### Brief Introduction to 7-Segment Display\nA 7-segment display\
    \ consists of seven LEDs arranged in a figure-eight pattern, each labeled from\
    \ `'a'` to `'g.'`. Lighting specific segments allows numbers from 0 to 9 to be\
    \ displayed. ARM microcontrollers can control these segments using `GPIO` pins,\
    \ where each pin connects to an individual segment. The two main types of displays\
    \ are:\n● Common Cathode: All cathodes are connected to ground, and segments light\
    \ up when driven high.\n● Common Anode: All anodes are connected to power, and\
    \ segments light up when driven low.\n\n### Syntax Table\n| Serial No | Topic\
    \ | Syntax | Simple Example |\n| :--- | :--- | :--- | :--- |\n| 1 | Configure\
    \ GPIO as Output | `GPIOx->MODER |= (1 << pin*2);` | |\n| 2 | Set Segment High\
    \ (Anode) | `GPIOx->BSRR = (1 << pin);` | `GPIOB->BSRR = (1 << 0);` |\n| 3 | Set\
    \ Segment Low (Cathode) | `GPIOx->BSRR = (1 << (pin + 16));` | `GPIOB->BSRR =\
    \ (1 << (0 + 16));` |\n| 4 | Delay Function | `delay(time);` | `delay(500);` |\n\
    \n---\n\n## Detailed Breakdown for Each Command\n\n### 1. Configure GPIO as Output\n\
    \n#### What is Configure GPIO as Output\nConfiguring a `GPIO` pin as output allows\
    \ the microcontroller to drive the pin high or low, controlling each segment of\
    \ the display.\n\n#### Use Purpose\n● Control Display Segments: Sets `GPIO` pins\
    \ as outputs to manage individual segments.\n● Manage LED Power: Ensures that\
    \ each segment is properly driven.\n\n#### Syntax\n```c\nGPIOx->MODER |= (1 <<\
    \ (pin * 2));\n```\n\n#### Syntax Explanation\n● `GPIOx`: `GPIO` port controlling\
    \ the display (e.g., `GPIOB`).\n● `MODER`: `GPIO` Mode Register where each pin’s\
    \ mode is configured.\n● `pin * 2`: Shifts to the correct bits to configure the\
    \ pin as output.\n\n#### Simple Code Example\n```c\nGPIOB->MODER |= (1 << (0 *\
    \ 2)); // Set pin 0 of GPIOB as output\n```\n\n#### Code Example Explanation\n\
    ● Configures pin 0 of `GPIOB` as an output, allowing control over one of the segments\
    \ in the display.\n\n#### Notes\nEnsure each `GPIO` pin connected to a segment\
    \ is configured as output.\n\n#### Warnings\nIncorrect configuration may prevent\
    \ the microcontroller from driving the display.\n\n---\n\n### 2. Set Segment High\
    \ (Common Cathode)\n\n#### What is Set Segment High (Common Cathode)\nSetting\
    \ a `GPIO` pin high allows current to flow through the corresponding segment,\
    \ lighting it up if the display is common cathode.\n\n#### Use Purpose\n● Light\
    \ Up Segment: Turns on the specified segment for number display.\n\n#### Syntax\n\
    ```c\nGPIOx->BSRR = (1 << pin);\n```\n\n#### Syntax Explanation\n● `GPIOx`: `GPIO`\
    \ port controlling the segment.\n● `BSRR`: Bit Set/Reset Register to control pin\
    \ state.\n● `(1 << pin)`: Sets the pin high.\n\n#### Simple Code Example\n```c\n\
    GPIOB->BSRR = (1 << 0); // Turn on segment connected to pin 0\n```\n\n#### Code\
    \ Example Explanation\n● Turns on the segment connected to pin 0 of `GPIOB`, useful\
    \ for lighting up specific segments to form numbers.\n\n#### Notes\nFor common\
    \ anode displays, set the segment low instead.\n\n#### Warnings\nVerify display\
    \ type (common anode vs. cathode) to ensure correct control logic.\n\n---\n\n\
    ### 3. Set Segment Low (Common Anode)\n\n#### What is Set Segment Low (Common\
    \ Anode)\nFor a common anode display, setting a `GPIO` pin low allows current\
    \ to flow, lighting up the segment. This is opposite to common cathode control.\n\
    \n#### Use Purpose\n● Activate Segment: Enables the segment for number display\
    \ on common anode.\n\n#### Syntax\n```c\nGPIOx->BSRR = (1 << (pin + 16));\n```\n\
    \n#### Syntax Explanation\n● `GPIOx`: `GPIO` port controlling the segment.\n●\
    \ `BSRR`: Bit Set/Reset Register.\n● `(pin + 16)`: Sets the pin low.\n\n#### Simple\
    \ Code Example\n```c\nGPIOB->BSRR = (1 << (0 + 16));\n```\n\n#### Code Example\
    \ Explanation\n● Sets pin 0 of `GPIOB` low.\n\n#### Notes\nNone.\n\n#### Warnings\n\
    Ensure logic matches the display type.\n\n---\n\n### 4. Delay Function\n\n####\
    \ What is Delay Function\nA `delay` function pauses execution for a specified\
    \ `time`, useful for multiplexing.\n\n#### Use Purpose\n● Timing Control: Creates\
    \ a pause between digit changes.\n\n#### Syntax\n```c\ndelay(time);\n```\n\n####\
    \ Syntax Explanation\n● `delay`: Function that halts execution for `time`.\n●\
    \ `time`: Duration in milliseconds.\n\n#### Simple Code Example\n```c\ndelay(500);\n\
