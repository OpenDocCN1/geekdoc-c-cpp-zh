    \ result, as subtracting too much can cause underflow.\n\n***\n\n## 3. Multiplication\
    \ Assignment (*=)\n\n### What is Multiplication Assignment\n\nThe multiplication\
    \ assignment operator `*=` multiplies a variable by a value and assigns the result\
    \ back to the variable.\n\n### Use Purpose\n\n- Scale values by adjusting values\
    \ by a scaling factor.\n"
  raw: '● Invert Conditions: Used to reverse a condition, especially for negating
    flags or states.


    ●      Toggle Logic: Helps in conditions where the opposite state is needed.


    Syntax


    if  (!a)  {


    // Code to execute if a is false


    }


    Syntax Explanation


    ●      if: Starts the conditional statement.


    ● !a: Reverses the boolean value of a, so if a is  true,  !a becomes  false.


    Simple Code Example


    if  (!buttonPressed)  {


    startMotor();


    }


    Code Example Explanation


    ● If  buttonPressed is  false, the  startMotor() function is called. This demonstrates
    using ! to invert the  buttonPressed condition.


    Notes


    Logical NOT (!) is particularly useful for flags or boolean variables, where !
    can simplify conditions.


    Warnings


    Use ! carefully, as negating complex expressions can make code less readable.


    * * *


    Relevant Project Section


    Project Name


    Emergency System Control with Boolean Logic


    Project Goal


    Create an emergency system that activates an alarm and shuts down equipment if
    certain safety conditions are violated. The system uses boolean logic to check
    multiple safety parameters.


    Requirement Components


    ●      ARM Microcontroller (e.g., STM32)


    ●      Temperature sensor connected to an ADC pin


    ●      Button connected to a digital input pin


    ●      LED for alarm indication


    Component Connection Table


    | Component | Microcontroller Pin | Additional Notes |


    | Temperature Sensor | ADC Input Pin (e.g., PA0) | Provides analog temperature
    input |


    | Button | Digital Input Pin (e.g., PC1) | Detects manual override |


    | LED | Digital Output Pin (e.g., PC3) | Indicates alarm state |


    Connection Analysis


    The temperature sensor monitors system temperature, while a button provides a
    manual override for emergency shutdown. Boolean operators combine conditions to
    check for excessive temperature, button press, or both to trigger the alarm and
    shut down equipment.


    Program Software Setup


    1.  Create a new project in STM32CubeIDE or Keil uVision.


    2.  Configure ADC for temperature sensor input.


    3.  Configure digital input for button and output for alarm LED.


    Project Code


    #include  "stm32f4xx.h" // Device-specific header for STM32


    void configureADC()  {


    RCC->APB2ENR |= RCC_APB2ENR_ADC1EN;  // Enable ADC1 clock


    ADC1->CR2 |= ADC_CR2_ADON;           // Enable ADC1


    }


    void configureLEDandButton()  {


    RCC->AHB1ENR |= RCC_AHB1ENR_GPIOCEN;  // Enable GPIOC clock


    GPIOC->MODER |=  (1  <<  6);            // Set PC3 as output (LED)


    GPIOC->MODER &=  ~(3  <<  2);           // Set PC1 as input (button)


    }


    uint16_t readADC()  {


    ADC1->CR2 |= ADC_CR2_SWSTART;        // Start ADC conversion


    while  (!(ADC1->SR & ADC_SR_EOC));    // Wait for conversion complete


    return ADC1->DR;                     // Read ADC result


    }


    int main()  {


    configureADC();          // Set up ADC


    configureLEDandButton();  // Set up LED and button


    uint16_t temperature;


    while  (1)  {


    temperature = readADC();  // Read temperature sensor


    // Check if temperature exceeds threshold OR button is pressed


    if  (temperature >  200  ||  !(GPIOC->IDR &  (1  <<  1)))  {


    GPIOC->BSRR =  (1  <<  3);  // Turn on LED (alarm)


    shutdownEquipment();     // Custom function to stop equipment


    }  else  {


    GPIOC->BSRR =  (1  <<  (3  +  16));  // Turn off LED


    }


    }


    }


    Save and Run


    1.  Save, compile, and upload the code to the ARM microcontroller.


    2.  Observe the alarm LED turning on if the temperature exceeds the threshold
    or the button is pressed.


    Check Output


    ● The LED should turn on if either the temperature exceeds the critical threshold
    or if the manual override button is pressed, demonstrating the effective use of
    boolean operators in an emergency system.


    ## Compound Operators


    Chapter Overview


    Compound operators are shorthand operators in C that combine an arithmetic operation
    with an assignment. They help simplify code and make expressions more concise.
    In ARM microcontroller programming, compound operators are widely used for incrementing
    counters, updating variables, and handling data in an efficient way. This chapter
    will cover the syntax, usage, and application of compound operators, including  +=,  -=,  *=,  /=,
    and  %=.


    Chapter Goal


    ●      Understand the function and syntax of compound operators.


    ●      Learn how to use compound operators to simplify arithmetic assignments.


    ●      Implement a project demonstrating compound operators in embedded programming.


    Rules


    ● Use Compound Operators When Possible: They make code shorter and often more
    readable.


    ● Watch for Overflow: Ensure the variables have adequate range for the operation’s
    result.


    ● Prefer Compound Operators in Loops: They are particularly effective for updating
    counters or accumulators.


    ● Be Mindful of Operator Precedence: Compound operators have precedence, so use
    parentheses if combining multiple operators.


    Brief Introduction to Compound Operators


    Compound operators are shorthand for performing an arithmetic operation and assigning
    the result to a variable in one step. For example,  x += 5 is equivalent to  x
    = x + 5. These operators simplify code by reducing redundancy, especially when
    working with counters, accumulators, and loop variables.


    Syntax Table


    | Serial No | Topic | Syntax | Simple Example |


    | 1 | Addition Assignment | a += b | x += 5; |


    | 2 | Subtraction Assignment | a -= b | y -= 3; |


    | 3 | Multiplication Assignment | a *= b | z *= 2; |


    | 4 | Division Assignment | a /= b | result /= 4; |


    | 5 | Modulus Assignment | a %= b | value %= 10; |


    * * *


    Detailed Breakdown for Each Command


    1\. Addition Assignment (+=)


    What is Addition Assignment


    The addition assignment operator (+=) adds a value to a variable and assigns the
    result to that variable. It’s often used in loops, counters, and cumulative sums.


    Use Purpose


    ● Accumulate Values: Used to add and update a variable’s value in one step.


    ●      Efficient Counters: Simplifies incrementing counters by specific values.


    Syntax


    a += b;


    Syntax Explanation


    ●      a: The variable to be updated.


    ●      b: The value to add to a.


    ●      +=: Adds b to a and assigns the result to a.


    Simple Code Example


    int total =  0;


    total +=  5; // Equivalent to total = total + 5


    Code Example Explanation


    ● Adds 5 to  total, updating  total to reflect the new value. This compound operation
    simplifies the code, especially in loops or cumulative calculations.


    Notes


    Addition assignment is commonly used for accumulating values in iterative processes.


    Warnings


    Watch for overflow with integer types, as repeated addition can exceed the variable’s
    range.


    * * *


    2\. Subtraction Assignment (-=)


    What is Subtraction Assignment


    The subtraction assignment operator (-=) subtracts a value from a variable and
    assigns the result back to that variable. It’s useful for decrementing counters
    or reversing cumulative operations.


    Use Purpose


    ●      Decrease Values: Reduces a variable’s value in one concise operation.


    ●      Control Counters: Frequently used in loops that count down.


    Syntax


    a -= b;


    Syntax Explanation


    ●      a: The variable to be updated.


    ●      b: The value to subtract from a.


    ●      -=: Subtracts b from a and assigns the result to a.


    Simple Code Example


    int countdown =  10;


    countdown -=  2; // Equivalent to countdown = countdown - 2


    Code Example Explanation


    ● Subtracts 2 from  countdown, updating its value. This compound operation is
    useful for controlling countdowns or reducing values.


    Notes


    Subtraction assignment simplifies decrement operations, especially in loops.


    Warnings


    Ensure the variable’s range accommodates the result, as subtracting too much can
    cause underflow.


    * * *


    3\. Multiplication Assignment (*=)


    What is Multiplication Assignment


    The multiplication assignment operator (*=) multiplies a variable by a value and
    assigns the result back to the variable. It’s useful for scaling values, adjusting
    gains, or applying factors.


    Use Purpose


    ●      Scale Values: Used for adjusting values by a scaling factor.'
