    \ Syntax Table\n\n| Serial No | Topic | Syntax |\n| :--- | :--- | :--- |\n| 1\
    \ | Addition Assignment | `a += 5` |\n| 2 | Subtraction Assignment | `a -= 3`\
    \ |\n| 3 | Multiplication Assignment | `a *= 2` |\n| 4 | Division Assignment |\
    \ `a /= 4` |\n| 5 | Modulus Assignment | `a %= 10` |\n\n***\n\n## 1. Addition\
    \ Assignment (+=)\n\n### What is Addition Assignment\n\nThe addition assignment\
    \ operator `+=` adds a value to a variable and assigns the result to that variable.\n\
    \n### Use Purpose\n\n- Accumulate values to update a variable in one step.\n\n\
    ### Syntax\n\n```c\na += b\n```\n\n### Syntax Explanation\n\n- `a`: The variable\
    \ to be updated.\n- `b`: The value to add to `a`.\n- `+=`: Adds `b` to `a` and\
    \ assigns the result to `a`.\n\n### Simple Code Example\n\n```c\nint total = 0;\n\
    total += 5; // Equivalent to total + 5\n```\n\n### Code Example Explanation\n\n\
    - Adds 5 to `total`, updating its value.\n\n### Notes\n\nAddition assignment is\
    \ commonly used for accumulating values.\n\n### Warnings\n\nWatch for overflow,\
    \ as repeated addition can exceed the variable range.\n\n***\n\n## 2. Subtraction\
    \ Assignment (--=)\n\n### What is Subtraction Assignment\n\nThe subtraction assignment\
    \ operator `-=` subtracts a value from a variable and assigns the result to that\
    \ variable.\n\n### Use Purpose\n\n- Decrease values to reduce a variable’s value\
    \ in one operation.\n\n### Syntax\n\n```c\na -= b\n```\n\n### Syntax Explanation\n\
    \n- `a`: The variable to be updated.\n- `b`: The value to subtract from `a`.\n\
    - `-=`: Subtracts `b` from `a` and assigns the result to `a`.\n\n### Simple Code\
    \ Example\n\n```c\nint countdown = 10;\ncountdown -= 2; // Equivalent to countdown\
    \ - 2\n```\n\n### Code Example Explanation\n\n- Subtracts 2 from `countdown`,\
    \ updating its value.\n\n### Notes\n\nSubtraction assignment simplifies decrement\
