    ## 7 Segment


    Chapter Overview


    7-segment displays are widely used to display numerical data in embedded systems.
    These displays can represent numbers and some characters by lighting up specific
    segments, making them useful for applications like clocks, counters, and measurement
    displays. This chapter explores how to interface a 7-segment display with an ARM
    microcontroller, focusing on controlling individual segments to display different
    numbers.


    Chapter Goal


    ●      Understand the structure and working principles of 7-segment displays.


    ● Learn how to interface and control a 7-segment display using GPIO pins on an
    ARM microcontroller.


    ●      Implement a project that displays numbers on a 7-segment display.


    Rules


    ● Check Display Type: Identify whether the 7-segment display is common anode or
    common cathode, as it affects the segment control logic.


    ● Use GPIO Pins Efficiently: Allocate GPIO pins specifically for segments, ensuring
    they can drive sufficient current.


    ● Avoid Excessive Current: Use current-limiting resistors to protect segments
    and prevent excessive current draw.


    ● Use Delays for Multiplexing: For multiple digits, use delays or timer-based
    multiplexing to display numbers sequentially.


    Brief Introduction to 7-Segment Display


    A 7-segment display consists of seven LEDs arranged in a figure-eight pattern,
    each labeled from ''a'' to ''g.'' Lighting specific segments allows numbers from
    0 to 9 to be displayed. ARM microcontrollers can control these segments using
    GPIO pins, where each pin connects to an individual segment. The two main types
    of displays are:


    ● Common Cathode: All cathodes are connected to ground, and segments light up
    when driven high.


    ● Common Anode: All anodes are connected to power, and segments light up when
    driven low.


    Syntax Table


    | Serial No | Topic | Syntax | Simple Example |


    | 1 | Configure GPIO as Output | `GPIOx->MODER | = (1 << pin*2);` |


    | 2 | Set Segment High (Anode) | GPIOx->BSRR = (1 << pin); | GPIOB->BSRR = (1
    << 0); |


    | 3 | Set Segment Low (Cathode) | GPIOx->BSRR = (1 << (pin + 16)); | GPIOB->BSRR
    = (1 << (0 + 16)); |


    | 4 | Delay Function | delay(time); | delay(500); |


    * * *


    Detailed Breakdown for Each Command


    1\. Configure GPIO as Output


    What is Configure GPIO as Output


    Configuring a GPIO pin as output allows the microcontroller to drive the pin high
    or low, controlling each segment of the display.


    Use Purpose


    ● Control Display Segments: Sets GPIO pins as outputs to manage individual segments.


    ●      Manage LED Power: Ensures that each segment is properly driven.


    Syntax


    GPIOx->MODER |=  (1  <<  (pin *  2));


    Syntax Explanation


    ●      GPIOx: GPIO port controlling the display (e.g.,  GPIOB).


    ●      MODER: GPIO Mode Register where each pin’s mode is configured.


    ● pin * 2: Shifts to the correct bits to configure the pin as output.


    Simple Code Example


    GPIOB->MODER |=  (1  <<  (0  *  2)); // Set pin 0 of GPIOB as output


    Code Example Explanation


    ● Configures pin 0 of GPIOB as an output, allowing control over one of the segments
    in the display.


    Notes


    Ensure each GPIO pin connected to a segment is configured as output.


    Warnings


    Incorrect configuration may prevent the microcontroller from driving the display.


    * * *


    2\. Set Segment High (Common Cathode)


    What is Set Segment High (Common Cathode)


    Setting a GPIO pin high allows current to flow through the corresponding segment,
    lighting it up if the display is common cathode.


    Use Purpose


    ●      Light Up Segment: Turns on the specified segment for number display.


    Syntax


    GPIOx->BSRR =  (1  << pin);


    Syntax Explanation


    ●      GPIOx: GPIO port controlling the segment.


    ●      BSRR: Bit Set/Reset Register to control pin state.


    ●      (1 << pin): Sets the pin high.


    Simple Code Example


    GPIOB->BSRR =  (1  <<  0); // Turn on segment connected to pin 0


    Code Example Explanation


    ● Turns on the segment connected to pin 0 of GPIOB, useful for lighting up specific
    segments to form numbers.


    Notes


    For common anode displays, set the segment low instead.


    Warnings


    Verify display type (common anode vs. cathode) to ensure correct control logic.


    * * *


    3\. Set Segment Low (Common Anode)


    What is Set Segment Low (Common Anode)


    For a common anode display, setting a GPIO pin low allows current to flow, lighting
    up the segment. This is opposite to common cathode control.


    Use Purpose


    ● Activate Segment: Enables the segment for number display on common anode displays.


    Syntax


    GPIOx->BSRR =  (1  <<  (pin +  16));


    Syntax Explanation


    ●      GPIOx: GPIO port controlling the segment.


    ●      BSRR: Bit Set/Reset Register.


    ●      (pin + 16): Shifts the bit to set the pin low.


    Simple Code Example


    GPIOB->BSRR =  (1  <<  (0  +  16)); // Turn on segment connected to pin 0 (anode)


    Code Example Explanation


    ● Sets pin 0 low on GPIOB, activating the segment if using a common anode display.


    Notes


    Ensure all connected GPIO pins are configured as output to avoid conflicts.


    Warnings


    Misconfiguration may prevent correct segment activation.


    * * *


    4\. Delay Function


    What is Delay Function


    A delay function pauses execution for a specified time, useful for creating timing
    in multiplexed displays or controlling refresh rates.


    Use Purpose


    ●      Timing Control: Creates a delay between digit changes for multiplexing.


    ●      LED Persistence: Ensures the display holds each digit briefly.


    Syntax


    delay(time);


    Syntax Explanation


    ●      delay: Function that halts execution for  time milliseconds.


    ●      time: Duration in milliseconds.


    Simple Code Example


    delay(500); // 500 ms delay


    Code Example Explanation


    ● Adds a 500 ms delay, creating a visible pause between display updates.


    Notes


    For long delays, use timer peripherals instead to free CPU resources.


    Warnings


    Avoid excessive delays in critical applications as it may affect responsiveness.


    * * *


    Relevant Project Section


    Project Name


    Displaying Numbers on a 7-Segment Display


    Project Goal


    Display numbers from 0 to 9 on a 7-segment display by controlling each segment
    through GPIO. This project illustrates basic number representation and LED control
    on a 7-segment display.


    Requirement Components


    ●      ARM Microcontroller (e.g., STM32)


    ●      7-segment display (common anode or common cathode)


    ●      Current-limiting resistors for each segment (typically 220Ω)


    ●      Jumper wires and breadboard


    Component Connection Table


    | Component | Microcontroller Pin | Additional Notes |


    | 7-Segment Display (a-g) | GPIO Pins (e.g., PB0-PB6) | One GPIO per segment |


    | 7-Segment Common Pin | Ground (cathode) or Vcc (anode) | Depends on display
    type |


    Connection Analysis


    Each segment of the 7-segment display is connected to a GPIO pin on the microcontroller.
    Current-limiting resistors protect each segment, and the common pin is connected
    to ground (for cathode displays) or Vcc (for anode displays). Each number is displayed
    by lighting up the appropriate segments.


    Program Software Setup


    1.  Create a new project in STM32CubeIDE or Keil uVision.


    2.  Configure GPIO pins for each segment as output.


    3.  Implement code to control segments and display numbers from 0 to 9.


    Project Code


