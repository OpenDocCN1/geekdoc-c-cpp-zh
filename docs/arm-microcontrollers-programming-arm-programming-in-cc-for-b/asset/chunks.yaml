    \n### 简单代码示例\n```\nwhile (sensorValue < 50) {\n    adjustOutput();\n}\n```\n\n\
    ### 代码示例说明\n- 只要 `sensorValue` 小于 50，`adjustOutput()` 将继续运行。当 `sensorValue` 达到\
    \ 50 或更高时，循环退出。\n\n### 注意事项\n`while` 循环适用于监控根据实时数据变化的条件。\n\n### 警告\n通过确保条件最终变为假，或者通过包含一个\
    \ `break` 条件来避免死循环。\n\n***\n\n## 4. Do-While 循环 (Do-While Loop)\n\n### 什么是 Do-While\
    \ 循环\n`do-while` 循环至少执行一次代码块，只要条件为真，就会重复执行。它适用于无论条件如何都需要初始执行的任务。\n\n### 用途\n-\
    \ **保证首次执行**：确保即使条件为假，代码也至少运行一次。\n- **基于条件的重复**：适用于具有变量条件的重复性任务。\n\n### 语法\n```\n\
    do {\n    // 要执行的代码\n} while (condition);\n```\n\n### 语法说明\n- `do`: 通过执行一次代码块开始循环。\n\
    - `condition`: 在每次迭代后进行检查，以决定循环是否继续。\n\n### 简单代码示例\n```\ndo {\n    calibrateSensor();\n\
    } while (sensorStatus != READY);\n```\n\n### 代码示例说明\n- `calibrateSensor()` 函数至少运行一次，并持续运行直到\
    \ `sensorStatus` 等于 `READY`。\n\n### 注意事项\n`do-while` 循环保证即使初始条件为假，代码块也会运行一次。\n\
    \n### 警告\n确保循环具有退出条件，以防止无限重复。\n\n***\n\n## 5. Switch 语句 (Switch Statement)\n\n\
    ### 什么是 Switch 语句\n`switch` 语句允许程序根据变量的值执行不同的代码，它是多条件检查的理想选择。\n\n### 用途\n- **高效的多分支处理**：降低具有多个选项代码的复杂性。\n\
    - **If-Else 链的替代**：为处理多个不同值提供更具可读性的结构。\n\n### 语法\n```cpp\nswitch (variable) {\n\
    \    case value1:\n        // case value1 的代码\n        break;\n    case value2:\n\
    \        // case value2 的代码\n        break;\n    default:\n        // 所有其他情况的代码\n\
    \        break;\n}\n```\n\n### 语法说明\n- `switch`: 开始多分支控制结构。\n- `variable`: 被 `switch`\
    \ 求值的表达式或变量。\n- `case`: 指定 `variable` 的每种可能值，如果匹配则执行相应的代码。\n- `break`: 在执行一个 case\
    \ 后退出 `switch` 以防止“穿透”（fall-through）。\n\n### 简单代码示例\n```\nswitch (buttonState)\
    \ {\n    case 1:\n        LED_On();\n        break;\n    case 2:\n        LED_Off();\n\
    \        break;\n    default:\n        LED_Toggle();\n        break;\n}\n```\n\
    \n### 代码示例说明\n- 根据 `buttonState`，`switch` 会切换 LED、开启 LED 或关闭 LED。`break` 语句确保每个\
    \ case 独立执行。\n\n### 注意事项\n`switch` 语句仅适用于整数、字符或枚举类型。\n\n### 警告\n始终包含一个 `default`\
    \ 分支，以处理意外值并防止未定义行为。\n\n***\n\n## 相关项目章节 (Relevant Project Section)\n\n### 项目名称\n\
    温度控控风扇系统\n\n### 项目目标\n使用控制结构根据传感器的温度读数来管理风扇的操作。风扇速度根据温度范围进行调整，如果温度超过阈值，则触发紧急停止。\n\
    \n### 需求组件\n- `ARM` 微控制器（例如 `STM32`）\n- 连接到 `ADC` 引脚的温度传感器\n- 连接到 `PWM` 输出引脚的风扇\n\
    - 用于紧急指示的 `LED`\n\n### 组件连接表\n| 组件 | 微控制器引脚 | 备注 |\n| :--- | :--- | :--- |\n|\
    \ 温度传感器 | `ADC` 输入引脚（例如 `PA0`） | 提供模拟温度输入 |\n| 风扇 | `PWM` 输出引脚（例如 `PB4`） | 控制风扇速度\
    \ |\n| LED | 数字输出引脚（例如 `PC3`） | 表示紧急状态 |\n\n### 连接分析\n温度传感器向微控制器提供实时读数，微控制器根据温度范围使用\
    \ `PWM` 风扇速度。如果温度超过安全阈值，`LED` 点亮，指示紧急状态。\n\n### 程序软件设置\n1. 在 `STM32CubeIDE` 或\
    \ `Keil uVision` 中创建一个新项目。\n2. 配置 `ADC` 以读取温度传感器数据。\n3. 设置 `PWM` 以控制风扇，并将 `LED`\
    \ 配置为数字输出。\n\n### 项目代码\n```cpp\n#include \"stm32f4xx.h\" // STM32 设备特定头文件\n\n\
    void configureADC() {\n    RCC->APB2ENR |= RCC_APB2ENR_ADC1EN;  // 开启 ADC1 时钟\n\
    \    ADC1->CR2 |= ADC_CR2_ADON;           // 启用 ADC1\n}\n\nvoid configurePWM()\
    \ {\n    RCC->APB1ENR |= RCC_APB1ENR_TIM3EN;  // 开启 TIM3 时钟\n    RCC->APB2ENR\
    \ |= RCC_APB2ENR_GPIOCEN; // 开启 GPIOC 时钟\n    GPIOC->MODER |= (2 << (2 * 3));\
    \      // 设置 PC3 为输出\n    TIM3->CCMR1 |= (6 << 4);            // 设置 PWM 模式 1\n\
    \    TIM3->CCR1 = 500;                   // 设置空比\n    TIM3->CR1 |= 1;        \
    \              // 开启计数器\n}\n\nint main() {\n    uint16_t temperature;\n    configureADC();\n\
    \    configurePWM();\n\n    while (1) {\n        // ADC 读取逻辑\n        ADC1->CR2\
    \ |= ADC_CR2_SWSTART;\n        while (!(ADC1->SR & ADC_SR_EOC));\n        temperature\
    \ = ADC1->DR;\n\n        switch (temperature) {\n            case 1:\n       \
    \         GPIOC->BSRR = (1 << 3); // LED 开启\n                break;\n        \
    \    case 2:\n                GPIOC->BSRR = (1 << 19); // LED 关闭\n           \
    \     break;\n            default:\n                // 默认逻辑\n                break;\n\
    \        }\n    }\n}\n```\n\n"
- fmt: "\n# 1. Addition\n\nThe addition operator `+` adds two values, storing the\
    \ sum as a result. It is widely used in embedded programming for accumulating\
    \ values, updating counters, or combining data.\n\n## Use Purpose\n- **Accumulate\
    \ Values**: Used to add sensor data, counts, or other cumulative data points.\n\
    - **Calculate Sums**: Essential for arithmetic calculations where sums are needed.\n\
    \n## Syntax\n```c\nresult = a + b;\n```\n\n## Syntax Explanation\n- `result`:\
    \ The variable storing the result of the addition.\n- `a` and `b`: The operands\
    \ to be added, which can be variables or constants.\n\n## Simple Code Example\n\
    ```c\nint total = 0;\nint newValue = 5;\ntotal = total + newValue;\n```\n\n##\
    \ Code Example Explanation\n- Adds `newValue` to `total`, updating the `total`\
    \ variable. This approach is often used in loops to accumulate values.\n\n## Notes\n\
    Addition is an efficient operator, but in embedded systems, ensure the variable\
    \ has enough range to store the result.\n\n## Warnings\nInteger overflow may occur\
    \ if the sum exceeds the variable's storage limit.\n\n***\n\n# 2. Subtraction\n\
    \n## What is Subtraction\nThe subtraction operator `-` calculates the difference\
    \ between two values. It is commonly used in embedded applications to determine\
    \ changes or offsets in sensor values or counters.\n\n## Use Purpose\n- **Calculate\
    \ Differences**: Used to find the difference between two readings, such as target\
    \ and actual positions.\n- **Adjust Counts**: Useful for decrementing counters\
    \ or adjusting values.\n\n## Syntax\n```c\nresult = a - b;\n```\n\n## Syntax Explanation\n\
    - `result`: Stores the difference between `a` and `b`.\n- `a` and `b`: The values\
    \ to be subtracted.\n\n## Simple Code Example\n```c\nint difference = 10 - 3;\n\
    ```\n\n## Code Example Explanation\n- The result of `10 - 3` is stored in `difference`,\
    \ showing how subtraction can calculate the offset.\n\n## Notes\nSubtraction can\
    \ be used with signed integers to represent negative results.\n\n## Warnings\n\
    Be mindful of underflow, especially with unsigned integers, as results can wrap\
    \ around unexpectedly.\n\n***\n\n# 3. Multiplication\n\n## What is Multiplication\n\
    The multiplication operator `*` calculates the product of two values. In embedded\
    \ applications, it is commonly used to scale values, calculate areas, or convert\
    \ units.\n\n## Use Purpose\n- **Scaling Data**: Used to amplify sensor readings\
    \ or adjust units.\n- **Mathematical Calculations**: Useful for formulas requiring\
    \ products.\n\n## Syntax\n```c\nresult = a * b;\n```\n\n## Syntax Explanation\n\
    - `result`: The variable that stores the product of `a` and `b`.\n- `a` and `b`:\
    \ The multiplicands (values being multiplied).\n\n## Simple Code Example\n```c\n\
    int area = length * width;\n```\n\n## Code Example Explanation\n- The `area` is\
    \ calculated by multiplying `length` by `width`, useful in applications like geometry\
    \ calculations.\n\n## Notes\nMultiplication is slower on microcontrollers without\
    \ hardware multiply support, so optimize usage.\n\n## Warnings\nAvoid overflow\
    \ by ensuring results fit within the variable’s data range.\n\n***\n\n# 4. Division\n\
    \n## What is Division\nThe division operator `/` divides one value by another,\
    \ returning the quotient. It’s commonly used for scaling and normalization of\
    \ sensor data.\n\n## Use Purpose\n- **Normalize Values**: Converts values into\
    \ desired units or scales.\n- **Calculate Ratios**: Useful in calculating relationships\
    \ between measurements.\n\n## Syntax\n```c\nresult = a / b;\n```\n\n## Syntax\
    \ Explanation\n- `result`: Stores the quotient of the division.\n- `a`: The dividend,\
    \ or number to be divided.\n- `b`: The divisor, or number to divide by.\n\n##\
    \ Simple Code Example\n```c\nint average = total / count;\n```\n\n## Code Example\
    \ Explanation\n- Calculates the average by dividing `total` by `count`, demonstrating\
    \ division for mean values.\n\n## Notes\nFor integer division, any remainder is\
    \ discarded. Use floating-point for decimal results.\n\n## Warnings\nDivision\
    \ by zero results in an error. Always verify that the divisor is non-zero.\n\n\
    ***\n\n# 5. Modulus (Remainder)\n\n## What is Modulus\nThe modulus operator `%`\
    \ returns the remainder of a division operation. It’s often used in embedded programming\
    \ for tasks like checking even/odd values or wrapping counters.\n\n## Use Purpose\n\
    - **Check Even/Odd**: Determine if a number is divisible by another.\n- **Manage\
    \ Wrapping**: Useful for circular buffers and periodic checks.\n\n## Syntax\n\
    ```c\nresult = a % b;\n```\n\n## Syntax Explanation\n- `result`: Stores the remainder\
    \ of `a` divided by `b`.\n- `a`: The dividend.\n- `b`: The divisor, which cannot\
    \ be zero.\n\n## Simple Code Example\n```c\nint remainder = 10 % 3; // remainder\
    \ is 1\n```\n\n## Code Example Explanation\n- `10 % 3` gives `1`, which is stored\
    \ in `remainder`. This operation is useful in cases like modular arithmetic.\n\
    \n## Notes\nModulus is typically used with integers and is not applicable to floating-point\
    \ types.\n\n## Warnings\nDivision by zero applies to modulus as well; ensure the\
    \ divisor is non-zero.\n\n***\n\n# 6. Increment\n\n## What is Increment\nThe increment\
    \ operator `++` increases a variable’s value by one. It is commonly used for counters.\n\
    \n## Use Purpose\n- **Accumulate Values**: Efficiently increments counters.\n\n\
    ## Syntax\n```c\na++;\n```\n\n## Syntax Explanation\n- `a`: The variable whose\
    \ value is being incremented.\n\n## Simple Code Example\n```c\nint total = 0;\n\
    int newValue = 5;\ntotal = total + newValue;\n```\n\n## Code Example Explanation\n\
    - Adds `newValue` to `total`, updating the `total` variable. This approach is\
    \ often used in loops to accumulate values.\n\n## Notes\nIncrement is an efficient\
    \ operation.\n\n## Warnings\nEnsure variables have enough range to avoid overflow.\n\
    \n***\n\n# 7. Decrement\n\n## What is Decrement\nThe decrement operator `--` decreases\
    \ a variable’s value by one. It is commonly used for counters.\n\n## Use Purpose\n\
    - **Adjust Counts**: Useful for decrementing counters.\n\n## Syntax\n```c\na--;\n\
    ```\n\n## Syntax Explanation\n- `a`: The variable whose value is being decremented.\n\
    \n## Simple Code Example\n```c\nint difference = 10 - 3;\n```\n\n## Code Example\
    \ Explanation\n- The result of `10 - 3` is stored in `difference`, showing how\
    \ subtraction can calculate the offset.\n\n## Notes\nSubtraction can be used with\
    \ signed integers to represent negative results.\n\n## Warnings\nBe mindful of\
    \ underflow, especially with unsigned integers.\n\n***\n\n# Relevant Project Section\n\
    \n## Project Name: Temperature Data Processing with Arithmetic Operations\n\n\
    ### Project Goal\nProcess temperature sensor data using arithmetic operations\
    \ to calculate averages, detect trends, and control an LED indicator based on\
    \ thresholds.\n\n### Requirement Components\n- ARM Microcontroller (e.g., STM32)\n\
    - Temperature sensor connected to an ADC pin\n- LED connected to a digital pin\n\
    \n### Component Connection Table\n| Component | Microcontroller Pin | Additional\
    \ Notes |\n| :--- | :--- | :--- |\n| Temperature Sensor | ADC Input Pin (e.g.,\
    \ PA0) | Analog input for readings |\n| LED | Digital Output Pin (e.g., PC3) |\
    \ Indicates status |\n\n### Connection Analysis\nThe temperature sensor provides\
    \ analog readings, which are converted to digital and processed using arithmetic\
    \ operations. The LED turns on if the average exceeds a threshold.\n\n### Program\
    \ Software Setup\n1. Create a new project in STM32IDE or Keil uVision.\n2. Configure\
    \ ADC for temperature sensor input.\n3. Configure LED as a digital output for\
    \ visual indication.\n\n### Project Code\n```c\n#include \"stm32f4xx.h\" // Device-specific\
    \ header for STM32\n\nvoid configureADC() {\n    RCC->APB2ENR |= RCC_APB2ENR_ADC1EN;\
    \ // Enable ADC1 clock\n    ADC1->CR2 |= ADC_CR2_ADON;         // Enable ADC1\n\
    }\n\nvoid configureLED() {\n    RCC->AHB1ENR |= RCC_AHB1ENR_GPIOCEN; // Enable\
    \ GPIOC clock\n    GPIOC->MODER |= (1 << 6);           // Set PC3 as output\n\
    }\n\nuint16_t readADC() {\n    ADC1->CR2 |= ADC_CR2_SWSTART; // Start ADC conversion\n\
    \    while (!(ADC1->SR & ADC_SR_EOC)); // Wait for conversion complete\n    return\
    \ ADC1->DR; // Read ADC result\n}\n\nint main() {\n    configureADC(); // Set\
    \ up ADC\n}\n```\n"
