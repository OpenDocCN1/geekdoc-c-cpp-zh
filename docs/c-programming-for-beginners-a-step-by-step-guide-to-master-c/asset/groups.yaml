    ### Numeric constant


    Numeric constant consists of digits. It required minimum size of 2 bytes and max
    4 bytes. It may be positive or negative but default sign is always positive. No
    comma or space is allowed within numeric constant and it must have at least one
    digit. The allowable range for integer constants is -32768 to 32767. Truly speaking
    the range depends upon compiler. For 16-bit compiler like Turbo C or C++ the range
    is even greater. For 32-bit compiler what range of integer constant is larger.
    Integer constants are whole number which have no decimal point. Types of integer
    constants are:

    - Decimal constant: 0-9 (base 10)

    - Octal constant: 0-7 (base 8)

    - Hexadecimal constant: 0-9, A-F (base 16)


    Decimal constant first digit should not be zero unlike octal constant first digit
    must be zero (as 07) and in hexadecimal constant first digit should be 0x or 0X
    (such as 0x24, By default type of integer constant is integer but if the value
    of integer constant exceeds range then value represented by integer type is taken
    to be unsigned integer or long integer by suffix L and u/U.


    **Real constant** is also called floating point constant. To construct real constant
    we must follow the rule:

    - real constant must have at least one digit.

    - It must have a decimal point.

    - It could be either positive or negative.

    - Default sign is positive.

    - No commas or blanks are allowed within real constant. Ex.: 32.34, 42.0


    To express small/large real constant exponent (scientific) form is used where
    number is written in mantissa and exponent separated by e/E. Exponent can be positive
    or negative integer but mantissa can be real/integer type, for example 3.6*10^5=3.6e+5.
    By default type of floating point constant is double, it can also be explicitly
    defined by suffix f/F.


