    # INTRODUCTION


    C is a programming language developed at AT & T’s Bell Laboratories of USA in
    1972. It was designed and written by a man named Dennis Ritchie. In the late seventies
    C began to replace the more familiar languages of that time like PL/I, ALGOL,
    etc.


    ANSI C standard emerged in the early 1980s, this book was split into two titles:
    The original was still called Programming in C, and the title that covered ANSI
    C was called Programming in ANSI C. This was done because it took several years
    for the compiler vendors to release their ANSI C compilers and for them to become
    ubiquitous. It was initially designed for programming UNIX operating system. Now
    the software tool as well as the C compiler is written in C. Major parts of popular
    operating systems like Windows, UNIX, Linux is still written in C. This is because
    even today when it comes to performance (speed of execution) nothing beats C.
    Moreover, if one is to extend the operating system to work with new devices one
    needs to write device driver programs. These programs are exclusively written
    in C. It seems so popular is because it is reliable, simple and easy to use. often
    heard today is – “C has been already superseded by languages like C++, C# and
    Java.


    There is a close analogy between learning English language and learning C language.
    The classical method of learning English is to first learn the alphabets used
    in the language, then learn to combine these alphabets to form words, which in
    turn are combined to form sentences and sentences are combined to form paragraphs.
    Learning C is similar and easier. Instead of straight-away learning how to write
    programs, we must first know what alphabets, numbers and special symbols are used
    in C, then using them constants, variables and keywords are constructed, and finally
    how are these combined to form an instruction. A group of instructions would be
    combined later on to form a program. So


    ![](img/7e3f35612983959bbf2e3b551f6c2979_9_0.png)


    a computer program is just a collection of the instructions necessary to solve
    a specific problem. The basic operations of a computer system form what is known
    as the computer’s instruction set. And the approach or method that is used to
    solve the problem is known as an algorithm.


    So for as programming language concern these are of two types.


    1) Low level language

    2) High level language


    # Low level language:


    Low level languages are machine level and assembly level language. In machine
    level language computer only understand digital numbers i.e. in the form of 0
    and 1. So, instruction given to the computer is in the form of binary digit, which
    is difficult to implement instruction in binary code. This type of program is
    not portable, difficult to maintain and also error prone. The assembly language
    is on the other hand modified version of machine level language. Where instructions
    are given in English like word as ADD, SUM, MOV etc. It is easy to write and understand
    but not understand by the machine. So the translator used here is assembler to
    translate into machine level. Although language is bit easier, programmer has
    to know low level details related to low level language. In the assembly level
    language the data are stored in the computer register, which varies for different
    computer. Hence it is not portable.


    # High level language:


    These languages are machine independent, means it is portable. The language in
    this category is Pascal, Cobol, Fortran etc. High level languages are understood
    by the machine. So it need to translate by the translator into machine level.
    A translator is software which is used to translate high level language as well
    as low level language to machine level language.


    Three types of translator are there:


    # Compiler


    # Interpreter


    # Assembler


    Compiler and interpreter are used to convert the high level language into machine
    level language. The program written in high level language is known as source
    program and the corresponding machine level language program is called as object
    program. Both compiler and interpreter perform the same task but there working
    is different. Compiler read the program at a time and searches the error. If program
    is error free then it is converted into program. Whereas interpreter read only
    one line of source code and convert to object code. hence take more time.


    # Integrated Development Environments


    The process of editing, compiling, running, and debugging programs is often managed
    by a single application known as Integrated Development Environment, or IDE for
    short. An IDE is a windows-based program that allows us to easily manage large
    software programs, edit files in windows, and compile, run, and debug programs.
    On Mac OS X, CodeWarrior and Xcode are two IDEs that are used by many programmers.
    Under Windows, Microsoft Visual Studio is a good example of a popular IDE. Eclipse
    is a popular IDE for developing applications under Linux.


    # STRUCTURE OF C LANGUAGE PROGRAM


    - 1 ) Comment line

    - 2) Preprocessor directive

    - 3 ) Global variable

    - 4) main function( )


    {

    Local variables; Statements;

    }

    User defined function

    }


    # Comment line


    It indicates the purpose of the program. It is represented as


    ```

    /*................ του....*/```


    Comment line is used for increasing the readability of the program. It is useful
    in explaining the program and generally used for documentation. It is enclosed
    within the delimiters. Comment line can be single or multiple line but should
    not be nested. It can be anywhere in the program except inside string constant
    & character constant.


    # Preprocessor Directive:


    #include<stdio.h> tells the compiler to include information about the standard
    input/output library. It is also used in symbolic constant such as #define PI
    3.14(value). The stdio.h (standard input output header file) contains definition
    &declaration of system defined function as printf( ), scanf( ), pow( ) etc. Generally
    printf() function used to display and scanf() function used to read value


    # Global Declaration:


    This is the section where variable are declared globally so that it can be access
    by all the functions used in the program. And it is generally declared outside
    the function: main()


    It is the user defined function and every function has one main() function from
    where actually program is started and it is encloses within the pair of curly
    braces.

