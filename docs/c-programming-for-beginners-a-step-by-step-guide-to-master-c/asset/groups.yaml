    # 注释行


    它指示程序的目的。它的表示形式为


    ```

    /*....................*/


    注释行用于提高程序的可读性。它对于解释程序很有用，通常用于文档说明。它封装在界定符之间。注释可以是单行或多行，但不应嵌套。它可以出现在程序的任何地方，字符串常量和字符常量除外。


