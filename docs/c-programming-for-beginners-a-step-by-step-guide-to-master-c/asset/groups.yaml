    # 引言


    C 语言是 1972 年在美国 AT & T 公司的贝尔实验室开发的一种编程语言。它由一位名叫丹尼斯·里奇（Dennis Ritchie）的人设计并编写。20
    世纪 70 年代后期，C 开始取代 PL/I、ALGOL 等当时更熟悉的语言。


    ANSI C 标准出现在 20 世纪 80 年代初，本书分为两个标题：原版仍称为《C 语言编程》(Programming in C)，而涵盖 ANSI C
    的标题称为《ANSI C 编程》(Programming in ANSI C)。这是因为编译器供应商需要几年时间来发布他们的 ANSI C 编译器并使其变得无处不在。它最初设计用于为
    UNIX 操作系统编程。现在，软件工具以及 C 编译器都是用 C 语言编写。Windows、UNIX、Linux 等流行操作系统的主要部分仍然用 C 编写。这是因为即使在今天，在性能（执行速度）方面，没有什么能超越
    C。此外，如果要扩展操作系统与新设备协作，就需要编写设备驱动程序。这些程序都是用 C 语言编写的。它看起来如此流行是因为它可靠、简单且易用。今天经常听到的是——“C
    已经被 C++、C# 和 Java 等语言取代。”


    学习英语和学习 C 语言之间有密切的类比。学习英语的经典方法是首先学习该语言使用的字母，然后学习将这些字母组合成单词，单词再组合成句子，句子组合成段落。学习
    C 语言相似且更容易。我们不需要直接学习如何编写程序，必须首先知道 C 中使用了哪些字母、数字和特殊符号，然后使用它们构建常量、变量和关键字，最后了解这些是如何组合成指令的。一组指令之后会组合成程序。所以


    ![](img/7e3f35612983959bbf2e3b551f6c2979_9_0.png)


    计算机程序只是解决特定问题所需指令的集合。计算机系统的基本操作形成了所谓的计算机指令集。用于解决问题的方法或手段被称为算法。


    因此，就编程语言而言，分为两类：


    1) 低级语言

    2) 高级语言


    # 低级语言：


    低级语言是机器级和汇编级语言。在机器级中，计算机只识别数字，即 0 和 1 的形式。因此，给计算机的指令是以二进制位的形式的，在二进制代码中实现指令非常困难。这种类型的程序不具有移植性，难以维护且容易出错。另一方面，汇编语言是机器语言的修改版本。其中指令以如
    ADD、SUM、MOV 等英语单词给出。它易于编写和理解，但机器无法理解。因此，这里使用的翻译器是汇编器，将其翻译成机器级。虽然语言稍微简单一点，但程序员必须了解与低级语言相关的底层细节。在汇编级语言中，数据存储在计算机寄存器中，这随不同的计算机而异。因此它不具有可移植性。


    # 高级语言：


    这些语言与机器无关，意味着它们具有可移植性。这一类别的语言包括 Pascal、Cobol、Fortran 等。高级语言可以被机器理解。因此需要通过翻译器翻译成机器级。翻译器是一种软件，用于将高级语言以及低级语言翻译成机器级语言。


    有三种翻译器：


    # 编译器


    # 解释器


    # 汇编器


    编译器和解释器用于将高级语言转换为机器级语言。用高级语言编写的程序称为源程序，相应的机器级语言程序称为目标程序。编译器和解释器执行相同的任务，但它们的工作方式不同。编译器一次读取整个程序并搜索错误。如果程序没有错误，它就会被转换为程序。而解释器只读取一行源代码并转换为目标代码，因此需要更多时间。


    # 集成开发环境


    编辑、编译、运行和调试程序的过程通常由单一应用程序管理，称为集成开发环境，简称为 IDE。IDE 是一个基于 Windows 的程序，允许我们轻松地管理大型软件程序、在窗口中编辑文件并编译、运行和调试程序。在
    Mac OS 上，CodeWarrior 和 Xcode 是许多程序员使用的 IDE。在 Windows 下，Microsoft Visual Studio
    是流行 IDE 的一个示例。Eclipse 是 Linux 下开发应用的流行 IDE。


