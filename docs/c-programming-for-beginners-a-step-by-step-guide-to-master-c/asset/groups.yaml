    \ nesting of for loop can be represented as :\n\n```c\nvoid main()\n{\n  int i,j;\
    \ \n  for(i=0;i<2;i++) \n    for(j=0;j<5;j++) \n      printf(\"%d %d\", i, j);\n\
    }\n```\n\nOutput: \ni=0 j=0 1 2 3 4\ni=1 j=0 1 2 3 4\n\n## Break statement(break)\n\
    \nSometimes it becomes necessary to come out of the loop even before loop condition\
    \ becomes false then break statement is used. Break statement is used inside loop\
    \ and switch statements. It cause immediate exit from that loop which it appears\
    \ and it is generally written with condition. It is written with the keyword as\
    \ break. When break statement is encountered loop is terminated and control is\
    \ transferred to the statement, immediately after loop situation where we want\
    \ to jump out of the loop instantly without waiting to get back to conditional\
    \ state.\n\nWhen break is encountered inside any loop, control automatically passes\
    \ to the first statement after the loop. This break statement is usually associated\
    \ with if statement.\n\nExample :\n\n```c\nvoid main()\n{\n  int j=0;\n  for(;j<6;j++)\n\
    \    if(j==4) break;\n}\n```\n\nOutput: 0 1 2 3\n\n## Continue statement (continue)\n\
    \nContinue statement is used for continuing next iteration of loop after skipping\
    \ some statement of loop. When encountered control automatically passes through\
    \ the beginning of the loop. It is usually associated with if statement it is\
    \ useful when we want to continue the program without executing any part of.\n\
    \nThe difference between break and continue is, when break encountered loop is\
    \ terminated and it transfer to the next statement and when continue is control\
    \ come back to the beginning position. In while and do while loop after continue\
    \ control transfer to test condition and then for loop after continue control\
    \ transferred to updating expression and condition is tested.\n\nExample:-\n```c\n\
    void main()\n{\n  int n;\n  for(n=2; n<=9; n++) {\n    if(n==4) continue;\n  \
