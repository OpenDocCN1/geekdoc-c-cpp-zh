  mdcn: "\n欢迎来到 C\n\n欢迎来到 C\n\n欢迎来到 C\n\n欢迎来到 C\n\n所以，只要条件为真，while 循环体内的语句就会反复执行。\n\
    \n## do while 循环\n\n这种（do while 循环）语句也用于循环。该循环体可以包含单个语句或语句块。该语句的语法格式如下：\n\n语法:-\n\
    \n```\ndo\n{\n  Statement;\n}\nwhile(condition);\n```\n\n示例:-\n#include<stdio.h>\n\
    \nvoid main()\n{\n  int X=4;\n  do\n  {\n    printf(\"%d\",X);\n    X=X+1;\n \
    \ } while(X<=10);\n  printf(\" \");\n}\n\nOutput: 4 5 6 7 8 9 10\n\n在这里，首先执行体内的语句，然后检查条件。如果条件为真，则再次执行循环体，此过程一直持续，直到条件变为假。与\
    \ while 循环不同，分号放在 while 的末尾。\n\nwhile 循环和 do while 循环之间存在细差异：while 循环在执行循环的任何语句之前测试条件。而\
    \ do while 循环在循环内至少执行一次语句后才测试条件。\n\n如果初始条件为假，while 循环将不执行其语句；另一方面，即使条件在第一次失败，do\
    \ while 循环也会至少执行一次语句。这意味着 do while 循环始终至少执行一次。注意：\n\n当我们想要至少执行一次循环时，很少使用 do while\
    \ 循环。\n\n## for 循环\n\n在程序中，当预先知道迭代次数时，通常使用 for 循环。循环体可以是单个语句，也可以是多个语句。\n\n其语法格式为：\n\
    \n语法:-\n\n```\nfor(exp1;exp2;exp3)\n{\n  Statement;\n}\n```\n\n或者\n\n```\nfor(initialized\
    \ counter; test counter; update counter)\n{\n  Statement;\n}\n```\n\n在这里，exp1\
    \ 是初始化表达式，exp2 是测试表达式或条件，exp3 是更新表达式。表达式 1 仅在循环开始时执行一次，用于初始化循环变量。条件表达式通常使用关系运算符和逻辑运算符。而更新部分仅在循环体执行完毕后执行。\n\
    \n示例:-\n```c\nvoid main()\n{\n  int i; for(i=1;i<10;i++)\n  {\n    printf(\" %d\
    \ \", i);\n  }\n}\n```\n\nOutput:- 1 2 3 4 5 6 7 8 9\n\n## 循环嵌套\n\n当一个循环写在另一个循环的体内部时，它被称为循环嵌套。任何类型的循环都可以嵌套在任何类型的循环中，例如\
    \ while、do while、for。例如，for 循环的嵌套可以表示为：\n\n```c\nvoid main()\n{\n  int i,j; \n\
    \  for(i=0;i<2;i++) \n    for(j=0;j<5;j++) \n      printf(\"%d %d\", i, j);\n\
    }\n```\n\nOutput: \ni=0 j=0 1 2 3 4\ni=1 j=0 1 2 3 4\n\n## break 语句(break)\n\n\
    有时即使在循环条件变为假之前需要跳出循环，这时就会 break 语句。break 语句用于循环和 switch 语句内部。它会导致立即退出它所在的循环，并且通常与条件配合使用。它使用关键字\
    \ break 编写。当遇到 break 语句时，循环终止，控制转移到循环紧后的语句，即我们想要立即跳出循环，而不需要等待回到条件状态。\n\n当在任何循环内部遇到\
    \ break 时，控制会自动传递到循环后的第一个语句。此 break 语句通常与 if 语句相关。\n\n示例 :\n\n```c\nvoid main()\n\
    {\n  int j=0;\n  for(;j<6;j++)\n    if(j==4) break;\n}\n```\n\nOutput: 0 1 2 3\n\
    \n## continue 语句 (continue)\n\ncontinue 语句用于在跳过循环的某些语句后继续循环的下一次迭代。遇到时，控制会自动传递到循环的开头。它通常与\
    \ if 语句相关，当我们想要继续程序而不执行某些部分时非常有用。\n\nbreak 和 continue 的区别是：遇到 break 时，循环终止并转移到下一个语句；而遇到\
    \ continue 时，控制回到起始位置。在 while 和 do while 循环中，continue 后控制转移到测试条件；而在 for 循环中，continue\
    \ 后控制转移到更新表达式并测试条件。\n\n示例:-\n```c\nvoid main()\n{\n  int n;\n  for(n=2; n<=9;\
    \ n++) {\n    if(n==4) continue;\n    printf(\"%d\", n);\n  }\n}\n```\n\nOutput:\
    \ 2 3 5 6 7 8 9\n\n## if 语句\n\n该语句仅在条件为真时执行。如果 if 语句体包含多个语句，那么在条件为假的情况下，将跳过 if\
    \ 块内的语句，其语法为：\n\n```c\nif (condition)\n{\n  Statement;\n}\nelse\n{\n  Statement;\n\
    }\n```\n\n示例:-\n```c\n/* 检查一个数字是偶数还是奇数 */\nvoid main()\n{\n  int n;\n  printf(\"\
    enter a number:\");\n  scanf(\"%d\", &n);\n  if (n%2==0)\n    printf(\"even number\"\
    );\n  else\n    printf(\"odd number\");\n}\n```\n\nOutput: enter a number:1 odd\
    \ number\n\n## if ...else 嵌套\n\n当 if 块或 else 块中还有另一个 if else 语句时，则被称为 if-else\
    \ 语句嵌套。语法为 :-\n\n```\nif (condition)\n{\n  if (condition)\n    Statement1;\n \
    \ else\n    Statement2;\n}\nelse\n  Statement3;\n```\n\n## If....else 阶梯 (LADDER)\n\
    \n在这种嵌套类型中，除了最后部分外的每个部分都有 else 语句。如果条件为假，控制传递到块，在块中使用其 if 语句再次检查条件。\n\n语法为 :-\n\
    \n```\nif (condition)\n  Statement1;\nelse if (condition)\n  statement2;\nelse\
    \ if (condition)\n  statement3;\nelse\n  statement4;\n```\n\n此过程一直持续到最后一个块没有 if\
    \ 语句。如果某个条件满足，嵌套的 else if 将不会执行。但它相比 if 语句的缺点在于：在 if 语句中，一旦条件为，其他条件就不会被检查；在这种情况下，所有条件都会被检查。\n\
    \n## 数组 (ARRAY)\n\n数组是相同类型的集合，或者是存储在连续内存位置中的相同实体集合。字符数组是字符串。数组中的每个数据项称为元素。每个元素都是唯一的并位于独立的内存位置。数组的每个元素共享一个变量名，但每个元素都有不同的索引号，称为下标。\n\
    \n数组可以是单维的也可以是多维的，下标的数量决定了它的维度。下标始终从零开始。一维数组被称为向量，二维数组被称为矩阵。\n\n优点：数组变量可以同时存储多个值，而其他变量一次只能存储一个值。\n\
    \n示例：\n```c\nint arr[100];\nint mark[100];\n```\n\n数组声明：\n\n其语法为：\n\n数据类型 数组名\
    \ [大小];\n\n```\nint arr[100];\nint mark[100];\nint a[5]={10,20,30,100,5}\n```\n\
    \n数组声明告诉编译器数据类型、数组名称、数组大小以及每个元素占据的内存空间。像 int 数据类型，它每个元素占用 2 字节，对于 float，它每个元素占用\
    \ 4 字节等。数组的大小决定数组中可以存储的元素数量，它可以是一个 int 常数或常量 int 表达式。\n\n"
