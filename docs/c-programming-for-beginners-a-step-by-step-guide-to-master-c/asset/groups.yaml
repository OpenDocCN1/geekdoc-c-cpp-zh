    - Sign qualifier: signed, unsigned


    When the qualifier unsigned is used the number is always positive, and when signed
    used number may be positive or negative. If the sign qualifier is not mentioned,
    then by default sign qualifier is assumed. The range of values for signed data
    types is less than that of unsigned type. Because in signed type, the leftmost
