  md: "\nWelcome to C\n\nWelcome to C\n\nWelcome to C\n\nWelcome to C\n\nSo as long\
    \ as condition remains true statements within the body of while loop will get\
    \ executed repeatedly.\n\n## do while loop\n\nThis (do while loop) statement is\
    \ also used for looping. The body of this loop may contain single statement or\
    \ block of statement. The syntax for writing this statement is:\n\nSyntax:-\n\n\
    ```\ndo\n{\n  Statement;\n}\nwhile(condition);\n```\n\nExample:-\n#include<stdio.h>\n\
    \nvoid main()\n{\n  int X=4;\n  do\n  {\n    printf(\"%d\",X);\n    X=X+1;\n \
    \ } while(X<=10);\n  printf(\" \");\n}\n\nOutput: 4 5 6 7 8 9 10\n\nHere firstly\
    \ statement inside body is executed then condition is checked. If the condition\
    \ is true again body of loop is executed and this process continue until the condition\
    \ becomes false. Unlike while loop semicolon is placed at the end of while.\n\n\
    There is minor difference between while and do while loop, while loop test the\
    \ condition before executing any of the statement of loop. Whereas do while loop\
    \ test condition after having executed the statement at least one within the loop.\n\
    \nIf initial condition is false while loop would not executed it’s statement on\
    \ other hand do while loop executed it’s statement at least once even If condition\
    \ fails for first time. It means do while loop always executes at least once.\
    \ Notes:\n\nDo while loop used rarely when we want to execute a loop at least\
    \ once.\n\n## for loop\n\nIn a program, for loop is generally used when number\
    \ of iteration are known in advance. The body of the loop can be single statement\
    \ or multiple statements.\n\nIts syntax for writing is:\n\nSyntax:-\n\n```\nfor(exp1;exp2;exp3)\n\
    {\n  Statement;\n}\n```\n\nOr\n\n```\nfor(initialized counter; test counter; update\
    \ counter)\n{\n  Statement;\n}\n```\n\nHere exp1 is an initialization expression,\
    \ exp2 is test expression or condition and exp3 is an update expression. Expression\
    \ 1 is executed only once when loop started and used to initialize the loop variables.\
    \ Condition expression generally uses relational and logical operators. And updation\
    \ part executed only when after body of the loop is executed.\n\nExample:-\n```c\n\
    void main()\n{\n  int i; for(i=1;i<10;i++)\n  {\n    printf(\" %d \", i);\n  }\n\
    }\n```\n\nOutput:- 1 2 3 4 5 6 7 8 9\n\n## Nesting of loop\n\nWhen a loop written\
    \ inside the body of another loop then, it is known as nesting of loop. Any type\
