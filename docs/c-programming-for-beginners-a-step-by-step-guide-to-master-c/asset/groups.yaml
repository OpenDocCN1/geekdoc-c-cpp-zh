    ### 数值常量


    数值常量由数字组成。它要求最小 2 字节，最大 4 字节。它可以是正的或负的，但默认符号始终为正。数值常量内部不允许逗号或空格，且必须至少有一个数字。整数常量的允许范围是
    -32768 到 32767。严格来说，范围取决于编译器。对于像 Turbo C 或 C++ 等 16 位编译器，范围甚至更大。对于 32 位编译器，整数常量的范围更大。整数常量是没有小数点的整数。整数常量的类型有：

    - 十进制常量：0-9（10 进制）

    - 八进制常量：0-7（8 进制）

    - 六进制常量：0-9, A-F（16 进制）


    十进制常量的第一位不应为零，而八进制常量的第一位必须为零（如 07），十六进制常量的第一位应该是 0x 或 0X（如 0x24）。默认情况下，整数常量的类型是
    `integer`，但如果整数常量的值超过了范围，则 `integer` 类型表示的值将通过后缀 `L` 和 `u/U` 变为无符号整数或长整数。


    **实数常量**也称为浮点常量。要构造实数常量，必须遵循以下规则：

    - 实数常量至少有一个数字。

    - 它必须有一个小数点。

    - 它可以是正的或负的。

    - 默认符号为正。

    - 实数常量内部不允许逗号或空格。例如：32.34, 42.0


    为了表示小/大实数指数，使用科学计数法，其中数字写在尾数部分，指数部分用 e/E 隔开。指数可以是正负整数，但尾数可以是实数/整数类型，例如 3.6*10^5=3.6e+5。默认情况下，浮点常量的类型是
    `double`，也可以通过后缀 `f/F` 显式定义。


