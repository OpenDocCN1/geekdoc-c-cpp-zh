- fmt: "\nYou understand the concept of a variable by now. Inside a class variables\
    \ are capable of being declared of any C++ built-in type. Since the class can\
    \ construct an object, the variables are the pieces that piece the object together.\n\
    \nTaking an example of a `Car` object, the variables that a class might include\
    \ offers life to the object so it operates in the correct format. With a `Car`\
    \ object, some of the variables might read as:\n\n| double Fuel;double milesDriven;int\
    \ steeringDirection; |\n\nIf these class variables are employed, then when coding\
    \ a class for a program, it might appear similar to the following:\n\n```cpp\n\
    class Car { // class variables\ndouble Fuel;double milesDriven;int steeringDirection;\n\
    };\n```\n\n## Method Functions\n\nAlike to class variables being just plain simple\
    \ variables, yet implemented in a class, method functions are functions that are\
    \ coded in a class. These method functions operate with class variables to give\
    \ the class object its functionality and power.\n\nA simple way to put this is\
    \ if the class variables of a `Car` object are the data measurements that are\
    \ handled in a program, then the method functions are the levers which operate\
    \ the action of giving the class variables its data. Therefore, these method functions\
    \ are pivotal to giving any created class object its power to be used.\n\n```cpp\n\
    class Car { // method functions\nvoid increaseFuel();\nvoid Accelerate();\nint\
    \ calculateMiles(); // class variables\ndouble Fuel;double milesDriven;int steeringDirection;\n\
    };\n```\n\n## Create a Class Object\n\nA normal variable is created by writing\
    \ out the data type and its user-defined name. The variable is capable of also\
    \ being defined with a value. This routine is similar when creating a class object.\n\
    \nWe have already spoken of a `Human` and `Car` class object that is employed\
    \ in classes to operate with class variables and method functions. Now you might\
    \ wonder what a class object exactly does.\n\nFor the majority of classes created\
    \ in programs – there are some with Abstract Data Types that cannot have objects\
    \ – an object is required to control and seize the functionality of the class.\n\
    \nTo create a class object, much like a variable, the type of the class is required\
    \ followed by the user-defined name of the object. Of course, as this is a statement\
    \ in C++ a semi-colon concludes the line. For instance:\n\n| Human programmer;Car\
    \ fourDoor; |\n\nIn this snippet the `Human` class type has created an object\
    \ called `programmer` and the `Car` type creates an object called `fourDoor`;\
    \ Once an object is created, it can take on the role of using class variables\
    \ and method functions from the class to operate effectively.\n\n## Access Data\
    \ from Classes\n\nYou have learnt how to build an object, but not how to use it\
    \ in a C++ program. Class objects are built in a function, like `main`, and that\
    \ is where they can be used. If you decide to build an object called `Keyboard`\
    \ in a function called `KeyPresses(…)` then that object can operate only in that\
    \ function.\n\nWith a class object in a program, you can start to use to access\
    \ data from the said class that the object is generated from. The initial aspect\
    \ that is required to access class data is to know the power of an operator called\
    \ the scope resolution operator (`::`). This operator is used to define a method\
    \ function from a class using the type name of the class. For instance, in the\
    \ case of the `Keyboard` class with the method function `KeyPresses(…)`, it would\
    \ look somewhat like:\n\n```cpp\n#include <iostream>\nusing namespace std;\nclass\
    \ Keyboard {\npublic:\n    void Keypresses();\n};\nvoid Keyboard::Keypresses()\
    \ // class type accesses method function\n{\n    char key;\n    cout << \"Press\
    \ A Key: \";\n    cin >> key;\n    cout << \"The Key You Press Was: \" << key\
    \ << endl;\n}\nint main() {\n    Keyboard Keys; // object created\n    Keys.Keypresses();\
    \ // Keys object accesses Keypresses method function\n}\n```\n\n## Private & Public\
    \ Accessor’s\n\nWhen it comes to classes in C++ there are three types of accessor’s\
    \ that are utilized to determine the scope of the data inside a class. In this\
    \ part we are going to look at the two main ones that are usually employed in\
    \ classes.\n\n### Private\n\nThe private accessor is the default accessor for\
    \ any class. When a class is built without any written accessor name, like `private`\
    \ or `public`, then C++ defaults all the data to encapsulating it in a private\
    \ accessor. This means that it is restricted to anything that is outside the class,\
    \ like the `main` function.\n\n```cpp\nclass Human { // no accessor name\n// accessor\
    \ default is private\n}\n```\n\n### Public\n\nThe second accessor in classes is\
    \ the keyword `public`. The public accessor allows the method functions and class\
    \ variables created under it to be accessed anywhere in the class scope. Unlike\
    \ the private accessor, which needs a third party to access its data, anything\
    \ can be accessed from the public accessor.\n\nListing 12.1 – Public and Private.cpp\n\
    \n```cpp\n#include <iostream>\n#include <string>\nusing namespace std;\nclass\
    \ Human {\npublic:\n    void GetName(string); // declaring public method function\n\
    private:\n    string itsName; // declares private class variable\n};\nvoid Human::GetName(string\
    \ name) // defining method function\n{\n    itsName = name;\n    cout << \"My\
    \ Name Is: \" << itsName << endl;\n}\nint main() {\n    Human programmer; // creates\
    \ a Human object\n    string me; // local string variable\n    cout << \"Hello\
    \ Programmer!\" << endl;\n    cout << \"What Is Your Name: \";\n    cin >> me;\n\
    \    programmer.GetName(me); // object calls method function\n    return 0;\n\
    }\n```\n\nProgram Syntax: Public and Private.cpp\n\n#### Public\n\nThe public\
    \ accessor is implemented to yield the method function `GetName(...)`, which carries\
    \ one parameter. That parameter is filled with the data from the string variable\
    \ is `main` called `me`.\n\n#### Private\n\nAs the private accessor data requires\
    \ a method function, it yields a string variable called `itsName`, which is employed\
    \ in the `GetName(…)` function to copy the data from the method function argument\
    \ and then display.\n\n## Constructor and Destructor\n\nA constructor and destructor\
    \ are the opposite ends of a candle where classes are concered. When a class is\
    \ created by writing its type, i.e. `Human` or `Car`, with the curly brackets\
    \ two method functions are created by default. These functions are hidden from\
    \ the programmer, although they can be manually written out and employed in a\
    \ program to do some great stuff.\n\n### Constructor\n\nA class constructor is\
    \ a special method function that is created once an object is created from the\
    \ class type. The constructor holds the same name as the class type, so it knows\
    \ where to access once an object of that type is created. You do not have to define\
    \ a constructor. The program shall do this for you when an object is created.\
    \ However, this is not always a good thing as you might need to use a constructor,\
    \ meaning you will have to declare one. It is normally a good thing then to create\
    \ one, even if it isn't used.\n\nIn the case of the `Human` class, if you wished\
    \ to define the constructor method function then you would write it as:\n\n```cpp\n\
    Human::Human() { // do something }\n```\n\nListing 12.2 – Manual Constructor.cpp\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nclass Human {\npublic:\n\
    \    void GetAge();\nprivate:\n    int itsAge;\n};\nHuman::Human() // called when\
    \ Human object is created\n{\n    cout << “You Are In The Human Constructor!”\
    \ << endl;\n    cout << “Now, We Are Leaping Out!” << endl;\n    GetAge(); //\
    \ calls method function\n}\nHuman::GetAge() {\n    itsAge = 21;\n    cout << “What\
    \ Is To Be “ << itsAge << “ again. Bliss!” << endl;\n}\nint main() {\n    Human\
    \ me; // object created\n    return 0;\n}\n```\n\nProgram Syntax: Manual Constructor.cpp\n\
    \n#### The Human Constructor\n\nWhen the `Human` class type object is created,\
    \ the program jumps into the Human constructor – `Human::Human()` – where is runs\
    \ through a pair of `cout` commands and jumps into the method function `GetAge()`.\
    \ This reveals that whenever a new class object is created or called, then the\
    \ constructor to that object is active and runs through.\n"
