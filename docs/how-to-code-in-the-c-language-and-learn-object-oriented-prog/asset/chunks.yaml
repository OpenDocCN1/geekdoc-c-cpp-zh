    \ header files is enormous. When the programs that have been previously coded\
    \ are examined we see only the header file <iostream>. Every full program in this\
    \ book includes the <iostream> header file. But what is a header file?\n\nA header\
    \ file is a collection of declarations, objects and functions that can be employed\
    \ in a program. By including a header file in a program, it is practically like\
    \ you are implementing all the objects and functions in the file to the disposal\
    \ of the program, so it can utilize them. So, when you include the <iostream>\
    \ header file, it allows for the use of the cin, cout and endl commands to be\
    \ employed in your programs.\n\n### Comments\n\nThe comments in a C++ program\
    \ are human-readable syntax to understand how certain written code operates. Comments\
    \ are not read by the compiler at run-time. Instead, they are simply there to\
    \ help the programmer, and anyone else who checks the programs code, to understand\
    \ how it operates.\n\nThere are two forms of comments used in C++. First is the\
    \ standard C comment that allows the programmer to divide the comment between\
    \ multiple lines.\n\nA C comment, which is old style, is written by starting with\
    \ /* then writing the comment and ending it with */. These comments can fit on\
    \ multiple lines and everything between the /* and */ is part of the comment.\n\
    \n| /* This is a C commentA C comment can run on multiple linesIt concludes once\
    \ it reaches */ |\n\nThe other variation of a comment is the new C++ style, which\
    \ runs on a single line. To create a C++ comment, you need to write two forward\
    \ slashes // followed by the comment. Once a carriage return is initialized and\
    \ the line breaks, the comment finishes. Therefore, to write another C++ comment,\
    \ you are require to type // again.\n\n| // This is a C++ comment// This is another\
    \ C++ comment |\n\nReading through this book, you shall notice I use the C++ style\
    \ comment in the program examples. Since the book concentrates on the C++ language,\
    \ I believe it is correct to use this syntax. Although, as a programmer, you are\
    \ eligible to employ the comment type that suits your own preference.\n\n| Knowledge:\
    \ Practise Writing CommentsWriting comments that the programmer understands is\
    \ an easy job. Although, writing comments that outsiders are going to read and\
    \ understand is a difficult task and requires practice. Writing a great, understandable\
    \ comment for another person’s eyes is an art form in itself. Remember to practice\
    \ commenting in every program you code. |\n\n### Namespaces\n\nThe elements inside\
    \ the standard C++ library are declared within a namespace.  In our previous programs,\
    \ a namespace called std is employed before the primary function is open. You\
    \ shall notice the code line using namespace does appear in all the programs written\
    \ in this book. A namespace is called by the command using namespace followed\
    \ by the name of the namespace.\n\n### Function Blocks\n\nIn chapter 6 the subject\
    \ of C++ functions are brought to our attention. But for now, I shall give a brief\
    \ overview of what a function does. Functions are blocks of code that are great\
    \ for individually separating certain data and keeping your code looking clean.\
    \ The main function in the previous program is the function that starts the ball\
    \ rolling for any executable program."
