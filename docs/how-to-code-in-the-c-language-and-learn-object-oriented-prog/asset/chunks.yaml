  trans: "\n\n2. 如何将一个值加 1 或减 1？\n3. 什么是优先级？\n4. 你能解释一下如何使用前置和后置运算符吗？\n\n# 第 5 章：语句与表达式\n\
    \n## 语句\nCC 中的语句（Statements）是一行代码，它命令程序执行操作。每个编写的语句都以分号结束。语句告诉编译器在程序中初始化特定数量的操作。在下面的示例中，语句命令编译器显示文本然后换行。\n\
    \n```cpp\ncout << \"A statement!\" << endl; // 显示并结束\n```\n\n## 复合语句\n一组共同封括在括号\
    \ `{ }` 之间的语句被称为复合语句。在本章的后后部分，你将在检查 `if` 语句时在程序中看到这种用法。补充说明一下，你已经在 `main` 函数中见过复合语句的使用了。一组复合语句会根据给定的编码指令，让编译器计算一组操作。\n\
    \n## 表达式\n表达式（Expression）是任何返回一个值的编码语句。这意味着表达式实际上也是语句。如果你看下例示例，你会看到一个返回值给变量 `Z`\
    \ 的表达式。\n\n```cpp\nint Y = 2;\nint X = 4;\nint Z;\nZ = Y + X; // 表达式返回值 6\n```\n\
    \n这是另一个表达式示例，你在程序示例的结尾见过这种表达式。\n\n```cpp\nreturn 0;\n```\n\n## 在程序中做决策\n到目前为止你查看了基础程序。你查看了计算机编程的自上而下的结构，并看到了基础程序如何读取编写的代码。\n\
    \n然而，你正准备通过引入决策的概念来让你的编程变得稍微复杂一点。你将通过引入 `if`、`if else` 和 `switch` 语句来研究决策的步骤。\n\
    \n## if 语句\n你可能认为一个从上到下流流的程序会很乏味。没有任何计算机游戏或应用程序是建立在这个基础之上的。改变程序中无聊自上而下角色的初始方法是插入一个\
    \ `if` 语句。\n\n`if` 语句检查一个布尔条件以判断它是真还是假。如果条件为真，`if` 语句将执行它自己的指令，这可以改变程序的动态变化。然而，如果条件为假，它将继续像以前那样无聊地运行下去。\n\
    \n列表 5.0 – Are Learning.cpp\n```cpp\n#include <iostream>\nusing namespace std;\n\
    int main() {\n    bool isProgramming; // if 语句要求 bool 类型\n    cout << \"Are you\
    \ learning to program? (no) or 1(yes)): \" << endl;\n    cin >> isProgramming;\n\
    \    if (isProgramming == true) // if 语句条件\n    {\n        cout << \"Yes. Then\
    \ luck!\" << endl; // 执行程序行\n    }\n    return 0;\n}\n```\n程序语法：Are Learning.cpp\n\
    \n### if 语句\n你会注意到在 `if` 语句的开头没有分号。你不应该在这里放置分号，因为当条件为真时，它是一个新复合语句的开启标志。在这种情况下，它检查一个\
    \ `bool` 变量并将其读取为真。因此，程序通过 `if` 语句，执行内部的内容。\n\n列表 5.1 – A False Condition.cpp\n\
    ```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    bool isProgramming;\
    \ // if 语句要求 bool 类型\n    cout << \"Are you learning to program? (no) or 1(yes)):\
    \ \" << endl;\n    isProgramming = false;\n    if (isProgramming == true) // if\
    \ 语句条件\n    {\n        cout << \"Yes. Then luck!\" << endl; // 执行程序行\n    }\n\
    \    return 0;\n}\n```\n程序语法：A False Condition.cpp\n\n#### 行未执行\n这是上一个程序的复制，这个程序揭示了\
    \ `if` 语句并没有开启执行 `cout` 语句，因为条件不等于真。\n\n## if else 语句\n考虑到 `if` 语句开始在你的程序中创建决策，但这不足以创建一个具有随机性和不确定性火花的大胆且有趣的程序。当\
    \ `if` 条件为假时，你没有备选项。所以程序简单地跳过了复合 `if` 语句并继续其自上而下的旋转。\n\n然而，你可以在 `if` 语句之后放置第二个决策者，称为\
    \ `else`。`else` 关键字允许在 `if` 条件等于假时进行另一种决策。`else` 的语法如下：\n\n```cpp\nif (condition)\
    \ {\n    // 语句\n} else {\n    // 语句\n}\n```\n\n当 `if` 条件经过测试并发现为假时，它会跳转到 `else`\
    \ 语句并在那里执行和读取。如果 `else` 条件为真，它会滑入其块并执行其中的语句。\n\n列表 5.2 – Are You Programming or\
    \ Not.cpp\n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n \
    \   bool isProgramming;\n    cout << \"Are you learning to program? (No) or 1(Yes)):\
    \ \";\n    cin >> isProgramming;\n    if (isProgramming == true) {\n        cout\
    \ << \"Yes. Then Luck!\" << endl;\n    } else // else 语句提供了多样性\n    {\n      \
    \  cout << \"Well, try your hand at something else.\" << endl;\n    }\n    return\
    \ 0;\n}\n```\n程序语法：Are You Programming or Not.cpp\n\n### else 语句\n`else` 语句是在\
    \ `if` 条件为假时的一种预防措施。如果这种情况发生，程序将跳转到 `else` 语句并显示“Well, try your hand at something\
    \ else.”在某些情况下，如果 `if` 条件被发现为假，则内部的语句将被执行。\n\n## 嵌套语句\n在普通的 `if` 和 `else` 语句旁边，你可以附加其他的\
    \ `if` 和 `else` 语句。这被称为嵌套语句。\n\n```cpp\nif (condition) {\n    // 语句\n    if (condition)\
    \ {\n        // 更多语句\n    }\n} else {\n    // 语句\n    if (condition) {\n     \
    \   // 更多语句\n    }\n}\n```\n\n警告：语句过多\n尝试创建一个带有十个 `if` 语句、十个 `else` 以及五个嵌套 `if`\
    \ 和 `else` 语句的程序。在使用 `if` 语句实验时，学者可能会这样做。尽管，无论你如何尝试，都有更好的方法来编写这种代码。\n\n## switch\
    \ 语句\n当程序面临许多选择时，`switch` 语句是有益的。因此，在程序你可以实现 `if` 和 `if else` 语句，可能还有嵌套的 `if`\
    \ 语句，但很快随着大量的 `if` 和 `else`，你的程序可能会变成一场在连续缩进和几十个 `if` 或 `else` 之上的疯狂之旅。基本上，它读起来像是一团乱。\n\
    \n`switch` 语句是 `if` 语句的短版本。它的作用就像一个菜单。在高级编程中，`switch` 语句大部分时候是。例如，在开发游戏时，`switch`\
    \ 语句通常用于游戏循环。因此，`switch` 语句对编程是好事，值得学习。\n\n与 `if` 语句一样，`switch` 语句接收一个条件并确定其与哪些列表匹配。以下是\
    \ `switch` 语句的语法：\n\n```cpp\nswitch(condition) // 如果条件为真，switch 开启{\n    case\
    \ 1: // 语句在此，带分号\n    break;\n    case 2: // 语句在此，带分号\n    break;\n    case 3:\
    \ // 语句在此，带分号\n    break;\n    case 4: // 语句在此，带分号\n    break;\n    default: //\
    \ 语句在此，带分号\n}\n```\n\n它与 `if` 语句非常相似，事实上它接受一个条件并根据结果做出决定。区别在于 `case`，条件只对其中一个\
    \ `case` 为真，而对其他则不是。这对于只选择一个选项是一个很好的语句。\n\n"
- fmt: "\n# Technical Talk: The break Statement\n\nBetween each case of the `switch`\
    \ statements, you may have noticed a keyword called `break`. The `break` between\
    \ each case is there to tell the compile once a selection is then it is to jump\
    \ out of the `switch` statement and continue with the rest of the program. If\
    \ the `break` statement was left out it would compute each case after the one\
    \ selected.\n\nBelow is an example of a `switch` statement, where you need to\
    \ select a race of character for a computer game.\n\n### Listing 5.3 – Select\
    \ a Character.cpp\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main(){\n\
    \    cout << \"Select the type of character you wish to play\" << endl;\n    cout\
    \ << \"1\\. Human -- 2. Dwarf -- 3\\. Dragon -- 4. Ogre -- 5. Gnome\";\n    int\
    \ theCondition;\n    cin >> theCondition;\n    switch(condition) // open of switch\
    \ statement\n    {\n        // the condition result decides what case is examined\n\
    \        case 1: cout << \"You wish to play as a human\" << endl;\n        break;\
    \ // break statement stops the switch statement\n        case 2: cout << \" You\
    \ wish to play as a dwarf\" << endl;\n        break;\n        case 3: cout <<\
    \ \" You wish to play as a dragon\" << endl;\n        break;\n        case 4:\
    \ cout << \"You wish to play as an ogre\" << endl;\n        break;\n        case\
    \ 5: cout << \"You wish to play as a gnome\" << endl;\n        break;\n      \
    \  default: cout << \"Invalid input\" << endl;\n    }\n    return 0;\n}\n```\n\
    \n## Program Syntax: Select a Character.cpp\n\n#### switch Statement\nThe `switch`\
    \ statement requires a condition to start the process of deciding which case it\
    \ will travel.\n\n#### The cases\nThe `cases` are what holds the result of the\
    \ condition, either by the program or by user input.\n\n#### break Statements\n\
    The `break` statements in the program order once a decision has been made and\
    \ the code executed, the `switch` statement can stop and the program can drop\
    \ out The program can then continue the process of running through the rest of\
    \ the program.\n\n### Technical Talk: The cases in a switch Statement\nWhen a\
    \ `switch` statement is created and its condition is met with a value, it leaps\
    \ down to analyse what case to execute. The `cases` inside a `switch` statement\
    \ are the locations of executable code. Depending on what case is chosen.\n\n\
    ## Mixing Statements\nYou have seen both `switch` and `else` statements now in\
    \ operation by themselves. Although C++ statements are everywhere and work together,\
    \ it is possible to have a `switch` statement and an `if` statement together,\
    \ or even vice versa.\n\n## Time to Test Yourself\nThe following four questions\
    \ are regards to what you have learned about C++. Attempt these questions before\
    \ you move forward to the next.\n\n### Test Yourself\n1. What is a statement and\
    \ an expression?\n2. How far can `if` statements be nested?\n3. When is it good\
    \ to use a `switch` statement over an `if` statement?\n4. What is `break` statement\
    \ for?\n\n# Chapter 6 Functions\n\n## What is a Function?\nA function is a block\
    \ in a program filled with statements and expressions to compute. Functions can\
    \ be called upon any other function to process everything inside it. In the essence\
    \ of it, functions are a sub-program, a small piece of a larger idea which a program\
    \ might have. Functions, therefore, act like building blocks in a program. They\
    \ help to organise program more suitably and help to break down the actions a\
    \ program has so it can accomplish small but significant tasks.\n\n## Creating\
    \ a Function\nFunctions can be hard to grasp, but with a little practice they\
    \ are easily understood. The difficult part of a function is learning to write\
    \ one well. This is where a solid rule comes handy, especially for beginners.\
    \ A well written function should only have one task to accomplish. Whether programmer\
    \ wishes to add two numbers together, display a graphic on the screen or increase\
    \ player’s health in a computer game, the function should be tasked with one job.\n\
    \n```cpp\n// function to increase a player’s health\nint MaxHealthPotion(int playerHealth){\n\
    \    playerHealth = playerHealth + 25;\n    cout << “Your health is now “ << playerHealth\
    \ << endl;\n}\n```\nThe `MaxHealthPotion` code shows a function created to accomplish\
    \ one task in a program.\n\n## Declare a Function\nIn C++ to declare a function\
    \ you must create a function prototype before `main`. The function prototype consists\
    \ of at least three aspects: First you need to have the data type of the function,\
    \ then the name of it which is user defined, then you have parentheses where parameters\
    \ can be passed into the function. These can consist literally anything from a\
    \ variable to another function. In the previous example I have passed an integer\
    \ variable called `playerHealth`, which enables a program to use the variable\
    \ in the function.\n\n```cpp\nint myFunction(int theParameter);\n```\n\n## Define\
    \ a Function\nOnce a function is declared it can be defined by writing it out\
    \ with instructions of code you want the function to accomplish.\n\n```cpp\n//\
    \ declaring a function\nint MaxHealthPotion(int playerHealth); // function prototype\n\
    //defining a function\nint MaxHealthPotion(int playerHealth){\n    // statements\
    \ are written here\n}\n```\n\n### Listing 6.0 – The Second Function.cpp\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\nvoid SecondFunction(); // a user-declared\
    \ function\nint main(){\n    cout << \"This is the main function\" << endl;\n\
    \    cout << \"Now we are going to jump into a new function.\" << endl;\n    SecondFunction();\
    \ // program passes into function\n    return 0;\n}\nvoid SecondFunction() //\
    \ other function\n{\n    cout << \"\\nNow we are in the second function of the\
    \ program.\" << endl;\n    cout << \"When we leave here the program ends.\" <<\
    \ endl;\n    cout << \"Goodbye!\" << endl;\n}\n```\n\n## Program Syntax: Second\
    \ Function.cpp\n\n#### User-Defined Function\nThe `SecondFunction` is the other\
    \ function built in the program. It isn’t like the `main` function. Instead, it\
    \ is a function fully built by the programmer. At the top of the program, you\
    \ have the function prototype which declares the function but doesn’t define it.\n\
    \nBecause `SecondFunction` has already been declared, it can be placed underneath\
    \ the `main` function. On the other hand, if the function didn’t have a prototype\
    \ then its definition would’ve required to be written above the `main` function.\n\
    \n## No Prototype Function\nThis next example is a program with the `SecondFunction`\
    \ again, but this time the function prototype is omitted and the function moved\
    \ above `main`.\n\n### Listing 6.1 – The Second Function with No Prototype.cpp\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nvoid SecondFunction() //\
    \ function defined and declared\n{\n    cout << \"\\nHello! This is the second\
    \ function.\" << endl;\n    cout << \"This time around, the function is built\
    \ with no prototype.\" << endl;\n}\nint main(){\n    cout << \"We are in the main\
    \ function\" << endl;\n    cout << \"Stepping over to the SecondFunction.\" <<\
    \ endl;\n    SecondFunction(); // calls the other function\n    return 0;\n}\n\
    ```\n\n## Program Syntax: The Second Function with No Prototype.cpp\n\n#### No\
    \ Function Prototype\nBecause no coded prototype shows in the program it means\
    \ `SecondFunction` is required to be declared and defined above the `main` function.\
    \ The reason is due to the fact that the program is required to know what functions\
    \ are going to be working with the program before the `main` function is reached\
    \ – and without a function prototype, it won’t know unless the function is written\
    \ before `main` opens up.\n\n### Technical Talk: Write Functions in Header Files\n\
    One of the places a large majority of programmer’s code functions is inside header\
    \ filed. The header file is then linked to a `.cpp` file.\n\n## Working in Scopes\n\
    The question of scope in programming languages is large enough that if a programmer\
    \ makes a mistake it could cause an error. When talking about scope in functions\
    \ there are two words required to be addressed: Global and Local.\n"
