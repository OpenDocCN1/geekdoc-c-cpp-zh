    \ m = (x != y) && (y < z); // m 返回 true\n```\n\n第 8 章\n\n# 循环 (Loops)\n\n## 编程循环\
    \ (Programming Loops)\n\n重复是编程世界中的关键因素，也是每个开发者在程序中都依赖的东西。\n\n要在你的程序中创建重复，你需要类型的循环。如果没有循环，你的程序最终会运行完毕并停止，退出桌面。\n\
    \nC++ 中有类型的循环：`while`、`do while` 和 `for` 循环。每种循环都执行重复代码直到达到某个值的简单任务，但每种循环都有自己实现此的方法。\n\
    \n### while 循环\n\n`while` 循环是我们将检查的三个循环中的第一个。`while` 循环的语法所示。\n\n```\nwhile(condition){\n\
    \    // 执行某些操作\n}\n```\n\n`while` 循环做的第一个方面是测试条件是真是假。如果条件为 `true`（真），则循环打开，括号之间的代码将被计算。然而，如果条件为\
    \ `false`（假），则循环被跳过，程序继续运行。\n\n循环将一直持续，直到循环中的条件被满足，此时它将跳出循环以继续处理程序的其余部分。\n\n###\
    \ do while 循环\n\n`do while` 循环在操作上与普通的 `while` 循环相似，因为它需要数据进行检查。然而，`do while`\
    \ 循环的不同之处在于它在到达条件之前至少进行一次轮测试。`do while` 的语法如下所示。\n\n```cpp\ndo{\n    // 执行事情\n\
    } while (condition);\n```\n\n你可以看到，循环是用关键字 `do` 开启的，然后一直进行直到遇到 `while` 关键字，在那里它测试条件。如果不符合条件，`do\
    \ while` 循环将再次循环。\n\n这里有一个示例：\n\nListing 8.0 – do while Loop.cpp\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\nint main (){\n    short x = 7, y =0; // 初始化两个\
    \ short 类型变量\n    do // 开始 do while 循环\n    {\n        cout << \"Your number is:\
    \ \" << x-- << endl; // 在循环中显示变量\n    } while (x > y); // 结束 do while 循环\n   \
    \ return 0;\n}\n```\n\n程序语法：`do while Loop.cpp`\n\n#### do while 循环\n\n此程序两个整数变量\
    \ `x` 和 `y`，并在 `do while` 循环中使用它们，直到它们最终匹配。一旦 `x` 的值为 `0`，它就会停止运行循环。\n\n### for\
    \ 循环\n\n`for` 循环取一个初始值并与另一个值进行测试。如果初始值不等于第二个语句，第三个表达式就会介入并……\n\n```cpp\nfor (initial;\
    \ second; third) {\n}\n```\n\n## 嵌套循环 (Nested Loops)\n\n因为任何循环的内部都可以在 `if` 语句中放置循环，所以下面显示了嵌套循环的示例。`do\
    \ while` 循环包含了嵌套的 `if else` 语句。\n\nListing 8.1 – Nested Loops.\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\nint main (){\n    int creaturehp = 100;\n\
    \    int playerattwer = 32;\n    do // 开始 do while 循环\n    {\n        cout <<\
    \ \"Player attacks!\" << endl;\n        creaturehp = creaturehp – playerattwer;\n\
    \        if (creaturehp <= 0) {\n            cout << \"You slayed the creature!\"\
    \ << endl;\n        } else if (playerattwer == 32) {\n            cout << \"You\
    \ slayed the creature!\" << endl;\n        } else {\n            cout << \"The\
    \ creature now has \" << creaturehp << \" points remaining!\" << endl;\n     \
    \   }\n    } while (creaturehp > 0);\n    return 0;\n}\n```\n\n程序语法：`Nested Loops.cpp`\n\
    \n#### 嵌套 if 语句\n\n循环中的嵌套语句是另一个 `if` 语句，用于检查变量条件是否等于 `32`。如果是，用户将收到消息，“You slayed\
    \ the creature!”。\n\n#### 嵌套循环和 else 语句\n\n这可能是你迄为止写过的最大的程序，它是书里最大的。然而，我想让你习惯编写大型程序，这样你才不会自满并一直编写小程序。程序是成千上万、有时是数百万行代码，需要由一名或一组程序员来处理。\n\
    \n"
- fmt: "\nFor a beginner to C++, learning the notion behind pointers is the bane of\
    \ their programming education. When the idea of messing with your computer’s memory\
    \ is fixed in your head, there is a moment when you begin to become a little too\
    \ cautious. It is totally understandable. And when using a pointer, essentially\
    \ you are allowing the program code to mess with your computer’s memory. However,\
    \ do not panic as it sounds worse than it truly stated.\n\n### Memory Addresses\n\
    \nWhen the discussion of variables came up in chapter three, you learned when\
    \ a variable is created it is assigned a memory address.\n\nWell, to understand\
    \ the full impact of how pointers operator with memory and their addresses, you’ll\
    \ require a little more knowledge about memory.\n\nCreated variables are stored\
    \ in computer memory. Every integer, float, char, string, etc. is given a memory\
    \ address location. These locations are sequentially numbered after one another.\n\
    \nDue to programs sorting and maintaining addresses of its given variables, the\
    \ programmer doesn’t need to trouble about such complex matters. I.e. the program,\
    \ if coded correctly, will do it.\n\nThe next part of the program uses the Address\
    \ of Operator to demonstrate how to obtain the information of a variable address\
    \ and display it on screen.\n\nThe Address of Operator is employed in programs\
    \ to discover the memory addresses that holds a variable.\n\nListing 9.0 – Understand\
    \ Memory Address and Data Pointing.cpp\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nint main(){\n    int number = 5; // integer variable\n    int *pPointerToValue\
    \ = NULL; // initialized pointer to NULL\n    pPointerToValue = number; // pointer\
    \ points to integer variable\n    cout << *pPointerToValue; // dereferencing pointer\
    \ to show number variable\n    return 0;\n}\n```\n\nProgram Syntax: Understand\
    \ Memory Address and Data Pointing.cpp\n\n### Pointers and Addresses\n\nWhen you\
    \ create a pointer you’ll require to point to something, whether a variable or\
    \ a NULL value. If you forget to initialize a pointer it can cause problems for\
    \ the program and may even crash. This is because it produces a memory leak error.\
    \ Therefore, it’s wise to initialize a pointer, as in the previous example, even\
    \ as `NULL` (0) if you have nothing else to assign it too. Take another look at\
    \ how it’s done.\n\n```cpp\n// pointers initialized as NULL\nint *pMyPointer =\
    \ 0;\nint *pMyPointer = NULL;\n```\n\nKnowledge: Pointer Naming Convention\nPointers\
    \ can be assigned a legal name, just like a normal variable. With initializing\
    \ pointers it is good programming grammar to prefix the name of with a \"p\".\
    \ For example:\n```cpp\nint pMyPointer = NULL;\nint pAnotherPointer = 0;\n```\n\
    \n### The Dereference Operator\n\nWhen you use a dereference operator `*` on a\
    \ pointer, the value stored inside the indicated variables memory address is retrieved.\
    \ For example, if a program had an integer variable equalling to the value of\
    \ 33 and a pointer indicated to it, it could use a `cout` object and the deference\
    \ operator to display the variables value. Have a look at the following snippet.\n\
    \n```cpp\nint myAge = 33;\nint *pMyPointer = myAge;\ncout << *pMyPointer << endl;\n\
    ```\n\n### Dynamic Memory\n\n#### new\n\nThe `new` operator is the method for\
    \ allocating dynamic memory. You use the `new` keyword by assigning it with a\
    \ data type.\n\n```cpp\nint *pMyPointer = new int;\n```\n\nTo create an array\
    \ of new types you add an element number after the data type. You will learn about\
    \ arrays in chapter 11.\n\nHere is how it looks with an array of five elements.\n\
    \n```cpp\nint *pMyPointer = new int [5];\n```\n\n#### delete\n\nAfter you have\
    \ finished with a pointer you need to delete it from the program so that you don’t\
    \ get any memory leaks. Leaks in memory can cause your program to crash and even\
    \ have your memory before corrupted. So, not a good thing.\n\nTo delete a pointer\
    \ you simply use the `delete` keyword before the name of the pointer.\n\n```cpp\n\
    int *pMyPointer = new int;\ndelete pMyPointer;\n```\n\nTo delete a pointer that\
    \ points to a new array you place brackets after the keyword `delete`.\n\n```cpp\n\
    int *pMyPointer = new int [5];\ndelete[] pMyPointer;\n```\n\nChapter 10\n\n# References\n\
    \n## What is a Reference?\n\nIn C++ a reference is better known as an alias. This\
    \ means it can reference that data of another object under its own name. You will\
    \ see that this is extremely practical when it comes to passing the data objects\
    \ hold between different functions.\n\n## Create a Reference\n\nA reference in\
    \ C++ is created by writing out the type of object it accounts to (int, float,\
    \ char, etc), followed by the reference operator (`&`) and then the name you give\
    \ the reference. For example, below shows an example of how a reference is initialised\
    \ and aliases with the data of a variable called `target`.\n\n```cpp\nint target\
    \ = 5;\nint &targetRef = target; // references target variable\n```\n\nThat is\
    \ how a reference is coded in C++. Thus, when you initialise a reference you use\
    \ the name of the object that requires referencing, in this case the object name\
    \ is `target`. Now, let’s see what has happened. Once a reference has been initialised\
    \ by an object it is an alternative name for that target. Thus, if we were to\
    \ go:\n\n```cpp\ntargetRef++;\ncout << target << endl;\ncout << targetRef << endl;\n\
    ```\n\nThey would both equal to 6. This means that whatever is done to manipulate\
    \ he reference also changes the initial piece of data, i.e. `Target`.\n\nLet’s\
    \ look at a listing example of how the value is changed for both reference and\
    \ object, no matter what one is being used in the code.\n\nListing 10.0 – Reference\
    \ a Object.cpp\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main(){\n\
    \    int target = 5;\n    int &targetRef = target;\n    cout << \"The target is:\
    \ \" << target << endl;\n    cout << \"The target reference is: \" << targetRef\
    \ << endl;\n    cout << \"Increase target by 1: \" << ++target << endl;\n    cout\
    \ << \"Increase target reference by 1: \" << ++targetRef << endl;\n    return\
    \ 0;\n}\n```\n\nProgram Syntax: Reference a Object.cpp\n\n#### Object Reference\n\
    \nThe program references an object by first creating a variable called `target`\
    \ and assigning it the value of 5. Then a reference, using the Address of Operator\
    \ (`&`) is brought in to reference the variables.\n\nTechnical Talk: Reference\
    \ Name Conventions\nReferences are capable of using any type of legal name that\
    \ a variable or constant is allowed. However, many programmers prefix reference\
    \ names with the letter `r`.\n```cpp\nint rMyRef; // integer reference\n```\n\n\
    ### The Address of Operator for References\n\nWhen writing programs that include\
    \ references, you are required to ask for its address. The reason for this is\
    \ because of the method that references operator with the objects they alias.\
    \ To accomplish this. The address of operator is required to be employed with\
    \ any reference.\n\nKnowledge: The Address Of Operator (&)\nAmongst this book,\
    \ included this chapter, you have seen the `&` symbol used for different aspects\
    \ of programming. For references, this is known as the address of operator, which\
    \ is used to fetch the address of the object that the reference is aliasing.\n\
    \nListing 10.1 – Address Of Reference.cpp\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\nint main(){\n    float Decimal = 25.5;\n    int Number = 5;\n\
    \    float &rtodecimal = decimal;\n    int &rtonumber = number;\n    cout << \"\
    Decimal address: \" << &rtodecimal << endl;\n    cout << \"Number address: \"\
    \ << &rtonumber << endl;\n    return 0;\n}\n```\n\nProgram Syntax: Address of\
    \ Reference.cpp\n\n#### The Address of Operator\n\nThe `&` symbol is used in this\
    \ program to not show the value, but the memory address where the variable is\
    \ located in the computers RAM.\n\n## What Objects Can Referenced?\n\nNo matter\
    \ what objects you create in your programs, all of them can be used with references.\
    \ Although, do not go overboard in trying to reference everything that your program\
    \ has. You should only use references when they are required, else it is bad programming.\n"
  raw: 'For a beginner to C++, learning the notion behind pointers is the bane of
    their programming education. When the idea of messing with your computer’s memory
    is fixed in your head, there is a moment when you begin to become a little too
    cautious. It is totally understandable. And when using a pointer, essentially
    you are allowing the program code to mess with your computer’s memory. However,
    do not panic as it sounds worse than it truly stated.


    ### Memory Addresses


    When the discussion of variables came up in chapter three, you learned when a
    variable is created it is assigned a memory address.


    Well, to understand the full impact of how pointers operator with memory and their
    addresses, you’ll require a little more knowledge about memory.


    Created variables are stored in computer memory. Every integer, float, char, string,
    etc. is given a memory address location. These locations are sequentially numbered
    after one another.


    Due programs sorting and maintaining addresses of its given variables, the programmer
    doesn’t need to trouble about such complex matters. I.e. the program, if coded
    correctly, will do it.


    The next part of the program uses the Address of Operator to demonstrate how to
    obtain the information of a variable address and display it on screen.


    The Address of Operator is employed in programs to discover the memory addresses
    that holds a variable.


    Listing 9.0 – Understand Memory Address and Data Pointing.cpp


    | #include <iostream>using namespace std;int main(){    int number = 5; // integer
    variable    int *pPointerToValue = NULL; // initialized pointer to NULL    pPointerToValue
    = number; // pointer points to integer variable    cout << *pPointerToValue; //
    dereferencing pointer to show number variable    return 0;} |


    Program Syntax: Understand Memory Address and Data Pointing.cpp


    #### Pointers and Addresses


    When you create a pointer you’ll require to point to something, whether a variable
    or a NULL value. If you forget to initialize a pointer it can cause problems for
    the program and may even crash. This is because it produces a memory leak error.
    Therefore, it’s wise to initialize a pointer, as in the previous example, even
    as NULL (0) if you have nothing else to assign it too. Take another look at how
    it’s done.


    | // pointers initialized as NULLint *pMyPointer = 0;int *pMyPointer = NULL; |


    | Knowledge: Pointer Naming ConventionPointers can be assigned a legal name, just
    like a normal variable. With initializing pointers it is good programming grammar
    to prefix the name of with a"p". For example:int pMyPointer = NULL;int pAnotherPointer
    = 0; |


    ## The Dereference Operator


    When you use a dereference operator * on a pointer, the value stored inside the
    indicated variables memory address is retrieved. For example, if a program had
    an integer variable equalling to the value of 33 and a pointer indicated to it,
    it could use a cout object and the deference operator to display the variables
    value. Have a look at the following snippet.


    | int myAge = 33;int *pMyPointer = myAge;cout << *pMyPointer << endl; |


    ## Dynamic Memory


    ### new


    The new operator is the method for allocating dynamic memory. You use the new
    keyword by assigning it with a data type.


    | int *pMyPointer = new int; |


    To create an array of new types you add an element number after the data type.
    You will learn about arrays in chapter 11.


    Here is how it looks with an array of five elements.


    | int *pMyPointer = new int [5]; |


    ### delete


    After you have finished with a pointer you need to delete it from the program
    so that you don’t get any memory leaks. Leaks in memory can cause your program
    to crash and even have your memory before corrupted. So, not a good thing.


    To delete a pointer you simply use the delete keyword before the name of the pointer.


    | int *pMyPointer = new int;delete pMyPointer; |


    To delete a pointer that points to a new array you place brackets after the keyword
    delete.


    | int *pMyPointer = new int [5];delete[] pMyPointer; |


    Chapter 10


    # References


    ## What is aReference?


    In C++ a reference is better known as an alias. This means it can reference that
    data of another object under its own name. You will see that this is extremely
    practical when it comes to passing the data objects hold between different functions.


    ## Create a Reference


    A reference in C++ is created by writing out the type of object it accounts to
    (int, float, char, etc), followed by the reference operator ( & ) and then the
    name you give the reference. For example, below shows an example of how a reference
    is initialised and aliases with the data of a variable called target.


    | int target = 5;int &targetRef = target; // references target variable |


    That is how a reference is coded in C++. Thus, when you initialise a reference
    you use the name of the object that requires referencing, in this case the object
    name is target. Now, let’s see what has happened. Once a reference has been initialised
    by an object it is an alternative name for that target. Thus, if we were to go:


    | targetRef++;    cout << target << endl;cout << targetRef << endl; |


    They would both equal to 6\. This means that whatever is done to manipulate he
    reference also changes the initial piece of data, i.e. Target.


    Let’s look at a listing example of how the value is changed for both reference
    and object, no matter what one is being used in the code.


    Listing 10.0 – Reference a Object.cpp


    | # include <iostream>using namespace std;int main(){   int target = 5;   int
    &targetRef = target;   cout << "The target number is: " << target << endl;   cout
    << " The target reference number is: " << targetref << endl;   cout << "Increase
    target value by 1 = " << ++target << endl;   cout << "Increase target reference
    value by 1 = " << ++targetref << endl;   return 0;} |


    Program Syntax: Reference a Object.cpp


    #### Object Reference


    The program references an object by first creating a variable called target and
    assigning it the value of 5. Then a reference, using the Address of Operator (
    & ) is brought in to reference the variables value.


    | Technical Talk: Reference Name ConventionsReferences are capable of using any
    type of legal name that a variable or constant is allowed. However, many programmers
    prefix reference names with the letter r.int rMyRef; // integer reference |


    ## The Address of Operator for References


    When writing programs that include references, you are required to ask for its
    address. The reason for this is because of the method that references operator
    with the objects they alias. To accomplish this. The address of operator is required
    to be employed with any reference.


    | Knowledge: The Address Of Operator ( & )Amongst this book, included this chapter,
    you have seen the & symbol used for different aspects of programming. For references,
    this is known as the address of operator, which is used to fetch the address of
    the object that the reference is aliasing |


    Listing 10.1 – Address Of Reference.cpp


    | #include <iostream>using namespace std;int main(){   float Decimal = 25.5;  
    int Number = 5;   float &rtodecimal = decimal;   int &rtonumber = number;   cout
    << "Decimal address: " << &rtodecimal << endl;   cout << "Number address: " <<
    &rtonumber << endl;   return 0;} |


    Program Syntax: Address of Reference.cpp


    #### The Address of Operator


    The & symbol is used in this program to not show the value, but the memory address
    where the variable is located in the computers RAM.


    ## What Objects Can Referenced?


    No matter what objects you create in your programs, all of them can be used with
    references. Although, do not go overboard in trying to reference everything that
    your program has. You should only use references when they are required, else
    it is bad programming.'
