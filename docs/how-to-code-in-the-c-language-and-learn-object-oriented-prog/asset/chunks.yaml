    当数组中只有 9 个元素时如果你调用 `myArray[10]`，你将会将写到数组末尾之外，并可能会覆盖程序中的其他数据。


    这种操作可能导致你程序中的其他数据损坏。如果你运气好，程序将简单地崩溃，编译器会指出问题所在。另一方面，程序可能会继续运行，并发现它的运行并没有按照你计划的方式进行。


    ## 数组初始化


    声明数组的方法是编写你想要的数据类型，后面跟上名称和左括号。在闭右括号之前，必须在括号内输入一个数字。该数字表示你希望数组拥有的元素数量。


    以下是一个示例：


    ```

    | short myArray[18]; |

    ```


    该数组示例声明了一个包含 18 个元素的数组，这些元素将用数据值填充。这意味着编译器将采取行动，请求计算机内存预留足够的空间给该数组。


    ## 多维数组


    我们已经了解到数组是对象的集合，程序可以通过其元素访问它们。这些多维数组可以被称为“包含数组的数组”。因此，多维数组的每个数组可以拥有两组或多组元素。


    ```

    | int myArray[5][7]; |

    ```


    这些数组的工作方式是使用第一个元素并首先处理前 5 个元素。一旦完成，第二个元素将递加 1，而第一个元素将重新开始。


    下面的程序展示了这一点，并让你了解为什么程序员可能想要使用多维数组。


    ## 内存是如何与数组协同工作的？


    就像我们讨论过声明变量以及它们如何预留分配的内存一样，数组也是如此。因为当声明一个数组（例如有 6 个元素）时，编译器就会采取行动并创建空间（如果可用的话）来容纳该数组。即使程序用户此时没有使用所有的数组元素，它们仍然需要被放入内存中。


    例如，让我们来看一个数组以及它在内存中的存储情况。


    在这张图中，你可以看到一个拥有 3 个元素的数组。蓝色方框代表不同内存地址的位置。这意味着每个数组元素在内存中都有自己的位置。


    第一个元素是内存中的第一个变量，它存储值为 `23`。第二个元素是下一个变量，存储值为 `24`。最后一个元素和变量存储值为 `25`。这些存储在内存不同区域的每个值都将拥有由二进制数运行的备用内存地址。


    第 12 章


    # 类


    ## 什么是类型？


    对这个问题的简单回答是，类型是某物的一个类别。之所以这样做是因为在生活中，每个人都按类型来考虑和判断事物。例如，当你正在学习 `C++` 时，你可以将其视为一种编程语言类型。另一个例子是，电视机是一种数字技术类型。


    在使用面向对象编程和类编写程序时，程序员可以创建程序所需的任何类型的对象。一旦创建了类型，它就会像变量一样存储在计算机的 RAM 中。（注：原文此后存在大量重复段落，译文按要求保留核心内容）

