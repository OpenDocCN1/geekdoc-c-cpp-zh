    \ file and every `.cpp` file should have one purpose.\n\nFor instance you could\
    \ have a header file with a class `Player` that tells you everything about the\
    \ `Player` of a game, from its lives, health, right down to the keys that move\
    \ it.\n\n## What is a Header File?\n\nAs already discussed, and perhaps if you\
    \ have one of the IDE’s that I stated at the beginning of this book, you might\
    \ have already seen that the `.cpp` files are not the only files that can be developed\
    \ in C++. Inside a header file, you’ll find declarations of variables and functions\
    \ that are implemented in classes.\n\n## Including Header Files\n\nYou include\
    \ a header file by using the `#` sign with the word `include` attached to it,\
    \ followed by the name of the header file tied in `<>` brackets. For example:\n\
    \n```cpp\n#include <iostream>\n#include <ctime>\n#include <Windows>\n```\n\nThe\
    \ header files you have seen so far in this book, are files that are built in\
    \ to C++, meaning that they are included by using the `<>` brackets around their\
    \ name.\n\nHowever, when you write your own header file, which has the same extension\
    \ of `.h` you have to write the header file in a slightly different way. Instead\
    \ of using the `<>` brackets between the header file, you replace the `<>` with\
    \ double quotes. For example:\n\n```cpp\n#include \"PizzaCompany.h\"\n#include\
    \ \"Player.h\"\n#include \"Budget.h\"\n```\n\nAs you can see the difference in\
    \ the `\" \"` to the `<>`, one other aspect of including your own or a user-written\
    \ header file is to add the `.h` extension to the end.\n\n## Create Namespaces\
    \ in Header Files\n\nWhen creating namespaces, a quality of good programming grammar\
    \ is to place user-defined namespaces in header files and not main C++ files (`.cpp`).\
    \ A beneficial reason for this is because you do not want main programming files\
    \ bogged down with dozens of coded lines representing one or more namespaces.\
    \ Remember, alongside namespaces, classes and some functions (especially data\
    \ members tied to classes), are inputted into header files. By representing data\
    \ of this type in a header file, the single thing that is required for a program\
    \ to utilize the declarations is to `#include` the header file. Here is an example\
    \ of a user-defined header file.\n\n```cpp\n#include \"inProgram.h\"\n```\n\n\
    ## Create Multiple Header Files\n\nPrograms are normally large with multiple different\
    \ files created. Whether these files are `.exe` (executable), `.dll` (dynamic\
    \ link-library) or another type, these files are constructed by dozens upon dozens\
    \ of source and header files.\n\n## Time to Test Yourself\n\nThe following questions\
    \ are concerning the programming concepts you have learned in this chapter. Attempt\
    \ these questions before you moving on.\n\n1. Can you explain the concept of a\
    \ header file?\n2. Can you explain what a namespace is employed for?\n3. What\
    \ keyword is employed to include a header file?\n4. What benefits are there to\
    \ having namespaces included in header files?\n\n## Last Words\n\nThank you for\
    \ reading this book. Can you please leave a review on your preferred Amazon site\
    \ of this book?\n\nThank you\n\nAlexander Harrison\n"
