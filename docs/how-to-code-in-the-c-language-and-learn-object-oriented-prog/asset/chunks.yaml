    # 第 12 章：继承


    ## 什么是继承？


    继承是你面向对象编程训练的下一个阶段。就像人类从父母那里继承特征和态度，或者狗学会了会叫并且听力变得灵敏一样，C++ 使用继承的概念来允许被称为“派生类”的类从“基类”继承某些特性。


    让我们来看一张关注两个派生类的图，其中一个称为 `Chicken`（鸡），另一个称为 `Eagle`（鹰），它们派生自一个名为 `Bird`（鸟）的基类。


    如你所见，`Bird` 类拥的大部分属性 `Eagle` 都继承了，尽管 `Chicken` 不会飞，这给了我们一个自定义的错误信息“鸡不会飞”。


    C++ 这种这些链接关系的方法是让一个类从另一个类中获取数据。因此，这基本上意味着一个类可以将其功能贡献给另一个类以便单独使用。这被称为类派自基类。


    ## 派生与基类


    为了让你了解继承是如何工作的，我们将查看派生类和基类并观察它们的示例。为了做到这一点，我们将忽略 `Bird`、`Chicken` 和 `Eagle` 类，查看一个显示公司员工工资的程序。


    当你从基类派生时，必须先声明该类，否则程序将抛出编译错误。


    ### 公共（Public）与保护（Protected）——区别


    由于我们处于面向对象编程的第二阶段，我们将查看第三个也是最后一个可以添加甚至替换类私有（private）访问饰符。`protected` 关键字位于私有和公共之间。


    与其锁定数据或允许对象公开使用数据，不如在 `protected` 访问饰符标题下的任何内容都允许任何基类对象和任何派生类对象使用该数据。


    因此，如果我们回到鸟、鸡和鹰的例子，我们可以将所有希望基类搜索的内容都放在 `protected` 访问饰符下。如果基类同时具有私有访问饰符和公共访问饰符，那么私下的任何内容都无法被派生类搜索。


    ## 构造函数与析构函数


    当程序调用派生类构造函数时，它将首先调用基类构造函数，然后调用派生类构造函数。因此，在销毁对象时，必须告诉程序先销毁派生类对象，然后是基类对象。如果不这样做，你的程序可能会产生内存泄漏，我们我们在指针章节中知道，这对你的计算机是多么低效。


    ## 重写数据方法


    重写数据方法是一种概念，即派生类如果有一个在类型、名称和参数上与基方法相同的数据方法，它可以重写该基方法。


    看下方的程序。


    ## 调用基方法


    当基方法被重写时，仍然可以从程序中调用它。这样做的方法是编写派生对象，然后加上点运算符，紧跟隐藏的基类对象以及带有该方法的两个对象。


    ```

    Eye.HumanBody::SetSight();

    ```


    这将允许 `HumanBody` 的 `SetSight` 方法被调用。


    # 第 14 章：多态


    ## 什么是多态？


    多态背后的概念可以通过简单的例子来解释。让我们拿一台带有免费电缆和文字电视的 15 英寸平均电视。你可以使用类和继承在一个简单的示例中使用它。


    正如所有的编程书籍所告诉的那样，`poly` 意味着更多，而 `morphisms` 意味着改变。这意味着你可以通过与其他另一个变形来给对象添加更多内容。所以，让我们先为电视也为
    DVD 创建一个对象。


    ```

    Television TV;DVD Player;

    ```


    现在，由于 `DVD` 派生自 `Television`，你可以创建一个 `DVD` 对象并使用 `Television` 数据方法 `channels`。


    ```

    Player = new *TelevisionPlayer->OnSwitch()

    ```


    ## 虚方法


    现在我们将查看虚方法如何帮助程序决定使用来自基类的对象还是派生类的对象。你通过在方法前加上 `virtual`（虚）关键字来创建一个虚方法。这样做之后，基类中设置的虚函数能够被其派生类的替代方案重写。如果你对派生类使用指针并将其指向一个虚的基类，那么派生类就可以重写方法以使用派生类方法。它是通过查找所谓的“限定名查找”（qualified
    name lookup）来实现的。


    ```

    virtual bool OnSwitch();

    ```


    ## 虚方法的访问代价


    世界上不再有免费午餐了，使用 C++ 编程和处理内存也是如此。当创建一个对象并使用虚方法时，计算机内存中存在一种代价——一种开销。这就是程序员应该确保为该对象创建构造函数和析构函数的地方。


    在创建其对象将使用多态和虚方法的派生类时，有一个需要考虑的词。这是为了确保该类被用于正当原因，即：如果派生类非常微小，那么创建一个派生自另一个类的类是没有意义的。下面的示例是一个糟糕的派生类以及一个普通的基类的反例：


    ```

    class Player { // 大量的方法和变量};

    class HealthPotion { // 只有 1 个方法和 2 个变量};

    ```


    或许重写 `HealthPotion` 类并转而将其放入一个填充了其他内容的 `Potion` 类中是明智的。


    ```

    class Potion {float HealthPotion(); HealthGain(); ManaGain();};

    ```


    ## 抽象数据类型


    在使用类编写程序时，你可能希望创建一个作为其他底层类层级的主类。例如，如果我们取一个名为 `Food`（食物）的主类，我们就可以从它构建出底层类，并分配给不同类型的食物。


    ```

    class Food {public:virtual Double CalorieAmount(int amount) = 0;virtual Double
    FatAmount(int amount) = 0;protected:double amount;};

    class Orange {public:virtual Double CalorieAmount(int amount);virtual Double FatAmount(int
    amount);protected:double amount;};

    class Chocolate {public:virtual Double CalorieAmount(int amount);virtual Double
    FatAmount(int amount) ;protected:double amount;};

    ```


    我们可以看到，在这里三个类中，有两个派生自 `Food` 类。因此，这意味着能够访问高类中的函数。然而，在这个例子中，高类拥有纯虚函数的数据方法。它们之所以是因为在函数声明的末尾，它们通过等于
    `0` 变为抽象的。


    这意味着底层类必须有自己的虚函数来工作。


    ```

    警告：没有抽象对象

    在创建抽象类时，你实际上是在告诉编译器你不能创建该类的对象。因此，以下代码将抛出错误。

    Food pie; // 因为 Food 类是抽象的

    ```


    然而，尽管抽象类不允许创建对象，但你仍然可以指向抽象类的程序指针和引用。这样做有什么意义呢？


    嗯，通过引用或指向抽象类，它允许运行时多态。


