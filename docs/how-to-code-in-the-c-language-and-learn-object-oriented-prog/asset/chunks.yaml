    # Introduction


    “By Failing To Prepare, You Are Preparing To Fail.”

    (Benjamin Franklin)


    “Success is not final, failure is not fatal: it is the courage to continue that
    counts.”

    (Winston Churchill)


    ## Ready for C++ Programming?


    Congratulations for taken aboard the decision to learn the `C++` programming language.
    You are someone special for having the desire to learn the mechanics and syntaxes
    of an extremely powerful computer programming language.


    I am going to assume you identify the basic use for a computer programming language.
    Since this book focuses on the `C++` language, I am also going to assume you have
    a general, but perhaps imprecise, notion of the power the programming language
    can produce.


    No matter what circumstances you have for purchasing or borrowing this book from
    the Kindle store, I guarantee it’ll help you on the road to learning `C++`.


    ## What You’ll Learn in this Book


    Inside `C++ Programming Made Simple for Beginner’s`, there is a wealth of programming
    knowledge to learn. Whether you have simply started to learn `C++` or are a little
    knowledgeable about the language, you’ll discover something new. Written to help
    wannabe-programmers, the book examines the basics and teaches core fundamentals
    required to build programs. The topics contained in the book includes:


    *   Constants.

    *   Functions.

    *   Object-Oriented Programming (OOP).

    *   Program Design.

    *   Statements.

    *   Variables.

    *   And Much More…


    The book opens with the basics of `C++`, via the old `C` language. `C++ Programming
    Made Simple for Beginner’s` does not require any prior knowledge of `C`, `C++`
    or any computer language. However, any knowledge you might have will certainly
    help to understand `C++` effectively. Don’t get totally confused though. this
    book does not ask much, but it does hope you are not entirely technologically
    impotent and you understand the basics of operating a computer, from opening files
    to accessing the internet.


    ## How this Book is Laid Out


    I am not going to pretend and declare `C++` is an easy language to learn, as it
    blatantly isn’t. To help absorb and become adept at writing code, each chapter
    has numerous programming examples to replicate. Each example is built as a Win32
    console application, meaning it has a text-based interface, which operates without
    the power of `Windows API`. For a `C++` beginner, using a Win32 console is good
    to start building on.


    By understanding the information and code examples from each chapter, the next
    one will seem easier to grasp. For example, in, Chapter 03: Data Storage, Variables
    and Constants you attain the knowledge to use program variables and understand
    how to store them in computer memory. Then at Chapter 04: Basic Operators, by
    using the knowledge read about in the previous chapter, you’ll find it easier
    to understand the data types capable of serving different varieties of mathematical
    operators.


    If you are a beginner, then this book will certainly have an abundance of information
    for for you. On the other hand, if you have purchased this book to use as a reference
    guide, then it will help you rediscover programming topics you have mislaid in
    your memory, such as variables, operators and functions.


    ## Conventions and Practices


    Amongst the pages of this book, you’ll discover three bold titles focusing on
    programming techniques. The following illustrates the titles spread out amongst
    the numerous pages.


    | Programming KnowledgeThese boxes are filled with necessary information, which
    can help to enhance your knowledge of the `C++` language. |

    | Programming Technical TalkThese boxes are for the “geek” inside us, which desires
    to learn and absorb the information of in-depth `C++` programming concepts. |

    | Programming WarningsThese boxes point out dangerous areas that a programmer
    should be aware of before attempting to code something, via a certain programming
    concept. |


    # Chapter 01


    # C++ Program Design


    ## Program and Design Software


    The initial attribute in regards to building computer programs is the ability
    to understand software design. There is no point in learning `C++` and not having
    an awareness of how to design programs. Hence, software design forms the basis
    of developing programs.


    ## Two Hour Pen and Paper Brainstorm Method


    The best practise to finish a design – whether it be software design or some other
    form – is to throw questions left, right and centre at it. This is the stage I
    call "The Two Hour Pen & Paper Brainstorm Method", because when you begin to throw
    program design concepts at a blank canvas, you require a productive attitude.


    The designs you scribble down are the beginning of a blueprint. Nonetheless, don’t
    think when drafting a blueprint every line of code is required. If anyone was
    to sit down and draw out a blueprint for a piece of software by writing every
    line of code, it would take forever and they would be forced into a complete muddle.
    In short, they would end up throwing the idea in the bin, or begging for the men
    in white coats to escort them away.


    ## Why Should I Design Programs Before Writing Code?


    The primary stages of learning `C++` might raise several questions such as, "Why
    is it better to construct design blueprints for your programs before writing a
    line of code?" Well, that is a good question, one that bewilders the handful of
    budding programmers. No matter the computer language, beginners who opt to learn
    programming choose to study the language nuts-and-bolt (programming syntax), instead
    of being swayed to learn the principles of both program design and programming.

