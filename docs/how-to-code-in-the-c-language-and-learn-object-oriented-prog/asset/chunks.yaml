    # 模板


    ### 什么是模板？


    在最初开发时，模板的概念从未出现在 `C++` 中。`C++` 发布后又过了几年，直到 `C++03` 发布时才引入了它。


    泛型编程（Generic programming）是我们在讨论 `C++` 模板时使用的一个术语。之所以这样做是因为模板允许程序员创建以泛型类型操作的函数和类。这些泛型类型可以替换函数或变量的普通类型。因此，你可以按照意愿重命名一个类型——避开
    C++ 关键字——并让该类型用于不同类型的数据。


    首先，我们需要知道如何声明一个模板。模板声明将位于函数或类的标题上方。


    | // template 的语法：template <typename identifier_name> // 使用 typename |

    | | template <class identifier_name> // 使用 class |


    查看下方的简单类模板示例。它展示了如何在类中使用模板以及在类内部使用函数变量。


    ```cpp

    template<typename T>class Player{public:T CountLives(); // 使用模板中泛型类型 T 声明的数据方法
    typenameprivate:T Lives; // 使用模板中泛型类型 T 声明的数据变量 typename};

    ```


    在 `C++` 中实际上有两种主要的模板类型：函数模板和类模板。


    ### 模板的实例


    #### 函数模板


    泛型模板与普通函数非常相似。它们也被称为模板函数。无论你为它们起什么名字都行，因为它们的意思相同。两者的区别在于，模板函数可以接受不同类型的参数。这意味着通过该函数，同一个参数可以用于不同的数据类型。请查看下方是如何声明模板的。


    ```cpp

    Template<typename identifier_name> // 模板类型函数 _name(参数) {//函数语句}

    ```


    所以，如果我们有两个类型为 `bool` 和 `int` 的函数，并且我们希望用模板中的泛型类型替换它们，我们可以这样写：


    ```cpp

    Bool myBoolFunction();Int myIntegerFunction();Template <typename T> T myBoolFunction();Template
    <typename T> T myIntegerFunction()

    ```


    上方你可以看到相同的两个函数。左侧是未通过模板泛型类型化的函数。右侧，两者都经过了泛型类型化。字母 `T` 现在充当这些函数的数据类型。在 `bool` 函数中，它充当
    `bool`；在 `int` 函数中，它充当整数数据类型。


    注意，在模板声明中，泛型类型是作为参数传递的：`<typename T>`。`typename` 之后的 `T` 仅被视为占位符，可以用于替换函数的数据类型。`C++`
    做的技巧是检查函数，并根据其返回类型决定将占位符 `T` 更改为 `T` 实际位置的任何数据类型。在编写代码时，你可以将 `typename T` 视为数据类型的替代品。在下一章关于标准模板库（Standard
    Template Library）中，你会看到无论类型是什么，`C++` 中使用的大量算法都是以相同的方式执行——或编写——的。


    注意：你可能看到函数名与模板定义在同一行。由于 `C++` 中空格是无效的，且模板没有行尾终止符（即分号），函数名不需要与模板在同一行。它只需要在模板声明之后出现即可。


    这两个示例都是正确的：


    ```cpp

    Template <typename T> void trialTemplate();Template <typename T>void trialTemplate();

    ```


    在第二个示例中，需要注意的是，你在模板声明和函数之间不能放置任何内容。


    ```cpp

    template <typename T>string myTemplate = “My Template”;void trialTemplate();

    ```


    ### 两个或多个泛型类型的模板


    我们现在已经学习了模板以及它们如何帮助你为函数创建泛型类型。现在，我们将观察如何在一个模板中拥有不同的泛型类型集合。


    通过使用逗号运算符 `‘`，你可以在模板内部定义两个或多个泛型类型，并在函数模板中使用。例如，查看该模板定义。


    ```cpp

    template <typename T, typename Y>void myFunction(T temp1, Y temp2){cout << “Here
    are the typnames from the template: “ << temp1 << “ and “ << temp2 << “.\n”;}int
    main(){myFunction 50, “is the number fifty” );myFunction( true, 18.40f );return
    0;}

    ```


    ### 模板背后的魔法


    在创建模板时，你实际上允许编译器创建处理该函数实例所需的各种类型的函数。


    ### 重载泛型函数


    泛型函数确实具有重载自身的能力。尽管，你可以显式地重载它，这被称为显式特化（Explicit Specialization）。当泛型函数被重载时，它将重载泛型版本。


