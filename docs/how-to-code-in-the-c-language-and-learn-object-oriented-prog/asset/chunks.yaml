    \ displaying their values.\n\nListing 3.8 – Constant Custom.cpp\n\n| #include\
    \ <iostream>using namespace std;int main(){              // create an enumerated\
    \ set of constants              enum CUSTOM { MON = 22, TUES = 28, WED = 34, THURS,\
    \ FRI = 22 };              // displays values of each enumerated constant             \
    \ cout << \"Number of customers shopping each weekday\" << endl;             \
    \ cout << \"Monday: \" << MON << endl;              cout << \"Tuesday: \" << TUES\
    \ << endl;              cout << \"Wednesday: \" << WED << endl;              cout\
    \ << \"Thursday: \" << THURS << endl;              cout << \"Friday: \" << FRI\
    \ << endl;              return 0;} |\n\nProgram Syntax: Constant Custom.cpp\n\n\
    #### The enum Constant\n\nA set of enumerated constants is created near the beginning\
    \ of the program. These signify the days of the week and gives information about\
    \ the amount of customers that enter a shop and purchase something. Each day,\
    \ apart from THURS, has a value, which is displayed individually a couple of lines\
    \ down in the program.\n\n## Time to Test Yourself\n\nThe following four questions\
    \ are in regards to what you have just learned about programming in C++. Attempt\
    \ these questions before you move forward to the next chapter.\n\n| Test Yourself\
    \ \n\n1.  Can you name all of the data types talked about in this chapter?\n\n\
    2.  What is the differences between unsigned and signed?\n\n3.  Can a constant\
    \ change its value?\n\n4.  How many bits in a whole byte?\n\n |\n\nChapter 04\n\
    \n# Basic Operators\n\n## What is an Operator?\n\nAn operator is a written symbol\
    \ that aids in helping other forms, like variables and constants, to take action.\
    \ There are different forms of operators in C++ that have their own sub-groups.\n\
    \nThe list of operators are below:\n\n*   Assignment Operator.\n\n*   Mathematical\
    \ Operators.\n\n*   Increment & Decrement Operators.\n\n*   Pre- & Post-Fix Operators.\n\
    \n*   Logical Operators.\n\n*   Rational Operators.\n\nIn this chapter you will\
    \ learn four types of these operators, which include:\n\n*   Assignment Operator.\n\
    \n*   Mathematical Operators.\n\n*   Increment & Decrement Operators.\n\n*   Pre-\
    \ & Post-Fix Operators.\n\n## Mathematical Operators\n\nAn assignment operator\
    \ is used for the purpose of defining certain pieces of data, like two variables,\
    \ and assigning the result they give to another piece of data. The way you write\
    \ this depends on what type you are defining the data to. When you use a variable\
    \ to equal a value we look at it from the right to left, meaning that the data\
    \ that is being equalled to can be on the left side. This is known as an l-value,\
    \ and an operand on the right side is known as an r-value.\n\nThere are a range\
    \ of mathematical operators in C++, much like any other programming language.\
    \ There is the addition (+), subtraction (-), multiplication (*), division (/)\
    \ and modulus (%).\n\nMost of these will be pretty obvious to understand. You\
    \ must have learnt at least four of these in your school days, yet the modulus\
    \ operator may allude you a bit.\n\nThe modulus operator returns the remainder\
    \ of a sum. Therefore, the following when return the value of 1.\n\n| int mod\
    \ = 16 % 5 |\n\n;\n\nListing 4.0 – The Modulus Operator.cpp\n\n| #include <iostream>using\
    \ namespace std;int main(){              cout << \"Hello Programmer! Time to do\
    \ some C++ maths.\" << endl;              int value1 = 11; // assigns a value             \
    \ int value2 = 2;              int valueTotal = value1 % value2; // modulus operator\
    \ working with two variables to give another an answer              cout << \"\
    The total value of the two sums are: \" << valueTotal << endl;              cout\
    \ << \"Now let us multiply that by another 100.\" << endl;              valueTotal\
    \ = valueTotal * 100;              cout << \"Now the value total is: \" << valueTotal\
    \ << \" WOOHOO!!!\" << endl;              return 0;} |\n\nProgram Syntax: The\
    \ Modulus Operator.cpp\n\n#### The % Operator\n\nThe program uses the modulus\
    \ operator to find the remainder of two values. After displaying the result for\
    \ the user to see, the program then multiples the remainder of the modulus result\
    \ by one hundred, giving the result of 100.\n\n## Problems with Division and Integers\n\
    \nOne other aspect that I want to bring attention to is using the division operator\
    \ with an integer. When you do division athematic it is not always best to use\
    \ integers. The reason is shown below.\n\n| int firstNumber = 30;float secondNumber\
    \ = 10.2;int number = firstNumber / secondNumber; // returns inaccurate result\
    \ |\n\nThe result of this would be 2.94, although because the variable number\
    \ that holds the result is an integer it rounds of the number, as integers cannot\
    \ hold decimal point numbers. Thus, this gives an inaccurate result.\n\nThe best\
    \ way to do this is by changing the variable number to a float.\n\n| int firstNumber\
    \ = 30;float secondNumber = 10.2;float number = first / 10.2; // returns accurate\
    \ result |\n\nListing 4.1 – Basic Maths.cpp"
