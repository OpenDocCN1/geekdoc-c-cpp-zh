  trans: "\n\n当一个常量被赋值为一个带有名称的值时，例如将一个名为 `pocketMoney` 的变量赋值为 `44`，那么它就被称为**符号常量**（symbolic\
    \ constant）。因为与直接接收具体值的字面常量不同，符号常量赋值的是一个值的表示形式，而是一个直接的值。\n\n`| int pocketmoney\
    \ = 44;const int thismonth = pocketMoney; |`\n\n我将这个变量和常量放入一个程序中，向你展示它们是如何工作的。这是一个小型程序，我知道使用常量的方法有比这种简单演示更好的方法。然而，它展示了符号常量的基本概念。\n\
    \n### 列表 3.7 – Pocket Money.cpp\n\n```cpp\n# # include <iostream>\nusing namespace\
    \ std;\nint main(){\n    int pocketMoney = 14;\n    const int THISMONTH = pocketMoney;\
    \ // variable is same as const  \n    cout << \"This month the pocket money I\
    \ received was \" << THISMONTH << \" pounds.\" << endl;\n    return 0;\n}\n```\n\
    \n### 程序语法：Constant Values.cpp\n\n#### const 对象\n`const` 关键字创建一个整数变量的常量数据类型。例如，在上面的程序中有一个名为\
    \ `THISMONTH` 的常量整数，它被赋值为一个带有值 `14` 的变量。通过将数据类型赋值为常量，该数据类型的值在整个程序过程中不能被更改。\n\n\
    #### 变量到常量\n在程序中，通过赋值运算符将变量值放入常量，赋值运算符将在章节中介绍。实现这一方法的原因是 `C++ 从右到左读取其许多命令`。因此，右侧变量\
    \ `pocketMoney` 的值被复制到新创建的名为 `THISMONTH` 的常量中。\n\n## 枚举 (Enumerated)\n枚举常量是更多常量的基础或构建块。这听起来可能很费解，但通过下面的示例，我们可以看到它是如何工作的。\n\
    \n`| enum COLOURS {red, blue, green, black}; |`\n\n在示例中，`COLOURS` 是主常量，就像父节点一样。括号中的常量就像父节点的节点。括号中的常量每个都有一个值。在像下面这样写出枚举常量时，可以设置这些值。\n\
    \n`| enum COLOURS {red = 100, blue = 200, green = 250, black = 500}; |`\n\n对于值每次翻倍并没有逻辑上的解释。我只是为了示例那样写了它们。相反，你可以这样：\n\
    \n`| enum COLOURS {red = 100, blue = 101, green = 20, black = 50}; |`\n\n你并不总是需要为括号中的每个常量设置值。相反，它们可以像这样：\n\
    \n`| enum COLOURS {red = 100, blue = 200, green, black = 500}; |`\n\n这意味着只有三个常量被赋予了值，但编译器也会自动为\
    \ `green` 设置一个值，该值比 `blue` 的值大一，因为它在列表中位于其之后。\n\n下面是一个使用枚举常量并显示其值的示例程序。\n\n###\
    \ 列表 3.8 – Constant Custom.cpp\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nint main(){\n    // 创建枚举常量集合\n    enum CUSTOM { MON = 22, TUES = 28, WED\
    \ = 34, THURS, FRI = 22 };\n    // 显示每个枚举常量的值\n    cout << \"Number of customers\
    \ shopping each weekday\" << endl;\n    cout << \"Monday: \" << MON << endl;\n\
    \    cout << \"Tuesday: \" << TUES << endl;\n    cout << \"Wednesday: \" << WED\
    \ << endl;\n    cout << \"Thursday: \" << THURS << endl;\n    cout << \"Friday:\
    \ \" << FRI << endl;\n    return 0;\n}\n```\n\n### 程序语法：Constant Custom.cpp\n\n\
    #### enum 常量\n一组枚举常量在程序开头创建。它们代表了一周的几天，并提供了关于进入商店购买东西的人数的信息。\n\n### 自我测试\n一组枚举常量在程序开头创建。它们代表了一周的几天，并提供了关于进入商店购买东西的人数的信息。\n\
    \n以下问题与你学到的有关：\n\n1. 无符号（unsigned）和有符号（signed）的区别是什么？\n2. 常量可以改变吗？\n3. 有多少种类型？\n\
    \n## 运算符 (Basic Operators)\n运算符用于执行操作。`C++` 中有很多类型的运算符：\n\n- 赋值运算符\n- 数学运算符\n\
    - 增量/减运算符\n- 逻辑运算符\n- 关系运算符\n\n### 数学运算符\n数学运算符用于执行计算。它们包括：\n- `+`（加法）\n- `-`（减法）\n\
    - `*`（乘法）\n- `/`（除法）\n- `%`（取模）\n\n### % 运算符\n模运算符 `%` 返回除法的余数。例如，`int mod = 16\
    \ % 5;` 结果为 `1`。\n\n### 列表 4.0 – Modulus Operator.cpp\n\n```cpp\n#include <iostream>\n\
    using namespace std;\nint main(){\n    cout << \"Hello Programmer! Time to do\
    \ some maths.\" << endl;\n    int value1 = 11; // assigns a value\n    int value2\
    \ = 2;\n    int valueTotal = value1 % value2; // 运算符作用于两个变量得到答案\n    cout << \"\
    The total value of the sums are: \" << valueTotal << endl;\n    cout << \"Now\
    \ let us multiply that by 100.\" << endl;\n    valueTotal = valueTotal * 100;\n\
    \    cout << \"Now the value total is: \" << valueTotal << \" WOOHOO!!!\" << endl;\n\
    \    return 0;\n}\n```\n\n程序语法：Modulus Operator.cpp\n\n#### 除法与整数的问题\n我想引起大家注意的另一个方面是与整数使用除法运算符。当你进行数学除法时，使用整数并不总是最好的。原因如下所示。\n\
    \n`| int firstNumber = 30;float secondNumber = 10.2;int number = first / secondNumber;\
    \ // 返回不准确的结果 |`（注：原文此处为 `first` 而非 `firstNumber`，保留原文）。\n\n此的结果将是 `2.94`，但由于存储结果的变量是整数，它会舍去小数，因为整数无法持有小数。因此，这得到了不准确的结果。\n\
    \n此此的最佳方法是将变量类型改为 `float`。\n\n`| int firstNumber = 30;float secondNumber = 10.2;float\
    \ number = first / 10.2; // 返回准确的结果 |`\n\n### 列表 4.1 – Basic Maths.cpp\n\n"
- fmt: "\n```cpp\n#include <iostream>\nusing namespace std;\nint main(){\n    cout\
    \ << \"Time for some mathematics.\" << endl;\n    int integerValue1 = 15;\n  \
    \  int integerValue2 = 45;\n    cout << \"Sum 1: 15 + 45 = \" << integerValue1\
    \ + integerValue2 << endl;\n    float floatValue1 = 161.2;\n    float floatValue2\
    \ = 9.23;\n    cout << \"Sum 2: 161.2 - 9.23 = \" << floatValue1 - floatValue2\
    \ << endl;\n    int integerValue3 = 2;\n    int integerValue4 = 12;\n    cout\
    \ << \"Sum 3: 2 * 12 = \" << integerValue3 * integerValue4 << endl;\n    float\
    \ floatValue3 = 17.2;\n    float floatValue4 = 22.2;\n    cout << \"Sum 4: 17.2\
    \ / 22.2 = \" << floatValue3 / floatValue4 << endl;\n    return 0;\n}\n```\n\n\
    Program Syntax: `Basic Maths.cpp`\n\n### The + Operator\n\nOur first operator\
    \ is the addition operator. This is probably the first operator you learned in\
    \ school. It simply acts that way in C++ . It simply takes two variables and assigns\
    \ the result to another.\n\n### The – Operator\n\nThe minus operator takes another\
    \ two integers and assigns them to another. The value of the third integer is\
    \ then displayed.\n\n### The * Operator\n\nThe multiplication operator is again\
    \ one of those basic operator you would have used in school. In this program,\
    \ it takes two integers and assigns the value to another.\n\n### The / Operator\n\
    \nThe final operator to be used is the division operator. This uses `float` variables\
    \ as if integer variables are employed in place of `float`, then the result can\
    \ be inaccurate.\n\nMost of this program will take you back to those days in the\
    \ mathematics class – whether you loved or loathed them – and they are pretty\
    \ easy.\n\n## Mix Assignment Operator with Math Operators\n\nIn the previous example\
    \ I had an example of three variables using the assignment operator. This is a\
    \ great wait of storing an extra value into your program, but when you need to\
    \ change one of only two variables in a program it is possible to have that variable\
    \ equal to itself with another value. Like so:\n\n`firstNumber = firstNumber +\
    \ secondNumber;`\n\nThis means that the two variable are adding together and then\
    \ the l-value (on the left hand side) variable stores a new value in itself. Furthermore,\
    \ there is a shorthand version to write the code, which is used by professional\
    \ programmers.\n\n`firstNumber += secondNumber;`\n\nThis simply means the same\
    \ as the result before. Even though the addition sign and the assignment operator\
    \ has switched places, it still means the same.\n\n`// this is firstNumber = firstNumber\
    \ - secondNumber;\nfirstnumber -= secondNumber;`\n\n## Increment and Decrement\n\
    \nTwo operators that always use numerical values are the increment and decrement\
    \ operators. In programming, the most common value to add or subtract to is the\
    \ number 1. `++` has a method for accomplishing this.\n\nTo increase the value\
    \ by 1 the method used is the increment operator.\n\n`int number++;`\n\nThe other\
    \ method is decrement, which does the exact opposite and subtracts 1 from the\
    \ current value.\n\n`int number--;`\n\n## Pre- and Postfix Operators\n\nAlong\
    \ with the increment and decrement operators, another two operators that work\
    \ with numerical values are the prefix and postfix operators.\n\nThe difference\
    \ between these two is where the increment and decrement symbols are placed on\
    \ the variable and how they act with it.\n\nThe prefix operates by increasing\
    \ or decreasing the value of the variable first before displaying it. This is\
    \ why the operator symbols are attached before the name of the variable.\n\n`++number;`\n\
    \nThe postfix operator works the other way around and is placed the opposite way.\
    \ If we are trying to display the variable on screen and then decrease the value\
    \ before displaying it again it would look like this.\n\n`cout << number << endl;\n\
    number--;\ncout << number << endl;`\n\nThe variable name comes initially before\
    \ the postfix operator. This means that the pre- and postfix operators read from\
    \ left to right. In the example of the prefix, it reads the operators first (`++`)\
    \ then the variable name (`number`).\n\nListing 4.2 – `Pre- and Postfix.cpp`\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nint main(){\n    int decrementValue\
    \ = 10;\n    int incrementValue = 0;\n    int prefixValue = 5;\n    int postfixValue\
    \ = 5;\n    cout << \"When we increase the prefix value from 5 it begins at: \"\
    \ << ++prefixValue << endl; //prefix value\n    cout << \"When we increase the\
    \ postfix value from 5 it begins at: \" << postfixValue++ << endl; // postfix\
    \ value\n    cout << \"When we increment the value of 0 using a postfix operator\
    \ it begins at: \" << incrementValue++ << endl; // incrementing value\n    cout\
    \ << \"When we decrement the value of 10 using a prefix operator it begins at:\
    \ \" << --decrementValue << endl; // decrementing value\n    return 0;\n}\n```\n\
    \nProgram Syntax: `Pre- and Postfix.cpp`\n\n### Prefix Operator\n\nThe prefix\
    \ operator takes a numerical piece of data, like an integer, and either increases\
    \ or decreases the value of the data by one. To achieve this the operator signs\
    \ `++` or `--` must prefix the name of the variable it is acting upon.\n\n###\
    \ Decrement Operator\n\nThe decrement operator takes an integer value and decreases\
    \ the value of that variable by one.\n\n### Increment Operator\n\nThe increment\
    \ operator takes an integer value and increases the value of that variable by\
    \ one.\n\n### Postfix Operator\n\nThe postfix operator works the other way around\
    \ and is placed the opposite way. If we are trying to display the variable on\
    \ screen and then decrease the value before displaying it again it would look\
    \ like this.\n\n## Operators and Precedence\n\nIn any language, one of the biggest\
    \ aspects that beginners struggle with is the notion of precedence. This means\
    \ that the operators used in a line have a certain order. If we were to take sum\
    \ = 4 * 3 % 2 - 1`\n\nThe idea C++ has of looking at this figure to give sum its\
    \ answer is by doing:\n\nStep 1: `4 * 3 = 12`\nStep 2: `12 % 2 = 6`\nStep 3: `4\
    \ + 6 = 10`\nStep 4: `10 - 1 = 9`\n\nSo, at the end of the figure, the answer\
    \ sum store in variable is 9. However, say you wanted the 4 + 4 to be the first\
    \ to compute then subtract by 1. You would use parentheses around the numbers\
    \ you wanted to compute.\n\n`sum = ((4 + 4) * 3) % 2;`\n\nThis changes the sum\
    \ as it now follows:\n\nStep 1: `4 + 4 = 8`\nStep 2: `8 - 1 = 7`\nStep 3: `7 *\
    \ 3 = 21`\nStep 4: `21 % 2 = 10`\n\nIf in the last step the data type of sum was\
    \ an integer, it would round down to 10. But as you can see, due to parentheses\
    \ it changes the environment of the precedence being computed.\n\nListing 4.3\
    \ – `Precedence.cpp`\n\n```cpp\n#include <iostream>\nusing namespace std;\nint\
    \ main(){\n    cout << \"In C++ operators have an order of precedence.\" << endl;\n\
    \    int notPrecedence = 4 + 2 / 2 - 5; // does not use precedence\n    int isPrecedence\
    \ = (4 + 2) * 3 / (5 - 2); // does use precedence two different results displayed\n\
    \    cout << \"Without any precedence the value is: \" << notPrecedence << endl;\n\
    \    cout << \"With precedence the value is: \" << isPrecedence << endl;\n   \
    \ return 0;\n}\n```\n\nProgram Syntax: `Precedence.cpp`\n\n### Precedence\n\n\
    The precedence in this program determines what sums will be challenged first.\
    \ The brackets around the certain numbers is what determines that they will be\
    \ acted upon first.\n\n## Time to Test Yourself\n\nThe following four questions\
    \ are in regards to what you have just learned about programming in C++. Attempt\
    \ these questions before you move forward to the next chapter.\n\n1.  What does\
    \ the modulus operator achieve?\n"
