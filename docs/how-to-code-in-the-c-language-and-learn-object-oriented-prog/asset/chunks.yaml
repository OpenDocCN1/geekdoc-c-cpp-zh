    # Header and Namespaces Files


    Topics You Will Learn In This Chapter Includes


    ### What is a Namespace?


    The subject of namespaces has been left late in this book. Although, there is
    nothing really complex about namespaces that makes programming them any more difficult
    than the information you have already read.


    A namespace is like a box for a function or class, which seals its objects from
    confusion with other objects outside the namespace that have the same name.


    Let me give you an example. Let’s imagine there is a fast-food franchise called
    Pizza Galore who are in two cities – New York and London – and they serve two
    types of pizza. One pizza is called the Meat Feast and the other is the Ham and
    Pineapple. you can use the names of the cities as the name of our namespaces.
    They could be called:


    ```cpp

    namespace PizzaGaloreNY;namespace PizzaGaloreLdn;

    ```


    With these two namespace you can help the program distinguish between the two
    types of pizza’s that each franchise makes depending on the city. Inside the namespace
    block, you can have classes or functions with the same name, but can have them
    do something different.


    ### Looking at a Namespace


    You are going to look at both our namespaces and how we can get different results
    from each one of their functions.

