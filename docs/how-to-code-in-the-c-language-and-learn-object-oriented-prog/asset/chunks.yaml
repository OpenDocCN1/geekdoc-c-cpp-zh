    of a line of code not executing properly.


    ## Your First C++ Program


    In the beginning of their coding education, most programmers begin with a simple
    program called "Hello World!" However, because most programming books have overdone
    this beginners program, in this book you are not going to start with this example.
    Instead, you are going to get a tad creative and develop a different style, which
    is also very simple.


    Once you have read through the code and ran the program, continue reading, because
    the Program Syntax explains how each individual line of code operates.


    Listing 1.0 – Hello Programmer.cpp


    | // my first C++ program#include <iostream> // includes header file to programusing
    namespace std; // uses the standard namespaceint main() // starts program{             
    cout << "Hello Programmer!" << endl; // displays text on screen              cout
    << "Welcome To The C++ Programming Language Made Simple!" << endl; // more text
    displayed              return 0; // concludes program} |


    Program Syntax: Hello Programmer.cpp


    #### The Comment Line


    The initial line of the program is a C++ comment, because it begins with two forwards
    slashes ( // ). When two //’s are entered, the program signals to the compiler
    that a comment follows suit.


    #### The Preprocessor Line


    Next, a preprocessor directive symbol ( # ) includes the header file <iostream>
    by enclosing it in open and close brackets <>. In this example, the header file
    <iostream> is selected for rendering the program capable of using certain declarations
    (functions, objects, etc.) Like the cout and endl objects.


    | Knowledge: Header FilesA header file is filled with declarations of functions,
    objects and commands that are capable of being included in programs. To utilize
    a header file the preprocessor symbol ( # ) is required. |


    #### The Namespace Line


    The line using namespace std allows for the namespace called std – known as standard
    – to be used in the program. You can consider namespaces as data capsules that
    contains other types of data, capable of being used in a program.


    #### The main Function


    The main function introduces the opening of the program. Every console program
    begins with int main or variations of int main. In other books this might be written
    as _tmain or simply int main, followed by a set of parameters between its parentheses.
    It depends on what compiler is being utilized to develop the program.


    The main function is always the opening of a program, no matter the situation.
    Other functions in a program are not capable of calling main, though they can
    return values to it.


    After the main function there is an opening bracket { and near the end of the
    program there is a closing bracket }. Between these the program code is typed.
    Everything that is typed between these brackets are instructions the program is
    required to follow.


    #### The cout and endl Objects


    The objects that the program uses are next to show their faces. The cout object
    (pronounced see-out) displays the text between the double quotes, which follows
    after the object and the << symbols. The << symbols are output operators that
    communicate to the compiler that the text following is to be displayed. After
    the text you have another << with endl (pronounced end-l). This command simply
    ends the line. The next line down does exactly the same, but displays a different
    line of text.


    #### The return Statement


    The return statement concludes the program by returning the value 0\. This means
    that if everything went smoothly the program successfully reached this point and
    finished without any errors being reported.


    | Technical Talk: BreakpointsWhen building programs with some compilers, like
    Visual C++, the program you create shall flicker up on screen and disappear in
    no more than mini seconds. The above program is an example of this. To stop it
    from immediately terminating, you must utilize breakpoints in the program.In Visual
    C++ locate the programs closing return statement and press F5\. A red spot appears
    inside the left border. When the program is ran, it shall halt before being commanded
    to close. |


    ## Programming Errors


    Did you get any errors when coding the program for the first time? I''m guessing
    that the answer is yes. Don''t worry about it. Compiler errors are normal to occur
    when programming. When the programs you write become larger with hundreds to thousands
    of lines of code, you will find that the compiler will discover countless errors.
    Once these errors are discovered – depending on the compiler being utilized –
    it will usually tell you what is wrong and suggest a fix.


    | Technical Talk: Compiler Step-InThe majority of compilers have a function that
    is normally accessed on the menu bar, called Step-In. This function allows the
    programmer to move through a program one line of code at a time, which is practical
    for the programmer, as it is an efficient method when syphoning out errors or
    impractical code. |


    ### Compiler Errors


    Compiler errors are probably the easiest type of error to correct when programming.
    If any of your programs happen to discover compiler errors then they’ll be found
    whilst the program is being assembled. They’re errors indicating something is
    wrong with the code inside your program and informs the compiler that it cannot
    run until the error is dealt with. In the majority of cases, these types of errors
    are due to incorrect syntax, meaning that somewhere along the line of programming,
    a typo has been created. When – and it is not the case of "if" – you receive a
    compiler error in your programs, they should be dealt with pronto.


    ### Link Errors


    These types of errors normally occur because of something in the code that it
    attempts to link to, but fails. For example, in a program that uses the <iostream>
    header file, if the <iostream> isn’t typed correctly it can cause the program
    to send out a linker error, because the program is trying to use objects from
    a header file that it cannot recognize because of a typo. These errors are not
    the same as compiler errors and can be a little confusing at first-hand to the
    programmer learning C++.


    ### Run-Time Errors'
