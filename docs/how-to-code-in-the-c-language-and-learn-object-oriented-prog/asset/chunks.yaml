    # 初学者 C++ 编程入门教程


    一本强大且经过验证的初学者编程指南，助你快速上手


    初学者 C++ 编程入门教程


    作者：Alexander Harrison

    插画：Joanne Snowden


    ## 免责声明


    版权所有。未经作者书面许可，严禁以任何形式（无论是机械还是电子形式）复制或传输本出版物的任何部分。


    本书详细介绍了作者在学习 `C++` 编程语言方面的个人经验。此外，作者并未获得教育或编程专业人士的许可。


    作者和出版者以教程的形式提供本书及其内容。此外，作者和出版者不代表或保证通过本书所获取的信息是完全准确、完整或实时的。


    除书中特别说明外，作者或出版者、以及任何作者、贡献者或其他代表，对于因使用本书引起或与使用本书相关的任何损害均不承担责任。这是一项全面的责任限制，适用于任何种的损害，包括但不限于：补偿性损害；直接、间接或后果性损害；数据、收入或利润的损失；财产的损失或损坏以及第三方的索赔。


    本书提供了与教育、计算和编程主题相关的内容。因此，使用本书意味着你接受本免责声明。


    # 引言


    “由于没有准备，你正在失败做准备。”

    （本杰明·富兰克林）


    “成功不是终点，失败不是致命：继续下去的勇气才重要。”

    （温斯顿·丘吉）


    ## 准备好学习 C++ 编程了吗？


    恭喜你决定学习 `C++` 编程语言。你渴望学习这种极其强大的计算机编程语言的机制和语法，你是一个很特别的人。


    我假设你已经了解计算机编程语言的基本用途。由于本书侧重于 `C++` 语言，我也假设你对编程语言所能产生的力量有一个通用的（尽管可能精确）的认知。


    无论你通过何种途径从 Kindle 商店购买或借阅这本书，我保证它将会在你学习 `C++` 的道路上提供帮助。


    ## 你将从书中学到什么


    在《初学者 C++ 编程入门教程》中，有丰富的编程知识待学习。无论你是刚开始学习 `C++`，还是对该语言已经有一定的了解，你都会发现新的东西。本书专为想要成为程序员的人编写，涵盖了基础知识并教授了构建程序所需的核心基础。书中包含的主题包括：


    *   常量。

    *   函数。

    *   面向对象编程 (OOP)。

    *   程序设计。

    *   语句。

    *   变量。

    *   以及更多……


    本书通过古老的 `C` 语言从 `C++` 的基础开始。《初学者 C++ 编程入门教程》不需要任何关于 `C`、`C++` 或任何计算机语言的先验知识。然而，你可能拥有的任何知识无疑有助于有效地理解
    `C++`。不过请不要完全困惑，这本书的要求并不多，但它希望你并非技术上的完全白痴，并且理解操作计算机的基本知识，从打开文件到访问互联网。


    ## 本书的结构


    我不会假装宣布 `C++` 是一门容易学习的语言，因为它显然并不如此。为了帮助你吸收并精通编写代码，每一章都有许多编程示例可供复制。每个示例都构建为一个 Win32
    控制台应用程序，这意味着它具有基于文本的界面，在没有 `Windows API` 力量的情况下运行。对于 `C++` 初学者来说，使用 Win32 控制台是开始构建的好起点。


    通过理解每一章中的信息和代码示例，下一章将看起来更容易掌握。例如，在第 03 章：数据存储、变量与常量中，你获得了使用程序变量并理解如何将它们存储在计算机内存中的知识。然后，第
    04 章：基本运算符中，通过使用上一章中读到的知识，你会发现理解能够处理各种数学运算符的数据类型变得更容易了。


    如果你是一个初学者，那么这本书无疑会为你提供丰富的信息。另一方面，如果你购买此书作为参考指南，它将帮助你重新发现你在记忆中遗忘的编程主题，例如变量、操作符和函数。


    ## 约定与实践


    在书的页面中，你会发现三个关注编程技巧的粗体标题。以下说明了分布在许多页面中的标题示例。


    | 编程知识：这些框内填满了必要信息，可以帮助增强你对 `C++` 语言的理解。 |

    | 编程技术谈：这些框是为我们内心“极客”准备的，他们渴望学习和吸收深层 `C++` 编程概念的信息。 |

    | 编程警告：这些框指出了程序员在尝试通过特定的编程概念编写代码之前应该注意的危险区域。 |


    # 第 01 章


    # C++ 程序设计


    ## 程序与设计软件


    构建计算机程序时的首要属性是具备理解软件设计的能力。学习 `C++` 但对如何设计程序没有意识毫无意义。因此，软件设计构成了开发程序的基础。


    ## 两小时纸笔脑风暴法


    完成设计（无论是软件设计还是其他形式）的最佳实践是向它从面八方提出问题。这就是我称为“两小时纸笔脑风暴法”的阶段，当你开始在空白画布上投射程序设计概念时，你需要一种积极的态度。


