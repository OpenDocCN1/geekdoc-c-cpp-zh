    | #include <iostream>#include <string>using namespace std;int main(){             
    cout << "Welcome back to the C++ Game." << endl;              cout << "Please
    enter your login details." << endl;              string username, password; //
    declares two string variables              cout << "\nUsername: ";             
    cin >> username; // input first string variable data              cout << "\nPassword:
    ";              cin >> password; // input second string variable data             
    cout << "\nWelcome back, " << username << endl;              return 0;} |


    Program Syntax: Login Details.cpp


    #### Multiple Variables


    The program shows how to assign multiple variables by only using a data type name
    once. In this case, the string variable has been used to create two variables
    called username and password, which will be used in a program that aids in a login
    system.


    ## Place Variables in Memory


    When variables are created the compiler allocates them into the computers RAM.
    When this happens they go onto a stack so each one can be used when the program
    calls for the use of the individual variable. This means that your program will
    be using a section of your computer’s memory.


    ## Manipulate Data Type Names


    Pretty soon your programs will grow in size. Five lines of code will become twenty-five;
    twenty-five will turn into fifty and then fifty will be one hundred, etc.


    Alongside that, as your programs grow so will the amount of variables and constants
    you’ll use. With this increase in number it can very tedious to write out such
    data types as unsigned short int or double float or signed char to initialize
    as variable or constant.


    Instead, what you can do is give the format of a data type a user-defined name,
    which the compiler will see as equalling to the data type you tell it to equal
    to. The method of doing this is by using the keyword typedef.


    The syntax for using typedef is:


    | typedef | data type | new name |


    Here is an example:


    | typedef | long float | LFT |


    | LFT | myFloat | 2364.20 |


    Listing 3.5 – Changing Data Types.cpp


    | #include <iostream>using namespace std;int main(){              typedef short
    int NUM; // NUM can be used in place of a short integer data type             
    typedef double DBL; // DBL can be used in place of a double data type             
    NUM shortInteger = 2; // assigns 2 to shortInteger using new type             
    DBL largeDecimal = 3408.43; // assigns 3408.43 to largeFecimal using new type             
    cout << "Two typedefs\n" << endl;              cout << "NUM replaces short integer
    with the value: " << shortInteger << endl;              cout << "DBL replaces
    double with the value: " << largeDecimal << endl;              return 0;} |


    Program Syntax: Changing Data Types.cpp


    #### typedef Variables


    The program treats you to a new concept of declaring and defining variables, by
    using your user-defined name for a variable in replace for the built-in one.


    Two variables are declared using the typedef command, which allows the programmer
    to assign a particular data type to a user-defined name. For instance, a short
    int has a user-defined name of NUM. This means instead of using short int each
    time, the programmer only requires to write NUM and the variable name of the short
    int, which is shortInteger.


    Then another typedef is used to work with a double. This typedef is called DBL
    and is used with the variable largeDecimal.


    | Warning: Too Many typedefsThe typedef is a handy tool to have when coding in
    C++, although, do not overuse it to an extreme, else you’ll discover you cannot
    remember what type a user-defined typedef replaces. |


    ## Using static_cast


    What if you want to change the type of variable being used for another? One aspect
    you would have to consider is whether the value range of the current variable
    would fit in the new one. For example, an integer with a value of 400 would not
    fit into a character variable that stores a maximum value of 127\. However, there
    is a method called the static_cast function that allows you to alter a variable
    data type, no matter the size of the value it holds.


    | int number = 4000;char letter = number; |


    If you were to place the following variables in your program, depending on your
    compiler, you would either experience a compile error or a truncation of the number.


    | Knowledge: TruncationTruncation means the number would be squeezed down to the
    highest value it can go, and in the case of an unsigned char, this would be 255.
    |


    Due to a char not capable of reaching the value of 4000, this is an ineffective
    method to use when programming and can even crash the program. However, by using
    static_cast you can alter the use of how the char variable reads the value of
    4000.


    The syntax for writing a static_cast is:


    | data type | variable name = | static_cast | <data type> | variable name |


    You can use this syntax with the char and int variables now to show how it would
    work in a program. This program has been cut down to show the use of static_cast.


    Listing 3.6 – Using static_cast.cpp


    | #include <iostream>using namespace std;int main(){              char charLetter;             
    int intNumber = 68;              charLetter = static_cast<char>(intNumber);             
    cout << "static_cast: " << charLetter << endl;              return 0;} |


    Program Syntax: Using static_cast.cpp


    #### The static_cast Line


    The two variables created in the program both interact with the static_cast command.
    The command is used to examine the number of the integer and to cast it as a char
    variable into charLetter. As the value of the integer is 68, this gives the result
    of the charLetter – once cast – as the letter D.


    ## What are Constants?


    A constant is much similar to a variable. Yet, whereas a variable can alter its
    value range, a constant is assigned a value and has to stick with that throughout
    length of the program. Constants cannot change. If a programmer attempts to code
    a program where a constant alters its value at some point the program will not
    run or when it gets to the certain line of code where the value attempts to change,
    it will crash and send out a run-time error.


    ## Types of Constants


    In C++ constants are used a lot. You may think that having a data container that
    cannot be altered might seem silly at first, but it is extremely handy, especially
    when it comes to debugging. Let me explain. If you have a constant or a set of
    them and you have an error that a value is changed and not allowed, then you know
    it is because it is situated in a constant you created in the program. Or on another
    example, if you fail to have constants in your program and only variables, it
    can be tricky to discover errors and bugs.


    There are three types of constants that you can create in the C++ language. The
    three of these follow next:


    ### Literal


    The literal constant is a constant that is assigned directly with a value, as
    though it is naked, and not concealed, by a constant represented with a name,
    like say a variable. For instance:


    | const int number = 5; |


    This is a literal constant, as it does not equal to anything but a direct value.


    ### Symbolic'
