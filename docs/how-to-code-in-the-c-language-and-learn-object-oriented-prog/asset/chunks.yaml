    \ C++ 中，大多数变量可以分为两个类别，这决定了它们的大小和值范围。这些差异被称为有符号和无符号。\n\n### 有符号\n变量可以分为两个类别，这决定了它们的大小和值范围。这些差异被称为有符号和无符号。\n\
    \n## 不同类型\n在 C++ 中，大多数变量可以分为两个类别，这决定了它们的大小和值范围。这些差异被称为有符号和无符号。\n\n### 整数\n`short`\
    \ 整数也称为 `int`，范围为 `-32768` 到 `32767`，由于是有符号的。然而，`short` 整数可以带有无符号前缀，行为与普通无符号完全相同。\n\
    \n```cpp\n// 每个变量都相同，但声明方式不同\nshort number = -44;\nshort int number = -44;\nsigned\
    \ int number = -44;\n```\n\n### 长整数\n长整数在声明时有所不同，因为它们需要 `long` 前缀，除非它们带有 `unsigned`\
    \ 关键字，否则它们是较大的整数。\n\n下表揭示了无符号和有符号长整数的最大值和最小值。\n\n有符号长整数值范围\n| MIN | MAX |\n| -2147483648\
    \ | 2147483647 |\n\n无符号长整数值范围\n| MIN | MAX |\n| 0 | 4294967295 |\n\n### 浮点数\n\
    `float` 变量是另一种使用数值的数据类型，尽管它不仅使用整数，还有小数点。`float` 变量不能无无符号，就像不同类型的整数一样，尽管它们可以带有\
    \ `long` 和 `long long` 类型的前缀。\n\nfloat 值范围\n| MIN | MAX |\n| 1.175494351e-38f\
    \ | 3.40282347e+38f |\n\n接下来我们将通过将 `float` 替换为 `double` 来扩展浮点数的大小。`double` 具有更高的值范围。\n\
    \n### 双精度\n\n"
- fmt: "\nThe `double` variable is also a decimal point data type. It’s larger and\
    \ can hold a higher value range than that of `float`. Although, the drawback is\
    \ a `double` variable acquires twice the amount of bytes in memory then a `float`\
    \ or an `integer`. Hence its name, `double`.\n\n`double` value range\n\n| MIN\
    \ | MAX |\n| :--- | :--- |\n| 2.22507385850720138e-308 | 1.79769313486231571e+308\
    \ |\n\n### Char\n\nThe `char` variable is a data type that allows you to use characters\
    \ from the keyboard, like ‘a’ or ‘b’ or ‘£’ or '&’ for the programs. The different\
    \ is when a number is used in a `char` variable it does not act like a numerical\
    \ value, as it does in a `integer` or `float`. The reason for this is because\
    \ it is cased between single quotation marks, which act like a switch that turns\
    \ off any numerical functionality.\n\n```cpp\n// examples of char variables\n\
    char letter = ‘L’;\nchar number = ‘5’;\nchar sign = ‘$’;\n```\n\nAs shown, the\
    \ three `char` variables all use single quotation marks. This means that the value\
    \ of ‘5’ is not numerical – or at least not completely. The reason I use the term\
    \ \"not completely\" is due to the fact that all characters typed from the keyboard\
    \ have their own set value, which corresponds to the ASCII layout. The `ASCII`\
    \ is short for \"American Standard Code for Information Interchange\" and is a\
    \ character-encoding scheme, which is originally based on the English alphabet.\
    \ This encodes 128 specified characters into 7-bit binary integers. The `ASCII`\
    \ table designates a value for each character on the keyboard. Therefore, once\
    \ again, `char` variables have minimum and maximum value.\n\nListing 3.2 – Different\
    \ Types of Characters.cpp\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    int main(){\n             cout << \"The different characters a char variable can\
    \ hold are shown below:\\n\" << endl;\n             // three char variable storing\
    \ different types of characters\n             char letter = 'E';\n           \
    \  char number = '2';\n             char symbol = '$';\n             // displaying\
    \ text with the three different types of characters\n             cout << \"The\
    \ char variable can store individual letters like \" << letter << \".\\n\";\n\
    \             cout << \"The char variable can store individual numbers as characters\
    \ like \" << number << \".\\n\";\n             cout << \"The char variable can\
    \ store individual symbols as characters like \" << symbol << \".\" << endl;\n\
    \             return 0;\n}\n```\n\nProgram Syntax: The Different Types of Characters.cpp\n\
    \n#### char Variable\n\nThere are three `char` variables in the program that are\
    \ declared and defined. Once these are created in the program, they are then individually\
    \ shown on screen using the `cout` object. Also, you may also see that each of\
    \ the variables has single quotation marks around them.\n\n## Boolean and String\
    \ Variables\n\n### Bool\n\nThe `bool` variable only has two values to deal with.\
    \ These values are `true` (1) and `false` (0). Devised by George Boolean, hence\
    \ the name, the `bool` value is used in a wild array of programming languages\
    \ like `Java`, `Visual Basic` and especially in `C++`. You will see this when\
    \ learning decision making and return statements in `C++`. All the programs created\
    \ so far in this book concludes with a Boolean value in their return statements:\
    \ `return 0`.\n\nListing 3.3 – True or False.cpp\n\n```cpp\n#include <iostream>\n\
    using namespace std;\nint main(){\n             cout << \"The difference of true\
    \ and false.\" << endl;\n             bool istrue = true;\n             bool isfalse\
    \ = false;\n             // discovers what is true and false\n             cout\
    \ << \"The value of true: \" << istrue << endl;\n             cout << \"The value\
    \ of false: \" << isfalse << endl;\n             return 0;\n}\n```\n\nProgram\
    \ Syntax: True or False.cpp\n\n#### bool Variable\n\nYou see two `bool` variables\
    \ in this program, which reveals the two different values the data type can either\
    \ be. The `bool` variables determine whether the data it contains is `true` (1)\
    \ or `false` (0). When you move onto the `if` and `switch` statements, you will\
    \ see the reason why the `bool` variable is crucial to `C++` programming.\n\n\
    `bool` value range\n\n| MIN | MAX |\n| :--- | :--- |\n| False (0) | True (1) |\n\
    \n### String\n\nThe `string` variable is not a built-in type in `C++`. Instead,\
    \ to utilize the use of strings in your programs you have to include the header\
    \ file `<string>`. To declare a `string` variable, it must start with the keyword\
    \ `string` followed by the user-defined name. The basic idea for strings is that\
    \ you can take a number of characters and string them together without any additional\
    \ code, apart from the header file being included. Examples of a string are shown\
    \ below, along with the `char` equivalent.\n\n```cpp\n#include <string> // remember\
    \ to include to use strings\nstring myName = \"Tom\";\nstring myAge = \"25\";\n\
    char myName[3] = \"Tom\"; // an array of char\nchar myAge[2] = \"25\"; // a smaller\
    \ array of char\n```\n\nListing 3.4 – Full Name, Number.cpp\n\n```cpp\n#include\
    \ <iostream>\n#include <string>\nusing namespace std;\nint main(){\n         \
    \    string fullName;\n             string address;\n             string number;\n\
    \             cout << \"Enter Your Full Name: \";\n             getline(cin, fullName);\n\
    \             cout << \"Enter Your Address: \";\n             getline(cin, address);\n\
    \             cout << \"Enter Your Telephone Number: \";\n             getline(cin,\
    \ number);\n             cout << \"\\nHello, \" << fullName << \".\" << endl;\n\
    \             cout << \"You Currently Live At: \" << address << \".\" << endl;\n\
    \             cout << \"Your Telephone Number Is: \" << number << \".\" << endl;\n\
    \             return 0;\n}\n```\n\nProgram Syntax: Full Name, Number.cpp\n\n####\
    \ getline(...) Function\n\nThere is another method of using the `cin` object in\
    \ `C++` that also has extra features and allows `string` and `char` variables\
    \ to perform complex tasks. In this program the `getline` function allows for\
    \ the user to input spaces into the string they write. Whereas, when using the\
    \ `cin` object, if you were to write the full name of a person as say, \"Abigail\
    \ Roberts\" then some of the string would truncate down to “Abigail”, since the\
    \ `cin` object doesn’t allow for spaces. Although the `getline` function does.\n\
    \nTo code a `getline` function the syntax looks like this:\n\n`getline(input_command,\
    \ string/char variable)`\n\n#### The cout Object\n\nIn this program the `cout`\
    \ object is spaced out on multiple lines. This is allowed as at the end of each\
    \ line (apart from the final one) there is no semi-colon ( ; ). As discussed earlier,\
    \ the semi-colon is what concludes a statement. Because if there is no semi-colon\
    \ `C++` allows for the code to be separated on different lines. This is also because\
    \ of the way in which `C++` reads (or should say doesn’t read) whitespace in a\
    \ programs code.\n\n| Knowledge: WhitespaceYou will learn more about whitespace\
    \ in Chapter 5: Statements & Expressions. Although, just consider whitespace much\
    \ like comments, as it is not read by the compiler at build-time.\n\n## Creating\
    \ Multiple Variables\n\nNow you know the basic types of variables that can be\
    \ created in `C++`, you will examine how to create multiple variables of the same\
    \ type.\n\nWe will use two data types to show how this works – an integer and\
    \ the `string` variable. To write multiple variables of the same type you use\
    \ the following syntax:\n\n`data type variable name, variable name`\n\nHere is\
    \ an example of three integer variables that are declared using only the data\
    \ type name once.\n\n```cpp\n// declare three int variables\nint hours, days,\
    \ months;\nhours = 24;\ndays = 7;\nmonths = 12;\n```\n"
