    \n程序使用 `typedef` 命令声明了两个变量，这允许程序员将特定的数据类型分配给用户定义的名称。\n\n...（文本其余部分根据规则遵循相同逻辑）\n"
- fmt: "\nWhen a constant is assigned to a value that is brought with a name, like\
    \ say a variable called `pocketMoney` that is assigned `44`, then it is known\
    \ as a symbolic constant, because unlike a literal constant that simply receives\
    \ a direct value, a symbolic constant is assigned with a representation of a value,\
    \ not just a direct value.\n\n`| int pocketmoney = 44;const int thismonth = pocketMoney;\
    \ |`\n\nI have placed this variable and constant into a program that shows you\
    \ how they both work. This a small program and I know there are better methods\
    \ to use constants then this simple demonstration. Yet, it shows the basic concept\
    \ of a symbolic constant.\n\n### Listing 3.7 – Pocket Money.cpp\n\n```cpp\n# #\
    \ include <iostream>\nusing namespace std;\nint main(){\n    int pocketMoney =\
    \ 14;\n    const int THISMONTH = pocketMoney; // variable is same as const  \n\
    \    cout << \"This month the pocket money I received was \" << THISMONTH << \"\
    \ pounds.\" << endl;\n    return 0;\n}\n```\n\n### Program Syntax: Constant Values.cpp\n\
    \n#### const Object\nThe keyword `const` creates a constant data type of an integer\
    \ variable. For example, in the program above there is a constant integer called\
    \ `THISMONTH`, which is assigned a variable carrying the value of `14`. By assigning\
    \ a data type as a constant, the value of the data type cannot be altered throughout\
    \ the program.\n\n#### Variable to Constant\nIn the program a variable amount\
    \ is placed into a constant via the assignment operator, which is looked at in\
    \ the following chapter. The method in which this is accomplished is because `C++\
    \ reads many of its commands from right to left. Therefore, the variable on the\
    \ right, `pocketMoney`, has its value copied into the newly created constant called\
    \ `THISMONTH`.\n\n## Enumerated\nEnumerated constants are much a foundation, or\
    \ the building blocks, for a collection of more constants. This may sound mind-bending,\
    \ but looking at the following example we can see how it works.\n\n`| enum COLOURS\
    \ {red, blue, green, black}; |`\n\nIn the example, `COLOURS` is the main constant,\
    \ must like a parent. The constants in the brackets act like children to the parent.\
    \ The constants in the brackets also have a value each. These values can be set\
    \ when writing the enumerated constant out as such.\n\n`| enum COLOURS {red =\
    \ 100, blue = 200, green = 250, black = 500}; |`\n\nThere is no logical explanation\
    \ that the values double each time. I have just written them out for the example\
    \ like that. Instead you could have:\n\n`| enum COLOURS {red = 100, blue = 101,\
    \ green = 20, black = 50}; |`\n\nYou don’t always need to set values for each\
    \ constant in the brackets. Instead, they could look like this:\n\n`| enum COLOURS\
    \ {red = 100, blue = 200, green, black = 500}; |`\n\nThis would mean that only\
    \ three of the constants have been assigned a value, yet the compiler also automatically\
    \ sets `green` a value that is one more than the value of `blue` as it precedes\
    \ it in the list.\n\nBelow is an example program of using enumerated constants\
    \ and displaying their values.\n\n### Listing 3.8 – Constant Custom.cpp\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\nint main(){\n    // create an enumerated\
    \ set of constants\n    enum CUSTOM { MON = 22, TUES = 28, WED = 34, THURS, FRI\
    \ = 22 };\n    // displays values of each enumerated constant\n    cout << \"\
    Number of customers shopping each weekday\" << endl;\n    cout << \"Monday: \"\
    \ << MON << endl;\n    cout << \"Tuesday: \" << TUES << endl;\n    cout << \"\
    Wednesday: \" << WED << endl;\n    cout << \"Thursday: \" << THURS << endl;\n\
    \    cout << \"Friday: \" << FRI << endl;\n    return 0;\n}\n```\n\n### Program\
    \ Syntax: Constant Custom.cpp\n\n#### The enum Constant\nA set of enumerated constants\
    \ is created near the beginning of the program. These signify the days of the\
    \ week and gives information about the amount of customers that enter a shop and\
    \ purchase something.\n\n### Test Yourself\nA set of enumerated constants is created\
    \ near the beginning of the program. These signify the days of the week and gives\
    \ information about the amount of customers that enter a shop and purchase something.\n\
    \nThe following questions are regards to you have learned:\n\n1. What is the difference\
    \ between unsigned and signed?\n2. Can a constant change?\n3. How many types are\
    \ there?\n\n## Basic Operators\nAn operator is used to perform operations. There\
    \ are many types of operators in `C++`:\n\n- Assignment Operator\n- Mathematical\
    \ Operator\n- Increment and Decrement Operator\n- Logical Operator\n- Rational\
    \ Operator\n\n### Mathematical Operators\nThe mathematical operators are used\
    \ for performing calculations. They include:\n- `+` (Addition)\n- `-` (Subtraction)\n\
    - `*` (Multiplication)\n- `/` (Division)\n- `%` (Modulus)\n\n### The % Operator\n\
    The modulus operator `%` returns the remainder of a division. For example, `int\
    \ mod = 16 % 5;` results in `1`.\n\n### Listing 4.0 – Modulus Operator.cpp\n\n\
    ```cpp\n#include <iostream>\nusing namespace std;\nint main(){\n    cout << \"\
    Hello Programmer! Time to do some maths.\" << endl;\n    int value1 = 11; // assigns\
    \ a value\n    int value2 = 2;\n    int valueTotal = value1 % value2; // modulus\
    \ operator working two variables to give an answer\n    cout << \"The total value\
    \ of the sums are: \" << valueTotal << endl;\n    cout << \"Now let us multiply\
    \ that by 100.\" << endl;\n    valueTotal = valueTotal * 100;\n    cout << \"\
    Now the value total is: \" << valueTotal << \" WOOHOO!!!\" << endl;\n    return\
    \ 0;\n}\n```\n\nProgram Syntax: Modulus Operator.cpp\n\n#### Problems with Division\
    \ and Integers\nOne other aspect that I want to bring attention to is using the\
    \ division operator with an integer. When you do division athematic it is not\
    \ always best to use integers. The reason is shown below.\n\n`| int firstNumber\
    \ = 30;float secondNumber = 10.2;int number = first / secondNumber; // returns\
    \ inaccurate result |` (Note: the example text had a typo `first` instead of `firstNumber`,\
    \ kept for context).\n\nThe result of this would be `2.94`, although because the\
    \ variable number that holds the result is an integer it rounds of the number,\
    \ as integers cannot hold decimal point numbers. Thus, this gives an inaccurate\
    \ result.\n\nThe best way to do this is by changing the variable number to a `float`.\n\
    \n`| int firstNumber = 30;float secondNumber = 10.2;float number = first / 10.2;\
    \ // returns accurate result |`\n\n### Listing 4.1 – Basic Maths.cpp\n"
