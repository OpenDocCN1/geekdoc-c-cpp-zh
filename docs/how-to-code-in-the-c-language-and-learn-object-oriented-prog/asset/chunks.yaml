    If you take time to learn both together, it’ll excel your chances of remembering
    the language. Furthermore, the learning process will appear quicker, because you
    absorb information more thoroughly using this technique.


    ## Question the Program''s Purpose


    Programs are developed for the core reason of solving problems. Hence, one program
    is built to solve one problem. Therefore, for you to befit a software developer
    and designer, one question that is necessary to consider is the purpose of why
    a certain program is demanded.


    **Knowledge: Four Questions of Software Development**

    When inspiration knocks at the door and offers an idea for a new program, you
    should ask these four questions of software development.


    1. What is the purpose of the program?

    2. What problem does the program solve?

    3. Does today’s market already have a program that solves the problem?

    4. Can the program be created in time?


    Software development companies use hours of time brainstorming, considering and
    discussing hundreds of reasons why a certain piece of software should be developed.
    Millions of dollars are injected into a software project by companies every year.
    Therefore, it is fatal if one or more of the above factors are overlooked and
    the project stalls. Basically, someone’s head will be assigned to the chopping-board.


    ## Steps to a Program Design Blueprint


    In the process of writing out a program design blueprint there are a collection
    of bullet points that you are required to consider, especially if you wish to
    build a program without too much hassle. To have this put in an old-fashion way,
    you need some up-front planning involved before one line of code is written. To
    help you, I have nailed down these steps in an easy-to-remember process.


    ### Step 1: Define the Problem You Wish to Solve


    As a programmer and program designer, you are required to examine the problem
    you wish to solve, and define it in a sentence or two. Here is a list of problem
    examples to give you some idea.


    **Knowledge: Problem Ideas**

    * I need to design an application that will store all my program ideas in one
    place, like a cloud system but on my computer.

    * I need to design a program that displays my family and friends photographs on
    screen and allows me to upload them to chosen social media sites.

    * I need to design a small mathematical game, which will help my children with
    their homework.


    Do you get the idea? It is an obvious step, but one many beginning designers skip
    for one reason or another. It is a plan and you should never forget to plan.


    ### Step 2: Define what is involved in solving the Problem


    This step focuses on the initial problem you have defined and asks the question
    "How can this problem be solved?"


    There are ways of examining the problem in hand. Three of the biggest questions
    that are normally asked are:


    **Knowledge: Define Ideas**

    * How do I want my program to function?

    * How do I want the user to interact with the program?

    * What tools do I require to complete the program?


    These questions might appear easy to answer at first glance, but it is no good
    at failing to take some time and really concentrate on the methods required to
    answer each one properly. Consequently, in a less broad term, do not try and "wing
    it".


    ### Step 3: Define a List of Events Involved in the Problem


    You should have a good notion of how you are going to tackle the problem and design
    the program. The next step is to define the type of events to help your program
    operate.


    For example, if you were to develop an application to store all your program ideas
    in one place, then it might be designed with a function to `Save`, `Load`, `Open`
    and `Edit` a file that contains data placed in the program. Therefore, you could
    have the following events to help your program operate effectively:


    **Knowledge: Event Ideas**

    * Load File Event

    * Save File Event

    * Open File Event

    * Edit File Event.


    In `C++`, these events are written out as functions filled with the correct code
    to achieve a specific task. Taking the `Load File Event`, if the function was
    opened up, it would be filled with code to help the user load a file needed.


    ## Reuse Program Code


    Most programmers share is the displeasure for rewriting code they already have
    written in a previous project. Most programmers bask in reusing old program code
    and implementing it in their current projects.


    For example, as a programmer, you might write code to add two numbers and display
    the result on screen. Then in another program, you may desire to reuse the code.
    Therefore, instead of rewriting it again, it is far easier to copy the code from
    the program you previously wrote and paste it into your new one.


    **Technical Talk: Software Reuse**

    The term "software reuse" is the theory of replicating, or copying, a section
    of code from an existing piece of software and placing it into a new project.


    ## Select a Compiler


    Throughout the book, you’ll require the use of a compiler to help build the program
    examples dotted in amongst the pages, and any others you single-handedly wish
    to code. Without a compiler, you have no method to assemble code and develop programs.
    The reason for this is because `C++` is a statically typed, multi-paradigm and
    compiled programming language.


    **Technical Talk: What Is Multi-Paradigm?**

    A programming paradigm is the method or style that a computer language can understand.
    It employs this method in order to structure and employ elements in compiled programs.
    Therefore, a multi-paradigm language, like `C++`, inhabits the ability for the
    programmer to use different forms and styles to build programs. A good example
    of this is the implementation of Object-Oriented Programming in `C++`.


    A compiler examines written code and links the various libraries included in a
    program to eventually create an executable file (`.exe`). During this process,
    it checks for any errors in the code. If some are found, it reports them. If there
    are no errors the compiler shall build the program and run it.


    Modern day compilers supply their own Integrated Development Environment (IDE),
    which is the user-interface platform for programming. Basically, a compilers IDE
    is everything you see on the screen.


    ## No Compiler? Don’t Worry!


    If you have no compiler installed on your machine or don’t possess one, then there
    are a couple of options available you can download from the internet. Yes, they
    are also free. My favourite two are listed here:


    ### CodeBlocks 13.12


    `Code::Blocks` is a programming application that has its own compiler built-in.
    Developed by the `Code::Blocks` team, the program is an open-source (free) Integrated
    Development Environment that is suited for `C` and `C++` programmers.


    | Download Link | `http://www.codeblocks.org/downloads/` |

    | --- |


    `Code::Blocks` is extremely practical to use. It utilizes the `GNU GCC` compiler,
    which will run the program examples in this book. On a side note, the `Code::Blocks`
    website has its own forums for troubleshooting and a donation link for contributions.


    ### Dev-C++


    Created by `Bloodshed`, `Dev-C++` is another programming application that has
    its own compiler and Integrated Development Environment. `Dev-C++` caters to programmers
    of `C` and `C++`. It can operate in `Windows` and there are now options available
    to run it in `Linux`.


    | Download Link | `http://www.bloodshed.net/download.html` |

