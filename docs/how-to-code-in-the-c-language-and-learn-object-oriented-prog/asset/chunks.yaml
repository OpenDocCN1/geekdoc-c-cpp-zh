  trans: "\n对于 C++ 初学者来说，学习指针背后的概念是他们编程教育中的噩梦。当你把“弄动计算机内存”这个想法根植在脑海中时，会有那么一个时刻你会开始变得过于谨慎。这完全可以理解。而且当你使用指针时，本质上是你允许程序代码去弄动计算机内存。然而，不要恐慌，它听起来比实际情况要糟糕得多。\n\
    \n### 内存地址\n\n在第三章讨论变量时，你学习了当变量被创建时，会被分配一个内存地址。\n\n那么，为了完全理解指针如何与内存及其地址操作，你还需要更多关于内存的知识。\n\
    \n创建的变量存储在计算机内存中。每个整数、浮点数、字符、字符串等都会被分配一个内存地址位置。这些位置是顺序编号的。\n\n由于程序会对对其给定变量地址进行排序和维护，程序员不需要担心这些复杂的问题。也就是说，如果代码编写正确，程序会处理好的。\n\
    \n程序的下部分使用“地址操作符”（Address of Operator）演示如何获取变量地址的信息并将其显示在屏幕上。\n\n地址操作符在程序用于发现持有变量的内存地址。\n\
    \n列表 9.0 – 理解内存地址和数据指向.cpp\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    int main(){\n    int number = 5; // 整数变量\n    int *pPointerToValue = NULL; //\
    \ 初始化指针为 NULL\n    pPointerToValue = number; // 指针指向整数变量\n    cout << *pPointerToValue;\
    \ // 解引用指针显示数字变量\n    return 0;\n}\n```\n\n程序语法：Understand Memory Address and\
    \ Data Pointing.cpp\n\n### 指针与地址\n\n当你创建一个指针时，你需要指向某些东西，无论是一个变量还是一个 NULL 值。如果你忘记初始化指针，可能会给程序带来问题，甚至导致崩溃。这是因为会产生内存泄漏错误。因此，初始化指针是明智的，正如上一个例子所示，即使你没有其他可以赋值给它的，也可以初始化为\
    \ `NULL` (0)。再看一遍怎么做的。\n\n```cpp\n// 初始化为 NULL 的指针\nint *pMyPointer = 0;\nint\
    \ *pMyPointer = NULL;\n```\n\n知识：指针命名规范\n指针可以像普通变量一样赋予合法的名称。在初始化指针时，良好的编程习惯是在名称前加上\
    \ \"p\"。例如：\n```cpp\nint pMyPointer = NULL;\nint pAnotherPointer = 0;\n```\n\n\
    ### 解引用操作符\n\n当你对指针使用解引用操作符 `*` 时，将获取所指变量内存地址中存储的值。例如，如果一个程序有一个等于 33 的整数变量以及一个指向它的指针，可以使用\
    \ `cout` 对象和解引用操作符来显示变量的值。看看下面的代码段。\n\n```cpp\nint myAge = 33;\nint *pMyPointer\
    \ = myAge;\ncout << *pMyPointer << endl;\n```\n\n### 动态内存\n\n#### new\n\n`new`\
    \ 操作符是分配动态内存的方法。你通过给它分配数据类型来使用 `new` 关键字。\n\n要创建一个新类型的数组，你在数据类型后面添加一个元素数量。你将在第\
    \ 11 章学习数组。\n\n这是一个包含五个元素的数组示例。\n\n```cpp\nint *pMyPointer = new int [5];\n```\n\
    \n#### delete\n\n当你完成指针的使用后，需要从程序中删除它，以免产生任何内存泄漏。内存泄漏可能导致你的程序崩溃，甚至导致你的内存损坏。所以，这不是好事。\n\
    \n要删除指针，你只需在指针名称之前使用 `delete` 关键字。\n\n```cpp\nint *pMyPointer = new int;\ndelete\
    \ pMyPointer;\n```\n\n要删除指向新数组的指针，你需要在 `delete` 关键字后面加上括号。\n\n```cpp\nint *pMyPointer\
    \ = new int [5];\ndelete[] pMyPointer;\n```\n\n第 10 章\n\n# 引用\n\n## 什么是引用？\n\n\
    在 C++ 中，引用被称为别名（alias）。这意味着它可以用自己的名称来引用另一个对象的数据。你会发现，在不同函数之间传递它们持有的数据对象时，这是极其实用的。\n\
    \n## 创建引用\n\nC++ 中的引用是通过编写它所所属的对象类型（int, float, char 等），紧接着是引用操作符（`&`），然后是你给引用的名称来创建的。例如，下面的示例展示了如何初始化引用并为名为\
    \ `target` 的变量数据取别名。\n\n```cpp\nint target = 5;\nint &targetRef = target; // 引用变量\
    \ target\n```\n\n这就是在 C++ 中编写引用的方式。因此，当你初始化引用时，使用需要引用的对象名称，在本例中对象名称是 `target`。现在，让我们看看发生了什么。一旦引用被对象初始化，它就是该目标的备用名称。因此，如果我们执行：\n\
    \n```cpp\ntargetRef++;\ncout << target << endl;\ncout << targetRef << endl;\n\
    ```\n\n它们都将等于 6。这意味着对引用的任何操作也会改变原始数据，即 `Target`。\n\n让我们看一个示例，它展示了无论如何值是如何变化的。\n\
    \n列表 10.0 – 引用对象.cpp\n\n```cpp\n#include <iostream>\nusing namespace std;\nint\
    \ main(){\n    int target = 5;\n    int &targetRef = target;\n    cout << \"target\
    \ 是: \" << target << endl;\n    cout << \"targetRef 是: \" << targetRef << endl;\n\
    \    cout << \"target 加 1: \" << target << endl;\n    cout << \"targetRef 加 1:\
    \ \" << targetRef << endl;\n    return 0;\n}\n```\n\n程序语法：Reference a Object.cpp\n\
    \n#### 对象引用\n\n程序通过首先创建一个名为 `target` 的变量并赋值为 5，来引用该对象。然后使用地址操作符（`&`）来引用它。\n\n\
    技术杂谈：引用命名规范\n引用可以使用任何变量或常量允许的合法名称。然而，许多程序员会在引用名称前加上字母 `r`。\n```cpp\nint rMyRef;\
    \ // 整数引用\n```\n\n### 用于引用的地址操作符\n\n在编写包含引用的程序时，你需要请求它的地址。之所以这样做是因为引用操作与其别名对象的方法。为了实现这一点，任何引用都需要使用地址操作符。\n\
    \n知识：地址操作符 (&)\n在本书包括本章节中，你已经看到 `&` 符号用于不同的编程方面。对于引用，这被称为地址操作符，用于获取引用所别名对象的地址。\n\
    \n列表 10.1 – 引用.cpp\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main(){\n\
    \    float Decimal = 25.5;\n    int Number = 5;\n    float &rtodecimal = decimal;\n\
    \    int &rtonumber = number;\n    cout << \"Decimal 地址: \" << &rtodecimal <<\
    \ endl;\n    cout << \"Number 地址: \" << &rtonumber << endl;\n    return 0;\n}\n\
    ```\n\n程序语法：Reference a Object.cpp\n\n#### 地址操作符\n\n`&` 符号在程序中用于不是显示值，而是变量在计算机\
    \ RAM 中所在的内存地址。\n\n## 哪些对象可以被引用？\n\n无论你在程序中创建了什么对象，它们都可以与引用配合。尽管如此，不要过度尝试引用你程序中的所有内容。你应该只在需要时使用引用，否则将是良好的编程习惯。\n"
- fmt: "\nOf course, when i say any object can be reference, i mean any. Although,\
    \ do not try to reference a class, because it shall not work. Instead, you can\
    \ reference an object that a class has built. We will get into classes soon in\
    \ the next chapter.\n\n## Keep One Reference for One Object\n\nIt is good programming\
    \ grammar to understand the rule that you shouldn’t reassign a reference to a\
    \ different target once it is already aliasing an object. If this happens it can\
    \ get very confusing. Instead it is better to make another reference and assign\
    \ it to another object. The reason for this is due to the fact that programmers\
    \ can become very disoriented by what a program does and how it treats references.\
    \ Once you have a reference is one place, keep it there for the whole of the program.\n\
    \n```cpp\nint refOne;int objectOne = 6;refOne = objectOne; // reference one object\
    \ is good\nint objectTwo = 12;refOne = objectTwo; // switching objects is not\
    \ good\n```\n\n## NULL Unused Pointers\n\nAny pointer that is not initialised\
    \ or been deleted using the `delete` keyword, it must be set to `null`. Doing\
    \ this allows the pointer to have a default value and saves from your program\
    \ from crashing at any moment.\n\n## Do Not NULL References\n\nHowever, when we\
    \ it comes down to setting null to a reference it is a bad idea, as references\
    \ cannot be assigned the value of `null`. When you go to compile your program\
    \ some good compilers will pick up on this, yet others will not and it can cause\
    \ a crash of your program and even a corruption in your memory.\n\n> **Warning:\
    \ Do Not Reference Objects with a Value of 0** By setting a reference to an object\
    \ that is equal to 0 you are setting it to `null`. This can corrupt the program\
    \ the reference is in and even potentially damage your computer.\n\n## Passing\
    \ By Reference\n\nIn the chapter on functions you learnt that values can be passed\
    \ into functions from others as parameters. Then in the pointers chapter you discovered\
    \ how this is done by using pointers. Now we are going to see how it done by using\
    \ references. The syntax for this is as such:\n\n```cpp\nSomeref(4,8);// parameters\
    \ are referenced\nint SomeRef(&rFirstReference, &rSecondReference);\n```\n\nWhen\
    \ you pass by reference the effect is the same but instead of a copy being made,\
    \ the actual value is passed through by a reference. Therefore, this demonstrates\
    \ that you leap over the limitations functions have when passing by value. We\
    \ know that when you pass by value all that is really happening is a copy of the\
    \ value is being made and placed into the calling function.\n\nIn the C++ language\
    \ passing by reference means to take the original value and pass – not copy –\
    \ it into the function. There are two methods in which this can be accomplished\
    \ – through pointers and references.\n\n### Listing 10.2 – Pass By Reference.cpp\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nint SomeReference(int &refOne,\
    \ char &refTwo);\nint main(){\n  int x = 5;\n  char y = 'y';\n  SomeReference(x,y);\
    \ // function call\n  cout << \"\\nThe new reference one: \" << x << endl;\n \
    \ return 0;\n}\nint SomeReference(int &refOne, char &refTwo){\n  cout << \"Reference\
    \ one: \" << refOne << endl;\n  cout << \"Reference two: \" << refTwo << endl;\n\
    \  refOne++; // increment refOne\n  return refOne;\n}\n```\n\n**Program Syntax:\
    \ Pass By Reference.cpp**\n\n#### Passing References\n\nThis program takes two\
    \ declared variables from `main` and passing them by reference into a function\
    \ called `SomeReference`. In the function they are displayed and then `refOne`\
    \ is incremented and passed back to `main`. Once in `main`, the new value of the\
    \ variable is displayed to show how it is not been copied by delivered to and\
    \ fro between the two functions.\n\n## Pointers and References\n\nIn C++ pointers\
    \ are objects too. This means that references can alias them. Although, as we\
    \ have seen pointers can be deleted and then set to `null`, whereas references\
    \ cannot be set as `null`, nor can they be reassigned. Below is an example of\
    \ how a pointer can work with a reference.\n\n### Listing 10.3 – Pointers and\
    \ References.cpp\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main(){\n\
    \  // variables, pointers and references\n  int target = 10;\n  int *pTargetPtr\
    \ = new int;\n  *pTargetPtr = target;\n  Int &rTargetRef = *pTargetPtr;\n  cout\
    \ << \"Target: \" << target << endl;\n  cout << \"Target pointer: \" << *pTargetPtr\
    \ << endl;\n  cout << \"Target reference: \" << rTargetRef << endl;\n  delete\
    \ ptargetptr; // deletes pointer\n  pTargetPtr = 0; // pointer set to null\n \
    \ cout << \"Target new reference: \" << rtargetref << endl;\n  return 0;\n}\n\
    ```\n\n**Program Syntax: Pointers and References.cpp**\n\n#### Pointing to References\n\
    \n#### Delete Pointers\n\n#### References Over Pointers\n\n# 11 Arrays\n\n###\
    \ What is an Array?\n\nWhen we declare an array it is done in the following method:\n\
    \n```cpp\n<data_type> variable_name[size];\n```\n\nAn array is a collection of\
    \ created objects, which use the same data type. These collections have storage\
    \ locations named which are numbered from 0.\n\n### The Elements Of An Array\n\
    \nThe elements that you give your arrays can be accessed by referring to it by\
    \ its number. The example below shows:\n\n```cpp\nint myarray[X] // replace X\
    \ with a number\n```\n\n### Arrays Start at Zero\n\nTo a beginner of C++ or any\
    \ programming language, it might be weird to discover that the computer counts\
    \ from the value of 0. Thus, this means that if you have an array like `Array[5]`\
    \ then that means it has 6 values placed into it. Read below to see how this is\
    \ done individually.\n\nYou can write an array in two ways. These two methods\
    \ are written below beside each other.\n\n```cpp\nint myarray[0] = 73;\nint myarray[1]\
    \ = 65;\nint myarray[2] = 28;\nint myarray[3] = 45;\nint myarray[4] = 89;\nint\
    \ myarray[5] = 53;\nint myarray[5] = {73,65,28,45,89,53};\n```\n\nThe two methods\
    \ here create the exact same array no matter how it is written. The first method\
    \ is used for when you wish to access a particular element of the array.\n\n```cpp\n\
    cout <<\"Array number: \" << myArray[3]; // displays the value of 45\n```\n\n\
    The second method is by creating the whole array in one. This is great for declaring\
    \ and/or defining the array.\n\n```cpp\nint myArray[5] = {73,65,28,45,89,53};\n\
    ```\n\n## Danger in Writing Passed an Arrays End\n\nWe've now talked about elements\
    \ of an array and seen how each can hold a different data value. Yet, what happens\
    \ when you have an array of 9 elements and discovered actually you want to write\
    \ to the tenth element?\n"
  raw: 'Of course, when i say any object can be reference, i mean any. Although, do
    not try to reference a class, because it shall not work. Instead, you can reference
    an object that a class has built. We will get into classes soon in the next chapter.


    ## Keep One Reference for One Object


    It is good programming grammar to understand the rule that you shouldn’t reassign
    a reference to a different target once it is already aliasing an object. If this
    happens it can get very confusing. Instead it is better to make another reference
    and assign it to another object. The reason for this is due to the fact that programmers
    can become very disoriented by what a program does and how it treats references.
    Once you have a reference is one place, keep it there for the whole of the program.


    | int refOne;int objectOne = 6;refOne = objectOne; // reference one object is
    goodint objectTwo = 12;refOne = objectTwo; // switching objects is not good |


    ## NULL Unused Pointers


    Any pointer that is not initialised or been deleted using the delete keyword,
    it must be set to null. Doing this allows the pointer to have a default value
    and saves from your program from crashing at any moment.


    ## Do Not NULL References


    However, when we it comes down to setting null to a reference it is a bad idea,
    as references cannot be assigned the value of null. When you go to compile your
    program some good compilers will pick up on this, yet others will not and it can
    cause a crash of your program and even a corruption in your memory.


    | Warning: Do Not Reference Objects with a Value of 0By setting a reference to
    an object that is equal to 0 you are setting it to null. This can corrupt the
    program the reference is in and even potentially damage your computer. |


    ## Passing By Reference


    In the chapter on functions you learnt that values can be passed into functions
    from others as parameters. Then in the pointers chapter you discovered how this
    is done by using pointers. Now we are going to see how it done by using references.
    The syntax for this is as such:


    | Someref(4,8);// parameters are referencedint SomeRef(&rFirstReference, &rSecondReference);
    |


    When you pass by reference the effect is the same but instead of a copy being
    made, the actual value is passed through by a reference. Therefore, this demonstrates
    that you leap over the limitations functions have when passing by value. We know
    that when you pass by value all that is really happening is a copy of the value
    is being made and placed into the calling function.


    In the C++ language passing by reference means to take the original value and
    pass – not copy – it into the function. There are two methods in which this can
    be accomplished – through pointers and references.


    Listing 10.2 – Pass By Reference.cpp


    | #include <iostream>using namespace std;int SomeReference(int &refOne, char &refTwo);int
    main(){   int x = 5;   char y = ''y'';   SomeReference(x,y); // function call  
    cout << "\nThe new reference one: " << x << endl;   return 0;}int SomeReference(int
    &refOne, char &refTwo){   cout << "Reference one: " << refOne << endl;   cout
    << "Reference two: " << refTwo << endl;   refOne++; // increment refOne   return
    refOne;} |


    Program Syntax: Pass By Reference.cpp


    #### Passing References


    This program takes two declared variables from main and passing them by reference
    into a function called SomeReference. In the function they are displayed and then
    refOne is incremented and passed back to main. Once in main, the new value of
    the variable is displayed to show how it is not been copied by delivered to and
    fro between the two functions.


    ## Pointers and References


    In C++ pointers are objects too. This means that references can alias them. Although,
    as we have seen pointers can be deleted and then set to null, whereas references
    cannot be set as null, nor can they be reassigned. Below is an example of how
    a pointer can work with a reference.


    Listing 10.3 – Pointers and References.cpp


    | #include <iostream>using namespace std;int main(){   // variables, pointers
    and references   int target = 10;   int *pTargetPtr = new int;   *pTargetPtr =
    target;   Int &rTargetRef = *pTargetPtr;   cout << "Target: "  << target << endl;  
    cout << "Target pointer: " << *pTargetPtr << endl;   cout << "Target reference:
    " << rTargetRef << endl;   delete ptargetptr; // deletes pointer   pTargetPtr
    = 0; // pointer set to null   cout << "Target new reference: " << rtargetref <<
    endl;   return 0;} |


    Program Syntax: Pointers and Refernces.cpp


    #### Delete Pointers


    In the program, a pointer is deleted and its value is set to 0/NULL to show how
    references tackle the issue of giving references a value they cannot handle.


    #### Pointing to References


    This example shows a reference and pointer can work together. Once a pointer is
    created and assigned to a piece of data, a reference can then alias the pointer.
    This means that when either the variable, pointers or reference is altered, all
    of them follow suit.


    It also shows what happens when a pointer is deleted and the reference is still
    the alias to it. Once the value is deleted from the pointer, the reference does
    not have any data – thus it is null – and because references cannot be null it
    diisplatys the memory address it is stored at or simply crashes the program.


    ## References Over Pointers


    References have a better preference of use amongst many programmers, generally
    because they are the simpler method to use, compared to a pointer. However, as
    already talked about, references cannot be used in some circumstances – remember
    no null for references. Nor can they be reassigned without creating trouble in
    a program.


    On the flip side of this, pointers are more effective and efficient in a program
    when they are used. As a beginner programmer, you should not neglect using pointers
    and replace them with references. It is always good programming practice to use
    both in your programs.


    Chapter 11


    # Arrays


    What is an Array?


    When we declare a variable it is done in the following method:


    | <data_type>              <variable_name>;int               myNumbers; |


    An array is a collection of created objects, which use the same data type and
    name. These collections have storage locations named elements, which are numbered
    from 0.  Depending on the number being called upon depends on what object the
    programmer wishes to use within the list of elements.


    ## The Elements Of An Array


    The elements that you give your arrays can be accessed by referring to it by its
    number or an offset. The example below shows this.


    | int myarray[X] // replace X with a number |


    ## Arrays Start at Zero


    To a beginner of C++ or any programming language that ha arrays, it might be weird
    to discover that the computer counts from the value of 0\. Thus, this means that
    array elements begin at the value of 0 too. So, if you have an array like this
    theArray[5] then that means theArray has 6 values placed into it. Read below to
    see how this is done individually.


    You can write an array in two ways. These two methods are written below beside
    each other.


    | int myarray[0] = 73;int myarray[1] = 65;int myarray[2] = 28;int myarray[3] =
    45;int myarray[4] = 89;int myarray[5] = 53;int myarray[5] = {73,65,28,45,89,53};
    |


    The two methods here create the exact same array no matter how it is written.
    The first method is used for when you wish to access a particular element of the
    array.


    | cout <<”Array number: “ << myArray[3]; // displays the value of 45 |


    The second method is by creating the whole array in one. This is great for declaring
    and/or defining the array.


    | int myArray[5] = {73,65,28,45,89,53}; |


    ## Danger in Writing Passed an Arrays End


    We''ve now talked about elements of an array and seen how each can hold a different
    data value. Yet, what happens when you have an array of 9 elements and discovered
    actually you want to write to the tenth element?'
