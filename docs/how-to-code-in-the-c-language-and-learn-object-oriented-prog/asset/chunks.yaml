    \ into function    return 0;}void SecondFunction() // other function{    cout\
    \ << \"\\nNow we are in the second function of the program.\" << endl;    cout\
    \ << \"When we leave here the program ends.\" << endl;    cout << \"Goodbye!\"\
    \ << endl;} |\n\nProgram Syntax: The Second Function.cpp\n\n#### User-Defined\
    \ Function\n\nThe SecondFunction is the other function built in the program. It\
    \ isn’t like the main function. Instead, it is a function fully built by the programmer.\
    \ At the top of the program, you have the function prototype, which declares the\
    \ function, but it doesn’t define it.\n\nBecause SecondFunction has already been\
    \ declared, it can be placed underneath the main function. On the other hand,\
    \ if the function didn’t have a prototype then its definition would’ve required\
    \ to be written above the main function.\n\n## No Prototype Function\n\nThis next\
    \ example is a program with the SecondFunction again, but this time the function\
    \ prototype is omitted and the function moved above main.\n\nListing 6.1 – The\
    \ Second Function with No Prototype.cpp\n\n| #include <iostream>using namespace\
