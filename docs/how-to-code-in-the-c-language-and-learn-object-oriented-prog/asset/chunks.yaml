    ### Global Data


    Data like variables and constants coded outside of any function or outside its
    parentheses, even main, is known as global data and can be employed anywhere in
    a program.


    ### Local Data


    Variable and constants created inside a function are known as local data. The
    pieces of data inside a function can only be used inside the function it is created
    in. Although, you can return the result of the data to main.


    Listing 6.2 – Global Variable.cpp


