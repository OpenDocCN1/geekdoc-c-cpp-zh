  trans: "\n\n你现在已经理解了变量的概念。在类内部，变量可以声明为任何 C++ 内置类型。由于类可以构造对象，这些变量就是将对象组合在一起的组件。\n\
    \n以 `Car`（汽车）对象为例，类可能包含的变量为对象赋予生命使其按照正确的格式运行。对于一个 `Car` 对象，某些变量可能读取如下：\n\n| double\
    \ Fuel;double milesDriven;int steeringDirection; |\n\n如果应用了这些类变量，那么在为程序编写类时，它看起来可能像下面所示：\n\
    \n```cpp\nclass Car { // 类变量\ndouble Fuel;double milesDriven;int steeringDirection;\n\
    };\n```\n\n## 方法函数 (Method Functions)\n\n与类变量只是在类中实现的简单变量一样，方法函数是编写在类内部的函数。这些方法函数通过与类变量一起进行操作，赋予类对象功能和力量。\n\
    \n简单来说，如果说 `Car` 对象的类变量是程序中处理的数据测量值，那么方法函数就是操作动作以为类变量提供数据的杠杆。因此，这些方法函数对于赋予任何创建的类对象可使用的能力至关重要。\n\
    \n```cpp\nclass Car { // 方法函数\nvoid increaseFuel();\nvoid Accelerate();\nint calculateMiles();\
    \ // 类变量\ndouble Fuel;double milesDriven;int steeringDirection;\n};\n```\n\n##\
    \ 创建类对象 (Create a Class Object)\n\n普通变量是通过编写数据类型及其用户定义的名称来创建的。变量也可以定义一个值。在创建类对象时，这一过程是类似的。\n\
    \n我们已经讨论过在类中用于操作类变量和方法函数的 `Human`（人类）类和 `Car`（汽车）类对象。现在你可能好奇类对象究竟在做什么。\n\n对于程序中创建的大多数类——虽然有些带有抽象数据类型的类无法拥有对象——都需要一个对象来控制和获取类的功能。\n\
    \n要创建一个类对象，与变量一样，需要类的类型，然后是对象的用户定义名称。当然，由于这是 C++ 中的语句，因此用分号结束该行。例如：\n\n| Human\
    \ programmer;Car fourDoor; |\n\n在这一段代码中，`Human` 类型创建了一个名为 `programmer` 的对象，`Car`\
    \ 类型创建了一个名为 `fourDoor` 的对象；一旦创建了对象，它就可以承担使用类变量和方法函数的作用来有效运行。\n\n## 从类中访问数据 (Access\
    \ Data from Classes)\n\n你已经学会了如何构建对象，但还没有如何在 C++ 程序中使用它。类对象是在函数（如 `main`）中构建的，那里是可以使用它们的地方。如果你决定在一个名为\
    \ `KeyPresses(…)` 的函数中构建名为 `Keyboard` 的对象，那么该对象只能在该函数中运行。\n\n在程序中使用类对象，你可以开始使用它来访问生成该对象的类数据。访问类数据所需的初始要素是了解名为作用域解析运算符（`::`）的运算符。该运算符用于使用类的类型名称从类中定义方法函数。例如，在具有方法函数\
    \ `KeyPresses(…)` 的 `Keyboard` 类的情况下，它看起来会像这样：\n\n```cpp\n#include <iostream>\n\
    using namespace std;\nclass Keyboard {\npublic:\n    void Keypresses();\n};\n\
    void Keyboard::Keypresses() // 类类型访问方法函数\n{\n    char key;\n    cout << \"Press\
    \ A Key: \";\n    cin >> key;\n    cout << \"The Key You Press Was: \" << key\
    \ << endl;\n}\nint main() {\n    Keyboard Keys; // 创建对象\n    Keys.Keypresses();\
    \ // Keys 对象访问 Keypresses 方法函数\n}\n```\n\n## 私有与公共访问修符 (Private & Public Accessor’s)\n\
    \n涉及 C++ 中的类时，有三种类型的访问修符用于确定类内部数据的范围。在这一部分，我们将查看通常在类中使用的两种主要的修符。\n\n### 私有 (Private)\n\
    \n私有访问符是任何类的默认访问符。当构建一个类而没有编写任何访问符名称（如 `private` 或 `public`）时，C++ 默认将所有数据封装在私有访问符中。这意味着它被限制在类之外任何地方，例如\
    \ `main` 函数。\n\n```cpp\nclass Human { // 无访问符名称\n// 访问符默认为私有\n}\n```\n\n### 公共\
    \ (Public)\n\n类中的第二个访问符是关键字 `public`。公共访问符允许在其下创建的方法函数和类变量在类作用范围内的任何地方被访问。与需要第三方来访问其数据的私有访问符不同，从公共访问符可以访问任何内容。\n\
    \n列表 12.1 – Public and Private.cpp\n\n```cpp\n#include <iostream>\n#include <string>\n\
    using namespace std;\nclass Human {\npublic:\n    void GetName(string); // 声明公共方法函数\n\
    private:\n    string itsName; // 声明私有类变量\n};\nvoid Human::GetName(string name)\
    \ // 定义方法函数\n{\n    itsName = name;\n    cout << \"My Name Is: \" << itsName <<\
    \ endl;\n}\nint main() {\n    Human programmer; // 创建 Human 对象\n    string me;\
    \ // 本地字符串变量\n    cout << \"Hello Programmer!\" << endl;\n    cout << \"What Is\
    \ Your Name: \";\n    cin >> me;\n    programmer.GetName(me); // 对象调用方法函数\n  \
    \  return 0;\n}\n```\n\n程序语法：Public and Private.cpp\n\n#### 公共 (Public)\n\n公共访问符实现了\
    \ `GetName(...)` 方法函数，它带有参数。该参数来自 `main` 中的字符串变量 `me`。\n\n#### 私有 (Private)\n\n\
    由于私有访问符需要方法函数，它产生了一个名为 `itsName` 的字符串变量，这在 `GetName(...))` 函数中被调用并显示。\n\n## 构造函数与析构函数\
    \ (Constructor and Destructor)\n\n构造函数和析构函数是类所涉及的两个端。当通过编写其类型（例如 `Human` 或 `Car`）创建类时，默认会创建两个方法函数。这些函数对程序员是隐藏的，但可以手动编写并应用于程序中以执行某些操作。\n\
    \n### 构造函数 (Constructor)\n\n类构造函数是在对象创建时创建的特殊方法函数。它的名称与类类型相同，因此它在创建该类型的对象时知道如何访问。你不需要定义构造函数，程序会在创建对象时为你完成。然而，这并不总是好事，因为你可能需要使用构造函数，这意味着你必须声明一个。通常情况下是好事，即使它没有被使用。\n\
    \n在 `Human` 类的情况下，如果你想定义构造函数，你可以这样写它：\n\n```cpp\nHuman::Human() { // 执行操作 }\n\
    ```\n\n列表 12.2 – Manual Constructor.cpp\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\nclass Human {\npublic:\n    void GetAge();\nprivate:\n    int\
    \ itsAge;\n};\nHuman::Human() // 当创建 Human 对象时调用\n{\n    cout << “You Are In The\
    \ Human Constructor!” << endl;\n    cout << “Now, We Are Leaping Out!” << endl;\n\
    \    GetAge(); // 调用方法函数\n}\nHuman::GetAge() {\n    itsAge = 21;\n    cout <<\
    \ “What Is To Be “ << itsAge << “ again. Bliss!” << endl;\n}\nint main() {\n \
    \   Human me; // 创建对象\n    return 0;\n}\n```\n\n程序语法：Manual Constructor.cpp\n\n"
