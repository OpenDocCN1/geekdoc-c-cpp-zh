    Chapter 15


    # Templates


    ### What is a Template?


    When initially developed, the concept of templates were never featured in `C++`.
    It took a couple years further from its release, when the `C++03` was released.


    Generic programming a term used when we talk about templates in `C++`. The reason
    due to this is because templates allow the programmer to create functions and
    class that operate in a generic type. These generic types can replace the normal
    types of a function or a variable. Therefore, it is possible to rename a type
    what you wish – avoiding C++ keywords – and have that type be used for different
    types of data.


    First we need to know how to declare a template. A template declaration will go
    above the function or class heading.


    | // syntax for templatestemplate <typename identifier_name> //uses typenametemplate
    <class identifier_name> // uses class |


    Look at the simple class template example below. It shows how to use a template
    with a class and and a function variable inside the class.


    ```cpp

    template<typename T>class Player{public:T CountLives(); // data method declared
    using generic type T from template typenameprivate:T Lives; // data variable declared
    using generic type T from template typename};

    ```


    Within `C++` there are actually two main types of templates, the function and
    class template.


    ### Instances of a Template


    #### Function Templates


    Generic templates and much alike to normal functions. They are also known as template
    functions. It doesn’t matter what name you use for them, as they both mean the
    same thing. The difference between the two is that template functions can have
    arguments of different types. This means that through the function, a single argument
    can be used for different data types. Look below to see how a template is declared.


    ```cpp

    Template<typename identifier_name> // templateType function_name(arguments) {//function
    statements}

    ```


    So, if we have two functions that are `bool` and `int` and we wish to replace
    them with a generic type from a template we could write them like this.


    ```cpp

    Bool myBoolFunction();Int myIntegerFunction();Template <typename T> T myBoolFunction();Template
    <typename T> T myIntegerFunction()

    ```


    Above you can see the same two functions. One the left is the functions without
    being generically typed by a template. On the right, both of them have been generically
    typed. The letter `T` now acts as a data type for these functions. In the `bool`
    function it acts as a `bool` and in the `int` function it acts as a integer data
    type.


    Noted that in the template declaration the generic type is passed in as a parameter:
    `<typename T>`. The `T` after the `typename` is only known as a placeholder that
    can be used to replace the data type of a function. The trick that `C++` does
    is examines the function and from its return type it will decide to change the
    placeholder of `T` to whatever data type `T` has been put in place for. You can
    think of the `typename T` as a substitute for a data type when you are writing
    your code. You will see in the next chapter on the Standard Template Library that
    the vast amount of algorithms used in `C++` are executed – or written – in the
    same manner no matter what the type is.


    Note: You may have seen the function name on the same line as the template definition.
    Due to whitespace being void in `C++` and the template not having a end-line terminator,
    i.e. a semi-colon, the function name does not have to be on the same line as the
    template. It just needs to come after the template declaration.


    The two examples are correct:


    ```cpp

    Template <typename T> void trialTemplate();Template <typename T>void trialTemplate();

    ```


    In the second example, it is to be noted that you cannot have anything in between
    the template declaration and the function.


    ```cpp

    template <typename T>string myTemplate = “My Template”;void trialTemplate();

    ```


    ### Templates of Two or More Generic Types


    We have now learnt about template and how they help you make generic types for
    your functions. Now, we are going to look at how you can have different sets of
    generic types in one template.


    By using the comma operator ‘,’ you can define two or more generic types inside
    a template to use inside a function template. For example, look at the template
    definition.


    ```cpp

    template <typename T, typename Y>void myFunction(T temp1, Y temp2){cout << “Here
    are the typnames from the template: “ << temp1 << “ and “ << temp2 << “.\n”;}int
    main(){myFunction 50, “is the number fifty” );myFunction( true, 18.40f );return
    0;}

    ```


    ### The Magic Behind the Template


    On the creation of a template what you are actually allowing the compiler to do
    is to create as many types of functions that is required for handling the instances
    of that function.


    ### Overloading a Generic Function


    A generic function does have the ability to overload itself. Although, you can
    explicitly overload it, which is known as Explicit Specialization. When a generic
    function is overloaded the function will override the generic function that is
    relative to the version in question.


    Along with creating explicit overloaded versions of generic functions, it is also
    possible to create templates that are overloaded in their specifications. To achieve
    this all you need to do is create another template that is a basic copy of the
    previous, but it must differ in the size of parameters it has.


    ### Standard Parameters and Template Parameters


    When creating a template you can mix generic types with normal data types like
    `int` or `char`. They are written the same as a parameter is in a function.


    ```cpp

    template <class T>;void myFunction(T data, int boo);

    ```


    ### Working with Generic Classes


    Templates can also work with creating and defining generic classes. You write
    the template in the exactly the same way as you would for a generic function.


    ```cpp

    template<class T>class Player {};

    ```


    ### Working with Class Objects


    When you finally create a generic class, then you will need to put that generic
    type with your generic class object. The syntax for creating a generic class object
    is the following:


    `Class-name <generic type> object_name;`


