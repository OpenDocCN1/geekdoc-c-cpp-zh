  trans: "\n当程序员开始探索 C++ 语言（或者说任何计算机编程语言）时，运行时错误可能会成为他们的噩梦。运行时错误是最糟糕的错误，也是导致故障排除论坛充斥着修复损坏程序的请求的主要原因之一。有时，运行时错误不会导致程序崩溃，而是让它以某种特殊且异常的方式运行。\n\
    \n**知识：测试人员与错误**\n每一家为公众生产程序的软件公司都应该有一个软件测试员部门。考虑到他们付出的工作量和时间，这些测试人员的薪水通常偏低。他们的工作是发现程序员可能漏掉的任何类型的错误。\n\
    \n## 编译错误程序\n\n现在让我们创建另一个程序。然而，在这一次我们将漏掉一个分号，以便编译器返回一个错误供我们查看。\n\n列表 1.1：`Compiler\
    \ Error.cpp` \n\n```cpp\n#include <iostream>\nusing namespace std;\nint main(){\n\
    \    cout << \"Hello Programmer!\" << endl;\n    cout << \"This line delivers\
    \ a compiler error!\" << endl // 没有分号\n    return 0;\n}\n```\n\n程序语法：`Compiler\
    \ Error.cpp`\n\n### 缺少分号\n\n阅读代码时，你会注意到在第二个 `endl` 对象之后删除了分号。因为每个语句末尾都需要一个分号，编译器发现了一个错误并且没有运行程序。相反，它返回了一个对错误的解释。见下文。\n\
    \n### 编译错误\n\n```\n|| Build: debug in compiler error ===\nC:\\Chapter 1\\Compiler\
    \ Error\\Compiler Error.cpp\nin function 'int main()':\nC:\\Chapter 1\\Compiler\
    \ Error\\Compiler Error.cpp\n8\nerror: expected ';' before 'return'\n=== Build\
    \ failed: 1 error(s), 0 warning(s) (0 minute(s), 0 second(s)) ===\n```\n\n我们将进入下一章，在那里我们将讨论\
    \ `Hello Programmer.cpp` 的机制。\n\n## 测试自学\n\n以下四个问题关于你刚刚学习的 C++ 编程知识。在进入下一章节之前，请尝试这些问题。\n\
    \n**自测**\n1. C++ 是哪种语言的子集？\n2. `cout` 和 `endl` 对象在程序中实现了什么？\n3. 程序中可能发生的三类错误是什么？\n\
    4. 你应该在程序的什么位置放置分号？\n\n## 第 02 章\n\n# 程序剖析\n\n## 检查 Hello Programmer\n\n在上一章中，你通过创建一个简单的\
    \ Hello World 风格的程序体验了编程，尽管我们称其为 Hello Programmer。这包含了几个需要记忆的不同部分。应用程序的每个部分都是对普通\
    \ C++ 程序组成部分的一个小补充。事实上，尽管 Hello Programmer 看起来并不复杂，但它展示了你构建的每个 C++ 程序所需要的中心基础知识。\n\
    \n在本章中，我们将检查 `Hello Programmer`，将其拆解为组成它的部分。\n\n### 包含预处理器\n\n当程序员完成编码并按下构建按钮时，编译器会调用预处理器指令（任何以\
    \ `#` 为前缀）开始工作。程序员在这一阶段不需要恐慌，因为编译器会自动检查预处理器，并遵守程序给它的指令。\n\n**技术杂谈：预处理器指令**\n预处理器指令是程序中以\
    \ `#` 符号开头的单独代码行。在在上一个程序中，给预处理器的指令被称为 `include`。\n\n在执行时，编译器会搜索你的代码寻找任何 `#` 符号，并查看其后的内容。在之前的两个例子中，`include`\
    \ 一词连接在 `#` 符号上，意味着它包含了写在关键字 `include` 之后的文件，在这种情况下，这就是 `<iostream>`。\n\n**知识：#\
    \ 符号**\nC++ 中用于包含预处理器的 `#` 符号被称为“哈希标记（hash tag）”或“井号（pound sign）在使用社交媒体网站 Twitter\
    \ 时可能听过它。\n\n注意，包含在程序中的预处理器指令末尾不需要分号。这是因为预处理器指令不是一条语句。这里有两个包含 `<iostream>` 头文件的例子。一个代码是正确的，而另一个给编译器传递了错误。\n\
    \n```cpp\n#include <iostream> // 这是正确的\n#include <iostream>; // 这是错的\n```\n\n\
    ### 头文件\n\nC++ 头文件的集合是海量的。当我们检查之前编写的程序时，我们只看到了头文件 `<iostream>`。书中的每个完整程序都包含了 `<iostream>`\
    \ 头文件。但什么是头文件呢？\n\n头文件是一个可以在程序中使用的声明、对象和函数的集合。通过在程序中包含头文件，实际上等同于将文件中的所有对象和函数都供程序使用，以便程序利用它们。所以，当你包含\
    \ `<iostream>` 头文件时，它允许在你的程序中使用 `cin`、`cout` 和 `endl` 命令。\n\n### 注释\n\nC++ 程序中的注释是人类可读的语法，用于理解某些编写的代码是如何运行的。编译器在运行时不会读取注释。相反，它们仅仅是为了帮助程序员以及任何检查程序的人理解其运行方式。\n\
    \nC++ 中使用了两种形式的注释。第一是标准的 C 注释，它允许程序员在多行之间划分注释。\n\nC 注释是旧式，通过 `/*` 开始，然后编写注释，并以\
    \ `*/` 结束。\n\n```cpp\n/* 这是一个 C 注释 C 注释可以跨多行 */\n```\n\n注释的另一种形式是 C++ 风格，它是单行的。创建\
    \ C++ 注释，你需要写双斜杠 `//` 然后写注释。一旦初始化回车（换行），注释就会结束。因此，要写另一个 C++ 注释，你需要再次输入 `//`。\n\
    \n```cpp\n// 这是一个 C++ 注释\n// 这是另一个 C++ 注释\n```\n\n阅读这本书，你会注意到我在程序示例中使用 C++ 风格的注释。由于本书关注\
    \ C++ 语言，我认为使用这种语法是正确的。尽管，作为程序员，你有权使用符合自己喜好的注释类型。\n\n**知识：练习编写注释**\n编写程序员理解的注释是一项简单的工作。然而，编写外部人士阅读并理解的注释是一项艰巨的任务，需要练习。为他人编写优秀、易懂的注释本身就是一种艺术。记得在你编写每个程序中练习注释。\n\
    \n### 命名空间\n\n标准 C++ 库中的元素定义在一个命名空间内。在我们之前的程序中，在主函数打开之前使用了一个名为 `std` 的命名空间。你会注意到通过\
    \ `using namespace` 命令调用了命名空间。\n\n### 函数块\n\n在第 6 章中，C++ 函数的主题将引起我们的注意。但现在，我将简要概述函数的作用。函数是代码块，非常适合单独分离某些数据并保持代码整洁。之前程序中的\
    \ `main` 函数是启动任何可执行程序的启动函数。\n\n"
- fmt: "\nEvery program in this book has a `main` function. It is a program's heart\
    \ and soul. When you build a program, it runs from a top-down perspective through\
    \ the code, starting in `main`, dealing with every line of code it comes across\
    \ before it reaches a `return` statement and ends.\n\n### Whitespace\n\nWhitespace\
    \ are the gaps that are left clear in your programs. These are the spaces, tabs\
    \ and new-lines that are made so your program will appear cleaner and clearer.\
    \ Whitespace – alike to comments – does not affect the program and are not read\
    \ by the compiler. It is wise to use whitespace to format the look of your program\
    \ code so it is easy to read.\n\n## The Next Stage\n\nEven though programs do\
    \ get massive with thousands of coded lines, they operate under the same simple\
    \ standard as our Hello Programmer. Before we move onto the next stage, take a\
    \ quick glance at one last program that uses data storage objects called variables\
    \ and the input object inside the header file `<iostream>`, called `cin`. The\
    \ latter object allows for the user to input their own data at the programs run-time.\n\
    \n#### Listing 2.0 – See-In and Variables\n\n```cpp\n#include <iostream>\n#include\
    \ <string> // includes new header file\nusing namespace std;\nint main(){\n  \
    \  cout << \"Please enter your name, programmer: \"; // displays text\n    string\
    \ yourName; // creates string variable\n    cin >> yourName; // input data into\
    \ variable\n    cout << \"Thank you, \" << yourName << \".\" << endl; // displays\
    \ variable data\n    return 0;\n}\n```\n\n## Time to Test Yourself\n\nThe following\
    \ four questions are in regards to what you have just learned about programming\
    \ in C++. Attempt these questions before you move forward to the next chapter.\n\
    \n1. What is the difference between a C and C++ comment?\n2. What direction does\
    \ program code follow when being read by the compiler?\n3. What is whitespace?\n\
    4. Which keyword is required to place a header file in a program?\n\n## Chapter\
    \ 03\n\n# Data Storage, Variables & Constants\n\n## What is a Variable?\n\nIn\
    \ today’s modern world, there are millions of computers constantly processing\
    \ data on a daily basis. One question programming-wannabes ask is how a computer\
    \ stores data it receives. The answer is in variables. Essentially, variables\
    \ act as containers that hold different types of data, which C++ can utilize and\
    \ manipulate. When a variable is created, the computer stores it in memory banks,\
    \ known as Random Access Memory (RAM). These memory banks have addresses that\
    \ allocate space for a variable to situate in. However, remembering memory addresses\
    \ is a difficult task. When variables are created they have a memory address and\
    \ name. The latter acts like a label for the programmer to use in replace of an\
    \ elongated address.\n\n## What is Random Access Memory?\n\nRandom Access Memory\
    \ is the main source that is capable of storing a computers actions, like creating\
    \ a variable or storing a piece of text, which is cut to the computers clipboard.\
    \ Once this is done, the computer can work with the RAM to access data quick and\
    \ efficiently. The capacity of memory in a computer is how it dictates the volume\
    \ amount of data it can potentially hold.\n\n### Bits and Bytes\n\nRAM is created\
    \ from bits and bytes. A byte is larger than a bit. As a result, a byte is formed\
    \ from 8 bits. Consider memory as small empty boxes ready to store items for the\
    \ period of a programs runtime. Inside each of these boxes a program can store\
    \ a byte of data. Computer memory is accessed at random, unlike the data on a\
    \ DVD or hard drive. Due to this purpose, data is capable of being accessed much\
    \ quicker.\n\n> **Warning: Random Access Memory is Not Drive Space**: Don’t confuse\
    \ the difference between RAM to the capacity of a hard-drive or DVD. To explain\
    \ the difference, when you load a program it is accessed from a hard-drive, DVD\
    \ or some other peripheral. When the program is loaded and run, any data the computer\
    \ is required to know, is stored in RAM for the computer to utilize when required.\n\
    \n## Dynamic and Static Typed Languages\n\nWe are going to examine two styles\
    \ of typed languages that look at variable data types differently. These are known\
    \ as:\n\n* Dynamic Typed Language.\n* Static Typed Language.\n\n### Dynamic Typed\
    \ Language\n\nIn a dynamic typed language, the decision on a variables type depends\
    \ on the data value it’s assigned. For example, if you have a variable named `myVar`\
    \ and it has a data value of an integer number, say 12, then a dynamic typed language\
    \ will recognise the variable as an integer. Conversely, if you were to alter\
    \ the value of `myVar` to something like ‘A’ then the compiler would start to\
    \ appreciate the variable as a character.\n\n### Static Typed Language\n\nOn the\
    \ flip side, static typed languages have the rule a variable must be declared\
    \ as a certain type before it can be utilized in a program. Therefore, if `myVar`\
    \ is equal to the number 12, then most likely the variable would be declared as\
    \ an integer, or perhaps some other numerical data type, like a `float` or `short`.\
    \ In essence, static typed languages initially look at the data type to dictate\
    \ what type of value it can store.\n\n## C++ is a Static Typed Language\n\nC++\
    \ is a static typed language because it has a set standard for different types\
    \ of data that can be read by the compiler. As a programmer, you need to allocate\
    \ the right data type with the correct data before the variable is used. It is\
    \ pointless and terrible programming to assign an integer value to a string variable,\
    \ as this shall come back with a compiler error.\n\n## Learn the Data Types\n\n\
    Most programming languages, C++ included, have a variety of data types that are\
    \ utilized to declare variables. The range of data types are shown in the table\
    \ below, along with the individual sizes in memory.\n\n| DATA TYPE | NAME | SIZE(in\
    \ bytes) |\n| :--- | :--- | :--- |\n| `int` | Integer | 4 |\n| `short` | Short\
    \ Integer | 4 |\n| `long` | Long Integer | 8 |\n| `long long` | Long Long Integer\
    \ | 8 |\n| `float` | Float | 4 |\n| `double` | Double | 8 |\n| `char` | Character\
    \ | 1 (per char) |\n| `bool` | Boolean | 4 |\n| `string` | String | 1 (per char)\
    \ |\n\nIt is clear to see there are a lot of variable data types to learn. Although,\
    \ you shouldn’t worry about not knowing the data types like off the back of your\
    \ hand. You’ll gradually learn each one as you progress through this chapter and\
    \ the rest of the book. Although, to begin, I want to show you how variables are\
    \ declared and defined in C++.\n\n## Declare Variables\n\nBefore a program can\
    \ utilize different types of variables, a declaration of the desired variable\
    \ is required. What this entails is coding the variable with its desired data\
    \ type and user-defined name. To declare a variable the following syntax is required.\n\
    \n| data type | variable name |\n| :--- | :--- |\n| `int` | `myNumber` |\n\nIn\
    \ this example the keyword `int` declares the variable `myNumber` as an integer.\
    \ Therefore, when you declare a variable the process of making space in memory\
    \ begins. Many times a program shall require its variable to have values already\
    \ initialized before runtime. What this means variables are defined with values\
    \ of their data types before the program is ran.\n\nFor example, an integer variable\
    \ requires to equal a whole number, and a `char` variable requires a character,\
    \ such as ‘E’ or ‘$’ for its definition. Note the single quotation marks for when\
    \ declaring a `char` variable.\n\nThe next program demonstrates the concept of\
    \ declaring and defining variables before run-time of a program.\n\n#### Listing\
    \ 3.0 – Declare and Define Variables.cpp\n\n```cpp\n#include <iostream>\n#include\
    \ <string>\nusing namespace std;\nint main() {\n    int myNumber = 12;\n    char\
    \ myChar = 'A';\n    cout << \"Number: \" << myNumber << endl;\n    cout << \"\
    Character: \" << myChar << endl;\n    return 0;\n}\n```\n"
