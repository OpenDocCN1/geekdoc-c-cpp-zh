    \ scope and the difference between the two methods.\n\n### Global Data\n\nData\
    \ like variables and constants coded outside of any function or outside its parentheses,\
    \ even `main`, is known as global data and can be employed anywhere in a program.\n\
    \n### Local Data\n\nVariable and constants created inside a function are known\
