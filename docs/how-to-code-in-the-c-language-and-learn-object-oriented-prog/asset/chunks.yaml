  trans: "\n从程序员的角度来看，当代码编写完成后，初始阶段就结束了，但在后台会开始一个检查、编译、链接和运行代码的过程，以便能够构建并运行一个完整的程序。\n\
    \n下面的图展示了程序在完整创建过程中必须经历的一个自上而下的循环。\n\n![](img/image00228.jpeg)\n\n如果程序员能够创建出不带有任何编译器、链接器或运行时错误的程序，那将将是一件轰动人心的事情。这看起来就像他们生活在一个完美的世界里，而且会让让我们这些作者没话可写了。遗憾的是，世界并非完美。由于这一事实，编译器在尝试构建程序时，会在每个阶段检查程序，如上方的\
    \ C++ 程序开发周期所示。\n\n通过使用开发过程，你可以监控程序开发周期所经历的每一步，以及程序为何是向前推进（更接近完成的程序）还是由于某种类型的错误而停滞。在程序构建过程中，如果发现了任何错误，编译器通常会提醒你并停止循环。之后，在检查错误列表并修复它们后，你可以尝试重新构建程序，如果所有过程都完全完成，程序就会运行供你查看。\n\
    \n尽管如此，还存在一些被称为运行时错误的错误。这些错误只有在程序运行时才会被编译器识别，并且是因为某行代码没有执行不当而被发现的。\n\n## 你的第一个\
    \ C++ 程序\n\n在编程教育之初，大多数程序员都从一个名为“Hello World!”的简单程序开始。然而，由于大多数编程书籍都过度使用了这个初学者程序，在本书书中将不会从这个例子开始。相反，你将发挥一点创意，开发一种不同的风格，这种风格也非常简单。\n\
    \n一旦你读完代码并运行了程序，请继续阅读，因为程序语法解释了每一行代码是如何运行的。\n\n列表 1.0 – Hello Programmer.cpp\n\
    \n```cpp\n// my first C++ program \n#include <iostream> // 包含程序的头文件\nusing namespace\
    \ std; // 使用标准命名空间\nint main() // 程序的开始\n{\n    cout << \"Hello Programmer!\"\
    \ << endl; // 在屏幕上显示文本\n    cout << \"Welcome To The C++ Programming Language\
    \ Made Simple!\" << endl; // 显示更多文本\n    return 0; // 结束程序\n}\n```\n\n程序语法：Hello\
    \ Programmer.cpp\n\n### 注释行\n\n程序的起始行是 C++ 注释，因为它以两个正斜杠（`//`）开头。当输入两个 `//` 时，程序向编译器信号后面将是注释。\n\
    \n### 预处理行\n\n接下来，预处理器指令符号（`#`）通过包含在尖括号 `<>` 中来包含头文件 `<iostream>`。在这个示例中，选择头文件\
    \ `<iostream>` 来使程序能够使用某些声明（函数、对象等），例如 `cout` 和 `endl` 对象。\n\n| 知识点：头文件 | 头文件中填充了函数、对象和命令的声明，这些声明可以包含在程序中。要使用头文件需要预处理器符号（`#`）。\
    \ |\n\n### 命名空间行\n\n`using namespace std` 这一行允许在程序中使用名为 `std`（标准）的命名空间。你可以将命名空间视为包含其他类型数据的胶囊，可以在程序中使用。\n\
    \n### main 函数\n\n`main` 函数引导程序的开启。每个控制台程序都以 `int main` 或 `int main` 的变体开始。在其他书中，这可能被写为\
    \ `tmain` 或简单的 `int main`，后面跟着括号中的一组参数。这取决于用于开发程序时使用的是哪种编译器。\n\n无论情况如何，`main`\
    \ 函数始终是程序的入口。程序中的其他函数无法调用 `main`，尽管它们可以向它返回值。\n\n在 `main` 函数之后有一个左括号 `{`，在程序结束附近有一个右括号\
    \ `}`。在这些括号之间输入程序代码。在这些括号之间输入的内容都是程序必须遵循的指令。\n\n### cout 和 endl 对象\n\n程序使用的对象接下来将展现它们的面目。`cout`\
    \ 对象（读作 see-out）显示双引号之间的文本，文本紧跟在对象和 `<<` 符号之后。`<<` 符号是输出运算符，告诉编译器后面的文本将要显示。在文本之后，你有另一个\
    \ `<<` 带有 `endl`（读作 end-l）。此命令简单地结束当前行。下一行执行相同的操作，但显示的是不同的文本。\n\n### return 语句\n\
    \n`return` 语句通过返回值 `0` 结束程序。这意味着如果一切进展顺利，程序就成功到达了这一点并结束，没有报告任何错误。\n\n| 技术杂谈：断点\
    \ | 使用某些编译器（如 Visual C++）构建程序时，你创建的程序将在屏幕上闪烁并在几毫秒内消失。上面的程序就是其中一个例子。为了防止它立即终止，你必须在程序中使用断点。在\
    \ Visual C++ 中，找到程序的结束 return 语句并按 F5。左边框内会出现一个红点。当程序运行时，它将在接收到关闭指令之前停止。 |\n\n\
    ## 编程错误\n\n当你第一次编写程序时有遇到任何错误吗？我猜答案是肯定的。别担心。在编程时出现编译器错误是正常现象。当你编写的程序变成成百上几千行代码时，你会发现编译器会发现无数错误。一旦发现了这些错误——取决于所使用的编译器——它通常会告诉你哪里出了问题并建议修复方法。\n\
    \n| 技术杂谈：编译器单步执行 | 大多数编译器都有一个可以在菜单栏访问的功能，称为单步执行（Step-In）。此功能允许程序员一次移动一行代码，这对于程序员来说是实用的，因为它是过滤错误或不合理代码的有效方法。\
    \ |\n\n### 编译器错误\n\n编译器错误可能是编程时最容易修复的错误。如果你的任何程序发现了编译器错误，它们将在程序组装时被发现。这些错误表明程序内部的代码存在问题，并通知编译器在处理错误之前无法运行。在大多数情况下，这些类型的错误由于语法不正确。\n\
    \n### 链接错误\n\n这些类型的错误通常由于代码中的某些内容尝试链接但失败而导致。例如，在一个使用 `<iostream>` 头文件的程序中，如果 `<iostream>`\
    \ 没有输入正确，可能会导致程序发送链接器错误，因为程序正尝试从一个由于拼写错误而无法识别的头文件中使用对象。这些错误与编译器错误不同，对于初学 C++ 的程序员来说最初可能会感到困惑。\n\
    \n### 运行时错误\n\n"
- fmt: "\nRun-time errors can be the bane for programmers when they begin their quest\
    \ with the C++ language, or any computer programming language for that matter.\
    \ Run-time errors are the worst type of errors and one the biggest causes why\
    \ troubleshooting forums are jammed with demands to fix a broken program. Sometimes\
    \ run-time errors do not crash a program, but instead make it behave in a particular\
    \ and unusual way.\n\n**Knowledge: Testers & Errors**\nEvery software company\
    \ that produces programs for the public shall have a department of software testers.\
    \ These testers are normally underpaid for the amount of work and hours they put\
    \ in. Their job is to discover any type of error the programmers might’ve missed.\n\
    \n## A Compile Error Program\n\nLet us now create another program. However, in\
    \ this we are going to discount a semi-colon so the compiler reads back an error\
    \ for us to see.\n\nListing 1.1: `Compiler Error.cpp` \n\n```cpp\n#include <iostream>\n\
    using namespace std;\nint main(){\n    cout << \"Hello Programmer!\" << endl;\n\
    \    cout << \"This line delivers a compiler error!\" << endl // no semi-colon\n\
    \    return 0;\n}\n```\n\nProgram Syntax: `Compiler Error.cpp`\n\n### No Semi-Colon\n\
    \nReading through the code, you will notice that the semi-colon has been removed\
    \ after the second `endl` object. Because every statement requires a semi-colon\
    \ at its end, the compiler discovers an error and does not run the program. Instead,\
    \ it comes back with an explanation of the error. See below.\n\n### Compiler Error\n\
    \n```\n|| Build: debug in compiler error ===\nC:\\Chapter 1\\Compiler Error\\\
    Compiler Error.cpp\nin function 'int main()':\nC:\\Chapter 1\\Compiler Error\\\
    Compiler Error.cpp\n8\nerror: expected ';' before 'return'\n=== Build failed:\
    \ 1 error(s), 0 warning(s) (0 minute(s), 0 second(s)) ===\n```\n\nWe are going\
    \ to move onto the next chapter, where we shall discuss the mechanics of `Hello\
    \ Programmer.cpp`.\n\n## Time to Test Yourself\n\nThe following four questions\
    \ are in regards to what you have just learned about programming in C++. Attempt\
    \ these questions before you move forward to the next chapter.\n\n**Test Yourself**\n\
    1. C++ is a subset of what language?\n2. What does the `cout` and `endl` objects\
    \ achieve in a program?\n3. What are the three types of errors that can occur\
    \ in a program?\n4. Where should you place a semi-colon in a program?\n\n## Chapter\
    \ 02\n\n# Anatomy of a Program\n\n## Examining Hello Programmer\n\nIn the previous\
    \ chapter you had a taste of programming by creating a simple Hello World style\
    \ of program, although we called it Hello Programmer. This included several different\
    \ segments to remember. Every part of the application was a small addition to\
    \ what makes up a usual C++ program. In fact, even though Hello Programmer did\
    \ not appear like much, it showed the central fundamentals required for every\
    \ C++ program you build.\n\nIn this chapter we are going to examine `Hello Programmer`,\
    \ breaking it down into the parts that formulated it.\n\n### Include the Pre-Processor\n\
    \nWhen the programmer is finished coding and the build button is pressed, the\
    \ compiler calls for the pre-processor directives (anything with a `#` prefixed)\
    \ to kick in. The programmer does not need to panic at this stage, as the compiler\
    \ examines the preprocessers automatically and obeys the instructions given to\
    \ it by the program.\n\n**Technical Talk: PreProcessor Directives**\nThe preprocessor\
    \ directives are individual lines of code in a program that starts with the `#`\
    \ symbol. In the previous program the instruction given to the preprocessor was\
    \ called `include`.\n\nWhen operated, the compiler searches through your code\
    \ looking for any `#` symbols and seeing what comes after. In the previous two\
    \ examples, the word `include` is attached to the `#` sign, meaning it incorporates\
    \ the file written after the keyword `include`, and in this case this is `<iostream>`.\n\
    \n**Knowledge: The # Symbol**\nThe `#` symbol that is used to include preprocessors\
    \ in C++ is called the “hash tag” or “pound sign”. You might have heard of this\
    \ when using the social media site Twitter.\n\nNote that the preprocessor directives\
    \ that are included in a program do not require a semi-colon at the end. The reason\
    \ is because the preprocessor directive is not a statement. Here are two examples\
    \ of including the `<iostream>` header file. One is coded correct, while the other\
    \ delivers an error to the compiler.\n\n```cpp\n#include <iostream> // this is\
    \ correct\n#include <iostream>; // this is wrong\n```\n\n### Header Files\n\n\
    The C++ collection of header files is enormous. When the programs that have been\
    \ previously coded are examined we see only the header file `<iostream>`. Every\
    \ full program in this book includes the `<iostream>` header file. But what is\
    \ a header file?\n\nA header file is a collection of declarations, objects and\
    \ functions that can be employed in a program. By including a header file in a\
    \ program, it is practically like you are implementing all the objects and functions\
    \ in the file to the disposal of the program, so it can utilize them. So, when\
    \ you include the `<iostream>` header file, it allows for the use of the `cin`,\
    \ `cout` and `endl` commands to be employed in your programs.\n\n### Comments\n\
    \nThe comments in a C++ program are human-readable syntax to understand how certain\
    \ written code operates. Comments are not read by the compiler at run-time. Instead,\
    \ they are simply there to help the programmer, and anyone else who checks the\
    \ programs, to understand it operates.\n\nThere are two forms of comments used\
    \ in C++. First is the standard C comment that allows the programmer to divide\
    \ the comment between multiple lines.\n\nA C comment, which is old style, is written\
    \ by starting with `/*` then writing the comment and ending with `*/`. These comments\
    \ can fit on multiple lines and everything between `/*` and `*/` is part of the\
    \ comment.\n\n```cpp\n/* This is a C commentA C comment can run on multiple lines\
    \ */\n```\n\nThe other variation of a comment is the new C++ style, which runs\
    \ on a single line. To create a C++ comment, you need to write two slashes `//`\
    \ followed by the comment. Once a carriage return is initialized and the line\
    \ breaks, the comment finishes. Therefore, to write another C++ comment, you are\
    \ require to type `//` again.\n\n```cpp\n// This is a C++ comment\n// This is\
    \ another C++ comment\n```\n\nReading through this book, you shall notice I use\
    \ the C++ style comment in the program examples. Since the book concentrates on\
    \ the C++ language, I believe it is correct to use this syntax. Although, as a\
    \ programmer, you are eligible to employ the comment type that suits your own\
    \ preference.\n\n**Knowledge: Practise Writing Comments**\nWriting comments that\
    \ the programmer understands is an easy job. Although, writing comments that outsiders\
    \ are going to read and understand is a difficult task and requires practice.\
    \ Writing a great, understandable comment for another person’s eyes is an art\
    \ form in itself. Remember to practice commenting in every program you code.\n\
    \n### Namespaces\n\nThe elements inside the standard C++ library are declared\
    \ within a namespace. In our previous programs, a namespace called `std` is employed\
    \ before the primary function is open. You shall notice the code line `using namespace`\
    \ does appear in all the programs written in this book. A namespace is called\
    \ by the command `using namespace` followed by the name of the namespace.\n\n\
    ### Function Blocks\n\nIn chapter 6 the subject of C++ functions are brought to\
    \ our attention. But for now, I shall give a brief overview of what a function\
    \ does. Functions are blocks of code that are great for individually separating\
    \ certain data and keeping your code looking clean. The `main` function in the\
    \ previous program is the function that starts the ball rolling for any executable\
    \ program.\n"
