  trans: "\n\n在下面的程序中，你将之前提到的两个命名空间，并使用它们来创建两种不同价格（整数值）和不同奶酪来源（字符串值）的披萨类型。\n\n###\
    \ Listing 16.0 – Pizza Namespace.cpp\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nnamespace PizzaExpressNY {\n    class NewYorkCompany {\n    public:\n\
    \        void MeatFeastPrice(int);\n    private:\n        int price;\n    };\n\
    }\nnamespace PizzaExpressLdn {\n    class LondonCompany {\n    public:\n     \
    \   void MeatPrice(int);\n    private:\n        int price;\n    };\n}\nvoid PizzaExpressNY::NewYorkCompany::MeatFeastPrice(int\
    \ price){\n    cout << \"The Price of the Meat Feast at Pizza Express New York\
    \ is $\" << price << endl;\n}\nvoid PizzaExpressLdn::LondonCompany::MeatPrice(int\
    \ price){\n    cout << \"The Price of the Meat Feast at Pizza Express London is\
    \ £\" << price << endl;\n}\nint main(){\n    PizzaExpressNY::NewYorkCompany NYC;\n\
    \    PizzaExpressLdn::LondonCompany LC;\n    NYC.MeatFeastPrice(20);\n    LC.MeatPrice(14);\n\
    \    return 0;\n}\n```\n\n### 编程语法：Pizza Namespace.cpp\n\n#### 命名空间\n\n如你所示，两个命名空间都包含一个类，其中包含一个同名的函数和一个变量。然而，由于它们位于不同的命名空间下，这些函数和变量作为独立的来源。\n\
    \n## 命名空间有助于良好的编程\n\n在编写程序时，你可以看到为什么命名空间概念是一个很好的东西。如果你还没有尝试之前的程序，请尝试一下并看看它是如何运行的。它们允许你在不同的方法中使用变量或函数。\n\
    \n> **警告：命名空间外的重复**：除非使用命名空间来将它们分开，否则不要编写具有两个或多个相同名称的类/函数。\n\n通常，良好的编程是将编写好的命名空间与类和函数一起存储在头文件中，然后将头文件包含到主\
    \ `.cpp` 文件中。稍后我们将创建一个包含命名空间的头文件，并展示它们被包含到 `.cpp` 文件中的区别。\n\n通过将命名空间存储在不同的头文件中，你可以帮助程序保持整洁，避免一个文件中出现大量代码导致看起来杂乱。每个头文件和每个\
    \ `.cpp` 文件都应该有一个目的。\n\n例如，你可以有一个包含 `Player` 类的头文件，它告诉关于关于游戏 `Player` 的所有信息，从生命值、血量到移动它的按键。\n\
    \n## 什么是头文件？\n\n正如已经讨论过的，如果你拥有我在书开头提到的 IDE 之一，你可能已经看到 `.cpp` 文件并不是 C++ 中可以开发的唯一文件。在头文件中，你会发现在类中实现的变量和函数的声明。\n\
    \n## 包含头文件\n\n你通过使用 `#` 符号配合 `include` 单词来包含头文件，后面跟着在 `<>` 括号中的头文件名称。例如：\n\n```cpp\n\
    #include <iostream>\n#include <ctime>\n#include <Windows>\n```\n\n到目前为止在书中看到的头文件是\
    \ C++ 内置的文件，这意味着通过在其名称周围使用 `<>` 括号来包含。\n\n然而，当你编写自己的具有 `.h` 扩展名的头文件时，你必须以略有不同的方式编写头文件。不是在头文件之间使用\
    \ `<>` 括号，而是将 `<>` 替换为双引号。例如：\n\n```cpp\n#include \"PizzaCompany.h\"\n#include\
    \ \"Player.h\"\n#include \"Budget.h\"\n```\n\n你可以看到 `\" \"` 与 `<>` 之间的区别，包含自己的或用户编写的头文件的另一个方面是在结尾添加\
    \ `.h` 扩展名。\n\n## 在头文件中创建命名空间\n\n在创建命名空间时，良好编程语法的一个特性是将用户定义的命名空间放在头文件中，而不是主 C++\
    \ 文件 (`.cpp`) 中。这样做的一个有利原因是，你不希望主程序文件被几十行代表一个或多个命名空间的代码所困。记住，除了命名空间，类和某些函数（特别是与类关联的数据成员）也被输入到头文件中。通过在头文件中表示此类数据，程序利用这些声明唯一需要的就是\
    \ `#include` 头文件。这里是一个自定义头文件的示例。\n\n```cpp\n#include \"inProgram.h\"\n```\n\n\
    ## 创建多个头文件\n\n程序通常很大，会创建多个不同的文件。无论这些文件是 `.exe`（可执行文件）、`.dll`（动态链接库）或其他类型，这些文件都是由几十个源文件头文件构建而成的。\n\
    \n## 测试你的时刻\n\n以下问题涉及你在本章中学习的编程概念。在继续之前，请尝试这些问题。\n\n1. 你能解释头文件的概念吗？\n2. 你能解释命名空间的作用是什么吗？\n\
    3. 使用什么关键字来包含头文件？\n4. 将命名空间包含在头文件中有什么好处？\n\n## 结语\n\n感谢阅读本书。请你可以在你偏好的 Amazon 网站上为这本书留留评论吗？\n\
    \n谢谢\n\nAlexander Harrison\n\n"
