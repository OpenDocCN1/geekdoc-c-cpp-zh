    ## What is a Pointer?


    A great piece of toolkit a C++ programmer is handed when they decide to code is
    the something called a pointer. However, what is a pointer?


    The pointer is a variable that indicates a position in memory and nets its address.
    Therefore, with the memory address in its hands, the pointer can directly manipulate
    the computer’s source of memory. This makes pointers great to work with, once
    understood.


