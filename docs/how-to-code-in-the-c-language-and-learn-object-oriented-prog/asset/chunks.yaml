    \n程序语法：Login Details.cpp\n\n#### 多变量\n\n该程序展示了如何仅使用一次数据类型名称来分配多个变量。在这种情况下，`string`\
    \ 变量被用于创建两个名为 `username` 和 `password` 的变量，它们将用于一个辅助登录系统的程序。\n\n## 将变量放入内存中\n\n\
    当变量被创建时，编译器会将它们分配到计算机的 RAM 中。当此发生时，它们会进入栈中，以便在程序调用单个变量时可以使用它们。这意味着你的程序将使用计算机内存的一个区域。\n\
    \n## 操纵数据类型名称\n\n很快，你的程序规模就会增大。五行代码将变成二十五行；二十五行将变成五十行，然后五十行变成一百行，以此类推。\n\n与此同时，随着程序的增长，你使用的变量和常量数量也会增加。随着数量的增加，编写如\
    \ `unsigned short int`、`double float` 或 `signed char` 这样的数据类型来初始化变量或常量会非常繁琐。\n\
    \n相反，你可以给数据类型的格式一个用户定义的名称，编译器将将其等同于你指定的数据类型。实现这种方法的方法是使用 `typedef` 关键字。\n\n使用\
    \ `typedef` 的语法如下：\n\n| `typedef` | 数据类型 | 新名称 |\n\n以下是一个示例：\n\n| `typedef` |\
