    ## How Does Memory Work with the Array?


    Just like when we talked about declaring variables and how they reserve memory
    to be allocated to, the same happens with arrays. Because when an array is declared
    with say 6 elements then the compiler springs into action and creates the space
    – if enough is available – to fit the array into. Even if the user of the program
    at the time does not use all of the array elements, they still need to be placed
    into memory.


    For example, let us look at an array and it stores that in memory.


    In this diagram you can see an array of 3 elements. The blue boxes represent the
    location of different memory addresses. This means that each array element is
    subjected to its own location in memory.


    The first element is the first variable in memory and it stores the value of 23\.
    The second element is the next variable and stores the value of 24\. The last
    element and variable stores the value of 25\. Each of these values that are stored
    in different areas of memory will have alternative memory addresses that are ran
    by binary numbers.


    Chapter 12


    # Classes


    ## What Is A Type?


    The simple answer to this question is to say a type is a category of something.
    The reasons for this is because in life everyone considers and judges things in
    types. For example, as you are learning C++, you can think of this as a type of
    programming language. Or another example is to say a television is a type of digital
    technology.


    When writing programs using Object-Oriented Programming and classes, a programmer
    can create whatever type of something they require for the program. Once a type
    is created, it is stored in the computers RAM, just like a variable. Then using
    the types created, the programmer can adapt and flesh them out by installing functionality
    and power into the type.


    The functionality and power that is capable of being placed in a type is constructed
    by the use of predefined C++ built-in types, like the int, float and bool data
    types.


    If you have read book one of this series, you may remember the topic of program
    design cropped up in the first chapter. Don’t worry if you cannot remember. In
    the chapter, I said that every program is designed to solve a problem. One single
    problem. It doesn’t matter what the problem accounts to. You could build a program
    to track of a company’s stock or to manage your personal finances. Whatever the
    problem, no matter how big or complex it is, by employing types to create class
    objects it makes programming far easier when solving problems.


    Types really are not new to you as an intermediate programmer of C++. If you already
    know how to utilize variables and constants in C++, then you are well along the
    road to understanding class types. However, if you are estrange to this concept,
    then stop reading this book, jump onto the Amazon/Kindle website and purchase
    the previous book in this series.


    | Technical Talk: Class TypesWhen a class is created in C++ what is exactly happening
    is a blueprint of a user-defined data type is being formed. The type does not
    affect the data that resides inside the class, but it does determine the class
    name. With a class type created, a programmer can then manage a class to construct
    a user-defined object, but employing such things as data variables and method
    functions. |


    ## Creating a Class


    In C++ classes are the primary layer of Object-Oriented Programming and use the
    capability of encapsulation to conceal data from any section of a program that
    is not required to know about it. In some respects they are an expanded concept
    of data structures, which were used in the C language. However, unlike classes
    in C++, structures do not have the ability to create functions inside themselves.


    To create a class you must follow the class definition syntax, which starts with
    the keyword class and then its type. Afterwards, must like a function, the body
    of the class is enclosed in brackets ( { } ), which then ends with a semi-colon.
    The reason for the semi-colon at the end of the class and outside the brackets
    is due to the class definition being a complete statement.


    For example, for a class called Human it would be defined in this way.


    | class <class_name> {   // statements}; |


    | class Human {}; |


    An important not to make about the construction of classes is they are a single
    entity, in the case that they do not reside in functions, such as main, but instead
    are written before any function begins. In fact, classes, again like functions,
    are usually coded in header files. Later on, you shall learn about header files,
    but for now just code any class you create in the main .cpp file.


    Listing 12.0 – A Straightforward Class.cpp


    | #include <iostream>using namespace std;// creates a class type named Humanclass
    Human {// class data goes here};int main(){cout << "Hello Programmer!" << endl;return
    0;} |


    Program Syntax: A Straightforward Class.cpp


    #### The Human Class Type


    This program might bring you back to the early days of beginning to learn C++
    with the Hello World! style of program. This program is only a blueprint that
    shall be worked on throughout the chapter to show how a class is built, from the
    barebones to having functionality.


    Inside the program there is the beginning of a Human class type built, but has
    no functionality connected to it. To give it power and functionality data variables
    and method functions must be installed into the class.


    ## Data Variables & Method Functions in Classes


    You have covered the basic blueprint of constructing the barebones of a class,
    by defining a new type and enclosing it inside curly brackets. This is similar
    to creating a normal function. Although, unlike a function, a class concludes
    with a semi-colon on the outside of the closing curly bracket.


    Still, no class is complete whilst being void of functionality and power. To implement
    these crucial units into a class, data variables and method functions are required.
    Look at the previous example written out again, but this time with a method function
    and data variable.


    | class Human {void GetName(); // method functionstring itsName; // class variable};
    |


    ## Class Variables'
