- fmt: "\nFrom a programmer’s perspective, when the code is written the initial stage\
    \ is over, but behind the scenes a process begins of checking, compiling, linking\
    \ and running the code, so it can build and operate a complete program.\n\nThe\
    \ following diagram illustrates a top-down cycle of the process that a program\
    \ is required to amble through for its complete creation.\n\n![](Images/image00228.jpeg)\n\
    \nIt would be something sensational if programmers were capable of creating programs\
    \ that carried no compiler, linker, or run-time error. It might seem like they\
    \ were living in a perfect world, and it would make us authors have less to write\
    \ about. Unfortunately, the world is not perfect. Due to that fact, a compiler\
    \ checks through a program at each stage while it attempts to build it, as shown\
    \ above in the C++ Program Development Cycle.\n\nUsing the development process\
    \ you can monitor every step the program development cycle undergoes and the reasons\
    \ for it either progressing forward, closer to the finished program, or stalling,\
    \ due to a certain type of error. During the process of the program being built,\
    \ if there are any errors discovered then the compiler normally alerts you to\
    \ them and stops the cycle. Afterwards, looking through the list of errors and\
    \ fixing them, you can attempt to build the program again and, if everything processes\
    \ through completely, then the program runs for you to see in action.\n\nNevertheless,\
    \ there are some errors called run-time errors. These are only acknowledged by\
    \ the compiler once the program is in operation and it is discovered because of\
    \ a line of code not executing properly.\n\n## Your First C++ Program\n\nIn the\
    \ beginning of their coding education, most programmers begin with a simple program\
    \ called \"Hello World!\" However, because most programming books have overdone\
    \ this beginners program, in this book you are not going to start with this example.\
    \ Instead, you are going to get a tad creative and develop a different style,\
    \ which is also very simple.\n\nOnce you have read through the code and ran the\
    \ program, continue reading, because the Program Syntax explains how each individual\
    \ line of code operates.\n\nListing 1.0 – Hello Programmer.cpp\n\n```cpp\n// my\
    \ first C++ program \n#include <iostream> // includes header file to program\n\
    using namespace std; // uses the standard namespace\nint main() // starts program\n\
    {\n    cout << \"Hello Programmer!\" << endl; // displays text on screen\n   \
    \ cout << \"Welcome To The C++ Programming Language Made Simple!\" << endl; //\
    \ more text displayed\n    return 0; // concludes program\n}\n```\n\nProgram Syntax:\
    \ Hello Programmer.cpp\n\n### The Comment Line\n\nThe initial line of the program\
    \ is a C++ comment, because it begins with two forwards slashes (`//`). When two\
    \ `//`s are entered, the program signals to the compiler that a comment follows\
    \ suit.\n\n### The Preprocessor Line\n\nNext, a preprocessor directive symbol\
    \ (`#`) includes the header file `<iostream>` by enclosing it in open and close\
    \ brackets `<>`. In this example, the header file `<iostream>` is selected for\
    \ rendering the program capable of using certain declarations (functions, objects,\
    \ etc.) Like the `cout` and `endl` objects.\n\n| Knowledge: Header Files | A header\
    \ file is filled with declarations of functions, objects and commands that are\
    \ capable of being included in programs. To utilize a header file the preprocessor\
    \ symbol (`#`) is required. |\n\n### The Namespace Line\n\nThe line `using namespace\
    \ std` allows for the namespace called `std` – known as standard – to be used\
    \ in the program. You can consider namespaces as data capsules that contains other\
    \ types of data, capable of being used in a program.\n\n### The main Function\n\
    \nThe main function introduces the opening of the program. Every console program\
    \ begins with `int main` or variations of `int main`. In other books this might\
    \ be written as `tmain` or simply `int main`, followed by a set of parameters\
    \ between its parentheses. It depends on what compiler is being utilized to develop\
    \ the program.\n\nThe main function is always the opening of a program, no matter\
    \ the situation. Other functions in a program are not capable of calling `main`,\
    \ though they can return values to it.\n\nAfter the main function there is an\
    \ opening bracket `{` and near the end of the program there is a closing bracket\
    \ `}`. Between these the program code is typed. Everything that is typed between\
    \ these brackets are instructions the program is required to follow.\n\n### The\
    \ cout and endl Objects\n\nThe objects the program uses are next to show their\
    \ faces. The `cout` object (pronounced see-out) displays the text between the\
    \ double quotes, which follows after the object and the `<<` symbols. The `<<`\
    \ symbols are output operators that communicate to the compiler that the text\
    \ following is to be displayed. After the text you have another `<<` with `endl`\
    \ (pronounced end-l). This command simply ends the line. The next line down does\
    \ exactly the same, but displays a different line of text.\n\n### The return Statement\n\
    \nThe `return` statement concludes the program by returning the value `0`. This\
    \ means that if everything went smoothly the program successfully reached this\
    \ point and finished without any errors being reported.\n\n| Technical Talk: Breakpoints\
    \ | When building programs with some compilers, like Visual C++, the program you\
    \ create shall flicker up on screen and disappear in no more than mini seconds.\
    \ The above program is an example of this. To stop it from immediately terminating,\
    \ you must utilize breakpoints in the program. In Visual C++ locate the programs\
    \ closing return statement and press F5. A red spot appears inside the left border.\
    \ When the program is ran, it shall halt before being commanded to close. |\n\n\
    ## Programming Errors\n\nDid you get any errors when coding the program for the\
    \ first time? I'm guessing that the answer is yes. Don't worry about it. Compiler\
    \ errors are normal to occur when programming. When the programs you write become\
    \ with hundreds to thousands of lines of code, you will find that the compiler\
    \ will discover countless errors. Once these errors are discovered – depending\
    \ on the compiler utilized – it will usually tell you what is wrong and suggest\
    \ a fix.\n\n| Technical Talk: Compiler Step-In | The majority of compilers have\
    \ a function that is normally accessed on the menu bar, called Step-In. This function\
    \ allows the programmer to move through a program one line of code at a time,\
    \ which is practical for the programmer, as it is an efficient method when syphoning\
    \ out errors or impractical code. |\n\n### Compiler Errors\n\nCompiler errors\
    \ are probably the easiest type of error to correct when programming. If any of\
    \ your programs happen to discover compiler errors then they’ll be found whilst\
    \ the program is being assembled. They’re errors indicating something is wrong\
    \ with the code inside your program and informs the compiler that it cannot run\
    \ until the error is dealt with. In the majority of cases, these types of errors\
    \ are due to incorrect syntax, meaning that somewhere along the line of programming,\
    \ a typo has been created.\n\n### Link Errors\n\nThese types of errors normally\
    \ occur because of something in the code that it attempts to link to, but fails.\
    \ For example, in a program that uses the `<iostream>` header file, if the `<iostream>`\
    \ isn’t typed correctly it can cause the program to send out a linker error, because\
    \ the program is trying to use objects from a header file that it cannot recognize\
    \ because of a typo. These errors are not the same as compiler errors and can\
    \ be a little confusing at first-hand to the programmer learning C++.\n\n### Run-Time\
    \ Errors\n"
