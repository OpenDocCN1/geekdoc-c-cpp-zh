    | #include <iostream>using namespace std;int Printed(int numberofsheets, int sheetsbeingprinted);
    // function prototypeint main(){Printed(80,22); // parameters inputted for function
    printed}// function receiving argumentsint Printed(int numberofsheets, int sheetsbeingprinted){   
    int plainsheets = numberofsheets;    int printedsheets = sheetsbeingprinted;   
    int sheetsremaining = plainsheets – printedsheets;    cout << “Printer sheets
    remaining: “ << sheetsremaining << endl;    return sheetsremaining;} |


    Program Syntax: Function Arguments.cpp


    #### Functions with Arguments


    The user-defined function carries two integer arguments inside it. When the function
    is called in the main function, the argument list is filled out with two values
    that are passed into the user-defined function. These are then used in the function
    with code to resolve some arithmetic, then return the end result back to main.


    ## Calling Functions


    The method that C++ and most other programming languages use to tell the programs
    to work with other functions alongside main() is to write the name of the function
    with its parameters filled out, if any.


    | int main(){    Printed(80,22); // parameters inputted for function printed}
    |


    However, even though this example shows main as the function with the calling
    function of printed in, it is not always main that is required to have the calling
    functions inside it.


    | int Printed(int numberofsheets, int sheetsbeingprinted){    int plainsheets
    = numberofsheets;    int printedsheets = sheetsbeingprinted;    int sheetsremaining
    = plainsheets – printedsheets;    cout << “sheets remaining: “ << sheetsremaining
    << endl;    insertmoresheets(additionsheets);    return sheetsremaining;} |


    As you can see, there is no data type required for the insertmoresheets function
    when being called in the printed function.


    ## Return Values


    Every function written owns a return value and depending on its data type shall
    dictate whether the value is null (void) or higher. When the called function (normally
    main), concludes, it passes whatever value follows the keyword return.


    When dealing with the main function, it is usual to end it with a return value
    of 0\. However, in this case, no matter what value is eventually returned from
    the main function, the actual value is forwarded to the operating system on the
    computer so I can obtain the ability of catching any detected errors in a program.


    | Technical Talk: Return ValuesA return value is dictated by the function data
    type. For instance, a function of type int shall return an integer value. |


    ## Writing Return Statements


    A return statement is characterised as an expression. This dictates the line of
    code returns a value of some type. Therefore, if a return statement simply follows
    the rule that it requires to return a value then the method to write one is rather
    flexible. Below is a small list of different return statements.


    | return myNumber;return 0;return 5 + 2;return 3 * (4 % 2);return MyFunction();
    |


    | Knowledge: The Last StatementIf the last statement (MyFunction) returns a value,
    then every one of the preceding statements are legal and accepted in C++. |


    Just to note, it is always possible to have more than one return statement embedded
    in a function.


    ## Multiple Return Values


    Apart from functions that are declared with type void, each one initialised is
    required to return a value before it concludes.


    Multiple return statements that have different values, but correspond to a functions
    defined data type – for example, an integer function with an integer variable
    – can co-exist in a block of code. At the end point of a program is a return value
    – unless the function is of type void. Therefore, it returns the defined data
    type to the called function. For example, if a function called FindAge() is integer
    based, then somewhere throughout the breadth of the function block an integer
    value is required to return to  the called function.


    The program below utilizes multiple return statements and values with the FindAge()
    function. The value returned to the calling function depends on the outcome from
    the users input.


    ## The void Function Type


    The void data type is used for a function heading and returns no value. In some
    previous examples of functions we have seen the function data types range from
    int to string. However, you will also discover now that there is another data
    type called void, which is used when a function does not need to return a value.


