  trans: "\n\n# 技术演讲：break 语句\n\n在 `switch` 语句的每个 `case` 之间，你可能注意到一个名为 `break` 的关键字。每个\
    \ `case` 之间的 `break` 作用是告诉编译器一旦完成选择，就跳出 `switch` 语句并继续执行程序的剩余部分。如果省略 `break` 语句，它将在选定项之后继续计算每一个\
    \ `case`。\n\n下面是一个 `switch` 语句的示例，你需要为电脑游戏选择一个角色种族。\n\n### 列表 5.3 – Select a Character.cpp\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nint main(){\n    cout <<\
    \ \"Select the type of character you wish to play\" << endl;\n    cout << \"1\\\
    . Human -- 2. Dwarf -- 3\\. Dragon -- 4. Ogre -- 5. Gnome\";\n    int theCondition;\n\
    \    cin >> theCondition;\n    switch(condition) // open of switch statement\n\
    \    {\n        // the condition result decides what case is examined\n      \
    \  case 1: cout << \"You wish to play as a human\" << endl;\n        break; //\
    \ break statement stops the switch statement\n        case 2: cout << \" You wish\
    \ to play as a dwarf\" << endl;\n        break;\n        case 3: cout << \" You\
    \ wish to play as a dragon\" << endl;\n        break;\n        case 4: cout <<\
    \ \"You wish to play as an ogre\" << endl;\n        break;\n        case 5: cout\
    \ << \"You wish to play as a gnome\" << endl;\n        break;\n        default:\
    \ cout << \"Invalid input\" << endl;\n    }\n    return 0;\n}\n```\n\n## 程序语法：Select\
    \ a Character.cpp\n\n#### switch 语句\n`switch` 语句需要一个条件来启动决定将跳转到哪个 `case` 的过程。\n\
    \n#### cases\n`cases` 存储了程序或用户输入的条件的结果。\n\n#### break 语句\n一旦做出决定并执行了代码，程序中的 `break`\
    \ 语句可以让 `switch` 语句停止，程序可以退出。随后程序可以继续运行程序的其余部分。\n\n### 技术演讲：switch 语句中的 cases\n\
    当 `switch` 语句被创建且其条件与某个值匹配时，它会跳到下方分析执行哪个 `case`。`switch` 语句内部 `cases` 是可执行代码的位置。具体取决于选择了哪个\
    \ `case`。\n\n## 混合语句\n你现在已经见过独立运行的 `switch` 和 `else` 语句。虽然 C++ 语句无处不在且协同工作，但可以将\
    \ `switch` 语句和 `if` 语句放在一起，反之亦然。\n\n## 自我测试\n以下四个问题关于你所学的 C++ 知识。在继续学习之前，请尝试回答这些问题。\n\
    \n### 自测\n1. 什么是语句（statement），什么是表达式（expression）？\n2. `if` 语句可以嵌套多少层？\n3. 什么时候使用\
    \ `switch` 语句比 `if` 语句更好？\n4. `break` 语句的作用是什么？\n\n# 第 6 章 函数\n\n## 什么是函数？\n函数是程序中的一个块，充满了用于计算的语句和表达式。可以在任何其他函数处理其内部的所有内容。从本质上说，函数是子程序，是程序可能拥有的大想法的一个小部分。因此，函数就像程序中的构建块。它们有助于更合理地组织程序，并有助于分解程序的动作，使其能够完成小但重要的任务。\n\
    \n## 创建函数\n函数可能很难理解，但只要稍加练习就能掌握。函数的困难部分在于学习如何写好一个函数。这时规则规则就非常有用，特别是对于初学者。一个编写良好的函数应该只完成任务。无论程序员想要将两个数字相加、在屏幕上显示图形，还是增加电脑游戏中玩家的血量，函数都应该负责一项工作。\n\
    \n```cpp\n// function to increase a player’s health\nint MaxHealthPotion(int playerHealth){\n\
    \    playerHealth = playerHealth + 25;\n    cout << “Your health is now “ << playerHealth\
    \ << endl;\n}\n```\n`MaxHealthPotion` 代码展示了一个为了完成程序中一项任务而创建的函数。\n\n## 声明函数\n在\
    \ C++ 中，必须在 `main` 之前创建一个函数原型。函数原型至少包含三个方面：首先，你需要函数的数据类型，然后是用户定义的名称，最后是括号，参数可以通过括号传递到函数中。这些参数可以由从变量到另一个函数的任何内容组成。在上例中，我传递了一个名为\
    \ `playerHealth` 的整数变量，这使得程序能够在函数中使用该变量。\n\n```cpp\nint myFunction(int theParameter);\n\
    ```\n\n## 定义函数\n一旦声明了函数，就可以通过编写你想要函数完成的指令指令来定义它。\n\n```cpp\n// declaring a function\n\
    int MaxHealthPotion(int playerHealth); // function prototype\n//defining a function\n\
    int MaxHealthPotion(int playerHealth){\n    // statements are written here\n}\n\
    ```\n\n### 列表 6.0 – The Second Function.cpp\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\nvoid SecondFunction(); // a user-declared function\nint main(){\n\
    \    cout << \"This is the main function\" << endl;\n    cout << \"Now we are\
    \ going to jump into a new function.\" << endl;\n    SecondFunction(); // program\
    \ passes into function\n    return 0;\n}\nvoid SecondFunction() // other function\n\
    {\n    cout << \"\\nNow we are in the second function of the program.\" << endl;\n\
    \    cout << \"When we leave here the program ends.\" << endl;\n    cout << \"\
    Goodbye!\" << endl;\n}\n```\n\n## 程序语法：Second Function.cpp\n\n#### 用户定义函数\n`SecondFunction`\
    \ 是程序中构建的函数。它不像 `main` 函数。相反，它是由程序员完全构建的函数。在程序的顶部，你有函数原型，它声明了该函数但没有定义它。\n\n由于\
    \ `SecondFunction` 已经声明，因此它可以放置在 `main` 函数下方。另一方面，如果函数没有原型，那么它的定义就必须写在 `main`\
    \ 函数上方。\n\n## 无原型的函数\n下一个示例仍然是一个包含 `SecondFunction` 的程序，但这次省略了函数原型并将函数移动到了 `main`\
    \ 之上。\n\n### 列表 6.1 – The Second Function with No Prototype.cpp\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\nvoid SecondFunction() // function defined\
    \ and declared\n{\n    cout << \"\\nHello! This is the second function.\" << endl;\n\
    \    cout << \"This time around, the function is built with no prototype.\" <<\
    \ endl;\n}\nint main(){\n    cout << \"We are in the main function\" << endl;\n\
    \    cout << \"Stepping over to the SecondFunction.\" << endl;\n    SecondFunction();\
    \ // calls the other function\n    return 0;\n}\n```\n\n## 程序语法：The Second Function\
    \ with No Prototype.cpp\n\n#### 无原型函数\n因为程序中没有编写代码原型，这意味着 `SecondFunction` 必须在\
    \ `main` 函数上方声明并定义。原因在于在到达 `main` 函数之前，程序需要知道哪些函数将与程序协作——在没有原型的情况下，除非在 `main`\
    \ 打开之前否则它不知道。\n\n## 作用域\n编程语言中的作用域问题很大，以至于程序员犯的错就会导致错误。在讨论函数的作用域时，有两个词需要处理：全局（Global）和局部（Local）。\n\
    \n"
