    \ see there are a lot of variable data types to learn. Although, you shouldn’t\
    \ worry about not knowing the data types like off the back of your hand. You’ll\
    \ gradually learn each one as you progress through this chapter and the rest of\
    \ the book. Although, to begin, I want to show you how variables are declared\
    \ and defined in C++.\n\n## Declare Variables\n\nBefore a program can utilize\
    \ different types of variables, a declaration of the desired variable is required.\
    \ What this entails is coding the variable with its desired data type and user-defined\
    \ name. To declare a variable the following syntax is required.\n\n| data type\
    \ | variable name |\n\nHere is a coded example you might see in a program.\n\n\
    | int | myNumber |\n\nIn this example the keyword int declares the variable myNumber\
    \ as an integer. Therefore, when you declare a variable the process of making\
    \ space in memory begins. Many times a program shall require its variable to have\
    \ values already initialized before runtime. What this means is variables are\
    \ defined with values of their data types before the program is ran.\n\nFor example,\
    \ an integer variable requires to equal a whole number, and a char variable requires\
    \ a character, such as ‘E’ or ‘$’ for its definition. Note the single quotation\
    \ marks for when declaring a char variable.\n\nThe next program demonstrates the\
    \ concept of declaring and defining variables before run-time of a program.\n\n\
    Listing 3.0 – Declare and Define Variables.cpp"
