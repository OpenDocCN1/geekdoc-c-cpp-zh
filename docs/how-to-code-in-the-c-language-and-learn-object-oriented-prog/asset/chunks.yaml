  trans: "\n当然，当我说任何对象都可以被引用时，我的指的是任何对象。尽管如此，不要尝试引用类（class），因为那行不通。相反，你可以引用一个类所构建的对象。我们将在下一章详细讨论类。\n\
    \n## 一个对象保留一个引用\n\n良好的编程习惯是理解这样一条规则：一旦引用已经指向某个对象的别名（aliasing），就不应该再将其重新赋值为不同的目标。如果发生这种情况，代码会变得非常混乱。相反，更好的做法是创建另一个引用并将其赋值给另一个对象。之所以这样做是因为，程序员可能会对程序的行为以及它如何处理引用感到不知所措。一旦你在某个处有了一个引用，在整个程序运行期间都保持它在那里。\n\
    \n```cpp\nint refOne;int objectOne = 6;refOne = objectOne; // 引用一个对象是好的\nint objectTwo\
    \ = 12;refOne = objectTwo; // 切换对象是不好的\n```\n\n## NULL 未使用的指针\n\n任何未初始化或未使用 `delete`\
    \ 关键字删除的指针，都必须被设置为 `null`。这样做允许指针拥有一个默认值，并防止你的程序在任何时刻崩溃。\n\n## 不要对引用进行 NULL\n\n\
    然而，当涉及到将引用设置为 null 时，这是一个坏主意，因为引用不能被赋予 `null` 值。当你编译程序时，一些优秀的编译器会发现这一点，但另一些则不会，这可能导致程序崩溃，甚至导致内存损坏。\n\
    \n> **警告：不要引用值为 0 的对象** 通过将引用设置为一个等于 0 的对象，你实际上是将其设置为了 `null`。这可能会破坏该引用所在的程序，甚至可能损坏你的计算机。\n\
    \n## 引用传递\n\n在函数章节中，你学习了如何将值作为参数从其他地方到函数。在指针章节中，你发现了如何使用指针来实现这一点。现在我们将看到如何使用引用来完成。其语法如下：\n\
    \n```cpp\nSomeref(4,8);// 参数是被引用的\nint SomeRef(&rFirstReference, &rSecondReference);\n\
    ```\n\n当你通过引用传递时，效果是相同的，但不再是创建副本，而是通过引用传递实际值。因此，这证明了你跳越了函数按值传递时的局限性。我们知道，当你按值传递时，实际上发生的只是创建了值的副本并将其放入调用函数中。\n\
    \n在 C++ 语言中，通过引用传递意味着获取原始值并将其（而不是复制）传入函数。可以通过两种方法实现——指针和引用。\n\n#### 列表 10.2 –\
    \ Pass By Reference.cpp\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    int SomeReference(int &refOne, char &refTwo);\nint main(){\n  int x = 5;\n  char\
    \ y = 'y';\n  SomeReference(x,y); // 函数调用\n  cout << \"\\nThe new reference one:\
    \ \" << x << endl;\n  return 0;\n}\nint SomeReference(int &refOne, char &refTwo){\n\
    \  cout << \"Reference one: \" << refOne << endl;\n  cout << \"Reference two:\
    \ \" << refTwo << endl;\n  refOne++; // 增 refOne\n  return refOne;\n}\n```\n\n\
    **程序语法：Pass By Reference.cpp**\n\n#### 传递引用\n\n此程序从 `main` 获取两个声明的变量，并通过引用将它们传递给名为\
    \ `SomeReference` 的函数。在函数内部，它们被显示出来，然后 `refOne` 被递增并传回 `main`。一旦回到 `main` 中，就会显示变量的新值，以展示它如何在两个函数之间往返传递而非被复制。\n\
    \n## 指针与引用\n\n在 C++ 中，指针也是对象。这意味着引用可以成为它们的别名。尽管正如我们所见的，指针可以被删除然后设置为 `null`，而引用不能被设置为\
    \ `null`，也不能被重新赋值。下面是一个指针如何与引用工作的示例。\n\n### 列表 10.3 – Pointers and References.cpp\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nint main(){\n  // 变量、指针和引用\n\
    \  int target = 10;\n  int *pTargetPtr = new int;\n  *pTargetPtr = target;\n \
    \ Int &rTargetRef = *pTargetPtr;\n  cout << \"Target: \" << target << endl;\n\
    \  cout << \"Target pointer: \" << *pTargetPtr << endl;\n  cout << \"Target reference:\
    \ \" << rTargetRef << endl;\n  delete ptargetptr; // 删除指针\n  pTargetPtr = 0; //\
    \ 指针设置为 null\n  cout << \"Target new reference: \" << rtargetref << endl;\n  return\
    \ 0;\n}\n```\n\n**程序语法：Pointers and References.cpp**\n\n#### 指向引用\n\n#### 删除指针\n\
    \n#### 引用与指针\n\n# 11 数组\n\n### 什么是数组？\n\n当我们声明一个数组时，按照以下方法进行：\n\n```cpp\n<data_type>\
    \ variable_name[size];\n```\n\n数组是创建对象的集合，这些对象使用相同的数据类型。这些集合具有命名的存储位置，从 0 开始编号。\n\
    \n### 数组的元素\n\n你赋予数组的元素可以通过引用编号来访问。下面的示例显示了：\n\n```cpp\nint myarray[X] // 将 X\
    \ 替换为数字\n```\n\n### 数组从零开始\n\n对于 C++ 或任何编程语言的初学者来说，发现计算机从 0 开始计数可能是很奇怪的。因此，如果你有一个像\
    \ `Array[5]` 这样的数组，意味着它被放置了 6 个值。阅读下文查看是如何操作的。\n\n你可以用两种方式编写数组。这两种方法并列如下：\n\n\
    ```cpp\nint myarray[0] = 73;\nint myarray[1] = 65;\nint myarray[2] = 28;\nint\
