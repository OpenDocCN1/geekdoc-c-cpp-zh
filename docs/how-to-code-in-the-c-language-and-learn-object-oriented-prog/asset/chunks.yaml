    Chapter 8


    # Loops


    ## Programming Loops


    Repetition is a crucial factor in the world of programming and something that
    every developer depends on in their programs.


    To create a repetition in your programs you need a type of loop. If it wasn’t
    for loops your program would eventually play through and then stop, quitting out
    to the desktop.


    There are three types of loops in C++. The while, do while and the for loop. Each
    does the simple task of repeating over code until it reaches a certain value,
    but each has its own method of doing this.


    ### The while Loop


    The while loop is the first in the three loops we will examine. The syntax for
    the while loop is as shown.


    | while(condition){    // do something} |


    The first aspect that the while loop does is to test to see whether the condition
    is true or false. If the condition is true then the loop opens up and the code
    between its brackets is computed. Yet, if the condition is false, then the loop
    is bypassed and the program carries on.


    The loop will carry on until the condition in the loop is met, by which time it
    will then jump out of the loop to progress with the rest of the program.


    ### The do while Loop


    The do while loop is similar in operation to the normal while loop, because it
    requires data to examine. However, the do while loop is different due to it does
    at least one round of testing before coming to the condition. The syntax for the
    do while is written below.


    | do{    // do stuff} while (condition); |


    As you can see the loop opens up with the keyword do and then progresses through
    until it reaches the while keyword, where it tests the condition. If the condition
    is not met then the do while loops over again.


    Here is an example:


    Listing 8.0 – do while Loop.cpp


    | #include <iostream>using namespace std;int main (){    short x = 7, y =0; //
    initialise two short variables    do // starts do while loop    {        cout
    << "Your number is: " << x-- << endl; // displays variable in loop    } while
    (x > y); // ends do while loop    return 0;} |


    Program Syntax: do while Loop.cpp


    #### do while Loop


    This program takes two integer variables x and y and utilizes them in a do while
    loop until they eventually match. Once the value of x is 0 it stops running the
    loop.


    ### The for Loop


    The for loop takes an initial value and tests it against another. If the initial
    value is not equal to the second statement, the third expression kicks in, which
    normally tells the program to increment or decrement the value. The syntax for
    a for loop is:


    | for ( i = value; i = value; i++) {    // do something;} |


    ## Nested Loops and Statements


    Because the inside of any loop we’ve examined is a collection of compound statements,
    it is valid to be capable of placing loops within loops or even if or switch statements.
    It works on the same basis of nested if statements with other if statements etc.


    An example of nested loops with if statements is shown below. In the example we
    are trying to decide what happens when a player slays a creature in a game.


    Listing 8.1 – Nested Loops.cpp


    | #include <iostream>using namespace std;int main(){    int creaturehp = 100;   
    int playerattpwer = 32;    do    {        cout << "Player attacks creature!" <<
    endl;        creaturehp = creaturehp – playerattpwer;            if (creaturehp
    <= 0)            {                cout << "Player has slayed the creature!" <<
    endl;            }            if (playerttpwer == 32)            {               
    cout << "You slayed the creature in one hit." << endl;            }           
    else if           {             cout << "Player strikes the creature for " <<
    playerattpwer << “!” << endl;             cout << "The creature now has " << creaturehp
    << " points of health remaining! " << endl;         }    } while (creaturehp >
    0);    return 0;} |


    Program Syntax: Nested Loops.cpp


    #### The Nested if Statement


    The nested statement in the loop is another if statement that checks to see if
    the condition of a variable is equal to the value of 32\. If it is then the user
    receives the message, "You slayed the creature in one hit.".


    #### Nesting the Loops and if else Statements


    This might be the largest program you have wrote so far, it is the largest in
