    ## Signed and Unsigned Variables


    In C++ most variables can come under two different categories, which dictates
    their size and value range. These differences are known as signed and unsigned.


    ### Unsigned


    An unsigned variable, whether an int, char or something other, has the word unsigned
    prefixed to the variable name, which signifies to the compiler the variable has
    a non-negative value range attached to it. By non-negative, it means that any
    unsigned variable cannot decrease below the value of 0\. See the difference in
    the examples below.


    | unsigned int correct = 75; // shall compile properlyunsigned int wrong = -30;
    // shall cause a compiler error |


    Because unsigned variables cannot reach below the value of 0, their maximum positive
    value is increased by double. In the next section you shall learn about the different
    data types, their categories and the different value ranges they can hold.


    ### Signed


    Signed variables are the opposite of unsigned, whereby they can decrease their
    values below 0, and also when a signed variable is being declared it does not
    require the keyword signed to prefix the variable name. However, for programming
    clarity, the prefix keyword can be used if the programmer wishes.


    For instance, both of the examples below are the same, but one has the word signed
    prefixed to it.


    | int number = -20; // a signed integer valuesigned int number = -20; // an extra
    signed integer value |


    A signed variable is known as a variable with a default value, similar to ones
    we have coded in the previous listings.


    | Knowledge: To Be Signed or Unsigned?While learning the difference of both data
    type categories, a question arises of when to use a signed and unsigned variable.
    The answer is simple. When utilizing your variables if there are any that does
    not decrease below the value of 0, then it is wise to initialize them as unsigned.
    |


    ## The Different Data Types


    As mentioned earlier, there are different data types you can give to initialize
    a variable. The following reveals and explains the data types that are utilized
    in C++. Every type shows the maximum and minimum value they can reach as signed
    and unsigned.


    ### Integers


    The initial variable data type you’ll examine is the integer, known in C++ as
    the keyword int. Integers hold whole numbers, like 43, 170 or 2\. They cannot
    store decimal numbers, like 132.54 or 2.2\. Integers are initially allocated as
    signed, but can change to unsigned. Also, there are different types of integers,
    which we shall examine in this section, known as short and long. The diagram below
    shows the maximum and minimum value ranges for both categories of integers.


    signed integer value range


    | MIN | MAX |


    | 32,768 | 32,767 |


    unsigned integer value range


    | MIN | MAX |


    | 0 | 65,535 |


    If you have an unsigned integer and your program attempts to decrease the value
    pass 0, then the numerical counter shall turn over to 32,767, instead of decreasing
    to –n and sending out a compiler error. Therefore, if the unsigned variable attempted
    the opposite and increased passed the point of 65,535 then it would turn over
    to 0.


    ### Short Integers


    The short integer is also known as int and have a range value of -32,768 to 32,767,
    due to being identified as signed short. However, a short integer can have unsigned
    prefixed and it shall act exactly like a normal unsigned integer. You do not need
    to write out short int every time you want to declare a short integer, but instead
    just the keyword short.


    | // each variable is the same, but declared differentlyshort number = -44;short
    int number = -44;signed short int number = -44; |


    ### Long Integers


    The long integers have the difference when being declared because they require
    the prefix keyword long and unless they have the unsigned keyword before long
    then they are integer with a larger value.


    The tables below reveals the different between an unsigned and signed long integer
    with their maximum and minimum values.


    signed long integer value range


    | MIN | MAX |


    | -21,474,836,48 | 21,474,836,47 |


    unsigned long integer value range


    | MIN | MAX |


    | 0 | 42,949,672,95 |


    ### Float


    The float variable is another data type that uses numerical values, although,
    it does not just use whole numbers, but also decimal points. The float variable
    cannot be unsigned, like the different types of integers, although they can prefixed
    with the type of long and long long.


