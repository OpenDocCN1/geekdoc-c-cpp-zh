    using the same method. The three string variables below assign a string of characters
    to each one of the variables, which it is equal too. As you can see, the comma
    operator ( , ), allows for us to place additional variables in the declaration
    list. You could imagine each variable as a person in a post office with a parcel
    to post. Then think of the parcel being the data in the variable. After the list
    is complete you finish it off with a semi-colon.


    | string hisName = "Peter",herName = "Ruby",yourName = "Tom"; |


