    \ opens up.\n\n| Technical Talk: Write Functions in Header FilesOne of the places\
    \ a large majority of programmer’s code functions is inside header filed. The\
    \ header file is then linked to a.cpp file. |\n\n## Working in Scopes\n\nThe question\
    \ of scope in programming languages is large enough that if a programmer makes\
