    # Chapter 12: Inheritance


    ## What is Inheritance?


    Inheritance is the next stage in your Object-Oriented Programming training. Like
    a human being inherits features and attitudes from his/her mother and father,
    or a dog learns that it can bark and has an increased sense of hearing, so C++
    uses its concept of inheritance to allow for a class called a derived class to
    inherit certain qualities from base case.


    Let’s look at a diagram that focuses on two derived classes, one called `Chicken`
    and the other called `Eagle`, which derives from a base class called `Bird`.


    As you can see most of the qualities that the `Bird` class has the `Eagle` picks
    up, although, a `Chicken` cannot fly which gives us the self-defined error message
    “A Chicken cannot fly”.


    The way that C++ manages to represent these linked relationships is from having
    one class feeding off another for its data. Therefore, this basically means that
    a class can contribute its functionality to another class to be used separately.
    This is known as a class deriving from a base class.


    ## Derivation and Base


    So that you know how inheritance works we are going to look at a derive and base
    classes and see examples of them. To do this we are going to ignore the `Bird`,
    `Chicken` and `Eagle` classes and look at a program that shows the wages of employees
    in a company.


    When you derive from a base class the class must first be declared else the program
    will spit out a compile error.


    ### Public and Protected – The Difference


    As we are on the second stage of Object-Oriented Programming, we are going to
    look at the third and last accessor that can be added or even replace the private
    accessor of a class. The `protected` keyword is the one that sits in the middle
    of private and public.


    Instead of locking data down or allowing an object to openly use it, anything
    under the accessor heading of `protected` allows for any base class object and
    any derive class object to use the data.


    Thus, if we go back to our bird, chicken and eagle example we can put in everything
    we want the base class to search in under the `protected` accessor. If a base
    class also has a private accessor along with a public accessor then anything underneath
    the private cannot be searched with derived classes.


    ## Constructor and Destructor


    When a derived class constructor is called by a program it will first will call
    upon the base class constructor and then the derive constructor. Thus when it
    comes time to destroy the objects, the program must be told to destroy the derived
    class object and then the base class one. If it is not done in this way then your
    program can generate a memory leak, which we know from the chapter on pointers
    how ineffective that can be to your computer.


    ## Overriding Data Methods


    Overriding data methods is the concept whereby a derived class with a data method
    equal in type, name and parameters as that in the base method can instead override
    the base method.


    Look at the program below.


    ## Calling the Base Method


    When the base method is overridden it is still possible to call it from your program.
    The method to do this is by writing the derived object and then putting the dot
    operator followed by the concealed base object and two objects with the method.


    ```

    Eye.HumanBody::SetSight();

    ```


    This will allow the `HumanBody` `SetSight` method to be called.


    # Chapter 14: Polymorphism


    ## What is Polymorphism?


    The notion behind polymorphism can be explained in a simply example. Let''s take
    a 15 inch average television with free cable and teletext. You can use this in
    a simple example using classes and inheritance.


    As all programming books will tell you, `poly` means more and `morphisms` means
    to alter something. This means that you can add more to an object by morphing
    it with another. So, let''s first create a object for the television and also
    for the DVD.


    ```

    Television TV;DVD Player;

    ```


    Now with `DVD` inheriting from `Television`, you can create an `DVD` object and
    use the `Television` data method `channels`.


    ```

    Player = new *TelevisionPlayer->OnSwitch()

    ```


    ## Virtual Methods


    Now we are going to look at how virtual methods help decide a program whether
    to use an object from the base class or the derived class. You make a virtual
    method by prefixing it with the keyword `virtual`. When this is done virtual functions
    that are set in base classes are capable of being overridden by their derived
    class alternatives. If you use a pointer on a derived class and point it to a
    bass class that is virtual then the derive class can override the methods to use
    the derive methods. It does by looking up something called the qualified name
    lookup.


    ```

    virtual bool OnSwitch();

    ```


    ## Access Cost of Being Virtual


    Nothing ever comes free in this world anymore, and the same goes for programming
    with C++ and handling memory. When an object is created and it employs the use
    of a virtual method there is a cost – an overhead – in the computers memory. This
    is where the programmer should make certain that he has created a constructor
    and destructor for the object


    One word to consider when creating a derived class, whose object will use polymorphism
    and virtual methods. This is to make sure that the class is being used for a proper
    reason, i.e., there is no point in creating a class that derives from another
    if the derive class is tiny. The example below is a bad example of a derived class
    along with a normal base class:


    ```

    class Player { // a large number of methods and variables};

    class HealthPotion { // only 1 method and 2 variables};

    ```


    It is wise to perhaps rewrite the `HealthPotion` class and instead place it in
    a `Potion` class that is filled with others.


    ```

    class Potion {float HealthPotion();float ManaPotion();float HealthGain();float
    ManaGain();};

    ```


    ## Abstract Data Types


    When you code programs utilising the use of classes, you may wish to create a
    primary class that stands as a hierarchy to other lower classes. For example,
    if we took a main class called `Food`, then we can build a lower classes from
    it that are assigned to different types of foods.


    ```

    class Food {public:virtual Double CalorieAmount(int amount) = 0;virtual Double
    FatAmount(int amount) = 0;protected:double amount;};

    class Orange {public:virtual Double CalorieAmount(int amount);virtual Double FatAmount(int
    amount);protected:double amount;};

    class Chocolate {public:virtual Double CalorieAmount(int amount);virtual Double
    FatAmount(int amount) ;protected:double amount;};

    ```


    As we can see, out of the three classes here, two of them derive from the `Food`
    class. Thus, this means that they are capable of accessing the functions in the
    higher class. However, in this example, the higher class has data methods that
    are pure virtual functions. They are this because at the end of the function declaration,
    they are made abstract by equalling to `0`.


    This means that the lower classes have to have there own virtual functions to
    work with.


    ```

    Warning: No abstract objects

    When creating an abstract class, you are thereby telling the compiler that you
    cannot create an object of that class. Therefore the following code shall spit
    out an error.

    Food pie; // error as Food class is abstract

    ```


    However, even though no objects are allowed with abtract classes, you can create
    program pointers and references that direct to an abstract class. What is the
    point of this?


    Well by referencing or pointing to an abstract class, it allows for run-time polymorphism.


    Pure Virtual Function

