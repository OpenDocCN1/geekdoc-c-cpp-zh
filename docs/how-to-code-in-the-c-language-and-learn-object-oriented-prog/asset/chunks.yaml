  trans: "\n`double` 变量也是一种小数点数据类型。它比 `float` 更大，可以容纳更高的数值范围。缺点是 `double` 变量在内存中占用的字节是\
    \ `float` 或 `integer` 的两倍，因此得命名为 `double`。\n\n`double` 取值范围\n\n| MIN | MAX |\n\
    | :--- | :--- |\n| 2.22507385850720138e-308 | 1.79769313486231571e+308 |\n\n###\
    \ Char\n\n`char` 变量是一种数据类型，允许你在程序中使用键盘上的字符，例如‘a’或‘b’或‘£’或'&’。不同之处在于，当数字用于 `char`\
    \ 变量时，它并不会像 `integer` 或 `float` 那样作为数值值处理。其原因因为它被包含在单引号之间，单引号的作用就像一个关闭任何数值功能的开关。\n\
    \n```cpp\n// char 变量示例\nchar letter = ‘L’;\nchar number = ‘5’;\nchar sign = ‘$’;\n\
    ```\n\n如所示，三个 `char` 变量都使用了单引号。这意味着‘5’的值不是数值——或者至少不完全是。我使用“不完全”这个词是因为是因为从键盘输入的所有字符都有它们自己的键值，对应于\
    \ ASCII 布局。`ASCII` 是“信息交换标准代码”（American Standard Code for Information Interchange）的缩写，是一种字符编码方案，最初基于英文字母。它将\
    \ 128 个指定的字符编码为 7 位二进制整数。`ASCII` 表为键盘上的每个字符指定了一个值。因此，再次，`char` 变量有最小值和最大值。\n\n\
    Listing 3.2 – 不同类型的字符.cpp\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    int main(){\n             cout << \"char 变量可以存储的不同字符所示：\\n\" << endl;\n      \
    \       // 存储不同类型字符的三个 char 变量\n             char letter = 'E';\n            \
    \ char number = '2';\n             char symbol = '$';\n             // 使用三种不同类型的字符显示文本\n\
    \             cout << \"The char variable can store individual letters like \"\
    \ << letter << \".\\n\";\n             cout << \"The char variable can store individual\
    \ numbers as characters like \" << number << \".\\n\";\n             cout << \"\
    The char variable can store individual symbols as characters like \" << symbol\
    \ << \".\" << endl;\n             return 0;\n}\n```\n\n程序语法：不同类型的字符.cpp\n\n####\
    \ char 变量\n\n程序中声明并定义了三个 `char` 变量。一旦在程序中创建了它们，它们就会使用 `cout` 对象单独显示在屏幕上。此外，你可能还会看到每个变量周围都有单引号。\n\
    \n## 布尔（Boolean）与字符串变量\n\n### Bool\n\n`bool` 变量只有两个值需要处理。这两个值是 `true` (1) 和 `false`\
    \ (0)。由 George Boolean 设计，因此得名，`bool` 值用于大量的编程语言，如 `Java`、`Visual Basic`，特别是在\
    \ `C++` 中。当你在学习 `C++` 中的决策语句和返回语句时会看到这一点。书中到为止创建的所有程序，其返回语句都以布尔值结尾：`return 0`。\n\
    \nListing 3.3 – True or False.cpp\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nint main(){\n             cout << \"The difference of true and false.\"\
    \ << endl;\n             bool istrue = true;\n             bool isfalse = false;\n\
    \             // 发现什么是 true 和 false\n             cout << \"The value of true:\
    \ \" << istrue << endl;\n             cout << \"The value of false: \" << isfalse\
    \ << endl;\n             return 0;\n}\n```\n\n程序语法：True or False.cpp\n\n#### bool\
    \ 变量\n\n你在程序中看到两个 `bool` 变量，这揭示了该数据类型的两种可能值。`bool` 变量决定其包含的数据是 `true` (1) 还是 `false`\
    \ (0)。当你学习 `if` 和 `switch` 语句时，你会发现为什么 `bool` 变量对 `C++` 编程至关重要。\n\n`bool` 取值范围\n\
    \n| MIN | MAX |\n| :--- | :--- |\n| False (0) | True (1) |\n\n### String\n\n`string`\
    \ 变量不是 `C++` 的内置类型。相反，要在程序中使用字符串，你必须包含头文件 `<string>`。声明一个 `string` 变量，必须以关键字 `string`\
    \ 开头，后跟用户定义的名称。字符串的基本思想是，除了包含头文件外，你可以获取多个字符并将它们连接在一起，而无需额外的代码。字符串的示例所示，以及对应的 `char`\
    \ 形式。\n\n```cpp\n#include <string> // 记得包含以使用字符串\nstring myName = \"Tom\";\nstring\
    \ myAge = \"25\";\nchar myName[3] = \"Tom\"; // 一个 char 数组\nchar myAge[2] = \"\
    25\"; // 一个较小的 char 数组\n```\n\nListing 3.4 – Full Name, Number.cpp\n\n```cpp\n\
    #include <iostream>\n#include <string>\nusing namespace std;\nint main(){\n  \
    \           string fullName;\n             string address;\n             string\
    \ number;\n             cout << \"Enter Your Full Name: \";\n             getline(cin,\
    \ fullName);\n             cout << \"Enter Your Address: \";\n             getline(cin,\
    \ address);\n             cout << \"Enter Your Telephone Number: \";\n       \
    \      getline(cin, number);\n             cout << \"\\nHello, \" << fullName\
    \ << endl;\n             cout << \"You Live At: \" << address << endl;\n     \
    \        cout << \"Your Telephone Number Is: \" << number << endl;\n         \
    \    return 0;\n}\n```\n\n程序语法：Full Name, Number.cpp\n\n#### getline(...) 函数\n\
    \n`C++` 中有使用 `cin` 对象的另一种方法，它具有额外的功能，并允许 `string` 和 `char` 变量执行复杂任务。在这个程序中，`getline`\
    \ 函数允许用户向字符串输入空格。而在使用 `cin` 对象时，如果你写一个全名，例如“Abigail Roberts”，那么字符串会被截断为“Abigail”，因为\
    \ `cin` 对象不允许空格。\n\n编写 `getline` 函数的语法如下：\n\n`getline(input_command, string/char\
    \ variable)`\n\n#### cout 对象\n\n在这个程序中，`cout` 对象分布在多行中。这是允许的，因为除了最后一行外，每一行的末尾都没有分号（\
    \ ; ）。正如之前讨论的，分号是结束一个语句的。\n\n| 知识：空格你将在第 5 章：语句与表达式中学习更多关于空格的内容。尽管如此，只需将空格想象成注释即可，因为编译器在构建时不会读取它。\
