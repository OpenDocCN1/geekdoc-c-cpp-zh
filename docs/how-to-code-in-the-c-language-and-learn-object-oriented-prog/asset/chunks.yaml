  trans: "\n\n在函数中使用常量或变量时，你能够考虑作用域以及两种方法之间的区别。\n\n### 全局数据\n\n在任何函数外部或其大括号外部（即使是\
    \ `main` 之外）编写的变量和常量被称为全局数据，可以在程序的任何地方使用。\n\n### 局部数据\n\n在函数内部创建的变量和常量被称为局部数据。函数内部的数据只能在创建它的函数内部使用。尽管如此，你可以将数据的结果返回给\
    \ `main`。\n\n列表 6.2 – Global Variable.cpp\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\nint number; //全局整数变量\nvoid SecondFunction(){\n    // 全局变量在 SecondFunction\
    \ 中被使用\n    number = 5;\n    number += 5;\n    cout << \"The Number Is: \" <<\
    \ number << endl;\n}\nint main(){\n    // 全局变量在 main 中被使用\n    number -= 5;\n\
    \    cout << \"The Number Is: \" << number << endl;\n    SecondFunction(); //\
    \ 调用另一个函数\n    return 0;\n}\n```\n\n程序语法：Global Variable.cpp\n\n#### 全局变量\n\n\
    程序中唯一的全局变量位于任何函数之外，这使得它是全局的。因为它是全局的，这意味着程序中声明的任何函数都可以在其定义中使用它。\n\n在示例中，变量在不同的函数使用了加法和减法运算符，以展示你可以实现的不同结果。\n\
    \n## 参数与参数\n\n函数能够携带从调用函数（如 `main`）传递它的数据。这些信息作为参数存储在括号之间。\n\n参数是传递到函数的数据。下部分通过一个小程序展示了示例。\n\
    \n列表 6.3 – Function Arguments.cpp\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nint Printed(int numberofsheets, int sheetsbeingprinted); // 函数原型\nint\
    \ main(){\n    Printed(80,22); // 输入给函数 printed 的参数\n}\n// 接收参数的函数\nint Printed(int\
    \ numberofsheets, int sheetsbeingprinted){\n    int plainsheets = numberofsheets;\n\
    \    int printedsheets = sheetsbeingprinted;\n    int sheetsremaining = plainsheets\
    \ – printedsheets;\n    cout << “Printer sheets remaining: “ << sheetsremaining\
    \ << endl;\n    return sheetsremaining;\n}\n```\n\n程序语法：Function Arguments.cpp\n\
    \n#### 带参数的函数\n\n用户定义的函数内部带有两个整数参数。当在 `main` 函数中调用该函数时，参数列表将填充两个传递给用户定义函数的值。这些值将在函数中使用代码来解决某些算术运算，然后将最终结果返回给\
    \ `main`。\n\n## 调用函数\n\nC++ 和大多数其他编程语言用于告诉程序处理 `main()` 之外的其他函数工作的方法，是编写函数名称并填充好它的参数（如果有的话）。\n\
    \n```cpp\nint main(){\n    Printed(80,22); // 输入给函数 printed 的参数\n}\n```\n\n然而，尽管这个示例显示\
    \ `main` 是包含调用函数 `printed` 的函数，但并不总是要求 `main` 内部包含调用函数。\n\n```cpp\nint Printed(int\
    \ numberofsheets, int sheetsbeingprinted){\n    int plainsheets = numberofsheets;\n\
    \    int printedsheets = sheetsbeingprinted;\n    int sheetsremaining = plainsheets\
    \ – printedsheets;\n    cout << “sheets remaining: “ << sheetsremaining << endl;\n\
    \    insertmoresheets(additionsheets);\n    return sheetsremaining;\n}\n```\n\n\
    如你所见，在 `printed` 函数中调用 `insertmoresheets` 函数时，不需要数据类型。\n\n## 返回值\n\n每个编写的函数都有一个返回值，并根据其数据类型决定该值是空（`void`）还是更高类型。当被调用函数（通常是\
    \ `main`）结束时，它会传递 `return` 关键字之后的任何值。\n\n在处理 `main` 函数时，通常用返回值 `0` 结尾。然而，在这种情况下，无论最终从\
    \ `main` 函数返回什么值，实际值都会被转发到计算机的操作系统，以便我获得捕获程序中检测到的任何错误的能力。\n\n技术杂谈：返回值：由函数数据类型决定。例如，类型为\
    \ `int` 的函数应返回一个整数值。\n\n## 编写返回语句\n\n返回语句被刻画为一个表达式。这决定了某行代码返回某种类型的值。因此，如果返回语句仅遵循需要返回一个值的规则，那么编写它的方法是相当灵活的。下面是不同返回语句的列表。\n\
    \n```cpp\nreturn myNumber;\nreturn 0;\nreturn 5 + 2;\nreturn 3 * (4 % 2);\nreturn\
    \ MyFunction();\n```\n\n知识：最后语句：如果最后语句（`MyFunction`）返回一个值，那么之前的每一个语句在 C++ 中都是合法的且被接受的。\n\
    \n只需注意，在函数中嵌入多个返回语句总是可能的。\n\n## 多重返回值\n\n除了声明为 `void` 类型的函数外，每个初始化函数在结束之前都要求返回一个值。\n\
    \n具有不同值但对应函数定义数据类型的多个返回语句（例如，一个带有整数变量的整数函数）可以共存在于代码块中。程序的终点是一个返回值——除非该函数是 `void`\
    \ 类型。\n\n下面的程序利用多个返回语句。返回给调用函数的值取决于输入的结果。\n\n## void 函数类型\n\n`void` 数据类型用于不需要返回值的函数。在之前的某些示例中，我们看到了函数数据类型从\
    \ `int` 到 `string`。然而，你还会发现另一种名为 `void` 的数据类型，它用于不需要返回值的函数。\n\n列表 6.4 – What is\
    \ Your Age.cpp\n\n```cpp\n#include <iostream>\nusing namespace std;\nint FindAge();\n\
    int main(){\n    FindAge();\n}\nint FindAge(){\n    cout << \"What is your age?\
    \ \";\n    int age;\n    cin >> age;\n    if (age < 18) {\n        cout << \"\
    You are too young to drink.\" << endl;\n        return age;\n    }\n    else if\
    \ ((age >= 18) && (age <= 68)) {\n        cout << \"You are of working age.\"\
    \ << endl;\n        return age;\n    }\n    else {\n        cout << \"Enjoy your\
    \ retirement.\" << endl;\n        return age;\n    }\n    return 0;\n}\n```\n\n\
    程序语法：What is Your Age.cpp\n\n#### 返回语句\n\n函数通过利用 `return` 关键字后跟一个值来返回结果。在之前的列表中，`return`\
    \ 关键字可以在函数中出现多次。\n\n## 重载函数\n\n可以使用相同的名称创建第二次或第三次函数，但在括号之间夹着不同的参数组合。这被称为函数重载。\n\
    \n看下方的这三个 `player` 函数。每个函数的调用名称相同，但由于括号之间的差异，它们相互独立作用。\n\n```cpp\nplayer(string\
    \ pName);\nplayer(string weaponType, int ammoAmount);\nplayer(int pLives, float\
    \ pHealth, float pMana);\n```\n\n当你有这样的函数时，调用特定函数方法是标出所需的参数列表。\n\n"
- fmt: "\n```cpp\n#include <iostream>\nusing namespace std;\n//declared overloaded\
    \ functions\nvoid player(string pName);\nvoid player(string weaponType, int ammoAmount);\n\
    int main() {\n    // each function below is a different function\n    player(\"\
    Peppercorns\");\n    player(\"Steel Holster Gun\", 200);\n    return 0;\n}\nvoid\
    \ player(string pName) {\n    string playerName = pName;\n    cout << playerName\
    \ << endl;\n}\nvoid player(string weaponType, int ammoAmount) {\n    string weapon\
    \ = weaponType;\n    int ammo = ammoAmount;\n    cout << \"Your weapon is \" <<\
    \ weapon << \" and you have \" << ammo << \" bullets remaining inside it.\" <<\
    \ endl;\n}\n```\n\n# Program Syntax: Overloaded a Function.cpp\n\n## Overloaded\
    \ Functions Called `player(…)`\n\nIn this program there are two functions that\
    \ are overloaded with the equal name of `player`. The reason both of them can\
    \ be used and not be interrupted by one another is because their parameters are\
    \ different.\n\nThe first function has one string parameter, while the other has\
    \ two. One of the parameters is a string variable and the other an an integer.\n\
    \n## Inline Functions\n\nWhen your program calls a function it leaps out of the\
    \ calling function and into the function itself. The computer then takes those\
    \ instructions in the functions at it computes them. When doing this, it creates\
    \ a copy of everything it reads in the function and sets it to memory for when\
    \ the calling function comes back to it. This is great if you have a large function\
    \ (5-7 lines or more). Yet, if you have a small function and your programs is\
    \ like to call that function numerous times then it will slow your program and\
    \ the processing of it down. The method to avoid this is to prefix the function\
    \ title with the keyword `inline`.\n\n```cpp\ninline int MyInlineFunction();\n\
    ```\n\nIn the C programming language you would declare inline functions using\
    \ the `#define` macro. Although, through the development of C++, the `inline`\
    \ keyword has taken the place of `#define` when declaring functions that you want\
    \ as inline.\n\n## Computer Memory and the Stack\n\nWhen a function is called\
    \ in a program its code initializes it to jump from the function to the calling\
    \ function. Any parameters that are in between the functions parentheses are passed\
    \ in as arguments as it is being called. When the function reaches the end it\
    \ looks for a return statement and a value. If the statement exists (`void` functions\
    \ have no return statement), the program reads it and jumps back to the calling\
    \ function.\n\nWhen a program is compiled and ran it will create a stack. The\
    \ stack is a certain placement offset in computer memory that has been allocated\
    \ for the program being run.\n\nIn terms of everyday things you can imagine a\
    \ stack as the queue in your local post office or a pile of plates in your kitchen\
    \ cupboards. The reason for this is because a stack has the method of last-in\
    \ and first-out.\n\nThis means that whatever is placed on the stack last will\
    \ be removed first. Look at the example of these mats in the following image.\n\
    \nIf you take the idea of these multi-coloured mats as a stack, then each one\
    \ will have a certain value attached to it. One of these numbers will be the stack\
    \ pointer. The stack pointer is a small register, which holds the address of the\
    \ programs last request. Everything that is below that number is considered to\
    \ be off the stack.\n\n## Time to Test Yourself\n\nThe following four questions\
    \ are in regards to what you have just learned about programming in C++. Attempt\
    \ these questions before you move forward to the next chapter.\n\n1. How do you\
    \ declare a function?\n2. What types of return statements are allowed?\n3. Can\
    \ you explain how local and global data operates in a program?\n4. What is an\
    \ overloaded function?\n\n## Chapter 7\n\n# Extra Operators\n\n## Logical and\
    \ Relational Operator Types\n\nIn this chapter we are covering the other two types\
    \ of operators that C++ can operate: logical and relational. Both these can be\
    \ incorporated into programs by using a method similar to the mathematical operators.\n\
    \nRelational operators determine the size of an object compared to another object.\
    \ For example, they can determine whether the values given to them are smaller,\
    \ larger or equal to each other.\n\n### Relational Operators\n\nThe first operator\
    \ types we are going to look at are the relational operators. With the relational\
    \ operators you are capable of determining whether a value is lower, higher or\
    \ equal to another value. There are five relational operators C++ uses. The list\
    \ below shows them all.\n\n- `==` Equal To\n- `>=` Greater Or Equal To\n- `<=`\
    \ Less Or Equal To\n- `>` Greater Than\n- `<` Less Than\n- `!=` Not Equal To\n\
    \n### Equal To\n\nThe equal to takes a set of values and determines whether they\
    \ are equal to each other. The syntax for the equal to operator is as follows:\n\
    \n```cpp\nbool variable = value == value;\nbool isitEqual = 4 == 4; // the two\
    \ values make isitequal true.\nbool isitEqual = 8 == 4; // the two values make\
    \ isitequal false.\n```\n\nThe following program shows how the equal to operator\
    \ works with an `if` and `else if` statement.\n\n**Listing 7.0 – Equal To Operator.cpp**\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    int isitEqual;\n\
    \    int theNumber;\n    cout << \"Type a number between 4 and 8: \";\n    cin\
    \ >> isitEqual;\n    cout << \"Type another number between 4 and 8: \";\n    cin\
    \ >> theNumber;\n    if (isitEqual == theNumber) {\n        cout << \"Your numbers\
    \ are equal to.\" << endl;\n    } else {\n        cout << \"Your numbers do not\
    \ equal to.\" << endl;\n    }\n    return 0;\n}\n```\n\n## Program Syntax: Equal\
    \ To.cpp\n\n### The if Condition\n\nBefore the `if` statement, it checks to see\
    \ the value of the two variables are equal. If this is not true, the `else` statement.\n\
    \n### Greater Than\n\nThe greater then operator observes whether the initial value\
    \ is higher than the second. If the value is higher the program will compute it\
    \ as true, else it will be false. The syntax for greater then:\n\n```cpp\nbool\
    \ variable = value > value;\nbool isitGreater = 8 > 4; // the two values make\
    \ isitGreater true\n``` (Wait, the original text had a typo)\n\n**Listing 7.1\
    \ – Greater Than Operator.cpp**\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nint main() {\n    int isitGreater;\n    int theNumber;\n    cout << \"\
    Type a number between 4 and 8: \";\n    cin >> isitGreater;\n    cout << \"Type\
    \ another number between 4 and 8: \";\n    cin >> theNumber;\n    if (isitGreater\
    \ > theNumber) {\n        cout << \"Your initial number is greater than the other.\"\
    \ << endl;\n    } else {\n        cout << \"Your initial number is not greater\
    \ than the other.\" << endl;\n    }\n    return 0;\n}\n```\n\n### Less Then\n\n\
    The less then operator does the opposite to the greater then. Whereas the greater\
    \ then checks to see if the initial value is higher than the second value, the\
    \ less then checks for the opposite by looking for the initial value to be lower.\n\
    \n```cpp\nbool variable = value < value;\nbool isitLess = 4 < 8; // the two values\
    \ make isitLess true\nbool isitLess = 4 < 2; // the two values make isitLess false\n\
    ```\n\n### Greater Than or Equal To\n\nThe greater than or equal to operator works\
    \ on the same method as its counterpart, greater or equal to, only this time the\
    \ initial value can be either greater or equal to the second value for it to return\
    \ true.\n\n```cpp\nbool variable = value >= value;\nbool isitGreaterorEqual =\
    \ 8 >= 4; // the two values make isitGreaterorEqual true\nbool isitGreaterorEqual\
    \ = 2 >= 4; // the two values make isitGreaterorEqual false\n```\n\n### Less Than\
    \ or Equal To\n\nThe less or equal to operator works on the same method as its\
    \ counterpart, greater or equal to, only this time the initial value has to be\
    \ equal or less than the second value.\n"
