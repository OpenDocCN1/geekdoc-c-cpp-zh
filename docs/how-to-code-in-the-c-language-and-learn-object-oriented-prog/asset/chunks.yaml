    quotation marks, which act like a switch that turns off any numerical functionality.


    | // examples of char variableschar letter = ‘L’;char number = ‘5’;char sign =
    ‘$’; |


    As shown, the three char variables all use single quotation marks. This means
    that the value of ‘5’ is not numerical – or at least not completely. The reason
    I use the term "not completely" is due to the fact that all characters typed from
    the keyboard have their own set value, which corresponds to the ASCII layout.
    The ASCII is short for "American Standard Code for Information Interchange" and
    is a character-encoding scheme, which is originally based on the English alphabet.
    This encodes 128 specified characters into 7-bit binary integers. The ASCII table
    designates a value for each character on the keyboard. Therefore, once again,
    char variables have minimum and maximum value.


    Listing 3.2 – Different Types of Characters.cpp


    | #include <iostream>using namespace std;int main(){              cout << "The
    different characters a char variable can hold are shown below:\n" << endl;             
    // three char variable storing different types of characters              char
    letter = ''E'';              char number = ''2'';              char symbol = ''$'';             
    // displaying text with the three different types of characters              cout
    << "The char variable can store individual letters like " << letter << ".\n";             
    cout << "The char variable can store individual numbers as characters like " <<
    number << ".\n";              cout << "The char variable can store individual
    symbols as characters like " << symbol << "." << endl;              return 0;}
    |


    Program Syntax: The Different Types of Characters.cpp


    #### char Variable


    There are three char variables in the program that are declared and defined. Once
    these are created in the program, they are then individually shown on screen using
    the cout object. Also, you may also see that each of the variables has single
    quotation marks around them.


    ## Boolean and String Variables


    ### Bool


    The bool variable only has two values to deal with. These values are true (1)
    and false (0). Devised by George Boolean, hence the name, the bool value is used
    in a wild array of programming languages like Java, Visual Basic and especially
    in C++. You will see this when learning decision making and return statements
    in C++. All the programs created so far in this book concludes with a Boolean
    value in their return statements: return 0.


    Listing 3.3 – True or False.cpp


    | #include <iostream>using namespace std;int main(){              cout << "The
    difference of true and false." << endl;              bool istrue = true;             
    bool isfalse = false;              // discovers what is true and false             
    cout << "The value of true: " << istrue << endl;              cout << "The value
    of false: " << isfalse << endl;              return 0;} |


    Program Syntax: True or False.cpp


    #### bool Variable


    You see two bool variables in this program, which reveals the two different values
    the data type can either be.  The bool variables determine whether the data it
    contains is true (1) or false (0). When you move onto the if and switch statements,
    you will see the reason why the bool variable is crucial to C++ programming.


    bool value range


    | MIN | MAX |


    | False (0) | True (1) |


    ### String


    The string variable is not a built-in type in C++. Instead, to utilize the use
    of strings in your programs you have to include the header file <string>. To declare
    a string variable, it must start with the keyword string followed by the user-defined
    name. The basic idea for strings is that you can take a number of characters and
    string them together without any additional code, apart from the header file being
    included. Examples of a string are shown below, along with the char equivalent.


    | #include <string> // remember to include to use stringsstring myName = "Tom";string
    myAge = "25";char myName[3] = "Tom"; // an array of charchar myAge[2] = "25";
    // a smaller array of char |


    Listing 3.4 – Full Name, Address and Number.cpp


    | #include <iostream>#include <string>using namespace std;int main(){             
    // three string variables              string fullName;              string address;             
    string number;              cout << "Enter Your First Full Name: ";             
    getline(cin, fullName); // can use spaces              cout << "Enter Your Address:
    ";              getline(cin, address);              cout << "Enter Your Telephone
    Number ";              getline(cin, number);              cout << "\nHello, "
    << fullName << "." << endl // displays variable values                           
    << "You Currently Live At: " << address << "." << endl                           
    << "Your Telephone Number Is: " << number << "." << endl;              return
    0;} |


    Program Syntax: Full Name, Address and Number.cpp


    #### The getline(...) Function


    There is another method of using the cin object in C++ that also has extra features
    and allows string and char variables to perform more complex tasks. In this program
    the getline function allows for the user to input spaces into the string of text
    they write. Whereas, when using the cin object, if you were to write the full
    name of a person as say, "Abigail Roberts" then some of the string would truncate
    down to “Abigail”, since the cin object doesn’t allow for spaces. Although the
    getline function does.


    To code a getline function the syntax looks like this:


    | getline(input_command, | string/char variable); |


    #### The cout Object


    In this program the cout object is spaced out on multiple lines. This is allowed
    as at the end of each line (apart from the final one) there is no semi-colon (
    ; ). As discussed earlier, the semi-colon is what concludes a statement. Because
    if there is no semi-colon C++ allows for the code to be separated on different
    lines. This is also because of the way in which C++ reads (or should I say doesn’t
    read) whitespace in a programs code.


    | Knowledge: WhitespaceYou will learn more about whitespace in Chapter 5: Statements
    & Expressions. Although, just consider whitespace much like comments, as it is
    not read by the compiler at build-time. |


    Now you know the basic types of variables that can be created in C++, you will
    examine how to create multiple variables of the same type.


    ## Creating Multiple Variables


    We will use two data types to show how this works – an integer and the string
    variable. To write multiple variables of the same type you use the following syntax:


    | data type | variable name, | variable name |


    Here is an example of three integer variables that are declared using only the
    data type name once.


    | // declare three int variablesint hours, days, months;hours = 24;days = 7;months
    = 12; |'
