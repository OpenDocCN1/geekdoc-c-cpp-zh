    \    //global variable being used in main\n    number -= 5;\n    cout << \"The\
    \ Number Is: \" << number << endl;\n    SecondFunction(); // calls the other function\n\
    \    return 0;\n}\n```\n\nProgram Syntax: Global Variable.cpp\n\n#### The Global\
    \ Variable\n\nThe one global variable in the program is outside any function,\
    \ which makes it global. Because it is global, it means any function declared\
    \ in the program may use it in its definition.\n\nIn the example, the variable\
    \ uses the addition and subtract operator in different functions to show the different\
    \ results that you can achieve.\n\n## Parameters and Arguments\n\nFunctions are\
    \ capable of carrying across data passed to it from a calling function, like `main`.\
    \ The information gets stored as parameters in between the parentheses.\n\nThe\
    \ arguments is the data passed into the functions. An example of this is shown\
    \ in the follow part as a small program.\n\nListing 6.3 – Function Arguments.cpp\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nint Printed(int numberofsheets,\
    \ int sheetsbeingprinted); // function prototype\nint main(){\n    Printed(80,22);\
    \ // parameters inputted for function printed\n}\n// function receiving arguments\n\
    int Printed(int numberofsheets, int sheetsbeingprinted){\n    int plainsheets\
    \ = numberofsheets;\n    int printedsheets = sheetsbeingprinted;\n    int sheetsremaining\
    \ = plainsheets – printedsheets;\n    cout << “Printer sheets remaining: “ <<\
    \ sheetsremaining << endl;\n    return sheetsremaining;\n}\n```\n\nProgram Syntax:\
    \ Function Arguments.cpp\n\n#### Functions with Arguments\n\nThe user-defined\
    \ function carries two integer arguments inside it. When the function is called\
    \ in the `main` function, the argument list is filled out with two values that\
    \ are passed into the user-defined function. These are then used in the function\
    \ with code to resolve some arithmetic, then return the end result back to `main`.\n\
    \n## Calling Functions\n\nThe method that C++ and most other programming languages\
    \ use to tell the programs to work with other functions alongside `main()` is\
    \ to write the name of the function with its parameters filled out, if any.\n\n\
    ```cpp\nint main(){\n    Printed(80,22); // parameters inputted for function printed\n\
    }\n```\n\nHowever, even though this example shows `main` as the function with\
    \ the calling function of `printed` in, it is not always `main` that is required\
    \ to have the calling functions inside it.\n\n```cpp\nint Printed(int numberofsheets,\
    \ int sheetsbeingprinted){\n    int plainsheets = numberofsheets;\n    int printedsheets\
    \ = sheetsbeingprinted;\n    int sheetsremaining = plainsheets – printedsheets;\n\
    \    cout << “sheets remaining: “ << sheetsremaining << endl;\n    insertmoresheets(additionsheets);\n\
    \    return sheetsremaining;\n}\n```\n\nAs you can see, there is no data type\
    \ required for the `insertmoresheets` function when being called in the `printed`\
    \ function.\n\n## Return Values\n\nEvery function written owns a return value\
    \ and depending on its data type shall dictate whether the value is null (`void`)\
    \ or higher. When the called function (normally `main`), concludes, it passes\
    \ whatever value follows the keyword `return`.\n\nWhen dealing with the `main`\
    \ function, it is usual to end it with a return value of `0`. However, in this\
    \ case, no matter what value is eventually returned from the `main` function,\
    \ the actual value is forwarded to the operating system on the computer so I can\
    \ obtain the ability of catching any detected errors in a program.\n\nTechnical\
    \ Talk: Return Values: A return value is dictated by the function data type. For\
    \ instance, a function of type `int` shall return an integer value.\n\n## Writing\
    \ Return Statements\n\nA return statement is characterised as an expression. This\
    \ dictates the line of code returns a value of some type. Therefore, if a return\
    \ statement simply follows the rule that it requires to return a value then the\
    \ method to write one is rather flexible. Below is a small list of different return\
    \ statements.\n\n```cpp\nreturn myNumber;\nreturn 0;\nreturn 5 + 2;\nreturn 3\
    \ * (4 % 2);\nreturn MyFunction();\n```\n\nKnowledge: The Last Statement: If the\
    \ last statement (`MyFunction`) returns a value, then every one of the preceding\
    \ statements are legal and accepted in C++.\n\nJust to note, it is always possible\
