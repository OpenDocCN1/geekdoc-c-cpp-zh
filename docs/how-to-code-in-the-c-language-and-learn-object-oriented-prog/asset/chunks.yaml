  trans: "\n书中的每个程序都有一个 `main` 函数。它是程序的灵魂。当你构建一个程序时，它会从自上而下的视角运行代码，从 `main` 开始，在到达\
    \ `return` 语句并结束之前，处理所遇到的每一行代码。\n\n### 空格（Whitespace）\n\n空白格是程序中留出的空隙。这些空格、制表符和换行符是为了让你的程序看起来更整洁、清晰。空白格——类似于注释——不会影响程序，也不会被编译器读取。使用空白格来格式化程序代码的外观使其易于阅读是明智的。\n\
    \n## 下一阶段\n\n尽管程序会因为包含数千行代码而变得非常庞大，但它们的运行标准与我们的“Hello Programmer”相同，都是极其简单的。在我们进入下一个阶段之前，请快速查看最后一个程序，该程序使用了称为“变量”的数据存储对象，以及头文件\
    \ `<iostream>` 内部的输入对象 `cin`。后者对象允许用户在程序运行时输入自己的数据。\n\n#### 列表 2.0 – 输入与变量\n\n\
    ```cpp\n#include <iostream>\n#include <string> // 包含新的头文件\nusing namespace std;\n\
    int main(){\n    cout << \"Please enter your name, programmer: \"; // 显示文本\n \
    \   string yourName; // 创建字符串变量\n    cin >> yourName; // 将数据输入变量\n    cout <<\
    \ \"Thank you, \" << yourName << \".\" << endl; // 显示变量数据\n    return 0;\n}\n\
    ```\n\n## 测试你自己的时候\n\n以下四个问题关于你刚刚学到的 C++ 编程知识。在继续学习下一章之前，请尝试回答这些问题。\n\n1. C 注释和\
    \ C++ 注释有什么区别？\n2. 程序代码在被编译器读取时遵循什么方向？\n3. 什么是空白格？\n4. 在程序中放置头文件需要哪个关键字？\n\n##\
    \ 第 03 章\n\n# 数据存储、变量与常量\n\n## 什么是变量（Variable）？\n\n在当的现代世界中，有数百万台计算机每天不断处理数据。想要学习编程的人问的一个问题是计算机如何存储它接收到的数据。答案就在变量中。本质上，变量充当容器，存放着不同类型的数据，C++\
    \ 可以利用并操纵这些数据。当变量被创建时，计算机将其存储在内存库中，即随机访问存储器（RAM）。这些内存库具有地址，为变量的定位分配空间。然而，记住内存地址是一项艰巨的任务。当变量被创建时，它们拥有内存地址和名称。后者就像一个标签，供程序员使用以代替冗长的地址。\n\
    \n## 什么是随机访问存储器（Random Access Memory）？\n\n随机访问存储器是存储计算机操作的主要源头，例如创建一个变量或存储一段被剪到计算机剪贴板的文本。一旦完成，计算机就可以与\
    \ RAM 协作，快速高效地访问数据。计算机内存的容量决定了它可能容纳的数据量。\n\n### 位（Bits）与字节（Bytes）\n\nRAM 由位和字节组成。一个字节比一个位大。因此，一个字节由\
    \ 8 位组成。将内存看作是许多微小的空盒子，准备好在程序运行期间存储物品。在每个盒子的内部，程序可以存储一个字节的数据。计算机内存是随机访问的，这与 DVD\
    \ 或硬盘上的数据不同。由于这一目的，数据的访问速度可以比其他媒介快得多。\n\n> **警告：随机访问存储器不是硬盘空间**：不要将 RAM 与硬盘或 DVD\
    \ 的容量混淆。为了解释这种区别，当你加载一个程序时，它是从硬盘、DVD 或其他外设访问的。当程序被加载并运行时，计算机所需的任何数据都会存储在 RAM 中，供计算机在需要时使用。\n\
    \n## 动态与静态类型语言（Dynamic and Static Typed Languages）\n\n我们将检查观察变量数据类型不同的两种语言风格。它们被称为：\n\
    \n* 动态类型语言（Dynamic Typed Language）。\n* 静态类型语言（Static Typed Language）。\n\n### 动态类型语言\n\
    \n在动态类型语言中，变量类型的决定取决于其赋值的数据值。例如，如果你有一个名为 `myVar` 的变量，它的数据值是一个整数（比如 12），那么动态类型语言会将该变量识别为整数。相反，如果你将\
    \ `myVar` 的值改为类似‘A’的内容，编译器就会开始将该变量识别为字符。\n\n### 静态类型语言\n\n相反，静态类型语言有一条规则：变量在程序中使用之前必须声明为特定类型。因此，如果\
    \ `myVar` 等于数字 12，那么该变量可能被声明为整数，或者可能是其他数值数据类型，如 `float` 或 `short`。本质上，静态类型语言首先查看数据类型，以规定它可以存储什么类型的值。\n\
    \n## C++ 是一种静态类型语言\n\nC++ 是一种静态类型语言，因为它对编译器可以读取的不同类型数据有一套固定的标准。作为程序员，你需要在变量使用之前用正确的数据分配正确的数据类型。给字符串变量分配一个整数值是毫无意义且糟糕的编程行为，因为这将导致编译器错误。\n\
    \n## 学习数据类型\n\n大多数编程语言（包括 C++ 在内）都有多种用于声明变量的数据类型。数据类型的范围如表表所示，以及它们在内存中的单独大小。\n\
    \n| 数据类型（DATA TYPE） | 名称（NAME） | 大小（字节） |\n| :--- | :--- | :--- |\n| `int` | 整数\
    \ | 4 |\n| `short` | 短整数 | 4 |\n| `long` | 长整数 | 8 |\n| `long long` | 超长整数 | 8\
    \ |\n| `float` | 浮点数 | 4 |\n| `double` | 双精度浮点数 | 8 |\n| `char` | 字符 | 1 (每个字符)\
    \ |\n| `bool` | 布尔值 | 4 |\n| `string` | 字符串 | 1 (每个字符) |\n\n很显然有很多数据类型需要学习。然而，你不必担心不能脱口而出这些数据类型。随着你在本章及书中其余部分的进展，你将逐渐学习每一个。在开始之前，我想向你展示如何在\
    \ C++ 中声明和定义变量。\n\n## 声明变量（Declare Variables）\n\n在程序可以使用不同类型的变量之前，必须对所需的变量进行声明。这涉及用所需的数据类型和用户定义的名称来编写变量。声明变量需要以下语法。\n\
    \n| 数据类型 | 变量名 |\n| :--- | :--- |\n| `int` | `myNumber` |\n\n在这个示例中，关键字 `int`\
    \ 将 `myNumber` 声明为整数。因此，当你声明一个变量时，分配内存的过程就开始了。很多时候，程序要求变量在运行时已经初始化了初始值。这意味着在程序运行之前就已经定义了数据类型的值。\n\
    \n下一个程序演示了在程序运行时声明和定义变量的概念。\n\n#### 列表 3.0 – 声明与定义变量.cpp\n\n```cpp\n#include <iostream>\n\
    #include <string>\nusing namespace std;\nint main() {\n    int myNumber = 12;\n\
    \    char myChar = 'A';\n    cout << \"Number: \" << myNumber << endl;\n    cout\
    \ << \"Character: \" << myChar << endl;\n    return 0;\n}\n```\n"
