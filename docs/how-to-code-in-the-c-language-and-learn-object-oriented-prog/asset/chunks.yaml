    \ third time using the same name, but with a different combination resting sandwiched\
    \ between the parentheses. This is known as overloading a function.\n\nLook below\
    \ at these three `player` functions. Each one is called the same, but due to the\
    \ difference between the parentheses they act individually to each other.\n\n\
    ```cpp\nplayer(string pName);\nplayer(string weaponType, int ammoAmount);\nplayer(int\
    \ pLives, float pHealth, float pMana);\n```\n\nWhen you have functions like this,\
    \ the method to call a specific one is to indicate it with the list of parameters\
    \ needed.\n"
