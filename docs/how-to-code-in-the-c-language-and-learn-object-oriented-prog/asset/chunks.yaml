    \ value of that variable by one.\n\n#### Increment Operator\n\nThe increment operator\
    \ takes an integer value and increases the value of that variable by one.\n\n\
    #### Postfix Operator\n\nThe postfix operator works with either the increment\
    \ or decrement operators to determine whether a value is to be changed before\
    \ it is displayed on the screen or after. Using the increment or decrement operators,\
    \ it will only alter the value by one.\n\n## Operators and Precedence\n\nIn any\
    \ programming language, one of the biggest aspects that most beginners struggle\
    \ with is the notion of precedence. This means that the operators that are used\
    \ in a line of code have a certain order in which they are computed. If we were\
    \ to take a sum as in:\n\n| sum = 4 + 4 * 3 – 1 % 2; |\n\nThe idea C++ has of\
    \ looking at this figure to give sum its answer is by doing the following:\n\n\
    | Step 1: | 4 * 3 = 12; |\n\n| Step 2: | 12 % 2 = 6; |\n\n| Step 3: | 4 + 6 =\
    \ 10; |\n\n| Step 4: | 10 – 1 = 9; |\n\nSo, at the end of the figure, the answer\
    \ sum would store in its variable is 9\\. However, say you wanted the 4 + 4 to\
    \ be the first to compute in then subtract by 1.\n\nYou would use parentheses\
    \ around the numbers you wanted the compiler to compute first.\n\n| sum = ((4\
    \ + 4) * 3 (– 1)) % 2; |\n\nThis changes the sum as it now follows these steps:\n\
    \n| Step 1: | 4 + 4 = 8; |\n\n| Step 2: | 8 – 1 = 7; |\n\n| Step 3: | 7 * 3 =\
    \ 21; |\n\n| Step 4: | 21 % 2 = 10.5; |\n\nIf in the last step the data type of\
    \ sum was an integer, it would round down to 10\\. But as you can see, due to\
    \ parentheses being used it changes the environment of the precedence being computed.\n\
    \nListing 4.3 – Precedence with Operators.cpp\n\n| #include <iostream>using namespace\
    \ std;int main(){              cout << \"In C++ operators have an order of precedence.\"\
    \ << endl;              int notPrecedence = 4 + 2 * 3 / 2 - 5; // does not use\
    \ precendence              int isPrecedence = (4 + 2) * 3 / (5 - 2); // does use\
    \ precendence              // two different results displayed              cout\
    \ << \"Without any precedence the value is: \" << notPrecedence << endl;             \
    \ cout << \"With precedence the value is: \" << isPrecedence << endl;             \
    \ return 0;} |\n\nProgram Syntax: Precedence with Operators.cpp\n\n#### Precedence\n\
    \nThe precedence in this program determines what sums will be challenged first.\
    \ The brackets around the certain numbers of (4 + 2) and (5 – 2) is what determines\
    \ that they will be acted upon first.\n\n## Time to Test Yourself\n\nThe following\
    \ four questions are in regards to what you have just learned about programming\
    \ in C++. Attempt these questions before you move forward to the next chapter.\n\
    \n| Test Yourself \n\n1.  What does the modulus operator achieve?"
