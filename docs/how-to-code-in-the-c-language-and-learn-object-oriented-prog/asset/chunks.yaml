    \ return 0;} |\n\nProgram Syntax: Are You Programming or Not.cpp\n\n#### The else\
    \ Statement\n\nThe else statement is there as a precaution in case the initial\
    \ if condition is false. If this happens, then the program will jump down to the\
    \ else statement and display on the screen \"Well, try your hand at something\
    \ else.\" Understand in some cases the if and else statement can be found out\
    \ to be false, therefore none of the statements inside them are executed.\n\n\
    ## Nested Statements\n\nAlong with the normal if and else statements you can attach\
    \ other if and else statements to them. This is known as nested  statements.\n\
    \n| if (condition){    // statements    if (condition)    {        // more statements   \
    \ }}    else    {        // statements        if (condition)        {           \
    \ // more statements        }    }} |\n\n| Warning: Too Many StatementsTry making\
    \ a program with ten if statements, ten else and five nested if and else statements.When\
    \ experimenting with the if statement, as a beginner, you will probably come up\
    \ with something like that. Although, try as you might, there is a better and\
    \ cleaner way to code such a section of a program. |\n\n## The switch Statement\n\
    \nA switch statement is beneficial when a program is challenged with numerous\
    \ options to choose from. Therefore, in a program you can implement if and if\
    \ else statements, perhaps with nested if statements, but soon or later with enough\
    \ if’s and else’s your program might turn into a wild ride on continuous indentions\
    \ and dozens of if’s or else’s. Basically, it can read like a complete mess.\n\
    \nThe switch statement is a shorter version of the if statement. It acts much\
    \ like a menu. In advanced programming switch statements are required much of\
    \ the time. For example, when developing a game, a switch statement is normally\
    \ used for the game loop. Therefore, switch statements are a good thing for programming\
    \ and wise to learn about.\n\nLike the if statement, the switch statement takes\
    \ a condition and determines what value it matches against in its list of cases.\
    \ Here is the syntax for a switch statement:\n\n| switch(condition) // if condition\
    \ is true, switch statement opens{    case 1: // statements goes here with semi-colon   \
    \ break;    case 2: // statements goes here with semi-colon    break;    case\
    \ 3: // statements goes here with semi-colon    break;    case 4: // statements\
    \ goes here with semi-colon    break;    default: // statements goes here with\
    \ a semi-colon} |\n\nIt is much like the if statement, in the fact that it takes\
    \ a condition and makes a decision depending on the result. The difference lies\
    \ in the cases, where the condition will be true for only one of the cases and\
    \ not the rest. This is a good statement for only selecting one option to use."
