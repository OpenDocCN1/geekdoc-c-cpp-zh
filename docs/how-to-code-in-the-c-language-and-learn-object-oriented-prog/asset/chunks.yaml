  trans: "\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main(){\n   \
    \ cout << \"Time for some mathematics.\" << endl;\n    int integerValue1 = 15;\n\
    \    int integerValue2 = 45;\n    cout << \"Sum 1: 15 + 45 = \" << integerValue1\
    \ + integerValue2 << endl;\n    float floatValue1 = 161.2;\n    float floatValue2\
    \ = 9.23;\n    cout << \"Sum 2: 161.2 - 9.23 = \" << floatValue1 - floatValue2\
    \ << endl;\n    int integerValue3 = 2;\n    int integerValue4 = 12;\n    cout\
    \ << \"Sum 3: 2 * 12 = \" << integerValue3 * integerValue4 << endl;\n    float\
    \ floatValue3 = 17.2;\n    float floatValue4 = 22.2;\n    cout << \"Sum 4: 17.2\
    \ / 22.2 = \" << floatValue3 / floatValue4 << endl;\n    return 0;\n}\n```\n\n\
    程序语法：`Basic Maths.cpp`\n\n### + 加法运算符\n\n我们的第一个运算符是加法运算符。这可能是你在学校里学到的第一个运算符。它在\
    \ C++ 中的作用方式也是如此。它简单地接收两个变量并将结果赋值给另一个。\n\n### – 减法运算符\n\n减法运算符接收另外两个整数并将它们赋值给另一个。然后显示第三个整数的值。\n\
    \n### * 乘法运算符\n\n乘法运算符同样是你在学校里用过的基础运算符之一。在这个程序中，它接收两个整数并将值赋值给另一个。\n\n### / 除法运算符\n\
    \n最后一个使用的运算符是除法运算符。它使用了 `float` 变量，但如果用整数变量来代替 `float`，那么结果可能是不准确的。\n\n这个程序的大部分内容将带你回到数学课的日子——无论你是热爱它们还是厌恶它们——而且它们其实非常简单。\n\
    \n## 将赋值运算符与数学运算符混合\n\n在在上一个示例中，我展示了一个使用赋值运算符的三个变量的示例。这是在程序中存储额外值的极佳方法，但当你需要更改程序中仅有的两个变量之一时，可以让该变量等于它自身的另一个值。如下所示：\n\
    \n`firstNumber = firstNumber + secondNumber;`\n\n这意味着这两个变量正在相加，然后左值（左侧的）变量在自身中存储一个新值。此外，还有一种代码的简写版本，专业程序员经常使用。\n\
    \n`firstNumber += secondNumber;`\n\n这与之前的结果含义相同。尽管加法符号和赋值运算符交换了位置，但含义仍然相同。\n\n\
    `// this is firstNumber = firstNumber - secondNumber;\nfirstnumber -= secondNumber;`\n\
    \n## 递增与递减\n\n两个始终使用数值的运算符是递增和递减运算符。在编程中，最常见的加减值是数字 1。`++` 有一种实现此点的方法。\n\n要将值增加\
    \ 1，使用的方法是递增运算符。\n\n`int number++;`\n\n另一种方法是递减，它执行完全相反的操作，从当前值中减 1。\n\n`int number--;`\n\
    \n## 前置和后缀运算符\n\n除了递增和递减运算符，另外两个与数值工作的运算符是前置和后缀运算符。\n\n这两者的区别在于递增和递减符号放在变量上的位置，以及它们如何与变量作用。\n\
    \n前置运算符通过在显示变量之前先增加或减少值来运行。这就是为什么运算符符号附加在变量名称之前。\n\n`++number;`\n\n后缀运算符的工作方式相反，且放置在相反的位置。如果我们试图在屏幕上显示变量，然后在再次显示之前减少该值，它看起来像这样。\n\
    \n`cout << number << endl;\nnumber--;\ncout << number << endl;`\n\n变量名最初位于后缀运算符之前。这意味着前置和后缀运算符是从左到右读取的。在前置示例中，它先读取运算符（`++`），然后读取变量名（`number`）。\n\
    \n列表 4.2 – `Pre- and Postfix.cpp`\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nint main(){\n    int decrementValue = 10;\n    int incrementValue = 0;\n\
    \    int prefixValue = 5;\n    int postfixValue = 5;\n    cout << \"When we increase\
    \ the prefix value from 5 it begins at: \" << ++prefixValue << endl; //prefix\
    \ value\n    cout << \"When we increase the postfix value from 5 it begins at:\
    \ \" << postfixValue++ << endl; // postfix value\n    cout << \"When we increment\
    \ the value of 0 using a postfix operator it begins at: \" << incrementValue++\
    \ << endl; // incrementing value\n    cout << \"When we decrement the value of\
    \ 10 using a prefix operator it begins at: \" << --decrementValue << endl; //\
    \ decrementing value\n    return 0;\n}\n```\n\n程序语法：`Pre- and Postfix.cpp`\n\n\
    ### 前置运算符\n\n前置运算符接收数值型数据（如整数），并增加或减少数据的值 一。为了实现这一点，运算符符号 `++` 或 `--` 必须置于其所作用变量名称之前。\n\
    \n### 递减运算符\n\n递减运算符接收一个整数值，并将该变量的值减少一。\n\n### 递增运算符\n\n递增运算符接收一个整数值，并将该变量的值增加一。\n\
    \n### 后缀运算符\n\n后缀运算符的工作方式相反，放置在相反的位置。如果我们试图在屏幕上显示变量，然后在再次显示之前减少该值，它看起来像这样。\n\n\
    ## 运算符与优先级\n\n在任何语言中，初学者挣扎的最大方面之一都是优先级的概念。这意味着行中使用的运算符有一个特定的顺序。如果我们取 `sum = 4\
    \ * 3 % 2 - 1`\n\nC++ 查看此图表以给 sum 答案的想法是：\n\n步骤 1：`4 * 3 = 12`\n步骤 2：`12 % 2 =\
    \ 6`\n步骤 3：`4 + 6 = 10`\n步骤 4：`10 - 1 = 9`\n\n所以，在图表的最后，存储在变量中的答案 sum 是 9。但是，假设你想让\
    \ `4 + 4` 先计算，然后减去 1。你会在想要计算的数字周围加上括号。\n\n`sum = ((4 + 4) * 3) % 2;`\n\n这改变了结果，因为它现在遵循：\n\
    \n步骤 1：`4 + 4 = 8`\n步骤 2：`8 - 1 = 7`\n步骤 3：`7 * 3 = 21`\n步骤 4：`21 % 2 = 10`\n\n\
    如果最后一步 sum 的类型是整数，它将向下取整为 10。但正如你所见，由于括号的存在，它改变了计算优先级的环境。\n\n列表 4.3 – `Precedence.cpp`\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nint main(){\n    cout <<\
    \ \"In C++ operators have an order of precedence.\" << endl;\n    int notPrecedence\
    \ = 4 + 2 / 2 - 5; // 不使用优先级\n    int isPrecedence = (4 + 2) * 3 / (5 - 2); //\
    \ 使用优先级显示不同的结果\n    cout << \"没有优先级时，值是: \" << notPrecedence << endl;\n    cout\
    \ << \"有优先级时，值是: \" << isPrecedence << endl;\n    return 0;\n}\n```\n\n程序语法：`Precedence.cpp`\n\
    \n## 测试自我\n\n以下四个问题与你刚刚学习的 C++ 编程有关。在移动到下一章节之前，请尝试回答这些问题。\n\n1. 取模运算符（modulus\
    \ operator）实现了什么？\n\n"
- fmt: "\n2. How do you increment and decrement a value by 1?\n3. What is precedence?\n\
    4. Can you explain how to use the pre- and postfix operators?\n\n# Chapter 5:\
    \ Statements and Expressions\n\n## Statements\nStatements in CC` are a line of\
    \ code, which orders the program to take action. Each written statement finishes\
    \ with a semi-colon. The statement signifies to a compiler to initialize a certain\
    \ amount of actions in a program. In the following example, the statement orders\
    \ the compiler to display text and then end the line.\n\n```cpp\ncout << \"A statement!\"\
    \ << endl; // display and end\n```\n\n## Compound Statements\nA group of statements\
    \ together enclosed between brackets `{ }` is known as compound statements. Later\
    \ in this chapter, you’ll see this in programs when you examine the `if` statement.\
    \ Just to add, you have already seen a compound statement in use with the `main`\
    \ function. A set of compound statements orders the compiler compute a set of\
    \ actions, according to the coded instructions given.\n\n## Expressions\nAn expression\
    \ is any coded statement, which returns a value. This means expressions are in\
    \ fact statements. If you look at the following example, you see an expression\
    \ that returns a value to the variable `Z`.\n\n```cpp\nint Y = 2;\nint X = 4;\n\
    int Z;\nZ = Y + X; // expression returns the value 6\n```\n\nHere is another example\
    \ of an expression, one you’ll have seen at the end of the program examples.\n\
    \n```cpp\nreturn 0;\n```\n\n## Make Decisions in Programs\nUntil now you have\
    \ looked at basic programs. You have looked at a top-down circuit of computer\
    \ programming and seen how a basic program reads written code.\n\nHowever, you\
    \ are about to mix your programming up a little by introducing the concept of\
    \ decision making. You are going to examine the steps of decision making through\
    \ the involvement of the `if`, `if else` and `switch` statements.\n\n## The if\
    \ Statement\nYou may have thought that a program that flows from top-down can\
    \ get tedious. No computer game or application is built on this foundation. The\
    \ initial method implemented to alter a boring top-down role in a program is to\
    \ insert an `if` statement.\n\nThe `if` statement examines a Boolean condition\
    \ to see whether it is true or false. If the condition is true the `if` statement\
    \ will progress onto its own instructions, which can change the dynamics of the\
    \ program. However, if the condition is false it will continue boringly as before.\n\
    \nListing 5.0 – Are Learning.cpp\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nint main() {\n    bool isProgramming; // if statement requires a bool\
    \ type\n    cout << \"Are you learning to program? (no) or 1(yes)): \" << endl;\n\
    \    cin >> isProgramming;\n    if (isProgramming == true) // if statement condition\n\
    \    {\n        cout << \"Yes. Then luck!\" << endl; // execute program line\n\
    \    }\n    return 0;\n}\n```\nProgram Syntax: Are Learning.cpp\n\n### The if\
    \ Statement\nYou’ll notice at the beginning of the `if` statement there is no\
    \ semi-colon. You should not put a semi-colon here as it is the start of a new\
    \ compound statement opening when the condition is true. In this case, it examines\
    \ a `bool` variable and reads it as true. Therefore, the program travels through\
    \ the `if` statement, executing the one inside.\n\nListing 5.1 – A False Condition.cpp\n\
    ```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    bool isProgramming;\
    \ // if statement requires a bool type\n    cout << \"Are you learning to program?\
    \ (no) or 1(yes)): \" << endl;\n    isProgramming = false;\n    if (isProgramming\
    \ == true) // if statement condition\n    {\n        cout << \"Yes. Then luck!\"\
    \ << endl; // execute program line\n    }\n    return 0;\n}\n```\nProgram Syntax:\
    \ A False Condition.cpp\n\n#### Line Not Execute\nA replication of the previous\
    \ program, this one reveals the `if` statement doesn’t open up to execute the\
    \ `cout` statement because the condition is not equal to true.\n\n## if else Statement\n\
    Considering the `if` statement begins to create decision making in your programs,\
    \ it still isn’t enough to make a bold and exciting program which has randomness\
    \ and the spark of uncertainty. When the `if` condition is false you have no second\
    \ option when. So, the program simply skips the compound `if` statement and continues\
    \ on its top-down rotation.\n\nHowever, you can place a second decision maker\
    \ after the `if` statement called `else`. The `else` keyword allows for another\
    \ decision when the `if` condition is equal to false. The `else` syntax looks\
    \ like:\n\n```cpp\nif (condition) {\n    // statements\n} else {\n    // statements\n\
    }\n```\n\nWhen the `if` condition has been tested and found out to equal false\
    \ it jumps down to the `else` statement and executes and read from there. If the\
    \ `else` condition is true it slips inside its block and executes the statements\
    \ within.\n\nListing 5.2 – Are You Programming or Not.cpp\n```cpp\n#include <iostream>\n\
    using namespace std;\nint main() {\n    bool isProgramming;\n    cout << \"Are\
    \ you learning to program? (No) or 1(Yes)): \";\n    cin >> isProgramming;\n \
    \   if (isProgramming == true) {\n        cout << \"Yes. Then Luck!\" << endl;\n\
    \    } else // the else statement offers variety\n    {\n        cout << \"Well,\
    \ try your hand at something else.\" << endl;\n    }\n    return 0;\n}\n```\n\
    Program Syntax: Are You Programming or Not.cpp\n\n### The else Statement\nThe\
    \ `else` statement is there as a precaution in case the initial `if` condition\
    \ is false. If this happens, then the program will jump down to the `else` statement\
    \ and display on the screen \"Well, try your hand at something else.\" Understand\
    \ in some cases the `if` and `else` statement can be found out to be false, therefore\
    \ none of the statements inside them are executed.\n\n## Nested Statements\nAlong\
    \ with the normal `if` and `else` statements you can attach other `if` and `else`\
    \ statements to them. This is known as nested statements.\n\n```cpp\nif (condition)\
    \ {\n    // statements\n    if (condition) {\n        // more statements\n   \
    \ }\n} else {\n    // statements\n    if (condition) {\n        // more statements\n\
    \    }\n}\n```\n\nWarning: Too Many Statements\nTry making a program with ten\
    \ `if` statements, ten `else` and five nested `if` and `else` statements. When\
    \ experimenting with the `if` statement, as a beginner, you will probably come\
    \ up with something like that. Although, try as you might, there is a better and\
    \ cleaner way to code such a section of a program.\n\n## The switch Statement\n\
    A `switch` statement is beneficial when a program is challenged with numerous\
    \ options to choose from. Therefore, in a program you can implement `if` and `if\
    \ else` statements, perhaps with nested `if` statements, but soon or later with\
    \ enough `if`s and `else`s your program might turn into a wild ride on continuous\
    \ indentions and dozens of `if`s or `else`s. Basically, it can read like a complete\
    \ mess.\n\nThe `switch` statement is a shorter version of the `if` statement.\
    \ It acts much like a menu. In advanced programming `switch` statements are required\
    \ much of the time. For example, when developing a game, a `switch` statement\
    \ is normally used for the game loop. Therefore, `switch` statements are a good\
    \ thing for programming and wise to learn about.\n\nLike the `if` statement, the\
    \ `switch` statement takes a condition and determines what value it matches against\
    \ its list of cases. Here is the syntax for a `switch` statement:\n\n```cpp\n\
    switch(condition) // if condition is true, switch statement opens{\n    case 1:\
    \ // statements goes here with semi-colon\n    break;\n    case 2: // statements\
    \ goes here with semi-colon\n    break;\n    case 3: // statements goes here with\
    \ semi-colon\n    break;\n    case 4: // statements goes here with semi-colon\n\
    \    break;\n    default: // statements goes here with a semi-colon\n}\n```\n\n\
    It is much like the `if` statement, in the fact that it takes a condition and\
    \ makes a decision depending on the result. The difference lies in the cases,\
    \ where the condition will be true for only one of the cases and not the rest.\
    \ This is a good statement for only selecting one option to use.\n"
