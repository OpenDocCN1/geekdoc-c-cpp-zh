    age;    }    else if ((age >= 18) &&  (age <= 68))    {        cout << "You are
    of working age." << endl;        return age;    }    else    {         cout <<
    "Enjoy your retirement." << endl;        return age;    }    return 0;} |


    Program Syntax: What is Your Age.cpp


    #### return Statements


    Functions return a value by utilizing the keyword return followed by the value.
    Shown in the previous listing above, the return keyword can appear numerous times
    in a function. The three return statements above the concluding one, will return
    a different value depending on what is entered by the user.


    ## Overloaded Functions


    Functions can be created a second or third time using the same name, but with
    a different combination resting sandwiched between the parentheses. This is known
    as overloading a function.


    Look below at these three player functions. Each one is called the same, but due
    to the difference between the parentheses they act individually to each other.


    | player(string pName);player(string weaponType, int ammoAmount);player(int pLives,
    float pHealth, float pMana); |


    When you have functions like this, the method to call a specific one is to indicate
    it with the list of parameters needed.


