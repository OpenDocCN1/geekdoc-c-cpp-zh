    //global variable being used in main    number -= 5;    cout << "The Number Is:
    " << number << endl;    SecondFunction(); // calls the other function    return
    0;} |


    Program Syntax: Global Variable.cpp


    #### The Global Variable


    The one global variable in the program is outside any function, which makes it
    global. Because it is global, it means any function declared in the program may
    use it in its definition.


    In the example, the variable uses the addition and subtract operator in different
    functions to show the different results that you can achieve.


    ## Parameters and Arguments


    Functions are capable of carrying across data passed to it from a calling function,
    like main. The information gets stored as parameters in between the parentheses.


    The arguments is the data passed into the functions. An example of this is shown
    in the follow part as a small program.


