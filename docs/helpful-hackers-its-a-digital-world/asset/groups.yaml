    # 拓展技术的边界


    **你是否曾经计划过一场需要保密的惊喜派对？** 你是否在电脑上保存了关于这个派对的信息？也许你还使用了密码来防止别人阅读它。如果有人能够进入你的电脑并读到关于这个派对的信息呢？他们可能会更改信息，甚至可能将其删除。


    黑客在计算机系统和**软件**中寻找弱点。大多数黑客尝试在发现问题时尝试修复它们。他们在**网络安全**或软件测试领域工作。但有些黑客会利用他们的技能来伤害他人。他们入侵计算机系统来盗取或破坏信息。


    黑客拓展**技术**的边界，以寻找使用它的新方法。黑客可以对不同的做事方式进行可视化。然后他们找到了**创新**的方法来使他们的愿景变为现实。


    # 第一章：如何成为一名黑客


    **黑客的工作是发明新方法来解决问题并改进流程。** 黑客拥有计算机系统和软件的专家知识，并喜欢研究它们是如何运作的。许多黑客喜欢将事物拆解并重新组装。


    黑客寻找使用现有系统和软件的新方法。当计算机程序没有按照黑客需要的方式执行工作时，黑客会找到完成任务的方法。他们甚至可能编写新的计算机代码。黑客也擅长创建新的计算机程序。


    成为黑客并不需要大学学位。黑客只需要对计算机和软件有深入的了解。尽管如此，许多黑客拥有计算机科学、信息技术（IT）或网络安全的学位。


    一些机构为黑客提供特殊的认证。此类认证证明了黑客具备所需的技能


    ![](img/d9ae122cf7a6b4ccdac0ef78583cc322_10_0.png)


    伊利诺伊大学的学生可以申请伊利诺伊网络安全学者计划。该计划的毕业生已进入国土安全部和中央情报局等政府机构工作。


    以及他们良好完成工作所需的知识。拥有**认证**也能证明一名黑客是值得信赖的。


    有些黑客以团队形式工作。整个团队合作寻找解决方案。另一些黑客则独立工作。他们按项目为公司服务。


    # 第二章：黑帽对白帽


    当新闻中提到黑客时，故事通常是关于不伦理黑客的。不伦理黑客也被称为黑帽。这是因为在旧的西部片中，坏人总是戴着黑帽子。


    黑帽为了伤害他人而入侵计算机系统和软件。他们盗取数据并破坏系统。他们可能会窃取、侵犯他人隐私或破坏文件。


    由于对黑客犯罪的报道，很多人认为所有黑客都是。然而然而大多数黑客是有伦理的。他们想要让计算机更加安全。伦理黑客被称为白帽，因为西部片中的好人通常戴着白帽子。


    白帽帮助公司免受黑帽的侵害。公司聘佣白帽入侵系统


    ![](img/d9ae122cf7a6b4ccdac0ef78583cc322_12_0.png)


    牛仔侠是许多西部剧集和电影中的英雄。他以戴着白帽子而闻名。


    和程序以寻找弱点。然后黑客会确定如何加强系统。这被称为渗透测试。黑客还帮助工作场所的其他人员了解潜在威胁。他们教导如何防止**网络犯罪分子**侵害他们的系统和**软件**。


    白帽黑客每天监控进出公司服务器的数据。他们留意黑帽可能入侵系统的安全威胁和弱点。他们确保公司与互联网的连接尽可能安全。


    **网络安全**并不是黑客利用技能的唯一方式。有些黑客会在发布前测试新的游戏、应用程序和软件程序。这些黑客会寻找任何问题并确保这些产品正常运行。当黑客


    ![](img/d9ae122cf7a6b4ccdac0ef78583cc322_13_0.png)


    > Kevin Mitnick 是第一个进入 FBI 通缉逃犯名单的黑客。他在 20 世纪 90 年代因黑客被判了几年。后来，他成为一名白帽黑客并成立了一家网络安全咨询公司。


