    mid-1990s is hacktivism. The term *hacktivism* is a combination of *hack* and
    **activism**.


    Hackers use hacktivism to promote causes that are important to them. They might
    write a message about the cause on a website that opposes the cause. They may
    **disrupt** traffic from visiting a site or redirect it to another site. This
    type of hacking usually doesn’t harm the system being hacked. However, even if
    the hackers don’t cause harm, it is usually still illegal.


    Not all activists are disruptive. **Random** Hacks of Kindness (RHoK) is a hacktivist
    group. It looks for **innovative** ways to use **technology** to solve problems
    around the world. RHoK holds events called hackathons. The group’s goal is to
    use computers and other technologies to help people.


    Organizations such as colleges and universities also use hackathons to spark innovation.
    Students from universities


    ## DIGITAL SPOTLIGHT

    ## RANDOM HACKS OF KINDNESS


    RHoK was formed in 2009 by Microsoft, Google, Yahoo, NASA, and the World Bank.
    They wanted to focus on improving disaster relief efforts. Their idea was to combine
    the knowledge of disaster relief experts and programmers at hackathons held around
    the world.


    During RHoK hackathons, the disaster relief experts give the hackers a problem
    to solve. Then they work on the problem for a couple of days and propose solutions.
    The disaster experts choose winning solutions to try in real disaster response
    situations.


    The first hackathon took place at Hacker Dojo in Mountain View, California, in
    November 2009. Some of the software built at the event was used in relief efforts
    after the Haiti and Chile earthquakes in 2010. Since then, RHoK hackathons have
    been held every six months.


