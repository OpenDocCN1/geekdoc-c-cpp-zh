    ![](img/d9ae122cf7a6b4ccdac0ef78583cc322_30_0.png)


    > The University of Pennsylvania''s 2015 PennApps hackathon was the largest student
    hackathon in the world. Hackers came from 147 universities in 24 US states and
    11 countries.


    around the world gather at events such as PennApps and MHacks. They learn how
    to use different kinds of software and computers, write new code, and come up
    with creative ideas.


    These forms of hacking are more like what the original hackers of the 1960s did.
    Each day, hackers think of new ideas for computers and software. Good or bad,
    hackers are always pushing the limits to do things that have not been done before.
    No one knows what will come next. But hackers will definitely play a big part
    in the future of computers and technology.


