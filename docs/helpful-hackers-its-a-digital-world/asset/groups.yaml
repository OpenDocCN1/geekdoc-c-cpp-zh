    # STRETCHING THE BOUNDARIES OF TECHNOLOGY


    **Have you ever planned a surprise party that you needed to keep secret?** Did
    you save information about it on a computer? Maybe you used a password to keep
    other people from being able to read it. What if someone was able to get into
    your computer and read about the party? They could change the information or they
    could even remove it.


    Hackers find weaknesses in computer systems and **software**. Most hackers try
    to fix problems as they find them. They have jobs in **cybersecurity** or software
    testing. But some hackers use their skills to harm others. They break into computer
    systems to steal or destroy information.


    Hackers stretch the boundaries of **technology** to find new ways to use it. Hackers
    can visualize how to do things differently. Then they find **innovative** ways
    to make their visions come true.


    # CHAPTER 1: HOW TO BECOME A HACKER


    **Hackers'' jobs are to invent new ways to solve problems and improve processes.**
    Hackers have expert knowledge of computer systems and software and enjoy figuring
    out how they they work. Many hackers like taking things apart and putting them
    back together.


    Hackers look for new ways to use existing systems and software. When computer
    programs don''t do what hackers need them to do, hackers find ways to get the
    job done. They may even write new computer code. Hackers are also good at creating
    new computer programs.


    A college or university degree is not required to be a hacker. Hackers just need
    to know a lot about computers and software. Still, many hackers have degrees in
    computer science, information technology (IT), or network security.


    Some organizations offer special certifications for hackers. Such certifications
    show that hackers have the skills


    ![](img/d9ae122cf7a6b4ccdac0ef78583cc322_10_0.png)


    Students at the University of Illinois can apply for the Illinois Cyber Security
    Scholars Program. Graduates of the program have gone on to work for government
    agencies such as Homeland Security and the Central Intelligence Agency.


    and and knowledge they need to do their jobs well. Having a **certification**
    also shows that a hacker is trustworthy.


    Some hackers work as part of a team. The whole team works together to find solutions
    to problems. Other hackers work alone. They work for companies on a project-by-project
    basis.


    # CHAPTER 2: BLACK HATS VS. WHITE HATS


    When hackers are mentioned in the news, the story is usually about unethical hackers
    who have done something wrong. Unethical hackers are also called black hat hackers.
    This is because in old Western movies, the bad guys almost always wore black hats.


    Black hat hackers break into computer systems and software for the purpose of
    harming others. They steal data and damage systems. They might steal money, invade
    people''s privacy, or destroy documents.


    Because of news coverage of hacking crimes, many people think that all hackers
    do. However, most hackers are ethical. They want to make computers more secure.
    Ethical hackers are called white hat hackers because the good guys in Westerns
    usually wore white hats.


    White hat hackers help protect companies from black hat hackers. Companies hire
    white hat hackers to break into systems


    ![](img/d9ae122cf7a6b4ccdac0ef78583cc322_12_0.png)


    The Lone Ranger is a hero in many Western television shows and movies. He is known
    for wearing a white hat.


    and programs to find weaknesses. Then the hackers determine how to make the systems
    stronger. This is called penetration testing. Hackers also help other people in
    their workplaces understand possible threats. They teach others how to prevent
    **cybercriminals** from harming their systems and **software**.


    White hat hackers keep an eye on the data that flows in out of their companies''
    servers each day. They watch for security threats and weaknesses where black hat
    hackers could break into the systems. They make sure the company''s connection
    to the internet is as secure as possible.


    **Cybersecurity** isn’t the only way hackers use their skills. Some hackers test
    new games, apps, and software programs before they are released. These hackers
    look for any problems and make sure these products work properly. When hackers


    ![](img/d9ae122cf7a6b4ccdac0ef78583cc322_13_0.png)


    > Kevin Mitnick was the first hacker to be on the FBI’s Most Wanted list. In the
    1990s, he spent several years in jail for hacking. Later, he became a white hat
    hacker and started a cybersecurity consulting business.

