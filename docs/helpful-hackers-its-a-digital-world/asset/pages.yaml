  md: '# # CHAPTER 6

    HACKER ATTACK


    Over the past decade, computer hacking has become big business. Since the mid-2000s,
    internet scams and computer viruses have become common. Black hat hackers sell
    their skills to criminals and others who want to harm people.


    One method black hackers use is called phishing. This is a type of scam. The victims
    receive an email or text from a hacker. The hacker pretends to be someone the
    victim trusts, such as an online store or a friend. The hacker claims to need
    personal details, such as passwords or banking information. The hacker uses the
    information for personal gain. Common crimes include stealing from bank accounts
    and identity theft.


    Malware is another way hackers harm people and damage computers. Malware is short
    for malicious software. A virus is a type of malware. A virus is a program that
    changes the way a computer works. It can quickly spread from one computer to another.
    It may erase data and software.'
  merge: -1
