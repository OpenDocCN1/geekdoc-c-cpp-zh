  md: '# CHAPTER 4

    HACKER HISTORY


    **The word hack hasn''t always been associated with computers.** The word has
    been part of the English language for hundreds of years and has many different
    meanings. One meaning is “to cut or chop with uneven or unskillful blows.”


    During the 1960s, *hack* started being associated with computer programming. Students
    at Massachusetts Institute of Technology (MIT) began using computer programming
    in new and creative ways. *Hacking* was used to describe these new methods.


    At the time, modern computers were just starting to be developed. So, these were
    the types of systems people began to hack. This was how scientists and engineers
    came up with new and better ways to use computers.


    During the mid-1900s, hackers were people who had big ideas about what they could
    do with computers. They stretched the capabilities of computer systems. They began
    working on'
