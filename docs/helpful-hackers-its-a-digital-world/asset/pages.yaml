  md: '# CHAPTER 2

    BLACK HATS VS. WHITE HATS


    When hackers are mentioned in the news, the story is usually about unethical hackers
    who have done something wrong. Unethical hackers are also called black hat hackers.
    This is because in old Western movies, the bad guys almost always wore black hats.


    Black hat hackers break into computer systems and software for the purpose of
    harming others. They steal data and damage systems. They might steal money, invade
    people''s privacy, or destroy documents.


    Because of news coverage of hacking crimes, many people think that all hackers
    do. However, most hackers are ethical. They want to make computers more secure.
    Ethical hackers are called white hat hackers because the good guys in Westerns
    usually wore white hats.


    White hat hackers help protect companies from black hat hackers. Companies hire
    white hat hackers to break into systems'
  merge: -1
