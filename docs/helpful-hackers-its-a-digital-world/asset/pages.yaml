  md: '# CHAPTER 3

    STOPPING SECURITY THREATS


    **Hackers can be helpful to all types of companies, big or small.** Any companies
    that use computer **networks** or the internet are at risk for security threats.
    Companies hire white hat hackers to tell them what they need to do to protect
    themselves.


    Large organizations, such as governments, hospitals, banks, and universities have
    thousands of people connecting to their systems. Each of these people has a computer
    and other devices that contain important information. This information could include
    top-secret military activities, ground-breaking research, or credit card details.
    In the wrong hands, this information could be used to hurt people or steal from
    them. White hat hackers help find ways to protect these devices from security
    threats.


    In addition to trying to hack into systems, black hat hackers often use **scams**.
    They contact people through email or websites and pretend to be trustworthy. They
    might say they are from a government agency or a reputable company such as Google.'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'Then they ask for personal or sensitive information, such as credit card or
    Social Security numbers. The hackers could use this information to buy expensive
    products or steal the person''s identity. White hat hackers show people how to
    recognize these scams and avoid giving information to the wrong people.


    > Between 2005 and 2007, a group of hackers stole 45.6 million credit card numbers
    from TJX Companies. TJX owns several retail brands, including T.J. Maxx. The hacker
    group''s leader, Albert Gonzalez, was sentenced to 20 years in prison.


