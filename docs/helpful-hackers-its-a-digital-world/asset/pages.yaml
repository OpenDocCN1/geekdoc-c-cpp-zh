  md: '# CHAPTER 5

    INTENT TO HARM


    **Computers started becoming more widely available in the 1970s and 1980s.** Before
    then, computers were huge and expensive. Only large companies and institutions
    such as universities had computers.


    But improved **technology** was allowing computers to be smaller and less expensive.
    More and more people were buying computers and learning how they worked. But some
    of these programmers started to use their skills to get into other computers for
    their own benefit.


    Some of the earliest systems to be hacked were telephone systems. At the time,
    telephone calls were routed based on specific sounds, or tones. Some people started
    copying tones for long-distance routing so they could make free calls. These hackers
    became known as “phone freaks.”


    One of the most famous phone phaks was computer programmer John Draper. He built
    a device called a blue box.'
