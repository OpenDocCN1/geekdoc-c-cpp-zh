  md: 'One of the most famous clubs was the Legion of Doom (LOD). It was started in
    1984 by a hacker who called himself Lex Luther. The group published journals for
    its members explaining how to hack systems. LOD members frequently hacked into
    systems, especially telecommunications systems. This was mostly to practice their
    skills and show other hackers what they could do. They generally didn''t harm
    the systems they hacked into. In fact, some members were kicked out of LOD for
    causing harm.


    In the 1980s and 1990s, laws were passed to stop hackers from misusing their abilities.
    In May 1990, the US Secret Service launched Operation Sundial. It was a plan to
    try and catch hackers. But hackers can be extremely difficult to track down. They
    can get in and out of computer systems without leaving a trace. Operation Sundial
    turned out to be a failure. Very few hackers were arrested.


    By the 2000s, most people thought of hackers as criminals. Hackers started being
    regularly featured in the news. It seemed no one was safe from attack, not even
    the largest companies or law enforcement agencies. One of the biggest attacks
    in history happened to web service provider Yahoo in August 2013. More than 3
    billion user accounts were hacked.'
  merge: -1
