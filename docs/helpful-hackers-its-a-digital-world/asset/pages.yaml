  md: '# # STRETCHING THE BOUNDARIES OF TECHNOLOGY


    **Have you ever planned a surprise party that you needed to keep secret?** Did
    you save information about it on a computer? Maybe you used a password to keep
    other people from being able to read it. What if someone was able to get into
    your computer and read about the party? They could change the information or they
    could even remove it.


    Hackers find weaknesses in computer systems and **software**. Most hackers try
    to fix problems as they find them. They have jobs in **cybersecurity** or software
    testing. But some hackers use their skills to harm others. They break into computer
    systems to steal or destroy information.


    Hackers stretch the boundaries of **technology** to find new ways to use it. Hackers
    can visualize how to do things differently. Then they find **innovative** ways
    to make their visions come true.'
  merge: -1
  pgno: 8
- img_proc: true
  md: '# CHAPTER 1

    HOW TO BECOME A HACKER


    **Hackers'' jobs are to invent new ways to solve problems and improve processes.**
    Hackers have expert knowledge of computer systems and software and enjoy figuring
    out how they they work. Many hackers like taking things apart and putting them
    back together.


    Hackers look for new ways to use existing systems and software. When computer
    programs don''t do what hackers need them to do, hackers find ways to get the
    job done. They may even write new computer code. Hackers are also good at creating
    new computer programs.


    A college or university degree is not required to be a hacker. Hackers just need
    to know a lot about computers and software. Still, many hackers have degrees in
    computer science, information technology (IT), or network security.


    Some organizations offer special certifications for hackers. Such certifications
    show that hackers have the skills'
  merge: -1
  pgno: 9
- img_proc: true
  md: '![](img/d9ae122cf7a6b4ccdac0ef78583cc322_10_0.png)


    Students at the University of Illinois can apply for the Illinois Cyber Security
    Scholars Program. Graduates of the program have gone on to work for government
    agencies such as Homeland Security and the Central Intelligence Agency.


    and and knowledge they need to do their jobs well. Having a

    **certification** also shows that a hacker is trustworthy.


    Some hackers work as part of a team. The whole team works together to find solutions
    to problems. Other hackers work alone. They work for companies on a project-by-project
    basis.'
