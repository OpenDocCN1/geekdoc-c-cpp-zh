    Black hat hackers send malware through text and email attachments. When opened
    or clicked on, the malware begins to spread throughout the device. In 2017, 360,000
    malware files were detected every day. White hat hackers work to find ways to
    stop malware from spreading.


    There are several main methods for preventing hacks. One defense is a firewall.
    This is a system that keeps unwanted people from connecting to a computer network.
    Firewalls have to be updated often as hackers can eventually find their way around
    them.


    Another defense is anti-malware software. This type of software scans devices
    for threats. The software can also prevent malware from getting into devices.
    And it removes any malware that it finds in the system.


    Firewalls and anti-malware software are often used together to protect computer
    systems. But they are just two ways people can protect themselves from black hat
    hackers. New defenses are being developed all the time.'
