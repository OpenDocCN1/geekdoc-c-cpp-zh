    # Networking in practice


    All of this sounds (and is!) pretty complicated, but fortunately your computer
    will take care of it for you. To send or receive data in your program you just
    create a socket object, which represents the thing you will send/receive data
    on, just like a file object is how you read and write data.


    One difference is that in networking, when you connect to another computer, one
    side (the server) has to wait for the other side (the client) to make a connection.
    Just as a laptop has multiple USB ports devices can plug into,


    a computer has multiple network ports it can connect with. Unlike the physical
    ports, though, a computer has thousands of network ports available.


    In order to make a connection the server program listens on a particular port,
    while the client program connects by giving the same port, and the address of
    the server to connect to. Once a connection is established, both sides can send
    and receive data, rather like writing or reading to a file—instead of write()
    and read(), though, you use send() and recv().


    ```

    ```python

    my_socket = socket()

    my_socket.connect("www.example.com", 5000)

    my_socket.send("testing, testing!")

    received = my_socket.recv()

    print(received)

    ```

