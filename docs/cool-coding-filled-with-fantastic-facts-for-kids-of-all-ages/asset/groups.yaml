    # ## Picture It


    While old computers focused on text on a screen, computers nowadays can produce
    astonishing graphics – just about every animated movie and TV show, whether it''s
    in 2D or 3D, is now produced primarily on computers.


    If you want to produce graphics in your program you''ll need a graphics library.
    Some languages have a built-in library, or you can download a wide array of other
    libraries for each language. If there is a built-in library these are usually
    the best way to get started; they may not be the most powerful or specialised,
    but they''re usually straightforward to use and there will be lots of help online.


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_69_0.png)


    # ### Two dimensions


    A 2D graphics library will let you draw shapes (not just triangles, circles and
    rectangles, but more complex shapes like polygons) and choose their colour and
    outline.


    It will also let you add text and pictures that you''ve downloaded from the internet.


    To make graphics that move, your program will need to draw lots and lots of individual
    frames of animation, quickly enough that the human eye can''t distinguish the
    individual drawings. Your graphics library should have a range of functions to
    make this much easier than coding each frame by hand.'
