    ## Cloudy Weather


    The most important trend in computing in recent years has been devices being constantly
    connected to the internet. Until recently, computer users would only go online
    when they needed to download something, or look something up. But now, thanks
    to smartphones and the growth of wireless availability, a lot of computers are
    online all the time.


    > **That’s neat!**

    >

    > The internet was born from a research project in the 1970s between American
    universities, which created a network of computers named ARPANET. ARPANET was
    designed to survive a nuclear attack: it had no central point of control, which
    is why even today the internet is decentralized, with no person or country in
    charge of it. In 1989 a British computer scientist named Tim Berners-Lee created
    the first web page of the World Wide Web, which is how we use the internet.


    ### What is the cloud?


    Devices that are always online can use a new technique: cloud computing. This
    essentially means that tasks a computer would once handle locally, such as storing
    files and performing computation, can now be offloaded to computers on the internet.
    Because it doesn’t matter where in the world these computers are, they’re said
    to be a “cloud”.


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_87_0.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_87_1.png)


