    # # Coding Tools


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_43_0.png)


    In the end program code is just text, so you can write it in any text editor you
    like. However, over the years, developers have come up with a range of tools to
    make writing code easier.


    # ## A smarter text editor


    Some text editors are designed for writing code. One very useful trick they have
    is to change the text colour to separate out variables, statements and other things.
    They''ll also make strings stand out, which is very handy when you forget the
    closing quote on a string and it ends up going on forever ...


    These editors need to understand the programming language you''re using to do
    these tricks; most will support many common languages. Some can detect it automatically
    from what you write or from the extension of the filename (py for Python, for
    example); others will have an option in the menu to set it.


    These little tweaks may not sound like much but actually they make reading and
    writing code far easier – once you''ve tried it you''ll never go back to a boring
    old black-and-white editor!


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_43_1.png)'
  - '[PAGE 44]


    # IDEs


    An IDE, or integrated development environment, looks like a text editor on the
    surface but is much more powerful. As well as smart colour coding an IDE will
    have a play button to build and run your program directly, and will often be able
    to find and organise all your functions. They may even have more complex tools
    like debuggers built into them. IDEs are much more complex than a text editor
    and are not as straightforward to set up and start using. They also need to be
    configured for each language you are using, and some may only support one particular
    programming language. While just about every programmer uses a smart text editor
    of some kind, not all use an IDE; you should start out with a text editor and
    then try an IDE later to see how useful you find it.


    # Coding in your browser


    These days the internet has sites that will let you write, run and experiment
    with code for a number of different languages right in your browser. This is a
    fantastic way to jump straight in and start writing some simple programs without
    needing to install anything on your computer.


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_44_0.png)


