    ![](img/862cb7d96d05319b069165a3aaaaa9d3_91_0.png)


    Smartphones and tablets have also provided another great way for individuals to
    develop games; they lend themselves well to small, simple games that a single
    person or small team can develop. Their app stores make it easy to distribute
    games, and for people to potentially even make some money from games they develop
    as a hobby.


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_92_0.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_92_1.png)


    ### Game engine-ering


    The tools that have made these indie games possible are called game engines. These
