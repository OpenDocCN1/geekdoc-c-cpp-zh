    ## Welcome to Cool Coding


    I learned to program in an old bomb shelter. The school had built it during the
    Second World War, but by the time I arrived it had been turned into the Computer
    Club. We all wanted to play games on the computers, so I got my first taste of
    programming copying code from computing magazines line by line. At first I didn’t
    know how the programs I was copying worked, but then I began to experiment and
    to write my own. Soon I was hooked.


    Coding is logical, like a puzzle, but one with lots of possible solutions so you
    never get too stuck. Coding is creative: you can make games and tools and apps
    that you can share with friends and family. Coding doesn’t need lots of equipment,
    doesn’t make a mess, and can be something you do on a rainy day, or before it’s
    time to go to bed. Boys and girls, young kids and retirees, people all over the
    world write code and share it with one another.


    I still love coding today. It’s my job now, and it’s still my hobby, and with
    this book I hope I can get you excited about it too. Not only will the book teach
    you about the fundamental concepts of programming, but it’ll tell you about useful
    tools and techniques, about how computers were used in the past and what they’ll
    be able to do in the future, and it’ll hopefully inspire you to go and write some
    code of your own!


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_10_0.png)


    > ‘Everybody in this country should learn to program a computer…because it teaches
    you how to think.’


    **Steve Jobs**


    ```

    my_first_array =

    [1, 3, 5]

    my_second_array =

    [2, 5, 6, 8] >> 2

    ```


    ## What Is a Program?


    A computer that doesn’t know what to do is just a very expensive paperweight.
    A program is what makes the computer play games, make music and draw images. A
    program tells the computer what to do.


    ### Following instructions


    A program is like the list of instructions for assembling a heap of plastic toy
    bricks into a castle: a set of individual directives for the computer to carry
    out. Each individual instruction is only a very small step, like connecting two
    bricks together, but by the time the program is complete amazing things can be
    accomplished.


    Just like a list of instructions, a program is read from top to bottom. Each line
    in the program is a statement, giving the computer an action to carry out. When
    that action is complete the computer will go on to the next line in the program,
    and so on until it reaches the end, when it will stop. A computer won’t get bored
    or lose its place: It’ll keep following the program no matter how long it takes
    (though computers carry out instructions really quickly!).


    ### Our first program


    Computer programs are also called code, and a person who writes a computer program
    is called a coder or a programmer. That can be a person’s job, but lots of people
    write programs for fun, including kids! Once you’ve written a program you can
    tell the computer to run it; that means the computer will follow the instructions
    and carry out the actions.


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_11_0.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_11_1.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_11_2.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_11_3.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_12_0.png)


    Let’s see a program now:


    ```python

    print("I just started my first program!")

    print("I just finished my first program!")

    ```


    The print instruction tells the computer to print out the line of text to the
    screen. When the code above is run the computer will first print out:


    *I just started my first program!*


    ... and then:


    *I just finished my first program!*


    ... as the computer follows the instruction on the first line and then the second.
    — just like that — you’ve written a program!


    > **That’s neat!**

    >

    > You can try out most of the coding examples in this book at the website jsfiddle.net
    (see page 108), but you will need to change the print command to alert to make
    them work.


    ### Let’s get started!


    Just as people all over the world speak lots of different human languages, there
    are lots of different programming languages computer programs can be written in.
    Some languages are better for certain types of program than others, and some are
    more complicated than others. But no matter the language, the building blocks
    of all computer languages are the same.


    This book will tell you all about coding, so when you try it for yourself you’ll
    understand those building blocks, no matter what language you choose!


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_12_1.png)


