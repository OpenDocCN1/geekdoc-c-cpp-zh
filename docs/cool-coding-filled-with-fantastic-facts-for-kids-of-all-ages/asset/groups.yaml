    them to play games! Pong, a black-and-white tennis game that involved two white
    rectangles for rackets and a square for the ball, came out in 1972 as a coin-operated
    arcade game, and by 1974 was available for home users.


    These days the biggest video games, called AAA or triple-A games, require teams
    of hundreds of programmers, artists and testers to work for years, and can cost
    more than £100 million to develop. They feature cutting-edge 3D graphics and often
    push computers to the very limit of their capabilities.


    # ## Indie gaming


    However, these aren''t the only games out there. Recent advances in the tools
    available to coders has led to an explosion of indie games, produced by single
    programmers or small teams, often working in their spare time. The ease with which
    these games can be developed means that coders can experiment with gameplay and
    create amazing new types of game. Minecraft, perhaps the biggest computer game
    in the world, was created by a single programmer as a hobby project!


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_91_0.png)'
