    ## 多云天气


    近年来计算领域最重要的趋势是设备始终连接互联网。直到最近，计算机用户只在需要下载东西或查找资料时才上网。但现在，得益于智能手机和无线网络可用性的增长，许多计算机始终在线。


    > **真妙！**

    >

    > 互联网诞生于 20 世纪 70 年代美国多所大学之间的一个研究项目，该项目创建了一个名为 ARPANET 的计算机网络。ARPANET 的设计目标是能在核攻击中幸存：它没有中央控制点，这也是为什么即使在今天，互联网仍是去中心化的，没有任何个人或国家掌管它。1989
    年，一位名叫蒂姆·伯纳斯-李的英国计算机科学家创建了万维网的第一个网页，这就是我们使用互联网的方式。


    ### 什么是云？


    始终在线的设备可以使用一种新技术：云计算。这本质上意味着，计算机过去在本地处理的任务，例如存储文件和执行计算，现在可以卸载到互联网上的计算机。因为这些计算机位于世界何处并不重要，所以它们被称为“云”。


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_87_0.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_87_1.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_87_2.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_87_3.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_87_4.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_87_5.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_87_6.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_87_7.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_87_8.png)


    ## 排队等候


    我们已经探讨过数组，它是一种将数据存储在内存块中的方式，其中每个单独的数据项都可以随时访问。不过，并非所有数据都适合以这种方式存储。


    ### 链接起来


    另一种存储数据的方式是链表。在这里，不是像数组那样把所有数据存储在一个大内存块中，而是每个数据项单独存储，并包含指向列表中下一个元素的链接，就像链条中的环节。因此，项
    A 有指向项 B 的链接，项 B 有指向项 C 的链接。单向链表只有这个方向上的链接，而双向链表则有两个方向上的链接（C 链接回 B，B 链接回 A）。


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_89_0.png)


    为了从链表中访问某一项，你需要遍历列表，沿着链条中的链接前进。这比数组慢，因为数组中的任何中间项都可以通过一次操作到达。但从列表中添加和移除链接很容易，而数组——由于它们是单个内存块——更难缩小或扩大。


    ### 队列与堆栈


    数组和链表用于实现计算机内部依赖的某些类型的存储：队列和堆栈。这些数据存储中，你不能随意访问任何元素，而只能根据元素放入的顺序一次读取一个元素。


    队列按 FIFO（先进先出）方式运作。因此，如果你先向队列添加 A，再添加 B，那么从队列读取时，你会先得到 A，再得到 B。相比之下，堆栈按 LIFO（后进先出）方式运作。在这里，如果你先向堆栈添加
    A，再添加 B，那么从堆栈读取时，你会先得到 B，再得到 A，就像把东西放到一叠纸上再取下来一样。


    > 后进先出。

    >

    > 别推它！

    >

    > 真妙！把一项放入堆栈称为压入（push），而取出一项称为弹出（pop）！


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_90_0.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_90_1.png)


    ## 玩游戏


    自第一台计算机诞生以来，程序员们一直在研究如何用计算机玩游戏！Pong 是一款黑白网球游戏，用两个白色矩形作为球拍，用一个方块作为球；它于 1972 年作为投币式街机游戏推出，到
    1974 年已可供家庭用户使用。


    如今，最大的电子游戏被称为 AAA 或 3A 游戏，需要数百名程序员、美术师和测试人员组成的团队工作数年，开发成本可能超过 1 亿英镑。它们采用前沿的 3D
    图形，常常把计算机的性能推向极限。


    ### 独立游戏


    然而，这些并不是市面上的全部游戏。近年来，编码者可用工具的进步促成了独立游戏的爆发式增长；这些游戏由单个程序员或小团队制作，通常是在业余时间完成的。这些游戏开发起来很容易，这意味着编码者可以试验玩法，创造出令人惊叹的新游戏类型。《我的世界》（Minecraft）也许是世界上最大的计算机游戏，但它最初只是一个程序员作为业余项目创造出来的！


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_91_0.png)


    智能手机和平板电脑也为个人开发游戏提供了另一种绝佳方式；它们非常适合由一个人或小团队开发的小型、简单游戏。它们的应用商店让游戏分发变得容易，也让人们有可能从自己作为爱好开发的游戏中赚到一些钱。


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_92_0.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_92_1.png)


    ### 游戏引擎工程


    让这些独立游戏成为可能的工具被称为游戏引擎。这些系统自带处理 2D 和 3D 图形、网络、声音、文件 IO 以及创建游戏所需的其他一切功能。它们还附带 3D
    模型、音乐等可在游戏中使用的资源。你也可以从互联网下载额外资源，有些免费，有些则需要付费。


    要制作游戏，你还需要编写自己的代码，告诉引擎在每种情况下该做什么。每个引擎都有不同的命令，并支持不同的编程语言——有些非常容易使用，有些则更复杂、更强大。有些用于为
    PC 开发游戏，有些用于网页，还有些用于智能手机。


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_92_2.png)


    ## 为互联网编程


    创建网站是开始学习计算的绝佳方式——谁不想拥有自己的网站呢？网上有大量帮助，而且你不需要在 PC 上安装任何额外软件——只要你有网页浏览器和文本编辑器，就可以开始了！


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_93_0.png)


    网页用一种称为 HTML 的语法编写。它们包含页面上要显示的文字，以及你想包含的图片地址、链接和任何其他内容。你还可以直接在文件中包含格式设置（颜色、大小、对齐方式以及精确描述内容外观的其他一切），或者放在单独的
    CSS（层叠样式表）文件中。


    ### 动起来


    如果你想让网页真正活起来，可以直接把计算机代码嵌入页面！浏览器支持 JavaScript，你可以直接把它写入 HTML 文件，或作为单独的 .js 文件包含。这样，每当有人加载你的网页时，你的代码就会在他们的浏览器中运行。


    你编写的代码将由回调触发。浏览器提供了许多你可以使用的回调，因此你可以编写在以下情况下运行的代码……


    - 页面加载时

    - 有人按下按钮时

    - 有人在文本框中输入时


    ……以及许多其他方式。


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_93_1.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_93_2.png)


    然后你的代码可以对网页做出更改。这可以是从调整一些文字大小到彻底改变整个页面的任何事情！在 JavaScript 代码中，网页由 DOM（文档对象模型）表示——就像套接字或文件对象一样，这是网页在你的代码中的表示。你对
    DOM 所做的任何操作都会显示在页面上。


    出于安全原因，有些操作你不能在浏览器中完成。不过，它是一种强大而灵活的语言，而且最近一项名为 HTML5 的网页更新增加了更多能力，例如 canvas 元素，你可以用它把动态绘图和动画直接放进网页。


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_94_0.png)


    从现在起，每当你浏览网页并注意到某个页面做出了特别酷的效果时，请意识到这是某人编写的 JavaScript 在实现它。想一想它是如何做到的，也许看看你能否自己弄明白该怎么做！


