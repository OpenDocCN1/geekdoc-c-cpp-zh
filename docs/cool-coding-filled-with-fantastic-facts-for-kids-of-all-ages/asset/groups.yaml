    \ `return`. When the program reaches a `return` statement it immediately exits\
    \ the function and jumps back to the line it was called from without executing\
    \ the rest of the function code. If you just put `return` it will jump back on\
    \ its own. If you put `return` and then a variable or value it will return with\
    \ that value. If the code reaches the end of the function without hitting a `return`\
    \ statement it will return without any value.\n\n```python\nfunction calculate_square(my_var)\n\
    {\n  result = my_var*my_var\n  return result\n}\n\nvar = calculate_square(3)\n\
    var = calculate_square(var)\nprint(var)\n>> 81\n```\n\n- defining a function with\
    \ one argument\n- return the 'result' variable\n- call the function passing in\
    \ '3' as the argument\n- call it again on the result\n\n## Coding Tools\n\n![](img/862cb7d96d05319b069165a3aaaaa9d3_43_0.png)\n\
    \nIn the end program code is just text, so you can write it in any text editor\
    \ you like. However, over the years, developers have come up with a range of tools\
    \ to make writing code easier.\n\n### A smarter text editor\n\nSome text editors\
    \ are designed for writing code. One very useful trick they have is to change\
    \ the text colour to separate out variables, statements and other things. They'll\
    \ also make strings stand out, which is very handy when you forget the closing\
    \ quote on a string and it ends up going on forever ...\n\nThese editors need\
    \ to understand the programming language you're using to do these tricks; most\
    \ will support many common languages. Some can detect it automatically from what\
    \ you write or from the extension of the filename (py for Python, for example);\
    \ others will have an option in the menu to set it.\n\nThese little tweaks may\
    \ not sound like much but actually they make reading and writing code far easier\
    \ – once you've tried it you'll never go back to a boring old black-and-white\
    \ editor!\n\n![](img/862cb7d96d05319b069165a3aaaaa9d3_43_1.png)\n\n### IDEs\n\n\
    An IDE, or integrated development environment, looks like a text editor on the\
    \ surface but is much more powerful. As well as smart colour coding an IDE will\
    \ have a play button to build and run your program directly, and will often be\
    \ able to find and organise all your functions. They may even have more complex\
    \ tools like debuggers built into them. IDEs are much more complex than a text\
    \ editor and are not as straightforward to set up and start using. They also need\
    \ to be configured for each language you are using, and some may only support\
    \ one particular programming language. While just about every programmer uses\
    \ a smart text editor of some kind, not all use an IDE; you should start out with\
    \ a text editor and then try an IDE later to see how useful you find it.\n\n###\
    \ Coding in your browser\n\nThese days the internet has sites that will let you\
    \ write, run and experiment with code for a number of different languages right\
    \ in your browser. This is a fantastic way to jump straight in and start writing\
    \ some simple programs without needing to install anything on your computer.\n\
    \n![](img/862cb7d96d05319b069165a3aaaaa9d3_44_0.png)\n\n![](img/862cb7d96d05319b069165a3aaaaa9d3_44_1.png)\n"
  mdcn: "\n## 访问数据\n\n要访问特定元素，我们再次使用方括号，其中包含我们想要的元素的索引。因此 `x[0]` 表示名为 `x` 的数组中的第一个元素。如果只写\
    \ `x` 而不带方括号，我们指的就是整个数组。\n\n```\nmy_second_array = [2, 5, 6, 8]\nprint(my_second_array[0])\n\
    >> 2\n```\n\n> 现在只需打印出第一个元素——记住，数组索引从 0 开始！\n\n> 让我们修改第二个值（即索引为 1）。\n\n```\nmy_second_array[1]\
    \ = 3\nprint(my_second_array)\n>> [2, 3, 6, 8]\n```\n\n> 现在，让我们打印整个数组！\n\n你可以用数组做很多巧妙的事情，比如查看它有多少个元素、重新排列顺序、向其中添加元素或从中取出元素。如果你确实取出一个元素，那么它后面的所有元素都会向前移动，就像从一列火车中间取下一节车厢。\n\
    \n![](img/862cb7d96d05319b069165a3aaaaa9d3_38_0.png)\n\n![](img/862cb7d96d05319b069165a3aaaaa9d3_39_0.png)\n\
    \n## 世界上第一位计算机程序员\n\n![](img/862cb7d96d05319b069165a3aaaaa9d3_39_1.png)\n\n来认识一下艾达。艾达·洛夫莱斯生于\
    \ 1815 年，是世界上第一位计算机程序员。这已经足够令人惊叹，但她生活的时代，人们并不期望女性去处理比刺绣复杂得多的事情。更了不起的是，她做这一切比任何人真正造出计算机早了一个世纪……\n\
    \n作为著名（且声名狼藉）的诗人拜伦勋爵的女儿，艾达被教导数学和科学，试图让她不要重蹈父亲行为不端的覆辙，而她爱上了这些学科。17 岁时，她遇到了一个将改变她一生的男人：查尔斯·巴贝奇。\n\
    \n![](img/862cb7d96d05319b069165a3aaaaa9d3_39_2.png)\n\n### 差分机\n\n巴贝奇是一名工程师、天文学家和发明家。在当时，当天文学家意味着要做大量算术，巴贝奇想造一台机器替他完成这些计算：机器永远不会厌倦，也不会犯错。\n\
    \n不过，那是 19 世纪 20 年代。没有计算机芯片，没有晶体管，甚至没有电。但这并没有阻止巴贝奇。他的机器将仅由齿轮、传动装置和其他机械结构组成。他将其命名为差分机。\n\
    \n巴贝奇在这个项目上花费了 20 年和巨额政府资金，但当时的技术根本不足以应对这一挑战，他始终未能让这台机器运转起来。\n\n当艾达遇到查尔斯时，他向她讲述了自己的一个新想法。那是一台更复杂的机器——分析机，它可以进行任何类型的计算。这是人类第一次想到计算机。艾达被整个构想迷住了，并帮助巴贝奇弄清楚它如何运作。由此，她成为有史以来第一个想出如何为计算机编程的人。分析机也从未被制造出来，但这并没有阻止艾达弄清楚如何使用它。当巴贝奇仍在考虑进行简单数学运算时，她已经预见到有一天计算机会做出惊人的事情，甚至创作音乐！\n\
    \n### 真棒！\n\n艾达从未见过真正的计算机，但现代工程师以她的名字命名了一种编程语言——Ada。\n\n### 分析机\n\n![](img/862cb7d96d05319b069165a3aaaaa9d3_40_0.png)\n\
    \n## 让功能发挥作用\n\n到目前为止，你看到的所有程序示例都是按顺序执行的一组指令。然而，除了最简单的程序之外，所有程序都依赖函数：拆分出来的代码块，可以从程序的其他位置调用。函数让你能够以可管理的块来编写代码，并且当你在不同位置需要做同样的事情时，可以避免复制/粘贴代码。\n\
    \n![](img/862cb7d96d05319b069165a3aaaaa9d3_41_0.png)\n\n### 进入函数\n\n函数定义通常以一个关键字开头，这个关键字因编程语言而异，例如\
    \ *function* 或 *def*。然后你的函数需要一个唯一的名称（和变量一样，名称不能包含任何空格）。名称之后是一组括号，其中可以包含若干参数。这些是传入函数的变量，你随后可以在函数内部使用它们。最后，你加上一些花括号。它们定义了作为函数一部分运行的代码块。\n\
    \n你可以在代码中的任何位置调用函数：写出函数名，后面跟一对括号，括号中包含与函数定义中相同数量的变量。你会注意到这看起来像是在调用 *print* 语句。这是因为\
    \ print 是由语言本身定义的函数，其工作方式与你能够定义的函数一样。\n\n> 在参数中或代码块内声明的变量作用域限于该块：它们在该块之外不存在。这意味着你不必担心重用变量名；只要不在同一个块内重用它们就没问题。\n\
    \n### 退出函数\n\n你的代码块可以包含任何你喜欢的代码，外加一条新的特殊语句：`return`。当程序到达 `return` 语句时，它会立即退出函数，并跳回调用它的那一行，而不执行函数的其余代码。如果你只写\
    \ `return`，它会自行跳回。如果你写 `return`，然后跟一个变量或值，它就会带着该值返回。如果代码到达函数末尾仍未遇到 `return` 语句，它将不带任何值返回。\n\
    \n```python\nfunction calculate_square(my_var)\n{\n  result = my_var*my_var\n\
    \  return result\n}\n\nvar = calculate_square(3)\nvar = calculate_square(var)\n\
    print(var)\n>> 81\n```\n\n- 定义一个带一个参数的函数\n- 返回 'result' 变量\n- 调用该函数，并传入 '3' 作为参数\n\
    - 对结果再次调用该函数\n\n## 编程工具\n\n![](img/862cb7d96d05319b069165a3aaaaa9d3_43_0.png)\n\
    \n最终，程序代码只是文本，所以你可以用任何你喜欢的文本编辑器来编写它。然而，多年来，开发者们提出了一系列工具，让编写代码更容易。\n\n### 更智能的文本编辑器\n\
    \n有些文本编辑器是为编写代码而设计的。它们有一个非常有用的技巧：改变文本颜色，以区分变量、语句和其他内容。它们还会让字符串突出显示，当你忘记字符串的结束引号，导致它一直延续下去时，这非常方便……\n\
    \n这些编辑器需要理解你正在使用的编程语言才能实现这些技巧；大多数编辑器支持许多常见语言。有些可以根据你写的内容或文件扩展名自动检测（例如，py 表示 Python）；另一些则在菜单中提供选项来设置。\n\
    \n这些小小的调整听起来可能没什么了不起，但实际上它们让阅读和编写代码容易得多——一旦你试过，就再也不会回到无聊的旧式黑白编辑器了！\n\n![](img/862cb7d96d05319b069165a3aaaaa9d3_43_1.png)\n\
    \n### IDE\n\nIDE，即集成开发环境，表面上看起来像文本编辑器，但功能强大得多。除了智能颜色编码外，IDE 还会有一个播放按钮，用于直接构建和运行程序，并且通常能够查找和组织你所有的函数。它们甚至可能内置调试器等更复杂的工具。IDE\
    \ 比文本编辑器复杂得多，设置和开始使用也不那么简单。它们还需要针对你使用的每种语言进行配置，有些可能只支持一种特定的编程语言。虽然几乎每个程序员都会使用某种智能文本编辑器，但并非所有人都使用\
    \ IDE；你应该从文本编辑器开始，之后再尝试 IDE，看看你觉得它有多大用处。\n\n### 在浏览器中编程\n\n如今，互联网上有一些网站让你可以直接在浏览器中编写、运行和试验多种不同语言的代码。这是一种极好的方式，可以立即上手并开始编写一些简单程序，而无需在计算机上安装任何东西。\n\
    \n![](img/862cb7d96d05319b069165a3aaaaa9d3_44_0.png)\n\n![](img/862cb7d96d05319b069165a3aaaaa9d3_44_1.png)\n\
    \n"
