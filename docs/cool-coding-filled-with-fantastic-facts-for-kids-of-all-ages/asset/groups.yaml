  mdcn: "\n## 处理错误\n\n有些错误，计算机在你尝试运行程序时就会告诉你。例如，语法错误是指把 `==` 写成 `=` 之类的错误。计算机不理解那是什么意思，会给你一条错误信息，告诉你出了什么问题以及在哪里出错。即使你不理解错误信息，也去看看那行代码，往往能立刻发现问题。\n\
    \n另一种错误是运行时错误。这时计算机理解你的语法，但运行到某条无法执行的指令，比如试图将数字除以 0。此时程序会崩溃并打印错误信息。\n\n## 追踪错误\n\
    \n最糟糕的错误是程序运行了，但行为出乎意料！这种情况下，你得通读代码，弄清楚它为什么表现不正常。一个技巧是添加一些 print() 命令，在程序的不同位置打印重要变量的值。这样你就能追踪到变量不再具有预期值的位置。有些工具叫调试器，可以自动完成这类工作，不过配置起来可能很棘手。\n\
    \n![](img/862cb7d96d05319b069165a3aaaaa9d3_20_0.png)\n\n> **这很巧妙！**\n>\n> 有时你无法弄清楚错误。如果没有人可以问，最好的做法是把错误信息中的错误类型复制到搜索栏中。你几乎总能找到许多网页解释它的含义。专业程序员遇到卡壳时也总是这么做！\n\
    \n## 讲逻辑\n\n![](img/862cb7d96d05319b069165a3aaaaa9d3_21_0.png)\n\n逻辑不只是夏洛克·福尔摩斯才思考的东西；你的计算机也关心逻辑。\n\
    \n### 用逻辑运算\n\n逻辑有自己的变量类型。除了数字和字符串，还有布尔值。布尔值只有两种可能取值：真或假。布尔值是最简单的变量类型。\n\n有趣之处在于把布尔值组合起来创建新的布尔值。布尔值不用加、除或减，而有自己的运算符，称为逻辑运算符：AND、OR\
    \ 和 NOT。\n\nNOT（它们总是大写书写）最简单：如果 b 等于 NOT a，那么当 a 为真时 b 为假，反之亦然。AND 和 OR 用于组合多个变量。如果\
    \ c 等于 a OR b，那么只要 a 或 b 中有一个为真（或两者都为真），c 就为真。如果 c 等于 a AND b，那么只有当 a 和 b 都为真时，c\
    \ 才为真。\n\n用真值表来理解这一切要容易得多，真值表说明了对于所有可能的输入，结果是真还是假：\n\n**NOT——b 等于 NOT a**\n\n\
    | a | b |\n|---|---|\n| 真 | 假 |\n| 假 | 真 |\n\n**OR——c 等于 a OR b**\n\n| a | b |\
    \ c |\n|---|---|---|\n| 假 | 假 | 假 |\n| 真 | 假 | 真 |\n| 假 | 真 | 真 |\n| 真 | 真 | 真\
    \ |\n\n**AND——c 等于 a AND b**\n\n| a | b | c |\n|---|---|---|\n| 假 | 假 | 假 |\n\
    | 真 | 假 | 假 |\n| 假 | 真 | 假 |\n| 真 | 真 | 真 |\n\n在代码中书写时，这些运算符使用符号而不是名称。NOT 是 `!`，OR\
    \ 是 `||`，而 AND 是 `&&`。\n\n## 把编程当爱好\n\n编程不只是人们工作时做的事。在业余时间编程的人比以编程为生的人多得多。他们编程是为了好玩、为了学习、为了给朋友或家人制作有用的网站，或者为了制作游戏供他人娱乐。有了互联网和智能手机，人们与全世界分享代码从未如此容易。\n\
    \n许多人一开始把学习编程当作爱好，但最终因为足够喜欢而决定把它变成兼职甚至全职工作。事实上，几乎每个专业程序员的大部分编程知识都是在自己时间里学会的。应用和网站开发是人们兼职赚些钱的好方式，也能让他们看看自己是否喜欢职业编程，而不只是当作消遣。\n\
    \n![](img/862cb7d96d05319b069165a3aaaaa9d3_24_0.png)\n\n## 开始编程\n\n学习编程也从未如此容易。市面上有许多关于编程的精彩书籍（比如这本！），但你也可以在网上找到入门所需的一切。第\
    \ 44 页和第 74 页将带你开始编写代码，第 108 页有许多网站链接，会引导你进入更精彩、更复杂的项目。\n\n![](img/862cb7d96d05319b069165a3aaaaa9d3_26_0.png)\n\
    \n## 读取输入\n\n正如可以让程序输出文本，也可以让程序读取文本输入！程序如何从键盘读取，具体方式因语言而异：可以一次读取单个字符（按键），也可以读取整个字符串，直到用户按下回车。完成读取后，就可以把该输入存储到变量中。\n\
    \n如果希望用户输入数字，还多一步。你看，对计算机来说，字符串“12”与数字 12 不同；前者就像“elephant”或“football”一样是字符串，而不是它理解的数字。要把字符串转换为数字，需要告诉程序进行转换：像\
    \ int(\"12\") 这样的函数会把它转换为整数 12，而 float(\"12\") 会把它转换为浮点数 12.0。\n\n## 打孔输入\n\n\
    在如今这个触摸屏时代，键盘似乎是一种笨拙的编程方式，但在过去，程序是用一种远不方便的格式存储并输入计算机的：打孔卡。\n\n它们是真实的实体卡片，上面打有一系列孔洞。计算机通过向卡片照射光线，并用光传感器判断某个孔是否被打出，从而读取卡片，把卡片转换成\
    \ 1 和 0。\n\n### 卡片与计算机\n\n打孔卡实际上比计算机本身出现得还早。它们最早在19世纪初被用于控制把图案织入布料的机械织布机：卡片上保存着要编织的图案。当时还没有光传感器，因此卡片由沿其表面移动的机械传感器读取。卡片必须非常厚实坚韧，才能经受住这种读取方式！\n\
    \n19世纪和20世纪初的机械计算机器使用打孔卡存储数据和程序。第一台计算机 Colossus 从打有孔洞的纸带上读取它正在处理的消息。\n\n### 用打孔卡工作\n\
    \n在20世纪50年代和60年代，程序员会先在纸上设计出想要运行的程序，然后用打孔机（一种类似打字机的设备，会在所有正确位置打出孔洞）把它打成一叠卡片。只要打错一个孔，整张卡片就得扔掉。一个复杂的程序可能需要数百甚至数千张卡片，并按精确顺序排列——谁要是碰倒其中一叠，可就倒霉了！\n\
    \n随着计算机数量增多、功能增强，对打孔卡的需求也随之上升——到1967年，仅美国每年就要用掉20亿张打孔卡！但更复杂的程序所需的卡片堆越来越高，也越来越不实用；到20世纪70年代，一项新技术——磁带——开始取代打孔卡，成为向计算机输入数据的方式。在如今这个闪存盘和\
    \ Wi-Fi 的时代，想到人们过去竟要依靠成叠的卡片向计算机传递数据，真是令人惊叹！\n\n![](img/862cb7d96d05319b069165a3aaaaa9d3_28_0.png)\n\
    \n## else 和 if\n\n除了 if 和 else，还有第三种条件语句：else if（在某些编程语言中）。这是另一个 if 语句，只有当它上面的检查结果为假时才会运行；和\
    \ if 一样，它需要一个条件。\n\n```python\nif (my_val == 3):\n    print(\"You entered exactly\
    \ three\")\nelse if (my_val < 3):\n    print(\"Your number was less than three\"\
    )\nelse:\n    print(\"To get here, your number must be more than three\")\n  \
    \  print(\"Remember, you can have as much code as you like inside a block!\")\n\
    ```\n\n![](img/862cb7d96d05319b069165a3aaaaa9d3_30_0.png)\n\n如果你愿意，可以连续写很多个 else\
    \ if 语句。代码会像瀑布一样沿着这组条件语句逐级向下，直到找到一个为真的条件，此时就会运行该代码块中的代码。\n\n![](img/862cb7d96d05319b069165a3aaaaa9d3_30_1.png)\n\
    \n> **这很巧妙！**\n>\n> 你可以在条件语句后面的代码块中放入任何代码，包括更多 if 语句！像这样在 if 语句中再放 if 语句，称为嵌套。\n\
    \n"
