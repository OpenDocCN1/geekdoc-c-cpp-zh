    # # Inheritance


    As we''ve just seen, classes are a great way to store and reuse functions and
    variables associated with something. Even better, though, another feature of classes
    lets you minimise the need to rewrite code and keep things logical: inheritance.


    # ### Meet the children


    Inheritance, or subtyping, is when you define new child classes (or subclasses)
    that inherit from a parent class (or superclass). These child classes still retain
    all of the functions and variables of their parent class, but can also have their
    own variables and functions specific to them.


    For instance, once you have defined a `dog()` class you could define child classes
    for specific breeds of dog. Anything that is common to all dogs goes into the
    parent `dog()` class, while anything specific to the breed goes into the individual
    child classes. Each child class is its own breed of dog with its own characteristics
    (colour, etc.), but also has all the properties of the parent class, which are
    common to all dogs (having four feet, etc.).


