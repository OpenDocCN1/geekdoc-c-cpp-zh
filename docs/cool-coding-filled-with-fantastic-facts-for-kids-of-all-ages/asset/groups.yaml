    \ from the menu on the left and join them to other segments to make a program.\
    \ Try joining a few together now – you need to line up the little notches. You\
    \ can pull them apart too, and drag them off the screen to discard them. Different\
    \ pieces of code are available from different menus on the left – take a look\
    \ at what’s available.\n\nAll programs start with code from the *events* section\
    \ – you can tell these because the segments have a lump on top so nothing can\
    \ go above them. Pick the one that has a flag on it. Connect segments under that,\
    \ and then hit the flag button in the top left to run your program.\n\n![](img/862cb7d96d05319b069165a3aaaaa9d3_47_2.png)\n\
    \n### Blasting off\n\nOK, let’s code! To start with, create a program that counts\
    \ down from 10 to 1 then says ‘Blast off!’, just like the mission controller for\
    \ a rocket. Here are a few hints to get you started:\n\n- You’re doing something\
    \ (counting down) lots of times, so you need a loop.\n- You also need a variable,\
    \ to keep track of what number you’re on.\n- You’ll need to print out the variable,\
    \ then decrease it next time around the loop so you count down.\n\n![](img/862cb7d96d05319b069165a3aaaaa9d3_48_0.png)\n\
    \nYou can also look back at the example on page 43. However, this is in a different\
    \ language, so you won’t be able to copy it precisely! This shows how different\
    \ languages do the same thing in slightly different ways. If you get really stuck,\
    \ check out the answer at the bottom of this page. Once you manage that, why not\
    \ try making the character actually blast off into space once the countdown completes?\
    \ **Hint** You’ll need another loop, a move command and a wait command.\n\n###\
    \ Answers\n\n- Create a program that says ‘Blast off!’\n- Make a variable named\
    \ countdown\n- Set countdown to 10\n- Then, inside the loop:\n  - Print the variable\n\
    \  - Change the value of countdown by -1\n  - Pause for 1 second.\n\n## Bits and\
    \ Bytes\n\nIf you were to take a very powerful microscope and examine the CPU\
    \ of a computer, you wouldn't find numbers or words or any of the other values\
    \ we move around in programs. Instead you would find millions of transistors.\
    \ A transistor is really just an incredibly tiny on/off switch. When the transistor\
    \ is on we give it the number 1, and when it is off we give it the number 0. In\
    \ the end everything in a computer, no matter how complicated, comes down to 1s\
    \ and 0s.\n\nWe call each of these values a single bit (short for binary digit).\
    \ Each bit can be set to 1 or 0. It's the computer equivalent of an atom: deep\
    \ down, everything in a computer is made of bits.\n\n### A bit more information\n\
    \nRather than work with bits directly though, early computer systems collected\
    \ them into groups of 8, which was the smallest number of bits that could be read\
    \ or written at a time. One of these groups of 8 bits is called a byte, and has\
    \ room to store a single character (like 'a' or '+').\n\n![](img/862cb7d96d05319b069165a3aaaaa9d3_49_0.png)\n\
    \nBut even a byte is a really tiny amount of information. These days we need much\
    \ bigger numbers! A kilobyte (kB) is 1,000 bytes, while a megabyte (MB) is 1,000,000\
    \ bytes and a gigabyte (GB) is 1,000,000,000 bytes. There are bigger prefixes\
    \ too: tera- means 12 zeroes, peta- 15 and exa- 18, but for a while at least those\
    \ numbers are mostly the preserve of supercomputers!\n\n### Counting the bits\
    \ we send\n\nWhen we talk about how much data is being sent between computers\
    \ we talk about the bit rate – the number of bits per second. Just like with bytes\
    \ we can have kilobits per second, megabits and so on. To keep things straight,\
    \ when coders abbreviate megabytes they write MB (with a big B), but when they\
    \ abbreviate megabits they write Mb (with a small b).\n\nWeirdly, the abbreviation\
    \ of kilo- is a small k, while mega- and giga- are capital M and G respectively.\n\
    \n![](img/862cb7d96d05319b069165a3aaaaa9d3_50_0.png)\n\nOddly, sometimes a kilobyte\
    \ means 1,000 bytes, and sometimes 1,024, while a megabyte can be 1024 × 1024\
    \ and so on. It's because sometimes, as we'll see on the next page, it's more\
    \ convenient if things are a power of 2. The two are pretty close to each other,\
    \ so normally we don't need to worry about which is being used.\n\n- bit .......................\
    \ 1\n- byte .................... 8 bits\n- kilo- ................. 1,000 bytes\n\
    - mega- ............. 1,000,000 bytes\n- giga- .......... 1,000,000,000 bytes\n\
    - tera- ....... 1,000,000,000,000 bytes\n- peta- .... 1,000,000,000,000,000 bytes\n\
    - exa- ... 1,000,000,000,000,000,000 bytes!\n\n![](img/862cb7d96d05319b069165a3aaaaa9d3_50_1.png)\n\
    \n## How Computers Count\n\nAs humans count in decimal: that means we have ten\
    \ types of numbers from 0 to 9, and we combine them to produce bigger numbers\
    \ (like 42). Decimal is also called base 10. Humans use decimal because when we\
    \ first learn to count we use our fingers to keep track of the numbers – we have\
    \ ten fingers, so we use base 10!\n\n![](img/862cb7d96d05319b069165a3aaaaa9d3_51_0.png)\n\
    \n### Two by two\n\nComputers don’t have fingers, though. As we’ve just seen,\
    \ computers really see everything as 0s and 1s. This means their way of counting\
    \ only has two types of number: 0 and 1. This is base 2, better known as binary.\n\
    \nIn binary, the two types of number get combined to make larger numbers. Just\
    \ as decimal numbers go from 0 up to 9 and then go on to 10, 11 and 12, binary\
    \ works the same way, only much faster: 1, then 10, then 11, then 100 and so on.\
    \ This can end up getting pretty unwieldy – 86 in binary is 1010110, for instance.\n\
    \n![](img/862cb7d96d05319b069165a3aaaaa9d3_51_1.png)\n\n![](img/862cb7d96d05319b069165a3aaaaa9d3_51_2.png)\n\
    \n> **That’s neat!**\n>\n> Now that you understand binary you’ll be able to get\
    \ an old programming joke:\n>\n> “There are only 10 types of people in the world:\
    \ those who understand binary, and those who don’t.”\n\n## Keeping Things Tidy\n\
    \nWhen you start writing a program it's usually pretty easy to keep the whole\
    \ thing in your head. But once it gets longer, or if you take a break and then\
    \ come back to it, you may not remember why you did things a particular way. Keeping\
    \ your code neat will make it a lot easier to work with. Here are a few tricks\
    \ you can use.\n\n### Helpful names\n\nRather than use cryptic, short variable\
    \ or function names, use plain, descriptive names. If you have a variable that\
    \ stores the number of cats a person has, name it `number_of_cats` rather than\
    \ `c` or `noc`. And don't reuse variables to store completely unrelated values\
    \ later in the program (like reusing `number_of_cats` to store the room temperature),\
    \ just create a new one – variables are free!\n\n### Short lines\n\nTry and keep\
    \ your lines of code short enough that they always fit on your screen. That way\
    \ you don't end up having to scroll back and forth, and each line will be short\
    \ enough that you can easily figure out what it does.\n\n### camelCase and snake_case\n\
    \nVariables and function names can't have spaces in, but programmers have come\
    \ up with ways to still use multiple words in their names.\n\nOne is to run all\
    \ the words together and capitalise all the first letters after the initial one:\
    \ `justLikeThis`. That's called camel case, because the capital letters make it\
    \ look a bit like the humps on a camel. The other way is to keep everything lower\
    \ case but replace the spaces with `_`: `just_like_this`. That's called snake\
    \ case, because the names end up long and thin, like a snake.\n\n![](img/862cb7d96d05319b069165a3aaaaa9d3_53_0.png)\n"
  mdcn: "\n\n## For 循环\n\n通常，你希望循环固定次数然后继续执行；这种循环称为 for 循环。for 循环会循环设定的次数。它通过索引进行循环——索引会跟踪程序到目前为止已循环的次数。不过要小心——就像在数组中一样，索引从\
    \ 0 开始，而不是从 1 开始！\n\nfor 循环运行的次数可以是固定数字（如示例所示），也可以是整数变量。不同的编程语言以不同方式编写 for 循环，所以你需要查阅如何在你的语言中编写它们。\n\
    \n```text\nfor (int i = 0; i < 10; i++) {\n    print(\"Hello!\");\n}\n```\n\n\
    > 这里索引的名称是 i，你想要循环 10 次。\n>\n> i 将从 0 到 9，所以会从 0 计数到 9。\n>\n> **这太棒了！**\n>\n>\
    \ 循环内部的代码有几种方式可以改变流程。continue 指令告诉程序跳过剩余的行，并回到循环开头以进行下一次运行；而 break 指令则告诉它立即结束循环。\n\
    \n## 开始编程！\n\n现在你已经学习了一些编码的基础知识，是时候亲自尝试了！不过，与其担心所有编写细节，不如从 Scratch 开始，这是一种非常直观的编程语言，让你通过拖放代码块到相应位置来编程。你甚至可以在平板电脑上操作！\n\
    \n![](img/862cb7d96d05319b069165a3aaaaa9d3_47_0.png)\n\n![](img/862cb7d96d05319b069165a3aaaaa9d3_47_1.png)\n\
    \nhttps://scratch.mit.edu\n\n前往 **www.scratch.mit.edu** 并点击（或轻触）**创建**。这会带你进入编码区域，你可以从左侧菜单拖拽代码段，并将它们与其他代码段拼接起来组成程序。现在试着拼接几个代码段——你需要对齐小凹槽。你也可以将它们拆开，或者拖出屏幕外以丢弃它们。左侧的不同菜单提供不同的代码段——看看都有什么可用。\n\
    \n所有程序都从 *事件* 部分的代码开始——你可以辨认出这些代码段，因为它们的顶部有一个凸起，所以没有东西可以放在它们上面。选择带有旗帜的那个。在其下方连接代码段，然后点击左上角的旗帜按钮来运行你的程序。\n\
    \n![](img/862cb7d96d05319b069165a3aaaaa9d3_47_2.png)\n\n### 发射升空\n\n好了，开始编码吧！首先，创建一个从\
    \ 10 倒数到 1 然后说出“发射！”的程序，就像火箭的任务控制员一样。这里有一些入门提示：\n\n- 你要多次执行某件事（倒数），所以你需要一个循环。\n\
    - 你还需要一个变量，用来跟踪当前所在的数字。\n- 你需要打印出变量，然后在下次循环时减小它，以便进行倒数。\n\n![](img/862cb7d96d05319b069165a3aaaaa9d3_48_0.png)\n\
    \n你也可以回顾第 43 页的示例。不过，这是用不同的语言编写的，所以你无法精确复制！这展示了不同语言以略微不同的方式完成相同的事情。如果你真的卡住了，可以查看本页底部的答案。一旦你完成了，为什么不试着让角色在倒计时结束后真正发射到太空中呢？**提示**\
    \ 你需要另一个循环、一个移动命令和一个等待命令。\n\n### 答案\n\n- 创建一个说出“发射！”的程序\n- 创建一个名为 countdown 的变量\n\
    - 将 countdown 设置为 10\n- 然后，在循环内部：\n  - 打印该变量\n  - 将 countdown 的值减少 1\n  - 暂停 1\
    \ 秒\n\n## 比特与字节\n\n如果你用一台非常强大的显微镜检查计算机的 CPU，你不会找到数字、文字或我们在程序中移动的任何其他值。相反，你会找到数百万个晶体管。晶体管实际上只是一个极其微小的开/关开关。当晶体管开启时，我们给它数字\
    \ 1；当它关闭时，我们给它数字 0。最终，计算机中的一切，无论多么复杂，都归结为 1 和 0。\n\n我们称这些值中的每一个为单个比特（bit，二进制数字的缩写）。每个比特可以设置为\
    \ 1 或 0。它相当于计算机中的原子：从本质上讲，计算机中的一切都是由比特组成的。\n\n### 多了解一点比特\n\n不过，早期的计算机系统并不是直接处理比特，而是将它们收集到\
    \ 8 个一组中，这是每次可以读取或写入的最少比特数。这些 8 比特的组之一称为字节（byte），并且有空间存储单个字符（如 'a' 或 '+'）。\n\n\
    ![](img/862cb7d96d05319b069165a3aaaaa9d3_49_0.png)\n\n但即使是一个字节也是极少量的信息。如今我们需要大得多的数字！一千字节（kB）是\
    \ 1,000 字节，一兆字节（MB）是 1,000,000 字节，而一吉字节（GB）是 1,000,000,000 字节。还有更大的前缀：太（tera-）表示\
    \ 12 个零，拍（peta-）表示 15 个零，艾（exa-）表示 18 个零，但至少在一段时间内，这些数字主要是超级计算机的专属！\n\n### 计算我们发送的比特\n\
    \n当我们谈论计算机之间发送的数据量时，我们说的是比特率——每秒的比特数。就像字节一样，我们可以有千比特每秒、兆比特每秒等等。为了区分清楚，程序员在缩写兆字节时写作\
    \ MB（大写 B），而在缩写兆比特时写作 Mb（小写 b）。\n\n奇怪的是，千（kilo-）的缩写是小写 k，而兆（mega-）和吉（giga-）分别是大写\
    \ M 和 G。\n\n![](img/862cb7d96d05319b069165a3aaaaa9d3_50_0.png)\n\n奇怪的是，有时一千字节表示\
    \ 1,000 字节，有时表示 1,024 字节，而一兆字节可以是 1024 × 1024，依此类推。这是因为有时（我们将在下一页看到）如果数值是 2 的幂会更方便。两者非常接近，所以通常我们不需要担心使用的是哪一个。\n\
    \n- 比特 ....................... 1\n- 字节 .................... 8 比特\n- 千 .................\
    \ 1,000 字节\n- 兆 ............. 1,000,000 字节\n- 吉 .......... 1,000,000,000 字节\n\
    - 太 ....... 1,000,000,000,000 字节\n- 拍 .... 1,000,000,000,000,000 字节\n- 艾 ... 1,000,000,000,000,000,000\
    \ 字节！\n\n![](img/862cb7d96d05319b069165a3aaaaa9d3_50_1.png)\n\n## 计算机如何计数\n\n\
    人类用十进制计数：这意味着我们有从 0 到 9 的十种数字，我们将它们组合起来产生更大的数字（如 42）。十进制也称为基数 10。人类使用十进制是因为我们最初学习计数时用手指来跟踪数字——我们有十根手指，所以我们使用基数\
    \ 10！\n\n![](img/862cb7d96d05319b069165a3aaaaa9d3_51_0.png)\n\n### 成双成对\n\n不过，计算机没有手指。正如我们刚刚看到的，计算机确实将所有东西视为\
    \ 0 和 1。这意味着它们的计数方式只有两种数字：0 和 1。这就是基数 2，也就是众所周知的二进制。\n\n在二进制中，这两种数字组合起来形成更大的数字。就像十进制数字从\
    \ 0 到 9，然后继续到 10、11 和 12，二进制以同样的方式工作，只是快得多：1，然后 10，然后 11，然后 100，依此类推。这可能会变得相当笨拙——例如，86\
    \ 在二进制中是 1010110。\n\n![](img/862cb7d96d05319b069165a3aaaaa9d3_51_1.png)\n\n![](img/862cb7d96d05319b069165a3aaaaa9d3_51_2.png)\n\
    \n> **这太棒了！**\n>\n> 既然你理解了二进制，你就能听懂一个老编程笑话：\n>\n> “世界上只有 10 种人：懂二进制的人，和不懂的人。”\n\
    \n## 保持整洁\n\n当你开始编写程序时，通常很容易把整个程序记在脑子里。但一旦程序变长，或者你休息了一下再回来，你可能就不记得为什么以某种方式做某件事了。保持代码整洁会让它更容易处理。这里有一些你可以使用的技巧。\n\
    \n### 有意义的名称\n\n与其使用晦涩、简短的变量或函数名，不如使用清晰、描述性的名称。如果你有一个存储某人拥有的猫的数量的变量，将其命名为 `number_of_cats`，而不是\
    \ `c` 或 `noc`。并且不要在程序后面重用变量来存储完全不相关的值（比如重用 `number_of_cats` 来存储室温），只需创建一个新变量——变量是免费的！\n\
    \n### 简短的行\n\n尽量保持代码行足够短，使它们始终适合你的屏幕。这样你就不必来回滚动，而且每一行都足够短，可以轻松弄清楚它的作用。\n\n###\
    \ camelCase 和 snake_case\n\n变量和函数名中不能有空格，但程序员们想出了一些方法，仍然可以在名称中使用多个单词。\n\n一种方法是将所有单词连在一起，并在第一个单词之后的首字母大写：`justLikeThis`。这被称为驼峰式（camel\
    \ case），因为大写字母使其看起来有点像骆驼的驼峰。另一种方法是保持全部小写，但用 `_` 替换空格：`just_like_this`。这被称为蛇形式（snake\
    \ case），因为这些名称又长又细，像一条蛇。\n\n![](img/862cb7d96d05319b069165a3aaaaa9d3_53_0.png)\n\
    \n"
