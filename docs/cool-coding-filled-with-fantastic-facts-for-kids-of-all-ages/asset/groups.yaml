    \ from the beginning of the array.\n\n> Unlike humans, computers start counting\
    \ at 0. So the index of the first element in the list is 0, the second element\
    \ is 1, and so on. It's easy to forget this one, so don't feel bad if it trips\
    \ you up occasionally.\n\n![](img/862cb7d96d05319b069165a3aaaaa9d3_37_0.png)\n\
    \n![](img/862cb7d96d05319b069165a3aaaaa9d3_37_1.png)\n"
  mdcn: "\n## 测试，测试\n\n我们在第16页介绍了一些编码时可能犯的错误。为了确保程序按你的意愿运行，你需要对它进行测试。\n\n有效测试代码的一些技巧包括：\n\
    \n- **经常测试** 每次做小改动时，都要测试代码。代码改动越小，越容易发现并修复新的缺陷。\n- **试着弄坏它** 只要有输入，就尝试故意输入不正确的值。经常引发问题的包括很长的字符串、空字符串（\"\
    \"）和负数。这些极端输入称为边界情况。\n- **使用“撤销”** 当你刚添加的代码不能工作时，通常更容易用撤销功能退回到还能正常工作的时候，然后逐行向前查找错误是在哪里引入的。\n\
    \n![](img/862cb7d96d05319b069165a3aaaaa9d3_31_0.png)\n\n![](img/862cb7d96d05319b069165a3aaaaa9d3_31_1.png)\n\
    \n### 把测试当作工作\n\n你可能会认为，专业人士开发的代码需要更少的测试，但事实并非如此：没有人能写出没有缺陷的代码。销售软件的公司希望程序中的缺陷尽可能少。因此，软件开发中的一些人是全职测试员：他们不写代码，而是花时间测试别人写的代码。发现问题时，他们会提交缺陷报告，列出如何触发该缺陷以及其影响是什么。程序员随后利用报告来查找并修复缺陷。\n\
    \n### 用代码测试代码\n\n测试代码很耗时，而且可能很枯燥，因为你需要一遍又一遍地测试同样的东西，以确保它没有被后来的代码改动破坏。所以如今越来越趋向于自动化测试。\n\
    \n自动化测试本质上是让代码测试自身。这涉及编写更多不属于主程序的代码，而是测试框架（之所以这样叫，是因为它环绕在主代码周围）。这个框架会自动运行你的主程序，输入各种值并检查输出。这些框架可以是系统测试，环绕整个程序；也可以是单元测试，环绕代码的各个部分。\n\
    \n编写这些自动化测试看起来可能比编写程序本身更浪费时间，但一旦有了它们，每当你意外破坏某些东西时，你立刻就会知道。这让缺陷非常容易发现和修复，从长远来看还能节省你的时间！\n\
    \n![](img/862cb7d96d05319b069165a3aaaaa9d3_32_0.png)\n\n## 面向CPU的代码\n\n编程语言种类繁多，但几乎所有语言都有一个共同点：它们基于英语。即使你不懂某种编程语言，通常也能看看该语言的一些简单代码，大致推断出它在做什么。\n\
    \n![](img/862cb7d96d05319b069165a3aaaaa9d3_33_0.png)\n\n### 机器码\n\n不过，计算机并不懂英语。当它们运行程序时，需要把程序翻译成机器码，即中央处理器（CPU）能够理解的指令。机器码包含一组非常有限的指令，这些指令对应于硬连线在CPU中的实际操作。\n\
    \n最早的计算机是直接用机器码编程的，但这是一项极其棘手的工作：程序员必须在每一行计算出非常精确的一组数值，以指示CPU做什么。更糟的是，每种CPU都有自己的机器码，所以一个程序要在另一种计算机上运行，就必须从头重写。\n\
    \n下面是一些机器码的示例：\n\n```\n77\n29 20 b3\n61 9e\n70\n0c b7 f6\n```\n\n### 汇编代码\n\n\
    汇编代码发明于20世纪50年代，目的是让编程稍微简单一些。现在，原始代码被一组简短的指令取代，这些指令（在某种程度上）是英语，比如用move表示移动、jump表示跳转、add表示相加。这种语言还包括变量名之类的东西来保存数据。然后，这些汇编代码可以被自动转换为机器码，供CPU运行。\n\
    \n> **这真巧妙！**\n>\n> 很长一段时间里，如果程序需要非常小且非常快，程序员仍然会使用汇编代码；但随着其他编程语言的发展，它们自动生成的机器码往往能胜过最优秀的人工编写汇编代码。如今只有在少数特殊情况下，人们直接用汇编代码编写仍然有意义。\n\
    \n下面是一些汇编代码的示例：\n\n```asm\nloop: add $t1, 1\n      bne $t1, $t2, end\n      jmp\
    \ loop\nend:  nop\n```\n\n汇编代码比机器码更容易编写，但编写起来仍然很慢，而且每种CPU都不同。到20世纪70年代，大多数程序员都在使用高级语言（之所以叫高级，是因为它们比低级汇编语言和机器码离CPU更远）这些语言更像英语。然后这些高级语言会被转换为机器码，供CPU执行。\n\
    \n![](img/862cb7d96d05319b069165a3aaaaa9d3_34_0.png)\n\n## 会思考的代码\n\n![](img/862cb7d96d05319b069165a3aaaaa9d3_35_0.png)\n\
    \n自从计算机诞生以来，人们就一直梦想着它们能自己思考。这被称为人工智能，简称AI。\n\n> 哎呀，他真厉害！\n\n### 计算机下国际象棋\n\n在西方文化中，很长一段时间里国际象棋一直被视为智慧的顶峰：这就是为什么电影和电视经常展示聪明人下棋。所以早期的计算机科学家花了很多时间教计算机下棋。他们觉得如果能做到这一点，就能做到任何事。\n\
    \n然而，事实证明，对机器来说，掌握国际象棋实际上远比掌握人类觉得微不足道的事情（比如在图片中识别猫）要容易得多。1996年，一台名为“深蓝”的超级计算机击败了国际象棋世界冠军加里·卡斯帕罗夫，但如今的计算机在识别猫方面仍然不如三岁小孩。\n\
    \n![](img/862cb7d96d05319b069165a3aaaaa9d3_35_1.png)\n\n### 超越国际象棋\n\n国际象棋程序是基于规则系统的例子：人类理解如何下棋，所以程序员编写一堆规则让程序遵循。然而，对于我们难以写成规则的事情，这种方法效果不佳，比如判断一张图片里是否有猫。你自己很容易做到，但你能精确地分解出每一步是如何做到的吗？\n\
    \n![](img/862cb7d96d05319b069165a3aaaaa9d3_36_0.png)\n\n最近的许多研究都投入到了机器学习中。在这里，我们提供一个框架让计算机自己学习，然后提供大量数据供它学习（比如很多图片，有些有猫，有些没有）。通过遍历所有数据，计算机利用该框架自动建立解决问题的方法。要做到这一点，我们需要像神经网络这样巧妙的框架，以及尽可能多的数据。幸运的是，互联网上有无限多的猫图片！\n\
    \n### 真正会思考的代码\n\n许多计算机科学家的真正梦想是一台真正智能的机器。早在1950年，艾伦·图灵发明了图灵测试，以判断计算机是否真正智能。该测试让一个人与一个看不见的人交谈。如果他们认为对方是人，结果却是计算机，那么这台计算机就可以被认为具有智能。目前还没有计算机程序能通过这项测试，但程序员们正在努力造出能通过的程序。你能想象如果他们做到了会有什么影响吗？毕竟，这样的程序可以被认为是有生命的……\n\
    \n![](img/862cb7d96d05319b069165a3aaaaa9d3_36_1.png)\n\n## 处理数据\n\n我们已经见过变量，它让我们存储信息片段；但如果我们有一堆数据，比如全班每个人在一次测验中的得分，该怎么办？与其创建许多变量，我们可以创建一个能存储许多不同值的东西。\n\
    \n有些编程语言称它们为数组，有些称它们为列表。如果变量像一个可以保存一个值的盒子，那么数组就像一个抽屉柜，每个抽屉都能存储一个单独的值。\n\n### 创建数组\n\
    \n要使用数组，我们需要另一种括号——[ ]。它们被称为方括号。创建数组时，我们把所有数据片段（在数组中我们称它们为元素）放在这些方括号内，用逗号分隔。\n\
    \n> 创建一个包含三个元素的数组\n\n```\nmy_first_array = [1, 3, 5]\n```\n\n数组中有数据后，你就可以读取或更改单个元素。为了告诉程序我们要访问哪个元素，我们给它一个索引，就像书中的页码。它就是我们想要的元素编号，从数组开头开始计数。\n\
    \n> 与人类不同，计算机从0开始计数。所以列表中第一个元素的索引是0，第二个元素的索引是1，依此类推。这一点很容易忘记，所以如果它偶尔让你犯错，也不必难过。\n\
    \n![](img/862cb7d96d05319b069165a3aaaaa9d3_37_0.png)\n\n![](img/862cb7d96d05319b069165a3aaaaa9d3_37_1.png)\n\
    \n"
