  - '[PAGE 95]


    # Making Things Smart


    It’s not just PCs and smartphones that are always online. Wireless technology
    is now small and cheap enough that it can be built into all sorts of devices,
    along with the sensors and microchips needed to control it. That means that you
    can now get thermostats, speakers and even light bulbs that report their status
    and receive commands over the internet, making them smart.


    It may not be long before just about everything electrical in your house will
    be connected to the wireless network, sharing data and being controllable from
    your smartphone or PC. You could have music follow you from room to room, turn
    off your heating if you’re not around, and have more control over your personal
    electronics than ever before. This vision of a world of smart devices is called
    the Internet of Things.


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_95_0.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_95_1.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_95_2.png)'
  - '[PAGE 96]


    # # Taking control


    As a programmer, though, you can get even more out of the Internet of Things.
    As well as having smartphone apps, many of these smart devices can be controlled
    via APIs, which means you can write code to control them yourselves. An API, or
    application programming interface, is a set of network commands that the device
    will listen for, along with documentation to tell you what they are and how to
    use them.


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_96_0.png)


    # # Smartening up


    As well as controlling other devices, if you are creating your own electronic
    devices, like a robot, then why not make it controllable via wireless? That way,
    rather than having to load new code onto it every time you make a change, you
    can write the control code on your PC, and have it control your robot over the
    network. Some development boards like the Raspberry Pi have networking built in,
    while others like the Arduino have add-ons for it, and there are libraries for
    each that make it easy to hook your robot up to your wireless network.


    # # That''s neat!


    While you could write network and API code yourself, you will usually be able
    to find a software library for your programming language that does that for you,
    so you just need to worry about what you want the device to do. Where possible
    you should make use of third-party libraries like this, rather than try to write
    everything yourself. It will save you a lot of time, and with lots of people using
    the same code and reporting any issues, these libraries can be made as good as
    possible.


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_96_1.png)'
  - '[PAGE 97]


    <!-- no content -->'
  - '[PAGE 98]


    # Going back in time


    The version control system contains a history of each set of changes you’ve made.
    If you find you’ve made some mistakes and broken your code and don’t know how
    to fix it, you can revert to an earlier version. You can also see precisely what
    changes you made over time in the form of diffs, which show what changed between
    each commit.


    Your version control system can be purely local to your machine, but there are
    also free online version control systems such as GitHub. These have two big advantages.
    Because they’re a cloud service, you can work on your code from multiple machines,
    and recover it if one breaks. They also make it really easy for you to share your
    code with other people, as the repositories are public (viewable by anyone) by
    default.


    # Working with others


    Indeed, sharing code is where the real value of version control comes in – it’s
    the best way for multiple people to work on the same code. It keeps track of everyone’s
    changes and will help them resolve any conflicts. Modern version control systems
    are distributed, which means everyone has a local copy of the repository. They
    get changes from the master repository by pulling from it, and push their local
    commits to it.


    Version control systems are how open-source projects are coordinated. Rather than
    pushing code commits directly into the repository, commits are filed as pull requests.
    People who know the code will then review the requests and either accept them
    into the main program, or return it with comments about what needs fixing. This
    means that if you contribute to a big project, someone will review your code and
    help you make it as good as possible.


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_98_0.png)'
  - '[PAGE 99]


    # # Getting Old-school


    The scripting languages we''ve looked at, such as Python and Javascript, aren''t
    the only family of programming languages that are widely used. Now we''ll look
    at some lower-level languages that are used to write a lot of the programs that
    run on PCs every day.


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_99_0.png)


    # ## C and C++


    Of these, C and C++ are very important. C is a venerable language that dates back
    to the early 1970s, while C++ is an updated version that includes classes and
    a host of other advancements. C++ is a more demanding, slower language to code
    in than most scripting languages, with lots of powerful techniques, such as direct
    access to the computer''s memory through pointers. C++ and other languages of
    its type can''t be run directly; they must first be compiled. This is a process
    where the programmer must first convert their program to machine code using a
    compiler program. It''s this executable that is then distributed to users. This
    means that different operating systems need different compilers and different
    executables (because their machine code is different).


    However, this compilation step does mean many problems can be found at compile
    time rather than when the program runs. It also generally means the code runs
    faster, because it''s already been translated into something the computer can
    run directly. Because of this speed, and the language''s long history, there''s
    a lot of software out there written in C and C++, including most computer operating
    systems.'
  - '[PAGE 100]


    <!-- no content -->'
  - '[PAGE 101]


    # # Working in Parallel


    All the programs you''ve seen so far involve the computer following instructions
    one at a time. Given how fast computers are, this is usually just fine. But sometimes
    you''ll need bits of your program to operate independently at the same time, and
    that''s where parallelism comes in.


    # ## Branching out


    Parallelism means running more than one piece of your program at the same time,
    in parallel. Rather like the limbs of a tree that split into lots of branches
    as it grows, your program can fork into multiple branches too. Each of these branches
    are called threads or processes. Each one is essentially its own separate and
    independent program, executing instructions one at a time.


    So why run things in parallel? It''s so you can do things that may take a long
    time, without holding up other bits of program. For instance, the GUI (see page
    54) of a program is often run separately from the rest of the program. That way
    even if the main part of your program takes a long time


    calculating something, the user can still scroll around and click buttons, as
    the GUI code is running independently.


    Your code branches will need to communicate, though: when your user presses a
    button in the GUI, you want something to happen in your main program. Programming
    languages have different ways to do this. Often they will use queues to pass messages
    between branches – one branch writes a message that the other branch then reads
    when it''s free.


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_101_0.png)'
  - '[PAGE 102]


    # Locking and unlocking


    Writing parallel code (sometimes called multi-threaded code) can get complicated.
    For instance, different branches can share the same variable, but big problems
    can occur if more than one tries to use it at the same time. To avoid this there
    are various types of locks (such as mutexes and semaphores) that ensure only one
    branch accesses a variable at a time. If another wants to use it too, it has to
    wait until the first branch is done and removes the lock.


    # That’s neat!


    Computers can actually do more than one thing at a time — modern computers have
    CPUs with two, four, or more cores, each of which can run a thread or process.
    However, you can have far more processes than that — the CPU switches between
    the processes really, really quickly, so it seems like everything’s running at
    once!


    > Hold it, wait! Now go, go, GO!


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_102_0.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_102_1.png)'
