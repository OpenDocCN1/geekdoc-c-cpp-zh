  mdcn: '

    ## 超级计算


    回到计算机刚被发明的时候，它们要占据整个房间，而如今一台计算机可以放在书桌下，甚至握在掌心。然而，仍然有一些计算机要占据整栋建筑：它们就是超级计算机。


    > **这真有趣！**

    >

    > 除了天气之外，超级计算机长期以来还被用于设计和模拟现存最具破坏性的武器：原子弹。尽管这看起来并不特别吸引人，但拥有原子弹的国家同意，在发生战争时不再对彼此使用原子弹，而是改用超级计算机来模拟它们。


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_103_0.png)


    ### 向上，向上，飞向远方！


    超级计算机是极其强大的机器，用于解决令人难以置信的复杂问题。最常见的用途是模拟非常复杂的现实世界系统，例如天气模式（这样我们就能预测何时下雨），或者蛋白质如何折叠（以寻找新的医学疗法）。


    由于单个 CPU（见第 52 页）的尺寸有限，超级计算机实际上是由成千上万个独立 CPU 连接在一起组成的。运行在其上的程序被编写成大规模并行：计算被拆分成成千上万个任务，然后分配给各个
    CPU。


    ### 租一台自己的超级计算机


    超级计算机造价数百万英镑，这显然让几乎所有人都无法企及。然而，随着云计算的出现，现在可以按分钟租用计算时间。因此，一位需要超级计算机来解决特定问题的科学家，只需租用她运行程序一小时左右所需的计算能力，就能以仅几百英镑的代价临时使用自己的超级计算机。


    > 这真是超大规模！


    > **这真有趣！**

    >

    > 超级计算机的速度以 flops 衡量，这是 floating-point operations per second（每秒浮点运算次数）的缩写——本质上就是它们每秒能完成多少次求和运算。在本书写作时，世界上最强大的超级计算机由
    40,000 多个独立 CPU 组成，每个 CPU 有 256 个核心。这台计算机的运行速度接近 100 千万亿次浮点运算/秒，这意味着它每秒能完成近一千万亿（一百万的十亿倍）次计算。然而，等你读到这段文字时，很可能已经有更快的计算机了……


    ## 进入算法节奏


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_105_0.png)


    计算机做事很快——一台售价 5 英镑的计算机时钟速度可以达到 1GHz，这意味着它每秒能完成一*十亿*件事。因此大多数时候，你不需要担心程序运行得有多快。不过，有时你可能会发现某个程序需要很长时间才能完成。这时你就需要担心自己所使用的算法了。


    算法就是你的代码解决特定任务的方式——比如把列表按字母顺序排序。完成一项任务通常有很多种写代码的方式，而每种方式都有自己的复杂度——也就是当你增加数据量时，运行所需时间会如何变化。


    ### 你的代码有多复杂？


    复杂度为 O(n) 的算法被称为线性算法——这意味着如果你把数据集的大小（n）翻倍，运行时间也会变成两倍。但同一任务的另一种算法可能具有 O(n²) 的复杂度——现在当你把数据量翻倍时，该算法的运行时间会变成四倍。当
    n 很小时，时间差异无关紧要；但如果你要处理数百万个元素，第二种算法解决同一任务所需的时间可能比第一种多成千上万倍！


    > 你可能会忍不住想为代码中的一切找到最快的算法，但这并不总是最好的主意。你不仅会花费大量时间和精力让代码运行得快很多，而且最终得到的代码会更难理解或修改。花大量时间去加速并不需要加速的代码，这被称为过早优化。只有当代码速度给你带来问题时，你才应该担心它。


    还有许多其他可能的复杂度——对于给定的 n 值，括号内的值越小，算法在大数据集上运行得就越快。要算出你自己算法的复杂度，可以看看代码，试着算出对于 n 条数据它需要运行多少次。嵌套循环（循环里面还有循环）表明你的算法可能复杂度较高。如果你打算处理大量数据，可以考虑是否有办法重写代码来避免这些嵌套循环。


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_106_0.png)


    - 绿色的门？

    - 塔楼？

    - 树？

    - 六层楼？

    - 一个烟囱？

    - 两个烟囱？


    ## 更快，更快！


    你可能已经注意到，计算机每年都在变得更好——同样的钱可以买到更快的 CPU、更大的内存和更多的存储空间。


    这实际上已经持续了很长时间。早在 1965 年，英特尔（至今仍是世界上最大的 CPU 制造商之一）的创始人之一戈登·摩尔注意到，他们在同样数量的硅片上能容纳的晶体管数量每年翻一番——本质上就是让同样大小的
    CPU 性能翻倍。


    哇塞！


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_107_0.png)


    CPU 中的晶体管数量


    时间


    ### 摩尔定律


    这种可预测的改进速度被称为摩尔定律。它已经有所放缓；自 20 世纪 80 年代以来，晶体管密度（给定面积内能容纳多少个晶体管）大约每两年才翻一番，但它仍然势头强劲。当你每隔几年就把数量翻倍时，随着时间推移，这会累积成惊人的变化。


    > **这真有趣！**

    >

    > 控制阿波罗 11 号、把人类送上月球的那台计算机，在 1969 年堪称惊人地先进，造价数百万美元。阿波罗制导计算机（AGC）驾驶飞船完成了从地球到月球再返回的
    380,000 公里（236,128 英里）旅程。然而，它被现代计算机远远超越——甚至很难进行比较。你的烤面包机都要比它强大几个数量级。AGC 运行频率为
    0.05MHz，内存为 64kB；而一部便宜的现代智能手机大约快 20,000 倍，内存多 50,000 倍！


    ### 真正巨大和真正微小的数字


    这种进步是由制造商设法让晶体管越来越小所推动的。Colossus 和 ENIAC 使用的真空管每个都有几厘米宽。相比之下，现代 CPU 中的硅晶体管宽度仅
    14 纳米（0.000000014 米）。20 世纪 70 年代的第一批 CPU 芯片只有几千个晶体管，而现代 CPU 芯片则有超过十亿个。


    现代晶体管实际上小到许多科学家认为摩尔定律很快就将难以为继。14 纳米的晶体管宽度不到 100 个原子，如果它们再小得多，其奇异的量子效应就会开始干扰它们。不过，科学家正在试验新材料、晶体管的
    3D 排列，以及他们能想到的任何其他办法，试图让摩尔定律继续成立。谁知道他们还能坚持多久？


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_108_0.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_108_1.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_108_2.png)


    ## 更多编程


    希望这本书已经让你热血沸腾，准备好开始编程了。这里有一些很棒的入门去处！老师、朋友和家人也许还能给你指出更多。


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_111_0.png)


    ### 入门


    - **Scratch** www.scratch.mit.edu 是你在第 44 页和第 74 页已经探索过的网站。点击最顶部的“Explore”（探索），看看人们用它做出的所有奇妙作品——你能做出类似的东西吗？

    - **代码教程** 外面有数百个网站可以帮你入门各种编程语言，而 www.codecademy.com 是其中最好的之一。你也可以看看 www.freecodecamp.com，这是另一个很棒的教程网站，侧重于开源开发。

    - **搜索** 听起来可能有点奇怪，但在学习编程时，www.google.com 和其他搜索引擎是你最好的朋友。如果你遇到不理解的错误信息，把它复制到搜索引擎里，你就会找到大量解释其含义的网页。


    ### 编程工具


    - **智能编辑器** 如果你使用 Windows，可以试试 www.notepad-plus-plus.org，这是一个好用又简单的智能文本编辑器。如果你是
    Mac 用户，可以试试 www.macromates.com。

    - **在线试验场** 如果你想不安装任何东西就直接开始编程，www.pythonfiddle.com 可以让你直接在浏览器中测试小型 Python 程序。www.jsfiddle.net
    对 JavaScript 也有同样的功能，还能让你轻松地将它与 HTML 和 CSS 结合起来。

    - **iOS 和 Android SDK** 如果你想开发手机应用，可以从 https://developer.apple.com/ios 下载 iOS
    SDK，用来开发 iPhone/iPad 应用。Android 对应的开发工具请前往 https://developer.android.com/studio。

    - **Web 应用** 如果你想改用 JavaScript 编写手机应用，可以看看 www.ionicframework.com，这个 SDK 能让你用
    Web 代码编写应用。

    - **版本控制** 外面有很多版本控制系统，但 www.github.com 是迄今为止最流行的——它不仅可以存储你自己的代码，也是大多数开源程序的存放地。


