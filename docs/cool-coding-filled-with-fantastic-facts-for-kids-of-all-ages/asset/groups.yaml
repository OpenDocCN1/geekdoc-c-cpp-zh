    # # How Computers Count


    As humans count in decimal: that means we have ten types of numbers from 0 to
    9, and we combine them to produce bigger numbers (like 42). Decimal is also called
    base 10. Humans use decimal because when we first learn to count we use our fingers
    to keep track of the numbers – we have ten fingers, so we use base 10!


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_51_0.png)


    # ## Two by two


    Computers don’t have fingers, though. As we’ve just seen, computers really see
    everything as 0s and 1s. This means their way of counting only has two types of
    number: 0 and 1. This is base 2, better known as binary.


    In binary, the two types of number get combined to make larger numbers. Just as
    decimal numbers go from 0 up to 9 and then go on to 10, 11 and 12, binary works
    the same way, only much faster: 1, then 10, then 11, then 100 and so on. This
    can end up getting pretty unwieldy – 86 in binary is 1010110, for instance.


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_51_1.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_51_2.png)


    > > **That’s neat!**

    > >

    > > Now that you understand binary you’ll be able to get an old programming joke:

    > >

    > > “There are only 10 types of people in the world: those who understand binary,
    and those who don’t.”'
