    # # Even More Coding


    Hopefully this book has got you all fired up and ready to get coding. Here are
    some great places to get started! Teachers, friends and family may also be able
    to point you at even more.


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_111_0.png)


    # ## Getting started


    +   - **Scratch** www.scratch.mit.edu is a site you’ve already explored on pages
    44 and 74. Click on Explore at the very top and check out all the amazing things
    people have made with it – can you make something like that?

    +   - **Code tutorials** There are hundreds of sites out there that will get you
    started in a variety of programming languages, and www.codecademy.com is one of
    the best. You can also check out www.freecodecamp.com for another great tutorial
    site, with a focus on open-source development.

    +   - **Search** It may sound odd, but www.google.com and other search engines
    are your best friend when learning to code. If you have an error message you don’t
    understand, copy it into your search engine and you’ll find loads of web pages
    explaining what it means.


    # ## Coding tools


    +   - **Smart editors** If you use Windows, try www.notepad-plus-plus.org for
    a nice and simple smart text editor. If you’re a Mac user, try www.macromates.com.

    +   - **Fiddles** If you want to jump right into coding without installing anything,
    www.pythonfiddle.com will let you test out small Python programs right in your
    browser. www.jsfiddle.net does the same for JavaScript, and lets you easily combine
    it with HTML and CSS.

    +   - **iOS and Android SDKs** If you’re looking to develop phone apps you can
    download the iOS SDK from https://developer.apple.com/ios to develop iPhone/iPad
    apps. Head to https://developer.android.com/studio for the Android equivalent.

    +   - **Web app** If you want to write phone apps in JavaScript instead, check
    out www.ionicframework.com for an SDK that will let you write apps using web code.

    +   - **Version control** There are lots of version control systems out there,
    but www.github.com is by far the most popular – as well as storing your own code,
    it’s where most open-source programs are kept.'
