    ## Picture It


    While old computers focused on text on a screen, computers nowadays can produce
    astonishing graphics – just about every animated movie and TV show, whether it''s
    in 2D or 3D, is now produced primarily on computers.


    If you want to produce graphics in your program you''ll need a graphics library.
    Some languages have a built-in library, or you can download a wide array of other
    libraries for each language. If there is a built-in library these are usually
    the best way to get started; they may not be the most powerful or specialised,
    but they''re usually straightforward to use and there will be lots of help online.


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_69_0.png)


    ### Two dimensions


    A 2D graphics library will let you draw shapes (not just triangles, circles and
    rectangles, but more complex shapes like polygons) and choose their colour and
    outline.


    It will also let you add text and pictures that you''ve downloaded from the internet.


    To make graphics that move, your program will need to draw lots and lots of individual
    frames of animation, quickly enough that the human eye can''t distinguish the
    individual drawings. Your graphics library should have a range of functions to
    make this much easier than coding each frame by hand.


    ### Three dimensions


    Some graphics libraries only produce 2D graphics, but others can do 3D as well.
    These involve creating scenes out of objects.


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_70_0.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_70_1.png)


    Objects can be primitives like cubes and cones, or models of more complex objects
    that are provided by the library or downloaded. These objects are then textured
    to choose their colour, and then the system renders them into a 2D image based
    on where a virtual camera is pointing.


    Producing 3D graphics can be pretty complicated; it’s worth giving 2D graphics
    a try first. Game engines often contain some of the easiest 3D graphics engines
    to use.


    > **That’s neat!**

    >

    > Along with primitives like cones, spheres and rectangles, many 3D graphics libraries
    include a teapot. It’s because the pioneers of 3D graphics needed a model for
    some testing, since they were having tea at the time, they carefully measured
    their teapot, and used that, sharing it with other people online. It’s also become
    an icon for animators to hide their teapot in the background of 3D movies!


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_70_2.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_70_3.png)


    Programmers refer to these as ''bad smells'' - they are signs that the code may
    work, but it will be difficult to change without accidentally breaking something,
    and when it breaks it will be hard to fix.


    Don''t worry if your code has one or more of the above; programs that change over
    time often end up like this. The solution is refactoring, which is like spring-cleaning
    for code. It''s the process of changing the code, not to make it do new things,
    but to be more manageable while doing the same thing. This usually involves turning
    duplicated code into a single function that can be called from multiple places,
    breaking up overlong lines and functions into separate chunks, and replacing goto
