    ## 直观感受


    旧式计算机专注于屏幕上的文本，而如今的计算机可以生成令人惊叹的图形——几乎每一部动画电影和电视节目，无论是 2D 还是 3D，如今都主要依靠计算机制作。


    如果你想在程序中生成图形，就需要一个图形库。有些语言自带图形库，或者你可以为每种语言下载各种其他库。如果有内置库，通常是最好的入门方式；它们可能不是最强大或最专业化的，但通常简单易用，而且网上会有大量帮助资源。


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_69_0.png)


    ### 二维图形


    2D 图形库可以让你绘制形状（不仅是三角形、圆形和矩形，还有多边形等更复杂的形状），并选择它们的颜色和轮廓。


    它还可以让你添加从网上下载的文本和图片。


    要制作动态图形，你的程序需要快速绘制大量独立的动画帧，快到人眼无法分辨出单独的图像。你的图形库应该提供一系列函数，让这比手动逐帧编码容易得多。


    ### 三维图形


    有些图形库只能生成 2D 图形，但其他的也能处理 3D。这涉及到用对象来创建场景。


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_70_0.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_70_1.png)


    对象可以是立方体、圆锥体等基本体，也可以是库提供或下载的更复杂对象的模型。这些对象随后会被赋予纹理以选择颜色，然后系统会根据虚拟摄像机的指向将它们渲染成 2D
    图像。


    制作 3D 图形可能会相当复杂；建议先尝试一下 2D 图形。游戏引擎通常包含一些最容易上手的 3D 图形引擎。


    > **真有意思！**

    >

    > 除了圆锥体、球体和长方体等基本体外，许多 3D 图形库还包含一个茶壶。这是因为 3D 图形的先驱们当时需要测试用的模型，正巧他们在喝茶，于是仔细测量了他们的茶壶，用它来做模型，并在网上与他人分享。它也因此成为动画师们的标志，喜欢把茶壶藏进
    3D 电影的背景里！


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_70_2.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_70_3.png)


    程序员把这些称为“坏味道”——它们表明代码或许能运行，但很难在不意外破坏某些功能的情况下进行修改，而且一旦出问题，也会很难修复。


    如果你的代码有上述一种或多种情况，别担心；随着时间推移而不断变化的程序往往最终会变成这样。解决办法是重构，这就像是给代码来一次大扫除。重构的过程是修改代码，不是为了让代码实现新功能，而是让它在功能不变的情况下更易于管理。这通常涉及将重复代码变成单个可由多处调用的函数，把过长的行和函数拆分成独立的小块，以及用函数和循环取代
    goto 语句。


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_72_0.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_72_1.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_72_2.png)


    ## 变化历程


    **UNIVAC I（1951年）**


    第一台售出的计算机 UNIVAC I（UNIVAC 自动计算机）的重量是一头成年非洲象的两倍，消耗的电力相当于 250 户英国家庭。按现代货币计算，它的造价超过
    2500 万英镑。尽管体积庞大、价格高昂，仍然有 46 台 UNIVAC 被购买，用途从预测选举结果到模拟原子弹爆炸，无所不包！


    **PDP-8（1965年）**


    PDP-8 是第一台成功的“迷你计算机”。这里的“迷你”是相对而言：相对于 UNIVAC 这样的大型机，它确实很小，但仍然有一个衣柜那么大，售价 18,500
    美元（约合今天的 10 万英镑）。尽管设计目标是尽可能便宜和简单，技术的进步仍然让它比 UNIVAC I 快 50 倍。PDP-8 取得了巨大成功，各种型号共售出超过
    30 万台。


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_73_0.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_73_1.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_73_2.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_73_3.png)


    ## 脚本语言


    编程语言可分为多个家族，各自具有特定的工作方式。其中最常见的一类就是脚本语言。脚本语言不一定能产生运行速度最快的代码，但它们专注于让编写和运行变得更加快速和紧凑，而且通常是动态类型语言。这使得它们成为非常适合入门的一系列语言。


    ### JavaScript


    近年来，JavaScript 的人气急剧飙升。从表面上看，它是一种简单的脚本语言——语法简洁明了，并且与 C++ 和 Java 等许多其他语言共享。本书中的代码示例就是受到
    JavaScript 的启发。


    JavaScript 之所以如此重要，是因为它得到了网页浏览器的支持，因此可以被嵌入网页中。这使得 JavaScript 非常容易上手，也很容易与他人分享你的程序。JavaScript
    还可以像其他脚本语言一样，借助 node.js 等解释器在浏览器之外运行。


    > **注意！**

    >

    > 为简单起见，本书中的示例省略了 JavaScript 的部分语法，比如用 `var` 声明变量，以及用分号结束语句。虽然 JavaScript 是一种宽容的语言，即使有这些问题你的程序也能运行，但最好始终使用正确的语法。


    ### Python


    Python 是另一种流行的脚本语言。用 Python 开发大型程序非常容易，因为有很多库可以方便地添加进来，提供额外的功能。它还有非常完善的类和继承模型，让面向对象编程变得轻而易举。


    JavaScript 的语法与许多更早的编程语言相同，而 Python 在许多事情上都有自己的方式。例如，Python 不使用花括号，而是用缩进（在行前加空格）来定义代码块。而且，JavaScript
    倾向于使用 for 循环以及检查返回值来处理错误，而 Python 代码有其他方式来解决同样的问题，比如迭代器和异常。所以如果你真的开始学 Python（你应该学——它是一门很棒的语言），读一些教程来了解如何最大限度地利用它的做事方式。


    > 啊，蛇~~蛇~~蛇~~脚本！


    ### 其他语言


    还有很多其他的脚本语言，比如 Ruby、Lua、PHP 和 Perl。每种语言都有自己的优势和使用场景，所以如果遇到新的语言，不要害怕去尝试！


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_76_0.png)


    ## 更多编程！


    希望你享受了第 44 页的首次编程体验。Scratch 是一种令人惊叹的语言，也是制作一些简单游戏和程序的绝佳方式。除了代码，它还提供了大量音乐和美术资源可以在你的程序中使用，完成后你还可以与朋友和家人分享！要保存程序，你需要加入
    Scratch 并登录。之后你也能分享你的代码。


    ### 学习新技能


    当你进入 Scratch 的**创建**（Create）版块时，右侧会出现一个菜单栏，里面有大量教程——这些教程会一步步带你完成一系列项目。每当你学习一门新的编程语言时，教程都是很好的起点，因为它们旨在通过精确示范用法，让你熟悉这门语言能做的一切。去探索一些
    Scratch 的教程吧。


    你也可以从主页选择**探索**（Explore）来查看别人创建的游戏和程序。你不仅可以享受游戏的乐趣，还可以查看代码，了解它们是如何制作的！试玩几个游戏，然后研究你最喜欢的那个的代码，弄清楚它的运行原理。你甚至可以修改代码，看看会产生什么效果——不用担心改坏，你的改动不会影响主版本！


