    # # Waiting In Line


    We’ve already explored arrays, which are a way of storing data in a block of memory,
    with every individual piece of data accessible at any time. Not all data is suited
    to being stored this way, though.


    # ### Linking up


    Another way to store data is in a linked list. Here, rather than storing all the
    data in a single big block of memory like an array, each piece of data is stored
    separately, and contains a link to the next element in the list, like links in
    a chain. So item A has a link to item B, which has a link to item C. A singly
    linked list only has links in this direction, while a doubly linked list has links
    in both directions (C links back to B, which links back to A).


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_89_0.png)


    In order to access an item from a linked list you need to iterate through the
    list, following the links in the chain. This is slower than an array, where any
    item in the middle can be reached in one operation. But it’s easy to add and remove
    links from a list, whereas – because they are a single block of memory – arrays
    are harder to shrink or grow.'
  - '[PAGE 90]


    # Queueing and stacking


    Arrays and linked lists are used to implement certain types of storage that the
    computer relies upon internally: queues and stacks. These are data stores where,
    rather than being able to access any element, you can only read one element at
    a time, based on the order in which the elements were put in.


    A queue operates by FIFO – First In, First Out. So if you add A, then B, to a
    queue, when you read from the queue you will get first A, then B. In contrast,
    a stack operates by LIFO – Last In, First Out. Here if you add A, then B, to a
    stack, then when you read from it you will first get B, then A, rather like putting
    things onto and taking things off a stack of paper.


    > Last in, first out.


    > Don’t push it!


    > That’s neat! Putting an item into a stack is referred to as pushing it, whereas
    taking one out is called popping it!


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_90_0.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_90_1.png)'
