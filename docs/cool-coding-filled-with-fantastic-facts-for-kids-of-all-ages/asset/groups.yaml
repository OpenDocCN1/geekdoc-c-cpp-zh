    # # User Interfaces


    So far we''ve looked at interacting with a program through lines of text; this
    is the simplest method to use. Programmers call this a command line interface,
    or CLI. Most computer users have trouble using a CLI. However, there''s another
    way.


    # ## Getting graphical


    That other way is a graphical user interface, or GUI. A GUI lets your program
    show your users pictures, menus and other elements, and lets them interact with
    it using a mouse or touchscreen. GUIs take more work to create, so they''re not
    something you should worry about until you''ve mastered the basics of programming,
    but they''re very user-friendly.


    To create a GUI you need a GUI framework. Each programming language has a different
    set of frameworks with different ways of doing things, all designed to help coders
    create a GUI for their program. Some languages come with a GUI framework built
    in, and that''s usually the best to start with, but there will be numerous others
    you can download and use.


    # ## Elements of interaction


    All GUI frameworks revolve around a set of key elements you''ll recognise from
    computer programs you''ve used.


    # ## Text boxes


    display text to users or allow them to enter text themselves.


    # ## Buttons


    are things users click to tell the program to do something.


    # ## Dropdowns


    are a list of options the users can pick from.


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_57_0.png)'
  - "[PAGE 58]\n\nGUI frameworks will let you write code to define elements like buttons,\
    \ along with their position, size and other properties. They often also include\
    \ a GUI designer, which will let you draw out your GUI visually, and then generate\
    \ part of the code for you. While it’s best to start out creating a few buttons\
    \ in code to understand how they work, designers are much quicker to use.\n\n\
    > **That’s neat!**\n> \n> The way elements like buttons work is with a special\
    \ type of function named a callback. A callback is just a function, but its name\
    \ is passed into another function which will then call it back to it when a condition\
    \ is met. So when a button is pressed, that callback function gets run.\n\n**Check\
    \ boxes** are options you users can toggle on or off.\n\n**Radio buttons** are\
    \ like check boxes, but users can only pick one option.\n\n**Labels** help describe\
    \ what all the other elements are for.\n\n![](img/862cb7d96d05319b069165a3aaaaa9d3_58_0.png)"
