    # # Bits and Bytes


    If you were to take a very powerful microscope and examine the CPU of a computer,
    you wouldn''t find numbers or words or any of the other values we move around
    in programs. Instead you would find millions of transistors. A transistor is really
    just an incredibly tiny on/off switch. When the transistor is on we give it the
    number 1, and when it is off we give it the number 0. In the end everything in
    a computer, no matter how complicated, comes down to 1s and 0s.


    We call each of these values a single bit (short for binary digit). Each bit can
    be set to 1 or 0. It''s the computer equivalent of an atom: deep down, everything
    in a computer is made of bits.


    # ### A bit more information


    Rather than work with bits directly though, early computer systems collected them
    into groups of 8, which was the smallest number of bits that could be read or
    written at a time. One of these groups of 8 bits is called a byte, and has room
    to store a single character (like ''a'' or ''+'').


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_49_0.png)'
  - '[PAGE 50]


    But even a byte is a really tiny amount of information. These days we need much
    bigger numbers! A kilobyte (kB) is 1,000 bytes, while a megabyte (MB) is 1,000,000
    bytes and a gigabyte (GB) is 1,000,000,000 bytes. There are bigger prefixes too:
    tera- means 12 zeroes, peta- 15 and exa- 18, but for a while at least those numbers
    are mostly the preserve of supercomputers!


    # ## Counting the bits we send


    When we talk about how much data is being sent between computers we talk about
    the bit rate – the number of bits per second. Just like with bytes we can have
    kilobits per second, megabits and so on. To keep things straight, when coders
    abbreviate megabytes they write MB (with a big B), but when they abbreviate megabits
    they write Mb (with a small b).


    Weirdly, the abbreviation of kilo- is a small k, while mega- and giga- are capital
    M and G respectively.


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_50_0.png)


    Oddly, sometimes a kilobyte means 1,000 bytes, and sometimes 1,024, while a megabyte
    can be 1024 × 1024 and so on. It''s because sometimes, as we''ll see on the next
    page, it''s more convenient if things are a power of 2. The two are pretty close
    to each other, so normally we don''t need to worry about which is being used.


    +   - bit ....................... 1

    +   - byte .................... 8 bits

    +   - kilo- ................. 1,000 bytes

    +   - mega- ............. 1,000,000 bytes

    +   - giga- .......... 1,000,000,000 bytes

    +   - tera- ....... 1,000,000,000,000 bytes

    +   - peta- .... 1,000,000,000,000,000 bytes

    +   - exa- ... 1,000,000,000,000,000,000 bytes!


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_50_1.png)'
