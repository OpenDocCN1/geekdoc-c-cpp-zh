    ## 巨像：第一台计算机


    如今，计算机无处不在，但直到 20 世纪 40 年代，“计算机”还是指以计算（做算术）为生的人，而不是机器。这是一份枯燥的工作，而且不可能不出错，因此工程师们想方设法制造机器来承担这项工作。


    ### 恩尼格玛


    第二次世界大战期间，双方军队通过无线电来回发送指令和报告，为了不让对方看懂，他们用密码对信息进行加密。英国在白金汉郡的布莱切利庄园组建了一支队伍来破解德国密码，招募了擅长数学、国际象棋和填字游戏的男男女女。到
    1941 年，在波兰密码破译者以及阿兰·图灵等人设计的机械计算设备的帮助下，他们已经能够读取由德国主要密码机“恩尼格玛”加密的信息。


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_13_0.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_13_1.png)


    > **有意思！**

    >

    > 巨像计算机的机密程度极高，战后只保留了少数几台，其余连同所有记录一起被销毁。所有知情者都被要求宣誓保密。因此，很长一段时间里，1946 年在美国制造的
    ENIAC 被认为是第一台计算机。直到 20 世纪 70 年代中期，关于巨像计算机的信息才公之于众。2007 年，人们建造了一台可运行的巨像 Mark 2
    复制机，可以在布莱切利庄园的国家计算博物馆中看到它的运转。


    ### 巨像


    但德国最高统帅部使用了自己的密码系统：洛伦茨，这是一种连图灵设计的机器也无法破解的复杂密码。需要另想办法。战前，图灵曾设想制造一台能解决任何数学问题的机器。这时，汤米·弗劳尔斯和马克斯·纽曼造出了这样一台机器。它被命名为“巨像”，利用电力和真空管进行计算。与以往任何机器不同，它是电子化且可编程的，因此可以被设置来解决任何数学问题。这就是第一台计算机！巨像
    Mark 1 于 1943 年 12 月完工，能以每秒 1000 个字符的速度从纸带上读取加密信息。Mark 2 于 1944 年 6 月完成，速度提高了五倍。借助这一新设备，布莱切利庄园终于破解了洛伦茨密码，读到了希特勒发给指挥官们的消息。人们认为，布莱切利庄园的密码破译工作将战争缩短了数年，挽救了数百万人的生命！


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_14_0.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_14_1.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_14_2.png)


    ## 文字与数字


    一个什么都不记得的计算机程序不会有什么用，所以即使是最早的计算机也有内存。计算机程序通过将信息存储在变量中来记住一条信息。


    当你第一次定义（使用）一个变量时，需要给它命名。之后在程序中引用这个名称时，你可以获取其中的值，或者把它改成别的值。使用 = 号设置变量的值，左边是变量，右边是你想赋予的值：


    ```python

    my_first_variable = 3        # create variable and give it the value 3

    print(my_first_variable)     # this will print out the value 3


    my_first_variable = 5        # change the value inside the variable to 5

    print(my_first_variable)     # and this will print the value 5

    ```


    ### 有意思！


    只要变量名中没有空格，你可以随意命名。给你的变量起有帮助的名字，这样你就不会忘记它们存储的是什么了！


    > 你可以在整数和浮点数之间进行转换，但从整数转换为浮点数很容易，反过来却可能会带来问题。例如，把 4.5 转换为 4 很容易，但如果你把 4.99 转换为整数，你会得到
    4，因为计算机总是向下取整。如果你没有预料到这一点，可能会得到奇怪的结果。


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_16_0.png)


    ### 数字类型


    计算机实际上将数字分为两种类型：整数和浮点数。整数是没有小数位的数字：5、7983、-6 和 0 都是整数。浮点数是带有小数位的数字，例如 1.29、-98.5
    和 0.00002。并非每种编程语言都关注这种区别，但很多都关注。如果需要区分，4 表示该数字是整数，而 4.0 表示它是浮点数。


    ### 单词


    除了数字，你还可以在变量中存储单词甚至句子！单个字母称为字符，而一个单词或句子称为字符串（因为它由一串单独的字符组成）。一个变量既可以包含单个字符，也可以包含整个字符串。字符串可以任意长——如果你愿意，可以把整本书存储在一个变量中！每当你使用字符串时，它都需要用引号括起来，就像“这样”。


    ## 运算符


    把值存储在变量中固然很好，但计算机在修改和组合这些值时才真正大显身手。计算机是为处理数字而发明的，而且它们非常擅长！


    要操作变量，你需要使用运算符。这其实只是加、减、除、乘以及其他一些运算的编程术语。加号和减号照常写作 + 和 -，但乘号写作 *（而不是 ×），除号写作 /（而不是
    ÷）。


    不过，你不仅可以把数字加在一起并存储在变量中，还可以把变量加在一起。在等号右边可以使用数字的任何地方，你都可以改用变量：


    ```python

    variable1 = 2 + 5


    variable2 = 11 - variable1


    variable3 = variable1 * variable2

    ```


    > 对整数进行除法时要非常小心，因为结果也会是整数。所以 `var2 / var1`，当 `var1` 是 5.0（浮点数）时，结果是 2.5；但当 `var1`
    是 5（整数）时，结果是 2，因为它向下舍入到最接近的整数。对整数进行除法时，最安全的做法是先转换为浮点数。


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_17_0.png)


    - `variable1` 将等于 7

    - `variable2` 将等于 4

    - `variable3` 将等于 28


    ### 赋值运算


    你可以把一个变量赋回给它自己，作为运算的一部分。例如，要让一个变量减去 2，你可以这样写：`my_variable = my_variable - 2`。


    这是非常常见的操作，所以有一组赋值运算符可以让你非常轻松地完成它：`+=`、`-=`、`*=` 和 `/=`。它们是一种简写方式，表示“我想对这个变量做这个操作”。因此，要让
    var 除以 3，你只需写 `var /= 3`。为了节省更多时间，还有更短的给变量加一或减一的方法：`++` 和 `--`。要让 var 加 1，你只需要写
    `var++`。


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_18_0.png)


    ### 有意思！


    虽然运算符主要用于包含数字的变量，但许多编程语言允许你通过“相加”来连接两个字符串。它们还允许你使用 `+=` 运算符在现有字符串变量的末尾添加更多文本。不过你不能对字符串进行减、除或乘运算，只能对数字！


    ### 最后一个运算符


    还有一个可用的运算符：`%`，它表示取模，作用类似于长除法中的余数。不过它并不常用，所以不用担心。


    ## 消灭 Bug


    计算机很笨。这并不意味着它们不擅长数学（事实上，它们非常擅长），但确实意味着它们会不折不扣地执行给它们的任何指令，即使这些指令毫无意义。


    计算机程序中的错误称为 bug。据说，其中一台最早的计算机不断算出错误的答案，直到操作员把它拆开，发现一只飞蛾卡在机器里——因此得名！如今，计算机不会再进飞蛾了，当它们出错时，是因为编程方式中存在错误。


    刚开始，你可能会因为代码中有 bug 而感到沮丧，但别担心，即使是专业程序员也会花大量时间查找和修复他们编写的代码中的 bug！


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_19_0.png)


    '
