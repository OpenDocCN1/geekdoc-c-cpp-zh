    > 定制任何继承自子类中定义函数的变量\n>\n> 可以访问父类中的变量和函数\n\n## 灵活变形\n\n这不仅是避免在每个子类中重复代码的好方法，而且还能让你在函数使用上非常灵活。任何时候，如果你的函数期望某个类作为其参数之一，你都可以用该父类的子类来代替——这是因为（用我们上面的例子来说）`husky()`\
    \ 类的实例也是 `dog()` 类的实例。这被称为多态。\n\n默认情况下，子类会继承父类拥有的所有变量和函数。子类也可以通过重写来改变父类的行为。要做到这一点，只需在子类中定义一个与父类具有相同签名（名称和参数）的函数，子类中定义的版本就会覆盖父类中的版本。这意味着每当该函数被调用时，都会使用子类中定义的版本，而不是父类中的版本。\n\
    \n![](img/862cb7d96d05319b069165a3aaaaa9d3_62_0.png)\n\n## 分享出去\n\n虽然一开始你可能为了学习编程或自娱自乐而编写程序，但编程最棒的部分是当你与他人分享你的程序时。\n\
    \n> 对于简短、直接的程序，先完成再让别人尝试是合理的。但对于大型复杂的程序，通常最好在还在开发时就与他人分享——人们给你的反馈可能是无价的。\n\n![](img/862cb7d96d05319b069165a3aaaaa9d3_63_0.png)\n\
    \n### Alpha 和 Beta\n\n当你的程序处于部分功能可用、但尚未全部完成的阶段时，你可能想与朋友和家人分享，让他们告诉你目前的看法。在软件编程中，这被称为\
    \ Alpha 版本。\n\n请他们告诉你他们喜欢什么，以及他们认为哪些地方可以改进。现在就询问，你可能会发现你想要改变程序的运作方式——现在就问比写完整个程序后再问更好！\n\
    \nBeta 版本是指你认为程序已经完成，但在你彻底解决所有 bug 之前的版本。同样，与朋友和家人分享，但现在请他们有意地仔细检查，看看是否能找到让程序崩溃的方法。这种“破坏—修复”循环被称为\
    \ Beta 测试（你向其提供程序的人被称为 Beta 测试者）。\n\nBeta 版本的目标是确保程序完全按照你想要的方式运行，并且用户在使用时不会遇到任何问题。\n\
    \n![](img/862cb7d96d05319b069165a3aaaaa9d3_64_0.png)\n\n![](img/862cb7d96d05319b069165a3aaaaa9d3_64_1.png)\n\
    \n![](img/862cb7d96d05319b069165a3aaaaa9d3_64_2.png)\n\n### 版本编号\n\n版本号是一种追踪你发布的程序所有不同版本的方法——版本越新，编号越高。传统上，程序的预发布（Alpha\
    \ 和 Beta）版本采用 0.x 的形式，如 0.1、0.2、0.14。每个新版本都会将小数点右侧的数字加 1。\n\n程序的第一个发布版本是 1.0——其中的“1”表示它已准备发布。之后如果你继续发布新版本、添加功能或修复\
    \ bug，你会再次递增小数点右侧的数字：1.1、1.7、1.16。如果你进行了重大更改，你可以将新版本称为 2.0，以表明这是你的程序的全新版本。\n\n\
    ## 代码之外\n\n编程不仅仅是编写代码。你看，如果你创造了世界上最棒的程序，却没有人知道如何使用它，那也无济于事。这就是文档和支持发挥作用的地方。\n\n\
    ![](img/862cb7d96d05319b069165a3aaaaa9d3_65_0.png)\n\n### 文档的重要性\n\n文档是解释如何使用程序的文字、图片，有时还有视频。在过去，程序通常装在一个大纸板箱里，因为除了程序本身（存储在\
    \ CD 或软盘上）之外，还会有一本厚重的印刷手册，包含所有说明。\n\n不过现在，文档更有可能在互联网上找到。理想情况下，你应该有文档告诉人们如何安装你的程序以及他们可以用它做所有事情。编写文档可能花费相当多的时间，而且通常不如编写程序本身有趣，但如果你打算把程序交给那些无法当面问你问题的人，它就至关重要。你还可能发现编写文档有助于改进你的程序：如果你发现自己难以解释如何做某件事，也许你的程序需要改变……\n\
    \n通常，放置程序使用文档的最佳位置是程序本身。有些程序附带教程，逐步引导用户完成某些任务，向他们介绍所有基础知识。许多程序还有帮助屏幕，当用户按下“?”图标时弹出页面——该屏幕可以告诉用户关于程序该部分的信息。\n\
    \n如果你发现人们不断询问关于你的程序的相同问题，你可以整理一个常见问题解答（FAQ，Frequently Asked Questions 的缩写）。这是一个文档页面，形式是一系列问题及每个问题的答案——这样人们就很容易找到他们可能遇到的常见问题的答案。\n\
    \n嗨！我能帮上什么忙吗？\n\n### 支持的角色\n\n专业的软件公司有支持人员，他们的工作是帮助用户理解程序并尽可能好地使用它们。这是公司免费提供程序但仍能赚到足够钱维持运营的一种方式——其他认为其软件真正有用的公司会付费购买支持，以充分利用这些程序，并处理他们遇到的各种问题。\n\
    \n## 类型之辨\n\n到目前为止，我们顺便提到有很多不同的编程语言。就像人类语言一样，它们都能表达相同的事物，但表达方式可能大不相同。有些编程语言大致相似，比如西班牙语和意大利语；有些则有着根本不同的方法，比如英语和粤语。\n\
    \n### 静态类型与动态类型\n\n语言类别之间的一个根本区别在于它们如何处理类型。类型指的是变量的内容：整数、字符串、用户定义的类等等。有些语言是静态类型的——这意味着变量必须始终包含相同的类型，通常是在变量创建时定义的。相比之下，动态类型语言意味着任何变量可以在任何时候包含任何类型，并且在程序运行过程中可以随时改变。\n\
    \n动态类型语言通常编写起来更快、更灵活，因为你不需要告诉程序你打算使用什么变量，也不必担心把错误的类型放入变量中。没有这些类型声明，代码最终也会更简洁。\n\
    \n静态类型语言的一大优势是，由于系统始终知道每个东西的类型，它可以在你运行程序时立即发现任何基于类型的错误（比如试图将字符串和数字相加），而动态类型语言只有在执行到程序的那一部分时才会出错。\n\
    \n![](img/862cb7d96d05319b069165a3aaaaa9d3_67_0.png)\n\n### 语言差异\n\n一般来说，使用动态类型等技术的简洁、灵活的语言被认为比编写较慢、更静态的语言更高级。这意味着它们离计算机真正运行的机器代码更远。随着时间的推移，越来越多的程序员转向更高级的语言，因为他们可以用更少的代码和时间完成更多工作。\n\
    \n尝试多种编程语言是值得的——不同的语言更适合不同的任务。通过学习新语言，你还会接触到可以应用于所有编程的新技术。\n\n### 真巧妙！\n\n动态类型语言有时需要检查某个变量是否为所需的类型。与其检查类型本身，通常不如只检查你想对它做的事情（比如将它加到另一个数字上）是否有效。这种技术被称为鸭子类型，源于下面的表达……\n\
    \n> “如果它走起来像鸭子，叫起来像鸭子，那它就是鸭子。”\n\n![](img/862cb7d96d05319b069165a3aaaaa9d3_68_0.png)\n\
    \n是的，我是一只鸭子\n\n"
