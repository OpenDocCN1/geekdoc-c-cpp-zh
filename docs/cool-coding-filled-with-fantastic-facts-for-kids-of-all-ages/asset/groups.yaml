    # ### Dealing with errors


    Some bugs the computer will tell you about as soon as you try to run the program.
    For instance, syntax errors are mistakes like writing ?= rather than /=. The computer
    doesn''t understand what that means and it will give you an error message, telling
    you what went wrong and where. Even if you don''t understand the error message,
    go and look at that line of code and you''ll often spot the problem right away.


    Another kind of bug is a runtime error. That''s when the computer understands
    your syntax, but at some point reaches an instruction it can''t follow, such as
    trying to divide a number by 0. At this point the program will crash and print
    an error message.


    # ### Tracking down bugs


    The worst bugs are when your program runs, but acts unexpectedly! In that case
    you''re going to have to go through your code and figure out why it''s not behaving.
    One trick is to add some print() commands to print out the value of important
    variables at various points in your program. By doing so you can track down the
    point when they stop having the values you expect. There are tools called debuggers
    that can do this sort of thing automatically, though they can be tricky to configure.


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_20_0.png)


    > > **That''s neat!**

    > >

    > > Sometimes you''ll not be able to figure out the error. If there''s no one
    you can ask, the best thing to do is to copy the type of error from the error
    message into a search bar. You''ll almost always find lots of web pages explaining
    what it means. Professional programmers resort to this all the time when they
    get stuck!'
  - '[PAGE 21]


    # # Being Logical


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_21_0.png)


    Logic isn''t just something Sherlock Holmes thinks about; your computer cares
    about it too.


    # ## Operating with logic


    Logic has its own type of variable. As well as numbers and strings, you can have
    a Boolean. A Boolean can have one of just two possible values: True or False.
    Booleans are the simplest type of variable it''s possible to have.


    Where things get interesting is when you combine Booleans together to create new
    ones. Rather than adding, dividing or subtracting, Booleans have their own operators,
    called logical operators: AND, OR and NOT.


    NOT (they are always written in caps) is the simplest: If b is equal to NOT a,
    then b is False if a is True, and vice versa. AND and OR are for when you combine
    more than one variable. If c is equal to a OR b then c is True if either of a
    or b is True (or if both are). If c is equal to a AND b then c is True only if
    both of a and b are True.


    All of this is much easier to understand with truth tables, which say whether
    the result will be True or False for all the possible inputs:


    **NOT – b equals NOT a**


    | a | b |

    |---|---|

    | True | False |

    | False | True |


    **OR – c equals a OR b**


    | a | b | c |

    |---|---|---|

    | False | False | False |

    | True | False | True |

    | False | True | True |

    | True | True | True |


    **AND – c equals a AND b**


    | a | b | c |

    |---|---|---|

    | False | False | False |

    | True | False | False |

    | False | True | False |

    | True | True | True |


    To write them in code, the operators have symbols rather than names. NOT is !,
    OR is || while AND is &&.'
