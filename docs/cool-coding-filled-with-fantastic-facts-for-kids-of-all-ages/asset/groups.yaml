    # # Keeping Things Tidy


    When you start writing a program it''s usually pretty easy to keep the whole thing
    in your head. But once it gets longer, or if you take a break and then come back
    to it, you may not remember why you did things a particular way. Keeping your
    code neat will make it a lot easier to work with. Here are a few tricks you can
    use.


    # ### Helpful names


    Rather than use cryptic, short variable or function names, use plain, descriptive
    names. If you have a variable that stores the number of cats a person has, name
    it `number_of_cats` rather than `c` or `noc`. And don''t reuse variables to store
    completely unrelated values later in the program (like reusing `number_of_cats`
    to store the room temperature), just create a new one – variables are free!


    # ### Short lines


    Try and keep your lines of code short enough that they always fit on your screen.
    That way you don''t end up having to scroll back and forth, and each line will
    be short enough that you can easily figure out what it does.


    # ### camelCase and snake_case


    Variables and function names can''t have spaces in, but programmers have come
    up with ways to still use multiple words in their names.


    One is to run all the words together and capitalise all the first letters after
    the initial one: `justLikeThis`. That''s called camel case, because the capital
    letters make it look a bit like the humps on a camel. The other way is to keep
    everything lower case but replace the spaces with `_`: `just_like_this`. That''s
    called snake case, because the names end up long and thin, like a snake.


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_53_0.png)'
