    ## 让物品变智能


    不只是个人电脑和智能手机始终在线。如今无线技术已经足够小巧、廉价，可以内置到各种设备中，连同控制它所需的传感器和微芯片。这意味着你现在可以买到恒温器、扬声器甚至灯泡，它们能通过互联网报告自身状态并接收命令，从而变得智能。


    可能用不了多久，你家里几乎所有电器都会连接到无线网络，共享数据，并可由你的智能手机或个人电脑控制。你可以让音乐从一个房间跟随你到另一个房间，在你不在时关掉暖气，并比以往任何时候都更好地控制你的个人电子产品。这种智能设备世界的愿景被称为物联网。


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_95_0.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_95_1.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_95_2.png)


    ### 掌控设备


    不过，作为程序员，你可以从物联网中获得更多好处。除了拥有智能手机应用外，许多这类智能设备还可以通过 API 控制，这意味着你可以自己编写代码来控制它们。API，即应用程序编程接口，是一组设备会监听的网络命令，以及说明这些命令是什么以及如何使用它们的文档。


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_96_0.png)


    ### 让设备更智能


    除了控制其他设备外，如果你正在制作自己的电子设备，比如机器人，那为什么不把它做成可通过无线控制的呢？这样，你就不必每次修改时都往它上面加载新代码，而是可以在你的个人电脑上编写控制代码，让它通过网络控制你的机器人。有些开发板，比如树莓派，内置了网络功能，而另一些，比如
    Arduino，则有相应的附加模块，并且二者都有相应的库，可以轻松地把你的机器人接入无线网络。


    ### 太棒了！


    虽然你可以自己编写网络和 API 代码，但通常你能找到适用于你的编程语言的软件库来替你完成这些工作，这样你只需要关心你希望设备做什么。只要有可能，你就应该利用这样的第三方库，而不是尝试自己编写所有内容。这会为你节省大量时间，而且由于有很多人使用相同的代码并报告任何问题，这些库可以被做得尽可能完善。


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_96_1.png)


    ## 回到过去


    版本控制系统包含你所做的每一组更改的历史记录。如果你发现自己犯了一些错误、弄坏了代码又不知道如何修复，你可以回退到较早的版本。你还可以通过差异（diffs）的形式准确查看你随时间所做的更改，差异会显示每次提交之间发生了什么变化。


    你的版本控制系统可以完全只在你自己的机器上本地运行，但也有免费的在线版本控制系统，比如 GitHub。它们有两大优势。因为它们是云服务，你可以从多台机器上处理代码，并且如果一台机器坏了还可以恢复。它们还让你非常容易与他人分享代码，因为仓库默认是公开的（任何人都可以查看）。


    ### 与他人协作


    确实，共享代码正是版本控制的真正价值所在——这是多个人在同一份代码上协作的最佳方式。它会跟踪每个人的更改，并帮助他们解决任何冲突。现代版本控制系统是分布式的，这意味着每个人都有一份仓库的本地副本。他们通过从主仓库拉取来获取更改，并将本地提交推送到主仓库。


    版本控制系统是协调开源项目的方式。提交不是直接推送到仓库中，而是以拉取请求的形式提交。了解代码的人随后会审查这些请求，要么接受它们进入主程序，要么退回并附上需要修复内容的评论。这意味着，如果你为一个大型项目做贡献，会有人审查你的代码并帮助你尽可能完善它。


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_98_0.png)


    ## 回归老派


    我们看过的脚本语言，比如 Python 和 JavaScript，并不是唯一被广泛使用的编程语言家族。现在我们将看一些较低级的语言，它们被用来编写许多每天在个人电脑上运行的程序。


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_99_0.png)


    ### C 和 C++


    其中，C 和 C++ 非常重要。C 是一种古老的语言，可以追溯到 20 世纪 70 年代初，而 C++ 是其更新版本，包含类以及许多其他改进。与大多数脚本语言相比，C++
    编码要求更高、速度更慢，但拥有许多强大的技术，比如通过指针直接访问计算机内存。C++ 及其同类语言不能直接运行；它们必须先经过编译。这是一个过程，程序员必须首先使用编译器程序将其程序转换为机器码。随后分发给用户的就是这个可执行文件。这意味着不同的操作系统需要不同的编译器和不同的可执行文件（因为它们的机器码不同）。


    然而，这个编译步骤确实意味着许多问题可以在编译时而不是程序运行时被发现。这通常也意味着代码运行得更快，因为它已经被转换成计算机可以直接运行的东西。由于这种速度以及该语言悠久的历史，有大量软件是用
    C 和 C++ 编写的，包括大多数计算机操作系统。


    ## 并行工作


    到目前为止，你看到的所有程序都涉及计算机一次执行一条指令。考虑到计算机的速度，这通常没问题。但有时你需要程序的各个部分同时独立运行，这就是并行性发挥作用的地方。


    ### 分支扩展


    并行性意味着同时并行运行程序的多个部分。就像树的枝干在生长过程中分裂成许多分支一样，你的程序也可以分叉成多个分支。这些分支中的每一个都称为线程或进程。每一个本质上都是自己独立且独立的程序，一次执行一条指令。


    那么为什么要并行运行呢？这样你就可以执行可能耗时很长的事情，而不会阻塞程序的其他部分。例如，程序的 GUI（见第 54 页）通常与程序的其余部分分开运行。这样一来，即使程序的主要部分需要长时间计算某些内容，用户仍然可以滚动和点击按钮，因为
    GUI 代码在独立运行。


    不过，你的代码分支需要通信：当用户在 GUI 中按下按钮时，你希望主程序中发生某些事情。编程语言有不同的方式来实现这一点。它们通常使用队列在分支之间传递消息——一个分支写入消息，另一个分支在空闲时读取该消息。


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_101_0.png)


    ### 加锁与解锁


    编写并行代码（有时称为多线程代码）可能会变得复杂。例如，不同的分支可以共享同一个变量，但如果不止一个分支试图同时使用它，就可能出现大问题。为了避免这种情况，有各种类型的锁（例如互斥锁和信号量），确保一次只有一个分支访问变量。如果另一个分支也想使用它，它必须等待第一个分支完成并解除锁。


    ### 太棒了！


    计算机实际上可以同时做不止一件事——现代计算机的 CPU 有双核、四核或更多核心，每个核心都可以运行一个线程或进程。不过，你可以拥有的进程数量远不止这些——CPU
    在进程之间非常非常快地切换，所以看起来就像所有东西都在同时运行！


    > 停住，等等！现在，走，走，走！


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_102_0.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_102_1.png)

    '
