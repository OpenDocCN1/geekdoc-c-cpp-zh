    # The world''s first computer programmer


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_39_1.png)


    Meet Ada. Ada Lovelace, born in 1815, was the world''s first computer programmer.
    This would be impressive enough, but she lived at a time when women weren''t expected
    to tackle anything much more complicated than embroidery. And to top it all off,
    she did all this a century before anyone actually built a computer...


    Daughter of the famous (and scandalous) poet Lord Byron, Ada was taught maths
    and science in an attempt to keep her from following in her father''s badly behaved
    footsteps, and she fell in love with the subjects. At 17 she met a man who would
    change her life: Charles Babbage.


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_39_2.png)'
