  md: '# Words and Numbers


    A computer program that couldn''t remember anything wouldn''t be very useful,
    so even the earliest computers had memory. A computer program remembers a piece
    of information by storing it in a variable.


    When you define (use) a variable for the first time you need to give it a name.
    Then when you refer to that name later in the program you can get at the value
    inside it, or change it to something else. You set the value of a variable using
    the = sign, with the variable on the left and the value you want to give it on
    the right:


    ```

    my_first_variable = 3

    print(my_first_variable)


    my_first_variable = 5

    print(my_first_variable)

    ```


    create variable and give it the value 3


    this will print out the value 3


    change the value inside the variable to 5


    and this will print the value 5'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# That’s neat!


    You can name a variable anything you like so long as it doesn’t have any spaces
    in it. Give your variables helpful names so that you don’t forget what they’re
    storing!


    > You can convert between integers and floating points, but while going from an
    integer to a floating-point is easy, going the other way can cause problems. Converting
    4.5 to 4, for example, but if you convert 4.99 to an integer you’ll get 4, but
    the computer always rounds down. This can lead to strange results if you’re not
    expecting it.


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_16_0.png)


    # Types of numbers


    Computers actually split numbers up into two types: integers and floating points.
    Integers are round numbers with no decimal places: 5, 7983, -6 and 0 are all integers.
    Floating point numbers are numbers with a decimal place, such as 1.29, -98.5 and
    0.00002. Not every programming language worries about the difference, but a lot
    do. If you need to distinguish, 4 means the number is an integer, while 4.0 means
    it’s a floating point.


    # Words


    As well as numbers you can store words and even sentences in variables too! An
    individual letter is called a character, while a word or sentence is called a
    string (because it’s made up of a string of individual characters). A single variable
    can contain an individual character or it can contain a whole string. A string
    can be as long as you want – you can store an entire book in a variable if you
    want to! Whenever you use a string it needs to be enclosed in quote marks, “like
    this”.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# # Operators


    Storing values in variables is all well and good, but computers come into their
    own when it comes to changing and combining those values. Computers were invented
    for number-crunching, and they''re very good at it!


    To manipulate variables, you use operators. This is really just a fancy programming
    term for plus, minus, divide and multiply, as well as a few others. Plus and minus
    are written + and - as normal, but multiply is written as * (not ×) and divide
    is / (not ÷).


    However, as well as just adding numbers together and storing them in a variable
    you can add variables together too. Any place you might use a number on the right-hand
    side of the equals sign you can put in a variable instead:


    ```

    ```text

    variable1 = 2 + 5


    variable2 = 11 - variable1


    variable3 = variable1 * variable2

    ```

    ```


    > > Be very careful when dividing integers, since the result will be an integer
    too. So `var2` when `var1` is 5.0 (a floating point) gives 2.5, but when `var1`
    is 5, an integer gives 2, since it rounds down to the nearest whole number. When
    dividing integers it''s safest to convert to floating point first.


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_17_0.png)


    > > variable1 will equal 7


    > > variable2 will equal 4


    > > variable3 will equal 28'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# ### Operators on assignment


    You can assign variables back to themselves as part of an operation. For instance,
    to subtract 2 from a variable you can do `my_variable = my_variable - 2`.


    This is so common that there are a set of assignment operators that let you do
    it really easily: `+=`, `-=`, `*=` and `/=`. They’re a shorthand way of saying
    ‘I want to do this to my variable’. So to divide var by 3 you can just write `var
    /= 3`. To save even more time there’s an even shorter way to add or subtract one
    from a variable: `++` and `--`. To add 1 to var you just need to write `var++`.


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_18_0.png)


    # ### That’s neat!


    While operators are mostly used on variables that contain numbers, many programming
    languages will let you join two strings by ‘adding’ them together. They’ll also
    let you add more text to the end of an existing string variable using the `+=`
    operator. You can’t subtract, divide or multiply strings, though, just numbers!


    # ### The remaining operator


    There’s one more operator available: `%`, which means modulus, and works like
    the remainder in long division. It doesn’t get used very often, though, so don’t
    worry about it.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# # Squashing Bugs


    Computers are dumb. That doesn’t mean they’re bad at maths (they’re incredibly
    good at it, in fact), but it does mean they will follow whatever instructions
    they are given to the letter, even if those instructions don’t make sense.


    A mistake in a computer program is called a bug. The story goes that one of the
    first computers kept producing the wrong answer until the operators took it apart
    and found a moth caught in the machinery – hence the name! These days, computers
    are moth-proof, and when they go wrong it’s because there’s a mistake in how they’ve
    been programmed.


    Initially you might feel bad about having a bug in your code, but don’t worry,
    even professional programmers spend lots of their time finding and fixing bugs
    in the code they’ve written!


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_19_0.png)'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# ### Dealing with errors


    Some bugs the computer will tell you about as soon as you try to run the program.
    For instance, syntax errors are mistakes like writing ?= rather than /=. The computer
    doesn''t understand what that means and it will give you an error message, telling
    you what went wrong and where. Even if you don''t understand the error message,
    go and look at that line of code and you''ll often spot the problem right away.


    Another kind of bug is a runtime error. That''s when the computer understands
    your syntax, but at some point reaches an instruction it can''t follow, such as
    trying to divide a number by 0. At this point the program will crash and print
    an error message.


    # ### Tracking down bugs


    The worst bugs are when your program runs, but acts unexpectedly! In that case
    you''re going to have to go through your code and figure out why it''s not behaving.
    One trick is to add some print() commands to print out the value of important
    variables at various points in your program. By doing so you can track down the
    point when they stop having the values you expect. There are tools called debuggers
    that can do this sort of thing automatically, though they can be tricky to configure.


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_20_0.png)


    > > **That''s neat!**

    > >

    > > Sometimes you''ll not be able to figure out the error. If there''s no one
    you can ask, the best thing to do is to copy the type of error from the error
    message into a search bar. You''ll almost always find lots of web pages explaining
    what it means. Professional programmers resort to this all the time when they
    get stuck!'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# # Being Logical


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_21_0.png)


    Logic isn''t just something Sherlock Holmes thinks about; your computer cares
    about it too.


    # ## Operating with logic


    Logic has its own type of variable. As well as numbers and strings, you can have
    a Boolean. A Boolean can have one of just two possible values: True or False.
    Booleans are the simplest type of variable it''s possible to have.


    Where things get interesting is when you combine Booleans together to create new
    ones. Rather than adding, dividing or subtracting, Booleans have their own operators,
    called logical operators: AND, OR and NOT.


    NOT (they are always written in caps) is the simplest: If b is equal to NOT a,
    then b is False if a is True, and vice versa. AND and OR are for when you combine
    more than one variable. If c is equal to a OR b then c is True if either of a
    or b is True (or if both are). If c is equal to a AND b then c is True only if
    both of a and b are True.


    All of this is much easier to understand with truth tables, which say whether
    the result will be True or False for all the possible inputs:


    **NOT – b equals NOT a**


    | a | b |

    |---|---|

    | True | False |

    | False | True |


    **OR – c equals a OR b**


    | a | b | c |

    |---|---|---|

    | False | False | False |

    | True | False | True |

    | False | True | True |

    | True | True | True |


    **AND – c equals a AND b**


    | a | b | c |

    |---|---|---|

    | False | False | False |

    | True | False | False |

    | False | True | False |

    | True | True | True |


    To write them in code, the operators have symbols rather than names. NOT is !,
    OR is || while AND is &&.'
  merge: -1
  img_proc: true
