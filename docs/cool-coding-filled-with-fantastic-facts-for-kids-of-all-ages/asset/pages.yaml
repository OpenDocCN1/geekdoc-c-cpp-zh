- pgno: 31
  md: '# # Testing, Testing


    We covered some of the mistakes it''s possible to make while coding on page 16.
    In order to ensure your program does what you want it to do you need to test it.


    Some techniques to effectively test your code are:


    +   - **Test often** Every time you make a small change, test your code. The smaller
    the code change, the easier it is to find and fix new bugs.

    +   - **Try to break things** Whenever you have an input, try deliberately entering
    incorrect values. Things that often cause problems include very long strings,
    empty strings ("") and negative numbers. These extreme inputs are called edge
    cases.

    +   - **Use ''undo''** When you''ve just added code that doesn''t work it''s often
    easier to use the undo function to step back to when it did work and then go forward
    line by line to find where the error came in.


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_31_0.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_31_1.png)'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# ## Testing as a job


    You might think that code developed by professionals would need less testing but
    that''s not actually the case: no one writes bug-free code. Companies selling
    their software want to have as few bugs in the programs as possible. So some people
    in software development are full-time testers: rather than writing code they spend
    their time testing code other people have written. When they find a problem they
    file a bug report that lists how to trigger the bug and what the effect is. The
    programmers then use the report to find and fix the bug.


    # ## Code-testing code


    Testing code is time-consuming and can be tedious, since you need to test the
    same thing over and over again to ensure it hasn''t been broken by a later code
    change. So these days there is a move towards more and more automated testing.


    Automated testing is essentially getting code to test itself. This involves writing
    more code that isn''t part of your main program but is instead a test harness
    (so called because it goes around the main code). This harness runs your main
    program automatically, putting in various inputs and checking the outputs. These
    harnesses can be system tests, which go around the whole program, or unit tests,
    which go around individual parts of the code.


    Writing these automated tests can seem like a waste of time compared to writing
    the program itself, but once you have them you''ll know straight away any time
    you accidentally break something. That makes bugs very easy to find and fix, and
    can save you time in the long run!


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_32_0.png)'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# # Code for CPUs


    There are a huge variety of programming languages out there, but one thing almost
    all of them have in common is that they are based on the English language. Even
    if you don''t know a programming language you can usually look at some simple
    code in that language and work out roughly what it is doing.


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_33_0.png)


    # ## Machine code


    Computers, though, don''t understand English. When they run a program they need
    it to be translated into machine code, instructions that their Central Processing
    Unit (CPU) understands. Machine code contains a very limited set of instructions
    that correspond to actual operations hardwired into the CPU.


    The very first computers were programmed directly in machine code but this was
    extremely tricky work: programmers had to calculate a very precise set of values
    on every line to instruct the CPU what to do. Worse, every type of CPU had its
    own different machine code, so a program had to be rewritten from scratch to run
    on another type of computer.


    Here''s an example of some machine code:


    ```

    ~~~

    77

    29 20 b3

    61 9e

    70

    0c b7 f6

    ~~~

    ```'
  merge: -1
  img_proc: true
- pgno: 34
  md: "# Assembly code\n\nAssembly code was invented in the 1950s as a way to make\
    \ programming somewhat simpler. Now the raw code was replaced by a set of short\
    \ instructions that were (sort of) English, like move, add, for move, jump for\
    \ jump and add, for well, add. The language also included things like variable\
    \ names to hold data. This assembly code could then be automatically turned into\
    \ machine code for the CPU to run.\n\n> **That's neat!**\n> \n> For a long time\
    \ programmers still used assembly code if their programs needed to be really small\
    \ and fast, but as other programming languages have advanced, the machine code\
    \ they automatically generate can often be better than the very best human-written\
    \ assembly code. Now there are only a few niche cases where it still makes sense\
    \ for people to write directly in assembly code.\n\nHere’s an example of some\
    \ assembly code:\n\n```\n```asm\nloop: add $t1, 1\n      bne $t1, $t2, end\n \
    \     jmp loop\nend:  nop\n```\n```\n\nAssembly code was easier to write than\
    \ machine code, but it was still slow going, and different for each type of CPU.\
    \ By the 1970s most programmers were using higher-level languages (so called because\
    \ they were further up from the CPU than low-level assembly language and machine\
    \ code) that were more like English. These higher-level languages are then converted\
    \ into machine code for the CPU to execute.\n\n![](img/862cb7d96d05319b069165a3aaaaa9d3_34_0.png)"
