- pgno: 81
  md: '# # Rise of the Robots


    Computer programs don’t just control PCs, smartphones and tablets; combine your
    code with some electronics and you can build yourself a robot! And it’s never
    been easier to get started with this sort of programming, no matter what your
    level of experience.


    # ## Getting started with robotics


    One way to get going is with a prebuilt robot – if you go online or visit an electronics
    or toy shop you’ll find lots of robot kits that you can program to perform tasks.
    Many of these will have a very simple drag-and-drop programming language you can
    get started with, but some will allow you to use more complex languages to write
    your own programs once you get the hang of things.


    You can also give building your own robot a try – your first few may not be as
    sophisticated as these kits, but you’ll learn a lot and it’ll be all your own.
    To do this you’ll first need a dev (development) board.


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_81_0.png)'
