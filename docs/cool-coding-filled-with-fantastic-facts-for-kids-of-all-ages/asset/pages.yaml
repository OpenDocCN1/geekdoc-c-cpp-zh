- pgno: 103
  md: '# # Supercomputing


    Back when computers were first invented they took up an entire room, but now a
    computer fits under a desk or in the palm of your hand. And yet there are still
    computers that take up whole buildings: these are the supercomputers.


    > > **That''s neat!**

    > >

    > > As well as the weather, supercomputers have long been used to design and simulate
    the destructive weapons in existence: atomic bombs. While that may not seem particularly
    appealing, trade with? ... countries with atomic weapons agreed they would no
    longer use them on each other in the event of war, but would instead simulate
    them, using supercomputers.


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_103_0.png)


    # ## Up, up and away!


    Supercomputers are incredibly powerful machines that are used to solve mind-bogglingly
    complicated problems. The most common are simulating very complex real-world systems,
    such as weather patterns (so we can predict when it will rain), or how problems
    fold up (to find new medical cures).


    Since there''s a limit to how large a single CPU (see page 52) can be, supercomputers
    are actually made up of thousands of individual CPUs connected together. The programs
    that run on them are written to be massively parallel: the calculations are split
    up into thousands of tasks which are then distributed to the individual CPUs.


    # ## Rent your own supercomputer


    Supercomputers cost many millions of pounds, which obviously puts them out of
    reach of pretty much everyone. And yet, with the advent of cloud computing, it''s
    now possible to rent computing time by the minute. So a scientist who needs a
    supercomputer to solve a particular problem can simply rent as much computing
    power as she needs for an hour or so to run her program, getting temporary access
    to her own supercomputer for just a few hundred pounds.'
  merge: -1
  img_proc: true
- pgno: 104
  md: '> > That''s SUPER on a massive scale!


    # That''s neat!


    Supercomputers'' speeds are measured in flops, short for floating-point operations
    per second - essentially how many sums they can do per second. When this book
    was written the most powerful supercomputer in the world was made of more than
    40,000 individual CPUs, each with 256 cores. The computer runs at almost 100 petaflops,
    meaning it can do nearly a quadrillion (a million billion) calculations a second.
    And yet by the time you read this there may well be something faster . . .'
