  md: '# # Beyond the Code


    There''s more to coding than just writing code. You see, it doesn''t matter if
    you have created the most fantastic program in the world if no one can figure
    out how to use it. That''s where documentation and support comes in.


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_65_0.png)


    # ## Documentary evidence


    Documentation is the words, pictures and sometimes videos that explain how to
    use your program. In the old days programs would come in a big cardboard box,
    because along with the program itself (on CD or floppy disk) would be a hefty
    printed manual that would contain all the instructions.


    Now, though, documentation is much more likely to be found on the internet. Ideally
    you should have documentation that tells people how to install your program and
    all the things they can do with it. Writing documentation can take quite a bit
    of time and often isn''t as much fun as writing the program itself, but it''s
    vital if you plan to give the program to people who


    won''t be able to ask you things in person. You may also find writing the documentation
    helps improve your program: if you find yourself having trouble explaining how
    to do something, maybe your program needs changing ...


    Often the best place to put documentation on how to use your program is into the
    program itself. Some programs come with tutorials that walk a user step-by-step
    through certain tasks to introduce them to all the basics. Many also have help
    screens, pages that pop up when the user presses a ''?'' icon – that screen can
    then tell them about that part of the program.


    If you find people keep asking you the same questions about your program you can
    put'
