- pgno: 35
  md: '# # Code that Thinks


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_35_0.png)


    For as long as computers have existed, people have dreamed of them thinking for
    themselves. This is called Artificial Intelligence, or AI.


    > > Crikey, he''s good!


    # ## Computers playing chess


    For a long time in Western culture the game of chess has been considered the pinnacle
    of cleverness: it''s why movies and TV so often show smart people playing it.
    So early computer scientists spent a lot of time teaching computers to play chess.
    They felt that if they could do that, they could do anything.


    However, it turns out that chess is actually far easier for a machine to master
    than something humans find trivial, like recognising a cat in a picture. In 1996
    a supercomputer named Deep Blue beat Garry Kasparov, the world chess champion,
    but computers today are still less good at recognising cats than a three-year-old.


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_35_1.png)'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# ## Beyond chess


    Chess programs are an example of rules-based systems: humans understand how to
    play chess, so programmers write a bunch of rules for the program to follow. However,
    this approach doesn''t work well for things we find it difficult to put into rules,
    such as identifying whether a picture has a cat in it. You can do it yourself
    easily, but can you break down precisely how, step by step?


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_36_0.png)


    Lots of recent research has gone into machine learning. Here we provide a framework
    for the computer to learn for itself, and then provide a large body of data for
    it to learn from (such as a lot of pictures, some with cats, some without). By
    running through all the data, the computer uses that framework to automatically
    build up a way to solve the problem. To do this we need clever frameworks like
    neural networks, and as much data as possible. Fortunately, the internet has an
    unlimited number of cat pictures!


    # ## Code that really thinks


    The real dream of many computer scientists is a machine that is truly intelligent.
    Back in 1950, Alan Turing invented the Turing Test to determine if a computer
    really is intelligent. The test involves a person having a conversation with someone
    they can''t see. If they think it''s a person and it turns out to be a computer,
    then that computer can be considered to be intelligent. No computer program has
    managed to beat this test yet, but coders are trying to produce one that can.
    Can you imagine what the implications would be if they managed it? After all,
    such a program could be considered to be alive. . .


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_36_1.png)'
  merge: -1
  img_proc: true
- pgno: 37
  md: "# # Dealing with Data\n\nWe've met variables, which let us store pieces of\
    \ information, but what if we have a bunch of data, like the marks everyone in\
    \ your class got on a test? Rather than creating lots of variables, we can create\
    \ a single thing that can store lots of different values.\n\nSome programming\
    \ languages call these arrays, some call them lists. If a variable is like a box\
    \ that you can keep a value in, then an array is like a chest of drawers, with\
    \ each drawer able to store an individual value.\n\n# ## Creating arrays\n\nTo\
    \ use arrays we need another kind of bracket - [ ]. These are called square brackets.\
    \ When we create arrays, we put all the bits of data (which we call elements when\
    \ they're in an array) inside these square brackets, separated by commas.\n\n\
    > > create an array containing three elements\n\n```\n    my_first_array = [1,\
    \ 3, 5]\n```\n\nOnce you have data in an array you can read or change individual\
    \ elements. To tell the program which element we want to access we give it an\
    \ index, like a page number in a book. It's just the number of the element we\
    \ want, counting from the beginning of the array.\n\n> > Unlike humans, computers\
    \ start counting at 0. So the index of the first element in the list is 0, the\
    \ second element is 1, and so on. It's easy to forget this one, so don't feel\
    \ bad if it trips you up occasionally.\n\n![](img/862cb7d96d05319b069165a3aaaaa9d3_37_0.png)\n\
    \n![](img/862cb7d96d05319b069165a3aaaaa9d3_37_1.png)"
