- pgno: 56
  md: '# Memory


    Your computer can fit lots of things in its storage, but can

    only read and write to it fairly slowly (compared to how

    quickly the CPU can do things, that is). To speed things up

    the computer has another kind of fast storage called the

    memory or RAM (short for Random Access Memory). The

    computer''s RAM is much faster than its storage, and it''s

    where programs and other files are kept while they''re being

    used. It''s more expensive than storage, though, so you''ll

    have less space in memory than in storage. It''s also volatile,

    which means that it needs constant power to remember

    things - when you switch the computer off it forgets

    everything in its memory.


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_56_0.png)


    # Input/Output


    Along with those core

    internals, computers

    also have input devices,

    like mice, keyboards,

    and touchscreens,

    which allow you to

    communicate with

    them, and output

    devices, like displays

    and speakers, that

    let the computer

    communicate with

    you. Since these are

    often not built directly

    into the machine most

    computers have ports

    that let you plug them

    in. External devices

    like mice and speakers

    that connect to the

    computer are called

    peripherals.'
