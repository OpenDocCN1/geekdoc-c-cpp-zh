    # ## Comments


    You can include comments in code. Comments are messages that you can use to remind
    yourself or anyone else who reads the code about what a function is doing or what’s
    happening in a particular place. Their syntax varies, but starting with // is
    a common way to write them. In this book we''ve replaced traditional comments
    with graphics boxes to make them easier to follow, but a typical example (from
    page 22) would be:


    ```

    ```

    print("Hello, world!") //

    remember, you need to put

    quote marks around strings

    ```

    ```


    You can end up overusing comments – don''t use them when the code is already obvious.
    A good rule of thumb is to write a comment to explain what each function is meant
    to do, and also any time you write a particularly complicated piece of code.'
