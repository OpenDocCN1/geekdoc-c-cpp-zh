- pgno: 26
  md: '![](img/862cb7d96d05319b069165a3aaaaa9d3_26_0.png)


    # **Reading things in**


    Just as you can have a program write text out, you can have it read text in too!
    How precisely a program reads from the keyboard varies from language to language:
    you can read a single character (key press) at a time or a whole string until
    the user hits enter. Once you’ve done so, you can go ahead and store that input
    in a variable.


    If you want your user to enter a number there''s one more step. You see, to a
    computer the string “12” is different from the number 12; the first is a string
    just like “elephant” or “football”, not a number it understands. To change from
    a string into a number you need to tell the program to convert it: a function
    like int("12") will convert it to the integer 12, while float("12") will turn
    it into the floating point number 12.0.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# # Punching In


    In these days of touchscreens a keyboard may seem like a clunky way to write a
    program, but in the old days programs were stored and fed into computers using
    a far less convenient format: punched cards.


    These were actual, physical cards with a series of holes punched in them. A computer
    read them by shining a light at the card and using a light sensor to determine
    if a particular hole had been punched or not, translating the cards into 1s and
    0s.


    # ## Cards and computers


    Punched cards actually predate the computer itself. They were first used way back
    in the early 1800s to control mechanical looms that weave patterns into cloth:
    the cards held the patterns to be woven. Back then there were no light sensors,
    so instead the cards were read by mechanical sensors that ran along the surface
    of the card. The cards had to be really thick and tough to survive being read
    this way!


    Mechanical calculating machines in the 1800s and early 1900s used punched cards
    to store data and programs. Colossus, the first computer, read the messages it
    was working on from a paper tape with holes punched in it.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# ### Working with holes


    In the 1950s and 60s programmers would work out the program they wanted to run
    on paper, and then punch it into a series of cards using a keypunch, a device
    like a typewriter that would punch out holes in all the right places. One mistaken
    punch and the card would need to be thrown away. A complicated program could be
    hundreds or even thousands of cards arranged in precise order - woe betide anyone
    who knocked over one of these stacks!


    As computers became more numerous and more powerful demand for punched cards rose
    too - by 1967 America alone was getting through two billion punched cards every
    year! But the taller and taller stacks of cards needed for more complex programs
    were becoming increasingly impractical, and by the 1970s a new technology, magnetic
    tape, began to replace the punched card as a way of inputting data to a computer.
    In these days of flash drives and Wi-Fi it''s amazing to think that people used
    to have to rely on stacks of cards to pass data to a computer!


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_28_0.png)'
