- pgno: 38
  md: '# # Accessing data


    To access a particular element, we use square brackets again, containing the index
    of the element we want. So `x[0]` means the first element in an array named `x`.
    If we just say `x` with no brackets, we''re referring to the whole array.


    ```

    ~~~

    my_second_array = [2, 5, 6, 8]

    print(my_second_array[0])

    >> 2

    ~~~

    ```


    > > Now just print out the first element - remember, array indexes start at 0!


    > > let''s change the second value (so index of 1)


    ```

    ~~~

    my_second_array[1] = 3

    print(my_second_array)

    >> [2, 3, 6, 8]

    ~~~

    ```


    > > And now, let''s print the whole array!


    You can do lots of neat things with an array, like check how many elements it
    has, rearrange the order, add elements to it or take them out. If you do take
    an element out then all the ones after it move up, like taking a carriage out
    of the middle of a train.


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_38_0.png)'
