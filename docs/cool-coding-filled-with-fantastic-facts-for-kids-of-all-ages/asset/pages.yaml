  md: '# ### Python


    Python is another popular scripting language. It''s very easy to develop large
    programs in, as there are lots of libraries that can easily be added on to provide
    extra capabilities. It also has a very well-developed class and inheritance model,
    making it easy to do object-oriented programming.


    While Javascript''s syntax is shared with many earlier programming languages,
    Python has its own way of doing lots of things. For instance, rather than curly
    brackets Python uses indentation (putting spaces before lines) to define code
    blocks. And while Javascript tends to use things like for loops and checking return
    values for errors, Python code has other ways of solving the same problem, like
    iterators and exceptions. So if you do get into Python (and you should – it''s
    a great language), read some tutorials on how to get the most out of its way of
    doing things.


    > > Ahhh, ssssssscripting!


    # ### Others


    There are lots more scripting languages out there too, such as Ruby, Lua, PHP
    and Perl. Each one has its own strengths and uses, so don''t be scared to tackle
    a new one if it comes along!


