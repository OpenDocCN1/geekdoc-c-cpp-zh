  md: '# # Welcome to Cool Coding


    I learned to program in an old bomb shelter. The school had built it during the
    Second World War, but by the time I arrived it had been turned into the Computer
    Club. We all wanted to play games on the computers, so I got my first taste of
    programming copying code from computing magazines line by line. At first I didn’t
    know how the programs I was copying worked, but then I began to experiment and
    to write my own. Soon I was hooked.


    Coding is logical, like a puzzle, but one with lots of possible solutions so you
    never get too stuck. Coding is creative: you can make games and tools and apps
    that you can share with friends and family. Coding doesn’t need lots of equipment,
    doesn’t make a mess, and can be something you do on a rainy day, or before it’s
    time to go to bed. Boys and girls, young kids and retirees, people all over the
    world write code and share it with one another.


    I still love coding today. It’s my job now, and it’s still my hobby, and with
    this book I hope I can get you excited about it too. Not only will the book teach
    you about the fundamental concepts of programming, but it’ll tell you about useful
    tools and techniques, about how computers were used in the past and what they’ll
    be able to do in the future, and it’ll hopefully inspire you to go and write some
    code of your own!'
  merge: -1
  img_proc: true
