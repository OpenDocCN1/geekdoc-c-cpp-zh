- pgno: 67
  md: '# Not My Type


    So far we''ve mentioned in passing that there are lots of different programming
    languages. Just like human languages, they can all express the same thing, but
    they do so in ways that can be very different. Some programming languages are
    broadly similar, like Spanish and Italian, while some have fundamentally different
    approaches, like English and Cantonese.


    # Static vs dynamic typing


    One fundamental difference between categories of languages revolves around how
    they treat types. Types refer to the contents of a variable: integers, strings,
    a user-defined class and so on. Some languages are statically typed – that means
    that a variable must always contain the same type, often defined when the variable
    is created. In contrast a dynamically typed language means that any variable can
    contain any type at any time, and it can change at any time throughout the program.


    Dynamically typed languages are generally quicker to write and more flexible,
    since you don''t need to tell the program what variable you''re planning to use,
    or worry about putting the wrong type into a variable. The code also ends up being
    more concise without all the type declarations.


    The big advantage of statically typed languages is that because the system always
    knows what type everything is, it can catch any type-based mistakes (like trying
    to add a string and a number together) as soon as you run it, whereas dynamically
    typed languages will only fail when they reach that part of the program.


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_67_0.png)'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# ### Linguistic differences


    Generally speaking, concise, flexible languages that use techniques like dynamic
    typing are considered higher level than slower to write, more static languages.
    This means they are further removed from the machine code that the computer actually
    runs. Over time more and more programmers have moved to higher level languages,
    as they can get more done with less code and time.


    It''s worth trying out multiple programming languages - different languages are
    better suited to different tasks. By learning new languages you''ll also be exposed
    to new techniques that you can apply to all your programming.


    # ### That''s neat!


    Dynamically typed languages will sometimes need to check whether a particular
    variable is of the type needed. Rather than check the type itself, it can often
    be better to just check whether the thing you want to do to it (like add it to
    another number) is valid or not. This technique is called duck typing, from the
    expression...


    > > "If it walks like a duck and quacks like a duck, it''s a duck."


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_68_0.png)


    Yep, I''m a duck'
