- pgno: 39
  md: '![](img/862cb7d96d05319b069165a3aaaaa9d3_39_0.png)


    # The world''s first computer programmer


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_39_1.png)


    Meet Ada. Ada Lovelace, born in 1815, was the world''s first computer programmer.
    This would be impressive enough, but she lived at a time when women weren''t expected
    to tackle anything much more complicated than embroidery. And to top it all off,
    she did all this a century before anyone actually built a computer...


    Daughter of the famous (and scandalous) poet Lord Byron, Ada was taught maths
    and science in an attempt to keep her from following in her father''s badly behaved
    footsteps, and she fell in love with the subjects. At 17 she met a man who would
    change her life: Charles Babbage.


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_39_2.png)'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# The Difference Engine


    Babbage was an engineer, astronomer and inventor. Being an astronomer back then
    involved doing a lot of sums, and Babbage wanted to make a machine to do them
    for him: a machine would never get bored and wouldn''t make mistakes.


    This was the 1820s, though. There were no computer chips, no transistors, not
    even any electricity. But that didn''t stop Babbage. His machine would be made
    of nothing more than cogs, gears and other mechanisms. He named it the Difference
    Engine.


    Babbage spent 20 years and huge sums of government money on the project, but the
    technology of the time just wasn''t up to the challenge, and he could never get
    the machine to work.


    When Ada met Charles, he told her about a new idea of his. It was an even more
    complicated machine, the Analytical Engine, which could do any sort of calculations.
    This was the first time anyone had thought of a computer. Ada was fascinated by
    the whole idea, and helped Babbage figure out how it could work. By doing so she


    # That''s neat!


    Ada never saw a real computer, but modern engineers have named a programming language,
    Ada, after her.


    # The Analytical Engine


    became the first person to ever work out how to program a computer. The Analytical
    Engine was never made either, but that didn''t stop Ada figuring out how to use
    it. And while Babbage was still thinking in terms of doing simple mathematics,
    she foresaw that one day computers would do amazing things, even composing music!


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_40_0.png)'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# # Making Things Functional


    So far all the program examples you''ve seen have been of a single set of instructions,
    executed in order. However, all but the simplest programs rely on functions: blocks
    of code split out that can be called from other places in the program. Functions
    let you write code in manageable chunks, and save you from copy/pasting code if
    you need to do the same thing in different places.


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_41_0.png)


    # **Getting into a function**


    Function definitions often start with a keyword that varies from programming language
    to language, like *function* or *def*. Then your function needs a unique name
    (which, like a variable, can''t contain any spaces). After the name comes a set
    of brackets that can contain a number of arguments. These are variables that are
    passed into your function that you can then use inside it. Finally, you add some
    curly brackets. These define the code block that gets run as part of the function.


    You can call a function from anywhere in the code by writing the name of the function
    followed by a pair of brackets containing the same number of variables as in the
    function definition. You''ll notice this looks like calling the *print* statement.
    That''s because print is a function defined by the language itself, that works
    just like the ones you can define.


    > Variables declared in an argument or inside the code block are scoped to that
    block: they don''t exist outside it. This means you don''t need to worry about
    reusing variable names; so long as you don''t reuse them within the same block
    you''re fine.'
  merge: -1
  img_proc: true
- pgno: 42
  md: "# Getting out of a function\n\nYour code block can contain any code you like,\
    \ plus a new, special statement: `return`. When the program reaches a `return`\
    \ statement it immediately exits the function and jumps back to the line it was\
    \ called from without executing the rest of the function code. If you just put\
    \ `return` it will jump back on its own. If you put `return` and then a variable\
    \ or value it will return with that value. If the code reaches the end of the\
    \ function without hitting a `return` statement it will return without any value.\n\
    \n```\n```python\nfunction calculate_square(my_var)\n{\n  result = my_var*my_var\n\
    \  return result\n}\n\nvar = calculate_square(3)\nvar = calculate_square(var)\n\
    print(var)\n>> 81\n```\n```\n\ndefining a function with one argument\n\nreturn\
    \ the 'result' variable\n\ncall the function passing in '3' as the argument\n\n\
    call it again on the result"
