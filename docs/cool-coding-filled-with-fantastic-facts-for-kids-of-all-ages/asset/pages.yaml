  md: '# # How Things Change


    **UNIVAC I (1951)**


    The first computer ever sold, UNIVAC I (UNIVAC Automatic Computer), weighed twice
    as much as a full-grown African elephant, and required as much power as 250 British
    homes. It cost over £25 million in modern money. Despite the hefty size and price
    tag, 46 UNIVACs were bought, and were used for everything from predicting election
    results to modelling atomic explosions!


    **PDP-8 (1965)**


    The PDP-8 was the first successful ‘mini-computer’. ‘Mini’ here was a relative
    term: it was small relative to the mainframes like UNIVAC but it was still the
    size of a wardrobe and cost $18,500 (around £100,000 today). Despite being designed
    to be as cheap and simple as possible, improvements in technology meant it was
    50 times faster than UNIVAC I. PDP-8 was hugely successful, and over 300,000 were
    sold in a range of models.


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_73_0.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_73_1.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_73_2.png)


