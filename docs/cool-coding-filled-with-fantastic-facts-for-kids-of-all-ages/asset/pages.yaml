    else if (my_val < 3):\n    print(\"Your number was less than three\")\nelse:\n\
    \    print(\"To get here, your number must be more than three\")\n    print(\"\
    Remember, you can have as much code as you like inside a block!\")\n```\n```\n\
    \n![](img/862cb7d96d05319b069165a3aaaaa9d3_30_0.png)\n\nYou can have lots of else\
    \ if statements, one after another, if you like. The code will fall down the set\
    \ of conditional statements like a waterfall until it finds one that is True,\
    \ at which point it will run the code inside that block.\n\n![](img/862cb7d96d05319b069165a3aaaaa9d3_30_1.png)\n\
    \n# ### That's neat!\n\nYou can put any code inside the block you put after a\
