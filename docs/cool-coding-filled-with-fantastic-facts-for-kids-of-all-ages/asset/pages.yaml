  md: '# What Is a Program?


    A computer that doesn’t know what to do is just a very expensive paperweight.
    A program is what makes the computer play games, make music and draw images. A
    program tells the computer what to do.


    # Following instructions


    A program is like the list of instructions for assembling a heap of plastic toy
    bricks into a castle: a set of individual directives for the computer to carry
    out. Each individual instruction is only a very small step, like connecting two
    bricks together, but by the time the program is complete amazing things can be
    accomplished.


    Just like a list of instructions, a program is read from top to bottom. Each line
    in the program is a statement, giving the computer an action to carry out. When
    that action is complete the computer will go on to the next line in the program,
    and so on until it reaches the end, when it will stop. A computer won’t get bored
    or lose its place:


    It’ll keep following the program no matter how long it takes (though computers
    carry out instructions really quickly!).


    # Our first program


    Computer programs are also called code, and a person who writes a computer program
    is called a coder or a programmer. That can be a person’s job, but lots of people
    write programs for fun, including kids! Once you’ve written a program you can
    tell the computer to run it; that means the computer will follow the instructions
    and carry out the actions.


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_11_0.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_11_1.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_11_2.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_11_3.png)'
