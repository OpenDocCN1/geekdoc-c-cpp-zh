- pgno: 63
  md: '# Getting Out There


    While to begin with you may be writing programs to learn about coding or for your
    own amusement, the best part of programming is when you share your programs with
    other people.


    > For short, straightforward programs it makes sense to finish them and then let
    others have a go. But for large and complicated programs it often makes sense
    to share them with other people while you are still working on them – the feedback
    people give you can be invaluable.


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_63_0.png)


    # Alpha and beta


    Once you have a program at a stage where some of it works, but before you''ve
    finished all of it, you may want to share it with your friends and family, so
    they can tell you what they think so far. In software programming this is called
    an alpha release.


    Ask them to tell you what they like about it and what they think could be better.
    By asking now, you might find you want to make changes to how your program works
    – better now than after you''ve written the whole thing!


    A beta release is when you think the program is done, but before you''ve necessarily
    ironed out every bug. Again, share it with friends and family, but now ask them
    to deliberately go through and see if they can find ways to break the program.
    This break-fix cycle is called beta testing (and the people you give it to are
    called beta testers).


    The idea of a beta is to make sure the program works precisely the way you want
    it to and that your users won''t have any issues with it.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '![](img/862cb7d96d05319b069165a3aaaaa9d3_64_0.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_64_1.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_64_2.png)


    # # Versioning


    Version numbers are a way to keep track of all the different versions of a program
    you give out – the newer the version, the higher the number. Traditionally, pre-release
    (alpha and beta) versions of a program are given versions of the form 0.x, so
    0.1, 0.2, 0.14. Each new version increases the number on the right side of the
    dot by one.


    The first release version of a program is 1.0 – the ‘1’ shows it’s ready for release.
    If you keep producing versions after that, adding features or fixing bugs, then
    you once again increment the number on the right side of the dot: 1.1, 1.7, 1.16.
    If you ever make some really big changes you can call the new version 2.0 to show
    it’s a completely new version of your program.'
