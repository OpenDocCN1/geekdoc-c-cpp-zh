- pgno: 84
  md: '> > **That''s neat!**

    > >

    > > You might have noticed that nothing here talks about creating files. That''s
    because if you tell your program to open a file, and that file doesn''t exist
    yet, the computer will go ahead and create it for you!


    The open statement will return a file object – this is a representation of the
    file within your program that you can then read from and write to. Reading means
    getting data from the file into your program, and writing puts data from your
    program into the file. The syntax for doing these things is often very similar
    to how you get input from the keyboard and write it to the screen. Once you''ve
    finished using your file, you call the close statement on the file object to stop
    using it.


    # ## Restricted access


    By default, when you open a file you can read from and write to it, but in many
    cases you''ll only want to do one or the other. In that case it''s best to open
    the file as read-only or write-only. This means your program will only be able
    to do one of those two things to it. This is particularly handy if you just want
    to read data from a file – it means you can''t accidentally write to it and mess
    it up!


    Filenames generally end in a dot and then a few letters to define what type of
    file this is – this is the file extension. For instance, files containing text
    end in .txt, while .jpg and .gif are picture formats. You may find your computer
    hides these by default, in which case you''ll need to go online and find out how
    to make them visible.


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_84_0.png)'
