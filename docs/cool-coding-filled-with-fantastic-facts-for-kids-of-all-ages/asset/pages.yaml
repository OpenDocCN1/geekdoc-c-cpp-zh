- pgno: 91
  md: '# # Playing Games


    Since the first computer was built, programmers have been working out how to use
    them to play games! Pong, a black-and-white tennis game that involved two white
    rectangles for rackets and a square for the ball, came out in 1972 as a coin-operated
    arcade game, and by 1974 was available for home users.


    These days the biggest video games, called AAA or triple-A games, require teams
    of hundreds of programmers, artists and testers to work for years, and can cost
    more than £100 million to develop. They feature cutting-edge 3D graphics and often
    push computers to the very limit of their capabilities.


    # ## Indie gaming


    However, these aren''t the only games out there. Recent advances in the tools
    available to coders has led to an explosion of indie games, produced by single
    programmers or small teams, often working in their spare time. The ease with which
    these games can be developed means that coders can experiment with gameplay and
    create amazing new types of game. Minecraft, perhaps the biggest computer game
    in the world, was created by a single programmer as a hobby project!


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_91_0.png)'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'Smartphones and tablets have also provided another great way for individuals
    to develop games; they lend themselves well to small, simple games that a single
    person or small team can develop. Their app stores make it easy to distribute
    games, and for people to potentially even make some money from games they develop
    as a hobby.


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_92_0.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_92_1.png)


    # Game engine-ering


    The tools that have made these indie games possible are called game engines. These
    are systems that come with functions to handle 2D and 3D graphics, networking,
    sound, file IO and everything else needed to create a game. They also come with
    assets like 3D models, music and so on that you can use in the game. You can also
    download additional assets from the internet, some for free, and some in exchange
    for money.


    To make a game you then need to write your own code to tell the engine what to
    do in every circumstance. Each engine has different commands, and will support
    different programming languages – some are very easy to use, while others are
    more complicated and powerful. Some are for developing games for PCs, some for
    the web, and some for smartphones.


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_92_2.png)'
