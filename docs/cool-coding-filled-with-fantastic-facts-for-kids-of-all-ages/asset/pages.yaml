  md: '# # Scripting Languages


    Programming languages fall into a number of families that share particular ways
    of working. One of the most popular of these is scripting languages. Scripting
    languages don''t always produce the fastest-running code, but they focus on being
    quick and compact to write and run, and are usually dynamically typed. This makes
    them a great set of languages to get started with.


    # ## Javascript


    Javascript has seen a huge explosion in popularity in recent years. On the surface
    it''s a straightforward scripting language – its syntax is nice and simple, and
    is shared with a lot of other languages like C++ and Java. The code examples in
    this book are inspired by Javascript.


    What makes Javascript so important is that it is supported by web browsers, so
    it can be included in web pages. This makes it really easy to get started with
    Javascript and to share your programs with others. Javascript can also run outside
    of browsers like any other scripting language using interpreters like node.js.


    > > **Watch out!**

    > >

    > > For simplicity the examples in the book skip some bits of Javascript syntax,
    like declaring variables with var, and ending lines with semicolons. While Javascript
    is a forgiving language and your program will run with these issues, it''s best
    to always use the correct syntax.'
