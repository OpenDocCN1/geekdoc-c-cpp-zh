  md: '# Coding as a hobby


    Coding isn''t just something people do at work. Lots more people code in their
    spare time than do so for a living. They do it for fun, to learn, to make useful
    websites for friends or family, or to make games for other people to enjoy. Between
    the internet and smartphones it has never been easier for people to share their
    code with the world.


    Many people start out learning to code as a hobby, but end up enjoying it enough
    they decide to turn it into a part-time or even full-time job. In fact, pretty
    much every professional coder learned most of their coding in their own time.
    App and website development are a great way for people to make some money working
    part-time, and to see how they enjoy coding professionally rather than just for
    fun.


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_24_0.png)


    # Getting into coding


    It''s also never been easier to learn to code. There are lots of fantastic books
    out there about coding (like this one!), but you can also find everything you
    need to get started online. Pages 44 and 74 will get you started writing code,
    and page 108 has lots of links to websites that will lead on to more exciting
    and complicated projects.'
