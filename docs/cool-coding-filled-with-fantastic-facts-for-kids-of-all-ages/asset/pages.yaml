- pgno: 79
  md: '# # Setting Code Free


    A lot of people around the world make a living from programming – when you buy
    a videogame some of that money goes to pay the programmers who wrote it. But a
    lot of coders also write software that they then release online for free.


    Some do it as a hobby, some do it as a way to learn programming, and some do it
    to help people out with useful tools.


    # ## Open-source


    There''s also a special kind of free software, called open-source software. This
    means that not only can you download the program for free, you can download the
    program code for it too (called the source code). That means you can read the
    code to see how the program works, and even modify it yourself!


    The idea behind open-source software is that if you like a program you can download
    the code and change it, making it do new things. Lots of people making small improvements
    in their spare time can add up to really big programs, like a web browser! You
    may even have used open-source code without knowing it.


    > > Unfortunately not all programs available online are safe to run. Some might
    contain viruses that can damage your computer or steal your information! Always
    check with a parent or teacher before you download any program from the internet.


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_79_0.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_79_1.png)'
