- pgno: 111
  md: '# # Even More Coding


    Hopefully this book has got you all fired up and ready to get coding. Here are
    some great places to get started! Teachers, friends and family may also be able
    to point you at even more.


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_111_0.png)


    # ## Getting started


    +   - **Scratch** www.scratch.mit.edu is a site you’ve already explored on pages
    44 and 74. Click on Explore at the very top and check out all the amazing things
    people have made with it – can you make something like that?

    +   - **Code tutorials** There are hundreds of sites out there that will get you
    started in a variety of programming languages, and www.codecademy.com is one of
    the best. You can also check out www.freecodecamp.com for another great tutorial
    site, with a focus on open-source development.

    +   - **Search** It may sound odd, but www.google.com and other search engines
    are your best friend when learning to code. If you have an error message you don’t
    understand, copy it into your search engine and you’ll find loads of web pages
    explaining what it means.


    # ## Coding tools


    +   - **Smart editors** If you use Windows, try www.notepad-plus-plus.org for
    a nice and simple smart text editor. If you’re a Mac user, try www.macromates.com.

    +   - **Fiddles** If you want to jump right into coding without installing anything,
    www.pythonfiddle.com will let you test out small Python programs right in your
    browser. www.jsfiddle.net does the same for JavaScript, and lets you easily combine
    it with HTML and CSS.

    +   - **iOS and Android SDKs** If you’re looking to develop phone apps you can
    download the iOS SDK from https://developer.apple.com/ios to develop iPhone/iPad
    apps. Head to https://developer.android.com/studio for the Android equivalent.

    +   - **Web app** If you want to write phone apps in JavaScript instead, check
    out www.ionicframework.com for an SDK that will let you write apps using web code.

    +   - **Version control** There are lots of version control systems out there,
    but www.github.com is by far the most popular – as well as storing your own code,
    it’s where most open-source programs are kept.'
  merge: -1
  img_proc: true
- pgno: 112
  md: '![](img/862cb7d96d05319b069165a3aaaaa9d3_112_0.png)


    Come on, let''s do this!


    # ## Creating games


    +   - **Web games** If you want to get started creating games, check out www.scirra.com/construct2,
    where you build games in HTML5 using the simple programming language built into
    the engine. If you want more control try www.phaser.io, which lets you use Javascript
    to directly control your web game.

    +   - **Unity** If you want to create 3D games, head to www.unity3d.com for a
    powerful engine used to develop lots of commercial games. It can be a bit overwhelming,
    but with it you can create amazing 2D and 3D games for just about any platform
    there is!


    # ## Getting physical


    +   - **BBC micro:bit** One of the easiest ways to start programming physical
    devices is with the BBC micro:bit. Your school may be able to provide you with
    one, and www.microbit.org allows you to program it very simply in a range of languages.
    There''s even a simulator on the website you can use to test your program!

    +   - **Other dev boards** The next step up, complexity-wise, is an Arduino (www.arduino.cc).
    It''s primarily programmed in C, but there''s lots of help available. It also
    has a fantastic range of add-on devices to expand its capabilities. If you want
    even more power try the Raspberry Pi (www.raspberrypi.org). This is a tiny PC
    you can do just about anything with!

    +   - **Mindstorms** If you''re a fan of Lego, check out Lego Mindstorms (www.lego.com/en-gb/mindstorms).
    You can use this to turn your Lego creations into robots you can program with
    a simple drag-and-drop language.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# # Coding Glossary


    **Argument** A variable that is passed into a function to change how it operates.


    **Array** An object that can store lots of individual values, any of which can
    be accessed via square brackets (such as arr[5]).


    **Binary** A way of counting that only uses 1s and 0s.


    **Bit** A single 1 or 0 value that represents how data is actually stored in a
    computer’s memory.


    **Boolean** A value used in logic that can either be True or False.


    **Bug** A mistake that causes a program not to run, or to do the wrong thing when
    it does run.


    **Byte** A collection of 8 bits that can be accessed together, and can be used
    to store a single character.


    **Callback** A function whose name is passed as an argument, letting other code
    call back to it. Often used in GUIs.


    **Class** An object that can be used to store all the variables and functions
    related to a particular task or thing.


    **Comment** Text that can be added to programs to remind yourself or others what
    that particular part of the code is doing.


    **Comparison operator** A range of operators such as equal to, less than and greater
    than that let programs compare two values and make a decision based on logic.


    **CPU** The tiny chip inside all computers that carries out the instructions in
    every program.


    **Data centre** A place containing lots of servers that can provide data over
    the internet.


    **Else** The alternative to If, defining what to do if an If condition wasn’t
    True. Can be combined with If to form a new conditional, Else If.


    **File** Information such as a photo, video or text that is stored on a computer.


    **Floating point** A number with a decimal place, such as 1.381, -21.9 or 8.0.


    **For loop** Type of loop that runs for a certain number of times.


    **Function** A block of code that has been separated from elsewhere in the program.


    **Graphical User Interface (GUI)** A way of letting people use a program via pictures
    and buttons rather than just typing.


    **If** Part of a program that only runs if a particular condition is True.


    **Instruction** A piece of code that tells the computer to do something.


    **Integer** A whole number (no decimal places) that can be positive, negative
    or 0.


    **Javascript** A programming language that can be included in web pages to run
    when someone reads the page.


    **Linked list** An alternative to arrays when storing lots of values, with each
    element linking to the next element in the list.


    **Logic** Allows programs to make decisions based on whether values in the program
    are True or False.


    **Loop** Part of a program that runs over and over again until a particular condition
    is met.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '**Machine code** A set of instructions the CPU can understand and follow. Programming
    languages are turned into machine code before they run.


    **Memory** Where variables and other data needed by a program are kept. Unlike
    storage, memory is volatile, meaning that when the computer turns off it is forgotten.


    **Networking** The ability for computers to communicate with one another, either
    via wires or wirelessly using electromagnetic waves.


    **Open source** Programs that people have shared on the internet so that you can
    download, use and even make changes to them.


    **Program** A list of instructions that the computer follows from top to bottom,
    carrying out each one as it comes to it.


    **Programming language** The way code can tell the computer to do things. Different
    programming languages write code in different ways.


    **Python** A powerful but easy-to-learn programming language that has its own
    syntax and way of doing things.


    **Queue** A way of storing data where elements can only be read from the queue
    in the order they are put into it.


    **Refactoring** Rewriting code, not to change what it does, but to make it neater
    or faster.


    **Return** A value returned to the calling code when a function ends.


    **Scratch** A visual programming language that allows you to drag and drop code
    elements rather than needing to write the program out.


    **Server** A computer without a monitor or other controls that serves other computers
    by providing them with data over a network.


    **Stack** A way of storing data where the only element that can be read is the
    one added to the stack most recently.


    **Static typing** Programming languages that only allow a variable to ever contain
    one type of value (like Boolean or integer), making certain errors easy to catch.


    **Storage** Where files and data are kept. Storage is slower to access than memory,
    but data in storage is remembered even when the computer is switched off.


    **String** A word or phrase in quote marks (such as ''Hello, world'').


    **Transistor** An incredibly tiny switch. A CPU contains billions of transistors,


    and by turning on and off they carry out all of the operations inside the computer.


    **Type** What kind of data a variable is storing, such as a string, integer or
    Boolean.


    **Variable** A named place to store a piece of data, such as a number or word,
    which can then be used later in the program.


    **While loop** A type of loop that continues to run while a certain condition
    is True.'
  merge: -1
  img_proc: true
