  md: "# For loops\n\nOften you want to loop a fixed number of times and then move\
    \ on; this type of loop is called a for loop. A for loop loops for a set number\
    \ of times. For looping through an index – this keeps track of the number of times\
    \ the program has been around the loop so far. Be careful, though – just like\
    \ in arrays, the index starts at 0, not at 1!\n\nThe number of times the for loop\
    \ runs can be a fixed number, like the example, or it can be an integer variable.\
    \ Different programming languages write for loops in different ways, so you’ll\
    \ need to look up how to write them in your language.\n\n```\n```text\nfor (int\
    \ i = 0; i < 10; i++) {\n    print(\"Hello!\");\n}\n```\n```\n\n> The name of\
    \ the index here is i, and you want to loop 10 times.\n\n> i will go from 0 to\
    \ 9, so this will count from 0 to 9.\n\n> **That’s neat!**\n> \n> There are a\
    \ couple of ways the code inside the loop can change things. A continue instruction\
    \ tells the program to skip the rest of the lines and go back to the start of\
    \ the loop for the next run, while a break instruction tells it to end the loop\
    \ straight away."
