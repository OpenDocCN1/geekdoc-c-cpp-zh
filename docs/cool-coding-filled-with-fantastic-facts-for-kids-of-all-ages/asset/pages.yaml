  md: "# Colossus: The First Computer\n\nThese days, computers are everywhere, but\
    \ until the 1940s a ‘computer’ was a person who did sums (computations) for a\
    \ living, not a machine. It was boring work and impossible to do without making\
    \ mistakes, so engineers looked for ways to build machines to do the job instead.\n\
    \n# Enigma\n\nDuring the Second World War armies on both sides sent instructions\
    \ and reports back and forth via radio, and to stop the other side understanding\
    \ them they encrypted their\n\nmessages with codes. Britain assembled a team at\
    \ Bletchley Park in Buckinghamshire to break the German codes, recruiting men\
    \ and women who were good at maths, chess and crosswords. By 1941, with the help\
    \ of Polish codebreakers and mechanical calculating machines designed by Alan\
    \ Turing and others, they could read messages encrypted by the German’s main code\
    \ machine: Enigma.\n\n![](img/862cb7d96d05319b069165a3aaaaa9d3_13_0.png)\n\n![](img/862cb7d96d05319b069165a3aaaaa9d3_13_1.png)\n\
    \n> **That’s neat!**\n> \n> Colossus was so secret that after the war only a few\
    \ of the computers were kept; the rest were destroyed along with all the records.\
    \ Everyone who knew about them was sworn to secrecy. So for a long time ENIAC,\
    \ a machine built in 1946 in America, was thought to be the first computer. It\
    \ wasn’t until the mid-1970s that information about Colossus was made public.\
    \ In 2007 a working replica of Colossus Mark 2 was built and can be seen operating\
    \ in the National Museum of Computing at Bletchley Park."
  merge: -1
  img_proc: true
- pgno: 14
  md: '# # Colossus


    But the German High Command used their own code system: Lorenz, a cipher too complex
    for even Turing''s machines to crack. Something else was needed. Before the war
    Turing had speculated about building a machine that could solve any kind of mathematical
    problem. Now Tommy Flowers and Max Newman built just such a machine. It was named
    Colossus and it used electricity and vacuum tubes to perform


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_14_0.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_14_1.png)


    calculations. Unlike any previous machine it was electronic and programmable,
    so it could be set to solve any mathematical problem. It was the first computer!
    Colossus Mark 1 was finished in December 1943 and could read coded messages at
    1,000 characters per second from a paper tape. Mark 2, completed in June 1944,
    was five times faster. With this new device Bletchley Park could finally


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_14_2.png)


    crack the Lorenz code and read Hitler''s messages to his commanders. The codebreaking
    efforts at Bletchley Park are thought to have shortened the war by years and saved
    millions of lives!'
  merge: -1
  img_proc: true
