- pgno: 93
  md: '# # Coding for the Internet


    Creating websites is a fantastic way to get started with computing – who wouldn''t
    love to have their own website? There''s tons of help available online, and you
    don''t need any additional software installed on your PC – if you have a web browser
    and a text editor you can get started!


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_93_0.png)


    Web pages are written in a syntax called HTML. They contain the words that go
    on the page, along with the addresses of images you want to include, links and
    any other content. You can also include formatting (colours, sizes, alignment
    and everything else that describes precisely how your content looks) directly
    in the file, or in a separate CSS (Cascading Style Sheet) file.


    # ## Getting dynamic


    If you want your web pages to really come alive you can embed computer code directly
    into your page! Browsers support Javascript, which you can write directly into
    the HTML file or include as a separate .js file. Then whenever someone loads your
    web page your code will run right in their browser.


    The code you write will be triggered by callbacks. The browser provides lots of
    callbacks you can use, so you can write code that runs . . .


    +   - when the page loads

    +   - when someone presses a button

    +   - when someone types in a text box


    … and in lots of other ways.


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_93_1.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_93_2.png)'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'Your code can then make changes to the web page. That could be anything from
    resizing some text to completely changing the entire page! Within the Javascript
    code the web page is represented by the DOM (Document Object Model) – much like
    with a socket or file object, this is a representation of the web page within
    your code. Whatever you do to the DOM will appear on the page.


    For security reasons there are some things you can’t do within the browser. However,
    it’s a powerful and flexible language, and a recent update to web pages called
    HTML5 has added even more capabilities, such as a canvas element you can use to
    put dynamic drawings and animations directly into web pages.


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_94_0.png)


    From now on, whenever you browse the web and notice a page doing something particularly
    cool, be aware that it’s using Javascript someone wrote to do it. Think about
    how it’s doing it, and maybe see if you can figure out how to do it yourself!'
