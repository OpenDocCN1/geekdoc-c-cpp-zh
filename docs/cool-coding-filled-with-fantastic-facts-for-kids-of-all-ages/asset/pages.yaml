- pgno: 107
  md: '# # Faster, Faster!


    You may have noticed that every year computers get better – the same amount of
    money will buy a faster CPU, more memory, and more storage.


    This has actually been going on for a long time. Back in 1965 Gordon Moore, one
    of the founders of Intel (still one of the world’s biggest CPU manufacturers to
    this day), noticed that the number of transistors they could fit into the same
    amount of silicon doubled every year – essentially making the same size CPU twice
    as powerful.


    Wowzers!


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_107_0.png)


    Number of transistors in a CPU


    TIME


    # Moore’s Law


    This predictable rate of improvement is called Moore’s Law. It’s slowed down a
    bit; since the 1980s transistor density (how many fit into a given area) has been
    doubling only every two years or so, but it’s still going strong. When you double
    things every few years it adds up to amazing changes over time.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# That''s neat!


    The computer that controlled Apollo 11 and put humans on the Moon was astonishingly
    advanced for 1969 and cost millions of dollars. The Apollo Guidance Computer (AGC)
    piloted the craft the 380,000km (236,128 miles) from the Earth to the Moon and
    back. And yet it is eclipsed by modern computers that''s hard to even make a comparison.
    Your toaster is orders of magnitude more powerful. The AGC ran at 0.05MHz and
    had 64kB of memory; a cheap modern smartphone is roughly 20,000 times faster and
    has 50,000 times the memory!


    # Really big and really small numbers


    This advancement has been driven by manufacturers managing to make their transistors
    ever smaller. The vacuum tubes used in Colossus and ENIAC were each several centimetres
    wide. In contrast, the silicon transistors in modern CPUs are just 14 nanometres
    (0.000000014m) across. The first CPU chips from the 1970s had a few thousand transistors,
    while modern ones have over a billion.


    Modern transistors are actually so small that many scientists think Moore''s Law
    will have to give out soon. 14-nanometre transistors are fewer than 100 individual
    atoms across, and if they get much smaller their weird quantum effects will start
    to disrupt them. However, scientists are experimenting with new materials, 3D
    arrangements of transistors, and anything else they can think of to try and keep
    Moore''s Law on track. Who knows how long they''ll be able to keep it up?


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_108_0.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_108_1.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_108_2.png)'
