- pgno: 61
  md: '# # Inheritance


    As we''ve just seen, classes are a great way to store and reuse functions and
    variables associated with something. Even better, though, another feature of classes
    lets you minimise the need to rewrite code and keep things logical: inheritance.


    # ### Meet the children


    Inheritance, or subtyping, is when you define new child classes (or subclasses)
    that inherit from a parent class (or superclass). These child classes still retain
    all of the functions and variables of their parent class, but can also have their
    own variables and functions specific to them.


    For instance, once you have defined a `dog()` class you could define child classes
    for specific breeds of dog. Anything that is common to all dogs goes into the
    parent `dog()` class, while anything specific to the breed goes into the individual
    child classes. Each child class is its own breed of dog with its own characteristics
    (colour, etc.), but also has all the properties of the parent class, which are
    common to all dogs (having four feet, etc.).


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_61_0.png)'
  merge: -1
  img_proc: true
- pgno: 62
  md: "```\n```python\nclass husky() inherits from dog()\n{\n    function howl()\n\
    \    {\n        print(\"Awoo!\")\n    }\n}\n\nmy_dog = husky()\nmy_dog.howl()\n\
    my_dog.name = \"Blue\"\n```\n```\n\n> > each language has its own syntax for inheritance\n\
    \n> > instantiate a variable of type 'husky'\n\n> > tailor any variable that inherits\
    \ from the functions defined in the child class\n\n> > can access variables and\
    \ functions from the parent class\n\n# Morphing around\n\nNot only is this a great\
    \ way to avoid needing to duplicate code in each child classes, but it lets you\
    \ be really flexible with functions too. Any time you have a function that expects\
    \ a class as one of its arguments you can use a child class of that parent instead\
    \ – that’s because (to use our example above) an instance of the husky() class\
    \ is an instance of the dog() class too. This is called polymorphism.\n\nBy default,\
    \ a child class inherits all variables and functions a parent has. Child classes\
    \ can also change the parent class behaviour by overriding it. To do this, just\
    \ define a function in the child class with the same signature (name and arguments)\
    \ as the parent, and the version defined in the child will override the version\
    \ in the parent. That means whenever that function gets called, the version defined\
    \ in the child class gets used instead of the one from the parent class.\n\n![](img/862cb7d96d05319b069165a3aaaaa9d3_62_0.png)"
