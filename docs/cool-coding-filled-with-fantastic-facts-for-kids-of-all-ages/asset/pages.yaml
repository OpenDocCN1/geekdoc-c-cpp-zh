- pgno: 80
  md: '# Getting involved


    Big open-source projects can be very complicated, so you should get the hang of
    a programming language before you dive into them. But once you’ve got some experience
    with coding, open-source code can be a great way to see how real programs are
    made! Before you start looking at a program, make sure the project still has people
    actively contributing to it. That way there will be plenty of folks to answer
    your questions, if you have any.


    # Making changes


    Once you understand how a program works, you can start making changes to it. To
    get started, try fixing a listed bug. Then other contributors will review your
    work and tell you if you’ve made any mistakes, and merge it into the main program.


    # Licensing


    Open-source programs are free to download to use, read and change, but some of
    them have restrictions on how you can share them with others. Each program will
    have a licence covering that, written in complicated legal-speak. If you’re just
    doing things on your own computer you won’t need to worry about it. As well as
    downloading and modifying existing projects, if you write a cool program, why
    not release it as open-source software? It’s a great way of getting your program
    out there and of showing off what you can do!


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_80_0.png)


    ![](img/862cb7d96d05319b069165a3aaaaa9d3_80_1.png)'
