    # The Succinctly® Series of Books


    Daniel Jebaraj

    CEO of Syncfusion®, Inc.


    When we published our first Succinctly® series book in 2012, jQuery Succinctly®,
    our goal was to produce a series of concise technical books targeted at software
    developers working on the Microsoft platform. We firmly believed then, as we do
    now, that topics of interest can be translated into books that are about 100 pages
    in length.


    We have since published over 200 books that have been downloaded millions of times.
    Reaching more than 1.7 million readers around the world, we have more than 70
    authors who now cover a wider range of topics, such as Blazor, machine learning,
    and big data.


    Each author is carefully chosen from a pool of talented experts who share our
    vision. The book before you and the others in this series are the result of our
    authors'' tireless work. Within these pages, you will find original content that
    is guaranteed to get you up and running in the time it takes to drink a few cups
    of coffee.


    We are absolutely thrilled with the enthusiastic reception of our books. We believe
    the Succinctly series is the largest library of free technical books being actively
    published today. Truly exciting!


    Our goal is to keep the information free and easily available so that anyone with
    a computing device and internet access can obtain concise information and benefit
    from it. The books will always be free. Any updates we publish will also be free.


    # Let us know what you think


    If you have any topics of interest, thoughts, or feedback, please feel free to
    send them to us at succinctlyyseries@syncfusion.com.


    We sincerely hope you enjoy reading this book and that it helps you better understand
    the topic of study. Thank you for reading.


    Please follow us on social media and help us spread the word about the Succinctly®
    series!

    '
