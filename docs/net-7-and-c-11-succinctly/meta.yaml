    # Output caching


    ASP.NET Core provides developers with various options when it comes to caching.
    These caching options have also been around for some time now. These are:


    +   - In-memory cache

    - Distributed cache

    - Response cache

    - Output caching (new in .NET Core 7)


    In-memory cache and distributed cache are server-side options. The client does
    not know about these. Let''s have a look at these in more detail.


    # In-memory cache


    The simplest of the caching mechanisms is in-memory cache. Here we simply store
    the data in the memory of the server. In-memory cache is key-value based. Based
    on the key, we can return a value stored previously from the cache. Due to the
    in-memory nature of this cache, caching mechanism might not work as you expect
    when using multiple servers, unless you set up server affinity. In situations
    like this, using a distributed cache, such as Redis, is recommended.


    # Distributed cache


    Multiple servers can access a shared, distributed cache. It, therefore, does not
    matter if the same server handles the request. Each server has access to the same
    shared data.'
