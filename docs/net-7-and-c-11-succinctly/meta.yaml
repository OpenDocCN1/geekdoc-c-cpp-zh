    \ Developer PowerShell in Visual Studio\n\nWith this window open, change the directory\
    \ to the benchmarking project. In my example, you can find the code in a project\
    \ called PerformanceImprovements in the main solution. We are ready to write some\
    \ code. Let's get started.\n\n# LINQ—improvements to existing operations\n\nBy\
    \ now, most developers are familiar with LINQ. It allows us to express complicated\
    \ operations concisely using the LINQ syntax. This expressivity does come with\
    \ a bit of overhead cost. This overhead cost leads some developers to avoid LINQ\
    \ in their code, but LINQ has its place and is extremely useful as long as you\
    \ are cognizant of where you use it in your code.\n\nWith .NET 7, these improvements\
    \ provide performance to LINQ out of the box. It means merely upgrading your solution\
    \ from .NET 6 to .NET 7 gives it a performance boost without having to write a\
    \ single line of optimization code.\n\nCode List 65: LINQ Example on Existing\
    \ Operations\n\n```csharp\nusing BenchmarkDotNet.Attributes;\nusing BenchmarkDotNet.Running;\n\
    \nnamespace PerformanceImprovements;\n\npublic class Bench\n{\n    static void\
    \ Main(string[] args) => BenchmarkRunner.Run<Bench>();\n}\n\n[MemoryDiagnoser(displayGenColumns:\
    \ false)]\n[RankDiagnoser]\n[HideColumns(\"Error\", \"StdDev\", \"Median\", \"\
    RatioSD\")]\npublic class Bench\n{\n    private IEnumerable<float> _randFloats\
    \ = CreateRandomFloats();\n\n    [Benchmark]\n    public float Min() => _randFloats.Min();\n\
    \n    [Benchmark]\n    public float Max() => _randFloats.Max();\n\n    [Benchmark]\n\
    \    public float Average() => _randFloats.Average();\n\n    [Benchmark]\n   \
    \ public float Sum() => _randFloats.Sum();\n\n    private static float[] CreateRandomFloats()\n\
    \    {\n        var r = new Random(45);\n        var results = new float[100_000];\n\
    \        for (int i = 0; i < results.Length; i++)\n        {\n            results[i]\
    \ = (float)r.NextDouble();\n        }\n        return results;\n    }\n}\n```\n\
    \nConsider the code in Code List 65 that creates a collection of 100,000 random\
    \ floating-point numbers and performs calculations on that collection via the\
    \ LINQ extension methods Min, Max, Average, and Sum.\n\nIn the Terminal window,\
