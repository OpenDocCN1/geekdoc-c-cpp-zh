  mdcn: "\n\n# 关于作者\n\n作为一名拥有超过 17 年 C# 和 Visual Studio 使用经验的资深软件开发人员，我有幸与许多公司合作，并向行业中一些最有天赋的人士学习。除了专业经验外，我还出版了多本关于\
