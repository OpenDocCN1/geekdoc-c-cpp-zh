    # .NET Upgrade Assistant


    The .NET Upgrade Assistant is an upgrade tool that assists developers in upgrading
    their applications to the latest version of .NET. It can also migrate your projects
    from older platforms, such as Xamarin Forms and IWP, to newer offerings. To get
    started with the .NET Upgrade Assistant, you can install the Visual Studio Extension
    or install it from the .NET global tool. Let''s look at the Visual Studio Extension
    first.


    # Installing the Visual Studio extension


    Installing the Visual Studio extension is done from within Visual Studio. From
    the Extensions menu, click **Manage Extensions.**


    ![](img/778d5698a16c98b6e4877f67a9324f37_11_0.png)


    In the **Manage Extensions** window that is displayed, search for the **.NET Upgrade
    Assistant.**


    ![](img/778d5698a16c98b6e4877f67a9324f37_11_1.png)


    Download the .NET Upgrade Assistant and restart Visual Studio. The process of
    installing the tool begins, displayed in the VSIX Installer, as seen in Figure
    4.'
