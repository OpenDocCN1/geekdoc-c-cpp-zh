    \    <TargetFrameworks>net7.0;net6.0</TargetFrameworks>\n    <ImplicitUsings>enable</ImplicitUsings>\n\
    \    <Nullable>enable</Nullable>\n  </PropertyGroup>\n\n  <ItemGroup>\n    <PackageReference\
    \ Include=\"benchmarkdotnet\" Version=\"0.13.6\" />\n  </ItemGroup>\n\n</Project>\n\
    ```\n\nNext, need to open the Terminal window in Visual Studio. You can do this\
