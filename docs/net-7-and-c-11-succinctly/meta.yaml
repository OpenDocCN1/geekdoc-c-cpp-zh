  md: '# Chapter 3 ASP.NET Core 7


    Chances are, you will work with ASP.NET Core at some point in your career. Whether
    this is developing a website or an API, ASP.NET Core is at play here. Due to the
    importance of ASP.NET Core, Microsoft has added a large number of features to
    the ASP.NET Core platform. Let''s look at some of these through the lens of .NET7.


    # How does ASP.NET Core fit into the whole .NET ecosystem?


    When we talk about ASP.NET Core, we talk about a methodology. In other words,
    we referring to a few things combined. As illustrated in Figure 27, ASP.NET Core
    comprises a platform and the specific technology you use for your application.


    ![](img/778d5698a16c98b6e4877f67a9324f37_43_0.png)


    The components in the core platform, such as middleware, logging, Razor pages,
    etc., make the building blocks of this shared platform. On top of this core platform
    sit various frameworks developers can use to create applications.


    This, in essence, is what ASP.NET Core looks like. You can''t use one of the application
    frameworks without one or more core platform components. Of course, the illustration
    in Figure 27 oversimplifies ASP.NET Core to a large extent. It is just a high-level
    overview of what ASP.NET Core is.


    Let''s have a look at some of the new features of ASP.NET Core 7.'
  merge: -1
