    \ might result in repeated code, which is why route groups have been introduced.\
    \ Route groups are used to group endpoints with a common prefix, resulting in\
    \ less duplication of code.\n\nLet's have a closer look at minimal APIs with endpoint\
    \ filters and route groups.\n\n## Endpoint filters\n\nIn Code Listing 51, I have\
