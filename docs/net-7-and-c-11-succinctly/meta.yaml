- md: "\n# About the Author\n\nAs a seasoned software developer with over 17 years\
    \ of experience utilizing C# and Visual Studio, I have had the privilege of working\
    \ with a number of companies and learning from some of the most talented individuals\
    \ in the industry. In addition to my professional experience, I have published\
    \ multiple books on topics such as C#, Visual Studio, and ASP.NET Core. My passion\
    \ for programming is unwavering, and I am dedicated to staying current with the\
    \ latest technology and sharing my expertise with others.\n\n# Chapter 1 Introducing\
    \ .NET\n\nTo understand how we arrived at .NET 7, we should first briefly examine\
    \ the history of .NET in general.\n\n| 2016-2018 | 2019 | Nov 2020 | Nov 2021\
    \ | Nov 2022 |\n|---|---|---|---|---|\n| .NET Core | .NET Core 3.1 LTS | .NET\
    \ 5.0 | .NET 6.0 | .NET 7.0 |\n| 1.0-1.1-2.0-2.1-2 | Support until Dec 2022 |\
    \ Out of support | LTS until Dec 2024 | STS release |\n\n![](img/778d5698a16c98b6e4877f67a9324f37_8_0.png)\n\
    \n.NET Core 1.0 was released in 2016 and heralded the start of what we know today\
    \ as .NET 7. Before this release, developers were accustomed to the .NET Framework\
    \ first released in February 2002. It was closed-source and ran only on Windows.\
    \ .NET Core, however, was the first .NET version to run across all platforms and\
    \ is an open-source project.\n\n.NET Core saw many releases between 2016 and 2018,\
    \ culminating in the release of .NET Core 3.1 in 2019. .NET Core 3.1 was a long-term\
    \ support version, with support for it ending in December 2022.\n\nMany companies\
    \ developed software on .NET Core 3.1 due to its long-term support status. The\
    \ other day, I ran into a project developed on .NET Core 3.1 that I had to upgrade\
    \ to .NET 7. It was, therefore, a very popular version of .NET Core. Then, in\
    \ 2020, Microsoft surprised us all with the release of .NET 5.0 (version 4 was\
    \ skipped to avoid confusion with the .NET Framework versions.) Microsoft touted\
    \ .NET 5.0 as a single, unified platform that would replace .NET Core, Xamarin,\
    \ and the .NET Framework. Support for .NET 5.0 ended in May 2022.\n\nIn November\
    \ 2021, Microsoft released .NET 6.0, with long-term support until December 2024.\
    \ This introduced a host of new features and unified the .NET platforms into a\
    \ single .NET version.\n\nThe standard-term support release of .NET 7.0 in November\
    \ 2022 brings us to where we are today: a unified .NET that supports cross-platform\
    \ application development, allowing developers to create a host of different applications—from\
    \ desktop apps to cloud apps, web applications, Unity games, mobile applications,\
    \ and AI apps.\n\nThe unification of .NET means that we have a single BCL (or\
    \ base class library) and SDK. With the release of MAUI, we can create cross-platform\
    \ native UI applications.\n\n# About .NET 7\n\nCompared to .NET 6.0, there were\
    \ fewer changes with the release of .NET 7. It did, however, bring with it performance\
    \ increases. Impacting pull requests went into the runtime and core libraries,\
    \ resulting in developers often gaining a significant performance boost in their\
    \ applications by simply upgrading to .NET 7.0. These performance improvements\
    \ make .NET 7 the fastest version of .NET thus far.\n\nThis, alone, is reason\
    \ to upgrade to .NET 7.0. New APIs have also been introduced in .NET 7.0. Changes\
    \ include:\n\n- Microseconds and nanoseconds were added to DateTime.\n- Changes\
    \ have been made to the Microsoft.Extensions.Caching namespace.\n- Support for\
    \ working with Tar (tar archive) files has been included with System.Formats.Tar.\n\
    - Various options were also added to System.Text.Json.\n\nASP.NET Core also had\
    \ notable changes. These include additions such as rate limiting, allowing ASP.NET\
    \ Core to limit the requests they handle in a specific amount of time. Output\
    \ caching has also been added and configures how responses from the ASP.NET Core\
    \ application are cached.\n\nMinimal APIs, introduced in .NET 6.0, also received\
    \ an update, including endpoint filters and route groups.\n\nIntroduced in early\
    \ 2022, MAUI has also received some love. MAUI allows developers to build mobile\
    \ applications targeting iOS and Android, Windows desktop, and macOS. With .NET\
    \ 7.0, one of the key improvement areas to MAUI has been performance. MAUI also\
    \ received some new controls, such as the map control. Desktop targeting has also\
    \ improved.\n\nSome of the tooling improvements include Azure support, container\
    \ support, hot reload, and CLI improvements. Microsoft has also made improvements\
    \ to the Azure assistant, helping developers to upgrade their applications to\
    \ the latest version of .NET. While it is by no means perfect, it significantly\
    \ assists developers with going through the pain of upgrading older .NET applications.\n\
    \n.NET 7.0 is a standard-term support release, and it is supported for six months\
    \ after the release of .NET 8.0. The result is that any production application\
    \ running .NET 7.0 must be upgraded when .NET 8.0 is released in November 2023.\n\
    \n# Upgrading existing applications to .NET 7\n\nBy now, it should be clear that\
    \ moving to .NET 7.0 is wise if you want to use the latest features, let alone\
    \ the speed enhancements that .NET 7 brings.\n\nLuckily for us, upgrading an existing\
    \ .NET 6 project to .NET 7 is quite simple, as illustrated in the following code\
    \ listings.\n\nIf you view the project file of an application built on .NET 6.0,\
    \ you see that the TargetFramework element is set to the value net6.0.\n\nCode\
    \ Listing 1: A. .NET 6.0 Project File\n\n```xml\n<Project Sdk=\"Microsoft.Net.Sdk\"\
    >\n\n  <PropertyGroup>\n    <OutputType>Exe</OutputType>\n    <TargetFramework>net6.0</TargetFramework>\n\
    \    <ImplicitUsings>enable</ImplicitUsings>\n    <Nullable>enable</Nullable>\n\
    \  </PropertyGroup>\n\n</Project>\n```\n\nModify the project file to reference\
    \ net7.0 to make use of .NET 7.0.\n\nCode Listing 2: A. .NET 7.0 Project File\n\
    \n```xml\n<Project Sdk=\"Microsoft.Net.Sdk\">\n\n  <PropertyGroup>\n    <OutputType>Exe</OutputType>\n\
    \    <TargetFramework>net7.0</TargetFramework>\n    <ImplicitUsings>enable</ImplicitUsings>\n\
    \    <Nullable>enable</Nullable>\n  </PropertyGroup>\n\n</Project>\n```\n\nRemember\
    \ to upgrade any NuGet Packages to their .NET 7.0 counterparts, also.\n\nIt is\
    \ worth noting since .NET 6.0, the Startup class has been removed, and the Program.cs\
    \ file now uses top-level statements. These changes are optional, however. (I\
    \ guess I'm an old man, I am not too fond of these changes and still favoring\
