  md: "# Response cache\n\nWhen we use response caching, it relies on enabling the\
    \ client to cache server responses based on specific HTTP cache headers. Sometimes\
    \ this approach does not work with UI applications such as MVC-based pages because\
    \ browsers typically set request headers that can prevent caching.\n\n# Output\
    \ caching\n\nOutput caching is now available with ASP.NET Core 7. Output caching\
    \ solves the problem with response caching because it caches the HTTP response\
    \ on the server. It, for, does not rely on the headers of the request. As mentioned\
    \ earlier, response caching is partly controlled by the client. With output caching,\
    \ the server is in control of deciding if a cached response is sent back. In ASP.NET\
    \ Core 7, you can enable output caching through middleware.\n\nThis means that\
    \ the first request received is handled as usual. When a new request is received,\
    \ the server can decide if a cached response is returned. This reduces the load\
    \ on the server. Various options are available with output caching to control\
    \ how the cached responses are stored. Different values can be stored based on\
    \ a parameter value, query value, header value, and so on.\n\nLet's look at some\
    \ code to demonstrate how to implement output caching. It's a bit difficult to\
    \ illustrate output caching in a book, so you need to run the code to see output\
    \ caching in action.\n\n> Code Listing 46: Add Output Caching\n\n```\npublic class\
    \ Program\n{\n    public static void Main(string[] args)\n    {\n        var builder\
    \ = WebApplication.CreateBuilder(args);\n\n        // Add services to the container.\n\
    \        builder.Services.AddControllers();\n        builder.Services.AddEndpointsApiExplorer();\n\
    \        builder.Services.AddSwaggerGen();\n\n        // Add output cache in the\
    \ services collection.\n        builder.Services.AddOutputCache(opt =>\n     \
    \   {\n            opt.DefaultExpirationTimeSpan = TimeSpan.FromSeconds(5);\n\
    \        });\n\n        var app = builder.Build();\n\n        // Configure the\
    \ HTTP request pipeline.\n        if (app.Environment.IsDevelopment())\n     \
    \   {\n            app.UseSwagger();\n        }\n```"
