  md: '# New features in ASP.NET Core 7


    In this section, we''ll look at several new features in ASP.NET Core 7 while discussing
    a few in detail later in the chapter.


    # HTTP/2 WebSocket and performance improvements


    .NET 7 introduces WebSockets over HTTP/2 support for Blazor WebAssembly, the JavaScript
    client, and the Kestrel web server. Being able to use WebSockets over HTTP/2 allows
    developers to take advantage of new features such as:


    +   - Header compression.

    - Multiplexing, reducing the time and resources across multiple server requests.


    .NET 7 introduced a significant re-architecture of how Kestrel processes HTTP/2
    requests. These performance improvements result in ASP.NET applications with busy
    HTTP/2 connections experiencing reduced CPU usage while enjoying a high throughput.


    # HTTP/3 improvements


    ASP.NET Core brings improvements to HTTP/3, specifically:


    +   - HTTP/3 is no longer experimental and is fully supported in ASP.NET Core.

    - Kestrel support for HTTP/3 is improved, including performance and feature parity
    with HTTP/1.1 and HTTP/2.

    - Full support for UseHttps(ListenOptions, X509Certificate2) is provided with
    HTTP/3.


    HTTP/3 support has been added to HTTP.sys and IIS.


    > Tip: HTTP.sys is an alternative web server for the Kestrel server. It offers
    some features not available with Kestrel. HTTP.sys is a web server for ASP.NET
    Core that only runs on Windows.


    .NET 7 also reduces HTTP/3 allocations. If you are interested in seeing some these
    improvements, log in GitHub, navigate to https://github.com/dotnet/aspnetcore,
    and then search the repository issues for the following items:


    +   - 42685

    - 42708

    - 42760


    # Output caching


    Output caching stores responses from your web application and allows ASP.NET Core
    to serve them from a cache, instead of computing them each time. It differs from
    response caching in the following ways:'
  merge: -1
  pgno: 44
- img_proc: true
  md: '+   * You can configure the caching behavior on the server.

    * You can programmatically invalidate cache entries.

    * The risks of cache stampede and thundering herd are mitigated by resource locking.

    * The server can return a 304 Not Modified HTTP status instead of a cached response
    body.

    * The cache storage medium is extensible.


    Output caching is new middleware in ASP.NET Core 7.


    # # Rate limiting


    ASP.NET Core 7 applications can now configure rate-limiting policies and attach
    those policies to endpoints in your application.


    # # Request decompression


    Request decompression is also new middleware in ASP.NET Core 7. It allows API
    endpoints to accept requests with compressed content. Using the Content-Encoding
    HTTP header, compressed content can be automatically identified and decompressed.
    This means developers do not need to write custom code to handle compressed requests.


    # # Improvements to hot reload


    Hot reload in .NET 6 significantly improved the developer workflow when debugging
    applications. Referring to the Hot Reload section in [this article](...) in .NET
    7, hot reload will be present for Blazor WebAssembly, developers to:


    +   * Add new types.

    * Add nested classes.

    * Add static and instance methods to existing types.

    * Add static fields and methods to existing types.

    * Add static lambdas to existing types.

    * Add lambdas that capture this to existing methods that already captured previously.


    # # Rate limiting


    There might be situations where applications come under extremely heavy load.
    This increases the possibility that the application would simply go down because
    it can''t handle the increased load. The increase in load could be accidental
    or on purpose. An accidental load increase could result from a faulty script that
    repeatedly makes requests to an API endpoint. On the other, a malicious actor
    could willfully make multiple requests to your application to bring down the site.


    Rate limiting in ASP.NET Core 7 allows developers to mitigate these issues:


    +   * Your application can limit the number of requests in a given time.'
  merge: -1
  pgno: 45
- img_proc: true
  md: '+   - Any requests above the limit will not be handled.

    - Developers can specify rate limiting globally or on a per-user basis.


    Developers can also create combinations, such as rate limiting the application
    to a thousand requests per minute, but only a hundred requests per minute, per
    user.


    Rate limiting allows developers to protect the application out of the box without
    adding any additional services. This prevents accidental or intentional abuse
    of the web application or API. Rate limiting comes in the form of middleware and
    works through policies attached to endpoints. This allows developers to specify
    different policies for different endpoints, which in turn allows the implementation
    of different limits to each endpoint.


    ASP.NET Core 7 comes with built-in rate limiter types. These are:


    +   - Fixed window limit: For example, 10 requests per minute.

    - Sliding window limit: Allowing a certain number of requests per segment of the
    window.

    - Concurrency limit: specifying how many requests are allowed.

    - Token bucket limit: A more complex version of the sliding window limit that
    allows bursts of requests.


    As mentioned earlier, any requests that exceed your limit will be rejected. It
    is however, possible to set up rate limiting to queue some requests that go above
    the PermitLimit you set by using the QueueLimit option. In this essence, delays
    the requests instead of rejecting them immediately.


    # Using a fixed window limit


    Let''s look at a code example implementing rate limiting. For this example, illustrated
    in Code Listing 41, I have just used the boilerplate code for the Weather Forecast
    API in Visual Studio. I am not using top-level statements or minimal APIs.


    > Tip: You can find the source code for this book on GitHub.


    I create a constant string for the rate limit policy name in the Program class.
    Here, I simply call it fixed.


    I then add rate limiting to the services collection:


    +   - Specifying builder.Services.AddRateLimiter()

    - Adding a fixed window limiter. AddFixedWindowLimiter, specifying the policy
    for the Window and PermitLimit options.

    - Providing options for the Window and PermitLimit options.


    In this rate limiter, I will allow only four requests to be made in a span of
    20 seconds.


    I need to enable the rate limiting middleware by adding app.UseRateLimiter(),
    and I specify that I require rate limiting on my endpoints with app.MapControllers().RequireRateLimiting(FIXED_RATE_LIMIT_POLICY),
    passing in the name of the policy I want to apply.'
