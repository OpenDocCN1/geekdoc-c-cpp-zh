    builder.Services.AddScoped<IMovieRepository, MovieRepository>();\nbuilder.Services.AddEndpointsApiExplorer();\n\
    builder.Services.AddSwaggerGen();\n\nbuilder.Logging.ClearProviders();\nbuilder.Logging.AddConsole();\n\
    builder.Logging.AddDebug();\n\nvar app = builder.Build();\n// 配置 HTTP 请求管道。\n\
    if (app.Environment.IsDevelopment())\n{\n    app.UseSwagger();\n    app.UseSwaggerUI();\n\
    }\n\napp.UseHttpsRedirection();\napp.UseAuthorization();\n\napp.MapGet(\"/movies\"\
    , (IMovieRepository movieRepo) => {\n    return movieRepo.GetAllMovieItems();\n\
    }).AddEndpointFilter(async (context, next) => {\n    app.Logger.LogInformation($\"\
    Request {context.Request.Path} processed at {DateTime.Now}\");\n\n    var result\
    \ = await next(context);\n\n    app.Logger.LogInformation($\"Request {context.Request.Path}\
    \ processed at {DateTime.Now}\");\n\n    return result;\n});\n\napp.Run();\n```\n\
    \n端点过滤器现在会在执行前添加一条日志记录。`next` 执行下一个（如果有的话），我们再次向日志写入该内容。\n\n图 35：日志输出\n\n当我运行\
