    \ `JsonSerializerOptions` 实例都会通过反射发射（reflection emit）重新生成处理程序，这增加了序列化和反序列化的成本。\n\
    \n考虑代码列表 70 所示的代码。\n\n## 代码列表 70：JSON 序列化\n\n```csharp\nusing System.Text.Json;\n\
