  md: '# # Chapter 4 Performance Improvements


    The performance well has by no means run dry. Even though .NET 6 was fast, and
    one could imagine that there was little else to do to speed up .NET any more,
    comes some serious performance improvements. To quantify how many performance
    improvements there are, we need to refer back to an article Stephen Toub (a developer
    on the .NET team at Microsoft) wrote in August of 2022.


    Each time he reviewed a PR that might positively impact performance, he copied
    that link to a journal. When he reviewed the journal for the article, he discovered
    that a thousand performance-impacting pull requests went into the release of .NET
    7.


    We can safely assume that .NET 7 is very fast. Let''s look at just how fast it
    is in the following sections.


    # ## Benchmark .NET 6 vs. .NET 7


    Illustrating the performance improvements in .NET 7, we need to look at setting
    up a simple Console application that includes the NuGet package BenchmarkDotNet,
    as seen in Figure 40.


    ![](img/778d5698a16c98b6e4877f67a9324f37_81_0.png)


    Figure 40: BenchmarkDotNet


    To compare the improvements in .NET 7, we benchmark it against .NET 6 to illustrate
    how the same code performs across .both versions. We must therefore target multiple
    frameworks in our Console application.


    The easiest way to do this is to modify the cssproj file of the Console application
    used for benchmarking.


    You can see how my cssproj file looks in Code Listing 64.'
