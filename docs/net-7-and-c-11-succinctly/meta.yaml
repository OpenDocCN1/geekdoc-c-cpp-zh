    \ on the query string days. Subsequent requests within five seconds using the\
    \ two-day and six-day forecasts return the cached response.\n\n# What are minimal\
    \ APIs?\n\nWith .NET 7, there have been some changes to minimal APIs. Introduced\
    \ in .NET 6, minimal APIs allow developers to create APIs without the notion of\
    \ controllers. Think of minimal APIs as a model for creating smaller APIs using\
    \ only a few lines of code.\n\nMinimal APIs rely on top-level statements, and\
    \ as developers started becoming used to this minimal approach to creating APIs,\
    \ a few things were still missing. Microsoft, therefore, started maturing the\
    \ platform to what we now have in .NET 7.\n\nThe three main features are:\n\n\
    +   - Endpoint filters\n- Route groups\n- Typed results\n\nEndpoint filters are\
    \ a way to execute code before and after the logic of the endpoint handler. The\
    \ filter logic can inspect and change parameters, and using endpoint filters is\
    \ helpful for things such as logging or validation.\n\nLogically, if you have\
    \ multiple endpoints, you will need to use endpoint filters on each one. This\
    \ might result in repeated code, which is why route groups have been introduced.\
    \ Route groups are used to group endpoints with a common prefix, resulting in\
    \ less duplication of code."
