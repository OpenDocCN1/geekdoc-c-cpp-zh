    # UTF-8 literals


    UTF-8 is considered the encoding of the web. It''s also used in significant parts
    of the .NET stack. The network stack still makes use of constants in code. Think
    of HTTP/1.0\r\n, AUTH, or even Content-Length:, which we see so often.


    Unfortunately, there is no efficient syntax for dealing with these constants,
    and C# represents all strings as C# UTF-16 encoding.


    With C# 11, you can mark strings as UTF-8 using the u8 suffix, as seen in Code
    List 17.


    Code List 17: Using the u8 Suffix on Strings


    ```

    ReadOnlySpan<byte> utf8 = "AUTH u8";

    ```


    Compare the size difference of UTF-16 versus UTF-8.


    ![](img/778d5698a16c98b6e4877f67a9324f37_31_0.png)


    Figure 19: UTF-16 Encoding


    As you can see when comparing Figure 19 and Figure 20, the utf16 variable contains
    10 bytes, while the utf8 variable contains only 5 bytes.


    ```

    ReadOnlySpan<byte> utf8 = "AUTH u8"; with debugger view

    ```


    Figure 20: UTF-8 Encoding


    This difference is due to the size difference between the different encodings.'
  - '[PAGE 32]


    # Raw string literals


    The next feature makes life much easier for developers when working with strings.
    Consider the XML Prologue in Figure 21.


    ```

    var xmlPrologue = "<?xml version="1.0" encoding="UTF-8"";

    ```


    Figure 21: The Literal String Unescaped


    Because the string is not escaped, the double quotes are invalid, because in C#,
    you cannot have a double quote inside a string. We generally overcome this by
    escaping the double quotes illustrated in Code Listing 18.


    Code Listing 18: Escaping the Double Quotes


    ```

    var xmlPrologue = "<?xml version="1.0" encoding="UTF-8"";

    ```


    You can also escape the double quotes by using a verbatim string, but you still
    need to escape the double quotes by doubling them up.


    Code Listing 19: Another Way to Escape Quotes


    ```

    var xmlPrologue = "@<?xml version="1.0" encoding="UTF-8"";

    ```


    In C# 11, you can escape the double quotes inside the string by doubling three
    double quotes around the string, as illustrated in Code Listing 20.


    Code Listing 20: Raw String Literals


    ```

    var xmlPrologue = """<?xml version="1.0" encoding="UTF - 8""""";

    ```


    Raw string literals certainly help make the string much more readable. If, by
    chance, happen to have three double quotes in a string, then you would escape
    this by adding four double quotes around, as illustrated in Code Listing 21.


    Code Listing 21: Escaping Three Double Quotes


    ```

    var myString = """This is a string with three double quotes""";

    ```


    This logic can continue indefinitely. In other words, if your string contains
    n double quotes, you have to start and end your string with n+1 double quotes.


    Raw string literals also work well when dealing with JSON strings. Consider the
    escaped JSON string in Code Listing 22.'
