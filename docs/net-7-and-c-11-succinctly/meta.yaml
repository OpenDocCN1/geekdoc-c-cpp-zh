    \ 7.\n\nWe can safely assume that .NET 7 is very fast. Let's look at just how\
    \ fast it is in the following sections.\n\n## Benchmark .NET 6 vs. .NET 7\n\n\
    Illustrating the performance improvements in .NET 7, we need to look at setting\
