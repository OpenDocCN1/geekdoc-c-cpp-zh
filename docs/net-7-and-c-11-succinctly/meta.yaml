  md: "The library incurs a more significant one-time cost performing this code generation,\
    \ making subsequent handling of the types fast (assuming that the generated code\
    \ is available for use). The generated handlers require them to be stored somewhere,\
    \ where is where JsonSerializerOptions come into play.\n\nThe idea behind JsonSerializerOptions\
    \ is that developers would create an instance and pass that along all the required\
    \ serialization and deserialization calls. If, however, developers deviate from\
    \ the recommended model, performance tasks. What happens now is instead of taking\
    \ the hit for reflection invoke costs, every instance of JsonSerializerOptions\
    \ results in a regeneration of the handlers via reflection emit, which increases\
    \ the cost of the serialization and deserialization.\n\nConsider the code illustrated\
    \ in Code Listing 70.\n\n# Code Listing 70: JSON Serialization\n\n```\nusing System.Text.Json;\n\
    using BenchmarkDotNet.Attributes;\nusing BenchmarkDotNet.Running;\n\nnamespace\
    \ PerformanceImprovements;\n\npublic class Program\n{\n    static void Main(string[]\
    \ args) => BenchmarkRunner.Run<Bench>();\n}\n\n[MemoryDiagnoser(displayGenColumns:\
    \ false)]\n[DisassemblyDiagnoser]\n[HideColums(\"Error\", \"StdDev\", \"Median\"\
    , \"RatioSD\")]]\npublic class Bench\n{\n    private JsonSerializerOptions _options\
    \ = new JsonSerializerOptions();\n    private StudentPoco _student = new StudentPoco();\n\
    \n    [Benchmark(Baseline = true)]\n    public string ImplicitOptions() => JsonSerializer.Serialize(_student);\n\
    \n    [Benchmark]\n    public string WithCached() => JsonSerializer.Serialize(_student,\
    \ _options);\n\n    [Benchmark]\n    public string WithoutCached() => JsonSerializer.Serialize(_student,\
    \ new JsonSerializerOptions());\n}\n\npublic class StudentPoco\n```"
