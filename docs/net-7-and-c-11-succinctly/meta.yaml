  - '[PAGE 8]


    # # Chapter 1 Introducing .NET


    To understand how we arrived at .NET 7, we should first briefly examine the history
    of .NET in general.


    | 2016-2018 | 2019 | Nov 2020 | Nov 2021 | Nov 2022 |

    |---|---|---|---|---|

    | .NET Core | .NET Core 3.1 LTS | .NET 5.0 | .NET 6.0 | .NET 7.0 |

    | 1.0-11-2.0-2.1-2 | Support until Dec 2022 | Out of support | LTS until Dec 2024
    | STS release |


    ![](img/778d5698a16c98b6e4877f67a9324f37_8_0.png)


    .NET Core 1.0 was released in 2016 and heralded the start of what we know today
    as .NET 7. Before this release, developers were accustomed to the .NET Framework
    first released in February 2002. It was closed-source and ran only on Windows.
    .NET Core, however, was the first .NET version to run across all platforms and
    is an open-source project.


    .NET Core saw many releases between 2016 and 2018, culminating in the release
    of .NET Core 3.1 in 2019 .NET Core 3.1 was a long-term support version, with support
    for it ending in December 2022.


    Many companies developed software on .NET Core 3.1 due to its long-term support
    status. The other day, I ran into a project developed on .NET Core 3.1 that I
    had to upgrade to .NET 7. It was, therefore, a very popular version of .NET Core.
    Then, in 2020, Microsoft surprised us all with the release of .NET 5.0 (version
    4 was skipped to avoid confusion with the .NET Framework versions.) Microsoft
    tuted .NET 5.0 as a single, unified platform that would replace .NET Core, Xamarin,
    and the .NET Framework. Support for .NET 5.0 ended in May 2022.


    In November 2021, Microsoft released .NET 6.0, with long-term support until December
    2024. This introduced a host of new features and unified the .NET platforms into
    a single .NET version.


    The standard-term support release of .NET 7.0 in November 2022 brings us to where
    we are today: a unified .NET that supports cross-platform application development,
    allowing developers to create a host of different applications—from desktop apps
    to cloud apps, web applications, Unity games, mobile applications, and AI apps.


    The unification of .NET means that we have a single BCL (or base class library)
    and SDK. With the release of MAUI, we can create cross-platform native UI applications.'
  - '[PAGE 9]


    # About .NET 7


    Compared to .NET 6.0, there were fewer changes with the release of .NET 7. It
    did, however, bring with it performance increases.impacting pull requests went
    into the runtime and core libraries, resulting in developers often gaining a significant
    performance boost in their applications by simply upgrading to .NET 7.0. These
    performance improvements make .NET 7 the fastest version of .NET thus far.


    This, alone, is reason to upgrade to .NET 7.0. New APIs have also been introduced
    in .NET 7.0. Changes include:


    +   * Microseconds and nanoseconds were added to DateTime.

    * Changes have been made to the Microsoft.Extensions.Caching namespace.

    * Support for working with Tar (tar archive) files has been included with System.Formats.Tar.

    * Various options were also added to System.Text.Json.


    ASP.NET Core also had notable changes. These include additions such as rate limiting,
    allowing ASP.NET Core to limit the requests they handle in a specific amount of
    time. Output caching has also been added and config how responds from the ASP.NET
    Core application are cached.


    Minimal APIs, introduced in .NET 6.0, also received an update, including endpoint
    filters and route groups.


    Introduced in early 2022, MAUI has also received some love. MAUI allows developers
    to build mobile applications targeting iOS and Android, Windows desktop, and macOS.
    With .NET 7.0, one of the key improvement areas to MAUI has been performance.
    MAUI also received some new controls, such as the map control. Desktop targeting
    has also improved.


    Some of the tooling improvements include Azure support, container support, hot
    reload, and CLI improvements. Microsoft has also made improvements to the Azure
    assistant, helping developers to upgrade their applications to the latest version
    of .NET. While it is by no means perfect, it significantly assists developers
    with going through the pain of upgrading older .NET applications.


    .NET 7.0 is a standard-term support release, and it is supported for six months
    after the release of .NET 8.0. The result is that any production application running
    .NET 7.0 must be upgraded when .NET 8.0 is released in November 2023.


    # Upgrading existing applications to .NET 7


    By now, it should be clear that moving to .NET 7.0 is wise if you want to use
    the latest features, let alone the speed enhancements that .NET 7 brings.


    Luckily for us, upgrading an existing .NET 6 project to .NET 7 is quite simple,
    as illustrated in the following code listings.'
