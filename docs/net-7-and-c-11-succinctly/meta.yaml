    \n- Endpoint filters\n- Route groups\n- Typed results\n\nEndpoint filters are\
    \ a way to execute code before and after the logic of the endpoint handler. The\
    \ filter logic can inspect and change parameters, and using endpoint filters is\
    \ helpful for things such as logging or validation.\n\nLogically, if you have\
