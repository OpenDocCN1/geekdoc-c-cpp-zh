    \ 仍然是昂贵的，但在使用 .NET 7 时要便宜得多。\n\n## 总结\n\n要说明 .NET 7 中所做的的所有性能改进，就需要一整本书了。这里的结论是意识到，尽管\
    \ .NET 7 是一个标准术支持（Standard Term Support）版本，但这并不意味着你不应该将项目升级到 .NET 7。你的项目开箱即可获得的性能提升足以成为升级到\
    \ .NET 7 的充分理由。\n\n关于 BenchmarkDotNet 的更多信息，请参阅其[文档](https://github.com/dotnet/BenchmarkDotNet)。\n\
