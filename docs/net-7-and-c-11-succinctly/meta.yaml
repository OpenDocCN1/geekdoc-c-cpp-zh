- md: "\n# Chapter 3 ASP.NET Core 7\n\nChances are, you will work with ASP.NET Core\
    \ at some point in your career. Whether this is developing a website or an API,\
    \ ASP.NET Core is at play here. Due to the importance of ASP.NET Core, Microsoft\
    \ has added a large number of features to the ASP.NET Core platform. Let's look\
    \ at some of these through the lens of .NET7.\n\n## How does ASP.NET Core fit\
    \ into the whole .NET ecosystem?\n\nWhen we talk about ASP.NET Core, we talk about\
    \ a methodology. In other words, we are referring to a few things combined. As\
    \ illustrated in Figure 27, ASP.NET Core comprises a platform and the specific\
    \ technology you use for your application.\n\n![](img/778d5698a16c98b6e4877f67a9324f37_43_0.png)\n\
    \nThe components in the core platform, such as middleware, logging, Razor pages,\
    \ etc., make the building blocks of this shared platform. On top of this core\
    \ platform sit various frameworks developers can use to create applications.\n\
    \nThis, in essence, is what ASP.NET Core looks like. You can't use one of the\
    \ application frameworks without one or more core platform components. Of course,\
    \ the illustration in Figure 27 oversimplifies ASP.NET Core to a large extent.\
    \ It is just a high-level overview of what ASP.NET Core is.\n\nLet's have a look\
    \ at some of the new features of ASP.NET Core 7.\n\n## New features in ASP.NET\
    \ Core 7\n\nIn this section, we'll look at several new features in ASP.NET Core\
    \ 7 while discussing a few in detail later in the chapter.\n\n### HTTP/2 WebSocket\
    \ and performance improvements\n\n.NET 7 introduces WebSockets over HTTP/2 support\
    \ for Blazor WebAssembly, the JavaScript client, and the Kestrel web server. Being\
    \ able to use WebSockets over HTTP/2 allows developers to take advantage of new\
    \ features such as:\n\n- Header compression.\n- Multiplexing, reducing the time\
    \ and resources across multiple server requests.\n\n.NET 7 introduced a significant\
    \ re-architecture of how Kestrel processes HTTP/2 requests. These performance\
    \ improvements result in ASP.NET applications with busy HTTP/2 connections experiencing\
    \ reduced CPU usage while enjoying a high throughput.\n\n### HTTP/3 improvements\n\
    \nASP.NET Core brings improvements to HTTP/3, specifically:\n\n- HTTP/3 is no\
    \ longer experimental and is fully supported in ASP.NET Core.\n- Kestrel support\
    \ for HTTP/3 is improved, including performance and feature parity with HTTP/1.1\
    \ and HTTP/2.\n- Full support for UseHttps(ListenOptions, X509Certificate2) is\
    \ provided with HTTP/3.\n\nHTTP/3 support has been added to HTTP.sys and IIS.\n\
    \n> Tip: HTTP.sys is an alternative web server for the Kestrel server. It offers\
    \ some features not available with Kestrel. HTTP.sys is a web server for ASP.NET\
    \ Core that only runs on Windows.\n\n.NET 7 also reduces HTTP/3 allocations. If\
    \ you are interested in seeing some of these improvements, log in GitHub, navigate\
    \ to https://github.com/dotnet/aspnetcore, and then search the repository issues\
    \ for the following items:\n\n- 42685\n- 42708\n- 42760\n\n### Output caching\n\
    \nOutput caching stores responses from your web application and allows ASP.NET\
    \ Core to serve them from a cache, instead of computing them each time. It differs\
    \ from response caching in the following ways:\n\n- You can configure the caching\
    \ behavior on the server.\n- You can programmatically invalidate cache entries.\n\
    - The risks of cache stampede and thundering herd are mitigated by resource locking.\n\
    - The server can return a 304 Not Modified HTTP status instead of a cached response\
    \ body.\n- The cache storage medium is extensible.\n\nOutput caching is new middleware\
    \ in ASP.NET Core 7.\n\n### Rate limiting\n\nASP.NET Core 7 applications can now\
    \ configure rate-limiting policies and attach those policies to endpoints in your\
    \ application.\n\n### Request decompression\n\nRequest decompression is also new\
    \ middleware in ASP.NET Core 7. It allows API endpoints to accept requests with\
    \ compressed content. Using the Content-Encoding HTTP header, compressed content\
    \ can be automatically identified and decompressed. This means developers do not\
    \ need to write custom code to handle compressed requests.\n\n### Improvements\
    \ to hot reload\n\nHot reload in .NET 6 significantly improved the developer workflow\
    \ when debugging applications. Referring to the Hot Reload section in [this article](...)\
    \ in .NET 7, hot reload will be present for Blazor WebAssembly, allowing developers\
    \ to:\n\n- Add new types.\n- Add nested classes.\n- Add static and instance methods\
    \ to existing types.\n- Add static fields and methods to existing types.\n- Add\
    \ static lambdas to existing types.\n- Add lambdas that capture this to existing\
    \ methods that already captured previously.\n\n### Rate limiting\n\nThere might\
    \ be situations where applications come under extremely heavy load. This increases\
    \ the possibility that the application would simply go down because it can't handle\
    \ the increased load. The increase in load could be accidental or on purpose.\
    \ An accidental load increase could result from a faulty script that repeatedly\
    \ makes requests to an API endpoint. On the other, a malicious actor could willfully\
    \ make multiple requests to your application to bring down the site.\n\nRate limiting\
    \ in ASP.NET Core 7 allows developers to mitigate these issues:\n\n- Your application\
    \ can limit the number of requests in a given time.\n- Any requests above the\
    \ limit will not be handled.\n- Developers can specify rate limiting globally\
    \ or on a per-user basis.\n\nDevelopers can also create combinations, such as\
    \ rate limiting the application to a thousand requests per minute, but only a\
    \ hundred requests per minute, per user.\n\nRate limiting allows developers to\
    \ protect the application out of the box without adding any additional services.\
    \ This prevents accidental or intentional abuse of the web application or API.\
    \ Rate limiting comes in the form of middleware and works through policies attached\
    \ to endpoints. This allows developers to specify different policies for different\
    \ endpoints, which in turn allows the implementation of different limits to each\
    \ endpoint.\n\nASP.NET Core 7 comes with built-in rate limiter types. These are:\n\
    \n- Fixed window limit: For example, 10 requests per minute.\n- Sliding window\
    \ limit: Allowing a certain number of requests per segment of the window.\n- Concurrency\
    \ limit: specifying how many requests are allowed.\n- Token bucket limit: a more\
    \ complex version of the sliding window limit that allows bursts of requests.\n\
    \nAs mentioned earlier, any requests that exceed your limit will be rejected.\
    \ It is however, possible to set up rate limiting to queue some requests that\
    \ go above the PermitLimit you set by using the QueueLimit option. In this essence,\
    \ delays the requests instead of rejecting them immediately.\n\n### Using a fixed\
    \ window limit\n\nLet's look at a code example implementing rate limiting. For\
    \ this example, illustrated in Code Listing 41, I have just used the boilerplate\
    \ code for the Weather Forecast API in Visual Studio. I am not using top-level\
    \ statements or minimal APIs.\n\n> Tip: You can find the source code for this\
    \ book on GitHub.\n\nI create a constant string for the rate limit policy name\
    \ in the Program class. Here, I simply call it fixed.\n\nI then add rate limiting\
    \ to the services collection:\n\n- Specifying builder.Services.AddRateLimiter()\n\
    - Adding a fixed window limiter. AddFixedWindowLimiter, specifying the policy\
    \ for the Window and PermitLimit options.\n- Providing options for the Window\
    \ and PermitLimit options.\n\nIn this rate limiter, I will allow only four requests\
    \ to be made in a span of 20 seconds.\n\nI need to enable the rate limiting middleware\
    \ by adding app.UseRateLimiter(), and I specify that I require rate limiting on\
    \ my endpoints with app.MapControllers().RequireRateLimiting(FIXED_RATE_LIMIT_POLICY),\
    \ passing in the name of the policy I want to apply.\n\nI am using MapControllers\
    \ here, but I could also be more specific if I wanted.\n\nCode Listing 41: Adding\
    \ a Fixed Window Limiter\n\n```\npublic class Program{\n    const string FIXED_RATE_LIMIT_POLICY\
    \ = \"fixed\";\n\n    public static void Main(string[] args)\n    {\n        var\
    \ builder = WebApplication.CreateBuilder(args);\n\n        builder.Services.AddControllers();\n\
    \        builder.Services.AddEndpointsApiExplorer();\n        builder.Services.AddSwaggerGen();\n\
    \n        // Fixed rate limit.\n        builder.Services.AddRateLimiter(_ =>\n\
    \            .AddFixedWindowLimiter(policyName: FIXED_RATE_LIMIT_POLICY, options\
    \ =>\n            {\n                options.PermLimit = 4;\n                options.Window\
    \ = TimeSpan.FromSeconds(20);\n            }));\n\n        var app = builder.Build();\n\
    \n        if (app.Environment.IsDevelopment())\n        {\n            app.UseSwagger();\n\
    \            app.UseSwaggerUI();\n        }\n\n        // Enable rate limiting\
    \ middleware.\n        app.UseRateLimiter();\n        app.UseHttpsRedirection();\n\
    \        app.UseAuthorization();\n\n        app.MapControllers().RequireRateLimiting(FIXED_RATE_LIMIT_POLICY);\n\
    \        app.Run();\n    }\n}\n```\n\nRunning the application in Swagger, I can\
    \ execute the GET request for the /WeatherForecast API endpoint, as seen in Figure\
    \ 28.\n"
