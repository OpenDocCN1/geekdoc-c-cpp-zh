    \n如果你遇到需要使用 `OrderBy(x => x)` 的情况，请考虑使用 `Order()` 方法。如代码列表 69 所示，在 .NET 7 中使用新的\
    \ `Order()` 方法，分配显著减少了。\n\n## JSON 改进\n\n.NET Core 3 为开发者引入了 `System.Text.Json`，而\
    \ .NET 7 对此投入了大量精力。然而，一个陷阱涉及该库如何缓存数据。为了在不使用源生成器的情况下提高序列化反序列化的性能，`System.Text.Json`\
