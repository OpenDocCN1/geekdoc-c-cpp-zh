    \ the Upgrade Assistant and gives me the option of an in-place project upgrade.\n\
    \nThe Upgrade Assistant supports three upgrade types. These are:\n\n- In-place\n\
    - Side-by-side\n- Side-by-side incremental\n\nI will expand a bit more on the\
    \ three options available later in this chapter. For now, I will click the In-place\
    \ project upgrade option.\n\n![](img/778d5698a16c98b6e4877f67a9324f37_14_0.png)\n\
    \nFigure 7: The Upgrade Assistant\n\n![](img/778d5698a16c98b6e4877f67a9324f37_15_0.png)\n\
    \n### Figure 8: The Target Framework Selection\n\nThe Upgrade Assistant now asks\
    \ me which target framework I want to upgrade to. As this book is about .NET 7.0,\
    \ I will select it from the available options. In reality, if your project is\
    \ already in production or due to be released soon, you might want to select .NET\
    \ 6.0 to take advantage of the long-term support.\n\nPlease make no mistake, though:\
    \ .NET 7.0 is a perfectly reasonable choice and, as mentioned before, brings performance\
    \ improvements and many other benefits.\n\n![](img/778d5698a16c98b6e4877f67a9324f37_16_0.png)\n\
    \n### Figure 9: The Components to Be Upgraded\n\nThe .NET Upgrade Assistant now\
    \ displays the components it will upgrade. On this screen, you can check and uncheck\
    \ the components as required. The selections you make here might have some consideration\
    \ when dealing with large solutions containing many projects.\n\nAs my project\
    \ is small, I keep the default selections and click the Upgrade selection button.\n\
    \n![](img/778d5698a16c98b6e4877f67a9324f37_17_0.png)\n\nThe .NET Upgrade Assistant\
    \ now starts the upgrade process and displays a progress bar.\n\n![](img/778d5698a16c98b6e4877f67a9324f37_17_1.png)\n\
    \nOnce the upgrade process completes, you are shown a summary of the upgrade results\
    \ with how many components succeeded, failed, or were skipped.\n\n### Figure 12:\
    \ The Upgrade Result\n\nYou will also see the results for each component in the\
    \ window below the Upgrade Assistant. Hover over each check icon to see a descriptive\
    \ tooltip.\n\nIf you compare the project file before the upgrade process (Code\
    \ Listing 3) to the project after the upgrade process (Code Listing 4), you will\
    \ notice that a lot has changed.\n\n## Code Listing 4: The Upgraded Project File\n\
    \n```xml\n<Project SDK=\"Microsoft.NET.Sdk.Web\">\n  <PropertyGroup>\n    <TargetFramework>net7.0</TargetFramework>\n\
    \    <DebugType>full</DebugType>\n  </PropertyGroup>\n</Project>\n```\n\nUpgrading\
    \ your projects using the .NET Upgrade Assistant provides a much quicker experience\
    \ than manually changing references and package dependencies.\n\n## Installing\
    \ the .NET global tool\n\nInstalling the tool is done by running the following\
    \ command in the .NET CLI.\n\n## Code Listing 5: The .NET CLI Command\n\n```bash\n\
    dotnet tool install -g upgrade-assistant\n```\n\nBecause the .NET Upgrade Assistant\
    \ is installed as a .NET tool, you can update it easily by running the following\
    \ command.\n\n## Code Listing 6: Updating the .NET Upgrade Assistant\n\n```bash\n\
    dotnet tool update -g upgrade-assistant\n```\n\nWith the tool installed, navigate\
    \ to the directory containing your project that needs to be upgraded and call\
    \ the following command.\n\n## Code Listing 7: Upgrading a Visual Studio Project\n\
    \n```bash\nupgrade-assistant upgrade\n```\n\nThe tool now provides an interactive\
    \ way of choosing the project to upgrade and a choice of which .NET version to\
    \ target.\n\n## Different upgrade types\n\nAs mentioned earlier in the chapter,\
    \ the .NET Upgrade Assistant supports three upgrade types. These upgrade types\
    \ provide different upgrade experiences and depend on which project types are\
    \ being upgraded.\n\n### In-place\n\nThis option upgrades your project all at\
    \ once. Creating a separate branch for the upgraded project in your source control\
    \ solution is prudent.\n\n### Side-by-side\n\nThe side-by-side option does not\
    \ modify your original project. It places a copy of your project in your solution\
    \ that contains the upgraded code. This is an excellent option if your project\
    \ contains many dependencies that might break after the upgrade.\n\n### Side-by-side\
    \ incremental\n\nWhen dealing with web applications that require upgrading from\
    \ ASP.NET to ASP.NET Core, this option is ideal because these technologies are\
    \ quite different. This upgrade type puts a .NET project next to your existing\
    \ .NET Framework project. It routes endpoints implemented in the .NET project\
    \ while routing all calls to the .NET Framework application. The side-by-side\
    \ incremental upgrade allows you to be in control and slowly upgrade your application\
    \ bit by bit.\n\n## In conclusion\n\nThe .NET Upgrade Assistant supported C# and\
    \ Visual Basic at the time of this writing. The supported projects are as follows:\n\
    \n- ASP.NET\n- Azure Functions\n- Windows Presentation Foundation\n- Windows Forms\n\
    - Class libraries\n- Console apps\n- .NET Native UWP\n- Xamarin Forms\n- .NET\
    \ MAUI\n\nThe upgrade paths that are supported are:\n\n- .NET Framework to .NET\n\
    - .NET Core to .NET\n- UWP to WinUI 3\n- Previous .NET version to the latest .NET\n\
    - Azure Forms v1-v3 to v4 isolated\n- Xamarin Forms to .NET MAUI\n  - XAML file\
    \ transformations only support upgrading namespaces. For comprehensive transformations,\
    \ use Visual Studio 2022 version 17.6 or later.\n\nIt goes without saying that\
    \ you need to test your project after an upgrade. The .NET Upgrade Assistant is\
    \ by no means a magic wand, but it allows for a much better developer experience\
    \ when compared to upgrading your project manually.\n\nFor more information on\
    \ the .NET Upgrade Assistant, you can browse this URL.\n\n## Chapter 2 A Closer\
    \ Look at C# 11\n\nC# 11 is a solid release when considering the new features\
    \ it introduces. Some of these changes include:\n\n- File-scoped types\n- Generic\
    \ math support\n- UTF-8 literals\n- Raw string literals\n- Required members\n\
    - Generic attributes\n- List patterns\n- Pattern matching on spans\n- Auto-default\
    \ structs\n\nDon't let the term support status of .NET 7.0 fool you. The following\
    \ sections show that .NET 7.0 offers exciting new features for developers.\n\n\
    > Note: Throughout this book, I use Visual Studio 17.6.6.\n\nLet's have a look\
    \ at some of these in detail in the following sections.\n\n## File-scoped types\n\
    \nC# 11 introduces the file contextual keyword, which is a scope access modifier.\
    \ This scopes the types to the file that they are in. This is very useful to source\
    \ code generators because classes with the same name will not be an issue.\n\n\
    Consider the following class called Student.s. It contains the Student class as\
    \ well as the Address class.\n\n```\nCode Listing 8: The Student Class and Address\
    \ Class\n```csharp\ninternal class Student\n{\n    public string GetStudentAddress()\n\
    \    {\n        return new Address().ReturnAddressDetails();\n    }\n}\n\npublic\
    \ class Address\n{\n    public string Address1 { get; set; }\n    public string\
    \ Address2 { get; set; }\n}\n```\n```\n"
