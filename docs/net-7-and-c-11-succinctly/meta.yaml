    \ int Id { get; set; }\n    public string Name { get; set; }\n    public int Age\
    \ { get; set; }\n}\n```\n\n使用 .NET 6 运行基准测试产生了列表 71 中的结果。\n\n代码列表 71：.NET 6 的\
