    \ all the performance improvements available.\n\n# Chapter 4 Performance Improvements\n\
    \nThe performance well has by no means run dry. Even though .NET 6 was fast, and\
    \ one could imagine that there was little else to do to speed up .NET any more,\
    \ comes some serious performance improvements. To quantify how many performance\
