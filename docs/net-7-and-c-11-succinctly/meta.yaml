- md: "\n- Mean: Arithmetic mean of all the measurements\n- Allocated: Allocated memory\
    \ per single operation (managed only, inclusive, 1KB = 1024B)\n- ns: 1 Nanosecond\n\
    - us: 1 Microsecond\n\nComparing the results from .NET 6 with those of .NET 7,\
    \ we can see that the times reduce significantly when using .NET 7, and .NET 7\
    \ also does not create any allocations.\n\nWhile the improvements in the previous\
    \ example are introduced in existing operations, performance improvements can\
    \ result from using new APIs in place of the previous ones. Let us look at the\
    \ popular OrderBy method.\n\n## LINQ—using the new Order method\n\nThe OrderBy\
    \ method in LINQ enables the creation of a sorted copy of the input enumerable.\
    \ Code List 68 lists the benchmark code for the next example.\n\nCode Listing\
    \ 68: LINQ Example using the New Order() Method\n\n```c\nusing BenchmarkDotNet.Attributes;\n\
    using BenchmarkDotNet.Running;\n\nnamespace PerformanceImprovements;\n\npublic\
    \ class Bench {\n    static void Main(string[] args) => BenchmarkRunner.Run<Bench>();\n\
    }\n\n[MemoryDiagnoser(displayGenColumns: false)]\n[DisassemblyDiagnoser]\n[HideColumns(\"\
    Error\", \"StdDev\", \"Median\", \"RatioSD\")]\npublic class Bench {\n    [Params(1024)]\n\
    \    public int Length {get; set; }\n\n    private int[] _intArray;\n\n    [GlobalSetup]\n\
    \    public void Setup() => _intArray = Enumerable.Range(1, Length).Reverse().ToArray();\n\
    \n    [Benchmark(Baseline = true)]\n    public void OrderBy() {\n        foreach\
    \ (int x in _intArray.OrderBy(x => x)) {\n        }\n    }\n\n    [Benchmark]\n\
    \    public void Order()\n    {\n        foreach (int x in _intArray.Order())\
    \ {\n        }\n    }\n}\n```\n\nYou can see that I have an array of integers\
    \ that I sort using OrderBy(x => x) and another new Order() method available in\
    \ .NET 7. Incrementally, .NET 7 also introduces OrderDescending().\n\nIf you try\
    \ to run this benchmark code using `dotnet run -c Release -f net6.0 --filter ***\
    \ --runtimes` you will receive a build error. This error is because the Order()\
    \ method is unavailable in .NET 6.\n\nWith that in mind, run the Console application\
    \ using .NET 7 by changing the command to `dotnet run -c Release -f net7.0 --filter\
    \ *** --runtimes net7.0`.\n\n## Code Listing 69: OrderBy() Versus Order() Results\n\
    \n| Method | Length | Mean | Ratio | Code Size | Allocated | Alloc Ratio |\n|\
    \ --- | --- | --- | --- | --- | --- | --- |\n| Order | 1024 | 95.13 us | 1.00\
    \ | 427 B | 12.3 KB | 1.00 |\n| Order | 1024 | 90.64 us | 0.96 | 336 B | 8.28\
    \ KB | 0.67 |\n\nThe results in Listing 69 speak for themselves. With OrderBy(),\
    \ the caller passes a Func<T, TKey> predicate, to emit a comparison for each item.\
    \ Seeing as it is pretty common to sort items with the keys, .NET 7 performs the\
    \ same sorting with an implicit x => x on behalf of the caller.\n\nIf you face\
    \ a situation where you need to use OrderBy(x => x), consider using the Order()\
    \ method instead. As you can see from Code Listing 69, the allocations are reduced\
    \ significantly in .NET 7 using the new Order() method.\n\n## JSON improvements\n\
    \n.NET Core 3 introduced developers to System.Text.Json with a significant investment\
    \ into .NET 7. One of the pitfalls, though, concerns how the library caches data.\
    \ To improve serialization and deserialization performance when the source generator\
    \ is not used, reflection is used by System.Text.Json to emit custom code for\
    \ writing members of the processed types.\n\nThe library incurs a more significant\
    \ one-time cost performing this code generation, making subsequent handling of\
    \ the types fast (assuming that the generated code is available for use). The\
    \ generated handlers require them to be stored somewhere, where is where JsonSerializerOptions\
    \ come into play.\n\nThe idea behind JsonSerializerOptions is that developers\
    \ would create an instance and pass that along all the required serialization\
    \ and deserialization calls. If, however, developers deviate from the recommended\
    \ model, performance tasks suffer. What happens now is instead of taking the hit\
    \ for reflection invoke costs, every instance of JsonSerializerOptions results\
    \ in a regeneration of the handlers via reflection emit, which increases the cost\
    \ of the serialization and deserialization.\n\nConsider the code illustrated in\
    \ Code Listing 70.\n\n## Code Listing 70: JSON Serialization\n\n```csharp\nusing\
    \ System.Text.Json;\nusing BenchmarkDotNet.Attributes;\nusing BenchmarkDotNet.Running;\n\
    \nnamespace PerformanceImprovements;\n\npublic class Program\n{\n    static void\
    \ Main(string[] args) => BenchmarkRunner.Run<Bench>();\n}\n\n[MemoryDiagnoser(displayGenColumns:\
    \ false)]\n[DisassemblyDiagnoser]\n[HideColumns(\"Error\", \"StdDev\", \"Median\"\
    , \"RatioSD\")]\npublic class Bench\n{\n    private JsonSerializerOptions _options\
    \ = new JsonSerializerOptions();\n    private StudentPoco _student = new StudentPoco();\n\
    \n    [Benchmark(Baseline = true)]\n    public string ImplicitOptions() => JsonSerializer.Serialize(_student);\n\
    \n    [Benchmark]\n    public string WithCached() => JsonSerializer.Serialize(_student,\
    \ _options);\n\n    [Benchmark]\n    public string WithoutCached() => JsonSerializer.Serialize(_student,\
    \ new JsonSerializerOptions());\n}\n\npublic class StudentPoco\n{ \n    public\
    \ int Id { get; set; }\n    public string Name { get; set; }\n    public int Age\
    \ { get; set; }\n}\n```\n\nRunning benchmarks using .NET 6 produces the results\
    \ in Code Listing 71.\n\n## Code Listing 71: JSON Serialization with .NET 6\n\n\
    | [Host] : .NET 6.0.016 (6.0.1623.17311), X64 RyuJIT AVX2 | | |\n| DefaultJob\
    \ : .NET 6.0.016 (6.0.1623.17311), X64 RyuJIT AVX2 | | |\n| Method | Mean | Code\
    \ Size | Allocated | Alloc Ratio |\n| --- | --- | --- | --- | --- |\n| ImplicitOptions\
    \ | 325.3 ns | 999 B | 232 B | 1.00 |\n| WithCached | 313.1 ns | 871 B | 232 B\
    \ | 1.00 |\n| WithoutCached | 344,578.1 ns | 1,180 B | 13623 B | 58.72 |\n\nRunning\
    \ benchmarks using .NET 7, illustrated a very different picture.\n\n## Code Listing\
    \ 72: JSON Serialization with .NET 7\n\n| [Host] : .NET 7.0.5 (7.0.523.17405),\
    \ X64 RyuJIT AVX2 | | |\n| DefaultJob : .NET 7.0.5 (7.0.523.17405), X64 RyuJIT\
    \ AVX2 | | |\n| Method | Mean | Code Size | Allocated | Alloc Ratio |\n| --- |\
    \ --- | --- | --- | --- |\n| ImplicitOptions | 323.4 ns | 1,004 B | 80 B | 1.00\
    \ |\n| WithCached | 327.7 ns | 680 B | 80 B | 1.00 |\n| WithoutCached | 1,112.5\
    \ ns | 865 B | 311 B | 3.89 |\n\n.NET 7 adds a global cache containing the type\
    \ information and separates it from the options instances. Using JsonSerializerOptions\
    \ still caches, but if new handlers are generated with reflection emit, they are\
    \ cached at the global level.\n\nAs seen in the results for WithoutCached(), creating\
    \ a new JsonSerializerOptions is still expensive, but much less expensive when\
    \ using .NET 7.\n\n## In conclusion\n\nIllustrating all the performance improvements\
    \ made in .NET 7 would take a whole book on its own. The takeaway here is to realize\
    \ that even though .NET 7 is a Standard Term Support release, that doesn't mean\
    \ you shouldn't upgrade your projects to .NET 7. The performance boost that your\
    \ projects gain out of the box is reason enough to upgrade to .NET 7.\n\nFor more\
    \ information on BenchmarkDotNet, refer to their [documentation here](https://github.com/dotnet/BenchmarkDotNet).\n"
