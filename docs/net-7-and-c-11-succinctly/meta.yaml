    \ =>\n{\n    opt.GlobalLimiter =\n        PartitionedRateLimiter.CreateChained<HttpContext,\
    \ string>(httpContext => RateLimitPartition.GetFixedWindowLimiter(\n         \
    \       partitionKey: httpContext.User.Identity?.Name ??\n                HttpContext.Request.Headers.Host.ToString(),\n\
    \                factory: partition => new FixedWindowRateLimiter\n          \
    \      {\n                    AutoReplenishment = true,\n                    PermitLimit\
    \ = 100,\n                    QueueLimit = 0,\n                    Window = TimeSpan.FromMinutes(1)\n\
    \                })),\n            PartitionedRateLimiter.Create<HttpContext,\
    \ string>(httpContext => RateLimitPartition.GetFixedWindowLimiter(\n         \
    \           partitionKey: httpContext.User.Identity?.Name ??\n               \
    \     HttpContext.Request.Headers.Host.ToString(),\n                    factory:\
    \ partition => new FixedWindowRateLimiter\n                    {\n           \
    \             AutoReplenishment = true,\n                        PermitLimit =\
    \ 1000,\n                        QueueLimit = 0,\n                        Window\
    \ = TimeSpan.FromHours(1)\n                    }))\n});\n\nvar app = builder.Build();\n\
    \nif (app.Environment.IsDevelopment())\n{\n    app.UseSwagger();\n    app.UseSwaggerUI();\n\
    }\n\n// Enable rate limiting middleware.\napp.UseRateLimiter();\napp.UseHttpsRedirection();\n\
    \napp.UseAuthorization();\napp.MapControllers();\napp.Run();\n```\n\nThe first\
    \ rate limiter limits ASP.NET Core that I only want to allow 100 requests per\
    \ minute. I do this by specifying the PermitLimit = 100 and the Window = TimeSpan.FromMinutes(1).\n\
    \nThe second rate limiter limits that I only want to allow 1000 requests in a\
    \ single hour. I do this by specifying PermitLimit = 1000 and Window = TimeSpan.FromHours(1).\n\
    \nTherefore, my API can handle bursts of requests but still limit the total number\
    \ of requests to whatever the second rate limiter allows. My API will then apply\
    \ the combination of the two rate limiters that I have specified.\n\n# Output\
    \ caching\n\nASP.NET Core provides developers with various options when it comes\
    \ to caching. These caching options have also been around for some time now. These\
    \ are:\n\n- In-memory cache\n- Distributed cache\n- Response cache\n- Output caching\
    \ (new in .NET Core 7)\n\nIn-memory cache and distributed cache are server-side\
    \ options. The client does not know about these. Let's have a look at these in\
    \ more detail.\n\n# In-memory cache\n\nThe simplest of the caching mechanisms\
    \ is in-memory cache. Here we simply store the data in the memory of the server.\
    \ In-memory cache is key-value based. Based on the key, we can return a value\
    \ stored previously from the cache. Due to the in-memory nature of this cache,\
    \ caching mechanism might not work as you expect when using multiple servers,\
    \ unless you set up server affinity. In situations like this, using a distributed\
    \ cache, such as Redis, is recommended.\n\n# Distributed cache\n\nMultiple servers\
    \ can access a shared, distributed cache. It, therefore, does not matter if the\
    \ same server handles the request. Each server has access to the same shared data.\n\
    \n# Response cache\n\nWhen we use response caching, it relies on enabling the\
    \ client to cache server responses based on specific HTTP cache headers. Sometimes\
    \ this approach does not work with UI applications such as MVC-based pages because\
    \ browsers typically set request headers that can prevent caching.\n\n# Output\
    \ caching\n\nOutput caching is now available with ASP.NET Core 7. Output caching\
    \ solves the problem with response caching because it caches the HTTP response\
    \ on the server. It, for, does not rely on the headers of the request. As mentioned\
    \ earlier, response caching is partly controlled by the client. With output caching,\
    \ the server is in control of deciding if a cached response is sent back. In ASP.NET\
    \ Core 7, you can enable output caching through middleware.\n\nThis means that\
    \ the first request received is handled as usual. When a new request is received,\
    \ the server can decide if a cached response is returned. This reduces the load\
    \ on the server. Various options are available with output caching to control\
    \ how the cached responses are stored. Different values can be stored based on\
    \ a parameter value, query value, header value, and so on.\n\nLet's look at some\
    \ code to demonstrate how to implement output caching. It's a bit difficult to\
    \ illustrate output caching in a book, so you need to run the code to see output\
    \ caching in action.\n\n> Code Listing 46: Add Output Caching\n\n```csharp\npublic\
    \ class Program\n{\n    public static void Main(string[] args)\n    {\n      \
    \  var builder = WebApplication.CreateBuilder(args);\n\n        // Add services\
    \ to the container.\n        builder.Services.AddControllers();\n        builder.Services.AddEndpointsApiExplorer();\n\
    \        builder.Services.AddSwaggerGen();\n\n        // Add output cache in the\
    \ services collection.\n        builder.Services.AddOutputCache(opt =>\n     \
    \   {\n            opt.DefaultExpirationTimeSpan = TimeSpan.FromSeconds(5);\n\
    \        });\n\n        var app = builder.Build();\n\n        // Configure the\
    \ HTTP request pipeline.\n        if (app.Environment.IsDevelopment())\n     \
    \   {\n            app.UseSwagger();\n            app.UseSwaggerUI();\n      \
    \  }\n        app.UseHttpsRedirection();\n        app.UseAuthorization();\n  \
    \      // Add middleware for output caching.\n        app.UseOutputCache();\n\
    \        // Add CacheOutput for output caching to work.\n        app.MapControllers().CacheOutput();\n\
    \n        app.Run();\n    }\n}\n```\n\nThe code in Code Listing 46 adds output\
    \ caching to the services collection with a DefaultExpirationTimeSpan of five\
    \ seconds. This means the API returns the cached response when a request comes\
    \ in within this five-second time.\n\nSecondly, I must add the middleware app.UseOutputCache()\
    \ for the output cache to work. Output caching is now configured but will not\
    \ work until you add CacheOutput() on the endpoint MapControllers().\n\nRunning\
    \ the API, you will see the Swagger page (Figure 33) where you can test the API.\n\
    \n# WeatherForecast\n\n![](img/778d5698a16c98b6e4877f67a9324f37_61_0.png)\n\n\
    Figure 33: Testing Output Caching in Swagger\n\nClicking on the Execute button\
    \ will hit the WeatherForecast controller on the first request. As seen in Figure\
    \ 34, you will see the controller hit on the first request if you place a breakpoint\
    \ as illustrated.\n\n# [HttpGet(Name = \"GetWeatherForecast\")]\n\n```csharp\n\
    public IEnumerable<WeatherForecast> Get()\n{\n    return Enumerable.Range(1, 5)\n\
    \        .Select(index => new WeatherForecast\n        {\n            Date = DateOnly.FromDateTime(DateTime.Now.AddDays(index)),\n\
    \            TemperatureC = Random.Shared.Next(-20, 55),\n            Summary\
    \ = Summaries[Random.Shared.Next(Summaries.Length)]\n        })\n        .ToArray();\n\
    }\n```\n\nFigure 34: The WeatherForecast Controller Breakpoint\n\nSubsequent requests\
    \ within five seconds not hit the controller. Once the five seconds are over,\
    \ the controller is hit again.\n\nThis approach is a broad one because of how\
    \ we configured output caching. This results in all controllers caching their\
    \ responses. We can be more granular when configuring how output caching works.\n\
    \nImagine if we want to cache the output based on the forecast days, which will\
    \ be specified in the query string. In Code Listing 47, notice that I have added\
    \ a policy to the cached responses by the query string days.\n\n# Code Listing\
    \ 47: Configure Caching by Query Strings\n\n```csharp\npublic class Program\n\
    {\n    public static void Main(string[] args)\n    {\n        var builder = WebApplication.CreateBuilder(args);\n\
    \n        // Add services to the container.\n        builder.Services.AddControllers();\n\
    \        builder.Services.AddEndpointsApiExplorer();\n        builder.Services.AddSwaggerGen();\n\
    \n        // Add output cache in the services collection.\n        builder.Services.AddOutputCache(opt\
    \ =>\n        {\n            opt.DefaultExpirationSpan = TimeSpan.FromSeconds(5);\n\
    \        });\n\n        var app = builder.Build();\n\n        // Configure the\
    \ HTTP request pipeline.\n        if (app.Environment.IsDevelopment())\n     \
    \   {\n            app.UseSwagger();\n            app.UseSwaggerUI();\n      \
    \  }\n\n        app.UseHttpsRedirection();\n        app.UseAuthorization();\n\
    \        // Add middleware for output caching.\n        app.UseOutputCache();\n\
    \        // Add CacheOutput for output caching to work.\n        app.MapControllers(policy\
    \ =>\n        {\n            policy.SetVarByQuery(\"days\");\n            policy.Expire(TimeSpan.FromSeconds(5));\n\
    \        });\n\n        app.Run();\n    }\n}\n```\n\nI also need to modify the\
    \ controller, as seen in Code Listing 48, to use the days I pass to return the\
    \ forecast for the days specified.\n\n# Code Listing 48: Specify Forecast Days\n\
    \n```csharp\n[HttpGet(Name = \"GetWeatherForecast\")]\npublic IEnumerable<WeatherForecast>\
    \ Get(int days)\n{\n    return Enumerable.Range(1, days)\n        .Select(index\
    \ => new WeatherForecast\n        {\n            Date = DateOnly.FromDateTime(DateTime.Now.AddDays(index)),\n\
    \            TemperatureC = Random.Shared.Next(-20, 55),\n            Summary\
    \ = Summaries[Random.Shared.Next(Summaries.Length)]\n        })\n        .ToArray();\n\
    }\n```\n"
  mdcn: "\n\n```csharp\nbuilder.Services.AddControllers();\nbuilder.Services.AddEndpointsExplorer();\n\
    builder.Services.AddSwaggerGen();\n\n// 链式限流器。\nbuilder.Services.AddRateLimiter(opt\
    \ =>\n{\n    opt.GlobalLimiter =\n        PartitionedRateLimiter.CreateChained<HttpContext,\
    \ string>(httpContext => RateLimitPartition.GetFixedWindowLimiter(\n         \
    \       partitionKey: httpContext.User.Identity?.Name ??\n                HttpContext.Request.Headers.Host.ToString(),\n\
    \                factory: partition => new FixedWindowRateLimiter\n          \
    \      {\n                    AutoReplenishment = true,\n                    PermitLimit\
    \ = 100,\n                    QueueLimit = 0,\n                    Window = TimeSpan.FromMinutes(1)\n\
    \                })),\n            PartitionedRateLimiter.Create<HttpContext,\
    \ string>(httpContext => RateLimitPartition.GetFixedWindowLimiter(\n         \
    \           partitionKey: httpContext.User.Identity?.Name ??\n               \
    \     HttpContext.Request.Headers.Host.ToString(),\n                    factory:\
    \ partition => new FixedWindowRateLimiter\n                    {\n           \
    \             AutoReplenishment = true,\n                        PermitLimit =\
    \ 1000,\n                        QueueLimit = 0,\n                        Window\
    \ = TimeSpan.FromHours(1)\n                    }))\n});\n\nvar app = builder.Build();\n\
    \nif (app.Environment.IsDevelopment())\n{\n    app.UseSwagger();\n    app.UseSwaggerUI();\n\
    }\n\n// 启用限流中间件。\napp.UseRateLimiter();\napp.UseHttpsRedirection();\n\napp.UseAuthorization();\n\
    app.MapControllers();\napp.Run();\n```\n\n第一个限流器限制了 ASP.NET Core，我只想每分钟允许 100\
    \ 次请求。我通过指定 `PermitLimit = 100` 和 `Window = TimeSpan.FromMinutes(1)` 这一点。\n\n\
    第二个限流器限制了我只想每小时内允许 1000 次请求。我通过指定 `PermitLimit = 1000` 和 `Window = TimeSpan.FromHours(1)`\
    \ 这一点。\n\n因此，我的 API 可以处理突发请求，但仍会将总请求数限制在第二个限流器允许的范围内。我的 API 随后将应用我指定的两个限流器的组合。\n\
    \n# 输出缓存 (Output caching)\n\nASP.NET Core 在缓存方面为开发者提供了多种选项。这些缓存选项已经存在一段时间了。它们是：\n\
    \n- 内存缓存 (In-memory cache)\n- 分布式缓存 (Distributed cache)\n- 响应缓存 (Response cache)\n\
    - 输出缓存 (Output caching，.NET Core 7 新增)\n\n内存缓存和分布式缓存是服务器端选项。客户端并感知不到这些内容。让我们详细查看它们。\n\
    \n# 内存缓存\n\n缓存机制中最简单的是内存缓存。在这里，我们只需将数据存储在服务器的内存中。内存缓存是基于键值（key-value）的。根据键，我们可以从缓存中返回之前存储的值。由于这种缓存的内存特性，当使用多个服务器时，除非设置了服务器会性（server\
    \ affinity），否则缓存机制可能无法按您预期的方式工作。在这种情况下，建议使用分布式缓存（如 Redis）。\n\n# 分布式缓存\n\n多个服务器可以访问共享的分布式缓存。因此，请求是否由同一台服务器处理并不重要。每台服务器都可以访问相同的共享数据。\n\
    \n# 响应缓存\n\n当我们使用响应缓存时，它依赖于允许客户端根据特定的 HTTP 缓存标头缓存服务器响应。有时这种方法在 UI 应用（如基于 MVC 的页面）中不起，因为浏览器通常会设置阻止缓存的请求标头。\n\
    \n# 输出缓存\n\n输出缓存现在 ASP.NET Core 7 中已可用。输出缓存解决了响应缓存的问题，因为它在服务器上缓存了 HTTP 响应。因此，它不依赖于请求标头。如前提到的，响应缓存部分由客户端控制。而使用输出缓存，由服务器控制决定是否发回缓存响应。在\
    \ ASP.NET Core 7 中，您可以通过中间件启用输出缓存。\n\n这意味着接收到的第一个请求将像常一样处理。当接收到新请求时，服务器可以决定是否返回缓存响应。这减轻了服务器的负载。输出缓存提供了多种选项来控制缓存响应的存储方式。可以根据参数值、查询值、标头值等存储不同的值。\n\
    \n让我们通过代码来演示如何实现输出缓存。在书中说明输出缓存有点困难，因此您需要运行代码来查看输出缓存的实际效果。\n\n> 代码列表 46：添加输出缓存\n\
    \n```csharp\npublic class Program\n{\n    public static void Main(string[] args)\n\
    \    {\n        var builder = WebApplication.CreateBuilder(args);\n\n        //\
    \ 将服务添加到容器。\n        builder.Services.AddControllers();\n        builder.Services.AddEndpointsApiExplorer();\n\
    \        builder.Services.AddSwaggerGen();\n\n        // 在服务集合中添加输出缓存。\n     \
    \   builder.Services.AddOutputCache(opt =>\n        {\n            opt.DefaultExpirationTimeSpan\
    \ = TimeSpan.FromSeconds(5);\n        });\n\n        var app = builder.Build();\n\
    \n        // 配置 HTTP 请求管道程序。\n        if (app.Environment.IsDevelopment())\n \
    \       {\n            app.UseSwagger();\n            app.UseSwaggerUI();\n  \
    \      }\n        app.UseHttpsRedirection();\n        app.UseAuthorization();\n\
    \        // 添加输出缓存的中间件。\n        app.UseOutputCache();\n        // 为了让输出缓存工作，添加\
    \ CacheOutput。\n        app.MapControllers().CacheOutput();\n\n        app.Run();\n\
    \    }\n}\n```\n\n"
