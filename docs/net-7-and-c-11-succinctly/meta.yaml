    \  \"title\": \"Movie 3\",\n  \"description\": \"Movie 3 description.\",\n  \"\
    watched\": true\n  },\n  {\n  \"title\": \"Movie 4\",\n  \"description\": \"Movie\
    \ 4 description.\",\n  \"watched\": false\n  }\n}\n```\n\nLet's extend this endpoint\
    \ filter by adding the AddEndpointFilter method, as seen in Code Listing 53. The\
