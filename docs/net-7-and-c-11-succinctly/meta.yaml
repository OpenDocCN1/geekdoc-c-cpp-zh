  md: '# In conclusion


    Illustrating all the performance improvements made in .NET 7 would take a whole
    book on its own. The takeaway here is to realize that even though .NET 7 is a
    Standard Term Support release, that doesn''t mean you shouldn''t upgrade your
    projects to .NET 7. The performance boost that your projects gain out of the box
    is reason enough to upgrade to .NET 7.


    For more information on BenchmarkDotNet, refer to their [documentation here](https://github.com/dotnet/BenchmarkDotNet).'
