- md: "\nYou will see an Interface in Code Listing 60 that uses a few static, abstract\
    \ Interface members. It contains properties for a Pattern (which is the path to\
    \ the endpoint); a Method property that specifies GET, POST, PUT, and so on; and\
    \ lastly, there is a Delegate, which is the handler that tells how my API can\
    \ handle the request it receives.\n\n# Code Listing 61: MapEndpointExtension Method\n\
    \n```\nnamespace MinimalAPIStaticAbstrInterMembers;\npublic static class EndpointExtensions\n\
    {\n    public static IEndpointRouteBuilder MapEndpoint<T>(this\nIEndpointRouteBuilder\
