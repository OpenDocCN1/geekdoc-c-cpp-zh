- md: "\n# Code Listing 16: The Modified Mathinator Class\n\n```cs\ninternal class\
    \ Mathinator {\n    public T SumArray<T>(T[] _values) where T : INNumber<T>\n\
    \    {\n        T result = T.Zero;\n        foreach (T i in _values)\n       \
    \ {\n            result += i;\n        }\n        return result;\n    }\n}\n```\n\
    \nLooking closely at INNumber, you notice that Zero is not the only property exposed.\n\
    \n![](img/778d5698a16c98b6e4877f67a9324f37_30_0.png)\n\nFigure 18: Properties\
    \ of INNumber\n\nThere are also several methods available for use. Why did this\
    \ work? What has changed in C# 11 and NET 7.0, and how does this generic math\
    \ open up more possibilities for developers? The answer is that C# 11 lets you\
    \ define static virtual interface members. This new feature allows us to use generic\
    \ algorithms to specify 'number-like' behavior.\n\nThe Microsoft documentation\
    \ defines static abstract and virtual members as follows:\n\n> With C# 11\n\n\
    You might be wondering how this would apply to you in a real-world situation.\
    \ I demonstrate this when I discuss minimal APIs in the next Chapter. So stick\
    \ around, things are getting better here on out.\n\n# UTF-8 literals\n\nUTF-8\
    \ is considered the encoding of the web. It's also used in significant parts of\
    \ the .NET stack. The network stack still makes use of constants in code. Think\
    \ of HTTP/1.0\\r\\n, AUTH, or even Content-Length:, which we see so often.\n\n\
    Unfortunately, there is no efficient syntax for dealing with these constants,\
    \ and C# represents all strings as C# UTF-16 encoding.\n\nWith C# 11, you can\
    \ mark strings as UTF-8 using the u8 suffix, as seen in Code List 17.\n\nCode\
    \ List 17: Using the u8 Suffix on Strings\n\n```cs\nReadOnlySpan<byte> utf8 =\
    \ \"AUTH\"u8;\n```\n\nCompare the size difference of UTF-16 versus UTF-8.\n\n\
    ![](img/778d5698a16c98b6e4877f67a9324f37_31_0.png)\n\nFigure 19: UTF-16 Encoding\n\
    \nAs you can see when comparing Figure 19 and Figure 20, the utf16 variable contains\
    \ 10 bytes, while the utf8 variable contains only 5 bytes.\n\n```cs\nReadOnlySpan<byte>\
    \ utf8 = \"AUTH\"u8; // with debugger view\n```\n\nFigure 20: UTF-8 Encoding\n\
    \nThis difference is due to the size difference between the different encodings.\n\
    \n# Raw string literals\n\nThe next feature makes life much easier for developers\
    \ when working with strings. Consider the XML Prologue in Figure 21.\n\n```cs\n\
    var xmlPrologue = \"<?xml version=\\\"1.0\\\" encoding=\\\"UTF-8\\\">\";\n```\n\
    \nFigure 21: The Literal String Unescaped\n\nBecause the string is not escaped,\
    \ the double quotes are invalid, because in C#, you cannot have a double quote\
    \ inside a string. We generally overcome this by escaping the double quotes illustrated\
    \ in Code Listing 18.\n\nCode Listing 18: Escaping the Double Quotes\n\n```cs\n\
    var xmlPrologue = \"<?xml version=\\\"1.0\\\" encoding=\\\"UTF-8\\\">\";\n```\n\
    \nYou can also escape the double quotes by using a verbatim string, but you still\
    \ need to escape the double quotes by doubling them up.\n\nCode Listing 19: Another\
    \ Way to Escape Quotes\n\n```cs\nvar xmlPrologue = @\"<?xml version=\\\"1.0\\\"\
    \ encoding=\\\"UTF-8\\\">\";\n```\n\nIn C# 11, you can escape the double quotes\
    \ inside the string by doubling three double quotes around the string, as illustrated\
    \ in Code Listing 20.\n\nCode Listing 20: Raw String Literals\n\n```cs\nvar xmlPrologue\
    \ = \"\"\"<?xml version=\"1.0\" encoding=\"UTF-8\">\"\"\";\n```\n\nRaw string\
    \ literals certainly help make the string much more readable. If, by chance, happen\
    \ to have three double quotes in a string, then you would escape this by adding\
    \ four double quotes around, as illustrated in Code Listing 21.\n\nCode Listing\
    \ 21: Escaping Three Double Quotes\n\n```cs\nvar myString = \"\"\"This is a string\
    \ with \"\" double quotes\"\"\";\n```\n\nThis logic can continue indefinitely.\
    \ In other words, if your string contains n double quotes, you have to start and\
    \ end your string with n+1 double quotes.\n\nRaw string literals also work well\
    \ when dealing with JSON strings. Consider the escaped JSON string in Code Listing\
    \ 22.\n\n# Code Listing 22: Escaping a JSON String\n\n```cs\nvar jsonString =\
    \ \"{\\n  \\\"course\\\": \\\"NET 7 and C# 11 Succinctly\\\"\\n}\";\n```\n\nRunning\
    \ the program results in the JSON, as illustrated in Code Listing 23.\n\n# Code\
    \ Listing 23: The JSON Output\n\n```json\n{\n  \"course\": \".NET 7 and C# 11\
    \ Succinctly\"\n}\n```\n\nThe code in Code Listing 22 does not read very nicely\
    \ and becomes more complicated when the JSON string becomes more complicated.\n\
    \n# Code Listing 24: Working with JSON\n\n```cs\nvar jsonString = @\"{{\n  \"\"\
    course\"\": \"\".NET 7 and C# 11 Succinctly\"\"\n}\"\";\n```\n\nUsing raw string\
    \ literals, you can write a much better representation of your JSON string, as\
    \ illustrated in Code Listing 24.\n\n# Using string interpolation\n\nYou might\
    \ be wondering if string interpolation works with raw string literals.\n\n# Code\
    \ Listing 25: Using String Interpolation\n\n```cs\nvar foxColor = \"brown\";\n\
    var myString = $+\"\"\"The quick {foxColor} fox\";\n```\n\nAs illustrated in Code\
    \ Listing 25, string interpolation works as expected. You need to do a little\
    \ more when working with strings that contain curly braces, as in JSON.\n\n# Code\
    \ Listing 26: String Interpolation with Strings Containing Curly Braces\n\n```cs\n\
    var courseName = \".NET 7 and C# 11 Succinctly\";\nvar jsonString = $+\"\"\"{{\n\
    \  \"\"course\"\": \"\"{{courseName}}\"\"\n}}\"\"\n```\n\nAs illustrated in Code\
    \ Listing 26, you must double up the $ sign, and because the JSON string contains\
    \ curly braces, you need to double up the curly braces around the courseName variable.\n\
    \n# Required members\n\nWith C# 11, we finally have a way to resolve a particular\
    \ bugbear of mine. Consider the Person class illustrated in Code Listing 27.\n\
    \nCode Listing 27: The Person Class\n\n```cs\npublic class Person {\n    public\
    \ string Firstname { get; init; }\n    public string Lastname { get; init; }\n\
    }\n```\n\nIn C# 9, the introduction of the init keyword gave me a way to only\
    \ allow the property to be set on the initialization of the class, as seen in\
    \ Figure 22.\n\n```cs\nvar person = new Person() {\n    Firstname = \"Dirk\",\n\
    \    Lastname = \"Strauss\"\n}\n\nperson.Firstname = \"\";\nperson.Lastname =\
    \ \"\";\n```\n\nFigure 22: Using the init-Only Properties\n\nUsing init meant\
    \ that if I wanted to change these properties later on, C# wouldn't allow me to\
    \ do this. While this worked as intended, C# was all too happy to allow me not\
    \ to specify a value for my init properties during the initialization of the class.\n\
    \n```cs\nvar person = new Person() {\n\n    person.Firstname = \"\";\n    person.Lastname\
    \ = \"\";\n}\n```\n\nFigure 23: Not Providing Property Values on Initialization\n\
    \nYou can see this behavior in Figure 23. While it tells me that I can only assign\
    \ my init-only properties in an object initializer, it does not have a problem\
    \ with the fact that I never assigned any values to begin with. If I wanted to\
    \ enforce that these properties be set on initialization, I would have to demand\
    \ it from the constructor, as illustrated in Code Listing 28.\n\nCode Listing\
    \ 28: Forcing Values to be Set\n\n```cs\npublic class Person {\n    public string\
    \ Firstname { get; init; }\n    public string Lastname { get; init; }\n\n    public\
    \ Person(string firstName, string lastname)\n    {\n        Firstname = firstName;\n\
    \        Lastname = lastname;\n    }\n}\n```\n\nRequired members in C# 11 provide\
    \ a more elegant approach to this issue.\n\n# Code Listing 29: Using Required\
    \ Keyword\n\n```cs\npublic class Person {\n    public required string Firstname\
    \ { get; init; }\n    public required string Lastname { get; init; }\n}\n```\n\
    \nAs illustrated in Code Listing 29, I can now tell C# that these properties must\
    \ be assigned when initializing.\n\n![](img/778d5698a16c98b6e4877f67a9324f37_35_0.png)\n\
    \nFigure 24: Compiler Error on Unset Properties\n\nRequired members give me more\
    \ control over the classes I create, allowing me to express my intent more clearly\
    \ to consuming code.\n\n# Code Listing 30: Extending the Person Class\n\n```cs\n\
    public class Person\n{\n  public required string Firstname { get; init; }\n  public\
    \ required string Lastname { get; init; }\n  public required int Age { get; set;\
    \ }\n}\n```\n\nThis means that, while I can only set Firstname and Lastname on\
    \ object initialization, all three properties are required, allowing me to set\
    \ a different value for the Age property after object initialization.\n\n```cs\n\
    var person = new Person(\n  Firstname = \"Dirk\",\n  Lastname = \"Strauss\",\n\
    \  Age = 47\n);\n\nperson.Firstname = \"\";\nperson.Lastname = \"\";\nperson.Age\
    \ = 1;\n```\n\nFigure 25: Setting Age after Initialization\n\n# Generic attributes\n\
    \nLet me start by defining what an attribute is. According to the Microsoft documentation:\n\
    \nInformation provided by an attribute is also known as metadata. Metadata can\
    \ be examined at run time by your application to control how your program processes\
    \ data, or before run time by external tools to control how your application itself\
    \ is processed or maintained.\n\nI have created a filter for the boilerplate weather\
    \ API project in Visual Studio to demonstrate generic attributes. The filter allows\
    \ me to do something before and after an endpoint call.\n\nCode Listing 31: My\
    \ Log Filter\n\n```cs\npublic class LogFilter : IAsyncActionFilter\n{\n  public\
    \ ILogger<LogFilter> _logger;\n  public LogFilter(ILogger<LogFilter> logger) =>\
    \ _logger = logger;\n}\n```\n"
