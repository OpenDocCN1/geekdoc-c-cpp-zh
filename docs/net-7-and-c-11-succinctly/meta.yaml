  md: "# Figure 12: The Upgrade Result\n\nYou will also see the results for each component\
    \ in the window below the Upgrade Assistant. Hover over each check icon to see\
    \ a descriptive tooltip.\n\nIf you compare the project file before the upgrade\
    \ process (Code Listing 3) to the project after the upgrade process (Code Listing\
    \ 4), you will notice that a lot has changed.\n\n# Code Listing 4: The Upgraded\
    \ Project File\n\n```\n<ProjectSdk=\"Microsoft.NET.Sdk.Web\">\n  <PropertyGroup>\n\
    \    <TargetFramework>net7.0</TargetFramework>\n    <DebugTypeType>full</DebugTypeType>\n\
    \  </PropertyGroup>\n</Project>\n```\n\nUpgrading your projects using the .NET\
    \ Upgrade Assistant provides a much quicker experience than manually changing\
    \ references and package dependencies.\n\n# Installing the .NET global tool\n\n\
    Installing the tool is done by running the following command in the .NET CLI.\n\
    \n# Code Listing 5: The .NET CLI Command\n\n```\ndotnet tool install -g upgrade-assistant\n\
    ```\n\nBecause the .NET Upgrade Assistant is installed as a .NET tool, you can\
    \ update it easily by running the following command."
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Code Listing 6: Updating the .NET Upgrade Assistant


    ```

    dotnet tool update -g upgrade-assistant

    ```


    With the tool installed, navigate to the directory containing your project that
    needs to be upgraded and call the following command.


    # Code Listing 7: Upgrading a Visual Studio Project


    ```

    upgrade-assistant upgrade

    ```


    The tool now provides an interactive way of choosing the project to upgrade and
    a choice of which .NET version to target.


    # Different upgrade types


    As mentioned earlier in the chapter, the .NET Upgrade Assistant supports three
    upgrade types. These upgrade types provide different upgrade experiences and depend
    on which project types are being upgraded.


    # In-place


    This option upgrades your project all at once. Creating a separate branch for
    the upgraded project in your source control solution is prudent.


    # Side-by-side


    The side-by-side option does not modify your original project. It places a copy
    of your project in your solution that contains the upgraded code. This is an excellent
    option if your project contains many dependencies that might break after the upgrade.


    # Side-by-side incremental


    When dealing with web applications that require upgrading from ASP.NET to ASP.NET
    Core, this option is ideal because these technologies are quite different. This
    upgrade type puts a .NET project next to your existing .NET Framework project.
    It routes endpoints implemented in the .NET project while routing all calls to
    the .NET Framework application. The side-by-side incremental upgrade allows you
    to be in control and slowly upgrade your application bit by bit.


    # In conclusion


