- pgno: 197
  md: 'You can type a space and add another text-decoration value (Table 6.11). As
    long as the first value is not none, you can use multiple text decorations by
    adding more values in a list separated by spaces, as follows:


    # underline line-through


    Ding dong, the blink is dead. With CSS3, the blink value has been officially removed
    as a text decoration, and the blink HTML tag is long gone. If you want to annoy
    your visitors with blinking text, you''ll have to use Adobe Flash.


    Text decorations are applied across an entire text element element by element
    basis. This means that a child element cannot override the text decoration set
    by its parent.


    Although a child element cannot override its parent''s decoration, child elements
    can have additional text decoration added to them. In the example, notice that
    the emphasis tag uses strikethrough, which is added to the underlining already
    supplied by the paragraph tag.


    Striking through text is useful for text that you want to show as deleted. For
    example, I''ve used strikethrough in online catalogs that include sale prices.
    I show the original price in strikethrough with the sale price next to it. That
    said, using the del tag is a better option because it completes deletion.


    Honestly, the only time I use text decoration to turn off hypert link underlining.
    Underlining is just too indiscriminate, placing a hard line under the text in
    the same color as the text. Some work is being done to provide more underline
    control to set the space, color, and style of the underline.


    # Underlining Links?


    Setting text-decoration: none; in the <a> tag overrides the underline in hyper-links,
    even if the visitor''s browser is to set underline links. In my experience, many
    visitors don''t like underlining for links—it clutters the page, and CSS offers
    many superior alternatives—I receive emails from visitors when I turn off underlining.


    One alternative to the text-decoration property is to use the border-bottom property
    with the link tag to provide faux underlining. This gives you much better control
    over the underline appearance, and it allows you to use different colors. For
    more information, see "Styling Navigation and Links" in Chapter 14.'
  merge: -1
  img_proc: true
- pgno: 198
  md: '# Coming Soon!


    Although only a few text properties are being added to CSS3, several are under
    development by the CSS Work Group:


    Text Outlining—text-outline will allow you to add a line around the character
    glyph and control the color and thickness of that line. Safari has already implemented
    a similar version of this as a Safari CSS extension called -webkit-text-stroke,
    and it''s possible that this might be the final form adopted for CSS3.


    Text Wrapping—Currently, in Web pages breaks only at spaces. No hyphenation or
    line-breaking properties exist. The text-wrap property will allow you to specify
    how text should wrap.


    Text Justification—Although text justification is possible by setting text-align:
    justify, you cannot specify how that justification is performed. This can result
    in awkward spacing in justified text. The text-justify property will include several
    options for spacing text, and text-align-last will let you specify the alignment
    of the last line of justified text.'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'Kerning—Remember that letter spacing is not kerning. The new punctuation-trim
    property will provide some rudimentary kerning capabilities.


    Hanging Punctuation—One common problem in typography is what to do when alphanumeric
    characters are not present at the beginning of a block of text, as with quotation
    marks. The hanging-punctuation property will allow you to define how these characters
    are treated, either placing them in the text block or outside the edge of the
    block.


    Text Line Decoration—As mentioned in my explanation of the text-decoration property,
    several new associated properties are being developed to style the text decoration,
    including text-line-color, text-line-style, text-line-skip, and text-underline-position.


    To follow the development of these styles, visit the CSS3 Text Module at www.w3.org/TR/css3-text.'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# Putting It All Together


    +   1. Add letter, word, and line spacing to your headers. Try out different effects,
    pushing the text together and moving apart.


    +   2. Add line spacing to your body copy. Specify the line height in paragraph
    elements. See how increasing and decreasing the space improves or reduces readability.
    At what point does increasing the line height reduce readability?


    +   3. Set the text case of your headline to uppercase. You can also play with
    the font size to make the headlines stand out.


    +   4. Add a text shadow to your headlines. Try to keep them subtle and not distracting.


    +   5. Fully justify your body copy. Use the Justify text alignment on the paragraph
    tag. Does this look better or worse than the ragged edges you get with left justification?


    +   6. Indent your text paragraphs. Play around with different amounts of indentation
    and see what you prefer.'
  merge: -1
  img_proc: true
