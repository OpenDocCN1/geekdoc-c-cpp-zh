- pgno: 185
  md: '# # Aligning Text Horizontally


    Traditionally, text is aligned at its left margin (left justified) or fully justified,
    which aligns the text at both the left and right margins (often called newspaper
    style). In addition, for emphasis or special effect, text can be centered on the
    screen or right justified. The **text-align property** (Table 6.6) gives you control
    of the text''s alignment and justification.


    Table 6.6 Text-Align Values

    | Value | Compatibility |

    |---|---|

    | left | IE3, FF1, S1, C1, O3.5, CSS1 |

    | right | IE3, FF1, S1, C1, O3.5, CSS1 |

    | center | IE3, FF1, S1, C1, O3.5, CSS1 |

    | justify | IE4, FF1, S1, C1 |

    | inherit | IE4, FF1, S1, O3.5, CSS1 |

    | auto | IE4, FF1, S1, O3.5, CSS1 |


    # ## To define text alignment:


    +   1. Add the text-align property to your CSS. **Type text-align in the CSS**
    declaration list, followed by a colon (:) (**Code 6.6**).


    ```

    text-align:

    ```


    +   2. Specify the horizontal alignment.


    center:


    Set one of the following alignment styles:


    +   * left to align the text on the left margin.


    +   * right to align the text on the right margin.


    +   * center to center the text within its area.


    +   * justify to align the text on both the left and right margins.


    +   * inherit makes the text take its parents'' alignment.


    +   * auto uses the default alignment, generally left.


    ![](img/9cd61ac1d4015ed5688d0c411434a660_185_0.png)


    > Code 6.7 applied to code 6.t: If it''s a bit zig-zaggy with left-, right, center-,
    and fully-justified, we''ll be changing the title and line formatting later in
    this book when I talk about positioning.'
  merge: -1
  img_proc: true
