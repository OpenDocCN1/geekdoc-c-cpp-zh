- pgno: 226
  md: '# TABLE 7.8 Background-Repeat Values


    | Value | Compatibility |

    |--- |--- |

    | repeat | IE4, FF1, S1, C1, O3, CSS1 |

    | repeat-x | IE4, FF1, S1, C1, O3, CSS1 |

    | repeat-y | IE4, FF1, S1, C1, O3, CSS1 |

    | no-repeat | IE4, FF1, S1, C1, O3, CSS1 |

    | space | FF3.6, CSS3 |

    | round | FF3.6, CSS3 |


    2. Add the background repeat property and specify how the background should be
    tiled (or not). Type background-repeat, followed by a colon (:):


    Then define how you want your background to repeat by typing one of the following
    options (Table 7.8):


    +   * repeat instructs the browser to tile the graphic throughout the background
    horizontally and vertically. This is the default value if the property is omitted.


    +   * repeat-x instructs the browser to tile the background graphic horizontally
    only, so that the graphic repeats in one straight horizontal line along the top
    of the element.


    +   * repeat-y instructs the browser to tile the background graphic vertically
    only, so the graphic repeats in one straight vertical line along the left side
    of the element.


    +   * no-repeat causes the background graphic to appear only once (and not tile).


    continues on next page'
  merge: -1
  img_proc: true
- pgno: 227
  md: '3. Add the background attachment property and specify how the background should
    scroll with the element. Type background-attachment, followed by a colon (:).


    background-attachment: fixed;\Then define how you want the background to be treated
    when the page scrolls by typing one of the following options (Table 7.9):


    +   * scroll instructs the background graphic to scroll with the element. This
    is the default value if the property is omitted.

    * fixed instructs the browser not to scroll the background content with the rest
    of the element. However, it will scroll with parent elements.

    * local is similar to fixed, but the background is fixed to the content of the
    element, rather than the element itself.


    4. Add the background position property and specify the positioning of the background.
    Type background-position, followed by a colon (:).


    background-position: -10px;

    Then type one value or two values separated by a space to indicate where you want
    the background to appear in relation to the top-left corner of the element. If
    one value is entered, it is used for x, and y is centered. Use one of the following
    (Table 7.10):


    # TABLE 7.9 Background-Attachment Values


    | Value | Compatibility |

    | --- | --- |

    | scroll | IE4, FF1, S1, C1, O3.5, CSS1 |

    | fixed | IE4, FF1, S1, C1, O3.5, CSS1 |

    | local | S2, C1, O10.5, CSS3 |


    # TABLE 7.10 Background-Position Values


    | | Compatibility |

    | --- | --- |

    | <length> | IE4, FF1, S1, C1, O3.5, CSS1 |

    | <percentage> | IE4, FF1, S1, C1, O3.5, CSS1 |

    | top | IE4, FF1, S1, C1, O3.5, CSS1 |

    | bottom | IE4, FF1, S1, C1, O3.5, CSS1 |

    | left | IE4, FF1, S1, C1, O3.5, CSS1 |

    | right | IE4, FF1, S1, C1, O3.5, CSS1 |

    | center | |'
