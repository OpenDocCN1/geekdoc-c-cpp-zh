- pgno: 148
  md: '# Font or Font Family?


    Keep in mind the difference between a font and a font family. A font family is
    a series of fonts with similar appearance—such as Times—where a font refers to
    a specific version—such as Times normal, Times bold, Times italic, and so on.


    +   3. Define a list of alternative fonts, called understand fonts, separated
    by commas. You can include as many as you want. These fonts will be used (in the
    order specified) if the previous font in the list is not available on the visitor''s
    computer. See "Why Include Understudy Fonts" in this chapter for more details.


    Arial1,


    # Why Include Understudy Fonts and Generic Font Families?


    +   4. Define the generic font family. After the last understudy font, type the
    name of the generic font family for the particular style of font you''re using.
    Table 5.1 lists generic values for families. Although including this value is
    optional, doing so is a good idea.


    When you provide a list of fonts, the browser tries to use the first font on list.
    If it isn''t available, the browser continues through the list until it finds
    a font that is installed on the visitor''s computer. If no match is found, the
    browser displays the text in the visitor''s default font. The advantage of using
    a generic font is that the browser tries to display the text in the same style
    of font, even if the specific fonts on the list are not available.


    Sans-serif;


    +   5. Add typeface overrides. After a font is set for the body of the page, it
    will be used in all text throughout the Web page, with the exception of text in
    forms. You will need to add font-family declaration to your CSS only if you want
    to change the font for a particular element. This is due to the fact that properties
    cascade to their child elements, described in chapter 4.


    As a last resort, you can include the generic font so that a browser can make
    an intelligent decision on the closest matching.


    The exception to the cascade rule are form elements such as input, text, area,
    button, etc., which require their fonts to be set in the form element to cascade
    down.


    The advantage of using understudy and generic font families is, even if a desired
    font is not available, you can still control which font is used in its place,
    or at least, get a match.


    ```

    font-family: Georgia, Times, ''Times New Roman'', Serif;

    ```


    +   TIP Try to choose fonts with a similar size. Different fonts will have relative
    sizes even if set to the same font size.


    +   TIP If you are using bold,italic, and/or bold-italic/oblique versions of the
    font, be sure that the font family supports all of these typefaces. If not, the
    text will not display properly or worse, the browser will try to synthesize these
    versions. Either way, the results will not look professional.


    Some typefaces are easy to read on a screen; others look better when printed.
    Always consider the destination when choosing your fonts.'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# Finding Fonts


    Look around the Web, and what do you see? You usually see five fonts: Arial, Georgia,
    Verdana, Trebuchet MS, and Times New Roman. This situation came about for one
    simple reason: Arial, Georgia, Verdana, Trebuchet MS, and Times New Roman are
    preinstalled on virtually every Mac and PC.


    I am sick of them.


    Don''t get me wrong—these are great fonts, easy to read at many sizes. But as
    I said earlier, typography adds a language to text that goes far beyond the written
    word.


    Web-based typography is mired in using Times for serif fonts and Helvetica/Arial
    for sans-serif fonts. This arrangement mutes the power of typography, and all
    Web pages begin to look the same.


    But there is new hope. Two factors are changing the way designers think about
    their typefaces. The first is dozens of fonts are commonly preinstalled on Macs
    and PCs. The second, and most profound change, is that all the major browsers
    now support the use of downloadable Webfonts.


    # Web-safe fonts


    What are the alternatives to the “fatal five?” That depends on the computer person
    visiting your site is using. Mac and Windows computers have certain standard fonts
    that should always be installed. In addition, Internet Explorer (which comes installed
    on most computers these days) installs several additional fonts.


    Of course, there''s no guarantee that these fonts will be installed, but because
    they came with the operating system and unless they have been removed, they are
    just as likely to be available as Times, Helvetica, or Arial.'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# # Websafe Fonts p3


    You can find a list of Web-safe fonts on my Web site, www.fluidwebtype.info/websafonts.
    It lists these fonts, and includes examples of what they should look like and
    similar-looking fonts can be used as replacements A.


    | Browser | OTF/TTF | EOT | SVG | WOFF |

    |---|---|---|---|--|

    | Internet Explorer | | IE4 | | Coming |

    | Firefox | FF3.5 | | FF3.6 | |

    | Safari | S3.1* | S3.1 | | |

    | Chrome | C4.0 | | C4.0 | Coming |

    | Opera | O10 | | O10 | Coming |


    +   - A list of Web-safe fonts on www.fluidwebtype.info includes a visual example
    of each typeface. You can sort the list by name, available weights and styles,
    operating system availability and rank.


    # # Downloadable Webfonts


    For years it has been technically feasible to download a font just as you would
    and use it in your design. However, the browser developers have only recently
    added this feature. The good news is that you can now download fonts (called Webfonts)
    to the vast majority of users. The bad news is that different browsers use different
    file formats (Table 5.3).


    Here is a list of the file formats:


    +   - TTF/OTF. TrueType and OpenType fonts are the type you are most likely to
    have on your computer. They are commonly used today and represent the majority
    of fonts sold. That said, they have no built-in security to prevent their unlicensed
    use.

    - EOT. Embedded OpenType is a format developed by Microsoft in the late 1990s
    to allow secure downloadable fonts for the Web. However, because the technology
    was proprietary for many years and EOT fonts were hard to create, the format didn''t
    catch on. Because it is the only format supported by IE and has been supported
    since IE4, it has gained new life for implanting Webfonts for IE.


    * Not available on Safari Mobile. SVG can be used.


    *continues on next page*


    Font Properties 127'
  merge: -1
  img_proc: true
