  md: "# Overflow fix\n\nThe second method for preventing an element from collapsing\
    \ is so simple that if it weren't so important, would hardly be worth mentioning:\
    \ To restore the element's height, just set its overflow. That's it. You can even\
    \ set the overflow to the default of auto, apparently reminding the element to\
    \ accommodate its children.\n\nCode 13.9 The overflow fix requires you to add\
    \ the overflow property to the parents' styles and everything is as it should\
    \ be.\n\n# To add the overflow fix:\n\n+   1. For any element that is collapsing,\
    \ add the overflow property. You can set the value to anything, including the\
    \ default value auto, to restore the parent to its proper height (Code 13.9):\n\
    \n+   2. Set your parent element with floating children. As long as the parent\
    \ element includes the overflow declaration, you are safe.\n\n```\n<DOCTYPE html>\n\
    <html lang=\"en-US\">\n<head>\n<meta charset=\"utf-8\">\n<title>Adventures in\
    \ Wonderland/</title>\n<style type=\"text/css\">\narticle {\npadding: 10px;\n\
    \  background-color: rgb(204,204,204);\nborder: 1px solid rgb(153,153,153);\n\
    width: 150px;\ndisplay: block;\noverflow: auto;\n}\n.object {\nfloat: left;\n\
    text-align: center;\nline-height: 50px;\ncolor: rgb(255,255,255);\nbackground-color:\
    \ rgb(255,255,0);\nborder: 1px solid rgb(153,0,0);\nmargin: 10px;\nwidth: 50px;\n\
    height: 50px;\n}\n</style>\n<!--[if it IE 8 ]]-->\n<script src=\"../script/HTML5for.js\"\
    \ type=\"text/javascript\"></script>\n<!--[endif]-->\n<body>\n<article>\n<div\
    \ class=\"object\">1</div>\n<div class=\"object\">2</div>\n<div class=\"object\"\
    >3</div>\n<div class=\"object\">4</div>\n<div class=\"object\">5</div>\n<div class=\"\
    object\">6</div>\n</article>\n</body>\n</html>\n```\n\n> > **TIP** You may notice\
    \ a little trick I used to center the numbers in the blocks horizontally (easy)\
    \ and also vertically. Horizontal is achieved by adding text align. Vertical is\
    \ done by setting the line-height to be the same as the height of the box. As\
    \ as only a single line of text is present, it will stay vertically centered in\
    \ the element.\n\noverflow: auto;\n\n<aside>...</aside>"
