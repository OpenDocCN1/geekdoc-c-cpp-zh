- pgno: 362
  md: '# What Should You Reset?


    As a designer, I recommend resetting many of the typographic and box styles and
    then setting your own defaults. In addition to not allowing the browser to set
    the direction, another good argument for resetting styles is that different browsers
    have slightly different values.


    +   - Padding, borders, and margins77—These are the main styles that designers
    like to reset, especially because they vary so much from browser.


    +   - Text underlining—Never use the text-decoration property to underline text.
    I have never seen a design in which underlining did anything other than add visual
    noise, even for links. Instead of using underline, applying border-bottom gives
    a similar effect with more precise control, allowing you to specify the thickness,
    color, and line style of the underline.


    +   - Line height—The default value for line height on text is 1 em, which means
    the text has little or no breathing room. All text can benefit by bumping this
    up to at least 1.4 em.


    +   - Outline—Outlines are applied by some browsers to highlight elements, such
    as form fields, when they come into focus. Although this is a good idea, the nature
    of this highlight should be up to you, not the browser.


    +   - Vertical alignment—Vertical alignment is tricky to deal with and rarely
    works the way you expect. The best procedure is to set the vertical alignment
    to the baseline and then use relative positioning to move elements up or down
    manually.


    +   - Other—These are the basics, but most CSS resets will go beyond this, cleaning
    up other perceived problems, generally with specific tag implementation.'
