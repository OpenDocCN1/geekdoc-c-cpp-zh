- pgno: 174
  md: '# Text Properties


    Text is everywhere and is used for every-thing from the ingredients in breakfast
    cereal to an ode to a Grecian urn. It is the best system that humans have devised
    for recording complex thoughts. Many people think of text as simply a way to record
    words, but typography adds a voice to the meaning of the words. Typography affects
    how text appears by controlling not only the shapes and sizes of the letters used
    (the font), but also the spaces between letters, words, lines, and paragraphs.


    Unfortunately, many of the challenges of typography on the Web have come about
    as a result of a need to circumvent the limitations of the medium. Web typography
    is to improve screen legibility, as well as to guide the viewer''s attention to
    important content. It is a difficult balancing act, but this chapter will prepare
    you with the right tools.


    # In This Chapter


    | Adjusting Text Spacing | 153 |

    | Setting Text Case | 158 |

    | NEW IN CSS3: Adding a Drop Shadow | 160 |

    | Aligning Text Horizontally | 162 |

    | Aligning Text Vertically | 164 |

    | Indenting Paragraphs | 167 |

    | Controlling White Space | 169 |

    | Decorating Text | 172 |

    | Coming Soon! | 175 |

    | Putting It All Together | 177 |'
