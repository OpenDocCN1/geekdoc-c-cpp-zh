    # Choosing Your Color Palette


    Graphic designers have a saying: "No color is better than bad color." If you are
    not careful, color can work against you by obscuring your memory and confusing
    your visitors. The effective use of color in design takes a lot of practice to
    get right.


    Colors have emotional meanings that cannot always be predicted, especially when
    used in different combinations.


    **Table 7.4** presents some of the most common color associations in Western culture.
    When you put two colors together, the meanings begin to intercalate, much like
    words in a sentence.


    You want to make sure you don''t just slap colors down on your page. If you do,
    they''ll probably clash. The most important thing you can do to avoid this is
    to take time to plan your color choices. Begin by choosing the specific colors
    you will use and their exact RGB or HSL values. Then apply these colors consistently
    throughout your project.'
