  md: '# TABLE 7.11 Background-Size Values


    | Value | Compatibility |

    |---|---|

    | <length> | FF3.6, S3/S5, C5, O9,5, CSS3 |

    | <percentage> | FF3.6, S3/S5, O9,5, CSS3 |

    | cover | FF3.6, S4/S5, C3, CSS3 |

    | contain | FF3.6, S4/S5, C3, CSS3 |


    Firefox supports -moz-clip-origin

    Safari 4 and Chrome 3 support -webkit-clip-origin

    Safari 5 supports background-size


    +   - Percentage values, such as 25%. The first percentage indicates the horizontal
    position proportional to the parent element''s size; the second value indicates
    the vertical position proportional to the parent element''s size.


    +   - Keywords in plain English: top, bottom, left, right, or center.


    +   5. Add the background size property and specify the exact size, percentage,
    or sizing method. Type background-size, followed by a colon (:):


    +   -background-size: contain;

    -moz-background-size: contain;

    -webkit-background-size: contain;

    -background-size: contain;


    Then type a value from Table 7.11. Two values can be included to define separate
    x and y sizes:


    +   - Length values, such as 10px.


    +   - Percentage values, such as 25%. The first percentage indicates the width
    proportionate to the parent element''s width; the second value indicates the height
    proportional to the parent element''s height.


    +   - cover fits the image to the width or height of the containing element while
    preserving the aspect ratio.


    +   - contain scales the image to the smallest size to fit the entire image in
    the desired area while preserving the aspect ratio.


    continues on next page'
  merge: -1
  img_proc: true
- pgno: 229
  md: '6. Add the background clip property and specify a clipping method. Type background-clip,
    followed by a colon (:):


    +   - o-background-clip: padding-box;

    - moz-background-clip: padding;

    - -webkit-background-clip:

    - padding-box;

    - background-size: padding-box;


    Then type a value from Table 7.12. Two values can be included to define separate
    x and y sizes.


    Mozilla and Webkit use a slightly different syntax than what was finally implemented
    in the CSS3 standards.


    +   ▶ border/border-box clips the image to the outer edge of the border.


    +   ▶ padding/padding-box clips the image to the outer edge of the padding.


    +   ▶ content/content-box clips the image to the outer edge of the content.


    # TABLE 7.12 Background-Clip Values


    | Value | Compatibility |

    |---|---|n| padding | FF1, S3, C3 |

    | border | FF1, S3, C3 |

    | content | S3, C3 |

    | padding-box | S3/S5, C3, O10.5, CSS3 |

    | border-box | S3/S5, C3, O10.5, CSS3 |


    Firefox supports -moz-clip-origin

    Safari 4 and Chrome 3 support -webkit-clip-origin

    Safari 5 supports background-clip'
  merge: -1
  img_proc: true
