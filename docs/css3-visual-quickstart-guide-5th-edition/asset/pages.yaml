    you to specify which children elements should be set flat against the parent element
    or transformed separately in their own 3D spaces (Table 12.4).


    +   2. Add the perspective style property to your CSS declarations and specify
    the perspective value.

    -webkit-perspective: 500;

    perspective: 500;

    Perspective works like the transform() value described in this chapter but is
    used to apply a perspective to an element children (Table 12.5).


    Code 12.3 transformation-properties.css—When applied to Code 12.1, it replaces
