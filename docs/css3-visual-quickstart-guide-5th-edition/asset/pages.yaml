    present a lot of links in a little space. Although generally thought of as the
    domain of JavaScript, drop-down menus can also be achieved using only a little
    bit of CSS.


    To make a pure CSS drop-down menu:


    +   1. Create an external CSS file called menu.css (Code 14.5), this collapses
    the menu, leaving only a CSS needed to style the menu in Code 14.1.


