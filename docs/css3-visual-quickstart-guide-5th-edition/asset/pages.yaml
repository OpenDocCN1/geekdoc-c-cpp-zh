  md: '# Box Properties


    In the physical world, atoms are the building blocks of all larger objects. Every
    type of atom, or element, has unique properties, but when bonded with other atoms,
    they create molecules—larger structures with properties different from the parts.


    Likewise, HTML tags are the building blocks of your Web page. Each tag, or element,
    has its own capabilities. Tags can be combined to create a Web page that is greater
    than the sum of its parts. Whether a tag is itself or nested within other tags,
    it can be treated as a discrete element on the screen and controlled by CSS.


    Web users use the concept of the box as a metaphor to describe the various things
    you can do to an HTML element, whether it is a single tag or several nested tags.
    A box can have several properties—including margins, borders, padding, width,
    and height—that can be influenced by CSS.


    This chapter shows you how to control the box and its properties.


    # In This Chapter


    +   Understanding an Element''s Box 245


    +   Displaying an Element 248


    +   Setting the Width and Height of an Element 251


    +   Controlling Overflowing Content 254


    +   Setting an Element''s Margins 257


