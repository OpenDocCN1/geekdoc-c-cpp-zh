- pgno: 204
  md: '# Choosing Color Values


    The saying, "There is more than one way to skin a cat," Is grotesque, but it is
    also applicable to most creative decisions, such as color values in Web designs.
    You can use several traditional methods to define the same Web page color, and
    CSS3 even introduces a few new ways.


    # Color keywords


    Although most designers have little use for predefined colors, you have access
    to many predefined color values derived from lists defined in the HTML4 and SVG
    specifications. Table 7.1 shows the list of keywords along with the equivalent
    hex and decimal values. Values in boldface indicate inclusion from HTML


    | TABLE 7.1 Color Values |

    | Name | Form | Example | Compatibility |

    | :--- | :--- | :--- | :--- |

    | Keyword | <keyword> | coral | IE4, FF1, S1, C1, O3.5, CSS1 |

    | Transparent | transparent | - | IE4, FF1, S1, C1, O3.5, CSS1 |

    | Current color | currentColor | - | FF3.6, S2, C2, O10, CSS3 |

    | RGB hex | #rrr,ggg,bbb | #ff71f5, #f190 | IE4, FF1, S1, C1, O3.5, CSS1 |

    | RGB decimal | rgb(rrr,ggg,bbb) | 255,127,80 | IE4, FF1, S1, C1, O3.5, CSS1 |

    | RGB percentage | rgb(rrr%%,ggg%%,bbb%%) | rgb(100%,50%,31%) | IE4, FF1, S1,
    C1, O3.5, CSS1 |

    | HSL | hsl(hhh,sss,lll%) | hsl(16,65,100%) | FF3.6, S2, C2, O9, CSS3 |

    | RGBA | rgba(rrr,ggg,bbb,d) | rgba(255,127,80,86) | FF3.6, S3, C3, O9.5, CSS3
    |

    | HSLA | hsla(hhh,sss,lll%,d) | hsl(16,65,100%,23) | FF3.6, S3, C3, O9.5, CSS3
    |'
  merge: -1
  img_proc: true
- pgno: 205
  md: '# Currentcolor keyword


    In addition to the color keyword list, you can use the currentcolor keyword. Using
    currentcolor to set any color value will use the element''s current color value.
    For example, to create an aqua border color:


    color: aqua;

    border-color: currentcolor;


    If you assign currentcolor specifically to the color property, it will inherit
    its parent element''s color value just like using color: inherit.


    # Transparent keyword


    Another important keyword is transparent, which is the equivalent of a 0 alpha,
    that is, it''s completely transparent. This keyword allows anything behind deat
    element to show through.


    # RGB hex values


    Hexadecimal values can range from 0–9 and a–f Values of hexadecimal values representing
    the levels of red, green, and blue (in that order) in the desired color. The color
    value couples range from 00 (no color) to FF (full color). However, if the couples
    contain the same hex value, only three values are needed to define the color.
    For example, these two sets of values represent the same pure blue:


    ```

    #000ff

    #00f

    ```


    # RGB decimal values


    Often, simply referred to as the RGB values, RGB uses decimal values from 0 (no
    color) to 255 (full color) to represent the levels of red, green, and blue (in
    that order) present in the desired color.


    ![](img/9cd61ac1d4015ed5688d0c411434a660_205_0.png)


    > RGB hex values are represented by three couple values, or by three single values
    ranging from 0–9 or A–F that indicate the levels of red, green, and blue that
    combine to create the color.


    > RGB decimal color values range from 0–255 to indicate the levels of red, green,
    and blue that combine to create the color.'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# RGB(100%, 100%, 100%)


    RGB can be expressed as whole percentages from 0% (no color) to 100% (full color)
    to represent the levels of red, green, and blue (in that order) present in the
    desired color


    RGB percentage color values range from 0–100 indicate the amount of red, green,
    and blue that is combined to create the color.


    # Percentage values


    ![](img/9cd61ac1d4015ed5688d0c411434a660_206_0.png)


    # New in CSS3: HSL values


    Although their notations are different, decimal, and percentage values are just
    different ways to define the levels of red, green, and blue in a color. CSS3 adds
    a completely different method for defining color by its hue, saturation, and lightness


    HSL color values represent hue as the angle on a standard color wheel (0–360),
    saturation as a percentage, and lightness as a percentage.


    # rgba(255,255,255,.5)


    +   - A degree value from 0 to 360, although the degree symbol is not included.
    The position is based on a color''s position in the standard color wheel where
    red is typically at 0°, green at 120°, cyan at 180°, blue at 240°, and magenta
    at 300.


    # hsla(0,0,100,.5)


    +   - Saturation—A percentage from 0% (no color) to 100% (full color).

    - Lightness—A percentage from 0% (black) to 100% (white).


    RGBA and HSLA add an alpha value as a decimal (0–1) to represent the opacity of
    a color with 0 completely transparent and 1 completely opaque.


    # New in CSS3: Color alpha values


    Although the opacity property allows you to make elements transparent, this is
    applied to the entire element. CSS3 now allows you to make colors transparent.
    An alpha value is generally a fourth value in a color, but rather than representing
    a hue or brightness, it sets the opacity of the color—a value from 0 (transparent)
    to 1 (opaque). So, an alpha of .5 is the equivalent of 50% opacity'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'You can set an alpha channel for either RGB decimal or HSL color values. Currently,
    you have no way to add alpha values to RGB hex values. The channel value is then
    applied only to the color used.


    # Other Ways to Add Color


    Although this chapter presents the primary methods for setting colors in your
    design, several other CSS properties include color values:


    +   - border—Element''s border can be set as any of the border properties or directly
    in the border-color property (see Chapter 10).


    +   - outline—Like the border property, outline allows you to define a color around
    the edge of an element (see Chapter 10).


    TIP If you specify a gradient as a back-ground, also specify a background color
    to ensure that text will be legible in browsers that do not support gradients.


    TIP Hex values are currently the most popular way to define color values, but
    they are no means the best way to add colors. I find it much easier to imagine
    colors using decimal values than base 16 hexadecimal values.


    TIP In addition to setting the color opacity, CSS includes the ability to set
    the opacity of an entire object and any of its content. "Setting an Opacity" in
    Chapter 11 for more information.


    TIP Although HSL is a bit difficult to master at first, it can be easier to use
    when setting complementary colors. Just add 180° to the hue.


    # Hex or Decimal?


    Until recently, it was assumed that colors should always be declared in RGB hexadecimal
    notation. In fact, I still meet designers and developers who are completely unaware
    that they have alternatives. RGB decimal has been around for quite while and will
    work in any browser you want to throw it out.


    But which is "better"?


    I personally find that it is much easier to a color in decimal numbers (which
    I''ve used all my life) than in hex values. I can look at the value 135, 127,
    107 and know it''s a reddish beige much faster than I see 877f6b. Additionally,
    since there is no alpha version for hex, if you want transparency colors, you
    have to use decimal values.


    The only argument in favor of hex values is that they are more compact (a smaller
    file size) than decimal values. But even over a large-scale Web site, you might
    save only a few bytes (millions of seconds in load time).'
  merge: -1
  img_proc: true
