- pgno: 55
  md: '# Putting It All Together


    +   1. Create a new HTML file. I recommend using TextEdit on Mac or SimpleText
    on Windows. I do not recommend Microsoft Word because it can add invisible code
    that creates problems.


    +   2. Add a doctype. For our purposes, the HTML5 doctype is the one to use.


    +   3. Add the `<html>...` tag. Optionally, you can also add the language and
    direction properties.


    +   4. Add the `<head>...</head>` tag. The head is where all of the information
    about the page goes.


    +   5. Add the `<title>...</title>` tag. This is where you want to place the title
    of your Web page that will appear in the Windows title bar.


    +   6. Place any `<meta>` tags you need into the head. Meta tags provide the information
    about the page, such as author, language, and copyright.


    +   7. Add a link to the IE JavaScript HTML shiv. You will need to create that
    as an external file and link it to here. If you need the code, grab it from www.speaking-in-styles.com/ie5shiv.


    +   8. Add the `<body>...</body>` tag. The body is where everything that appears
    in the Web page will be placed. In later chapters you will also learn to add a
    class and/or ID to this tag to help differentiate it from other pages in the site.


    +   9. Save this as index.html. You now have an empty HTML5 Web document, ready
    for your CSS3.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# 3


    # CSS Basics


    CSS lets you control all the elements of your document''s appearance—fonts, text,
    colors, backgrounds, sizes, borders, spacing, positioning, visual effects, tables,
    and lists. However, the real power of using CSS for styles is that you can change
    the appearance of every page on your Web site by changing only a few lines of
    CSS code.


    With savvy use of CSS, you can start with a plain page of text, and by adding
    visual design and interaction, turn it into a webbed environment.


    # In This Chapter


    +   * The Basic CSS Selectors 34

    * Inline: Adding Styles to an HTML Tag 35

    * Embedded: Adding Styles to a Web Page 38

    * External: Adding Styles to a Web Site 41

    * (Re)Defining HTML Tags 48

    * Defining Reusable Classes 51

    * Defining Unique IDs 55

    * Defining Universal Styles 59

    * Grouping: Defining Elements Using the Same Styles 62

    * Adding Comments to CSS 66

    * Putting It All Together 68'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# The Basic CSS Selectors


    CSS works by defining the styles of the elements on a Web page using CSS rules.
    Rules are applied using selectors, which come in three basic varieties: HTML selectors
    are used to reference a specific tag; class selectors, which are applied individually
    to elements; or an ID selector that is applied to a single element on the page
    (Table 3.1). You will use these three basic selectors constantly, and they are
    the best place to start. In Chapter 4, you will learn about using other selectors
    for creating more selective styling.


    TABLE 3.1 Basic Selectors What Elements Are Styled Compatibility


    | Format | Selector Name | What Elements Are Styled | Compatibility |

    | --- | --- | --- | --- |

    | a | HTML | All specified HTML tags | IE4, FF1, S1, C1, O3.5, CSS1 |

    | .myClass | Class | Any HTML tag where class is applied | IE4, FF1, S1, C1, O3.5,
    CSS1 |

    | a.myClass | Dependent Class | Specified HTML tag where class is applied | IE4,
    FF1, S1, C1, O3.5, CSS1 |

    | #myID | ID | Any HTML tag where ID is applied | IE4, FF1, S1, C1, O3.5, CSS1
    |

    | a#myID | Dependent ID | Specified HTML tag where ID is applied | IE4, FF1, S1,
    C1, O3.5, CSS1 |

    | * | Universal | All HTML tags | IE7, FF1, S1, C1, O3.5, CSS2 |'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# Inline: Adding Styles to an HTML Tag


    ```

    <h1 style="color:red;\>...</h1>

    ```


    Although using CSS means you do not have to set the appearance of each tag individually,
    you still have the freedom to set a style within an individual tag, which is referred
    to as an inline style.


    This is useful when you''ve set styles for the page in the head or in an external
    style sheet, and you need to override those styles on a case-by-case basis. However,
    you should only do this as a last resort. Because inline styles have the highest
    priority in the cascade order, they are virtually impossible to override.


    # To set the style properties of individual HTML tags:


    +   1. Add the style property to the HTML tag. Type style= in the HTML tag to
    which you want to apply styles (Code 3.1)


    +   2. Add your CSS declarations in a comma-separated list. In quotes, type your
    style declarations in the format property: value, using a semicolon (;) and separating
    individual declarations. Be sure to close the declaration list with quotation
    marks.


    ```

    font:italic small-caps

    - 3em/.9 Constantia, Georgia,

    - Times, ''Times New Roman'',

    - Serif; color:red

    ```


    +   3. Finish your HTML tag and add content. After closing the tag, add the content
    to be styled. Then close the tag pair with the corresponding end tag.


    ```

    >Alice&#8217;s Adventures In

    -Wonderland</h1>

    ```'
  merge: -1
