- pgno: 39
  md: '# # What Is HTML?


    The HyperText Markup Language is simply a system of tags that define elements
    on the page, which create the structure of a document for use on the Web. For
    example, you take a block of text and add HTML tags, as follows:


    ```

    <h1>Alice In Wonderland</h1>

    ```


    Here, you''ve used the `<h1>` tag to create the most important header for the
    page: the level 1 header. Different tags are used to tag different kinds of elements,
    and tags can be placed within other tags. For example:


    ```

    <p>I wonder if I shall fall right <em>through the earth</em></p>

    ```


    These tags tell the browser that the text is a paragraph, and the word “through”
    should be presented with emphasis, probably by displaying it in italics.


    # Alice in Wonderland


    I wonder if I shall fall right through the earth!


    +   A Plain text without any markup.


    ![](img/9cd61ac1d4015ed5688d0c411434a660_39_0.png)


    +   B The same text content with HTML tags applied.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# What Is a Markup Language?


    HTML is used to mark up the structure of Web pages, but other markup languages
    are used by computers on the Web and beyond.


    The Standard Generalized Markup Language (SGML) is the grandfather of most markup
    languages used for print and the Internet. SGML is the international standard
    used to define the structures and appearance of documents. Multiple SGMLs have
    been created for a variety of document types and for various specialties—such
    as physics, accounting, and chemistry. HTML and XHTML are the Web''s primary version
    of SGML.


    # Basic HTML Document Structure


    All HTML documents have similar basic structure, which include the following elements:


    +   - <!DOCTYPE> sets the type of markup language the document is using (Table
    2.4). This is important to include so that the browser can quickly and accurately
    interpret the HTML code.


    +   - <head> includes information about the page, such as the title and meta tags.
    You should also place links to external CSS and JavaScript files in this area.
    The head should not be confused with a page header. Nothing in the head of the
    page will be directly displayed in the page.


    +   - <body> contains the elements you actually see in the Web browser window,
    navigation, headers, paragraphs, list, table, images, and more.


    # HTML Properties


    HTML elements can be modified by placing HTML properties within the tag. Some
    properties are optional, some improve the performance of the element, and some
    are needed for an element to work properly. For example, the anchor tag <a> uses
    the href property to define where a link is pointing:


    ```

    <a href="http://www.jsonspeaking.com">

    Jason

    </a>

    ```'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'Properties are also used to connect an HTML element to styles using the style,
    class, or id properties:


    ```

    <p style="color: red;">Alice</p>

    <p class="highlight char names">Alice</p>

    <p id="name01">Alice</p>

    ```


    Every tag has one or more properties that can be applied to them. These become
    especially important when we start using CSS to tags based on property values,
    as explained in Chapter 4.


    # HTML and CSS


    Most HTML tags have browser inherited styles associated with them. These default
    styles are actually defined by the Web browser developer. Because the browser
    developer has added them, you need to remember that they are and will affect your
    design. For example, the `<em>` tag will italicize text on most browsers. No cosmic
    constant dictates that emphasized text is italicized; it''s just the guys and
    gals programming the browser software decided to do it that way. The good news
    is that you can use CSS to override the browser styles.


    For the most part, default styles are consistent from browser to browser, although
    some noticeable differences exist, especially with margins and font size. Many
    designers will start "from scratch" by resetting many of the defaults as using
    a CSS reset (see Chapter 14).


    # What Is SVG?


    The Scalable Vector Graphics (SVG) format is a method for creating graphics on
    the Web (see w3.org/Graphics/SVG/). Like Flash, instead of plotting each point
    in a graph, SVG data describes two points between them as a straight line or curve.


    Although it still lags behind Flash in browser penetration, SVG is natively supported
    in Firefox, Safari, and Chrome. The hold is Microsoft''s Internet Explorer, which
    will not have SVG support until version 9. (Adobe provides an IE plug-in at www.adobe.com/svg).


    Unlike Flash, which uses an editor to create files and hides much of its graphics
    code, SVG is a mark-up language that can be freely read.'
  merge: -1
  img_proc: true
