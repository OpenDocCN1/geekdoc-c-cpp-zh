- pgno: 16
  md: '# Introduction


    These days, everyone is a Web designer. Whether you are adding a comment to a
    Facebook page, creating your own blog, or building a Fortune 50 Web site, you
    are involved in Web design.


    As the Web expands, everyone from PTA presidents to presidents of multinational
    corporations is using this medium to get messages out to the world because the
    Web is the most effective way to communicate your message to the people around
    and around the world.


    Knowing how to design for the Web isn''t always designing complete Web sites.
    Many people are creating Web pages for auction sites, their own photo albums,
    or their blogs. So, if you are planning to redesign your Web site or your kid''s
    graduation pictures online, learning Cascading Style Sheets (CSS) is your next
    step into the larger world of Web design.


    # What Is This Book About?


    HTML is how Web pages are structured. This book deals primarily with how to use
    CSS to add a visual layer to the HTML structure of your Web pages.


    CSS is a style language; that is, it is not a programming language. Instead, it''s
    code that tells a device (usually a Web browser) how the content in a file should
    be displayed. CSS is meant to be understood by anyone, not just "computer people."
    Its syntax is straightforward, consisting of rules that tell an element on the
    screen how it should appear.


    This book also includes the most recent additions to the CSS language, commonly
    referred to as CSS3 (or CSS Level 3). CSS3 builds on and extends the previous
    version of CSS. For the time being, it''s important to understand what is new
    in CSS3 because some browsers (most notably Internet Explorer) have incomplete
    support or no support for these new features.'
