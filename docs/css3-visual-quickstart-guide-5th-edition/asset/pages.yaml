  md: "# 4.10 If the element is a paragraph that does not use the dialog class, it\
    \ will be displayed in red and italics\n\n# NEW IN CSS3: Not styling an element\n\
    \nSo far you've looked at how to style a tag\nif it is something. The negative\
    \ selector,\nnot, allows you to not style something for\np particular selector.\n\
    \n```\n```html\n<!-- HTML5 -->\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n\
    \  <meta http-equiv=\"Content-Type\"\n    content=\"text/html; charset=UTF-8\"\
    \ />\n  <title>Alice's Adventures in Wonderland</title>\n  <style type=\"text/css\"\
    \ media=\"all\">\n    p:not(:dialog) {\n      color: red;\n      font-style: italic;\n\
    \    }\n  </style>\n</head>\n<body>\n  <p class=\"dialog\">\"Why?\" said the\n\
    - Caterpillar.</p>\n  <p>Here was another puzzling question...</p>\n  <p class=\"\
    dialog\">\"Come back!\" the\n- Caterpillar,...</p>\n</body>\n</html>\n```\n```\n\
    \n# To not set a style for a particular element:\n\n+   1. Style elements to exclude\
    \ certain selectors. Type the selector (HTML, class, or ID) of the element you\
    \ want to style, a colon (:), not, and enter the selectors you excluded from this\
    \ rule in parentheses (Code 4.10).\n\n```\n```css\npnot(.dialog) {...```\n```\n\
    \n+   2. The element is not styled if it contains the indicated selector.\n\n\
    <p class='dialog'>...</</p>\n\n<p>...</</p>\n\nThe styles are applied to elements\
