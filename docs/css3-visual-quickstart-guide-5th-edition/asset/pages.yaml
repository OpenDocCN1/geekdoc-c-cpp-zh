    width: 100%; }

    ```


    ![](img/9cd61ac1d4015ed5688d0c411434a660_277_1.png)


    Code 10.4 applied to Code 101: The area''s height is restricted to 400px, but
    more content exists than fit in that area, as a vertical scrollbar is added automatically.'
