- pgno: 211
  md: '# Mozilla gradients


    In Firefox or other browsers use -moz extensions, you can use the -moz-linear-gradient
    or -moz-repeating-linear-gradient property to create a straight gradient or use
    -moz-radial-gradient or -moz-repeating-radial-gradient to create circular gradients.
    The repeating gradients just will tile based on their size.


    -moz gradient extensions use the following values:


    +   * Point-One or two keyword values separated by a space defining the side or
    corner where the gradient should start. Values can include top, right, bottom,
    and/or left. If two values are used (separated by a space), specify a corner,
    such as top left.


    +   * Position-A background position, which is the same as setting background
    images shown later in this chapter (Table 7.10) for the center point of a radial
    gradient, such as center.


    +   * Angle-The angle of the gradient in degrees (deg), grads (grad), or radians
    (rad), such as 45deg.


    +   * Shape-Shape of a radial gradient, either circle or ellipse.


    ![](img/9cd61ac1d4015ed5688d0c411434a660_211_0.png)


    ![](img/9cd61ac1d4015ed5688d0c411434a660_211_1.png)


    Mozilla adds several options, allowing simple and complex gradients to be created.


    ![](img/9cd61ac1d4015ed5688d0c411434a660_211_2.png)


    ![](img/9cd61ac1d4015ed5688d0c411434a660_211_3.png)


    Mozilla radial gradients allow you to set the size, angle, and shape.'
  merge: -1
  img_proc: true
- pgno: 212
  md: '# TABLE 7.3 -moz-gradient Size Values


    | Value | Description |

    | --- | --- |

    | closest-side | Gradient shaped to meet closest side from its center |

    | closest-corner | Gradient shaped to meet closest corner from its center |

    | farthest-side | Gradient shaped to meet farthest side from its center |

    | farthest-corner | Gradient shaped to meet farthest corner from its center |

    | contain | Same as farthest-side |


    +   - Size—The size of a radial gradient as a keyword (Table 7.3).

    - Stop—The color at a particular point along the gradient. This must include a
    color value (Table 7.1) and an optional percentage or length value to set where
    the color should be positioned along the gradient axis, such as orange 60%.


    # Webkit gradients


    Safari, Chrome, and any other browsers that make use of the -webkit-gradient extensions
    use the -webkit-gradient-property property to add gradients. This property has
    several options, depending on whether you want to create a linear or radial gradient:


    +   - Type—linear or radial

    - Start—One or two length or keyword values separated by a space to define the
    location, side, or corner where the linear gradient should start. Values can include
    top, right, bottom, and/or left. If two values are used (separated by a space),
    they specify a corner, as top left.

    - End—One or two length or keyword values separated by a space to define the location,
    side, or corner where the linear gradient should end. Values can include top,
    right, bottom, and/or left. If two values are used (separated by a space), they
    specify a corner, as bottom right.

    - Radius—A length value used to set the radius of a radial gradient. Associated
    with a start and end point, the radius of the inner and outer circles of the radial
    gradient are set with corresponding start and end points, such as 25 25, 100,
    25 25,0 (where 100 and 0 are the radii).


    ```

    -webkit-gradient(

    linear,

    left top,

    from(rgba(0,0,0,0)),

    to(rgba(255,0,0,.5));

    ```


    > Webkit linear gradients can be simple.


    ```

    -webkit-gradient(

    radial,

    100, 25 25,0——points and radius

    from(rgba(0,0,0,0)),

    to(rgba(255,0,0,.5)),

    color-stop(60%, rgba(255,0,0,.25));

    ```


    > Webkit radial gradients get more complex, requiring you to plot several points
    and radii.


    ![](img/9cd61ac1d4015ed5688d0c411434a660_212_0.png)


    ![](img/9cd61ac1d4015ed5688d0c411434a660_212_1.png)'
  merge: -1
  img_proc: true
- pgno: 213
  md: '+   - From—The value of the initial color in the gradient (7.1). Same as color-stop(0.0,
    <color>). For example, fromrgb(255,255,255).


    +   - To—The value of the final color in the gradient (7.1). Same as color-stop(1.0,
    <color>). For example, torgb(0,0,0).


    +   - Stop—A length, percentage (0–100%), or decimal value (0–1.0) to indicate
    where the color should be positioned along the gradient, followed by the comma
    (,), and then the value of a particular point along the gradient (7.1). For example,
    color-stop(60%, orange).


    Gradients can be defined using the from() and to() values, color-stops (), or
    any combination of these values separated by commas.


    > Work has begun on an official W3C CSS gradient standard as a part of the new
    Image Module (dev.w3.org/csswg/css3-images). The bad news is that the syntax being
    developed does not resemble either the -moz or -webkit versions. The good news
    is that it looks much simpler.


    > Gradients can be a headache to compute, especially radial gradients. I recommend
    using a handy online tool developed by John Allaisoft that computes the code for
    you; browse to westciv.com/tools/gradients


    ![](img/9cd61ac1d4015ed5688d0c411434a660_213_0.png)


    A great tool for plotting gradients can be found at westciv.com/tools/gradients.'
