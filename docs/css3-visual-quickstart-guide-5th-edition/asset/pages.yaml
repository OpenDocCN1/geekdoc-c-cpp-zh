- pgno: 358
  md: '# Resetting CSS


    In Chapter 2, you learned about browser default styles. Recall that the browser
    developers set the default styles applied by HTML tags. Far too many Web sites
    are designed by default. The designers and developers allow the browser manufacturer
    to have the final word on how the content is displayed. Additionally, all browser
    default styles are not the same from browser to browser. CSS resets were developed
    to level the playing field and help prevent "vanilla" designs.


    The exact CSS reset you choose will depend on your design needs. I like to keep
    your reset simple, adding styles to specific tags only as inconsistent or (in
    my opinion) poorly set in most browsers.


    Redefining important CSS properties (generally to none or 0) provides a few benefits:


    +   - Reduces bad styles. Undoes of the questionable and downright styles added
    by browser manufacturers, and eliminates the styles that simply do not work. One
    example is using an outline to highlight items that are in focus, such as form
    fields. Although highlighting is useful for keyboard navigation, you should design
    yourself.


    +   - Eliminates design by default. Sets a level playing field from which to begin
    a design. Rather than allowing the browser manufacturers to dictate your page
    appearance, you take control.


