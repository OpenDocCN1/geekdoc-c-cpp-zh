    \ because it uses less space, but it requires that you remember the purpose of\
    \ each of the values in the list.\n\n```\nCode 7.5 color-background-properties.css—nAlthough\
    \ the results will be identical to Code 7.4, this version is much more compact,\
    \ easier to scan, and cuts down on file size. If you want to see what the page\
    \ looks like, look at the previous section.\n```\n\n```\n*** CSS 3 V5 | Chapter\
    \ 7 | color-background-\nproperties.css ***\n```\n\n```\nbody {\n  color: rgb(51,51,51);\n\
    \  background: rgb(85,85,85) url(../images/\n    dark-victorian.jpg) repeat fixed\
    \ 0 0;\n}\n```\n\n# To define the background:\n\n+   1. Add the background property\
    \ to your CSS rule declarations list. Start your declaration by typing background,\
    \ followed by a colon (:): Then define a background value (Code 7.5).\n\n```\n\
    header.page {\n  display: block;\n  background: url(../images/bg-spine-\n    title.png)\
    \ no-repeat center top,\n  rgb(102,0,0) url(../images/bg-spine.jpg)\n    repeat-x\
    \ o 0;\n}\n```\n\nbackground:\n\n```\nh1 {\n  color: rgb(255,225,215);\n  color:\
    \ rgba(255,225,225,.65);\n}\n```\n\n```\narticle {\n  display: block;\n  background:\
