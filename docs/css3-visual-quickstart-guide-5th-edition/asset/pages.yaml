- pgno: 269
  md: '# Parts of the box


    All HTML elements have four sides: top, right, bottom, and left A. These four
    sides make the element''s box, to which CSS properties can be applied. Each side
    of the box has the following properties:


    +   - Content—At the center of the box, this is the substance of the page. The
    content includes all text (copy), lists, forms, and images you use.


    +   - Child Elements—Elements contained within the parent element are set off
    by their own HTML tags. Children typically have their own box that can be controlled
    independent of the parent.


    +   - Width and Height—The dimensions of the content area. If you leave width
    and height undefined, these dimensions are determined by the browser (see "Setting
    the Width and Height of an Element" in this chapter).


    +   - Padding—The space between the border and the content of the element (see
    "Setting an Element''s Padding" in this chapter). Background colors and images
    also fill this space. If unset, the size of the padding is generally 0.


    +   - Background—Space behind the content and padding of the element. This can
    be a solid color, one or more background images, or a background gradient. (See
    Chapter 7 for more information about backgrounds.)


    +   - Border—A rule (line) that surrounds the element and can be set separately
    on any of the sides. The border is invisible unless you set its color, width,
    and style—solid, dotted, dashed, and so on. You can also set a background image.
    If unset, the border size is generally 0.


    ![](img/9cd61ac1d4015ed5688d0c411434a660_269_0.png)


    > The box model in all its glory. Notice that the outline is part of the margin.
    If a margin is not present, the outline will appear underneath adjacent elements.
    Also, if two elements are stacked on each other, the margins are not added, but
    collapse to the largest of the two.'
  merge: -1
  img_proc: true
- pgno: 270
  md: '+   - Outline—Similar to border, but does not occupy any space. It appears
    underneath the margin and any surrounding sibling elements in the background.


    +   - Margin—The space between the element and other elements in the window (see
    "Setting an Element''s Margins" in this chapter). If left unset, the browser defines
    the margin.


    It is important to remember that the content width and content height do not set
    the width and height of the space that the element occupies on the page. The overall
    width includes any padding and border on a side:


    ```

    element width = content width + left padding + left border width + right border
    width

    ```


    Height is a little different. If a content height is set, but overflow is not,
    then the height will stretch to accommodate the content plus any padding and borders:


    ```

    element height = height needed to display content + top padding + top border width
    + bottom padding + bottom border width

    ```


    If overflow is set to hidden, scroll, or auto, then height is computed:


    ```

    element height = content height + top padding + top border width + bottom padding
    + bottom border width

    ```


    Any content that does not fit within the element will either be hidden or scrollable.


    > Although the situation has been fixed with recent versions, Internet Explorer
    has a well-known and frustrating problem in the way it treats the box model. This
    problem exists in version 6 and partially persists in version 7. The problem is
    detailed in Chapter 13, "Fixing the Internet Explorer Box Model."'
  merge: -1
  img_proc: true
