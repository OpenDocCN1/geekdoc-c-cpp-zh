  md: '# Managing Style Sheets


    It''s not enough to write CSS that makes your pages look pretty. To create the
    best Web pages, you must also write clean code that''s easy to read, easy to maintain,
    and loads quickly.


    To manage your style sheets you need to know how to create well-organized code,
    work with CSS libraries and Frameworks, optimize the linking of style sheets,
    validate your CSS, and compress the code by minifying it.


    This chapter will help you realize all goals and finish with a review of the best
    practices I''ve presented throughout the book.


    # In This Chapter


    | Creating Readable Style Sheets | 362 |

    | CSS Libraries and Frameworks | 367 |

    | Style Sheet Strategies | 368 |

    | Troubleshooting CSS Code | 372 |

    | Debugging CSS in Firefox and Web Inspector | 376 |

    | Validating Your CSS Code | 381 |

    | Minifying Your CSS | 382 |

    | 32 CSS Best Practices | 385 |'
