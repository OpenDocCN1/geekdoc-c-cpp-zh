  md: '# # Alice''s Adventures in Wonderland


    Chapter 1. Down the Rabbit-Hole

    Alice was sitting by her sister on the bank, and of so tired of reading the book
    without any pictures or conversation, that she began to fall asleep—once in a
    while she wondered what she would do if there were nothing to do.


    She was wondering how long it would be, if she fell down the rabbit hole all the
    way to00 box she had imagined, or whether this, by going through, would be such
    a curious and strange place as to, with such strange sights and things, to make
    sleeping glad.


    +   - A percentage representing how much larger (values than 100%) or smaller
    (values less than 100%) is the relative to the size of its parent element


    The value you use depend on your need; however, it is generally recommended to
    set relative font sizes to allow visitors control of how large they are.


    The font size determines its legitimacy on the page. Titles are usually larger
    than body copy; but some text, such as the <strong> and <em> tags, may need a
    little more attention to.


    # ## 3. Font size overrides with


    ```

    h1 { font-size: 3em; }

    ```


    # ### Choosing Font Size Type for Screen or Print


    Although you may more exact control, absolute font values (as points) are unreliable
    for the screen and can limit how the visitor''s browser displays your work.


    The only reason you would need to increase or decrease it compared to the size
    set in the body is if you are using ems to set the font size, which I recommend,
    then remember that this is relative to the size of the parent. So a size of 2em
    would be twice as large as the parent, whereas a size of .5em would be half the
    size.


    The point (abbreviated pt) is one way to refer to a font''s absolute size. A 12-point
    font is an average size for print use and is comfortable for most readers. The
    size of a point onscreen, varies slightly between operating systems, so on a Windows
    computer appears larger than the same font as displayed on a Mac. Although using
    point sizes is an acceptable choice in CSS for print (see "Quarrying the Media"
    in Chapter 4), it is a poor choice for screen display.


    > TIP Avoid defining media font sizes using points or other absolute font sizes
    because these tend to render inconsistently across platforms. However, they''re
    fine to use for print style sheets.


    > TIP When setting font sizes, your strategy is to set a relative-length size
    for the <body> (such as 100%), and then absolute font sizes (such as small) or
    relative font sizes (such as larger) to adjust the size. Doing so ensures the
    most consistent and versatile page viewing regardless of the actual media used
    (computer screen, printed page, handheld, and so on.)


    I recommend sticking with relative value types (especially em) for screen and
    absolute value types for print.'
