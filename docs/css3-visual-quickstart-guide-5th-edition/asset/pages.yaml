- pgno: 111
  md: '# NEW CSS3: Styling specific children with pseudo-classes ★


    Designers often want to apply a style to an element that is the first element
    to appear within another element, such as a parent''s first child.


    The first-child pseudo-element has been available since CSS2.22; however, CSS3
    offers an assortment of new structural pseudo-elements for styling an element''s
    child element exactly (Table 4.4):


    +   - first-child—Sets the appearance of the first instance of a selector type
    if it is the first child of its parent.

    - first-of-type—Sets the appearance of an element the first time its selector
    type appears within the parent.

    - nth-child(#)—Sets the appearance of the specified child element. For example,
    the third child of a paragraph would be p:nth-child(3).

    - nth-of-type(#)—Sets the appearance of the specific occurrence of a selector
    type within the parent, the seventh paragraph would be p:nth-of-type(7).

    - last-of-type(#)—Sets the appearance of the specific occurrence of a selector
    type within the parent, but from the bottom. For example, the third paragraph
    from the bottom would be p:last-of-type(3).

    - last-child—Sets the appearance of the indicated selector if it is the last child
    of the parent.

    - last-of-type—Sets the appearance of the last instance of a particular selector
    type within its parent.


    # Text Decoration:

    To Underline or Not


    Underlining is the standard way of indicating a hypertext link on the Web. However,
    the presence of many underlined links turns a page into impenetrable mass of lines,
    and the text becomes difficult to read. In addition, if visitors have underlining
    turned off, they cannot see the links, especially if the link and text colors
    are the same.


    CSS allows you to turn off underlining for links, overriding the visitor''s preference.
    I recommend this practice and to rely on clear color choices to highlight hypertext
    links or to rely on alternative underlining method of border-bottom, which allows
    you better control over the style of the underline. See Chapter 14 for more information.'
