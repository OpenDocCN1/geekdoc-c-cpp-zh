  md: '# Making Text Italic


    Italic or oblique? To really tell the difference, take a careful look at the letter
    "I" in both words.


    Two kinds of styled text that are often confused are italic and oblique. An italic
    font is a special version of a particular font, redesigned with more pronounced
    serifs and usually a slight slant to the right. An oblique font, on the other
    hand, is simply a font that is slanted to the right but otherwise identical to
    the normal version.


    Using the font-style (Table 5.6), you can define a font as italic, oblique, or
    normal. When a font is set to italic but does not have an explicit italic version,
    the font defaults to


    # TABLE 5.6 Font-Style Values


    | Value | Compatibility |

    | --- | --- |

    | normal | IE3, F1, S1, C1, O5.5, CSS1 |

    | italic | IE3, F1, S1, C1, O5.5, CSS1 |

    | oblique | IE4, F1, S1, C1, CSS1 |


    # COMING SOON: Font-stretch


    Although not currently implemented in any browser, CSS3 includes the new property,
    font-stretch. The command font-stretch allows you to reference particular font
    widths, such as expanded and condensed. Some fonts are different from bold which
    simply makes the letterform considerably thicker. Most fonts will not have those
    properties, but for that do, using font-stretch will be the best way to access
    them.


    # To set font-style for an element:


    +   Add the font-style property to your CSS. Type the property name font-style
    (Code 5.6), followed by a colon (:).


    font-style:


    +   italic;

    Define a style value. Type a value for the font-style. Your options:


    +   italic, which displays the type in italic version of the font

    obloque, which slants the text to the right

    normal, which overrides any other style sets


    +   h2 strong { font-style: normal; }

    Add style overrides as needed. You can override italic or oblique by setting the
    font style for a child element to normal.


    ![](img/9cd61ac1d4015ed5688d0c411434a660_162_0.png)


    Normal, extended, and condensed versions of Univers LT Std, which can be referenced
    by the font-stretch property when it becomes available.


    Font Properties 139'
