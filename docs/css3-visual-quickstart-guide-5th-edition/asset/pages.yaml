  md: '# TABLE 4.3 Link and Dynamic Pseudo-Classes


    | Format | Name | Elements Are Styled If... | Compatibility |

    | --- | --- | --- | --- |

    | :link | Link | the value of href is not in history | IE4, FF1, O3.5, S1, CSS1
    |

    | :visited | Visited Link | the value of href is in history | IE4, FF1, O3.5,
    S1, CSS1 |

    | :target | Targeted Link | a targeted anchor link | FF1.3, S13, C1, O9.5 CSS3
    |

    | :active | Active | the element is clicked | IE7, FF1, O3.5, S1, CSS1 |

    | :hover | Hover | the pointer is over the element | IE4*, FF1, O3.5, S1, CSS2
    |

    | :focus | Focus | the element has screen focus | IE7, FF1, O7, S1, CSS2 |


    * Only available for anchor tags until IE7


    # TABLE 4.4 Structural/Other Pseudo-Classes


    | Format | Name | Elements Are Styled If... | Compatibility |

    | --- | --- | --- | --- |

    | :root | Root | is the top level element in a document | FF1.5, O9.5, S3.1, C3,
    CSS3 |

    | :empty | Empty | has no children | FF1.5, O9.5, S3.1, C3, CSS3 |

    | :only-child | Only Child | has siblings | FF1.5, O9.5, S3.1, C3, CSS3 |

    | :only-of-type | Only of Type | has its unique selector among its siblings |
    FF1.5, O9.5, S3.1, C3, CSS3 |

    | :first-child | First-Child | is the first child of another element | FF1.5,
    O9.5, S3.1, C2, CSS3 |

    | :nth-of-type(n) | Nth of Type | is the nth element with that selector | FF1.5,
    O9.5, S3.1, C3, CSS3 |

    | :last-of-type(n) | Nth From Last of Type | is the nth element with the last
    element with that selector | FF1.5, O9.5, S3.1, C3, CSS3 |

    | :last-child | Last Child | is the child in the parent element | FF1.5, O9.5,
    S3.1, C3, CSS3 |

    | :first-of-type | First of Type | is the first of its selector type in the parent
    element | FF1.5, O9.5, S3.1, C3, CSS3 |

    | :last-of-type | Last of Type | is the last of its selector type in the parent
    element | FF1.5, O9.5, S3.1, C3, CSS3 |

    | :lang() | Language | has a specified language code defined | IE8, FF1, O9.5,
    S3.1, C3, CSS2 |

    | :not(s) | Negation | is not using specific selectors | FF1.5, O9.5, S3.1, C3,
