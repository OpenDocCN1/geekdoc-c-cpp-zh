- pgno: 103
  md: '# Working with Pseudo-classes


    Many HTML elements have special states or uses associated with them that can be
    styled independently. One example of this is the link tag, <a>, which has link
    (its normal state), a visited state (when the visitor has already been to the
    page represented by the link), hover (when the visitor has their mouse over the
    link), and active (when the visitor clicks the link). All four of these states
    can be styled separately.


    A pseudo-class is a predefined state or use of an element that can be styled independently
    of the default state of the element


    +   - Links (Table 4.3)—Pseudo-classes are used to style not only the initial
    appearance of the anchor tag, but also how it appears after it has been visited,
    while the visitor hovers their mouse over it, and when visitors are clicking it.


    +   - Dynamic (Table 4,3)—Pseudo-classes can be applied to any element how it
    is styled when the user hovers over it, it clicks it, or selects it.


    +   - Structural (Table 4.4)—Pseudo-classes are similar to the sibling combinatory
    selectors but allow you to specifically style elements based on an exact or computed
    numeric position.


    +   - Other (Table 4.4)—Pseudo-classes are available to style elements based on
    language or based on what tag they are not.


    ```

    a:link { color: red; }

    ```


    > General syntax of a pseudo-class.'
  merge: -1
  img_proc: true
