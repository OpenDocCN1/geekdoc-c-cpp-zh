    {...}

    ```


    For example, the visited state would use: background-position: right -100px;


    So only the visited button state is shown C. You can, of course, include whatever
    style changes you want. In this example, I''m also changing the background color.


    ![](img/9cd61ac1d4015ed5688d0c411434a660_379_0.png)


    > The idea (and the last part of name) for CSS sprites originated in the early
    days of video games, when memory and speed were at a premium. To overcome speed
    limitations, video game producers would lay out the thousands of small graphics
    used to create the game into a grid and then display each sprite as needed, masking
    out all but the needed part of the larger image.


    > With the height of the element set, only a part of the background image is revealed,
    hiding the rest. By changing the background position within the element, it appears
    as if the image changed.


    The example here is is a simple one, but it''s possible to place dozens, hundreds,
    or more images on a single sprite to cut down on server requests and speed up
    your site.'
