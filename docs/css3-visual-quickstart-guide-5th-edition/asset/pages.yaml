- pgno: 71
  md: '# (Re)Defining HTML Tags


    Almost all HTML tags have default browser styles associated with them. Take the
    `<strong>` tag, for example: Its inherent style declaration is the equivalent
    of **font-weight: bold.**


    By adding CSS declarations to the strong HTML selector, you can change any element
    tagged as **strong** to look like anything you want A. For example, you could
    make all italicized text bold or even set **font-weight: normal**, which would
    prevent the text from being bold.


    | HTML selector | Property | Value |

    | --- | --- | --- |

    | p { font-size : 1em; } | Declaration |


    > The general syntax used to define the styles for an HTML tag.


    # To define an HTML selector:


    +   1. Start with the HTML selector whose properties you want to define. Add a
    curly bracket {} to open your rule (Code 3.8). Make sure you close your declaration
    list with a curly bracket {}. If you forget this, it will ruin your day! **strong
    {...}**


    CSS rules can be defined in the head of your document within the `<style>` tags
    or in an external CSS file that is imported or linked to the HTML document. (See
    "Embedded: Adding Styles to a Web Site.\)


    continues on page 50'
  merge: -1
  img_proc: true
