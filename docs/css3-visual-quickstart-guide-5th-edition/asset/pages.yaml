  md: "# 7.4 color-background-properties\n\nBackground-images are added over the background\
    \ colors A. Notice that you can have multiple backgrounds in a single element,\
    \ and they stack on top of each other B.\n\n# To define a background image:\n\n\
    +   1. Add the background image property to your CSS code with the image file\
    \ source. Type background–image, followed by a colon (:), url(), and a URL in\
    \ the parenthesis for the location of the image file (GIF, JPEG, or PNG) that\
    \ you want to use as the background. It can be either a complete Web address or\
    \ a relative path (Code 7.4).\nbackground-image: url(alice0.gif);\nAlternatively,\
    \ you could type none instead of url() with a path to instruct the browser to\
    \ use a background-image (Table 7.7).\n\n```\n*** CSS V8 | Chapter 7 |\n| -> color-background-properties.css\
    \ ***\n```\n\n```\nbody {\n  color: rgb(51,51,51);\n  background-color: rgb(85,85,85);\n\
    \  background-image: url(../images/\n  dark-victorian.jpg);\n  background-repeat:\
    \ repeat;\n  background-attachment: fixed;\n  background-position: 0; 0;\n}\n\
    header.page {\n  display: block;\n  background-color: rgb(102,0,0);\n  background-image:\
    \ url(../images/\n  bg-book-spine-tile.png), url(../images/\n  bg-book-spine.jpg);\n\
    \  background-repeat: no-repeat, repeat-x;\n  background-position: center top,\
    \ 0; 0;\n}\nh1 {\n  color: rgb(255,225,225);\n  color: rgba(255,225,225,.65);\n\
    }\narticle {\n  display: block;\n  background-color: rgb(242,237,217);\n  background-image:\
    \ url(../images/embellish-01\n  .png), url(../images/page-01.jpg);\n  background-repeat:\
    \ no-repeat, repeat;\n  background-position: right top, 0; 0;\n}\\article h2 string\
    \ {\n  color: rgb(135,127,107);\n}\narticle header + p:first-letter {\n  color:\
    \ rgb(153,0,0);\n  background: transparent;\n}\n```\n\n# Table 7.7 Background-Image\
    \ Values\n\n| Value | Compatibility |\n| --- | --- |\n| <url> | IE4, FF1, S1,\
    \ C3.5, CSS1 |\n| none | IE4, FF1, S1, C3.5, CSS1 |\n\ncontinues on page 203\n\
    \n```\ncode continues on next page\n```"
