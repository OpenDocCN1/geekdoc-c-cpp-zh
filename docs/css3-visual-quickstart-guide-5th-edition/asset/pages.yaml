- pgno: 117
  md: "# Setting content before and after an element\n\nThe :before and :after pseudo-elements\
    \ can be used to generate content that appears above or below a selector. Generally,\
    \ these pseudo-classes are used with the content property. (See Adding Content\
    \ Using CSS in Chapter 9.) The pseudo-elements you add and style repetitive content\
    \ to the page in a consistent way.\n\n# To set content before and after an element:\n\
    \n+   1. Style the element.\n\n```\nh1 {...}\n```\n\nAlthough not required, it's\
    \ generally a good idea to set the default style of the selector for which you\
    \ will be styling the :before::after pseudo-elements. (See Code 4.12.)\n\n+  \
    \ 2. Add content before the element. Type the selector (HTML, class, or ID) you\
    \ want to add content before, a colon (:), and then the keyword **before**.\n\n\
    ```\nh1:before { content:... }\n```\n\nNext, declare the content property and\
    \ define what generated content before the element and how it should be styled.\n\
    \n+   3. Add content after the element. Type the selector (HTML, class, or ID)\
    \ you want to add content after, a colon (:), and then the keyword **after**.\n\
    \n```\nh1:after { content:... }\n```\n\nNext, declare the content property and\
    \ define what generated content goes after the element and how it should be styled.\n\
    \n> Code 4.12 Before and after pseudo-elements are used to add content—C in the\
    \ page header D\n\n```\n<html>\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n\
    \  <meta http-equiv=\"Content-Type\"\n    content=\"text/html; charset=UTF-8\"\
    \ />\n  <title></></title>\n</head>\n<style type=\"text/css\" media=\"all\">\n\
    h1 {\n  font-size: 2em;\n  color: red;\n  font-style: italic;\n}\nh1:before {\n\
    \  content: url('../images/bullet-01.png');\n}\nh1:after {\n  content: url('../images/bullet-02.png');\n\
    }\n</style>\n</head>\n<body>\n<h1>Alice's Adventures in Wonderland</h1>\n<p>The\
