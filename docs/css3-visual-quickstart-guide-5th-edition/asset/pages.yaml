- pgno: 299
  md: '# Coming Soon!


    Watch for a number of new properties and features that are planned for CSS in
    the future. These include:


    **Text overflow** property (this chapter) defines how content (text or otherwise)
    is treated when there is not enough space in the element to display all. **text-overflow**
    will allow you to control how text that cannot fit within its given area will
    be treated, allowing you to use ellipses to indicate continued text.


    **Box Sizing.** The actual space a box takes up is calculated based on the width/height,
    plus the padding, plus the border. The box-sizing property let''s change how the
    box size is calculated, such that the size is calculated from border to border.


    **Resize.** Allows to set a box as being resizable by the user. This is especially
    useful in text for fields where someone may have a lot to say.


    **Multi-column Layout.** One of the most exciting coming soon features, multi-column
    layout should replace the float method, finally allowing designers to create more
    versatile layout grids.


    **Animation.** In addition to transitions and transformations, true animation
    that will rival Adobe Flash will soon be coming to a web browser near you. Already
    implemented in Safari, Firefox, and Opera.'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# Putting it All Together


    +   1. Create three block level elements. Use `<div>` tags and give each one a
    unique ID but the same class.


    +   2. Set a width and height of 300px for each block. The blocks will be invisible,
    though, they don''t have any content, border, or background.


    +   3. Add a border to each element. Use the class to define the border style
    and width, and then the ID to add a different color for each box.


    +   4. Add a margin to the boxes. The boxes should separate slightly, but notice
    that the margin is not cumulative; instead it collapses to whichever margin is
    largest (top or bottom).


    +   5. Add floating to all three boxes. They should no be arranged vertically,
    as long as your browser window is wide enough.


    +   6. Add text to the three boxes. Notice that it overflows if you add too much.


    +   7. Specify how the overflow should be treated for each box. Try a different
    method for each.


    +   8. Add padding to the boxes. Notice that the boxes grow to fit the padding,
    but the text stays the same width and height.'
