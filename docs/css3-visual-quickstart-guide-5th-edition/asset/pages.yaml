- pgno: 97
  md: '# # Styling only the children


    If you want to style only a parent''s child elements (not a grandchild descendant),
    you must specify the parent selector and child selector, separated by a close
    angle bracket (>) .


    ```

    copy > em { color: red; }

    ```


    Greater-than sign


    The general syntax of the direct child selector.


    # To define child selectors:


    +   1. Set up a list of direct child selectors. Type the selector for the parent
    element (HTML, class, or ID), followed by a right angle bracket (>) and the child
    selector (HTML, class, or ID).

    `article.copy > p > em {...}`

    You can repeat this as many times as you want with the final selector being the
    target to which you apply the styles (Code 4.3). You can have one space between
    the selector and the greater-than sign or no spaces.


    +   2. Styles will be used if the pattern is matched.

    `<article class="copy"><p>...

    ·<em>.../<em>.../</em></p></article>`

    The styles from step 1 are applied if and only if the final selector is an immediate
    child element nested in the preceding element. Placing the tag within any other
    HTML tags will disrupt the pattern.'
  merge: -1
  img_proc: true
