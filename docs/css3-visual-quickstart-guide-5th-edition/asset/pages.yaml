  md: '# TABLE 7.13 Background-Origin Values


    | Value | Compatibility |

    |---|---|

    | padding | FF1, S3, C3 |

    | border | FF1, S3, C3 |

    | content | FF1, S3, C3 |

    | padding-box | S3/S5, C10.5, CSS3 |

    | border-box | S3/S5, C10.5, CSS3 |

    | content-box | S3/S5, C10.5, CSS3 |


    7. Add the background origin property and specify an origin method. Type background-origin
    followed by a colon (:):


    ```

    -o-background-origin: padding-box;

    -moz-background-origin: padding;

    -webkit-background-origin: padding-box;

    -background-origin: padding-box;

    ```


    Firefox supports -moz-background-origin

    Safari 4 and Chrome 3 support -webkit-background-origin

    Safari 5 supports background-origin


    Then a value from Table 7.13. Two values can be included to define separate x
    and y sizes.


    8. Finally, specify the background image to which the above properties are applied.
    To layer background images, add each value in a comma-separated list. Lists will
    be placed beneath previous images in the list with background color behind all
    of them. Be sure to add all values for all the properties, as necessary.


    > TIP You can mix percentage and length values in the same background position
    and size declarations, but you cannot mix length or percentages with plain English
    keywords.


    > TIP Several of the background images used in this example are transparent PNGs,
    which allow the background to show through them.


    > TIP Any space in the background that does not have a background graphic will
    be filled with the background color, so I always recommend specifying a background
    color with a background image.


    ```

    background-image: url(../images/embellish-01.png), url(../images/paper-01.jpg);

    ```


    > TIP Background images are used to create CSS Sprites, discussed in Chapter 14,
    one of the most useful tools in your dynamic Web design arsenal.'
