- pgno: 382
  md: '# Preventing Navigation Noise


    One of my chief gripes about Web sites is the overabundance of unorganizing links.
    You''ve probably seen sites with long lists of links that stretch off the window.
    These links add visual noise to the design and waste precious space without assisting
    navigation.


    Web surfaces rarely take the time to read an entire Web page. Instead, they scan
    for relevant information. But human beings can process only so much information
    at a time. If a Web page is cluttered, visitors must wade through dozens or hundreds
    of links to find the one path to the information they desire.


    Anything designers can do to aid visitors'' abilities in a page, such as organizing
    links in lists and hiding sublinks until they''re needed, will improve the Web
    site''s usability. Drop-down, sliding, and collapsible menus are a great way to
    organize your page and prevent navigation noise.


    # 2. Hide the drop menu. To show the menu—dropping—do-you need to hide it. Give
    it a triple whammy by setting its height to 0, overflow to hidden, and opacity
    to completely transparent.


    ```

    nav.toc .menu .drop {...}

    ```


    # 3. Set the drop menu to appear when the user''s pointer hovers over it. When
    the pointer hovers over any part of the menu—including the title to the top—set
    the height to auto and opacity to opaque. You can also couple this with a transition
    to create a more subtle opening effect.


    ```

    nav.toc:menu:hover>.drop {...}

    ```


    > TIP It would be cool if the menu could unroll by using a transition from 0 to
    the menu''s full height. You could do this if you knew the exact height of the
    menu, but this is rarely the case, especially in a dynamic Web site.


    > TIP Because this trick relies on the child selector, it will not work in IE6,
    so you will need to show the menu (using conditional CSS to set display and opacity)
    or make other navigational arrangements.'
