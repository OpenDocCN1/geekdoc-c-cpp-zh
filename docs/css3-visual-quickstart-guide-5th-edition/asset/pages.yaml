    +   Setting an Element''s Border 265


    +   NEW CSS3: Rounding Corners ★ 268


    +   NEW CSS3: Setting a Border Image ★ 271


    +   Setting an Element''s Padding 274


    +   Coming Soon! 276


    +   Putting It All Together 277'
