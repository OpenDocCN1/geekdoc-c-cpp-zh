- pgno: 356
  md: '# Fixing the Internet Explorer Box Model


    All elements are rectangular "boxes" with a margin, border, padding, and content
    that has a width and height. But remember that this is Web design—It can never
    be that simple, right?


    Right. The problems begin when you realize that not all browsers define boxes
    in the same way, the main culprit being IE6.


    The W3C definition of a box created using CSS specifies the width and height of
    only the content area, the area where images and other objects are displayed.
    However, the total area that the element occupies includes the content area plus
    the padding and border sizes. So, the apparent width would be calculated in the
    following way:


    ```

    width(content) + left padding + right

    padding + left border + right border =

    width(total)

    ```


    Unfortunately, Internet Explorer through version 5.5 defined width and height
    as the apparent width and height including padding and borders. This effectively
    subtracted the padding and border sizes to determine the content width and height:


    ```

    width(total) - left padding - right

    padding - left border - right border =

    width(content)

    ```


    So, given the following CSS code:


    ```

    #object1 {

    border: 5px solid #000;

    padding: 10px;

    width: 100px;

    }

    ```'
  merge: -1
  img_proc: true
- pgno: 357
  md: 'browsers using the W3C standard (Firefox, Safari, Opera) would set the content
    area to 100 pixels wide but have a total width of 130 pixels A:


    100 + 5 + 5 + 10 + 10 = 130


    On the other hand, Internet Explorer 5.5 and earlier would set the total width
    of the element (from border to border) as 100 pixels, shrinking the width of the
    content to 70 pixels B:


    100 - 5 - 5 - 10 - 10 = 70


    This is a problem, and it only gets worse. Versions 6 and later of Internet Explorer
    fix this problem by following the W3C standards. However, if you are using the
    transitional document type definition (DTD) for your page—which is still very
    common—or a DTD that the browsers do not recognize—such as HTML5-IE6 and IE7 revert
    to the "quirky" version of the box model. Unfortunately, more often than not,
    your site will probably trigger IE''s quirks mode.


    So what''s a good Web designer to do? You have few options:


    +   - Do not use a border and/or padding with any element that has a set dimension.
    If you do, don''t expect pixel-perfect layouts. Generally, this solution isn''t
    practical, but for simple pages it might do the trick.


    +   - Code for the strict DTD so that the browser uses the standards-compliant
    box model. Generally, this approach is not practical the slightest error can return
    the browser to quirks mode and destroy the whole design.


    +   - Use one of the IE techniques (most likely the conditional comments) to code
    separate "equalizing" widths and/ heights for Internet Explorer.


    > The Caterpillar and Alice looked at each other for some time in silence: at
    last the Caterpillar took the hookah out of its mouth, and addressed her in a
    languid, sleepy voice.


    The box using the CSS box model. The content area is 100 pixels with padding and
    border added for a total width of 130 pixels.


    ![](img/9cd61ac1d4015ed5688d0c411434a660_357_0.png)


    Internet Explorer box model has its own way of dealing with the width, making
    the total width 100 pixels and shrinking the content area to 70 pixels.


    Interestingly, a new CSS3 property (box-sizing) that''s still under development
    will allow you to choose which of these box models you want to use.


    334 Chapter 13'
