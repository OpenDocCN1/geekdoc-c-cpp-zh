- pgno: 315
  md: '# # Stacking Objects in 3D


    Although the screen is a two-dimensional area, positioned elements can be given
    a third dimension: a relative stacking order.

    Positioned elements are arranged using numbers automatically, starting with 0
    and continuing incrementally—1, 2, 3, and so on—in the order in which the elements
    appear in the HTML and relative to their parents and siblings. Elements with higher
    numbers appear above those with lower numbers. This system is called the z-index
    (Table 11.4). An element''s z-index number establishes its 3D relationship to
    other elements in its parent element.


    When the content of elements overlap, the element with a higher z-index number
    will appear on top of the element with a lower number A. The z-index is always
    relative to an element''s siblings, not to its parents.

    You can override the natural order of the z-index by setting a value for the z-index
    property.


    # To define an element''s z-index:


    +   - Specify a position type. For details


    z-index:


    TABLE 11.4 Z-index Values

    | Value | Compatibility |

    | --- | --- |

    | <number> | IE4, F1, C1, O3.5, CSS2 |

    | auto | IE4, FF1, S1, C3.5, CSS2 |

    | inherit | IE4, FF1, S1, C3.5, CSS2 |


    ![](img/9cd61ac1d4015ed5688d0c411434a660_315_0.png)


    > The z-index order is relative to an element''s siblings.'
  merge: -1
  img_proc: true
- pgno: 316
  md: "# 11.4 visualformatting-properties.css\nWhen applied to Code 11, this CSS will\
    \ reverse the stacking order of images in the gallery and set the footer to a\
