- pgno: 190
  md: '# # Indenting Paragraphs


    Indenting the first word of a paragraph several spaces (five spaces, traditionally)
    is the time-honored method of introducing a new paragraph.


    On the Web, indented paragraphs haven''t worked because browsers compress multiple
    spaces into a single space. Instead, paragraphs have been separated by an extra
    line break.


    Using the text-indent property (Table 6.9), you can specify either horizontal
    space at the beginning of the first line of text and restore the traditional style.


    | TABLE 6.9 Text-Indent Values |

    | Value | Compatibility |

    | <length> | IE3, FF1, S1, C1, O3, CSS1 |

    | <percentage> | IE3, FF1, S1, O3.5, CSS1 |

    | inherit | IE3, FF1, S1, C1, CSS1


    ![](img/9cd61ac1d4015ed5688d0c411434a660_190_0.png)


    ```

    Code 6.9 applied to code 6.1: All paragraphs except the first paragraph are indented
    a space that is equivalent to two letters. The indent space will adjust with the
    font size.

    ```


    # ## To define indent indentation


    +   1. Add the indent property to your CSS text-indent in the CSS declaration
    list, followed by a colon (: (Code 6.9).


    text-indent:


    +   2. Specify the amount of indentation.


    Type a value for the indent, using one of the following options:


    +   - A length value such as em creates a nice, clear indent. (see "Values and
    Units Used in This Book" in the Introduction.)


    +   - A percentage value indents the text proportional to the parent''s (paragraph)
    width (10%), for example.


    TIP If you are using indent to indicate paragraphs, you should set the margin
    and padding of paragraphs to 0 to override the <p> tag''s natural tendency to
    add space between paragraphs. You''ll learn more about margins and padding in
    Chapter 8.


    TIP Because indent is more common in the print world than the online, you may
    want to consider using indents for only the printer-friendly versions of your
    page.


    Text Properties 167'
  merge: -1
  img_proc: true
