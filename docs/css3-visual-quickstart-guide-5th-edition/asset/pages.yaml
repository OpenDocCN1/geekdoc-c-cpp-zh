  md: "# Setting the Space Between Table Cells\n\n# TABLE 8.7 Border-Spacing Values\n\
    \nAlthough table data cells and table header cells use many of the box properties\
    \ we'll explore in Chapter 10, they cannot use the margin property. Instead, CSS\
    \ has the border-spacing (Table 8.7) property, which sets an equal amount of space\
    \ between data cells' top, bottom, left, and right sides.\n\n| Value | Compatibility\
    \ |\n| --- | --- |\n| <length> | IE5.5, FF1, S1.3, C1, CSS2 |\n| inherit | IE5.5,\
    \ FF1, S1.3, C1, CSS2 |\n\nTo collapse the border spacing in a table:\n\n+   1.\
    \ Add the border spacing property to the CSS rule for a table element. Type border-spacing,\
    \ followed by a colon (: (Code 8.7).\n\nCode 8.7 list-table-properties: The border-spacing\
    \ property works like a margin around the data cell A\n\nborder-spacing:\n\n+\
    \   2. Specify the spacing between table cells.\n\n2. Specify the spacing between\
    \ table cells.\n8px;\n\nType a length value (such as 8px) to specify the distance\
    \ between cells. (See \"Values and Units Used in This Book\" in the Introduction.)\
    \ Alternatively, use inherit to use the same border spacing as a cell's parent\
    \ element.\n\n```\n*** CSS3 VQS | Chapter 8 | \n*** list-table-properties.css\
    \ ***\n\nul {\n  list-style: circle url(../images/bullet-01.png); inside);\n}\n\
    nav.global ul {\n  list-style: none;\n}\ntable {\n  table-layout: auto;\n  border-spacing:\
    \ 8px;\n  width: 75%;\n  margin: 40px auto;\n}\ntable-caption, table head {\n\
    \  * Times, \"New Roman\", Serif; }\n}\ntr {\n  font-size: 1.25em;\n}\ntd {\n\
    \  vertical-align: top;\n  padding: .5em;\n  background-color: rgba(200, 200,\
    \ 180,.25);\n  border: 1px solid rgb(200, 200, 180); }\n```\n\n| The Penny | Description\
    \ | Mad? |\n| --- | --- | --- |\n| The Hatter | \"Mad as a March hare\" was a\
    \ common phrase in Carroll's tale. |\n| The Dormouse | The Dormouse is always\
    \ sleeping during the scene, waking up every so often. |\n| Alice | The character\
    \ has been said to be Alice Liddell, a child friend of Dodgson. |\n\n> Code 8.7\
    \ applied to code 8.1: Spacing out data cells can make them easier for users to\
    \ scan.\n\nChapter 8"
