- pgno: 321
  md: '# # NEW CSS3: Setting an Element’s Opacity ★


    One of the earliest, widely implemented CSS3 features was the ability to set element
    opacity, which let you transform an element from opaque to transparent and any
    translucency. However, different browsers implement opacity in different ways.


    For example, rather implementing implementing W3C CSS syntax, Internet Explorer
    builds on its existing filter function, whereas other W3C-compliant browsers simply
    add the opacity property (Table 11.7). Because Internet Explorer ignores the other
    browsers'' code, you can place both declarations in the rule list for an element
    to control its opacity.


    ![](img/9cd61ac1d4015ed5688d0c411434a660_321_0.png)


    > > A Changing opacity allows you to see through the element underneath.


    # ### Table 11.7 Opacity Values


    || Value | Compatibility |

    | <alphavalue> | FF1, S1.3, C1, O9, CSS52 |

    | inherit | FF1, S1.3, C1, O9, CSS52 |


    # ### To set the opacity of an element:


    +   1. Add the IE filter property to your CSS declaration list. To control opacity
    of an element displayed in Internet Explorer for Windows, type the filter property
    name in the declaration block, followed by a colon (:)(Code 11.7).


    ```

    filter:

    ```


    +   2. Specify the opacity for Internet Explorer.

    alpha(opacity=75);


    Add the alpha() code to define the filter and value used. You do not want to change
    this code except for the alpha value after opacity, which can range between 0
    (completely transparent) and 100 (completely opaque). End the declaration with
    a semicolon (;).


    +   3. Add the opacity property to your CSS. To control the opacity of an element,
    type opacity followed by a colon (:).

    opacity:'
