  md: '# # NEW CSS3:

    Rounding Border

    Corners ★


    Rounded corners can help soften an otherwise sharp design, but they have been
    difficult to achieve using images. CSS3 includes a simple method for rounding
    off one or all of the corners of an element''s box: **border-radius**.


    Both Mozilla and Webkit have implemented their own versions of **border-radius**
    in advance of the final W3C pronouncement, and you need to take these browser
    extensions into account for the widest interoperability (Table 10.15).


    # To set rounded corners:


    +   1. Add the Webkit, Mozilla, and standard CSS3 border-radius properties (Table
    10.10).


    > -webkit-border-radius:

    -moz-border-radius:

    border-radius:


    Although the order doesn''t matter, it''s generally preferred to have the CSS3
    version last because it is the version that should be used.


    # TABLE 10.15 Border-Radius Values


    | Value | Compatibility |

    | --- | --- |

    | <length> | FF1, S3, C1 O10.5, CSS3 |

    | <percentage> | FF1, O10.5, CSS3 |


    **Table 10.10 ui-box-properties.css**—When applied to Code 10.1, the **border-radius**
    property is used to round the corners of different elements


    code continues on next page'
  merge: -1
  img_proc: true
