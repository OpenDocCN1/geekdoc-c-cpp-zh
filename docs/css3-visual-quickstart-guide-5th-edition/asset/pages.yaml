- pgno: 333
  md: '2. Specify the transition type and value.


    rotate(-2deg);


    For each property, add the same transform value (Table 12.1) with its relevant
    parenthetical value:


    +   - rotate() with an angle value to rotate the element. Positive values turn
    the element clockwise, whereas negative values turn the element counterwise.


    +   - rotateX() or rotateY() with an angle value to turn the element around the
    X or Y axis. Positive values turn the element clockwise, whereas negative values
    turn the element counterwise.


    +   - scale(), scaleX(), or scaleY() with numeric values that act as multipliers
    to the width (X) and/or height (Y) of the element. Positive numbers increase element
    size. Negative values will still increase size but also reflect the element along
    its axis. Decimal numbers decrease scale.


    +   - skew(), skewX(), or skewY() with angle values that skew the element along
    the X and/or Y axis of the element. Positive values skew up and to the left, whereas
    negative values skew down and to the right.


    +   - translate(), translateX(), or translateY() with length values that offset
    the element along the X and/or Y axis of the element. Positive values offset down
    and to the right, whereas negative values offset up and to the left.


    +   - matrix() is a 3×3 matrix of values that can be used as a shorthand to represent
    any of the preceding transformations alone or in combination.'
