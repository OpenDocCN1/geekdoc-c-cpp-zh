- pgno: 202
  md: '# Color and Background Properties


    Colors form the cornerstone of all design, even if they''re only black and white.
    They create the first impression of your site. Bright, vibrant, jewel-like colors
    make a radically different statement than earth tones. Even if you choose to use
    only black and white, your design will make a state-ment. Beyond their decorative
    impact, colors can also guide the viewer''s eye around the page, helping to highlight
    important areas while downplaying others.


    In this chapter, you will learn the primary methods used to add and control color
    with CSS. Keep in mind, however, you can specify color using several CSS properties.
    (See the sidebar "Other Ways to Add Color.") But before you learn how to code
    colors, let''s quickly explore how to choose them.


    # In This Chapter


    +   * Choosing Color Values 181

    * New in CSS3: Color Gradients in Backgrounds 187

    * Choosing Your Color Palette 191

    * Setting Text Color 196

    * Setting a Background Color 198

    * Setting a Background Image 200

    * Using Background Shorthand 208

    * Putting It All Together 212'
  merge: -1
  img_proc: true
