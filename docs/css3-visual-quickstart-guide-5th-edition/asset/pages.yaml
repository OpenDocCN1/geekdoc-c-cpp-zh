  md: '# Setting Multiple Font Values


    Although you can set font properties independently, it is often useful, not to
    mention more concise, to put all font elements in a single declaration (Table
    5.9). To do this, you use the shorthand font property.


    TABLE 5.9 Font Values

    | Value | Compatibility |

    | <font-style> | IE3, FF1, S1, C1, O3.5, CSS1 |

    | <font-variant> | IE3, FF1, S1, C1, O3.5, CSS1 |

    | <font-weight> | IE3, FF1, S1, C1, O3.5, CSS1 |

    | <font-size> | IE3, FF1, S1, C1, O3.5, CSS1 |

    | <line-height> | IE3, FF1, S1, C1, O3.5, CSS1 |

    | <font-family> | IE4, FF1, S2, C1, O6, CSS2 |


    To define several font attributes simultaneously in a rule:


    +   1. Add the font property to your CSS. The property name font (Code 5.9), followed
    by a colon (:). Then type the values in the same order that they are typed in
    the remaining steps of this exercise.

    2. Optional, Define a style value. Type a font-style value, followed by a space.
    (See "Making Text Italic" in this chapter).

    3. Optional, Define a weight value. Type a font-weight value, followed by a space.
    (See "Setting Bold, Bolder, Boldest" in this chapter).

    4. Optional, Define a variant value. Type a font-variant value, followed by a
    space. (See "Creating Small Caps" in this chapter.)'
