  md: '# Creating Small Caps


    Small caps (sometimes referred to as mini-caps) are useful for emphasizing titles
    (Table 5.8). With small caps, lowercase letters are converted to uppercase but
    a slightly smaller size than regular uppercase letters A.


    # Normal SMALL CAPS


    With small caps, all the letters are uppercase, but the first letter is larger
    than the others.


    | TABLE 5.8 Font-Variant Values |

    | Value | Compatibility |

    | --- | --- |

    | normal | IE4, FF1, S1, C1, O3, CSS1 |

    | small-caps | IE4, FF1, S1, C1, O3, CSS1 |


    # To set small caps for an element:


    +   1. Add the font variant property to your CSS. Type the property name font-variant
    (Code 5.8), followed by a colon (:).


    +   2. Define value for the variant.

    small-caps;


    Type the value of the font-variant property, using one of the following


    +   * small-caps, which sets lowercase letters as smaller versions of true uppercase
    letters

    * normal, which overrides other font-variant values that may be inherited


    ![](img/9cd61ac1d4015ed5688d0c411434a660_167_0.png)


    Using small caps for the title is an elegant way to set it off from the rest of
    the text.


    > Small caps are best reserved for titles or special text; they can be hard to
    read at smaller sizes.'
