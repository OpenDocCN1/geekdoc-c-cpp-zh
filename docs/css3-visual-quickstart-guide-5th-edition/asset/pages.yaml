- pgno: 91
  md: '# Putting It All Together


    +   1. Add content to your HTML file. Using the HTML file you created in chapter
    2, add text and image content. I tend to use Alice''s Adventures in Wonderland,
    but anything will do. A great source for text is Project Gutenberg (www.gutenberg.org).


    +   2. Mark up your content. All styles require markup in the Web page to give
    them something to be applied. Make sure to tag headers and paragraphs.


    +   3. Add classes and IDs to your markup. Classes give you a "hook" to apply
    specific styles to specific elements. Don''t go overboard, though. Only add classes
    where it useful to differentiate kinds of elements and IDs to differentiate a
    specific element in the design.


    +   4. Add your HTML, class, and ID declarations to the head of your document
    in `<style>`. You can style these however you see fit, based on the the styles
    presented in chapters 5-12.


    +   5. Add comments to your CSS code. The note can include information about the
    code, or contact information about the creator (you) and how to contact them with
    questions.


    +   6. Move your embedded styles from step 4 into an external file. Create the
    text file and then copy and paste just the CSS code (everything between but not
    including the `<style>` tags) into the text file. Make sure to save the file with
    a .css extension.


    +   7. Add a `<link>` from the external style sheet. When you test your Web page
    in a browser, it should look just like it it did on Step 4, but no the CSS is
    accessible to all of your Web pages.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# Selective Styling


    It''s not enough to style a Web page element. The art of CSS—and thus the art
    of Web design—is the ability to style elements based on their context. You must
    consider where an element is in the document; which elements surround it; its
    attributes, context, and dynamic state; and even the platform displaying the element
    (screen, handheld device, TV, and so on).

    Selective styling is the closest that CSS gets to traditional computer programming,
    allowing you to style elements *if* they meet certain criteria. This level of
    styling can get increasingly complex, so it''s important, at least in this chapter,
    to start out as simply as possible and build a firm foundation of understanding.


    # In This Chapter


    | | |

    | The Element Family Tree | 70 |

    | Defining Styles Based on Context | 71 |

    | Working with Pseudo-classes | 80 |

    | Working with Pseudo-elements | 92 |

    | Defining Styles Based on Tag Attributes | 96 |

    | NEW IN CSS3: Querying the Media ★ | 100 |

    | Inheriting Properties from a Parent | 109 |

    | Making a Declaration !Important | 111 |

    | Determining the Cascade Order | 113 |

    | Putting It All Together | 116 |'
  merge: -1
  img_proc: true
- pgno: 93
  md: "# The Element Family Tree\n\nWhen a tag is surrounded by another—one inside\
    \ another—the tags are **nested**.\n\n# <h2><strong>Chapter 2 <strong>The Pool\
    \ of Tears</strong></h2>\n\nIn a nested set, the outer element in this example\
    \ (`child`) is the *parent*, and the inner element (`<strong>`) is the *child*.\
    \ The child tag and any children of that child are the parents' *descendants*.\
    \ Two tags in the same parent are siblings, and two tags immediately next to each\
    \ other are **adjacent siblings**\n\n+   - **Parent elements** contain other elements\
    \ (children). Child elements will often inherit styles from a parent element.\n\
    \n+   - **Descendant elements** are any elements within another element.\n\n+\
    \   - **Child elements** are first generation descendent elements in relation\
    \ to the parent. Second generation and higher elements are sometimes referred\
    \ to as grandchildren.\n\n+   - **Adjacent or preceding sibling** are child elements\
    \ of the same generation that are immediately next to each other in the HTML code.\n\
    \nIn Chapter 3, you learned ways to specify the styles of an individual element\
    \ regardless of where it is placed in the HTML code. However, CSS also lets you\
    \ specify the element's style depending on its context. Using *contextual selectors*,\
    \ you can specify styles based on a tag's relationship to other tags, classes,\
    \ or IDs on the page.\n\n```\n<article class=\"copy\">\n<p>\n  <em>Alice's Adventures</em>\\\
    n  <strong>In Wonderland</strong>\nn</p>\n</article>\n```\n\nParent Descendant\
    \ child\n\nPreceding sibling Adjacent sibling The article element is the parent\
    \ to the elements created by the paragraph, strong, and emphasis tags, which are\
    \ its descendants. The paragraph tag is a direct child. The elements created by\
    \ the emphasis and strong tags are the paragraph tag, and each other's siblings."
  merge: -1
  img_proc: true
- pgno: 94
  md: '# Defining Styles Based on Context


    Contextual styles allow you to specify how a particular element should appear
    based on its parents and siblings. For example, you may want an emphasis tag to
    appear one way when it''s in the main header of the page and differently when
    it appears in the sub-header. You may want still another appearance in a paragraph
    of text. These combinatory selectors (Table 4.1) among the most used and useful
    CSS.


    Space-separated list of selectors Declaration List


    ```

    .copy h1 em { color: red; }

    ```


    The general syntax for the descendent selector.


    Space separated list of selectors Declaration list


    ```

    .copy * em { color: red; }

    ```


    Universal selector


    The general syntax for the descendent selector using the universal selector.


    # Styling descendants


    You can style individual elements depending on their parent selector or selectors
    in a space-separated list. The last selector will receive the style if and only
    if it is the descendant of the preceding selectors.


    When you want to indicate that the exact selector does not matter at any given
    level, you can use the universal (*) described in Chapter 3


    Table 4.1 Combinator Selectors

    | Format | Selector Name | Elements Are Styled If... | Compatibility |

    | a b c | Descendant | b descendent of b descendent of a | IE4, FF1, O3, S1, C1,
    CSS1 |

    | a * b | Universal | b within regardless of b''s parents | IE7, FF1, O4, S1,
    C1, CSS2 |

    | a > b | Direct Child | b direct child of a | IE7, FF1, O3.5, S1, C1, CSS2 |

    | a + b | Adjacent Sibling | sibling b immediately after a | IE7, FF1, O5, S1,
    C1, CSS2 |

    | a ~ b | General Sibling | sibling b anywhere after a | IE8, FF1, O5, S1, C1,
    CSS2 |


    ![](img/9cd61ac1d4015ed5688d0c411434a660_94_0.png)'
  merge: -1
  img_proc: true
