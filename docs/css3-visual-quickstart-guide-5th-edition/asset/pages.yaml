    # ## Chapter 1. Down the Rabbit-Hole


    Alice was beginning to get tired of sitting by her sister on the bank, and of
    having nothing to do; once or twice she peered into the book her sister was reading,
    but it had no pictures or conversations in it, ''and what is the use of a book
    without pictures?'' thought Alice.


    So she was considering in her own (as well as she could, for the hot day made
    her feel very sleepy), and thought of making a chain of it, by burning pages and
    dancing, when suddenly a White Rabbit with pink eyes ran past her;


    There was nothing so remarkable in that, that not Alice thought it very strange
    to run out the way of the bank to say to him, ''Oh dear! Oh dear! What shall I
    do?'' (for she had never seen a rabbit without a waistcoat, and, at the time it
    seemed quite natural), but


    Rabbit took out his waistcoat pocket, and looked at it, and was amazed that she
    had never seen a rabbit with a waistcoat, or a watch to take out of; and, burning
    with curiosity, she ran across the field and, fortunately was just in time to
    pop down a large rabbit hole under the hedge.


    In another moment she was following after it, not considering how in the world
    she was to get out.


    The fall went on like a tunnel for some time, and then suddenly down, that Alice
    had not a moment to think about stopping before herself falling down a very deep
    well.


    Either the well was very deep, or she fell very slowly, for she had plenty of
    time to get used to it, and, and think about what was going to happen next. First,
    she tried to look down and make out what she was coming to, but it was too dark
    to see anything; she looked at the sides of the well, and noticed that they were
    filled with cupboards and bookshelves; and there she saw maps and pictures hanging
    upon them. She took down a jar from one of the shelves as she passed; it was labeled
    ''ORANGE MARMALADE'', but to her great disappointment it was empty; she did not
    like to drop the jar for fear of killing


