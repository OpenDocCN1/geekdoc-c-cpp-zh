- pgno: 45
  md: '# The Evolution of HTML5


    HTML5 is the next step in Web markup and will take over from XHTML. Although XHTML2
    was in development for almost eight years, it was laid to rest in 2009 in favor
    of HTML5.


    To understand how this happened, let''s take a little trip back to the halcyon
    days of the Web at the end of the twentieth century—1997, to be precise. It was
    still a Web 1.0 world, although we didn''t yet know to call it that. The dotcom
    bubble was starting to inflate, and everyone was surfing the Web with Netscape
    Navigator Into that landscape the World Wide Web Consortium (W3C) introduced HTML
    4.0 (HTML4).


    HTML4 was a vast improvement, because for the first time it was created by a standards
    body that gave everyone a seat at the table and believed that Web pages should
    display the same across all browsers.


    # And then came XHTML


    XHTML 1 (released in 2001) is a rewriting of the HTML 4.01 standard using XML,
    and was intended to bring the power of XML to Web page development. XHTML uses
    the XML Doctype. XHTML employs all the same tags as HTML, but the code will still
    work with a browser that does not understand XML.


    Although XHTML 2 was primarily meant to be a transitional technology to a brave
    new Web technology, from its very beginning, something went horribly wrong.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# The problem with XHTML2


    It was quickly realized that even XHTML 1 was not enough to evolve the Web from
    its relatively static "page" nature into a truly interactive and universal environment
    of applications. XHTML2 was meant to change all of that. Starting in August 2002,
    the authors of the XHTML standard began crafting a new language that they hoped
    would completely retool Web markup for the twenty-first century, bringing about
    a golden age of semantic Web pages, interactivity, internationalization, device
    independence, and tapioca pudding for everyone! But they forgot one: XHTML2 was
    not written to be backward compatible with older Web markup languages. Existing
    browsers would not be able to run this whiz-bang new markup language. Web developers
    would have to develop one version of their site for older browsers and another
    for the XHTML2 standard.


    # And then there was HTML5


    In June 2003, HTML5 started life as Web Applications 1.0 and was created by the
    Web HyperText Application Technology Working Group (WHATWG), an organization that
    was not associated with the W3C. Instead, this independent group, frustrated with
    the slow pace and errant direction that XHTML2 was taking, began working on an
    alternative standard that would be backward compatible, more suitable for writing
    applications and pages, and would also address many practical issues that Web
    developers faced.'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'For several years, both languages were developed simultaneously. But in 2007,
    seeing that Web Applications 1.0 was further along than XHTML2, the W3C adopted
    it as the starting point for a new HTML5 standard, publishing the "First Public
    Working Draft" of the specification on January 22, 2008. To focus attention on
    HTML5, the W3C did not return to the XHTML Working Group''s chapter and XHTML2
    was no more.


    ### TABLE 2.3 HTML5 vs. XHTML5

    | | XHTML5 | HTML5 |

    |---|---||

    | Tag case | lowercase | upper or lowercase |

    | Closing tags | required | optional |

    | Self closing tags | required | optional |

    | MIME type | application/xml or application/xhtml+xml | text/html |

    | Well-formedness errors | fatal | not fatal |


    # ## Is it HTML5 or XHTML5?


    Although XHTML2 has disappeared, the need to unify XML and HTML has not. Therefore,
    a parallel initiative exists to create HTML5. To be clear, this is not a new or
    alternate markup language; it is simply HTML5 written using XML rules and is similar
    to XHTML.


    If you know XML, learning HTML5 should not be difficult. They differ primarily
    in the ways they treat tags. Some of the most important differences are listed
    in Table 2.3.


    Whether you use HTML5 or XHTML5 is your call. But, honestly, I''m enjoying the
    more forgiving nature of HTML5, and it''s what I''m using for the code in this
    book.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# What’s Not in HTML5?


    HTML5 includes several changes. But if you want to start using it, you also need
    to know what is not available-more. The frame tags–frameset, frame, noframes–have
    been eliminated, but the iframe is still available. Most presentation tags have
    been eliminated–as basefont, big, center, font, s, strike, tt, u–and although
    b (bold) and i (italic) are still included, some debate continues over that decision.


    Also, unlike XHTML, stand-alone tags such as `<img>` and `<br>` will not have
    to be self-closing. So, rather than using `<br />`, it’s back to just `<br>`.
    But really, isn’t that a lot simpler?


    # What’s New in HTML?


    HTML5 makes important structural changes to Web pages. For example, you can specify
    common elements such as headers, footers, and asides. In addition, HTML5 introduces
    features natively (that, is features built into the browser) that used to require
    plug-ins and/or scripting in the form of new elements and APIs:


    +   * The Canvas element allows scriptable bitmap editing.


    +   * Document editing permits users to edit content directly in Web pages.


    +   * Web forms self validate and include more input types.


    +   * Drag-and-drop allows the manipulation of elements without scripting.


    +   * Audio and Video Timed media playbacks enable native control of media files
    without plug-ins.


    +   * New structural elements remove the burden of using `<div>` tags with classes
    and IDs to create common elements such as headers and footers.


    HTML5 is where Web design and development happens. Many browsers have already
    starting some of its features, even though it’ not a complete standard, yet. That
    said, one notable (and frequent) support curmudge is Internet Explorer. However,
    Microsoft has pledged to introduce HTML5 support in IE version 9.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# How Does HTML5 Structure Work?


    I''ll let you in on a little secret: You can start using the HTML5 syntax today
    to structure your Web Pages and use it with CSS3 (or older versions of CSS). To
    understand how, let''s take a look at how HTML5 works.


    One of the most significant changes in HTML5 is the addition of structural elements
    that will greatly enhance the semantic philosophy behind Web markup. Most of the
    new structural tags are self-explanatory, but a few require some elaboration:


    +   - `<header>` can be used for page headers, section headers, article headers,
    or an aside header.

    - `<nav>` can be included independently or as part of the header and/or footer.

    - `<section>` defines the main parts of a page, generally one that includes articles.

    - `<article>` is an individual blog entry or blog entry abstract.

    - `<figure>` is used to contain images, audio, and video that are embedded in
    the page.

    - `<dialog>` replaces the `<dl>` element to contain conversation transcripts.

    - `<aside>` is used for support content on a page, such as related links, secondary
    navigation, and, of course, ads.

    - `<footer>` is similar to the header and can be placed at the bottom of other
    elements.


    Unfortunately, not all browsers are equipped to understand HTML5 without a little
    help.


    ![](img/9cd61ac1d4015ed5688d0c411434a660_49_0.png)'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# 2.1 HTML5page.html—This shows typical HTML5 page that is structured to use
    a header, navigation, article, and footer for the layout grid.


    # Using HTML5 Structure Now


    ```

    <!DOCTYPE html>

    <html lang="en-US">

    <head>

    <meta charset="UTF-8">

    <title>HTML5</title>

    </head>

    <body>

    <header>

    <nav></nav>

    </header>

    <section>

    <article>

    <header></header>

    <figure>

    <footer></footer>

    </article>

    <dialog></dialog>

    </section>

    <aside></aside>

    <footer></footer>

    </body>

    </html>

    ```


    HTML5 is not implemented on most current browsers (and it may be some time before
    it is), but you can follow some steps now to prepare for the future.


    Although CSS can be applied to any version of HTML in use today—including XHTML
    1 and HTML 4.01–I’ll be using HTML5 throughout this book. This book is by no means
    an exhaustive resource of HTML 5. However, I want to show you how to set up the
    Web document that I''ll reference in future chapters.


    # Setting up a basic HTML5 document:


    +   1. Add the HTML5 doctype (Table 2.4). Notice the new !DOCTYPE HTML is much
    simpler than the complex and hard-to-decipher HTML and XHTML doctypes in use today
    (Code 2.1). It simply tells the browser to use HTML.


    ```

    <!DOCTYPE html>

    ```


    continues on next page


    | Markup Language | Doctype Code |

    |---|---|

    | HTML 4.01 Loose | <!DOCTYPE HTML PUBLIC "-//W3C/DTD HTML 4.01 Transitional//EN"
    "http://www.w3.org/TR/html4/loose.dtd" |

    | HTML 4.01 Strict | <!DOCTYPE HTML PUBLIC "-//W3C/DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd"
    |

    | HTML 4.01 Frameset | <!DOCTYPE HTML PUBLIC "-//W3C/DTD HTML 4.01 Frameset//EN"
    "http://www.w3.org/TR/html4/frameset.dtd" |

    | XHTML1 Transitional | <!DOCTYPE HTML PUBLIC "-//W3C/DTD HTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/xhtml1-transitional.dtd" |

    | XHTML1 Strict | <!DOCTYPE HTML PUBLIC "-//W3C/DTD HTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/xhtml1-strict.dtd"
    |

    | XHTML1 Frameset | <!DOCTYPE HTML PUBLIC "-//W3C/DTD HTML 1.0 Frameset//EN" "http://www.w3.org/TR/xhtml1/xhtml1-frameset.dtd"
    |

    | HTML5/XHTML5 | <!DOCTYPE html> |'
  merge: -1
  img_proc: true
- pgno: 51
  md: '2. Add the HTML tag, including the intended language and the language direction
    (generally ltr for left-to-right text).

    `<html dir="ltr" lang="en-US">...

    `</html>`


    3. Add the head to your document, which is where you will specify information
    about this document, including the title and the character set used by the text.
    I recommend using UTF-8 for best results.

    `<head>...</head>


    4. Add the body to your document. This is where all the content to be displayed
    is added. I recommend giving every body element in your site at least one unique
    class name and others to identify its location in the site. By doing so, you can
    add styles on a per-page and per-section basis without including multiple CSS
    files.

    `<body class="section Name pageName">...</body>`


    5. Add the header tag for your page. This is not the the head tag in step 3. This
    is where you put all the content that is displayed in your Web pages header. You
    can also include the navigation here or include it separately, depending on your
    design needs.

    `<header>...</header>


    6. Add the navigation tag, and include links to the top-level pages in your site.

    `<nav>...</nav>`'
  merge: -1
