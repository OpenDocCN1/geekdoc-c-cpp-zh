- pgno: 293
  md: '3. Each corner''s border radius can be set independently without specifying
    the other radii.


    +   - -webkit-border-top-right-radius: 20px;


    +   - -moz-border-radius-topright: 20px;


    border-top-right-radius: 20px;


    Mozilla has a slightly different syntax from Webkit and W3C (using by Opera),
    but the equivalents are shown in Table 10.16.


    4. For -moz and standard CSS3 instances (but not -webkit), you can include up
    to four values.


    +   - -webkit-border-top-left-radius: 20px;


    +   - -webkit-border-bottom-radius: 20px;


    +   - -moz-border-radius: 20px 0 0 20px;


    border-radius: 20px 0 0 20px;


    Separate each value by a space as a shortcut for setting the border radius:


    +   - One value sets all four-corner radii the same.


    +   - Two values set the radius for the top-left/bottom-right and bottom-left/top-right
    corners.


    +   - Three values set the corner radius for the top left, bottom left/top right
    (the same), and the bottom right corners.


    +   - Four values set the radius for each corner in this order: top left, top
    right, bottom right, and bottom left.


    With Webkit you must corners separately because it treats a second value as the
    second point in the radius to create elliptical (rather than circular) corners.


    # TABLE 10.16 Border-Radius Equivalents


    | CSS3 | Mozilla | Webkit |

    | --- | --- | --- |

    | border-radius | -moz-border-radius | -webkit-border-radius |

    | border-top-radius | -moz-border-radius-topright | -webkit-border-top-radius
    |

    | border-bottom-radius | -moz-border-radius-bottomright | -webkit-border-bottom-radius
    |

    | border-left-radius | -moz-border-radius-bottomleft | -webkit-border-left-radius
    |

    | border-top-left | -moz-border-radius-topleft | -webkit-border-top-radius |


    > TIP Although border-radius does not alias the curves to make them smooth, the
    results can be hit or miss. I recommend keeping the contrast between your lines
    and background low to improve the curve appearance.


    > TIP Curved borders will not clip the content in the box. So, an image that might
    normally be in the corner of the box will still be, sticking out into the curve.'
