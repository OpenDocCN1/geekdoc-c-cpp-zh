- pgno: 236
  md: '# # List and Table Properties


    Most of the CSS properties discussed in this book can be applied to tables and
    lists. However, CSS also includes a few unique properties specifically for tables
    and lists. The specifications of table and list properties have not changed from
    CSS2 to CSS3, although Internet Explorer has improved its implementation over
    the standards in IE8.


    Although tables should never be used for page layout, as they once were, they
    are still used to layout tabular data. Lists, on the other hand, are not only
    used to create lists (obviously), but have also become the standard way to structure
    Web site navigation.


    # In This Chapter


    +   - Setting the Bullet Style | 216

    - Creating Your Own Bullets | 217

    - Setting Bullet Positions | 218

    - Setting Multiple List Styles | 219

    - Setting the Table Layout | 220

    - Setting the Space Between Table Cells | 222

    - Collapsing Borders Between Table Cells | 223

    - Dealing with Empty Table Cells | 225

    - Setting the Position of a Table Caption | 226

    - Putting It All Together | 227'
  merge: -1
  img_proc: true
