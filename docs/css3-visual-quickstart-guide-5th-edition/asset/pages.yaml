- pgno: 113
  md: "# To set a style for a specific language:\n\n+   1. Style an element based\
    \ on its language code. Type the selector (HTML, class, or ID) of the element\
    \ you style, a colon (:), .lang, and enter the code for the language you are defining\
    \ within parentheses (Code 4.9).\n\n```\np:lang(fr)\n```\n\n+   2. The element\
    \ is styled if it has a matching language code. Set up your tag with the language\
    \ attributes as necessary.\n\n```\n<p lang=\"fr\">...</p>\n```\n\nIf the indicated\
    \ style has its language attribute to the same value that indicated in parentheses\
    \ in step 1, the style is applied.\n\nCode 4.9 Styles are set to turn paragraphs\
    \ red if they are in French (fr).\n\n```\n<!-- HTML5 -->\n<!DOCTYPE html>\n<html\
    \ lang=\"en\">\n<head>\n  <meta http-equiv=\"content\" charset=\"UTF-8\" />\n\
    \  <title>Alice's Adventure in Wonderland</title>\n  <style type=\"text/css\"\
    \ media=\"all\">\n    p:lang(fr) {\n      color: red;\n      font-style: italic;\n\
    \    }\n  </style>\n</head>\n<body>\n  <p>It sounded an excellent plan...</p>\n\
    \  <p lang=\"fr\">On aurait dit un excellent plan,.../</p>\n</body>\n</html>\n\
    ```\n\n> TIP You can use any string as the language code, as long as it matches\
    \ the value in the HTML. However, the W3C recommends using the codes from RFC\
    \ 3066 or its successor. For more on language tags, visit w3.org/International/articles/language-tags.\n\
    \n> TIP Language styles can go beyond simple colors and fonts. Many languages\
    \ have specific symbols for quotes and punctuation, which CSS can add. In Chapter\
    \ 9, you will find information on how to style quotes for a particular language.\n\
    \nIt sounded an excellent plan, sans doute, et fort prompement et simplement organisé;\
