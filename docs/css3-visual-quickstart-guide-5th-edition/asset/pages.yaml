- pgno: 223
  md: '# # Setting Background Image


    Beyond the ability to set an image as the background of an element, CSS includes
    several properties that offer you great flexibility in the placement of the image:


    +   - Repeat–Sets whether the image tiles only once or repeat horizontally or
    vertically.


    +   - Attachment–Sets whether the image scrolls with the rest of the page or stays
    in one place.


    +   - Position–Moves the image to the left and down (positive values) or to the
    right and up (negative values) from the top-left corner of the element.


    +   - NEW CSS3 ★ Size–Sets the width and height of the image within the element’s
    background as an absolute length, percentage, or the keywords **cover**, **contain**,
    or **auto** (which maintains the aspect ratio).


    +   - NEW CSS3 ★ Clip–Sets whether the background fits to the border or just within
    the content area.


    +   - NEW CSS3 ★ Origin–Sets the position of the background relative to the border,
    padding, or content. This is especially useful for setting the background of inline
    elements that break across multiple lines.


    +   - NEW CSS3 ★ Multiple background images–Although not a specific property,
    CSS now allows you to layer multiple background images using a comma-separated
    list.


    ![](img/9cd61ac1d4015ed5688d0c411434a660_223_0.png)


    ![](img/9cd61ac1d4015ed5688d0c411434a660_223_1.png)


    Here we were a queer racing party that assembled on the band-lots with strange
    flags. The great chorus of clam wailed, as they came, and they made a confusion
    about; and a whole new crowd of demure creatures came up and down, and all said,
    ''I beg you, that you must let us pass,'' and so on to the Alice, but Alice had
    no need to be there. Alice, seen as a person of authority among them, called out,
    ''Down, all off and stop!''


    In the end, they agreed, moving off again, hoping that Alice would follow, but
    then seeing her go—


    > Code 7 when applied to code 7: Adding background images makes the design come
    alive, giving it texture and structure. Notice the White Rabbit hiding behind
    the capital T Just like Alice, he has been shrunk to best fit the area.


    ![](img/9cd61ac1d4015ed5688d0c411434a660_223_2.png)


    ![](img/9cd61ac1d4015ed5688d0c411434a660_223_3.png)


    ![](img/9cd61ac1d4015ed5688d0c411434a660_223_4.png)


    ![](img/9cd61ac1d4015ed5688d0c411434a660_223_5.png)


    ![](img/9cd61ac1d4015ed5688d0c411434a660_223_6.png)


    ![](img/9cd61ac1d4015ed5688d0c411434a660_223_7.png)


    All of the images that go into making this design.'
  merge: -1
