- pgno: 25
  md: '# # What Is a Style?


    Word processors allow writers to change text appearance word by word or paragraph
    by paragraph, as well as in an entire document by means of styles.


    Styles combine multiple properties—such as weight, font family, italicization,
    color, and size—that you want to apply to similar text types—titles, headers,
    captions, and so on—and group these properties under a common name.


    Suppose you want all the section titles in your document to be bold, Georgia font,
    italic, red, and 16 point. You could assign all those attributes to a style called
    Chapter Title


    Whenever you type a chapter title, you only need to use the Chapter Title style,
    and all those attributes are applied to the text in one fell. Even better, if
    you later decide that you really want all of those titles to be 18 point, you
    can just change the definition of Section Title. The word processor automatically
    changes the appearance of all the text marked with that style throughout the document.


    ![](img/9cd61ac1d4015ed5688d0c411434a660_25_0.png)


    Styles applied Style name


    Styles being applied to section titles in a word-processing page.


    Chapter 1'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# What Are Cascading Style Sheets?


    Cascading Style Sheets bring the same style-setting convenience to the Web that
    you have in most word processors. You can set the CSS in one central location
    to affect the appearance of specific HTML tags, on a single Web page, or across
    an entire Web site.


    Although CSS works with HTML, it is not HTML. Rather, CSS is a stylesheet language
    that enhances the abilities of HTML (a mark-up language) by allowing you to redefine
    the way that existing tags display their content.


    For example, the h1 header tag container, `<h1>...</h1>`, allows you to apply
    styles to a section and turn it into a header. But the exact display of the header
    is determined by the viewer''s browser, not by the HTML code.


    Using CSS, you can change the nature of the header tag so that it will be displayed
    how you want it to look—for example, bold, Times font, Italic, and 14 points.
    As with word processors, you could choose to change the styling of the `<h1>`
    tag (for example, change the text size to 18pt) which would automatically change
    the text size of all h1 elements on the affected Web page.


    +   Styles being applied to an HTML tag.


    ![](img/9cd61ac1d4015ed5688d0c411434a660_26_0.png)'
  merge: -1
  img_proc: true
