    \ 10 |\n→ box-properties.css ***/\n\nnav.global\n  display: block; \n\nnav.global\
    \ li\n  display: inline; \n\nfigure {\n  display: block; \n\nfigcaption {\n  display:block;\
    \ \n\naside {\n  display: block; }\n```\n\n+   **inherit** uses the display value\
    \ set or implicit for the element's parent.\n\n+   **none** causes this element\
    \ not to display in CSS browsers. It will appear as though the content doesn't\
    \ exist on the page.\n\n![](img/9cd61ac1d4015ed5688d0c411434a660_272_0.png)\n\n\
    **Code 10.2 applied to Code 10.1:** Notice that the previously block level list\
