  md: '# User Inline Media Importance Specificity Order Parent Inherited low


    # Determining the Cascade Order


    Within a single Web page, style sheets may be linked, imported, or embedded. Styles
    may also be declined in the HTML.


    In addition, many browsers allow visitors to have their own style sheets that
    can override yours. It''s guaranteed, of course, that simultaneous style sheets
    from two or more sources will have conflicting declarations. Who comes on top?


    The cascade order refers to the way styles begin at the top of the page and, as
    they descend, collect and replace each other as they are inherited. The general
    rule of thumb is that the last style defined is the one that is used.


    However, at times, two or more styles will conflict. Use the following procedure
    to determine which style will come out on top and be applied to a given element.


    > The cascade order from most important to least important.


    # To determine the cascade-value for an element:


    Collect all styles that will be applied to the element. Find all the inherent,
    applied, and inherited styles that will be applied to the element, and then use
    the following criteria to determine which styles are applied in the cascade order,
    with the criteria at the top being most important A.


    +   1. User styles


    Most Web browsers allow users to specify their own default style sheet. In principle,
    these always have precedence over other styles.


    continues on next page'
  merge: -1
  img_proc: true
- pgno: 137
  md: '+   2. Inline styles is inline (see Chapter 3), it is always applied regardless
    of all other factors. That''s why you should never use them in your final HTML
    code.


    +   3. Media type

    Obviously, if the media type is set for a style and element that is not being
    displayed in that media type, the style will not be used.


    +   4. Importance

    Including !important with a declaration gives it top billing when displayed. (See
    “Making a Declaration !important” in this chapter.)

    Many browsers let users define their own style sheets for use by the browser.
    If both the page author and the visitor have included !important in their declarations,
    the user''s declaration wins.

    In theory, an author''s style sheets override a visitor''s style sheets unless
    the visitor uses the !important value. In practice, however, most browsers favor
    a user''s style sheet when determining which declarations are used for a tag.'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# 5. Specificity


    The more contextually specific a rule is, the higher its cascade priority. So
    the more HTML, class, and ID selectors a particular rule has, the more important
    it is. In determining this priority, ID selectors count as 100, classes count
    as 10, and HTML selectors are worth only 1. Thus.


    ```

    #copy p b { color: red; }

    ```


    b { color : lime; }


    is only worth 1. So, the first rule would have higher specificity and the color
    would be red.


    This priority setting may seem a bit silly at first, but it allows context-sensitive
    and ID rules to carry more weight, ensuring that they will be used.


    # 6. Order


    If the conflicting declarations applied to an element are equal at this point,
    CSS gives priority to the last rule listed, in order. Remember that inline styles
    always win.


    # 7. Parent inherited styles


    These styles are inherited from the parent.


    # 8. Browser default styles


    These styles are applied by the browser and are the least important.'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# Putting It All Together


    +   1. Using the HTML code you created in Chapter 3, style all descendants of
    the paragraph tag to bold. This requires using the universal selector.


    +   2. Style all paragraph siblings. Turn all paragraphs that follow another paragraph
    to gray.


    +   3. Add hypertex links to your page, and then use the link pseudo-classes to
    style them. Remember to style all four link states.


    +   4. Style the first letter and first line of text of the first paragraph in
    your page. Start by styling the first line of all paragraphs and use pseudo-classes
    to focus on the first paragraph.


    +   5. Style images with an alt tag value with a black rule and images that do
    not have a value with a red rule. This is useful for highlighting images you need
    to add alt values to.


    +   6. Style your page for print by hiding navigation and using a white-ground
    and dark text. You want to consider media other than screen for your designs.


    +   7. Play around with adding more styles and then changing the order to see
    how the order affects which styles are applied. Pay careful attention to the cascade
    order and how specificity affects that.


    +   8. Play around with adding different styles to see how it affects styles are
    applied. Remember, the important property is powerful and should only be used
    to help you style your page while working. The final design should be able to
    work without it.'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# Font Properties


    Typography is one of your most powerful tools for presenting organized, clean-looking
    documents. It''s also the best tool for presenting chaotic, grungy-looking documents.


    The fonts you use go a long way toward getting your message across in the way
    you want—whether that message is classical, grunge, or anything in between. I
    often say that fonts are to type what voice is to speak. Typeface, font weight,
    italic, and other typographic effects not only help designers to guide a visitor''s
    eye around the page, but they also add a layer of meaning.


    CSS gives you the ability to control the appearance of fonts, also known as *letterforms*,
    in your Web pages. You can set the font family, boldface, and italic attributes
    with HTML tags. CSS3 refines the ability to download font sizes available with
    HTML font files (called **Webfonts**) from your server and apply them to your
    Web page, giving you the power to use virtually any font you want in your designs.


    # In This Chapter


    +   - Understanding Typography on the Web 119

    - Setting a Font-Stack 124

    - Finding Fonts 126

    - Setting the Font Size 133

    - NEW IN CSS3: Adjusting Font Size for Understudy Italic ★ 136

    - Making Text Italic 139

    - Setting Bold, Bolder, Boldest 142

    - Creating Small Caps 144

    - Setting Multiple Font Values 146

    - Putting It All Together 150'
  merge: -1
  img_proc: true
