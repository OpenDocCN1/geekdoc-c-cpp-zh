- pgno: 259
  md: "# Teaching the Browser to Count\n\nBrowsers can automatically create sequentially\
    \ listed lists, starting at 1 and counting by ones. You will explore this later\
    \ in the chapter. However, if you need to start numbering from 6 instead of 1!\
    \ Or, if you need to create two sequential lists that are nested inside each other?\
    \ CSS allows you to set up multiple counter lists using the content property (previous\
    \ section). The counter-reset property (Table 9.4) is used to set the initial\
    \ value for the count, and the counter-increment property (Table 9.5) is used\
    \ to increase the counter by a specific value.\n\nTABLE 9.4 Counter-Reset Values\n\
    | Value | Compatibility |\n| --- | --- |\n| <counterName> | IE8, FF1, S1, CSS2\
    \ |\n| <num> | IE8, FF1, S1, CSS2 |\n| none | IE8, FF1, S1, CSS2 |\n| inherit\
    \ | IE8, FF1, S1, CSS2 |\n\nTABLE 9.5 Counter-Increment Values\n| Value | Compatibility\
    \ |\n| --- | --- |\n| <counterName> | IE8, FF1, S1, CSS2 |\n| <num> | IE8, FF1,\
    \ S1, CSS2 |\n| none | IE8, FF1, S1, CSS2 |\n| inherit | IE8, FF1, S1, CSS2 |\n\
    \nTo use a counter:\n\n+   1. Set up the parent element. Set up a CSS rule for\
    \ the selector that will be the parent element for your numbered list (Code 9.4).\
    \ This can be the o1 (ordered list) tag.\n.top {...}\n2. Add the counter-reset\
    \ property to your declaration block.\ncounter-reset: counterName 0;\nType counter-reset:\
    \ a, colon (:), and then the name of the counter you are defining (which can be\
    \ any name you want). Then insert a space and the number you want to start the\
    \ list.\n\n```\nCode 9.4 ui-generatedcontent-properties\ncss—The table of contents\
    \ shows chapters before and after counter 4 A, so the continued list needs to\
    \ skip 0.\n*** CSS V05\n* ui-generatedcontent-properties.css ***\n.toc { margin:\
