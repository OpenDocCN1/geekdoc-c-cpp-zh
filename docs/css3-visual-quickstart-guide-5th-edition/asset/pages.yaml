  md: '# NEW CSS3: Adding a Text Drop Shadow ★


    The drop shadow is a time-honored method for adding depth and texture to two-dimensional
    designs. Most browsers support the text-shadow property part of CSS (Table 6.5),
    which allows you to define the color, offset (x and y), spread, and blur for any
    text drop shadow. Although this property will not currently work in other browsers,
    neither will it with.


    | TABLE 6.5 Text-Shadow Values |

    | Value | Compatibility |

    | --- | --- |

    | <color> | FF1.9, S1, C2, O03 |

    | <x-offset> | FF1.9, S1, C2, O03 |

    | <y-offset> | FF1.9, S1, C2, O03 |

    | <blur> | FF1.9, S1, C2, O03 |

    | none | FF1.9, S1, C2, O03 |


    To define the text shadow:


    ![](img/9cd61ac1d4015ed5688d0c411434a660_183_0.png)


    +   1. Add the text-shadow property to your CSS rule. Type text-shadow in the
    CSS declaration list, followed by a colon (: Code 6.5).


    ```

    text-shadow:

    ```


    +   2. Specify the x, y offset. Type a space followed by two positive or negative
    length values separated by a space.


    ```

    2px 2px

    ```


    The first value is the vertical distance to offset the shadow (positive is down,
    negative is up). The second value is the horizontal offset (positive is right;
    negative is left).


    +   3. Specify the amount of blur. Type a space and then a length value for the
    amount of blur to apply to the shadow. All negative values will be treated as
    0.


    ```

    2px

    ```


    > Code 6.6 applied to code 6.1: Although you may need to compare the altered title
    with the previous screen captures to notice the difference, the title now looks
    slightly recessed on the page, as it were embossed. And the chapter title now
    really hops off the page.


    160 Chapter 6'
  merge: -1
  img_proc: true
