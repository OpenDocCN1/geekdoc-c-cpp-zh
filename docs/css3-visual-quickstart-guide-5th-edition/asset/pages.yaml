    Alice was getting very tired of sitting on the bank, and beginning to do sleepy,
    that if she had gone into the rabbit hole she was staring at; there were no pictures
    or conversations going on, and what was the use of a book, without pictures or
    conversations?


    She was also curious as to how (as well as she could, for the hot made her very
    sleepy) and whether the pleasure of making a strange wish would be worth the trouble
    of going after it, especially when the White Rabbit with pink eyes ran right by
    her.


    There was no time to thank or slip, nor was there much of the way to catch the
    Rabbit to say goodbye; but she fell down down, down, down, wondering how long
    she would reach the bottom of the well.


    ![](img/9cd61ac1d4015ed5688d0c411434a660_128_1.png)


