  md: "# # Adding Comments to CSS\n\nComments allow you to add important notes to\
    \ your code, as a reminder to-yourself or others. A comment does not affect code;\
    \ comments only add notes or give guidance to those viewing your code. You can\
    \ include comments in <style> tags or in an external CSS file.\n\nTo include comments\
    \ in a style sheet:\n\n+   1. Add an opening comment mark. To open a comment area\
