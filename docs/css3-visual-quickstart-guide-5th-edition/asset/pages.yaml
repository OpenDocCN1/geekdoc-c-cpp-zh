- pgno: 121
  md: '3. Set styles if a string is in a space-separated list of values. To set styles
    based on an attribute''s value that is within a list of space-separated values
    (for example, a particular word in a sentence), type the selector you want to
    style (HTML, class, or ID), a left bracket ([), the name of the attribute you
    want to check for, a tilde (-), an equals sign (=), the value you are testing
    for in quotes (''...''), and a right bracket (]).


    ```

    a[title="email"] {..}

    ```


    This will assign the styles you declare only if the tag has the attribute assigned
    to it with a value that contains the string as part of a space-separated list.
    Generally, this means that it is a word in a sentence. Partial words do not count.
    So in this example, testing for ''mail'' would not work.


    4. Sets the style if the string is in a hyphenated list of values assigned to
    the property. To set styles based on an attribute''s value being the first in
    a list separated by commas, type the selector you want to style (HTML, class,
    or ID), a left bracket ([), the name of the attribute you want to check for, a
    bar (|), an equals sign (=), the value you are testing for in quotes (''...''),
    and a right bracket (]).


    ```

    a[title="resume"]

    ```


    This will assign the styles you declare only if the tag has this attribute assigned
    to it with a value that contains the string at the beginning of a hyphen-separated
    list. Generally, this is used for styling languages as an alternative to using
    the language pseudo-class.'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# 5. NEW CSS3 ★: Set styles if a string is the value''s prefix. To set styles
    based on the value at the beginning of an attribute, type the selector you want
    to style (HTML, class, or ID), a left bracket ([), the name of the attribute you
    want to check for, a caret (*), an equals sign (=), the value you are testing
    for in quotes (''...''), and a right bracket (]).


    ```

    a[href="http://"]

    ```


    This will assign the styles you declare only if the value string occurs exactly
    as it is in the quotes at the beginning of the attribute value.


    # 6. NEW CSS3 ★: Set styles if a string is the property value''s suffix. To set
    styles based on an attribute''s value being the first in a hyphen-separated list,
    type the selector you want to style (HTML, class, or ID), a left bracket ([),
    the name of the attribute you want to check for, a dollar sign ($), an equals
    sign (=), the value you are testing for in quotes (''...''), and a right bracket
    (]).


    ```

    a[href="$.info"]

    ```


    This will assign the styles you declare only if the value occurs at the end of
    the attribute''s value.


    # 7 Set styles if a string is anywhere in the property value. To set styles based
    on an attribute''s value being the first in a hyphen-separated list, type the
    selector you want to style (HTML, class, or ID), a left bracket ([), the name
    of the attribute you want to check for, an asterisk (*), an equals sign (=), the
    value you are testing for in quotes (''...''), and a right bracket (]).


    ```

    a[href="speakinginstyles"]

    ```


    This will assign the styles you declare if the value occurs anywhere in the attribute''s
    value.


    Values are case sensitive. In other words, ''Alice'' and ''alice'' are two different
    values.'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# NEW IN CSS3:

    Querying the Media ★


    | TABLE 4.7 Media Values |

    | Value | Intended for |

    | --- | --- |

    | screen | Computer displays |

    | tty | Teletypes, computer terminals, and older portable devices |

    | tv | Television displays |

    | projection | Projectors |

    | handheld | Portable phones and PDAs |

    | print | Paper |

    | braille | Braille tactile readers |

    | speech | Speech synthesizers |

    | all | All devices |


    In Chapter 3 you learned how to specify style sheets for a particular media type,
    allowing you to set styles depending on whether the HTML is output to a screen,
    print, TV, or a handheld or other device (Table 4.7). CSS adds an important new
    capability that allows you to set styles based on common interface properties
    such as width, height, aspect ratio, and number of available colors.


    Media queries and the @media rule can be used to tailor your page, not just to
    a generic device type but to the specific device your visitor is. This includes
    sizing for print, for mobile devices, or to best fit the size of the open browser
    window.


    ```

    @media=\nscreen

    and (min-width: 600px)

    and (max-width: 980px)

    ```


    # Media queries


    If you want to know the current size of the browser window, why not just ask the
    browser? JavaScript gives you the ability to do this, but it''s a cumbersome way
    to get some basic facts about the Webbed environment your design is trying to
    fit into.


    Media queries provide you with several common media properties that you can test
    and then delivers the style sheet that best suits your environment.


    Although media queries have many properproperties (Table 4.8), they come in five
    basic flavors:


    +   - Aspect-ratio looks for the relative dimensions of the device expressed as
    a ratio: 16:9, for example.


    +   - Width and height looks for the dimensions of the display area. These can
    also be expressed as maximum values.


    continues on page 10


    > The general syntax for media queries.'
  merge: -1
  img_proc: true
