- pgno: 279
  md: '+   scroll sets scrollbars around the visible area to allow the visitor to
    scroll through the element''s content. When you set this value, space will be
    reserved for the scrollbars, even if they are not needed


    +   auto allows the browser to decide whether scrollbars need to be displayed


    Generally, auto is preferred for overflow because it will show the scrollbars
    only as needed and hide the scrollbar chrome when there is nothing to scroll.


    The overflow property is also used to define how clipping overflow is treated.


    ![](img/9cd61ac1d4015ed5688d0c411434a660_279_0.png)


    +   scroll places both horizontal and vertical scrollbars to access additional
    content in the element. However, placeholder scrollbars are added even if they
    are not needed


    ![](img/9cd61ac1d4015ed5688d0c411434a660_279_1.png)


    +   Auto is generally the best option because it displays scrollbars only as needed.


    # Coming Soon: Text Overflow


    Although being able to set box overflow is useful, often it is the text that is
    overflowing and needs a clear truncation. The most common way to do this is by
    using the three dots known as an ellipsis (...). CSS3 will include new properties--text-overflow,
    text-overflow-mode, and text-overflow-ellipses--that will allow you to clip or
    add ellipses to text that is too long to fit the space.'
  merge: -1
  img_proc: true
- pgno: 280
  md: '# Floating Elements in the Window


    10.5 ui-box-properties.css—Applied to Code 101, the float properties will cause
    the text to wrap around the figure and the article and aside elements to float
    side by side if wide enough to accommodate them


    In addition to precisely positioning elements within the document, CSS also allows
    you to set how an element interacts with other elements by floating.


    *** CSS3 V0 | Chapter 10 | - box-properties.css ***


    Using the CSS float property, you flow text content or float block elements next
    to each other to create columns.


    ```

    nav.global {

    display: block;}

    ```


    ```

    nav.global li {

    display: inline;}

    ```


    # To float an element:


    ```

    article {

    max-width: 980px;

    min-width: 660px;

    float: left;}

    ```


    +   1. Start your definition by typing the float property name, followed by a
    colon (: Code 10.5).


    ```

    figure {

    display: block;

    width: 300px;

    float: left;}

    ```


    float:


    ```

    figcaption {

    display:block;}

    ```


    continues on next page


    ```

    aside {

    display: block;

    width: 200px;

    height: 400px;

    overflow: auto;

    float: right;}

    ```


    ![](img/9cd61ac1d4015ed5688d0c411434a660_280_0.png)


    ```

    footer {

    width: 100%;

    clear: both;}

    ```


    > 10.5 applied to The text of the chapter is not wrapping around the figure. Notice
    that the aside, "About Lewis Carroll," is now a column to the right of the article.
    Unfortunately, the footer is also there; but don''t worry, you can fix that.'
  merge: -1
  img_proc: true
- pgno: 281
  md: '2. Type a keyword to tell the browser on which side of the screen the element
    should float.


    right;

    Choose one of the following keywords (Table 10.6):


    +   * right aligns this element to the right of other elements, causing subsequent
    elements to wrap horizontally to the left of this element.


    +   * left aligns this element to the left of other elements, causing subsequent
    elements to wrap horizontally to the right of this element.


    +   * none overrides floating for this element.


    # TABLE 10.6 Float Values


    | Value | Compatibility |

    |---||

    | left | IE4, FF1, S1, O3.5, CSS1 |

    | right | IE4, FF1, S1, O3.5, CSS1 |

    | none | IE4, FF1, S1, O3.5, CSS1 |


    # TABLE 10.7 Clear Values


    | Value | Compatibility |

    |---||

    | left | IE4, FF1, S1, O3.5, CSS1 |

    | right | IE4, FF1, S1, O3.5, CSS1 |

    | both | IE4, FF1, S1, O3.5, CSS1 |


    > TIP Floating elements within other elements can often have odd consequences
    if both the child and parent are block elements. The child tends to ignore the
    height of the parent, which can have undesirable consequences. The child element
    will appear to begin in the parent element but will extend beyond the bottom of
    the parent element. The fix for this is discussed in Chapter 13 "Fixing the Float."


    > TIP In Chapter 13, you''ll learn how to use the float property to set up separate
    columns to replace a traditional table-based layout.


    # Clearing a floated element


    Sometimes, you may find it necessary to override the float property to prevent
    elements that after a floating element from wrapping. Similar to the clear attribute
    of the HTML break tag, the CSS clear property allows you to specify whether you
    want to deny floating around the left, right, or both sides of an element (Table
    10.7).'
  merge: -1
  img_proc: true
