- pgno: 216
  md: '+   Content background—Often, you will use a different color for the background
    directly around the content of the page, allowing the body background color to
    absorb extra horizontal space in the browser window.


    +   Border/Rule—You may want to use contrasting colors around the content areas,
    headers, navigation blocks, lists, and tables, or use different chunks of content.
    Choose a color that contrasts with the area that the lines are meant to separate.


    +   Header—You may choose not to change the background color for section headers,
    but always make sure that the text clearly contrasts with the background colors
    you choose.


    +   Copy—Your copy (generally sentences or paragraphs of text) should have the
    highest contrast with the background to maximize legibility.


    +   Link/Navigation—You may choose different colors for your site navigation and
    for links in the copy, but these colors should be easily discernable from other
    text while still contrasting with the background.


    +   List/Table—You may choose different background colors behind lists and tables
    or even alternating rows, called zebra striping, to improve readability.


    +   Form—You can specify the border, foreground, and background colors of many
    form elements to give them a more distinctive look for your site, apart from their
    default appearance. However, be careful not to customize them so much that the
    visitor does not know what they are.'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# Color wheel basics


    A color wheel is a disc or circle that shows the spectrum of color values, providing
    you with a quick overview of all the possibilities from red, orange, and yellow
    to green, blue, indigo, and violet, and back to red again. Some color wheels also
    allow you to view brightness (dark to light) and saturation (full color tone to
    gray) levels.


    You''re probably familiar with color wheels, but if you want, check out the example
    at: colorschemedesigner.com.


    When you get down to it, color is a matter of preference. Colors that I think
    look great together may make my wife gag (and usually result in changing my outfit).
    To be safe, you can count on a single color (monochrome) or one of the following
    color-combination schemes as (more or less) fail-safe:


    +   Monochrome—A single color with different brightnesses or saturations for contrast.


    +   Complementary—Two colors from opposite sides of the color wheel (180 degrees),
    providing the highest contrast.


    +   Triad—Three colors and their tones with one primary and two secondary colors
    that are at equal angles in the color wheel, 120 degrees to 180 degrees from the
    primary.


    +   Tetrad—Four colors that include one primary color, one secondary color (in
    direct contrast to the primary color), and two colors that are the same angle
    from the primary or secondary color, from 0 to 90 degrees.'
  merge: -1
  img_proc: true
- pgno: 218
  md: '# Color and Accessibility


    Beyond attractive and compelling design, another critical consideration with color
    is accessibility for people who are visually impaired. The most important considerations
    are to provide enough contrast between foreground and background colors so that
    the information is readable and to make sure that color is not critical for understanding
    information. For example, if you are using color for links, also set off those
    links using some other formatting such as underlining or bold.


    For more details on color and accessibility, see section 9 of the W3C''s white
    paper ''CSS Techniques for Web Content Accessibility Guidelines'' at w3.org/TR/WCAG10-CSS-TECHS/#style-colors.


    +   - Analogic—Three colors and their tones with one primary color and secondary
    colors that are the same angle from the primary color, from 0 degrees to 60 degrees.


    All of these color schemes allow you to choose the basic hue and then use brightnesses/or
    saturations of the colors to add additional shades to your palette.


    # Online color scheme tools


    Not sure to start planning your color scheme? Here are some excellent online tools
    that you can use:


    +   - Build a palette—Adobe''s Kuler (kuler adobe.com) provides an excellent tool
    for comparing colors side by side in an interactive environment.


    +   - Color Wheel Selector—Explore all of the color wheel schemes using Color-Jack''s
    tool (colorjack.com/sphere).


    +   - Color palettes from photographs or other images—If you are using graphics
    or photography with a particular color scheme in them, the Degrave.com Color Palette
    Generator (degraeve.com/color-palette) will analyze the image and produce a color
    palette based on the colors in the image.'
  merge: -1
  img_proc: true
- pgno: 219
  md: "# # Setting Text Color\n\nThe color property is used to set the text color\
    \ (sometimes called the foreground color) of an element (Table 7.5). This color\
    \ will be inherited by all of the element children (see Chapter 4), you only need\
    \ to set it in the body element and then provide overrides as needed. For example,\
    \ if you set the color to gray in the `<body>`, then all text on the page will\
    \ be gray. If you then set the `<p>` element to red, all paragraph text and any\
    \ elements in it will be red, overriding the gray.\n\nTo define the text color:\n\
    \n+   1. Add the text color property to your CSS declarations. Type color in the\
    \ CSS rule, followed by a colon (:) (Table 7.2).\n```\ncolor:(102,0,0);\n```\n\
    2. Specify a color value. Type a value for the color based on color values from\
    \ Table 7. This includes RGB, HSL, transparent, or current color.\n3. Add colors\
    \ with alpha channels, as needed. If you want the color to be partially transparent,\
    \ then under the color value you can add the same again using the RGBA or HSVA\
    \ value. For browsers that do not support alpha values, the first color value\
    \ will be used and the second will be ignored.\n```\ncolor: rgba(102,0,0,.65);\n\
    ```\n\nCode 7.2 color-background-properties.css—nThe header text is rendered in\
    \ a variety of shades of red, the text is a dark gray, and the form button and\
    \ the text that gets typed into the field are red The brighter red text is much\
    \ more prominent than the lighter red and the gray text.\n\n```\n*** CSS W3 |\
    \ Chapter 7 ***\n* color-background-properties.css ***\n\nbody {\n  color: rgb(51,51,51);\n\
    }\n\nh1 {\n  color: rgb(102,0,0);\n  color: rgba(102,0,0,.65);\n}\n\narticle h2\
    \ {\n  color: rgb(135,127,107);\n}\n\narticle header + p:first-letter {\n  color:\
    \ rgba(153,0,0);\n}\n\nalink {\n  color: rgb(204,0,0);\n}\n\na:visited {\n  color:\
    \ rgb(153,0,0);\n}\n\na:hover {\n  color: rgba(255,0,0);\n}\n\na:active {\n  color:\
    \ rgb(153,153,153);\n}\n\nbyyline {\n  color: rgb(255,255,255);\n  color: rgba(255,255,255,-5);\n\
    }\n\nbyyline .author {\n  color: rgb(235,235,235);\n  color: rgba(255,255,255,.75);\n\
    }\n```"
