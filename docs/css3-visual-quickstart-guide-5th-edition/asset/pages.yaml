  md: '# # Aligning Text Vertically


    Using the **vertical-align** property, you can specify the vertical position of
    one inline element relative to the elements above or below it Ⓐ. This means that
    the **vertical-align** property (Table 6.7) can be used only with inline tags
    and table tags—that is, tags without a break before or after them, such as the
    anchor `<a>`, image `<img>`, emphasized text `<em>`, strong text `<strong>`, and
    data `<td>` tags.


    # ## To define vertical alignment:


    +   1. Add the vertical align property to your rule. Type **vertical-align** in
    the declaration list, followed by a colon (: (Code 6.8).


    vertical-align: continues on page 166


    ![](img/9cd61ac1d4015ed5688d0c411434a660_187_0.png)


    > Ⓐ The different alignment types. The lines are shown only as guides.


    | Value | Compatibility |

    | --- | --- |

    | super | IE4, FF1, S1, C1.3, CSS1 |

    | sub | IE4, FF1, S1, O3.5, CSS1 |

    | baseline | IE4, FF1, S1, C1.3, CSS1 |

    | <relative> | IE5.5, FF1, S1, O3.5, CSS1 |

    | <length> | IE5.5, FF1, S1, O3.5, CSS1 |

    | <percentage> | IE7, FF1, S1, C1.3, CSS1 |


    Table 6.7 Vertical-Align Values


    ![](img/9cd61ac1d4015ed5688d0c411434a660_187_1.png)


    # ### THE POOL OF TEARS


    Cried and cried until Alice was so much that, for the moment, the little gone
    seemed to fall asleep beside her. ''Oh, now, what shall I do?'' she said to herself,
    ''If I go into that now, I think I shall shall be_ right out of tears! I''ve been
    out and crying for so long that I don''t think I shall be able to stop now; so
    I must go on and shut up for now, for that''s what I want to do: if I go in, then
    I shall get a new stream of tears every moment.''


    And she went on thinking how she would manage herself. ''They must go by the corner,''
    she thought, ''how funny it would be to see a gone without one head, right?—and
    what all the duchess would do!''


    > Code 6.8 applied to code 6.1: The chapter number and "by" in the baseline have
    been moved up relative to the text to which they refer.


    164 Chapter 6'
