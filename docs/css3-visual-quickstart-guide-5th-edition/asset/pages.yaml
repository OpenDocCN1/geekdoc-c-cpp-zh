    \ is always falling asleep during the scene, waking every so often. | |\n Alice\
    \ | The character has been said to be based on Alice Liddell, a child of Dodgson.\
    \ | |\n\n> TIP I recommend auto because most tables and short tables will not\
    \ take long to render, and long tables will need more accuracy. Either way, auto\
    \ is preferred.\n\nCode 8.6 applied to code 8.1 with auto layout: Because the\
    \ data in the table is considered with auto when determining the column widths,\
    \ the layout adjusts to fit all the content."
