  md: '2. Style the default link state. Type the selector (anchor tag, class, or ID)
    of the element you want to style, followed by a colon (:), and then link.


    ```

    a:link {......}

    ```


    You can override styles set for the anchor tag, but this rule should always come
    before the :visited pseudo-class.


    3. Style the visited link state. Type the selector (anchor tag, class, or ID)
    of the element you want to style, followed by a colon (:), and then visited.


    ```

    a:visited {...}

    ```


    4. Style the hover link state. Type the selector (anchor, class, or ID) of the
    element you want to style, followed by a colon (:), and then hover.


    ```

    a:hover {...}

    ```


    5. Style the active link state. Type the selector (anchor, class, or ID) of the
    element you want to style, followed by a colon (:), and then active.


    ```

    a:active {...}

    ```


    6. Style is applied to the link state as needed.


    ```

    <a href="chapater01.html">...</a>

    ```


    All links on the page will obey the rules you lay down when styling the various
    link states. You can—and use selective styling to differentiate link types.'
