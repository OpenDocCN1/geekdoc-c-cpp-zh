- pgno: 255
  md: "# # Changing the Mouse Pointer Appearance\n\n# TABLE 9.1 Cursor Values\n\n\
    Normally, the browser determines the appearance of the mouse pointer according\
    \ to the current content under it. If the pointer is over text, for example, the\
    \ pointer becomes a text selector. Or, if the browser is working and the visitor\
    \ can't do anything, the pointer becomes a timer, indicating that the visitor\
    \ needs to wait.\n\n| Value | Compatibility |\n| --- | --- |\n| <cursor type name>\
    \ | IE4, FF1, S1, S0, C1, CSS2 |\n| <URL> | IE6, FF1.5, S3, C3, CSS2 |\n| auto\
    \ | IE4, F1, S1, S0, C1, CSS2 |\n| none | IE4, FF1, S1, S0, C1, CSS2 |\n\nSometimes,\
    \ it's useful to override the browser's behavior and set the appearance of the\
    \ mouse pointer yourself, using the cursor property (Table 9.1). This can be applied\
    \ to any element on the screen, not just links. Also, you do not have to associate\
    \ it with the dynamic hover state for it to work; just apply it directly to the\
    \ CSS rule.\n\nCode 9.2 ui-generated-content properties—I've set up different\
    \ pointer types that depend on the type of object or link over which the pointer\
    \ is hovering\n\n```\n*** CSS V05 | Chapter 9 |\n- ui-generated-content.properties\
    \ css ***\n\n.toc { margin: auto; width: 90%;\n text-align: center; font-size:\
    \ .5em; }\n\na {\n cursor: help;\n}\n```\n\n# To set the mouse pointer's appearance:\n\
    \n+   1. Add the cursor property to your CSS declarations. Type cursor in the\
    \ CSS declaration block, followed by a colon (1) Code 9.2).\n\n+   2. Specify\
    \ the mouse pointer. Type one of the mouse pointer names listed in Table 9.2 to\
    \ specify the pointer's appearance.\n\nCURSOR:\n\ncrosshair;\n\nAlternatively,\
    \ type one of these values for cursor:\n\n+   - auto to have the browser choose\
    \ which pointer to use.\n\n+   - none to hide the pointer alterog.\n\n![](img/9cd61ac1d4015ed5688d0c411434a660_255_0.png)\n\
    \n> Code 9.2 applied to code 9.1: the pointer turns into the Cheshire Cat's head\
    \ when over the book title."
  merge: -1
  img_proc: true
- pgno: 256
  md: '# TABLE 9.2 Cursor Types


    | Name | Appearance (varies depending on OS) |

    | --- | --- |

    | crosshair | + |

    | e-resize | → |

    | help | ? |

    | move | ╋ |

    | n-resize | ↑ |

    | nw-resize | ↘ |

    | pointer | 👆 |

    | progress | ⌛ |

    | se-resize | ↘ |

    | s-resize | ↓ |

    | sw-resize | ↙ |

    | text | I |

    | wait | ⌛ |

    | w-resize | ← |


    3. Add a graphic mouse pointer. You can also create your own pointer by adding
    the URL reference to an image file (generally in PNG format) to use as a custom
    cursor. You can specify the complete Web address or the local filename of the
    image.


    ```

    cursor: url(../images/cursor-02.png) 20 20, crosshair;

    ```


    ★ CSS3 adds the ability to define the pointer''s hotspot (the point at which the
    active click will happen) as determined from the upper-left corner of the image.
    Always include a backup pointer.


    TIP Firefox, Safari, Opera, and Chrome allow you to use CUR, ANI, GIF, PNG, or
    JPEG Images as a custom pointer by specifying the URL for the image. Unfortunately,
    Internet Explorer supports only CUR and ANI file formats for custom pointers.


    TIP CUR and ANI are not standard image formats and can only be created using specialized
    software.


    TIP Remember that the exact appearance of the pointer depends on the operating
    system and the Web browser in use.


    TIP Although it''s fun to play around with the mouse pointers, I have tested this
    feature on my own Web site and have received several emails asking me to cut it
    out. Most Web users have learned to recognize the common functions of specific
    pointers and when they should appear. Breaking these conventions tends to confuse
    users.'
  merge: -1
  img_proc: true
- pgno: 257
  md: "# Adding Content Using CSS\n\nFor the purposes of search engine optimization\
    \ and accessibility, it is usually best to keep all content within the `<body>`\
    \ element of your Web page. If it is dynamically generated, then it will not be\
    \ seen by web crawlers and many screen readers. However, at times you may have\
    \ repetitive content that will not help (or even hinder) your placement in a search\
    \ index.\n\nTo add content, you can use the **content** property (Table 9.3),\
    \ which allows you to specify a text string, image or file URL, quote, or even\
    \ an attribute value that should be displayed on the page.\n\n# TABLE 9.3 Compatibility\n\
    \n| Value | Compatibility |\n| --- | --- |\n| normal | IE8, FF1, S1, O4, CSS2\
    \ |\n| none | IE8, FF1, S1, O4, CSS2 |\n| <string> | IE8, FF1, S1, O4, CSS2 |\n\
    | <url> | IE8, FF1, S1, O7, CSS2 |\n| <counter> | IE8, FF1, S1, O4, CSS2 |\n|\
    \ attr(<selector>) | IE8, FF1, S1, O4, CSS2 |\n| open-quote | IE8, FF1, S1, O4,\
    \ CSS2 |\n| close-quote | IE8, FF1, S1, O4, CSS2 |\n| no-quote | IE8, FF1, S1,\
    \ O4, CSS2 |\n| no-quote | IE8, FF1, S1, O4, CSS2 |\n| inherit |\n\n# To define\
    \ generated content:\n\n+   1. Specify whether the content should go before or\
    \ after the element. Type a selector with the `:before` or `:after` pseudo-class\
    \ (see *Setting the Content Before and After and Element* in Chapter 4) to define\
    \ where the content will be positioned in relation to the selector (Code 9.3).\n\
    2. Add the content property to your CSS. In your declaration block, type the **content**\
    \ property name, followed by a colon (`:`) and one of the values listed in step\
    \ 3.\n\n```\n.toc h2{...}\n```\n\ncontent:\n\n> Code 9.3 ui-generatedcontent-properties.css—nA\
    \ flourish image (bullet-01), the word \"Chapter\" and a counter are inserted\
    \ before the h2 tag if it is in the .toc class. After bullet is inserted afterward\
    \ the left\n\n```\n*** CSS Q05 | chapter 9 |\n-> ui-generatedcontent-properties.css\
    \ ***\n\n.toc { margin: 0; width: 90%; }\n-> text-align: center; font-size: .5em;\
    \ }\n\na {\ncursor: help; }\n\nh1 {\ncursor: url('../images/cursor-02.png');\n\
    \ 20 20, crosshair; }\n\ntoc h2:before {\ncontent: url('../images/bullet-01.png');\n\
    \ 'Chapter ' counter(counterNumber) . '.'; }\n\ntoc h2:after {\ncontent: url('../images/bullet-02.png');\
    \ }\n```"
  merge: -1
  img_proc: true
