- pgno: 221
  md: "# Setting a Background Color\n\nThe ability to set the background color on\
    \ an HTML page has been around almost since the first Web browsers. However, with\
    \ CSS you can define the background, not only for the entire page, but also for\
    \ individual elements using the background-color property (Table 7.6). Unlike\
    \ the color property, though, background colors are applied only to the element,\
    \ and are not directly inherited by its children. That said, by the very fact\
    \ they are within the parent, they will be set against that background.\n\nCode\
    \ 7.3 color-background-properties.\n- css—Background colors can be set as solid,\
    \ transparent, or using a gradient A.\n\n```\n*** CSS3 V8 | Chapter 7 |\n- color-background-properties.css\
    \ ***\n\n{\n  padding: 0;\n  margin: 0;\n  border: none;\n}\n\nbody {\n  color:\
    \ rgb(51,51,51);\n  background-color: rgb(85,85,85);\n}\n```\n\n```\nheader.page\
    \ {\n  display: block;\n  background-color: rgb(102,0,0);\n}\n```\n\n# To define\
    \ the background color of an element:\n\n```\nh1 {\n  color: rgb(255,225,225);\n\
    \  background-color: rgba(255,225,225,65);\n}\n```\n\n+   1. Add the background\
    \ color property to your declaration list. Start your declaration by typing background-color\
    \ (Code 7.3), followed by a colon (:). background-color:\n\n```\narticle {\n \
    \ display: block;\n  background-color: rgb(242,237,217);\n}\n```\n\n+   2. Specify\
    \ the color value. Type a value for the background color. This value can be the\
    \ name of the color or an RGB value.\n\n```\narticle h2 strong {\n  color: rgb(135,127,107);\n\
    }\n```\n\nrgb(102,0,0), you could type transparent, which would allow the parent\
    \ element's background color to show through, or currentcolor to use the value\
    \ of the color property.\n\n```\narticle header + p:first-letter {\n  color: rgb(153,0,0);\n\
    \  background: transparent;\n}\n\nfooter {\n  display: block;\n  background: rgb(153,153,153);\n\
    \  filter: grad(VkImageTransform.Microsoft;\n  gradient(startColor='#0000000',\n\
    \    endColor='#0000000');\n  background: -webkit-gradient(linear,\n    left top,\
    \ bottom, from(rgba(0,0,0,0)),\n    to(rgba(0,0,0,5)));\n}\n```\n\ncode continues\
    \ on next page\n\n198 Chapter 7"
