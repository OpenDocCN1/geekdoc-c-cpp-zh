- pgno: 142
  md: '# Understanding Typography on the Web


    A **type family** (commonly referred to in Web design as a **font family**) is
    a category of typefaces that have similar characteristics. Each character within
    a font is referred to as a *glyph*. The advantages of HTML text compared to text
    in Flash or graphics are that it is easy to edit if changes are required, and
    it can adjust to the width of the screen on which it is viewed. In addition, content
    is often stored within databases and then output as HTML text.


    However, HTML text has some severe limitations. By and large, most of the textual
    control is left up to the visitor''s browser, and you cannot currently do some
    things, such as run text vertically rather than horizontally, without using CSS
    Transitions (Chapter 12) which are not cross-browser yet.


    What seems stifling is that you are limited to the fonts available on the visitor''s
    machine. However, recent browser developments are quickly changing this perception.
    As CSS3 grows in popularity, so do a wider range of typeface possibilities as
    WebFonts become available.


    # Specifying the character set


    In the previous chapter, you found that when you create an HTML5 document, you
    need to specify the character set used in your page. A character set is simply
    a list or *repertoire* of characters with a unique code or name that the browser
    will recognize to display the text.


    You specify the character set in the head of your HTML page using a meta tag.
    The most popular international character set is'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'the UTF-8 (8-bit Unicode Transformation

    Format) character set:


    ```

    <meta charset="utf-8">

    ```


    Alternatively, if you are writing in English, another common character set is
    the

    ISO 8859-1 character set:


    ```

    <meta http-equiv="Content-

    Type" content="text/html;

    charset=ISO-8859-1" />

    ```


    Both UTF-8 and ISO 8859-1 work about

    t same for English, but UTF-8 supports

    other alphabets. I highly recommend sticking with UTF-8. Web sites (even your
    local

    newspaper) are often translated on the fly

    to different languages.


    One other important point: if you specify a

    character in your HTML that doesn''t exist

    in the specified character set, the browser

    gerally display an error marker in

    place of the character Ⓐ.


    # Generic font families


    CSS defines five generic font families

    into which most fonts can be categorized

    (Table 5.1).


    +   Serif—A serif is the small ornamentation

    at the end of a letter that gives it a distinguishing quality. Serifs are holdovers

    from the days of stonecutting and pen

    strokes. Serifs often improve legibility

    by making individual letters stand out

    from their neighbors.


    Serif fonts are generally best suited for

    the display of larger text onscreen (14px

    or larger) or for smaller printed text.

    They are not so good for smaller text

    on a screen, because the serifs often

    obscure the letter. Serif fonts often

    tray a more conservative feel.


    ![](img/9cd61ac1d4015ed5688d0c411434a660_143_0.png)


    > This glyph, or one like it,

    will appear in place of any

    characters that the browser\does not recognize as a part

    of the character set.


    # Table 5.1 Generic Font Families


    | Name | Example |

    | Serif | Times New Roman |

    | Sans-serif | Helvetica and Arial |

    | Monospace | Courier New |

    | Cursive | Brush Script MT |

    | Fantasy | Papyrus |'
  merge: -1
  img_proc: true
- pgno: 144
  md: '+   Sans-serif—As you might guess, sans-serif fonts are those fonts without
    serifs.


    Although the characters are less distinctive, sans-serif fonts work better for
    smaller text on a screen. Sans-serif fonts often portray a more modern and casual
    feel.


    +   Monospace—Although monospace fonts can have serifs or not, their distinguishing
    feature is that each letter occupies the same amount of space. The lowercase letter
    *i*, for example, is much thinner than the uppercase letter *M*. In non-monospace
    fonts, the letter occupies less space than the *M*, but a monospace font adds
    extra space around the *i* so that it occupies the same amount of space as the
    *M*.


    Monospace fonts work best for text that has to be exactly (but not necessarily
    quickly) read, such as programming code, in which typos can spell disaster. Although
    easier to scan, monospace fonts can become monotonous for reading large amounts
    of text. Monospace fonts often give a technical or typewritten feel to text.


    +   Cursive—Cursive fonts attempt to mimic cursive or calligraphic handwriting,
    usually in a highly stylized manner with the letters generally appearing partially
    or completely connected.


    Cursive fonts are best reserved for decoration and large headlines; they are not
    as readable in large chunks of text. Cursive fonts give an energetic and expressive
    feel to text.


    continues on next page'
  merge: -1
  img_proc: true
- pgno: 145
  md: '+   Fantasy—Decorative fonts that don''t fit into any of the preceding categories
    are referred to as fantasy fonts. These fonts usually are extremely ornamental
    but are still letters, so exclude dingbats or picture fonts, illustrations, or
    icons.


    Like cursive fonts, fantasy fonts are best reserved for decoration. You should
    use fantasy fonts sparingly and choose them carefully to reinforce the look and
    feel of your Web site, since each fantasy font invariably has a strong personality.


    ![](img/9cd61ac1d4015ed5688d0c411434a660_145_0.png)


    +   Examples of Dingbats. These are drawn from the dingbat font, Webdings.


    # Dingbats


    Although it does not have an official CSS designation, there is another important
    category of fonts to consider. Dingbats, also called symbol or picture fonts,
    do not represent numbers or letters, but are instead a collection of icons or
    pictograms each corresponding to a letter on the keyboard. The most common example
    of this font type is Webdings, which is installed on most computers. Webdings
    is a collection of common international symbols. Although these glyphs can be
    used in place of a graphic version of the icon, there is no guarantee that the
    font will be installed.


    However, if you use dingbats as WebFonts, as described later in this chapter,
    you can be relatively sure that you will get what you want, replacing some graphic
    icons with dingbat icons.'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# HTML character entities


    A more reliable alternative to dingbat fonts are HTML character entities. These
    are a collection of specialized glyphs that, instead of being represented by a
    single letter, are represented by code that begins with an ampersand (&) and ends
    with a semicolon (;). For example, the ampersand is represented in the code:


    ```

    &amp;

    ```


    For many characters (such as the ampersand), this is the only way to display them
    consistently across browsers and operating systems.


    # What Are Webfonts?


    Webfonts are a recent development in Web design that allow you to include fonts
    in your Web designs by linking to a font file on your server. Although this seems
    simple (and it is), this ability has been a long time in coming and will revolutionize
    Web typography.'
  merge: -1
  img_proc: true
- pgno: 147
