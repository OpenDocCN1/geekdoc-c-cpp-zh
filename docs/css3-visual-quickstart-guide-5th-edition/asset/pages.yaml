  md: 'TIP Setting a shorthand property to !important (background, for example) is
    the same as setting each sub-property (such as background-color) to be !important.


    TIP A common mistake is to locate !important after the semicolon in the declaration.
    This causes the browser to ignore the declaration and, possibly, the entire rule.


    TIP If you are debugging your style sheet and can''t get a particular style to
    work, try adding !important to it. If it still doesn''t work, the problem is most
    likely a typo rather than another overriding style.


    TIP Many browsers allow users to define their own style sheets for use by the
    browser. Most browsers follow the CSS 4.1 specification in which a user-defined
    style sheet overrides an author-defined style sheet.'
