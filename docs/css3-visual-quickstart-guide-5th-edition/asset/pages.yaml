- pgno: 273
  md: 'TIP Although you can turn any element into a list item or table, don''t. This
    is bad coding for a semantic and accessibility standpoint. Stick to HTML tags
    for creating lists and tables.


    TIP The compact property was dropped in CSS2.1 but may make a comeback in CSS3.
    At present, only a placeholder exists in the CSS Work Groups Box Model documentation
    for CSS3.


    TIP Any elements that are assigned display:none will be ignored by the browser.
    Be careful when using none, however. Although it is not an inherited attribute,
    none turns off the element display as well as the display of any children elements.


    TIP display:none is useful for creating dynamic elements—such as drop-down menus—that
    show and hide the user interacts with the page. However, keep in mind that this
    also hides the element from screen readers which can be bad for usability.


    TIP Another great use for none is to create it a print-specific style sheet that
    hides elements not needed when the page is printed, such as navigation and form
    fields. Who needs navigation links, search forms, and low-resolution graphics
    in a printout?


    TIP The display property should not be confused with the visibility property (see
    "Setting the Visibility of an Element" in Chapter 11). Unlike the visibility property,
    which leaves a space for the element, display:none completly removes the element
    from the page, although the browser still loads its content.'
  merge: -1
  img_proc: true
- pgno: 274
  md: "# 10.3 ui-properties.css—When applied to Code 10.1, width and height are used\
    \ to control element dimensions. Max A and min values can be used to allow the\
    \ design to grow or shrink to meet the user's needs.\n\n# Setting the Width and\
    \ Height of an Element\n\nBy default, the browser automatically sets the width\
    \ and height of an element to 100 percent of the available width and whatever\
    \ height is needed to display all the content. You can use CSS to override both\
    \ the width and height of block elements. Generally, you will be setting the width\
    \ of an element more often than the height unless you know the exact size of the\
    \ content of a block or are willing to allow scrolling.\n\n```\n### CSS Q5 | Chapter\
    \ 10 | box-properties.css ***/\n\nnav.global {\n  display: block;\n}\n\nnav.global\
    \ li {\n  display: inline;\n}\n\narticle {\n  max-width: 980px;\n  min-width:\
    \ 660px;\n}\n\nfigure {\n  display: block;\n  width: 300px;\n}\n\nfigcaption {\n\
    \  display:block;\n}\n\naside {\n  display: block;\n  width: 200px;\n  height:\
    \ 400px;\n}\n\nfooter {\n  width: 100%;\n}\n```\n\nIn addition to setting a specific\
    \ width and height, you can specify a width and height range by setting a minimum\
    \ and maximum width and height for an element. This can be unbelievably useful\
    \ for creating flexible designs that will stretch to unreasonable proportions\
    \ on larger screens.\n\n# Define the width of an element:\n\n+   1. Type the width\
    \ property name in the CSS declaration block, followed by a colon (: (Code 10.3).\n\
    \nwidth:\n\ncontinues on next page\n\n![](img/9cd61ac1d4015ed5688d0c411434a660_274_0.png)\n\
    \n![](img/9cd61ac1d4015ed5688d0c411434a660_274_1.png)\n\n> Code 10.3 applied to\
    \ Code 10.1: Shows the example with the window open to 1280px width.\n\n> Code\
    \ 10.3 applied to Code 10.1: Shows the example with the window open to 640px width."
