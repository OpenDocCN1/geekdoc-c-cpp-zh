  md: '+   3. Set the float property for your columns. Most columns use a float:left
    but float:right or a combination will work, depending on your needs.


    ```

    nav, article, aside {...}

    ```


    +   4. Set the column widths. Until these widths are set, the columns will stretch
    the full width of the parent element (section) and not actually float next to
    each other. Additionally, you will want to set margins and any padding. Of course,
    if you are using padding, you will run afoul of the box model problem in Internet
    Explorer (see Chapter 12). So you will also want to set a separate width using
    either the underscore hack (as I did here) or more preferably, conditional styles
    as explained in Chapter 12:


    ```

    nav {...}, article {...}, aside {...}

    ```


    > TIP My general rule of thumb is to leave five pixels or 1 to 2% (for fluid columns)
    as a "fudge factor" between floated elements. The difference between columns that
    float and rows stacked on each other can literally come down to a single pixel.
    However, you will need to test your design on multiple window sizes to find the
    exact fudge factor for your design.


    > TIP Although I used three columns here, you can add as many columns as you want.
    Just add more <aside> or <div> elements with the float property and adjust your
    column.'
