- pgno: 154
  md: '# Using Font Squirrel to Convert Font Files


    Although you are now free to start downloading Webfonts in your designs, you still
    face two major hurdles:


    +   1. Legal. While you might assume that you can use a purchased font as a Webfont,
    it is rarely the case. Most fonts have usage restrictions outlined in their End
    User License Agreements (EULA). If the EULA does not specifically state that you
    can use a font for @font-face linking, you can''t so legally. To, check with the
    font vendor before proceeding.


    +   2. Technical. How do you get all of those different font formats? Currently,
    even if licensed to so, most font foundries or resellers do not provide these
    formats.


    What to do?


    One great resource I use regularly is the Font Squirrel Web site (www.fontsquirrel.com),
    which provides an index to over 500 freely licensed, downloadable Webfonts. Each
    is complete with all the font formats as well as CSS code


    As that were not great enough, the site also provides an insanely useful tool—the
    @font-face Kit Generator—can convert any OTF or TTF file into EOT, SVG, and WOFF
    formats (www.fontsquirrel.com/fontgenerator/). It''s easy to use and Just make
    that your EULA is in order before using it.


    ![](img/9cd61ac1d4015ed5688d0c411434a660_154_0.png)


    Font Squirrel (www.fontsquirrel.com) offers over 500 free fonts that are ready
    for your use in your Web site.


    +   Use the @font-face Kit Generator (www.fontsquirrel.com/fontface/generator)
    to convert any licensed fonts for use on the Web.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# Webfont Service Bureaus


    Another up-and-coming option for adding specific fonts to a Web design is Webfont
    service bureaus, which provide licensed fonts for your use (generally at a cost)
    but retain the actual files on their own servers while allowing you to reference
    them in your code. Some enable this with a straightforward CSS link; others use
    their own proprietary methods, generally incorporating JavaScript.


    The advantages of using Webfont service bureaus include:


    +   - Fonts are licensed, so you don''t have to worry about violating EULA and
    getting sued.


    +   - Fonts are hosted on the bureaus'' servers, which means you are taking less
    bandwidth on your own servers.


    +   - Browser support is handled by the bureau, as are potential updates and upgrades.

    However, there are disadvantages as well:


    +   - Since the fonts are on a third-party server, you are depending on someone
    else''s system to always be fast and reliable.


    +   - If you do not have a copy of the font on your own computer, you will not
    be able to create graphical comps to show clients.


    +   - Price scales vary from service to service. Some charge a one-time fee; others
    require a yearly subscription. If you forget to pay, your font goes bye-bye.


    Webfont service bureaus are coming online all the time, but the top ones currently
    include:


    +   - Typekit (www.typekit.com)


    +   - Kernest (www.kernest.com)


    +   - Typotheque (www.typotheque.com)


    +   - Ascender (www.ascender.com)


    +   - Fontdeck (www.fontdeck.com)


    +   - Google Font API (code.google.com/apis/webfonts/)'
  merge: -1
  img_proc: true
- pgno: 156
  md: "# # Setting the Font Size\n\nWith CSS, you can specify the size of the text\
    \ on the screen using several notations or methods, including the traditional\
    \ print-based point-size notation, percentage, absolute size, and even a relative\
    \ size to the surrounding text (Table 5.4).\n\nFonts can be set as either absolute\
    \ sizes, which define the font size based on a standard length measurement, or\
    \ relative sizes, which are in relation to defaults set for the browser.\n\nTABLE\
    \ 5.4 Font-Size Values\n| Value | Compatibility |\n| --- | --- |\n| <length> |\
    \ IE3, FF1, S1, C1, O5.5, CSS1 |\n| <percentage> | IE3, FF1, S1, C1, O5.5, CSS1\
