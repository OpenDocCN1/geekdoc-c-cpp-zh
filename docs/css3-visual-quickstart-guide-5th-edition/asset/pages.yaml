- pgno: 338
  md: '# A Brief Note on Design Enhancements


    Let me emphasize one point: Never rely on styles for Web site functionality if
    the styles are not browser interoperable (that is, available on all common browsers).


    One more time for those who missed It: Never rely on styles for Web site functionality
    if the styles are not browser interoperable.


    That said, you can and should use styles, such as transitions, design enhancements
    to improve the user experience without sacrificing usability for those who cannot
    see them. This is acceptable as long as you can live without the transitions and
    users can still complete their tasks.


    +   - scale3d() requires three numeric values that act as a multiplier to the
    width (X) and/or height (Y) and depth (Z) of the element. Positive numbers increase
    element size. Negative values will increase size and reflect the element along
    that axis. Decimal numbers decrease scale.


    +   - scaleZ() adds numeric values as a multiplier to the depth (Z) of the element.
    Positive numbers increase element size. Negative values will increase size and
    reflect the element along that axis. Decimal numbers decrease scale.


    +   - translate3d() requires three length values that offset the element along
    the X axis, Y axis, and/or Z axis of the element. Positive values offset down,
    to the right, and forward (larger), whereas negative values offset up, to the
    left, and backward (smaller).


    +   - translateZ() adds a length value that offsets the element along the Z axis
    of the element. Positive values offset forward, whereas negative values offset
    backwards. Unlike the X and Y values, a percentage is not allowed with Z.


    +   - matrix3d() is a 4x4 matrix of 16 values that can be used as shorthand to
    represent any of the preceding transformations alone or in combination.


    > I find the 3D transformations to be a bit of a mindblower when it comes to trying
    to figure out what does what. Don''t worry if it doesn''t seem intuitive at first.
    Experimentation is the best remedy for confusion.'
  merge: -1
  img_proc: true
- pgno: 339
  md: '# # NEW IN CSS3: Adding Transitions Between Element States ★


    Despite people''s expectations to change and movement on the screen, CSS and HTML
    have few controls that allow you to design interactivity, and those that do have
    been binary up to this point:


    +   - A link is one color or another.

    - A text field is one size or another.

    - A photo is transparent or opaque.


    No in-betweens have existed in the past from one state to the next. No transitions.

    This led to most Web pages feeling abrupt, with elements shifting and changing
    ungracefully.


    What we need is a quick and easy way to add simple transitions to a page, and
    that''s where CSS transitions come into the picture.


    # ## What can be transitioned?


    Almost any CSS property that has a color, length, or position component—including
    many of the new CSS3 properties—can be given a transition, changing it from one
    style to another over time.


    Table 12.9 shows a list of the CSS properties available and the values that can
    be transitioned. One exception is box-shadows.


    For a transition to occur, there has to be a state change in the element, using
    one of the link or dynamic pseudo classes discussed in Chapter 3. Transitions
    work by changing a style between different element states over a period of time.
    For example, the color value of the default state of an element will pass through
    intermediate colors in the spectrum before appearing as the color value for the
    hover state.


    ![](img/9cd61ac1d4015ed5688d0c411434a660_339_0.png)


    > A transition is like several frames in a movie, changing gradually over time
    rather than instantly.'
  merge: -1
  img_proc: true
