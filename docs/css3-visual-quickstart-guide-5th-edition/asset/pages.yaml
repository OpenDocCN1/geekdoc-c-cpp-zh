  md: '# TABLE 6.10 White-Space Values


    | Value | Compatibility |

    | --- | --- |

    | normal | IE5.5, FF1, S1, C1, O4 |

    | pre | IE5.5, FF1, S1, C4, CSS1 |

    | nowrap | IE5.5, FF1, S1, C4, CSS1 |


    # Controlling White Space


    As you''ve learned, browsers traditionally collapsed multiple spaces into a single
    space unless a `<pre>` tag was used. CSS lets you allow or disqualify space collapsing,
    as well as designate whether text break at a space (similar to the `<wbr>`) using
    the **white-space** property (Table 6.10).


    An excellent example of this is the mouse tail poem from Chapter 3 of *Alice in
    Wonderland*. This poem is shaped like a curvy mouse tail A. If the **white-space
    property value is assigned pre for the poem class**, all spaces collapse B. However,
    if it''s assigned a value of **nowrap**, the spaces and line breaks are ignored,
    and the text stretches as far to the right on the page as necessary C.


    ![](img/9cd61ac1d4015ed5688d0c411434a660_192_0.png)


    > A The pre value keeps all spaces so the poem retains its distinctive mouse tail
    shape than collapsing.


    ![](img/9cd61ac1d4015ed5688d0c411434a660_192_1.png)


    > B Without the pre value, the spaces collapse along with the mouse tail.


    ![](img/9cd61ac1d4015ed5688d0c411434a660_192_2.png)


    > C With the no-wrap value, the poem stretches vertically across the window, forcing
    a horizontal scroll to accommodate its width.


    Text Properties 169'
  merge: -1
  img_proc: true
- pgno: 193
  md: '# To define white space:


    1. Add the white space property to your CSS rule. Type white-space in the CSS
    declaration list, followed by a colon (: Code 6.10).


    white-space:


    2. Specify how you want white space treated.


    pre;


    Type one of the following options:


    +   * pre preserves multiple spaces.


    +   * nowrap prevents line wrapping without a `br` tag.


    +   * normal allows the browser to determine how spaces are treated. This setting
    usually forces spaces to collapse into a single space.


    ![](img/9cd61ac1d4015ed5688d0c411434a660_193_0.png)


    Code 6.10 applied to code 6.1: The note has been set along diagonal by adding
    spaces. These would collapse if not for the `pre` value applied to it.


    > TIP Do not confuse the <br> and <pre> tags with the white-space property of
    nowrap and pre. Although they basically do the same thing, the no break tag is
    being phased out (deprecated) and should not be used.


    > TIP The content of any tag that receives the nowrap value runs horizontally
    as far as necessary regardless of the browser window width. The user may be forced
    to scroll horizontally to read all the text, so this setting is usually avoided.


    > TIP nowrap is great for preventing content from wrapping in table data cells.'
  merge: -1
  img_proc: true
