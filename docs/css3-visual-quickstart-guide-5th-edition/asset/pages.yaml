- pgno: 361
  md: "# Eric Meyer reset\n\nPartially in response to Yahoo!, noted Webit Eric Meyer\
    \ developed his own CSS reset script. According to his blog, he felt that the\
    \ Yahoo! code went too far and not far enough in others. script (Code 13.7) is\
    \ useful for resetting typographic styles.meyer.com/eric/tools/css/\n\nCode 13.7\
    \ cssreset-ericmeyer.css—Developed by Eric Meyer, this reset is simpler than the\
    \ Yahoo Reset.\n\n*** CSS3 VQ5 | Chapter 13 |\n* cssreset-ericmeyer.css ***\n\n\
    Applying styles globally to every tag puts a burden on the browser's rendering\
    \ engine. This is mostly an argument against using the universal selector (*),\
    \ which applies the styles to every tag. However, I have not seen any data showing\
    \ exactly how this lag is and haven't found any noticeable degradation in my tests,\
    \ even on complex pages.\n\n```\n/* v.1/ 2008012 */\n/ html, body, div, span,\
    \ applet, object, iframe,\nh1, h2, h3, h4, h5, h6, p, blockquote, pre,\na, abbr,\
    \ acronym, address, big, cite, code,\ndef, df, em, font, ins, kbd, q, s, samp,\n\
    small, stroke, sup, tt, var,\nb, u, i, center,\ndli, dt, ol, ul, li,\nfieldset,\
    \ form, label, legend,\ntable, caption, tfoot, tread, tr, thd\nmargin: 0;\npadding:\
    \ 0;\nborder: 0;\noutline: 0;\nfont-size: 100%;\nvertical-align: baseline;\nbackground:\
    \ transparent;\nbody {\nline-height: 1;\nol, ul {\nlist-style: none;\n}\blockquote,\
    \ q {\nquotes: none;\n}\nblockquote:before, blockquote:after,\nq:before, qafter\
    \ {\ncontent: '\";\ncontent: none;\n}\n/* remember to focus styles! */\nfocus\
    \ {\noutline: 0;\n}\n/* remember to highlight inserts somehow! */\nins {\ntext-decoration:\
    \ none;\ndel {\ntext-decoration: line-through;\n}\n/* tables still need 'cellspacing=\"\
    0\" in the\nmarkup * */\ntable {\nborder-collapse: collapse;\nborder-spacing:\
    \ 0;\n}\n```"
