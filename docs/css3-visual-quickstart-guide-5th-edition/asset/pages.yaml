  md: "# Making a Declaration\n!important\n\n# h1 { color: red !important; }\n\nYou\
    \ can add the !important declaration to a property-value declaration to give it\
    \ the maximum weight when determining the cascade order. Doing so ensures that\
    \ a declaration is applied regardless of the other rules in play. (See \"Determining\
    \ the Cascade Order\" in this chapter):\n\nThe general syntax for !important.\n\
    \nCode 20. The !important value has been added to the color property in the first\
    \ h1, but not in the second. Typically, the second h1 would override the first,\
    \ but not in this case.\n\n```\n<!-- HTML -->\n<!DOCTYPE html>\n<html lang=\"\
    en\">\n<head>\n  <meta http-equiv=\"charset\" charset=\"UTF-8\" />\n  <title>Alice's\
    \ Adventures in Wonderland</title>\n  <style type=\"text/css\" media=\"all\">\n\
    h1 {\n  color: red !important;\n  font-size: 3em;\n}\nh1 {\n  color: black;\n\
    \  font-size: 2em;\n}\n</style>\n</head>\n<body>\n<article>\n  <h1>Alice's Adventures\
    \ in\n  <em>Wonderland</em></h1>\n</article>\n</body>\n</html>\n```\n\n# To force\
    \ use of a declaration:\n\n+   1. Add your CSS rule (Code 4.20).\n   `h1 {...}`\n\
    \nYou can use HTML, class, or ID selector. CSS rules can be defined within the\
    \ <style> tags in the head of your document (see \"Embedded: Adding Styles to\
    \ a Web Page in Chapter 3\") or in an external CSS file that is imported or linked\
    \ to the HTML document (see \"External: Adding Styles to a Web Site in Chapter\
    \ 3\").\n\n+   2. Make it important. Use a style declaration, a space, !important,\
    \ and a semicolon;) to close the declaration.\n\ncolor: red !important;\n\n+ \
    \  3. Add other styles.\n\nfont-size: 1em;\n\nAdd any other declarations you wish\
    \ for this rule, making them !important or not, as you desire.\n\n!important is\
    \ a powerful tool, second to only inline styles for style cascade. !important\
    \ is great for debugging CSS; but because it can interfere with making changes\
    \ later, it should never be used in the final Web site.\n\n![](img/9cd61ac1d4015ed5688d0c411434a660_134_0.png)\n\
    \nThe result of Code 4.20. The style that is most important wins the day, so the\
    \ text is red rather than black."
