- pgno: 131
  md: '# Styling for Print


    With the advent of laser and inkjet printers, we seem to be buried under mounds
    of perfectly printed paper. Even the Web seems to have increased the amount of
    paper we use. If an article on the Web is longer than a couple of scrolls, many
    people print it.


    But the Web was created to display information on the screen, not on paper. Web
    graphics look blocky when printed, and straight HTML lacks much in the layout
    of controls. That said, you can take steps to improve the appearance of printed
    Web pages. Looking good in print and on the Web may take a little extra effort,
    but your audience will thank you in the long run.


    Here are six simple things you can do to improve the appearance of your Web when
    it is printed:


    +   - Use breaks before page headers to keep them with their text.


    ```

    - Separate content from navigation. To keep the main content—the part your audience
    is interested in reading—in a separate area of the design from the site navigation.
    You can then use CSS to hide navigation in the printed version with a

    ```


    ```

    nav { display: none }

    ```


    included in the print style sheet.


    +   - Avoid using transparent colors in graphics. This is especially true if the
    graphic is on a background-color or a color other than white. The transparent
    area of a GIF image usually prints white regardless of the color behind it in
    the window. This situation is not a problem if the graphic is on a white background
    to begin with, but the result is messy if the graphic is supposed to be on a dark
    background.


    +   - Avoid using text in graphics. The irony of printing content from the Web
    is that text in graphics, which may look smooth in the window can look blocky
    when printed; but regular HTML text, which may look blocky on some PC screens,
    can print smoothly on any decent printer. Try to stick with HTML text as much
    as possible.


    +   - Avoid dark-colored backgrounds and light-colored text. Generally you want
    to keep white as your background color for the printed page, and black or dark
    gray for the text.


    +   - Do not rely on color to convey your message when printed. Although color
    printers are quite common these days, many people are still printing with black-and-white
    printers or printing in black and white on color printers to save money.'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# # Inheriting Properties from a Parent


    No, this book hasn''t suddenly become the Visual QuickStart Guide to Real Estate.
    Child and descendent HTML tags generally assume the styles of their parents—inherit
    them—whether the style is using CSS or is inherited from a browser style. This
    is called inheritance of styles.


    For example, if you use an ID copy and give it a font-family value of Times, all
    of its descendants would inherit the Times font style. If you set a **bold** tag
    to red with CSS, all of its descendants will inherit both the applied bold style
    A.


    # ## CSS


    ```

    b { color : red; }

    .copy { font-family: times; }

    ```


    ![](img/9cd61ac1d4015ed5688d0c411434a660_132_0.png)


    # ## RESULT

    Curiouser and curiouser!


    A The final result of the styles applied and inherited is bold, red, and italicized
    text in Times font.'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'In some cases, a style property is not inherited from its parent-obvious properties
    such as margins, width, and borders. You will probably have no trouble figuring
    out which properties are inherited and which are not. For example, if you set
    a padding of four pixels for the paragraph tag, you would not expect bold tags
    within the paragraph to also add a padding of four pixels. If you have any doubts,
    see Appendix A, which lists all of the CSS properties and how they are inherited.


    If you did want to force an element to inherit a property of its parent, many
    CSS properties include the inherit value. So, in the previous example, to force
    all the bold tags in a paragraph to take on the 4px padding, you could set their
    padding value to inherit.


    # Managing existing or inherited property values


    When defining the styles for a selector, you do not cause it to lose any of its
    inherited or inherent attributes unless you specifically override those styles.
    All those properties are displayed unless you change the specific existing properties
    that make up its appearance.


    In addition to overriding the relevant property with another value, many CSS properties
    have values that allow you to override inheritance:


    +   - inherit-Forces a property to be inherited that would normally not be inherited,
    or overrides other applied style values and inherits the parent''s value.


    +   - none-Hides a border, image, or other visual element.


    +   - normal-Allows no style to be applied.


    +   - auto-Allows the browser to determine how the element should be displayed
    based on context.'
  merge: -1
  img_proc: true
