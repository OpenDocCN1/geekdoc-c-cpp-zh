- pgno: 64
  md: '# External: Adding Styles to a Web Site


    A major benefit of CSS is that you can create a style sheet once and use it in
    a... single Web page or throughout your entire Web site. To do this, you create
    an external CSS file separate from the HTML document that contains only CSS code—no
    HTML, JavaScript, or any other code.


    Establishing an external CSS file is a two-step process. First, you set up the
    CSS rules in a text file. Second, you link or import this file into an HTML document
    using the `<link>` tag or the `@import` rule.


    # Creating an external style sheet


    The first step in using an external style sheet globally on a Web site is to create
    the external file that contains all the CSS code. However, unlike adding embedded
    styles, you do not use `<style>` tags in an external CSS file. In fact, doing
    so would cause the external style sheet to fail.


    ![](img/9cd61ac1d4015ed5688d0c411434a660_64_0.png)


    > External CSS files can be used to style HTML pages directly by linking or importing
    them. External CSS files also can be imported into each other to combine styles
    and then brought into an HTML document.'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'In this example, I set up three CSS files:

    default.css, ch01.css, and ch02.css.


    # To set up an external CSS file:


    +   1. Create a new text file. You can use a text editor or Web-editing software.

    Save the file using the .css extension.

    For example, default.css.

    Notepad or SimpleText will do, but you may want to use a specialized code editing
    software programs such as Coda or BBEdit.

    Do not use Microsoft Word. It adds its own markup code that will interfere with
    your CSS code.

    2. Import CSS files. This is optional, but you can create as many external style
    sheets as you want and import style sheets into each other to combine their styles
    (Code 3.4 and Code 3.5). However, if an import rule is included in an external
    style sheet, it must be placed before all other CSS code. See "Importing a style
    sheet" in this chapter for more information.

    @import{default.css}

    3. Add your CSS rules to the text file (Code 3.3). Do not include any other code
    types—no HTML or JavaScript.

    Start a new rule by typing the selector to which you want to add styles, followed
    by opening and closing curly brackets ({}). Basic selectors—HTML, class, IDs,
    and universal—are explained in this chapter, and contextual selectors are explained
    in Chapter 4.


    ```

    body { padding: 200px 0 0 175px; }

    ```


    In the brackets of your rule, type the declarations to be assigned to this rule—formatted
    as property: value—using a semicolon (;) and separating'
