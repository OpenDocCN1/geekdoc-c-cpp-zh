  md: '# Understanding an Element’s Box


    As you learned in Chapter 2, an element is a part of an HTML document that is
    set off by HTML container tags. The following is an HTML element:


    ```

    <p>Alice</p>

    ```


    This is another HTML element:


    ```

    <article><p><em>Alice <img src="alice11.gif"></em></p></article>

    ```


    The first example is an element made of a single tag. The second example is a
    collection of nested tags, and each of those nested tags is an individual element.
    Remember that nested tags are called the *children* of the tags within which they
    are nested, which are called the *parents* (see “Inheriting Properties from a
    Parent” in Chapter 4).


    ![](img/9cd61ac1d4015ed5688d0c411434a660_268_0.png)'
  merge: -1
