  img_proc: true
- pgno: 363
  md: '# Fixing the Float


    CSS has one nasty bug that was apparently meant to be a feature: When you float
    block-level elements within a block-level element, the child elements do not take
    up any space in their parent. Make no, the child elements are still on the Web
    page where you expect them to be, but if you add a background or border to their
    parent, the box collapses to a size as if they were not present! This can be incredibly
    annoying if you are trying to set up columns.


    Several solutions to combat this little "feature" and force the parent element
    to acknowledge all of its prodigal children, but I find two solutions to be most
    reliable. The first is structural in the HTML; the other is pure and simple CSS.


    # Break tag clear all fix


    The problem with floating elements is that they are taken out of the normal flow
    of the document so, in effect, nothing anchors the bottom of the element and identifies
    the bottom is. To fix this, you have to clear floating at the bottom of the element
    (after all of its floating children) so it will open to its natural height.


    |1 | 2 |

    |---||

    |3 | 4 |

    |---||

    |5 | 6 |


    > Without a fix, the parent element (article) rolls up like a cheap newspaper,
    leaving its child elements high and dry.


    |1 | 2 |

    |---||

    |3 | 4 |

    |---||

    |5 | 6 |


    > With the fix in place, the parent is there to protect its children.'
  merge: -1
  img_proc: true
