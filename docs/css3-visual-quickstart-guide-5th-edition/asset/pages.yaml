  md: '# Setting Bold, Bolder, Boldest


    # normal bold


    CSS provides several options that allow you to set different levels of boldness
    for text. Many fonts have various weights associated with them; these weights
    have the effect of making the text look more or less bold (Table 5.7). CSS can
    take advantage of this feature A


    A The difference between normal and bold text is evident here.


    | TABLE 5.7 Font-Weight Values |

    | Value | Compatibility |

    | --- | --- |

    | normal | IE3, FF1, S1, C1, O5, CSS1 |

    | bold | IE3, FF1, S1, C1, O5, CSS1 |

    | lighter | IE4, FF1, S1 |

    | bolder | IE4, FF1, S1, C1, O5, CSS1 |

    | 100-900* | IE4, FF1, S1, C1, O5, CSS1 |


    # To define bold in a CSS rule:


    +   1. Add the font weight property to your CSS. Type the property name **font-weight
    (Code 5.7)**, followed by a colon (:).


    ```

    font-weight:

    ```


    +   2. Define the weight.


    bold;


    Type the value for the **font-weight property**, using one of the following:


    +   **bold**, which sets the font to boldface


    +   **bold** or **lighter**, which sets the font''s weight to be bolder or lighter
    relative to its parent element''s weight


    +   A value from **100 to 900**, in increments of 100, which increases the weight,
    based on alternate versions of the font that available


    +   **normal1**, which overrides other weight specifications


    * Depending on available font weights


    ![](img/9cd61ac1d4015ed5688d0c411434a660_165_0.png)


    # Alice''s Adventures in Wonderland


    Alice was getting tired of sitting by her sister on the bank, and having nothing
    to do, suddenly she saw a white rabbit run out of the run-hole below her. To her
    astonishment the rabbit took out a watch from its waistcoat and looked at it.
    Alice thought nothing of the watch, and in curiosity she ran straight to the rabbit-hole
    and went in after it.

    So she was, tumbling down, down, down, down, wondering how long she was falling,
    or whether the world was like this before or what the ended up being like now.
    ''Well,'' she said to herself, ''how curious strange thing to begin a day! And
    what if I had fell in a dream?''


    > TIP Use font-weight to add emphasis to text, but use it sparingly. If everything
    is bold, nothing stands out.


    > TIP In reality, most fonts only support normal and bold, so relative values
    have an absolute


    The author''s name and the chapter title are made to stand out. Notice that the
    text in strong tags is no longer bold. You can make text "strong" in many ways,
    including making it bold or larger.


    # Font-Weight Numbers


    Most fonts do not have nine weights, if you specify a **font-weight value** that
    is not available, another weight is used, based on the system:


    +   100 to 300 uses the next lighter weight, if available, or the next darker
    weight.


    +   400 and 500 may be used interchangeably.


    +   600 to 900 uses the next darker weight, if available, or the lighter weight.


