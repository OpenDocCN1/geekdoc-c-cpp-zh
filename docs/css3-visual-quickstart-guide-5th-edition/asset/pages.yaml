- pgno: 243
  md: "# Setting the Table Layout\n\nDifferent browsers use different methods to calculate\
    \ how a particular table should be displayed. Two primary table-layout (Table\
    \ 8.6) methods are favored:\n\n+   - Fixed method bases its layout on the width\
    \ of the table and the width of columns in the first row. This method is generally\
    \ faster than automatic.\n\n+   - Automatic uses the table column width along\
    \ the amount of content in the table data cell width. This will generally render\
    \ more slowly than the fixed method, but it also produces more accurate results\
    \ for widths throughout the table.\n\nTable 8.6 Table-Layout Values\n\n| Value\
    \ | Compatibility |\n|---|---|\n| fixed | IE5.5, O5, S1, C1, CSS2 |\n| auto |\
    \ O5, S1, C1, CSS2 |\n| inherit | IE5.5, O5, S1, C1, CSS2 |\n\nCode 8.6 list-table-properties:\
    \ The table-layout property forces you the browser to use either the fixed or\
    \ auto methods for rendering tables. I've also cheated a little here and set the\
    \ width and margin for the table, which you will not learn until Chapter 10.\n\
    \n```\n*** CSS V5 | Chapter 8 |\n- list-table-properties.css ***\n\nul {\n  list-style:\
    \ circle url(../images/bullet-01.png) inside;\n}\n\nav.global ul {\n  list-style:\
    \ none;\n}\n\ntable {\n  table-layout: auto;\n  width: 75%;\n  margin: 40px auto;\n\
    }\n```\n\nTo set the table layout method:\n\n+   - Add the table layout property\
    \ to a CSS rule for a table element. Type table-layout, followed by a colon (:)\
    \ on table elements (Code 8.6).\n\ntable-layout:"
  merge: -1
  img_proc: true
