  md: "# Setting Text Case\n\nWhen you're dealing with dynamically generated output,\
    \ such as from a database, you can never be quite sure whether the text will appear\
    \ in uppercase, lowercase, or a combination of the two. With the **text-transform**\
    \ property (Table 6.4), you can control the case of the text no matter how it\
    \ enters.\n\nTABLE 6.4 Text-Transform Values\n| Value | Compatibility |\n| ---\
    \ | --- |\n| capitalize | IE4, FF1, S1, C1, O3, CSS1 |\n| uppercase | IE4, FF1,\
    \ S1, C1, O3, CSS1 |\n| lowercase | IE4, FF1, S1, C1, O3, CSS1 |\n| none | IE4,\
    \ FF1, S1, C1, O3, CSS1 |\n\nTo define the text case:\n\n+   1. Add the text-transform\
    \ property to your CSS. Type `text-transform` in the CSS declaration list, followed\
    \ by a colon (**Code 6.4**).\n\n+   2. Specify the text case.\n   uppercase:\n\
    \   Type one of the following **text-transform** values to specify how you want\
    \ the text to be treated:\n   **capitalize** sets the first letter of each word\
    \ to uppercase.\n   **uppercase** forces all letters to uppercase.\n   **lowercase**\
    \ forces all letters to lowercase.\n   **none** overrides inherited text-case\
    \ values and leaves the text unaltered.\n\n**Code 6.5** text-properties.css—The\
    \ **text-transform** property lets you take control of the case of the text. The\
    \ author is forced to capitalize as the class `.asis`.\n\n```\n*** CSS3 V5 | Chapter\
    \ 6 | text-properties.\n/ css ***/\n\nbody {\n  line-height: 1.5;\n}\n\nh1 {\n\
    \  letter-spacing: -0em;\n  word-spacing: -1em;\n  line-height: .9em;\n}\n\nh2\
    \ {\n  letter-spacing: 2px;\n  word-spacing: 3px;\n}\n\nh2 strong {\n  letter-spacing:\
    \ 0;\n}\n\np {\n  word-spacing: .07em;\n  line-height: 24px;\n}\n\nheader + p:first-letter\
    \ {\n  letter-spacing: -0em;\n  line-height: 24px;\n}\n\nbyline {\n  word-spacing:\
    \ -.3em;\n}\n\nbyline .author {\n  word-spacing: 0;\n  text-transform: uppercase;\n\
    }\n\n.asis {\n  text-transform: uppercase;\n}\n```"
  merge: -1
  img_proc: true
