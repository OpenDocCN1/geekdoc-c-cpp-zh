    \ argument was, anything that a head could be beheaded, and you weren't so talk.\n\
    \n+   The Results of 4.11. A common typographic trick to draw the reader's eye\
    \ to the beginning of a paragraph is to use a drop cap and to bold the first line\
    \ of text, as shown here.\n\n![](img/9cd61ac1d4015ed5688d0c411434a660_116_0.png)\n\
    \n> Drop cap letters are a time honored way to start a new section or chapter\
    \ by making the first letter of a paragraph larger than subsequent letters and\
    \ moving several lines of text to accommodate the larger. Medieval monks used\
    \ drop caps with illuminated manuscripts. Now you can use them on the Web.\n\n\
