- pgno: 373
  md: '# Styling Links Versus Navigation


    The Web is nothing without links. Many designers are content to rely on default
    browser styles applied to their links, this is not only boring, it also makes
    all the links on your page look exactly the same, whether they are global navigation
    or content links.


    Styling links using pseudo-classes was covered in Chapter 4, but to bring your
    navigation to life, you need to style your links depending on the context.


    # Beyond Links: Using Access Keys to Improve Accessibility


    Although most people visiting the Web site will be using a mouse, many potential
    visitors may not be able to use a mouse effectively, or at all. To accommodate
    visitors using a keyboard or speech-recognition system to navigate the Web, you
    can include the accessibility attribute for important links:


    ```

    <a href="index.html" accesskey="h">Home (h)</a>

    ```


    Whenever visitors press the H key, this link will receive focus, so that users
    can then press (or speak) Return to access the page.


    # Style navigation and links:


    +   Create an CSS file called links.css (Code 14.3). This file contains the CSS
    needed to style the link types for Code 14.1.


    +   Style the default link styles. In the css file, add rules for the anchor tag
    and its :link, :visited, :hover, and :active states.


    ```

    a {

    :link {...}

    :visited {...}

    :hover {...}

    :active {...}

    }

    ```


    I recommend setting text decoration to "none" to eliminate the unattractive underlining.
    You can then add link underlining using the border-bottom property as needed.


    continues on page 352'
