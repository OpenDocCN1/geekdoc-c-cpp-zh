- pgno: 67
  md: "# Linking to style sheet\n\nExternal style sheet files can be applied to any\
    \ HTML file using the <link> tag. Linking a CSS file affects the document in the\
    \ same way as if the styles were embedded directly in the head of the document;\
    \ but by placing it in a separate file, the code can be reused across multiple\
    \ Web pages and changes made in the central file will affect all of those pages.\n\
    \n# To link an external CSS file:\n\n+   1. Add a tag to your HTML document. Within\
    \ the <head>...</head> of your HTML document (Code 3.6), open your <link> tag\
    \ and type a space.\n   ```html\n<link rel=\"stylesheet\" href=\"filename.css\"\
    \ type=\"text/css\" media=\"all\">\n   ```\n2. Specify the location of the link's\
    \ relation to the document as a stylesheet. This is important, since the link\
    \ tag can be used to add other file types. Leaving this out will cause many browsers\
    \ to not load the code.\n   rel=\"stylesheet\"\n3. Specify the location of the\
    \ CSS file to be used, either global or local. For example, ch01.css. This is\
    \ the full path and name (including extension) of the external CSS document. In\
    \ Chapter 15, you'll explore style sheet strategies for locating external style\
    \ sheets in relation to your HTML Documents.\n   href=\"ch01.css\"\n4. Specify\
    \ the type of information that is being linked. In this example, it's a text file\
    \ containing CSS.\n   type=\"text/css\"\n5. Specify the media to which this style\
    \ sheet should be applied. For more details, see \"Quarrying the Media\" in Chapter\
    \ 4.\n   media=\"all\">\n\n> TIP You can use the <link> tag to add as many style\
    \ sheets to a page as you want.\nTIP Keep in mind that the more style sheets you\
    \ link to, the more server calls your Web page makes, and the slower it loads.\
    \ Link as needed, but try to minimize links by combining files where possible."
  merge: -1
  img_proc: true
