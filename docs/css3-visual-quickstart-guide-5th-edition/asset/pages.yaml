- pgno: 250
  md: '# Putting It All Together


    +   1. Create a list and a table to experiment with. You can use a numbered or
    unnumbered list, but keep it simple. You''re just playing around, so maybe 3–5
    elements in the list and a 3×3 table should suffice.


    +   2. Set bullet style and position it outside. Try different bullet styles to
    see how they appear on your screen and then look at the code in different browsers
    to see if the bullets look any different.


    +   3. Create a bullet image using your favorite image editing software and use
    it as the bullet in your list. Make sure to save it in a Web-compatible image
    format: PNG, JPEG, or GIF.


    +   4. Combine all of your style declarations together into a single declaration.
    Do you notice any difference when you view your code in a Web browser? You shouldn''t.


    +   5. Set the table layout and border space on your table and set border collapse
    to separate. See what happens when you change the collapse value to collapse and
    you try to increase the border space.'
