    # ALICE''S ADVENTURES IN WONDERLAND


    by Lewis Carroll


    # Chapter I. Down the Rabbit-Hole


    Alice was beginning to get very tired of sitting by her sister on the bank, and
    having nothing to do: once or twice she had peeked into the book her sister was
    reading, but it had no pictures or conversations in it, ''and what is the use
    of a book,'' thought Alice ''without pictures or conversations?


    So she was considering in her mind (as well as she could, the hot day had made
    her feel very sleepy and stupid), whether the pleasure of making a daisy-chain
    was worth the trouble of getting up and picking the daisies, suddenly a White
    Rabbit with pink eyes ran by her.


    There was nothing very remarkable in that; nor did Alice think it so much out
    of the way to hear the Rabbit say to itself, ''Oh dear! Oh dear!'' (when she thought
    it over afterwards, it occurred to her that she ought to have wondered at it,
    at the time it seemed quite natural); but when the Rabbit actually took a watch
    out of his waistcoat-pocket, and looked at it, and hurried on, Alice started to
    feel that she had never seen a rabbit with either waistcoat-pocket, or a watch
    to take out of it, and burning with curiosity, she ran across the field after
    it, and fortunately was just in time to see it pop down a large rabbit-hole under
    the hedge.


