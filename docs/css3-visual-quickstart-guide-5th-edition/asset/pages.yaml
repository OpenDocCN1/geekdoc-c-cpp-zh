- pgno: 60
  md: '> TIP You never use inline styles in your final Web site. See the sidebar,
    “Why You Should Never Use Inline Styles in Your Final Site."


    > TIP So as not to confuse the browser, it is best to use double quotation marks
    ("") around the declaration list and single quotation marks (''\'') around values
    in the declaration list, as font names with spaces.


    > TIP Font names made of more than two words are placed in single quotes (''Font
    Name'') when used with a style.


    > TIP When you are copying and pasting code from an application such as Microsoft
    Word into a Web-editing application such as Adobe Dreamweaver, make sure that
    you convert all smart quotes ("") to straight quotes ("").


    # # Why You Should Never Use Inline Styles in Your Final Web Site


    Because inline styles are the last line of styling, you cannot override them using
    embedded or external style sheets. As a result, you are stuck with this style
    permanently or you have to change it manually, which may not always be possible.
    If you are working on a large scale Web site, the HTML code is often set independently
    of the styles, and designers may not be able to access that or easily change it.


    I once spent three days trying to rewrite a widget for a major Internet company,
    only to realize the link style wouldn''t change because the developer had an inline
    style. Because I couldn''t edit the HTML code, I was stuck.


    Inline styles can be useful for quickly testing styles. But to retain maximum
    flexibility, I recommend placing your final styles into external style sheets,
    as discussed later in this chapter.


    That said, it is likely that you will encounter places where a developer added
    inline styles to ensure design control. This is especially common in a content
    management system (CMS) such as WordPress or Drupal.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# Embedded: Adding Styles to a Web Page


    To add styles that apply to a single Web page—rather than just a single element
    (inline) or an entire Web site (external)—you embed the style rules in the Web
    page using the `<style>` tag, which in turn will hold all your rules.


    Adding styles in this manner can look identical to adding styles directly to an
    HTML tag (as seen in the previous section). However, when you place styles in
    a common location—preferably in the `<head>` of the document—you can easily change
    all of the styles in a document. For example, rather than specifying the style
    of a single `<h1>` tag, you can specify the style of all `<h1>` tags on the entire
    page, and then change the rule in one place to change the appearance of all level
    1 headers on that page.


    To set the style for tags in HTML document:


    +   1. Type the opening style tag in the head of your document (Code 3.2). Define
    the `type` attribute as "text/css", which defines the styles that follow as CSS,
    not just any style. Also, define the `media` type using a value of `all`, which
    will apply the style sheet to the page regardless of the type of machine used
    to output it. Then close the `style` tag.

    `<style type="text/css" media="all">...</style>`

    2. Add your CSS rules. Within the style container from step 1, start a new rule
    by typing the selector to which you want to add styles, followed by opening and
    closing curly brackets ({}).


    ![](img/9cd61ac1d4015ed5688d0c411434a660_61_0.png)'
  merge: -1
  img_proc: true
- pgno: 62
  md: '(Basic selectors—HTML, class, IDs, universal—are explained earlier in this
    chapter, and contextual selectors are explained in Chapter 4.)


    ```

    h1 {...}

    ```


    Within the brackets of your rule, the declarations to be assigned to this rule—formatted
    as property: value—using a semicolon (;) and separating individual declarations
    in the list.


    +   3. Add all the CSS rules you want to define. Rules obey the cascade order
    in detail (explained in Chapter 5). But generally, you can override a style by
    rewriting it lower in the list.


    ```

    h2 {...}

    ```


    > To make a rule more easily readable, you can also add one or more line breaks,
    spaces, or tabs after a declaration without interfering with the code.


    > Although you can place embedded styles anywhere in your HTML document, I highly
    recommend placing them at the top of your documents in the <head>; otherwise,
    the page will display without the styles at first and then blink as the page redisplays
    with the styles.


    > However, I do not recommend placing embedded styles in your final Web page at
    all. Although they aren''t difficult to override as inline styles, embedded styles
    can confuse you later when trying to redesign a page. It''s always best to put
    all your styles in an external style sheet (explained in the next section) where
    site-wide changes are easy to make.'
