- pgno: 115
  md: '# Working with Pseudo-elements


    Pseudo-element is a specific, unique part of an element—such as the first letter
    or first line of a paragraph—that can be styled independently of the rest of the
    element. (For a list of other pseudo-elements, see Table 4.5.)


    # Working with first lines and lines


    You can access the first letter of any block of text directly using the **:first-letter**
    pseudo-element. The first line of any block of text can be isolated for style
    treatment using the **:first-line** pseudo-element.


    # To highlight the beginning of an article:


    +   1. Style the default version of the element.

    ```css

    article p {...}

    ```nAlthough not required, it''s generally a good idea to set the default style
    of the selector for which you will be styling the **:first-letter** pseudo-element
    (**Code 4.11**)


    Table 4.5 Pseudo-Elements

    | Format | Name | Elements Are Styled If | Compatibility |

    | :--- | :--- | :--- | :--- |

    | :first-letter, ::first-letter | the first Letter | first letter in text | IE5.5,
    FF1, O3.5, S1, CSS1 |

    | :first-line, ::first-line | the first line of text | they are the first line
    of text | IE5.5, FF1, O3.5, S1, CSS1 |

    | :after, ::after | After | space immediately before element | IE8, FF1, O5, S1,
    CSS2 |

    | :before, ::before | Before | space immediately after element | IE8, FF1, O5,
    S1, CSS2 |


    ![](img/9cd61ac1d4015ed5688d0c411434a660_115_0.png)'
  merge: -1
  img_proc: true
- pgno: 116
  md: "# 4.11 Styles are set for the first letter and first line of the paragraph\
    \ in an article Ⓑ\n\n2. Style the first letter of the element if it is the first\
    \ of its type. Type the selector you want to style the first letter of (article\
    \ p), a colon (:), and then first-letter.\n\n```\n<!-- HTML -->\n<!DOCTYPE html>\n\
    <html lang=\"en\">\n<head>\n  <meta http-equiv=\"Content-Type\"\n  content=\"\
    text/html; charset=UTF-8\" />\n  <title>title</title>\n  <style type=\"text/css\"\
    \ media=\"all\">\n  article p {\n    font-size: 16px;\n    line-height: 24px;\n\
    \    color: rgb(102,102,102);\n  }\n  article p:first-of-type:first-letter {\n\
    \    color: red;\n    font-size: 3em;\n    float: left;\n    margin-right: 5px;\n\
    \  }\n  article p:first-of-type:first-line {\n    font-size: 1.25em;\n    font-weight:\
    \ bold;\n    color: rgb(0,0,0);\n  }\n</style>\n</head>\n<body>\n<article>\n<h1>Alice's\
    \ Adventures in Wonderland</h1>\n<p>The moment Alice appeared,...</p>\n<p>The\
    \ executioner's argument was,...</p>\n<p>The King's argument was,...</p>\n</article>\n\
    </body>\n</html>\n```\n\narticle p:first-of-type:\n  first-letter {...}\n\nTo\
    \ affect only the first paragraph in an article, you can add the :first-of-type\
    \ pseudo-class, as in this example.\n\n3. Style the first line of the element's\
    \ text if it is the first of its type. Use the selector (article p) for which\
    \ you want to style the first letter, a colon (:), and then first-line.\n\narticle\
    \ p:first-of-type:\n  first-line {...}\n\nIn this example, the first-of-type pseudo-class\
    \ is added so that the first paragraph in an article is styled.\n\n4. The element's\
    \ first letter and line of text is styled if it is the first of its type in the\
    \ parent element. Add a class attribute to the relevant HTML tag.\n\n<p>...</p>\n\
    \nAlthough you do not have to use a class, you will generally select the first\
    \ line of elements rather than them all universally.\n\n# Alice's Adventures in\
    \ Wonderland\n\nThe moment Alice appeared, they began by all to settle the crowd,\
    \ and repeated their arguments but, though they all spoke at once, she found very\
    \ hard to make out what they meant.\n\nThe executioner's argument was that he\
