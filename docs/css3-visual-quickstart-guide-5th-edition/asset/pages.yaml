- pgno: 108
  md: '# Picking Link Styles


    Most browsers default to blue for unvisited links and red for visited links. The
    problem with using two different colors for visited and unvisited links is that
    visitors may not remember which type of link. The colors you choose must distinguish
    links from other text on the screen and distinguish among the states (link, visited,
    hover, and active) without dominating the screen and distracting.


    I recommend using a color for unvisited links that contrasts with both the page''s
    background color and the text color. Then, for visited links, use a darker or
    lighter version of the same color that contrasts with the background but dimmer
    than the unvisited link color. Brighter unvisited links will then stand out dramatically
    from the dimmer links.


    For example, on a page with a white background and black text, I might use bright
    red for links (rgb(255,0,0)) and pale red (rgb(255,153,153)) for visited links.
    The brighter version stands out; the paler version is less distinctive, but obviously
    a link.


    > TIP In this example, the pseudo-classes are applied directly to the anchor tag,
    but class or ID could have been used as long as it was then applied to an anchor
    tag.


    > TIP You can apply the dynamic pseudo-classes:hover,:active, and :focus to any
    element, not just links.


    > TIP The general anchor link styles will be inherited by the different states
    and states. The font you use for the :link appearance, will be inherited by the
    :active,:visited, and :hover states.


    > TIP The Web is a hypertext medium, so it is important that users are able to
    distinguish them, links, and visited links. Because users don''t have Underline
    Links option turned on, it''s a good idea to set the link appearance for every
    document.


    > TIP If you use too many colors, your visitors may not be able to tell which
    links are links and which are not.


    > TIP The link styles are set for the entire page in this example, but links can
    be used for a variety of purposes. For example, links might be used for global
    navigation, in a list of article titles, or even as a dynamic control. To that
    end, it''s a good idea to style links depending on their usage:


    ```

    nav {...}

    nav:link {...}

    nav:visited {...}

    ```


    The preceding styles will be applied only to links in the navigation element.'
  merge: -1
  img_proc: true
- pgno: 109
  md: "# Styling for interaction\n\nOnce loaded, Web pages are far from static. Users\
    \ will start interacting with their pointers the right away, moving their pointers\
    \ across the screen and clicking hither and yon. The dynamic pseudo-classes allow\
    \ you to style elements as the user interacts with them, providing visual feedback:\n\
    \nCode 4.7 The input elements are set to change style when the user interacts\
    \ with them by hovering, selecting (focussed), or clicking (active) \n\n+   *\
    \ :hover—Same as for links, but sets the appearance of the element when the pointer\
    \ is hovering over.\n\n+   * :focus—Applied to elements that can receive focus,\
    \ such as text fields.\n\n+   * :active—Same as for links, but sets the style\
    \ of the element when it is clicked or selected.\n\n```\n<!-- HTML -->\n<DOCTYPE\
    \ html>\n<html lang=\"en\">\n<head>\n  <meta http-equiv=\"Content-Type\"\n   \
    \ content=\"text/html;charset=UTF-8\" />\n  <title>Alice's Adventures in Wonderland</title>\n\
    \  <style type=\"text/css\" media=\"all\">\n    input {\n      border: 3px solid\
    \ rgb(153,153,153);\n      background-color: rgb(204,204,204);\n      color: rgb(153,153,153);\n\
    \      padding: 0px;\n      font-size: 2em;\n    }\n    input:hover {\n    border-color:\
    \ rgb(204,153,153);\n    color: rgb(102,102,102);\n  }\n  input:focus {\n    border-color:\
    \ rgb(255,0,0);\n    background-color: rgb(255,255,255);\n    color: rgb(0,0,0);\n\
    \    outline: none;\n  }\n  input:active {\n    border-color: rgb(255,0,0);\n\
    \    background-color: rgb(0,0,0);\n  }\n</style>\n</head>\n<body>\n  <input type=\"\
    text\" value=\"First Name\">\n  <input type=\"text\" class=\"hover\" value=\"\
    Last Name\">\n  <input type=\"text\" class=\"focus\"\n    value=\"Email\"\n  <input\
    \ type=\"button\" class=\"active\"\n    value=\"Search\"\n</form>\n</body>\n</html>\n\
    ```\n\n# To define a dynamic pseudo-class:\n\n+   1. Style the default element.\n\
    input {...}\n\nAlthough optional, it's generally a good idea to set the default,\
    \ non-dynamic style for the elements receiving dynamic styles (Code 4.7).\n\n\
    +   2. Style the hover state of the element.\nType the selector (HTML, class,\
    \ or ID), a colon (:), and then hover.\ninput:hover {...}\n\nAs the pointer enters\
    \ the element's box (see Chapter 10 for details about the box model), the style\
    \ change will occur."
