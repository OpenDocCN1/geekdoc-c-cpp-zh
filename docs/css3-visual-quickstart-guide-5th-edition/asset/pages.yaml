  md: "# Learn CSS3— the quick and easy way!\n\n+   - Easy visual approach uses pictures\
    \ to guide you through the new features in CSS3 and show you what to do step by\
    \ step.\n- Concise steps and explanations let you get out and running in no time.\n\
    - Essential reference guide keeps you coming back again and again.\n- Whether\
    \ you’re a CSS newbie or an experienced veteran, this book will teach you all\
    \ you need to know—from the hottest new features in CSS3 to best practices for\
    \ typography, color, images, and layout— and much more!\n- Visit the companion\
    \ website at www.speaking-in-styles.com/css3vqs to download code samples so you\
    \ can work along with the author.\n\nJason Cranford Teague is a designer, writer,\
    \ and speaker helping people apply technology in creative ways. He has over 15\
    \ years experience designing in the online world with clear Virgin, Web MD, Siemens,\
    \ Coca-Cola Marriott, and Bank of America. His books include Typography and Speaking\
    \ in Styles: The Fundamentals for Web Designers. He is Director of User Experience\
    \ Design at Forum One (www.forumone.com) and personal blog at JasonSpeaking.com.\
    \ You can follow him on Twitter @jasonspeaking.\n\n| Peachpit Press \n| www.peachpit.com\
