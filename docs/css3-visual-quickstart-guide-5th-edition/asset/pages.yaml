- pgno: 85
  md: '# Grouping: Defining Elements Using the Same Styles


    If you want two or more selectors to have the same declarations, group the selectors
    in a list separated by commas A. You can define common attributes in the declaration
    block and add rules for each selector individually to refine them, if you like.


    # To group selectors:


    +   1. Add a grouping of selectors, separated by commas. Type the list of selectors
    (HTML, class, or ID) separated by commas. You can also add one or more line breaks,
    spaces, or tabs after a comma without interfering with the code to make it more
    readable.

    ```

    h1, h2, .byline, #gallery {...}

    ```nThese selectors all receive the same declarations. CSS rules can be defined
    within the style tags in the head of your document or in an external CSS file
    that is imported or linked to the HTML document.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '2. Add common declarations for the selector grouping. Within the curly brackets,
    type the style declarations to be assigned to all of the listed selectors—formatted
    as property: value—using a semicolon (;) and separating individual declarations
    in the list. You can also add one or more line breaks, spaces, or tabs after a
    declaration without interfering with the code to make it more readable.


    ```

    font-family: Constantia, Georgia, Times, "Times New Roman", Serif;

    ```


    3. Add refinements as needed. You can then individually add or change declarations
    for each selector to tailor it to your needs. If you are overriding a declaration
    set in the group rule, make sure that this rule is placed after the group rule
    in your CSS. (See "Determining the Cascade Order" in Chapter 4.)


    ```

    h1 {...}

    ```


    > TIP Grouping selectors like this can save a lot of time and repetition. But
    be careful. By changing the value of any of the properties in the combined declaration,
    you change that value for every selector in the list.


    > TIP Grouping selectors does not directly affect their cascade order (explained
    in Chapter 4); rather, the grouping is treated as if each selector had this rule
    assigned to it in the order the selectors are listed.'
  merge: -1
  img_proc: true
