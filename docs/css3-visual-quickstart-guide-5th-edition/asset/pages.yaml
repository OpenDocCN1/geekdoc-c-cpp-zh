  md: '# # Setting an Element''s Padding


    At first glance, **padding (Table 10.18)** seems to have an effect identical to
    margins: It adds space around the element. The difference is that **padding**
    sets the space between the border of the element and its content rather than between
    the element and the other elements in the window. Padding is useful when you''re
    using borders and background colors and don''t want the content but right up to
    the edges.


    Table 10.18 Padding Values


    | Value | Compatibility |

    | --- | --- |

    | <length> | IE4, FF1, S1, C3, CSS1 |

    | <percentage> | IE4, FF1, S1, C1, O3, CSS1 |

    | inherit | IE8, F1, S1, O7, CSS2 |


    # To setting padding:


    +   1. Start your declaration by typing the padding property name, followed by
    a colon (: (Code 10.12).


    padding:


    +   2. Type a value for the element''s padding.


    10px;

    Use one of the following values:


    +   * Length values, which create padding of the exact size you specify


    +   * A percentage, which creates padding proportional to the parent element''s
    width


    +   * inherit to use the parent''s padding width


    ```

    Code 10.12 ui-box-properties.css--Applied when

    to Code 10.1, the padding allows you to

    add space between the border of an element and

    content 8

    ```


