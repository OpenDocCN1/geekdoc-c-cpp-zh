- pgno: 283
  md: "# # Setting an Element’s Margins\n\nThe margin (Table 10.8) of an element allows\
    \ you to set the space between element and other elements in the window by specifying\
    \ one to four values that respond to all four sides together, the top/bottom and\
    \ left/right sides as pairs, or all four sides independent.\n\n# ### TABLE 10.8\
    \ Margin Values\n\n| Value | Compatibility |\n| --- | --- |\n| <length> | IE3,\
    \ FF1, S1, C1, O3, CSS1 |\n| <percentage> | IE3, FF1, S1, C1, O3, CSS1 |\n| auto\
    \ | IE6, FF1, S1, C1, O3, CSS1 |\n\nTo define the margins of an element:\n\n+\
    \   1. Start your declaration by typing the margin shortcut property name in the\
    \ declaration block, followed by a colon (:)(Code 10.7).\n\nmargin:\n\n### Code\
    \ 10.7 ui-box-properties.css—Applied to Code 10.1, margin is set to 0 in the body,\
    \ and margins are added to help space other elements in the screen\n\n```\n***\
    \ CSS3 Qs | Chapter 10 |\n  - box-properties.css ***\n\nbody, header.page, footer.page\
    \ {\n  margin: 0;\n}\n\nav.global {\n  display: block;\n  margin-left: 10px;\n\
    }\n\nav.global 1i {\n  display: inline;\n  margin-right: 10px;\n}\nnarticle {\n\
    \  max-width: 980px;\n  min-width: 660px;\n  float: left;\n  margin: 0 10px;\n\
    }\nnfigure {\n  display: block;\n  width: 300px;\n  float: left;\n  margin: 0\
    \ 10px 10px 0;\n}\nfigcaption {\n  display:block;\n}\nnaside {\n  display: block;\n\
    \  width: 200px;\n  height: 400px;\n  overflow: auto;\n```\n\n# ### Setting Negative\
    \ Margins\n\nAlthough you can use negative margins (for example, margin:-5em)\
    \ to create interesting effects for overlapping text, this method is frowned upon\
    \ because various browsers present different.\n\nOverlapping text is better achieved\
    \ using CSS positioning (see Chapter 1). Be careful when setting negative margins\
    \ around a hyperlink. If one element has margins that cause it to cover the link,\
    \ the link will not work as expected.\n\ncode continues on next page"
  merge: -1
  img_proc: true
- pgno: 284
  md: "# Code 10.7 continued\n\n```\nfloat: right;\n  margin: 0 10px;\n\nfooter {\n\
    \  width: 100%;\n  clear: both;\n}\n```\n\n# 2. Type a value for the margin.\n\
    \n0 10px;\n\nUse one of the following values:\n\n+   - A length value\n- A percentage,\
    \ which creates a margin proportional to the parent element's width\n- auto, which\
    \ returns control of the margins to the browser's discretion\n\nYou can enter\
    \ one to four values, separated by spaces, to define the margins as:\n\n+   -\
    \ One value sets the margin for all four sides equally.\n- Two values set the\
    \ top/bottom margins (the same) and left/right margins.\n- Three values set the\
    \ top margin, the left/right margins (same), and the bottom margin.\n- Four values\
    \ set each margin clock-wise, starting from top: right, bottom, and left.\n\n\
    ![](img/9cd61ac1d4015ed5688d0c411434a660_284_0.png)\n\nYou can also set the margin\
    \ for just one side of the box independently without setting the other margins.\n\
    \nmargin-right: 10px;\n\nCode 10.7 applied to Code 10.1: The header fits snugly\
    \ at the top of the window and stretches the entire width, and the figure has\
    \ a little more room around it.\n\nThis is useful when using an inline style set\
    \ elsewhere. To do this, specify the margin side you want to define (margin-top,\
    \ margin-bottom, margin-left, or margin-right) and enter a legitimate value from\
    \ Table 10.8."
  merge: -1
  img_proc: true
- pgno: 285
  md: 'You can also set margins for the <body> tag; in which case the margins define
    the distance that elements nested in the body should appear from the top and left
    sides of the browser window.


    The best way to center an element within its parent element is to set the margins
    on the left and right to auto. This is how most Web pages with the content centered
    in the browser window are created.


    When setting proportional margins, be aware that you might get very different
    results depending on the size of the user''s window. What looks good at a resolution
    of 800 x 600 might be a mess at a larger screen.


    The browser has a default margin that it adds to the body of your page so the
    content doesn''t immediately begin at the edge of the screen. However, the default
    is not the same on all browsers, which can be a problem when you position elements
    on the page (see Chapter 11). It''s a good idea to set the margins in the body
    tag so that they remain consistent using a CSS reset, as explained in Chapter
    13.


    # Margin Collapse


    When two elements stacked vertically on top of each other determine the vertical
    margin between them, rather than adding the bottom and top margin together, the
    larger margin will be used, with the smaller margin collapsing to 0. This allows
    you to keep consistent margins at the top and bottom of a collection of stacked
    elements.'
  merge: -1
  img_proc: true
- pgno: 286
  md: "# TABLE 10.9 Outline Values\n\n| Value | Compatibility |\n| --- | --- |\n|\
