- pgno: 125
  md: '+   - Orientation looks for landscape (height greater than width) or portrait
    (width greater than height) layout. This allows you to tailor designs for devices
    that can flip.


    +   - Color-index, and monochrome finds the number of colors or bits per color.
    These allow you to tailor your design for black and white mobile devices.


    +   - Resolution looks at the density of pixels in the output. This is especially
    useful when you want to take advantage of display devices that have a higher resolution
    than 72 dpi.


    By default, media queries are for the viewport (see Chapter 11 for details on
    the exception of those that specify device, in which case they are for the entire
    screen or output area. For example, width is the width of the visible browser
    viewport within the screen, whereas device-width is the width of the entire screen.'
  merge: -1
  img_proc: true
- pgno: 126
  md: "# 4.14 default.css—These styles are applied regardless of the media type and\
    \ include sans-serif fonts, a dark background, and light text.\n\n# Using media\
    \ queries to specify styles:\n\n+   1. Create your style sheets. Create a default\
    \ style sheet that captures all the general styles for your design and save it.\
    \ I like to call mine default. css (Code 4.14).\n\nCreate style sheets for the\
    \ various media or specific devices for you will be designing. Print is generally\
    \ good to include (Code 4.15). You can call the sheet print.css, but you might\
    \ also want to create style sheets specifically for popular mobile devices such\
    \ as the iPhone (Code 4.16), which you could use iphone.phone.\n\n```\n*** Default\
    \ Styles ***\nbody {\n  background: black url('../images/AAIW-illos/\n  -alice2a.gif')\
    \ no-repeat 0;\n  margin: 0;\n  padding: 200px 0 175px;\nh1 {\n  color: white;\n\
    \  font-style: italic;\nh2 {\n  color: rgb(153,153,153);\npp {\n  font: normal\
    \ 100%1/5 Corbethel,\n  Arial, Sans-serif;\n  color: rgb(204,204,204);\n}\n```\n\
    \nCode 4.15 print.css—These styles are tailored for the printed page, changing\
    \ the background to white (using white paper), serif fonts, black text, and a\
    \ different background image to match.\n\nCode 4.16 iphone.css—These styles are\
    \ specific for use on an iPhone and are loosely based based on that device's look\
    \ and feel.\n\n```\n*** For Print ***\nbody {\n  background: white url('../images/AAIW-illos/\n\
    \  -alice2a.gif') no-repeat 0;\n  padding: 200px 0 175px;\nh1 {\n  color: black;\n\
    p {\n  font: normal 12pt/2 Constantia, palatino,\n  times, \"times new roman\"\
    , serif;\n  color: rgb(0,0,0);\n}\n```\n\n```\n*** iPhone Styles ***\nbody {\n\
