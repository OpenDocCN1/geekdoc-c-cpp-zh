- pgno: 239
  md: "# Setting the Bullet Style\n\nThe list-style-type property (Table 8.1) controls\
    \ the type of bullet to be used for list items—not just circles, discs, discs\
    \ and squares, but also letters and numerals and dots and our own custom image\
    \ bullets.\n\nTo define the bullet style:\n\n+   Add the list style type property\
    \ to your declaration list. Type list-style-type, followed by a colon: (Code 8.2).\n\
    list-type:\nSpecify the bullet type. One of the bullet names listed in Table 8.2,\
    \ or type none if you do not want a marker to appear.\ncircle:\n\nTable 8.1 List-Style-Type\
    \ Values\n| Value | Compatibility |\n| --- | --- |\n| <bullet name>* | IE4, FF1,\
    \ O3.5, CSS1 |\n| none | IE4, FF1, S1, O3.5, CSS1 |\n| inherit | IE7, FF1, S1,\
    \ O7, CSS1 |\n\n* See Table 8.2\n\nCode 8.2 list-table-properties.css—the list-style-type\
    \ property is used to choose between the different bullet and number styles for\
    \ your list:\n\n```\n*** CSS3 V05 | Chapter 8 |\n- list-table-properties.css ***\n\
    \nul\n  list-type: circle; ;\n\nav.global ul\n  list-type: none;\n```\n\nTable\
    \ 8.2 List-Style Bullet Names\n| Name | Appearance (varies depending on system)\
    \ |\n| --- | --- |\n| disc | |\n| circle | |\n| square | |\n| decimal | 1, 2,\
    \ 3 |\n| decimal-leading-zero | 01, 02, 03 |\n| upper-roman | I, II |\n| lower-roman\
    \ | ii, iii |\n| upper-alpha | A, B, C |\n| lower-alpha | a, b, c |\n| lower-greek\
    \ | α, β, ζ\n\n> Although the list item <li> is used in this example, you can\
    \ turn any element into a list item by using the CSS properties along with the\
    \ definition display: list-item. See Chapter 10 for more information.\n\n> You\
    \ can change the bullet type or image using pseudo-classes like :hover, :visited,\
    \ and :link.\n\n![](img/9cd61ac1d4015ed5688d0c411434a660_239_0.png)\n\nCode 8.2\
    \ applied to code 8.1: Bullets are changed from dashes (default) to circles."
  merge: -1
  img_proc: true
- pgno: 240
  md: "# Creating Your Own Bullets\n\nTABLE 8.3 List-Image-Values\n| Value | Compatibility\
    \ |\n| --- | --- |\n| <url> | IE4, FF1, S1, O3.5, CSS1 |\n| none | IE4, FF1, S1,\
    \ O3.5, CSS1 |\n| inherit | IE7, FF1, S1, O4, CSS1 |\n\nYou're not limited to\
    \ the preset bullet styles built into a browser. You can also use your graphics\
    \ built from GIF, JPEG, and PNG files by applying the list-style-image property\
    \ (Table 8.3).\n\nCode 8.3 list-table-properties.css—I create a small arrow graphic\
    \ A (saved as a transparent PNG) to be inserted as the bullet using list-style-image\
    \ B.\n\nTo define your own graphic bullet:\n\n```\n*** CSS V5 | Chapter 8 |\n\
    list-table-properties.css ***\n\nul {\n  list-style-type: circle;\n  list-style-image:\
    \ url(../images/bullet-01.png);\n}\n```\n\n+   1. Add the list-style-image property\
    \ to your CSS rule. Type list-style-image, followed by a colon: (Code 8.3).\n\n\
    list-style-image:\n\n+   2. Specify the location of your image bullet. To include\
    \ your own bullet, you have to tell the browser where your bullet graphic file\
    \ is located.\n\nurl(arrow_02.png);\n\nType the complete Web address or relative\
    \ path of the image. In this example, arrow_02.png is a local file.\n\nAlternatively,\
    \ use 'none' to override any inherited bullet images.\n\n> Bullets are out of\
    \ the layout frame by default, they may fall outside the width of the list if\
    \ they are particularly long.\n\n![](img/9cd61ac1d4015ed5688d0c411434a660_240_0.png)\n\
    \nCHARACTERS\nAlice: The character has been based on Alice in Wonderland, but\
    \ the little character was not based on any real child; Carroll wrote 'The White\
    \ Rabbit, who was so late for a date' in 'Alice's Adventures in Wonderland'.\n\
    Alice: The Mad Hatter was made from the 'Alice' hat, and meant as a character.\
    \ He talks constantly, so he imagines him in shapes.\nAlice: The character of\
    \ the author is a bit peculiar but not understandable; Dodgson chose the portrait\
    \ to represent himself as the author, and thus used his own.\nAlice: Alice is\
    \ not the Caterpillar she met at first, because she does not know how to behave\
    \ when appropriate; he is usually smoking, being rude, or asking difficult questions.\n\
    Alice: The Duchess is an opponent of the Queen of Hearts; it is her appears, and\
    \ the Duchess is a mean character.\nAlice: The Cheshire Cat: Alice first encounters\
    \ the Duchess in her kitchen, and then she runs away.\n\n> Code 8.3 applied to\
    \ code 8.1: The bullet sits to the left of the text, but no padding is set, it\
    \ actually goes off the edge of the page.\n\n> Keep in mind that the text being\
    \ bulleted has space for the graphic you use. A taller graphic will have more\
    \ space between bulleted items, and a wider graphic will have items further to\
    \ the right.\n\n> To be honest, few developers use the list-style-image property\
    \ to add padding to their designs. Most developers will use the background property\
    \ with padding to get more precise styling. Want to know how to do this? Check\
    \ out Chapter 17, 'Navigation, Buttons, and Controls.'\n\nList and Table Properties\
    \ 217"
  merge: -1
  img_proc: true
- pgno: 241
  md: "# Setting Bullet Positions\n\nOften, the text of a bulleted list item is longer\
    \ than one line. Using the list-style-position property (Table 8.4), you can specify\
    \ the position of wrapping text in relation to the bullet. Wrapped text that is\
    \ indented to start before the first line of text is called a hanging-indent.\n\
    \nTo define the line position for wrapped text in a list item:\n\n+   1. Add the\
    \ list-style-property to your declarations. Type list-style-position, followed\
    \ by a colon (:) and one of the values described in step 2 (Code 8.4).\nlist-style-position:\n\
    2. Specify the position type.\ninside;\n one of the following values to set text\
    \ indentation:\n* inside aligns the left edge of the bullet with the left edge\
    \ of subsequent text.\n* outside left aligns the first line of text with subsequent\
    \ text, placing the bullet as a hanging indent.\n\nTABLE 8.4 List-Style-Position\
    \ Values\n| Value | Compatibility |\n|---||\n| inside | IE4, FF1, S1, O3.5, CSS1\
    \ |\n| outside | IE4, FF1, S1, O3.5, CSS1 |\n| inherit | IE7, FF1, S1, O4, CSS1\
    \ |\n\n> > Outside...Magnus es, domine, et laudabilis vitae: magna virtua tua,\
    \ sapientae non est error. et tenere de tuo homo.\n> Inside...Magnus es, domine,\
    \ et laudabilis vitae: magna virtua tua, sapientae non est error. et tenere de\
    \ tuo homo.\n Outside is generally how bulleted lists are presented. You may want\
    \ to override that by using inside.\n\nCode 8.4 list-style-properties: The list-style-position\
    \ property allows you to specify how lines of text flow under the bullet.\n\n\
    ```\n### CSS3 V8 | Chapter 8 |\n*** list-table-properties.css ***\n{\n  list-style-type:\
    \ cycle;\n  list-style-image: url(../images/bullet-01.png);\n  list-style-position:\
    \ inside;\n}\nav.global {\n  list-style-type: none;\n  list-style-position: outside;\n\
    }\n```\n\n# CHARACTERS\n\n> > Alice The character has been based on a legend,\
    \ from Homeric Odysseus ever seen on the Stage. While she was not based on any\
    \ real person, she was mysterious.\n> The White Rabbit: In \"Alice in Wonderland\"\
    , the \"White and the Rabbit\" is what he became. From Alice's meets, as characters\n\
    > The Cheshire Cat: Alice likes the cat's smirk and long tail; while watching\
    \ it, she imagines the face in shape.\n> The Dodo is a creature of the author,\
    \ a perhaps unintended but delightful character, who has accidentally introduced\
    \ himself as \"Do-Dodo\".\n> The caterpillar is a wise character when they meet\
    \ him, because he immediately talks to her and when he does, it is usually in\
    \ short, rather rude sentences, or difficult questions.\n\nCode 8.4 applied to\
    \ code 8.1: The bullet pushes into the text, so that its left edge is flush with\
    \ the left edge of subsequent lines of text.\n\n> TIP Generally, bulleted lists\
    \ that have a hanging indent (outside position) stand out much better than without\
    \ a hanging indent (inside position)."
  merge: -1
  img_proc: true
