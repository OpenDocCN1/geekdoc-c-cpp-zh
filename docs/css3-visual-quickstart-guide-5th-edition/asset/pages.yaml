  md: '# 2. Type a value for the element''s width.


    80%;

    Use one of the following values

    (Table 10.2):


    +   - A length value, generally in pixels

    - A percentage, which sets the width proportional to the parent element''s width

    - auto, which uses the width calculated by the browser for the element—usually
    the maximum distance that the element can stretch to the right before hitting
    the edge of the window or the edge of a parent element


    TABLE 10.2 Width and Height Values

    | Value | Compatibility |

    |---|---|

    | <length> | IE4, FF1, S1, C1, O3.5, CSS1 |

    | <percentage> | IE4, FF1, S1, C1, O3.5, CSS1 |

    | auto | IE4, FF1, S1, C1, O3.5, CSS1 |

    | inherit | IE4, FF1, S1, C1, O3.5, CSS1 |


    # To define the height of an element:


    +   1. Type the height property name in the CSS declaration block, followed by
    a colon (:):


    height:

    2. Type a value for the element''s height.

    500px;

    Use one of the following values

    (Table 10.2):


