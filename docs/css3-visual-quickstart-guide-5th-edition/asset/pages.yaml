- pgno: 387
  md: '# Use section headers and dividers


    Although section headers and dividers aren''t anything more than CSS comments,
    they help organize your CSS and allow you to quickly scan your code to locate
    particular CSS rule groups. If you have established a TOC, I recommend reflecting
    that organization here. In this example (Code 15.3), I''m using asterisks to indicate
    a section level.


    # The @ rules go at the top


    All of the CSS rules starting with @ (@media, @font-face, @import) need to be
    placed above any other CSS in the external style or embedded style sheet. In addition
    to making these rules easier to find, many of them won''t work unless they''re
    placed at the top.


    Code 15.3 Section dividers used to organize the CSS file. Notice that they mimic
    the TOC.


    ```

    /* HTML Selectors */


    /** HTML Selectors | Headers */


    /* Content */


    /** Content | Aside */


    *** Content | Aside | Right */


    *** Content | Aside | Left */


    /** Content | Article */

    ```'
  merge: -1
  img_proc: true
- pgno: 388
  md: '# Choose an organization scheme


    You should choose a consistent organization pattern and stick to it. I''m not
    going to tell you how to organize your style sheets—that depends on what works
    for you—but here are a few ideas to consider:


    +   - Organize by selector type. Start with HTML selectors, then IDs, and then
    classes.


    +   - Organize based on page structure. Group rules based on their parent tags.
    This works even with HTML5 because page structure is stronger. The downside occurs
    when the same rules need to be applied at different places in the page. You don''t
    want redundant code, so it''s best to separate those rules into their own section.


    +   - Organize based on purpose. Group rules based on which element style is being
    applied to. Instead of being grouped according to where the element is in the
    page, the styles are grouped based on their content, module, functionality, or
    other specific use (such as headings, typography, ads, article, asides, layout
    grid, and so on.)


    +   - Organize alphabetically. Literally the selectors in alphabetical order.
    No, really. I''ve never used this method, but I''ve heard several developers swear
    by it. To me, it seems like a lot of work to maintain this organization scheme.
    Plus, what if you need to override a style later in the cascade, but it doesn''t
    fit alphabetically?


    You can use one of these methods, a combination of these methods, or a method
    you make up yourself. The key is to be consistent.'
  merge: -1
  img_proc: true
- pgno: 389
  md: '# Use specificity for hierarchy


    Regardless of the overall organization scheme you choose, specificity (explained
    in Chapter 4) provides a natural organizational hierarchy for CSS rules (Code
    15.4). Simply organizing your CSS rules using the selector specificity can make
    it a lot easier to find rules and track down problems.


    Code 15.4 CSS rules ordered by specificity hierarchy. This makes them easier to
    follow.


    ```

    article {...}

    article .intro {...}

    article .intro figure {...}

    article .intro figure figcaption {...}

    article .intro p {...}

    article .intro em {...}

    article .intro p:firstline {...}

    ```'
  merge: -1
  img_proc: true
- pgno: 390
  md: '# CSS Libraries and Frameworks


    A CSS library is simply a collection of common styles that you use throughout
    one Web site and potentially Web sites. The library can include your CSS reset,
    general typography, general transitions, or any other style that requires consistency.


    CSS Frameworks allow you to quickly deploy well-tested and finely crafted CSS
    code to your own Web site. Generally, CSS frameworks are free, community-based
    efforts maintained by interested volunteers.


    For simple Web sites, Frameworks can be overkill, adding a lot of code that will
    never be used. However, even for medium-sized sites, Frameworks can be a real
    time-saver.


    Some of the more popular CSS Frameworks include:


    ![](img/9cd61ac1d4015ed5688d0c411434a660_390_0.png)


    +   - Blueprint—Provides a solid layout grid, typographic styles, and a style
    sheet for printing pages.

    - Ematic—Uses em to create elastic layouts.

    - Typogridphy—Uses 12 and 16 column grids at 960px wide and typographic style
    rules to create a strong vertical rhythm.

    - YUI Grids—Yahoo’s CSS Grids framework provides fixed and fluid layouts.


    Visit blue.blueprintcss.org.


    Visit code.google.com/p/ematic.


    Visit cssswizardry.com/typogridphy.


    Visit developer.yahoo.com/yui/grids.'
  merge: -1
  img_proc: true
- pgno: 391
  md: '# Style Sheet Strategies


    Once your libraries, frameworks, and site-wide CSS are ready to go live, you need
    to pick the best strategy for deployment. It is always recommended that you place
    all your styles in one or more external style sheets, and then use either <link>
    or @Import code to apply them to a Web document.


    At this juncture, you have two competing priorities:

    - **Keep the file size as small as possible.** The larger the file size, the longer
    it takes to download. Of course, because it''s text, your files have to be pretty
    large for this to be a problem, but it happens.

    - **Keep the number of links and imports as low as possible.** The more links
    and imports you have to external CSS files, the more the server calls you make,
    and the slower the page will load.


    You can reduce file size by splitting style sheets into multiple external files
    and linking only to the ones you need, but this means more links. You can have
    a single, all-inclusive CSS file, but such a file can grow quite large. Your job
    will be to balance these two issues. Here are a few methods for doing so.


    # The One For All method


    The One For All method includes all your styles in a single master style sheet.
    With this method, creating well-organized and readable style sheets with a TOC
    is critical because you may be poring through hundreds or even thousands of lines
    of code.

    **Pros—**One download is faster than multiple downloads, and the file is cached
    for use on other pages. In addition, with all of your code in one place, you don''t
    have to worry about whether a page has access to the right styles.


    ![](img/9cd61ac1d4015ed5688d0c411434a660_391_0.png)'
  merge: -1
  img_proc: true
- pgno: 392
  md: 'Cons—This method may lead to large file sizes that can slow down the page loading
    time and take longer to render. Additionally, these files are harder to manage
    and edit.


    # The Divide and Conquer method


    The Divide and Conquer method uses multiple links to multiple style sheets on
    an as-needed basis per page. Start with a link to a file with global styles used
    by all pages, and then add links to styles used for that page only. For example,
    if you use a special carousel module on the main page, it would not go into the
    global file, but would exist as a separate CSS file for the home page or as part
    of a CSS file of general components 1.


    ![](img/9cd61ac1d4015ed5688d0c411434a660_392_0.png)


    +   1 The Divide and Conquer method splits the CSS into multiple files, which
    are then applied only if they are relevant to the page.'
  merge: -1
  img_proc: true
- pgno: 393
  md: 'Pros—Mix and match sheets from your library to load only the styles need and
    reduce bloated file sizes. Plus, as long as you keep your files organized, these
    are generally easier to edit.


    Cons—Multiple files mean multiple server calls, which slows downloads. Plus, multiple
    files can be hard to keep up with, and their cascade order can conflict in unpredictable
    ways.


    # The Aggregate method


    The Aggregate method uses @import to collect all the relevant CSS files from your
    library. The HTML document then has to link to only a single external file.


    Pros—Similar to the Divide and Conquer method, but by using only a single link,
    it''s easier to add or remove styles as needed because they are in a single CSS
    file rather than spread out across multiple HTML files.


    ![](img/9cd61ac1d4015ed5688d0c411434a660_393_0.png)


    The Aggregate method uses the @import rule to bundle the style sheets into a single
    file that is linked to the HTML document.'
  merge: -1
  img_proc: true
- pgno: 394
  md: 'Cons—Similar to the Divide and Conquer method but worse. This used to be a
    very popular CSS strategy until someone discovered that using @import often prevents
    external style sheets from loading simultaneously. Instead, they must load one
    after another, which slows down. Additionally, since the linked parent style sheet
    has to load before the imported style sheets are seen by the browser, this method
    can lead to the page rerendering as new styles become available.


    # The Dynamic method


    The Dynamic method relies on your skills as a CSS coder, but on your skills server-side
    code. It is possible to write server scripts that take aggregated CSS file full
    of @imports and combine them on the server into a single file for deployment D.


    Pros—Combines the ease of use and lean file size of the Aggregate method with
    the speed of the One For All method.


    Cons—Requires server-side coding that is beyond the scope of this book. Talk to
    your server admin or developer for more details.


    ![](img/9cd61ac1d4015ed5688d0c411434a660_394_0.png)


    D The Dynamic method relies on the server to dynamically bundle the relevant CSS
    for an HTML document into a single CSS file.'
  merge: -1
  img_proc: true
- pgno: 395
  md: "# Troubleshooting CSS Code\n\nAll too often, you carefully set up your style\
    \ sheet rules, go to your browser, and see... nothing. Or the page is displayed\
    \ as an ugly mishash of content. Don't worry; this happens to everyone. Before\
    \ you panic and throw your expensive laptop out the window, read through these\
    \ suggestions.\n\n# Ask these questions\n\nMany things could be preventing style\
    \ sheet rules from working properly; most of them are easily spotted. points out\
    \ some common problems you may encounter:\n\n```\nIs this the correct URL? Link\
    \ relation not defined\n\n<html>\n<head>\n  <link src=\"myStyles.css\" media=\"\
    all\">\n  <style type=\"text/css\" media=\"screen\">\n\nbody { font-size: 16px;\
    \ }\n\nmystyle {\n  cursor: pointer; /* Missing ,\n  font-family: times new roman;\
    \ Multi word font names\n  font-size: bold; } /* need quotes\n\n/* This should\
    \ be \"font\"\nIs this on ID or a class?\n\nBold is not a font size\n/* This style\
    \ should be used with paragraph text */ Missing */\n\n.copy { font-size: 12px;\
    \ } /* Missing */\n\nMissing / <style>\n</head>\n<body>\n  <p id=\"copy\">\n \
    \   Howday Tara!\n    Copy is a class, not on ID\n</body>\n\nErrors are inevitable,\
    \ but don't let them ruin your day. This figure shows some of the most CSS problems.\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 396
  md: '+   Are you missing semicolons?

    A missing semicolon at the end of a declaration will cause the entire rule to
    fail.


    +   Did you remember to set the link relation? If you leave out the rel property,
    many browsers will not load the external style sheet.


    +   Did you open and close the declaration block with curly brackets? If not,
    there''s no telling what will happen.


    +   Did you remember to close all multiline comment tags? If not, the rest of
    the CSS is treated as a comment. (See “Adding Comments to CSS” Chapter 3.)


    +   Does your selector contain typos?\If you forget the opening period or sign
    (#) for classes and IDs, they won''t work.


    +   Did you mix up a class with an ID or versa? I often think I''ve set up an
    ID, but it was actually a class.


    +   Do the properties contain typos?

    typos in one property can cause the entire rule to fail.


    +   Are the values you''re using permitted for that property? Using improper values
    may cause a definition to fail or behave unpredictably.


    +   Does this property work on the browser you are testing on? This is especially
    a problem if you are using new CSS3 properties. See Appendix A to make sure a
    property works you are using.


    continues on next page'
  merge: -1
  img_proc: true
- pgno: 397
  md: '+   - If your rules are in the head, did you use the <style> tag correctly?
    Typos in the <style> tag mean that none of the definitions are used. In addition,
    if you set the media type, the styles will affect only the output to that medium.
    So setting the media type to print will prevent those styles from affecting content
    displayed on the screen. (See "Adding Styles to a Web Page" in Chapter 3.)


    +   - If you are linking or importing style sheets? Check the exact path for the
    file. Also, remember that you should not include the <style> tag or any other
    non-CSS code in an external CSS file. (See "Adding Styles to a Web Site" in Chapter
    3.)


    +   - Do you have multiple, conflicting rules for the same tag? Check your cascade
    order. (See "Determining the Cascade Order" in Chapter 4.)'
  merge: -1
  img_proc: true
- pgno: 398
  md: '# If all else fails, try these ideas


    If you''ve looked for the preceding errors and still can''t get your code to work,
    here are a few more things to try:


    +   Make the declaration important.

    Often, your declarations will conflict with each other, and it may be hard to
    track down where the conflict is. Adding important to the declaration (see "Making
    a Declaration Important" in Chapter 4 will ensure that if it is working, it is
    applied to the page.


    +   Delete the rules and retype them.

    When you can''t see what''s wrong, retyping code from scratch sometimes fixes
    the problem.


    +   Test the same code on another browser and/or operating system. It''s possible
    that a property is buggy and doesn''t work correctly in your browser. It''s even
    possible that the browser doesn''t allow that property to work with that tag.


    +   Give up and walk away. Just joking—although you might want to take a 15-minute
    break before looking at the problem again.


    +   If nothing else works... Try a different solution for your design.'
  merge: -1
  img_proc: true
- pgno: 399
  md: '# Debugging CSS in Firebug and Web Inspector


    Both tools allow the on-the-fly editing of the CSS and HTML of the Web page you
    are viewing, which allows you to modify and debug your code on your local computer
    without affecting the live version. Although each tool has many unique features,
    share several key capabilities for working with CSS:


    +   - Highlight elements. As you roll over elements on the screen, they are highlighted
    in the HTML code or vice-versa.


    +   - View all rules applied to an element. As elements are selected, the applied
    CSS code is displayed, showing declarations that have been overridden crossed
    out.


    +   - Turn declarations on and off. You can selectively enable and disable declarations
    to see how they affect the design.


    +   - Edit declaration properties and values. In addition to switching declarations
    on and off, you can directly edit or add them to a rule.


    +   - View errors. Display any HTML or CSS errors encountered.'
  merge: -1
  img_proc: true
- pgno: 400
  md: '# Firebug for Firefox


    The Firebug plug-in tool for Firefox has become the de facto standard for Web
    designers everywhere. You can get it from the Firefox add-ons Web site or directly
    from the Firebug Web site, getfirebug.com (Win/Mac).


    # Getting started with Firebug


    +   1. Open the Firebug panel. Navigate to the Web page you want to look at and
    then click the Firebug icon in the lower right of the browser window or choose
    Firebug.


    continues on next page


    ![](img/9cd61ac1d4015ed5688d0c411434a660_400_0.png)'
  merge: -1
  img_proc: true
- pgno: 401
  md: '+   2. View the CSS. You can view the CSS by itself by clicking the CSS tab,
    or view it side by side with the HTML by clicking the HTML tab. I generally work
    in side-by-side mode.


    +   3. inspect an element. Click the Inspect button and then click the element
    in the screen you want to inspect. As you hover over an element, its box will
    be outlined with color-coded margins and padding. Firebug also highlights the
    element in the HTML code and displays all of the CSS being applied. Declarations
    are crossed out if they have been overridden by other declarations and are not
    being applied. Click to select an element for editing.


    +   4. Turn off a declaration. Hover to the left of the property name in the declaration,
    and a *not* symbol 🚫 appears. Click it to turn off the property , and click it
    again to turn on the property. In the viewport, you should immediately see the
    effect of turning the property and off.


    +   5. Edit a declaration. Double-click the property name or value and you can
    type a new one. The effects of any changes will be visible almost immediately
    as you type.


    +   6. Add a new declaration. Double-click the empty space to the right of the
    declaration you want to precede your new declaration, type the property name,
    press Tab, and then type the property value. Do not type the closing semicolon
    (;). Changes should appear instantly as you type.'
  merge: -1
  img_proc: true
