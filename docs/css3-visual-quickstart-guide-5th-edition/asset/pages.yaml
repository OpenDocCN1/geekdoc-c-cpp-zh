- pgno: 417
  md: 'The following tables include all of the CSS properties included in this. To
    make it easier to scan for just those properties that will work, symbols indicate
    if a value is available for use (or not) by a particular browser:


    +   - Available—Supported. Supported in all versions of the browser in common
    usage.


    +   - Recently Available—Versions of the browser may still be in common use that
    do not support this value.


    +   - Not available—Not supported in any version of this browser.


    # Table value legend


    Applies to All—Property can be applied to any HTML tag.


    Applies to Block—Property can be applied only to block-level tags.


    Applies to Inline—Property can be applied only to inline tags.


    Inherited—Yes—Styles are also applied to descendant elements.


    Inherited—No—Styles are not applied to descendant elements.


    Default Value:value—Values in bold are the default values for that property.


    # Browsers legend


    +   IE Internet Explorer


    +   FF Firefox


    +   S Safari


    +   C Chrome


    +   O Opera


    # What about IE9?


    At the time of this writing, IE9 had not yet been released to the public, but
    in beta. IE9 promises much wider support of CSS3, but until it is released, it''s
    impossible to know how complete that final support will be. I will publish an
    update to the book’s support Web site (www.speaking-in-styles.com/css3vqs) when
    it becomes available (Table A.1).


