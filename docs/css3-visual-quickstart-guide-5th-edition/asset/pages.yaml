  md: "# # Decorating Text\n\nUsing the **text-decoration property** (Table 6.11),\
    \ you can adorn text in one of three ways: underline, overline, or line-through.\
    \ Used to add emphasis, decorations attract the reader's eye to important areas\
    \ or passages on your Web page.\n\nTo decorate (or undecorate) text:\n\n+   1.\
    \ Add the text decoration property.\n   **Type-decoration in the CSS declaration\
    \ list**, followed by a colon (: (**Code 6.11**).\n   **text-decoration:**\n2.\
    \ Specify the text decoration you want (or not).\n\nType a value for the **text-decoration\
    \ property**. Choose one of the following:\n\n+   * **underline** places a line\
    \ below the text.\n* **overline** places a line above the text.\n* **line-through**\
    \ places a line through the middle of the text (also called strikethrough).\n\
    * **none** overrides decorations set elsewhere.\n\nTable 6.11 Text-Decoration\
    \ Values\n| Value | Compatibility |\n|---|---|\n| none | IE3, FF1, S1, C3, CSS5\
    \ |\n| underline | IE3, FF1, S1, C3, CSS1 |\n| overline | IE4, FF1, S1, C1, O3,\
    \ CSS5 |\n| line-through | IE3, FF1, S1, C3, CSS5 |\n\n![](img/9cd61ac1d4015ed5688d0c411434a660_195_0.png)\n\
    \n> > CHAPTER II - THE POOL OF TEARS\n> LEWIS CARROLL\n> Alice was again, having\
    \ a strange change in the course of imagination. She felt very, out of date—that\
    \ the Mouse did say, and so did she. It was such a hot day, that she wished she\
    \ could lie a down on a long bank and peep at the stream; but there was no shade\
    \ whatever, behind or before her, and she was crisp thinking now, of all the trouble\
    \ she had had by most going to,, and not to ever again. She was getting tired\
    \ of walking, and began to stretch out her feet and wonder how many miles she\
    \ had been walking, burning, or hot, and whether she had come to the well of the\
