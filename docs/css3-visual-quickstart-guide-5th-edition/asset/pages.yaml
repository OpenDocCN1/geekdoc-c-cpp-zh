- pgno: 246
  md: "# TABLE 8.8 Border-Collapse Values\n\n| Value | Compatibility |\n| --- | ---\
    \ |\n| collapse | IE5.5, FF1, O5, S1, C3, CSS2 |\n| separate | IE5.5, FF1, O5,\
    \ S1, C3, CSS2 |\n| inherit | IE5.5, O5, S1, C3, CSS2 |\n\n# # Collapsing Borders\
    \ Between Table Cells\n\nEvery table data cell defined by the `<td>` tag has four\
    \ borders: top, right, bottom, and left. The **border-collapse** property (Table\
    \ 8.8) allows you to set a table so that each table data cell share its borders\
    \ with an adjacent table data cell rather than creating a separate border for\
