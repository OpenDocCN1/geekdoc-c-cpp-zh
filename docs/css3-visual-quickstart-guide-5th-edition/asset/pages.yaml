- pgno: 34
  md: '# # The Parts of a CSS Rule


    ```

    selector { property: value; }

    ```


    All rules, regardless of their locations or types, having the structural elements:


    +   - Selectors are the alphanumeric characters that identify a rule. A selector
    can be an HTML tag selector, a class selector, an ID selector, a universal selector
    (described in Chapter 3) or a combination of those basic selectors to create context-based
    styles (discussed in Chapter 4).


    +   - Properties identify what is being defined. Several dozen properties are
    available; each is responsible for an aspect of the page content''s behavior and
    appearance.


    +   - Values are assigned to a property to define its nature. A value can be a
    keyword such as "red", a number, or a percentage. The type of value used depends
    solely on the property to which it is assigned.


    After the selector A, properties and their values, which together are referred
    to as a declaration. A single CSS rule can have multiple declarations separated
    by a semicolon ().


    # ## Browser CSS extensions


    In addition to the specified CSS properties set by the W3C, a browser developer
    will occasionally introduce browser-specific properties. This is often done for
    one of two reasons:


    +   - A spec is still under development by the W3C but the browser developer wants
    to start using the style now.


    +   - The browser developer wants to try a new idea but doesn''t want to wait
    for the W3C to accept it and begin work on it, which can take years.


    The basic syntax of a CSS rule. This starts with a selector (HTML, Class, or ID).
    Then add a property, a value for that property, and a semicolon, which together
    are called a definition. You can add as many definitions as you need long as they
    are separated by a semicolon.'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'Sometimes the exact syntax of the official CSS specification will be slightly
    different from the "sand-box" version created for a specific browser.


    To avoid confusion and ensure forward compatibility of CSS code, each rendering
    engine has adopted its own prefix to use CSS properties that are unique to that
    browser. The prefixes for each browser are shown in Table 1.2.


    These CSS extensions sometimes overlap and conflict when different browsers promote
    their own solutions. The good news is that due to the nature of CSS, you can include
    versions of each of the properties for individual browsers, so that the browser
    will use whichever version it suits


    Throughout the book, I include browser extensions, when appropriate, that you
    can ensure the widest interoperability of your styles.


    ```

    selector {-moz-property: value;

    -webkit-property: value;

    o-property: value;

    ms-property: value;

    property: value; }

    ```


    +   Browser CSS extensions can all be included as available to ensure that the
    style is applied if available to a particular browser.


    > Although you don''t have to include a semicolon with last definition in a list,
    experience shows that adding this semicolon can prevent future headaches. For
    example, if you later decide to add a new definition to the rule and forget to
    put in the required semicolon before the addition, you may cause the rule to fail
    completely. What''s worse, not only will that one definition will fail, but all
    the definitions in the rule won''t be used.


    > Most browser manufacturers drop an extension of a style within two releases
    after they adopt the official version. This practice allows designers to catch
    up before their style sheets stop working.


    > Don''t confuse the selector of an HTML tag with its attributes. In the following
    tag, for example, img is the selector, and src is an attribute:


    ```

    <img src="picture.gif">

    ```


    | Extension | Rendering Engine | Browser(s) | Example |

    |---|---|---||

    | -moz- | Mozilla | Firefox, Camino | -moz-border-radius |

    | -ms- | Trident | Internet Explorer | -ms-layout-grid |

    | -o- | Presto | Opera | -o-border-radius |

    | -webkit- | Webkit | Chrome, Safari | -webkit-border-radius |'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# New in CSS3


    The “New in CSS3” mark.


    This is a particularly exciting time to be a Web designer, we are about to get
    an entirely new palette of tools. A lot of new capabilities in CSS3 are ready
    for prime time (or will be soon) that will explode your creativity.


    This slim volume covers the breadth of CSS3, much of which remains unchanged since
    CSS2/2.1. If you are an old hand at CSS, look for the “New in CSS3” mark which
    will help you quickly find the stuff.


    Here''s a brief peak at what''s new:


    +   - Borders—Multiple border colors on a side, border images, and rounded corners


    +   - Backgrounds—Multiple backgrounds can be added to a single element, backgrounds
    can be more precisely positioned, backgrounds can be extended and clipped to the
    inside or outside of a border, and backgrounds can be resized.


    +   - Color—Color opacity settings, gradients in backgrounds, and HSL color values


    +   - Text—Text shadows, text overflow, and word wrapping


    +   - Transformations—Scale, skew, move, and rotate an element in 2D or 3D space.


    +   - Transitions—Simple dynamic style transitions


    +   - Box—Add Drop shadows, place user-resizable boxes, set overflow separately
    in horizontal and vertical directions, use outline offset to set space between
    the outline and the border, apply box model specifications to set how width and
    height are applied to a box.


    continues on next page'
  merge: -1
  img_proc: true
- pgno: 37
  md: '+   - Content-Styles can add content to an element.

    - Opacity—Elements can be transparent.

    - Media-Style pages based on the viewport size, color, aspect ratio, resolution
    and other important design considerations.

    - Web fonts—Updates and extends the ability to link to fonts for use in a design.


    Not everything in the CSS3 specification is ready to be used, though (see "CSS3
    and the Promise of Internet Explorer 9"). When it would be jumping the gun to
    start using new features right now, Ive added a section near the end of some chapters
    called "Coming Soon!" with quick overviews of what to expect in the future.


    # CSS3 and the Promise of Internet Explorer 9


    Currently Internet Explorer accounts for around 70 percent of browser usage. Most
    of this represents IE8 users; slightly fewer IE7 users; and a small but significant
    number of IE6 users.


    None of these browsers support CSS3.


    You can use some workarounds. Occasionally, an IE-specific code performs a similar
    function to the CSS3 code, and in a few (rare) cases a CSS3 property that has
    been around for awhile has made it into IE8. For the most part, however, the segment
    of your audience that uses Internet Explorer will be left out in the cold if you
    use CSS3.


    But wait, what is this appearing on the horizon? It''s IE9, which Microsoft has
    double-secret-pink sworn will completely and fully support every last detail in
    the CSS3 specification, or at least the important ones. This is great news, but
    as of writing, IE9 is still in Beta, with no clear release date. And even after
    its release it will be sometime before IE6, 7, and 8 disappear.


    For now, I suggest that you use CSS3 only as a design enhancement, unless you
    know your audience will not be using Internet Explorer—example, if you are developing
    iPhone apps. The design enhancement a concept is explained in more detail in Chapter
    12.'
  merge: -1
  img_proc: true
