  md: "# NEW CSS3:\nAdjusting Font Size for\nUnderstudy ★\n\nFont sizes are measured\
    \ based on the height of capital letters, but it is the lowercase letters that\
    \ often vary the most from font to font. If you are relying on study fonts, your\
    \ font sizes might look very different, even though the physical size is set.\
    \ To alleviate this, CSS3 introduces the font-size-adjust property, which allows\
    \ you to set the font size relative to lowercase letters rather than uppercase.\n\
    \nTo do this, you specify a numeric value that lowercase fonts should be sized\
    \ to a multiple of the font (Table 5.5). For example, if the font size is 18 pixels\
    \ and you set a font-size-adjust of 0.5, lowercase letters will be sized at 9\
    \ pixels. As a result, all the fonts will have the same apparent size relative\
    \ to each other, even if their x-heights vary greatly.\n\nTo adjust the font size\
    \ for an element:\n\n+   1. Add the font size adjust property to your CSS. Type\
    \ the property name font-size-adjust, followed by a colon (Code 5.5).\n   font-size-adjust:\n\
    2. Define a size value.\n   .5;\n   Type a value to adjust the font size by:\n\
    \   A numeric value of 0 or greater as a multiplier for the current font-size\
    \ to adjust the text size based on the x-height,\n   none, to leave the font-size\
    \ unadjusted\n\n![](img/9cd61ac1d4015ed5688d0c411434a660_159_0.png)\n\nfont-size:\
    \ 18px Verdana Arial\n\n![](img/9cd61ac1d4015ed5688d0c411434a660_159_1.png)\n\n\
    font-size: 18px font-size-adjust: .46 Verdanadana Arial\n\n> Verdana has a taller\
    \ x-height than Arial (top), but using font-size-adjust, you can set the lowercase\
    \ letters to use the same height, greater consistency regardless of which font\
    \ the browser uses.\n\n# TABLE 5.5 Font-Size-Adjust Values\n\n| Value | Compatibility\
    \ |\n| <number> | FF3*, CSS3 |\n| none | FF3*, CSS3 |\n\n*FF1 for Windows\n\n\
    > TIP You can calculate these values by dividing the set font-size by the font's\
    \ x-height, or you can just 'eyeball' until the font-size-adjust appears to have\
    \ no effect on the font size of the primary font.\n\n> TIP Font-size-adjust will\
    \ adjust the size of all your glyphs (capitals as well lower case), but does so\
    \ relative to the lower case letters rather than upper case.\n\n![](img/9cd61ac1d4015ed5688d0c411434a660_159_2.png)"
