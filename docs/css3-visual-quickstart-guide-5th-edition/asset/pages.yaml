- pgno: 294
  md: '# TABLE 10.17 Border-Image Values


    # NEW IN CSS3: Setting a Border Image ★


    | Value | Compatibility |

    |---|---|

    | <url> | FF3.5, S3, C2, O10.5, CSS3 |

    | <offsetnumber> | FF3.5, S3, C2, O10.5, CSS3 |

    | round | FF3.5, S3, C2, O10.5, CSS3 |

    | repeat | FF3.5, S3, C2, O10.5, CSS3 |

    | stretch | FF3.5, S3, C2, O10.5, CSS3 |


    A new feature in CSS3 is the ability to use a rectangular image that can be applied
    to the box''s border, overriding the line style. Mozilla and Webkit have implemented
    almost identical systems, and CSS3 has (thankfully) followed their lead. Although
    some differences exist, setting a basic image border background is identical among
    the three systems.


    ![](img/9cd61ac1d4015ed5688d0c411434a660_294_0.png)


    The background image system (the border-image takes a rectangular image and slices
    it into nine parts. The eight parts around the edges are used as the side and
    corner images, and the center is hidden to allow the content within the element
    to show through. The corners are applied to the corners of the offset set based
    on the size you set. Then the middle of the sides of the image are stretched or
    tiled to fill the width and height.


    border-02.png—The border image is used to fill in the corners and sides of the
    border. I''ve constructed this one using a grid with each square 27px on a side.


    To set the border background image:


    +   1. Create your background image and save it, preferably as a transparent PNG,
    although any format will work. For this example I divided the image into a grid
    of 27px squares, fitting the corners and edges of my background into each of these.
    This will make the math easier.


    continues on next page'
  merge: -1
  img_proc: true
