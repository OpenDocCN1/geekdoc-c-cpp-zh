    # Adjusting Text Spacing


    CSS gives you the ability to easily adjust text spacing, including the space between
    individual letters (tracking), words, and lines of text in a paragraph (leading).
    Of course, you could apply nonbreaking spaces and the line break tag to get a
    similar effect in straight HTML, but these "kludges" are difficult to implement,
    control, and change. With CSS, you have exact control over these elements.


    Code 6.2 text-properties.css—space has been compressed in the level 1 (book title)
    to create a cramped effect. The chapter name has been spaced out, which was overridden
    in the chapter "Chapter II," it appears normal. I''ve also closed up the spacing
    after the first letter in the first paragraph, which is being set as a drop cap.


    ```

    *** CSS3 QVS | Chapter 6 | text-properties.

    * CSS ***/\*

    ```


    # Adjusting the space between letters (tracking)


    Tracking is the amount of space between letters in a word, which, in CSS, is controlled
    by the letter-spacing property (Table 6.1). More space between letters often improves
    text readability. On the other hand, too much space can hamper making individual
    words less distinct.


    ```

    h1 {

    letter-spacing: -.05em;

    }

    h2 {

    letter-spacing: 2px;

    }

    h2 strong {

    letter-spacing: 0;

    }

    ```


    # To defining tracking:


    +   1. Add the letter-spacing property to your CSS rule. Type letter-spacing in
    the CSS declaration list, followed by a colon: (Code 6.2).


    letter-spacing:


    +   2. Specify the amount of space between your letters.


    -05em;


    A value for the letter-spacing property, using either of the following:


    +   A positive or negative value, such as -.05em, which sets the distance between
    letters. For more information, see "Values and Units Used in This Book" in the
    Introduction.


