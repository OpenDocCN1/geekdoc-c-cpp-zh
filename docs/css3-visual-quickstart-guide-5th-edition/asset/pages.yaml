  md: "# 2. Specify the layout method.\n\nauto;\nType one of the following values\
    \ to specify which method you want to use when displaying your table:\n\n+   -\
    \ fixed will use the first row to calculate the overall width of table data cells\
    \ in that column of the table.\n\n+   - auto will allow the browser to calculate\
    \ the widths of table data cells based on their content and the overall width\
    \ of the table.\n\n| Name | Description | Mad? |\n|---|---|--|\\| The Hatter |\
    \ \"Mad as a March Hare\" was a common phrase in Carroll's tale. | |\n The March\
    \ Hare | | |\n The Dormouse | The Dormouse is always falling asleep during the\
    \ scene, waking every so often. | |\n Alice | The character has | |\n\nCode 8.6\
    \ applied to code 8.1 with fixed layout: The data in the second column is much\
    \ longer than subsequent rows, so the table looks cramped when using fixed.\n\n\
    > TIP Although fixed renders faster for longer tables, auto generally provides\
