- pgno: 351
  md: '# IE conditional CSS


    Internet Explorer (and only Internet Explorer) has the ability to interpret conditional
    statements (if this...then do that) that are ignored by other browsers D. This
    allows you to insert links to style sheets that can tailor your CSS for any version
    of Internet Explorer.


    Open comment


    ```

    <!-- Version of IE

    Open if statement

    <!--[if IE>>

    <link href="ie.css" rel="stylesheet">

    <[endif]-->

    ```


    IE-specific CSS


    Close comment


    # To set up conditional styles for Internet Explorer:


    +   1. Add your standards-compliant CSS. This can be embedded in the head of your
    document in a <style> tag or imported using the <link> tag or @import rule (Code
    13.2):


    End if statement


    D General syntax for conditional statements. Anything placed between the comments
    will be used only by the specified versions of Internet Explorer.


    ```

    <style type="text/css"...></style>

    ```


    +   2. Add a conditional comment, specifying the version of IE you want to target.
    Within an HTML comment, use an if statement within square brackets and specify
    which version of Internet Explorer the CSS overrides should be used with:


    ```

    <!--[if lte IE 8]>

    ```


    TABLE 13.1 IE Conditionals


    | IE | Any version of IE |

    |---|---|

    | IE <version> | Versions less than version |

    | lte IE <version> | Versions less than equal to version |

    | IE <version> | Specific version |

    | gte IE <version> | Versions greater or equal to version |

    | gt IE <version> | Versions greater than version |


    Table 13.1 shows the possible logical operators you can include for targeting
    specific browsers or a range of versions.


    Using just IE will be used in any version of Internet Explorer. Adding a space
    followed by a number will specify the version number. For example, IE 6 allows
    CSS to be used only in Internet Explorer 6 regardless of the doctype.


    328 Chapter 13'
  merge: -1
  img_proc: true
