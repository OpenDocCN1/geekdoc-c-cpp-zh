    > TIP Although the properties seem similar, visibility differs from display (Chapter
    10). When display is set to none, the element is scrubbed from the document, and
    no space is reserved for it. Visibility reserves and displays the empty space
    like the invisible man in bandages.


    > TIP Generally, display:none is used for JavaScript effects, such as drop-down
    menus and pop-up text, in which elements are alternately hidden and shown. Because
    this property will remove the element, it prevents the element from interfering
    with the layout of the page when not needed.


    > TIP I recommend using display to hide elements, such as navigation, when creating
    a Printing style.


    > TIP One downside to hidden elements is that Web search engines will not see
    them nor screen readers by the vision impaired. If you do hide content, make sure
    it''s not something-that is vital for SEO.


