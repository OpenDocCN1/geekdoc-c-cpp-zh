  md: '# CHAPTER 8: THE PUNCH OF TEA

    CHAPTER 9: A CADUCEUS RACE AND A LONG TALE


    # THE RABBIT SENDS IN A LITTLE BIT


    When the Rabbit noticed Alice, in went he ran away, and called to her in an angry
    tone, ''Mr. Rabbit, come back!'' Alice ran much faster that she was out of breath,
    and passed, trying to follow him until he made a turn, and then she saw him disappear
    into a hole.


    ```

    Code 9.3 applied to 9.1: the chapter titles gain a bit more space. Notice, that
    the chapters are all 0. You have to teach the browser how to count.

    ```


    ![](img/9cd61ac1d4015ed5688d0c411434a660_258_0.png)


    # 3. Specify the content to be added.


    ```

    url(''../images/bullet-01.png'')

    ''Chapter counter(chapterNum)

    ```


    To define the content that is added, type one or more of the following values,
    separating each with a space:


    +   - A string value, such as Chapter, within single or double quotes.

    Anything within the quotes will be displayed just as you typed it, including HTML
    code, although spaces are collapsed (that is, more than two spaces are collapsed
    into a single space when displayed).


    +   - url(), with an absolute or relative url within the parentheses pointing
    to an external file, such as an image or sound file. For example, url(bg_flourish.png)
    will load an image.


    +   - counter(), with a counter name in parentheses. For example, counter(chapterNum)
    adds the counter number for the chapterNum. Counters are explained in the next
    section.)


    +   - open-quote or close-quote to add a quotation mark using the current quotation
    style. (See "Specifying the Quote Style" later in this chapter.)


    +   - no-open-quote or no-close-quote to increase the level of quoting by one
    level.


    +   - attr(), to display the value of the cited attribute. For example, attr(alt)
    will display the value for the alt attribute of the element being styled.


    +   - inherit, which will use the content defined for the parent element.


    +   - normal or none, which will not add any content or apply any other values.


    > Because the content property is not supported until Internet Explorer 8, it
    is best not to rely on this property for critical information.


    > Information rendered using the content property will not be searchable by search
    engines, never use it to insert information that defines your page.


    > Content added this way is also invisible to screenreaders, so don''t include
    anything that they will.


    > One idea is to use content to add figure captions pulled from the images tag.
    Since this is visible to screenreaders and search engines, it''s a good way to
    repetitive content.'
