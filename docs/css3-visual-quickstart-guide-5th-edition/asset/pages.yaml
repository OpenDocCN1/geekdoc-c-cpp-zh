    color value in the last set; otherwise, it will cover everything beneath it.


    > While it is possible to include the background image size and clip in the shorthand,
    the browser support for this is spotty at best. I recommend keeping these as separate
    declarations.


    > The ability to place graphics behind any element on the screen is a very powerful
    design tool for Web pages, especially when using the CSS Sprite technique, where
    a single background image can be used for different dynamic states. See Chapter
    14 for more information.


    > The default state for an element''s background is none, so the parent element''s
    background image and/or color will show through unless the background color or
    background image is set for that child element.


    > A fixed background can be particularly effective if you''re using a graphic
    background in your layout to help define the layout grid.'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# Putting It All Together


    +   1. Using the HTML you set up in Chapter 6, set the foreground (text) color
    for your Web page. Make sure the colors are readable against whatever background
    color you set.


    +   2. Add a background image to the page.

    Use something with some contrast.


    +   3. Add a second background image, and position it over the main background.

    Use a transparent PNG image and set repeating so that it''s not completely covering
    the fist background image.


    +   4. Set a transparent background color behind paragraphs. Play around with
    the opacity level until your text is readable against the background you chose
    in step 1.


    +   5. Combine background properties into a single declaration. You may not be
    able to do this with all of your background properties, but see how many you can
    combine.'
