  md: '# NEW IN CSS3: Setting an Element’s Shadows ★


    Just as with text shadows (Chapter 6), you can add one element or drop shadows
    to the box of any element on the screen—positioned or not. The term “shadow” is
    a bit misleading, though, since you can make the color anything you like—including
    light colors—to create a glow effect.


    # To set an element shadow:


    +   Add the box shadow property to your CSS rule. Type the box-shadow property
    names, including Mozilla and Webkit browser extensions, followed by a colon (;);
    (Code 11.8).

    -webkit-box-shadow:

    -moz-box-shadow:

    box-shadow:

    2. Specify the shadow offset, blur, choke, and inset.


    ```

    1px 1px 5px 1px rgba(0,0,0,.25)

    . inset

    ```


    Type the following keywords or values (Table 11.8) to specify how you want this
    element’s shadow to be treated (from right to left):


    +   x and y offset values set the position of the shadow relative to the box.
    Positive values offset the shadow and down to the right, whereas negative values
    move the shadow up and to the left. These are required.


    +   A blur length is a positive value that increases the fuzziness of the shadow
    and spreads it out. The higher the value, the bigger and lighter the shadow. This
    is optional but defaults to 0 when left unset.


    ![](img/9cd61ac1d4015ed5688d0c411434a660_323_0.png)


    > Shadow provide a sense of depth and texture.


    | TABLE 11.8 Box-Shadow Values |

    | Value | Compatibility |

    | inset | FF3.5, S3, C10.5, CSS3 |

    | <x-offset> | FF3.5, S3, C10.5, CSS3 |

    | <y-offset> | FF3.5, S3, C10.5, CSS3 |

    | <blur> | FF3.5, S3, C10.5, CSS3 |

    | <spread> | FF3.5, S3, C10.5, CSS3 |

    | <color> | FF3.5, S3, C10.5, CSS3 |


    ```

    Code 11.8formatting-properties.css—nWhen applied to Code 11.1, this CSS adds a
