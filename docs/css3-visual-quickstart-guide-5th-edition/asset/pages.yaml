- pgno: 385
  md: '# Creating Readable Style Sheets


    Although the computer interprets the CSS code to render a Web page, you and other
    humans have to create and edit it. During development, your code will probably
    get pretty messy, which makes it hard to track down rule interactions, determine
    the cascade order, or even locate rules that need changing.


    Keeping your code organized while you work can actually save you time. Follow
    these simple suggestions to keep your code as readable as possible during development,
    and then double-check and clean up your code before you deploy.


    # Include an introduction and TOC


    Place an introduction at the top of your CSS that includes basic information such
    as the title, site name, version, date, usage, and other notes (Code 15.1). Additionally,
    some developers like to insert a rough table of contents, outlining the organizational
    structure of the style sheets.


    # Define colors, fonts, and other constants


    It''s sometimes difficult to keep track of all the values that you are using in
    your design. It''s unlikely that CSS will ever include constants, so it will help
    to keep notes in an easy-to-reference location in your document. Creating a glossary
    of colors and types leads to more consistent and attractive designs (Code 15.2).'
  merge: -1
  img_proc: true
