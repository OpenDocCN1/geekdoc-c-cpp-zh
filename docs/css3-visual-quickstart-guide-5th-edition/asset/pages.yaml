- pgno: 74
  md: '# Defining Reusable Classes


    | Class selector | Declaration |

    |---|---|

    | .authorName { font-size: 1em; } | |


    A class selector allows you to set up an independent style that you can apply
    to any HTML tag. Unlike an HTML selector, which automatically targets a specific
    tag, a class selector is given a unique name that is then specified using the
    style attribute in the HTML tag or in any tags you want to use. However, you can
    also specify styles to apply using a class applied to a specific HTML tag, making
    it a dependent class.


    | Class selector | Declaration |

    |---|---|

    | p.authorName { font-size: 1em; } | |


    +   The general syntax of a CSS rule using a class selector.


    +   The general syntax of a dependent class selector rule.


    To define a class selector:


    +   1. Give your class name. Type a period (.) and a class name you give it; then
    open and close your declaration block with curly brackets ({}) (Code 3.9).


    ```

    .author {...}}

    ```


    CSS classes can be defined in the head of your document within the style tags
    or in an external CSS file that is imported or linked to the HTML document.


    continues on next page'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'The class name can be anything you choose, with the following caveats:


    +   - Use only letters and numbers. You can use hyphens and underscores, but not
    at the beginning of the name.


    +   - The first character cannot be a number, underscore, or hyphen.


    +   - Don''t use spaces.


    author is an independent class, so you can use it with any HTML tag you want,
    with one stipulation: The properties set for the class must work with the type
    of tag you use on.


    2. Add declarations to the rule. Within the brackets, type the declarations to
    be assigned to this class—formatted as **property: value**—using a semicolon (;)
    and separating individual declarations in the list. You can also add one or more
    line breaks, spaces, or tabs after a declaration without interfering with the
    code to make it more readable.


    font-size: 1.25em;


    3. Add dependent classes to your CSS. You create dependent classes, which tie
    the declarations of the class to a particular HTML tag by placing an HTML selector
    in front of the class.


    ```

    p.byline {...}

    ```


    **byline** is a dependent class and will be applied only to <p> tags using **class="byline"**


    In the same document, you can create different versions of the dependent class
    (using the same name) for different tags and also have an independent class (applied
    to all tags with the class), as shown in step 1.


    continues on page 54


    ![](img/9cd61ac1d4015ed5688d0c411434a660_75_0.png)


    The results of Code 3.9. Notice how the word "by" is rising above the author''s
    name.'
