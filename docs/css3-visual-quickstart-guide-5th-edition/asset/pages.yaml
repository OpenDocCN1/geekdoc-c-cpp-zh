  md: '# Putting It All Together


    +   1. Add a CSS rule for the body element, defining the font stack. Use the HTML
    from chapter 4, and in the <style> tag, add a body{...} rule and a declaration
    for the font family (the font stack). Try out different fonts and see how they
    work in your system.


    +   2. Use Webfonts with the header. Place an @font-face{...} rule at the top
    of your CSS code, pointing to a Webfont file (it can be on your local system),
    and add a rule for the page headers (h1, h2, h3, etc...) with the Webfont the
    first listed in the font stack.


    +   3. Specify the size of fonts in the body. Add a font-size declaration in your
    body rule. Play around with different values and units to see how this affects
    your page.


    +   4. Specify a font adjustment. Add font-adjustment to the body rule, and then
    change your font stack around to see how this affects different fonts'' sizes.


    +   5. Specify the font weight for headers. Browser default styles generally make
    headers bold, so play around with what they look like in normal (roman) style.


    +   6. Style headers with small-caps. Add font-variant to the header rules.


    +   7. Combine style rules using the font shorthand. Use the font property to
    combine as many of the independent font properties into a single declaration.'
