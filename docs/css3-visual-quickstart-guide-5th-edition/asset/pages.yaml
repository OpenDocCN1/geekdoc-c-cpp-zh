  md: '# # ALICE’S ADVENTURES IN WONDERLAND


    by Lewis Carroll


    # Chapter I. DOWN THE RABBIT-HOLE


    Alice was beginning to get very tired of sitting by her sister on the bank, and
    of having nothing to do: once or twice she had peeked into the book her sister
    was reading, and it had no pictures or conversations in it, ''and what is the
    use of a book,'' thought Alice ''without pictures or conversations?


    So she was considering in her own mind (as well as she could, for the hot day
    she feel very sleepy and stupid), whether the pleasure of making a daisy-chain
    would be worth the trouble of getting up and picking the daisies, when suddenly
    a White Rabbit with pink eyes came close by her.


    There was nothing so very remarkable in that, nor did Alice think it was very
    much out of the way to hear the Rabbit say to itself, ''Oh dear Oh dear I shall
    be late!'' (when she thought it over afterwards, it occurred to her that she ought
    have wondered at it, but at the time it all seemed natural); but when the Rabbit
    actually took a watch out of its


    This version should look similar to the previous section except for the space
    between lines of text.


    # Mimicking the Visitor’s Styles


    Wouldn''t it be nice if you could match your visitor''s system font styles? You
    can do this by simply declaring the font style to be one of the following keywords
    (for example, font: icon);


    +   - caption: the font style being used by controls, such as buttons


    +   - icon: the font style being used to label icons


    +   - menu: the font style being used in drop-down menus and menu lists


    +   - message-box: the font style being used in dialog boxes


    +   - small-caption: the font style being used for labeling small controls


    +   - status-bar: the font style being used in the window''s status bar at the
    top of the window'
