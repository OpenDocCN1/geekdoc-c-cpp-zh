    default styling of HTML elements, to create a level playing field across browsers,
    and according to their documentation, to provide a sound foundation upon which
    you can explicitly declare your intentions.


    This CSS Reset (Code 13.6) addresses the styles of many specific HTML tags, zeroing
    them out, as well as resolving some problems with font sizes, weights, and the
    use of quotation marks.

