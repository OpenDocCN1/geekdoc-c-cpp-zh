  img_proc: true
- pgno: 78
  md: '# Defining Unique IDs


    Like the class, the ID selector can be used to create unique styles that are independent
    of any particular HTML tag. Thus, they can be assigned to any HTML tag. IDs are
    used in HTML to establish the structure of your page layout, identifying unique
    elements in the code, signaling them out for special treatment, either for positioning
    with CSS or JavaScript.


    To define an ID selector:


    +   1. Add the ID selector to your CSS. ID rules always start with a number (#)
    followed by the name of the ID (Code 3.10).


    The name can be a word or any set of letters or numbers you choose, with the following
    caveats:


    +   - Use only letters and numbers. You can use hyphens and underscores, but do
    so with caution. Some earlier browsers reject them.

    - The first character cannot be a number, hyphen, or underscore.

    - Don''t use spaces.


    CSS rules can be defined in the head of your document within the <style> tags
    or in an external CSS file that is imported or linked to the HTML document.


    continues on next page'
  merge: -1
  img_proc: true
- pgno: 79
  md: '2. Add declarations to your ID. Within the curly brackets, type the declarations
    to be assigned to this ID—for-formatted as property: value—using a semicolon;)
    and separating individual declarations in the list. You can also add one or more
    line breaks, spaces, or tabs after a declaration without interfering with the
    code to make it more readable.

    position:relative;


    3. Add the id attribute to the HTML tag of your choice, with the name of the ID
    as its value.


    ```

    <figure id="gallery">...</figure>

    ```


    Notice that although the sign (#) is used to define an ID selector, it is not
    included for referencing the ID in the HTML tag. If you add it, the rule will
    fail.


    > TIP You can also create dependent IDs, which use the declarations of the ID
    only when applied to a particular HTML tag. However, I never have a use for these
    because the point of IDs is that you use them only once per page.


    > TIP Although you can use the same name for both a class and ID, you should try
    to avoid this because it will inevitably lead to confusion.


    > TIP You can mix an ID with a class and/or inline rules within an HTML tag.

    TIP IDs can give each screen element a unique name and identity. This is why an
    ID is used only once, for one element in a document, to make it an object that
    can be manipulated with JavaScript.'
  merge: -1
  img_proc: true
