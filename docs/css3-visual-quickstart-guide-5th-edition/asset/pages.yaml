- pgno: 317
  md: '# Setting the Visibility of an Element


    The visibility property designates whether an element is visible in the window.
    If visibility is set to hidden **(Table 11.5)**, the element is invisible but
    still occupies space in the document, and an empty rectangle appears where the
    element is located.


    | Value | Compatibility |

    |---|---|

    | hidden | IE4, FF1, S1, C1, O4, CSS2 |

    | visible | IE4, FF1, S1, C1, O4, CSS2 |

    | inherit | FF1, S1, C1, O3.5, CSS2 |


    To set an element''s visibility:


    +   1. Specify a position type. For details, see "Setting the positioning Type"
    earlier in this chapter.


    +   2. Add the visibility property to your CSS. Type visibility in the element''s
    CSS declaration block, followed by a colon (: (**Code 11.5**).

    visibility:


    +   3. Specify how the element''s visibility should be treated.

    hidden;

    Type one of the following keywords to specify how you want this element to be
    treated:


    +   * hidden makes the element invisible when the document is initially rendered
    on the screen.


    +   * visible makes the element visible.


    +   * inherit causes the element to inherit the visibility of its parent element.


    > The hidden element no longer appears, although its location is shown as an empty
    space indicated by the dotted line in this figure (no, there will not actually
    be a dotted line).'
  merge: -1
  img_proc: true
