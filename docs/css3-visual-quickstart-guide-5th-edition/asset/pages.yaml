    \ time it all seemed quite natural, when the Rabbit actually took a watch out\
    \ of his waistcoat-coat, pocketed it, and then hurried away. Alice started for\
    \ her feet, for it thought very curious to see a rabbit take a watch out of a\
    \ waistcoat, or to put a watch in pocket; with burning curiosity, she ran across\
    \ the field and, fortunately was just in time to pop down a large rabbit-hole\
