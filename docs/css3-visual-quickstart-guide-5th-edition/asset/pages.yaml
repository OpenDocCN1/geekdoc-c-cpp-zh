- pgno: 347
  md: '# Adjusting CSS for Internet Explorer


    The current versions of Internet Explorer are behind the times, with the most
    recent version (IE8) barely supporting CSS2, and older versions still in common
    use with far CSS support. However, you will face the biggest problems when you
    have to support IE6, IE7, and IE8 in quirks mode (see the sidebar "What Is Quirks
    Mode?" in this chapter).


    IE9, which may be available by the time you read this, promises to change all
    of that (see "CSS3 and the Promise of Internet Explorer 9" in Chapter 1), by adding
    full HTML5 compatibility, but no one knows for how long it will take for IE9 to
    replace its predecessors. The reality is you will need to include code to tailor
    your design to Internet Explorer for some time to come.


    Fortunately, the solutions are provided—intentionally and unintentionally—by Internet
    Explorer itself.


    # What Is Quirks Mode?


    CSS implementations in early versions of Internet Explorer were full of bugs,
    non-standard behaviors, and outright misinterpretations of the W3C standards.
    Internet Explorer 6 and later versions corrected most of "quirks," but if Web
    browsers had instantly switched to standards compliance, older Web sites would
    have started left behind.


    The answer was doctype switching (Chapter 2), which allowed designers to specify
    whether to support the old quirks, the standards, or a hybrid of the two.


    In theory, to set a mode, all you have to do is a doctype:


    +   - Quirks mode—Used by the browser if it detects that the page is not standards
    compliant or it uses the transitional doctype. This basically renders the page
    as if it were IE6.


    +   - Strict mode—Uses the standards as defined by the particular browser and
    uses the strict doctype.


    +   - Almost Standards mode—Firefox, Safari, and Opera (version 7.5 and later)
    have a third mode that uses all of the CSS2 standards except for table vertical
    sizing.'
  merge: -1
  img_proc: true
- pgno: 348
  md: '# The underscore hack


    A hack is code that is used because it is not supposed to work but does work under
    certain circumstances and can be exploited to fix a specific problem. Although
    several hacks allow us to include CSS code that will work only in Internet Explorer,
    the hack I find easiest to use and most reliable is the underscore hack.


    # Designing with Progressive Enhancements


    It''s clear that not all browsers are created equal, so why should we expect all
    Web sites to treat them that? For years Web designers have tried to design to
    the lowest common denominator (IE), ignoring the new features available to them
    in the belief that they had to create the exact experience in all browsers.


    Why?


    As long as the site functions effectively and is as good as it can be for that
    browser, why not take advantage of the new features? Why not design with progressive
    enhancements that improve the experience for those who can see without penalizing
    those who cannot? This is a question that has been debated back and forth by Web
    designers for several years.


    The best reason for not using progressive enhancement comes down to your client''s
    expectations: Most clients—who may not be schooled on the ways of Web design—have
    a hard time understanding why the Web site they paid good money does not look
    as good on Internet Explorer as other browsers.


    However, I find that it takes a little education to get clients past this. Show
    them that working with progressive enhancements is:


    +   1. faster to develop—Rather than spending time kludging together a bunch of
    images for rounded corners, drop shadows, and other effects, a few lines of code
    takes care of it all.

    2. cheaper to maintain—Changing code is much more cost effective than reworking,
    re-cutting, and redeploying images.

    3. better looking—Since the styles are native to the browser, they will display
    more precisely than images that are shoehorned in.


    If these arguments don''t sway your client, then show them the budget for cost
    of designing with progressive enhancements compared to without. Usually this is
    enough to convince even the most stubborn client.'
  merge: -1
  img_proc: true
- pgno: 349
  md: "The underscore hack is the simplest way to include CSS for Internet Explorer\
    \ browsers in quirks mode, exploiting a mistake in the way the beginning of a\
    \ CSS declaration should be treated. According to standards, any declaration that\
    \ starts with an underscore should be ignored, as if commented out. However, when\
    \ Microsoft created earlier versions of Internet Explorer, it apparently didn't\
    \ get that memo, and any version of Internet Explorer in quirks mode will pay\
    \ attention to this declaration We can use this error to fix CSS overrides meant\
    \ for quirks mode from other browsers.\n\n# IE-specific CSS\n\n# _width: 800px;\n\
    \nUnderscore\nA general syntax for the underscore hack. Any CSS placed on the\
    \ same line as the underscore is ignored by browsers other than Internet Explorer\
    \ in quirks mode.\n\nCode 13.1 Standards-compliant browsers will use the range\
    \ from 640 to 980px depending on browser width, whereas IE6 will always use 800px\
    \ because it does not support max/min width This can be applied in any situation\
    \ where you need a different property or value applied.\n\n# To use the IE underscore\
    \ hack:\n\n+   1. Add your standards-compliant declarations to the CSS rule. This\
    \ is the code you want to use for your design (Code 13.1).\n\n+   max-width: 800px;\n\
    - min-width: 640px;\n- width: 100%\n\n+   2. Add the IE-specific declaration with\
    \ an underscore (_) in front. This value will override previous values for that\
    \ property for any browsers using the IE quirks mode.\n\n_width: 800px;\n\n> The\
    \ underscore hack is a quick and easy way to set and test styles in IE, but it\
    \ is not very good coding. I recommend using this only during development and\
    \ then moving the hacked code into IE conditional CSS.\n\n```\n<DOCTYPE html>\n\
    <html lang=\"en-US\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Alice's Adventures\
    \ in Wonderland/</title>\n  <style type=\"css\">\n    {\n      padding: 10px;\n\
    \      margin: 10px auto;\n      max-width: 980px;\n      min-width: 640px;\n\
    \      width: 100%;\n      _width: 800px;\n      outline: 1px solid red;\n   \
    \   border: 1px solid red;\n    }\n  </style>\n</head>\n<body>\n  <p>Suddenly\
    \ she came,...</p>\n  <p>Alice opened the door,...</p>\n  <p>There seemed to,...</p>\n\
    </body>\n</html>\n```"
  merge: -1
  img_proc: true
