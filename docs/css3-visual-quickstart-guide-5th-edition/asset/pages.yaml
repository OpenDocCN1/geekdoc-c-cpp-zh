- pgno: 29
  md: '# The Evolution of CSS


    Over the years, CSS has evolved under the guidance of the W3C into its current
    form, but the process has often been a standard—created by the W3C''s CSS Working
    Group—it is up to each browser to interpret and implement that standard. This
    has led to uneven implementation, with some browsers ahead of others¹


    Even more troublesome is that, although the standard strives to be as clear and
    specific as possible, different browsers implement the specifications with slightly
    different quirks.


    All modern browsers (Internet Explorer, Firefox, Safari, Opera) support CSS2 (which
    includes CSS1 and CSS-Positioning). However, after years of development, CSS3
    remains a work in progress, supported by some browsers (Firefox, Safari, and Opera)
    but still under development in others (Internet Explorer).


    ![](img/9cd61ac1d4015ed5688d0c411434a660_29_0.png)


    > ¹ The evolutionary paths of HTML and CSS have not been particularly even or
    steady over the years. This timeline is not meant to be an exact chart, but provides
    a general overview of when each version of the standard was in its prime.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# CSS Level 1 (CSS1)


    The W3C released the first official version of CSS in 1996. This early version
    included the core capabilities associated with CSS, such as the ability to format
    text, set fonts, and set margins. Netscape 4 and Internet Explorer 3 and 4 support
    Level 1.


    Web designers needed a way to position elements on the screen precisely. CSS Level
    2 was already released, and CSS Level 2 was still in the future, so the W3C released
    a stopgap solution: CSS-Positioning. This standard proposed that the parties concerned
    could debate for awhile before the CSS-P standard became official. Netscape and
    Microsoft jumped on these proposals, however, and included the preliminary ideas
    in version 4 of their browsers.


    # CSS Level 2 (CSS2)


    The CSS2 spec came out in 1998 and is the most widely adopted by browser makers.
    Level 2 includes all the attributes of the previous two versions, plus an increased
    emphasis on international accessibility and the capability to specify media-specific
    CSS.


    In 2006, the W3C published an updated version: CSS Level 2.1, which corrected
    some errors, clarified a few issues, and included specifications for features
    that had already been implemented in some browsers. CSS2.1 has effectively replaced
    CSS2.


    # CSS Level 3 (CSS3)


    Unlike CSS1 and 2, a single, comprehensive CSS3 does not exist. Instead, rather
    than to release the entire specification at once, the CSS Working Group has split
    the spec into a series of modules; each of which has its own developmental timeline.


    http://www.w3.org/Style/CSS/current-work


    > TIP While knowing the differences between the CSS versions may be interesting,
    it is not necessary for using styles on the Web. What you do need to know is styles
    are supported by the browsers you''re designing for. Although modern browsers
    support most of the CSS Level 2 specification, older browsers support combinations
    of older versions of CSS. Appendix A details which CSS properties each browser
    supports.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# CSS and HTML


    When HTML was first created


    Take the <strong> tag, for example. In HTML, this common tag does one and only
    one thing: It makes text "stronger," usually by making it bolder. However, using
    CSS, you can "redefine" the <strong> tag so that it not only makes text bolder,
    but also displays in all caps and in a particular font to add more emphasis. You
    could even make the <strong> tag not make text bold.


    Although both HTML and CSS have evolved over the years, they have rarely evolved
    in tandem. Instead, each standard has pretty followed its own path. However, both
    CSS3 and HTML5 will be hitting primetime over the next few years, creating the
    new foundation and framework for modern Web sites.


    The power of CSS comes from its ability to mix and match rules from different
    sources to tailor your Web pages'' layout to your exact needs. In some ways, it
    resembles computer programming—which is not too surprising, because a lot of this
    stuff was created by programmers instead of designers. But once you get the hang
    of it, "speaking" CSS will become as natural as putting together a sentence


    ![](img/9cd61ac1d4015ed5688d0c411434a660_31_0.png)


    +   The three core Web technologies (HTML, CSS, and JavaScript) work in ways that
    are similar to parts of speech. HTML provides the nouns, CSS the adjectives and
    adverbs, and JavaScript adds verbs.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# Types of CSS Rules


    The best thing about cascading style sheets is that they are amazingly simple
    to set up. They don''t require plug-ins or fancy software—just text files with
    rules in them. A CSS rule defines what the HTML should look like and how it should
    behave in the browser window.


    CSS rules come in three types, each with specific uses:


    +   * HTML selector. The text portion of an HTML tag is called the selector. For
    example, `h1` is the selector for the `<h1>` tag. The HTML selector is used in
    a CSS rule to redefine how the tag displays. (See "(re)Defining an HTML Tag" in
    Chapter 3). For example:


    ```

    h1 { color: red; }

    ```


    will style:


    ```

    <h1>...</h1>

    ```


    +   * Class. A `class` is a "free agent" rule that can be applied to any HTML
    tag at your discretion. You can name the class anything you want. Because a class
    can be applied to multiple HTML tags, it is the most versatile type of selector.
    (See "Defining Reusable Classes" in Chapter 3). For example:


    ```

    .myClass { font: bold 1.25em\times; }

    ```


    will style:


    ```

    <h1 class="myClass">...</h1>

    ```


    continues on next page'
  merge: -1
  img_proc: true
