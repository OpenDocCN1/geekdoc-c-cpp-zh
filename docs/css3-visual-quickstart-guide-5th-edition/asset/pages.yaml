- pgno: 52
  md: '# When Will HTML5 Be Ready?


    It''s important to note that many people are concerned that HTML5 is still a "Working
    Draft." Widespread adoption is not predicted until 2012, and the final "Proposed
    Recommendation" will not be finished until 2022. (Yes, that''s over a decade from
    now.) The skeptics throw their hands and assume that it will be some time before
    HTML5 is relevant. That date is really misleading.


    Many browsers currently support the important HTML5 properties, and the 2012 date
    is actually much faster than the adoption periods of some previous standards.
    The 2022 date is distant, but it is when all browsers will have adapted all the
    HTML5 properties.


    Practically speaking, HTML5 is here now and will grow in over the next few years
    until it becomes the main game in town.


    HTML5 is ready for prime time, if you are ready to use it.


    +   7. Add one or more article tags, which will contain the important content
    on this page. Many Web browsers and RSS readers will now allow the user to focus
    on the articles to get the main content of the page. Figures and sections fit
    well.


    ```

    <article>...</article>

    ```


    +   8. Add the aside tag, which is supplemental content to the article is placed.
    This is also sometimes called a sidebar or rail, depending on who you talk to.
    It can include anything you want, but I like putting comments and dialog over
    here.


    ```

    <aside>...</aside>

    ```


    +   9. Finally, add a footer tag at the bottom of the page. This generally includes
    redundant top-level navigation, copy-rights, and other small print.


    ```

    <footer>...</footer>

    ```


    And that''s it. You are ready to start using HTML5 tags. Go crazy. Oh, wait, that''s
    right: it works in everything but Internet Explorer, which just happens to make
    the major of browsers in use today. So, what do you do?'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Making HTML5 work in

    Internet Explorer


    Although Internet Explorer does not know

    HTML5 tags, there is a partial fix (or kludge)

    that involves using JavaScript to create the

    HTML5 elements:


    ```

    document.createElement(''header'');

    ```


    Referred to as the "HTML5 Shiv," this will

    "teach" Internet Explorer 6 (and later ver-

    sions) these elements exist, and that

    they should be treated as HTML tags. You

    can add one of these lines of JavaScript

    each of the HTML5 elements you need.


    To make it simple to add these new

    tags, create an external JavaScript

    file (Code 2.2) and link to it from your

    HTML document using the IE conditional

    (Code 2.3), which you''ll explore in greater

    detail in 13.


    Code 2.2 HTML5forIE.js This adds a blank

    HTML tag for each of the HTML5 tags Internet

    Explorer is missing.


    ```

    *** CSS VQ Chapter 2 - HTML5forIE.js ***

    document.createElement(''abbr'');

    document.createElement(''article'');

    document.createElement(''aside'');

    document.createElement(''audio'');

    document.createElement(''bb'');

    document.createElement(''canvas'');

    document.createElement(''center'');

    document.createElement(''datalist'');

    document.createElement(''details'');

    document.createElement(''dialog'');

    document.createElement(''eventsource'');

    document.createElement(''figure'');

    document.createElement(''footer'');

    document.createElement(''header'');

    document.createElement(''group'');

    document.createElement(''mark'');

    document.createElement(''menu'');

    document.createElement(''meter'');

    document.createElement(''nav'');

    document.createElement(''output'');

    document.createElement(''progress'');

    document.createElement(''section'');

    document.createElement(''time'');

    document.createElement(''video'');

    ```


    # Why Use a Doctype?


    If you do not use a doctype, modern

    browsers are forced into Quirks Mode.

    That''s a bad situation if you create-

    new Web pages because it leaves

    the interpretation of the code solely

    to the discretion of the browsers,

    which can translate into a lot of display

    inconsistencies.


    If you do not include the doctype in

    Web page, newer browsers may not

    recognize all of your code.'
