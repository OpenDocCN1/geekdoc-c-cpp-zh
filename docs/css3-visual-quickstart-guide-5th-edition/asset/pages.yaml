    # ALICE''S ADVENTURES IN WONDERLAND


    by LEWIS CARROLL


    # Chapter I. Down the Rabbit-Hole


    Alice was beginning to get very tired of sitting by her sister on the bank, and
    having nothing to do once or twice she had peeped into the book her sister was
    reading, and it had no pictures or conversations in, and what is the use of a
    book, thought Alice, without pictures or conversations?

    So she was considering in vain what to do, for the hot day she felt so sleepy
    and drowsy, whether the pleasure of making a daisy would be worth the trouble
    of getting up and picking the daisies, when she saw a Rabbit with eyes so close
    by.


    > "Twinkle, twinkle, little bat!

    How I wonder what you are!"


    There was nothing so remarkable in that, nor did Alice think it so much of an
    odd thing to hear a Rabbit say to himself ("Oh dear! Oh dear! I shall be late!"
    (when she was so astonished to hear the Rabbit speak aloud, but it all seemed
    quite natural), that the Rabbit actually took out of his waistcoat-pocket, a watch,
    and then ran off. Alice started after him, for it was curious to see a Rabbit
    with a watch, to watch out of it, and burning with curiosity, she ran across the
    field and fortunately was in time to pop-down a large Rabbit-hole under the hedge.


    The results of Code 3.10. The Gallery figure has floated into the page and then
    slightly offset.


