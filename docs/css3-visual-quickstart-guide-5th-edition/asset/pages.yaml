- pgno: 306
  md: '# Understanding the Window and Document


    A Web page (also referred to as the document) is displayed within a browser viewport.
    Everything that you present to the viewer is displayed in that area, although
    the document will require scrolling if it is larger than the viewport.


    You can open multiple windows (each displaying its own documents in its own viewport),
    resize and position windows on the screen, or insert smaller viewports called
    iframes. Everything that you present, however, is displayed within a browser window
    as part of a document.


    Like the elements contained within it (see "Understanding an Element''s Box" in
    Chapter 10), the window has a width and height, as well as a top, bottom, left,
    and right. In fact, you can think of the browser window as the ultimate element
    in your Web design—the parent of all other elements. Browser windows and the documents
    they contain have several distinct parts:


    The browser window displaying a document that will require some vertical scrolling
    to reveal the rest of its content.


    +   - Browser width and height refers to the dimensions of the entire window,
    including any browser controls and other interface items.


    +   - Viewport is the area of the display area. All fixed-position elements will
    be placed in relation to the viewport edges.


    ![](img/9cd61ac1d4015ed5688d0c411434a660_306_0.png)


    continues on next page'
  merge: -1
  img_proc: true
- pgno: 307
  md: '+   - Viewport width and height refers to the live display area of the browser
    window''s viewport. The live dimensions, obviously, are always less than the full
    window dimensions. Generally, when I refer to the "window," I''m referring to
    the viewport.


    +   - Document width and height, sometimes called the rendered width and height,
    refers to the overall dimensions of the Web page tag. If the document''s width
    and/or height are larger than the viewport width and/ height, you''ll see scroll
    bars that let you view the rest of the document.


    +   - The element edge is the edge of an element within the border. Elements are
    positioned relative to their parent element''s edges if the parent element has
    also been positioned. Otherwise, the element is positioned relative to the document
    edge.


    +   - Element width and height should not be confused with content width and height
    (defined in Chapter 10); this is the total space occupied when border and padding
    are added to the content width and height.


    > TIP The document width is most often the same as the viewport width since horizontal
    scrolling is generally not preferred.


    > TIP Normal flow refers to where an element will appear in the Web page if no
    positioning is applied to it.'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# # Setting the Positioning Type


    CSS positioning allows you to set several properties associated with the HTML
    element''s position not only in 2D but also in 3D, clipping, and visibility. But
    first, you have to declare how the element''s positioning should be treated.


    An element can have one of four position values—static, relative, absolute, or
    fixed (**Table 11.1**). The position value tells the browser how to treat the
    element when placing it into the document.


    In addition to setting the position of an element, other position-dependent properties
    include:


    +   - **Stacking order** is available for absolutely and fixed-position elements,
    allowing you to move elements in 3D.

    - **Visibility** hides an element''s content but not the element itself, effectively
    setting its opacity to 0.

    - **Clipping** is used to hide parts of the content, "clipping" its sides.


    # ## Static positioning


    By default, elements are positioned as static in the document unless you define
    them as positioned absolutely, relatively, or fixed. Static elements, like the
    relatively positioned elements explained in the following section, flow into a
    document one after the next. Static positioning differs, however, in that a static
    element cannot be explicitly positioned or repositioned, cannot be clipped, and
    cannot have its visibility changed.


    # ### TABLE 11.1 Position Values


    | Value | Compatibility |

    | --- | --- |

    | static | IE4, FF1, S1, C1, O4, CSS2 |

    | relative | IE4, FF1, S1, C1, O4, CSS2 |

    | absolute | IE4, FF1, S1, C1, O4, CSS2 |

    | fixed | IE7, FF1, S1, C1, O4, CSS2 |

    | inherit | IE7, FF1, S1, C1, O5, CSS2 |


    > A statically positioned element stays where it is.'
  merge: -1
  img_proc: true
- pgno: 309
  md: '# Relative positioning


    A relative element is positioned in context where it would have been positioned
    if left alone. A relatively positioned element will be offset based on its position
    in the normal flow of the document. However, the space it occupied will remain
    but appear empty.


    # Absolute positioning


    Absolute positioning takes an element out of the normal flow of the document,
    leaving no space behind. An element that is defined in this way is placed at an
    exact point in the window by means of x and y coordinates relative to its most
    recently positioned element''s edges or the body if none of its parents are positioned


    ![](img/9cd61ac1d4015ed5688d0c411434a660_309_0.png)


    A relatively positioned element is moved relative to the indicated side—top, right,
    bottom, and/or left—where it would have appeared untouched. Negative values move
    the element in the opposite direction but still relative to the same side.


    ![](img/9cd61ac1d4015ed5688d0c411434a660_309_1.png)


    An absolutely positioned element is removed from the normal flow and positioned
    from a positioned parent element''s sides (or the document sides if it has no
    positioned parents).'
  merge: -1
  img_proc: true
- pgno: 310
  md: '# Fixed positioning


    Fixing an element''s position in the window is similar to absolute positioning
    except that it is in a locked position relative to the viewport edge (rather than
    its parent). When a document scrolls in the viewport, fixed elements stay in their
    initial positions and do not scroll with the rest of document. This allows you
    to establish constant elements in the screen that do not scroll with the rest
    of the content D.


    ![](img/9cd61ac1d4015ed5688d0c411434a660_310_0.png)


    +   D A fixed-positioned element is always positioned relative to the viewport''s
    edge.


    # To set an element''s position type:


    +   1. Add the position to your declaration list. Type position in a rule''s declaration
    block or in the style attribute of an HTML tag, followed by a colon (Code 11.2).


    Code 11.2 visualformatting-properties.css--- When applied to Code 11.1, this CSS
    adds absolute positioning to the aside and gallery figures relative to the gallery
    itself and with fixed positioning to the footer I have also set position-relative
    positioning for the strong tag to fix a spacing problem that''s been buggy since
    Chapter.


    position:


    continues on next page


    ```

    *** CSS V05 | Chapter 11 | visualformatting-properties.css ***/

    ```


    aside

    position: absolute;


    strong

    position: relative;


    footer

    position: fixed;


    ul

    position: relative;


    div.gallery

    position: relative;


    div.gallery figure

    position: absolute;


    ![](img/9cd61ac1d4015ed5688d0c411434a660_310_1.png)


    Code 11.2 apply to code 11.1. Position types have been set, but-without actually
    setting-the elements look like a jumble. The footer which is fixed is now at the
    top of the page! Also, note how the text marked with the strong tag is. This was
    caused by increasing its font size relative to the surrounding text. You will
    fix that in the next section.


    Visual Formatting Properties 287'
  merge: -1
  img_proc: true
- pgno: 311
  md: '# 2. Specify the positioning.


    relative;

    Type a position-type value, which can be one of the following:


    +   - static flows the content normally, however, none of the position properties
    can be set for this element.


    +   - relative also flows the element normally, but allows the position to be
    set relative to its normal position using the values set on the top, left, right,
    and bottom properties.


    +   - absolute places the element relative to the edges of its most recently positioned
    element. This element will be the body of the document or the element within which
    it is nested if that element''s positioning has been set.


    +   - fixed places the element relative to the edges of the viewport, independent
    of any other content on the page and ignoring its parent elements. Unlike an absolutely
    positioned element, when the window is scrolled, the fixed element stays where
    it is in the viewport as the rest of the content moves.


    +   - inherit uses the position type of the element''s immediate parent. If no
    position is set, this will default to static (see the sidebar "Inheriting Position
    Types").'
  merge: -1
  img_proc: true
- pgno: 312
  md: '# Inheriting Position Types


    **inherit** is another value for position-ing. It tells the element to use the
    same positioning type as its parent, overriding the default static value. This
    can be tricky to use, though, because tying the child''s position type to its
    parent can radically alter the layout if you change the parent''s position type.


    > TIP Absolutely positioned and fixed-positioned elements take up no space within
    the parent element. So if you have an element—such as an image—that is absolutely
    positioned, its width and height are **not** included as part of the width and
    height of the parent content.


    > TIP You can position elements within other positioned elements. For example,
    you can set the relative position of a child element that is within an absolutely
    positioned parent or set the absolute position of an element within an absolutely
    positioned parent.


    > TIP Remember that the browser adds a default margin to the body of your Web
    page, but the default value is not consistent across all browsers. To correct
    this, you should always set your own margin in the body tag, which allows you
    to position elements consistently. See Chapter 12 for details on using a browser
    reset.


    > TIP Positioning can also vary from browser to browser due to rounding errors.
    It''s generally best to use "clean" numbers, rounded to the nearest number.


    > TIP When an element''s position type has been set to anything other than static,
    you can use JavaScript or other scripting languages to move the element, change
    the clip, change the stacking order, hide it, or display it.


    Visual Formatting Properties **289**'
  merge: -1
  img_proc: true
- pgno: 313
  md: '# # Setting Element’s Position


    All positioned elements can have a top value, a right value, a bottom value, and
    a left value to position the element from those four sides (Tables 11.2 and 11.3).
    A relative element will be offset relative to its own edges. An absolute element
    will be offset relative to its parent’s edges. A fixed element will be offset
    relative to the viewport''s edges.


    # ## To define an element’s position:


    +   1. Specify a position type. For details, see “Setting the Positioning Type”
    earlier in this chapter.


    +   2. Add a position side property to your CSS declaration list. Type *left,
    right, top,* or *bottom* in the CSS rule, followed by a colon (:) (**Code 11.3**)


    top:


    120px;


    Type a value for the element’s offset. You can enter any of the following:


    +   A length value such as **120px, 2.3em, or 1.25cm.**


    +   A percentage value, such as **1%**, which creates a fluid offset.


    +   auto, which allows the browser to calculate the value if the position is set
    to absolute; otherwise, the default value will be 0.


    > **TIP** You don’t have to include the top, right, bottom and left declarations,
    but if they are not included, they are treated as auto.


    TABLE 11.2 Top and Left Values

    | Value | Compatibility |

    |---|---|

    | <length> | IE4, F1, S1, C1, O4, CSS2 |

    | <percentage> | IE4, F1, S1, C1, O5, CSS2 |

    | auto | IE4, F1, S1, C1, O5, CSS2 |


    TABLE 11.3 Bottom and Right Values

    | Value | Compatibility |

    |---|---|

    | <length> | IE5, F1, S1, C1, O4, CSS2 |

    | <percentage> | IE5, F1, S1, C1, O4, CSS2 |

    | auto | IE5, F1, S1.3, C1, O4, CSS2 |

    | inherit | IE4, F1, S1, C1, O5, CSS2 |'
  merge: -1
  img_proc: true
