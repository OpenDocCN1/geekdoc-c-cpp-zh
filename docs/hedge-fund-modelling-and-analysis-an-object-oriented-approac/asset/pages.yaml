    # 1.3.1 Characters and Strings


    When using the char data type, use single quotes, for example:


    ```

    char Stock = ''MSFT'';

    ```


    Certain characters, such as ('' '') and double ("") have special meaning in C++
    and to be treated with. In addition, C++ reserves special characters for formatting
    text and other processing tasks as character escape sequences (or backslash character
    constants) as shown in Table 1.3.


    A more versatile data type char is string which can be a combination of numbers,
    spaces and symbols of any length. C++ does not have a built in data type to hold
    strings instead it is defined in the C++ Standard Library through the inclusion
    of the header file <string>. An example of string variables is shown in Source
