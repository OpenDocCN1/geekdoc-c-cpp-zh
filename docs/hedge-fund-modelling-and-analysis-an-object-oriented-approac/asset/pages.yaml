    where $E^{CAPM}(R_M)$ is the ''unconditional expectation operator'' i.e. the expected
    return on the market (not conditioned on anything else occurring) applied to the
    benchmark (or market index).¹¹² Equation (5.8) allows the calculation of a manager''s
    added value relative to some beta controlled quality of systematic market return
    premium; (5.8) is commonly referred to as *Jensen''s alpha* i.e.


    $\alpha_J = (R_P - R_F) - \beta_P(R_M - R_F) \quad (5.9)$


    # 5.5.1 The Information Ratio


    The *information ratio* (IR) as described by Goodwin (1998) is similar to the
    Sharpe ratio in that it is based on a fund''s return and volatility. However,
    where the Sharpe ratio uses a risk-free rate as a benchmark for the numerator,
    the information ratio goes one step further and uses a *market reference* benchmark.
    If $R_{Pt}$ is the return on a fund in period $t$ and $R_{Bi}$ is the return on
    a benchmark portfolio in period $t$ then $\Delta_t$, the excess return can be
    written as:


    $\Delta_t = R_{Pt} - R_{Bi} \quad (5.10)$'
