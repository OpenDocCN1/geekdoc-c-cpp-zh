    velocity? Can we press the accelerator to increase the speed, we can press the
    brake to reduce and finally we can turn the steering wheel to alter the direction
    of motion. The speedometer is a method we can consult at any time to access the
    value of the speed component of velocity. However, it is clear that without any
    of the other methods we cannot directly manipulate the vehicle (unless we have
    a crash in which the velocity goes to zero very rapidly).


    # 1.10.1 Classes and Abstract Data Types


    The basic building block of OOP is the class. A class defines the available characteristics
    and behaviour of a set of similar objects. A class is an abstract definition that
    is made concrete at run-time when objects upon the class are instantiated and
    taken on the behaviour of the class. Data abstraction is the process of creating
    an object whose implementation details are hidden (or encapsulated) and the object
    is used through a well-defined interface. Data abstraction leads to an abstract
    data type (ADT), e.g. when we use a floating point number in a program that we
    are not really bothered exactly how it is represented inside the computer, it
    provides benefits in the manner you expect. ADTs should be independent of their
    implementation meaning modification. Most people would be unhappy if they took
    their car to the garage for a service and afterwards the mechanic said ''She''s
    running lovely, but you''ll have to use the pedals from reverse now on''. If this
    were the case, we would not think of the car as an ADT. However, the reality is
    that we can take a car to a garage for a major overhaul (which represents a change
    of implementation) and still drive it in exactly the same way afterwards.


    Consider the concept of a ''Vehicle'' class. The class would include methods such
    as Steer (), Accelerate () and Brake (). The class would also include properties
    such as Colour, NumberOfDoors, TopSpeed. The class is an abstract design that
    becomes real when objects such as Car, RacingCar and Tank are created, each with
    its own version of the class''s methods and properties. Furthermore, message passing
    (or interfacing) describes the communication between objects using their public
    interfaces. There are three main ways to pass messages: properties, methods, and
    events:


    +   - Properties can be defined in a class to allow objects of that type to advertise
    and allow changing of state information, such as the ''TopSpeed'' property.'
