  md: '# CHAPTER 2


    # # The Hedge Fund Industry


    The global credit crisis originated from a growing bubble in the US real estate
    market which eventually froze in 2008. This led to an overwhelming default of
    mortgages linked to subprime debt which financial institutions reacted by tightening
    credit facilities, selling off bad debts at huge losses and pursuing fast foreclosures
    on delinquent mortgages. A liquidity crisis followed in the credit markets and
    banks became increasingly reluctant to lend to another causing risk premiums on
    debt and credit to become scarcer and costly. The global financial markets went
    into meltdown as a continuing spiral of worsening liquidity ensued. When the market
    froze, hedge fund managers were unable to get their hands on enough capital to
    meet investor redemption requirements. Not until the early part of 2009 did the
    industry start to experience a resurgence in activity realising capital inflows
    and growing investor confidence.


    The aftermath of the financial crisis has clearly highlighted many shortcomings
    of the hedge fund industry and heightened the debate over the need for increased
    regulation and monitoring. Nevertheless, it has since been widely accepted that
    hedge funds only a small part in the global financial collapse and suffered at
    the hands of a highly regulated banking system.


    Chapter 2 introduces the concept of hedge funds and how they are structured and
    managed as a discussion of the current state of the global hedge fund industry
    in the aftermath of the last financial crisis. Several key investment techniques
    that are used in managing hedge fund strategies are also discussed. This chapter
    aims to build a basic working knowledge of hedge funds, and along with Chapter
    3, develop the fundamentals necessary in order to approach and understand the
    more quantitative and theoretical aspects of modelling and analysis developed
    in later chapters.




