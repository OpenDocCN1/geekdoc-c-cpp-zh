    # BOX 7.2: SQUARE ROOT RULE FOR VaR


    If a series of hedge fund P&Ls are quoted in monthly or quarterly figures, then
    they can be transformed into an equivalent annualised series using a similar square
    root rule to that applied to standard deviation. To get the annualised figure,
    the original VaR is multiplied by the square root of the frequency representing
    the original time period e.g. 12 for monthly and 4 for quarterly.⁴ More formally:


    ```

    annual VaR_{1-a} = monthly VaR_{1-a} \times \sqrt{12}

    ```


    ```

    annual VaR_{1-a} = quarterly VaR_{1-a} \times \sqrt{4}

    ```


    # 7.3 TRADITIONAL VaR METHODS


    There are generally three industry accepted methods for estimating VaR,⁴ namely:


    +   1. Historical simulation

    2. Parametric method and

    3. Monte-Carlo simulation.


    Each has a different approach in terms of how they describe the distribution of
    losses, Monte-Carlo simulationates data, historical simulation uses actual data,
    and the parametric approach utilises the data but in order to generate the necessary
    parameters to characterise the distribution. All of these traditional measures
    of VaR have their strengths and weaknesses.


