    $ES_{1-\alpha} = E[-X|-X \geq VaR_{1-\alpha}] = \frac{1}{\alpha} \int_{-VaR_{1-\alpha}}^{-\infty}
    x \frac{1}{\sigma_X\sqrt{2\pi}} e^{-\frac{x^2}{2\sigma_X^2}} dt$

    ```


    ```

    = \frac{1}{\alpha} \sigma_X \frac{\phi( -VaR_{1-\alpha}/\sigma_X )}{\sqrt{2\pi}}
    - \frac{\sigma_X^2}{2\alpha} \frac{\phi''( -VaR_{1-\alpha}/\sigma_X )}{\sqrt{2\pi}}
    = \frac{\sigma_X^2 q_a^2}{2\alpha}$ (7.8)

    ```


    where $I_A$ is the indicator function whose value is 1 when $A$ is true and 0
