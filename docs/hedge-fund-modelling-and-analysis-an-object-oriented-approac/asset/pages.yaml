    # 4.11 COVARIANCE AND CORRELATION


    Both covariance and correlation are related measures that indicate the degree
    of variation between two sets of random variables, for example a set of hedge
    fund returns and the market benchmark e.g. S&P 500 Index. Given any pair of random
    variables, $X_i$ and $X_j$, their covariance is denoted by cov$(X_i, X_j)$ or
    in matrix form, by $\Sigma_{ij}$. By definition, the covariance is a symmetric
    matrix i.e. $\Sigma_{ij} = \Sigma_{ji}$. Also, the covariance of any element $X_i$
    with itself is the variance, that is:


    $cov(X_i, X_j) = var(X_i)$


    The covariance matrix $\Sigma$ can be written as:


    $$\Sigma = \begin{pmatrix} \Sigma_{11} & \Sigma_{12} & \Sigma_{13} & \dots & \Sigma_{n}
    \ \Sigma_{21} & \Sigma_{22} & \Sigma_{23} & \cdot & \cdot \ \Sigma_{31} & \Sigma_{32}
    & \Sigma_{33} & \cdot & \cdot \ \cdot & \cdot & \cdot & \ddots & \cdot \ \Sigma_{n1}
    & \cdot & \cdot & \cdot & \Sigma_{nn} \end{pmatrix}$


    > $^{12}$The covariance matrix must also be positive definite i.e. a matrix that
    is analogous to a positive result'
