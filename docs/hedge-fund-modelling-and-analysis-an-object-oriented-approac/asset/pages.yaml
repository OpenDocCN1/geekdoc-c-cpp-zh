  md: '# 1.6 CONTROL STRUCTURES


    It is possible to control the order of execution of statements in a program through
    special types of structure, namely branching and looping.


    # 1.6.1 Branching


    The most common type of branching statement is the decision-making (or selection)
    structure. Decision-making structures control program execution through the dependence
    on one or more specified conditions being satisfied. If the structure is far the
    most popular type of decision-making structure and there are two basic forms,
    namely:


    ```

    if (condition) statement;

    and

    if (condition)

    {

    statement;

    }

    ```


    The if ... else and if ... else structures are extensions of the if structure
    that allows further conditions to be tested, that is:


    ```

    if (condition)

    {

    statement1;

    }

    else

    {

    statement2;

    }

    and

    if (condition)

    {

    statement1;

    }

    else if

    {

    statement2;

    }

    else

    {

    statement3;

    }

    ```'
