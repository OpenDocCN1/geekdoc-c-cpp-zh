    fund


    # Table 7.2 Comparison of traditional VaR methods


    | Method | Advantages | Disadvantages |

    |---|---||

    | Historical Simulation | No assumptions about the return distributions. | Assumes
    data used in the simulation is representative of the future. |

    | Parametric Method | Mathematically simple to understand and implement. | Strong
    assumptions about the hedge fund P&L distribution in terms of $\mu$ and $\sigma$.
    Less accurate for nonlinear instruments used within the hedge fund portfolio and
    strategy. |

    | Monte-Carlo Method | Flexibility in terms of choosing the stochastic process
