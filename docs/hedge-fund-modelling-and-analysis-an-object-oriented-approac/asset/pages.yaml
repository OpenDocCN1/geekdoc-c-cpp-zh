    Such techniques can prove invaluable to hedge fund managers who are often tasked
    with managing the risk of the fund and efficient allocation of resources across
    the portfolio. Indeed, many hedge fund managers develop increasingly complex optimisation
    problems utilising a range of performance metrics and risk measures.'
