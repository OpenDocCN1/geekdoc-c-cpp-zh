    # 2.4.2 Leverage


    Leverage is using borrowed cash, or a margin account, to increase the purchasing
    power and exposure to a security (or investment) with the aim of generating higher
    returns. Financial instruments, such as options, swaps and futures (i.e. derivatives)
    are also used to create leverage. A premium is paid to purchase a derivative in
    the underlying asset which gives them various rights and obligations in the future.
    The premium is far less than the outright price of the underlying asset and thus
    allows investors to buy an economic exposure to consider more of the asset than
    they could otherwise.


    Although generally misunderstood, leverage is an extremely widespread investment
    technique, especially in the hedge fund industry. A great deal of confusion often
    arises from the various definitions and measurements of leverage. In terms of
    hedge fund leverage, the debt-to-equity ratio or percentage is often the preferred
    indicator, for example, if a hedge fund has $50 million equity capital and borrows
    $100 million, the fund has a total of $150 million in assets and a leverage of
    2 equity or 67% (=100m/150m). ratios are typically higher than traditional investments
    and generally more difficult to measure due to the sophisticated use of certain
    financial instruments and strategies. Since adding leverage to an investment entirely
    increases risk, investors often use a highly leveraged hedge fund with a high
    risk investment. However, this is not normally the case since hedge funds use'
