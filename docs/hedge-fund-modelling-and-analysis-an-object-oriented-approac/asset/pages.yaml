  md: 'In Source 1.5, you can see that the variable globalN has been declared globally
    and initialised to the value 144. Global variables can be accessed from anywhere
    in the program once they have been declared. Local variables, on the other hand,
    as localN can only be used within the block enclosed by the braces ({}) in which
    it is declared.


    # 1.3.5 Constants


    Constants are fixed values assigned to variables that cannot be changed once they
    have been declared and initialised. We have already used literal constants when
    a variable was declared and initialised in Source 1.2:


    ```

    string FirstName = "Paul";

    ```


    Or, as in Source 1.5:


    ```

    int localN = 72;

    ```


    With symbolic constants the const keyword is used in front of the declaration
    and initialisation, for example:


    ```

    const double Volatility = 0.18;

    ```


    Enumerated constants are an alternative way of creating a series of integer constants.
    Suppose you wanted to assign an integer value of 0 to 6 to the days of the week
    starting at Sunday. This could be achieved using a list of symbolic constants
    written as:


    ```

    const int Sun = 0;

    const int Mon = 1;

    const int Tue = 2; etc.

    ```


    However, with enumeration it is possible to write:


    ```

    enum WeekDays

    {

    Sun,

    Mon,

    Tue,

    Wed,

    Thu,

    Fri,

    Sat

    };

    ```'
