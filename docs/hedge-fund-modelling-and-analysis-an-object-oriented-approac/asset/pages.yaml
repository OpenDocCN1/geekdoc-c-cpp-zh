    \ the form of a correlation matrix$^{15}$ $\rho$,:\n\n$\\rho = \\begin{pmatrix}\
    \ 1 & \\rho_{13} & \\dots & \\rho_{1n} \\ \\rho_{21} & 1 & \\rho_{23} & \\dots\
    \ \\ \\rho_{31} & \\rho_{32} & 1 & \\dots \\ \\dots & \\dots & \\dots & \\dots\
