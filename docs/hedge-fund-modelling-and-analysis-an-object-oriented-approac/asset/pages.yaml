- pgno: 49
  md: 'In Source 1.20, the function is first declared using a function prototype above
    the main() subroutine. The prototype is a copy of the function header terminated
    with a semi-colon (;). Be aware when declaring a function (through the function
    prototype) we refer to parameters, when calling the function, we refer to arguments.
    Arguments are the parameters passed to the function when it is called, and once
    inside the function, these parameters can be changed, just like any other value.
    Within a function prototype, it is possible to omit their names, for example we
    could have written the prototype for the Product() function as:


    ```

    double Product(double, double);

    ```


    In Source 1.20, x and y are the parameters of the Product() function and a b are
    the arguments of the Product() function. When Product() is called the values entered
    for a and b are passed to x and y and subsequently used in the function. The function
    can change the values of x and y but cannot change the values of a and b. If it
    is a requirement that the value of a parameter passed to a function is only allowed
    to read and not change the value inside the function, the parameter can be set
    to constant in both the prototype and header declaration. For example:


    ```

    double Product(const x, double y);

    ```


    In this case, y of x cannot be changed in the body of the function; however, y
    can still be changed. When using arguments in a function it is also possible to
    initialise the values for the parameters in the function prototype. For example:


    ```

    int Init(int x, int y = 10, int z = 30);

    ```


    Note that once a parameter has an initial value then all parameters to the right
    of it must also be declared with initial values. We have already seen that it
    is not explicitly necessary to state parameter names in function prototypes, the
    third parameter in Init() is quite acceptable.


    In C++, function prototypes are usually put in files with extension .h, known
    as header files, while function definitions go into files with the extension .cpp.
    Preprocessor directives (#) can be used to avoid multiple includes during compilation,
    for example:


    ```

    #ifndef HEADERNAME_H

    #define HEADERNAME_H

    ...

    contents of the header file.

    #endif

    ```


    On most modern compilers it is possible to replace the above statements with a
    single pragma statement as follows:


    ```

    #pragma once

    ```'
