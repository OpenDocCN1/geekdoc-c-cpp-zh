    # 1.10.6 Getter and Setter Methods


    Both member data and functions can be declared either private or public (protected
    will not be discussed in this book). Those declared public can be accessed from
    any part of a program that includes the class with use of the dot notation (.).
    Those declared as private can only be accessed by member functions of the class.
    The default declaration for member data and functions is private and to access
    these private variables from outside of the class we generally use setter (or
    mutator) and getter (or accessor) methods as shown in Source 1.25. In general,
    getters do not modify any of the member variables in the class and so it is good
    practice to make them constant by adding the const modifier.




