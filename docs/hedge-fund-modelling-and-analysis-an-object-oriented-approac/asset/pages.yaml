    of capital into the fund after they have reached a maximum level of AuM and them
    as closed funds. As a result, it is very difficult for hedge fund indices to remain
    investable when the composite funds have closed their doors to new investors.
    Most index providers argue to be a truly representative index that acts as a gauge
    for hedge fund performance, both open and closed funds should be included in the
    hedge fund index.'
