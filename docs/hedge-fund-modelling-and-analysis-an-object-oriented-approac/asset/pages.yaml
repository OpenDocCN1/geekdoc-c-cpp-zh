    # 4.7 CUMULATIVE DISTRIBUTION FUNCTION


    The **Cumulative Distribution Function** (CDF) describes the probability that
    a random variable X with a given probability distribution will be found at a value
    less than or equal to x. The CDF is a function $F(x)$ of a random variable, X,
    for a number x, such that:


    $F(x) = P(X \leq x) = \int_{-\infty}^{x} f(s)ds \quad (4.4)$


    That is, for a given value, $F(x)$ is the probability that the observed value
    of X will be at most x. Figure 4.7 shows the relationship between a typical PDF
    and CDF.


    # 4.8 THE NORMAL DISTRIBUTION


    A very popular probability distribution is the *normal* (or *Gaussian*^7$) distribution
    which has the following PDF:


    $f(x) = \frac{1}{\sigma\sqrt{2\pi}} exp\left(-\frac{(x-\\mu)^2}{2\sigma^2}\right)
    \quad (4.5)$'
