    #  5.5.2 The Treynor Ratio


    The Treynor ratio as (TR) introduced by Treynor (1962) is again of the same form
    as the generalised risk-adjusted return given by (5.3). However, this time risk
    is defined as the beta of the fund relative to a benchmark, such that:


    $TR = \frac{\alpha_p}{\beta_p} \frac{R_p - R_F}{\beta_p}$$ (5.14)


    The beta of the portfolio $\beta_p$ can be calculated in two ways. The first method
    has already been discussed in Chapter 4. Box 5.2 shows a detailed explanation
    of an alternative method of estimating beta.


    > BOX 5.2: ESTIMATING BETA AND ITS RELATIONSHIP TO CORRELATION


    Beta is a very common measure for estimating the extent to which the hedge fund
    excess returns are influenced by that of the benchmark or market excess returns.
    The beta of the portfolio is the gradient (m) of the OLS regression line where
    the market excess returns are plotted on the x-axis and the hedge fund excess
    returns on the y-axis (see Chapter 4). The fund’s beta can be visualised as a
    measure of its relative directional exposure to the benchmark i.e. a kind of relative
    elasticity as shown in Figure 5.12.'
