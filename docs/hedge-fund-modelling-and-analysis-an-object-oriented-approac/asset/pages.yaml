    # 6.2.4 Short Sale Constraints


    The above optimisation problem assumes that short selling is allowed i.e. the
    weights can be negative. However, if no selling is allowed, the optimisation problem
    can be modified by adding a further constraint. This has led to the investigation
    of restricted mean variance frontiers, where the weights are constrained to be
    non-negative. The optimisation problem can be written as:


    ```

    min \frac{1}{2}w''\Sigma w

    ```


    subject to the constraints:


    ```

    w^T R = r*\nsum_{i=1}^{N} w_i \geq 0

    ```


    It is also possible to impose a constraint on the maximum allowable investment
    limits (or bounds) on one or more of the assets in the portfolio i.e.w_i \leq
    b where b is a real number. In a general, mean-variance optimisation attempts
    to find a constrained minimum of a scalar function (w''\Sigma w) of several variables
    starting at an initial estimate. However, since they do not admit a general solution,
    one rather has to investigate the Karush-Kuhn-Tucker (KKT) conditions. KKT are
    first order necessary conditions for a solution in nonlinear programming to be
    optimal, provided that some regularity conditions are satisfied. Allowing inequality
    constraints, the KKT approach to nonlinear programming using the method of Lagrange
    multipliers, which allows only equality constraints.


    In this chapter we have introduced the main ideas behind mean-variance optimisation
