    of a security. During the recent financial turmoil and substantial falls in stocks,
    hedge funds were often accused of short selling to exacerbate and profit from
    the declining markets. During 2008 and 2009, regulators announced several actions
    to protect against abusive short selling and make short selling information readily
    available to the public.


