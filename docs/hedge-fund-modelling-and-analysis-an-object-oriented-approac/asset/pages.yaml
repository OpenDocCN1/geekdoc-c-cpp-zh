  md: 'Most risk-adjusted return metrics may be generalised using the following formulation:


    Risk-Adjusted Return Metric = (Return proxy)/(Risk proxy) (5.3)


    Usually the return proxy is the estimated ex-post annualised return for the hedge
    fund less the annualised risk-free rate or minimum acceptable rate. The most widely
    used risk proxy is the volatility of returns since many investors are comfortable
    with viewing a manager in mu-sigma space. However, it has drawbacks due to its
    simplicity, even higher moments as kurtosis are neglected, the distribution could
    be asymmetrical (skewed) and drawdowns could turn out to be much than assumed.
    That is, volatility is an essential measure of normal or Gaussian risk in an abnormal
    non-Gaussian world of risk. As a result, the risk metric shown in the denominator
    of (5.3) has been changed and re-defined by various researchers over the years
    to encompass more complex and meaningful measures as demanded by sophisticated
    investors. These metrics will be described and modelled in the following sub-sections.


    # 5.4 THE SHARPE RATIO


    The Sharpe ratio (SR) aims to measure the desirability of a risky investment strategy
    or instrument by dividing the average return in excess of the risk-free rate by
    the standard deviation of the periodic returns. SR is defined by Sharpe(1994)
    as follows:


    > $Sharpe = \frac{R_p - R_F}{\sigma_p}$$ (5.4)


    where $R_p$ is the annualised return, $R_F$ is the annualised risk-free rate (e.g.
    using the T-bill as a proxy) and $\sigma_p$ is the volatility of the returns.
    The SR introduces the concept the investor wants to earn at least the risk-free
    rate and they want the highest SR, which will start penalising hedge funds whose
    returns are low. Also, any fund with annualised return less than the risk-free
    rate will have a negative SR regardless of the volatility.


    The SR undoubtedly has some value as a measure of strategy ''quality'', but it
    also has few limitations. The SR does not distinguish upside and downside volatility
    (see Figure 5.8). In fact, outliers have the effect of increasing the value of
    the denominator (i.e. standard deviation) more than the value of the numerator,
    thereby lowering the value of the ratio. For a positively skewed return'
  merge: -1
  img_proc: true
- pgno: 198
  md: '# FIGURE 5.8 Upside and downside volatility


    such as a typical trend following CTA strategy, the SR can be increased by removing
    the largest positive returns. This is nonsensical since investors generally welcome
    large positive returns.


    To the extent that the distribution of returns is non-normal, the SR falls short.
    It is a particularly poor performance metric when comparing positively skewed
    strategies like trend following to negatively skewed strategies like option selling
    (see Figure 5.9). In fact, for positively skewed return distributions, performance
    is actually achieved with less risk than the SR suggests. Conversely, standard
    deviation underestimates risk for negatively skewed return distributions, the
    strategy is actually riskier than the SR suggests.


    Source 5.4 shows the Sharpe () member declaration and definition.


