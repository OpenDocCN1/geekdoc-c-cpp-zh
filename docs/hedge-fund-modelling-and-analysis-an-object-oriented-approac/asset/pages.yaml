    # 4.4.2 Histograms


    A histogram is a graphical summary of the frequency distribution of a set of empirical
    data,³ for example as a time series of monthly hedge returns (or NAVs). The frequency
    is an absolute value in which each value represents the actual count of the number
    of occurrences of a particular value in a group of data. Relative frequencies
    involve normalising the frequencies through division of the absolute frequency
    by the total number of observations in the group of data. Knowing the max and
    min values of the monthly returns it is possible to set a range that encompasses
    all the monthly returns in the data set. This range is divided into equal intervals
    (bins) and an absolute frequency determined for each number of values that fall
    within each bin. Once the absolute values have been determined, a relative frequency
    can be calculated by dividing each absolute frequency by the sum of absolute frequencies
    i.e. 72. An example of a histogram for the CTA Index is shown in Figure 4.4.


    The histogram is a very useful representation of a set of hedge fund returns over
    a specific time period, gives a good visual representation of the shape of the
    distribution and highlights areas of high negative and positive returns.'
