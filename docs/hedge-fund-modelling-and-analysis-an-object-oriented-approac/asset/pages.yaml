    With the statement:


    cout << "\n" << c << "\n";


    the first << invokes the left shift operator and shifts c into cout, then it reads
    the next << and invokes the left shift operator again and shifts "\n" into cout
    i.e. it left -> right. In 1.30, since we are constantly modifying the ostream
    object (i.e. using multiple insertion operations) we must pass it by reference
    so that it takes into account this operator chaining process. Note also that ostream
    is not a member (i.e. it is a non-member) of the Vec2D class but would be able
    to access the private members of the class. In this class, we make ostream friend
    of the Vec2D class. By default, a non-member cannot access the private member
    data of a class unless the class explicitly states that function is allowed to
    do so, i.e. a class must give away its friendship, a friend cannot be simply assumed
    by a non-member function.


