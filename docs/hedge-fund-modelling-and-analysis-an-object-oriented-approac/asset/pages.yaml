  md: "The STR is another enhanced variant of the SR. The problem with the SR is that\
    \ it uses volatility as a measure of risk for the entire series of returns. As\
    \ a result, large upswings and large downswings in value penalise as they translate\
    \ into higher volatility and a lower SR. In many ways, the STR is a better choice,\
    \ especially when measuring and comparing the performance of managers whose programs\
    \ exhibit skew in their return distributions. The STR is a modification of the\
    \ SR but those returns downside deviation falling below a user-specified target\
    \ (see Figure 5.7) or required rate of return are considered risky.\n\nFrom (5.19)\
    \ we see that the denominator uses the concept of the MAR to set a reference point\
    \ for the measurement of returns. Basically the MAR is a fixed point, e.g. 3.0%,\
    \ which sets a minimum rate of return agreed by the investor thereby splitting\
    \ the returns into two categories i.e. greater than or equal to MAR (i.e. the\
    \ upside semi-deviation) and less than MAR (i.e. the downside semi-deviation).\
    \ The size of risk-adjusted returns is to have the least risk possible, a typical\
    \ investor will not want their upside risk to penalised. For this, the STR uses\
    \ a measure of standard deviation in the denominator which only uses the downside\
    \ returns. Thus, the higher the STR, the better the manager is at controlling\
    \ downside returns while not being penalised for upside returns. As such is it\
    \ a good metric for assessing the risk-management capabilities of a hedge fund\
    \ manager. Source 5.9 shows the STR () member declaration and definition.\n\n\
