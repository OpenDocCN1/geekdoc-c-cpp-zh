  md: '![](img/2d1ac831a270b8b08f8b8ec2205913dc_282_0.png)


    **FIGURE 7.9** Hypothetical hedge fund losses over 100 days


    Interpreting the main distribution in terms of the parent and then a child distribution
    within the parent gives us some qualitative understanding of how EVT is applied.


    Consider Figure 7.9 that shows a hypothetical plot of the losses for a particular
    hedge fund over a 100-day period. Given such information the next step is to try
    to characterise the losses over this period in some mathematical way. EVT offers
    two fundamental methods for such characterisations, namely the block maxima and
    point over threshold methods.¹²




    The block maxima (BM) method is based on subdividing the time period into a set
    of buckets (or blocks) of equal size. For example, Figure 7.10 reproduces the
    loss data given in Figure 7.9 for the hypothetical hedge fund over the 100-day
    period but divides the time into 10 blocks each block is a 10-day period that
    will contain a certain number of losses. Taking the maximum in each of the 10-day
    blocks gives us 10 local block maxima i.e. 10 data points which can be used to
    characterise (or fit) a probability distribution. This is often known as a generalised
    extreme distribution (GED).


    Within the hedge fund area, the block maxima method is the less preferred estimation
    of VaR using the EVT.




    The peaks over threshold (POT) method is a more modern and widely accepted method
    for estimating VaR although mathematically somewhat demanding. The basic'
