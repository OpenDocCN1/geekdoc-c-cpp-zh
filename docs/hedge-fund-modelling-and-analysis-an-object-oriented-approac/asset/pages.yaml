    # 3.2.7 EDHE Risk and Asset Management Research Centre (www.edec-risk.com)


    As detailed, the different hedge fund indices available in the market conform
    to a range of selection criteria and are developed through a variety of construction
    methodologies attached to a commercial databases. With such inherent heterogeneity
    in the hedge fund industry, investors cannot rely on competing hedge fund indices
    to obtain a true and fair representation of hedge fund performance. As a response
    to this lack of representativeness and purity in the hedge fund industry, EDHE
    Risk and Asset Management Research Centre (EDHE) introduced a new index of indices
    to alleviate the problem. Such Alternative Indices were first discussed in an
    EDHEC working paper by Amenc and Martellini (2003) who argued that due to the
    impossible nature of ascertaining the best index on the market, a better construction
    method is to use a combination of competing indices to determine a more robust
    and representative industry benchmark. Since competing indices are based on different
    sets of hedge funds in their composition, the resulting portfolio of indices must
    be more exhaustive than any of the competing indices it is derived from.'
