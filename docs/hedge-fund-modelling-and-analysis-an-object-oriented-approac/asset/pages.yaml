    # ##2.2 THE STRUCTURE OF A HEDGE FUND


    In order for managers to be effective in the running of their business a number
    of internal and external parties covering a variety of operational roles are employed
    in the structure of a hedge fund as shown in Figure 2.1. As the industry matures
    and investors are requiring greater transparency and confidence in the hedge funds
    in which they invest, the focus on the effectiveness of these parties is growing
    as they are relevant expertise and professionalism. Hedge funds are also realising
    that their infrastructure must keep pace with the rapidly changing industry. Whereas
    in the past, some funds paid little attention to their support and administrative
    activities, they are now aware that the effective operation of their funds ensures
    the fund does not encounter unnecessary and unexpected risks.


    # ###2.2.1 Fund Administrators


    Hedge fund *administrators* provide many of the operational aspects of the success
    running of a fund, such as compliance with legal and regulatory rulings, financial
    reporting, liasing with clients, provision of performance reports, risk controls
    and accounting procedures. Some of the larger established hedge funds use special-ist
    in-house administrators whilst smaller funds may find this additional expense
    by outsourcing their administrative duties. Due to the increased requirement for
    tighter regulation and improved transparency in the industry, many investors will
    only invest with managers who can prove a strong relationship with a reputable
    third-party administrator and that the proper processes and procedures are in
    place (see Table 2.1).


    ^LIBOR is the London Interbank Offered Rate, a rate that banks lend to other banks
    in the London interbank market.


    ^A treasury bill (or T-bill) is a short-term debt obligation backed by the US
    government with a maturity of less than one year.'
