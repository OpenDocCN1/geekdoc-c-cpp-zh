  md: '# # 2.4 SPECIALIST INVESTMENT TECHNIQUES


    # ## 2.4.1 Short Selling


    A short sale is the sale of a security that a seller does not own or that is completed
    by delivery of a borrowed security. The short seller borrows the securities from
    a prime broker in return for paying a daily fee, and promises to replace the borrowed
    securities at some point in the future. The transaction requires the prime broker
    to borrow the shares from a seller and make delivery on behalf of the short seller.
    Prime brokers can borrow securities from custodians who hold large institutional
    investments, mutual and pension funds or from their own proprietary trading accounts.
    The cash from the transaction is held in an escrow account¹⁴ until the short seller
    is in a position to replace the borrowed shares (or they are called by the lender).
    The short seller borrows the securities from the prime broker and has a future
    commitment to replace them, collateral must be posted in form of cash, securities
    or other financial assets. The collateral, in addition to the fee for borrowing
    the securities, provides the prime broker with additional income in the form of
    interest until the shares are returned.¹⁵ In addition, the short seller must cover
    any dividends paid during the period of the loan and in case of any short splits
    e.g. two-for-one, the short seller must pay back twice as many shares.


    The eventual buyer of the short shares is usually unaware that it is a short sale
    so the seller must make arrangements to cover the delivery obligations. The shares
    are transferred to the buyer with full legal ownership, including voting rights
    which can cause a severe problem for the short seller if the prime broker requires
    the securities back (or called-away), for example if the original lender requires
    them for a company shareholder meeting. Although this rarely happens in practice
    short selling carries a great deal of risk, especially if the shares are held
    over a long period of time and the stock fails to decline as expected causing
    them to have to post further margin and eventually forcing the short seller to
    close out their position at a significant loss. However, when stock prices fall,
    short sellers make profit from the short sale, and also benefit of the interest
    income charged by the prime broker on the cash deposit (it is the short rebate).


    It is often the case that hedge funds do not disclose the names of companies they
    are selling short to investors for fear of a short-squeeze. Unexpected news on
    short selling activity can cause share prices to suddenly rise due to potential
    price manipulation through long investors buying additional shares or forcing
    sellers to recall'
