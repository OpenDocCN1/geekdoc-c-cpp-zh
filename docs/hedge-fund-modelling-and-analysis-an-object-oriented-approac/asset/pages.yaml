  md: "![](img/2d1ac831a270b8b08f8b8ec2205913dc_166_0.png)\n\n# FIGURE 4.16 Some typical\
    \ correlation plots\n\nTo obtain a more direct indication of how two random variables\
    \ co-vary; a correlation measure can be used. The correlation is simply a scaled\
    \ version of the covariance with relation to the standard deviations of the two\
    \ sets of random variables. There are several measures for the correlation, often\
    \ denoted $\rho$ (for a population) or $r$ (for a sample), that indicate the degree\
    \ of variation between two random sets of variables. The most common of these\
    \ is the Pearson$^{13}$ product-moment correlation coefficient, which is relevant\
    \ only to linear relationships between two sets of random variables. The correlation\
    \ is +1.0 for a perfectly positive (increasing) linear relationship and a value\
    \ -1.0 for a perfectly negative linear relationship and a value near zero in all\
    \ other cases (see Figure 4.16). Note that if the elements of $X$ and $Y$ are\
    \ independent then the correlation is zero, although this does not indicate a\
    \ lack of variation between $X$ and $Y$ only that there is no linear relationship\
    \ between $X$ and $Y$, such as a curvilinear$^{14}$ relationship.\n\nGiven any\
    \ pair of random variables, $X_i$ and $X_j$, the correlation $\rho_{ij}$ is defined\
    \ as:\n\n```\n$$\\rho_{ij} = \\frac{\text{cov}(X_i, X_j)}{\\sigma_i\\sigma_j}\
    \ \\ (4.19)$\n```"
