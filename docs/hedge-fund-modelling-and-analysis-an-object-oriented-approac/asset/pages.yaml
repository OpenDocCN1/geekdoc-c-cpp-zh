- pgno: 226
  md: "where $\tilde{r}_i$ are the mean return associated with each risky asset $i$\
    \ and $w_i$ are the individual holdings (or weights) invested in each risky asset\
    \ $i$. It is assumed that the portfolio is fully invested so that the total holdings\
    \ in each asset always add up to 100% i.e. the following condition on the weights\
    \ must:\n\n```\n$$\\sum_{i=1}^{N} w_i = 1$\\quad (6.2)\n```\n\nThe portfolio variance\
    \ $\\sigma_p^2$ is given by:\n\n```\n$$\\sigma_p^2 = \\sum_{i=1}^{N} \\sum_{j=1}^{N}\
    \ w_i w_j \\sigma_i \\sigma_j \rho_{ij}$\\quad (6.3)\n```\n\nwhere $w_i$ and $w_j$\
    \ are the weights, $\\sigma_i$ and $\\sigma_j$ are the standard deviations, and\
    \ $\rho_{ij}$ is the correlation between the returns of assets $i$ and $j$. Note\
    \ that for any pair of random variables, $X_i$ and $X_j$, the correlation $\r\
    ho_{ij}$ can be written as:\n\n```\n$$\\rho_{ij} = \\frac{\\sigma_{ij}}{\\sigma_i\
    \ \\sigma_j}$\\quad (6.4)\n```\n\nwhere $\\sigma_{ij} = \text{cov}(X_i, X_j)$.\n\
    \nThe portfolio variance can therefore be written as:\n\n```\n$$\\sigma_p^2 =\
    \ \\sum_{i=1}^{N} \\sum_{j=1}^{N} w_i w_j \\sigma_{ij}$\\quad (6.5)\n```\n\nwhere,\
    \ more formally, $\\sigma_{ij} = \text{cov}(\tilde{r}_i, \tilde{r}_j)$ and $\\\
    sigma_p^2 = \text{cov}(\tilde{r}_p, \tilde{r}_p)$.\n\nBoth the mean portfolio\
    \ return and variance can also be transformed into a compact matrix notation.\
    \ That is, we can write the portfolio return:\n\n```\n$$$r_p = \\sum_{i=1}^{N}\
