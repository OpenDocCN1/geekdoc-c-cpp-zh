    **FIGURE 7.8** The ''child'' and ''parent'' distributions


    Although ES is a more conservative and a useful indication of the estimated VaR
    at a particular confidence level, it is important to note that the ES figure does
    not give indication of the severity of loss by which VaR is exceeded, only the
    expected (or average) loss. Moreover, if considering a 99% confidence in the left-tail
    then, for 100 P&L values, only 1% of 100 i.e. 1 value will be used to determine
    the average of the tail loss. In this case, it is necessary to investigate further
    the area of extreme losses with a deeper analysis of the left-tail of the P&L
    distribution.


    # 7.6 EXTREME VALUE THEORY


    We have already stated and discussed the fact that hedge fund distributions have
    negative skewness and positive excess kurtosis i. the distribution does not adequately
    capture the probability where losses are severe i.e. left-tail. The thinner the
    tails of the normal distribution the larger will be the underestimate of the magnitude
    of the tail losses. This is the branch of mathematics known as *extreme value
    theory*¹¹ (EVT) becomes a very useful tool to apply to such a problem. The theoretical
    foundations of EVT were developed heuristically by Fisher and Tippett (1928) and
    have since applied to insurance and finance by Embrecht et al. (1999). In general,
    EVT is the theory of modelling and measuring events which occur with very small
    probability. Clarity is thus useful for analysing the extreme losses (i.e. left-tail)
    in the return (or P&L) distribution. Indeed, EVT is really the method of extracting
    an accurate measure of the estimated loss given the limited data around an extreme
    event. Figure 7.8 shows the ‘parent’ distribution characterised by the first two
    moments (i.e. $\mu$ and $\sigma$) and a separate ‘child’ distribution that specifically
    characterises the distribution of losses in the left-tail of the parent distribution
    i.e. the extreme tail losses.'
  merge: -1
  img_proc: true
