  md: 'are read as ‘the value 1 to x and assign this value to x’ i.e. increase the
    value of x by 1. Indeed, this statement can also be written in a more compact
    form using compound assignment operators, written as:


    ```

    x += 1;

    ```


    In this statement, as before, x is simply incremented by 1 and the value assigned
    to x. Alternatively, if x is decremented by 1 we can write:


    ```

    x -= 1;

    ```


    The increase (++) and decrease--) operators can also be used to get the same result
    as above, that is:


    ```

    x++; and x--;

    ```


    An interesting characteristic of the increase and decrease operators is that they
    can be either prefix or postfix. If the increase operator is used as a prefix
    i.e. ++x; the value of x is increased before the expression is evaluated. When
    used as a postfix i.e. x++; the value of x is increased after being evaluated.
    Source 1.6 shows an example of the prefix and postfix increase operators.


    # SOURCE 1.6: PREFIX AND POSTFIX OPERATORS


    ```

    // ...


    // Declare variable

    int y = 3;


    // Prefix

    cout << "\n" << "Prefix ++y" << "\n ";

    cout << "x = " << ++y << "\n";

    cout << "y = " << y << "\n\n";


    // Reset y

    y = 3;


    // Postfix

    cout << "\n" << "Postfix y++" << "\n ";

    cout << "x = " << y++ << "\n ";

    cout << "y = " << y << "\n\n";

    ```'
