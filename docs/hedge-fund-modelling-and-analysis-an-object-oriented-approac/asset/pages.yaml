- pgno: 104
  md: 'of hedge fund performance statistics over another. For this reason, it is important
    to note that any given database provides only a sample of the entire hedge fund
    universe, requiring investors to access multiple data sources to get a clearer
    understanding of the investment opportunities and the state of the hedge fund
    industry.


    # 3.2 MAJOR HEDGE FUND INDICES


    In traditional finance, the use of indices is a useful investment tool for managing
    the exposure of a portfolio of indices to market risk i.e. a so-called *passively*
    managed investment style. In the hedge fund world, where performance is driven
    by a manager’s skill and expertise, reflecting an *active* management style, the
    use of hedge fund indices is more surprising, since the concept of an index is
    commonly associated with the notion of passive management. However, many of the
    commercial databases, and a selection of traditional index providers e.g. FTSE
    and Dow Jones, have developed and published a range of hedge fund indices and
    relevant benchmarks.¹ The way such indices are designed and constructed varies
    considerably amongst providers and should be well understood before accepting
    the index has a valued industry benchmark or performance measurement. Many of
    the index providers purport to the best index methodology and construction process
    with strict inclusion criteria and thorough due-discipline procedures. Nevertheless,
    many investors, as well as the industry itself, are wary of considering one index
    better than another and approach the hedge fund index and benchmark area with
    caution.


    # 3.2.1 Non-investable and Investable Indices


    The hedge fund industry is highly heterogeneous making the construction of a satisfactory
    performance index comprises the available hedge fund universe extremely difficult.
    Non-investable hedge fund indices try, at best, to represent the performance of
    a sample of the hedge fund universe taken from a relevant database. However, such
    databases have diverse criteria and methods of index construction leading to many
    differing indices. Although being representative of the hedge fund universe, non-investable
    indices suffer from many unavoidable *biases*.² A further difficulty associated
    with the heterogeneity of hedge funds is the classification of investment styles.
    With over 12,000 active hedge funds in the industry, determining each manager’s
    investment style is virtually impossible. Some index providers have developed
    their own classification system that attempts to capture a high level of homogeneity
    within each investment group and a subsequent level of heterogeneity'
