    function known as a Probability Density Function (PDF). However, before looking
    at such density functions, it is worth taking the time to understand the difference
    between population and samples when discussing probability distributions and associated
    statistical measures.




    A population includes every element from a set of possible observations (i.e.
    the entire data set), whereas a sample consists of only those elements drawn from
    the population. Depending on the sampling method, it is possible to derive any
    number of samples from a population (see Figure 4.5). Furthermore, a statistical
    measure associated with a population, such as mean or standard deviation, is known
    as a *parameter*; but a statistical measure associated with a particular sample
    of the population is called a *statistic*. However, most statistical measures
    in the finance world, although determined from samples of data, are often referred
    to as parameters.


    A sampling method is the process of selecting a sample from the population. When
    considering random sampling, several properties must hold, for example:


