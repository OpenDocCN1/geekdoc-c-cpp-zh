  md: "# Statistical Analysis\n\n# 163\n\n![](img/2d1ac831a270b8b08f8b8ec2205913dc_174_0.png)\n\
    \nThe Maths class contains a number of mathematical functions that we will find\
    \ useful throughout the book and will discuss in more detail and when we make\
    \ more extensive use of its members functions.\n\n\n\nThe strength of the relationship\
    \ between the dependent and independent variables can be determined by calculating\
    \ the coefficient of determination ($R^2$). $R^2$ can be interpreted as the proportion\
    \ of the variance in the dependent variable that is explained or ranges between\
    \ zero and one, zero indicating that the dependent variable cannot be predicted\
    \ from the independent variable and one indicating that there is no error in the\
    \ relationship between the dependent and independent variable. For example, a\
    \ $R^2$ of 0.40 means that 40% of the variance in the dependent variable $Y$ is\
    \ predicted by the independent variable $X$. A related measure to the coefficient\
    \ of determination is the standard error in the regression line (see Box 4.3).\
    \ The standard error of the estimate is a measure of the accuracy of predictions\
    \ made by the regression line. The higher $R^2$, the lower the standard error,\
    \ and the more accurate any predictions based on the regression model.\n\n```\n\
    $R^2 = \\frac{\\sum_{i=1}^n (X_i - \\bar{x})(Y_i - \\bar{y})^2}{\\sqrt{\\sum_{i=1}^n\
    \ (X_i - \\bar{x})^2 \\sum_{i=1}^n (Y_i - \\bar{y})^2}} (4.24)\n```\n\n$\bar{x}$\
    \ and $\bar{y}$ are the mean values of $X_i$ and $Y_i$."
