    \n# 7.2 VALUE-AT-RISK\n\nThe Value-at-Risk (VaR) for a portfolio of assets is\
    \ the worst estimated loss over a given horizon (e.g. monthly) at a specified\
    \ level of confidence (e.g. 95%). That is, the risk of the hedge fund portfolio\
    \ at a specified level of probability in the left-tail of the P&L distribution.\
    \ VaR is often based on the assumption that asset returns follow a normal distribution\
    \ and the performance of the hedge fund portfolio is affected by a set of linear\
    \ market factors. As discussed in Chapter 4, under such assumptions it is possible\
    \ to describe the distribution of asset returns by just two statistical parameters\
    \ i.e. $\\mu$ and $\\sigma$. That is, assuming that a distribution of hedge fund\
    \ P&Ls is characterized by a normal distribution, then at a confidence $c\\%$\
    \ there is an expected loss for the hedge fund of no more than $z_{\\alpha}\\\
    sigma$ standard deviations below the mean over the next month.\n\nFor example,\
    \ at a 95% confidence level (5th percentile or significance), 95% of the time\
    \ loss is expected to be no more than 1.645$\\sigma$. That, the critical value\
    \ is\n\n> VaR is an example of a downside risk measure i.e. the likelihood that\
    \ an investment will decline in value, or the amount of loss that could result\
    \ from such a potential decline."
