    # 7.4 MODIFIED VaR


    Despite the use of tests and scenario analysis, the most erroneous (potentially
    damaging) assumption using traditional VaR methods is that of hedge fund returns
    following a normal distribution. Clearly, this is invalid since it is well known
    that hedge fund returns generally have fatter tails and an asymmetric return distribution
    i.e. the presence of skewness and excess kurtosis. In order to address this issue
    many extensions to the traditional VaR methods have been put forth as better estimators
    of hedge fund market risk. Such methods explicitly incorporate skewness and kurtosis
    into the model or focus primarily on the left-tails of the distribution where
    most of the extreme returns (i.e. large losses) occur. One such extension is the
    modified VaR (MVaR). MVaR explicitly takes account the third and fourth moments
    of the return distribution, similarly skewness and kurtosis. That is, there is
    a branch of mathematics that is involved with power series expansions of quantile
    functions (see Box 7.1) as those related to VaR. Indeed, the higher moments of
    the distribution are incorporated into the VaR measure using the celebrated Cornish-Fisher
    expansion (1937), so that the following power series can be obtained for the first
    few:


    ```

    z_{cf} \approx z_{a} + \frac{1}{2}(z_{a}^2 - 1)s + \frac{1}{24}(z_{a}^3 - 3z_{a})k
    - \frac{1}{36}(2z_{a}^3 - 5z_{a})s^2 \quad (7.4)

    ```


    where $z_{cf}$ is the Cornish-Fisher critical value from the normal distribution
    at the respective significance level, $\alpha$. Note that when the return distribution
    is normally distributed, $s$ and $k$ will both be zero and therefore:


    ```

    z_{cf} \approx z_{\alpha} \quad (7.5)

    ```'
