    The set of all frontier portfolios is called the *minimum variance frontier*.
    Any minimum variance portfolio can be solved by setting up the Lagrangian⁶ corresponding
    to the optimisation problem. The method of Lagrange multipliers is a strategy
    for finding the local maxima and minima of a function subject to *equality* constraints.
    For example, consider the optimisation problem (see Figure 6.5):


    max f(x, y)


    subject to the constraint:


    g(x, y) = 0


    Firstly, we require both f and g to have continuous first order partial derivatives.
    We introduce a new $(\lambda)$ called a Lagrange multiplier defined by:


    $L(x, y, \lambda) = f(x, y) - \lambda \cdot g(x, y) \quad (6.12)$


    The $\lambda$ term may be either added or subtracted. If $f(x_0, y_0)$ is a maximum
    of $f(x, y)$ for the original constrained problem, then there exists $\lambda_0$
    such that $(x_0, y_0, \lambda_0)$ is a stationary point for the Lagrange function
    (stationary points are points where the partial derivatives of $L$ are zero).
    However, not all stationary points yield a solution of the original problem. Thus,
    the method of Lagrange multipliers yields a necessary condition for optimality
    in constrained problems. Sufficient conditions for a minimum or maximum also exist.


