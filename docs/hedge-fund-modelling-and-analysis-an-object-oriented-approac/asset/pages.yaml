    # 2.2.3 Custodian, Auditors and Legal


    Hedge funds are usually held with a *custodian*, including the cash in the fund
    as well as the actual securities.¹¹⁰ The custodian is normally a bank which will
    offer services, such as safekeeping the hedge fund assets, arranging settlement
    of any sales or purchases of securities and managing cash transactions (see Table
    2.3). The general structure of a hedge fund exempt them from the requirement to
    have their financial statements audited by a third party. However, in order to
    satisfy investors, many hedge funds have their accounts and financial reviews
    audited annually by an external audit firm. It is important that the auditing
    firm be so independent of the hedge fund to give credence to their reports and
    services.


    The legal structure of a hedge fund is designed to provide investors with limited
    liability i.e. if a fund suffers loss the maximum amount an investor can lose
    is the level of capital invested in the fund. They cannot be made liable for losses
    this amount or any other outstanding debt or financial obligation. In addition,
    the legal structure is also chosen to optimise the tax status and legal liability
    of the hedge fund itself. To facilitate this, there are a small number of standard
    hedge fund structures e.g. the master-feeder structure, which is adopted by a
    large number of funds.'
