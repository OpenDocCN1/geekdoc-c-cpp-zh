  md: "Tracking error may be calculated from historical performance data or estimated\
    \ for future returns. The former is called *ex-post*, and the latter *ex-ante*\
    \ tracking error. Mathematically, tracking error (*TE*) can be defined in terms\
    \ of the standard deviation (*SD*), such that:\n\n```\n$TE = \\sqrt{\frac{1}{N-1}\
    \ \\sum_{i=1}^{N} (r_{N-1,N} - \\rho^{bm}_{1,N})^2}} \\quad (3.1)$\n```\n\nwhere\
    \ $N$ is the total number of sample data points, $r_{N-1,N}$ is the hedge fund\
    \ return and $\\rho^{bm}_{1,N}$ is the benchmark return. Many practitioners have\
    \ argued the quadratic form of the *TE* is difficult to interpret, and that fund\
    \ managers generally think in terms of linear and not quadratic deviations from\
    \ a benchmark. In this case, TE in terms of the mean absolute absolute deviations\
    \ (*MAD*) can be written as:\n\n```\n$MAD = \\frac{1}{N-1} \\sum_{i=1}^{N} |r_{N-1,N}\
    \ - \\rho^{bm}_{1,N}| \\quad (3.2)$\n```\n\nIn this chapter we have discussed\
