- pgno: 285
  md: 'An estimate of the VaR the GPD approach described above can be written as:


    ```

    $VaR_{1-\alpha} = u + \frac{\beta}{\xi} \left( \left( \frac{N}{n_u} \right)^{-\xi}
    - 1 \right) \quad (7.13)$

    ```


    where $N$ is the total number of data points, and $n_u$ the number of data points
    which exceed the threshold $u$. Furthermore, the method can be extended so that
    the expected shortfall $ES_{1-\alpha}$ can be stated in terms of that is:


    ```

    $ES_{1-\alpha} = \frac{VaR_{1-\alpha} - \beta - \xi u}{1 - \xi} \quad (7.14)$

    ```


    For hedge funds, the amount of data in the tail of the returns distribution is
    often small and leads to broad confidence intervals and weak significance estimates.
    Both the BM and POT method suffer from the problem of limited data although although
    it is possible to reduce the time division in the BM or lower the threshold for
    the POT technique to produce more data points to fit to the desired distribution.


    In this chapter we have provided an introduction to the main quantitative risk
    measures from the traditional VaR approaches to some of the more advanced and
    challenging theoretical hedge fund market models. We have seen throughout the
    book that hedge fund returns usually have fatter tails and an asymmetric return
    distribution which critically violates the assumption of a normal distribution
    that underlies traditional measures. In order to address such limitations many
    extensions to the traditional VaR methods have been developed as better estimates
    of hedge fund market risk. Such methods explicitly incorporate skewness and kurtosis
    into the model or focus primarily on the left-tails of the return distribution
    where most of the large losses occur. Despite the availability of more robust
    and potentially accurate market models, it must be pointed out that the analysis
    covers only one component of the risks associated with hedge funds. A more complete
    treatment would involve incorporating equally important risks into the analysis.
    For example, the monitoring, management and reporting of credit, liquidity and
    operational risk should also be considered alongside market risk in a robust and
    effective hedge fund management process.'
