    primarily driven by the mean, and $\sigma$ standard, of the hedge fund return
    distribution from historical data as well as the inclusion of a degree of subjective
    knowledge (i.e. market experience) into the model necessary. The stochastic model
    is the fundamental building block to MC simulations being used extensively throughout
    the financial markets. For this reason, the MC method is a very powerful and much
    better technique for estimating VaR within the hedge fund community. Not only
    is the method robust and probabilistically strong, it is also an excellent way
    of building in nonlinearity into the distribution and facilitating a better understanding
    of the characteristics of derivatives within the portfolio with greater confidence.
    However, the MC method can easily become mathematically challenging and computationally
    hungry when dealing with the inherent complexities of a particular hedge fund
