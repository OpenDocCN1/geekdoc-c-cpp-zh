    # 1.10.3 Inheritance and Overriding Functions


    It seems a pity, however, to go to all the trouble of creating a class and then
    be forced to create a brand new one that might have similar functionality. It
    would be nicer if we could take the existing class, *clone* it and then make additions
    and modifications to the clone. This is effectively what you get with *inheritance*,
    with the exception that the original class (*base class*) is changed, the modified
    ‘clone’ (the derived class) also reflects changes. For example, consider the base
    type in which each shape has a size, a colour, and a position and so. Each shape
    can be drawn, moved, coloured, etc. From this, specific types of shapes are derived
    (*inherited*) e.g. circle, square, triangle and so on, which may have additional
    characteristics and behaviours. Certain shapes can be flipped, for example. Some
    behaviours may be different, such as when you want to calculate the area of a
    shape. The *hierarchy* embodies the similarities and differences between the shapes
    as shown in Figure 1.1.


    When you inherit from an existing type, you create a *new type*. This new type
    contains not all the members of the existing type but more importantly it *duplicates
    the interface* of the base class.


    So, all the messages you can send to objects of the base class you can also send
    to objects of the derived class. Since we know the type of a class by the messages
    we can send to it, this means the derived class is *the same type as* the base
    class e.g. a circle is a shape. This type equivalence through inheritance is one
    of the fundamental gateways to understanding the meaning of OOP.


    In reality, you have two ways to differentiate your new derived class from the
    original base class. You can simply add *new functions* to the derived class.
    These new functions are not part of the base class interface. This means that
    the base class simply does not do as much as you wanted it to, so you added more
    functions.


    ![](img/2d1ac831a270b8b08f8b8ec2205913dc_58_0.png)


    FIGURE 1.1 Schematic of a typical class hierarchy'
