    # 4.12 LINEAR REGRESSION


    Since the majority of hedge fund strategies heavily invests in underlying financial
    instruments, a hedge manager is heavily exposed to the risks involved in using
    instruments, or so-called market factors. Moreover, many hedge fund managers invest
    in a wide range of financial instruments to effectively implement a particular
    strategy and incorporate a diversity of diversification into their portfolios.
    In order to help with this process, fund managers can identify the risk'
