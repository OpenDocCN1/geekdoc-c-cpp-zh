    # 4.8.1 Standard Normal Distribution


    If $\mu = 0$ and $\sigma = 1$ the distribution is said to be a standard normal
    distribution (or z-distribution), such that:


    ```

    $X \sim N(0,1)$

    ```


    With the following PDF:


    ```

    $f(x) = \frac{1}{\sqrt{2\pi}} \exp(\left(-\{x^2}{2}\right)$

    ```


    The normal random variable of a standard normal distribution is known as a z-score
    (or score). Every normal random variable $X$ can be converted into a z-score using
    the following transformation:


    ```

    $z = \frac{X - \mu}{\sigma}$

    ```


    where $X$, $\mu$ and $\sigma$ are the random variable, mean and standard deviation
    from the original normal distribution, respectively. The z-score indicates the
    number of standard deviations above or below the mean e.g. if the z-score is 2,
    then the original random variable $X$ is 2 standard deviations above the mean.
    A negative z-score means that $X$ is below the standard deviation by a certain
    amount.


    # 4.9 VISUAL TESTS FOR NORMALITY


    # 4.9.1 Inspection


    A quick and simple test to determine how much a series of hedge fund returns deviate
    from normality is to plot the histogram of the empirical distribution against
    a fitted normal distribution. In this case, the bins are additionally used to
    calculate each normal value across the bin range. So that the empirical values
    can be plotted against the normal values, it is necessary to *normalise* each
    value with respect to the total so that each complete sets a *unit area*. Figure
    4.10 shows the empirical distribution plotted against a normal distribution.


    Figure 4.10 shows that the distribution of monthly returns for the CTA Index has
    a reasonable bell-shaped curve which approximates the normal distribution. However,
    there seem to be few spikes that fall outside the normal which would need to be
    investigated further by considering higher moments of the monthly returns distribution
    i.e. the *skew* and *kurtosis* measures.'
