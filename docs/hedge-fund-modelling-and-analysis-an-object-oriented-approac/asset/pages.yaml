    **FIGURE 4.8** The central limit theorem


    where $\mu$ and $\sigma$ are the mean and standard deviation of the probability
    distribution. The normal distribution is considered the most prominent in probability
    and statistical theory (and in finance), and, in many real-life studies, probability
    distributions tend toward the normal distribution provided there are a sufficient
    number of random variables. Indeed, the central limit theorem (also known as the
    law of large numbers) states that the sum of a large number of *independent and
    identically distributed* (iid) random variables have an approximate normal distribution.
    The approximation improves as the number of random variables increases as illustrated
    in Figure 4.8.


    In fact, the normal distribution is often used as a first approximation to a random
    variable that tends to *cluster* around a single mean value i.e. $\mu$. The graph
    of the normal distribution is symmetric about the mean and usually referred to
    as the *bell-shaped* curve as shown in Figures 4.8 and 4.9.


    A normal distribution can be fully described by only two statistical parameters,
    the mean and standard deviation. When a random variable $X$ is distributed with
    a mean $\mu$ and standard deviation $\sigma$, the normal distribution can be denoted
    in the following compact form:


    ```

    $X \sim N(\mu, \sigma^2)$

    ```


    The normal distribution is assumed to approximate the model for many financial
    time series, including the distribution of monthly hedge fund returns, although
    these


