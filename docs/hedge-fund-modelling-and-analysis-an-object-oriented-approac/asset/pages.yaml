  md: 'balancing point in terms of moments. The Omega ratio can therefore be used
    to create rankings based on various return thresholds. The rankings may change
    as a function of a appetite for risk which is interpreted here as the magnitude
    of return threshold depending on their appetite. The Omega ratio is non-parametric
    and reflects all moments of the distribution so a fund with a high excess kurtosis
