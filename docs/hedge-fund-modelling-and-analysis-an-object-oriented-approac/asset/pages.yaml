    BOX 4.2: SQUARE ROOT RULE – SKEW

    To get the annualised figure, the original skew is divided by the square root
    of the frequency representing the original time period e.g. 12 for monthly and
    4 for quarterly. More formally:

    $s_{annual} = s_{monthly}/\sqrt{12}$

    $s_{annual} = s_{quarterly}/\sqrt{4}$


