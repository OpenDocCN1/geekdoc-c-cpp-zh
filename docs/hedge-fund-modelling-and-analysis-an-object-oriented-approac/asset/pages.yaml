    are equal at all four levels of aggregation and asset weighted at the two highest
    levels as be seen in Table 3.6.


    Classification schemes attempt to group hedge fund funds based on their strategy
    and characteristics; however, meaningful groupings are challenging due to the
    inherent heterogeneity of hedge fund investing. Such diversification does not
    allow the development of a single group-based system and any classification is
    likely to be subject to a large degree of subjectivity. The MSCI HFCS overcomes
    this problem by attempting to capture the multi-dimensional nature of hedge fund
    investing through the use of Primary and Secondary Characteristics, as described
    above, to more accurately and effectively identify and define hedge fund strategies.
    The MSCI HFCS strives to offer a balance between a sufficient level of detail
    which permits an accurate classification of a large number of strategies whilst
    also allowing an intuitive understanding of its interpretation and implementation.


