    classification of investment styles. Instead, it concerns the actual managers
    themselves have a great degree of freedom and choice at their disposal.


    By early 2000, many index providers have launched a series of investment indices
    offering a low-cost investment opportunity to gain exposure to the hedge fund
    industry. An index is valuable when the investors are able to replicate the index
    by maintaining and a certain level of tracking error². Generally based on platforms
    of managed accounts³, this new generation of indices has been able to provide
    investors with improved liquidity and a low-cost of gaining access to the hedge
    fund world. In addition, the composition, construction methodology and management
    principles are overseen by an independent committee and disclosed to the public,
    allowing increased transparency. To create an investment index, the index selects
    a range of hedge funds and structured products or derivative instruments that
    deliver the performance of the investable index. To make this, each hedge fund
    agrees to accept investments on the terms given by the index provider. When investors
    buy an investment index the provider makes the investments in the underlying hedge
    funds, making an index similar in many ways to a fund of hedge fund (FoHF⁵ investment.
    In addition, some refer to indices as merely FoHFs in disguise or with additional
    constraints. However, by their very construction, hedge fund indices are unable
    to replicate the hedge fund universe. Such indices cannot, for example, represent
