    Positive (or right) skew indicates a distribution with an asymmetric tail extending
    towards more positive values, whereas negative (or left) skew the tail extends
    towards more negative values (see Figure 4.12). The skew of a normal distribution
    is zero. Hedge fund returns are generally assumed to have either positive or negative
