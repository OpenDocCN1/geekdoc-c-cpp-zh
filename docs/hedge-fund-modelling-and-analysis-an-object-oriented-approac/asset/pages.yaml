    # ### 5.5.4 M-Squared


    The M-squared (MM) metric was developed by Modigliani and Modigliani¹³ as a risk-adjusted
    measure which could be more easily interpreted by an average investor once the
    various hedge funds had been volatility adjusted for their average returns and
    then ranked. The intuition is that by using a benchmark with an estimated volatility
    of the fund is either leveraged or de-leveraged so that its volatility matches
    that of the market benchmark. The leveraged or de-leveraged return of the fund
    is then reported and ranked. As such, the fund''s return can be interpreted as
    the return that would have been produced the fund''s volatility been equivalent
    to that of the market benchmark. When various funds are processed in this way
    and ranked, it is easier for the less sophisticated investor to see how they outperform
    the benchmark to which they have their risk profile matched. In our case, the
    market benchmark (SDX) has an analysed return of 5.36% and a volatility of 10.90%
    for matching purposes. MM is given by:


    > $MM = \frac{\sigma_M}{\sigma_P}(R_p - R_F) - R_F \quad (5.18)$


