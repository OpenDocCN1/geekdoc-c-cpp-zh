    The risk-adjusted return metrics described in this chapter are the most commonly
    used within the hedge fund industry. There are others which have emerged in recent
    times, for example the Stutter index (Stutter 2000), the Sharpe-Omega ratio (Gupta,
    Kazemi and Schneeweiss 2003), AIRAP (Sharma 2004) and Kappa (Kaplan and Knowles
    2004). Lo (2002) also reports a modified risk-adjusted return method adjusted
    for autocorrelation.


    This chapter nonetheless gives a broad introduction to the subject of risk-adjusted
    returns and demonstrates that when appraising hedge fund performance, returns
    must be risk-adjusted to be meaningful.'
