    Although in this case there are only two occasions where we need std, you can
    imagine how this could quickly clog up code for very large programs. Note that
    all C++ statements must end with a semi-colon (;).


    A commonly identified problem with the C language is the issue of running out
    of names for definitions and functions when programs reach very large sizes resulting
    in name clashes. Standard C++ has a mechanism to prevent such a clash through
    the use of the namespace keyword. Each set of C++ definitions in a library or
    program is wrapped in a namespace, if some other definition has an identical name,
    but is in a different namespace, then there no conflict. All Standard C++ libraries
    are wrapped in a single namespace std and invoked with the using keyword:


    using namespace std;


    Whether to use namespace std or explicitly state their use through using std::cout,
    for example, is a purely preference of programming style. The main reason we not
    avoid using namespace std in our programs is that this leaves us the opportunity
    of defining our namespaces if we wish and it is generally good practice to have
    one namespace invocation in program.


    The main function is the point at which all C++ programs start their execution
    even if there are other functions declared in the same. For this reason, it is
    an essential requirement that all C++ programs have a main() function within the
    body at some point in the program. The next output is to the console window, cin.get()
    is used to cause the program to pause so that the user can read the output and
    then close the window by pressing any key. Technically, in C or C++ the main()
    function must return a value because it is declared as int; the main function
    should return an integer data type. The int value that main() returns is usually
    the value that will be passed back to the operating system; in this case it is
    0 i.e. return 0 indicates that the program ran successfully. It is not necessary
    to state return 0 explicitly because the compiler invokes this automatically when
    main() terminates, but it is good practice to include a return type for all functions
    (including main()).


