    # 4.9.2 Normal Probability Plot


    Another very useful data visualisation technique and test for normality is the
    normal probability plot (or normal O-Q plot). Figure 4.11 shows a typical normal
    probability plot for a series of hedge fund returns. If the data is normal, the
    plot should fall more or less on a straight line between the data points. The
    hypothetical CTA data has a very good fit to normality except around the tails
    of the distribution which can be seen from the departure of the data around the
    top and bottom of the straight line. Normal probability plots are often S-shaped
    indicating that the sample data is skewed or has heavier tails in relation to
    the normal distribution. A statistical measure of the goodness-of-fit is the correlation
    between the ordered data and z-scores. If the data are approximately normally
    distributed, then the correlation should be a high value. Normal probability plots
    are easy to construct and interpret with the added advantage that outliers within
    the data are easily identified.


