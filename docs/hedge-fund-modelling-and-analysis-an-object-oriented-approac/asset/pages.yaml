  md: '# Essential C++


    This chapter covers the fundamental requirements necessary to allow the reader
    to get up and running building quantitative models using the C++ programming language.
    This introduction is in no way intended to be an in-depth treatment of the C++
    programming language but more than an overview of the basics required to build
    your own efficient and adaptable programs. Once the key concepts have been developed,
    object-oriented principles are introduced and many of the advantages of building
    quantitative systems using such programming approaches are outlined. It is assumed
    that the reader will have some prerequisite knowledge of a low-level programming
    language and the necessary computation skills to effectively grasp and apply the
    material presented here.




    C is a procedural programming language developed at Bell Laboratories between
    1969 and 1973 Early versions of C were known as K&R C after the publication of
    the book The C Programming Language written by Brian Kernan and Dennis Ritchie
    in 1978, as the language developed and became more standardised, a version known
    as ANSI¹ became more prominent. Although C is no longer the choice of many developers,
    there is still a huge amount of legacy software coded in C that is actively maintained.
    Indeed, C has greatly influenced other programming languages, in particular C++
    which began purely as an extension of C.


    ¹Procedural programming is a form of imperative programming in which a program
    is built from one or more procedures i.e. subroutines or functions.

    ²Founded in 1918, the American National Standards Institute (ANSI) is a private,
    non-profit membership organisation that facilitates the development of American
    National Standards (ANS) by accrediting the procedures of the Standards Developing
    Organizations (SDOs). These groups work cooperatively to develop voluntary national
    consensus standards.'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'Often described as a superset of the C language, C++ uses an entirely different
    set of programming concepts designed around the Object-Oriented Programming (OOP)
    paradigm. Solving a complex problem with OOP involves the design of classes that
    are abstractions of physical objects containing the state, members, capabilities
    and methods of the object. C++ was initially developed by Bjarne Ststrup in 1979
    at Bell Laboratories as an enhancement to C; originally known as C with Classes.
    The language was renamed C++ in the early 80s and by 1998, C++ was standardised
    as ANSI/ISO C++. During this time new features were added to the language, including
    virtual functions, operator overloading, multiple inheritance and exception handling.
    The ANSI/ISO standard is based on two components: the core language and the C++
    Standard Library that incorporates the C Standard Library with a number of modifications
    optimised for use with the C++ language. The C++ Standard Library also includes
    most of the Standard Template Library (STL); a set of tools, such as containers
    and iterators that provide array-like functionality, as well as algorithms designed
    specifically for searching and sorting tasks. C++11 is the most recent complete
    overhaul of the C++ programming language approved by ANSI/ISO on 12 August 2011,
    replacing C++03, and superseded by C++14 on 18 August 2014. The naming convention
    follows the tradition of naming language versions by the year of the specification''s
    publication, although it was formerly known as C++x to take into account many
    publication delays. C++14 is the informal name for the most recent revision of
    the C++ ANSI/ISO standard, intended to be a small extension over C++11, featuring
    mainly bug fixes and small syntax improvements.


