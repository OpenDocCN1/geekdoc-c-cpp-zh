  md: '# CHAPTER 3


    # Hedge Fund Data Sources


    Obtaining accurate, reliable and timely data on hedge funds is of extreme importance
    to a manager or analyst wishing to measure, monitor and assess the returns and
    performance of such investment opportunities. The need for consistent and robust
    hedge fund indices, as well as trustworthy benchmarks for them, is also of enormous
    value and a necessity when trying to obtain a clear representation of a hedge
    funds track record.

    Chapter 3 reviews a variety of prominent commercial hedge fund databases and the
    subsequent indices and benchmarks they produce. In addition, many pitfalls and
    problems that need to be fully understood when interpreting and using such statistics
    are discussed. In particular, the inherent heterogeneity and lack of representativeness
    within the hedge fund universe is highlighted as a major concern in the industry.
    Moreover, some of the most innovative products developed in order to overcome
    some of these shortages are reviewed.




    Many hedge fund managers provide, on a voluntary basis, monthly hedge fund data
    to a variety of commercial databases. These hedge fund databases collect, assimilate
    and produce informative reports, indices and benchmarks based on this for potential
    investors, consultants, analysts and academics involved in investment and research
    on hedge funds. Such data allows the construction and publication of numerous
    non-investable and investable indices that give an indication of the state of
    the hedge fund industry and as important benchmarking indicators. However, due
    to the voluntary nature of a fund manager''s requirement to supply informative
    data, the indices produced by these vendors can be misleading and contain several
    biases and anomalies. Moreover, a complete record of every single hedge fund in
    the industry is simply not available; relevant information comes only from samples
    of the hedge fund universe. The quality and quantity of such data varies between
    vendors and an investor is left to their own judgement in accepting one'
