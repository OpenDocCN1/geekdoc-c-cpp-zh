    # 4.3: STATISTICAL SIGNIFICANCE


    The standard error (se) about the regression line is a measure of the average
    amount that the regression equation over- or under-predicts the model. The se
    is a measure of the standard deviation of the coefficient in the regression model.


    ```

    $se = \sqrt{\frac{(1-R^2)\sum_{i=1}^n(Y_i - \bar{y})^2}{n-2}}$

    ```'
