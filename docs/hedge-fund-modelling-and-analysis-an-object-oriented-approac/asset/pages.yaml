- pgno: 208
  md: '![](img/2d1ac831a270b8b08f8b8ec2205913dc_208_0.png)


    # FIGURE 5.12 Relative directional exposure to a benchmark


    When the hedge fund''s beta is greater than 1.0, it has a tendency to exhibit
    greater moves in its returns (both positive and negative) than those of the benchmark.
    When the fund''s beta is equal to 1.0, the fund is market held long (if the market
    gains 1%, the fund gains 1% and for all intents purposes the fund is exactly matched
    to the market i.e it is the market). When the fund''s beta is between zero and
    1.0, the fund''s returns are less than those of the market (this is the region
    of beta usually occupied by long-short funds). If the fund''s beta is zero, it
    has no impact on the returns of the fund. If the fund''s beta is between zero
    and -1.0, the fund is in a less volatile fashion. If the fund''s beta is -1.0,
    the fund is the benchmark held short and as the fund models the benchmark exactly
    but in the opposite way (if the benchmark market gains 1%, the fund loses 1% and
    vice versa).


    Depending on your objectives, you may have different groups of betas to analyse.
    For example, if you are analysing a group of market neutral managers versus a
    market benchmark you may well have a statistical distribution of betas around
    zero. However, if you are a fund of managers analysing the betas of various hedge
    funds within a diversified fund funds portfolio, you will have a group of betas
    distributed around one. Either way, the beta is the sensitivity of the fund or
    asset relative to some systematic factor such as the market or collective index
    as seen in Merton (1990) in the following:


    ```

    $$\beta_i = \frac{\sigma_{iM}}{\sigma_M^2}$ (5.15)$

    ```


    ```

    $$\alpha_i = \beta_i(R_M - R_F)$ (5.16)$

    ```'
