    The weights must sum to one and that the portfolio must achieve some expected
    return (r*). Note that the following assumes an outright investment of capital
    i.e. the size of the positions in each hedge fund are based upon some amount of
    capital allocated to the portfolio e.g. equals one. Taking into account our optimisation
    problem, the Lagrangian can be written as:


    ```

    $L(\mathbf{w}, \lambda_1, \lambda_2 | \mathbf{R}, \Sigma) = \mathbf{w}^T \mathbf{V}
    \mathbf{w} - \lambda_1(r^* - \mathbf{w}^T \mathbf{R}) - \lambda_2(1 - \mathbf{w}^T
    \mathbf{1})$ \ (6.13)

    ```


    where $\lambda_1$ and $\lambda_2$ are Lagrange multipliers. Differentiating (6.13)
    gives:


    ```

    $$\frac{\partial L}{\partial \mathbf{w}} = \mathbf{w}^T \mathbf{V} - \lambda_1\mathbf{R}^T
    - \lambda_2\mathbf{1}^T = 0$$

    $$\frac{\partial L}{\partial \lambda_1}} = r^* - \mathbf{w}^T \mathbf{R}$$$

    $$\frac{\partial L}{\partial \lambda_2}} = 1 - \mathbf{w}^T \mathbf{1} = 0$$

    ```


    Rearranging leads to:


    ```

    $$\mathbf{w}^T = \lambda_1\mathbf{R}^T\mathbf{V}^{-1} - \lambda_2\mathbf{1}^T\mathbf{V}^{-1}
    = 0$$ \ (6.14)$

    $$\$\mathbf{w}^T \mathbf{1} = 1$$ \ (6.15)$

    $$\$\mathbf{w}^T \mathbf{R} = r^*$$ \ (6.16)

    ```


    Post-multiplying equation (6.14) with $\mathbf{R}$ and recognising the expression
    for $r^*$ in (6.15) gives:


    ```

    $$\mathbf{w}^T \mathbf{R} = r^* = \lambda_1\mathbf{R}^T\mathbf{V}^{-1}\mathbf{R}
    + \lambda_2\mathbf{1}^T\mathbf{V}^{-1}\mathbf{R}$$$ \ (6.17)

    ```


    Similarly, post-multiplying equation (6.14) with $\mathbf{1}$ and recognising
    the expression for 1 in (6.16) gives:


    ```

    $$\mathbf{w}^T \mathbf{1} = 1 = \lambda_1\mathbf{R}^T\mathbf{V}^{-1}\mathbf{1}
    + \lambda_2\mathbf{1}^T\mathbf{V}^{-1}\mathbf{1}$$$ \ (6.18)

    ```


    Noting that:


    ```

    $$\A = \mathbf{1}^T\mathbf{V}^{-1}\mathbf{R}$$$

    $\B = \mathbf{R}^T\mathbf{V}^{-1}\mathbf{R}$$$

    $\C = \mathbf{1}^T\mathbf{V}^{-1}\mathbf{1}$$$

    $\D = BC - A^2$$

    ```'
