    # BOX 3.1: ASSET WEIGHTING SCHEMES


    When measuring the performance of a portfolio of hedge funds or an average of
    a group of funds, it is necessary to assign a particular weight to each of the
    individual funds. There are three major weighting schemes used in the hedge fund
    industry, namely equal, asset and arbitrary weightings.


    # Equal


    If there are N hedge funds in the group of funds, then each fund return has an
    equal weight, w$_i$ in the average that is given by:


    ```

    w_i = \frac{1}{N}

    ```


    The average is a measure of the average behaviour of the fund returns irrespective
    of the amount of AuM (or market capitalisation) of each hedge fund.


    # Asset


    Each hedge fund return is weighted with respect to the amount of AuM in proportion
    to the total assets managed within the group of funds i.e. dollar-weighted'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'averages. If a particular fund $i$ has AuM denoted by $A_i$, then the weight
    of fund $i$ in the average is given by:


    $w_i = \frac{A_i}{\sum_{i=1}^{N} A_i}$


    # Arbitrary


    Each hedge fund return is given an arbitrary weight $w$, within the average which
    can be changed over time. However, the total of all the arbitrary weights must
    always sum to 100%.


    Suppose we have a number of hedge funds, $N$ in a group where the return on fund
    $i$ is denoted by $r_i$ and respective weight $w_i$, then a performance measure
    (or index) for the group can be determined as the weighted average of the individual
    hedge fund returns, such that:


    $r_{index} = \sum_{i=1}^{N} w_i r_i$


