- pgno: 170
  md: '![](img/2d1ac831a270b8b08f8b8ec2205913dc_170_0.png)


    exposure of a given strategy by employing a combination of correlation and regression
    techniques. That is, for a certain hedge fund strategy (or index), a set of related
    market factors can be identified and the strength of their relationship further
    quantified through regression analysis. In this way, a relationship can be ascertained
    between a dependent variable (e.g. hedge fund strategy or index) and a set of
    independent variables (i.e. correlated market factors). Since many fund managers
    rely on the use of derivative instruments and varying degrees of leverage,$^{17}$
    such analysis can only explain part of the risk exposures faced by hedge funds.
    In these cases, a thorough knowledge of the particular strategy and market environment
    allows managers to supplement these quantitative measures with qualitative estimates.


    Linear regression is a parametric method i the regression model is defined in
    terms of a finite number of unknown parameters estimated from a set of data. Linear
    regression involves using the method of ordinary least squares (OLS) to predict
    the value of a dependent variable Y, based on an independent variable X.$^{18}$
    More technically, simply linear regression fits a straight line through a set
    of $n$ data points such that the sum of squared errors i.e. the vertical distances
    between the data points and fitted line, are as small as possible (see Figure
    4.17).


    The linear regression equation is given by:


    ```

    $Y_i = a + bX_i + e_i$

    ```


    $X_i$ are the independent$^{19}$ variables, $Y_i$ are the dependent$^{20}$ variables,
    $b$ the slope of the straight line, $a$ the intercept and $e_i$ are the error
    terms.$^{21}$ capture all of the other'
