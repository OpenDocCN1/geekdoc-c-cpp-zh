    The Omega ratio as defined by Keating and Shadwick (2002) is a non-parametric
    method. it does not rely upon calculating the moments of a distribution of returns
    for determining the ranking of each hedge fund versus a threshold level. Developed
    in the early 2000s it gained popularity with practitioners due to its inclusiveness
    of the full distribution of returns in describing the relative ranking of a fund.
    As such, it incorporates all moments (and theoretically). As mentioned earlier,
    investors like high odd moments and low even moments and the risks of holding
    an asset prone to fourth moment risk are non-negligible. Its popularity also stems
    from the fact that it inherently describes the risk-reward properties of the return
    distribution and so can be easily interpreted. The ratio considers returns below
    and above a specific threshold. In doing so, it places a threshold return on the
    distribution of returns (the return PDF with an area of one underneath) which
    has been accumulated by summing (i.e. taking the integral) from the left hand
    side to form the CDF, F(x). Instead of using the positive and negative signs to
    signify the limits on either side of the integral, we use a for the downside limit
    and b for the upside side. The Omega ratio is written as:


    ```

    $$\Omega(L) = \frac{\int_{L}^{b}(1-F(x))dx}{\int_{a}^{L}F(x)dx}$

    ```


    The returns below a certain threshold are considered as losses, and the returns
    above are considered profits. It follows from (5.20) that a higher value of Omega
    for a given threshold is preferred over a lower value for a rational investor.
    As such when the Omega ratio takes a value of one, it represents the mean of the
    portfolio it is the'
