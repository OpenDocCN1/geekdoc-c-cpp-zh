    used of classical algorithms for simulating the behaviour of various physical
    and mathematical systems having been popularised by John von Neumann and Nicholas
    Metropolis to name but two. MC methods are distinguished from other simulation-based
    methods by being of a stochastic nature, that the MC model includes a non-deterministic
    component that introduces a degree of uncertainty or randomness into the process
    through the use of random generators. The fundamental idea


    > ⁶ John von Neumann (1903–1957) was a Hungarian-American mathematician who made
    major contributions...\⁷ Nicholas Metropolis (1915–1999) was a Greek American
    physicist.

    ⁸ MC simulations rely heavily on the sampling method and stability of the random
    number generator (RNG). For this reason, many financial houses spend a great deal
    of time, money and effort developing better and more robust RNGs.'
