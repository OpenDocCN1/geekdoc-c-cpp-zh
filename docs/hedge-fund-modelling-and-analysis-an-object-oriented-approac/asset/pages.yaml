    # 4.6 PROBABILITY DENSITY FUNCTION


    Given a continuous random variable, $X$, the PDF$^6$ of $X$ is a function $f(x)$
    such that for two numbers, $a$ and $b$ with $a \le b$ we have:


    ```

    $P(a \le X \le b) = \int_{a}^{b} f(x)dx \quad (4.2)$

    ```


    where $f(x)\ge 0$ for all $x$. The PDF of a continuous random variable is a function
    which integrated over the limits $a$ to $b$ gives the probability that the random
    variable will have a value within that interval (or domain). More formally, the
    probability that $X$ is a value in the interval $[a, b]$ equals the area under
    the PDF from $a$ to $b$ (see Figure 4.6).


    As with probability distributions, the total probability for a continuous probability
    distribution must also be one. Moreover, the total area under the PDF is always
    equal to one, that is:


    ```

    $\int_{-\infty}^{\infty} f(x)dx = 1 \quad (4.3)$

    ```'
