  md: '# Hedge Fund Data Sources


    EDHEC use a method of factor analysis to develop a set of hedge fund indices that
    are the best one-dimensional summaries of information within the competing indices
    for a given investment style. Mathematically, this involves finding the first
    component of competing indices using their historical performance data. The first
    principal component has a built-in element of *optimality*,¹⁴ because there is
    no other linear combination of competing indices that implies a lower information
    loss. Indeed, information is lost where the heterogeneity in the competing hedge
    funds'' *construction* is the most severe. Since competing indices are affected
    in different ways by measurement indices, determining the linear combination of
    competing indices that implies a maximisation of the variance explained, leads
    implicitly to a minimisation of the bias.




    Hedge funds report monthly returns to commercial databases on a voluntary basis;
    such participation means that only a portion of the hedge fund universe is observable
    and represented. For example, hedge fund managers will tend to report to databases
    when their performance is good and stop reporting once they become attractive.
    This effect leads to a variety of bias in the databases which can lead to vendors
    misleading and incomplete return statistics, especially when considering index
    construction and their subsequent publication. Such problem does not occur in
    the mutual industry, where public disclosure of net asset values is enforceable
    by law causing a natural convergence of the universe and database of mutual funds.
    However, it is well known that hedge fund performance data and their benchmarks
    inherit, it is particularly important to be completely aware of the origin and
    the consequence of potential measurement biases.




    If a database contains only information on funds that are active and regularly
    report to a database (i.e. live funds), then a *survivorship bias* can be introduced
    into calculated performance measures and indices constructed using such data.
    It is, however, important to distinguish between funds that simply existed (a
    defunct funds) and those that have ceased operation altogether due to bankruptcy
    or liquidation (dead funds). A defunct fund is a fund that was in a database but
    ceases to report information to the vendor for whatever reason (e.g. merger);
    a dead fund is one that is known to have terminated operations and closed down
    completely. Clearly, a dead fund must also be a defunct fund, but a defunct fund
    need not necessarily be a'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'dead fund. Other funds that are defunct but not dead are those that have reached
    their capacity and no longer require additional capital or the need to attract
    investors. Alternatively, the fund manager may believe their performance is so
    good that their investment style must remain private and no longer wish to provide
    sensitive information to a database that may be publicly available.


    The effect of survivorship bias has well known in the mutual fund industry for
    some time and fairly straightforward to determine. The standard method of determining
    the survival bias, first proposed by Malkiel (1995), is to obtain the universe
    of all mutual funds that are active during a given time period. The average return
    of all funds is compared with that of the surviving funds at the end of the period.
    The return difference is survivorship bias. However, survival bias in hedge funds
    cannot be measured directly because the universe of hedge funds is not readily
    observable. Survival bias can only be estimated using a sample of hedge funds
    in a database. Technically, over any sample period, if a complete record of defunct
    funds is available, survivorship bias can be estimated through tedious data manipulation.
    The problem is in verifying the completeness of historical records on defunct
    hedge funds. The magnitude of the survivorship bias generally depends on two parameters,
    namely:


    +   1. The attrition rate¹⁵ and

    2. The average returns difference between surviving and dead funds.


    The hedge fund industry is all aware that the exclusion of a fund from a database
    can lead to an upward bias in hedge fund returns and an understated historical
    risk. Xu, Liu and Lovisecek (2009) studied a major commercial database of hedge
    funds from were much worse than the industry would have believe since many failing
    funds stop reporting their performance. The gap in returns between these failing
    funds and others averaged from January 1994 to March 2009 and found that hedge
    fund returns were generally much 0.54% a month, or about 6% per annum. This is
    an extremely high figure and suggests that average reported hedge fund returns
    sets an unrealistic expectation for hedge fund investors.


    With regard to defunct funds, there exists another type of bias, liquidation bias.
    This is a result of the fund stopping reporting hedge fund performance to the
    database several months prior to the final liquidation value of the fund whilst
    concentrate on winding down their operations. This generally causes an upward
    bias in the returns of defunct funds. The opposite of liquidation bias is participation
    bias. This bias can occur with a successful fund manager who closes his fund and
    stops reporting his results because he no longer needs to attract new capital.


    Another related concept to survivorship bias, and again a result of voluntary
    reporting, is self-selection bias. Funds not performing well can hide biases in'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# Hedge Fund Data Sources


    to avoid investors withdrawing their money whereas funds performing may well wish
    to protect their investment strategies, and stop the inflow of capital by ceasing
    to report and closing the fund. In fact, some hedge fund managers choose to be
    included in a database, period by period, depending on the fund''s performance.¹16
    The fact that hedge fund managers can choose to participate in the database leads
    to a self-selection bias. Such a bias is almost impossible to determine let alone
    measure.




    For many databases, there is often a sizeable lag before a fund''s inception date
    and the date at which the returns are submitted to a particular database. This
    time lag typically corresponds to the fund incubation period (12–18 months) where
    the performance of the fund is evaluated using *seed* investment before being
    publicly offered to investors in order to attract further capital. Once a manager
    is in position to submit attractive performance data to a database, they naturally
    choose the start date that shows the fund in the most positive light. The database
    introduces an ''instant history'' bias into the data when they decide to *backfill*
    the data to show the historic performance of the hedge fund even though such data
    was not available when the database was established. Clearly, such funds are likely
    to be those that offer higher returns and therefore backfilled will invariably
    inflate the performance of the fund in the earlier days. Different databases handle
    the issue of backfilling differently, and as a result, the impact of this bias
    varies between vendors. To reduce or avoid this bias some vendors do not backfill
    returns at all. However, backfill only a few months; in any event, performance
    returns obtained from databases should be handled with care.




    The development of traditional indices rests on the assumptions that the instruments
    are homogeneous, and that an investor follows a simple *buy and hold* strategy.
    Traditional indices are constructed to represent the return of the market portfolio;
    an asset-weighted combination of all investable instruments in that class or a
    suitably equivalent proxy. These indices are designed to directly define the risk
    premium available to investors exposing themselves to the systemic risk of the
    asset class. For example, an investor trading in the Dow will be exposed to a
    broad range of market risks based on 30 US large cap equities i.e. there exists
    a general equilibrium model. However, such a model is still absent from the hedge
    fund world. In the early years of hedge funds, investment committees established
    a type of fund performance indicator based on an *absolute return*, loosely defined'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'as a flat rate of return obtainable under any market condition (i.e. 14.0%
    p.a.) with no reference to a market average or peer group measure. As the market
    became challenging and competitive for hedge fund managers, benchmarking to an
    absolute return in its pure sense became practically impossible. Hedge fund managers
    naturally focus their efforts on liquid markets, where trading opportunities and
    leverage are readily available. Thus, as the dynamics in the global markets change,
    the nature of hedge funds in the market also changes. Benchmarking such a dynamic
    industry in itself is an arduous task, and the difficulty is further exemplified
    by the fact that the hedge funds that constitute the benchmarks are drawn from
    a sample of funds managed by managers with diverse investment styles. For this
    reason, investors are increasingly relying on a range of hedge fund indices, discussed
    above with their inadequacies, as their primary method of benchmarking. Benchmarking
    with an index only makes sense if the index has the following characteristics
    and attributes:


    +   - Representative

    - Rule-based

    - Fully investable

    - Transparent

    - Diversified

    - Timely reported and

    - Liquid.


    Having a reliable benchmarking system is one of the biggest challenges that institutional
    investors face when selecting and evaluating hedge fund managers and their returns.
    Most institutional investors are interested in how hedge fund strategies correlate
    with and compare to broad market indices for portfolio construction, optimisation
    and asset allocation purposes. As the hedge fund industry matures and becomes
    ever more driven by large institutional investment, benchmarking is sure to increase.


    # 3.4.1 Tracking Error


    The tracking error is a measure of how closely a portfolio follows the index to
    which it is benchmarked. The lower the tracking error, the more the fund resembles
    the benchmark''s risk and return characteristics. In all cases, the benchmark
    is the measured position of neutrality for the hedge fund manager. If a manager
    were to simply follow the benchmark, the expectation would be that their performance
    equal the performance of the benchmark, and their tracking error should be zero.
    The most common measure is the difference in the return earned by a portfolio
    and the return earned by the benchmark against which the portfolio is constructed.
    For example, if a particular hedge fund earns a return of 9.15% during a period
    when the particular benchmark produces a return of 9.07%, the tracking error is
    0.08%, or 8 basis points.'
