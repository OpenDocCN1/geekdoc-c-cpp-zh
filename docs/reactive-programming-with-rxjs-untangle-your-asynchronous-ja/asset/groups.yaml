    \  },\n  function(err) {\n    document.body.textContent = 'There was an error\
    \ retrieving content';\n  }\n);\n\nRx.DOM.get('/remote/content').subscribe(subject);\n\
    ```\n\nIn the code, we initialize a new BehaviorSubject with our placeholder content.\
    \ Then we subscribe to it and change the HTML body content in both onNext and\
