    # The Modern Web


    Get up to speed on the latest HTML, CSS, and JavaScript techniques.


    # HTML5 and CSS3 (2nd edition)


    HTML5 and CSS3 are more than just buzzwords—they''re the foundation for today''s
    web applications. This book gets you up to speed on the HTML5 elements and CSS3
    features you can use right in your current projects, with backwards compatible
    solutions that ensure you don''t leave users of older browsers behind. This new
    edition covers even more new features, including CSS animations, IndexedDB, and
    client-side validations.


    Brian P. Hogan

    (314 pages) ISBN: 9781937785598.838

    https://prprog.com/book/bhh52e


    ![](img/a8eed7bbb390e0eff6b6561c329a113c_138_0.png)


    # Async JavaScript


    With the advent of HTML5, front-end MVC, and Node.js, JavaScript is ubiquitous—and
    messy. This book will give you a solid foundation for managing async tasks without
    losing your sanity in a tale of callbacks. It''s a fast-paced guide to the most
    essential techniques for dealing with async behavior, including PubSub, event
    models, and Promises. With these tricks up your sleeve, you''ll be better prepared
    to manage the complexity of large web apps and deliver responsive code.


    Trevor Burnham

    (104 pages) ISBN: 9781937785277.817

    https://prprog.com/book/tbjs5


    ![](img/a8eed7bbb390e0eff6b6561c329a113c_138_1.png)


    # Long Live the Command Line!


    Use tmux and Vim for incredible mouse-free productivity.


    # tmux


    Your vim is slowing down. The time you spend context switching between your editor
    and your console eats away at your productivity. Take control of your environment
    with tmux, a terminal multiplexer that you can tailor to your workflow. Learn
    how to customize, search, and leverage tmux''s unique abilities and keep your
    fingers off your keyboard''s home row.


    Brian P. Hogan

    (88 pages) ISBN: 978194356968. $16.25

    https://pragprog.com/book/bhtmux


    ![](img/a8eed7bbb390e0eff6b6561c329a113c_139_0.png)


    # Practical Vim, Second Edition


    Vim is a fast and efficient text editor that will make you a faster and more efficient
    developer. It''s available on almost every OS, and if you master the techniques
    in this book, you''ll never need another text editor. More than 120 Vim tips,
    you''ll quickly learn the editor''s core functionality and tackle your trickiest
    editing and writing tasks. This beloved bestseller has been revised and updated
    to Vim 7.4 and includes three brand-new tips and five fully revised tips.


    Drew Neil

    (354 pages) ISBN: 978168501278. $29

    https://pragprog.com/book/dnvim2


    ![](img/a8eed7bbb390e0eff6b6561c329a113c_139_1.png)


