    # 现代 Web 开发


    掌握最新的 HTML、CSS 和 JavaScript 技术。


    # HTML5 和 CSS3 (第2版)


    HTML5 和 CSS3 不仅仅是流行语——它们是当今 Web 应用的基。本书将帮助你掌握可以在当前项目中使用的 HTML5 元素和 CSS3 特性，并提供向后兼容的解决方案，确保你不会忽视旧版浏览器用户。新版涵盖了更多新特性，包括
    CSS 动画、IndexedDB 和客户端验证。


    Brian P. Hogan

    (314 页) ISBN: 9781937785598.838

    https://prprog.com/book/bhh52e


    ![](img/a8eed7bbb390e0eff6b6561c329a113c_138_0.png)


    # 异步 JavaScript


    随着 HTML5、前端 MVC 和 Node.js 的出现，JavaScript 已经无处不在——但也变得混乱。这本书将为你提供管理异步任务的坚实基础，让你在陷入回调的泥潭时保持理智。这是一本快速节奏的指南，介绍了处理异步行为的最核心技术，包括发布/订阅（PubSub）、事件模型和
    Promises。掌握了这些技巧，你将能够更好地管理大型 Web 应用的复杂性并交付响应式代码。


    Trevor Burnham

    (104 页) ISBN: 9781937785277.817

    https://prprog.com/book/tbjs5


    ![](img/a8eed7bbb390e0eff6b6561c329a113c_138_1.png)


    # 命令行万岁！


    使用 tmux 和 Vim 实现惊人的无鼠标效率。


    # tmux


    你的 Vim 变慢了。你在编辑器和控制台之间切换上下文的时间消耗了你的效率。使用 tmux 来控制你的环境，它是一个终端复用器，可以根据你的工作流进行定制。学习如何自定义、搜索和利用
    tmux 的独特能力，让你的手指无需离开键盘的起始行。


    Brian P. Hogan

    (88 页) ISBN: 978194356968. $16.25

    https://pragprog.com/book/bhtmux


    ![](img/a8eed7bbb390e0eff6b6561c329a113c_139_0.png)


    # 实战 Vim，第二版


    Vim 是一个快速高效的文本编辑器，它将让你成为更快速、更高效的开发者。它几乎适用于所有的操作系统，如果你掌握了书中的技巧，你将不再需要其他文本编辑器。通过
    120 多个 Vim 技巧，你将快速学会编辑器的核心功能并应对最复杂的编辑和写作任务。这本受欢迎的畅销书已更新至 Vim 7.4，包含了三个全新的技巧和五个经过完全修订的技巧。


    Drew Neil

    (354 页) ISBN: 978168501278. $29

    https://pragprog.com/book/dnvim2


    ![](img/a8eed7bbb390e0eff6b6561c329a113c_139_1.png)


