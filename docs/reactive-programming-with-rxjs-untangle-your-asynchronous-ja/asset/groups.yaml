    \ of Idyllwild-Pine Cove, California\",\n        \"time\": 1408030368460\n   \
    \   },\n      \"geometry\": {\n        \"type\": \"Point\",\n        \"coordinates\"\
    : [ -116.7636667, 33.7303333, 17.33 ]\n      },\n      \"id\": \"ci555383777\"\
    \n    }\n  ]\n})\n```\n\n`features` 数组包含一个带有今天发生的每场地震数据的对象。那是一大量的数据！一天之内发生这么多地震，真是令人惊叹（也令人恐惧）。对于我们的程序，我们只需要坐标。\n\
