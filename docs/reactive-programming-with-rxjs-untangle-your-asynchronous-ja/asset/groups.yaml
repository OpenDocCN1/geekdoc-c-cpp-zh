- md: "\n## Chapter 4. Building a Complete Web Application\n\n- We call isHovering\
    \ with the current row and we subscribe to the resulting Observable. If the hovering\
    \ argument is true, we'll paint the circle red; otherwise, it will be blue.\n\
    - We subscribe to the Observable created from the click event in the current row.\
    \ When in the row is listed, the the map will be centered on the corresponding\
    \ circle in the map.\n\n## Making It Efficient\n\nExperienced front-end developers\
    \ know that creating many events on a page is a recipe for bad performance. In\
    \ our previous example, we created three events for each row. If we get 100 earthquakes\
    \ on the list, we would have 300 events floating around the page just to do some\
    \ light highlighting work! That is terrible for performance, and we can do better.\n\
    \nBecause events in DOM always bubble up (from children to parent elements), a\
    \ well-known technique among front-end developers to avoid attaching mouse events\
    \ to elements individually is to attach them instead to their parent element.\
    \ Once the event is fired on the parent, we can use the event's target property\
    \ to find the child element that was the event's target.\n\nBecause we need similar\
    \ functionality for the events click and mouseover, we'll create a function getRowFromEvent:\n\
    \n```javascript\nexamples_earthquake_ui/code3.pairwise.js\nfunction getRowFromEvent()\
    \ {\n  return Rx.Observable\n    .fromEvent(table,event)\n    .filter(function(event)\
    \ {\n      var el = event.tagName === 'TD' && el.parentNode.length;\n    })\n\
    \    .pluck('target', 'parentNode')\n    .distinctUntilChanged();\n}\n```\n\n\
    getRowFromEvent gives us the table row in which the event has happened. Here are\
    \ the details:\n\n- We make sure that we get events happening in a table cell,\
    \ and we check that the parent of that cell is a row with an ID attribute. These\
    \ rows are the ones we tagged with the earthquake ID.\n- The pluck operator extracts\
    \ the nested property parentNode inside the element's target property.\n- This\
    \ prevents getting the same event more than once. That would happen a lot with\
    \ the mouseover event, for example.\n\nIn the previous section we attached the\
    \ events mouseover and mouseout on row to change the earthquake circle color each\
    \ time the mouse entered or exited the row. Now, we'll use only the mouseover\
    \ event on the table, combined with the convenient pairwise operator:\n\n```javascript\n\
    examples_earthquake_ui/code3.pairwise.js\ngetRowFromEvent('mouseover')\n  .pairwise()\n\
    \  .subscribe(function (rows) {\n    var prevCircle = quakeLayer.get(codeLayers[rows[0].id]);\n\
    \    var currCircle = quakeLayer.get(codeLayers[rows[1].id]);\n    prevCircle.setStyle({\
    \ color: '#0000ff' });\n    currCircle.setStyle({ color: '#ff0000' });\n  });\n\
    ```\n\npairwise gives each emitted value with the previously emitted value in\
    \ an array. Because we are getting distinct rows, pairwise will always yield the\
    \ row that the mouse just left and the row where the mouse is hovering now. With\
    \ this, it is easy to color each earthquake circle correctly.\n\nHandling the\
    \ click event is even simpler:\n\n```javascript\nexamples_earthquake_ui/code3.pairwise.js\n\
    getRowFromEvent('click')\n  .subscribe(function(row) {\n    var circle = quakeLayer.getLayer(codeLayers[row.id]);\n\
    \    map.panTo(circle.getLatLng());\n  });\n```\n\nAnd we can go by just subscribing\
    \ to quotes to generate the rows:\n\n```javascript\nexamples_earthquake_ui/code3.pairwise.js\n\
    quakes\n  .pluck('properties')\n  .map(mapRow)\n  .subscribe(function(row) { table.appendChild(row);\
    \ });\n```\n\nOur code is now much cleaner and idiomatic, and it doesn't depend\
    \ on the rows being there. If there are no rows, getRowFromEvent won't try to\
    \ yield any.\n\nWhat's more important, our code now is very efficient. Regardless\
    \ of the amount of earthquake information we retrieve, we'll always have just\
    \ a single mouseover event and a single click event, instead of hundreds of events.\n\
    \n## Getting Real-Time Updates from Twitter\n\nThe second part of our plan to\
    \ make a real-time dashboard for earthquakes is to add reports and information\
    \ from Twitter related to the different earthquakes happening on the planet. For\
    \ this, we will create a small Node.js program that will fetch the stream of tweets\
    \ related to the earthquakes.\n\n## Setting Up Node.js Environment\n\nLet's configure\
    \ our Node.js application. Besides RXJS, we will be using two venerable third-party\
    \ modules to make our life easier: ws and twit¹. Any similar modules should work\
    \ with minimal changes to the code.\n\nFirst, let's create a folder for our application\
    \ and install the modules that we use. (Note that the output of the npm command\
    \ may vary depending on the current versions of the packages).\n\n```bash\n$ mkdir\
    \ tweet_stream\n$ cd tweet_stream\n~/tweet_stream npm install ws twit rx\nrx@3.1.2\
    \ node_modules/rx\n\ntwit@0.1.19 node_modules/twit\n  oauth@0.9.9\n```\n\n```bash\n\
    ws@0.8.0 node_modules/ws\n  options@0.0.6\n  ultron@1.0.2\n  utf-8-validate@1.2.1\
    \ (bindings@1.2.1, nan@2.0.9)\n  bufferutil@1.2.1 (bindings@1.2.1)\n```\n\n##\
    \ Client–Server Communication\n\nNow we're ready to start building the application.\
    \ Let's create a new file called index.js inside the tweet_stream folder.\n\n\
    ```javascript\nexamples_earthquake_ui/tweet_stream/index.js\nvar WebSocket = require('ws');\n\
    var Twit = require('twit');\nvar Rx = require('rx');\n```\n\nTo use the API, we\
    \ need to register a consumer key and access token. In the preceding code, we\
    \ use WebSocket to create a server. When a client connects to the server, the\
    \ server emits a connection event.\n\n[content]...\nFantastic! The browser should\
    \ be sending commands to the server as soon as it starts receiving earthquakes\
    \ from the remote JSON resource. Now, the server completely ignores these messages.\
    \ Time to go back to our tweet stream code and do something with them.\n\nFirst\
    \ we connect to the message events that arrive at the server from the browser\
    \ client. Whenever the client sends a message, the WebSocket server emits a message\
    \ event with the contents of the message. In our case, the contents are a stringified\
    \ object.\n\nIf we restart the server (Ctrl-C in the terminal) and reload the\
    \ browser, we should see the earthquake details being printed in the terminal\
    \ as they come in. That's perfect. We're ready to start looking for tweets related\
    \ to our earthquakes.\n\n## Retrieving and Sending Tweets\n\nWe're using the streaming\
    \ Twitter client for Node.js tw to connect to Twitter and search tweets. All the\
    \ code in the server from now on will happen inside\n"
  mdcn: "\n\n## 第 4 章 构建一个完整的 Web 应用程序\n\n- 我们对当前行调用 `isHovering` 并订阅返回的 `Observable`。如果\
    \ `hovering` 参数为 `true`，我们将圆圈涂成红色；否则，它将是蓝色。\n- 我们订阅从当前行的点击事件创建的 `Observable`。当行被列出时，地图将对齐到对应的圆圈。\n\
    \n## 让它更高效\n\n经验的前端开发者知道，在页面上创建许多事件是性能低下的罪祸源。在我们之前的示例中，我们为每一行创建了三个事件。如果列表中有 100\
    \ 次地震，页面上就会有 300 个事件在浮动，而仅仅是为了做一些轻量的高亮工作！这对性能来说太糟糕了，我们可以做得更好。\n\n由于 DOM 中的事件总是会冒泡（从子元素到父元素），前端开发者中一种避免单独为元素绑定鼠标事件的常用技术是将其它们绑定到父元素上。一旦事件在父元素上触发，我们就可以使用事件的\
    \ `target` 属性来找到作为事件目标的子元素。\n\n因为我们需要为 `click` 和 `mouseover` 事件实现类似的功能，我们将创建一个函数\
    \ `getRowFromEvent`：\n\n```javascript\nexamples_earthquake_ui/code3.pairwise.js\n\
    function getRowFromEvent() {\n  return Rx.Observable\n    .fromEvent(table,event)\n\
    \    .filter(function(event) {\n      var el = event.tagName === 'TD' && el.parentNode.length;\n\
    \    })\n    .pluck('target', 'parentNode')\n    .distinctUntilChanged();\n}\n\
    ```\n\n`getRowFromEvent` 为我们提供了事件发生的表格行。以下是详细信息：\n\n- 我们确保获取的是发生在表格单元格中的事件，并检查该单元格的父级是否带有\
    \ `ID` 属性的行。这些行就是我们标记了地震 ID 的行。\n- `pluck` 操作符提取元素 `target` 属性内部的嵌套属性 `parentNode`。\n\
    - 这防止了多次获取同一个事件。例如，在 `mouseover` 事件中，这种情况经常发生。\n\n在上一节中，我们在行上绑定了 `mouseover` 和\
    \ `mouseout` 事件，以便在每次鼠标进入或离开行时改变地震圆圈的颜色。现在，我们将仅在表格上使用 `mouseover` 事件，并结合方便的 `pairwise`\
    \ 操作符：\n\n```javascript\nexamples_earthquake_ui/code3.pairwise.js\ngetRowFromEvent('mouseover')\n\
    \  .pairwise()\n  .subscribe(function (rows) {\n    var prevCircle = quakeLayer.get(codeLayers[rows[0].id]);\n\
    \    var currCircle = quakeLayer.get(codeLayers[rows[1].id]);\n    prevCircle.setStyle({\
    \ color: '#0000ff' });\n    currCircle.setStyle({ color: '#ff0000' });\n  });\n\
    ```\n\n`pairwise` 将每个发射的值与上一个发射的值放在一个数组中。由于我们获取的是不同的行，`pairwise` 始终会产生鼠标刚刚离开的行和鼠标当前悬停的行。有了它，可以很容易地为每个地震圆圈着色。\n\
    \n处理点击事件更加简单：\n\n```javascript\nexamples_earthquake_ui/code3.pairwise.js\ngetRowFromEvent('click')\n\
    \  .subscribe(function(row) {\n    var circle = quakeLayer.getLayer(codeLayers[row.id]);\n\
    \    map.panTo(circle.getLatLng());\n  });\n```\n\n我们只需要通过订阅引用来生成行：\n\n```javascript\n\
    examples_earthquake_ui/code3.pairwise.js\nquakes\n  .pluck('properties')\n  .map(mapRow)\n\
    \  .subscribe(function(row) { table.appendChild(row); });\n```\n\n我们的代码现在变得整洁得多且符合习惯，并且它不依赖于行是否存在。如果没有行，`getRowFromEvent`\
    \ 就不会尝试产生任何输出。\n\n更重要的是，我们现在的代码非常高效。无论我们检索到多少地震信息，我们始终都只有一个 `mouseover` 事件和一个\
    \ `click` 事件，而不是成百上千个事件。\n\n## 从 Twitter 获取实时更新\n\n我们制作地震实时仪表板计划的第二部分是添加来自 Twitter\
    \ 的报告和信息，这些信息与全球发生的不同地震有关。为了实现这一目标，我们将编写一个小的 Node.js 程序，该程序将获取与地震相关的推文流。\n\n##\
    \ 设置 Node.js 环境\n\n让我们配置我们的 Node.js 。除了 RXJS，我们还将使用两个老牌第三方模块来让我们的生活更轻松：`ws` 和\
    \ `twit`¹。任何类似的模块都应该通过极少的代码更改即可工作。\n\n首先，为我们的应用程序创建一个文件夹并安装我们使用的模块。（注意，`npm` 命令的输出可能取决于包的当前版本）。\n\
    \n```bash\n$ mkdir tweet_stream\n$ cd tweet_stream\n~/tweet_stream npm install\
    \ ws twit rx\nrx@3.1.2 node_modules/rx\n\ntwit@0.1.19 node_modules/twit\n  oauth@0.9.9\n\
    ```\n\n```bash\nws@0.8.0 node_modules/ws\n  options@0.0.6\n  ultron@1.0.2\n  utf-8-validate@1.2.1\
    \ (bindings@1.2.1, nan@2.0.9)\n  bufferutil@1.2.1 (bindings@1.2.1)\n```\n\n##\
    \ 客户端–服务器通信\n\n现在我们准备好构建应用程序了。让我们在 `tweet_stream` 文件夹中创建一个名为 `index.js` 的文件。\n\
    \n```javascript\nexamples_earthquake_ui/tweet_stream/index.js\nvar WebSocket =\
    \ require('ws');\nvar Twit = require('twit');\nvar Rx = require('rx');\n```\n\n\
    为了使用 API，我们需要注册消费者密钥（consumer key）和访问令牌（access token）。在前面的代码中，我们使用 `WebSocket`\
    \ 创建了一个服务器。当客户端连接到服务器时，服务器会触发一个 `connection` 事件。\n\n太棒了！一旦浏览器从远程 JSON 资源接收到地震，它就会向服务器发送指令。现在，服务器完全忽略了这些消息。是时候回到我们的推文流代码并对它们进行处理了。\n\
    \n首先，我们连接到从浏览器客户端到达服务器的 `message` 事件。每当客户端发送消息时，WebSocket 服务器就会触发一个 `message`\
    \ 事件，并附带消息的内容。在我们的案例中，这些内容是字符串化后的对象。\n\n如果我们重启服务器（在终端中按 Ctrl-C）并刷新浏览器，我们应该能在终端中看到随着地震的接收而打印出来的地震详情。太完美了。我们准备好开始寻找与我们的地震相关的推文了。\n\
    \n## 获取和发送推文\n\n我们正在使用 Node.js 的流式 Twitter 客户端 `twit` 来连接 Twitter 并搜索推文。从现在开始，服务器中的所有代码都将在内部\n\
    \n"
