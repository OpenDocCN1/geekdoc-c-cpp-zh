    \n**Sergi Mansilla**\n由 Rebecca Gulick 编辑\n\n# 对《使用 RxJS 进行响应式编程》的早期赞誉\n\n软件开发的每一次重大转变都要求我们重新思考自己的方法。实时和异步\
    \ Web 应用给当今的 Web 开发带来了巨大挑战。这本书很好地解释了 RxJS 如何解决这些挑战，并教导你如何从可观测流（Observables）的角度重新审视你的世界。\n\
    \n- Zef Hemel\nSTX Next 工程部副总裁\n\n这本书就像响应式编程本身一样火热！凭借出色的文笔、清晰的解释和实用的示例，它是学习 RxJS\
