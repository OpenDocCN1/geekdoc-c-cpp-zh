    \ game we have so far: if you move the mouse, the enemies go faster toward you!\
    \ That could be a nice feature in the game, but we definitely didn't intend to\
    \ do that. Can you guess what causes this bug?\n\nIf you guessed that it was related\
    \ to the paintEnemies function, you're right on the money. combine renders our\
    \ scene whenever any of the Observables yields a value. If we don't move the mouse,\
