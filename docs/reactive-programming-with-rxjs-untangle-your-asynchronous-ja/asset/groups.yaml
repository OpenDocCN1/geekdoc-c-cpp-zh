    \ between hot and cold Observables is not clear, scenarios this can be surprising.\n\
    \nIf we have several Observers listening to a cold Observable, we will receive\
    \ copies of the same sequence of values. So strictly speaking, although the Observers\
    \ are sharing the same Observable, they are not sharing the same sequence of values.\
    \ If we want the Observers to share the same sequence, we need a hot Observer.\n\
    \n## From Cold to Hot Using publish\n\nWe can turn a cold Observable into a hot\
    \ one using publish. Calling creates a new Observable that acts as a proxy to\
    \ the original. It does that by subscribing itself to the original and pushing\
    \ the values it receives to its subscribers.\n\nA published Observable is actually\
    \ a ConnectableObservable, which has an extra method called connect that we can\
    \ start receiving values. This allows us to subscribe to it before it starts running:\n\
    \n```javascript\nhot_cold.js\n// Create an Observable that yields a value every\
    \ second\nvar source = Rx.Observable.interval(1000);\nvar publisher = source.publish();\n\
    \n// Even if we are subscribing, no values are pushed\nvar observer1 = publisher.subscribe(function\
    \ (x) {\n  console.log('Observer 1: ' + x);\n});\n\n// publisher connects and\
    \ starts publishing values\npublisher.connect();\n\nsetTimeout(function() {\n\
    \  // 5 seconds later, observer2 subscribes to it and starts receiving\n  // current\
    \ values, not the whole sequence.\nvar observer2 = publisher.subscribe(function\
    \ (x) {\n  console.log('Observer 2: ' + x);\n  });\n}, 5000);\n```\n\n## Sharing\
    \ a Cold Observable\n\nLet's get back to our earthquake example. The code we have\
    \ so far looks reasonable; we have an Observable quakes with two subscriptions:\
    \ one that paints earthquakes on the map, and one that lists them in the table.\n\
    \nBut we can make our code more efficient. By having two subscribers to quakes\
    \ we re-fetch the data twice. You can check that by putting `console.log` inside\
    \ the `flatMap` operator in quakes.\n\nThis happens because quakes is a cold Observable,\
    \ and it will re-emit all its values to each new subscriber, so a new subscription\
    \ means a new JSON request. This impacts our application performance by requesting\
    \ the same resources twice over the network.\n\nFor the next example we'll use\
    \ the share operator, which automatically creates a subscription to the Observable\
    \ when the number of Observers goes from zero to one. This spares us from calling\
    \ connect:\n\n```javascript\nexamples_earthquake_ui/code2js\nvar quakes = Rx.Observable()\n\
    \  .interval(5000)\n  .flatMap(function() {\n    return Rx.DOM.jsonRequest({\n\
    \      url: QUAKE_URL,\n      jsonCallback: 'qefeed_callback'\n    });\n  })\n\
    \  .flatMap(function(result) {\n    return Rx.Observable.from(result.response.features);\n\
    \  })\n  .distinct(function(quake) { return quake.properties.code; })\n  .share()\n\
    ```\n\nNow quakes behaves like a hot Observable, and we don't have to worry about\
    \ how many Observers we connect to it, since they will all receive the same data.\n\
    \n## Buffering Values\n\nOur preceding code works well, but notice that we insert\
    \ a tr node every time we receive information from an earthquake. That's inefficient,\
    \ because with each insertion we are modifying the DOM and causing a repaint of\
    \ the page, making the browser do unnecessary work to calculate the new layout.\
    \ This can cause performance drop.\n\nIdeally, we would batch several earthquake\
    \ objects and insert each batch every few seconds. That would be tricky to implement\
    \ by hand because we'd have to keep counters and element buffers, and we would\
    \ have to remember to reset them with every batch. But with RxJS we can just use\
    \ one of buffer-based RxJS operators, like bufferWithTime.\n\nWith bufferWithTime\
    \ we can buffer incoming values and release them as an array every period of time.\n\
    \n```javascript\nexamples_earthquake_ui/code3.bufferWithTime.js\nvar table = document.getElementById('quakes_info');\n\
    quakes\n  .pluck('properties')\n  .map(makeRow)\n  .bufferWithTime(500)\n  .filter(function(rows)\
    \ {\n    return rows.length > 0;\n  })\n  .map(function(rows) {\n    var fragment\
    \ = document.createDocumentFragment();\n    rows.forEach(function(row) {\n   \
    \   fragment.appendChild(row);\n    });\n    return fragment;\n  })\n  .subscribe(function(fragment)\
    \ {\n    table.appendChild(fragment);\n  });\n```\n\nThis is what's going in the\
    \ new code:\n\n- Buffer incoming value and release the batch of values every 500\
    \ milliseconds.\n- bufferWithTime executes every 500ms no matter what, and if\
    \ there are no incoming values it will yield an empty array. We filter those.\n\
    - We insert every row into a document fragment, which is a parent. This means\
    \ it's not in the DOM, and modifying its contents is fast and efficient.\n- Finally,\
    \ we append the fragment to the DOM. An advantage of appending a fragment is that\
    \ it counts as a single operation, causing one redraw. It also appends the fragment's\
    \ children to the same element to we're appending the fragment itself.\n\nUsing\
    \ buffers and fragments, we manage to keep row insertion performant while keeping\
    \ the real-time nature of our application (with a maximum delay of half second).\
    \ Now we're ready to add the next feature to our dashboard:\n\n## Adding Interaction\n\
    \nWe have earthquakes on the map and in a list, but no interaction between both\
    \ representations. It would be nice, for example, to center an earthquake on the\
    \ map whenever we click on the list, and to highlight an earthquake with a circle\
    \ on the map when we move the mouse over its row.\n\nIn Leaflet, you can draw\
    \ on map and put drawings in their own layers to manipulate them individually.\
    \ We create a group of layers called quake where'll store all the earthquake circles.\
    \ Each circle will be a layer inside the group. We'll also create an object codeLayers\
    \ where we'll store the correlation between earthquake and internal layer, so\
    \ that we can refer to them by the earthquake ID:\n\n```javascript\nexamples_earthquake_ui/code.js\n\
    var codeLayers = {};\nvar quakeLayer = L.layerGroup().addTo(map);\n```\n\nAnd\
    \ now in the subscription for the quakes Observable, we'll add each circle to\
    \ the layer and store its ID in codeLayers. If it seems a bit intricate, it's\
    \ because the only way Leaflet allows us to redraw in map is this way:\n\n```javascript\n\
    examples_earthquake_ui/code.js\nquakes.subscribe(function(quake) {\n  var coords\
    \ = quake.geometry.coordinates;\n  var size = quake.properties.mag * 1000;\n\n\
    \  var circle = L.circle(coords[0], size).addTo(map);\n  quakeLayer.addLayer(circle);\n\
    \  codeLayers[quake.id] = quakeLayer.getLayer(circle);\n});\n```\n\nLet's now\
    \ create the hovering effect. We'll write a new function, isHovering, which returns\
    \ an observable that emits a Boolean value for when the mouse is over a particular\
    \ earthquake circle at any given moment:\n\n```javascript\nexamples_earthquake_ui/code.js\n\
    var identity = Rx.helpers.identity;\n\nfunction isHovering(element) {\n  var over\
    \ = Rx.DOM.mouseover(element).map(identity(true));\n  var out = Rx.DOM.mouseout(element).map(identity(false));\n\
    \n  return over.merge(out);\n}\n```\n\nRx.helpers.identity is the identity function.\
    \ Given a parameter x, it returns x. This way we don't have to write functions\
    \ that return the value they receive.\n\nover is an Observable that emits true\
    \ when the user hovers the mouse over the element.\n\nout is an Observable that\
    \ emits false when the user moves the mouse outside of the element.\n\nisHovering\
    \ merges both over and out, returning an Observable that emits true when the mouse\
    \ is over an element, and false when it leaves it.\n\nWith isHovering in place\
    \ we can modify the subscription that creates the rows, so that we subscribe to\
    \ events in each row as it is created:\n\n```javascript\nexamples_earthquake_ui/code.js\n\
    var table = document.getElementById('quakes_info');\nquakes\n  .pluck('properties')\n\
    \  .map(makeRow)\n  .buffer(500)\n  .filter(function(rows) { return rows.length\
    \ > 0; })\n  .map(function(rows) {\n    var fragment = document.createDocumentFragment();\n\
    \    rows.forEach(function(row) {\n      fragment.appendChild(row);\n    });\n\
    \    return fragment;\n  })\n  .subscribe(function(fragment) {\n    var row =\
    \ fragment.firstChild(); // Get row from inside the fragment\n    var circle =\
    \ quakeLayer.getLayer(codeLayers[row.id]);\n\n    isHovering.subscribe(function(hovering)\
    \ {\n      circle.setStyle({ color: hovering ? '#ff0000' : '#0000ff' });\n   \
    \ });\n\n    Rx.DOM.click(row).subscribe(function() {\n      map.panTo(circle.getLatLng());\n\
    \      table.appendChild(fragment);\n    });\n  });\n```\n\nWe get the circle\
    \ element for the earthquake on the map ID we get from the row. With that, codeLayers\
    \ gives us the corresponding internal ID, which gets us the circle element using\
    \ quakeLayer.get.\n"
  mdcn: "\nObserver 2: 0\nObserver 1: 4\nObserver 2: 1\n...\n\n现在我们看到某些地方真的不对。当三秒后订阅时，observer2\
    \ 接收到了所有已推送的值，而不是从当前值开始并继续下去，这是因为 Rx.Observable.interval 是一个冷流（cold Observable）。如果热流（hot\
    \ Observable）和冷流之间的区别不明确，这种场景可能会让你感到惊讶。\n\n如果我们有多个观察者（Observers）监听一个冷 Observable，我们将收到相同值序列的副本。因此严格来说，尽管这些观察者共享同一个\
    \ Observable，但它们并没有共享同一个值序列。如果我们想让观察者共享同一个序列，我们需要一个热观察者（hot Observer）。\n\n## 使用\
    \ publish 从冷变热\n\n我们可以使用 `publish` 将冷 Observable 转换为热 Observable。调用 `publish`\
    \ 会创建一个新的 Observable，作为原始 Observable 的代理。它是通过自己订阅原始 Observable 并将接收到的值推送给其订阅者来实现的。\n\
    \n发布的 Observable 实际上是一个 `ConnectableObservable`，它包含一个名为 `connect` 的额外方法，我们可以通过它开始接收值。这允许我们在它运行之前对其进行订阅：\n\
    \n```javascript\nhot_cold.js\n// 创建一个每秒产生一个值的 Observable\nvar source = Rx.Observable.interval(1000);\n\
    var publisher = source.publish();\n\n// 即使我们在订阅，也没有值被推送\nvar observer1 = publisher.subscribe(function\
    \ (x) {\n  console.log('Observer 1: ' + x);\n});\n\n// publisher 连接并开始发布值\npublisher.connect();\n\
    \nsetTimeout(function() {\n  // 5 秒后，observer2 订阅它并开始接收\n  // 当前值，而不是整个序列。\nvar\
    \ observer2 = publisher.subscribe(function (x) {\n  console.log('Observer 2: '\
    \ + x);\n  });\n}, 5000);\n```\n\n## 共享冷 Observable\n\n让我们回到地震示例。到目前为止的代码看起来很合理；我们有一个\
    \ `quakes` Observable，它带有两个订阅：一个在地图上绘制地震，另一个在表格中列出它们。\n\n但我们可以让代码更高效。通过对 `quakes`\
    \ 设置两个订阅者，我们重新获取了两次数据。你可以通过在 `quakes` 的 `flatMap` 算符中放置 `console.log` 来检查这一点。\n\
    \n发生这种情况是因为 `quakes` 是一个冷 Observable，它会向每个新订阅者重新发射它的所有值，因此新的订阅意味着一个新的 JSON 请求。这通过在网络上请求请求资源影响了我们的应用程序性能。\n\
    \n在下一个示例中，我们将使用 `share` 算符，当观察者数量从零变为一时，它会自动创建对 Observable 的订阅。这让我们省去了调用 `connect`\
    \ 的麻烦：\n\n```javascript\nexamples_earthquake_ui/code2js\nvar quakes = Rx.Observable()\n\
    \  .interval(5000)\n  .flatMap(function() {\n    return Rx.DOM.jsonRequest({\n\
    \      url: QUAKE_URL,\n      jsonCallback: 'qefeed_callback'\n    });\n  })\n\
    \  .flatMap(function(result) {\n    return Rx.Observable.from(result.response.features);\n\
    \  })\n  .distinct(function(quake) { return quake.properties.code; })\n  .share()\n\
    ```\n\n现在 `quakes` 的行为就像一个热 Observable，我们不需要担心连接到它的多少个观察者，因为它们都将接收相同的数据。\n\n##\
    \ 缓冲值\n\n我们之前的代码运行良好，但请注意，每当我们从地震接收到信息时，都会插入一个 `tr` 节点。这是低效的，因为每次插入我们都在修改 DOM\
    \ 并导致页面重绘，使浏览器执行不必要的工作来计算新布局。这会导致性能下降。\n\n理想情况下，我们会批量处理几个地震对象，并每隔几秒插入一次批。手动实现这将非常困难，因为我们必须维护计数器和元素缓冲区，并且必须记住在每批处理后重置它们。但使用\
    \ RxJS，我们可以直接使用基于缓冲的 RxJS 算符，例如 `bufferWithTime`。\n\n通过 `bufferWithTime`，我们可以缓冲传入的值并每隔一段时间将其以数组的形式释放。\n\
    \n```javascript\nexamples_earthquake_ui/code3.bufferWithTime.js\nvar table = document.getElementById('quakes_info');\n\
    quakes\n  .pluck('properties')\n  .map(makeRow)\n  .bufferWithTime(500)\n  .filter(function(rows)\
    \ {\n    return rows.length > 0;\n  })\n  .map(function(rows) {\n    var fragment\
    \ = document.createDocumentFragment();\n    rows.forEach(function(row) {\n   \
    \   fragment.appendChild(row);\n    });\n    return fragment;\n  })\n  .subscribe(function(fragment)\
    \ {\n    table.appendChild(fragment);\n  });\n```\n\n这是新代码中执行的内容：\n\n- 缓冲传入的值并每\
    \ 500 毫秒释放一次批值。\n- `bufferWithTime` 无论如何每 500ms都会执行一次，如果没有传入的值，它将产生一个空数组。我们过滤掉了这些。\n\
    - 我们将每一行插入到文档片段（document fragment）中，它是一个父节点。这意味着不在 DOM 中，修改其内容是快速且高效的。\n- 最后，我们将片段附加到\
    \ DOM 中。附加片段的一个优势是它被视为单次操作，导致一次重绘。它还将片段的子元素添加到同一个元素中，就像我们附加片段本身一样。\n\n使用缓冲区和片段，我们成功地在保持行插入高效的同时维持了性能。\n"
