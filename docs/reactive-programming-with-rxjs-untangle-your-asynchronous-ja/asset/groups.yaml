    \ 处理程序将不会调用。如果我们确定序列不会出错（例如它是同步的），我们不需要 `onError` 处理程序。\n\n## 使用 XMLHttpRequest\n\
    \n我们还没有对 Observable 做过任何实用的操作。使用 XMLHttpRequest 怎样？为了这一点，我们将使用 `Observable.create`：\n\
    \n```javascript\nfunction get(url) {\n  return Observable.create(function(observer)\
