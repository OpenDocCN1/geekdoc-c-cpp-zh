    > Does That Mean AsyncSubject Acts Like a Promise?\n\nIndeed.\nAsyncSubject represents\
    \ the result of an asynchronous action, and you can use it as a substitute for\
    \ a promise. The difference internally is that a promise will only ever process\
    \ a single value, whereas AsyncSubject processes all values in a sequence, ever\
    \ emitting (and caching) the last one.\n\nBeing able to easily simulate promises\
    \ shows the flexibility of the RxJS model. (Even without AsyncSubject, it would\
