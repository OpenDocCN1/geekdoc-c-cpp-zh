    }\n```\n\n```\niterateOnMultiples.prototype.next = function() {\n  while (this.cursor\
    \ < this.array.length) {\n    var value = this.array[this.cursor++];\n    if (value\
    \ % this.divisor === 0) {\n      return value;\n    }\n  }\n}\n```\n\n```\niterateOnMultiples.prototype.hasNext\
    \ = function() {\n  var cur = this.cursor;\n  while (cur < this.array.length)\
    \ {\n    if (this.array[cur++] % this.divisor === 0) {\n      return true;\n \
    \   }\n  }\n  return false;\n}\n```\n\n## Rx 模式与 Observable\n\n我们可以这样使用这个迭代器：\n\
    \n```\nch1/iterator.js\nvar consumer = new iterateOnMultiples([1, 2, 3, 4, 5,\
