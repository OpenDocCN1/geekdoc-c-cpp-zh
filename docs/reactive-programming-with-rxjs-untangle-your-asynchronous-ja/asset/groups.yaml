    \n# 使用 Schedulers\n\n# 第5 章\n\n# 使用 Schedulers 扭曲时间\n\n一旦我发现了 RxJS，就开始在项目中使用它。一段时间以来，我以为自己知道如何有效地使用它，但有一个挥之不去的问题：如何知道我使用的运算符是同步的还是异步的？换句话说，运算符具体的何时何时？这似乎是正确使用\
    \ RxJS 的关键部分，但对我来说有点模糊。\n\n`interval` 运算符显然是异步的，因为它必须使用类似 `setTimeout` 的机制项目。但如果我使用的是\
    \ `range` 呢？它也是异步的吗？它会阻塞事件循环吗？`from` 呢？我随处使用这些运算符，但对它们的内部并发模型并不了解。\n\n然后我学习了 Schedulers。\n\
