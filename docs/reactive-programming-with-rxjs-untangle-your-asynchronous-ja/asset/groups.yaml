    \    return {\n      stars: stars,\n      spaceship: spaceship,\n      enemies:\
    \ enemies\n    };\n  }\n)\n.sample(SPEED)\n.subscribe(renderScene);\n```\n\nBy\
    \ calling sample after combineLatest we make sure that combineLatest will never\
    \ yield any faster than 40 milliseconds after the previous one (our constant SPEED\
    \ is set to 40).\n\n# Shooting\n\nIt's a bit scary the hordes of enemies coming\
