    # Joe asks:

    ### What’s the Virtual DOM?


    The Document Object Model (DOM) defines the tree structure of elements in an HTML
    document. Every HTML element is a node in the DOM, and each node can be manipulated
    using methods on the node.


    The DOM was originally created to represent static documents, not the superdynamic
    websites we have today. As a consequence, it was not designed to have good performance
    when the elements in a DOM tree were updated frequently. That''s why when we make
    changes to the DOM there''s a performance hit.


    The virtual DOM is a representation of the DOM made in JavaScript. Every time
    we change a state in the component, we recompute a virtual DOM tree for the component
    and compare it with the previous one. If there are differences, we render only
    those differences. This approach is extremely fast, because comparing JavaScript
    objects is fast and we make the absolutely necessary changes to the “real” DOM.


    That approach means we can write code as if we generated the whole app UI for
    change. We don''t have to keep track of state in the DOM. Behind the scenes, Cycle.js
    will check if there is anything different for every update and take care of rendering
    our efficiently.


    # Installing Cycle.js


    We could use Cycle.js by including it in an HTML page using <script></script>
    tags, but that would not be the best way to use it because Cycle.js is designed
    in a reactive way, and all the building blocks in Cycle.js are Observables, which
    gives us enormous advantages. It is also simpler to grasp than other frameworks
    because there are fewer concepts to understand and memorize. For example, all
    operations related to state are out of the way, encapsulated in functions called
    drivers, and we rarely need to create new ones.


