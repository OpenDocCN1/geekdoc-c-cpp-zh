    # Cycle.js


    Cycle.js is a small framework on top of RxJS for creating responsive user interfaces.
    It offers the features present in modern frameworks like React, such as virtual
    DOM and unidirectional dataflow.


    Cycle.js is designed in a reactive way, and all the building blocks in Cycle.js
    are Observables, which gives us enormous advantages. It is also simpler to grasp
    than other frameworks because there are fewer concepts to understand and memorize.
    For example, all operations related to state are out of the way, encapsulated
    in functions called drivers, and we rarely need to create new ones.


