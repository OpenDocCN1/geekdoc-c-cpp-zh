    \ });\n}, 350);\n```javascript\nsubject.onNext(4);\n```\n\nIn this example we\
    \ set a buffer based on time, instead of the number of values. Our ReplaySubject\
    \ will cache values that were emitted up to 200 milliseconds ago. We emit three\
    \ values, each separated by 100 milliseconds, and after 350 milliseconds we subscribe\
    \ an Observer and emit yet another value. At the moment of the subscription the\
    \ items cached are 2 and 3, because J happened too long ago (around 250 milliseconds\
    \ ago), so it is no longer cached.\n\nSubjects are a powerful tool that can save\
    \ you a lot of time. They provide great solutions to common scenarios like caching\
    \ and repeating. And since at their core they are just Observables and Observers,\
    \ you don’t need anything new.\n\n# Spaceship Reactive!\n\nTo show how we can\
    \ keep an application pure, we'll build a video game in which our heroes face\
    \ hordes of enemy spaceships. We'll make use of Observable pipelines, and I'll\
    \ point out along the way when it might be tempting to store state outside the\
    \ pipeline and how to avoid it.\n\nVideo games notoriously keep a lot of external\
    \ state—scores, screen coordinates for the characters, timers, and so on. Our\
