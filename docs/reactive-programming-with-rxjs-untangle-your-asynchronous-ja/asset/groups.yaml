    \ This is an array of latitude and longitude boundaries that we can use to filter\
    \ tweets by their geographic location, along with the word earthquake. That's\
    \ more specific! Alright, let's subscribe to this stream and start sending tweets\
    \ to the server:\n\n```\nexamples_earthquake_ui/tweet_stream/index.js\nRx.Observable(stream,\
    \ 'tweet').subscribe(function(tweetObject) {\n  ws.send(JSON.stringify(tweetObject),\
    \ function(err) {\n    if (err) {\n      console.log('There was an error sending\
    \ the message');\n    }\n  });\n});\n```\n\nIf we restart the server and reload\
    \ the browser, we should receive tweets in the browser, and the console in the\
    \ development panel should be printing the tweets.\n\nThese tweets are not filtered\
    \ by earthquake location yet. To do that, we need to do the following things with\
    \ each piece of earthquake information we receive:\n\n- Take the longitude and\
    \ latitude pair of epicenter coordinates of each earthquake and create a bounding\
    \ box that delimits the geographical area of the tweets that we considered relevant\
    \ to the earthquake.\n- Accumulate all the boundary coordinates so that tweets\
    \ sent to the client keep relevant to the earthquakes on the map.\n- Update the\
    \ tweet stream with the new coordinates every time we receive the message for\
    \ a new earthquake.\n\nHere's a way to do it:\n\n```\nexamples_earthquake_ui/tweet_stream/index.js\n\
    Rx.Observable\n  .fromEvent(ws, 'message')\n  .flatMap(function(quakesObj){\n\
    ```\n\n```javascript\nquakesObj = JSON.parse(quakesObj);\nreturn Rx.Observable.from(quakesObj.quakes);\n\
    }}\n```\n\n```javascript\n.scan([], function(boundsArray, quake) {\n  var bounds\
    \ = [\n    quake.lng - 0.3, quake.lat - 0.15,\n    quake.lng + 0.3, quake.lat\
    \ + 0.15\n  ].map(function(coordinate) {\n    coordinate = coordinate.toString();\n\
    \    return coordinate.match(/\\-?\\d+\\.\\-?\\d{2}/)[0];\n  });\n```\n\n```javascript\n\
    \  boundsArray = boundsArray.concat(bounds);\n  return boundsArray.slice(Math.max(boundsArray.length\
    \ - 50, 0));\n}}\n```\n\n```javascript\n.subscribe(function(boundsArray) {\n \
    \ stream.stop();\n  stream.params.locations = boundsArray.toString();\n  stream.start();\n\
    });\n```\n\nAnd here is the step-by-step of what is happening in the code:\n\n\
    - We meet our old friend scan. Any time we need to accumulate results and yield\
    \ each intermediate result, scan is our friend. In this case, we'll keep accumulating\
    \ earthquake coordinates in the boundsArray array.\n- From the single latitude/longitude\
    \ pair of coordinates of the earthquake, we create an array that contains an area\
    \ determined by a north-west coordinate and a south-east one. The numbers used\
    \ to approximate the bounds create a rectangle of a large city.\n\nAfter that,\
    \ we use a regular expression to limit the decimal precision of each coordinate\
    \ to two decimals, to comply with the Twitter API requirements.\n\n- We concatenate\
    \ the generated boundaries to boundsArray, which contains every previous earthquake's\
    \ boundaries. Then we take the last 25 pairs of boundaries (in the array), that\
    \ is the limit of the Twitter API.\n- Finally, we subscribe to the Observable,\
    \ and in the onError function we restart the current tweet to reload the updated\
    \ locations to filter by our new accumulated array of locations, converted to\
    \ a string.\n\nAfter restarting the server and reloading the browser, we will\
    \ be receiving relevant tweets in our browser application. For now, we can only\
    \ see the objects displayed in the developer console, though. in the next section\
    \ we generate the HTML to display the tweets in our dashboard.\n\n# Showing Tweets\
    \ on the Dashboard\n\nNow that we are receiving tweets from the server, the only\
    \ thing left to do is show them nicely on the screen. For this, we'll create a\
    \ new HTML element we are appending incoming tweets:\n\n```\nexamples_earthquake_ui/index_final.html\n\
    <div id=\"tweet_container\"></div>\n```\n\nWe'll also use our Observable subscription\
    \ to process the incoming tweet objects and append them to the tweet_container\
    \ we created:\n\n```\nexamples_earthquake_ui/code.js\nsocket\n.map(function(message)\
    \ { return JSON.parse(message.data); })\n.subscribe(function(data) {\n  var container\
    \ = document.getElementById('tweet_container');\n  container.insertBefore(makeTweetElement(data),\
    \ container.firstChild);\n});\n```\n\nAny new tweets will appear at the top of\
    \ the list, and they will be created by makeTweetElement, a simple function that\
    \ creates a tweet element and populates it with the data we pass as a parameter:\n\
    \n```\nexamples_earthquake_ui/code.js\nfunction makeTweetElement(tweetObj) {\n\
    \  var tweetEl = document.createElement('div');\n  tweetEl.className = 'tweet';\n\
    \n  var content = '<img src=\"' + tweetObj.user.image_url + '\" class=\"avatar\"\
    >' +\n    '<div class=\"content\">' + tweetObj.text + '</div>' +\n    '<div class=\"\
    time\">' + new Date(tweetObj.created_at).toLocaleString() + '</div>';\n\n  tweetEl.innerHTML\
    \ = content;\n\n  return tweetEl;\n}\n```\n\nAnd with this we finally see earthquakes\
    \ on the map, and we can see tweets in the sidebar.\n\n# Ideas for Improvements\n\
    \nThis dashboard is already functional, but there are many improvements that could\
    \ be done:\n\n- Add more earthquake databases. USGS is a fantastic resource, but\
    \ it would be interesting to merge earthquake reports from around the world, and\
    \ you'd probably want to use to avoid duplicates.\n\n# Wrapping Up\n\nIn this\
    \ chapter we've used RxJS to create a reactive user interface that allows us to\
    \ see kinds of data in real time. We've used RxJS both in the browser and in Node.js\
    \ server, showing how easy it is to manage areas.\n\nMore importantly, we've seen\
    \ that we can use RxJS the same way on the client and on the server, bringing\
    \ the Observable abstraction everywhere in application. And not only that, we\
    \ could actually use RxJS concepts and operators across other languages, since\
    \ RxJS is supported in many of them.\n\nNext we'll look at *Schedulers*, a more\
    \ advanced object type that allows us to control time and concurrency with more\
    \ precision, and provides a great help with our code.\n\n# CHAPTER 5\n\n# Bending\
    \ Time with Schedulers\n\nAs soon as I discovered RxJS, I started using it in\
    \ my projects. For a while I thought knew how to use it effectively, but there\
    \ was a nagging question: how do I know whether the operator I'm using is synchronous\
    \ or asynchronous? In other words, exactly when operators emit notifications?\
    \ This seemed a crucial part of using RxJS correctly, but it felt a bit blurry\
    \ to me.\n\nThe interval operator, is clearly asynchronous, so it must use something\
    \ like setTimeout to emit items. But what if I'm using range? Does it emit asynchronously\
    \ as well? Does it block the event loop? What about from? I was using these operators\
    \ everywhere, but I didn't know much about their internal concurrency model.\n\
    \nThen I learned about Schedulers.\n\nSchedulers are a powerful mechanism to precisely\
    \ manage concurrency in your applications. They give you fine-grained control\
    \ over how an Observable emits notifications by allowing you to change their concurrency\
    \ model as you go. In this chapter you'll learn how to use Schedulers and apply\
    \ them in common scenarios. We'll focus on testing, where Schedulers are especially\
    \ useful, and you'll learn how to make your own Schedulerulers.\n\n# # Using Schedulers\n\
    \nA Scheduler is a mechanism to \"schedule\" an action to happen in the future.\
    \ Each operator in RxJS uses one Scheduler internally, selected to provide the\
    \ best performance in the most likely scenario.\n\nLet's see how we can change\
    \ the Scheduler in operators and the consequences of doing so. First let's create\
    \ an array with 1,000 integers in it:\n"
