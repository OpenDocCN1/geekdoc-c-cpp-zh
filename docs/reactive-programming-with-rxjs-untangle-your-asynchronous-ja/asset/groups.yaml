    \ in what environment to run the code.\n\n# Running RxJS Code in the Browser\n\
    \nIf the code is meant to run in the browser, we'll use the rx.all.js, which you\
    \ can find in the RxJS GitHub repository. rx.all.js includes all the operators\
    \ in RxJS, and it's easiest to be sure all examples will work. Just load the script\
    \ in the <head> section of your HTML document:\n\n```\n<html>\n<head>\n  <script\
    \ src=\"rx.all.js\"></script>\n</head>\n...\n</html>\n```\n\nKeep in mind that\
    \ this is a relatively big file and you may want to consider a smaller file, such\
    \ as rx.js or rx.lite.js for your projects if you're not using all the functionality\
    \ in RxJS.\n\n# Running RxJS Code in Node.js\n\nRunning code examples in Node.js\
    \ is easy. Just make sure you install the RxJS dependency in your project using\
    \ npm:\n\n```\n$ npm install rx\nrx@4.0.0 node_modules/rx\n```\n\nAfter that,\
    \ you can import the RxJS library in your JavaScript files:\n\n```\nvar Rx = require('rx');\n\
    \nRx.Observable.just('Hello World!').subscribe(function(value) {\n  console.log(value);\n\
    });\n```\n\nAnd you can run it by simply invoking node and the name of the file:\n\
    \n```\n$ node test.js\nHello World!\n```\n\n+   3. https://github.com/Reactive-Extensions/RxJS/tree/master/dist"
