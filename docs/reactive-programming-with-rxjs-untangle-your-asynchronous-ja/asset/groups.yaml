  - "[PAGE 49]\n\nThe features array contains an object with the data for every earthquake\
    \ that happened today. That's a truckload of data! It's amazing (and terrifying)\
    \ how many earthquakes in a single day. For our program we'll need only the coordinates\n\
    \nWe first want to create an Observable that retrieves the dataset and emits single\
    \ earthquakes. Here's a first version:\n\n```\nexamples_earthquake/code.js\nvar\
    \ quakes = Rx.Observable.create(function(observer) {\n  window.eqfeed_callback\
    \ = function(response) {\n    var quakes = response.features;\n    quakes.forEach(function(quake)\
    \ {\n      observer.onNext(quake);\n    });\n  }\n});\n```\n\n```\nquakes.subscribe(function(quake)\
    \ {\n  var coords = quake.geometry.coordinates;\n  var size = quake.properties.mag\
    \ * 10000;\n```\n\n```\nL.circle(coords[1], coords[0], size).addTo(map);\n```\n\
    \nWait, what is that blast global function eqfeed_callback doing in our code?\
    \ Well, it turns out that JSON URLs often provide a way—by adding a queryString\
    \ in the URL—to specify the function name to handle the response, and the USGS\
    \ site doesn't allow that, so we need to create a global function with the name\
    \ we decided to use, which is eqfeed_callback.\n\nOur Observable emits all earthquakes\
    \ in order. We have an earthquake generator! We don't have to care about asynchronous\
    \ flows or having to put all of our logic in the same function. As long as we\
    \ subscribe to the Observable, earthquakes will just come to us.\n\nBy having\
    \ the earthquake retrieval \"blackboxed\" in the quakes Observable, we can now\
    \ subscribe to it and process each earthquake. Then we'll draw a circle for each\
    \ earthquake with a size proportional to its magnitude.\n\n# Going Deeper\n\n\
    Can we do better? Yes! In the preceding code, we're still managing flow by traversing\
    \ the array and calling onNext to yield each earthquake, even if we are isolated\
    \ inside the Observable. So much for reactivity!"
  - "[PAGE 50]\n\n# Making a Real-Time Earthquake Visualizer • 33\n\n> Joe asks:\n\
    What is ISJSONP?\n\nJSONP—or JSON with *padding*—is a sneaky technique that web\
    \ developers came up to work around the browser restrictions when requesting data\
    \ from third-party domains.ᵃ\n\nIt bypasses these restrictions by loading external\
    \ content script tags instead of the usual XMLHttpRequest. Adding a script tag\
    \ to the DOM loads and executes its content directly, and the security restrictions\
    \ are not applied.\n\nThe remote request's content is then JSON wrapped in a function\
    \ call (the in JSONP).\n\n```\ncallbackFn({ a: 1, b: 2, c: 3 });\n```\n\nJSONP\
    \ URLs usually accept a query string parameter so that the caller can specify\
    \ the name of the callback. The developer then has to define in her code that\
    \ has the same name as the callback in the server response, and when the script\
    \ tag is added to the document, function will be called with the JSON data as\
    \ the first parameter.\n\nLibraries jQuery automate this process by internally\
    \ creating the global function to handle the JSONP call, and tidying up afterward\
    \ to avoid polluting the global namespace.\n\n+   a. http://en.wikipedia.org/wiki/Same-origin_policy\n\
    \nThis is a perfect situation for flatMap. We'll retrieve the data and make an\
    \ Observable out of the array using Rx.Observable.from. Then we'merge examples_earthquake/code1.js\
    \ in the main Observable:\n\n```\nquakes.subscribe(function(quake) {\n  var coords\
    \ = quake.geometry.coordinates;\n  var size = quake.properties.mag * 10000;\n\
    \  L.circle([coords[1], coords[0]], size).addToTo(map);\n});\n```\n\nreport erratum\
    \ • discuss"
  - "[PAGE 51]\n\nWe're not manually managing the flow anymore. There are no loops\
    \ or conditionals to extract the individual earthquake objects and pass them around.\
    \ Here's what's happening:\n\n+   onNext only happens this time, and it yields\
    \ the JSON response.\n\n+   Since we'll yield only one time, we signal completion\
    \ after onNext.\n\n+   We're chaining the flatMap to call the result, so flatMap\
    \ will take each result from the Observable (in this case only), use it as a parameter\
    \ for the transform function, and merge the Observable resulting from that function\
    \ into the source Observable.\n\n+   Here we take the features array containing\
    \ all the earthquakes and create an Observable from it. Because of flatMap, this\
    \ will become the actual Observable that the quakes variable will.\n\n+   Subscribe\
    \ doesn't change at all; it keeps dealing with a stream of earthquakes just like\
    \ before.\n\n# There Is Always a Method\n\nSo we've used RxJS operators in rx.all.js,\
    \ but it's worth checking out operators that come with other RxJS-based libraries.\
    \ In our case, we'll look at RxJS-DOM. RxJS-DOM is an external library that, among\
    \ others, contains an operator to handle JSON requests: jsonRequest That saves\
    \ us some code and keeps us from using nasty functions:\n\n```\nexamples_earthquake/code12.js\n\
    var quakes = Rx.DOM.jsonRequest({\n  url: URL,\n  jsonCallback: 'eqfeed_callback'\n\
    })\n.flatMap(function(result) {\n  return Rx.Observable.from(result.response.features);\n\
    })\n.map(function(quake) {\n  lat: quake.geometry.coordinates[1],\n  lng: quake.geometry.coordinates[0],\n\
    \  size: quake.properties.max * 10000\n});\nquakes.subscribe(function(quake) {\n\
    \  L.circle(quake.lat, quake.lng, quake.size).addTo(map);\n});\n```\n\n+   3.\
    \ https://github.com/Reactive-Extensions/RxJS-DOM"
  - '[PAGE 52]


    Keep in mind that for this code to run, you need to include the file rx.dom from
    RxJS-DOM in the HTML. Notice how we''ve added a map operator transforms the earthquake
    objects into simple objects containing only the information we need for our visualization:
    latitude, longitude, and magnitude of the earthquake. The less functionality we
    put in the subscribe operator, the better.


    # Making It Real Time


    Our reactive version of the earthquake application doesn''t update the map of
    earthquakes in real time. To implement that, we''ll use the interval operator—which
    we saw earlier in this chapter—and the über-useful distinct operator. Let me show
    you the code and then we''ll go through the changes:


    quakes.subscribe(quake) {

    var coords = quake.geometry.coordinates;

    var size = quake.properties.mag * 10000;


    L.circle(coords[1], coords[0], size).addTo(map);


    In the preceding code, we abuse interval to make requests and process them at
    regular intervals of five seconds. interval creates an incrementing number every
    five seconds. We don''t do anything with those numbers; instead, we use flatMap
    to retrieve the data of theRequest. Notice also how we use retry to try again
    in case there are problems retrieving the list at first.


    The last operator we apply is distinct, which emits only elements that haven''t
    been emitted before. It takes a function that returns the property to check for
    equality. This way we never redraw earthquakes that are already drawn.'
- md: "\nIn fewer than 20 lines, we've written an application that regularly polls\
    \ an external JSONP URL, extracts concrete data from its contents, and filters\
    \ out earthquakes that have already been imported. After that, we represent the\
    \ earthquakes on a map, with a size proportional to their magnitude—all written\
    \ in a self-contained, clear, and concise way, without relying on external stores.\
    \ Not bad at all! That shows how expressive Observables can be.\n\n## Ideas for\
    \ Improvements\n\nHere are a couple of ideas to put your newly acquired RxJS skills\
    \ to use and make this little application bit more interesting:\n\n- *When the\
    \ user hovers the mouse over an earthquake, offer a pop-up that shows more information\
    \ about that particular earthquake. One way to do that would be to create a new\
    \ Observable from the quakes one with just the properties you want, and dynamically\
    \ filter it upon hovering.*\n- Implement a counter at the top of the page that\
    \ shows the number of earthquakes so far today and resets every day.\n\n## Operator\
    \ Rundown\n\nThis chapter presented you with a few new operators, so here's a\
    \ recap of them, along with scenarios for ways we can use them in our applications.\
    \ Remember, you can always find the complete API documentation for operators on\
    \ the RxJS GitHub site.⁴\n\n- *Rx.Observable.from*\n\nDefault behavior: *Synchronous*\n\
    \nSince many of the data sources you use in your applications will come from arrays\
    \ or iterables, it makes sense to have an operator that creates Observables out\
    \ of them. from is one of the operators you'll use the most.\n\nWith from we can\
    \ create Observables from arrays, array-like objects (for instance, the arguments\
    \ object or DOM NodesList), and even types that implement the iterable protocol,\
    \ such as String, Map, and Set⁵\n\n- *Rx.Observable.range*\n\nDefault behavior:\
    \ *Synchronous*\n\nThe range operator generates finite Observables that emit integers\
    \ in a particular range. It is extremely versatile and can be used in many scenarios.\
    \ For example, you could use range to generate the initial squares on the board\
    \ of a game like Minesweeper.\n\n- *Rx.Observable.interval*\n\nDefault behavior:\
    \ **Asynchronous***\n\nEach time you need to generate values spaced in time, you'll\
    \ probably start with an interval operator as the generator. Since interval emits\
    \ sequential integers every few milliseconds (where $x$ is a parameter we pass),\
    \ we just need to transform the values to whatever we want. Our game in Chapter\
    \ 3, Building Concurrent Programs, on page 39, is heavily based on this technique.\n\
    \n- *Rx.Observable.distinct*\n\nDefault behavior: **Same as the Observable it\
    \ filters***\n\ndistinct is one of these extremely simple operators that saves\
    \ a ton of development work. It filters out of the sequence any value that has\
    \ already been emitted. That keeps us from writing time and again error-prone\
    \ boilerplate code that uses a dictionary somewhere with the emitted results,\
    \ against which we compare incoming results. You know what kind of code I'm talking\
    \ about. Yuck. That's gone with distinct.\n\n![](img/a8eed7bbb390e0eff6b6561c329a113c_54_0.png)\n\
    \ndistinct lets us use a function that specifies the comparison method. Additionally,\
    \ we can pass no arguments and it will use strict comparison to compare primitives\
    \ such as numbers or strings, and run deep comparisons in case of more complex\
    \ objects.\n\n## Wrapping Up\n\nIn this chapter we covered how to visually represent\
    \ and understand Observable flows using marble diagrams. We've covered the most\
    \ common operators to transform Observables, and, more importantly, we've built\
    \ a real-world application using only Observable sequences, avoiding setting any\
    \ external state, loops, or conditional branches. We expressed our whole program\
    \ in a declarative way, without having to encode every step to accomplish the\
    \ task at hand.\n\nIn the next chapter we'll continue to explore Observable sequences,\
    \ this time taking a look at more advanced operators that allow you to control\
    \ and bend flows and data in your program like you've imagined possible with procedural\
    \ code!\n\n## Building Concurrent Programs\n\nConcurrency is the art of doing\
    \ several things at the same time, correctly and efficiently. To accomplish this,\
    \ we structure our programs to take advantage of time so that tasks run together\
    \ in the most efficient way. Examples of everyday concurrency in applications\
    \ include keeping the user interface responsive while other activities are happening,\
    \ and processing hundreds of customers' orders efficiently.\n\nIn this chapter\
    \ we'll explore concurrency and pure functions in RxJS by making a shoot-'em-up\
    \ spaceship game for the browser. We'll first introduce the Observable pipeline,\
    \ a technique to chain Observable operators and pass state between them. I'll\
    \ show you how to use the pipeline to build programs without relying on external\
    \ state or side effects, by encapsulating all of your logic and state inside the\
    \ Observables themselves.\n\nVideo games are computer programs that need to keep\
    \ a lot of state, but we'll write our game with no external state whatsoever,\
    \ using the power of the Observable pipeline and some great RxJS operators.\n\n\
    ## Purity and the Observable Pipeline\n\nAn Observable pipeline is a group of\
    \ operators chained together, where each takes an Observable as input and returns\
    \ an Observable as output. We've been using pipelines in this book; they are ubiquitous\
    \ when programming with RxJS. Here's a simple one:\n\n```\nspaceship_reactive/pipeline.js\n\
    Rx.Observable\n  .from(1, 2, 3, 4, 5, 6, 7, 8)\n  .filter(function(val) { return\
    \ val % 2; })\n```\n\nPipelines are self-contained. Each operator flows from one\
    \ to the next, without the need for external state. But as we build reactive programs,\
    \ we may be tempted to store state outside the pipeline. Pure functions always\
    \ return the same output given the same input.\n\n## Avoiding External State\n\
    \nIn the following example we count the even numbers interval has yielded so far.\
    \ We do that by creating an Observable:\n\n```javascript\nspaceship_reactive/state.js\n\
    var evenTicks = 0;\n\nfunction updateDistance(i) {\n  if (i % 2 === 0) {\n   \
    \ evenTicks += 1;\n  }\n  return evenTicks;\n}\n\nvar ticksObservable = Rx.Observable\n\
    \  .interval(1000)\n  .map(updateDistance)\n```\n\n```javascript\nticksObservable.subscribe(function()\
    \ {\n  console.log('Subscriber 1 - ' + evenTicks + ' so far');\n});\n```\n\nThis\
    \ is the output we get after the program has running for four seconds:\n\n- Subscriber\
    \ 1 - evenTicks: 1 so far\n- Subscriber 1 - evenTicks: 1 so far\n- Subscriber\
    \ 1 - evenTicks: 2 so far\n- Subscriber 1 - evenTicks: 2 so far\n\nNow, just for\
    \ kicks, let's add another subscriber to ticksObservable:\n\n```javascript\nspaceship_reactive/state.js\n\
    var evenTicks = 0;\n\nfunction updateDistance(i) {\n  if (i % 2 === 0) {\n   \
    \ evenTicks += 1;\n  }\n  return evenTicks;\n}\n\nvar ticksObservable = Rx.Observable\n\
    \  .interval(1000)\n  .map(updateDistance)\n```\n\n```javascript\nticksObservable.subscribe(function()\
    \ {\n  console.log('Subscriber 1 - ' + evenTicks + ' so far');\n});\n```\n\n```javascript\n\
    ticksObservable.subscribe(function() {\n  console.log('Subscriber 2 - ' + evenTicks\
    \ + ' so far');\n});\n```\n\nThe output is now the following:\n\n- Subscriber\
    \ 1 - evenTicks: 1 so far\n- Subscriber 2 - evenTicks: 2 so far\n- Subscriber\
    \ 1 - evenTicks: 2 so far\n- Subscriber 2 - evenTicks: 2 so far\n- Subscriber\
    \ 1 - evenTicks: 3 so far\n- Subscriber 2 - evenTicks: 4 so far\n- Subscriber\
    \ 1 - evenTicks: 4 so far\n- Subscriber 2 - evenTicks: 4 so far\n\nHold on a second—the\
    \ even ticks count on Subscriber 2 is completely off! It should always contain\
    \ the same evenTicks count as Subscriber 1. The reason, as you might have guessed,\
    \ is that the Observable pipeline will run once for each subscriber, increasing\
    \ evenTicks twice.\n\nProblems caused by sharing external state are often more\
    \ subtle than this example. In complex applications, opening the door to changing\
    \ state outside of the pipeline leads to code becoming complicated, and bugs soon\
    \ start to show up. The solution is to encapsulate as much information as we can\
    \ inside the pipeline. Here's a way we could refactor the preceding code to avoid\
    \ external state:\n"
  mdcn: "\n在不到 20 行代码中，我们编写了一个应用程序，它可以定期轮询外部 JSONP URL，从内容中提取具体数据，并过滤掉已经导入的地震。之后，我们在地图上表示这些地震，其大小与震级成正比——所有代码都以一种自包含的、清晰且简洁的方式编写，不依赖任何外部存储。这真不错！这展示了\
    \ Observables 有多么强大的表达能力。\n\n## 改进想法\n\n这里有几个想法，可以让你运用新学到的 RxJS 技能，让这个小应用变得更有趣：\n\
    \n- *当用户将鼠标悬停在地震上时，弹出一个窗口显示该特定地震的更多信息。实现这一点的一种方法是从地震数据创建一个新的 Observable，仅包含你需要的属性，并在悬停时对其进行动态过滤。*\n\
    - 在页面顶部实现一个计数器，显示到今天为止的地震数量，并每天重置一次。\n\n## 操作符概览\n\n本章向你介绍了几个新的操作符，这里是对它们的回顾，以及我们在应用程序中使用它们的场景描述。请记住，你始终可以在\
    \ RxJS 的 GitHub 网站上找到操作符的完整 API 文档⁴。\n\n- *Rx.Observable.from*\n\n默认行为：*同步*\n\n\
    由于你在应用程序中使用的许多数据源来自数组或可迭代对象，因此拥有一个从这些对象创建 Observable 的操作符是有意义的。from` 是你将使用最频繁的操作符之一。\n\
    \n通过 `from`，我们可以从数组、类数组对象（例如 `arguments` 对象或 DOM `NodesList`），甚至实现了可迭代协议的类型（如\
    \ String、Map 和 Set⁵）创建 Observable。\n\n- *Rx.Observable.range*\n\n默认行为：*同步*\n\n\
    `range` 操作符生成有限的 Observable，它在特定范围内发射整数。它非常多能，可以用于许多场景。例如，你可以使用 `range` 来生成类似扫雷等游戏棋盘上的初始方格。\n\
    \n- *Rx.Observable.interval*\n\n默认行为：**异步***\n\n每当你需要生成具有时间间隔的值时，你可能会从 `interval`\
    \ 操作符开始作为生成器。由于 `interval` 每隔几毫秒发射一个顺序整数（其中 $x$ 是我们传递的参数），我们只需要将值转换为我们需要的任何形式。我们在第\
    \ 3 章“构建并发程序”（第 39 页）中的游戏很大程度上基于这种技术。\n\n- *Rx.Observable.distinct*\n\n默认行为：**与它过滤的\
    \ Observable 相同***\n\n`distinct` 是这些极其简单且节省大量开发工作的操作符之一。它过滤掉序列中任何已经发射过的值。这避免了我们反复编写容易出错的模板代码，即在某处使用字典存储已发射的结果，并与传入的结果进行比较。你知道我在说哪种代码。真讨厌。有了\
    \ `distinct`，这些都消失了。\n\n![](img/a8eed7bbb390e0eff6b6561c329a113c_54_0.png)\n\n\
    `distinct` 让我们使用一个指定比较方法的函数。此外，我们可以不传递任何参数，它将使用严格比较来比较数字或字符串等原始类型，并对复杂的对象运行深度比较。\n\
    \n## 总结\n\n在本章中，我们涵盖了如何使用弹珠图（marble diagrams）可视化地表示和理解 Observable 流。我们涵盖了转换 Observable\
    \ 最常用的操作符，更重要的是，我们仅使用 Observable 序列构建了一个真实的应用程序，避免了设置任何外部状态、循环或条件分支。我们以声明式的方式表达了整个程序，而不需要为了完成任务而编码每一个步骤。\n\
    \n在下一章中，我们将继续探索 Observable 序列，这次将查看更高级的操作符，这些操作符允许你像在过程式代码中想象的那样，控制并弯曲程序中的流和数据！\n\
    \n## 构建并发程序\n\n并发是同时做几件事的艺术。并发是同时处理多个任务的艺术。在本章中，我们将学习如何使用 RxJS 处理并发。RxJS 的强大之处在于它能够让你以声明式的方式处理这些复杂的并发逻辑。\n\
    \n每当你需要生成具有时间间隔的值时，你可能会从 `interval` 操作符开始作为生成器。由于 `interval` 每隔几毫秒发射一个顺序整数（其中\
    \ $x$ 是我们传递的参数），我们只需要将值转换为我们需要的任何形式。我们在第 3 章“构建并发程序”（第 39 页）中的游戏很大程度上基于这种技术。\n\
    \n并发是同时做几件事的艺术。并发是同时处理多个任务的艺术。在本章中，我们将学习如何使用 RxJS 处理并发。RxJS 的强大之处在于它能够让你以声明式的方式处理这些复杂的并发逻辑。\n\
    \n并发是同时做几件事的艺术。并发是同时处理多个任务的艺术。在本章中，我们将学习如何使用 RxJS 处理并发。RxJS 的强大之处在于它能够让你以声明式的方式处理这些复杂的并发逻辑。\n\
