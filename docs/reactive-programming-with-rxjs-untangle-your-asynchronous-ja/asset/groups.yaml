    # Wrapping Up


    In this chapter we covered how to visually represent and understand Observable
    flows using marble diagrams. We''ve covered the most common operators to transform
    Observables, and, more importantly, we''ve built a real-world application using
    only Observable sequences, avoiding setting any external state, loops, or conditional
    branches. We expressed our whole program in a declarative way, without having
    to encode every step to accomplish the task at hand.


    In the next chapter we''ll continue to explore Observable sequences, this time
    taking a look at more advanced operators that allow you to control and bend flows
    and data in your program like''ve never imagined possible with procedural code!'
