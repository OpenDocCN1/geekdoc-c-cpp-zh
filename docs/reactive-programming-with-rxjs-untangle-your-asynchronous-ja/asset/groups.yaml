    \n**Sergi Mansilla**\nedited by Rebecca Gulick\n\n# Early praise for Reactive\
    \ Programming with RxJS\n\nEvery significant shift in software development demands\
    \ rethinking our approaches. Real-time and asynchronous web applications pose\
    \ a huge challenge in web development today. This book does an excellent job explaining\
    \ how RxJS addresses those challenges and teaches you how to rethink your world\
    \ in terms of Observables.\n\n- Zef Hemel\nVP engineering, STX Next\n\nThis book\
    \ is as hot as reactive programming itself! With great writing, clear explanations,\
    \ and practical examples, this is a fantastic resource for learning RxJS.\n\n\
    - Fred Daoud\nSoftware-development contractor\n\nBe proactive and learn reactive\
    \ programming with this book before it's too late. Rx.Observable.fromBook(book).subscribe(function(value)\
    \ {...do amazing stuff...});\n\n- Javier Collado Cabeza\nSenior software developer,\
    \ NowSecure, Inc.\n\nA very readable book with great content. This book is eminently\
    \ useful and provides a clear roadmap for learning reactive programming with RxJS\
    \ with practical examples.\n\n- Ramaninder Singh Jhajjj\nSoftware engineer, Area\
