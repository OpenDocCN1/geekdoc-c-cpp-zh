    \ 结合 `searchDOM` 和 `searchResults`。它们中的任何一个变化会导致布局改变，每当这两个 Observable 之一发射项时，我们都会重新渲染\
    \ DOM 树。\n\n拿到最终代码后，我们可以看到 Cycle.js 的巨大威力。框架中没有事实上的类、特殊类型或正在发生的“魔法”。它全是无副作用的函数，接受\
    \ Observables 并输出更多的ables。仅凭这些，我们就拥有了一个清晰、响应式且易用的简洁 Web 应用程序框架。它不惜一切地避免副作用，使我们的\
    \ Web 应用程序更加健壮。\n\n# 改进建议\n\n除了对更好的视觉设计的迫切需求外，我们的应用程序还可以使用一些功能，使其不仅仅是快速重定向到维基百科结果：\n\
    \n- 让用户书签特定的结果。你可以为列表中的每个结果添加一个小星号，当用户点击时，它会将结果保存为收藏。你可以将这个星号制成一个独立的组件。如果你使用持久化\
    \ API（响应式的！），例如 `Local Storage` 或 `IndexedDB`，将获得额外加分。\n- 如果用户点击链接，在屏幕右侧显示结果的“预览”，带有摘要和一些相关的元数据。如果用户想查看真正的维基百科结果，你可以在其中包含一个\
    \ _阅读更多链接_。将其作为一个组件实现。\n\n# 结语\n\n现在你已经了解了如何在不放弃响应式哲学的情况下使用现代技术开发 Web 应用程序。本章提供了如何将\
