  - "[PAGE 90]\n\n# Hot Observables\n\nAn Observer subscribed to a hot Observable\
    \ will receive values emitted from the exact moment it subscribes to it. Every\
    \ other Observer subscribed at that moment will receive the exact same values.\
    \ This is similar to how JavaScript events work.\n\nMouse events and a stock-exchange\
    \ ticker are examples of hot Observables. In both cases the Observable emits values\
    \ regardless of whether it has subscribers, and could already be producing values\
