    var subject = new Rx.ReplaySubject(2); // Buffer size of 2\n```\n\n```javascript\n\
    subject.onNext(1);\nsubject.onNext(2);\nsubject.onNext(3);\n```\n\n```javascript\n\
    subject.subscribe(function(n) {\n  console.log('Received value:', n);\n});\n```\n\
    \n- Received value: 2\n  Received value: 3\n\nThe second parameter takes a number\
    \ that represents the time in milliseconds during which we want to buffer values:\n\
    \n```javascript\nvar subject = new Rx.ReplaySubject(null, 200); // Buffer size\
