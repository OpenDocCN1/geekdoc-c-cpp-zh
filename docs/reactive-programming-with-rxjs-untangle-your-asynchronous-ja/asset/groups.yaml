  - "[PAGE 60]\n\n# Purity and the Observable Pipeline • 43\n\ntransforming arrays\
    \ in JavaScript by chaining operators is expensive. Yet in this book I'm telling\
    \ you to to design your program by transforming sequences into new ones. Isn't\
    \ that terribly inefficient?\n\nChaining looks similar in Observables and in arrays;\
    \ there are even methods like filter and map that are present in both types. But\
    \ there's a crucial difference: array methods create a new array as a result of\
    \ each operation, which is traversed by the next operation. Observable pipelines,\
    \ on the other hand, don't create intermediate Observables and apply all operations\
    \ to each element in one go. The Observable is traversed only once, which makes\
    \ chaining Observables efficient. Check out the following example:\n\n```\nspaceship_reactive/array_chain.js\n\
    ```\n\n```\nstringArray // represents an array of 1,000 strings\n.map(function(str)\
