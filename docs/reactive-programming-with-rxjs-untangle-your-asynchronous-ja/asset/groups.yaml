    \ true\nconsole.log(consumer.next(), consumer.hasNext()); // 6 true\nconsole.log(consumer.next(),\
    \ consumer.hasNext()); // 9 false\n```\n\n迭代器非常适合封装任何类型数据结构的遍历逻辑。正如我们在前面的示例中看到的，当迭代器被泛化以处理不同类型的数据，或者当它们可以在运行时进行配置时（正如我们在示例中通过\
    \ `divisor` 参数所的那样），它们就会变得有趣起来。\n\n虽然观察者和迭代器本身都是强大的，但两者的结合效果更好。我们称之为 Rx 模式，它根据\
    \ Reactive Extensions（响应扩展）库命名。在本书的剩余部分，我们将使用这种模式。\n\nObservable 序列（或简单称为 Observable）是\
    \ Rx 模式的核心。观察者（Observer）按顺序发射它的值——但不是由消费者请求下一个值，而是由 Observable 在值可用时将其“推送”给消费者。它与观察者模式中\
    \ Producer 的角色相似：发射值并将其推给监听器。\n\n![](img/a8eed7bbb390e0eff6b6561c329a113c_27_0.png)\n\
    \n在编程中，基于推送（push-based）的行为意味着应用程序的服务器组件主动更新客户端，而不是由客户端轮询服务器获取这些更新。这就像在说：“不要给我们打电话，我们会给你回电。”\
    \ RxJS 是基于推送的，因此事件源（Observable）会将新值推给消费者（观察者），而无需消费者请求下一个值。\n\n更简单地说，Observable\
    \ 是一个项随时间变得可用的序列。Observable 的消费者——观察者——等同于观察者模式中的监听器。当一个观察者订阅一个 Observable 时，它将在序列中的项可用时接收它们，而无需请求。\n\
    \n到目前为止，Observable 与观察者模式似乎没有太大区别。但实际上，它们有两点本质区别：\n- Observable 是基于推送的，而迭代器是基于拉取的。\n\
    - Observable 可以处理异步数据流，而迭代器通常只处理同步数据。\n\n使用 Observable，我们可以对序列进行转换、过滤和组合操作，而不需要在每个操作中手动处理逻辑。此外，Observable\
    \ 还可以信号序列的结束。我们可以通过 `subscribe` 方法来完成这些操作。\n\n## 创建 Observable\n\n有多种方法可以创建 Observable。`create`\
