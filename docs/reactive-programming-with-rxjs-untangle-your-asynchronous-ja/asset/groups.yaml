    <!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n  <title>Wikipedia\
    \ search</title>\n</head>\n<body>\n  <div id=\"container\"></div>\n  <script src=\"\
    bundle.js\"></script>\n</body>\n</html>\n```\n\n# Our Project: Wikipedia Search\n\
    \nIn this section we'll build an application that searches Wikipedia as the user\
    \ types.\n\n![](img/a8eed7bbb390e0eff6b6561c329a113c_121_0.png)"
  - "[PAGE 122]\n\n# Chapter 6. Reactive Web Applications with Cycle.js • 106\n\n\
    RxJS already makes retrieving and processing the remote data, but, as you saw\
    \ in Chapter 4, Building a Complete Web Application, on page 69, we still need\
    \ to jump through some hooks to make our DOM operations efficient.\n\nOne of the\
    \ objectives of Cycle.js is to completely eliminate DOM manipulation from our\
    \ code. Let's start with basic scaffolding:\n\n```\ncycle/step1.js\nvar Cycle\
    \ = require('@cycle/core');\nvar CycleDOM = require('@cycle/dom');\nvar Rx = Cycle.Rx;\n\
    \nfunction main(responses) {\n  return (\n    DOM: Rx.Observable.just(CycleDOM.h('span',\
    \ 'Hi there!'))\n  );\n}\n```\n\n```\nvar drivers = {\n  DOM: CycleDOM.makeDOMDriver('#container')\n\
    }\n```\n\nCycle.run(main, drivers);\nThis code shows the Hi there! onscreen, but\
    \ there's already a lot going on. The important parts are the main function and\
    \ the drivers object. Let's go through the steps:\n\n+   We require Cycle Core\
    \ and the Cycle DOM driver. I'll explain what the Cycle.js driver is in the next\
    \ section.\n\n+   The main function is always the entry point for our application.\
    \ It returns a collection of Observables, for each driver in the application.\
    \ So far we're using only one: the DOM driver.\n\nThe Observable for the DOM driver\
    \ emits a virtual tree, which we create using the h method in the Cycle DOM library.\
    \ In this case, we create a single span element with the text 'Hi there!'. The\
    \ DOM driver consumes virtual tree and renders the actual DOM from the page it.\n\
    \n+   We create a DOM driver that will build the DOM tree from the items emitted\
    \ by the main function. The DOM tree will be built in the element or selector\
    \ that we pass as a parameter. In this case, #container.\n\n+   Cycle.run connects\
    \ the main function with the drivers object, creating a circular flow between\
    \ the two.\n\nreport erratum • discuss"
- md: "\n# Cycle.js Drivers\n\nCycle.js drivers are functions we use to cause side\
    \ effects. Nowhere else in our programs should be modifying state in any way.\
    \ Drivers take an Observable that emits data from our application, and they return\
    \ another Observable that causes the side effects.\n\nWe won't be creating drivers\
    \ very often—only when we need side effects like modifying the DOM, reading and\
    \ writing from other interfaces (for example, Local Storage), or making requests.\
    \ In most applications we'll only use the DOM driver (which renders web pages)\
    \ and the HTTP driver (which we can use to make HTTP requests). In this example,\
    \ we'll use yet another one, the JSONDP driver.\n\n# The User Interface\n\nWe\
    \ need actual content for our page, not just a span. Let's make a function that\
    \ creates the virtual tree that represents our page:\n\n```javascript\ncycle/index.js\n\
    function vTreeElements(results) {\n  var h = CycleDOM.h;\n  return h('div', [\n\
    \    h('h1', 'Wikipedia Search '),\n    h('input', {className: 'search-field'},\
    \ attributes: {type: 'text'}}),\n    h('hr'),\n    h('div', results.map(function(result)\
    \ {\n      return h('a', {href: WIKI_URL + result.title}, result.title);\n   \
    \ }))\n  ]);\n}\nexport default vTreeElements;\n```\n\nThis function might look\
    \ a bit strange, but don't panic. It is using Virtual Hyperscript, a domain-specific\
    \ language for creating virtual DOM trees. Virtual Hyperscript contains a single\
    \ method, called h, which declares a way to write HTML, using JavaScript. We can\
    \ add attributes to elements or append children to them by passing extra objects\
    \ or arrays to h. The resulting virtual tree will eventually be rendered into\
    \ real browser DOM.\n\nvTreeElements takes an array of objects, and returns a\
    \ virtual tree that represents the simple UI for our app. It renders an input\
    \ field and a listing of links made from the objects in results, which will eventually\
    \ contain Wikipedia's search results. We'll use vTreeElements to render our application.\n\
    \n# Using JSX\n\nInstead of using the h function, we could write our UI using\
    \ JSX. An XML-like syntax invented by Facebook that makes writing virtual DOM\
    \ structures easier and more readable. Our vtreeElements function would look like\
    \ this:\n\n```javascript\ncycle/index.js\nfunction vtreeElementsJSX(results) {\n\
    \  results = results.map(function(result) {\n    var link = WIKI_URL + result.title;\n\
    \    return <div><a href={link}>{result.title}</a></div>;\n  });\n\n  return <div>\n\
    \    <h1>Wikipedia Search</h1>\n    <input className=\"search-field\" type=\"\
    text\" />\n    <hr/>\n    <div>{results}</div>\n  </div>;\n}\n```\n\nSince JSX\
    \ is a syntax extension, not a compiler that transforms it into the final JavaScript\
    \ code (which looks very like our h-based code from the previous section), we'll\
    \ use Babel for that. Babel is a compiler that transforms modern JavaScript into\
    \ JavaScript that runs everywhere. It also transforms some JavaScript extensions,\
    \ which is JSX, which is its particular use case.\n\nIf you want to use JSX, you\
    \ need to install Babel and use it when compiling the project. Fortunately, Babel\
    \ has an adapter for Browserify called Babelify:\n\n- `npm install babelify`\n\
    \nIn every file that uses JSX, we need to add the following lines at the top of\
    \ the file:\n\n```javascript\n/** @jsx JSX */\nvar hJSX = CycleDOM.JSX;\n```\n\
    \n- 3. https://babeljs.io\n\nThis tells Babel to use Cycle.js hJSX adapter to\
    \ process JSX, instead of the default React one.\n\nNow we want to compile our\
    \ project, we can use the following command:\n\n```bash\nbrowserify search index.js\
    \ -t babelify --outfile bundle.js\n```\n\n# Getting the Search Term from the User\n\
    \nWe need a function that returns an Observable of URLs that query Wikipedia’s\
    \ API using terms entered by the user:\n\n```javascript\ncycle/index.js\nvar MAIN_URL\
    \ = 'https://en.wikipedia.org/';\nvar WIKI_URL = MAIN_URL + '/wiki/';\nvar API_URL\
    \ = MAIN_URL + '/w/api.php?action=query&format=json&search=&srsearch=;\n\nfunction\
    \ searchRequest(responses) {\n  return responses.DOM.select('.search-field').events('input')\n\
    \    .debounce(300)\n    .map(function(e) { return e.target.value })\n    .filter(function(value)\
    \ { return value.length > 2 })\n    .map(function(search) { return API_URL + search\
    \ });\n}\n```\n\nFirst we declare our URL we will use to query Wikipedia. In the\
    \ function searchRequest we take a responses object that contains all the drivers\
    \ in our application, and we use the get method in the DOM driver. `select(element).event(type)`\
    \ behaves similarly to `fromEvent`: it selects a selector for a DOM element and\
    \ the type of event to listen to and returns an Observable that emits events.\n\
    \nFrom that moment, the rest of the code should look pretty familiar to you since\
    \ it consists of transforming an Observable’s values through our usual operators:\n\
    \n- Throttle results to receive one every 300 milliseconds at most.\n- Extract\
    \ the value of the input box.\n- Take only text longer than two characters.\n\
    - Append the final value to Wikipedia’s API URL.\n\nGreat! So far we have the\
    \ function to generate our UI and the function to retrieve user input from that.\
    \ We now need to add the functionality to get the search results.\n\n# Revising\
    \ Our Function\n\nYou may have noticed that the main function takes a parameter,\
    \ which we're not using. In any case, using JSONP doesn't affect the point of\
    \ this chapter. especially in production, use JSONP to retrieve remote data. We\
    \ want to plug the result of searchRequest into the JSONP driver, so that as soon\
    \ as the user types a search term, we query Wikipedia with the term.\n\nTo do\
    \ that, we create a new JSONP driver using CycleJSONP.makeJSONPDriver, which will\
    \ receive whatever we put in the property JSONP in the return object from main.\
    \ After that, we should already be querying Wikipedia when we introduce a search\
    \ term in the input box, but since we're not connecting the JSONP output to anything,\
    \ we don't see any changes on the page. Let's change\n\n```javascript\ncycle/step2.js\n\
    var cycle = require('@cycle/core');\nvar CycleDOM = require('@cycle/dom');\nvar\
    \ CycleJSONP = require('@cycle/jsonp');\nvar Rx = Cycle.Rx;\nvar h = CycleDOM.h;\n\
    \nfunction main(responses) {\n  return {\n    DOM: Rx.Observable.just(h('span',\
    \ 'Hey there!')),\n    JSONP: searchRequest(responses)\n  };\n}\n\nvar drivers\
    \ = {\n  DOM: CycleDOM.makeDOMDriver('#container'),\n  JSONP: CycleJSONP.makeJSONPDriver()\n\
    };\n\nCycle.run(main, drivers);\n```\n\n```javascript\ncycle/step3.js\nvar cycle\
    \ = require('@cycle/core');\nvar CycleDOM = require('@cycle/dom');\nvar CycleJSONP\
    \ = require('@cycle/jsonp');\nvar Rx = Cycle.Rx;\n\nfunction main(responses) {\n\
    \  var vtree$ = responses.JSONP\n    .filter(function(res) {\n      return res.request.indexOf(API_URL)\
    \ === 0;\n    })\n    .mergeAll()\n    .pluck('query', 'search')\n    .startWith([])\n\
    \    .map(vTreeElements);\n\n  return {\n    DOM: vtree$,\n    JSONP: searchRequest(responses)\n\
    \  };\n}\n```\n\nmain receives the output of all drivers through its responses.\
    \ We can get the result of the JSONP calls in responses.JSONP, an Observable of\
    \ all the JSONP responses in our application. Once we have that, we can transform\
    \ the Observable to get the search results in the form we need.\n"
  mdcn: "\n\n# Cycle.js 驱动 (Drivers)\n\nCycle.js 驱动程序是我们用于产生副作用的函数。在程序的任何其他地方都不应该以任何方式修改状态。驱动程序接收一个发射来自应用程序数据的\
    \ Observable，并返回另一个产生副作用的 Observable。\n\n我们不会经常创建驱动程序——只有当我们需要产生副作用时，例如修改 DOM、从其他接口读取和写入数据（例如\
    \ Local Storage）或发送请求时，才会创建它们。在大多数应用程序中，我们只会使用 DOM 驱动（用于渲染网页）和 HTTP 驱动（我们可以用它来发送\
    \ HTTP 请求）。在这个示例中，我们将使用另一个驱动：JSONDP 驱动。\n\n# 用户界面\n\n我们需要页面有实际的内容，而不仅仅是一个 `span`。让我们写一个函数来创建一个表示我们页面的虚拟树：\n\
    \n```javascript\ncycle/index.js\nfunction vTreeElements(results) {\n  var h =\
    \ CycleDOM.h;\n  return h('div', [\n    h('h1', 'Wikipedia Search '),\n    h('input',\
    \ {className: 'search-field'}, attributes: {type: 'text'}}),\n    h('hr'),\n \
    \   h('div', results.map(function(result) {\n      return h('a', {href: WIKI_URL\
    \ + result.title}, result.title);\n    }))\n  ]);\n}\nexport default vTreeElements;\n\
    ```\n\n这个函数看起来可能有点奇怪，但不要慌。它使用的是虚拟超脚本（Virtual Hyperscript），一种用于创建虚拟 DOM 树的领域语言。Virtual\
    \ Hyperscript 包含一个名为 `h` 的方法，它使用 JavaScript 声明编写 HTML 的方式。我们可以通过向 `h` 传递额外的对象或数组为元素添加属性或元素。生成的虚拟树最终会被渲染成浏览器\
    \ DOM。\n\nvTreeElements 接收一个对象数组，并返回一个表示应用程序简单 UI 的虚拟树。它渲染了一个输入框和一个由 `results`\
    \ 中的对象生成的链接列表，这些链接最终将包含 Wikipedia 的搜索结果。我们将使用 `vTreeElements` 来渲染我们的应用程序。\n\n\
    # 使用 JSX\n\n与其使用 `h` 函数，我们可以使用 JSX 来编写 UI。JSX 是 Facebook 发明的一种类 XML 语法，使得编写虚拟\
    \ DOM 结构变得更容易、更易读。我们的 `vtreeElements` 函数看起来像这样：\n\n```javascript\ncycle/index.js\n\
    function vtreeElementsJSX(results) {\n  results = results.map(function(result)\
    \ {\n    var link = WIKI_URL + result.title;\n    return <div><a href={link}>{result.title}</a></div>;\n\
    \  });\n\n  return <div>\n    <h1>Wikipedia Search</h1>\n    <input className=\"\
    search-field\" type=\"text\" />\n    <hr/>\n    <div>{results}</div>\n  </div>;\n\
    }\n```\n\n由于 JSX 是一种语法扩展，而不是将其转换为最终 JavaScript 代码的编译器（代码看起来与上一节中基于 `h` 的代码非常相似），我们将使用\
    \ Babel 来。Babel 是一个将现代 JavaScript 转换为随处运行的 JavaScript 的编译器。它还会转换一些 JavaScript\
    \ 扩展，例如 JSX，这是它的特定用例。\n\n如果你想使用 JSX，你需要安装 并在编译项目时使用它。幸运的是，Babel 有一个针对 Browserify\
    \ 的适配器 Babelify：\n\n- `npm install babelify`\n\n在每个使用 JSX 的文件中，我们需要在文件顶部添加以下行：\n\
    \n```javascript\n/** @jsx JSX */\nvar hJSX = CycleDOM.JSX;\n```\n\n- 3. https://babeljs.io\n\
    \n这告诉 Babel 使用 Cycle.js 的 hJSX 适配器来处理 JSX，而不是默认的 React 那个。\n\n现在我们要编译项目，可以使用以下命令：\n\
    \n```bash\nbrowserify search index.js -t babelify --outfile bundle.js\n```\n\n\
    # 从用户处获取搜索词\n\n我们需要一个函数，返回一个 URL Observable，该 Observable 使用用户输入的词查询 Wikipedia\
    \ 的 API：\n\n```javascript\ncycle/index.js\nvar MAIN_URL = 'https://en.wikipedia.org/';\n\
    var WIKI_URL = MAIN_URL + '/wiki/';\nvar API_URL = MAIN_URL + '/w/api.php?action=query&format=json&search=&srsearch=;\n\
    \nfunction searchRequest(responses) {\n  return responses.DOM.select('.search-field').events('input')\n\
    \    .debounce(300)\n    .map(function(e) { return e.target.value })\n    .filter(function(value)\
    \ { return value.length > 2 })\n    .map(function(search) { return API_URL + search\
    \ });\n}\n```\n\n首先，我们声明将用于查询 Wikipedia 的 URL。在 `searchRequest` 函数中，我们获取一个 `responses`\
    \ 对象，它包含了应用程序中的所有驱动程序，并使用 DOM 驱动中的 `get` 方法。`select(element).event(type)` 的行为类似于\
    \ `fromEvent`：它选择一个 DOM 元素的选择器和监听的事件类型，并返回一个发射事件的 Observable。\n\n从那一刻起，剩下的代码对你应该非常熟悉，因为它包含了通过我们常用的操作符转换\
    \ Observable 的值：\n\n- 节流结果，确保每 300 毫秒最多接收一个。\n- 提取输入框的值。\n- 只取长度大于两个字符的文本。\n-\
    \ 将最终值附加到 Wikipedia 的 API URL。\n\n太棒了！到为止我们有了生成 UI 的函数以及从那里获取用户输入的函数。我们现在需要添加获取搜索结果的功能。\n\
    \n# 修改我们的函数\n\n你可能注意到 `main` 函数接收一个参数，我们还没有使用它。在任何情况下，使用 JSONP 并不是本章的重点。特别是在生产环境中，使用\
    \ JSONP 获取远程数据。我们希望将 `searchRequest` 的结果接入 JSONP 驱动，这样一旦用户输入搜索词，我们就使用该词查询 Wikipedia。\n\
    \n为了实现这一点，我们使用 `CycleJSONP.makeJSONPDriver` 创建一个新的 JSONP 驱动，它将接收放入 `main` 返回对象的\
    \ JSONP 属性中的任何内容。之后，我们在输入框中引入搜索词时已经在查询 Wikipedia 了，但由于我们没有将 JSONP 输出连接到任何地方，页面上看不到任何变化。让我们改变：\n\
    \n```javascript\ncycle/step2.js\nvar CycleDOM = require('@cycle/dom');\nvar CycleJSONP\
    \ = require('@cycle/jsonp');\nvar Rx = Cycle.Rx;\nvar h = CycleDOM.h;\n\nfunction\
    \ main(responses) {\n  return {\n    DOM: Rx.Observable.just(h('span', 'Hey there!')),\n\
    \    JSONP: searchRequest(responses)\n  };\n}\n\nvar drivers = {\n  DOM: CycleDOM.makeDOMDriver('#container'),\n\
    \  JSONP: CycleJSONP.makeJSONPDriver()\n};\n\nCycle.run(main, drivers);\n```\n\
    \n```javascript\ncycle/step3.js\nvar cycle = require('@cycle/core');\nvar CycleDOM\
    \ = require('@cycle/dom');\nvar CycleJSONP = require('@cycle/jsonp');\nvar Rx\
    \ = Cycle.Rx;\n\nfunction main(responses) {\n  var vtree$ = responses.JSONP\n\
    \    .filter(function(res) {\n      return res.request.indexOf(API_URL) === 0;\n\
    \    })\n    .mergeAll()\n    .pluck('query', 'search')\n    .startWith([])\n\
    \    .map(vTreeElements);\n\n  return {\n    DOM: vtree$,\n    JSONP: searchRequest(responses)\n\
    \  };\n}\n```\n\n`main` 通过其 `responses` 接收所有驱动的输出。可以通过 `responses.JSONP` 获取 JSONP\
    \ 调的结果，它是应用程序中所有 JSONP 响应的 Observable。一旦获取这些，我们就可以转换 Observable 以获取所需格式的搜索结果。\n\
    \n"
