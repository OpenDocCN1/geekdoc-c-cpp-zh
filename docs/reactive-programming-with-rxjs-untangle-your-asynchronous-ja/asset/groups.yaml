    \ through the filtered array and log each result to the console.\n\nIn the process\
    \ of transforming the array, we've iterated three times and created two completely\
    \ big arrays. This is far from efficient! You shouldn't program this way if you're\
    \ concerned about performance or you're dealing with big sequences of items.\n\
    \nThis is what the same operation would look like using Observables:\n\n```\n\
    spaceship_reactive/array_chain.js\n```\n\n```\nstringObservable // represents\
