    \ library, a library by the same team that made RxJS, which provides convenient\
    \ operators to deal with DOM and browser-related stuff that makes our lives easier.\
    \ For the server part, we'll use two well-established node libraries and wrap\
    \ some of their APIs with Observables to use them in our application.\n\nAfter\
    \ this chapter, you'll be able to use RxJS to build user interfaces in a declarative\
    \ way, using the techniques we've seen so far and applying them to the DOM. You'll\
    \ also be ready to use RxJS in any Node.js project and able to use reactive programming\
    \ and RxJS in any project.\n\n# Building a Real-Time Earthquake Dashboard\n\n\
    We'll be building both server and client parts for an earthquake dashboard application,\
    \ picking up where we left the application we started in Making Real-Time Earthquake\
