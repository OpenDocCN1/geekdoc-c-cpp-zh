    Real-time and asynchronous web applications pose a huge challenge in web development
    today. This book does an excellent job explaining how RxJS addresses those challenges
    and teaches you how to rethink your world in terms of Observables.


    +   - Zef Hemel

    VP engineering, STX Next


    This book is as hot as reactive programming itself! With great writing, clear
