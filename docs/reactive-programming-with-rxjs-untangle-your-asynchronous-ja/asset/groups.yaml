    ```\n\n```\ncaught.subscribe(json) {\n  console.log('Parsed JSON: ', json);\n\
    \  // Because we catch errors now, 'onError' will not be executed\n  function(e)\
    \ {\n    console.log('ERROR', e.message);\n  }\n});\n```\n\nIn the preceding code,\
    \ we create a new Observable, caught, that uses the catch operator to catch errors\
    \ in the original Observable. If there's an error it will continue the sequence\
    \ with an Observable that emits only one item, with an error property describing\
