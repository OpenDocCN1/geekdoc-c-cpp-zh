    \      }\n    };\n\n    req.onerror = function() {\n      observer.onError(new\
    \ Error(\"Unknown Error\"));\n    };\n\n    req.send();\n  });\n}\n\n// 创建一个 Observable\n\
    var test = get('/api/contents.json');\n```\n\n在前面的代码中，`get` 函数使用 `create` 封装了\
    \ XMLHttpRequest。如果 HTTP GET 请求成功，我们发射其内容并完成序列（我们的 Observable 只会产生一个结果）。否则，我们发射一个错误。\n\
    \n重要的是：Observable 在有观察者订阅它们之前不会执行任何操作。让我们来解决这个问题：\n\n```javascript\n// 订阅观察者到\
