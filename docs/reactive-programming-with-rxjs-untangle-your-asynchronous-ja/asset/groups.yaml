- md: "\nMy son, Adrià. You were born while I was writing this book, and you have\
    \ changed the meaning of life for me. You've already taught me so much in such\
    \ little time, and I can't wait to see what's next.\n\nFinally, Jen, the love\
    \ of my life. You have had infinite patience and supported me while I wrote a\
    \ book in one of the busiest periods of our life so far. You are an inspiration\
    \ to me and you make me a better human being in every way. You are my star.\n\n\
    Sergi Mansilla\n\nBarcelona, December 2015\n\n# Preface\n\nReactive programming\
    \ is taking the software world by storm. This book combines the reactive programming\
    \ philosophy with the possibilities of JavaScript, and you'll learn how to apply\
    \ reactive techniques to your own projects. We will focus on reactive programming\
    \ to manage and combine streams of events. In fact, we'll cover how to make entire\
    \ real-world, concurrent applications just by declaring transformations on your\
    \ program's events.\n\nMost software today deals with data that's available only\
    \ over time: websites load remote resources and respond to complex user interactions,\
    \ servers are distributed across multiple physical locations, and people have\
    \ mobile devices that they expect to work at all times, whether on high-speed\
    \ Wi-Fi or spotty cellular networks. Any serious application involves moving asynchronous\
    \ parts that need to be efficiently coordinated, and that's very hard with today's\
    \ programming techniques. On top of that, we have what's always been here: servers\
    \ crashing, slow networks, and software bugs we have to deal with.\n\nWe can't\
    \ afford to keep programming the applications we always have. It worked for a\
    \ while, but now it's time for a new approach.\n\n# New World, Old Methods\n\n\
    In recent years JavaScript has become the most ubiquitous language in the world\
    \ and now powers the mission-critical infrastructure of businesses such as Walmart\
    \ and Netflix, mobile operating systems such as Firefox OS, and complex popular\
    \ applications such as Google Docs.\n\nAnd we're still using good of imperative-style\
    \ programming to deal with problems that are essentially asynchronous. This is\
    \ very hard.\n\nJavaScript developers see the language's lack of threads as a\
    \ feature, and we usually write asynchronous code using callbacks, promises, and\
    \ events.\n\n- 1. http://venturebeat.com/2012/01/24/why-walmart-is-using-node-js/,\
    \ http://techblog.netflix.com/2014/06/scale-and-performance-of-large.html\n\n\
    as we keep adding more concurrency to our applications, the code to coordinate\
    \ asynchronous flows becomes unwieldy. Current mechanisms have serious shortcomings\
    \ that hinder the developer's productivity and make for fragile applications.\n\
    \nHere's a quick rundown of the current mechanisms for handling asynchronous operations,\
    \ along with their problems.\n\n# Callback Functions\n\nA `callback` is a function\
    \ (A) passed as a parameter to another function (B) that performs an asynchronous\
    \ operation. When (B) is down, it `calls back` (A) with the results of the operation.\
    \ Callbacks are used to manage asynchronous flows such as network I/O, database\
    \ access, or user input.\n\n```\nintro/callback_example.js\nfunction B(callback)\
    \ {\n  // operation that takes some time\n  callback('Done!');\n}\n\nfunction\
    \ A(message) {\n  console.log(message);\n}\n```\n\n// Execute `B` with `A` as\
    \ a callback\nB(A);\n\nCallbacks are easy to grasp and have become the default\
    \ way of handling asynchronous data flows in JavaScript. But this simplicity comes\
    \ at a price. Callbacks have the following drawbacks:\n\n- * Callback hell. It's\
    \ easy to end up with lots of nested callbacks when handling highly asynchronous\
    \ code. When that happens, code stops being linear and becomes hard to reason\
    \ about. Whole applications end up passed around in callbacks, and they become\
    \ difficult to maintain and debug.\n\n- * Callbacks can run more than once. There's\
    \ no guarantee the same callback will be called only once. Multiple invocations\
    \ can be hard to detect and can result in errors and general mayhem in the application.\n\
    \n- * Callbacks change error semantics. Callbacks break the traditional try/catch\
    \ mechanism and rely on the programmer to check for errors and pass them around.\n\
    \n- * Currency gets increasingly complicated.* Combining interdependent results\
    \ of multiple asynchronous operations becomes difficult. It requires us to keep\
    \ track of the state of each operation in temporal variables, and then delegate\
    \ them to the final combination operation in the proper order.\n\n# Promises\n\
    \nPromises came to save us from callbacks. A promise represents the result of\
    \ an asynchronous operation. In promise-based code, calling an asynchronous function\
    \ immediately returns a \"promise\" that will eventually be either *resolved*\
    \ with the result of the operation or *rejected* with an error. In the meantime,\
    \ the *pending* promise can be used as a placeholder for the final value.\n\n\
    Promises usually make programs more clear by being closer to synchronous code,\
    \ reducing the need for nesting blocks and keeping track of less state.\n\nUnfortunately,\
    \ promises are not a silver bullet. They're an improvement over callbacks, but\
    \ they have a major shortcoming: they only yield a single value. That makes them\
    \ useless for handling recurrent events such as mouse clicks or streams of data\
    \ coming from the server, because we would have to create a promise for each separate\
    \ event instead of creating a promise that handles the stream of events as it\
    \ comes.\n\n# Event Emitters\n\nWhen we emit an event, event listeners are subscribed\
    \ to it will fire. Using events is a great way to decouple functionality, and\
    \ in JavaScript, event programming is common and generally a good practice.\n\n\
    But, you guessed it, event listeners come with their own set of problems, to:\n\
    \n- * Events side effects.* Event listener functions always ignore their return\
    \ values, which forces the listener to have side effects if it wants to have any\
    \ impact in the world\n- * Events are not first-class values.* For example, a\
    \ series of click events can't be passed as a parameter or manipulated as the\
    \ sequence actually is\n- * It is easy to miss events if we start listening too\
    \ late.* An infamous example of that is the first version of streams interface\
    \ in Node.js, which would often emit its data before listeners had time to listen\
    \ to it, losing forever\n\nSince these mechanisms are what we've always used to\
    \ manage concurrency, it might be hard to think of a better way. But in this book\
    \ I'll show you one: reactive programming\n\n# What Is Reactive Programming?\n\
    \nReactive programming is a programming paradigm that encompasses many concepts\
    \ and techniques. In this book I'll focus particularly on creating, transforming,\
    \ and reacting to streams of data. Mouse clicks, network requests, arrays of strings—all\
    \ these can be expressed as streams to which we can \"react\" as they publish\
    \ new values\n\nReactive programming focuses on propagating changes without having\
    \ to explicitly specify how propagation happens. This allows us to state what\
    \ our code should do, without having to code every step to do it. This results\
    \ in a more reliable and maintainable approach to building software.\n\n# What\
    \ Is RxJS?\n\nRxJS is a JavaScript implementation of the Reactive Extensions,\
    \ or Rx is a reactive programming model originally created at Microsoft that allows\
    \ developers to easily compose asynchronous streams of data. It provides a common\
    \ interface to combine and transform data from widely different sources, such\
    \ as filesystems operations, user interaction, and social-network updates.\n\n\
    Rx started with an implementation for .NET, but today it has a well-maintained\
    \ open source implementation in every major language (and some minor ones). It\
    \ is becoming the standard to program reactive applications, and Rx's main data\
    \ type, the Observable, is being proposed for inclusion in ECMAScript 7 as an\
    \ integral part of JavaScript.\n\n# Who This Book Is For\n\nThis book is for developers\
    \ with some experience with JavaScript. You should be comfortable with closures\
    \ and higher-order functions, and you should understand the scope rules in JavaScript.\
    \ That being said, I try to explain the most complex language concepts we go through\
    \ in this book.\n\n- 2 https://rx.codlex.com/\n"
  mdcn: "\n\n我的儿子，Adrià。你是在我写这本书时出生的，你改变了我对我生命的意义。在如此短的时间里，你已经教会了我很多，我等不及要看到接下来会发生什么了。\n\
    \n最后是Jen，我生命的挚爱。在我们目前为止最忙碌的时期写书期间，你付出了无限的耐心并支持我。你是我的灵感来源，让我方方面面成为了一个更好的人。你是我的星。\n\
    \nSergi Mansilla\n\n巴塞罗那，2015年12月\n\n# 序言\n\n响应式编程正在席卷软件世界。本书将响应式编程哲学与 JavaScript\
    \ 的可能性相结合，你将学习如何将响应式技术应用于你自己的项目中。我们将关注如何使用响应式编程来管理和组合事件流。事实上，我们将涵盖如何仅通过对程序事件声明转换，就构建出整个真实世界的并发应用程序。\n\
    \n如今的大多数软件处理的是仅随时间产生的数据：网站加载远程资源并响应复杂的用户交互，服务器分布在多个物理位置，人们拥有的移动设备，并期望它们在任何时候都能工作，无论是在高速\
    \ Wi-Fi 还是信号不稳定的移动网络上。任何严肃的应用都涉及到需要高效协调的异步部分，而这用当今的编程技术是非常困难的。此外，我们还要面临一直存在的问题：服务器崩溃、网络缓慢以及我们必须处理的软件漏洞。\n\
    \n我们不能再按照过去的方式来编写应用程序了。它曾经运行了一段时间，但现在是时候采用新方法了。\n\n# 新世界，旧方法\n\n在过去的几年里，JavaScript\
    \ 已成为世界上最无处不在的语言，现在它为沃尔玛（Walmart）和 Netflix 等企业的关键任务基础设施、Firefox OS 等移动操作系统，以及\
    \ Google Docs 等复杂的流行应用程序提供支持。\n\n而我们仍然在使用大量的命令式编程风格来处理本质上是异步的问题。这非常困难。\n\nJavaScript\
    \ 开发者将语言缺乏线程视为一种特性，我们通常使用回调（callbacks）、承诺（promises）和事件来编写异步代码。\n\n- 1. http://venturebeat.com/2012/01/24/why-walmart-is-using-node-js/,\
    \ http://techblog.netflix.com/2014/06/scale-and-performance-of-large.html\n\n\
    随着我们不断向应用程序添加更多并发性，协调异步流的代码变得变得难以。。目前的机制具有严重的缺陷，阻碍了开发者的生产力，并导致应用程序变得脆弱。\n\n以下是处理异步操作的当前机制的快速回顾及其问题。\n\
    \n# 回调函数（Callback Functions）\n\n`callback`（回调）是一个作为参数传递给执行异步操作的函数 (B) 的函数 (A)。当\
    \ (B) 执行完成后，它会带上操作结果`calls back`（回调）(A)。回调用于管理异步流，例如网络 I/O、数据库访问或用户输入。\n\n```\n\
    intro/callback_example.js\nfunction B(callback) {\n  // 消耗一些时间的操作\n  callback('Done!');\n\
    }\n\nfunction A(message) {\n  console.log(message);\n}\n```\n\n// 使用 `A` 作为回调执行\
    \ `B`\nB(A);\n\n回调很容易理解，并已成为 JavaScript 处理异步数据流的默认方式。但这种简单性是有代价的。回调有以下缺点：\n\n\
    * 回调地狱（Callback hell）。在处理高度异步的代码时，很容易产生大量的嵌套回调。当这种情况发生时，代码不再是线性的，变得难以理解。\n\n整个应用程序最终在回调中到处传递，变得变得难以维护和调试。\n\
    \n* 回调可能会运行多次。无法保证同一个回调只被调用一次。多次调用很难被检测，并可能导致应用程序出现错误和一般的混乱。\n\n* 回调改变了错误语义。回调破坏了传统的\
    \ try/catch 机制，并依赖程序员检查错误并传递它们。\n\n* *并发性变得越来越复杂*。组合多个异步操作的相互依赖的结果变得非常困难。这要求我们在时序变量中跟踪每个操作的状态，然后按照正确的顺序将它们委托给最终的组合操作。\n\
    \n# 承诺（Promises）\n\nPromises 的出现将我们从回调中救出来。一个 promise（承诺）代表异步操作的结果。在基于 promise\
    \ 的代码中，调用异步函数立即返回一个“promise”，该承诺最终将通过操作的结果被*resolved*（解析），或通过一个错误被*rejected*（拒绝）。在此期间，*pending*（待定）状态的\
    \ promise 可以用作最终值的占位符。\n\nPromises 通常通过更接近同步代码使程序更加清晰，减少了对嵌套块的需求并减少了状态的跟踪。\n\n\
    遗憾的是，promise 并不是万灵药。它们是对回调的改进，但它们有一个主要的缺点：它们只能产生单个值。这使得它们在处理鼠标点击或来自服务器的数据流等循环事件时变得毫无用处，因为我们必须为每个单独事件创建一个\
    \ promise，而不是创建一个处理随之而至的事件流的 promise。\n\n# 事件发射器（Event Emitters）\n\n当我们发射一个事件时，订阅了它的事件监听器就会触发。使用事件是解耦功能的极方法，在\
    \ JavaScript 中，事件编程很常见且通常是良好的做法。\n\n但是，正如你猜的，事件监听器也有它们自己的问题：\n\n* 事件副作用。事件监听器函数总是忽略它们的返回值，这迫使监听器如果想对世界产生任何影响，就必须产生副作用\n\
    * 事件不是一等公民值。例如，一系列点击事件无法作为参数传递或像实际序列那样进行操作\n* * 如果我们开始监听得太晚，很容易错过事件*。一个著名的例子是\
    \ Node.js 版本的流 接口，它经常会在监听器准备好之前发布数据，导致数据永久丢失\n\n由于这些机制是我们一直以来用来管理并发的方式，可能很难想到更好的方法。但在本书中，我将向你展示一种：响应式编程\n\
    \n# 什么是响应式编程？\n\n响应式编程包含许多概念和技术的编程范式。在本书中，我将特别关注创建、转换和响应数据流。鼠标点击、网络请求、字符串数组——这些都可以表示为流，我们在它们发布新值时对其进行“响应”。\n\
    \n响应式编程关注传播变化而无需显式指定如何传播。这允许我们说明代码应该做什么，而无需编写实现它的每一步。这构建了一种更可靠、更容易维护的方法。\n\n#\
    \ 什么是 RxJS？\n\nRxJS 是 Reactive Extensions（Rx）的 JavaScript 实现，Rx 是最初由微软创建的响应式编程模型，允许开发者轻松组合异步数据流。它提供了一个通用接口来组合和转换来自不同来源的数据，例如文件系统操作、用户交互和社交网络更新。\n\
    \nRx 起于 .NET，但现在每个主流语言（以及一些语言语言都有良好的开源实现。它正成为编写响应式应用程序的标准，Rx 的主要数据类型 Observable\
    \ 被提议作为 JavaScript 的一部分纳入 ECMAScript 7。\n\n# 本书适用于\n\n本书适用于具有一定经验的开发者。你应该熟悉闭包和高阶函数，并理解\
    \ JavaScript 的作用域规则。尽管如此，我仍尝试解释书中涉及的最复杂的语言概念。\n\n"
