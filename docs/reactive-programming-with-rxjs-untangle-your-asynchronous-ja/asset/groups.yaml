  - "[PAGE 48]\n\nThis is the placeholder div element that Leaflet will use to render\
    \ our map.\n\nThat's a helper function we use to load JSON content.\n\nWe initialize\
    \ the Leaflet map by setting the coordinates to the center of Los Angeles (plenty\
    \ of earthquakes there!) with a reasonable zoom level.\n\nWe tell Leaflet to set\
    \ the default tile set for our map. The tile is just a “theme” for our map.\n\n\
    Finally, we load our code after the DOM and the map have been initialized.\n\n\
    # Retrieving Earthquake Locations\n\nNow our HTML is ready, we can write the logic\
    \ for our application. First we need to know what kind of data we get and what\
    \ data we need to represent earthquakes on a map.\n\nThe JSON data from the USGS\
