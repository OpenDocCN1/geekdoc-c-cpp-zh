    \n## Purity and the Observable\n\nAn Observable pipeline is a group of operators\
    \ chained together, where each takes an input and returns an output. In RxJS,\
    \ we strive to keep our pipelines \"pure.\" A pure function always returns the\
    \ same output for the same input and has no side effects. This makes our code\
    \ easier to test, debug, and reason about.\n\nWhen we introduce side effects—like\
    \ modifying an external variable or making an API call—inside our operators, we\
    \ lose these benefits. The example in the previous section demonstrated how sharing\
    \ external state can lead to unpredictable behavior.\n\n## Avoiding External State\n\
    \nIn the following example we count the even numbers interval has yielded so far.\
    \ We do that by creating an Observable:\n\n```javascript\nspaceship_reactive/state.js\n\
    var evenTicks = 0;\n\nfunction updateDistance(i) {\n  if (i % 2 === 0) {\n   \
    \ evenTicks += 1;\n  }\n  return evenTicks;\n}\n\nvar ticksObservable = Rx.Observable\n\
    \  .interval(1000)\n  .map(updateDistance)\n```\n\n```javascript\nticksObservable.subscribe(function()\
    \ {\n  console.log('Subscriber 1 - ' + evenTicks + ' so far');\n});\n```\n\nThis\
    \ is the output we get after the program has running for four seconds:\n\n- Subscriber\
    \ 1 - evenTicks: 1\n- Subscriber 1 - evenTicks: 1\n- Subscriber 1 - evenTicks:\
    \ 2\n- Subscriber 1 - evenTicks: 2\n\nNow, just for kicks, let's add another subscriber\
    \ to ticksObservable:\n\n```javascript\nspaceship_reactive/state.js\nvar evenTicks\
    \ = 0;\n\nfunction updateDistance(i) {\n  if (i % 2 === 0) {\n    evenTicks +=\
    \ 1;\n  }\n  return evenTicks;\n}\n\nvar ticksObservable = Rx.Observable\n  .interval(1000)\n\
    \  .map(updateDistance)\n```\n\n```javascript\nticksObservable.subscribe(function()\
    \ {\n  console.log('Subscriber 1 - ' + evenTicks + ' so far');\n});\n```\n\n```javascript\n\
    ticksObservable.subscribe(function() {\n  console.log('Subscriber 2 - ' + evenTicks\
    \ + ' so far');\n});\n```\n\nThe output is now the following:\n\n- Subscriber\
    \ 1 - evenTicks: 1\n- Subscriber 2 - evenTicks: 2\n- Subscriber 1 - evenTicks:\
    \ 2\n- Subscriber 2 - evenTicks: 2\n- Subscriber 1 - evenTicks: 3\n- Subscriber\
    \ 2 - evenTicks: 4\n- Subscriber 1 - evenTicks: 4\n- Subscriber 2 - evenTicks:\
    \ 4\n\nHold on a second—the even ticks count on Subscriber 2 is completely off!\
    \ It should always contain the same evenTicks count as Subscriber 1. The reason,\
    \ as you might have guessed, is that the Observable pipeline will run once for\
    \ each subscriber, increasing evenTicks twice.\n\nProblems caused by sharing external\
