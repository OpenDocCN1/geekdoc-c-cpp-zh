  - "[PAGE 126]\n\n# Revising Our main Function\n\nYou may have noticed that the code\
    \ on page 106 that the main function takes a parameter, responses, that we're\
    \ not using. These are the responses that come from drivers in the run function:\
    \ The drivers and the main function form a cycle (hence the name of the framework):\
    \ the output of main is the input of the drivers, and the output of the drivers\
    \ is the input for main. Remember, input and outputs are always Observables.\n\
    \nWe use JSONP to query Wikipedia, as we did in Chapter 2. We use JSONP instead\
    \ of HTTP to make it easier to run this example on our local computers, since\
    \ retrieving data from a different domain using HTTP causes browsers to block\
    \ these requests for security reasons. In almost any other situation, especially\
