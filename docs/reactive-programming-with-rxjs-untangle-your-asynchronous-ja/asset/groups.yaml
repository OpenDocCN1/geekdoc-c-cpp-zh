    }\n```\n\nThen, we create an Observable from arr and force it to emit all the\
    \ notifications by subscribing to it. In the code we measure the amount of time\
    \ it takes to emit all the notifications:\n\n```\nvar timeStart = Date.now();\n\
    Rx.Observable.from(arr).subscribe(\n  function onNext() {}\n  function onError()\
    \ {},\n  function onCompleted() {\n    console.log('Total time: ' + (Date.now()\
    \ - timeStart) + 'ms');\n  }\n);\n```\n\n+   \"Total time: 6ms\"\n\nSix milliseconds—not\
    \ bad! for uses Rx.Scheduler.currentThread internally, which schedules to run\
    \ after any current work is finished. Once it starts, it processes all the notifications\
    \ synchronously.\n\nNow let's change the Scheduler to Rx.Scheduler.default.\n\n\
    ```\nvar timeStart = Date.now();\nRx.Observable.from(arr, null, null, Rx.Scheduler.default).subscribe(\n\
    \  function onNext() {}\n  function onError() {},\n  function onCompleted() {\n\
    \    console.log('Total time: ' + (Date.now() - timeStart) + 'ms');\n  }\n);\n\
    ```\n\n+   \"Total time: 5337ms\"\n\nWow, our code runs around a thousand times\
    \ slower than the currentThread Scheduler. That's because the default Scheduler\
    \ runs each notification asynchronously. We can verify this by adding a simple\
    \ log statement after the subscription.\n\nUsing the currentThread Scheduler:\n\
    \n```\nRx.Observable.from(arr).subscribe( ... );\nconsole.log('Hi there!');\n\
    ```\n\n+   \"Total time: 8ms\n\"Hi there!\"\n\nUsing the default Scheduler:\n\n\
    ```\nRx.Observable.from(arr, null, null, Rx.Scheduler.timeout).subscribe( ...\
    \ );\nconsole.log('Hi there!');\n```"
  - "[PAGE 108]\n\n\"Hi there!\"\n\"Total time: 5423ms\"\n\nBecause the Observer using\
    \ the default Scheduler emits its items asynchronously, your console.log statement\
    \ (which is synchronous) is executed before the Observable even starting any notification.\
    \ With the currentScheduler, all notifications happen synchronously, so the console.log\
    \ statement gets executed only when the Observable has emitted all its notifications.\n\
    \nSo, Schedulers really can change how our Observables work. In our case, performance\
    \ really suffered from asynchronously processing a big array. But we can actually\
    \ use Schedulers to improve performance. For example, we can switch the Scheduler\
    \ on the fly before doing expenses on an Observable:\n\n```\narr\n.groupBy(function(value)\
    \ {\n  return value % 2 === 0;\n})\n.map(function(value) {\n  return value.observeOn(Rx.Scheduler.default);\n\
    })\n.map(function(groupedObservable) {\n  return expensiveOperation(groupedObservable);\n\
    });\n```\n\nIn the preceding code we group all the values in the array into two\
    \ groups: even and uneven values. groupBy returns an Observable that emits an\
    \ Observable for each group created. And here's the cool part: just before running\
    \ an expensive operation on the items in each grouped Observable, we use observeOn\
    \ to switch the Scheduler to the default one, so that the expensive operation\
    \ will be executed asynchronously, not blocking the event loop.\n\n# observeOn\
    \ and subscribeOn\n\nIn the previous section, we used the observeOn operator to\
    \ change the Scheduler in some Observables. observeOn and subscribeOn are instance\
    \ operators that return a copy of the Observable instance, but that use the Scheduler\
    \ we pass as a parameter.\n\nobserveOn takes a Scheduler and returns a new Observable\
    \ that uses that Scheduler. It will make every onNext call in the new Scheduler.\n\
    \nsubscribeOn forces the subscription and un-subscription (not the notifications)\
    \ of an Observable to run on a particular Scheduler. Like observeOn, it accepts\
    \ a Scheduler as a parameter. subscribeOn is useful when, for example,"
  - "[PAGE 109]\n\nwe're running in the browser and doing significant work in the\
    \ subscribe\nand we don't want to block the UI thread with it.\n\n# Basic Rx Sulers\n\
    \nLet's look a bit more in depth at the Schedulers we used. The ones RxJS\nsoperators\
    \ use most are immediate, default, and currentThread.\n\n# Immediate Scheduler\n\
    \nThe Immediate Scheduler emits notifications from the Observable synchronous-\n\
    ly, whenever an action is scheduled on the Immediate Scheduler, it will be\nexecuted\
    \ right away, blocking the thread. RxObservable.range is one of the\noperators\
    \ that use the immediate Scheduler internally:\n\n```\nconsole.log('Before subscription');\n\
    Rx.Observable.range(1, 5)\n  .do(function(a) {\n    console.log('Processing value',\
    \ a);\n  })\n  .map(function(value) { return value * value; })\n  .subscribe(function(value)\
    \ { console.log('Emitted', value); });\n```\n\n```\nconsole.log('After subscription');\n\
    < Before subscription\nProcessing value 1\nEmitted 1\nProcessing value 2\nEmitted\
    \ 4\nProcessing value 3\nEmitted 9\nProcessing value 4\nEmitted 16\nProcessing\
    \ value 5\nEmitted 25\nAfter subscription\n```\n\nThe program output happens in\
    \ the order we expect. Each console.log statement\nruns before the notification\
    \ of the current item.\n\n# When to Use It\n\nThe immediate Scheduler is very\
    \ well suited for Observables that execute pre-\ndictable and not-very-expensive\
    \ operations in each notification. Also, the\nObservable has to eventually call\
    \ onCompleted."
  - "[PAGE 110]\n\n# Default Scheduler\n\nThe default Scheduler runs actions asynchronously.\
    \ You can think of it as a rough equivalent of setTimeout with zero milliseconds\
    \ delay that keeps the order in the sequence. It uses the most efficient asynchronous\
    \ implementation available on the platform it runs (for example, process.nextTick\
    \ in Node.js or setTimeout in the browser).\n\nLet's take the previous example\
    \ with range and make it run on the default Scheduler. For this, we'll use the\
    \ observeOn operator:\n\n```\nconsole.log('Before subscription');\nRx.observable.range(1,\
    \ 5)\n  .do(function(value) {\n    console.log('Processing value', value);\n \
    \ })\n  .observeOn(Rx.Scheduler.default)\n  .map(function(value) { return value\
    \ * value; })\n  .subscribe(function(value) { console.log('Emitted', value); });\n\
    console.log('After subscription');\n```\n\n+   - Before subscription\nProcessing\
    \ value 1\nProcessing value 2\nProcessing value 3\nProcessing value 4\nProcessing\
    \ value 5\nAfter subscription\nEmitted 1\nEmitted 4\nEmitted 9\nEmitted 16\nEmitted\
    \ 25\n\nThere are significant differences in this output. Our synchronous console.log\
    \ statement runs immediately for every value, but we make the Observable run on\
    \ the default Scheduler, which yields each asynchronously. That means our log\
    \ statements in the do operator are processed before the squared values.\n\n#\
    \ When to Use It\n\nThe default Scheduler never blocks the loop, so it's ideal\
    \ for operations that involve time, like asynchronous requests. It can also be\
    \ used in Observables that never complete, because it doesn't block the program\
    \ while waiting for new notifications (which may never happen).\n\n# Current Thread\
    \ Scheduler\n\nThe current Scheduler is synchronous like the immediate Scheduler,\
    \ but in case we use recursive operators, it enqueues the actions to execute instead"
  - "[PAGE 111]\n\nof executing them right away. A recursive operator is an operator\
    \ that itself schedules another operator. A good example is repeat. The repeat\
    \ operator—if given no parameters—keeps repeating the previous Observable sequence\
    \ in the chain indefinitely.\n\nYou'll get in trouble if you call repeat on an\
    \ operator that uses the immediate Scheduler (such as return). Let's try this\
    \ by repeating the value 10 and use take only the first value of the repetition.\
    \ Ideally, the code would print 10 once and then exit:\n\n```\n// Be careful:\
    \ the code below will freeze your environment!\nRx.Observable.return(10).repeat().take(1)\n\
    .subscribe(function(value) {\n  console.log(value);\n});\n```\n\nError: Too much\
    \ recursion\n\nThis code causes an infinite loop. Upon subscription, return calls\
    \ onNext(10) and then onCompleted, which makes repeat again to return. Since it\
    \ is running on the immediate Scheduler, this process repeats itself, causing\
    \ an infinite loop and never getting to take.\n\nBut if we schedule return on\
    \ the currentThread Scheduler by passing it as the second parameter, we get this:\n\
    \n```\nvar scheduler = Rx.Scheduler.currentThread;\nRx.Observable.return(10, 10).repeat().take(1)\n\
    .subscribe(function(value) {\n  console.log(value);\n});\n```\n\n+   - 10\n\n\
    Now, when repeat resubscribes to return, the new onNext call will be queued because\
    \ the previous onCompleted is still hanging. repeat then returns a disposable\
    \ object to take, which calls onCompleted and cancels the repetition by disposing\
    \ repeat, and ultimately the call from subscribe returns. \n\nAs a rule of thumb,\
    \ currentThread should be used to iterate on large sequences and when using recursive\
    \ operators such as repeat.\n\n# When to Use It\n\nThe currentThread Scheduler\
    \ is useful for operations that involve recursive operators like repeat, and in\
    \ general for iterations that contain nested operators."
- md: "\n# Scheduling for Animations\n\nFor fast visual updates such as canvas or\
    \ DOM animations, we can either use the interval operator with a very low millisecond\
    \ value or we can make a Scheduler that uses a function like setTimeout internally\
    \ to schedule notifications.\n\nNeither approach is ideal. In both of them we\
    \ are throwing all updates at the browser, which may not be able to process them\
    \ quickly enough. That happens because the browser is trying to render a frame\
    \ and it receives instructions to render the next one, so it drops the frame to\
    \ keep the speed. The results are choppy animations. And we have enough of those\
    \ on the web.\n\nBrowsers have a native way to handle animations, and they provide\
    \ an API to use it called requestAnimationFrame, requestAnimationFrame allows\
    \ the browser to optimize performance by lining up animations at the most appropriate\
    \ time and helping us achieve smoother animations.\n\n# ## There's a Scheduler\
    \ for That\n\nRxDOM library comes with some extra Schedulers, one of which is\
    \ the requestAnimationFrame Scheduler.\n\nYes, you guessed it. We can use this\
    \ Scheduler to improve our spaceship game video. In it, we established a refresh\
    \ speed of 40ms—roughly 25 frames per second—by creating an interval Observable\
    \ at speed and then using combineLatest to update the game scene at the speed\
    \ by interval (because it is the fastest-updating Observable)... who knows how\
    \ many frames the browser is dropping by using this technique! We would get better\
    \ performance by using requestAnimationFrame.\n\nLet's create an Observable that\
    \ uses Rx.Scheduler.requestAnimationFrame as its Scheduler. Notice that it works\
    \ similarly to how the interval operator works:\n\n```javascript\nch_schedulers/starfield_raf.js\n\
    function animationLoop(scheduler) {\n  return Rx.Observable.generate(\n    0,\n\
    \    function() { return true; }, // Keep generating forever\n    function(x)\
    \ { return x + 1; }, // Increment internal value\n    function(x) { return x;\
    \ }, // Value to return on each notification\n    Rx.Scheduler.requestAnimationFrame);\
    \ // Schedule to requestAnimationFrame\n  )\n}\n```\n\nNow, wherever we were using\
    \ interval to animate graphics at 25 FPS, we can just use our animationLoop function.\
    \ So our Observable to paint stars, which looked like this before:\n\n```javascript\n\
    spaceship_reactive/spaceship.js\nvar StarStream = Rx.observable.range(1, 250)\n\
    .map(function() {\n  return {\n    x: parseInt(Math.random()) * canvas.width,\n\
    \    y: parseInt(Math.random()) * canvas.height,\n    size: Math.random() * 3\
    \ + 1\n  };\n})\n.toArray()\n.flatMap(function(arr) {\n  return Rx.Observable.interval(SPEED).map(function()\
    \ {\n    return arr.map(function(star) {\n      if (star.y >= canvas.height) {\n\
    \        star.y = 0;\n      }\n      star.y += 3;\n      return star;\n    });\n\
    \  });\n});\n```\n\nBecomes this:\n\n```javascript\nch_schedulers/starfield.js\n\
    var StarStream = Rx.observable.range(1, 250)\n.map(function() {\n  return {\n\
    \    x: parseInt(Math.random()) * canvas.width,\n    y: parseInt(Math.random())\
    \ * canvas.height,\n    size: Math.random() * 3 + 1\n  };\n})\n.toArray()\n.flatMap(function(arr)\
    \ {\n  return animationLoop().map(function() {\n    return arr.map(function(star)\
    \ {\n      if (star.y >= canvas.height) {\n        star.y = 0;\n      }\n    \
    \  star.y += 3;\n      return star;\n    });\n  });\n});\n```\n\nWhich gives us\
    \ a much smoother animation. As a bonus, the code is also cleaner!\n\n# ## Testing\
    \ with Schedulers\n\nTesting is perhaps one of the most compelling scenarios where\
    \ we can use Schedulers. So far in this book we've been coding our hearts out\
    \ without thinking about the consequences. But in a real-world software project,\
    \ we would be writing tests to make sure our code works as we intend.\n\nTesting\
    \ asynchronous code is hard. We usually run into one of these problems:\n\n- Simulating\
    \ asynchronous events is complicated and error prone. The whole point of having\
    \ tests is to avoid bugs and errors, but if your tests themselves have errors,\
    \ they're not helping.\n- If we want to accurately test time-based functionality,\
    \ automated testing becomes really slow. For example, if we need to accurately\
    \ test that an error is called after four seconds of timing to retrieve a remote\
    \ file, each test will take at least much time to run. If we run our test suite\
    \ continuously, impacts our development time.\n\n# ## The TestScheduler\n\nRxJS\
    \ gives us the TestScheduler, a TestScheduler designed to help with testing. TestScheduler\
    \ allows us to emulate time at our convenience and create deterministic tests,\
    \ where they are guaranteed to be 100% repeatable. Besides that, it allows us\
    \ to execute operations that would take a considerable amount of time and compress\
    \ them into an instant, while maintaining the test's accuracy.\n\nA TestScheduler\
    \ is a specialization of a VirtualScheduler. VirtualTimeSchedulers execute actions\
    \ in \"virtual\" instead of real time. Schedulers do go in a queue and are assigned\
    \ a moment in virtual time. The TestScheduler then runs the actions when its clock\
    \ advances. Because it is virtual, everything runs immediately, without having\
    \ to wait for the time specified.\n\nHere's an example:\n\n```javascript\nvar\
    \ onNext = Rx.ReactiveTest.next;\nQUnit.test(\"TestScheduler\", function(assert)\
    \ {\n  var scheduler = new Rx.TestScheduler();\n  var subject = scheduler.createObservable(\n\
    \    onNext(100, 'first'),\n    onNext(200, 'second'),\n    onNext(300, 'third')\n\
    \  );\n  var result = '';\n  subject.subscribe(function(value) {\n    result =\
    \ value;\n  });\n\n  scheduler.advanceBy(100);\n  assert.equal(result, 'first');\n\
    \n  scheduler.advanceBy(100);\n  assert.equal(result, 'second');\n\n  scheduler.advanceBy(100);\n\
    \  assert.equal(result, 'third');\n});\n```\n"
  mdcn: "\n\n# 动画调度\n\n对于像 canvas 或 DOM 动画这样的快速视觉更新，我们可以使用极低毫秒值的间隔操作符（interval），也可以创建一个内部使用\
    \ `setTimeout` 等函数来调度通知的调度器（Scheduler）。\n\n这两种方法都不是理想。在这两种方法中，我们都是将所有更新发送给浏览器，而浏览器可能无法足够快地处理它们。这是因为浏览器正在尝试渲染一帧，却收到了渲染下一帧的指令，因此它会丢弃帧以保持速度。结果就是动画卡顿。而网页上的这种情况已经够多了了。\n\
    \n浏览器有一种处理动画的原生方式，并提供了一个名为 `requestAnimationFrame` 的 API 来使用它。`requestAnimationFrame`\
    \ 允许浏览器在最合适的时间安排动画来优化性能，并帮助我们实现更流畅的动画。\n\n# ## 这有专门的调度器\n\nRxDOM 库自带了一些调度器，其中之一就是\
    \ `requestAnimationFrame` 调度器。\n\n是的，你猜对了。我们可以使用这个调度器来改进我们的飞船游戏视频。在游戏中，我们通过创建一个速度为间隔\
    \ Observable 建立了 40ms 的刷新率——大约每秒 25 帧——然后使用 `combineLatest` 按照间隔的速度更新游戏场景（因为它是更新最快的\
    \ Observable）……谁知道使用这种技术浏览器丢弃了多少帧！使用 `requestAnimationFrame` 我们将获得更好的性能。\n\n让我们创建一个使用\
    \ `Rx.Scheduler.requestAnimationFrame` 作为其调度器的 Observable。注意，它的工作原理与 `interval`\
    \ 操作符类似：\n\n```javascript\nch_schedulers/starfield_raf.js\nfunction animationLoop(scheduler)\
    \ {\n  return Rx.Observable.generate(\n    0,\n    function() { return true; },\
    \ // 无限生成\n    function(x) { return x + 1; }, // 增加内部值\n    function(x) { return\
    \ x; }, // 每次通知返回的值\n    Rx.Scheduler.requestAnimationFrame); // 调度到 requestAnimationFrame\n\
    \  )\n}\n```\n\n现在，我们在哪里使用 `interval` 以 25 FPS 的速率制作图形动画，我们只需要使用我们的 `animationLoop`\
    \ 函数即可。因此，我们之前绘制星星的 Observable 如下所示：\n\n```javascript\nspaceship_reactive/spaceship.js\n\
    var StarStream = Rx.observable.range(1, 250)\n.map(function() {\n  return {\n\
    \    x: parseInt(Math.random()) * canvas.width,\n    y: parseInt(Math.random())\
    \ * canvas.height,\n    size: Math.random() * 3 + 1\n  };\n})\n.toArray()\n.flatMap(function(arr)\
    \ {\n  return Rx.Observable.interval(SPEED).map(function() {\n    return arr.map(function(star)\
    \ {\n      if (star.y >= canvas.height) {\n        star.y = 0;\n      }\n    \
    \  star.y += 3;\n      return star;\n    });\n  });\n});\n```\n\n变成了这样：\n\n```javascript\n\
    ch_schedulers/starfield.js\nvar StarStream = Rx.observable.range(1, 250)\n.map(function()\
    \ {\n  return {\n    x: parseInt(Math.random()) * canvas.width,\n    y: parseInt(Math.random())\
    \ * canvas.height,\n    size: Math.random() * 3 + 1\n  };\n})\n.toArray()\n.flatMap(function(arr)\
    \ {\n  return animationLoop().map(function() {\n    return arr.map(function(star)\
    \ {\n      if (star.y >= canvas.height) {\n        star.y = 0;\n      }\n    \
    \  star.y += 3;\n      return star;\n    });\n  });\n});\n```\n\n这带给了我们更流畅的动画。此外，代码也更整洁了！\n\
    \n# ## 使用调度器进行测试\n\n测试可能是我们可以使用调度器的最引入人的场景之一。到目前为止，我们一直在尽命编写代码，而不考虑后果。但在真实的软件项目中，我们会编写测试来确保我们的代码按照预期工作。\n\
    \n测试异步代码是困难的。我们通常会遇到以下问题之一：\n\n- 模拟异步事件既复杂又容易出错。测试的目的是避免 bug 和错误，但如果你的测试本身有错误，它们就没有任何帮助。\n\
    - 如果我们想准确地测试基于时间的功能，自动化测试会变得非常慢。例如，如果我们需要准确测试在获取远程文件四秒后是否会调用错误，那么每个测试将至少花费大量时间运行。如果我们持续运行测试套件，将会影响我们的开发时间。\n\
    \n# ## TestScheduler\n\nRxJS 给了我们 `TestScheduler`，这是一个专门为帮助测试设计的 `TestScheduler`。`TestScheduler`\
    \ 允许方便地模拟时间并创建确定性的测试，这些测试保证是 100% 可重复的。此外，它允许我们执行需要大量时间的操作，并将其压缩到瞬间，同时保持测试的准确性。\n\
    \n`TestScheduler` 是 `VirtualScheduler` 的特化版本。`VirtualTimeSchedulers` 在“虚拟”时间而非真实时间内执行操作。调度器进入队列并被分配虚拟时间的一个时刻。然后\
    \ `TestScheduler` 在时钟推进时运行操作。由于它是虚拟的，所有操作都会立即运行，无需等待指定的时间。\n\n这是一个示例：\n\n```javascript\n\
    var onNext = Rx.ReactiveTest.next;\nQUnit.test(\"TestScheduler\", function(assert)\
    \ {\n  var scheduler = new Rx.TestScheduler();\n  var subject = scheduler.createObservable(\n\
    \    onNext(100, 'first'),\n    onNext(200, 'second'),\n    onNext(300, 'third')\n\
    \  );\n  var result = '';\n  subject.subscribe(function(value) {\n    result =\
    \ value;\n  });\n\n  scheduler.advanceBy(100);\n  assert.equal(result, 'first');\n\
    \n  scheduler.advanceBy(100);\n  assert.equal(result, 'second');\n\n  scheduler.advanceBy(100);\n\
    \  assert.equal(result, 'third');\n});\n```\n\n"
