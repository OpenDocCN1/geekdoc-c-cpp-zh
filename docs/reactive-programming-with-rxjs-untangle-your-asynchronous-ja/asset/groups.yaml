    \ problems in the future, we need to normalize the game's speed so that no Observable\
    \ can emit values faster than our chosen speed for the game.\n\nAnd yes, as you\
    \ have guessed, RxJS has an operator for that.\n\n# Avoid Drinking from the Firehose\n\
    \nThere is such thing as receiving data too fast. Most of the time we want all\
    \ the speed we can get, but depending on the frequency at which the Observable\
    \ streams values, we might want to drop some of the values we receive. We're now\
    \ in one of these scenarios. The speed at which we render things onscreen is proportional\
    \ to the speed of the fastest Observable we have. It turns out that our fastest\
    \ Observable is too fast for us, and we need to establish a constant update speed\
    \ in the game.\n\nsample is a method in Observable instances, given a time parameter\
    \ in milliseconds, returns an Observable that emits the last value emitted by\
