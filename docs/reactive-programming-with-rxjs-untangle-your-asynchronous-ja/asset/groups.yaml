    # Joe 提问：

    ### 什么是虚拟 DOM？


    文档对象模型（DOM）定义了 HTML 文档中元素的树形结构。每个 HTML 元素都是 DOM 中的一个节点，每个节点都可以通过节点的方法进行操作。


    DOM 最初是为了表示静态文档而创建的，而不是为了我们今天拥有的超动态网站。因此，当 DOM 树中的元素频繁更新时，它并没有被设计为具有良好的性能。这就是为什么当我们对
    DOM 进行更改时会产生性能损耗。


    虚拟 DOM 是用 JavaScript 实现的 DOM 表示。每当我们更改组件中的状态时，我们都会为该组件重新计算虚拟 DOM 树并与上一个进行比较。如果存在差异，我们就只渲染这些差异。这种方法非常快，因为比较
    JavaScript 对象非常快，而且我们只对“真实”DOM 做出绝对必要的更改。


    这种方法意味着我们可以编写代码，就像为更改生成了整个应用 UI 一样。我们不需要在 DOM 中跟踪状态。在后台，Cycle.js 会检查每次更新是否有任何不同之处，并高效地处理我们的渲染。


