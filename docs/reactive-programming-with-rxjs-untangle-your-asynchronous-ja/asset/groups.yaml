    \ 119\n\n# Acknowledgments\n\nI have many people to thank. There are those who\
    \ have helped the book and those who have helped me as a person. I couldn't have\
    \ done this without any of them. I would particularly like to thank:\n\nThe exceptional\
    \ people who came up with the Reactive Extensions library in the first place,\
    \ and the ones who expanded and evangelized it. This book would obviously not\
    \ exist without you: Erik Meijer, Matt Podwysacki, Bart Smet, Wes Dyer, Jafar\
    \ Husain, André Staltz, and many I I probably forgetting.\n\nThe folks at Pragmatic\
    \ Bookshelf. It has been a pleasure to work with you. Special thanks to Susannah\
    \ Pfaler, who has believed in the book since it was nothing but an idea. I was\
    \ also extremely lucky to have Rebecca Gulick as my editor: You have been professional,\
    \ attentive to my questions, and a joy to work with. I've been a fan of Pragmatic's\
    \ books for a long time, and it has been a privilege to read a Prag book myself.\
    \ And you, for both publishers, David Thomas and Andy Hunt, dont read and review\
    \ every book!\n\nThe brilliant technical reviewers. David Bock, Javier Collado\
    \ Cabeza, Fred Daoud, Iraqi Golazishvili, Zef Hemel, Rameshander Singh Jhaij,\
    \ Aaron Kalair, Daniel Lamb, Brian Schau, and Stephen Wolff, as well as Pragmatic\
    \ publishers David and Andy: This book is infinitely better thanks to all of you.\
    \ You each selflessly put time and energy into reviewing this book, complicating\
    \ errors and saving me from more than one embarrassing mistake. Any errors remaining\
    \ in the book are my own fault.\n\nTo my friends. The ones who are always there,\
    \ no matter the time and the distance: you know who you are. Thanks for the laughs,\
    \ the support and love.\n\nMy parents, Narcis Mansilla and Joana Molins. You are\
    \ the guides and role models. You never ceased to believe in me and always encouraged\
    \ me to take bigger challenges. You bought me my first computer at a time when\
    \ you struggled to pay the bills. That started all, and I owe you everything.\n"
