    })\n.forEach(function(str) {\n  console.log(str);\n});\n```\n\nLet's suppose stringArray\
    \ is an array with 1,000 strings that we want to convert to uppercase and then\
    \ filter the ones that contain anything other than alphabet characters (or no\
    \ letters at all). Then we want to print each string of the resulting array to\
    \ the console.\n\nThis is what happens behind the scenes:\n\n+   Iterate through\
