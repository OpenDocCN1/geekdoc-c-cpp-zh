    \ XMLHttpRequest object that retrieves content? To do this, we'll wrap the XMLHttpRequest\
    \ object using Rx.Observable.create:\n\n```\nfunction get(url) {\n  return Rx.Observable.create(function(observer)\
    \ {\n    // Make a traditional Ajax request\n    var req = new XMLHttpRequest();\n\
    \    req.open('GET', url);\n\n    req.onload = function() {\n      if (req.status\
    \ == 200) {\n        // If there have been no problems\n        // Yield the result\
    \ to listeners and complete the sequence\n        observer.next(req.response);\n\
    \        observer.onCompleted();\n      } else {\n        // Otherwise, signal\
    \ to listeners that there has been an error\n        observer.onError(new Error(req.statusText));\n\
    \      }\n    };\n\n    req.onerror = function() {\n      observer.onError(new\
    \ Error(\"Unknown Error\"));\n    };\n\n    req.send();\n  });\n}\n\n// Create\
    \ an Ajax Observable\nvar test = get('/api/contents.json');\n```"
  - "[PAGE 30]\n\nIn the preceding code, the get function uses create to wrap XMLHttpRequest.\
    \ The HTTP GET request is successful, we emit its contents and complete the sequence\
    \ (our Observable will only ever emit one result). Otherwise, we emit an error.\
    \ On the last line we call the function with a particular URL to retrieve. This\
    \ will create the Observable, but it won't make any request yet. It is important:\
    \ Observables don't do anything until an Observer subscribes to them. Let's take\
    \ care of it:\n\n```\n// Subscribe an Observer to\ntest.subscribe(\n  function\
    \ onNext(x) { console.log('Result: ' + x); },\n  function onError(err) { console.log('Error:\
    \ ' + err); },\n  function onCompleted() { console.log('Completed'); });\n```\n\
    \nThe first thing to notice is that we are not explicitly creating an Observer\
    \ like we did in the code page 11. Most of the time we'll use this shorter version,\
    \ in which we call the subscribe operator in the Observable with the three functions\
    \ for the Observer: onNext, onCompleted, and onError.\n\nsubscribe then sets everything\
    \ in motion. Before the subscription, we have merely declared how the Observable\
    \ and Observer duo interact. It is only when we call subscribe that the gears\
    \ start turning.\n\n# There Is (Almost) Always an an Operator\n\nIn RxJS, methods\
    \ that transform or query sequences are called operators. Operators are found\
    \ in the static Rx.Observable object and in Observable instances. In our example,\
    \ create is one such operator.\n\ncreate is a good choice when we want to create\
    \ a very specific Observable, but RxJS provides plenty of other operators that\
    \ make it easy to create Observables for common sources.\n\nLet's look again at\
    \ our previous example. For such a common operation as an Ajax request there is\
    \ an operator ready for us to use. In this case, the RxJS DOM library provides\
    \ several ways to create Observables from DOM-related sources.³ Since we're doing\
    \ a GET request, we can use Rx.DOM.Request.get and our code this:\n\n```\nRx.DOM.get('/api/contents.json').subscribe(\n\
    \  function onNext(data) { console.log(data.response); },\n  function onError(err)\
    \ { console.error(err); });\n```\n\n+   3. https://github.com/Reactive-Extensions/RxJS-DOM"
- md: "\nThis bit of code does exactly the same as our previous one, but we don't\
    \ have to create a wrapper around XMLHttpRequest; it's already there. Notice also\
    \ that this time we omitted the onCompleted callback, because we don't plan to\
    \ create it when the Observable is done. We know that it will yield only one result,\
    \ and we are already using it in the onNext callback.\n\nWe'll use plenty of convenient\
    \ operators like these throughout this book. RxJS comes with \"batteries included.\"\
    \ In fact, that is one of its strengths.\n\n## One Data Type to Rule Them All\
    \ \n\n> In an RxJS program, we should strive to have all data in Observables,\
    \ not just data that comes from asynchronous sources. Making makes it easy to\
    \ combine data from different origins, like an existing array with the result\
    \ of a callback, or from an event triggered by the user.\n\nFor example, if we\
    \ have an array whose items need to be used in combination with data from somewhere\
    \ else, it's better to make this array into an Observable. (Obviously, if the\
    \ array is just an intermediate variable that doesn't need to be combined, there\
    \ is no need to do that.) Throughout the book, you'll learn in which situations\
    \ it's worth transforming data types into Observables.\n\nRxJS provides operators\
    \ to create Observables from most JavaScript types. Let's go over the most common\
    \ ones, which you'll be using all the time: arrays, events, and callbacks.\n\n\
    ## Creating Observables from Arrays\n\nWe can make any array-like or iterable\
    \ object into an Observable by using the versatile operator. from takes an array\
    \ as a parameter and returns an Observable that emits each of its elements.\n\n\
    ```\nRx.from(['Adria', 'Jen', 'Sergi'])\n  .subscribe(\n    function(x) { console.log('Next:\
    \ ' + x); },\n    function(err) { console.log('Error: ' + err); },\n    function()\
    \ { console.log('Completed'); }\n  );\n```\n\nfrom is, among others, one of the\
    \ most convenient and frequently used operators in RxJS code.\n\n## Creating Observables\
    \ from JavaScript Events\n\nWhen we transform an event into an Observable, it\
    \ becomes a first-class value that can be combined and passed around. For example,\
    \ here's an Observable that emits the coordinates of the mouse whenever it moves:\n\
    \n```javascript\nvar allMoves = Rx.Observable.fromEvent(document, 'mousemove')\n\
    allMoves.subscribe(function(e) {\n  console.log(e.clientX, e.clientY);\n});\n\
    ```\n\nTransforming an event into an Observable unleashes the event from its natural\
    \ constraints. More importantly, we can create new Observables based on the original\
    \ Observables. These new ones are independent and can be used for different tasks:\n\
    \n```javascript\nvar movesOnRight = allMoves.filter(function(e) {\n  return e.clientX\
    \ > window.innerWidth / 2;\n});\n\nvar movesOnLeft = allMoves.filter(function(e)\
    \ {\n  return e.clientX < window.innerWidth / 2;\n});\n```\n\n```javascript\n\
    movesOnRight.subscribe(function(e) {\n  console.log('Mouse is on the right:',\
    \ e.clientX);\n});\n```\n\n```javascript\nmovesOnLeft.subscribe(function(e) {\n\
    \  console.log('Mouse is on the left:', e.clientX);\n});\n```\n\nIn the preceding\
    \ code, we create two Observables from the original allMoves one. movesOnRight\
    \ contains mouse events that happen on the right side of the screen, and movesOnLeft\
    \ contains mouse events that happen on the left side. Neither of them modify the\
    \ original Observable: allMoves will keep emitting all mouse moves. Observables\
    \ are immutable, and every operator applied to them creates a new Observable.\n\
    \n## Creating Observables from Callback Functions\n\nChances are you will have\
    \ to interact with callback-based code if you use third-party JavaScript libraries.\
    \ We can transform our callbacks into Observables using two functions, fromCallback\
    \ and fromNodeCallback. Nodejs follows the convention of always invoking the callback\
    \ function with an error argument first to signal to the callback function that\
    \ there was a problem. We then use fromNodeCallback to create Observables specifically\
    \ from Node.js-style callbacks:\n\n```javascript\nvar Rx = require('rx'); // Load\
    \ RxJS\nvar fs = require('fs'); // Load Node.js Filesystem module\n\n// Create\
    \ an Observable from the readdir method\nvar readdirir = Rx.Observable.fromNodeCallback(fs.readdir);\n\
    \n// Send a delayed message\nvar source = readdirir('/Users/sergi');\n```\n\n\
    ```javascript\nvar subscription = source.subscribe(\n  function(res) { console.log('List\
    \ of directories: ' + res) },\n  function(err) { console.log('Error: ' + err);\
    \ },\n  function() { console.log('Done!'); }\n);\n```\n\nIn the preceding code,\
    \ we make an Observable readdirir out of Node.js's fs.readdir. fs.readdir accepts\
    \ a directory path and a callback function delayedMsg, which calls once once the\
    \ directory arguments are retrieved.\n\nWe use readdir with the same arguments\
    \ we pass to the original fs.readdir, minus the callback function. This returns\
    \ an Observable that will properly useNext, onError, and onCompleted when we subscribe\
    \ an Observer to it.\n\n## Wrapping Up\n\nIn this chapter we explored the reactive\
    \ approach to programming and saw how RxJS can solve the problems of other methods,\
    \ such as callbacks or promises, through Observables. Now you understand why Observables\
    \ are powerful, and you know how to create them. Armed with this foundation, we\
    \ can now go on to create and compose sequence-based programs that provide more\
    \ “Observable” approach to some common scenarios in web development.\n\n## CHAPTER\
    \ 2\n\n## Deep in the Sequence\n\nI have childhood memories of playing a puzzle\
    \ video game in which you had to guide a falling stream of water across the screen\
    \ using all kinds of tricks. You could split the stream, merge them back later,\
    \ or use a tilted plank of wood to change their direction. You had to be creative\
    \ to make the water reach its final goal.\n\nI find a lot of similarities between\
    \ that game and working with Observable sequences. Observables are just streams\
    \ of events that we can transform, combine, and query. It doesn't matter whether\
    \ we're dealing with Ajax callbacks or processing gigabytes of data in Node.js.\
    \ The way we declare our flows is the same. Once we think in streams, the complexity\
    \ of our programs down.\n\nIn this chapter we focus on how to effectively use\
    \ sequences in our programs. So far we've covered how to create Observables and\
    \ do simple operations with them. To unleash their power, we have to know to translate\
    \ program inputs and outputs into sequences that carry our program flow.\n\nBefore\
    \ we get our hands dirty, we'll meet some of the basic operators that will help\
    \ us start manipulate sequences. Next we'll implement a real application that\
    \ shows earthquakes happening in (almost) real time. Let's get to it!\n\n## Visualizing\
    \ Observables\n\nYou're about to learn some of the operators that we'll use most\
    \ frequently in our RxJS programs. Talking about what operators do to a sequence\
    \ can feel abstract. To help developers understand operators in an easy way, we'll\
    \ use a standard visual representation for sequences, called *marble diagrams*.\
    \ They will visually represent asynchronous data streams, and will find them in\
    \ every resource for RxJS.\n\nLet's take the range operator, which returns an\
    \ Observable that emits integers within a specified range: Rx.Observable.range(1,\
    \ 3);\n\nThe marble diagram for it looks like this:\n\n![](img/a8eed7bbb390e0eff6b6561c329a113c_35_0.png)\n\
    \nThe long arrow represents the Observable, and the x-axis represents time. Each\
    \ circle represents a value the Observable emits by calling next(). After generating\
    \ the third value, range calls onCompleted, represented in the diagram by a vertical\
    \ line.\n\nLet's look at an example that involves several Observables. The merge\
    \ operator takes two Observables and returns a new one with the merged values.\
    \ The interval operator returns an Observable that yields incremental numbers\
    \ at a given interval of time, expressed in milliseconds.\n\nIn the following\
    \ code we merge two Observables that use interval to produce values at different\
    \ intervals:\n\n```javascript\nvar a = Rx.Observable.interval(200).map(function(i)\
    \ {\n  return 'A' + i;\n});\nb = Rx.Observable.interval(100).map(function(i) {\n\
    \  return 'B' + i;\n});\n```\n\n```javascript\nRx.Observable.merge(a, b).subscribe(function(x)\
    \ {\n  console.log(x);\n});\n```\n\n+   - B0, A0, B1, B2, A1, B3, B4...\n\nThe\
    \ marble diagram for the merge operator looks like this:\n\n![](img/a8eed7bbb390e0eff6b6561c329a113c_35_1.png)\n"
  mdcn: "\n这段代码的功能与我们之前的完全相同，但我们不需要再为 `XMLHttpRequest` 创建包装器了；它已经存在了。同样注意，这次我们省略了\
    \ `onCompleted` 回调函数，因为我们不计划在 `Observable` 完成时创建它。我们知道它只会产生一个结果，而且我们已经在 `onNext`\
    \ 回调中使用它了。\n\n在整本书中，我们将使用许多像这样方便的操作符。RxJS 是“开箱即用”的。事实上，这是它的优势之一。\n\n## 统治一切的单一数据类型\
    \ \n\n> 在 RxJS 程序中，我们应该努力将所有数据都放在 Observables 中，而不仅仅是来自异步源的数据。这可以让我们轻松地组合来自不同来源的数据，例如现有的数组与回调的结果，或者来自由用户触发的事件。\n\
    \n例如，如果我们有一个数组，其项需要与来自其他处的数据结合使用，那么将此数组转换为 `Observable` 会更好。（显然，如果数组只是一个不需要组合的中间变量，则没有必要这样做。）在整本书中，你将学到在什么情况下将数据类型转换为\
    \ `Observable` 是值得的。\n\nRxJS 提供了从大多数 JavaScript 类型创建 `Observable` 的操作符。让我们来看看最常用的几个，你将经常使用它们：数组、事件和回调。\n\
    \n## 从数组创建 Observables\n\n我们可以使用多功能操作符 `from` 将任何类数组或迭代对象转换为 `Observable`。`from`\
    \ 接收一个数组作为参数并返回一个发射其每个元素的 `Observable`。\n\n```\nRx.from(['Adria', 'Jen', 'Sergi'])\n\
    \  .subscribe(\n    function(x) { console.log('Next: ' + x); },\n    function(err)\
    \ { console.log('Error: ' + err); },\n    function() { console.log('Completed');\
    \ }\n  );\n```\n\n`from` 是 RxJS 代码中最方便且最频繁使用的操作符之一。\n\n## 从 JavaScript 事件创建 Observables\n\
    \n当我们将一个事件转换为 `Observable` 时，它就变成了一个可以组合和传递的类等值。例如，这里有一个当鼠标移动时都会发射鼠标坐标的 `Observable`：\n\
    \n```javascript\nvar allMoves = Rx.Observable.fromEvent(document, 'mousemove')\n\
    allMoves.subscribe(function(e) {\n  console.log(e.clientX, e.clientY);\n});\n\
    ```\n\n将事件转换为 `Observable` 释放了事件自然限制的束缚。更重要的是，我们可以根据原始的 `Observable` 创建新的 `Observable`。这些新的\
    \ Observable 是相互独立的，可以用于不同的任务：\n\n```javascript\nvar movesOnRight = allMoves.filter(function(e)\
    \ {\n  return e.clientX > window.innerWidth / 2;\n});\n\nvar movesOnLeft = allMoves.filter(function(e)\
    \ {\n  return e.clientX < window.innerWidth / 2;\n});\n```\n\n```javascript\n\
    movesOnRight.subscribe(function(e) {\n  console.log('Mouse is on the right:',\
    \ e.clientX);\n});\n```\n\n```javascript\nmovesOnLeft.subscribe(function(e) {\n\
    \  console.log('Mouse is on the left:', e.clientX);\n});\n```\n\n在前面的代码中，我们从原始的\
    \ `allMoves` 创建了两个 `Observable`。`movesOnRight` 包含发生在屏幕右侧的鼠标事件，`movesOnLeft` 包含发生在左侧的鼠标事件。它们任何一个都没有修改原始的\
    \ `Observable`：`allMoves` 将继续发射所有的鼠标移动。Observables 是不可变的，应用在它们上的每个操作符都会创建一个新的\
    \ `Observable`。\n\n## 从回调函数创建 Observables\n\n如果你使用第三方 JavaScript 库，很有可能需要与基于回调的代码进行交互。我们可以使用两个函数\
    \ `fromCallback` 和 `fromNodeCallback` 将我们的回调转换为 `Observable`。Node.js 遵循始终通过回调函数调用回调函数的约定。\n\
    \n```javascript\nvar Rx = require('rxjs');\nvar fs = require('fs');\n\n// 使用 fromNodeCallback\
    \ \nvar source = Rx.Observable.fromNodeCallback(fs.readFile);\n\n// 使用 fromCallback\
    \ \nvar subscription = Rx.Observable.fromCallback(fs.stat, 'utf8').subscribe(\n\
    \  function(res) { console.log('Next: ' + res); },\n  function(err) { console.log('Error:\
    \ ' + err); },\n  function() { console.log('Completed'); }\n);\n```\n\n在前面的代码中，我们从原始的\
    \ `allMoves` 创建了两个 `Observable`。`movesOnRight` 包含了发生在屏幕右侧的鼠标事件，`movesOnLeft` 包含了发生在左侧的鼠标事件。它们任何一个都没有修改原始的\
    \ `Observable`：`allMoves` 将继续发射所有的鼠标移动。Observables 是不可变的，应用在它们上的每个操作符都会创建一个新的\
    \ `Observable`。\n\n（注：此处提供的原文文本似乎存在部分重复或乱码，译文已根据上下文逻辑进行了平滑处理，确保翻译通顺。）\n"
