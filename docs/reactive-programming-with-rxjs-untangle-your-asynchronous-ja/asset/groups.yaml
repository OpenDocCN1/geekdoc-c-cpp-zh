    给我的朋友们。那些无论时间多远都在身边的人：你们知道自己是谁。感谢你们的笑、支持和爱。\n\n我的父母，Narcis Mansilla 和 Joana Molins。你们是我的指南和榜样。你们从未停止相信我，并鼓励我接受更大的挑战。在你们为付账单感到困难时，为我买了第一台电脑。那开始了一切，我感激你们。\n\
