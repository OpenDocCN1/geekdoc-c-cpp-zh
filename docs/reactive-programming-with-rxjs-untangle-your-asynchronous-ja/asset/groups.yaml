    \n迭代器接口非常简单。它需要两个方法：`next()` 用于获取序列中的项，`hasNext()` 用于检查序列中是否还有剩余项。\n\n下面是我们如何编写一个迭代器，它操作一个数字数组，并仅产生除参数\
