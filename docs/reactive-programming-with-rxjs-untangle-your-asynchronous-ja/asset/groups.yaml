  - '[PAGE 19]


    # CHAPTER 1


    # The Reactive Way


    The real world is pretty messy: events happen in random order, applications crash,
    and networks fail. Few applications are completely synchronous, and writing asynchronous
    code is necessary to keep applications responsive. Most of the time it''s downright
    painful, but it really doesn''t have to be.


    Modern applications need super-fast responses and the ability to process data
    from different sources at the same time without missing a beat. Current techniques
    won''t get us there because they don''t scale—code becomes exponentially complex
    as we add concurrency and application state. They get the job done only at the
    expense of a considerable mental load on the developer, and that leads to bugs
    and complexity in our code.


    This chapter introduces you to reactive programming, a natural, easy way to think
    about asynchronous code. I''ll show you how streams of events—which we call Observables—are
    a beautiful way to handle asynchronous code. Then we''ll create an Observable
    and see how reactive thinking and RxJS dramatically improve on existing techniques
    and make you a happier, productive programmer.


    # What''s Reactive?


    Let''s start by looking at a little RxJS program. This program needs to retrieve
    data from different sources with the click of a button, and it has the following
    requirements:


    +   - It must unify data from two different locations that use different JSON
    structures.


    +   - The final result should not contain any duplicates.


    +   - To avoid requesting data too many times, the user should not be able to
    click the button more than once per second.'
  - "[PAGE 20]\n\nUsing RxJS, we would write something like this:\n\n```\nvar button\
    \ = document.getElementById('retrievedDataBtn');\nvar source1 = Rx.DOM.getJSON('/resource1').pluck('name');\n\
    var source2 = Rx.DOM.getJSON('/resource2').pluck('props', 'name');\n```\n\n```\n\
    function getResults(amount) {\n  return source1.merge(source2)\n    .pluck('names')\n\
    \    .flatMap(function(array) { return Rx.Observable.from(array); }\n    .distinct())\n\
    \    .take(amount);\n}\n```\n\n```\nvar clicks = Rx.Observable.fromEvent(button,\
    \ 'click')\n  clicks.debounce(1000)\n    .flatMap(getResults(5))\n    .subscribe(\n\
    \      function(value) { console.log('Received value', value); },\n      function(err)\
    \ { console.error(err); },\n      function() { console.log('All values retrieved!');\
    \ }\n    );\n```\n\nDon't worry about what's going on; let's focus on the 10,000-foot\
    \ view for now. The first thing you see is that we can express more with fewer\
    \ lines of code. We accomplish this by using Observables.\n\nAn Observable represents\
    \ a stream of data. Programs can be expressed largely as streams of data. In the\
    \ preceding example, remote sources are Observables, and the mouse clicks from\
    \ the user. In fact, our program is essentially a single Observable from a button's\
    \ click event that we transform to the results we want.\n\nReactive programming\
    \ is expressive. Take, for instance, throttling clicks in our callbacks. Imagine\
    \ how complex it would be to do using callbacks or promises; we would need to\
    \ reset a timer every second and keep track of whether a second has passed since\
    \ the last time user clicked the button. It's a lot of complexity for so little\
    \ functionality, and the code for it is not even related to your program's actual\
    \ functionality. In bigger applications, these little complexities add up very\
    \ quickly to make for a tangled base.\n\nWith the reactive approach, we use the\
    \ method debounce to throttle the stream of clicks. This ensures that there is\
    \ at least a second between each click, and discards any clicks in between. We\
    \ don't care how this happens internally; we just express what we want our code\
    \ to do, not how to do it.\n\nIt gets much more interesting. Next you'll see how\
    \ reactive programming helps us make our programs more efficient and expressive."
- md: "\n## Spreadsheets Are Reactive\n\nLet's start by considering the quintessential\
    \ example of a reactive system: the spreadsheet. We all have used them, but we\
    \ rarely stop and think how shockingly intuitive they are. Let's say we have a\
    \ value in cell A1 of the spreadsheet. We can then reference it in other cells\
    \ in the spreadsheet, and whenever we change A1, every cell depending on A1 will\
    \ automatically update its own value.\n\n| | A | B | C |\n|---|---|---|---|\n\
    | 1 | 100 | 20 | 500 |\n| 2 | | | |\n\nThat behavior feels natural to us. We don't\
    \ have to tell the computer to update cells that depend on A1 or how to do it;\
    \ these cells *reacted* to the change. In a spreadsheet, we simply *declare* our\
    \ problem, and we don't worry about how the computer calculates the results.\n\
    \nThis is what reactive programming aims for. We declare relationships between\
    \ players, and the program evolves as these entities change or come up with new\
    \ values.\n\n# The Mouse as a Stream of Values\n\nTo understand how to see events\
    \ as streams of values, let's think of the program from the beginning of this\
    \ chapter. We used mouse clicks as an infinite sequence of events generated in\
    \ real time as the user clicks. This is an idea by Erik Meijer—the inventor of\
    \ RxJS—proposed in his paper “Your Mouse Is a Database.”¹\n\nIn reactive programming,\
    \ we see mouse clicks as a continuous stream of events that we can query and manipulate.\
    \ Thinking of streams instead of isolated values opens up a whole way to program,\
    \ in which we can manipulate entire sequences of values that haven't been created.\n\
    \nLet that thought sink in for a moment. This is different from what we’re used\
    \ to, which is having values stored somewhere such as a database or an array and\
    \ waiting for them to be available before we use them. If they are not available\
    \ yet (for instance, a network request), we wait for them and use them only when\
    \ they become available.\n\n¹ 1. http://queue.acm.org/detail.cfm?id=2169076\n\n\
    # Time\n\nWe can think of a streaming sequence as an array in which elements are\
    \ separated by time instead of memory. With either time or memory, we have sequences\
    \ of elements:\n\nSeeing your program as flowing sequences of data is key to understanding\
    \ RxJS programming. It takes a bit of practice, but it is not hard. In fact, most\
    \ data we use in any application can be expressed as a sequence. We'll look at\
    \ sequences more in depth in Chapter 2, Deep in the Sequence, on page 17.\n\n\
    # Querying the Sequence\n\nLet's implement a simple version of mouse stream using\
    \ traditional event listeners in JavaScript. To log the x- and y-coordinates of\
    \ mouse clicks, we could write something like this:\n\n```javascript\nch1/thinking_sequences.js\n\
    document.body.addEventListener('mousemove', function(e) {\n  console.log(e.clientX,\
    \ e.clientY);\n});\n```\n\n```\n252 183\n211 232\n153 323\n...\n```\n\nLooks like\
    \ a sequence, doesn't it? The problem, of course, is that manipulating events\
    \ is not as easy as manipulating arrays. For example, if we want to change the\
    \ preceding code so it logs only the first 10 clicks on the right side of the\
    \ screen (quite a random goal, but bear with me), we would write something like\
    \ this:\n\n```javascript\nvar clicks = 0;\ndocument.addEventListener('click',\
    \ function registerClicks(e) {\n```\n\n```javascript\nif (clicks < 10) {\n  if\
    \ (e.clientX > window.innerWidth / 2) {\n    console.log(e.clientX, e.clientY);\n\
    \    clicks++;\n  } else {\n    document.removeEventListener('click', registerClicks);\n\
    \  }\n}\n```\n\nTo meet our requirements, we introduced external state through\
    \ a global variable `clicks` that counts clicks made so far. We also need to check\
    \ for two different conditions and use nested conditional blocks. And when we're\
    \ done, we have to tie up unregister the event to not leak memory.\n\n# Side Effects\
    \ and External State\n\nIf an action has impact outside the scope where it happens,\
    \ we call this a side effect. Changing a variable outside our function, printing\
    \ to the console, or updating a value in a database are examples of side effects.\n\
    \nFor example, changing the value of a variable that exists inside our function\
    \ is safe. But if that variable is outside the scope of our function then other\
    \ functions can change its value. That means our function is not in control anymore\
    \ and can't assume that external variables contain the value we expect. We'd need\
    \ to track it and add checks to ensure its value is what we expect. At that point\
    \ we'd be adding code that is not relevant to our program, making it more complex\
    \ and prone.\n\nAlthough side effects are necessary to build any interesting program,\
    \ we should strive for having as few as possible in our code. That's especially\
    \ in reactive programs, where we have many moving pieces that change over time.\
    \ Throughout this book, we'll pursue an approach that avoids external state and\
    \ side effects. In fact, in Chapter 3, Building Concurrent Programs, on page 39,\
    \ we'll build an entire video game with no side effects.\n\nWe managed to keep\
    \ our easy requirements, but ended up with pretty complicated code for such a\
    \ simple goal. It's difficult to maintain and not obvious for a developer who\
    \ looks at it for the first time. More importantly, we made it prone to develop\
    \ subtle bugs in the future because we need to keep state.\n\nAll we want in situation\
    \ is you \"database\"\n"
  mdcn: "\n\n## 电子表格是响应式的\n\n让我们从考虑响应式系统的典型示例开始：电子表格。我们都都用过它们，但很少停下来思考它们直观的程度多么令人惊叹。假设我们在电子表格的\
    \ A1 单元格中有一个值。然后我们可以在表格的其他单元格中引用它，每当我们更改 A1 时，所有依赖于 A1 的单元格都会自动更新自己的值。\n\n| |\
    \ A | B | C |\n|---|---|---|---|\n| 1 | 100 | 20 | 500 |\n| 2 | | | |\n\n这种行为对我们来说很自然。我们不需要告诉计算机去更新依赖于\
    \ A1 的单元格，或者告诉它如何做；这些单元格对变化产生了*反应*。在电子表格中，我们只需*声明*我们的问题，而无需担心计算机如何计算结果。\n\n这正是响应式编程的目标。我们声明实体之间的关系，而程序会随着这些实体的变化或产生新值而演进。\n\
    \n# 作为值流的鼠标\n\n为了理解如何将事件视为值的流，让我们回想一下章初的程序。我们将鼠标点击视为用户点击时实时生成的无限事件序列。这是 RxJS 的发明者\
    \ Erik Meijer 提出的想法，他在他的论文《你的鼠标就是一个数据库》中提出了这一点。¹\n\n在响应式编程中，我们将鼠标点击视为连续的事件流，我们可以对其进行查询和操纵。思考“流”而不是孤立的值，开启了一种全新的编程方式，在这种方式中，我们可以操作整个尚未创建的值序列。\n\
    \n让这个想法先停留一会儿。这与我们习惯的不同——我们习惯是将值存储在数据库或数组等地方，并在使用它们之前等待它们可用。如果它们尚未可用（例如网络请求），我们会等待它们并仅在它们变得可用时使用它们。\n\
    \n¹ 1. http://queue.acm.org/detail.cfm?id=2169076\n\n# 时间\n\n我们可以将流序列看作一个数组，其中的元素是通过时间而不是内存分隔的。无论是通过时间还是内存，我们都有元素的序列：\n\
    \n将你的程序视为流流数据序列是理解 RxJS 编程的关键。这需要一些练习，但并不困难。事实上，我们在任何应用程序中使用的大多数数据都可以表示为序列。我们将在第\
    \ 2 章“深入序列”（第 17 页）中更深入地研究序列。\n\n# 查询序列\n\n让我们使用 JavaScript 中传统的事件监听器实现一个简单的鼠标流版本。为了记录鼠标点击的\
    \ x 坐标和 y 坐标，我们可以编写这样的代码：\n\n```javascript\nch1/thinking_sequences.js\ndocument.body.addEventListener('mousemove',\
    \ function(e) {\n  console.log(e.clientX, e.clientY);\n});\n```\n\n```\n252 183\n\
    211 232\n153 323\n...\n```\n\n看起来像一个序列，对吧？问题在于，操纵事件并不像操纵数组那样简单。例如，如果我们想修改前面的代码，使其仅记录屏幕右侧的前\
    \ 10 次点击（这是一个相当随机的目标，但请听我解释），我们将编写这样的代码：\n\n```javascript\nvar clicks = 0;\ndocument.addEventListener('click',\
    \ function registerClicks(e) {\n```\n\n```javascript\nif (clicks < 10) {\n  if\
    \ (e.clientX > window.innerWidth / 2) {\n    console.log(e.clientX, e.clientY);\n\
    \    clicks++;\n  } else {\n    document.removeEventListener('click', registerClicks);\n\
    \  }\n}\n```\n\n为了满足我们的需求，我们通过全局变量 `clicks` 引入了外部状态，该变量计算目前为止的点击次数。我们还需要检查两个不同的条件并使用嵌套条件块。当完成后，我们必须绑定并取消事件以防止内存泄漏。\n\
    \n# 副作用和外部状态\n\n如果一个动作对其发生范围之外产生影响，我们称之为副作用。在函数外部更改变量、打印到控制台或更新数据库中的值都是副作用的例子。\n\
    \n例如，更改我们函数内部变量的值是安全的。但如果该变量在我们的函数范围之外，那么其他函数就可以更改它的值。这意味着我们的函数不再处于控制之下，并且无法假设外部变量包含我们预期的值。我们需要跟踪它并添加检查以确保其值是我们预期的那样。到那时，我们正在添加与程序逻辑无关的代码，使其变得更加复杂且容易出错。\n\
    \n尽管副作用对于构建任何有趣的程序都是必须的，但我们应该努力减少代码中的副作用数量。这在响应式程序中尤为如此，因为我们有许多随时间变化的组件。在整本书中，我们将追求一种避免外部状态和副作用的方法。事实上，在第\
    \ 3 章“构建并发程序”（第 39 页）中，我们将构建一个没有任何副作用的视频游戏。\n\n我们设法实现了简单的需求，但对于这样一个简单的目标却得到了相当复杂的代码。它很难于维护，并且对于第一次看到它的开发者来说也并不直观。更重要的是，我们让它在未来容易产生细微的\
    \ bug，因为我们需要保持状态。\n\n在在这种情况下，我们想要的只是你的“数据库”\n\n"
