  md: '* *Currency gets increasingly complicated.* Combining interdependent results
    of multiple asynchronous operations becomes difficult. It requires us to keep
    track of the state of each operation in temporal variables, and then delegate
    them to the final combination operation in the proper order.


    # # Promises


    Promises came to save us from callbacks. A promise represents the result of an
    asynchronous operation. In promise-based code, calling an asynchronous function
    immediately returns a "promise" that will eventually be either *resolved* with
    the result of the operation or *rejected* with an error. In the meantime, the
    *pending* promise can be used as a placeholder for the final value.


    Promises usually make programs more clear by being closer to synchronous code,
    reducing the need for nesting blocks and keeping track of less state.


    Unfortunately, promises are not a silver bullet. They''re an improvement over
    callbacks, but they have a major shortcoming: they only yield a single value.
    That makes them useless for handling recurrent events such as mouse clicks or
    streams of data coming from the server, because we would have to create a promise
    for each separate event instead of creating a promise that handles the stream
    of events as it comes.


    # # Event Emitters


    When we emit an event, event listeners are subscribed to it will fire. Using events
    is a great way to decouple functionality, and in JavaScript, event programming
    is common and generally a good practice.


    But, you guessed it, event listeners come with their own set of problems, to:


    +   * Events side effects.* Event listener functions always ignore their return
    values, which forces the listener to have side effects if it wants to have any
    impact in the world.

    * Events are not first-class values.* For example, a series of click events can''t
    be passed as a parameter or manipulated as the sequence it actually is. We''re
    limited to handling each event individually, and only after the event happens.

    * It is easy to miss events if we start listening too late.* An infamous example
    of that is the first version of the *streams* interface in Node.js, which would
    often emit its data before listeners had time to listen to it, losing forever.'
