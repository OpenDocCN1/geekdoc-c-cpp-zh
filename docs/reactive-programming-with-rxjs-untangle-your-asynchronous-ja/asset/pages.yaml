  md: "```\nvar obs2 = Rx.Observable\n  .delay(2000)\n  .flatMap(function() {\n  \
    \  return rangeToFive.subscribe(printValue); // 1, 2, 3, 4, 5\n  });\n```\n\n\
    Understanding when we're dealing with hot or cold Observables is essential to\
    \ avoid subtle and sneaky bugs. For example, Rx.Observable.interval returns an\
    \ Observable that produces an increasing value at regular intervals of time. Imagine\
    \ we want to push the values to several Observers. We could implement it like\
    \ this:\n\n```\nhot_cold.js\nvar source = Rx.Observable.interval(2000);\nvar observer1\
