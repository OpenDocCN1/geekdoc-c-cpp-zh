  md: 'Making a Real-Time Earthquake Visualizer • 29


    There are two important things to know when using retry. First, if we don''t pass
    any parameters, it will retry indefinitely until the sequence is finished with
    errors. This is dangerous for performance if the Observable keeps producing errors.
    If we''re using synchronous Observables, it would have the same effect as an infinite
    loop.


    Second, retry will always retry the whole Observable sequence, even if some of
    the items didn''t error. This is important in case you''re causing any side effects
    when processing items, since they will be reapplied with every retry.


    # Making a Real-Time Earthquake Visualizer


