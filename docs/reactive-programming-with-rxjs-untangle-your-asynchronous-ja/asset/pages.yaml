    \ an Observer and emit yet another value. At the moment of the subscription the\
    \ items cached are 2 and 3, because J happened too long ago (around 250 milliseconds\
    \ ago), so it is no longer cached.\n\nSubjects are a powerful tool that can save\
    \ you a lot of time. They provide great solutions to common scenarios like caching\
    \ and repeating. And since at their core they are just Observables and Observers,\
    \ you don’t need anything new.\n\n# Spaceship Reactive!\n\nTo show how we can\
