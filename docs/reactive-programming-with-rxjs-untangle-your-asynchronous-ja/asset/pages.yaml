- img_proc: true
  md: "The interesting bit is that we're using an AsyncSubject that subscribes to\
    \ the RxDOM.Requestget Observable. Because AsyncSubject caches the last result,\
    \ any subsequent subscription to products will receive the result right away,\
    \ without causing another network request. We can use AsyncSubject whenever we\
    \ expect a single result and wait to hold onto it.\n\n> > Joe asks:\n Does That\
    \ Mean AsyncSubject Acts Like a Promise?\n\nIndeed.\nAsyncSubject represents the\
    \ result of an asynchronous action, and you can use it as a substitute for a promise.\
    \ The difference internally is that a promise will only ever process a single\
    \ value, whereas AsyncSubject processes all values in a sequence, ever emitting\
    \ (and caching) the last one.\n\nBeing able to easily simulate বাড়িতে shows the\
    \ flexibility of the RxJS model. (Even without AsyncSubject, it would be pretty\
    \ easy to simulate a promise using Observables.)\n\n# BehaviorSubject\n\nWhen\
    \ an Observer subscribes to a BehaviorSubject, it receives the last emitted value\
    \ and all the subsequent values. BehaviorSubject requires that we provide a starting\
    \ value, so that all Observers will always receive a value when they subscribe\
    \ to a BehaviorSubject.\n\nImagine we want to retrieve a remote file and print\
    \ its contents on an HTML page, but we want placeholder for the contents. We can\
    \ use a BehaviorSubject for this:\n\n```\nspaceship_reactive/behavior_subject.js\n\
