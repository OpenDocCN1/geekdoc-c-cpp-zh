  md: "This function returns true if an enemy or a shot from an enemy hits the player's\
    \ spaceship.\n\nBefore moving on, let's get to know a useful operator: takeWhile.\
    \ When we call takeWhile on an existing Observable, that will keep emitting values\
    \ until the function passed as a parameter to takeWhile returns false.\n\nWe can\
    \ use takeWhile to tell our main combineLatest Observable to keeping values until\
    \ gameover:\n\n```\nspaceship_reactive/enemy_shots2.js\nRx.Observable.combineLatest(\n\
    \  StarStream, Space, Enemies, HeroShots,\n  function(stars, spaceship, enemies,\
    \ heroShots) {\n    return {\n      stars: stars,\n      spaceship: spaceship,\n\
    \      enemies: enemies,\n      heroShots: heroShots\n    };\n  }}\n).sample(SPEED)\n\
    \ .takeWhile(function(actors) {\n  return gameOver(actors.spaceship, actors.enemies)\
    \ === false;\n}).subscribe(renderScene);\n```\n\nWhen gameOver returns true, combineLatest\
    \ will stop emitting values, effectively stopping the game.\n\n# One Last Thing:\
    \ Keeping Score\n\nWhat kind of game would it be if we couldn't brag about our\
    \ results to our friends? We obviously needed a way to track of how well we did.\n\
    \nLet's make a simpler helper function to draw the score to the upper left of\
    \ the screen.\n\n```\nspaceship_reactive/score.js\nfunction paintScore(score)\
    \ {\n  ctx.fillStyle = '#ffffff';\n  ctx.font = 'bold 26px sans-serif';\n  ctx.fillText('Score:\
    \ ' + score, 40, 43);\n}\n```\n\nTo keep score we'll use a Subject. We can easily\
    \ use it in our combineLatest-based main game loop as if it just another Observable,\
    \ and we can push values to it whenever we want."
