    \ between the Observable retrieving the URL and the Observers.\n\n+   - We create\
    \ the Observable that retrieves the URL \"products\" and store it in the products\
    \ variable.\n\n+   - This is the first subscription and will kick off the URL\
    \ retrieval and log when the URL is retrieved.\n\n+   - This is the second subscription,\
    \ which runs five seconds after the first one. Since at that time the URL has\
    \ already been retrieved, there's no need for another network request. It will\
    \ receive the request immediately because it is already stored in the AsyncSubject."
