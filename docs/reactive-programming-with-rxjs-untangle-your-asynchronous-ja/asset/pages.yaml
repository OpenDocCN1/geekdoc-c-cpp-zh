  md: "As is usually the case, RxJS has a very convenient operator we can use to solve\
    \ our problem.\n\nRxObservable.combineLatest is a handy operator. It takes two\
    \ or more Observables and emits the last result of each Observable whenever any\
    \ of them emits a new value. Knowing that starStream emits a new item (the array\
    \ of stars) frequently, we can remove the starStream subscription and use comineLatest\
    \ to combine both the starStream and SpaceShip Observables and update them as\
    \ soon as any of them emits a new item:\n\n```\nspaceship_reactive/hero_1.js\n\
    function renderScene(actors) {\n  paintStars(actors.stars);\n  paintSpaceShip(actors.spaceship.x,\
    \ actors.spaceship.y);\n}\n```\n\n```\nvar Game = Rx.Observable\n  .combineLatest(\n\
    \    StarStream, Space,\n    function(stars, spaceship) {\n      return { stars:\
    \ stars, spaceship: spaceship };\n    });\n```\n\nGame.subscribe(renderScene);\n\
    \nWe're now using a function renderScene to paint every time on the screen, you\
    \ can remove the following subscription code for StarStream:\n\n```\n.subscribe(function(starArray)\n\
    \  paintStars(starArray));\n```\n\nWith this, we'll paint the background and the\
    \ spaceship every time any Observable emits a new item. We now have a spaceship\
    \ flying through space, and we can move it at will using our mouse. Not bad for\
    \ so little code! But our hero's spaceship is too lonely in the vastness of space.\
    \ What about giving it some company?\n\n# Generating Enemies\n\nThis would be\
    \ a boring game if we didn't have any enemies to take care of. So let's create\
