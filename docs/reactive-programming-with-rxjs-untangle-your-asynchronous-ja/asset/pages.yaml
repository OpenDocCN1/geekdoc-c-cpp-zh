  md: '# Reactive Web Applications with Cycle.js


    With the advent of single-page apps, websites are suddenly expected to do much
    more, even compete against (gaspl!) "native" apps. While trying to make web applications
    faster, developers realized that particular areas were bottlenecks keeping web
    applications from being as fast and robust as their native counterparts.


    Spearheaded by Facebook React, several web frameworks are coming with new techniques
    to make faster web applications while keeping the code simple and declarative.


    In this chapter we''ll cover some new techniques to develop web applications that
    are here to stay, like the Virtual DOM. Cycle.js, a modern, simple, and beautiful
    framework that uses RxJS internally and applies reactive programming concepts
    to front-end programming.


    # Cycle.js


    Cycle.js is a small framework on top of RxJS for creating responsive user interfaces.
    It offers the features present in modern frameworks like React, such as virtual
    DOM and unidirectional dataflow.


    Cycle.js is designed in a reactive way, and all the building blocks in Cycle.js
    are Observables, which gives us enormous advantages. It is also simpler to grasp
    than other frameworks because there are fewer concepts to understand and memorize.
    For example, all operations related to state are out of the way, encapsulated
    in functions called drivers, and we rarely need to create new ones.


