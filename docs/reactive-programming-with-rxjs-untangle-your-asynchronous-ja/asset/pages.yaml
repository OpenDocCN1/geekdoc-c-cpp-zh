  md: "We're not manually managing the flow anymore. There are no loops or conditionals\
    \ to extract the individual earthquake objects and pass them around. Here's what's\
    \ happening:\n\n+   onNext only happens this time, and it yields the JSON response.\n\
    \n+   Since we'll yield only one time, we signal completion after onNext.\n\n\
    +   We're chaining the flatMap to call the result, so flatMap will take each result\
    \ from the Observable (in this case only), use it as a parameter for the transform\
    \ function, and merge the Observable resulting from that function into the source\
    \ Observable.\n\n+   Here we take the features array containing all the earthquakes\
    \ and create an Observable from it. Because of flatMap, this will become the actual\
    \ Observable that the quakes variable will.\n\n+   Subscribe doesn't change at\
    \ all; it keeps dealing with a stream of earthquakes just like before.\n\n# There\
    \ Is Always a Method\n\nSo we've used RxJS operators in rx.all.js, but it's worth\
    \ checking out operators that come with other RxJS-based libraries. In our case,\
    \ we'll look at RxJS-DOM. RxJS-DOM is an external library that, among others,\
    \ contains an operator to handle JSON requests: jsonRequest That saves us some\
    \ code and keeps us from using nasty functions:\n\n```\nexamples_earthquake/code12.js\n\
    var quakes = Rx.DOM.jsonRequest({\n  url: URL,\n  jsonCallback: 'eqfeed_callback'\n\
    })\n.flatMap(function(result) {\n  return Rx.Observable.from(result.response.features);\n\
    })\n.map(function(quake) {\n  lat: quake.geometry.coordinates[1],\n  lng: quake.geometry.coordinates[0],\n\
    \  size: quake.properties.max * 10000\n});\nquakes.subscribe(function(quake) {\n\
    \  L.circle(quake.lat, quake.lng, quake.size).addTo(map);\n});\n```\n\n+   3.\
    \ https://github.com/Reactive-Extensions/RxJS-DOM"
