- img_proc: true
  md: "Chapter 2. Deep in the Sequence • 28\n\nAnd here’s the marble diagram for the\
    \ catch operator:\n\n![](img/a8eed7bbb390e0eff6b6561c329a113c_45_0.png)\n\nNotice\
    \ the X to indicate that the sequence experienced an error. The different shape\
    \ of the Observable values—triangles in this case—means that they are values coming\
    \ from another Observable. Here, that’s the Observable we return in case of an\
    \ error.\n\ncatch is useful for reacting to errors in a sequence, and it behaves\
    \ much like the traditional try/catch block. In some cases, though, it would be\
    \ very convenient to ignore an error that happens with an item in the Observable\
    \ and let the sequence continue. In those cases, we can use the retry operator.\n\
    \n# Retrying Sequences\n\nSometimes errors just happen and there’s not much we\
    \ can do about it. For example, there could be a timeout requesting remote data\
    \ because the user has a spotty Internet connection, or a remote server is querying\
    \ out crash. In these cases it would be better if we could keep requesting the\
    \ data until we needed to. The retry operator does exactly like that:\n\n```\n\
    sequences/error_handling.js\n// This will try to retrieve the remote URL up to\
    \ 5 times.\nRx.DOM.get('/products').retry(5)\n.subscribe(\n  function(xhr) { console.log(xhr);\
    \ },\n  function(err) { console.error('ERROR: ', err); }\n);\n```\n\nIn the preceding\
    \ code, we create a function that returns an Observable that retrieves contents\
    \ from a URL using XMLHttpRequest. Because our connection might be a bit spotty,\
    \ we add retry(5) before subscribing to it, ensuring that in case of an error,\
    \ it will try five times before giving up and showing an error.\n\nreport erratum\
    \ • discuss"
