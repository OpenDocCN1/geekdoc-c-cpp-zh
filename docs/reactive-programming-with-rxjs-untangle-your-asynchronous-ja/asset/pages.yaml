    web application that uses RxJS to show where earthquakes are happening in real
    time. We''ll start by building a functional but naive reactive implementation,
    and will improve it as we go. The final result will look like:


    ![](img/a8eed7bbb390e0eff6b6561c329a113c_46_0.png)


