  md: "```\nvar result = '';\nsubject.subscribe(function(value) { result = value;\
    \ });\n\nscheduler.advanceBy(100);\nassert.equal(result, 'first');\n\nscheduler.advanceBy(100);\n\
    assert.equal(result, 'second');\n\nscheduler.advanceBy(100);\nassert.equal(result,\
    \ 'third');\n\n```\n\nIn the preceding code we test that some values from a cold\
    \ Observable arrive in the correct order. For this, we use the helper method coldObservable\
    \ in TestScheduler to create an Observable that plays back the onNext notifications\
    \ we pass as parameters. In each notification we specify the time at which the\
    \ value of the notification should be emitted. After this, we subscribe to this\
    \ Observable, advance the virtual time in the Scheduler manually, and check that\
    \ it indeed emitted the expected value. If the example ran in normal time, it\
    \ would take 300 milliseconds, but because we're using a TestScheduler to run\
    \ the Observable, it will run immediately, but respecting the order.\n\n# Writing\
    \ a Real-World Test\n\nThere's no better way to understand how to bend time using\
    \ virtual time than to write a test for a time-sensitive task in the real world.\
    \ Let's recover an Observable from the earthquake viewer we made in Buffering\
    \ Values, on page 76:\n\n```\nquakes\n.pluck('properties')\n.map(makeRow)\n.bufferWithTime(500)\n\
    .filter(function(rows) { return rows.length > 0; })\n.map(function(rows) {\n \
    \ var fragment = document.createDocumentFragment();\n  rows.forEach(function(row)\
    \ {\n    fragment.appendChild(row);\n  });\n  return fragment;\n})\n.subscribe(function(fragment)\
