  md: "we'd have to keep counters and element buffers, and we would have to\nremember\
    \ to reset them with every batch. But with RxJS we can just use one\nof buffer-based\
    \ RxJS operators, like bufferWithTime.\n\nWith bufferWithTime we can buffer incoming\
    \ values and release them as an array\nevery period of time.\n\n```\nexamples_earthquake_ui/code3.bufferWithTime.js\n\
    var table = document.getElementById('quakes_info');\nquakes\n  .pluck('properties')\n\
    \  .map(makeRow)\n  .bufferWithTime(500)\n  .filter(function(rows) {\n    return\
    \ rows.length > 0;\n  })\n  .map(function() {\n    var fragment = document.createDocumentFragment();\n\
    \    rows.forEach(function(row) {\n      fragment.appendChild(row);\n    });\n\
    \    return fragment;\n  })\n  .subscribe(function(fragment) {\n    table.appendChild(fragment);\n\
    \  });\n```\n\nThis is what's going on in the new code:\n\n+   Buffer incoming\
    \ value and release the batch of values every 500\nmilliseconds.\n\n+   bufferWithTime\
    \ executes every 500ms no matter what, and if there have been\nincoming values,\
    \ it will yield an empty array. We will filter those.\n\n+   We insert every row\
    \ into a document fragment, which is a document\nwithout a parent. This means\
    \ it's not in the DOM, and modifying its\ncontents is very fast and efficient.\n\
    \n+   Finally, we append the fragment to the DOM. An advantage of appending\n\
    a fragment is that it counts as a single operation, causing just one redraw.\n\
    It also appends the fragment's children to the same element to which\nwe're appending\
    \ the fragment itself.\n\nUsing buffers and fragments, we manage to keep row insertion\
    \ performant\nwhile keeping the real-time nature of our application (with a maximum\
    \ delay\nof half a second). Now we're ready to add the next feature to our dashboard:\n\
    interactivity!"
