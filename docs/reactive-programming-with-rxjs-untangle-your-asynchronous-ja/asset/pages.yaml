  md: "# Adding Interaction\n\nWe have earthquakes on the map and in a list, but no\
    \ interaction between both representations yet. It would be nice, for example,\
    \ to center an earthquake on the map whenever we click on the list, and to highlight\
    \ an earthquake with a circle on the map when we move the mouse over its row.\
    \ Let's get to it.\n\nIn Leaflet, you can draw on a map and put drawings in their\
    \ own layers you can manipulate them individually. Let's create a group of layers\
    \ called quake where we'll store all the earthquake circles. Each circle will\
    \ be a layer inside the group. We'll also create an object codeLayers where we'll\
    \ store the correlation between an earthquake code and the internal layer ID,\
    \ so that we can refer to them by the earthquake ID:\n\n```\nexamples_earthquake_ui/code.js\n\
    var codeLayers = {};nvar quakeLayer = L.layerGroup().addTo(map);\n```\n\nAnd now\
    \ in the subscription for the quakes Observable inside initialize, we'll add each\
    \ circle to the layer and store its ID in codeLayers. If it seems a bit intricate,\
    \ it's because the only way Leaflet allows us to redraw in a map.\n\n```\nexamples_earthquake_ui/code.js\n\
    quakes.subscribe(function(quake) {\n  var coords = quake.geometry.coordinates;\n\
    \  var size = quake.properties.mag * 10000;\n\n  var circle = L.circle(coords[0],\
    \ size).addTo(map);\n  quakeLayer.addLayer(circle);\n  codeLayers[quake.id] =\
    \ quakeLayer.getLayer(circle);\n});\n```\n\nLet's now create the hovering effect.\
    \ We'll write a new function, isHovering, which returns an observable that emits\
    \ a Boolean value for when the mouse is over a particular earthquake circle at\
    \ any given moment:\n\n```\nexamples_earthquake_ui/code.js\nvar identity = Rx.helpers.identity;\n\
    \nfunction isHovering(element) {\n  var over = Rx.DOM.mouseover(element).map(identity(true));\n\
    \  var out = Rx.DOM.mouseout(element).map(identity(false));\n\n  return over.merge(out);\n\
    }\n```"
