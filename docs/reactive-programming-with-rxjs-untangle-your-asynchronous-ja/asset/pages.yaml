  md: 'In fewer than 20 lines, we''ve written an application that regularly polls
    an external JSONP URL, extracts concrete data from its contents, and filters out
    earthquakes that have already been imported. After that, we represent the earthquakes
    on a map, with a size proportional to their magnitude—all written in a self-contained,
    clear, and concise way, without relying on external stores. Not bad at all! That
    shows how expressive Observables can be.


    # Ideas for Improvements


    Here are a couple of ideas to put your newly acquired RxJS skills to use and make
    this little application bit more interesting:


    +   * When the user hovers the mouse over an earthquake, offer a pop-up that shows
    more information about that particular earthquake. One way to do that would to
    create a new Observable from the quakes one with just the properties you want,
    and dynamically filter it upon hovering.

    * Implement a counter at the top of the page that shows the number of earthquakes
    so far today and resets every day.


    # Operator Rundown


    This chapter presented you with a few new operators, so here''s a recap of them,
    along with scenarios for ways we can use them in our applications. Remember, you
    can always find the complete API documentation for operators on the RxJS GitHub
    site.⁴


    +   * Rx.Observable.from


    Default behavior: *Synchronous*


    Since many of the data sources you use in your applications will come from arrays
    or iterables, it makes sense to have an operator that creates Observables out
    of them. from is one of the operators you''ll use the most.


    With from we can create Observables from arrays, array-like objects (for instance,
    the arguments object or DOM NodesList), and even types that implement the iterable
    protocol, such as String, Map, and Set⁵


    +   * Rx.Observable.range


    Default behavior: *Synchronous*


    +   4. https://github.com/Reactive-Extensions/RxJS/blob/master/doc/api/observable.md

    5. https://developer.mozilla.org/en/docs/Web/JavaScript/Reference/Iterable_protocols'
