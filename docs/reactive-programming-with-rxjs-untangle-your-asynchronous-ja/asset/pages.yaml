    \ Observable? We use Observers.\n\n# First Contact with Observers\n\nObservers\
    \ listen to Observables. Whenever an event happens in an Observable, it calls\
    \ the related method in all of its Observers.\n\nObservers have three methods:\
    \ onNext, onCompleted, and onError:\n\nonNext The equivalent of Update in the\
    \ Observer pattern. Notice how the name reflects the fact that we're subscribed\
