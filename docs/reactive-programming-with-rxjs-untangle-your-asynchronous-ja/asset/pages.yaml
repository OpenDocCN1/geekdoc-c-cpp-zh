  md: "# spaceship_reactive/score.js\n\n```\nvar ScoreSubject = new Rx.Subject();\n\
    var score = ScoreSubject.scan(function (prev, cur) {\n  return prev + cur;\n},\
    \ ).concat(Rx.Observable.return(0));\n```\n\nIn this code we use our friend scan\
    \ operator to sum each new value to the total aggregate result. Since we won't\
    \ have any score when a game starts, we concatenate an Observable that returns\
    \ 0 so we have a starting point.\n\nNow we have to push to our Subject whenever\
    \ we hit an enemy: that happens in paintHeroShots;\n\n# spaceship_reactive/score.js\n\
    \n```\nvar SCORE_INCREASE = 10;\nfunction paintHeroShots(heroShots, enemies) {\n\
    \  heroShots.forEach(function(shot, l) {\n    for (var l=0; l<enemies.length;\
    \ l++) {\n      var enemy = enemies[l];\n      if (!enemy.isDead && collision(shot,\
    \ enemy)) {\n        ScoreSubject.onNext(SCORE_INCREASE);\n        enemy.isDead\
    \ = true;\n        shot.x = shot.y = -100;\n        break;\n      }\n    }\n \
    \ });\n\n  shot.y -= SHOOTING_SPEED;\n  drawTriangle(shot.x, shot.y, '#ffff00',\
    \ 'up');\n});\n```\n\nOf course, we also paintScore to renderScene so the score\
    \ appears onscreen:\n\n# spaceship_reactive/score.js\n\n```\nfunction renderScene(actors)\
    \ {\n  paintStars(actors.stars);\n  paintShip(actors.spaceship, actors.x, actors.spaceship);\n\
    \  paintEnemies(actors.enemies);\n  paintHeroShots(actors.heroShots, actors.enemies);\n\
    \  paintScore(actors.score);\n}\n```\n\nThat completes our Spaceship Reactive\
    \ game. With about 200 lines managed to code an entire game in the browser, avoiding\
    \ changing any external state through the power of Observable pipelines."
