  md: "# Using JSX\n\nInstead of using the h function, we could write our UI using\
    \ JSX. An XML-like syntax invented by Facebook that makes writing virtual DOM\
    \ structures easier and more readable. Our vtreeElements function would look like\
    \ this:\n\n```\ncycle/index.js\nfunction vtreeElementsJSX(results) {\n  results\
    \ = results.map(function(result) {\n    var link = WIKI URL + result.title;\n\
    \    return <div><a href={link}>{result.title}</a></div>;\n  });\n\n  return <div>\n\
    \    <h1>Wikipedia Search</h1>\n    <input className=\"search-field\" type=\"\
    text\" />\n    <hr/>\n    <div>{results}</div>\n  </div>;\n}\n```\n\nSince JSX\
    \ is a syntax extension, not a compiler that transforms it into the final JavaScript\
    \ code (which looks very like our h-based code from the previous section). We'll\
    \ use Babel for that. Babel is a compiler that transforms modern JavaScript into\
    \ JavaScript that runs everywhere. It also transforms some JavaScript extensions,\
    \ which is JSX, which is its particular use case.\n\nIf you want to use JSX, you\
    \ need to install Babel and use it when compiling the project. Fortunately, Babel\
    \ has an adapter for Browserify called Babelify:\n\n+   npm install babelify\n\
    \nIn every file that uses JSX, we need to add the following lines at the top of\
    \ the file:\n\n```\n/** @jsx JSX */\nvar hJSX = CycleDOM.JSX;\n```\n\n+   3. https://babeljs.io"
