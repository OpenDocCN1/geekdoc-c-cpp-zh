  md: "To make the code more testable, let's encapsulate the Observable in a function\
    \ that takes a Scheduler we use in the bufferWithTime operator. It's always a\
    \ good idea to parameterize Schedulers in Observables that will be tested.\n\n\
    ```\nch_schedulers/testscheduler.js\nfunction quakeBatches(scheduler) {\n  return\
    \ quakes.pluck('properties')\n    .bufferWithTime(500, null, scheduler || null)\n\
    \    .filter(function(rows) {\n      return rows.length > 0;\n    });\n}\n```\n\
    \nLet's also simplify the code by taking some steps out but keeping the essence.\
    \ This code takes an Observable of JSON objects that contain a properties property,\
    \ buffers them into batches released every 500 milliseconds, and filters the batches\
    \ that come empty.\n\nWe want to verify that this code works, but we definitely\
    \ don't want to wait several seconds every time we run tests to make sure our\
    \ buffering works as expected. This is where virtual time and the TestScheduler\
    \ will help us:\n\n```\nch_schedulers/testscheduler.js\nvar onNext = Rx.ReactiveTest.onNext;\n\
    var onCompleted = Rx.ReactiveTest.onCompleted;\nvar subscribe = Rx.ReactiveTest.subscribe();\n\
    ```\n\n```\nvar scheduler = new Rx.TestScheduler();\nvar quakes = scheduler.createHotObservable(\n\
    onNext(100, { properties: 1 }),\nonNext(300, { properties: 2 }),\nonNext(550,\
    \ { properties: 3 }),\nonNext(750, { properties: 4 }),\nonNext(1000, { properties:\
    \ 5 }),\nonCompleted(1100)\n);\n```\n\n```\nUnit.test(\"Test quake buffering\"\
    , function(assert) {\n  var results = scheduler.startScheduler(function() {\n\
    \    return quakeBatches(scheduler);\n  }),\n  created: 0,\n  subscribed: 0,\n\
    \  disposed: 1200\n});\n```\n\n```\nvar messages = results.messages;\nconsole.log(results.scheduler\
    \ === scheduler);\n```"
