    Iterators are great to encapsulate traversing logic for any kind of data structure.
    As we saw in the preceding example, iterators get interesting when made generic
    to handle different types of data, or when they can be configured at runtime,
    like we did in our example with the divisor parameter.


    # The Rx Pattern and the Observable


    While the Observer and the Iterator are powerful in their own right, the combination
    of both is even better. We call this the Rx pattern, named after the Reactive
    Extensions libraries. We''ll be using this pattern for the rest of the book.


    The Observable sequence, or simply Observable is central to the Rx pattern. An
    Observer emits its values in order—but instead of its consumers requesting the
    next value, the Observable "pushes" values to consumers as they become available.
    It has a similar role to the Producer''s in the Observer pattern: emitting values
    and pushing them to its listeners.


    ![](img/a8eed7bbb390e0eff6b6561c329a113c_27_0.png)


    In programming, push-based behavior means the server component of an application
    updates itself to its clients instead of the clients having to poll the server
    for these updates. It''s like saying, "Don''t call us; we''ll call you." RxJS
    is push-based, so the source of events (the Observable) will push new values to
    the consumer (the Observer), without the consumer requesting the next value.


    More simply, an Observable is a sequence whose items become available over time.
    The consumers of Observables, Observers are the equivalent of listeners in the
    Observer pattern. When an Observer is subscribed to an Observable, it will receive
    the values in the sequence as they become available, without having to request
    them


    So far it seems there''s not much of a difference from the traditional Observer
    pattern. But there are actually two essential differences:


