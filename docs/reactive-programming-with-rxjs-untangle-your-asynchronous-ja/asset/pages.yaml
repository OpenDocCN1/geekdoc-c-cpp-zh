    \ is no more data available. After onCompleted is called, further calls to onNext\
    \ will have no effect.\n\nonError Called when an error occurs in the Observable.\
    \ After it is called, further calls to onNext will have no effect.\n\nHere's how\
    \ we create a basic Observer:"
