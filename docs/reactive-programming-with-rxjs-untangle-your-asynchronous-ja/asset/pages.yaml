  md: '# What''s in This Book


    This book is a practical introduction to reactive programming using RxJS. The
    objective is to get you to think reactively by building small real-world applications,
    so you will learn how to introduce reactive programming in your day-to-day programming
    and make your programs more robust. This is not a theoretical book about reactive
    programming, and it is not an exhaustive reference book for the RxJS API. You
    can find these resources online.


    We''ll be developing mostly for the browser, but we''ll see some examples along
    the way to keep it real. Here are the chapters:


    +   Unless you have RxJS before, start with [Chapter 1, The Reactive Way on page
    1]. In this chapter we introduce Observables, the main data type of RxJS, which
    we use extensively throughout the book.


    +   With the bases of Observables established, we move on to [Chapter 2, Deep
    in the Sequence, on page 17]. In reactive programming we''ll see all sequences
    of events. We visit some important sequence operators and build our first application,
    a real-time earthquake visualizer.


    +   In [Chapter 3, Building Concurrent Programs, on page 39], we look at how to
    write concurrent code with minimal side effects. After covering the Observable
    pipeline, we build a cool video game in about 200 lines of code and with no global
    state.


    +   In [Chapter 4, Building a Complete Web Application, on page 69], we get deeper
    into reactive development and enhance the earthquake application we made previously
    in [Deep in the Sequence] by making a server part in Node.js that tweets about
    earthquakes happening right now.


    +   We get into some advanced concepts of RxJS with [Chapter 5, Bending Time with
    Schedulers, on page 89], where we talk about the useful concept RxJS provides
    to handle concurrency at a more fine-grained level: Schedulers.


    With the knowledge of Schedulers under our hands, we explore how they help us
    with testing. We''ll see how to simulate in our tests to accurately test asynchronous
    programs.


    +   Finally, in [Chapter 6, Reactive Web Applications with Cycle.js, on page 103],
    we''ll use Cycle.js, a UI framework built on top of RxJS, to build a simple application.
    Cycle.js draws concepts from modern frameworks like React, but to create a reactive
    framework that uses the advantages of Observables to help us create user interfaces
    in a simple and reliable way.'
