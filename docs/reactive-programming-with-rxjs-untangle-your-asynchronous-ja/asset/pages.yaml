  md: "```\nreturn Rx.Observable.create(function(observer) {\n  if (!subject) {\n\
    \    subject = new AsyncSubject();\n    Rx.DOM.get(url).subscribe(subject);\n\
    \  }\n});\n```\n\n```\nvar products = getProducts('products');\n// Will trigger\
    \ request and receive the response when\nproducts.subscribe(\n  function onNext(result)\
    \ { console.log('Result 1:', result.response); },\n  function onError(error) {\
    \ console.log('ERROR', error); }\n});\n```\n\n```\n// Will receive the result\
    \ immediately because it's cached\nsetTimeout(function() {\n  products.subscribe({\n\
    \    function onNext(result) { console.log('Result 2:', result.response); },\n\
    \    function onError(error) { console.log('ERROR', error); }\n  });\n}, 5000);\n\
    ```\n\nIn this code, when getProducts is called with a URL, it returns an Observable\
    \ that emits the result of the HTTP GET request. Here's how it breaks down:\n\n\
    +   - getProducts returns an Observable sequence. We create it by\n\n+   - If\
    \ we haven't created an AsyncSubject yet, we create it and subscribe it to the\
    \ Observable that Rx.DOM.get(url) returns.\n\n+   - We subscribe the Observer\
    \ to the AsyncSubject. Every time an Observer subscribes to the Observable, it\
