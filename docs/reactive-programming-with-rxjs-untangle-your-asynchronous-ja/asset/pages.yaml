  md: "# Chapter 6. Reactive Web Applications with Cycle.js • 106\n\nRxJS already\
    \ makes retrieving and processing the remote data, but, as you saw in Chapter\
    \ 4, Building a Complete Web Application, on page 69, we still need to jump through\
    \ some hooks to make our DOM operations efficient.\n\nOne of the objectives of\
    \ Cycle.js is to completely eliminate DOM manipulation from our code. Let's start\
    \ with basic scaffolding:\n\n```\ncycle/step1.js\nvar Cycle = require('@cycle/core');\n\
    var CycleDOM = require('@cycle/dom');\nvar Rx = Cycle.Rx;\n\nfunction main(responses)\
    \ {\n  return (\n    DOM: Rx.Observable.just(CycleDOM.h('span', 'Hi there!'))\n\
    \  );\n}\n```\n\n```\nvar drivers = {\n  DOM: CycleDOM.makeDOMDriver('#container')\n\
    }\n```\n\nCycle.run(main, drivers);\nThis code shows the Hi there! onscreen, but\
    \ there's already a lot going on. The important parts are the main function and\
    \ the drivers object. Let's go through the steps:\n\n+   We require Cycle Core\
    \ and the Cycle DOM driver. I'll explain what the Cycle.js driver is in the next\
    \ section.\n\n+   The main function is always the entry point for our application.\
    \ It returns a collection of Observables, for each driver in the application.\
    \ So far we're using only one: the DOM driver.\n\nThe Observable for the DOM driver\
    \ emits a virtual tree, which we create using the h method in the Cycle DOM library.\
    \ In this case, we create a single span element with the text 'Hi there!'. The\
    \ DOM driver consumes virtual tree and renders the actual DOM from the page it.\n\
    \n+   We create a DOM driver that will build the DOM tree from the items emitted\
    \ by the main function. The DOM tree will be built in the element or selector\
    \ that we pass as a parameter. In this case, #container.\n\n+   Cycle.run connects\
    \ the main function with the drivers object, creating a circular flow between\
    \ the two.\n\nreport erratum • discuss"
