  md: '# The Modern Web


    Get up to speed on the latest HTML, CSS, and JavaScript techniques.


    # HTML5 and CSS3 (2nd edition)


    HTML5 and CSS3 are more than just buzzwords—they''re the foundation for today''s
    web applications. This book gets you up to speed on the HTML5 elements and CSS3
    features you can use right in your current projects, with backwards compatible
    solutions that ensure you don''t leave users of older browsers behind. This new
    edition covers even more new features, including CSS animations, IndexedDB, and
    client-side validations.


    Brian P. Hogan

    (314 pages) ISBN: 9781937785598.838

    https://prprog.com/book/bhh52e


    ![](img/a8eed7bbb390e0eff6b6561c329a113c_138_0.png)


    # Async JavaScript


    With the advent of HTML5, front-end MVC, and Node.js, JavaScript is ubiquitous—and
    messy. This book will give you a solid foundation for managing async tasks without
    losing your sanity in a tale of callbacks. It''s a fast-paced guide to the most
    essential techniques for dealing with async behavior, including PubSub, event
    models, and Promises. With these tricks up your sleeve, you''ll be better prepared
    to manage the complexity of large web apps and deliver responsive code.


    Trevor Burnham

    (104 pages) ISBN: 9781937785277.817

    https://prprog.com/book/tbjs5


    ![](img/a8eed7bbb390e0eff6b6561c329a113c_138_1.png)'
