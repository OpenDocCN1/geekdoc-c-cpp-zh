  md: "```\nmargin: 0;\n  padding: 0;\n}\n</style>\n<head>\n<body>\n  <script src=\"\
    spaceship.js\"></script>\n</body>\n</html>\n```\n\nIt's a simple HTML file that\
    \ loads the JavaScript file we'll be working with for the rest of the. In JavaScript\
    \ file, we'll be setting up a canvas element where we'll render our game:\n\n\
    ```\nspaceship_reactive/starfield_1.js\nvar canvas = document.createElement('canvas');\n\
