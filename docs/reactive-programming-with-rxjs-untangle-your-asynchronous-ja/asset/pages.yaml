    \ = window.innerWidth;\ncanvas.height = window.innerHeight;\n```\n\nWith in place\
    \ we can start describing our game's components. First let's draw our starry background.\n\
    \n# Creating the Star Field\n\nThe first things we need for a game set in space\
    \ are stars. We'll create a star field that scrolls using the feeling of traveling\
    \ through space. For this, we'll first generate the stars using the range operator:\n\
    \n```\nspaceship_reactive/starfield_1.js\nvar SPEED = 40;\nvar STAR_NUMBER = 250;\n\
    var StarStream = Rx.Observable.range(1, STAR_NUMBER)\n.map(function() {\n  return\
    \ {\n    x: parseInt(Math.random()) * canvas.width,\n    y: parseInt(Math.random())\
    \ * canvas.height,\n    size: parseInt(Math.random()) * 3 + 1\n  };\n});\n```\n\
    \nEach star will be represented by an object that contains random coordinates\
    \ and a size between 1 and 4. This code will give us a stream that generates 250\
    \ of these \"stars.\"\n\nWe want these stars to keep moving. A way to do that\
    \ is to increase the y-coordinate every few milliseconds for all stars. We'll\
    \ transform the StarStream Observable into an array usingtoArray, which will then\
    \ emit an array containing"
  merge: -1
