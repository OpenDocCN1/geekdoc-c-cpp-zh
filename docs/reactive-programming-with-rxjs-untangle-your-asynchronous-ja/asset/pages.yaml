  md: "Next we make the Subject emit values of its own (message1 and message2). In\
    \ the final result, we get the Subject's own messages and the proxied values from\
    \ the source Observable. The values from the Observable come later because they\
    \ are asynchronous, whereas we made the Subject's own values immediate. Notice\
    \ that even if we tell the source Observable to take the first five, we output\
    \ only the first three. That' because after one second we call onDestroy on the\
    \ Subject. This finishes the notifications to all subscriptions and overrides\
    \ the take operator in this case.\n\nThe Subject class provides the base for creating\
    \ more specialized Subjects. In fact, RxJS comes with some interesting ones: AsyncSubject,\
    \ ReplaySubject, and BehaviorSubject.\n\n# AsyncSubject\n\nAsyncSubject emits\
    \ the last value of a sequence only if the sequence completes. This value is then\
    \ cached, and any Observer that subscribes after it will receive it right away.\
    \ AsyncSubject is convenient for asynchronous operations that return a single\
    \ value, such as Ajax requests.\n\nLet's see an example of AsyncSubject subscribing\
    \ to the range:\n\n```\nspaceship_reactive/subjects.js\nvar delayedRange = Rx.observable(0,\
    \ 5).delay(1000);\nvar subject = new AsyncSubject();\n```\n\n```\ndelayedRange.subscribe(\n\
    \  function onNext(item) { console.log('Value:', item); },\n  function onError(err)\
    \ { console.log('Error:', err); },\n  function onCompleted() { console.log('Completed.');\
    \ }\n);\n```\n\nIn that example, delayedRange emits the values 0 to 4 after a\
    \ delay of a second. Then we create a new AsyncSubject subject and subscribe it\
    \ to delayedRange. The output is the following:\n\nValue: 4\nCompleted.\n\nAs\
    \ expected, we get only the last value that the Observer emits. Let's now AsyncSubject\
    \ for a more realistic scenario. We'll retrieve remote content:\n\n```\nspaceship_reactive/subjects.js\n\
    function getProducts(url) {\n  var subject;\n```"
