  md: "# Creating Observables from JavaScript Events\n\nWhen we transform an event\
    \ into an Observable, it becomes a first-class value that can be combined and\
    \ passed around. For example, here's an Observable that emits the coordinates\
    \ of the mouse whenever it moves:\n\n```\nvar allMoves = Rx.Observable.fromEvent(document,\
    \ 'mousemove')\nallMoves.subscribe(function(e) {\n  console.log(e.clientX, e.clientY);\n\
    });\n```\n\nTransforming an event into an Observable unleashes the event from\
    \ its natural constraints. More importantly, we can create new Observables based\
    \ on the original Observables. These new ones are independent and can be used\
    \ for different tasks:\n\n```\nvar movesOnRight = allMoves.filter(function(e)\
    \ {\n  return e.clientX > window.innerWidth / 2;\n});\n\nvar movesOnLeft = allMoves.filter(function(e)\
    \ {\n  return e.clientX < window.innerWidth / 2;\n});\n```\n\n```\nmovesOnRight.subscribe(function(e)\
    \ {\n  console.log('Mouse is on the right:', e.clientX);\n});\n```\n\n```\nmovesOnLeft.subscribe(function(e)\
    \ {\n  console.log('Mouse is on the left:', e.clientX);\n});\n```\n\nIn the preceding\
    \ code, we create two Observables from the original allMoves one. movesOnRight\
    \ contains mouse events that happen on the right side of the screen, and movesOnLeft\
    \ contains mouse events that happen on the left side. Neither of them modify the\
    \ original Observable: allMoves will keep emitting all mouse moves. Observables\
    \ are immutable, and every operator applied to them creates a new Observable.\n\
    \n# Creating Observables from Callback Functions\n\nChances are you will have\
    \ to interact with callback-based code if you use third-party JavaScript libraries.\
    \ We can transform our callbacks into Observables using two functions, fromCallback\
    \ and fromNodeCallback. Nodejs follows the convention of always invoking the callback\
    \ function with an error argument"
