    \  ctx.fillStyle = '#ffffff';\n  stars.forEach(function(star) {\n    ctx.fillRect(star.x,\
    \ star.y, star.size, star.size);\n  });\n});\n```\n\npaintStars paints a black\
    \ background and draws the stars on the canvas. The only thing left to achieve\
