  md: 'responses.JSONP emits JSON responses in the application. We start by filtering
    by the ones that contain the API URL of Wikipedia in its request, to make sure
    we''re processing the relevant responses.


    responses.JSONP is an Observable of Observables. For each response there is an
    Observable. In this line we flatten all out, so we deal with the responses themselves
    from now, instead of their Observables.


    The responses are JSON objects, and the information we''re interested in is in
    the `querysearch` property. We use the pluck operator to extract it.


    We don''t know if we''ll have any results, so that at the very least we ensure
    we''ll have an empty array.


    Finally, we use our `treeElements` function to every result from Wikipedia. This
    will update our UI.


    Notice the $ sign at the end of the variable''s name. In this chapter I''m adopting
    a naming convention used in Cycle.js code that adds $ to the name of a variable
    to mean that it is an Observable. I found that it makes it much easier to understand
    Observable-based code!


    The most important takeaway from the preceding code is that in the last step we
    seem to be repainting the whole UI for every single result that we receive. But
    here''s the virtual DOM shines. No matter how many times we re-render the page,
    the virtual DOM will always ensure that only the differences are rendered, making
    it very efficient. If there are no changes to the virtual DOM, no changes will
    be rendered in the page.


    This way we don''t have to worry about adding or removing elements. We just render
    the whole application every time, and let the Virtual DOM figure out what to actually
    update under the hood.


    # Model-View-Intent


    The architectural approach we used to build the Wikipedia real-time search is
    not just another framework''s random approach to programming UI. There''s a design
    pattern behind structuring code like we did: `Model-View-Intent` (MVI).


    Model-View-Intent is a term coined by the creator of Cycle.js. André Staltz, for
    an architecture inspired by the Model-View-Controller (MVC) architecture.⁴ In
    MVI we separate the functionality of an application into three components: the
    model, the view, and the controller.


    +   4. https://en.wikipedia.org/wiki/Model-view-controller'
