  md: "# Canceling Sequences\n\nIn RxJS we can cancel a running Observable. This is\
    \ an advantage over other asynchronous forms of communication, such as callbacks\
    \ and promises, which can't be directly cancelled once they're called (some implementations\
    \ support cancellation, though).\n\nThere are two ways we can cancel an Observable:\
    \ *implicitly* and *explicitly.*\n\n# Explicit Cancellation: The Disposable\n\n\
    Observables themselves don't have a method to get canceled. Instead, whenever\
    \ we subscribe to an Observable we get a Disposable object that represents that\
    \ particular subscription. We can then call the method `dispose` in that object,\
    \ and that subscription will stop receiving notifications from the Observable.\n\
    \nIn the following example, we subscribe two observers to the counter Observable,\
    \ which emits an increasing integer every second. After two seconds, we cancel\
    \ the second subscription and we see that its output stops the first subscriber's\
    \ output going:\n\n```\nsequences/disposable.js\nvar counter = Rx.interval(1000);\n\
    \nvar subscription1 = counter.subscribe(function(i) {\n  console.log('Subscription\
    \ 1', i);\n});\n\nvar subscription2 = counter.subscribe(function(i) {\n  console.log('Subscription\
    \ 2', i);\n});\n\nsetTimeout(function() {\n  console.log('Canceling subscription2!');\n\
    \  subscription2.dispose();\n}, 2000);\n```\n\n+   Subscription 1: 0\nSubscription\
    \ 2: 0\nSubscription 1: 1\nSubscription 2: 1\nCanceling subscription2!\nSubscription\
    \ 1: 2\nSubscription 1: 3\nSubscription 1: 4"
  merge: -1
  pgno: 41
- img_proc: true
  md: "# Implicit Cancellation: By Operator\n\nMost of the time, operators will automatically\
    \ cancel subscriptions for you. Operators such as range or take will cancel the\
    \ subscription when the sequence finishes or when the operator conditions are\
    \ met. More advanced operators such as withLatest or flatMap will internally create\
    \ and destroy subscriptions needed, they handle several Observables in motion.\
    \ In short, you should not worry about canceling most subscriptions yourself.\n\
    \n# Observables That Wrap External APIs\n\nWhen you're using Observables that\
    \ wrap external APIs that don't provide cancellation, but the underlying API will\
    \ not necessarily be canceled. For example, if you're using an Observable that\
    \ wraps a promise, the Observable will stop emitting when canceled, but the underlying\
    \ promise will not be canceled.\n\nIn the following code, we attempt to cancel\
    \ a subscription to an Observable that wraps a promise, and at the same time we\
    \ set an action in the traditional way for when the promise is resolved. The promise\
    \ should resolve in five seconds, but we cancel the subscription immediately after\
    \ creating it:\n\n```\nvar p = new Promise(function(resolve, reject) {\n  window.setTimeout(resolve,\
    \ 5000);\n});\n\np.then(function() {\n  console.log('Potential side effect!');\n\
    });\n\nvar subscription = Rx.Observable.fromPromise(p).subscribe(function(msg)\
    \ {\n  console.log('Observable resolved!');\n});\nsubscription.dispose();\n```\n\
    \nAfter 5 seconds, we see:\n\n+   Potential side effect!\n\nIf we cancel the subscription\
    \ to the Observable it effectively stops it from receiving the notification. But\
    \ the promise's then method still runs, showing that canceling the Observable\
    \ doesn't cancel the underlying promise.\n\nIt's important to know the details\
    \ of external APIs that we use in Observables. You might think you've canceled\
    \ a sequence, but the underlying API keeps running and causes some side effects\
    \ in your program. These errors can be really hard to catch."
  merge: -1
