  md: "# Scheduling for Animations\n\nFor fast visual updates such as canvas or DOM\
    \ animations, we can either use the interval operator with a very low millisecond\
    \ value or we can make a Scheduler that uses a function like setTimeout internally\
    \ to schedule notifications.\n\nNeither approach is ideal. In both of them we\
    \ are throwing all updates at the browser, which may not be able to process them\
    \ quickly enough. That happens because the browser is trying to render a frame\
    \ and it receives instructions to render the next one, so it drops the frame to\
    \ keep the speed. The results are choppy animations. And we have enough of those\
    \ on the web.\n\nBrowsers have a native way to handle animations, and they provide\
    \ an API to use it called requestAnimationFrame, requestAnimationFrame allows\
    \ the browser to optimize performance by lining up animations at the most appropriate\
    \ time and helping us achieve smoother animations.\n\n# There's a Scheduler for\
    \ That\n\nRxDOM library comes with some extra Schedulers, one of which is the\
    \ requestAnimationFrame Scheduler.\n\nYes, you guessed it. We can use this Scheduler\
    \ to improve our spaceship game video. In it, we established a refresh speed of\
    \ 40ms—roughly 25 frames per second—bycreating an interval Observable at speed\
    \ and then using combineLatest to update the game scene at the speed by interval\
    \ (because it is the fastest-updating Observable)... who knows how many frames\
    \ the browser is dropping by using this technique! We would get better performance\
    \ by using requestAnimationFrame.\n\nLet's create an Observable that uses Rx.Scheduler.requestAnimationFrame\
    \ as its Scheduler. Notice that it works similarly to how the interval operator\
    \ works:\n\n```\nch_schedulers/starfield_raf.js\nfunction animationLoop(scheduler)\
    \ {\n  return Rx.Observable.generate(\n    0,\n    function() { return true; },\
    \ // Keep generating forever\n    function(x) { return x + 1; }, // Increment\
    \ internal value\n    function(x) { return x; }, // Value to return on each notification\n\
    \    Rx.Scheduler.requestAnimationFrame); // Schedule to requestAnimationFrame\n\
    \  )\n}\n```"
  merge: -1
  pgno: 112
