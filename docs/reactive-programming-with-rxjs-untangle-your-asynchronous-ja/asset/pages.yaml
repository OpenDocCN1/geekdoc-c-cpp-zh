  md: 'Since these mechanisms are what we''ve always used to manage concurrency, it
    might be hard to think of a better way. But in this book I''ll show you one: reactive
    programming and RxJS try to solve all these problems with some new concepts and
    mechanisms to make asynchronous programming a breeze—and much more.


    # # What Is Reactive Programming?


    Reactive programming is a programming paradigm that encompasses many concepts
    and techniques. In this book I''ll focus particularly on creating, transforming,
    and reacting to streams of data. Mouse clicks, network requests, arrays of strings—all
    these can be expressed as streams to which we can "react" as they publish new
    values, using the same interfaces regardless of their source.


    Reactive programming focuses on propagating changes without having to explicitly
    specify how propagation happens. This allows us to state what our code should
    do, without having to code every step to do it. This results in a more reliable
    and maintainable approach to building software.


    # # What Is RxJS?


    RxJS is a JavaScript implementation of the Reactive Extensions, or Rx² is a reactive
    programming model originally created at Microsoft that allows developers to easily
    compose asynchronous streams of data. It provides a common interface to combine
    and transform data from widely different sources, such as filesystems operations,
    user interaction, and social-network updates.


    Rx started with an implementation for .NET, but today it has a well-maintained
    open source implementation in every major language (and some minor ones). It is
    becoming the standard to program reactive applications, and Rx''s main data type,
    the Observable, is being proposed for inclusion in ECMAScript 7 as an integral
    part of JavaScript.


    # # Who This Book Is For


    This book is for developers with some experience with JavaScript. You should be
    comfortable with closures and higher-order functions, and you should understand
    the scope rules in JavaScript. That being said, I try to explain the most complex
    language concepts we go through in this book.


    +   2 https://rx.codeplex.com/'
