  md: "# JS Arrays\n\n```\nvar src = [1, 2, 3, 4, 5];\nvar sum = src.reduce(function(a,\
    \ b) {\n  return a + b;\n});\n```\n\n# Observables\n\n```\nvar src = Rx.Observable.range(1,\
    \ 5);\nvar sum = src.reduce(function(acc, x) {\n  return acc + x;\n});\n```\n\n\
    ```\nsum.subscribe(logValue);\n```\n\nreduce is a powerful operator to manipulate\
    \ a sequence. It is, in the base implementation, for a subset of methods called\
    \ aggregate operators.\n\n# Aggregate Operators\n\nAggregate operators process\
    \ a sequence and return a single value. For example, Rx.Observable.first takes\
    \ an Observable and an optional predicate function and returns the first element\
    \ that satisfies the condition in the predicate.\n\nCalculating the average value\
    \ of a sequence is an aggregate operation as well. RxJS provides the instance\
    \ average operator, but for the sake of this exercise, we want to see how to implement\
    \ it using reduce. Every aggregate operator can be implemented using only reduce:\n\
    \n```\nsequences/marble.js\nvar avg = Rx.Observable.range(0, 5)\n  .reduce(function(prev,\
    \ cur) {\n    return {\n      sum: prev.sum + cur,\n      count: prev.count +\
    \ 1\n    };\n  }, {sum: 0, count: 0})\n  .map(function(o) {\n    return o.sum\
    \ / o.count;\n  });\n```\n\n```\nvar subscription = avg.subscribe(function(x)\
    \ {\n  console.log('Average is: ', x);\n});\n```\n\n< Average is: 2\n\nIn this\
    \ code we use reduce to add each new value to the previous one. Because reduce\
    \ doesn't provide us with the total number of elements in the sequence, we need\
    \ to keep count of them. We call reduce with an initial value of an object with\
    \ two fields, sum and count, where we'll store the sum and total count of elements\
    \ so far. Every new element will return the same object with updated values."
