  md: "This makes the developer's life much easier. You can rest assured that when\
    \ manipulating sequences, RxJS will do as much as necessary. This way of operating\
    \ is called lazy evaluation, and it is very common in functional languages such\
    \ as Haskell and Miranda.\n\n# RxJS's Subject Class\n\nA Subject is a type that\
    \ implements Observer and Observable types. As an Observer, it can subscribe to\
    \ Observables, and as an Observable it can produce values and have Observers subscribe\
    \ to it.\n\nIn some scenarios a single Subject can do the work of a combination\
    \ of Observers and Observables. For example, for making a proxy object between\
    \ a data source and the Subject's listeners, we can use this:\n\n```\nspaceship_reactive/subjects.js\n\
    var subject = new Rx.Observable.interval(300)\n.map(function(v) { return 'Interval\
    \ message #' + v; })\n.take(5);\n```\n\n```\nvar subscription = subject.subscribe(\n\
    \  function onNext(x) { console.log('onNext: ' + x); },\n  function onError(e)\
    \ { console.log('onError: ' + e.message); },\n  function onCompleted() { console.log('onCompleted');\
    \ }\n);\n```\n\n```\nsubject.onNext('Our message #1');\nsubject.onNext('Our message\
    \ #2');\n```\n\n```\nsetTimeout(function() {\n  subject.onCompleted();\n}, 1000);\n\
    ```\n\nOutput:\n\n+   - onNext: Our message #1\nonNext: Our message #2\nonNext:\
    \ Interval message #0\nonNext: Interval message #1\nonNext: Interval message #2\n\
    onCompleted\n\nIn the preceding example we create a new Subject and a source Observable\
    \ that emits an integer every second. Then we subscribe the Subject to the Observable.\
    \ After that, we subscribe an Observer to the Subject itself. The Subject now\
    \ behaves as an Observable."
