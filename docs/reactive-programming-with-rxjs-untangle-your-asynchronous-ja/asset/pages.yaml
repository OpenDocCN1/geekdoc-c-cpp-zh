  md: "we're running in the browser and doing significant work in the subscribe\n\
    and we don't want to block the UI thread with it.\n\n# Basic Rx Sulers\n\nLet's\
    \ look a bit more in depth at the Schedulers we used. The ones RxJS\nsoperators\
    \ use most are immediate, default, and currentThread.\n\n# Immediate Scheduler\n\
    \nThe Immediate Scheduler emits notifications from the Observable synchronous-\n\
    ly, whenever an action is scheduled on the Immediate Scheduler, it will be\nexecuted\
    \ right away, blocking the thread. RxObservable.range is one of the\noperators\
    \ that use the immediate Scheduler internally:\n\n```\nconsole.log('Before subscription');\n\
    Rx.Observable.range(1, 5)\n  .do(function(a) {\n    console.log('Processing value',\
    \ a);\n  })\n  .map(function(value) { return value * value; })\n  .subscribe(function(value)\
    \ { console.log('Emitted', value); });\n```\n\n```\nconsole.log('After subscription');\n\
    < Before subscription\nProcessing value 1\nEmitted 1\nProcessing value 2\nEmitted\
    \ 4\nProcessing value 3\nEmitted 9\nProcessing value 4\nEmitted 16\nProcessing\
    \ value 5\nEmitted 25\nAfter subscription\n```\n\nThe program output happens in\
    \ the order we expect. Each console.log statement\nruns before the notification\
    \ of the current item.\n\n# When to Use It\n\nThe immediate Scheduler is very\
    \ well suited for Observables that execute pre-\ndictable and not-very-expensive\
    \ operations in each notification. Also, the\nObservable has to eventually call\
    \ onCompleted."
