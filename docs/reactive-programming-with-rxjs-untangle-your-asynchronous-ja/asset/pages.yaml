  md: "# Purity and the Observable Pipeline • 43\n\ntransforming arrays in JavaScript\
    \ by chaining operators is expensive. Yet in this book I'm telling you to to design\
    \ your program by transforming sequences into new ones. Isn't that terribly inefficient?\n\
    \nChaining looks similar in Observables and in arrays; there are even methods\
    \ like filter and map that are present in both types. But there's a crucial difference:\
    \ array methods create a new array as a result of each operation, which is traversed\
    \ by the next operation. Observable pipelines, on the other hand, don't create\
    \ intermediate Observables and apply all operations to each element in one go.\
    \ The Observable is traversed only once, which makes chaining Observables efficient.\
    \ Check out the following example:\n\n```\nspaceship_reactive/array_chain.js\n\
    ```\n\n```\nstringArray // represents an array of 1,000 strings\n.map(function(str)\
    \ {\n  return str.toUpperCase();\n})\n.filter(function(str) {\n  return ^/([A-Z]+$/.test(str);\n\
    })\n.forEach(function(str) {\n  console.log(str);\n});\n```\n\nLet's suppose stringArray\
    \ is an array with 1,000 strings that we want to convert to uppercase and then\
    \ filter the ones that contain anything other than alphabet characters (or no\
    \ letters at all). Then we want to print each string of the resulting array to\
    \ the console.\n\nThis is what happens behind the scenes:\n\n+   Iterate through\
    \ the array and create a new array with all items uppercase.\n\n+   Iterate through\
    \ the uppercase array, creating another array with 1.000 elements.\n\n+   Iterate\
    \ through the filtered array and log each result to the console.\n\nIn the process\
    \ of transforming the array, we've iterated three times and created two completely\
    \ big arrays. This is far from efficient! You shouldn't program this way if you're\
    \ concerned about performance or you're dealing with big sequences of items.\n\
    \nThis is what the same operation would look like using Observables:\n\n```\n\
    spaceship_reactive/array_chain.js\n```\n\n```\nstringObservable // represents\
    \ an observable emitting 1,000 strings\n.map(function(str) {\n  return str.toUpperCase();\n\
    });\n```"
  merge: -1
  pgno: 60
- img_proc: true
  md: "```\n}}\n.filter(function(str) {\n  return /^[A-Z]+$/.test(str);\n})\n.subscribe(function(str)\
    \ {\n  console.log(str);\n});\n```\n\nObservable pipelines look extremely similar\
    \ to array chains, but their similar- ends here. In an Observable, nothing ever\
    \ happens until we subscribe to it, no how many queries and transformations we\
    \ apply to it. When we chain a transformation like map, we're composing a single\
    \ function that will operate on every item of the array once. So, in the preceding\
    \ code, this is what will happen:\n\n+   1. Create an uppercase function that\
    \ will be applied to each item of the Observable and return an Observable that\
    \ will emit these new items, whenever an Observer subscribes to it.\n\n+   2.\
    \ Compose a filter function with the previous uppercase function, and return an\
    \ Observable that will emit the new items, uppercased and filtered, but only when\
    \ an Observable is subscribed to it.\n\n+   3. Trigger the Observable to emit\
    \ items, going through all of them only once and applying the transformations\
    \ we defined once per item.\n\nWith Observables, we'll go through our list only,\
    \ and we'll apply the transformations only if absolutely required. For example,\
    \ let's say we added a operator to our previous example:\n\n```\nspaceship_reactive/array_chain.js\n\
    stringObservable\n.map(function(str) {\n  return str.toUpperCase();\n})\n.filter(function(str)\
    \ {\n  return /^[A-Z]+$/.test(str);\n})\n.take(5)\n.subscribe(function(str) {\n\
    \  console.log(str);\n});\n```\n\ntake makes the Observable emit only the first\
    \ n items we specify. In our case n is five, out of the thousand strings, we'll\
    \ receive the first five. The cool part is that our code will never traverse all\
    \ the items; it will apply our transformations to only the first five."
