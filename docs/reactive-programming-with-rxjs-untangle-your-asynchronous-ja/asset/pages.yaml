  md: "# Default Scheduler\n\nThe default Scheduler runs actions asynchronously. You\
    \ can think of it as a rough equivalent of setTimeout with zero milliseconds delay\
    \ that keeps the order in the sequence. It uses the most efficient asynchronous\
    \ implementation available on the platform it runs (for example, process.nextTick\
    \ in Node.js or setTimeout in the browser).\n\nLet's take the previous example\
    \ with range and make it run on the default Scheduler. For this, we'll use the\
    \ observeOn operator:\n\n```\nconsole.log('Before subscription');\nRx.observable.range(1,\
    \ 5)\n  .do(function(value) {\n    console.log('Processing value', value);\n \
    \ })\n  .observeOn(Rx.Scheduler.default)\n  .map(function(value) { return value\
    \ * value; })\n  .subscribe(function(value) { console.log('Emitted', value); });\n\
    console.log('After subscription');\n```\n\n+   - Before subscription\nProcessing\
    \ value 1\nProcessing value 2\nProcessing value 3\nProcessing value 4\nProcessing\
    \ value 5\nAfter subscription\nEmitted 1\nEmitted 4\nEmitted 9\nEmitted 16\nEmitted\
    \ 25\n\nThere are significant differences in this output. Our synchronous console.log\
    \ statement runs immediately for every value, but we make the Observable run on\
    \ the default Scheduler, which yields each asynchronously. That means our log\
    \ statements in the do operator are processed before the squared values.\n\n#\
    \ When to Use It\n\nThe default Scheduler never blocks the loop, so it's ideal\
    \ for operations that involve time, like asynchronous requests. It can also be\
    \ used in Observables that never complete, because it doesn't block the program\
    \ while waiting for new notifications (which may never happen).\n\n# Current Thread\
    \ Scheduler\n\nThe current Scheduler is synchronous like the immediate Scheduler,\
    \ but in case we use recursive operators, it enqueues the actions to execute instead"
  merge: -1
  pgno: 110
- img_proc: true
  md: "of executing them right away. A recursive operator is an operator that itself\
    \ schedules another operator. A good example is repeat. The repeat operator—if\
    \ given no parameters—keeps repeating the previous Observable sequence in the\
    \ chain indefinitely.\n\nYou'll get in trouble if you call repeat on an operator\
    \ that uses the immediate Scheduler (such as return). Let's try this by repeating\
    \ the value 10 and use take only the first value of the repetition. Ideally, the\
    \ code would print 10 once and then exit:\n\n```\n// Be careful: the code below\
    \ will freeze your environment!\nRx.Observable.return(10).repeat().take(1)\n.subscribe(function(value)\
    \ {\n  console.log(value);\n});\n```\n\nError: Too much recursion\n\nThis code\
    \ causes an infinite loop. Upon subscription, return calls onNext(10) and then\
    \ onCompleted, which makes repeat again to return. Since it is running on the\
    \ immediate Scheduler, this process repeats itself, causing an infinite loop and\
    \ never getting to take.\n\nBut if we schedule return on the currentThread Scheduler\
    \ by passing it as the second parameter, we get this:\n\n```\nvar scheduler =\
    \ Rx.Scheduler.currentThread;\nRx.Observable.return(10, 10).repeat().take(1)\n\
    .subscribe(function(value) {\n  console.log(value);\n});\n```\n\n+   - 10\n\n\
    Now, when repeat resubscribes to return, the new onNext call will be queued because\
    \ the previous onCompleted is still hanging. repeat then returns a disposable\
    \ object to take, which calls onCompleted and cancels the repetition by disposing\
    \ repeat, and ultimately the call from subscribe returns. \n\nAs a rule of thumb,\
    \ currentThread should be used to iterate on large sequences and when using recursive\
    \ operators such as repeat.\n\n# When to Use It\n\nThe currentThread Scheduler\
    \ is useful for operations that involve recursive operators like repeat, and in\
    \ general for iterations that contain nested operators."
