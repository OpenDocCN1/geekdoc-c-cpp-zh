  md: "# Sharing a Cold Observable\n\nLet's get back to our earthquake example. The\
    \ code we have so far looks reasonable; we have an Observable quakes with two\
    \ subscriptions: one that paints earthquakes on the map, and one that lists them\
    \ in the table.\n\nBut we can make our code more efficient. By having two subscribers\
    \ to quakes we re-fetch the data twice. You can check that by putting `console.log`\
    \ inside the `flatMap` operator in quakes.\n\nThis happens because quakes is a\
    \ cold Observable, and it will re-emit all its values to each new subscriber,\
    \ so a new subscription means a new JSON request. This impacts our application\
    \ performance by requesting the same resources twice over the network.\n\nFor\
    \ the next example we'll use the share operator, which automatically creates a\
    \ subscription to the Observable when the number of Observers goes from zero to\
    \ one. This spares us from calling connect:\n\n```\nexamples_earthquake_ui/code2js\n\
    var quakes = Rx.Observable()\n  .interval(5000)\n  .flatMap(function() {\n   \
    \ return Rx.DOM.jsonRequest({\n      url: QUAKE_URL,\n      jsonCallback: 'qefeed_callback'\n\
    \    });\n  })\n  .flatMap(function(result) {\n    return Rx.Observable.from(result.response.features);\n\
    \  })\n  .distinct(function(quake) { return quake.properties.code; })\n  .share()\n\
    ```\n\nNow quakes behaves like a hot Observable, and we don't have to worry about\
    \ how many Observers we connect to it, since they will all receive the same data.\n\
    \n# Buffering Values\n\nOur preceding code works well, but notice that we insert\
    \ a tr node every time we receive information from an earthquake. That's inefficient,\
    \ because with each insertion we are modifying the DOM and causing a repaint of\
    \ the page, making the browser do unnecessary work to calculate the new layout.\
    \ This can cause performance drop.\n\nIdeally, we would batch several earthquake\
    \ objects and insert each batch every few seconds. That would be tricky to implement\
    \ by hand because"
