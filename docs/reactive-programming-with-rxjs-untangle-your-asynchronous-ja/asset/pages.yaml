  md: "# Chapter 4. Building a Complete Web Application\n\n+   We call isHovering\
    \ with the current row and we subscribe to the resulting Observable. If the hovering\
    \ argument is true, we'll paint the circle red; otherwise, it will be blue.\n\n\
    +   We subscribe to the Observable created from the click event in the current\
    \ row. When in the row is listed, the map will be centered on the corresponding\
    \ circle in the map.\n\n# Making It Efficient\n\nExperienced front-end developers\
    \ know that creating many events on a page is a recipe for bad performance. In\
    \ our previous example, we created three events for each row. If we get 100 earthquakes\
    \ on the list, we would have 300 events floating around the page just to do some\
    \ light highlighting work! That is terrible for performance, and we can do better.\n\
    \nBecause events in DOM always bubble up (from children to parent elements), a\
    \ well-known technique among front-end developers to avoid attaching mouse events\
    \ to elements individually is to attach them instead to their parent element.\
    \ Once the event is fired on the parent, we can use the event's target property\
    \ to find the child element that was the event's target.\n\nBecause we need similar\
    \ functionality for the events click and mouseover, we'll create a function getRowFromEvent:\n\
    \n```\nexamples_earthquake_ui/code3.pairwise.js\nfunction getRowFromEvent() {\n\
    \  return Rx.Observable\n    .fromEvent(table,event)\n    .filter(function(event)\
    \ {\n      var el = event.tagName === 'TD' && el.parentNode.length;\n    })\n\
    \    .pluck('target', 'parentNode')\n    .distinctUntilChanged();\n}\n```\n\n\
    getRowFromEvent gives us the table row in which the event has happened. Here are\
    \ the details:\n\n+   We make sure that we get events happening in a table cell,\
    \ and we check that the parent of that cell is a row with an ID attribute. These\
    \ rows are the ones we tagged with the earthquake ID.\n\n+   The pluck operator\
    \ extracts the nested property parentNode inside the element's target property."
