  md: 'What if we treated that stream of click events as a data source that can be
    queried and transformed? After all, it''s no different from a database, one that
    emits values in real time. All we need a data type that abstracts the concept
    for us.


    Enter RxJS and its Observable data type:


    ```

    Rx.Observable.fromEvent(document, ''click'')

    .filter(function(c) { return c.clientX > window.innerWidth / 2; })

    .take(10)

    .subscribe(function(c) { console.log(c.clientX, c.clientY) })

    ```


    This code does the same as the code on page 4, and it reads like this:


    +   - Create an Observable of click events and filter out the clicks that happen
    on the left side of the screen. Print the coordinates of the first 10 clicks to
    the console as they happen


    Notice how the code is easy to read even if you''re not familiar with it. Also,
    there''s no need to create external variables to keep state, which makes the code
    self-contained and makes it harder to introduce bugs. There''s no need to clean
    up after yourself either, so no chance of introducing memory leaks by forgetting
    about unregistering event handlers.


    In the preceding section we created an Observable from a DOM event. An Observable
    provides us with a sequence or stream of events that we can manipulate as a whole
    instead of a single isolated event each time. Dealing with sequences gives us
    enormous power; we can merge, transform or pass around Observables easily. We''ve
    turned events that we can''t get a handle on into tangible data structure that''s
    as easy to use as an array, but much more flexible.


    In the next section we will see the principles that make Observables such a great
    tool.


    # Of Observers and Iterators


    To understand where Observables come from we need to look at their foundations:
    the Observer and Iterator software patterns. In this section we''ll take a quick
    look at them, and we''ll see how Observables combine concepts of both in a simple
    but powerful way.


    # The Observer Pattern


    For a software developer, it''s hard to hear about Observables and not think of
