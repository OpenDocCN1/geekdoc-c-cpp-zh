  md: "# Chapter 3. Building Concurrent Programs • 62\n\ncombineLatest emits the last\
    \ value that each Observable emitted, whenever an Observable emits a new value.\
    \ We can use this to our advantage. Whenever the mouse moves, combineLatest emits\
    \ the new Spaceship position and the last emitted value of playerFiring, which\
    \ will be unchanged unless we fire a new shot. We can then emit a value only when\
    \ the emitted is different from the previous one. The distinctUntilChanged operator\
    \ does the dirty work for us.\n\nThe operators distinct and distinctUntilChanged\
    \ allow us to filter out results that an Observable has already emitted. distinct\
    \ filters out any previously emitted and distinctUntilChanged filters out identical\
    \ results unless a different one is emitted in between. We only need to make sure\
    \ that the new shot is different from the previous one, so distinctUntilChanged\
    \ is enough for us. (It also saves us from the higher memory usage of distinct;\
    \ distinct needs to keep all the previous memory.)\n\nWe modify reactiveShots\
    \ so it only emits new shots, based on their timestamp:\n\n```\nspaceship_reactive/hero_shots.js\n\
    var HeroShots = Rx.Observable\n.combineLatest(\nplayerFiring,\nSpaceship,\nFunction(shotEvents,\
    \ spaceShip) {\n  return\n    timestamp: shotEvents.timestamp,\n    x: spaceShip.x\n\
    \  }\n})\n.distinctUntilChanged(function(shot) { return shot.timestamp; })\n.scan(push((shotArray,\
    \ shot){ shotArray.push({x:shot.x, y: HERO_Y}));\\));\n```\n\nIf everything went\
    \ well, we're now ready to shoot at enemies from our spaceship!\n\n# Enemy Shots\n\
    \nWe should allow enemies to shoot as well; otherwise it's a pretty unfair universe.\
    \ And a boring one! For enemy shots, we'll do the following:\n\n+   * Each enemy\
