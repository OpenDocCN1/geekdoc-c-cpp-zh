    \ + x);\n});\nvar observer2 = source.subscribe(function (x) {\n  console.log('Observer\
    \ 2: next value: ' + x);\n});\n```\n\nOutput:\n\n+   - Observer 1, next value:\
    \ 0\n- Observer 2, next value: 0\n- Observer 1, next value: 1\n- Observer 2, next\
    \ value: 1\n\nThat seems to. But now imagine that we need the second subscriber\
    \ to join three seconds after the first one:\n\n```\nhot_cold.js\nvar source =\
    \ Rx.Observable.interval(1000);\nvar observer1 = source.subscribe(function (x)\
    \ {\n  console.log('Observer 1: ' + x);\n});\n\nsetTimeout(function() {\n  var\
    \ observer2 = source.subscribe(function (x) {\n    console.log('Observer 2: '\
    \ + x);\n  });\n}, 3000);\n```\n\nOutput:\n\n+   - Observer 1: 0\n- Observer 1:\
    \ 1\n- Observer 1: 2\n- Observer 1: 3"
