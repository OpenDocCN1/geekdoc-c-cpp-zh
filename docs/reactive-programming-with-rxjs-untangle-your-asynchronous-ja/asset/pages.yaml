- img_proc: true
  md: "all the objects generated by range. Then we can pick up that array with a flatMap\
    \ operator that will transform the Observable into one that yields a value few\
    \ milliseconds. Using map we can increase the y-coordinate in each item of the\
    \ original array:\n\n```\nspaceship_reactive/starfield_1.js\nvar SPEED = 40;\n\
    var STAR_NUMBER = 250;\nvar StarStream = Rx.observable.interval(1, STAR_NUMBER)\n\
    .map(function() {\n  return {\n    x: parseInt(Math.random()) * canvas.width,\n\
    \    y: parseInt(Math.random()) * canvas.height,\n    size: Math.random() * 3\
    \ + 1\n  };\n})\n.toArray()\n.flatMap(function(starArray) {\n  return Rx.interval(SPEED).map(function()\
    \ {\n    if (star.y >= canvas.height) {\n      star.y = 0; // Reset star to top\
    \ of the canvas\n    }\n    star.y += 3; // Move star\n    return starArray;\n\
    \  });\n});\n```\n\nInside map we check if the y-coordinate is already outside\
    \ the scene, and in this case we reset it to 0. By changing the coordinates in\
    \ every star object we can keep using the same array of stars all the time.\n\n\
    Now we need a smaller helper function that \"paints\" an array of stars on our\
    \ canvas:\n\n```\nspaceship_reactive/starfield_1.js\nfunction paintStars(stars)\
