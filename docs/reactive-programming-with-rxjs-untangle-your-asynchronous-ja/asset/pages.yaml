- img_proc: true
  md: "model, the view, and the intent. MVI is designed to fit the Reactive model\
    \ of\nprogramming like a glove.\n\nMVI being reactive means that each component\
    \ observes its dependencies\n reacts to the dependencies' changes. This is different\
    \ from MVC, in which\na component knows its dependents and modifies them directly.\
    \ A component\n(C) declares which other components influence it, instead of other\
    \ components\nupdating (C) explicitly.\n\n![](img/a8eed7bbb390e0eff6b6561c329a113c_129_0.png)\n\
    \nThe three components in MVI are represented by Observables, the output of\n\
    each being the input of another component.\n\nThe model represents the current\
    \ application state. It takes processed user\ninput from the intent and it outputs\
    \ events about data changes that are-\nsumed by the view.\n\nThe view is a visual\
    \ representation of our model. It takes an Observable with\nthe model state, and\
    \ it outputs all the potential DOM events and the virtual\ntree of the page.\n\
    \nThe intent is the new component in MVI. An intent takes input from the user\n\
    and translates it to actions in our model.\n\nWe can make the three kinds of components\
    \ more clear in our application if\nwe reshape and rename our code a bit:\n\n\
    ```\ncycle/index-mvi.js\nfunction intent(JSONOP) {\n  return JSONOP.filter(function(res)\
    \ {\n    return res.request.indexOf(API_URL) === 0;\n  }\n  .concatAll()\n  .pluck('query',\
    \ 'search');\n}\n```"
