  md: 'Keep in mind that for this code to run, you need to include the file rx.dom
    from RxJS-DOM in the HTML. Notice how we''ve added a map operator transforms the
    earthquake objects into simple objects containing only the information we need
    for our visualization: latitude, longitude, and magnitude of the earthquake. The
    less functionality we put in the subscribe operator, the better.


    # Making It Real Time


    Our reactive version of the earthquake application doesn''t update the map of
    earthquakes in real time. To implement that, we''ll use the interval operator—which
    we saw earlier in this chapter—and the über-useful distinct operator. Let me show
    you the code and then we''ll go through the changes:


    quakes.subscribe(quake) {

    var coords = quake.geometry.coordinates;

    var size = quake.properties.mag * 10000;


    L.circle(coords[1], coords[0], size).addTo(map);


    In the preceding code, we abuse interval to make requests and process them at
    regular intervals of five seconds. interval creates an incrementing number every
    five seconds. We don''t do anything with those numbers; instead, we use flatMap
    to retrieve the data of theRequest. Notice also how we use retry to try again
    in case there are problems retrieving the list at first.


    The last operator we apply is distinct, which emits only elements that haven''t
    been emitted before. It takes a function that returns the property to check for
    equality. This way we never redraw earthquakes that are already drawn.'
