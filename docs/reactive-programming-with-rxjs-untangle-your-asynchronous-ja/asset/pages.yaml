  md: "Basic Sequence Operators • 19\n\nHere, the dotted arrows along the y-axis point\
    \ to the final result of the transformation applied to each element in sequences\
    \ A and B. The resulting Observable is represented by C, which contains the merged\
    \ elements of A and B. If elements of different Observables are emitted at the\
    \ same time, the order of these elements in the merged sequence is random.\n\n\
    # Basic Sequence Operators\n\nThe dozens of operators that transform Observables\
    \ in RxJS, the most used are those that any language with decent collection-processing\
    \ abilities also have: map, filter, and reduce. In JavaScript, you can find these\
    \ operators in Array instances.\n\nRxJS follows JavaScript conventions, so you'll\
    \ find that the syntax for the following operators is almost the same as for array\
    \ operators. In fact, we'll show the implementation using both arrays and Observables\
    \ to show how similar the two APIs are.\n\n# Map\n\nmap is the sequence transformation\
    \ operator most used. It takes an Observable and a function that applies to each\
    \ of the values in the Observable. It returns a new Observable with the transformed\
    \ values.\n\n![](img/a8eed7bbb390e0eff6b6561c329a113c_36_0.png)\n\n```\nvar src\
    \ = [1, 2, 3, 4, 5];\nvar upper = src.map(function(name) {\n  return name * 2;\n\
    });\n```\n\n```\nvar src = Rx.Observable.range(1, 5);\nvar upper = src.map(function(name)\
    \ {\n  return name * 2;\n});\n```\n\nupper.forEach(logValue);\nIn both cases,\
    \ code doesn't mutate.\n\nupper.subscribe(logValue);\n\nThis code, and code that\
    \ follows, uses this definition of logValue:\n\n```\nvar logValue = function(val)\
    \ { console.log(val) };\n```\n\nreport been • discuss"
