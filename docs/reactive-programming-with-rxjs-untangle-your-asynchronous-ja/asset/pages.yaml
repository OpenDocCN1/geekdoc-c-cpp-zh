  md: '# Preface


    Reactive programming is taking the software world by storm. This book combines
    the reactive programming philosophy with the possibilities of JavaScript, and
    you''ll learn how to apply reactive techniques to your own projects. We will focus
    on reactive programming to manage and combine streams of events. In fact, we''ll
    cover how to make entire real-world, concurrent applications just by declaring
    transformations on your program''s events.


    Most software today deals with data that''s available only over time: websites
    load remote resources and respond to complex user interactions, servers are distributed
    across multiple physical locations, and people have mobile devices that they expect
    to work at all times, whether on high-speed Wi-Fi or spotty cellular networks.
    Any serious application involves moving asynchronous parts that need to be efficiently
    coordinated, and that''s very hard with today''s programming techniques. On top
    of that, we have what''s always been here: servers crashing, slow networks, and
    software bugs we have to deal with.


    We can''t afford to keep programming the applications we always have. It worked
    for a while, but now it''s time for a new approach.


    # New World, Old Methods


    In recent years JavaScript has become the most ubiquitous language in the world
    and now powers the mission-critical infrastructure of businesses such as Walmart
    and Netflix, mobile operating systems such as Firefox OS, and complex popular
    applications such as Google Docs.


    And we''re still using good of imperative-style programming to deal with problems
    that are essentially asynchronous. This is very hard.


    JavaScript developers see the language''s lack of threads as a feature, and we
    usually write asynchronous code using callbacks, promises, and events.


    +   1. http://venturebeat.com/2012/01/24/why-walmart-is-using-node-js/, http://techblog.netflix.com/2014/06/scale-and-performance-of-large.html'
