  md: '# Creating Reusable Widgets


    As we make more complex applications, we''ll want to reuse some of their UI components.
    Our Wikipedia Search application is tiny for the sake of example, but it already
    has a couple of components that could be reused in other applications. Take the
    search input box, for example. We can definitely make this into its own widget.


    The objective is to encapsulate our widget in its own component so that we use
    it as any other DOM element. We should also be able to parameterize the component
    with any properties we want. Then we''ll use it in our applications like this:


    We''ll build our widget using a concept also introduced by Cycle.js, called nested
    dialogues. A nested dialog, or dialogue, is a function (like everything in Cycle.js)
    that takes an Observable of events as input, and outputs an Observable—with the
    result of applying these inputs to its internal logic.


    Let''s start building the search-box component. We first create a function that
    takes a responses parameter where we will pass it any properties we want from
    the main application:


    Every parameter searchbox receives an Observable. In this case props$ is an Observable
    that emits a single JavaScript object containing the configuration parameters
    for our Wikipedia search box.'
