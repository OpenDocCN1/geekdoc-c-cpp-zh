  md: "# Making a Real-Time Earthquake Visualizer • 33\n\n> Joe asks:\nWhat is ISJSONP?\n\
    \nJSONP—or JSON with *padding*—is a sneaky technique that web developers came\
    \ up to work around the browser restrictions when requesting data from third-party\
    \ domains.ᵃ\n\nIt bypasses these restrictions by loading external content script\
    \ tags instead of the usual XMLHttpRequest. Adding a script tag to the DOM loads\
    \ and executes its content directly, and the security restrictions are not applied.\n\
    \nThe remote request's content is then JSON wrapped in a function call (the in\
    \ JSONP).\n\n```\ncallbackFn({ a: 1, b: 2, c: 3 });\n```\n\nJSONP URLs usually\
    \ accept a query string parameter so that the caller can specify the name of the\
    \ callback. The developer then has to define in her code that has the same name\
    \ as the callback in the server response, and when the script tag is added to\
    \ the document, function will be called with the JSON data as the first parameter.\n\
    \nLibraries jQuery automate this process by internally creating the global function\
