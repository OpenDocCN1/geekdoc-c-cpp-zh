  md: 'Cygwin software provides you Linux like functionality under Windows. It comes
    with the gcc compiler. Once Cygwin is installed you need to download and install
    NetBeans for Windows from


    https://www.netbeans.org


    NetBeans merely provides the GUI. Internally it uses the gcc compiler that you
    downloaded with Cygwin.


    If you wish to create programs under Linux then you can use the gecko compiler
    that comes with Linux and then install the Linux version of NetBeans.


    You are free to use any of the compilers mentioned above for compiling programs
    in this book. If you wish to know my personal choice, I would prefer gcc with
