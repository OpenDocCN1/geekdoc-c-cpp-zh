  md: 'Chapter 0: % HIRUH :H % HJLQ «


    # Compilation using gecko plus NetBeans


    Carry out the following steps to compile and execute programs using gcc and any
    NetBeans version:


    +   (a) Start NetBeans from Start | All Programs | NetBeans.

    (b) Select File | New Project... from the File menu. Select Project Category as
    C/C++ and Project Type as C/C++ Application from the dialog that pops up. Click
    Next button.

    (c) Give a proper name of the project in Project Name TextBox (say Program1).
    Then click Finish.

    (d) Type the program.

    (e) Save the program using Ctrl + S.

    (f) Use F6 to compile and execute the program.


    # Compilation using Visual Studio / Visual Studio Express Edition


    Carry out the following steps to compile and execute programs using any Visual
    Studio version:


    +   (a) Start Visual Studio from Start | All Programs | Microsoft Visual Studio
    from start or Visual Studio Express Edition from Start | All Programs | Microsoft
    Visual C++ Express Edition.

    (b) Select File | New Project... from the File menu. Select Project Type as Visual
    C++ | Win32 Console Application (or Visual C++ | CLR Console Application) from
    the dialog that pops up. Give a proper name of the project in Name TextBox (say
    Program1). Then click on OK and Finish.

    (c) Type the program.'
