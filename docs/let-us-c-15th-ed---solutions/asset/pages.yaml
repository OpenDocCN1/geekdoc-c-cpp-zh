    !


    To understand language and gain confidence in working it would be required to
    type programs in this book and then instruct the machine to execute them. To carry
    any programs you need another program called Editor. Once the program has been
    typed it needs to be converted to machine language (0s and 1s) before the machine
    can execute it. To carry out this conversion, we need another program called Compiler.
    Compiler vendors provide an Integrated Development Environment (IDE) that consists
    of an Editor as well as the Compiler.


    There are several such IDEs available in the market targeted towards different
    operating systems. For example, Turbo C and Turbo C++ are popular compilers that
    work under MS-DOS, Visual Studio and Visual Studio Express Edition are the compilers
    that work under Windows, whereas gcc compilers works under Linux. Note that Turbo
    C, Turbo C++ and gcc compilers can also be installed on machines running Windows
    OS.


    Of these, Visual Studio Express Edition and gcc compilers are available free of
    cost. They can be downloaded from the following sites respectively:


    http://www.microsoft.com/express/Downloads/

    http://www.cygwin.com'
