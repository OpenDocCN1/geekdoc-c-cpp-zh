  mdcn: "\n\n![](img/8e0a31fe30a159a13fdfed13405b5ed7_116_0.png)\n\n图 9.1. Windows\
    \ 运行窗口\n\n当你进入命令行时，输入 `mysql` 并按回车。mysql 命令的语法如下：\n\n```\nmysql -h hostname -u\
    \ client -p\n```\n\n如果你在所有 PC 上安装了 MySQL，默认用户名是 root。你可以忽略主机名标志和值。当 MySQL 显示“Enter\
    \ password”（输入密码）时，输入你的密码。如果密码、用户名和主机名都正确，你将看到一个如图所示的横幅显示。\n\n![](img/8e0a31fe30a159a13fdfed13405b5ed7_116_1.png)\n\
    \n要关联 mysql 数据库，请在 MySQL 提示符处输入相应的命令：\n\nUSE mysql;\n\n系统返回：\n\nDatabase changed\n\
    \n如果你的 ISP 提供了不同的数据库名称，请使用该名称而不是 mysql。\n\n## 9.2 管理数据库\n\n现在你已经关联到数据库，可以创建用户、数据库和表了。如果你在托管环境中使用\
    \ MySQL 服务器，则不需要创建数据库或客户端账户，因为他们已经为你提供了用户名和数据库名称。\n\n### 创建用户\n\n要创建超出默认首选 root\
    \ 客户端的用户，请执行 grant 命令。grant 命令的语法如下：\n\n```\nGRANT PRIVILEGES ON DATABASE.OBJECTS\
    \ TO 'username'@'hostname' IDENTIFIED BY 'password';\n```\n\n例如：\n\n```\nGRANT\
    \ ALL PRIVILEGES ON .* TO \"michele\"@localhost\" IDENTIFIED BY 'secret';\n```\n\
    \n这创建了一个名为 michele 的客户端，它可以从本地访问任何内容。要切换到 michele 客户端，在 mysql 命令提示符处输入：\n\n```\n\
    \nexit\n\n```\n\n此时，从命令行使用新的用户名和密码启动 MySQL。启动 MySQL 时用户名和密的的语法符号为：\n\n```\nmysql\
    \ -h hostname -u username -p password\n```\n\n注意 `-p` 和密字之间没有空格。如果你只指定了 `-p` 标志而不带密码，MySQL\
    \ 会提示你输入密码。如果你不需要让客户端访问其表之外的表，请在 *GRANT PRIVILEGES ON ..* TO “michele” 代码中补充客户端数据库的名称，类似于：\n\
    \n```\nGRANT ALL PRIVILEGES ON store.* TO \"michele\"@localhost\" IDENTIFIED BY\
    \ 'mystery'; \n```\n\n你必须以 root 或具有权限的身份运行此行代码。在此代码中，单词 store 关联到分配权限的数据库名称，你将在接下来的部分创建它。\n\
    \n### 创建 MySQL 数据库\n\n你将创建一个名为 store 的数据库。CREATE DATABASE 命令的功能如下：\n\n```\nCREATE\
    \ DATABASE store;\n```\n\n如果执行成功，你将得到类似所示的结果：\n\nQuery OK, 1 row influenced (0.03\
    \ sec)\n\n数据库名不能包含任何空格。在如 Linux 和 Mac OS X 等 Unix 服务器上，数据库名也是区分大小大小的。\n\n要开始使用此数据库，输入：\n\
    \nUse store;\n\n你将得到结果：\n\nDatabase changed.\n\n在认为你已经准确完成了所有操作后，你已经准备好了新信息，并且它将被选择用于使用。创建表来存储信息是一个必要的想法，所以这正是我们我们要去的地方！\n\
    \n## 9.3 使用 phpMyAdmin\n\nphpMyAdmin 工具可以通过 http://www.phpadmin.net/ 访问，允许你通过你的\
    \ Web 程序控制 MySQL 数据库。所只需要一个安装了 PHP 的 Web 服务器和一个用于控制它的 MySQL 数据库。\n\n要引入 phpMyAdmin，请遵循以下步骤：\n\
    \n- 1. 从主页点击 Downloads（下载）。\n2. 下载存档文件，例如 all-languages.tar.gz（Unix 存档）或 all-languages.zip（Windows\
    \ ZIP 设计）。\n3. 解压存档（包括子目录）到 PC 上的目录。\n4. 将它们发送到可以执行 PHP 记录的 ISP 账户。或者，如果你在本地安装了\
    \ Web 服务器，将它们移动到文档根目录下具有一致名称的目录，例如 myadmin。\n5. 为了构建 phpMyAdmin，在 myadmin 目录内创建一个名为\
    \ config 的目录。在 Linux 上，执行这些命令来创建目录：\n\n```\nmkdir config\nchmod +w config\ncp\
    \ config.inc.php config/\n```\n\nchmod +w config/config\n\n6. 在你的 Web 程序中，访问 http://localhost/myadmin/setup.php。\n\
    \n你将看到一个如图所示的屏幕。\n\n![](img/8e0a31fe30a159a13fdfed13405b5ed7_120_0.png)\n\n7.\
    \ 在 Servers（服务器）部分，点击 Add（添加）按钮。设置页面所示。\n8. 大部分值可以留空。你需要在“password”字段中输入 root\
    \ 的密码。\n9. 从 Authentication（身份验证）选择“cookie”以限制对 MySQL 的访问。\n10. 点击“Add”（添加）。\n\
    11. 点击 Configuration（配置）部分的“Save”（保存）以保存你的配置。\n12. 将 config.inc.php 复制到 myadmin。\n\
