    \n# 第 7 章：函数\n\n为了编写不仅包含几页代码且具有良好体系以发挥价值的 PHP 程序，你必须对函数有深入的理解。函数让你无需在程序中反复编写相同的代码。函数的工作原理是为一组代码分配一个名为“函数名”的名称。随后，你通过调用该名称来执行代码。PHP\
