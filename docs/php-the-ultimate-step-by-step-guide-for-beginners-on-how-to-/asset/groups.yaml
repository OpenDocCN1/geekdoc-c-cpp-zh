    \ 语法。\n\n### XHTML 1.1\n\nXHTML 1.1 是 1.0 的重新格式版本。它是严格的，因为它使用了更大的元素集合。这是 W3C 的建议，提供了标准属性和需要符合\
    \ XHTML 环境的定义。HTML 的任何元素（例如表示性元素和框架）都被移除了。所有的呈现由层叠样式表（CSS）控制。此外，1.1 包含了对 XML 方言的支持。\n\
    \n## 14.4 使用 PHP 创建 XHTML\n\n通过 PHP 生成 XHTML 比创建旧 HTML 困难。\n\n示例 14.4. 从 PHP 创建\
