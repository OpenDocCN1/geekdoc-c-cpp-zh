    \ level indexes)\n\n对于你想要使用 Smarty 的每个应用程序，你必须设置一组四个索引。这四个索引分别用于模板、编译后的模板、保留模板和设计记录。尽管你可能不会使用这些功能，但你应该设置这些索引以防万一使用：\n\
    \n- 1. 在你的存档根目录下创建一个名为 `myapp/` 的索引。（你可以根据需要将其重命名，但对于后续内容，我们将统称为 `myapp/`。）\n\
    - 2. 在你刚刚创建的目录创建一个名为 `smarty` 的注册表（myapp/smarty）。\n- 3. 在你刚刚创建的 smarty 注册表中再创建四个注册表：formats、templates_c、store\
    \ 和 config。确保 Web 服务器对你之前创建的 `templates_c` 和 `store` 索引具有写入权限。\n\n你只需要创建一个设计和一个\
    \ PHP 文件来尝试。\n\n# 第 13 章：实战 PHP (CHAPTER 13: PRACTICAL PHP)\n\n在本章中，我们将开始尝试编写\
    \ PHP 程序时执行的更常见的任务，例如，处理字符串，以及显示字符串、日期和时间的不同格式。我们还将向你演示处理 PHP 程序创建或读取的文档的行业标准。此外，我们将提供一个案例，说明如何让客户端传输文件并在打开之前接受其内容。传输文件很有帮助，但如果记录没有合法验证，可能会成为安全风险。\n\
    \n在构建页面的 HTML 输出时，我们花费了大量的精力处理字符串。PHP 拥有丰富的函数数组，可以完成你可能需要的更改字符串实例的每一个任务。你还应该能够排列日期和时间。对日期进行任何形式的扩展或减法——例如由于某些原因跳过很长时间——如果没有专门用于处理日期的函数帮助，可能会迅速变得混乱。\n\
    \n# 13.1 字符串函数 (String Functions)\n\n由于你本质上在使用两种都能帮助操纵字符串的语言，你需要关于 PHP 和 MySQL\
    \ 中字符串函数的知识。你可能会认为，根据具体情况，在查询中或在 PHP 中修改字符串更合适。你将了解到以下字符串操作：\n\n- 为显示格式化字符串\n\
    - 计算字符串的长度\n- 将字符串的大小写更改为大写或小写\n- 在字符串内部搜索字符串并返回匹配的位置\n- 仅返回字符串的一部分，即子字符串。我们将从格式化字符串开始，这将帮助你完成剩余的所有主题题。\n\
    \n# 为显示格式化字符串 (Formatting Strings for Display)\n\n在这种情况下，你一直在使用 `echo` 和 `print`\
    \ 来显示字符串而没有做太大修改。\n\n你会发现两个名为 `sprintf` 和 `printf` 的函数。如果你熟悉其他编程语言（例如 C），你会发现这些函数的工作方式与其他所在的地方相同。如果你以前没有用过它们，不要担心——它们并不很难用。两者之间的主要区别是\
    \ `sprintf` 像 `print` 一样向输出显示一个格式化后的字符串，而 `sprintf` 将它生成的字符串保存在你指定的另一个字符串变量中。\n\
    \n# 使用 printf (Using printf)\n\n`printf` 函数通过将其第一个参数作为一个特殊的格式字符串来满足预期。格式字符串使用占位符来描述如何将参数插入字符串中。你可以指定细微元素，例如，在字符串中的数字。每个设置到字符串的参数在格式字符串中都有占位符。例如，输出对齐的数字。\n\
    \n# 填充 (Padding)\n\n你还可以指定每个字段的填充。要在左侧填充零，在格式规格中使用百分号 (`%`) 后加上要填充零的数量，如示例 11-4\
    \ 所示。如果参数的输出少于你指定的数字，将在左侧填充零。\n\n# 13.2 日期和时间函数 (Date and time functions)\n\n\
    有时你需要更改小数点后显示的数字位数。对于货币位置的浮点数字，这尤为真实。要指定小数点后的数字位数，使用在百分号后面带有数字数量的格式规格。例如，以下代码向你演示如何这样做：\n\
    \n```\n%.number_of_decimals_to_display\n```\n\n# 文档操作 (Document Manipulation)\n\
    \n有时你可能不想将数据存储在数据库中，而是需要简单地处理记录。案例是一个跟踪应用程序无法连接数据库的日志文件。将这些数据放在数据库中是困难的，因为在需要与其联系的确切时间无法访问。PHP\
    \ 提供了记录函数可以执行以下操作：\n\n- 检查记录是否存在\n- 创建记录\n- 追加记录\n- 重命名记录\n- 删除记录\n\n我们已经正式讨论了用于将数据专门拉入\
    \ PHP 脚本的 `include` 和 `require` 函数。在这里我们将专注于文件内容。\n\n函数与注意事项 (Functions and Precautions)\n\
    \n要检查文件是否存在，使用 `file_exists` 函数，它接受要检查的文件名称作为参数，如示例 11-20 所示。如果记录存在，它返回 TRUE；否则返回\
    \ FALSE。\n\n正如你预期的，记录确实存在：\n\n记录 exists.php 确实存在。\n\n"
