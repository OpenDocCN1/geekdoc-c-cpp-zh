    # CHAPTER 4: DYNAMIC CONTENT AND THE WEB


    To the normal client, a web page is simply just a web page. It opens in the browser
    and gives information. Looking closer, however, various pages stay for the most
    part same, while other pages change routinely. Pages that don''t change—static
    pages—are generally simple to make. Somebody needs to make an HTML document, by
    hand or with apparatuses/tools, and transfer it to a website where browsers can
    visit. A standout amongst the most well-known instruments to make HTML docs is
    Adobe Dreamweaver. At the point when changes are required, you simply supplant
    the old file with another one. Dynamic pages are made with HTML as well, although,
    rather than a basic and-post approach, the pages are upgraded routinely, even
    sometimes every time that they are asked.


    Static pages give hyperlinked text and maybe a login screen, however, past they
    don''t offer much association. By contrast, Amazon.com (http://www.amazon.com)
    exhibits a lot of what a dynamic site can do: your ordering information is logged
    plus Amazon offers suggestions taking into account your buying history when you
    access their page. At the end of the day, dynamic implies that the client interacts
    with the site past simply perusing pages, and the site responds in view of your
    activities. Going through each page is a personalized experience.


    Making dynamic pages—even a couple of years ago—implied composition of a considerable
    amount of code in the C or Perl dialects, and afterward calling those programs
    through a procedure called a Common Gateway Interface (CGI). Nonetheless, making
    such executable files wasn''t much fun, nor was taking in an entire new complex
    language.


    Thankfully, PHP and MySQL ensure making dynamic web sites are simpler and faster.'
