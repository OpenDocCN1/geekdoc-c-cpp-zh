    \ 循环依赖它。要小心不要导致死循环。其负面影响是无法返回页面并在 Web 服务器上消耗大量的处理时间。\n\n### do ... while 循环\n\n\
    `do ... while` 循环接收与 `while` 语句类似的表达式，但它将其放在最后。它的语法是：\n\n```\ndo {\ncode to execute;\n\
    } while (expression);\n```\n\n当你需要无论表达式值如何都至少执行一次代码时，这个循环很有帮助。例如，如图 6.15 所示，用这个循环检查到\
    \ 10。\n\n图 6.15. 使用 do ... 计数到 10\n\n```php\n<?php\n$num = 1;\ndo {\necho \"Number\
    \ is \".$num.\"<br/>\";\n$num++;\n} while ($num <= 10);\necho \"Done.\";\n?>\n\
    ```\n\n案例 6.15 创建与示例 4.14 相同的结果；如果你将 `$num` 的值改为 11，循环的形式会有不同：\n\n```php\n<?php\n\
    $num = 11;\ndo {\necho $num;\n$num++;\n} while ($num <= 10);\n?>\n```\n\n这产生了：循环上的代码显示\
    \ 11，因为循环可靠地至少执行一次。通过之后，`while` 评估为 `FALSE`，导致执行退出 `do...while` 循环。\n\n### for\
    \ 循环\n\n`for` 循环提供了与 `while` 循环相同的功能，尽管它们需要一个预定义的区域来更改计数器。它们的语法是：`for (初始化表达式;\
    \ 条件表达式; 修改表达式){要执行的代码}`\n\n```php\nfor ($num = 1; $num <= 10; $num++) {\n   \
    \ print \"Number is $num<br/>\";\n}\n```\n\n这产生了：\n\n- Number is 1\n- Number is\
    \ 2\n- Number is 3\n- Number is 4\n- Number is 5\n- Number is 6\n- Number is 7\n\
    - Number is 8\n- Number is 9\n- Number is 10\n\n等，让我根据提供的文本重新对齐。\n"
