    # CHAPTER 1: SETTING UP YOUR SERVER


    Now that we have everything ready, we will start by setting up the server. To
    do this, we need a local server. The most popular tool for this is XAMPP, which
    includes Apache, MySQL, Perl, and PHP.


    Once you have installed XAMPP, open the XAMPP Control Panel. You will see a list
    of modules. Click the "Start" button next to Apache and MySQL. If they turn green,
    your server is running!


    Now, go to your web browser and type `localhost` in the address bar. You should
    see the XAMPP dashboard. This confirms that your server is working correctly.


    ### 0.1 Creating the public HTML Pages


