    \ 函数会打印属性本身。如果给定数组，属性将以键和组件的形式展示出来。对象也使用类似的格式。在 PHP 5.0 中，`print_r` 和 `var_export`\
    \ 可以显示对象的保护和私有属性。\n\n运行从 `aggregate_info` 到 `imap_ping` 再到 `pdf_open_image` 的数组。由于这类函数有很多，我们在本章中只需涵盖一些基础知识，尽管我们会提供足够的数据，让你在短时间内通过使用函数看起来像个专家。\n\
    \n你可以访问 http://www.php.net 查看完整的函数列表。\n具体来说，我们将介绍以下内容：\n\n- 如何创建一个函数、给它命名并执行该函数\n\
    - 如何向函数传递值并在函数中使用这些值\n- 如何从函数返回值并在你的代码中应用它们\n- 在尝试调用函数之前验证该函数是否存在\n\n在编码时，何时可以将代码拆分为函数，这在很大程度上是一个主观的判断。毫无疑问，如果你发现自己在反复编写某几行代码，那么将这些代码封装成函数是非常明智的。这会让你的代码更易读，并且当你决定对这部分代码进行其他操作时，可以保护你无需进行多处改进，因为代码只需要修改一个处，而不是多个需要替换和更改的地方。\n\
    \n函数是一个允许接收值、对其进行处理并在随后执行操作的代码块。将制作蛋糕并放入烤箱烘焙比作一个函数。你将生团放入烤箱，面团混合物就是输入。烤箱烘焙面团；这就是函数。烘焙蛋糕的结果是可食的烘焙蛋糕。函数甚至可以接收其他输入，例如温度和烘焙时间。这些不同的输入被称为参数。\n\
    \n参数将数据发送到函数，随后函数执行代码。函数的参数范围从零个到整个列表不等。在图 7.1 中，你将利用 `echo` 函数来显示某些文本。你作为参数发送给它的\
    \ `message`。大多数函数要求你将参数放在括号内，但 `echo` 是一个特例。输出所有变量几乎是万无一失的！图 7.1 显示了脚本结果在程序中的外观。\n\
    \n图 7.1 无处不在的 Hello world!\n\n```php\n<?php\necho(\"Hello world!\");\n?>\n```\n\
    \n![](img/8e0a31fe30a159a13fdfed13405b5ed7_88_0.png)\n\necho 输出在浏览器窗口中的样式\n\n\
    一旦加载 PHP 文档，`echo` 函数基本上就会向程序/浏览器发送 \"Welcome world!\" 字符串。`echo` 实际上是一个 PHP 语言结构。基本上，这意味着它有能力在不将其参数放在括号内的情况下工作。需要注意的是，在大多数情况下，真正的函数需要括号。\n\
    \n你可以使用 PHP 的众多内置函数之一，也可以定义自己的函数。我们将更多地讨论识别自己的函数。\n\n## 7.1 调用函数\n\nPHP 中有许多内置函数。调用函数最常见的方法是使用其名称后跟括号。如果函数需要参数，这些参数将位于括号内。例如：\n\
    \n```php\nfunction greet($name) {\n  echo \"Hello, \" . $name . \"!\";\n}\n\n\
    greet(\"Alice\"); // 输出: Alice!\n```\n\n如果函数使用 `return` 语句返回值，该值可以赋值给变量：\n\n```php\n\
    function add($a, $b) {\n  return $a + $b;\n}\n\n$result = add(5, 3); // $result\
    \ 现在为 8\n```\n\n函数也可以通过引用调用，允许函数修改传递的变量。这是通过使用符号 `&` 实现。\n\n```php\nfunction addToTen(&$value)\
    \ {\n  $value += 10;\n}\n\n$number = 5;\naddToTen($number); // $number 现在为 15\n\
    ```\n\n## 7.2 定义函数\n\n要定义函数，使用 `function` 关键字后跟函数名称、括号和代码块。函数内的代码在大括号内。\n\n```php\n\
    function myFunction() {\n  // 要执行的代码\n}\n```\n\n函数也可以接收参数，这些是在括号内定义的变量。\n\n```php\n\
    function myFunction($param1, $param2) {\n  // 使用 $param1 和 $param2\n}\n```\n\n\
    你可以为参数提供默认值。调用函数时如果没有提供参数，则使用默认值。\n\n```php\nfunction greet($name = \"Guest\"\
    ) {\n  echo \"Hello, $name!\";\n}\n\ngreet(); // 输出: Hello, Guest!\ngreet(\"Alice\"\
    ); // 输出: Hello, Alice!\n```\n\n函数也可以使用 `return` 语句返回值。遇到 `return` 语句时，函数停止执行并返回指定的值。\n\
    \n```php\nfunction multiply($a, $b) {\n  return $a * $b;\n}\n\n$product = multiply(4,\
    \ 5); // $product 现在为 20\n```\n\n## 7.3 作用域\n\nPHP 中的变量具有局部作用域。在函数内部定义的变量是该函数的局部的，无法从外部访问。\n\
    \n```php\n$x = 5; // 全局变量\n\nfunction myFunction() {\n  $x = 10; // 局部变量\n  echo\
    \ $x; // 输出 10\n}\n\nmyFunction();\necho $x; // 输出 5\n```\n\n要在函数内部访问全局变量，必须使用\
    \ `global` 关键字。\n\n```php\n$x = 5;\n\nfunction myFunction() {\n  global $x;\n\
    \  $x = 10;\n  echo $x; // 输出 10\n}\n\nmyFunction();\n```\n\n或者，你可以使用 `$GLOBALS`\
    \ 数组来访问全局变量。\n\n```php\n$x = 5;\n\nfunction myFunction() {\n  echo $GLOBALS['x'];\
    \ // 输出 5\n}\n\nmyFunction();\n```\n\n"
