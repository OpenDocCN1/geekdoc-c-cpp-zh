    );\n\nif (!$connection) {\n  die(\"无法连接到数据库: \" . DB::error_message());\n}\n\n\
    $query = \"DROP TABLE buys\";\n\n$result = $connection->query($query);\nif (DB::isError($result))\
    \ {\n  die(\"无法查询数据库: \" . DB::error_message());\n}\n\necho \"Table dropped effectively!\"\
    ;\n\n$connection->disconnect();\n?>\n```\n\n既然你已经处理过执行几个控制数据库对象的 SQL 命令，你已经准备好处理表中的数据了。实际上，你必须向表中添加行，因为你正在嵌入新数据。\n\
    \n## 添加数据\n\n要向你新的 `buys` 表中添加一条购买记录，你将在查询中使用 `INSERT` 语句。图 15.3 显示了如何操作。可以自由地运行示例\
    \ 15.1，以便你有一个可以插入信息的表。\n\n示例 15.3. 在 insert.php 中使用预定义的 INSERT 语句\n\n```php\n\
    <?php\nrequire_once('db_login.php');\nrequire_once('DB.php');\n\n$connection =\
    \ DB::connect\n  \"mysql://$db_username:$db_password@$db_host/$db_database\");\n\
    \nif (!$connection) {\n  die(\"无法连接到数据库: \" . DB::error_message());\n}\n\n$query\
    \ = \"INSERT INTO buys VALUES (NULL,'mdavis',2,NULL);\";\n\n$result = $connection->query($query);\n\
    \nif (DB::isError($result)) {\n  die(\"无法查询数据库: \" . DB::error_message());\n}\n\
    \necho \"Embedded effectively!\";\n\n$connection->disconnect();\n?>\n```\n"
