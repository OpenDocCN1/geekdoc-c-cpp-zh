    \ World!\" 的内存区域）。\n\n正如在本部分已经检查过的，变量引用有助于将变量作为引用传递给函数。这允许函数修改你基础代码中的变量，而不是修改一个在函数结束时丢失的本地副本。\n\
    \n在不使用引用运算符的情况下将变量赋值给另一个变量会导致变量的副本被设置在内存的另一个位置。可以更改新变量而不会修改第一个变量。虽然这会占用更多内存，但如果你不想更改第一个变量的值，这是最好的方法。\n\
    \n既然你现在已经全面学习了函数和类，你已经准备好开始处理更复杂的信息了，例如数组。在处理来自数据库的信息时，数组将变得非常有价值，因为它们无疑可以持有查询结果的信息。\n\
    \n# 第 8 章：数组\n\n变量对于存储单条数据非常棒，但当你必须存储一整组数据的信息时（例如查询的结果）会发生什么？在这种情况下，请使用数组。数组是存储许多信息的特殊变量类型。数组允许你单独访问存储在其中的任何属性，同时又能复制和控制数组。\n\
    \n## 8.1 数组基础\n\n要处理数组，你需要理解两个术语：索引（index）和元素（element）。索引是访问元素的键，而元素是存储在数组中的值。在\
    \ PHP 中，数组默认是从零索引的，这意味着第一个元素位于索引 0，第二个位于索引 1，依此类推。\n\n既然你现在已经全面学习了函数和类，你已经准备好开始处理更复杂的信息了，例如数组。在处理来自数据库的信息时，数组将变得非常有价值，因为它们无疑可以持有查询结果的信息。\n\
    \n# 第 9 章：与 MySQL 交互\n\nMySQL 有它自己的客户端界面，允许你移动信息和更改数据库设计。注意你应该使用密码登录。分配数据库客户端可以限制对表的访问。每个\
    \ MySQL 服务器可以有多个数据库。\n\n## 9.1 MySQL 数据库\n\nMySQL 数据库是相关联表的集合。要在 PHP 中处理 MySQL，你首先需要建立与数据库的连接。这可以使用\
    \ `mysqli` 扩展来实现。\n\n```php\n<?php\n$mysqli = new mysqli(\"localhost\", \"username\"\
    , \"password\", \"database_name\");\n\n// 检查连接\nif ($mysqli->connect_error) {\n\
    \  die(\"连接失败: \" . $mysqli->connect_error);\n}\necho \"连接成功\";\n?>\n```\n\n"
