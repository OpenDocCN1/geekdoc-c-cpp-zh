    # 4.1 HTTP and the Internet


    Some basic knowledge of how the Internet functions may be helpful on the off chance
    that you haven''t programmed for the Web recently. The HyperText Transfer Protocol
    (HTTP) identifies how site pages are exchanged over the Internet. HTTP is the
    system used to exchange or pass on data on the World Wide Web. Its unique reason
    for existing was to give an approach to publish, distribute and recover HTML pages.
    The World Wide Web Consortium (W3C) and the Internet Engineering Task Force harmonized
    the development of HTTP, which are request-and-response protocols that join customers
    and servers. The client at the starting point, normally a web browser, is alluded
    to as the user agent. The destination server, which stores or builds resources
    as well as enclosing HTML documents and pictures, is known as the original server.
    Between the user agents and root server, there may be few intermediaries such
