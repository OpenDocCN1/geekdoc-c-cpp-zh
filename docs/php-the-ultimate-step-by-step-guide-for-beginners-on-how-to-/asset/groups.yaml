  mdcn: "\n\n## 条件语句\n\n条件语句与变量一样，都是构建 PHP 开发体系的基础组件。\n\n它们根据代码中设置的依据来改变脚本的执行流程。PHP\
    \ 中有三种基本的条件语句：\n\n- if\n- ? : (if 语句的简写)\n- switch\n\n当你有许多需要执行的操作，并且需要根据变量的内容采取不同的活动时，switch\
    \ 语句非常有帮助。在本节的稍后部分，将详细介绍 switch 语句。\n\n## if 语句\n\n该语句允许在提供的条件为 **TRUE (真)** 时执行一段代码；通常情况下，该代码块不会执行。条件可以是任何表达式，包括对非零、相等性、空值、变量以及函数返回属性的测试。\n\
    \n无论如何，你编写的每一个条件语句都包含一个限制子。如果条件为 **TRUE**，则执行大括号 `{}` 中的代码块。如果不是，PHP 将忽略它并移动到第二个条件，继续执行所有组合的语句，直到\
    \ PHP 遇到 else。此时，只有当 IF 条件结果为 **FALSE (假)** 时，才会执行该块；否则，如果块中只有一行代码需要执行，则不需要大括号。else\
    \ 解释并不总是需要的。\n\nelse 块必须可靠地放在最后，并被视为默认活动处理。这类似于分号 (`;`)。常见的真条件包括：\n\n- $var，如果\
    \ $var 具有除空集 (0)、空字符串或 NULL 以外的属性\n- isset($var)，如果 $var 具有除 NULL 以外的属性，包括空集或空字符串\n\
    - TRUE 或任何变体\n\n我们还没有讨论第二个项目点。`isset()` 是一个检查变量是否设置过的函数。已设置的变量具有 NULL 以外的值。\n\n\
    if 语句的语法如下：\n\n```php\nif (conditional expression){\n  piece of code;\n}\n```\n\
    \n如果条件块中的表达式评估结果为 **TRUE**，则执行其随后的代码块。在这种情况下，如果变量 $username 被设置为 'Administrator'，则会打印欢迎消息。如果不是，则什么都不会发生。\n\
    \n```php\nif ($username == \"Administrator\") {\n  echo ('Welcome to the administrator\
    \ page.');\n}\n```\n\n如果你只需要执行一条语句，则不需要大括号，但始终使用它们是一个良好的习惯，因为这使得代码更易读且更难被修改。\n\
    \n## else 语句\n\n可选的 else 语句在返回条件为 **FALSE (假)** 时提供一段执行的默认代码。在没有 if 语句的情况下无法使用\
    \ else，因为它本身不接受条件。因此，在代码中，else 和 if 需要始终成对出现。\n\n当你使用属性开始编写代码段时，请记住完成 if 条件判断的代码块。和\
    \ if 块一样，else 块也应该使用大括号来开始和结束代码。\n\n## elseif 语句\n\n上述的大部分内容都非常棒，但当你需要同时测试几个条件时例外。\n\
    \n要做到这一点，你可以利用 elseif 语句。它考虑测试额外的条件，直到发现其中一个为真或直到遇到 else 块。每个 elseif 都有其特定的代码块，专门紧跟在\
    \ if 条件之后。elseif 必须位于 if 语句之后，以及 else 语句（如果存在）之前。\n\n```php\nif ($username ==\
    \ \"Admin\"){\n  echo('Welcome to the administrator page.');\n} elseif ($username\
    \ == \"Guest\"){\n  echo('Please investigate around.');\n} else {\n  echo(\"Welcome\
    \ back, $username.\");\n}\n```\n\n在这里，你可以检查两个条件，并根据 $username 的属性采取不同的活动。此时，你还有另一种选择，如果\
    \ $username 不是前两个之一，则执行其他操作。\n\n下一个结构扩展了 if/else 语句的思想，但它允许你有效地检查一个表达式的多个可能结果，而无需为每个值编写一个不同的\
    \ if/else。\n\n## ? 运算符\n\n? 运算符是一个三元运算符，这意味着它接受三个操作数。它像语句一样工作，但从两个表达式中返回一个值。条件表达式决定了表达式的值。使用冒号\
    \ (:) 来分隔这些表达式，如下所示：\n{expression} ? return_when_expression_true : return_when_expression_false\n\
    \n### Case 4.8. 利用 ? 运算符制作消息\n\n```php\n<?php\n$logged_in = TRUE;\n$user = \"\
