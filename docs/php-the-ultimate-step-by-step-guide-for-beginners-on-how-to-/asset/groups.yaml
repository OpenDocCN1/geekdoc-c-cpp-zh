    PHP 提供了几个函数来让你了解不同的记录属性。PHP 能够从你的框架中的记录中读取信息，并向其写入信息。另一方面，它并不仅于此。它还配备了一套完整的文档和目录控制
    API，允许你：


    - 查看和修改文档属性

    - 读取和列出目录内容

    - 修改文档权限

    - 将文档内容检索到各种本地信息结构中

    - 根据特定示例搜索文档


    这种通过 API 进行的大部分文档控制都是强大且灵活的。PHP 拥有大量的特殊函数，包括所有的文档控制函数。


    ## 13.3 文件操作


    既然你知道一个文件存在，你可能认为你已经完成了，但实际上并非如此。文件存在并不意味着你可以读取、写入或执行它。要检查这些属性，可以使用 `is_readable`
    检查读取权限，使用 `is_writable` 检查写入权限，以及使用 `is_executable` 检查执行文件的能力。每个函数都接受文件名作为参数。除非你知道文件与你的脚本在同一个目录，否则必须在文件名中指定文件的完整路径。你可以使用连接符将路径和文件名组合，例如：


    $file_name = $path_to_file . $file_name_only;


    ### URL 包装器


    PHP 为文件系统函数构建了两种 URL 约定，包括 `file` 和 `copy`。除了这两个包装器，从 PHP 4:3.0 开始，你可以利用 PHP 脚本和
    `stream_wrapper_register` 编写自己的包装器。默认包装器是 `file://`，用于 PHP 的本地文件系统。如果你指定一个相对路径（即不以
    `/`、`\` 或 Windows 盘符开头的路径，例如 `C://`），该路径将相对于当前工作目录。


    通常这是脚本所在的目录，除非它显然被更改了。通过某些函数（例如 `fopen` 和 `file_get_contents`），可以使用 `include_path`
    来查找相对路径。


    ## 13.4 调用系统调用


    对于基于 PHP 的网站来说，允许文件传输是一个非常基本的要求。例如，在一个博客页面上，客户端可能需要传输一张图片来随其文章发布。


    我们将在第 17 节介绍传输文件的步骤。PHP 允许你通过表单数据来实现这一点。


    当你使用文件上传表单字段时，客户端程序会弹出文件选择对话框，因此你不需要担心这一点。包含在文件上传字段中的代码是 `<input type="file" name="file">`。你还应该在表单标签中包含
    `enctype="multipart/form-data"`。这允许文件随表单提交一起发送。


    ## 第 14 章：XHTML


    既然你已经学会了使用 PHP 和 MySQL 构建动态页面，那么早晚研究构建你网站页面基础的 HTML 标记的变化。你将了解到 XHTML、它的要求以及为什么它值得投入额外的精力去创建。请记住，为了从你的
    PHP 脚本创建高质量的 Web 内容，标记必须符合标准。将 XHTML 输出视为经过 PHP 和数据库函数处理并请求页面后的最终成品。我们还将检查你的脚本生成的
    XHTML 输出，以发现任何错误。


    XHTML 代表可扩展超文本标记语言（Extensible HyperText Markup Language）。XHTML 是一种类似于 HTML 的标记变体，但根据
    XML 的要求具有更严格的语法。HTML 基于 SGML，SGML 虽灵活但处理起来复杂，而 XML 简化了 SGML，使其在保持灵活的同时更容易转换。XHTML
    语言结构看起来非常像 HTML 语言结构，使用更明显且没那么多的符号（例如 `<` 和 `>`）来标识标签，但对这些标签的呈现有更严格的要求。符合这些语法要求的
    XHTML 文档被称为良好的（well-formed），而符合语言结构以及 DTD 中包含的辅助规则的 HTML 文档被称为有效的（valid）。XHTML
    可以使用任何标准 XML 库处理，而 HTML 通常使用专门为 HTML 修改的解析器。你可以将 XHTML 视为 HTML 和 XML 的许多交叉点，因为它是两者的重新构建。展示变化的最简单方法是显示一个
    HTML 文档及其对应的 XHTML 文档。首先，这是一个有效的 HTML 4.0 ：


    这里发生了什么变化？


    - 在最开头有另一个 XML 声明，标识文档为 XML 1.0，使用 UTF-8 编码。如果你的文档使用 UTF-8 编码（或 ASCII，其子集），你可以完全跳过它。

    - DOCTYPE 声明发生了微变化。

    - 所有 HTML 标记现在都是小写。（XHTML 规范要求小写。）

    - `html` 元素包含一个 `xmlns` 属性（标识 XHTML 命名空间，本文稍后会描述），以及一个 `xml:lang` 属性，用于补充 XML
    处理器的之前的lang` 属性。

    - `<BR>` 标签现在是 `<br/>` 标签，末尾的斜杠（/）表示它是一个“空元素”，不会有结束标签。

    - 还有另一个结束标签 `</p>`，它结束了 `body` 内部第一行的 `<p>`。XHTML 不允许你在使用空元素的情况下拥有只有开始标签没有结束标签的标签。尽管这个文档非常短……


    正如我们之后将看到的，有几个不同的限制，但这些是需要关注的关键点。


    ## 14.1 为什么要用 XHTML？


    世界维网联盟（W3C）创建 XHTML 有多种原因，包括：


    - Web 内容被传输到比传统电脑更多的设备上，例如黑莓手机、手机和其他移动设备。XML 更严格的语言结构为这些设备及其后端框架减少了一层复杂的处理。

    - 从事于动态 HTML 和其他脚本技术工作的开发人员发现，HTML 的灵活性有时意味着他们期望控制的文档结构与预期不同，有时在不同浏览器和程序之间甚至不同。XHTML
    更严格的结构消除了这些歧义。

    - 随着越来越多的文档管理工具包含 XML 支持，XHTML 与 XML 的相似性使得无需调整即可在 XHTML 上使用这些工具。

    - 在宏观上，XHTML 使文档之间具有更好的一致性。虽然 XML 更严格的错误检查听起来像是一种负担，但它可以轻松发现并修正错误。

    - 尽管得到了大量的程序支持，W3C 认为迁移到 XML 基础将允许设计师创建自定义词汇，与优秀的 HTML 词汇相结合。W3C 自己的建议包含了视觉和音频、设计和结构。

    - XHTML 还可以与其他 XML 词汇混合，使得这种广泛理解的词汇在新环境中更易复用。

