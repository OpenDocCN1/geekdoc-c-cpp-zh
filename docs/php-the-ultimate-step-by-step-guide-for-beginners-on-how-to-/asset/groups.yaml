    Now do the same with the echo parameter set to FALSE\n\nHELLO WORLD!\n\n## 参数引用\n\
    \n当你向函数传递一个查询时，函数内部会创建一个本地副本来存储该值。对该值进行的任何更改只会影响函数中的变量本地副本，而不影响参数的源。你可以通过定义引用参数来定义修改源变量的参数。\n\
    \n引用参数在函数定义的参数之前直接放置一个安培符号 (&) 来定义引用。我们应该修改示例 7.5 中的 `capitalize` 函数，使其接收一个用于大写字符串的引用变量，如示例\
