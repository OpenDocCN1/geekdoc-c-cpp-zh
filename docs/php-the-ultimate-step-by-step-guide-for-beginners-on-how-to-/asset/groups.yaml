    \ World!”的初始估计。\n\n## 包含和引入 PHP 文件\n\n为了让你的代码更易读，你可以将函数放在不同的文件中。\n\n从互联网下载的许多\
    \ PHP 扩展都包含了现在已记录的函数，你基本上将它们包含在你的 PHP 程序中。另一方面，PHP 提供了四个函数，允许你从不同的文件中嵌入代码：\n\n\
    - include\n- require\n- include_once\n- require_once\n\n每一个 `include` 和 `require`\
    \ 函数都接受一个本地文档作为输入。无论处理无法检索资源的方式如何，`require` 和 `include` 函数的功能都非常相似。例如，`include`\
    \ 和 `include_once` 在资源不可用时会给出提示并尝试继续执行程序。`require` 和 `require_once` 函数在无法恢复资源时会停止特定页面的准备。现在我们将更具体地介绍这些函数。\n\
    \n## include 语句\n\n`include` 语句允许你将其他 PHP 脚本包含并合并到自己的脚本中。你可以将其视为获取包含的文件并将其嵌入你的\
