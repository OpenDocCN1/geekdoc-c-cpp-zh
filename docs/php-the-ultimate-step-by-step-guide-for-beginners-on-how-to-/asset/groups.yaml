    # 使用嵌入链接显示结果


    你可能需要让浏览器具备点击超链接的能力，以启动与查询结果中当前行相关的活动。你可以通过在查询结果显示在屏幕上时包含指向查询结果的 URL 链接来实现这一点。这些链接包含一个指向该行的唯一标识符，以及处理该活动的脚本。


    作为链接目标的 PHP 脚本主要根据传递给它的唯一标识符对数据库进行查询。你可以执行的活动类型范围从格式化或删除某行，到从相关表中获取详细信息（例如，获取书标题的作者）。

