    ;\n```\n\n```php\n// 创建 footer 内容\n$footer = '</html>';\n// 显示全部\necho $doctype;\n\
    echo $head;\necho $body;\necho $footer;\n?>\n```\n\n由于我们确保了 XHTML 增强了标准 HTML 的兼容性，我们准备好进入\
    \ PHP 和 MySQL 程序结合。在接下来的章节中，我们将讨论如何在 PHP 中修改数据库对象和信息。我们将学习如何创建对数据库特定数据操作的动态 HTML\
    \ 页面。\n\n# 章：修改 MySQL 对象和 PHP 数据\n\n## 15.1 从 PHP 修改数据库对象\n\nSQL 查询字符串是提供数据库命令的基本机制。你可以以执行查询的方式使用标准\
    \ SQL 创建和修改数据库对象。有时你需要在 PHP 中创建数据库对象。我们将从创建表开始，这是一个创建对象的示例。\n\n## 15.2 操作表数据\n\
    \n我们之前创建了 `books` 和 `authors` 表，但还没有创建 `buys` 表。我们将使用示例 15.1 显示的 PHP 创建它。\n\n\
    示例 15.1. 在 create_table.php 页面中创建表\n\n```php\n<?php\ninclude('db_login.php');\n\
    require_once('DB.php');\n\n$connection = DB::connect(\n  \"mysql://$db_username:$db_password@$db_host/$db_database\"\
    );\nif (!$connection) {\n  die(\"无法连接到数据库: \" . DB::error_message());\n}\n\n$query\
    \ = 'CREATE TABLE buys (\n  purchase_id int(11) NOT NULL AUTO_INCREMENT,\n  firstname\
    \ varchar(50) NOT NULL,\n  lastname varchar(50) NOT NULL,\n  amount decimal(10,2)\
    \ NOT NULL,\n  PRIMARY KEY (purchase_id)\n) ENGINE=InnoDB';\n\n$result = $connection->query($query);\n\
    if (DB::isError($result)) {\n  die(\"无法查询数据库: \" . DB::error_message());\n}\n\n\
    echo \"Table created successfully!\";\n?>\n```\n\n## 删除表\n\n要删除你上面创建的表，请使用以下代码。\n\
    \n示例 15.2. 在 drop.php 中删除 buys 表\n\n```php\n<?php\nrequire_once('db_login.php');\n\
