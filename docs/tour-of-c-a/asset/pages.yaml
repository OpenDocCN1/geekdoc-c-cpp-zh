    \ to design a template with semantically meaningful constraints on its arguments\
    \ (§8.2.4).\n\n# 8.2.2 Concept-based Overloading\n\nOnce we have properly specified\
    \ templates with their interfaces, we can overload based on their properties,\
    \ such as we do for functions. A slightly simplified standard-library function\
    \ advance() that advances an iterator (§13.3).\n\nClick here to view code image\n\
    \n```\ntemplate<forward_iterator Iter>\nvoid advance(Iter p, int n)    // Il move\
    \ p elements forward\n{\n    while (n--)\n        ++p;                       \
    \ // Il a iterator has ++, but not or += =\n}\n```\n\n```\ntemplate<random_access_iterator\
    \ Iter>\nvoid advance(Iter p, int n)    // Il move p elements forward\n{\n   \
    \ p+=n;                        // Il a random-access iterator has += =\n}\n```\n\
    \nThe compiler will select the template with the strongest requirements met by\
    \ the arguments. In this case, a list provides sufficient iterators, but a vector\
    \ offers random-access iterators, so we get:\n\nClick here to view code image\n\
    \n```\nvoid user(vector<int>::iterator vip, list<string>::iterator lsp)\n{\n \
    \   advance(vip,10);             // Il uses the fast advance()\n    advance(lsp,10);\
    \             // Il uses the slow advance()\n}\n```\n\nUnlike overloading, this\
    \ is a compile-time mechanism implying no run-time cost, and the compiler does\
    \ not find a best choice, it gives an ambiguity error. For concept-based overloading\
    \ are far simpler than for general overloading (§1.3). Consider first single argument\
    \ for several alternative functions:\n\n+   * If the argument doesn't match the\
    \ concept, alternative cannot be chosen.\n* If the argument matches the concept\
    \ for just one alternative, alternative is chosen."
