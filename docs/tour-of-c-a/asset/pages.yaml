  md: '# 19.1.4 Standards and Style


    A standard says what will work, and how. There are significant differences between
    understanding the technical details of programming language features and using
    them effectively in combination with other features, libraries, and tools to produce
    better software. By "better" I mean "more maintainable, less error-prone, and
    faster." We need to develop, popularize, and support coherent programming languages.
    Further, we must support the evolution of code to these more modern, effective,
    and coherent styles.


    With the growth of the language and its standard library, the problem of popularizing
    effective programming styles became critical. It is extremely difficult to make
    large groups of programmers depart from what works for something. There are still
    people who see C++ as a few minor additions to C and people who regard 1980s Object-Oriented
    programming styles based on massive classes the hierarchy of development. Many
    are still struggling to use C++ well in environments with lots of C++ code. On
    the other hand, there are many who enthusiastically use novel facilities. For
    example, programmers are convinced that only code using massive amounts of metaprogramming
    is true C++.


    What is C++? In 2015, I set to answer this question by developing a set of coding
    guidelines supported by articulated rationales. I found that I was not alone in
    grappling with that, and together with many people from the world, notably from
    Microsoft, Red Hat, and Facebook, started the "C++ Core Guidelines" project [Stroustrup,2015].
    This is an ambitious project at complete type-safety and complete resource-safety
    as a benefit, faster, and more maintainable code [Stroustrup,2021b]. In addition
    to coding rules with rationales, we back up the guidelines with static analysis
    tools and a tiny support library. I see something like that as moving the C++
    community at large forward to benefit from the improvements in language features,
    libraries, and supporting tools.


    # 19.1.5 C++ Use


    C++ is now a widely used programming language. Its population grew quickly from
    one in 1979 to 400,000 in 1991; that the number of users doubled about every 7.5
    months for more than a decade. Naturally, the growth rate slowed since that initial
    spurt, but by my best estimate is there were about 4.5 million C++ programmers
    in 2018 [Kazakova,2015] and maybe a million more today. Which of that growth happened
    after 2005 when the exponential explosion of processor speed stopped that language
    performance grew in importance. This growth was achieved without formal marketing
    or an organized user community [Stroustrup,2020].


    C++ is primarily an industrial language; it is more prominent in industry than
    in education or programming language research. It grew up in Labs inspired by
    the varied and stringent needs of telecommunications and systems programming (including
    device drivers, networking, and embedded systems). From there, C++ has spread
    into essentially every industry: microelectronics, Web applications and infrastructure,
    operating systems, financial, medical, automobile, aerospace, high-energy physics,
    biology, energy production, machine'
