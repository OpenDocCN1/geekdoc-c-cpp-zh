    \ it points to. In that, it resembles an STL pair of iterators (§13.3).\n\nConsider\
    \ a simple function concatenating strings:\n\nClick here to view code image\n\n\
    ```\n{\n  string res(string_view sv1, string_view sv2);\n    // initialize from\
