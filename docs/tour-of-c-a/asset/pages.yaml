- pgno: 299
  md: '```

    module:

    #include <iostream>

    #include <string>

    #include <vector>

    #include <list>

    #include <memory>

    #include <algorithms>

    // ...

    ```


    ```

    export module std;

    export istream;

    export ostream;

    // ...

    ```


    There is a shortcut:


    ```

    export import "iostream";

    export import "string";

    export import "vector";

    export import "list";

    export import "memory";

    export import "algorithms";

    // ...

    ```


    The construct


    ```

    import "iostream";

    ```


    Importing a header unit is a half-way house between modules and header files.
    It takes a header file and makes it something like a module, but it can also inject
    names into the global namespace (like #include) and it leaks macros.


    This is not as slow to compile as #includes but not as fast as a properly constructed
    named module.


    # A.5 Advice


    +   [1] Prefer modules provided by an implementation; §A.2.

    [2] Use modules; §A.3.

    [3] Prefer named modules over header units; §A.4.

    [4] To use the macros and global names from the C standard, import std.compat;
    §A.1.

    [5] Avoid macros; §A.1. [CG: ES.30] [CG: ES.31].'
  merge: -1
