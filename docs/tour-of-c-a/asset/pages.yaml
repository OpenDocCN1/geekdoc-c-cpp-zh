- pgno: 245
  md: '+   If the kind of problem is infrequent or the immediate caller cannot be
    expected to handle it, throw an exception (§4.4).


    +   If the kind of problem is so serious that no ordinary part of the program
    can be expected to handle it, exit the program.


    The standard library provides facilities to deal with that last case ("exit the
    program");


    +   - exit(x); call functions registered with atexit() then exit the program with
    the return value x. If you need to look, use atexit(); it''s basically a primitive
    destructor shared with the C language.


    +   - abort(); exit the program immediately and unconditionally with a return
    value indicating unsuccessful termination. Operating systems offer features that
    may modify this simple explanation.


    +   - quick_exit(x); call functions registered with at_quick_exit(); then exit
    the program with the return value x.


    +   - terminate(); call the terminate_handler. The default terminate_handler is
    abort().


    These functions are for serious errors. They do not invoke destructors; that is,
    they do not order and properly clean up. The handlers are used to take actions
    before exiting. Such actions may be very simple one reason for calling these functions
    is that the program state is corrupted. One and reasonably popular action is "restart
    the system in a well-defined state relying on no state from the current program."
    Another, slightly dicker, but not unreasonable is "log error and exit." The reason
    that writing a logging message can be a problem is that the I/O system might have
    been corrupted by whatever caused the exit function to be called.


    Error handling is one of the trickiest kinds of programming; even getting cleanly
    out of a program can be hard.

    No general-purpose library will unconditionally terminate.


    # 16.9 Advice


    +   [1] A library doesn''t have to be large or complicated to be useful; §16.1.


    +   [2] Time your programs before making claims about efficiency; §16.2.1.


    +   [3] Use duration_cast to report time measurements with proper units; §16.2.1.


    +   [4] To represent a date directly in source code, use symbolic notation (e.g.,
    November/2021); §16.2.2.


    +   [5] If a date is a result of computation, check for validity using ok(); §16.2.2.


    +   [6] When dealing with time in different locations, use zoned_time; §16.2.3.


    +   [7] Use a lambda to express minor changes in calling conventions; §16.3.1.


    +   [8] Use mem_fn() or a lambda to create function objects that can invoke a
    member function when using the traditional function call; §16.3.1, §16.3.2.


    +   [9] Use function when you need to store something that can be called; §16.3.3.


    +   [10 Prefer concepts to explicit use of types predicates; §16.4.1.


    +   [11] You can write code to explicitly depend on properties of types; §16.4.1,
    §16.4.2.


    +   [12] Prefer concepts over traits and enable_if whenever you can; §16.4.3.'
