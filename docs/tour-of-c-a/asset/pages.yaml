  md: "```\ncout << '<<';\n```\n\nSimilarly for the filter_view:\n\nClick here to\
    \ view code image\n\n```\nfor (int x : filter_view{ r, [](int x) { return x %\
    \ 2; } }, 3 })\ncout << '<<';\n```\n\nSuch views can quickly get a bit crispy,\
    \ so there is an alternative: pipelines (§14.4). The standard library offers quite\
    \ many views, also as range adapters:\n\n| Standard-library views (range adapters)\
    \ <ranges> |\n| v is view; r is range; p is a predicate; n is an integer |\n|\
    \ all_view(r) | v is elements from r |\n| filter_view(r,p) | v is elements from\
    \ r that meets p |\n| transform_view(r,f) | v is the results of calling f on each\
    \ element from r |\n| take_view(r,n) | v is at most n elements from r |\n| take_while(r,p)\
    \ | v is elements from r until one doesn't meet the p |\n| drop_view(r) | v is\
    \ elements from r starting with the n+1th element |\n| drop_while(r,p) | v is\
    \ elements from r starting with the first element that meets p |\n| join_view(r)\
    \ | v is a flattened version of r; the elements of r must be ranges |\n| split_view(r,d)\
    \ | v is a range of sub-ranges of determined by the delimiter d; must be an element\
    \ or range |\n| common_view(r) | v is described by a (begin;end) pair |\n| reverse_view(r)\
    \ | v is the elements of in reverse order; r must have bidirectional access |\n\
    | views::elements<>(r) | v is the range of the nth elements of the tuple elements\
    \ of r |\n| keys_view(r) | v is the range of the first elements of the pair elements\
    \ of r |\n| values_view(r) | v is the range of the second elements of the pair\
    \ elements of r |\n| ref_view(r) | v is range of elements that are references\
    \ to the elements of r |\n\nA view offers an interface that's very similar to\
    \ a range, so in many cases we can use a view wherever in the same way. The key\
    \ difference is that a view doesn't own its elements; it is not responsible for\
    \ the elements of its underlying range - that's the range's responsibility. On\
    \ the other hand, a view must not outlive its range:\n\nClick here to view code\
    \ image\n\n```\nauto bad() {\n  vector v = {1, 2, 3, 4};\n  return filter_view(v,odd);\n\
    }\n// v will be destroyed before the view\n```\n\nViews are supposed to be cheap\
    \ to copy, so pass them by value. I have used standard types to keep examples\
    \ simple, but of course, we can have views"
