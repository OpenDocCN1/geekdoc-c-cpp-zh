    \ h) : coro(h) {} // II called by get_return_object())\nhandle_type coro; // II\
    \ is the coroutine handle\n```\n\nI strongly encourage you not to write such code\
    \ unless you are a library implementer trying to save others from the bother.\
    \ If you are curious, there are many explanations on the Web.\n\n# 18.7 Advice\n\
    \n+   [1] Use concurrency to improve responsiveness or to improve throughput;\
    \ §18.1.\n[2] Work at the highest level of abstraction that you can afford; §18.1.\n\
    [3] Consider possibilities as an alternative to threads; §18.1.\n[4] The standard-library\
    \ concurrency primitives are type safe; §18.1.\n[5] The memory model exists to\
    \ save most programmers from having to think about the machine-architecture level\
    \ of computers; §18.1.\n[6] The memory model makes memory appear as naively expected;\
    \ §18.1.\n[7] Atomics allow lock-free programming; §18.1.\n[8] Leave lock-free\
    \ programming to experts; §18.1.\n[9] Sometimes, a sequential solution is simpler\
    \ and faster than a concurrent solution; §18.1.\n[10] Avoid data races; §18.1.\n\
