  md: "Like other views, a istream_view can be composed with other views:\n\nClick\
    \ here to view code image\n\n```\nauto cplx = istream_view<complex<double>>(cin);\n\
    for (auto x : transform_view(cplx, [](auto z){ return z*z; }))\n  cout << x <<\
    \ \"in\";\n```\n\nAn input of 1 2 3 produces 1 4 9.\n\n# 14.4 Pipelines\n\nFor\
    \ each standard-view ($14.2), the standard library provides a function that produces\
    \ a filter; that is, an object that can be used as an argument to the filter adaptor.\
    \ For example, filter() yields a filter_view. This allows to combine filters in\
    \ a sequence rather than presenting them as a set of nested calls.\n\nClick here\
    \ to view code image\n\n```\nvoid user(forward_range auto& r)\n{\n  auto odd =\
    \ [](int x) { return x % 2; };\n  for (int x : r | views::filter(odd) | views::take(3))\n\
    \    cout << x << \"\";\n}\n```\n\nAn input range 2 4 6 8 20 produces 1 2 3.\n\
    The pipeline style (using Unix pipe adaptor) is widely regarded as more readable\
    \ than nested calls. The pipeline works left to right; that is fig the result\
    \ of f is passed to g, so rflg means $g(filter(f(r)))$. The initial r has to be\
    \ a range or a generator.\nThese filter functions are in namespace ranges::views:\n\
    \nClick here to view code image\n\n```\nvoid user(forward_range auto& r)\n{\n\
    \  for (int x : r | views::filter([(int x) { return x % 2; }) | views::take(3))\n\
    \    cout << x << \"\";\n}\n```\n\nI find that views:: explicitly makes code quite\
    \ readable, but of course we can shorten the code further:\n\nClick here to view\
    \ code image\n\n```\nvoid user(forward_range auto& r)\n{\n  using namespace views;\n\
    \  auto odd = [](int x) { return x % 2; };\n  for (int x : r | filter(odd) | take(3))\n\
    \    cout << x << \"\";\n```"
