- pgno: 237
  md: "For numerical types, numeric_limits from <limits> presents a variety of useful\
    \ information (§17.7). For example code\n\nClick here to view code image\n\n```\n\
    constexpr float min = numeric_limits<float>::min(); // Il smallest positive float\n\
    ```\n\nSimilarly, object sizes can be found by the built-in sizeof operator (§1.4).\
    \ For example code\n\nClick here to view code image\n\n```\nconstexpr int siz\
    \ = sizeof(int); // Il number of bytes in an int\n```\n\nIn <type_traits>, the\
    \ standard library provides many functions for inquiring about properties of types.\
    \ For example:\n\nClick here to view code image\n\n```\nbool b = is_arithmetic<T>::value;\
    \ // Il true if T is one of the (built-in) arithmetic types\nusing Res = invoke_result<decltype(f)>;\
    \ // Il Res if f is a function that returns an int\n```\n\nThe decltype(f) is\
    \ a call of built-in decltype returning the declared type of its argument; here\
    \ f.\nSome functions create new types based on inputs. For example:\n\nClick here\
    \ to view code image\n\n```\ntemplate<typename T>\nusing Store = conditional_t<sizeof(T)<max,\
    \ On_stack<T>, On_heap<T>>;\n```\n\nIf the (Bool) conditional is true, the result\
    \ is the first alternative; otherwise, the second. Assuming On_stack and On_heap\
    \ offer the same access functions to T, they can allocate T as names indicate.\
    \ Users of Store<X> can be tuned to the size of objects. The performance tuning\
    \ enabled by this choice of allocation can be very significant. This is a example\
    \ of how we can construct our own type functions, either from the standard ones\
    \ or by using concepts.\n\nConcepts are functions which, when used in expressions,\
    \ are specially typed predicates. For example:\n\nClick here to view code image\n\
    \n```\ntemplate<typename F, typename... Args>\nauto call(F f, Args... args, Allocator\
    \ alloc)\n{\n\tif constexpr (invocable<F, Args...>) // Il needs an allocator?\n\
    \treturn f(std::forward<Args>(args)...);\n\\else\n\treturn f(std::forward<Args>(args)...);\n\
    }\n```\n\nIn many cases, concepts are the best type functions, but most of the\
    \ standard library was built pre-concepts and must support pre-concept base codes.\n\
    \nThe not conventions use _v for type functions that return values, _t for type\
    \ functions that return types, is a leftover from the weakly typed days of C and\
    \ pre-concept C++. No standard-library function returns both a type and a value,\
    \ so these suffixes are redundant. With concepts, both in the standard library\
    \ and elsewhere,"
