    \ it is converting; the programmer is trusted to use it correctly. This is not\
    \ always a good assumption, so if you doubt, check. Explicit conversions (often\
    \ called casts to remind you that you are up to popping something broken) are\
    \ avoided. Try to use unchecked casts for the lowest level of a system. They are\
    \ error-prone.\n\nOther cases are reinterpret_cast and bit_cast (§16.7) for treating\
    \ an object as a simple sequence of bytes, const_cast for \"casting away `const`.\"\
    . Judicious use of the type system and well-designed libraries allow us to eliminate\
    \ unchecked casts in higher-level software.\n\n# 5.3 Abstract Types\n\nTypes such\
    \ as complex and Vector are called *concrete* types because their representation\
    \ is part of their definition. In that, they resemble built-in types. In contrast,\
    \ an *abstract type* is a type that completely isolates a user from implementation\
    \ details. To do that, we decouple the interface from the representation and give\
    \ up local variables. Since we don't know anything about the representation of\
    \ an abstract (even its size), (§5.2.2) and access them through references or\
    \ pointers (§1.7, §15.2.1), we must allocate objects on the store of our version\
    \ of Vector:.\n\nFirst, we define a class `Container`, which we will design as\
    \ a more abstract interface.\n\nClick here to view code image\n\n```\nclass Container\
    \ {\npublic:\n    virtual double&operator[](int) = 0; // pure virtual function\n\
    \    virtual int size() const = 0;      // const member function (§5.2.1)\n  \
    \  virtual ~Container()               // destructor (§5.2.2)\n};\n```\n\nThis\
    \ class is a pure interface to specify certain data. The word `virtual` means\
    \ \"may be redefined in a `virtual` class.\\ A class derived from `Container`\
    \ provides an implementation for the `Container` interface. The curious `=0` syntax\
    \ says the function is *pure virtual*; that is, some class derived from `Container`\
    \ must define the function. Then, it is not possible to define an object that\
    \ is just a `Container`. For example:\n\nClick here to view code image\n\n```\n\
    Container c;\nContainer* p = new Vector_container(10); // error: there are no\
    \ objects of an abstract class\n// OK: Container is an interface for Vector_container\n\
    ```\n\nA `Container` can only serve as the interface to a class that implements\
    \ `operator[]()` and `size()` functions. A class with a pure virtual function\
    \ is called an *abstract* class."
