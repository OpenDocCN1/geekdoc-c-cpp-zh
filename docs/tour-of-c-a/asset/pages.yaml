    string compose(const string& name, const string& domain)\n{\n    return name +\
    \ @ domain;\n}\n```\n\nauto addr = compose(\"dmr\", \"bell-labs.com\");\n\nHere,\
    \ add is to the character sequence dmr@bell-labs.com. \"Addition\" of strings\
    \ means\ncatenation. You can concatenate a string, a string literal, a C-style\
    \ string, or a character to a\nstring. The standard string has a constructor,\
    \ so returning every string by value is\nefficient ({6.2.2).\n\nIn many applications,\
    \ the most common form of concatenation is adding to the end\nof a string. This\
    \ is directly supported by the += operator. For example:\n\nClick here to view\
    \ code image\n\n```\nvoid m2(string& s1, string& s2)\n{\n    s1 += \"\\n\"; //\
    \ append newline\n    s2 += \"\\n\";\n```\n\nThe two ways to add to a string are\
    \ semantically equivalent, but I prefer the latter\nbecause it is more explicit\
    \ about what it does, more concise, and possibly more efficient.\nA string is\
    \ mutable. In addition to = and +=, subscripting with [] and subscripting operations\n\
    are supported. For example:\n\nClick here to view code image\n\nstring name =\
    \ \"Niels Stroustrup\";\n\n```\nvoid m3()\n{\n    string name = name.substr(6,10);\n\
    \    name.replace(0,5,\"nicholas\");\n    name[0] = toupper(name[0]);\n}\n```\n\
    \n| Il s = \"Stroustrup\" |\n| Il name becomes \"nicholas Stroustrup\" |\n| Il\
    \ name becomes \"Nicholas Stroustrup\" |\n\nThe substr() returns a string that\
    \ is a copy of the substring by its arguments.\nThe first argument is an index\
    \ into the string (a position), and the second is the length of the\ndesired string.\
    \ Since indexing starts from 0, s gets the value Stroustrup.\n\nThe replace()\
    \ replaces a substring with a value. In this case, the starting at\n0 with length\
    \ 5 is Niels; it is replaced by nicholas. Finally, I replace the initial character\
    \ with\nupp capital. Thus, the final value of name is Nicholas Stroustrup. Note\
    \ that the\nreplacement string need not be the same size as the string that it\
    \ is replacing.\n\nIn many applications string operations are assigned using (=,\
