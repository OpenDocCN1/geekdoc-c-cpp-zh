  md: "but Windows-based environments rarely do.\nTypically, a program produces some\
    \ output. Here is a program that writes Hello, World!\n\nClick here to view code\
    \ image\n\n```\nimport std;\n\nint main() \n{\n  std::cout << \"Hello, World!\"\
    ;\n}\n```\n\nThe import std; instructs the compiler to make the declarations of\
    \ the standard library available. Without these declarations, the expression\n\
    \nClick here to view code image\n\nstd::cout << \"Hello, World!\"\nmake no sense.\
    \ The operator (\"put\") writes its second argument onto its first. In this case,\
    \ the string literal \"Hello, World\" is written onto the standard output std::cout.\
    \ A string is a sequence of characters followed by double quotes. In a string,\
    \ the backslash character followed by another character denotes a \"special character.\\\
    \ In this case, \\n is the newline character, so that characters are written Hello,\
    \ World! followed by a newline.\nThe std:: specifies that the name cout is to\
    \ be found in the standard-library namespace (§3.3). I usually leave out std::\
    \ when discussing standard features; §3.3 shows how to make names from a namespace\
    \ without explicit qualification.\n\nThe import directive is new in C++20 and\
    \ presenting all of the standard library as a module is not yet standard. This\
    \ will be explained in§3.2.2. If you have trouble with import std; try the old-fashioned\
    \ and conventional\n\nClick here to view code image\n\n```\n#include <iostream>\n\
    \nint main() \n{\n  std::cout << \"Hello, World!\";\n}\n```\n\nThis will be explained\
    \ in§3.2.1 and has worked on all C++ implementations since 1998 (§19.1.1).\nEssentially\
    \ every executable code is placed in functions and can be called directly or indirectly\
    \ by main(). For example:\n\nClick here to view code image\n\n```\nimport std;\n\
    \nusing namespace std;\n\ndouble square(double x) \n{\n  return x*x;\n}\n```\n\
    \nIl import the declarations for the I/O stream library\nIl makes names from std\
    \ visible without std:: (§3.3)\nIl square a double-precision floating-point number"
