    called a local name. Its scope extends from point of its declaration to the end
    of the block in which it occurs. A block is delimited by a {} pair. Function arguments
    are considered local names.

    - Class scope: A name is called a member name (or class member name) if it is
    defined in a class ($2.2, $2.3, Chapter 5), outside any function ($1.3), lambda
    ($7.3.2), or enum class ($2.4). Its scope extends from the opening ({ of its enclosing
    declaration to the matching).

    - Namespace scope: A name is called a namespace name if it is defined in a namespace
    ($3.3) outside any function, lambda ($7.3.2), class ($2.2, $2.3, Chapter 5), or
    enum class ($2.4). Its scope extends from the point of declaration to the end
    of its namespace.


    A not declared inside any other construct is called a global name and is said
