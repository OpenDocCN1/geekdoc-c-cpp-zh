    \ and connect up the mechanisms for returning a value\n- async() for launching\
    \ of a task in a manner very similar to calling a function\n\nThese facilities\
    \ are found in <future>.\n\n# 18.5.1 future and promise\n\nThe important point\
    \ about future and promise is that they enable a transfer of a value between two\
    \ tasks without explicit use of lock; \"the system\" implements the transfer efficiently.\
    \ The basic idea is simple: when a task wants to pass a value to another, it puts\
    \ the value into a promise. Somehow, the implementation makes value appearing\
    \ in the corresponding future, from which it can be read (typically by the launcher\
    \ of the task) graphically:\n\n![](img/0bd2e25eba2737c3c5daca16fad1b65b_264_0.png)\n\
    \nIf we have a future<X> called fx, we can get() a value of type X from it: \n\
    \nClick here to view code image\n\n```\nX = fx.get(); // If necessary, wait for\
    \ the value to get computed\n```\n\nIf the value isn't there yet, our thread is\
    \ blocked until it arrives. If the value couldn't"
