    \ not x\n* [aeiou] - II y, k Not an English vowel, not e\n* [aeiou]* - II a, o\
    \ English vowel or ^\n\nA group (subpattern) potentially be represented by a sub_match\
    \ delimited by parentheses. If you need parentheses that should not define a subpattern,\
    \ use (?: rather than plain (. For example:\n\nClick here to view code image\n\
    \n+   * (is,)?(id*) Optional spaces, colons, and/or commas followed by an optional\
