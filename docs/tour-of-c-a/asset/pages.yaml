  md: "How do we get a future that needs a task and the corresponding promise into\
    \ the future that should produce result? The packaged_task type is provided to\
    \ simplify up tasks connected with futures and promises to be run on threads.\
    \ A packaged_task wrapper code to put the return value or exception into a promise\
    \ (like the code shown in §18.5.1). If you ask by calling get_future, a packaged_task\
    \ will give you the future to its promise. we can use two tasks to add each of\
    \ the elements of a vector<double> using the standard-library accumulate() (§17.3):\n\
    \nClick here to view code image\n\n```\ndouble accumulate(vector<double>::iterator\
    \ end, vector<double>:: double init)\n{\n    return accumulate(\"begin\", &end,\
    \ init);\n}\n\ndouble comp2(vector<double>& v)\n{\n    packaged_task pt0(accum);\
    \ // Il package the task (i.e., accum)\n    packaged_task pt1(accum);\n\n    future<double>\
    \ f0 (pt0.get_future()); // Il get hold of pt0's future\n    future<double> f1\
    \ (pt1.get_future()); // Il get hold of pt1's future\n\n    double* first = &v[0];\n\
    \    thread t1 (move(pt0), first, first+v.size()/2,0); // Il start a thread for\
    \ pt0\n    thread t2 (move(pt1), first+v.size()/2,first+v.size(),0); // Il start\
    \ a thread for pt1\n    // ...\n\n    return f0.get()+f1.get(); // Il get the\
    \ results\n```\n\nThe packaged_task takes the type of the task as its constructor\
    \ argument (here, The move) double(double,double,double) and the task as its constructor\
    \ argument (here, accum). Operations performed using a packaged_task cannot be\
    \ copied. The reason that a packaged_task cannot be copied is that it is a resource:\
    \ it owns its promise and (indirectly) responsible for whatever its task may use.\n\
    \nPlease note the absence of mention of locks in this code: because we are able\
    \ to connect tasks to be done, rather than on the mechanisms to manage their communication.\
    \ The two tasks will be run on separate threads and thus potentially in parallel.\n\
    \n# 18.5.3 async()\n\nThe line of thinking I have pursued in this chapter is the\
    \ one I believe to be the simplest yet among the most powerful: treat a task as\
    \ a function that may run concurrently with other tasks. It is far from the only\
    \ model supported by the C++ standard library, but it serves for a wide range\
    \ of needs. More subtle and tricky models (e.g., styles of programming relying\
    \ on shared memory), can be used as needed.\n\nTo launch tasks potentially run\
    \ asynchronously, we can use async():\n\nClick here to view code image"
