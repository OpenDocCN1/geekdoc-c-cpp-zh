  md: "# # 16.2.3 Time Zones\n\nOne of the trickiest things to get right in connection\
    \ is time zones. They are so arbitrary that they are hard to remember and they\
    \ change in a variety of ways at times that are not standardized across the globe.\
    \ For example:\n\nClick to view code image\n\n```\n```\nauto tp = system_clock::now();\n\
    cout << \"in\";\n\nzoned_time ztp = (current_zone(tp);\ncout << \"in\";\nconst\
    \ const_time est = (\"Europe/Copenhagen\");\ncout << zoned_time(&est,tp) << \"\
    in\";\n```\n```\n\nA time zone is a relative to the standard (GMT or UTC) using\
    \ the system_clock. The standard library synchronizes with a global database (IANA)\
    \ to get its answers right. That synchronization can be automatic in the operating\
    \ system or under the control of a system administrator. The names of time zones\
    \ are C-style strings of the form \"continent / major city\", such as \"America/New_York\"\
    , \"Asia/Tokyo\", \"African/Nairobi\". A zoned_time is a time_zone together with\
    \ a time_point.\n\nLike calendars, time zones address a set of concerns that we\
    \ should leave to the standard library, rather than rely on our own handcrafted\
    \ code. Consider: What time of day the last of February 2024 in New York will\
    \ the date change in New Delhi? When did summer-time (daylight savings time) end\
    \ in Denver, Colorado, USA in 2020? When will the next leap second occur? The\
    \ standard library knows.\n\n# # 16.3 Function Adaptation\n\nWhen passing a function\
    \ as a function argument, the type of the argument must exactly match the expectations\
    \ expected in the called function's declaration. If an intended argument only\
    \ \"almost matches expectations,\" we have alternative ways of adjusting it:\n\
    \n+   - Use a lambda (§$16.3.1).\n- Use std::mem_fn to make a function object\
    \ from a member function (§$16.3.2).\n- Define the function to accept a std::function\
    \ (§$16.3.3).\n\nThere are many other ways, but usually one of these three works\
    \ best.\n\n# # 16.3.1 Lambdas as Adaptors\n\nConsider the classical \"draw all\"\
    \ example:\n\nClick to view code image\n\n```\n```\nvoid draw_all(vector<Shape>&\
    \ v) \n{\n    for_each(v.begin(),v.end(), [](Shape* p) { p->draw(); });\n}\n```\n\
    ```"
  merge: -1
