    ,\"Stephen\");\nauto s4 = cat(\"Canute\",sv);\nauto s5 = cat(&king[0,2],\"Henry\"\
    ,sv);\nauto s6 = cat(&king[0,3],&king[2,4]);\n```\n\nThis cat() has three advantages\
    \ over the compose() that takes const string& and arguments (§10.2):\n\n+   -\
