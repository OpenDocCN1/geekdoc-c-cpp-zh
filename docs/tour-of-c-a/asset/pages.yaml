  md: "+   - Is an object copied shared?\n- If an object is shared, is it mutable?\n\
    - Is an object moved, leaving an \"empty object\" behind (§6.2.2)?\n\nThe default\
    \ behavior for both argument passing and return value is \"make a copy\" (§1.9),\
    \ but many copies can implicitly be optimized to moves.\n\nIn the sum(m) the result\
    \ is copied out of sum(i) but it would be inefficient and pointlessly copy the\
    \ very large vector into sum(i); so the argument is passed by reference (indicated\
    \ by the &; §1.7).\n\nThe sum(m) has no reference to modify its argument. This\
    \ immutability is indicated by declaring the argument const (§1.6), the vector\
    \ is const-reference.\n\n#  3.4.1 Argument Passing\n\nFirst consider how to get\
    \ values into a function. By default we copy (\"pass-by-value\") and if we want\
    \ to return an object in the caller's environment, we use a reference (\"pass-by-reference\"\
    ).\nExample:\n\nClick here to view code image\n\n```\nvoid test(vector<int> v,\
    \ vector<int>& rv) {\n    v[1] = 99;           // Modify v (a local variable)\n\
    \    rv[2] = 66;          // Modify whatever rv refers to\n}\n\nint main() {\n\
    \    vector<int> fib = {1, 2, 3, 5, 8, 13, 21};\n    test(fib);\n    cout << fib[1]\
    \ << \"\"\" << \"in\"\n\"; // Prints 26\n}\n```\n\nWhen we care about performance,\
    \ we pass small values by-value and larger ones by-reference. Here \"small\" means\
    \ \"something that is relatively cheap to copy\". Exactly what \"small\" depends\
    \ on machine architecture, but the \"size of two or three pointers\" is a good\
    \ rule of thumb. If it might be significant to your performance,\n\nIf we want\
    \ to pass by reference for performance reasons but don't need to modify the argument,\
    \ use pass-by-const-reference as in the sum example. This is by far the most common\
    \ case in ordinary good code: it is safe and error-prone.\n\nIt is not uncommon\
    \ for a preferred argument to have a default value; that is, a value that is considered\
    \ preferred or most common. We can specify such a default by a default function\
    \ argument. For example:\n\nClick here to view code image\n\n```\nvoid print(int\
    \ value, int base=10) {\n    print(x,16); // hexadecimal\n    print(x,60);   //\
