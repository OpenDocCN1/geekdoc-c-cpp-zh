- pgno: 13
  md: '# Preface


    > When you wish to instruct, be brief.

    - Cicero


    C++ feels like a new language. That is, I can express my ideas more clearly, and
    more directly than today than I could in C++98 or C++11. Furthermore, the resulting
    programs are better checked by the compiler and run faster.


    This book gives an overview of C++ as defined by C++20, the current ISO C++ standard,
    and implemented by the major C++ suppliers. In addition, it mentions a couple
    library components in current use, but not scheduled for inclusion in the standard
    until C++23.


    Like other modern languages, C++ is large and there are large numbers of libraries
    needed for effective use. This thin book aims to give an experienced programmer
    an idea of what constitutes modern C++. It covers most major language features
    and the standard-library components. This book can be read in just a day or two
    but, obviously, there is much more to writing good C++ than can be learned in
    amount of time. The aim here is not mastery, but to give an overview, to give
    key examples, and to help a programmer get started.


    The assumption is that you have programmed before. If not, please consider reading
    a textbook, such as Programming: Principles and Practice Using C++ (Second edition)
    [Stroustrup,2014], before beginning here. Even if you have programmed before,
    the language you used or the applications you wrote may be very different from
    the style of C++ presented here.


    Think of a sightseeing tour of a city, such as Copenhagen or New York. In just
    a few hours, you get a quick peek at the major attractions, found a few background
    stories, and get some suggestions about what to do next. You do not know the city
    after you see and heard; some stories may sound strange or implausible. You do
    not know how to navigate the formal and informal rules that govern life in the
    city. To really know a city, you have to live in it, often for years. However,
    with a bit of luck, you will have gained a bit of interest, a notion of what is
    special about the city, and ideas of what might be of interest to you. After the
    tour, the real exploration can begin.


    This tour presents the major C++ language features as they support programming
    styles, such as object-oriented and generic programming. It does not attempt to
    provide a detailed, reference-manual, feature-by-feature view of the language.
    In the best textbook tradition, I try to explain a'
