    # ## 5.2 Concrete Types


    The basic idea of concrete classes is that they “just like built-in types.” For
    example, a complex number type and an infinite-precision integer are much like
    a built-in int, except of course that they have their own semantics and sets of
    operations. Similarly, a vector and a string are much like built-in arrays, that
    they are far more flexible and better behaved (§10.2, §11.3, §12.2).


