    \ // the square of 1.234 is 1.5226\n}\n```\n\nA \"return type\" void indicates\
    \ that a function does not return a value.\n\n# 1.3 Functions\n\nThe main way\
    \ of getting something done in a C++ program is to call a function to do it. Defining\
    \ a function is how you specify how an operation is to be done. A function cannot\
    \ be called unless it has been declared.\n\nA function declaration gives the name\
    \ of the function, the type of the value returned (if any), and the number and\
    \ types of the arguments that must be supplied in a call. For example:\n\nClick\
    \ to view code image\n\n```\nElem* next_elem(); // No argument, return a pointer\
    \ to Elem (Elem*)\nvoid exit(int); // If no argument, return int\ndouble sqrt(double);\
    \ // If double argument, return double\n```\n\nIn a function declaration, the\
    \ return type comes before the name of the function and the arguments come after\
    \ in parentheses.\n\nThe semantics of argument passing are identical to the semantics\
    \ of initialization (§3.4.1). That is, argument types are checked and implicit\
    \ type conversion takes place when necessary (§1.4). For:\n\nClick to view code\
    \ image\n\n```\ndouble s2 = sqrt(\"2\"); // Call sqrt(2) with the argument type\
    \ double\ndouble s3 = sqrt(\"three\"); // Error: sqrt() requires an argument of\
    \ type double\n```\n\nThe value of compile-time checking and type conversion should\
    \ not be underestimated.\n\nA function declaration may contain argument names.\
    \ This can be a help to the reader of a program, but unless the declaration is\
    \ a function definition, the compiler simply ignores them. For example:\n\nClick\
    \ to view code image\n\n```\ndouble sqrt(double d); // Return the square root\
    \ of d\ndouble square(double); // Return the square of the argument\n```\n\nThe\
    \ type of a function consists of its return type followed by the sequence of its\
    \ argument types in parentheses.\n\nClick to view code image\n\n```\ndouble get(const\
    \ vector<double>&vec, int index); // If type: double(const vector<double>&int)\n\
    ```\n\nA function can be a member of a class (§2.3, §5.2.1). For such a member\
    \ function, the name of"
