    Type functions are part of C++''s mechanisms for compile-time computation that
    allow tighter type checking and better performance than would have been possible
    without them. Use of type functions and concepts (Chapter 8, §14.5) is often called
    metaprogramming or (when templates are involved) template metaprogramming.


    # 16.4.1 Type Predicates


    In <type_traits>, the standard library offers dozens of simple type functions,
    called type predicates that answer fundamental questions about types. Here is
    a small selection:


    | Selected Type Predicates |

    | T, A, and U are types; all predicates returns a bool |

    |---||

    | is_void<T> | is T void? |

    | is_integral<T> | is T an integral type? |

    | is_floating_point<T> | is T a floating-point type? |

    | is_class<T> | is T a class (and not union)? |

    | is_function<T> | is T a function (and not a object or a pointer to function)?
    |

    | is_arithmetic<T> | is T an integral or floating-point type? |

    | is_scalar<T> | is T an arithmetic, enumeration, or pointer to type? |

    | is_constructible<T, A...> | can T be constructed from the A... argument list?
    |

    | is_default_constructible<T> | can T be constructed without explicit arguments?
    |

    | is_copy_constructible<T> | can T be constructed from another T? |

    | is_move_constructible<T> | can T be moved or copied into another T? |

    | is_assignable<T,U> | can U be assigned to a T? |

    | is_trivially_copyable<T,U> | can U be assigned to a T without user-defined copy?
    |

    | is_same<T,U> | is T the same as U? |

    | is_base_of<T,U> | is U derived from T or U the same type as U? |

    | is_convertible<T> | can T be implicitly converted to a U? |

    | is_iterator<T> | is T an iterator type? |

    | is_invocable<T, A...> | can T be called with the argument list A...? |

    | has_virtual_destructor<T> | does T have a virtual destructor? |


    One traditional use of these predicates is to constrain template arguments. For
