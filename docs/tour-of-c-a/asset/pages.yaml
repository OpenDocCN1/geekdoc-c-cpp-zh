  md: "```\ntemplate<typename C, typename P>\nint count(const C& c, P pred)\n```\n\
    \nIl assume that C is a container and P is a predicate on its elements\n\n```\n\
    {\n  int cnt = 0;\n  for (const auto& x : c) {\n    if (pred(x))\n      cnt++;\n\
    \  }\n  return cnt;\n}\n```\n\nThis is a simplified version of the standard-library\
    \ count_if algorithm if §13.5.\n\nGiven objects (§8.2), we can formalize count()'s\
    \ assumptions about its argument and check them at compile time.\n\nA predicate\
    \ is something that we can invoke to return true or false. For example:\n\nClick\
    \ here to view code image\n\n```\nvoid fcount(vector<int>& vec, const list<string>&\
    \ lst, int x, const string& s) {\n  cout << \"number of values less than \" <<\
    \ x << \": \" << count(vec,x) << \"in\";\n  cout << \"number of values less than\
    \ \" << s << \": \" << count(lst,Less_than(s)) << \"in\";\n}\n```\n\nHere, Less_than(x)\
    \ constructs an object of type Less_than<int>, which the call operator compares\
    \ the value of the int called x; Less_than(s) constructs an object that compares\
    \ to the value of the string called s.\n\nThe beauty of function objects is that\
    \ they carry the value to be compared with (and type), and we don't have to introduce\
    \ noisy global variables to hold values. Also, for a simple function object like\
    \ Less_than, inlining is simple, a call of Less_than is far more efficient than\
    \ an indirect call. The ability to carry data plus their efficiency makes function\
    \ objects particularly useful as arguments to algorithms.\n\nFunction objects\
    \ used to specify the meaning of key of a general algorithm (such as Less_than\
    \ for count()) are sometimes referred to as policy objects.\n\n# 7.3.3 Lambda\
    \ Expressions\n\nIn §7.3.2, we defined Less_than separately from its use. That\
