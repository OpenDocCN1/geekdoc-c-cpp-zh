    \ heavyweight mechanism involving the operating system. It allows arbitrary amounts\
    \ of work to be done free of data races. However, there is a far simpler and cheaper\
    \ mechanism for just a tiny amount of work: an atomic variable. For example, here\
    \ is a simple variant of the classic double-checked locking:\n\nClick here to\
    \ view code image\n\n```\nmutex mut;\natomic<bool> init_x; // Il initially false.\n\
    X // use X; // Il variable that requires nontrivial initialization\nif (!init_x)\
    \ {\n    lock_guard lck(mut);\n    if (!init_x) {\n        // ... do not nontrivial\
    \ initialization of ...\n        init_x = true;\n    }\n}\n```\n\nThe `atomic`\
    \ saves us from most uses of the much expensive `mutex`. Had `init_x` not been\
    \ `atomic`, that initialization would have failed so frequently, causing mysterious\
    \ and hard-to-find errors, because there would have been a data race on `init_x`.\n\
    \nHere, I used `lock_guard` rather than `scoped_lock` because I needed just one\
    \ `mutex` so the simplest lock (`lock_guard`) was sufficient.\n\n# 18.4 Waiting\
    \ for Events\n\nSometimes, a `thread` needs to wait for some kind of event, such\
    \ as another `thread` completing a task or a certain amount of time passing. Using\
    \ the time facilities found in `<chrono>` I can write:\n\nClick here to view code\
    \ image\n\n```\nusing namespace chrono; // Il see $16.2.1\nauto t0 = high_resolution_clock::now();\n\
    this_thread::sleep_for(milliseconds(20));\nauto t1 = high_resolution_clock::now();\n\
    cout << duration_cast<nanoseconds>(t1-t0).count() << \" nanoseconds passed\\n\"\
    ;\n```"
