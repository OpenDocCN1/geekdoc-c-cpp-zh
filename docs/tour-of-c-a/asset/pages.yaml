- pgno: 22
  md: 'The conversions used in expressions are called the usual arithmetic conversions
    and aim to ensure that expressions are computed at the highest precision of their
    operands. For example, an addition of a double and an int is calculated using
    double-precision floating-point arithmetic.


    Note that = is the assignment operator and == tests equality.


    In the conventional arithmetic and logical operators, C++ offers more specific
    operations for modifying a variable:


    Click here to view code image


    ```

    x+=y   ll = x+y

    ++x   ll increment: x = x+1

    x-=y   ll = x-y

    --x   ll decrement: x = x-1

    *=y   ll = x *=y

    /=y   ll = x /= y

    %=y   ll = x%y

    ```


    These operators are concise, convenient, and frequently used.


    The order of evaluation is left-right for x.y, x->y, x[j], x<<y, x>>y, x&&y, and
    x|y. For assignments (e.g., x+=), the order is right-to-left. For reasons realized
    to optimization, the order of evaluation of other expressions (e.g., f(x)+g(y))
    and of function arguments (e.g., h(f(x),g(y))) is unfortunately unspecified.


    # 1.4.2 Initialization


    Before an object is used, it must be given a value. C++ offers a variety of notations
    for expressing initialization, such as the = used, and a universal form based
    on curly-brace-delimited initializer lists:


    Click here to view code image


    ```

    double d1 = 2.3;      ll initialize d1 to 2.3

    double d2 = (2.3);      ll initialize d2 to 2.3

    double d3 = {2};          ll initialize d3 to 2 (the is optional with { ... })

    ```


    ```

    complex<double> z = 1;  ll a complex number with double-precision floating-point
    scalars

    complex<double> x = (d1, d2);

    complex<double> z3 = {d1, d2};  ll the is optional with { ... }

    ```


    ```

    vector<int> v = {1, 2, 3, 4, 5, 6}; ll a vector of ints

    ```


    The form is formal and back to C, but if in doubt, use the general }-list form.
    If nothing else, it saves you from conversions that lose information:


    Click here to view code image


    ```

    int i = 7.8;          ll i becomes 7 (surprise?)

    int i2 = (7);           ll error: floating-integer conversion

    ```


    Unfortunately, conversions that lose information, are allowed and implicitly applied
    when you use = (but not when you use {}). And and int to char,). The problems
    caused by implicit narrowing conversions are a price paid for C compatibility
    (§19.3). A constant (§1.6) cannot be left uninitialized and a variable should
    only be left uninitialized'
