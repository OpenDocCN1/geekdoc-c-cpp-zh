  md: "# 10.4.1 Searching\n\nThe simplest way of using a pattern is to search for\
    \ it in a stream:\n\nClick here to view code image\n\n```\nint lineno = 0;\nfor\
    \ (string line; getline(cin,line); {\n    ++lineno;\n    smatch matches;\n   \
    \ if (regex_search(line,matches,pat))\n        cout << \":\" << matches[0] <<\
    \ \"\\n\";\n}\n```\n\nThe regex_search(line,matches,pat) uses the line for matches\
    \ that the regex expression stored in pat and if it finds any, it stores in matches.\
    \ If no match was found, regex_search(line,matches,pat) returns false. The matches\
    \ are of type match. The \"s\" stands for \"sub\" or \"string,\" and an match\
    \ is a vector of submatches of type string. The first element, matches[0], is\
    \ the complete match. The result of regex_search() is a collection of matches,\n\
    \nClick here to view code image\n\n```\n{\n    ifstream infile(\"file.txt\");\n\
    \    if (lin) {\n        cerr << \"no file\";n        return;\n    }\n}\n```\n\
    \n```\nregex pat(R\"(\\w{2})?-(\\d{5})-(\\d{4})?\"); // U.S. postal code pattern\n\
    ```\n\n```\nint lineno = 0;\nfor (string line; getline(in,line); {\n    ++lineno;\n\
    \    smatch matches; // matched strings here\n    if (regex_search(line,matches,pat))\
    \ {\n        cout << \":\" << matches[0] << \"\\n\"; // the complete match\n \
    \       if (1 < matches.size() && matches[1]) {\n            cout << \":\" <<\
    \ matches[1] << \"\\n\"; // if there is a sub-pattern\n        }\n        // and\
    \ if it is matched // and if it is matched\n    }\n}\n```\n\nThis function reads\
    \ a file looking for U.S. postal codes, such as TX77845 and DC 20500-0001. An\
    \ match type is a container of regex results. matches[0] is the whole pattern\
    \ and matches[1] is the optional-digit subpattern (\\d(4)).\n\nThe newline character,\
    \ \\ln, can be part of a pattern, so we can search for multiline patterns. Obviously,\
    \ we shouldn't read one line at a time if we want to.\n\nThe regular expression\
    \ syntax and semantics are designed so regular expressions can be compiled into\
    \ state machines for efficient execution [Cox,2007]. The regex performs this compilation\
    \ at run time."
