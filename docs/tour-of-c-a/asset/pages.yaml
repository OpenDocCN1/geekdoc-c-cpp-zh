  md: 'C++ becomes an attractive vehicle for computations that are part of a larger
    system.

    Furthermore, numeric methods have come a long way from being simple loops over
    vectors of floating-point numbers. Where more complex data structures are needed
    as part of a computation, C++''s strengths become relevant. The net effect is
    that C++ is widely used for scientific, engineering, financial, and other computation
    involving sophisticated numerics. Consequently, facilities and techniques supporting
    such computation have emerged. This chapter describes the parts of the standard
    library that supports numerics.


    # 17.2 Mathematical Functions


