    The notion of invariants underlings C++''s notions of resource management supported
    by constructors (Chapter 5) and destructors ($5.2.2, $15.2.1).


    # 4.4 Error-Handling Alternatives


    Error handling is a major issue in all real-world software, so naturally there
    are a variety of approaches. If an error is detected and it cannot be handled
    locally in a function, the function must communicate the problem to some caller.
    Throwing an exception is C++''s most general mechanism for that.


    There are languages where exceptions are designed to provide an alternate mechanism
    for returning values. C++ is not such language: exceptions are designed to be
    used to report failure to complete a task. Exceptions are integrated with constructors
    and destructors to provide a coherent framework for error handling and resource
    management ($5.2.2, $6.3). Compilers are optimized to make returning a value cheaper
    than throwing the same value as an exception.


    Throwing an exception is not the only way of returning an error that can be handled
    locally. A function can indicate that it cannot perform its allotted task:


    +   - throwing an exception

    - somehow returning a value indicating failure

    - terminating the program (by invoking a function like terminate(), exit(), or
    abort() ($16.8)).


    We return an error indicator ("error code") when:


    +   - A failure is normal and expected. For example, it is quite for a request
    to open a file to fail (maybe there is no file of name or the file cannot be opened
    with the permissions requested).

    - An immediate caller can reasonably be expected to handle the failure.

    - An error happens in one of a set of parallel tasks and need to know which task
    failed.

    - A system has so little memory that the runtime-support for exceptions would
    crowd out essential functionality.


    We throw an exception when:


    +   - An error is so rare that a programmer is likely to forget to check for it.
    For example, when you last check the return value of printf()?

    - An error cannot be handled by an immediate caller. Instead, the error needs
    to percolate back the call chain to an "ultimate caller". For example, it is infeasible
    to have every function in an application reliably handle every allocation failure
    and network outage. Repeatedly checking an error-code would be tedious, expensive,
    and error-prone. The tests for errors and passing error-codes as return values
    can easily obscure the main logic of a function.'
