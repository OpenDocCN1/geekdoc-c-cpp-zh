    # 13.5 Algorithm Overview


    A general definition of an algorithm is “a finite set of rules which gives a sequence
    of operations for solving a specific set of problems [and] has five important
    features: Finiteness ... Definiteness ... Input ... Output ... Effectiveness”
    [Knuth,1968§1.1]. In the context of the C++ standard library, an algorithm is
    a function template operating on sequences of elements.


    The standard library provides dozens of algorithms. The algorithms are defined
    in namespace std <algorithm> and <numeric> headers. These standard-library algorithms
    all take sequences as input. A half-open sequence from b to e is referred as [b:e).
    Here are a few examples:


    # Standard Algorithms <algorithm>


    | f=for_each(b,e,f) | For each element x in [b:e) do f(x) |

    | p=find(b,e,x) | p is the first p in [b:e) so that "p==x" |

    | p=find_if(b,e,f) | p is the first p in [b:e) so that ''f''(p)'' |

