    # 2.1 Introduction


    We call the types that can be built from the fundamental types ($1.4), the const
    modifier ($1.6), and the declarator operators ($1.7) built-in types. C++''s set
    of built-in types and operations is rich, deliberately low-level. They directly
    and efficiently reflect the capabilities of conventional hardware. However, they
    don''t provide the programmer with high-level facilities to conveniently write
    advanced applications. Instead, C++ augments the built-in types and operations
    with a sophisticated set of abstraction mechanisms out of which programmers build
    such high-level facilities.


    The C++ abstraction mechanisms are primarily designed to let programmers design
    and implement their types, with suitable representations and operations, and for
    programmers to simply and easily use such types. Types built out of C++ are called
    user-defined types. They are referred to as classes and enumerations. User-defined
    types can be built out of built-in types and other user-defined types. Most of
    this book is devoted to the design, implementation, and use of user-defined types.
    User-defined types are often preferred over built-in types because they are easier
    to use, less error-prone, and'
