    - Deprecated: Comparisons between arrays.

    - Deprecated: Comma operations in a subscript (e.g., [a,b]). To make room for
    allowing user defined operator[](i) with multiple arguments.

    - Deprecated: Implicit capture of “this” in lambda expressions. Instead, use [=,this]
    ($7.3.3).

    - Removed: The standard-library interface for garbage collectors. The C++ garbage
    collectors don’t use interface.

    - Deprecated: strstream; instead, use columnspan ($11.7.4).


    # 19.3 C/C++ Compatibility


    With minor exceptions, C++ is a superset of C (meaning C11; [C,2011]). Most differences
    from C++’s greater emphasis on type checking. Well-written C programs tend to
    be C++ programs as well. For example, every example in K&R2 [Kernighan,1988] is
    C++. A compiler can diagnose every difference between C++ and C. The C11/C++20
