    \ named concepts with well-specified semantics (§8.2.4) and primarily use requires-expressions\
    \ in the definition of those.\n\n# 8.2.4 Definition of Concepts\n\nWe find useful\
    \ concepts, such as forward_iterator in libraries, (§14.5). As classes and functions,\
    \ it is much easier to use a concept from a good library to write a new one, but\
    \ simple concepts are not hard to define. Names from the standard library, such\
    \ as random_access_iterator and vector, are in lower case. Here, I use the convention\
    \ to capitalize the names of concepts I have defined myself, such as Sequence\
    \ and Vector.\n\nA concept is a compile-time predicate specifying what and the\
    \ result of those can be used. Consider first one of the following examples:\n\
    \nClick here to view code image\n\n```\ntemplate<typename T>\nconcept Equality_comparable\
    \ =\nrequires (T a, T b) {\n  { a == b } -> Boolean; // compare Ts with ==\n \
    \ { a != b } -> Boolean; // compare Ts with !=\n};\n```\n\nEquality_comparable\
    \ is the concept we use to ensure that we can compare values of a type equal and\
    \ non-equal. We say that given two values of the type, they must be comparable\
    \ using == and != and the result of those operations must be boolean. For example:\n\
    \nClick here to view code image\n\n```\nstatic_assert(Equality_comparable<int>);\
    \ // succeeds\nstruct S { int a; };nstatic_assert(Equality_comparable<S>); //\
    \ fails because structs do not automatically generate == and !=\n```\n\nThe definition\
    \ of the concept Equality_comparable is exactly like the English description and\
    \ not longer. The value of a concept is always boolean.\n\nThe result of { ...\
    \ } perceived as a concept. Unfortunately, there isn't a standard-library concept,\
    \ so I defined one (§14.5). Boolean simply means a type that can be used as a\
    \ condition.\n\nDefining Equality_comparable to handle heterogeneous comparisons\
    \ is almost as easy:\n\nClick here to view code image\n\n```\ntemplate<typename\
    \ T, typename T2=T>\nconcept Equality_comparable =\nrequires (T a, T b) {\n  {\
    \ a == b } -> Boolean; // compare a T to a T2 with ==\n  { a != b } -> Boolean;\
    \ // compare a T to a T2 with !=\n  { b == a } -> Boolean; // compare a T2 to\
    \ a T with ==\n  { b != a } -> Boolean; // compare a T2 to a T with !=\n```"
