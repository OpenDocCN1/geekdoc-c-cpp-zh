- pgno: 20
  md: "Every name and expression has a type that determines the operations that may\
    \ be performed on it. For example, the declaration\n\n```\nint inch;\n```\n\n\
    specifies that inch is of type int; that inch is an integer variable.\nA declaration\
    \ is a statement that introduces an entity into the program and specifies its\
    \ type: \n\n+   - A type defines a set of possible values and a set of operations\
    \ (for an object).\n- An object is some memory that holds a value of some type.\n\
    - A value is a set of bits interpreted according to a type.\n- A variable is a\
    \ named object.\n\nC++ has a small zoo of fundamental types, but since I'm not\
    \ a zoologist, I will not list all. You can find all of them in reference resources,\
    \ such as the [Cppreference] on the Web. Examples are:\n\nClick here to view code\
    \ image\n\n![](img/0bd2e25eba2737c3c5daca16fad1b65b_20_0.png)\n\nEach fundamental\
    \ type corresponds directly to hardware facilities and has a fixed size that determines\
    \ the range of values that can be stored in it:\n\n|bool|\nchar|\nint|\ndouble|\n\
    unsigned|\n\nA char variable is the natural size to hold a character on a given\
    \ machine (typically 8-bit byte), and the size of other types are multiples of\
    \ the size of a char. The size of a type is implementation-defined (i.e., it can\
    \ vary among different machines) and can be obtained by the sizeof operator; for\
    \ example, sizeof(char) equals 1 and sizeof(int) is often 4. When we want a type\
