  md: "The standard-library vector has capacity(), reserve(), and push_back(). The\
    \ reserve() is used by users of vector and other vector to make room for more\
    \ elements. It may have to allocate new memory and when it does, it moves the\
    \ elements to the new allocation. When reserve() moves elements to a new and larger\
    \ allocation, pointers to those elements will now point to the wrong location;\
    \ they have been invalidated and should not be used.\n\nGiven capacity() and reserve(),\
    \ implementing push_back() is trivial:\n\nClick here to view code image\n\n```\n\
    template<typename T>\nvoid Vector<T>::push_back(const T& t)\n{\n    if (capacity()<=size())\
    \                // make sure we space for it\n        reserve(size()=2*size());\
    \             // if do double the capacity\n    construct_at(space,t);       \
    \            // initialize space to \"place t at space\"\n    ++size;\n}\n```\n\
    \nNow allocation and relocation happens only infrequently. I used reserve() to\
    \ improve performance, but that turned out to be a waste of effort: the heuristic\
    \ used by vector is on average much better than my, so I now exclusively use reserve()\
    \ to avoid realloc of elements when I want to put elements.\n\nA vector can be\
    \ copied in assignments and initialization. For example:\n\nClick here to view\
    \ code image\n\nvector<Entry> book2= phone_back;\n\nCopying and moving vectors\
    \ are implemented by constructors and assignment operators as described in §6.2.\
    \ Copying involves copying its elements. Thus, the initialization of book2, book2\
    \ and phone_book hold separate copies of Entry in the phone book. When a vector\
    \ has many elements, such in-alloc assignments and initializations can be expensive.\
    \ Where copying is undesirable, references or pointers (§1.7) or move operations\
    \ (§6.2) should be used.\n\nThe standard-library vector is very flexible and efficient.\
    \ It is your default container; use it unless you have a solid reason to use some\
    \ other container. If you use vector because of vague concerns about \"efficiency,\"\
