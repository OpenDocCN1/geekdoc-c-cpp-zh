    # 19.1.3 The ISO C++ Standards


    The explosive growth of C++ caused some changes. Sometimes during 1987, it became
    clear that formal standardization of C++ was inevitable and that we needed to
    lay the groundwork for a standardization effort [Stroustrup,1994]. The result
    was a conscious effort to maintain contact between implementers of C++ compilers
    and their major users. This was done through electronic mail and face-to-face
    meetings at C++ conferences and elsewhere.


    AT&T Bell Labs made a major contribution to C++ and its wider community by allowing
    me to share revised versions of the C++ reference manual that could be seen. Because
    many of people worked for companies that were also competing with AT&T, the significance
    of this contribution should not be underestimated. A enlightened committee could
    have caused major problems of language fragmentation simply by doing nothing.
    As it happened, around a hundred individuals from dozens of organizations commented
    on what became the generally accepted reference manual and the document for the
    ANSI C++ standardization effort. Their names can be found in the Annotated C++
    Reference Manual ("the ARM") [Ellis,1999]. The X316 committee of ANSI was created
    in December 1989 at the initiative of Hewlett-Packard, DEC, and IBM by users.
    ANSI (American national) standardization of C++ became part of an ISO (international)
    standardization effort for C++. From 1990 onwards, these joint C++ standards committees
    have been the main forum for the evolution of C++ and the refinement of it. They
    served on these committees throughout. In particular, as chairman of the working
    group for extensions (later called the evolution group) from 1990 to 2014, I was
    responsible for handling proposals for major changes to C++ and the addition of
    new features. An initial draft standard for public review was produced in April
    1995. The first ISO C++ standard (ISO/IEC 14882-1998) [C++,1998] was ratified
    by a 22-0 vote in 2003, so sometimes people refer to C03, that is essentially
    the same language and standard as C++98.


    C++, known for years as C++0x, is the work of the members of WG21. The committee
    worked under increasingly onerous self-imposed processes and procedures. These
    processes probably led to a better (and more rigorous) specification, but they
    also limited innovation [Stroustrup,2007]. An initial draft standard for public
    review was produced in 2009. The second C++ standard (ISO/IEC 14882-2011) [C++,2011]
    was ratified by a 21-0 vote in August 2011.


    One reason for the lag between the two standards is that most of the committee
    (including me) were under the mistaken impression that the ISO rules required
    a "waiting period" after a standard was issued before starting on new features.
    Consequently, serious work on new language features did not start until 2002.
    Other reasons included the increased size of modern languages and their foundations
    libraries. In terms of pages of standards text, the language grew by about 30%
    and the standard library by about 100%. Much of the increase was due to more detailed
    specification, rather than new functionality.'
