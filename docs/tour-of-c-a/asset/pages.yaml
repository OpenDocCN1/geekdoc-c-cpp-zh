    #  19.1.6 The C++ Model


    The C++ language can be summarized as a set of mutually supportive features:


    +   - A static type system with built-in-types and user-defined types (Chapter
    1, Chapter 5, Chapter 6)

    - Value and reference semantics (§1.7, §5.2, §6.2, Chapter 12, §15.2)

    - Systematic and generic resource management (RAII) (§6.3)

    - Support for object-oriented programming (§5.3, class.virtual, §5.5)

    - Support for flexible and efficient generic programming (Chapter 7, Chapter 18)

    - Support for compile-time programming (§1.6, Chapter 7, Chapter 8)

    - Direct use of machine and operating system resources (§1.4, Chapter 18)

    - Concurrency through libraries (often implemented using intrinsics) (Chapter
    18)


    #  19.2 C++ Feature Evolution


    Here, I list the features and standard-library components that have been added
    to C++ for the C++11, C++14, C++17, and C++20 standards.


    #  19.2.1 C++11 Language Features


    Looking at a list of language features can be quite bewildering. Remember that
    a language feature is not meant to be in isolation. In particular, most features
    that are new in C++11 make no sense in isolation from the framework provided by
    older features.


    +   [1] Uniform and generic initialization using ø-lists (§1.4, §5.2.3)

    [2] Type deduction from initializer: auto (§1.4)

    [3] Prevention of narrowing (§1.4.2)

    [4] Generalized and guaranteed constant expressions: constexpr (§1.6)

    [5] Range-statement (§1.7)

    [6] Null pointer keyword: nullptr (§1.7.1)

    [7] Scoped and strongly typed enums: enum class (§2.4)

    [8] Compile-time assertions: static_assert (§4.5.2)

    [9] Language mapping of ø-list to std::initializer_list (§5.2.3)

    [10] Rvalue references, enabling move semantics (§6.2.2)

    [11] Lambdas (§7.3.3)'
