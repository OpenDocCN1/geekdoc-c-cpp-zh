  md: 'supports overloading, so there can be global functions called open(). This
    has to be reflected in the way the linkers.


    To give a C++ function linkage (so that it can be called from a C program fragment)
    or to allow a C function to be called from a C++ program fragment, declare it
    extern "C". For example:


    Click here to view code image


    ```

    extern "C" double sqrt(double);

    ```


    Now sqrt(double) can be called from a C or a C++ code fragment. The definition
    of sqrt(double) can be compiled as a C function or as a C++ function.


    Only one function of a given name in a scope can have (because C does not allow
    function overloading). A linkage specification does not affect type checking,
    so the C++ rules for function calls and argument checking still apply to a function
    declared extern "C".


