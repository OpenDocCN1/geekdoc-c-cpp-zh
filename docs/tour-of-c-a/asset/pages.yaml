    \n# 10.4 Regular Expressions\n\nRegular expressions are a powerful tool for text\
    \ processing. They provide a way to simply and tersely define patterns in text\
    \ (e.g., a U.S. postal code as TX 77845, or an ISO-style code, such as 2009-06-07)\
    \ and efficiently find such patterns. The standard library provides support for\
    \ regular expressions in the form of std::regex and its supporting functions.\
    \ To give a taste of the style of the regex library, let us define and print a\
    \ pattern:\n\nClick here to view code image\n\n```\nregex pat(\"\\w(2)\\s\\d(5):-\\\
    d(4)?\"); // U.S. postal code: XXdddddd-dddd and variants\n```\n\nPeople who have\
    \ used regular expressions in just any language will find lw(2)\\s\\d(5):-d(4)?\
    \ familiar. It specifies a pattern starting with two letters lw(2) optionally\
    \ followed by space \\s followed by five digits and four digits -d(4). If you\
    \ are not familiar with regular expressions, this might be a good time to learn\
    \ about them [[Stroustrup,2009], [Maddock,2009], [Friedl,1997]].].\n\nTo express\
    \ this, use a raw string literal starting with R\" and terminated by \". Strings\
    \ are particularly suitable for regular expressions because they often contain\
    \ a lot of backslashes. Had I used a conventional string, the pattern definition\
    \ would be:\n\nClick here to view code image\n\n```\nregex pat(\"\\w(2)\\s\\d(5):-\\\
    d(4)?\"); // U.S. postal code pattern\n```\n\nIn <regex>, the library provides\
    \ support for regular expressions:\n\n+   * regex_match(): Match a regular expression\
    \ against a string (of known size) (§10.4.2).\n* regex_search(): Search for strings\
    \ that match a regular expression in an (arbitrarily long) stream of data\n* regex_replace():\
    \ Search for strings that match a regular expression in an (arbitrarily long)\
    \ stream of data and replace them.\n* regex_iterator(): Iterate over matches and\
    \ submatches (§10.4.3).\n* regex_token_iterator: Iterate over non-matches."
