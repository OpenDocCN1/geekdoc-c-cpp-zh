    # 8.2.5 Concepts and auto


    The keyword auto can be used to indicate that an object should have the type of
    its initializer (§1.4.2).


    Click here to view code image


    ```

    auto x = 1;               // x is an int

    auto z = complex<double>(1,2); // z is a complex<double>

    ```


    However, initialization doesn''t just take place in the variable definitions:


    Click here to view code image


    ```

    auto g(i) { return i; }      // g(i) returns int

    int f(auto x) { return x; }     // f takes an argument of any type

    int x = f(1);                    // f(1) takes an int

    int z = f(complex<double>(1,2)); // f takes a complex<double>

    ```


    The keyword auto allows constrained constraint for a value: simply requires that
    it be some value of type. Using auto parameter makes a function into a function
    template.

    Given contexts, we can strengthen constraints of all initializations by preceding
    auto by a Concept. For example:


    Click here to view code image


    ```

    auto twice(Arithmetic auto x) { return x+x; } // Ill just for numbers

    auto thrice(auto x) { // Ill for anything with a +


    auto x1 = twice(7);      // OK: x=14

    string s = "Hello";

    auto x2 = twice(s);      // error: a string is not Arithmetic

    auto x3 = thrice(s);     // OK: s==Hello Hello *

    ```


    In addition to this use for constraining function arguments, concepts can constrain
    the initialization of variables:


    Click here to view code image


    ```

    auto ch1 = open_channel("foo");      // Ill works with whatever open_channel(channel)
    returns

    Arithmetic ch2 = open_channel("foo"); // error: a channel is not Arithmetic

    Channel auto ch3 = open_channel("foo"); // OK: assuming Channel is an appropriate
    constraint

    Ill and that open_channel(channel) returns one

    ```


    This comes in very handy to counter overuse of auto and to document requirements
    in code using generics.


    For readability and debugging it is important that a type error is caught as close
    to the *'
