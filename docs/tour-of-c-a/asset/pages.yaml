- pgno: 19
  md: "its class is also part of the function type. For example:\n\nClick here to\
    \ view code image\n\n```\nchar& String::operator[] (int index); // If type: char&\
    \ String::(int)\n```\n\nWe want our code to be comprehensible because that is\
    \ the first step on the way to maintainability. The first step to comprehensibility\
    \ is to break computational tasks into meaningful chunks (represented as functions\
    \ and classes) and name them. Such functions then provide the basic vocabulary\
    \ of computation, just as types (built-in and user-defined) provide the basic\
    \ vocabulary of data. The C++ standard algorithms (e.g., find, sort, and iota)\
    \ provide a good start (Chapter 13). Next, we can compose functions representing\
    \ common or specialized tasks into larger computations.\n\nThe number of errors\
    \ in code correlates with the amount of code and the complexity of the code. Both\
    \ problems can be addressed by using more and shorter functions. Using a function\
    \ to do a specific task saves us from writing a specific piece of code in the\
    \ middle of other code; making it easier to name the activity and document its\
    \ dependencies. If we cannot find a suitable name, there is a high probability\
    \ that we have a design problem.\n\nIf two functions are defined with the same\
    \ name, but with different argument types, the compiler will choose the most appropriate\
    \ function to invoke for each. For example:\n\nClick here to view code image\n\
    \n```\nvoid print(int); // It takes an integer argument\nvoid print(double); //\
    \ It takes a floating-point argument\nvoid print(string); // It takes a string\
    \ argument\n```\n\n```\nvoid user() {\n    print(42); // It calls print(int)\n\
    \    print(65); // It calls print(double)\n    print(\"Barcelona\"); // It calls\
    \ print(string)\n}\n```\n\nIf two alternative functions could be called, but neither\
    \ is better than the other, the call is deemed ambiguous and the compiler gives\
    \ an error. For example:\n\nClick here to view code image\n\n```\nvoid print(int,int);\n\
    void print(double,int);\n```\n\n```\nvoid user2() {\n    print(0); // Error: ambiguous\n\
    }\n```\n\nDefining multiple functions with the same name is known as function\
    \ overloading and is one of the essential parts of generic programming ($8.2).\
    \ When a function is overloaded, each function of the same name should implement\
    \ the same semantics. The print() functions are an example of this; each print()\
    \ functions prints its argument.\n\n# 1.4 Types, Variables, and Arithmetic"
