  md: "# 6.1.1 Essential Operations\n\nConstructors, destructors, and copy and move\
    \ operations for a type are not logically separate. We must define them as a matched\
    \ set or suffer logical or performance problems. If a class x has a destructor\
    \ that performs a nontrivial task, such as free-store deallocation or lock release,\
    \ the class is likely to need the full completion of:\n\nClick here to view code\
    \ image\n\n```\nclass X {\npublic:\n    X(Sometype); // \"ordinary constructor\"\
    : create an object\n    X(); // default constructor\n    X(const X&); // copy\
    \ constructor\n    X(X&&); // move constructor\n    X& operator=(const X&); //\
    \ copy assignment: clean up target and copy\n    X& operator=(X&&); // move assignment:\
    \ clean up target and move\n    ~X(); // destructor: clean up\n};\n```\n\nThere\
    \ are five situations in which an object can be copied or moved:\n\n+   - As the\
    \ source of an assignment\n- As an object initializer\n- As a function argument\n\
    - As a function return value\n- As an exception\n\nAn assignment uses a copy or\
    \ move assignment operator. In principle, the other cases use a copy or move constructor.\
    \ However, a copy or move constructor invocation is often optimized away by constructing\
    \ the object used to initialize right in the target object. For example:\n\n```\n\
    X make(Sometype);\nx = make(value);\n```\n\nHere, a compiler will typically construct\
    \ the X from make() directly in x; eliminating (“elision”) a copy.\n\nIn addition\
    \ to the initialization of named objects and objects on the free store, constructors\
    \ are used to initialize temporary objects and implement explicit type conversion.\
    \ Except for the \"ordinary constructor,\" these special member functions will\
    \ be generated by the compiler as needed. If you want to be explicit about generating\
    \ default implementations, you can:\n\nClick here to view code image\n\n```\n\
    class Y {\npublic:\n    Y(Sometype); // I really want the default copy constructor\n\
    \    Y(const Y&) = default; \n    Y(Y&&) = default; // and the default move constructor\n\
    \    // ...\n};\n```"
