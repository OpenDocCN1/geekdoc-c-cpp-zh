  md: "The \"visitor\" visit then applies () to the overload object, which selects\
    \ the most appropriate lambda to calling the overload rules.\n\nA deduction guide\
    \ is a mechanism for resolving subtle ambiguities, primarily for constructors\
    \ of class templates in foundation libraries (§7.2.3).\n\nIf we try to access\
    \ a variant holding a different type from the expected one, bad_variant_access\
    \ is thrown.\n\n# 15.4.2 optional\n\nAn optional<> can be a special kind of variant\
    \ (like a variant<A, Nothing>) or as a generalization of the idea of an A either\
    \ pointing to an object or nullptr.\n\nAn optional can be useful for functions\
    \ that may or not return an object:\n\nClick here to view code image\n\n```\n\
    optional<string> compose_message(istream& s)\n{\n  string mess;\n  // read from\
    \ s and compose message ...\n  if (no_problems)\n    return mess;\n  return {};\
    \ // The empty optional\n}\n```\n\nGiven that, we can write\n\nClick here to view\
    \ code image\n\n```\nIf (auto m = compose_message(cin))\n  cout << m; // Note\
    \ the dereference (*)\nelse\n  // ... handle error ...\n```\n\nThis appears to\
    \ some people who dislike exceptions (see §4.4). Not curious use of optional is\
    \ treated as a pointer to its object rather than the object itself.\n\nThe optional\
    \ equivalent to nullptr is the empty object, {}. For example:\n\nClick here to\
    \ view code image\n\n```\nint x = sum(17,19); // 36\nint y = sum(17,0); // 17\n\
