- pgno: 257
  md: "is primarily aimed at supporting systems-level concurrency rather than directly\
    \ providing sophisticated higher-level concurrency models; those can be supplied\
    \ in libraries using the standard-library facilities.\n\nThe standard library\
    \ supports concurrent execution of multiple threads in a address space. To allow,\
    \ C++ provides a suitable memory model and a set of atomic operations. The atomic\
    \ operations allow lock-free programming [Devchev,2010]. The memory model ensures\
    \ that as long a programmer avoids data races (uncontrolled concurrent access\
    \ to mutable data), everything works as one would naively expect. However, most\
    \ users will see concurrency in the standard library and libraries built on top\
    \ of them. This section briefly gives examples of the standard-library concurrency\
    \ facilities: threads, mutex, lock() operations, packaged_tasks and futures. These\
    \ features are built directly upon operating systems and do not incur performance\
    \ penalties compared with that. Neither do they guarantee significant performance\
    \ improvements compared to the operating system offers.\n\nDo not consider concurrency\
    \ apiece. If a task can be done sequentially, it is often faster and easier to\
    \ do so. Passing information from one thread to another can be surprisingly expensive.\n\
    \nAs an alternative to using concurrency features, we can use a parallel algorithm\
    \ to exploit multiple execution engines for performance (§13.6, §17.3.1).\n\n\
    Finally, C++ supports coroutines; that is, functions that keep their state between\
    \ calls (§18.6).\n\n# 18.2 Tasks and threads\n\nWe call a computation that can\
    \ potentially be executed with other computations a task. A thread is the system-level\
    \ representation of a task in a program. A task to be executed concurrently with\
    \ other threads is launched by constructing a thread (in <thread>) with the task\
    \ as its argument. A task is a function or a function object:\n\nClick here to\
    \ view code image\n\n```\nvoid f();\nstruct F {\n    void operator()();\n};\n\
    void user(void (*f)()) {\n    thread t1(f);\n    thread t2(F{});\n\n    t1.join();\n\
    \    t2.join();\n}\n```\n\nThe join() ensures that we don't exit() until the threads\
    \ have completed. To \"join\" a thread means to \"wait for the thread to terminate.\"\
    \n\nIt is easy to forget that join(), and the results are usually bad so the standard\
    \ library provides jthread, which is a \"joining thread\" that follows RAII by\
    \ having its destructor join():"
