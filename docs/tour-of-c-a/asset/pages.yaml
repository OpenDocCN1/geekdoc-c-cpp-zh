    #  9.2 Standard-Library Components


    The facilities provided by the standard library can be classified like this:


    +   * Run-time language support (e.g., for allocation, exceptions, and run-time
    type information).

    * The C standard library (with very minor modifications to minimize type systems).

    * Strings with support for international character sets, localization, and read-only
    views of substrings (§10.2).

    * Support for regular expression matching (§10.4).

    * I/O is an extensible framework for input and output to which users can add their
    own types, streams, buffering strategies, locales, and character sets (Chapter
    11). It also offers facilities for flexible output formatting (§11.6.2).

    * A library for managing file systems in a portable manner (§11.9).

    * A framework of containers (such as vector and map; Chapter 12) and algorithms
    (such as find(), sort(), and merge(); Chapter 13). This framework, canonically
    called the STL [Stepanov,1994], is extensible so users can add their containers
    and algorithms.

    * Ranges (§14.1), including views (§14.2), generators (§14.3), and pipes (§14.4).

    * Concepts for fundamental types and algorithms (§14).

    * Support for numerical computation, such as standard mathematical functions,
    complex numbers, with arithmetic operations, mathematical constants, and random-number
    generators (§5.2.1 and Chapter 16).

    * Support for concurrent programming, including threads and locks (Chapter 18).
    The concurrency support is foundational so that users can add for new models of
    concurrency.

    * Synchronous and asynchronous coroutines (§18.6).

    * Parallel versions of most STL algorithms and some of numerical algorithms, such
    as sort(§13.6) and reduce(§17.3).

    * Utilities to metaprogramming (e.g., type functions; §16.4), STL-style programming
    (e.g., pair; §15.3, §15.3.3), variant and optional; §15.4.1, §15.4.2).

    * “Smart pointers” for resource management (e.g., unique_ptr and shared_ptr; §15.2.1).

    * Special-purpose containers, such as array (§15.3.1), bitset (§15.3.2), and tuple
    (§15.3.3).'
