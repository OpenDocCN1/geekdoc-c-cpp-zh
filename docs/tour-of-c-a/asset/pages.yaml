  md: 'pointers disappear into resource handles. In both cases, the result is simpler
    and more maintainable code, without added overhead. In particular, we can achieve
    strong resource safety; that is, we can eliminate resource leaks for a general
    notion of a resource. Examples are vectors holding memory, threads holding system
    threads, and fstreams holding file handles.


    In many languages, resource management is primarily delegated to a garbage collector.
    In C++, you can plug in a garbage collector the last choice after cleaner, more
    general, and better localized alternatives to resource management have been exhausted.
    My ideal is not to create any garbage, eliminating the need for a garbage collector:
    Do not litter!


    Garbage collection is fundamentally a global memory management scheme. Clever
    implementations can compensate, as systems get more distributed (caches, multicores,
    clusters), locality is less important than ever.


    Also, memory is not the only resource. A resource is anything that has to be acquired
    and (explicitly or implicitly) released after use. Examples are memory, sockets,
    file handles. Surprisingly, a resource is not just memory as a non-memory resource.
    A good resource management system handles all kinds of resources. Leaks must be
    avoided in any long-running system, but excessive resource retention can be as
    bad as a leak. For example, if a system holds on memory, locks, files, etc. for
    too long, the system needs to be provisioned with twice as many resources.


    Before resorting to garbage collection, systematically use resource handles: let
    each resource have an owner and be deleted by the end of its owner''s scope. In
    C++, this is known as RAII (Resource Acquisition Initialization) and is integrated
    with error handling in the face of exceptions. Resources can be moved from scope
    using moving semantics or "smart pointers," and shared ownership can be represented
    by "shared pointers" (§15.2.1).


    In the C++ standard library, RAII preserves: for example, string, vector, map,
    unordered_map, etc.), fstreams (fstream, ofstream), threads (thread), locks (lock_guard,
    unique_lock, etc.), and general objects through unique_ptr and shared_ptr. The
    result is implicit resource management that is invaluable in common use and leads
    to less contention.


    # 6.4 Operator Overloading


    We can give meaning to C++''s operators for user-defined types (§2.4, §5.2.1).
    That''s called operator overloading when used, the correct implementation of an
    operator must be selected from a set of operators with that name. For example,
    our complex + in z1+z2 (§5.2.1) has to be distinguished from the floating-point
    + and (§1.4.1).


    It is not possible to define new operators, we cannot define operators ^, *, ==,
    or unary %. Allowing that would cause confusion and avoid.


    It is strongly recommended to define operators with conventional semantics. For
    example, an operator + that subtracts without doing any good.


    We define operators for user-defined types (classes and enumerations):


    +   * Binary arithmetic operators: +, *, /, and %

    * Binary logical operators: & (bitwise and), | (bitwise or), and ^ (bitwise exclusive
    or)

    * Binary relational operators: ==, !=, <=, >=, >, and <='
