  md: "# 14.5.2 Iterator Concepts\n\nThe traditional standard algorithms access their\
    \ data through iterators, so we need concepts to classify properties of iterator\
    \ types.\n\n| input_or_output_iterator | An I can be incremented (++) and dereferenced\
    \ (*) |\n| sentinel_for<S,I> | An S is a sentinel for an Iterator type; is, S\
    \ is a predicate on I's value type |\n| sized_sentinel_for<S,I> | An S sentinel\
    \ where - operator can be applied to I |\n| input_iterator<I> | An I is an input\
    \ iterator; * can be used for reading only |\n| output_iterator<I> | An I is an\
    \ output iterator; can be used for writing only |\n| forward_iterator<I> | A I\
    \ is a forward iterator, supporting multi-pass and == |\n| bidirectional_iterator<I>\
    \ | A bidirectional_iterator supporting -- |\n| random_access_iterator<I> | A\
    \ bidirectional_iterator supporting +, +=, -, and [] |\n| contiguous_iterator<I>\
    \ | A random_iterator for elements in contiguous memory |\n| permutable_iterator<I>\
    \ | A forward_iterator supporting move and swap |\n| mergeable<I,I2,R,O> | Can\
    \ merge sequences defined by I and I2 into O using relation<R>\n| sortable<I>\
    \ | Can sort sequences defined by I using less |\n| sortable<I,R> | Can sort sequences\
    \ defined by I using relation<R>?\n\nmergeable and sortable are simplified relative\
    \ to their definition in C++20.\nThe different kinds (categories) of iterators\
    \ are used to select the best algorithm for a given set of arguments; see 8.2.2\
    \ and 16.4.1. For an example an input_iterator, see 13.3.1.\nThe basic idea of\
    \ an iterator is that we can iterate over a range starting at an iterator until\
    \ the predicate becomes true for an element. That way, an iterator p and sentinel\
    \ s defines a range [p:s(p)). For example, we could define a predicate for a traversing\
    \ a C-style string using a pointer as the. Unfortunately, this requires some boilerplate\
    \ because the idea is to present the predicate as something that cannot be confused\
    \ with an ordinary iterator but that you can compare the iterator to traverse\
    \ the range\n\nClick here to view code image\n\n```\ntemplate<class Iter>\nclass\
    \ Sentinel {\npublic:\n    Sentinel(int ee) : end(ee) {}\n    Sentinel():end(0)\
    \ {} // Concept Sentinel_for requires a default constructor\n    friend bool operator==(const\
    \ Iter& p, Sentinel s) { return (p == s.end); }\n    friend bool operator!=(const\
    \ Iter& p, Sentinel s) { return !(p == s); }\nprivate:\n    iter_value_t<char>*\
    \ end; // The sentinel value\n```"
