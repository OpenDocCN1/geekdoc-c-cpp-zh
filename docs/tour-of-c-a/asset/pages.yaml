  md: "on the stack, an object, or in static storage. The elements are allocated in\
    \ the scope where the array is defined. An array is best understood as a built-in\
    \ array with its size firmly attached, without implicit, potentially surprising\
    \ conversions to pointer types, and with a few convenience functions provided.\
    \ There is no overhead (time or space) involved in using an array compared to\
    \ a built-in array. An array does not follow the \"handle to elements\" model\
    \ of STL. Instead, an array directly connects its elements. It is nothing more\
    \ or less than a safer version of a built-array.\n\nThis implies that an array\
    \ can be initialized by an initializer list:\n\n```\narray<int,3> a1 = (1,2,3);\n\
    ```\n\nThe number of elements in the initializer must be equal to or less than\
    \ the number of elements specified for the array.\n\nThe element count is not\
    \ optional, the element count must be a constant expression, the number of elements\
    \ must be positive, and the element type must be explicitly stated:\n\nClick here\
    \ to view code image\n\n```\nvoid f(int n)\n{\n  array<int> a = {1,2,3};     \
    \        // error size not specified\n  array<string,n> a1 = {\"Johns\",\"Queens\"\
    }; // error size not a constant expression\n  array<string,0> a2;            \
    \    // error size must be positive\n  array<int,2> a3 = {\"Johns\",\"Queens\"\
    }; // error element type not stated\n  ...\n}\n```\n\nIf you need the array to\
    \ be a variable, use vector.\nWhen necessary, an array can be explicitly passed\
    \ to a C-style function that expects a pointer.\nFor example:\n\nClick here to\
    \ view code image\n\n```\nvoid f(int*, int sz);      // C-style interface\nvoid\
    \ g()\n{\n  array<int,10> a;\n  f(a.data(), a.size());             // error: no\
    \ conversion\n  f(a.data());                        // C-style use\n  auto p =\
    \ find(a, 777);               // C++/STL-style use (a range is passed)\n  ...\n\
    }\n```\n\nWhy we would use an array when vector is more flexible? An array is\
    \ less flexible than it is simpler. Occasionally, there is a significant performance\
    \ advantage to be had by accessing elements allocated on the stack rather than\
    \ allocating on the free store, accessing them directly through the vector (a\
    \ handle), and deallocating them. On the other hand, the stack is a limited resource\
    \ (especially on some embedded systems), and stack overflow is nasty. Also, there\
    \ are application areas, such as safety-critical real-time control, where free\
    \ store allocation is banned. For example, use of delete may lead to fragmentation\
    \ (§12.7) or memory exhaustion (§4.3)."
