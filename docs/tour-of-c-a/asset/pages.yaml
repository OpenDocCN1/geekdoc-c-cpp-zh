  md: "Confusingly, std::move() doesn't move anything. Instead, it casts its argument\
    \ to an rvalue reference, saying that its argument will not be used again and\
    \ therefore may be moved (§6.2.2). It should have been called like rvalue_cast.\
    \ It exists to serve a few essential cases. Consider a simple swap:\n\nClick here\
    \ to view code image\n\n```\ntemplate <typename T>\nvoid swap(T& a, T& b) {\n\
    \    T tmp (move(a));\n    a = move(b);\n    b = move(tmp);\n}\n```\n\nWe don't\
    \ repeatedly copy potentially large objects, but we request moves using std::move().\n\
    \nFor other cases, there are tempting, dangerous, uses of std::move(). Consider:\n\
    \nClick here to view code image\n\n```\nstring s1 = \"Hello\";\nstring s2 = \"\
    World\";\nvector<string> v;\nv.push_back(s1);\nv.push_back(move(s2));\nv.emplace_back(s1);\n\
    ```\n\nHere s1 is copied by (push_back()) whereas s2 is moved. This sometimes\
    \ (only) makes the push_back() of s2 costly. The problem is that a moved-from\
    \ object is left behind. If we use s2 again, we have a problem:\n\nClick here\
    \ to view code image\n\n```\ncout << s1[2];\ncout << s2[2];\n```\n\nI consider\
    \ this use of std::move() to be error-prone for widespread use. Don't use it unless\
    \ you can demonstrate significant and necessary performance improvement. Later\
    \ maintenance may accidentally intend the use of moved-from object.\n\nThe compiler\
    \ knows that a value is not used in a function, so using an explicit std::move(x),\
    \ is redundant and can inhibit optimizations. All standard-library types leave\
    \ a moved-from object in a state that is unspecified, but it can be destroyed\
    \ and assigned to it. It may unwise not to follow that. For a container (e.g.,\
    \ vector or string), the moved-from state will be “empty.” For many types, the\
    \ default value is a good state: meaningful and cheap to establish.\n\nForwarding\
    \ arguments are an important case that requires moves (§8.4.2). We want to transmit\
    \ a set of arguments on another function without changing anything (to achieve\
    \ “perfect forwarding”):\n\nClick here to view code image"
