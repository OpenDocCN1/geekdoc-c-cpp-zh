- pgno: 236
  md: "Like all standard-library algorithms, for_each() calls its argument using the\
    \ traditional function syntax f(x), Shape's draw() uses the conventional object-oriented\
    \ notation x->f(i). A lambda easily mediates between the two notations.\n\n# 16.3.2\
    \ mem_fn()\n\nGiven a member function, the adaptor mem_fn(mf) produces a function\
    \ object that can be called as a nameless function. For example\n\nClick here\
    \ to view code image\n\n```\nvoid draw_all(vector<Shape>& v)\n{\n    for_each(v.begin(),v.end(),mem_fn(&Shape::draw));\n\
    }\n```\n\nBefore the introduction of lambdas in C++11, mem_fn() and equivalents\
    \ were the main way to map from the object-oriented style to the functional one.\n\
    \n# 16.3.3 function\n\nThe standard-library function is a type that can hold any\
    \ object you can invoke using the call operator (()). That is, any object of type\
    \ function is a function object (7.3.2). For example:\n\nClick here to view code\
    \ image\n\n```\nint f1(double);\nfunction<int(double)> fct1(f1);\n\nint f2(string);\n\
    function fct2(f2);\n\nfunction fct3 = [[Shape* p] { p->draw(); };\n```\n\nFor\
    \ fct2, I let the function be deduced from the initializer: int(string). Obviously,\
    \ functions are useful for callbacks, passing arguments as arguments, function\
    \ objects, however, introduce some run-time overhead compared to direct calls.\
    \ In particular, for a function object where the size is not computed at compile-time,\
    \ a free-store allocation might occur which badly impacts performance-critical\
    \ applications. A solution is coming for C++23: move_only_function.\n\nAnother\
    \ problem is being an object, does not participate in overloading. If you need\
    \ to overload function objects (including lambdas), consider overloaded (15.4.1).\n\
    \n# 16.4 Type Functions\n\nA type function is a function that is evaluated at\
    \ compile time given a type as its argument or returning a type. The standard\
    \ library provides a variety of type functions to help library implementers (and\
    \ programmers in general) write code that takes advantage of aspects of the language,\
    \ the standard library, and code in general."
