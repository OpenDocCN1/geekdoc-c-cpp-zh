    \ of complex types on the stack, in statically allocated memory, and in other\
    \ objects ($1.5).\n\n+   - Refer to objects directly (and not just through pointers\
    \ or references).\n\n+   - Initialize objects directly and completely (e.g., using\
    \ constructors; $2.3).\n\n+   - Copy and move objects ($6.2).\n\nThe representation\
    \ can be private and accessible only through the member functions (as it is for\
    \ Vector; $2.3), but it is present. Therefore, if the representation changes in\
    \ any significant way, a user must remember. This is the price to pay for having\
    \ complex types behave like built-ins. For types that don't change often, and\
    \ local variables provide much-needed clarity and efficiency, this is acceptable\
    \ and ideal. To increase flexibility, a complex type can keep major parts of its\
    \ representation on the free store (dynamic memory, heap) and access them through\
    \ the part stored in the class object. That's the way vector and string are implemented;\
    \ they can be considered resource handles with carefully crafted interfaces.\n\
