  md: "doubleComp4(vector<double>& v)\nIt spawn many tasks if v is large enough\n\n\
    ```\n{\n    if (v.size()<10000)\n        return accum(v.begin(),v.end(),0.0);\n\
    \n    auto v0 = &v[0];\n    auto sz = v.size();\n\n    auto f0 = async(accum,v0,v0+sz/4,0.0);\n\
    \    auto f1 = async(accum,v0+sz/4,v0+sz/2,0.0);\n    auto f2 = async(accum,v0+sz/2,v0+sz/3,0.0);\n\
    \    auto f3 = async(accum,v0+sz/3,v,0.0);\n\n    return f0.get()+f1.get()+f2.get()+f3.get();\n\
    }\n```\n\nBasically, async() separates the \"call part\" of a function from the\
    \ \"get result part\" and separates both from the actual execution of the task.\
    \ Using asci(), you don't have to think about threads and locks. Instead, you\
    \ think in terms of tasks that potentially compute their results asynchronously.\
    \ There is an obvious limitation: don't even think of async() for tasks that share\
    \ resources loading. With async() you don't even know how many threads will be\
    \ used because async to decide based on what it knows about the system resources\
    \ available at the time of a call. For example, async() can check whether idle\
    \ cores (processors) are available before deciding how many threads use.\n\nUsing\
    \ a guess about the cost of computation relative to the cost of launching a thread,\
    \ such as v.size()<10000, is very prime and prone to mistakes about. However,\
    \ this is not the place for a proper discussion about how manage threads. Don't\
    \ estimate this as more than a simple and probably poor guess.\n\nIt is rarely\
    \ necessary to parallelize a standard-library algorithm, e.g., reduce(par_unseq,...))\
    \ I usually do a better job at that (§17.3.1). However, the technique is generic.\n\
    \nPlease note that async() is not just a mechanism for parallel computation for\
    \ improved performance. It can also be used to spawn a task for getting information\
    \ from a user, leaving the \"main program\" with something else (§18.5.3).\n\n\
    # 18.5.4 Stopping a thread\n\nSometimes we want to stop a thread because we are\
    \ no longer interested in its result. \"killing\" is not acceptable because a\
    \ thread can consume resources that are released (e.g., locks, sub-threads, and\
    \ database connections). The standard library provides a mechanism for properly\
    \ clean up and go away: a stop_token. A thread can be programmed to terminate\
    \ if a stop_token and is requested to stop.\n\nConsider a parallel algorithm find_any()\
    \ that spawns threads looking for a result. When a thread returns with an answer,\
    \ we would like to stop the remaining threads. Each thread spawned by find_any()\
    \ calls find() to do the real work. The find() is a very simple example of a common\
    \ style of task where there is a main loop in which we can insert a test of whether\
    \ to continue or stop:"
