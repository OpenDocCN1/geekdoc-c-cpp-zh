  md: "separation can be used to minimize compilation times and to enforce separation\
    \ of logically distinct parts of a program (thus minimizing the chance of errors).\
    \ A library is often a collection of separately compiled code fragments (e.g.,\
    \ functions).\nThe header-file technique for organizing code goes back to the\
    \ earliest days of C and is still by far the most common. The use of modules is\
    \ in C++20 and offers massive advantages in code hygiene and compile time.\n\n\
    # 3.2.1 Header Files\n\nTraditionally, we place declarations that specify the\
    \ interface to a piece of code we consider a module in a file with a name indicating\
    \ its intended use. For example:\n\nClick here to view code image\n\n// Vector.h:\n\
    \n```\nclass Vector {\npublic:\n    Vector(int s);\n    double& operator[](int\
    \ i);\n    int size();\nprivate:\n    double* elem;\n    int sz;\n}\n```\n\nThis\
    \ declaration would be placed in a file Vector.h. Users then #include that file,\
    \ called a header file, to access interface. For example:\n\nClick here to view\
    \ code image\n\n// user.cpp:\n\n```\n#include \"Vector.h\" // get Vector's interface\n\
    #include <cmath> // get the standard-library math function interface including\
    \ sqrt())\ndouble sqrt_sum(const Vector& v) {\n    double sum = 0;\n    for (int\
    \ i=0; i<v.size(); ++i)\n        sum+=std::sqrt(v[i]); // sum of square roots\n\
    \    return sum;\n}\n```\n\nTo help the compiler ensure consistency, the .cpp\
    \ file providing the implementation of Vector also include the .h file providing\
    \ its interface:\n\nClick here to view code image\n\n// Vector.cpp:\n\n```\n#include\
    \ \"Vector.h\" // get Vector's interface\nVector::Vector(int s) \n    :elem(new\
    \ double[s]), sz(s) {} // initialize members\n```"
