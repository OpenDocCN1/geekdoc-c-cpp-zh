  md: '# 17.3.1 Parallel Numerical Algorithms


    In <numeric>, the numerical algorithms (§17.3) have parallel versions that differ
    slightly from the sequential ones. In particular, the parallel versions allow
    operations on elements in unspecified order. The parallel numerical algorithms
    can also take an execution policy argument (§13.6): seq, unseq, par, and par_unseq.


    | Parallel Numerical Algorithms |

    |---||

    | x=reduce(b,e) | x=accumulate(b,e,v), except out of order |

    | x=reduce(b,e) | x=reduce(b,e,v), where v is b''s value |

    | x=reduce(pol,b,e) | x=reduce(b,e,v) with execution policy pol |

    | x=reduce(pol,b,e) | p=partial_sum(b,e,v), where v is b''s value |

    | p=exclusive_scan(pol,b,e,out) | p=partial_sum(b,e,out) which excludes the ith
    input element from the ith sum |

    | p=inclusive_scan(pol,b,e,out) | p=partial_sum(b,e,out) which includes the ith
    input element in the ith sum |

    | p=transform_reduce(pol,b,e,f,v) | f(x) for x in [b:e), then reduce |

