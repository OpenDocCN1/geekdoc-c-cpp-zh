  md: "If we try to access an optional that does not hold a value, the result is undefined;\
    \ an exception is not thrown. Thus, optional is not guaranteed type safe. Don’t\
    \ try:\n\nClick here to view code image\n\n```\nint sum2(optional<int> a, optional<int>\
    \ b)\n{\n    return \"a*b\"; // asking for trouble\n}\n```\n\n# 15.4.3 any\n\n\
    An any can hold an arbitrary type and know which type (if any) it holds. It is\
    \ basically an unconstrained version of variant:\n\nClick here to view code image\n\
    \n```\nany compose_message(istream& s)\n{\n    string mess;\n    // ... read from\
    \ s and compose message ...\n    if (no_problems)\n        return mess;\n    else\n\
    \        return error_number(); // return an int\n}\n```\n\nWhen you assign or\
    \ initialize an any with a value, it remembers the type of that value. Later,\
    \ we can extract the value held by the any by asserting the value's expected type.\
    \ For example:\n\nClick here to view code image\n\n```\nauto m = compose_message(cin);\n\
    string& s = any_cast<string>(m);\ncout << s;\n```\n\nIf we try to access an any\
    \ holding a different type than the expected one, bad_any_access is thrown.\n\n\
    # 15.5 Advice\n\n+   [1] A library doesn’t have to be large or complicated to\
    \ be useful; §16.1.\n[2] A resource is anything that has to be acquired (explicitly\
    \ or implicitly) released; §15.2.1.\n[3] Use resource to manage resources (RAII);\
    \ §15.2.1; [CG: R.20].\n[4] The problem with a T is that it can be used to represent\
