    # # 1.9 Mapping to Hardware


    C++ offers a direct mapping to hardware. When you use one of the fundamental operations,
    the implementation is what the hardware offers, typically a single machine operation.
    For example, adding two ints, x+y executes an integer add machine instruction.


    A C++ implementation sees a machine''s memory as a sequence of memory locations
    into which it can place (typed) objects and address them using pointers:


    | | 100 | 101 | 102 | 103 | 104 | 105 |

    |---|---|---|---|---|---|---|


    A pointer is represented in memory as a machine address, so the numeric value
    of p in this figure would be 103. If this looks like an array ($1.7), that''s
    because an array is C++''s basic abstraction of "a contiguous sequence of objects
    in memory."


    The simple mapping of fundamental language constructs to hardware is crucial for
    the raw low-level performance for which C and C++ have been famous for decades.
    The basic model of C and C++ is based on computer hardware, rather than some form
    of mathematics.


    # # 1.9.1 Assignment


    An assignment of a built-in type is a simple machine copy operation. Consider:


    Click here to view code image


    ```

    int x = 2;

    int y = 3;

    x = y;

    // it becomes 3; so we get x=y

    ```


    This is obvious. We can represent that graphically like this:


    | x: | 2 | y: | 3 | x = y: | y: | 3 |

    |---|---|---|---|---|---|---|


    The two objects are independent. We can change the value of y without affecting
    the value of x. For example, x=99 will not change the value of y. Unlike Java,
    C#, and other languages, but like C, that is true for all types, not just for
    ints.


    If we want different objects to refer to the same (shared) value, we must say
    so. For example:

