  md: "I didn't even have to launch a thread; by default, this_thread can refer to\
    \ the one and only thread.\nUsed duration_cast to adjust the clock's units to\
    \ the nanoseconds I wanted.\n\nThe basic support for communicating external events\
    \ is provided by condition_variables found in <condition_variable>. A condition_variable\
    \ is a mechanism allowing one thread to wait for another. In particular, it allows\
    \ a thread to wait for some condition (if called an event) as the result of work\
    \ done by other.\n\nUsing condition_variables supports many forms of elegant and\
    \ efficient sharing but can be rather tricky. Consider the classic example of\
    \ threads communicating by passing messages through a queue. For simplicity, I\
    \ declare the queue and the mechanism for avoiding race conditions on that queue\
    \ global to the producer and consumer:\n\nClick here to view code image\n\n```\n\
    class Message {\n    // Object to be communicated\n    //...\n};\n\nqueue<Message>\
    \ mqueue;\ncondition_variable mcond;\nmutex mtx;\n```\n\nThe types queue, condition_variable,\
    \ and mutex are provided by the standard library.\nThe consumer() reads and processes\
    \ Messages:\n\nClick here to view code image\n\n```\nvoid consumer() {\n    while(true)\
    \ {\n        unique_lock lock(mtx);\n        mcond.wait(lock, [] { return !mqueue.empty();\
    \ }); // Acquire mtx\n                                            // Release mtx\
    \ and wait;\n                                            // Re-acquire mtx upon\
    \ wakeup\n                                            // Doesn't wake up unless\
    \ mqueue is non-empty\n\n        auto m = mqueue.front();\n        mqueue.pop();\n\
    \        lock.unlock();\n        // Get the message\n        // Release mtx\n\n\
    \        // ... process m\n    }\n}\n```\n\nHere, I explicitly protects the operations\
    \ on the queue and the condition_variable with a unique_lock on the mutex. Waiting\
    \ on a condition_variable releases its lock until the wait is over (or the queue\
    \ is non-empty) and reacquires it. The explicit check of the condition, here mqueue.empty(),\
    \ protects against waking up just that some other task has \"gotten first\" so\
    \ that the condition no longer holds. For two reasons:\n\n+   * We need to pass\
    \ the lock to the condition_variable's wait(). A scoped_lock cannot be moved,\
    \ but a unique_lock can be.\n* We want to unlock the mutex protecting the condition\
    \ variable before processing the message. A unique_lock offers operations, such\
    \ as lock() and unlock(), for low-level control of synchronization.\n\nOn the\
    \ other hand, unique_lock can handle only a single mutex."
