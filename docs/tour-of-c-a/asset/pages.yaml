    \ - II A, Ax, Axxx\n* Ax+ - II Ax, Axx Not A\n* id-d? - II 2-12\n* w(d2)?id(4.5)\
    \ - II bs-245, xx-54321, 22-5432 Digits are in w\n* (d2)?d* - II 12, 123, 123\
