- pgno: 120
  md: "+   • The ability to pass values as template arguments. This implies opportunities\
    \ for compile-time computation.\n\nIn other words, templates provide a powerful\
    \ mechanism for compile-time computation and type manipulation that can lead to\
    \ very compact and efficient code. Remember that types (classes) can contain both\
    \ (§7.3.2) and values (§7.2.2).\n\nThe first and most common use of templates\
    \ is to support generic programming, that is, programming focused on design, implementation,\
    \ and use of general algorithms. Here, \"general\" means that an algorithm can\
    \ be designed to accept a wide variety of types as long as they meet the algorithm's\
    \ requirements on its arguments. Together with concepts, the template provides\
    \ C++'s main support for generic programming. Templates provide (compile-time)\
    \ parametric polymorphism.\n\n# # 8.2 Concepts\n\nConsider the sum() in §7.3.1:\n\
    \nClick here to view code image\n\n```\ntemplate<typename Seq, typename Value>\n\
    Value sum(Seq s, Value v)\n{\n  for (const auto& x : s)\n  {\n    v+=x;\n  }\n\
    \  return v}\n```\n\nsum() requires that\n\n+   • its first template argument\
    \ is some kind of sequence of elements, and\n• its second template argument is\
    \ some kind of number.\n\nTo be specific, sum() requires that\n\n+   • A sequence,\
    \ Seq, that supports begin() and end() so that the range-for will work (§1.7;\
    \ §14.1).\n• An arithmetic type, Value, which supports += so that the elements\
    \ of the sequence can be added.\n\nWe call such requirements concepts.\n\nExamples\
    \ of that might satisfy this requirement (and more) for being a sequence (also\
    \ called a range) include the standard-library vector, list, and map. Examples\
    \ of types that meet this fulfilled requirement (and more) for being an arithmetic\
    \ type like int, double, and Matrix (for any reasonable definition of Matrix).\
    \ We could say that the sum() is generic in two dimensions: the type of the data\
    \ structure used to store elements (the “sequence”) and the type of elements.\n\
    \n# # 8.2.1 Use of Concepts\n\nMost templates must meet specific requirements\
    \ for the template to compile properly and for the generated code to work properly.\
    \ That, most templates should be constrained templates (§7.2.1). The type-name\
    \ introducer is the least constraining, requiring only"
