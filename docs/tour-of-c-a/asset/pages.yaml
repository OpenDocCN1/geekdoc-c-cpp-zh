    These standard-library abstractions encapsulate built-in types and are required
    to perform as well in time and space as correct uses of these types.


    There is nothing “magic” about these types. We can design and implement our own
    “smart pointers” and specialized containers as needed using the same techniques
    as are used for the standard-library ones.


    # 15.2 Pointers


    The general notion of a pointer is something that we refer to an object and access
    it according to its type. A built-in type, such as int*, is an example but there
    are many more.


    | Pointers |

    |---||

    | T* | A built-in pointer: points to an object of type T or to a contiguously-allocated
    sequence of elements of type T |

    | T& | A built-in reference: refers to an object of type T; a pointer with implicit
    dereference (§1.7) |

    | unique_ptr<T> | An owning pointer to a T |

    | shared_ptr<T> | A pointer to an object of T; ownership is shared by all shared_ptr''s
    to that T-ptr |

    | weak_ptr<T> | A pointer to an object owned by a shared_ptr; must be converted
    to a shared_ptr to access the object |

    | span<T> | A pointer to a contiguous sequence of Ts (§15.2.2) |

    | string_view<T> | A pointer to a const sequence of elements (§10.3) |

    | X_iterator<C> | A sequence of elements from C; The X in the name indicates the
    kind of iterator (§13.3) |


    There can be more than one pointer to an object. An owning pointer is one that
    is responsible for eventually deleting the object it refers to. A non-owning pointer
    (e.g., a T* or a span) can dangle; point to a location where an object has been
    deleted or gone out of scope.


    Reading or writing through a dangling pointer is one of the nastiest of bugs.
    The result of doing so is technically undefined. In practice, often means accessing
    an object that happens to occupy the location. A read means getting an array value,
    and a write scrambles an unrelated structure. The best we can hope for is a crash;
    usually preferable to a wrong result.


    The C++ Core Guidelines [CG] offers rules for avoiding this and for statically
    checking that it never happens. However, here are a few approaches for avoiding
    pointer problems:'
