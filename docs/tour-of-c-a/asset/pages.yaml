  md: 'away. However, the committee does not have the power to immediately remove
    a heavily used feature – however redundant or dangerous it may be. Thus, a却是 is
    a strong hint to avoid the feature. It may disappear in the future. The list of
    deprecated features is in Appendix D of the standard [C++,2020]. Compilers are
    likely to issue warnings for uses of deprecated features. However, deprecated
    features are part of the standard and history shows that they remain supported
    “for” reasons of compatibility. Even features finally found to be removed in implementations
    by use of pressure on implementers.


    +   - Removed: Exception specifications: void f() throw(X,Y); // C++98; now an
