    \ conclusions\nare not verified by experience.\n– Roger Bacon\n\n+   - Introduction\n\
    - Views\n- Generators\n- Pipelines\n- Concepts Overview\n  - Type Concepts; Iterator\
    \ Concepts; Range Concepts\n- Advice\n\n# 14.1 Introduction\n\nThe standard-library\
    \ offers both constrained using concepts (Chapter 8) and unconstrained (for compatibility).\
    \ versions are <ranges> in namespace ranges. Naturally, I prefer using the concepts.\
    \ A range is a generalization of the C++98 sequences defined by {begin(), end()}\
    \ pairs; it specifies what it takes to be a sequence of elements. A range can\
    \ be defined by\n\n+   - A (begin, end) pair of iterators\n- A (begin,n) pair,\
    \ where begin is an iterator and n is the number of elements\n- A (begin,pred)\
    \ pair, where begin is an iterator and pred is a predicate; if pred(p) is true\
    \ for the iterator p, we have reached the end of the range. This allows us to\
    \ have infinite ranges and ranges that are generated “on the fly” (§14.3)."
