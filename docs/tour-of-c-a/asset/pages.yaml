  md: 'technique ($5.2.2, $6.3).


    The notion of invariants is incentral to the design of classes, and preconditions
    serve a similar role in the design of invariants:


    +   - Formulating invariants helps us to understand precisely what we want.

    - Invariants force us to be specific; this gives us a better chance of getting
