    \ to view code image\n\n```\ntemplate<class T>\nvoid copy(T* first, T* last, T*\
    \ target)\n{\n    if constexpr (is_trivially_copyable_v<T>)\n        memcpy(first,\
    \ (last - first) * sizeof(T));\n    else\n        while (first != last) *target++\
    \ = *first++;\n}\n```\n\nThat optimization beat its non-optimized variant by about\
    \ 50% on some implementations. Do not indulge in cleverness unless you verify\
    \ that the standard doesn't already get better. Hand-optimized code is typically\
