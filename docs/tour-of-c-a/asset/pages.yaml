    # ## 5.1. Classes


    The central feature of C++ is the class. A class is a user-defined type provided
    to represent an entity in the code of a program. Whenever our design for a program
    has a useful entity, collection of data, etc., we try to represent it as a class
    in the program so the idea is there in the code, rather than in heads, in a document,
    or in some comments. A program built out of a well-chosen set of classes is far
    easier to understand and get right than one that builds everything directly in
    terms of the built-in types. Classes are often what libraries offer.


    Essentially all language facilities beyond the fundamental types, operators, and
    statements exist to help define better classes or to use them conveniently. “Better,”
    I mean more correct, easier to maintain, more efficient, more elegant, easier
    to use, easier to read, and easier to reason about. Most programming techniques
    rely on the design and implementation of specific kinds of classes. The needs
    and tastes of programmers vary immensely. Consequently, the support for classes
    is extensive. Here, we consider the basic support for important kinds of classes:


    +   * Concrete classes (§5.2)

    * Abstract classes (§5.3)

    * Classes in class hierarchies (§5.5)


    An astounding number of useful classes turn out to be one of these three kinds.
