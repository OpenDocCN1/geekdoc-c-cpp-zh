  md: "computed, get() might throw an exception from the system or transmitted from\
    \ the promise.\n\nThe main purpose of a promise is to provide \"put\" operations\
    \ (called set_value() and set_exception()) to match future's get(). The names\
    \ \"future\" and \"promise\" are historical; please not blame or credit them.\
    \ They are another fertile source of puns.\n\nIf you have a promise and need a\
    \ result of type X to a future, you can do one of two things: pass a value or\
    \ an exception. For example:\n\nClick here to view code image\n\n```\nvoid f(promise<X>&\
    \ px) // a task: place the result in px\n{\n  // ...\n  try {\n    X res;\n  \
    \  // ... compute a value for res *\n    px.set_value(res);\n  } catch (...) {\n\
    \    // oops: couldn't compute res\n    px.set_exception(current_exception());\
    \ // pass the exception to the future's thread\n  }\n}\n```\n\nThe current_exception()\
    \ refers to the caught exception.\n\nTo deal with an exception transmitted through\
    \ a future, the caller of get() must be prepared to catch it somewhere.\n\nClick\
    \ here to view code image\n\n```\nvoid g(future<X>& fx) // a task: get the result\
    \ from fx\n{\n  // ...\n  try {\n    X v = fx.get(); // if necessary, wait for\
    \ the value to get computed\n    // ... use v\n  } catch (...) {\n    // oops:\
    \ someone couldn't compute v\n    // ... handle error ...\n  }\n}\n```\n\nIf the\
    \ error doesn't need to be handled by g() itself, the code reduces to the minimal:\n\
    \nClick here to view code image\n\n```\nvoid g(future<X>& fx) // a task: get the\
    \ result from fx\n{\n  // ...\n  X v = fx.get(); // if necessary, wait for the\
    \ value to get computed\n  // ... use v\n}\n```\n\nNow, an exception from fx's\
    \ function (f()) is implicitly propagated to g()'s caller, exactly as it would\
    \ have been if g() called f() directly.\n\n# 18.5.2 packaged_task"
