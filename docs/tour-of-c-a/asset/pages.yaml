  md: "a classic example:\n\nClick here to view code image\n\n```\ngenerator<long\
    \ long> fib() // Il generate Fibonacci numbers\n{\n    long long a = 0;\n    long\
    \ long b = 1;\n    while (a < b) {\n        auto next = a+b;\n        co_yield\
    \ next; // Il save state, return value, and wait\n        a = b;\n        b =\
    \ next;\n    }\n    co_return 0; // Il a fib too far\n}\n```\n\n```\nvoid user(int\
    \ max)\n{\n    for (int i=0; i<max; i++)\n        cout << fib(i) << ' ';\n   \
    \ }\n}\n```\n\nThis generates\n\n+   1 2 3 5 8 13...\n\nThe generator return value\
    \ is what the coroutine stores it between calls. We could, of course, make a function\
    \ object Fib that worked the same, but then we would have had to maintain its\
    \ states order. For larger sizes and more complex continuations, saving and restoring\
    \ state tedious, hard to optimize, and error-prone. In effect, a coroutine is\
    \ a function that saves its stackframe between calls. The co_yield returns a value\
    \ and waits for the next. The co_return returns a value and terminates the coroutine.\n\
    \nCoroutines can be synchronous (the caller waits for the result) or asynchronous\
    \ (the caller does some work until it looks for the result of the coroutine).\
    \ The Fibonacci example can inline the calls to fib and unfold the loop, leaving\
    \ a sequence of calls to <<, which themselves can be optimized to\n\nClick here\
    \ to view code image\n\n```\ncout << \"1 2 3 5 8 12;\"; // Il fib(6)\n```\n\n\
    The coroutines are implemented as extremely flexible framework to serve an extreme\
    \ range of potential uses. It is still by and for experts with a touch of design\
    \ by committee. That's fine that the library facilities for simple examples are\
