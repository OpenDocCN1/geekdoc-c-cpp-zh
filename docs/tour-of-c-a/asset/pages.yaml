    collections. Reading characters into a string and printing out the string is a
    simple example. A class with the main purpose of holding objects is commonly called
    a container. Providing suitable containers for a given task and supporting them
    with useful foundational operations are important steps in the construction of
    any program.


    To illustrate the standard-library containers, consider a simple program for keeping
    names'
