    - Removed: Trigraphs.

    - Removed: auto_ptr. Instead, unique_ptr ($15.2.1).

    - Removed: The use of the storage classifier register.

    - Removed: The use of ++ on a bool.

    - Removed: The C++98 export feature. It was complex and not shipped by the major
    vendors. Instead, export is used as a keyword for modules ($3.2.2).

    - Deprecated: Generation of copy operations for a class with a destructor ($6.2.1).

    - Removed: Assignment of string literal to a char*. Use const char* or auto.

    - Removed: Some C++ standard-library function objects and associated functions.
    Most relate to argument binding. Use lambdas and function ($16.3).

    - Deprecated: Comparisons of enum values with values from a different enum or
