    \n```\nShape* ps (read_Shape());\nSmiley& r (dynamic_cast<Smiley>&(*ps)); // Illwhere,\
    \ catch std::bad_cast;\n```\n\nCode is cleaner when we use dynamic_cast with restraint.\
