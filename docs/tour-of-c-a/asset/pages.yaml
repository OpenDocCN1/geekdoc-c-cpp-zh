- pgno: 16
  md: '# 1.2 Programs


    C++ is a compiled language. For a program to run, its source text has to be processed
    by a compiler, producing object files, which are combined by a linker yielding
    an executable program. A C++ program typically consists of many source code files
    (usually simply source files).


    | source file 1 | compile | object file 1 | link | executable file |

    | source file 2 | compile | object file 2 |


    An executable program is created for a specific hardware/system combination; it
    is not portable, say from an Android device to a Windows PC. When we talk about
    portability of C++ programs, we usually mean portability of source code; that,
    the source code can be successfully compiled and run on a variety of systems.


    The ISO C++ standard defines two kinds:


    +   - Core language features, as built-in types (e.g., char and int) and loops
    (e.g., for-statements and while-statements)

    - Standard-library components, as containers (e.g., vector and map) and I/O operations
    (e.g., << and getline())


    The standard-library components are perfectly C++ code provided by every C++ implementation.
    That is, the C++ standard can be implemented in C++ itself and with very minor
    use of code such as thread context switching. This implies that C++ is sufficiently
    expressive and efficient for the most demanding systems programming tasks. C++
    is a statically typed language. That, the type of every entity (e.g., object,
    value, name, and expression) must be known to the compiler at its point of use.
    The type of an object determines the set of operations applicable to it and its
    layout in memory.


    # 1.2.1 Hello, World!!


    The minimal C++ program is


    Click here to view code image


    ```

    int main() { // the minimal C++ program

    ```


    This defines a function called main, which takes no arguments and does nothing.

    Curly braces, {}, here indicate the start and end of the function body. The double
    slash, // begins a comment that extends to the end of a line. A comment is for
    the reader; the compiler ignores it.


    Every C++ program must have exactly one global function named main(). The program
    starts by executing that. The int integer value returned by main(), if any, is
    the program''s return value to "the system." If no value is returned, the system
    will receive a value indicating successful completion. A nonzero value from main()
    indicates failure. Not every operating system and execution environment makes
    use of that return value: Linux/Unix-based environments do,'
  merge: -1
  img_proc: true
