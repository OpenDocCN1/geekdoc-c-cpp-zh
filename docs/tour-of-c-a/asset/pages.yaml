  md: "The shared_ptr for an object share ownership of an object; that object is destroyed\
    \ when the last of its shared_ptr is destroyed. For example:\n\nClick here to\
    \ view image\n\n```\nvoid f(shared_ptr<fstream>);\nvoid g(shared_ptr<fstream>);\n\
    ```\n\n```\nvoid user(const string& name\n```\n\n```\n  shared_ptr<fstream> fp\
    \ (new fstream(name,mode));\n  if (!fp)\n    throw No_file(); // Make sure the\
    \ file was properly opened\n\n  f(fp);\n  g(fp);\n// ...\n```\n\nNow, the file\
    \ opened by fp's constructor is closed by the last function (explicitly or implicitly)\
    \ destroy a copy of fp. Note that ft or g may spawn a task holding a copy of fp\
    \ or in some other way a store that outlives user(). Thus, shared_ptr provides\
    \ a form of collection that respects the destructor-base resource management of\
    \ the memory-managed objects. This cost is neither free nor expensive, but it\
    \ does make the lifetime of the shared object hard to predict. Use shared_ptr\
    \ only if you actually need ownership.\n\nCreating an object on the free store\
    \ then passing the pointer to a smart pointer is a bit verbose. Also for mistakes,\
    \ such as forgetting to pass a pointer to a unique_ptr or giving a pointer to\
    \ pointing is a shared_ptr. To avoid problems, the standard library in <memory>\
    \ provides functions for constructing an object and returning an appropriate smart\
    \ pointer, make_shared() and make_unique(). For example:\n\nClick here to view\
    \ image\n\n```\nstruct S {\n  int i;\n  string s;\n  double d;\n// ...\n};\n```\n\
    \n```\nauto p1 = make_shared<S>(1,\"Ankh Morpork\",4.65); // p1 is a shared_ptr<S>\n\
    auto p2 = make_unique<S>(2,\"Oz\",7.62); // p2 is a unique_ptr<S>\n```\n\nNow,\
    \ p is a unique_ptr<S> pointing to a free-allocated object of type S with the\
    \ value {\"Oz\",\"7.62\"}.\n\nUsing shared_ptr is not just more convenient than\
    \ separately managing an object and passing it to a shared_ptr – it is also notably\
    \ more efficient because it does not need a separate allocation for the use which\
    \ is essential in the implementation of a shared_ptr.\n\nGiven unique_ptr and\
    \ shared_ptr, we can implement a “no new” policy (§5.2.2) for many programs. However,\
    \ these “smart pointers” are still conceptual and pointers only my second choice\
    \ for resource management – after containers and other types that manage their\
    \ resources at a higher level. In particular, shared_ptr do not in themselves"
