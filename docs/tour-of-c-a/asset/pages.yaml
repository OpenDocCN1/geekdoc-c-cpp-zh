  md: "The form of generic programming directly supported by C++ centers around the\
    \ idea of abstracting from concrete, efficient algorithms to obtain generic algorithms\
    \ with different data representations to produce a wide variety of useful software\
    \ [Stepanov,2009]. The abstractions that represent the fundamental operations\
    \ and data structures are called concepts.\n\n# 8.3.1 Use of Concepts\n\nGood,\
    \ useful concepts are fundamental and are discovered more than they are designed.\
    \ Examples are integer and floating-point number (as defined in Classic C [Kernighan,1978]),\
    \ sequence, and more mathematical concepts, such as ring and vector space. They\
    \ represent the fundamental concepts of a field of application. And that is why\
    \ they are called “concepts”. Identifying and formatting concepts to the degree\
    \ necessary for effective generic programming can be a challenge.\n\nFor basic\
    \ use, the concept regular (§14.5). A type is regular when it behaves much like\
    \ int or a vector. An object of a regular type\n\n+   * can be default\n* can\
    \ be copied (with the usual semantics of copy, yielding two objects that are independent\
    \ and compare equal) using a constructor or an assignment.\n* can be compared\
    \ using == and !=.\n* doesn't suffer technical problems from overly clever programming\
    \ tricks.\n\nA string is another example of a regular type. Like int, string is\
    \ also totally_ordered (§14.5). That is, two strings can be compared using <,\
    \ >, and <= with the appropriate semantics.\nA concept is not a syntactic notation,\
    \ but it is fundamentally about semantics. For example, don't define + to divide;\
    \ that would not match the requirements for any reasonable number. Unfortunately,\
    \ we do not yet have any language support for expressing semantics, so we have\
    \ to rely on expert knowledge and common sense to get semantically meaningful\
    \ concepts. Do not define semantically meaningless concepts, such as Addable and\
    \ Subtractable. Instead, rely on domain knowledge to define concepts that match\
    \ fundamental concepts in an application domain.\n\n# 8.3.2 Abstraction Using\
    \ Templates\n\nGood abstractions are carefully grown from concrete examples. It\
    \ is not a good idea to try “abstract” by trying to prepare for every conceivable\
    \ need and technique; in that direction leads inelegance and code bloat. Start\
