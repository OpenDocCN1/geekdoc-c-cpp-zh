    # 13.6 Parallel Algorithms


    When the same task is to do many data items, we can execute it on each data item
    provided the communications on different data items are independent:


    +   * parallel execution: tasks are done on multiple threads (often running on
    several processor cores)

    * vectorized execution: tasks are done on a single thread using vectorization,
    also known as SIMD ("Single Instruction, Multiple Data").


    The standard library offers support for both and we can be specific about wanting
    sequential execution; in <execution> in namespace execution, we find:


    +   * seq: sequential execution (feasible)

    * par: parallel execution (feasible)

    * unseq: unsequenced (vectorized) execution (is feasible)

    * par_unseq: parallel and/or unsequenced execution (is feasible). Consider std::sort()();


    Click here to view code image


    ```

    sort(v.begin(),v.end());           // sequential

    sort(seq,v.begin(),v.end());      // sequential (same as the default)

    sort(par,v.begin(),v.end());        // parallel

    sort(par_unseq,v.begin(),v.end());  // parallel and/or vectorized

    ```


    Whether it is worth to parallelize and/vector depends on the algorithm, the number
    of elements in the sequence, the hardware, and the utilization of hardware by
    programs running on it. Consequently, the execution policy indicators are just
    hints. A compiler and/or run-time'
