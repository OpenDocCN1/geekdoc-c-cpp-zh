  md: "useful in simplifying complex systems. Here, I will give a trivial example\
    \ exercising the primitives needed for the kind of event-driven simulations that\
    \ were a major reason for C++'s early success. The key idea is to represent a\
    \ system as a network of tasks (coroutines) to collaborate on complex tasks. Basically,\
    \ each task is an actor that performs a small part of a large effort. Some are\
    \ generators that produce streams of requests (possibly using random number generators,\
    \ feeding raw-data), some are part of a networking results, some generate output.\
    \ I personally prefer the coroutines to communicate through One way to organize\
    \ such a system is for each task to place itself on an event queue waiting or\
    \ after producing a result. A scheduler then picks the next task to run from the\
    \ queue when needed. This is a form of cooperative multitasking. I borrowed –\
    \ the key ideas from Simula [Dahl,1970] to form the basis for the very first C++\
    \ library [19.1.2].\n\nThe keys to such designs are\n\n+   * Many different coroutines\
    \ that maintain their state calls.\n* A polymorphism allows us to keep lists of\
    \ events containing different kinds of coroutines and invoke them independently\
    \ of their threads.\n* A scheduler that selects the next coroutine(s) to run from\
    \ the list(s).\n\nHere, I will use couple of coroutines and execute them alternatively.\
    \ It is essential for such systems not to use too much space. That's why we don't\
    \ use processes or threads for each. A thread requires a megabyte or two (mostly\
    \ for the stack), a coroutine often only a couple of dozens. If you need thousands\
    \ of tasks, that can make a big difference. Context switching between coroutines\
    \ is also far faster than threads or processes.\n\nFirst, we need run-time polymorphism\
    \ to allow us to call dozens or hundreds of different kinds of coroutines uniformly:\n\
    \nClick here to view code image\n\n```\nstruct Event_base {\n    virtual void\
    \ operator() = 0;\n    virtual ~Event_base() {};\n};\n\ntemplate<class Act>\n\
    struct Event : Event_base {\n    Event(const string n, Act a) : name{ n }, act{move(a)\
    \ } {}\n    string name;\n    Act act;\n    void operator() override {};\n};\n\
    ```\n\nAn Event simply stores an action and allows it to be called; The action\
    \ will be a coroutine. I added a name to illustrate that an event typically carries\
    \ more information than just the coroutine handle.\n\nHere is a trivial use:\n\
    \nClick here to view code image\n\n```\nvoid test() {\n    vector<Event_base>\
    \ events = {\n        new Event(\"integers\", \"sequencer(10)\\),\n    };\n```\n\
    \nIl create a couple of Events holding coroutines"
