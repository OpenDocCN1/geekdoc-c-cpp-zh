  md: "If you are explicit about some defaults, other default definitions will not\
    \ be generated.\n\nWhen a class has a pointer member, it is usually a good idea\
    \ to be explicit about copy and move operations. The reason is that a pointer\
    \ may point to something that the class needs to delete, in which case the default\
    \ member would be wrong. Alternatively, one might point to something that the\
    \ class needs to delete. In either case, the code would like to know. For an example,\
    \ see $6.2.1.\n\nA good rule of thumb (sometimes the rule of zero) is to either\
    \ define all the essential operations or none (using the default for all). For\
    \ example:\n\nClick here to view code image\n\n```\nstruct Z {\n  Vector v;\n\
    \  string s;\n};\n\nZ z1; // Default initialize z1.v and z1.s\nZ z2 = z1; // Default\
    \ copy z1.v and z1.s\n```\n\nHere, the compiler will synthesize member default\
    \ construction, copy, move, and destructor as needed, and with the correct semantics.\n\
    \nTo complement =default =delete to indicate that an operation is not to be generated.\
    \ A base class in a class hierarchy is the classic example where we don't want\
    \ allow a member copy. For example:\n\nClick here to view code image\n\n```\n\
    class Shape {\npublic:\n  Shape(const Shape&)=delete; // No copying\n  Shape&\
    \ operator=(const Shape&)=delete;\n  // ...\n};\n\nvoid copy(Shape& s1, const\
    \ Shape& s2)\n{\n  s1 = s2; // Error: Shape copy is deleted\n}\n```\n\nA =delete\
    \ makes use of the deleted function a compile-time error; =delete can be used\
    \ to suppress any function, not just essential member functions.\n\n# 6.1.2 Conversions\n\
    \nA constructor taking a single argument defines a conversion from its argument\
    \ type. For example, complex (§5.2.1) provides a constructor from a double:\n\n\
    Click here to view code image\n\n```\ncomplex z1 = 3.14; // z1 becomes (3.14,0.0)\n\
    complex z2 = *z1; // z2 becomes z1*(2.0,0) == (6.28,0.0)\n```\n\nThis implicit\
    \ conversion is sometimes ideal, but not always. For example, Vector (§5.2.2)"
