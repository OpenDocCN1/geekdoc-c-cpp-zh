    \ Arguments\n* Template Compilation Model\n* Advice\n\n# ## 8.1 Introduction\n\
    \nWhat are templates for? In other words, what programming techniques are made\
    \ effective byntemplates? Templates offer:\n\n+   * The ability to pass types\
    \ (as well as values and templates) as arguments without loss of\ninformation.\
    \ This implies great flexibility in what can be expressed and excellent\nopportunities\
    \ for inlining, of which current implementations take great advantage.\n* Opportunities\
