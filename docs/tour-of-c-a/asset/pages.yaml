    # 12.4 forward_list


    The standard library offers a singly-linked list called forward_list:


    ![](img/0bd2e25eba2737c3c5daca16fad1b65b_182_0.png)


    forward_list: A forward_list differs from a (doubly-linked) list by only allowing
    forward iteration. The point of that is to save space. There is no need to keep
    a predecessor pointer in each link and the size of an empty forward_list is just
    one pointer. A forward_list doesn''t even keep its number of elements. If you
    need the number of elements, count. If you can''t afford to count, you probably
    shouldn''t use forward_list.


    # 12.5 map


    Writing code to look up a name in a list of (name,number) pairs is quite tedious.
    In addition, a linear search is inefficient for all lists. The standard library
    offers a balanced binary search tree (usually a red-black tree) called map:


    ![](img/0bd2e25eba2737c3c5daca16fad1b65b_182_1.png)


    In other contexts, a map is known as an associative array or a dictionary. The
    standard-library map is a container of pairs of values optimized for lookup and
    insertion.'
