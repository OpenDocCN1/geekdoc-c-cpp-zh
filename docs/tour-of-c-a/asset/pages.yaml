    \ cannot implement cheap and effective range checking. Also, our assumption can\
    \ be wrong:\n\nClick here to view code image\n\n```\nvoid use(int x)\n{\n    int\
    \ a[100];\n    fpn(a,100);      // OK\n    fpn(a,1000);     // oops, my finger\
    \ slipped! (range error in fpn)\n    fpn(a+10,100);  // range error in fpn\n \
    \   fpn(a:x);        // suspect, but looks innocent\n```\n\nWe can do better using\
    \ a span:\n\n```\nvoid fs(span<int> p)\n{\n    for (int &x : p)\n        x = 0;\n\
    }\n```\n\nWe can use fs like this:\n\nClick here to view code image\n\n```\nvoid\
    \ use(int x)\n{\n    int a[100];\n    fs(a);           // implicitly creates a\
    \ span<int>{a,100}\n    fs(a,1000);      // error: span expected\n    fs(a+10,100);\
    \    // a range error in fs\n    fs(a:x);          // obviously suspect\n```\n\
    \nThat is the common case, creating a span directly from an array, is now safe\
    \ (the compiler computes the element count) and notationally simple. In other\
    \ cases, the probability of mistakes is lowered and range-detection is easier\
    \ because the programmer has to explicitly compose a span.\n\nThe common case\
    \ where a span is passed from function to function is simpler than for (pointer,count)\
    \ interfaces and obviously doesn't require extra checking:\n\n```\nvoid f1(span<int>\
    \ p)\n\nvoid f2(span<int> p)\n{\n    //\n    f1(p);\n}\n```\n\nAs for counters,\
    \ when span is used for subscripting (e.g., r[i]), range checking is not done\
    \ and an out-of-range access is undefined behavior. Naturally, an implementation\
    \ can implement undefined behavior as range checking, but sadly few do. The original\
