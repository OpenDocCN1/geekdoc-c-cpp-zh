  md: 'We use the error codes when operations are expected to fail frequently in normal
    use and the throwing operations when an error is considered exceptional.

    Often, using an inquiry function is the simplest and most straightforward approach
    to examining the properties of a file. The <filesystem> library knows about few
    common kinds of files and classifies the rest as “other":


    # File types


    | is_block_file(f) | Is f a block device? |

    | is_character_file(f) | Is f a character device? |

    | is_directory(f) | Is f a directory? |

    | is_empty(f) | Is f an empty file or directory? |

    | is_fifo(f) | Is f a named pipe? |

    | is_other(f) | Is f some other kind of file? |

    | is_regular_file(f) | Is f a regular (ordinary) file? |

    | is_socket(f) | Is f a named IPC socket? |

    | is_symlink(f) | Is f a symbolic link? |

    | status_known(f) | Is f’s status known? |


    # 11. Advice


    +   [1] istreams are type-safe, type-sensitive, and extensible; §11.1.

    [2] Use character-level input only when you have; §11.3; [CG: SL.io.1].

    [3] When reading, always consider all-formed input; §11.3; [CG: SL.io.2].

    [4] Avoid endl (if you don’t know endl is, you’ve missed anything); [CG: SL.io.50].

    [5] Define << >> for user-defined types that have meaningful textual representations;
    §11.1, §11.2, §11.3.

    [6] cout for normal output and cerr for errors; §11.1.

    [7] There are istreams for ordinary characters and wide characters, which you
    can define an iostream for any kind of character; §11.1.

    [8] Binary I/O is supported; §11.1.

    [9] There are standard istreams for standard I/O streams, files, and strings;
    §11.2, §11.3, §11.7,§11.7.

    [10] Chain << operations for a ternary notation; §11.2.

    [11] Chain >> operations for a ternary notation; §11.3.

    [12] Input into strings does not overflow; §11.3.

    [13] By default skips initial whitespace; §11.3.

    [14] Use the stream fail to handle potentially recoverable I/O errors; §11.4.

    [15] We can define << >> operators for our own types; §11.5.

    [16] We don’t modify istream or ostream to add new << >> operators; §11.5.'
