    \ Therefore, the standard-library containers offer the opportunity to install\
    \ allocators with semantics we need. This has been used to address a wide variety\
    \ of concerns related to performance (e.g., pool allocators), security (allocators\
    \ that clean-up memory as part of deletion), per-thread allocation, and non-uniform\
    \ memory allocators (allocating in specific memories with pointer types to). This\
    \ is not the place to discuss these important, but very specialized and advanced\
    \ techniques. However, I will give one example motivated by a real-world problem\
    \ for which a pool allocator was the\n\nAn important, long-running system used\
