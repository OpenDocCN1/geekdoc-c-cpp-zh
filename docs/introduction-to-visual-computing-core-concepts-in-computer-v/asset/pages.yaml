- pgno: 11
  md: '# Preface


    This book is the culmination of over a decade of teaching of a newly designed
    umbrella course on *visual computing* that would provide students with fundamentals
    in the different areas of computer graphics, computer vision and image processing.
    Looking back, this was a very forward looking curriculum which became the launching
    pad for all computer graphics, computer vision and image processing students at
    UCI and helped future new faculty hires in this direction to count on this course
    to provide exposure to fundamentals that are common to all these domains. This
    course is a core entry-level course in the graduate curriculum providing students
    the opportunity to explore a larger breadth before moving on to more focused channels
    of computer graphics, computer vision and/or image processing. It is also being
    adopted as one of the core courses for our professional masters degree program
    which began in Fall 2017. Interestingly, the research community has also followed
    this trend since 2006 when we started to see researchers from one of the domains
    of computer graphics, computer vision and image processing having strong presence
    in others leading to a young and dynamic research sub-community that traverses
    all these domains with equal dexterity. Therefore, having a breadth of knowledge
    in the general area of visual computing is perceived today as a strength that
    helps students delve easily into inter-disciplinary domains both within CS and
    other domains where it is being extensively used.


    The inspiration for writing this book came from many instructors and educators
    who inquired about our visual computing course at UCI, designed a similar course
    at their home institutions, and were requesting a standard single textbook to
    cover all the topics. The key exercises that we undertook prior to writing this
    book were (a) to carefully choose a *lean* set of topics that would provide adequate
    breadth for an introductory course in visual computing enabling the students to
    take one course instead of three different courses in CG, CV and IP before deciding
    on the direction they would like to pursue; (b) to carefully design the *depth*
    of material in each of these topics so that it can be dealt with nicely during
    the offering of a single course without being overwhelming; (c) to categorize
    the topics from the perspective of visual computing in such a manner that students
    are able to see the common threads that run through these different domains. This
    exercise led to the organization of the book into five different parts.'
  merge: -1
  img_proc: true
- pgno: 12
  md: "+   1. **Part 1:** Fundamentals provide an exposure to all kinds of different\
    \ visual data (e.g. 2D images and videos and 3D geometry) and the core mathematical\
    \ techniques that are required for their processing in any of the CG, CV or IP\
    \ domains (e.g. interpolation and linear regression).\n+   \n+   2. **Part 2:**\
    \ Image Based Visual Computing deals with several fundamental techniques to process\
    \ 2D images (e.g. convolution, spectral analysis and feature detection) and corresponds\
    \ to the low level retinal image processing that happens in the eye in the human\
    \ visual system pathway.\n+   \n+   3. **Part 3:** Geometric Visual Computing\
    \ deals with the fundamental techniques used to combine the geometric information\
    \ from multiple eyes creating a 3D interpretation of the object and world around\
    \ us (e.g. transformations, projective and epipolar geometry). This deals with\
    \ the higher level processing that happens in the brain that combines information\
    \ from both the eyes helping us to navigate through the 3D world around us.\n\
    +   \n+   4. **Part 4:** Radiometric Visual Computing deals with the fundamental\
    \ techniques for processing information arising from the interaction of light\
    \ with the objects around us. This topic covers both lower and higher level processing\
    \ in the human visual system that deals with intensity of light (e.g. interpretation\
    \ of shadows, reflectance, illumination and color properties).\n+   \n+   5. **Part\
    \ 5:** Visual Content Synthesis presents fundamentals of creating virtual computer\
    \ generated worlds that mimic all the processing presented in the prior sections.\n\
    \nThe book is written for a 16 week long semester course and can be used for both\
    \ UG and graduate teaching. The recommended timeline for teaching would be to\
    \ dedicate two weeks for Part 1, three weeks each for Parts 2 and 4, and three\
    \ and half weeks each for Parts 3 and 5. The exercises following each chapter\
    \ can be used to provide weekly or biweekly written assignments. The ideal way\
    \ to provide hands-on implementation experience would be to have one programming\
    \ assignment accompany each part of the course picking a subset of topics taught\
    \ in each part based on the expertise level of the students. The decision of making\
    \ this book independent of any programming language or platform is to enable each\
    \ instructor to choose the most convenient topics, platforms, and programming\
    \ language for their assignments based on the resources at hand and the skill\
    \ set of the audience. Evaluation via two midterms at the end of the 6th and 12th\
    \ week and a comprehensive final is probably most conducive.\n\nTeaching the material\
    \ in this book in a 10 week quarter usually poses a challenge. There can be multiple\
    \ ways to handle this. The easiest way is to increase the number of credits for\
    \ this course leading to more contact hours to compensate for the reduced number\
    \ of weeks. The second way is to pare down or divide the content presented in\
    \ a standard semester long offering of the course. For"
  merge: -1
  img_proc: true
- pgno: 13
  md: 'example, Visual Computing-I can focus on low level visual computing focusing
    on Chapters 1-5 and 9-10 and the first two sections of Chapter 11 while Visual
    Computing-II can focus on higher level visual processing and representation focusing
    on Chapters 6-8, the last section of Chapter 11 and Chapters 12-15. Alternatively,
    parts of a chapter or complete chapters can be skipped to created a pared down
    version of the course that avoids reducing the rigor of the concepts taught in
    the class. Such an approach has been explored in the past in UCI by removing Chapters
    8,10,15, and most of Chapter 14 beyond texture mapping. The decision of what to
    present, what to shorten and what to completely remove resides best with the instructors.
    The book has been written carefully to minimize dependencies between chapters
    and sections so that they can be chosen independently by instructors without worrying
    overtly about dependencies on other parts of the book.


    We hope that the material presented in this book and its non-traditional organization
    inspires instructors to design a visual computing course in their institutions,
    use this book as a textbook for its offering, and hopefully see an increased interest
    amongst the students towards the study of the general domain of visual computing.
    We would like to get feedback from instructors who are using this book as a textbook.
    Please feel free to write to us about anything you faced while using this book
    — desired additions, details, or organization. Such feedback will be instrumental
    towards more refined and better suited subsequent editions of this book.


    We acknowledge our colleagues at the University of California at Irvine for their
    support in designing non-traditional courses leading to experimentation which
    provided the building blocks for this book. We would like to thank the numerous
    students who took the Visual Computing course at UCI and the teaching assistants
    who helped us execute and experiment during different offerings of this course
    which led to the development and organization of the material presented in this
    book. We also acknowledge the help rendered by our students, Nitin Agrawal and
    Zahra Montazeri, in designing and rendering to perfection the various figures
    used in this book. We deeply appreciate the special efforts of Prof. Shuang Zhao
    of the University of California, Irvine, Prof. Amy and Bruce Gooch of the University
    of British Columbia, Dr. David Kirk of nVidia, Prof. Chee Yap of New York University,
    and Prof. Jan Verschelde of the University of Illinois, Chicago, in providing
    some of the images in this book on physically based modeling, non-photorealistic
    rendering, geometric compression and GPU architecture respectively.


    Aditi Majumder

    Gopi Meenakshisundaram'
