    whether the multiplications are performed as a post or pre-multiplication does
    not really matter as long as their order is preserved. Though this may seem to
    be of trivial consideration, it has a rather deep geometric interpretation.


    # 6.6.1  Global vs Local Coordinate System


    The transformation $T_1T_2P$ transforms the point $P$ and whether it is done using
    pre-multiplication or post-multiplication, the result will be the same. However,
    the geometric interpretation of the intermediate steps are dependent on the pre
    or post multiplication.


    So far, in this chapter, we have been doing concatenation as a pre-multiplication,
    i.e. pre-multiply $T_2$ with $P$ first and then pre-multiply the result with $T_1$.
    When we perform each of these steps we consider the coordinate system to be constant.
    Hence, the coordinate systems remain _global_ across the different transformations.
    This is usually easy to understand since we typically work with a standard frame
    of reference.


    However, the post multiplication also has an interpretation. It means that the
    _coordinate system itself is being transformed_. Therefore when you post multiply
    $T_1$ with $T_2$, it means that you have first applied the transformation $T_1$
    to the coordinate system followed by $T_2$ to the transformed coordinate system
    and then placed $P$ in this transformed coordinate system. Here, the coordinate
    system remains _local_ to each transformation and changes from one transformation
    to another.


    However, the result of implementing the transformation both in global or local
    coordinates achieves the same result. To illustrate this, please see Figure 6.12.
    We consider the transformation $RTP$ in 2D for this object and perform it in both
    global and local coordinate systems to achieve the same result.


    # 6.7  Projective Transformation


    This brings us to the end of affine transformation. Now, we will explore projective
    transformation. Projective transformations are most general linear transformations
    which take points $P=(x,y,z,w)$ to points $P''=(x'',y'',z'',w'')$. Projective
    transform $P$ is expressed as


    $$\begin{pmatrix}x''\\y''\\z''\\w''\end{pmatrix}=\begin{pmatrix}p_{11}&p_{12}&p_{13}&p_{14}\\p_{21}&p_{22}&p_{23}&p_{24}\\p_{31}&p_{32}&p_{33}&p_{34}\\p_{41}&p_{42}&p_{43}&p_{44}\end{pmatrix}\begin{pmatrix}x\\y\\z\\w\end{pmatrix}
    \tag{6.57}$$'
