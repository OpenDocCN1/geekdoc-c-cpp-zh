    Another common type of noise originates from having outliers in the data i.e.
    samples which clearly cannot belong to the data. For example, in a camera some
    sensor pixels may be dead making thereby blocking or allowing all the light providing
    pixels that are always either black or white respectively. The locations of such
    pixels may be random. In the specific case of 2D images, this noise is called
    salt and pepper noise (see Figure 1.14). Such outliers are handled adequately
    by median filters or other order statistics filters. We will see some of these
    in Chapter 5.


