    # 14.4 Texture Mapping


    Texture mapping is the process of pasting a 2D image on an object in order to
    increase the richness and visual detail of a digital scene. Texture mapping uses
    three coordinate systems: 2D texture space, 3D object space, and 2D screen space.
    Texture image''s 2D coordinates are defined in the 2D texture space. The 3D coordinates
    of the vertices of the object in the scene are defined in the 3D object space.
    Finally, the pixel coordinates of the interior of the projected primitives of
    the object are defined in the 2D screen space. Each 3D vertex coordinate in the
    object space is assigned a texture coordinate in the texture space. Screen space
    is used during rasterization to map the image to the interior of the primitives
    of the projected object during the texture mapping process.


