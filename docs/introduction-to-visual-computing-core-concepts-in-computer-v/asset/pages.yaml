- pgno: 311
  md: 'image plane usually defined by a normal vector to the image plane N – also
    called the principle axis, and a view-up vector V which provides the up direction
    of the head. Ideally N and V should be perpendicular to each other. But when providing
    a view-up vector, it is often difficult on the part of the application programmer
    to provide a vector that is exactly orthogonal to N. Therefore, most graphics
    application programming interfaces (APIs) allow defining V as a vector close to
    the view-up vector from which the actual view-up vector that is perpendicular
    to N is computed.


    The output of the graphics pipeline is a 2D image rendered from the 3D scene,
    that needs to be updated every time the view setup or part of the 3D scene is
    changed. Note that a change of the view set-up can be expressed as a change in
    the entire 3D scene. For example, if the eye moves to the right, it is equivalent
    to the scene moving to the left. The advantage of this approach is two fold: (a)
    All the transformations due to view point change can be applied to the model,
    and so the model transformation which is already applied to the models can be
    combined with the view transformation and this composition of transformation can
    be applied once to the model/scene; (b) since the view set-up and hence the image
    plane does not change, the perspective projection transformation remains the same.
    Therefore, most graphics APIs define a default view so that the scene is transformed
    in such a way that the view set-up remains at the default view. The most common
    default view is to have the eye at origin, the normal to the image plane to be
    the Z-axis and the view-up vector to be the Y-axis. Therefore, the default view
    setup can be defined as E = (0, 0, 0), V = (0, 1, 0) and N = (0, 0, 1). This is
    illustrated in Figure 13.3.


    The goal of view transformation is to convert an arbitrary view setup given by
    an arbitrary E, N and V to the default view. There are two steps to achieve this.
    First, the eye should be moved to the origin which is achieved by a translation
    T(−E). Second, N should be aligned with the Z axis which is achieved by a rotation
    R. The rotation matrix R can be computed by defining a view coordinate system
    and aligning the view coordinate system with the standard coordinate system (X,Y,Z
    axes). Let the unit vectors defining the coordinate axes of the view coordinate
    system be u_x, u_y, and u_z given by


    u_z = N / ||N||  (13.1)


    u_x = (N × V) / ||N × V||  (13.2)


    u_y = u_z × u_x  (13.3)'
