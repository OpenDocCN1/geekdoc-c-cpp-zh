- pgno: 42
  md: 'However, unlike this case of a uniform planar grid, if this 2D surface happens
    to be a mesh as in **Figure 2.4**, the result of the interpolation will completely
    depend on the particular intermediate points you use. Consider the quadrilateral
    highlighted in red in **Figure 2.4**. Let two opposite vertices have color black
    denoted by $B$ and the other two vertices have color white denoted by $W$. A point
    at the intersection of the two diagonals shown by dotted red lines can be interpolated
    to have two completely different colors. If interpolated from the black vertices,
    it will be black. If interpolated from the white vertices it will be white.


    Therefore, there is something special about a triangle, where a point inside it
    will be interpolated uniquely irrespective of how you do it. This is because a
    triangle is a simplex. A simplex is a geometric construct achieved by connecting
    $n$ points to each other in $(n-1)$ dimensions. A straight line is the 1D simplex.
    A triangle is the 2D simplex (encloses a surface). Similarly, a tetrahedron is
    the 3D simplex. These are illustrated in **Figure 2.5**. The linear interpolation
    on these simplices (called bilinear for 2D, trilinear for 3D) yields unique interpolation
    coefficients which are also called *barycentric coordinates* of a point inside
    the simplex with respect to the vertices forming the simplex. Therefore in **Equation
    2.8** provides the barycentric coordinates of the point $V$ with respect to $V_1$,
    $V_2$ and $V_3$ respectively in **Figure 2.2a**. This is the reason triangles
    and not any other polygons are chosen for representing geometric meshes. The advantages
    will be even more evident when we cover computer graphics later in the book.


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_42_0.png)


    # ## 2.2 Geometric Intersections


    Linear equations represent lines (when using 2 variables) or planes (when using
    three variables) and we would often need to compute the intersection of such geometric
    entities. Such intersections are computed by solving a set of linear equations.
    In order to solve equations with $n$ unknowns, we need at least $n$ equations.
    First, let us derive a matrix formulation for this problem. Let us consider $n$
    linear equations with $n$ unknowns, $x_1,x_2,\ldots,x_n$, where the $i$th equation
    is given by


    $$a_{i1}x_1+a_{i2}x_2+\cdots+a_{in}x_n=b_i \tag{2.17}$$


    Now, this can be written as


    $$Ax=b \tag{2.18}$$'
