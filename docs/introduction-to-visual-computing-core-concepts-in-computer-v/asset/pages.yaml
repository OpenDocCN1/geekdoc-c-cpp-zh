  md: '# Path Tracing Via Local Aggregation


    Almost all edge detectors yield information about the magnitude and direction
    at an edgel during the process of detecting the edgel. Local edge linking methods
    usually start at some arbitrary edge point and consider and add those pixels from
    a local neighborhoods to the edge set whose edge direction and magnitude are similar
    to each other. The basic premise is that neighboring edgels with similar properties
    are likely to lie on the same edge. The neighbourhoods based around the recently
    added edgels are then considered in turn and so on. If the edgels do not satisfy
    the constraint then we conclude we are at the end of the edge, and so the process
    stops. A new starting edge point is found which does not belong to any edge set
    found so far, and the process is repeated. The algorithm terminates when all edgels
    have been linked to one edge or at least have been considered for linking once.


    Thus the basic process used by local edge linkers is that of tracking and traversing
    a sequence of edgels. Branching edges are considered in a breadth or depth first
    fashion just as in tree traversal. An advantage of local aggregation methods is
    that they can readily be used to find arbitrary curves. Probabilistic methods
    can also be applied to achieve better estimates by global relaxation labeling
    techniques. An example of linked edges is shown in Figure 5.19 where each linked
    image is shown with a different, but not always unique, color.


    # Global Aggregation Via Hough Transform


    A complementary approach to edge linking is to identify parametric edges (e.g.
    lines and parametric curves like circles, parabolas) in an image so that we not
    only identify edges but also have a more compact representation of them which
    can be used for other purposes such as finding how an image was scaled or rotated
    to create another image). Such a representation is also called a vector representation
    of edges/images. The most popular way to compute this vector representation is
    using a voting based method called Hough transform.


    To understand this, let us assume that we would like to find lines in the edgel
    image. Let us now consider the set of all the different lines that can be present
    in the image. Only small subset of these lines, some of which are shown in blue
    in Figure 5.20 can pass through the point (x, y). Also, a much larger subset of
    lines, some of which are shown in red in Figure 5.20 will not pass through (x,
    y). The first step of the Hough transform is to find the set of lines that would
    pass through (x, y). A line passing through (x, y) has the equation y = m x +
    b where m is the slope and b is the y-intercept of the line. The set of all values
    of m and b that satisfy this equation for a given coordinate (x, y) defines the
    set of all lines that pass through (x, y).


    Let us now consider an alternate 2D space spanned by m and b. Each line in the
    image space that passes through (x, y) will be defined by a specific slope and
    offset and therefore will be denoted by the point in the space spanned by (m,
    b). For example, the x-axis is a line with slope and offset both zero. Therefore,
    in the (m, b) space, it will be represented by the origin, (0, 0). Now the line
    equation'
