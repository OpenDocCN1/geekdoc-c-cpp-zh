    # 10.1.2 Tone Mapping Operator


    Let us now discuss another important property of a color reproducing device, the
    tone mapping operator. As we change the input of one channel from 0 to 1 as the
    other two remain zero, the output will travel on the vectors *OR*, *OG* or *OB*
    (Figure 10.2). Now, the way the resulting output moves on these vectors may not
    be linear. In fact, most of the times it is a non-linear function trying to adjust
    for the response of human eye. Let us call this function *h*. For example, the
    human eye has a non-linear response to light which is compressive in nature i.e.
    if the eye is stimulated with *k* times the intensity, the perceived intensity
    is less than *k* times. For example in cameras, this function *h*(*i_r*) is modeled
    by *i_r^γ* where *γ* < 1.0. In displays, *γ* > 1.0, most commonly *γ* = 2.0 to
    compensate for the compressive gamma imparted by cameras. Although we have assumed
    the same *h* for all channels here, these functions can be different for different
    channels. In fact, predefined *γ* was in vogue in the pre-digital age when film
    cameras usually had a *γ* = 0.5 which was compensated by displays with a *γ* =
    2.0. Hence, the name gamma function or gamma correction. This is illustrated in
    Figure 10.4.


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_246_0.png)


    Figure 10.4. On the left is a typical display gamma of 2.2. In the middle is the
    gamma of a capture device set to 1/2.2 to mimic the human eye. The result of putting
    this image on to the display is a linear response of input to output as seen in
    the right.'
