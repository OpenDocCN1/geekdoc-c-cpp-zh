  md: 'image. Low contrast images usually do not have the near black and near white
    grays. Therefore, h(i_k) is non-zero only in a small middle ranges of values of
    i_k.


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_269_0.png)


    One common application of histogram processing is to enhance the contrast of the
    image, using a process called histogram stretching. As we saw earlier, the range
    of values for which h(i_k) ≠ 0 is small for a low contrast image. The goal of
    histogram stretching is to map every input value i_k to a new input j_k such that
    the range of the new histogram h(j_k) has positive values for all values of k.


    # Figure 11.3. This figure shows the effect of change of contrast on the histogram
    of an image. Note that low contrast image (left) means very dark grays and very
    bright grays are both absent and therefore the range of values for which h(i_k)
    is positive is small and in the middle range.


    The first step of histogram stretching is to find the cumulative probability distribution
    function, H, where


    ```

    H(i_k) = Σ_{0}^{k} h(i_k) = H(i_k - 1) + h(i_k).

    ```


    (11.2) H(i_k) is a monotonically non-decreasing function that goes from H(0) =
    0 to H(1) = 1. Let us examine the function H for a low contrast image (Figure
    11.4). Let the range of values with non-zero values in h be from d to u where
    d ≤ u, d >> 0 and u << 255. Therefore, H = 0 from 0 ≤ i_k ≤ d and H = 1 for all
    u ≤ i_k ≤ 1.


    In order to stretch the histogram to increase the contrast of the image i_k is
    mapped to j_k = H(i_k). Therefore, j_k = 0 for all 0 ≤ i_k ≤ d and j_k = 1 for
    u ≤ i_k ≤ 1. All the values in between d and u are mapped between the entire range
    of 0 and 1. Therefore the range of the values in the new image now spans the entire
    range 0 to 1 instead of d to u resulting in an improved contrast. However, j_k
    depends entirely on the slope of H at i_k. Also, since j_k can only have u − d
    + 1 values between 0 to 1, the histogram of the contrast enhanced image will be
    non-zero only at u − d + 1 input values and not all p values between 0 and 1.
    Figure 11.5 shows the results of this contrast enhancement via histogram stretching.


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_269_1.png)


    # Figure 11.4. This figure shows a histogram h(i) on the left and the cumulative
    probability distribution c(i) corresponding to h(i) on the right. Note that the
    cumulative probability distribution function is a monotonically increasing function
    ranging between 0 to 1.'
