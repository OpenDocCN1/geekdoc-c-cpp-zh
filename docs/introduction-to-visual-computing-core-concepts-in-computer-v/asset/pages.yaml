  md: 'This can be achieved by clamping the out-of-bound input to 1 or 0. Such a clamping
    creates a local movement of only the out-of-gamut colors retaining the appearance
    of all in-gamut colors. This method can yield rather effective results for GUI
    applications where flat colors are used for buttons and slides.


    However, when dealing with natural images, multiple out-of-gamut colors can land
    on the same in-gamut colors creating color blotches. Another option is to scale
    the position of all the colors to fit the out-of-gamut colors within the gamut.
    This can be achieved by scaling the input by an appropriate factor to move the
    out-of-range value to 1. This leads to a global movement of colors yielding better
    result for images though vibrancy and brightness of all the colors are sacrificed.


    # 10.2.2 Gamut Matching


    Gamut matching is a technique that tries to eliminate out-of-gamut colors altogether.
    The mainstay of this method is to find a common gamut that all devices can reproduce.
    The method is illustrated in Figure 10.10. Let us consider two devices with gamuts
    G₁ and G₂ – shown in red and blue respectively. Let the linear matrices representing
    these two devices be M₁ and M₂ respectively. First, we find the intersection of
    G₁ and G₂. G₁ ∩ G₂ is shown in green. There is no guarantee that G₁ ∩ G₂ is a
    parallelepiped. However, in order to express the common gamut as a matrix, we
    find the largest parallelepiped, Gc, inside G₁ ∩ G₂. We desire to find the largest
    such parallelepiped to increase the gamut of colors that can be reproduced by
    both the devices. Let the matrix that represents this black gamut be Mc.


    Next, we consider any input to be an input (Rc, Gc, Bc) in this common gamut Gc
    and find the corresponding input in the ith device from Equation


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_253_0.png)


    Figure 10.10. This figure illustrates the process of gamut matching for two devices
    whose gamuts are denoted by the red and blue parallelepiped. The intersection
    of these two gamut is shown by the green volume (left). The biggest parallelepiped
    inscribed in this intersection is shown in black (middle). Finally, the red and
    blue parallelepipeds are transformed to the black one via appropriate linear transformations
    (right).'
