  md: 'vertical ranges of the bounding box of A are completely within the respective
    ranges of the window. So A is inside the window. In case of D, while the vertical
    range of the bounding box intersects that of the window, the horizontal range
    of the bounding box is completely outside that of the window. So D lies outside
    the window. For the other two cases, both the horizontal and vertical ranges of
    the bounding box and that of the window partially intersect leading to possible
    intersection of the primitive with the window. The primitive B intersects the
    window and will be clipped via intersection computation. However, there can be
    cases like C where the bounding box intersects though the triangle does not. The
    actual intersection computation in such cases will yield negative results.


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_323_0.png)


    Using Logic Operations: Another technique to expedite acceptance/rejection tests
    is to divide the 2D image plane into regions and assign binary codes to the regions.
    For example, we can have four bits, b1b2b3b4 associated with each projected vertex
    (x, y) such that b1 = y < tw, b2 = y > bw, b3 = x > rw, and b4 = x < lw. The four-bit
    code divides the image plane into nine different regions, each with an unique
    code (shown by green codes in Figure 13.7). Consider the four bit codes of two
    end points of a line segment. If the bitwise AND of these two codes is not zero,
    then both end points are outside the same window boundary and the line is completely
    outside the window and therefore rejected. If each of the two codes is zero then
    the line segment is inside the window and therefore accepted. If at least one
    of the two codes is not zero, but the AND operation of the two codes is zero,
    then the line intersects with the boundary of the window and therefore an accurate
    intersection test has to be performed. Such logic operations can be extended to
    triangles also to efficiently clip them. An acceptance or rejection test using
    logic operations is equivalent to, yet simpler than, the test using a bounding
    box.


    Figure 13.7. This figure illustrates some of the efficiency improvements in clipping
    algorithms using bounding boxes or binary codes.


    Using Integer Operations: Intersection of the lines and triangles that are not
    trivially accepted/rejected with the window boundaries have to be computed. For
    this we first find the window boundary that intersects the primitive and then
    find the exact intersection. For both of these steps, it is far more efficient
    if they can be achieved primarily via integer computation rather than floating
    point computation. Let us consider the red and green lines shown in Figure 13.8.
    The green line intersects the left window boundary before the top. This indicates
    that the line is entering the window at the left boundary. But, the'
