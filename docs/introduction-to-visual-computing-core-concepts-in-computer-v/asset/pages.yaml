  md: 'Now, consider the situation where the camera’s center of projection is not
    at (0,0,0), the principal axis is not coincident with the Z-axis, and the image
    plane – though still orthogonal to the principal axis – is not parallel to the
    XY plane. In this case, we have to first use a matrix to coincide the camera’s
    center of projection with (0,0,0), its principal axis with the Z-axis and u-axis
    of the image plane align with the X-axis (or v-axis of the image plane align with
    the Y-axis) to make its image plane parallel to the XY plane. This transformation
    is achieved by a translation that moves the center of projection to the origin
    followed by a rotation to align the principal axis and the image plane. Let this
    translation be T(Tx, Ty, Tz). Let the the rotation applied to coincide the principal
    axis with the Z axis be given by a 3 × 3 rotation matrix R. Then the matrix formed
    by first applying the translation followed by the rotation expressed using multiplication
    of sub-matrices is given by the 3 × 4 matrix


    E = (R | RT).  (7.12)


    E is called the extrinsic parameter matrix. Note that since translation is used
    now, we have to move to homogeneous coordinate for P as well. So, the complete
    transformation of P to Pc is now given by


    Pc = K(R | RT)P = (KR | KRT)P = KR(I | T)P = CP  (7.13)


    where the 3 × 4 matrix C is usually called the camera calibration matrix. Here,
    P is in 4D homogeneous coordinates (X, Y, Z, 1) and Pc derived by CP is in 3D
    homogeneous coordinates (u, v, w). Therefore, the exact 2D location of the projection
    on the camera image plane will be obtained by normalizing the 3D homogeneous coordinates
    (u/w, v/w, 1). The intrinsic parameter matrix has five degrees of freedom (2 for
    the location of the principal center, two for the size of pixels in two directions
    and one skew factor) while the extrinsic matrix has six degrees of freedom (3
    each for translation and rotation). Therefore, C has 11 degrees of freedom. It
    can be shown that this implies that the the bottom right element of C will always
    be 1.


    # 7.1.1 Camera Calibration


    In this section, we will see how to find C (i.e. the 11 entries of C) for a particular
    camera and decompose it to get the intrinsic and extrinsic parameters. This process
    is called camera calibration. The first step of camera calibration is to find
