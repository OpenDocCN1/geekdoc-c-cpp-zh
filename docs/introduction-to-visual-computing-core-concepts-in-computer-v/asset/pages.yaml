    Recall that the aforementioned model assumed point light sources. Other kinds
    of light sources are directional or area light sources. Directional light sources
    are lights that shine in a single uniform direction, i.e. all the rays originating
    from the source are parallel to each other. Area light sources are more like light
    panels instead of a point of light. Directional light sources are commonly used
    in computer graphics to mimic strong distant light sources like the sun. Directional
