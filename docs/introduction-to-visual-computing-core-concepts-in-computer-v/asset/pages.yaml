  md: 'plane. Next, we will deviate from this ideal situation to add new parameters
    to the model. Let the origin of the image plane not coincide with the point where
    the Z axis intersects the image plane. In that case, we need to translate P_c
    to the desired origin. Let this translation be defined by (t_u, t_v). Hence, now
    (u, v) is given by


    u = f X / Z + t_u  (7.5)

    v = f Y / Z + t_v  (7.6)


    This can be expressed in a similar form as Equation 7.4 as


    \begin{pmatrix} u \\ v \\ w \end{pmatrix} = \begin{pmatrix} f & 0 & t_u \\ 0 &
    f & t_v \\ 0 & 0 & 1 \end{pmatrix} \begin{pmatrix} X \\ Y \\ Z \end{pmatrix}  (7.7)


    In the above equation, P_c is expressed in inches. Since this is a camera image,
    we need to express it in pixels. For this we will need to know the resolution
    or density of pixels in the camera (pixels/inch). If the pixels are square the
    resolution will be identical in both u and v directions. However, for a more general
    model, we assume rectangle (and not square) pixels with resolution m_u and m_v
    pixels/inch in u and v directions respectively. Therefore, to measure P_c in pixels,
    its u and v coordinates should be multiplied by m_u and m_v respectively. Thus


    u = m_u f X / Z + m_u t_u  (7.8)

    v = m_v f Y / Z + m_v t_v  (7.9)


    which are then expressed as


    \begin{pmatrix} u \\ v \\ w \end{pmatrix} = \begin{pmatrix} m_u f & 0 & m_u t_u
    \\ 0 & m_v f & m_v t_v \\ 0 & 0 & 1 \end{pmatrix} \begin{pmatrix} X \\ Y \\ Z
    \end{pmatrix} = \begin{pmatrix} \alpha_x & 0 & u_o \\ 0 & \alpha_y & v_o \\ 0
    & 0 & 1 \end{pmatrix} P = K P  (7.10)


    K in the above equation only depends on the internal camera parameters like its
    focal length, principal axis, pixel size and resolution. These are called the
    intrinsic parameters of the camera. If the image plane is not a perfect rectangle,
    i.e. if the image plane axes are not orthogonal to each other, then K also includes
    a skew parameter s as


    K = \begin{pmatrix} \alpha_x & s & u_o \\ 0 & \alpha_y & v_o \\ 0 & 0 & 1 \end{pmatrix}  (7.11)


    Note that K is an upper triangular 3 × 3 matrix and is usually called the intrinsic
    parameter matrix for the camera.'
