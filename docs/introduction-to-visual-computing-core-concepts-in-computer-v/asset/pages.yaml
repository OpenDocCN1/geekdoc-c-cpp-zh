    is 0%, as is expected for an achromatic color.


    Finally, let us consider one more property of color called *luminance* which is
    $Y$. This is defined as the *perceived brightness* of a color. For this, consider
    the following experiment. Consider two different colors of the same intensity
    – a blue and a green. Therefore, blue will have higher $Z$ while green will have
    higher $Y$. Though these two colors have the same intensity, almost all humans
    will find the green to be brighter than the blue. This is due to a preferential
    importance given to the middle wavelengths, indicated by $Y$, than the others.
    This stems from the evolutionary reasons that man had to be extra sensitive to
    green all around him to survive on land. This is why $Y$ is called the luminance
    and is often considered to be very important in perceptual tasks. For example,
    when compressing images, $Y$ is maintained at full resolution while the other
    two channels are heavily sub-sampled.


    # 9.2.3  Perceptually Uniform Color Spaces


    CIE XYZ color space is perfectly suited for color matching applications. For example,
    if you want to superimpose two projectors and want to match their colors — you
    just have to make sure that they are projecting colors with the same $XYZ$ values
    at the two overlapping pixels. However, there are applications where perceptual
    distances between colors are more important.


    What do we mean by perceptual distance? This means how much distance we have to
    move from one color before the difference becomes visible. To understand the importance
    of perceptual distance, let us consider an application of image compression. When
    an image is compressed, we may want to change the colors slightly to aid the compression.
    This would mean moving the colors from their original location in the color space.
    But, we would like to move it just enough so that the change is not visible and
    the compressed image looks very close to the original image. The distance between
    the original and compressed image colors can give us an idea of how close perceptually
    these images are and hence use them to evaluate different compression techniques.
    In such applications, distance between colors become very important.


    Unfortunately, CIE XYZ color space is perceptually non-uniform. This means'
