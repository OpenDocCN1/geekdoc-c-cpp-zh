  md: '# 2


    # Techniques


    We are familiar with different kinds of data. In this chapter, we will introduce
    two fundamental techniques that we will be using throughout this book: interpolation
    and computation of geometric intersections.


    # 2.1 Interpolation


    Consider a function (e.g. attributes or properties like color or position) sampled
    at certain parametric values. Interpolation is a process by which this function
    is estimated at parametric values at which it has not been measured or sampled.
    An image data can be considered as samples of a 2D function I(x,y) that provides
    color at each spatial location (x,y). Typically, image data points are sampled
    at integer values of x and y. Given the function values of I(x,y) at the integer
    grid points (x, y), we use interpolation to find the function value I(x, y) at
    in-between, and possibly non-integer values of x, y. Or, consider a triangle.
    The position function (defined by 3D coordinates) is defined only at the vertices.
    We need to interpolate the positions of the vertices to the interior of the triangle
    to compute the position of any point lying inside the triangle.


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_37_0.png)


    Figure 2.1. This shows the assumption of smooth transition between samples in
    interpolation and how it can be modeled differently. Top: Linear; Bottom: Non-Linear.


    Interpolation is based on the assumption that the function changes smoothly between
    the different sampled values. However, interpolation techniques differ based on
    the degree of smoothness of change assumed between the samples. For example, consider
    the 1D function shown in Figure 2.1. The simplest assumption is that the 1D function
    changes linearly between two adjacent samples, i.e. two adjacent samples are connected
    by straight lines. Therefore, the function can be estimated at a parameter where
    it is not sampled, by considering the function values at its two nearest neighbors
    which defines the straight'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'line. This kind of interpolation that uses a straight line to estimate function
    values at points where it is not sampled is called linear interpolation. However,
    it is evident from Figure 2.1 that at sample points, the function values can changes
    abruptly (also called $C^0$ continuity). In many applications such discontinuities
    in the derivative of the function values are not acceptable. Therefore, in more
    sophisticated interpolation techniques, it is assumed a smooth curve passes through
    multiple of these samples such that the tangent vector of the curve also smoothly
    changes. In order to compute the derivatives, we need a larger neighborhood of
    sample points rather than just two that we used for linear interpolation. For
    tangent continuity (aka first derivative continuous, $C^1$ continuous, quadratic
    interpolation), we use three sample points. Similarly, for second derivative continuous
    cubic curve ($C^2$ continuous), we use four sample points, and so on. In this
    book we will almost always use only linear interpolation and therefore we will
    explore this in detail. We will first describe linear interpolation in 1D (as
    shown in Figure 2.1) and then extend the concept to 2D data (e.g. images and meshes)
    in which case it is called a bilinear interpolation.


    # 2.1.1 Linear Interpolation


    Let us consider a straight line segment between the endpoints $V_1$ and $V_2$.
    Let the color at these two vertices be $C(V_1) = (r_1, g_1, b_1)$ and $C(V_2)
    = (r_2, g_2, b_2)$ respectively. Any point $V$ on the line segment $V_1V_2$ is
    given by $V = \alpha V_1 + (1-\alpha)V_2$ where $0 \le \alpha \le 1$.


    We say a function $f$ is linear if $f(aX + bY) = a f(X) + b f(Y)$. Similarly,
    we say the color at the point $V$, $C(V)$, in the line segment $V_1V_2$ is linearly
    interpolated when


    $$C(V) = C(\alpha(V_1) + (1 - \alpha)(V_2)) = \alpha C(V_1) + (1 - \alpha)C(V_2).
    \tag{2.1}$$


    We can see that rate of change of color of a point between $V_1$ to $V_2$, with
    respect to the distance traveled between $V_1$ and $V_2$, is constant.


    Technically, the above interpolation is much more specific than a general linear
    interpolation (or linear combination) – it is called a convex combination of $C(V_1)$
    and $C(V_2)$ where the coefficients are positive and they add up to 1.0. It is
    said that the function value at $V$ (in this case color) is interpolated from
    the function values at $V_1$ and $V_2$ linearly by weighting the function at those
    values using coefficients $\alpha$ and $(1 - \alpha)$. The coefficients $\alpha$
    are typically computed as a relative function of the distance of the point $V$
    from $V_1$ and $V_2$. For example, we know that the parametric equation of a line
    is given by


    $$(x, y, z) = \alpha(x_1, y_1, z_1) + (1 - \alpha)(x_2, y_2, z_2) \tag{2.2}$$


    where $(x, y, z)$ are the 3D coordinates of any point on the line $V_1V_2$. Note
    that, though the coordinates are 3D, the geometric entity is 1D line embedded
    in 3D'
  merge: -1
  img_proc: true
- pgno: 39
  md: '![](img/66c45bbed85bb7ba7f7b05dff49b5060_39_0.png)


    Figure 2.2. Left: Bilinear interpolation at V from V1, V2 and V3 in a triangle.
    Right: Bilinear interpolation to find the value of F at P from the value of F
    at the integer pixels at (i, j), (i + 1, j), (i, j + 1) and (i + 1, j + 1) in
    an image.


    and therefore we are using linear interpolation. Given the locations of the points
    V1, V2 and V, we can find α by solving the equation


    ```

    x = α x1 + (1 − α) x2

    ```


    and use this α to find the value of C(V) from C(V1) and C(V2). The coefficients
    for V1 and V2 are both between 0 and 1 and their sum is equal to 1.0. Therefore,
    the function at V is estimated by a weighted sum of functions at V1 and V2 where
    each of the weights are fraction between 0 to 1 and their sum is equal to 1. This
    is called a convex combination of V1 and V2.


    If the constraint is only that the sum of the coefficients is 1.0, but the coefficients
    can be of any value, then it is called an affine combination. If there are no
    constraints on the coefficients, it is called a linear combination. Note that
    a linear combination does not always mean linear interpolation. For example, if
    the Equation 2.1 was C(V) = α² C(V1) + (1 − α²) C(V2), it would not be a linear
    interpolation in α, but would still be a linear combination of C(V1) and C(V2)
    because alpha² and (1 − alpha²) are still scalar values. In other words, for linear
    interpolation, the derivative of the interpolated function should be a constant.


    # 2.1.2 Bilinear Interpolation


    Instead of considering 1D data, let us now consider 2D data where the neighborhood
    of a sample extends in two different directions. Bilinear interpolation entails
    interpolating in one direction followed by interpolating in the second direction.


    For this, let us consider a triangle with three vertices V1, V2 and V3 (Figure
    2.2a). To estimate the function C at a point V inside the triangle, we first estimate
    the function in the two directions V1V3 and V1V2. The point Q on V1V3'
