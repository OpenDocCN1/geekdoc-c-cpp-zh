  md: '# Feature Detection


    Features of an image are defined as regions where some unusual action happens.
    For example, the brightness changes drastically to form an edge; or, gradients
    of edges change drastically to form corner. In this chapter, we will see how some
    of these features can be detected using convolution, which is a linear filtering
    process. Therefore, the properties of scale, shift invariance, and additivity
    are true for these filters. However, later in the chapter we will see that some
    features can only be detected via more complex non-linear filters.


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_115_0.png)


    Figure 5.1. This figure shows the salient features (right) detected by humans
    from an image of an object (left). We will see in this chapter that such clean
    and crisp detection of features is still not possible by computers.'
