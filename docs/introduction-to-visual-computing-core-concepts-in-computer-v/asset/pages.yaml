- pgno: 198
  md: '# 8.3 Fundamental Matrix


    Fundamental matrix, $F$, is a $3 \times 3$ matrix that helps us to find the line
    $l_2$ on which a correspondence $p_2$ of $p_1$ in camera $C_1$ lies in $C_2$.
    We will show that $l_2$ is given by $F p_1$.


    In order to define the concept of *fundamental matrix* of a camera, we will use
    the same geometric setup in Figure 8.2. Let $p_1 = (x_1, y_1, t_1)$ and $e_1 =
    (u, v, w)$. From derivations in Section 8.1 we know that the line $l_1$ defined
    by its endpoints $e_1$ and $p_1$ is given by


    ```

    $l_1 = [e_1]_\times p_1 = \begin{pmatrix} 0 & w & -v \\ -w & 0 & u \\ v & -u &
    0 \end{pmatrix} \begin{pmatrix} x_1 \\ y_1 \\ t_1 \end{pmatrix} = L p_1, \quad
    (8.12)$

    ```


    where $L = [e_1]_\times$. Now we know from the concepts presented in the previous
    chapter that since $l_1$ and $l_2$ are coplanar, there is a $3 \times 3$ homography
    or a 2D affine transformation $A$ that maps $l_1$ to $l_2$. Therefore,


    ```

    $l_2 = A l_1 \tag{8.13}$

    $= A L p_1 \tag{8.14}$

    $= F p_1 \tag{8.15}$

    ```


    Now let $p_2 = (x_2, y_2, t_2)$. Since $p_2$ lies on the line $l_2$, it will satisfy
    the line equation


    ```

    $p_2^T l_1 = p_2^T F p_1 = 0 \quad (8.16)$

    ```


    Here, $F$ related the two correspondences $p_1$ and $p_2$ and is called the fundamental
    matrix. Since $A$ and $L$ are both $3 \times 3$ matrices, the fundamental matrix
    $F$ is also a $3 \times 3$ matrix. Also $L$ is a rank 2 matrix and $A$ is a rank
    3 matrix. Therefore, $F$ is a rank 2 matrix. $A$ being a homography has eight
    degrees of freedom. When multiplied by rank 2 matrix $L$, the resultant $F$ has
    an additional constraint of $det(F) = 0$. This reduces the degrees of freedom
    of $F$ by 1 resulting in a matrix with seven degrees of freedom.


    # Fun Facts


    Epipolar geometry seems to have been first uncovered by von Guido Hauck in 1883.
    He wrote several papers on the trilinear relationships of points and lines seen
    in three images. In his work, Hauck did not deeply analyze these trilinear relationships
    theoretically, that was done later via trifocal tensors in the the 1990s. He rather
    concentrated on the application of these relationships to generate a third image
    from two given ones (often called trifocal transfer in computer vision). This
    concept is the mainstay of the'
  merge: -1
  img_proc: true
