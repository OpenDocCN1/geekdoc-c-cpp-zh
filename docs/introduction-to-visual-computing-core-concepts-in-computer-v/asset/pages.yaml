    # 4.2.2 Example Analysis of Signals


    Let us see if we can explain some of the phenomena using what we have learned
    so far. This will help you understand how to use these properties for analyzing
    signals. First let us consider a symmetric signal as seen in Figure 4.10. What
    can you say about the phase of a symmetric signal?


    For this we need to understand something called the complex conjugate of a signal.
    A signal whose frequency domain response has the same magnitude but negative phase
    is called the complex conjugate of x and is denoted by x*. It can also be shown
    that if the frequency response of a signal and its complex conjugate are added,
    the resulting phase is zero at all frequencies. Further, if the phase response
    in the frequency domain is negated as above, the signal is flipped in the spatial
    domain.


    Now considering this, let us look at a symmetric signal as shown in Figure 4.9.
    A symmetric signal can be decomposed into two signals, each of which is a flipped
    version of the other i.e. complex conjugate of the other. Therefore, the addition
    of these two signals provides a signal whose phase response is zero. Therefore
    a symmetric signal always has zero phase as shown in Figure 4.10.


    Now, let us next consider what happens when we consider shifting of such a symmetric
    signal. For this, please refer to Figure 4.10. Here we show circular shifts of
    the symmetric signal. Note that from the property of linear phase shift due to
    spatial shift in the signal we know that any such shift will cause the phase to
    be shifted linearly. The slope of this shift will be positive or negative based
    on if the shift is to the right or left respectively. Finally, when the circular
    shift results in another symmetric signal as shown in Figure 4.10, it leads to
    a zero phase signal again.


    This provides us with an example of how these properties can be used to analyze
    signals. However, the issue of phase of symmetric signals also brings in the question
    of what does it meant by a non-linear phase? Usually non-linear phase means non-linear
    features superimposed on linear phase as shown in Figure 4.11. It is typical of
    more general non-symmetric signals.'
