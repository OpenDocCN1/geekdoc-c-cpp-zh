    Issue of Sampling Let us now consider the sampling consequences of low pass filtering
    an image. Nyquist sampling criteria says that the minimum samples required to
    sample an image are double the highest frequency contained in the image. As an
    image undergoes low pass filtering, its frequency content decreases (f3 < f2 <
    f1 in Figure 3.12). This means that the minimum number of samples required to
    adequately sample the low pass filtered image goes down too. This says that the
    low pass filtered image can be at a smaller size than the original image. Or,
    as we progressively increase the size of the low pass filter, we do not need to
    have the image at its original size, but we can resample and store them at a much
    smaller size, just adequately large to sample the highest frequencies in them.


    This property is used to build a pyramid of progressively low pass filtered images
    called the Gaussian pyramid. For this, we resample the original image to the size
    of 2^n × 2^n. This forms level 0 of the pyramid. 2 × 2 pixel blocks of this image
    are low pass filtered to create a single pixel of the image at the next level
    of the hierarchy providing a 2^{n-1} × 2^{n-1} image. When using a box filter,
    this amounts to just averaging every 2 × 2 blocks of pixels in level n to create
    each pixel of level (n + 1) × (n + 1). Note that since the image at level i +
    1 is a low pass filtered from the image at level i, the lower resolution is adequate
    to sample this image with lower frequency content. This process if progressively
    continued creates n levels of the pyramid with the last level being a single pixel
    which can be considered to be an image of 2^{n-n} × 2^{n-n} = 1 × 1. This is illustrated
    in Figure 3.13.'
