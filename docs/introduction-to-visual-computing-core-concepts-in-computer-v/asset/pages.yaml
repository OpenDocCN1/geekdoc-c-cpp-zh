    \ is given by R(N,V)T(−E). Combining the model and view trnasformation, the transformation\
    \ applied to a model vertex P via matrix pre-multiplication is given by R(N,V)T(−E)M.\
    \ This 4×4 matrix R(N,V)T(−E)M is identical to the 3×3 extrinsic parameter matrix\
