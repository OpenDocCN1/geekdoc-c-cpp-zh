    # Uncalibrated Camera


    More often than not, we face a situation where the cameras are not calibrated.
    The question is, how do we find the fundamental matrix if the camera calibration
    matrices are unknown?


    For that, let us consider two points in the images of $C_1$ and $C_2$ respectively,
    given by $(x_1, y_1)$ and $(x_2, y_2)$ to be corresponding features detected manually
    or any software assisted process. These two points will satisfy Equation 8.19
