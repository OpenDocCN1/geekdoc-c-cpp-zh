- pgno: 307
  md: '# Interactive Graphics Pipeline


    The goal of the visual content synthesis pipeline is to take a 3D scene and a
    view point setup as input and generate a 2D image. We assume that this 3D scene
    is represented as a triangular mesh, as discussed in Chapter 1. Therefore the
    input data is given as a set of triangles whose vertices are defined with their
    position, at least one attribute (e.g. normal vectors, RGB color) and their connectivity.
    Let us consider Figure 13.1 in which the 3D scene consists of a very simple model
    of a pyramid defined by the vertices A, B, C and D. At every vertex, at least
    one attribute, namely its 3D location is defined. Other attributes can be color,
    normal and so on. The connectivity or topological information is given via four
    triangles ABC, DBC, DAC and ABD that define the way the vertices are connected
    by edges. The eye or view point or the position of the camera is defined by E
    and the image plane (or screen) by I. Let us describe the steps in the graphics
    pipeline that would draw a given object from the point of view of the eye E on
    the image plane I.


    +   1. *Geometric Transformation of Vertices:* The first aspect of the image synthesis
    pipeline is to find the 2D location of the vertices in the 3D scene on the image
    plane after transforming the vertices based on their perspective projection from
    the eye E. These 2D locations are shown by the vertices a, b, c and d found by
    perspectively projecting the 3D object on I. This entails connecting the vertices
    A, B, C and D to the eye E via straight line rays and finding their intersections
    with the plane I.


    +   2. *Clipping and Vertex Interpolation of Attributes:* Due the finite extent
    of I, all the vertices may not fall within the image plane I. We are only concerned
    with drawing the part of the scene that is inside I. Therefore, the projected
    triangles should be clipped by the boundaries of the image introducing new vertices
    at the intersection point of the image boundary and the triangle edges. Let us
    describe the steps in the graphics pipeline that would draw a given object from
    the point of view of the eye on the screen. For example, in Figure 13.1, new vertices
    f, e, h and g are introduced to clip the projected triangles shown in orange.
    The required attributes at the new vertices are'
