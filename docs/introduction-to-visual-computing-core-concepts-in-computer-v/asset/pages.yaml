- pgno: 193
  md: '# Epipolar Geometry


    In the previous chapter we learnt how we can use two or more cameras to reconstruct
    the geometry of a scene. This is often considered as one of the most important
    goals of computer vision. Scene reconstruction is a fundamental step towards automated
    scene understanding. Only when the basic scene geometry is reconstructed, we can
    delve deeper in other aspects like understanding objects, their movements and
    interactions with other elements of the scene – all of which are related to much
    higher levels of cognition in humans as well.


    Epipolar geometry defines geometric constraints across multiple cameras capturing
    the same scene. This enables simplification of common problems (like finding correspondences)
    when dealing with important vision tasks like motion estimation or 3D depth reconstruction.
    It is fascinating to see how even relatively simple constraints can make such
    hard problems tractable. In this chapter we will cover the fundamental concepts
    of epipolar geometry. We start this chapter by defining the notations we will
    be using.


    # 8.1 Background


    Let us consider a line defined by two 2D points, A(x, y, t) and B(u, v, w), in
    homogeneous coordinates, as shown in Figure 8.1. Therefore, the normalized homogeneous
    coordinates that provide the projection of these points in the 2D plane defined
    by Z = 1 is given by A'' = (x/t, y/t) and B'' = (u/w, v/w). Let the line between
    A'' and B'' be Ml. Ml is shown in red in Figure 8.1. The normal to the plane OAB
    is given by


    ```

    B × A = ( y w − t v \n t u − x w \n x v − y u ) . (8.1)

    ```


    Any point lying on Ml should be the projection of a point P = (p, q, r) that lies
    on the plane OAB. Therefore, P will satisfy the plane equation defined by the
    above normal as


    ```

    p(y w − t v) + q(t u − x w) + r(x v − y u) = 0 (8.2)

    ```'
  merge: -1
  img_proc: true
