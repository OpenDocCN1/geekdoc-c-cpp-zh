    # 11.1 Histogram Processing


    Histogram is defined as the probability density function of the values in an image.
    Let us consider a single channel of an image of size $m \times n$ providing a
    total of $N = m \times n$ pixels. The value at each pixel $i$ can take $p$ discrete
    values normalized between zero (black) to one (white). $p$ is given by the number
    of bits used for representing the grays. Let us consider 8-bit gray values leading
    to $p = 256$. Therefore, $i$ can take $k$ different values, $i_k$, $1 < k < 256$.
    Let the number of pixels in the image with value $i_k$ be $N_k$. Therefore, the
    histogram $h(i_k)$ is defined as


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_268_0.png)


    Figure 11.2. This figure shows how the exposure (the measure of how much light
    is let into the camera to capture the picture) affects the histogram of an image.
    When the image is underexposed (left) the histogram $h$ shifts left with higher
    values of $h$ for lower values of $i$. When the image is overexposed (right) the
    histogram $h$ shifts right. For correctly exposed image, the values of $h$ at
    0 and 255 are not outliers.


    $$h(i_k)=\frac{N_k}{N} \qquad (11.1)$$


    i.e. the probability of a pixel to have a value $i_k$. Since $h(i_k)$ is a probability,
    $0 \le h(i_k) \le 1$, and therefore $h$ is a probability density function.


    [Figure 11.1](#) shows some example of histogram of images. Note that two images
    can have entirely different appearances but have very similar histograms. [Figure
    11.2](#) shows the effect of the exposure on the histogram of an image. Exposure
    decides how much light comes into the camera when capturing the image. If too
    little light is let in, darker regions of the image are underexposed having the
    value 0 therefore creating a high value for $h(0)$. If too much light is let in,
    brighter regions of the image are overexposed having the value of 1 thereby creating
    a spike at $h(1)$. [Figure 11.3](#) shows the effect of contrast on the histogram
    of an'
