    $$=\begin{pmatrix}\frac{2n}{r-l}&0&0&0\\0&\frac{2n}{t-b}&0&0\\0&0&-\frac{n+f}{n-f}&\frac{2nf}{n-f}\\0&0&1&0\end{pmatrix}\begin{pmatrix}1&0&-\frac{r+l}{2n}&0\\0&1&-\frac{t+b}{2n}&0\\0&0&1&0\\0&0&0&1\end{pmatrix}$$


