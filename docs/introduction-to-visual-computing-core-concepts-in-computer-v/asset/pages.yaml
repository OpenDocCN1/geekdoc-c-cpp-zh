- pgno: 116
  md: '# 5.1  Edge Detection


    Edges have a special importance in our perception. Several cells in the human
    cortex have been found to be specialized for edge detection. Edges help us understand
    several aspects of an object including texture, lighting and shape. In this section,
    we will see how we can detect edges in an image using computers.


    [Figure 5.1] shows the kind of edge detection we would like to have. In the rest
    of this section we will explore algorithms to achieve this goal and see how close
    we can get to it. As humans it is very easy for us to perform this task. However,
    we will see in the following sections that the job is not that easy for computers
    and developing algorithms that can achieve similar performance is rather difficult.


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_116_0.png)


    **Figure 5.2.** This shows the different kinds of edges and the causes of their
    origin for a simple figure of a bottle.


    Edges can have multiple origins ([Figure 5.2]). They can be caused by discontinuity
    in depth or surface normals. They can be caused by a stark change in color or
    illumination. We will perform edge detection using the following steps. (a) Find
    all the pixels that are part of an edge. These are called *edgels*. We would take
    an image as input and create a binary image as output where all the edges will
    be marked as white and the non-edges as black. We may also output a gray scale
    image where the color value will denote the strength of the edge. Black would
    indicate no edge at all. (b) Next, we will use methods to aggregate this edges
    into longer edges, sometimes using a compact parametric representation.


    # 5.1.1  Edgel Detectors


    In this section, we will discuss different methods to detect edgels, their advantages
    and disadvantages. Finally, we will explore methods to detect edges at different
    levels of details.


    **Gradient Based Detectors** Let us now take a close look at the edges in [Figure
    5.2]. Despite having different origins they have one feature in common. Edges
    are formed when there is a drastic change in the brightness over one or more pixels
