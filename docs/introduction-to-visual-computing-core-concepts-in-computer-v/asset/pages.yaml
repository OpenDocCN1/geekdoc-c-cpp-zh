    We have discussed here only two very basic color management techniques that only
    apply to linear devices. Non-linear devices (for e.g. ones with more than three
    primaries) have more complex shaped gamuts. Complex geometric entities like Bezier
    patches or splines may be used to handle such non-linearities. Further, we also
    only considered methods that are content-independent (i.e. that does not depend
    on the particular content). There are other gamut matching techniques that take
    content into consideration. For example, if you are dealing with fall images where
    you know you will have predominantly reds, oranges and yellows, you can do lot
    better by adapting the method to these colors so that they are maintained at higher
    fidelity while larger movements occur for colors which are sparse in the image.


    # 10.3 Modeling Subtractive Color Mixture


    We have discussed additive color mixtures so far. Though this is the system which
    we will use mostly, paint based systems (e.g. printers) still use subtractive
    color mixtures. We will discuss some of the basic issues about subtractive color
    mixtures in this section.


    Cyan, magenta and yellow are considered to be the primaries of subtractive color
    systems. Cyan absorbs red, magenta absorbs green and yellow absorbs blue. The
    ideal response of such paints or filters is shown by the bold lines in Figure
    10.11. When we say that yellow has an input of 0.5, it essentially means that
    50% of blue is absorbed. Or, a input of 0.75 magenta means 75% of green is absorbed.
    Considering this, a very simplistic model of *CMY* systems can be


    ```latex

    (C,M,Y)=(1,1,1)-(R,G,B).

    \tag{10.21}

    ```


    Therefore, it is easy to find the RGB inputs of a device given the input to a
    subtractive CMY device using the above equation. However, the problem is that
    the real CMY filters rarely behave as ideal block filters. They show lot of cross
    talk due to ink impurities. This also causes gray imbalance which means that equal
    amount of the different primaries do not lead to a neutral gray color. Therefore,
    this simplistic model rarely holds.


    In addition, when dealing with dyes on paper, several other issues come into play.
    For example, it is evident that depositing C, M and Y on top of each'
