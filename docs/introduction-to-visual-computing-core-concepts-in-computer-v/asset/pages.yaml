    This shows that our ability to distinguish between different shades of green is
    much worse than our ability to distinguish between purples or yellows. Our ability
    to distinguish between blues is probably the best.


    Therefore in 1964 and subsequently in 1976 efforts were made to design a perceptually
    uniform color space via non-linear transformation of the chromaticity coordinates.
    There are several such spaces designed like the CIE LUV or CIE Lab. Figure 9.9
    shows one such color space designed in 1976 called the CIELUV space. Note that
    the perceptual distances are much more uniform than the chromaticity chart of
    1939, but still not ideal. The most popular space in this context is the CIELab
    space designed much later and is derived from the CIE XYZ space. The Euclidean
    distance of 3 in the CIE Lab space is considered to be *just noticeable difference*.
    However, if you have color matching applications nothing can beat the simple old
    CIE XYZ space and the chromaticity chart devised thereof.'
