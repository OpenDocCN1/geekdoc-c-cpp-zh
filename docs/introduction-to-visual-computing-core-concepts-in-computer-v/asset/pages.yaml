    # 9.2.1 CIE XYZ Color Space


    Interestingly, the perceived color is different than the color stimuli. Human
    eye has three sensors (usually called cones in biology) which have differential
    sensitivities to different wavelengths. In 1939, the CIE (International Commission
    on Illumination) came up with standard spectral responses of these sensors based
    on earlier studies done by color scientists. Let us denote these by x̄(λ), ȳ(λ),
    z̄(λ). Therefore, multiplying the color stimuli with these sensitivities give
    us the perceived spectrum as illustrated in Figure 9.5. Now, the strength of each
    of these perceived spectrum is the area under the curve and is computed by integrating
    each of the three curves. These provide three numbers quantifying the strength'
  merge: -1
  img_proc: true
- pgno: 225
  md: '![](img/66c45bbed85bb7ba7f7b05dff49b5060_225_0.png)


    Figure 9.5. The color stimulus is multiplied by the sensitivities of the three
    cones of the CIE standard observer – x̄(λ) (red), ȳ(λ) (green), z̄(λ) (blue) –
    to generate the perceived spectrum. The strength of each of these perceived spectrums
    is given by the area under these spectral curves given by their integration. This
    is also the process to find the XYZ tristimulus values of a color stimulus which
    quantifies how the human brain perceives this stimulus.


    of the stimuli in each of the sensors called the XYZ tristimulus values


    ```

    X = ∫_λ C(λ) x̄(λ) dλ = Σ_{λ=400}^{700} C(λ) x̄(λ)    (9.25)

    Y = ∫_λ C(λ) ȳ(λ) dλ = Σ_{λ=400}^{700} C(λ) ȳ(λ)    (9.26)

    Z = ∫_λ C(λ) z̄(λ) dλ = Σ_{λ=400}^{700} C(λ) z̄(λ)    (9.27)

    ```


    Let us now consider the units of the functions we are dealing with. The eye’s
    response is measured as lumens per watt. Lumens (lm) is an estimate of the light
    produced. For example, think of a light bulbs. They are usually rated in terms
    of the power they consume (i.e. watt) and the useful light energy they produce
    (i.e. lumens). Therefore, the higher the lm/W, the more efficient the lamp. Similar
    is the case for the human response functions, but they also have a wavelength
    dependency. Therefore, the unit for X, Y or Z is (lm/W)(W/(m² sr)) = lm/(m² sr).
    Note that since we integrate over the wavelength, the nm disappears from the unit.
    One lumen per steridian of solid angle is defined as one cd (candela). Therefore,
    the units of the tristimulus values is cd/m².


    It has been shown that the human brain usually works with these three numbers
    thus generated instead of the spectrum. It also provides us a better paradigm
    to study color stimuli and perception than working with the spectra directly.
    Note that the XYZ tristimulus values offer us a 3D space to define colors, just
    like coordinate systems for geometry. Any color can be plotted as a point in this
    3D space. However, since XYZ values are essentially given by the area under a
    curve, there can be two different spectra which can provide'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'the same XYZ value. This means that these two spectra will produce the same
    sensation in the human eye and hence will be plotted at the same point in the
    XYZ space. Multiple such spectra which produce the same XYZ values are called
    metamers and the phenomenon, metamerism. Metamerism is a boon in disguise. During
    color reproduction from a display, to say print, all we need to do is to create
    a metamer of the original color i.e. a color with the same XYZ value and not necessarily
    the same spectrum. Therefore, CIE XYZ space is always considered in the context
    of human perception and not in the context of the real color spectra.


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_226_0.png)


    Figure 9.6. This shows the conical volume occupied by the real colors in the CIE
    XYZ space.


    Now let us analyze this XYZ space. First, note that only the positive octant (where
    the values of X, Y and Z are always positive) of this space really makes sense
    since physically there is no negative light. Therefore, we are only concerned
    with the first octant of this space. Second, some XYZ tristimulus values, even
    in this octant, are not valid since they indicate an impossible spectrum. For
    example, there cannot be any spectrum that can result in XYZ value of (1,0,0)
    i.e. evoking response in one of the sensors and no response in any other sensors.
    This is primarily due to the fact that


    the sensitivities of the three sensors overlap significantly. These XYZ values
    which do not correspond to a physical spectrum are called imaginary colors. Therefore,
    a part of the XYZ space are actually imaginary without having any corresponding
    real spectra to go with the tristimulus values. Therefore, the real colors or
    spectra only span a subset of the positive octant of the XYZ space. Munsell, the
    famous color scientist of 20th century, was instrumental in finding the shape
    of this subset of real colors as a conical volume as shown in Figure 9.6.'
