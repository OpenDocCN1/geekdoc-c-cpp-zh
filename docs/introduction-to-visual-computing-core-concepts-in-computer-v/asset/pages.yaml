    # 10.4.2 Multi-Spectral Imaging


    Multi-spectral imaging is a technique that addresses the issue of a limited 2D
    color gamut of any 3-primary color reproduction system. It is evident that the
    triangular 2D gamut formed by 3-primaries can never capture the entire 2D color
    gamut of the human eye. In fact, as shown in Figure 10.3, most color reproduction
    systems do not have highly saturated primaries thereby restricting the 2D gamut
    of 3-primary systems even further. This is due to a fundamental physical limitation.
    Saturated primaries are achieved by narrow band primaries which are light inefficient
    since they filter out most of the light in a scene retaining only a very narrow
    band. Therefore, saturated primaries require addressing this fundamental trade
    off between light efficiency and a larger 2D color gamut. An obvious solution
    to this problem is to choose more than 3-primaries and various'
