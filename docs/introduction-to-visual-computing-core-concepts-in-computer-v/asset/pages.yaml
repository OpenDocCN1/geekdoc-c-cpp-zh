    while keeping the z-coordinate unaffected. This is achieved by the transformation


    W(t_w, l_w, b_w, r_w) = \begin{pmatrix} \frac{r_w - l_w}{2} & 0 & 0 & \frac{l_w
    + r_w}{2} \\ 0 & \frac{t_w - b_w}{2} & 0 & \frac{t_w + b_w}{2} \\ 0 & 0 & 1 &
    0 \\ 0 & 0 & 0 & 1 \end{pmatrix} (13.36)


    # 13.1.6 The Final Transformation


    Therefore the complete transformation G of a point P is given by


    G = W(l_w, r_w, t_w, b_w) L(n, f, r, l, t, b) R(N, V) T(-E) M (13.37)


    The above transformation projects the point from the object coordinate system
    to the window coordinates. This is exactly how the vertices a, b, c and d are
    generated in Figure 13.1 from the 3D vertices A, B, C and D.


    # 13.2 Clipping and Vertex Interpolation of Attributes


    Clipping is usually done in the graphics hardware and the application programmer
    does not need to worry about. Yet, we provide a very short overview here. Clipping
    is done in 2D following the projection of points. We will discuss some 3D clipping
    methods in later chapters. Any 2D clipping algorithm fundamentally depends on
    finding intersections of primitive (lines or polygons) with the edges of the window.
    Therefore, the mathematics behind these algorithms are straight forward. However,
    what makes it challenging in the context of the interactive graphics pipeline
    is its efficiency. Every primitive or triangle needs to go through the process
    of clipping and when the scene consists of millions of triangles efficiency of
    the algorithm becomes important even if it is done in the hardware. Following
    are some of the ways to increase the efficiency; they are most likely to be deployed
    one after the other in sequence.'
