- pgno: 333
  md: '# Realism and Performance


    In the last chapter, we discussed the geometric fundamentals of the interactive
    graphics pipeline. However, a scene rendered using this basic pipeline with no
    lighting effects (e.g. specular highlights or shadows) or finer details or some
    patterns or bumps on objects would not look realistic. In this chapter, we will
    study a number of techniques that will allow us to render more realism in the
    scene. However, these do not come for free, rather with a risk of degrading performance
    (e.g. frame rate). Therefore, we will also discuss some techniques to enhance
    realism without compromising performance.


    # 14.1  Illumination


    Computing illumination of a scene is an extremely complex problem. The total amount
    of illumination at any surface point is due to both *direct* and *indirect* illumination.
    Direct illumination accounts for the light coming directly from a light source
    and reaching a surface point on the object. In addition, light reflected off,
    transmitted through or refracted by other surfaces can also reach the same surface
    point after multiple bounces and is called the indirect illumination. Thus, in
    order to compute that total amount of illumination at any surface point on an
    object we need to compute all the indirect illumination resulting from multiple
    bounces across multiple surfaces in addition to the direct illumination from the
    light source, as summarized in [Equation 9.23 of Chapter 9](#). Such compute-intensive
    complex light models can be extremely time-consuming and therefore not suitable
    for interactive graphics. Therefore, much simpler illumination models are used
    to meet the interactive rates performance criterion.


    The first simplification comes from assuming point light sources where we will
    start our discussion. Second, only the direct illumination (i.e. the light that
    comes at a point on the object directly from the point light source) is modeled
    while all the indirect illumination (i.e. light that reaches a point after bouncing
    multiple times from multiple objects) is combined under a single term called *ambient
    illumination*.


    Let us consider a single light source illuminating a surface point *P* with nor-'
