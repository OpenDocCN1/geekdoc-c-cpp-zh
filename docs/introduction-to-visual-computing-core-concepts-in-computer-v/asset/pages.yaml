    # Curvature Based Detectors


    The gradient based operators work well but they suffer from two problems. First,
    for step or ramp edges (brightness that smoothly changes from one level to another
    to create the edge rather than a sharp change from one level to another and back
    to the previous level), they have poor localization (i.e. precise location of
    the edge) after thresholding which becomes especially evident at thicker edges.


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_121_1.png)


    This is due to the fact that a step or ramp edge can trigger response on multiple
    adjacent pixels based on how smooth the step or ramp is. Second, the response
    of the gradient based operators is different for different direction edges. As
    a result, the gradient based operators can miss edges based on the thresholding
    value since the value favors some directions over others.


    Curvature based edge detectors alleviate these problems. The basic idea behind
    these operators lies in the realization that edges occur when the first derivative
    (or gradient) of an image reaches a maxima or a minima. This means at these points
    the second derivative or curvature should have a zero-crossing (Figure 5.11).
    The goal of the curvature based operators is to detect these zero crossings to
    find the precise location of the edge and mark these pixels. This edge detector
    is often called the


    Figure 5.11. This shows the zero crossing in the 2nd derivative for a feature
    edge in 1D.'
