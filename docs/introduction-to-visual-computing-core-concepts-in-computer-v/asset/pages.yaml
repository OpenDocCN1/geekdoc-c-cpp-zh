    # 8.6.2 Depth from Optical Flow


    The next application we will focus on is depth from optical flow. Consider a single
    camera whose principal axis is aligned with the $Z$ axis and which is moving along
    $Z$ direction. Consider two different locations of this camera on the $Z$ axes,
    the first one being the origin and the second one at distance $t$ from the origin.
    The calibration matrices of the camera for these two locations, $A_1$ and $A_2$
    respectively, are given by


    $$A_1 = K[I\mid O]$$


    $$A_2 = K[I\mid T_z]$$


    where $T_z=(0,0,t)^T$. Since the intrinsic parameters of the camera do not change
    with movement, the intrinsic matrix $K$ remains the same. Let the image of the
    same point in these two camera positions be $p_1=(x_1,y_1,1)^T$ and $p_2=(x_2,y_2,1)^T$.
    Let us consider $K$ as


