  md: '# Put a Face to the Name


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_125_0.png)


    David Courtney Marr (1945-1980) was a British neuroscientist and psychologist
    who was considered instrumental in the resurgence of interest in the discipline
    of computational neuroscience. He integrated results from psychology, artificial
    intelligence and neurophysiology to build new visual processing models. One of
    the great examples of his visionary contributions is the Marr-Heldrith edge detector
    which was designed with his student Ellen Heldrith. Marr and Heldrith modeled
    the edge detection operation in the human brain to be carried on by adjacently
    located minima and maxima detector cells whose response is then combined with
    a logical AND operation by closely located zero detector cells. The Marr-Heldrith
    operator that performs edge detection following this model was first proposed
    in 1980. Interestingly, scientists Hubel and Weisl found the existence of all
    these predicted cells in our visual pathways, though this happened after Marr’s
    death. A process called lateral inhibition in the ganglion cells performs the
    convolution. Cells called simple cells in the cortex respond to maxima and minima
    of the signals sent from ganglion cells. Finally, cells called the complex cells
    have been found near these simple cells that act like zero detectors. Therefore,
    this edge detector is one that behaves closest to our human brain. Marr’s life
    was ended prematurely at the age of 35 due to leukemia. His findings are collected
    in the book Vision: A Computational Investigation into the Human Representation
    and Processing of Visual Information, which was finished mainly on 1979 summer,
    was published in 1982 after his death and re-printed in 2010 by The MIT Press.
    The Marr Prize, one of the most prestigious awards in computer vision, is named
    in his honor. Ellen Hildreth is currently a professor in Wellesley College and
    continues to study computer modeling of human vision.


    Finally, hysteresis is used to avoid streaking, a phenomenon of breaking of the
    edge contour when the output of the previous step fluctuates above and below a
    single threshold. In hysteresis, two thresholds are defined, L and H where L <
    H. The gradient at any pixel being higher than H is detected to be a strong edge
    pixel and hence marked. The gradient being lower than L assumes a non-edge pixel
    and is not marked. Any pixel with a gradient value between L and H is considered
    to be a weak edge pixel and its candidacy to the set of edgels is additionally
    evaluated using connectivity analysis. If a weak edge pixel is connected to at
    least one strong edge pixel, then it is considered to be continuation of a strong
    edge and hence marked. This removes spurious short edges under the assumption
    that edges are long lines. Figure 5.16 shows the'
