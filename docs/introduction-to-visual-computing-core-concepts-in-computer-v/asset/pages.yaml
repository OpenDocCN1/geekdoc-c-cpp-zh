    # Put a Face to the Name


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_89_0.png)


    Jean-Baptiste Joseph Fourier was a French mathematician (21 March 1768 – 16 May
    1830) who played an important role during the French Revolution for which he was
    briefly imprsioned. He accompanied Napoleon Bonaparte in his Egyptian expedition
    in 1798 and contributed heavily to the Egyptian institute in Cairo that Napoleon
    founded. Fourier’s biggest contribution is in the investigation of Fourier series
    and their applications to problems of heat transfer and vibrations.


    Though Fourier transform is probably the most fundamental mainstay of image processing,
    it was not easy for Fourier to publish this work. Fourier first tried to publish
    this work in 1807 when he claimed that "any continuous periodic signal can be
    expressed as a sum of properly chosen sinusoids". Two stalwart mathematcians of
    those times, Lagrange and Laplace, reviewed the paper. While Laplace wanted to
    publish the paper, Lagrange vehemently opposed it saying that sinusoids cannot
    be sufficient to represent signals with corners. The paper was published 15 years
    later after Lagrange’s death. As to the question of who was right, – well, both
    were. It is true that you cannot represent signals with corners with sinusoids,
    but you can get extremely close. In fact, you can get so close that the energy
    difference is zero which was shown by Gibbs later on and is famously called the
    Gibbs effect. Also, it was shown that this is true only in the analog domain.
    In the digital domain, the representation is exact, even for signals with corners.


