- pgno: 324
  md: 'red line meets the top boundary before left that can only happen when the line
    is completely outside the window and should be rejected. Therefore, to figure
    out which boundary intersection computation needs to be performed, it may be useful
    to find the parametric value α of the line intersection with different window
    boundaries. Denoting the alpha boundaries by α_l, α_r, α_t and α_b for the left,
    right, top and bottom boundary and simply ordering these parametric values we
    can find the portion of the line that is inside the window. However, computing
    these parametric values involve floating point operation. So, the next question
    is how can we make this operations more efficient?


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_324_0.png)


    Figure 13.8. This figure shows the computation of which boundaries to intersect
    with using integer computations.


    Consider a line given by two points defined by integers (x1, y1) and (x2, y2)
    where x1 < x2 and y1 < y2 (assuming the bottom left corner of the screen to be
    origin). We know


    α_t = (t − y1)/(y2 − y1) (13.38)


    α_l = (l − x1)/(x2 − x1) (13.39)


    If α_t < α_l, i.e.


    (t − y1)/(y2 − y1) < (l − x1)/(x2 − x1), (13.40)


    the line should be rejected. Instead of carrying this test on the floating point
    numbers α_l and α_t, the same results can be obtained if we derive the decision
    factor from Equation 13.40 to be


    (l − x1)(y2 − y1) < (t − y1)(x2 − x1). (13.41)


    The advantage of Equation 13.41 is that it is completely in integers and does
    not involve any floating point computation. The methods of clipping are fraught
    with such techniques to avoid floating point computation thereby making the pipeline
    extremely efficient.'
