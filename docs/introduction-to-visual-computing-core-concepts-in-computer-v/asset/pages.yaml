    This matrix $L(n,f,r,l,t,b)$ is often called the frustum transformation matrix
    since it is dependent on the parameters that define the view frustum.


    The top-left $3\times3$ submatrix of Equation 13.35 looks exactly like the intrinsic
    parameter matrix in Equation 7.10 where the focal length is $n$, the horizontal
    and vertical scale factors are $\frac{2}{r-l}$ and $\frac{2}{t-b}$ respectively
    and the horizontal and vertical offsets are $-\frac{l+r}{2}$ and $-\frac{t+b}{2}$
    respectively. In other words, while the view transformation is essentially the
    extrinsic parameter matrix, the frustum transformation matrix $L$ is essentially
    the intrinsic parameter matrix. The camera model in the synthesis pipeline is
    essentially the same as the pinhole camera model, but we arrive at the same equations
    from different directions and use it differently.


    # 13.1.5 Window Coordinate Transformation


    The perspective transformation normalizes each of the three coordinates to be
    between −1 to +1. However, the final drawing in any image synthesis has to be
    done on a window on the display screen which is usually defined by integer coordinates
    of the top left and bottom right corner of the window. Therefore, this is exactly
    similar to providing the viewport. Let the coordinates of these top, left, right
    and bottom window be $t_w$, $l_w$, $b_w$ and $r_w$ respectively. Therefore, the
    center of the window is given by $\left(\frac{l_w+r_w}{2},\frac{t_w+b_w}{2}\right)$
    and the length and height of the window is given by $r_w-l_w$ and $t_w-b_w$ respectively.
    The transformation to the window coordinates involve a translation by $\left(\frac{l_w+r_w}{2},\frac{t_w+b_w}{2}\right)$
    and a scaling by'
