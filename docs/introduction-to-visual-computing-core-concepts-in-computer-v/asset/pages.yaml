    A non-orientable surface that has been intriguing to topologists is the Klein
    bottle. Unlike a mobius strip, it does not have any boundary. It is what you get
    when you put two mobius strips together. The Klein bottle was first described
    in 1882 by the German mathematician Felix Klein. It cannot be embedded in 3D space,
    only in 4D space.


    Klein bottles would hold, they contain themselves when embedded in 4D space! This
    has not stopped people from trying to embed them in 3D however, and there are
    some beautifully-made representations on display at the London Science Museum!


    We have so far only considered triangular primitives for meshes. Though other
    primitives can be used (e.g. six quadrilaterals instead of 12 triangles for mesh
    representation of a cube), triangles are preferred for various reasons. First,
    triangles are always planar since three non-collinear points define a plane. Hence,
    modeling packages do not need to assure that a surface fits the vertices when
    they output the mesh representation. Second, as we will see in the next chapter,
    in computer graphics it is important to find out the attributes or properties
    of points lying inside a primitive from the properties at its vertices via techniques
    called interpolation where triangular primitives hold a great advantage.


    # 1.4 Noise


    Any discussion on data cannot be complete without discussing noise. Noise can
    be caused due to several factors like mechanical imprecision, sensor imprecision
    (e.g. occasional always-dead or always-live pixels) and so on. The origins of
    noise in different systems are different. It is best described as addition of
    random values as random locations in the data. In this chapter we will discuss
    some common types of noise.'
