    simple illumination model considering a point light source from the direction
    L illuminating an object point P with normal N. More light is incident per unit
    area of the object if L and N are coincident i.e. the light is illuminating P
    head-on. As the angle between L and N increases, the amount of incident light
    decreases. It can be shown that the fall off of incident light per unit area is
    proportional to cosθ where θ is the angle between N and L. Therefore, the illumination
    at P is given by N · L. To compute the amount of the illumination that is reflected
    from P, we assume the object to be Lambertian i.e. reflects light equally in all
    directions. Let fraction of light reflected be ρ. Therefore, the amount of reflected
    light is given by ρ · N · L.


    Now, for photometric stereo, let us consider a set up where a Lambertian object
    is being seen by a camera. The locations of both the object and the camera do
    not change. However, it is lighted by n lights located at different locations
    surrounding the object. These light directions are known and given by L1, L2,
    …, Ln, where Li is a vector given by (Li^x, Li^y, Li^z). Let the light intensities
    be unity. Let the point P with normal N = (n^x, n^y, n^z) and reflectance ρ on
    the object be seen at a camera location (p, q). Let the reflected illumination
    recorded by the camera at (p, q) with only light Li illuminating the surface be
    Ri(p, q). Therefore at each pixel (p, q)


    R_i = ρ N · L_i. (11.6)'
