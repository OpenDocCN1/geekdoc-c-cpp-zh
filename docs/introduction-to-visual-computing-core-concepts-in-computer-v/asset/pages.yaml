    ```

    P_π² = (A₂ − a₂N) P_π¹ = H P_π¹.  (7.34)

    ```


    a₂ is a 3 × 1 matrix and N is a 1 × 3 matrix. Thus, a₂N would generate a 3 × 3
    matrix that can be subtracted from 3 × 3 matrix A₂ to generate H. Therefore, H
    is a 3 × 3 matrix that relates one camera image with another called the homography.
    Using this matrix, the image from one camera can be warped to produce the image
    from another camera. Therefore, for the special case when the scene observed by
    the two cameras is planar, instead of going through a full camera calibration,
    we can relate the image in one camera to another.


    Homography is a 2D projective transformation and therefore has eight degrees of
    freedom that is equivalent to having the bottom right element as 1. Therefore,
    when computing H the number of unknowns is 8. From each correspondence, using
    Equation 7.33, we can generate two linear equations. To find the 8 unknowns in
    H, we need just 4 correspondences. However, it is always advisable to use more
    than four correspondences to create an over-constrained system which would yield
    a more robust estimate of H.


    Now let us consider an alternate scenario where the location of the two cameras
    are the same (i.e. they have the same center of projection) but they have different
    orientations. In this case, the extrinsic parameters of these two cameras will
    differ only by a rotation, represented by a 3 × 3 matrix. The camera calibration
    matrix of these two cameras will be related by an invertible 3 × 3 matrix, and
    therefore a homography. This is the situation in the common application of panoramic
    image generation. A camera is usually mounted on a tripod or held in hand and
    rotated about a fixed center of projection to capture multiple images. Therefore,
    each camera position can be related to another via a homography. Though each image
    covers a narrow field of view, the multiple images can be stitched together to
    achieve an image with much larger field of view, more commonly called a panorama.
    In this application usually adjacent images have a considerable overlap. Common
