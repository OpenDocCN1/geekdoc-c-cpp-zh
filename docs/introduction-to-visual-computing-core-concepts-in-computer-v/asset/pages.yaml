    that is different than correspondences that we have been discussing so far in
    this chapter. Corresponding points are defined as the points that coincide when
    two eyes are slipped on top of each other to overlap completely with each other.
    Interestingly, 3D points on the scene that lie on a specific circle at a particular
    radius from the eye are imaged at corresponding points in the two eyes. This is
    illustrated in the left figure of Figure 8.6.1. This circle is called the horopter.
    Points which are not on the horopter are imaged at non-corresponding points on
    the left and right eye as shown in the right figure of Figure 8.6.1. Imaging of
    such points are shown by green and red in this figure. The depth of these points
    can be deciphered by the difference of their distance from the image of the point
    of fixation given by black. This difference is called disparity.


