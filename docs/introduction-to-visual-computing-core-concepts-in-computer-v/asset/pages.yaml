- pgno: 261
  md: 'This light inefficiency becomes the primary inhibitor for creating spectrally
    accurate reproduction of colors in displays. Spectrally accurate displays demand
    highly saturated (and therefore narrow band) primaries which are very bright to
    create the light efficiency demanded by a display. Creating such super-bright
    saturated primaries for displays was practically impossible till date. But, the
    promised gamut of the 6-primary laser projectors of the future, shown by the cyan
    polygon in Figure 10.3 shows promise to achieve this, hopefully sometime soon.


    # Fun Facts


    The world of color standards can be a confusing aspect to deal with for consumers.
    What do the terms NTSC, HDTV, UHDTV mean and what are their consequences on the
    picture quality? The color standard definitions have their origin in the 1940s
    when the TV industry felt the need to define some standards for transmission of
    the video signals. Since this was the era of black and white television, the only
    property that was related to the transmission was the spatial resolution of the
    imagery which was 640 × 480 at a 4:3 aspect ratio (ratio of the screen width to
    height). In 1953, color was added to the standards after the advent of color televisions.
    This included specifying a standard 2D color gamut and white point (as shown in
    Figure 10.3). This was the main standard until around 2010 when the advent of
    digital content led to the development of the HDTV (high-definition TV) standard.
    This changed the resolution to 1920 × 1080 and expanded the color gamut slightly
    (as shown in Figure 10.3). This also introduced the concept of widescreen TV with
    aspect ratio of 16:9. Recently, there is a new standard called UHDTV (Ultra high-resolution
    TV) which doubles the resolution to 3840 × 2160. But we have reached the limits
    of our ability to perceive resolution in standard TV size with HDTV. Therefore
    UHDTV does not promise a huge difference in quality in terms of resolution. However,
    the color gamut has also expanded significantly promising much more vibrant displays.
    Also, UHDTV standard now allows high dynamic range imagery which together with
    the expanded color gamut should improve the color quality of TVs greatly.


    # 10.5  Conclusion


    Color reproduction needs to combine the precision of hard mathematics along with
    the limitations and/or imprecision of human perception – often involving human
    cognition – making it a very difficult science or application to succeed in.'
  merge: -1
  img_proc: true
- pgno: 262
  md: 'Deep knowledge of human perception, as offered in books like [Palmer 99], can
    be very useful in this domain. Texts that focus on engineering aspects of color
    reproduction include [Hunt 95, Berns et al. 00]. The involvement of people from
    diverse domains, like biology, art, science and engineering, in the development
    of color models has been the boon and the curse resulting in color reproduction
    being a complex area to explore. Therefore, it is often useful to see color from
    an alternate perspective as in [Livingstone and Hubel 02].


    Much work was done in high dynamic range images in the late 1990s and early 2000s.
    This was stimulated by the initial work on capturing HDR image in [Debevec and
    Malik 97]. This led to a plethora of work in appropriate tone mapping operators
    to display such images on traditional displays [Tumblin and Turk 99, Larson et
    al. 97, Gallo et al. 09]. New HDR cameras were designed [Yasuma et al. 10]. Displays
    that can truly display such a high dynamic range were also designed [Seetzen et
    al. 04]. Today, such displays are becoming more mainstream and slowly emerging
    in the market. HDR imaging continues to be an active area of research even today
    [Gupta et al. 13]. A comprehensive reference for HDR imaging pipeline is Reinhard
    et al.’s recent book on this topic [Reinhard et al. 05]. Multi-spectral cameras
    [Yasuma et al. 10, Susanu 09, Shogenji et al. 04] and displays [Li et al. 15]
    have been explored before, but they have not made their way to the consumer devices
    yet. The only successful case is that of the RGBW projector that uses a clear
    filter in addition to red, green and blue filters only during the projection of
    grays to increase the brightness rating. However, this does not help in increasing
    the 2D color gamut since the white lies within the gamut created by R, G and B.


