    # 14.11 Conclusion


    In this chapter we introduced you to the most common ways to enhance realism in
    interactive computer graphics through rudimentary approximations of reality. Again,
    in this chapter concepts are explained in an API independent manner. We hope these
    fundamental concepts help the readers to code up using any suitable API. We should
    also acknowledge that enhancing realism does not come free – and almost all the
    time trades off with performance. For example, bump maps come at no cost with
    respect to increased geometry but require Phong illumination computation during
    rasterization and cannot show realism at the silhouettes. While a displacement
    map can alleviate this problem, it comes at the cost of lower rendering speed
    due to the significant increase in geometry. The challenge is to make the right
    choices that are suitable for specific applications.'
