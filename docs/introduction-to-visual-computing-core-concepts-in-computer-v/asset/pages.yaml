    the sculpture image) and the edge detection performed following that. As the kernel
    gets wider, finer edges disappear while the larger ones remain.


    # 5.1.2 Multi-Resolution Edge Detection


    Edges in an image can have different resolution, i.e. how sharp or smooth the
    edge is. Changes in intensity that occur over a larger space (i.e. smoother changes
    in the image intensity) form low-resolution edges, while intensity changes over
    a smaller space constitute low resolution edges. Perceptually, lower resolution
    edges are more important than the higher resolution ones in detecting objects,
    illumination and their interaction. However, a low resolution edge formed by a
    very gradual and slow ramp will be not be detected unless the image is low pass
    filtered to remove higher frequencies to enable resampling using a much smaller
    number of pixels where the same edge shows up as a step or a much sharper ramp
    and gets easily detected. This effect is shown in Figure 5.17. The image is low
    pass filtered with widening kernel indicating lower band of frequencies passed
    and the edge detection is applied on these low pass filtered images. This is what
    we call multi-resolution edge detection.


    Incidentally, when discussing different edge detectors, we have discussed the
    role of low pass filtering for noise removal. However, this is not the only motivation
    behind using low pass filtering or smoothing. Its greater use lies in multi-resolution
    edge detection where a pyramid of edge images is created where each level of the
    pyramid provided edges of a particular resolution. As the levels increase, the
    low pass filter kernel is increased in size to create progressively low pass images
    (as in a Gaussian pyramid). As the images get more and more blurry higher up in
    the pyramid, higher resolution edges (finer scale edges) disappear.'
  merge: -1
  img_proc: true
