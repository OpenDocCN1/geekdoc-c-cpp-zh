    # 14.5 Bump Mapping


    Bump mapping is a technique by which we can simulate the effects of small bumps
    on the surface of an object without changing the number of primitives, as shown
    in Figure 14.17. The two tori in this figure have the same number of triangles.
    But one looks much richer geometrically than the other due to the bumps. Note
    that both objects are also texture mapped with a blue and yellow texture. The
    bumps are simulated by perturbing the normal vectors in a predefined way so that
    the lighting changes in a manner that is consistent with the presence of the bump.
    This makes us perceive the bumps even if they are absent in the mesh.


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_348_1.png)


    Figure 14.17. The same object rendered without bump mapping (left) and with bump
    mapping (right).


    Let us consider a surface parametrized with two parameters (u, v). This is akin
    to what we did for texture mapping. Let us consider the point P(u, v) with normal
    N. Let Pu and Pv denote the tangents at P in u and v direction respectively. In
    bump mapping, we want to perturb the normals at the vertices based on a scalar
    bump function B(u, v). Consider B to be a gray scale image where white indicates
    the maximum bump and black the minimum. Therefore, we would like to move the point
    P(u, v) to P''(u, v) in the direction of its normal such that P''(u, v) = P(u,
    v) + B(u, v) N. (14.20)'
