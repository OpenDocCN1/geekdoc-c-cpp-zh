- pgno: 41
  md: 'and vertical direction can be found from their location. Let this be α and
    β respectively where 0 ≤ α, β ≤ 1. Therefore, the value of C at the pixel Q is
    given by linear interpolation in the horizontal direction as


    $$F(Q) = (1 - \alpha)C + \alpha D \tag{2.9}$$


    Similarly the value of F at R is given by


    $$F(R) = (1 - \alpha)A + \alpha B. \tag{2.10}$$


    Now, the value of C at P is found by interpolating between R and Q linearly in
    the vertical direction as


    $$\begin{aligned}F(P) &= F(Q)\beta + F(R)(1 - \beta) &&\tag{2.11}\\ &= \beta(1
    - \alpha)C + \beta\alpha D &&\tag{2.12}\\ &\quad + (1 - \beta)(1 - \alpha)A +
    (1 - \beta)\alpha B &&\tag{2.13}\\ &= \beta(1 - \alpha)F(i + 1, j) + \beta\alpha
    F(i + 1, j + 1) &&\tag{2.14}\\ &\quad + (1 - \beta)(1 - \alpha)F(i, j) + (1 -
    \beta)\alpha F(i, j + 1) &&\tag{2.15}\end{aligned}$$


    Now, consider the case where P happens to be on the straight line connecting A
    and D. In this case, P can be expressed as a linear combination of these two points.
    The distance AP is given by $\sqrt{\alpha^2 + \beta^2}$ and the distance PD is
    given by $\sqrt{(1 - \alpha)^2 + (1 - \beta)^2}$. Therefore,


    $$F(P) = \sqrt{\alpha^2 + \beta^2}\,D + \sqrt{(1 - \alpha)^2 + (1 - \beta)^2}\,A
    \tag{2.16}$$


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_41_0.png)


    Therefore, there are multiple ways to interpolate F at P, using either equation
    2.14 and 2.16 and many more can be found. For example, we may want to interpolate
    the point at the intersection of AD and BC using A, B and C followed by an interpolation
    of this point and A to get P. Each of these will result in different coefficients.
    This non-uniqueness of interpolation in an image data which is sampled uniformly
    in the same two directions, horizontal and vertical, is avoided by always interpolating
    along these two directions. You can verify that interpolating in the vertical
    direction first and then in the horizontal direction will yield the same result
    as Equation 2.14.


    Figure 2.4. This shows a mesh made of quadrilaterals.'
