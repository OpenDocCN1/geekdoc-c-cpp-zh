  md: '# Put a Face to the Name


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_147_0.png)


    Euclid is known as Father of Geometry. He was a Greek mathematician from Alexandria,
    Egypt who lived in 300 B.C. (yes! more than 2000 years back). He is best known
    for his work, Elements, where he collected the work of many mathematicians who
    preceded him. The whole new stream of geometry established by him is known as
    Euclidean Geometry. Basically the modern 2D geometry is actually adopted from
    Euclidean Geometry. Elements, a set of 13 books, is one of the most influential
    and successful textbooks ever written. Euclid proved that it is impossible to
    find the "largest prime number," because if you take the largest known prime number,
    add 1 to the product of all the primes up to and including it, you will get another
    prime number. Euclid''s proof for this theorem is generally accepted as one of
    the "classic" proofs because of its conciseness and clarity. Millions of prime
    numbers are known to exist, and more are being added by mathematicians and computer
    scientists even today.


    # 6.3 Euclidean and Affine Transformations


