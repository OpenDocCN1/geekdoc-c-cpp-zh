    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_227_1.png)


    Albert Henry Munsell was an American painter and teacher of art who was the first
    to attempt to create a numerical system to accurately describe color by designing
    the Munsell Color System that was the precursor and inspiration for the development
    of the first scientific color order system, CIE XYZ color space. As an artist,
    Munsell found color names "foolish" and "misleading" and therefore strived to
    create a system that has meaningful notation of color. In order the achieve this,
    he invented the first photometer and also a patented device called the spinning
    top that helped him measure colors and how colors change. Munsell color system
    created a necessary bridge between art and science providing enough structure
    to allow scientists to expand upon and use it, while being simple enough for artists
    with no scientific background to use it for selecting and comparing colors. Munsell’s
    System essentially created a way of communicating colors. He also coined the terms
    chrominance or chroma and lightness. Munsell also investigated the relationship
    between the color and the light source used for illumination to find that the
    light source used drastically effected the color perceived thereby leading him
    to eventually develop the standard for daylight viewing of colors for accurate
    color evaluation. Munsell lived from 1858 to 1918 and wrote three books, all of
    which considered the most fundamental readings in color science – A Color Notation
    (1905), Atlas of the Munsell Color System (1915) and one published posthumously,
    A Grammar of Color: Arrangements of Strathmore Papers in a Variety of Printed
    Color Combinations According to The Munsell Color System (1921). In 1971 he created
    the Munsell Color Company which is now called the Munsell Color Labs located in
    the Rochester Institute of Technology and is the premier research institution
    for color science.


