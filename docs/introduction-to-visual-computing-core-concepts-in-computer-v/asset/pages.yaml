    # 1.3.1 Geometric Data


    A geometric entity (e.g. lines, planes or surfaces) can be represented analytically.
    Alternatively, a discrete representation can also be used. Continuous representations
    can be implicit, explicit or parametric.


    An explicit representation is one where one dependent variable is expressed as
    a function of all the independent variables and constants. The explicit equation
    of a 2D line is


    $$y = m x + c$$


    where $m$ and $c$ are the slope and y-intercept of the line. Similarly, the explicit
    representation of a 2D quadratic curve can be


    $$y = a x^2 + b x + c$$


    where $a$, $b$ and $c$ are the coefficients of the quadratic function representing
    the curve. Another popular explicit function occuring in physics and signal processing
    is


    $$y = A \sin(\omega t + \phi).$$


    This represents a sine wave of amplitude $A$, frequency $\omega$ and phase $\phi$.
    Note that an explicit representation allows easy evaluation of the function at
    different values of the independent variables.


    However, more complex functions are sometimes not easy to represent using explicit
    form. Implicit representations consider a point $\mathbf{p}$ to be of interest
    if it satisfies an equation $F(\mathbf{p}) = c$, where $c$ is a constant. The
    implicit equation of a 2D line is


    $$a x + b y + c = 0,$$'
