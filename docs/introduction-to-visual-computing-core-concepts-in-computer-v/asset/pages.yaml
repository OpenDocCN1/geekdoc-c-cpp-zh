- pgno: 298
  md: '![](img/66c45bbed85bb7ba7f7b05dff49b5060_298_0.png)


    Figure 12.4. This figure shows several non-photorealistic rendering that can imitate
    painterly rendering or charcoal sketches, mechanical illustrations, and newsprint.


    of the mesh to send the geometry information and then send the connectivity information
    (refer to Chapter 1). However, if we can stream one triangle after another such
    that every triangle is adjacent to the previous one streamed, we will need to
    send three vertices for the first triangle and one vertex per triangle for every
    subsequent triangle, thereby reducing the amount of data to be sent by almost
    66%. Such a set of triangles is said to form a triangle strip. Therefore, a common
    kind of processing, called stripification, is to take a triangle mesh and represent
    it as multiple triangle strips (Figure 12.3).


    Unlike processing such as compression and strip generation that may change the
    object models, processes such as collision detection just use objects to generate
    other application specific results. A collision detection operation computes the
    locations of the moving objects and detect if any of the triangles in the object
    intersect with any triangle of another object thereby causing a collision. Processing
    can also be motivated via higher performance as in organizing the model in a special
    data structure, like octree or BSP trees, that would enable fast access and retrieval
    of objects using a spatial index. Such data structures are useful in ray-tracing,
    culling of objects that are outside the observer’s field of view, collision detection,
    etc.


    # 12.3 Rendering


    Rendering is the process of taking as input a 3D scene, a view set up and creating
    the 2D image of the 3D scene that will be seen from the particular viewpoint.'
