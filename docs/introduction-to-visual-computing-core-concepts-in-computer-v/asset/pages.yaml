  md: 'We can assume without loss of generality that one of these normalized cameras
    is aligned with the world coordinates while the other is translated by $T$ and
    rotated by $R$ with respect to it. Therefore, correspondences inside these two
    normalized cameras will be related by essential matrix as explained by equations
    in the previous section. However, since these are uncalibrated cameras, we do
    not know $R$ and $T$. But we can use a few normalized correspondences to estimate
    the essential matrix using the method to estimate fundamental matrix for uncalibrated
    cameras explained in Section 8.3.3.


    Now, since we know that this $E$ is related to $R$ and $T$ by Equations 8.46 and
    8.47, if we can recover $R$ and $T$ from the computed $E$, we can apply the appropriate
    transformation to the second normalized camera image plane to convert the configuration
    of the camera pair to that of the frontal eye where the two cameras only differ
    by a translation along the $X$ axis. This process is called *rectification*. The
    correspondences now lie on raster lines of the two images and are therefore significantly
    easier to locate.


