    # ### 4.3 Periodicity of Frequency Domain


    As explained in Figure 4.1, DFT consider the signal to be repeating itself periodically
    infinitely. However, we have not discussed yet, the consequence of such an assumption.
    A question may be hovering in your minds as to how does an infinitely periodic
    function have a finite DFT. In fact, it doesn’t! We will now discuss how this
    periodicity in spatial domain induces a periodicity in the frequency domain. Let
    us explore now how this periodicity looks.


    DFT decomposes a signal into cosine waves of different magnitude and phase. If
    we consider a frequency \(f\), we know from trigonometry that


    \[

    A\cos(f)=A\cos(-f)=A\cos(2\pi-f)=A\cos(n2\pi-f)

    \tag{4.17}

    \]


    where n is any integer. From this, you can see that if the value of the amplitude
    at \(f\) in the DFT magnitude response is \(A\), then the same value would repeat
    at \(-f\) and also at \(2\pi-f\) and so on. Therefore the amplitude repeats as


    \[

    M[f]=M[-f]

    \tag{4.18}

    \]


