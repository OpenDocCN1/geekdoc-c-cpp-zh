- pgno: 304
  md: 'Animation and special effects offer many applications of visual content synthesis.
    The animation industry strives to discover methods to render different styles
    and feelings to their characters, provide realistic body motions, provide realistic
    draping of clothes and dresses consistent with the animation movements etc. Special
    effects, on the other hand, strive to match the realism of the virtual world with
    that of the real world similar to augmented reality. For example, in a special
    effect scene with both virtual and real characters, the real lights should affect
    the virtual scene accurately and vice versa – a great challenge in the industry.


    Geometric modeling and processing has been the keystone for computer aided design
    and modeling (CAD, CAM) for a long time. With the advent of 3D printing, this
    domain of computer graphics is again coming back to the limelight via varied applications
    in the domain of 3D manufacturing. How do we print 3D objects with minimum material
    wastage? Can we design a geometric model this is printable, stable and functional
    and yet stackable? Can we design objects in pieces in such a manner so that their
    assembly instructions will have simpler or a reduced number of steps?


    Designing novel graphics hardware is also a very vibrant area related to computer
    graphics. Until the mid-1990s, interactive graphics rendering was only possible
    on super-expensive mammoth machines (e.g. SGI Onyx, SGI infinite reality) which
    used to be hosted in large rooms under very controlled environment. Even then,
    rendering a few million triangles at 30fps was a major achievement. Radical changes
    in the graphics architecture borrowing heavily from parallel processing architectures
    has resulted in todays inexpensive graphics processing units or GPUs which can
    be put in any laptop or desktop and can perform a few orders of magnitude better
    than the mammoth machines of yesteryear. GPUs today are so powerful that they
    are being used as resources for even general purpose computing and scientific
    computing. Therefore GPU design and programming is also a very attractive domain
    of computer graphics.


    # Fun Facts


    *Toy Story* was a big milestone for computer graphics being the first ever feature
    length computer animated movie. It was produced by Pixar Animation Studios and
    released by Walt Disney Pictures. Pixar was approached by Disney to make toy story
    following their success of the short film ‘Tin Toy’ in 1988. Pixar used to make
    such short films from time to time to promote their computers. They started as
    part of the graphics group in the computer division of Lucasfilm in 1979. They
    spun out a corporation in 1986 when they were funded by Steve Jobs. Though produced
    under some financial constraints, *Toy Story* was the top grossing film on its
    opening weekend and'
