  md: '# Spectral Analysis


    In this chapter we will learn a new way of decomposing a signal into simpler signals,
    each of which is a sinusoid. Studying the nature of each of these sinusoids and
    their relationship with each other can give us important insights about the signal
    and help us alleviate problems during common filtering techniques. This kind of
    analysis of a signal is often called *spectral analysis* – since it decomposes
    a complex signal into a bunch of signals that span a spectrum of frequencies,
    phases and orientations. Such a study will also provide us a way to synthesize
    signals and we will study some of that as well.


    In this chapter, we will focus on the most fundamental and popular technique for
    spectral analysis — the discrete Fourier transform or DFT. However, it is important
    to be aware that several different ways exist for such spectral analysis. They
    mostly differ in the kind of simpler signals (or basis functions) that are used
    to decompose the complex signal into. Radial basis functions or wavelets can be
    used to provide a different kind of spectral analysis using data dependent basis
    functions. However, DFT provides one of the most popular tool for spectral analysis
    of visual signals using data independent or standard basis functions. We will
    first study DFT for 1D signals. Usually this provides us key insights which are
    applicable to higher dimensional data. Later in the chapter we will study its
    interpretation for 2D data like images.


    # 4.1 Discrete Fourier Transform


    Discrete Fourier Transform or DFT is a technique that takes as input a periodic
    signal of infinite length and decomposes it into a set of sine and cosine waves
    which when combined (via a process called inverse DFT) would provide the periodic
    signal itself. As soon as we define DFT likewise, the first question that comes
    to mind maybe how we would use DFT on digital signals? Digital signals are hardly
    periodic and never infinite. In order to make a digital signal periodic and infinite,
    we assume that the span of the signal is its period and the signal span is repeated
    infinite number of times. For example, if we have an audio signal with 100 samples,
    we will consider a periodic signal where each period'
