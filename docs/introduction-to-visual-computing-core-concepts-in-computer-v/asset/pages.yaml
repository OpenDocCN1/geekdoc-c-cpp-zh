- pgno: 377
  md: '# 15.2 Development of Graphics APIs and Libraries


    Computer graphics has become very popular, especially in the video games and simulation
    community. Therefore, there are several specialized API to ease programming of
    different stages of the graphics pipeline and application requirements. These
    APIs provide a way to access the hardware in an abstract manner while taking advantage
    of the special hardware capabilities of a specific graphics card. However, since
    even a few years back a fixed pipeline was in vogue, several APIs, especially
    those which evolved in the age of the fixed graphics pipeline, have evolved to
    adapt to the programmable pipeline.


    OpenGL is one of the oldest cross-language cross-platform interfaces for 3D graphics
    rendering providing a way to interact with GPUs. GLUT is the OpenGL Utility toolkit
    for writing OpenGL programs independent of the window system used for rendering
    the scene. It implements a simple windowing API for OpenGL making it much easier
    to learn OpenGL. GLUT also provides a portable API across multiple OS and PCs.
    OpenGL is defined as a set of functions which can be called by the client program.
    The functions are similar superficially to C, but are language independent. OpenGL’s
    popularity is primarily due to its quality of official documentation which are
    known by the colors of their covers (the red, orange, green and blue books are
    the first to fourth edition of the OpenGL Programming Guide). Often accompanying
    libraries like GLU, GLEE or GLEW bind with OpenGL to support useful features that
    may not be supported in contemporary hardware like mipmapping or tessellation.
    OpenGL Shading language (GLSL) is a high level shading language based on the syntax
    of C, first designed to allow OpenGL to access the programmable GPUs with using
    assembly level or hardware specific languages. OpenGL ES is an extension of OpenGL
    API for programming for embedded devices. WebGL is a Javascript API for rendering
    3D graphics. Direct3D is a similar API offered by Microsoft which promises better
    performance on Windows OS while Metal is an API that debuted for Apple’s iOS8.


    Vulkan is a more recent cross-platform API. It was initially referred to as a
    “next generation openGL initiative”. It was build upon AMD’s API called Mantle.
    In addition to optimizing performance on GPUs like OpenGL, Vulkan is also optimized
    to reduce CPU use and distribute whatever is needed from the CPU across multiple
    cores. It works for both high end-graphics cards and mobile devices. Unlike OpenGL,
    it provides a unified management of compute kernels and graphics shaders removing
    the need to use a shader API in conjunction with a graphics API.


    The modern GPU offers tremendous potential to solve largely parallelizable general
    purpose problems using the GPU. However, this means that the programmer must know
    the graphics API and GPU hardware well to map general purpose problems onto the
    vertex, textures and shader programs. To alleviate this problem, nVidia has developed
    CUDA, a programming language that offers'
  merge: -1
  img_proc: true
- pgno: 378
  md: 'a parallel computing platform and API for programmers to use a CUDA enabled
    nVidia GPU for general purpose computing. CUDA gives direct access to GPU’s instruction
    set and parallel computing elements to general purpose programmers.


    # Fun Facts


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_378_0.png)


    Today’s generation won’t know much about SGI (Silicon Graphics Inc), the company
    which pioneered graphics workstations in the early days of computer graphics and
    to whom we owe much of the advancement of the graphics hardware. SGI introduced
    the concept of the geometry engine resulting in the first very large scale integration
    (VLSI) of the graphics pipeline with specialized hardware to accelerate the geometric
    computations needed to display three dimensional imagery. SGI was founded by yet
    another father figure of computer graphics who also got his PhD from the University
    of Utah, Jim Clark (top left). Jim Clark was born in Texas and had a difficult
    childhood and dropped out of high school after being suspended. However, his life
    turned with his 4 year tenure in the Navy where he was introduced to electronics
    and fell in love with it. He worked hard with night courses at Tulane University
    which opened up the doors of the University of New Orleans for a B.S. and M.S.
    in physics. After his PhD from University of Utah in 1974 Jim Clark was a faculty
    member at UC-Santa Cruz before moving to Stanford University in 1979. Jim Clark
    founded SGI in 1982 with seven of his graduate students, one of whom, Kurt Akeley,
    played a major role in recent years in bringing the light field camera, Lytro,
    to the market. SGI spearheaded the development of several graphics workstations
    including the indigo, prism, onyx, crimson and finally the high performance computing
    multi-core room-size machine called infinite reality engine (from top right in
    counter clockwise order). SGI’s core market was impacted adversely by the advent
    of the consumer graphics card (e.g. nVidia, ATI) and the company moved its thrust
    area to high performance computing in 1999.'
  merge: -1
  img_proc: true
- pgno: 379
  md: '# 15.3 The Modern GPU and CUDA


    Modern GPUs are no longer tied to their graphics ancestry but have proven themselves
    to be the most successful desktop supercomputing architecture for general purpose
    computing. Once thought to be for video games, today’s GPUs find their place in
    solving varied problems in varied areas from astrophysics and arts to seismology
    and surgery [Luebke 09]. In this chapter we will describe the modern GPU architecture
    in brief. More details are available in [Azad 16]. We specifically focus on nVidia’s
    GPU architecture and CUDA programming language.


    # 15.3.1 GPU Architecture


    The CUDA programming model is a parallel programming model that provides an abstract
    view of how the processes can be run on underlying GPU architectures. The evolution
    of GPU architecture and the CUDA programming language have been quite parallel
    and interdependent. While the CUDA programming model has stabilized over time,
    the architecture is still evolving in its capabilities and functionality. GPU
    architecture has also grown in terms of number of transistors, and number of computing
    units over years, while yet supporting the CUDA programming model. The CUDA programming
    model has been used to implement many other algorithms and applications other
    than graphics and this explosion of use and permeability of CUDA in hitherto unknown
    applications has catapulted the GPU’s near ubiquitous use in many domains of science
    and technology. Since then all the GPUs designed are CUDA capable. It should be
    noted that before CUDA was released, there were attempts to create high level
    languges and template libraries such as Glift [Lefebhn et al. 06] and Scout [McCormick
    et al. 07]. But such efforts tapered down with the introduction of CUDA, and more
    effort was spent on refining CUDA and building libraries using its constructs.


    One of the conceptual differences between CPU and GPU is that CPU is defined for
    minimum latency so that context switch time is minimum, while GPU is primarily
    designed for maximum throughput through fine grain pipelining (and hence more
    latency than CPU). In other words, in the CPU design, there is plenty of cache
    memory and control logic that would reduce the time taken to bring the data to
    the ALU and thus reduce the wait and latency. On the other hand, GPU has a lot
    of ALUs and may wait for the data to be fetched from external DRAM to its local
    cache. The fundamental optimization of GPU programming hence focusses on hiding
    this latency by providing enough work for the ALUs while the data is fetched from
    DRAM.


    The two main components of the GPU board that go into the PCI express bus in the
    PC are the global memory (around 12 GB currently) and the actual streaming multiprocessor
    chip along with associated circuitry. The basic GPU'
  merge: -1
  img_proc: true
- pgno: 380
  md: 'processing flow consists of three steps: (1) moving data from the host’s (main
    CPU, memory, etc.) main memory to the device’s (GPU board) global memory, (2)
    the CPU issuing instructions to the GPU while the data for this computation is
    taken from the GPU’s global memory and the results are put back in that global
    memory, and finally (3) the results transferring from the GPU’s global memory
    back to the host’s main memory through the PCI express bus.


    In latest GPU architectures starting from Kepler, it is possible to communicate
    between multiple GPUs directly from one GPU’s global memory to another’s through
    MPI calls, without going through the intermediate host’s memory. Further, not
    all jobs that the GPU is doing need to be instructed by the CPU – the GPUs can
    launch their own jobs. The latter feature is also called CUDA dynamic parallelism
    and can be useful in several ways: It would reduce the communication required
    between GPU and CPU through the slow PCI bus; it can be used to program recursive
    parallel algorithms and dynamic load balancing; features like adaptive hierarchical
    spatial subdivision and computational fluid dynamic grid simulation can effectively
    be done for efficient and accurate simulation. Conceptually, dynamic parallelism
    moves the GPU from being a co-processor to an autonomous, dynamic parallel processor.


    Each multiprocessing chip has many processors. Each processor can handle thousands
    of threads of processes. Each basic hardware unit that handles one thread is called
    a core, also called a CUDA core. For example, the Kepler streaming multiprocessor
    chip has 15 processors, and each processor can manage 2048 threads – it has 2048
    CUDA cores. Each of these 15 processors have plenty of registers (over 64K 32-bit
    registers) and also shared memory (around 48KB) that are accessible to all the
    threads running in a processor. The threads running in the same processor can
    cooperate and share data using the registers and shared memory.


    # 15.3.2 CUDA Programming Model


    CUDA is basically an extension of C++. The goal of CUDA design is to let the programmer
    focus on parallel algorithms rather than the underlying multiprocessor architecture.
    It is both a programming model as well as a memory model. A typical CUDA application
    has a mixture of serial code and parallel code. The serial segments of the code
    run on the host (CPU) while the parallel code, also called kernels, run on the
    device (GPU) across multiple processing elements. While the parallel code is run
    on the GPU, the serial code can continue to work on the CPU.


    A kernel is a piece of code for one thread. Many instances of the kernel are executed
    in parallel with potentially different data for each thread under the Single Instruction
    Multiple Data (SIMD) model. All the threads that run in the same processor are
    grouped together and are called a block. Each block is run on different processor
    in the multiprocessor chip, and potentially at different'
  merge: -1
  img_proc: true
- pgno: 381
  md: 'times. A group of these blocks is called a grid. In other words, a grid consists
    of all the instances of the kernel partitioned as thread blocks. The hardware
    takes care of scheduling these thread blocks on each of the cores in the processor
    and there is no cost associated with switching between threads. When the number
    of blocks exceed the number of available processors, multiple thread blocks may
    be scheduled to the same streaming processor and in any arbitrary order. Hence
    there is no simple way to communicate between threads in different blocks as they
    may be separated both in space (different processors) and time. The goal of efficient
    CUDA code is to make sure that the task is partitioned into sufficiently fine
    grained threads such that the latency of data transfer from the DRAM to the multiprocessor
    chip is well hidden through overlap of computation tasks of the threads.


    Each block has a unique id, and each thread within a block also has a unique id.
    They are referred using the built-in variables threadIdx and blockIdx. These ids
    can be one, two or three dimensional entities. The number of threads within a
    block can be read back from the variable blockDim and the number of blocks in
    a grid is stored in the variable gridDim. The linear id of a thread among all
    the threads spawned by the kernel is given by blockDim.x * blockIdx.x + threadIdx.x.
    The .x refers to the first dimension of the three dimensions assuming that the
    other two dimensions have values 1 each, thus representing just a linear array
    of one dimensional threads. (Note that the maximum number of block index value
    is 64K. So if you need more than 64K blocks, you may need to fold that vector
    into two dimensional array of blocks in which the index of each dimension can
    go upto 64K.) The 3D representation of block and thread indices is just to give
    flexibility in representation that might implicitly align with the problem description.
    For example, a kernel operating on each element of a dense matrix might need to
    refer to each thread using a 2D index. Linearization of the index of a thread
    in a 2D array of threads is done as follows:


    ```

    int iy = blockDim.y*blockIdx.y + threadIdx.y;

    int ix = blockDim.x*blockIdx.x + threadIdx.x;

    int idx = iy*w + ix;

    ```


    Kepler architecture can keep track of 2048 threads or 64 warps (number of threads
    that can run in lock-step at the same time in a processor), or 16 blocks per stream
    processor. In other words, each block should have at least 128 threads to keep
    the GPU compute-busy. It is good to have a number of threads per block that is
    a multiple of 32 since that is the warp size. For each device there are 14 stream
    processors. So we need to have at least 224 blocks to keep the GPU busy, and typically
    will have 1000 or more blocks in a grid. This will also make the code future GPU
    ready.'
  merge: -1
  img_proc: true
