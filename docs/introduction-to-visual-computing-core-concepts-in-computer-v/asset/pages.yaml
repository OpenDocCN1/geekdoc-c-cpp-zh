    # Fun Facts


    The largest non-digital photographs in the world are made by stitching smaller
    images together. The largest single non-digital photograph captured in the world
    is of a control tower and runways at the US Marine Corps Air Station in El Toro,
    Orange County, California. It measures 32 feet high and 11 feet wide. It was taken
