  md: 'combination of D and S given by


    ```

    D'' = f_s(s_a, d_a) S + f_d(s_a, d_a) D

    ```


    where f_s and f_d provide fractional values between 0 and 1. Note that the above
    equation is general and can be used to achieve a large variety of effects by different
    choices of f_s and f_d. For the particular case of transparency or translucency,
    the functions we use are


    ```

    D'' = s_a S + (1 - s_a) D.

    ```


    Therefore, if the pixel being rendered is transparent, s_a = 0 achieving D'' =
    D, i.e. the destination pixel will not change color at all since the source pixel
    is transparent. If the source pixel is opaque, as we have been assuming so long,
    then s_a = 1. Therefore, D'' = S. i.e. the destination pixel gets overwritten
    by the color of the source pixel. If s_a is any other fraction between 0 and 1,
    we would get a combination of the source and destination colors to create the
    effect of translucency. Figure 14.7 shows the concept. Assume the egg to be the
    source and chicken to be the destination. The images from left to right are achieved
    with the above functions for transparency using s_a = 0, 0.5 and 1 respectively.
    It should also be noted that the order in which the translucent objects are drawn
    also determines the final color. Let O1 and O2 be two objects with alpha values
    s1 and s2 respectively. Let B be the background color to start with. If O1 is
    drawn first and then O2, then the final color will be O2 s2 + (1 - s2)(O1 s1 +
    (1 - s1) B). If the order is reversed, then the final color using the same blending
    function will be O1 s1 + (1 - s1)(O2 s2 + (1 - s2) B). Obviously, these two might
    result in different colors.


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_354_0.png)


    Figure 14.24. This figure shows the effect of alpha channel blending. Left: Chicken=1,
    Egg=0; Middle: Chicken = Egg = 0.5; Right: Chicken=0, Egg=1.


