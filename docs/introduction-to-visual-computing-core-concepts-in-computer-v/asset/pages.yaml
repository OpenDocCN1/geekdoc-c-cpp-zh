- pgno: 143
  md: '# Geometric Transformations


    Geometric transformation, in general, means transforming a geometric entity (e.g.
    point, line, object) to another. This can happen in any dimension. For example,
    a 2D image can be transformed to another by translating it or scaling it or applying
    a unique transformation to each of its pixels. Or, a 3D object like a cube can
    be transformed into a parallelepiped or sphere. All of these will be considered
    as geometric transformations. Often a 2D image transformation is also called an
    image warp.


    # 6.1 Homogeneous Coordinates


    Before we start with geometric transformations, we will first introduce a very
    important concept of homogeneous coordinates. Let us consider the very simple
    case of the 1D world (see the red line in Figure 6.1left). Let us consider a point
    P'' on this line. The coordinate of this point will be one dimensional. Let it
    be (p). Now consider a higher dimensional 2D world in which this line is embedded
    at y = 1. Draw a ray from the origin of this world through the point P''. Consider


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_143_0.png)


    Figure 6.1. Homogeneous coordinates in 1D (left) and in 2D (right).'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'a point P(x, y) on this line. Now, find out what would be the coordinate of
    P'' in the 1D world of the red line when expressed using x and y. Using similar
    triangles you can see that p = x/y. Further, any point on this ray from the origin
    can be expressed as (kx, ky) where k ≠ 0, and the value of p is invariant to the
    location of P on this ray.


    Therefore, a point in the 1D world, such as P'', when embedded in 2D, can be thought
    of as the projection of all points on a ray in the 2D world and the 2D coordinate
    of the projection is given by (x/y, 1). Thus, any point in 1D can be considered
    as the projection of a ray in the 2D world on to a specific 1D world, in this
    case, the world of y = 1. This is called the (n+1)D homogeneous coordinate of
    a n dimensional point. Therefore, (x/y, 1) is the 2D homogeneous coordinate of
    the 1D point P''. Also, (k x/y, k) refers to the same ray but the projection is
    now on the y = k plane. Since, they refer to the same ray, these two homogeneous
    coordinates are considered equivalent.


    Let us now extend this concept to the next dimension using the right figure of
    Figure 6.1). Consider the 2D world of the red plane and consider the point P''
    on this plane. This point can be considered to be the projection of a ray from
    the origin through P'' in the 3D world. Therefore, we will have a 3D homogeneous
    coordinate for the 2D point P''.


    Extending this idea to the 3D world, it is evident that we will get 4D homogeneous
    coordinates for 3D points. In homogeneous coordinate representation, the last
    coordinate denotes the lower dimensional hyperplane in which the point resides
    and therefore need not be 1. However, when we deal with objects, it is important
    for us to consider them residing in the same hyperplane. The easiest way to achieve
    this is by normalizing the homogeneous coordinates i.e. when considering the 4D
    homogeneous coordinate (x, y, z, w) where w ≠ 1, we convert it to (x/w, y/w, z/w,
    1).


    Though at this point it may seem strange to look at points as rays in a higher
    dimension space, it is not as ad-hoc as it may seem. Intuitively, it stems from
    considerations in computer vision, which is the science of recovering 3D scene
    from 2D images. In our visual system, the 3D scene is projected as an image on
    the retina of the eye. Our brain identifies each point of the image in the retina
    as a ray into the 3D world. From only one eye and its retinal image, we cannot
    recover any information beyond the ray - i.e. we can only tell which ray contains
    the point but not where on the ray the point lies. In other words, we cannot decipher
    the depth of the point. But, when two eyes see the same point in 3D, we get two
    different rays from the two image projections on the retinas. Intersection of
    these two rays gives the exact position (depth) of the point in 3D. This is called
    stereo vision. Hopefully this will convince you of the importance of rays in computer
    vision and visual perception to motivate this ray representation.


    There are several other practical advantages of this representation. In this'
