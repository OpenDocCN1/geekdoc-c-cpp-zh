- pgno: 373
  md: '# # Graphics Programming


    Graphics programming requires navigating through several APIs and libraries while
    using specialized graphics hardware. We first present the history and development
    of the modern graphics processing unit (GPU) that provides a perspective on its
    existing form and functionalities in the context of the different interactive
    techniques discussed in the previous chapters. Next, the fundamental aspects of
    the modern graphics hardware and existing APIs and libraries that facilitate programming
    it for both graphics and general purpose computation is presented.


    # 15.1 Development of Graphics Processing Unit


    The graphics processing unit (GPU) is a specialized hardware unit designed to
    off-load and accelerate 2D or 3D processing from the central processing unit (CPU)
    to assure interactive performance. Today, almost all desktops, laptops and mobile
    devices come equipped with some kind of GPU. GPUs have undergone revolutionary
    transformations in recent years and it is important to know how the GPU aids in
    the computations of the effects we render in the interactive graphics pipeline.


    Graphics hardware first came to use in 1980s, though they were called GPUs much
    later. GPU is a term introduced by nVidia in 1999. However, we will refer to such
    hardware as GPU in the rest of this chapter for the sake of consistency. The early
    GPUs were essentially integrated framebuffers that could achieve line rasterizations,
    also termed as wireframe rasterizations, thereby off-loading to the GPU, the rendering
    of the edges of the polygonal primitives. The first hardware dedicated to the
    graphics pipeline was the IBM professional graphics controller (PGA) that used
    a microprocessor hardware to off-load the simple tasks of rendering, like drawing
    and coloring filled polygons, from the CPU opening up CPU cycles for other general
    purpose processing while the graphics processing was done in parallel on the PGA
    card. A separate PGA card onboard marked an important step in the evolution of
    a separate GPU. By 1987 more features were added to the GPUs including shaded
    solids, vertex lighting, rasterization of filled polygons, depth buffer, and alpha
    blending. However, there was still a huge reliance on the CPUs where most of the
    computations used to happen and'
  merge: -1
  img_proc: true
- pgno: 374
  md: 'the data transfer from the CPU to the GPU was a major bottleneck.


    | Pipeline Functions | 1996 | 1997 | 1999 |

    |---|---|---|---|

    | Application specific tasks (Moving objects, setting up camera, object level
    culling) | CPU | CPU | CPU |

    | Transformation | CPU | CPU | GPU |

    | Lighting | CPU | CPU | GPU |

    | Clipping | CPU | GPU | GPU |

    | Rasterization | GPU | GPU | GPU |


    The GPU evolution got a boost from the release of the graphics industry’s most
    widely used application programming interface (API) of SGI-GL by SGI (Silicon
    Graphics Inc.) in 1989, which later gained popularity as OpenGL. In 1993, SGI
    released its first graphics cards for workstations while the first 3D consumer
    graphics hardware was offered by companies like Matrox, nVidia, 3DFX and ATI.
    However, the distinction between GPU and CPU was not that clear in this hardware.
    While much of the later stages of the graphics pipeline were instrumented in the
    GPU hardware, there was still a significant reliance on the CPU, especially for
    the first part of the pipeline involving transformations.


    Figure 15.1. Evolution of early graphics pipeline leading to a fixed function
    pipeline in 1999.


    Games like Quake and Doom drove the fast adoption of the graphics cards in the
    gaming industry.


    The first graphics processing unit close to its current form was introduced in
    1996 by 3DFX and was called the Voodoo card. The CPU still did the vertex transformation
    and lighting while Voodoo provided shading, texture mapping, z-buffering and rasterization.
    It was still not possible to evaluate the lighting model at every pixel and therefore
    effects of Phong shading or bump mapping were still not possible at interactive
    rates. In 1999, the first present-day GPU hardware became a reality via the introduction
    of nVidia’s Geforce 256 and ATI’s Radeon 7500 (Figure 15.1) where the vertex transformation
    and lighting computations were also moved to the GPU. Four parallel pipelines
    aided faster rendering with new features of multi-texturing and bump-mapping.
    A faster communication channel between CPU and GPU allowed even higher performance.
    However, this hardware still followed a fixed function pipeline since once the
    data was sent to the GPU pipeline, it could not be modified. Fixed functions were
    achieved via feature sets defined by APIs like OpenGL and DirectX. Therefore,
    if newer features were added to the graphics API, the fixed function hardware
    could not take advantage of them. Figure 15.2 shows the different stages of such
    a fixed pipeline. The vertex control receives the triangle data from the CPU.
    The VS/T & L (Vertex Shader/Texture and Lighting) stage transforms the vertices
    and assigns attributes to each vertex (e.g. color, texture coordinates, tangents).
    Lighting computation can also take place in the VS/T & L stage to assign colors
    to the vertices. Clipping and interpolation of attributes at the clipped vertices
    occur in the next stage. Following this, rasterization happens to mark pixels
    covered by the clipped triangles. The shader achieves the interpolation of attributes
    (e.g. texture coordinates, colors, normals) for every pixel touched by the traingle.'
  merge: -1
  img_proc: true
- pgno: 375
  md: '![](img/66c45bbed85bb7ba7f7b05dff49b5060_375_0.png)


    # Figure 15.2. A fixed graphics hardware pipeline.


    Finally, the raster operations are performed to blend colors for anti-aliasing
    or translucency effects. Depth buffer tests are performed to resolve occlusion.
    The frame buffer interface manages the reads and writes out of the framebuffer.


    In 2001, we saw the advent of the first programmable graphics pipeline via ATI
    Radeon 8500 and Microsoft X-box, where unlike ever before, parts of the GPU could
    be programmed. Instead of sending all the data to the GPU and simply letting it
    flow through the fixed pipeline, programmers could now send this data along with
    vertex programs (commonly called shaders) that would be operating on the data
    while it was passing through the GPU. These shaders were small kernels written
    in assembly-like specific shader language giving a limited amount of programmability
    in the vertex processing stage of the pipeline. The programmable graphics pipeline
    was followed by the advent of the first fully programmable GPU in 2002 via nVidia
    GeForce FX and Radeon 9700. These graphics card allowed for per-pixel operations
    with dedicated hardware for programming both the vertex and the pixel(fragment)
    shaders. By 2003, full floating point support and advanced texture processing
    started to appear in the cards enabling the first wave of applications that started
    using GPUs for non-graphics computing as well.


    By 2006, the graphics hardware started to capitalize on the tremendous data independence
    provided by the graphics pipeline. The goal was to push the flexibility to the
    shader programs. Early high level shader languages started to appear to provide
    easier programming interface. The GeForce 6 was the first GPU that streamlined
    the data independence to create a pipeline that has multiple parallel multi-core
    stages with fixed stages in between. The first parallel stage is that of a vertex
    shader that reads a vertex position and computes its position on the framebuffer.
    Multiple threads process different vertices independently. A fragment shader processed
    the floating point RGBA color contributing to every pixel. Similarly, multiple
    threads process different pixels independently as well.'
  merge: -1
  img_proc: true
- pgno: 376
  md: '![](img/66c45bbed85bb7ba7f7b05dff49b5060_376_0.png)


    Figure 15.3. This shows the programmable GPU via the abstraction of the GeForce
    6 card (a) and GeForce 8 card (b).


    In between these two parallel stages is the fixed stage of clipping, and rasterization.
    Similarly, the operations of blending and processing the depth buffer can also
    be performed in parallel in units called raster operations processors (ROP). In
    between the parallel fragment shaders and the ROP processors, there is a fixed
    operation that assembles the fragments from the different threads together. Therefore,
    such alternating parallel and fixed stages turn the GPUs into massively parallel
    and programmable processors. Figure 15.3 shows an abstraction of such a pipeline
    in nVidia GeForce 6. Note that the vertex shader has 6 threads, the pixel shaders
    have 4 threads and the ROP opertaions have 16 threads in this case. Also, the
    partitioning of the framebuffer memory allows much higher resolution graphics
    without reducing the frame-rate. Therefore, from this time GPUs have been viewed
    as a powerful programmable floating point computational and storage unit that
    can be exploited for compute intensive applications that need not have anything
    to do with graphics.


    At this stage, the graphics hardware still had specialized shaders for vertices,
    pixels and ROP operations. The GeForce 8 changed that by unifying the shaders
    and making them into a fully programmable unified processors which are called
    streamlined processors or SP (Figure 15.3). With this change, the graphics pipeline
    model became a purely software abstraction. To harness the GPU power, new programming
    languages were devised. CUDA is such a language provided by nVidia for nVidia
    cards. Similarly, there is ATI Stream for ATI cards and DirectX 10 for either
    cards.'
  merge: -1
