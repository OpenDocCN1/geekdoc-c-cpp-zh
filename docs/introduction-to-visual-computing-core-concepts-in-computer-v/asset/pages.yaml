  md: '# Convolution


    # 3.1 Linear Systems


    A *system* is defined as a method that modifies a signal. An audio amplifier that
    modifies the 1D audio signal to make it louder, or an image processing method
    that modifies the 2D image signal to detect some features are a few examples of
    a system. Systems can be very complex. But we will be mostly dealing with a specific
    class of systems that are simpler, namely *linear systems*.


    Linear systems satisfy some conducive properties of linearity. We will denote
    the system by S, input to the systems by x and output by y and z. For the sake
    of simplicity of explanation, we assume 1D signals which depend on the single
    parameter t. However, the following properties hold for a linear signal in any
    dimension.


    +   1. *Homogeneity:* If the input to a linear system is scaled, the output would
    also be scaled by the same factor.


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_51_0.png)


    +   2. *Additivity:* The independent responses (output) of multiple different
    input signals are added when the inputs are added. This implies that each signal
    is passed through the system independently without interacting with others.


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_51_1.png)


    +   3. *Shift Invariance:* Finally, the output of a shifted input is also shifted.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '![](img/66c45bbed85bb7ba7f7b05dff49b5060_52_0.png)


    When that data passes through multiple systems, the properties of linearity assures
    the following.


    +   1. **Commutative:** If two linear systems are applied to a signal in a cascaded
    manner (i.e. in series), the order of their application does not matter. Given
    two linear systems \(S_A\) and \(S_B\), applying \(S_A\) followed by \(S_B\) produces
    the same output as applying \(S_B\) followed by \(S_A\).


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_52_1.png)


    +   2. **Superposition:** If each input generates multiple outputs in a linear
    system, the addition of the inputs will generate an additions of the outputs.


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_52_2.png)


    This superposition property is especially important for finding the response of
    a complex signal when passing through a linear system. A complex input signal
