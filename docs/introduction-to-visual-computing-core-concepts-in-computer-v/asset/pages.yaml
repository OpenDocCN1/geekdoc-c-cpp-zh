  md: 'However, the mapping function used to map i_k to j_k in histogram stretching
    is spatially invariant across the image. Therefore, this method is called global
    histogram stretching. Histogram stretching is often also called histogram equalization.


    Applying the same mapping at every pixel, as is done in global histogram stretching,
    inherently assumes that the contrast is similar across the entire image. Therefore
    when the image has spatially varying contrast, global histogram stretching leads
    to an artifact of burn and dodge. In other words, some parts of the image get
    over-exposed while other parts are under-exposed. This is illustrated in Figure
    11.6. To avoid this artifact, a variant of the global method, called adaptive
    histogram stretching, is used.


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_270_0.png)


    Figure 11.5. This figure shows contrast enhancement of the image on the left using
    global histogram stretching to produce the image on the right. The bottom row
    shows the corresponding histograms of these two images.


    Let us consider an image whose contrast is varying spatially. In such cases, a
    global histogram stretching technique should be applied in a local P × P neighborhood
    window around a particular pixel (u, v) to compute the mapping of the input value
    at (u, v). Applying this technique at every pixel results in adaptive histogram
    stretching where the mapping at every pixel is different and is guided by the
    local contrast given by the local histogram in its P × P neighborhood. However,
    in this case, the same value i_k will get mapped to different values at different
    pixel locations in the image based on the local contrast. Therefore, even if the
    original image had only u − d + 1 gray values in the range d to u, they could
    be mapped to more than u − d + 1 gray values after adaptive histogram stretching.
    Therefore, the histogram of the enhanced image will not be sparse as in global
    histogram stretching.


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_270_1.png)


    Figure 11.6. This left image is one with spatially varying contrast – note that
    the top right part of the image has much better contrast than the rest of it while
    the left bottom part has much worse contrast than the rest of the image. The right
    image shows the result after global histogram equalization which shows that the
    former region is now over-exposed while the latter is under-exposed.


    As is evident, the quality of the result from this adaptive histogram stretching
    will depend on the value of P. This is illustrated in Figure 11.7. If P is too
    small,'
