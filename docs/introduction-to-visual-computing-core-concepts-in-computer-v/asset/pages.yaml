- pgno: 217
  md: '# Light


    In this chapter we will discuss the science of light, more commonly termed as
    radiometry. We will discuss different radiometric quantities and how they are
    used in the domain of visual computing. Then we will see how radiometry leads
    to photometry which is the science of light in the context of the human visual
    system and hence human perception.


    # 9.1 Radiometry


    In radiometry light is considered to be a traveling form of energy and therefore
    the unit used to describe it is the SI unit of energy, joule (J). This energy
    is associated with a source of origin, which is usually defined by its position,
    a direction of propagation and a wavelength λ. This conforms to the particle theory
    of light where the smallest unit of light is considered to be a photon or a quantum
    of energy. This also conforms to the wave theory of light, which assumes light
    to be a waveform traveling in a particular direction. λ is expressed by units
    of nanometers (nm). Light travels with a speed cₙ in a medium of refractive index
    n. An invariant in this context is the frequency f of light is given by


    f = cₙ / λ

    (9.1)


    which does not change unlike cₙ and λ. Another invariant is the energy carried
    by a photon,


    q = h c / λ

    (9.2)


    where h = 6.63 × 10⁻³⁴ J is the Planck’s constant.


    The spectral energy is a density function that gives the density of the quantum
    energy at an infinitesimal interval of wavelengths around λ with a width of Δλ.
    Note that due to the particle nature of light, spectral energy at a wavelength
    is a quantum value (either 0 or non-zero), but its density in an interval of wavelengths
    can be defined in a non-quantum fashion. This is similar to population where population
    at any point in space is either existent or non-existent, but the density'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'of population over an area is always a non-quantum quantity. Just like population
    density, it is better to view the spectral energy which is a continuum and does
    not become granular even when the area is small. Therefore, spectral energy ΔQ
    is defined as


    ```

    ΔQ = Δq / Δλ

    ```


    and has the unit of J(nm)⁻¹.


    However, we are more interested in spectral power that is defined as the spectral
    energy over infinitesimal time Δt. It is given by ΔQ/Δt and has the unit of W(nm)⁻¹.
    Imagine a camera that leaves its shutter open for Δt time and has a filter of
    Δλ. Such a sensor would measure the spectral power.


    Irradiance, H, is defined as the spectral power per unit area and is given by


    ```

    H = Δq / (ΔA Δt Δλ)

    ```


    where ΔA can be considered as the finite area of the sensor measuring the spectral
    power, assuming that the sensor is parallel to the surface being measured. The
    unit of irradiance is therefore W m⁻²(nm)⁻¹ or J s⁻¹ m⁻²(nm)⁻¹. Irradiance is
    usually used to define the amount of spectral power incident or hitting a unit
    area. When the same quantity is used in the context of amount of spectral power
    leaving or reflected off a unit area, it is often called radiant exitance, E.


    Irradiance only tells us about how much light hits a point, but it does not say
    much about the direction the light is coming from. Therefore, irrandiance can
    be considered to be the quantity measured by the sensor when a conical light limiter
    is placed on the sensor to limit the direction of the light it is measuring to
    Δσ. Therefore, radiance is defined as irradiance per unit direction as


    ```

    R = ΔH / Δσ = Δq / (ΔA Δt Δλ Δσ)

    ```


    and is measured by the unit W m⁻²(nm)⁻¹(sr)⁻¹ or J s⁻¹ m⁻²(nm)⁻¹(sr)⁻¹ where sr
    stands for steridian, the SI unit for a solid angle. It is analogous to radians
    used to define planar angles. A useful property of radiance is that it does not
    vary along a line in space. Consider the sensor with a conical light limiter of
    angle σ measuring the light hitting a surface from a distance d. Let the circular
    area subtended by this cone be ΔA. If we increase the distance by a factor of
    k to kd, the area being measured by the detector will increase by k² but the light
    reaching the detector will be attenuated by the same factor k² (due to distance
    attenuation of light being inversely proportional to the distance) thereby keeping
    the radiance constant. Here we consider the sensor to be parallel to the surface
    whose radiance is being considered. In other words, the normal to the surface
    is perpendicular to the sensor. However, the more general situation is when the
    sensor is titled by an angle θ. In this case, the area sampled by the detector
    will'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'no longer be a circle but an ellipse with a larger area of $\Delta A\cos(\theta)$.
    Therefore, radiance will be defined by


    $$R=\frac{\Delta H}{\Delta\sigma}=\frac{\Delta q}{\Delta A\cos\theta\Delta t\Delta\lambda\Delta\sigma}.
    \tag{9.6}$$


    As with irradiance, it is important to distinguish between the radiance incident
    from a point on the surface and radiance exiting from a point of the surface.
    The former is called *field radiance*, $L_f$, and the latter is called *surface
    radiance*, $L_s$. Therefore,


    $$L_s=\frac{\Delta E}{\Delta\sigma\cos\theta} \tag{9.7}$$

    $$L_f=\frac{\Delta H}{\Delta\sigma\cos\theta} \tag{9.8}$$


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_219_0.png)


    The reason radiance is considered to be the most fundamental radiometric quantity
    is that if we know $R_f$ of a surface, we can derive all the other radiometric
    quantities from there. For example, irradiance can be expressed from the field
    radiance as


    Figure 9.1. This figure shows the surface point $P$ with normal $n$ and the incident
    light direction $k_i$ and viewing direction $k_o$ for the BRDF $\rho(k_i,k_o)$
    at $P$.


    $$H=\int_{\mathcal V}L_f(k_i)\cos\theta\,d\sigma \tag{9.9}$$


    where $k_i$ is an incident direction that can be expressed as a $(\theta,\phi)$
    pair in the spherical coordinate system with respect to the normal at that point
    on the surface and is associated with a differential solid angle $d\sigma$. For
    example, if $L_f$ is constant across all directions, we can compute the irradiance
    by replacing $d\sigma=\sin\theta\,d\theta\,d\phi$ as


    $$H=\int_{\phi=0}^{2\pi}\int_{\theta=0}^{\pi/2}L_f\cos\theta\sin\theta\,d\theta\,d\phi
    \tag{9.10}$$

    $$=\pi L_f \tag{9.11}$$


    Note the constant $\pi$ will appear in many radiometric calculations and is the
    artifact of how we measure solid angles. We consider the area of the unit sphere
    to be a multiple of $\pi$ rather than multiple of one. Similarly we can compute
    the spectral power incident on a surface by finding $\int_{\mathcal V_x}H(\mathbf{x})\,dA$
    where $\mathbf{x}$ is a point of the surface associated with a differential area
    of $dA$.


    # 9.1.1 Bidirectional Reflectance Distribution Function


    Bidirectional Reflectance Distribution Function or BRDF is a formal way to describe
    what we humans face everyday – objects look different when viewed from'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'different directions as they are illuminated from different directions. Painters
    and photographers have for centuries explored the appearance of trees and urban
    areas under a variety of conditions, accumulating knowledge about “how things
    look” – which is nothing but BRDF related knowledge.


    So, let us now define BRDF at a surface point P formally. Let us consider a point
    on a surface P with a normal n, illuminated from a direction k_i. This is achieved
    by placing a light source in this direction. Let the irradiance incident at P
    be H. Let the radiance going out towards a viewing direction k_o be L_s. This
    setup is illustrated in Figure 9.1. The BRDF ρ is defined as the ratio of L_s
    to H, i.e.


    ```

    ρ(k_i, k_o) = L_s / H.  (9.12)

    ```


    Therefore, BRDF gives us the fraction of light exiting towards the viewing direction
    k_o when illuminated from the incident direction k_i. Note that both k_o and k_i
    are directions in 3D and can be represented with two angles in spherical coordinate.
    Let k_i be given by (θ_i, φ_i) and k_o be given by (θ_o, φ_o). Therefore, BRDF
    is a four dimensional function ρ(θ_i, φ_i, θ_o, φ_o). Also, note the ρ is a ratio
    of radiance by irradiance. Therefore its unit is (sr)^{-1}.


    Directional Hemispherical Reflectance Let us consider a simple question, “What
    fraction of the incident light is reflected?”. It is evident that this number
    should be between 0 to 1 purely from the standpoint of conservation of energy.
    Let us now see if this question can be easily answered using BRDFs. Given an incident
    light from the direction k_i, the fraction that is reflected should be the ratio
    of outgoing irradiance (or radiance exitance) to the incoming irradiance. Therefore,
    the directional hemispherical reflectance for the D(k_i) is given by the ratio
    of radiance exitance E to irradiance H as


    ```

    D(k_i) = E / H.  (9.13)

    ```


    From Equation 9.12 we know that


    ```

    L_s(k_o) = H ρ(k_i, k_o)  (9.14)

    ```


    Also, from the definition of radiance in Equation 9.8 we know that


    ```

    L_s(k_o) = ΔE / (Δσ_o cosθ_o).  (9.15)

    ```


    Therefore,


    ```

    H ρ(k_i, k_o) = ΔE / (Δσ_o cosθ_o).  (9.16)

    ```


    Rearranging terms we get the contribution of E/h reflected in the direction of
    k_o as


    ```

    ΔE / H = ρ(k_i, k_o) Δσ_o cosθ_o  (9.17)

    ```'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'Therefore,


    $$D(\mathbf{k_i}) = \frac{E}{H} = \int_{\forall \mathbf{k_o}} \rho(\mathbf{k_i},\mathbf{k_o})
    cos\theta_o d\sigma_o \tag{9.18}$$


    An ideal diffuse surface is called *Lambertian* and is considered to have a constant
    BRDF at any viewing direction. In other words, the appearance of the object is
    view-agnostic or view-independent. Though such surfaces are pratically non-existent,
    many objects with *matte* appearance are often modeled as a Lambertian surface.
    Let us consider such a Lambertian surface with $\rho = C$. Then the directional
    hemispherical reflectance of such a surface is given by


    $$D(\mathbf{k_i}) = \int_{\forall \mathbf{k_o}} C \Delta\sigma_o cos\theta_o d\sigma_o
    \tag{9.19}$$ $$= \int_{\phi_o=0}^{2\pi} \int_{\theta_o=0}^{\frac{\pi}{2}} C \
    cos\theta_o \ sin\theta_o \ d\theta_o \ d\phi_o \tag{9.20}$$ $$= \pi C \tag{9.21}$$


    Therefore, if we consider a perfectly reflecting Lambertian surface where $D(\mathbf{k_i})
    = 1$, then its BRDF is $\frac{1}{\pi}$.


    # 9.1.2 Light Transport Equation


    Using the aforementioned equations, we can now write a simple light transport
    equation that defines how light is transported via surfaces or objects in the
    presence of lights from many different directions. If we consider radiance $L_i$
    from the direction $\mathbf{k_i}$ along a small solid angle $\Delta\sigma_i$,
    the irradiance due to this light is given by $L_i cos\theta_i \Delta\sigma_i$
    where $\theta_i$ is the angle between $\mathbf{k_i}$ and $\mathbf{n}$. Therefore,
    the outgoing radiance $\Delta L_o$ in the direction $\mathbf{k_o}$ due to the
    radiance coming in from direction $\mathbf{k_i}$ is given by


    $$\Delta L_o = \rho(\mathbf{k_i},\mathbf{k_o}) L_i cos\theta_i \Delta\sigma_i
    \tag{9.22}$$


    Therefore, to consider the radiance from all the different directions (all different
    values of $\mathbf{k_i}$), the total irradiance in the direction of $\mathbf{k_o}$
    is given by


    $$L_s(\mathbf{k_o}) = \int_{\forall \mathbf{k_i}} \rho(\mathbf{k_i},\mathbf{k_o})
    L_f(\mathbf{k_i}) cos\theta_i d\sigma_i \tag{9.23}$$


    This is called the rendering equation or light transport equation and is the cornerstone
    of building illumination models, simple or complex.


    # 9.2 Photometry and Color


    For every radiometric property, there is a corresponding photometric property
    that intuitively measures "how much of it can the human observer make use of".'
  merge: -1
  img_proc: true
- pgno: 222
  md: '![](img/66c45bbed85bb7ba7f7b05dff49b5060_222_0.png)


    Figure 9.2. This figure shows the visible spectrum of light and its position with
    respect to the invisible spectrum.


    Therefore, photometric quantities have an aspect of perception associated with
    them. Color is a photometric quantity that we use all the time. It is a part and
    parcel of our lives, so much so, that we probably cannot appreciate it unless
    we lose our perception of color. Mr. I, who lost color perception due to an accident
    exclaimed with anguish, “My dog looks gray, tomato juice is black and color TV
    is an hodge podge”. Color not only adds beauty to our life, but serves important
    signaling functions. The natural world provide us with many signals to identify
    and classify objects. Many of these come in terms of color. For e.g. banana turns
    yellow when its ripe, the sky turns red when it is dawn and so on.


    The color stimuli is the radiometric quantity (usually radiance), that reaches
    the human eye from any point in the world. The important parameter in the context
    of photometry, and therefore color vision, is the associated wavelength λ. The
    visible light spectrum has wavelength that varies between 400 nm and 700 nm. Figure
    9.2 shows the visible spectrum of colors. A illumination or an object selectively
    emit or reflect respectively certain wavelengths more than other. Two things are
    responsible for our color vision and hence photometry. The first is the selective
    reflection of wavelengths by different objects. However, it is only one of the
    factors responsible for the color of an object. The second important factor is
    the eye’s selective response to different wavelengths. This response, and hence
    the perception of color, can be different from species to species, and also shows
    a variance across individuals of the same species. That is the reason, color is
    often considered as a perception, and not reality!


    Let us start from the illumination of a scene. A scene is usually lighted by'
  merge: -1
  img_proc: true
- pgno: 223
  md: '![](img/66c45bbed85bb7ba7f7b05dff49b5060_223_0.png)


    Figure 9.3. Left: The illumination spectrum (I(λ)) of a flouroscent (bold line)
    and tungsten lamp (dotted line). Right: The reflectance spectrum (R(λ)) of a red
    apple.


    some light source. This light source emits light differently at different wavelengths
    λ. This function, denoted by I(λ) gives the illumination spectrum. Similarly,
    for an object, its relative reflectance at different wavelengths define its reflectance
    spectrum R(λ). Since the reflectance or reflectivity of an object is the ratio
    of outgoing to incoming power, it is between 0 and 1 for an object that is not
    a light source. These spectra for a couple of light sources and a red apple are
    illustrated in Figure 9.3.


    When an object is illuminated by a light source, the amount of light that is reflected
    from that object at different wavelengths is given by the product of I(λ) and
    R(λ). Since this is the spectrum that stimulates the vision, this is called the
    color stimuli or color signal, denoted by C(λ). Thus,


    C(λ) = I(λ) × R(λ)  (9.24)


    as illustrated in Figure 9.4. The physical quantity we are dealing with here is
    power per unit area per unit solid angle per unit wavelength (W m⁻¹ (nm)⁻¹ (sr)⁻¹).
    Therefore, we are essentially thinking of radiance when we are defining the color
    stimuli.


    Color stimuli can be of different types as shown in Figure 9.4. When it has light
    of only one wavelength, it is called monochromatic, e.g. a laser beam. When the
    relative amount of light from all wavelengths is equal, then it is called achromatic.
    The sunlight is close to achromatic in the day time. Finally, if the stimulus
    has different amounts of light from different wavelengths, it is called polychromatic.
    Most of the time we deal with polychromatic light. Most of the manmade and natural
    color stimuli are smooth spectra of polychromatic light.'
  merge: -1
  img_proc: true
