    To achieve this we can apply a very simple test. Note that any front facing primitive
    will have a normal vector whose angle with the view direction (from the vertex
    to the view point) will be within −90 to +90 degrees i.e. its cosine is positive.
    The sign of the cosine can be computed using N.V where N is the normal to the
    plane of the triangle and V is the view direction. Therefore, if this dot product
    is greater than 0, then these primitives should be rendered, otherwise they are
    discarded. This process is called back-face culling. Obviously, back-face culling
    cannot be used with transparent and translucent objects. Figure 14.28 illustrates
    the process of back face culling.


    # 14.10 Visibility Culling


    When we navigate a scene, usually the view frustum has a limited horizontal and
    vertical field of view. Therefore, objects which are not within this view frustum
    (e.g. objects behind us) are invisible and we should not spend resources to render
    those objects. Therefore, instead of making these objects go through the entire
    pipeline and be culled away in the last stage of clipping, the performance can
    be improved tremendously if objects which are not inside the view frustum are
    culled away very early in the pipeline. This process is called view frustum culling
    and is illustrated in Figure 14.29. Only the objects within the frustum or which
    intersect the frustum are rendered. The purple torus intersects the view frustum
    though it is only partially inside the frustum. Such objects are special cases
    and are handled appropriately. In the next few sections, we will introduce methods
    for achieving view-frustum culling with wireframe objects that shows exactly the
    triangles that are rendered and those that are culled.


    # 14.10.1 Bounding Volumes


    The first method consists of defining a simple bounding volume around each object
    in the scene - e.g. a cube or a sphere. This bounding volume should be'
