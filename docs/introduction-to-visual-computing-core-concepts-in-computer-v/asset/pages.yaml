    of depth is interpolated from the reciprocal of the depths stored at the intersection
    points of the scanline and the edges. If the interpolated value is larger than
    the existing value at that pixel in the *Z*-buffer (i.e. depth is smaller), only
    then the framebuffer is updated at that pixel with the interpolated color. Otherwise,
    this pixel is occluded and is not drawn in the framebuffer.


    The polygon rasterization is also made efficient by several measures like incrementally
    updating the intersection of a polygon edge with a scan line by using the results
    with the previous scanline and the slope of the edge thereby avoiding computation
    of the intersections anew for every scanline. Several data structures are used
    to reduce computation. For example, the extent of the scanlines that a triangle
    spans (showed using red and orange dotted lines in Figure 13.10) can be maintained
    so that only the triangles whose span include the scanline under consideration
    are included in the processing for that scan line. Other more complicated data
    structure like edge table (that is a bucket sort of edges bucketed by scanlines)
    are used. Several improvements are also achieved by using integer computation
    as much of the process as possible. Details of such processes are available in
    most traditional computer graphics books. The final rasterized polygon painted
    with interpolated color or gray values is shown in Figure 13.10.'
  merge: -1
  img_proc: true
- pgno: 329
  md: '# 13.4  Conclusion


    We learnt about the interactive graphics pipeline in this chapter. We have deliberately
    kept this treatise API independent and given you the fundamental concepts. We
    hope that following this you can adapt API specific aspects into the pipeline
    easily. For example, OpenGL assumes the normal to the image plane in the view
    set-up to be negative Z. This means the view transformation and the perspective
    transformation will change slightly and we hope you can work through it. In this
    chapter we have not given you details about clipping and rasterization methods
    assuming they will be done in the graphics hardware. To learn more about such
    techniques, please look up [Foley et al. 90, Shirley and Marschner 09, Watt 99].


