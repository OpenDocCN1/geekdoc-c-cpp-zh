    # 11.1.1 Handling Color Images


    To apply histogram processing to color images, the treatment differs based on
    the application. One option is to apply the same method to the three channels
    independently. But this does not ensure that the hue is preserved. Therefore,
    most of the time, the RGB image is first converted to luminance and chrominance
    using standard RGB to XYZ linear transformation followed by finding the chromaticity
    coordinates computation. Then, contrast enhancement is applied only to $Y$ while
    the chromaticity coordinates are left unchanged. Following the enhancement in
    $Y$, the image is transformed back to RGB format using inverse transformations.
    What results is called *hue preserving contrast enhancement*. This is illustrated
    in Figure 11.8. When hue is not preserved, blotches of pink and green show up
    in different parts of the scene during contrast enhancement.'
