  md: 'sense since the same pixel from two images in the overlap region may not have
    the exact same luminance and chrominance to start with.


    Feathering effects depend on two parameters: the blending width and the blending
    function, as shown in Figure 11.13. Too large blending width results in ghosting
    while too small blending width results in a visible seam. The optimal blending
    width is dependent on the size of the features in the blending region.


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_277_0.png)


    In fact, if this problem is cast into the fourier domain, it can be shown that
    if the size of the features span one octave (should be between $2^i$ and $2^{i+1}$
    pixels), an optimal blending width of $2^{i+1}$ will not show any ghosting artifacts,
    but will result in a smooth seam between the two images. In terms of the blending
    function, so far we have only seen functions that ramp down or up linearly. But
    such functions lead to a gradient discontinuity when they transition from the
    flat part to the linear part which results in visible artifacts called Mach bands.


    Mach bands, as illustrated in Figure 11.14, are caused by the phenomenon of lateral
    inhibition in the human eye which is the perception of any gradient discontinuity
    as higher than the actual value at one end and lower than the actual value at
    the other. Figure 11.14(a) shows a figure created by a step function of different
    gray levels. Yet at the boundary, instead of being perceived as a clean step,
    it is perceived as a gradual change of gray that goes higher and then lower before
    achieving the next gray level. This phenomenon is just an illusion called Mach
    bands that is broken in (b) when one of the bands is removed. This is explained
    by how our human perception distorts the perception of a gradient discontinuity.
    In the context of blending, the same problem arises at the gradient discontinuities
    of a linear ramp as shown in (d). The human perception distortion is illustrated
    in (e). A more conducive function for blending, therefore, is one whose gradient
    is continuous like a cosine function or a spline function, as shown in Figure
    11.13. Since these functions do not show any gradient discontinuity, they do not
    lead to Mach bands.'
