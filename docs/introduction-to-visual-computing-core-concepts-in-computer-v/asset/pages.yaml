    # 4.5.3 Example of Aliasing


    To discuss aliasing in the context of 2D images, a very good example is provided
    by the process of digital image generation and display. We will discuss this using
    1D images, but you will see that it will be adequate. An analog image is sampled
    to create a digital image. This process is called sampling. The process of using
    a light spot (called pixel) of a particular size and intensity profile to display
    these samples is called is called reconstruction. We will now provide a frequency
    domain analysis of these two processes and show how aliasing artifacts can result
    during these processes.


    Let us now consider an analog signal with bandwidth f_s which means that the highest
    frequency wave present in the signal f_s. Now sampling this image to convert it
    to digital domain can be considered as a multiplication by a comb function in
    the spatial domain. A comb function is a periodic function where a scaled impulse
    repeats itself periodically (Figure 4.21). Since the frequency domain response
    of a comb function is another comb function, the sampling process becomes a convolution
    with a comb function in the frequency domain. Since the largest frequency present
    in the function is f_s, it has to be sampled at least at the rate of 2f_s. This
    means that the interval between the combs in the spatial domain is 1/(2f_s). Therefore,
    by duality, the interval between the combs in the frequency domain is 2f_s as
    shown in Figure 4.21. Note that if the distance between the combs is greater than
    2f_s in frequency domain (by duality, if the interval between the combs is greater
    than 1/(2f_s) in the spatial domain), then the copies achieved due to convolution
    in the frequency domain would overlap with each other leading to aliasing. This
    is also what Nyquist criterion states.'
