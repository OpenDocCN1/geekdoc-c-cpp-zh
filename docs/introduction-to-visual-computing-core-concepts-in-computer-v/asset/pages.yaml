    # 4.5.1 Effect of Periodicity


    Now let us see how this periodicity extends to 2D. We have seen that the amplitude
    and phase plots repeat themselves to infinity in positive and negative directions
    as an even and odd function respectively. The same will be true in 2D. But now
    since we are dealing with 2D functions, the plot will repeat itself in each of
    the four quadrant directions. We will be working with amplitude plots mostly and
    to show one period of the plot, we will be showing four quadrants where the bottom
    two quadrants will be the reflection of the top two quadrants.


    Let us now look at a few frequency response plots (amplitude only) in Figure 4.19
    to understand these better. (a) is the image of a sine wave making 8 cycles in
    the horizontal direction. Note that horizontal direction sinusoids result in vertical
    stripes and vice versa. Therefore, you see the plot with two high points on the
    x axis denoting the symmetric position for the horizontal sinusoid which can be
    considered to be of orientation 0 or 180. The bright spot in the center is due
    to the averaging of all the pixels in the image. (b) contains only one frequency
    in the vertical direction. Therefore, again we find two highlights in the vertical
    axis at 90 and 370 degrees. The next two images, (c) and (d), contains both vertical
    and horizontal frequencies and therefore you see four highlights instead of two
    in the amplitude graph in the frequency domain. Finally, (e) shows an image which
    is just a rotation of a single sinusoid. Ideally, you would see two highlights
    in the direction perpendicular to the direction of the stripes as shown in (g).
    However, instead we see strong horizontal and vertical patterns in Figure 4.19.
    This may look surprising but this is exactly what is due to the periodicity. Due
    to periodicity we are finding the DFT of the image in (e) repeated in both directions
    multiple times as shown in (h). The edges thus created causes the horizontal and
    vertical highlights in the frequency domain. To alleviate this effect, we perform
    a windowing operation on this image as shown in (f). This is essentially pixel-wise
    multiplication of an image with a gaussian image that has the peak brightness
    at the center and the brightness falls off smoothly to a medium gray near the
    fringes based on a Gaussian function. Though this brings in a new effect getting
    rid of the edges when repeated in horizontal and vertical direction, we can see
    a better approximation of the original non-repeated sinusoid where the two highlights
    can at least be deciphered.


