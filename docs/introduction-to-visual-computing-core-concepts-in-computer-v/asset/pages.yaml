    # 5.4 Conclusion


    Feature detection is considered to be part of low level processing in human vision.
    In this chapter we have discussed the basic techniques to simulate human vision
    which have been combined to provide a much more sophisticated feature detector,
    relatively more popular of which is called the Scale Invariant Feature Transform
    (SIFT) [Lowe 04]. Such low level feature detection processes then become important
    for image segmentation and identifying objects often aided heavily by prior knowledge
    learned. To learn more about these advanced steps of computer vision, please refer
    to [Forsyth and Ponce 11, Prince 12].


