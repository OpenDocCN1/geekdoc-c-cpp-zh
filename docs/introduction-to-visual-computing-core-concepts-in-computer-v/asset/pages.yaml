    completely independent. Therefore, the degree of freedom of this matrix is three
    although the number of matrix entries that can be changed is six.


    However, the degrees of freedom cannot be greater than the number of matrix elements
    that get affected by the transformation. Let us consider a 2D affine transformation
    represented using a 3 × 3 matrix. Since affine transformation allows scaling and
    shear, it may seem that we will have an additional four parameters we can control
    (2 each for scaling and shear) in addition to the three parameters for rigid-body
    transformation. Therefore, this transformation has 7 degrees of freedom. However,
    since only six entries of the matrix have been affected, it has 6 degrees of freedom.
    On deeper analysis, you can see that the rotation can be expressed as a combination
    of scaling and shear. For example, x coordinate will be transformed as ax + by
    where a is considered the scale factor and b, the shear factor. But, they will
    be similar to cosine and sine of the angle of rotation. Therefore, the rotational
    degree of freedom in absorbed by the scaling and shear parameters, thereby providing
    the transformation with only six degrees of freedom.


    From a matrix computations perspective, any constraint imposed on a matrix reduces
    its degrees of freedom. So, for example, if you had a matrix of degree 7 with
    the special constraint that the matrix is rank deficient (i.e. determinant of
    the matrix is 0), each deficiency in rank would be translated to a reduction of
    degree of freedom by one. As we go into the next chapters on geometric visual
    computing, we will be discussing degrees of freedom in several occasions to provide
    a more comprehensive understanding.


