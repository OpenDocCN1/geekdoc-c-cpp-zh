  md: 'converting this back to $(Y,x,y)$ format, we get


    $$Y_s = Y_1 + Y_2$$


    $$x_s = \frac{X_1 + X_2}{X_1 + X_2 + Y_1 + Y_2 + Z_1 + Z_2}$$


    $$y_s = \frac{Y_1 + Y_2}{X_1 + X_2 + Y_1 + Y_2 + Z_1 + Z_2}$$


    Let us consider [Equation 10.3](#) of $x_s$


    $$x_s = \frac{X_1 + X_2}{I_1 + I_2} = \frac{x_1 I_1}{I_1 + I_2} + \frac{x_2 I_2}{I_1
    + I_2} = x_1\frac{I_1}{I_1 + I_2} + x_2\frac{I_2}{I_1 + I_2}.$$


    Using the same concept to $y_s$, we find that


    $$(x_s,y_s)=(x_1,y_1)\frac{I_1}{I_1+I_2}+(x_2,y_2)\frac{I_2}{I_1+I_2}$$


    Note that the above equation gives you lot more information than the equations
    10.3. It says that the chromaticity coordinate of $C_s$ is a convex combination
    of those of $C_1$ and $C_2$. Therefore the new color $C_s$ can only lie on the
    straight line segment between $(x_1,y_1)$ and $(x_2,y_2)$ in the chromaticity
    chart. It also says that the location of $C_s$ on this line will be solely dictated
    by the proportion of its intensity. So, if $C_1$ is blue and $C_2$ is red, $C_s$
    will be a purple and if $I_1$ is much higher than $I_2$, it will be a bluish purple
    landing closer to $C_1$ on the straight line between $(x_1,y_1)$ and $(x_2,y_2)$.
    If $I_2$ is larger, then it will be reddish purple. Note that this also provides
    us an alternate way of doing the addition of colors in the $(Y,x,y)$ representation
    without going to the $(X,Y,Z)$ representation — add the luminance and find the
    convex combination of the chromaticity coordinates weighted by the proportions
    of the intensities of each color. When considering addition of $n$ different colors,
    the formulae are given by


    $$Y_s = \sum_{i=1}^{n} Y_i$$


    $$(x_s,y_s)=\sum_{i=1}^{n}(x_i,y_i)\frac{I_i}{\sum_{i=1}^{n}I_i}$$


    Therefore, the chromaticity coordinates of the new color are given by the proportion
    of the intensities of $C_1$ and $C_2$ and not their luminance. Most color science
    literature makes this mistake and says that the chroma needs to be combined in
    proportion of their luminance and not the total intensity. This fundamental mistake
    makes it impossible to match colors by combining one or more additive colors in
    an experimental set up, and you may often think of moving to more complicated
    perceptually uniform color spaces. However, we can show with correct derivation
    of model parameters as above, that we can do perfect matching of colors just working
    with the XYZ color space.'
