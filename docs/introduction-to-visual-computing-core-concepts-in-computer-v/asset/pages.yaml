  md: '![](img/66c45bbed85bb7ba7f7b05dff49b5060_196_0.png)


    Figure 8.2. This figure illustrates the setting for finding the epipolar constraints
    in a two camera system. These two cameras are defined by their center of projection
    O1 and O2 and their image planes I1 and I2 respectively. Both of them are seeing
    the 3D point P. The image of the point P is given by p1 and p2 on the two cameras.
    e1 and e2 define the epipoles of the two cameras and l1 and l2 provide the epipolar
    lines for searching for the correspondences for the 3D point P.


    +   1. PO1O2 forms a plane. As the location of the 3D point P changes, this plane
    changes but it rotates about the baseline O1O2.


    +   2. The image of points on the ray O2P falls on the line l1 in C1. Similarly,
    the image of any point on O1P falls on the line l2 in C2.


    +   3. The line joining O1O2 intersects the image plane I1 and I2 at points e1
    and e2 respectively. These are called the epipoles. Note that the epipole need
    not be located on the physical image plane of the camera, but can be on the extension
    of its plane, as is the case for C1.


    +   4. The line l1 and l2 are given by e1p1 and e2p2 respectively and are called
    the epipolar lines. Note that as the plane PO1O2 change with a change in the position
    of P, the epipoles do not change since the baseline O1O2 does not change. Therefore,
    all epipolar lines pass through the epipole of the image.'
