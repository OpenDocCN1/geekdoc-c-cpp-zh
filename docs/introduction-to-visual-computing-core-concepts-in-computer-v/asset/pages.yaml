    # Put a Face to the Name


    Jim Blinn, a retired scientist, educator and industrial legend, is considered
    as one of the father figures of computer graphics (CG), in particular in light-matter
    interaction. He is the first person to introduce concepts of bump and reflection
    mapping which provided a very powerful tool to early computer graphics animators.
    Though the shading model using normal interpolation goes by Phong shading model,
    it should be more accurately called Blinn-Phong shading model since Blinn worked
    together with Phong on this model. Blinn was born in 1949 and received his bachelors
    degree from University of Michigan in 1970. He received his PhD from University
    of Utah in 1978. He first became widely known for his work as a computer graphics
    expert at NASA’s Jet Propulsion Laboratory (JPL), particularly for his work on
    computer graphics animations for various space missions to Jupiter, Saturn and
    Uranus, especially the Voyager project. These animations were shown on many news
    broadcasts as part of the press coverage of the missions and were the first exposure
    to computer animation for many people in the industry today. He is also known
    in the computer graphics community for his enthusiastic and inspirational role
    as an educator, mentor and a visionary. His columns "Jim Blinn’s Corner" (today
    published as a book by Morgan Kaufman) has inspired many to take computer graphics
    as their calling. These were articles, covering math, graphics pipelines and a
    wealth of tips and tricks which always kept graduate students motivated to work
    on the next big thing. He is well known for creating animation for three television
    education series: Carl Sagan’s Cosmos: A Personal Voyage; Project MATHEMATICS!;
    and the pioneering instructional graphics in The Mechanical Universe. His talks
    in CG venues are still very popular due to his reputation of throwing a challenge
    to the community. In 1998, in a keynote talk in SIGGRAPH (the premier CG conference)
    he asked the CG community "to figure out to drop a piece of spaghetti onto the
    plate and how it squiggles up and model the sauce on there for the frictional
    coefficients and so forth". This led to a large amount of research finally resulting
    in accurate CG simulations of protein foldings.


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_357_0.png)'
