- pgno: 287
  md: 'in different images from which the light directions can be computed. An example
    of the chrome sphere in the scene when lighted by the same lights are shown in
    Figure 11.21.


    Let us assume that we can detect the center of the highlight at $(h_p, h_q)$ and
    the center of the sphere (which appears in the same place in all camera images)
    as $(c_p, c_q)$. Let us assume that the depth of the center is 0 and the depth
    of the center of the highlight is $h_z$. Therefore, we can find $h_z$ using


    ```

    $$h_z = \sqrt{r^2 - (h_p - c_p)^2 - (h_q - c_q)^2}\tag{11.23}$$

    ```


    Now we know the 3D location of the highlight $(h_x, h_y, h_z)$ and the center
    $(c_x, c_y, 0)$.


    From this, we can compute the normal $N$ to the sphere at the highlight. The view
    direction is given by $V = (0,0,1)$. The light vector $L_i$ was reflected about
    $N$ and then seen along the view direction to create the highlight. Therefore,
    reflecting $V$ about $N$ will give the light direction. This is illustrated in
    Figure 11.23. Note that $N$ is given by the sum of $V$ and $L$ which are equal
    sized vectors. Their projection along $N$ is given by $N.V$. Therefore $L_i$ is
    given by the vector addition


    ```

    $$L_i + V = 2(N.V)N\tag{11.24}$$

    ```


    Therefore, we can easily compute the light direction from the above equation for
    each of the images.


    # 11.3.3 Handling Color


    There are two ways to handle color in photometric stereo. The first option is
    to generate three sets of equations, one for each channel.


    ```

    $$\mathbf{L}^{-1}\mathbf{I_R} = \rho_R N\tag{11.25}$$

    ```


    ```

    $$\mathbf{L}^{-1}\mathbf{I_G} = \rho_G N\tag{11.26}$$

    ```


    ```

    $$\mathbf{L}^{-1}\mathbf{I_B} = \rho_B N\tag{11.27}$$

    ```


    In this case, first $N$ can be solved using only one of the channels. Then it
    can be substituted in the above set of equations to find $\rho_R$, $\rho_G$ and
    $\rho_B$. The other option is to combine the three channels assuming a channel-independent
    $\rho$ where $I = \sqrt{I_R + I_G + I_B}$. Figure 11.22 shows an example which
    takes the latter route in the presence of shadows in the input images.


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_287_0.png)


    Figure 11.23. This figure illustrates the computation of light directions from
    the specular highlight on a chrome sphere introduced in the scene.'
  merge: -1
  img_proc: true
- pgno: 288
  md: '# 11.4 Conclusion


    In this chapter we learned a large number of techniques that start from one or
    more color images and combine them to create a new image or generate new information
    about the scene. Here are some pointers to follow advanced topics. To learn more
    on contrast enhancement, you can check out [Majumder and Irani 07]. Instead of
    generating all the levels of Laplacian pyramid during blending, [Brown and Lowe
    03] shows a way to do a two band blending that achieves comparable results more
    efficiently. Blending inherently assumes that the colors of the input images are
    similar. Therefore blending does not yield a good result if the colors of the
    objects in the images are vastly different – e.g. oceans with differently colored
    waters. In such cases, better composition is achieved by blending the gradients
    of the images instead of their values. To learn more about gradient domain blending,
    refer to [Pérez et al. 03]. To learn more about complex image cutting for texture
    synthesis, refer to the use of graph cuts in [Kwatra et al. 03]. To learn more
    about human perception phenomena and Mach bands, please refer to [Goldstein 10].
    In case of photometric stereo, the two big limitations are the assumptions of
    known light vectors and a Lambertian object. [Basri et al. 07] presents a method
    for photometric stereo where the light directions are also unknown. [Wu et al.
    11] presents a method that can achieve surface reconstruction from photometric
    stereo even in the presence of specular reflections.


    # Bibliography


    [Basri et al. 07] Ronen Basri, David Jacobs, and Ira Kemelmacher. “Photometric
    Stereo with General, Unknown Lighting.” International Journal of Computer Vision
    72 (2007), 239–257.


    [Brown and Lowe 03] M. Brown and D. G. Lowe. “Recognising Panoramas.” In Proceedings
    of the Ninth IEEE International Conference on Computer Vision - Volume 2, 2003.


    [Burt and Adelson 83] Peter J. Burt and Edward H. Adelson. “A Multiresolution
    Spline with Application to Image Mosaics.” ACM Trans. Graph. 2:4.


    [Efros and Freeman 01] Alexei A. Efros and William T. Freeman. “Image Quilting
    for Texture Synthesis and Transfer.” In Proceedings of the 28th Annual Conference
    on Computer Graphics and Interactive Techniques, SIGGRAPH ’01, 2001.


    [Goldstein 10] Bruce E. Goldstein. Sensation and Perception. Thomas Wadsworth,
    2010.'
  merge: -1
  img_proc: true
