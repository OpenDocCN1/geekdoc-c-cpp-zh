    f_8 & f_9\end{pmatrix}$ $\begin{pmatrix}x_1 \\ y_1 \\ 1\end{pmatrix}$ = ( $x_2$
    $y_2$ 1 ) $F$ $\begin{pmatrix}x_1 \\ y_1 \\ 1\end{pmatrix}$ = 0  (8.40)


    where $f_1, \dots f_9$ denote the entries of the fundamental matrix $F$. From
    the above equation we can generate the following linear equation


    $x_1 x_2 f_1 + x_1 y_2 f_2 + x_1 f_3 + y_1 x_2 f_4 + y_1 y_2 f_5 + y_1 f_6 + x_2
    f_7 + y_2 f_8 + f_9 = 0$ (8.41)


    Thus, every pair of correspondences detected creates a linear equation. Therefore,
    with adequate correspondences we can estimate $F$. Though $F$ has seven degrees
    of freedom, it can be shown that it has eight parameters in the matrix that can
    be affected by the seven degrees of freedom. Therefore, we need at'
