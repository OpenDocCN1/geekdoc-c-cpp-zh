    Figure 13.1. This figure shows the different steps of the graphics pipeline when
    rendering a simple 3D model of a pyramid defined by the vertices A, B, C and D.


    computed via bilinear interpolation (see Chapter 2) from the other vertices of
    the clipped triangle. This is called the vertex interpolation of attributes.


    3. Rasterization and Pixel Interpolation of Attributes: Finally, we have to paint
    the polygons formed by the clipped and/or unclipped vertices. This is done by
    computing all the discrete pixel locations on the screen that is covered by the
    rendered polygon, and computing the color of these pixels. First the pixels representing
    the edges of the polygon are computed, and the colors at these pixels are computed
    by linear interpolation of the colors at the end vertices representing the edge.
    Then each row of pixels is scanned'
