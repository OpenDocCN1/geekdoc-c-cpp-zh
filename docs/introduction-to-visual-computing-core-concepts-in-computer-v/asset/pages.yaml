- pgno: 77
  md: 'convolution. So, following are the things to be remembered for this purpose.


    +   1. When performing convolution of a filter with an image, it is important
    to align the filter with every pixel and then apply the convolution. Note that
    the result of convolution at each pixel should be stored in a different image.
    Otherwise it will affect the convolutions at other pixels performed later.

    +   2. If the filter size is an even number, you will not be able to find a central
    pixel to align with the image pixel at which convolution is being performed. The
    common thing to do in this case is to align the image pixel with the top left
    pixel of the filter. This will shift the image by half the size of the kernel
    in each direction and should be shifted back after the operation.

    +   3. When the filter overlaps an area outside the edge of the image, the pixel
    values of those pixels are undefined. What should we do then? Usually you can
    pad the image with 0 or 1 or by reflecting the image about the edge or any other
    way you choose. What is chosen does not matter since these will only contribute
    to the samples that are not fully immersed and hence should be ignored from a
    data accuracy perspective.

    +   4. Convolution is made of many floating point operations while images are
    usually stored as 8-bit integers. Performing floating point operations on integers
    results in accumulation of errors at every step of the operation (e.g. every multiplication
    and addition). The best way to handle this is to first convert the image and the
    filter into a floating point representation, perform the filtering and then round
    it back to the integer representation.

    +   5. Finally, sometimes convolution can lead to out-of-range values in the resulting
    image (beyond 0 to 1 or beyond 0 to 256. The best way to handle this is to find
    the minimum and maximum values after the operation and scale the image back to
    be within range.


