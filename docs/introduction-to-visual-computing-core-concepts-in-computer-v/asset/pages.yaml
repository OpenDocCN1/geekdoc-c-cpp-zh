    \ the normalized homogeneous coordinates A' = (x/t, y/t, 1) and B' = (u/w, v/w,\
    \ 1). Therefore, the slope m and offset c of this line M_l is given by\n\nm =\
    \ (tv − yw) / (tu − xw)   (8.4)\n\nc = (yu − xv) / (tu − xw).   (8.5)\n\nTherefore,\
    \ the equation of M_l is given by\n\n(tv − yw)x_l + (xw − tu)y_l + (yu − zw) =\
    \ 0   (8.6)"
