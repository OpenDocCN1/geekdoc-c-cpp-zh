  md: 'Let us consider a more general representation of the gamma function which need
    not be a power function in a color reproducing device and can be thought of as
    a parameter of a color producing device that can be controlled to change the appearance
    of the device. This more general representation is called the tone mapping operator
    or transfer function. When color devices were non-existent and people were used
    to only black and white devices (a better way to call them would be gray), transfer
    function was the only function that dictated the picture quality. All the terminology
    for user interfaces to control picture quality originated at this time and hence
    they have a direct relationship with the tone mapping operator.


    The basic assumption was that the tone mapping operator would be a smooth monotonically
    increasing function. There used to be two controls — usually called brightness
    and contrast or picture. Brightness used to act like an offset on the transfer
    function moving the function up or down. Contrast or picture used to change the
    gain of the transfer function. This is illustrated in Figure 10.6 along with its
    effect on an example image.


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_247_0.png)


    When color displays came into being, the natural thing to do was to have an independent
    transfer function for each channel. This provided a much greater control on image
    appearance. Changing the tone mapping operator for one of the channels to be different
    than others created different effects like producing unique color tints, as shown
    in Figure 10.7. This is often described as changing the color balance. Changing
    the tone mapping operator is the only one way to change the color balance of the
    display. The same effect can be achieved by changing the relative intensities
    of the different primaries using the offset control.


    Figure 10.5. Notice the contouring in the flat colored region around the portrait.
    This is the tell-tale quantization artifact due to insufficient intensity resolution.


    In the displays menu from the control panel on a standard Windows desktop, all
    these three transfer functions, one for each channel, can be seen. Therefore today,
    γ has become a way for users to have control on the device to create a different
    look and feel for images. In any laptop, in properties and settings, one can change
    the h for different channels differently which need not be even an exponential
    function. To get the best reproduction and to take full advantage of the dynamic
    range of the medium, the image should have pixels with range of colors that span
    throughout the entire tone range.


