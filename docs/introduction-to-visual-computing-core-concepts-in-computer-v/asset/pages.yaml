  md: '# Fun Facts


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_322_0.png)


    In computer graphics you will come across the *revered Utah teapot* model which
    has become synonymous to CG innovation ever since Martin Newell, a graduate student
    at the University of Utah, modeled and introduced the object to the computer graphics
    community. The actual teapot that Newall used to create the digital model resides
    at the Computer History Museum in Mountain View, California. So why a teapot?
    It is said that Newall’s wife suggested the object while the two were having tea.
    But her idea was perfect technically due to a large number of reasons cited over
    the years. It is round, has saddle points, has a non-zero genus due to the hole
    in the handle, can project a shadow on itself, can have a self-reflection, and
    looks reasonably aesthetic even when rendered without a texture. It is amazing
    that such a simple object provided computer graphics researchers with so much
    complexity so as to become the benchmark geometric model. In 2006, Professor Peter
    Shirley of the University of Utah paid homage to this model through his Siggraph
    Talk “The Teapot Through the Ages”. Each year at SIGGRAPH (the biggest conference
    for computer graphics academicians, industry and enthusiasts) Pixar hands out
    hundreds of tiny wind-up teapot to collectors.


    Performing a number of floating point intersection operations for every primitive
    is definitely not the most efficient way to achieve clipping, especially when
    a large majority of triangles can fall either completely outside the window or
    completely inside it and only a few will actually intersect the window boundaries.
    One way to improve performance is to make sure that intersection computations
    are only performed when there is a high probability that the primitive actually
    intersects the window boundaries. Therefore, a fast acceptance or rejection test
    for primitives completely inside or outside the window is critical. Such tests
    can be achieved in multiple ways.


    *Using Bounding Boxes:* We can compute the axis aligned bounding box of each triangle
    and see if it lies completely inside or outside the window. An axis aligned bounding
    box is the smallest box enclosing the primitive, with sides parallel to the axes
    of the window. If this bounding box is completely outside, the primitive is rejected.
    If it is completely inside, it is accepted. An axis-aligned bounding box for each
    primitive can be computed by just finding the minimum and maximum extent of the
    vertices in the horizontal and vertical direction. Testing of this bounding box
    is also easily achieved without any intersection computation by checking for intersection
    between the extents of the bounding box and window. Only primitives whose bounding
    box intersects the window go through the intersection computation. In Figure 13.7,
    both the horizontal and'
