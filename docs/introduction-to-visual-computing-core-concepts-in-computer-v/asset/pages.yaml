    We can now use this normal map to achieve the bump mapping using the following
    steps.


    +   1. Define a local coordinate system at parameter (u, v) on a surface using
    its normal and tangent vectors.

    +   2. Find the transformation from the global coordinate system to this local
    coordinate system.

    +   3. Transform the light and view vectors to this local coordinate system.

    +   4. Find the perturbed normal n(u, v).

    +   5. Compute the lighting using the perturbed normal and the transformed light
    and view vectors.


