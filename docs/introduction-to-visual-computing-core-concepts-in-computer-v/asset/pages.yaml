- pgno: 108
  md: 'high frequencies will always remain in the filtered function due to multiplication
    with an infinite function. Therefore, a box filter in reality is not ideal since
    it leads to *leakage* of high frequency in the filtered signal. Practically, a
    Gaussian filter offers us the best of both worlds since it has very little high
    frequency leaks. However, the higher frequencies can get significantly attenuated.
    In fact, a box multiplied by a Gaussian in spatial domain (sinc convolved with
    a Gaussian in frequency domain) turns out to be one of the best low pass filters
    since it reduces the attenuation of the higher frequencies without compromising
    the leakage of high frequencies. More complex filters exist, offering different
    tradeoffs between the amount of attenuation of the higher frequencies and the
    amount of leakage of higher frequencies.


    # Fun Facts


    Did you know that your ears do Fourier transform automatically! There are little
    hairs (cilia) in you ears which vibrate at specific (and different) frequencies.
    When a wave enters your ear, the cilia will vibrate if the wavefunction “contains”
    any component of the correponding frequency! Because of this, you can distinguish
    sounds of various pitches!


    In fact, Fourier transform is one of the most widely used mathematical tools.
    It has been used to study the vibrations of submersible structures interacting
    with fluids, to try to predict upcoming earthquakes, to identify the ingredients
    of very distant galaxies, to search for new physics in the heat remnants of the
    Big Bang, to uncover the structure of proteins from X-ray diffraction patterns,
    to study the acoustics of musical instruments, to refine models of the water cycle,
    to search for pulsars (spinning neutron stars), and to understand the structure
    of molecules using nuclear magnetic resonance. The Fourier transform has even
    been used to identify a counterfeit Jackson Pollock painting by deciphering the
    chemicals in the paint. That is quite the legacy for a little math trick.


    # 4.7 Conclusion


    Fourier analysis is a mathematical concept that can be applied to any function
    of any dimension. There are different flavors of Fourier transform based on whether
    we are dealing with periodic signals or aperiodic signals, continuous or digital
    signals. A large number of books has explored Fourier analysis from a mathematical
    standpoint – [Tolstov 76, Spiegel 74, Morrison 94] and, in more recent times,
    from the perspective of its application [Stein and Shakarchi 03, Folland 09, Kammler
    08]. Other texts explore it from the context of signal pro-'
