- pgno: 234
  md: '# Fun Facts


    Did you know that the concept of perceptual distance is well studied in the perception
    literature? People always wondered how much difference in stimulus we can tolerate
    without noticing it. For example, if you are carrying a heavy book and a 20 page
    thin book is added to your load, you will most likely not notice it. However,
    if your load is a thin 20 page book, you will definitely notice the change. Therefore
    the more important thing to consider is not the absolute change in the stimuli,
    but rather the relative change in the stimuli. While in the former case your stimuli
    of weight is changing by a few percent; in the latter case, it is almost doubling.
    In fact, Weber’s law, named after its discoverer, a well-known law in perception
    literature says that our ability to perceive a difference (what is more formally
    called the difference threshold) is directly proportional to the amount of stimuli.
    The constant of this proportionality changes across different perceptions, but
    10% has been found to be a reasonably good approximation empirically. We see the
    same thing when perceiving the range of grays. We are more sensitive to differences
    at dimmer gray values than at brighter gray values. This is also another reason
    why our display γ > 1.0. This helps us to provide greater resolution at the lower
    channel values than at the higher ones.


    # 9.3  Conclusion


    The rendering equation was introduced first in two seminal works in computer graphics
    in 1986—[Immel et al. 86] and [Kajiya 86]. Its use in image synthesis was popularized
    by the seminal work of Dr. James Arvo in [Arvo and Kirk 90]. Color is one of the
    most confusing topics in the domain of visual computing primarily due to the long
    history of color and its wide use in various ways in many diverse domains starting
    from art, painting, physics, vision, human perception, video processing and compression,
    and then lately in image processing, computer vision and graphics. [Stone 03]
    is an excellent practical handbook to understand these diverse viewpoints. [Reinhard
    et al. 08] provides a detailed formal treatise.


    # Bibliography


    [Arvo and Kirk 90] James Arvo and David Kirk. “Particle transport and image synthesis.”
    *SIGGRAPH Computer Graphics*, pp. 63–66.'
