    # 14.10.3  Other Uses


    Bounding volumes and spatial subdivision techniques are used in many applications
    other than view frustum culling. One common application is collision detection
    widely used in games and scientific simulations. Examples are a digital pool game
    or a simulation of pistons in an engine. In such applications, objects move based
    on some rules and if they collide, it should be detected and an appropriate action
    should be taken. For example, in pool if two balls collide they should be reflected
    in opposite directions. A collision is detected when one or more of the triangles
    in an object intersect with one or more of the triangles in another object or
    with itself in case of self intersections in non-rigid objects. The brute force
    way to compute this is to intersect every triangle in one object with every primitive
    in the other. As is evident, this leads to a tremendous amount'
