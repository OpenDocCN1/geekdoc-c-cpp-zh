    # 3.1.2 Properties of Convolution


    In this section we are going to discuss the properties of convolution. Consider
    a signal x convolved with δ. This means that if the impulse response of a system
    is the impulse itself, what will be its response to an arbitrary function x[t].
    It is rather intuitive that this system outputs the impulse unchanged and hence
    it will also output the signal x unchanged. Therefore,


    x[t] ★ δ[t] = x[t]. (3.4)


    This is called an all pass system.


    Let us now consider a system which simply scales the impulse response. Therefore,


    x[t] ★ kδ[t] = kx[t]. (3.5)


    If k > 1, then this system is called an amplifier since it increases the strength
    of the signal x[t]. On the other hand, if k < 1, it is called an attenuator since
    it reduces the strength of x[t].


    Finally, if we consider a system whose impulse response is to shift the signal,
    then


    x[t] ★ δ[t + s] = x[t + s]. (3.6)


    This is called a delay system.


    As a mathematical operation, convolution has the following conducive properties.


    First, it is commutative, i.e.


    a[t] ★ b[t] = b[t] ★ a[t]. (3.7)


    This indicates that when convolving two functions, the order does not matter.
    This is why we always use the smaller sized function as the kernel for more efficient
    processing.


    Second, convolution is associative, i.e.


    (a[t] ★ b[t]) ★ c[t] = a[t] ★ (b[t] ★ c[t]). (3.8)


    This means that if an function x undergoes cascading convolutions using two different
    kernels b and c, the same operation can be achieved by first designing a new kernel
    by d = b ★ c and convolving x with this new d to provide x ★ d (Figure 3.3.


    Third, convolution is distributive, i.e.


    a[t] ★ b[t] + a[t] ★ c[t] = a[t] ★ (b[t] + c[t]).'
