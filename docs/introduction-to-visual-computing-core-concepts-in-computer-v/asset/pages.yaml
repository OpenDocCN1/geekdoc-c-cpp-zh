    The early cameras were called *camera obscura* which was essentially a pinhole
    camera that was used extensively by artists to create paintings by tracing out
    the image formed by the camera obscura. An arab physicist, Ibn al-Haytham, is
    credited with inventing the first camera obscura. He published the first Book
    of Optics in 1021 AD. Before the invention of the photographic film there was
    no way to preserve the image formed other than tracing it out. Several people
    worked hard on developing the photographic process including Nicphore Nipce in
    1810s, Louis Daguerre and Henry Fox Talbot in 1830s and Richard Leach Maddox in
    1870s. The use of photographic film was finally pioneered by George Eastman in
    1889. His first camera, called "Kodak", was first offered for sale in 1889. It
    came preloaded with film to capture barely 100 pictures. In 1900, Eastman took
    mass-market photography one step further with the Brownie, a simple and very inexpensive
    box camera that introduced the concept of the ‘snapshot’. The Brownie was extremely
    popular and various of its models remained on sale until the 1960s. Oskar Barnack,
    who was in charge of research and development at Leitz, commercialized the first
    35mm camera, the Leica, in 1925. This was the early form of consumer film cameras
    that was in use even in the late 1990s.


