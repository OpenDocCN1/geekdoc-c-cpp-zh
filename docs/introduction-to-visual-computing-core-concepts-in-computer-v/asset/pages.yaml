    Which wavelengths do they represent?


    To answer this question, let us go back to the visible spectrum of light (Figure
    9.2). There are no wavelengths corresponding to purple which nevertheless is a
    color we perceive quite often. Also the colors change hue smoothly across the
    wavelengths i.e. blue changes slowly through cyan to green which then changes
    slowly through green-yellow to yellow which then changes through orange to red.
    So, cyan, which can be thought of as a combination of blue and green rests between
    blue and green. Similarly, orange rests between yellow and red. But, where are
