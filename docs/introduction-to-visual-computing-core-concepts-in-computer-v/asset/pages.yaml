    However, in this case also, before the Laplacian operator is applied to the image,
    a convolution with a Gaussian is required to reduce the noise level. The effect
    of a convolution with a Gaussian followed by a convolution with a Laplacian operator
    on an image is equivalent to a single convolution of the image with a kernel that
    is a Gaussian function convolved with a Laplacian operator. This is called the
    *Laplacian of Gaussian* or LoG operator (Figure 5.13). However, this removes the
    option of two different sized operators for Gaussian and Laplacian.


    Often the same effect of a LoG operator can be achieved by subtracting a delta
    function from a Gaussian filter (this is different than a high pass filter which
    is a Gaussian subtracted from delta). This is because the shape of this filter,
    as you can probably intuitively visualize, is very close to the LoG filter. Figure
    5.14 shows the result of the curvature based detector on an image. However, the
    apparent advantage of a curvature based detector in finding the exact location
    of the edge becomes its undoing for feature edges (Figure 5.15). Feature edges
    are caused by the intensity moving from one level to another and then coming back
    close to the original (instead of a ramp edge where the intensity changes just
    from one level to another). For feature edges, two zero crossings are detected
    for the same edge as shown in Figure 5.15. This phenomenon can often lead to spurious
    edges. Thresholding parameters can also allow some edges to get undetected.'
