    (Figure 12.2b and c), or light transport from the emitter through reflector, absorbers
    and refractors resulting in the realistic lighting of a scene (Figure 12.2d).
    We can model how every micro-fibre of a fabric interacts with the environment
    to create beautiful cloth renderings (Figure 12.2a). In fact, modeling need not
    be physically accurate also. At times, the objectives that drive the modeling
    can be entirely different. For example, modeling of movements of ocean water in
    the animation movies typically are not physically realistic or accurate — but
    it is artistically appealing for the purpose of story telling, as in rendering
    of water in the movie ‘Finding Nemo’.


    # 12.2 Processing


    Processing refers to methods or techniques that are used on models of objects
    or phenomena usually driven by objectives like accuracy, performance (usually
    faster rendering) or application dependent efficiencies. Examples of such processing
    includes model simplification or stripification. Model simplification is the process
    where an object is stored at different levels of details that use different number
    of primitives to represent the same object. Objects need larger number of primitives
    when represented at higher level of details and fewer primitives when represented
    at lower level of details. When rendering, the right level of detail to be rendered
    is chosen based on how far the object is from the viewer. When the object is farther
    away, a lower level of detail would suffice for acceptable appearance but can
    be rendered much more efficiently in much less time due to fewer primitives. This
    is illustrated in Figure 12.3.


    Similarly, let us take the example of streaming a 3D mesh, a popular application
    today for e-commerce. The goal here is to stream the 3D mesh to a remote location
    for rendering. Streaming would entail sending three vertices per triangle'
