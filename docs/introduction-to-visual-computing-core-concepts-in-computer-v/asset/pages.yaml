    (left) and then shows the objects which has been culled away by the view frustum
    culling by (right) using no color on them.


    the smallest possible volume that encloses the object. Then, instead of checking
    if every triangle of the object is inside the view frustum, we can first check
    if the bounding primitive is completely inside or outside the view frustum. If
    it is completely inside, the whole object has to be rendered. If it is completely
    outside, the whole object is culled. These two are the most common cases and lead
    to quick culling of all the objects that are clearly outside the view frustum.
    The small cases of objects whose bounding volume intersect the view frustum needs
    to be treated differently. The easiest way to deal with them is to retain them
    for rendering and let the screen space clipping of the rendering pipeline clip
    away the part outside the view frustum. A more complex approach is to subdivide
    the object into multiple smaller objects and test their bounding volumes against
    the view frustum and go down the hierarchy of only those smaller objects whose
    bounding volume intersects the view frustum. The choice of the geometry used as
    bounding volumes are typically simple ones such as spheres and cuboids, whose
    intersection with the view volume can be efficiently computed. Bounding volumes
    should also bound the given object tight in order to reduce false positives during
    intersection computations.


    Bounding Box: The first bounding volume that comes to mind is often a bounding
    box. A simpler bounding box is an axis-aligned bounding box that can be computed
    using the minimum and maximum extents in the X, Y and Z values of the vertices
    of the object. The box thus defined is the smallest box enclosing the object such
    that the the edges of the box are parallel to the X, Y, Z axis of the world coordinate
    system. Note that if the model is rotated, this box may not be axis aligned anymore
    and hence a new axis aligned bounding box has to be computed for the transformed
    object.


    Each plane of the view frustum divides the 3D space into two half-spaces — one
    that is inside the frustum and the other which is outside the frustum.'
