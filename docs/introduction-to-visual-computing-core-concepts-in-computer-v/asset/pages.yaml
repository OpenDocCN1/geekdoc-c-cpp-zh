- pgno: 299
  md: 'The two main aspects of rendering are the quality of appearance of the 2D image
    generated and the time it takes.


    **Quality:** It is easy to assume that quality means accuracy of rendering. Instead,
    quality is an application dependent notion. Quality is determined by what is acceptable
    based on the goal of the application. For example, when playing a game where players
    are moving fast and are focused on specific tasks (e.g. picking up treasures or
    killing adversaries), they may not notice if the scene is lighted very realistically.
    On the other hand, when watching an animation movie, unrealistic lighting would
    most likely get noticed. When rendering fluid simulation results to evaluate and
    improve the design of a car before it is built, accuracy is probably of the highest
    priority, irrespective of the appearance. But, when creating special effects for
    movie, quality is guided by how close the digital content matches the real. Further,
    the style of the appearance need not always be photo-realistic (i.e. like a photo)
    though it has been the focus of mainstream computer graphics historically. More
    recently, we have discovered an immense opportunity in creating non-photorealistic
    renderings. For example, a student of mechanical engineering would not like to
    see the photo of a greasy part of a motor to learn about it. He would rather want
    an illustration of the 3D parts which abstracts the different components and their
    functionality better. A student of medicine would not want to study the human
    digestive system from its photo. He would rather want a colored highlighted illustration
    of the same to learn more about the anatomy. Such renderings that are specifically
    designed to be not like photos are called non-photorealistic renderings, a few
    examples of which are shown in [Figure 12.4](#). These kind of effects were also
    used in animation movies. For example, specific artistic effects of fur and grass
    was extensively used in animation movies like *Monsters Incorporated* or *Lorax*.


    **Speed:** The speed of rendering a scene is always dependent on how much complexity
    is modeled and rendered. The most fundamental parameter that dictates speed is
    the number of primitives since it is inversely proportional to the speed of rendering.
    Complex phenomena like caustic effects or realistic illumination effects can make
    the rendering very slow. In popular terms, if the rendering can be achieved at
    a video rate, i.e. 30 frames per second (fps), it is called an interactive rendering.
    But, it should be kept in mind that the term interactive is also application dependent.
    For example, a game application may need to be rendered at 30 fps to be termed
    as interactive, but a sketch application can respond at 10 fps and the user may
    still feel that the system is responding appropriately to the sketch strokes.
    However, more often than not, rendering a frame for minutes or hours is termed
    as non-interactive. Most complex phenomena like subsurface scattering or cloth
    appearance modeling are usually associated with non-interactive rendering. Therefore,
    almost all the renderings in [Figure 12.2](#) have taken multiple machines and
    many hours to render a single frame.


    **Quality vs Interactivity Trade-off:** In the domain of image synthesis, there
    is an omnipresent issue of the tradeoff between quality and interactivity. The'
  merge: -1
  img_proc: true
- pgno: 300
  md: 'choice is often purely based on an application. A game application favors speed
    over quality while an animation movie favors quality over speed. The available
    computing resource, whether it is a mobile device or a farm of powerful machines,
    is allocated to the appropriate need, namely to enhance speed or quality.


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_300_0.png)


    The next question is how much can the quality be compromised when speed is of
    concern. It is imperative that if the quality goes down beyond a certain ‘acceptable’
    level, it will affect the user experience even if rendering speed is at its best.
    Therefore, in interactive graphics we see several techniques, which can be thought
    of ‘tricks’ that try to mimic complex visual phenomenon so that they do not stand
    out to be jarringly wrong. For example, the technique of texture mapping pastes
    images on geometric primitives such as triangles to provide visual complexity
    to the scene without increasing the number of primitives. Similarly, bump mapping
    simulates the effects of small bumps by perturbing normals thereby creating lighting
    effects visible in bumps, again without increasing the number of primitives (Figure
    12.5). Environment mapping pastes an image of the environment on the object to
    simulate a shiny object in the scene.


    The aforementioned discussion may bring forth an idea that realism is always good
    and you cannot go wrong with non-interactive realistic image synthesis. This impression
    is also not accurate. Note that the complexity of a realistic image is phenomenal
    and it is not true that a rendering as close to realistic as possible is always
    desired. The phenomenon of ‘uncanny valley’ is well-known among artists. If the
    realistic replication is very close but not absolutely correct, it can create
    discomfort in users despite being very realistic. In fact, more often than not
    it creates a disturbing experience. In fact, the uncanny valley has been attributed
    to the failure of very expensively made animation movies like *The Polar Express*
    or robots like Cubo girl (Figure 12.6).


    **Figure 12.5.** This shows that a plain 3D model can be used in conjunction with
    a richer image to create texture mapped objects (left) and bump mapped objects
    (right).'
  merge: -1
  img_proc: true
- pgno: 301
  md: '# 12.4 Application


    The domain of visual content synthesis is literally innumerable and diverse. In
    this section we will discuss some popular applications, specifically focusing
    towards 3D content synthesis.


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_301_0.png)


    Figure 12.6. This shows the user evaluated empathy towards several digital characters
    in animation movies.


    The rise of the field of computer graphics was motivated from its inception by
    a concept that is well-defined today as virtual reality or VR. The goal here was
    to simulate environments and experiences that are virtual and yet so real that
    people can use them for training. Examples of such environments are flight simulators
    for pilots, training environments for Army, Navy and Airforce. The name ‘virtual
    reality’ stems from the fact that the virtual environment would be the reality
    for the users for some time and at some


    space. The basic concept of virtual reality lies in having an immersive display
    on which a computer generated scene is presented to create a sense of immersion
    in a virtual environment. In addition, users can have different interactive devices
    (e.g. joystick) for navigating the 3D world or interacting with it. The immersive
    display can be instrumented by a surround seamless large area display made of
    multiple projectors. The perception of depth can be achieved by active stereo
    glasses that switch synchronously with the projectors time multiplexing between
    the views for the two different eyes. It can also be achieved via passive stereo
    glasses where superimposed projectors of different polarity are used to project
    the views of two eyes. The glasses are equipped with identical polarizers the
    allow the different projections to reach two eyes. The display can also be a head
    mounted display (HMD) where two different views of the scene are generated in
    real time and presented to the two eyes synchronously (e.g. Occulus Rift, Google
    cardboard). The head of the user is usually tracked (e.g. using cameras) which
    is used to determine the viewpoint from which the scene will be rendered. Today,
    we are seeing the advent of retinal displays where light is shone into the retina
    for the user to experience the same images as projected on a HMD. Virtual reality,
    even today, is one of biggest consumer for computer graphics. These are now routinely
    being used for 3D gaming experiences. Further, with the advent of high-speed networking,
    it is now also being used for applications like teleconferencing. Some of such
    applications are shown in Figure 12.7.'
  merge: -1
  img_proc: true
