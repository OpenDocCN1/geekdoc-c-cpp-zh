- pgno: 313
  md: '# 13.1.3 Perspective Projection Transformation


    The perspective transformation matrix does the final transformation from the 3D
    scene to the 2D projection on the image plane. We now define the parameters to
    limit the extent of 2D image plane in order to define a field-of-view (FOV). The
    geometry on which the perspective projection transformation is defined is shown
    in Figure 13.3.


    The eye or camera is viewing in the direction of the Z axis after the view transformation.
    In order to limit the data that is being processed, two planes, the near plane
    and the far plane, parallel to XY planes, are defined along the Z axes. Objects
    that are closer than the near plane and those that are farther than the far plane
    are not projected and drawn. These two planes are defined by their Z coordinates
    n and f, n < f. The near plane also serves as the image plane on which the 3D
    objects are projected. The axis-aligned rectangular window on the near plane through
    which we see the 3D scene from the eye point (origin) is called the viewport.
    Viewport is defined by the x coordinates of left and right vertical edges, and
    y coordinates of top and bottom horizontal edges. A rectangular viewport in graphics
    is more to mimic the rectangular sensor in the camera than to mimic the circular
    retinal image of the human eye. The four edges of the viewport – x = l, x = r,
    y = t and y = b – along with the origin (eye) define four planes. The truncated
    pyramidal structure formed by these four planes, the near plane and far plane
    is called the view frustum and the volume enclosed by the view frustum is called
    the view volume. Only the objects inside the view volume are rendered on the image
    plane. In the context of the human eye, the depth between n and f is usually termed
    as the depth of field and defines the range of depth in which objects form a focused
    and sharp image on the retina.


    However, the viewport need not be centered around the Z axis. While E, V and N
    of the view set up describes the head position and orientation, the viewport describes
    the gaze or the orientation of the eye, when the head is fixed. The ray from the
    eye (0, 0, 0) to the center of the viewport in the near plane ((l+r)/2, (t+b)/2,
    n) is called the gaze direction. This effect of moving the gaze is very different
    from moving the entire head. Try the following experiment. Stand in front of a
    tiled wall. With head fixed look at and observe the tiles 30-45 degrees above
    or below. Then just rotate your head (but not change the position) to observe
    the same tiles straight ahead. The former effect keeps the image plane the same
    but changes gaze. The latter effect is created by the tilting of the image plane
    since the normal to the image plane changes with the rotation of the your head.
    Notice the effect of these two perspectives is very different from each other.
    When changing the gaze, the tiles will look stretched, but when rotating your
    head they will be not.


    The primary function of the perspective projection is to project the 3D scene
    in the view volume onto the viewport. In addition, to simplify further computations
    of window coordinates and resolve occlusions, we need the perspective'
  merge: -1
  img_proc: true
- pgno: 314
  md: 'projection transformation to also convert the truncated pyramidal view frustum
    into a cuboid that extends in each of the X, Y, and Z direction from −1 to +1.
    This is illustrated in Figure 13.4. In order to illustrate this transformation,
    consider the point $P_v = R(N,V)T(-E)MP = (X,Y,Z)^T$ where $P_v$ denotes the vertex
    after model and view transformation.


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_314_0.png)


    **Figure 13.4.** This shows the transformation from the truncated canonical frustum
    to the cuboid shaped frustum as part of the perspective projection.


    The first step is to coincide the general gaze direction to the default gaze direction
    that coincides with the normal to the image plane when the viewport is such that
    $l=-r$ and $b=-t$. This is achieved by a shear that brings the point $((l+r)/2,(t+b)/2,n)$
    to $(0,0,n)$. Since the $z$ coordinate remains unchanged, this transformation
    is a $Z$ shear. Let the parameters of this shear be $(a,b)$. Therefore,


    $$\begin{pmatrix}0\\0\\n\\1\end{pmatrix}=\begin{pmatrix}1&0&a&0\\0&1&b&0\\0&0&1&0\\0&0&0&1\end{pmatrix}\begin{pmatrix}(l+r)/2\\(t+b)/2\\n\\1\end{pmatrix}
    \tag{13.5}$$


    From this we can find the parameters $a$ and $b$ of shear to be


    $$a=-\frac{l+r}{2n} \tag{13.6}$$


    $$b=-\frac{t+b}{2n} \tag{13.7}$$


    Therefore, the first matrix for perspective projection of $P_v$ is $Sh_z(-\frac{l+r}{2n},-\frac{t+b}{2n})$
    and it provides the transformation to account for the off-axis viewport.


    The next step is to transform the view frustum from a truncated pyramid to a cuboid.
    Let us assume, for the moment, that the $z$ coordinate does not matter since after
    projecting to the image plane, all the vertices will have the depth $n$. We will
    revisit the depth issue later. Therefore, if $z$ coordinate is ignored, the goal
    is to map the viewport which extends from $l$ to $r$ in the $x$ direction to −1
    to +1 in the $x$ direction, and from $t$ to $b$ in the $y$ direction to −1 to
    +1 in $y$ direction. This means that lengths of $r-l$ horizontally and $t-b$ vertically
    should be mapped to 2. Since the center is already at $(0,0)$ following the shear,
    this can be achieved by a scaling transformation $S(\frac{2}{r-l},\frac{2}{t-b},1)$.
    Therefore, the complete transformation until this step for a vertex $P_v$ is given
    by $P_s=S(\frac{2}{r-l},\frac{2}{t-b},1)Sh_z(-\frac{l+r}{2n},-\frac{t+b}{2n})P_v$.'
  merge: -1
