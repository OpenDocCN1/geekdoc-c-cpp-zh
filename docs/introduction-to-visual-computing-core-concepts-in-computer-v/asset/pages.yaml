  md: '# 10.2.1 Gamut Transformation


    Let us consider two devices with linear gamma and color gamut defined by two different
    matrices $M_1$ and $M_2$. Let us assume that the input $(R_1,G_1,B_1)$ creates
    the color $(X,Y,Z)$ in the first device. Our goal is to find the input $(R_2,G_2,B_2)$
    in the second device that would create the same color. Note that, as per Equation
    10.10


    $$\begin{pmatrix}X\\Y\\Z\end{pmatrix}=M_1\begin{pmatrix}R_1\\G_1\\B_1\end{pmatrix}=M_2\begin{pmatrix}R_2\\G_2\\B_2\end{pmatrix}
    \tag{10.18}$$


    From the above equation, we find that


    $$\begin{pmatrix}R_2\\G_2\\B_2\end{pmatrix}=M_2^{-1}M_1\begin{pmatrix}R_1\\G_1\\B_1\end{pmatrix}
    \tag{10.19}$$


    Therefore, if we multiply the input to the first device with the matrix $M_2^{-1}M_1$,
    we will get the appropriate input to create the same color in the second device.
    This is called gamut transformation.


    However, there are some issues with this technique as illustrated in Figure 10.9.
    Here we show the parallelepiped gamut of two devices, one in black and the other
    in gray. Let us now consider the color marked by the blue dot which is within
    the gamut of the first device. Once we apply our gamut transformation to find
    the corresponding input in the second device to produce the same color, the values
    we get are marked in the orange, magenta and cyan vectors. Note that the required
    color is outside the color gamut of the second device, and to reproduce that color
    one of the primaries has to be scaled by a value greater than 1.0. This means
    that the inputs generated will be out of the range. This indicates that the color
    to be generated is out of the device gamut and cannot be generated using convex
    combination of the primaries. Such colors are call out-of-gamut colors and cause
    a problem in any gamut transformation.


    There are multiple ways to deal with out-of-gamut colors and they can be chosen
    based on the application. One option is to use an in-gamut color on the planar
    boundaries of the gamut that is closest to the out-of-gamut colors.


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_252_0.png)


    **Figure 10.9.** This figure illustrates the problem caused by out of gamut colors
    during gamut transformation.'
