    shows that the multi-resolution operation of edge detection occurs in our brain
    with continuous levels rather than discrete levels. The characteristics of edges
    across these continuous levels follow some very predictable patterns. The most
    important of these patterns are: (a) The edge position may shift as the scale
    becomes coarser but the shift will not be drastic or discontinuous; (b) two edges
