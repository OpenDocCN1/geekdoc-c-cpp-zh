    # 14.7 Transparency


    So far, we have only considered rendering opaque objects. However, we encounter
    a large number of materials in the real world which are transparent or translucent
    (e.g. glass, liquids). In order to achieve interactive rendering of such objects,
    we introduce the concept of alpha blending. For this, we introduce a new channel
    of attributes in addition to the 3-channel RGB color. This is called the alpha
    channel, A. The alpha value A allows a rendering application to have a fractional
    contribution of the color from a source pixel S (i.e. the color of the pixel that
    is being rendered) blended with a fractional contribution from the destination
    pixel D (i.e. the color already existing in the framebuffer at that pixel). Let
    the color at S and D be (s_r, s_g, s_b, s_a) and (d_r, d_g, d_b, d_a) respectively
    where s_a and d_a are values of the alpha channel. Note that prior to the introduction
    of the alpha channel, we assumed that the new value at the destination pixel D''
    = S, i.e. the new source color replaces the destination color.


    However, in alpha blending, we adopt a more general way to achieve D'' as a'
