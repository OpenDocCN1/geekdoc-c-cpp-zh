  md: '![](img/66c45bbed85bb7ba7f7b05dff49b5060_197_0.png)


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_197_1.png)


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_197_2.png)


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_197_3.png)


    Figure 8.3. On the top we see the marked features in the left image which lie
    on the epipolar lines in the right image and these lines can then be searched
    to find the corresponding feature. In the bottom, we show two images captured
    from a stereo camera pair and the epipolar lines on each of them. Note that the
    epipole in both the images lie outside the physical image.


    The question is, why is this important? The importance of the above constraints
    is that they reduce the search space for correspondence when using a calibrated
    stereo camera pair. Since we consider calibrated cameras, the position of each
    of the camera can be projected on the image plane of the other thus giving us
    the epipoles e1 and e2. Next, if we detect the feature p1 (image of P) in camera
    C1, then its correspondence is bound to lie on the line e2p2 = l2. Therefore,
    instead of searching the entire image, we can now search on the line l2 for the
    correspondence. Therefore, our search space for finding correspondence has reduced
    from 2D to 1D which leads to significant computational savings when finding the
    depth of points in the scene. This is illustrated in Figure 8.3. In the following
    sections, we will learn the mathematical foundations for reducing the search space
    for correspondences from 2D to 1D. Towards that, we need to first learn about
    fundamental matrix.'
