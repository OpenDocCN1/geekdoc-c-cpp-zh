  md: '# Put a Face to the Name


    Harry Theodore Nyquist is considered to be one of the founders of communication
    theory. He was born to Swedish parents in February 1886 and immigrated to the
    United States at the age of 18. He received his B.S. and M.S. in electrical engineering
    from the University of North Dakota in 1914 and 1915 respectively. He received
    his PhD in physics in 1917 from Yale University. He worked in the Department of
    Development and Research at AT&T from 1917 to 1934, and continued there when it
    became Bell Telephone Laboratories until his retirement in 1954. He died in April
    1976.


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_24_0.png)


    However, human perception is usually not linear. For example, human perception
    of brightness of light is non-linear, i.e. if the brightness is increased by a
    factor of 2, its perception increases by less than a factor of 2. In fact, any
    modality of human perception (e.g. vision, audio, nervous) is known to be non-linear.
    It has been shown that most human perception modalities follow Steven’s power
    law which says that for input I, the perception P is related by the equation P
    ∝ I^γ. If γ < 1, as is the case of human response to brightness of light, the
    response is said to be sub-linear. If γ > 1, as is the case for human response
    to electric shock, the response is said to be super-linear.


    Due to such non-linear response of the human system, in many cases, a non-uniform
    step size is desired when converting a continuous signal to digital. For example,
    in displays, the relationship of the input voltage to the produced brightness
    needs to be super-linear to compensate for the sub-linear response of the human
    eye. This function in displays (e.g. projectors, monitors) is commonly termed
    as the gamma function. When such non-uniform step size is used during the conversion
    of the continuous signal to digital, the maximum quantization error is half the
    maximum step size, as illustrated in Figure 1.6.


