    # Fun Facts


    The word geometry comes from the Greek words geo, meaning earth, and metria, meaning
    measure. Geometry was one of the two fields of pre-modern mathematics, the other
    being the study of numbers (arithmetic). The earliest recorded beginnings of geometry
    can be traced to early peoples, who discovered obtuse triangles in the ancient
    Indus Valley Civilization (now in India and Pakistan) and ancient Babylonia (now
    in Iran) from around 3000 BC. Ancient Egyptians used geometric principles as far
    back as 3000 BC, using equations to approximate the area of circles among other
    formulas. The Babylonians may have known the general rules for measuring areas
    and volumes. They measured the circumference of a circle as three times the diameter
    and the area as one-twelfth the square of the circumference, which would be correct
    if π is estimated as 3. Greek philosopher and mathematician Pythagoras lived around
    the year 500 BC and is known for his Pythagorean theorem relating to the three
    sides of a right angle triangle: a² + b² = c². Archimedes of Syracuse lived around
    the year 250 BC and played a large role in the history of geometry including a
    method for determining the volume of objects with irregular shapes.


    When Europe began to emerge from its Dark Ages, the Hellenistic and Islamic texts
    on geometry found in Islamic libraries were translated from Arabic into Latin.
    The rigorous deductive methods of geometry found in Euclids *Elements of Geometry*
    were relearned, and further development of geometry in the styles of both Euclid
    (Euclidean geometry) and Khayyam (algebraic geometry) was continued by Rene Descartes
    (1596 - 1650) and Pierre de Fermat (1601 - 1665) in analytical geometry and by
    Girard Desargues (1591 - 1661) in projective geometry.'
