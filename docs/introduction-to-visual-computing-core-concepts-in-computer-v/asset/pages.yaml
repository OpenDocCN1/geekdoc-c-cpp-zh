  md: 'Figure 6.12. We consider the transformation RTP in 2D for this object. Top:
    This shows the transformation performed in a global coordinate system, i.e. using
    pre-multiplication. Therefore, the object is first translated and then rotated.
    Bottom: This shows the transformation performed in a local coordinate system i.e.
    using post-multiplication. Therefore, the coordinate system is first rotated relative
    to its own coordinate system. The object will also change position due to this
    since its coordinates with respect to the local coordinate system have not changed.
    Next the coordinate system is translated relative to itself. The changing coordinates
    are shown in red. Note the final location of the object is the same which is due
    to the associative nature of matrix multiplication.


    The most important difference of projective transformation is that it can take
    finite points to points at infinity. The implication of this is that non-parallel
    lines can become parallel and vice versa. However, it still does not change the
    degree of a curve. So, a line cannot become a curve. A circle can become an ellipse
    (none of its points go to infinity) or even a parabola (where some of its points
    go to infinity) but it cannot become a degree-3 polynomial. Please see exercise
    problems to check it for yourselves.


    The most common projective transformation we face is when we deal with a camera.
    A camera projects the 3D objects in the world on a 2D image plane to create an
    image. The most basic camera model is called the pin-hole camera where the camera
    is considered to be a simple pinhole. Think of a box with a hole in one of its
    face and the opposite face acting as an imaging plane and voila! There we have
