    of the object (e.g. geometric appearance given by gradients or curvature, color
    appearance given by textures or RGB colors). Alternatively, we may want a representation
    for the volume occupied by the object and its associated properties (e.g. density
    of the material in a human body part). Therefore, the primitives we choose for
    modeling inherently depends on what we would like to model (e.g. 3D volume or
    2D surface) and the operations we would like to perform. For example, in aeronautical
    simulations, representation using surface patches may provide a more accurate
    simulation of fluid/air on the surface than triangular mesh. Therefore, one may
    want to use patch based representation for running mathematical simulation while
    using mesh based representation for rendering using an interactive graphics renderer.
    Figure 12.1 illustrates different representations for the same object.


    Modeling need not be of objects alone. We can even model different natural phenomena
    as illustrated in Figure 12.2. For example, we can model the phenomenon of subsurface
    scattering that can be used to render translucent objects'
