- pgno: 173
  md: '# The Pinhole Camera


    The pinhole camera model, introduced in the last chapter, is by far the most popular
    model for a camera. The pin-hole camera is modeled as a closed box with a tiny
    hole punched with a pin on one of its faces. Light rays from any point in a scene
    enters the box only through this pinhole forming an inverted image on the opposite
    face of the box which is therefore termed the image plane. This image is formed
    by the intersection of the light rays passing through the pinhole with the image
    plane, as illustrated in Figure 6.13. The advantage of the pinhole camera is that
    every point in the scene, irrespective of its distance from the pinhole, will
    form a crisp or focused point image on the image plane. Depth of field of a camera
    is defined as the range of depth of the scene points which the camera can image
    in a focused manner (without blurring it). Therefore, a pinhole camera has an
    infinite depth of field. However, a pinhole camera is very light inefficient –
    very little light can enter through a pin-hole. Therefore, lenses are used to
    make the camera more light efficient. The result of this is a camera that no longer
    has an infinite depth of field, but still acts like a pinhole camera for all the
    points within its depth of field – i.e within the range of depth that the camera
    can image in a focused manner. In this chapter, we will first develop a mathematical
    model for pinhole camera. Then we will discuss how the deviation from the pinhole
    model affects image capture or acquisition from practical cameras.


    # 7.1 The Model


    Figure 7.1 shows a schematic for the pinhole camera model. The image plane is
    brought to the side of the scene to avoid inversion. In a practical camera, this
    is confirmed via the use of a complex lens system. O is the center of projection
    of the camera and the principal axis is parallel to the Z axis. The image plane
    is at a distance f from O and perpendicular to the principal axis (parallel to
    the XY plane). f is referred to as the focal length of the camera. To find the
    image of a 3D point P = (X, Y, Z) on the camera''s image plane, a straight line
    is drawn from P to O and its point of intersection with the image plane defines
    the image'
  merge: -1
  img_proc: true
