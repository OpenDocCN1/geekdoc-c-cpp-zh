    Next, we will define certain geometric and topological properties of meshes, but
    not in a rigorous fashion. We will give you intuitions and informal definitions.
    Closed meshes (informally defined to have no holes) have several nice properties
    in the context of computer graphics operations like morphing, mesh simplification
    and editing. Such meshes are manifolds where every edge has exactly two incident
    triangles. A mesh where every edge has one or two incident triangles is called
    manifold with boundaries. For example, a piece of paper denoted by two triangles
    where the four edges forming the sides of the paper have only one incident triangle,
    is a manifold with boundaries. Note that manifold with boundaries are less restrictive
    than manifolds and hence a superset of manifolds. Meshes where edges can have
    more than two incident triangles are called non-manifolds. Note that non-manifolds
    are a superset of manifolds with boundaries. [Figure 1.11](#) illustrate this.


