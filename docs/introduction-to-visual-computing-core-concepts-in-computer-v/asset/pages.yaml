    Another technique, more commonly called a displacement map actually perturbs the
    geometry from P to P′ guided by an image. In this case, microgeometry needs to
    be created and rendered, something that the bump-map avoids. With displacement
    map, therefore, we can see the bumps at the silhouettes, self-occlusions and self-shadowing.
