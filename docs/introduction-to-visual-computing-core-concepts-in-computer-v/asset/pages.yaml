    discussions. First, let us consider how you would represent points at infinity
    using 3D coordinates? The only option we have is (∞, ∞, ∞). Now, this representation
    is pretty useless since it is the same for all points in infinity, even if they
    are in different directions from the origin. However, using a 4D homogeneous coordinate,
    points at infinity can be represented as (x, y, z, 0), where (x, y, z) is the
    direction of the point from the origin. When we normalize this to get the 3D point
    back, we get (∞, ∞, ∞) as expected. As a consequence, homogeneous coordinates
    provides a way to represent directions (vectors) and distinguish them from the
    representation of points. w ≠ 0 signifies a point and w = 0 signifies a direction.


    In the rest of the chapter we are going to represent points or vectors as 4 ×
    1 column vectors. Therefore a point P = (x, y, z, 1) will be written as


    ```

    $$P = \begin{pmatrix} x \\ y \\ z \\ 1 \end{pmatrix}\tag{6.1}$$

    ```


    If P is a vector instead of a point, then the last coordinate will be 0.


    # 6.2 Linear Transformations


    Linear transformation is a special kind of transformation. Given two points P
    and Q, the transformation ℒ is considered a linear transformation if


    ```

    $$\mathcal{L}(aP + bQ) = a\mathcal{L}(P) + b\mathcal{L}(Q)\tag{6.2}$$

    ```


    where a, b are scalars. In other words, the transformation of the linear combination
    of points is the linear combination of transformation of points. This holds true
    for multiple points and not just two.


    The implications of linear transformations are quite important. aP + bQ defines
    a plane and a line if a + b = 1. Linear transformation implies that to transform
    a line or a plane, we do not need to sample multiple points inside it, transform
    them and then connect them to get the transformed entity. Instead, it says that
    the same result will be achieved if the points are transformed and connected via
    a straight line or plane passing through it. Computationally, this has a huge
    impact since now, we save on computing the transformations of a bunch of points
    on the line and instead need to compute only two transformations. Second, linear
    transformation also implies that a line transforms to a line and a plane transforms
    to a plane. In fact, this can be generalized to higher orders of functions. If
    you consider a curve of degree n (e.g. a straight line is a function of degree
