    respectively of a cosine wave of frequency $\sqrt{g^2+h^2}$ and orientation $\tan^{-1}(h/g)$.
    The most common way of visualizing $M$ and $\theta$ is to plot them as a grayscale
    image where the values of $M[g,h]$ and $\theta[g,h]$ is visualized as a gray value
