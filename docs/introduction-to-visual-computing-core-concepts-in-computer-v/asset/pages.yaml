  md: '# The Diverse Domain


    So far we have explored concepts where we start with inputs captured from devices
    and systems and try to reverse engineer the properties of the scene. For example,
    spectral analysis techniques allow us to analyze information about the color at
    any point on a surface from a camera captured image. Or; feature detection techniques
    allow us to detect lines and corners in an image which can be used subsequently
    for object detection or image segmentation. Epipolar geometry helps us to find
    correspondences between stereo pair of images from which we can find the 3D geometry
    of an object. Therefore, these can be thought of as image/scene analysis techniques.


    In the next section of this book, we are going to explore the inverse problem
    of generating a digital image similar to one generated by a device (e.g. camera)
    with the 3D scene of the world as the input. This process is that of image/scene
    synthesis. Synthesis therefore takes as input (a) a scene described as a collection
    of objects, lights, materials and textures represented using precise formal digital
    representation; (b) a view set up specifying the constraints on the eye/viewer
    that is viewing the scene; and outputs a 2D image similar to one captured by a
    device (e.g. camera, photometer) or seen by a viewer. Synthesis can be broken
    down into three steps: modeling, processing and rendering. Modeling deals with
    computer representation of objects and associated processes. Processing involves
    computation on the models for some specified outcomes and goals. Rendering involves
    drawing an image to convey the appearance of the model/processes to a human user.


    # 12.1 Modeling


    Modeling is the process of digitally representing an object or a phenomena so
    that it can be interpreted and processed by the computer. For example, there can
    be multiple ways to model an object – a dense collection of points, or a large
    number of planar triangles each of which approximates a small almost planar region
    of the object, or a number of curved patches to represent the object. All the
    above surface representations are used to represent only the surface properties'
  merge: -1
  img_proc: true
