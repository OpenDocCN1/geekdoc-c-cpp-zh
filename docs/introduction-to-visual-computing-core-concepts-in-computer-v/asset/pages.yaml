    # 6.8 Degrees of Freedom


    Degrees of freedom defines the number of parameters that can be changed during
    a transformation. Let us consider for example, a 2D rigid body transform. This
    will be represented by a 3 × 3 matrix when considering homogeneous coordinates.
    This is often referred to as the 3 × 3 homogeneous transformation. As you know,
    for rigid body transformation, the object can undergo only translation (2 parameters)
    or rotation (1 parameter). Therefore, this matrix has three degrees of freedom.
    This matrix will have the translation parameters on the last column and the rotation
    parameters will be used to fill the top left 2 × 2 sub-matrix. Therefore, though
    six entries of this matrix can be changed, they are not'
