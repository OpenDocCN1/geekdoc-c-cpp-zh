- pgno: 340
  md: '# Put a Face to the Name


    Bui Tuong Phong is considered one of the stalwart figures in the advancement of
    interactive computer graphics due to his work on a computationally inexpensive
    simple illumination model that enabled lighting at video rates of 30 frames per
    sec. He is known for his famous quote “We do not expect to be able to display
    the object exactly as it would appear in reality, with texture, overcast shadows,
    etc. We hope only to display an image that approximates the real object closely
    enough to provide a certain degree of realism” which summarizes the philosophy
    behind interactive graphics. Bui Tuong Phong was born in 1942 in Hanoi, part of
    French Indo China. He later moved to Saigon and then to France where he received
    his Licences Sciences from Grenoble Institute of Technology in 1966 and his Diplome
    d’Ingnieur from the ENSEEIHT Toulouse, in 1968. In 1968, he joined the Institut
    de Recherche en Informatique et en Automatique (then INRIA) as a researcher in
    Computer Science, working in the development of operating systems for digital
    computers. He went to the University of Utah College of Engineering in September
    1971 for his Ph.D. and graduated in 1973 thereafter joining Stanford as a professor.
    Phong knew that he was terminally ill with leukemia while he was a student and
    died not long after finishing his dissertation. Though he lived for only 33 years,
    he has left a long lasting impression in the domain of interactive computer graphics.


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_340_0.png)


    Let us now consider the second pass of the rendering from the viewer. The depth
    buffer, Z_v, created in this process records the depths of only the 3D points
    visible to the viewer. The rest of the 3D points are irrelevant in our context
    of deciding whether it is in shadow or not. For these visible points from the
    viewer, we need to find their depth from the light. Let us consider a 3D point
    P = (X, Y, Z_v) that is the final rendered point at (x_v, y_v) after 3D to 2D
    projection (post view transformation) using matrix M_v and occlusion resolution.
    We know that


    M_v^{-1} \begin{pmatrix} i x_v \\ y_v \\ \frac{1}{Z_v} \\ 1 \end{pmatrix} = \begin{pmatrix}
    X \\ Y \\ Z_v \end{pmatrix} \tag{14.4}'
