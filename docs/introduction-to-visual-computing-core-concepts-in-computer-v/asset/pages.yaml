  md: '![](img/66c45bbed85bb7ba7f7b05dff49b5060_260_0.png)


    **Figure 10.14.** Consider a scene captured by a hyperspectral camera that captures
    the accurate spectrum at every pixel from which we compute the XYZ values at every
    pixel. Left: This image shows the RGB image from a standard camera that the spectra
    captured by the hyperspectral camera would produce. Middle: Consider the same
    scene being captured by a 6 primary camera (RGBCMY), a standard RGB camera and
    a CMY camera - the primaries are shown on the chromaticity chart on the right.
    The Euclidian distance between the reconstructed spectrum from these three cameras
    and the ground truth spectra captured by the hyperspectral camera are normalized
    and represented as a gray scale value at every pixel (brighter means greater distance).
    As expected, a 6-primary camera captures a spectra closer to the ground truth
    than the 3-primary cameras.


    systems have been designed over the years using 4-6 primaries. More than six primaries
    lead to compromising other properties like spatial resolution to offset the gain
    in the 2D color gamut.


    Referring to **Figure 10.14**, consider a scene captured by a hyperspectral camera
    that captures the accurate spectrum at every pixel. The XYZ tristimulus value
    can be computed at every pixel from the captured spectra. Next, the same scene
    is captured by a 6 primary camera (RGBCMY), a standard RGB camera and a CMY camera.
    The inaccurate spectra captured via these primaries are reconstructed using a
