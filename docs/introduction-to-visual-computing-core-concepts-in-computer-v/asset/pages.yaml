- pgno: 239
  md: '# Color Reproduction


    Maybe after the treatise on color in the previous chapter you are wondering what
    is the use of the XYZ color space? To understand this, we have to take a look
    at what is called color reproduction. When you think of images created by any
    device – for example, a digital camera capturing an image or a projector projecting
    an image or a printer printing one – these are all reproduction of colors from
    the physical scene (e.g. camera) or from another device (e.g. printer printing
    a camera captured image). The quality of a color reproduction is evaluated by
    how close the reproduced image is to that of the original image or scene. The
    term ‘close’ can be measured both quantitatively and qualitatively.


    Color reproduction systems can be of two types – additive and subtractive – depending
    on the way two or more colors are mixed to create a new color in the color reproducing
    system. When learning painting, children are taught that the primary colors are
    red, blue and yellow. Yet in the field of image processing, we are taught that
    the primary colors are red, blue and green. So, wherein lies the contradiction?
    Apparently, both the art teachers and the image processing books are right. The
    difference stems from the fact that there are two ways to mix colors – additive
    and subtractive. While red, green and blue are primary colors of the former, the
    primary colors for the latter are cyan, magenta and yellow which are often referred
    to as blue, red and yellow for simplicity.


    In subtractive color mixture, the color of a surface depends on the capacity of
    the surface to reflect some wavelengths and absorb others. When a surface is painted
    with a pigment or dye, a new reflectance characteristic is developed based on
    the capacity of the pigment or dye to reflect and absorb the different wavelengths
    of light. Consider a surface painted with yellow pigment which reflects wavelengths
    570 – 580nm and another surface painted with cyan pigment which reflects 440 –
    540nm. If we mix both the pigments, only the wavelengths that are not absorbed
    by either of these pigments will be reflected, thus resulting in the color green.
    The yellow absorbs the wavelengths evoking the sensation of blue while the cyan
    absorbs the wavelengths evoking the sensation of yellow. Hence, what is left behind
    is a sensation of green. This is called subtractive color mixtures since bands
    of wavelengths are subtracted or canceled by the combination of light absorbing
    materials. And the resulting color, as you have probably'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'noticed, is given by the intersection of the two spectrums. The yellow, cyan
    and magenta are termed as the color primaries of the subtractive color mixtures,
    because they form the smallest set of pigments required to produce all other colors.
    Dyes and inks usually follow subtractive color theory and hence images generated
    using these media are the result of subtractive color reproduction.


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_240_0.png)


    In additive color mixture systems, colors are mixed such that bands of wavelengths
    are added to each other. This is called additive mixture of colors. Thus, the
    spectrum of the color formed by superposition of multiple colors is given by the
    addition of their respective spectra. This is similar to how the human eye visualizes
    color. Devices like cameras and projectors follow additive color mixture.


    Let us look at additive mixing of colors a little more formally. Let S1 and S2
    be the spectra of two different color stimuli in Figure 10.1 shown in red and
    blue respectively. When they are combined additively, the resulting spectrum S(λ)
    is given by the addition of the relative powers of each of S1 and S2 at each wavelength
    resulting in the purple spectrum. Therefore, S(λ) = S1(λ) + S2(λ). However, while
    representing a spectrum for subtractive color mixture such as paint, a value of
    x at a particular wavelength means x% is reflected by the paint while (1 − x)%
    is absorbed. This curve is a spectral reflectance curve (values between [0,1])
    – fraction of the incident spectral value reflected by the material. Therefore,
    when two paints are superimposed, only the part that is not absorbed by either
    is reflected and therefore the resulting spectrum becomes the multiplication of
    the two spectral reflectances and the incident illumination spectrum creating
    the green spectrum in Figure 10.1.


    Figure 10.1. The blue and red show two different color spectra whose additive
    and subtractive mixtures are shown by the purple and green spectra respectively.


    # 10.1 Modeling Additive Color Mixtures


    Modeling additive color space and color mixtures is easy in the XYZ color space.
    When two colors are mixed additively, the XYZ values of the resulting color are
    just the addition of the XYZ values of the individual colors in the mixture. In
    other words, the color resulting from an additive mixture of two colors (X1,Y1,Z1)
