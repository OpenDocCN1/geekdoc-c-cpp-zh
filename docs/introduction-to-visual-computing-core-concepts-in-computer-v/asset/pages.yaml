    # 10.2  Color Management


    So far we have been discussing a single device. Let us now consider multiple devices.
    When considering multiple devices, even if they are of the same type and same
    brand, the primaries in them can differ significantly. Especially, when we consider
    a complete imaging system including acquisition (using cameras), monitors, displays
    and printing, we need to make sure that the color in one device looks similar
    to that in another. You may have had the situation that your picture in the camera
    display looked nice and vibrant, but looked dull when projected in a slide projector
    for an event. Or, the printed picture looked washed out while the same picture
    looked perfectly fine in your monitor!


    Color management entails modifying the input going to each device so that the
    output coming from each device matches. Since each device has different primaries,
    it is evident that they will need different inputs to create the same color. Since
    our goal is to maintain the same color across multiple devices, the only way to
    achieve this is to change the input from one device to another. We will consider
    two fundamental techniques of color management in this section.'
