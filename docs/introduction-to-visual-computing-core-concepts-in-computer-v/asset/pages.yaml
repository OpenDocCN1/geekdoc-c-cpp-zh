    # 5.1.3 Aggregating Edgels


    Edge detectors produce edgels which lie on a edge. The next step is to collect
    this edgels together to create a set of longer edges. This may seem to be trivially
    achieved by just tracing the edges starting from a pixel. But this is only true
    in an ideal case. As you see in the examples shown in the previous section, edgels
    are not perfectly detected. Some parts of an edge may be missing or some small
    edges may appear to be present in a place where there are no edges in reality.
    Therefore aggregating edgels turn out to be more complex than naive. There are
    two types of aggregation method. The first applies local edge linkers to trace
    out longer edges while the latter uses global edge linkers to classify multiple
    edgels to belong to a single edge.'
