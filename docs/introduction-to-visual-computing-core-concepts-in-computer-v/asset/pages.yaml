- pgno: 16
  md: Hill. His research interests include geometry and topology in computer graphics,
    massive geometry data management for interactive rendering, and biomedical sensors,
    data processing, and visualization. His work on representation of manifolds using
    single triangle strip, hierarchyless simplification of triangulated manifolds,
    use of redundant representation for big data for interactive rendering, and biomedical
    image processing have received critical acclaim including best paper awards in
    two Eurographics conferences and in ICVGIP. He is a gold medalist for academic
    excellence at Thiagarajar College of Engineering, a recipient of the Excellence
    in Teaching Award at UCI and a Link Foundation Fellow. He served as the program
    co-chair and papers co-chair of ACM Interactive 3D Graphics conference in 2012
    and 2013 respectively, area chair for ICVGIP in 2010 and 2012, program co-chair
    for the International Symposium on Visual Computing 2006, an associate editor
    of the Journal of Graphical Models, a guest editor of IEEE Transactions on Visualization
    and Computer Graphics and serves in the steering committee of ACM Interactive
    3D Graphics.
