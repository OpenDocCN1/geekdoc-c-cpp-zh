  md: 'is given by linear interpolation as


    $$Q=(1-\alpha)V_1+\alpha V_3.$$


    Similarly, the point $R$ along $V_2V_1$ is given as


    $$R=(1-\beta)V_1+\beta V_2.$$


    where $0.0\leq\alpha,\beta\leq1.0$. Therefore $V$ is given by the vector addition
    of $V_1$, $R$ and $Q$ as


    $$V=V_1+(1-\alpha)V_1+\alpha V_3+(1-\beta)V_1+\beta V_2$$

    $$=(1-\alpha-\beta)V_1+\alpha V_3+\beta V_2.$$


    Therefore $C$ at $V$ can be estimated as


    $$C(V)=(1-\alpha-\beta)C(V_1)+\alpha C(V_3)+\beta C(V_2).$$


    Bilinear interpolation also results in a convex combination and the values of
    $\alpha$ and $\beta$ can be recovered by solving two equations formed by the coordinates
    of $V$, $V_1$, $V_2$ and $V_3$ in Equation 2.7. Further, you can verify for yourself
    that the coefficients for finding $V$ does not change if you consider any two
    different directions like $V_3V_2$ and $V_3V_1$ or $V_1V_2$ and $V_2V_3 (See exercise
    for problems on this).


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_40_0.png)


    **Figure 2.3.** This shows the 4 and 8 connected neighbors in blue for the red
    pixel in the center.


    Now, let us consider bilinear interpolation in another scenario of an image (Figure
    2.2b). Any non-integer spatial location may be considered 4-connected when its
    neighborhood is defined by four nearest neighbors, two in horizontal direction
    and two in vertical direction. A neighborhood can also be 8-connected when the
    diagonal neighbors are also included. The distance of the neighbors in the 8-connected
    neighborhood can be different (for example, diagonal neighbors are $\sqrt{2}$
    distance away while the horizontal and vertical neighbors are unit distance away).
    This is illustrated in Figure 2.3.


    Let us consider a function $F$ that defines the color at integer pixels at $(i,j)$,
    $(i,j+1)$, $(i+1,j)$ and $(i+1,j+1)$ denoted by $A$, $B$, $C$ and $D$ respectively.
    Let us consider a point $P$ where $C$ has to be estimated as shown in Figure 2.2b.
    Note that in this case, the location of each of these pixels is defined using
    2D coordinates. Therefore, the distance between pixel $(i,j)$ and $P$ in horizontal'
