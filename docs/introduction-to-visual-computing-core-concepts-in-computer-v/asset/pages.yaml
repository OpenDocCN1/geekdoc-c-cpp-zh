- pgno: 279
  md: 'Combining the constraints on feature size and smoothness of blending function,
    the ideal way to blend images is to blend the image in multiple resolutions. Such
    a multi-resolution decomposition is created by the Laplacian pyramid where each
    level of the pyramid provides a different resolution and the levels can be combined
    to create the image back. Let us consider two images I1 and I2, each of size 2^N
    × 2^N, to be blended to create the new image I. Let the respective Laplacian pyramids
    be denoted by L1 and L2 – each with ln(N) levels. Using k as an index to the levels
    of the pyramid, each level of the Laplacian pyramids of I1 and I2 are given by
    L1^k and L2^k respectively, where 0 ≤ k ≤ ln(N). To achieve a smooth blending,
    a different blending function bk with width wk should be used for each level k.
    Most commonly, bk is a spline that provides a smooth function whose resolution
    (i.e. how fast it ramps down or up) can be changed to provide the different wk.
    Recall that size of the image at each level of the Laplacian pyramid is different,
    the size of the image at level k being 2^(N − k). The blended images at each level
    create a new Laplacian pyramid L. The images in L are then combined to provide
    the blended image I. To learn more about this, refer to the seminal work by Burt
    and Adelson [Burt and Adelson 83]. An illustration is presented in Figure 11.15.


    Blending is a common technique used in an application called panoramic image generation,
    illustrated in Figure 11.16. The goal here is to capture multiple narrow field
    of view images from consumer camera to create a single wide field of view panoramic
    image. Multiple contiguous images of a location are captured with adequate overlap
    between spatially adjacent images. Since the camera moves between two adjacent
    images, the first step is to register adjacent images geometrically. This is achieved
    applying a geometric transformation to the image (e.g. scaling, translation or
    rotation) so that the overlapping areas can be spatially overlapped to match exactly.
    We will learn more about such geometrical transformations in the next chapter
    of the book. The overlapping area of two adjacent images are blended together
    to create a seamless transition between the images. This results in a panorama
    or an image that covers a much wider angle of view.


    # 11.2.2 Image Cuts


    Blending is not always the best way to achieve a nice transition between two images.
    This is especially true if there are moving objects in the common or overlapping
    areas of the image. In these cases, a blending operation will blend between two
    time instances of the same scene creating a ghosting artifact, almost similar
    to what we see in motion blur. In such cases, instead of blending, we apply a
    cut operation. This is a complementary operation to blending. In blending, a pixel
    in the composite image can have contributions from multiple source images. But,
    in an image cut, every pixel in the composite image comes from only one of the
    source images. Therefore, when stitching two adjacent images as in Figure'
