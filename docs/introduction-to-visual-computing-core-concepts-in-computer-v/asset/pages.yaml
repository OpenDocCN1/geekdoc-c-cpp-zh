  md: '![](img/66c45bbed85bb7ba7f7b05dff49b5060_135_0.png)


    Figure 5.27. This figure illustrates the effect of a median filter. From left
    to right: the original image; the original image with salt and pepper noise added
    to it; the noisy image processed using a box or mean filter; the noisy image processed
    using the median filter to provide an image almost identical to the original image.


    the filter a non-linear filter.


    A median filter is used to remove outliers, i.e. values that are drastically different
    from their neighborhood. They can be due to different device limitations in different
    applications. For example, a dead pixel in a camera can cause the value of that
    pixel to be a one or a zero at all times which will turn out to be an outlier.
    In the case of images, such outliers define a noise which is often called the
    salt and pepper noise – pixels turned either black or white due to system issues.
    Unlike a median filter, a mean filter reduces a Gaussian noise effectively, but
    does not work well for salt and pepper noise since the mean tends to spread the
    contribution from the very localized salt and pepper locations to their neighborhood.
    However, a median filter works much better since the median is usually unaffected
    by variation in the values in the neighborhood. Figure 5.27 shows an example.


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_135_1.png)


    Figure 5.26. This shows how a corner is detected at a pixel in a Harris and Stephens-Plessey
    corner detector based on the magnitude of the two eigenvalues λ₁ and λ₂.


    The median filter is in fact a specific type of a more general type of non-linear
    filters called order statistics filters. For example, instead of the median, we
    can replace the pixel with the value of the minimum or maximum value in its neighborhood.
    These are called minimum and maximum filter the respectively. For regular images
    (not having salt and pepper noise), these achieve the results of morphological
    operators of erosion and dilation. Erosion is the process of suppressing higher
    values thereby darkening the image, while dilation is the process of growing regions
    of higher values thereby brightening the image. These are illustrated in Figure
    5.28. They form the building blocks of a set of image processing operations called
    morphological operators.'
