  md: "![](img/66c45bbed85bb7ba7f7b05dff49b5060_194_0.png)\n\nFigure 8.1. This figure\
    \ shows two 2D points, A and B, in homogeneous coordinates and how a point P lying\
    \ in the plane OAB relates to A and B.\n\nTherefore, B × A provides the coefficients\
    \ of the equation of the plane OAB. In other words, P would satisfy the following\
    \ equation.\n\nP^T ⎛ yw − tv ⎞\n      ⎜ tu − xw ⎟ = P^T (B × A) = 0.   (8.3)\n\
