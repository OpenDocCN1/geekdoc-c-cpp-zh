    # 14.4.3 Mipmapping


    The final rendered primitive gets assigned a texture coordinate at every pixel
    in it. Therefore, one can think of the pixels in a triangle as samples of the
    texture image. For example, if one side of a triangle is rasterized to have 5
    pixels and is mapped along one side of the texture image that is 180 texels in
