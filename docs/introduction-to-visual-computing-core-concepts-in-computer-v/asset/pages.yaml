  md: '![](img/66c45bbed85bb7ba7f7b05dff49b5060_303_0.png)


    Figure 12.8. This figure shows some tablet based and other see-through-display
    based augmented reality systems.


    For example, light from the real world should interact with the virtual objects
    to make the experience believable. Also, it is worth appreciating that AR is a
    domain which sees a hand-in-hand functioning of computer vision and image synthesis.
    The real world needs to be reconstructed at some level to decide the location
    where virtual objects should be placed or merged.


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_303_1.png)


    Currently, we are seeing the advent of spatially augmented reality where real
    objects are augmented with projected light to change their appearance without
    encumbering the human being with a device. For example, a white model of Taj Mahal
    can be augmented with projected light to show the intricately detailed artwork
    in different illumination conditions starting from rosy dawn to white moonlight.
    Similarly, other cultural heritage artifacts can be restored to their original
    appearance using projected light, and movements or bumps can be simulated on static
    models using projected illumination (Figure 12.9).


    Figure 12.9. Real objects (left) augmented with light projected from three different
    projectors to create spatially augmented reality objects (right).


    VR, AR and spatially augmented reality all have many applications in many different
    domains. Augmenting a patient with previously captured 2D or 3D images that registered
    accurately with his body can make surgeries minimally obtrusive (e.g. extraction
    of tissue for biopsy). Inexpensive VR training environments for law enforcement
    departments can provide extensive training for officers before they face tough
    real situations. Visualization of large 3D data like seismic data or weather data
    is extremely crucial to predict and prepare for natural disasters.'
