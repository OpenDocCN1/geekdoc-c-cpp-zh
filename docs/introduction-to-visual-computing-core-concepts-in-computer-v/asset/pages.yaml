  md: 'where Z0 and Z1 are the depths of A and B respectively from the view point.
    The image plane is represented by the red line. The projection of the line on
    this image plane would be given by 1D coordinates s0 and s1. These are called
    the screen space coordinates of the 3D primitive. Let us assume that we have stored
    the depth of these two projected vertices - Z0 and Z1.


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_316_0.png)


    Let us now consider the future stage of scan conversion where we are interpolating
    the attributes of a point half-way between s0 and s1 in screen coordinates, i.e.
    (s0+s1)/2. Therefore, we will compute the depth of this point using the same interpolation
    coordinates as (Z0+Z1)/2. However, the depth of the object point C that is projected
    at the screen coordinate (s0+s1)/2 is not (Z0+Z1)/2. The green curve in the object
    space in Figure 13.6 plots the depth computed through linear interpolation in
    the screen space. e shows the difference between the actual depth and the linearly
    interpolated depth in the screen space. Of course, the shape of the green curve
    and the amount of error will change based on the exact positions of A and B.


    Figure 13.5. The shows two intersecting triangles viewed from a the shown view
    direction. The orange regions shows the visible parts of each triangle from this
    view direction which should be rendered after occlusion resolution.


    Therefore, the question is what kind of interpolation would yield the correct
    result? For this, let us consider the point (Xt, Zt) between A and B defined by
    the interpolation coefficient t in 3D. Therefore,


    ```

    Xt = X0 + t(X1 − X0)    (13.13)

    Zt = Z0 + t(Z1 − Z0)    (13.14)

    ```


    Let their projection on the image plane be between s0 and s1 defined by the 2D
    interpolation coefficient u, su. Therefore,


    ```

    su = s0 + u(s1 − s0) = X0/Z0 + u( X1/Z1 − X0/Z0 )    (13.15)

    ```


    Since su is the image of (Xt, Zt), we can derive the following.


    ```

    su = Xt / Zt    (13.16)

    ```


    ```

    Or,  X0/Z0 + u( X1/Z1 − X0/Z0 ) = [X0 + t(X1 − X0)] / [Z0 + t(Z1 − Z0)]    (13.17)

    ```'
