- pgno: 19
  md: '# Data


    In the context of visual computing, data can be thought of as a function that
    depends on one or more independent variables. For example, audio can be thought
    of as one dimensional (1D) data that is dependent on the variable time. Thus,
    it can be represented as A(t) where t denotes time. An image is data that is two
    dimensional (2D) data dependent on two spatial coordinates x and y and can be
    denoted as I(x, y). A video is three dimensional (3D) data that is dependent on
    three variables – two spatial coordinates (x, y) and one temporal coordinate t.
    It can therefore be denoted by V(x, y, t).


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_19_0.png)


    Figure 1.1. Most common visualization of 1D (left) and 2D (right) data. The 1D
    data shows the population of US (Y-axis) during the 20th century (specified by
    time in the X-axis) while the 2D data shows the surface elevation (Z-axis) of
    a geographical region (specified by X and Y-axes). This is often called height
    field.'
