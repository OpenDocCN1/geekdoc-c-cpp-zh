  md: 'Marr-Hildreth edge detector based on the name of scientists who first proposed
    it. The advantage of this detector is that it responds similarly to all different
    direction edges and finds the correct positions of the edges.


    The curvature of any 2D function is given by the sum of the directional curvatures
    in two orthogonal directions as


    ```

    ∇² f = ∂² f / ∂x² + ∂² f / ∂y²

    ```


    (5.7)


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_122_0.png)


    Figure 5.12. The Laplacian operator considering only four perpendicular neighbors
    (left) and considering all eight neighbors (right).


    The curvature at a pixel can be computed using finite differences for digital
    data. Curvature at a pixel (x, y) in x-direction is computed by the difference
    between the gradient g_x and g_{x+1} at (x, y) and (x+1, y) respectively. Therefore,
    curvature in this direction is given by


    ```

    g_x - g_{x-1} = f(x+1, y) - f(x) - (f(x-1, y) - f(x, y))

    ```


    (5.8)


    ```

    = f(x+1, y) - 2f(x) + f(x-1, y)

    ```


    (5.9)


    If we consider the same finite differences gradient in the vertical direction
    and add it to the above formula, the curvature operator will involve the pixel
    itself and its 4-connected neighbors to the left, right, top and bottom. Similarly,
    if the diagonal neighbors are also considered, the finite difference formula for
    curvature involves all the eight neighbors around a pixel, referred to as the
    8-connected neighbors. The filters thus formed as shown in Figure 5.12 are called
    the Laplacian operators. Once the image is convolved for Laplacian operator, pixels
    at which a zero crossing occurs are marked as edge pixels. In order to detect
    the zero crossings, first the convolved image is thresholded to retain values


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_122_1.png)


    Figure 5.13. This figure shows a 2D Gaussian filter, its derivative and a LoG
    filter along with their analog equations. Sampling these functions would generate
    the filters we have been discussing for edge detection.'
