    coordinates is given by


    P'' = (x'' y'' 1)^T = (x + t_x y + t_y 1)^T = [[1 0 t_x][0 1 t_y][0 0 1]] (x y
    1)^T = T(t_x, t_y) P  (6.5)


    Note that since the last element of P'' is 1, the last row of the matrix should
    be (0, 0, 1). We denote this translation matrix by T. Any translation matrix will'
