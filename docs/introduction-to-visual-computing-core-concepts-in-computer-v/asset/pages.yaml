    Finally, we will discuss one more parameter of a practical camera, the shutter
    speed. The sensor in the camera needs to be exposed for a limited time to capture
    the image. This exposure time is controlled by the shutter. When you hear a camera
    ‘click’, the shutter opens and remains so for sometime exposing the sensor to
    the light and then closes.


    The time the shutter is open has a linear effect on the amount of light that is
    let in. Usually the shutter is open for a fraction of a second (e.g. 1/30, 1/60).
    If any object in the scene moves during the time the shutter is open, the image
    of the object is captured at multiple locations creating an effect called the
    motion blur as shown in Figure 7.10.


    # 7.3 Conclusion


    In this chapter we covered the fundamental model of a pinhole camera and its application
    in 3D depth reconstruction and homography based modeling. A more mathematical
    treatise of this model is available in [Faugeras 93], the classical book on 3D
    computer vision. More about stereo reconstruction and camera calibration is available
    at [Szeliski 10]. Details about the practical camera can be explored further by
    taking a course on computational photography – [Lukac 10] offers a in depth treatise
    in this direction.


