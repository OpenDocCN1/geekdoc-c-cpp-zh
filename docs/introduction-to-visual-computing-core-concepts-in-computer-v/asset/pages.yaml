    # 14.10.2 Spatial Subdivision


    Object space subdivision using bounding volumes as seen in the previous section
    can adapt to unique shapes of the objects and are effective in applications such
    as collision detection and view frustum culling. However, in applications that
    requires computation of relative positioning of objects, for example, from a view
    point in a particular direction, spatial subdivision of the scene becomes more
    useful than object level subdivision. A few spatial subdivision techniques in
    3D include octree, k-d tree, and binary space partitioning. We will discuss octree
    subdivision in this section. For an in-depth treatise on other kinds of spatial
    partitioning techniques, refer to [Jimenez et al. 01].


    The octree is a tree data structure where each node has eight children nodes.
    The root node corresponds to the axis-aligned bounding box of the entire scene
    defined by minimum and maximum coordinates in the X, Y and Z directions. This
    bounding box is subdivided into half in each of the X, Y and Z directions to partition
    the space into eight equal sized bounding boxes, each associated with a child
    node of the parent. Therefore, the space associate with each child is completely
    contained in the space associated with its parent and the union of the spaces
    of all the children creates the space of its parent. This continues in a hierarchical
    manner for each child thus creating a tree in which every node has eight children,
    as shown in Figure 14.31. Note that there is no need to associate a bounding box
    with every node since the bounding box at the root node provides a predefined
    subdivision that defines the extent of every box in the tree which can be computed
    very easily during the tree traversal.


