    George Eastman (July 12, 1854–March 14, 1932) was an American innovator and entrepreneur
    who founded the Eastman Kodak Company and popularized the use of roll film making
    photography mainstream. Roll film was also the basis for the invention of motion
    picture film in 1888. Eastman was born in Waterville, New York as the youngest
    child of George Washington Eastman and Maria Eastman at the 10-acre farm which
    his parents bought in 1849. He was largely self-educated, although he attended
    a private school in Rochester after the age of eight. In the early 1840s his father
    had started a business school, the Eastman Commercial College in Rochester, New
    York, described as one of the first “boomtowns” in the United States, based on
    rapid industrialization. As his father’s health started deteriorating, the family
    gave up the farm and moved to Rochester in 1860 where his father died of a brain
    disorder in May 1862. To survive and afford George’s schooling, his mother took
    in boarders. The second of his two older sisters contracted polio when young and
    died in late 1870s when George was 16 years old. The young George left school
    early and started working to help support the family. As Eastman began to experience
    success with his photography business, he vowed to repay his mother for the hardships
    she had endured in raising him. He was a major philanthropist contributing to
    the establishments of many institutions, the most notable of them being the Eastman
    School of Music, schools of dentistry and medicine at the University of Rochester,
    the Rochester Institute of Technology (RIT), some buildings in MIT’s second campus
    on the Charles River and historically black institutions of the South Tuskegee
    and Hampton universities. In his final two years, Eastman was in intense pain
    caused by a disorder affecting his spine. On March 14, 1932, Eastman shot himself
    in the heart, leaving a note which read, “To my friends: my work is done. Why
    wait?”[2]. The George Eastman House, now operated as the International Museum
    of Photography and Film, has been designated a National Historic Landmark.


