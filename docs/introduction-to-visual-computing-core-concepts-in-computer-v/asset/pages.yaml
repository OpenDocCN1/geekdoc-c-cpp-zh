  md: 'Now, finally let us consider the perspective projection. We know from our camera
    calibration model in Chapter 7 that the perspective projection $(x_p, y_p)$ of
    3D point $(X, Y, Z)$ is given by


    ```

    $x_p = \frac{X n}{Z}$  (13.8)

    $y_p = \frac{Y n}{Z}$  (13.9)

    ```


    which can be expressed as


    ```

    \begin{pmatrix} x_p \\ y_p \\ n \\ 1 \end{pmatrix} = \begin{pmatrix} n & 0 & 0
    & 0 \\ 0 & n & 0 & 0 \\ 0 & 0 & n & 0 \\ 0 & 0 & 1 & 0 \end{pmatrix} \begin{pmatrix}
    X \\ Y \\ Z \\ 1 \end{pmatrix}  (13.10)

    = D(n) \begin{pmatrix} X \\ Y \\ Z \\ 1 \end{pmatrix}  (13.11)

    ```


    In our case, the 3D point is what we achieve after cuboid transformation. Therefore,
    the complete transformation is given by $D(n)S(\frac{2}{r-l}, \frac{2}{t-b}, 1)Sh_z(-\frac{l+r}{2n},
    -\frac{t+b}{2n})P_v$. Since this matrix depends only on the view frustum parameters
    $-r, l, t, b, n$ and $f$ – let us call this $L(n, r, l, t, b)$. Therefore,


    ```

    $L(n, r, l, t, b) = D(n)S(\frac{2}{r-l}, \frac{2}{t-b}, 1)Sh_z(-\frac{l+r}{2n},
    -\frac{t+b}{2n}),$  (13.12)

    ```


    and let $LP_v = P_i$.


    # 13.1.4 Occlusion Resolution


    The z coordinate $P_i$ will be $n$ always. This is expected since all the vertices
    are projected on the image plane at a depth of $n$. However, during image synthesis,
    the information about the depth of the projected vertex from the image plane or
    eye is very important to resolve occlusion and visibility.


    Consider the triangles $T_1$ and $T_2$ in Figure 13.5 that intersect in 3D and
    when viewed from the view direction different parts of these two triangles are
    visible. Therefore, during scan conversion at each pixel only one of $T_1$ and
    $T_2$ should be drawn accurately based on this visibility from the view direction.
    Therefore, the depth information at the vertices of the triangles is retained
    as an attribute of the projected vertex to be used later on to interpolate the
    depth of interior pixels.


    Let us consider this case of z-interpolation illustrated in Figure 13.6 in the
    projection of a 2D line between the points $A = (X_0, Z_0)$ and $B = (X_1, Z_1)$'
