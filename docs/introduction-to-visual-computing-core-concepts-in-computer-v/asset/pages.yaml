    # 1.1 Visualization


    The simplest visualization of a multi-dimensional data is a traditional plot of
    the dependent variable with respect to the independent ones, as illustrated in
    Figure 1.1. For example, such a visualization in 2D is called height field. However,
    as data becomes more complex, such visualization do not suffice due to the inherent
    inability of humans to visualize geometrical structures beyond three dimensions.
    Alternative perceptual modalities (e.g. color) are therefore used to encode data.
    For example, color image comprises of information of three color channels, usually
    red, green and blue, each dependent on two spatial coordinates (x, y) – R(x, y),
    G(x, y) and B(x, y). However, often visualizing these three functions together
    is much more informative that visualizing them as three different height fields.
    Thus, the ideal visualization is an image where each spatial coordinate is visualized
    as a color which is also a 3D quantity. Similarly, a 3D volume data T(x, y, z),
    providing scalar data at each 3D grid point, is visualized in 3D by assigning
    color or transparency to each grid point computed using a user defined transfer
    function f(T(x, y, z)) that is common to the entire data set (See Figure 1.2).


