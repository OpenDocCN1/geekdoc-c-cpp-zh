- pgno: 347
  md: 'are expecting these 5 pixels to sample a function of 180 pixels and provide
    an accurate representation. As we know from the Nyquist sampling criterion that
    this leads to undersampling and therefore incorrect reconstruction of the signal.


    This problem is illustrated in Figure 14.15. Let us consider the rasterized triangle
    on the right shown by the gray pixels. The center of these pixels are shown with
    different colored dots and the corresponding interpolated texture coordinates
    during rasterization are shown with similar colored dots on the texture. Note
    that since these coordinates sample the texture at much lower frequency than is
    desired to capture the stripes, though the triangle is supposed to get an appearance
    of green and white striping via texture mapping, it will end up appearing a flat
    green. This is the artifact of aliasing due to insufficient sampling of the texture
    via the pixels of the rendered triangle.


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_347_0.png)


    The best way to avoid this problem is to keep a Gaussian pyramid of textures where
    the texture is filtered to have different frequency cut offs. Based on the number
    of pixels in the rendered triangle an appropriate level of the Gaussian pyramid
    is chosen such that the pixels are more than double the size of the texture at
    that level and can therefore capture all the different frequencies in it adequately.


    Let us consider the texture to be of size 2^N × 2^N organized in a Gaussian pyramid
    with ln(N) levels where the image at level i, 1 ≤ ln(N), is of size 2^{N−i+1}
    × 2^{N−i+1}. Mipmapping offers a compact way to store this Gaussian pyramid. The
    size of the mipmapped RGB texture is 4 × 2^N × 2^N bytes. The image is divided
    into four quadrants, each of size 2^N × 2^N. Three of these are used to store
    the R, G and B channels of the first level of the Gaussian pyramid while the fourth
    one is used to store the next level RGB image of size 2^{N−1}×2^{N−1}. The fourth
    quadrant is recursively divided into four quandrants as before to store the R,
    G, and B components separately, and the fourth quadrant is again used to store
    the next level of the RGB image of size 2^{N−2}×2^{N−2}. This continues until
    the original image is filtered down to a single pixel image. The sequence of images
    is also called a Gaussian pyramid representation. During run-time the appropriate
    level of the pyramid is accessed based on the instruction provided in the application
    program. Figure 14.16 shows the mipmap organization and a scene rendered with
    and without mipmapping.


    Figure 14.15. The colors picked by the pixels of a rasterized triangle (right)
    from the texture (left). Note that though the texture is that of green stripes,
    the triangle will only get painted a flat green.'
