    visual computing — systems and their responses and how to find responses of arbitrary
    inputs to the systems. We have tried to give you a less mathematical and more
    engineering view of convolution which is directly applicable to digital image
    processing. To get a more mathematical treatise of the subject, especially considering
    general multi-dimensional continuous signals, please refer to [Pratt 07, Gonzalez
    and Woods 06].'
