    # 11.3.1 Handling Shadows


    One limitation of photometric stereo stems from the shadows. If any pixel (p,
    q) is in shadow in the image i, its importance should be undermined. To achieve
    a formulation where such confidence can be imparted to the accuracy of the recorded
    illumination, we can weight each equation in Equation 11.8 by the pixel intensity
    recorded. The pixels in shadow will therefore be given less weight due to their
    lower intensity. This gives us the equations


    ```

    \begin{pmatrix} I_1 \\ I_2 \\ . \\ . \\ . \\ I_n \end{pmatrix} - \rho \begin{pmatrix}
    I_1 L_1^x & I_1 L_1^y & I_1 L_1^z \\ I_2 L_2^x & I_2 L_2^y & I_2 L_2^z \\ \cdots
    \\ \cdots \\ \cdots \\ I_n L_n^x & I_n L_n^y & I_n L_n^z \end{pmatrix} \begin{pmatrix}
    N_x \\ N_y \\ N_z \end{pmatrix} = 0 \quad (11.22)

    ```


    that can be solved as before for more accurate normals.


    # 11.3.2 Computing Illumination Directions


    Photometric stereo computes the light directions also in addition to the surface
    geometry. To achieve this easily, one option is to put a chrome sphere of known
    radius r in the scene. This sphere will show specular highlights at different
    places'
