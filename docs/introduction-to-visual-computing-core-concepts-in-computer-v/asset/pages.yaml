- pgno: 124
  md: 'These are called missed edges. You can see this easily in 5.14 where most edges
    have a ghost and there are several spurious edges.


    Canny Edge Detector The Canny edge detector tries to alleviate all the various
    problems of the gradient and curvature based detectors. Canny first formalized
    a set of properties an optimal edge detector should have and then worked towards
    a method that satisfies these properties. According to Canny, an optimal edge
    detector should have the properties of good detection, good localization and minimal
    response. Good detection says that the filter should respond to edges only and
    not noise. Therefore, edges should be found with the minimum of spurious edges.
    Good localization means that the detected edge is near the true edge. Finally,
    minimal response says that the edge''s exact location is marked with a single
    point response. There is a tradeoff to be achieved between these different goals.
    In any real image, noise will play a role. Smoothing or low pass filtering will
    improve the detection at the cost of localization and minimal response. In fact,
    we see that both the methods we have discussed so far suffer from both inaccurate
    detection and localization.


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_124_0.png)


    Based on the above goals, Canny proposed a four step method: (a)Suppress noise
    using low pass filtering; (b) Compute gradient magnitude and direction images;
    (c) Apply non-maxima suppression to the gradient magnitude image; (d) Use hysteresis
    and connectivity analysis to detect edges.


    In the first stage, the image is low pass filtered using a Gaussian filter. Next,
    the gradient strength and direction are calculated using the standard Sobel operator.
    At this point, we have achieved the property of good detection and localization,
    but the property of minimal response is still not ensured. In order to ensure
    minimal response, we apply the technique of non-maxima suppression. The exact
    location of the edge occurs wherever the gradient reaches a maxima. This implies
    that if the strength of the gradient does not achieve a maxima at any of the marked
    pixels, it should be suppressed. Every marked pixel p can be part of an edge which
    can have one of four or eight orientations depending on 4 or 8 connectedness of
    the neighborhoods considered. The computed gradient p is binned to one of these
    values. Next the two neighbors with gradients in the same bin are considered.
    If the magnitude of their gradient is larger than that of p, the gradient at p
    is suppressed (made zero). Applying this operation to every marked pixel achieves
    the minimal response with each edge being detected by a single pixel.


    Figure 5.15. This shows that the zero crossing may not happen at a single pixel
    location to provide a good edge localization.'
