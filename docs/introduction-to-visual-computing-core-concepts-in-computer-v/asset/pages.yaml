- pgno: 256
  md: '# 10.4 Limitations


    At this point, it is very important to point out that a single image from a device
    cannot really reproduce exactly how the humans perceive the scene. The limitations
    in any color reproduction mechanism stem from two fundamental reasons – the range
    of brightness and the range of colors (chromaticity coordinates) that a device
    can capture or reproduce are usually smaller than what is found in nature. We
    have already seen this in the context of chromaticity coordinates. It is evident
    that no 3-primary device can reproduce the entire color gamut that is perceived
    by a human since any triangular 2D color gamut will leave some part of the chromaticity
    chart uncovered.


    The same phenomenon happens for brightness. Let us consider Figure 10.12(top).
    The brightness in any scene can range from 10⁻² lumens (in shadows of trees on
    a moon-lit night) to 10¹⁰ (in sky on a bright sunlit day). This is a huge variation
    and is hence plotted in log scale. The response of the human eye to these brightness
    range is not as shown by the black dotted line. Instead, at any particular time,
    the human eye can only perceive a smaller subset of this large range of brightness
    – maybe only 3-4 orders of magnitude. This means the human eye can perceive a
    contrast ratio or dynamic range of about 1:10,000. In contrast, the dynamic range
    that can be reproduced by 8-bit device is usually of the order of 1:100.


    Further, based on the brightness of different parts of the scene our eye can quickly
    adapt to the most appropriate range that should be sensed to gather the maximum
    information. We have all experienced this, especially when our eye goes through
    a drastic adaptation, like when we are blinded for some time when we come out
    to brightly lit outdoors from a dark room, only to get adapted to the new condition
    quickly. This flexible adaptation capability of the human eye at different brightness
    level is illustrated by the different colored curves in Figure 10.12(top). Each
    curve is linear only within a range of illumination beyond which it saturates.
    Given a particular illumination level, the curve which provides a linear response
    around that range of illumination provides the curve in which the eye is responding
    to the scene. Therefore, when given a scene as Figure 10.12(bottom), the eye adapts
    to a higher range of brightness to extract information of the appearance of the
    sky and then to a lower range of brightness to extract the information of the
    objects like houses, roads and cars. Then it combines all this information to
    create a mental picture similar to the combination of these two. In this section,
    we discuss a few ways by which we address the limited capability of usual devices
    when compared to the human eye.


    # 10.4.1 High Dynamic Range Imaging


    High dynamic range imaging is a technique by which we mimic the dynamic range
    of the human eye and create an image that can have a contrast similar'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'to the human eye or even as high as what is present in nature. Here images
    are captured at different camera settings so that different amounts of light illuminate
    the sensor. When more light illuminates the sensor, we capture the darker parts
    of the scene while the brighter parts of the scene over-saturate the sensor creating
    ‘burned out’ or over-exposed regions. When less light illuminates the sensor,
    we capture the brighter part of the scene while the darker parts of the scene
    under-saturate the sensor creating under-exposed regions. Therefore, by capturing
    different images and allowing different levels of light to impinge on the sensor,
    different parts of the scene get captured while others are either under or over
    exposed. But, by combining the information from all these pictures, information
    in all parts of the scene can be gathered creating one high dynamic range image
    that has a much higher dynamic range than what is available to us via any standard
    8-bit image capture.


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_257_0.png)


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_257_1.png)


    Figure 10.12. Top: This figure illustrates the adaptive dynamic range of the eye.
    Each colored curve shows how the response of the eye spans a range of brightness
    much smaller than the total range of brightness available in nature. At any instant
    the response of the eye is linear within this small range. The black dotted lines
    show the hypothetical response if there was no adaptation to different ranges
    of brightness and the eye had a response that spanned the entire dynamic range
    available in nature. Bottom: This shows how the eye processes information from
    capturing the different parts of the scene in an appropriate dynamic range.


    Therefore, the obvious question is, how do we control the light that illuminates
    the sensor to create a high dynamic range image? This can be done by changing
    the exposure of the camera which can, in turn, be achieved either by changing
    the aperture size of the camera or the shutter speed. Shutter speed dictates the
    amount of time the shutter is open to expose the camera sensor to light. Usually
    the latter control is chosen for a reason that is completely device dependent.
    As the aperture of the camera changes, due to the complex lens system, the light
    that reaches the center of the sensor is not the same as that which reaches the
    periphery.


    In fact, the amount of'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'light reaching different pixels of the sensor shows a steady fall-off from
    center to periphery. This is often called the *vignetting effect* of a camera.
    The vignetting effect in a camera is minimal at low apertures (*f*/8 or below)
    when the camera is closest to the pinhole model. At other aperture settings the
    vignetting effect is considerable thereby influencing the accuracy of the light
    sensed at each pixel. Therefore, it is better to use the shutter speed (and not
    change aperture) to change the exposure to minimize the inaccuracies due to the
    different vignetting effects at different aperture settings.


    Let us now consider a static scene captured by a camera using *n* different shutter
    speeds. For the *j*th shutter speed, 1 ≤ *j* ≤ *n*, let the time for which the
    shutter is open be given by *t_j*, the number of pixels in the image captured
    by the camera be *m*, the gray scale value captured at *i*th pixel, 1 ≤ *i* ≤
    *m*, be *Z_ij*, the scene irradiance at the *i*th pixel be *E_i*, and the camera
    transfer function be *f*. Therefore, for any *i* and *j*, we can model the imaging
    process as


    $$Z_{ij} = f(E_i t_j).$$ (10.22)


    Assuming that *f* is monotonic and invertible, we can write the above equation
    as


    $$f^{-1}(Z_{ij}) = E_i t_j.$$ (10.23)


    Assuming a natural logarithm of both sides, we can write this equation as


    $$g(Z_{ij}) = ln\ E_i + ln\ t_j$$ (10.24)


    where *g* = *ln f*^{-1}. In this equation, *t_j* and *Z_ij* are known and *E_i*
    and *g* are unknown. For every pixel *i*, for every shutter speed *j*, we can
    write one such equation leading to a system of *mn* linear equations. *g* is a
    function with 256 values for a 8-bit device. Therefore, we will need to solve
    *m* + 255 unknowns from set of *mn* over-constrained linear equations using linear
    regression. To constrain the *g* to be monotonic, we can add additional constraints
    to the system of equations. We can even add curvature constraints to assure the
    *g* is smooth. The solutions of these equations will provide a high dynamic range
    image as shown in Figure 10.13.


    However, a high dynamic range image brings forth the obvious question of how can
    we display it? Its range of brightness and contrast are many orders of magnitude
    beyond what a traditional 8-bit display can do. Seeking the solution to this problem
    has created a large body of research literature on designing complex, often spatially
    varying, tone mapping operators that can take this huge range of contrast and
    successfully compress it within the range (usually 0-255) that can be reproduced.
    The basic idea behind the tone mapping operators is to create the effect of spatially
    varying exposure such that every region is exposed the right amount to reveal
    information (Figure 10.13) without getting under or over saturated. Though such
    an image may not look photo-realistic since we are'
