    # Liquid Crystal Displays (LCD):


    LCD displays are a spatial array of red, green and blue segments, each of which
    is a colored filter over a cell of liquid crystal material that can be made variably
    transparent. A backlight shines through the LCD array so that the resulting color
    is a function of both the backlight and the filters. However, colored filters
    are significantly different than colored phosphors. The more intensely colored
    (saturated) the filter is, the less light it will pass making the display dim.
    The less saturated the filters, the brighter the display but it is also a lot
    less colorful. Thus, to get a highly bright and colorful display, very bright
    backlights are needed in addition to saturated color filters. But a trade-off
    needs to be made due to the huge power consumption. When compared to the gamut
    of the CRT displays, the blues of the LCD displays are often much less saturated.


