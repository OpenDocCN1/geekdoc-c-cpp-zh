  md: '# 14.6 Environment Mapping


    In the real world, we often see objects that are extremely shiny (Figure 14.21).
    Environment mapping, also referred to as reflection mapping, is a technique used
    in computer graphics to render such shiny objects interactively. The key feature
    of a very shiny object is that you can find the entire environment reflected off
    it. Sometimes the environment in which people are (e.g. home, cafe) are not inside
    the field of view of rendering, but can be deduced from the reflection of this
    environment off the rendered shiny object. However, to create such an effect can
    be quite expensive via accurate tracing of light rays between the object and the
    environment. Such accurate rendering will also show the effects of self-reflection
    (e.g. the handle of the teapot reflected off its main body as in Figure 14.21).
    As we already know, this is rather complicated to achieve in interactive graphics.


    We can achieve a rudimentary approximation of the accurate reflection of the environment
    off a shiny object by first creating, what we call an environment map. This is
    a simple geometry (e.g. a cube or a sphere) on which the environment is mapped.
    In real world, this can be achieved by taking an image using a fish eye lens.
    This image has 180 and 90 degrees horizontal and vertical field of view respectively.
    Two such images (left and right or top and bottom hemispheres) can create a spherical
    environment map. For a digital scene, one can employ a multi-pass rendering of
    a digital scene, where each pass generates a face of a cube of a cubic environment
    map. Six passes will be required to capture the entire field of view from a viewpoint
    placed at an appropriate loca-


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_351_0.png)


    Figure 14.21. Examples of real world shiny objects.


    ![](img/66c45bbed85bb7ba7f7b05dff49b5060_351_1.png)


    Figure 14.22. This shows a cubic and spherical environment map. The cubic map
    is shown unfolded (middle) and is generated by using a 6-pass rendering each rendering
    a face of a cube (left) seen from the center of the cube. The spherical map (right)
    is generated from images of a cafe taken using a fish-eye lens camera.'
  merge: -1
  img_proc: true
- pgno: 352
  md: 'tion, maybe the center of the object on which the environment will be mapped.
    Alternatively, a spherical environment map can also be created by a ray tracing
    process where rays are traced from the center of the sphere out to the environment.
    The color of the point in the environment where the ray hits first is used to
    color the point where the ray meets the sphere. Figure 14.22 shows an example
    of a cubic and spherical environment map.


    # Fun Facts


    Reflection mapping have been used in movies for a long time, especially on robots
    in science fiction movies, even before it became a common computer graphics technique.
    The technique was developed independently by Gene Miller working with Ken Perlin,
    and also by Michael Chou working with Lance Williams, around 1982 or 1983. The
    first two instances in which reflection mapping was used to place objects into
    scenes were of a synthetic shiny robot standing next to Michael Chou in a garden,
    and of a reflective blobby dog floating over a parking lot. In 1985, Lance Williams
    was part of a team at the New York Institute of Technology who used reflection
    mapping in a moving scene with an animated CG element in a piece called “Interface”
    that featured a young woman kissing a shiny robot. In reality, she was filmed
    kissing a 10-inch shiny ball, and the reflection map was taken from the reflection
    of the ball. The first feature film to use the technique was Randal Kleiser’s
    Flight of the Navigator in 1986 to render a shiny morphing spaceship flying over
    and reflecting fields, cities, and oceans. Its ground breaking appearance as an
    instrument concept exhibited through a movie was in films by James Cameron, The
    Abyss and Terminator 2.


    Once the environment map is generated, it is mapped onto an arbitrary shaped object
    in a fashion which is very similar to texture mapping on complex surfaces, but
    is guided by the location of the viewer with respect to the object. In Figure
    14.23, let us consider the arbitrary blue shape to be environment mapped. Let
    us consider a spherical map enclosing it. Let P be a vertex on the object whose
    environment map coordinates (i.e. the coordinates on the spherical map whose color
    will be picked to color P) we would like to compute. Let V be the view vector
    usually achieved by connecting the viewpoint to P. Let N be the normal at P. Reflecting
    V about N creates the vector R. Note that if the blue shape were mirror like shiny
    object, the 3D point where R hits the environment will be the color seen by the
    viewer after getting reflected off P. This point is captured by the point Q where
    a ray R′ parallel to R passing through the center of the spherical map intersects
    the environment map. Therefore, the point Q will be mapped on to P thereby imparting
    its color to P.'
