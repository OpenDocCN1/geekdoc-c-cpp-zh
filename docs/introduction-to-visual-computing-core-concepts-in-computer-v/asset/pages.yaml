  md: 'where $(x_l, y_l)$ is the 2D point on $M_l$ denoted by the normalized homogeneous
    coordinates $(x_l, y_l, 1)$. Alternatively,


    ```

    $(x_l\ y_l\ 1)\begin{pmatrix} yw - tv \\ tu - xw \\ xv - yu \end{pmatrix} = (x_l\
    y_l\ 1)(B \times A) = 0. \qquad (8.7)$

    ```


    Therefore, $B \times A$ defines the coefficients for both the equation of the
    line $M_l$ or equation of the plane $OAB$ based on whether we are considering
    normalized or un-normalized homogeneous coordinates. We will use this fact effectively
    in many places when working with epipolar geometric constraints. Also, *we will
    be using the coefficient matrix of a line to describe the line itself*. Therefore,
    where we define a line $l$ as


    ```

    $l = \begin{pmatrix} a \\ b \\ c \end{pmatrix}, \qquad (8.8)$

    ```


    we refer to a line $l$ with slope $\frac{a}{b}$ and offset $\frac{c}{b}$, as derived
    from the above equations. This notation will be used frequently in the rest of
    this chapter.


    Now note that


    ```

    $B \times A = \begin{pmatrix} yw - tv \\ tu - xw \\ xv - yu \end{pmatrix} = \begin{pmatrix}
    0 & w & -v \\ -w & 0 & u \\ v & -u & 0 \end{pmatrix} \begin{pmatrix} x \\ y \\
    t \end{pmatrix} = [B]_\times A \qquad (8.9)$

    ```


    The left matrix is a special matrix with only the coordinates of $B$ as its entries
    and hence is called $[B]_\times$. Note that $[B]_\times$ is a symmetric matrix,
    i.e. $[B]_\times = [B]_\times^T$. Now, since $P$ satisfies Equation 8.3, the following
    equation will hold.


    ```

    $P^T([B]_\times A) = 0 \qquad (8.10)$

    ```


    In fact, it can also be shown that


    ```

    $P^T([B]_\times A) = (A^T[B]_\times^T)P = 0 \qquad (8.11)$

    ```


    Take a special note of the dimensions of the matrices and you will find the result
    to be a $1 \times 1$ scalar. Also, the determinant of $[B]_\times$ is 0 and all
    the $2 \times 2$ sub-matrices have non-zero determinant. Therefore, $[B]_\times$
    is a rank 2 matrix.


    # 8.2 Correspondences in Multi-View Geometry


    Consider two cameras, $C_1$ and $C_2$ for stereo depth reconstruction (Figure
    8.2). Let their center of projection be $O_1$ and $O_2$ and image planes be $I_1$
    and $I_2$ respectively. The line segment $O_1O_2$ is called the *baseline*. The
    baseline should be of non-zero length in order to perform stereo reconstruction
    i.e. $O_1 \neq O_2$. Let us consider a 3D point $P$ and let its image on $C_1$
    and $C_2$ be $p_1$ and $p_2$ respectively. Let us now make some observations about
    this geometric setup.'
