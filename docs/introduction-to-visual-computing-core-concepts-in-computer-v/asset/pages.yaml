    # 1.2.2 Quantization


    A analog or continuous signal can have any value of infinite precision. However,
    whenever it is converted to digital signal, it can only have a limited set of
    value. So a range of analog signal values is assigned to one digital value. This
    process is called quantization. The difference between the original value of a
    signal and its digital value is called the quantization error.


    The discrete values can be placed at equal intervals resulting in uniform step
    size in the range of continuous values. Each continuous value is usually assigned
    the nearest discrete value. Hence, the maximum error is half the step size. This
    is illustrated in Figure 1.6.'
