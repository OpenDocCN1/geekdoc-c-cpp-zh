    # 11.2 Image Composition


    Compositing images is another important application of color image processing.
    In this section we will discuss a number of methods to achieve this. Image composition
    is quite commonly used in the entertainment industry where often virtual objects
    or characters from past or artistic effects have to be worked in the images/videos
    captured.


    The simplest technique for image composition is by using sprites – currently available
    in Photoshop as a feature called intelligent scissors. Sprites are parts cut out
    from an image I given by S × I where S is a binary image called the sprite mask
    with 1 for the pixels included in the sprite, and × indicates pixel-wise multiplication.
    A sprite is defined for each image to be used in the composition. These sprites
    are then appropriately translated and scaled and placed in layers on top of each
    other in a specific order. Figure 11.9 shows an example where I₁ is a picture
    of downtown Seattle and I₂ is a picture of Bill Gates. Two sprites S₁ and S₂ are
    defined each scissoring out the foreground from I₁ and I₂ respectively. Therefore,
    three layers I''₁, I''₂ and I''₃ are defined as


    I''₁ = I₁ × S₁ (11.3)

    I''₂ = I₂ × S₂ (11.4)

    I''₃ = I₁ × S''₁ (11.5)


    The combined image I is created by overlaying translated and scaled I''₁, I''₂
    and I''₃. I''₃ provides the first layer of the background made by the sky in I.
    This is then overlaid by the the image of Bill Gates formed by I''₂ which is in
    turn overlaid by the image of the city I''₁. Note that overlaying means replacing
    the pixels in I'' wherever the sprite is 1. However, such overlaying of pixels
    hardly work. For example in Figure 11.10, I₁ multiplied with sprite S₁ is overlaid
    on I₂ to create I. Mathematically, the operation can be expressed as I = I₁S₁
    + I₂(1 − S₁). But the pawn does not look like it is placed on the chess board,
    rather it looks pasted on the chess board. This problem is addressed by the image
    blending operation.


    # 11.2.1 Image Blending


    Sprite is binary and only allows for complete retention or removal of a pixel
    of the source image in the composited image. So the sprites do not work while
    compositing images with transluscent objects where the background is partially
    visible through the foreground, or when compositing images with furry objects'
