  \n| 谜题 8 | 会移动吗？ |\n[will-it-move.cpp](http://media.pragprog.com/titles/akbrain/code/will-it-move.cpp)\
  \ |\n\n```cpp\n#include <iostream>\n\nstruct Member {\n};\n\nstruct WillItMove {\n\
  \    WillItMove() = default;\n    WillItMove(WillItMove &&) = default;\n    const\
  \ Member constMember_{};\n};\n\nint main() {\n    WillItMove objectWithConstMember;\n\
  \    WillItMove moved{std::move(objectWithConstMember)};\n    std::cout << \"It\
  \ moved!\\n\";\n}\n```\n\n| 猜猜输出 |\n| :--- |\n| ![images/aside-icons/important.png](img/important.png)\
  \ 在移动到下一页之前尝试猜猜输出是什么。 |\n\n![images/hline.png](img/hline.png)\n\n\n\n\n程序显示如下输出：\n\
  \n| | 它移动了！ |\n\n![images/hline.png](img/hline.png)\n\n### 讨论\n\n`WillItMove` 有一个\
  \ `const` 成员。你不能从一个 `const` 对象移动，那么为什么我们仍然从 `objectWithConstMember` 移动呢？\n\n在这个谜题中，我们首先初始化了一个\
  \ `WillItMove` 对象 `objectWithConstMember`。在接下来的行中，我们初始化了一个新的 `WillItMove` `moved{std::move(objectWithConstMember)};`。`WillItMove`\
  \ 没有拷贝构造函数，所以初始化 `moved` 的唯一选择是移动构造函数。但移动构造函数如何从 `const` 成员 `constMember` 移动呢？\n\
  \n让我们从外向内挖掘。\n\n首先，`std::move(objectWithConstMember)`做了什么？`std::move` 实际上并没有移动任何东西；它只是将左值\
  \ `objectWithConstMember` 转换为右值。然后，这个右值被用于初始化 `moved`。\n\n| 左值与右值 |\n| --- |\n|\
  \ ![images/aside-icons/note.png](img/note.png) | 左值与右值是分类表达式的一种方式。左值是一个求值为某个实际对象的表达式，该对象具有标识且无法从中移动。例如，表达式\
  \ `objectWithConstMember` 求值为 `objectWithConstMember` 对象。它有名称且在内存中有位置，且其他人可能仍在使用它，因此类型系统不允许我们从它处移动。传统上，左值倾向于出现在赋值操作的左侧，因此名为左值（left-value）。另一方面，右值是一个求值为可以从中移动的内容的表达式，例如一个任何其他人都无法获取的临时变量。右值倾向于出现在赋值操作的右侧，因此名为右值（right-value）。`std::move`\
  \ 将左值转换为右值，这是我们告诉类型系统“没关系，你可以继续从这个左值移动；我不再使用它了”的方法。随着 `std::move` 的引入，左值出现在赋值右侧（在\
  \ `std::move` 内部）变得越来越常见，因此“左值”与“右值”的记忆法没有以前那么好用了。有关左值、右值以及其他值类别的完整概述，请参见 Lvalues,\
  \ Rvalues, Glvalues, Prvalues, Xvalues, Help!^([9)。 |\n\n注意，尽管我们从一个右值初始化 `moved`，但这并不意味着我们需要使用移动构造函数来初始化它！我们只需要任何能够绑定到右值的构造函数。`const`\
  \ 左值引用可以绑定到右值，所以如果我们有拷贝构造函数，也可以使用它。然而，我们没有，所以 `WillItMove` 的移动构造函数是我们的唯一选择。\n\n\
  `WillItMove` 的移动构造函数已经通过 `WillItMove(WillItMove &&) = default;` 这一行被显式默认了，所以让我们关注默认移动构造函数做了什么。它如何能从一个\
  \ `const` 成员移动呢？\n\n显式默认的移动构造函数使用源对象中的相应成员直接初始化所有子对象。本质上，它的定义类似于如下：\n\n```cpp\n\
  [examples/default-move/default-move.cpp](http://media.pragprog.com/titles/akbrain/code/examples/default-move/default-move.cpp)\n\
  ```\n\n| | Class(Class &&other) : |\n| | BaseClass1{std::move(other)}, |\n| | BaseClass2{std::move(other)},\
  \ |\n| | /* ... */ |\n| | member1_{std::move(other).member1_}, |\n| | member2_{std::move(other).member2_}\
  \ |\n| | /* ... */ |\n| | {} |\n\n所以对于我们的类 `WillItMove`，它看起来如下：\n\n```cpp\n[examples/default-move/default-move.cpp](http://media.pragprog.com/titles/akbrain/code/examples/default-move/default-move.cpp)\n\
  ```\n\n| | WillItMove(WillItMove && other) : |\n| | constMember_{std::move(other).constMember_}{}\
  \ |\n\n同样，即使 `std::move(other).constMember_` 是一个右值，我们也不一定需要使用 `Member` 的移动构造函数来初始化\
  \ `constMember_`。拷贝或移动构造函数，只要可以绑定到 `std::move(other).constMember_` 即可。由于我们没有为 `Member`\
  \ 声明任何特殊的成员函数，它隐式地获得了默认的拷贝构造函数和默认的移动构造函数。其中一个能绑定到 `const` 右值 `other.constMember_`\
  \ 吗？\n\n`Member` 的隐式默认移动构造函数声明如下：\n\n| | Member(Member&&) |\n\n非 `const` 右值引用不能绑定到\
  \ `const` 右值，因此我们无法使用移动构造函数直接初始化 `constMember_`。\n\n`Member` 的隐式默认拷贝构造函数声明如下：\n\n\
  | | Member(const Member&) |\n\n常量左值引用可以绑定到 `const` 右值，因此我们可以使用拷贝构造函数直接初始化 `constMember_`。\n\
  \n因此，`WillItMove` 的显式默认移动构造函数使用了 `Member` 的拷贝构造函数而非 `Member` 的移动构造函数来初始化 `constMember_`。\n\
  \n### 扩展阅读\n\n移动构造函数\n[`en.cppreference.com/w/cpp/language/move_constructor`](https://en.cppreference.com/w/cpp/language/move_constructor)\n\
