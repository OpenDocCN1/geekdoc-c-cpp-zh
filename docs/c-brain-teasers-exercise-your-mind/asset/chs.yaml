  \n\n# 前言\n\nC++ 是使用最广泛、最古老的编程语言之一。它以把所有默认行为搞错而闻名，而且正如 C++ 社区著名的例子所说，它能让你鼻子里飞出恶魔。[[3]](#f_0010.xhtml_FOOTNOTE-3))\
  \ 你找不到更适合编程脑筋急转弯的书了！\n\n通过 25 个谜题，我们将探索 C++ 底工作的，包括它的一些重要特性。为了充分利用这本书，你应该具有一些编写\
  \ C++ 的经验，并熟悉语言的基础，包括简单的面向对象编程和模板。\n\n完成这本书后，你将对初始化、生命周期、重载解析、隐式转换、继承、未定义行为等主题有更深入的理解。但重要的是，我希望你对\
  \ C++ 的真实工作原理产生好奇心，即使只有少数几个答案能涵盖在这本书里。\n\n## 如何使用这本书\n\n书中包含了 25 个 C++ 谜题，并附有答案和解释。大多数将是格式良好的程序，C++\
  \ 标准保证其输出。然而，某些程序可能存在编译错误，另一些可能存在未定义或未指定的行为。你的任务是找出在符合标准的 C++ 实现上编译并运行每个谜题中的程序时会发生什么。\n\
  \n以这个虚拟的谜题为例，它是一个带有 `main` 函数的完整 C++ 程序：\n\n```cpp\n#include <iostream>\n\nint main()\
  \ {\n  std::cout << (1 < 2);\n}\n```\n\n你的任务是阅读代码，并尝试猜测程序在编译运行时的输出会是什么。在翻页查看答案之前，请务必自己尝试一下！\n\
  \n请注意以下技术细节：\n\n* 为了简洁起见，我定义的 `main` 没有参数（没有 `argc` / `argv`），且没有显式返回数值。这些都是可选的，省略它们会让谜题更容易读。\n\
  * 我在所有的谜题中使用 `struct` 替代了 `class`。这在语义上没有区别——`struct` 的成员默认可见性是公有的而不是私有的，所以我们不需要到处写\
  \ `public:`。\n* 像 C++ 中一常一样，`bool` 默认打印为 `1` 和 `0`，而不是 `true` 和 `false`。\n\n该谜题的答案是\
  \ `1` 小于 `2`，所以程序打印 `1`（代表真）。\n\n然而，答对答案只有一半乐趣。另一半是理解它为什么那样运行。谜题是学习更多 C++ 底工作原理的借口。我鼓励你仔细阅读解释，直到理解它们。\n\
  \n## 未定义行为 (Undefined Behavior)\n\n某些谜题可能包含未定义行为。未定义行为是在程序执行期间发生坏事时的术语，编译器无法（或更具体地说，不需要）检测到它。例如，我们可能会访问数组边界外的元素，或者符号整数的算术表达式可能会溢出。在这些情况下，C++\
  \ 标准对实现没有任何限制，任何事情都可能发生，包括鼻恶魔。如果一个谜题有未定义行为，你的任务不仅要识别出未定义行为，还要猜测在典型系统上实际上会发生什么。它是真的让恶魔从鼻子里飞出来，还是发生了特定的事情？\n\
  \n再次，让我们来看一个例子：\n\n```cpp\n#include <iostream>\n#include <limits>\n\nint main()\
  \ {\n  std::cout << std::numeric_limits<int>::max() + 1;\n}\n```\n\n算术中的符号整数溢出是未定义行为，所以如果你识别出了这一点，你就成功了一半！\n\
  \n对未定义行为情况下会发生什么做假设是一个坏主意。所以让我们接着做这件事吧！对于任何具有未定义行为的谜题，另一半任务是找出在你的电脑上运行该程序会发生什么。我的电脑对符号整数使用补码（C++20\
  \ 之后的所有标准实现也是如此），我的 CPU 在溢出时不会产生异常。因此，当我给最大的正整数加 `1` 时，值直接回绕到最小负整数。由于我的系统使用 32 位\
  \ `ints`，程序打印 `-2147483648`。你不需要知道那个精确数值，但如果你猜到会打印最小负整数，你就解决了它！\n\n| 不要要在家里这样做 |\n\
  | --- |\n| ![images/aside-icons/warning.png](img/warning.png) | 猜测或测试未定义行为情况下发生什么是一个有趣的练习，可以让你更多地了解\
  \ C++ 在你平台上的工作方式。它还可能让你在真实程序中看到某些错误模式发生时识别出它们。但不要根据你的发现就对你的真实程序做任何假设！你的假设在其他电脑上、升级编译器后或当你使用不同的优化设置编译时可能是不成立。如果编译器能证明存在未定义行为，它甚至允许从你的代码中移除错误检查！\
  \ |\n\n## 未指定的和实现定义的行为 (Unspecified and Implementation-Defined Behavior)\n\nC++\
  \ 标准并没有严格规定所有内容；它为实现留了一些自由空间。以下是一些例子：\n\n* 整数类型的具体大小\n* 函数参数的求值顺序\n* 全局变量的初始化顺序\n\
  \n这允许每个实现根据该特定系统做出最合理的选择。\n\n大多数程序都具有一些未指定的或实现定义的行为；这并不是 bug。而且与未定义行为相反，恶魔不会从你鼻子里飞出来。只是不同的实现在允许的行为范围内表现可能略有不同。\n\
  \n如果一个谜题有未指定的或实现定义的行为，请尝试也猜一下典型的行为是什么。\n\n## 动手实践代码\n\n学习任何与编程相关知识最重要的部分就是自己动手。书中的代码可以在\
  \ The Pragmatic Bookshelf 的主页找到[[4]](#f_0010.xhtml_FOOTNOTE-4)。你可以通过在你喜爱的 IDE 或命令行中打开\
  \ `CMakeLists.txt` 来本地构建它：\n\n```bash\nmkdir build\ncd build\ncmake ..\ncmake --build\
  \ .\n```\n\n该项目每个谜题包含一个 `.cpp` 文件，每个文件生成一个二进制文件，命名均与书中对应的谜题相同。\n\n\n\n\n\n你也可以通过将代码粘贴到在线编译器中并在浏览器中直接运行。我强烈推荐使用\
  \ Compiler Explorer，[[5]](#f_0010.xhtml_FOOTNOTE-5)，你可以在那里选择并比较不同的编译器版本和架构，尝试不同的优化级别，并添加其他编译器标志、清理选项等。\n\
  \n让我们开始吧！噢，注意那些恶鬼。\n\n### 脚注\n\n[[3]](#f_0006.xhtml_FNPTR-3)\n\n[鼻腔恶鬼 (Nasal Demons)\
  \ - 计算机术语词典](http://catb.org/jargon/html/N/nasal-demons.html)\n\n[[4]](#f_0010.xhtml_FNPTR-4)\n\
  \n[`pragprog.com/titles/akbrain`](https://pragprog.com/titles/akbrain)\n\n[[5]](#f_0010.xhtml_FNPTR-5)\n\
  \n[`godbolt.org`](https://godbolt.org)\n\n\n# 第一部分\n\nC++ 脑筋转弯\n\n### 谜题 1：多少？\n\
  \n[how-many-degrees.cpp](http://media.pragprog.com/titles/akbrain/code/how-many-degrees.cpp)\n\
  \n```cpp\n#include <iostream>\nstruct Degrees {\n  Degrees() : degrees_(0) {\n \
  \   std::cout << \"Default constructed\\n\";\n  }\n  Degrees(double degrees) : degrees_(degrees)\
  \ {\n    std::cout << \"Constructed with \" << degrees_ << \"\\n\";\n  }\n  double\
  \ degrees_;\n};\n\nstruct Position {\n  Position() : latitude_{1} { longitude_ =\
  \ Degrees{2}; }\n  Degrees latitude_;\n  Degrees longitude_;\n};\n\nint main() {\n\
  \  Position position;\n}\n```\n\n**猜输出**\n![images/aside-icons/important.png](img/important.png)\
  \ 在进入下一页之前，尝试猜一下输出。\n\n程序显示以下输出：\n\n```\nConstructed with 1\nDefault constructed\n\
  Constructed with 2\n```\n\n### 讨论\n\n`Position` 结构体有两个类型为 `Degrees` 的成员。其中一个在成员初始化列表中初始化，另一个在构造函数体内初始化。那么，为什么我们看到了三个\
  \ `Degrees` 对象被构造呢？\n\n在进入构造函数体之前，所有类成员都会被初始化。如果你显式地初始化成员（如我们对 `latitude_` 所的操作），则将使用该初始化。如果你没有（如\
  \ `longitude_` 的情况），该成员将会被默认初始化，这就是为什么我们看到打印了 `Default constructed` 行。在所有成员初始化完成后，我们最终进入构造函数体，初始化一个临时对象\
  \ `Degrees{2}`，然后将其拷贝赋值给之前默认初始化的 `longitude_`。\n\n请注意，你不需要在成员初始化列表中显式初始化成员，而是直接在成员声明中使用默认成员初始化，如下所示：\n\
  \n```cpp\nstruct Position {\n  Position() { longitude = Degrees{2}; }\n  Degrees\
  \ latitude{1}; // 默认成员初始化\n  Degrees longitude;\n};\n```\n\n如果你有多个构造函数，使用默认成员初始化是一个好主意。这样你就不需要记住在每个成员初始化列表中包含该成员。\n\
  \n### 扩展阅读\n构造函数与成员初始化列表\n[`en.cppreference.com/w/cpp/language/constructor`](https://en.cppreference.com/w/cpp/language/constructor)\n\
  \n### 谜题 2：字符串理论\n\n[string-theory.cpp](http://media.pragprog.com/titles/akbrain/code/string-theory.cpp)\n\
  \n```cpp\n#include <iostream>\n#include <string>\nvoid serialize(const void*) {\
  \ std::cout << \"const void*\"; }\nvoid serialize(const std::string&) { std::cout\
  \ << \"const string&\"; }\n\nint main() {\n  serialize(\"hello world\");\n}\n```\n\
  \n**猜输出**\n![images/aside-icons/important.png](img/important.png) 在进入下一页之前，尝试猜一下输出。\n\
  \n程序显示以下输出：\n\n```\nconst void*\n```\n\n### 讨论\n\n为什么向 `serialize` 传递字符串会导致调用接收\
  \ void 指针的重载，而不是接收字符串的重载？\n\n当我们调用具有多个重载的函数时，编译器使用一种名为“重载解析”（overload resolution）的过程来确定哪一个最合适。编译器通过尝试将每个函数参数转换为每个重载对应的参数类型来实现此。某些转换优于其他转换，如果参数本身已经是正确类型，则转换是最好的。\n\
  \n所有参数均可成功转换的重载都会添加到“可行函数集”（viable functions）集合中。然后，编译器需要从该集合中选择一个重载。如果某个重载至少在一个参数上具有更好的转换，且在其他任何参数上都没有更差的转换，则该重载被视为最佳可行函数并被重载解析选中。如果没有哪个重载比所有其他重载更好，则调用格式错误且编译失败。\n\
  \n看这个例子：\n\n```cpp\nserialize(int, int); // 1\nserialize(float, int); // 2\n```\n\
  \n给定这两个重载，假设你这样调用 `serialize`：\n\n```cpp\nserialize(1, 2);\n```\n\n`serialize` 的两个重载都是可行的。但第一个重载在第一个参数上有更好的转换（`int\
  \ → int` 对比 `int → float`），并且在第二个参数上没有更差的转换（`int → int`），因此它被选为最佳可行函数。\n\n这个谜题比上面的例子简单一点，因为\
  \ `serialize` 的两个重载都只有一个参数。第一个接收 `const void*`，第二个接收 `const std::string&`。每个重载的转换是怎样的？\n\
  \n`std::string` 是标准库中的一个类。它通常会在堆上分配内存（除非字符串非常小），并允许字符串在运行时增长或被修改。\n\n然而，字符串 `\"\
  hello world\"` 并不是 `std::string`，而是简单的字符串字面量。字符串字面量是普通的 C 风格字符数组，它们由链接器编译到二进制文件中，且在运行时无法修改。字符串字面量的类型是\
  \ `const char array`。`\"hello world\"` 有 11 个字符加上一个终止符 `\\0`，所以它的类型是 `12 const char\
  \ array`。\n\n由于参数 `\"hello world\"` 既不是 `const void*` 也 `std::string`，而是 `12 const\
  \ char array`，因此两个重载都需要转换。如果从参数到参数类型存在隐式转换，该重载会被添加到可行函数集中。否则，该重载将被忽略。\n\n让我们检查第一个重载，看看\
  \ `12 const char array` 是否能隐式转换为 `const void*`。发生的第一件事是数组转换为指针。任何 `N T array` 都可以转换为指向第一个元素的\
  \ `T pointer`。所以现在，我们的 `12 const char array` 已经变成了 `const char pointer`。\n\n接下来，任何\
  \ `cv T pointer`（其中 `cv` 表示 `const`、`volatile`、`const volatile` 或三者皆无）都可以转换为 `cv\
  \ void pointer`。所以现在，我们的 `const char pointer` 变成了 `const void pointer`，这正是第一个重载所预期的。\n\
  \n\n\n\n\n注意，在这个转换序列中没有涉及任何构造函数或转换函数。这意味着这是一个标准转换序列，而不是用户定义的转换序列。这在稍后变得重要。\n\n现在让我们检查第二个重载函数，看看我们的“12\
  \ 个 const char 数组”是否可以转换为“const std::string 的引用”。`std::string` 拥有一个构造函数 `std::string(const\
  \ char* s)`，我们可以使用它。首先，我们像上面那样，将“12 个 const char 数组”转换为“指向 const char 的指针”。然后，我们将此指针传递给\
  \ `std::string` 构造函数，并返回一个 `std::string` 对象，其中包含该字符串字面量的拷贝。`const std::string&`\
  \ 参数可以直接绑定到我们的 `std::string` 参数上。\n\n注意，我们必须使用构造函数来实现这一点。这意味着这是一个用户定义的转换序列，而不是标准转换序列。`std::string`\
  \ 是标准库类型并不重要；它仍然被视为用户定义的。对于你和标准库来说，规则是相同的。\n\n现在，编译器已经找到了从我们的“12 个 const char 数组”到每个重载参数类型的有效转换序列，并且必须弄清楚哪个序列是最好的：\n\
  \n![images/string-theory-new.drawio.png](img/string-theory-new.drawio.png)\n\n我们只需要一个标准转换序列（顶部）来调用\
  \ `const void*` 重载。要调用 `std::string` 重载，我们需要一个用户定义的转换序列（底部），这涉及到创建一个新的临时 `std::string`\
  \ 对象。标准转换序列优于用户定义的转换序列，因此会调用第一个重载，并打印出 `const void*`。\n\n### 延伸阅读\n\n重载解析\n\n[`en.cppreference.com/w/cpp/language/overload_resolution`](https://en.cppreference.com/w/cpp/language/overload_resolution)\n\
  \n`std::string`\n\n[`en.cppreference.com/w/cpp/string/basic_string`](https://en.cppreference.com/w/cpp/string/basic_string)\n\
  \n字符串字面量\n\n[`en.cppreference.com/w/cpp/language/string_literal`](https://en.cppreference.com/w/cpp/language/string_literal)\n\
  \n| 谜题 3 | 攻入星球！ |\n\n[hack-the-planet.cpp](http://media.pragprog.com/titles/akbrain/code/hack-the-planet.cpp)\n\
  \n```cpp\n#include <iostream>\n\nint getUserId() {\n    return 1337;\n}\n\nvoid\
  \ restrictedTask1() {\n    int id = getUserId();\n    if (id == 1337) {\n      \
  \  std::cout << \"did task 1\\n\";\n    }\n}\n\nvoid restrictedTask2() {\n    int\
  \ id;\n    if (id == 1337) {\n        std::cout << \"did task 2\\n\";\n    }\n}\n\
  \nint main() {\n    restrictedTask1();\n    restrictedTask2();\n}\n```\n\n| 猜测输出\
  \ |\n| --- |\n| ![images/aside-icons/important.png](img/important.png) | 在移动到下一页之前，尝试猜输出是什么。\
  \ |\n\n![images/hline.png](img/hline.png)\n\n该程序存在未定义行为！但它可能会显示以下输出：\n\n| | did\
  \ task 1 |\n| | did task 2 |\n\n![images/hline.png](img/hline.png)\n\n### 讨论\n\n\
  函数 `restrictedTask2` 中的变量 `id` 未初始化，并且有一个不确定的值。使用它的值是未定义行为。当程序遇到未定义行为时，可能会发生任何事情；C++\
  \ 标准不提供任何保证。即使在我们获取 `id` 的值之前已经发生的程序部分也是未定义的！\n\n然而，如果你在自己的电脑上运行此程序，它可能会同时打印出 `did\
  \ task 1` 和 `did task 2`，至少在不开启优化的情况下编译是这样。所以值 `1337` 就像魔法一样从 `restrictedTask1`\
  \ 传送到了 `restrictedTask2`！这可能是如何发生的？\n\n大多数系统使用栈来处理局部变量。`restrictedTask1` 有一个局部变量\
  \ `id`，它在自己的栈帧中为其预留了空间。恰好，`restrictedTask2` 具有相同数量和类型的局部变量（一个 `int`），因此它的栈帧布局将与\
  \ `restrictedTask1` 相同。\n\n当在 `main` 中时，栈会增长到某个点——参见下图中左侧的插图。然后我们调用 `restrictedTask1`，栈增长，`restrictedTask1`\
  \ 在其栈帧中为 `id` 预留空间并将 `id` 初始化为 `1337`。然后控制返回 `main`，栈再次缩小。\n\n![images/hack-the-planet2.drawio.png](img/hack-the-planet2.drawio.png)\n\
  \n接下来，我们调用 `restrictedTask2`，栈再次增长，`restrictedTask2` 在其栈帧中为 `id` 预留空间但没有对其初始化。然而，`restrictedTask2`\
  \ 的栈帧最终位于与 `restrictedTask1` 栈帧相同的位置。函数调用之间不会清除栈，因此 `restrictedTask2` 栈帧的内容将与 `restrictedTask1`\
  \ 离开时完全一样，包括位于局部变量 `id` 位置上的值 `1337`。这导致两个函数中的 `id` 都是 `1337`。\n\n但是，如果你开启优化，`restrictedTask1`\
  \ 和 `restrictedTask2` 可能会被内联到 `main` 中，且这些调用不会使用栈。你可以尝试通过使用 `-O2` (GCC/Clang) 或\
  \ `/O2` (MSVC) 进行编译来亲自。在我的 x86_64 Linux 机器上，GCC 使用 `-O2` 会打印 `did task 1`，而 Clang\
  \ 则会导致段错误。在你的机器上发生了什么呢？\n\n### 避免未定义的变量\n\n为了避免“鼻恶魔”（nasal demons）、像这样的安全漏洞以及一般的垃圾数据，你应该在使用变量之前始终对其进行初始化。这很容易出错，但可以寻求帮助的！首先，始终开启警告编译。GCC、Clang\
  \ 和 MSVC 都会对这种特殊情况发出警告，`clang-tidy` 等工具也是如此。但这仅仅是因为证明 `id` 在使用时未初始化是非常直接的。通常，我们直到运行时才能知道这一点。这就是检测器（sanitizers）大显身场的地方。\n\
  \n不同的检测器有不同的用途，但它们都会以各种方式在运行时监控代码，以检测编译器无法检测的问题。其中一种检测器是 `MemorySanitizer`，它旨在捕获对未初始化内存的使用。如果我们使用\
  \ `MemorySanitizer` 运行此程序（向 Clang 传递 `-fsanitize=memory` 作为编译器选项），它将打印如下内容：\n\n\
  | | ==1416660==WARNING: MemorySanitizer: use-of-uninitialized-value |\n| | #0 0x5603d43af5eb\
  \ in restrictedTask2() example.cpp:14 |\n| | #1 0x5603d43af6d in main example.cpp:19\
  \ |\n\n它告诉你你正在使用未初始化的内存，并给出发生时的堆栈轨迹。\n\n检测器会让你的程序运行慢得多，因此你通常希望有带有检测器的独立构建。检测器只有在问题实际发生于运行时才能检测到，所以请确保尽可能使用此版本运行你的测试套件。\n\
  \n| 建议 |\n| --- |\n| ![images/aside-icons/tip.png](img/tip.png) |  \n\n*   始终启用警告。在\
  \ GCC/Clang 上使用 `-Wall -Wextra -pedantic` 是一个良好的开始，在 MSVC 上使用 `/W4`。\n*    如果你的\
  \ IDE 支持与 `clang-tidy` 等静态检查工具集成，请开启它们。它们有时可以在你编译代码之前就报告此类问题。\n*   将警告视为错误，至少在你的持续集成（CI）作业中如此，这样你就不会遗漏任何警告。\n\
  *   为尽可能多的检测器设置检测器构建，并使用这些构建运行测试。\n\n |\n\n### 延伸阅读\n\n未定义行为\n\n[`en.cppreference.com/w/cpp/language/ub`](https://en.cppreference.com/w/cpp/language/ub)\n\
  \nOlve Maudal 和 Jon Jagger 写的《Deep C (and C++)》\n\n[`www.slideshare.net/olveudal/deep-c`](https://www.slideshare.net/olveudal/deep-c)\n\
  \n检测器列表\n\n[`github.com/google/sanitizers`](https://github.com/google/sanitizers)\n\
  \n| 谜题 4 | 全局变量 |\n\n[going-global.cpp](http://media.pragprog.com/titles/akbrain/code/going-global.cpp)\n\
  \n```cpp\n#include <iostream>\n\nint id;\n```\n\n\n\n\n\n\n```cpp\nint main()\n\
  {\n  std::cout << id;\n}\n```\n\n## 预测输出\n\n![images/aside-icons/important.png](img/important.png)\
  \ 在移动到下一页之前，尝试猜一下输出是什么。\n\n![images/hline.png](img/hline.png)\n\n程序显示以下输出：\n\n0\n\
  \n![images/hline.png](img/hline.png)\n\n### 讨论\n\n这个谜题看起来和谜题 3，谜题 3，入侵星球！ 相似；它们都使用了未初始化变量\
  \ `id` 的值。然而，与谜题 3 不同，这不是未定义行为，程序打印了 0。这是为什么？\n\n区别在于谜题 3 中的 `id` 是局部变量，它们在每次函数被调用时产生并销毁。它们被认为具有自动存储生存期。而这个谜题中的\
  \ `id` 是一个全局变量。更准确地说，`id` 是一个具有静态存储生存期的非局部变量；也就是说，`id` 的生命周期贯穿整个程序运行期间。\n\n与具有自动存储生存期的变量不同，具有静态存储生存期的变量是在程序启动时初始化的。对于没有初始化器的\
  \ `int` 这种简单情况，它会被零初始化。如果 `id` 有一个初始化器，例如 `int id = 2;`，那么我们会说它被常量初始化为 2。（零初始化和常量初始化的统称为静态初始化。）\n\
  \n为什么具有静态存储生存期且没有初始化器的变量会被初始化为零，而具有自动存储生存期的变量不是？在通常情况下，初始化变量并不是免费的。需要某些代码来执行该初始化。例如，如果你在函数中定义一个局部变量\
  \ `int id = 0;`，大多数系统在每次调用该函数时都需要产生一些代码将其设置为零。C++ 无法保证这种操作是免费或代价微乎其微，而 C++ 的设计目标之一就是为你不使用的东西付费。因此，如果你决定省略初始化器并仅定义\
  \ `int id;`，C++ 就不会让你付出那个代价。\n\n局部变量和非局部变量的另一个区别是作用域。局部变量只能在定义它的块中被访问。而非局部变量可以从文件的任何地方访问，或者如果它在头文件中声明，则可以在包含该头文件的整个程序的任何地方访问。所以，如果你省略了局部变量的初始化器，你对它下一次在何处使用有完美的控制。你可能没有给它初始化，是因为你会在接下来的一两行代码中初始化它。但如果你省略了非局部变量的初始化器，想要推理下一步谁会访问它就会困难得多。\n\
  \n将具有静态存储生存期的非局部变量与具有自动存储生存期的局部变量对比：\n\n| | 初始化代价 | 作用域 |\n| --- | --- | --- |\n\
  | 非局部静态 | 一次 | 整个文件/程序 |\n| 局部自动 | 每次进入块时 | 定义它的块 |\n\n控制具有静态存储生存期的非局部变量的使用很难，而且初始化它们是廉价的，所以\
  \ C++ 会为你自动完成。\n\n不过，这有多便宜呢？让我们以 x86 架构为例。我之前提到过你支付一次初始化代价，但实际上你根本没有支付！当你的程序启动时，它需要为栈、堆、程序代码以及对我们来说重要的全局数据分配内存。在\
  \ Linux 和 Windows 等系统上，当我们从操作系统获取新的物理内存时，它会被填充零，以防止你读取之前使用该相同内存页的程序的内存。编译器/链接器可以将所有未初始化的全局变量放在名为\
  \ `.bss` 的段中。当程序启动并为 `.bss` 段分配内存时，它已经填充了零。所以这些变量是以零成本进行零初始化的！\n\n>! Note\n> ![images/aside-icons/tip.png](img/tip.png)\
  \ `static` 一词在 C++ 中有很多用法。`id` 是否具有 `static` 限定符并不影响它的静态存储生存期。对于全局变量，使用 `static\
  \ int id;` 而不是 `int id;` 只是赋予了它内部链接；也就是说，无法从其他编译单元（其他 cpp 文件）进行链接。无论如何它都有静态存储生存期。\n\
  \n### 拓展阅读\n\n零初始化\n[`en.cppreference.com/w/cpp/language/zero_initialization`](https://en.cppreference.com/w/cpp/language/zero_initialization)\n\
  \n关于全局变量初始化更多信息：从程序到进程\n[`www.youtube.com/watch?v=fGnbGX88z3Y`](https://www.youtube.com/watch?v=fGnbGX88z3Y)\n\
  \n## 谜题 5 破坏性关系\n\n[a-destructive-relationship.cpp](http://media.pragprog.com/titles/akbrain/code/a-destructive-relationship.cpp)\n\
  \n```cpp\n#include <iostream>\n#include <memory>\n\nstruct Widget\n{\n  virtual\
  \ void draw() { std::cout << \"Widget draw\\n\"; }\n  virtual ~Widget() { std::cout\
  \ << \"Widget destructor\\n\"; }\n};\n\nstruct Button : public Widget\n{\n  void\
  \ draw() override { std::cout << \"Button draw\\n\"; }\n  ~Button() override { std::cout\
  \ << \"Button destructor\\n\"; }\n};\n\nint main()\n{\n  std::unique_ptr<Widget>\
  \ widget = std::make_unique<Button>();\n  widget->draw();\n}\n```\n\n## 预测输出\n\n\
  ![images/aside-icons/important.png](img/important.png) 在移动到下一页之前，尝试猜一下输出是什么。\n\n\
  ![images/hline.png](img/hline.png)\n\n程序显示以下输出：\n\nButton draw\nButton destructor\n\
  Widget destructor\n\n![images/hline.png](img/hline.png)\n\n### 讨论\n\n当我们调用 `draw`\
  \ 时，程序只打印 `Button draw`。但当 `unique_ptr` 超出作用域并调用析构函数时，程序打印了 `Button destructor`\
  \ 和 `Widget destructor`。这是为什么？\n\n动态多态的一种常用技术是使用虚函数。你声明一个带有一个或多个标记为 `virtual` 的类的，允许其他类重写这些函数。当你对指向派生类对象的基类指针调用虚函数时，将使用对象的动态类型，并调用重写后的函数。\n\
  \n在这个示例中，想象有一个 UI 框架，其中包含一个具有某些共同行为的 `Widget` 类，以及 `Button`、`Text` 和 `Image` 等具体的\
  \ UI 元素，它们在虚函数 `draw` 中重写了绘图行为。\n\n当我们对指向 `Widget` 的基类指针调用 `draw` 时（该指针实际上指向派生类\
  \ `Button`），调用的是 `Button::draw` 而不是 `Widget::draw`，并打印了 `Button draw`。然而，对于析构函数，行为是不同的；我们可以看到它先打印\
  \ `Button destructor`，然后也打印 `Widget destructor`。发生了什么？\n\n当对象被销毁时，它的所有部分都必须销毁。在这种情况下，`Button`\
  \ 继承自 `Widget`，因此每个 `Button` 对象由一个 `Widget` 对象以及 `Button` 的任何成员（在本例中没有）组成。我们说 `Button`\
  \ 拥有一个 `Widget` 子对象。如果 `Button` 是拥有类型为 `Widget` 的成员而不是继承它，它也会拥有一个 `Widget` 子对象。无论哪种，当完整对象被销毁时，子对象也必须被销毁以避免资源泄漏。幸运的是，C++\
  \ 为我们处理了这一切；我们不需要在 `Button` 析构函数中手动调用 `Widget` 析构函数。\n\n\n\n\n\n 请注意，析构函数的体首先执行，然后才调用子对象的析构函数。这确保了你仍然可以在类的析构函数中使用成员和基类。因此，程序首先打印\
  \ `Button` 析构函数，然后打印 `Widget` 析构函数。\n\n| 额外问题 |\n| --- |\n| ![images/aside-icons/note.png](img/note.png)\
  \ | 如果 `Widget` 没有将其析构函数声明为虚，会发生什么？在哪些情况下会产生问题？ |\n\n根据 C++ 标准，如果被删除对象的静态类型与其动态类型不同，则静态类型必须是被删除对象动态类型的基类，且该静态类型必须具有虚析构函数。否则，行为是未定义的。\n\
  \n因此，如果 `Widget` 没有将其析构函数声明为虚，而你通过指向 `Widget` 的指针删除一个 `Button` 对象，其行为是未定义的。在实践中，你通常会看到调用的是\
  \ `Widget` 析构函数 own `Button` 析构函数，并遇到此类问题：\n\n- 派生类的任何成员都没有被销毁，可能导致内存泄漏或其他资源泄漏。\n\
  - 如果派生类具有用户定义的析构函数，程序的正确性通常依赖于该逻辑在对象销毁时被执行。\n\n但在任何情况下，即使这些问题对你的特定程序没有产生具体影响，而且在测试期间一切看起来正常，你仍然应该将析构函数声明为虚，以避免未定义行为。\n\
  \n| 建议 |\n| --- |\n| ![images/aside-icons/tip.png](img/tip.png) | 得益于子对象的自动销毁，处理\
  \ C++ 资源的良好技术是将资源获取即初始化（RAII）类型（例如 `unique_ptrs`）作为成员。如果你派自此类类，这种技术同样有效。 |\n\n###\
  \ 扩展阅读\n\n析构函数的 CppReference\n[`en.cppreference.com/w/cpp/language/destructor`](https://en.cppreference.com/w/cpp/language/destructor)\n\
  \n关于析构函数和子对象的 C++ 标准\n[`timsong-cpp.github.io/cppwp/std20/class.dtor#14`](https://timsong-cpp.github.io/cppwp/std20/class.dtor#14)\n\
  \n| 谜题 6 | 谁先？ |\n| [whos-up-first.cpp](http://media.pragprog.com/titles/akbrain/code/whos-up-first.cpp)\
  \ |\n\n```cpp\n#include <iostream>\nstruct Resource {\n  Resource() {\n    std::cout\
  \ << \"Resource constructed\\n\";\n  }\n};\n\nstruct Consumer {\n  Consumer(const\
  \ Resource &resource) {\n    std::cout << \"Consumer constructed\\n\";\n  }\n};\n\
  \nstruct Job {\n  Job() : resource_{}, consumer_{resource_} {}\n  Consumer consumer_;\n\
  \  Resource resource_;\n};\n\nint main() {\n  Job job;\n}\n```\n\n| 猜输出 |\n| ---\
  \ |\n| ![images/aside-icons/important.png](img/important.png) | 在移动到下一页之前，尝试猜输出是什么。\
  \ |\n\n![images/hline.png](img/hline.png)\n\n程序显示以下输出：\n\n```\nConsumer constructed\n\
  Resource constructed\n```\n\n![images/hline.png](img/hline.png)\n\n### 讨论\n\n类 `Job`\
  \ 有两个成员 `consumer_` 和 `resource_`，按该顺序声明的。然而，在构造函数的成员初始化列表中（`: resource_{}, consumer_{resource_}`\
  \ 部分）中，它们的初始化顺序是相反的。它们实际上按什么顺序初始化呢？\n\nC++ 总是按照成员在类中声明的顺序进行初始化，而不是它们在构造函数成员初始化列表中列出的顺序。这确保了成员总是以确定的顺序初始化，即使不同的构造函数在它们的成员初始化列表中列出了不同的顺序。因此，即使\
  \ `resource` 看起来在构造函数首先被初始化，实际上先初始化的是 `consumer_`。\n\n如果一个成员依赖于另一个成员，那么以确定的顺序初始化成员至关重要。例如，在这个例子中，`consumer`\
  \ 在构造函数中依赖 `resource`。构造函数看起来一切正常，但由于 `consumer_` 实际上在 `resource_` 之前初始化，`Consumer`\
  \ 构造函数接收到的 `Resource` 尚未构造。如果我们尝试用它做任何事情，就会产生未定义行为。\n\n反之亦然。成员的销毁顺序与其在类中的声明顺序相反。销毁顺序可能与构造顺序一样重要，因为一个成员在析构函数中可能依赖另一个成员，或者存在其他的生命周期依赖。例如，假设谜题中的\
  \ `Consumer` 运行一个使用 `Resource` 的线程，该 `Consumer` 在其析构函数环境中该线程。在当前的代码版本中，`resource_`\
  \ 在线程仍在运行时被销毁，我们将面临使用已销毁的 `resource_` 的风险，导致未定义行为。然而，如果 `consumer_` 在 `resource_`\
  \ 之后声明，那么 `consumer` 中的线程会在 `resource_` 被销毁之前停止。\n\n在成员初始化列表中错误的顺序列出成员会让读者感到困惑，因此我建议在成员初始化列表和类声明中使用相同的顺序。`GCC`、`Clang`\
  \ 和 `MSVC` 都有相应的警告（分别是 `-Wreorder`、`-Wreorder-ctor` 和 `C5038`），如果你不使用一致的顺序会警告你。如果你使用\
  \ `-Wall / /Wall` 编译，这些警告就会被启用，我总是建议这样做。不同的编译器通常有不同的警告，因此使用多个编译器编译是一个好主意。这还可以帮助你避免意外使用非标准的、特定平台的\
  \ C++ 变体，这会使以后将项目移植到其他平台变得困难。\n\n| 建议 |\n| --- |\n| - 始终开启警告。<br>- 使用多个编译器编译。 |\n\
  \n### 扩展阅读\n\n构造函数和成员初始化列表\n[`en.cppreference.com/w/cpp/language/constructor`](https://en.cppreference.com/w/cpp/language/constructor)\n\
  \n| 谜题 7 | 好事终有尽时 |\n| [all-good-things-must-come-to-an-end.cpp](http://media.pragprog.com/titles/akbrain/code/all-good-things-must-come-to-an-end.cpp)\
  \ |\n\n```cpp\n#include <iostream>\n#include <string>\n\nstruct Connection {\n \
  \ Connection(const std::string &name) : name_(name) {\n    std::cout << \"Created\
  \ \" << name_ << \"\\n\";\n  }\n\n  ~Connection() {\n    std::cout << \"Destroyed\
  \ \" << name_ << \"\\n\";\n  }\n\n  std::string name_;\n};\n\nConnection global{\"\
  global\"};\n\nConnection &get() {\n  static Connection localStatic{\"local static\"\
  };\n  return localStatic;\n}\n\nint main() {\n  Connection local{\"local\"};\n \
  \ Connection &tmp1 = get();\n  Connection &tmp2 = get();\n}\n```\n\n\n\n\n在谜题 3、谜题\
  \ 3 入侵星球！ 以及谜题 4、谜题 4 全球化 中，我们学习了全局 id 和局部 id 在生命周期和初始化上的差异：\n\n```cpp\nint id;\
  \ // 全局变量，整个程序期间只有一个实例\n\nvoid f() {\n    int id = 2; // 局部变量，每次调用 f 时都会重新创建\n}\n\
  ```\n\n在这个谜题中，我们为对象生命周期添加了两个新的有趣维度：\n\n*   我们不再将变量初始化为简单的常量；而是有了一个带有副作用的构造函数。\n\
  *   我们引入了具有静态存储周期的局部变量 `localStatic`。\n\n那么，当我们引入构造函数和局部静态变量时，行为会发生什么变化？让我们先考虑全局变量\
  \ `global`。与之前看到的全局变量 `id` 一样，它具有静态存储周期，这意味着从初始化到程序结束时的销毁，只有一个实例是活跃的。\n\n我们之前见过，没有初始化器的全局\
  \ `int id;` 被零初始化。我们还提到过，带有初始化器的全局变量 `int id = 2;` 会被常量初始化。两者都是静态初始的示例，静态初始化发生在程序启动期间。另一方面，全局变量\
  \ `global` 使用非常量表达式初始化。`Connection` 构造函数不是 `constexpr`（它不可能是，因为要向 `std::cout` 输出内容）。无法进行静态初始化的对象改为动态初始化，这发生在较晚之后。\n\
  \n然而，动态初始化何时发生呢？人们通常认为动态初始化发生在 `main` 之前——这很有道理：这是实现动态初始化的一种简单常见的方法。例如，Linux 有一个函数\
  \ `__libc_start_main`，它在 `main` 之前被调用。`__libc_start_main` 在最终调用你的 `main` 函数之前会调用全局构造函数。\n\
  \nC++ 标准并没有要求动态初始化发生在 `main` 之前，它只是允许。然而，标准要求全局变量的动态初始化必须发生在同一个编译单元（TU）中定义的任何函数被调用之前。（编译单元归其底就是包含所有\
  \ `#include` 文件后的单个 `.cpp` 文件。）因此在这个谜题中，由于 `main` 定义在与 `global` 相同的 TU 中，`global`\
  \ 实际上保证在 `main` 之前被初始化！\n\n初始化顺序的完整规则相当长且复杂。CppReference.com 有一个介绍,6，而 C++ 标准在 [basic.start].7\
  \ 中包含了所有细节。\n\n接下来，来看 `localStatic`。像 `global` 一样，`localStatic` 也具有静态存储周期，因此 `localStatic`\
  \ 只有一个实例，从初始化一直到程序结束。与全局变量不同，局部静态变量不在程序启动时初始化，而是在控制流第一次通过它们的声明时初始化。所以尽管 `localStatic`\
  \ 具有静态存储周期，直到第一次调用 `get` 时 get 初始化。\n\n最后，`local` 是具有自动存储周期的简单局部变量；它在每次控制流通过其声明时都会初始化。\n\
  \n让我们来看看程序的执行情况：\n\n*   程序启动，在调用 `main` 之前，`global` 被初始化。\n*   我们进入 `main`，`local`\
  \ 被初始化。\n*   我们第一次调用 `get`，`localStatic` 被初始化。\n*   我们第二次调用 `get`，但由于 `localStatic`\
  \ 已经初始化，它不会再次初始化。\n\n但我们还没有结束！我们还需要弄清楚这三个对象何时销毁。幸运的是，销毁规则简单得多。具有自动存储周期的局部对象在其声明的作用域结束时销毁。具有静态存储周期的对象在程序结束时按创建的反序销毁：\n\
  \n*   当我们退出 `main` 时，`local` 离开作用域并销毁。\n*   `localStatic` 是最后一个初始化的静态存储对象，所以它第一个被销毁。\n\
  *   `global` 先初始化，最后被销毁。\n\n使用静态局部变量而不是全局变量是更好地控制“全局”变量生命周期的好方法。你不需要每次需要时都引用全局对象，而是调用一个函数来获取它的引用，现在你就可以控制对象初始化的机了！如果你有多个相互依赖的全局变量，这会特别有用。\n\
  \n最后，注意关于在多个 TU 中定义的全局变量的警告。虽然单个 TU 内部的全局变量初始化是有顺序的，但不同 TU 中的全局变量可以以任何顺序初始化。例如，你可能期望以下程序打印\
  \ 1，但在我的电脑上它打印的是 0。\n\n[examples/siof/Value.h](http://media.pragprog.com/titles/akbrain/code/examples/siof/Value.h)\n\
  \n```cpp\nstruct Value {\n    Value(int i_) : i(i_) {}\n    Value(const Value &other)\
  \ : i(other.i) {}\n    int i;\n};\n```\n\n[examples/siof/source1.cpp](http://media.pragprog.com/titles/akbrain/code/examples/siof/source1.cpp)\n\
  \n```cpp\n#include \"Value.h\"\n#include <iostream>\n\nextern Value value1;\nValue\
  \ value2{value1}; // 无法保证 value1 已经初始化！\n\nint main() {\n    std::cout << value2.i;\n\
  }\n```\n\n[examples/siof/source2.cpp](http://media.pragprog.com/titles/akbrain/code/examples/siof/source2.cpp)\n\
  \n```cpp\n#include \"Value.h\"\n\nValue value1{1};\n```\n\n这种不同编译单元之间全局变量未知初始化顺序的问题被称为“静态初始化顺序灾难”（SIOF）。8\n\
  \n| 建议 |\n| :--- |\n| ![images/aside-icons/tip.png](img/tip.png) |\n*   避免全局变量相互依赖，特别是当它们定义在不同的文件中。\n\
  *   使用 `clang-tidy`；它有一个检查 `cppcoreguidelines-interfaces-global-init`，可以检测某些依赖全局变量的使用。\n\
  *   使用带有局部静态变量的函数来控制生命周期，而不是全局变量。 |\n\n### 扩展阅读\n\n更多关于动态初始化：如何启动程序\n[`www.youtube.com/watch?v=OGPmZzhDPYw`](https://www.youtube.com/watch?v=OGPmZzhDPYw)\n\
