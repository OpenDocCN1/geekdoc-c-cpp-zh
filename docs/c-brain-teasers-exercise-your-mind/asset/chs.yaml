  ### 讨论\n\n在上面的谜题中，我们有一个 `Machine` 类，它包含一个 `Engine`。当 `Machine` 在构造期间抛出异常时，`Machine`\
  \ 并没有完全初始化。那么 `engine_` 会被销毁吗？当我们构造 `Machine` 对象时，初始化顺序如下：\n\n* 虚基类\n* 直接基类\n* 非静态数据成员（如\
  \ `Machine::engine_`）\n* 构造函数体\n\n当 `Machine` 构造函数抛出异常时，只有已经构造的成员会被销毁。`engine_`\
  \ 已经构造，因此会被释放；而尚未初始化的成员是不需要处理的，因为它们从未被构造过。但是，如果你在构造函数中手动获取了资源，就必须小心。你不能依赖析构函数来清理它。例如，如果你调用\
  \ `new` 并将指针赋值给成员，你不能依赖析构函数中的 `delete` 来清理。对于原始的 `open/close` 函数对也是如此。\n\n始终，为了让代码更健壮，请避免手动调用\
  \ `delete` 和 `close`。相反，请使用标准库类型（如 `unique_ptr` 或 `fstream`）作为成员，它们会自动清理资源。如果你的类管理一个适应标准库类型的自定义资源（例如谜题中需要停止的引擎），请将该责任抽离到一个独立的的小类（如\
  \ `Engine`），而不是在容器类中手动处理。这样你就不需要考虑管理它；只要它被构造过，就总是会被销毁。 |\n\n\n\n\n```cpp\nstd::cout\
  \ << std::is_const_v<T>; // true if T is const\n}\n\ntemplate <typename T>\nvoid\
  \ byReference(T &t) {\n    std::cout << std::is_const_v<T>; // true if T is const\n\
  }\n\nint main() {\n    int nonConstInt = 0;\n    const int constInt = 0;\n\n   \
  \ byValue(nonConstInt);\n    byValue(constInt);\n\n    byReference(nonConstInt);\n\
  \    byReference(constInt);\n}\n```\n\n### 猜输出\n\n![images/aside-icons/important.png](img/important.png)\
  \ 在移动到下一页之前，尝试猜输出是什么。\n\n![images/hline.png](img/hline.png)\n\n程序显示输出输出：\n\n| 0001\
  \ |\n\n![images/hline.png](img/hline.png)\n\n### 讨论\n\n这两个函数模板 `byValue` 和 `byReference`\
  \ 分别通过值传递和引用传递接收参数。然后，我们使用非 const `int` 和 `const int` 作为参数调用这两个函数模板。在哪些情况下，`T` 被推导为\
  \ `const`？\n\n在我们开始深入研究推导规则之前，让我们澄清两个容易混淆的概念。`template <typename T>` 中的 `T` 被称为**模板参数**（template\
  \ parameter）。模板参数推导的目标是找到 `T`。另一方面，函数签名 `byValue(T t)` 和 `byReference(T &t)` 中的\
  \ `T` 和 `T &` 被称为**模板参数类型**（template parameter types）。这些是函数模板的实际参数类型，也是我们用于推导的对象。\n\
  \n我们将这些模板参数类型称为 `P`，以区别于模板参数 `T`。这里是三个示例：\n\n| 模板参数 | 模板参数类型 P |\n| --- | --- |\
  \ --- |\n| template <typename T> | | |\n| void byValue(T t) | T | T |\n| template\
  \ <typename T> | | |\n| void byReference(T & t) | T | T & |\n| template <typename\
  \ ValueType> | | |\n| void f(const std::vector<ValueType>& v) | ValueType | const\
  \ std::vector<ValueType>& |\n\n如你所见，在 `byValue` 和 `byReference` 中，模板参数都是 `T`。在 `byValue`\
  \ 中，模板参数类型 `P` 只是 `T`，但在 `byReference` 中，它是 `T &`。\n\n处理完这些后，让我们深入研究推导规则。首先，看 `byValue`\
  \ 的调用：\n\n```cpp\ntemplate <typename T> void byValue(T t);\n\nint nonConstInt =\
  \ 0;\nconst int constInt = 0;\n\nbyValue(nonConstInt);\nbyValue(constInt);\n```\n\
  \n记住，模板参数是 `T`，而模板参数类型 `P` 也仅仅是 `T`（与之相对，例如 `T &`）。\n\n在推导模板参数类型 `P` 时，如果它不是引用类型，推导规则规定忽略参数\
  \ `argument` 的任何顶层 cv 限定符（`const` 或 `volatile`）。由于 `P` 只是 `T`，它不是引用类型，因此 cv 限定符被忽略了。\n\
  \n等等，无论我们传递的是非 const 还是 const 参数，我们都假装它是非 const 的！这看起来有点猫吗吗？不是。当 `P` 不是引用类型时，意味着我们通过值传递参数。原始参数是否为\
  \ `const` 无关，`byValue` 内部的参数 `t` 是拷贝，我们无法修改原始参数。\n\n由于顶层 cv 限定符被忽略了，我们在 `byValue`\
  \ 的两次调用中都从非 const `int` 推导出 `P`，并在两种情况下都发现 `P == int`。由于 `P == T`，`T` 也是非 const\
  \ 的。两次调用都打印了 0。\n\n接下来，看 `byReference` 的调用：\n\n```cpp\ntemplate <typename T> void\
  \ byReference(T &t);\n\nint nonConstInt = 0;\nconst int constInt = 0;\n\nbyReference(nonConstInt);\n\
  byReference(constInt);\n```\n\n模板参数是 `T`，模板参数类型 `P` 是 `T &`。\n\n这一次，`P` 是一个引用，我们不忽略参数的顶层\
  \ cv 限定符。在这种情况下，这一点非常重要！引用参数 `t` 将绑定到我们的原始参数，因此确保不要尝试（例如）将非 const 引用绑定到 const 参数是非常重要的。\n\
  \n当传递非 const `nonConstInt` 时，`P` 被推导为 `int &`，这意味着 `T` 是 `int`。它不是 `const`，所以打印\
  \ 0。\n\n当传递 const `constInt` 时，`P` 被推导为 `const int &`，这意味着 `T` 是 `const int`。它是\
  \ const，所以打印 1。\n\n模板参数推导的完整规则读起来可能有点困难，但至少关于忽略顶层 cv 限定符的这足够直观，我能够记住它。\n\n### Auto\n\
  \n![images/aside-icons/tip.png](img/tip.png) `auto` 的推导规则基于模板参数推导规则。既然你知道了这些模板参数推导规则，也就知道了相应的\
  \ `auto` 推导规则！\n\n```cpp\nauto t1 = nonConstInt; // 非 const 对象\nauto t2 = constInt;\
  \ // 非 const 对象\nauto &t3 = nonConstInt; // 非 const 对象的引用\nauto &t4 = constInt;\
  \ // const 对象的引用\n```\n\n### 扩展阅读\n\n模板参数推导\n\n[`en.cppreference.com/w/cpp/language/template_argument_deduction`](https://en.cppreference.com/w/cpp/language/template_argument_deduction)\n\
  \n从函数调用中推导模板参数\n\n[`timsong-cpp.github.io/cppwp/std20/temp.deduct.call`](https://timsong-cpp.github.io/cppwp/std20/temp.deduct.call)\n\
  \n### 谜题 14 | 亚里士德的部分之和\n\n```cpp\n#include <iostream>\n#include <type_traits>\n\
  \nint main() {\n    char char1 = 1;\n    char char2 = 2;\n    // 如果 char1 + char2\
  \ 的类型为 char 则为真\n    std::cout << std::is_same_v<decltype(char1 + char2), char>;\n\
  }\n```\n\n\n\n\n让我们看看常规算术转换对我们的表达式 `char1 + char2` 做了什么。由于两个操作数都是整数类型，对它们都会执行一个被称为“整数提升”（integral\
  \ promotions）的过程。该思想是在执行算术表达式之前，将较小的整数类型转换为 `int` 或 `unsigned int`。在转换了两个操作数后，我们现在可以使用普通的\
  \ `int` 或 `unsigned int` 加法来相加它们，并得到 `int` 或 `unsigned int` 结果。\n\n提升较小整数类型的规则是：如果\
  \ `int` 能够表示较小类型的所有值，则它可以转换为 `int`；否则，它可以被转换为 `unsigned int`。`char` 能够放入 `int` 中吗？通常是可以的，但这取决于具体实现。（我告诉过你，这是一个悲惨的故事。）\n\
  \n这里的一个复杂化因素是，C++ 中基本类型的大小不是固定的。实现可以决定 `int` 是 16 位或 64 位，甚至认为 `char` 和 `long` 的大小相同。唯一的规则是这些：\n\
  \n* `signed char`、`short`、`int`、`long` 和 `long long` 中的每一个类型都至少与列表中前一个类型一样大。\n*\
  \ 对于列表中的每种类型，都存在一个无符号版本，其大小与符号版本相同。\n\n还定义了一些最小尺寸：\n\n| 类型 | 最小宽度 |\n| --- | ---\
  \ |\n| signed char | 8 |\n| short | 16 |\n| int | 16 |\n| long | 32 |\n| long long\
  \ | 64 |\n\n在典型的 64 位 Linux、Windows 或 macOS 系统上，`int` 是 32 位，而 `long` 在 Linux/macOS\
  \ 上是 64 位，在 Windows 上是 32 位。但一个符合标准的实现也可以同样地决定所有整数类型都是 64 位。\n\n在这个谜途中，我们特别关注 `char`，但\
  \ `char` 奇奇地没有出现在上述所有列表中。这是怎么了？`char` 有点特殊，因为实现可以选择由 `signed char` 还是 `unsigned\
  \ char` 来支持它。无论哪种情况，`char` 是一个不同的类型。因此，`char`、`signed char` 和 `unsigned char` 实际上是三种不同的类型，而普通的\
  \ `char` 是否有符号是取决于实现定义的！\n\n记住，我们感兴趣的是 `char` 中的所有值是否都能放入 `int` 中，以确定我们的 char 会被转换为\
  \ `int` 还是 `unsigned int`。通常情况下它们都能放入，所以 `char1 + char2` 的两个操作数都会被转换为 `int`，结果也将是\
  \ `int`。\n\n但假设实现选择了 `char` 和 `int` 都是 16 位。再假设实现选择了 `char` 是无符号的。那么 `int` 的范围是\
  \ `-2^(16-1)` 到 `2^(16-1)-1`，即 `-32768` 到 `32767`（包含边界）。`char` 的范围是 `0` 到 `2¹⁶-1`，即\
  \ `0` 到 `65535`（包含边界）。这意味着，一半的 char 无法放入 `int` 中！在这些系统上，`char1 + char2` 的操作数将会被提升为\
  \ `unsigned int`，结果也将是 `unsigned int`。\n\n因此，`char1 + char2` 的类型可以是 `int` 也可以是 `unsigned\
  \ int`。我们唯一确定的是它不是 `char`。\n\n### 延伸阅读\n\n* 常规算术混惑：[`shafik.github.io/c++/2021/12/30/usual_arithmetic_confusions.html`](https://shafik.github.io/c++/2021/12/30/usual_arithmetic_confusions.html)\n\
  * 64 位数据模型：[`en.wikipedia.org/wiki/64-bit_computing#64-bit_data_models`](https://en.wikipedia.org/wiki/64-bit_computing#64-bit_data_models)\n\
  * 基本类型：[`timsong-cpp.github.io/cppwp/std20/basic.fundamental`](https://timsong-cpp.github.io/cppwp/std20/basic.fundamental)\n\
  * 常规算术转换：[`timsong-cpp.github.io/cppwp/std20/expr.arith.conv`](https://timsong-cpp.github.io/cppwp/std20/expr.arith.conv)\n\
  * 整数提升：[`timsong-cpp.github.io/cppwp/std20/conv.prom`](https://timsong-cpp.github.io/cppwp/std20/conv.prom)\n\
  \n### 谜题 15 | 来自来自未来\n\n[back-from-the-future.cpp](http://media.pragprog.com/titles/akbrain/code/back-from-the-future.cpp)\n\
  \n```cpp\n#include <future>\n#include <iostream>\n\nint main() {\n    char counter\
  \ = 0;\n    auto future1 = std::async(std::launch::async, [&]() {\n        counter++;\n\
  \    });\n    auto future2 = std::async(std::launch::async, [&]() {\n        return\
  \ counter;\n    });\n\n    future1.wait();\n    // 强制转换为 int 以作为数值值而不是字符打印\n   \
  \ std::cout << (int)future2.get();\n}\n```\n\n在移动到下一页之前，尝试猜猜输出是什么。\n\n该程序具有未定义行为（undefined\
  \ behavior）！重要的是，答案并不是“ 0 或 1”。\n\n### 讨论\n\n当两个未同步的线程访问同一个内存位置，且这些访问中至少有一个修改操作时，我们就发生了数据竞态（data\
  \ race）。这个程序启动了两个线程，一个修改 `counter`，另一个读取它。由于我们没有努力同步这两个线程，该程序存在数据竞态。\n\n如果你在你的机器上运行这个程序，你很可能会看到\
  \ 0 或 1，取决于哪个线程先到达 `counter`。`counter` 是单字节的，所以你不可能看到（例如）任何写入了一半的值。`counter++` 操作要么在第二个线程读取\
  \ `counter` 之前完全发生，要么在它之后完全发生。但这并不意味着你可以依赖此来实现某种“最终一致性”的逻辑！数据竞态会导致未定义行为，因此任何事情都可能发生。记住我们在序言中讨论过的——魔鬼可能会从你的鼻子里飞出来。不要尝试对未定义行为下的情况进行推理或测试。你的程序可能看起来运行正常，但在编译器升级后在另一个系统上崩溃，或者每运行一百万次就会崩溃。\n\
  \n为了让这些线程安全地访问 `counter`，需要某种同步机制。经典的解决方案是用 `mutex` 保护 `counter`，但这很繁琐而且还引入了锁。锁可能是慢的，有锁的地方就可能死锁。更好的方法是使用原子变量（atomic），如下：\n\
  \n[examples/std_atomic/std_atomic.cpp](http://media.pragprog.com/titles/akbrain/code/examples/std_atomic/std_atomic.cpp)\n\
  \n```cpp\nstd::atomic<char> counter = 0;\nauto future1 = std::async(std::launch::async,\
  \ [&]() {\n    counter++;\n});\nauto future2 = std::async(std::launch::async, [&]()\
  \ {\n    return counter.load();\n});\n```\n\n使用 `std::atomic` 代替 `mutex` 可以使代码更简单，避免引入\
  \ `mutex` 额外的变量，确保我们不会忘记锁定 `mutex`，并且可能使代码无锁化（lock-free）。\n\n### 无锁原子操作\n\n`std::atomic<char>`\
  \ 是否无锁取决于实现，但它通常是无锁的。你可以通过 `std::atomic` 类模板的 `is_lock_free` / `is_always_lock_free`\
  \ 成员在你的系统上检查：[examples/std_atomic/std_atomic.cpp](http://media.pragprog.com/titles/akbrain/code/examples/std_atomic/std_atomic.cpp)\n\
  \n```cpp\nstatic_assert(counter.is_always_lock_free());\nassert(counter.is_lock_free());\n\
  ```\n\n* 如果对于给定的 `T` `std::atomic<T>` 总是无锁的，则 `is_always_lock_free` 为真。这是一个 `static\
  \ constexpr` 成员，可以在编译时检查。\n* 如果 `std::atomic<T>` 的特定实例无锁的，则 `is_lock_free()` 为真，即使\
  \ `is_always_lock_free` 为假它也可能为真。某些原子变量例如可能只有在对齐时才是无锁的。这只能在运行时检查。\n\n在我的 M1 Macbook\
  \ 和 x86_64 Linux 机器上，`int`、`long` 和 `double` 的 `std::atomic` 都是始终无锁的。\n\n\n\n\n\n\
  检测数据竞态（data races）的一个工具是免费的 `ThreadSanitizer`。它是 LLVM 自带的许多检测器之一，只需通过传递 `-fsanitize=thread`\
  \ 编译器选项并运行程序即可启用它。对于这个谜题，它会告诉你类似如下的内容：\n\n```text\n| ​  | WARNING: ThreadSanitizer:\
  \ data race (pid=2735) |\n| ​  | Read of size 1 at 0x7ffed85a35cf by thread T2:\
  \ |\n| ​  | (... stack trace ...) |\n| ​  |  |\n| ​  | Previous write of size 1\
  \ at 0x7ffed85a35cf by thread T1: |\n| ​  | (... stack trace ...) |\n| ​  |  |\n\
  | ​  | Location is stack of main thread. |\n| ​  |  |\n| ​  | Location is global\
  \ '??' at 0x7ffed8584000 ([stack]+0x1f5cf) |\n| ​  |  |\n| ​  | Thread T2 (tid=2738,\
  \ running) created by main thread at: |\n| ​  | (... stack trace ...) |\n| ​  |\
  \  |\n| ​  | Thread T1 (tid=2737, finished) created by main thread at: |\n| ​  |\
  \ (... stack trace ...) |\n```\n\n如你所见，它不仅告诉你有存在数据竞态，还告诉了变量的位置、读取和写入变量的代码堆栈跟踪，以及线程创建的堆栈跟踪。非常有用的东西！\n\
  \n| 建议 |\n| --- |\n| ![images/aside-icons/tip.png](img/tip.png) |  \n\n- 如果共享变量中至少有一个是写操作，请始终对这些访问进行同步。\n\
  - `std::atomic` 通常是值同步的极佳选择。\n- 使用检测器（sanitizers）。\n\n| |\n\n### 延伸阅读\n\n`std::async`\n\
