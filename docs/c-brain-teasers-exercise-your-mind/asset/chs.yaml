  \n### 谜题 16：一个重载的容器\n\n源码引用：`[an-overloaded-container.cpp](http://media.pragprog.com/titles/akbrain/code/an-overloaded-container.cpp)`\n\
  \n```cpp\n#include <initializer_list>\n#include <iostream>\nstruct Container {\n\
  \    Container(int, int) {\n        std::cout << \"Two ints\\n\";\n    }\n    Container(std::initializer_list<float>)\
  \ {\n        std::cout << \"std::initializer_list<float>\\n\";\n    }\n};\n\nint\
  \ main() {\n    Container container1(1, 2);\n    Container container2{1, 2};\n}\n\
  ```\n\n| 猜猜输出 |\n| --- |\n| ![images/aside-icons/important.png](img/important.png)\
  \ | 在移动到下一页之前，尝试猜猜输出是什么。 |\n\n程序显示如下输出：\n```text\nTwo ints\nstd::initializer_list<float>\n\
  ```\n\n加问题：如果我们移除 `initializer_list` 构造函数会发生什么？它还能通过编译吗？\n\n### 讨论\n\n`struct Container`\
  \ 有两个构造函数，一个接收两个 `int`，另一个接收一个 `std::initializer_list<float>`。构造了两个 `Container`\
  \ 类型的对象，都以两个 `int` 作为参数。但区别在于，一个对象是使用括号 `(1,2)` 构建的，另一个是使用大括号 `{1,2}` 构建的。在种情况下调用了哪个构造函数？\n\
  \n对于 `Container container1(1, 2)`，重载解析不出所料地选择了接收两个 `int` 的构造函数。\n\n对于 `Container\
  \ container2{1, 2}`，重载解析选择了接收 `std::initialization<float>` 的构造函数，尽管我们传递了两个 `int`！这意味着\
  \ `{1,2}` 是一个 `std::initializer_list` 吗？不是，`{1,2}` 并不是 `std::initializer_list<int>`，而是被称为\
  \ `braced-init-list`（列表初始化列表）的表达式。`braced-init-list` 是一对包含零或多个元素的大括号。它可以出现在几种环境中；最常见的是用于初始化。以下是一些用于初始化的\
  \ `braced-init-lists` 示例：\n\n源码引用：`[examples/braced-init-list/braced-init-list.cpp](http://media.pragprog.com/titles/akbrain/code/examples/braced-init-list/braced-init-list.cpp)`\n\
  \n```cpp\nstd::array<int, 3> a{1, 2, 3};\nint i{2};\nint j{};\nf({1, 2});\nstd::map<int,\
  \ std::string>{{1, \"one\"}, {2, \"two\"}};\nreturn {1, 2};\n```\n\n从 `i` 和 `j`\
  \ 的初始化可以看出，即使大括号之间只有零或一个元素，而不是一个项的“列表”，该表达式仍被称为 `braced-init-list`。\n\n来自 `braced-init-list`\
  \ 的初始化被称为 `list-initialization`（列表初始化），不幸的是，在这些语境下 `braced-init-list` 被称为 `initializer\
  \ list`。`initializer list` 并不等同于类模板 `std::initializer_list<T>`。这些名字相当误淆。\n\n所以，如果\
  \ `{1,2}` 不是 `std::initializer_list`，为什么它选择了 `std::initializer_list` 构造函数呢？重载解析对\
  \ `list-initialization` 有一个特殊情况，它分为两个阶段：\n\n- 首先，它对所有接收 `std::initializer_list`\
  \ 的构造函数进行重载解析，将 `braced-init-list` 视为单个参数。\n- 然后，且只有在第一阶段未成功时，它才对其他构造函数进行重载解析，将\
  \ `braced-init-list` 中的元素视为独立的参数。\n\n因此在 `Container container2{1, 2}` 的情况下，重载解析首先尝试\
  \ `std::initializer_list<float>` 构造函数。`int` 可以隐式转换为 `float`，同样，`int` 的初始化列表可以用于创建\
  \ `std::initializer_list<float>`。因此，选中了 `std::initializer_list<float>` 构造函数，另一个构造函数甚至没有被考虑过。\n\
  \n现在回答加问题：如果我们移除 `std::initializer_list<float>` 构造函数会发生什么？对于 `Container container1(1,\
  \ 2)`，没有变化，因为这不是 `list-initialization`。对于 `Container container2{1, 2}`，重载解析在第一阶段没有找到任何接收\
  \ `std::initializer_list` 的构造函数并移动到另一个构造函数。两种情况下都使用了接收两个 `int` 的构造函数，程序仍然可以编译。\n\
  \n| std::vector |\n| --- |\n| ![images/aside-icons/note.png](img/note.png) | 如果你想过为什么\
  \ `std::vector<int> v(1,2)` 得到一个元素为 2 的 vector，而 `std::vector<int> v{1,2}` 得到有两个元素\
  \ 1 和 2 的 vector，现在你知道为什么了。 |\n\n- 第一种情况不是 `list-initialization`，它选择了接收 `size_type`\
  \ 和 `T` 的构造函数。\n- 第二种情况是 `list-initialization`，它选择了接收 `std::initializer_list<T>`\
  \ 的构造函数。\n\n### 谜题 17：强点\n\n源码引用：`[a-strong-point.cpp](http://media.pragprog.com/titles/akbrain/code/a-strong-point.cpp)`\n\
  \n```cpp\n#include <iostream>\nstruct Points {\n    Points(int value) : value_(value)\
  \ {}\n    int value_;\n};\n\nstruct Player {\n    explicit Player(Points points)\
  \ : points_(points) {}\n    Points points_;\n};\n\nint main() {\n    Player player(3);\n\
  \    std::cout << player.points_.value_;\n}\n```\n\n| 猜猜输出 |\n| --- |\n\n\n\n\n\n\
  | ![images/aside-icons/important.png](img/important.png) | 在移动到下一页之前，尝试猜一下输出是什么。\
  \ |\n\n程序显示了如下输出：\n\n|  | 3 |\n\n### 讨论\n\n`Player` 结构体有一个成员 `points_`，用于跟踪玩家的分数。我们没有使用\
  \ `int` 这种基本类型来表示，而是使用了一个自定义类型 `Points`。这种技术通常被称为“强类型”，它可以使代码更易读并避免产生错误。例如，假设有一个函数\
  \ `do_something(int player_id, int points, int lives)`，很容易失误并将参数传递为 `player_id,\
  \ lives, points`，导致生命值数量被用作分数，反之亦然。当你为这些值使用独立的强类型时，这种错误会导致程序编译失败，而不是产生一个 bug（错误）。\n\
  \n这个谜题中的问题是，我们是否允许直接从 `int` 构建一个 `Player` 对象（就像我们在表达式 `Player player(3)` 中做的那样），还是我们需要手动创建一个强类型\
  \ `Points` 的对象并传递给 `Player` 构造函数。\n\n为了让 `Player player(3)` 运行，我们需要从 `int` 的隐式转换。只有没有标记为\
  \ `explicit` 的构造函数（即所谓的转换构造函数）才能参与隐式转换。`Player` 的构造函数被标记为 `explicit`，因此它不是转换构造函数，那么这种转换是如何运作的呢？\n\
  \n`Player player(3)` 是直接初始化的一个示例（`Player player{3}` 也是，但例如 `Player player = 3` 则不是）。我喜欢认为我们正在直接调用\
  \ `Player` 的构造函数。在直接初始化中，使用重载解析来选择最佳构造函数。当我们从 `int` 直接初始化一个 `Player` 时，重载解析会尝试寻找从\
  \ `int` 到 `Player` 的每个构造函数的隐式转换序列。`Player` 只有一个接收 `Points` 的构造函数，因此我们需要从 `int` 到\
  \ `Points` 的隐式转换。`Points` 的构造函数不是 `explicit`，所以它是一个转换构造函数，可以使用于隐式转换序列。`3` 被隐式转换为\
  \ `Points`，然后这个 `Points` 对象被传递给 `Player` 的构造函数。\n\n`Player` 构造函数本身并没有参与隐式转换；记住，我们是直接调用它的。所以它是否为\
  \ `explicit` 并没有区别。\n\n另一方面，如果 `Points` 的构造函数是 `explicit` 的，那么它将不再是转换构造函数，并且无法用于隐式转换序列。我们不再不再能将\
  \ `int 3` 隐式转换为 `Points`，程序将无法编译。\n\n为你的强类型加上 `explicit` 构造函数会使代码稍微冗长，但也更健壮。回到 `do_something`\
  \ 的例子，你现在必须写 `do_something(PlayerId{42}, Points{3}, Lives{1})` 程序才能编译，而使用转换构造函数时，你仍然可能误写为\
  \ `do_something(42, 1, 3)` 程序依然可以编译。我也觉得前者更具读性。\n\n| 拷贝初始化 vs. 直接初始化 |\n| --- |\n\
  | ![images/aside-icons/note.png](img/note.png) | 如果我们写成这样呢：Player player = 3 这种形式被称为拷贝初始化，与直接初始化略有不同。现在我们不再直接调用\
  \ `Player` 构造函数；而是尝试将 `int` 隐式转换为 `Player`。隐式转换序列只能包含一个用户定义的转换，但我们需要一个从 `int` 到\
  \ `Player` 的转换，然后是第二个从 `Player` 到 `Points` 的转换。因此，无论任何构造函数是否为 `explicit`，`Player\
  \ player = 3` 永远无法编译。 |\n\n| 建议 |\n| --- |\n| ![images/aside-icons/tip.png](img/tip.png)\
  \ | |\n\n- 将单参数构造函数标记为 `explicit`，以避免意外的隐式转换。\n- 使用强类型代替基本类型以避免 bug。\n- 考虑使用强类型库，例如\
  \ Björn Fahller 的 `strong_type`，以减少创建强类型时的样板代码。 |\n\n### 进阶阅读\n\n直接初始化\n[`en.cppreference.com/w/cpp/language/direct_initialization`](https://en.cppreference.com/w/cpp/language/direct_initialization)\n\
  \n拷贝初始化\n[`en.cppreference.com/w/cpp/language/copy_initialization`](https://en.cppreference.com/w/cpp/language/copy_initialization)\n\
  \nC++ 核心准则 C.46: 默认声明单参数构造函数为 explicit\n[`isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines#c46-by-default-declare-single-argument-constructors-explicit`](https://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines#c46-by-default-declare-single-argument-constructors-explicit)\
  \ |\n\n| 谜题 18 | 移出 (Moving Out) |\n[moving-out.cpp](http://media.pragprog.com/titles/akbrain/code/moving-out.cpp)\
  \ |\n\n```cpp\n#include <iostream>\n#include <string>\n\nint main() {\n    std::string\
  \ hello{\"Hello, World!\"};\n    std::string other(std::move(hello));\n    std::cout\
  \ << \"'\" << hello << \"'\";\n}\n```\n\n| 猜猜输出 |\n| --- |\n| ![images/aside-icons/important.png](img/important.png)\
  \ | 在移动到下一页之前，尝试猜一下输出是什么。 |\n\n程序具有未定义行为（unspecified behavior）！但它可能输出如下：\n\n|  |\
  \ '' |\n\n### 讨论\n\n被移动过的对象（moved-from object）不应再次使用，因为资源已经从中移出，指针可能会指向已销毁的对象等等。\n\
  \n一个特定的被移动过的对象的行为取决于该类的实现者。实现者在这里有很大的自由度，但至少对象应该是安全的销毁的，这样当一个被移动过的局部变量离开作用域时，就不会发生任何问题。除非明确说明，否则作为用户，你不应该假设某个类提供了进一步的保证。\n\
  \nC++ 标准为标准库中的类提供了额外的保证，尽管如此：\n\n> C++ 标准库中定义的类型对象可以被移动。……除非另有说明，此类被移动过的对象应处于一个有效但未指定的状态。\n\
  \n`std::string` 没有做另行说明，因此被移动过的字符串被放置在“有效但未指定的状态”。但这意味着什么呢？\n\nC++ 标准提供了以下定义：\n\n\
  > (a) 对象的的值未指定，除非该对象满足不变性（invariants），且对对象的操作按照其类型指定的方式执行。\n\n所以，虽然我们不知道被移动过的字符串包含什么，但我们至少知道\
  \ `.size()` 返回的是其中剩余字符串的大小，`.empty()` 在当且仅当 `.size() == 0` 时为真，以此此类推。尽管如此，对象的实际状态是未指定的，我们无法确定输出是什么，因此最好完全避免使用被移动过的对象。\n\
  \n| std::string 移动构造函数的实现 |\n| --- |\n\n\n\n\n\n实现 `std::string` 移动构造函数的一种典型方式是让新字符串“窃取”旧字符串的内存以避免拷贝。此时，重要的是不能再通过旧字符串对象访问这块内存，否则对其中一个字符串的修改也会影响另一个。同样重要的一点是，旧字符串不要在它的析构函数中尝试释放这块内存。如果\
  \ `std::string` 是通过一个指向堆上字符串缓冲区的指针实现的，可以想象移动构造函数将旧字符串的缓冲区指针设为 `null`。你可以使用类似的技术为你自己的类实现移动操作。\n\
  \n某些实现通过将字符串存储在 `std::string` 对象内部而不是在堆上分配缓冲区来优化短字符串，这种技术被称为短字符串优化（Short String\
  \ Optimization）。在这些情况下，移动构造函数无法窃取旧字符串的内存，因此需要拷贝。对于这种被移动过的字符串（moved-from string），一个合理的有效状态是它仍然包含原始字符串。我在\
  \ Windows、Mac 和 Linux 上都测试了这一点，包括长字符串和短字符串。在所有情况下，它们输出的空字符串 `\"\"`。但正如常遇到的遇到未定义行为一样，我不会假设这总是成立的。我只会假设\
  \ `std::string` 的不变性是满足的。\n\n### 建议\n\n- 不要使用被移动过的对象（销毁它们除外）。\n- 在你自己的类中，尝试让移动构造函数和移动赋值运算符将对象置于一个仍然满足不变性的有效状态。\n\
  - 如果你做不到，至少确保调用析构函数是安全的。\n\n### 延伸阅读\n\n- `std::string` 构造函数：[`en.cppreference.com/w/cpp/string/basic_string/basic_string`](https://en.cppreference.com/w/cpp/string/basic_string/basic_string)\n\
  - 库类型被移动后的状态：[`timsong-cpp.github.io/cppwp/std20/lib.types.movedfrom`](https://timsong-cpp.github.io/cppwp/std20/lib.types.movedfrom)\n\
  - 有效但未指定的状态：[`timsong-cpp.github.io/cppwp/std20/defns.valid`](https://timsong-cpp.github.io/cppwp/std20/defns.valid)\n\
  \n### 谜题 19：小求和\n\n[a-little-sum-thing.cpp](http://media.pragprog.com/titles/akbrain/code/a-little-sum-thing.cpp)\n\
  \n```cpp\n#include <iostream>\n#include <numeric>\n#include <vector>\n\nint main()\
  \ {\n    std::vector<int> v{-2, -3};\n    std::cout << std::accumulate(v.cbegin(),\
  \ v.cend(), v.size());\n}\n```\n\n### 猜输出\n\n在进入下一页之前，尝试猜猜输出是什么。\n\n程序具有实现定义的行为（implementation-defined\
  \ behavior）！但它输出了一个很大的数字，例如这个：\n\n```\n18446744073709551613\n```\n\n### 讨论\n\nvector\
  \ 的大小为 2。当我们向它加上 -2 和 -3 时，为什么结果不是 -3 呢？\n\n`std::accumulate` 函数模板定义如下：\n\n```cpp\n\
  template<class InputIterator, class T>\nconstexpr T accumulate(InputIterator first,\
  \ InputIterator last, T init);\n```\n\n> 影响：通过用初始值 `init` 初始化累加器 `acc`，然后按照顺序对范围\
  \ `first, last)` 中的每个迭代器 `i` 修改它（`acc = std::move(acc) + *i`……）来计算结果。\n\n让我们从推导模板参数开始。`InputIterator`\
  \ 将被推导为 vector 的迭代器类型，这对于这个谜题没有意义，因为它只用于迭代。另一方面，`T` 将被推导为 `std::vector<int>::size()`\
  \ 的类型，这是解题的关键。`std::vector<int>::size()` 返回 `size_type`，标准并没有对其进行详细规定。它只要求是一个无符号整数类型，只要满足该要求，实现就可以选择在该特定系统上最自然的表示形式。\n\
  \n因此，`init` 的类型、返回值以及 `std::accumulate` 内部的累加器 `acc` 都是这种无符号整数类型 `size_type`。当我们向无符号类型加上负数时，注定会出现问题。但具体是什么问题呢？重要的是，这算未定义行为吗？\n\
  \n有两种错误场景令人担忧：\n\n- 当将一种整数类型的值转换为另一种整数类型时，如果该值超出了新类型的范围。这听起来没有那么危险，因为操作实际上并没有发生溢出，而是回绕（wrap\
  \ around）。这对于无符号整数是如此，而且从 C++20 开始，符号整数也是如此。例如，一个 8 位的符号整数如 `int8_t` 可以表示 -128 到\
  \ 127 之间的值。如果我尝试给它赋值 128（大了 1），它会回绕到 -128。当发生回绕时，你定会得到错误的结果，但至少它不是未定义行为。\n- 进行算术运算时，如果结果超出了结果类型的范围。对于无符号整数，我们再次回绕。但对于符号整数，我们会得到溢出，这是未定义行为。\n\
  \n由于我们正在向无符号的 `acc` 加上负数 -2 和 -3，我们至少可以预见到一些回绕，但我们可以预见到溢出导致未定义行为吗？这取决于我们最终是否加上了两个和超出结果类型范围的符号整数。让我们仔细观察\
  \ `std::accumulate` 中发生了什么，看看这是否可能。\n\n算法首先用大小 2 初始化累加器 `acc`。`acc` 的类型为 `T`，我们之前推导出它是未指定的无符号整数类型\
  \ `size_type`。然后我们逐将符号整数 -2 和 -3 加上 `acc`。最后，返回 `acc`。这些是列出的步骤：\n\n```cpp\nsize_type\
  \ acc = 2; // size_type 是无符号的\nacc = acc + -2; // 无符号数和负符号数的加\nacc = acc + -3; //\
  \ 无符号数和负符号数的加\nreturn acc;\n```\n\n现在，当我们把两个符号整数 -2 和 -3 加上未知的无符号整数类型 `size_type`\
  \ 时会发生什么？在谜题 14，谜题 14，[亚里士德的部分之和 中，我们学习了通常算术转换和整数提升，这些在这里也发生了。\n\n由于我们不知道 `size_type`\
  \ 和 `int` 的宽度，我们需要考虑三种情况：\n\n### 如果 size_type 能够放入 int 中\n\n如果 `int` 可以表示 `size_type`\
  \ 的所有值，`acc` 将提升为 `int`，加法将在 `int` 类型上进行。由于 `size_type` 是无符号的，只有当 `size_type` 小于\
  \ `int` 时才会发生。实现选择比 `int` 小的 `size_type` 非常不利，但根据标准这是可以的。在这种情况下发生如下：\n\n首先，我们将 -2\
  \ 加上 `acc`。在将 `acc` 从 `size_type` 提升为 `int` 后，操作数的类型相同（`int`），不需要进一步转换。我们将 2 和 -2\
  \ 相加得到 0，它符合结果类型 `int`。这个 `int` 0 被转换回 `size_type` 并存储在 `acc` 中。\n\n接下来，我们将 -3 加上\
  \ `acc`。在将 `acc` 从 `size_type` 提升为 `int` 后，我们将 0 和 -3 相加得到 -3，它同样符合结果类型 `int`。`int`\
  \ -3 被转换回 `size_type`。由于 `size_type` 是无符号的，-3 回绕到 `std::numeric_limits<size_type>::max()`\
  \ - 2，它存储在 `acc` 中作为最终结果并返回。如果 `size_type` 是例如 `uint16_t`，结果将是 65533。这产生了回绕和错误的结果，但没有未定义行为。\n\
  \n\n\n\n这里是该过程中涉及的类型和转换图表。`acc` 被提升为 `int`，与第一个值相加，结果转换回 `size_type` 并存储在 `acc`\
  \ 中。然后我们对第二个值再次进行一次循环。\n\n![images/conversions1.drawio.png](img/conversions1.drawio.png)\n\
  \n`size_type` 到 `int` 的提升没有问题，因为 `size_type` 可以放入 `int` 中。符号加法存在溢出的风险，并可能导致未定义行为，如果结果无法放入\
  \ `int` 的话（但根据本谜题的输入，这种情况不会发生）。`int` 到 `size_type` 的转换在结果为负时可能会发生回绕（在本题中发生了这种情况），或者如果数值过大（在本题中未发生）。\n\
  \n### 如果 size_type 无法放入 int 但可以放入 unsigned int\n\n如果 `int` 无法表示 `size_type` 的所有值，但\
  \ `unsigned int` 可以，则 `acc` 将被提升为 `unsigned int`。这种情况只可能发生在 `size_type` 的宽度与 `int`\
  \ 和 `unsigned int` 相同的情况下。如果 `size_type` 较小，它可以放入 `int`；如果它更宽，则无法放入 `unsigned int`。\n\
  \n在 `acc` 从 `size_type` 提升为 `unsigned int` 之后，操作数的类型仍然不同，因此继续进行常规算术转换。由于 `size_type`\
  \ 和 `int` 宽度相同，它们的秩（rank）也相同，`int` 被转换为 `unsigned int`（详参见[常规算术转换^([[14]](#f_0036.xhtml_FOOTNOTE-14))]\
  \ ）。加法以 `unsigned int` 类型进行。\n\n首先，我们将 -2 加到 `acc` 上。`-2` 被转换为 `unsigned int`，且由于它是负数，它会回绕到\
  \ `std::numeric_limits<unsigned int>::max() - 1`。当它与值为 `2` 的 `acc` 相加时，它会再次回绕到 `0`。\n\
  \n接下来，我们将 `-3` 加到 `acc` 上。`-3` 被转换为 `unsigned int`，同样由于它是负数，它会回绕到 `std::numeric_limits<unsigned\
  \ int>::max() - 2`。当它与值为 `0` 的 `acc` 相加时，结果为 `std::numeric_limits<unsigned int>::max()\
  \ - 2`，并作为最终结果存储在 `acc` 中。在具有 32 位 `int` 的典型系统上，结果将是 `4294967293`。这产生了多次回绕和一个错误的结果，但没有产生未定义行为。\n\
  \n这里是该过程中涉及的类型和转换图表。`acc` 被提升为 `unsigned int`，第一个值被转换为 `unsigned int`，它们相相加，结果转换回\
  \ `size_type` 并存储在 `acc` 中。然后我们对第二个值再次进行一次循环。\n\n![images/conversions2.drawio.png](img/conversions2.drawio.png)\n\
  \n`size_type` 到 `unsigned int` 的提升没有问题，因为 `size_type` 和 `unsigned int` 都是无符号类型且宽度相同。`int`\
  \ 到 `unsigned int` 的转换在数值为负时可能会发生回绕（根据本题的输入，这种情况发生了）。无符号加法在结果过大时可能会回绕（在本题中未发生）。`unsigned\
  \ int` 到 `size_type` 的转换没有问题，因为 `unsigned int` 和 `size_type` 都是无符号类型且宽度相同。\n\n###\
  \ 如果 size_type 无法放入 int 还是 unsigned int\n\n这是最常见的情况，例如 `int` 是 32 位的而 `size_type`\
  \ 是一个 64 位无符号类型。在这种情况下，不会对 `size_type` 执行整型提升（integral promotion）；我们只需要担心剩余的常规算术转换。由于\
  \ `size_type` 比 `int` 大，`size_type` 的秩更高，这意味着 `int` 被转换为无符号类型 `size_type`，加法以 `size_type`\
  \ 类型进行。\n\n首先，我们将 -2 加到 `acc` 上。`-2` 被转换为 `size_type` 并回绕到 `std::numeric_limits<size_type>::max()\
  \ - 1`。当它与值为 `2` 的 `acc` 相加时，它会再次回绕到 `0`。\n\n接下来，我们将 `-3` 加到 `acc` 上。`-3` 被转换为 `size_type`\
  \ 并回绕到 `std::numeric_limits<size_type>::max() - 2`。当它与值为 `0` 的 `acc` 相加时，结果为 `std::numeric_limits<size_type>::max()\
  \ - 2`，并作为最终结果存储在 `acc` 中。在具有 32 位 `int` 和 64 位 `size_type` 的典型系统上，结果将是 `18446744073709551613`。同样，我们看到了多次回绕和一个错误的结果，但没有产生未定义行为。\n\
  \n这里是该过程中涉及的类型和转换图表。第一个值被转换为 `size_type`，与 `acc` 相加，结果存储在 `acc` 中。然后我们对第二个值再次进行一次循环。\n\
  \n![images/conversions3.drawio.png](img/conversions3.drawio.png)\n\n`int` 到 `size_type`\
  \ 的转换在数值为负时可能会发生回绕，根据本题的输入，这种情况发生了）。无符号加法在结果过大时可能会回绕（在本题中未发生）。\n\n### 你还在看吗？\n\n\
  我在上面省略了许多细节，特别是导致这些特定转换序列的精确规则，尽管如此，解释仍然变得很长。如果你读到了最后，太棒了，你抓住了要点。如果你在某处断开了，没担心，你还是抓住了要点！要点在于，整数之间隐式转换的推理是非常复杂的，在生产代码中最好避免。\n\
  \n### 我们能做什么？\n\n遗憾的是，没有任何主要的编译器会对此发出警告，即使对 GCC 和 Clang 使用 `-Wall` `-Wextra` 以及对\
  \ MSVC 使用 `/Wall`。某些编译器（如 GCC 和 Clang）具有额外的选项，如 `-Wsign-conversion`，它们没有包含在 `-Wall`\
  \ 或 `-Wextra` 中，必须单独启用。遗憾的是，即使启用了它们，你对这个特定的谜题也不会得到任何警告。（如果 `accumulate` 函数是在你代码中定义的，你就得到了。）\n\
  \n\n\n\n```cpp\nJormungandr jormungandr2{std::move(jormungandr1)};\n```\n\n```cpp\n\
  }\n```\n\n### 猜输出\n\n![images/aside-icons/important.png](img/important.png) 在进入下一页之前，尝试猜猜输出是什么。\n\
  \n![images/hline.png](img/hline.png)\n\n程序显示如下输出：\n\n```\nMonster copied\nJormungandr\
  \ moved\n```\n\n![images/hline.png](img/hline.png)\n\n### 讨论\n\n当我们用一个被移动的对象来初始化第二个\
  \ `Jormungandr` 时，调用的是 `Jormungandr` 的移动构造函数，而不是 `Monster` 的拷贝构造函数。这是为什么呢？\n\n正如我们在谜题\
  \ 8 中学到的，谜题 8 它会移动吗？，当我们将一个表达式包裹在 `std::move` 中时，它会变成一个右值（rvalue）。不过，这里有一个重要的细节：值类别（value\
  \ categories）是针对表达式的，而不是对象的。因此，对象 `jormungandr1` 本身没有发生变化；只是表达式 `jormungandr1` 是左值（lvalue），而表达式\
  \ `std::move(jormungandr1)` 是右值。如果你问我的话，如果把它们称为“l-表达式”和“r-表达式”而不是“左值”和“右值”，会更简单。\n\
  \n当我们接着用表达式 `Jormungandr jormungandr2{std::move(jormungandr1)}` 拷贝初始化 `jormungandr2`\
  \ 时，重载解析偏向于使用 `Jormungandr` 的移动构造函数而不是拷贝构造函数，因为表达式 `std::move(jormungandr1)` 是一个可以被移动的右值。是的，你读得没错，即使恰好调用了移动构造函数，这种形式始终被称为拷贝初始化（copy-initialization）。并没有所谓的移动初始化（move-initialization）。\n\
  \n现在让我们关注 `Jormungandr` 移动构造函数的实现。你可能已经发现了这个 bug：我们忘记像这样将 `other` 包裹在 `std::move`\
  \ 中：\n\n[examples/which-constructors/which-constructors.cpp](http://media.pragprog.com/titles/akbrain/code/examples/which-constructors/which-constructors.cpp)\n\
  \n```cpp\nJormungandr(Jormungandr &&other) : Monster(std::move(other))\n```\n\n\
  参数 `other` 是一个右值引用。但传递给 `Monster` 构造函数的表达式 `other` 却是一个左值！由于表达式 `other` 是左值，我们无法使用移动构造函数，重载解析便选择了拷贝构造函数。然而，在将其包裹在\
  \ `std::move` 之后，表达式 `std::move(other)` 现在是一个右值，于是选中了移动构造函数。\n\n输出将变为变为：\n\n```\n\
  Monster moved\nJormungandr moved\n```\n\n附加问题：如果 `Monster` 像这样定义，会发生什么？\n\n[examples/which-constructors/which-constructors.cpp](http://media.pragprog.com/titles/akbrain/code/examples/which-constructors/which-constructors.cpp)\n\
  \n```cpp\nstruct Monster {\n    Monster() = default;\n    Monster(const Monster\
  \ &other) {\n        std::cout << \"Monster copied\\n\";\n    }\n};\n```\n\n由于我们显式声明了拷贝构造函数，我们就不会隐式地获得默认或移动构造函数。我们显式声明了默认构造函数，但没有移动构造函数，所以\
  \ `Monster` 并没有移动构造函数。\n\n当 `Jormungandr` 的移动构造函数执行 `: Monster(std::move(other))`\
  \ 时，表达式 `std::move(other)` 仍然是一个右值。更具体地说，正如我们在谜题 9，统计拷贝次数 中看到的，当你将一个左值包裹在 `std::move()`\
  \ 中时，它会变成一种称为 x 值（xvalue）的右值。这意味着对象仍然具有像左值一样的身份（identity），但我们被允许像右值一样对其进行移动。如果 `Monster`\
  \ 在这里有一个移动构造函数（带有 `Monster &&` 参数），那么在传递右值时，重载解析将优先选择它而不是拷贝构造函数（带有 `const Monster\
  \ &` 参数）。但由于它没有移动构造函数，且 const 左值引用可以绑定到右值，因此使用了拷贝构造函数。\n\n我们又回到了这个结果：\n\n```\nMonster\
  \ copied\nJormungandr moved\n```\n\n### 扩展阅读\n\nLvalues, Rvalues, Glvalues, Prvalues,\
