  \n## 谜题 9 | 统计拷贝次数\n\n[counting-copies.cpp](http://media.pragprog.com/titles/akbrain/code/counting-copies.cpp)\n\
  \n```cpp\n#include <iostream>\n\nstruct Resource\n{\n    Resource() = default;\n\
  \    Resource(const Resource &other)\n    {\n        std::cout << \"copy\\n\";\n\
  \    }\n};\n\nResource getResource()\n{\n    return Resource{};\n}\n\nint main()\n\
  {\n    Resource resource1 = getResource();\n    Resource resource2{resource1};\n\
  }\n```\n\n猜测输出\n| --- |\n| ![images/aside-icons/important.png](img/important.png)\
  \ | 在移动到下一页之前，尝试猜测输出是什么。 |\n\n![images/hline.png](img/hline.png)\n\n程序显示如下输出：\n\n\
  | | copy |\n\n![images/hline.png](img/hline.png)\n\n### 讨论\n\n在这个程序中似乎发生了三次拷贝。一次是为了用临时\
  \ `Resource{}` 初始化 `getResource` 的返回对象，一次是为了用该返回对象初始化 `resource1`，还有一次是为了初始化 `resource2`。然而，从\
  \ `getResource()` 返回并初始化 `resource1` 时并没有发生拷贝。这怎么可能呢？\n\n让我们先看看返回语句，它似乎是从临时 `Resource{}`\
  \ 初始化返回对象的。返回语句中的表达式 `Resource{}` 是一种被称为 prvalue 的右值，或“纯”右值。在之前的谜题 Puzzle 8 Will\
  \ It Move? 中，我们首先接触了左值和右值，并了解到右值是你可以从中移动、绑定右值引用到其等的表达式。实际上，右值有两种类型——xvalues 和 prvalues：\n\
  \n\n\n\n\n*   一个 `xvalue`（或“即将过期的左值”）是在当你对一个左值调用 `std::move` 时得到的结果。例如，在谜题 8 中，*它会移动吗？\
  \ 中的表达式 `objectWithConstMember` 是一个左值。它求值为一个存在于某处的实际对象，我们可以获取它的地址，等等。当我们执行 `std::move(objectWithConstMember)`\
  \ 时，我们现在有了一个 `xvalue`。这个表达式仍然求值为一个实际对象，但我们被允许将其视为右值并对其进行移动（move）。\n*   另一方面，一个 `prvalue`\
  \ 是一个“纯”的右值。它是一个初始化新对象的表达式，而不是仅仅将现有的对象转换为右值。\n\n在 C++11 中，prvalues 是未命名的临时对象，编译器允许省略（或跳过）它们的拷贝。当未命名的临时对象作为返回语句的操作数时，这种形式的拷贝消除（如本谜题所示）被称为无命名返回值优化（URVO）——之所以称为无命名，是因为它适用于函数返回一个未命名的临时对象的情况。在\
  \ C++17 中，在这些情况下避免拷贝变成了强制性。但语言并没有强制要求 URVO，而是通过改变语言，使得现在从根本上就没有一个可以用来优化掉拷贝的对象了！prvalues\
  \ 不再是未命名的临时对象；它们仅仅代表一个对象的概念，该对象稍后才会具体化。\n\n另一种形式的返回值优化仍然不是强制性的，被称为具命名返回值优化（NRVO）。这适用于返回一个局部变量而不是\
  \ prvalue 的情况；在这种情况下，实现允许省略拷贝，但不是必须这样做。即使拷贝构造函数有副作用，NRVO 依然适用；此时这些副作用就根本不会发生。这是一个优化可以改变程序可观测行为的极罕见情况！\n\
  \n这里有一个同时包含无命名和具命名返回值优化的示例：\n\n[examples/rvo/rvo.cpp](http://media.pragprog.com/titles/akbrain/code/examples/rvo/rvo.cpp)\n\
  \n```cpp\nResource getResource() {\n    return Resource{}; // 无命名 RVO (C++17 之前)\n\
  }\n\nResource getResource() {\n    Resource resource;\n    return resource; // 具命名\
  \ RVO\n}\n```\n\n现在让我们来看表达式 `Resource resource1 = getResource()`，它似乎将返回的对象拷贝到了 `resource1`\
  \ 中。函数调用是一个 prvalue，所以同样的原理也适用于这里。对 `getResource()` 的调用并没有产生一个临时对象；它仅仅代表了返回值的概念，在\
  \ `resource1` 用它初始化之前，实际上并没有创建 `Resource` 对象。\n\n在标准中定义诸如“对象的概念”之类的内容固然很好，但在实践中如何实现这一点呢？毕竟，`Resource`\
  \ 对象最终应该位于 `main` 的栈帧上，但创建它的实际代码在 `getResource()` 中，而该函数无法访问 `main` 的栈帧。\n\n大多数系统使用的用于避免拷贝的技巧是：`main`\
  \ 在它的栈帧中为 `resource1` 留出空间，就像为其他局部变量留空间一样。然后 `main` 将指向该内存的指针作为一个“秘密”额外参数传递给 `getResource()`，仿佛其签名是\
  \ `getResource(Resource* ptr)`。现在 `getResource()` 就可以直接在这个内存位置上构造对象。\n\n为了使这种机制生效，调用者和被调用者必须达成这一约定，因此它是系统应用二进制接口（ABI）的一部分。一种流行的\
  \ ABI 是 Itanium C++ ABI,10，例如它被用于 Linux。`GCC` 和 `Clang` 都符合这一 ABI，所以你可以自由地从由一个编译器编译的函数调用由另一个编译器编译的函数。Itanium\
  \ C++ ABI 规定：\n\n> 如果返回类型是一个对于调用而言是非平凡的类类型，调用者将一个地址作为隐式参数传递。被调用者随后在该地址上构造返回值。\n\n\
  如果我们在 Compiler Explorer 上尝试，选择 `x86_64` 架构，我们发现 `GCC` 和 `Clang` 的当前版本在 `main` 中都生成这段代码：\n\
  \n```assembly\nlea rax, [rbp-4]\nmov rdi, rax\ncall getResource()\n```\n\n`[rbp-4]`\
  \ 是 `resource1` 在 `main` 栈帧中的地址。这个地址被加载到 `rdi` 寄存器中（用于向函数传递第一个整数/指针参数），然后调用 `getResource()`。\n\
  \n对于 `MSVC`，要追踪其 ABI ABI 信息较为困难。但使用 Compiler Explorer，我们可以在 `x86_64` 上看到类似的模式：\n\
  \n```assembly\nlea rcx, QWORD PTR resource1$[rsp]\ncall Resource getResource(void)\
  \ ; getResource\n```\n\n约定是相同的，除了用于指针的寄存器是 `rcx`。\n\n| 建议 |\n| :--- |\n| 所有主流编译器多年来都同时支持具命名和无命名返回值优化（我早在\
  \ `Clang` 3、`GCC` 4 和 `Visual Studio` 2008 时就检查过 11\n- 保证的拷贝消除并不消除拷贝\n[`blog.tartanllama.xyz/guaranteed-copy-elision/`](https://blog.tartanllama.xyz/guaranteed-copy-elision/)\n\
  - 返回值优化/拷贝消除\n[`en.cppreference.com/w/cpp/language/copy_elision`](https://en.cppreference.com/w/cpp/language/copy_elision)\n\
  - Itanium C++ ABI\n[`itanium-cxx-abi.github.io/cxx-abi/abi.html`](https://itanium-cxx-abi.github.io/cxx-abi/abi.html)\n\
  - 解释示例中的所有汇编\n[`www.youtube.com/watch?v=I7j6Q8xMc`](https://www.youtube.com/watch?v=I7j6Q8xMc)\n\
  \n### 谜题 10：奇怪的赋值\n\n[a-strange-assignment.cpp](http://media.pragprog.com/titles/akbrain/code/a-strange-assignment.cpp)\n\
  \n```cpp\n#include <iostream>\n#include <string>\n\nstd::string getName() {\n  \
  \  return \"Alice\";\n}\n\nint main() {\n    std::string name{\"Bob\"};\n    getName()\
  \ = name;\n    std::cout << \"Assigned to a function!\\n\";\n}\n```\n\n| 猜测输出 |\n\
  | :--- |\n| 在进入下一页之前，尝试猜测输出。 |\n\n程序显示如下输出：\n\n```\nAssigned to a function!\n```\n\
  \n### 讨论\n\n等等，什么？赋值给函数？这是什么意思？乍一看，我们似乎在将一个变量赋值给函数调用，这与我们常见的 `name = getName()`\
  \ 相反。让我们仔细观察发生了什么。\n\n表达式 `getName()` 调用 `getName`，返回一个字符串 \"Alice\"。这产生了一个类型为 `std::string`\
  \ 的临时对象，值为 \"Alice\"。然后我们将变量 `name`（包含值 \"Bob\"）拷贝赋值给这个临时对象。当我们这样看时，一切突然变得合理了。但仔细观察引发了一些问题。\n\
  \n在谜题 9 中，谜题 9，计算拷贝中你被介绍了 prvalues：\n\n```cpp\nResource getResource() {\n    return\
  \ Resource{};\n}\n\nResource resource1 = getResource();\n```\n\n\n\n\n在这里我们讨论过，函数调用\
  \ `getResource()` 是一个 prvalue（纯值），它不会产生一个临时的 `Resource`。相反，返回值直接在 `resource1` 对象中被创建，并且不允许进行任何拷贝。\n\
  \n这个谜题中的表达式 `getName()` 也是一个 prvalue，因此在我们将它赋值给某个东西之前，返回的对象甚至不存在，而我们并没有这样做！\n\n\
  如果不存在对象，我们又如何能将 `name` 拷贝赋值给它呢？临时对象实例化（Temporary materialization）来救场。函数调用之所以是 prvalue\
  \ 且不创建对象的原因是为了避免不必要的拷贝。在之前的 `Resource` 示例中，实际对象的创建被推迟到我们将 `getResource()` 的结果赋值给\
  \ `resource1` 的时候。但有时我们调用函数仅仅是为了它的副作用，而不将结果赋值给任何东西，就像我们在这个谜题中调用 `getName()` 一样。当我们不对表达式的结果赋值给任何东西时，我们称之为弃值表达式（discarded-value\
  \ expression）。我们仍然希望创建一个对象，因此会实例化一个临时对象。这就是这里发生的情况——prvalue 表达式 `getName()` 创建了一个临时的\
  \ `std::string`。\n\n现在我们有了一个真正的 `std::string` 临时对象，我们可以很好地将 `name` 拷贝赋值给它了。\n\n\
  ### 将引用绑定到 prvalues\n\n| | --- |\n| ![images/aside-icons/note.png](img/note.png)\
  \ | 临时对象实例化重要的另一个情况是将引用绑定到 prvalue。想象一下，例如假设我们有一个像下面这样的函数：\n\n```cpp\nvoid useName(const\
  \ std::string& name_ref);\nvoid useName(std::string&& name_ref);\n```\n\n如果我们接着执行\
  \ `useName(getName());`，那么引用参数 `name_ref` 需要有实际的对象来绑定。而这确实就是将引用绑定到 prvalue 时发生的情况——会实例化一个临时对象。\
  \ |\n\n### 进阶阅读\n\nLvalues, Rvalues, Glvalues, Prvalues, Xvalues, 帮助！\n\n[`blog.knatten.org/2018/03/09/lvalues-rvalues-glvalues-prvalues-xvalues-help/`](https://blog.knatten.org/2018/03/09/lvalues-rvalues-glvalues-prvalues-xvalues-help/)\n\
  \n### 谜题 11 | 死亡时刻何时？\n\n[whats-the-time-of-death.cpp](http://media.pragprog.com/titles/akbrain/code/whats-the-time-of-death.cpp)\n\
  \n```cpp\n#include <iostream>\n\nstruct MemoryArea {\n    MemoryArea(int number)\
  \ : number_(number) {}\n    ~MemoryArea() { std::cout << \"Freed memory area \"\
  \ << number_ << \"\\n\"; }\n\n    int number_;\n};\n\nMemoryArea getMemory(int number)\
  \ {\n    return MemoryArea{number};\n}\n\nstruct DataSource {\n    DataSource(const\
  \ MemoryArea &memoryArea)\n    : memoryArea_(memoryArea) {}\n    const MemoryArea\
  \ &memoryArea_;\n};\n\nint main() {\n    const auto &reference1 = getMemory(1);\n\
  \    std::cout << \"Bound reference 1\\n\";\n    const auto &reference2 = getMemory(2).number_;\n\
  \    std::cout << \"Bound reference 2\\n\";\n    const auto &reference3 = DataSource(getMemory(3));\n\
  \    std::cout << \"Bound reference 3\\n\";\n}\n```\n\n**猜猜输出**\n\n| | --- |\n|\
  \ ![images/aside-icons/important.png](img/important.png) | 在移动到下一页之前，尝试猜猜输出是什么。\
  \ |\n\n程序显示以下输出：\n\n| Bound reference 1 |\n| Bound reference 2 |\n| Freed memory\
  \ area 3 |\n| Bound reference 3 |\n| Freed memory area 2 |\n| Freed memory area\
  \ 1 |\n\n### 讨论\n\n正如我们现在看到的几次的那样，函数调用是一个 prvalue，在那个 prvalue 被用来初始化一个对象之前，该对象并不存在。在上一个谜题中，我们也看到了这个规则的例外：当我们不使用\
  \ prvalue 来初始化对象时，我们称其为弃值表达式，并获知了此时会实例化一个临时对象。\n\n在这个谜题中，函数调用表达式的结果没有像谜题 9 [计数拷贝]\
  \ 那样赋值给对象，但也没有像谜题 10 [奇怪的赋值] 那样被丢弃。相反，我们以各种方式将引用绑定到它们。那时会发生什么？\n\n*   对于第一次调用，我们将引用\
  \ `reference1` 直接绑定到 prvalue。正如我们在谜题 10 中简要提到过的样，会实例化一个临时对象。\n*   对于第二次调用，我们访问了类\
  \ prvalue 上的成员 `number_`。这是另一个需要实例化临时对象的情况。否则，就没有对象供我们访问其成员。\n*   对于第三次调用，我们将 prvalue\
  \ 传递给 `DataSource` 构造函数。这实际上与第一次调用的情况相同；构造函数参数 `memoryArea` 绑定到 prvalue，并实例化一个临时对象。\n\
  \n所以，对于 `getMemory` 的三次调用，每次都实例化了一个临时对象。但它们能存多久呢？\n\n通常，临时对象会在创建它们的完整表达式结束时被销毁。在谜题案例中，这意味着它们将在行尾被销毁。然而，在某些情况下，临时对象的生命周期会被延长。这某种程度上是过去的遗迹，已经不再非常好用。例如，对于\
  \ `const auto &reference1 = getMemory(1);`，我们不如直接写 `const auto object1 = getMemory(1);`。得益于\
  \ C++17 对 prvalue 的新规则，仍然不会额外的拷贝，而且我们不需要问这些问题了。问题越意味着代码越好！\n\n那么生命周期延长规则究竟是什么？尽管存在其他规则，但到目前为止最常见且这里相关的规则是这些：\n\
  \n*   如果你将引用绑定到通过临时实例化获取的对象，那么该临时对象的生命周期与引用的生命周期相同。\n*   如果你将引用绑定到通过临时实例化获取的对象的成员，那么整个临时对象（而不只是成员）的生命周期与引用的生命周期相同。\n\
  \n让我们检查每一行：\n\n```cpp\nconst auto &reference1 = getMemory(1);\n```\n\n我们将 `reference1`\
  \ 绑定到从 `getMemory(1)` 得到的临时对象。临时对象 1 在 `reference1` 的寿命内持续——即到 `main` 结束。\n\n```cpp\n\
  std::cout << \"Bound reference 1\\n\";\n```\n\n打印 Bound reference 1。\n\n```cpp\n\
  const auto &reference2 = getMemory(2).number_;\n```\n\n我们将 `reference2` 绑定到从 `getMemory(2)`\
  \ 得到的临时对象的成员 `number_` 上。整个临时对象 2（而不只是成员）在 `reference2` 的寿命内持续——即到 `main` 结束。\n\n\
  ```cpp\nstd::cout << \"Bound reference 2\\n\";\n```\n\n打印 Bound reference 2。\n\n\
  ```cpp\nconst auto &reference3 = DataSource(getMemory(3));\n```\n\n我们将构造函数参数 `memoryArea`\
  \ 绑定到从 `getMemory(3)` 得到的临时对象。这用于创建一个新的 `DataSource` 类型对象。然后我们将 `reference3` 绑定到在调用构造函数时实例化的临时\
  \ `DataSource`。临时对象 `DataSource` 在 `reference3` 的寿命内持续——即到 `main` 结束。\n\n但等等，这是一个陷阱！一旦\
  \ `DataSource` 对象构造完成，`memoryArea` 参数就消失了。将其赋值给 `memoryArea_` 成员并没有帮助；那是另一个引用！所以，临时对象\
  \ `MemoryArea` 3 的生命周期没有被延长，它在行尾就被释放了。打印了 Freed memory area 3，而 `DataSource` 原计划读取的\
  \ `MemoryArea` 已经释放，现在变成了一个悬空引用。\n```cpp\nstd::cout << \"Bound reference 3\\n\"\
  ;\n```\n\n打印 Bound reference 3。\n\n\n\n啊，}，这是 C++ 最强大的特性！在作用域结束时，局部变量按照它们构造的反顺序被销毁。首先，`reference3`\
  \ 被销毁，这意味着临时对象 `DataSource` 被销毁（它的析构函数没有打印任何内容）。接着，`reference2` 被销毁，这意味着临时对象 `2`\
  \ 被销毁，并打印了 `Destroyed 2`。最后，`reference1` 被销毁，这意味着临时对象 `1` 被销毁，并打印了 `Destroyed 1`。\n\
  \n| 相关问题 |\n| --- |\n| ![images/aside-icons/warning.png](img/warning.png) | 在 C++\
  \ 中与临时对象 3 类似的问题并不罕见。这里有一个著名的例子，它直到 C++23 才被修复。（在编写本文时，常见的编译器尚未实现此修复。）[examples/range-for/range-for.cpp](http://media.pragprog.com/titles/akbrain/code/examples/range-for/range-for.cpp)\
