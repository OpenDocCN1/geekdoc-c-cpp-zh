  \n### 谜题 21 | 字符大小\n\nLvalues, Rvalues, Glvalues, Prvalues, Xvalues, 求救!\n\n[`blog.knatten.org/2018/03/09/lvalues-rvalues-glvalues-prvalues-xvalues-help/`](https://blog.knatten.org/2018/03/09/lvalues-rvalues-glvalues-prvalues-xvalues-help/)\n\
  \n没有移动构造函数与被删除移动构造函数之间的区别\n\n[`blog.knatten.org/2021/10/15/the-difference-between-no-move-constructor-and-a-deleted-move-constructor/`](https://blog.knatten.org/2021/10/15/the-difference-between-no-move-constructor-and-a-deleted-move-constructor/)\n\
  \n谜题 21 | 字符大小\n\n[sizing-up-characters.cpp](http://media.pragprog.com/titles/akbrain/sizing-up-characters.cpp)\n\
  \n```cpp\n#include <iostream>\n\nvoid serialize(char characters[]) {\n    std::cout\
  \ << sizeof(characters) << \"\\n\";\n}\n\nint main() {\n    char characters[] =\
  \ {'a', 'b', 'c'};\n    std::cout << sizeof(characters) << \"\\n\";\n    std::cout\
  \ << sizeof(characters) / sizeof(characters[0]) << \"\\n\";\n    serialize(characters);\n\
  }\n```\n\n### 猜输出\n\n![images/aside-icons/important.png](img/important.png) 在进入下一页之前，尝试猜猜输出是什么。\n\
  \n![images/hline.png](img/hline.png)\n\n程序具有实现定义的行为！但在 64 位 CPU 上可能会输出：\n\n```\n\
  3\n3\n```\n\n![images/hline.png](img/hline.png)\n\n### 讨论\n\n程序定义了一个字符数组 `char characters[]\
  \ = {'a', 'b', 'c'}`。我们然后用各种方式打印这个数组的大小。`sizeof` 运算符在每情况下做了什么？哪些是标准定义的，哪些是实现定义的？它们在你的电脑上输出什么？\n\
  \n首先，程序定义了一个数组 `char characters[] = {'a', 'b', 'c'}`。我们然后用 `sizeof` 运算符打印这个数组的大小。`sizeof`\
  \ 运算符产生操作数所占用的字节数，在这种情况下是 3，因为每个 `char` 是一个字节。\n\n但等等，在谜题 14，亚里士多德的部分之和 中，我们学过基本类型的大小并不是标准定义的，那么我们如何能确定答案是\
  \ 3 呢？毕竟，`char` 可能是 16 位的。事实证明，`sizeof(char)` 被定义始终返回 1。\n\n接下来，我们打印 `sizeof(characters)\
  \ / sizeof(characters[0])`。这是 C 或 C++ 中用于计算数组元素个数的老旧惯用法，在这个谜题中保证输出 3。这是因为 `sizeof(characters)`\
  \ 返回 3（正如我们看到的），而 `sizeof(characters[0])` 等于 `sizeof(char)`，后者始终返回 1。\n\n最后，我们想要序列化我们的字符，所以将它们传递给\
  \ `void serialize(char characters[])`。序列化函数为了序列化的目的想要知道数组有多大，就像我们在 `main` 中做的那样，执行了\
  \ `sizeof(characters)`。但为什么这输出的是 8（特别是在我的电脑上）而不是 3 呢？这是因为 `char characters[]` 参数的类型实际上不是“char\
  \ 数组”，而是“指向 char 的指针”！标准规定如下：\n\n> 在确定每个参数的类型后，任何类型为“T 数组”或函数类型 T 的参数都会调整为“指向 T\
  \ 的指针”。\n\n\n\n\n\n因此，`serialize` 函数中的 `sizeof(characters)` 打印的是指针的大小，而不是数组的大小，因为在此时\
  \ `characters` 的类型实际上是“指向 char 的指针”。这是该谜题中由实现决定的的部分，因为标准并没有定义指针的大小。在大多数现代计算机上，指针是\
  \ 64 位的，等于 8 字节，因此在你的计算机上，你可能看到打印出 8。\n\n现在，我们是否也可以在这里使用似乎更强大的 `std::size` 函数模板，来获取数组中实际的元素数量呢？我们不能这样做，因为\
  \ `characters` 是一个指针而不是数组。`std::size` 只对具有 `.size()` 成员函数的集合（collections）和视图（views）以及数组进行了定义。`std::size(characters)`\
  \ 会导致编译失败，而不是给出错误的结果，这很不错。\n\n| 建议 |\n| --- |\n| ![images/aside-icons/tip.png](img/tip.png)\
  \ |  \n\n*   C++ 中的数组是非常局限的，当你将它们传递给函数时，尺寸等信息就会丢失。请优先使用 `std::vector` 或 `std::array`\
  \ 等类型。\n*   在你的项目中开启警告。GCC 和 Clang 都会对 `serialize` 中使用 `sizeof(characters)` 发出警告。GCC\
  \ 的信息如下：`warning: sizeof on array function parameter will return size of ’char *’\
  \ instead of ’char[]'.`。（在编写时，我没能让 MSVC 对此给出警告。）\n\n### 进阶阅读\n\n`sizeof` 运算符\n[`en.cppreference.com/w/cpp/language/sizeof`](https://en.cppreference.com/w/cpp/language/sizeof)\n\
  \n`std::size` 函数模板\n[`en.cppreference.com/w/cpp/header/std#size`](https://en.cppreference.com/w/cpp/header/std#size)\n\
  \n### 谜题 2：虚幻类（The Phantom）\n\n[`media.pragprog.com/titles/akbrain/code/the-phantom.cpp`](https://media.pragprog.com/titles/akbrain/code/the-phantom.cpp)\n\
  \n```cpp\n#include <iostream>\n#include <string>\n\nstruct GameObject {\n    GameObject()\
  \ {\n        std::cout << \"Created a GameObject\\n\";\n    }\n    virtual void\
  \ render() {\n        std::cout << \"Rendered a \" << getType() << \"\\n\";\n  \
  \  }\n    virtual std::string getType() const {\n        return \"GameObject\";\n\
  \    }\n};\n\nclass Spaceship : public GameObject {\npublic:\n    Spaceship() {}\n\
  \    std::string getType() const override {\n        return \"Spaceship\";\n   \
  \ }\n};\n\nvoid display(const GameObject &obj) {\n    obj.render();\n}\n\nint main()\
  \ {\n    GameObject gameObject;\n    Spaceship spaceship;\n    display(gameObject);\n\
  \    display(spaceship);\n}\n```\n\n| 预测输出 |\n| --- |\n| ![images/aside-icons/tip.png](img/tip.png)\
  \ 程序的输出如下：\n\n```\nCreated a GameObject\nRendered a GameObject\nCreated a Spaceship\n\
  Rendered a Spaceship\n```\n\n### 讨论\n\n在这个谜题中，假设我们使用了虚函数来处理派生类。如果我们不使用虚函数，`sizeof`\
  \ 将返回数组的大小，但当我们将其传递给函数时，尺寸信息就会丢失。这就是为什么我们需要使用虚函数。\n\n但是，如果我们使用 `std::size` 呢？`std::size`\
  \ 只能用于数组或具有 `size()` 成员的容器。对于指针 `characters`，`std::size(characters)` 会导致编译错误，这比得到错误的结果要好。\n\
  \n如果我们使用的是模板方法模式（Template Method Pattern），我们可以通过纯虚函数让派生类来定义基类行为。在在这种情况下，`GameObject`\
  \ 是一个抽象类，无法实例化实例化。派生类来实现 `\n()`。\n\n\n\n然而，如果我们仍然想要实例化“原始”的 `GameObjects`，我们需要重新添加一个默认构造函数：\n\
  \n[examples/spaceship/spaceship-parameter.cpp](http://media.pragprog.com/titles/akbrain/code/examples/spaceship/spaceship-parameter.cpp)\n\
  \n```cpp\npublic:\n    GameObject() : GameObject(\"GameObject\")(){}\n```\n\n但是这引入了一个新问题：如果你忘记为\
  \ `Spaceship` 添加用户定义的构造函数，那么默认的 `Spaceship` 构造函数将简单地使用 `GameObject` 的默认构造函数，我们又回到了在创建\
  \ `SpaceShip` 时看到 `GameObject` 被创建的局面——这是不允许 `GameObjects` 被独立构造的另一个原因。\n\n最后，当问题是在如何在不使用动态多态的情况下在基类中使用派生类的信息时，如果不至少提到奇异递归模板模式（CRTP）惯用法，讨论是不完整的。虽然我们这里没有空间进行详细讨论，但其思想是将基类设为模板，然后将派生类作为其自身基类的模板参数。现在，基类只需通过查看其模板参数，就能在静态地知道正在实例化哪个派生类！这里有一个完整的示例：\n\
  \n[examples/spaceship/spaceship-crtp.cpp](http://media.pragprog.com/titles/akbrain/code/examples/spaceship/spaceship-crtp.cpp)\n\
  \n```cpp\n#include <iostream>\n\nstruct GameObject {\n    virtual void render()\
  \ const = 0;\n};\n\ntemplate<typename Derived>\nstruct LoggingGameObject : public\
  \ GameObject {\n    LoggingGameObject() {\n        std::cout << \"Created a \" <<\
  \ Derived::typeName << \"\\n\";\n    }\n    void render() const override {\n   \
  \     std::cout << \"Rendered a \" << Derived::typeName << \"\\n\";\n    }\n};\n\
  \nstruct Spaceship : public LoggingGameObject<Spaceship> {\n    static constexpr\
  \ auto typeName = \"Spaceship\";\n};\n\nvoid display(const GameObject &gameObject)\
  \ { gameObject.render(); }\n\nint main() {\n    Spaceship spaceship;\n    display(spaceship);\n\
  }\n```\n\n关于 CRTP 的更详细讨论，请参阅维基百科^15\n\n### 建议\n\n![images/aside-icons/tip.png](img/tip.png)\n\
  \n*   启用警告。例如，像 `GCC` 和 `Clang` 这样的编译器会对构造函数和析构函数中的纯虚函数调用警告。\n*   在 CI 中使用多个编译器和平台。不同的编译器和链接器会给出不同的警告和错误。\n\
  \n### 扩展阅读\n\n模板方法设计模式\n[`en.wikipedia.org/wiki/Template_method_pattern`](https://en.wikipedia.org/wiki/Template_method_pattern)\n\
