  \n程序的行为是未定义的！但它将显示两种输出之一。这是其中一种可能的输出：\n\n```\nInitializing logger\nReading configuration\n\
  Starting program\n```\n\n而这是另一个：\n\n```\nReading configuration\nInitializing logger\n\
  Starting program\n```\n\n### 讨论\n\n在这个谜题中，我们想要启动一个依赖于日志器已设置且配置已读取的程序。只要这两者都在程序启动之前完成，我们就没问题。日志器设置和配置读取的顺序在这里似乎并不重要，但如果很重要呢？例如，如果初始化日志器设置了某个全局日志器实例，我们在读取配置时会使用它。我们可以依赖这两个函数按照程序中列出的顺序被调用吗？遗憾的是，我们不能，因为函数参数表达式的求值顺序是未指定的。这不仅仅是理论上的；当我在\
  \ Linux 上测试此代码时，`GCC` 从右到左，而 `Clang` 从左到右。你可以在 Compiler Explorer 上查看在线演示^16\n\n\
  然而，一切并非混乱；我们确实有一些保证：\n\n1.  参数的初始化（包括所有相关的副作用）保证在函数执行之前已完成。这保证了 `initializeLogger`\
  \ 和 `readConfiguration` 在 `startProgram` 开始执行之前已经执行完毕，我们不会面临输出 `Initializing logger`\
  \ 与 `Starting program` 织的风险。这听起来显而易见，但嘿，这是 `C++`，所以检查一下很好。\n2.  一个参数的初始化（包括所有相关的副作用）保证在另一个参数的初始化开始已完成。这保证了要么\
  \ `initializeLogger` 完全在 `readConfiguration` 之前发生，反反之。\n3.  这里没有未定义行为；只是参数表达式可以以任何顺序进行求值。\n\
  \n我们知道 `initializeLogger` 和 `readConfiguration` 都在 `startProgram` 之前发生，只是不知道具体的顺序。此外，我们甚至不能保证在每次运行程序时它们发生的顺序都是相同的，即使使用相同的编译器和同一台电脑！编译器不太可能生成这种非确定性的代码，但根据标准，这是可以接受的。如果实现者决定（例如，从右到左比从左到右更高效），编译器也可能在新版本中更改排序。\n\
  \n那么我们能对此做什么呢？如果顺序实际上很重要，你只需要按照你想要的顺序一个接一个调用函数即可：\n\n[examples/deterministic-order/deterministic-order.cpp](http://media.pragprog.com/titles/akbrain/code/examples/deterministic-order/deterministic-order.cpp)\n\
  \n```cpp\nint main()\n{\n    const auto logger = initializeLogger();\n    const\
  \ auto configuration = readConfiguration();\n    startProgram(logger, configuration);\n\
  }\n```\n\n### 建议\n\n*   不要依赖函数参数表达式的求值顺序。\n\n\n\n\n\n- 不要仅仅因为表达式在测试中恰好按照特定顺序执行，就假设它们总是以此顺序执行。\n\
  \n### 延伸阅读\n\n求顺序\n[`en.cppreference.com/w/cpp/language/eval_order`](https://en.cppreference.com/w/cpp/language/eval_order)\n\
  \n## 谜题 24 | 特殊字符串理论\n\n[a-specialized-string-theory.cpp](http://media.pragprog.com/titles/akbrain/code/a-specialized-string-theory.cpp)\n\
  \n```cpp\n#include <iostream>\ntemplate<typename T>\nvoid serialize(T&) { std::cout\
  \ << \"template\\n\"; } // 1\n\ntemplate<>\nvoid serialize<>(const std::string&)\
  \ { std::cout << \"specialization\\n\"; } // 2\n\nvoid serialize(const std::string&)\
  \ { std::cout << \"normal function\\n\"; } // 3\n\nint main() {\n  std::string hello_world{\"\
  Hello, world!\"};\n  serialize(hello_world);\n  serialize(std::string{\"Good bye,\
  \ world!\"});\n}\n```\n\n### 猜输出\n在进入下一页之前，尝试猜猜输出是什么。\n\n程序显示以下输出：\n\n```\ntemplate\n\
  normal function\n```\n\n### 讨论\n\n你可能还记得我们在谜题 2、谜题 2、字符串理论 中的序列化库。在此期间，一位 C++ 专家出现了，并决定凡是有使用模板的地方都会变得更好。这是否真实是另一个话题了，但它确实让重载解析变得更有趣了！\n\
  \n我们在谜题中找到了三个 `serialize` 的定义。第一个（标记为“1”的）是 `serialize` 的主函数模板。下一个（标记为“2”的）是该模板针对\
  \ `std::string` 的显式特化。你可以通过空的 `template<>` 标签识别出它是一个特化版本。最后，我们看到了一个普通的非模板 `serialize`\
  \ 函数（标记为“3”）。\n\n由于 `serialize` 名字被重载了，当我们写出对该名称的调用时，重载解析需要确定调用哪一个。正如我们在谜题 2、谜题\
  \ 2、字符串理论 中学的那样，它通过创建一个该名称的所有候选函数的集合，然后从该集合中选择最佳的可行函数来实现。很清楚，普通的、非模板 `serialize`\
  \ 函数 (3) 是一个候选者，但函数模板又是怎样的呢？编译器又是如何在函数模板特化版本和普通函数（两者签名相同）之间消除歧义的？\n\n当函数模板参与重载解析时，编译器会查看该名称的所有主模板。在这一阶段，它不会考虑特化版本，因此只考虑主模板\
  \ (1)，而不考虑特化版本 (2)。如果我们有其他主模板重载，这些也会被考虑在内，但在本谜题中我们只有一个。另一个主模板的例子可以是针对指针的这个：\n\n\
  ```cpp\ntemplate<typename T>\nvoid serialize(T*) { std::cout << \"pointer\\n\";\
  \ }\n```\n\n你可以通过非空的 `template<typename T>` 识别出这是一个主模板，就像我们在谜题的主模板中看到的那样。\n\n由于主模板\
  \ (1) 是本谜题中唯一的主模板，我们现在已经找到了应该作为重载解析候选者的 `serialize` 函数模板。但为了能够继续，重载解析需要一个具有实际类型的具体函数签名，而不仅仅是一个接受任意类型\
  \ `T` 的模板。因此，接下来它会对 `serialize` 进行类型推导，以查看潜在的实例化是什么样的。这被称为“合成声明”。这个合成声明被添加到候选函数集合中（与非模板\
  \ `serialize` 一起），然后进行常规重载解析。让我们看看类型推导和重载解析对于对 `serialize` 的两次调用具体是如何工作的。\n\n首先，看我们传递对象的那个调用：\n\
  \n```cpp\nserialize(hello_world);\n```\n\n表达式 `hello_world` 是类型为 `std::string` 的左值。正如我们在谜题\
  \ 13、谜题 13、持久的斗争 中学的那样，`T` 被推导出为 `std::string`，合成的签名签名 `void serialize(std::string&)`。我们现在有两个重载解析的候选者：\n\
  \n```cpp\nvoid serialize(std::string&); // 从模板 (1) 合成\nvoid serialize(const std::string&);\
  \ // 非模板函数 (3)\n```\n\n由于 `hello_world` 是非 const 的，重载解析倾向于 `serialize` 的模板版本，因为它接受非\
  \ const 引用。\n\n现在重载解析已经决定使用函数模板，是时候寻找要使用的特化版本了。应该是实例化并使用主函数模板 (1)，还是使用显式特化 (2)？在这种情况下，这是一个简单的选择，因为我们需要签名为\
  \ `void serialize(std::string&)` 的特化，但我们的显式特化签名是 `void serialize(const std::string&)`。我们必须使用主函数模板，并为\
  \ `T = std::string` 进行隐含实例化，产生 `void serialize(std::string&)`。当调用此实例化时，会打印 `template`。\n\
  \n接下来，让我们传递临时字符串的调用：\n\n```cpp\nserialize(std::string{\"Good bye, world!\"});\n\
  ```\n\n表达式 `std::string{\"Good bye, world!\"}` 是类型为 `std::string` 的右值（prvalue），因此\
  \ `T` 推导出 `std::string`，与上一个调用一样。我们再次拥有这两个重载解析的候选者：\n\n```cpp\nvoid serialize(std::string&);\
  \ // 从模板 (1) 合成\nvoid serialize(const std::string&); // 非模板函数 (3)\n```\n\n由于 `std::string{\"\
  Good bye, world!\"}` 是一个右值，函数模板中的非 const 引用无法绑定它。普通函数中的 const 引用可以，该函数被重载解析选中。由于没有选中模板，不会发生实例化，并打印\
  \ `normal function`。\n\n附加问题：如果函数模板也接受 const 引用，像这样会怎样？\n\n[examples/template-vs-function/template-vs-function.cpp](http://media.pragprog.com/titles/akbrain/code/examples/template-vs-function/template-vs-function.cpp)\n\
  \n```cpp\ntemplate<typename T>\nvoid serialize(const T&) { std::cout << \"template\\\
  n\"; } // 1\n```\n\n现在，合成的签名将是 `void serialize(const std::string&)`，与非模板完全相同，重载解析需要在这些之间进行选择：\n\
  \n```cpp\nvoid serialize(const std::string&); // 从模板 (1) 合成\nvoid serialize(const\
  \ std::string&); // 非模板函数 (3)\n```\n\n如果重载解析发现两个同样优秀的可行候选者，通常会得到编译错误。那么这能编译吗？\n\n\
  这实际上是没问题的。在涉及模板的重载解析中，有一个特殊规定：如果函数 `F1` 不是函数模板特化版本而 `F2` 是函数模板特化版本，则 `F1` 比 `F2`\
  \ 更好。非模板函数被两次调用选中，程序输出以下内容：\n\n```\nnormal function\nnormal function\n```\n\n\n\n\
  \n\n请注意，在上述两种情况下，显式函数模板特化都没有参与重载解析——它从来没有参与过。这可能不符合直觉，因此通常情况下，使用非模板重载比使用显式特化更好。请参阅“延伸阅读”下的前两个链接获取更多细节，以及一些此类混淆的更糟糕的示例。\n\
  \n| 建议 |\n| --- |\n| ![images/aside-icons/tip.png](img/tip.png) |\n*   优先使用非模板重载，而不是显式特化。\
