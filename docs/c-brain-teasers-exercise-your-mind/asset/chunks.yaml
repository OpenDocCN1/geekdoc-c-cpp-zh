    `size_type` 到 `int` 的提升没有问题，因为 `size_type` 可以放入 `int` 中。符号加法存在溢出的风险，并可能导致未定义行为，如果结果无法放入
    `int` 的话（但根据本谜题的输入，这种情况不会发生）。`int` 到 `size_type` 的转换在结果为负时可能会发生回绕（在本题中发生了这种情况），或者如果数值过大（在本题中未发生）。


    ### 如果 size_type 无法放入 int 但可以放入 unsigned int


    如果 `int` 无法表示 `size_type` 的所有值，但 `unsigned int` 可以，则 `acc` 将被提升为 `unsigned int`。这种情况只可能发生在
    `size_type` 的宽度与 `int` 和 `unsigned int` 相同的情况下。如果 `size_type` 较小，它可以放入 `int`；如果它更宽，则无法放入
    `unsigned int`。


    在 `acc` 从 `size_type` 提升为 `unsigned int` 之后，操作数的类型仍然不同，因此继续进行常规算术转换。由于 `size_type`
    和 `int` 宽度相同，它们的秩（rank）也相同，`int` 被转换为 `unsigned int`（详参见[常规算术转换^([[14]](#f_0036.xhtml_FOOTNOTE-14))]
    ）。加法以 `unsigned int` 类型进行。


    首先，我们将 -2 加到 `acc` 上。`-2` 被转换为 `unsigned int`，且由于它是负数，它会回绕到 `std::numeric_limits<unsigned
    int>::max() - 1`。当它与值为 `2` 的 `acc` 相加时，它会再次回绕到 `0`。


