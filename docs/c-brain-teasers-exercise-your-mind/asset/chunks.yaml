    ### Discussion


    This puzzle looks similar to Puzzle 3, Puzzle 3, [​*Hack the Planet!*​](#f_0014.xhtml_chp.puzzle03);
    they both use the value of an uninitialized variable id. Unlike Puzzle 3, however,
    this is not undefined behavior, and the program prints 0. Why is that?


    The difference is that the id’s in Puzzle 3 are local variables, which pop in
    and out of existence each time the functions are called. They’re said to have
    automatic storage duration. The id in this puzzle, on the other hand, is a global
    variable. More precisely, id is a non-local variable with static storage duration;
    that is, the lifetime of id is the entire duration of the program.


    Unlike variables with automatic storage duration, variables with static storage
    duration are initialized as a consequence of program initiation. In the simple
    case of an int with no initializer, it’s zero-initialized. If id had an initializer,
    for example, int id = 2;, we would instead say that it was constant-initialized
    to 2. (The collective term for zero-initialization and constant-initialization
    is static initialization.)


    Why are variables with static storage duration and no initializer initialized
    to zero, when variables with automatic storage duration are not? In the general
    case, initializing a variable isn’t free. Some code needs to exist to do said
    initialization. If, for instance, you define a local variable int id = 0; in a
    function, most systems need to emit a bit of code to set it to zero every time
    that function is called. C++ cannot guarantee that this is free or of negligible
    cost, and a design goal of C++ is to not pay for what you don’t use. C++ doesn’t
    want to leave room for a more performant language to exist. So if you decide to
    omit the initializer and just define int id;, C++ won’t make you pay that price.


    Another difference between local and non-local variables is their scope. A local
    variable can only be accessed in the block in which it’s defined. A non-local
    variable, on the other hand, can be accessed from anywhere in the file, or, if
    declared in a header file, from anywhere in the entire program where that header
    can be included. So if you omit the initializer for a local variable, you have
    perfect control over where it will be used next. You probably left it uninitialized
    because you’ll initialize it in the following line or two anyway. But if you omit
    the initializer for a non-local variable, it’s a lot harder to reason about who
    will access it next.


    Compare non-local variables with static storage duration to local variables with
    automatic storage duration:


    |  | Cost of Initialization | Scope |


    | --- | --- | --- |


    | Non-local static | Once | The whole file/program |


    | Local automatic | Every time the block is entered | The block in which it’s
    defined |


    It’s harder to control usages of non-local variables with static storage duration,
    and initializing them is cheap, so C++ will do it automatically for you.


    How cheap is it, though? Let’s look at the x86 architecture for an example. I
    said previously that you pay the price of initialization once, but in fact you
    don’t pay it at all! When your program starts, it needs to allocate memory for
    things like the stack, the heap, the program code, and, importantly for us, global
    data. On systems like Linux and Windows, when we get fresh physical memory from
    the operating system, it’s filled with zeroes to prevent you from reading the
    memory of whichever program previously used the same memory page. The compiler/linker
    can group all uninitialized global variables in one section called .bss. When
    the program starts, and memory is allocated for the .bss section, it’s already
    filled with zeroes. So these variables are zero-initialized at zero cost!


    | Note |


    | --- |


    | ![images/aside-icons/tip.png](images/aside-icons/tip.png) | The word static
    has many uses in C++. Whether or not id has a static specifier doesn’t affect
    its static storage duration. Writing static int id; instead of just int id; for
    a global variable only gives it internal linkage; that is, it cannot be linked
    to from other translation units (other cpp files). It has static storage duration
    regardless. |


