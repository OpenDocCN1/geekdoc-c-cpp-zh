    我在上面省略了许多细节，特别是导致这些特定转换序列的精确规则，尽管如此，解释仍然变得很长。如果你读到了最后，太棒了，你抓住了要点。如果你在某处断开了，没担心，你还是抓住了要点！要点在于，整数之间隐式转换的推理是非常复杂的，在生产代码中最好避免。


    ### 我们能做什么？


    遗憾的是，没有任何主要的编译器会对此发出警告，即使对 GCC 和 Clang 使用 `-Wall` `-Wextra` 以及对 MSVC 使用 `/Wall`。某些编译器（如
    GCC 和 Clang）具有额外的选项，如 `-Wsign-conversion`，它们没有包含在 `-Wall` 或 `-Wextra` 中，必须单独启用。遗憾的是，即使启用了它们，你对这个特定的谜题也不会得到任何警告。（如果
