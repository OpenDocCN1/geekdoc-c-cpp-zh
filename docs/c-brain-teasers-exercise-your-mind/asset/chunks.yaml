  trans: "\n\n```cpp\nstd::cout << std::is_const_v<T>; // true if T is const\n}\n\n\
    template <typename T>\nvoid byReference(T &t) {\n    std::cout << std::is_const_v<T>;\
    \ // true if T is const\n}\n\nint main() {\n    int nonConstInt = 0;\n    const\
    \ int constInt = 0;\n\n    byValue(nonConstInt);\n    byValue(constInt);\n\n \
    \   byReference(nonConstInt);\n    byReference(constInt);\n}\n```\n\n### 猜输出\n\
    \n![images/aside-icons/important.png](img/important.png) 在移动到下一页之前，尝试猜输出是什么。\n\
    \n![images/hline.png](img/hline.png)\n\n程序显示输出输出：\n\n| 0001 |\n\n![images/hline.png](img/hline.png)\n\
    \n### 讨论\n\n这两个函数模板 `byValue` 和 `byReference` 分别通过值传递和引用传递接收参数。然后，我们使用非 const\
    \ `int` 和 `const int` 作为参数调用这两个函数模板。在哪些情况下，`T` 被推导为 `const`？\n\n在我们开始深入研究推导规则之前，让我们澄清两个容易混淆的概念。`template\
    \ <typename T>` 中的 `T` 被称为**模板参数**（template parameter）。模板参数推导的目标是找到 `T`。另一方面，函数签名\
    \ `byValue(T t)` 和 `byReference(T &t)` 中的 `T` 和 `T &` 被称为**模板参数类型**（template parameter\
    \ types）。这些是函数模板的实际参数类型，也是我们用于推导的对象。\n\n我们将这些模板参数类型称为 `P`，以区别于模板参数 `T`。这里是三个示例：\n\
    \n| 模板参数 | 模板参数类型 P |\n| --- | --- | --- |\n| template <typename T> | | |\n| void\
    \ byValue(T t) | T | T |\n| template <typename T> | | |\n| void byReference(T\
    \ & t) | T | T & |\n| template <typename ValueType> | | |\n| void f(const std::vector<ValueType>&\
    \ v) | ValueType | const std::vector<ValueType>& |\n\n如你所见，在 `byValue` 和 `byReference`\
    \ 中，模板参数都是 `T`。在 `byValue` 中，模板参数类型 `P` 只是 `T`，但在 `byReference` 中，它是 `T &`。\n\n\
    处理完这些后，让我们深入研究推导规则。首先，看 `byValue` 的调用：\n\n```cpp\ntemplate <typename T> void byValue(T\
    \ t);\n\nint nonConstInt = 0;\nconst int constInt = 0;\n\nbyValue(nonConstInt);\n\
    byValue(constInt);\n```\n\n记住，模板参数是 `T`，而模板参数类型 `P` 也仅仅是 `T`（与之相对，例如 `T &`）。\n\
    \n在推导模板参数类型 `P` 时，如果它不是引用类型，推导规则规定忽略参数 `argument` 的任何顶层 cv 限定符（`const` 或 `volatile`）。由于\
    \ `P` 只是 `T`，它不是引用类型，因此 cv 限定符被忽略了。\n\n等等，无论我们传递的是非 const 还是 const 参数，我们都假装它是非\
    \ const 的！这看起来有点猫吗吗？不是。当 `P` 不是引用类型时，意味着我们通过值传递参数。原始参数是否为 `const` 无关，`byValue`\
    \ 内部的参数 `t` 是拷贝，我们无法修改原始参数。\n\n由于顶层 cv 限定符被忽略了，我们在 `byValue` 的两次调用中都从非 const `int`\
    \ 推导出 `P`，并在两种情况下都发现 `P == int`。由于 `P == T`，`T` 也是非 const 的。两次调用都打印了 0。\n\n接下来，看\
    \ `byReference` 的调用：\n\n```cpp\ntemplate <typename T> void byReference(T &t);\n\
    \nint nonConstInt = 0;\nconst int constInt = 0;\n\nbyReference(nonConstInt);\n\
    byReference(constInt);\n```\n\n模板参数是 `T`，模板参数类型 `P` 是 `T &`。\n\n这一次，`P` 是一个引用，我们不忽略参数的顶层\
    \ cv 限定符。在这种情况下，这一点非常重要！引用参数 `t` 将绑定到我们的原始参数，因此确保不要尝试（例如）将非 const 引用绑定到 const\
    \ 参数是非常重要的。\n\n当传递非 const `nonConstInt` 时，`P` 被推导为 `int &`，这意味着 `T` 是 `int`。它不是\
    \ `const`，所以打印 0。\n\n当传递 const `constInt` 时，`P` 被推导为 `const int &`，这意味着 `T` 是\
    \ `const int`。它是 const，所以打印 1。\n\n模板参数推导的完整规则读起来可能有点困难，但至少关于忽略顶层 cv 限定符的这足够直观，我能够记住它。\n\
    \n### Auto\n\n![images/aside-icons/tip.png](img/tip.png) `auto` 的推导规则基于模板参数推导规则。既然你知道了这些模板参数推导规则，也就知道了相应的\
    \ `auto` 推导规则！\n\n```cpp\nauto t1 = nonConstInt; // 非 const 对象\nauto t2 = constInt;\
    \ // 非 const 对象\nauto &t3 = nonConstInt; // 非 const 对象的引用\nauto &t4 = constInt;\
    \ // const 对象的引用\n```\n\n### 扩展阅读\n\n模板参数推导\n\n[`en.cppreference.com/w/cpp/language/template_argument_deduction`](https://en.cppreference.com/w/cpp/language/template_argument_deduction)\n\
    \n从函数调用中推导模板参数\n\n[`timsong-cpp.github.io/cppwp/std20/temp.deduct.call`](https://timsong-cpp.github.io/cppwp/std20/temp.deduct.call)\n\
    \n### 谜题 14 | 亚里士德的部分之和\n\n```cpp\n#include <iostream>\n#include <type_traits>\n\
    \nint main() {\n    char char1 = 1;\n    char char2 = 2;\n    // 如果 char1 + char2\
    \ 的类型为 char 则为真\n    std::cout << std::is_same_v<decltype(char1 + char2), char>;\n\
    }\n```\n"
- fmt: "\nLet’s see what the usual arithmetic conversions do to our expression `char1\
    \ + char2`. Since both operands are of integer types, a process known as integral\
    \ promotions is performed on both of them. The idea is to convert smaller integer\
    \ types to `int` or `unsigned int` before performing the arithmetic expression.\
    \ After converting both operands, we can now add them using regular `int` or `unsigned\
    \ int` addition and get an `int` or `unsigned int` as a result.\n\nThe rule for\
    \ promoting a smaller integer type is that it can be converted to an `int` if\
    \ `int` can represent all the values of the smaller type; otherwise, it can be\
    \ converted to an `unsigned int`. Does a `char` fit in an `int`? Usually it does,\
    \ but that depends on the implementation. (I told you this is a sad story.)\n\n\
    A complicating factor here is that the sizes of fundamental types in C++ are not\
    \ fixed. An implementation can decide that `int` is 16 bits or 64 bits, and even\
    \ that `char` and `long` are of the same size. The only rules are these:\n\n*\
    \ Each of `signed char`, `short`, `int`, `long`, and `long long` is at least as\
    \ large as the preceding type in the list.\n* For each of the types in that list,\
    \ an unsigned version exists, which has the same size as the signed version.\n\
    \nSome minimum sizes are also defined:\n\n| Type | Minimum width |\n| --- | ---\
    \ |\n| signed char | 8 |\n| short | 16 |\n| int | 16 |\n| long | 32 |\n| long\
    \ long | 64 |\n\nOn a typical 64-bit Linux, Windows, or macOS system, `int` is\
    \ 32 bits, whereas `long` is 64 bits on Linux/macOS and 32 bits on Windows. But\
    \ a conforming implementation could equally well decide that all integer types\
    \ are 64 bits.\n\nIn this puzzle, we’re interested in `char` in particular, but\
    \ `char` is curiously missing from all the lists above. What’s going on? `char`\
    \ is a bit special in that the implementation can choose whether to back it by\
    \ `signed char` or `unsigned char`. In either case, `char` is a distinct type.\
    \ So `char`, `signed char`, and `unsigned char` are actually three different types,\
    \ and whether or not a plain `char` is signed is implementation-defined!\n\nRemember,\
    \ we’re interested in whether all the values in `char` fit in an `int` to figure\
    \ out whether our chars would be converted to `int` or `unsigned int`. Normally\
    \ they all fit, so both operands of `char1 + char2` would be converted to `int`,\
    \ and the result would also be an `int`.\n\nBut let’s say that the implementation\
    \ has chosen `char` and `int` to both be 16 bits. Let’s also say that the implementation\
    \ has chosen that `char` is unsigned. The range of `int` is then `-2^(16-1)` to\
    \ `2^(16-1)-1`, or `-32768` to `32767`, inclusive. The range of `char` is `0`\
    \ to `2^(16)-1`, or `0` to `65535`, inclusive. That is, half the chars don’t fit\
    \ in an `int`! On these systems, the operands of `char1 + char2` would instead\
    \ be promoted to `unsigned int` and the result would also be an `unsigned int`.\n\
    \nSo the type of `char1 + char2` can either be `int` or `unsigned int`. All we\
    \ know for sure is that it’s not `char`.\n\n### Further Reading\n\n* The Usual\
    \ Arithmetic Confusions: [https://shafik.github.io/c++/2021/12/30/usual_arithmetic_confusions.html](https://shafik.github.io/c++/2021/12/30/usual_arithmetic_confusions.html)\n\
    * 64-Bit Data Models: [https://en.wikipedia.org/wiki/64-bit_computing#64-bit_data_models](https://en.wikipedia.org/wiki/64-bit_computing#64-bit_data_models)\n\
    * Fundamental Types: [https://timsong-cpp.github.io/cppwp/std20/basic.fundamental](https://timsong-cpp.github.io/cppwp/std20/basic.fundamental)\n\
    * Usual Arithmetic Conversions: [https://timsong-cpp.github.io/cppwp/std20/expr.arith.conv](https://timsong-cpp.github.io/cppwp/std20/expr.arith.conv)\n\
    * Integral Promotions: [https://timsong-cpp.github.io/cppwp/std20/conv.prom](https://timsong-cpp.github.io/cppwp/std20/conv.prom)\n\
    \n### Puzzle 15 | Back from the Future\n\n[back-from-the-future.cpp](http://media.pragprog.com/titles/akbrain/code/back-from-the-future.cpp)\n\
    \n```cpp\n#include <future>\n#include <iostream>\n\nint main() {\n    char counter\
    \ = 0;\n    auto future1 = std::async(std::launch::async, [&]() {\n        counter++;\n\
    \    });\n    auto future2 = std::async(std::launch::async, [&]() {\n        return\
    \ counter;\n    });\n\n    future1.wait();\n    // Cast to int to print it as\
    \ a numerical value rather than a character\n    std::cout << (int)future2.get();\n\
    }\n```\n\nTry to guess what the output is before moving to the next page.\n\n\
    The program has undefined behavior! Importantly, the answer is not “either 0 or\
    \ 1.”\n\n### Discussion\n\nWhen two unsynchronized threads access the same memory\
    \ location and at least one of these accesses is a modification, we have a data\
    \ race. This program launches two threads, one that modifies `counter` and one\
    \ that reads it. Since we have made no effort to synchronize the two threads,\
    \ the program has a data race.\n\nIf you run this program on your machine, you’re\
    \ very likely to see either 0 or 1, depending on which thread gets to `counter`\
    \ first. The `counter` is a single byte, so you’re not likely to see, for example,\
    \ any half-written values. Either the `counter++` operation happens entirely before\
    \ the second thread reads `counter` or it happens entirely after. But that doesn’t\
    \ mean you can rely on this for some sort of “eventually consistent” logic! A\
    \ data race results in undefined behavior, so anything can happen. Remember what\
    \ we talked about in the preface—demons could come flying out of your nose. Don’t\
    \ try to reason about or test what happens under undefined behavior. Your program\
    \ might seem to work, but break on another system when the compiler is upgraded,\
    \ or every one-millionth time it runs.\n\nFor these threads to safely access `counter`,\
    \ some sort of synchronization is needed. The classical solution is to protect\
    \ `counter` with a `mutex`, but this is cumbersome and also introduces locks.\
    \ Locks can be slow, and where there are locks, there can be deadlocks. A better\
    \ approach is to use an atomic, like so:\n\n[examples/std_atomic/std_atomic.cpp](http://media.pragprog.com/titles/akbrain/code/examples/std_atomic/std_atomic.cpp)\n\
    \n```cpp\nstd::atomic<char> counter = 0;\nauto future1 = std::async(std::launch::async,\
    \ [&]() {\n    counter++;\n});\nauto future2 = std::async(std::launch::async,\
    \ [&]() {\n    return counter.load();\n});\n```\n\nUsing `std::atomic` instead\
    \ of a `mutex` makes the code simpler, avoids introducing an extra variable for\
    \ the `mutex`, ensures we can’t forget to lock the `mutex`, and probably makes\
    \ the code lock-free.\n\n### Lock-Free Atomics\n\nWhether or not `std::atomic<char>`\
    \ is lock-free is implementation-defined, but it typically is. You can check this\
    \ on your system with the `is_lock_free` / `is_always_lock_free` members of the\
    \ `std::atomic` class template:[examples/std_atomic/std_atomic.cpp](http://media.pragprog.com/titles/akbrain/code/examples/std_atomic/std_atomic.cpp)\n\
    \n```cpp\nstatic_assert(counter.is_always_lock_free());\nassert(counter.is_lock_free());\n\
    ```\n\n* `is_always_lock_free` is true if `std::atomic<T>` for the given `T` is\
    \ always lock-free. This is a static constexpr member, which can be checked at\
    \ compile time.\n* `is_lock_free()` is true if a particular instance of `std::atomic<T>`\
    \ is lock-free and can be true even if `is_always_lock_free` is not. Some atomics\
    \ could, for instance, be lock-free only if they’re aligned. This can only be\
    \ checked at runtime.\n\nBoth on my M1 Macbook and my x86_64 Linux machine, `std::atomic`\
    \ of `int`, `long`, and `double` are all always lock-free.\n"
  raw: "Let’s see what the usual arithmetic conversions do to our expression char1\
    \ + char2. Since both operands are of integer types, a process known as integral\
    \ promotions is performed on both of them. The idea is to convert smaller integer\
    \ types to int or unsigned int before performing the arithmetic expression. After\
    \ converting both operands, we can now add them using regular int or unsigned\
    \ int addition and get an int or unsigned int as a result.\n\nThe rule for promoting\
    \ a smaller integer type is that it can be converted to an int if int can represent\
    \ all the values of the smaller type; otherwise, it can be converted to an unsigned\
    \ int. Does a char fit in an int? Usually it does, but that depends on the implementation.\
    \ (I told you this is a sad story.)\n\nA complicating factor here is that the\
    \ sizes of fundamental types in C++ are not fixed. An implementation can decide\
    \ that int is 16 bits or 64 bits, and even that char and long are of the same\
    \ size. The only rules are these:\n\n*   Each of signed char, short, int, long,\
    \ and long long is at least as large as the preceding type in the list.\n\n* \
    \  For each of the types in that list, an unsigned version exists, which has the\
    \ same size as the signed version.\n\nSome minimum sizes are also defined:\n\n\
    | Type | Minimum width |\n\n| --- | --- |\n\n| signed char | 8 |\n\n| short |\
    \ 16 |\n\n| int | 16 |\n\n| long | 32 |\n\n| long long | 64 |\n\nOn a typical\
    \ 64-bit Linux, Windows, or macOS system, int is 32 bits, whereas long is 64 bits\
    \ on Linux/macOS and 32 bits on Windows. But a conforming implementation could\
    \ equally well decide that all integer types are 64 bits.\n\nIn this puzzle, we’re\
    \ interested in char in particular, but char is curiously missing from all the\
    \ lists above. What’s going on? char is a bit special in that the implementation\
    \ can choose whether to back it by signed char or unsigned char. In either case,\
    \ char is a distinct type. So char, signed char, and unsigned char are actually\
    \ three different types, and whether or not a plain char is signed is implementation-defined!\n\
    \nRemember, we’re interested in whether all the values in char fit in an int to\
    \ figure out whether our chars would be converted to int or unsigned int. Normally\
    \ they all fit, so both operands of char1 + char2 would be converted to int, and\
    \ the result would also be an int.\n\nBut let’s say that the implementation has\
    \ chosen char and int to both be 16 bits. Let’s also say that the implementation\
    \ has chosen that char is unsigned. The range of int is then -2^(16-1) to 2^(16-1)-1,\
    \ or -32768 to 32767, inclusive. The range of char is 0 to 2^(16)-1, or 0 to 65535,\
    \ inclusive. That is, half the chars don’t fit in an int! On these systems, the\
    \ operands of char1 + char2 would instead be promoted to unsigned int and the\
    \ result would also be an unsigned int.\n\nSo the type of char1 + char2 can either\
    \ be int or unsigned int. All we know for sure is that it’s not char.\n\n### Further\
    \ Reading\n\nThe Usual Arithmetic Confusions\n\n[https://shafik.github.io/c++/2021/12/30/usual_arithmetic_confusions.html](https://shafik.github.io/c++/2021/12/30/usual_arithmetic_confusions.html)\n\
    \n64-Bit Data Models\n\n[https://en.wikipedia.org/wiki/64-bit_computing#64-bit_data_models](https://en.wikipedia.org/wiki/64-bit_computing#64-bit_data_models)\n\
    \nFundamental Types\n\n[https://timsong-cpp.github.io/cppwp/std20/basic.fundamental](https://timsong-cpp.github.io/cppwp/std20/basic.fundamental)\n\
    \nUsual Arithmetic Conversions\n\n[https://timsong-cpp.github.io/cppwp/std20/expr.arith.conv](https://timsong-cpp.github.io/cppwp/std20/expr.arith.conv)\n\
    \nIntegral Promotions\n\n[https://timsong-cpp.github.io/cppwp/std20/conv.prom](https://timsong-cpp.github.io/cppwp/std20/conv.prom)\n\
