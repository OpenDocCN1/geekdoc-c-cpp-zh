    ![](http://pragmaticprogrammer.com/titles/d-pandas)


    这本书包含 25 个短程序将挑战你对 `Pandas` 的理解。像任何大型项目一样，`Pandas` 开发者不得不做出一些有时令人惊讶的设计决策。这本书利用这些特殊性作为教学机会。通过理解知识中的空白，你将更好地完成你的工作。一些谜题来自作者将
    Bug 送到生产环境的经验，另一些来自他人的类似经历。谜题和挑战很有趣，学习如何解决它们可以教你避免编程错误，甚至可能给你的同事和未来的雇主留下印象。


    Miki Tebeka


    (110 页) ISBN: 9781680509014 $18.95


    ### 数学脑筋急转


    ![](http://pragmaticprogrammer.com/titles/esbrain)


    用数学挑战你的大脑！仅需基础算术和逻辑，当你看到答案对位时，你将非常兴奋。无论是纯粹为了好玩还是测试你的知识，你将磨练解决问题的能力并锻炼你的大脑。你只需要逻辑思维、一点耐心和清醒的头脑。这里没有陷阱。这些谜题是对你可能刚刚学习或遗忘已久的数学概念的完美介绍或复习。准备好享受比以前任何时候都更多的数字乐趣。


    Erica Sadun


    (186 页) ISBN: 9781680509748 $18.95


    ### Go 脑筋急转


    ![](http://pragmaticprogrammer.com/titles/d-gobrain)


    这本书包含 25 个短程序将挑战你对 `Go` 的理解。像任何大型项目一样，`Go` 开发者不得不做出一些有时令人惊讶的设计决策。这本书利用这些特殊性作为教学机会。通过理解知识中的空白，你将更好地完成你的工作。一些谜题来自作者将
    Bug 送到生产环境的经验，另一些来自他人的类似经历。谜题和挑战很有趣，学习如何解决它们可以教你避免编程错误，甚至可能给你的同事和未来的雇主留下印象。


    Miki Tebeka


    (110 页) ISBN: 9781680508994 $18.95


    ### Python 脑筋急转


    ![](http://pragmaticprogrammer.com/titles/d-pybrain)


    我们极客喜欢谜题并解决它们。`Python` 编程语言是一种简单的语言，但与其他所有语言一样，它也有特殊之处。这本书通过 30 个挑战你对 `Python`
    理解的简单程序，利用这些特性提供教学机会。谜题将帮助你避免错误，看到知识中的空白，并更好地完成工作。用这些谜题给同事留下印象，或者仅仅在那些无聊的会议中度过时间。谜题很有趣！


    Miki Tebeka


    (116 页) ISBN: 9781680509007 $18.95


    ### Python 中的复杂网络分析


    ![](http://pragmaticprogrammer.com/titles/dzcnapy)


    使用 Python 模块 `networkx` 构建、分析和可视化网络。网络分析是一个强大的工具，你可以将其应用于许多数据集和场景。发现如何处理各种网络，包括社交网络、产品、时间性和语义网络。将几乎任何现实世界数据转换为复杂网络——例如化妆品推荐、对冲基金关系和在线友谊。分析并可视化网络，根据你的分析做出业务决策。如果你是一个好奇的
    `Python` 程序员、数据科学家或负责机械化任务的 `CNA` 专家，你将指数级地提高生产力。


    Dmitry Zinoviev


    (260 页) ISBN: 9781680502695 $35.95


    ### 测试驱动开发的现代 C++ 编程


    ![](http://pragmaticprogrammer.com/titles/lotdd)


    如果你用 `C++` 编程，那么你被忽视了。测试驱动开发 (TDD) 是一种现代软件开发实践，可以大幅减少系统的缺陷数量，产生更具维护性的代码，并让你有信心更改软件以满足不断的需求。但推广
    TDD 的人忽略了 `C++` 程序员；直到现在。在本书中，Jeff Langr 为你提供了关于在 `C++` 中进行 TDD 的挑战和回报的实战课程。


    Jeff Langr


    (366 页) ISBN: 9781937785482 $40


    ### 嵌入式 C 的测试驱动开发


    ![](http://pragmaticprogrammer.com/titles/jgade)


    仍在追逐 Bug 并看着你的代码退化吗？认为 TDD 只适用于桌面或 Web 应用吗？不是的：TDD 适用于你，嵌入式 `C` 程序员。TDD 帮助你防止缺陷并构建具有长寿命的软件。这是第一本为
    `C` 程序员教授 TDD 的“怎么做”和“为什么”。


    James W. Grenning


    (354 页) ISBN: 9781934356623 $34.95


