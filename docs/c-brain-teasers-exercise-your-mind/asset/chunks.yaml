    \n### Discussion\n\nThis puzzle looks similar to Puzzle 3, Puzzle 3, [Hack the\
    \ Planet!](#f_0014.xhtml_chp.puzzle03); they both use the value of an uninitialized\
    \ variable `id`. Unlike Puzzle 3, however, this is not undefined behavior, and\
    \ the program prints 0. Why is that?\n\nThe difference is that the `id`’s in Puzzle\
    \ 3 are local variables, which pop in and out of existence each time the functions\
    \ are called. They’re said to have automatic storage duration. The `id` in this\
    \ puzzle, on the other hand, is a global variable. More precisely, `id` is a non-local\
    \ variable with static storage duration; that is, the lifetime of `id` is the\
    \ entire duration of the program.\n\nUnlike variables with automatic storage duration,\
    \ variables with static storage duration are initialized as a consequence of program\
    \ initiation. In the simple case of an `int` with no initializer, it’s zero-initialized.\
    \ If `id` had an initializer, for example `int id = 2;`, we would instead say\
    \ that it was constant-initialized to 2. (The collective term for zero-initialization\
    \ and constant-initialization is static initialization.)\n\nWhy are variables\
    \ with static storage duration and no initializer initialized to zero, when variables\
    \ with automatic storage duration are not? In the general case, initializing a\
    \ variable isn’t free. Some code needs to exist to do said initialization. If,\
    \ for instance, you define a local variable `int id = 0;` in a function, most\
    \ systems need to emit a bit of code to set it to zero every time that function\
    \ is called. C++ cannot guarantee that this is free or of negligible cost, and\
    \ a design goal of C++ is to not pay for what you don’t use. So if you decide\
    \ to omit the initializer and just define `int id;`, C++ won’t make you pay that\
    \ price.\n\nAnother difference between local and non-local variables is their\
    \ scope. A local variable can only be accessed in the block in which it’s defined.\
    \ A non-local variable, on the other hand, can be accessed from anywhere in the\
    \ file, or, if declared in a header file, from anywhere in the entire program\
    \ where that header can be included. So if you omit the initializer for a local\
    \ variable, you have perfect control over where it will be used next. You probably\
    \ left it uninitialized because you’ll initialize it in the following line or\
    \ two anyway. But if you omit the initializer for a non-local variable, it’s a\
    \ lot harder to reason about who will access it next.\n\nCompare non-local variables\
    \ with static storage duration to local variables with automatic storage duration:\n\
    \n| | Cost of Initialization | Scope |\n| --- | --- | --- |\n| Non-local static\
    \ | Once | The whole file/program |\n| Local automatic | Every time the block\
    \ is entered | The block in which it’s defined |\n\nIt’s harder to control usages\
    \ of non-local variables with static storage duration, and initializing them is\
    \ cheap, so C++ will do it automatically for you.\n\nHow cheap is it, though?\
    \ Let’s look at the x86 architecture for an example. I said previously that you\
    \ pay the price of initialization once, but in fact you don’t pay it at all! When\
    \ your program starts, it needs to allocate memory for things like the stack,\
    \ the heap, the program code, and, importantly for us, global data. On systems\
    \ like Linux and Windows, when we get fresh physical memory from the operating\
    \ system, it’s filled with zeroes to prevent you from reading the memory of whichever\
    \ program previously used the same memory page. The compiler/linker can group\
    \ all uninitialized global variables in one section called `.bss`. When the program\
    \ starts, and memory is allocated for the `.bss` section, it’s already filled\
    \ with zeroes. So these variables are zero-initialized at zero cost!\n\n>! Note\n\
    > ![images/aside-icons/tip.png](images/aside-icons/tip.png) The word static has\
    \ many uses in C++. Whether or not `id` has a static specifier doesn’t affect\
    \ its static storage duration. Writing `static int id;` instead of just `int id;`\
    \ for a global variable only gives it internal linkage; that is, it cannot be\
    \ linked to from other translation units (other cpp files). It has static storage\
    \ duration regardless.\n\n### Further Reading\n\nZero-Initialization\n[https://en.cppreference.com/w/cpp/language/zero_initialization](https://en.cppreference.com/w/cpp/language/zero_initialization)\n\
    \nMore About Initialization of Global Variables: From Program to Process\n[https://www.youtube.com/watch?v=fGnbGX88z3Y](https://www.youtube.com/watch?v=fGnbGX88z3Y)\n\
    \n## Puzzle 5 A Destructive Relationship\n\n[a-destructive-relationship.cpp](http://media.pragprog.com/titles/akbrain/code/a-destructive-relationship.cpp)\n\
    \n```cpp\n#include <iostream>\n#include <memory>\n\nstruct Widget\n{\n  virtual\
    \ void draw() { std::cout << \"Widget draw\\n\"; }\n  virtual ~Widget() { std::cout\
    \ << \"Widget destructor\\n\"; }\n};\n\nstruct Button : public Widget\n{\n  void\
    \ draw() override { std::cout << \"Button draw\\n\"; }\n  ~Button() override {\
    \ std::cout << \"Button destructor\\n\"; }\n};\n\nint main()\n{\n  std::unique_ptr<Widget>\
    \ widget = std::make_unique<Button>();\n  widget->draw();\n}\n```\n\n## Guess\
    \ the Output\n\n![images/aside-icons/important.png](images/aside-icons/important.png)\
    \ Try to guess what the output is before moving to the next page.\n\n![images/hline.png](images/hline.png)\n\
    \nThe program displays the following output:\n\nButton draw\nButton destructor\n\
    Widget destructor\n\n![images/hline.png](images/hline.png)\n\n### Discussion\n\
    \nWhen we call `draw`, the program only prints `Button draw`. But when the `unique_ptr`\
    \ goes out of scope and the destructor is called, the program prints both `Button\
    \ destructor` and `Widget destructor`. Why is that?\n\nA common technique for\
    \ dynamic polymorphism is using virtual functions. You declare a class with one\
    \ or more functions marked as `virtual`, allowing other classes to override those\
    \ functions. When you then call a virtual function on a base class pointer pointing\
    \ to an object of a derived class, the object’s dynamic type is used, and the\
    \ overridden function is called instead.\n\nIn this example, imagine a UI framework\
    \ with a `Widget` class with some common behavior and concrete UI elements like\
    \ `Button`, `Text`, and `Image`, which override the drawing behavior in the virtual\
    \ `draw` function.\n\nWhen we call `draw` on the base class pointer to `Widget`,\
    \ which is actually pointing to a derived class `Button`, `Button::draw` is called\
    \ instead of `Widget::draw`, and `Button draw` is printed. However, for the destructor,\
    \ the behavior is different; we can see that it first prints `Button destructor`\
    \ and then also prints `Widget destructor`. What’s going on?\n\nWhen an object\
    \ is destroyed, all parts of it have to be destroyed. In this case, `Button` inherits\
    \ from `Widget`, so each `Button` object consists of a `Widget` object in addition\
    \ to any members from `Button` (none, in this case). We say that `Button` has\
    \ a `Widget` subobject. If `Button` had a member of type `Widget` instead of inheriting\
    \ from it, it would also have a `Widget` subobject. In either case, the subobjects\
    \ must also be destroyed when the complete object is destroyed to avoid resource\
    \ leaks. Luckily, C++ handles this for us; we don’t need to manually call the\
    \ `Widget` destructor from the `Button` destructor.\n\n"
