    ```cpp\n}\n```\n\n#### 猜输出\n\n![images/aside-icons/important.png](img/important.png)\
    \ 在进入下一页之前，尝试猜猜输出是什么。\n\n![images/hline.png](img/hline.png)\n\n程序显示如下输出：\n\n```\n\
    Monster copied\nJormungandr moved\n```\n\n![images/hline.png](img/hline.png)\n\
    \n### 讨论\n\n当我们用一个被移动的对象来初始化第二个 `Jormungandr` 时，调用的是 `Jormungandr` 的移动构造函数，而不是\
    \ `Monster` 的拷贝构造函数。这是为什么呢？\n\n正如我们在谜题 8 中学到的，谜题 8 它会移动吗？，当我们将一个表达式包裹在 `std::move`\
    \ 中时，它会变成一个右值（rvalue）。不过，这里有一个重要的细节：值类别（value categories）是针对表达式的，而不是对象的。因此，对象\
    \ `jormungandr1` 本身没有发生变化；只是表达式 `jormungandr1` 是左值（lvalue），而表达式 `std::move(jormungandr1)`\
    \ 是右值。如果你问我的话，如果把它们称为“l-表达式”和“r-表达式”而不是“左值”和“右值”，会更简单。\n\n当我们接着用表达式 `Jormungandr\
    \ jormungandr2{std::move(jormungandr1)}` 拷贝初始化 `jormungandr2` 时，重载解析偏向于使用 `Jormungandr`\
    \ 的移动构造函数而不是拷贝构造函数，因为表达式 `std::move(jormungandr1)` 是一个可以被移动的右值。是的，你读得没错，即使恰好调用了移动构造函数，这种形式始终被称为拷贝初始化（copy-initialization）。并没有所谓的移动初始化（move-initialization）。\n\
    \n现在让我们关注 `Jormungandr` 移动构造函数的实现。你可能已经发现了这个 bug：我们忘记像这样将 `other` 包裹在 `std::move`\
    \ 中：\n\n[examples/which-constructors/which-constructors.cpp](http://media.pragprog.com/titles/akbrain/code/examples/which-constructors/which-constructors.cpp)\n\
    \n```cpp\nJormungandr(Jormungandr &&other) : Monster(std::move(other))\n```\n\n\
    参数 `other` 是一个右值引用。但传递给 `Monster` 构造函数的表达式 `other` 却是一个左值！由于表达式 `other` 是左值，我们无法使用移动构造函数，重载解析便选择了拷贝构造函数。然而，在将其包裹在\
    \ `std::move` 之后，表达式 `std::move(other)` 现在是一个右值，于是选中了移动构造函数。\n\n输出将变为变为：\n\n```\n\
    Monster moved\nJormungandr moved\n```\n\n附加问题：如果 `Monster` 像这样定义，会发生什么？\n\n[examples/which-constructors/which-constructors.cpp](http://media.pragprog.com/titles/akbrain/code/examples/which-constructors/which-constructors.cpp)\n\
    \n```cpp\nstruct Monster {\n    Monster() = default;\n    Monster(const Monster\
    \ &other) {\n        std::cout << \"Monster copied\\n\";\n    }\n};\n```\n\n由于我们显式声明了拷贝构造函数，我们就不会隐式地获得默认或移动构造函数。我们显式声明了默认构造函数，但没有移动构造函数，所以\
    \ `Monster` 并没有移动构造函数。\n\n当 `Jormungandr` 的移动构造函数执行 `: Monster(std::move(other))`\
    \ 时，表达式 `std::move(other)` 仍然是一个右值。更具体地说，正如我们在谜题 9，统计拷贝次数 中看到的，当你将一个左值包裹在 `std::move()`\
    \ 中时，它会变成一种称为 x 值（xvalue）的右值。这意味着对象仍然具有像左值一样的身份（identity），但我们被允许像右值一样对其进行移动。如果\
    \ `Monster` 在这里有一个移动构造函数（带有 `Monster &&` 参数），那么在传递右值时，重载解析将优先选择它而不是拷贝构造函数（带有 `const\
    \ Monster &` 参数）。但由于它没有移动构造函数，且 const 左值引用可以绑定到右值，因此使用了拷贝构造函数。\n\n我们又回到了这个结果：\n\
    \n```\nMonster copied\nJormungandr moved\n```\n\n### 扩展阅读\n\nLvalues, Rvalues,\
    \ Glvalues, Prvalues, Xvalues, 求救!\n\n[`blog.knatten.org/2018/03/09/lvalues-rvalues-glvalues-prvalues-xvalues-help/`](https://blog.knatten.org/2018/03/09/lvalues-rvalues-glvalues-prvalues-xvalues-help/)\n\
    \n没有移动构造函数与被删除移动构造函数之间的区别\n\n[`blog.knatten.org/2021/10/15/the-difference-between-no-move-constructor-and-a-deleted-move-constructor/`](https://blog.knatten.org/2021/10/15/the-difference-between-no-move-constructor-and-a-deleted-move-constructor/)\n\
    \n### 谜题 21 | 字符大小\n\nLvalues, Rvalues, Glvalues, Prvalues, Xvalues, 求救!\n\n[`blog.knatten.org/2018/03/09/lvalues-rvalues-glvalues-prvalues-xvalues-help/`](https://blog.knatten.org/2018/03/09/lvalues-rvalues-glvalues-prvalues-xvalues-help/)\n\
    \n没有移动构造函数与被删除移动构造函数之间的区别\n\n[`blog.knatten.org/2021/10/15/the-difference-between-no-move-constructor-and-a-deleted-move-constructor/`](https://blog.knatten.org/2021/10/15/the-difference-between-no-move-constructor-and-a-deleted-move-constructor/)\n\
    \n谜题 21 | 字符大小\n\n[sizing-up-characters.cpp](http://media.pragprog.com/titles/akbrain/sizing-up-characters.cpp)\n\
    \n```cpp\n#include <iostream>\n\nvoid serialize(char characters[]) {\n    std::cout\
    \ << sizeof(characters) << \"\\n\";\n}\n\nint main() {\n    char characters[]\
    \ = {'a', 'b', 'c'};\n    std::cout << sizeof(characters) << \"\\n\";\n    std::cout\
    \ << sizeof(characters) / sizeof(characters[0]) << \"\\n\";\n    serialize(characters);\n\
    }\n```\n\n#### 猜输出\n\n![images/aside-icons/important.png](img/important.png) 在进入下一页之前，尝试猜猜输出是什么。\n\
    \n![images/hline.png](img/hline.png)\n\n程序具有实现定义的行为！但在 64 位 CPU 上可能会输出：\n\n```\n\
    3\n3\n```\n\n![images/hline.png](img/hline.png)\n\n#### 讨论\n\n程序定义了一个字符数组 `char\
    \ characters[] = {'a', 'b', 'c'}`。我们然后用各种方式打印这个数组的大小。`sizeof` 运算符在每情况下做了什么？哪些是标准定义的，哪些是实现定义的？它们在你的电脑上输出什么？\n\
    \n首先，程序定义了一个数组 `char characters[] = {'a', 'b', 'c'}`。我们然后用 `sizeof` 运算符打印这个数组的大小。`sizeof`\
    \ 运算符产生操作数所占用的字节数，在这种情况下是 3，因为每个 `char` 是一个字节。\n\n但等等，在谜题 14，亚里士多德的部分之和 中，我们学过基本类型的大小并不是标准定义的，那么我们如何能确定答案是\
    \ 3 呢？毕竟，`char` 可能是 16 位的。事实证明，`sizeof(char)` 被定义始终返回 1。\n\n接下来，我们打印 `sizeof(characters)\
    \ / sizeof(characters[0])`。这是 C 或 C++ 中用于计算数组元素个数的老旧惯用法，在这个谜题中保证输出 3。这是因为 `sizeof(characters)`\
    \ 返回 3（正如我们看到的），而 `sizeof(characters[0])` 等于 `sizeof(char)`，后者始终返回 1。\n\n最后，我们想要序列化我们的字符，所以将它们传递给\
    \ `void serialize(char characters[])`。序列化函数为了序列化的目的想要知道数组有多大，就像我们在 `main` 中做的那样，执行了\
    \ `sizeof(characters)`。但为什么这输出的是 8（特别是在我的电脑上）而不是 3 呢？这是因为 `char characters[]`\
    \ 参数的类型实际上不是“char 数组”，而是“指向 char 的指针”！标准规定如下：\n\n> 在确定每个参数的类型后，任何类型为“T 数组”或函数类型\
    \ T 的参数都会调整为“指向 T 的指针”。\n\n"
- fmt: "\nSo the `sizeof(characters)` in the `serialize` function prints the size\
    \ of a pointer rather than the size of an array since the type of `characters`\
    \ is actually “pointer to char” at this point. This is the implementation-defined\
    \ part of the puzzle since the standard doesn’t define the size of a pointer.\
    \ On most modern computers a pointer is 64 bits, which equals 8 bytes, so on your\
    \ computer you probably see 8 printed.\n\nNow, could we use the seemingly more\
    \ powerful `std::size` function template here, too, to get the actual number of\
    \ elements in the array? We can’t, since `characters` is a pointer and not an\
    \ array. `std::size` is only defined for collections and views with a `.size()`\
    \ member function, and for arrays. `std::size(characters)` would fail to compile\
    \ rather than giving the wrong result, which is nice.\n\n| Recommendations |\n\
    | --- |\n| ![images/aside-icons/tip.png](images/aside-icons/tip.png) |  \n\n*\
    \   Arrays in C++ are very limited, and when you pass them to functions, information\
    \ like size is lost. Prefer types like `std::vector` or `std::array` instead.\n\
    *   Enable warnings in your project. GCC and Clang will both warn about the use\
    \ of `sizeof(characters)` in `serialize`. Here’s GCC: `warning: sizeof on array\
    \ function parameter will return size of ’char *’ instead of ’char[]’.`. (At the\
    \ time of writing, I couldn’t get MSVC to give me a warning about this.)\n\n###\
    \ Further Reading\n\n`sizeof` Operator\n[https://en.cppreference.com/w/cpp/language/sizeof](https://en.cppreference.com/w/cpp/language/sizeof)\n\
    \n`std::size` Function Template\n[https://en.cppreference.com/w/cpp/iterator/size](https://en.cppreference.com/w/cpp/iterator/size)\n\
    \n### Puzzle 22: The Phantom Spaceship\n\n[the-phantom-spaceship.cpp](http://media.pragprog.com/titles/akbrain/code/the-phantom-spaceship.cpp)\n\
    \n```cpp\n#include <iostream>\n#include <string>\n\nstruct GameObject {\n    GameObject()\
    \ { std::cout << \"Created a \" << getType() << \"\\n\"; }\n    void render()\
    \ const { std::cout << \"Rendered a \" << getType() << \"\\n\"; }\n    virtual\
    \ std::string getType() const { return \"GameObject\"; }\n};\n\nclass Spaceship\
    \ : public GameObject {\n    std::string getType() const override { return \"\
    Spaceship\"; }\n};\n\nvoid display(const GameObject &gameObject) { gameObject.render();\
    \ }\n\nint main() {\n    GameObject gameObject;\n    Spaceship spaceship;\n  \
    \  display(gameObject);\n    display(spaceship);\n}\n```\n\n| Guess the Output\
    \ |\n| --- |\n| ![images/aside-icons/important.png](images/aside-icons/important.png)\
    \ Try to guess what the output is before moving to the next page. |\n\nThe program\
    \ displays the following output:\n\n```\nCreated a GameObject\nCreated a GameObject\n\
    Rendered a GameObject\nRendered a Spaceship\n```\n\n### Discussion\n\nIn this\
    \ puzzle, let’s say you’ve attempted to add logging to your game to keep track\
    \ of the creation and rendering of game objects. You’ve decided to use the Template\
    \ Method Design Pattern, which can be a great way to achieve runtime polymorphic\
    \ behavior in your design. In this pattern, a base class defines common behavior\
    \ in a concrete function, which internally calls virtual functions that can be\
    \ overridden in derived classes to fill in the details. For example, the preceding\
    \ `render` function is a template method that calls the virtual `getType` function\
    \ to fill in the details of the specific derived type.\n\nThis works perfectly\
    \ for the `render` function, but something goes wrong in the constructor; it prints\
    \ `Created a GameObject` both when creating a `GameObject` and when creating a\
    \ `Spaceship`. What exactly is going on, and could this be undefined behavior?\n\
    \nIn `main`, when initializing an object of type `Spaceship`, the `GameObject`\
    \ base class part of the object is initialized first, and then the `Spaceship`\
    \ part of the object is initialized. During initialization of the `GameObject`\
    \ part, there’s no `Spaceship` part yet. As far as C++ is concerned, this is simply\
    \ a `GameObject` being created.\n\nSo what happens when we call the virtual `getType()`\
    \ member function in the `Spaceship` constructor, which would normally call down\
    \ to a `Spaceship` which doesn’t even exist yet? Undefined behavior? Luckily,\
    \ this behavior is well defined. When a virtual function is called from a constructor\
    \ or destructor, the function called is the one in that particular class and not\
    \ one overriding it in a more-derived class. So in the `GameObject` constructor,\
    \ `GameObject::getType()` is called both when creating a `GameObject` and when\
    \ creating a `Spaceship`. `Created a GameObject` is displayed in both cases.\n\
    \nIn `render`, however, we’re dealing with fully initialized objects, and the\
    \ virtual function works as intended. When we render the `GameObject`, `Rendered\
    \ a GameObject` is printed, and when we render the `Spaceship`, `Rendered a Spaceship`\
    \ is printed.\n\nSo how do we fix this? Before we look into ways of making the\
    \ actual type being instantiated available to the `GameObject` constructor, it’s\
    \ worth asking whether it should even be possible to instantiate `GameObject`\
    \ objects on their own. Does it make sense in the game to be able to instantiate\
    \ an “abstract” game object? Or does it only make sense to instantiate concrete\
    \ things like, say, a spaceship, an asteroid, or an astronaut? If we make `GameObject::getType()`\
    \ a pure virtual function rather than giving it a definition, `GameObject` is\
    \ now an abstract class, which cannot be instantiated on its own:\n\n[examples/spaceship/spaceship-pure.cpp](http://media.pragprog.com/titles/akbrain/code/examples/spaceship/spaceship-pure.cpp)\n\
    \n```cpp\nvirtual std::string getType() const = 0;\n```\n\nHow does making `GameObject::getType()`\
    \ pure virtual affect this program though? If you tried it, you may already have\
    \ noticed that creating a `GameObject gameObject` no longer compiles. You can’t\
    \ instantiate objects of abstract classes, only of concrete derived classes like\
    \ `Spaceship`. Additionally, creating a `Spaceship spaceship` now results in undefined\
    \ behavior since the base class `GameObject` constructor calls a pure virtual\
    \ function. In practice, you can expect to see either compiler warnings for the\
    \ call to the pure virtual function, linker errors about a missing `GameObject::getType`\
    \ definition, or runtime errors like “Pure virtual function called.” But as always\
    \ with undefined behavior, this varies between platforms and compilers. Is going\
    \ from the wrong result to undefined behavior an improvement, though? In this\
    \ case I think so since, given a decent CI setup, you’re likely to discover the\
    \ problem and fix it.\n\nHow do we fix this properly, then? Since there’s no way\
    \ for the `GameObject` constructor to know which derived type is actually constructed,\
    \ we have to somehow provide it with that information. The easiest solution is\
    \ to pass the information directly to the constructor with a constructor parameter,\
    \ like so:\n\n[examples/spaceship/spaceship-parameter.cpp](http://media.pragprog.com/titles/akbrain/code/examples/spaceship/spaceship-parameter.cpp)\n\
    \n```cpp\nprotected:\n    GameObject(std::string_view type) {\n        std::cout\
    \ << \"Created a \" << type << \"\\n\";\n    }\n```\n\nThis new constructor is\
    \ protected since it’s only intended for being called from derived classes. We\
    \ do that in `Spaceship` like so:\n\n[examples/spaceship/spaceship-parameter.cpp](http://media.pragprog.com/titles/akbrain/code/examples/spaceship/spaceship-parameter.cpp)\n\
    \n```cpp\npublic:\n    Spaceship() : GameObject(\"Spaceship\"){}\n```\n\n(Note\
    \ that the “Spaceship” string is now duplicated between the constructor and the\
    \ `getType` function and should probably be extracted to a `static constexpr`\
    \ member of the `Spaceship` class.)\n"
