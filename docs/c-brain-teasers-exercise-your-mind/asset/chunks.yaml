  trans: "\n在这里我们讨论过，函数调用 `getResource()` 是一个 prvalue（纯值），它不会产生一个临时的 `Resource`。相反，返回值直接在\
    \ `resource1` 对象中被创建，并且不允许进行任何拷贝。\n\n这个谜题中的表达式 `getName()` 也是一个 prvalue，因此在我们将它赋值给某个东西之前，返回的对象甚至不存在，而我们并没有这样做！\n\
    \n如果不存在对象，我们又如何能将 `name` 拷贝赋值给它呢？临时对象实例化（Temporary materialization）来救场。函数调用之所以是\
    \ prvalue 且不创建对象的原因是为了避免不必要的拷贝。在之前的 `Resource` 示例中，实际对象的创建被推迟到我们将 `getResource()`\
    \ 的结果赋值给 `resource1` 的时候。但有时我们调用函数仅仅是为了它的副作用，而不将结果赋值给任何东西，就像我们在这个谜题中调用 `getName()`\
    \ 一样。当我们不对表达式的结果赋值给任何东西时，我们称之为弃值表达式（discarded-value expression）。我们仍然希望创建一个对象，因此会实例化一个临时对象。这就是这里发生的情况——prvalue\
    \ 表达式 `getName()` 创建了一个临时的 `std::string`。\n\n现在我们有了一个真正的 `std::string` 临时对象，我们可以很好地将\
    \ `name` 拷贝赋值给它了。\n\n### 将引用绑定到 prvalues\n\n| | --- |\n| ![images/aside-icons/note.png](img/note.png)\
    \ | 临时对象实例化重要的另一个情况是将引用绑定到 prvalue。想象一下，例如假设我们有一个像下面这样的函数：\n\n```cpp\nvoid useName(const\
    \ std::string& name_ref);\nvoid useName(std::string&& name_ref);\n```\n\n如果我们接着执行\
    \ `useName(getName());`，那么引用参数 `name_ref` 需要有实际的对象来绑定。而这确实就是将引用绑定到 prvalue 时发生的情况——会实例化一个临时对象。\
    \ |\n\n### 进阶阅读\n\nLvalues, Rvalues, Glvalues, Prvalues, Xvalues, 帮助！\n\n[`blog.knatten.org/2018/03/09/lvalues-rvalues-glvalues-prvalues-xvalues-help/`](https://blog.knatten.org/2018/03/09/lvalues-rvalues-glvalues-prvalues-xvalues-help/)\n\
    \n### 谜题 11 | 死亡时刻何时？\n\n[whats-the-time-of-death.cpp](http://media.pragprog.com/titles/akbrain/code/whats-the-time-of-death.cpp)\n\
    \n```cpp\n#include <iostream>\n\nstruct MemoryArea {\n    MemoryArea(int number)\
    \ : number_(number) {}\n    ~MemoryArea() { std::cout << \"Freed memory area \"\
    \ << number_ << \"\\n\"; }\n\n    int number_;\n};\n\nMemoryArea getMemory(int\
    \ number) {\n    return MemoryArea{number};\n}\n\nstruct DataSource {\n    DataSource(const\
    \ MemoryArea &memoryArea)\n    : memoryArea_(memoryArea) {}\n    const MemoryArea\
    \ &memoryArea_;\n};\n\nint main() {\n    const auto &reference1 = getMemory(1);\n\
    \    std::cout << \"Bound reference 1\\n\";\n    const auto &reference2 = getMemory(2).number_;\n\
    \    std::cout << \"Bound reference 2\\n\";\n    const auto &reference3 = DataSource(getMemory(3));\n\
    \    std::cout << \"Bound reference 3\\n\";\n}\n```\n\n**猜猜输出**\n\n| | --- |\n\
    | ![images/aside-icons/important.png](img/important.png) | 在移动到下一页之前，尝试猜猜输出是什么。\
    \ |\n\n程序显示以下输出：\n\n| Bound reference 1 |\n| Bound reference 2 |\n| Freed memory\
    \ area 3 |\n| Bound reference 3 |\n| Freed memory area 2 |\n| Freed memory area\
    \ 1 |\n\n### 讨论\n\n正如我们现在看到的几次的那样，函数调用是一个 prvalue，在那个 prvalue 被用来初始化一个对象之前，该对象并不存在。在上一个谜题中，我们也看到了这个规则的例外：当我们不使用\
    \ prvalue 来初始化对象时，我们称其为弃值表达式，并获知了此时会实例化一个临时对象。\n\n在这个谜题中，函数调用表达式的结果没有像谜题 9 [计数拷贝]\
    \ 那样赋值给对象，但也没有像谜题 10 [奇怪的赋值] 那样被丢弃。相反，我们以各种方式将引用绑定到它们。那时会发生什么？\n\n*   对于第一次调用，我们将引用\
    \ `reference1` 直接绑定到 prvalue。正如我们在谜题 10 中简要提到过的样，会实例化一个临时对象。\n*   对于第二次调用，我们访问了类\
    \ prvalue 上的成员 `number_`。这是另一个需要实例化临时对象的情况。否则，就没有对象供我们访问其成员。\n*   对于第三次调用，我们将\
    \ prvalue 传递给 `DataSource` 构造函数。这实际上与第一次调用的情况相同；构造函数参数 `memoryArea` 绑定到 prvalue，并实例化一个临时对象。\n\
    \n所以，对于 `getMemory` 的三次调用，每次都实例化了一个临时对象。但它们能存多久呢？\n\n通常，临时对象会在创建它们的完整表达式结束时被销毁。在谜题案例中，这意味着它们将在行尾被销毁。然而，在某些情况下，临时对象的生命周期会被延长。这某种程度上是过去的遗迹，已经不再非常好用。例如，对于\
    \ `const auto &reference1 = getMemory(1);`，我们不如直接写 `const auto object1 = getMemory(1);`。得益于\
    \ C++17 对 prvalue 的新规则，仍然不会额外的拷贝，而且我们不需要问这些问题了。问题越意味着代码越好！\n\n那么生命周期延长规则究竟是什么？尽管存在其他规则，但到目前为止最常见且这里相关的规则是这些：\n\
    \n*   如果你将引用绑定到通过临时实例化获取的对象，那么该临时对象的生命周期与引用的生命周期相同。\n*   如果你将引用绑定到通过临时实例化获取的对象的成员，那么整个临时对象（而不只是成员）的生命周期与引用的生命周期相同。\n\
    \n让我们检查每一行：\n\n```cpp\nconst auto &reference1 = getMemory(1);\n```\n\n我们将 `reference1`\
    \ 绑定到从 `getMemory(1)` 得到的临时对象。临时对象 1 在 `reference1` 的寿命内持续——即到 `main` 结束。\n\n\
    ```cpp\nstd::cout << \"Bound reference 1\\n\";\n```\n\n打印 Bound reference 1。\n\
    \n```cpp\nconst auto &reference2 = getMemory(2).number_;\n```\n\n我们将 `reference2`\
    \ 绑定到从 `getMemory(2)` 得到的临时对象的成员 `number_` 上。整个临时对象 2（而不只是成员）在 `reference2` 的寿命内持续——即到\
    \ `main` 结束。\n\n```cpp\nstd::cout << \"Bound reference 2\\n\";\n```\n\n打印 Bound\
    \ reference 2。\n\n```cpp\nconst auto &reference3 = DataSource(getMemory(3));\n\
    ```\n\n我们将构造函数参数 `memoryArea` 绑定到从 `getMemory(3)` 得到的临时对象。这用于创建一个新的 `DataSource`\
    \ 类型对象。然后我们将 `reference3` 绑定到在调用构造函数时实例化的临时 `DataSource`。临时对象 `DataSource` 在 `reference3`\
    \ 的寿命内持续——即到 `main` 结束。\n\n但等等，这是一个陷阱！一旦 `DataSource` 对象构造完成，`memoryArea` 参数就消失了。将其赋值给\
    \ `memoryArea_` 成员并没有帮助；那是另一个引用！所以，临时对象 `MemoryArea` 3 的生命周期没有被延长，它在行尾就被释放了。打印了\
    \ Freed memory area 3，而 `DataSource` 原计划读取的 `MemoryArea` 已经释放，现在变成了一个悬空引用。\n```cpp\n\
    std::cout << \"Bound reference 3\\n\";\n```\n\n打印 Bound reference 3。\n"
- fmt: "\nAhh, }, the best feature of C++! At the end of the scope, local variables\
    \ are destroyed in the reverse order of their construction. First, `reference3`\
    \ is destroyed, which means the temporary `DataSource` is destroyed (its destructor\
    \ doesn’t print anything). Next, `reference2` is destroyed, which means temporary\
    \ `2` is destroyed, and `Destroyed 2` is printed. Finally, `reference1` is destroyed,\
    \ which means temporary `1` is destroyed, and `Destroyed 1` is printed.\n\n| Related\
    \ Issues |\n| --- |\n| ![images/aside-icons/warning.png](images/aside-icons/warning.png)\
    \ | Similar issues as for temporary 3 are not uncommon in C++. Here’s a famous\
    \ example that didn’t get fixed until C++23. (At the time of writing, common compilers\
    \ have yet to implement this fix.) [examples/range-for/range-for.cpp](http://media.pragprog.com/titles/akbrain/code/examples/range-for/range-for.cpp)\
    \ |\n\n```cpp\nclass MemoryAreaContainer {\npublic:\n    MemoryAreaContainer();\n\
    \    std::vector<MemoryArea>& getMemoryAreas() {\n        return memoryAreas_;\n\
    \    }\nprivate:\n    std::vector<MemoryArea> memoryAreas_;\n};\n```\n\n```cpp\n\
    for (const auto &lp : MemoryAreaContainer{}.getMemoryAreas()) {\n    std::cout\
    \ << lp.number_ << std::endl;\n}\n```\n\nThis looks harmless. But for the temporary\
    \ `MemoryAreaContainer` to persist to the end of the for loop, we need to bind\
    \ a const reference to it. Our const reference here isn’t bound to the `MemoryAreaContainer`\
    \ but rather to the return value from `getMemoryAreas()`. So the `MemoryAreaContainer`\
    \ temporary gets destroyed before we even start iterating. The reference we got\
    \ from `getMemoryAreas()` refers to the already destroyed `memoryAreas_` member\
    \ and is dangling. (This is a bit of a simplification; please refer to `stmt.ranged`\
    \ to see the full code that the range-based for statement expands to.) |\n\n|\
    \ Recommendations |\n| --- |\n| ![images/aside-icons/tip.png](images/aside-icons/tip.png)\
    \ | |\n\n* Don’t rely on lifetime extensions, prefer `const auto obj = get()`\
    \ over `const auto& ref = get()`.\n* Don’t rely on a lifetime extension surviving\
    \ through function calls.\n* Keep up with new C++ standards, compilers, and tools.\
    \ Often, bugs get fixed in the compilers or even the language itself.\n* Use sanitizers.\
    \ Address sanitizer in particular can catch some uses of objects that have been\
    \ destroyed. |\n\n### Further Reading\n\nLifetime of a Temporary\n[https://en.cppreference.com/w/cpp/language/reference_initialization#Lifetime_of_a_temporary](https://en.cppreference.com/w/cpp/language/reference_initialization#Lifetime_of_a_temporary)\n\
