    # Early Praise for C++ Brain Teasers


    If you are either a C++ enthusiast or a professional C++ developer—hopefully both—this
    book is for you. Twenty-five puzzles explain in easy C++ the sometimes-surprising
    behavior of the language and what you might want to know to steer clear of potential
    pitfalls and disappointments.


    | → | Daniela Engert |


    |  | ISO C++ Committee Member and Keynote Speaker |


    The inexperienced programmer will learn, in a lighthearted way, of many pitfalls
    in the C++ programming language and how to avoid them. The seasoned veteran, who
    has developed an intuition for what to avoid, will learn in great detail how and
    why the language works the way it does.


    | → | Björn Fahller |


    |  | International C++ Conference Speaker |


    This is a fun and engaging puzzle book for everyone who wants to test their C++
    knowledge. The puzzles are fun to solve, and the explanations are easy to follow.


    | → | Tina Ulbrich |


    |  | International C++ Conference Speaker |


    # Foreword by Olve Maudal


    I first met Anders Schau Knatten at local C++ meetups here in Oslo way back. Since
    then, we have been friends hanging out when we meet at conferences. Anders has
    given presentations at C++ focused conferences such as ACCU, NDC TechTown, CppCon,
    C++ on Sea, and Meeting C++, to mention a few. When I attend one of his talks,
    I always learn something new. Anders can speak for hours about how integers really
    behave, or about all the stuff that happens before `main()` is invoked, or how
    to use debuggers effectively. He also has this fascinating ability to observe
    something, adapt it, reshape it, and then take it to the next level. This was
    exactly what he did after attending a couple of my infamous C++ Pub Quiz sessions.
    Anders soon went off to create the wonderful site `cppquiz.org`([[1]](#f_0004.xhtml_FOOTNOTE-1))
    (try it!). And now he is running his own much-improved version of C++ Pub Quiz
    sessions at conferences. With this book, Anders is taking his own concept even
    further.


    I love books, I love C++, and I love puzzles. C++ Brain Teasers brings all three
    together. I have been using and studying C++ for more than 30 years now, but I’m
    sure I will read this book again and again and still learn something new each
    time. If you are deeply invested in C++, you’ll want to read it too. The book
    serves as a fast-track into a deeper understanding of this extremely powerful
    and fascinating programming language. The book contains 25 carefully selected
    C++ puzzles that will challenge your current understanding of the language. Once
    you have attempted to solve a puzzle yourself, Anders will give you a deep and
    solid explanation as to why the puzzle is interesting and how you can learn to
    reason about these things.


    You can write beautiful programs in C++, but it is of course also possible to
    mess it up completely. It is important to understand that C++ is what it is because
    it evolved from BCPL, C, Simula 67, and Algol 68. C++ is what it is because the
    language was adopted fast and already had millions of active users during the
    early formation years. C++ is what it is because it trusts the programmer and
    focuses on solving real problems. Yes, C++ is complex, perhaps too complex, but
    it is indeed the go-to language (pun intended!) for many domains, such as operating
    systems, embedded systems, high-performance computing, performance-critical applications,
    video games, and space probes. Indeed, here is a very insightful quote by Bjarne
    Stroustrup (the creator of C++):


    > There are only two kinds of languages: the ones people complain about and the
    ones nobody uses.


    Wishing you all the best on your journey toward a deeper understanding of C++.
    Anders will be your guide this time. Enjoy the ride!


    Olve MaudalInternational C and C++ Speaker, Trainer, and Conference OrganizerJune,
    2024


