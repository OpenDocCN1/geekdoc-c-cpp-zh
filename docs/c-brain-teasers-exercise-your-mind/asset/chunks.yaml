    \n| ​  | ​**template**​<​**typename**​ T> |\n\n| ​  | ​**void**​ serialize(​**const**​\
    \ T&) { std::cout << ​*\"template*​​*\\n*​​*\"*​; } ​*// 1*​ |\n\nNow, the synthesized\
