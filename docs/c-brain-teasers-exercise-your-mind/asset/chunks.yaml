  trans: "\n然而，如果我们仍然想要实例化“原始”的 `GameObjects`，我们需要重新添加一个默认构造函数：\n\n[examples/spaceship/spaceship-parameter.cpp](http://media.pragprog.com/titles/akbrain/code/examples/spaceship/spaceship-parameter.cpp)\n\
    \n```cpp\npublic:\n    GameObject() : GameObject(\"GameObject\")(){}\n```\n\n\
    但是这引入了一个新问题：如果你忘记为 `Spaceship` 添加用户定义的构造函数，那么默认的 `Spaceship` 构造函数将简单地使用 `GameObject`\
    \ 的默认构造函数，我们又回到了在创建 `SpaceShip` 时看到 `GameObject` 被创建的局面——这是不允许 `GameObjects` 被独立构造的另一个原因。\n\
    \n最后，当问题是在如何在不使用动态多态的情况下在基类中使用派生类的信息时，如果不至少提到奇异递归模板模式（CRTP）惯用法，讨论是不完整的。虽然我们这里没有空间进行详细讨论，但其思想是将基类设为模板，然后将派生类作为其自身基类的模板参数。现在，基类只需通过查看其模板参数，就能在静态地知道正在实例化哪个派生类！这里有一个完整的示例：\n\
    \n[examples/spaceship/spaceship-crtp.cpp](http://media.pragprog.com/titles/akbrain/code/examples/spaceship/spaceship-crtp.cpp)\n\
    \n```cpp\n#include <iostream>\n\nstruct GameObject {\n    virtual void render()\
    \ const = 0;\n};\n\ntemplate<typename Derived>\nstruct LoggingGameObject : public\
    \ GameObject {\n    LoggingGameObject() {\n        std::cout << \"Created a \"\
    \ << Derived::typeName << \"\\n\";\n    }\n    void render() const override {\n\
    \        std::cout << \"Rendered a \" << Derived::typeName << \"\\n\";\n    }\n\
    };\n\nstruct Spaceship : public LoggingGameObject<Spaceship> {\n    static constexpr\
    \ auto typeName = \"Spaceship\";\n};\n\nvoid display(const GameObject &gameObject)\
    \ { gameObject.render(); }\n\nint main() {\n    Spaceship spaceship;\n    display(spaceship);\n\
    }\n```\n\n关于 CRTP 的更详细讨论，请参阅维基百科^15\n\n### 建议\n\n![images/aside-icons/tip.png](img/tip.png)\n\
    \n*   启用警告。例如，像 `GCC` 和 `Clang` 这样的编译器会对构造函数和析构函数中的纯虚函数调用警告。\n*   在 CI 中使用多个编译器和平台。不同的编译器和链接器会给出不同的警告和错误。\n\
    \n### 扩展阅读\n\n模板方法设计模式\n[`en.wikipedia.org/wiki/Template_method_pattern`](https://en.wikipedia.org/wiki/Template_method_pattern)\n\
    \n奇异递归模板模式 (CRTP)\n[`en.wikipedia.org/wiki/Curiously_recurring_template_pattern`](https://en.wikipedia.org/wiki/Curiously_recurring_template_pattern)\n\
    \n### 谜题 23 | 良好开始\n\n[off-to-a-good-start.cpp](http://media.pragprog.com/titles/akbrain/code/off-to-a-good-start.cpp)\n\
    \n```cpp\n#include <iostream>\n\nstruct Logger {};\nstruct Configuration {};\n\
    \nLogger initializeLogger()\n{\n    std::cout << \"Initializing logger\\n\";\n\
    \    return Logger{};\n}\n\nConfiguration readConfiguration()\n{\n    std::cout\
    \ << \"Reading configuration\\n\";\n    return Configuration{};\n}\n\nvoid startProgram(Logger\
    \ logger, Configuration configuration)\n{\n    std::cout << \"Starting program\\\
    n\";\n}\n\nint main()\n{\n    startProgram(initializeLogger(), readConfiguration());\n\
    }\n```\n\n### 猜输出\n\n![images/aside-icons/important.png](img/important.png) 在移动到下一页之前，尝试猜猜输出是什么。\n\
    \n程序的行为是未定义的！但它将显示两种输出之一。这是其中一种可能的输出：\n\n```\nInitializing logger\nReading configuration\n\
    Starting program\n```\n\n而这是另一个：\n\n```\nReading configuration\nInitializing logger\n\
    Starting program\n```\n\n### 讨论\n\n在这个谜题中，我们想要启动一个依赖于日志器已设置且配置已读取的程序。只要这两者都在程序启动之前完成，我们就没问题。日志器设置和配置读取的顺序在这里似乎并不重要，但如果很重要呢？例如，如果初始化日志器设置了某个全局日志器实例，我们在读取配置时会使用它。我们可以依赖这两个函数按照程序中列出的顺序被调用吗？遗憾的是，我们不能，因为函数参数表达式的求值顺序是未指定的。这不仅仅是理论上的；当我在\
    \ Linux 上测试此代码时，`GCC` 从右到左，而 `Clang` 从左到右。你可以在 Compiler Explorer 上查看在线演示^16\n\n\
    然而，一切并非混乱；我们确实有一些保证：\n\n1.  参数的初始化（包括所有相关的副作用）保证在函数执行之前已完成。这保证了 `initializeLogger`\
    \ 和 `readConfiguration` 在 `startProgram` 开始执行之前已经执行完毕，我们不会面临输出 `Initializing logger`\
    \ 与 `Starting program` 织的风险。这听起来显而易见，但嘿，这是 `C++`，所以检查一下很好。\n2.  一个参数的初始化（包括所有相关的副作用）保证在另一个参数的初始化开始已完成。这保证了要么\
    \ `initializeLogger` 完全在 `readConfiguration` 之前发生，反反之。\n3.  这里没有未定义行为；只是参数表达式可以以任何顺序进行求值。\n\
    \n我们知道 `initializeLogger` 和 `readConfiguration` 都在 `startProgram` 之前发生，只是不知道具体的顺序。此外，我们甚至不能保证在每次运行程序时它们发生的顺序都是相同的，即使使用相同的编译器和同一台电脑！编译器不太可能生成这种非确定性的代码，但根据标准，这是可以接受的。如果实现者决定（例如，从右到左比从左到右更高效），编译器也可能在新版本中更改排序。\n\
    \n那么我们能对此做什么呢？如果顺序实际上很重要，你只需要按照你想要的顺序一个接一个调用函数即可：\n\n[examples/deterministic-order/deterministic-order.cpp](http://media.pragprog.com/titles/akbrain/code/examples/deterministic-order/deterministic-order.cpp)\n\
    \n```cpp\nint main()\n{\n    const auto logger = initializeLogger();\n    const\
    \ auto configuration = readConfiguration();\n    startProgram(logger, configuration);\n\
    }\n```\n\n### 建议\n\n*   不要依赖函数参数表达式的求值顺序。\n\n"
- fmt: "\n- Don’t assume that expressions are evaluated in a particular order just\
    \ because they happen to do so in your tests.\n\n## Further Reading\n\nOrder of\
    \ Evaluation\n[https://en.cppreference.com/w/cpp/language/eval_order](https://en.cppreference.com/w/cpp/language/eval_order)\n\
    \n## Puzzle 24 | A Specialized String Theory\n\n[a-specialized-string-theory.cpp](http://media.pragprog.com/titles/akbrain/code/a-specialized-string-theory.cpp)\n\
    \n```cpp\n#include <iostream>\ntemplate<typename T>\nvoid serialize(T&) { std::cout\
    \ << \"template\\n\"; } // 1\n\ntemplate<>\nvoid serialize<>(const std::string&)\
    \ { std::cout << \"specialization\\n\"; } // 2\n\nvoid serialize(const std::string&)\
    \ { std::cout << \"normal function\\n\"; } // 3\n\nint main() {\n  std::string\
    \ hello_world{\"Hello, world!\"};\n  serialize(hello_world);\n  serialize(std::string{\"\
    Good bye, world!\"});\n}\n```\n\n### Guess the Output\nTry to guess what the output\
    \ is before moving to the next page.\n\nThe program displays the following output:\n\
    \n```\ntemplate\nnormal function\n```\n\n### Discussion\n\nYou might remember\
    \ our serialization library from Puzzle 2, Puzzle 2, [String Theory](#f_0013.xhtml_chp.puzzle02).\
    \ In the meantime, a C++ expert has come along and decided that everything is\
    \ better with templates. Whether or not that’s true is another discussion, but\
    \ it certainly makes overload resolution more interesting!\n\nWe find three definitions\
    \ of `serialize` in this puzzle. The first (the one marked “1”) is the primary\
    \ function template for `serialize`. The next (marked “2”) is an explicit specialization\
    \ of this template for `std::string`. You can recognize it as a specialization\
    \ by the empty `template<>` tag. Finally, we see a plain old non-template `serialize`\
    \ function (marked “3”).\n\nSince the name `serialize` is overloaded, when we\
    \ write a call to that name, overload resolution needs to work out which one to\
    \ call. As we learned in Puzzle 2, Puzzle 2, [String Theory](#f_0013.xhtml_chp.puzzle02),\
    \ it does that by creating a set of all candidate functions of that name and then\
    \ selecting the best viable function from that set. It’s clear that the normal,\
    \ non-template `serialize` function (3) is a candidate, but what happens with\
    \ the function template? And how is the compiler able to disambiguate between\
    \ the function template specialization and the normal function, which both have\
    \ the same signature?\n\nWhen a function template is involved in overload resolution,\
    \ the compiler looks at all the primary templates of that name. It doesn’t consider\
    \ specializations at this point, so only the primary template (1) is considered,\
    \ not the specialization (2). If we had other primary template overloads, these\
    \ would also be considered, but we only have one in this puzzle. An example of\
    \ another primary template could, for instance, be this one for pointers:\n\n\
    ```cpp\ntemplate<typename T>\nvoid serialize(T*) { std::cout << \"pointer\\n\"\
    ; }\n```\n\nYou can recognize this as a primary template by the non-empty `template<typename\
    \ T>`, just like we saw in the primary template in the puzzle.\n\nSince the primary\
    \ template (1) is the only primary template in this puzzle, we’ve now found the\
    \ function template for `serialize` that should be a candidate for overload resolution.\
    \ But to be able to proceed, overload resolution needs to have a concrete function\
    \ signature with actual types, not just a template taking an arbitrary type `T`.\
    \ So next, it does type deduction for `serialize` to see what a potential instantiation\
    \ would look like. This is called “synthesizing a declaration.” This synthesized\
    \ declaration is added to the set of candidate functions (together with the non-template\
    \ `serialize`), and regular overload resolution proceeds. Let’s see how type deduction\
    \ and overload resolution work for each of the two calls to `serialize`.\n\nFirst,\
    \ have a look at the call where we pass an object:\n\n```cpp\nserialize(hello_world);\n\
    ```\n\nThe expression `hello_world` is an lvalue of type `std::string`. As we\
    \ learned in Puzzle 13, Puzzle 13, [A Constant Struggle](#f_0024.xhtml_chp.puzzle13),\
    \ `T` is deduced to `std::string`, and the synthesized declaration has the signature\
    \ `void serialize(std::string&)`. We now have these two candidates for overload\
    \ resolution:\n\n```cpp\nvoid serialize(std::string&); // Synthesized from the\
    \ template (1)\nvoid serialize(const std::string&); // The non-template function\
    \ (3)\n```\n\nSince `hello_world` is non-const, overload resolution prefers the\
    \ template version of `serialize`, which takes a non-const reference.\n\nNow that\
    \ overload resolution has decided to use the function template, it’s time to find\
    \ a specialization to use. Should it instantiate and use the primary function\
    \ template (1) or use the explicit specialization (2)? In this case, that’s a\
    \ simple choice since we need a specialization with the signature `void serialize(std::string&)`\
    \ but our explicit specialization has the signature `void serialize(const std::string&)`.\
    \ We have to use the primary function template, and an implicit instantiation\
    \ is made for `T = std::string`, resulting in `void serialize(std::string&)`.\
    \ When this instantiation is called, `template` is printed.\n\nNext, let’s look\
    \ at the call where we pass a temporary string:\n\n```cpp\nserialize(std::string{\"\
    Good bye, world!\"});\n```\n\nThe expression `std::string{\"Good bye, world!\"\
    }` is a prvalue of type `std::string`, so `T` is deduced to `std::string`, just\
    \ like for the previous call. We again have these two candidates for overload\
    \ resolution:\n\n```cpp\nvoid serialize(std::string&); // Synthesized from the\
    \ template (1)\nvoid serialize(const std::string&); // The non-template function\
    \ (3)\n```\n\nSince `std::string{\"Good bye, world!\"}` is a prvalue, the non-const\
    \ reference in the function template can’t bind to it. The const reference in\
    \ the normal function can, and this function is picked by overload resolution.\
    \ Since the template was not picked, no instantiation takes place, and normal\
    \ function is printed.\n\nBonus question: what would happen if the function template\
    \ also took a const reference, like this?\n\n[examples/template-vs-function/template-vs-function.cpp](http://media.pragprog.com/titles/akbrain/code/examples/template-vs-function/template-vs-function.cpp)\n\
    \n```cpp\ntemplate<typename T>\nvoid serialize(const T&) { std::cout << \"template\\\
    n\"; } // 1\n```\n\nNow, the synthesized declaration will have the signature `void\
    \ serialize(const std::string&)`, exactly like the non-template function, and\
    \ overload resolution needs to pick between these:\n\n```cpp\nvoid serialize(const\
    \ std::string&); // Synthesized from the template (1)\nvoid serialize(const std::string&);\
    \ // The non-template function (3)\n```\n\nIf overload resolution finds two viable\
    \ candidates that are equally good, you normally get a compilation error. So will\
    \ this even compile?\n\nThis is in fact fine. A special clause exists for overload\
    \ resolution when templates are involved that says if a function `F1` is not a\
    \ function template specialization and `F2` is a function template specialization,\
    \ `F1` is a better function than `F2`. The non-template function is picked for\
    \ both calls, and the program outputs the following:\n\n```\nnormal function\n\
    normal function\n```\n"
