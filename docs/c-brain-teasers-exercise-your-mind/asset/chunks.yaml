  trans: "\n啊，}，这是 C++ 最强大的特性！在作用域结束时，局部变量按照它们构造的反顺序被销毁。首先，`reference3` 被销毁，这意味着临时对象\
    \ `DataSource` 被销毁（它的析构函数没有打印任何内容）。接着，`reference2` 被销毁，这意味着临时对象 `2` 被销毁，并打印了 `Destroyed\
    \ 2`。最后，`reference1` 被销毁，这意味着临时对象 `1` 被销毁，并打印了 `Destroyed 1`。\n\n| 相关问题 |\n| ---\
    \ |\n| ![images/aside-icons/warning.png](img/warning.png) | 在 C++ 中与临时对象 3 类似的问题并不罕见。这里有一个著名的例子，它直到\
    \ C++23 才被修复。（在编写本文时，常见的编译器尚未实现此修复。）[examples/range-for/range-for.cpp](http://media.pragprog.com/titles/akbrain/code/examples/range-for/range-for.cpp)\
    \ |\n\n```cpp\nclass MemoryAreaContainer {\npublic:\n    MemoryAreaContainer();\n\
    \    std::vector<MemoryArea>& getMemoryAreas() {\n        return memoryAreas_;\n\
    \    }\nprivate:\n    std::vector<MemoryArea> memoryAreas_;\n};\n```\n\n```cpp\n\
    for (const auto &lp : MemoryAreaContainer{}.getMemoryAreas()) {\n    std::cout\
    \ << lp.number_ << std::endl;\n}\n```\n\n这看起来是无害的。但为了让临时 `MemoryAreaContainer`\
    \ 持续到 for 循环结束，我们需要对它绑定一个 `const` 引用。我们在这里使用的 `const` 引用并没有绑定到 `MemoryAreaContainer`，而是绑定到\
    \ `getMemoryAreas()` 的返回值。因此，`MemoryAreaContainer` 临时对象在我们开始迭代之前就被销毁了。我们从 `getMemoryAreas()`\
    \ 获取的引用指向的是已经销毁的 `memoryAreas_` 成员，是一个悬空引用。（这只是一个简单的简化；请参阅 `stmt.ranged` 以查看范围\
    \ for 语句展开后的完整代码。） |\n\n| 建议 |\n| --- |\n| ![images/aside-icons/tip.png](img/tip.png)\
    \ | |\n\n* 不要依赖生命周期延长，优于使用 `const auto obj = get()` 而非 `const auto& ref = get()`。\n\
    * 不要依赖能够跨越函数调用的生命周期延长。\n* 跟上新的 C++ 标准、编译器和工具。许多 bug 在编译器甚至语言本身中被修复。\n* 使用清理器（sanitizers）。特别是地址清理器可以捕捉某些对已销对象的使用。\
    \ |\n\n### 延伸阅读\n\n临时对象的生命周期\n[`en.cppreference.com/w/cpp/language/reference_initialization#Lifetime_of_a_temporary`](https://en.cppreference.com/w/cpp/language/reference_initialization#Lifetime_of_a_temporary)\n\
    \n对损坏的范围 for 循环的最终修复\n[`www.open-std.org/jtc1/sc22/wg21/docs/papers/2022/p2644r1.pdf`](https://www.open-std.org/jtc1/sc22/wg21/docs/papers/2022/p2644r1.pdf)\
    \ |\n\n| 谜题 12 | 一个错误的开始 |\n[a-false-start.cpp](http://media.pragprog.com/titles/akbrain/code/a-false-start.cpp)\
    \ |\n\n```cpp\n#include <iostream>\n#include <stdexcept>\n\nstruct Engine {\n\
    \    ~Engine() { std::cout << \"Engine stopped\\n\"; }\n};\n\nstruct Machine {\n\
    \    Machine() { throw std::runtime_error{\"Failed to start machine\"}; }\n  \
    \  ~Machine() { std::cout << \"Machine stopped\\n\"; }\n\n    Engine engine_;\n\
    };\n\nint main() {\n    try {\n        Machine machine;\n    } catch (...) {\n\
    \    }\n}\n```\n\n| 输出 |\n| --- |\n| ![images/aside-icons/important.png](img/important.png)\
    \ 尝试猜猜输出。 |\n\n![hline.png]\n\n该程序显示以下内容：\n\n```\nEngine stopped\n```\n![hline.png]\n\
    \n### 讨论\n\n在上面的谜题中，我们有一个 `Machine` 类，它包含一个 `Engine`。当 `Machine` 在构造期间抛出异常时，`Machine`\
    \ 并没有完全初始化。那么 `engine_` 会被销毁吗？当我们构造 `Machine` 对象时，初始化顺序如下：\n\n* 虚基类\n* 直接基类\n\
    * 非静态数据成员（如 `Machine::engine_`）\n* 构造函数体\n\n当 `Machine` 构造函数抛出异常时，只有已经构造的成员会被销毁。`engine_`\
    \ 已经构造，因此会被释放；而尚未初始化的成员是不需要处理的，因为它们从未被构造过。但是，如果你在构造函数中手动获取了资源，就必须小心。你不能依赖析构函数来清理它。例如，如果你调用\
    \ `new` 并将指针赋值给成员，你不能依赖析构函数中的 `delete` 来清理。对于原始的 `open/close` 函数对也是如此。\n\n始终，为了让代码更健壮，请避免手动调用\
    \ `delete` 和 `close`。相反，请使用标准库类型（如 `unique_ptr` 或 `fstream`）作为成员，它们会自动清理资源。如果你的类管理一个适应标准库类型的自定义资源（例如谜题中需要停止的引擎），请将该责任抽离到一个独立的的小类（如\
    \ `Engine`），而不是在容器类中手动处理。这样你就不需要考虑管理它；只要它被构造过，就总是会被销毁。 |\n"
- fmt: "\n```cpp\nstd::cout << std::is_const_v<T>; // true if T is const\n}\n\ntemplate\
    \ <typename T>\nvoid byReference(T &t) {\n    std::cout << std::is_const_v<T>;\
    \ // true if T is const\n}\n\nint main() {\n    int nonConstInt = 0;\n    const\
    \ int constInt = 0;\n\n    byValue(nonConstInt);\n    byValue(constInt);\n\n \
    \   byReference(nonConstInt);\n    byReference(constInt);\n}\n```\n\n### Guess\
    \ the Output\n\n![images/aside-icons/important.png](images/aside-icons/important.png)\
    \ Try to guess what the output is before moving to the next page.\n\n![images/hline.png](images/hline.png)\n\
    \nThe program displays the following output:\n\n| 0001 |\n\n![images/hline.png](images/hline.png)\n\
    \n### Discussion\n\nThe two function templates `byValue` and `byReference` take\
    \ their parameters by value and by reference, respectively. We then call these\
    \ two function templates with a non-const and a const int as arguments. In which\
    \ cases is `T` deduced as `const`?\n\nBefore we start digging into the deduction\
    \ rules, let’s clarify two concepts that can be easily mixed up. The `T` in `template\
    \ <typename T>` is called the template parameter. The goal of template argument\
    \ deduction is to find `T`. On the other hand, the `T` and `T &` in the function\
    \ signatures `byValue(T t)` and `byReference(T &t)` are called the template parameter\
    \ types. These are the actual parameter types to the function templates and are\
    \ what we use for deduction.\n\nLet’s refer to these template parameter types\
    \ as `P` to distinguish them from the template parameters `T`. Here are three\
    \ examples:\n\n| Template parameter | Template parameter type P |\n| --- | ---\
    \ | --- |\n| template <typename T> | | |\n| void byValue(T t) | T | T |\n| template\
    \ <typename T> | | |\n| void byReference(T & t) | T | T & |\n| template <typename\
    \ ValueType> | | |\n| void f(const std::vector<ValueType>& v) | ValueType | const\
    \ std::vector<ValueType>& |\n\nAs you can see from the examples, in both `byValue`\
    \ and `byReference`, the template parameter is `T`. In `byValue`, the template\
    \ parameter type `P` is also just `T`, but in `byReference`, it is `T &`.\n\n\
    With that out the way, let’s dig into the deduction rules. First, let’s look at\
    \ the calls to `byValue`:\n\n```cpp\ntemplate <typename T> void byValue(T t);\n\
    \nint nonConstInt = 0;\nconst int constInt = 0;\n\nbyValue(nonConstInt);\nbyValue(constInt);\n\
    ```\n\nRemember, the template parameter is `T`, and the template parameter type\
    \ `P` is also just `T` (as opposed to, for example, `T &`).\n\nWhen deducing the\
    \ template parameter type `P`, if it’s not a reference type, the deduction rules\
    \ say to ignore any top-level cv-qualifiers (`const` or `volatile`) of the `argument`.\
    \ Since `P` is just `T`, it’s not a reference type, and cv-qualifiers are ignored.\n\
    \nWait, no matter if we pass a non-const or a const argument, we pretend it’s\
    \ non-const! Isn’t that a bit shady? It’s not. When `P` is not a reference type,\
    \ it means we pass the argument by value. It doesn’t matter whether the original\
    \ argument was `const`, the `t` parameter inside `byValue` is a copy, and we can’t\
    \ modify the original argument.\n\nSince top-level cv-qualifiers are ignored,\
    \ we deduce `P` from a non-const `int` in both calls to `byValue` and find `P\
    \ == int` in both cases. And since `P == T`, `T` is also non-const. 0 is printed\
    \ for both calls.\n\nNext, let’s look at the calls to `byReference`:\n\n```cpp\n\
    template <typename T> void byReference(T &t);\n\nint nonConstInt = 0;\nconst int\
    \ constInt = 0;\n\nbyReference(nonConstInt);\nbyReference(constInt);\n```\n\n\
    The template parameter is `T`, and the template parameter type `P` is `T &`.\n\
    \nThis time, `P` is a reference, and we do not ignore the top-level cv-qualifiers\
    \ of the argument. In this case, that’s important! The reference parameter `t`\
    \ will bind to our original argument, so it’s important that we don’t try, for\
    \ instance, to bind a non-const reference to a const argument.\n\nWhen passed\
    \ the non-const `nonConstInt`, `P` is deduced as `int &`, which means that `T`\
    \ is `int`. It’s not `const`, so 0 is printed.\n\nWhen passed the const `constInt`,\
    \ `P` is deduced as `const int &`, which means that `T` is `const int`. It is\
    \ const, so 1 is printed.\n\nThe complete rules for template argument deduction\
    \ can be a bit daunting to read, but at least this part about ignoring top-level\
    \ cv-qualifiers is intuitive enough that I’m able to remember it.\n\n### Auto\n\
    \n![images/aside-icons/tip.png](images/aside-icons/tip.png) The deduction rules\
    \ for `auto` are based on the rules for template argument deduction. So now that\
    \ you know these template argument deduction rules, you also know the corresponding\
    \ auto deduction rules!\n\n```cpp\nauto t1 = nonConstInt; // non-const object\n\
    auto t2 = constInt; // non-const object\nauto &t3 = nonConstInt; // reference\
    \ to non-const object\nauto &t4 = constInt; // reference to const object\n```\n\
    \n### Further Reading\n\nTemplate Argument Deduction\n\n[https://en.cppreference.com/w/cpp/language/template_argument_deduction](https://en.cppreference.com/w/cpp/language/template_argument_deduction)\n\
    \nDeducing Template Arguments from a Function Call\n\n[https://timsong-cpp.github.io/cppwp/std20/temp.deduct.call](https://timsong-cpp.github.io/cppwp/std20/temp.deduct.call)\n\
    \n### Puzzle 14 | Aristotle’s Sum of Parts\n\n```cpp\n#include <iostream>\n#include\
    \ <type_traits>\n\nint main() {\n    char char1 = 1;\n    char char2 = 2;\n  \
    \  // True if the type of char1 + char2 is char\n    std::cout << std::is_same_v<decltype(char1\
    \ + char2), char>;\n}\n```\n"
