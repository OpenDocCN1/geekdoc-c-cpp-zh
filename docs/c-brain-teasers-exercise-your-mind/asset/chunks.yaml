  trans: "\n 请注意，析构函数的体首先执行，然后才调用子对象的析构函数。这确保了你仍然可以在类的析构函数中使用成员和基类。因此，程序首先打印 `Button`\
    \ 析构函数，然后打印 `Widget` 析构函数。\n\n| 额外问题 |\n| --- |\n| ![images/aside-icons/note.png](img/note.png)\
    \ | 如果 `Widget` 没有将其析构函数声明为虚，会发生什么？在哪些情况下会产生问题？ |\n\n根据 C++ 标准，如果被删除对象的静态类型与其动态类型不同，则静态类型必须是被删除对象动态类型的基类，且该静态类型必须具有虚析构函数。否则，行为是未定义的。\n\
    \n因此，如果 `Widget` 没有将其析构函数声明为虚，而你通过指向 `Widget` 的指针删除一个 `Button` 对象，其行为是未定义的。在实践中，你通常会看到调用的是\
    \ `Widget` 析构函数 own `Button` 析构函数，并遇到此类问题：\n\n- 派生类的任何成员都没有被销毁，可能导致内存泄漏或其他资源泄漏。\n\
    - 如果派生类具有用户定义的析构函数，程序的正确性通常依赖于该逻辑在对象销毁时被执行。\n\n但在任何情况下，即使这些问题对你的特定程序没有产生具体影响，而且在测试期间一切看起来正常，你仍然应该将析构函数声明为虚，以避免未定义行为。\n\
    \n| 建议 |\n| --- |\n| ![images/aside-icons/tip.png](img/tip.png) | 得益于子对象的自动销毁，处理\
    \ C++ 资源的良好技术是将资源获取即初始化（RAII）类型（例如 `unique_ptrs`）作为成员。如果你派自此类类，这种技术同样有效。 |\n\n\
    ### 扩展阅读\n\n析构函数的 CppReference\n[`en.cppreference.com/w/cpp/language/destructor`](https://en.cppreference.com/w/cpp/language/destructor)\n\
    \n关于析构函数和子对象的 C++ 标准\n[`timsong-cpp.github.io/cppwp/std20/class.dtor#14`](https://timsong-cpp.github.io/cppwp/std20/class.dtor#14)\n\
    \n| 谜题 6 | 谁先？ |\n| [whos-up-first.cpp](http://media.pragprog.com/titles/akbrain/code/whos-up-first.cpp)\
    \ |\n\n```cpp\n#include <iostream>\nstruct Resource {\n  Resource() {\n    std::cout\
    \ << \"Resource constructed\\n\";\n  }\n};\n\nstruct Consumer {\n  Consumer(const\
    \ Resource &resource) {\n    std::cout << \"Consumer constructed\\n\";\n  }\n\
    };\n\nstruct Job {\n  Job() : resource_{}, consumer_{resource_} {}\n  Consumer\
    \ consumer_;\n  Resource resource_;\n};\n\nint main() {\n  Job job;\n}\n```\n\n\
    | 猜输出 |\n| --- |\n| ![images/aside-icons/important.png](img/important.png) | 在移动到下一页之前，尝试猜输出是什么。\
    \ |\n\n![images/hline.png](img/hline.png)\n\n程序显示以下输出：\n\n```\nConsumer constructed\n\
    Resource constructed\n```\n\n![images/hline.png](img/hline.png)\n\n### 讨论\n\n\
    类 `Job` 有两个成员 `consumer_` 和 `resource_`，按该顺序声明的。然而，在构造函数的成员初始化列表中（`: resource_{},\
    \ consumer_{resource_}` 部分）中，它们的初始化顺序是相反的。它们实际上按什么顺序初始化呢？\n\nC++ 总是按照成员在类中声明的顺序进行初始化，而不是它们在构造函数成员初始化列表中列出的顺序。这确保了成员总是以确定的顺序初始化，即使不同的构造函数在它们的成员初始化列表中列出了不同的顺序。因此，即使\
    \ `resource` 看起来在构造函数首先被初始化，实际上先初始化的是 `consumer_`。\n\n如果一个成员依赖于另一个成员，那么以确定的顺序初始化成员至关重要。例如，在这个例子中，`consumer`\
    \ 在构造函数中依赖 `resource`。构造函数看起来一切正常，但由于 `consumer_` 实际上在 `resource_` 之前初始化，`Consumer`\
    \ 构造函数接收到的 `Resource` 尚未构造。如果我们尝试用它做任何事情，就会产生未定义行为。\n\n反之亦然。成员的销毁顺序与其在类中的声明顺序相反。销毁顺序可能与构造顺序一样重要，因为一个成员在析构函数中可能依赖另一个成员，或者存在其他的生命周期依赖。例如，假设谜题中的\
    \ `Consumer` 运行一个使用 `Resource` 的线程，该 `Consumer` 在其析构函数环境中该线程。在当前的代码版本中，`resource_`\
    \ 在线程仍在运行时被销毁，我们将面临使用已销毁的 `resource_` 的风险，导致未定义行为。然而，如果 `consumer_` 在 `resource_`\
    \ 之后声明，那么 `consumer` 中的线程会在 `resource_` 被销毁之前停止。\n\n在成员初始化列表中错误的顺序列出成员会让读者感到困惑，因此我建议在成员初始化列表和类声明中使用相同的顺序。`GCC`、`Clang`\
    \ 和 `MSVC` 都有相应的警告（分别是 `-Wreorder`、`-Wreorder-ctor` 和 `C5038`），如果你不使用一致的顺序会警告你。如果你使用\
    \ `-Wall / /Wall` 编译，这些警告就会被启用，我总是建议这样做。不同的编译器通常有不同的警告，因此使用多个编译器编译是一个好主意。这还可以帮助你避免意外使用非标准的、特定平台的\
    \ C++ 变体，这会使以后将项目移植到其他平台变得困难。\n\n| 建议 |\n| --- |\n| - 始终开启警告。<br>- 使用多个编译器编译。\
    \ |\n\n### 扩展阅读\n\n构造函数和成员初始化列表\n[`en.cppreference.com/w/cpp/language/constructor`](https://en.cppreference.com/w/cpp/language/constructor)\n\
    \n| 谜题 7 | 好事终有尽时 |\n| [all-good-things-must-come-to-an-end.cpp](http://media.pragprog.com/titles/akbrain/code/all-good-things-must-come-to-an-end.cpp)\
    \ |\n\n```cpp\n#include <iostream>\n#include <string>\n\nstruct Connection {\n\
    \  Connection(const std::string &name) : name_(name) {\n    std::cout << \"Created\
    \ \" << name_ << \"\\n\";\n  }\n\n  ~Connection() {\n    std::cout << \"Destroyed\
    \ \" << name_ << \"\\n\";\n  }\n\n  std::string name_;\n};\n\nConnection global{\"\
    global\"};\n\nConnection &get() {\n  static Connection localStatic{\"local static\"\
    };\n  return localStatic;\n}\n\nint main() {\n  Connection local{\"local\"};\n\
    \  Connection &tmp1 = get();\n  Connection &tmp2 = get();\n}\n```\n"
- fmt: "\nIn Puzzle 3, Puzzle 3, [Hack the Planet!](#f_0014.xhtml_chp.puzzle03), and\
    \ Puzzle 4, Puzzle 4, [Going Global](#f_0015.xhtml_chp.puzzle04), we learned about\
    \ the lifetime and initialization differences between a global id and a local\
    \ id:\n\n```cpp\nint id; // global variable, one instance throughout the whole\
    \ program\n\nvoid f() {\n    int id = 2; // local variable, created anew each\
    \ time f is called\n}\n```\n\nIn this puzzle, we add two new interesting aspects\
    \ to object lifetime:\n\n*   We no longer initialize the variables to a simple\
    \ constant; there is a constructor with a side effect.\n*   We introduce a local\
    \ variable `localStatic` with static storage duration.\n\nSo how does the behavior\
    \ change when we introduce a constructor and a local static variable? Let’s first\
    \ consider the global variable `global`. Like the global variable `id` we saw\
    \ previously, it has static storage duration, which means only one instance is\
    \ alive from its initialization until its destruction at the very end of the program.\n\
    \nWe previously saw that the global `int id;` without an initializer was zero-initialized.\
    \ We also mentioned that a global with an initializer `int id = 2;` would be constant-initialized.\
    \ Both are examples of static initialization, which happens as part of program\
    \ initiation. The global variable `global`, on the other hand, is initialized\
    \ with a non-constant expression. The `Connection` constructor is not `constexpr`\
    \ (it can’t be since it prints to `std::cout`). Objects that can’t be statically\
    \ initialized are instead dynamically initialized, which happens later.\n\nWhen\
    \ does dynamic initialization happen, though? It’s commonly believed that dynamic\
    \ initialization happens before `main`—and for good reason: this is a simple and\
    \ common way to implement dynamic initialization. For instance, Linux has a function\
    \ `__libc_start_main`, which gets called before `main`. `__libc_start_main` invokes\
    \ global constructors before eventually calling your `main` function.\n\nThe C++\
    \ standard doesn’t require dynamic initialization to happen before `main`, it\
    \ merely allows it. However, the standard does require dynamic initialization\
    \ of global variables to happen before any functions defined in the same translation\
    \ unit (TU) are called. (A translation unit is just a single `.cpp` file after\
    \ all the `#include` files have been included.) So in this puzzle, where `main`\
    \ is defined in the same TU as `global`, `global` is actually guaranteed to be\
    \ initialized before `main`!\n\nThe complete rules for initialization order are\
    \ rather long and complicated. CppReference.com has an introduction,[6](#f_0036.xhtml_FOOTNOTE-6)\
    \ and the C++ standard has all the details in [basic.start].[7](#f_0036.xhtml_FOOTNOTE-7)\n\
    \nNext, let’s look at `localStatic`. Like `global`, `localStatic` also has static\
    \ storage duration, so there’s only one instance of `localStatic`, which is alive\
    \ from its initialization until the end of the program. Unlike globals, local\
    \ static variables are not initialized when the program starts but rather the\
    \ first time control passes through their declarations. So even though `localStatic`\
    \ has static storage duration, it’s not initialized until the first time `get`\
    \ is called.\n\nFinally, `local` is a simple local variable with automatic storage\
    \ duration; it is initialized each time control passes through its declaration.\n\
    \nLet’s look at the execution of this program then:\n\n*   The program starts,\
    \ and right before `main` is called, `global` is initialized.\n*   We enter `main`,\
    \ and `local` is initialized.\n*   We call `get` for the first time, and `localStatic`\
    \ is initialized.\n*   We call `get` a second time, but since `localStatic` is\
    \ already initialized, it’s not initialized again.\n\nBut we’re not done yet!\
    \ We also have to figure out when our three objects are destroyed. Luckily, the\
    \ rules for destruction are a lot simpler. Local objects with automatic storage\
    \ duration are destroyed at the end of the scope in which they were declared.\
    \ Objects with static storage duration are destroyed at the end of the program\
    \ in the reverse order of their creation:\n\n*   When we exit `main`, `local`\
    \ goes out of scope and is destroyed.\n*   `localStatic` was the last object with\
    \ static storage duration to be initialized, so it’s destroyed first.\n*   `global`\
    \ was initialized first and is destroyed last.\n\nUsing a static local instead\
    \ of a global is a good way to get better control over the lifetime of a “global”\
    \ variable. Instead of referring to a global object each time you need it, you\
    \ call a function to get a reference to it, and now you have control over when\
    \ the object is initialized! This can be particularly useful if you have multiple\
    \ globals depending on each other.\n\nFinally, note a word of caution regarding\
    \ globals defined in multiple TUs. Although there’s some order to the initialization\
    \ of globals inside a single TU, globals in different TUs can be initialized in\
    \ any order. For instance, you might expect the following program to print 1,\
    \ but on my computer it prints 0.\n\n[examples/siof/Value.h](http://media.pragprog.com/titles/akbrain/code/examples/siof/Value.h)\n\
    \n```cpp\nstruct Value {\n    Value(int i_) : i(i_) {}\n    Value(const Value\
    \ &other) : i(other.i) {}\n    int i;\n};\n```\n\n[examples/siof/source1.cpp](http://media.pragprog.com/titles/akbrain/code/examples/siof/source1.cpp)\n\
    \n```cpp\n#include \"Value.h\"\n#include <iostream>\n\nextern Value value1;\n\
    Value value2{value1}; // No guarantee that value1 has been initialized yet!\n\n\
    int main() {\n    std::cout << value2.i;\n}\n```\n\n[examples/siof/source2.cpp](http://media.pragprog.com/titles/akbrain/code/examples/siof/source2.cpp)\n\
    \n```cpp\n#include \"Value.h\"\n\nValue value1{1};\n```\n\nThis problem of unknown\
    \ initialization order between globals in different translation units is often\
    \ referred to as the “Static Initialization Order Fiasco” (SIOF).[8](#f_0036.xhtml_FOOTNOTE-8)\n\
    \n| Recommendations |\n| :--- |\n| ![images/aside-icons/tip.png](images/aside-icons/tip.png)\
    \ |\n*   Avoid globals depending on each other, especially if they’re defined\
    \ in different files.\n*   Use `clang-tidy`; it has a check `cppcoreguidelines-interfaces-global-init`,\
    \ which can detect some uses of dependent globals.\n*   Instead of global variables,\
    \ use functions with local static variables to control lifetimes. |\n\n### Further\
    \ Reading\n\nMore About Dynamic Initialization: How to Start a Program\n[https://www.youtube.com/watch?v=OGPmZzhDPYw](https://www.youtube.com/watch?v=OGPmZzhDPYw)\n\
    \nCppReference.com on Initialization\n[https://en.cppreference.com/w/cpp/language/initialization](https://en.cppreference.com/w/cpp/language/initialization)\n\
    \nThe C++ Standard on Initialization and Termination\n[https://timsong-cpp.github.io/cppwp/std20/basic.start](https://timsong-cpp.github.io/cppwp/std20/basic.start)\n\
    \nStatic Initialization Order Fiasco (SIOF)\n[https://en.cppreference.com/w/cpp/language/siof](https://en.cppreference.com/w/cpp/language/siof)\n\
    \n| Puzzle 8 | Will It Move? |\n[will-it-move.cpp](http://media.pragprog.com/titles/akbrain/code/will-it-move.cpp)\
    \ |\n\n```cpp\n#include <iostream>\n\nstruct Member {\n};\n\nstruct WillItMove\
    \ {\n    WillItMove() = default;\n    WillItMove(WillItMove &&) = default;\n \
    \   const Member constMember_{};\n};\n\nint main() {\n    WillItMove objectWithConstMember;\n\
    \    WillItMove moved{std::move(objectWithConstMember)};\n    std::cout << \"\
    It moved!\\n\";\n}\n```\n\n| Guess the Output |\n| :--- |\n| ![images/aside-icons/important.png](images/aside-icons/important.png)\
    \ | Try to guess what the output is before moving to the next page. |\n\n![images/hline.png](images/hline.png)\n"
