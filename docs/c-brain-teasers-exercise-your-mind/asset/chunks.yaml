    ### Go Brain Teasers


    [![](images/_covers/d-gobrain.jpg)](http://pragmaticprogrammer.com/titles/d-gobrain)


    This book contains 25 short programs that will challenge your understanding of
    `Go`. Like any big project, the `Go` developers had to make some design decisions
    that at times seem surprising. This book uses those quirks as a teaching opportunity.
    By understanding the gaps in your knowledge, you’ll become better at what you
    do. Some of the teasers are from the author’s experience shipping bugs to production,
    and some from others doing the same. Teasers and puzzles are fun, and learning
    how to solve them can teach you to avoid programming mistakes and maybe even impress
    your colleagues and future employers.


    Miki Tebeka


    (110 pages) ISBN: 9781680508994 $18.95


    ### Python Brain Teasers


    [![](images/_covers/d-pybrain.jpg)](http://pragmaticprogrammer.com/titles/d-pybrain)


    We geeks love puzzles and solving them. The `Python` programming language is a
    simple one, but like all other languages it has quirks. This book uses those quirks
    as teaching opportunities via 30 simple `Python` programs that challenge your
    understanding of `Python`. The teasers will help you avoid mistakes, see gaps
    in your knowledge, and become better at what you do. Use these teasers to impress
    your co-workers or just to pass the time in those boring meetings. Teasers are
    fun!


    Miki Tebeka


    (116 pages) ISBN: 9781680509007 $18.95


    ### Complex Network Analysis in Python


    [![](images/_covers/dzcnapy.jpg)](http://pragmaticprogrammer.com/titles/dzcnapy)


    Construct, analyze, and visualize networks with `networkx`, a Python module. Network
    analysis is a powerful tool you can apply to a multitude of datasets and situations.
    Discover how to work with all kinds of networks, including social, product, temporal,
    and semantic networks. Convert almost any real-world data into a complex network—such
    as recommendations on cosmetic products, hedge fund connections, and online friendships.
    Analyze and visualize the network, and make business decisions based on your analysis.
    If you’re a curious `Python` programmer, a data scientist, or a `CNA` specialist
    in mechanizing mundane tasks, you’ll increase your productivity exponentially.


    Dmitry Zinoviev


    (260 pages) ISBN: 9781680502695 $35.95


    ### Modern C++ Programming with Test-Driven Development


    [![](images/_covers/lotdd.jpg)](http://pragmaticprogrammer.com/titles/lotdd)


    If you program in `C++` you’ve been neglected. Test-driven development (TDD) is
    a modern software development practice that can dramatically reduce the number
    of defects in systems, produce more maintainable code, and give you the confidence
    to change your software to meet changing needs. But `C++` programmers have been
    ignored by those promoting TDD;—until now. In this book, Jeff Langr gives you
    hands-on lessons in the challenges and rewards of doing TDD in `C++`.


    Jeff Langr


    (366 pages) ISBN: 9781937785482 $40


    ### Test-Driven Development for Embedded C


    [![](images/_covers/jgade.jpg)](http://pragmaticprogrammer.com/titles/jgade)


    Still chasing bugs and watching your code deteriorate? Think TDD is only for desktop
    or web apps? It’s not: TDD is for you, the embedded `C` programmer. TDD helps
    you prevent defects and build software with a long useful life. This is the first
    book to teach the hows and whys of TDD for `C` programmers.


    James W. Grenning


    (354 pages) ISBN: 9781934356623 $34.95


