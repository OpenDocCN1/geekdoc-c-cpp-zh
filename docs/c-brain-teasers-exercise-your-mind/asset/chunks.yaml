  trans: "\n\n在谜题 3、谜题 3 入侵星球！ 以及谜题 4、谜题 4 全球化 中，我们学习了全局 id 和局部 id 在生命周期和初始化上的差异：\n\
    \n```cpp\nint id; // 全局变量，整个程序期间只有一个实例\n\nvoid f() {\n    int id = 2; // 局部变量，每次调用\
    \ f 时都会重新创建\n}\n```\n\n在这个谜题中，我们为对象生命周期添加了两个新的有趣维度：\n\n*   我们不再将变量初始化为简单的常量；而是有了一个带有副作用的构造函数。\n\
    *   我们引入了具有静态存储周期的局部变量 `localStatic`。\n\n那么，当我们引入构造函数和局部静态变量时，行为会发生什么变化？让我们先考虑全局变量\
    \ `global`。与之前看到的全局变量 `id` 一样，它具有静态存储周期，这意味着从初始化到程序结束时的销毁，只有一个实例是活跃的。\n\n我们之前见过，没有初始化器的全局\
    \ `int id;` 被零初始化。我们还提到过，带有初始化器的全局变量 `int id = 2;` 会被常量初始化。两者都是静态初始的示例，静态初始化发生在程序启动期间。另一方面，全局变量\
    \ `global` 使用非常量表达式初始化。`Connection` 构造函数不是 `constexpr`（它不可能是，因为要向 `std::cout`\
    \ 输出内容）。无法进行静态初始化的对象改为动态初始化，这发生在较晚之后。\n\n然而，动态初始化何时发生呢？人们通常认为动态初始化发生在 `main` 之前——这很有道理：这是实现动态初始化的一种简单常见的方法。例如，Linux\
    \ 有一个函数 `__libc_start_main`，它在 `main` 之前被调用。`__libc_start_main` 在最终调用你的 `main`\
    \ 函数之前会调用全局构造函数。\n\nC++ 标准并没有要求动态初始化发生在 `main` 之前，它只是允许。然而，标准要求全局变量的动态初始化必须发生在同一个编译单元（TU）中定义的任何函数被调用之前。（编译单元归其底就是包含所有\
    \ `#include` 文件后的单个 `.cpp` 文件。）因此在这个谜题中，由于 `main` 定义在与 `global` 相同的 TU 中，`global`\
    \ 实际上保证在 `main` 之前被初始化！\n\n初始化顺序的完整规则相当长且复杂。CppReference.com 有一个介绍,6，而 C++ 标准在\
    \ [basic.start].7 中包含了所有细节。\n\n接下来，来看 `localStatic`。像 `global` 一样，`localStatic`\
    \ 也具有静态存储周期，因此 `localStatic` 只有一个实例，从初始化一直到程序结束。与全局变量不同，局部静态变量不在程序启动时初始化，而是在控制流第一次通过它们的声明时初始化。所以尽管\
    \ `localStatic` 具有静态存储周期，直到第一次调用 `get` 时 get 初始化。\n\n最后，`local` 是具有自动存储周期的简单局部变量；它在每次控制流通过其声明时都会初始化。\n\
    \n让我们来看看程序的执行情况：\n\n*   程序启动，在调用 `main` 之前，`global` 被初始化。\n*   我们进入 `main`，`local`\
    \ 被初始化。\n*   我们第一次调用 `get`，`localStatic` 被初始化。\n*   我们第二次调用 `get`，但由于 `localStatic`\
    \ 已经初始化，它不会再次初始化。\n\n但我们还没有结束！我们还需要弄清楚这三个对象何时销毁。幸运的是，销毁规则简单得多。具有自动存储周期的局部对象在其声明的作用域结束时销毁。具有静态存储周期的对象在程序结束时按创建的反序销毁：\n\
    \n*   当我们退出 `main` 时，`local` 离开作用域并销毁。\n*   `localStatic` 是最后一个初始化的静态存储对象，所以它第一个被销毁。\n\
    *   `global` 先初始化，最后被销毁。\n\n使用静态局部变量而不是全局变量是更好地控制“全局”变量生命周期的好方法。你不需要每次需要时都引用全局对象，而是调用一个函数来获取它的引用，现在你就可以控制对象初始化的机了！如果你有多个相互依赖的全局变量，这会特别有用。\n\
    \n最后，注意关于在多个 TU 中定义的全局变量的警告。虽然单个 TU 内部的全局变量初始化是有顺序的，但不同 TU 中的全局变量可以以任何顺序初始化。例如，你可能期望以下程序打印\
    \ 1，但在我的电脑上它打印的是 0。\n\n[examples/siof/Value.h](http://media.pragprog.com/titles/akbrain/code/examples/siof/Value.h)\n\
    \n```cpp\nstruct Value {\n    Value(int i_) : i(i_) {}\n    Value(const Value\
    \ &other) : i(other.i) {}\n    int i;\n};\n```\n\n[examples/siof/source1.cpp](http://media.pragprog.com/titles/akbrain/code/examples/siof/source1.cpp)\n\
    \n```cpp\n#include \"Value.h\"\n#include <iostream>\n\nextern Value value1;\n\
    Value value2{value1}; // 无法保证 value1 已经初始化！\n\nint main() {\n    std::cout <<\
    \ value2.i;\n}\n```\n\n[examples/siof/source2.cpp](http://media.pragprog.com/titles/akbrain/code/examples/siof/source2.cpp)\n\
    \n```cpp\n#include \"Value.h\"\n\nValue value1{1};\n```\n\n这种不同编译单元之间全局变量未知初始化顺序的问题被称为“静态初始化顺序灾难”（SIOF）。8\n\
    \n| 建议 |\n| :--- |\n| ![images/aside-icons/tip.png](img/tip.png) |\n*   避免全局变量相互依赖，特别是当它们定义在不同的文件中。\n\
    *   使用 `clang-tidy`；它有一个检查 `cppcoreguidelines-interfaces-global-init`，可以检测某些依赖全局变量的使用。\n\
    *   使用带有局部静态变量的函数来控制生命周期，而不是全局变量。 |\n\n### 扩展阅读\n\n更多关于动态初始化：如何启动程序\n[`www.youtube.com/watch?v=OGPmZzhDPYw`](https://www.youtube.com/watch?v=OGPmZzhDPYw)\n\
    \nCppReference.com 关于初始化\n[`en.cppreference.com/w/cpp/language/initialization`](https://en.cppreference.com/w/cpp/language/initialization)\n\
    \nC++ 标准关于初始化和终止\n[`timsong-cpp.github.io/cppwp/std20/basic.start`](https://timsong-cpp.github.io/cppwp/std20/basic.start)\n\
    \n静态初始化顺序灾难 (SIOF)\n[`en.cppreference.com/w/cpp/language/siof`](https://en.cppreference.com/w/cpp/language/siof)\n\
    \n| 谜题 8 | 会移动吗？ |\n[will-it-move.cpp](http://media.pragprog.com/titles/akbrain/code/will-it-move.cpp)\
    \ |\n\n```cpp\n#include <iostream>\n\nstruct Member {\n};\n\nstruct WillItMove\
    \ {\n    WillItMove() = default;\n    WillItMove(WillItMove &&) = default;\n \
    \   const Member constMember_{};\n};\n\nint main() {\n    WillItMove objectWithConstMember;\n\
    \    WillItMove moved{std::move(objectWithConstMember)};\n    std::cout << \"\
    It moved!\\n\";\n}\n```\n\n| 猜猜输出 |\n| :--- |\n| ![images/aside-icons/important.png](img/important.png)\
    \ 在移动到下一页之前尝试猜猜输出是什么。 |\n\n![images/hline.png](img/hline.png)\n\n"
- fmt: "\nThe program displays the following output:\n\n| | It moved! |\n\n![images/hline.png](images/hline.png)\n\
    \n### Discussion\n\n`WillItMove` has a `const` member. You can’t move from a `const`\
    \ object, so why could we still move from `objectWithConstMember`?\n\nIn this\
    \ puzzle, we first initialize a `WillItMove` `objectWithConstMember`. Then, on\
    \ the following line, we initialize a new `WillItMove` `moved{std::move(objectWithConstMember)};`.\
    \ `WillItMove` has no copy constructor, so the only alternative to initialize\
    \ `moved` is the move constructor. But how can the move constructor move from\
    \ the `const` Member `constMember`?\n\nLet’s start digging from the outside in.\n\
    \nFirst, what does `std::move(objectWithConstMember)` do? `std::move` doesn’t\
    \ actually move anything; it just turns the lvalue `objectWithConstMember` into\
    \ an rvalue. Then, this rvalue is used to initialize `moved`.\n\n| Lvalues and\
    \ Rvalues |\n| --- |\n| ![images/aside-icons/note.png](images/aside-icons/note.png)\
    \ | Lvalues vs. rvalues is a way to categorize expressions. An lvalue is an expression\
    \ that evaluates to an actual object that has an identity and cannot be moved\
    \ from. For instance, the expression `objectWithConstMember` evaluates to the\
    \ `objectWithConstMember` object. It has a name and a place in memory and others\
    \ could still be using it, so the type system doesn’t allow us to move from it.\
    \ Traditionally, lvalues have tended to appear to the left of an assignment, hence\
    \ the name lvalue (left-value).An rvalue on the other hand is an expression that\
    \ evaluates to something that can be moved from, for instance a temporary that\
    \ no one else can get to anyway. Rvalues tend to appear to the right of an assignment,\
    \ hence the name rvalue (right-value).`std::move` turns an lvalue into an rvalue\
    \ and is the way we tell the type system that “this is fine, you can go ahead\
    \ and move from this lvalue; I won’t be using it anymore.” With the introduction\
    \ of `std::move`, it has become more common to see lvalues appear to the right\
    \ of the assignment (inside a `std::move`), so the “left-value” vs. “right-value”\
    \ mnemonic isn’t quite as useful as it used to be.See Lvalues, Rvalues, Glvalues,\
    \ Prvalues, Xvalues, Help!^([[9]](#f_0036.xhtml_FOOTNOTE-9)) for a full overview\
    \ of lvalues, rvalues, and the other value categories. |\n\nNote that even though\
    \ we initialize `moved` from an rvalue, that doesn’t mean we need to use the move\
    \ constructor to initialize it! We just need any constructor capable of binding\
    \ to an rvalue. A `const` lvalue reference can bind to an rvalue, so a copy constructor\
    \ could also have been used, if we had one. We don’t, however, so `WillItMove`’s\
    \ move constructor is our only choice.\n\n`WillItMove`’s move constructor has\
    \ been explicitly defaulted by the line `WillItMove(WillItMove &&) = default;`,\
    \ so let’s turn our attention to what a defaulted move constructor does. How can\
    \ it move from a `const` member?\n\nThe explicitly defaulted move constructor\
    \ direct-initializes all subobjects with the corresponding member from the source\
    \ object. Essentially, it’s defined something like this:\n\n```cpp\n[examples/default-move/default-move.cpp](http://media.pragprog.com/titles/akbrain/code/examples/default-move/default-move.cpp)\n\
    ```\n\n| | Class(Class &&other) : |\n| | BaseClass1{std::move(other)}, |\n| |\
    \ BaseClass2{std::move(other)}, |\n| | /* ... */ |\n| | member1_{std::move(other).member1_},\
    \ |\n| | member2_{std::move(other).member2_} |\n| | /* ... */ |\n| | {} |\n\n\
    So for our class `WillItMove`, it looks something like this:\n\n```cpp\n[examples/default-move/default-move.cpp](http://media.pragprog.com/titles/akbrain/code/examples/default-move/default-move.cpp)\n\
    ```\n\n| | WillItMove(WillItMove && other) : |\n| | constMember_{std::move(other).constMember_}{}\
    \ |\n\nAgain, even if `std::move(other).constMember_` is an rvalue, we don’t necessarily\
    \ need to use a `Member` move constructor to initialize `constMember_`. Either\
    \ a copy or a move constructor will do, as long as it can bind to `std::move(other).constMember_`.\
    \ Since we haven’t declared any special member functions for `Member`, it implicitly\
    \ gets both a defaulted copy constructor and a defaulted move constructor. Can\
    \ one of those bind to the `const` rvalue `other.constMember_`?\n\nThe implicitly\
    \ defaulted move constructor for `Member` is declared like this:\n\n| | Member(Member&&)\
    \ |\n\nAn rvalue reference to non-const cannot bind to the `const` rvalue, so\
    \ we can’t use the move constructor to direct-initialize `constMember_`.\n\nThe\
    \ implicitly defaulted copy constructor for `Member` is declared like this:\n\n\
    | | Member(const Member&) |\n\nAn lvalue reference to const can bind to a `const`\
    \ rvalue, so we can use the copy constructor to direct-initialize `constMember_`.\n\
    \nThus, the explicitly defaulted move constructor for `WillItMove` uses `Member`’s\
    \ copy constructor rather than `Member`’s move constructor to initialize `constMember_`.\n\
    \n### Further Reading\n\nMove Constructors\n[https://en.cppreference.com/w/cpp/language/move_constructor](https://en.cppreference.com/w/cpp/language/move_constructor)\n\
    \nCopy Constructors\n[https://en.cppreference.com/w/cpp/language/copy_constructor](https://en.cppreference.com/w/cpp/language/copy_constructor)\n\
