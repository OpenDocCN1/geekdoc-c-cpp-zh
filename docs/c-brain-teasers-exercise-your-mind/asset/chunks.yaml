  trans: "\n\n- 不要仅仅因为表达式在测试中恰好按照特定顺序执行，就假设它们总是以此顺序执行。\n\n## 延伸阅读\n\n求顺序\n[`en.cppreference.com/w/cpp/language/eval_order`](https://en.cppreference.com/w/cpp/language/eval_order)\n\
    \n## 谜题 24 | 特殊字符串理论\n\n[a-specialized-string-theory.cpp](http://media.pragprog.com/titles/akbrain/code/a-specialized-string-theory.cpp)\n\
    \n```cpp\n#include <iostream>\ntemplate<typename T>\nvoid serialize(T&) { std::cout\
    \ << \"template\\n\"; } // 1\n\ntemplate<>\nvoid serialize<>(const std::string&)\
    \ { std::cout << \"specialization\\n\"; } // 2\n\nvoid serialize(const std::string&)\
    \ { std::cout << \"normal function\\n\"; } // 3\n\nint main() {\n  std::string\
    \ hello_world{\"Hello, world!\"};\n  serialize(hello_world);\n  serialize(std::string{\"\
    Good bye, world!\"});\n}\n```\n\n### 猜输出\n在进入下一页之前，尝试猜猜输出是什么。\n\n程序显示以下输出：\n\n\
    ```\ntemplate\nnormal function\n```\n\n### 讨论\n\n你可能还记得我们在谜题 2、谜题 2、字符串理论 中的序列化库。在此期间，一位\
    \ C++ 专家出现了，并决定凡是有使用模板的地方都会变得更好。这是否真实是另一个话题了，但它确实让重载解析变得更有趣了！\n\n我们在谜题中找到了三个 `serialize`\
    \ 的定义。第一个（标记为“1”的）是 `serialize` 的主函数模板。下一个（标记为“2”的）是该模板针对 `std::string` 的显式特化。你可以通过空的\
    \ `template<>` 标签识别出它是一个特化版本。最后，我们看到了一个普通的非模板 `serialize` 函数（标记为“3”）。\n\n由于 `serialize`\
    \ 名字被重载了，当我们写出对该名称的调用时，重载解析需要确定调用哪一个。正如我们在谜题 2、谜题 2、字符串理论 中学的那样，它通过创建一个该名称的所有候选函数的集合，然后从该集合中选择最佳的可行函数来实现。很清楚，普通的、非模板\
    \ `serialize` 函数 (3) 是一个候选者，但函数模板又是怎样的呢？编译器又是如何在函数模板特化版本和普通函数（两者签名相同）之间消除歧义的？\n\
    \n当函数模板参与重载解析时，编译器会查看该名称的所有主模板。在这一阶段，它不会考虑特化版本，因此只考虑主模板 (1)，而不考虑特化版本 (2)。如果我们有其他主模板重载，这些也会被考虑在内，但在本谜题中我们只有一个。另一个主模板的例子可以是针对指针的这个：\n\
    \n```cpp\ntemplate<typename T>\nvoid serialize(T*) { std::cout << \"pointer\\\
    n\"; }\n```\n\n你可以通过非空的 `template<typename T>` 识别出这是一个主模板，就像我们在谜题的主模板中看到的那样。\n\
    \n由于主模板 (1) 是本谜题中唯一的主模板，我们现在已经找到了应该作为重载解析候选者的 `serialize` 函数模板。但为了能够继续，重载解析需要一个具有实际类型的具体函数签名，而不仅仅是一个接受任意类型\
    \ `T` 的模板。因此，接下来它会对 `serialize` 进行类型推导，以查看潜在的实例化是什么样的。这被称为“合成声明”。这个合成声明被添加到候选函数集合中（与非模板\
    \ `serialize` 一起），然后进行常规重载解析。让我们看看类型推导和重载解析对于对 `serialize` 的两次调用具体是如何工作的。\n\n\
    首先，看我们传递对象的那个调用：\n\n```cpp\nserialize(hello_world);\n```\n\n表达式 `hello_world`\
    \ 是类型为 `std::string` 的左值。正如我们在谜题 13、谜题 13、持久的斗争 中学的那样，`T` 被推导出为 `std::string`，合成的签名签名\
    \ `void serialize(std::string&)`。我们现在有两个重载解析的候选者：\n\n```cpp\nvoid serialize(std::string&);\
    \ // 从模板 (1) 合成\nvoid serialize(const std::string&); // 非模板函数 (3)\n```\n\n由于 `hello_world`\
    \ 是非 const 的，重载解析倾向于 `serialize` 的模板版本，因为它接受非 const 引用。\n\n现在重载解析已经决定使用函数模板，是时候寻找要使用的特化版本了。应该是实例化并使用主函数模板\
    \ (1)，还是使用显式特化 (2)？在这种情况下，这是一个简单的选择，因为我们需要签名为 `void serialize(std::string&)` 的特化，但我们的显式特化签名是\
    \ `void serialize(const std::string&)`。我们必须使用主函数模板，并为 `T = std::string` 进行隐含实例化，产生\
    \ `void serialize(std::string&)`。当调用此实例化时，会打印 `template`。\n\n接下来，让我们传递临时字符串的调用：\n\
    \n```cpp\nserialize(std::string{\"Good bye, world!\"});\n```\n\n表达式 `std::string{\"\
    Good bye, world!\"}` 是类型为 `std::string` 的右值（prvalue），因此 `T` 推导出 `std::string`，与上一个调用一样。我们再次拥有这两个重载解析的候选者：\n\
    \n```cpp\nvoid serialize(std::string&); // 从模板 (1) 合成\nvoid serialize(const std::string&);\
    \ // 非模板函数 (3)\n```\n\n由于 `std::string{\"Good bye, world!\"}` 是一个右值，函数模板中的非 const\
    \ 引用无法绑定它。普通函数中的 const 引用可以，该函数被重载解析选中。由于没有选中模板，不会发生实例化，并打印 `normal function`。\n\
    \n附加问题：如果函数模板也接受 const 引用，像这样会怎样？\n\n[examples/template-vs-function/template-vs-function.cpp](http://media.pragprog.com/titles/akbrain/code/examples/template-vs-function/template-vs-function.cpp)\n\
    \n```cpp\ntemplate<typename T>\nvoid serialize(const T&) { std::cout << \"template\\\
    n\"; } // 1\n```\n\n现在，合成的签名将是 `void serialize(const std::string&)`，与非模板完全相同，重载解析需要在这些之间进行选择：\n\
    \n```cpp\nvoid serialize(const std::string&); // 从模板 (1) 合成\nvoid serialize(const\
    \ std::string&); // 非模板函数 (3)\n```\n\n如果重载解析发现两个同样优秀的可行候选者，通常会得到编译错误。那么这能编译吗？\n\
    \n这实际上是没问题的。在涉及模板的重载解析中，有一个特殊规定：如果函数 `F1` 不是函数模板特化版本而 `F2` 是函数模板特化版本，则 `F1` 比\
    \ `F2` 更好。非模板函数被两次调用选中，程序输出以下内容：\n\n```\nnormal function\nnormal function\n```\n\
    \n"
- fmt: "\nNotice that in neither of the preceding cases was the explicit function\
    \ template specialization even involved in overload resolution—it never is. This\
    \ can be non-intuitive, so in general it’s better to use non-template overloads\
    \ than explicit specializations. See the first two links under Further Reading\
    \ for more details and some even worse examples of these kinds of confusions.\n\
    \n| Recommendations |\n| --- |\n| ![images/aside-icons/tip.png](images/aside-icons/tip.png)\
    \ |\n*   Prefer non-template overloads over explicit specializations. |\n\n###\
    \ Further Reading\n\nWhy Not Specialize Function Templates?\n\n[http://www.gotw.ca/publications/mill17.htm](http://www.gotw.ca/publications/mill17.htm)\n\
    \nFull Specialization of Function Templates\n\n[https://www.modernescpp.com/index.php/full-specialization-of-function-templates/](https://www.modernescpp.com/index.php/full-specialization-of-function-templates/)\n\
    \nC++ Core Guideline T.144: Don’t Specialize Function Templates\n\n[https://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines#t144-dont-specialize-function-templates](https://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines#t144-dont-specialize-function-templates)\n\
    \n| Puzzle 25 | Weakly Typed, Strongly Puzzling |\n[weakly-typed-strongly-puzzling.cpp](http://media.pragprog.com/titles/akbrain/code/weakly-typed-strongly-puzzling.cpp)\
    \ |\n\n```cpp\n#include <iostream>\n\nint main() {\n  std::cout << +!!\"\"\";\n\
    }\n```\n\n| Guess the Output |\n| --- |\n| ![images/aside-icons/important.png](images/aside-icons/important.png)\
    \ Try to guess what the output is before moving to the next page. |\n\n![images/hline.png](images/hline.png)\n\
    \nThe program displays the following output:\n\n| 1 |\n\n![images/hline.png](images/hline.png)\n\
    \n### Discussion\n\nWait, what? Is this legal C++? What does it even mean, and\
    \ why does it print 1?\n\nWhile C++ is a statically typed language, it’s not particularly\
    \ strongly typed. As we’ve seen throughout the book, C++ is, in fact, very eager\
    \ to implicitly convert between types without you explicitly telling it to. For\
    \ instance, in Puzzle 14, Puzzle 14, [Aristotle’s Sum of Parts](#f_0025.xhtml_chp.puzzle14),\
    \ we saw how the sum of two chars is not a char; in Puzzle 17, Puzzle 17, [A Strong\
    \ Point](#f_0028.xhtml_chp.puzzle17), we saw how you should declare your constructors\
    \ explicit to avoid them taking part in implicit conversions; and in Puzzle 19,\
    \ Puzzle 19, [A Little Sum Thing](#f_0030.xhtml_chp.puzzle19), we saw how implicit\
    \ conversions between arithmetic types can lead to unexpected results.\n\nThis\
    \ eagerness is something we inherited back in the day when C++ was designed as\
    \ an extension of C. If we did it over today, this abundance of implicit conversions\
    \ would be high on the list of things we’d want to change.\n\nSo which implicit\
    \ conversions are in play here, what is the final type of this expression, and\
    \ why is the result 1?\n\nLet’s start to the right, with the expression `\"\"\
    `. This is a string literal, and as we discussed in Puzzle 2, Puzzle 2, [String\
    \ Theory](#f_0013.xhtml_chp.puzzle02), the type of a string literal is “array\
    \ of n const char,” with n being 1 in this case (for the implicit `\\0` terminator).\n\
    \nNext is the `!` operator, which negates its operand. But how do you negate an\
    \ array of characters? That doesn’t make sense, does it? Indeed it doesn’t, but\
    \ the operand to the `!` operator is contextually converted to `bool` before being\
    \ negated. Converting an array to `bool` doesn’t make sense either, but as we\
    \ saw in Puzzle 2, Puzzle 2, [String Theory](#f_0013.xhtml_chp.puzzle02), arrays\
    \ can be implicitly converted to pointers, and pointers can again be converted\
    \ to `bool`. When a pointer is converted to `bool`, it converts to false if it’s\
    \ a null-pointer and to true otherwise. Since the pointer in this case is non-null\
    \ (it points to our string literal), it converts to true. Finally, the `!` operator\
    \ negates this, so we arrive at false. One could argue that this entire conversion\
    \ sequence doesn’t really make sense either, and I’d agree, but at least we can\
    \ understand how each step works and how they combine to arrive at this result.\n\
    \nNext up is another `!`, which this time simply negates our `bool` false, giving\
    \ us the `bool` true.\n\nFinally, there’s the unary `+`. The operand to unary\
    \ `+` goes through integral promotions, which for `bool` means converting false\
    \ to 0 and true to 1. The operator itself doesn’t do anything; its result is the\
    \ same as its operand (after promotion). So our `bool` true finally turns into\
    \ the `int` 1, which gets printed.\n\nWhether or not the compiler should warn\
    \ about any of this is another discussion, but none of the major ones do, even\
    \ with `-Wall` `-Wextra` for GCC and Clang, and `/Wall` for MSVC. Your compiler\
    \ might be able to provide some warnings, though, if you turn those warnings on\
    \ explicitly. For instance, Clang will warn about the string-to-bool conversion\
    \ if given the `-Wstring-conversion` option (which is not included in `-Wall`\
    \ or `-Wextra`). Check your compiler’s documentation for the list of warnings\
    \ it supports.\n\n| Recommendations |\n| --- |\n| ![images/aside-icons/tip.png](images/aside-icons/tip.png)\
    \ |\n*   Turn on as many warnings as you can.\n*   Be aware that not all warnings\
    \ are included in the maximum warning levels for each compiler.\n*   Don’t write\
    \ code like this in real life! |\n\n### Further Reading\n\nCppReference on Implicit\
    \ Conversions\n\n[https://en.cppreference.com/w/cpp/language/implicit_conversion](https://en.cppreference.com/w/cpp/language/implicit_conversion)\n\
    \nImplicit Conversion Sequences in the Standard\n\n[https://timsong-cpp.github.io/cppwp/std20/over.best.ics](https://timsong-cpp.github.io/cppwp/std20/over.best.ics)\n\
