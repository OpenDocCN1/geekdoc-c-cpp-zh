    ### Discussion


    WillItMove has a const member. You can’t move from a const object, so why could
    we still move from objectWithConstMember?


    In this puzzle, we first initialize a WillItMove objectWithConstMember;. Then,
    on the following line, we initialize a new WillItMove moved{std::move(objectWithConstMember)};.
    WillItMove has no copy constructor, so the only alternative to initialize moved
    is the move constructor. But how can the move constructor move from the const
    Member constMember?


    Let’s start digging from the outside in.


    First, what does std::move(objectWithConstMember) do? std::move doesn’t actually
    move anything; it just turns the lvalue objectWithConstMember into an rvalue.
    Then, this rvalue is used to initialize moved.


    | Lvalues and Rvalues |


    | --- |


    | ![images/aside-icons/note.png](images/aside-icons/note.png) | Lvalues vs. rvalues
    is a way to categorize expressions. An lvalue is an expression that evaluates
    to an actual object that has an identity and cannot be moved from. For instance,
    the expression objectWithConstMember evaluates to the objectWithConstMember object.
    It has a name and a place in memory and others could still be using it, so the
    type system doesn’t allow us to move from it. Traditionally, lvalues have tended
    to appear to the left of an assignment, hence the name lvalue (left-value).An
    rvalue on the other hand is an expression that evaluates to something that can
    be moved from, for instance a temporary that no one else can get to anyway. Rvalues
    tend to appear to the right of an assignment, hence the name rvalue (right-value).std::move
    turns an lvalue into an rvalue and is the way we tell the type system that “this
    is fine, you can go ahead and move from this lvalue; I won’t be using it anymore.”
    With the introduction of std::move, it has become more common to see lvalues appear
    to the right of the assignment (inside a std::move), so the “left-value” vs. “right-value”
    mnemonic isn’t quite as useful as it used to be.See Lvalues, Rvalues, Glvalues,
    Prvalues, Xvalues, Help!^([[9]](#f_0036.xhtml_FOOTNOTE-9)) for a full overview
    of lvalues, rvalues, and the other value categories. |


    Note that even though we initialize moved from an rvalue, that doesn’t mean we
    need to use the move constructor to initialize it! We just need any constructor
    capable of binding to an rvalue. A const lvalue reference can bind to an rvalue,
    so a copy constructor could also have been used, if we had one. We don’t, however,
    so WillItMove’s move constructor is our only choice.


    WillItMove’s move constructor has been explicitly defaulted by the line WillItMove(WillItMove
    &&) = default;, so let’s turn our attention to what a defaulted move constructor
    does. How can it move from a const member?


    The explicitly defaulted move constructor direct-initializes all subobjects with
    the corresponding member from the source object. Essentially, it’s defined something
    like this:


    [examples/default-move/default-move.cpp](http://media.pragprog.com/titles/akbrain/code/examples/default-move/default-move.cpp)


    | ​  | Class(Class &&other) : |


    | ​  | BaseClass1{std::move(other)}, |


    | ​  | BaseClass2{std::move(other)}, |


    | ​  | ​*/* ... */*​ |


    | ​  | member1_{std::move(other).member1_}, |


    | ​  | member2_{std::move(other).member2_} |


    | ​  | ​*/* ... */*​ |


    | ​  | {} |


    So for our class WillItMove, it looks something like this:


    [examples/default-move/default-move.cpp](http://media.pragprog.com/titles/akbrain/code/examples/default-move/default-move.cpp)


    | ​  | WillItMove(WillItMove && other) : |


    | ​  | constMember_{std::move(other).constMember_}{} |


    Again, even if std::move(other).constMember_ is an rvalue, we don’t necessarily
    need to use a Member move constructor to initialize constMember_. Either a copy
    or a move constructor will do, as long as it can bind to std::move(other).constMember_.
    Since we haven’t declared any special member functions for Member, it implicitly
    gets both a defaulted copy constructor and a defaulted move constructor. Can one
    of those bind to the const rvalue other.constMember_?


    The implicitly defaulted move constructor for Member is declared like this:


    | ​  | Member(Member&&) |


    An rvalue reference to non-const cannot bind to the const rvalue, so we can’t
    use the move constructor to direct-initialize constMember_.


    The implicitly defaulted copy constructor for Member is declared like this:


    | ​  | Member(const Member&) |


    An lvalue reference to const can bind to a const rvalue, so we can use the copy
    constructor to direct-initialize constMember_.


    Thus, the explicitly defaulted move constructor for WillItMove uses Members copy
    constructor rather than Members move constructor to initialize constMember_.


