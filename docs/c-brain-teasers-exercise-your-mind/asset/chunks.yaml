  trans: "\n\n因此，`serialize` 函数中的 `sizeof(characters)` 打印的是指针的大小，而不是数组的大小，因为在此时 `characters`\
    \ 的类型实际上是“指向 char 的指针”。这是该谜题中由实现决定的的部分，因为标准并没有定义指针的大小。在大多数现代计算机上，指针是 64 位的，等于\
    \ 8 字节，因此在你的计算机上，你可能看到打印出 8。\n\n现在，我们是否也可以在这里使用似乎更强大的 `std::size` 函数模板，来获取数组中实际的元素数量呢？我们不能这样做，因为\
    \ `characters` 是一个指针而不是数组。`std::size` 只对具有 `.size()` 成员函数的集合（collections）和视图（views）以及数组进行了定义。`std::size(characters)`\
    \ 会导致编译失败，而不是给出错误的结果，这很不错。\n\n| 建议 |\n| --- |\n| ![images/aside-icons/tip.png](img/tip.png)\
    \ |  \n\n*   C++ 中的数组是非常局限的，当你将它们传递给函数时，尺寸等信息就会丢失。请优先使用 `std::vector` 或 `std::array`\
    \ 等类型。\n*   在你的项目中开启警告。GCC 和 Clang 都会对 `serialize` 中使用 `sizeof(characters)` 发出警告。GCC\
    \ 的信息如下：`warning: sizeof on array function parameter will return size of ’char\
    \ *’ instead of ’char[]'.`。（在编写时，我没能让 MSVC 对此给出警告。）\n\n### 进阶阅读\n\n`sizeof` 运算符\n\
    [`en.cppreference.com/w/cpp/language/sizeof`](https://en.cppreference.com/w/cpp/language/sizeof)\n\
    \n`std::size` 函数模板\n[`en.cppreference.com/w/cpp/header/std#size`](https://en.cppreference.com/w/cpp/header/std#size)\n\
    \n### 谜题 2：虚幻类（The Phantom）\n\n[`media.pragprog.com/titles/akbrain/code/the-phantom.cpp`](https://media.pragprog.com/titles/akbrain/code/the-phantom.cpp)\n\
    \n```cpp\n#include <iostream>\n#include <string>\n\nstruct GameObject {\n    GameObject()\
    \ {\n        std::cout << \"Created a GameObject\\n\";\n    }\n    virtual void\
    \ render() {\n        std::cout << \"Rendered a \" << getType() << \"\\n\";\n\
    \    }\n    virtual std::string getType() const {\n        return \"GameObject\"\
    ;\n    }\n};\n\nclass Spaceship : public GameObject {\npublic:\n    Spaceship()\
    \ {}\n    std::string getType() const override {\n        return \"Spaceship\"\
    ;\n    }\n};\n\nvoid display(const GameObject &obj) {\n    obj.render();\n}\n\n\
    int main() {\n    GameObject gameObject;\n    Spaceship spaceship;\n    display(gameObject);\n\
    \    display(spaceship);\n}\n```\n\n| 预测输出 |\n| --- |\n| ![images/aside-icons/tip.png](img/tip.png)\
    \ 程序的输出如下：\n\n```\nCreated a GameObject\nRendered a GameObject\nCreated a Spaceship\n\
    Rendered a Spaceship\n```\n\n### 讨论\n\n在这个谜题中，假设我们使用了虚函数来处理派生类。如果我们不使用虚函数，`sizeof`\
    \ 将返回数组的大小，但当我们将其传递给函数时，尺寸信息就会丢失。这就是为什么我们需要使用虚函数。\n\n但是，如果我们使用 `std::size` 呢？`std::size`\
    \ 只能用于数组或具有 `size()` 成员的容器。对于指针 `characters`，`std::size(characters)` 会导致编译错误，这比得到错误的结果要好。\n\
    \n如果我们使用的是模板方法模式（Template Method Pattern），我们可以通过纯虚函数让派生类来定义基类行为。在在这种情况下，`GameObject`\
    \ 是一个抽象类，无法实例化实例化。派生类来实现 `\n()`。\n"
- fmt: "\nIf we still want to be able to instantiate “raw” `GameObjects`, however,\
    \ we need to add back a default constructor:\n\n[examples/spaceship/spaceship-parameter.cpp](http://media.pragprog.com/titles/akbrain/code/examples/spaceship/spaceship-parameter.cpp)\n\
    \n```cpp\npublic:\n    GameObject() : GameObject(\"GameObject\")(){}\n```\n\n\
    This introduces a new problem, though: if you forget to add a user-defined constructor\
    \ for `Spaceship`, the defaulted `Spaceship` constructor will simply use the `GameObject`\
    \ default constructor, and we’re back to seeing `GameObject` created when creating\
    \ a `SpaceShip`—yet another reason to not allow `GameObjects to be independently\
    \ constructed.\n\nFinally, when the issue is how to use information from a derived\
    \ class in a base class without using dynamic polymorphism, no discussion is complete\
    \ without at least a mention of the Curiously Recurring Template Pattern (CRTP)\
    \ idiom. While we don’t have space for a detailed discussion here, the idea is\
    \ to make the base class a template and then use the derived class as a template\
    \ parameter for its own base class. Now the base class knows, statically even,\
    \ which derived class is being instantiated simply by looking at its template\
    \ parameter! Here’s a full example:\n\n[examples/spaceship/spaceship-crtp.cpp](http://media.pragprog.com/titles/akbrain/code/examples/spaceship/spaceship-crtp.cpp)\n\
    \n```cpp\n#include <iostream>\n\nstruct GameObject {\n    virtual void render()\
    \ const = 0;\n};\n\ntemplate<typename Derived>\nstruct LoggingGameObject : public\
    \ GameObject {\n    LoggingGameObject() {\n        std::cout << \"Created a \"\
    \ << Derived::typeName << \"\\n\";\n    }\n    void render() const override {\n\
    \        std::cout << \"Rendered a \" << Derived::typeName << \"\\n\";\n    }\n\
    };\n\nstruct Spaceship : public LoggingGameObject<Spaceship> {\n    static constexpr\
    \ auto typeName = \"Spaceship\";\n};\n\nvoid display(const GameObject &gameObject)\
    \ { gameObject.render(); }\n\nint main() {\n    Spaceship spaceship;\n    display(spaceship);\n\
    }\n```\n\nFor a more detailed discussion of CRTP, please see Wikipedia.^[15](#f_0036.xhtml_FOOTNOTE-15)\n\
    \n### Recommendations\n\n![images/aside-icons/tip.png](images/aside-icons/tip.png)\n\
    \n*   Enable warnings. Compilers like `GCC` and `Clang` can, for instance, warn\
    \ about calls to pure virtual functions in constructors and destructors.\n*  \
    \ Use several compilers and platforms in CI. Different compilers and linkers give\
    \ different warnings and errors.\n\n### Further Reading\n\nTemplate Method Design\
    \ Pattern\n[https://en.wikipedia.org/wiki/Template_method_pattern](https://en.wikipedia.org/wiki/Template_method_pattern)\n\
    \nCuriously Recurring Template Pattern (CRTP)\n[https://en.wikipedia.org/wiki/Curiously_recurring_template_pattern](https://en.wikipedia.org/wiki/Curiously_recurring_template_pattern)\n\
    \n### Puzzle 23 | Off to a Good Start\n\n[off-to-a-good-start.cpp](http://media.pragprog.com/titles/akbrain/code/off-to-a-good-start.cpp)\n\
    \n```cpp\n#include <iostream>\n\nstruct Logger {};\nstruct Configuration {};\n\
    \nLogger initializeLogger()\n{\n    std::cout << \"Initializing logger\\n\";\n\
    \    return Logger{};\n}\n\nConfiguration readConfiguration()\n{\n    std::cout\
    \ << \"Reading configuration\\n\";\n    return Configuration{};\n}\n\nvoid startProgram(Logger\
    \ logger, Configuration configuration)\n{\n    std::cout << \"Starting program\\\
    n\";\n}\n\nint main()\n{\n    startProgram(initializeLogger(), readConfiguration());\n\
    }\n```\n\n### Guess the Output\n\n![images/aside-icons/important.png](images/aside-icons/important.png)\
    \ Try to guess what the output is before moving to the next page.\n\nThe program\
    \ has unspecified behavior! But it will display one of two outputs. This is one\
    \ possible output:\n\n```\nInitializing logger\nReading configuration\nStarting\
    \ program\n```\n\nAnd here’s the other:\n\n```\nReading configuration\nInitializing\
    \ logger\nStarting program\n```\n\n### Discussion\n\nIn this puzzle, we want to\
    \ start a program that relies on a logger having been set up and a configuration\
    \ having been read. As long as both of those are done before the program starts,\
    \ we’re good. The order in which the logger is set up and the configuration is\
    \ read doesn’t seem to matter here, but what if it did? What if, for instance,\
    \ initializing the logger sets up some global logger instance that we use while\
    \ reading the configuration? Can we rely on the two functions being called in\
    \ the order listed in the program? Unfortunately, we can’t since the evaluation\
    \ order of function argument expressions is unspecified. This is not only theoretical;\
    \ when I tested this on Linux, `GCC` went right-to-left and `Clang` left-to-right.\
    \ You can see an online demo at Compiler Explorer.^[16](#f_0036.xhtml_FOOTNOTE-16)\n\
    \nAll is not chaos, however; we do have a few guarantees:\n\n1.  Initialization\
    \ of parameters, including all associated side effects, is guaranteed to have\
    \ finished before the function starts executing. This guarantees that `initializeLogger`\
    \ and `readConfiguration` have finished executing before `startProgram` starts\
    \ executing, and we don’t, for instance, risk the output `Initializing logger`\
    \ being interleaved with `Starting program`. It sounds obvious, but hey, this\
    \ is `C++`, so it is good to check.\n2.  Initialization of one parameter, including\
    \ all associated side effects, is guaranteed to have finished before the initialization\
    \ of another parameter starts. This guarantees that either `initializeLogger`\
    \ happens entirely before `readConfiguration` or vice versa.\n3.  There is no\
    \ undefined behavior here; it’s just that the argument expressions can be evaluated\
    \ in either order.\n\nWe know that both `initializeLogger` and `readConfiguration`\
    \ happen before `startProgram`, just not in which order. Furthermore, we’re not\
    \ even guaranteed that they happen in the same order each time we run the program,\
    \ even using the same compiler and the same computer! It’s unlikely that a compiler\
    \ would generate code where this is non-deterministic, but it would be okay according\
    \ to the standard. It’s also possible for a compiler to change the ordering in\
    \ a new version of the compiler if the implementer decides, for instance, that\
    \ right-to-left is now more efficient than left-to-right.\n\nWhat can we do about\
    \ this then? If the ordering is actually important, you can simply call the functions\
    \ one after the other in the order you desire:\n\n[examples/deterministic-order/deterministic-order.cpp](http://media.pragprog.com/titles/akbrain/code/examples/deterministic-order/deterministic-order.cpp)\n\
    \n```cpp\nint main()\n{\n    const auto logger = initializeLogger();\n    const\
    \ auto configuration = readConfiguration();\n    startProgram(logger, configuration);\n\
    }\n```\n\nNote that this is not something compilers can warn about. Without some\
    \ magical ability to know the semantics of your entire program, there’s no way\
    \ for the compiler to know whether the evaluation order of certain function parameters\
    \ matters to your program.\n\n### Recommendations\n\n*   Don’t rely on the order\
    \ of evaluation of function argument expressions.\n"
  raw: "If we still want to be able to instantiate “raw” GameObjects, however, we\
    \ need to add back a default constructor:\n\n[examples/spaceship/spaceship-parameter.cpp](http://media.pragprog.com/titles/akbrain/code/examples/spaceship/spaceship-parameter.cpp)\n\
    \n| ​  | public: |\n\n| ​  | GameObject() : GameObject(​*\"GameObject\"*​){} |\n\
    \nThis introduces a new problem, though: if you forget to add a user-defined constructor\
    \ for Spaceship, the defaulted Spaceship constructor will simply use the GameObject\
    \ default constructor, and we’re back to seeing GameObject created when creating\
    \ a SpaceShip—yet another reason to not allow GameObjects to be independently\
    \ constructed.\n\nFinally, when the issue is how to use information from a derived\
    \ class in a base class without using dynamic polymorphism, no discussion is complete\
    \ without at least a mention of the Curiously Recurring Template Pattern (CRTP)\
    \ idiom. While we don’t have space for a detailed discussion here, the idea is\
    \ to make the base class a template and then use the derived class as a template\
    \ parameter for its own base class. Now the base class knows, statically even,\
    \ which derived class is being instantiated simply by looking at its template\
    \ parameter! Here’s a full example:\n\n[examples/spaceship/spaceship-crtp.cpp](http://media.pragprog.com/titles/akbrain/code/examples/spaceship/spaceship-crtp.cpp)\n\
    \n| ​  | ​*#include <iostream>*​ |\n\n| ​  |  |\n\n| ​  | ​**struct**​ GameObject\
    \ { |\n\n| ​  | ​**virtual**​ ​**void**​ render() ​**const**​ = 0; |\n\n| ​  |\
    \ }; |\n\n| ​  |  |\n\n| ​  | ​**template**​<​**typename**​ Derived> |\n\n| ​ \
    \ | ​**struct**​ LoggingGameObject : ​**public**​ GameObject { |\n\n| ​  | LoggingGameObject()\
    \ { |\n\n| ​  | std::cout << ​*\"Created a \"*​ << Derived::typeName << ​*\"*​​*\\\
    n*​​*\"*​; |\n\n| ​  | } |\n\n| ​  | ​**void**​ render() ​**const**​ ​**override**​\
