    # 《C++ 脑筋题集》早期好评


    如果你是 C++ 爱好者或专业的 C++ 开发者——希望两者兼顾——这本书就是为你准备的。二十五个谜题用通俗 C++ 解释了该语言有时令人惊讶的行为，以及为了避开潜在的陷阱和失望你可能需要的知识。


    | → | Daniela Engert |


    |  | ISO C++ 委员会成员及主旨演讲者 |


    缺乏经验的程序员将以轻松的方式学习 C++ 编程语言中的许多陷阱以及如何避免它们。对要规避什么已有直觉的老深老兵将非常详细地学习该语言的工作原理以及原因。


    | → | Björn Fahller |


    |  | 国际 C++ 大会演讲者 |


    对于任何想要测试自己 C++ 知识的人来说，这是一本有趣且迷人的谜题集。谜题很有趣，解释也很容易。


    | → | Tina Ulbrich |


    |  | 国际 C++ 大会演讲者 |


    # Olve Maudal 前序


    很久以前我在奥斯陆当地的 C++ 聚会上第一次见到 Anders Schau Knatten。从那时起，我们一直是会议相遇时聚在一起的朋友。Anders 曾在许多专注于
    C++ 的会议上进行过演讲，如 ACCU、NDC TechTown、CppCon、C++ on Sea 和 Meeting C++ 等。当我参加他的演讲时，我总能学到新东西。Anders
    可以花几个小时讲述整数的真实行为，或者在 `main()` 调用之前发生的所有事情，或者如何有效地使用调试器。他还有这种迷人的能力：观察某些事物，调整它，重塑它，然后将其推向高度。这正是他在参加了我的几次著名的
    C++ 公益问答活动后所做的。Anders 很快就创建了优秀的网站 `cppquiz.org`([[1]](#f_0004.xhtml_FOOTNOTE-1))（试试看！）。现在他在会议上运行他自己改进版的
    C++ 公益问答活动。通过这本书，Anders 将自己的理念推向了更远。


    我热爱书籍，热爱 C++，也热爱谜题。《C++ 脑筋题集》将这三者结合在了一起。我已经使用并学习 C++ 超过 30 年，但我确定我会反复阅读，每次都能学到新东西。如果你深投入
    C++，你也会想读它。这本书是深入理解这种极其强大且迷人的编程语言的快速通道。书中包含 25 个精心挑选的 C++ 谜题，将挑战你对该语言的现有理解。当你尝试自己解决谜题后，Anders
    将给你一个深入且坚实的解释，说明为什么这个谜题有趣，以及你如何学会推理这些问题。


    你可以用 C++ 编写优美的程序，但也完全可能搞砸。重要的是理解 C++ 之所以是这样，是因为它从 BCPL、C、Simula 67 和 Algol 68
    演变而来。C++ 之所以是这样，是因为该语言在早期形成阶段就被迅速采用，并且已经拥有数百万活跃用户。C++ 之所以是这样，是因为它信任程序员并专注于解决现实问题。是的，C++
    是复杂的，也许太复杂了，但它确实是许多领域的首选语言（双关语！）例如操作系统、嵌入式系统、高性能计算、性能关键型应用、视频游戏和太空探测器。事实上，这里有
    Bjarne Stroustrup（C++ 之父）的一句非常有见地的引言：


    > 语言只有两种：人们抱怨的语言和没人使用的语言。


    祝你在通往深入理解 C++ 的旅程中一切顺利。这次 Anders 将是你的指南。玩得愉快！


    Olve Maudal 国际 C 和 C++ 演讲者、培训师及会议组织者 2024 年 6 月


