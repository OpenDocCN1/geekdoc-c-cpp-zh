  trans: "\n\n让我们看看常规算术转换对我们的表达式 `char1 + char2` 做了什么。由于两个操作数都是整数类型，对它们都会执行一个被称为“整数提升”（integral\
    \ promotions）的过程。该思想是在执行算术表达式之前，将较小的整数类型转换为 `int` 或 `unsigned int`。在转换了两个操作数后，我们现在可以使用普通的\
    \ `int` 或 `unsigned int` 加法来相加它们，并得到 `int` 或 `unsigned int` 结果。\n\n提升较小整数类型的规则是：如果\
    \ `int` 能够表示较小类型的所有值，则它可以转换为 `int`；否则，它可以被转换为 `unsigned int`。`char` 能够放入 `int`\
    \ 中吗？通常是可以的，但这取决于具体实现。（我告诉过你，这是一个悲惨的故事。）\n\n这里的一个复杂化因素是，C++ 中基本类型的大小不是固定的。实现可以决定\
    \ `int` 是 16 位或 64 位，甚至认为 `char` 和 `long` 的大小相同。唯一的规则是这些：\n\n* `signed char`、`short`、`int`、`long`\
    \ 和 `long long` 中的每一个类型都至少与列表中前一个类型一样大。\n* 对于列表中的每种类型，都存在一个无符号版本，其大小与符号版本相同。\n\
    \n还定义了一些最小尺寸：\n\n| 类型 | 最小宽度 |\n| --- | --- |\n| signed char | 8 |\n| short |\
    \ 16 |\n| int | 16 |\n| long | 32 |\n| long long | 64 |\n\n在典型的 64 位 Linux、Windows\
    \ 或 macOS 系统上，`int` 是 32 位，而 `long` 在 Linux/macOS 上是 64 位，在 Windows 上是 32 位。但一个符合标准的实现也可以同样地决定所有整数类型都是\
    \ 64 位。\n\n在这个谜途中，我们特别关注 `char`，但 `char` 奇奇地没有出现在上述所有列表中。这是怎么了？`char` 有点特殊，因为实现可以选择由\
    \ `signed char` 还是 `unsigned char` 来支持它。无论哪种情况，`char` 是一个不同的类型。因此，`char`、`signed\
    \ char` 和 `unsigned char` 实际上是三种不同的类型，而普通的 `char` 是否有符号是取决于实现定义的！\n\n记住，我们感兴趣的是\
    \ `char` 中的所有值是否都能放入 `int` 中，以确定我们的 char 会被转换为 `int` 还是 `unsigned int`。通常情况下它们都能放入，所以\
    \ `char1 + char2` 的两个操作数都会被转换为 `int`，结果也将是 `int`。\n\n但假设实现选择了 `char` 和 `int` 都是\
    \ 16 位。再假设实现选择了 `char` 是无符号的。那么 `int` 的范围是 `-2^(16-1)` 到 `2^(16-1)-1`，即 `-32768`\
    \ 到 `32767`（包含边界）。`char` 的范围是 `0` 到 `2¹⁶-1`，即 `0` 到 `65535`（包含边界）。这意味着，一半的 char\
    \ 无法放入 `int` 中！在这些系统上，`char1 + char2` 的操作数将会被提升为 `unsigned int`，结果也将是 `unsigned\
    \ int`。\n\n因此，`char1 + char2` 的类型可以是 `int` 也可以是 `unsigned int`。我们唯一确定的是它不是 `char`。\n\
    \n### 延伸阅读\n\n* 常规算术混惑：[`shafik.github.io/c++/2021/12/30/usual_arithmetic_confusions.html`](https://shafik.github.io/c++/2021/12/30/usual_arithmetic_confusions.html)\n\
    * 64 位数据模型：[`en.wikipedia.org/wiki/64-bit_computing#64-bit_data_models`](https://en.wikipedia.org/wiki/64-bit_computing#64-bit_data_models)\n\
    * 基本类型：[`timsong-cpp.github.io/cppwp/std20/basic.fundamental`](https://timsong-cpp.github.io/cppwp/std20/basic.fundamental)\n\
    * 常规算术转换：[`timsong-cpp.github.io/cppwp/std20/expr.arith.conv`](https://timsong-cpp.github.io/cppwp/std20/expr.arith.conv)\n\
    * 整数提升：[`timsong-cpp.github.io/cppwp/std20/conv.prom`](https://timsong-cpp.github.io/cppwp/std20/conv.prom)\n\
    \n### 谜题 15 | 来自来自未来\n\n[back-from-the-future.cpp](http://media.pragprog.com/titles/akbrain/code/back-from-the-future.cpp)\n\
    \n```cpp\n#include <future>\n#include <iostream>\n\nint main() {\n    char counter\
    \ = 0;\n    auto future1 = std::async(std::launch::async, [&]() {\n        counter++;\n\
    \    });\n    auto future2 = std::async(std::launch::async, [&]() {\n        return\
    \ counter;\n    });\n\n    future1.wait();\n    // 强制转换为 int 以作为数值值而不是字符打印\n \
    \   std::cout << (int)future2.get();\n}\n```\n\n在移动到下一页之前，尝试猜猜输出是什么。\n\n该程序具有未定义行为（undefined\
    \ behavior）！重要的是，答案并不是“ 0 或 1”。\n\n### 讨论\n\n当两个未同步的线程访问同一个内存位置，且这些访问中至少有一个修改操作时，我们就发生了数据竞态（data\
    \ race）。这个程序启动了两个线程，一个修改 `counter`，另一个读取它。由于我们没有努力同步这两个线程，该程序存在数据竞态。\n\n如果你在你的机器上运行这个程序，你很可能会看到\
    \ 0 或 1，取决于哪个线程先到达 `counter`。`counter` 是单字节的，所以你不可能看到（例如）任何写入了一半的值。`counter++`\
    \ 操作要么在第二个线程读取 `counter` 之前完全发生，要么在它之后完全发生。但这并不意味着你可以依赖此来实现某种“最终一致性”的逻辑！数据竞态会导致未定义行为，因此任何事情都可能发生。记住我们在序言中讨论过的——魔鬼可能会从你的鼻子里飞出来。不要尝试对未定义行为下的情况进行推理或测试。你的程序可能看起来运行正常，但在编译器升级后在另一个系统上崩溃，或者每运行一百万次就会崩溃。\n\
    \n为了让这些线程安全地访问 `counter`，需要某种同步机制。经典的解决方案是用 `mutex` 保护 `counter`，但这很繁琐而且还引入了锁。锁可能是慢的，有锁的地方就可能死锁。更好的方法是使用原子变量（atomic），如下：\n\
    \n[examples/std_atomic/std_atomic.cpp](http://media.pragprog.com/titles/akbrain/code/examples/std_atomic/std_atomic.cpp)\n\
    \n```cpp\nstd::atomic<char> counter = 0;\nauto future1 = std::async(std::launch::async,\
    \ [&]() {\n    counter++;\n});\nauto future2 = std::async(std::launch::async,\
    \ [&]() {\n    return counter.load();\n});\n```\n\n使用 `std::atomic` 代替 `mutex`\
    \ 可以使代码更简单，避免引入 `mutex` 额外的变量，确保我们不会忘记锁定 `mutex`，并且可能使代码无锁化（lock-free）。\n\n###\
    \ 无锁原子操作\n\n`std::atomic<char>` 是否无锁取决于实现，但它通常是无锁的。你可以通过 `std::atomic` 类模板的 `is_lock_free`\
    \ / `is_always_lock_free` 成员在你的系统上检查：[examples/std_atomic/std_atomic.cpp](http://media.pragprog.com/titles/akbrain/code/examples/std_atomic/std_atomic.cpp)\n\
    \n```cpp\nstatic_assert(counter.is_always_lock_free());\nassert(counter.is_lock_free());\n\
    ```\n\n* 如果对于给定的 `T` `std::atomic<T>` 总是无锁的，则 `is_always_lock_free` 为真。这是一个 `static\
    \ constexpr` 成员，可以在编译时检查。\n* 如果 `std::atomic<T>` 的特定实例无锁的，则 `is_lock_free()` 为真，即使\
    \ `is_always_lock_free` 为假它也可能为真。某些原子变量例如可能只有在对齐时才是无锁的。这只能在运行时检查。\n\n在我的 M1 Macbook\
    \ 和 x86_64 Linux 机器上，`int`、`long` 和 `double` 的 `std::atomic` 都是始终无锁的。\n\n"
- fmt: "\nA great tool to detect data races is the free `ThreadSanitizer`. It’s one\
    \ of many sanitizers that ship with LLVM, and it’s enabled by simply passing the\
    \ `-fsanitize=thread` compiler option and then running your program. It will tell\
    \ you something like this for this puzzle:\n\n```text\n| ​  | WARNING: ThreadSanitizer:\
    \ data race (pid=2735) |\n| ​  | Read of size 1 at 0x7ffed85a35cf by thread T2:\
    \ |\n| ​  | (... stack trace ...) |\n| ​  |  |\n| ​  | Previous write of size\
    \ 1 at 0x7ffed85a35cf by thread T1: |\n| ​  | (... stack trace ...) |\n| ​  |\
    \  |\n| ​  | Location is stack of main thread. |\n| ​  |  |\n| ​  | Location is\
    \ global '??' at 0x7ffed8584000 ([stack]+0x1f5cf) |\n| ​  |  |\n| ​  | Thread\
    \ T2 (tid=2738, running) created by main thread at: |\n| ​  | (... stack trace\
    \ ...) |\n| ​  |  |\n| ​  | Thread T1 (tid=2737, finished) created by main thread\
    \ at: |\n| ​  | (... stack trace ...) |\n```\n\nAs you can see, it not only tells\
    \ you that there was a data race, but also tells you where the variable is, the\
    \ stack traces to the code that read and wrote it, and the stack traces to where\
    \ the threads were created. Pretty useful stuff!\n\n| Recommendations |\n| ---\
    \ |\n| ![images/aside-icons/tip.png](images/aside-icons/tip.png) |  \n\n- Always\
    \ synchronize accesses to shared variables if at least one of them is a write.\n\
    - `std::atomic` is often a great choice for simple synchronization of values.\n\
    - Use sanitizers.\n\n| |\n\n### Further Reading\n\n`std::async`\n[https://en.cppreference.com/w/cpp/thread/async](https://en.cppreference.com/w/cpp/thread/async)\n\
    \n`std::atomic`\n[https://en.cppreference.com/w/cpp/atomic/atomic](https://en.cppreference.com/w/cpp/atomic/atomic)\n\
    \nDefinition of Data Races in the C++ Standard\n[https://timsong-cpp.github.io/cppwp/std20/intro.races](https://timsong-cpp.github.io/cppwp/std20/intro.races)\n\
    \n`ThreadSanitizer`\n[https://clang.llvm.org/docs/ThreadSanitizer.html](https://clang.llvm.org/docs/ThreadSanitizer.html)\n\
    \n### Puzzle 16: An Overloaded Container\n\nReference to source: `[an-overloaded-container.cpp](http://media.pragprog.com/titles/akbrain/code/an-overloaded-container.cpp)`\n\
    \n```cpp\n#include <initializer_list>\n#include <iostream>\nstruct Container {\n\
    \    Container(int, int) {\n        std::cout << \"Two ints\\n\";\n    }\n   \
    \ Container(std::initializer_list<float>) {\n        std::cout << \"std::initializer_list<float>\\\
    n\";\n    }\n};\n\nint main() {\n    Container container1(1, 2);\n    Container\
    \ container2{1, 2};\n}\n```\n\n| Guess the Output |\n| --- |\n| ![images/aside-icons/important.png](images/aside-icons/important.png)\
    \ | Try to guess what the output is before moving to the next page. |\n\nThe program\
    \ displays the following output:\n```text\nTwo ints\nstd::initializer_list<float>\n\
    ```\n\nBonus question: what would happen if we removed the `initializer_list`\
    \ constructor? Would it still compile?\n\n### Discussion\n\nThe `struct Container`\
    \ has two constructors, one taking two ints and one taking a `std::initializer_list<float>`.\
    \ Two objects of type `Container` are constructed, both with two ints as arguments.\
    \ But the one difference is that one object is constructed using parentheses `(1,2)`\
    \ and the other using curly braces `{1,2}`. Which constructor is called in each\
    \ case?\n\nFor `Container container1(1, 2)`, overload resolution unsurprisingly\
    \ chooses the constructor taking two ints.\n\nFor `Container container2{1, 2}`,\
    \ overload resolution chooses the constructor taking a `std::initialization<float>`,\
    \ even though we passed it two ints! Does this mean `{1,2}` is a `std::initializer_list`\
    \ then? No, `{1,2}` isn’t a `std::initializer_list<int>` but an expression called\
    \ a `braced-init-list`. A `braced-init-list` is a pair of curly braces containing\
    \ zero or more elements. These can occur in several contexts; the most common\
    \ is for initialization. Here are some examples of `braced-init-lists` used for\
    \ initialization:\n\nReference to source: `[examples/braced-init-list/braced-init-list.cpp](http://media.pragprog.com/titles/akbrain/code/examples/braced-init-list/braced-init-list.cpp)`\n\
    \n```cpp\nstd::array<int, 3> a{1, 2, 3};\nint i{2};\nint j{};\nf({1, 2});\nstd::map<int,\
    \ std::string>{{1, \"one\"}, {2, \"two\"}};\nreturn {1, 2};\n```\n\nAs we can\
    \ see from the initialization of `i` and `j`, even if there’s zero or one element\
    \ and not a “list” of items between the curly-braces, the expression is still\
    \ called a `braced-init-list`.\n\nInitialization from a `braced-init-list` is\
    \ called `list-initialization`, and the `braced-init-list` is unfortunately called\
    \ an `initializer list` in these contexts. An `initializer list` is not the same\
    \ as the class template `std::initializer_list<T>`. The names are rather confusing.\n\
    \nSo if `{1,2}` isn’t a `std::initializer_list`, why does it pick the `std::initializer_list`\
    \ constructor? Overload resolution has a special case for `list-initialization`\
    \ where it happens in two phases:\n\n- First, it does overload resolution for\
    \ all constructors taking a `std::initializer_list`, treating the `braced-init-list`\
    \ as one single argument.\n- Then, and only if the first phase didn’t succeed,\
    \ it does overload resolution for the other constructors, treating the elements\
    \ of the `braced-init-list` as separate arguments.\n\nSo in the case of `Container\
    \ container2{1, 2}`, overload resolution first tries the `std::initializer_list<float>`\
    \ constructor. An `int` can be implicitly converted to a `float`, and similarly,\
    \ an initializer list of `int` can be used to create a `std::initializer_list<float>`.\
    \ So the `std::initializer_list<float>` constructor is chosen, and the other constructor\
    \ is never even considered.\n\nNow to the bonus question: what happens if we remove\
    \ the `std::initializer_list<float>` constructor? For `Container container1(1,\
    \ 2)`, there’s no change since this is not `list-initialization`. For `Container\
    \ container2{1, 2}`, overload resolution doesn’t find any constructors taking\
    \ a `std::initializer_list` in the first phase and moves on to the other constructor.\
    \ The constructor taking two ints is used in both cases, and the program still\
    \ compiles.\n\n| std::vector |\n| --- |\n| ![images/aside-icons/note.png](images/aside-icons/note.png)\
    \ | If you have ever wondered why `std::vector<int> v(1,2)` gives you a vector\
    \ with a single element, 2, but `std::vector<int> v{1,2}` gives you a vector with\
    \ two elements, 1 and 2, now you know why. |\n\n- The first case is not `list-initialization`,\
    \ and it picks the constructor taking `size_type` and `T`.\n- The second case\
    \ is `list-initialization`, and it picks the constructor taking `std::initializer_list<T>`.\n\
    \n### Further Reading\n\nList-Initialization\n[https://en.cppreference.com/w/cpp/language/list_initialization](https://en.cppreference.com/w/cpp/language/list_initialization)\n\
    \n`std::initializer_list`\n[https://en.cppreference.com/w/cpp/utility/initializer_list](https://en.cppreference.com/w/cpp/utility/initializer_list)\n\
    \n`std::vector` Constructors\n[https://en.cppreference.com/w/cpp/container/vector/vector](https://en.cppreference.com/w/cpp/container/vector/vector)\n\
    \n### Puzzle 17: A Strong Point\n\nReference to source: `[a-strong-point.cpp](http://media.pragprog.com/titles/akbrain/code/a-strong-point.cpp)`\n\
    \n```cpp\n#include <iostream>\nstruct Points {\n    Points(int value) : value_(value)\
    \ {}\n    int value_;\n};\n\nstruct Player {\n    explicit Player(Points points)\
    \ : points_(points) {}\n    Points points_;\n};\n\nint main() {\n    Player player(3);\n\
    \    std::cout << player.points_.value_;\n}\n```\n\n| Guess the Output |\n| ---\
    \ |\n"
