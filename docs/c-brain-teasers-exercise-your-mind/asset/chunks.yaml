    ![images/hline.png](images/hline.png)


    ### Discussion


    When we call draw, the program only prints Button draw. But when the unique_ptr
    goes out of scope and the destructor is called, the program prints both Button
    destructor and Widget destructor. Why is that?


    A common technique for dynamic polymorphism is using virtual functions. You declare
    a class with one or more functions marked as virtual, allowing other classes to
    override those functions. When you then call a virtual function on a base class
    pointer pointing to an object of a derived class, the object’s dynamic type is
    used, and the overridden function is called instead.


    In this example, imagine a UI framework with a Widget class with some common behavior
    and concrete UI elements like Button, Text, and Image, which override the drawing
    behavior in the virtual draw function.


    When we call draw on the base class pointer to Widget, which is actually pointing
    to a derived class Button, Button::draw is called instead of Widget::draw, and
    Button draw is printed. However, for the destructor, the behavior is different;
    we can see that it first prints Button destructor and then also prints Widget
    destructor. What’s going on?


    When an object is destroyed, all parts of it have to be destroyed. In this case,
    Button inherits from Widget, so each Button object consists of a Widget object
    in addition to any members from Button (none, in this case). We say that Button
    has a Widget subobject. If Button had a member of type Widget instead of inheriting
    from it, it would also have a Widget subobject. In either case, the subobjects
    must also be destroyed when the complete object is destroyed to avoid resource
    leaks. Luckily, C++ handles this for us; we don’t need to manually call the Widget
    destructor from the Button destructor.'
