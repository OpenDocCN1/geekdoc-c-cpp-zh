    | ​  | ​*#include <iostream>*​ |


    | ​  |  |


    | ​  | ​**struct**​ Degrees |


    | ​  | { |


    | ​  | Degrees() : degrees_(0) |


    | ​  | { |


    | ​  | std::cout << ​*"Default constructed*​​*\n*​​*"*​; |


    | ​  | } |


    | ​  | Degrees(​**double**​ degrees) : degrees_(degrees) |


    | ​  | { |


    | ​  | std::cout << ​*"Constructed with "*​ << degrees_ << ​*"*​​*\n*​​*"*​; |


    | ​  | } |


    | ​  | ​**double**​ degrees_; |


    | ​  | }; |


    | ​  |  |


    | ​  | ​**struct**​ Position |


    | ​  | { |


    | ​  | Position() : latitude_{1} { longitude_ = Degrees{2}; } |


    | ​  | Degrees latitude_; |


    | ​  | Degrees longitude_; |


    | ​  | }; |


    | ​  |  |


    | ​  | ​**int**​ ​**main**​() |


    | ​  | { |


    | ​  | Position position; |


    | ​  | } |


    | Guess the Output |


    | --- |


    | ![images/aside-icons/important.png](images/aside-icons/important.png) | Try
    to guess what the output is before moving to the next page. |


    ![images/hline.png](images/hline.png)


    The program displays the following output:


    | ​  | Constructed with 1 |


    | ​  | Default constructed |


    | ​  | Constructed with 2 |


    ![images/hline.png](images/hline.png)


    ### Discussion


    The struct Position has two members of type Degrees. One is initialized in the
    member initializer list, and one in the constructor body. So why do we see three
    Degrees objects being constructed?


    All class members are initialized before we get to the constructor body. If you
    explicitly initialize the member, as we do for latitude_, that’s the initialization
    that’ll be used. If you don’t, as is the case for longitude_, the member will
    instead be default-initialized, which is why we see the line Default constructed
    being printed. After all members have been initialized, we finally enter the constructor
    body, initialize a temporary Degrees{2}, and then copy-assign it to the previously
    default-initialized longitude_.


    Note that instead of explicitly initializing the member in the member initializer
    list, you can use a default member initializer directly in the member declaration,
    like so:


    [examples/default-member-initializer/default-member-initializer.cpp](http://media.pragprog.com/titles/akbrain/code/examples/default-member-initializer/default-member-initializer.cpp)


    | ​  | ​**struct**​ Position |


    | ​  | { |


    | ​  | Position() { longitude = Degrees{2}; } |


    | ​  | Degrees latitude{1}; ​*// Default member initializer*​ |


    | ​  | Degrees longitude; |


    | ​  | }; |


    Using a default member initializer can be a good idea if you have several constructors.
    Then you don’t have to remember to include that member in every member initializer
    list.


    ### Further Reading


    Constructors and Member Initializer Lists


    [https://en.cppreference.com/w/cpp/language/constructor](https://en.cppreference.com/w/cpp/language/constructor)


    | Puzzle 2 | String Theory |


    [string-theory.cpp](http://media.pragprog.com/titles/akbrain/code/string-theory.cpp)


    | ​  | ​*#include <iostream>*​ |


    | ​  | ​*#include <string>*​ |


    | ​  |  |


    | ​  | ​**void**​ ​**serialize**​(​**const**​ ​**void**​*) { std::cout << ​*"const
    void*"*​; } |


    | ​  |  |


    | ​  | ​**void**​ ​**serialize**​(​**const**​ std::string&) { std::cout << ​*"const
    string&"*​; } |


    | ​  |  |


    | ​  | ​**int**​ ​**main**​() |


    | ​  | { |


    | ​  | serialize(​*"hello world"*​); |


    | ​  | } |


    | Guess the Output |


    | --- |


    | ![images/aside-icons/important.png](images/aside-icons/important.png) | Try
    to guess what the output is before moving to the next page. |


    ![images/hline.png](images/hline.png)


    The program displays the following output:


    | ​  | const void* |


    ![images/hline.png](images/hline.png)


    ### Discussion


    Why does passing a string to serialize cause the overload taking a void pointer
    to be called rather than the overload taking a string?


    When we’re calling a function with multiple overloads, the compiler uses a process
    called overload resolution to figure out which one is the best fit. The compiler
    does this by attempting to convert each function argument to the corresponding
    parameter type for each overload. Some conversions are better than others, and
    the best conversion is if the argument is already of the correct type.


    All the overloads where all arguments can be successfully converted are added
    to a set of viable functions. Then the compiler needs to figure out which overload
    to select from this set. If an overload has a better conversion for at least one
    argument and not a worse one for any of the other arguments, this overload is
    deemed to be the best viable function and is selected by overload resolution.
    If no overload is better than all the others, the call is ill-formed and fails
    to compile.


    Have a look at this example:


    | ​  | serialize(​**int**​, ​**int**​); ​*// 1*​ |


    | ​  |  |


    | ​  | serialize(​**float**​, ​**int**​); ​*// 2*​ |


    Given these two overloads, suppose you call serialize like this:


    | ​  | serialize(1, 2); |


    Both overloads of serialize are viable. But the first overload has a better conversion
    for the first argument (int → int is better than int → float) and not a worse
    conversion for the second argument (int → int for both overloads), so it is selected
    by overload resolution as the best viable function.


    The puzzle is a bit simpler than this example since both overloads of serialize
    only have one parameter. The first takes a const void * and the second takes a
    const std::string&. What does the conversion look like for each of the overloads?


    std::string is a class in the standard library. It’ll typically allocate memory
    on the heap (unless the string is very small) and allows the string to grow or
    be otherwise modified at runtime.


    However, the string "hello world" is not a std::string but a simple string literal.
    String literals are plain C-style arrays of chars which get baked into your binary
    by the linker and cannot be modified at runtime. A string literal has the type
    “array of n const char.” "hello world" has 11 characters plus a terminating \0,
    so its type is “array of 12 const char.”


    Since the argument "hello world" is neither a const void* nor a std::string but
    an “array of 12 const char,” a conversion is needed for both overloads. If an
    implicit conversion exists from the argument to the parameter type, that overload
    is added to the set of viable functions. Otherwise, the overload is ignored.


    Let’s examine the first overload and see if “array of 12 const char” can be implicitly
    converted to const void *. The first thing that happens is that the array gets
    converted to a pointer. Any “array of N T” can be converted to a “pointer to T”
    pointing to the first element. So now our “array of 12 const char” has turned
    into a “pointer to const char.’’


    Next, any “pointer to cv T” (where cv means const, volatile, const volatile, or
    none of these) can be converted to “pointer to cv void.” So now our “pointer to
    const char” has turned into a “pointer to const void,” which is exactly what the
    first overload expects.'
