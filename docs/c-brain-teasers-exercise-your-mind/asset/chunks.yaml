    \ ​**int**​ ​**main**​() |\n\n| ​  | { |\n\n| ​  | startProgram(initializeLogger(),\
    \ readConfiguration()); |\n\n| ​  | } |\n\n| Guess the Output |\n\n| --- |\n\n\
    | ![images/aside-icons/important.png](images/aside-icons/important.png) | Try\
