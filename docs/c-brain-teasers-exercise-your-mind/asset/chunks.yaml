  trans: "\n\n\n```cpp\nint main()\n{\n  std::cout << id;\n}\n```\n\n## 预测输出\n\n![images/aside-icons/important.png](img/important.png)\
    \ 在移动到下一页之前，尝试猜一下输出是什么。\n\n![images/hline.png](img/hline.png)\n\n程序显示以下输出：\n\n\
    0\n\n![images/hline.png](img/hline.png)\n\n### 讨论\n\n这个谜题看起来和谜题 3，谜题 3，入侵星球！ 相似；它们都使用了未初始化变量\
    \ `id` 的值。然而，与谜题 3 不同，这不是未定义行为，程序打印了 0。这是为什么？\n\n区别在于谜题 3 中的 `id` 是局部变量，它们在每次函数被调用时产生并销毁。它们被认为具有自动存储生存期。而这个谜题中的\
    \ `id` 是一个全局变量。更准确地说，`id` 是一个具有静态存储生存期的非局部变量；也就是说，`id` 的生命周期贯穿整个程序运行期间。\n\n与具有自动存储生存期的变量不同，具有静态存储生存期的变量是在程序启动时初始化的。对于没有初始化器的\
    \ `int` 这种简单情况，它会被零初始化。如果 `id` 有一个初始化器，例如 `int id = 2;`，那么我们会说它被常量初始化为 2。（零初始化和常量初始化的统称为静态初始化。）\n\
    \n为什么具有静态存储生存期且没有初始化器的变量会被初始化为零，而具有自动存储生存期的变量不是？在通常情况下，初始化变量并不是免费的。需要某些代码来执行该初始化。例如，如果你在函数中定义一个局部变量\
    \ `int id = 0;`，大多数系统在每次调用该函数时都需要产生一些代码将其设置为零。C++ 无法保证这种操作是免费或代价微乎其微，而 C++ 的设计目标之一就是为你不使用的东西付费。因此，如果你决定省略初始化器并仅定义\
    \ `int id;`，C++ 就不会让你付出那个代价。\n\n局部变量和非局部变量的另一个区别是作用域。局部变量只能在定义它的块中被访问。而非局部变量可以从文件的任何地方访问，或者如果它在头文件中声明，则可以在包含该头文件的整个程序的任何地方访问。所以，如果你省略了局部变量的初始化器，你对它下一次在何处使用有完美的控制。你可能没有给它初始化，是因为你会在接下来的一两行代码中初始化它。但如果你省略了非局部变量的初始化器，想要推理下一步谁会访问它就会困难得多。\n\
    \n将具有静态存储生存期的非局部变量与具有自动存储生存期的局部变量对比：\n\n| | 初始化代价 | 作用域 |\n| --- | --- | --- |\n\
    | 非局部静态 | 一次 | 整个文件/程序 |\n| 局部自动 | 每次进入块时 | 定义它的块 |\n\n控制具有静态存储生存期的非局部变量的使用很难，而且初始化它们是廉价的，所以\
    \ C++ 会为你自动完成。\n\n不过，这有多便宜呢？让我们以 x86 架构为例。我之前提到过你支付一次初始化代价，但实际上你根本没有支付！当你的程序启动时，它需要为栈、堆、程序代码以及对我们来说重要的全局数据分配内存。在\
    \ Linux 和 Windows 等系统上，当我们从操作系统获取新的物理内存时，它会被填充零，以防止你读取之前使用该相同内存页的程序的内存。编译器/链接器可以将所有未初始化的全局变量放在名为\
    \ `.bss` 的段中。当程序启动并为 `.bss` 段分配内存时，它已经填充了零。所以这些变量是以零成本进行零初始化的！\n\n>! Note\n> ![images/aside-icons/tip.png](img/tip.png)\
    \ `static` 一词在 C++ 中有很多用法。`id` 是否具有 `static` 限定符并不影响它的静态存储生存期。对于全局变量，使用 `static\
    \ int id;` 而不是 `int id;` 只是赋予了它内部链接；也就是说，无法从其他编译单元（其他 cpp 文件）进行链接。无论如何它都有静态存储生存期。\n\
    \n### 拓展阅读\n\n零初始化\n[`en.cppreference.com/w/cpp/language/zero_initialization`](https://en.cppreference.com/w/cpp/language/zero_initialization)\n\
    \n关于全局变量初始化更多信息：从程序到进程\n[`www.youtube.com/watch?v=fGnbGX88z3Y`](https://www.youtube.com/watch?v=fGnbGX88z3Y)\n\
    \n## 谜题 5 破坏性关系\n\n[a-destructive-relationship.cpp](http://media.pragprog.com/titles/akbrain/code/a-destructive-relationship.cpp)\n\
    \n```cpp\n#include <iostream>\n#include <memory>\n\nstruct Widget\n{\n  virtual\
    \ void draw() { std::cout << \"Widget draw\\n\"; }\n  virtual ~Widget() { std::cout\
    \ << \"Widget destructor\\n\"; }\n};\n\nstruct Button : public Widget\n{\n  void\
    \ draw() override { std::cout << \"Button draw\\n\"; }\n  ~Button() override {\
    \ std::cout << \"Button destructor\\n\"; }\n};\n\nint main()\n{\n  std::unique_ptr<Widget>\
    \ widget = std::make_unique<Button>();\n  widget->draw();\n}\n```\n\n## 预测输出\n\
    \n![images/aside-icons/important.png](img/important.png) 在移动到下一页之前，尝试猜一下输出是什么。\n\
    \n![images/hline.png](img/hline.png)\n\n程序显示以下输出：\n\nButton draw\nButton destructor\n\
    Widget destructor\n\n![images/hline.png](img/hline.png)\n\n### 讨论\n\n当我们调用 `draw`\
    \ 时，程序只打印 `Button draw`。但当 `unique_ptr` 超出作用域并调用析构函数时，程序打印了 `Button destructor`\
    \ 和 `Widget destructor`。这是为什么？\n\n动态多态的一种常用技术是使用虚函数。你声明一个带有一个或多个标记为 `virtual`\
    \ 的类的，允许其他类重写这些函数。当你对指向派生类对象的基类指针调用虚函数时，将使用对象的动态类型，并调用重写后的函数。\n\n在这个示例中，想象有一个\
    \ UI 框架，其中包含一个具有某些共同行为的 `Widget` 类，以及 `Button`、`Text` 和 `Image` 等具体的 UI 元素，它们在虚函数\
    \ `draw` 中重写了绘图行为。\n\n当我们对指向 `Widget` 的基类指针调用 `draw` 时（该指针实际上指向派生类 `Button`），调用的是\
    \ `Button::draw` 而不是 `Widget::draw`，并打印了 `Button draw`。然而，对于析构函数，行为是不同的；我们可以看到它先打印\
    \ `Button destructor`，然后也打印 `Widget destructor`。发生了什么？\n\n当对象被销毁时，它的所有部分都必须销毁。在这种情况下，`Button`\
    \ 继承自 `Widget`，因此每个 `Button` 对象由一个 `Widget` 对象以及 `Button` 的任何成员（在本例中没有）组成。我们说\
    \ `Button` 拥有一个 `Widget` 子对象。如果 `Button` 是拥有类型为 `Widget` 的成员而不是继承它，它也会拥有一个 `Widget`\
    \ 子对象。无论哪种，当完整对象被销毁时，子对象也必须被销毁以避免资源泄漏。幸运的是，C++ 为我们处理了这一切；我们不需要在 `Button` 析构函数中手动调用\
    \ `Widget` 析构函数。\n\n\n"
- fmt: " Note also that the destructor’s body executes first, and only then are the\
    \ subobject destructors called. This ensures that you can still use members and\
    \ base classes in your class’s destructor. So the program first prints `Button`\
    \ destructor and then `Widget` destructor.\n\n| Bonus Question |\n| --- |\n| ![images/aside-icons/note.png](images/aside-icons/note.png)\
    \ | What would happen if `Widget` did not declare its destructor as virtual, and\
    \ in which scenarios would that be a problem? |\n\nAccording to the C++ standard,\
    \ if the static type of the object to be deleted is different from its dynamic\
    \ type, the static type must be a base class of the dynamic type of the object\
    \ to be deleted, and the static type must have a virtual destructor. Otherwise,\
    \ the behavior is undefined.\n\nSo if `Widget` doesn’t declare its destructor\
    \ virtual, and you delete a `Button` object through a pointer to `Widget`, the\
    \ behavior is undefined. In practice, you’ll typically see the `Widget` destructor\
    \ being called instead of the `Button` destructor and have issues like these:\n\
    \n- Any members of the derived class are not destroyed, potentially causing memory\
    \ leaks or other resource leaks.\n- If the derived class has a user-defined destructor,\
    \ the correctness of the program typically relies on this logic being executed\
    \ when the object is destroyed.\n\nBut in any case, even if none of those are\
    \ a problem for your program in particular and everything seems fine during testing,\
    \ you should still declare the destructor virtual to avoid undefined behavior.\n\
    \n| Recommendation |\n| --- |\n| ![images/aside-icons/tip.png](images/aside-icons/tip.png)\
    \ | Thanks to the automatic destruction of subobjects, a good technique to handle\
    \ resources in C++ is to have Resource Acquisition Is Initialization (RAII) types\
    \ (for instance, `unique_ptrs`) as members. This technique also works if you derive\
    \ from such a class. |\n\n### Further Reading\n\nCppReference on Destructors\n\
    [https://en.cppreference.com/w/cpp/language/destructor](https://en.cppreference.com/w/cpp/language/destructor)\n\
    \nThe C++ Standard on Destructors and Subobjects\n[https://timsong-cpp.github.io/cppwp/std20/class.dtor#14](https://timsong-cpp.github.io/cppwp/std20/class.dtor#14)\n\
    \n| Puzzle 6 | Who’s Up First? |\n| [whos-up-first.cpp](http://media.pragprog.com/titles/akbrain/code/whos-up-first.cpp)\
    \ |\n\n```cpp\n#include <iostream>\nstruct Resource {\n  Resource() {\n    std::cout\
    \ << \"Resource constructed\\n\";\n  }\n};\n\nstruct Consumer {\n  Consumer(const\
    \ Resource &resource) {\n    std::cout << \"Consumer constructed\\n\";\n  }\n\
    };\n\nstruct Job {\n  Job() : resource_{}, consumer_{resource_} {}\n  Consumer\
    \ consumer_;\n  Resource resource_;\n};\n\nint main() {\n  Job job;\n}\n```\n\n\
    | Guess the Output |\n| --- |\n| ![images/aside-icons/important.png](images/aside-icons/important.png)\
    \ | Try to guess what the output is before moving to the next page. |\n\n![images/hline.png](images/hline.png)\n\
    \nThe program displays the following output:\n\n```\nConsumer constructed\nResource\
    \ constructed\n```\n\n![images/hline.png](images/hline.png)\n\n### Discussion\n\
    \nThe class `Job` has two members, `consumer_` and `resource_`, declared in that\
    \ order. However, in the constructor’s member initializer list (the `: resource_{},\
    \ consumer_{resource_}` part), they are initialized in the opposite order. In\
    \ which order are they actually initialized?\n\nC++ always initializes members\
    \ in the order they are declared in the class, not in the order they are listed\
    \ in the constructor’s member initializer list. This ensures that members are\
    \ always initialized in a deterministic order, even if different constructors\
    \ happen to list them in different orders in their member initializer lists. So\
    \ even if `resource` seems to be initialized first in the constructor, `consumer_`\
    \ is actually initialized first.\n\nHaving members initialized in a deterministic\
    \ order is essential if one member depends on the other. For instance, in this\
    \ example the `consumer` depends on the `resource` in its constructor. Everything\
    \ seems to be okay in the constructor, but since `consumer_` is actually initialized\
    \ before `resource_`, the `Consumer` constructor gets passed a `Resource` that\
    \ hasn’t been constructed yet. If we tried to use it for anything, we would have\
    \ undefined behavior.\n\nThe reverse is also true. Members are destroyed in the\
    \ opposite order of their declarations in the class. Destruction order can be\
    \ as important as construction order since one member can depend on another in\
    \ its destructor, or there can be other lifetime dependencies. Imagine, for instance,\
    \ the `Consumer` in this puzzle runs a thread that uses `Resource`, and that `Consumer`\
    \ joins the thread in its destructor. In the current version of the code, `resource_`\
    \ would be destroyed while the thread is still running, and we would risk using\
    \ a destroyed `resource_`, resulting in undefined behavior. If `consumer_` had\
    \ been declared after `resource_`, however, the thread in `consumer` would have\
    \ stopped before `resource_` was destroyed.\n\nListing the members in the wrong\
    \ order in the member initializer list can be confusing to the reader, so I recommend\
    \ always using the same order in the member initializer list and the class declaration.\
    \ `GCC`, `Clang`, and `MSVC` all have warnings (`-Wreorder`, `-Wreorder-ctor`,\
    \ and `C5038`, respectively) that warn you if you don’t use a consistent order.\
    \ These warnings are enabled if you compile with `-Wall / /Wall`, which I always\
    \ recommend. Different compilers often have different warnings, so compiling with\
    \ several can be a good idea. That can also help you avoid accidentally using\
    \ non-standard, platform-specific variations of C++, which would make it harder\
    \ to port your project to other platforms later.\n\n| Recommendations |\n| ---\
    \ |\n| - Always enable warnings.<br>- Try compiling with several compilers. |\n\
    \n### Further Reading\n\nConstructors and Member Initializer Lists\n[https://en.cppreference.com/w/cpp/language/constructor](https://en.cppreference.com/w/cpp/language/constructor)\n\
    \n| Puzzle 7 | All Good Things Must Come to an End |\n| [all-good-things-must-come-to-an-end.cpp](http://media.pragprog.com/titles/akbrain/code/all-good-things-must-come-to-an-end.cpp)\
    \ |\n\n```cpp\n#include <iostream>\n#include <string>\n\nstruct Connection {\n\
    \  Connection(const std::string &name) : name_(name) {\n    std::cout << \"Created\
    \ \" << name_ << \"\\n\";\n  }\n\n  ~Connection() {\n    std::cout << \"Destroyed\
    \ \" << name_ << \"\\n\";\n  }\n\n  std::string name_;\n};\n\nConnection global{\"\
    global\"};\n\nConnection &get() {\n  static Connection localStatic{\"local static\"\
    };\n  return localStatic;\n}\n\nint main() {\n  Connection local{\"local\"};\n\
    \  Connection &tmp1 = get();\n  Connection &tmp2 = get();\n}\n```"
