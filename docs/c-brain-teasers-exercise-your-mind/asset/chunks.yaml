  trans: "\n\n你也可以通过将代码粘贴到在线编译器中并在浏览器中直接运行。我强烈推荐使用 Compiler Explorer，[[5]](#f_0010.xhtml_FOOTNOTE-5)，你可以在那里选择并比较不同的编译器版本和架构，尝试不同的优化级别，并添加其他编译器标志、清理选项等。\n\
    \n让我们开始吧！噢，注意那些恶鬼。\n\n## 脚注\n\n[[3]](#f_0006.xhtml_FNPTR-3)\n\n[鼻腔恶鬼 (Nasal Demons)\
    \ - 计算机术语词典](http://catb.org/jargon/html/N/nasal-demons.html)\n\n[[4]](#f_0010.xhtml_FNPTR-4)\n\
    \n[`pragprog.com/titles/akbrain`](https://pragprog.com/titles/akbrain)\n\n[[5]](#f_0010.xhtml_FNPTR-5)\n\
    \n[`godbolt.org`](https://godbolt.org)\n\nCopyright © 2024, The Pragmatic Bookshelf.\n\
    \n# 第一部分\n\nC++ 脑筋转弯\n\n### 谜题 1：多少？\n\n[how-many-degrees.cpp](http://media.pragprog.com/titles/akbrain/code/how-many-degrees.cpp)\n\
    \n```cpp\n#include <iostream>\nstruct Degrees {\n  Degrees() : degrees_(0) {\n\
    \    std::cout << \"Default constructed\\n\";\n  }\n  Degrees(double degrees)\
    \ : degrees_(degrees) {\n    std::cout << \"Constructed with \" << degrees_ <<\
    \ \"\\n\";\n  }\n  double degrees_;\n};\n\nstruct Position {\n  Position() : latitude_{1}\
    \ { longitude_ = Degrees{2}; }\n  Degrees latitude_;\n  Degrees longitude_;\n\
    };\n\nint main() {\n  Position position;\n}\n```\n\n**猜输出**\n![images/aside-icons/important.png](img/important.png)\
    \ 在进入下一页之前，尝试猜一下输出。\n\n程序显示以下输出：\n\n```\nConstructed with 1\nDefault constructed\n\
    Constructed with 2\n```\n\n#### 讨论\n\n`Position` 结构体有两个类型为 `Degrees` 的成员。其中一个在成员初始化列表中初始化，另一个在构造函数体内初始化。那么，为什么我们看到了三个\
    \ `Degrees` 对象被构造呢？\n\n在进入构造函数体之前，所有类成员都会被初始化。如果你显式地初始化成员（如我们对 `latitude_` 所的操作），则将使用该初始化。如果你没有（如\
    \ `longitude_` 的情况），该成员将会被默认初始化，这就是为什么我们看到打印了 `Default constructed` 行。在所有成员初始化完成后，我们最终进入构造函数体，初始化一个临时对象\
    \ `Degrees{2}`，然后将其拷贝赋值给之前默认初始化的 `longitude_`。\n\n请注意，你不需要在成员初始化列表中显式初始化成员，而是直接在成员声明中使用默认成员初始化，如下所示：\n\
    \n```cpp\nstruct Position {\n  Position() { longitude = Degrees{2}; }\n  Degrees\
    \ latitude{1}; // 默认成员初始化\n  Degrees longitude;\n};\n```\n\n如果你有多个构造函数，使用默认成员初始化是一个好主意。这样你就不需要记住在每个成员初始化列表中包含该成员。\n\
    \n#### 扩展阅读\n构造函数与成员初始化列表\n[`en.cppreference.com/w/cpp/language/constructor`](https://en.cppreference.com/w/cpp/language/constructor)\n\
    \n### 谜题 2：字符串理论\n\n[string-theory.cpp](http://media.pragprog.com/titles/akbrain/code/string-theory.cpp)\n\
    \n```cpp\n#include <iostream>\n#include <string>\nvoid serialize(const void*)\
    \ { std::cout << \"const void*\"; }\nvoid serialize(const std::string&) { std::cout\
    \ << \"const string&\"; }\n\nint main() {\n  serialize(\"hello world\");\n}\n\
    ```\n\n**猜输出**\n![images/aside-icons/important.png](img/important.png) 在进入下一页之前，尝试猜一下输出。\n\
    \n程序显示以下输出：\n\n```\nconst void*\n```\n\n#### 讨论\n\n为什么向 `serialize` 传递字符串会导致调用接收\
    \ void 指针的重载，而不是接收字符串的重载？\n\n当我们调用具有多个重载的函数时，编译器使用一种名为“重载解析”（overload resolution）的过程来确定哪一个最合适。编译器通过尝试将每个函数参数转换为每个重载对应的参数类型来实现此。某些转换优于其他转换，如果参数本身已经是正确类型，则转换是最好的。\n\
    \n所有参数均可成功转换的重载都会添加到“可行函数集”（viable functions）集合中。然后，编译器需要从该集合中选择一个重载。如果某个重载至少在一个参数上具有更好的转换，且在其他任何参数上都没有更差的转换，则该重载被视为最佳可行函数并被重载解析选中。如果没有哪个重载比所有其他重载更好，则调用格式错误且编译失败。\n\
    \n看这个例子：\n\n```cpp\nserialize(int, int); // 1\nserialize(float, int); // 2\n```\n\
    \n给定这两个重载，假设你这样调用 `serialize`：\n\n```cpp\nserialize(1, 2);\n```\n\n`serialize`\
    \ 的两个重载都是可行的。但第一个重载在第一个参数上有更好的转换（`int → int` 对比 `int → float`），并且在第二个参数上没有更差的转换（`int\
    \ → int`），因此它被选为最佳可行函数。\n\n这个谜题比上面的例子简单一点，因为 `serialize` 的两个重载都只有一个参数。第一个接收 `const\
    \ void*`，第二个接收 `const std::string&`。每个重载的转换是怎样的？\n\n`std::string` 是标准库中的一个类。它通常会在堆上分配内存（除非字符串非常小），并允许字符串在运行时增长或被修改。\n\
    \n然而，字符串 `\"hello world\"` 并不是 `std::string`，而是简单的字符串字面量。字符串字面量是普通的 C 风格字符数组，它们由链接器编译到二进制文件中，且在运行时无法修改。字符串字面量的类型是\
    \ `const char array`。`\"hello world\"` 有 11 个字符加上一个终止符 `\\0`，所以它的类型是 `12 const\
    \ char array`。\n\n由于参数 `\"hello world\"` 既不是 `const void*` 也 `std::string`，而是\
    \ `12 const char array`，因此两个重载都需要转换。如果从参数到参数类型存在隐式转换，该重载会被添加到可行函数集中。否则，该重载将被忽略。\n\
    \n让我们检查第一个重载，看看 `12 const char array` 是否能隐式转换为 `const void*`。发生的第一件事是数组转换为指针。任何\
    \ `N T array` 都可以转换为指向第一个元素的 `T pointer`。所以现在，我们的 `12 const char array` 已经变成了\
    \ `const char pointer`。\n\n接下来，任何 `cv T pointer`（其中 `cv` 表示 `const`、`volatile`、`const\
    \ volatile` 或三者皆无）都可以转换为 `cv void pointer`。所以现在，我们的 `const char pointer` 变成了 `const\
    \ void pointer`，这正是第一个重载所预期的。\n\n"
- fmt: "\nNotice that no constructors or conversion functions were involved in this\
    \ conversion sequence. This means it’s a standard conversion sequence and not\
    \ a user-defined conversion sequence. That gets important later.\n\nLet’s now\
    \ examine the second overload, and see if our “array of 12 const char” can be\
    \ converted to a “reference to const std::string.” `std::string` has a constructor\
    \ `std::string(const char* s)`, which we can use. First, we convert the “array\
    \ of 12 const char” to a “pointer to const char” as we did above. Then we pass\
    \ this to the `std::string` constructor and get a `std::string` back, containing\
    \ a copy of the string literal. The `const std::string&` parameter can bind directly\
    \ to our `std::string` argument.\n\nNotice that we had to use a constructor for\
    \ this. This means it’s a user-defined conversion sequence and not a standard\
    \ conversion sequence. It doesn’t matter that `std::string` is a standard library\
    \ type; it still counts as user-defined. The rules are the same for you and the\
    \ standard library.\n\nNow the compiler has found a valid conversion sequence\
    \ from our “array of 12 const char” to the parameter type of each overload and\
    \ has to figure out which sequence is best:\n\n![images/string-theory-new.drawio.png](images/string-theory-new.drawio.png)\n\
    \nWe only require a standard conversion sequence (top), to call the `const void*`\
    \ overload. To call the `std::string` overload, we need a user defined conversion\
    \ sequence (bottom), which involves creating a new temporary `std::string` object.\
    \ A standard conversion sequence is always better than a user-defined conversion\
    \ sequence, so the first overload gets called, and `const void*` is printed.\n\
    \n### Further Reading\n\nOverload Resolution\n\n[https://en.cppreference.com/w/cpp/language/overload_resolution](https://en.cppreference.com/w/cpp/language/overload_resolution)\n\
    \n`std::string`\n\n[https://en.cppreference.com/w/cpp/string/basic_string](https://en.cppreference.com/w/cpp/string/basic_string)\n\
    \nString Literal\n\n[https://en.cppreference.com/w/cpp/language/string_literal](https://en.cppreference.com/w/cpp/language/string_literal)\n\
    \n| Puzzle 3 | Hack the Planet! |\n\n[hack-the-planet.cpp](http://media.pragprog.com/titles/akbrain/code/hack-the-planet.cpp)\n\
    \n```cpp\n#include <iostream>\n\nint getUserId() {\n    return 1337;\n}\n\nvoid\
    \ restrictedTask1() {\n    int id = getUserId();\n    if (id == 1337) {\n    \
    \    std::cout << \"did task 1\\n\";\n    }\n}\n\nvoid restrictedTask2() {\n \
    \   int id;\n    if (id == 1337) {\n        std::cout << \"did task 2\\n\";\n\
    \    }\n}\n\nint main() {\n    restrictedTask1();\n    restrictedTask2();\n}\n\
    ```\n\n| Guess the Output |\n| --- |\n| ![images/aside-icons/important.png](images/aside-icons/important.png)\
    \ | Try to guess what the output is before moving to the next page. |\n\n![images/hline.png](images/hline.png)\n\
    \nThe program has undefined behavior! But it might display the following output:\n\
    \n| | did task 1 |\n| | did task 2 |\n\n![images/hline.png](images/hline.png)\n\
    \n### Discussion\n\nThe variable `id` in function `restrictedTask2` has not been\
    \ initialized and has an indeterminate value. To use its value is undefined behavior.\
    \ Anything can happen when a program runs into undefined behavior; the C++ standard\
    \ makes no guarantees. Even the part of the program that happened before we took\
    \ `id`’s value is undefined!\n\nHowever, if you run this program on your own computer,\
    \ it will probably print both `did task 1` and `did task 2`, at least if you compile\
    \ without optimizations. So the value `1337` magically teleported from `restrictedTask1`\
    \ to `restrictedTask2`! How could this happen?\n\nMost systems use a stack for\
    \ local variables. `restrictedTask1` has a local variable `id`, which it sets\
    \ aside space for in its stack frame. As it happens, `restrictedTask2` has the\
    \ same number and types of local variables (one `int`), so its stack frame layout\
    \ will be identical to `restrictedTask1`’s.\n\nWhen in `main`, the stack will\
    \ have grown to a certain point—see the leftmost illustration in the following\
    \ figure. We then call `restrictedTask1`, the stack grows, `restrictedTask1` sets\
    \ aside space in its stack frame for `id`, and initializes `id` to `1337`. Then\
    \ control returns to `main` and the stack shrinks again.\n\n![images/hack-the-planet2.drawio.png](images/hack-the-planet2.drawio.png)\n\
    \nNext, we call `restrictedTask2`, the stack grows again, and `restrictedTask2`\
    \ sets aside space in its stack frame for `id` but doesn’t initialize it. However,\
    \ `restrictedTask2`’s stack frame ends up in the exact same place as `restrictedTask1`’s\
    \ stack frame. The stack isn’t cleared between function calls, so the contents\
    \ of `restrictedTask2`’s stack frame will be exactly as `restrictedTask1` left\
    \ it, including the value `1337` in the position of the local variable `id`. This\
    \ causes `id` to be `1337` in both functions.\n\nIf you turn on optimizations,\
    \ though, `restrictedTask1` and `restrictedTask2` are likely to be inlined into\
    \ `main`, and the stack is not used for these calls. You can try this yourself\
    \ by compiling with `-O2` (GCC/Clang) or `/O2` (MSVC). On my x86_64 Linux machine,\
    \ GCC prints `did task 1` with `-O2`, whereas Clang segfaults. What happens on\
    \ your machine?\n\n#### Avoiding Uninitialized Variables\n\nTo avoid nasal demons,\
    \ security holes like this one, and garbage data in general, you should always\
    \ initialize your variables before using them. It’s easy to slip up, but help\
    \ is to be had! First of all, always compile with warnings. GCC, Clang, and MSVC\
    \ will warn you about this particular case, as will tools like `clang-tidy`. But\
    \ that’s only because it’s straightforward to prove that `id` is uninitialized\
    \ when it’s used. Often, we can’t know this until runtime. This is where sanitizers\
    \ come in.\n\nDifferent sanitizers exist for different purposes, but all monitor\
    \ your code at runtime in various ways to detect problems that can’t be detected\
    \ at compile time. One such sanitizer is `MemorySanitizer`, which is designed\
    \ to catch usages of uninitialized memory. If we run this program with `MemorySanitizer`\
    \ (pass `-fsanitize=memory` as a compiler option to Clang), it’ll print something\
    \ like this:\n\n| | ==1416660==WARNING: MemorySanitizer: use-of-uninitialized-value\
    \ |\n| | #0 0x5603d43af5eb in restrictedTask2() example.cpp:14 |\n| | #1 0x5603d43af6d\
    \ in main example.cpp:19 |\n\nIt tells you that you’re using uninitialized memory\
    \ and gives you a stack to where it happened.\n\nSanitizers can make your program\
    \ much slower, so you typically want separate builds with sanitizers. A sanitizer\
    \ can only detect an issue if that issue actually occurs at runtime, so make sure\
    \ to run as much of your test suite as possible with this build.\n\n| Recommendations\
    \ |\n| --- |\n| ![images/aside-icons/tip.png](images/aside-icons/tip.png) |  \n\
    \n*   Always enable warnings. `-Wall -Wextra -pedantic` is a good start on GCC/Clang,\
    \ and `/W4` on MSVC.\n*   If your IDE supports integrations with linting tools\
    \ like `clang-tidy`, turn them on. They can sometimes report issues like this\
    \ one before you even compile the code.\n*   Enable warnings as errors, at least\
    \ in your Continuous Integration jobs, so you don’t overlook any warnings.\n*\
    \   Set up sanitizer builds for as many sanitizers as you can, and run your tests\
    \ with these builds.\n\n |\n\n### Further Reading\n\nUndefined Behavior\n\n[https://en.cppreference.com/w/cpp/language/ub](https://en.cppreference.com/w/cpp/language/ub)\n\
    \nDeep C (and C++) by Olve Maudal and Jon Jagger\n\n[https://www.slideshare.net/olveudal/deep-c](https://www.slideshare.net/olveudal/deep-c)\n\
    \nList of Sanitizers\n\n[https://github.com/google/sanitizers](https://github.com/google/sanitizers)\n\
    \n| Puzzle 4 | Going Global |\n\n[going-global.cpp](http://media.pragprog.com/titles/akbrain/code/going-global.cpp)\n\
    \n```cpp\n#include <iostream>\n\nint id;\n```\n"
