  trans: "\n\n请注意，在上述两种情况下，显式函数模板特化都没有参与重载解析——它从来没有参与过。这可能不符合直觉，因此通常情况下，使用非模板重载比使用显式特化更好。请参阅“延伸阅读”下的前两个链接获取更多细节，以及一些此类混淆的更糟糕的示例。\n\
    \n| 建议 |\n| --- |\n| ![images/aside-icons/tip.png](img/tip.png) |\n*   优先使用非模板重载，而不是显式特化。\
    \ |\n\n### 延伸阅读\n\n为什么不特化化函数模板？\n\n[`www.gotw.ca/publications/mill17.htm`](http://www.gotw.ca/publications/mill17.htm)\n\
    \n函数模板的完全特化\n\n[`www.modernescpp.com/index.php/full-specialization-of-function-templates/`](https://www.modernescpp.com/index.php/full-specialization-of-function-templates/)\n\
    \nC++ 核心准则 T.144：不要特化函数模板\n\n[`isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines#t144-dont-specialize-function-templates`](https://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines#t144-dont-specialize-function-templates)\n\
    \n| 谜题 25 | 弱类型，强困惑 |\n[weakly-typed-strongly-puzzling.cpp](http://media.pragprog.com/titles/akbrain/code/weakly-typed-strongly-puzzling.cpp)\
    \ |\n\n```cpp\n#include <iostream>\n\nint main() {\n  std::cout << +!!\"\"\";\n\
    }\n```\n\n| 猜测输出 |\n| --- |\n| ![images/aside-icons/important.png](img/important.png)\
    \ 在移动到下一页之前，尝试猜猜输出是什么。 |\n\n![images/hline.png](img/hline.png)\n\n程序显示了以下输出：\n\
    \n| 1 |\n\n![images/hline.png](img/hline.png)\n\n### 讨论\n\n等等，什么？这是合法的 C++ 吗？这到底意味着什么，为什么它打印出\
    \ 1？\n\n虽然 C++ 是一种静态类型语言，但它并不是特别强类型。正如我们在整书中看到的，C++ 实际上非常热于在没有显式指示的情况下在类型之间进行隐式转换。例如，在谜题\
    \ 14 中亚里士多德的部分之和，我们看到两个 char 的和并不是一个 char；在谜题 17 中一个强项，我们看到应该如何显式声明构造函数以避免它们参与隐式转换；在谜题\
    \ 19 中一点小加法问题，我们看到算术类型之间的隐式转换如何导致意料之外的结果。\n\n这种“热衷”是我们在当年 C++ 设计为 C 语言的扩展时继承的特性。如果我们今天重新编写它，这些大量的隐式转换将列在我们想要更改的事项清单的前列。\n\
    \n那么，这里涉及到哪些隐式转换？这个表达式的最终类型是什么？为什么结果是 1？\n\n让我们从右侧开始，表达式 `\"\"`。这是一个字符串字面量，正如我们在谜题\
    \ 2 中字符串理论中所讨论的，字符串字面量的类型是“n 个 const char 数组”，在这里 n 为 1（为了隐式的 `\\0` 终止符）。\n\n\
    接下来是 `!` 运算符，它对操作数取反。但你如何对一个字符数组取反呢？这不合理，对吧？确实不合理，但 `!` 运算符的操作数在取反之前会根据上下文转换为\
    \ `bool`。将数组转换为 `bool` 也没有意义，但正如我们在谜题 2 中字符串理论中看到的，数组可以隐式转换为指针，而指针可以再次转换为 `bool`。当指针转换为\
    \ `bool` 时，如果它是空指针则转换为 false，否则转换为 true。由于此例中的指针是非空指针（它指向我们的字符串字面量），因此它转换为 true。最后，`!`\
    \ 运算符对其取反，所以我们得到了 false。有人可能会认为整个转换序列其实也没有意义，我赞同，但至少我们可以理解每一步是如何工作的以及它们是如何组合得到这个结果的。\n\
    \n接下来是另一个 `!`，这次它简单地对我们的 `bool` false 取反，得到 `bool` true。\n\n最后，是一元运算符 `+`。一元 `+`\
    \ 的操作数会经过整数提升，对于 `bool` 来说，这意味着将 false 转换为 0 将 true 转换为 1。运算符本身什么都不做；它的结果与其操作数（提升后）相同。因此，我们的\
    \ `bool` true 最终变成了 `int` 1，并被打印出来。\n\n编译器是否应该对这些内容发出警告是另一个话题，但没有主要的编译器会这样做，即使对于\
    \ GCC 和 Clang 使用 `-Wall` `-Wextra`，以及对 MSVC 使用 `/Wall`。不过，如果你显式开启这些警告，你的编译器可能会提供一些警告。例如，如果给出\
    \ `-Wstring-conversion` 选项，Clang 将会对字符串到 bool 的转换发出（该选项未包含在 `-Wall` 或 `-Wextra`\
    \ 中）。请检查你的编译器文档以获取其支持的警告列表。\n\n| 建议 |\n| --- |\n| ![images/aside-icons/tip.png](img/tip.png)\
    \ |\n*   尽可能开启所有警告。\n*   注意并非所有警告都包含在每个编译器的最高警告级别中。\n*   在生活中不要写这样的代码！ |\n\n###\
    \ 延伸阅读\n\nCppReference 关于隐式转换\n\n[`en.cppreference.com/w/cpp/language/implicit_conversion`](https://en.cppreference.com/w/cpp/language/implicit_conversion)\n\
    \n标准中的隐式转换序列\n\n[`timsong-cpp.github.io/cppwp/std20/over.best.ics`](https://timsong-cpp.github.io/cppwp/std20/over.best.ics)\n\
    \n#### 脚注\n\n[[6]](#f_0018.xhtml_FNPTR-6)\n\n[`en.cppreference.com/w/cpp/language/initialization`](https://en.cppreference.com/w/cpp/language/initialization)\n\
    \n[[7]](#f_0018.xhtml_FNPTR-7)\n\n[`timsong-cpp.github.io/cppwp/std20/basic.start`](https://timsong-cpp.github.io/cppwp/std20/basic.start)\n\
    \n[[8]](#f_0018.xhtml_FNPTR-8)\n\n[`en.cppreference.com/w/cpp/language/siof`](https://en.cppreference.com/w/cpp/language/siof)\n\
    \n[[9]](#f_0018.xhtml_FNPTR-9)\n\n[`en.cppreference.com/w/cpp/language/implicit_conversion`](https://en.cppreference.com/w/cpp/language/implicit_conversion)\n\
    \n[[10]](#f_0018.xhtml_FNPTR-10)\n\n[`timsong-cpp.github.io/cppwp/std20/basic.start`](https://timsong-cpp.github.io/cppwp/std20/basic.start)\n\
    \n[[11]](#f_0018.xhtml_FNPTR-11)\n\n[`timsong-cpp.github.io/cppwp/std20/over.best.ics`](https://timsong-cpp.github.io/cppwp/std20/over.best.ics)\n\
    \n[[12]](#f_0018.xhtml_FNPTR-12)\n\n[`timsong-cpp.github.io/cppwp/std20/over.best.ics`](https://timsong-cpp.github.io/cppwp/std20/over.best.ics)\n\
    \n[[13]](#f_0018.xhtml_FNPTR-13)\n\n[`github.com/rollbear/strong_type`](https://github.com/rollbear/strong_type)\n\
    \n[[14]](#f_0018.xhtml_FNPTR-14)\n\n[`timsong-cpp.github.io/cppwp/std20/over.best.ics`](https://timsong-cpp.github.io/cppwp/std20/over.best.ics)\n\
    \n[[15]](#f_0018.xhtml_FNPTR-15)\n\n[`en.wikipedia.org/wiki/Curiously_recurring_template_pattern`](https://en.wikipedia.org/wiki/Curiously_recurring_template_pattern)\n\
    \n[[16]](#f_0018.xhtml_FNPTR-16)\n\n[`www.godbolt.org/z/P43cETdWd`](https://www.godbolt.org/z/P43cETdWd)\n\
    \n"
