    }\n```\n\n### Guess the Output\n\n![images/aside-icons/important.png](images/aside-icons/important.png)\
    \ Try to guess what the output is before moving to the next page.\n\n![images/hline.png](images/hline.png)\n\
    \nThe program displays the following output:\n\n```\nMonster copied\nJormungandr\
    \ moved\n```\n\n![images/hline.png](images/hline.png)\n\n### Discussion\n\nWhen\
    \ we initialize the second `Jormungandr` with a moved-from object, the move constructor\
    \ gets called for `Jormungandr` but the copy constructor for `Monster`. Why is\
    \ that?\n\nAs we learned in Puzzle 8, Puzzle 8, [Will It Move?](#f_0019.xhtml_chp.puzzle08),\
    \ when we wrap an expression in `std::move`, it turns into an rvalue. An important\
    \ detail here, though, is that value categories are about expressions, not objects.\
    \ So nothing happens to the object `jormungandr1` itself; it’s just that the expression\
    \ `jormungandr1` is an lvalue, but the expression `std::move(jormungandr1)` is\
    \ an rvalue. If you ask me, it would be simpler if it was called “l-expression”\
    \ and “r-expression” instead of “lvalue” and “rvalue.”\n\nWhen we then copy-initialize\
    \ `jormungandr2` with the expression `Jormungandr jormungandr2{std::move(jormungandr1)}`,\
    \ overload resolution prefers `Jormungandr`’s move constructor over its copy constructor\
    \ since the expression `std::move(jormungandr1)` is an rvalue, which can be moved\
    \ from. And yes, you read that right, this form is always called copy-initialization\
    \ even if the move constructor happens to be called. There’s no such thing as\
    \ move-initialization.\n\nNow let’s turn our attention to the implementation of\
    \ `Jormungandr`’s move constructor. You might already have spotted the bug: we\
    \ forgot to wrap `other` in a `std::move` like so:\n\n[examples/which-constructors/which-constructors.cpp](http://media.pragprog.com/titles/akbrain/code/examples/which-constructors/which-constructors.cpp)\n\
    \n```cpp\nJormungandr(Jormungandr &&other) : Monster(std::move(other))\n```\n\n\
    The parameter `other` is an rvalue reference. But the expression `other`, which\
    \ we pass to the `Monster` constructor, is an lvalue! Since the expression `other`\
    \ is an lvalue, we can’t use the move constructor, and overload resolution picks\
    \ the copy constructor instead. However, after wrapping it in `std::move`, the\
    \ expression `std::move(other)` is now an rvalue, and the move constructor is\
    \ picked.\n\nThe output would then instead be the following:\n\n```\nMonster moved\n\
    Jormungandr moved\n```\n\nBonus question: what would happen if `Monster` was defined\
    \ like this instead?\n\n[examples/which-constructors/which-constructors.cpp](http://media.pragprog.com/titles/akbrain/code/examples/which-constructors/which-constructors.cpp)\n\
    \n```cpp\nstruct Monster {\n    Monster() = default;\n    Monster(const Monster\
    \ &other) {\n        std::cout << \"Monster copied\\n\";\n    }\n};\n```\n\nSince\
    \ we’ve explicitly declared a copy constructor, we don’t implicitly get a default\
    \ or move constructor. We have explicitly declared a default constructor, but\
    \ no move constructor, so `Monster` doesn’t have one.\n\nWhen `Jormungandr`’s\
    \ move constructor does `: Monster(std::move(other))`, the expression `std::move(other)`\
    \ is still an rvalue. More specifically, as we saw in Puzzle 9, Puzzle 9, [Counting\
    \ Copies](#f_0020.xhtml_chp.puzzle09), when you wrap an lvalue in `std::move()`,\
    \ it turns into a type of rvalue called an xvalue. This means the object still\
    \ has an identity like an lvalue, but we’re also allowed to move from it like\
    \ an rvalue. If `Monster` had a move constructor here (with a `Monster &&` parameter),\
    \ overload resolution would prefer it over the copy constructor (with the `const\
    \ Monster &` parameter) when passed an rvalue. But since it doesn’t have a move\
    \ constructor and const lvalue references are allowed to bind to rvalues, the\
    \ copy constructor is used instead.\n\nWe’re then back to this:\n\n```\nMonster\
    \ copied\nJormungandr moved\n```\n\n### Further Reading\n\nLvalues, Rvalues, Glvalues,\
    \ Prvalues, Xvalues, Help!\n\n[https://blog.knatten.org/2018/03/09/lvalues-rvalues-glvalues-prvalues-xvalues-help/](https://blog.knatten.org/2018/03/09/lvalues-rvalues-glvalues-prvalues-xvalues-help/)\n\
    \nThe Difference Between No Move Constructor and a Deleted Move Constructor\n\n\
    [https://blog.knatten.org/2021/10/15/the-difference-between-no-move-constructor-and-a-deleted-move-constructor/](https://blog.knatten.org/2021/10/15/the-difference-between-no-move-constructor-and-a-deleted-move-constructor/)\n\
    \n### Puzzle 21 | Sizing Up Some Characters\n\n[sizing-up-some-characters.cpp](http://media.pragprog.com/titles/akbrain/code/sizing-up-some-characters.cpp)\n\
    \n```cpp\n#include <iostream>\n\nvoid serialize(char characters[]) {\n    std::cout\
    \ << sizeof(characters) << \"\\n\";\n}\n\nint main() {\n    char characters[]\
    \ = {'a', 'b', 'c'};\n    std::cout << sizeof(characters) << \"\\n\";\n    std::cout\
    \ << sizeof(characters) / sizeof(characters[0]) << \"\\n\";\n    serialize(characters);\n\
    }\n```\n\n### Guess the Output\n\n![images/aside-icons/important.png](images/aside-icons/important.png)\
    \ Try to guess what the output is before moving to the next page.\n\n![images/hline.png](images/hline.png)\n\
    \nThe program has implementation-defined behavior! But on a 64-bit CPU it probably\
    \ outputs the following:\n\n```\n3\n3\n8\n```\n\n![images/hline.png](images/hline.png)\n\
    \n### Discussion\n\nThe program defines an array `characters` with three elements.\
    \ We then print the size of this array in various ways. What does the `sizeof`\
    \ operator do in each case? Which of them are defined by the standard, and which\
    \ are implementation-defined? And what do they print on your computer?\n\nFirst,\
    \ the program defines an array `char characters[] = {'a', 'b', 'c'}`. We then\
    \ print the size of this array, using the `sizeof` operator. The `sizeof` operator\
    \ yields the number of bytes occupied by its operand, which in this case is 3,\
    \ since each `char` is one byte, and there are three of them.\n\nBut wait, in\
    \ Puzzle 14, Puzzle 14, [Aristotle’s Sum of Parts](#f_0025.xhtml_chp.puzzle14),\
    \ we learned that the sizes of the fundamental types are not defined by the standard,\
    \ so how can we be so sure that the answer is 3? A `char` could, after all, be\
    \ 16 bits wide for all we know. As it turns out, `sizeof(char)` is defined to\
    \ always return 1. So the “byte” that the C++ standard talks about isn’t necessarily\
    \ eight bits wide but rather whatever width a `char` is.\n\nNext, we print `sizeof(characters)\
    \ / sizeof(characters[0])`. This is the age-old idiom used to count the number\
    \ of elements in an array in C or C++ and is guaranteed to print 3 in this puzzle.\
    \ This is because `sizeof(characters)` returns 3 (as we just saw), and `sizeof(characters[0])`\
    \ is equivalent to `sizeof(char)`, which always returns 1. (As of C++17, we can\
    \ also count the elements in an array with the new `std::size` function template,\
    \ which makes the code a bit simpler: `std::cout << std::size(characters);`)\n\
    \nFinally, we want to serialize our characters, so we pass them to `void serialize(char\
    \ characters[])`. The serialization function wants to know how large the array\
    \ is for purposes of serialization and does `sizeof(characters)`, just like we\
    \ do in `main`. But why does this print 8 (on my computer in particular) and not\
    \ 3? It’s because the type of the `char characters[]` parameter is actually not\
    \ “array of char” but rather “pointer to char”! The standard says the following\
    \ about the types of function parameters:\n\n> After determining the type of each\
    \ parameter, any parameter of type “array of T” or of function type T is adjusted\
    \ to be “pointer to T”.\n"
