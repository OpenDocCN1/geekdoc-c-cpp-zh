  trans: "\n\n检测数据竞态（data races）的一个工具是免费的 `ThreadSanitizer`。它是 LLVM 自带的许多检测器之一，只需通过传递\
    \ `-fsanitize=thread` 编译器选项并运行程序即可启用它。对于这个谜题，它会告诉你类似如下的内容：\n\n```text\n| ​  |\
    \ WARNING: ThreadSanitizer: data race (pid=2735) |\n| ​  | Read of size 1 at 0x7ffed85a35cf\
    \ by thread T2: |\n| ​  | (... stack trace ...) |\n| ​  |  |\n| ​  | Previous\
    \ write of size 1 at 0x7ffed85a35cf by thread T1: |\n| ​  | (... stack trace ...)\
    \ |\n| ​  |  |\n| ​  | Location is stack of main thread. |\n| ​  |  |\n| ​  |\
    \ Location is global '??' at 0x7ffed8584000 ([stack]+0x1f5cf) |\n| ​  |  |\n|\
    \ ​  | Thread T2 (tid=2738, running) created by main thread at: |\n| ​  | (...\
    \ stack trace ...) |\n| ​  |  |\n| ​  | Thread T1 (tid=2737, finished) created\
    \ by main thread at: |\n| ​  | (... stack trace ...) |\n```\n\n如你所见，它不仅告诉你有存在数据竞态，还告诉了变量的位置、读取和写入变量的代码堆栈跟踪，以及线程创建的堆栈跟踪。非常有用的东西！\n\
    \n| 建议 |\n| --- |\n| ![images/aside-icons/tip.png](img/tip.png) |  \n\n- 如果共享变量中至少有一个是写操作，请始终对这些访问进行同步。\n\
    - `std::atomic` 通常是值同步的极佳选择。\n- 使用检测器（sanitizers）。\n\n| |\n\n### 延伸阅读\n\n`std::async`\n\
    [`en.cppreference.com/w/cpp/thread/async`](https://en.cppreference.com/w/cpp/thread/async)\n\
    \n`std::atomic`\n[`en.cppreference.com/w/cpp/atomic/atomic`](https://en.cppreference.com/w/cpp/atomic/atomic)\n\
    \nC++ 标准中的数据竞态定义\n[`timsong-cpp.github.io/cppwp/std20/intro.races`](https://timsong-cpp.github.io/cppwp/std20/intro.races)\n\
    \n`ThreadSanitizer`\n[`clang.llvm.org/docs/ThreadSanitizer.html`](https://clang.llvm.org/docs/ThreadSanitizer.html)\n\
    \n### 谜题 16：一个重载的容器\n\n源码引用：`[an-overloaded-container.cpp](http://media.pragprog.com/titles/akbrain/code/an-overloaded-container.cpp)`\n\
    \n```cpp\n#include <initializer_list>\n#include <iostream>\nstruct Container {\n\
    \    Container(int, int) {\n        std::cout << \"Two ints\\n\";\n    }\n   \
    \ Container(std::initializer_list<float>) {\n        std::cout << \"std::initializer_list<float>\\\
    n\";\n    }\n};\n\nint main() {\n    Container container1(1, 2);\n    Container\
    \ container2{1, 2};\n}\n```\n\n| 猜猜输出 |\n| --- |\n| ![images/aside-icons/important.png](img/important.png)\
    \ | 在移动到下一页之前，尝试猜猜输出是什么。 |\n\n程序显示如下输出：\n```text\nTwo ints\nstd::initializer_list<float>\n\
    ```\n\n加问题：如果我们移除 `initializer_list` 构造函数会发生什么？它还能通过编译吗？\n\n### 讨论\n\n`struct\
    \ Container` 有两个构造函数，一个接收两个 `int`，另一个接收一个 `std::initializer_list<float>`。构造了两个\
    \ `Container` 类型的对象，都以两个 `int` 作为参数。但区别在于，一个对象是使用括号 `(1,2)` 构建的，另一个是使用大括号 `{1,2}`\
    \ 构建的。在种情况下调用了哪个构造函数？\n\n对于 `Container container1(1, 2)`，重载解析不出所料地选择了接收两个 `int`\
    \ 的构造函数。\n\n对于 `Container container2{1, 2}`，重载解析选择了接收 `std::initialization<float>`\
    \ 的构造函数，尽管我们传递了两个 `int`！这意味着 `{1,2}` 是一个 `std::initializer_list` 吗？不是，`{1,2}`\
    \ 并不是 `std::initializer_list<int>`，而是被称为 `braced-init-list`（列表初始化列表）的表达式。`braced-init-list`\
    \ 是一对包含零或多个元素的大括号。它可以出现在几种环境中；最常见的是用于初始化。以下是一些用于初始化的 `braced-init-lists` 示例：\n\
    \n源码引用：`[examples/braced-init-list/braced-init-list.cpp](http://media.pragprog.com/titles/akbrain/code/examples/braced-init-list/braced-init-list.cpp)`\n\
    \n```cpp\nstd::array<int, 3> a{1, 2, 3};\nint i{2};\nint j{};\nf({1, 2});\nstd::map<int,\
    \ std::string>{{1, \"one\"}, {2, \"two\"}};\nreturn {1, 2};\n```\n\n从 `i` 和 `j`\
    \ 的初始化可以看出，即使大括号之间只有零或一个元素，而不是一个项的“列表”，该表达式仍被称为 `braced-init-list`。\n\n来自 `braced-init-list`\
    \ 的初始化被称为 `list-initialization`（列表初始化），不幸的是，在这些语境下 `braced-init-list` 被称为 `initializer\
    \ list`。`initializer list` 并不等同于类模板 `std::initializer_list<T>`。这些名字相当误淆。\n\n所以，如果\
    \ `{1,2}` 不是 `std::initializer_list`，为什么它选择了 `std::initializer_list` 构造函数呢？重载解析对\
    \ `list-initialization` 有一个特殊情况，它分为两个阶段：\n\n- 首先，它对所有接收 `std::initializer_list`\
    \ 的构造函数进行重载解析，将 `braced-init-list` 视为单个参数。\n- 然后，且只有在第一阶段未成功时，它才对其他构造函数进行重载解析，将\
    \ `braced-init-list` 中的元素视为独立的参数。\n\n因此在 `Container container2{1, 2}` 的情况下，重载解析首先尝试\
    \ `std::initializer_list<float>` 构造函数。`int` 可以隐式转换为 `float`，同样，`int` 的初始化列表可以用于创建\
    \ `std::initializer_list<float>`。因此，选中了 `std::initializer_list<float>` 构造函数，另一个构造函数甚至没有被考虑过。\n\
    \n现在回答加问题：如果我们移除 `std::initializer_list<float>` 构造函数会发生什么？对于 `Container container1(1,\
    \ 2)`，没有变化，因为这不是 `list-initialization`。对于 `Container container2{1, 2}`，重载解析在第一阶段没有找到任何接收\
    \ `std::initializer_list` 的构造函数并移动到另一个构造函数。两种情况下都使用了接收两个 `int` 的构造函数，程序仍然可以编译。\n\
    \n| std::vector |\n| --- |\n| ![images/aside-icons/note.png](img/note.png) | 如果你想过为什么\
    \ `std::vector<int> v(1,2)` 得到一个元素为 2 的 vector，而 `std::vector<int> v{1,2}` 得到有两个元素\
    \ 1 和 2 的 vector，现在你知道为什么了。 |\n\n- 第一种情况不是 `list-initialization`，它选择了接收 `size_type`\
    \ 和 `T` 的构造函数。\n- 第二种情况是 `list-initialization`，它选择了接收 `std::initializer_list<T>`\
    \ 的构造函数。\n\n### 谜题 17：强点\n\n源码引用：`[a-strong-point.cpp](http://media.pragprog.com/titles/akbrain/code/a-strong-point.cpp)`\n\
    \n```cpp\n#include <iostream>\nstruct Points {\n    Points(int value) : value_(value)\
    \ {}\n    int value_;\n};\n\nstruct Player {\n    explicit Player(Points points)\
    \ : points_(points) {}\n    Points points_;\n};\n\nint main() {\n    Player player(3);\n\
    \    std::cout << player.points_.value_;\n}\n```\n\n| 猜猜输出 |\n| --- |\n\n"
- fmt: "\n| ![images/aside-icons/important.png](images/aside-icons/important.png)\
    \ | Try to guess what the output is before moving to the next page. |\n\nThe program\
    \ displays the following output:\n\n|  | 3 |\n\n### Discussion\n\nThe `Player`\
    \ struct has a member `points_` to keep track of the player’s points. Instead\
    \ of using a fundamental type like `int` for this, we use a custom type `Points`.\
    \ This technique is often called “strong typing” and can make the code easier\
    \ to read and avoid bugs. For instance, given a function `do_something(int player_id,\
    \ int points, int lives)`, it can be easy to slip up and pass it `player_id, lives,\
    \ points` instead, causing the number of lives to be used for points and vice\
    \ versa. When you use separate strong types for these values, a mistake like this\
    \ would cause the program to fail to compile rather than create a bug.\n\nThe\
    \ question in this puzzle is whether we’re allowed to construct a `Player` object\
    \ directly from an `int`, like we do in the expression `Player player(3)`, or\
    \ whether we need to manually create an object of the strong type `Points` to\
    \ pass to the `Player` constructor.\n\nFor `Player player(3)` to work, we need\
    \ an implicit conversion from `int`. And only constructors not marked `explicit`,\
    \ known as converting constructors, can participate in implicit conversions. `Player`’s\
    \ constructor is marked `explicit` and is thus not a converting constructor, so\
    \ how does this conversion work?\n\nThe form `Player player(3)` is an example\
    \ of direct-initialization (so is `Player player{3}` but not, for example, `Player\
    \ player = 3`). I like to think that we’re directly calling `Player`’s constructor.\
    \ In direct-initialization, overload resolution is used to pick the best constructor.\
    \ When we’re direct-initializing a `Player` from an `int`, overload resolution\
    \ tries to find an implicit conversion sequence from `int` to each of `Player`’s\
    \ constructors. `Player` has only one constructor, taking a `Points`, so we need\
    \ an implicit conversion from `int` to `Points`. `Points`’ constructor isn’t `explicit`,\
    \ so it’s a converting constructor and can be used in the implicit conversion\
    \ sequence. `3` is implicitly converted to `Points`, and this `Points` object\
    \ is passed to `Player`’s constructor.\n\n`Player`’s constructor itself is not\
    \ involved in the implicit conversion; we’re calling it directly, remember. So\
    \ it makes no difference whether or not it’s `explicit`.\n\nOn the other hand,\
    \ if it was `Points`’ constructor that was `explicit`, it would no longer be a\
    \ converting constructor and would not be usable in the implicit conversion sequence.\
    \ We’d no longer be able to implicitly convert the `int 3` to `Points`, and the\
    \ program would not compile.\n\nGiving your strong types `explicit` constructors\
    \ makes the code slightly more verbose but also more robust. Returning to the\
    \ `do_something` example, you would now have to write `do_something(PlayerId{42},\
    \ Points{3}, Lives{1})` for the program to compile, whereas with converting constructors,\
    \ you could still slip up and write `do_something(42, 1, 3)` and the program would\
    \ still compile. I also find the former more readable.\n\n| Copy-Initialization\
    \ vs. Direct-Initialization |\n| --- |\n| ![images/aside-icons/note.png](images/aside-icons/note.png)\
    \ | What would happen if we instead wrote this: | Player player = 3 | This form\
    \ is called copy-initialization and differs a bit from direct-initialization.\
    \ Now we’re no longer calling the `Player` constructor directly; we’re instead\
    \ trying to implicitly convert an `int` to `Player`. An implicit conversion sequence\
    \ can only involve one user-defined conversion, but we would need one from `int`\
    \ to `Player` and then a second one from `Player` to `Points`. So `Player player\
    \ = 3` would never compile, regardless of whether any of the constructors are\
    \ `explicit`. |\n\n| Recommendations |\n| --- |\n| ![images/aside-icons/tip.png](images/aside-icons/tip.png)\
    \ | |\n\n- Mark single argument constructors `explicit` to avoid surprising implicit\
    \ conversions.\n- Use strong types instead of fundamental types to avoid bugs.\n\
    - Consider using a strong type library, such as Björn Fahller’s `strong_type`,\
    \ to reduce boilerplate code when creating strong types. |\n\n### Further Reading\n\
    \nDirect-Initialization\n[https://en.cppreference.com/w/cpp/language/direct_initialization](https://en.cppreference.com/w/cpp/language/direct_initialization)\n\
    \nCopy-Initialization\n[https://en.cppreference.com/w/cpp/language/copy_initialization](https://en.cppreference.com/w/cpp/language/copy_initialization)\n\
    \nC++ Core Guidelines C.46: By Default, Declare Single-Argument Constructors Explicit\n\
    [https://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines#c46-by-default-declare-single-argument-constructors-explicit](https://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines#c46-by-default-declare-single-argument-constructors-explicit)\n\
    \n| Puzzle 18 | Moving Out |\n[moving-out.cpp](http://media.pragprog.com/titles/akbrain/code/moving-out.cpp)\
    \ |\n\n```cpp\n#include <iostream>\n#include <string>\n\nint main() {\n    std::string\
    \ hello{\"Hello, World!\"};\n    std::string other(std::move(hello));\n    std::cout\
    \ << \"'\" << hello << \"'\";\n}\n```\n\n| Guess the Output |\n| --- |\n| ![images/aside-icons/important.png](images/aside-icons/important.png)\
    \ | Try to guess what the output is before moving to the next page. |\n\nThe program\
    \ has unspecified behavior! But it probably outputs the following:\n\n|  | ''\
    \ |\n\n### Discussion\n\nA moved-from object should no longer be used, as resources\
    \ will have been moved out of it, pointers might point to destroyed objects, and\
    \ so on.\n\nHow a particular moved-from object behaves is up to the implementer\
    \ of that class. The implementer has a lot of freedom here, but at a minimum,\
    \ the object should be safe to destroy so nothing breaks when, for instance, a\
    \ moved-from local variable goes out of scope. Unless explicitly documented, you\
    \ as a user should not assume that a class makes any further guarantees.\n\nThe\
    \ C++ standard provides an additional guarantee for the classes in the standard\
    \ library, though:\n\n> Objects of types defined in the C++ standard library may\
    \ be moved from. (…) Unless otherwise specified, such moved-from objects shall\
    \ be placed in a valid but unspecified state.\n\n`std::string` does not specify\
    \ otherwise, so a moved-from string is placed in a “valid but unspecified state.”\
    \ What does that mean, though?\n\nThe C++ standard provides the following definition:\n\
    \n> (a) value of an object that is not specified except that the object’s invariants\
    \ are met and operations on the object behave as specified for its type.\n\nSo\
    \ while we don’t know what the moved-from string contains, we at least know that\
    \ `.size()` returns the size of whatever string is left in there, that `.empty()`\
    \ is true if and only if `.size() == 0`, and so on. But still, the actual state\
    \ of the object is unspecified and we can’t be sure what the output will be, so\
    \ it’s better to avoid using moved-from objects altogether.\n\n| Implementation\
    \ of the std::string Move Constructor |\n| --- |\n"
