    ### C 脑筋急转


    ![](http://pragmaticprogrammer.com/titles/cbrain)


    你以为你了解 `C`，但你能解决这门流行编程语言中的 25 道谜题吗？著名的 `C` 程序员、作家 Dan Gookin 提供了一系列尖锐的问题、谜题和挑战，以保持你的
    `C` 编程技能敏锐。每一道题都将提供处理字符串、数值操作和其他活动各个方面的见解，让你获得充分利用 `C` 所有功能的技巧。挑战自己，并了解一些编写更好、更快、更准确的
    `C` 代码的强大技巧和细节。


    Dan Gookin


    (118 页) ISBN: 9798888650486 $32.95


    ### JavaScript 脑筋急转


    ![](http://pragmaticprogrammer.com/titles/fkjsbrain)


    如果你曾感受过攻克棘手问题的快感，或目睹挑战大脑的优雅代码时的快乐，那么这本书为你为你定制的。准备好投入各种令人烧脑的 `JavaScript` 脑筋急转中。每个谜题不仅仅是一个代码练习；它是开启新见解和磨炼能力的大门。在解决挑战的过程中，你将学会务实地思考，优化代码效率，并避开可能让你措手不及的隐藏陷阱。更重要的是——谜题的形式将帮助你记住所学的内容！


    Faraz K. Kelhini


    (128 页) ISBN: 9798888650523 $32.95


    ### Rust 脑筋急转


    ![](http://pragmaticprogrammer.com/titles/hwrustbrain)


    `Rust` 编程语言是一致的，并尽力避免让程序员惊讶。然而，像所有语言一样，`Rust` 也有它的特殊之处。但这些特性提供了教学机会。在书中，你将完成一系列挑战你对
    `Rust` 理解的脑筋急转。通过理解知识中的空白，你可以更好地完成你的工作并避免错误。书中的许多谜题来自作者创建软件的自身经验，另一些来自 `Rust`
    社区的常见问题。无论来源如何，这些脑筋急转都很有趣，而且让我们面对吧：谁不喜欢一个好的谜题呢，对吧？


    Herbert Wolverson


    (138 页) ISBN: 9781680509175 $18.95


