  trans: "\n\n实现 `std::string` 移动构造函数的一种典型方式是让新字符串“窃取”旧字符串的内存以避免拷贝。此时，重要的是不能再通过旧字符串对象访问这块内存，否则对其中一个字符串的修改也会影响另一个。同样重要的一点是，旧字符串不要在它的析构函数中尝试释放这块内存。如果\
    \ `std::string` 是通过一个指向堆上字符串缓冲区的指针实现的，可以想象移动构造函数将旧字符串的缓冲区指针设为 `null`。你可以使用类似的技术为你自己的类实现移动操作。\n\
    \n某些实现通过将字符串存储在 `std::string` 对象内部而不是在堆上分配缓冲区来优化短字符串，这种技术被称为短字符串优化（Short String\
    \ Optimization）。在这些情况下，移动构造函数无法窃取旧字符串的内存，因此需要拷贝。对于这种被移动过的字符串（moved-from string），一个合理的有效状态是它仍然包含原始字符串。我在\
    \ Windows、Mac 和 Linux 上都测试了这一点，包括长字符串和短字符串。在所有情况下，它们输出的空字符串 `\"\"`。但正如常遇到的遇到未定义行为一样，我不会假设这总是成立的。我只会假设\
    \ `std::string` 的不变性是满足的。\n\n### 建议\n\n- 不要使用被移动过的对象（销毁它们除外）。\n- 在你自己的类中，尝试让移动构造函数和移动赋值运算符将对象置于一个仍然满足不变性的有效状态。\n\
    - 如果你做不到，至少确保调用析构函数是安全的。\n\n### 延伸阅读\n\n- `std::string` 构造函数：[`en.cppreference.com/w/cpp/string/basic_string/basic_string`](https://en.cppreference.com/w/cpp/string/basic_string/basic_string)\n\
    - 库类型被移动后的状态：[`timsong-cpp.github.io/cppwp/std20/lib.types.movedfrom`](https://timsong-cpp.github.io/cppwp/std20/lib.types.movedfrom)\n\
    - 有效但未指定的状态：[`timsong-cpp.github.io/cppwp/std20/defns.valid`](https://timsong-cpp.github.io/cppwp/std20/defns.valid)\n\
    \n### 谜题 19：小求和\n\n[a-little-sum-thing.cpp](http://media.pragprog.com/titles/akbrain/code/a-little-sum-thing.cpp)\n\
    \n```cpp\n#include <iostream>\n#include <numeric>\n#include <vector>\n\nint main()\
    \ {\n    std::vector<int> v{-2, -3};\n    std::cout << std::accumulate(v.cbegin(),\
    \ v.cend(), v.size());\n}\n```\n\n#### 猜输出\n\n在进入下一页之前，尝试猜猜输出是什么。\n\n程序具有实现定义的行为（implementation-defined\
    \ behavior）！但它输出了一个很大的数字，例如这个：\n\n```\n18446744073709551613\n```\n\n### 讨论\n\n\
    vector 的大小为 2。当我们向它加上 -2 和 -3 时，为什么结果不是 -3 呢？\n\n`std::accumulate` 函数模板定义如下：\n\
    \n```cpp\ntemplate<class InputIterator, class T>\nconstexpr T accumulate(InputIterator\
    \ first, InputIterator last, T init);\n```\n\n> 影响：通过用初始值 `init` 初始化累加器 `acc`，然后按照顺序对范围\
    \ `first, last)` 中的每个迭代器 `i` 修改它（`acc = std::move(acc) + *i`……）来计算结果。\n\n让我们从推导模板参数开始。`InputIterator`\
    \ 将被推导为 vector 的迭代器类型，这对于这个谜题没有意义，因为它只用于迭代。另一方面，`T` 将被推导为 `std::vector<int>::size()`\
    \ 的类型，这是解题的关键。`std::vector<int>::size()` 返回 `size_type`，标准并没有对其进行详细规定。它只要求是一个无符号整数类型，只要满足该要求，实现就可以选择在该特定系统上最自然的表示形式。\n\
    \n因此，`init` 的类型、返回值以及 `std::accumulate` 内部的累加器 `acc` 都是这种无符号整数类型 `size_type`。当我们向无符号类型加上负数时，注定会出现问题。但具体是什么问题呢？重要的是，这算未定义行为吗？\n\
    \n有两种错误场景令人担忧：\n\n- 当将一种整数类型的值转换为另一种整数类型时，如果该值超出了新类型的范围。这听起来没有那么危险，因为操作实际上并没有发生溢出，而是回绕（wrap\
    \ around）。这对于无符号整数是如此，而且从 C++20 开始，符号整数也是如此。例如，一个 8 位的符号整数如 `int8_t` 可以表示 -128\
    \ 到 127 之间的值。如果我尝试给它赋值 128（大了 1），它会回绕到 -128。当发生回绕时，你定会得到错误的结果，但至少它不是未定义行为。\n-\
    \ 进行算术运算时，如果结果超出了结果类型的范围。对于无符号整数，我们再次回绕。但对于符号整数，我们会得到溢出，这是未定义行为。\n\n由于我们正在向无符号的\
    \ `acc` 加上负数 -2 和 -3，我们至少可以预见到一些回绕，但我们可以预见到溢出导致未定义行为吗？这取决于我们最终是否加上了两个和超出结果类型范围的符号整数。让我们仔细观察\
    \ `std::accumulate` 中发生了什么，看看这是否可能。\n\n算法首先用大小 2 初始化累加器 `acc`。`acc` 的类型为 `T`，我们之前推导出它是未指定的无符号整数类型\
    \ `size_type`。然后我们逐将符号整数 -2 和 -3 加上 `acc`。最后，返回 `acc`。这些是列出的步骤：\n\n```cpp\nsize_type\
    \ acc = 2; // size_type 是无符号的\nacc = acc + -2; // 无符号数和负符号数的加\nacc = acc + -3;\
    \ // 无符号数和负符号数的加\nreturn acc;\n```\n\n现在，当我们把两个符号整数 -2 和 -3 加上未知的无符号整数类型 `size_type`\
    \ 时会发生什么？在谜题 14，谜题 14，[亚里士德的部分之和 中，我们学习了通常算术转换和整数提升，这些在这里也发生了。\n\n由于我们不知道 `size_type`\
    \ 和 `int` 的宽度，我们需要考虑三种情况：\n\n### 如果 size_type 能够放入 int 中\n\n如果 `int` 可以表示 `size_type`\
    \ 的所有值，`acc` 将提升为 `int`，加法将在 `int` 类型上进行。由于 `size_type` 是无符号的，只有当 `size_type`\
    \ 小于 `int` 时才会发生。实现选择比 `int` 小的 `size_type` 非常不利，但根据标准这是可以的。在这种情况下发生如下：\n\n首先，我们将\
    \ -2 加上 `acc`。在将 `acc` 从 `size_type` 提升为 `int` 后，操作数的类型相同（`int`），不需要进一步转换。我们将\
    \ 2 和 -2 相加得到 0，它符合结果类型 `int`。这个 `int` 0 被转换回 `size_type` 并存储在 `acc` 中。\n\n接下来，我们将\
    \ -3 加上 `acc`。在将 `acc` 从 `size_type` 提升为 `int` 后，我们将 0 和 -3 相加得到 -3，它同样符合结果类型\
    \ `int`。`int` -3 被转换回 `size_type`。由于 `size_type` 是无符号的，-3 回绕到 `std::numeric_limits<size_type>::max()`\
    \ - 2，它存储在 `acc` 中作为最终结果并返回。如果 `size_type` 是例如 `uint16_t`，结果将是 65533。这产生了回绕和错误的结果，但没有未定义行为。\n\
    \n"
- fmt: "\nHere’s a diagram of the types and conversions involved in the process. `acc`\
    \ is promoted to `int`, is added to the first value, and the result converts back\
    \ to `size_type` to get stored in `acc`. Then we go around one more time for the\
    \ second value.\n\n![images/conversions1.drawio.png](images/conversions1.drawio.png)\n\
    \nThe `size_type` to `int` promotion is unproblematic since `size_type` fits in\
    \ `int`. The signed addition has the potential for overflow with undefined behavior\
    \ if the result doesn’t fit in `int` (but that doesn’t happen given the input\
    \ in this puzzle). The `int` to `size_type` conversion has the potential for wraparound\
    \ if the result is negative (as happens in this puzzle) or if the value is too\
    \ large (does not happen in this puzzle).\n\n### If size_type Does Not Fit in\
    \ int but Fits in unsigned int\n\nIf `int` cannot represent all of the values\
    \ of `size_type` but `unsigned int` can, `acc` gets promoted to `unsigned int`.\
    \ This can only happen if `size_type` is the same width as `int` and `unsigned\
    \ int`. If `size_type` was smaller, it would fit in `int`; if it was wider, it\
    \ would not fit in `unsigned int`.\n\nAfter `acc` has been promoted from `size_type`\
    \ to `unsigned int`, the operands are still not of the same type, so the usual\
    \ arithmetic conversions continue. Since `size_type` and `int` have the same width,\
    \ they also have the same rank, and the `int` is converted to `unsigned int` (see\
    \ The Usual Arithmetic Conversions^([[14]](#f_0036.xhtml_FOOTNOTE-14)) for details).\
    \ The addition happens with the type `unsigned int`.\n\nFirst, we add -2 to `acc`.\
    \ `-2` is converted to `unsigned int`, and since it is negative, it wraps around\
    \ to `std::numeric_limits<unsigned int>::max() - 1`. When added to `acc`, which\
    \ has the value `2`, we wrap around again to `0`.\n\nNext, we add `-3` to `acc`.\
    \ `-3` is converted to `unsigned int`, and again since it is negative, it wraps\
    \ around to `std::numeric_limits<unsigned int>::max() - 2`. When added to `acc`,\
    \ which has the value `0`, the result is `std::numeric_limits<unsigned int>::max()\
    \ - 2`, which gets stored in `acc` as the final result. On a typical system with\
    \ 32-bit `int`, the result would be `4294967293`. This produced several wraparounds\
    \ and a wrong result, but no undefined behavior.\n\nHere’s a diagram of the types\
    \ and conversions involved in the process. `acc` is promoted to `unsigned int`\
    \ and the first value is converted to `unsigned int`, they are added together,\
    \ and the result is converted back to `size_type` to get stored in `acc`. Then\
    \ we go around one more time for the second value.\n\n![images/conversions2.drawio.png](images/conversions2.drawio.png)\n\
    \nThe `size_type` to `unsigned int` promotion is unproblematic since `size_type`\
    \ and `unsigned int` are both unsigned and of the same width. The `int` to `unsigned\
    \ int` conversion has the potential to wrap around if the value is negative (which\
    \ happens, given the input in this puzzle). The `unsigned` addition has the potential\
    \ to wrap around if the result is too large (does not happen in this puzzle).\
    \ The `unsigned int` to `size_type` conversion is unproblematic since `unsigned\
    \ int` and `size_type` are both unsigned and of the same width.\n\n### If size_type\
    \ Does Not Fit in Either int or unsigned int\n\nThis is the most common scenario\
    \ if, for example, `int` is 32 bits and `size_type` is a 64-bit unsigned type.\
    \ In this case, integral promotion on `size_type` is not performed; we only have\
    \ the rest of the usual arithmetic conversions to worry about. Since `size_type`\
    \ is wider than `int`, `size_type` has greater rank, which means that the `int`\
    \ is converted to the unsigned type `size_type`, and the addition happens with\
    \ the type `size_type`.\n\nFirst, we add -2 to `acc`. `-2` is converted to `size_type`\
    \ and wraps around to `std::numeric_limits<size_type>::max() - 1`. When added\
    \ to `acc`, which has the value `2`, we wrap around again to `0`.\n\nNext, we\
    \ add -3 to `acc`. `-3` is converted to `size_type` and wraps around to `std::numeric_limits<size_type>::max()\
    \ - 2`. When added to `acc`, which has the value `0`, the result is `std::numeric_limits<size_type>::max()\
    \ - 2`, which gets stored in `acc` as the final result. On a typical system with\
    \ 32-bit `int` and 64-bit `size_type`, the result would be `18446744073709551613`.\
    \ Again, we saw several wraparounds and a wrong result, but no undefined behavior.\n\
    \nHere’s a diagram of the types and conversions involved in the process. The first\
    \ value is converted to `size_type`, is added to `acc`, and the result gets stored\
    \ in `acc`. Then we go around one more time for the second value.\n\n![images/conversions3.drawio.png](images/conversions3.drawio.png)\n\
    \nThe `int` to `size_type` conversion has the potential to wrap around if value\
    \ is negative, which happens given the input in this puzzle. The `unsigned` addition\
    \ has the potential to wrap around if the result is too large (which does not\
    \ happen in this puzzle).\n\n### Are You Still There?\n\nI omitted many details\
    \ above, especially the exact rules resulting in these particular conversion sequences,\
    \ and still, the explanation got quite long. If you followed to the end, great,\
    \ you got the point. If you dropped off at some point though, no worries, as you\
    \ still got the point! The point being that reasoning about implicit conversions\
    \ between integers is complicated and best avoided in production code.\n\n###\
    \ What Can We Do?\n\nUnfortunately, none of the major compilers warn about this,\
    \ even with `-Wall` `-Wextra` for GCC and Clang, and `/Wall` for MSVC. Some compilers,\
    \ such as GCC and Clang, have additional options like `-Wsign-conversion`, which\
    \ are not included in `-Wall` or `-Wextra` and must be enabled individually. Unfortunately,\
    \ even after enabling them, you get no warnings for this particular puzzle. (You\
    \ would if the `accumulate` function template was defined in your own code rather\
    \ than in the standard library, though.)\n\n`Clang-tidy` is also unable to warn\
    \ about this, and undefined behavior sanitizer would only trigger if undefined\
    \ behavior actually happened during the execution of the program, which is not\
    \ the case.\n\nSo, for this particular puzzle, there’s not much help to get from\
    \ tools, and we just have to be aware of the potential problems when mixing integer\
    \ types and signedness. However, the following is still good advice and can help\
    \ in similar scenarios:\n\n| Recommendations |\n| --- |\n| ![images/aside-icons/tip.png](images/aside-icons/tip.png)\
    \ |  \n\n*   Don’t mix signed and unsigned types in arithmetic, assignments, or\
    \ comparisons.\n*   In addition to `-Wall` and `-Wextra`, manually enable options\
    \ like `-Wsign-conversion`.\n*   Use `clang-tidy` and sanitizers.\n*   Be aware\
    \ that warnings and tools will not always find all potential problems. |\n\n###\
    \ Further Reading\n\nThe Usual Arithmetic Confusions\n\n[https://shafik.github.io/c++/2021/12/30/usual_arithmetic_confusions.html](https://shafik.github.io/c++/2021/12/30/usual_arithmetic_confusions.html)\n\
