    \    ~Engine() { std::cout << \"Engine stopped\\n\"; }\n};\n\nstruct Machine {\n\
    \    Machine() { throw std::runtime_error{\"Failed to start machine\"}; }\n  \
    \  ~Machine() { std::cout << \"Machine stopped\\n\"; }\n\n    Engine engine_;\n\
    };\n\nint main() {\n    try {\n        Machine machine;\n    } catch (...) {\n\
    \    }\n}\n```\n\n| Guess the Output |\n| --- |\n| ![images/aside-icons/important.png](images/aside-icons/important.png)\
    \ | Try to guess what the output is before moving to the next page. |\n\n![images/hline.png](images/hline.png)\n\
    \nThe program displays the following output:\n\n```\nEngine stopped\n```\n![images/hline.png](images/hline.png)\n\
    \n### Discussion\n\nIn this puzzle, we have a class `Machine`, which contains\
    \ an `Engine`. But Machine throws in its constructor before it’s completely done\
    \ initializing. Does the engine get stopped? Does the Machine itself get stopped?\n\
    \nOne of the great things about C++ is that constructed objects get destroyed\
    \ automatically and deterministically (unless you manually call `new`, which these\
    \ days should be left to library authors). You’ll find no need for Python’s `with`\
    \ or C#’s `using`, and rarely a need for something like `finally`.\n\nBut only\
    \ constructed objects get destroyed, so what does it mean to be constructed? And\
    \ what happens in the case of “half-constructed” objects like the `Machine` instance\
    \ here, which throws during construction?\n\nAn object is only deemed to be constructed\
    \ when initialization has completed. The initialization of a class object goes\
    \ in this order:\n\n* Virtual base classes\n* Direct base classes\n* Non-static\
    \ data members (like `Machine::engine_`)\n* The constructor body\n\nSo when we’re\
    \ constructing the `Machine` object, we first initialize the `Engine` member.\
    \ As soon as this is done, `engine_` is deemed constructed and will eventually\
    \ have to be destroyed. Then we get to the `Machine` constructor body, which throws\
    \ an exception. The initialization of `Machine` did not complete, and it’s not\
    \ deemed constructed. Only the `Engine` destructor gets called, not the `Machine`\
    \ destructor.\n\nThis is very useful since you don’t have to think about cleaning\
    \ up half-initialized objects. Any initialized member like `engine_` gets destroyed\
    \ automatically; the rest don’t need to be since they were never constructed in\
    \ the first place. You do have to be careful, though, if you manually acquire\
    \ some resource in the constructor. In that case, you can’t rely on the destructor\
    \ to clean it up. For instance, if you call `new` and assign the pointer to a\
    \ member, you cannot rely on a `delete` in your destructor to clean it up. The\
    \ same goes for raw calls to function pairs like `open/close`.\n\nAs always, to\
    \ make your code more robust, avoid manually calling functions like `delete` and\
    \ `close`. Instead, use standard library types like `unique_ptr` or `fstream`\
    \ as members, which automatically clean up the managed resources. If you have\
    \ several such members, the ones that got, and only those, will be automatically\
    \ released in the case of a half-constructed object like machine.\n\nIf your class\
    \ manages a custom resource that doesn’t fit in a standard library type, such\
    \ as the engine in this puzzle that needs to be stopped, factor that responsibility\
    \ out to a separate small class like `Engine` instead of handling it manually\
    \ in the containing class. Then you don’t need to think about managing it at all;\
    \ it will always be destroyed if it was constructed.\n\n| Recommendations |\n\
    | --- |\n| ![images/aside-icons/tip.png](images/aside-icons/tip.png) | |\n\n*\
    \ Avoid manually managing resources; use standard library types like `unique_ptr`\
    \ and `fstream` as members.\n* For custom resources, factor out classes whose\
    \ only responsibility is managing resources of that kind. |\n\n### Further Reading\n\
    \nClass Initialization Order\n[https://en.cppreference.com/w/cpp/language/constructor](https://en.cppreference.com/w/cpp/language/constructor)\n\
    \n| Puzzle 13 | A Constant Struggle |\n[a-constant-struggle.cpp](http://media.pragprog.com/titles/akbrain/code/a-constant-struggle.cpp)\
    \ |\n\n```cpp\n#include <iostream>\n#include <stdexcept>\n\ntemplate <typename\
    \ T>\nvoid byValue(T t) {\n```\n"
