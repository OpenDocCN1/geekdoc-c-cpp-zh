  trans: "\n\n| ![images/aside-icons/important.png](img/important.png) | 在移动到下一页之前，尝试猜一下输出是什么。\
    \ |\n\n程序显示了如下输出：\n\n|  | 3 |\n\n### 讨论\n\n`Player` 结构体有一个成员 `points_`，用于跟踪玩家的分数。我们没有使用\
    \ `int` 这种基本类型来表示，而是使用了一个自定义类型 `Points`。这种技术通常被称为“强类型”，它可以使代码更易读并避免产生错误。例如，假设有一个函数\
    \ `do_something(int player_id, int points, int lives)`，很容易失误并将参数传递为 `player_id,\
    \ lives, points`，导致生命值数量被用作分数，反之亦然。当你为这些值使用独立的强类型时，这种错误会导致程序编译失败，而不是产生一个 bug（错误）。\n\
    \n这个谜题中的问题是，我们是否允许直接从 `int` 构建一个 `Player` 对象（就像我们在表达式 `Player player(3)` 中做的那样），还是我们需要手动创建一个强类型\
    \ `Points` 的对象并传递给 `Player` 构造函数。\n\n为了让 `Player player(3)` 运行，我们需要从 `int` 的隐式转换。只有没有标记为\
    \ `explicit` 的构造函数（即所谓的转换构造函数）才能参与隐式转换。`Player` 的构造函数被标记为 `explicit`，因此它不是转换构造函数，那么这种转换是如何运作的呢？\n\
    \n`Player player(3)` 是直接初始化的一个示例（`Player player{3}` 也是，但例如 `Player player = 3`\
    \ 则不是）。我喜欢认为我们正在直接调用 `Player` 的构造函数。在直接初始化中，使用重载解析来选择最佳构造函数。当我们从 `int` 直接初始化一个\
    \ `Player` 时，重载解析会尝试寻找从 `int` 到 `Player` 的每个构造函数的隐式转换序列。`Player` 只有一个接收 `Points`\
    \ 的构造函数，因此我们需要从 `int` 到 `Points` 的隐式转换。`Points` 的构造函数不是 `explicit`，所以它是一个转换构造函数，可以使用于隐式转换序列。`3`\
    \ 被隐式转换为 `Points`，然后这个 `Points` 对象被传递给 `Player` 的构造函数。\n\n`Player` 构造函数本身并没有参与隐式转换；记住，我们是直接调用它的。所以它是否为\
    \ `explicit` 并没有区别。\n\n另一方面，如果 `Points` 的构造函数是 `explicit` 的，那么它将不再是转换构造函数，并且无法用于隐式转换序列。我们不再不再能将\
    \ `int 3` 隐式转换为 `Points`，程序将无法编译。\n\n为你的强类型加上 `explicit` 构造函数会使代码稍微冗长，但也更健壮。回到\
    \ `do_something` 的例子，你现在必须写 `do_something(PlayerId{42}, Points{3}, Lives{1})`\
    \ 程序才能编译，而使用转换构造函数时，你仍然可能误写为 `do_something(42, 1, 3)` 程序依然可以编译。我也觉得前者更具读性。\n\n\
    | 拷贝初始化 vs. 直接初始化 |\n| --- |\n| ![images/aside-icons/note.png](img/note.png) |\
    \ 如果我们写成这样呢：Player player = 3 这种形式被称为拷贝初始化，与直接初始化略有不同。现在我们不再直接调用 `Player` 构造函数；而是尝试将\
    \ `int` 隐式转换为 `Player`。隐式转换序列只能包含一个用户定义的转换，但我们需要一个从 `int` 到 `Player` 的转换，然后是第二个从\
    \ `Player` 到 `Points` 的转换。因此，无论任何构造函数是否为 `explicit`，`Player player = 3` 永远无法编译。\
    \ |\n\n| 建议 |\n| --- |\n| ![images/aside-icons/tip.png](img/tip.png) | |\n\n-\
    \ 将单参数构造函数标记为 `explicit`，以避免意外的隐式转换。\n- 使用强类型代替基本类型以避免 bug。\n- 考虑使用强类型库，例如 Björn\
    \ Fahller 的 `strong_type`，以减少创建强类型时的样板代码。 |\n\n### 进阶阅读\n\n直接初始化\n[`en.cppreference.com/w/cpp/language/direct_initialization`](https://en.cppreference.com/w/cpp/language/direct_initialization)\n\
    \n拷贝初始化\n[`en.cppreference.com/w/cpp/language/copy_initialization`](https://en.cppreference.com/w/cpp/language/copy_initialization)\n\
    \nC++ 核心准则 C.46: 默认声明单参数构造函数为 explicit\n[`isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines#c46-by-default-declare-single-argument-constructors-explicit`](https://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines#c46-by-default-declare-single-argument-constructors-explicit)\
    \ |\n\n| 谜题 18 | 移出 (Moving Out) |\n[moving-out.cpp](http://media.pragprog.com/titles/akbrain/code/moving-out.cpp)\
    \ |\n\n```cpp\n#include <iostream>\n#include <string>\n\nint main() {\n    std::string\
    \ hello{\"Hello, World!\"};\n    std::string other(std::move(hello));\n    std::cout\
    \ << \"'\" << hello << \"'\";\n}\n```\n\n| 猜猜输出 |\n| --- |\n| ![images/aside-icons/important.png](img/important.png)\
    \ | 在移动到下一页之前，尝试猜一下输出是什么。 |\n\n程序具有未定义行为（unspecified behavior）！但它可能输出如下：\n\n|\
    \  | '' |\n\n### 讨论\n\n被移动过的对象（moved-from object）不应再次使用，因为资源已经从中移出，指针可能会指向已销毁的对象等等。\n\
    \n一个特定的被移动过的对象的行为取决于该类的实现者。实现者在这里有很大的自由度，但至少对象应该是安全的销毁的，这样当一个被移动过的局部变量离开作用域时，就不会发生任何问题。除非明确说明，否则作为用户，你不应该假设某个类提供了进一步的保证。\n\
    \nC++ 标准为标准库中的类提供了额外的保证，尽管如此：\n\n> C++ 标准库中定义的类型对象可以被移动。……除非另有说明，此类被移动过的对象应处于一个有效但未指定的状态。\n\
    \n`std::string` 没有做另行说明，因此被移动过的字符串被放置在“有效但未指定的状态”。但这意味着什么呢？\n\nC++ 标准提供了以下定义：\n\
    \n> (a) 对象的的值未指定，除非该对象满足不变性（invariants），且对对象的操作按照其类型指定的方式执行。\n\n所以，虽然我们不知道被移动过的字符串包含什么，但我们至少知道\
    \ `.size()` 返回的是其中剩余字符串的大小，`.empty()` 在当且仅当 `.size() == 0` 时为真，以此此类推。尽管如此，对象的实际状态是未指定的，我们无法确定输出是什么，因此最好完全避免使用被移动过的对象。\n\
    \n| std::string 移动构造函数的实现 |\n| --- |\n\n"
- fmt: "\nOne typical way to implement the move constructor for `std::string` is that\
    \ the new string “steals” the memory from the old string to avoid copying it.\
    \ It is then important that it’s not also possible to access this memory through\
    \ the old string object, or modification to one string would also affect the other.\
    \ It’s also important that the old string doesn’t attempt to free this memory\
    \ in its destructor. If `std::string` is implemented with a pointer to a string\
    \ buffer on the heap, one can, for instance, imagine that the move constructor\
    \ sets the old string’s buffer pointer to null. You can use similar techniques\
    \ to implement move operations for your own classes.\n\nSome implementations will\
    \ optimize short strings by storing the string inside the `std::string` object\
    \ itself instead of allocating a buffer on the heap, a technique known as Short\
    \ String Optimization. In these cases, it’s not possible for a move constructor\
    \ to steal the memory of the old string, and a copy is needed. One reasonable\
    \ valid state for such a moved-from string would be to still contain the original\
    \ string. I tested this on Windows, Mac, and Linux, both with long and short strings.\
    \ In all cases they output the empty string ”. But as always with unspecified\
    \ behavior, I won’t assume this to always be true. I will only assume that the\
    \ `std::string` invariants are met.\n\n### Recommendations\n\n- Do not use moved-from\
    \ objects (aside from destroying them).\n- In your own classes, try to make the\
    \ move constructors and move assignment operators place the object in a valid\
    \ state where invariants are still met.\n- If you can’t do that, at least make\
    \ sure it’s still safe to call the destructor.\n\n### Further Reading\n\n- `std::string`\
    \ Constructors: [https://en.cppreference.com/w/cpp/string/basic_string/basic_string](https://en.cppreference.com/w/cpp/string/basic_string/basic_string)\n\
    - Moved-from State of Library Types: [https://timsong-cpp.github.io/cppwp/std20/lib.types.movedfrom](https://timsong-cpp.github.io/cppwp/std20/lib.types.movedfrom)\n\
    - Valid but Unspecified State: [https://timsong-cpp.github.io/cppwp/std20/defns.valid](https://timsong-cpp.github.io/cppwp/std20/defns.valid)\n\
    \n### Puzzle 19: A Little Sum Thing\n\n[a-little-sum-thing.cpp](http://media.pragprog.com/titles/akbrain/code/a-little-sum-thing.cpp)\n\
    \n```cpp\n#include <iostream>\n#include <numeric>\n#include <vector>\n\nint main()\
    \ {\n    std::vector<int> v{-2, -3};\n    std::cout << std::accumulate(v.cbegin(),\
    \ v.cend(), v.size());\n}\n```\n\n#### Guess the Output\n\nTry to guess what the\
    \ output is before moving to the next page.\n\nThe program has implementation-defined\
    \ behavior! But it outputs a large number, like this one for instance:\n\n```\n\
    18446744073709551613\n```\n\n### Discussion\n\nThe size of the vector is 2. When\
    \ we add -2 and -3 to it, why is the result not -3?\n\nThe `std::accumulate` function\
    \ template is defined like so:\n\n```cpp\ntemplate<class InputIterator, class\
    \ T>\nconstexpr T accumulate(InputIterator first, InputIterator last, T init);\n\
    ```\n\n> Effects: computes its result by initializing the accumulator `acc` with\
    \ the initial value `init` and then modifies it with `acc = std::move(acc) + *i`\
    \ (…) for every iterator `i` in the range `[first, last)` in order.\n\nLet’s start\
    \ by deducing the template parameters. `InputIterator` will be deduced to the\
    \ iterator type for the vector, which isn’t interesting for this puzzle since\
    \ it’s only used for iterating. `T`, on the other hand, will be deduced to the\
    \ type of `std::vector<int>::size()`, which is key to the puzzle. `std::vector<int>::size()`\
    \ returns `size_type`, which is not specified in detail by the standard. It’s\
    \ only required to be an unsigned integer type, and as long as that requirement\
    \ is met, the implementation can choose whatever representation is natural to\
    \ use on that particular system.\n\nSo both the type of `init` and the return\
    \ type as well as the accumulator `acc` that’s inside `std::accumulate` will be\
    \ of this unsigned integer type `size_type`. When we add negative numbers to an\
    \ unsigned type, something is bound to go wrong. But what exactly? And, importantly,\
    \ is it undefined behavior?\n\nTwo error scenarios are worrisome:\n\n- When converting\
    \ a value of one integer type to another integer type if the value is out of range\
    \ for the new type. This is not as dangerous as it sounds, as the operation doesn’t\
    \ actually overflow but rather wraps around. This is true both for unsigned integers\
    \ and, as of C++20, also for signed integers. For example, an 8-bit signed integer\
    \ such as `int8_t` can represent values from -128 to 127. If I try to assign the\
    \ value 128 to it, which is one too large, it wraps around to -128. When a value\
    \ wraps around, you’re bound to get a wrong result, but at least it’s not undefined\
    \ behavior.\n- When doing arithmetic, if the result is out of range for the result\
    \ type. For unsigned integers, we again wrap around. For signed integers, however,\
    \ we get overflow, which is undefined behavior.\n\nSince we’re adding the negative\
    \ numbers -2 and -3 to our unsigned `acc`, we can at least expect some wraparound,\
    \ but can we expect overflow and thus undefined behavior? That depends on whether\
    \ we ever end up adding two signed integers whose sum is out of range for the\
    \ result type. Let’s have a closer look at what happens in `std::accumulate` to\
    \ see if that’s possible.\n\nThe algorithm starts by initializing the accumulator\
    \ `acc` with the size 2. `acc` is of type `T`, which we previously deduced to\
    \ the unspecified unsigned integer type `size_type`. We then add the signed ints\
    \ -2 and -3 to `acc`, one at a time. Finally, we return `acc`. These are all the\
    \ steps spelled out:\n\n```cpp\nsize_type acc = 2; // size_type is unsigned\n\
    acc = acc + -2; // Adding an unsigned and a negative signed number\nacc = acc\
    \ + -3; // Adding an unsigned and a negative signed number\nreturn acc;\n```\n\
    \nNow, what happens when we add the two signed ints -2 and -3 to the unknown unsigned\
    \ integer type `size_type`? In Puzzle 14, Puzzle 14, [Aristotle’s Sum of Parts](#f_0025.xhtml_chp.puzzle14),\
    \ we learned about the usual arithmetic conversions and integer promotions, which\
    \ also happen here.\n\nSince we don’t know the widths of `size_type` and `int`,\
    \ we need to consider three scenarios:\n\n### If size_type Fits in int\n\nIf `int`\
    \ can represent all of the values of `size_type`, `acc` gets promoted to `int`,\
    \ and the addition happens with the type `int`. Since `size_type` is unsigned,\
    \ this can only happen if `size_type` is smaller than `int`. It’s very unlikely\
    \ that an implementation would choose a `size_type` smaller than `int`, but it\
    \ would be okay according to the standard. Here’s what would happen in this scenario.\n\
    \nFirst, we add -2 to `acc`. After promoting `acc` from `size_type` to `int`,\
    \ the operands are of the same type (`int`), and no further conversion is needed.\
    \ We add 2 and -2 and get 0, which fits in the result type `int`. This `int` 0\
    \ gets converted back to `size_type` and stored in `acc`.\n\nNext, we add -3 to\
    \ `acc`. After promoting `acc` from `size_type` to `int`, we add 0 and -3 and\
    \ get -3, which again fits in the result type `int`. The `int` -3 gets converted\
    \ back to `size_type`. Since `size_type` is unsigned, -3 wraps around to `std::numeric_limits<size_type>::max()`\
    \ - 2, which gets stored in `acc` as the final result and returned. If `size_type`\
    \ was, for instance, `uint16_t`, the result would be 65533. This produced a wraparound\
    \ and a wrong result, but no undefined behavior.\n"
