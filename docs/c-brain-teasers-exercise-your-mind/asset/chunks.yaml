- fmt: "\nThere we discussed that the function call `getResource()` is a prvalue,\
    \ which does not result in a temporary `Resource`. Instead, the return value is\
    \ created directly in the `resource1` object, and no copy is allowed to be made.\n\
    \nThe expression `getName()` in this puzzle is also a prvalue, so the returned\
    \ object doesn’t even exist until we assign it to something, which we don’t do!\n\
    \nIf no object exists, how can we then copy-assign `name` to it? Temporary materialization\
    \ to the rescue. The reason that function calls are prvalues and don’t create\
    \ objects at all is to avoid unnecessary copies. In the preceding `Resource` example,\
    \ creation of an actual object is delayed until we assign the result of `getResource()`\
    \ to `resource1`. But sometimes we call a function just for its side effects and\
    \ don’t assign the result to anything, like when we call `getName()` in this puzzle.\
    \ When we don’t assign the result of an expression to anything, we call it a discarded-value\
    \ expression. We still want an object to be created, so a temporary is materialized.\
    \ That’s what happens here—the prvalue expression `getName()` creates a temporary\
    \ `std::string`.\n\nNow that we have an actual `std::string` temporary, we can\
    \ copy-assign `name` to it just fine.\n\n### Binding References to Prvalues\n\n\
    | | --- |\n| ![images/aside-icons/note.png](images/aside-icons/note.png) | Another\
    \ case where temporary materialization is important is when you bind a reference\
    \ to a prvalue. Imagine, for instance, we had a function like one of these:\n\n\
    ```cpp\nvoid useName(const std::string& name_ref);\nvoid useName(std::string&&\
    \ name_ref);\n```\n\nIf we then did `useName(getName());`, the reference parameters\
    \ `name_ref` would need to have actual objects to bind to. And that’s indeed what\
    \ happens when you bind a reference to prvalue—a temporary is materialized. |\n\
    \n### Further Reading\n\nLvalues, Rvalues, Glvalues, Prvalues, Xvalues, Help!\n\
    \n[https://blog.knatten.org/2018/03/09/lvalues-rvalues-glvalues-prvalues-xvalues-help/](https://blog.knatten.org/2018/03/09/lvalues-rvalues-glvalues-prvalues-xvalues-help/)\n\
    \n### Puzzle 11 | What’s the Time of Death?\n\n[whats-the-time-of-death.cpp](http://media.pragprog.com/titles/akbrain/code/whats-the-time-of-death.cpp)\n\
    \n```cpp\n#include <iostream>\n\nstruct MemoryArea {\n    MemoryArea(int number)\
    \ : number_(number) {}\n    ~MemoryArea() { std::cout << \"Freed memory area \"\
    \ << number_ << \"\\n\"; }\n\n    int number_;\n};\n\nMemoryArea getMemory(int\
    \ number) {\n    return MemoryArea{number};\n}\n\nstruct DataSource {\n    DataSource(const\
    \ MemoryArea &memoryArea)\n    : memoryArea_(memoryArea) {}\n    const MemoryArea\
    \ &memoryArea_;\n};\n\nint main() {\n    const auto &reference1 = getMemory(1);\n\
    \    std::cout << \"Bound reference 1\\n\";\n    const auto &reference2 = getMemory(2).number_;\n\
    \    std::cout << \"Bound reference 2\\n\";\n    const auto &reference3 = DataSource(getMemory(3));\n\
    \    std::cout << \"Bound reference 3\\n\";\n}\n```\n\n**Guess the Output**\n\n\
    | | --- |\n| ![images/aside-icons/important.png](images/aside-icons/important.png)\
    \ | Try to guess what the output is before moving to the next page. |\n\nThe program\
    \ displays the following output:\n\n| Bound reference 1 |\n| Bound reference 2\
    \ |\n| Freed memory area 3 |\n| Bound reference 3 |\n| Freed memory area 2 |\n\
    | Freed memory area 1 |\n\n### Discussion\n\nAs we’ve seen a few times by now,\
    \ a function call is a prvalue, and no object exists until that prvalue is used\
    \ to initialize one. In the previous puzzle we also saw an exception to this rule:\
    \ when we didn’t use the prvalue to initialize an object, we called that a discarded-value\
    \ expression and learned that a temporary is then materialized.\n\nIn this puzzle,\
    \ the results of the function call expressions aren’t assigned to objects as in\
    \ Puzzle 9, [Counting Copies], but neither are they discarded as in Puzzle 10,\
    \ [A Strange Assignment]. Instead, we’re binding references to them in various\
    \ ways. What happens then?\n\n*   For the first call, we bind the reference `reference1`\
    \ directly to the prvalue. A temporary is materialized, as we briefly touched\
    \ upon in Puzzle 10.\n*   For the second call, we access the member `number_`\
    \ on a class prvalue. This is another case where a temporary needs to be materialized.\
    \ Otherwise, no object would be there for us to access the member of.\n*   For\
    \ the third call, we pass the prvalue to the `DataSource` constructor. This is\
    \ actually the same case as for the first call; the constructor parameter `memoryArea`\
    \ binds to the prvalue, and a temporary is materialized.\n\nSo a temporary is\
    \ materialized for each of the three calls to `getMemory`. But for how long do\
    \ they stay alive?\n\nNormally, temporaries get destroyed at the end of the full-expressions\
    \ in which they were created. In the cases in this puzzle, that means they would\
    \ be destroyed at the end of the line. However, the lifetime of temporaries is\
    \ extended in certain cases. This is somewhat of a relic of the past, which is\
    \ no longer very useful. For instance, for `const auto &reference1 = getMemory(1);`,\
    \ we’d be much better off just writing `const auto object1 = getMemory(1);`. Thanks\
    \ to the new rules for prvalues in C++17, there’d still be no extra copy, and\
    \ we wouldn’t be asking all these questions. Fewer questions means better code!\n\
    \nSo what exactly are the rules for lifetime extension? Although others exist,\
    \ by far the most common, and the ones that matter here, are these:\n\n*   If\
    \ you bind a reference to an object you obtained through temporary materialization,\
    \ that temporary object persists for the lifetime of the reference.\n*   If you\
    \ bind a reference to a member of an object you obtained through temporary materialization,\
    \ the full temporary object (not just the member) persists for the lifetime of\
    \ the reference.\n\nLet’s examine each line:\n\n```cpp\nconst auto &reference1\
    \ = getMemory(1);\n```\n\nWe bind `reference1` to the temporary object we got\
    \ from `getMemory(1)`. Temporary 1 persists for the lifetime of `reference1`—that\
    \ is, to the end of `main`.\n\n```cpp\nstd::cout << \"Bound reference 1\\n\";\n\
    ```\n\nBound reference 1 is printed.\n\n```cpp\nconst auto &reference2 = getMemory(2).number_;\n\
    ```\n\nWe bind `reference2` to the member `number_` of the temporary object we\
    \ got from `getMemory(2)`. The full temporary object 2 (not just the member) persists\
    \ for the lifetime of `reference2`—that is, to the end of `main`.\n\n```cpp\n\
    std::cout << \"Bound reference 2\\n\";\n```\n\nBound reference 2 is printed.\n\
    \n```cpp\nconst auto &reference3 = DataSource(getMemory(3));\n```\n\nWe bind the\
    \ constructor parameter `memoryArea` to the temporary object we got from `getMemory(3)`.\
    \ This is used to create a new object of type `DataSource`. Then we bind `reference3`\
    \ to the temporary `DataSource` which gets materialized when we call its constructor.\
    \ The temporary `DataSource` persists for the lifetime of `reference3`—that is,\
    \ to the end of `main`.\n\nBut wait, it’s a trap! As soon as the `DataSource`\
    \ object has been constructed, the `memoryArea` parameter is gone. It doesn’t\
    \ help that we assign it to the `memoryArea_` member; that’s a different reference!\
    \ So the temporary `MemoryArea` 3 does not get its lifetime extended, and the\
    \ memory is freed at the end of the line. Destroyed 3 is printed, and the `MemoryArea`\
    \ that the `DataSource` was planning to read from has already been freed and is\
    \ now a dangling reference.\n\n```cpp\nstd::cout << \"Bound reference 3\\n\";\n\
    ```\n\nBound reference 3 is printed.\n"
