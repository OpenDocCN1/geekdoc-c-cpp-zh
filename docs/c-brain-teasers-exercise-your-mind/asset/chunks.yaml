    \n### Discussion\n\nI know, I know. This is supposed to be a fun book. But sometimes\
    \ we need to talk about sad topics like this.\n\nAs you’ve figured out by now,\
    \ the type of char + char is unfortunately not char. So what is it, then?\n\n\
    For many binary operations, such as +, -, *, /, >, ==, ^, and more, the operands\
    \ must be of the same type. You don’t have to ensure that yourself, though; C++\
    \ will take care of it. C++ is in fact very eager to implicitly convert between\
    \ types when you’re not looking, and this is one of the more confusing cases.\
    \ Meet the usual arithmetic conversions.\n\nThe usual arithmetic conversions are\
    \ performed on the operands to these operators to ensure both operands are of\
    \ the same type. This common type is also the type of the result. For instance,\
    \ if you add a float and an int, the int is first converted to a float, and the\
    \ result is a float. And if you add a float and a double, the float is first converted\
    \ to a double, and the result is a double. Makes sense so far.\n\nThe confusion\
    \ starts when both operands are of integer types, especially if they are of the\
    \ same type. For instance, if you add a char and an int, the char is first converted\
    \ to an int, and the result is an int. It still makes sense. But what if you add\
    \ a char and a short? Rather than converting the char to a short, both operands\
    \ are converted to an int (usually—see the following). And it gets worse: if you\
    \ add two chars, which are already of the same type, they’re still converted to\
    \ a different type!"
