  raw: "Notice that in neither of the preceding cases was the explicit function template\
    \ specialization even involved in overload resolution—it never is. This can be\
    \ non-intuitive, so in general it’s better to use non-template overloads than\
    \ explicit specializations. See the first two links under Further Reading for\
    \ more details and some even worse examples of these kinds of confusions.\n\n\
    | Recommendations |\n\n| --- |\n\n| ![images/aside-icons/tip.png](images/aside-icons/tip.png)\
    \ |  \n\n*   Prefer non-template overloads over explicit specializations.\n\n\
    \ |\n\n### Further Reading\n\nWhy Not Specialize Function Templates?\n\n[http://www.gotw.ca/publications/mill17.htm](http://www.gotw.ca/publications/mill17.htm)\n\
    \nFull Specialization of Function Templates\n\n[https://www.modernescpp.com/index.php/full-specialization-of-function-templates/](https://www.modernescpp.com/index.php/full-specialization-of-function-templates/)\n\
    \nC++ Core Guideline T.144: Don’t Specialize Function Templates\n\n[https://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines#t144-dont-specialize-function-templates](https://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines#t144-dont-specialize-function-templates)\n\
    \n| Puzzle 25 | Weakly Typed, Strongly Puzzling |\n\n[weakly-typed-strongly-puzzling.cpp](http://media.pragprog.com/titles/akbrain/code/weakly-typed-strongly-puzzling.cpp)\n\
    \n| ​  | ​*#include <iostream>*​ |\n\n| ​  |  |\n\n| ​  | ​**int**​ ​**main**​()\
    \ |\n\n| ​  | { |\n\n| ​  | std::cout << +!!​*\"\"*​; |\n\n| ​  | } |\n\n| Guess\
    \ the Output |\n\n| --- |\n\n| ![images/aside-icons/important.png](images/aside-icons/important.png)\
    \ | Try to guess what the output is before moving to the next page. |\n\n![images/hline.png](images/hline.png)\n\
    \nThe program displays the following output:\n\n| ​  | 1 |\n\n![images/hline.png](images/hline.png)\n\
    \n### Discussion\n\nWait, what? Is this legal C++? What does it even mean, and\
    \ why does it print 1?\n\nWhile C++ is a statically typed language, it’s not particularly\
    \ strongly typed. As we’ve seen throughout the book, C++ is, in fact, very eager\
    \ to implicitly convert between types without you explicitly telling it to. For\
    \ instance, in Puzzle 14, Puzzle 14, [​*Aristotle’s Sum of Parts*​](#f_0025.xhtml_chp.puzzle14),\
    \ we saw how the sum of two chars is not a char; in Puzzle 17, Puzzle 17, [​*A\
    \ Strong Point*​](#f_0028.xhtml_chp.puzzle17), we saw how you should declare your\
    \ constructors explicit to avoid them taking part in implicit conversions; and\
    \ in Puzzle 19, Puzzle 19, [​*A Little Sum Thing*​](#f_0030.xhtml_chp.puzzle19),\
    \ we saw how implicit conversions between arithmetic types can lead to unexpected\
    \ results.\n\nThis eagerness is something we inherited back in the day when C++\
    \ was designed as an extension of C. If we did it over today, this abundance of\
    \ implicit conversions would be high on the list of things we’d want to change.\n\
    \nSo which implicit conversions are in play here, what is the final type of this\
    \ expression, and why is the result 1?\n\nLet’s start to the right, with the expression\
    \ \"\". This is a string literal, and as we discussed in Puzzle 2, Puzzle 2, [​*String\
    \ Theory*​](#f_0013.xhtml_chp.puzzle02), the type of a string literal is “array\
    \ of n const char,” with n being 1 in this case (for the implicit \\0 terminator).\n\
    \nNext is the ! operator, which negates its operand. But how do you negate an\
    \ array of characters? That doesn’t make sense, does it? Indeed it doesn’t, but\
    \ the operand to the ! operator is contextually converted to bool before being\
    \ negated. Converting an array to bool doesn’t make sense either, but as we saw\
    \ in Puzzle 2, Puzzle 2, [​*String Theory*​](#f_0013.xhtml_chp.puzzle02), arrays\
    \ can be implicitly converted to pointers, and pointers can again be converted\
    \ to bool. When a pointer is converted to bool, it converts to false if it’s a\
    \ null-pointer and to true otherwise. Since the pointer in this case is non-null\
    \ (it points to our string literal), it converts to true. Finally, the ! operator\
    \ negates this, so we arrive at false. One could argue that this entire conversion\
    \ sequence doesn’t really make sense either, and I’d agree, but at least we can\
    \ understand how each step works and how they combine to arrive at this result.\n\
    \nNext up is another !, which this time simply negates our bool false, giving\
    \ us the bool true.\n\nFinally, there’s the unary +. The operand to unary + goes\
    \ through integral promotions, which for bool means converting false to 0 and\
    \ true to 1. The operator itself doesn’t do anything; its result is the same as\
    \ its operand (after promotion). So our bool true finally turns into the int 1,\
    \ which gets printed.\n\nWhether or not the compiler should warn about any of\
    \ this is another discussion, but none of the major ones do, even with -Wall -Wextra\
    \ for GCC and Clang, and /Wall for MSVC. Your compiler might be able to provide\
    \ some warnings, though, if you turn those warnings on explicitly. For instance,\
    \ Clang will warn about the string-to-bool conversion if given the -Wstring-conversion\
    \ option (which is not included in -Wall or -Wextra). Check your compiler’s documentation\
    \ for the list of warnings it supports.\n\n| Recommendations |\n\n| --- |\n\n\
    | ![images/aside-icons/tip.png](images/aside-icons/tip.png) |  \n\n*   Turn on\
    \ as many warnings as you can.\n\n*   Be aware that not all warnings are included\
    \ in the maximum warning levels for each compiler.\n\n*   Don’t write code like\
    \ this in real life!\n\n |\n\n### Further Reading\n\nCppReference on Implicit\
    \ Conversions\n\n[https://en.cppreference.com/w/cpp/language/implicit_conversion](https://en.cppreference.com/w/cpp/language/implicit_conversion)\n\
    \nImplicit Conversion Sequences in the Standard\n\n[https://timsong-cpp.github.io/cppwp/std20/over.best.ics](https://timsong-cpp.github.io/cppwp/std20/over.best.ics)\n\
    \n#### Footnotes\n\n[[6]](#f_0018.xhtml_FNPTR-6)\n\n[https://en.cppreference.com/w/cpp/language/initialization](https://en.cppreference.com/w/cpp/language/initialization)\n\
    \n[[7]](#f_0018.xhtml_FNPTR-7)\n\n[https://timsong-cpp.github.io/cppwp/std20/basic.start](https://timsong-cpp.github.io/cppwp/std20/basic.start)\n\
    \n[[8]](#f_0018.xhtml_FNPTR-8)\n\n[https://en.cppreference.com/w/cpp/language/siof](https://en.cppreference.com/w/cpp/language/siof)\n\
    \n[[9]](#f_0019.xhtml_FNPTR-9)\n\n[https://blog.knatten.org/2018/03/09/lvalues-rvalues-glvalues-prvalues-xvalues-help/](https://blog.knatten.org/2018/03/09/lvalues-rvalues-glvalues-prvalues-xvalues-help/)\n\
    \n[[10]](#f_0020.xhtml_FNPTR-10)\n\n[https://itanium-cxx-abi.github.io/cxx-abi/abi.html](https://itanium-cxx-abi.github.io/cxx-abi/abi.html)\n\
    \n[[11]](#f_0020.xhtml_FNPTR-11)\n\n[https://blog.knatten.org/2011/08/26/dont-be-afraid-of-returning-by-value-know-the-return-value-optimization/](https://blog.knatten.org/2011/08/26/dont-be-afraid-of-returning-by-value-know-the-return-value-optimization/)\n\
    \n[[12]](#f_0022.xhtml_FNPTR-12)\n\n[https://timsong-cpp.github.io/cppwp/std20/stmt.ranged](https://timsong-cpp.github.io/cppwp/std20/stmt.ranged)\n\
    \n[[13]](#f_0028.xhtml_FNPTR-13)\n\n[https://github.com/rollbear/strong_type](https://github.com/rollbear/strong_type)\n\
    \n[[14]](#f_0030.xhtml_FNPTR-14)\n\n[https://timsong-cpp.github.io/cppwp/std20/expr.arith.conv](https://timsong-cpp.github.io/cppwp/std20/expr.arith.conv)\n\
    \n[[15]](#f_0033.xhtml_FNPTR-15)\n\n[https://en.wikipedia.org/wiki/Curiously_recurring_template_pattern](https://en.wikipedia.org/wiki/Curiously_recurring_template_pattern)\n\
    \n[[16]](#f_0034.xhtml_FNPTR-16)\n\n[https://www.godbolt.org/z/P43cETdWd](https://www.godbolt.org/z/P43cETdWd)\n\
    \nThank you!\n\nWe hope you enjoyed this book and that you’re already thinking\
    \ about what you want to learn next. To help make that decision easier, we’re\
    \ offering you this gift.\n\nHead on over to [https://pragprog.com](https://pragprog.com)\
    \ right now, and use the coupon code BUYANOTHER2024 to save 30% on your next ebook.\
    \ Offer is void where prohibited or restricted. This offer does not apply to any\
    \ edition of The Pragmatic Programmer ebook."
