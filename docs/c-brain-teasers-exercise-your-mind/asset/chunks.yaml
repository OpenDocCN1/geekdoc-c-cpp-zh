  trans: "\n\n首先，我要感谢 Olve Maudal 和 ACCU，是他们在 2013 年的 ACCU 会议上启发我创建了 `CppQuiz.org`[[2]](#f_0005.xhtml_FOOTNOTE-2)。我还要感谢多年年来在内容、实现和错误报告方面为\
    \ `CppQuiz.org` 做出贡献的每个人。\n\n非常感谢我的编辑 Sandra Williams，她在一路上提供了至关重要的帮助。没有了你的指导、支持和建议，这本书将会单薄许多。还要感谢\
    \ Margaret Eldridge 代表出版社与我联系，感谢 Frances Buontempo 为我们引见介绍。\n\n我很幸运能得到我所认识的一些顶尖\
    \ C++ 人士的帮助。感谢 Daniela Engert、Björn Fahller、Olve Maudal、Karthik Nishanth、Tom Schultz、Tina\
    \ Ulbrich、Sergei Vasilchenko 和 Piotr Wierciński 你们在技术审查方面提供的帮助！\n\n最后，我要感谢我的妻子\
    \ Charlotte，她的支持让我能够投入编写此书所需的时间和精力，并感谢 Kristiane 和 Sebastian 的鼓励。\n\n### 脚注\n\n\
    [[2]](#f_0005.xhtml_FNPTR-2)\n\n[`cppquiz.org`](https://cppquiz.org)\n\n版权 © 2024,\
    \ The Pragmatic Bookshelf.\n\n# 前言\n\nC++ 是使用最广泛、最古老的编程语言之一。它以把所有默认行为搞错而闻名，而且正如\
    \ C++ 社区著名的例子所说，它能让你鼻子里飞出恶魔。[[3]](#f_0010.xhtml_FOOTNOTE-3)) 你找不到更适合编程脑筋急转弯的书了！\n\
    \n通过 25 个谜题，我们将探索 C++ 底工作的，包括它的一些重要特性。为了充分利用这本书，你应该具有一些编写 C++ 的经验，并熟悉语言的基础，包括简单的面向对象编程和模板。\n\
    \n完成这本书后，你将对初始化、生命周期、重载解析、隐式转换、继承、未定义行为等主题有更深入的理解。但重要的是，我希望你对 C++ 的真实工作原理产生好奇心，即使只有少数几个答案能涵盖在这本书里。\n\
    \n## 如何使用这本书\n\n书中包含了 25 个 C++ 谜题，并附有答案和解释。大多数将是格式良好的程序，C++ 标准保证其输出。然而，某些程序可能存在编译错误，另一些可能存在未定义或未指定的行为。你的任务是找出在符合标准的\
    \ C++ 实现上编译并运行每个谜题中的程序时会发生什么。\n\n以这个虚拟的谜题为例，它是一个带有 `main` 函数的完整 C++ 程序：\n\n```cpp\n\
    #include <iostream>\n\nint main() {\n  std::cout << (1 < 2);\n}\n```\n\n你的任务是阅读代码，并尝试猜测程序在编译运行时的输出会是什么。在翻页查看答案之前，请务必自己尝试一下！\n\
    \n请注意以下技术细节：\n\n* 为了简洁起见，我定义的 `main` 没有参数（没有 `argc` / `argv`），且没有显式返回数值。这些都是可选的，省略它们会让谜题更容易读。\n\
    * 我在所有的谜题中使用 `struct` 替代了 `class`。这在语义上没有区别——`struct` 的成员默认可见性是公有的而不是私有的，所以我们不需要到处写\
    \ `public:`。\n* 像 C++ 中一常一样，`bool` 默认打印为 `1` 和 `0`，而不是 `true` 和 `false`。\n\n该谜题的答案是\
    \ `1` 小于 `2`，所以程序打印 `1`（代表真）。\n\n然而，答对答案只有一半乐趣。另一半是理解它为什么那样运行。谜题是学习更多 C++ 底工作原理的借口。我鼓励你仔细阅读解释，直到理解它们。\n\
    \n## 未定义行为 (Undefined Behavior)\n\n某些谜题可能包含未定义行为。未定义行为是在程序执行期间发生坏事时的术语，编译器无法（或更具体地说，不需要）检测到它。例如，我们可能会访问数组边界外的元素，或者符号整数的算术表达式可能会溢出。在这些情况下，C++\
    \ 标准对实现没有任何限制，任何事情都可能发生，包括鼻恶魔。如果一个谜题有未定义行为，你的任务不仅要识别出未定义行为，还要猜测在典型系统上实际上会发生什么。它是真的让恶魔从鼻子里飞出来，还是发生了特定的事情？\n\
    \n再次，让我们来看一个例子：\n\n```cpp\n#include <iostream>\n#include <limits>\n\nint main()\
    \ {\n  std::cout << std::numeric_limits<int>::max() + 1;\n}\n```\n\n算术中的符号整数溢出是未定义行为，所以如果你识别出了这一点，你就成功了一半！\n\
    \n对未定义行为情况下会发生什么做假设是一个坏主意。所以让我们接着做这件事吧！对于任何具有未定义行为的谜题，另一半任务是找出在你的电脑上运行该程序会发生什么。我的电脑对符号整数使用补码（C++20\
    \ 之后的所有标准实现也是如此），我的 CPU 在溢出时不会产生异常。因此，当我给最大的正整数加 `1` 时，值直接回绕到最小负整数。由于我的系统使用 32\
    \ 位 `ints`，程序打印 `-2147483648`。你不需要知道那个精确数值，但如果你猜到会打印最小负整数，你就解决了它！\n\n| 不要要在家里这样做\
    \ |\n| --- |\n| ![images/aside-icons/warning.png](img/warning.png) | 猜测或测试未定义行为情况下发生什么是一个有趣的练习，可以让你更多地了解\
    \ C++ 在你平台上的工作方式。它还可能让你在真实程序中看到某些错误模式发生时识别出它们。但不要根据你的发现就对你的真实程序做任何假设！你的假设在其他电脑上、升级编译器后或当你使用不同的优化设置编译时可能是不成立。如果编译器能证明存在未定义行为，它甚至允许从你的代码中移除错误检查！\
    \ |\n\n## 未指定的和实现定义的行为 (Unspecified and Implementation-Defined Behavior)\n\nC++\
    \ 标准并没有严格规定所有内容；它为实现留了一些自由空间。以下是一些例子：\n\n* 整数类型的具体大小\n* 函数参数的求值顺序\n* 全局变量的初始化顺序\n\
    \n这允许每个实现根据该特定系统做出最合理的选择。\n\n大多数程序都具有一些未指定的或实现定义的行为；这并不是 bug。而且与未定义行为相反，恶魔不会从你鼻子里飞出来。只是不同的实现在允许的行为范围内表现可能略有不同。\n\
    \n如果一个谜题有未指定的或实现定义的行为，请尝试也猜一下典型的行为是什么。\n\n## 动手实践代码\n\n学习任何与编程相关知识最重要的部分就是自己动手。书中的代码可以在\
    \ The Pragmatic Bookshelf 的主页找到[[4]](#f_0010.xhtml_FOOTNOTE-4)。你可以通过在你喜爱的 IDE\
    \ 或命令行中打开 `CMakeLists.txt` 来本地构建它：\n\n```bash\nmkdir build\ncd build\ncmake ..\n\
    cmake --build .\n```\n\n该项目每个谜题包含一个 `.cpp` 文件，每个文件生成一个二进制文件，命名均与书中对应的谜题相同。\n\n"
- fmt: "\nYou can also try the code directly in your browser by pasting it into an\
    \ online compiler. I highly recommend Compiler Explorer,[[5]](#f_0010.xhtml_FOOTNOTE-5)\
    \ where you can choose from and compare different compiler versions and architectures,\
    \ try out different optimization levels, and add other compiler flags, sanitizer\
    \ options, and so forth.\n\nLet’s get started! Oh, and beware of the demons.\n\
    \n## Footnotes\n\n[[3]](#f_0006.xhtml_FNPTR-3)\n\n[http://catb.org/jargon/html/N/nasal-demons.html](http://catb.org/jargon/html/N/nasal-demons.html)\n\
    \n[[4]](#f_0010.xhtml_FNPTR-4)\n\n[https://pragprog.com/titles/akbrain](https://pragprog.com/titles/akbrain)\n\
    \n[[5]](#f_0010.xhtml_FNPTR-5)\n\n[https://godbolt.org](https://godbolt.org)\n\
    \nCopyright © 2024, The Pragmatic Bookshelf.\n\n# Part 1\n\nC++ Brain Teasers\n\
    \n### Puzzle 1: How Many Degrees?\n\n[how-many-degrees.cpp](http://media.pragprog.com/titles/akbrain/code/how-many-degrees.cpp)\n\
    \n```cpp\n#include <iostream>\nstruct Degrees {\n  Degrees() : degrees_(0) {\n\
    \    std::cout << \"Default constructed\\n\";\n  }\n  Degrees(double degrees)\
    \ : degrees_(degrees) {\n    std::cout << \"Constructed with \" << degrees_ <<\
    \ \"\\n\";\n  }\n  double degrees_;\n};\n\nstruct Position {\n  Position() : latitude_{1}\
    \ { longitude_ = Degrees{2}; }\n  Degrees latitude_;\n  Degrees longitude_;\n\
    };\n\nint main() {\n  Position position;\n}\n```\n\n**Guess the Output**\n![images/aside-icons/important.png](images/aside-icons/important.png)\
    \ Try to guess what the output is before moving to the next page.\n\nThe program\
    \ displays the following output:\n\n```\nConstructed with 1\nDefault constructed\n\
    Constructed with 2\n```\n\n#### Discussion\n\nThe struct `Position` has two members\
    \ of type `Degrees`. One is initialized in the member initializer list, and one\
    \ in the constructor body. So why do we see three `Degrees` objects being constructed?\n\
    \nAll class members are initialized before we get to the constructor body. If\
    \ you explicitly initialize the member, as we do for `latitude_`, that’s the initialization\
    \ that’ll be used. If you don’t, as is the case for `longitude_`, the member will\
    \ instead be default-initialized, which is why we see the line Default constructed\
    \ being printed. After all members have been initialized, we finally enter the\
    \ constructor body, initialize a temporary `Degrees{2}`, and then copy-assign\
    \ it to the previously default-initialized `longitude_`.\n\nNote that instead\
    \ of explicitly initializing the member in the member initializer list, you can\
    \ use a default member initializer directly in the member declaration, like so:\n\
    \n```cpp\nstruct Position {\n  Position() { longitude = Degrees{2}; }\n  Degrees\
    \ latitude{1}; // Default member initializer\n  Degrees longitude;\n};\n```\n\n\
    Using a default member initializer can be a good idea if you have several constructors.\
    \ Then you don’t have to remember to include that member in every member initializer\
    \ list.\n\n#### Further Reading\nConstructors and Member Initializer Lists\n[https://en.cppreference.com/w/cpp/language/constructor](https://en.cppreference.com/w/cpp/language/constructor)\n\
    \n### Puzzle 2: String Theory\n\n[string-theory.cpp](http://media.pragprog.com/titles/akbrain/code/string-theory.cpp)\n\
    \n```cpp\n#include <iostream>\n#include <string>\nvoid serialize(const void*)\
    \ { std::cout << \"const void*\"; }\nvoid serialize(const std::string&) { std::cout\
    \ << \"const string&\"; }\n\nint main() {\n  serialize(\"hello world\");\n}\n\
    ```\n\n**Guess the Output**\n![images/aside-icons/important.png](images/aside-icons/important.png)\
    \ Try to guess what the output is before moving to the next page.\n\nThe program\
    \ displays the following output:\n\n```\nconst void*\n```\n\n#### Discussion\n\
    \nWhy does passing a string to `serialize` cause the overload taking a void pointer\
    \ to be called rather than the overload taking a string?\n\nWhen we’re calling\
    \ a function with multiple overloads, the compiler uses a process called overload\
    \ resolution to figure out which one is the best fit. The compiler does this by\
    \ attempting to convert each function argument to the corresponding parameter\
    \ type for each overload. Some conversions are better than others, and the best\
    \ conversion is if the argument is already of the correct type.\n\nAll the overloads\
    \ where all arguments can be successfully converted are added to a set of viable\
    \ functions. Then the compiler needs to figure out which overload to select from\
    \ this set. If an overload has a better conversion for at least one argument and\
    \ not a worse one for any of the other arguments, this overload is deemed to be\
    \ the best viable function and is selected by overload resolution. If no overload\
    \ is better than all the others, the call is ill-formed and fails to compile.\n\
    \nHave a look at this example:\n\n```cpp\nserialize(int, int); // 1\nserialize(float,\
    \ int); // 2\n```\n\nGiven these two overloads, suppose you call `serialize` like\
    \ this:\n\n```cpp\nserialize(1, 2);\n```\n\nBoth overloads of `serialize` are\
    \ viable. But the first overload has a better conversion for the first argument\
    \ (`int → int` vs `int → float`) and not a worse conversion for the second argument\
    \ (`int → int`), so it is selected as the best viable function. \n\nThe puzzle\
    \ is a bit simpler than this example since both overloads of `serialize` only\
    \ have one parameter. The first takes `const void*` and the second takes `const\
    \ std::string&`. What does the conversion look like for each of the overloads?\n\
    \n`std::string` is a class in the standard library. It’ll typically allocate memory\
    \ on the heap (unless the string is very small) and allows the string to grow\
    \ or be otherwise modified at runtime.\n\nHowever, the string `\"hello world\"\
    ` is not `std::string` but a simple string literal. String literals are plain\
    \ C-style arrays of chars which get baked into your binary by the linker and cannot\
    \ be modified at runtime. A string literal has the type `array of const char`.\
    \ `\"hello world\"` has 11 characters plus a terminating `\\0`, so its type is\
    \ `array of 12 const char`.\n\nSince the argument `\"hello world\"` is neither\
    \ a `const void*` nor a `std::string` but an `array of 12 const char`, a conversion\
    \ is needed for both overloads. If an implicit conversion exists from the argument\
    \ to the parameter type, that overload is added to the set of viable functions.\
    \ Otherwise, the overload is ignored.\n\nLet’s examine the first overload and\
    \ see if `array of 12 const char` can be implicitly converted to `const void*`.\
    \ The first thing that happens is that the array gets converted to a pointer.\
    \ Any `array of N T` can be converted to a `pointer to T` pointing to the first\
    \ element. So now our `array of 12 const char` has turned into a `pointer to const\
    \ char`.\n\nNext, any `pointer to cv T` (where `cv` means `const`, `volatile`,\
    \ `const volatile`, or none of these) can be converted to `pointer to cv void`.\
    \ So now our `pointer to const char` has turned into a `pointer to const void`,\
    \ which is exactly what the first overload expects.\n"
