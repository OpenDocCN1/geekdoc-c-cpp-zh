    \nThe program displays the following output:\n\n| ​  | template |\n\n| ​  | normal\
    \ function |\n\n![images/hline.png](images/hline.png)\n\n### Discussion\n\nYou\
    \ might remember our serialization library from Puzzle 2, Puzzle 2, [​*String\
    \ Theory*​](#f_0013.xhtml_chp.puzzle02). In the meantime, a C++ expert has come\
    \ along and decided that everything is better with templates. Whether or not that’s\
    \ true is another discussion, but it certainly makes overload resolution more\
    \ interesting!\n\nWe find three definitions of serialize in this puzzle. The first\
    \ (the one marked “1”) is the primary function template for serialize. The next\
    \ (marked “2”) is an explicit specialization of this template for std::string.\
    \ You can recognize it as a specialization by the empty template<> tag. Finally,\
    \ we see a plain old non-template serialize function (marked “3”).\n\nSince the\
    \ name serialize is overloaded, when we write a call to that name, overload resolution\
    \ needs to work out which one to call. As we learned in Puzzle 2, Puzzle 2, [​*String\
    \ Theory*​](#f_0013.xhtml_chp.puzzle02), it does that by creating a set of all\
    \ candidate functions of that name and then selecting the best viable function\
    \ from that set. It’s clear that the normal, non-template serialize function (3)\
    \ is a candidate, but what happens with the function template? And how is the\
    \ compiler able to disambiguate between the function template specialization and\
    \ the normal function, which both have the same signature?\n\nWhen a function\
    \ template is involved in overload resolution, the compiler looks at all the primary\
    \ templates of that name. It doesn’t consider specializations at this point, so\
    \ only the primary template (1) is considered, not the specialization (2). If\
    \ we had other primary template overloads, these would also be considered, but\
    \ we only have one in this puzzle. An example of another primary template could,\
    \ for instance, be this one for pointers:\n\n| ​  | ​**template**​<​**typename**​\
    \ T> |\n\n| ​  | ​**void**​ serialize(T*) { std::cout << ​*\"pointer*​​*\\n*​​*\"\
    *​; } |\n\nYou can recognize this as a primary template by the non-empty template<typename\
    \ T>, just like we saw in the primary template in the puzzle.\n\nSince the primary\
    \ template (1) is the only primary template in this puzzle, we’ve now found the\
    \ function template for serialize that should be a candidate for overload resolution.\
    \ But to be able to to proceed, overload resolution needs to have a concrete function\
    \ signature with actual types, not just a template taking an arbitrary type T.\
    \ So next, it does type deduction for serialize to see what a potential instantiation\
    \ would look like. This is called “synthesizing a declaration.” This synthesized\
    \ declaration is added to the set of candidate functions (together with the non-template\
    \ serialize), and regular overload resolution proceeds. Let’s see how type deduction\
    \ and overload resolution work for each of the two calls to serialize.\n\nFirst,\
    \ have a look at the call where we pass an object:\n\n| ​  | serialize(hello_world);\
    \ |\n\nThe expression hello_world is an lvalue of type std::string. As we learned\
    \ in Puzzle 13, Puzzle 13, [​*A Constant Struggle*​](#f_0024.xhtml_chp.puzzle13),\
    \ T is deduced to std::string, and the synthesized declaration has the signature\
    \ void serialize(std::string&). We now have these two candidates for overload\
    \ resolution:\n\n| ​  | ​**void**​ serialize(std::string&); ​*// Synthesized from\
    \ the template (1)*​ |\n\n| ​  | ​**void**​ serialize(​**const**​ std::string&);\
    \ ​*// The non-template function (3)*​ |\n\nSince hello_world is non-const, overload\
    \ resolution prefers the template version of serialize, which takes a non-const\
    \ reference.\n\nNow that overload resolution has decided to use the function template,\
    \ it’s time to find a specialization to use. Should it instantiate and use the\
    \ primary function template (1) or use the explicit specialization (2)? In this\
    \ case, that’s a simple choice since we need a specialization with the signature\
    \ void serialize(std::string&) but our explicit specialization has the signature\
    \ void serialize(const std::string&). We have to use the primary function template,\
    \ and an implicit instantiation is made for T = std::string, resulting in void\
    \ serialize(std::string&). When this instantiation is called, template is printed.\n\
    \nNext, let’s look at the call where we pass a temporary string:\n\n| ​  | serialize(std::string{​*\"\
    Good bye, world!\"*​}); |\n\nThe expression std::string{\"Good bye, world!\"}\
    \ is a prvalue of type std::string, so T is deduced to std::string, just like\
    \ for the previous call. We again have these two candidates for overload resolution:\n\
    \n| ​  | ​**void**​ serialize(std::string&); ​*// Synthesized from the template\
    \ (1)*​ |\n\n| ​  | ​**void**​ serialize(​**const**​ std::string&); ​*// The non-template\
    \ function (3)*​ |\n\nSince std::string{\"Good bye, world!\"} is a prvalue, the\
    \ non-const reference in the function template can’t bind to it. The const reference\
    \ in the normal function can, and this function is picked by overload resolution.\
    \ Since the template was not picked, no instantiation takes place, and normal\
    \ function is printed.\n\nBonus question: what would happen if the function template\
