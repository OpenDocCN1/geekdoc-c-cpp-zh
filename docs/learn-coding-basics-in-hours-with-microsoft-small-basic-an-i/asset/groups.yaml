    at 100 down to 1, that also includes Program.Delay(100).


    # SECTION ELEVEN

    GRAPHICS WINDOW


    You can customize certain aspects of the Text Window and how it displays. We touched
    upon this earlier with foreground color and background color.


    There is also a graphics window. Graphics are pictures displayed on a computer.
    Graphics are art created on a computer by a person.


    Like the Text Window that displays text, Small Basic also has a Graphics Window
    for graphics.


    Enter and execute the following code:

    GraphicsWindow.Show()


    ![](img/3eddee1b81fd46e428205e5480108)


    Now, to customize the Graphics Window, there are some things you can. Write and
    execute the following code:


    GraphicsWindow.Height = 500

    GraphicsWindow.Width = 700

