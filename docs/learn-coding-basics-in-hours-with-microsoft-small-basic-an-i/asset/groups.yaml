  mdcn: "\n\n# 章节挑战\n\n编写一个包含以下内容的程序：\n\n- `TextWindow.Title` 属性，\n- 给变量赋值，\n- `TextWindow.WriteLine`\
    \ 操作，以及\n- `TextWindow.Top` 属性。\n\n# 第八节\n条件语句\n\n条件是其他事物所依赖的某种东西。在数学中，条件是使其他事物成立所必须满足的某个。条件是其他点出现时必须先存在的点。如果你说某事是“有条件的”，这意味着它依赖于另一个事物的状态。\n\
    \n示例：语句“如果你输入1，允许电流通过计算机的这部分”可能就是一个条件。或者假设你有像这样一道应用题：“想出两个数字，它们相加等于 6——但永远不能使用数字\
    \ 2 和 4 来得到答案。”在这里，告诉你不能在答案中使用数字 2 或 4 的那部分就是一个条件。\n\n当你告诉计算机：“根据 ___，做 __”时，就发生了条件语句。“If\
    \ 语句（If Statement）”是条件语句的一种类型，意味着：如果如此，那么那样。\n\n分支（Branch）是一个决策点。分支是我们让计算机执行有用工作的根本元素。分支指令告诉计算机去主指令序列以外的地方，转而执行另一系列指令；通常基于计算机必须做出的某些决策。它是写在程序代码中的语句，用于让计算机从一个区域转移到另一个区域。\n\
    \n示例：如果你正在使用计算机程序从餐厅点餐，而如果你希望食物外送而不是放在那里供你自取，餐厅有不同的订餐流程，那么在计算机程序中就会有一个分支，提示用户他们的订单是自取还是外送。在这种情况下，计算机将执行两系列步骤。计算机程序中的分支指令将根据用户的响应执行这些步骤中的其中一个。\n\
    \n为了告诉计算机如何分析条件语句，你将使用比较指令，例如 `<` 和 `>` 符号。\n\n```basic\nIf (5 < 10) Then\n  TextWindow.WriteLine(\"\
    Five is less than 10.\")\nEndif\n```\n\n`Endif` 告诉计算机我们已经完成了该操作。\n\n# 章节挑战结束\n\
    \n 编写并执行你自己的条件语句。\n\n# 第九节\n更多条件语句\n\n现在让我们尝试使用 `Else 语句（Else Statement）`，它基本上是第二个\
    \ `If 语句`，为我们提供了另一个可选范围。我们还将使用 `Else 语句` 告诉计算机：“否则，做 __。”你通过尝试会对此有更好的理解。\n\n编写并执行以下代码：\n\
    \n```basic\nstart:\nTextWindow.Write(\"Are you a vegan?\")\nVegan = TextWindow.Read()\n\
    If Vegan = \"Yes\" Then\n  TextWindow.WriteLine(\"I know, you've told me already.\
    \ Several times...\")\nElseIf Vegan = \"No\" Then\n  TextWindow.WriteLine(\"Looks\
    \ like meat is back on the menu!\")\nElse\n  TextWindow.WriteLine(\"Please enter\
    \ Yes or No.\")\n  Goto start\nEndIf\n```\n\n我们还在上面的代码中还添加了几个新东西：\n\n1. Start.：这是一个标签（label）。它类似于程序内部的一个书签。在这种情况下，`start`\
