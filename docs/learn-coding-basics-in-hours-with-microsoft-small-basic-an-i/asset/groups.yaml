    is the act of repeating. Iteration means to go through a defined series of actions,
    repeating a certain number of times. Usually this defined series of actions is
    repeated a certain number of times, or until a condition is met.


    EXAMPLE: Computer programs are usually created in iterations: Coming with a basic
    working version, reviewing the program for mistakes to make, doing that work,
    and repeating. When the program works acceptably, this process starts.


    A "For Loop" is used to repeat a section of code a number of times. For Loops
    are used when the number of iterations are known. Here’s an example for each student
    in the class (25), provide a grade.


    Write and execute the following for loop:


    ```

