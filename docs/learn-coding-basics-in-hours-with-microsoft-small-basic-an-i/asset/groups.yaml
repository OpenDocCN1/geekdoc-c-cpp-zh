    Text.WriteLine("It is p.m.")

    EndIf


    As you can see, the code is sometimes automatically indented for you. This is
    so

    that the code is sectioned off and you can easily read through it. In Small Basic,
    this

    indentation is not necessary and the program will run whether not the code is

    ented.


    Now let''s use some of what we''ve learned so far (and learn some more) to build

    a program that will round numbers and tell us whether not the numbers are odd
    or

    even.


    In math, a "remainder" is the number left over after a division operation.

    Math.Remainder is an operation in Small Basic that divides the first number by
    the

    second and returns (gives back) the remainder. E.g. All even numbers will have
    a

    remainder when divided by 2 (nothing left over – they divide evenly).


    Write and execute the following code:


