    # LEARN CODING BASICS in HOURS

    WITH SMALL BASIC


    Programming for Absolute Beginners


    Written by: Jack C. Stanley & Erik D. Gross,

    Co-Founders of The Tech Academy


    # PREFACE


    The Tech Academy is a licensed career school that delivers software developer
    training. Our main offering is the Software Developer Boot Camp. The program can
    be taken online from anywhere or at one of our campuses.


    Please keep in mind that this is the first edition of this book. There will be
    upgrades and revisions in the future.


    If you find any errors, have feedback or would like to give suggestions, please
    contact us immediately. Our contact information can be found on our website: learncodinganywhere.com


    Thank you for obtaining this book. We hope that you enjoy it!


    # INTRODUCTION


    Welcome!


    This book will be useful for individuals who are interested in learning coding
    and the basics of Small Basic. Don''t worry if you haven''t ever coded before
    though, this book doesn''t require any previous knowledge or experience.


    If you have written code before, this book isn''t recommended because it was made
    for total beginners (people with absolutely no prior experience).


    This book should be read start to finish, with all assignments completed in order.
    All tasks and code you are required to write herein are written in gray font.
    As a developer-in-training, you need all the experience you can get in typing
    code! So, definitely type all of code in this book.


    As this book is meant for newcomers, we won''t start writing code until Section
    Three. The first couple sections we will be covering programming fundamentals
    and the required vocabulary. Please be patient because writing code without any
    understanding of the basics of coding is a waste of time and creates nothing more
    than a parrot.


    The information presented in this book is arranged in a gradient sequence – we
    will start with the easiest information first and end with the most difficult
    tasks.


    The purpose of this book is to create: A programmer who understands the basics
    of coding and can write code in Small Basic.


    This book was written by The Tech Academy. We are a licensed career school that
    trains students in computer programming and web development. If you''re interested
    in finding out more about us, please visit our website: https://www.learncodinganywhere.com/


    Let''s begin this book with some fundamental terms to orient you to the subject.


    # SECTION ONE

    ## BASIC DEFINITIONS


    Understanding the terminology of a subject is a vital component to mastering it.
    After all, how could you drive a car if you didn''t know what a gas pedal was?


    So, while it may be boring, read through the following technological definitions
    so we can ensure a firm foundation in place.


    Note: If there are any technological terms you would like to clear up that aren''t
    defined in this book, you can refer to The Tech Academy''s Technology Basics Dictionary,
    Tech and Computers Simplified. This dictionary is available for purchase on Amazon.


    # DEFINITIONS


    Machine: Something that uses energy to do things. Machines are most commonly made
    out of metal and plastic and have several parts that work together. They are usually
    made up of fixed and moving parts that each serves a particular purpose. Machines
    are used by people as tools to assist in getting something done.


    EXAMPLE: A car is a machine.


    Computer: An electronic machine that stores and deals with information. A computer
    is made up of many different parts which electricity passes through. Computers
    are a tool that people use to help them do things.


    Computers follow instructions entered into them by people. A computer can store
    instructions to be done at later points in time, so that people do not have to
    reenter the same instructions over and over again. The computer automatically
    performs a series of functions when it is on and also responds to commands that
    a person enters into it. The way it responds to commands is all set beforehand
    by people.


    Machines, such as cars and phones, can have computers inside them that perform
    specific functions. Computers typically exist to help people by performing repetitive
    activities, storing information and making certain activities faster or more efficient.


    EXAMPLE: An electronic calculator is a very basic type of computer.


    Digital: Of, or related to, a device or object that represents magnitudes in digits.
    Computers are digital devices; data in computers is represented using digits.


    The opposite of "digital" can be considered to be "analog." Analog refers to data
    flowing out in a continuous stream.


    Things that are made up of exact, distinct parts; these parts are always in an
    exact, standard state (state is the condition of a thing - for example, "green",
    "empty", "45 years old," etc.). Digital things can only be in one of the available
    states for that, and not "between" two of the available states. For example a
    light bulb with a regular flip switch would be digital because it has two states:
    totally off or totally on. If the light bulb had one of these round dimmer switches
    instead of a flip switch and it could be set to somewhere between "totally off"
    and "totally on", it would not be digital.


    A black and white photo that is created using only small black and white dots
    is digital. From a distance, you see the photograph represents. If you look at
    it close, you see that the photo is composed of individual small dots. The distinct
    dots are digital that they are exact, separated marks.


    EXAMPLE: In terms of physical universe objects, a staircase would be considered
    digital and a ramp would be angled. Stairs have distinct, separated steps. A ramp
    is continuous.


    Computers are digital because they communicate using two numbers: 0 (which tells
    the computer "off"), and 1 (which tells the computer "on"). Note: People typically
    use the word digital to refer to anything that has to do with computers.


    Central Processing Unit: "CPU" for short. The CPU is basically the brain of the
    computer. It is a small device that contains billions of tiny components. The
    basic job of all processors is to execute various instructions. It only ever performs
    one of these instructions at a time, but modern computers can perform billions
    of instructions per second.


    EXAMPLE: If you have a list of students in a file and you give the computer an
    instruction to put the list in alphabetical order, it is the CPU that performs
    the analysis and re-ordering of the list.


    Peripheral: These are things that can be hooked up to a computer, including external
    devices. Peripherals include mice, keyboards, external drives, displays etc. Peripherals
    are often used to get data into a computer, or to receive data from the computer.


    EXAMPLE: A printer is a peripheral.


    Input: Input is data or information that is collected by a computer. This can
    take many forms. It may be a user who has typed a form on the computer. It may
    be electronic signals sent to the computer by an attached device, like a mouse
    or a display screen. It may be a set of electronic data from another computer
    that is connected to the first one by wires.


    EXAMPLE: A customer service agent at a retail store takes your information and
    types it into her computer; that information is input for the computer to use.


    Algorithm: A mathematics word that means a plan for solving a problem. Algorithm
    consists of a sequence of steps to solve a problem or perform an action. Computers
    use algorithms. An algorithm is a set of instructions that is used to solve something
    done.


    EXAMPLE: An algorithm for selecting the right kind of shirt might have the following
    steps:


    - 1. Pick a shirt from your closet.

    - 2. Put the shirt on.

    - 3. Look at yourself you look in that shirt.

    - 4. Decide whether you like the way you look in it. If you like how you look,
    leave the shirt on and go to step 6. If you do not like how you look, take the
    shirt off and put it back in the closet where you got it from.

    - 5. Repeat steps 1-5 until you have made a decision about each shirt in the closet.

    - 6. End this procedure.


    Instruction: A command or set of commands entered into a computer that performs
    a certain operation. Instructions control a computer and tell it what to do.


    EXAMPLE: You could make a computer draw a square by typing in instructions.


