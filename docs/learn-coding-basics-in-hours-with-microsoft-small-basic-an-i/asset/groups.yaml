    To fully understand, you must know what a "data structure" is. A data structure
    refers to the organization of related pieces of information. There are different
    data structures that allow different operations to be performed on the data. A
    data structure refers to how the data is organized in terms of implementation
    (use of the data); relation of the various parts of the data). It is a particular
    way to organize data in a computer so that it can be used efficiently.


    Data structures are used as means of organizing information in a computer so that
    the data can be utilized in an efficient manner.


    EXAMPLE: Consider two different areas of business: The shipping industry and the
    manufacturing industry.


    The types of data the shipping industry may need to collect and organize will
    center around vehicles and their capacity, shipping rates, fuel costs, travel
    times between various geographical points, etc.


    The types of data the manufacturing industry may need to collect and organize
    will center around raw materials, product manufacturing methods and times, inventory
    locations and amounts, shipping information, etc.


    The structure of the data used by computers in these two industries may have similarities,
    but it''s certain that the data structures won''t be identical.


    A linear data structure is simply a data structure where the data in the structure
    are organized one after the other – basically, a list.


    EXAMPLE: A list of the states in the U.S. Each element of the structure, conceptually,
    comes right before or after another element.


    When speaking about arrays, "dimension" has a specific meaning. A one-dimensional
    array is a linear data structure. The last program we wrote was a one-dimensional
    array.


    A two-dimensional array is basically an array of arrays. Essentially, you could
    think of this as a grid of rows and columns, where each entry in the grid is itself
    an array. You will explore this in the next section.'
