  - '[PAGE 29]


    Computers often have to keep track of various pieces of information. These be
    things like the name of a computer user, the color of the background shown on
    the computer screen, an order number for something a user ordered from a company,
    etc.


    The computer usually gives each of these pieces of data a NAME and a VALUE. The
    NAME is used to identify the exact piece of data, and the VALUE is used to show
    the actual data we need to keep track of.


    These things the computer is keeping track of are usually called "variables".
    This is because the VALUE part of it can change when you tell the computer to
    change it. The fact that the value can vary is why it''s called a "variable" –
    its value is not permanent or constant.


    Usually the "=" symbol is used to set the VALUE of a variable.


    When the "=" symbol is used to set the value of a variable, it is usually used
    like this:

    [NAME of the variable] = [VALUE that is being assigned to that variable]


    EXAMPLE: fabricColor = "blue".


    Here, there is a piece of data that the computer is keeping track of that has
    been given the name "fabricColor". By using the "=" symbol, we can set the value
    of the piece of data called "fabricColor". In this case, we are setting that value
    to the series of letters "blue".


