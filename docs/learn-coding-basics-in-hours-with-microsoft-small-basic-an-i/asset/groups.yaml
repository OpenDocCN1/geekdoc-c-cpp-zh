    ## EVENTS\n\nAn event is an action or something that occurs that is detected by\
    \ a computer program. There can be system events (events that occur as a result\
    \ of operations the computer does), or user events, like typing on the keyboard\
    \ or clicking a mouse.\n\nIn Small Basic, an event is something that reacts to\
    \ a user's action and is when the computer tells you that something has happened.\
    \ For example, if you make a program that turns the screen blue when you click\
    \ on the word \"blue,\" clicking the word \"blue\" would be the event.\n\nEvents\
    \ can make programs more interesting and interactive.\n\nInteractive means two\
    \ things: influence one another and create effects on each other. In computers,\
    \ interactive refers to a computer that is able to be communicated with and to\
    \ perform activities by a human; these activities involve the person using the\
    \ computer. An interactive computer is a computer that you can affect in some\
    \ way (move a pointer on a screen and select something, etc.) and will respond\
    \ in some manner.\n\nMost, if not all, computer games like \"Hangman\" could be\
    \ developed in Small Basic would include events. In this game, the user makes\
    \ choices and the program receives the user's input.\n\nThere is such a thing\
    \ as \"event-driven programming.\" This is programming where the flow of the program\
    \ is controlled by events. An example would be a program in which the program\
    \ flow is determined by the typing of keys and clicking the mouse.\n\nWe will\
    \ now use the MouseDown event in the following program (you will see what it does\
