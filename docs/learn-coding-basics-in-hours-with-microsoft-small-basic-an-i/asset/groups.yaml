    # SECTION NINETEEN

    EVENTS


    An event is an action or something that occurs that is detected by a computer
    program. There can be system events (events that occur as a result of operations
    the computer does automatically), or user events, like typing on the keyboard
    or clicking a mouse.


    In Small Basic, an event is something that reacts to a user''s action and is when
    the computer tells you that something interesting has happened. For example, if
    you make a program that turns the screen blue when you click on the word "blue,"
    clicking on the word "blue" would be the event.


    Events can make programs more interesting and interactive.


    Interactive means two things influence one another and create effects on each
    other. In computers, interactive refers to a computer that is able to be communicated
    with and gotten to perform activities by a human; these activities involve the
    person using the computer. An interactive computer is a computer that you can
    affect in some way (move a pointer on a screen and select something, etc.) and
    will respond in some manner. Most, if not all,


    The computer game "Hangman" could be developed in Small Basic and would include
    events. In this game, the user makes choices and the program receives the user''s
    using input events.


    There is such a thing as "event-driven programming." This is programming where
    the flow of the program is controlled by events. An example would be a program
    in which the program flow is determined by the typing of keys and clicking the
    mouse.


    We will now use the MouseDown event in the following program (you will see what
    it does when you run the program). We can pull a picture from Flickr!


    Write and execute the following code:


    ```

    GraphicsWindow.Title = "It''s raining cats and dogs!"

    GraphicsWindow.Width = 700

    GraphicsWindow.Height = 700

    GraphicsWindow.MouseDown = Pics

    Sub Pics

    Picture = Flickr.GetRandomPicture("Cats, Dogs")

    GraphicsWindow.DrawResizedImage(Picture, 0, 0, 700, 700)

    EndSub

    ```'
