    # SECTION THIRTEEN

    SUBROUTINES


    A subroutine is a set of computer instructions, to be used by a main computer
    program, that performs some task that you may want to do over and over again at
    various times. The main computer program could do some of its own actions in a
    specific sequence, then ask the subroutine to do its tasks, and continue on where
    it was before it asked the subroutine to do its tasks. Another term for this is
    a subprogram (a term we discussed earlier in this book).


    EXAMPLE: Within a computer program used to operate a college, there could be a
    subprogram that checked to see if any new students have been enrolled since you
    used the program. The main computer program could use that subprogram as it was
    starting up, get the data on any new students, and then continue on with its primary
    functions.


    To "call" means to demand or direct something. In normal English this could be
    used, "This calls for celebration! In computers, a call is a direction by a main
    computer program to execute the tasks of a subprogram. More specifically, when
    a "call" is made, a program temporarily transfers control of the computer to a
    subprogram. Once the subroutine is done executing, control of the computer is
    returned to the main program. A program could make many "calls" to multiple subprograms
    as the program does its sequence of tasks.


    EXAMPLE: If you were using a video game program, the video game program could
    call a "high score" subprogram after every game ended.


    In Basic, the name of a subroutine is preceded with the statement "Sub". The instructions
    that make the subroutine end off with the statement "EndSub".


    Write and execute the following code:


    ```basic

    TextWindow.Write("What is your name?: ")

    Name = TextWindow.Read()

    TextWindow.Write("Hi there, " + Name + "! What time do you think it is?")

    Time= TextWindow.Read()

    TextWindow.Write("Well " + Name + ", per your computer, the time is now actually:
    ")

    PrintTime()

    Sub PrintTime

    TextWindow.WriteLine(Clock.Time)

    EndSub

    ```


    You execute a subroutine by calling the subroutine followed by (). The parentheses
    tell the computer that the main program wants a subroutine executed.


    In a larger program, subroutines become quite useful and save you from writing
    extra code because you can call the subroutine from anywhere in the program.


    Subroutines can also be used to break larger problems into smaller ones. An important
    thing to keep in mind is readability. In Basic, comments are preceded with an
    apostrophe (''). Comments are ignored by the computer. For example:


    ```basic

    TextWindow.Write("What is your name?: ")

    Name = TextWindow.Read()

    TextWindow.Write("Hi there, " + Name + "! What time do you think it is?")

    Time= TextWindow.Read()

    TextWindow.Write("Well " + Name + ", per your computer, the time is now actually:
    ")

    PrintTime()

    Sub PrintTime

    TextWindow.WriteLine(Clock.Time)

    EndSub

    '' This is a comment and will not be executed

    ```


