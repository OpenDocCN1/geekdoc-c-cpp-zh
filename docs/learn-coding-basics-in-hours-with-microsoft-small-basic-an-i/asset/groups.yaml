    ## SMALL BASIC


    Small Basic is a programming language broadly released by Microsoft in 2011. Small
    Basic includes an Integrated Development Environment (IDE) - a tool in which one
    writes their code) and libraries (sets of pre-manufactured code for use). It can
    be used to write basic programs and games.


    The .NET Framework is a collection of tools and pre-made software that helps software
    developers to make computer programs. It was created by Microsoft. It has several
    programming languages that it can work with. As a developer, you can write a program
    that uses one or more of these languages. The .NET Framework can take these programs
    and convert them to instructions that will work on pretty much any computer that
    is compatible with .NET Framework. This means you only have to write the program
    once, and not have to wait variations of it for all the various types of computers
    you''d like to have run the program.


    Small Basic is based on .NET and so familiarizing yourself with Small Basic makes
    it easier to learn other .NET programming languages, such as C#, in the future.
    This book is the perfect undercut for those interested in learning C# and other
    .NET technologies.


    The purpose of Small Basic is to provide a programming language that is designed
    to make programming more approachable for newcomers. It is a great learning resource
    for beginners!


    If you run into any trouble while going through this book, here are some tips:


    - 1. Ensure you understand all the words and terms being used - clear any you
    don''t understand.

    - 2. Ensure your code is written exactly as laid out here. A small error in the
    code, such as a typo, can ruin the whole program. Code must be exact for programs
    to run properly, so always meticulously check your code for errors.

    - 3. Research online for solutions.

    - 4. Contact The Tech Academy.


    ## SECTION TWO: WHAT IS CODING?


    Coding is computer programming. Computer programming is the act of creating computer
    programs, which are prepared sets of computer instructions designed to accomplish
    certain tasks. Programming consists of typing exact commands and instructions
    into a computer to create many of the things we use on computers on a day-to-day
    basis. To do computer programming, you must learn various programming languages
    and use these languages to create things on a computer that others can use.


    EXAMPLE: The program on your computer entitled "calculator", which you can use
    to do math, is the result of computer programming.


    Coding also refers to the creation of websites.


    Another word for these programs is "software". This is because the actual computer
    (the physical machine) is called "hardware." Therefore, the programs that run
    on machine that are called "software."


    The terms "coding" and "development" mean the same thing as programming. A software
    developer is a computer programmer; so is a coder.


    Programming is a spectacular thing because it is one of the few skills that apply
    to virtually all industries. We, companies that create software definitely utilize
    coding the most - but if you think about it, most industries utilize technology
    (software, websites, databases, etc.) and so, coders are valuable assets for companies
    in any industry-construction, food service, retail, transportation, etc.


    There are many, many programming languages, and technology is ever-changing. The
    whole thing can be quite overwhelming, but there are basics that apply across
    the vast landscape of technology.


    In general, the instructions in computer programs are executed in order, or from
    the top down.


    ## FIVE ELEMENTS


    There are five key elements to any computer program:


    - 1. Entrance

    - 2. Control/branching

    - 3. Variables

    - 4. Sub Program

    - 5. Exit


    Let''s take a look at each of these.


    ## ENTRANCE


    1. Entrance:


    A computer is a simple machine when you get down to it. It can only do one thing
    at a time, and it performs a computer program''s instructions in the exact order
    in which the computer programmer puts them. It can only execute (perform, or run)
    an instruction if it is directed to.


    This means that any computer program has to have a clearly marked "first instruction".
    This is the first task that the computer will perform when the computer program
    is started. From that point forward, each instruction in the program will direct
    the computer what instruction to perform next after it performs the current instruction.


    There are different ways to specify the entrance point, depending on which computer
    programming language is being used - but every computer program has a defined
    entrance point.


    ## CONTROL/BRANCHING


    2. Control/Branching


    Computers are often used to automate actions that would otherwise be performed
    by people. One of the most common things a person will be asked to do in performing
    a job is to assess the condition of a thing and, based on the condition of that
    thing, choose between two or more possible courses of action. In other words,
    they will have to make a decision. An example would be the activity of "a teacher
    grading a stack of papers":


    - Take the next student paper from the top of the stack.

    - Grade the paper.

    - Write the grade on the paper.

    - If the grade is 70% or higher, put the paper in a "Passed" stack.

    - If the grade is below 70%, put the paper in a "Failed" stack.


    You can see that there are two possible "paths" here. A path is: "a possible course
    of action arising from a decision". Think of it as what happens when you come
    to a fork in the road. You have to decide on a course of action - which road do
    you take?


    All but the simplest of computer programs will need to do the same thing. They
    will have to check the condition of a piece of data and, based on the condition
    of that data, execute different sets of instructions.


    In order to do this, the program will make use of special computer instructions
    called "control" instructions. These are just instructions that tell the computer
    what to look at in making a decision, and then tell the computer what to do for
    each decision. The most fundamental control statement for a computer is "if".
    It is used like this:


    IF [condition to check] THEN [branch to execute]


    Here, the "IF" is the control statement; "THEN" is the branching instruction that
    points to the path of the program to execute.


    ## VARIABLES


    3. Variables


    A variable is a piece of data that a computer program uses to keep track of values
    that change as the program is executed. This might be something like "the grade
    of the student paper that was graded," or "the color of paint to use for the next
    car on the assembly line."


    Variables are a vital part of any computer program, because they make it so a
    computer program can be used for more than a single, pre-determined set of values.
    You can imagine if "the color of paint to use for the next car on the assembly
    line" was ever able to be "blue," the computer program using that data wouldn''t
    be very useful. It would make a lot more sense to make it so the computer program
    could change that value for each car that was going to be painted.


    When you are writing variables in a computer program, they usually are written
    in a manner like this:


    [name of the variable] = [value of the variable]


    For example, you might have something like this:


    color = "red"


    Here, the variable is named "color", and the value of that variable has been set
    to "red." In other words, the variable named "color" is now "equal" to the word
    "red."


    Let''s look at the example of "a teacher grading a stack of papers". Here, we
    could have a variable called "Paper Grade" that changed each time the teacher
    graded a paper. You could also have variables for the total number of questions
    on the paper ("Total Questions"), for the number of questions answered correctly

