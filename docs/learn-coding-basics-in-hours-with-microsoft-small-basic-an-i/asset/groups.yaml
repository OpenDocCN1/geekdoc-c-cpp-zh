    ```


    You will see that when this program is executed, the computer just continues to
    print "50 is more than 25!" to the screen until you close the window. This is
    because the condition statement in your loop ("If A > 25") is always true, so
    the loop always returns to the beginning and does another iteration. This is called
    an "infinite loop"; under certain circumstances this can lock up a computer and
    require the shutdown and restart of the computer in order to stop the loop.


    To close the loop in our example, you would simply get rid of the "Begin:" label
