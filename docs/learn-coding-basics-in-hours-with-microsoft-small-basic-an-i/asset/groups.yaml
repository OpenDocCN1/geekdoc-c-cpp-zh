    # SECTION TEN

    LOOPS


    As we covered earlier, a loop is something that connects back to the beginning
    point. In computers, a loop is a sequence of instructions that are continually
    repeated until an exact condition is achieved.


    Usually a loop will occur when a certain set of actions are performed by a computer
    program. The program would then check to see if it has reached the condition required
    for completion. If not, it starts and repeats the set of actions. If so, it exits
    the loop and moves on to the next consecutive instruction in the computer program.


    EXAMPLE: You tell the computer to search through a list of paint colors until
    the color "red" is found.


    The list that the computer will search is this:


    +   Blue

    Yellow

    Red

    Orange

    White


    A loop is written into the consecutive item in the list and looks something like
    this:


    +   Step 1: Get next consecutive item in the list.

    Step 2: Check whether the item equals "Red".nStep 3: If the item equals "Red",
    exit this loop.

    Step 4: If the item is not equal to "Red", loop back to Step 1.


    +   When this loop is executed, it will go like this:

    Step 1: Acquired "Blue"

    Step 2: Checked if "Blue" equal to "Red"

    Step 3: Item not equal to "Red". Did not exit the loop.

    Step 4: Item not equal to "Red". Looped back to Step 1.

    Step 1: Acquired "Yellow"

    Step 2: Checked if "Yellow" equal to "Red"

    Step 3: Item not equal to "Red". Did not exit the loop.

    Step 4: Item not equal to "Red". Looped back to Step 1.

    Step 1: Acquired "Red"

    Step 2: Checked if "Red" equal to "Red"

    Step 3: Item equal to "Red". Exited the loop.


    A couple of important types of loops are "While Loops" and "For Loops".'
- md: '

    A "While Loop" is basically a repeating "if statement." Meaning, you are telling
    the computer to execute certain code repeatedly while a particular condition is
    present. E.g. While hungry, eat.


    Write and execute the following code in the text Editor:


    ```

    Amount = 1

    While (Amount < 1025)

    TextWindow.WriteLine(Amount)

    Amount = Amount * 2

    EndWhile

    ```


    In this program we are telling the program that "As long as the Amount is less
    than 1025, multiply the Amount by 2.


    An important aspect of how loops work is the concept of an iteration.


    To iterate means to say or do something again; repeat something. An iteration
    is the act of repeating. Iteration means to go through a defined series of actions,
    repeating a certain number of times. Usually this defined series of actions is
    repeated a certain number of times, or until a condition is met.


    EXAMPLE: Computer programs are usually created in iterations: Coming with a basic
    working version, reviewing the program for mistakes to make, doing that work,
    and repeating. When the program works acceptably, this process starts.


    A "For Loop" is used to repeat a section of code a number of times. For Loops
    are used when the number of iterations are known. Here’s an example for each student
    in the class (25), provide a grade.


    Write and execute the following for loop:


    ```

    For B = 1 To 10

    TextWindow.WriteLine(B)

    EndFor

    ```


    In our code, we assign the values 1 through 10 to variable B, one at a time, as
    the loop is executed. An integer is a whole number (such as 3 or 5). An increment
    is a distinct increase in amount. Incrementing is to distinctly increase a number.
    "To 10" above was incrementing an integer. But since we assigned a variable ("B"),
    we were technically "incrementing a variable." And so, we utilized a For Loop
    to increment a variable.


    If we create a loop and don''t close the loop, the code will continue on forever.

    Here''s an example:


    ```

    Write and execute the following code:

    Begin:

    A = 50

    If A > 25 Then

    Window.WriteLine("50 is more than 25!")

    Goto Begin

    EndIf

    ```


    You will see that when this program is executed, the computer just continues to
    print "50 is more than 25!" to the screen until you close the window. This is
    because the condition statement in your loop ("If A > 25") is always true, so
    the loop always returns to the beginning and does another iteration. This is called
    an "infinite loop"; under certain circumstances this can lock up a computer and
    require the shutdown and restart of the computer in order to stop the loop.


    To close the loop in our example, you would simply get rid of the "Begin:" label
    and the "Goto" statement.


    Now, let''s make a program – using a For Loop – that counts out even numbers up
    to 30.


    ```

    Write and execute the following code:

    For B = 2 To 30 Step 2

    Window.WriteLine(B)

    EndFor

    ```


    "Step" in your code counts up or down depending on the values you assign. Now,
    let''s reverse the countdown and use only odd numbers!


    ```

    Write and execute the following code:

    For B = 29 To 1 Step - 2

    Window.WriteLine(B)

    EndFor

    ```


    It''s interesting to note that every Loop can be translated into a Conditional
    Statement. For example, we can rewrite our last For Loop as follows:


    Write and execute the following code:


    ```

    B = 29

    Start:

    TextWindow.WriteLine(B)

    B = B - 2

    If (0 < B) Then

    Goto Start

    EndIf

    ```


    Actually, fun fact: every time you write a While Loop in your code, the computer
    automatically converts it to an If Statement with one or more Goto Statements.
    This is done behind the scenes; you won''t see the actual instructions you typed
    in the editor change.


    Let''s do another loop that will find out the larger of two numbers.


    Write and execute the following code:


    ```

    TextWindow.Write("Type in a number: ")

    First_Number = TextWindow.ReadNumber()

    TextWindow.Write("Type in another number: ")

    Second_Number = TextWindow.ReadNumber()

    If (First_Number > Second_Number) Then

    Else

    Larger = Second_Number

    EndIf

    TextWindow.WriteLine("The larger number is: " + Larger)


    ```


