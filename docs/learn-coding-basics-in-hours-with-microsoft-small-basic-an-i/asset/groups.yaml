    # SECTION NINE

    MORE CONDITIONAL STATEMENTS


    Now let''s try using an Else Statement, which is basically a second If Statement
    and gives us another option to choose from. We will also use an Else Statement
    that tells the computer, "Otherwise, do __." You’ll get a better idea of this
    through trying it out.


    Write and execute the following code:


    ```

    start:

    TextWindow.Write("Are you a vegan?")

    Vegan = TextWindow.Read()

    If Vegan = "Yes" Then

    TextWindow.WriteLine("I know, you''ve told me already. Several times...")

    Else Vegan = "No" Then

    TextWindow.WriteLine("Looks like meat is back on the menu!")

    Else

    TextWindow.WriteLine("Please enter Yes or No.")\Goto start

    EndIf

    ```


    We also added a couple new things to your code above:


    +   1. Start.: This is a labeled label. It''s similar to a bookmark within your
    program. In this case, the start label defines the beginning of our code and gave
    us a place to return to in our program, and

    2. Goto: This is an instruction which makes the program go to an exact place in
    the series of instructions that make up the program. "Goto" statements utilize
    labels and redirect the program to a label.


    Here is another comparison instruction:

    >= (greater-than followed by equal sign). This symbol is used to show that a comparison
    should be made. Specifically, this ''greater than or equal'' symbol is basically
    an instruction to check whether the data on the left side of the symbol is more
    than or equal in amount or quantity than the data on the right side. The answer
    to this comparison is an answer of "true" or "false".


    EXAMPLE: 6 >= 6. This means "check whether 6 is greater than or equal to 6". The
    answer is "true".


    Now let''s create a program that can tell the difference between a.m. and p.m.

