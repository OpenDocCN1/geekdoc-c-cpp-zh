    the loop is executed. An integer is a whole number (such as 3 or 5). An increment
    is a distinct increase in amount. Incrementing is to distinctly increase a number.
    "To 10" above was incrementing an integer. But since we assigned a variable ("B"),
    we were technically "incrementing a variable." And so, we utilized a For Loop
    to increment a variable.


    If we create a loop and don''t close the loop, the code will continue on forever.

