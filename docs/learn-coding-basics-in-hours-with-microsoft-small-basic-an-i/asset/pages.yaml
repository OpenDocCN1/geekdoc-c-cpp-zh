  md: '# SECTION EIGHT

    CONDITIONAL STATEMENTS


    A condition is something that other things depend on. In math, a condition is
    something that is required for something else to be true. Conditions are points
    that are necessary to be present for other points to be present. If you say something
    "conditional", that means it relies on the state of another thing.


    EXAMPLE: The statement "Electricity is allowed to flow through this part of the
    computer if you type 1" could be a condition. Or say you have a word problem like
    this: "Come up with two digits that, when added, equal six – but the digits 2
    and 4 are never to be used to get the answer." Here, the part that tells you that
    you cannot use the numbers 2 or 4 in your answer is a condition.


    A conditional statement takes place when you tell the computer: depending upon
    ___ do __ An "If Statement" is a type of conditional statement that means: if
    this, then that.


    A branch is a point of decision. Branches are a fundamental element of how we
    make computers do useful work. A branch instruction tells the computer to go somewhere
    other than the primary series of instructions and instead execute alternate series
    of instructions; usually based on some decision the computer has to make. It is
    a statement written in the program''s code to make the computer shift from one
    area to another.


    EXAMPLE: If you are using a computer program to order food from a restaurant,
    and the restaurant has a different procedure for ordering if you want the food
    to be delivered instead of being set aside for you to pick up, there will be a
    branch in the computer program where the user will be prompted as to whether their
    order is for pickup or delivery. In this case, the computer will have two series
    of steps it will perform. The branch instruction in the computer program will
    execute one or the other of these series, depending on the user''s response.


    In order to tell the computer how to analyze conditional statements, you''ll make
    use of comparison instructions, such as the < and > symbols.


    ```

    If (5 < 10) Then

    TextWindow.WriteLine("Five is less than 10.")

    Endif

    ```


    The Endif tells the computer that we are done with that operation.'
