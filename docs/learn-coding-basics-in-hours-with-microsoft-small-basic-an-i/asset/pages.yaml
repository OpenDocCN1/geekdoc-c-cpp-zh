  md: '# SECTION TWENTY

    THE FINAL SECTION


    We will now do do some coding exercises that may require you to do some online
    research.


    # SMALL BASIC EXERCISE 1


    HERE IS YOUR ASSIGNMENT: Create a program that returns the smaller of two numbers
    entered by a user. The program should receive two different numbers chosen by
    the user and then display the smaller of the two.


    For example: The user inputs 21 and 3 and the program returns the number 3.


    Hint: If statements


    # SMALL BASIC EXERCISE 2


    The company you work for just opened two branches. One is in New York City, the
    other in London. They need a very simple program to find out if the branches are
    open or closed on the current time of the Headquarters here in Portland. The hours
    of both branches are 9:00 a.m.-9:00 p.m. in their own time zone.


    HERE IS YOUR ASSIGNMENT: Create a program that will determine whether the London
    and New York offices are open or closed on the current time of the HQ in Portland.
    Have the program display each if of the two branches are open or closed.


    Hints: Clock.Time class (Clock.Hour operates on a 24-hour clock)


    If statements


    # SMALL BASIC EXERCISE 3


    Your employer wants a program to copy a .txt file from one folder to another.


    HERE IS YOUR ASSIGNMENT: Create two folders on your desktop. Create one text file
    inside one of the folders (leaving the other folder empty).


    Your task is to use Small Basic to copy the file from the folder it is stored
    in and place the copy in the empty folder.


    Note: In Windows, to obtain the file path, hold shift and right click on the file
    and then choose "copy as path"


    Hint: File.CopyFile Method'
