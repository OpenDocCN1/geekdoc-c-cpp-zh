  md: '# SMALL BASIC EXERCISE 4


    Your employer now wants a program that will copy a .txt file from one folder to
    another only if the London office is closed.


    HERE IS YOUR ASSIGNMENT: Using the same two folders created in Exercise 3, make
    a program that copies a file from the folder it is stored in and place it in the
    other folder ONLY IF the London office is closed.


    Hint: It''s okay to re-use code you wrote in Exercises 2 and 3.


    # SMALL BASIC EXERCISE 5


    Your employer loves the program you just created, but now wants it to have a simple
    graphical user interface (GUI) for other employees to use. Note: a GUI is a representation
    of the various objects in a computer - files, programs, etc. - in a graphical
    form. That is, it presents the user with pictures and diagrams that communicate
    the things on the computer, and their arrangement.


    HERE IS YOUR ASSIGNMENT: Make a simple GUI for your program. All it needs to have
    is a button in the middle that, when clicked, copies a file from one folder to
    another ONLY if the London office is closed.


    Hint: Make the code you wrote in Exercise 4 a subroutine that is called when a
    button is clicked.


