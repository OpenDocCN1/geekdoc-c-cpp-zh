  md: '# SECTION NINETEEN

    EVENTS


    An event is an action or something that occurs that is detected by a computer
    program. There can be system events (events that occur as a result of operations
    the computer does automatically), or user events, like typing on the keyboard
    or clicking a mouse.


    In Small Basic, an event is something that reacts to a user''s action and is when
    the computer tells you that something interesting has happened. For example, if
    you make a program that turns the screen blue when you click on the word "blue,"
    clicking on the word "blue" would be the event.


    Events can make programs more interesting and interactive.


    Interactive means two things influence one another and create effects on each
    other. In computers, interactive refers to a computer that is able to be communicated
    with and gotten to perform activities by a human; these activities involve the
    person using the computer. An interactive computer is a computer that you can
    affect in some way (move a pointer on a screen and select something, etc.) and
    will respond in some manner. Most, if not all,


    The computer game "Hangman" could be developed in Small Basic and would include
    events. In this game, the user makes choices and the program receives the user''s
    using input events.


    There is such a thing as "event-driven programming." This is programming where
    the flow of the program is controlled by events. An example would be a program
    in which the program flow is determined by the typing of keys and clicking the
    mouse.


    We will now use the MouseDown event in the following program (you will see what
    it does when you run the program). We can pull a picture from Flickr!


    Write and execute the following code:


    ```

    GraphicsWindow.Title = "It''s raining cats and dogs!"

    GraphicsWindow.Width = 700

    GraphicsWindow.Height = 700

    GraphicsWindow.MouseDown = Pics

    Sub Pics

    Picture = Flickr.GetRandomPicture("Cats, Dogs")

    GraphicsWindow.DrawResizedImage(Picture, 0, 0, 700, 700)

    EndSub

    ```'
  merge: -1
  pgno: 72
- img_proc: true
  md: 'We just used a new operation called "DrawResizedImage" which allows you to
    display photos. The first word in the parentheses names the picture, the next
    two numbers are the X and Y Coordinates in the Graphics Window and the last two
    specify the width and length of the photo (respectively). Let''s get a little
    tougher on events.


    Write and execute the following:


    ```

    GraphicsWindow.DrawBoundText(250, 200, 100, "Click the screen!")

    GraphicsWindow.MouseDown = Click - ASSIGNS SUB TO MOUSE DOWN

    GraphicsWindow.BrushColor = "Yellow"

    GraphicsWindow.BackgroundColor = "Black"

    Sub Click

    GraphicsWindow.ShowMessage("You clicked the mouse!", "NOTICE")

    A = GraphicsWindow.MouseX - 5

    B = GraphicsWindow.MouseY - 5

    GraphicsWindow.FillTriangle(A, B, 30, 30, 40)

    EndSub

    ```


    There are two chunks of text following ShowMessage. The first chunk is what will
    be displayed inside the window, and the second chunk is what is displayed at the
    top.


    This program contains a subroutine called Well. Every time the user clicks in
    the GraphicsWindow, the subroutine "Click" results in a couple of events: 1. A
    message pop up and 2. A yellow ray expands out from the top left after you shut
    the message box. One of the unique things about events is that when an event occurs,
    the subroutine is called automatically.


    In the above code, we assigned the subroutine name to the MouseDown event which
    is connected to the GraphicsWindow object. Even though Mouse looks like a property
    (attributes of an object), we are actually assigning the subroutine "Click" to
    it. If MouseDown were a property, we would be assigning it a value (as opposed
    to a subroutine).


    Now that you are familiar with subroutines, events, and other keying concepts,
    we can create our own "Paint" program that will allow you to draw using the mouse.
    You will be able to draw rainbow-colors with a thick brush.


    In this next program, we will be using the Mouse event, which gets the X and Y
    coordinates, in pixels, of the mouse cursor - based on where it is compared to
    the top left of the desktop.


