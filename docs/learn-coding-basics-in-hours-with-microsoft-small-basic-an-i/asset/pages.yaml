  md: 'EXAMPLE: You can write code that makes a computer game.


    Code can also mean: A system where you use a symbol to represent another thing.


    EXAMPLE: Airports are often referred to by three-letter codes - the Portland International
    Airport in Portland, Oregon, USA has the three-letter code PDX. So here, "PDX"
    is a code that represents the Portland International Airport.


    # Operating System: Abbreviated OS. An operating system is a special-purpose computer
    program that supports the computer''s basic functions, such as scheduling tasks,
    running other computer programs, and controlling peripherals (external devices
    such as keyboards, mice and displays).


    Most computer programs will require that an operating system already installed
    on a computer before they can function on that computer.


    Nearly all computers available today come with an operating system already installed
    when they are purchased. Computer manufacturers install the operating system before
    they sell a computer.


    Some operating systems are free; others are available for a fee.


    One of the most well-known and popular operating systems in the world is called
    Windows. It is created and sold by the technology company Microsoft.


    Other operating systems are: OS X (created by the technology company Apple; it
    is used on their desktop computers and laptops); Linux (a family of free and for-free
    operating systems; it is used on desktop computers and laptops); Android (owned
    by the technology company Google; it is used on mobile devices like smartphones
    and iOS (created by Apple; it is used on their mobile devices like the iPhone
    and iPad).


    EXAMPLE: Windows 10 is a popular operating system.


    Network: A network is a system where two or more computers are connected to each
    other. The computers can be connected by a cable (wired) or connected wirelessly.
    Network is the word used to describe a link between things that are working together.
    Networks are used in many different ways with computers.


    EXAMPLE: Information can be shared from computer to computer through the use of
    a network.


    Internet: The Internet is two things: an interconnected network of many'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'computers around the world, and a set of methods, protocols, for transferring
    different types of data between those computers.


    This is the basic definition of the internet. A detailed description follows.


    A protocol is a formal description of how a certain type of information will be
    formatted and handled. Basically, it''s an agreement that various people who work
    with that type of information all adhere to. Protocols are usually described in
    written documents, and are very precise. They are usually created by experts in
    the applicable industry.


    An example of a type of data where a protocol would be valuable is healthcare
    information. If various organizations in the healthcare industry were to transfer
    healthcare back and forth between computers as they perform their work, it would
    be important that they all agree about things like the exact format of information,
    to keep private data safe. All of that would be laid down in a written protocol.
    Several such protocols exist in the healthcare industry.


    The Internet is a network of connected computers, and there are lots of different
    types of data that can be sent back and forth between these computers - things
    like electronic messages, electronic documents, healthcare records, etc. One or
    more protocols have been created for each type of data that can be transferred
    around the Internet.


    EXAMPLE: A bank could devise a protocol for how to format and exchange financial
    data between its headquarters and its various branches, and then use their computers
    connected to the internet to actually exchange that data.


    World Wide Web: Abbreviated WWW; usually referred to as "the Web". To understand
    the World Web is, you need to know about these other terms: web site, web page,
    web browser, and web server.


    The World Web (the "Web") is a collection of linked electronic documents, organized
    into groups web sites.


    The Web is accessed by connecting to the Internet. The computers involved in the
    operation of the Web are connected to the Internet,


    A web site is composed of one or more individual web pages, where a "page" is
    an organized, separate document containing text, images, video and other elements.
    The electronic files that make up a web site are stored on specialized computers
    web servers. These computers accept requests from other, remote computers for
    specific web pages, and deliver those files needed to make the web page display
    on the remote computer. The type of program you would use to view web pages is
    called a web browser. It is this program that would make the requests to the web'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'server for the web site files.


    EXAMPLE: There are web sites on the World Wide Web dedicated to the files

    ofamous famous actors.


    # # SMALL BASIC


    Small Basic is a programming language broadly released by Microsoft in 2011.

    Small Basic includes an Integrated Development Environment (IDE) - a tool in which

    one writes their code) and libraries (sets of pre-manufactured code for use).
    It can be\used to write basic programs and games.


    The .NET Framework is a collection of tools and pre-made software that helps

    software developers to make computer programs. It was created by Microsoft. It
    has

    several programming languages that it can work with. As a developer, you can write
    a

    program that uses one or more of these languages. The .NET Framework can take

    these programs and convert them to instructions that will work on pretty much

    any computer that is compatible with .NET Framework. This means you only have

    to write the program once, and not have to wait variations of it for all the various

    types of computers you''d like to have run the program.


    Small Basic is based on .NET and so familiarizing yourself with Small Basic

    makes it easier to learn other .NET programming languages, such as C#, in the
    future.

    This book is the perfect undercut for those interested in learning C# and other
    .NET

    technologies.


    The purpose of Small Basic is to provide a programming language that is

    designed to make programming more approachable for newcomers. It is a great

    learning resource for beginners!


    If you run into any trouble while going through this book, here are some tips:


    +   1. Ensure you understand all the words and terms being used - clear any you

    don''t understand.

    2. Ensure your code is written exactly as laid out here. A small error in the
    code,

    such as a typo, can ruin the whole program. Code must be exact for programs

    to run properly, so always meticulously check your code for errors.

    3. Research online for solutions.

    4. Contact The Tech Academy.'
  merge: -1
