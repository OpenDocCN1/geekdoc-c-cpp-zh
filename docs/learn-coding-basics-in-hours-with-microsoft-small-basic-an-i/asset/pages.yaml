  md: '# INTRODUCTION


    Welcome!


    This book will be useful for individuals who are interested in learning coding
    and the basics of Small Basic. Don''t worry if you haven''t ever coded before
    though, this book doesn''t require any previous knowledge or experience.


    If you have written code before, this book isn''t recommended because it was made
    for total beginners (people with absolutely no prior experience).


    This book should be read start to finish, with all assignments completed in order.
    All tasks and code you are required to write herein are written in gray font.
    As a developer-in-training, you need all the experience you can get in typing
    code! So, definitely type all of code in this book.


    As this book is meant for newcomers, we won''t start writing code until Section
    Three. The first couple sections we will be covering programming fundamentals
    and the required vocabulary. Please be patient because writing code without any
    understanding of the basics of coding is a waste of time and creates nothing more
    than a parrot.


    The information presented in this book is arranged in a gradient sequence – we
    will start with the easiest information first and end with the most difficult
    tasks.


    The purpose of this book is to create: A programmer who understands the basics
    of coding and can write code in Small Basic.


    This book was written by The Tech Academy. We are a licensed career school that
    trains students in computer programming and web development. If you''re interested
    in finding out more about us, please visit our website: https://www.learncodinganywhere.com/


    Let''s begin this book with some fundamental terms to orient you to the subject.'
