  md: 'If we create a loop and don''t close the loop, the code will continue on forever.

    Here''s an example:


    ```

    Write and execute the following code:

    Begin:

    A = 50

    If A > 25 Then

    Window.WriteLine("50 is more than 25!")

    Goto Begin

