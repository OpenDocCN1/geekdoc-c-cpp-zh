  md: 'The basic job of all processors is to execute various combinations of those
    simple instructions built into them. It only ever performs one of these instructions
    at a time, but modern computers can perform billions of instructions per second.


    All actions you can make a computer do will be composed of various combinations
    of these built-in actions.


    These built-in instructions are called machine instructions. Together, they are
    machine language.


    Machine language is data that is composed of a series of 1s and 0s; computers
    are operated using 1s and 0s since it is very easy to make a machine that has
    only to differentiate between two different states.


    When computers are manufactured, the CPU is so it will obey certain instructions
    and perform exact actions when given those instructions. The machine instructions
    are available from the manufacturer of the computer.


    EXAMPLE: Let''s say "10101100 01100111 01010111 01010110" told the computer to
    "Delete the file called Vacation.doc." The "10101000 01100111 01010111 01010110"
    is a machine instruction.


    It is difficult for people to read and write in machine language, since the instructions
    are unique patterns of ones and zeroes.


    **Low-level language:** A low-level language is a programming language that is
    at, or just above machine language in terms of readability - that is, it uses
    codes to represent specific machine language instructions, or different combinations
    of machine language instructions.


    These codes are not the ones and zeroes of machine language; rather, they might
    look like this:


    ```

    MOV AL, 61h

    ```


    This might be codes that mean "store the amount 97 in a special location in the
    CPU for later use"


    This is more readable than ones and zeros of machine language, but is still very
    easy to work in.


    **Code:** There are a couple of definitions for "code." The first is: what you
    type into a computer to make programs. Code is written in specialized computer
    languages. Coding means typing out instructions (using a particular computer language)
    to make a program that will make the computer perform certain actions.'
  merge: -1
