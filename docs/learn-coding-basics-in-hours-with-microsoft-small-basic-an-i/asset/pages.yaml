    \ this has been covered above.\nStep 3h: Since we have now graded a paper, add\
    \ one to our Counter variable.\nStep 3i: Go to the top of the loop, where we check\
    \ to see if we need to execute the loop all over again.\n\nLet's see what would\
    \ happen if we used this program to grade two papers.\n\nLet's say that the papers\
