  md: '# SECTION SIXTEEN

    ARRAYS


    An array is a collection of data, arranged in rows and columns. In computers,
    an array is a group of related things that are stored together in a sequence.
    It is a way things can be organized in a computer in a logical way. Arrays can
    be quite simple, or quite complex.


    EXAMPLE: A simple array would be something like the numbers 7, 3 and 15. It would
    be written out like this:


    ```

    [7,3,15]

    ```


    These three pieces of data are called elements – they are the elements of the
    array.


    A system is needed for identifying each element of an array. The simplest method
    for this is to start numbering them at zero starting at the left position and
    count up from there.


    In the above example, the element "7" would be at position 0, "3" would be position
    1 and "15" would be at position 2.


    Another word for the position of an element is the "index" of the element - for
    the above example of an array, index 0 is "7", index 1 is "3", etc. The plural
    form if "index" is "indices", pronounced IN-dih-sees.


    Each element, therefore, has two properties: its index and its value.


    EXAMPLE: You have three pictures of your cat and you could save them in an array:
    CatPic1, CatPic2 and CatPic3. Here, index 1 has a value of "CatPic2".


    In some computer languages, including SmallBasic, the index for an element in
    an array can be a unique text item, instead of a number.


    Example:


    You could have an array with three elements: 4, 22, 88


    The indices for these elements could be:


    +   - "planes"

    - "trains"

    - "automobiles"'
