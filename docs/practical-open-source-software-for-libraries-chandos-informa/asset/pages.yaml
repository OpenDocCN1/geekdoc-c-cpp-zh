  md: '# Open source on the web


    More and more librarians are being asked to join the ranks of the information
    technology staff. When I started in libraries I was in charge of the library websites.
    It was unthinkable that a librarian would have the skills, the desire, or the
    time for such a task. Now, with the prevalence of technology and the ever-shrinking
    library budgets, more and more librarians are stepping into the role of webmaster
    and, to do the job right, you need the right tools.


    On the plus side, with the advent of the read/write web there are plenty of tools
    available for non developers to use to help create their websites, and many of
    them are open source.


    # Getting files onto the web


    Before you start your website, you need at least one tool to help you transfer
