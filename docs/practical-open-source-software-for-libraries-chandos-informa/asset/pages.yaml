  md: '# 1.1 Definition of free software


    Free software is a matter of the users'' freedom to run, copy, distribute, study,
    change and improve the software. More precisely, it means that the program''s
    users have the four essential freedoms:


    +   - The freedom to run the program, for any purpose (freedom 0).

    - The freedom to study how the program works, and change it to make it do what
    you want (freedom 1). Access to the source code is a precondition for this.

    - The freedom to redistribute copies so you can help your neighbor (freedom 2).

    - The freedom to improve the program; and release your improvements (and modified
    versions in general) to the public, so that the whole community benefits (freedom
    3). Access to the source code is a precondition for this.


    > Source: Free Software Foundation, Inc., The Free Software Definition, 2009,
    http://www.gnu.org/philosophy/free-sw.html.


    of this resource, the two will use interchangeably because I agree with Scott
    Colord when he says ''for practical purposes they provide the same basic advantages
    (and challenges) in a library or information science setting.''9 In fact, this
    is why many writers will refer to FOSS or F/OSS when talking about free and/or
    open source software.


    While all of the applications discussed later in this book are available for download
    for free, it is important to realize that there can be monetary costs associated
    with choosing an open source application.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# 1.2 Definition of open source software


    Introduction


    Open source doesn''t just mean access to the source code.

    The distribution terms of open source software must

    ply with the following criteria:


    +   1. Free Redistribution

    The license shall not restrict any party from selling or

    giving away the software as a component of an aggregate

    software distribution containing programs from several

    different sources. The license shall not require a royalty

    or other fee for such sale.


    +   2. Source Code

    The program must include source code, and must allow

    distribution in source code as well as compiled form. Where

    some of a product is not distributed with source code,

    there must be a well-publicized means of obtaining the

    source code for no more than a reasonable reproduction

    cost, preferably downloading via the Internet without

    charge. The source code must be the preferred form in

    which a programmer would modify the program. Deliberately

    obfuscated source code is not allowed, intermediate forms

    as the output are allowed.


    +   3. Derived Works

    The license must allow modifications and derived works,

    and allow them to be distributed under the same

    terms as the license of the original software.


    +   4. Integrity of The Author''s Source Code

    The license may restrict source-code from being

    distributed in modified form only if the license allows the

    distribution of "patch files" with the source code for the'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# Practical Open Source Software for Libraries


    purpose of modifying the program at build time. The license must explicitly permit
    distribution of software built from modified source code. The license may require
    derived works to carry a different name or version number from the original software.


    # 5. No Discrimination Against Persons or Groups


    The license must not discriminate against any person or group of persons.


    # 6. No Discrimination Against Fields of Endeavor


    The license must not restrict anyone from making of the program in a specific
    field of endeavor. For example, it may not restrict the program from being used
    in a business, or from being used for genetic research.


    > Source: Free Software Foundation, Inc., The Free Software Definition, 2009,
    http://www.gnu.org/philosophy/free-sw.html.


    # The costs of open source


    Many of us have downloaded and used open source software without ever shelling
    out a dime. One example for me would be Mozilla''s Firefox browser (http://firefox.com).
    I downloaded Firefox for free, installed it in minutes and have never needed to
    pay for support, development or additional services. Mozilla gives me the opportunity
    to donate money and my time to help with the further development of Firefox. Not
    all open source applications will be like Firefox.


    When looking at open source software it is important to think about the skills
    within your organization before making a final move. Depending on the people within
    your organization you may have to outsource some areas of migrating to an open
    source application. Possible costs that go along with open source might include
    fees for development or customization, installation, training, help desk or support,
    and hosting.'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'What is open source?


    Always talk to staff and see if anyone is using open source applications at home.
    This may eliminate the need to invest in outside training. For example, when surveyed,
    43 per cent library professionals said they were using OpenOffice (http://openoffice.org)
    at home versus only 29 cent who were using it at work. That is a large population
    of your staff who have experience using an application that you may be considering
    moving to the near future.


    # Prevalence of open source


    When teaching open source I often ask anyone in the room is using Firefox and
    of those who raised their hands many knew that they were using an open source
    application. In most cases fewer than half of the attendees know that they were
    already using open source software. Tim O''Reilly wrote about a very similar question
    he asks his audiences:


    I have a simple test that I use in my talks to see if my audience of computer
    industry professionals is thinking with the old paradigm or the new. ''How many
    of 20 of you use Linux?'' I ask. Depending on the venue, 20–80% of the audience
    might raise its hands. ''How many of you use Google?'' Every hand in the room
    goes up. And the light begins to dawn. Every one of them uses Google''s massive
    complex of 100,000 Linux servers, but they were blinded to the answer by a mindset
    in which ''the software you use'' is defined as the software running on the computer
    in front of you. Most of the ''killer apps'' of the Internet, applications used
    by hundreds of millions of people, run on Linux or FreeBSD.¹⁰'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'The fact is that open source is running more than half of the internet. Netcraft
    found that Apache ran 52.32 per cent of active websites in January 2010 versus
    Microsoft, which was running only 17.66 per cent.¹¹) O''Reilly also notes that
    there is more open source than just Apache running the internet:


    Much of the role of open source in the development of the Internet is well known:
    The most widely used TCP/IP protocol implementation was developed as part of Berkeley;
    Bnd runs the DNS, without which none of the web sites we depend on would be reachable;
    sendmail is the heart of the Internet backbone; Apache is the dominant web server;
    Perl the dominant language for creating dynamic sites, etc.¹²


    While open source software is a new, hot, area of interest for libraries and librarians,
    open source, as we have seen, as a new way of doing things.


    # Sharing


    One of the hallmarks of open source is the idea of free collaboration. As stated
    earlier, open source is not just about the code and the freedom to alter that.
    This is why I suggest you talk to your staff and colleagues to see what skills
    might be hidden in plain view. As librarians we are taught to work collaboratively
    and it is important to carry that lesson on to our work with open source.


    In later chapters I will discuss the idea of sharing and community in open source
    in more detail.'
  merge: -1
