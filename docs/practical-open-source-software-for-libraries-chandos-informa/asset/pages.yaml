  md: '# Debunking the myths


    In my years working in the open source community, I have heard nearly every excuse
    why people are not using source. Some of these excuses are specific to libraries
    and others can be applied to any community worldwide.

    Apache runs 52.32 per of active websites¹ and Firefox is the web browser of choice
    for 30.71 per of the world''s population. So, whether or not librarians realize
    it, nearly every information organization is using open source software in some
    way.


    # Homegrown is not open source


    When it came time to automate the card catalog, some libraries decided to try
    building their own systems. These systems did what the library needed, but staff
    changes in the library made it clear that homegrown systems were too much. The
    problem was that libraries built systems that only they knew how to run and update;
    if libraries thought to release their code on the internet and work with other
    libraries, the open source integrated library system would probably be the standard
    today.

    It is this memory that stops many libraries from trying open source applications
    (particularly open source integrated library systems). It is very important to
    make it clear that open'
  merge: -1
  pgno: 35
- img_proc: true
  md: 'source software often starts out as homegrown, but has moved on levels past
    that. A homegrown system only has those in the home organization to manage and
    maintain it. A successful open source system has an entire community behind it.


    # How can it be any good if it''s free?


    As stated earlier chapters, people often assume that open source software is free
    of cost. Many administrators have been known to take this misconception one step
    further and refuse to use open source for fear that free software surely cannot
    be as good as other costly options. Assumptions like these are another reason
    that adoption of open source software in libraries hasn''t been as widespread
    as in other arenas.


    So, how do you combat a misconception that is so widespread we see it in all areas
    of our lives? We''ve all heard, at one time or another, in retail outlets asking
    why one product is cheaper than another, what''s the difference, what is missing
    from the cheaper product? It''s not easy to convince an entire culture that free
    can be just as good – if not better – than the more pricey alternatives.


    The fact, as we''ve already learned, is that not all open source software is available
    for free and even if you do receive the software without a monetary payment, there
    will always be a time contribution necessary to make the switch. That alone won''t
    convince people, of course, but it bears mentioning in order to keep people educated
    on the topic.


    The best way to debunk this particular myth (and others like) is to provide real
