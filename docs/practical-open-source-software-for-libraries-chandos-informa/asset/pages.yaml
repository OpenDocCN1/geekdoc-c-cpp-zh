  md: '# What is open source?


    The Open Source Initiative defines open source software as software that is distributed
    with human readable source code in order to allow the user freedom to run, review,
    alter, enhance and modify the code for any purpose.¹ But open source is about
    much more than just the code behind the software; it''s about community, collaboration
    and innovation.


    In today''s world of competing products it might be hard to believe that all applications
    were open source.² Donald Rosenberg explained it well when he said that ''open
    source is not a new way of doing things – it is the original computer way of doing
    things.''¹³ At the same time Eric Raymond reminds us that enthusiasts, artists,
    tinkerers, problem solvers and experts known as ''hackers'' built the internet,
    World Wide Web, Unix and Linux.⁴ Contrary to be a hacker is not to be a menace,
    but to be a computer programmer. This is an important distinction to make early
    on, since many open source developers proudly call themselves hackers.


    Before the internet was ARPANet, a transcontinental network only accessible to
    the US Department of Defense, universities and contractors. This invention brought
    together hackers from all over the country to collaborate over the network and
    create applications to make their lives (and eventually all of our lives) easier.
    It was this connection that brought about the development of many of the world''s
    first open source applications.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Practical Open Source Software for Libraries


    The focus of this book is not to go into an in-depth history of open source –
    for that you can refer any number of amazing titles – but I think it''s important
    at least to talk about some of the hallmarks of open source history to give you
    a deeper understanding of the ideals around open source and free software.


    # Scratching at an itch


    Open source applications often start out with a developer ''scratching at an itch''
    or solving a problem that might be bothering them or colleagues. Most applications
    started as a project by one person or a small local group to solve a problem that
    had been buggy. Probably the most well known of these projects is the invention
    of Linux.


    It was 1991, Linus Torvalds, a student in Finland, was trying to find an operating
    system that would work on his PC. When nothing met his needs, he decided to write
    his own operating system, in effect, scratching his itch. After completing his
    work (only to meet his needs), Linus released his operating system (later to be
    known as Linux) to his hacker, to gather comments, suggestions and maybe even
    get some help improving the product. This project, which started as a hobby, has
    grown to be the most well-known, most written about and most popular open source
    project on the web today – and it all started with an itch.


    # Freedom for all


    Linus'' release of Linux to all on the internet has led to a common misconception
    about open source and free software: that the term ''free'' refers to price. In
    fact, when surveyed in'
  merge: -1
