  md: 'the Computer Science Department at University of Waikato develops and maintains
    Greenstone.


    # How are you using Greenstone in your library?


    We are using Greenstone for two collections. The first collection is the New Zealand
    Gazette, which is provided commercially; we use Greenstone to manage the PDF documents
    locally. This was the original impetus for Greenstone, as the provided proprietary
    software was not really fit for purpose.


    The other collection is the parts of the London illustrated 1842-1902 that relate
    to New Zealand. This collection is publicly available and contains scanned images
    of the pages along with OCR for searching.


    We have some local collections that we hope to make available using Greenstone
    in the near future.


    # How long have you been using Greenstone in your library?


    Some five years (possibly six years). We are about to upgrade to the latest version.


    # Did you have any trouble implementing Greenstone in your library?


    No.


    # What was the process of switching from proprietary to open source like?


    It was a major improvement, as we gained control of how the collection(s) presented
    to the user and how services the user might want were presented.


    # Did you have help installing, migrating to, or setting up Greenstone?


    No, we worked it out ourselves; however I do think the documentation for the upgrade
    version we are about to migrate to is far better what we dealt with originally.'
