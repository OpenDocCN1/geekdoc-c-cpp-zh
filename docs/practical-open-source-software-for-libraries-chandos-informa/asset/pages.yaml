    available to help with managing your library website. The key is to try out a
    few options before making a choice and always remember to contact your colleagues
    around the world to see how they are using the applications, why they choose them
    and if they are happy with their choice. Also remember that the opensourceCMS
    (http://opensourcecms.com) and others like it allow you to test open source web
    applications before actually pitching them to your library staff or installing
    them yourself.


