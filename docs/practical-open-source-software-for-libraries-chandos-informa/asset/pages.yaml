    tedious to keep up to date if you are not using the right tool. In my library
    we were just using a series of static HTML pages that had to be updated regularly,a
    practice not uncommon in libraries around the world.


    Two open source tools that libraries have created to tackle this problem are SubjectsPlus
    (http://www.subjectplus.com) and Library à la Carte™ (http://alacarte.library.orestate.edu).'
