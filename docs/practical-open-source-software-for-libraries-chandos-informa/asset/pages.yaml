  md: '# What do others in your library say about Kete?


    Those who embrace the project and commit resources to market it in the community
    and actively encourage and support the creation of content get a lot more from
    Kete than those who expect it to populate itself. It takes time and effort to
    build an online community. I make sure I respond to new contributors and acknowledge
    their additions to Kete through comments, making gentle suggestions or editing
    out obvious mistakes. I also like to celebrate submissions by making them feature
    topics on the home page. Kete is not a silver bullet, but it is an amazing excuse
    to get out and talk to every organisation, club and community group in your town
    – and build a great local resource while you are at.


    Joann Ransom writes about the process of choosing the name Kete for this community-built
    digital library:


    > Echoing the Maori proverb of the three baskets, kete, of knowledge, we called
    our concept Kete. We really like what the kete represents. We like that they are
    ‘honest’, practical items, woven from found materials, and that anyone can learn
    to weave one. We like that they are made from flax, which springs forth from Patapatuanuku,
    the earth mother. We like the link between the flax and the weaver – the person
    who caressed and shaped the flax into a beautiful or useful object. We like that
    kete are usually given from 1 person to another, so linking people together, and
    that they are usually given to mark an occasion so there are stories that surround
    a kete. When a kete is used and taken from one occasion to another, the stories
    are being told and the history preserved. The kete is an appropriate metaphor
    for our digital library, and the various types of material it contains.4'
