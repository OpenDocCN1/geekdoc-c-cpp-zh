  md: 'Like the four open source OPACs, Koha and Evergreen are similar in many ways,
    and different in a few. Evergreen was developed with the consortium in mind, so
    although Koha can and does work in a consortium environment, Evergreen handles
    the consortium rules and permissions much better. On the flip side, Koha makes
    more sense for large and/special libraries because it has the ability to manage
    your library''s acquisitions and serials. That said, these small differences are
    slowly disappearing as finishing serials and acquisitions support and Koha developers
    work on creating system groups and consortium-like permissions.


    The beauty of the open source integrated library system is that the more libraries
    that are using the system the more new and improved features become available.
    When Koha developed it was for one library and its specific needs. When Evergreen
    was developed it was meant to work in one specific library consortium environment.
    Over the years both systems have been adopted by libraries that are unlike the
    original audience and the developments that have come out of those adoptions make
    tools more powerful and valuable.


    As with any open source application, it is important to test all the systems available
    to you before making a decision. Both Evergreen and Koha offer online public demos
    (usually in more than one place) that you can try before you decide. Once your
    decision is made you can handle the migration on your own or turn to any number
    of support companies worldwide.¹¹²


