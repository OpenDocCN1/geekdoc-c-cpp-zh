    《图书馆实用型开源软件》


    由 Casey Bisson 在 2006 年就职普普茅斯州立大学拉姆森图书馆期间开发。¹Scriblio 吸收了 WordPress 内容管理系统的功能，并将在线公共书检索目录（OPAC）整合到其中。使用
    Scriblio 的图书馆只需使用 WordPress 设计其整个图书馆网站，读者就可以从图书馆首页搜索书籍（见图 11.1），而完全察觉不到自己已经离开了图书馆网站进入了
    OPAC。


    | 11.1 现实世界中的开源：Scriblio |

    | :--- |

    | Brett Bonfield，Collingswood 公立图书馆院长，美国新泽西州科林斯伍德 |


    ### ### 为什么你决定在图书馆中使用 Scriblio？


    对我来说，最初决定使用 Scriblio 以及一直坚持使用它的决定，既是困难的，又显而易见的。我非常喜欢使用 WordPress 并对它非常熟悉——在参加目前工作的第一次面试之前，我就创建了一个非常基础的
    Scriblio 站点，设置它只用了几个小时——而且我非常喜欢 Casey Bisson 这个人以及他的 Web开发者：我们对图书馆的愿景非常相似。例如，Scriblio
    创建了统一的网站：对于使用 Scriblio 的图书馆，目录和网站的其他部分看起来完全一样，并且运行在完全相同的软件上。最终促成合作的是 Scriblio
    获得资金的能力，以及它决定将部分资金用于 CollingswoodLib.org（以及类似的图书馆）的免费托管服务。


    ### ### 你们在图书馆是如何使用 Scriblio 的？


    作为我们的网站。


    ### ### 你在图书馆中使用 Scriblio 多久了？


    网站已经上线快一年了，尽管我大约在 18 个月前就开始接触 Scriblio（与其开发者 Casey Bisson 合作）。


    ### ### 你在图书馆实施 Scriblio 时遇到过困难吗？


    确实遇到过问题。其中很多已经解决了，但还有几个悬而解决的问题。


    ### ### 从专有切换到开源的过程是怎样的？


    我们并没有真正切换。Millennium 仍然在那里，包括它的网页 OPAC 接口。Scriblio 只是对它的补充。


    ### ### 你们在安装、迁移或设置 Scriblio 时得到过帮助吗？


    我直接与主开发者 Casey Bisson 合作。


    ### ### 你对 Scriblio 怎么看？


    Scriblio 并不完美，但我用起来很舒服，并对它的发展方向感到兴奋。虽然如果有更大的开发者社区、更多内部对标准的关注以及更好的文档，我会更得开心心，但我有能力帮助实现这些改变。


    ### ### 你们图书馆的其他人对 Scriblio 怎么说？


    很多人喜欢它；也有人更倾向于旧系统。德威说：大多数深入了解它的人对它产生了好感。而其他地方的人想要一个像 Google 一样工作的网站，以及一个像巴诺书（Barnes
    & Noble）一样工作的书架系统。


    ### ### 关于 Scriblio 或你们切换到 Scriblio 的过程，还有什么想知道的吗？


    我在这里写了一篇关于我决定的文章：http://www.inthelibrarywiththeleadpipe.org/2009/we-b-s-i-t-e-find-out-what-it-means-to-me/。


