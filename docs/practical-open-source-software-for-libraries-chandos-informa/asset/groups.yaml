    # 网页上的开源


    图 8.4 图书员创建的 MaiaCMS 管理区域


    ![](img/4e1ec39c661a9fa73febd901135781ce_111_0.png)


    ## 8.4 现实世界中的开源：MaiaCMS


    Danny Bouman，Web 开发者

    霍华县立图书馆

    美国马里兰州哥伦比亚亚亚


    你为什么决定为你的图书馆开发 MaiaCMS？


    我决定开发 MaiaCMS 是因为图书馆对设计一个新网站感兴趣，并且需要一个内容管理系统，让非技术人员能够为网站内容的贡献并进行维护。我探索了几个现有的 CMS
    选项，如 Joomla 和 Drupal，但当时我对它们的复杂性，以及为了方便我们的用户而简化这些系统需要进行大量的调整感到并不满意。从零开始创建 MaiaCMS
    为我提供了一个创建一个真正定制系统的平台，该系统能够很好地满足霍华县图书馆的确切需求。


    ## 你们在图书馆是如何使用 MaiaCMS 的？


    MaiaCMS 目前是我们的公共网站（http://hclibrary.org），完全由我们的市场部门维护。


    ## 你们在图书馆使用 MaiaCMS 有多久了？


    我们使用 MaiaCMS 已经有一多年了。


    ## 从专有系统转向开源的过程是怎样的？


    我们之前没有专有系统。虽然它是由一家外部网络设计公司开发的，但我们一直有权根据需要修改网站。


    ## 你们现在对 MaiaCMS 怎么看？


    MaiaCMS 对霍华县图书馆来说继续运行得非常好，这很大程度上是因为它是为霍华县图书馆开发的。如果让我重头来一次，我会选择以 Joomla 或 Drupal
    为基础，而不是从零开始开发新系统。我发现，当我向公众发布 MaiaCMS 时，我被迫复制许多 Joomla 和 Drupal 中已经存在的功能。


    ## 你们图书馆的其他人对 MaiaCMS 怎么说？


    市场部门提到，他们发现它非常易用。许多员工评论说，简约的设计使其易于导航。


    从开发者的角度来看，我认为由于目前缺乏文档，安装和配置非常困难。


    ## 是否有任何在线或图书馆期刊中关于你们使用 MaiaCMS 的截图、文档或功能是我们应该关注的？


    文档（编写完成后）和截图可以在 http://maiacms.org 找到。


    # 网页上的开源


    MaiaCMS 的功能包括：


    - 简单直观的设计

    - 能够轻松创建和管理表单

    - 管理网站联系人的创新系统

    - 用于发送新闻稿、添加促销项目、发布公告和添加职位空缺组件


    关于 MaiaCMS 或你们切换到 MaiaCMS 的过程，还有什么想知道的吗？


    所有代码都在 http://maiacms.org 向任何想要使用它的人免费提供。由于项目仍处于婴儿阶段，网站管理员需要熟悉 PHP 才能安装和配置该产品。


    MaiaCMS 的缺点是它目前仅在图书馆使用，没有活跃的社区来寻求支持，也没有在线文档。我建议图书管理员们关注 MaiaCMS，但在它周围有更多活动之前，不要跳到实施它的这一步。


    WordPress (http://wordpress.org) 经常作为内容管理系统被忽视。它最初被用作博客平台，WordPress 最近的升级使其成为通常被认为是顶级源内容管理系统的可行替代方案（请参见表
    8.1 进行基础 CMS 比较）。WordPress 拥有一个优秀的开源应用程序的所有的所有特征：活跃的社区、强大的基础、详尽的文档以及通过用户开发的插件扩展功能的能力。事实上，WordPress
    在大型网站上的数量几乎是 Drupal 的三倍²（而 Drupal 比 Joomla 多使用三倍）。³


    # 图书馆实用开源软件


    ## 表 8.1 内容管理系统比较


    | | Joomla | Drupal | MaiaCMS | WordPress |

    |---|---|---|---|---|

    | 预制模板 | 是 | 是 | 否 | 是 |

    | Wiki 功能 | 带插件 | 带插件 | 否 | 带插件 |

    | 博客功能 | 是 | 是 | 否 | 是 |

    | 支持选项 | 论坛 | 论坛 | 邮件列表 | 论坛 |

    | 图书馆社区 | 是 | 是 | 否 | 是 |

    | 扩展 | 是 | 是 | 是 | 是 |

    | 多用户访问 | 是 | 是 | 是 | 是 |

    | OPAC 插件 | 否 | SOPAC2 | 是 | Scriblo |

    | 内置搜索 | 是 | 是 | 是 | 是 |

    | RSS Feed | 是 | 是 | 是 | 是 |


    对于不熟悉安装 Web 应用的人来说，WordPress 卖点之一是它的五秒安装。你会被问几个问题，点击提交，你的 WordPress 网站就会运行起来。你可以浏览易于理解的“设置”部分，并自定义人们与你的新网站交互的方式。最花时间的是找到你最喜欢的主题。在向同事图书员教授
    WordPress 时，这是课程中总是持续最长的部分，这充分证明了学习 WordPress（见图 8.5）并使用它管理整个网站是多么容易。


    ## 与同事咨询


    在选择使用新或不熟悉的工具时，能够接触先走过的同事总是很有帮助的


    # 网页上的开源


    图 8.5 MaiaCMS 的管理区域


    ## 8.5 现实世界中的开源：WordPress


    Susan Bryant，外联

    Morill 公立图书馆

    美国 Hiawatha


    你为什么决定使用 WordPress？


    WordPress 给了我们对网站的控制权。


    你使用 WordPress 多久了？


    从 2006 年开始。


    从专有系统转向开源的过程是怎样的？


    对于想进一步了解 Drupal 的人，有 Drupalib (http://drupalib.interoperating.info) 社区。该网站对于使用或想使用
    Drupal 管理图书馆网站的人来说也是信息的宝库。在这里，你可以通过参与邮件列表或论坛访问其他 Drupal 图书馆，你可以在展示中心看到其他使用 Drupal
    的图书馆。


    你现在对 WordPress 怎么看？


    我很喜欢它。用户界面非常简单，我每天都登录仪表板。我们可以有多名员工参与贡献。


    你们图书馆的其他人对 WordPress 怎么说？


    我们的员工认为我们的网站是回答问题的资源，建议添加新链接并删除未使用的链接以使网站更有用，我认为他们喜欢他们的建议可以立即实施。


    关于 WordPress 或你们切换到 WordPress 的过程，还有什么想让我们知道的吗？


    KLOW 团队的帮助和持续支持对我们决定使用 WordPress 重大。


    你们非常成功。这就是为什么在选择内容管理系统之前你应该了解三个社区。


    如果你对 Joomla 感兴趣，你可能想查看 Joomla in Libraries (http://www.joomlainlibrary.com) 社区。该网站专注于使用或想使用
    Joomla 管理网站或内网的图书馆。该网站上的有用内容非常惊人。你可以找到教程、其他图书馆的示例、讨论板等。


    最后，如果你对 WordPress 感兴趣，你的社区是 wp4jlib (http://www.webjunction.org/706)。该社区由公告板、wiki
    和讨论列表组成。有了已经实施了 WordPress 的图书馆可以参考，你的迁移将变得得多。


    '
