    开源研究工具


    更更容易研究特定主题，例如计算机科学（http://www.ithacacalibrary.com/sp/subjects/cs/）。


    管理静态 HTML 页面的一个问题是，你通常希望链接出现在多个页面上，但这意味着在更新时，你需要在多个地方进行查找。SubjectsPlus 允许你只需向系统添加一次资源，它就会出现在多个指南中。SubjectsPlus
    还允许你将每位学科馆员与一位“专家”关联起来，这样读者对他们正在研究的主题有额外问题时，就知道在图书馆或校园内应该联系谁了。


    来自俄勒冈州立大学图书馆的 Library à la Carte™ 是使用静态 HTML 页面制作你主题指南的另一种替代方案。与 SubjectsPlus
    类似，它允许轻松创建动态主题指南。与 SubjectsPlus 不同，Library à la Carte™ 不处理你的 A–Z 列表和员工目录，但它允许你创建课程页面和教程。


    ## 10.2 现实世界中的开源：Library à la Carte™


    | Kim Griggs，程序分析师；Margaret Mellinger，科学馆员；Jane Nichols，社会科学/人文馆员。美国俄勒冈州科林瓦斯，俄勒冈州立大学图书馆。
    |


    **你们为什么决定在图书馆中使用 Library à la Carte™？**


    在我们开发 Library à la Carte™ 期间，市场上只有少数软件产品可以创建图书馆课程和主题网页。我们评估了现有的产品，认为那些“面向图书馆的实用开源软件”并没有像我们预期的那样样，满足向指南中添加
    Web 2.0 功能的需求。LibGuides 当时尚未推出。因此，我们转而开发了一个内部解决方案。


    **你们在图书馆是如何使用 Library à la Carte™ 的？**


    学科馆员使用它来创建和管理课程作业页面以及主题指南。教学馆员正在使用它来构建教程。


    **你们在图书馆使用 Library à la Carte™ 有多久了？**


    自 2006/07 年作为交互式课程作业页面（ICAP）工具的最初版本以来。


    **从专有软件转向开源的过程是怎样的？**


    我们之前的做法是使用 Dreamweaver 和 Contribute 模板用 html 创建课程和主题页面。转换过程主要是为了理解网络内容管理系统的运作方式与使用
    html 模板何不同。馆员需要培训以充分利用 Library à la Carte™ 的所有功能。当馆员将内容移动到 Library à la Carte
    时，他们在呈现这些内容方面有了更多选择。


    **你们现在怎么看 Library à la Carte™？**


    我们喜欢它，并计划继续开发它。我们目前的重点是使用它制作教程，并通过云计算环境托管 Library à la Carte™。


    **你们图书馆的其他人对 Library à la Carte™ 怎么说？**


    反馈是积极的，馆员和图书馆管理员参与并支持它的持续开发。


    **关于 Library à la Carte™ 或你们切换到 Library à la Carte™ 的过程，还有什么想知道的吗？**


    自 2007 年发布以来，源代码已被下载了数百次。该工具目前正被我们所知的 20 多家图书馆使用：里德学院、波特兰社区学院、加利福尼亚州立大学（多个校区）、亚利桑那大学、蒙特利尔大学和谢菲德哈拉姆大学。


    Library à la Carte™ 为你的员工提供了一种易于管理专业领域指南的方法，而无需任何网页设计或开发知识（见图 10.2）。在 Library
    à la Carte™ 管理区域，你可以通过点击“创建新主题指南”链接来轻松创建你的指南。你的指南可以由多个标签组成，每个标签都包含信息。像 SubjectsPlus
    一样，你需要选择一个专家并包含他们的信息，以便研究人员能够轻松找到合适的人来提问。一旦页面创建完成，你只需点击“发布”按钮，你的页面就会出现在图书馆的网站上（见图
    10.3）。


