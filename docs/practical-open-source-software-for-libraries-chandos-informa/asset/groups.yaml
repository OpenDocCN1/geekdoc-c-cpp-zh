    The open source OPAC release was released in 2007 with VuFind (http://www.vufind.org).
    Released by Villanova University to ‘emp users by supporting personalization and
    social networking services such as tagging and peer-to-peer comment sharing,¹²
    VuFind’s simple interface became very popular among OPAC critics (see Figure 11.2).


