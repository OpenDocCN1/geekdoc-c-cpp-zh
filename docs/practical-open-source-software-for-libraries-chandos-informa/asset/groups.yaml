    Practical Open Source Software for Libraries


    was developed by Casey Bisson while at the Lamson Library at the Plymouth State
    University in 2006.¹ Scriblio takes the power of the WordPress content management
    system and integrates the OPAC into it. Libraries using Scriblio simply use WordPress
    to design their entire library site and then patrons can search for books from
    the library homepage (see Figure 11.1) without ever realizing that they have left
    the library site for the OPAC.


    | 11.1 Open source in the real world: Scriblio |

    | :--- |

    | Brett Bonfield, Director, Collingswood Public Library, Collingswood NJ, USA
    |


    ### ### Why did you decide to use Scriblio in your library?


    For me, the initial decision to use Scriblio and the ongoing decision to stick
    with it are both difficult and obvious. I really like using WordPress and know
    it well - I created a very basic Scriblio site before I had my first interview
    for my current job, and setting it took just a few hours – and I really like Casey
    Bisson as a person and as a web developer: our visions for libraries are quite
    similar. Instance, Scriblio created unified websites: for Scriblio libraries,
    the catalog and the rest of the website took alike and run on exactly the same
    software. What closed the deal for us was Scriblio''s ability to pull in funding
    and its decision to turn some of that funding into free hosting for CollingswoodLib.org
    (and similar libraries).


    ### ### How are you using Scriblio in your library?


    As our website.


    ### How long have you been using Scriblio in your library?


    The website has been live for almost a year, though I started working with Scriblio
    (and with Casey Bisson, its developer) about 18 months ago.


    ### ### Did you have any trouble implementing Scriblio in your library?


    There have been issues, sure. Many of them have been fixed, but there are a few
    outstanding issues.


    ### ### What was the process of switching from proprietary to open source like?


    We didn''t really switch. Millennium is still there, including its web OPAC interface.
    Scriblio just complements it.


    ### ### Did you have any help installing, migrating to, or setting up Scriblio?


    I worked directly with Casey Bisson, the main developer.


    ### ### What do you think of Scriblio?


    Scriblio isn''t perfect, but I''m very comfortable with it and excited about where
    it''s heading. While I''ll be happier when there is a larger developer community,
    more internal interest in standards, and better documentation, I have the ability
    to help make these changes.


    ### ### What do others in your library say about Scriblio?


    Many people like it; some prefer the old system. Dewey: most of the people who
    have gotten to know it well have developed a fondness for it. The rest of the
    world wants a website that works like Google and a shelving system that works
    like Barnes & Noble.


    ### ### Anything else do you want to know about Scriblio or your process of switching
    to Scriblio?


    I have written a full article about my decision here: http://www.inthelibrarywiththeleadpipe.org/2009/we-b-s-i-t-e-find-out-what-it-means-to-me/.


