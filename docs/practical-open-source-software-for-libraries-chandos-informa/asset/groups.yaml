    # 开源网页访问


    图书馆员没有一天不是以这种或那种方式访问互联网。我们需要在网上进行研究，通过电子邮件回答参考性问题，并从供应商处在线购买书籍。正如我们的电脑不需要使用专有软件一样，我们访问网页也不需要专有软件。


    # 开源网页浏览器


    如果你只想在本书提到的开源应用中切换到仅此一种（尽管我希望情况并非如此），那么 Firefox (http://www.firefox.com) 绝对是你的不之选（见图
    6.1）。Firefox 已经将网络浏览器从一种阅读网页的工具转变为一种与网页进行充分交互的方式。Firefox 的强大之处在于它的开源架构；因为任何人都可以看到
    Firefox 在幕后的工作原理，他们可以通过编写扩展和对整体代码改进提出建议来轻松地扩展它。


    与大多数开源应用一样，Firefox 也以能够在发布周期之间通过发布微型更新来修复漏洞和安全漏洞而闻名。图书馆管理员对切换到 Firefox 的最大且最误导的担忧之一就是安全。


    Security Fix (http://voices.washingtonpost.com/securityfix/) 的 Brian Krebs 在 2006
    年进行的一项研究显示，在 2006 年期间至少有 98 天，“微软没有提供软件修复来修复 [Internet Explorer] 的漏洞，犯罪分子正利用这些漏洞从用户那里窃取个人和财务数据。”¹
    相比之下，Firefox 只有一个只有九天的时间没有针对严重的安全漏洞提供补丁。


    有了这些数据，很难相信 Firefox 比 Internet Explorer 更安全。作为其默认框架的一部分，Firefox 包含了诸如拦截弹出、反恶意软件、反钓鱼、家长控制和无痕浏览等安全功能。如果这些不够，你可以扩展
    Firefox 以为你和你的读者提供更多保护。


    # 6.1 现实世界中的开源：Firefox


    Greg Johnson，数字倡议与系统管理员

    州长州立大学

    美国伊利诺斯州大学帕克市


    **你为什么决定在图书馆中使用 Firefox？**


    我们之前在使用 Internet Explorer 崩溃的问题实在太多了。此外，学生们似乎更喜欢它。


    **你们在图书馆是如何使用 Firefox 的？**


    我们将 Firefox 设为所有图书馆电脑的默认网络应用程序。


    **你们在图书馆使用 Firefox 多久了？**


    大约一年。


    **你们在图书馆实施 Firefox 时遇到过困难吗？**


    学生花了一段时间才停止寻找那个无处不在的 Internet Explorer 图标，那之后，我们没有遇到过任何问题。


    **从专有切换到开源的过程是怎样的？**


    很容易。


    **你们在安装、迁移或设置 Firefox 时得到过帮助吗？**


    由于它下载后是完全加载并准备就绪的，我们所做的只是将图书馆主页设置为主页，并将其镜像到所有电脑上。


    **你现在觉得 Firefox 怎么样？**


    它是目前个人电脑可用的最好的浏览器之一。


    **你们图书馆的其他人对 Firefox 怎么看？**


    很大程度上，图书馆员并不是 Firefox 的粉丝。其他技术人员更倾向于使用 Firefox 或 Google Chrome，这两者都是开源选项。


    除了高效的开发流程和内置安全性外，Firefox 还提供了许多实用的扩展来增加隐私、安全整体效率。这些是图书馆将公共终端（如果不是图书馆所有的电脑）切换到使用
    Firefox 作为默认浏览器的原因之一。在成千上万的可用扩展中，我最喜欢的是 AdBlockPlus (http://adblock.plus)。AdBlockPlus
    每天尽早阻止网页在你的浏览器中加载。另一种保护自己的方法是防止脚本在未询问你的情况下运行。许多图书馆员使用的扩展是 FlashBlock (https://addons.mozilla.org/en-US/firefox/addon/433)，它可以防止所有
    Flash 脚本在点击“播放”按钮之前在你的浏览器中运行。另一个防止脚本运行的扩展是 NoScript (https://addons.mozilla.org/en-US/firefox/addon/7722)。安装后，NoScript
    防止在没有你明确许可的情况下运行可执行内容。


    要寻找 Firefox 的更多安全扩展，你可以浏览它的安全扩展部分 (https://addons.mozilla.org/en-US/firefox/browse/type:cat12)。


    # 扩展 Firefox


    图 6.1 Firefox 浏览器


    ![](img/4e1ec39c661a9fa73febd901135781ce_67_0.png)


    我之前提到过，Firefox 已经远远不仅仅是一个网页浏览器；它还可以协助你进行研究。图书馆中流行的工具之一是 LibX (http://libx.org)。


    LibX 是一个开源浏览器工具栏，你可以自定义它来帮助读者（以及工作人员）在浏览时寻找图书馆资源。一旦使用 LibX 工具栏，它会在用户的浏览器顶部放置一个图书馆目录的搜索框（无需访问图书馆目录网站）。


    # 6.2 现实世界中的开源：LibX


    Chris Keene，技术开发经理

    萨塞克斯大学图书馆

    英国东萨塞克斯郡布莱顿


    **你为什么决定在图书馆中使用 LibX？**


    觉得它很有意思，并决定在有大约一小时空闲时间时设置它。


    **你们在图书馆是如何使用 LibX 的？**


    我们有一个公共 LibX 工具栏，但推广得不是很好。它可以搜索我们的本地目录（我们使用两个，Aquabrowser 和 Talis Prism）、在线期刊和链接解析器，并允许校园通过
    EZproxy 重新加载页面。它还搜索当地公共图书馆目录，我们对此得到了一些良好的反馈。


    此外，我们还有一个工作人员工具；这在一定是为了简化我们的书单。工作人员可以右键点击书名或 ISBN 并搜索我们的目录，更重要的是 Coutts Oasis（一种书籍供应商在线订购系统，它与我们的图书馆管理系统
    EDI Quotes 对接——用于创建订单）。我们经常使用 OCLC 的 xISBN，这样工作人员就可以右键点击 ISBN 就能发现无论版本如何我们是否有该书，等。我们目前正尝试整合
    xISBN 和 Coutts Oasis。


    **你们在图书馆使用 LibX 多久了？**


    我们有一个公共工具栏已经几年了，但最近才开始使用它。


    **你们在图书馆实施 LibX 时遇到过困难吗？**


    配置网站非常好，但确实有一些小问题。访问它很慢。我们没有遇到过真正的问题。


    **从专有切换到开源的过程是怎样的？**


    我不会说这是一个切换。这不是一个核心需求，我偶然发现了它，花了几个小时设置，展示给几个人看，然后安静地将其公开，并在随后对其进行完善。我们已经在使用开源应用（EPrints）和基础设施（Apache）等，并且会为其他需求再次使用它（例如
    VuFind）。


    **你们在安装、迁移或设置 Firefox 时得到过帮助吗？**


    没有，但网站上的帮助很好。而且我有计算机科学背景。


    **你现在觉得 LibX 怎么样？**


    非常棒且非常实用。我想看到它进一步开发。


    **你们图书馆的其他人对它怎么看？**


    工作人员非常喜欢它，特别是我们资源部门（书单、采购、编目）的人，他们一直面临提高效率的压力。它证明是节省时间的。用户似乎也喜欢它，尽管我们收到很少的反馈。我希望它能提供每个图书馆的下载量等使用统计数据。


    '
