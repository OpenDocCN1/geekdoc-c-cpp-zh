    ## 适用于图书馆的实用开源软件


    关于 Ubuntu 或你们切换到 Ubuntu 的过程，还有什么想让我们知道的吗？


    我宁愿每天都在与新操作系统作斗争，也不愿整天继续抱怨微软。


    了解更多


    Jessamyn 在 http://www.vimeo.com/4169783 安装了 Ubuntu。


    这一切都是为了服务不同的群体。虽然这些迭代版本中的任何一个都可以在图书馆中使用，但我选择了 Ubuntu (http://www.ubuntu.com)，因为它的易用性，以及它在图书管理员和教育工作者中的流行普及程度。


    为什么不选择 Ubuntu 操作系统呢？当我们看 Windows 时，我们知道这个名字的来源——源于你可以打开和关闭的所有查看应用程序和文档的窗口。Ubuntu
    是一个非洲词汇，意为“对他人的仁爱”或“因为有了你们，我才成为我”¹ 在本书提到的许多开源产品中，你会发现一些体现了开源精神的名字，而 Ubuntu 就是其中之一。


    在职业生涯中，我安装过几个不同的操作系统——有从头安装的也有升级的——我必须说，没有哪一次像安装 Ubuntu 一样简单。安装完成后，你不仅可以访问操作系统，还可以获得几个必要的应用程序，如完整的
    OpenOffice 套件、即时消息软件、游戏、记事本和其他必要的应用程序。如果你缺少某个应用程序，只需从在 Ubuntu 软件中心（见图 5.1）找到的
    Ubuntu 兼容应用程序内置目录中搜索即可。


    正是由于这些原因，当然还有因为 0 美元的价格标签，图书馆和教育机构正在将它们的公共机器（甚至包括一些员工机器）切换到 Ubuntu。


    ## 图 5.1 Ubuntu 软件中心


    ![](img/4e1ec39c661a9fa73febd901135781ce_51_0.png)


    在开源应用中，Ubuntu 是文档最完善的选项之一。你可以轻松在网上找到并打印指南，帮助你安装和日常使用该操作系统。活跃的在线社区在需要寻找快速答案时也是一个极佳的来源。


    ## 虚拟机


    作为一个从一个操作系统迁移到另一个操作系统的人，我知道进行切换可能会是非常可怕的。这就是为什么我使用 VirtualBox (http://www.virtualbox.org/)
    在切换之前测试不同的操作系统。在我的这台（也是唯一的）电脑上，我有能力在五个不同的操作系统中工作，无论是同时还是不同时间（见图 5.2）。


    ## 适用于图书馆的实用开源软件


    ### 图 5.2 在 VirtualBox 中打开的四个操作系统


    ![](img/4e1ec39c661a9fa73febd901135781ce_52_0.png)


    VirtualBox 允许你创建多个虚拟机，这些虚拟机在运行不同软件应用程序的同时可以利用你主机的硬件。这意味着你可以在 Windows 或 Mac OS
    上安装 VirtualBox，然后在上面安装 Ubuntu，以便在盲目切换之前学习如何使用不同的操作系统。这也意味着，如果你切换到 Ubuntu，你仍然可以使用
    VirtualBox 运行 Windows 或 Mac OS。


    这将允许那些开设课程的图书馆教读者如何使用在图书馆机器上运行的多个操作系统。正如 Heather 在她对 VirtualBox 的总结中提到的，这并不是你一直都会使用的应用程序，但它是一个非常好的节省时间的工具。


    ## 日常运营的开源软件


    ## 5.2 现实世界中的开源：VirtualBox


    Heather Braun，技术图书馆管理员

    东北堪萨斯图书馆系统

    美国堪萨斯州劳伦斯


    ### 为什么你决定在你的图书馆使用 VirtualBox？


    IT 部门和许多员工一直使用 Mac，但我们仍然需要方便地访问 Windows 工作，因为我们图书馆提供的技术支持和工作都是基于 PC 的。如果只是想并排使用
    Mac 和 PC（以及其他操作系统），BootCamp 是行得通的。但 BootCamp 是一个单系统解决方案，你一次只能运行一个。


    我们的网络管理员 Liz Rea 需要能够在她的 Mac 后台运行多个虚拟机。起初，我们购买了 Parallels 软件的许可，但该程序被证明非常笨拙、缓慢且多
    错误。当启动软件时，我们的电脑会冻结 10 分钟，其他成员非常讨厌它。虽然有新版本，但我们经常需要重启。我们讨厌它，其他员工也讨厌它，我们不想在每次发布新版本时都为软件付费升级，特别是当该软件根本没有运行得好的时候！


    然后我们发现了 VirtualBox。我们在 NK 已经在使用许多开源软件（Koha, WordPress, Firefox 和 OpenOffice），所以
    VirtualBox 对我们来说是非常自然的契合。在我们需要它的时候，它就是好用。不需要冻结或重启。


    ### 你们在图书馆是如何使用 VirtualBox 的？


    我们用它在 Mac 上模拟 Windows、Linux 发行版和 Linux 服务器发行版。Liz Rea 用它在她的 iMac 上运行 Koha 测试系统，以便她进行一些测试并熟悉系统。


    ### 你们在图书馆使用 VirtualBox 多久了？


    我们使用 VirtualBox 大约一年了。我们不经常用它，也许一个月一两次，但在我们需要时，它非常有帮助。


    ### 你们在图书馆实施 VirtualBox 遇到过困难吗？


    部署软件本身没有。在 VirtualBox 内部部署操作系统可能容易也可以困难。这取决于版本，以及 VirtualBox 的驱动对不同操作系统的支持程度。[作者注：Windows
    和 Ubuntu 都受支持且易于安装]


    ### 从专有软件切换到开源的过程是怎样的？


    部署软件本身没有。在 VirtualBox 内部部署操作系统可能容易也可以困难。这取决于版本，以及 VirtualBox 的驱动对不同操作系统的支持程度。[作者注：Windows
    和 Ubuntu 都受支持且易于安装]


    ### 你们其他同事对 VirtualBox 怎么看？


    Liz Rea，NEKS 系统管理员，也非常喜欢它。她是目前另一个一个使用它的人。


    ### 你们对现在的 VirtualBox 怎么看？


    我非常喜欢。


    ### 关于 Ubuntu 或你们切换到 Ubuntu 的过程，还有什么想让我们知道的吗？


    如果你是 Mac 用户，并且有一个你必须使用的应用程序，可以尝试改用 VirtualBox 看看。


    ## 办公套件


    一旦你安装了操作系统，你需要一个办公套件来帮助处理文档和计算需求。Ubuntu 预装了 OpenOffice 套件 (http://www.openoffice.org)。如果你没有使用
    Ubuntu，你仍然可以使用 OpenOffice。


    | 5.3 现实世界中的开源：OpenOffice |

    | :--- |

    | Kate，志愿者，女性集体图书馆，英国伦敦 |


    ### 为什么你决定在你的图书馆使用 OpenOffice？


    我必须承认，这主要是一个财务决定。我们是一家由志愿者运营的小型图书馆，商业办公软件的许可费用并不是一个现实的选择。我们考虑过在办公室的一些旧 PC 上安装
    Linux，但现在还没有准备好采取那一步。使用跨平台套件为我们以后留了空间。


    ### 你们在图书馆是如何使用 OpenOffice 的？


    我们使用 OpenOffice 处理女性集体图书馆的大部分行政工作。最近，由于我们将目录迁移到了图书馆管理系统，并正处于大型编目录项目中，我们一直在创建收藏部分的索引，并使用
    CALC 表格将数据转换为 MARC 记录以导入新目录。


    ### 你们在图书馆使用 OpenOffice 多久了？


    基本上，自从我们从 2008 年年中恢复图书馆运营以来，我们一直在用。我不确定在我的之前的之前的图书馆版本中是否使用过它。


    ### 你们在图书馆实施 OpenOffice 遇到过困难吗？


    在与其他组织共享文档时出现过细小故障，但 OpenOffice 的界面非常用户友好，我们的格式需求并不复杂。所以，虽然并不是所有的志愿者都像其他人那样极客，但在实施上并没有什么困难，每个人都适应得很快。


    '
