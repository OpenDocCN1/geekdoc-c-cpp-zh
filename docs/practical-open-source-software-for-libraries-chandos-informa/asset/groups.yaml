    手机，这是他们正尝试为笔记本电脑配置的操作系统。我觉得 Google 的那段他们进入时代广场询问人们“什么是浏览器？”的视频非常有启发性……当然，大多数人没有使用
    Firefox、chrome 或浏览器产品？随着越来越多的人了解开源产品，会有越来越多的人使用它们。我向许多读者推荐了 OpenOffice 和 Firefox。


    -   开源太棒了。如果能在某个地方讨论如何教学和宣传开源就太好了。


