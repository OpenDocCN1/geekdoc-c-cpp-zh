    # Community and open source


    The best person to do a job is the one who most wants to do that job; and the
    best people to evaluate their performance are their friends and peers who, by
    the way, will enthusiastically pitch in to improve the final product, simply for
    the sheer pleasure of helping one another and creating something beautiful from
    which they will all benefit.¹


    Open source is about so much more than the code and the programmers; it is also
    about the community and the power of the crowd to produce amazing products. Every
    successful (the key word ''successful'') open source project is backed by a community
    of developers and application users who keep it alive and kicking. While there
    are ways to make money from working on open source, you''ll find that many of
    these community members perform their duties to keep learning and share knowledge
    out of a love for the product and a sense of obligation to the community.²


    Peter Lawyer covers the variety of motives that open source developers have:


    Some contribute source code because it helps them with their day job. Some stay
    up all night writing code because they''re obsessed. Some consider it an act of
    charity, a kind of noblesse oblige. Some want to fix'
  - '[PAGE 27]


    bugs that bother them. Some want fame, glory, and the respect of all other computer
    programmers. There are thousands of reasons why new open source software gets
    written...³


    In his chapter on Geek culture, Russell Pavlice tries to help us understand the
    motives of open source community. He reminds us that if we are going to understand
    open source we have to understand the people and the culture behind it.⁴


    # Working for open source


    As professionals, we are all familiar with hierarchy and corporate structure.
    It is this knowledge that makes it hard to understand how an open source community
    can develop successful projects without such hierarchy.


    Open source communities are self governing and self organizing. This is because
    there are no executives in charge of deciding the direction of the software for
    the entire community.⁵ The open source community assumes that if enough people
    need or want a feature it will be written. Remember, open source is about scratching
    an itch and developers and users alike understand that when it arises a development
    will be submitted for inclusion in the product.


    Audris Mockus at point out that open source software follows a development process
    that is radically different from the traditional proprietary style of development:


    The main differences most often mentioned are the following.


    OSS systems are built by potentially large numbers (i.e., hundreds or even thousands)
    of volunteers. It is worth'
  - '[PAGE 28]


    Community and open source


    noting, however, that currently a number of OSS projects are supported by companies
    and some participants are not volunteers.


    Work is not assigned; people undertake the work they choose to undertake.¹


    # Working together


    To an outsider first joining an existing open source community, these differences
    in workflow make it look as if there is no control and no rules governing members,
    but once you become an active member in the community you learn that is not the
    case. Open source community members follow a series of unwritten rules, no matter
    what project they are working on.


    # Rule 1: Communication is key


    As most open source projects are worked on by a widespread community, it is key
    that everyone communicates. Without frequent communication, projects may end up
    having more than one developer working on implementing a feature instead of working
    together. It is for this that mailing lists with active open source projects never
    sleep. In fact, as Clay Shirley opens, open source communities often have more
    discussions than would be had among those working on a proprietary programming
    project.³


    One way that open source communities communicate is by sharing ongoing development
    projects (via bug databases, mailing lists, forums, wikis, and so on) so that
    everyone knows what is being worked on and time isn''t wasted with multiple people
    working on the same thing.


    15'
