    # Open source library automation


    I remember when my library first introduced the automated catalog. It was a black
    screen computer with bright green lettering. It was amazing to me that I could
    now search for the books I wanted without having to finger through the card catalog.
    We have a long way since then and have many choices available to us. One of the
    choices that has recently become more viable is the open source integrated library
    system.


    # Open source faces


    One obvious way to provide your patrons with better services is to improve the
    look, feel and functionality of your OPAC (online public access catalog). Although
    there are proprietary applications to this, they can be very costly, making your
    overall library automation budget stretch its limits. An alternative would be
    to use one of the many open source OPAC layers available for download today without
    any extra cost to you or your library.


    # Scriblio


    The first major open source OPAC to hit the web was WPopac, now known as Scriblio
    (http://scriblio.net), which'
