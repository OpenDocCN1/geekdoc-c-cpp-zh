    # What was the process of switching from proprietary to open source like?


    I can''t say we''ve entirely switched, nor we are likely to stop using EndNote
    as far as I can see. A lot of the campus still uses EndNote, but the two programs
    are coexisting happily so far. It helps that you can easily export data from one
