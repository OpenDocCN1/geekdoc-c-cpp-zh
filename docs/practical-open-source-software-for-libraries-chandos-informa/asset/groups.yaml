    +   1. ''January 2010 Web Server Survey.'' Netcraft, January 7, 2010. http://news.netcraft.com/archives/2010/01/07/january_2010_web_server_survey.html.

    2. ''Top 5 Browsers from Jan 09 to Feb 10.'' StatCounter Global Stats, February
    19, 2010. http://gs.statcounter.com/#browser-ww-monthly-200901-200102-bar.

    3. Mockus, Audris, Roy Fielding, and James Hersbleb. ''Two Case Studies of Open
    Source Software Development: Apache and Mozilla.'' ACM Transactions on Software
    Engineering and Methodology 11, no. 3 (July 2002): 309–346.'
