- md: '

    available? Do we have developers on staff ready/able to extend the product if
    need be? How mature is the product? How active is the community? These ''total
    cost of ownership'' considerations are the same between closed and open source.
    It''s also important to take open data standards into account. This is a larger
    issue than source control.


    - Our library seems to employ developers and use OSS for emerging applications
    (digital repositories, preservation), and in solid behind the scenes tasks (web
    servers, etc.), but when it comes to our ILS [integrated library system], I believe
    that only proprietary options are being considered. OSS does not fix existing
    tendering processes, and we don''t seem to be adopting new processes that would
    accommodate evaluation of open source and proprietary solutions to determine which
    source offers best value. The University is also trying to move towards a common
    computing environment that will be Windows-based – a very shortsighted move. We
    should focus more on interoperability and less on dictating what systems staff
    and students use. I think the licensing aspect puts many institutions off developing
    and releasing OSS. There isn''t much support available to help with this, although
    the OSS Watch group in the UK are now able to provide more guidance. JISC think
    they could do more to encourage UK HE and FE [higher education and further education]
    institutions to use it.


    - I recently attended a conference with Amy de Groff as a keynote speaker (talking
    about Ubuntu at her library) and presentations on open source ILS used in Indiana.
    Academic libraries in the state (KY) are looking at open-source ILS as possible
    replacement for Voyager, which is the current system used by state-supported higher
    education institutions.


    - I was lucky enough to take an open source class at StudioXX in Montreal which
    is affordable and really believes in using OS over proprietary software. See http://www.studioxx.org/en/courses.


    - I believe that open source is an important movement, especially in academic
    publishing. I take no pleasure in computer use, nor in web browsing: I use PC
    and get at home because there is no other way to get done. Personal privacy is
    important to me; I am not likely to download any applications, and I NEVER make
    purchases over internet. Feel free to contact me as the ''reluctant user''.


    - Open source and windows are both here to stay. Neither willlant the out. Neither
    MS for the ready support. Open source will continue to grow as zero initial cost
    to the public. Many feel Bill has too much market share (read that as control
    and money). I feel he has earned it and provided a great public service with MS
    products. Open source is fine, free of cost except much time is required in certain
    situations.


    - Open source is not for the we of heart. However, people of all skill levels
    can use and contribute to open source software. It makes pioneers of all of us.


    - I love the idea of open source ILS software, but am very skeptical about its
    ability to provide all that we have now in support and functionality for the same
    or less money. I''m hopeful that the Koha will not always be the case.


    - We are investigating Koha as a possible replacement for our very expensive and
    not very functional ILS, Symphony.


    - I predict this survey will have no truly surprising results of the sort that
    might require reconsideration of one or more of the hypotheses being tested. And
    a survey constructed merely to confirm one’s hypotheses (even if not explicitly
    intentionally so) falls into the category of ‘Lies, damn lines, and statistics’
    in terms of its value to scholarly research.


    - ■ I have Dyscape but love Drupal and CUFTS. Not all open source is equal.


    - ■ We are on Classic Dynix and are searching for a new ILS for integration in
    2010. We are at RFP finished and passed the board and now at the town lawyers
    and after that out for bid.


    - ■ Not sure how indicative this will be – it’s a bit generic and doesn’t question
    corporate/institutional attitude/acceptance of OS.


    - ■ Open source has much to offer libraries; the free exchange of information
    goes well with the free exchange of software.


    - ■ I’d use more open source software at work, but our IT department is fond of
    Microsoft.


    - ■ Also, use an open source VOIP software and video conferencing software. Looking
    in using Kete, but may use Fedora for digital projects.


    - ■ We are very interested in open source as an idea, but also aware that it is
    never ‘free’. We want to look for the bestsupport/sustainable performance we can
    provide for our users, no matter whether it is open source or proprietary. All
    other things being equal, we would prefer open source.


    - ■ The only reason I don’t use more open source is that I was a corporate IT
    minion and they were using products that I had to support thus my time was better
    spent using the stuff they already picked.


    - Open source = Good Commons.


    - Am interested in open source ILMS systems in the future. We are the only open
