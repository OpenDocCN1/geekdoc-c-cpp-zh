    ## 内容管理


    现在你已经可以将文件上传到网络了，你需要一些东西来上传。许多图书馆都选择使用内容管理系统来设计它们的图书馆网站。内容管理系统几乎就像一个装在箱里的网站；它包含了构建和维护网站所需的所有工具，无需任何正式的培训或开发技能。目前图书馆界有两个热门的开源内容管理系统：Joomla
    (http://www.joomla.org) 和 Drupal (http://www.drupal.org)。你的基础内容管理系统为你提供了创建网站页面的必要工具，而无需了解
    HTML 或任何其他编程语言。


    ## 8.2 现实世界中的开源：Joomla


    Jason Griffey，图书馆信息技术负责人

    田纳西州大学查塔加诺加分校 卢普顿图书馆

    美国田纳西州查塔加诺加


    **你为什么决定在你的图书馆中使用 Joomla？？**


    我们当时正在进行网站重新设计，关于内容管理系统的决定在 Joomla 或 Drupal 之间做出。选择使用 Joomla 的原因是，对于一个单人兼职开发者（我我）来说，创建一个主题并将内容移动其中更容易。Drupal
    虽很好，但考虑到时间限制，它超出了我的能力范围。Joomla 的开发速度快得多。


    **你在你的图书馆是如何使用 Joomla 的？**


    我们正在使用 Joomla 驱动图书馆的网站，但数据库页面和目录除外。


    **你在你的图书馆使用 Joomla 多久了？**


    我们从 2007 年初就开始全面使用 Joomla 了。


    **你在你的图书馆实施 Joomla 时遇到过困难吗？**


    除了时间限制外，没有。作为一所学术图书馆，当然有委员会参与，但我能够讨论开源的益处，并说服任何持怀疑的人。


    **从专有软件转向开源软件的过程是怎样的？**


    非常简单。虽然注重细节，但整个过程非常顺畅。


    **在安装、迁移或设置 Joomla 时得到过任何帮助吗？**


    没有，开发、安装等工作都是由我独立完成的。其他管理员协助了迁移，但我们没有寻求外部帮助。


    **你现在对 Joomla 怎么看？**


    我仍然更喜欢它而不是我们旧的静态文件解决方案，但它也有自己的问题。它处理内容和菜单的方式对于不习惯在 Joomla 上开发的人来说可能并不直观。但它仍然是一个健壮的平台。


    **你图书馆的其他人对 Joomla 怎么说？**


    他们大多对它很满意。在创建网站全新板块时存在一些问题……更新现有信息很容易，但创建新板块可能不那么直观。


    ## 网页上的开源


    使用 Drupal，网站的不同区域被划分为“任务”（tasks）和“模块”（modules）（见图 8.2）。任务本质上是页面的功能，即页面的作用。模块不仅仅是网站的一个区域，例如“活动”、“博客”或“用户”。在
    Joomla 中，内容被分类为“菜单”（Menus）、“内容”（Content）和“组件”（Components）（见图 8.3）。这些领域中的每一个都容纳了你可以修改和自定义的网站板块。在这两者中，导航方面各有胜秋，但都需要管理员的润色。最终，两者都有其优缺点；我的建议是尝试使用
    openopensource 网站 (http://opensourcecms.com) 上的演示版本，找到适合你需求的那个。


    要查看这些工具的功能，Joomla 和 Drupal 都维护着使用其产品之网站的展示案例（http://community.jooomla.org/showcase/
    和 http://drupal.org/cases）。


    > 图 8.2 GPLLA.org 的管理区域，由 Drupal 驱动


    ![](img/4e1ec39c661a9fa73febd901135781ce_107_0.png)


    ## 图书馆实用开源软件


    ### 图 8.3 Joomla 管理区域


    ![](img/4e1ec39c661a9fa73febd901135781ce_108_0.png)


    ## 8.3 现实世界中的开源：Drupal


    Paula Gray-Overtoom，信息系统管理员

    蒙罗伊县公共图书馆

    美国印第安纳州布鲁明顿


    **你为什么决定在你的图书馆中使用 Drupal？**


    我们希望为我们的内网拥有一个内容管理系统。我们之前使用 Macromedia/Adobe Contribute 配合模板来指导员工创建内容，但它还不够动态。我们希望不同部门都有员工博客，并允许所有员工为内网做出贡献。有了
    Drupal，我们不需要担心无法为所有员工支付许可证费用。


    **你在你的图书馆是如何使用 Drupal 的？**


    我们使用 Drupal 构建我们的内网。我们有部门博客、发布文档和员工会议信息。它是我们在服务区域内部以及区域之间交流的方式。


    **你在你的图书馆使用 Drupal 多久了？**


    我们安装 Drupal 大约一年了，但将所有员工迁移到我们新内网界面大约有一个月了。


    **你在你的图书馆实施 Drupal 时遇到过困难吗？**


    我学习如何安装模块以及 Drupal 的其他技术方面花了一些时间，但在线文档很好且易于获取。员工们学会 Drupal 非常快。我们为大多数员工举办了一小时的培训课程，介绍了更新账户信息和发布博客文章的基础知识。员工过渡到
    Drupal 遇到的问题很少。大多数人现在非常高兴，他们现在可以编辑页面而无需再使用 Utilize 了。


    **从专有软件转向开源软件的过程是怎样的？**


    无论如何，我们的 Web 服务器都使用开源软件，所以 Drupal 的过渡相当容易。由于许可费的原因，我们的 Contribute 版本一直处于落后，所以能够迁移到更新的软件要好得多。从使用
    Red Hat 开始，我就打算在网上寻找问题的答案，实际上我发现我更喜欢这种，而不是去一家专有公司并希望他们能响应我的需求。


    **在安装、迁移或设置 Drupal 时得到过任何帮助吗？**


    是我自己设置的 Drupal。


    **你现在对 Drupal 怎么看？**


    我非常喜欢它。它很好地满足了我们的需求，通常我有软件需求时，会在 Drupal 的贡献模块中搜索并找到一个实现我要求的模块。我认为这是最有趣的特点之一。


    ## 图书馆实用开源软件


    开源的特点在于总有人在开发东西来满足需求。


    **你图书馆的其他人对 Drupal 怎么说？**


    大家似乎都喜欢它。有些员工起初对此并不感，但我得到了非常积极的反馈。员工们很高兴能够轻松搜索网站并找到他们的内容。


    **关于 Drupal 或你切换到 Drupal 的过程还有什么想知道的吗？**


    Drupal 对于内网确实非常好。我们用它来创建各种手册书籍以组织文档，使用表单向 IT 或设施部门发送工作请求，并通过博客轻松交流。Drupal 展示中最近的一个热门案例是白宫官方网站
    (http://www.whitehouse.gov)，另一个显而易组合是 Linux.com (http://www.linux.com) 使用 Joomla，因为其关注开源。


    图书馆内容管理领域的新动态是 MaiaCMS (http://maiacms.org)，由美国马里兰州的霍华德县图书馆系统设计。MaiaCMS 是由管理员为管理员设计的，这使其成为图书馆网站的一个非常有前景的选择。我用过
    Joomla 和 Drupal，我唯一的抱怨是管理用户界面看起来比实际需要的要复杂。这就是为什么 MaiaCMS 让我感到兴奋；它是一个专为管理员设计的工具，所以菜单系统美观且易于导航（见图
    8.4），而且管理员需要的模块是标准安装的一部分，而不是仅作为插件可用。


    '
