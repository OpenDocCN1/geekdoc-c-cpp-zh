    What do others in your library say about LimeSurvey?


    The librarian who uses LimeSurvey regularly told me that it was easy to use.


    with them. When I started writing this book, I went out on a hunt for open source
    survey applications and came across LimeSurvey (http://limesurvey.org).


    LimeSurvey (see Figure 5.5) is an open source application that resides on your
    local web server. This means that you can host many polls and surveys as you want
