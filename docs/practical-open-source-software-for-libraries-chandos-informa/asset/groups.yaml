    # 11.3 现实世界中的开源：Blacklight


    Tom Kramer，数字图书馆系统与服务副总监

    斯坦福大学图书馆与学术信息资源

    美国加利福尼亚州斯坦福


    ## 为什么你们决定在图书馆中使用 Blacklight？


    我们选择 Blacklight 是出于几个方面的考虑。


    - 1. 技术策略和可维护性。斯坦福大学图书馆在2008年年底做了一项战略选择，采用 Ruby on Rails (RoR) 作为其面向终端用户的应用程序开发语言。到目前为止，我们对
    RoR 和 Blacklight 的经验符合我们的预期。我们培训了六名没有 RoR 经验的开发者，他们在不到一个月内就成为了胜任的开发者，而且 Blacklight
    的测试覆盖率超过了其代码库的 70%。


    - 2. 架构、功能和特性集。Blacklight 展示了对三个关键功能的支持，我们认为这些功能对于下一代搜索应用至关重要。这些功能是：支持非 MARC 数据、针对特定对象的行为以及定制化视图。


    - 3. 社区。Blacklight 拥有一个坚实的机构和专家核心群体，他们致力于并为代码库做出贡献。早期，弗吉尼亚大学该项目的主要利益相关者就表明，他们渴望接收来自其他机构和个人的代码贡献、想法和支持（多种形式）。这鼓励了我们自己采用
    Blacklight，并给了我们信心：如果我们采纳它，我们就有机会进一步帮助完善公共代码库，而无需为我们所有的本地修改和增强承担长期支持。


    ## 你们在图书馆中是如何使用 Blacklight 的？


    我们目前将 Blacklight 用于：


    - 下一代目录系统（参见 http://searchworks.stanford.edu）

    - 各种 Fedora 仓库的前端

    - 专门数字图书馆应用的搜索、浏览和查看界面（例如，数字化的中世纪手稿）。


    ## 你们在图书馆中使用 Blacklight 有多长时间了？


    我们于 2008 年12 月正式采用了 Blacklight。


    ## 你们在图书馆实施 Blacklight 时遇到过困难吗？


    在采用 Blacklight 后的前三个三个季度里，我们与其核心提交者团队合作重构了代码库，使其更具移植性、测试更充分且功能更丰富。这项工作在 2009 年春季的
    Blacklight 2.0 发布中达到了顶峰。在此工作之后，我们发现实施新的 Blacklight 实例是一项非常直观的任务。设置 Blacklight
    实例最挑战的任务是设计和填充底层的 solr 索引。


    ## 从专有系统转向开源的流程是怎样的？


    我们在采用开源软件方面有其他经验，这些经验是我们在决定采用 Blacklight 时对其社区、架构和可维护性给予如此高权重的关键因素。在支付了采用新技术（RoR）和新应用（Blacklight）的前期成本后，我们发现在一个开源代码库上工作是种解脱。我们的图书管理员员对新系统中数据和功能的工作方式提出了一些非常特殊的要求，而能够根据我们的需求对底层数据和应用程序进行操作，是一种极具成就感的体验，特别是与大多数专有系统相比时。


    ## 你们在安装、迁移或设置 Blacklight 时得到过任何帮助吗？


    我们发现 Blacklight 开发者列表是获取技术支持的最佳资源（我们从贡献者那里获得了很多帮助）。


    ## 你们认为 Blacklight 怎么样？


    它是一个优秀的工具，也是我们数字图书馆战略的核心部分之一。


    ## 你们图书馆的其他人对 Blacklight 怎么看？


    他们很欣赏其特性集和灵活性，并渴望尽快添加更多功能和数据类型。


    了解更多：


    参见 http://searchworks.stanford.edu。


    特别值得注意的是：


    - 高级搜索功能（在斯坦福开发，很快将提交到公共代码库），可在 http://searchworks.stanford.edu/advanced 获取

    - 索书号附近功能

    - 实时可用性显示，在搜索结果页面上一目了所有物品的位置和状态。


    ## SOPAC2


    最后，John Blyberg 和 Darien 图书馆于2008年发布了 SOPAC2 (http://thesocialopac.net)。^4 SOPAC2
    比之前的两个选项更进一步，并遵循 Scriblio 模式，将 OPAC（在线图书检索系统）直接集成到内容管理系统中，区别在于 SOPAC2 是集成到 Drupal
    而不是 WordPress 中。这意味着图书馆现在可以拥有无缝的外观和体验，读者可以同时搜索图书馆网站和 OPAC（见图 11.4）。


    ## 选择 OPAC


    有四种免费开源 OPAC 供你选择，那么如何做选择呢？你的决定的一部分将取决于个人偏好，因为它们提供的服务非常相似。另一部分（这非常重要）是确定对于你特定的图书馆系统是否已经有了
    OPAC 连接器。如果 OPAC 无法与之通信，它就无法……


    > 图 11.4 Darien 图书馆的 SOPAC2


    ![](img/4e1ec39c661a9fa73febd901135781ce_161_0.png)


    # 11.4 现实世界中的开源：SOPAC


    John Blyberg，创新与用户体验助理总监

    Darien 图书馆

    美国康涅狄格州 Dari


    ## 为什么你们决定在图书馆中使用 SOPAC？


    市场上不存在的产品能满足我们数字战略的要求，即把所有电子资源统一到一个单一的交互式门户中。


    ## 你们在图书馆中是如何使用 SOPAC 的？


    我们将其作为完整的 OPAC 替代品，以及面向用户的额外在线服务。我们的员工还利用它进行馆藏发展、信息服务读者推荐。


    ## 你们在图书馆中使用 SOPAC 有多长时间了？


    自 2008 年 9 月以来。


    ## 从专有系统转向开源的流程是怎样的？


    非常简单。


    ## 你们现在觉得 SOPAC 怎么样？


    我们喜欢它！


    ## 你们图书馆的其他人对 SOPAC 怎么看？


    他们非常喜欢它！


    供你选择。话虽如此，一直会有新的开发，如果你更喜欢其中某一个，只需联系开发者看看为你的图书馆系统编写连接器需要什么。这四种工具都提供了一个高效、易懂的搜索框。虽然我们图书管理员倾向于执行更复杂的搜索，但普通互联网用户喜欢
    Google 模式，即关键词搜索。所有工具都考虑到了这一点。事实上，Scriblio 和 Blacklight 提供了单搜索框选项，因此没有高级搜索。⁵ SOPAC
    提供了一个稍微高级的搜索页面，而 VuFind 提供了一个传统的图书馆搜索页面。虽然所有的搜索系统各不相同，但它们都提供了通过不同的标题和物品类型过滤结果的选择，从而轻松缩小到正确的子集。


    除了简单的搜索界面外，所有选项都提供了文献记录和搜索结果的永久链接。这意味着作为图书管理员，你可以从浏览器地址栏复制 URL 发给读者。所有选项都考虑了现代网页功能，如
    RSS 馈送和评论。VuFind 和 SOPAC2 更进一步，允许读者添加标签。SOPAC2 还允许读者对目录记录进行评分和评论。所有这些额外数据都存储在集成图书馆系统之外，以防干扰管理员提供的数据，同时让读者以更多方式对图书馆产生归属感。


    # 开源一切


    如果你的图书馆计划改变整个图书馆的集成图书馆系统体验，而不仅仅针对读者，那么开源集成图书馆系统可能是你的正确选择。目前市场上有两种主要的可能性：Koha (http://koha-community.org)
    和 Evergreen


    '
