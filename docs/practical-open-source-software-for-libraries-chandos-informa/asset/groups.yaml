    | We decided to switch to Thunderbird as our primary email client because it had
    become the most popular OSS solution at the time. Previously, we had used Mozilla
    as both a web browser and email client, but when we switched to Mozilla Firefox
    as our primary web browser, we needed a new email client; the obvious choice was
    Mozilla''s new email client, Thunderbird. |'
- md: '

    # Practical Open Source Software for Libraries


    ## How are you using Thunderbird in your library?


    Nearly all our librarian''s desktop computers have Thunderbird installed to access
    their email from our mail server via SMTP.


    ## How long have you been using Thunderbird in your library?


    We have been using Thunderbird since late 2003.


    ## Did you have any trouble implementing Thunderbird in your library?


    The only issues we''ve had were the initial configuration issues. We use TLS for
    security, and sometimes Thunderbird would refuse to connect to our mail server
    properly. Frankly, those issues seem to have been resolved with the newer version
    of the program.


    ## What was the process of switching from proprietary to open source like?


    We had previously used Netscape, then Mozilla as our email clients, so the switch
    was relatively painless. The process involved only configuring the client, as
    well as importing the contact list from our previous client.


    ## Did you have any any help installing, migrating to, or setting up Thunderbird?


    No, we did all the work in-house.


    ## What do you you think of Thunderbird now?


    I think Thunderbird is a great program, but the advent of good web-based e-mail
    has made it much less essential than it used to be. Our mail server currently
    runs on Zimbra, so our librarians have the choice of using Thunderbird or a web-based
    interface to check their email. Most librarians still choose to use Thunderbird.


    ## What do others in your library say about Thunderbird?


    Our librarians are simply happy to use an email client that works consistently
    and correctly nearly all the time.


    ## Open source web access


    ## Anything else you want to know about Thunderbird or your process of switching
    to Thunderbird?


    Using SMTP instead of POP3 as your standard email protocol makes switching between
    clients much easier, as there is no need to export and import the messages themselves.


    Many librarians are used to email clients like Microsoft Outlook or Novell Groupwise
    and the idea of changing from a familiar interface to an unknown can be scary.
    However, Thunderbird''s design is very similar to other email tools, offering
    several panels for viewing your messages, your tasks and more (see Figure 6.4).


    Thunderbird even allows for personal and shared calendars with the use of the
    Lightning add-on (http://www.mozilla.org/projects/calendar/lightning/). Lightning
    allows


    ![](img/4e1ec39c661a9fa73febd901135781ce_78_0.png)


    you to create calendars on your local machine or access shared calendars through
    the network, which is an important feature for anyone working in an office (see
    Figure 6.5).


    If your library uses Google Apps for email and calendaring needs, you can still
    use Thunderbird by installing the Provider for Google Calendar add-on (https://addons.mozilla.org/en-US/thunderbird/addon/4631)
    and the GmailAP Account Setup add-on (https://addons.mozilla.org/en-US/thunderbird/addon/6381).
    These tools grant your content directly from Google and publish it to Thunderbird.


    In addition to a simple interface, Thunderbird has built-in spam filters, the
    option to download other service add-ons (https://addons.mozilla.org/en-US/thunderbird/browse/type:1/cat66),
    powerful mail searching functionality and the ability to check multiple email
    accounts at once (including popular web-based email accounts like Gmail and Yahoo!).


    ![](img/4e1ec39c661a9fa73febd901135781ce_79_0.png)


    ## Instant messaging


    While we all agree that email is not dead, this does not mean that it is our sole
    means of communication online. Many libraries have started to offer instant messaging
    reference services as an additional way to allow patrons to reach them. Pidgin
    (http://www.pidgin.im) is an open source instant messaging tool that can make
    communicating with your patrons much simpler. Pidgin connects at once and keeps
    your contacts organized for quick communication.


    Pidgin allows you to log into all of the popular messaging clients - AIM, Yahoo!,
    GTalk, Windows Live


    ![](img/4e1ec39c661a9fa73febd901135781ce_80_0.png)


    Messenger, and more – at one time. Like many other open applications, Pidgin also
    has plugins (http://developer.pidgin.org/wiki/ThirdPartyPlugins) available that
    will add access to additional optional instant messaging networks like Facebook
    and Twitter. This single interface allows librarians to monitor communication
    channels at once without having to install and run multiple applications (see
    Figure 6.6).


    ## 6.5 Open source in the real world: Pidgin


    Jennifer M. Turner, Support and Training Specialist

    PALS, A Program of the Minnesota State Colleges and Universities

    Mankato MN, USA


    ## Why did you decide to use Pidgin in your library?


    Pidgin works with a variety of different IM programs, connects to professional
    IRC channels, and keeps a log of conversations/discussions. Also, it''s free and
    easy to use!


    ## How are you using Pidgin in your library?


    Communication with colleagues – we provide technical support and training for
    the library system used by a majority of Minnesota''s colleges and it is often
    easier to send coworkers to a link rather than have them try recreate the issue
    on their end. It has also come in handy when a person is working from a remote
    location and has an issue or question for another staff person.


    ## How long have you been using Pidgin in your library?


    About six months (very approximate guess).


    ## Did you have any trouble implementing Pidgin in your library?


    No problems with the actual software, but few staff members have adopted its use.
    Those of do use it are pleased.


    ## Did you have any help installing, migrating to, or setting up Pidgin?


    None.


    ## What do you you think of Pidgin now?


    It''s great! And the more I learn about it, the more I like like it!


    ## What do others in your library say about Pidgin?


    Those who use it have embraced and use it for both professional and personal communication.
    Those who don''t use it don''t say much about it, as they are unfamiliar with
    it (and don''t really use chat services in general)


    ## A web of options


    I briefly discussed open source options available to your library. There are many
    more open source applications available to make your online experiences more efficient
    and secure. Give the applications in this chapter a chance and if you find you
    aren''t pleased, search for other source alternatives; there are plenty out there.


    ## Notes


    - 1. Krebs, Brian. ''Internet Explorer Unsafe for 284 Days in 2006.'' The Washington
    Post: Security Fix, January 4, 2007. http://blog.washingtonpost.com/securityfix/2007/01/internet_explorer_unsafe_for_284_days/.

    - 2. To find a full list of sites that support Zotero you can check their list
    of compatible sites (http://www.zotero.org/translators). You can also find out
    what library software supports Zotero on their list of compatible software (http://www.zotero.org/support/compatible_standards_and_software).

    - 3. My public Zotero library can be found at http://www.zotero.org/nengard.


    # Open source media applications


    Many academic libraries offer their students access to a media center in the library.
    A common misconception is that smaller libraries do not have the budget to offer
    such services to their patrons, but there are plenty of open source applications
    that can be used to populate a media center in any library.


    # Photo editing


    When it comes to photo editing and creation, many libraries stick to using the
    clip art package that came with their word processing application because they
    think that is all they can afford. In reality there are many powerful open source
    tools available to make your photos look more professional. The first and probably
    the best known of these tools is GIMP (http://gimp.org).


    GIMP is a photo editing suite that has been compared to Adobe® Photoshop®. Photoshop®
    is meant for the professional artist, and can often be overkill for the average
    library. GIMP offers libraries an affordable alternative. According to the official
    GIMP website:

