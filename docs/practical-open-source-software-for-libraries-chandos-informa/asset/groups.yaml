    and greatest functionality, and sometimes people like to tweak it. I don''t care
    about those things – most importantly, I have a library and/or a business to operate,
    and reliability is by far the paramount amount.

    - I think it is especially important for archives to use non-proprietary software.
    It is a matter of long-term accessibility, to which we are supposed to be dedicated.

