    # # Wikis


    Some libraries will forego a content management system in favor of a wiki. A wiki
    is simply a website that multiple people can edit. One of the most well known
    open source wiki applications is MediaWiki (http://www.mediawiki.org), the software
    that powers Wikipedia (http://www.wikipedia.org). MediaWiki has a long established
    record for handling heavily trafficked websites with ease, which is why it is
    commonly used by librarians to power their intranets, subject guides and sometimes
    enters websites.


    # ### 8.6 Open source in the real world: MediaWiki


    | Garry Collum, Systems Coordinator

    Kenton County Public Library

    Covington KY, USA |


    **Why did you decide to use MediaWiki in your library?**


    Kenton County Public Library (KCPL) at one time had ''ready reference'' questions
    and frequently asked reference questions, Q & As, stored in an ILS vendor''s electronic
    version of Community Resources.


    This product was difficult to update and use MARC records as its data format.
    The IT department wanted to find a product that was easy to update and that all
    staff could access.


    MediaWiki was chosen and at first only contained these information sources. However,
    after using MediaWiki for a few weeks, it seemed to be a natural progression just
    to move the intranet to a wiki format.


    Before installing MediaWiki, the staff of KCPL would send all of their documents
    to the IT department to be placed'
  - '[PAGE 119]


    on the intranet. The IT department wanted to find a way to eliminate the ‘middle
    man.’


    # How are you using MediaWiki in your library?


    We use MediaWiki for our intranet.


    # How long have you been using MediaWiki in your library?


    We installed MediaWiki on October 11, 2006.


    # Did you have any trouble implementing MediaWiki in your library?


    The installation was simple, but you do need to have someone who has some familiarity
    with Apache, MySQL and Linux permissions. The hardest part of the installation
    was configuring the wiki options. Not the process of configuration itself, but
    how and what to configure (namespaces, users and so on).


    # What was the process of switching from proprietary to open source?


    The most time-consuming process of switching to MediaWiki moving documents into
    the wiki. We actually didn’t move from proprietary to open source; we moved from
    web pages, or MS Office documents, to wiki format.


    # Did you have any help installing, migrating to, or setting MediaWiki?


    We used the online documentation to set up and configure the wiki.


    # What do you think of MediaWiki now?


    It fits needs perfectly.


    # What do others in your library say about MediaWiki?


    The staff who use MediaWiki to update their pages, or who created their own departmental
    pages, like the product. MediaWiki is easy to use, but it is not intuitive. Staff
    who infrequently update pages seem to need a refresher on how to create or update
    pages and the tags that are used for formatting.'
  - '[PAGE 120]


    # Practical Open Source Software for Libraries


    MediaWiki offers a series of settings to allow you to decide how you want people
    to interact with wikis on your website. It is a common misconception that all
    wikis are open for anyone to edit; as the site administrator you can decide if
    a password is required for editing. Since wikis keep a complete history of edits,
    a common practice is to give each member their own login so all their edits are
    recorded. This makes it easy to find the right person to contact if you have a
    question about a particular edit. Also, since a complete history is kept, it is
    always an option to revert to an older version of the page, making it less daunting
    to allow anyone on the staff to edit pages: see Figure 8.6.


    One drawback of MediaWiki, and many other wikis as well, is that the interface
    can sometimes be less intuitive. While WYSIWYG (what you see is what you get)
    is available to make editing the pages simpler, the wiki syntax can sometimes
    confuse people. It can also be difficult to know where to go to edit a page or
    revert to a previous edit. That said, the documentation for MediaWiki is extensive
    and can be easily searched for the solution to your particular problem.


    ![](img/4e1ec39c661a9fa73febd901135781ce_120_0.png)


    Please note that all contributions to Library Success may be edited, altered,
    or removed by other contributors. If you don''t want yours to be edited modified,
    then don''t submit it here.


    112'
