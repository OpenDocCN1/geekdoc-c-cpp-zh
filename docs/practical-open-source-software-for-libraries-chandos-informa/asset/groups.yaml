    # Open source media applications


    However, since Scribus stores its documents in structured XML files, it''s now
    possible to use versioning tools, like Git, to store branches and checkpoint revisions
    of documents with minimal fuss. We can experiment with a particular layout and,
    if we decide we don''t like it, later easily revert to a previous revision.


    Did you think of any help installing, migrating to, or setting up Scribus?


    I''m an IT professional, and we have a helpful member who formerly worked at a
    digital print shop to advise us on how to handle the inordinately confusing process
    of preparing our documents for printing.


    # What do you think of Scribus?


    It''s actually pleasing to use that I''m now glad we chose it over LaTeX. Being
    one of their support mailing lists, it appears that members of the development
    team are managing the evolution of Scribus very well. The small but growing community
    is responsive to user inquiries. We now will not have to worry about diminished
    access to our templates and other DTP materials because of reliance on expensive
    proprietary software.


    # What do others in your organization say about Scribus?


    In addition to our local membership, we have subscribers from around the world
    who read Lion & Serpent. Even though we distribute the online version at no charge,
    people specifically order subscriptions to the paper version for the careful reproductions
    of the beautiful artwork we publish. Response to the layout, design and production
    quality has been universally positive.


    Are there any screenshots, documentation or features about your use of Scribus
    online or in library journals we should look at?


    You can find our online archive of issues at http://sekhetmaat.com/Journal/. All
    of volume 14 has been designed in Scribus.


    One thing to keep in mind is that the images in the online digital version are
    compressed, to conserve artists'' bandwidth and to protect our visual artists''
    works from being distributed in a format suitable for mass production.


    # Anything else you want to know Scribus or your process of switching to Scribus


    Technical expertise, while helpful, is not necessary in order to use Scribus successfully.
    However, some very standard DTP functionality (font management and imposition
    (the most obvious)) is still not directly supported from Scribus and requires
    the use of other tools. Using these less refined and often command line programs
    would likely present a challenge for those with less tech savvy.


    Scribus remains relatively unknown to the larger publishing industry, a growing
    number of non-profit and commercial organizations are using it for publishing
    a variety of documents, including magazines, books and marketing material. EASTight
    magazine uses Scribus for its monthly publication delivered to 15,000 homes in
    London. Full Circle, an electronic magazine for Ubuntu users (a Linux-based operating
    system), is published monthly as an interactive PDF to the web. An increasing
    list of other titles published using the software is available on the Scribus
    Public Wiki.²


    As with the other applications listed in this book, installing Scribus on your
    patrons stations is a great way to offer a service that was previously unavailable
    (and unaffordable) to your patrons.


    # Audio editing


    Print products are not the only way to expand our library offerings; why not create
    a podcast? Libraries around the globe have started to offer free podcasts to their
    patrons to promote their collections, library events and the community. The New
    York Public Library has done an amazing job with podcasts at their library (see
    http://www.nypl.org/voices/audio-video), but you do not have to be a large library
    system to be able to produce your own library.


    # 7.3 Open source in the real world: Audacity


    Robin Stiles, Library Media Specialist, and Kristin Veenema, English Teacher

    Staples High School Library Media Center

    Westport CT, USA


    # Why did you decide to use Audacity in your library?


    It is free. It has been promoted, downloaded and supported by our Information
    and Technology Literacy (ITL) department.


    # How are you using Audacity in your library?


    It is loaded on 29 desktops on the main floor of the Library Center. It is loaded
    on 60+ laptops in the Library Media Center. We provide microphones and headphones
    that our students are able to check out and use. When teachers ask students to
    make a presentation, so say that you can communicate your knowledge and research
    in a variety of ways. One of those options is to use Audacity.


    # How long have you using Audacity in your library?


    We have been using Audacity for three years. It was first introduced at our ‘Summer
    ITL Institute’ three years ago and each attendee received a microphone under their
    seat ‘Oprah’ style!


    # Did you have any trouble implementing Audacity in your library?


    We needed to download a LAME MP3 encoder and keep it in the audacity file to be
    able to export files as .mp3 files.


    # What was the process of switching from proprietary to open source like?


    We actually have only ever used Audacity.


    # Did you have any help installing, migrating to, or setting up Audacity?


    Our tech department staff installed the software on all of our machines and are
    always available for training and support.


    # What do you think of Audacity?


    I think it is pretty cool. Its is on my list of summer-to-dos to record older
    family members and their memories to save for my kids. With this last class that
    I worked with I saw a change in their demeanor when they listened to their own
    voice, literally and figuratively.


    # What do others in your library say about Audacity?


    Mac users of course prefer Mac software but we predominantly use PCs for instruction
    at Staples. Teachers who are podcasting in the classroom use either Audacity (PC)
    or Podcast Capture (Mac) and upload files to their websites, Wikis or Blackboard.
    With most technology it is not really the tool that you use but the


    Are there any screenshots, documentation or features about your use of Audacity
    online or in library journals we should look at?


    Students were asked to take an act of The Crucible, and write a script that echoed
    each line with what they thought the characters were really thinking and feeling.
    They were to record their lines interspersed with their thoughts and link the
    podcast to their. They used Audacity to change their tone, depth of their voice
    and so. Some made a female voice sound male or vice versa depending the part they
    read. Group work enhanced the problem learning: delving into the characters was
    challenging and different.


    You really should try to save your podcast as .mp3 to compress the size of the
    file because the .wav files can be large and sometimes too big depending on where
    you want to save them.


    Librarian and professor Michael Stephens introduces librarians to podcasting with
    Audacity (http://audacity.sourceforge.net):


    Audacity offers a no-cost audio recording solution that includes an intuitive
    interface and a small learning curve. Audio files recorded in Audacity can be
    saved as MP3, the standard podcast file format, or in other formats as needed.
    MP3, which works on iPhones and many other portable media players and CD players,
    is a file type that allows reasonable quality and a reasonable file size.


    Audacity is the tool of choice for many podcasters due to its powerful nature
    and the fact that it is free and open source.


    ![](img/4e1ec39c661a9fa73febd901135781ce_96_0.png)


    Using Audacity you can record, edit, splice and enhance your podcasts. This means
    you need only one tool to record and prepare your podcasts for publication. Audacity
    provides you with all of the tools necessary for creating podcasts; see Figure
    7.3.


    # Screencasting


    As a visual learner, I find video tutorials to be a great help when learning new
    software, or anything new for that matter. Providing your patrons with screencasts
    is a great way to help visual learners at your library with the various products
    that the library offers.


    A screencast is simply a video recording of your computer screen, for example
    a tutorial for using the library website. You turn on your screencasting software
    and then navigate through the library site and narrate your movements.

