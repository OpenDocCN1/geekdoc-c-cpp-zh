    # Open source media applications


    screencastings software captures your movements and your voice and creates a video
    that you can then publish on the web.


    CamStudio (http://camstudio.org) is an open source application that will help
    you create these screencasts on Windows, and recordmydesktop (http://recordmydesktop.sourceforge.net)
    is the solution if you are on a Linux operating system. Both applications are
    extremely easy to use. Simply start the application, choose the region you want
    to record on your screen and click the record button (see figures 7.4 and 7.5).
    Once your videos are recorded you preview them in the application''s viewer.


    The Northeast Kansas Library System (NEKLS) makes great use of screencasts (http://www.nxpresslibrary.org/category/tutorial/)
    as training agents for their member libraries. These videos go along with text
    documentation they have written in order to make it easy for all types of learners
    to get the most out of their open source integrated library system, Koha (http://koha-community.org).


