    这将运行的软件，对图书馆来说是另一个巨大的成本节约。如果该软件涉及任何费用，通常是用于支持和/或开发，如果图书馆认为他们内部具备必要的技能来管理这些工作，他们可以选择放弃这些费用。


    此外，随着越来越多的图书馆采用开源替代方案，开发合作伙伴关系的潜力正成为现实。开发合作伙伴关系将允许图书馆集资资金对产品进行增强，甚至共享技术技能的人员，为伙伴关系中的所有图书馆开发新功能。


    # 馈赠文化


    当 Horowhenua 图书信托（http://www.library.org.nz）决定将他们新的集成图书馆系统作为开源软件发布时，他们将其命名为 Koha，这是毛利语中意为“礼物”的。这是他们送给图书馆的礼物，一个供所有人受益的开源集成图书馆系统。这非常符合馈赠文化，馈赠文化是指那些提供产品和/或服务作为馈赠，而没有任何明确要求付费或报答服务的社会。


    Eric Morgan 对馈赠文化、图书馆和开源进行了沉思：“开源软件开发与图员工作有许多相似之处——两者都是馈赠文化的例子。”他继续解释了图书馆如何被视为一种馈赠文化。最重要的是，图员以提供信息和研究访问而闻名，而不期待金回报。正如我们所知，大多数图员分享信息是因为他们热爱自己的工作并促进他人教育。这是他们送给社区的礼物。


    开源社区遵循非常相似的模式，社区成员参与并分享知识是为了最终产品的乐趣，而不是为了金钱支付。Christina Garsten 和 Helena Wulff
    解释说这种馈赠是开源软件背后的力量：


    开源社区中的工作、协作和知识共享在文化上是围绕“馈赠”的概念组织的。馈赠创造了知识的流动，并使得在全球范围内创新和完善软件开发过程成为可能.^8


    图书馆和开源向其社区提供馈赠的方式上的这种相似性，只是长长列表中的另一个原因，解释了为什么使用和开发开源软件对图书馆来说是一个逻辑选择。


    # 前瞻性思考


    我在费城的 Jenkins 法律图书馆（http://www.jenkinslaw.org）工作时，我做了很多开发来满足图书馆员工的燃眉之急。我使用了开源语言
    PHP 和开源数据库 MySQL，但我认为不会会有其他人想用我开发的产品，因此我没有考虑过如何与世界分享它们。多年后，我是开源图书馆社区的活跃成员，我希望我能回到过去，预见到这一刻，以及我的工具能为其他图书馆提供的益处。


    在法律图书馆工作期间，我开发了一个强大的内容管理系统来维护图书馆的内网，^9，现在图书馆正在探索如 Drupal 等选项。


    # 开源与图书馆


    Drupal (http://www.drupal.org) 和 Joomla (http://www.joomla.org) 来管理他们的网站。我还写了一个专门针对该图书馆的馆际借阅和计费系统，我现在认为这个系统如果能集成到
    Koha (http://www.koha-community.org) 或 Evergreen (http://www.open-ils.org) 中将很有用。（注：原文此处存在断句衔接）


    我提到这一点是因为图书馆在开始开发项目时需要具有前瞻性。他们需要坐下来说：“这是我们要开发的；它有没有可能对其他像我们这样的机构有所帮助？” 正是因为因为有了这样的问题，我们才有了如此丰富的特定开源应用选择。


    # 注释


    - 1. Crawford, Richard. ''Open Source Solutions for Library Needs'' presented
    at the Linux Users Group of Davis, December 5, 2003. http://www.lugod.org/presentations/oss4lib.pdf.

    - 2. Eyler, Pat. ''Koha: a gift to libraries from New Zealand.'' Linux Journal
    106 (2003): 1.

    - 3. ALA. ''Code of Ethics of the American Library Association.'' American Library
    Association, January 22, 2008. http://www.ala.org/alalatalaloffices/oif/statements/codeethics/codeethics.cfm

    - 4. Morgan, Elise. ''Open Source Software: controlling your computing environment,''
    March 28, 2009. http://infomotions.com/musings/loss4/index.shtml

    - 5. Corrado, Edward M. ''The Importance of Access, Open Source, and Open Standards
    for Libraries.'' Issues in Science and Technology Librarianship 42 (Spring 2005).
    http://asil.org/05-spring/article2.html.

    - 6. Eyler, Pat. ''Koha: a gift to libraries from New Zealand.'' Linux Journal
    106 (2003): 1.

    - 7. Morgan, Eric. ''Gift Cultures, Librarianship, and Open Source Software Development,''
    November 14, 2004. http://infomotions.com/musings/gift-cultures/

    - 8. Garsten, Christina, and Helena Wulff. New Technologies at Work: people, screens,
    and social virtuality. Oxford, New York: Berg, 2003.

    - 9. Engard, Nicole C. and RayAna M. Park. ‘Intranet 2.0: fostering collaboration.’
    Online 30, no. 3 (2006): 16. http://www.web2learning.net/publications-presentations/intranet-20-fostering-collaboration-with-a-bonegrown-intranet.


    # 日常运营中的开源


    每个业务都有一组必须完成的操作。在当今世界，这些操作通常包括使用计算机。这意味着工作场所中的每个人其机器上必须有相同或相似的应用程序，以便他们方便地互相共享信息。


    # 操作系统


    你机构中每台计算机上需要的唯一一种软件是操作系统。涉及到操作系统时，我们已经听过所有的（可能还体验过）Microsoft Windows™。Windows
    在操作系统市场上非常盛行，以至于有人认为它驱动了所有计算机。然而，正如我们在前面的章节中所学习到的，Windows 并不是操作系统的终点；它只是个人电脑用户的可用选项之一。其他选项包括各种
    Linux (http://www.linux.org) 版本。


    由于与 Linux 操作系统相关的开源许可证，开发者能够获取原始代码并开发出几种 Linux 操作系统


    # 5.1 现实世界中的开源：Ubuntu


    Jessamyn West，MetaFilter 社区管理员图书馆技术专家，美国特布里


    你为什么决定在你的图书馆里使用 Ubuntu？

    其实这是理而易见的事。任何处理过重装操作系统的人都知道那是件多么头疼的事。能够重装损坏的操作系统或升级到最新版本，让对公共电脑的顾虑消失了殆尽。我们可以让读者使用他们想要的机器，而且我们知道坏了可以修复，这非常好。对于新手电脑用户来说，他们的体验不再充满恐惧和不确定是非常意义的。


    你们在图书馆是如何使用 Ubuntu 的？

    主要作为公共访问系统。我们在上面运行 Firefox 和 OpenOffice —— 有时它们运行良好。


    你们在图书馆使用 Ubuntu 多久了？

    这大约是从年前开始的。


    你在图书馆实施 Ubuntu 遇到过什么困难吗？

    并不。。我很惊讶实施如此简单。它并不是一个非常精通技术的社区，切换操作系统并不是大问题。人们只想知道“我如何获取？”


    从专有软件转向开源的过程是怎样的？

    没有，我阅读了支持小组的网站并自己完成了操作。最大的障碍是让图员同意这个想法，以及找一个安全的地方让他们存放管理员密码以便我们能找到，但这对读者来说是不可用的。


    你现在如何看待 Ubuntu？

    当人们抱怨 XP 或 Vista 时，我会向他们推荐它。我认为它是 Linux 成为公共计算真正选项的光明典范。


    你图书馆的其他人如何看待 Ubuntu？

    在某些方面，他们甚至不知道自己在使用它。他们喜欢它是免费的。他们喜欢开源的想法，尽管他们并没有深陷这种文化。在许多方面，图书馆一直一直是关于自由文化的，这只是推进这一理想的另一种方式。

