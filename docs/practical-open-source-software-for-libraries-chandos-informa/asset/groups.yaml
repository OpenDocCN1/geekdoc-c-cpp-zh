    and innovation than proprietary regimes under a wide range of circumstances. In
    2009 these findings were further corroborated by Red Hat had secured to join the
    S&P 500 index less than 10 years after its IPO. Open Source software development
    enables a new, viable, and robust model for digital recovery.


    # Security and open source


    Like the concern that free software cannot be as good as expensive software, the
    common myth that open source software options are not as secure as their proprietary
    counterparts is not based in fact, but in fear. Studies have shown that despite
    people''s belief that open source software is less secure than proprietary software,
    open source software is often just as secure and sometimes more secure.


    Brian Krebs, who has been writing for The Washington Post about technology and
    computer security since 2000, did an independent study in 2006 that showed Internet
    Explorer (IE) was insecure for 284 of 365 days, versus Firefox (the closest open
    source competitor), which was insecure for only nine days that year:'
  - '[PAGE 38]


    For a total 284 days in 2006 (or more than nine months out of the year), exploit
    code for known, unpatched critical flaws in pre-IE7 versions of the browser was
    publicly available on the Internet. Likewise, there were at least 98 days last
    year in which no software fixes from Microsoft were available to fix IE flaws
    that criminals were actively using to steal personal and financial data from users...
    In contrast, Internet Explorer''s closest competitor in terms of market share
    – Mozilla''s Firefox browser – experienced a single period lasting just nine days
    last year in which exploit code for a serious security hole was posted before
    Mozilla shipped a patch to remedy the problem.⁵


    It is also important to note that both Firefox and Internet Explorer are free
    of cost, but only Firefox is open source.

    As mentioned in Chapter 1, Apache, the open source web server, is used by nearly
    half of all websites.⁶ This is not simply because Apache is free of cost; it has
    to do with the security inherent within the tool, ease of use and of course the
    features it provides.


    # Not worth the risk


    In addition to the fear that open source software is insecure comes the argument
    that open source carries with it too many risks. This always make me chuckle a
    little, because what software does pose some sort of risk these days? We work
    in a world where computers hold all of our personal information, our memories,
    our work histories, our financial status and so much more. We trust computers
    and the software on those computers to keep our lives in order, and when you think
    about it – that’s pretty damn risky!'
  - '[PAGE 39]


    The question then comes down to what risks are associated with open source software
    that you are not seeing in the proprietary world? The answer is none. In fact,
    I''d argue (and others have done the same) that open source actually carries less
    of a risk that many proprietary options.


    One of my favorite quotes regarding the risk of open source comes from Casey Coleman,
    chief information officer for the US General Services Administration (GSA) in
    2008. Coleman says, ''You get more transparency and interoperability, that reduces
    your risk.'' She also mentions the fact that by choosing open source the GSA is
    not tied to contracts with proprietary vendors, giving them all the flexibility
    that that implies.


    In a time when our economy is in flux and companies are being out by venture capitalists
    and other companies, there is no guarantee that the software you are using will
    be supported next year. Moving to open source you know that will always be able
    to use the software, even if the company you were paying for support is bought
    out or closes its doors. You also have the freedom to hire independent developers
    to help with customizations and upgrades.


