    2009, 36 per cent of library professionals thought that all open source software
    was free of cost. Although there are open source applications that are free of
    cost, this is not required by open source and free software licenses. There are
    more than 60 such licenses, but two account for nearly 90 per of all open source
    software: the GNU General Public License (GPL) and the Berkeley Software Distribution
    (BSD).


    The GPL starts by stating that the term ‘free’ refers to ‘freedom’ not price:


    The licenses for most software and other practical works are designed to take
