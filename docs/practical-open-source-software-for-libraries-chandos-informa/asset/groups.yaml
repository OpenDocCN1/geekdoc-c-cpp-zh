    # 8.1 Open source in the real world: FileZilla


    Rick Mason, Acquisitions Assistant

    Blackmore Library, Capital University

    Columbus OH, USA


    Why did you decide to use FileZilla in your library?


    I have used it for years for maintaining websites; when I need to FTP it is the
    first program I go to.


    How are you using FileZilla in your library?


    The selection process for library materials from our prime vendor gives the acquisitions
    department files of MARC records on the vendor''s server. download the files,
    use other software (MarcEdit) to combine and prepare the files to be uploaded
    into our ILS.


    How long have you been using FileZilla in your library?


    I have been using FileZilla for this task for about a year; I have used it for
    a variety of other purposes for nearly eight years.


    Did you have any resistance to open source for some people; there is a feeling
    that ''you get what you pay for.''


    There is a certain resistance... a feeling that ''you get what you pay for.''
    Once it becomes clear that it does the job effectively, that attitude generally
    softens.


    What was the process of switching from proprietary to open source like?


    For me, liberating. When I first tried FileZilla, I had been using a proprietary
    program that was several versions out of date, and couldn''t be installed on additional
    machines. Having a program that was frequently updated and could be set up on
    all the computers I needed it was a great change.'
  - '[PAGE 103]


    # Did you have any help installing, migrating to, or setting up FileZilla?


    Nope... not necessary with our environment. I have installed the program and trained
    quite a few people in its use, though the PortableApps (http://portableapps.com)
    version makes this very easy, because the program can be configured for the remote
    server access in advance.


    # What do you think of FileZilla now?


    It is still the primary tool for my FTP needs; if I find another program that
    does it better (and that includes the benefits of open source) I would switch.
    That is just the nature of the ''toolbox'' concept of software - keep the best
    tool for the job at hand. That I have used it as my primary software for this
    long is a great compliment to those who maintain it.


    # What do others in your library say about FileZilla?


    FTP is not a high-profile or conversation-dominating for most people; those who
    use it recognize the benefits.


    # Anything else you want to know about FileZilla or your process of switching
    to FileZilla?


    Just this: the best approach to software is the toolbox analogy I referred to
    earlier. Just as most people have more one screwdriver, using the one that will
    best serve the job at hand, we should seek out software and try it out enough
    to find out how it performs. When a new situation presents itself, hopefully the
    software is already in its ''toolbox'', waiting to be used.


    FileZilla displays the content of your local machine and the web server side by
    side, making it easy for you to drag files from your computer onto the web server.
    Files on the server can be modified simply by clicking with your right'
  - '[PAGE 104]


    # Practical Open Source Software for Libraries


    mouse button on the title and choosing an option from the menu that appears. Often
    a web application will require that folder has specific permissions, once reserved
    for the IT staff. Using the right click menu in FileZilla you can choose ''change
    permissions'' and the options required by the software you are installing. You
    can also move files around and rename them using right click and drag and drop
    functionality within FileZilla; see Figure 8.1.


    Like most of the applications mentioned so far, FileZilla has an active developer
