  - '[PAGE 210]


    ■ I use a number of web and instructional applications that are open source, including
    but not limited to SlideRoll, Slideshow Maker, Poweroff 3.0, Google Chrome, etc.


    ■ It would be good to ask if people are seriously using other open source products.
    We are looking at an ILS (Koha) but are still comparing systems and haven''t implemented
    one yet.


    ■ Kuali is a financial interface for universities and is much cheaper than buying
    a commercial product like Banner. Your questionnaire seemed targeted toward personal
    uses of open source software rather than institutional applications.


    ■ I love LimeSurvey.


    ■ At work we are moving more and to open source, are changing to an open source
    helpdesk software, planning to try an open source discovery layer and are exploring
    the possibility of an open source ILS in the future.


    ■ We like Drupal. A lot. We also like Linux (CentOS), MySQL, Apache, PHP, Subversion
    and Margaritas (not software).


    ■ Not sure why WordPress wasn''t listed as a home option. Also, might have better
    analysis later if you asked more demographic questions – size [of] library, area
    of the country, – and also if the library, not the person, used OSS (e.g. Apache,
    etc.).


    ■ Only, that I am a believer in finding the right tool for the job. Sometimes
    that tool is open source, and sometimes it is better to use a commercial product.


    ■ For, FOSS shares a purpose with libraries – the sharing of information. The
    two have great potential together.


    ■ I don''t know what I''d do without portable open source software, since, in-house
    restrictions prevent me from installing a lot of the software I need. I like to
    try out'
  - '[PAGE 211]


    software first to see if it is really useful or not. If it is, I believe in contributing
    to the community, or donating monetarily, to help it continue.


    +   - I am a Mached, but I recently purchased a netbook that came (unfortunately)
    preloaded with Windows XP. I''m running Ubuntu from removable media simply for
    the challenge of learning something new. I hope to become sufficiently competent/confident
    with Ubuntu so that I can reformat the netbook as an Ubuntu-only machine. Why?
    Because I really like their philosophy: that Ubuntu and open source software make
    technology, access, and information accessible to all users regardless of financial
    or physical situations.


    +   - I am new to open source and I think it is very exciting. Bill Gates has
    made enough money.


    +   - We use a lot of Google''s offerings like Docs and the calendar.


    +   - Libraries underestimate the cost in personnel required to support open source.
    Any cost savings on purchase or maintenance is just shifted to personnel. This
    may not be true for a small rural library who has an younger, eager techie available.
    But I wonder what happens when he gets a family and needs more competitive pay
    and perhaps moves away. In our situation as large library in a large metropolitan
    area, our IT salaries have to compete with the big corporations. We can''t afford
    the knowledge we''d need to have our IBS supported and developed by a whole vendor
    team.


    +   - Librarians are ''tech'' enough to consider open source without some kind
    of support. Many of us are in our 50s and barely had computers in college, so
    we are not willing to transfer our whole automation process to something we don''t
    understand.'
  - '[PAGE 212]


    Practical Open Source Software for Libraries


    +   Open source software is a wonderful way to give patrons ''more''... more options,
    more services, etc. We installed Firefox on our public internet computers to give
    patrons a choice and OpenOffice in conjunction with Microsoft for the same reason.
    I use Firefox as my primary browser because... I would like to give more libraries
    open source software, particularly those facing budget cuts.


    +   Also see our website at http://meadvillelibrary.org/os for info from presentations
    we have made at a number of conference, articles I''ve written, etc.


    +   Not enough information is there about the ''costs'' of open source. The software/code
    is free but there are definitely costs associated with use and maintenance.


    +   I would love to use open source in place of Microsoft Office but it would
    take more staff time to convince the patron who are used to the MS. (Majority
    have limited experience and change is hard for them.) I have tried Firefox on
    public computers but found it is not ideal for that environment. But it''s my
    private browser of choice... so much better than IE.


    +   Before committing to Drupal I looked at several alternative CMS [content management
    system] options: Joomla, Plone, and Alfresco. If you want to know about Plone
    in libraries I''d suggest checking with the folks at the Plinkit Collaborative
    [at] http://www.plinkit.org/ (some of them also presented at a past Code4Lib so
    check the conference archives.


    +   It''s been watching the open source movement explode and become mainstream
    in libraries over the past few years. Many open source programs have such thriving
    user communities that make constant improvements and


    206'
  - '[PAGE 213]


    # Appendix 1 Survey results


    updates to the programs, making them the best of their kind – ie – Firefox! It
    appears that ILSs are headed in this direction as well, and that should be very
    interesting to watch over the next few years!


    +   - This is just my personal experience, I''m sure it''s not an exhaustive list
    of what''s being used around here.


    +   - We actually don''t have a library in our school and there are no plans to
    build one. I teach technology and feel that part of my job is to be a resource
    for teaching skills, validating information as well as a gateway of sorts to information
    on the internet.


    +   - Sorry I don''t even know what free source means. I am a grad student at
    Dominican and feel like I should know what means...


    +   - Support of the system is a problem for a small library without technology
    savvy staff.


    +   - The biggest problem I have with open source stuff is how difficult it often
    is to get help figuring out.


    +   - DokuWiki has been quite handy as an mini-intranet for our staff, and Request
    Tracker has made dealing with staff requests, much easier.


    +   - I like the idea of open source. However, Joomla has been difficult to understand.
    I hope other open source software is not as difficult to utilize.


    +   - I think open source is great, but I work for a library in a 75-member consortium
    that is not interested in exploring it at this time.


    +   - We are fortunate to have an extremely skilled and savvy network manager
    who installed Ubuntu on our network and customized Koha for us. As a small public
    library director, I would not have been able to make time to learn how to do these
    myself.'
  - '[PAGE 214]


    +   We are currently converting to Koha, and I try to keep my knowledge up about
    open source by reading a number of blogs so, I am a dabbler, though a believer,
    in open source really. Koha is about to be our LMS for five of our seven libraries
    so we are learning fast.


    +   I believe use open source is a trend in the library field. With little budget
    and more service needs, open source is a good solution for libraries.


    +   Our library is part of a small state agency that swings wildly between software
    types. We have elections every four years resulting in a new administration and
    a different way of doing things. First, the head of IT was a huge Microsoft person.
    Actually did do some development on cutting edge stuff with Microsoft themselves.
    The next head of IT was HUGELY open source. One of the first proponents of open
    source in government. Then, the pendulum swung back and we are once again a Microsoft
    shop, but we do as we are told and do not innovate or ask for anything. One bowl
    of Microsoft gruel is enough for us. Good Luck!


    +   The pay for support models created by proto-vendors arising from the increased
    use of FOSS will somehow morph into something all too familiar: the proprietary,
    company owned and developed, locked down, expensive to use...


    +   I''d like to use open source software but the court is very strict about security,
    as it should be.'
