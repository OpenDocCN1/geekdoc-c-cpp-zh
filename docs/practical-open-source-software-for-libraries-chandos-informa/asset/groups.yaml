    Open source research tools


    easier to research a specific topic, such as computer science (http://www.ithacacalibrary.com/sp/subjects/cs/).


    One problem with managing static HTML pages is that you often want links to appear
    on more than one page, but that means you have multiple places to look when making
    updates. SubjectsPlus enables you to add a resource to the system just once and
    then it appear on multiple guides. SubjectsPlus also has you associate an ''expert''
    with each subject librarian, so patrons know whom to contact at the library or
    on campus have additional questions about the topic they are researching.


    Library à la Carte™, from the Oregon State University Library, is another alternative
    to using static HTML pages for your subject guides. Like SubjectsPlus, it allows
    for the easy creation of dynamic subject guides. Unlike SubjectsPlus, Library
    à la Carte™ does not handle your A–Z lists and staff directories, but it does
    allow you to create course pages and tutorials.


    ## 10.2 Open source in the real world: Library à la Carte™


    | Kim Griggs, Programmer Analyst, Margaret Mellinger, Science Librarian, and Jane
    Nichols, Social Sciences/Humanities Librarian Oregon State University Libraries
    Corvallis OR, USA |


    **Why did you decide to use Library à la Carte™ in your library?**


    At the time that we developed Library à la Carte™, there were only a few software
    products available for the creation of library course and subject web pages. we
    assessed those that were available and didn''t feel that Practical Open Source
    Software for Libraries they matched our need to add Web 2.0 functionality to the
    guides as we desired. LibGuides hadn''t yet come out. Thus, we turned to developing
    an in-house solution.


    **How are you using Library à la Carte™ in your library?**


    Subject librarians are using it to create and manage course assignment pages and
    subject guides. Instruction librarians are using it to build tutorials.


    **How long have you been using Library à la Carte™ in your library?**


    Since its original iteration as the interactive course assignment pages (ICAP)
    tool in 2006/07.


    **What was the process of switching from proprietary to open source like?**


    Our previous practice was to create course and subject pages in html using Dreamweaver
    and Contribute templates. The process of switching was mostly a matter of understanding
    how a web content management system functions differently from using html templates.
    Training was needed for librarians to take advantage of all the features of Library
    à la Carte™. When librarians moved the content into Library à la Carte™, they
    had many more options for how to present that content.


    **What do you think of Library à la Carte™ now?**


    We like it and plan to continue to develop it. Our current focus is on using it
    for making tutorials and hosting Library à la Carte™ through a cloud computing
    environment.


    **What do others in your library say about Library à la Carte™?**


    Responses are positive and librarians and library administrators are engaged in
    and supportive of its continued development.


    **Anything else you want to know about Library à la Carte™ or your process of
    switching to Library à la Carte™?**


    The source code has been downloaded hundreds of times since its release in 2007.
    The tool is currently being used at over 20 libraries that we know about, Reed
    College, Portland Community College, California State University (multiple campuses),
    University of Arizona, University of Montreal and Sheffield Hallam University.


    Library à la Carte™ offers your staff an easy way to manage guides for areas of
    expertise without having any knowledge of web design or development (see Figure
    10.2). From the Library à la Carte™ administration area you can easily create
    your guide by clicking the link ‘Create a New Subject Guide.’ Your guide can be
    made up of various tabs with information on each. As SubjectsPlus, you need to
    choose an expert and include their information so that researchers can easily
    find the right person to direct their questions to. Once your page is created
    you click the ‘Publish’ button and your page is available on the library’s site
    (see Figure 10.3).


