- md: '

    # What do others in your library say about Kete?


    Those who embrace the project and commit resources to market it in the community
    and actively encourage and support the creation of content get a lot more from
    Kete than those who expect it to populate itself. It takes time and effort to
    build an online community. I make sure I respond to new contributors and acknowledge
    their additions to Kete through comments, making gentle suggestions or editing
    out obvious mistakes. I also like to celebrate submissions by making them feature
    topics on the home page. Kete is not a silver bullet, but it is an amazing excuse
    to get out and talk to every organisation, club and community group in your town
    – and build a great local resource while you are at.


    Joann Ransom writes about the process of choosing the name Kete for this community-built
    digital library:


    > Echoing the Maori proverb of the three baskets, kete, of knowledge, we called
    our concept Kete. We really like what the kete represents. We like that they are
    ‘honest’, practical items, woven from found materials, and that anyone can learn
    to weave one. We like that they are made from flax, which springs forth from Patapatuanuku,
    the earth mother. We like the link between the flax and the weaver – the person
    who caressed and shaped the flax into a beautiful or useful object. We like that
    kete are usually given from 1 person to another, so linking people together, and
    that they are usually given to mark an occasion so there are stories that surround
    a kete. When a kete is used and taken from one occasion to another, the stories
    are being told and the history preserved. The kete is an appropriate metaphor
    for our digital library, and the various types of material it contains.4


    # Practical Open Source Software for Libraries


    With Kete, a library can set up the software on its servers and then open up the
    content-adding tools to its community members. The library hosting the Kete instance
    gets to define the ‘community members’ are. If you work in a public library your
    community might be anyone with a library card or anyone in the world. If you are
    in an academic or school library, your community may only consist of students
    and professors.


    The community decides what kinds of content are added to the digital library (see
    Figure 9.4). This is a great way to collect all of the treasures hiding in your
    patrons'' attics. Pieces of family histories are lost daily; with a tool like
    this available, community members can share their treasures without giving up
    to the library. Kete Horowhenua (http://horowhenua.kete.net.nz) is the perfect
    example of how a community can get together to share their history with each other.
    Kete Horowhenua is a collection of digital resources managed by members of the
    community; See Figure 9.4.


    ![](img/4e1ec39c661a9fa73febd901135781ce_133_0.png)


    # Baskets of knowledge


    Between the library and the community there are many amazing collections worth
    sharing with others. One or all of these tools can be used to make collections
    accessible through the library website to the wider world.


    # Notes


    - 1. Witten, Ian H., Matt Jones, David Bainbridge, Polly Cantlon, and Sally Jo
    Cunningham. ‘Digital Libraries for Creative Communities.’ Digital Creativity 15,
    no. 2 (June 2004): 110–125.

    - 2. See http://digital.liby.waikato.ac.nz.

    - 3. ‘DSpace Use Case Examples.’ DSpace. http://dspace.org/use-case-examples/DSpace-Use-Cases.html.

    - 4. Ransom, Joann. ‘Kete Horowhenua: the story of the district as told by its
    people.’ Kete.net.nz, February 2008. http://kete.net.nz/blog/documents/show/33-kete-horowhenua-the-story-of-the-district-as-told-by-its-people.


    # Open source research tools


    In addition to digital collections, libraries have many other resources to share
    topics. Many library websites offer lists of links on specific topics, subject
    guides and online workshops to help educate their patrons. As with every other
    area of the library, there are open source technologies to help us deliver these
    guides and classes in an efficient manner.


    # Subject guides


    In my first job in a library I was in charge of managing the library''s research
    collection. This area of our site was very similar to the pages that academic
    libraries call subject guides. Whatever you might call them, these pages can be
    tedious to keep up to date if you are not using the right tool. In my library
    we were just using a series of static HTML pages that had to be updated regularly,
    a practice not uncommon in libraries around the world.


    Two open source tools that libraries have created to tackle this problem are SubjectsPlus
    (http://www.subjectplus.com) and Library à la Carte™ (http://alacarte.library.orestate.edu).


    ## 10.1 Open source in the real world: SubjectsPlus


    Bryan P Carson, Electronic Services Librarian and Technology Liaison to the Language
    Schools

    Middlebury College

    Middlebury VT. USA


    **Why did you decide to use SubjectsPlus in your library?**


    It is open source. It was easy to implement, lightweight and database-driven and
    it integrates well with other platforms.


    **How are you using SubjectsPlus in your library?**


    We use it for library subject guides and associating librarians contact info subject-specific
    content. We also use it for EZ resources.


    **How long have you using SubjectsPlus in your library?**


    We started it in November 2007.


    **Did you have any trouble implementing SubjectsPlus?**


    Not really. Andrew Darby (the lead developer) is very helpful.


    **What do you think of SubjectsPlus now?**


    I think it is excellent (and the price is right). Now that we have a critical
    mass of records, SubjectsPlus''s ability to distribute the content lets us create
    and update guides very quickly.


    **What do others in your library say about SubjectsPlus?**


    Everyone who sees the interface loves the look, feel and the usability. In addition
    the content creators find it easy to use.


    **Anything else do you want to know about SubjectsPlus or your process of switching
    to SubjectsPlus?**


    If you are person who implements SubjectsPlus, you must have a good knowledge
    of HTML and CSS. You must know some basic PHP and know how to administer a MySQL
    database. These skills are used for customization and installation. Except for
    the server setup, I have done most things by myself. Any ''webby/techie'' could
    do this.


    **Did you have any help installing, migrating, or setting SubjectsPlus?**


    Our network administrators set up server for it, so it can''t bring any security.
    One of our web programmers looked for obvious security issues in the code and
    sent them back to Darby. All the customizations and other tweaking, I did myself.


    **What was the process of switching from proprietary?**


    We found that proprietary is expensive but it saves staff time. Costs are down.
    User satisfaction is up. We were able to meet the needs of users. Our web programmers
    to create feeds for our website. The switch from proprietary was met with enthusiasm.


    # Learn more


    See SubjectsPlus in action at Middlebury at http://www.middlebury.edu/academics/lib/research/db-subject.


    SubjectsPlus was developed by Ithaca College Library as a way to librarians organize
    and present their data easily (see Figure 10.1). It allows for the storage of
    subject guides, A–Z lists and lists of staff members with their specialties. All
    of this is published to the web, making it


    Figure 10.1 Computer science research guide by Ithaca College Library


    ![](img/4e1ec39c661a9fa73febd901135781ce_138_0.png)

