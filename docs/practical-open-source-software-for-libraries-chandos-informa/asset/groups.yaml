    # Community and open source


    a project that has been around and thriving for years. members of the community
    aren''t willing to teach new people to help out, then there would never be new
    ideas added to the project and things would become stagnant. Esther Schindler
    writes about the importance of mentoring in open source communities (and includes
    quotes from Chris and me):


    Some software developers wrinkle their nose at the very idea of many one-on-one
    help. The default behavior in many (most? it''s hard to know) and free open source
    software (FOSS) communities is to read the code and documentation, try it out,
    rinse and repeat. People improve their skills on their own; if they need help,
    they post a note in a forum or ask in IRC [Internet Relay Chat]. Why should it
    be otherwise?


    However, we all learn differently. You might want to settle in with a programming
    book, while I prefer to take an in-person class. If your project wants to attract
    new contributors, it beho you to think past the ''dive into the deep end'' culture.


    The article goes on to discuss mentoring in several different open source projects
    with first hand accounts from mentees and mentors.


    # Rule 5: Keep it transparent


    Tying all of the rules together is the simple rule of transparency. Make sure
    that everything you do and say is out in the open so that everyone can benefit
    from your opinion, experiences and skills. If you are communicating about the
    project, log the discussion for those who are not


    17'
  - '[PAGE 31]


    online. If you are writing code, make sure it is submitted to the public repository
    or logged in a shared database of current projects so that work is not being doubled,
    and if you teach someone something new, document it and share it with others so
    they too can learn down the road.


    # Governing in open source


    Even with such utopian governing community participation, Steven Weber reminds
    us that open source is not all about happy, shiny people:


    The open source software process is not a chaotic free-all in which everyone has
    equal power an influence. And it is certainly not an idyllic community of like-minded
    friends in whom consensus reigns and agreement is easy. In fact, conflict is not
    unusual in this community; it''s endemic and inherent to the open source process.¹10


    This is why many of these projects have at least one (usually many more) person
    who is in charge of approving code for inclusion in the project. This person reviews
    all patches (the common phrase refers to code updates) as they are submitted and
    makes sure that they improve the product for the majority of users.


    In one of the open source communities that I am active in (the Koha integrated
    library system; http://www.koha-community.org), we have several people on the
    release team. The person who reviews all patches is known as the release manager
    (sometimes known as the release coordinator in other communities). Below him is
    at least one quality assurance person who makes sure that all patches meet the
    programming guidelines of the community and do not'
  - '[PAGE 32]


    # Community and open source


    introduce new bugs or security leaks. The release team also has a documentation
    manager, who is in charge of maintaining and writing documentation for the project;
    a translation manager, who coordinates with translators all over the world to
    make sure that the application can be used worldwide; and an interface design
    manager, who works with the developers to make their interfaces more appealing
    for those who will be using the software.


    Other open source projects are run by foundations or directors of some sort; like
    everything in open source, there is freedom to choose the type of governance that
    works best for your product and community. And Weber states, ‘There is no off-the-shelf
    template for coordination and nonauthoritative governance of complexity in the
    open source setting.’¹¹¹


    Rather the the community chooses to govern its actions, they never prevent others
    from chipping in. The whole idea behind open source and the community is that
    we help each other in any way possible. So even though my role in the Koha community
    is as documentation manager, I have been known to test new code and have even
    written a few patches to fix bugs or add new features, just as others have been
    known to write documentation.


    # Health of the community


    One of the points I always stress when teaching open source is to make sure that
    the product you are reviewing has an active and healthy community behind it. As
    stated earlier, open source is about so much more than working code:


    In considering a FLOSS project, make it a point to understand the community as
    you familiarize yourself with the code. Subscribe to and skim mailing lists, find'
  - '[PAGE 33]


    the list archives, and examine the project''s Web site. If the project has an
    Internet relay chat [IRC] channel, spend some time there – IRC''s informality
    can reveal whether participants actually like one another.¹12


