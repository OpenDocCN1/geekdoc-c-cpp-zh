    # 适用于图书馆的开源软件


    ## 你们在图书馆中是如何使用 Thunderbird 的？


    我们几乎所有的管理员桌面电脑上都安装了 Thunderbird，以便通过 SMTP 从我们的邮件服务器访问电子邮箱。


    ## 你们在图书馆中使用 Thunderbird 多久了？


    我们从 2003 年底开始一直使用 Thunderbird。


    ## 在图书馆中实施 Thunderbird 遇到过什么困难吗？


    我们遇到的唯一问题是初始配置问题。为了安全起见，我们使用了 TLS，有时 Thunderbird 会拒绝正常连接到我们的邮件服务器。坦率地说，这些问题似乎随着程序新版本的发布得到了解决。


    ## 从专有软件切换到开源软件的过程是怎样的？


    我们之前使用过 Netscape，然后是 Mozilla 作为电子邮件客户端，所以切换过程相对顺利。这个过程只涉及配置客户端，以及从之前的客户端中导入联系人列表。


    ## 你们在安装、迁移或设置 Thunderbird 时得到过任何帮助吗？


    没有，我们都是在内部完成的。


    ## 你们现在认为 Thunderbird 如何？


    我认为 Thunderbird 是一个很棒程序，但随着优秀的网页版电子邮件出现，它不像以前那么重要了。我们的邮件服务器目前运行在 Zimbra 上，因此我们的管理员可以选择使用
    Thunderbird 或网页界面来检查邮件。大多数管理员仍然选择使用 Thunderbird。


    ## 你们图书馆的其他人对 Thunderbird 怎么看？


    我们的我们的管理员只是很高兴能使用一个几乎总是能够运行稳定且正确的电子邮件客户端。


    ## 开源网页访问


    ## 关于 Thunderbird 或你们切换到 Thunderbird 的过程，还有什么想知道的吗？


    使用 SMTP 而不是 POP3 作为标准电子邮件协议会让客户端之间的切换变得容易得多，因为不需要导出和导入消息本身。


    许多管理员习惯了 Microsoft Outlook 或 Novell Groupwise 等电子邮件客户端，而从熟悉的界面切换到陌生的界面的想法可能会令人恐惧。然而，Thunderbird
    的设计与其他电子邮件工具非常相似，提供了多个面板来查看您的消息、任务等更多内容（见图 6.4）。


    Thunderbird 甚至允许使用 Lightning 插件（http://www.mozilla.org/projects/calendar/lightning/）创建个人和共享日历。Lightning
    允许


    ![](img/4e1ec39c661a9fa73febd901135781ce_78_0.png)


    您可以在本地机器上创建日历，或通过网络访问共享日历，对于任何办公室工作的人来说这是一个重要功能（见图 6.5）。


    如果您的图书馆使用 Google Apps 处理邮件和日历需求，您可以通过安装 Provider for Google Calendar 插件（https://addons.mozilla.org/en-US/thunderbird/addon/4631）和
    GmailAP Account Setup 插件（https://addons.mozilla.org/en-US/thunderbird/addon/6381）来继续使用
    Thunderbird。这些工具直接从 Google 获取您的内容并将其发布到 Thunderbird。


    除了简单的界面外，Thunderbird 还有内置的垃圾邮件过滤器、下载其他服务插件的选项（https://addons.mozilla.org/en-US/thunderbird/browse/type:1/cat66）、强大的邮件搜索功能以及同时检查多个电子邮件账户的能力（包括
    Gmail 和 Yahoo! 等流行的网页版邮箱账户！）。


    ![](img/4e1ec39c661a9fa73febd901135781ce_79_0.png)


    ## 即时消息


    虽然我们都同意电子邮件并未消亡，但这并不意味着它是我们在线唯一的通信手段。许多图书馆已经开始提供即时消息参考服务，作为一种让读者联系他们的额外方式。Pidgin
    (http://www.pidgin.im) 是一款开源即时消息工具，它可以让与读者的交流变得简单得多。Pidgin 可以同时连接并保持您的联系人有序，以便快速通信。


    Pidgin 允许您一次性登录所有流行的消息客户端 - AIM、Yahoo!、GTalk、Windows Live


    ![](img/4e1ec39c661a9fa73febd901135781ce_80_0.png)


    Messenger 等——与其他许多其他开放应用程序一样，Pidgin 还有可用插件（http://developer.pidgin.org/wiki/ThirdPartyPlugins），这些插件将添加对
    Facebook 和 Twitter 等其他可选即时消息网络的访问。这个单一界面允许管理员同时监控通信通道，而无需安装和运行多个应用程序（见图 6.6）。


    ## 6.5 现实世界中的开源：Pidgin


    Jennifer M. Turner，支持与培训专家

    PALS，明尼苏达州立学院与大学项目

    美国明尼苏达州曼卡托


    ## 你们为什么决定在图书馆中使用 Pidgin？


    Pidgin 可以与各种不同的 IM 程序配合，连接到专业的 IRC 通道，并保存对话/讨论日志。此外，它是免费且易于使用的！


    ## 你们在图书馆中是如何使用 Pidgin 的？


    与同事交流——我们为明尼苏达州大多数学院使用的图书馆系统提供技术支持和培训，通常给同事发送一个链接比让他们尝试在自己那边重现问题要容易得多。当有人在远程位置工作对另一位员工有问题或疑问时，它也派上了用。


    ## 你们在图书馆中使用 Pidgin 多久了？


    大约六个月（非常不估计）。


    ## 你们在图书馆中实施 Pidgin 遇到过什么困难吗？


    软件本身没有问题，但很少员工在使用。在使用的人很满意。


    ## 你们在安装、迁移或设置 Pidgin 时得到过任何帮助吗？


    没有。


    ## 你们现在认为 Pidgin 如何？


    它太棒了！我了解得越多，就越喜欢它！


    ## 你们图书馆的其他人对 Pidgin 怎么看？


    使用它的人已经接受并将其用于专业和个人通信。不使用的人没怎么说，因为他们不熟悉（而且他们通常也不使用聊天服务）。


    ## 选项之网


    我简要讨论了您的图书馆可用的开源选项。还有更多开源应用程序可以让您的在线体验更高效、更安全。给本章中的应用程序一个机会，如果发现你不满意，请搜索其他开源替代方案；那里多的是。


    ## 备注


    - 1. Krebs, Brian. ''Internet Explorer Unsafe for 284 Days in 2006.'' The Washington
    Post: Security Fix, January 4, 2007. http://blog.washingtonpost.com/securityfix/2007/01/internet_explorer_unsafe_for_284_days/.

    - 2. 若要查找支持 Zotero 的完整列表，可以查看他们的兼容站点（http://www.zotero.org/translators）。您还可以在兼容软件列表中查找哪些图书馆软件支持
    Zotero（http://www.zotero.org/support/compatible_standards_and_software）。

    - 3. 我的公共 Zotero 图书可以通过 http://www.zotero.org/nengard 获取。


    # 开源媒体应用


    许多学术图书馆为学生提供图书馆内的媒体中心。常见的误解是小型图书馆没有预算为他们的读者提供此类服务，但有许多开源应用程序可以填充任何图书馆的媒体中心。


    # 照片编辑


    在照片编辑和创作方面，许多图书馆一直习惯于使用文字处理程序附带的剪贴画，因为他们认为那是他们负担得起的。实际上，有很多强大的开源工具可以让您的照片看起来更专业。这些工具中第一个且可能最为人知的是
    GIMP (http://gimp.org)。


    GIMP 是一个照片编辑套件，曾被与 Adobe® Photoshop 进行比较。Photoshop® 是为专业艺术家设计的，对于普通图书馆来说往往大过其实。GIMP
    为图书馆提供了一种负担得起的替代方案。根据 GIMP 官方网站：


