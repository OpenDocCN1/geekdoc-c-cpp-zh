    # Koha


    Development of Koha started in 1999 in New Zealand. Members of the Horowhenua
    Library Trust (http://www.library.org.nz) in New Zealand decided that after contracting
    development of the integrated library system they wanted the code released into
    the wild for use by any and all libraries worldwide. In January 2000, the first
    version of Koha was released.¹ Ten years later, the system is being used by at
    least 945 libraries worldwide.²


    ## 11.5 Open source in the real world: Koha


    Owen Leonard, Web Developer

    Nelsonville Public Library

    Nelsonville OH, USA


    **Why did you decide to use Koha in your library?**

    We started investigating open source library systems when we began to have some
    concerns about the ILS we were using at the time. We were disappointed with the
    quality of support we were receiving. We were interested in upgrading that system,
    but we were told that to do so we would have to spend thousands of dollars on
    new hardware.


    At the same time we were interested in providing additional services to the public
    via the OPAC and using the data in the database. Unfortunately, we didn''t have
    easy access to either one: there was no option for customizing the content or
    appearance of the OPAC, and there was no way to connect to the system''s database
    using common tools like MySQL.


    At the time Koha was the most mature open source ILS available and the community
    surrounding it was active and helpful. When we looked at the list of services
    the system would have to match in order for us to be able to switch to it Koha
    didn''t match everything, but we knew that we had the power to make it into what
    we wanted.


    ## How are you using Koha in your library?


    We use just all of Koha''s functionality with a few exceptions: acquisitions,
    serials and original cataloging. Historically acquisitions and serials management
    were not elements of our previous commercial ILSes that we paid for, so our workflow
    when moving to Koha didn''t include those aspects. However, as serials management
    improves in Koha it''s becoming more and more attractive as a viable solution
    for us.


    ## How long have you using Koha in your library?


    We went live with Koha on September 2, 2003.


    ## Did you have ''trouble'' implementing Koha in your library?


    Whatever ''trouble'' we had implementing Koha we faced with the full understanding
    of the task before. When we made the decision to move to Koha the software hadn''t
    yet reached version 2.0. We know that we would have to sponsor the addition of
    MARC support before we could make the switch. We knew that we''d be doing some
    data imports by hand, and that we''d be fixing bugs.


    ## What was the process of switching from proprietary to open source like?


    The process of switching from a proprietary vendor deconf for switching to open
    source was the right decision. The software we were using at the time did not
    make it easy for us to export our data. When it came time to export some of our
    data we tried to use a tool found in our system, but it didn''t work. We contacted
    the vendor and asked why it was broken and they told us, ''You pay us to turn
    that on.''


    Practical Open Source Software for Libraries


    ## Did you have any help installing, migrating to, or setting up Koha?


    We did everything with in-house staff, with the frequent support of the Koha mailing
    list and IRC channel.


    ## What do you think of Koha now?


    Koha continues to work well for us. We really enjoy having direct access to our
    database for performing custom reports. It''s empowering to be able to find a
    bug, develop a fix, and submit it for inclusion in the next version. I love that
    we can feature our own content on the OPAC and customize it to match our website.


    ## What do others in your library say about Koha?


    Being Koha users has taught many of the staff that we have the power to make changes
    to our own software. Staff will report bugs to me and help to diagnose problems
    knowing that we can actually make a difference. This is a big change from the
    mindset of living under a proprietary vendor and fearing that reports will never
    be heard again.


    ## Anything else you want to know about Koha or your process of switching to Koha?


    Our migration from a proprietary vendor''s system to Koha is completely atypical:
    we were the first Koha public library in the United States, and we went through
    a lot to make it work. I think that work has paved the way for the process to
    be easier for libraries adopting Koha today. Improvements in the software and
    the arrival of the scene of Koha hosting and support companies make the process
    of moving to Koha no different, in terms of effort, than moving to any other ILS.


    What we learned this year was that having moved to Koha, we''re in a much better
    position to be able to pick and choose the paid support we want. Now that there
    are


    # Open source library automation


    choices in the Koha support market, libraries that use Koha are no longer tied
    down to one vendor for support and development. That makes a huge difference to
    a library that is unhappy with their vendor. With a proprietary ILS, a change
    in vendor is a change in ILS requiring a full-blown migration. If you''re using
    Koha and you''re not getting the support you have the option of choosing another
    support company. It''s incredibly empowering to know that you have that choice.


    Unlike many traditional library systems, Koha is completely web-based. In its
    current version, Koha offers access to many of the modules they need to run: patron
    management, cataloging and circulation. There are also reports and tools to help
    automate process.

