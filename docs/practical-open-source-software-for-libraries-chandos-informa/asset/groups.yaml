    think that else would ever want to use the products I developed so I didn''t think
    of how to share them with the world. Years later I am an active member in open
    source library communities and I wish I could go back and think ahead to this
    moment and the benefits that my tools would had to offer to other libraries.


    While at the law library I developed a powerful content management system to maintain
    the library''s intranet,^9 and now libraries are exploring options like Drupal'
  - '[PAGE 45]


    # Open source and libraries


    (http://www.drupal.org) and Joomla (http://www.joomla.org) to manage their websites.
    I also wrote an inter-library loan and billing system specific to the library
    that that I now see would have been useful to integrate into Koha (http://www.koha-community.org)
    or Evergreen (http://www.open-ils.org).


    I bring this up because libraries need to think ahead when they start development
    projects. They need to sit down and say, ''this is what we''re going to develop;
    could it by any chance of help to other organizations like ours?'' It is because
    of questions like this that we have the amazing selection of specific open source
    applications.


    # Notes


    +   1. Crawford, Richard. ''Open Source Solutions for Library Needs'' presented
    at the Linux Users Group of Davis, December 5, 2003. http://www.lugod.org/presentations/oss4lib.pdf.

    2. Eyler, Pat. ''Koha: a gift to libraries from New Zealand.'' Linux Journal 106
    (2003): 1.

    3. ALA. ''Code of Ethics of the American Library Association.'' American Library
    Association, January 22, 2008. http://www.ala.org/alalatalaloffices/oif/statements/codeethics/codeethics.cfm

    4. Morgan, Elise. ''Open Source Software: controlling your computing environment,''
    March 28, 2009. http://infomotions.com/musings/loss4/index.shtml

    5. Corrado, Edward M. ''The Importance of Access, Open Source, and Open Standards
    for Libraries.'' Issues in Science and Technology Librarianship 42 (Spring 2005).
    http://asil.org/05-spring/article2.html.

    6. Eyler, Pat. ''Koha: a gift to libraries from New Zealand.'' Linux Journal 106
    (2003): 1.

    7. Morgan, Eric. ''Gift Cultures, Librarianship, and Open Source Software Development,''
    November 14, 2004. http://infomotions.com/musings/gift-cultures/'
  - '[PAGE 46]


    +   8. Garsten, Christina, and Helena Wulff. New Technologies at Work: people,
    screens, and social virtuality. Oxford, New York: Berg, 2003.

    9. Engard, Nicole C. and RayAna M. Park. ‘Intranet 2.0: fostering collaboration.’
    Online 30, no. 3 (2006): 16. http://www.web2learning.net/publications-presentations/intranet-20-fostering-collaboration-with-a-bonegrown-intranet.'
  - '[PAGE 47]


    # Open source for day to day operations


    In every business there is a set of operations that must be completed. In today''s
    world, these operations often include the use of a computer. This means that everyone
    in the workplace must have the same or similar applications on their machines
    so that they can easily share information back and forth.


    # Operating system


    The one piece of software you need on every computer in your organization is an
    operating system. When it comes to operating systems, we''ve heard all of (and
    probably some experience with) Microsoft Windows™. Windows is prevalent in the
    operating system market that there are people who think it powers all computers.
    However, as we''ve learned in earlier chapters, Windows is not the all and end
    all of operating systems; it is just one option available to personal computer
    users. Other options include a wide variety of Linux (http://www.linux.org) flavors.


    Due to the open source license associated with the Linux operating system, developers
    have been able to take the original code and develop several Linux operating systems'
  - '[PAGE 48]


    # 5.1 Open source in the real world: Ubuntu


    Jessamyn West, Community Moderator at MetaFilter Library Technologist at Tunbridge
    Library

    Tunbridge VT, USA


    Why did you decide to use Ubuntu in your library?


    We were gifted some computers that were great except for the fact that they had
    no installed operating system. My choices were to steal a copy of XP [the library
    had no budget for more software] or to get a copy of Ubuntu to work on the two
    public access PCs. I decided to go with Ubuntu.


    How are you using Ubuntu in your library?


    Just as public access operating systems. We run Firefox and OpenOffice on them
    mainly but people can access games and a few other programs if they want. People
    listen to music and surf the web on them mostly; sometimes they worked process.


    How long have you been using Ubuntu in your library?


    This started maybe two to three years ago.


    Did you have any trouble implementing Ubuntu in your library?


    Not really. I was surprised how easy the implementation was. It''s not a very
    tech savvy community, switching operating systems on the public wasn''t as much
    of a problem. People just wanted to know ''okay how do I get on the internet?''
    on these machines; they weren''t cognizant of the operating system. There was
    still one other PC running Windows that they could use if they have OS-specific
    tasks to do – chat clients were the biggest problem for people – but they mostly
    didn''t. The install was simple and took a lot less time than any XP install I''ve
    done. The biggest hurdles were getting the'
  - '[PAGE 49]


    librarian to say okay to this idea, and having a safe place for them to put the
    admin password so that we could find it but that it wasn''t available to patrons.


    # What was the process of switching from proprietary to open source like?


    Sort of a nobrainer really. Anyone who has dealt with re-installing a corrupt
    OS knows it''s a serious headache. Being able to wipe/reinstall the OS on this
    machine or upgrade to the latest version made a lot of the trepidation of public
    access PCs really go out the window. Could we let the public just use the machines
    they wanted to and we knew we could fix stuff if it got broken. Just having patrons
    being able to use a machine that wasn''t always popping up dire warnings like
    ''your computer may be at risk!'' was worth the extra effort. With novice computer
    users, not having their experience be full of fear and uncertainty is a huge deal.


    # Did you have any help installing, migrating to, or setting up Ubuntu?


    No, I read the websites of the support groups and did it myself.


    # What do you think of Ubuntu now?


    I recommend it to people whenever they''re complaining about XP or Vista. I think
    its basically a shining example of how Linux has become a genuine option for public
    computing.


    # What do others in your library say about Ubuntu?


    In some ways they don''t even know they''re using it. They like that it''s free.
    They like the idea of open source though they''re not that deep into the culture.
    Libraries have always been about free culture in many ways, this is just another
    way to forward that ideal.'
- md: '

    ## Practical Open Source Software for Libraries


    Anything else you want us to know about Ubuntu or your process of switching to
    Ubuntu?


    I''d rather be someone wrestling with a new operating system than continuing to
    complain about Microsoft any day.


    Learn more


    Jessamyn install Ubuntu at http://www.vimeo.com/4169783.


    all to serve a difference audience. While any number of these iterations can be
    in libraries, I have chosen to focus on Ubuntu (http://www.ubuntu.com) because
    of its ease of use and popularity among librarians and educators.


    Why not an operating system Ubuntu? When we look at Windows we understand where
    the name came from – from all of the windows you can open and close to view applications
    and documents. Ubuntu is an African word meaning ‘Humanity to others’ or ‘I am
    what I am because of who we all are’¹ In a few of the open source source products
    mentioned throughout this book, you will find names that embody the open source
    sentiment, and Ubuntu is one of those.


    In my career I have installed several different operating systems – from scratch
    and as upgrades – I must say that one ever was as easy as installing Ubuntu. Once
    installed you have access not only to the operating system but also to several
    necessary applications like the complete OpenOffice suite, instant messaging software,
    games, a notepad, and other necessary applications. If there is an application
    you are missing you can simply search for it from the built-directory of Ubuntu-compatible
    software applications found under the Ubuntu Software Center (see Figure 5.1).


    It is for these reasons and of course the $0 price tag that libraries and educational
    institutions are switching their public machines (and even some staff machines)
    to Ubuntu.


    ## Figure 5.1 Ubuntu Software Center


    ![](img/4e1ec39c661a9fa73febd901135781ce_51_0.png)


    As open source applications go, Ubuntu is one of the better-documented options.
    You can easily find online and print guides to help you with your installation
    and day to use of the operating system. The active online community also makes
    for a great source when needing to find a quick answer.


    ## Virtual machines


    As someone who has migrated from one operating system to another I know it can
    be very scary to make the switch. This is why I use VirtualBox (http://www.virtualbox.org/)
    to test operating operating systems before making the switch. On my one (and only)
    computer I have the ability to work in five different operating systems, concurrently
    or at different times (see Figure 5.2).


    ## Practical Open Source Software for Libraries


    ### Figure 5.2 Four operating systems open in VirtualBox


    ![](img/4e1ec39c661a9fa73febd901135781ce_52_0.png)


    VirtualBox allows you to create multiple virtual machines that make use of your
    primary machine hardware while running different software applications. This means
    that you can install VirtualBox on Windows or Mac OS and then install Ubuntu on
    it to learn how to use a different operating system before making a blind switch.
    It also means that if you switch to Ubuntu you can still run Windows or Mac OS
    using VirtualBox.


    This would allow libraries that teach classes to teach patrons to use multiple
    operating systems running the machines in the library. As Heather mentions in
    her summary of VirtualBox, this is not the kind of application that you will use
    all of the time, but it is a great time and saver.


    ## Open source for day to day operations


    ## 5.2 Open source in the real world: VirtualBox


    Heather Braun, Technology Librarian

    Northeast Kansas Library System

    Lawrence KS, USA


    ### Why did you decide to use VirtualBox in your library?


    The IT department and many of the staff have used Macs, but we still need to be
    able to have ready access to Windows work, except because of the libraries we
    provide technology to support and work with PC-based. BootCamp would work we wanted
    to use Mac and PCs (and other operating systems) side by side. BootCamp is a one-system
    solution. You can only run one at a time.


    Our network administrator, Liz Rea, needed to be able to run multiple virtual
    servers in the background on her Mac. Initially, we purchased licenses to the
    Parallels software, but the program turned out to be clunky, slow and buggy. When
    launching the software, our computers would freeze for 10 minutes and other members
    hated it. New versions were available but we often required a reboot. We hated
    it and other staff hated it we didn''t want to keep paying for upgrades to the
    software every time a new version was released, especially when the software never
    worked well to begin!


    Then we found VirtualBox. We already use a lot of open source software at NK (Koha,
    WordPress, Firefox and OpenOffice), and so VirtualBox was a natural fit for us.
    It just works for the times we need it. No freezing or rebooting necessary.


    ### How are you using VirtualBox in your library?


    We use it to emulate Windows, Linux flavors and Linux server flavors on Macs.
    Liz Rea uses it to run a test system of Koha on her iMac so that she can do some
    testing and figure out the system.


    ### How long have you been using VirtualBox in your library?


    We''ve been using VirtualBox for about a year now. We don''t use it a lot, maybe
    once or twice a month, but it''s quite helpful when we need it.


    ### Did you have any trouble implementing VirtualBox in your library?


    No deploying the software itself. Deploying the operating systems within VirtualBox
    can be easy or difficult. It depends on the version, and how good VirtualBox''s
    drivers are for different operating systems. [Author''s note: Both Windows and
    Ubuntu are supported and easy to install]


    ### What was the process of switching from proprietary to open source like?


    The process was easy. No license keys to keep track of or buy (for the emulating
    software anyways; still needed license keys for the Windows operating systems).
    VirtualBox ran much faster than Paralle ever did, especially on startup. And,
    the support on the VirtualBox discussion boards (http://forums.virtualbox.org)
    was great. Usually a question I had already been asked there.


    ### Did you have any installing, migrating to, or setting up VirtualBox?


    Nope. The only place I consulted was the VirtualBox website and the discussion
    forums.


    ### What do you think of VirtualBox now?


    Love it. I wouldn''t want it to be the way I would heavily use Windows, but for
    the times I quickly need to look at Windows or test out a stripped Windows disk
    or a Linux flavor, it works great. I know it can also be used within Linux and
    Windows, but I have never used it that way.


    ### What do others in your library say about VirtualBox?


    Liz Rea, the NEKS System Administrator, loves it, as well. She''s the only other
    person using it at this time.


    Anything else you want us to know about VirtualBox or your process of switching
    to Ubuntu?


    If you''re a Mac user and have that one application you must always use, check
    out VirtualBox instead to test Linux.


    ## Office suite


    Once you have installed your operating system you need an office suite to help
    with your documenting and calculating needs. Ubuntu comes with OpenOffice suite
    (http://www.openoffice.org) already installed. If you are not using Ubuntu you
    can still use OpenOffice because there is a version for every major operating
    system.


    | 5.3 Open source in the real world: OpenOffice |

    | :--- |

    | Kate, Volunteer, Management Collective Feminist Library, London, UK |


    ### Why did you decide to use OpenOffice in your library?


    I must admit, this was mostly a financial decision. We are a small, volunteer-run
    library and a software license for commercial office software wasn''t really an
    option. We toyed with the idea of installing Linux on some of the older PCs in
    the office, but weren''t ready for that step just yet. Using a cross-platform
    suite leaves that open for later.


    ### How are you using OpenOffice in your library?


    We use OpenOffice for most administrative work conducted in the Feminist Library.
    Recently, as we have moved our catalogue to a library management system and are
    in the midst of a big cataloguing project, we have been creating an index of parts
    of the collection and using CALC spreadsheets to convert data into MARC records
    to import to the new catalogue.


    ### How long have you using OpenOffice in your library?


    Basically, since we''ve revived the library in mid 2008, I''m not sure it was
    used in previous incarnations of the library before I became involved.


    ### Did you have any trouble implementing OpenOffice in your library?


    Some slight glitches with file names when sharing documents with other organizations
    but the interface for OpenOffice is very user friendly and our formatting needs
    aren''t particularly complex. So, while not all the volunteers are as geeky as
    others, there have been precious troubles with implementation and everyone adjusted
    easily.

