    # 10.3 Open source in the real world: reSearcher


    Dan Hoyte, Senior Library Systems Technician

    Chapman University Leatherby Libraries

    Orange CA, USA


    Why did you decide to use reSearcher in your library?


    Several factors went into the decision. Primary was the fact that we wanted finer
    control over the data that drove our link resolver. Secondary was the need to
    implement an ERM. We were able to accomplish those goals and save the university
    over 60 per cent of the cost of our previous solution.


    How are you using reSearcher in your library?


    We are currently utilizing the link resolving (GODOT), knowledge base (CUFTS)
    and electronic resource management. We are in the process of implementing federated
    searching (Dbwiz). Our production system is run by Simon Fraser University, Canada.
    We also maintain a local backup and testing server locally.


    How long have you been using reSearcher in your library?


    We have been using reSearcher for nearly three years.


    Did you have any trouble implementing reSearcher in your library?


    We found setting up reSearcher was actually easier than setting up some of the
    proprietary packages that we tested.'
