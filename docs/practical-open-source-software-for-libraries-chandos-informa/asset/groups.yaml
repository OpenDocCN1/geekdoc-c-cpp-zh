    # 前序


    当我第一次与 Nicole 通信时，她是刚从图书馆学院毕业并在一家法律图书馆工作。她已经意识到自由软件（自由中的自由）和开源软件（FOSS）工具的技术优势，并使用
    FOSS 工具重新设计并构建了工作单位的内网。她当时刚刚开始学习自由软件背后的哲学。我工作的自由软件项目 Koha (http://koha-community.org)
    是这一社区运作的良好实例。一个在波兰为库克群岛国家图书馆的小型修道院工作的程序员，能够添加一项改善图书员日常生活的各项，这正是 FOSS 的意义。作为一名图书员，Nicole
    很快理解了自主的力量以及运行良好的自由开源软件项目之美。事实上，可以说图书员的主要功能是促进知识传递，从而赋能他们的社区，这与自由软件扮演的角色完全相同。


    在我有幸与 Nicole 为朋友的短短几年里，我见证了她从一名新手成长为自由软件项目中一个不可或缺的重要组成部分。她举办开源研讨会，进行演讲，


