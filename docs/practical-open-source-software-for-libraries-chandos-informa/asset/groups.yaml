    ## 在安装、迁移或设置过程中你们得到任何帮助吗？


    Alpha-G Consulting (http://www.alphagconsulting.com) 为我们完成了从 Horizon 到 Evergreen
    的迁移，Equinox Software (http://esilibrary.com) 为我们提供持续的托管和支持。


    你们现在对 Evergreen 怎么看？


    我们热爱 Evergreen。对自己的决定感到非常满意。


    你们图书馆的其他人对 Evergreen 怎么看？


    资深人员非常喜欢基础搜索界面中的单一搜索框——简单易用！青少年也喜欢这个单一搜索框，因为用起来像 Google 一样！所有读者都有能力在线管理自己的账户和预订借书。


    关于 Evergreen 或你们切换到 Evergreen 的过程，还有什么想让我们知道的吗？


    我们相信开源和公共图书馆有很多共同的价值观和目标，例如信息自由、平等开放的获取以及以社区为导向的实践。我们乐意支持公共图书馆的开源，并将继续敦促其他公共图书馆做出同样的选择。


    收集数据。虽然它没有提供所有的采购或连续期刊模块，¹ 但这些模块正在开发中，应该在 Evergreen 的未来版本中可用。


    Evergreen 的 OPAC 为读者提供了他们一直从现代网站中期待的整洁视觉效果（见图 11.8）。Evergreen OPAC 允许读者使用分面（也称为检索词目）缩小搜索范围，浏览正在查看的标题周围书架上的馆物品，通过创建“书包”与其他读者共享物品，并将任何
    URL 复制并粘贴到电子邮件和网站中。


    ### 图 11.7 Evergreen 员工客户端中的流通和目录管理


    ![](img/4e1ec39c661a9fa73febd901135781ce_171_0.png)


    ### 图 11.8 肯特公共图书馆的 Evergreen OPAC


    ![](img/4e1ec39c661a9fa73febd901135781ce_171_1.png)


    ## 相似点与差异


    两个 OPAC 都提供了来自服务的增强内容。这意味着它们利用了来自 Amazon.com、Google Books (http://books.google.com)
    和 LibraryThing (http://librarything.com) 等网站的图书封面和评论。这些新增的服务让你在浏览馆藏时，OPAC 对读者来说更有吸引力。


    与其他四个开源 OPAC 一样，Koha 和 Evergreen 在许多方面是的，但在某些方面又不同。Evergreen 在开发时考虑了联盟机构，因此虽然
    Koha 可以且确实可以在联盟环境中工作，但 Evergreen 能够更好地处理联盟规则和权限。相反，Koha 对于大型和特种图书馆来说更有意义，因为它具有管理图书馆采购和连续期刊的能力。尽管如此，随着连续期刊和采购支持的日趋完善，以及
    Koha 开发者正致力于创建系统组和类联盟的权限功能，这些细微的差异正在逐渐消失。


    开源集成图书馆系统的美之处在于，使用该系统的图书馆越多，可用的新功能和改进功能就越丰富。当 Koha 开发时，它是为了一个图书馆及其特定需求而设计的。当 Evergreen
    开发时，它是为了在一个特定的图书馆联盟环境中运行的。多年来，这两个系统都被与原始受众不同的图书馆所采用，而从这些采用中产生的开发使得工具变得更加强大且更有价值。


    与任何开源应用程序一样，在做出决定之前，测试所有可用的系统是至关重要的。Evergreen 和 Koha 都提供了在线公共演示（通常在多个处），你可以在决定之前进行尝试。一旦做出决定，你可以自己处理迁移，也可以寻求全球任何数量的支持公司¹¹²


    ## 跨出这一步


    决定改变像集成图书馆系统或 OPAC 这样图书馆运行的基础组成部分可能是令人恐惧的，就像选择书中的任何应用程序一样，这对你的图书馆可能不是正确的步骤。在查看传统资源的同时查看开源替代方案是非常重要的，这样你就可以对你的自动化需求做出明智的决定。与任何软件决策一样，务必咨询全球的同事，看看他们的经历是什么以及他们建议什么。


