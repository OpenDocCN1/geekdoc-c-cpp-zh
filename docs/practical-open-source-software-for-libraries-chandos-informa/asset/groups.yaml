- md: '

    ## 7.1 Open source in the real world: GIMP


    Chauncey G. Montgomery, Director

    Community Library

    Sunbury OH, USA


    Why did you decide to use GIMP in your library?


    Staff and customers were in need of a graphics manipulation program and products
    like Adobe Photoshop? were too costly for a small library with limited funds.
    From what we saw, GNU Image Manipulation Program (GIMP) provided a full range
    of features, similar to Photoshop, and looked intuitive enough to implement in
    the library.


    How are you using GIMP in your library?


    Customers use GIMP to do light photo editing. The images they edit tend to be
    uploaded to photo sites, or sent to local photo labs for printing.


    Library personnel use GIMP for more advance image manipulation. Images for the
    web, displays, posters, bookmarks and various promotional materials are often
    first edited using GIMP; it has primarily become the image manipulation tool for
    the library.


    Some of the common uses of GIMP in the library include but are not limited to
    cropping, resizing and adjusting levels. We also use the layers feature when adjusting
    or building more complex images.


    A sample of an image we built is seen in Figure 7.6. This image is used for the
    header for a local history photo journal at the library. Figure 7.6 shows an image
    created in GIMP that is used for the the-er header for a local history photo journal
    at the library.


    # How long have you been using GIMP in your library?


    We have been using GIMP for probably three years now.


    # Did you have any trouble implementing GIMP in your library?


    We had no problems implementing GIMP with customers because prior public had no
    access to an image manipulation program. Often times we do need to assist customers
    with editing because they are not familiar with the tools in GIMP and how to properly
    use them.


    For most staff, we''ve had the same response as we did with the public. Prior
    to GIMP most staff did not have access to a manipulation application. They have
    been successful in carrying out simple tasks with the program.


    We have one individual who is using an older version of Photoshop® Elements and
    is reluctant to use GIMP. On the other hand, I have been forced to use GIMP for
    all editing needs at the library as I am using a Linux workstation and it is the
    only tool I have available.


    I often use Photoshop® for personal use and using GIMP has left me with two impressions
    in relation to Photoshop®. First, I am impressed with the power and functionality
    of GIMP. Almost anything! I do in Photoshop® can be done in GIMP. With that said,
    my second impression is that GIMP is not intuitive as Photoshop®. Likewise, it
    is somewhat cumbersome with the three separate windows, as opposed to the single
    interface for Photoshop®. Overall, though, I think it is easy enough that someone
    can sit down and do image manipulation without much training or study.


    # What was the process of switching from proprietary to open source like?


    It has been much easier than I had imagined years ago when we started moving in
    this direction. I am extremely impressed with the availability of quality, powerful
    software. Any time I have need for an application, I can usually find an open
    source solution. Installation is always just as easy as proprietary, and use,
    for the most part, is just as intuitive.


    Open source has plenty of support. You just have to be a little more patient.
    Most likely the application can do what you want it to, but you need to spend
    time searching forums, sending emails, or just playing with it to discover how
    you complete the desired task.


    # Did you have any help installing, migrating to, or setting up GIMP?


    We did not have any help installing and migrating to GIMP; however, it is extremely
    easy to install.


    # What do you think of GIMP now?


    I think that it is just as good as Photoshop Elements and someone who has never
    used Elements or the full version of Photoshop would have no trouble getting into
    GIMP and using it.


    # What do others in your library say about GIMP?


    Most feel that it does the job. The individual on staff who uses Photoshop Elements
    is probably a little more apprehensive to embrace GIMP but doesn''t say anything
    bad about it; she just doesn''t use it (probably because she has an option).


    # Anything you want us to know about GIMP or your process of switching to GIMP?


    Just install and start using it. You should have no problems whatsoever. Be patient
    if you can''t figure out how to do something. Read websites, forums and, if need
    be, books, and you''ll find answers.


    It''s an excellent program.


    ## Open source media applications


    [GIMP] has many capabilities. It can be used as a simple paint program, an expert
    quality photo retouching program, an online batch processing system, a mass production
    image renderer, an image format converter, etc.


    GIMP is expandable and extensible. It is designed to be augmented with plug-ins
    and extensions to do just about anything. The advanced scripting interface allows
    everything from the simplest task to the most complex image manipulation procedures
    to be easily scripted.


    In short, GIMP can be used for all of your graphic needs, and if a function is
    missing from GIMP you can browse through the registry of plugins at http://registry.gimp.org/list_content
    to extend the functionality of GIMP.


    There is a learning curve for those who haven''t used a photo-editing package
    before, and even for those who might be used to another manipulation package (Figure
    7.1). GIMPshop


    **Figure 7.1** Options for editing photos in GIMP


    ![](img/4e1ec39c661a9fa73febd901135781ce_87_0.png)


    ## 7.2 Open source media in the real world: Scribus


    Clay Fouts, Managing Editor of Lion & Serpent

    Sekhet-Maat Lodge, representing Ordo Templi Orientis Portland, US


    Why did you decide to use Scribus in your organization?


    Because of budgetary constraints and the ideological preferences of much of our
    membership, we tend to use FOSS [free open source software] projects to fulfill
    our technical needs. Our website incorporates MediaWiki, Apache, MySQL, WordPress
    and other packages to manage and deliver content.


    This trend continued when we developed a need for desktop publishing software.
    Our desire for proper color management, high quality font rendering, and vector
    graphics led us to a choice between Scribus and TeX. While TeX'' descriptive language
    and maturity appeal to our programmer''s mind, we thought Scribus'' graphical
    interface and similarity to other desktop publishing (DTP) software would make
    it easier for others to pick up the job in the future.


    # How are you using Scribus in your organization?


    We originally started it to produce the layout of our journal, Lion & Serpent.
    However, since using it for that purpose we have also used it to design all sorts
    of printed materials, including business cards, ceremony missals and the like.


    # How long have you been using Scribus in your organization?


    Nine months.


    # Did you have any trouble implementing Scribus in your organization?


    It is still young, so is not as feature-rich as, say, InDesign. Because the more
    powerful features are in the newer, development versions (we currently use the
    1.3.5.1 release), we also tend to run into instability and the occasional bug
    one is likely to find in bleeding-edge software. I haven''t run into any show-stoppers,
    however.


    # What was the process of switching from proprietary to open source like?


    Our previous layout person used Adobe''s InDesign, and there''s no tool to translate
    those files used to create earlier journal volumes into Scribus'' format. This
    meant we had to start over from scratch, more or less, and rebuild our template
    set in the new format.


    ## Figure 7.2 Scribus


