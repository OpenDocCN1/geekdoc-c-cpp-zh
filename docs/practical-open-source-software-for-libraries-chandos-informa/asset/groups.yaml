    ## Did you have any help installing, migrating to, or setting up?


    Alpha-G Consulting (http://www.alphagconsulting.com) performed our migration from
    Horizon to Evergreen, and Equinox Software (http://esilibrary.com) provides ongoing
    hosting and support for us.


    What do you think of Evergreen now?


    We love Evergreen. We could not be happier with our decision.


    What do others in your library say about Evergreen?


    Seniors love the single search box in the Basic Search interface — simple to use!
    Teens love the single search box because it''s Google-like! All patrons have the
    ability to manage their account and hold theirs online.


    Anything else want us to know about Evergreen or your process of switching to
    Evergreen?


    We believe that open source and public libraries share a lot of common values
    and goals, among those freedom of information, equal and open access, and community-oriented
    practices. We are happy to support open source in public libraries, and we will
    continue to urge other public libraries to make the same choice.


    gather data. Although it does not offer all acquisitions or serials module,¹ these
    modules are in development and should be available in a future release of Evergreen.


    Evergreen''s OPAC allows patrons with a clean look and feel they have come to
    expect from modern websites (see Figure 11.8). The Evergreen OPAC allows patrons
    to narrow their searches using facets (also known as authorized headings), browse
    for items on the shelf around the title they are viewing, share items with fellow
    patrons by creating ‘book bags,’ and copy and paste any URL into emails and websites.


    ### Figure 11.7 Circulation and cataloguing in the Evergreen staff client


    ![](img/4e1ec39c661a9fa73febd901135781ce_171_0.png)


    ### Figure 11.8 The Evergreen OPAC at Kent Public Library


    ![](img/4e1ec39c661a9fa73febd901135781ce_171_1.png)


    ## Similarities and differences


    Both OPAC also offer enhanced content from outside services. This means that they
    make use of book jackets and reviews from sites like Amazon.com, Google Books
    (http://books.google.com) and LibraryThing (http://librarything.com). These added
    services make the OPAC a little bit more appealing to patrons as you browse your
    collection.


    Like the four open source OPACs, Koha and Evergreen are similar in many ways,
    and different in a few. Evergreen was developed with the consortium in mind, so
    although Koha can and does work in a consortium environment, Evergreen handles
    the consortium rules and permissions much better. On the flip side, Koha makes
    more sense for large and/special libraries because it has the ability to manage
    your library''s acquisitions and serials. That said, these small differences are
    slowly disappearing as finishing serials and acquisitions support and Koha developers
    work on creating system groups and consortium-like permissions.


    The beauty of the open source integrated library system is that the more libraries
    that are using the system the more new and improved features become available.
    When Koha developed it was for one library and its specific needs. When Evergreen
    was developed it was meant to work in one specific library consortium environment.
    Over the years both systems have been adopted by libraries that are unlike the
    original audience and the developments that have come out of those adoptions make
    tools more powerful and valuable.


    As with any open source application, it is important to test all the systems available
    to you before making a decision. Both Evergreen and Koha offer online public demos
    (usually in more than one place) that you can try before you decide. Once your
    decision is made you can handle the migration on your own or turn to any number
    of support companies worldwide.¹¹²


    ## Taking the leap


    Deciding to change such a fundamental part of your library''s operations as the
    integrated library system or OPAC can be scary, like choosing any of the applications
    in this book, might not be the right step for your library. It is important to
    look at open source alternatives alongside your traditional resources so that
    you can make an educated decision about your automation needs. As with any software
    decision, be sure to consult your colleagues worldwide to see what experiences
    have been and what they recommend.


    ## Notes


    - 1. Bisson, Casey. ‘Designing an OPAC for Web 2.0’ presented at the ALA Midwinter,
    January 20, 2006, http://homepage.mac.com/misterbisson/Presentations/ALAmidwinter-2006jan20.pdf.

    - 2. Lucia, Joe. ‘Villanova University Releases VUHFIND, an Open Source Next Generation
    Library Catalog.’ Library Technology Journal, http://www.librarytechnology.org/displaytext.php?rc=12664.

    - 3. Saller, Bess. ‘First Release!’ RubyForge: Blacklight, January 26, 2008. http://rubyforge.org/forum/phpforum.php?forum_id=21035.

    - 4. Blyberg, John. ‘OPAC 2 Released: September 25, 2008. http://www.blyberg.net,
    blyberg.net/2008/09/25/opac-2-released-theocialpacnet-launched/.

    - 5. At the time of writing, Stanford University has developed an advanced search
    method for Blacklight, but it has not yet added to the codebase for benefit from.

    - 6. Koha is the Maori word for gift, but not just kind of gift; it is a gift
    that is offered.

    - 7. Eyler, Pat. ‘Koha: a gift from New Zealand.’ Linux Journal 106 (2003): 1.

    - 8. This number was found by searching for libraries on webcasts (http://www.librarytechnology.org/webcasts/).

    - 9. ''Georgia''s 252 Public Libraries Preparing Debut of Evergreen Software.''
    Library Technology, August 21, 2006. http://www.librarytechnology.org/ltg-displaytext.pl?RC=12162.

    - 10. This number was found by searching for libraries on webcasts (http://www.librarytechnology.org/webcasts).

    - 11. As of May I, 2010, there are versions of available for testing. To learn
    more about acquisitions you can read my summary from the 2010 conference at http://www.weblearning.net/archives/3770;
    Ian Walls has a nice summary of serials also from the conference, http://bywatersolutions.com/?tp=474.

    - 12. Eric Lease Morgan has compiled a list of open source support companies that
    have been known to work with libraries in the past at http://infomotions.com/tmp/oss/support.html.
    As he notes, this list is not exhaustive, but it''s a great place to start your
    research.


