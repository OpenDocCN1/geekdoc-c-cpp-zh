    # Open source on the web


    Figure 8.4 The librarian created administration area of MaiaCMS


    ![](img/4e1ec39c661a9fa73febd901135781ce_111_0.png)


    ## 8.4 Open source in the real world: MaiaCMS


    Danny Bouman, Web Developer

    Howard County Library

    Columbia MD, USA


    Why did you decide to develop MaiaCMS for your library?


    I decided to develop MaiaCMS because the library was interested in designing a
    new website and a content management system was necessary to allow non-technical
    staff to contribute and maintain the content on the site. I had explored several
    existing CMS options such as Joomla and Drupal, but I was just not happy at the
    time with how complex they were and how much tweaking would be needed to simplify
    them for our users. Creating MaiaCMS from scratch gave me the platform to create
    a truly customized system that would be well suited to meet the exact needs of
    Howard County Library.


    ## How are you using MaiaCMS in your library?


    MaiaCMS is currently our public website (http://hclibrary.org) and is entirely
    maintained by our Marketing Department.


    ## How long have you been using MaiaCMS in your library?


    We have been using MaiaCMS for a little over a year now.


    ## What was the process of switching from proprietary to open source like?


    We did not have a proprietary system before. Although it was developed by an outside
    web design company, we always had access to modify the website as we needed.


    ## What do you think of MaiaCMS now?


    MaiaCMS continues to work extremely well for Howard County Library in large part
    to the fact that it was developed for Howard County Library. If I were to go back
    and over again, I would choose to start with Joomla or Drupal as a foundation
    rather than developing a new system from scratch. I found that as I am releasing
    MaiaCMS to the public, I was being forced to replicate many of the features already
    existing in Joomla and Drupal.


    ## What do others in your library say about MaiaCMS?


    The Marketing Department has mentioned that they find it extremely easy to use.
    Many staff members have commented that the simplistic design makes it easy to
    navigate.


    From a developer perspective, I would say that it is difficult to install and
    configure due to the current lack of documentation.


    ## Are there any screenshots, documentation or features about your use of MaiaCMS
    online or in library journals that we should look at?


    Documentation (when it is written) and screenshots can be found at http://maiacms.org.


    # Open source on the web


    Features of MaiaCMS include:


    - simple and intuitive design

    - ability to easily create and administer forms

    - innovative system for managing site contacts

    - components for sending out newsletters, adding promotional items, making announcements,
    and adding job openings.


    Anything else you want to know about MaiaCMS or your process of switching to MaiaCMS?


    All of the code is freely available at http://maiacms.org to anyone who wishes
    to use it. Due to the project still being in its infancy, site administrators
    will need to be familiar with PHP in order to install and configure the product.


    The drawback to MaiaCMS is that it is currently only being used at the library,
    there is no active community to go for support and no documentation available
    online. I would recommend that librarians make MaiaCMS on their radar, but not
    make the leap to implementing it until there is a bit more activity around it.


    Often overlooked as a content management system is WordPress (http://wordpress.org).
    Originally used as a blogging platform, recent upgrades to WordPress have made
    it a viable alternative to the systems usually thought of as the top source content
    management systems (see Table 8.1 for a basic CMS comparison). WordPress comes
    with all of the trademarks of an amazing open source application: active community,
    strong base, extensive documentation and the ability to extend functionality with
    user-developed plugins. In fact, WordPress is found on nearly three times as many
    big sites² as Drupal (which is used three times more than Joomla).³


    # Practical Open Source Software for Libraries


    ## Table 8.1 Comparison of content management systems


    | | Joomla | Drupal | MaiaCMS | WordPress |

    |---|---|---|---|---|

    | Premade templates | Yes | Yes | No | Yes |

    | Wiki functionality | w/plugin | w/plugin | No | w/plugin |

    | Blog functionality | Yes | Yes | No | Yes |

    | Support options | Forums | Forums | Mailing | Forums |

    | Library community | Yes | Yes | No | Yes |

    | Extensions | Yes | Yes | Yes | Yes |

    | Multi-user access | Yes | Yes | Yes | Yes |

    | OPAC plugin | No | SOPAC2 | Yes | Scriblo |

    | Built-in search | Yes | Yes | Yes | Yes |

    | RSS feeds | Yes | Yes | Yes | Yes |


    One of the biggest selling points for WordPress to those who are unfamiliar with
    installing web applications is its five-second install. You are asked a few questions,
    click submit and you have a WordPress site up and running. You can walk through
    the easy-to-understand ''Settings'' section and customize some of the ways people
    will interact with your new site. The thing that takes the most time is finding
    the theme you like best. When teaching WordPress to fellow librarians, this is
    the part of the class that always takes the longest, a true testament to how easy
    it is to learn (see Figure 8.5) and use WordPress to manage your entire website.


    ## Consulting with colleagues


    When choosing to use a new or unfamiliar tool, it is always handy to have access
    to colleagues who have gone before


    # Open source on the web


    Figure 8.5 The administration area of MaiaCMS


    ## 8.5 Open source in the real world: WordPress


    Susan Bryant, Outreach

    Morill Public Library

    Hiawatha, USA


    Why did you decide to use WordPress?


    WordPress gives us control over the website.


    How long have you been using WordPress?


    Since 2006.


