    # 11.6 Open source in the real world: Evergreen


    Karen Collier, Public Services Librarian, and Andrea Buntz Neiman, Technical Services
    Librarian

    Kent County Public Library

    Chestertown MD, USA


    Why did you decide to use Evergreen in your library?


    For our new ILS we were looking for a certain combination of price, features and
    support. Evergreen had the features we wanted at an excellent price, with top
    notch available. The freedom and opportunity for community involvement that come
    with open source software were icing on the cake.


    How are you using Evergreen in your library?


    Evergreen is our integrated library system, providing circulation, cataloging
    and reporting functionality, as well as our public access catalog.


    How long have you been using Evergreen in your library?


    We''ve been running Evergreen live since June 4, 2008.


    Did you have any trouble implementing Evergreen in your library?


    Migrating to Evergreen turned out to be significantly less trouble than we thought
    it might be. We''ve heard share of migration horror stories, but ours was painless.
    We were running Horizon on Tuesday and Evergreen on Wednesday with no interruption
    to services.


    What was the process of switching from proprietary to open source like?


    The move to open source has been an eye opening experience. The community of Evergreen
    developers, users and enthusiasts has proven active, helpful and welcoming. And
    the freedom that comes with open source is like a breath of fresh air.'
