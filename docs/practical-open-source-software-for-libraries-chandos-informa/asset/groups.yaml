    [content]

    # Open source media applications


    screencastings software captures your movements and your voice and creates a video
    that you can then publish on the web.


    CamStudio (http://camstudio.org) is an open source application that will help
    you create these screencasts on Windows, and recordmydesktop (http://recordmydesktop.sourceforge.net)
    is the solution if you are on a Linux operating system. Both applications are
    extremely easy to use. Simply start the application, choose the region you want
    to record on your screen and click the record button (see figures 7.4 and 7.5).
    Once your videos are recorded you preview them in the application''s viewer.


    The Northeast Kansas Library System (NEKLS) makes great use of screencasts (http://www.nxpresslibrary.org/category/tutorial/)
    as training agents for their member libraries. These videos go along with text
    documentation they have written in order to make it easy for all types of learners
    to get the most out of their open source integrated library system, Koha (http://koha-community.org).


    > Figure 7.4 RecordDesktop records your actions as you navigate around your computer


    ![](img/4e1ec39c661a9fa73febd901135781ce_97_0.png)


    # Practical Open Source Software for Libraries


    Figure 7.5 CamStudio provides you with details about your recording as you record
    your actions


    ![](img/4e1ec39c661a9fa73febd901135781ce_98_0.png)


    # Official Book Site


    This will be the official site for the upcoming book published by Chandos Publishing
    in 2010.

    The library community is about open source application code is made available
    sense? Probably not! Would it help if you knew about following a philosophy?


    # 7.4 Open source in the real world: RecordMyDesktop


    Mark Osborne, Deputy Principal

    Albany Senior High School Library

    North Shore City, New Zealand


    Why did you decide to use RecordMyDesktop in your library?

    We wanted to record screencasts to show users how to use features of the catalogue.


    How are you using RecordMyDesktop in your library?

    Recording screencasts for the OPAC and software applications in use in our school.


    How long have you been using RecordMyDesktop in your library?

    About 12 months.


    Did you have any trouble implementing recordMyDesktop in your library?

    No. Once we made sure the microphone was connected properly it was easy.


    Did you have any help installing, migrating to, or setting up recordMyDesktop?

    No. I installed it myself.


    What do you think of recordMyDesktop now?

    It''s good. I will continue to use it.


    What do others in your library say about recordMyDesktop?

    The screencasts are extremely helpful and most people''s preferred way of learning
    how to do something.


    See screencasts created with recordMyDesktop online:

    http://wikieducator.org/Albany_Senior_High_School/ICTs.


    # Conclusion


    Using the tools in this chapter you could set up a public media station within
    your library for little or no cost. Using an older or donated machine running
    Ubuntu, you can easily install all of the applications listed here (and more)
    and allow your patrons to start creating their very own movies, pcasts and newsletters.


    # Notes


    + 1. ''Introduction to GIMP.'' GIMP, 2009. http://www.gimp.org/about/introduction.html.


    + 2. Harper, Eliot. ''Scribus: open source desktop publishing.'' Seybold Report:
    Analyzing Publishing Technologies 9, no. 1 (January 8, 2009): 7–14.


    + 3. Stephens, Michael. ‘All About Podcasting.’ Library Media Connection 25, no.
    5 (February 2007): 54–57.


    + 4. Please note, while NEKLS makes great use of screencasts, they do not use
    either of the tools mentioned in this chapter.


    # Open source on the web


    More and more librarians are being asked to join the ranks of the information
    technology staff. When I started in libraries I was in charge of the library websites.
    It was unthinkable that a librarian would have the skills, the desire, or the
    time for such a task. Now, with the prevalence of technology and the ever-shrinking
    library budgets, more and more librarians are stepping into the role of webmaster
    and, to do the job right, you need the right tools.


    On the plus side, with the advent of the read/write web there are plenty of tools
    available for non developers to use to help create their websites, and many of
    them are open source.


    # Getting files onto the web


    Before you start your website, you need at least one tool to help you transfer
    files from your computer to the web server. This process is called FTP or file
    transfer protocol. For this process you will need an FTP program; FileZilla (http://filezilla-project.org)
    is one of the popular choices among libraries. It is a favorite because it installs
    on nearly every operating system, making it easy to find the right version for
    your environment.


    # 8.1 Open source in the real world: FileZilla


    Rick Mason, Acquisitions Assistant

    Blackmore Library, Capital University

    Columbus OH, USA


    Why did you decide to use FileZilla in your library?

    We wanted to record screencasts to show users how to use features of the catalogue.


    How are you using FileZilla in your library?

    Recording screencasts for the OPAC and software applications in use in our school.


    How long have you been using FileZilla in your library?

    About 12 months.

