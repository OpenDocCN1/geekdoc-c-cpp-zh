    # How are you using Library à Carte™ in your library?


    Subject librarians are using it to create and manage course assignment pages and
    subject guides. Instruction librarians are using it to build tutorials.


    # How long have you been using Library à la Carte™ in your library?


    Since its original iteration as the interactive course assignment pages (ICAP)
    tool in 2006/07.


    # What was the process of switching from proprietary to open source like?


    Our previous practice was to create course and subject pages in html using Dreamweaver
    and Contribute templates. The process of switching was mostly a matter of understanding
    how a web content management system functions differently from using html templates.
    Training was needed for librarians to take advantage of all the features of Library
    à la Carte™. When librarians moved the content into Library à la Carte™, they
    had many more options for how to present that content.


    # What do you think of Library à la Carte™ now?


    We like it and plan to continue to develop it. Our current focus is on using it
    for making tutorials and hosting Library à la Carte™ through a cloud computing
    environment.


    # What do others in your library say about Library à la Carte™?


    Responses are positive and librarians and library administrators are engaged in
    and supportive of its continued development.'
