    # How long have you been using Scriblio in your library?


    The website has been live for almost a year, though I started working with Scriblio
    (and with Casey Bisson, its developer) about 18 months ago.


    # Did you have any trouble implementing Scriblio in your library?


    There have been issues, sure. Many of them have been fixed, but there are a few
    outstanding issues.


    # What was the process of switching from proprietary to open source like?


    We didn''t really switch. Millennium is still there, including its web OPAC interface.
    Scriblio just complements it.


    # Did you have any help installing, migrating to, or setting up Scriblio?


    I worked directly with Casey Bisson, the main developer.


    # What do you think of Scriblio?


    Scriblio isn''t perfect, but I''m very comfortable with it and excited about where
    it''s heading. While I''ll be happier when there is a larger developer community,
    more internal interest in standards, and better documentation, I have the ability
    to help make these changes.


    # What do others in your library say about Scriblio?


    Many people like it; some prefer the old system. Dewey: most of the people who
    have gotten to know it well have developed a fondness for it. The rest of the
    world wants a website that works like Google and a shelving system that works
    like Barnes & Noble.


    # Anything else you want to know about Scriblio or your process of switching to
    Scriblio?


    I have written a full article about my decision here: http://www.inthelibrarywiththeleadpipe.org/2009/we-b-s-i-t-e-find-out-what-it-means-to-me/.'
