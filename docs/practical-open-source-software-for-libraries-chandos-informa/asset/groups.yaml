    # Why did we decide to use VuFind in your library?


    We decided to use VuFind in our library because we found it was an easier interface
    for our patrons to navigate and understand compared to the OPAC packaged with
    LMS.


    # How are you using VuFind in your library?


    VuFind is used as our primary OPAC and we also give our patrons the option to
    use the original OPAC, which was packaged with our LMS.


    # How long have you been using VuFind in your library?


    We started to look at VuFind as another option to our existing OPAC during January
    2008. We decided we would'
  - '[PAGE 156]


    # Practical Open Source Software for Libraries


    use VuFind as an alternative OPAC on the 20th January 2008 (two weeks later);
    during early February 2008 we installed VuFind and connected to our LMS''s training
    database, and we asked some patrons to conduct some searches in VuFind and give
    us their feedback on its interface and how easy it is to use. With positive feedback
    we installed VuFind onto a production server and went live with it on the 1st
    March 2008.(We use VuFind as our primary OPAC, but still offer our patrons the
    option to use the OPAC which was packaged with our LMS.)


    VuFind has now been use in our library for over one and half years.


    # Did you have any trouble implementing VuFind in your library?


    No, we didn''t have any trouble at implementing VuFind in our library. It was
    all quite straightforward and we didn''t have any problems. The major part was
    to make some changes to our LMS.


    # What was the process of switching from proprietary to open source like?


    We didn''t have much of a process in switching over to VuFind. As our LMS isn''t
    a proprietary system, we use Evergreen, which is an open source ILS. Our main
    concern during the process of switching was our clients and how they would find
    the new OPAC, but we found we didn''t have to worry, because our patrons found
    VuFind easier to navigate than our existing OPAC and really like the interface.
    Our patrons gave us loads of feedback, which helps us identify things we could
    improve on, and they continue to do so.


    # Did you have any help installing, migrating to, or setting up VuFind?


    No, we didn''t have much help installing, migrating to, or setting up VuFind.
    But we did refer to the VuFind website quite a bit if we didn''t understand a
    particular part during the process.'
