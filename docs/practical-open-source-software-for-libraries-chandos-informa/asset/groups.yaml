    - 开源软件是为读者提供“更多”……更多选项、更多服务等的绝方法。我们在公共互联网电脑上安装了 Firefox 为读者提供选择，同样为了配合 Microsoft
    安装了 OpenOffice。我使用 Firefox 作为我的主要浏览器，因为……我想给更多图书馆提供开源软件，特别是那些面临预算削减的图书馆。


    - 另见我们的网站 http://meadvillelibrary.org/os 获取我们在多次会议上做的演示信息、我写的文章等。


    - 关于开源的“成本”的信息不足。软件/代码是免费的，但确实存在与使用和维护相关的成本。


    - 我很想用开源替代 Microsoft Office，但需要更多员工时间来说服习惯了 MS 的读者（大多数人经验有限，对他们来说改变很难）。我在公共电脑上尝试过
    Firefox，但发现它并不适合那个环境。但是我私选的浏览器……比 IE 好得多。


    - 在决定使用 Drupal 之前，查看了几个替代的 CMS（内容管理系统）选项：Joomla、Plone 和 Alfresco。如果你想了解图书馆中的 Plone，我建议咨询
    Plinkit Collaborative 的人员，网址为 http://www.plinkit.org/（他们中的一些也曾在过去的 Code4Lib 上做过演讲，可以查看会议存档）。


    - 过去几年，目睹了开源运动在图书馆中爆发并成为主流。许多开源程序拥有如此繁荣的用户社区，对程序进行持续的改进和更新，使其成为同类中的最佳——例如 Firefox！ILSs
    似乎也朝着这个方向发展，在未来几年中观察这将会非常有趣！


    # 附录 1 调查结果


    - 这只是我的个人经验，我确定这不是这里使用的软件的完整清单。


    - 我们学校实际上没有图书馆，也没有建立图书馆的计划。我教技术，觉得我的工作之一是作为教学技能资源、验证信息以及通往互联网信息的某种门户。


    - 抱歉，我甚至不知道免费源码是什么意思。我是多米尼根大学的研究生，我觉得我应该知道它的意思是……


    - 对于没有技术专员的小型图书馆来说，系统的支持是一个问题。


    - 我对开源事物最大的问题是通常获取帮助非常困难。


    - DokuWiki 作为我们员工的微内网非常好用，而 Request Tracker 让处理请求变得容易得多。


    - 我喜欢开源的想法。然而，Joomla 用起来很困难。我希望其他开源软件不要那么困难。


    - 我认为开源很棒，但我为一个拥有75个成员的联盟图书馆工作，他们目前对探索它感兴趣。


    - 我们幸运有一位极其优秀且精通的网络管理员，他在网络上安装了 Ubuntu 并为我们定制了 Koha。作为一家小型公共图书馆的院长，我无法抽出时间自己学习这些操作。


    - 我们目前正在转换为 Koha，我尝试通过阅读许多博客来保持对开源的知识，所以我是一个门外者，尽管真的是一个信者。Koha 将成为我们五个图书馆的 LMS
    系统，所以我们学得很快。


    - 我认为使用开源是图书馆领域的一个趋势。在预算有限且需求增加的情况下，开源是图书馆的很好的解决方案。


    - 我们的图书馆属于一个小型政府机构，软件类型波动剧烈。我们每四年举行选举，导致新的管理和不同的办事方式。首先，IT 负责人是一个巨大的微软粉丝。实际上与微软自己进行了一些前沿开发。下一任
    IT 负责人非常**开源**是政府开源的倡导者之一。然后，天平摆了回来，我们再次变成了微软商店，但我们听从指挥，不创新也不要求任何东西。一碗微软粥就够我们吃了。好运！


    - 随着开源使用的增加而产生的原型供应商支持模式的报酬，将如何演变成我们非常熟悉的：专有的、公司拥有和开发的、封闭的、昂贵的……


    - 我想使用开源软件，但法院对安全非常严格，这本该如此。


    '
