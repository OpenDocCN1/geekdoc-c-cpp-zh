    ## 7.2 现实世界中的开源媒体：Scribus


    Clay Fouts，Lion & Serpent 编辑

    Sekhet-Maat Lodge，代表美国波特兰 Ordo Templi Orientis


    你们为什么决定在组织中使用 Scribus？


    由于预算限制以及我们许多成员的意识偏好，我们倾向于使用 FOSS [自由开源软件] 项目来满足技术需求。我们的网站整合了 MediaWiki、Apache、MySQL、WordPress
    以及其他软件包来管理和交付内容。


    当我们需要桌面出版软件时，这种趋势持续下去。我们对适当色彩管理、高质量字体渲染和矢量图形的需求，使我们在 Scribus 和 TeX 之间做出了选择。虽然
    TeX 的描述性语言和成熟度吸引了我们程序员的思维，但我们认为 Scribus 的图形界面以及与其他桌面出版（DTP）软件的相似性会让未来的其他人更容易上手这项工作。


    # 你们在组织里是如何使用 Scribus 的？


    我们最初开始用它制作我们的期刊《Lion & Serpent》的排版。然而，自从用于该目的之后，我们也用它来设计各种印刷材料，包括名片、仪式礼拜等。


    # 你们在组织中使用 Scribus 多久了？


    九个月。


    # 你们在组织中实施 Scribus 时遇到过困难吗？


    它仍然年轻，所以功能不如 InDesign 丰富。因为更强大的功能位于新的开发版本中（我们目前使用 1.3.5.1 版本），我们往往也会遇到不稳定性和前沿软件中常见的偶尔
    Bug。不过，我没有遇到过任何致命障碍。


    # 从专有软件转向开源的过程是怎样的？


    我们之前的排版人员使用 Adobe 的 InDesign，而没有工具可以将用于创建早期期刊卷的文件转换为 Scribus 格式。这意味着我们多程度上必须从头开始，在新格式中重建了我们的模板集。


    ## 7.2 Scribus


