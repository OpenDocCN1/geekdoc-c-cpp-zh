- md: '

    -   I am very interested in this topic. I am glad to see someone looking into
    it.


    -   There is much more training available for MS applications and other commercial
    applications. I want training in Joomla, and probably others that I don''t even
    know about.


    -   I facilitate the New Services Committee. It was our committee''s recommendation
    to install GIMP.ORG on one media PC at all locations, if the branch manager wanted
    it. We do have a concern about no control over what the customer edits on the
    program. It was recommended because it is cost effective. We also provide a tutorial
    CD for each PC where the software is installed.


    -   Open source is great although I was surprised how little I was actually using
    at home. I''ve only been into open source for a year, so I still have a lot of
    stuff I use because, well, I''m familiar with it.


    -   We''ve looked at open source ILS systems, but do not have the expertise to
    adopt them yet (also must meet accessibility requirements of California).


    -   This is really cool idea. I''ve always been thinking about how libraries and
    open source go in hand.


    -   Our library is currently working on getting Drupal up and running as our CMS
    [content management system], but we hit few bumps in the road so it''s taking
    longer than we hoped.


    -   In Indonesia, there are a software that use in library, named Senayan, you
    can see it in http://senayan.diknas.ac.id.


    -   Open source definitely has its place in the library and in other areas as
    well. Too often, people who would otherwise support the implementation of an open
    source


    ## Practical Open Source Software for Libraries


    solution are turned off by over zealous supporters who make claims for open source
    that are questionable. Like most things in life, there needs to be a balance between
    things that can reasonably be supported in an open source model and those things
    which do require a commercial/proprietary solution. In many cases, which model
    to choose over the course of time and it''s the tricky part in making a decision
    between open source or not.


    -   Good luck on the project! I hope it helps lead to wider acceptance of open
    source software.


    -   I''ve been the netbook market a little bit because my father travels a lot
    and I think this is a market that will flourish with open source OS. Also, I use
    the Google phone that is powered by Android, which is an OS that they are trying
    to configure for netbooks. I thought Google''s video where they go into Times
    Square and ask people What is a Browser? was very telling... of course most people
    aren''t using Firefox, chrome or browsers products? As more people learn about
    open source products, more people will use this. I introduce a lot of patrons
    to OpenOffice and Firefox.


    -   Open source is awesome. It would be great to discuss how teach and advocate
    open source somewhere.


    -   Good luck! Please don''t give up in this endeavor. Many libraries are looking
    for open source products to better utilize their OPACS. We do not want to be forced
    into going with OCLC''s WorldCat.local... Thanks!


    -   It should be noted I don''t think open source is always the necessarily ''best
    solution.'' There are times that proprietary software does have the best solution.
    However, frequently it hits that sweet spot of cost, controllability, and enough
    of the needed feature set. The trade off is figuring out the problem is often
    difficult (but usually can be solved, with closed source you just have to walk
    away), things can be in a rough state, and depending on distro updates seem to
    have a higher level of risk than some other closed source. The list of open source
    software I use is huge. Just thought of another, imagemick. I suppose if you really
    want a list I can dump my packages, although that will not tell you some of the
    stuff I''ve compiled from source...


    -   I would like to explore and use more open source applications in the library,
    but our director is not convinced there is enough support available. There is
    also a concern about the compatibility of MS Office 2007 with OpenOffice. As other
    libraries in Michigan move to Evergreen as a cost savings, I hope we also move
    in that during our current Siris/Dynix system is riddled with bugs and inconsistencies.
    As Evergreen has proven itself in GA and other states for many years as a stable
    and accurate system and I hope more libraries look open source software as a viable
    alternative to commercial system software.


    -   Take a look at our open source search engine ''Summa'' at http://www.statsbiblioeket.dk/summa.
