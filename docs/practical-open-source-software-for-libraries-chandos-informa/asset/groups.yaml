    ## Community and open source


    The best person to do a job is the one who most wants to do that job; and the
    best people to evaluate their performance are their friends and peers who, by
    the way, will enthusiastically pitch in to improve the final product, simply for
    the sheer pleasure of helping one another and creating something beautiful from
    which they will all benefit.¹¹


    Open source is about so much more than the code and the programmers; it is also
    about the community and the power of the crowd to produce amazing products. Every
    successful (the key word ''successful'') open source project is backed by a community
    of developers and application users who keep it alive and kicking. While there
    are ways to make money from working on open source, you''ll find that many of
    these community members perform their duties to keep learning and share knowledge
    out of a love for the product and a sense of obligation to the community.²


    Peter Lawyer covers the variety of motives that open source developers have:


    Some contribute source code because it helps them with their day job. Some stay
    up all night writing code because they''re obsessed. Some consider it an act of
    charity, a kind of noblesse oblige. Some want to fix bugs that bother them. Some
    want fame, glory, and the respect of all other computer programmers. There are
    thousands of reasons why new open source software gets written...³


    In his chapter on Geek culture, Russell Pavlice tries to help us understand the
    motives of open source community. He reminds us that if we are going to understand
    open source we have to understand the people and the culture behind it.⁴


    ## Working for open source


    As professionals, we are all familiar with hierarchy and corporate structure.
    It is this knowledge that makes it hard to understand.


    Open source communities are self-governing and self-organizing because there are
    no executives in charge of the direction. It is important to remember that when
    a feature arises, it will be submitted for the community.


    Audric Mockus points out that many open source projects are built by large numbers
    (hundreds or even thousands) of volunteers. The main differences often mentioned
    are the following:


    - Work is not assigned; people undertake the work they choose.

    - There are no rules governing, but once you become an active member you learn
    open source communities follow a series of unwritten rules, no matter what project
    they are working on.


    ### Rule 1: Communication is key


    As most open source projects are worked on by a community, it is key that everyone
    communicates. Without frequent communication, projects may end up having more
    than one developer implementing a feature instead of working together. In fact,
    as Clay Shirley opens, mailing lists never sleep. One way open source communities
    communicate is by sharing ongoing development (via bug databases, forums, wikis,
    and so on) so that everyone knows what is being worked on and time isn''t wasted
    with multiple people working on the same thing.³


    ### Rule 2: Honesty is essential (or speak your mind)


    If community members cannot be open and honest with each other things are going
    to get missed and projects can fail. Pavlice gets it right:


    > In a world where people are constantly exchanging ideas, evaluating concepts,
    and suggesting enhancements, it is vitally important that everyone speak the truth
    as it sees. If someone fails to speak the truth, the process of creating software
    will be greatly impaired.⁸


    This goes hand in communication; if a developer isn''t completely honest with
    the community it can cost the project hundreds of wasted hours in development
    and planning and, since many open source developers work on these projects in
    their spare time, this can be devastating.


    ### Rule 3: Respect each other


    In any community, there are bound to disagreements, but it is important to keep
    in mind that respect is essential to working together successfully. As is true
    with most communications, it is important to keep emotion out of messages sent
    to community members and realize that not everyone thinks the same way that you
    do. With freedom to develop comes freedom to disagree


    ### Rule 4: Everyone can be a teacher


    In order open source communities to grow, new members need to be taught the ropes.
    I speak from personal experience when I say that it can be very scary to jump
