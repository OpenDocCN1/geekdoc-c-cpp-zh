    -   I spoke as myself and not on behalf of the library I work at.


    -   The most difficult thing in the case of Koha: maintaining (upgrading) and
    keeping up with new releases is challenging. The other thing is the cost of supporting
    Koha that companies demand is very high. It is beyond our budget. There is no
    support for Koha in Africa. The nearest is India.


    ## Practical Open Source Software for Libraries


    -   At work we usually work with MS Office, as most documents we receive are PDFs
    or MS Office documents. At work OpenOffice is not used so often. At home I only
    work with OpenOffice, unfortunately this is ok as it does all I need. Internet
    Explorer unfortunately is used in our new library software; usually at work we
    use Firefox. OPUS is a software used for our publication server, MILES does the
    same, it is used for special purposes.


    -   It''s shocking to see that you didn''t list NewGenLib in one of the open source
    products. I hope you know all of the developments in this sector.


    -   I think, it''ll be useful to make easier any Linux / open source software.
    Thus, easibility factor need to be improved.


    -   I am a big supporter of open source software. Currently the university is
    involved with OLE (Open Library environment) project for creating an open source
    IL. I took part in the initial workshops for creating the system, however my job
    duties have changed and I am not as involved.


    -   I hate dealing with licenses.


    -   I love hearing about others'' experiences with open source ILSes, and really
    hope our library consortium considers open source options if/when we switch ILs.


    -   I''ve encouraged the use of open source software whenever possible. The cost
    of support is not overwhelming if you have a technically inclined person on hand.
    I find the use of Linux, Apache and PHP for a web server to be the easiest to
    maintain and set up.


    -   Most institutions are not supportive of moving off the Microsoft track even
    if staff is willing to go to open source, so we are stuck with MS products.


    -   Our library is looking into cheap, less powerful alternative to Photoshop®.


    -   I love the idea of open source. When it comes to library applications, we
    just don''t have the manpower – we have a half position devoted to systems, the
    person in it is by necessity a librarian first, techie second, and he doesn''t
    have the time to learn and support open source.


    -   I would love to be able to use more open source solutions here at the library
    (and suggest them often to admin), we have been realizing that open source isn''t
    entirely free of cost – it requires staff time and money, which we are lacking.


    -   Our academic library is psyched to use open source software... the trouble
    is getting our IT folks on board.


    -   It''s important to distinguish different kinds and qualities of open source
    projects. There is enormous variability.


    -   Events, like budget shortfalls, usually force libraries into innovative behavior.
    Like accountants, library managers believe that anything free is not without the
    price. No one ever got for buying ContentDM or Encore. The open source desktops
    have become as good or better than Windows, but few libraries try to reap savings
    by using KDE or XFCE. General open source software can easily be tweaked or customized,
    but few librarians or IT support people have the skill sets needed to do it well.
    Specialist open source for libraries will require a support component that is
    not free. Open source will not be accepted in libraries until their masters in
    state and local government begin to use and believe in open source, but, like
    responsible health care policy, we have yet to accept any European innovations
    in the workplace.

