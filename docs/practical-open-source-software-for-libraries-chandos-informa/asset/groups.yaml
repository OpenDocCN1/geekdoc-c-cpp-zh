  - '[PAGE 35]


    # Debunking the myths


    In my years working in the open source community, I have heard nearly every excuse
    why people are not using source. Some of these excuses are specific to libraries
    and others can be applied to any community worldwide.

    Apache runs 52.32 per of active websites¹ and Firefox is the web browser of choice
    for 30.71 per of the world''s population. So, whether or not librarians realize
    it, nearly every information organization is using open source software in some
    way.


    # Homegrown is not open source


    When it came time to automate the card catalog, some libraries decided to try
    building their own systems. These systems did what the library needed, but staff
    changes in the library made it clear that homegrown systems were too much. The
    problem was that libraries built systems that only they knew how to run and update;
    if libraries thought to release their code on the internet and work with other
    libraries, the open source integrated library system would probably be the standard
    today.

    It is this memory that stops many libraries from trying open source applications
    (particularly open source integrated library systems). It is very important to
    make it clear that open'
  - '[PAGE 36]


    source software often starts out as homegrown, but has moved on levels past that.
    A homegrown system only has those in the home organization to manage and maintain
    it. A successful open source system has an entire community behind it.


    # How can it be any good if it''s free?


    As stated earlier chapters, people often assume that open source software is free
    of cost. Many administrators have been known to take this misconception one step
    further and refuse to use open source for fear that free software surely cannot
    be as good as other costly options. Assumptions like these are another reason
    that adoption of open source software in libraries hasn''t been as widespread
    as in other arenas.


    So, how do you combat a misconception that is so widespread we see it in all areas
    of our lives? We''ve all heard, at one time or another, in retail outlets asking
    why one product is cheaper than another, what''s the difference, what is missing
    from the cheaper product? It''s not easy to convince an entire culture that free
    can be just as good – if not better – than the more pricey alternatives.


    The fact, as we''ve already learned, is that not all open source software is available
    for free and even if you do receive the software without a monetary payment, there
    will always be a time contribution necessary to make the switch. That alone won''t
    convince people, of course, but it bears mentioning in order to keep people educated
    on the topic.


    The best way to debunk this particular myth (and others like) is to provide real
    examples and experience. Michael Tiemann points to a study reported in ACM Transactions
    on Software Engineering and Methodology in 2002, which examines the success of
    big name open source projects, like Apache, Mozilla and Linux:'
- md: '

    As empirical data examined so exquisitely by CMU Professor James Herbsleb et al.³
    suggests, a long tail of software developers helps complex systems like Apache
    and Mozilla achieve functional milestones faster, with fewer defects, which are
    fixed more rapidly than comparable proprietary software development projects.
    This empirical evidence proves precisely the same result predicted by game theory
    models developed by Harvard Business School Professor Carliss Baldwin: free software
    provides a better architecture and a better economic (reward) for development
    and innovation than proprietary regimes under a wide range of circumstances. In
    2009 these findings were further corroborated by Red Hat had secured to join the
    S&P 500 index less than 10 years after its IPO. Open Source software development
    enables a new, viable, and robust model for digital recovery.


    # Security and open source


    Like the concern that free software cannot be as good as expensive software, the
    common myth that open source software options are not as secure as their proprietary
    counterparts is not based in fact, but in fear. Studies have shown that despite
    people''s belief that open source software is less secure than proprietary software,
    open source software is often just as secure and sometimes more secure.


    Brian Krebs, who has been writing for The Washington Post about technology and
    computer security since 2000, did an independent study in 2006 that showed Internet
    Explorer (IE) was insecure for 284 of 365 days, versus Firefox (the closest open
    source competitor), which was insecure for only nine days that year:


    For a total 284 days in 2006 (or more than nine months out of the year), exploit
    code for known, unpatched critical flaws in pre-IE7 versions of the browser was
    publicly available on the Internet. Likewise, there were at least 98 days last
    year in which no software fixes from Microsoft were available to fix IE flaws
    that criminals were actively using to steal personal and financial data from users...
    In contrast, Internet Explorer''s closest competitor in terms of market share
    – Mozilla''s Firefox browser – experienced a single period lasting just nine days
    last year in which exploit code for a serious security hole was posted before
    Mozilla shipped a patch to remedy the problem.⁵


    It is also important to note that both Firefox and Internet Explorer are free
    of cost, but only Firefox is open source.

    As mentioned in Chapter 1, Apache, the open source web server, is used by nearly
    half of all websites.⁶ This is not simply because Apache is free of cost; it has
    to do with the security inherent within the tool, ease of use and of course the
    features it provides.


    # Not worth the risk


    In addition to the fear that open source software is insecure comes the argument
    that open source carries with it too many risks. This always make me chuckle a
    little, because what software does pose some sort of risk these days? We work
    in a world where computers hold all of our personal information, our memories,
    our work histories, our financial status and so much more. We trust computers
    and the software on those computers to keep our lives in order, and when you think
    about it – that’s pretty damn risky!


    The question then comes down to what risks are associated with open source software
    that you are not seeing in the proprietary world? The answer is none. In fact,
    I''d argue (and others have done the same) that open source actually carries less
    of a risk that many proprietary options.


    One of my favorite quotes regarding the risk of open source comes from Casey Coleman,
    chief information officer for the US General Services Administration (GSA) in
    2008. Coleman says, ''You get more transparency and interoperability, that reduces
    your risk.'' She also mentions the fact that by choosing open source the GSA is
    not tied to contracts with proprietary vendors, giving them all the flexibility
    that that implies.


    In a time when our economy is in flux and companies are being out by venture capitalists
    and other companies, there is no guarantee that the software you are using will
    be supported next year. Moving to open source you know that will always be able
    to use the software, even if the company you were paying for support is bought
    out or closes its doors. You also have the freedom to hire independent developers
    to help with customizations and upgrades.


    # Notes


    - 1. ''January 2010 Web Server Survey.'' Netcraft, January 7, 2010. http://news.netcraft.com/archives/2010/01/07/january_2010_web_server_survey.html.

    - 2. ''Top 5 Browsers from Jan 09 to Feb 10.'' StatCounter Global Stats, February
    19, 2010. http://gs.statcounter.com/#browser-ww-monthly-200901-200102-bar.

    - 3. Mockus, Audris, Roy Fielding, and James Hersbleb. ''Two Case Studies of Open
    Source Software Development: Apache and Mozilla.'' ACM Transactions on Software
    Engineering and Methodology 11, no. 3 (July 2002): 309–346.

    - 4. Tiemann, Michael. ‘From Free to Recovery.’ Open Source Initiative, September
    28, 2009. http://www.opensource.org/node/471.

    - 5. Krebs, Brian. ‘Internet Explorer Unsafe for 284 Days in 2006.’ The Washington
    Post: Security Fix, January 4, 2007. http://blog.washingtonpost.com/securityfix/2007/01/internet_explorer_unsafe_for_2.html.

    - 6. ‘January 2010 Web Server Survey.’ Netcraft, January 7, 2010. http://news.netcraft.com/archives/2010/01/07/january_2010_web_server_survey.html.

    - 7. Quoted in Jackson, Joab. ‘GSA Makes the Case for Open Source.’ Government
    Computer News, April 16, 2008. http://gcn.com/blogs/tech-blog/2008/04/gsa-makes-the-case-for-open-source.aspx.


    # Open source and libraries


    It has been suggested that libraries are almost ethically required to use, develop
    and support open source software.^1 The parallels between the rules of librarianship
    and open source are easy to spot just by comparing the open source definition
    (and/or the free software definition) to the rules set forth by nearly all library
    associations. Both organizations center their rules on freedom of use and free
    access to information, a fact that even non-librarians notice:


    > Librarians espouse many of the same ideals that drive the free software community.
    They collaborate and communicate; they work to share the results of their work
    with one another. They understand freedom and feel that it''s an important value.
    That more librarians aren''t actively using and evangelizing free software is
    an indictment against us for not letting them in secret.^²


    The Code of Ethics of the American Library Association states, We protect each
    library user''s right to privacy and confidentiality with respect to information
    sought or received and resources consulted, borrowed, acquired or transmitted.³
    Simply put, members of the American Library Association should deliver information
    to their patrons without prejudice and without asking what the patron Practical
    Open Software for Libraries intends to use the information for or with whom they
    plan to share it. Eric Lease Morgan puts it another way when comparing open source
    communities to libraries:


    There are many aspects of open source software which are akin to the principles
    of librarianship. First and foremost in my mind is the expected use of the deliverable
    – none. In the first case, the deliverable is software. In the second, it is data
    and information. In both cases, there are very few expectations in regard to what
    a person does with the information. You are free to use and modify the program
    in any way you desire... It is none of my business why you wish to know the answer
    to this particular reference question or borrow that book.⁴


    Parallel is just one of the reasons why so many libraries have been producing,
    adopting and promoting open source in recent years. That said, there are still
    many misconceptions regarding open source software that have slowed library adoption.


    # Library budgets


    One of the most obvious reasons for libraries to consider open source as an alternative
    to their current systems is shrinking budgets. Open source software usually has
    no or low cost to entry and ownership.³ Because of the nature of the open source
    license, most open source applications offer a way for software users to demo
    the product without any limits on time frame or any fees.


    Once you have decided to go with an open source product, there is no need to buy
    licenses for every computer.

    '
  mdcn: '

    正如卡内基大学 James Herbsleb 教授等通过精细审查的实证数据所示³，长尾软件开发者群体帮助 Apache 和 Mozilla 等复杂系统更快地实现功能里程碑，缺陷更少，且修复速度也比同类专有软件开发项目更快。这一实证证据充分证明了哈佛商学院
    Carliss Baldwin 教授开发的博弈论模型所预测的相同结果：在广泛范围内，自由软件比专有体制提供了更好的架构，并为开发和创新提供了更好的经济（奖励）。2009
    年，这些发现得到了红帽公司（Red Hat）的进一步证实，该公司在 IPO（首次公募）后不到 10 年就成功加入了标普 500 指数。开源软件开发为数字恢复提供了一种全新的、可行且稳健的模式。


    # 安全与开源


    正如人们担心自由软件没有昂贵的软件好，关于“开源软件选项不如其专有对应品安全”的常见迷言也并非基于事实，而是出于恐惧。研究表明，尽管人们认为开源软件没有专有软件安全，但事实上开源软件的安全性往往与之相当，有时甚至更安全。


    自 2000 年起一直为《华盛顿邮报》编写技术和计算机安全的 Brian Krebs 在 2006 年进行了一项独立研究，显示 Internet Explorer
    (IE) 在一年 365 天中有 284 天是不安全的，而 Firefox（最接近的开源竞争对手）在当年仅有 9 天是不安全的：


    2006 年共有 284 天（或一年中超过九个月的时间），针对浏览器在 IE 7 之前的版本中已知且未修补的关键漏洞的利用代码在互联网上公开可用。同样，去年至少有
    98 天，微软没有提供任何软件修复程序来修复 IE 的漏洞，而犯罪分子正积极利用这些漏洞从用户处窃取个人和财务数据……相比之下，市场份额上接近 Internet
    Explorer 的对手——Mozilla 的 Firefox 浏览器——去年仅经历了一个持续 9 天的时期，在 Mozilla 发布补丁修复问题之前，一个严重安全漏洞的利用代码被发布。⁵


    同样重要的是，Firefox 和 Internet Explorer 都是免费的，但只有 Firefox 是开源的。

    正如第 1 章提到的，开源服务器 Apache 被几乎近一半的网站使用⁶。这不仅仅是因为 Apache 免费；它还与该工具固有的安全性、易用性以及它所提供的功能有关。


    # 不值得冒险


    除了对开源软件不安全的恐惧外，还有观点认为开源带有太多的风险。这总是让我付之一笑，因为现如今什么软件会不产生某种风险呢？我们生活在一个计算机承载着我们所有的个人信息、记忆、工作历史、财务状况等多的世界里。我们信任计算机以及计算机上的软件来维持我们生活的井条紊，你想想——这其实相当危险了！


    那么问题在于，开源软件关联了哪些你在专有世界中并看不见的风险？答案是：没有。事实上，我认为（其他人也持有相同观点）开源携带的风险实际上比许多专有选项更小。


    关于开源风险，我最喜欢的引言之一来自 2008 年美国通用服务管理局（GSA）的首席信息官 Casey Coleman。Coleman 表示：“你获得了更多的透明度和互操作性，这降低了你的风险。”她还提到，通过选择开源软件，GSA
    不受限于与专有供应商的合同，这赋予了他们所有所暗示的灵活性。


    在我们经济处于动荡、公司被风险投资和其他公司淘汰的时代，无法保证你正在使用的软件明年仍能支持。转向开源，你知晓将永远能够使用该软件，即使你支付支持费的公司被收购或关门。你还有权聘佣独立开发者来帮助进行定制和升级。


    # 注释


    - 1. ''January 2010 Web Server Survey.'' Netcraft, 2010 年 1 月 7 日. http://news.netcraft.com/archives/2010/01/07/january_2010_web_server_survey.html.

    - 2. ''Top 5 Browsers from Jan 09 to Feb 10.'' StatCounter Global Stats, 2010
    年 2 月 19 日. http://gs.statcounter.com/#browser-ww-monthly-200901-200102-bar.

    - 3. Mockus, Audris, Roy Fielding, and James Hersbleb. ''Two Case Studies of Open
    Source Software Development: Apache and Mozilla.'' ACM Transactions on Software
    Engineering and Methodology 11, no. 3 (July 2002): 309–346.

    - 4. Tiemann, Michael. ‘From Free to Recovery.’ Open Source Initiative, 2009 年
    9 月 28 日. http://www.opensource.org/node/471.

    - 5. Krebs, Brian. ‘Internet Explorer Unsafe for 284 Days in 2006.’ The Washington
    Post: Security Fix, 2007 年 1 月 4 日. http://blog.washingtonpost.com/securityfix/2007/01/internet_explorer_unsafe_for_2.html.

    - 6. ‘January 2010 Web Server Survey.’ Netcraft, 2010 年 1 月 7 日. http://news.netcraft.com/archives/2010/01/07/january_2010_web_server_survey.html.

    - 7. 引自 Jackson, Joab. ‘GSA Makes the Case for Open Source.’ Government Computer
    News, 2008 年 4 月 16 日. http://gcn.com/blogs/tech-blog/2008/04/gsa-makes-the-case-for-open-source.aspx.


    # 开源与图书馆


    有人建议图书馆在伦理上有义务使用、开发和支持开源软件¹。图书馆与开源之间的相似之处很容易发现，只需将开源定义（或或自由软件定义）与几乎所有图书馆协会的规则进行对比即可。这两个组织都以自由使用为核心，事实甚至非图书员也能注意到：


    > 图书员推崇与自由软件相同的许多理念。他们协作和交流；分享他们的成果。他们理解自由并认为这是一项重要的价值观。图书员没有积极使用和宣传自由软件，是对我们的一种指责。²


    美国图书馆协会的道德准则规定，我们保护每个用户对寻求或接收、咨询、借阅、获取或传输信息的隐私和机密性③简单来说，美国图书馆协会的成员应该向其读者传递信息，而不询问
    Practical Open Software for Libraries 打算如何使用这些信息或与谁分享。Eric Lease Morgan 用另一种方式解释了开源社区与图书馆的关系：


    开源软件的许多方面与图书馆的原则相似。我脑中首要考虑的是交付物的预期用途——无。在第一情况下，交付物是软件。在第二种情况下，它是数据和信息。在这两种情况下，对于人们如何处理这些信息几乎没有预期。你可以按照自己的任何意愿使用和修改程序……你为什么想知道这个特定参考问题的答案或借阅那本书与我无关。⁴


    # 图书馆预算


    图书馆考虑开源作为其现有系统的替代方案的最明显的原因之一是预算缩减。开源软件的入门和拥有成本通常为零或很低由于开源许可证的性质，大多数开源应用程序为软件用户提供了演示产品的方法，没有任何时间限制或费用。


    一旦你决定使用开源产品，就不需要为每台计算机购买许可证。

