    # Open source web access


    There isn''t a day that goes by librarians do not have to access the internet
    in one way or another. We have research to do online, reference questions to answer
    via email and books to buy from our vendors online, and just as our computers
    do not need to use proprietary software, so too is proprietary software unnecessary
    for us to access the web.


    # Open source web browsing


    If you were to make the switch to only one open source application in this book
    (and I hope that is not the case), Firefox (http://www.firefox.com) is for you
    (see Figure 6.1). Firefox has taken the web browser from being a way to read web
    pages to being a way to interact fully with the web. The power of Firefox lies
    in its open source architecture; because anyone can see how Firefox works behind
    the scenes, they can easily expand it by writing add-ons and suggesting overall
    code improvements.


    As with most open source applications, Firefox is also known for being able to
    address bugs and security leaks by releasing minor updates between release cycles.
    One of the greatest, and most misguided, concerns library administrators have
    about switching to Firefox is security.


    A study done in 2006 by Brian Krebs of Security Fix (http://voices.washingtonpost.com/securityfix/)
    showed that for at least 98 days of 2006 ''no software fixes from Microsoft were
    available to fix [Internet Explorer] flaws that criminals were actively using
    to steal personal and financial data from users.''¹ In contrast, there was a single
    period of only nine days that Firefox was left without a patch to a serious security
    hole.


    With data like this it becomes hard to believe that Firefox is less secure than
    Internet Explorer. As part of its default framework, Firefox includes security
    functionality such as pop-blocking, anti-malware, anti-phishing, parental controls
    and private browsing. If that''s not enough, you can extend Firefox to include
    more protection for yourself and your patrons.


    # 6.1 Open source in the real world: Firefox


    Greg Johnson, Digital Initiatives and Systems Librarian

    Governors State University

    University Park IL, USA


    **Why did you decide to use Firefox in your library?**


    We had too many problems with Internet Explorer crashing. Plus students seem to
    like it better.


    **How are you using Firefox in your library?**


    We made Firefox the default internet application for use on all the library computers.


    **How long have you been using Firefox in your library?**


    About one year.


    **Did you have any trouble implementing Firefox in your library?**


    It took a little while for students to stop looking for the ubiquitous Internet
    Explorer icon, but after that, we have not had any problems.


    **What was the process of switching from proprietary to open source like?**


    Easy.


    **Did you have any help installing, migrating to, or setting up Firefox?**


    Since it comes from out of the download fully loaded and ready to go, all we needed
    to do was set the main library page as the home page and image it out to all the
    computers.


    **What do you think of Firefox now?**


    It is one of the best browsers available for personal computers.


    **What do others in your library say about Firefox?**


    Largely, librarians are not fans of Firefox. Other technical staff members prefer
    to use either Firefox or Google Chrome, both open source options.


    In addition to the efficient development process and built-in security, Firefox
    also offers many useful add-ons to increase privacy, security and overall efficiency.
    These are just a few of the reasons why libraries have been switching public stations
    (if not all of the computers in the library) to use Firefox as the default browser.
    Of thousands of available add-ons, my favorite is AdBlockPlus (http://adblock.plus).
    AdBlockPlus blocks early every day on the web from loading in your browser. Another
    way to protect yourself is by preventing scripts from running without asking you
    first. One add-on that many librarians use FlashBlock (https://addons.mozilla.org/en-US/firefox/addon/433),
    which prevents all Flash scripts from running in your browser without first clicking
    a ‘play’ button. Another add-on that prevents scripts from running is with NoScript
    (https://addons.mozilla.org/en-US/firefox/addon/7722). Once installed, NoScript
    prevents executable content from running without your express permission.


    To find more security add-ons for Firefox you can browse through its security
    add-ons sections (https://addons.mozilla.org/en-US/firefox/browse/type:cat12).


    # Expanding Firefox


    Figure 6.1 Firefox browser


    ![](img/4e1ec39c661a9fa73febd901135781ce_67_0.png)


    I mentioned earlier that Firefox has grown to be so much more than a web browser;
    it can also work to assist you with your research. One popular tool among libraries
    is LibX (http://libx.org).


    LibX is an open source browser toolbar that you can customize to help patrons
    (and staff for that matter) find library resources while browsing. Once the LibX
    toolbar it puts a search box for the library catalog at the top of the user''s
    browser (no need to visit the library catalog website).


    # 6.2 Open source in the real world: LibX


    Chris Keene, Technical Development Manager

    University of Sussex Library

    Brighton, East Sussex, UK


    **Why did you decide to use LibX in your library?**


    Interested interesting and decided to set it up when I had a free hour or so.


    **How are you using LibX in your library?**


    We have a public LibX toolbar which is not very well promoted. It can search our
    local catalogue (we use two, Aquabrowser and Talis Prism), online journals and
    link resolver, and allows campus to reload a page via EZproxy. It also searches
    the local public library catalogue, which we had some good feedback on.


    In addition we have a staff tool; this was in part to streamline our reading lists.
    Staff can right click on a book title or ISBN and search our catalogue and, more
    importantly, Coutts Oasis (a book supplier online ordering system which links
    in to our library management system - EDI Quotes – creates orders). We use OCLC''s
    xISBN a lot so that staff can right click on an ISBN and find out we have that
    book in stock regardless of edition and so on. We are currently trying to integrate
    xISBN and Coutts Oasis.


    **How long have you been using LibX in your library?**


    We had a public toolbar for a couple of years but have only recently started to
    use it.


    **Did you have any trouble implementing LibX in your library?**


    The configuration website is very good, but does have some quirks. Getting to
    it has been slow. We had no real problems.


    **What was the process of switching from proprietary to open source like?**


    I wouldn''t say it a switch. It wasn''t a key need, I came across it, spent a
    few hours setting it up, showed a couple of people and quietly made it public,
    refining it then. We already use open source applications (EPrints) and infrastructure
    (Apache) and so on and would certainly use it again for other needs (for example
    VuFind).


    **Did you have any help installing, migrating to, or setting up Firefox?**


    No, but the help on the website was good. And I come from a computer science background.


    **What do you think of LibX now?**


    Fantastic and very useful. I would like to see it developed further.


    **What do others in your library say about?**


    The staff love it, especially those in our resources departments (reading lists,
    acquisitions, cataloguing) who are always under pressure to improve their efficiency.
    It has proved a time saver. Users seem to like it too, though we have had little
    feedback. I do wish it provided usage statistics per library, on the number of
    downloads and so on.

    '
