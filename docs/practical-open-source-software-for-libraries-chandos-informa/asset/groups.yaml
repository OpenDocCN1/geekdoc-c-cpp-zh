    searches, the average internet user is a fan of the Google model, also known as
    keyword searching. All of these tools take into account. In fact, Scriblio and
    Blacklight offer a single search box option, so there is no advanced search.⁵
    SOPAC offers a slightly more advanced search page and VuFind offers a traditional-looking
    library advanced search page. Although the search systems are all different, they
    all offer the option to filter your results by various different headings and
    item types, making it easy to narrow your results down to the right subset of
    items.


    In addition to the simple search interfaces, all of these options offer permanent
    links to bibliographic records and search results. This means that as a librarian
    you can copy the URL from the address bar in your browser and send it to a patron
    via email or instant message and when the patron clicks the link it will take
    them to the same screen you were looking at. This is something that is slowly
    becoming standard in the traditional OPAC, but is not yet widespread.


    All of these options also take into account modern web features such as RSS feeds
    and commenting. VuFind and SOPAC2 go a step further and allow patrons to add tags.
    SOPAC2 also allows patrons to add ratings and reviews to records in the catalog.
    All of this extra data is then stored outside the integrated library system so
    as not to interfere with librarian-supplied data, while still giving the patrons
    a sense of belonging to the library in more ways than one.


