- md: '

    ## Content management


    Now that you can upload files to the web, you need something to upload. Many libraries
    have been choosing to use a content management system to design their library
    sites. A content management system is almost like a website in a box; it has everything
    you need to build and maintain your website without any formal training or development
    skills. There are currently two popular open source content management systems
    in the library world: Joomla (http://www.joomla.org) and Drupal (http://www.drupal.org).
    Your basic content management system provides you with the necessary tools for
    creating pages for your site without having to know HTML or any other programming
    language.


    ## 8.2 Open source in the real world: Joomla


    Jason Griffey, Head of Library Information Technology

    Lupton Library, University of TN at Chattanooga

    Chattanooga TN, USA


    **Why did you decide to use Joomla in your library?**


    We are in the midst of a website redesign, the decision for a content management
    system came down to either Joomla or Drupal. The decision to use Joomla was driven
    by the fact that it was easier for a single, part-developer (me) to create a theme
    and move the content into. Drupal is great, but was out of my reach given the
    time constraints. Joomla was much faster to develop.


    **How are you using Joomla in your library?**


    We are using Joomla to drive our library''s website, with the exception of our
    database page and catalog.


    **How long have you been using Joomla in your library?**


    We''ve been fully on Joomla since early 2007.


    **Did you have any trouble implementing Joomla in your library?**


    Other than time constraints, no. Being an academic library, there was of course
    a committee involved, but I was able to discuss the benefits of open source and
    convince anyone who doubted.


    **What was the process of switching from proprietary to open source like?**


    Very easy. Detail oriented, but overall the process was a smooth one.


    **Did you have any help installing, migrating to, or setting up Joomla?**


    Nope, the development, installation and so on was all done by me. The rest of
    the librarians helped with the migration, but we had no outside help.


    **What do you think of Joomla now?**


    I still prefer it to our old, flat-file solution, but it has its issues. The way
    it deals with content and menus can be non-intuitive for those not used to developing
    on Joomla. But it''s still a robust platform.


    **What do others in your library say about Joomla?**


    Mostly they are happy with it. There are some problems with the creation of entirely
    new sections of the site... updating existing information is easy, but the creation
    of new sections can be non-intuitive.


    ## Open source on the web


    With Drupal, the different areas of the site are broken into ''tasks'' and ''modules''
    (see Figure 8.2). A task is essentially the function of the page, what the page
    does. A module is more than a section of the site, for example ''Events'', ''Blog'',
    or ''User''. In Joomla content is sorted into ''Menus'', ''Content'', and ''Components''
    (see Figure 8.3). Each of these areas houses sections of the site that you are
    able to alter and customize. Of the two, to navigate, but both could use a librarian''s
    touch. In the end, both have their strong points and weak points; my recommendation
    is to try out using the demos on the openopensource website (http://opensourcecms.com)
    to find the one that works for your needs.


    To see what these tools can do, both Joomla and Drupal maintain showcases of sites
    using their product (http://community.jooomla.org/showcase/ and http://drupal.org/cases).


    > Figure 8.2 Administration area on GPLLA.org, which is powered by Drupal


    ![](img/4e1ec39c661a9fa73febd901135781ce_107_0.png)


    ## Practical Open Source Software for Libraries


    ### Figure 8.3 The Joomla administration area


    ![](img/4e1ec39c661a9fa73febd901135781ce_108_0.png)


    ## 8.3 Open source in the real world: Drupal


    Paula Gray-Overtoom, Information Systems Librarian

    Monroe County Public Library

    Bloomington IN, USA


    **Why did you decide to use Drupal in your library?**


    We wanted to have a content management system for our intranet. We were using
    Macromedia/Adobe Contribute with templates to guide staff in creating content,
    but it just wasn''t dynamic enough. We wanted to be able to have staff blogs for
    different departments and allow all staff to contribute to the intranet. With
    Drupal we didn''t have to worry about being able to afford licenses for all of
    our staff.


    **How are you using Drupal in your library?**


    We are using Drupal for our intranet. We have departmental blogs, post documents
    and staff meeting information. It is the way we communicate within and between
    service areas.


    **How long have you been using Drupal in your library?**


    We have had Drupal installed for about a year, but have only moved all staff to
    it our new intranet face for about a month.


    **Did you have any trouble implementing Drupal in your library?**


    It took a while for me to learn how to install modules and other technical aspects
    of Drupal, but the online documentation is good and very accessible. Staff picked
    up on Drupal very quickly. We had one-hour training sessions for most staff to
    go over the basics of updating their account information and posting blog entries.
    Staff have transitioned to Drupal with very few issues. Most of them are really
    happy that they can now edit pages without having to use Utilize.


    **What was the process of switching from proprietary to open source like?**


    We use open source for our web server anyway, so the transition for Drupal was
    pretty easy. We were behind in our version of Contribute anyway because of the
    licensing fees, so it was much better to be able to move to an up-to-date piece
    of software. From using Red Hat, I was already going to go online to find answers
    to my problems and actually found that I like that better than having to go to
    a proprietary company with the hope that they will be responsive to my needs.


    **Did you have any help installing, migrating to, or setting your Drupal?**


    I set up Drupal on my own.


    **What do you think of Drupal now?**


    I really like it. It works well for our needs and usually when I have a software
    need, I search through the contributed modules for Drupal and find a module that
    does what I want. I think that one of the most interesting.


    ## Practical Open Source Software for Libraries


    parts of open source is that someone is always developing something to fill a
    need.


    **What do others in your library say about Drupal?**


    Everybody seems to like it. Some staff weren''t about it at first, but I''ve gotten
    really positive feedback. Staff are glad that they are able to easily search the
    site and find what they need.


    **Anything else you want to know about Drupal or your process of switching to
    Drupal?**


    Drupal really does work great for an intranet. We have been to create books for
    various manuals that keep documents organized, use forms for sending work requests
    to IT or facilities, and communicate easily with blogs. A recent popular addition
    to the Drupal showcase is the official White House website (http://www.whitehouse.gov),
    A more obvious pairing is the use of Joomla by Linux.com (http://www.linux.com)
    because of its source focus.


    New on the library content management front is MaiaCMS (http://maiacms.org), designed
    by the Howard County Library system in Maryland, USA. MaiaCMS was designed by
    and for librarians making it a very promising option for library websites. I have
    worked with both Joomla and Drupal and my only complaint is that the administrative
    user interface seems more complicated than it needs to be. This is why MaiaCMS
    is so exciting to me; it is a tool designed by librarians for librarians, so the
    menu system is nicely and easy to navigate (see Figure 8.4), and modules that
    librarians need are part of the standard install instead of available solely as
    plugins.

