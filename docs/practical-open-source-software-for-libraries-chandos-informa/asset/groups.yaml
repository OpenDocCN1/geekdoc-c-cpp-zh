    be very scary to make the switch. This is why I use VirtualBox (http://www.virtualbox.org/)
    to test operating operating systems before making the switch. On my one (and only)
    computer I have the ability to work in five different operating systems, concurrently
    or at different times (see Figure 5.2).'
  - '[PAGE 52]


    # Practical Open Source Software for Libraries


    ### Figure 5.2 Four operating systems open in VirtualBox


    ![](img/4e1ec39c661a9fa73febd901135781ce_52_0.png)


    VirtualBox allows you to create multiple virtual machines that make use of your
    primary machine hardware while running different software applications. This means
    that you can install VirtualBox on Windows or Mac OS and then install Ubuntu on
    it to learn how to use a different operating system before making a blind switch.
    It also means that if you switch to Ubuntu you can still run Windows or Mac OS
    using VirtualBox.


    This would allow libraries that teach classes to teach patrons to use multiple
    operating systems running the machines in the library. As Heather mentions in
    her summary of VirtualBox, this is not the kind of application that you will use
    all of the time, but it is a great time and saver.'
  - '[PAGE 53]


    # Open source for day to day operations


    # 5.2 Open source in the real world: VirtualBox


    Heather Braun, Technology Librarian

    Northeast Kansas Library System

    Lawrence KS, USA


    # Why did you decide to use VirtualBox in your library?


    The IT department and many of the staff have used Macs, but we still need to be
    able to have ready access to Windows work, except because of the libraries we
    provide technology to support and work with PC-based. BootCamp would work we wanted
    to use Mac and PCs (and other operating systems) side by side. BootCamp is a one-system
    solution. You can only run one at a time.


    Our network administrator, Liz Rea, needed to be able to run multiple virtual
    servers in the background on her Mac. Initially, we purchased licenses to the
    Parallels software, but the program turned out to be clunky, slow and buggy. When
    launching the software, our computers would freeze for 10 minutes and other members
    hated it. New versions were available but we often required a reboot. We hated
    it and other staff hated it we didn''t want to keep paying for upgrades to the
    software every time a new version was released, especially when the software never
    worked well to begin!


    Then we found VirtualBox. We already use a lot of open source software at NK (Koha,
    WordPress, Firefox and OpenOffice), and so VirtualBox was a natural fit for us.
    It just works for the times we need it. No freezing or rebooting necessary.


    # How are you using VirtualBox in your library?


    We use it to emulate Windows, Linux flavors and Linux server flavors on Macs.
    Liz Rea uses it to run a test system of Koha on her iMac so that she can do some
    testing and figure out the system.'
  - '[PAGE 54]


    # How long have you been using VirtualBox in your library?


    We''ve been using VirtualBox for about a year now. We don''t use it a lot, maybe
    once or twice a month, but it''s quite helpful when we need it.


    # Did you have any trouble implementing VirtualBox in your library?


    No deploying the software itself. Deploying the operating systems within VirtualBox
    can be easy or difficult. It depends on the version, and how good VirtualBox''s
    drivers are for different operating systems. [Author''s note: Both Windows and
    Ubuntu are supported and easy to install]


    # What was the process of switching from proprietary to open source like?


    The process was easy. No license keys to keep track of or buy (for the emulating
    software anyways; still needed license keys for the Windows operating systems).
    VirtualBox ran much faster than Paralle ever did, especially on startup. And,
    the support on the VirtualBox discussion boards (http://forums.virtualbox.org)
    was great. Usually a question I had already been asked there.


    # Did you have any installing, migrating to, or setting up VirtualBox?


    Nope. The only place I consulted was the VirtualBox website and the discussion
    forums.


    # What do you think of VirtualBox now?


    Love it. I wouldn''t want it to be the way I would heavily use Windows, but for
    the times I quickly need to look at Windows or test out a stripped Windows disk
    or a Linux flavor, it works great. I know it can also be used within Linux and
    Windows, but I have never used it that way so far.'
  - '[PAGE 55]


    # What do others in your library say about VirtualBox?


    Liz Rea, the NEKLS System Administrator, loves it, as well. She''s the only other
    person using it at this time.


    Anything else you want to know about VirtualBox or your process of switching to
    VirtualBox?


    If you''re a Mac user and have that one Windows app you must always use, as it''s
    not to system-intensive, check out VirtualBox instead of keeping around a Windows
    computer just for one application, if you need to test Linux, but don''t have
    extra hardware lying around, try using VirtualBox to emulate those Linux flavors.


    # Office suite


    Once you have installed your operating system you need an office suite to help
    with your documenting and calculating needs. Ubuntu .openoffice comes with the
    OpenOffice suite (http://www.openoffice.org) already installed. If you are not
    using Ubuntu you can still use OpenOffice because there is a version for every
    major operating system.


    | 5.3 Open source in the real world:

    | OpenOffice |


    Kate, Volunteer, Management Collective

    Feminist Library

    London, UK


    Why did you decide to use OpenOffice in your library?


    I must admit, this was mostly a financial decision. We are a small, volunteer-run
    library and a software license for commercial office software wasn''t really an
    option. We'
  - '[PAGE 56]


    # Practical Open Source Software for Libraries


    discussed an online office suite but our internet access can be a bit temperamental
    and didn''t really want access to be a prerequisite for access. We toyed with
    the idea of installing Linux on some of the older PCs in the office, but weren''t
    ready for that step just yet. Using a cross-platform suite leaves that open for
    later.


    # How are you using OpenOffice in your library?


    We use OpenOffice for most administrative work conducted in the Feminist Library.
    Recently, as we have moved our catalogue to a library management system and are
    in the midst of a big cataloguing project, we have been creating an index of parts
    of the collection and using CALC spreadsheets to convert data into MARC records
    to import to the new catalogue.


    # How long have you using OpenOffice in your library?


    Basically, since we''ve revived the library in mid 2008, I''m not sure whether
    it was used in previous incarnations of the library before I became involved.


    # Did you have any trouble implementing OpenOffice in your library?


    Some slight glitches with file names when sharing documents with other organizations
    but the interface for OpenOffice is very user friendly and our formatting needs
    aren''t particularly complex. So, while not all the volunteers are as geeky as
    others, there have been precious troubles with implementation and everyone adjusted
    easily.


