    # 针对图书馆的实用开源软件


    本书的重点不在于深入探讨开源的历史——关于这一点，你可以参考许多优秀绝伦的著作——但我认为，至少谈论开源历史中的某些里程碑式事件是非常重要的，这可以让你对开源和自由软件周围的理念有更深层次的理解。


    # 解决手痒（Scratching at an itch）


    开源应用通常始于开发者“顺手而为”，或者解决一个可能困扰着他们或同事的问题。大多数应用程序最初都是由个人或一个小本地小组启动的项目，旨在解决某个存在 Bug
    的问题。在这些项目中，最著名的可能过于 Linux 的发明。


    那是 1991 年，来自芬兰的学生林纳斯·托瓦尔斯（Linus Torvalds）正试图寻找一个可以在他的个人电脑上运行的操作系统。当发现没有什么能满足他的需求时，他决定自己写一个操作系统，实际上就是一种在“顺手而为”。在完成工作（仅仅是为了满足自己的需求）后，林纳斯将他的操作系统（后来被称为
    Linux）发布给了他的黑客们，以收集意见、建议，甚至可能获得一些改进产品的帮助。这个项目最初只是一个爱好，现在已成为当今世界上最知名、被报道最多且最受欢迎的开源项目——而这一切都始于一次“手痒”。


    # 属于所有人的自由


    林纳斯将 Linux 发布给互联网上的每一个人，这导致了一个关于开源和自由软件的常见误解：认为“free（免费）”一词指的是价格。事实上，在 2009 年的一项调查中，36%
    的图书馆专业人士认为所有开源软件都是免费的。虽然确实存在免费成本的开源应用，但这并不是开源和自由软件许可协议要求的。目前有 60 多种此类许可证，但其中两种占了所有开源软件的近
    90%：GNU 通用公共许可证（GPL）和伯尔恒软件分发版（BSD）。


    GPL 开头声明，“free”一词指的是“自由（freedom）”而非价格：


    “大多数软件和其他实用作品的许可协议设计目的是是为了剥夺你分享和更改作品的自由。相比之下，GNU 公共许可证旨在保证你分享和更改程序所有版本的自由——使其对所有用户都保持为自由软件。我们，自由软件基金会在大多数软件中使用
    GNU 通用公共许可证；它也适用于作者以这种方式发布的任何其他作品。你也可以将其应用于你的程序。”


    当我们谈论自由软件时，我们指的是自由，而不是价格。我们的通用公共许可证旨在确保你有自由分发自由软件副本的自由（如果你愿意，可以为此收取费用），确保你有权获得源代码或在想要时获取它，确保你可以更改软件或在新的自由程序中使用它的部分，并且你清楚自己正在做这些事情。⁸


    GPL 由自由软件基金会（http://fsf.org）编写。这里需要注意的是，开源软件和自由软件软件的定义之间存在某些差异。尽管有这些差异，就本资源而言，两者可以互换使用，因为我同意斯考特·科洛德（Scott
    Colord）所说：“从实际应用角度来看，它们在图书馆或信息科学环境中提供了相同的基本优势（以及挑战）。”⁹ 事实上，这就是为什么许多作者在谈论自由和/或开源软件时会使用
    FOSS 或 F/OSS 缩写。


    虽然本书后面讨论的所有应用程序都可以免费下载，但重要的是，选择开源应用时可能会产生货币成本。


    ## 1.1 自由软件的定义


    自由软件关乎用户运行、复制、分发、研究、更改和改进软件的自由。更准确地说，这意味着程序的用户拥有四种基本的自由：


    - 为任何目的运行程序的自由（自由 0）。

    - 研究程序如何工作并对其进行更改以实现你意图的自由（自由 1）。访问源代码是此的前提条件。

    - 重新分发副本的自由，以便帮助你的邻居（自由 2）。

    - 改进程序的自由；并将你的改进（通常是修改版本）发布给公众，以便整个社区受益（自由 3）。访问源代码是此的前提条件。


    > 来源：Free Software Foundation, Inc., The Free Software Definition, 2009, http://www.gnu.org/philosophy/free-sw.html.


    ## 1.2 开源软件的定义


    ### 引言


    开源不仅仅意味着可以访问源代码。开源软件的分发条款必须符合以下标准：


    - 1. 免费重新分发

    许可不应限制任何一方作为包含来自不同来源程序的聚合软件分发的组件来销售或赠送软件。许可不应就此类销售收取版税或其他费用。


    - 2. 源代码

    程序必须包含源代码，并且必须允许以源代码形式和编译形式进行分发。如果产品的某些部分未随源代码分发，则必须有一种广为人知的方式可以获取源代码，且成本不高于合理的复制成本，最好是通过互联网免费下载。源代码必须是程序员修改程序时的首选形式。不允许故意混淆源代码，但允许将中间形式作为输出。


    - 3. 派生作品

    许可必须允许修改和派生作品，并允许其按照原始软件相同的条款进行分发。


    - 4. 作者源代码的完整性

    只有在许可允许它们携带不同的名称或版本号时，许可才可能限制源代码以修改后的形式分发。


    - 5. 不歧视个人

    许可不得歧视任何个人或群体。


    - 6. 不歧视努力领域

    许可不得限制任何人在特定领域制作该程序。例如，它不能限制程序用于商业领域，或将其用于研究。


    > 来源：Free Software Foundation, Inc., The Free Software Definition, 2009, http://www.gnu.org/philosophy/free-sw.html.


    # 针对图书馆的实用开源软件


    本书的重点不在于深入探讨开源的历史——关于这一点，你可以参考许多优秀绝伦的著作——但我认为，至少谈论开源历史中的某些里程碑式事件是非常重要的，这可以让你对开源和自由软件周围的理念有更深层次的理解。


