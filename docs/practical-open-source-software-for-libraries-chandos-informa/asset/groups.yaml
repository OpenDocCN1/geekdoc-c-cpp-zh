    (http://open-ils.org)。除了这两个，还有许多其他值得关注的小项目。


    # Koha


    Koha 的开发始于 1999 年的新西兰。新西兰 Horowhenua 图书信托（http://www.library.org.nz）的成员决定，在外包集成图书馆系统开发后，他们希望将代码开源，供全球所有图书馆使用。2000年1月，Koha
    的第一个版本发布¹¹十年后，该系统在全球已有至少 945 家图书馆在使用。²


    ## 11.5 现实世界中的开源：Koha


    Owen Leonard，Web 开发人员

    内尔逊维公共图书馆

    美国俄亥俄州内尔逊维


    **你为什么决定在你的图书馆中使用 Koha？**

    当我们开始对正在使用的 ILS（集成图书馆系统）产生疑虑时，我们开始研究开源图书馆系统。我们对收到的支持质量感到失望。我们希望升级该系统，但他们告诉我们，如果想这样做，必须花费数千美元购买新硬件。


    与此同时，我们还兴趣通过 OPAC（在线公共检索目录）向公众提供额外服务，并使用数据库中的数据。遗憾的是，这两者我们都无法轻松实现：没有自定义 OPAC 内容或外观的选项，也无法使用
    MySQL 等常用工具连接到系统的数据库。


    当时，Koha 是可用最成熟的开源 ILS，其社区也非常活跃且乐于助人。当我们查看为了切换到该系统而它必须满足的服务列表时，Koha 并没有满足所有要求，但我们知道自己有能力将其变成我们想要的样子。


    ## 你们在图书馆是如何使用 Koha 的？


    我们使用了 Koha 的所有功能，仅有几个例外：采购、连续期刊管理和原始书目编目。从历史角度来看，采购和连续期刊管理不是我们之前付费的商业 ILS 的组成部分，因此我们在迁移到
    Koha 时，工作流并未包含这些方面。然而，随着 Koha 中连续期刊管理的改进，它作为我们的一种可行解决方案正变得越来越具有吸引力。


    ## 你们在图书馆使用 Koha 多久了？


    我们于 2003 年 9 月 2 日正式上线 Koha。


    ## 你们在图书馆实施 Koha 时遇到“困难”了吗？


    无论我们在实施 Koha 时遇到了什么“困难”，我们都是在充分理解任务的情况下面对的。当我们决定迁移到 Koha 时，软件尚未达到 2.0 版本。我们知道在切换之前，我们必须赞助添加
    MARC 支持。我们知道我们将不得不手动进行一些数据导入，并修复一些漏洞。


    ## 从专有到开源的切换过程是怎样的？


    从专有供应商系统切换到开源系统的过程是正确的决定。我们当时使用的软件并不方便我们导出数据。当需要导出某些数据时，我们尝试使用系统中的某一个工具，但它并不起作用。我们联系了供应商询问为什么它坏了，他们告诉我们：“你付钱是让我们开启那个功能的。”


    适用于图书馆的实用开源软件


    ## 你们在安装、迁移或设置 Koha 时有得到任何帮助吗？


    我们都是由内部员工完成的，并经常得到 Koha 邮件列表和 IRC 通道的支持。


    ## 你们现在觉得 Koha 怎么样？


    Koha 对我们来说继续运行良好。我们非常喜欢直接访问数据库来执行自定义报告。能够发现漏洞、开发修复程序并提交包含在下一个版本中，这种感觉非常有授权。我喜欢我们可以在
    OPAC 上展示自己的内容，并对其进行自定义以匹配我们的网站。


    ## 你们图书馆的其他人对 Koha 怎么看？


    成为 Koha 的经历教会了许多员工，我们有权修改自己的软件。员工们会向我报告漏洞并帮助诊断问题，因为他们知道我们实际上可以改变现状。这与那种生活在专有供应商之下、担心报告永远不会被听到的的心态相比是一个巨大的转变。


    ## 关于 Koha 或你们迁移到 Koha 的过程还有什么想知道的吗？


    我们从专有供应商系统到 Koha 的迁移完全不典型：我们是美国第一个使用 Koha 的公共图书馆，我们付出了很多努力才使其运行起来。我认为这项工作为今天采用
    Koha 的图书馆铺了道路。软件的改进以及专业 Koha 托管和支持公司的出现，使得迁移到 Koha 的过程在精力投入上与迁移到任何其他 ILS 都无异。


    我们今年学到的是，迁移到 Koha 后，我们处于更好的位置，可以选择我们需要的付费支持。现在 Koha 支持市场上出现了多种选择，使用 Koha 的图书馆不再受限于单一供应商的支持和开发。这对于一个对供应商不满的图书馆来说，这是一个巨大的改变。对于专有
    ILS，更换供应商意味着更换 ILS，这需要一次全面的迁移。如果你正在使用 Koha 且没有得到理想的支持，你有权选择另一家支持公司。知道自己拥有这种选择权是非常令人振奋的。


    与许多传统的图书馆系统不同，Koha 是完全基于 Web 的。在当前版本中，Koha 提供了运行所需的许多模块访问权限：读者管理、编目和借阅。还有报告和工具可以帮助流程自动化。


