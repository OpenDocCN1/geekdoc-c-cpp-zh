    blogs almost daily and now writes books on the subject. Her insatiable appetite
    for knowledge and her desire to make the world a better place make her an excellent
    teacher; her enthusiasm rubs off on all around her.


    In this book, which is almost like her journey, Nicole takes us through learning
    what open source is, and tells us what it isn''t by examining and debunking some
    of the more popular myths around it. The book then leads into how libraries can
    make the best use of open source, with chapters packed full of concrete and real
    world examples. Each chapter builds on the rest and by the end you will come away
    with a much deeper understanding of what FOSS is, and why we love it so.


    ## Chris Cormack


    Christopher Cormack has a BSc in Computer Science and a BA in Mathematics and
    Maori Studies. While working for Katipo Communications, he was the lead developer
    of the original version of Koha, which went live at Horowhenua Library Trust on
    January 5, 2000. Since then he has served various roles in the community as release
    manager, QA manager and currently translation manager. Christopher believes in
    free software, and allowing users the freedom to innovate.


    ## About the author


    Nicole C. Engard is the Director of Open Source Education at ByWater Solutions.
    She directs the company''s open source education endeavors. In addition to her
    daily responsibilities, Nicole keeps the library community up to date on web technologies
    via her website, ''What I Learned Today...'' (http://www.web2learning.net).


    Nicole''s interest in library technology started at the Jenkins Law Library in
    Philadelphia where she worked as the Web Manager. In addition to her web development
    experiences, Nicole has worked as a Metadata Librarian and librarian trainer.
    For her innovative uses of technology in libraries, Nicole was named one of Library
    Journal''s Movers & Shakers in 2007.


    Nicole received her BA in Literary Studies and Computer Programming from Juniata
    College in Huntington, PA, and her MLIS from Drexel University in Philadelphia,
    PA. She is also an active member of special library associations.


    Nicole has been published in several library journals and has also written chapters
    for *Thinking Outside the Book: Essays for Innovative Librarians* and *Writing
    and Publishing: The Librarian''s Handbook*, both edited by Carol Smallwood. In
    2009 she published her first edited work, *Library Mashups: Exploring New Ways
    To Deliver Library Data, with Information Today Inc.*


    You can reach Nicole via email at nengard@gmail.com.


    ## About the website


    This book comes complete with its very own website. The website will be used to
    keep readers up to date with open source news, book events and updates to software
    mentioned within.


    More importantly, every link listed in this book will be available on the website.
    This means that you will not have to type every link you find in the following
    chapters. Simply visit http://opensource.web2learning.net and click the live link
    there.


    Should you find anything you think should be posted to the book''s website, feel
    free to email the author at nengard@gmail.com.


    ## Acknowledgements


    No book is written without the support of many. I''d first like to thank Chris
    Cormack for introducing me to the world of open source; without him this book
    would have been written by some other librarian.


    I''d also like to thank the entire open source library community; without your
    contributions and help this book wouldn''t be the useful guide that I now think
    it is. Lastly, I thank my husband, Brian, for his support while I spent endless
    nights and weekends researching and writing.


    xxi


    ## Introduction


    My introduction to open source software came from one of the original developers
    of the Koha (http://koha-community.org) open source integrated library system,
    Chris Cormack. It was for this reason that I asked him to write the foreword for
    this book, so that he could see how much he taught me and share in educating future
    librarians about the true nature of open source software.


    As library budgets worldwide are sliced, librarians look for ways to slim down
    their spending. It is for this reason that libraries are interested in learning
    more about open source software. What they may not realize is that while open
    source software comes without license fees, and will likely save them money, open
    source software is about so much more than a price tag.


    As Chris taught me, open source is about openness, sharing and collaboration.
    It is a philosophy as much as a method of software development. As future chapters
    will elaborate, in the beginning all software was open source; all software was
    developed in the open and distributed for free among friends and colleagues. The
    traditional software license that we are used to dealing with libraries and our
    homes does not take the form that the first developers envisioned for the future
    of software.


    Knowing this is not enough though. It is my contention that it is essential for
    libraries to embrace the philosophy behind open source and follow through by participating
    in open source communities. Over the years I have seen many libraries adopt open
    source applications, but continue to act as though it were a proprietary system.
    Using open source software is a rule changer. You no longer need a vendor''s approval
    to add a feature to the system, you no longer have to depend on any one vendor
    for support, and you no longer get to work in your own library bubble.


    What do I mean? Well, as I said, open source software is about community and that
    means the only way an open source application can survive is if there is an active
    community behind it. This community can be made up of any combination of developers,
    software users, testers and manual writers.


    One misconception that librarians (and many others) have is that to participate
    in an open source community they must know how to write code; this is not the
    case. No software application can make it into production if it hasn''t first
    been tested, and who better to test the software than someone who plans to use
    it daily? No software application is easy to use without well-written documentation,
    and who better to write that than someone who has learned to use the software
    the hard way? And no software application without well-organized menus and navigation
    will be considered user friendly; who better to tell people how to organize things
    than a librarian?


    Librarians have a lot to give to open source software and I hope that after reading
    this book you will be excited about what you learned that you will jump in and
    start to communicate with others who are using and developing open source software
    to find out how you can participate.


    This book is broken into two sections. The first will give you a brief overview
    of the history and definition of open source software. It includes facts and statistics
    to combat the fear, uncertainty and doubt (often referred to as FUD) that surround
    open source and explain why open source software and libraries make the perfect
    fit. The second section will provide you with a toolbox of open source applications
    that are being used in libraries right now. Each of these applications will include
    a first-hand story from a librarian who is using the application regularly. I
    hope that these insights will help you decide if an application is right for you.


    When you are finished with this book you will be able to speak to your colleagues
    about open source software and make practical suggestions for software improvements
    in your library. Remember that not every application is right for every library,
    but you should be able to come away with a few that will make your workflow more
    efficient or enable you to provide better services to your patrons.


    ## What is open source?


    The Open Source Initiative defines open source software as software that is distributed
    with human readable source code in order to allow the user freedom to run, review,
    alter, enhance and modify the code for any purpose. But open source is about much
    more than just the code behind the software; it''s about community, collaboration
    and innovation.


    In today''s world of competing products it might be hard to believe that all applications
    were open source. Donald Rosenberg explained it well when he said that ''open
    source is not a new way of doing things – it is the original computer way of doing
    things.'' At the same time Eric Raymond reminds us that enthusiasts, artists,
    tinkerers, problem solvers and experts known as ''hackers'' built the internet,
    World Wide Web, Unix and Linux. Contrary be a hacker is not to be a menace, but
    to be a computer programmer. This is an important distinction to make early on,
    since many open source developers proudly call themselves hackers.


    Before the internet was ARPANet, a transcontinental network only accessible to
    the US Department of Defense, universities and contractors. This invention brought
    together hackers from all over the country to collaborate over the network and
    create applications to make their lives (and eventually all of our lives) easier.
    It was this connection that brought about the development of many of the world''s
    first open source applications.

