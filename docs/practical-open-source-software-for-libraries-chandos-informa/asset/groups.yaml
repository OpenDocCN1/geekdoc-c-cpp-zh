    About this Guide

    This guide provides resources to help you learn more about open source software
    in libraries.


    So, how do you choose between the two and the many other alternatives available?
    Try them out; both offer the option to try a demo. See which one best meets your
    library''s needs. As with many of the open source products mentioned in this book,
    SubjectsPlus (http://groups.google.com/group/subjectsplus) and Library à la Carte™
    (http://carte.library.oregonstate.edu/forum) also offer online communities where
    users and developers can communicate with each other about problems, suggested
    uses and future developments; use them to assist in your decision making process.
    As stated before, the process of choosing an open source application is no different
    from that of choosing a proprietary option; you must research and try the products
    before making a final decision.


    ## Additional research tools


    Having a dynamic way to manage subject guides is just the first step in providing
    better services to our patrons; we also have many other research tools in our
    library that we would like to make accessible to our patrons via our websites.
    reSearcher (http://researcher.sfu.ca) is a suite of tools to do just that.


    ## 10.3 Open source in the real world: reSearcher


    Dan Hoyte, Senior Library Systems Technician

    Chapman University Leatherby Libraries

    Orange CA, USA


    **Why did you decide to use reSearcher in your library?**


    Several factors went into the decision. Primary was the fact that we wanted finer
    control over our data. Secondary was the need to implement ERM. We were able to
    accomplish those goals and save the university 60 per cent of the cost of our
    previous system.


    **How are you using reSearcher in your library?**


    Subject librarians are using it to create and manage course assignment pages and
    subject guides. Instruction librarians are using it to build tutorials. We are
    currently utilizing the link resolving (GODOT), knowledge base (CUFTS) and electronic
    resource management. Our production system is run by Simon Fraser University.
    We also maintain a local backup testing server.


    **How long have you been using reSearcher in your library?**


    We have been using reSearcher for nearly three years.


    **Did you have any trouble implementing reSearcher in your library?**


    We found setting up reSearcher was actually easier than setting up some of the
    proprietary packages that we tested.


    **What was the process of switching from proprietary to open source like?**


    The data that we had to move from our proprietary system into simply reformatted
    and uploaded to reSearcher. The most difficult part of the process was shifting
    the attitudes of library management to allow us to use open source. The technical
    side went smoothly.


    **Did you have any help installing, migrating to, or setting reSearcher?**


    Other than having the networking group set up our firewall, we did the entire
    implementation within the library (local server),


    **What do you think of reSearcher now?**


    The more that we use reSearcher, the more we like it. It was amazing how well
    it fitted our needs. Since we have been able to help steer some of the development
    it is even more in tune with the way that we work.


    **What do others in your library say about reSearcher?**


    They are most impressed with the way that reSearcher answered the difficulties
    that we were experiencing with our previous system. They are pleased with the
    control that we have now over our data.


    **Anything else you want to know about reSearcher or your process of switching
    to reSearcher?**


    Just that we are well pleased with the choice to go with reSearcher. We are looking
    forward to moving to our own server, in the next couple of years.


