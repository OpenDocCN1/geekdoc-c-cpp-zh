    It was 1991, Linus Torvalds, a student in Finland, was trying to find an operating
    system that would work on his PC. When nothing met his needs, he decided to write
    his own operating system, in effect, scratching his itch. After completing his
    work (only to meet his needs), Linus released his operating system (later to be
    known as Linux) to his hackers, to gather comments, suggestions and maybe even
    get some help improving the product. This project, which started as a hobby, has
    grown to be the most well-known, most written about and most popular open source
    project on the web today – and it all started with an itch.


