    tool, it does take a bit of learning to figure out how to best create a survey
    for your library, but the documentation for the product is outstanding and very
    easy to follow.


    Using LimeSurvey you can set up surveys to ask your patrons what they think about
    the library, what they want to see from the library, or just what their favorite
    types of books or movies are. It also offers you the ability to create polls in
    multiple languages, allowing you to reach a wider audience. As the application
    is run from your own server, you can control the look of the surveys as well as
    the time the survey remains available for answering.


    # Improving day to day services


    The applications in this chapter are all meant either to replace applications
    you may be spending too much time and money on to provide your library with a
    service that you maybe didn''t think you could afford before. Libraries worldwide
    are making the switch to open source for applications such as these, to provide
    patrons with improved services and the staff with functionalities they would not
    be able to afford otherwise.


