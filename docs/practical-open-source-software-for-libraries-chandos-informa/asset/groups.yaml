- md: '

    # What was the process of switching from proprietary to open source to OSS?


    The transition to OpenOffice was pretty straightforward as the basics of word
    processing and other productivity software are quite similar. Plus, some of us
    were already using it at home or in other projects, which helped make the transition
    easier. OpenOffice has also proved to be a stepping stone to other F/OSS and I
    now feel how our move towards open source is an ethical as well as a financial
    choice for us.


    # Did you have any help installing, migrating to, or setting up OpenOffice?


    My role at the library is mostly as a volunteer librarian, so I look after the
    software installation, set up and maintenance. The only concern in migrating to
    OpenOffice was about migrating older documents in proprietary file formats that
    didn''t prove much of a problem.


    # What do you think of OpenOffice now?


    I still think it''s great and don''t see a reason to go back to proprietary software.
    The way we work depends so much on portability and a non-centralized approach
    (for want of a better description) that we can''t really rely on being able to
    access our files only on one type of computer, in one set of circumstances. And,
    as I mentioned before, I think OpenOffice is a great first step in the world of
    F/OSS.


    # What do others in your library say about OpenOffice?


    Everyone in the management collective is happy using OpenOffice and more of us
    use it at home now too, it wasn''t such a big shift. It takes a bit of time to
    adjust to a slightly different interface but hasn''t proved a problem. Volunteers
    at the library have varying degrees of interest and experience in the systems
    side of things, using free and open source systems has helped increase interest,
    if only a little bit.


    # Practical Open Source Software for Libraries


    OpenOffice is a complete office suite with word processing, spreadsheets, databases,
    image editing and presentations, all of which have menus that are very similar
    to other office suites (see Figure 5.3); this has the advantage of making the
    transition easy. With over 20 years of development before it, OpenOffice is extremely
    stable and full of great features.


    Like Ubuntu is an application that needs putting on their public stations to allow
    community members access to powerful applications without having to pay the license
    fees for each computer. It is also very easy to bring information from other office
    suites into OpenOffice because it can read and write out to several formats –
    one of my favorite features in OpenOffice is the ability to save a document as
    a PDF.


    ![](img/4e1ec39c661a9fa73febd901135781ce_58_0.png)


    48


    # Statistics and data gathering


    Many libraries find it useful to keep statistics of their day-to-day operations.
    In some libraries this is done with a piece of paper and a pen, others use a simple
    spreadsheet, and some use the open source Libstats (http://code.google.com/p/libstats/)
    application.


    ## 5.4 Open source in the real world: Libstats


    Kelly M. Broughton, Assistant Dean, Research and Education Services

    Ohio University Libraries

    Athens OH, USA


    Why did you decide to use Libstats in your library?

    We chose Libstats to facilitate and ease the effort of data collection, as well
    as work on standardization across a variety of service points.


    How are you using Libstats in your library?

    We use Libstats to track reference, technical and directional questions in the
    libraries (how many, how long, from which service point and via what communication
    method – person, email, phone, IM and so on).


    How long have you been using Libstats in your library?

    We began piloting in May 2009 and implemented it fully in summer 2009.


    Did you have any trouble implementing Libstats in your library?

    None that our techs couldn''t overcome.


    # Practical Open Source Software for Libraries


    > ### Did you have any help installing, migrating to, or setting up Libstats?


    Library IT and reference staff worked together on implementation and customization.


    ### What do you think of Libstats now?

    Nothing but good things.


    ### What do others in your library say about Libstats?


    Really easy! Desk students like it better than the hash marks we used to use.


    Libstats is a very simple application (see Figure 5.4) developed to help librarians
    keep statistics on reference queries and a knowledge base of frequently answered
    questions. Using the data stored in the Libstats database librarians can easily
    generate reports on the numbers of questions, where questions arrive from (email,
    phone, walk-in), and what types of questions are asked (general reference, database
    related, and so on).


    Another way to collect data is to survey your patron base. There are many popular
    web applications that can be used for this task, but there are limitations and
    costs associated


    # Adding a question to the knowledge base in Libstats


    # Library Stats Demo : Add Question


    | Location | Patron Type | Question Type | Time Spent | Format | Emails | Backdate
    |

    |---|---|---|---|---|---|---|

    | Reference Desk | Adult | Reference | < 5 min | key | | | |

    | Reference Desk | Faculty/Staff | Reference | < 10 min | phone | | | |

    | Reference Desk | Student | Reference | < 30 min | email | | | |

    | Question | Undergrad student | Technical | | | | | |


    ![](img/4e1ec39c661a9fa73febd901135781ce_60_0.png)


    50


    # 5.5 Open source in the real world: Limestats


    Vin Kwong, Head of Web Services

    Franklin D. Indiana University

    South Bend, USA


    Why did you decide to use Libstats in your library?

    Cost, flexibility.


    How are you using Libstats in your library?

    Currently, we use Libstats to collect information from students.


    How long have you been using Libstats in your library?

    More than a year; we started in August 2008.


    Did you have any trouble implementing Libstats in your library?

    Before the installation, I found that our server didn''t meet the system requirements.
    We were able to export data, but the issue was finally resolved by an upgrade.


    # Practical Open Source Software for Libraries


    ### Did you have any help installing, migrating to, or setting up Libstats?

    We got help from our campus department and the LimeSurvey forums when we installed
    the software.


    ### What do you think of Libstats now?

    We like LimeSurvey, but it would be better if the user interface for creating
    surveys were more intuitive.


    ### What do others in your library say about Libstats?

    The librarian who uses LimeSurvey regularly told me that it was easy to use.


    tool it does take a bit of learning to figure out how to best create a survey
    for your library, but the documentation for the product is outstanding and very
    easy to follow.


    Using LimeSurvey you can set up surveys to ask your patrons what they think about
    the library, what they want to see from the library, or just what their favorite
    types of books or movies are. It also offers you the ability to create polls in
    multiple languages, allowing you to reach a wider audience. As the application
    is run from your own server, you can control the look of the surveys as well as
    the time the survey remains available for answering.


    # Improving day to day services


    The applications in this chapter are all meant either to replace applications
    you may be spending too much time and money on to provide your library with a
    service that you maybe didn''t think you could afford before. Libraries worldwide
    are making the switch to open source for applications such as these, to provide
    patrons with improved services and the staff with functionalities they would not
    be able to afford otherwise.

