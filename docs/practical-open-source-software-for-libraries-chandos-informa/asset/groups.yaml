    # Open source research tools


    reSearch was developed by the Simon Fraser University Library to help lower the
    barrier of entry into the electronic resource management arena for small and poor
    libraries. The tools provided in the reSearch suite enable access to electronic
    resources without the usual license fees associated with services.


    Included in reSearch is CUFTS (http://researcher.sfu.ca/cfts) for serials management;
    GODOT (http://researcher.sfu.ca/godot), dbWiz (http://researcher.sfu.ca/dbwiz)
    for federated searching; and Open Knowledgebase (http://researcher.sfu.ca/openkb)
    to manage an open database of journal titles and publishers to be used within
    CUFTS (see Figure 10.4).


    Each of the tools included in the reSearch suite is meant to work in conjunction
    with the others to provide a better


    The CUFTS page for technology and operations management at the Simon Fraser University
    Library


    ![](img/4e1ec39c661a9fa73febd901135781ce_145_0.png)'
  - '[PAGE 146]


    service to all involved. Kevin Stranack writes in his amazing

    overview of the reSearcher suite:


    From its earliest days, reSearcher and its predecessors

    relied upon the cooperative spirit of libraries, their

    innovation and leadership, and their willingness to

    pool their limited resources, both in terms of staff and

    money, to create better technologies and services for

    the clients. The collaborative spirit of reSearcher

    continues today, with the ongoing support provided by

    the two major library consortia, COPPUL and BCELN,\sand the willingness of individual
    libraries to provide

    startup funding for new initiatives that will enhance the

    project and ultimately benefit the wider library

    community. reSearcher is an important example of the

    value of both open source and library collaboration.¹


    To learn more about the suite and how each module

    interacts with the others, I highly recommend you to read

    Kevin''s article and some of the others listed on the official

    reSearcher site (http://researchers.sfu.ca/documents).


    # Online course management


    As more and more educational materials become available

    online, libraries need to start thinking of new models for

    educating patrons by library use, new technologies,

    research practices and many other topics. In tough times we

    see that people are more likely to turn to their libraries for

    free access to the internet, free access to job search materials

    and free access to workshops⁴ At the same time, libraries

    are suffering from the same economic woes, so providing

    additional free services can be difficult.'
  - '[PAGE 147]


    One way to offer our patrons an added benefit without too much of an investment,
    and without the need for providing more space in the library, is to start to offer
    online workshops. Moodle (http://www.moodle.org) is an open source course management
    system, which can be used to help manage your course materials, online lectures,
    research references and plenty more.


    # 10.4 Open source in the real world: Moodle


    Georgia Katsarou, Librarian

    International Center for Hellenic and Mediterranean

    Studies, and College Year in Athens Library

    Athens, Greece


    Why did you decide to use Moodle in your library?


    We wanted to use a course management system in order to offer more up-to-date
    teaching facilities to our faculty and in order to facilitate the communication
    between faculty and students. Our IT support suggested Moodle because they were
    familiar with it and knew that it is working well and can fit our needs.


    How are you using Moodle in your library?


    We are the administrators and in brief we create new courses, update data, add
    and remove resources, create and delete user accounts, assign roles for the users
    and train faculty on how to use it.


    How long have you been using Moodle in your library?


    Two years.


    Did you have any trouble implementing Moodle in your library?


    No.'
  - '[PAGE 148]


    # Did you have any help installing, migrating to, or setting up Moodle?


    Our IT support did the installation. There was no need for data migration since
    we didn''t have a course management system before.


    I did the settings and asked for the IT department''s help just once when I wanted
    to increase the file upload size limit. It was very easy to use and understand
    the available documentation is clear and comprehensive.


    # What do you think of Moodle now?


    It''s a very good and useful software with useful and user friendly features.
    Up to now we had no problems at all and I was surprised that we didn''t encounter
    any problems due to bugs. Would definitely recommend it to other users.


    # What do others in your library say about Moodle?


    Everybody seems to be happy about it. It is significant that they don''t have
    to spend a lot of time in order to learn how to use it.


    # Anything else you want to know about Moodle or your process of switching to
    Moodle?


    As is the case with any open source application, the administrators have to read
    the documentation thoroughly.


    Using Moodle, librarians can create classes on topics related to their community
    and provide online access to the information (see Figure 10.5), for example they
    could give a series of workshops on real estate in hard times. A librarian could
    offer the workshops in person at the library and online simultaneously, or completely
    online (so there was no need for the library to provide a large public meeting
    space).'
