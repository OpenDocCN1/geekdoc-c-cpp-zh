    University manages its digital archive of the Illustrated London News (http://digital.lib.waikato.ac.nz)
    on Greenstone; see Figure 9.2.


    ## Institutional repositories


    Although Greenstone can be used for any type of digital collection, when it comes
    to storing data published by those within your institution, DSpace (http://dspace.org)
    seems to be the popular option.


    The most common use of the DSpace software is academic and research libraries
    as an open repository for managing their faculty and student output. There are
    also many organizations using the software to host and manage subject based, dataset,
    or media-based repositories.


    No, but we are fortunate to have staff with the skills needed to tackle this kind
    of project.


    ## What was the process of switching from proprietary to open source like?


    We didn''t make a switch from proprietary. We began our repository using open
    source. Our department, the Desktop Network Services, has had quite a bit of experience
    using open source software.


    ## Did you have any help installing, migrating to, or up DSpace?


    Our system administrator installed DSpace on one of our library servers, and we
    had one of our librarians with a good deal of technical skills configure it. They
    used the existing documentation from the DSpace website and didn''t run into trouble
    during the implementation. The DSpace listservs provided answers to questions
    they had during that time.


    ## What do you think of DSpace now?


    We are quite happy with the system. Part of this is because of the DSpace user
    community and the upgrades and add-ons that are being created. They address the
    needs of repository managers and the system users.


    ## What do others in your library say about DSpace?


    Most people are very supportive. They understand the need for an institutional
    repository. Some of our librarians are very active in promoting this service.


    In addition to the ability to store various different types (documents, images,
    videos, audio recordings, and so on) DSpace also offers a series of add-ons or
    plugins (http://dspace.org/add-ons-and-extensions/addons/) to extend the functionality
    of the application. In true open source fashion, DSpace also allows for customization
    of look and feel and metadata formatting (see Figure 9.3).


    ## Practical Open Source for Libraries


    ![](img/4e1ec39c661a9fa73febd901135781ce_129_0.png)


    Like Greenstone, DSpace also allows for the creation of several different collections,
    which users can then browse or search through. This flexibility, a trademark of
    an open source application, is part of what makes this application the choice
    of so many institutions.


    ## Community build collections


    Greenstone and DSpace are well established tools for sharing digital collections
    with the outside world, but what about the outside world to share its collections
    with us? Kete (http://kete.net.ny) represents the traditional digital library
    inside allowing the library to host and moderate the content added by community
    members.


    ## 9.3 Open source in the real world: Kete


    Joann Ransom, Acting Head of Libraries

    Horowhenua Library Trust

    Levin, New Zealand


    ## Why did you decide to use Kete in your library?


    In 2005 we carried out an audit of arts, cultural and heritage resources in our
    district. We found that there is a large amount of material in private hands;
    ''shoeboxes under the bed'' was how we viewed them. While some of it was destined
    to be given to historical societies most of it would not. However, almost all
    of it was available for display, copying and sharing so long as we gave the originals
    back.


    We needed a digital repository that would be easy for the general public to add
    material to. The library''s role would be to provide a forum, promote it and support
    the community to encourage the growth of the digital collection.


    ## How are you using Kete in your library?


    - 1. Kete has provided a way for our heritage sector to digitise and make available
    their collections without compromising the originals.

    - 2. Kete has also enabled us to digitise and make available 24/7 our vertical
    file collection.

    - 3. It has allowed previously hidden or private content to become available.

    - 4. Kete has been a splendid marketing tool for the library. We do loads of public
    speaking, explaining how groups and organisations can use Kete, in terms of searching
    and contributing.

    - 5. Kete has given us the excuse to draw people into the library and teach them
    IT skills. We ran regular working bees for volunteers to use staff after hours
    to digitise the photograph collection of the historical societies.


    ## Practical Open Source Software for Libraries


    How long have you been using Kete in your library?


    We developed Kete during the latter half of 2006 and did a soft launch in March
    2007, which allowed us to get ''seed content'' before the official launch in 2007.


    ## Did you have any trouble implementing Kete in your library?


    None at all. We advertised in the paper for volunteers and overwhelmed with help.
    Our community love helping build a cool resource, and our heritage sector are
    delight we have given them a way to make their collections available.


    The large increase of volunteers popping into the library took a wee bit of getting
    used to for staff not directly involved in the project and who hadn''t been exposed
    to the enthusiasm.


    ## What was the process of switching from proprietary to open source like?


    This is a new venture for us in terms of collecting informal content.


    ## Did you have any help installing, migrating to, or setting Kete?


    Walter McGinnis from Katipo Communications in Wellington was the primary developer
    and does a splendid job making our vision a reality.


    ## What do you think of Kete now?


    Love it - and I fall in love with it all again everytime get to share it with
    people and see their reaction.

