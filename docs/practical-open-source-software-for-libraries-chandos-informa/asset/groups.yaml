    We use VuFind as our primary OPAC which was packaged with LMS.


    ### ### How long have you been using VuFind in your library?


    VuFind has now been in our library for over one half years.


    ### ### Did you have any trouble implementing VuFind in your library?


    No, we didn''t have any trouble at implementing VuFind in our library. The major
    part was to make some changes to our.


