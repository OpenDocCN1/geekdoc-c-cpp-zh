    5. Krebs, Brian. ‘Internet Explorer Unsafe for 284 Days in 2006.’ The Washington
    Post: Security Fix, January 4, 2007. http://blog.washingtonpost.com/securityfix/2007/01/internet_explorer_unsafe_for_2.html.


    6. ‘January 2010 Web Server Survey.’ Netcraft, January 7, 2010. http://news.netcraft.com/archives/2010/01/07/january_2010_web_server_survey.html.


    7. Quoted in Jackson, Joab. ‘GSA Makes the Case for Open Source.’ Government Computer
    News, April 16, 2008. http://gcn.com/blogs/tech-blog/2008/04/gsa-makes-the-case-for-open-source.aspx.'
  - '[PAGE 41]


    # Open source and libraries


    It has been suggested that libraries are almost ethically required to use, develop
    and support open source software.^1 The parallels between the rules of librarianship
    and open source are easy to spot just by comparing the open source definition
    (and/or the free software definition) to the rules set forth by nearly all library
    associations. Both organizations center their rules on freedom of use and free
    access to information, a fact that even non-librarians notice:


    > Librarians espouse many of the same ideals that drive the free software community.
    They collaborate and communicate; they work to share the results of their work
    with one another. They understand freedom and feel that it''s an important value.
    That more librarians aren''t actively using and evangelizing free software is
    an indictment against us for not letting them in our secret.^2


    The Code of Ethics of the American Library Association states, We protect each
    library user''s right to privacy and confidentiality with respect to information
    sought or received and resources consulted, borrowed, acquired or transmitted.^3
    Simply put, members of the American Library Association should deliver information
    to their patrons without prejudice and without asking what the patron'
  - '[PAGE 42]


    Practical Open Source Software for Libraries


    intends to use the information for or with whom they plan to share it. Eric Lease
    Morgan puts it another way when comparing open source communities to libraries:


    There are many aspects of open source software which are akin to the principles
    of librarianship. First and foremost in my mind is the expected use of the deliverable
    – none. In the first case, the deliverable is software. In the second, it is data
    and information. In both cases, there are very few expectations in regard to what
    a person does with the information. You are free to use and modify the program
    in any way you desire... It is none of my business why you wish to know the answer
    to this particular reference question or borrow that book.²⁴


    Parallel is just one of the reasons why so many libraries have been producing,
    adopting and promoting open source in recent years. That said, there are still
    many misconceptions regarding open source software that have slowed library adoption.


    # Library budgets


    One of the most obvious reasons for libraries to consider open source as an alternative
    to their current systems is shrinking budgets. Open source software usually has
    no or low cost to entry and ownership.³ Because of the nature of the open source
    license, most open source applications offer a way for software users to demo
    the product without any limits on time frame or any fees.


    Once you have decided to go with an open source product, there is no need to buy
    licenses for every computer


    30'
- md: '

    that software will run on, another huge cost saving to libraries. If there are
    any fees associated with the software it will usually be for support and/or development,
    both of which libraries can choose to forgo if they feel they have the necessary
    skills in house to manage the skills.


    Furthermore, with more and more libraries adopting open source alternatives, the
    potential for development partnerships becomes more of a reality. A development
    partnership will allow libraries to pool funds to pay for enhancements to the
    products, or even to share skilled staff members who will develop the new feature
    for all libraries in the partnership.


    # Gift cultures


    When Horowhenua Library Trust (http://www.library.org.nz) decided to release their
    new integrated library system as open source, they gave it the name Koha, the
    Maori word for gift. This was their gift to the library, an open source integrated
    library system for all to benefit from. This is very much in line with gift cultures,
    which are societies where gifts are made of products and/or services without any
    explicit request for payment or return services.


    Eric Morgan muses about gift cultures, libraries and open source: ‘Open source
    software development and librarianship have a number of similarities – both are
    examples of gift cultures.’ He goes on to explain just how libraries can be considered
    a gift culture. Most importantly, librarians are known for providing access to
    information and research without any expectation of monetary exchange. As we all
    know, most librarians share the information because they love their jobs and furthering
    the education of others. This is their gift to their communities.


    Open source communities follow a very similar model, where community members participate
    and share their knowledge for the joy of the final product, not a monetary payment.
    Christina Garsten and Helena Wulff explain this gift giving as the power behind
    open source software:


    Work, collaboration and sharing of knowledge in open-source communities are culturally
    organized around the concept of gift giving. Gift giving creates flows of knowledge
    and makes it possible to innovate and refine software-development processes on
    a global scale.^8


    This similarity in the ways that libraries and open source both provide gifts
    to their communities is just another in the long list of reasons why it seems
    like a logical choice for libraries to use and develop open source software.


    # Thinking ahead


    When I worked at the Jenkins Law Library (http://www.jenkinslaw.org) in Philadelphia
    I did a lot of development to scratch the itches of the library staff. I used
    an open source language, PHP, and an open source database, MySQL, but I didn''t
    think that else would ever want to use the products I developed so I didn''t think
    of how to share them with the world. Years later I am an active member in open
    source library communities and I wish I could go back and think ahead to this
    moment and the benefits that my tools would had to offer to other libraries.


    While at the law library I developed a powerful content management system to maintain
    the library''s intranet,^9 and now libraries are exploring options like Drupal


    # Open source and libraries


    (http://www.drupal.org) and Joomla (http://www.joomla.org) to manage their websites.
    I also wrote an inter-library loan and billing system specific to the library
    that that I now see would have been useful to integrate into Koha (http://www.koha-community.org)
    or Evergreen (http://www.open-ils.org).


    I bring this up because libraries need to think ahead when they start development
    projects. They need to sit down and say, ''this is what we''re going to develop;
    could it by any chance of help to other organizations like ours?'' It is because
    of questions like this that we have the amazing selection of specific open source
    applications.


