    # 图书馆实用开源软件


    图 6.2 LibX VT 工具栏


    ![](img/4e1ec39c661a9fa73febd901135781ce_71_0.png)


    一旦安装了你的工具，你可能希望在图书馆的每台电脑上都安装它，并在你的图书馆网站上推广它，以便你的读者可以在家里下载并使用它。


    另一个受欢迎的、集成到 Firefox 中的开源工具是 Zotero (http://zotero.org)，它是一个引用管理工具，允许你将参考文献保存到计算机中，以便于访问和创建参考文献。


    一旦安装了 Zotero，你就可以通过状态栏中出现的按钮，一键从许多流行的研究网站和数据库保存引用。在 Zotero 中，你可以使用文件夹、标签和笔记来组织资源。你还可以按照选择的引用格式，将资源直接导出到许多文字处理应用程序（包括
    OpenOffice）。Zotero 允许你直接在浏览器中的各种文件夹中存储所有的研究材料（见图 6.3）。


    # 图 6.3 在 Zotero 上搜索“Koha”


    | 标题 | 创建者 | 信息 | 备注 | 标签 | 相关 |

    |---|---|---|---|---|---|

    | Implementing an Open L | Derby | | 1 | | |

    | Internet... | | | 1 | | |

    | Introduction to Print Soft | | | 1 | | |

    | Library Services... | Gonzalez B. | | 1 | | |

    | Issues and lesson learn... | Raifa | | 1 | | |

    | Web design... | | | 1 | | |

    | Base homepress... | Random | | 1 | | |

    | A library checks it... | | | 1 | | |


    Zotero 还具有通过网络与其他 Zotero 用户共享资源的能力，这让所有参与者的小组项目和图书书员研究都变得简单得多。通过 Zotero 账户，你可以将计算机上的资源与网络同步。这既可以作为备份，也是与同事或研究人员共享资源的方法.³


    # 6.3 现实世界中的开源：Zotero


    Jason Puckett，佐治亚州立大学图书馆用户教育技术、新闻与演讲联络员

    美国佐治亚州亚特兰大


    你为什么决定在你的图书馆使用 Zotero？


    当我发现 Zotero 的时候，我已经教了多年 EndNote。在我的家里的笔记本电脑上安装 Linux 之前，我并没有真正用过它，当然 Linux 可以运行
    Zotero 但不能运行 EndNote。它如此易用，而且融入研究过程是如此简单，这让我大为观止。我立即放弃了 EndNote，并编写了一份网络指南和一个工作讨会计划。我是
    GSU 图书馆第一个推广它的人，自从去年我来到这里，看到兴趣度直线上升，我感到非常欣慰。


    我是开源软件普遍益处的粉丝，在其他条件相同的情况下，我倾向于在可能的情况下使用它，但现实中，某些 OSS 产品并不像它们的商业等效产品那样流畅易用。Zotero
    并不是这样。它比我尝试过的任何其他引用管理器都更好用，而且最新版本比 EndNote 多功能且功能强大得多。就像它是由学术研究人员为学术研究人员设计的，因为开发者们似乎真的理解人们是如何使用它的。


    它的安装也容易得多，这听起来是一件小事，但对于我们这些在 GSU 提供 EndNote 支持的人来说是一个大头疼的问题。我们有 EndNote 的站点许可，所以我们提供下载，但用户必须登录，在完全身份验证的安装过程中，他们必须在安装期间遵循某些特定步骤。尽管提供了说明和教程视频，这仍然是我们用户在使用
    EndNote 时面临的首要问题。使用 Zotero 则没有困难。


    # 你在图书馆里是如何使用 Zotero 的？


    我有一个流量很大的网络指南。我一直在图书馆举办定期的插班工作讨会。我为学生和教职员工提供大量的一对一帮助。我曾在校内的一些部门做过演示。我将在几周后开始举办一些在线工作讨会，我以前为
    EndNote 做过这些，我认为它们对 Zotero 效果也会很好。


    # 你在图书馆使用 Zotero 有多久了？


    我担任这份工作大约有一年了。我推测在上一家图书馆时我已经使用它两三年了，所以总共三到四年。


    ![](img/4e1ec39c661a9fa73febd901135781ce_73_0.png)


    # 你在图书馆实施 Zotero 时遇到过困难吗？


    只有几个小插曲。其中一个是我们的电脑上同时安装了 EndNote 和 Zotero，因为其中一个程序可能会从另一个手中夺取下载的引用，但临时禁用 Zotero
    非常容易，不至于成为问题。（不过，在大型教室的每台电脑上这可能需要一点时间。）


    另一个是它只支持 Firefox，但我甚至说服了那几个人切换到 Firefox，仅仅是为了他们能使用 Zotero。


    # 从专有切换到开源的过程是怎样的？


    我不能说我们已经完全切换了，据我所知，我们也不可能停止使用 EndNote。（注：原文 OCR 文本存在重复或伪影，已根据去重 OCR 噪声进行了逻辑清理）。


    '
