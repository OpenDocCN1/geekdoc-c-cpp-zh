    # Open sourcing collections


    When asked what they think of when they they think of libraries, most people will
    offer ‘books’ as their first answer. As librarians, we know that our buildings
    house all types of collections, which are certainly not limited to books. We also
    know that if they cannot be found with an easy search via the web, then our patrons
    will never know about the amazing collections housed in our libraries. The following
    open source tools will help you make your digital collections visible to your
    patrons via the web.


    # Digital collections


    Digital collections can come in many shapes and forms. Some are used to keep an
    archive of publications produced by your institution, some are provided as a way
    to keep a history of the community, and some provide files on a specific topic.
    Whatever your digital collection might be used or made up of, there is an open
    source application that will help index and provide the necessary data.


    Greenstone (http://www.greenstone.org) is a digital library application that allows
    for the distribution of data via the internet and/or digital media such as a CD
    ROM or DVD. This flexibility has made it extremely popular worldwide. I was able
    to install the application and create a website for my collection in less than
    an hour (see Figure 9.1).'
  - '[PAGE 123]


    # Practical Open Source Software for Libraries


    # Figure 9.1 Editing Dublin Core using the Greenstone Librarian interface


    ![](img/4e1ec39c661a9fa73febd901135781ce_123_0.png)


    Using the Greenstone Librarian Interface you can easily browse for your files
    on your local machine, network or the web and import them into your collection.
    Greenstone allows for many collections, each of which can be made up of documents,
    images, videos, audio files and more. Greenstone has also been developed with
    worldwide accessibility in mind.


    # 9.1 Open source in the real world: Greenstone


    Peter Stone, Technology Support Services Team Leader, and David Friggens, Systems
    Librarian

    University of Waikato Library

    Hamilton, New Zealand


    Why did you decide to use Greenstone in your library?


    We needed a digital collection manager that was robust and relatively easy to
    implement in a Linux system, and'
  - '[PAGE 124]


    the Computer Science Department at University of Waikato develops and maintains
    Greenstone.


    # How are you using Greenstone in your library?


    We are using Greenstone for two collections. The first collection is the New Zealand
    Gazette, which is provided commercially; we use Greenstone to manage the PDF documents
    locally. This was the original impetus for Greenstone, as the provided proprietary
    software was not really fit for purpose.


    The other collection is the parts of the London illustrated 1842-1902 that relate
    to New Zealand. This collection is publicly available and contains scanned images
    of the pages along with OCR for searching.


    We have some local collections that we hope to make available using Greenstone
    in the near future.


    # How long have you been using Greenstone in your library?


    Some five years (possibly six years). We are about to upgrade to the latest version.


    # Did you have any trouble implementing Greenstone in your library?


    No.


    # What was the process of switching from proprietary to open source like?


    It was a major improvement, as we gained control of how the collection(s) presented
    to the user and how services the user might want were presented.


    # Did you have help installing, migrating to, or setting up Greenstone?


    No, we worked it out ourselves; however I do think the documentation for the upgrade
    version we are about to migrate to is far better what we dealt with originally.'
