    # Practical Open Source Software for Libraries


    # What do you think of Greenstone now?


    It''s a solid, reliable product.


    # What do others in your library say about Greenstone?


    Where we have chosen to use Greenstone, they are happy.

    However, we have not progressed with customizations due

    to other work commitments.


    The international Unicode character set is used throughout,

    so documents in any language and character encoding

    can be imported (in fact, Greenstone can automatically

    detect the language and encoding of most documents).

    Collections of documents in Arabic, Chinese, Cyrillic,

    English, French, Spanish, Hindi and Maori are

    publicly available. The New Zealand Digital Library website

    (http://nzdl.org/) hosts many of these, and the Greenstone

    website links to sites that contain further examples.


    It makes little sense to have a collection whose content is

    in Chinese or Russian, but whose supporting text—instructions,

    navigation buttons, labels, images, help text, and so on—are

    in English. Consequently, the entire Greenstone interface has

    been translated into a range of languages, and the interface

    can be changed by the user as they browse from the

    Preferences page.


    In addition to the freedom of organizing multimedia

    collections, Greenstone also offers customization of

    the interface and metadata formats. By default, Greenstone''s user

    interface has a very clean look and feel, but many libraries

    want to make their digital library site look more like their

    traditional library site for branding purposes (see Figure 9,2).

    to get ideas of what kinds of customizations have been done,

    you can view the list of example collections on the Greenstone

    official site (http://www.greenstone.org/examples). Waikato'
