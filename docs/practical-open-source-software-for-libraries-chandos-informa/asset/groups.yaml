    in to our library management system - EDI Quotes – creates orders). We use OCLC''s
    xISBN a lot so that staff can right click on an ISBN and find out we have that
    book in stock regardless of edition and so on. We are currently trying to integrate
    xISBN and Coutts Oasis.'
  - '[PAGE 69]


    # How long have you been using LibX in your library?


    We had a public toolbar for a couple of years but have only recently started to
    use it.


    # Did you have any trouble implementing LibX in your library?


    The configuration website is very good, but does have some quirks. Getting to
    it do exactly what we want to do has been slow at times.


    We had no real non-technical problems. I think we would have done if we heavily
    promoted it, especially on would have been questions as to how we support it,
    how we manage changes, training and worry it would confuse users with low IT levels.
    By promoting it on ''tech-friendly'' channels (such as Twitter) and keeping it
    low we have avoided this..


    # What was the process of switching from proprietary to open source like?


    I would''t say it a switch. It wasn''t a key need, which one product catered for
    and then it was replaced with LibX. I came across it, spent a few hours setting
    it up, showed a couple of people and quietly made it public, refining it since
    then.


    We already use open source applications (EPrints) and infrastructure (Apache,
    Linux and so on) and would certainly use it again for other needs (for example
    OPACS such as VuFind).


    # Did you have any help installing, migrating to, or setting up LibX?


    No, but the help on the website was good. And I come from a computer science background.


    # What do you think of LibX now?


    Fantastic and very useful. I think the context menu options are more useful than
    the toolbar (already have too many toolbars!) and I would like to see it developed
    further.'
  - '[PAGE 70]


    I do wish it provided usage statistics per library, on the number of downloads
    and so on.


    # **What do others in your library say about LibX?


    The staff love it, especially those in our resources departments (reading lists,
    acquisitions, cataloguing) who are always under pressure to improve their efficiency.
    It has proved a time saver. Users seem to like it too, though we have had little
    feedback.


    LibX has several scripts that integrate the library into popular websites like
    Amazon.com (http://amazon.com), Google Scholar (http://scholar.google.com) and
    Barnes & Noble Online (http://bn.com). When you search on any of these, links
    back to the library appear on your results. For Amazon and Barnes & Noble, links
    will take you into a library catalog search for the book in question. When on
    Google Scholar, each article is followed by a link to the library databases to
    search for the article, a nice little reminder that not everything is available
    for free online (see Figure 6,2).


    Over 700 libraries have set up LibX toolbars and many are added daily, simply
    because the tool used to create a toolbar specifically for your library is so
    easy to use. First, you want to be sure that you have all of the necessary proxy
    information for your databases and catalog. Next, enter the LibX builder and start
    answering questions. You will be asked for information connecting to your library
    catalog and subscription databases. You will also be prompted to brand your LibX
    toolbar by adding an icon or logo for your library.'
