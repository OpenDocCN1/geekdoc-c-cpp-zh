    ![](img/4e1ec39c661a9fa73febd901135781ce_149_0.png)


    Moodle offers the ability for instructors to upload materials, links and course
    schedules so that students can work in their own time. It also makes it easy for
    students to communicate with each other and the instructor using chat rooms and
    message boards. All of these services are found in popular proprietary offerings,
    but without the added license fees or use restrictions. This means that libraries
    can offer additional services to their patrons without having to go outside their
    allotted budget.


