    # Did you have any help installing, migrating to, or setting up Zotero?


    I asked my IT department to install it on the public computers and in our classrooms.
    They were great about setting it up, they asked not to put on the latest version
    it''s still in beta. That worked fine for me. They had no questions or concerns
    about using an open-source product. I think it''s easier for them since since
    they don''t have to track licenses and so forth.


    # What do you think of Zotero now?


    I love it. I''d marry it if our society weren''t so closedminded. I use it constantly,
    for research, work projects, and keeping personal reading lists. The community
    of users and developers is incredibly helpful and creative. My friend Kathryn
    Greenhill just posted a great video about using it to collect image credits for
