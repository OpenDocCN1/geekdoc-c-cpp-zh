- md: "\n# 11.3 Open source in the real world: Blacklight\n\nTom Kramer, Associate\
    \ Director Digital Library Systems & Services\nStanford University Libraries and\
    \ Academic Information Resources\nStanford CA, USA\n\n## Why did you decide to\
    \ use Blacklight in your library?\n\nWe chose Blacklight for a number of reasons.\n\
    \n- 1. Technology strategy and maintainability. Stanford University Libraries\
    \ made a strategic choice to embrace Ruby on Rails (RoR) as its end-user facing\
    \ application development language at the end of 2008. So far, our experience\
    \ with RoR and Blacklight has been consistent with our expectations. We have trained\
    \ a half dozen developers with no previous RoR experience to become competent\
    \ developers within well a month, and test coverage of Blacklight exceeds 70 percent\
    \ of its code base.\n\n- 2. Architecture, functions and feature set. Blacklight\
    \ has demonstrated support for three key features that we think are critical for\
    \ a next generation search application. These are support for non-MARC data, object-specific\
    \ behaviors and tailored views.\n\n- 3. Community. Blacklight has a solid core\
    \ of institutions and expert individuals committed to, and contributing to, its\
    \ code base. Early on, the principal stakeholders in the project at the University\
    \ of Virginia demonstrated that they were eager to take code contributions, ideas\
    \ and support (in many forms) from other institutions and individuals. This encouraged\
    \ us to adopt Blacklight ourselves, and gave us the confidence that if we adopted,\
    \ we would have a chance to help further a common code base, and not have to take\
    \ on long-term support for all our local modifications and enhancements.\n\n##\
    \ How are you using Blacklight in your library?\n\nWe are currently using Blacklight\
    \ as:\n\n- a next generation catalog (see http://searchworks.stanford.edu)\n-\
    \ a front end for various Fedora repositories\n- a search, browse and view interface\
    \ for specialized digital library applications (for example, digitized medieval\
    \ manuscripts).\n\n## How long have you been using Blacklight in your library?\n\
    \nWe formally adopted Blacklight in December 2008.\n\n## Did you have any trouble\
    \ implementing Blacklight in your library?\n\nWe spent the first to three quarters\
    \ after adopting Blacklight working with its core team of committers to refactor\
    \ the codebase, making it more portable, better tested and more feature rich.\
    \ This work culminated in the Blacklight 2.0 release in spring 2009. After this\
    \ work, we have found implementing new instances of Blacklight is a straightforward\
    \ task. The most demanding task in setting up a Blacklight instance is in designing\
    \ and populating the underlying solr index.\n\n## What was the process of switching\
    \ from proprietary to open source like?\n\nWe have had other experiences in adopting\
    \ open source software, which were key factors in weighing Blacklight's community,\
    \ architecture and maintainability so heavily in deciding to adopt it. After paying\
    \ the upfront cost of adopting a new technology (RoR) and a new application (Blacklight),\
    \ we've found it liberating to work on an open code base. Our librarians have\
    \ made some extremely particular requests for how data and functionality should\
    \ work in the new system, and being able to manipulate the underlying data and\
    \ the application to our requirements is an extremely satisfying experience, especially\
    \ compared to working with most proprietary systems.\n\n## Did you have any help\
    \ installing, migrating to, or setting up Blacklight?\n\nWe have found the Blacklight\
    \ developers list to be the best resource for technical support (and we've received\
    \ much from its contributors).\n\n## What do you think of Blacklight?\n\nIt's\
    \ an excellent tool, and one of the centerpieces of our digital library strategy.\n\
    \n## What do others in your library say about Blacklight?\n\nThey appreciate its\
    \ feature set and flexibility, and are eager for more functions and data types\
    \ to be added as quickly as possible.\n\nLearn more:\n\nSee http://searchworks.stanford.edu.\n\
    \nOf particular note are:\n\n- the advanced search feature (developed at Stanford,\
    \ and soon to be checked into the common codebase), available at http://searchworks.stanford.edu/advanced\n\
    - the browse nearby a call number feature\n- the real time availability display,\
    \ showing location and status for all items at a glance on the search results\
    \ page.\n\n## SOPAC2\n\nFinally came the release of SOPAC2 (http://thesocialopac.net)\
    \ by John Blyberg and the Darien Library in 2008.^4 SOPAC2 went one step further\
    \ than the previous two options and followed the Scriblio model by integrating\
    \ the OPAC directly into a content management system, the difference that SOPAC2\
    \ is integrated into Drupal instead of WordPress. This means that the library\
    \ can now have a seamless look and feel, and patrons can search through both the\
    \ library site and the OPAC (see Figure 11.4).\n\n## Choosing an OPAC\n\nThere\
    \ are four free source OPACs for you to choose from, so how to make the choice?\
    \ Part of your decision is going to be personal preference because they offer\
    \ very similar services to each other. The other part, and this is a big one,\
    \ is to determine whether or not the OPAC connectors for your particular library\
    \ system yet. If the OPAC cannot communicate with it it's not \n\n> Figure 11.4\
    \ SOPAC2 at the Darien Library\n\n![](img/4e1ec39c661a9fa73febd901135781ce_161_0.png)\n\
    \n# 11.4 Open source in the real world: SOPAC\n\nJohn Blyberg, Assistant Director\
    \ for Innovation and User Experience\nDarien Library\nDarien CT, USA\n\n## Why\
    \ did you decide to use SOPAC in your library?\n\nNo product on the market exists\
    \ to meet the requirements of our digital strategy, which is to unify all of our\
    \ electronic resources into a single, interactive portal.\n\n## How are you using\
    \ SOPAC in your library?\n\nWe are using it as a complete OPAC replacement and\
    \ as an additional online service to our users. Our staff also use it for collection\
    \ development, information services and readers advisory.\n\n## How long have\
    \ you been using SOPAC in your library?\n\nSince September 2008.\n\n## What was\
    \ the process of switching from proprietary to open source like?\n\nVery easy.\n\
    \n## What do you think of SOPAC now?\n\nWe love it!\n\n## What do others in your\
    \ library say about SOPAC?\n\nThey love it!\n\none for you. That said, there are\
    \ always new developments happening and so if you like one more than another,\
    \ just contact the developers and see what it would take to get a connector written\
    \ for your integrated library system. All four offer an efficient, easy to understand\
    \ search box. Although we as librarians prefer to perform more complex searches,\
    \ the average internet user is a fan of the Google model, also known as keyword\
    \ searching. All of these tools take into account. In fact, Scriblio and Blacklight\
    \ offer a single search box option, so there is no advanced search.⁵ SOPAC offers\
    \ a slightly more advanced search page and VuFind offers a traditional-looking\
    \ library search page. Although the search systems are all different, they all\
    \ offer the option to filter your results by various different headings and item\
    \ types, making it easy to narrow your results down to the right subset of items.\n\
    \nIn addition to the simple search interfaces, all of these options offer permanent\
    \ links to bibliographic records and search results. This means that as a librarian\
    \ you can copy the URL from the address bar in your browser and send it to a patron\
    \ via email or instant message and when the patron clicks the link it will take\
    \ them to the same screen you were looking at. This is something that is slowly\
    \ becoming standard in the traditional OPAC, but is not yet widespread.\n\nAll\
    \ of these options also take into account modern web features such as RSS feeds\
    \ and commenting. VuFind and SOPAC2 go a step further and allow patrons to add\
    \ tags. SOPAC2 also allows patrons to add ratings and reviews to records in the\
    \ catalog. All of this extra data is then stored outside the integrated library\
    \ system so as to interfere with librarian-supplied data, while still giving the\
    \ patrons a sense of belonging to the library in more ways than one.\n\n# Open\
    \ source it all\n\nIf your library is planning to change the integrated library\
    \ system experience for the entire library, not just patrons, then maybe an open\
    \ source integrated library system is the right choice for you. There are currently\
    \ two major possibilities on the market: Koha (http://koha-community.org) and\
    \ Evergreen\n"
