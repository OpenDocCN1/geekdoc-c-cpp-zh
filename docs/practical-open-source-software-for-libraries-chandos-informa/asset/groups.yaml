    # 你的图书馆其他人对 Kete 如何看？


    那些接受该项目、投入资源在社区中进行推广，并积极鼓励和支持内容创建的人，从 Kete 中获得的远比那些期望它自动生成内容的人多。建立一个在线社区需要时间和精力。我确保回复每一个新贡献者，并通过评论对他们向
    Kete 的添加表示感谢，提出温和建议或编辑掉明显的错误。我也喜欢通过将提交的内容设为首页特色主题来庆祝它们。Kete 并不是万灵妙药，但它是一个极佳的借口，让你去与镇上的每一个组织、俱乐部和社区小组交流——并在此期间建立一个出色的本地资源。


    Joann Ransom 写了为这个社区建设数字图书馆选择“Kete”作为名称的过程：


    > 呼应毛利人关于代表知识的三个篮子（kete）的谚言，我们将我们的概念命名为 Kete。我们非常喜欢 kete 所代表的意义。我们喜欢它们是“诚实的”、实用的物品，由发现的材料编织而成，而且任何人都可以学会编织一个。我们喜欢它们由亚麻制成，亚麻生长于大地母亲
    Patapatuanuku。我们喜欢亚麻与编织者之间的联系——那个抚摸并塑造亚麻将其制成美丽或有用物体的人。我们喜欢 kete 通常是由一个人送给另一个人的，因此将人们联系在一起，而且它们通常是为了纪念某个场合而赠送的，因此围绕一个
    kete 有许多故事。当 kete 被使用并从一个场合带到另一个场合时，故事正在被述说，历史正得以保留。kete 是我们数字图书馆及其包含的各种材料的恰当比喻。4


    # 图书馆实用开源软件


    通过 Kete，图书馆可以在其服务器上安装软件，然后向社区成员开放添加内容的工具。托管 Kete 实例的图书馆可以定义谁是“社区成员”。如果你在公共图书馆工作，你的社区可以是任何持有借卡的人，或者是世界上任何地方的人。如果你在学术或学校图书馆，你的社区可能只由学生和教授组成。


    社区决定向数字图书馆添加什么类型的内容（见图 9.4）。这是收集读者藏在阁楼里的所有宝藏的绝佳方法。家庭历史的碎片每天都在流；有了这样的工具，社区成员可以分享他们的宝藏而无需将其让给图书馆。Kete
    Horowhenua (http://horowhenua.kete.net.nz) 是社区如何聚集在一起分享历史的完美示例。Kete Horowhenua
    是一个由社区成员管理的数字资源集；见图 9.4。


    ![](img/4e1ec39c661a9fa73febd901135781ce_133_0.png)


    # 知识的篮子


    在图书馆和社区之间，有很多值得与他人分享的精彩集合。这些工具中的一个或全部可用于通过图书馆网站向更广泛的世界开放集合。


    # 笔记


    - 1. Witten, Ian H., Matt Jones, David Bainbridge, Polly Cantlon, and Sally Jo
    Cunningham. ‘Digital Libraries for Creative Communities.’ Digital Creativity 15,
    no. 2 (2004年6月): 110–125.

    - 2. 见 http://digital.liby.waikato.ac.nz.

    - 3. ‘DSpace 用例示例.’ DSpace. http://dspace.org/use-case-examples/DSpace-Use-Cases.html.

    - 4. Ransom, Joann. ‘Kete Horowhenua: 由其人民讲述的地区故事.’ Kete.net.nz, 2008年2月. http://kete.net.nz/blog/documents/show/33-kete-horowhenua-the-story-of-the-district-as-told-by-its-people.


    # 开源研究工具


    除了数字集合，图书馆还有许多其他资源来分享主题。许多图书馆网站提供特定主题的链接列表、学科指南和在线研讨会，以帮助教育他们的读者。与图书馆的其他任何领域一样，也有开源技术帮助我们高效地提供这些指南和课程。


    # 学科指南


    在我图书馆的第一份工作中，我负责管理图书馆的研究收藏。我们网站的这个区域与学术图书馆所谓的“学科指南”的页面非常相似。无论你如何称呼它们，如果不使用正确的工具，维护这些页面将非常枯燥。在我的图书馆，我们只是使用一系列静态
    HTML 页面，必须定期更新，这种做法在世界各图书馆并不少见。


    图书馆创建的用于解决问题的两个开源工具是 SubjectsPlus (http://www.subjectplus.com) 和 Library à la
    Carte™ (http://alacarte.library.orestate.edu)。


    ## 10.1 现实世界中的开源：SubjectsPlus


    Bryan P Carson，电子服务图书员及语言学院技术联络员

    Middlebury 学院

    Middlebury VT. USA


    **你为什么决定在你的图书馆中使用 SubjectsPlus？**


    它是开源的。它易于实施、轻量级且由数据库驱动，并与其他平台良好集成。


    **你如何在图书馆中使用 SubjectsPlus？**


    我们用它来制作图书馆学科指南，并将图书员的联系信息与特定学科的内容相关联。我们还将其用于 EZ 资源。


    **你在图书馆中使用 SubjectsPlus 多久了？**


    我们从 2007 年 11 月开始使用。


    **在实施 SubjectsPlus 时遇到过困难吗？**


    并没。Andrew Darby（首席开发者）非常有帮助。


    **你现在觉得 SubjectsPlus 怎么样？**


    我觉得它非常棒。现在我们有了大量的记录，SubjectsPlus 的分发能力让我们能够快速创建指南。


    **你的图书馆其他人对 SubjectsPlus 如何看？**


    每个看到界面的人都喜欢它的外观、感觉和易用性。此外，内容创建者发现它很容易使用。


    **关于 SubjectsPlus 或你的切换过程还有什么想知道的吗？**


    如果你要实施 SubjectsPlus，你必须精通 HTML 和 CSS。你必须掌握基础 PHP 并知道如何管理 MySQL 数据库。这些技能用于定制和安装。除了服务器设置，大部分工作都是我自己完成的。任何“技术大牛”都能做到。


    **在安装、迁移或设置 SubjectsPlus 时得到过帮助吗？**


    我们的网络管理员为它设置了服务器，所以它不会带来安全问题。我们的一位网页程序员检查了代码中明显的安全问题并回回给了 Darby。所有的定制和其他微调都是我完成的。


    **从商业软件切换的过程是怎样的？**


    我们发现商业软件虽然昂贵，但能节省员工时间。成本降低了。用户满意度提高了。我们能够满足用户的需求。我们的网页程序员为网站创建了馈送。从商业软件切换受到了热烈反响。


    # 了解更多


    在 Middlebury 查看 SubjectsPlus 的运行情况：http://www.middlebury.edu/academics/lib/research/db-subject.


    SubjectsPlus 由 Ithaca 图书馆开发，作为图书员方便组织和展示数据的方法（见图 10.1）。它允许存储学科指南、A–Z 列表以及带有专长的员工列表。所有这些都发布在网上，使其


