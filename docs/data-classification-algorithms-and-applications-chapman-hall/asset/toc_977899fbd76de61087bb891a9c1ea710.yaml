- - '####'
  - Definition 1 Given a source domain 𝒟_S and learning task 𝒯_S, a target domain
    𝒟_T and learning task 𝒯_T, transfer learning aims to help improve the learning
    of the target predictive function f_T(·) in 𝒟_T using the knowledge in 𝒟_S and
    𝒯_S, where 𝒟_S ≠ 𝒟_T, or 𝒯_S ≠ 𝒯_T.
- - '##'
  - 21.3 Homogenous Transfer Learning
- - '####'
  - Definition 2 Given a source domain 𝒟_S and learning task 𝒯_S, a target domain
    𝒟_T and learning task 𝒯_T, homogenous transfer learning aims to help improve the
    learning of the target predictive function f_T(·) in 𝒟_T using the knowledge in
    𝒟_S and 𝒯_S, where 𝒳_S ∩ 𝒳_T ≠ ∅ and 𝒴_S = 𝒴_T, but P(x_S) ≠ P(x_T) or P(y_S|x_S)
    ≠ P(y_T|x_T).
