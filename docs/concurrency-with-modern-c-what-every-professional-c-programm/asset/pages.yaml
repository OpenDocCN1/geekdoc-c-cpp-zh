    # ### 6.1.2.4 Using the member function `fetch_add` with relaxed semantic


    ```

    ```cpp

    1 // synchronizationWithFetchAddRelaxed.cpp

    2

    3 ...

    4

    5 void sumUp(std::atomic<unsigned long long>& sum, const std::vector<int>& val,

    6     unsigned long long beg, unsigned long long end){

    7   for (auto it = beg; it < end; ++it){

    8     sum.fetch_add(val[it], std::memory_order_relaxed);

    9   }

    10 }

    11

    12 ...

    ```

    ```


    The default behavior for atomics is sequential consistency. This statement is
    true for the addition and assignment of an atomic and, of course, for the `fetch_add`
    member function, but we can optimize even more. I adjust the memory-ordering in
    the summation expression to the relaxed semantic: `sum.fetch_add(val[it], std::memory_order_relaxed)`.
    The relaxed semantic is the weakest memory-ordering; therefore, the endpoint of
    my optimization.


    The relaxed semantic is acceptable in this use-case because we have two guarantees:
    each addition with `fetch_add` takes place atomically, and the threads synchronize
    with the join calls.'
