  md: "# **Member functions of a std::barrier**\n\n| Member function | Description\
    \ |\n| --- | --- |\n| `std::barrier bar{cnt}` | Creates a `std::barrier` with\
    \ counter `cnt`. |\n| `std::barrier bar{cnt, call}` | Creates a `std::barrier`\
    \ with counter `cnt` and callable `call`. |\n| `bar.arrive(upd)` | Atomically\
    \ decrements counter by `upd`. |\n| `bar.wait()` | Blocks at the synchronization\
    \ point until the completion step is done. |\n| `bar.arrive_and_wait()` | Equivalent\
    \ to `wait(arrive())`. |\n| `bar.arrive_and_drop()` | Decrements the counter for\
    \ the current and the subsequent phase by one. |\n| `std::barrier::max` | Maximum\
    \ value supported by the implementation |\n\nThe call `bar.arrive_and_drop()`\
    \ means essentially that the counter is decremented by one for the next phase.\n\
