  md: "# ### 6.4.4 CppMem: Atomics with Acquire-Release Semantic\n\nThe synchronization\
    \ in the acquire-release semantic occurs between atomic operations on the same\
    \ atomic. This synchronization of atomic operations on the same atomic is in contrast\
    \ to the sequential consistency of synchronization between threads. Due to this\
    \ fact, the acquire-release semantic is more lightweight and, therefore, faster.\n\
    \nHere is the program with acquire-release semantic.\n\n**ongoing optimization\
    \ with atomics (acquire-release semantic)**\n\n```\n    // ongoingOptimizationAcquireRelease.cpp\n\
    \n    #include <atomic>\n    #include <iostream>\n    #include <thread>\n\n  \
    \  std::atomic<int> x{0};\n    std::atomic<int> y{0};\n\n    void writing(){\n\
    \        x.store(2000, std::memory_order_relaxed);\n        y.store(11, std::memory_order_release);\n\
    \    }\n\n    void reading(){\n        std::cout << y.load(std::memory_order_acquire)\
    \ << \" \";\n        std::cout << x.load(std::memory_order_relaxed) << \"\\n\"\
    ;\n    }\n\n    int main(){\n        std::thread thread1(writing);\n        std::thread\
    \ thread2(reading);\n        thread1.join();\n        thread2.join();\n    };\n\
    ```\n\nAt first glance, you notice that all operations are atomic, so the program\
    \ is well-defined. But the second glance shows more; the atomic operations on\
    \ y are attached with the flag std::memory_order_release (line 12) and std::memory_order_acquire\
    \ (line 16). In contrast to that, the atomic operations on x are annotated with\
    \ std::memory_order_relaxed (lines 11 and 17). So there are no synchronization\
    \ and ordering constraints for x. The answer to the possible values for x and\
    \ y can only be given by y.\n\nIt holds:\n\n+   - y.store(11,std::memory_order_release)\
    \ synchronizes-with y.load(std::memory_order_acquire)"
