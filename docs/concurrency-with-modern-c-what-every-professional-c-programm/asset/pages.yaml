    ![](img/d61a6c83410484053b8892275d2fcc4f_327_0.png)


    **Erroneous busy waiting without resource hierarchy**


    Every philosopher thread takes his first fork resource and then cannot take the
    second fork. What can we do? Andrew S. Tanenbaum^7 wrote in his book “Operating
    Systems. Design and Implementation, 3rd edition”: “Another way to avoid the circular
    wait is to provide a global numbering of all the resources. Now the rule is this:
    processes can request resources whenever they want to, but all requests must be
    made in numerical order.”


    # ### 6.2.4 Erroneous Busy Waiting with Resource Hierarchy


    This solution is known as resource hierarchy or partial ordering. For the dining
    philosophers problem, partial ordering is easy. The first fork taken has to be
    the fork with the lower number. For philosophers 1 to 3 the resources are taken
    in the correct order. Only philosopher thread 4 needs a change for correct partial
    ordering. First get fork resource 1, then get fork resource 4. See the main program
    in file `dp_4.cpp`:'
