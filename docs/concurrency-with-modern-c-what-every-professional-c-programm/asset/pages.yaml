  md: '# ## 18.26 Predicate


    Predicates are callable units that return a boolean as a result. If a predicate
    has one argument, it''s called a unary predicate. If a predicate has two arguments,
    it''s called a binary predicate.


    # ## 18.27 Pattern


    > “Each pattern is a three-part rule, which expresses a relation between a certain
    context, a problem, and a solution.” Christopher Alexander¹¹


    # ## 18.28 RAII


    Resource Acquisition Is Initialization, in short RAII, stands for a popular technique
    in C++, in which the resource acquisition and release are bound to the lifetime
    of an object. This means for a lock that the mutex will be locked in the constructor
    and unlocked in the destructor. This RAII implementation is also known as scoped
    locking.


    Typical use cases in C++ are locks that handle the lifetime of its underlying
    mutex, smart pointers that handle the lifetime of its resource (memory), or containers
    of the standard template library¹² that handle the lifetime of its elements.


    # ## 18.29 Release Sequence


    A release sequence headed by a release operation A on an atomic object M is a
    maximal contiguous sub-sequence of side effects in the modification order of M,
    where the first operation is A, and every subsequent operation.


    +   - is performed by the same thread that performed A, or

    +   - is an atomic read-modify-write operation.


    # ## 18.30 Sequential Consistency


    Sequential consistency has two essential characteristics:


    +   1. The instructions of a program are executed in source code order.

    +   2. There is a global order of all operations on all threads.'
