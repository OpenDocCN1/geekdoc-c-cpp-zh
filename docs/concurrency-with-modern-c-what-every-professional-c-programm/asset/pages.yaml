    it in a local variable. The result of the call will be returned to the caller
    when the coroutine first suspends.

    +     - calls `prom.initial_suspend()` and co_awaits its result. The promise type
    typically returns `suspend_never` for eagerly-started coroutines or `suspend_always`
    for lazily-started coroutines. (line 3)

