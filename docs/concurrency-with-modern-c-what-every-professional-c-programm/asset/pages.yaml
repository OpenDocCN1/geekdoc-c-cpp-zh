- pgno: 569
  md: "![](img/d61a6c83410484053b8892275d2fcc4f_569_0.png)\n\nLocks having no name\n\
    \n# ## 11.2.2.7 Use std::lock or std::scoped_lock for locking more mutexes atomically\n\
    \nIf a thread needs more than one mutex, you must be extremely careful that you\
    \ lock the mutex always in the same sequence. If not, a bad interleaving of threads\
    \ may cause a deadlock.\n\n```\n    void deadLock(CriticalData& a, CriticalData&\
    \ b){\n      std::lock_guard<std::mutex> guard1(a.mut);\n      // some time passes\n\
    \      std::lock_guard<std::mutex> guard2(b.mut);\n      // do something with\
    \ a and b\n    }\n\n    ...\n\n    std::thread t1([&]{deadLock(c1,c2);});\n  \
    \  std::thread t2([&]{deadLock(c2,c1);});\n\n    ...\n```\n\nThread t1 and t2\
    \ need two resources, CriticalData, to perform their job. CriticalData has its\
    \ own mutex mut to synchronize the access. Unfortunately, both invoke the function\
    \ deadLock with the arguments c1 and c2 in a different sequence. Now we have a\
    \ race condition. If thread t1 can lock the first mutex a.mut, but not the second\
    \ one, b.mut because in the meantime thread t2 locks the second one, we get a\
    \ deadlock.\n\nThanks to std::unique_lock you can defer the locking of its mutex.\
    \ The function std::lock, which can lock an arbitrary number of mutexes atomically,\
    \ does the locking."
