  md: "# ongoing optimization with atomics (sequential consistency)\n\n```\n```cpp\n\
    // ongoingOptimizationSequentialConsistency.cpp\n\n#include <atomic>\n#include\
    \ <iostream>\n#include <thread>\n\nstd::atomic<int> x{0};\nstd::atomic<int> y{0};\n\
    \nvoid writing(){\n    x.store(2000);\n    y.store(11);\n}\n\nvoid reading(){\n\
    \    std::cout << y.load() << \" \";\n    std::cout << x.load() << '\\n';\n}\n\
    \nint main(){\n    std::thread thread1(writing);\n    std::thread thread2(reading);\n\
    \    thread1.join();\n    thread2.join();\n};\n```\n```\n\nLet’s analyze the program.\
    \ The program is data race free because x and y are atomics. Therefore, only one\
    \ question is left to answer. What values are possible for x and y? This question\
    \ is easy to answer. Thanks to the sequential consistency, all threads have to\
    \ follow the same global order.\n\nIt holds true:\n\n+   - `x.store(2000);` **happens-before**\
    \ `y.store(11);`\n+   - `std::cout << y.load() << \" \";` **happens-before** `std::cout\
    \ << x.load() << '\\n';`\n\nHence: the value of `x.load()` cannot be 0 if `y.load()`\
    \ has the value 11, because `x.store(2000)` happens before `y.store(11)`.\n\n\
    All other values for x and y are possible. Here are three possible interleavings\
    \ resulting in the three different values for x and y.\n\n+   1. thread1 is completely\
    \ executed before thread2.\n+   2. thread2 is completely executed before thread1.\n\
    +   3. thread1 executes its first instruction `x.store(2000)` before thread2 is\
    \ completely executed.\n\nNow all values for x and y."
