    # ### 4.1.1 Parallel and Vectorized Execution


    Whether an algorithm runs in a parallel and vectorized way depends on many factors.
    For example, it depends on whether the CPU and the operating system support SIMD
    instructions. Additionally, it also depends on the compiler and the optimization
    level you used to translate your code.


    The following example shows a simple loop for filling a vector.


