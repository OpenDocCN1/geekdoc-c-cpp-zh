  md: '# # 11. Best Practices


    ![](img/d61a6c83410484053b8892275d2fcc4f_547_0.png)


    This chapter provides you with a simple set of rules for writing well-defined
    and fast, concurrent programs in modern C++. Multithreading, particularly parallelism
    and concurrency, is quite a new topic in C++; therefore, more and more best practices
    are discovered in the coming years. Consider the rules in this chapter not as
    a complete list; but rather as a necessary starting point that evolves. This holds
    particularly true for the parallel STL. When updating this book (12/2018), the
    parallel algorithms of C++17 are only partially available; therefore, it is too
    early to formulate best practices for it.


    # ## 11.1 General


    Let’s start with a few very general best practices that apply to atomics and threads.


    # ### 11.1.1 Code Reviews


    Code reviews should be part of each professional software development process.
    This holds especially true when you deal with concurrency. Concurrency is inherently
    complicated and requires a lot of thoughtful analysis and experience.


    To make the review most effective, send the code you want to discuss to the reviewers
    before the review. Explicitly state which invariants should apply to your code.
    The reviewers should have enough time to analyze the code before the official
    review starts.


    Not convinced? Let me give you an example. Do you remember the data races in the
    program `readerWriterLock.cpp` in the chapter `std::shared_lock`?'
