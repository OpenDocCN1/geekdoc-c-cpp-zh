    \n# # Lifetime Challenges of Coroutines\n\nOne of the challenges of dealing with\
    \ coroutines is to handle the lifetime of the coroutine. In the previous program\
    \ `eagerFutureWithComments.cpp`, I stored the coroutine result in a `std::shared_ptr`.\
