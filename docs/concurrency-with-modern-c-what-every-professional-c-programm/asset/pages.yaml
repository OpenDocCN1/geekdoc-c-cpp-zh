    # 7.3.3 transaction_safe Versus transaction_unsafe Code


    You can declare a function as transaction_safe or attach the transaction_unsafe
    attribute to it.


    transaction_safe versus transaction_unsafe


    ```

    int transactionSafeFunction() transaction_safe;

    ```


    ```

    [[transaction_unsafe]] int transactionUnsafeFunction();

    ```


    transaction_safe belongs to the type of the function. What does transaction_safe
    mean? A transaction_safe function is, according to the proposal N4265^28, a function
    that has a transaction_safe definition. This holds if the following properties
    do not apply to its definition:


    +   * It has a volatile parameter or a volatile variable.

    +   * It has transaction-unsafe statements.

    +   * If the function uses a constructor or destructor of a class in its body
    that has a volatile non-static member.


    Of course, this definition of transaction_safe is not sufficient because it uses
    the term transaction-unsafe. You can read the proposal N4265^29 for the details.'
