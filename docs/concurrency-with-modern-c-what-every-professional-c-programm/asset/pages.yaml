    # 7.2.2 Five New Concepts


    There are five new concepts for futures and promises in proposal 1054R0<sup>19</sup>.


    +   - **FutureContinuation**, invocable objects that are called with the value
    or exception of a future as an argument.

    +   - **SemiFuture**, which can be bound to an executor, an operation that produces
    a `ContinuableFuture` (`f = sf.via(exec)`).

    +   - **ContinuableFuture**, which refines SemiFuture and instances can have one
    `FutureContinuation` attached to them (`f.then(c)`), which is executed on the
    future’s associated executor when the future becomes ready.

    +   - **SharedFuture**, which refines `ContinuableFuture` and instances can have
    multiple `FutureContinuations` attached to them.

    +   - **Promise**, each associated with a future and makes the future ready with
    either a value or an exception.


    The paper also provides the declaration of these new concepts.


    <sup>19</sup> http://www.open-std.org/jtc1/sc22/wg21/docs/papers/2018/p1054r0.html'
