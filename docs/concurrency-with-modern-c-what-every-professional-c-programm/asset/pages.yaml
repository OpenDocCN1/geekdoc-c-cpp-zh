    # ## 12.6.4 The Comparison


    The non-synchronized version is about 18 times faster than the version using lock
    and about 50 - 150 times faster than the version using locks. The synchronized
    version using atomics is about 2.5 times faster than the version using locks.
    This difference holds for Linux and Windows. The performance numbers seem to speak
    a clear statement against synchronization with locks or atomics, but you have
    to consider that this was a synchronization-heavy job. Additionally, when you
    have to synchronize only a few times, a lock or a atomic may be your best and
    sufficiently performant version.


    # ## 12.7 Scalability


    How is your data structure''s performance characteristic when the number of concurrent
    clients increases or the data structure is bounded? These are two questions which
    you should have to answer. Scalability means a 1 to 1 relation between clients
    of the data structure and the throughput.'
