  md: '# 3.8 Latches and Barriers (C++20)


    Latches and barriers are coordination types that enable some threads to block
    until a counter becomes zero. At first, don''t confuse the new barriers with memory
    barriers, also known as fences. In C++20 we get latches and barriers in two variations:
    `std::latch`, and `std::barrier`. Concurrent invocations of the member functions
    of a `std::latch` or a `std::barrier` produce no data race.


    First, there are two questions:


    +   1. What are the differences between these two mechanisms to coordinate threads?
    You can use a `std::latch` only once, but you can use a `std::barrier` more than
    once. A `std::latch` helps to manage one task by multiple threads. A `std::barrier`
    helps to manage repeated tasks by multiple threads. Additionally, a `std::barrier`
    enables you to execute a function in the so-called completion step. The completion
    step is the state when the counter becomes zero.

    +   2. What use cases do latches and barriers support that cannot be done in C++11
    and C++14 with futures, threads, or condition variables combined with locks? Latches
    and barriers address no new use cases, but they are a lot easier to use. They
    are also more performant because they often use a lock-free mechanism internally.


    # 3.8.1 std::latch


    Now, let us have a closer look at the interface of a `std::latch`.


    Member functions of a `std::latch` lat


    | Member function | Description |

    | --- | --- |

    | `std::latch lat{cnt}` | Creates a `std::latch` with counter `cnt`. |

    | `lat.count_down(upd = 1)` | Atomically decrements the counter by `upd` without
    blocking the caller. |

    | `lat.try_wait()` | Returns true if counter `== 0`. |

    | `lat.wait()` | Returns immediately if counter `== 0`. If not blocks until counter
    `== 0`. |

    | `lat.arrive_and_wait(upd = 1)` | Equivalent to `count_down(upd); wait();`. |

    | `std::latch::max` | Returns the maximum value of the counter supported by the
    implementation |


    The default value for `upd` is 1. When `upd` is greater than the counter or negative,
    the behavior is undefined. The call `lat.try_wait()` never actually waits, as
    its name suggests.


    The following program boss_workers.cpp uses two `std::latch` to build a boss-workers
    workflow. I synchronized the output to `std::cout` using the function synchronizedOut
    (line 13). This synchronization'
