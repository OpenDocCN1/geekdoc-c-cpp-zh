  md: '![](img/d61a6c83410484053b8892275d2fcc4f_462_0.png)


    # ## Auto-Vectorisation


    Auto-vectorisation is the compiler''s job to produce the best machine code for
    the given architecture. Often there are many obstacles to generate the most efficient
    code for a given machine:


    According to the chapter *Using Automatic Vectorization*^19 to the INTEL C++ Compiler
    they are:


    +   - Non-contiguous memory access lead to inefficient loads/stores

    +   - Data dependencies between iteration steps.

    +   - Countable (the number of iterations of a loop can be determined before the
    loop is entered)


    There are more challenges for auto-vectorisation


    +   - Dependent execution or function calls in loops

    +   - Outer loops (loops containing other loops)

    +   - Threads (calls to mutexes or atomics)


    The SIMD extension in C++ consists now of two data-parallel vectors and special
    operations on them.


    # ### 7.5.1 Data-Parallel Vectors


    The data-parallel vectors are `std::simd` and `std::simd_mask`;


    ```

    ```cpp

    template< class T, class Abi = simd_abi::compatible<T> >

    class simd;


    template< class T, class Abi = simd_abi::compatible<T> >

    class simd_mask;

    ```

    ```


    +   - T is the element type of the vectors.

    +   - Abi stands for the number of elements and storage.


    The element type of `simd_mask` is `bool` and `simd_mask<T, Abi>::size()` is always
    `simd<T, Abi>::size()`.


    # ### 7.5.2 The Interface of the Data-Parallel Vectors


    The data-parallel vector library supports tags for the ABI and alignment, various
    operations, and traits.


    ^19 https://software.intel.com/en-us/cpp-compiler-developer-guide-and-reference-using-automatic-vectorization'
