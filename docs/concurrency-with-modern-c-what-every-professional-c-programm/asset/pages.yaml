  md: '# # 10. Concurrent Architecture


    ![](img/d61a6c83410484053b8892275d2fcc4f_509_0.png)


    Cippi designs a building


    The patterns presented in this chapter are classics. The presented patterns are
    very well explained in the invaluable book Pattern-Oriented Software Architecture:
    Patterns for Concurrent and Networked Objects¹. My goal for this chapter is to
    give a concise overview of the Active Object, the Monitor Object. Additionally,
    I write about the Half-Sync/Half-Async pattern and the two strongly related patterns:
    Reactor, and Proactor. As in the last chapter on Synchronization Patterns, I''m
    wearing C++ glasses. Before I dive into the patterns, here are the patterns from
    a birds-eye perspective.


    +   - The **Active Object** design pattern decouples member function execution
    from member function invocation for objects that each reside in their own thread
    of control. The goal is to introduce concurrency by using asynchronous member
    function invocation and a scheduler for handling requests. Wikipedia: Active object¹

    +   - The **Monitor Object** design pattern synchronizes concurrent member function
    execution to ensure that only one member function at a time runs within an object.
    It also allows object''s member functions to schedule their execution sequences
    cooperatively. Pattern-Oriented Software Architecture: Patterns for Concurrent
    and Networked Objects²


    Both patterns synchronize and schedule member function invocation. The main difference
    is that the Active Object executes its member function in a different thread but
    the monitor in the same thread as the client. In contrast to the Active Object
    and the Monitor Object, which have a subsystem focus and are, therefore, typically
    called design patterns, the Half-Sync/Half-Async, the Reactor, and the Proactor
    pattern have system perspective and are consequently called architectural patterns.'
