    \ thr.join();\n\n\n  std::cout << \"account.balance: \" << account.balance <<\
    \ '\\n';\n\n  std::cout << '\\n';\n\n}\n~~~\n```\n\nOne hundred threads are adding\
    \ 50 euros (line 25) to the same account (line 20). They use the function addMoney.\
    \ The critical observation is that the writing to the account is done without\
    \ synchronization. Therefore we have a data race, and the result is not valid.\
    \ This is undefined behavior, and the final balance (line 30) differs between\
    \ 5000 and 5100 euro."
