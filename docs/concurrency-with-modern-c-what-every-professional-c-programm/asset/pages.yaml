  md: '# 7.5.2.1 Tags


    The tags let you specify and ask for the ABI and the alignment.


    # 7.5.2.1.1 ABI Tags


    The ABI tag indicates a choice of size and binary representation for objects of
    the vector type.


    **ABI tags**


    | ABI tags | Description |

    |---|---|

    | `scalar` | Tag type for storing a single element. |

    | `fixed_size` | Tag type for storing a specified number of elements. |

    | `compatible` | Tag type that ensures ABI compatibility. |

    | `native` | Tag type that is most efficient. |

    | `max_fixed_size` | The maximum number of elements guaranteed to be supported
    by fixed. |


    # 7.5.2.1.2 Alignment Tags


    The alignment tags indicate the alignment of the elements and the vector type.


    **Alignment tags**


    | Alignment tags | Description |

    |---|---|

    | `element_aligned_tag` and `element_aligned` | Tag type that indicates the alignment
    of the elements. |

    | `vector_aligned_tag` and `vector_aligned` | Tag type that indicates the alignment
    of the vector type. |

    | `overaligned_tag` and `overaligned` | Tag type that indicates the specified
    alignment. |


    # 7.5.2.2 Where Expression


    The where expression abstracts the operation of selected elements of a given object
    of arithmetic or data-parallel type.'
