    # ## 12.6 Contention


    Do concurrent client requests seldom or often use your data structure? When the
    contention is low, straightforward synchronization primitives such as locks are
    usually fast enough. Using sophisticated and challenging solutions such as atomics
    could be overkill. Before you go for the advanced solutions, you should measure.
    To get an idea, how expensive locks are, let me make a straightforward test.


    Now, I can make it short. I already did this test in the chapter Calculating the
    Sum of a Vector. I filled a std::vector with one hundred million arbitrary but
    uniformly distributed² numbers between 1 and 10. Then I calculated the sum of
    the numbers in various ways. Two ways are, in particular, interesting for this
    section.


