- pgno: 231
  md: "# Condition variables versus tasks\n\n| Criteria | Condition Variables | Tasks\
    \ |\n|---|---|---|\n| Multiple synchronizations | Yes | No |\n| Critical section\
    \ | Yes | No |\n| Error handling in receiver | No | Yes |\n| Spurious wakeup |\
    \ Yes | No |\n| Lost wakeup | Yes | No |\n\nThe advantage of a condition variable\
    \ to a promise and future is that you can use condition variables to synchronize\
    \ threads multiple times. In contrast to that, a promise can send its notification\
    \ only once, so you have to use more promise and future pairs to get the condition\
    \ variable's functionality. If you use the condition variable for only one synchronization,\
    \ the condition variable is a lot more challenging to use in the right way. A\
    \ promise and future pair needs no shared variable and therefore no lock and is\
    \ not prone to spurious or lost wakeups. In addition to that, tasks can handle\
    \ exceptions. There are lots of reasons to prefer tasks to condition variables.\n\
    \nDo you remember how difficult it was to use condition variables? If not, here\
    \ are the key parts required to synchronize two threads.\n\n```\n```cpp\nvoid\
    \ waitingForWork(){\n    std::cout << \"Worker: Waiting for work.\" << '\\n';\n\
    \n    std::unique_lock<std::mutex> lck(mutex_);\n    condVar.wait(lck, []{ return\
    \ dataReady; });\n    doTheWork();\n    std::cout << \"Work done.\" << '\\n';\n\
    }\n\nvoid setDataReady(){\n    std::lock_guard<std::mutex> lck(mutex_);\n    dataReady=true;\n\
    \    std::cout << \"Sender: Data is ready.\" << '\\n';\n    condVar.notify_one();\n\
    }\n```\n```\n\nThe function setDataReady performs the notification part of the\
    \ synchronization - the function waitingForWork the waiting part of the synchronization.\n\
    \nHere is the same workflow with tasks."
