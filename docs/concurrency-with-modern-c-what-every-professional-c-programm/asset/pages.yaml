    # ### 4.5.2 GCC Compiler


    My Linux computer has only four cores. Here are the numbers.


    ![](img/d61a6c83410484053b8892275d2fcc4f_264_0.png)


    Sequential, parallel, and parallel and vectorized execution using the GCC Compiler


    The numbers are as expected. I have four cores and the parallel execution is about
    four times faster than the sequential execution. The performance numbers of the
    parallel and vectorized version and the parallel version are in the same ballpark.
    My assumption is, therefore, that the GCC compiler uses the same strategy such
    as the Windows compiler. When I ask for the parallel and vectorized execution
    by using the execution policy `std::execution::par_unseq`, I get the parallel
    execution policy (`std::execution::par`). This behavior is according to the C++17
    standard because the execution policies are only a hint for the compiler.


    # ## Distilled Information


    +   - With C++17, most of the STL algorithms are available in a parallel implementation.
    This makes it possible to invoke an algorithm with a so-called execution policy.
    This policy specifies whether the algorithm runs sequentially, in parallel, or
    in parallel with additional vectorization.

    +   - Additionally to the 69 algorithms available in overloaded versions for parallel
    or parallel and vectorized execution, we get new algorithms. These new ones are
    well suited for parallel reducing, scanning, or transforming ranges.'
