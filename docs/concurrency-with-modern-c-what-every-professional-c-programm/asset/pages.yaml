    The result is that the program always returns 10000. Boring? No, it''s reassuring!


    ![](img/d61a6c83410484053b8892275d2fcc4f_107_0.png)


    The atomic counter with relaxed semantic


    A typical example of an atomic counter which uses the relaxed semantic is the
    reference counter of std::shared_ptr. The relaxed semantic only holds for the
    increment operation. The critical property for incrementing the reference counter
    is that the operation is atomic. The order of the increment operations does not
    matter. The relaxed semantic does not hold for the decrement of the reference
    counter. These operations need an acquire-release semantic for the destructor.


    # ### The add algorithm is wait-free


    Have a closer look at the function add in line 10. There is no synchronization
    involved in the increment operation (line 13). The value 1 is just added to the
    atomic count.


    Therefore, the algorithm is not only lock-free but it is also wait-free.


    The fundamental idea of std::atomic_thread_fence is to establish synchronization
    and ordering constraints between threads without an atomic operation.'
