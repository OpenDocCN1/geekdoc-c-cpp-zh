  md: '# Distilled Information


    +   - The memory model is a contract between the programmer and the system. The
    system consists of the compiler that generates machine code, the processor that
    executes the machine code and includes the different caches that store the program''s
    state.

    +   - The C++ memory model has to deal with the following questions:

    +     - Which operations are atomic?

    +     - Which ordering of operations is guaranteed?

    +     - What are the visible effects on shared variables to other threads?

    +   - The foundation of the contract are operations on atomics that have two characteristics:
    They are by definition atomic, and they create synchronization and order constraints
    on the program execution.

    +   - C++20 support atomics for integrals, floating-points, pointers, and smart
    pointers.

    +   - The class template std::atomic_ref applies atomic operations to the referenced
    object.

    +   - Roughly speaking, there are three different types of synchronization and
    ordering constraints in C++:

    +     - Sequential consistency (default)

    +     - Acquire-release semantic

    +     - Relaxed semantic'
