  md: '# ### 10.3.3 Components


    ![](img/d61a6c83410484053b8892275d2fcc4f_528_0.png)


    Half-Sync/Half-Async


    The Half-Sync/Half-Async pattern consists of four components.


    +   - Synchronous service layer

    +     - The synchronous service layer performs high-level services. Typically,
    the high-level services run in a separate thread.

    +     - Services of this layer can block.

    +   - Asynchronous service layer

    +     - The asynchronous service layer performs low-level services.'
  merge: -1
  img_proc: true
- pgno: 529
  md: '+   - Services in this layer cannot block.

    +   - **Queuing layer**

    +     - The queuing layer serves as a communication channel between the synchronous
    and asynchronous layers.

    +     - It notifies a layer when messages are passed from the other layer.

    +   - **External event source**

    +     - Creates external events for the asynchronous service layer.


    # ### 10.3.4 Dynamic Behavior


    +   - **Asynchronous phase**

    +     - External sources send notifications to the asynchronous layer.

    +     - The asynchronous service sends its result to the synchronous service using
    the queueing layer.

    +   - **Queuing phase**

    +     - Buffers input from the asynchronous layer and notifies the synchronous
    layer.

    +   - **Synchronous phase**

    +     - Process the input from the queueing layer provided by the asynchronous
    layer.


    # ### 10.3.5 Advantages and Disadvantages


    What are the advantages and disadvantages of the Half-Sync/Half-Async pattern?


    +   - **Advantages:**

    +     - A clear separation of asynchronous and synchronous services. Low-level
    system services are handled in the asynchronous, and high-level services are handled
    in the synchronous layer.

    +     - The queueing layer ensures the loose coupling of the asynchronous and
    the synchronous layer.

    +     - The clear separation makes the software easier to understand, debug, maintain,
    and extend.

    +     - Blocking in the synchronous services does not affect the asynchronous
    services.


    +   - **Disadvantages:**

    +     - The boundary-crossing between the asynchronous and synchronous layer may
    cause overhead. Often, the boundary-crossing involves a context switch between
    the kernel-space and the user-space because the asynchronous services run typically
    in the kernel-space and the synchronous services in the user-space.

    +     - The strict separation of the layers requires that the data is either copied
    or is immutable.

    +     - Due to the inverted flow of control, debugging and testing is challenging.'
