    Task blocks ensure that the outermost task block''s creator thread (lines 2 -
    14) is the same thread that runs the statements after finishing the task block.
    This means that the thread that executes line 2 is the same thread that executes
    lines 15 and 16. This guarantee does not hold for nested task blocks; therefore,
    the task block''s creator thread in lines 6 - 8 does not automatically execute
    lines 9 and 10. If you need that guarantee, you should use the function define_task_block_restore_thread
    (line 4). It holds that the creator thread executing line 4 is the same thread
    running lines 12 and 13.


    # ### 7.4.3 The Interface


    A task block has a minimal interface. You cannot construct, destroy, copy, or
    move an object of the class task_block; you have to use either function define_task_block
    or define_task_block_restore_thread. The task block tb is in the scope of the
    defined task block active and can start new tasks (tb.run) or wait (tb.wait) until
    the task is done.


    ```

    ```cpp

    The minimal interface of a task block


    1     define_task_block([&](auto& tb){

    2         tb.run([&]{ process(x1, x2) });

    3         if (x2 == x3) tb.wait();

    4         process(x3, x4);

    5     });

    ```

    ```


    What is the code snippet doing? In line 2 a new task is started. This task needs
    the data x1 and x2. Line 4 uses the data x3 and x4. If x2 == x3 is true, the variables
    must be protected from shared access. This is why the task block tb waits until
    the task in line 2 is done.


    If the functions task_block::run or task_block::wait detect that an exception
    is pending within the current task block they throw an exception of kind task_cancelled_exception.'
