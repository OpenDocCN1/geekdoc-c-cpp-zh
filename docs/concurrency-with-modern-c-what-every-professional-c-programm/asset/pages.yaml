    # #### 14.2.2.2 A Simple Garbage Collector for Nodes


    I discussed in the section about the lock-free stack implementation leaking memory
    that concurrent execution of more than one topAndPush call is a Race Condition.
    Consequently, I can safely delete a node if not more than one topAndPush call
    is concurrently executing. This observation is crucial for solving this memory
    leak issue: I store removed nodes on a to be deleted list, and I delete the nodes
    on this list if no more than one topAndPush call is active. There is only one
    challenge left: How can I be sure that not more than one topAndPush call is active?
    I use an atomic counter that is incremented at the start of topAndPush and decremented
    at its end. The counter is zero or one if no or one topAndPush call is active.


    The following program implements the presented strategy. I use the lockFreeStackWithLeaks.cpp
    as starting point.'
