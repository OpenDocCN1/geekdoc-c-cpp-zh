  md: '# ## 10.2 Monitor Object


    The Monitor Object design pattern synchronizes concurrent member function execution
    to ensure that only one member function at a time runs within an object. It also
    allows an object''s member functions to schedule their execution sequences cooperatively.
    This pattern is also known as Thread-Safe Passive Object.


    # ### 10.2.1 Challenges


    If many threads access a shared object concurrently, the following challenges
    exist.


    +   1. Due to the concurrent access, the shared object must be protected from
    non-synchronized read and write operations to avoid data races.

    +   2. The necessary synchronization should be part of the implementation and
    not part of the interface.

    +   3. When a thread is done with the shared object, a notification should be
    triggered so that the next thread can use the shared object. This mechanism helps
    avoid deadlocks and improves the system''s overall performance.

    +   4. After the execution of a member function, the invariants of the shared
    object must hold.


    # ### 10.2.2 Solution


    A client (thread) can access the Monitor Object''s synchronized member functions,
    and due to the monitor lock, only one synchronized member function can run at
    any given point in time. Each Monitor Object has a monitor condition that notifies
    the waiting clients.


    # ### 10.2.3 Components


    The Monitor Object consists of four components.'
