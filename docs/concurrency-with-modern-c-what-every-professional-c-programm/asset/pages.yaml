  md: '# 3.7 Semaphores (C++20)


    Semaphores are a synchronization mechanism used to control concurrent access to
    a shared resource. A counting semaphore is a semaphore that has a counter that
    is bigger than zero. The constructor initializes the counter. Acquiring the semaphore
    decreases the counter, and releasing the semaphore increases the counter. If a
    thread tries to acquire the semaphore when the counter is zero, the thread will
    block until another thread increments the counter by releasing the semaphore.


    # Edgar W. Dijkstra invented semaphores


    The Dutch computer scientist Edgar W. Dijkstra<sup>15</sup> presented in 1965
    the concept of a semaphore. A semaphore is a data structure with a queue and a
    counter. The counter is initialized to a value equal to or greater than zero.
    It supports the two operations wait and signal. Operation wait acquires the semaphore
    and decreases the counter. It blocks the thread from acquiring the semaphore if
    the counter is zero. Operation signal releases the semaphore and increases the
    counter. Blocked threads are added to the queue to avoid starvation<sup>17</sup>.


    Originally, a semaphore was a railway signal.


    ![](img/d61a6c83410484053b8892275d2fcc4f_192_0.png)


    Semaphore


    The original uploader was AmosWolfe at English Wikipedia. - Transferred from en.wikipedia
    to Commons., CC BY 2.6.<sup>18</sup>


    C++20 supports a `std::binary_semaphore`, which is an alias for a `std::counting_semaphore<1>`.
    In this


    +   15. https://en.wikipedia.org/wiki/Edgar_W._Dijkstra

    +   17. https://en.wikipedia.org/wiki/Starvation_(computer_science)

    +   18. https://commons.wikimedia.org/w/index.php?curid=1972304'
