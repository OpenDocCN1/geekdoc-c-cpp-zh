  md: 'C++ supports two kinds of threads: the basic thread `std::thread` (C++11) and
    the improved thread `std::jthread` (C++20). First, I write about the basic thread,
    and at the end of this section, I discuss the improved thread.


    # # 3.1 The Basic Thread `std::thread`


    To launch a thread in C++, you have to include the `<thread>` header.


    # ## 3.1.1 Thread Creation


    A thread `std::thread` represents an executable unit. This executable unit, which
    the thread immediately starts, gets its work package as a `callable unit`. A thread
    is not copy-constructible or copy-assignable but move-constructible or move-assignable.


    A callable unit is an entity that behaves like a function. Of course, it can be
    a function but also a `function object`, or a lambda function. The return value
    of the callable unit is ignored.


    After discussing theory, here is a small example.


    Creation of a thread with callable units


    ```

    ```cpp

    1  // createThread.cpp

    2

    3  #include <iostream>

    4  #include <thread>

    5

    6  void helloFunction(){

    7    std::cout << "Hello from a function." << ''\n'';

    8  }

    9

    10 class HelloFunctionObject{

    11 public:

    12   void operator()() const {

    13     std::cout << "Hello from a function object." << ''\n'';

    14   }

    15 };

    16

    17 int main(){

    18

    19   std::cout << ''\n'';

    20

    21   std::thread t1(helloFunction);

    22

    23   HelloFunctionObject helloFunctionObject;

    24   std::thread t2(helloFunctionObject);

    ```

    ```'
