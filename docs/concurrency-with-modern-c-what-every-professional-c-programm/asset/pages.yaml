    +   - It isn''t easy to make predictions about the future, but I try.

    +   - An executor consists of a set of rules about where, when, and how to run
    a callable. They are the basic building block to execute and specify if callables
    should run on an arbitrary thread, a thread pool, or even single-threaded without
    concurrency.

    +   - Tasks called promises and futures, introduced in C++11, have a lot to offer,
    but they also have drawbacks: tasks are not composable into powerful workflows.
    That limitation does not hold for the extended futures in C++23. Therefore, an
    extended future becomes ready when its predecessor becomes ready, when any one
    of its predecessors becomes ready, or when all of its predecessors becomes ready.

    +   - Transactional memory is based on the ideas underlying transactions in database
    theory. A transaction is an action that provides the first three properties of
    ACID database transactions: Atomicity, Consistency, and Isolation. The new standard
    has transactional memory in two flavors: synchronized blocks and atomic blocks.
    Both behave as if a global lock protected them.

    +   - Task blocks implement the fork-join paradigm in C++. They consist of a fork
    phase in which you launch tasks and a join phase in which you synchronize them.

    +   - The data-parallel vector library provides data-parallel (SIMD) programming
    via vector types. SIMD means that one operation is performed on many data in parallel.'
