    # ### 7.5.2.6 Mask Reduction


    Applies the predicate only to these elements of the SIMD vector `v[i]` for which
    the mask `m[i] == true` holds.


    Mask Reduction


    | Mask Reduction | Description |

    | :--- | :--- |

    | `all_of, any_of, none_of, and some_of` | Applies the predicates on each element
    `v[i]` for which the mask `m[i] == true` holds. |

    | `popcount` | Return the number of true values. |

    | `find_first_set and find_last_set` | Return the position of the first or last
    true value. |


    # ### 7.5.2.7 Traits


    Traits give you SIMD characteristics at compile time.'
