  md: '+   2. **Never ever** call an unknown function while holding a lock. If the
    function `getvar` tries to lock the mutex `m`, the program has undefined behavior
    because `m` is not a recursive mutex. Most of the time, undefined behavior causes
    a deadlock.


    +   3. Avoid calling a function while holding a lock. Maybe the function is from
    a library, and you get a new version of the library, or the function is rewritten.
    There is always the danger of a deadlock.


    The more locks your program needs, the more challenging it becomes. The dependency
    is very non-linear.


    # **3.3.1.1.2 Lock Mutexes in Different Order**


    Here is a typical scenario of a deadlock resulting from locking in a different
    order.


    ![](img/d61a6c83410484053b8892275d2fcc4f_147_0.png)


    Deadlock of two threads


    Thread 1 and thread 2 need access to two resources to finish their work. The problem
    arises when the requested resources are protected by two separate mutexes and
    are requested in different orders (Thread 1: Lock 1, Lock 2; Thread 2: Lock 2,
    Lock 1). In this case, the thread executions interleave so that thread 1 gets
    mutex 1, then thread 2 gets mutex 2, and we reach a standstill. Each thread wants
    to get the other''s mutex, but the other thread has to release it first to get
    the other mutex. The expression “deadly embrace” describes this kind of deadlock
    very well.


    Translating this picture into code is easy.'
