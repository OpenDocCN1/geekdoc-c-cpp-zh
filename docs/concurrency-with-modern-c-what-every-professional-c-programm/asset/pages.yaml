    A release sequence


    More formally, the N4659: Working Draft, Standard for Programming Language C++17.


    # ## Release Sequence


    A release sequence headed by a release operation A on an atomic object M is a
    maximal contiguous sub-sequence of side effects in the modification order of M,
    where the first operation is A, and every subsequent operation * is performed
    by the same thread that performed A, or * is an atomic read-modify-write operation.


    1) http://www.open-std.org/jtc1/sc22/wg21/docs/papers/2017/n4659.pdf'
