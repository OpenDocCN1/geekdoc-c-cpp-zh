  md: '# ### 7.1.5 Terminology


    The Proposal P0761^13^ defines a few new terms for the execution of a callable:


    +   - **Execution resource**: is an instance of hardware or software capability
    of executing a callable. An execution unit can range from a SIMD vector unit to
    an entire runtime managing a large collection of threads. Execution resources
    such as a CPU or a GPU are heterogeneous because they have different freedoms
    and restrictions.

    +   - **Execution context**: a program object representing a specific collection
    of execution resources and the execution agents within those resources. Typical
    examples are a thread pool or a distributed or a heterogeneous runtime.

    +   - **Execution agent**: is a unit of execution of a specific execution context
    that is mapped to a single invocation of a callable on an execution resource.
    Typical examples are a CPU thread or a GPU execution unit.

    +   - **Executor**: is an object associated with a specific execution context.
    It provides one or more execution functions for creating execution agents from
    a callable function object.


    # ### 7.1.6 Execution Functions


    According to the previous paragraph, an executor provides one or more execution
    function for creating execution agents from a callable. An executor has to support
    at least one of the six following functions.


    **The execution functions of an executor**


    | Name | Cardinality | Direction |

    |---|---|---|

    | execute | single | oneway |

    | twoway_execute | single | twoway |

    | then_execute | single | then |

    |  |  |  |

    | bulk_execute | bulk | oneway |

    | bulk_twoway_execute | bulk | twoway |

    | bulk_then_execute | bulk | then |


    Each execution function has two properties: cardinality and direction.


    +   - **Cardinality**

    +     - single: creates one execution agents

    +     - bulk: creates a group of execution agents

    +   - **Direction**

    +     - oneway: creates an execution agent and does not return a result


    13 http://www.open-std.org/jtc1/sc22/wg21/docs/papers/2018/p0761r2.pdf'
