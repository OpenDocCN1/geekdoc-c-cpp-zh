  md: "A typical example of an atomic operation, in which the sequence of operations\
    \ doesn't matter, is a counter. The critical observation for a counter is not\
    \ how the different threads increment the counter; the critical observation in\
    \ a counter is that all increments are atomic and that all increments are done\
    \ at the end. Have a look at the following example.\n\nA counter with relaxed\
    \ semantic\n\n```\n```cpp\n1  // relaxed.cpp\n2  \n3  #include <vector>\n4  #include\
    \ <iostream>\n5  #include <thread>\n6  #include <atomic>\n7  \n8  std::atomic<int>\
    \ count = {0};\n9  \n10 void add()\n11 {\n12   for (int n = 0; n < 1000; ++n)\
    \ {\n13     count.fetch_add(1, std::memory_order_relaxed);\n14   }\n15 }\n16 \n\
    17 int main()\n18 {\n19   std::vector<std::thread> v;\n20   for (int n = 0; n\
    \ < 10; ++n) {\n21     v.emplace_back(add);\n22   }\n23   for (auto& t : v) {\n\
    24     t.join();\n25   }\n26   std::cout << \"Final counter value is \" << count\
    \ << '\\n';\n27 }\n```\n```\n\nThe three most exciting lines are 13, 24, and 26.\n\
    \nIn line 13, the atomic number count is incremented using the relaxed semantic,\
    \ so we have a guarantee that the operation is atomic. The fetch_add operation\
    \ establishes an ordering on count. The function add (lines 10 - 15) is the work\
    \ package of the threads. Each thread gets its work package on line 21.\n\nThread\
    \ creation is one synchronization point - the other one being t.join() on line\
    \ 24.\n\nThe creator thread synchronizes with all its children in line 24. It\
    \ waits with the t.join() call until all its children are done. t.join() is why\
    \ the results of the atomic operations are published. To say it more formally:\
    \ t.join() is a release operation."
