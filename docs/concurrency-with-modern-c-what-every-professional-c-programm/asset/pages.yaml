  md: 'acquire-release semantic for atomic operations. The acquire-release semantic
    is an area where C# and Java do not follow. That''s also an area where our intuition
    begins to wane.


    # ### 2.4.3 Acquire-Release Semantic


    There is no global synchronization between threads in the acquire-release semantic;
    there is only synchronization between atomic operations on the **same atomic variable**.
    A write operation on one thread synchronizes with a read operation on another
    thread on the same atomic variable.


    The acquire-release semantic is based on one fundamental idea: a release operation
    synchronizes with an acquire operation on the same atomic and establishes an ordering
    constraint. The ordering constraint means all read and write operations cannot
    be moved after a release operation. All read and write operations cannot be moved
    before an acquire operation.


    What is an acquire or a release operation? The reading of an atomic variable with
    load or test_and_set is an acquire operation. There is more: releasing a lock
    or mutex synchronizes-with the acquiring of a lock or a mutex. The construction
    of a thread synchronizes-with the invocation of the callable. The completion of
    the thread synchronizes-with the join-call. The completion of the callable of
    the task synchronizes-with the call to wait or get in the future. Acquire and
    release operations come in pairs.


    It helps a lot to keep that picture in mind.


    ![](img/d61a6c83410484053b8892275d2fcc4f_89_0.png)


    # ## The memory model for a deeper understanding of multithreading


    This is the main reason you should keep the memory model in mind. Acquire-release
    semantic helps you get a better understanding of the high-level synchronization
    primitives such as a mutex. The same reasoning holds for the starting of a thread
    and the join-call on a thread. Both are acquire-release operations. The story
    goes on with the wait and notify_one call on a condition variable; wait is the
    acquire, and notify_one the release operation. What''s about notify_all? That
    is a release operation as well.'
