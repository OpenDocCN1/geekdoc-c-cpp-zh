- pgno: 576
  md: '# ### 11.3.4 Don’t build your abstraction, use guarantees of the language


    Thread-safe initialization of a shared variable can be done in various ways. You
    can rely on guarantees of the C++ runtime such as constant expressions, static
    variables with block scope, or use the function `std::call_once` in combination
    with the flag `std::once_flag`. We program in C++; therefore, you can build your
    abstraction based on atomics using even the highly sophisticated acquire-release
    semantic. Don’t do this in the first place unless you have to do it. This means
    if you have identified a bottleneck by measuring the performance of a critical
    code path, only make the change if you know that your handcrafted version outperforms
    the default guarantees of the language.


    # ### 11.3.5 Don’t reinvent the wheel


    Writing thread-safe data structures is quite a challenging endeavor. Writing lock-free
    data-structures is way harder; therefore, use existing libraries such as Boost.Lockfree¹⁰
    or CDS¹¹.


    # #### 11.3.5.1 Boost.Lockfree


    Boost.Lockfree supports three different data structures:


    +   - **Queue**: a lock-free multi-produced/multi-consumer queue

    +   - **Stack**: a lock-free multi-produced/multi-consumer stack

    +   - **spsc_queue**: a wait-free single-producer/single-consumer queue (commonly
    known as ring buffer)


    # #### 11.3.5.2 CDS


    CDS stands for Concurrent Data Structures and contains many intrusive (non-owning)
    and non-intrusive (owning) containers. The containers of the Standard Template
    Library are non-intrusive because they automatically manage their elements.


    +   - Stacks (lock-free)

    +   - Queues and priority-queues (lock-free)

    +   - Ordered lists

    +   - Ordered sets and maps (lock-free and lock-based)

    +   - Unordered sets and maps (lock-free and lock-based)


    ¹⁰ http://www.boost.org/doc/libs/1_66_0/doc/html/lockfree.html

    ¹¹ http://libcds.sourceforge.net/'
