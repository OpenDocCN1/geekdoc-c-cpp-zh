  md: "**Shared mutex variations**\n\n| Member function | shared_timed_mutex | shared_mutex\
    \ |\n|---|---|---|\n| m.unlock_shared | yes | yes |\n\nThe std::shared_timed_mutex(std::shared_mutex)\
    \ enables you to implement reader-writer locks. This means you can use std::shared_timed_mutex\
    \ (std::shared_mutex) for exclusive or for shared locking. You get an exclusive\
    \ lock, if you put the std::shared_timed_mutex (std::shared_mutex) into a std::lock_guard\
    \ or into a std::unique_lock; you get a shared lock, if you put the std::shared_timed_mutex\
    \ (std::shared_mutex) into a std::shared_lock. The member functions m.try_lock_for(relTime)\
    \ and m.try_lock_shared_for(relTime) need a relative time duration; the member\
    \ functions m.try_lock_until(absTime) and m.try_lock_shared_until(absTime) need\
    \ an absolute time point.\n\nm.try_lock (m.try_lock_shared) tries to lock the\
    \ mutex and returns immediately. On success, it returns true, otherwise false.\
    \ In contrast the member functions m.try_lock_for (m.try_lock_shared_for) and\
    \ m.try_lock_until (m.try_lock_shared_until) try to lock until the specified time\
    \ out occurs or the lock is acquired, whichever comes first. You should use a\
    \ steady clock for your time constraint. A steady clock can not be adjusted.\n\
    \nYou should not use mutexes directly; you should put mutexes into locks. Here\
    \ is the reason why.\n\n# ### 3.3.1.1 Issues of Mutexes\n\nThe issues with mutexes\
    \ boil down to one main concern: deadlocks.\n\n# #### Deadlock\n\nA deadlock is\
    \ a state where two or more threads are blocked because each thread waits for\
    \ the release of a resource before it releases its resource.\n\nThe result of\
    \ a deadlock is a total standstill. The thread that tries to acquire the resource,\
    \ and usually the whole program, is blocked forever. Producing a deadlock is easy.\
    \ Curious?\n\n# #### 3.3.1.1.1 Exceptions and Unknown Code\n\nThe small code snippet\
    \ has many issues.\n\n```\n    std::mutex m;\n    m.lock();\n    sharedVariable\
    \ = getVar();\n    m.unlock();\n```\n\nHere are the issues:\n\n+   1. If the function\
    \ `getVar()` throws an exception, the mutex `m` is not released."
