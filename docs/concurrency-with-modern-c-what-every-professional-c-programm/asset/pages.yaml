  md: "# # Thread synchronization with tasks\n\n```\n```cpp\n// promiseFutureSynchronize.cpp\n\
    \n#include <future>\n#include <iostream>\n#include <utility>\n\n\nvoid doTheWork(){\n\
    \  std::cout << \"Processing shared data.\" << '\\n';\n}\n\nvoid waitingForWork(std::future<void>&&\
    \ fut){\n\n  std::cout << \"Worker: Waiting for work.\" << '\\n';\n  fut.wait();\n\
    \  doTheWork();\n  std::cout << \"Work done.\" << '\\n';\n\n}\n\nvoid setDataReady(std::promise<void>&&\
    \ prom){\n\n  std::cout << \"Sender: Data is ready.\" << '\\n';\n  prom.set_value();\n\
    \n}\n\nint main(){\n\n  std::cout << '\\n';\n\n  std::promise<void> sendReady;\n\
    \  auto fut = sendReady.get_future();\n\n  std::thread t1(waitingForWork, std::move(fut));\n\
    \  std::thread t2(setDataReady, std::move(sendReady));\n\n  t1.join();\n  t2.join();\n\
    \n  std::cout << '\\n';\n\n}\n```\n```"
