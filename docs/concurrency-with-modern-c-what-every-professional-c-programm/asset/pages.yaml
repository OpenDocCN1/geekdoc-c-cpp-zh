    All variations of `std::atomic` support the CAS operations.


    # ### 2.3.3.1.5 User Defined Atomics `std::atomic<user-defined type>`


    Thanks to the class template `std::atomic`, you can define your user-defined atomic
    type.


    There are many strong restrictions on a user-defined type if you use it for an
    atomic type `std::atomic<user-defined type>`. The atomic type `std::atomic<user-defined
    type>` supports the same interface as `std::atomic<bool>`.


    Here are the restrictions for a user-defined type to become an atomic type:


    +   - The copy assignment operator for a user-defined type, for all its base classes
    and all non-static members, must be trivial. This means that you must not define
    the copy assignment operator, but you can request it from the compiler using `default`^1.

    +   - a user-defined type must not have virtual member functions or virtual base
    classes


    ^1 http://en.cppreference.com/w/cpp/keyword/default'
