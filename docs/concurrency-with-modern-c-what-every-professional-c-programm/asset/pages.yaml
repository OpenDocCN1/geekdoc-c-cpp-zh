  md: "# # A lock-free stack supporting push\n\n```\n```cpp\n// lockFreeStackPush.cpp\n\
    \n#include <atomic>\n#include <iostream>\n\ntemplate<typename T>\nclass LockFreeStackPush\
    \ {\nprivate:\n    struct Node {\n        T data;\n        Node* next;\n     \
    \   Node(T d): data(d), next(nullptr) {}\n    };\n    std::atomic<Node*> head;\n\
    public:\n    LockFreeStackPush() = default;\n    LockFreeStackPush(const LockFreeStackPush&)\
    \ = delete;\n    LockFreeStackPush& operator= (const LockFreeStackPush&) = delete;\n\
    \n    void push(T val) {\n        Node* const newNode = new Node(val);\n     \
    \   newNode->next = head.load();\n        while ( !head.compare_exchange_strong(newNode->next,\
    \ newNode) );\n    }\n};\n\nint main() {\n\n    LockFreeStackPush<int> lockFreeStack;\n\
    \    lockFreeStack.push(5);\n\n    LockFreeStackPush<double> lockFreeStack2;\n\
    \    lockFreeStack2.push(5.5);\n\n    LockFreeStackPush<std::string> lockFreeStack3;\n\
    \    lockFreeStack3.push(\"hello\");\n\n}\n```\n```\n\nLet me analyze the crucial\
    \ member function push (line 20). It creates the new node (line 21), adjusts its\
    \ next pointer to the old head, and makes the new node in a so-called CAS operation\
    \ the new head (line 22). A CAS operation provides in an atomic step a compare\
    \ and swap operation."
