    ![](img/d61a6c83410484053b8892275d2fcc4f_502_0.png)


    *Thread-Safe Interface with virtual member function*


    There are two typical ways to overcome this issue.


    +   1. Make the member function interface a non-virtual member function. This
    technique is called NVI (Non-Virtual Interface)²⁸. The non-virtual member functions
    guarantees that the interface function of the base class Base is used. Additionally,
    overriding the interface function using override causes a compile-time error because
    there is nothing to override.

    +   2. Declare the member function interface as final: virtual void interface()
    final. Thanks to final, overriding an as final declared virtual member function
    causes a compile-time error.


    Although I presented two ways to overcome this issue, I strongly suggest you prefer
    the NVI idiom. Use early binding if you don''t need late binding (virtuality).


