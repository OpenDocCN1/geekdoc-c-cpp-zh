- pgno: 712
  md: '# ## 18.20 Memory Model


    The memory model defines the relationship between objects and memory location
    and deals with the question: What happens if two threads access the exact memory
    locations.


    # ## 18.21 Modification Order


    All modifications to a particular atomic object M occur in some particular total
    order. This total order is called the modification order of M. Consequently, reads
    of an atomic object by a particular thread never sees “older” values than those
    the thread has already observed.


    # ## 18.22 Monad


    Haskell as a pure functional language has only pure functions. A vital feature
    of these pure functions is that they always return the same result when given
    the same arguments. Thanks to this property called referential transparency^4,
    a Haskell function cannot have side effects; therefore, Haskell has a conceptual
    issue. The world is full of calculations that have side effects. These are calculations
    that can fail, that can return an unknown number of results, or depend on the
    environment. To solve this conceptual issue, Haskell uses monads and embeds them
    in the pure functional language.


    The classical monads encapsulate one side effect:


    +   - **I/O monad**: Calculations that deal with input and output.

    +   - **Maybe monad**: Calculations that maybe return a result.

    +   - **Error monad**: Calculations that can fail.

    +   - **List monad**: Calculations that can have an arbitrary number of results.

    +   - **State monad**: Calculations that build a state.

    +   - **Reader monad**: Calculations that read from the environment.


    The monad concept is from category theory^5, which is a part of the mathematics
    that deals with objects and mapping between these objects. Monads are abstract
    data types (type classes), which transform simple types into enriched types. Values
    of these enriched type are called monadic values. Once in a monad, a value can
    only be transformed by a function composition into another monadic value.


    This composition respects the unique structure of a monad; therefore, the error
    monad interrupts its calculation if an error occurs or the state monad builds
    its state.


    A monad consists of three components:


    ^4 https://en.wikipedia.org/wiki/Referential_transparency


    ^5 https://en.wikipedia.org/wiki/Category_theory'
