  md: '![](img/d61a6c83410484053b8892275d2fcc4f_267_0.png)


    While you can only call a function and return from it, you can call a coroutine,
    suspend and resume it, and destroy a suspended coroutine.


    With the new keywords `co_await` and `co_yield`, C++20 extends the execution of
    C++ functions with two new concepts.


    Thanks to `co_await` expression it is possible to suspend and resume the execution
    of the expression. If you use `co_await` expression in a function `func`, the
    call `auto getResult = func()` does not block if the result of the function is
    not available. Instead of resource-consuming blocking, you have resource-friendly
    waiting.


    `co_yield` expression supports generator functions. The generator function returns
    a new value each time you call it. A generator function is a kind of data stream
    from which you can pick values. The data stream can be infinite. Therefore, we
    are at the center of lazy evaluation with C++.


    # # 5.1 A Generator Function


    The following program is as simple as possible. The function `getNumbers` returns
    all integers from `begin` to `end`, incremented by `inc`. Value `begin` has to
    be smaller than `end`, and `inc` has to be positive.'
