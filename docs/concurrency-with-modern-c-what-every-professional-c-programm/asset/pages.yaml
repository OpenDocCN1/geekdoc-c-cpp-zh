    \ Not supporting `back` limits the interface because you can never ask for the\
    \ last element.\n+   2. Combine `back` and `push` into one member function `backAndPush`,\
    \ `backAndPush` should, in this case, return to the `push` operation previous\
    \ value. This combination seems to be promising but has two serious issues. First,\
    \ the previous value has to be copied because a reference or a pointer would break\
    \ the synchronization. This copy operation is a performance penalty. Second, the\
    \ copy constructor could throw an exception.\n+   3. Supporting both member functions\
    \ `back` and `push` separately, introduces a data race. Assume a user makes an\
    \ assumption based on the value of the last element. We have the same issue, such\
    \ as supporting `front` and `pop` as two different member functions. The argumentation\
    \ to the member functions `top` and `pop` in concurrent stack also apply here.\
