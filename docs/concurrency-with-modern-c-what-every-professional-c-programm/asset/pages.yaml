  md: "# An atomic block\n\n```\n```cpp\natomic{\n    statement1;\n    statement2;\n\
    \    statement3;\n}\n```\n```\n\n# Atomicity\n\nEither all or none of the statements\
    \ in the block are performed.\n\n# Consistency\n\nThe system is always in a consistent\
    \ state. All transactions establish a total order.\n\n# Isolation\n\nEach transaction\
    \ runs in total isolation from other transactions.\n\nHow do these properties\
    \ apply? A transaction remembers its initial state and is performed without synchronization.\
    \ If a conflict happens during its execution, the transaction is interrupted and\
    \ restored to its initial state. This rollback causes the transaction to be executed\
    \ again. If the transaction’s initial state still exists at the end of the transaction,\
    \ the transaction is committed. Conflicts are typically detected with a tagged\
    \ state reference.\n\nA transaction is a kind of speculative action that is only\
    \ committed if the initial state holds. In contrast to a mutex, it is an optimistic\
    \ approach. A transaction is performed without synchronization. It is only published\
    \ if no conflict occurs. A mutex is a pessimistic approach. First, the mutex ensures\
    \ that no other thread can enter the critical region. Next, the thread enters\
    \ the critical region if it is the exclusive owner of the mutex, and hence all\
    \ other threads are blocked.\n\nC++ supports transactional memory in two flavors:\
    \ synchronized blocks and atomic blocks.\n\n# 7.3.2 Synchronized and Atomic Blocks\n\
    \nSo far I only wrote about transactions. Now I write about synchronized blocks\
    \ and atomic blocks. Both can be encapsulated in each other. To be more specific\
    \ synchronized blocks are not transactions because they can execute transaction-unsafe.\
    \ An example for a transaction-unsafe code would be a code like the output to\
    \ the console, which can not be undone. For this reason, synchronized blocks are\
    \ often called relaxed blocks.\n\n# 7.3.2.1 Synchronized Blocks\n\nSynchronized\
    \ blocks behave like a global lock that protects them. This means that all synchronized\
    \ blocks follow a total order, and in particular all changes to a synchronized\
    \ block are available in the next synchronized block. There is a synchronizes-with\
    \ relation between the synchronized blocks because of the commit of the transaction\
    \ synchronizes-with the next start of a transaction. Synchronized blocks can not\
    \ cause a deadlock because they create a total order. While a classical"
