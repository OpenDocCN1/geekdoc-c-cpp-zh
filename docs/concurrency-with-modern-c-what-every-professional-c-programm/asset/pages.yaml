  md: "# 16.3 Time Duration\n\nTime duration std::chrono::duration is a class template\
    \ that consists of the type of the tick Rep and the length of a tick Period.\n\
    \nThe class template std::chrono::duration\n\n```\n```cpp\ntemplate<\n    class\
    \ Rep,\n    class Period = std::ratio<1>\n> class duration;\n```\n```\n\nThe tick\
    \ length is by default std::ratio<1>. std::ratio<1> stands for a second and can\
    \ also be written as std::ratio<1, 1>. The rest is quite easy. std::ratio<60>\
    \ is a minute and std::ratio<1,1000> a millisecond. When the type of Rep is a\
    \ floating-point number, you can use it to hold fractions of time ticks.\n\nC++11\
    \ predefines the most important time durations:\n\n**Important time durations**\n\
    \n```\n```cpp\ntypedef duration<signed int, nano> nanoseconds;\ntypedef duration<signed\
    \ int, micro> microseconds;\ntypedef duration<signed int, milli> milliseconds;\n\
    typedef duration<signed int> seconds;\ntypedef duration<signed int, ratio< 60>>\
    \ minutes;\ntypedef duration<signed int, ratio<3600>> hours;\n```\n```\n\nHow\
    \ much time has passed since the UNIX epoch (1.1.1970)? Thanks to type aliases\
    \ for the different time durations, I can answer the question quite easily. In\
    \ the following example, I ignore leap years and assume that a year has 365 days.\n\
