  md: "# A thread-safe singleton using atomics with acquire-release semantic\n\n```\n\
    ```cpp\n// singletonAcquireRelease.cpp\n\n#include <atomic>\n#include <iostream>\n\
    #include <future>\n#include <mutex>\n#include <thread>\n\nconstexpr auto tenMill\
    \ = 10000000;\n\nclass MySingleton{\npublic:\n    static MySingleton* getInstance(){\n\
    \        MySingleton* sin = instance.load(std::memory_order_acquire);\n      \
    \  if(!sin){\n            std::lock_guard<std::mutex> myLock(myMutex);\n     \
    \       sin = instance.load(std::memory_order_relaxed);\n            if(!sin){\n\
    \                sin = new MySingleton();\n                instance.store(sin,\
    \ std::memory_order_release);\n            }\n        }\n        volatile int\
    \ dummy{};\n        return sin;\n    }\nprivate:\n    MySingleton() = default;\n\
    \    ~MySingleton() = default;\n    MySingleton(const MySingleton&) = delete;\n\
    \    MySingleton& operator=(const MySingleton&) = delete;\n\n    static std::atomic<MySingleton*>\
    \ instance;\n    static std::mutex myMutex;\n};\n\nstd::atomic<MySingleton*> MySingleton::instance;\n\
    std::mutex MySingleton::myMutex;\n\n...\n```\n```\n\nThe acquire-release semantic\
    \ has a similar performance as the sequential consistency."
