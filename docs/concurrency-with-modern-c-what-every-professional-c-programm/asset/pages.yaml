- pgno: 447
  md: "# ### 7.2.2.1 Disadvantages\n\nThe already mentioned document gives an excellent\
    \ description of the deficiencies of the futures.\n\n# #### 7.2.2.1.1 future/promise\
    \ Should Not Be Coupled to std::thread Execution Agents\n\nC++11 had only one\
    \ executor std::thread. Consequently, futures and std::thread were inseparable.\
    \ This changed with C++17 and the parallel algorithms of the STL. This changes\
    \ even more with the new executors, which you can use to configure the future.\
    \ For example, the future may run in a separate thread, in a thread pool, or sequentially.\n\
    \n# #### 7.2.2.1.2 Where are then Continuations are Invoked?\n\nImagine you have\
    \ a simple continuation, such as in the following example.\n\n**Continuations\
    \ with std::future**\n\n```\n~~~cpp\nfuture<int> f1 = async([]() { return 123;\
    \ });\nfuture<string> f2 = f1.then([](future<int> f) {\n    return to_string(f.get());\n\
    });\n~~~\n```\n\nThe question is: Where should the continuation run? There are\
    \ a few possibilities today:\n\n+   1. Consumer Side: The consumer execution agent\
    \ always executes the continuation.\n+   2. Producer Side: The producer execution\
    \ agent always executes the continuation.\n+   3. inline_executor semantics: If\
    \ the shared state is ready when the continuation is set, the consumer thread\
    \ executes the continuation. If the shared state is not ready when the continuation\
    \ is set, the producer thread executes the continuation.\n+   4. thread_executor\
    \ semantics: A new std::thread executes the continuation.\n\nIn particular, the\
    \ first two possibilities have a significant drawback: they block. In the first\
    \ case, the consumer blocks until the producer is ready. In the second case, the\
    \ producer blocks, until the consumer is ready.\n\nHere are a few nice use-cases\
    \ of executor propagation from the document P0701r1¹¹:\n\n11)http://www.open-std.org/jtc1/sc22/wg21/docs/papers/2017/p0701r1.html"
