  md: "```\n`Stack: TOP -> head -> headNext -> ...`\n```\n\nLet’s construct the ABA\
    \ problem.\n\n# ### 15.1.0.4 ABA in Action\n\nLet’s start with the following stack:\n\
    \n```\n`Stack: TOP -> A -> B -> C`\n```\n\nThread 1 is active and wants to pop\
    \ the head of the stack.\n\n+   - Thread 1 stores\n\n```\n    head = A\n    headNext\
    \ = B\n```\n\nBefore thread 1 finishes the pop step, thread 2 kicks in.\n\n+ \
    \  - Thread 2 pops A\n\n```\n`Stack: TOP -> B -> C`\n```\n\n+   - Thread 2 pops\
    \ B and deletes B\n\n```\n`Stack: TOP -> C`\n```\n\n+   - Thread 2 pushed A back\n\
    \n```\n`Stack: TOP -> A -> C`\n```\n\nThread 1 is rescheduled and checks if `A\
    \ == head`. Because of `A == head`, `headNext`, which is B becomes the new head.\
    \ However, B was already deleted. Therefore, the program has undefined behavior.\
    \ There are a few remedies to the ABA problem.\n\n# ### 15.1.0.5 Remedies\n\n\
    The conceptual problem of ABA is quite easy to understand. A node such as `B ==\
    \ headNext` was deleted although another node `A == head` was referring to it.\
    \ The solution to our problem is to get rid of the premature deletion of the node.\
    \ Here are a few remedies."
