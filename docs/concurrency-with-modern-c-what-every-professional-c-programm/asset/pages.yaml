- pgno: 678
  md: "# ## 16.2 Time Point\n\nThe time point `std::chrono::time_point` is defined\
    \ by the starting point (epoch) and the additional time duration. The class template\
    \ consists of two components: clock and time duration. By default, the time duration\
    \ is derived from the clock.\n\nThe class template `std::chrono::time_point`\n\
    \n```\n~~~cpp\ntemplate<\n  class Clock,\n  class Duration= typename Clock::duration\n\
    >\nclass time_point;\n~~~\n```\n\nThe following four special time points depend\
    \ on the clock:\n\n+   - **epoch:** the starting point of the clock\n+   - **now:**\
    \ the current time\n+   - **min:** the minimum time point that the clock can have\n\
    +   - **max:** the maximum time point that the clock can have\n\nThe accuracy\
    \ of the minimum and maximum time point depends on the clock used: `std::chrono::system_clock`,\
    \ `std::chrono::steady_clock`, or `std::chrono::high_resolution_clock`.\n\nC++\
    \ gives no guarantee about the accuracy, the starting point or the valid time\
    \ range of a clock. The starting point of `std::chrono::system_clock` is typically\
    \ 1st January 1970, the so-called UNIX-epoch³. It holds further that `std::chrono::high_resolution_clock`\
    \ has the highest accuracy.\n\n# ### 16.2.1 From Time Point to Calendar Time\n\
    \nThanks to `std::chrono::system_clock::to_time_t` you can convert a time point\
    \ that internally uses `std::chrono::system_clock` to an object of type `std::time_t`.\
    \ Further conversion of the `std::time_t` object with the function `std::gmtime⁴`\
    \ gives you the calendar time, expressed in Coordinated Universal Time⁵ (UTC).\
    \ In the end, this calendar time can be used as the input for the function `std::asctime⁶`\
    \ to get a textual representation of the calendar time.\n\n³https://en.wikipedia.org/wiki/Unix_time\n\
    ⁴http://en.cppreference.com/w/cpp/chrono/c/gmtime\n⁵https://en.wikipedia.org/wiki/Coordinated_Universal_Time\n\
    ⁶http://en.cppreference.com/w/cpp/chrono/c/asctime"
  merge: -1
  img_proc: true
