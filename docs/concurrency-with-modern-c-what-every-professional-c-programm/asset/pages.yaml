    Three threads, including the main thread, use instances of `Critical`. Thanks
    to the thread-safe interface, all calls to the public API are synchronized. The
    mutex `mut` in line 35 is mutable and can be used in the constant member function
    `interface1`.


    The advantages of the thread-safe interface are threefold.


    +   1. A recursive call of a mutex is not possible. Recursive calls on a non-recursive
    mutex are undefined behavior in C++ and usually end in a deadlock.

    +   2. The program uses minimal locking and, therefore, minimal synchronization.
    Using just a `std::recursive_mutex` in each public or private member function
    of the class `Critical` would end in more expensive synchronizations.

    +   3. From the user perspective, `Critical` is straightforward to use because
    synchronization is only an implementation detail.


    Each interface member function delegates its work to the corresponding implementation
    member function. The indirection overhead is a typical disadvantage of the thread-safe
    interface pattern.


    The output of the program shows the interleaving of the three threads.'
