    # 3.3.3 std::lock


    std::lock can lock its Lockables9 such as a mutex or a lock in an atomic step.
    A Lockable is a data type that supports the member functions lock, unlock, and
    try_lock.std::lock is a variadic template and, can, therefore, accept an arbitrary
    number of arguments. std::lock tries to get all locks in one atomic step using
    a deadlock avoidance algorithm. The Lockable are locked by an unspecified series
    of calls to lock, try_lock, and unlock. If a call to lock causes an exception,
    unlock is called for any locked Lockable before rethrowing.


    Remember the deadlock from the subsection Issues of Mutexes?'
