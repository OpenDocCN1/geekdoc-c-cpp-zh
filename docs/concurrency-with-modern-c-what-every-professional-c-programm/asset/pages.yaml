  md: '# ## Proxy


    The proxy design pattern is one of the classics from the book Design Patterns:
    Elements of Reusable Object-Oriented Software³. A proxy is an object which stands
    for something else. A typical proxy could be a remote proxy CORBA⁴, a security
    proxy, a virtual proxy which is created on-demand, or a smart pointer such as
    std::shared_ptr⁵. Each proxy adds additional functionality to the object it represents.
    A remote proxy stands for a remote object and gives the client the illusion of
    a local object. A security proxy turns an insecure connection into a secure connection
    by encrypting and decrypting data. A virtual proxy encapsulates the creation of
    a heavy-weight object in a lazy fashion, and a smart pointer manages the lifetime
    of the underlying memory.


    ![](img/d61a6c83410484053b8892275d2fcc4f_513_0.png)


    Proxy


    +   - The Proxy has the same interface, such as the RealSubject, manages the reference,
    and often the subject''s lifetime.

    +   - The Subject has the same interface such as the proxy and the RealSubject.

    +   - The RealSubject provides the functionality.


    The Wikipedia article about the proxy pattern¹⁰ gives you more details.


    +   - ³https://en.wikipedia.org/wiki/Design_Patterns

    +   - ⁴https://en.wikipedia.org/wiki/Common_Object_Request_Broker_Architecture

    +   - ⁵https://en.cppreference.com/w/cpp/memory/shared_ptr

    +   - ¹⁰https://en.wikipedia.org/wiki/Proxy_pattern'
