    10      std::this_thread::sleep_for(100ms);

    11      for (int i = 0; i <= 9; ++i) {

    12          std::stop_callback cb(stopToken, [i] { std::cout << i; });

    13      }

    14      std::cout << ''\n'';

    15  }

    16

    17  int main() {

    ```'
