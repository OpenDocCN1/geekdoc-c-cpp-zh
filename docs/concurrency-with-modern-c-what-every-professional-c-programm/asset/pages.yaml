    # ### 4.1.3 Hazards of Data Races and Deadlocks\n\nThe parallel algorithm does\
    \ not automatically protect you from data races and deadlocks.\n\n**Parallel execution\
    \ with a data race**\n\n```\n```cpp\nstd::vector<int> v = {1, 2, 3 };\nint sum\
    \ = 0;\n\nstd::for_each(std::execution::par, v.begin(), v.end(), [&sum](int i){\n\
    \    sum += i + i;\n});\n```\n```\n\nThe small code snippet has a data race on\
    \ sum. sum builds the sum of all i + i and is concurrently modified. sum has to\
    \ be protected.\n\n**Parallel execution**\n\n```\n```cpp\nstd::vector<int> v =\
    \ {1, 2, 3 };\nint sum = 0;\nstd::mutex m;\n\nstd::for_each(std::execution::par,\
    \ v.begin(), v.end(), [&sum](int i){\n    std::lock_guard<std::mutex> lock(m);\n\
    \    sum += i + i;\n});\n```\n```\n\nWhen I change the execution policy to std::execution::par_unseq,\
    \ I have a race condition that usually results in a deadlock."
