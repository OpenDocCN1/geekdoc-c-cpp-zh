    # # 4.3 The New Algorithms


    The new algorithms are in the `std` namespace. The algorithms `std::for_each`
    and `std::for_each_n` require the header `<algorithm>`. The remaining six other
    algorithms require the header `<numeric>`. Here is an overview of the new algorithms.


    The new algorithms


    | Algorithm | Description |

    |---|---|

    | std::for_each | Applies a unary callable to the range. |

    | std::for_each_n | Applies a unary callable to the first n elements of the range.
