    The atomic booleans, the atomic user-defined types, and the atomic smart pointer
    support the same interface. I call it the fundamental atomic interface. The atomic
    pointer extends the fundamental atomic interface. The same applies to the atomic
    arithmetic types: the atomic floating-point types extend the interface of the
    atomic pointers, and the atomic integral types extend the interface of the atomic
    floating-point types.


    The downside of the various variations of `std::atomic` is that you do not have
    the guarantee that they are lock-free. In the next subsection, I present the various
    atomic types based on their interface. Roughly speaking, there are four subsections.
    Let me start with atomic booleans, atomic user-defined types, and atomic smart
    pointers (C++20).


    # 2.3.3.1 Fundamental Atomic Interface


    The three partial specialization `std::atomic<bool>`, `std::atomic<user-defined
    type>`, and `std::atomic<smart T*>` support the fundamental atomic interface.


    | Member functions | Description |

    | :--- | :--- |

    | is_lock_free | Checks if the atomic object is lock-free. |

    | atomic_ref<T>::is_always_lock_free | Checks at compile time if the atomic type
    is always lock-free. |

    | load | Atomically returns the value of the atomic. |

    | operator T | Atomically returns the value of the atomic. Equivalent to atom.load().
    |

    | store | Atomically replaces the value of the atomic with the non-atomic. |

    | exchange | Atomically replaces the value with the new value. Returns the old
    value. |

    | compare_exchange_strong | Atomically compares and eventually exchanges the value.
    Details are here. |

    | compare_exchange_weak | |

    | notify_one (C++20) | Notifies one atomic wait operation. |

    | notify_all (C++20) | Notifies all atomic wait operations. |

    | wait (C++20) | Blocks until it is notified. Compares itself with the old value
    to protect against spurious wakeups and lost wakeups. If the old value compares
    to unequal, returns. |'
