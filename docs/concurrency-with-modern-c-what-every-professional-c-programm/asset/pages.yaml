    the `JobNumber` of the executed job and the thread ID on which it runs. The screenshot
    shows which coroutine runs immediately and which one is suspended. Thanks to the
    thread id, you can observe that suspended coroutines are resumed on a different
    thread.


    You can try out the program on the [Wandbox](https://wandbox.org/permlink/skHgWKF0SYAwp8Dm).


    ![](img/d61a6c83410484053b8892275d2fcc4f_426_0.png)


    Let me discuss the interesting control flow of the program. Line 59 creates eight
    default-constructed threads, which the coroutine `performJob` (line 53) takes
    by reference. Further, the reference becomes the argument for creating `MyAwaitable{out}`
    (line 54). Depending on the value of `res` (line 17), and, therefore, the return
    value of the function `await_ready`, the Awaitable continues (res is true) to
    run or is suspended (res is false). In case `MyAwaitable` is suspended, the function
    `await_suspend` (line 22) is executed. Thanks to the assignment of `outerThread`
    (line 23), it becomes a running thread. The running threads must outlive the lifetime
    of the coroutine. For this reason, the threads have the scope of the main function.


