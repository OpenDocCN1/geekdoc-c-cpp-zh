  md: "+   - Sequential consistency: `memory_order_seq_cst`\n+   - Acquire-release:\
    \ `memory_order_consume`, `memory_order_acquire`, `memory_order_release`, and\
    \ `memory_order_acq_rel`\n+   - Relaxed: `memory_order_relaxed`\n\nWhile the sequential\
    \ consistency establishes a global order between threads, the acquire-release\
    \ semantic establishes an ordering between reading and writing operations on the\
    \ same atomic variable with different threads. The relaxed semantic only guarantees\
    \ the modification order of some atomic m. Modification order means that all modifications\
    \ on a particular atomic m occur in some particular total order. Consequently,\
    \ a particular thread reads of an atomic object never see \"older\" values than\
    \ those the thread has already observed.\n\nThe different memory models and their\
    \ effects on atomic and non-atomic operations make the C++ memory model an exciting\
    \ and challenging topic. Let us discuss the synchronization and ordering constraints\
    \ of the sequential consistency, the acquire-release semantic, and the relaxed\
    \ semantic.\n\n# ## 2.4.2 Sequential Consistency\n\nLet us dive deeper into sequential\
    \ consistency. The key to sequential consistency is that all operations on all\
    \ threads obey a universal clock. This global clock makes it quite intuitive to\
    \ think about it.\n\nThe intuitiveness of the sequential consistency comes with\
    \ a price. The downside is that the system has to synchronize threads.\n\nThe\
    \ following program synchronizes the producer and the consumer thread with the\
    \ help of sequential consistency.\n\n**Producer-Consumer synchronization with\
    \ sequential consistency**\n\n```\n    1 // producerConsumer.cpp\n    2\n    3\
    \ #include <atomic>\n    4 #include <iostream>\n    5 #include <string>\n    6\
    \ #include <thread>\n    7\n    8 std::string work;\n    9 std::atomic<bool> ready(false);\n\
    \    10\n    11 void consumer() {\n    12   while (!ready.load()) {}\n    13 \
    \  std::cout << work << '\\n';\n    14 }\n    15\n    16 void producer() {\n \
    \   17   work = \"done\";\n```"
