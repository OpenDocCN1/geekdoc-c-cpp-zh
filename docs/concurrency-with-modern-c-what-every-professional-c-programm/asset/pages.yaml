  md: "# # Distinguish Between the Coroutine Factory and the Coroutine Object\n\n\
    The term coroutine is often used for two different aspects of coroutines: the\
    \ function invoking co_return, co_await, or co_yield, and the coroutine object.\
    \ Using one term for two different coroutine aspects may puzzle you (such as it\
    \ did me). Let me clarify both terms.\n\n```\n```cpp\nA simple coroutine producing\
    \ 2021\nMyFuture<int> createFuture() {\n    co_return 2021;\n}\n\nint main() {\n\
    \n    auto fut = createFuture();\n    std::cout << \"fut.get(): \" << fut.get()\
    \ << '\\n';\n\n}\n```\n```\n\nThis straightforward example has a function createFuture\
    \ and returns an object of type MyFuture<int>. Both are called coroutines. To\
    \ be specific, the function createFuture is a coroutine factory that returns a\
    \ coroutine object. The coroutine object is a resumable object that implements\
    \ the framework to model a specific behavior. I present in the section co_return\
    \ the implementation and the use of this straightforward coroutine.\n\n# ## 5.2.4.1\
    \ Restrictions\n\nCoroutines cannot have return statements or placeholder return\
    \ types. This holds for unconstrained placeholders (auto), and constrained placeholders\
    \ (concepts).\n\nAdditionally, functions having variadic arguments⁸, constexpr\
    \ functions, consteval functions, constructors, destructors, and the main function\
    \ cannot be coroutines.\n\n# ## 5.3 The Framework\n\nThe framework for implementing\
    \ coroutines consists of more than 20 functions, some of which you must implement\
    \ and some of which you may overwrite. Therefore, you can tailor the coroutine\
    \ to your needs.\n\nA coroutine is associated with three parts: the promise object,\
    \ the coroutine handle, and the coroutine frame. The client gets the coroutine\
    \ handle to interact with the promise object, which keeps its state in the coroutine\
    \ frame."
