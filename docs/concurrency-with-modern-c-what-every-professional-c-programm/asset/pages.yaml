  md: 'The Reactor (and not the application) waits for the indication events to demultiplex
    and dispatch the event. The concrete event handlers are registered within the
    Reactor. The Reactor inverts the flow of control. This inversion of control is
    often called Hollywood principle¹³.


    ![](img/d61a6c83410484053b8892275d2fcc4f_532_0.png)


    # ## Synchronous Event Demultiplexer


    The system calls select¹⁴, poll¹⁵, epoll¹⁶, kqueue¹⁷, or WaitForMultipleObjects¹⁸
    enables it to wait for indication events.


    +   - select can only monitor 1024 file descriptors, and you should, therefore,
    only use it if other synchronous event demultiplexers are not available. select
    is supported on all Unix¹⁹ and POSIX²⁰ operating systems.

    +   - poll behaves similarly to select but overcomes its 1024 file descriptors
    limitation. Both system calls require that you specify the file descriptor with
    the highest number, and the system calls then scan all possible file descriptor
    numbers up to this highest set number. This strategy makes select and poll slower
    than epoll²¹.

    +   - epoll monitors only the specified file descriptors but is only available
    on Linux²¹ operating systems.

    +   - kqueue behaves similar to epoll and is available on the FreeBSD²², and macOS²³
    operating system.

    +   - WaitForMultipleObjects is part of the Windows API²⁴.


    # ### 10.4.4 Dynamic Behavior


    The following points illustrate how the flow of control between the Reactor and
    the event handler goes.


    +   - The application registers event handler for specific events in the Reactor.

    +   - Each event handler provides its specific handler to the Reactor.

    +   - The application starts the event loop. The event loop waits for indication
    events.


