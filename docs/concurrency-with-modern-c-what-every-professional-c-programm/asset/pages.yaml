    # 2.2.1 The Foundation


    The C++ memory model has to deal with the following points:


    +   - Atomic operations: operations that can perform without interruption.

    +   - Partial ordering of operations: sequences of operations that must not be
    reordered.

    +   - Visible effects of operations: guarantees when operations on shared variables
    are visible to other threads.


    The foundation of the contract are operations on atomics that have two characteristics:
    They are by definition atomic or indivisible, and they create synchronization
    and order constraints on the program execution. These synchronization and order
    constraints also hold for operations on non-atomics. On the one hand, an operation
    on an atomic is always atomic, but on the other hand, you can tailor the synchronizations
    and order constraints to your needs.


