  md: "# 6.1 Calculating the Sum of a Vector\n\nWhat is the fastest way to add the\
    \ elements of a `std::vector`? To get the answer, I fill a `std::vector` with\
    \ one hundred million arbitrary but uniformly distributed¹ numbers between 1 and\
    \ 10. The task is to calculate the sum of the numbers in various ways. I use the\
    \ performance of a single-threaded addition as the reference execution time. I\
    \ discuss atomics, locks, thread-local data and tasks.\n\nLet’s start with the\
    \ single-threaded scenario.\n\n# 6.1.1 Single Threaded addition of a Vector\n\n\
    The straightforward strategy is to add the numbers in a range-based for loop.\n\
    \n# 6.1.1.1 Range-based for Loop\n\nThe summation takes place in line 27.\n\n\
    ```\n**Summation of a vector in a range-based for loop**\n\n```cpp\n// calculateWithLoop.cpp\n\
    \n#include <chrono>\n#include <iostream>\n#include <random>\n#include <vector>\n\
    \nconstexpr long long size = 100000000;\n\nint main(){\n\n    std::cout << '\\\
    n';\n\n    std::vector<int> randValues;\n    randValues.reserve(size);\n\n   \
    \ // random values\n    std::random_device seed;\n    std::mt19937 engine(seed());\n\
    \    std::uniform_int_distribution<> uniformDist(1, 10);\n    for (long long i\
    \ = 0; i < size; ++i)\n        randValues.push_back(uniformDist(engine));\n\n\
    \    const auto sta = std::chrono::steady_clock::now();\n```\n```\n\n¹https://en.wikipedia.org/wiki/Discrete_uniform_distribution"
