  md: "# ## 13.0.1 A Stack\n\n![](img/d61a6c83410484053b8892275d2fcc4f_605_0.png)\n\
    \nA `std::stack`¹ follows the LIFO principle (Last In First Out). A stack `sta`,\
    \ which needs the header `<stack>`, has three member functions.\n\nWith `sta.push(e)`\
    \ you can insert a new element `e` at the top of the stack, remove it from the\
    \ top with `sta.pop()` and reference it with `sta.top()`. The stack supports the\
    \ comparison operators and knows its size. The operations of the stack have constant\
    \ complexity.\n\n```\n```cpp\n#include <stack>\n...\nstd::stack<int> myStack;\n\
    \nstd::cout << myStack.empty() << '\\n';   // true\nstd::cout << myStack.size()\
    \ << '\\n';    // 0\n\nmyStack.push(1);\nmyStack.push(2);\nmyStack.push(3);\n\
    std::cout << myStack.top() << '\\n';     // 3\n\nwhile (!myStack.empty()){\n \
    \   std::cout << myStack.top() << \" \";\n    myStack.pop();\n}\nstd::cout <<\
    \ '\\n';                      // 3 2 1\n\nstd::cout << myStack.empty() << '\\\
    n';   // true\nstd::cout << myStack.size() << '\\n';    // 0\n```\n```\n\nLet\
    \ me implement the concurrent stack successively.\n\n# ### 13.0.1.1 A Simplified\
    \ Implementation\n\nMy first implementation only supports the `push` member function.\
    \ The class `ConcurrentStackPush` is a thin wrapper around a `std::stack`.\n\n\
    ¹http://en.cppreference.com/w/cpp/container/stack"
