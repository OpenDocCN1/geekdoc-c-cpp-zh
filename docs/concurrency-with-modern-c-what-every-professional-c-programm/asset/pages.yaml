  md: '# ### 10.1.3 Components


    The Active Object pattern consists of six components:


    +   1. **The proxy** provides an interface for the accessible member functions
    on the Active Object. The proxy triggers the construction of a request which goes
    into the activation list. The proxy runs in the client thread.

    +   2. **The method request class** defines the interface for the method executing
    on an Active Object. This interface also contains guarded methods, indicating
    if the job is ready to run. The request includes all context information to be
    executed later.

    +   3. **The activation list** maintains the pending requests. The activation
    list decouples the client’s thread from the Active Object thread. The proxy inserts
    the request object, and the scheduler removes them. Consequently, the access onto
    the activation list must be serialized.

    +   4. **The scheduler** runs in the thread of the Active Object and decides which
    request from the activation list is executed next. The scheduler evaluates the
    guards of the request to determine if the request could run.

    +   5. **The servant** implements the Active Object and runs in the active object’s
    thread. The servant implements the interface of the method request, and the scheduler
    invokes its member functions.

    +   6. **The future** is created by the proxy and is only necessary if the request
    returns a result. Therefore, the client receives the future and can obtain the
    result of the method invocation on the Active Object. The client can wait for
    the outcome or poll for it.


    # ### 10.1.4 Dynamic Behavior


    The dynamic behavior of the Active Object consists on three phases:


    +   1. **Request construction and scheduling:** The client invokes a method on
    the proxy. The proxy creates a request and passes it to the scheduler. The scheduler
    enqueues the request on the activation list. Additionally, the proxy returns a
    future to the client if the request returns a result.

    +   2. **Member function execution:** The scheduler determines which request becomes
    runnable by evaluating the guard method of the request. It removes the request
    from the activation list and dispatches it to the servant.

    +   3. **Completion:** When the request returns something, it is stored in the
    future. The client can ask for the result. When the client has the result, the
    request and the future can be deleted.


    The following picture shows the sequence of messages.'
