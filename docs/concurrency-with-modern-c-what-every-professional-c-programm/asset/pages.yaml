- pgno: 320
  md: '# 6.1.4 Summation of a Vector: The Conclusion


    # 6.1.4.1 Single Threaded


    The range-based for loop and the STL algorithm std::accumulate are in the same
    performance range. In the optimized version, the compiler uses for the summation
    case the optimized version vectorized SIMD* instruction (SSE or AVX). Therefore,
    the loop counter is increased by 4 (SSE) or 8 (AVX).


    # 6.1.4.2 Multithreading with a Shared Variable


    The usage of a shared variable for the summation variable makes one point clear:
    synchronization is costly and should be avoided as much as possible. Although
    I used an atomic variable and even broke the sequential consistency, the four
    threads are 100 times slower than one thread. From a performance perspective,
    minimizing expensive synchronization has to be our first goal.


    # 6.1.4.3 Thread-local Summation


    The thread-local summation is only two times faster than the single-threaded range-based
    for loop or std::accumulate. That holds even though each of the four threads can
    work independently. That surprised me because I was expecting a nearly fourfold
    improvement. What surprised me, even more, was that my four cores are not fully
    utilized.


    ![](img/d61a6c83410484053b8892275d2fcc4f_320_0.png)


    Utilisation of the four cores


    The reason is simple; the cores can''t get the data fast enough from memory. The
    execution is memory bound². Or to say it the other way around, the memory slows
    down the cores. The following pictures show the bottleneck memory.


    ¹ https://en.wikipedia.org/wiki/SIMD


    ² https://en.wikipedia.org/wiki/Memory_bound_function'
