- pgno: 531
  md: '# 10.4.3 Components


    ![](img/d61a6c83410484053b8892275d2fcc4f_531_0.png)


    Reactor


    +   - **Handles:**

    +     - The handles identify different event sources such as network connections,
    open files, or GUI events.

    +     - The event source generates events such as connect, read, or write that
    are queued on the associated handle.

    +   - **Synchronous event demultiplexer:**

    +     - The synchronous event demultiplexer waits for one or more indication events,
    and it blocks until the associated handle can process the event.

    +   - **Event handler:**

    +     - The event handler defines the interface for processing the indication
    events.

    +     - The event handler defines the supported services of the application.

    +   - **Concrete event handler.**

    +     - The concrete event handler implements the interface of the application
    defined by the event handler.

    +   - **Reactor:**

    +     - The Reactor supports an interface to register and deregister the concrete
    event handler using file descriptors.

    +     - The Reactor uses a synchronous event demultiplexer to wait for indication
    events. An indication event can be read, write, or error event.

    +     - The Reactor maps the events to their concrete event handler.

    +     - The Reactor manages the lifetime of the event loop.'
