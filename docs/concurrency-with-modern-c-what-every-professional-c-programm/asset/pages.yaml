  md: '+   - a user-defined type must be bitwise comparable so that the C functions
    `memcpy`⁶ or `memcmp`⁷ can be applied


    Most popular platforms can use atomic operations for `std::atomic<user-defined
    type>` if the size of the user-defined type is not bigger as the size of an int.


    ![](img/d61a6c83410484053b8892275d2fcc4f_63_0.png)


    # ## Check the type properties at compile time


    The type properties on a user-defined type can be checked at compile time, by
    using the following functions: `std::is_trivially_copy_constructible`, `std::is_polymorphic`
    and `std::is_trivial`. All these functions are part of the very powerful type-traits
    library⁴.


    # ### 2.3.3.1.6 Atomic Smart Pointers `std::atomic<smart T*>` (C++20)


    A `std::shared_ptr` consists of a control block and its resource. The control
    block is thread-safe, but access to the resource is not. This means modifying
    the reference counter is an atomic operation and you have the guarantee that the
    resource is deleted exactly once. These are the guarantees `std::shared_ptr` gives
    you .


    ![](img/d61a6c83410484053b8892275d2fcc4f_63_1.png)


    # ## The Importance of being Thread-Safe


    I want to take a short detour to emphasize how important it is that the `std::shared_ptr`
    has well-defined multithreading semantics. At first glance, use of a `std::shared_ptr`
    does not appear to be a sensible choice for multithreaded code. It is by definition
    shared and mutable and is the ideal candidate for non-synchronized read and write
    operations and hence for undefined behavior. On the other hand, there is the guideline
    in modern C++: **Don''t use raw pointers.** This means, consequently, that you
    should use smart pointers in multithreaded programs.


    The proposal N4162⁸ for atomic smart pointers directly addresses the deficiencies
    of the current implementation. The deficiencies boil down to these three points:
    consistency, correctness, and performance.


    +   - **Consistency:** the atomic operations for `std::shared_ptr` are the only
    atomic operations for a non-atomic data type.

    +   - **Correctness:** the use of the global atomic operations is quite error-prone
    because the correct usage is based on discipline. It is easy to forget to use
    an atomic operation - such as using `ptr = localPtr` instead of `std::atomic_store(&ptr,
    localPtr)`. The result is undefined behavior because of a data race. If we used
    an atomic smart pointer instead, the type system would not allow it.'
