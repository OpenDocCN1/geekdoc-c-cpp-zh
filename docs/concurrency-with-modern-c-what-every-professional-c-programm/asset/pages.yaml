  md: "# ### 3.9.2.2 Fire and Forget\n\nFire and forget futures are special futures.\
    \ They execute just in place because their future is not bound to a variable.\
    \ It is necessary for a fire-and-forget future that the promise runs in a separate\
    \ thread to immediately start its work. This is done by the std::launch::async\
    \ policy.\n\nLet’s compare an ordinary future with a fire and forget future.\n\
    \n```\n~~~cpp\nauto fut= std::async([]{ return 2011; });\nstd::cout << fut.get()\
    \ << '\\n';\n\nstd::async(std::launch::async,\n           []{ std::cout << \"\
    fire and forget\" << '\\n'; });\n~~~\n```\n\nFire and forget futures look very\
    \ promising but have a big drawback. A future that is created by std::async waits\
    \ on its destructor, until its promise is done. In this context, waiting is not\
    \ very different from blocking. The future blocks the progress of the program\
    \ in its destructor. This becomes more evident when you use fire and forget futures.\
    \ What seems to be concurrent runs sequentially.\n\n# **Fire and forget futures**\n\
    \n```\n~~~cpp\n// fireAndForgetFutures.cpp\n\n#include <chrono>\n#include <future>\n\
    #include <iostream>\n#include <thread>\n\nint main(){\n\n    std::cout << '\\\
    n';\n\n    std::async(std::launch::async, []{\n        std::this_thread::sleep_for(std::chrono::seconds(2));\n\
    \        std::cout << \"first thread\" << '\\n';\n    });\n\n    std::async(std::launch::async,\
    \ []{\n        std::this_thread::sleep_for(std::chrono::seconds(1));\n       \
    \ std::cout << \"second thread\" << '\\n';\n    });\n\n    std::cout << \"main\
    \ thread\" << '\\n';\n\n    std::cout << '\\n';\n~~~\n```"
