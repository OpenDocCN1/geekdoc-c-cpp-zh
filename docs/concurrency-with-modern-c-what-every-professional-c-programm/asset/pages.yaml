    In C++11, there are atomic types for the integral data types.


    # ### 2.3.3.4 `std::atomic<integral type>`


    For each integral type there is a full specialization `std::atomic<integral type>`
    of `std::atomic`. `std::atomic<integral type>` supports all operations that `std::atomic<T*>`
    or `std::atomic<floating-point type>` supports. Additionally, `std::atomic<integral
    type>` supports the bitwise logical operators AND, OR, and XOR.


    All operations on atomic


    | Member functions | Description |

    |---|---|

    | fetch_or, \|= | Atomically performs bitwise (AND, OR, and XOR) operation with
