  md: '# ### 10.3.6 Example


    A defibrillator has to react to synchronous and asynchronous events. Synchronous
    events are for example, instructions for the operator to perform the resuscitation.
    On the contrary, pushing the power button by the operator is an asynchronous event.
    Two conditions must be met to apply the current to the patient using the power
    button: the heart rhythm is treatable, and the current must be synchronized with
    the insufficient heart muscle activity. Consequently, the push button event is
    stored on the queuing layer and has a higher priority than the instructions events
    for the operator.


    The Half-Sync/Half-Async pattern is often used in an event demultiplexing and
    dispatching frameworks such as the Reactor or Proactor pattern.


    # ## 10.4 Reactor


    The Reactor pattern is an event-driven framework to demultiplex and dispatch service
    requests concurrently onto various service providers. The requests are processed
    synchronously.The Reactor pattern is also known as dispatcher or notifier.


    # ### 10.4.1 Challenges


    The server should handle more client requests concurrently. Each client request
    has a unique identifier, which enables the mapping to the specific service provider.
    The following points must hold. The Reactor should


    +   - not block.

    +   - support maximum throughput, avoid unnecessary context switches, and, therefore,
    the copying or synchronization of data.

    +   - be easily expandable to support improved or new services.

    +   - hide the application from multi-threading and synchronization challenges.


    # ### 10.4.2 Solution


    For each supported service type implement an event handler that fulfills the specific
    client request. Register this service handler within the Reactor. The Reactor
    uses an event demultiplexer to wait synchronously on all incoming events. When
    an event arrives, the Reactor is notified and dispatches it to the specific service.'
