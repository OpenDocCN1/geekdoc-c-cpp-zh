- pgno: 16
  md: '# # Introduction


    Concurrency with Modern C++ is a journey through the present and upcoming concurrency
    features in C++.


    +   * C++11 and C++14 have the basic building blocks for creating concurrent and
    parallel programs.

    +   * With C++17 we have the parallel algorithms from the Standard Template Library
    (STL). That means that most STL-based algorithms can be executed sequentially,
    parallel, or vectorized.

    +   * The concurrency story in C++ goes on. With C++20/23, we can hope for extended
    futures, coroutines, transactions, and more.


    This book explains the details of concurrency in modern C++ and gives you also,
    many code examples. Consequently, you can combine theory with practice to get
    the most out of it.


    Because this book is about concurrency, I''d like to present many pitfalls and
    show you how to overcome them.


    # ## Conventions


    Only a few conventions.


    # ### Special Fonts


    Italic: I use *Italic* to emphasize an expression.


    Bold: I use **Bold** to emphasize even more.


    Monospace: I use `Monospace` for code, instructions, keywords, and names of types,
    variables, functions, and classes.


    # ### Special Symbols


    ⇒ stands for a conclusion in the mathematical sense. For example, a ⇒ b means
    if a then b.


    # ### Special Boxes


    Boxes contain tips, warnings, and distilled information.


    ![](img/d61a6c83410484053b8892275d2fcc4f_16_0.png)


    **Tip Headline**


    This box provides tips and additional information about the presented material.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '![](img/d61a6c83410484053b8892275d2fcc4f_17_0.png)


    # ### Warning Headline


    Warning boxes should help you to avoid pitfalls.


    ![](img/d61a6c83410484053b8892275d2fcc4f_17_1.png)


    # ### Distilled Information


    This box summarizes at the end of each main section the important things to remember.


    # # Source Code


    All source code examples are complete. That means, assuming you have a conforming
    compiler, you can compile and run them. The name of the source file is in the
    title of the listing. I use the `using namespace std` directive in the source
    files only if necessary.


    # ## Run the Programs


    Compiling and running the examples is quite easy for the C++11 and C++14 examples
    in this book. Every modern C++ compiler should support them. For the GCC¹ and
    the clang² compiler, the C++ standard must be specified as well as the threading
    library. For example the g++ compiler from GCC creates an executable program called
    thread with the following command-line: `g++ -std=c++14 -pthread thread.cpp -o
    thread`.


    +   - `-std=c++14`: use the language standard C++14

    +   - `-pthread`: add support for multithreading with the pthread library

    +   - `thread.cpp`: source file

    +   - `-o thread`: executable program


    The same command-line holds for the clang++ compiler. The Microsoft Visual Studio
    17 C++ compiler supports C++14 as well.


    If you have no modern C++ compiler at your disposal, there are many online compilers
    available. Arne Mertz'' blog post C++ Online Compiler³ gives an excellent overview.


    With C++17 and C++20/23, the story becomes quite complicated. I installed the
    HPX (High Performance ParallelX)⁴ framework, which is a general-purpose C++ runtime
    system for parallel and distributed applications of any scale. HPX has already
    implemented the Parallel STL of C++17 and many of the concurrency features of
    C++20 and C++23.


    +   1. https://gcc.gnu.org/

    +   2. https://clang.llvm.org/

    +   3. https://arne-mertz.de/2017/05/online-compilers/

    +   4. http://stellar.cct.lsu.edu/projects/hpx/'
