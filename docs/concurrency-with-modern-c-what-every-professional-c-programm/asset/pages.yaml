  md: "# 6.2.8 std::mutex with Resource Hierarchy\n\nTo completely avoid busy waiting\
    \ we need more help from the scheduler. If every thread tells the scheduler the\
    \ resource state, the scheduler can put a “wait for a resource” thread into the\
    \ “waiting” state. After the scheduler gets a “resource is available” information,\
    \ the waiting thread state changes to ready. The thread to scheduler information\
    \ exchange is expensive. Because of this C++ offers both, spinlock and mutex.\
    \ Spinlock is waiting in the thread and mutex is waiting in the scheduler. File\
    \ dp_B.cpp shows the mutex solution. Please note the #include <mutex>:\n\nstd::mutex\
