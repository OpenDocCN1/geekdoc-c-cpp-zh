- pgno: 243
  md: '# # Distilled Information


    +   - C++ supports two kinds of threads: the basic thread std::thread (C++11)
    and the improved thread std::jthread (C++20).

    +     - A std::thread gets a callable as work package and starts immediately.
    The creator of a thread is responsible for the created thread. Either the creator
    waits until the created thread is done (t.join()) or the creator detaches (t.detach())
    itself from the created thread. A thread is joinable if no operation t.join()
    or t.detach() was performed on it. A joinable thread calls std::terminate in its
    destructor, and the program terminates.

    +     - A std::jthread extends the interface of a std::thread. It automatically
    joins in its destructor and supports cooperative interruption.

    +   - You have to coordinate access to a shared variable if more than one thread
    uses it simultaneously and the variable is mutable. A mutex guarantees that only
    one thread can access a shared variable at any given time. You should encapsulate
    a mutex in a lock to release the mutex automatically and, therefore, overcome
    the many issues of mutexes. C++ offers mutex and locks in many variations.

    +   - If shared data is read-only, it''s sufficient to initialize it in a thread-safe
    way. C++ offers various ways to achieve this, including using a constant expression,
    a static variable with block scope, or the function std::call_once combined with
    the flag std::once_flag.

    +   - Declaring a variable as thread-local ensures that each thread gets its copy.
    The lifetime of thread-local data is bound to the lifetime of its thread.

    +   - Condition variables enable threads to be synchronized via messages. One
    thread acts as the sender while the other acts as the receiver of the message.
    The receiver blocks waiting for the message from the sender.

    +   - std::jthread and std::condition_variable_any support cooperative interruption
    by design. Cooperative interruption is based on the std::stop_source, std::stop_token,
    and the std::stop_callback.

    +   - Semaphores are a synchronization mechanism used to control concurrent access
    to a shared resource. The counter of a semaphore is initialized in the constructor.
    Acquiring the semaphore decreases the counter, and releasing the semaphore increases
    the counter. If a thread tries to acquire the semaphore when the counter is zero,
    the thread will block until another thread increments the counter by releasing
    the semaphore.

    +   - Latches and barriers are coordination types that enable some threads to
    block until a counter becomes zero. The counter is initialized in the constructor.

    +   - Tasks have a lot in common with threads. While you explicitly create a thread,
    a task is just a job you start. The C++ runtime automatically handles the task''s
    lifetime, such as in the simple case of std::async. Tasks are like data channels
    between two communication endpoints. They enable thread-safe communication between
    threads. The promise as one endpoint puts data into the data channel, the future
    at the other endpoint picks the value up. The data can be a value, an exception,
    or simply a notification. In addition to std::async, C++ has the class templates
    std::promise and std::future that give you more control over the task.

    +   - C++ enables synchronized output streams. A synchronized output stream accumulates
    output in its buffer and flushes it when it is destructed. Consequently, the content
    appears as a contiguous sequence of characters, and no interleaving of characters
    can happen'
