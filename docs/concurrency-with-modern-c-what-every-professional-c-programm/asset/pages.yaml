    # ### 3.3.2 Locks


    Locks take care of their resource following the RAII idiom. A lock automatically
    binds its mutex in the constructor and releases it in the destructor. This considerably
    reduces the risk of a deadlock, because the runtime takes care of the mutex.


    Locks are available in four different flavours: `std::lock_guard` for the simple
    use-cases; `std::unique_lock` for the advanced use-cases. `std::shared_lock` is
    available since C++14 and can be used to implement reader-writer locks. With C++17
    we got the `std::scoped_lock` which can lock more mutexes in an atomic step.


    First, the simple use-case.


