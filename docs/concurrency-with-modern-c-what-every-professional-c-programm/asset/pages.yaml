    ```\n\nFor the details, have a look at cppreference.com^13. It is quite easy to\
    \ modify a shared pointer bound by reference in a thread-safe way.\n\n**A data\
    \ race for a `std::shared_ptr` resolved**\n\n```\n    1 std::shared_ptr<int> ptr\
