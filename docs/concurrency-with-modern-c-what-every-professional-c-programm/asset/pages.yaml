  img_proc: true
- pgno: 521
  md: '![](img/d61a6c83410484053b8892275d2fcc4f_521_0.png)


    **Monitor Object**


    +   1. **Monitor Object**: The Monitor Object supports one or more member functions.
    Each client must access the object through these member functions, and each member
    function runs in the client''s thread.

    +   2. **Synchronized member functions**: The synchronized member functions are
    the member functions supported by the Monitor Object. Only one member function
    can execute at any given point in time. The Thread-Safe Interface helps to distinguish
    between the interface member functions (synchronized member functions) and the
    implementation member functions of the Monitor Object.

    +   3. **Monitor lock**: Each Monitor Object has one monitor lock, which ensures
    that at most one client can access the Monitor Object at any given point in time.

    +   4. **Monitor condition**: The monitor condition allows separate threads to
    schedule their member function invocations on the Monitor Object. When the current
    client is done with its invocation of the synchronized member functions, the next
    waiting client is awakened to invoke the Monitor Object''s synchronized member
    functions.


    While the monitor lock ensures the synchronized member functions'' exclusive access,
    the monitor condition guarantees minimal waiting for the clients. Essentially,
    the monitor lock protects from data races and the condition monitor from deadlocks.


    # ## 10.2.4 Dynamic Behavior


    The interaction between the Monitor Object and its components has different phases.


    +   - When a client invokes a synchronized member function on a Monitor Object,
    it must first lock the global monitor lock. If the client is successful with its
    locking, it executes the synchronized member function and unlocks the monitor
    lock at the end. If the client is not successful, the client is blocked.'
