  md: '# 2.2 The Contract


    This contract is between the programmer and the system. The system consists of
    the compiler that generates machine code, the processor that executes the machine
    code and includes the different caches that store the program''s state. Each of
    the participants wants to optimize their part. For example, the compiler uses
    registers or modifies loops; the processor performs out-of-order execution or
    branch prediction; the caches apply prefetching of instructions or buffering of
    values. The result is - in the right case - a well-defined executable that is
    fully optimized for the hardware platform. To be precise, there is not only a
    single contract but a fine-grained set of contracts. Or to say it differently:
    the weaker the rules are that the programmer has to follow, the more potential
    there is for the system to generate a highly optimized executable.


    There is a rule of thumb. The stronger the contract, the fewer liberties for the
    system to generate an optimized executable. Sadly, the other way around does not
    work. When the programmer uses an extremely weak contract or memory model, there
    are many optimization choices. The consequences are that the program is only manageable
    by a handful of worldwide recognized experts, which probably neither you nor I
    belong.


    Roughly speaking, there are three contract levels in C++11.


    ![](img/d61a6c83410484053b8892275d2fcc4f_37_0.png)


    Three levels of the contract


    Before C++11, there was only one contract. The C++ language specification did
    not include mul-'
