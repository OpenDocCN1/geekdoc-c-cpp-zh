  md: 'situation.” If you carefully read the literature on concurrency patterns, you
    often find the double-checked locking pattern. The double-checked locking pattern''s
    general idea is, in one sentence, the thread-safe initialization of shared state
    in an optimized way. This shared state is typically a singleton². I intentionally
    put the double-checked locking pattern in the case studies chapter of this book
    to emphasize it explicitly: naively usage of the double-checked locking pattern
    may end in undefined behavior. The issues of the double-checked locking pattern
    boil essentially down to the issues of the singleton pattern.


    If you want to use the singleton pattern, you have to think about the following
    challenges:


    +   - First and foremost, the singleton is a global object. Due to this fact,
    the singleton usage is most of the time not visible in the interface. The effect
    is that you have a hidden dependency in the code which uses the singleton.

    +   - A singleton is a static object and is, therefore, once created, never destroyed.
    Its lifetime ends with the lifetime of the program.

    +   - If your static class member, such as a singleton, depends on another static
    member defined in another translation unit, you have no guarantee which one is
    initialized first. The probability that it fails is 50 %.

    +   - A singleton is often used when just an instance of a class would also do
    the job. Many developers use the singleton to prove that they know their design
    pattern.


    # ## Distilled Information


    +   - Patterns are documented best practices from the best. They “… express a
    relation between a certain context, a problem, and a solution.” Christopher Alexander³.

    +   - Patterns provide more than just best practices. They provide a well-defined
    terminology and improve documentation.

    +   - A anti-pattern stands for a lesson learned or a proven way to shoot yourself
    in the foot.'
