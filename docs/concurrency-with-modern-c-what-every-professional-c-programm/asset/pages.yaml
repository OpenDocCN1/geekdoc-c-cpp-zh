  md: "Of course, putting the deposit and the takeOff call into one critical section\
    \ would guarantee the invariant.\n\n# ## 12.9 Exceptions\n\nWhat should happen\
    \ if an exception occurs? The answer to this question depends on the data structure\
    \ you use to create the thread. Here are a few options?\n\n+   - `std::thread`:\
    \ When the created thread throws an exception, `std::terminate` is called. This\
    \ means that `std::terminate` passes the main-thread.\n+   - Task: Tasks such\
    \ as `std::async`, `std::packaged_task`, and `std::promise` can throw an exception\
    \ which has to be handled by the associated `std::future`.\n+   - Parallel algorithms\
    \ of the STL: If an exception occurs during the usage of an algorithm with an\
    \ execution policy, `std::terminate` is called.\n\n`std::terminate` calls the\
    \ installed `std::terminate_handler`¹. The consequence is that per default `std::abort`²\
    \ is called, which causes abnormal program termination.\n\nNow, it’s time to consider\
    \ these concerns in practice. Typically concurrent data structures are stacks\
    \ and queues.\n\n# ### Distilled Information\n\n+   - There many question you\
    \ have to answer before you design lock-based or lock-free data structures.\n\
    +   -\n+   - Should data data structure support coarse-grained, fine-grained locking,\
    \ or even be lock-free?\n+   - What are the typical usage patterns of your concurrent\
    \ data structure? Do you want to optimize the data structure for read or write\
    \ operations or for high contention?\n\n¹https://en.cppreference.com/w/cpp/error/terminate_handler\
    \  \n²https://en.cppreference.com/w/cpp/utility/program/abort"
