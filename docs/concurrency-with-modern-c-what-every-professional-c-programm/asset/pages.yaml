    # ### 9.2.4 Guarded Suspension


    The guarded suspension basic variant combines a lock and a precondition that must
    be satisfied. If the precondition is not fulfilled, that calling thread puts itself
    to sleep. To avoid a race condition which may result in a data race or a deadlock,
    the checking thread uses a lock.


    Various variants exist:


    +   - The waiting thread can passively be notified about the state change or actively
    ask for the state change. In short, I call this push versus pull principle.


