- pgno: 152
  md: "A std::shared_lock has the same interface as a std::unique_lock but behaves\
    \ differently when used with a std::shared_timed_mutex or a std::shared_mutex.\
    \ Many threads can share one std::shared_timed_mutex (std::shared_mutex) and,\
    \ therefore, implement a reader-writer lock. The idea of reader-writer locks is\
    \ straightforward and extremely useful. An arbitrary number of threads executing\
    \ read operations can access the critical region simultaneously, but only one\
    \ thread is allowed to write.\n\nReader-writer locks do not solve the fundamental\
    \ problem - threads competing for access to a critical region, but they help minimize\
    \ the bottleneck.\n\nA telephone book is a typical example of using a reader-writer\
    \ lock. Usually, many people want to look up a telephone number, but only a few\
    \ want to change them. Let's look at an example.\n\n# ## Reader-writer locks\n\
    \n```\n```cpp\n// readerWriterLock.cpp\n\n#include <iostream>\n#include <map>\n\
    #include <shared_mutex>\n#include <string>\n#include <thread>\n\nstd::map<std::string,int>\
    \ teleBook{{\"Dijkstra\", 1972}, {\"Scott\", 1976},\n                        \
    \          {\"Ritchie\", 1983}};\n\nstd::shared_timed_mutex teleBookMutex;\n\n\
    void addToTeleBook(const std::string& na, int tele){\n  std::lock_guard<std::shared_timed_mutex>\
    \ writerLock(teleBookMutex);\n  std::cout << \"\\nSTARTING UPDATE \" << na;\n\
    \  std::this_thread::sleep_for(std::chrono::milliseconds(500));\n  teleBook[na]=\
    \ tele;\n  std::cout << \" ... ENDING UPDATE \" << na << '\\n';\n}\n\nvoid printNumber(const\
    \ std::string& na){\n  std::shared_lock<std::shared_timed_mutex> readerLock(teleBookMutex);\n\
    \  std::cout << na << \": \" << teleBook[na];\n}\n\nint main(){\n\n  std::cout\
    \ << '\\n';\n\n  std::thread reader1([]{ printNumber(\"Scott\"); });\n  std::thread\
    \ reader2([]{ printNumber(\"Ritchie\"); });\n  std::thread w1([]{ addToTeleBook(\"\
    Scott\",1968); });\n```\n```"
