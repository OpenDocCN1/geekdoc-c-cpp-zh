  md: "Both threads t1 and t2 should do their simple job: printing their IDs. In addition\
    \ to that, thread t2 is moved to t (line 12). In the end, the main thread takes\
    \ care of its children and joins them. But wait, the result is very different\
    \ from my expectations:\n\n![](img/d61a6c83410484053b8892275d2fcc4f_674_0.png)\n\
    \nErroneous moving a thread\n\nWhat is going wrong? We have two issues:\n\n+ \
    \  1. By moving the thread t2, it gets a new callable unit, and its destructor\
    \ is called. As a result, t’s destructor calls std::terminate, because it is still\
    \ joinable.\n+   2. Thread t2 has no associated callable unit. The invocation\
    \ of join on a thread without callable unit leads to the exception std::system_error.\n\
    \nKnowing this, fixing the errors is straightforward.\n\n# Moving a thread\n\n\
    ```\n```cpp\n// threadMoveFixed.cpp\n\n#include <iostream>\n#include <thread>\n\
    #include <utility>\n\nint main(){\n\n    std::thread t1([]{std::cout << std::this_thread::get_id()\
    \ << '\\n';});\n    std::thread t2([]{std::cout << std::this_thread::get_id()\
    \ << '\\n';});\n\n    t.join();\n    t = std::move(t2);\n    t.join();\n\n   \
    \ std::cout << \"\\n\";\n\n    std::cout << std::boolalpha << \"t2.joinable():\
    \ \" << t2.joinable() << '\\n';\n\n}\n```\n```\n\nThe result is that thread t2\
    \ is not joinable anymore."
