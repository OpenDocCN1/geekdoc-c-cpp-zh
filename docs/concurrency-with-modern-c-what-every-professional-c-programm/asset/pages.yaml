- pgno: 510
  md: '+   - The **Half-Sync/Half-Async** architectural pattern decouples asynchronous
    and synchronous service processing in concurrent systems to simplify programming
    without unduly reducing performance. The pattern introduces two intercommunicating
    layers, one for asynchronous and one for synchronous service processing. *Pattern-Oriented
    Software Architecture: Patterns for Concurrent and Networked Objects*^4

    +   - The **Reactor** pattern is an event-driven framework to demultiplex and
    dispatch service requests concurrently onto various service providers. *Pattern-Oriented
    Software Architecture: Patterns for Concurrent and Networked Objects*^5

    +   - The **Proactor** pattern enables event-driven applications to demultiplex
    and dispatch service requests triggered by the completion of an asynchronous operation.
    *Pattern-Oriented Software Architecture: Patterns for Concurrent and Networked
    Objects*^6


    # ## 10.1 Active Object


    The Active Object design pattern decouples method invocation from method execution.
    The method invocation is performed on the client thread, but the method execution
    on the Active Object. The Active Object has its own thread and a list of method
    request objects (short request) to be executed. The client''s method invocation
    enqueues the requests on the Active Object''s list. The requests are dispatched
    on the servant. The Active Object pattern is also known as Concurrent Object.


    # ### 10.1.1 Challenges


    When many threads access a shared object synchronized, the following challenges
    have to be solved.


    +   1. A thread invoking a processing-intensive member function should not block
    the other threads invoking the same object for too long.

    +   2. It should be easy to synchronized access a shared object.

    +   3. The concurrency characteristics of the executed requests should be adaptable
    to the concrete hardware and software.


    # ### 10.1.2 Solution


    The client''s method invocation goes to a proxy, which represents the interface
    of the Active Object. The servant implements these member functions and runs in
    the Active Object''s thread. At run time, the proxy transforms the invocation
    into a method invocation on the servant. This request is enqueued in an activation
    list by the scheduler. A scheduler''s event loop runs in the same thread as the
    servant, dequeues the requests from the activation list, removes them, and dispatches
    them on the servant. The client obtains the result of the method invocation via
    a future from the proxy.


