    there were only restricted opportunities to optimize the executable. The system’s
    key point was to guarantee for the programmer that the observed behavior of the
    program corresponded to the sequence of the instructions in the source code. Of
    course, this means there was no memory model. Instead, there was the concept of
    a sequence point. Sequence points are points in the program at which the effects
    of all instructions preceding it must be observable. The start or the end of the
    execution of a function are sequence points. When you invoke a function with two
    arguments, the C++ standard makes no guarantee about which argument is evaluated
    first, so the behavior is unspecified. The reason is straightforward - the comma
    operator is not a sequence point, which does not change in C++.


