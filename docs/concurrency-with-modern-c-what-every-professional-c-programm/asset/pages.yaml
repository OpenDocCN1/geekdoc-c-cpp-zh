  md: "```\n```cpp\nstd::mutex m;\n{\n    std::lock_guard<std::mutex> lockGuard(m);\n\
    \    sharedVariable = getVar();\n}\n```\n```\n\nThat was easy, but what's the\
    \ story with the opening and closing brackets? Its scope limits the lifetime of\
    \ `std::lock_guard` and the scope is defined by the curly brackets⁴. This means\
    \ that its lifetime ends when it passes the closing curly brackets. Exactly then,\
    \ the `std::lock_guard` destructor is called, and - as you may have guessed -\
    \ the mutex is released. This happens automatically, and it happens also if `getVar()`\
    \ in `sharedVariable = getVar()` throws an exception. Function scope and loop\
    \ scope also limit the lifetime of an object.\n\n# ### 3.3.2.2 std::scoped_lock\n\
    \nWith C++17 we got the `std::scoped_lock`. It's very similar to `std::lock_guard`,\
    \ but `std::scoped_lock` can, additionally, lock an arbitrary number of mutexes\
    \ atomically. You have to keep a few facts in mind.\n\n+   1. If `std::scoped_lock`\
    \ is invoked with one mutex `m` it behaves such as a `std::lock_guard` and locks\
    \ the mutex `m`: `m.lock`. If the `std::scoped_lock` is invoked with more than\
    \ one mutex (`std::scoped_lock(MutexTypes& ... m)`) it uses the function `std::lock(m\
    \ ...)`.\n+   2. If the current threads already owns one of the mutexes and the\
    \ mutex is not recursive, the behavior is undefined. With high probability, you\
    \ get a deadlock.\n+   3. You can just take the ownership of the mutex without\
    \ locking them. In this case, you have to provide the `std::adopt_lock_t` flag\
    \ to the constructor: `std::scoped_lock(std::adopt_lock_t, MutexTypes& ... m)`.\n\
    \nYou can quite elegantly solve the previous deadlock by using a `std::scoped_lock`.\
    \ I discuss the resolution of the deadlock in the following section.\n\n# ###\
    \ 3.3.2.3 std::unique_lock\n\nA `std::unique_lock` is stronger but more expensive\
    \ than its little brother `std::lock_guard`.\n\nIn addition to what's offered\
    \ by a `std::lock_guard`, a `std::unique_lock` enables you to\n\n+   * create\
    \ it without an associated mutex.\n+   * create it without locking the associated\
    \ mutex.\n+   * explicitly and repeatedly set or release the lock of the associated\
    \ mutex.\n+   * recursively lock its mutex.\n+   * move the mutex.\n\n⁴http://en.cppreference.com/w/cpp/language/scope#Block_scope"
