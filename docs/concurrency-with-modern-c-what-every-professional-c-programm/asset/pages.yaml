  md: '# # 14.1 General Considerations


    # ## 14.1.1 The Next Evolutionary Step


    When you design a thread-safe data structure, you often start with a lock-based
    one. This means, your first implementation is lock-based and you use coarse-grained
    locking. Due to the increase of concurrent execution, you switch probably from
    a coarse-grained implementation to a fine-grained implementation. I presented
    this route in my previous section about a concurrent queue. My coarse-grained
    implementation protected the entire queue and my fine-grained only the addressed
    nodes. The next step in this evolution is obvious: implement the concurrent queue
    lock-free. Before you make this very challenging step you should answer a few
    questions:


    +   * Do the performance requirements justify the implementation of the lock-free
    data structure?

    +   * Is there no existing lock-free data structure available? It is very likely
    that you find your lock-free data structure in Boost¹ or CDS².

    +   * Do we have the necessary expertise to implement a lock-based data structure?

    +   * Does your platform support lock-free atomics? The C++ standard guarantees
    that only `std::atomic_flag` is lock-free.


    Only if you answer all questions with yes, you may attack the challenge to implement
    a lock-based data structure.


    # ## 14.1.2 Sequential Consistency


    I use in my examples to lock-free data structures the default memory ordering:
    sequential consistency. The reason is simple. Sequential consistency provides
    the strongest guarantees of all memory ordering and is, therefore, easier to use
    than the other memory orders. Sequential consistency is an ideal starting point
    when designing lock-free data structures. In further optimization steps, you can
    weaken the memory ordering and apply acquire-release semantic, or relaxed semantic.


    Depending on the architecture, weakening the memory ordering may not pay off.
    For example, the x86³ memory model is one of the strongest memory models of all
    modern architectures. Consequentially, breaking the sequential consistency and
    applying a weaker memory ordering may not give the performance improvements you
    hoped for. On the contrary, ARMv8⁴, PowerPC⁵, Itanium⁶, and, in particular, DEC
    alpha⁷ may pay off when breaking the sequential consistency.


    ¹https://www.boost.org/doc/libs/1_66_0/doc/html/lockfree.html

    ²http://libcds.sourceforge.net/doc/cds-api/index.html

    ³https://en.wikipedia.org/wiki/X86

    ⁴https://en.wikipedia.org/wiki/ARM_architecture

    ⁵https://en.wikipedia.org/wiki/PowerPC

    ⁶https://en.wikipedia.org/wiki/Itanium

    ⁷https://en.wikipedia.org/wiki/DEC_Alpha'
