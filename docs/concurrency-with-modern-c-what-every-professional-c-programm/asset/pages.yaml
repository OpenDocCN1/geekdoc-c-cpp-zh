  md: "# **Define a task block**\n\n```\n```cpp\ntemplate <typename Func>\nint traverse(node\
    \ n, Func && f){\n  int left = 0, right = 0;\n  define_task_block(\n    [&](task_block&\
    \ tb){\n      if (n.left) tb.run([&]{ left = traverse(*n.left, f); });\n     \
    \ if (n.right) tb.run([&]{ right = traverse(*n.right, f); });\n    }\n  );\n \
    \ return f(n) + left + right;\n}\n```\n```\n\n`traverse` is a function template\
    \ that invokes function `f` on each node of its tree. The keyword `define_task_block`\
    \ defines the task block. The task block to can start a new task in this block.\
    \ This exactly happens at the left and right branches of the tree in lines 6 and\
    \ 7. Line 9 is the end of the task block and hence the synchronization point.\n\
    \n# **HPX (High Performance ParallelX)**\n\n![](img/d61a6c83410484053b8892275d2fcc4f_458_0.png)\n\
    \nThe above example is from the documentation for the HPX (High Performance ParallelX)[^13]\
    \ framework, which is a general-purpose C++ runtime system for parallel and distributed\
    \ applications of any scale. HPX has already implemented many in this chapter\
    \ presented features of the upcoming C++20/23 standards.\n\nYou can define a task\
    \ block by using either the function `define_task_block` or the function `define_task_block_restore_thread`.\n\
    \n# **7.4.2 define_task_block Versus define_task_block_restore_thread**\n\nThe\
    \ subtle difference is that the function `define_task_block_restore_thread` guarantees\
    \ in contrast to the function `define_task_block` that the creator thread of the\
    \ task block is the same thread that runs after the task block.\n\n[^13]: http://stellar.cct.lsu.edu/projects/hpx/"
