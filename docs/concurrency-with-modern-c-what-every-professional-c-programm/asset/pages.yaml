  md: "# ### Synchronization with a signal handler\n\n```\n```cpp\n// atomicSignal.cpp\n\
    \n#include <atomic>\n#include <cassert>\n#include <csignal>\n\nstd::atomic<bool>\
    \ a{false};\nstd::atomic<bool> b{false};\n\nextern \"C\" void handler(int) {\n\
    \    if (a.load(std::memory_order_relaxed)) {\n        std::atomic_signal_fence(std::memory_order_acquire);\n\
    \        assert(b.load(std::memory_order_relaxed));\n    }\n}\n\nint main() {\n\
    \n    std::signal(SIGTERM, handler);\n\n    b.store(true, std::memory_order_relaxed);\n\
    \    std::atomic_signal_fence(std::memory_order_release);\n    a.store(true, std::memory_order_relaxed);\n\
    \n}\n```\n```\n\nFirst, I set in line 19 the signal handler handler for the particular\
    \ signal SIGTERM. SIGTERM is a termination request for the program. Both std::atomic_signal_handler\
    \ establish an acquire-release fence between the release operation std::atomic_signal_fence(std::memory_order_release)\
    \ (line 22) and the acquire operation std::atomic_signal_fence(std::memory_order_acquire)\
    \ (line 12). This means in particular that release operations can not be reordered\
    \ across the release fence (line 22) and that acquire operations can not be reordered\
    \ across the acquire fence (line 11). Consequently, the assertion in line 13 assert(b.load(std::memory_order_relaxed))\
    \ never fires because if a.store(true, std::memory_order_relaxed) (line 23) happened,\
    \ b.store(true, std::memory_order_relaxed) (line 21) must have happened before."
