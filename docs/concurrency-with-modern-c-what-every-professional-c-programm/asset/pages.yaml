  md: '# 18.35 TriviallyCopyable


    TriviallyCopyable objects can be copied by copying their object representations
    manually (`std::memmove`).

    All data types compatible with the C language (POD types) are trivially copyable.


    Formally, TriviallyCopyable is a concept that has to fulfill the following requirements:


    +   - Every copy constructor is trivial or deleted

    +   - Every move constructor is trivial or deleted

    +   - Every copy assignment operator is trivial or deleted

    +   - Every move assignment operator is trivial or deleted

    +   - at least one copy constructor, move constructor, copy assignment operator,
    or move assignment operator is non-deleted

    +   - Trivial non-deleted destructor


    This implies that the class has no virtual functions or virtual base classes.
    Trivial, in essence, means that none of the specified special member functions
    is user-defined. This includes also all base classes and non-static class types.


    # 18.36 Undefined Behavior


    All bets are off. Your program can produce the correct result, the wrong result,
    can crash at run time, or may not even compile. That behavior might change when
    porting to a new platform, upgrading to a new compiler, or as a result of an unrelated
    code change.


    # 18.37 volatile


    `volatile` is typically used to denote objects which can change independently
    of the regular program flow. For example, these are objects in embedded programming
    that represent an external device (memory-mapped I/O). Because these objects can
    change independently of the regular program flow and their value is directly be
    written into main memory, no optimized storing in caches takes place.


    # 18.38 wait-free


    A non-blocking algorithm is wait-free if there is guaranteed per-thread progress.


    Each thread incrementing the counter in the following program makes progress.'
