- pgno: 109
  md: '+   - **Acquire fence:** An acquire fence `std::atomic_thread_fence(std::memory_order_acquire)`
    prevents a read operation before an acquire fence from being reordered with a
    read or write operation after the acquire fence.

    +   - **Release fence:** A release fence `std::atomic_thread_fence(std::memory_order_release)`
    prevents a write operation after a release fence from being reordered with a read
    or write operation before a release fence.


    A lot of energy goes into getting the definitions of the acquire and release fence
    and their consequences for lock-free programming right. Especially challenging
    to understand are the subtle differences between the acquire-release semantic
    of atomic operations. Before I get to that point, I illustrate the definitions
    with graphics.


    Which kind of operations can cross a memory barrier? Have a look at the following
    three graphics. If the arrow is crossed with a red bar, then the fence prevents
    this type of operation.


    # 2.5.1.2.1 Full fence


    ![](img/d61a6c83410484053b8892275d2fcc4f_109_0.png)


    Full fence


    Of course, instead of writing `std::atomic_thread_fence()` you can explicitly
    write `std::atomic_thread_fence(std::memory_order_seq_cst)`. [Sequential consistency](#)
    is applied to fences by default. If you use sequential consistency for a full
    fence, the `std::atomic_thread_fence` follows a global order.'
