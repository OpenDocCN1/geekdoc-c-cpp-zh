  md: '# ## 6.5 Fast Synchronization of Threads


    When you want to synchronize threads more than once, you can use condition variables,
    `std::atomic_flag`, `std::atomic<bool>`, or semaphores. In this section, I want
    to answer the question: Which variant is the fastest?


    To get comparable numbers, I implement a ping-pong game. One thread executes a
    ping function, and the other thread a pong function. For simplicity reasons, I
    call the thread executing the ping function the ping thread and the other thread
    the pong thread. The ping thread waits for the notification of the pong thread
    and sends the notification back to the pong thread. The game stops after 1''000''000
    ball changes. I perform each game five times to get comparable performance numbers.


    ![](img/d61a6c83410484053b8892275d2fcc4f_387_0.png)


    # ### About the Numbers


    I made my performance test at the end of 2020 with the brand new Visual Studio
    compiler 19.28 because it already supported synchronization with atomics (std::atomic_flag
    and std::atomic) and semaphores. Additionally, I compiled the examples with maximum
    optimization (/Ox). The performance number should only give a rough idea of the
    relative performance of the various ways to synchronize threads. When you want
    the exact number on your platform, you have to repeat the tests.


    Let me start the comparison with condition variables.


    # ### 6.5.1 Condition Variables


    **Multiple time synchronization with a condition variable**


    ```

    ```cpp

