  md: '# # 17. CppMem - An Overview


    CppMem¹ is an interactive tool for exploring the behavior of small code snippets
    using the C++ memory model. It has to be in the toolbox of each programmer who
    seriously deals with the memory model.


    The online version of CppMem - you can also install it on your PC - provides valuable
    services in a twofold way:


    +   1. CppMem verifies the behavior of small code snippets. Based on the C++ memory
    model''s chosen variant, the tool considers all possible interleavings of threads,
    visualizes each of them in a graph, and annotates these graphs with additional
    details.

    +   2. The very accurate analysis of CppMem gives you deep insight into the C++
    memory model. In short, CppMem is a tool that helps you to get a better understanding
    of the memory model.


    Of course, it''s often the nature of powerful tools that you first have to overcome
    a few hurdles. The nature of things is that CppMem gives you a very detailed analysis
    related to this incredibly challenging topic and is highly configurable. Therefore,
    I plan to present the components of the tool.


    # ## 17.1 The simplified Overview


    My simplified overview of CppMem is based on the default configuration. This overview
    only provides you with the base for further experiments and should help you understand
    my ongoing optimization process.


    ¹http://svr-pes20-cppmem.cl.cam.ac.uk/cppmem/'
  merge: -1
  img_proc: true
- pgno: 700
  md: '![](img/d61a6c83410484053b8892275d2fcc4f_700_0.png)


    The default configuration of CppMem


    For the sake of simplicity, I refer to the red numbers in the screenshot.


    # ### 17.1.1 1. Model


    +   - Specifies the C++ memory model. *preferred* is a simplified but equivalent
    variant of the C++11 memory model.


    # ### 17.1.2 2. Program


    +   - Contains the executable program in a simplified C++11 like syntax. To be
    precise, you cannot directly copy C or C++ code programs into CppMem.

    +   - You can choose between many programs that implement typical multithreading
    scenarios. To get these programs'' details read the very well-written article
    Mathematical C++ Concurrency². Of course, you can also run your code.

    +   - CppMem is about multithreading, therefore, there are shortcuts for multithreading
    available.

    +     - You can easily define two threads using the expression `{{ ... || ...
    }}`. The three dots (...) represents the work package of each thread.


    ²http://www.cl.cam.ac.uk/~pes20/cpp/popl085ap-sewell.pdf'
