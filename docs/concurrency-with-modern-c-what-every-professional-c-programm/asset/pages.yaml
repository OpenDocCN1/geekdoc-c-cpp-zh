    One year later, Frank Buschmann, Regine Meunier, Hans Rohnert, Peter Sommerlad,
    and Michael Stal published their highly influential book *Pattern-Oriented Software-Architecture:
    A System of Patterns*, or in short POSA. This book was the starting point of a
    series of five books. It was published in 1995 and has three categories of patterns:
    architectural patterns, design patterns, and idioms. Many of the patterns are
    now common terminology:


    +   - Architectural Patterns

    +     - Layers

    +     - Pipes-and_Filters

    +     - Broker

    +     - Model-View-Controller

    +   - Design Patterns

    +     - Master-Slave

    +     - Publish-Subscriber

    +   - Idioms

    +     - Counted-Pointer


    What is the difference between these three categories? The focus of the architectural
    patterns is the entire software system. They are more abstract than the design
    patterns, which define the interplay between the subsystems. Idioms are implementations
    of an architectural or design pattern in a given programming language. They have
    the lowest abstraction level of all three.


    Each of the books two to five of the POSA series has a different focus. They deal
    with “Patterns for Concurrent and Networked Objects” (volume 2), with “Patterns
    for Resource Management” (volume 3), with “A Pattern Language for Distributed
    Computing” (volume 4), and “On Patterns and Pattern Languages” (volume 5). The
    book sections Synchronization Patterns and Concurrent Architecture are strongly
    influenced by the second volume of the series.'
