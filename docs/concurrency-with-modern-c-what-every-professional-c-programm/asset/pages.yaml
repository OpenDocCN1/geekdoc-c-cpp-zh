    # ### `std::current_exception` and `std::make_exception_ptr`


    `std::current_exception()` captures the current exception object and creates a
    `std::exception_ptr`. `std::exception_ptr` holds either a copy or a reference
    to the exception object. If the function is called when no exception is being
    handled, an empty `std::exception_ptr` is returned.


    Instead of retrieving the thrown exception in a try/catch block with `IntPromise.set_exception(std::current_exception())`,
    you can directly call `IntPromise.set_exception(std::make_exception_ptr(std::runtime_error(errMess)))`.


    If you destroy the `std::promise` without calling the set-member function or a
    `std::packaged_task` before invoking it, a `std::future_error` exception with
    an error code `std::future_errc::broken_promise` would be stored in the shared
    state.


    # ### 3.9.7 Notifications


    Tasks are a safe replacement for condition variables. If you use promises and
    futures to synchronize threads, they have a lot in common with condition variables.
    Most of the time, promises and futures are the better choices.


    Before I present you an example, here is the big picture.


