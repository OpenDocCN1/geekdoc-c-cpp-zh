    \ operations to the referenced object. Therefore, concurrent writing and reading\
    \ of atomic object is no data race. The lifetime of the referenced object must\
    \ exceed the lifetime of the `atomic_ref`. When any `atomic_ref` is accessing\
    \ an object, all other accesses to the object must use an `atomic_ref`. In addition,\
    \ no subobject of the `atomic_ref`-accessed object may be accessed by another\
