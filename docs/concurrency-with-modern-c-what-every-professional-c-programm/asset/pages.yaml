  md: "# 9.1 Dealing with Sharing\n\nIf you don’t share, no data races can happen.\
    \ Not sharing means that your thread works on local variables. This can be achieved\
    \ by copying the value, by using thread-specific storage, or by transferring the\
    \ result of a thread to its associated future via a protected data channel. The\
    \ patterns in this section are quite obvious, but for completeness, I will present\
    \ them with a short explanation.\n\n# 9.1.1 Copied Value\n\nIf a thread gets its\
    \ arguments by copy and not by reference, there is no need to synchronize access\
    \ to any data. No data races and no lifetime issues are possible.\n\n# 9.1.1.1\
    \ Data Races with References\n\nThe following program creates three threads. One\
    \ thread gets its argument by copy, the other by reference, and the last by constant\
    \ reference.\n\n```\nData races with references\n\n```cpp\n// copiedValueDataRace.cpp\n\
    \n#include <functional>\n#include <iostream>\n#include <string>\n#include <thread>\n\
    \nusing namespace std::chrono_literals;\n\nvoid byCopy(bool& b){\n    std::this_thread::sleep_for(1ms);\n\
    \    std::cout << \"byCopy: \" << b << '\\n';\n}\n\nvoid byReference(bool& b){\n\
    \    std::this_thread::sleep_for(1ms);\n    std::cout << \"byReference: \" <<\
    \ b << '\\n';\n}\n\nvoid byConstReference(const bool& b){\n    std::this_thread::sleep_for(1ms);\n\
    \    std::cout << \"byConstReference: \" << b << '\\n';\n}\n\nint main(){\n```\n\
    \n```"
