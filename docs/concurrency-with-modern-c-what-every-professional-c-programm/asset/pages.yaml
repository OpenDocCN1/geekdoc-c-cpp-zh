  md: '+   * condVar.wait(lek): If the condition_variable condVar is waiting and gets
    a notification or a spurious wakeup the following steps happen.

    +       - The thread is unblocked and reacquires the lock on the mutex.

    +       - The thread checks the predicate.

    +       - If the call of the predicated evaluates to

    +           * true: the thread continues its work.

    +           * false: condVar.wait() unlocks the mutex and puts the thread in a
    waiting (blocking) state.


    Even if the shared variable is atomic, it must be modified under the mutex to
    correctly publish the modification to the waiting thread.


    # **Use a mutex to protect the shared variable**


    Even if you make dataReady an atomic, it must be modified under the mutex; if
    not the modification to the waiting thread may be published but not correctly
    synchronized. This race condition may cause a deadlock. What does that mean: published,
    but not correctly synchronized. Let''s have a closer look at the wait workflow
    and assume that deadReady is atomic and is modified, not protected by the mutex
    mutex_.


    ```

    1    std::unique_lock<std::mutex> lck(mutex_);

    2    while (![]{ return dataReady.load(); }()) {

    3        // time window

    4        condVar.wait(lck);

    5    }

    ```


    Let me assume the notification is send while the condition variable condVar is
    not waiting. This means the thread''s execution is in the source snippet between
    line 2 and 4 (see the comment time window). The result is that the notification
    is lost. Afterward, the thread goes back waiting and presumably sleeps forever.


    This wouldn''t have happened if a mutex had protected ''dataReady''. Because of
    the synchronization with the mutex, the notification would only be sent if the
    condition variable and, therefore, the receiver thread is waiting.


    In most of the use-cases, tasks are the less error-prone way to synchronize threads.
    I compare condition variables and tasks in the section Returning a Notification.'
