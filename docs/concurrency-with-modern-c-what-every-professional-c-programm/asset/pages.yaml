  md: "# 3.3.4.1 Constant Expressions\n\nConstant expressions are expressions that\
    \ the compiler can evaluate at compile time. They are implicitly thread-safe.\
    \ Placing the keyword constexpr in front of a variable makes the variable a constant\
    \ expression. The constant expression must be initialized immediately.\n\n```\n\
    `constexpr double pi = 3.14;`\n```\n\nBesides, user-defined types can also be\
    \ constant expressions. For those types, there are a few restrictions that must\
    \ meet to initialize it at compile-time.\n\n+   - They must not have virtual member\
    \ functions or a virtual base class.\n+   - Their constructor must be a constant\
    \ expression.\n+   - Every base class and each non-static member must be initialized.\n\
    +   - Their member functions, which should be callable at compile time, must be\
    \ constant expressions.\n\nInstances of MyDouble satisfy all these requirements.\
    \ So it is possible to instantiate them at compile time. This instantiation is\
    \ thread-safe.\n\nUser defined constant expressions\n\n```\n```cpp\n// constexpr.cpp\n\
    \n#include <iostream>\n\nclass MyDouble{\nprivate:\n    double myVal1;\n    double\
    \ myVal2;\npublic:\n    constexpr MyDouble(double v1, double v2): myVal1(v1),\
    \ myVal2(v2){}\n    constexpr double getSum() const { return myVal1 + myVal2;\
    \ }\n};\n\nint main() {\n\n    constexpr double myStatVal = 2.0;\n    constexpr\
    \ MyDouble myStatic(10.5, myStatVal);\n    constexpr double sumStat = myStatic.getSum();\n\
    \n}\n```\n```"
