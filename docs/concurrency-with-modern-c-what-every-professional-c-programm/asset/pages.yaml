  md: 'case, the least maximal value is 1. `std::binary_semaphores` can be used to
    implement [locks](#)¹⁹.


    ```

    using binary_semaphore = std::counting_semaphore<1>;

    ```


    In contrast to a `std::mutex`, a `std::counting_semaphore` is not bound to a thread.
    This means that the acquire and release of a semaphore call can happen on different
    threads. The following table presents the interface of a `std::counting_semaphore`.


    **Member functions of a `std::counting_semaphore`**


    | Member function | Description |

    |---|---|

    | `std::semaphore sem{num}` | Creates a semaphore with the counter `num`. |

    | `sem.max()` (static) | Returns the maximum value of the counter. |

    | `sem.release(upd = 1)` | Increases counter by `upd` and subsequently unblocks
    threads acquiring the semaphore `sem`. |

    | `sem.acquire()` | Decrements the counter by 1 or blocks until the counter is
    greater than 0. |

    | `sem.try_acquire()` | Tries to decrement the counter by 1 if it is greater than
    0. |

    | `sem.try_acquire_for(relTime)` | Tries to decrement the counter by 1 or blocks
    for at most `relTime` if the counter is 0. |

    | `sem.try_acquire_until(absTime)` | Tries to decrement the counter by 1 or blocks
    at most until `absTime` if the counter is 0. |


    The constructor call `std::counting_semaphore<10> sem(5)` creates a semaphore
    `sem` with an at least maximal value of 10 and a counter of 5. The call `sem.max()`
    returns the maximum possible value of the internal counter. The following relations
    must hold for `upd` in `sem.release(upd = 1)`: `upd >= 0` and `upd + counter <=
    sem.max()`. `sem.try_acquire_for(relTime)` needs a [time duration](#); the member
    function `sem.try_acquire_until(absTime)` needs a [time point](#). The three calls
    `sem.try_acquire`, `sem.try_acquire_for`, and `sem.try_acquire_until` return a
    boolean indicating the success of the calls.


    Semaphores are typically used in sender-receiver workflows. For example, initializing
    the semaphore `sem` with 0 will block the receiver’s `sem.acquire()` call until
    the sender calls `sem.release()`. Consequently, the receiver waits for the notification
    of the sender. One-time synchronization of threads can easily be implemented using
    semaphores.


    ¹⁹ https://en.cppreference.com/w/cpp/named_req/BasicLockable'
