- pgno: 25
  md: '# #### 1.1.2.4 Condition Variables


    Condition variables enable threads to be synchronized via messages. One thread
    acts as the sender while the other acts as the receiver of the message. The receiver
    blocks waiting for the message from the sender. Typical use cases for condition
    variables are producer-consumer workflows. A condition variable can be either
    the sender or the receiver of the message. Using condition variables correctly
    is quite challenging; therefore, tasks are often the easier solution.


    # #### 1.1.2.5 Cooperative Interruption (C++20)


    The additional functionality of the cooperative interruption of `std::jthread`
    is based on the `std::stop_source`, `std::stop_token`, and the `std::stop_callback`
    classes. `std::jthread` and `std::condition_variable_any` support cooperative
    interruption by design.


    # #### 1.1.2.6 Semaphores (C++20)


    Semaphores are a synchronization mechanism used to control concurrent access to
    a shared resource. A counting semaphore is a semaphore that has a counter that
    is bigger than zero. The counter is initialized in the constructor. Acquiring
    the semaphore decreases the counter, and releasing the semaphore increases the
    counter. If a thread tries to acquire the semaphore when the counter is zero,
    the thread will block until another thread increments the counter by releasing
    the semaphore.


    # #### 1.1.2.7 Latches and Barriers (C++20)


    Latches and barriers are coordination types that enable some threads to block
    until a counter becomes zero. The counter is initialized in the constructor. At
    first, don''t confuse the new barriers with memory barriers, also known as fences.
    In C++20 we get latches and barriers in two variations: `std::latch`, and `std::barrier`.
    Concurrent invocations of the member functions of a `std::latch` or a `std::barrier`
    produce no data race.


    # #### 1.1.2.8 Tasks


    Tasks have a lot in common with threads. While you explicitly create a thread,
    a task is just a job you start. The C++ runtime automatically handles, such as
    in the simple case of `std::async`, the task''s lifetime.


    Tasks are like data channels between two communication endpoints. They enable
    thread-safe communication between threads. The promise as one endpoint puts data
    into the data channel, the future at the other endpoint picks the value up. The
    data can be a value, an exception, or simply a notification. In addition to `std::async`,
    C++ has the class templates `std::promise` and `std::future` that give you more
    control over the task.'
