  md: "+   - For example, when you have a thread-safe queue with one producer/consumer,\
    \ each additional producer or consumer must be blocked until the previous one\
    \ is done. This blocking restriction does not hold for many producers/many consumers\
    \ queue. For simplicity reasons, I call the second scenario an n:m relation. n\
    \ can also be 1. The second scenario is if the producer can satisfy all consumers\
    \ or the other way around. If not, producers or consumers have to wait, which\
    \ hinters scalability.\n+   - When your data structure is a bounded thread-safe\
    \ queue, you cannot expect perfect scalability because the producer/consumer fails\
    \ at one point out of lockstep. An internally used puffer between the producers\
    \ and consumers may decouple them but will not solve the original issue.\n\nLet\
    \ me answer the two questions for the concrete ThreadSafeQueue from chapter Concurrent\
    \ Architecture.\n\n# The Monitor Object\n\n```\n```cpp\ntemplate <typename T>\n\
    class Monitor{\npublic:\n    void lock() const {\n        monitMutex.lock();\n\
    \    }\n\n    void unlock() const {\n        monitMutex.unlock();\n    }\n\n \
    \   void notify_one() const noexcept {\n        monitCond.notify_one();\n    }\n\
    \    void wait() const {\n        std::unique_lock<std::recursive_mutex> monitLock(monitMutex);\n\
    \        monitCond.wait(monitLock);\n    }\n\nprivate:\n    mutable std::recursive_mutex\
    \ monitMutex;\n    mutable std::condition_variable_any monitCond;\n};\n\ntemplate\
    \ <typename T>\nclass ThreadSafeQueue: public Monitor<ThreadSafeQueue<T>>{\npublic:\n\
