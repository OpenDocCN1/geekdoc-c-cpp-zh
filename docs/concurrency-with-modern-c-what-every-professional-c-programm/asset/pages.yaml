- pgno: 539
  md: '# ### 10.5.1 Challenges


    Processing multiple service requests asynchronously can often improve the performance
    of event-driven applications such as servers. Event-driven applications must process
    multiple events synchronously to achieve this performance and avoid expensive
    data synchronization or context switching. Further, the new or improved services
    should be easily integrated, and the application should be shielded from the multi-threading
    and synchronization challenges.


    # ### 10.5.2 Solution


    Split the application services into two parts: long-duration operations, which
    should run asynchronously, and completion handlers, which process the long-duration
    asynchronous operations. The processing of the completion handler is quite similar
    to the processing of the event handler in the Reactor pattern. Still, the asynchronous
    operation is typically the job of the operating system. As the Reactor pattern,
    the Proactor pattern defines an event loop.


    Here is the unique part of the Proactor pattern compared to the Reactor pattern.
    An asynchronous operation such as a connection request is initiated, and the operation
    is performed without blocking the caller''s thread. When the long-duration operation
    is done it puts a completion event into the completion event queue. The Proactor
    waits on the queue by using the asynchronous event demultiplexer. The asynchronous
    event demultiplexer removes completion events from the queue, and the Proactor
    dispatches it to the specific completion handler. This completion handler processes
    the result of the asynchronous operation.


    # ### 10.5.3 Components


    The Proactor consists of nine components.'
