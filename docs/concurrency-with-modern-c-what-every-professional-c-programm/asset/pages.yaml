    # ## Acceptor-Connector


    The Acceptor-Connector design pattern decouples the connection and initialization
    of services in a distributed system from the processing of the services after
    they are connected and initialized. It consists of three components: acceptor,
    connector, and service handler. The acceptor waits for a connection request from
    a remote connector and establishes an end-to-end service. The acceptor and the
    connector use their service handler to encapsulate the application-specific processing.


    The Half-Sync/Half-Async pattern is typically used in the Reactor pattern to answer
    client requests in a separate thread.


    The Proactor pattern is the asynchronous variant of the reactor pattern. The Reactor
    pattern demultiplexes and dispatches its event handler synchronously, but the
    Proactor pattern asynchronously.


    # ## 10.5 Proactor


    The Proactor pattern enables event-driven applications to demultiplex and dispatch
    service requests triggered by the completion of an asynchronous operation.'
