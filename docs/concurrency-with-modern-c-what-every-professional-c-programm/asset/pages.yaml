- pgno: 713
  md: '+   - **Type constructor:** The type constructor defines how the simple data
    type becomes a monadic data type.

    +   - **Functions:**

    +     - **Identity function:** Introduces a simple value into the monad.

    +     - **Bind operator:** Defines how a function is applied to a monadic value
    to get a new monadic value.

    +   - **Rules for the functions:**

    +     - The identity function has to be the left and the right identity element.

    +     - The composition of functions has to be associative.


    For the error monad to become an instance of the type class monad, the error monad
    has to support the bind operator’s identity function. Both functions define how
    the error monad deals with an error in the calculation. If you use an error monad,
    the error handling is done in the background.


    A monad consists of two control flows. The explicit control for calculating the
    result and the implicit control flow for dealing with the specific side effect.


    Of course, you can define monad in fewer words: “A monad is just a monoid in the
    category of endofunctors.”


    Monads are becoming more and more import in C++. With C++17 we get [std::optional](https://en.cppreference.com/w/cpp/utility/optional),
    a kind of a Maybe monad. With C++20/23 we will probably get extended futures and
    the range library from Eric Niebler. Both are monads.


    # 18.23 Non-blocking


    An algorithm is called non-blocking if failure or suspension of any thread cannot
    cause failure or suspension of another thread. This definition is from the excellent
    book Java concurrency in practice.


    # 18.24 obstruction-free


    A non-blocking algorithm is obstruction-free if it guarantee that a thread can
    proceed if all other threads are suspended.


    # 18.25 Parallelism


    Parallelism means that several tasks are performed at the same time. Parallelism
    is a subset of Concurrency.


