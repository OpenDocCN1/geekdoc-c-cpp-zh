  md: '![](img/d61a6c83410484053b8892275d2fcc4f_59_0.png)


    Synchronizations of two threads with an atomic and a condition variable


    # ## Push versus Pull Principle


    I cheated a little. There is one key difference between synchronizing threads
    with a condition variable and `std::atomic<bool>`. The condition variable notifies
    the waiting thread (`condvar.notify()`) that it should proceed with its work.
    The waiting thread with `std::atomic<bool>` checks if the sender is done with
    its work (`dataRead == true`).


    The condition variable notifies the waiting thread (push principle) while the
    atomic boolean repeatedly asks for the value (pull principle).


    `std::atomic<bool>` and the other full or partial specializations of `std::atomic`
    support the bread and butter of all atomic operations: `compare_exchange_strong`
    and `compare_exchange_weak`.


    # ### 2.3.3.1.3 `compare_exchange_strong` and `compare_exchange_weak`


    `compare_exchange_strong` has the syntax: `bool compare_exchange_strong(T& expected,
    T& desired)`. Because this operation compares and exchanges its values in one
    atomic operation, it is often called compare and swap (CAS). This kind of operation
    is available in many programming languages and is the foundation of non-blocking
    algorithms. Of course, the behavior may vary a little. `atomicValue.compare_exchange_strong(expected,
    desired)` has the following behavior.


    +   - If the atomic comparison of `atomicValue` with `expected` returns true,
    `atomicValue` is set in the same atomic operation to `desired`.

    +   - If the comparison returns false, `expected` is set to `atomicValue`.


    The reason the operation `compare_exchange_strong` is called strong is apparent.
    There is also a member functions `compare_exchange_weak`. The weak version can
    fail spuriously. That means, although `*atomicValue == expected` holds, `atomicValue`
    was not set to `desired` and the function call returns'
