  md: "```\n```cpp\nreturn res;\n}\n};\n```\n```\n\nThe push call is not critical\
    \ from a concurrency perspective because `head` is updated in an atomic step.\
    \ Additionally, the `compare_exchange_strong` (line 15) call guarantees that `head`\
    \ is always the current head of the stack.\n\nDue to hazard pointers, the call\
    \ to `topAndPop` becomes more complicated. First, the function `getHazardPointer`\
    \ references the hazard pointer for the current thread (line 19). The call `hazardPointer.store(oldHead)`\
    \ (line 25) makes the current thread the owner of the hazard pointer, and the\
    \ call `hazardPointer.store(nullptr)` (line 30) releases its ownership. First,\
    \ let me analyze the inner and outer do-while loops (lines 21–28). The inner do-while\
    \ loop sets the hazard pointer to the head of the stack. The do-while loop ends\
    \ when the following holds: `oldHead == tempNode`. Both nodes are equal if `oldHead`\
    \ is still the current head of the lock-free stack. `oldHead` was made a node\
    \ in line 20 and could not be the current head anymore (line 28) because another\
    \ thread may have kicked in and already managed `oldHead`. The outer do-while\
    \ loop should be familiar from the previous lock-free stack implementations. I\
    \ iterate in the while loop using `compare_exchange_strong` and set the head to\
    \ `oldHead->next`. On end, `head` is the head of the stack. Remember, the member\
    \ function `topAndPop` should return the value of the head and remove it. Before\
    \ I use `oldHead` I have to check if `oldHead` is not a null pointer. If `oldHead`\
    \ is a null pointer, I throw an exception. The rest of the `topAndPop` is straightforward.\
    \ The call `retireList.isInUse(oldHead)` checks if `oldHead` is still in use.\
    \ Depending on this check, `oldHead` is added to the retire list `retireList.addNode`\
    \ (line 32) if it is not yet on the list or deleted (line 33). The last call `retireList.deleteUnusedNodes`\
    \ (line 37) is the most labor-intensive call in the member function `topAndPop`.\
    \ The member function `retireList.deleteUnusedNodes` traverses the entire retire\
    \ list and deletes all nodes that are not used anymore.\n\nFor performance reasons,\
    \ the call `retireList.deleteUnusedNodes` should not be executed in each call\
    \ of `topAndPop`. An improved strategy is to invoke the member function `deleteUnusedNodes`\
    \ if the length of the retire list exceeds a specific threshold. For example,\
    \ when the length of the retire list is twice the length of the stack, at least\
    \ half of the nodes can be deleted. This threshold value is a trade-off between\
    \ performance requirements and memory consumption.\n\nLet me continue my explanation\
    \ with the free function `getHazardPointer` and the retire list.\n\n# The free\
    \ function getHazardPointer\n\n```\n```cpp\ntemplate <typename T, Node MyNode\
    \ = MyNode<T>>\nstd::atomic<MyNode*>& getHazardPointer() {\n    thread_local static\
    \ HazardPointerOwner<T> hazard;\n    return hazard.getPointer();\n}\n```\n```\n\
