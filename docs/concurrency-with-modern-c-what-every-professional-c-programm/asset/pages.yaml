  md: '# ## 6.3 Thread-Safe Initialization of a Singleton


    Before I start with this case study, let me emphasize: I am not advocating using
    the singleton pattern. Therefore, allow me to begin this chapter about the thread-safe
    initialization of a singleton with a warning.


    ![](img/d61a6c83410484053b8892275d2fcc4f_347_0.png)


    # ### Thoughts about Singletons


    I only use the singleton pattern in my case studies because it is a classic example
    of a variable that has to be initialized in a thread-safe way. The singleton pattern
    has a few severe disadvantages. Let me give you a few ideas:


    +   - A singleton is a global variable in disguise. Therefore, it makes it quite
    challenging to test your function because it depends on the global state.

    +   - Typically, you use a singleton in a function by invoking the static member
    function `MySingleton::getInstance()`. This means the interface of a function
    does not tell you that you use a singleton inside. You hide the dependency on
    the singleton.

    +   - If you have static object x and y in separate source files and the construction
    of these objects depend on each other, you are in the static initialization order
    fiasco¹¹ because there is no guarantee which static is initialized first. Moreover,
    singletons are static objects.

    +   - The singleton pattern manages the lazy creation of an object but not its
    destruction. If you don''t destruct something you don''t need anymore, this is
    called a memory leak.

    +   - Imagine you want to subclass the singleton. Should it be possible? What
    does that mean for the implementation?

    +   - A thread-safe and fast singleton implementation is quite challenging.


    For a more elaborate discussion about the pros and cons of the singleton pattern,
    please refer to the referenced articles in the Wikipedia page for the singleton
    pattern¹².


    I want to start my discussion of the thread-safe initialization of the singleton
    with a short detour.


    # ### 6.3.1 Double-Checked Locking Pattern


    The double-checked locking¹³ pattern is the classical way to initialize a singleton
    in a thread-safe way. What sounds like established best practice or as a pattern,
    is more a kind of anti-pattern¹⁴. It assumes guarantees in the traditional implementation,
    which aren''t given by the Java, C# or C++ memory model anymore. The wrong assumption
    is that creating a singleton is an atomic operation; therefore, a solution that
    seems to be thread-safe is not thread-safe.


    +   - ¹¹ https://isocpp.org/wiki/faq/ctors

    +   - ¹² https://en.wikipedia.org/wiki/Singleton_pattern

    +   - ¹³ https://www.dre.vanderbilt.edu/~schmidt/PDF/DC-Locking.pdf

    +   - ¹⁴ https://en.wikipedia.org/wiki/Anti-pattern'
