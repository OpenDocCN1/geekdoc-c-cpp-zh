  md: '![](img/d61a6c83410484053b8892275d2fcc4f_366_0.png)


    First execution


    The nodes of the graph represent the expressions of the program, the edges the
    relation between the expressions. In my explanation, I refer to the names (a)
    to (f). What can I conclude from the annotations in this graph?


    +   - **a:Wna x = 0**: Is the first expression (a), which is a non-atomic write
    of x.

    +   - **sb (sequenced-before)**: The writing of the first expression (a) is sequenced
    before the writing of the second expression (b). These relations also hold between
    the expressions (c) and (d), and (e) and (f).

    +   - **rf (read from)**: The expression (e) reads the value of y from the expression
    (b). Accordingly, (f) reads from (a).

    +   - **sw (synchronizes-with)**: The expression (a) synchronises with (f). This
    relation holds because the expressions (f) takes place in a separate thread. The
    creation of a thread is a synchronization point. Everything that happens before
    the thread creation is visible in the thread. For symmetry reasons, the same argument
    holds between (b) and (e).

    +   - **dr (data race)**: Here is the data race between the reading and writing
    of the variables x and y. The program has undefined behavior.


    # ## Why is the execution consistent?


    The execution is consistent because the values x and y are initialized from the
    values in the main thread (a) and (b). The initialization of the values x and
    y from the expressions (c) and (d) is not consistent with the memory model.


    The next three executions are not consistent.'
