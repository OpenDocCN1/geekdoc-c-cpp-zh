    # ## Distilled Information


    +   - Calculating the sum of a vector can be done in various ways. You can do
    it sequentially or concurrently with maximum and minimum sharing of data. The
    performance numbers differ drastically.

    +   - Thread-safe initialization of a singleton is the classical use-case for
    thread-safe initialization of a shared variable. There are many ways to do it,
    with varying performance characteristics.

    +   - I start with a small program and successively improve it by weakening the
    memory ordering. I verify each step of my process of ongoing optimization with
    CppMem. CppMem is an interactive tool for exploring the behavior of small code
    snippets using the C++ memory model.

    +   - There are many ways in C++20 to synchronize threads. You can use condition
    variables, `std::atomic_flag`, `std::atomic<bool>`, or semaphores. I discuss the
    performance numbers of various ping-pong games.

    +   - Thanks to the new keyword `co_return`, I can implement in the section variations
    of futures an eager future, a lazy future, or a future running in a separate thread.
    Heavily used comments make its workflow transparent.

    +   - `co_yield` enables it to create infinite data streams. In the case study
    modification and generalization of a generator, the infinite data streams become
    finite and generic.

    +   - The case study of various job workflows presents a few coroutines that are
    automatically resumed if necessary. `co_await` makes this possible.'
