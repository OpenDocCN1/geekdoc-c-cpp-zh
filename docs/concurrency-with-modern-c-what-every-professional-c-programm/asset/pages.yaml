    # ### 6.3.7 Performance Numbers of the various Thread-Safe Singleton Implementations


    The numbers give a clear indication. The Meyers Singleton is the fastest one.
    It is not only the fastest one, but it is also the easiest one to get. The Meyers
    Singleton is about two times faster than the atomic versions. As expected the
    synchronization with the lock is the most heavyweight and, therefore, the slowest.
    std::call_once in particular on Windows is a lot slower than on Linux.


    Performance of all singleton implementations


    | Operating System (Compiler) | Single Threaded | Meyers Singleton | std::lock_guard
    | std::call_once | Sequential Consistency | Acquire-Release Semantic |

