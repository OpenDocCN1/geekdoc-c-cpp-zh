  md: "# ## The optimizer detects the false sharing\n\nIf I compile the last programs\
    \ with maximum optimization, my optimizer detects the false sharing and eliminate\
    \ it. This means that I get the same performance numbers with and without false\
    \ sharing. This also holds for Windows. Here are the optimized numbers.\n\n![](img/d61a6c83410484053b8892275d2fcc4f_671_0.png)\n\
    \nFalse sharing resolved by the optimizer\n\n# ## std::hardware_destructive_interference_size\
    \ and std::hardware_constructive_interference_size With C++17\n\nThe functions\
    \ `std::hardware_destructive_interference_size` and `std::hardware_constructive_interference_size`\
    \ let you deal in a portable way with the cache line size. `std::hardware_destructive_interference_size`\
    \ returns the minimum offset between two objects to avoid false sharing and `std::hardware_constructive_interference_size`\
    \ returns the maximum size of contiguous memory to promote true sharing.\n\nWith\
    \ C++17, Sum can be written in a platform-independent way.\n\n```\n~~~cpp\nstruct\
    \ Sum{\n    alignas(std::hardware_destructive_interference_size) long long a{};\n\
    \    alignas(std::hardware_destructive_interference_size) long long b{};\n};\n\
    ~~~\n```"
