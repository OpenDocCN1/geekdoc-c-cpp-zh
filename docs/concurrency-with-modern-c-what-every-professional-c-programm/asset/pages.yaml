  md: '# **All operations of `std::atomic_flag` `atomic_flag`**


    | Member functions | Description |

    | --- | --- |

    | `atomic_flag.clear()` | Clears the atomic flag. |

    | `atomic_flag.test_and_set()` | Sets the atomic flag and returns the old value.
    |

    | `atomic_flag.test()` (C++20) | Returns the value of the flag. |

    | `atomic_flag.notify_one()` (C++20) | Notifies one thread waiting on the atomic
    flag. |

    | `atomic_flag.notify_all()` (C++20) | Notifies all threads waiting on the atomic
    flag. |

    | `atomic_flag.wait(bool)` (C++20) | Blocks the thread until notified and the
    atomic value changes. |


    The call `atomic_flag.test()` returns the `atomic_flag` value without changing
    it. Further on, you can use `std::atomic_flag` for thread-synchronization: `atomic_flag.wait()`,
    `atomic_flag.notify_one()`, and `atomic_flag.notify_all()`. The member functions
    `notify_one` or `notify_all` notify one or all of the waiting atomic flags. `atomic_flag.wait(bool)`
    needs a boolean `bool`. The call `atomic_flag.wait(bool)` blocks until the next
    notification or spurious wakeup. It checks then if the value of `atomic_flag`
    is equal to `bool` and unblocks if not. The value `bool` serves as a predicate
    to protect against spurious wakeups. Additionally to C++11, default-construction
    in C++20 set a `std::atomic_flag` in its false state.


    ![](img/d61a6c83410484053b8892275d2fcc4f_45_0.png)


    # ## Initialization of a `std::atomic_flag` in C++11


    The `std::atomic_flag` flag has to be initialized in C++11 with the statement
    `std::atomic_flag flag = ATOMIC_FLAG_INIT`. Other initialization contexts such
    as `std::atomic_flag flag(ATOMIC_FLAG_INIT)` are unspecified.


    `std::atomic_flag` has two outstanding properties.


    `std::atomic_flag` is


    +   - the only lock-free atomic. A non-blocking algorithm is lock-free if there
    is guaranteed system-wide progress.

    +   - the building block for higher-level thread abstractions.


    The only lock-free atomic? The remaining more powerful atomics can provide their
    functionality by using a mutex internally according to the C++ standard. These
    remaining atomics have a member functions called `is_lock_free` to check if the
    atomic uses a mutex internally. On the popular microprocessor architectures, I
    always get the answer `true`. You should be aware of this and check it on your
    target system if you want to program lock-free.


    ![](img/d61a6c83410484053b8892275d2fcc4f_45_1.png)


    **address_free** Atomic operations that are lock-free should also be address-free.
    Address-free means that atomic operations from different processes on the same
    memory location are atomic.'
