    The constructed sequence of operations is fatal. With the call (2), the SENTINEL
    is removed, and, therefore, the invariant is broken. The call (3) has undefined
    behavior because the pop call on the std::stack triggers a pop_back call on the
    internal container. Calling pop_back on an empty container is undefined behavior.


    Changing the interface of a concurrent data structure is often a viable way to
    overcome concurrency issues. In this case, I change the interface''s granularity
    and combine the member functions top and pop into one member function topAndPop.
    Of course, this combination of member functions top and pop violates the Single
    responsibility principle*.


