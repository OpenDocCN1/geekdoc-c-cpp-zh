  md: "# ##### The Awaitable std::suspend_always\n\n```\n```cpp\nstruct suspend_always\
    \ {\n  constexpr bool await_ready() const noexcept { return false; }\n  constexpr\
    \ void await_suspend(std::coroutine_handle<>) const noexcept {}\n  constexpr void\
    \ await_resume() const noexcept {}\n};\n```\n```\n\nThe opposite holds for `suspend_never`.\
    \ It never suspends and, hence, the call `await_ready` returns true.\n\n# #####\
    \ The Awaitable std::suspend_never\n\n```\n```cpp\nstruct suspend_never {\n  constexpr\
    \ bool await_ready() const noexcept { return true; }\n  constexpr void await_suspend(std::coroutine_handle<>)\
    \ const noexcept {}\n  constexpr void await_resume() const noexcept {}\n};\n```\n\
    ```\n\nThe awaitables `std::suspend_always` and `std::suspend_never` are the basic\
    \ building blocks for functions, such as `initial_suspend` and `final_suspend`.\
    \ Both functions are automatically executed when the coroutine is executed: `initial_suspend`\
    \ at the beginning and `final_suspend` at the end of the coroutine.\n\n# ####\
    \ 5.4.4 initial_suspend\n\nWhen the member function `initial_suspend` returns\
    \ `std::suspend_always`, the coroutine suspends at its beginning. When returning\
