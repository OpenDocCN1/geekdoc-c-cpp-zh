- pgno: 348
  md: "What is the double-checked locking pattern? The first idea to implement a thread-safe\
    \ singleton is to protect the initialization of the singleton with a lock.\n\n\
    # ### Thread-safe initialization with a lock\n\n```\n```cpp\nstd::mutex myMutex;\n\
    \nclass MySingleton{\npublic:\n  static MySingleton& getInstance(){\n    std::lock_guard<std::mutex>\
    \ myLock(myMutex);\n    if (!instance) instance = new MySingleton();\n    return\
    \ *instance;\n  }\nprivate:\n  MySingleton() = default;\n  ~MySingleton() = default;\n\
    \  MySingleton(const MySingleton&) = delete;\n  MySingleton& operator=(const MySingleton&)\
    \ = delete;\n  static MySingleton* instance;\n};\n\nMySingleton* MySingleton::instance\
    \ = nullptr;\n```\n```\n\nAny issues? Yes and no. Yes because there is a considerable\
    \ performance penalty. No because the implementation is thread-safe. A heavyweight\
    \ lock protects each access to the singleton in line 7. This also applies to the\
    \ read access, which after the initial construction of MySingleton is not necessary.\
    \ Here comes the double-checked locking pattern to our rescue. Let's have a look\
    \ at the getInstance function.\n\n# ### The double-checked locking pattern\n\n\
    ```\n```cpp\nstatic MySingleton& getInstance() {\n  if (!instance) {         \
    \   // check\n    lock_guard<mutex> myLock(myMutex);   // lock\n    if (!instance)\
    \ instance = new MySingleton(); // check\n  }\n  return *instance;\n}\n```\n```\n\
    \nInstead of the heavyweight lock, I use a lightweight pointer comparison in line\
    \ 2. If I get a null pointer, I apply the heavyweight lock on the singleton (line\
    \ 3). Because there is the possibility that another thread initializes the singleton\
    \ between the pointer comparison in line 2 and the lock call in line 3, I have\
    \ to perform an additional pointer comparison in line 4. So the name is obvious;\
    \ two times a check and one time a lock."
