    # ### 2.4.3.2.3 The Solution


    *synchronizes-with* means: if `dataProduced.store(true, std::memory_order_release)`
    happens before `dataProduced.load(std::memory_order_acquire)`, then all visible
    effects of the operations before `dataProduced.store(true, std::memory_order_release)`
    are visible after `dataProduced.load(std::memory_order_acquire)`. The key is the
    word *if*. That *if* is guaranteed in the first program with the predicate (`while(!dataProduced.load(std::memory_order_acquire))`).


    Here it comes once again, but more formally.


    All operations before `dataProduced.store(true, std::memory_order_release)` *happens-before*
    all operations after `dataProduced.load(std::memory_order_acquire)`, if the following
    holds: `dataProduced.store(true, std::memory_order_release)` *happens-before*
    `dataProduced.load(std::memory_order_acquire)`.


    # ### 2.4.3.3 Release Sequence


    A release sequence is quite an advanced concept when dealing with acquire-release
    semantic. So let first start with the acquire-release semantic in the following
    example.'
