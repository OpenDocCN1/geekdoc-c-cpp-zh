    # 2.4.5 Relaxed Semantic\n\nThe relaxed semantic is the other end of the spectrum.\
    \ The relaxed semantic is the weakest of all memory models and only guarantees\
    \ the modification order of atomics. This means all modifications on an atomic\
    \ happen in some particular total order.\n\n# 2.4.5.1 No synchronization and ordering\
    \ constraints\n\nIt is relatively easy. If there are no rules, we cannot violate\
    \ them. However, that is too easy; the program should have well-defined behavior.\
    \ Well-defined behavior means that you typically use synchronization and ordering\
    \ constraints of stronger memory models to control operations with relaxed semantic.\
    \ How does this work? A thread can see the effects of another thread in arbitrary\
    \ order, so you have to make sure there are points in your program where all operations\
    \ on all threads get synchronized."
