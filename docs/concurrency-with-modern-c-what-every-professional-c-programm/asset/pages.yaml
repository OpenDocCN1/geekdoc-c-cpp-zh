- pgno: 567
  md: "```\n```cpp\nstd::mutex m;\nm.lock();\n// critical section\nm.unlock();\n```\n\
    ```\n\nSomething unexpected may happen in the critical section, or you forget\
    \ to unlock the mutex: the result is the same. If you don't unlock a mutex, another\
    \ thread requiring the mutex is blocked, and you end with a deadlock.\n\nThanks\
    \ to locks that automatically take care of the underlying mutex, your risk of\
    \ getting a deadlock is considerably reduced. According to the RAII idiom, a lock\
    \ automatically binds its mutex in the constructor and releases it in the destructor.\n\
    \n```\n```cpp\nstd::mutex m;\n...\n{\n    std::lock_guard<std::mutex> lockGuard(m);\n\
    \    // critical section\n} // unlock the mutex\n```\n```\n\nThe artificial scope\
    \ ({ ... }) ensures that the lock's lifetime automatically ends; therefore, the\
    \ underlying mutex is unlocked.\n\n# ### 11.2.2.5 Try to lock at most one mutex\
    \ at one point in time\n\nOf course, sometimes you need more than one mutex at\
    \ one point in time. In this case, you may become the victim of a race condition\
    \ which causes a deadlock such as in the following chapter; therefore, you should\
    \ try to avoid holding more than one mutex at one point in time if possible.\n\
    \n# ### 11.2.2.6 Give your locks a name\n\nIf you use a lock such as std::lock_guard\
    \ without a name, it will be immediately destroyed.\n\n```\n```cpp\nstd::mutex\
    \ m;\n...\n{\n    std::lock_guard<std::mutex>{m};\n    // critical section\n}\n\
    ```\n```\n\nIn this innocent-looking code snippet, the std::lock_guard is immediately\
    \ destroyed. Therefore, the following critical section is executed without synchronization.\
    \ The locks from the C++ standard follow all the same pattern. They lock its mutex\
    \ and its constructor and unlock it in its destructor. This pattern is called\
    \ RAII.\n\nThe following example shows the surprising behavior:"
