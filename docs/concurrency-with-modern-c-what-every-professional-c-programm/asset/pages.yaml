    The thread-safe interface pattern sounds promising but also has an obvious drawback.
    The data structure implementing the thread-safe interface is a bottleneck because
    only one thread can use the data structure at one point in time. This characteristic
    means if you have many threads working concurrently on the data structure, you
    should look for more fine-grained locking. For example, instead of protecting
    the entire interface to a singly-linked list with one lock, you can use a lock
    on individual nodes of the singly-linked list.


    Of course, the data structure can also be lock-free. I discuss the special challenges
    of lock-free data structures in the same chapter.


