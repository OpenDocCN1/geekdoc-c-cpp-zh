  md: "# ### 7.2.1.3 Creating new Futures\n\nC++20 gets four new functions for creating\
    \ special futures. These functions are std::make_ready_future, std::make_exceptional_future,\
    \ std::when_all, and std::when_any. First, let's look at the functions std::make_ready_future,\
    \ and std::make_exceptional_future.\n\n# #### 7.2.1.3.1 std::make_ready_future\
    \ and std::make_exceptional_future\n\nBoth functions create an immediately ready\
    \ future. In the first case, the future has a value; in the second case an exception.\
    \ What seems to be strange at first actually makes much sense. In C++11 the creation\
    \ of a ready future requires a promise. This is necessary even if the shared state\
    \ is immediately available.\n\nCreating a future with make_ready_future\n\n```\n\
    \    future<int> compute(int x) {\n      if (x < 0) return make_ready_future<int>(-1);\n\
    \      if (x == 0) return make_ready_future<int>(0);\n      future<int> f1 = async([]()\
    \ { return do_work(x); });\n      return f1;\n    }\n```\n\nHence the result must\
    \ only be calculated by a promise if (x > 0) holds.\n\nA short remark: both functions\
    \ are the pendant to the return function in a monad. Now let’s begin with future\
    \ composition.\n\n# #### 7.2.1.3.2 std::when_any and std::when_all\n\nBoth functions\
    \ have a lot in common.\n\nFirst, let’s look at the input.\n\nwhen_any and when_all\n\
    \n```\n    template < class InputIt >\n    auto when_any(InputIt first, InputIt\
    \ last)\n      -> future<when_any_result<\n           std::vector<typename std::iterator_traits<InputIt>::value_type>>;\n\
    \n    template < class... Futures >\n    auto when_any(Futures&&... futures)\n\
    \      -> future<when_any_result<std::tuple<std::decay_t<Futures>...>>>;\n\n \
    \   template < class InputIt >\n    auto when_all(InputIt first, InputIt last)\n\
    \      -> future<std::vector<typename std::iterator_traits<InputIt>::value_type>>;\n\
    ```"
