    model goes - as always - a few steps further. The programmer has to obey a few
    rules in dealing with shared variables to get a well-defined program. The program
    is undefined if there exists at least one data race. As I already mentioned, you
    have to be aware of data races if your threads share mutable data. Tasks are a
    lot easier to use than threads or condition variables.


    With atomics, we enter the domain of the experts. This becomes more evident the
