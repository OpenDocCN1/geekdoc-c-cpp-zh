  md: "First, protect the critical sections by a lock such as a scoped lock or strategized\
    \ locking. In object-oriented design, the critical section is typically an object\
    \ including its interface. The Thread-Safe Interface protects the entire object.\
    \ If the variable is never modified, synchronization is not needed by using an\
    \ expensive lock or an atomic. In this case, you only have to ensure that the\
    \ variable is initialized in a thread-safe way. I already discussed a few possibilities\
    \ in the previous section thread-safe initialization and the case studies about\
    \ thread-safe initialization of a singleton, including the infamous double-checked\
    \ locking pattern.\n\nSecond, the modifying thread just signals when it is done\
    \ with its work. This is the strategy of guarded suspension.\n\n# ### 9.2.1 Scoped\
    \ Locking\n\nScoped locking is the idea of RAII applied to a mutex. Scoped locking\
    \ is also known as synchronized block and guard. The key idea of this idiom is\
    \ to bind the resource acquisition and release to an object's lifetime. As the\
    \ name suggests, the lifetime of the object is scoped. Scoped means that the C++\
    \ run time is responsible for object destruction and, therefore, for releasing\
    \ the resource.\n\nThe class `ScopedLock` implements scoped locking.\n\n**Scoped\
    \ Locking**\n\n```\n```cpp\n// scoped_lock.cpp\n\n#include <iostream>\n#include\
    \ <mutex>\n#include <new>\n#include <string>\n\nclass ScopedLock{\nprivate:\n\
    \    std::mutex& mut;\npublic:\n    explicit ScopedLock(std::mutex& m): mut(m){\n\
    \        mut.lock();\n        std::cout << \"Lock the mutex: \" << &mut << '\\\
    n';\n    }\n    ~ScopedLock(){\n        std::cout << \"Release the mutex: \" <<\
    \ &mut << '\\n';\n        mut.unlock();\n    }\n};\n\nint main(){\n\n    std::cout\
    \ << '\\n';\n```\n```"
