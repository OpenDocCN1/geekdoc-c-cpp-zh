    # ### 11.2.1.3 Be extremely careful if you detach a thread


    The following code snippet requires our full attention.


    ```

    ```cpp

    std::string s{"C++11"}


    std::thread t{[&s]{ std::cout << s << ''\n''; }};

    t.detach();

    ```

    ```


    Because thread t is detached from the lifetime of its creator, two race conditions
    can cause undefined behavior.


    +   1. Thread t may outlive the lifetime of its creator. The consequence is that
    t refers to a non-existing std::string.

    +   2. The program shuts down before thread t can do its work because the lifetime
    of the output stream std::cout is bound to the main thread''s lifetime.


    # ### 11.2.1.4 Consider using an automatic joining thread


    A thread t with a callable unit is called joinable if neither a t.join() nor a
    t.detach() call happened. The destructor of a joinable thread throws the std::terminate
    exception. To not forget the t.join(), you can create your wrapper around std::thread.
    This wrapper checks in the constructor if the given thread is still joinable and
    joins the destructor''s given thread.


    You don''t have to build this wrapper on your own. Use the std::jthread, scoped_thread
    from Anthony Williams, or the gsl::joining_thread from the guideline support library¹.


    ¹https://github.com/Microsoft/GSL'
