  md: '# ## 2.3 Atomics


    Atomics are the base of the C++ memory model. By default, the strong version of
    the memory model is applied to the atomics; therefore, it makes much sense to
    understand the features of the strong memory model.


    # ### 2.3.1 Strong versus Weak Memory Model


    As you may already know from the subsection on Contract: The Challenges, with
    the strong memory model I refer to sequential consistency, and with the weak memory
    model I refer to relaxed semantic.


    # #### 2.3.1.1 Strong Memory Model


    Java 5.0 got its current memory model in 2004, C++ in 2011. Before that, Java
    had an erroneous memory model, and C++ had no memory model. Those who think this
    is the endpoint of a long process are entirely wrong. The foundations of multithreaded
    programming are 40 to 50 years old. Leslie Lamport¹ defined the concept of sequential
    consistency in 1979.


    Sequential consistency provides two guarantees:


    +   - The instructions of a program are executed in the order written down.

    +   - There is a global order of all operations on all threads.


    Before I dive deeper into these two guarantees, I want to explicitly emphasize
    that these two guarantees only hold for atomics but influence non-atomics.


    This graphic shows two threads. Each thread stores its variable x or y respectively,
    loads the other variable y or x, and stores them in the variable res1 or res2.


    ![](img/d61a6c83410484053b8892275d2fcc4f_42_0.png)


    Because the variables are atomic, the operations are executed atomically. By default,
    sequential consistency applies. The question is: in which order can the statements
    be executed?


    The first guarantee of sequential consistency is that the instructions are executed
    in the order defined in the source code. This is easy. No store operation can
    overtake a load operation.


    > > ¹ https://en.wikipedia.org/wiki/Leslie_Lamport'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'The second guarantee of the sequential consistency is that all threads’ instructions
    have to follow a global order. In the case listed above, it means that thread
    2 sees the operations of thread 1 in the same order in which thread 1 executes
    them. This is the critical observation. Thread 2 sees all operations of thread
    1 in the source code order of thread 1. The same holds from the perspective of
    thread 1. You can think about characteristic two as a global clock that all threads
    have to obey. The global clock is the global order. Each time the clock makes
    a tick, one atomic operation takes place, but you never know which one.


    We are not yet done with our riddle. We still need to look at the different interleaving
    executions of the two threads. So the following six interleavings of the two threads
    are possible.


    ![](img/d61a6c83410484053b8892275d2fcc4f_43_0.png)


    The six interleavings of the two threads


    That was easy, right? That was sequential consistency, also known as the strong
    memory model.


    # ### 2.3.1.2 Weak Memory Model


    Let refer once more to the contract between the programmer and the system.


    The programmer uses atomics in this particular example. He obeys his part of the
    contract. The system guarantees *well-defined* program behavior without data races.
    In addition to that, the system can execute the four operations in each combination.
    If the programmer uses the relaxed semantic, the pillars of the contract dramatically
    change. On the one hand, it is a lot more difficult for the programmer to understand
    possible interleavings of the two threads. On the other hand, the system has a
    lot more optimization possibilities.'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'With the relaxed semantic - also called weak memory model - there are many
    more combinations of the four operations possible. The *counter-intuitive* behavior
    is that thread 1 can see the operations of thread 2 in a different order, so there
    is no view of a global clock. From the perspective of thread 1, it is possible
    that the operation `res2 = x.load()` overtakes `y.store(1)`. It is even possible
    that thread 1 or thread 2 do not perform their operations in the order defined
    in the source code. For example, thread 2 can first execute `res2 = x.load()`
    and then `y.store(1)`.


    Between the sequential consistency and the relaxed-semantic are a few more models.
    The most important one is the acquire-release semantic. With the acquire-release
    semantic, the programmer has to obey weaker rules than with sequential consistency.
    In contrast, the system has more optimization possibilities. The acquire-release
    semantic is the key to a deeper understanding of synchronization and partial ordering
    in multithreading programming. The threads are synchronized at specific synchronization
    points in the code. Without these synchronization points, there is no *well-defined*
    behavior of threads, tasks, or condition variables possible.


    In the last section, I introduced sequential consistency as the default behavior
    of atomic operations. What does that mean? You can specify the memory order for
    each atomic operation. If no memory order is specified, sequential consistency
    is applied, meaning that the flag `std::memory_order_seq_cst` is implicitly applied
    to each operation on an atomic.


    This piece of code


    ```

    x.store(1);

    res = x.load();

    ```


    is equivalent to the following piece of code:


    ```

    x.store(1, std::memory_order_seq_cst);

    res = x.load(std::memory_order_seq_cst);

    ```


    For simplicity, I use the first form in this book. Now it’s time to take a deeper
    look into the atomics of the C++ memory model. We start with the elementary `std::atomic_flag`.


    # 2.3.2 The Atomic Flag


    `std::atomic_flag` is an atomic boolean. It has a clear and a set state. For simplicity
    reasons, I call the clear state false and the set state true. Its clear member
    functions enables you to set its value to false. With the `test_and_set` member
    functions, you can set the value back to true and return the previous value. There
    is no member functions to ask for the current value. This will change with C++20.
    With C++20, a `std::atomic_flag` has a test member functions and can be used for
    thread synchronization via the member functions `notify_one`, `notify_all`, and
    `wait`.'
