    # ## 15.5 Deadlocks


    A deadlock is a state in which at least one thread is blocked forever because
    it waits for the release of a resource, it does never get.


    There are two main reasons for deadlocks:


    +   1. A mutex has not been unlocked.

    +   2. You lock your mutexes in a different order.


    For overcoming the second issue, techniques such as lock hierarchies³ are used
    in classical C++.


    For the details about deadlocks and how to overcome them with modern C++, read
    the subsection issues of mutexes and locks.


    ³http://collaboration.cmc.ec.gc.ca/science/rpn/biblio/ddj/Website/articles/DDJ/2008/0801/071201hs01/071201hs01.html'
