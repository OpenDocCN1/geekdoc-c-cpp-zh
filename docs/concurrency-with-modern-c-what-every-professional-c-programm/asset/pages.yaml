- pgno: 21
  md: '# # 1. Concurrency with Modern C++


    With the publishing of the C++11 standard, C++ got a multithreading library and
    a memory model. This library has basic building blocks like atomic variables,
    threads, locks, and condition variables. That''s the foundation on which future
    C++ standards such as C++20 and C++23 can establish higher abstractions. However,
    C++11 already knows tasks, which provide a higher abstraction than the cited basic
    building blocks.


    ![](img/d61a6c83410484053b8892275d2fcc4f_21_0.png)


    # ## Concurrency in C++


    Roughly speaking, you can divide the concurrency story of C++ into three evolution
    steps.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# ## 1.1 C++11 and C++14: The Foundation


    C++11 introduced multithreading. The multithreading support consists of a *well-defined*
    memory model and a standardized threading interface. C++14 added reader-writer
    locks to the multithreading facilities of C++.


    # ### 1.1.1 Memory Model


    ![](img/d61a6c83410484053b8892275d2fcc4f_22_0.png)


    Memory Model in C++


    The foundation of multithreading is a *well-defined* memory model. This memory
    model has to deal with the following aspects:


    +   - Atomic operations: operations that are performed without interruption.

    +   - Partial ordering of operations: a sequence of operations that must not be
    reordered.

    +   - Visible effects of operations: guarantees when operations on shared variables
    are visible in other threads.


    The C++ memory model is inspired by its predecessor: the Java memory model. Unlike
    the Java memory model, however, C++ allows us to break the constraints of sequential
    consistency, which is the default behavior of atomic operations.


    Sequential consistency provides two guarantees.


    +   1. The instructions of a program are executed in source code order.

    +   2. There is a global order for all operations on all threads.


    The memory model is based on atomic operations on atomic data types (short atomics).'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# #### 1.1.1.1 Atomics


    C++ has a set of simple atomic data types. These are booleans, characters, numbers,
    and pointers in many variants. You can define your atomic data type with the class
    template `std::atomic`. Atomics establishes synchronization and ordering constraints
    that can also hold for non-atomic types.


    The standardized threading interface is the core of concurrency in C++.


    # ### 1.1.2 Multithreading


    ![](img/d61a6c83410484053b8892275d2fcc4f_23_0.png)


    Multithreading in C++ consists of threads, synchronization primitives for shared
    data, thread-local data, and tasks.


    # #### 1.1.2.1 Threads


    C++ supports two kind of threads: the basic thread `std::thread` (C++11) and the
    improved thread `std::jthread` (C++20).


    # ##### 1.1.2.1.1 std::thread


    A `std::thread` represents an independent unit of program execution. The executable
    unit, which is started immediately, receives its work package as a callable unit.
    A callable unit can be a named function, a function object, or a lambda function.


    The creator of a thread is responsible for its lifecycle. The executable unit
    of the new thread ends with the end of the callable. Either the creator waits
    until the created thread is done (`t.join()`) or the creator detaches itself from
    the created thread: `t.detach()`. A thread `t` is joinable if no operation `t.join()`
    or `t.detach()` was performed on it. A joinable thread calls `std::terminate`
    in its destructor, and the program terminates.'
