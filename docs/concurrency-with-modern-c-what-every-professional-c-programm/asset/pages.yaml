  md: "# ## 7.1 Executors\n\nExecutors are the basic building block for execution\
    \ in C++ and fulfill a similar role for execution, such as allocators for the\
    \ containers in C++. Functions such as `async`, the parallel algorithms of the\
    \ Standard Template Library, the `then` continuation of futures, the `run` member\
    \ functions of task blocks, or the `post`, `dispatch`, or `defer` calls of the\
    \ Networking TS use them. Also, execution is a fundamental concern of programming.\
    \ There is no standardized way to perform an execution.\n\nHere is the introductory\
    \ example of the proposal P0761².\n\n**Various `parallel_for` implementations**\n\
    \n```\n```cpp\nvoid parallel_for(int facility, int n, function<void(int)> f) {\n\
    \  if(facility == OPENMP) {\n    #pragma omp parallel for\n    for(int i = 0;\
    \ i < n; ++i) {\n      f(i);\n    }\n  }\n  else if(facility == GPU) {\n    parallel_for_gpu_kernel<<<n>>>(f);\n\
    \  }\n  else if(facility == THREAD_POOL) {\n    global_thread_pool_variable.submit(n,\
    \ f);\n  }\n}\n```\n```\n\nThis `parallel_for` function has a few issues.\n\n\
    +   - A simple function such as `parallel_for` is **complex** to maintain. The\
    \ complexity gets worse and worse if new algorithms or new parallel paradigms\
    \ should be supported.\n+   - Each branch of the function has different **synchronization**\
    \ properties. OpenMP¹ may block until all spawning threads are done, GPU runs\
    \ typically asynchronously, and a thread pool may block or not. Insufficient synchronization\
    \ may end in a data race or deadlock. In the best case, you get a race condition.\n\
    +   - The `parallel_for` loop is too **restrictive**. For example, there is no\
    \ way to use your thread pool instead of the global thread pool in the function:\
    \ `global_thread_pool_variable.submit(n, f);`.\n\n¹ https://en.cppreference.com/w/cpp/experimental\n\
    ² https://www.open-std.org/jtc1/sc22/wg21/docs/papers/2018/p0761r2.pdf\n³ https://en.wikipedia.org/wiki/OpenMP"
