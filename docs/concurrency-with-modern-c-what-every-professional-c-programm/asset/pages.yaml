  md: '# ## 14.2.1 A Simplified Implementation


    Following my strategy in the previous chapter about a lock-based concurrent stack,
    I implement in this chapter a lock-free concurrent stack. Beside the many similarities
    of the lock-based and lock-free implementation of the concurrent stack, there
    is one big difference: The lock-free concurrent stack is based on a singly-linked
    list and not on a STL container such as the lock-based concurrent stack.


    In my simplified implementation, I start with the `push` member function. Let
    me first visualize, how a new node is added to a singly-linked list. `head` is
    the pointer to the first node in the singly-linked list.


    ![](img/d61a6c83410484053b8892275d2fcc4f_630_0.png)


    ![](img/d61a6c83410484053b8892275d2fcc4f_630_1.png)


    ![](img/d61a6c83410484053b8892275d2fcc4f_630_2.png)


    Each node in the singly-linked list has two attributes. Its value `T` and the
    `next`. `next` points to the next element in the singly-linked list. Only the
    last node points to the `nullptr`. Adding a new node to the data is straightforward.
    Create a new node and let `next` pointer point to the previous head. So far, the
    new node is not accessible. Finally, the new node becomes the new head, and the
    `push` operation is completed.


    The following code snippets show the lock-free implementation of a concurrent
    stack.'
