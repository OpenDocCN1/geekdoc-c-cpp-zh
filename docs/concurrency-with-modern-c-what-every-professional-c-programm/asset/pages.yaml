    # ### 9.2.2.2 Implementation


    Strategized locking often applies scoped locking. There are two typical ways to
    implement strategized locking: run-time polymorphism (object-orientation) or compile-time
    polymorphism (templates). Both ways improve the customization and extension of
    the locking strategy, ease the maintenance of the system, and support the reuse
    of components. Also, implementing the strategized locking at run-time or compile-time
    polymorphism differ in various aspects


    +   * Advantages:

    +     * Run-time Polymorphism

    +       * allows it to configure the locking strategy during run time.

    +       * is easier to understand for developers who have an object-oriented background.

    +     * Compile-Time Polymorphism

    +       * has no abstraction penalty.

    +       * has a flat hierarchy.

    +   * Disadvantages:

    +     * Run-time Polymorphism

    +       * needs an additional pointer indirection.

    +       * may have a deep derivation hierarchy.

    +     * Compile-Time Polymorphism

    +       * may generate a very lengthy message in the error case, but the use of
    concepts such as basic_lockable in C++20 causes concise error messages.


    After this theoretical discussion, I implement the strategized locking in both
    variations. The strategized locking supports, in my example, no-locking, exclusive
    locking, and shared locking. For simplicity reasons, I used internally already
    existing mutexes. Additionally, the strategized locking models scoped locking.


    # #### 9.2.2.2.1 Runtime Polymorphism


    The program strategizedLockingRuntime.cpp presents three different mutexes.'
