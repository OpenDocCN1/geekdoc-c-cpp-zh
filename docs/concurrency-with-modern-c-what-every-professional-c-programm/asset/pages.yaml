  md: "# The Original Dining Philosophers Problem using Semaphores\n\n```\n```cpp\n\
    // semaphore.h\n#include <mutex>\n#include <condition_variable>\n#include <limits>\n\
    \nnamespace std {\n    template <std::ptrdiff_t least_max_value\n        = std::numeric_limits<std::ptrdiff_t>::max()>\n\
    \    class counting_semaphore {\n    public:\n        counting_semaphore(std::ptrdiff_t\
    \ desired) : counter(desired) {}\n\n        counting_semaphore(const counting_semaphore&)\
    \ = delete;\n        counting_semaphore& operator=(const counting_semaphore&)\
    \ = delete;\n\n        inline void release(std::ptrdiff_t update = 1) {\n    \
    \        std::unique_lock<std::mutex> lock(mutex_);\n            counter += update;\n\
    \            cv.notify_one();\n        }\n\n        inline void acquire() {\n\
    \            std::unique_lock<std::mutex> lock(mutex_);\n            while (0\
