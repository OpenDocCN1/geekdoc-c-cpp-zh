  md: '![](img/d61a6c83410484053b8892275d2fcc4f_182_0.png)


    Use of callbacks


    The std::stop_callback constructor registers the callback function for the std::stop_token
    given by the associated std::stop_source. This callback function is either invoked
    in the thread invoking request_stop() or the thread constructing the std::stop_callback.
    If the request to stop happens prior to the registration of the std::stop_callback,
    the callback is invoked in the thread constructing the std::stop_callback. Otherwise,
    the callback is invoked in the thread invoking request_stop().


    You can register more than one callback for one or more threads using the same
    std::stop_token. The C++ standard provides no guarantee in which order they are
    executed.


    # Stop request arrives before the callback registration


    ```

    1   // invokeCallbacks.cpp

    2

    3   #include <chrono>

    4   #include <iostream>

    5   #include <thread>

