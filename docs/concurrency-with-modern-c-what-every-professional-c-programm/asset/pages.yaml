    \n    Generator(handle_type h): coro(h) {}\n    handle_type coro;\n\n    ~Generator()\
    \ {\n        if ( coro ) coro.destroy();\n    }\n    T getValue() {\n        return\
    \ coro.promise().current_value;\n    }\n    bool next() {\n        coro.resume();\n\
    \        return not coro.done();\n    }\n    ...\n};\n```\n```\n\nThe constructor\
    \ (line 7) gets the coroutine handle to the promise that has type `std::coroutine_handle<promise_type>`.\
    \ The member functions `next` (line 16) and `getValue` (line 13) allow a client\
    \ to resume the promise (`gen.next()`) or ask for its value (`gen.getValue()`)\
    \ using the coroutine handle.\n\n# # Invoking a coroutine\n\n```\n```cpp\nGenerator<int>\
    \ coroutineFactory(); // Function that returns a coroutine object\n\nauto gen\
    \ = coroutineFactory();\ngen.next();\nauto result = gen.getValue();\n```\n```\n\
    \nInternally, both functions trigger the coroutine handle `coro` (line 8) to\n\
    \n+   - resume the coroutine: `coro.resume()` (line 17) or `coro()`;\n+   - destroy\
    \ the coroutine: `coro.destroy()` (line 11);\n+   - check the state of the coroutine:\
