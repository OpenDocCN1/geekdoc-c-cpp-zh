    # ### 2.3.5 Free Atomic Functions


    The functionality of the flag std::atomic_flag and the class template std::atomic
    can also be used with free functions. Because these functions use pointers instead
    of references they are compatible with C. The atomic free functions are available
    for the std::atomic_flag and the types such as the types you can use with the
    class template std::atomic.


    The free functions for a std::atomic_flag are called: std::atomic_clear(), std::atomic_clear_explicit,
    std::atomic_flag_test_and_set(), and std::atomic_flag_test_set_explicit(). The
    first argument of all four variations is a pointer to a std::atomic_flag. Additionally,
    the two _explicit variations expect a memory-ordering.


    For each std::atomic type there is a corresponding free function available. The
    free functions follow a straightforward naming convention: add just the prefix
    atomic_ in front of it. For example, a member function calls at.store() on a std::atomic
    becomes std::atomic_store(), and std::atomic_store_explicit(). The first overload
    expects, in this case, a pointer and the second overload, additionally, a memory-ordering.


    For completeness, here are all overloads: atomic¹³.


    With one exception, free functions are only available on atomic types. The prominent
    exception to this rule is std::shared_ptr.


