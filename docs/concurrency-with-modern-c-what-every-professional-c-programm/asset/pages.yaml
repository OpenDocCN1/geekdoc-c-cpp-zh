  md: "# ## 11.2.2 Data Sharing\n\nWith data sharing of mutable data the challenges\
    \ in multithreading programming start.\n\n# ### 11.2.2.1 Pass data per default\
    \ by copy\n\n```\n````cpp\nstd::string s{\"C++11\"}\n\nstd::thread t1{[s]{ ...\
    \ }}; // do something with s\nt1.join();\n\nstd::thread t2{[&s]{ ... }}; // do\
    \ something with s\nt2.join();\n\n// do something with s\n````\n```\n\nIf you\
    \ pass data such as the std::string s to a thread t1 by copy, the creator thread\
    \ and the created thread t1 use independent data. This is in contrast to the thread\
    \ t2. It gets its std::string s by reference. This means you have to synchronize\
    \ the access to s in the creator thread and the created thread t2 preventively.\
    \ This is error-prone and expensive.\n\n# ### 11.2.2.2 Use std::shared_ptr to\
    \ share ownership between unrelated threads\n\nAssume you have an object which\
    \ you want to share between unrelated threads. The critical question is, who is\
    \ the object's owner and, therefore, responsible for releasing the memory? Now\
    \ you can choose between a memory leak if you don't deallocate the memory or undefined\
    \ behavior because you invoked delete more than once. Most of the time, the undefined\
    \ behavior ends in a runtime crash.\n\nThe following program shows this non-solvable\
