    Data races with references


    I made my example `copiedValueDataRace.cpp` an assumption that it is trivial for
    a boolean but not for a more complex type. Passing the argument by copy is data
    race free if the argument is a so-called value object.


    ![](img/d61a6c83410484053b8892275d2fcc4f_475_1.png)


    # Value Object


    A value object is an object whose equality is not based on identity but based
    on its state. Value objects should be immutable so that they stay equal for their
    lifetime if created equal. If you pass a value object by copy to a thread, there
    is no need to synchronize its access. Due to the article ValueObject<sup>2</sup>
    from Martin Fowler, you can think of two classes of objects: value objects and
    reference objects.


    # 9.1.1.1.1 When a reference is actually a copy


    You may think that the thread `t3` in the previous example `copiedValueDataRace.cpp`
    can just be replaced with `std::thread t3(byConstReference, shared)`. The program
    compiles and runs but what seems like a reference is a copy. The reason is that
    `std::decay` is applied to each argument of<sup>3</sup>.


    <sup>2</sup>https://martinfowler.com/bliki/ValueObject.html

    <sup>3</sup>https://en.cppreference.com/w/cpp/types/decay'
