  md: "+   - All implementation member functions (protected and private) must not\
    \ use a lock.\n+   - The interface member functions call only protected or private\
    \ member functions but no public member functions.\n\nThe thread-safe interface\
    \ pattern has two nice properties: all public member functions are thread-safe\
    \ per design and deadlock-free per design. The thread-safe interface is thread-safe\
    \ because each public member function uses a lock and the thread-safe interface\
    \ is deadlock-free because a public member function cannot invoke another public\
    \ member function of the class. I assume the following implementation makes my\
    \ point:\n\n# ### The Thread-Safe Interface\n\n```\n~~~cpp\n// threadSafeInterface.cpp\n\
    \n#include <iostream>\n#include <mutex>\n#include <thread>\n\nclass Critical{\n\
    \npublic:\n    void interface1() const {\n        std::lock_guard<std::mutex>\
    \ lockGuard(mut);\n        implementation1();\n    }\n    void interface2(){\n\
    \        std::lock_guard<std::mutex> lockGuard(mut);\n        implementation2();\n\
    \        implementation3();\n        implementation1();\n    }\nprivate:\n   \
    \ void implementation1() const {\n        std::cout << \"implementation1: \"\n\
    \                  << std::this_thread::get_id() << '\\n';\n    }\n    void implementation2(){\n\
    \        std::cout << \"    implementation2: \"\n                  << std::this_thread::get_id()\
    \ << '\\n';\n    }\n    void implementation3(){\n        std::cout << \"     \
    \   implementation3: \"\n                  << std::this_thread::get_id() << '\\\
    n';\n    }\n\n\n~~~\n```"
