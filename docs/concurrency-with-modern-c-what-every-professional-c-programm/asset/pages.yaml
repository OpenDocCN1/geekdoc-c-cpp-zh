  md: "# A blocking server\n\n```\n```cpp\nAcceptor acceptor{443};\nwhile (true) {\n\
    \    Socket socket = acceptor.accept();          // blocking\n    auto request\
    \ = socket.read();               // blocking\n    auto response = handleRequest(request);\n\
    \    socket.write(response);                     // blocking\n}\n```\n```\n\n\
    The server is quite simple because it sequentially answers each request in the\
    \ same thread. The server listens on port 443 (line 1), accepts the connection\
    \ (line 3), reads the incoming data from the client (line 4), and writes its answer\
    \ to the client (line 6). The calls in lines 3, 4, and 6 are blocking.\n\nThanks\
