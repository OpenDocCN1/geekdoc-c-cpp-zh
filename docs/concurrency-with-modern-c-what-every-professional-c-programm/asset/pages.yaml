    # ## 15.9 Race Conditions


    A race condition is a situation in which an operation''s result depends on the
    interleaving of certain individual operations.


    Race conditions are challenging to spot. It depends on the interleaving of the
    threads whether they occur. That means the number of cores, the utilization of
    your system, or your executable optimization level may all be reasons why a race
    condition appears or does not.


    Race conditions are not bad per se. It is the nature of threads that they interleave
    in different ways, but this can often cause serious problems. In this case, I
    call them malign race conditions. Typical effects of malign race conditions are
    data races, breaking of **program invariants**, blocking issues of threads, or
    lifetime issues of variables.'
