    \ ++n) increment(); }]);\n    for(auto thr: vecSyn) thr.join();\n\n    std::cout\
    \ << \"\\n\\n\";\n}\n```\n```\n\nAlthough the variable `i` in line 7 is a global\
    \ variable and the synchronized block operations are transaction-unsafe, the program\
    \ is well-defined. Ten threads concurrently invoke the function `increment` (line\
    \ 21) ten times, incrementing the variable `i` in line 11. Access to `i` and `std::cout`\
    \ happens *in total order*. This is the characteristic of the synchronized block.\n\
