    \ that pauses immediately\n\n**A lazy coroutine**\n\n```\n```cpp\nstd::suspend_always\
    \ initial_suspend() {\n  return {};\n}\n```\n```\n\n+   - An eager coroutine that\
    \ runs immediately"
