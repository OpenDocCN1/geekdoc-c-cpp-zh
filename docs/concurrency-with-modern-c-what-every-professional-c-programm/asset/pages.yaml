  md: '# ### 6.4.1 CppMem: Non-Atomic Variables


    Using the run button shows it immediately there is a data race. To be more precise,
    it has two data races. Neither the access to the variable x nor the variable y
    is protected. As a result, the program has undefined behavior. In C++ jargon,
    this means that the program has so-called catch fire semantic; therefore, all
    results are possible. Your PC can even catch fire.


    So, we are not able to conclude the values of x and y.


    # ### Guarantees for int variables


    Most mainstream architectures guarantee that access to an int variable is atomic
    as long as the int variable is aligned naturally. Naturally aligned means that
    on a 32-bit or 64-bit architecture, the 32-bit int variable must have an address
    divisible by 4. There is a reason why I mention this so explicitly. With C++11,
    you can adjust the alignment of your data types.


    I have to emphasize that I''m not advising you to use an int like an atomic int.
    I only want to point out that the compiler guarantees more in this case than the
    C++11 standard. If you rely on the compiler guarantee, your program is not compliant
    with the C++ standard and, therefore, may break on other hardware platforms or
    in the future.


    These were my thoughts to int. Now we should have a look at what CppMem reports
    about the undefined behavior of the program.


    CppMem allows me to reduce the program to its bare minimum.


    ```

    CppMem: unsynchronized access


    1  int main() {

    2    int x = 0;

    3    int y = 0;

    4    {{{ {

    5      x = 2000;

    6      y = 11;

    7    }

    8    || {

    9      y;

    10     x;

    11   }

    12 }}}

    13 }

    ```


    You can define a thread in CppMem with the curly braces (lines 4 and 12) and the
    pipe symbol (line 8). The additional curly braces in lines 4 and 7 or lines 8
    and 11 define the work package of the thread. Because I''m not interested in the
    output of the variables x and y, I only read them in lines 9 and 10.


    That was the theory for CppMem, now to the practice.'
