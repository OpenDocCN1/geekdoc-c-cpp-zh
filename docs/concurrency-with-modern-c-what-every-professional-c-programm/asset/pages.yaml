  md: "of two threads with sequential consistency (std::memory_order_seq_cst) is replaced\
    \ by the more lightweight and performant acquire-release semantic (std::memory_order_acquire\
    \ and std::memory_order_release). The behavior is not affected.\n\nAlthough the\
    \ flag.test_and_set(std::memory_order_acquire) call is a read-modify-write operation,\
    \ the acquire semantic is sufficient. In summary, flag is an atomic and guarantees,\
    \ therefore, modification order. This means all modifications to flag occur in\
    \ some particular total order.\n\nThe acquire-release semantic is transitive.\
    \ That means if you have an acquire-release semantic between two threads (a, b)\
    \ and an acquire-release semantic between (b, c), you get an acquire-release semantic\
    \ between (a, c).\n\n# ### 2.4.3.1 Transitivity\n\nA release operation synchronizes\
    \ with an acquire operation on the same atomic variable and establishes ordering\
    \ constraint. These are the components to synchronize threads in a performant\
    \ way if they act on the same atomic. How can that work if two threads share no\
    \ atomic variable? We do not want any sequential consistency because that is too\
    \ expensive, but we want the light-weight acquire-release semantic.\n\nThe answer\
    \ to this question is straightforward. Applying the transitivity of the acquire-release\
    \ semantic, we can synchronize independent threads.\n\nIn the following example,\
    \ thread t2 with its work package deliveryBoy is the connection between two independent\
    \ threads t1 and t3.\n\nTransitivity of the acquire-release semantics\n\n```\n\
    ```cpp\n// transitivity.cpp\n\n#include <atomic>\n#include <iostream>\n#include\
    \ <thread>\n#include <vector>\n\nstd::vector<int> mySharedWork;\nstd::atomic<bool>\
    \ dataProduced(false);\nstd::atomic<bool> dataConsumed(false);\n\nvoid dataProducer(){\n\
    \    mySharedWork = {1,0,3};\n    dataProduced.store(true, std::memory_order_release);\n\
    }\n\nvoid deliveryBoy(){\n    while(!dataProduced.load(std::memory_order_acquire));\n\
    \    dataConsumed.store(true, std::memory_order_release);\n```\n```"
