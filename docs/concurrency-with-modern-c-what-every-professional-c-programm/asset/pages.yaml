    \n#include <iostream>\n#include <vector>\n#include <thread>\n\nint i= 0;\n\nvoid\
    \ increment(){\n    synchronized{\n        std::cout << ++i << \", \";\n    }\n\
    }\n\nint main(){\n\n    std::cout << '\\n';\n\n    std::vector<std::thread> vecSyn(10);\n\
