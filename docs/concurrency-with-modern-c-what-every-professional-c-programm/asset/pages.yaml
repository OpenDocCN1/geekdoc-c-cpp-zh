  md: '# 14.2.2.3 Hazard Pointers


    The term hazard pointers goes back to Maged Michael. He described them in his
    paper “Hazard Pointers: Safe Memory Reclamation for Lock-Free Objects”. Hazard
    pointers solve the classical problem of lock-free data structures such as a lock-free
    stack: When can a thread safely delete a node of a data structure while other
    threads may use this node concurrently?


    Although a hazard pointer provides a general solution for the common problem of
    safe memory reclamation in lock-free data structures, I want to present it from
    the perspective of our lock-free stack.


    ![](img/d61a6c83410484053b8892275d2fcc4f_644_0.png)


    Hazard pointers


    A hazard pointer is a single-writer multi-reader pointer. All hazard pointers
    build a linked list and are initialized with a null pointer. When a thread uses
    a stack node, it puts the node’s address into a hazard pointer, indicating that
    it uses this node and is also the exclusive owner of the used hazard pointer.
    When the thread is done using the node, it sets its pointer of the hazard pointer
    back to a null pointer and, therefore, releases its ownership. A thread keeps
    a list of hazard pointers standing for the nodes the thread is using and can not
    delete them. When a thread wants to delete a node, it traverses the list of all
    hazard pointers and checks if the node is used. If the node is not in use, it
    deletes it. If the node is in use, it puts it eventually on a retire list of the
    deleted nodes. Eventually, because the node is only added to the retire list if
    it is not yet on the list.


    This means in the case of our lock-free stack. The member function topAndPop has
    two jobs regarding memory reclamation. First, it manages to be delete[d] node,
    and second, it traverses the retire list.


