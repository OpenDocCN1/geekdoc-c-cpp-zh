  md: '# 2.5.1.2.4 All Fences at a Glance


    ![](img/d61a6c83410484053b8892275d2fcc4f_111_0.png)


    Acquire and release fences guarantee similar synchronization and ordering constraints
    as atomics with acquire-release semantic.


    # 2.5.1.3 Acquire-Release Fences


    The most apparent difference between acquire and release fences and atomics with
    acquire-release semantics is that fences need no atomics. There is also a more
    subtle difference; the acquire and release fences are more heavyweight than the
    corresponding atomics.


    # 2.5.1.3.1 Atomic Operations versus Fences


    For the sake of simplicity, I now refer to acquire operations when I use fences
    or atomic operations with acquire semantics. The same holds for release operations.


    The main idea of an acquire, and a release operation is that it establishes synchronization
    and ordering constraints between threads. These synchronization and ordering constraints
    also hold for atomic operations with relaxed semantic or non-atomic operations.
    Note that acquire and release operations come in pairs. Besides, operations on
    atomic variables with acquire-release semantic must act on the same atomic variable.
    Having said that, I now look at these operations in isolation.


    Let’s start with the acquire operation.


    # 2.5.1.3.2 Acquire Operation


    A load (read) operation on an atomic variable with the memory-ordering set to
    std::memory_order_acquire is an acquire operation.'
