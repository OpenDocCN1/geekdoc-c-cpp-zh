  md: 'The program `pingPongSemaphore.cpp` uses two semaphores: `signal2Ping` and
    `signal2Pong` (lines 7 and 8). Both can have the two values 0 and 1 and are initialized
    with 0. This means when the value is 0 for the semaphore `signal2Ping`: a call
    `signal2Ping.release()` (lines 24 and 32) set the value to 1 and is, therefore,
    a notification; a `signal2Ping.acquire()` (line 15) call blocks until the value
    becomes 1. The same argumentation holds for the second semaphore.


    ![](img/d61a6c83410484053b8892275d2fcc4f_397_0.png)


    Multiple time synchronization with semaphores


    On average, the execution time is 0.33 seconds.


    # 6.5.5 All Numbers


    As expected, condition variables are the slowest way, and atomic flag the fastest
    way to synchronize threads. The performance of a `std::atomic<bool>` is in between.
    There is a downside with `std::atomic<bool>`. `std::atomic_flag` is the only atomic
    data type that is always lock-free. Semaphores impressed me most because they
    are nearly as fast as atomic flags.


    |  | Condition Variables | Two Atomic Flags | One Atomic Flag | Atomic Boolean
    | Semaphores |

    |---|---:|---:|---:|---:|---:|

    | Execution Time | 0.52 | 0.32 | 0.31 | 0.38 | 0.33 |'
