  md: "# ## 3.4 Thread-Local Data\n\nThread-local data, also known as thread-local\
    \ storage, is created for each thread separately. It behaves like static data\
    \ because it’s bound to the thread’s lifetime and is created at its first usage.\
    \ This means that thread-local variables at namespace scope or as static class\
    \ members are created before its first use, and those thread-local variables declared\
    \ in a function are created with its first use. Thread-local data belongs exclusively\
    \ to the thread.\n\n# Thread-local data\n\n```\n```cpp\n// threadLocal.cpp\n\n\
    #include <iostream>\n#include <string>\n#include <mutex>\n#include <thread>\n\n\
    std::mutex coutMutex;\n\nthread_local std::string s(\"hello from \");\n\nvoid\
    \ addThreadLocal(std::string const& s2){\n\n    s += s2;\n    // protect std::cout\n\
    \    std::lock_guard<std::mutex> guard(coutMutex);\n    std::cout << s << '\\\
    n';\n    std::cout << \"s: \" << s << '\\n';\n    std::cout << '\\n';\n\n}\n\n\
    int main(){\n\n    std::cout << '\\n';\n\n    std::thread t1(addThreadLocal,\"\
    t1\");\n    std::thread t2(addThreadLocal,\"t2\");\n    std::thread t3(addThreadLocal,\"\
    t3\");\n    std::thread t4(addThreadLocal,\"t4\");\n\n    t1.join();\n    t2.join();\n\
    \    t3.join();\n    t4.join();\n}\n```\n```"
