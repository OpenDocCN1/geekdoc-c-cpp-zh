  md: '# 1.8.3 Transactional Memory


    Transactional memory is based on the ideas underlying transactions in database
    theory. A transaction is an action that provides the first three properties of
    ACID database transactions: Atomicity, Consistency, and Isolation. The durability
    that is characteristic for databases holds not for the proposed transactional
    memory in C++. The new standard has transactional memory in two flavors: synchronized
    blocks and atomic blocks. Both are executed in total order and behave as if a
    global lock protected them. In contrast to synchronized blocks, atomic blocks
    cannot execute transaction-unsafe code.


