    # 11.1.4 Prefer Immutable Data


    A data race is a situation in which at least two threads access a shared variable
    simultaneously. At least one thread tries to modify the variable. The definition
    makes it quite obvious. A necessary condition for a data race is a mutable, shared
    state. The graphic makes my point clear.


    **Mutable?**

    | Shared? | no | yes |

    | --- | --- | --- |

    | **no** | OK | OK |

    | **yes** | OK | Data Race |


    *Mutable and shared state*


    If you have immutable data, no data race can happen. You only have to guarantee
    that the immutable data are initialized in a thread-safe way. I presented in the
    chapter Thread-safe initialization four ways to guarantee this. Here are they:


    +   - early initialization before a thread is created

    +   - constant expressions

    +   - the function `std::call_once` in combination with the flag `std::once_flag`

    +   - a static variable with block scope


    There are two typical ways to create immutable data in C++: `const` and `constexpr`.
    While `const` is a runtime technique, `constexpr` guarantees that the value is
    initialized at compile time and, therefore, thread-safe. Even user-defined types
    can be initialized at compile time.


    # 11.1.4.1 A User-defined Type


    There are a few restrictions for user-defined types which instances should be
    created at compile time.


    The `constexpr` constructor


    +   - can only be invoked with a constant expression.

    +   - cannot use exception handling.'
