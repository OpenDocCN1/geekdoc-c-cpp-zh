    The total order of synchronized blocks also holds for atomic blocks.


    # ### 7.3.2.2 Atomic Blocks


    You can execute transaction-unsafe code in a synchronized block but not in an
    atomic block. Atomic blocks are available in three forms: `atomic_noexcept`, `atomic_commit`,
    and `atomic_cancel`. The three suffixes `_noexcept`, `_commit`, and `_cancel`
    define how an atomic block manages an exception:


    +   - `atomic_noexcept`: If an exception is thrown, `std::abort` is called, and
    the program aborts.

    +   - `atomic_cancel`: In the default case, `std::abort` is called. This does
    not hold if a transaction-safe exception is thrown that is responsible for ending
    the transaction. In this case, the transaction is canceled, put to its initial
    state, and the exception is thrown.'
