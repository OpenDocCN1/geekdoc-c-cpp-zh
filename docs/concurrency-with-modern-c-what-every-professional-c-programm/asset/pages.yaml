  md: "# 16.4 Clocks\n\nThe fact that there are three different types of clocks begs\
    \ the question: What are the differences?\n\n+   - **std::chrono::system_clock**:\
    \ is the system-wide real-time clock (wall-clock). The clock has the auxiliary\
    \ functions `to_time_t` and `from_time_t` to convert time points into calendar\
    \ time.\n+   - **std::chrono::steady_clock**: is the only clock to provide the\
    \ guarantee that you cannot adjust it. Therefore, `std::chrono::steady_clock`\
    \ is the preferred clock to measure time intervals.\n+   - **std::chrono::high_resolution_clock**\
    \ is the clock with the highest accuracy but it can be simply an alias for the\
    \ clocks `std::chrono::system_clock` or `std::chrono::steady_clock`.\n\n![](img/d61a6c83410484053b8892275d2fcc4f_687_0.png)\n\
    \n# No guarantees about the accuracy, starting point, and valid time range\n\n\
    The C++ standard provides no guarantee about the accuracy, the starting point\
    \ or the valid time range of the clocks. Typically, the starting point of `std::chrono::system_clock`\
    \ is the 1.1.1970, the so-called UNIX-epoch, while for `std::chrono::steady_clock`\
    \ it is usually the boot time of your PC.\n\n# 16.4.1 Accuracy and Steadiness\n\
    \nIt is pretty interesting to know which clocks are steady and what accuracy they\
