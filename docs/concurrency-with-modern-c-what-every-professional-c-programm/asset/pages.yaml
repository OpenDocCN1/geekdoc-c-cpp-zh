    The co_await operator needs an available as argument. The available is converted
    into an awaiter.


    # 5.4.2 The Concept Awaiter


    The concept Awaiter requires three functions.


    The concept Awaiter


    | Function | Description |

    |---|---|

    | await_ready | Indicates if the result is ready. When it returns false, await_suspend
    is called. |

    | await_suspend | Schedule the coroutine for resumption or destruction. |

    | await_resume | Provides the result for the co_await exp expression. |


    The C++20 standard already defines two basic awaitables: std::suspend_always,
    and std::suspend_never.


    # 5.4.3 std::suspend_always and std::suspend_never


    As its name suggests, the Awaitable suspend_always always suspends. Therefore,
    the call await_ready returns false.'
