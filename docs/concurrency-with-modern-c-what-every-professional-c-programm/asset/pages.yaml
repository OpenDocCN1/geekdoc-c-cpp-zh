  md: '# ### 7.1.1 A long Way


    In October 2018 many proposals were written for executors, and many design decisions
    are still open. The expectation is that they are part of C++23. There is the chance
    the one-way execution is even standardized with C++20. This chapter is mainly
    based on the proposals to the design of executors P0764¹, and to their formal
    description in P0443² and P1244³. P0443 (A Unified Executors Proposal for C++)
    proposes the one-way execution, which may be part of C++20, and P1244 (Dependent
    Execution for a Unified Executors Proposal for C++) propose the dependent execution,
    which may be part of C++23. This chapter also refers to the relatively new "Modest
    Executor Proposal" P1055⁴.


    # ### 7.1.2 What is an Executor?


    First of all. What is an executor? An executor consists of a set of rules about
    **where**, **when**, and **how** to run a callable unit.


    +   - **Where**: The callable may run on an internal or external processor, and
    that the result is read back from the internal or external processor.

    +   - **When**: The callable may run immediately or be scheduled for a later time.

    +   - **How**: The callable may run on a CPU or GPU or even be executed in a vectorized
    way.


    More formally, each executor has properties associated with the performed `execution`
    function.


    # #### 7.1.2.1 Executor Properties


    You can associate these properties with an executor in two ways: `execution::require`,
    or `execution::prefer`.


    +   1. **Directionality**: The execution function can be of kind "fire and forget"
    (`execution::oneway`), return a future (`execution::twoway`), or return a continuation
    (`execution::then`).

    +   2. **Cardinality**: The execution function can create one (`execution::single`)
    or multiple execution agents (`execution::bulk`).

    +   3. **Blocking**: The function may block or not. There are three mutually-exclusive
    blocking properties: `execution::blocking.never`, `execution::blocking.possibly`,
    and `execution::blocking.always`.

    +   4. **Continuations**: The task may be performed on the client''s calling thread
    (`execution::continuation`) or not (`execution::not_continuation`).

    +   5. **Future task submission**: Specify if outstanding work is likely (`execution::outstanding_work.tracked`)
    or not (`execution::outstanding_work.untracked`).

    +   6. **Bulk forward progress guarantees**: Specifies the mutually-exclusive
    forward progress guarantees of execution agents created in bulk: `execution::bulk_sequenced_execution`,
    `execution::bulk_parallel_execution`, and `execution::bulk_unsequenced_execution`.


    +   - ¹ http://www.open-std.org/jtc1/sc22/wg21/docs/papers/2018/p0764r2.pdf

    +   - ² http://open-std.org/JTC1/SC22/WG21/docs/papers/2018/p0443r7.html

    +   - ³ http://www.open-std.org/jtc1/sc22/wg21/docs/papers/2018/p1244r0.html

    +   - ⁴ http://open-std.org/JTC1/SC22/WG21/docs/papers/2018/p1055r0.pdf'
