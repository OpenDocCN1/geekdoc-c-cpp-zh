- pgno: 24
  md: 'A from its creator detached thread is typically called a daemon thread because
    it runs in the background.


    A `std::thread` is a variadic template. This means that it can receive an arbitrary
    number of arguments; either the callable or the thread can get the arguments.


    # 1.1.2.1.2 `std::jthread` (C++20)


    `std::jthread` stands for joining thread. In addition to `std::thread` from C++11,
    `std::jthread` automatically joins in its destructor and can cooperatively be
    interrupted. Consequently, `std::jthread` extends the interface of `std::thread`.


    # 1.1.2.2 Shared Data


    You have to coordinate access to a shared variable if more than one thread uses
    it simultaneously and the variable is mutable (non-const). Reading and writing
    a shared variable concurrently is a data race and, therefore, undefined behavior.
    Coordinating access to a shared variable is achieved with mutexes and locks in
    C++.


    # 1.1.2.2.1 Mutexes


    A mutex (*mutual exclusion*) guarantees that only one thread can access a shared
    variable at any given time. A mutex locks and unlocks the critical section, to
    which the shared variable belongs. C++ has five different mutexes. They can lock
    recursively, tentatively, and with or without time constraints. Even mutexes can
    share a lock at the same time.


    # 1.1.2.2.2 Locks


    You should encapsulate a mutex in a lock to release the mutex automatically. A
    lock implements the RAII idiom by binding a mutex’s lifetime to its own. C++ has
    a `std::lock_guard` / `std::scoped_lock` for the simple, and a `std::unique_lock`
    / `std::shared_lock` for the advanced use cases such as the explicit locking or
    unlocking of the mutex, respectively.


    # 1.1.2.2.3 Thread-safe Initialization of Data


    If shared data is read-only, it’s sufficient to initialize it in a thread-safe
    way. C++ offers various ways to achieve this including using a constant expression,
    a static variable with block scope, or using the function `std::call_once` in
    combination with the flag `std::once_flag`.


    # 1.1.2.3 Thread Local Data


    Declaring a variable as thread-local ensures that each thread gets its own copy.
    Therefore, there is no shared variable. The lifetime of thread-local data is bound
    to the lifetime of its thread.'
