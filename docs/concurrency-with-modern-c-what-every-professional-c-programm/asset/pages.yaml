  md: '# 10.1.5 Advantages and Disadvantages


    Before I present a minimal implementation of the Active Object pattern, here are
    its advantages and disadvantages.


    +   - **Advantages:**

    +     - The synchronization is only necessary on the Active Object’s thread but
    not on the client’s threads.

    +     - Clear separation between the client (user) and the server (implementer).
    The synchronization challenges are on the implementer’s side.

    +     - Enhanced throughput of the system because of the asynchronous execution
    of the requests. Invoking processing-intensive member functions do not block the
    entire system.

    +     - The scheduler can implement various strategies to execute the pending
    requests. If so, the jobs can be executed in a different order they are enqueued.

    +   - **Disadvantages:**

    +     - If the requests are too fine-grained, the Active Object pattern’s performance
    overhead such as the proxy, the activation list, and the scheduler may be excessive.

    +     - Due to the scheduler’s scheduling strategy and the operating system’s
    scheduling, debugging the Active Object pattern is often quite tricky. This holds,
    in particular, if the jobs are executed in a different order, they are enqueued.


