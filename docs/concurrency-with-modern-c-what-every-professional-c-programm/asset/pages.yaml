  md: "# ## Multiple time synchronization with semaphores\n\n```\n```cpp\n// pingPongSemaphore.cpp\n\
    \n#include <iostream>\n#include <semaphore>\n#include <thread>\n\nstd::counting_semaphore<1>\
    \ signal2Ping(0);\nstd::counting_semaphore<1> signal2Pong(0);\n\nstd::atomic<int>\
    \ counter{};\nconstexpr int countLimit = 1'000'000;\n\nvoid ping() {\n    while(counter\
    \ <= countLimit) {\n        signal2Ping.acquire();\n        ++counter;\n     \
    \   signal2Pong.release();\n    }\n}\n\nvoid pong() {\n    while(counter <= countLimit)\
    \ {\n        signal2Pong.acquire();\n        signal2Ping.release();\n    }\n}\n\
    \nint main() {\n\n    auto start = std::chrono::system_clock::now();\n\n    signal2Ping.release();\n\
    \    std::thread t1(ping);\n    std::thread t2(pong);\n\n    t1.join();\n    t2.join();\n\
    \n    std::chrono::duration<double> dur = std::chrono::system_clock::now() - start;\n\
    \    std::cout << \"Duration: \" << dur.count() << \" seconds\" << '\\n';\n\n\
    }\n```\n```"
