    The `std::transform_inclusive_scan` function in line 61 is similar. This function
    maps each element to its length.


    The `std::reduce` function should be pretty easy to read; it puts ":" characters
    between every two elements of the input vector. The resulting string should not
    start with a ":" character; therefore, the range starts at the second element
    (`strVec2.begin() + 1`) and uses the first element of the vector `strVec2[0]`
    as the initial element.


    ![](img/d61a6c83410484053b8892275d2fcc4f_257_0.png)


    # transform_reduce becomes map_reduce


    I have more to say about the `std::transform_reduce` function in line 80. First
    of all, the C++ algorithm transform is in other languages often called map. Therefore,
    we could also call `std::transform_reduce` `std::map_reduce`. Now I assume you
    noticed it. `std::transform_reduce` is the well-known parallel MapReduce* algorithm
    implemented in C++. Accordingly, `std::transform_reduce` maps a unary callable
    (`[](std::string s){ return s.length(); }`) onto a range and reduces the pair
    to a output value: `[](std::size_t a, std::size_t b){ return a + b; }`.


    Studying the output of the program should help you.


    > *https://en.wikipedia.org/wiki/MapReduce'
