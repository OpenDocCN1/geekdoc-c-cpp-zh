    ```\n```\n\n```\n```cpp\nvoid setDataReadyGood(){\n    mySharedWork = {1, 0, 3};\n\
    \    {\n        std::lock_guard<std::mutex> lck(mutex_);\n        dataReady =\
    \ true;\n    }                              // unlock the mutex\n    std::cout\
    \ << \"Data prepared\" << '\\n';\n    condVar.notify_one();\n}\n```\n```\n\nThe\
    \ functions setDataReadyBad and setDataReadyGood are the notification components\
    \ of a condition variable. The variable dataReady is necessary to protect against\
    \ spurious wakeups and lost wakeups. Because dataReady is a non-atomic variable,\
    \ it has to be synchronized using the lock lck. To make the lifetime of the lock\
    \ as short as possible, use an artificial scope ({ ... }) such as in the function\
    \ setDataReadyGood.\n\n# 11.2.2.4 Put a mutex into a lock\n\nYou should not use\
    \ a mutex without a lock."
