- pgno: 295
  md: '`event.notified` is false. This false value causes the suspension of the coroutine.
    Technically, method `await_suspend` (lines 63 - 78) is executed. `await_suspend`
    gets the coroutine handle `coroHandle` and stores it for later invocation in the
    variable `coroutineHandle` (line 64). Of course, later invocation means resumption.
    Second, the waiter is stored in the variable `suspendedWaiter`. When later `event2.notify`
    triggers its notification, method `notify` (line 80) is executed. The difference
    with the first workflow is that the condition `waiter != nullptr` evaluates to
    true. The result is that the waiter uses the `coroutineHandle` to resume the coroutine.


    # ## Distilled Information


    +   - Coroutines are generalized functions that can pause and resume their execution
    while keeping their state.

    +   - With C++20, we don''t get concrete coroutines, but a framework for implementing
    coroutines. This framework consists of more than 20 functions that you partially
    have to implement and partially could overwrite.

    +   - With the new keywords `co_await` and `co_yield`, C++20 extends the execution
    of C++ functions with two new concepts.

    +   - Thanks to `co_await expression` it is possible to suspend and resume the
    execution of the expression. If you use `co_await expression` in a function `func`,
    the call `auto getResult = func()` does not block if the function''s result is
    not available. Instead of resource-consuming blocking, you have resource-friendly
    waiting.

    +   - `co_yield` empowers you to write infinite data streams.'
