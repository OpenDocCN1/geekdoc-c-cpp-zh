  md: '+   - If you use the expression `x.readvalue(1)`, CppMem evaluates the interleavings
    of the threads for which the thread execution gives the value 1 for x.


    # 17.1.3 3. Display Relations


    +   - Describes the relations between the read, write, and read-write modifications
    on atomic operations, fences and locks.

    +   - You can explicitly enable the relations in the annotated graph with the
    checkboxes.

    +   - There are three classes of relations. The coarser distinction between original
    and derived relations is the most interesting one. Here are the default values.

    +     - Original relations:

    +       - **sb**: sequenced-before

    +       - **rf**: read from

    +       - **mo**: modification order

    +       - **sc**: sequentially consistent

    +       - **lo**: lock order

    +     - Derived relations:

    +       - **sw**: synchronises-with

    +       - **dob**: dependency-ordered-before

    +       - **unsequenced_races**: races in a single thread

    +       - **data_races**: inter-thread data races


    # 17.1.4 4. Display Layout


    +   - With this switch you can choose which [Doxygraph](https://sourceforge.net/projects/doxygraph/)
    graph is used.


    # 17.1.5 5. Model Predicates


    +   - With this button, you can set the predicates for the chosen model, which
    can cause a non-consistent (not data-race-free) execution; therefore, if you get
    a non-consistent execution, you see precisely the reason for the non-consistent
    execution. I do not use these buttons in this book.


    See the [documentation](https://sourceforge.net/projects/doxygraph/) for more
    details.


    This is sufficient as a starting point for CppMem. Now, it is time to give CppMem
    a try.


    CppMem provides many examples.


    # 17.1.6 The Examples


    The examples show typical use-case when working with concurrent and, in particular,
    with lock-free code. The examples are grouped into categories.


    ¹https://sourceforge.net/projects/doxygraph/

    ⁴http://svr-peso-20-mem.cam.ac.uk/cppmem/help.html'
