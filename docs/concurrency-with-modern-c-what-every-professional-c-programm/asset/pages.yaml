    \ y << \" \";\n    std::cout << \"x: \" << x << '\\n';\n}\n\nint main(){\n   \
    \ std::thread thread1(writing);\n    std::thread thread2(reading);\n    thread1.join();\n\
    \    thread2.join();\n}\n```\n```\n\nThe program is quite simple. It consists\
    \ of the two threads thread1 and thread2. thread1 writes the values x and y. thread2\
    \ reads the values x and y in the **opposite sequence**. This idea sounds straightforward,\
