  md: "Strategized locking is the idea of the strategy pattern applied to locking.\
    \ This means putting your locking strategy into an object and making it into a\
    \ pluggable component of your system. First of all: What is the strategy pattern?\n\
    \n# ### 9.2.2.1 Strategy Pattern\n\n![](img/d61a6c83410484053b8892275d2fcc4f_485_0.png)\n\
    \nThe Strategy Pattern\n\nThe strategy pattern is one of the book's classic behavioral\
    \ patterns *Design Patterns: Elements of Reusable Object-Oriented Software*^15.\
    \ It's also known as a policy. The critical idea is defining a family of algorithms\
    \ and encapsulating each algorithm in an object. Consequently, the algorithms\
    \ become pluggable components.\n\nThe Strategy Pattern\n\n```\n    // strategy.cpp\n\
    \n    #include <iostream>\n    #include <memory>\n\n    class Strategy {\n   \
    \ public:\n        virtual void operator()() = 0;\n        virtual ~Strategy()\
    \ = default;\n    };\n\n    class Context {\n        std::shared_ptr<Strategy>\
    \ _strat;\n    public:\n        explicit Context() : _strat(nullptr) {}\n\n```\n\
    \n> > ^15 https://en.wikipedia.org/wiki/Design_Patterns"
