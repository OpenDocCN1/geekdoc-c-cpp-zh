  md: '# 7.2.1 Concurrency TS v1


    # 7.2.1.1 `std::future`


    The name extended futures is quite easy to explain. First, the C++11 `std::future`
    interface was extended; second, there are new functions for creating special futures
    that are composable. I start with my first point.


    The extended future has three new member functions:


    +   - The unwrapping constructor that unwraps the outer future of a wrapped future
    (`future<future<T>>`).

    +   - The `predicate` is_ready that returns if a shared state is available.

    +   - The member function then attaches a continuation to a future.


    At first, the state of a future can be valid or ready.


    # 7.2.1.1.1 valid versus ready


    +   - **valid**: a future is valid if it has a shared state (with a promise).
    This does not have to be the case because you can default-construct a `std::future`
    without a promise.

    +   - **ready**: a future is ready if the shared state is available or put differently
    if the promise has already produced its value.


    Therefore, (`valid == true`) is a requirement for (`ready == true`).


    My mental model of promise and future is that they are the endpoints of a data
    channel.


    ![](img/d61a6c83410484053b8892275d2fcc4f_442_0.png)


    Tasks as data channels between communication endpoints


    Now the difference between valid and ready becomes quite natural. The future is
    valid if there is a data channel to a promise. The future is ready if the promise
    has already put its value into the data channel.


    Now to the member function then for the continuation of a future.'
