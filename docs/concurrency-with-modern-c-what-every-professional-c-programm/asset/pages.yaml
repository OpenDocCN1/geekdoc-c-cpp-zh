  md: "# ### 17.1.6.2 Further Categories\n\nThe other categories focus on specific\
    \ aspects of lock-free programming. The example of each category is available\
    \ in various forms. Each form using different memory orderings. For an additional\
    \ discussion to the categories, read the already mentioned paper *Mathematizing\
    \ C++ Concurrency*⁴. If possible, present the program with sequential consistency.\n\
    \n# #### 17.1.6.2.1 Store Buffering (examples/SB_store_buffering)\n\nTwo threads\
    \ write to separate locations and then read from the other location.\n\n```\n\
    ```c\n// SB-sc_sc-sc_sc.c\n// Store Buffering (or Dekker's), with all four accesses\
    \ SC atomics\n// Question: can the two reads both see 0 in the same execution?\n\
    int main() {\n  atomic_int x=0; atomic_int y=0;\n  {{{ { y.store(1,memory_order_seq_cst);\n\
    \        r1=x.load(memory_order_seq_cst); }\n    ||| { x.store(1,memory_order_seq_cst);\n\
    \        r2=y.load(memory_order_seq_cst); } }}}\n  return 0;\n}\n```\n```\n\n\
    # #### 17.1.6.2.2 Message Passing (examples/MP_message_passing)\n\nOne thread\
    \ writes data (non-atomic) and sets an atomic flag, while the second thread waits\
    \ for the flag and reads data (non-atomic).\n\n```\n```c\n// MP-ma_sc-sc_na.c\n\
    // Message Passing, of data held in non-atomic x,\n//   with sc atomic stores\
    \ and loads on y giving release/acquire synchronization\n// Question: is the read\
    \ of x required to see the new data value 1\n//   rather than the initial state\
    \ value 0?\nint main() {\n  int x=0; atomic_int y=0;\n  {{{ { x=1;\n        y.store(1,memory_order_seq_cst);\
    \ }\n    ||| { r1=y.load(memory_order_seq_cst).readsvalue(1);\n        r2=x; }\
    \ }}}\n  return 0;\n}\n```\n```"
