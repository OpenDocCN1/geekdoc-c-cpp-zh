    \ are invoked in the calling execution agent.\n```\n```\n\n# ### 7.2.2.1.3 Passing\
    \ futures to `.then`: Continuations Are Unwieldy\n\nBecause the future is passed\
    \ to the continuation and not its value, the syntax is quite complicated. First,\
    \ once more, the correct but verbose version.\n\n**Continuations with `std::future`**\n\
    \n```\n```cpp\nstd::future<int> f1 = std::async([]() { return 123; });\nstd::future<std::string>\
    \ f2 = f1.then([](std::future<int> f) {\n    return std::to_string(f.get());\n\
    });\n```\n```\n\nNow, I assume that I can pass the value because `to_string` is\
