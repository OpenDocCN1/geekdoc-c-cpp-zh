  md: '# ## 16.5 Sleep and Wait


    One crucial feature that multithreading components such as threads, locks, condition
    variables, and futures have in common is the notion of time.


    # ### 16.5.0.1 Conventions


    The member functions for handling time in multithreading programs follow a simple
    convention. Member functions ending with `_for` have to be parametrized by a time
    duration; member functions ending with `_until` by a time point. Here is a concise
    overview of the member functions dealing with sleeping, blocking, and waiting.


    Member functions for sleeping, blocking, and waiting


    | Multithreading Component | _until | _for |

    |---|---|---|

    | std::thread th | th.sleep_until(2min) | th.sleep_for(2s) |

    | std::unique_lock lk | lk.try_lock_until(2min) | lk.try_lock(2s) |

    | std::condition_variable cv | cv.wait_until(2min) | cv.wait_for(2s) |

    | std::future fu | fu.wait_until(2min) | fu.wait_for(2s) |

    | std::shared_future shFu | shFu.wait(2min) | shFu.wait_for(2s) |


    `2min` stands for a time 2 minutes in the future. `2s` is a time duration of 2
    seconds. Although I use `auto` in the initialization of the time point `2min`,
    the following is still verbose:


    Defining a time point


    ```

    ```cpp

    auto 2min= std::chrono::steady_clock::now() + std::chrono::minutes(2);

    ```

    ```


    Time literals from C++14 come to our rescue when using time durations. `2s` stands
    for 2 seconds. Let''s look at different waiting strategies.


    # ### 16.5.0.2 Various waiting strategies


    The main idea of the following program is that the promise provides its result
    for four shared futures. That is possible because more than one `shared_future`
    can wait to notify the same promise. Each future has a different waiting strategy.
    Both the promise and every future are executed in different threads. For simplicity
    reasons I speak in the rest of this subsection only about a waiting thread, although
    it is the corresponding future that is waiting. Here are the details of the promises
    and the futures. Here are the strategies for the four waiting threads:


    +   - `consumeThread1`: waits up to 4 seconds for the result of the promise.

    +   - `consumeThread2`: waits up to 20 seconds for the result of the promise.'
