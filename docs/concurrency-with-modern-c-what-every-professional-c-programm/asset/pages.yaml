  md: "# ### 11.1.5 Use pure functions\n\nHaskell is called a pure functional language\
    \ because it is based on pure functions. A pure function is a function which always\
    \ produces the same results when given the same arguments. It has no side effect\
    \ and can, therefore, not change the state of the program.\n\nPure functions have\
    \ a significant advantage from the concurrency perspective. They can be reordered\
    \ or automatically run on another thread.\n\nFunctions in C++ are per default\
    \ impure. The following three functions are all pure, but each function has a\
    \ different characteristic.\n\n```\n```cpp\nint powFunc(int m, int n){\n    if\
    \ (n == 0) return 1;\n    return m * powFunc(m, n-1);\n}\n```\n```\n\npowFunc\
    \ is an ordinary function that runs at runtime.\n\n```\n```cpp\ntemplate<int m,\
    \ int n>\nstruct PowMeta{\n    static int const value = m * PowMeta<m, n-1>::value;\n\
    };\n\ntemplate<int m>\nstruct PowMeta<m, 0>{\n    static int const value = 1;\n\
