  md: '# **PROJECT**


    # ## Chromatic Polynomials


    # ### Purpose


    In previous courses, you may have learned about how coloring vertex-edge graphs
    can help you solve problems. You probably found that you and your classmates often
    colored the same graph differently. In this project, you will investigate the
    number of ways a graph can be colored using *k* colors.


    # ### Directions


    A *k*-coloring of a network or vertex-edge graph is an assignment of *k* colors
    to the vertices so that no two vertices connected by an edge have the same color.
    In the past, you have explored the existence of a coloring using a minimum number
    of colors. (See Course 1, Unit 4, Lesson 2.) Shown at the right are two different
    colorings of a graph on 4 vertices using 3 colors. Two colorings are different
    if at least one vertex has a different color.


    ![](img/524030daad8f78e8d291a7f96ed9b8cb_61_0.png)


    +   1. How many different 3-colorings are there of the graph shown below? Explain
    your reasoning.


    ![](img/524030daad8f78e8d291a7f96ed9b8cb_61_1.png)


    +   2. The function that gives the number of *k*-colorings for a graph *G* is
    called the chromatic polynomial and is denoted by $C_G(k)$. Think about the chromatic
    polynomials for the following two graphs.


    ![](img/524030daad8f78e8d291a7f96ed9b8cb_61_2.png)


    Graph on 4 vertices with no edges


    ![](img/524030daad8f78e8d291a7f96ed9b8cb_61_3.png)


    Complete graph on 4 vertices (every edge)


    +   **a.** Let *G* be a graph of 4 vertices with no edges. Explain why the chromatic
    polynomial for a graph *G* of 4 vertices with no edges is $C_G(k)=k^4$.


    +   **b.** Explain why the chromatic polynomial for a complete graph *G* on 4
    vertices is $C_G(k)=k(k-1)(k-2)(k-3)$. What are the zeros for this polynomial?
    Explain why the chromatic polynomial must be zero for these values of *k*.


    +   **c.** What is the chromatic polynomial for a graph *G* on *p* vertices with
    no edges? What is the chromatic polynomial for a complete graph *G* on *p* vertices?'
  merge: -1
