    form f(x) = p(x) / ((x − a)(x − b)) such that neither (x − a) nor (x − b) are
    factors of p(x). In this case, x = a and x = b are vertical asymptotes.


    +   4. a. x + 4

    +      b. x + 15

    +      c. C(x) = (x + 4) / (x + 15)

    +      d. The horizontal asymptote is C(x) = 1 which represents 100% ammonia.
    As more and more ammonia is added to the solution, that is, as x grows large (|x|
    → ∞), the concentration of ammonia approaches 100%.


