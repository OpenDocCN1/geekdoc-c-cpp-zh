- pgno: 17
  md: "# LESSON 1 QUIZ\n\n# Form A\n\nSuggested Solutions\n\n+   1.  \n+      a. The\
    \ polynomial must be at least degree 4 since it has three local maxima or minima\
    \ and four *x*-intercepts.\n+      \n+      b. The local maximum points are (−3.9,\
    \ 8.1) and (2.9, 8.1). Student estimates should be close to these.\n+      \n\
    +      c. The local minimum point is (−0.5, −4.6).\n+      \n+      d. The zeroes\
    \ of the function are *x* = −5, *x* = −2, *x* = 1, and *x* = 4.\n\n+   2.  \n\
    +      a. The zeroes of *f(x)* are *x* = 0, *x* = 1, and *x* = −5.\n+      \n\
    +      b. *f(x)* = *x*³ + 4*x*² − 5*x*\n\n+   3.  \n+      a. Any polynomial of\
    \ degree 4 is correct.\n+      \n+      b. Any polynomial of degree 3 with −7*x*³\
    \ as the leading term is correct.\n+      \n+      c. Any polynomial of degree\
    \ 3 is correct.\n\n+   4. The possible rules are of two forms:\n+   \n+      *f(x)*\
    \ = *a*(*x* − 3)²(*x* + 2), where *a* is any real number, and\n+   \n+      *f(x)*\
    \ = *a*(*x* − 3)(*x* + 2)², where *a* is any real number.\n\n+   5.  \n+     \
    \ a. *P(x)* = *x*(250 − 5*x*) − (1,250 − 30*x*) = −5*x*² + 280*x* − 1,250\n+ \
    \     \n+      b. The daily profit is $670, since *P*(8) = 670."
  merge: -1
