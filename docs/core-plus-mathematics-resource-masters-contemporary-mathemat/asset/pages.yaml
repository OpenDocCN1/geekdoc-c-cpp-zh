  md: "7. If \\(\\sqrt{k}\\) is an integer, which of the following must be integers?\n\
    \nI. \\(\\sqrt{\\frac{k}{4}}\\)       II. \\((\\sqrt{5k})^2\\)       III. \\(\\\
    sqrt{9k}\\)\n\n+   (a) None  \n+   (b) I and II only  \n+   (c) I and III only\
    \  \n+   (d) II and III only  \n+   (e) I, II, and III\n\n8. If \\(m^2 - 4n^2\
    \ = 32\\) and \\(m + 2n = 8\\), what is the value of \\(m - 2n\\)?\n\n+   (a)\
    \ \\(-4\\)       (b) \\(\\frac{1}{4}\\)       (c) 2       (d) 4       (e) 16\n\
    \n9. In the figure, \\(\\overline{AD} \\parallel \\overline{HE}\\) and \\(\\overline{BH}\
    \ \\parallel \\overline{DF}\\). Which one of the following quadrilaterals is a\
    \ parallelogram?\n\n+   (a) ADEH  \n+   (b) CDFG  \n+   (c) BDEH  \n+   (d) BDFH\
    \  \n+   (e) CDEG\n\n![](img/524030daad8f78e8d291a7f96ed9b8cb_66_0.png)\n\n10.\
    \ Approximately 25% of the cars sold are red. Michael is observing cars as they\
    \ drive by his house. What is the probability that he has to watch at least three\
    \ cars go by in order to see a red one?\n\n+   (a) 0.140625       (b) 0.25      \
    \ (c) 0.4375       (d) 0.5625       (e) 0.75\n\n# TEST-TAKING TIP\n\n**Factoring\
    \ a quadratic expression often makes a question transparent.**\n\nCollege entrance\
    \ examination authors think it is important for students to be able to factor\
    \ several simple quadratic expressions such as \\(ax^2 + bx\\), \\(x^2 + 2ax +\
    \ a^2\\), and \\(x^2 - y^2\\). However, you are seldom directly asked to factor.\
    \ Rather, you are asked a question that is simple once you see that factoring\
    \ a quadratic expression is involved.\n\n**Example**  Look back at Item 8. To\
    \ use factoring, notice that in \\(m^2 - 4n^2 = 32\\), the left-hand expression\
    \ is the difference of two squares, \\(m^2\\) and \\((2n)^2\\). Thus, \\(m^2 -\
    \ 4n^2 = (m + 2n)(m - 2n) = 32\\). Since \\(m + 2n = 8\\), \\(m - 2n = 4\\). So,\
    \ the answer is (d).\n\nFind, if possible, another test item in the practice set\
    \ for which this strategy might be helpful."
