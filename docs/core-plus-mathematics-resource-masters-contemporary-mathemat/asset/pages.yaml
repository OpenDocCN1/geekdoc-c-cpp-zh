  md: "# TAKE-HOME ASSESSMENTS\n\n# Suggested Solutions\n\n+   1. **a.** These terms\
    \ represent forces that pull the balloon downward.\n+   \n+      **b.** Solve\
    \ ⅔πbR³ − 4πwR² = 4πR²(b⁄3R − w) = 0. Since 4πR² > 0, it follows that R = 3w⁄b.\n\
    +   \n+      **c.** Solve ⅔πR³(0.1) − 4πR²(0.2) − 750 ≥ 0. Finding the x-intercept\
    \ of the graph shows that the minimum radius of the balloon is approximately 14.51\
    \ ft.\n\n+   2. Since x³ − 2x² + 26x = x(x² − 2x + 26), we know that x = 0 is\
    \ one solution to the equation. The other solutions will be solutions to x² −\
    \ 2x + 26 = 0. They are 1 ± 5i. So, the three solutions are x = 0, x = 1 + 5i,\
    \ and x = 1 − 5i.\n\n+   3. The zeroes are at x = 2 and x = 0.5, so the numerator\
    \ could be (x − 2)(2x − 1). The horizontal asymptote is y = 1, so the degrees\
    \ of the numerator and denominator are equal and their leading coefficients are\
    \ equal. There are vertical asymptotes at x = 1 and x = −0.5, so the denominator\
    \ could be (x − 1)(2x + 1). The equation y = [(x − 2)(2x − 1)]⁄[(x − 1)(2x + 1)]\
    \ is a good choice, and it can be verified by checking other points on the graph."
