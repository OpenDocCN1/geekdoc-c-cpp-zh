  md: "# TAKE-HOME ASSESSMENTS\n\n1. Two major forces determine the rise or fall of\
    \ a hot air balloon, a lifting force and a drag force due to gravity. A formula\
    \ for the force \\(F\\) in pounds on a spherical balloon is given by\n\n\\[F=\\\
    frac{4}{3}\\pi bR^3-4\\pi wR^2-c,\\]\n\nwhere \\(R\\) is the radius in feet of\
    \ the balloon, \\(b\\) is the lifting force in pounds per cubic foot, \\(w\\)\
    \ is the drag force in pounds per square foot, and \\(c\\) is the weight in pounds\
    \ of the equipment including the basket and its occupants.\n\n+   a. Assuming\
    \ that \\(w\\) and \\(c\\) are both positive numbers, explain why the last two\
    \ terms in the formula for \\(F\\) are preceded by minus signs.\n+   \n+   b.\
    \ The balloon will rise or fall depending on whether \\(F\\) is positive or negative.\
    \ Ignore the weight of the equipment, that is, assume \\(c=0\\). What is the minimum\
    \ radius \\(R\\) of the balloon in terms of \\(b\\) and \\(w\\) that will keep\
    \ it steady (neither rising nor falling)? Show or explain your work.\n+   \n+\
    \   c. Suppose that for a certain balloon, \\(b=0.1\\,\\text{lb/ft}^3\\) and \\\
