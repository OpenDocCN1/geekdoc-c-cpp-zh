- pgno: 20
  md: '# Form B

    Suggested Solutions


    +   1. a. The polynomial must be at least degree 3 since it has one local maximum,
    one local minimum, and three \(x\)-intercepts.

    +      b. Students need to use at least 4 points as the basis of their curve fitting.
    One set of points that works well is \((-8, 0)\), \((-4, 27)\), \((4.5, -2.5)\),
    and \((8, 15)\). Using these points, the function rule is \(f(x) = 0.1x^3 - 0.1x^2
    - 5.2x + 14.1\).

    +   2. a. \(8x^3 - x + 3\)

    +      b. \(14x^2 + 4x - 6\)

    +      c. \(54x^2 - 39x - 5\)

    +      d. \(2x^3 + 9x^2 + 15x + 18\)

    +   3. a. False. If the polynomials do not have the same degree, the sum of the
    polynomials will always have a degree equal to the highest degree of the polynomials
    being added together, so this sum will be cubic.

    +      b. True. The degree of a product of two polynomials will be the sum of
    the degrees.

    +      c. True. If \(f(-1.6) = 0\), then \(k(-1.6) = f(-1.6) \cdot g(-1.6) = 0
    \cdot g(-1.6) = 0\).

    +   4. a. The zeroes of \(c(x)\) are \(x = -5\) and \(x = 3\).

    +      b. The degree of \(c(x)\) is 3.

    +   5. a. \(P_r(t) + P_w(t) = -16t^2 + 550t - 4,250\)

    +      b. The weekly profit will be $454 since \(P_r(16) + P_w(16) = 454\).

    +      c. To maximize profit, the ticket price should be $17.19.'
