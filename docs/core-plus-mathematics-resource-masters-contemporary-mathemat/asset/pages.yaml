- pgno: 5
  md: '# # Core-Plus Mathematics

    ## Using the Unit Resource Masters


    # ## Overview of Unit Resource Masters


    To assist you as you teach Course 3 of *Core-Plus Mathematics*, unit-specific
    resource books have been developed. The unit resources provided can help you focus
    student attention on the important mathematics being developed. They can be used
    to help students organize their results related to specific problems, synthesize
    what they are learning, and practice for standardized tests.


    Unit resource books provide the following types of masters in the order that they
    are used in the unit.


    +   - *Transparency Masters*

    +     1. Think About This Situation (TATS) masters to help launch the lesson

    +     2. Masters to collect class results

    +     3. Summarize the Mathematics (STM) masters to help facilitate the synthesis
    of mathematical ideas from the investigation (To guide your planning, sample discussion
    scenarios called “Promoting Mathematical Discourse” are provided in the Teacher’s
    Guide for selected TATS and STM discussions.)


    +   - *Student Masters*

    +     1. Masters to help students organize or display their results or thinking.

    +     2. Masters to help students develop their proof-writing abilities (differentiation)

    +     3. Technology Tips to facilitate learning technology features of graphing
    calculators, *CPMP*-Tools software, and computer algebra systems (CAS)

    +     4. Templates for manipulatives

    +     5. Unit Summary masters to provide a starting point for pulling together
    the main mathematical ideas of a unit

    +     6. Practice for Standardized Tests masters provide an opportunity for students
    to complete tasks presented in the format of most high-stakes tests and to consider
    test-taking strategies. (Solutions to these tasks are printed in the Teacher’s
    Guide following the final unit Summarize the Mathematics. This allows you the
    option of providing or not providing the solutions to students.)


    +   - *Assessment Masters*

    +     1. Quizzes (two forms for each lesson)

    +     2. In-class tests (two forms for each unit)

    +     3. Take-home assessment items (three items for each unit)

    +     4. Projects (two for each unit except Unit 1)

    +     5. Midterm and end-of-course assessment items (Unit 4 and Unit 8 contain
    a bank of assessment items from which to design cumulative final exams.)


    All of the items in this book are included for viewing and printing from the *Core-Plus
    Mathematics* TeacherWorks Plus CD-ROM. Custom tailoring of assessment items in
    this book, as well as creation of additional items, can be accomplished by using
    the ExamView Assessment Suite.'
  merge: -1
  img_proc: true
- pgno: 6
  md: '# # Assessment in Core-Plus Mathematics


    Throughout the *Core-Plus Mathematics* curriculum, the term “assessment” is meant
    to include all instances of gathering information about students’ levels of understanding
    and their disposition toward mathematics for purposes of making decisions about
    instruction. The dimensions of student performance that are assessed in this curriculum
    (see chart below) are consistent with the assessment recommendations of the National
    Council of Teachers of Mathematics in the *Assessment Standards for School Mathematics*
    (NCTM, 1995). They are more comprehensive than those of a typical testing program.


    | **Assessment Dimensions** |  |  |

    |---|---|---|

    | **Process** | **Content** | **Disposition** |

    | Problem Solving<br>Reasoning<br>Communication<br>Connections | Concepts<br>Applications<br>Representational
    Strategies<br>Procedures | Beliefs<br>Perseverance<br>Confidence<br>Enthusiasm
    |


    These unit resource masters contain the tools for formal assessment of the process
    and content dimensions of student performance. Calculators are assumed in most
    cases on these assessments. Teacher discretion should be used regarding student
    access to their textbooks and Math Toolkits for assessments. In general, if the
    goals to be assessed are problem solving and reasoning, while memory of facts
    and procedural skill are of less interest, resources should be allowed. However,
    if automaticity of procedures or unaided recall are being assessed, it is appropriate
    to prohibit resource materials.


    You may want to consult the extended section on assessment in the front matter
    of the Course 3 *Core-Plus Mathematics Teacher’s Guide and Implementing Core-Plus
    Mathematics*. Among the topics presented in these sources are curriculum-embedded
    assessment, student-generated assessment, and scoring assessments and assigning
    grades. Since the *Core-Plus Mathematics* approach and materials provide a wide
    variety of assessment information, the teacher will be in a good position to assign
    grades. With such a wide choice of assessment opportunities, a word of caution
    is appropriate: *It is easy to overassess students, and care must be taken to
    avoid doing so.* Since many rich opportunities for assessing students are embedded
    in the curriculum itself, you may choose not to use a quiz at the end of every
    lesson or to replace all or portions of an in-class test with take-home tasks
    or projects.'
