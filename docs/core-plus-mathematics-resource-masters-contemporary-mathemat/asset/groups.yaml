    # # A New Algorithm for Dynamic Time Warping

    Underlying Music Alignment


    **Anonymous Author(s)**

    Affiliation

    Address

    Email


    **Abstract**

    Dynamic Time Warping (DTW) is a common method for aligning two sequences. It is
    widely used in audio alignment, bioinformatics, and other fields. Traditional
    DTW requires $O(N^2)$ time and space, which limits its application to large-scale
    data. This paper proposes a new algorithm that reduces the time complexity to
    $O(N \log N)$ while maintaining high accuracy. We evaluate our algorithm on music
    alignment tasks and demonstrate its superiority over existing methods.


    **1. Introduction**

    The alignment of time series data is a fundamental problem in many domains. For
    example, in music information retrieval, aligning a performance to a score enables
    applications such as score following and automatic accompaniment. The most widely
    used approach is Dynamic Time Warping (DTW), which computes an optimal alignment
    between two sequences under certain constraints. However, the classic DTW algorithm
    has a quadratic time and space complexity, making it impractical for long sequences.


    Recent works have attempted to speed up DTW by using approximations or parallel
    computing. These methods often sacrifice accuracy or rely on specific hardware.
    In contrast, our algorithm provides an exact solution with significantly lower
    complexity. The main idea is to use a divide-and-conquer strategy combined with
    fast distance computation.


    The rest of this paper is organized as follows. Section 2 reviews the classic
    DTW algorithm and its variants. Section 3 presents our proposed algorithm in detail.
    Section 4 describes the experimental setup and results. Section 5 concludes the
    paper and discusses future work.


    **2. Preliminaries**

    Let $X = (x_1, x_2, ..., x_n)$ and $Y = (y_1, y_2, ..., y_m)$ be two sequences.
    A warping path $P = (p_1, p_2, ..., p_k)$ is a sequence of index pairs $p_t =
    (i_t, j_t)$ that satisfies the following conditions:


    ```

    $$

    \begin{aligned}

    \text{(1)}&\quad p_1 = (1,1),\quad p_k = (n,m) \\

    \text{(2)}&\quad 0 \le i_{t+1}-i_t \le 1 \quad \text{and} \quad 0 \le j_{t+1}-j_t
    \le 1 \\

    \text{(3)}&\quad \text{No two consecutive steps are both diagonal.}

    \end{aligned}

    $$

    ```


    The cost of a path is defined as the sum of the distances between the aligned
    elements. The DTW distance is the minimum cost over all valid warping paths, computed
    via dynamic programming:


    **References**

    [1] H. Sakoe and S. Chiba. Dynamic programming algorithm optimization for spoken
    word recognition. *IEEE Transactions on Acoustics, Speech, and Signal Processing*,
    26(1):43–49, 1978.

    [2] D. Ellis and G. Poliner. Identifying cover songs with chroma features and
    dynamic programming. In *Proc. ISMIR*, 2007.'
