    - **Step 9.** $x+\\frac{b}{2a}=\\frac{\\sqrt{b^2-4ac}}{2a}$ or $x+\\frac{b}{2a}=\\\
    frac{-\\sqrt{b^2-4ac}}{2a}$\n- **Step 10.** So, $x=\\frac{-b}{2a}+\\frac{\\sqrt{b^2-4ac}}{2a}$\
    \ or $x=\\frac{-b}{2a}-\\frac{\\sqrt{b^2-4ac}}{2a}$.\n\n## Summarize the Mathematics\n\
