    \ \\(\\frac{x+4}{x}-\\frac{3}{x-4}\\)\n- **6.** 将每个积或商改写为等价的更简形式。\n  - a. \\((x^2+5x)(3x^2-6)\\\
    )\n  - b. \\((x+1)(2x^2+5x+3)\\)\n  - c. \\(\\frac{x^2-6x}{4}\\cdot\\frac{12x}{x-6}\\\
    )\n  - d. \\(\\frac{3x^2-21x}{5x^2}\\div\\frac{x^2-2x-35}{10x}\\)\n- **7.** Tran\
