    \ She may choose from 3 meat selections, 4 types of vegetables, and 5 kinds of\
    \ cookies. How many different menus, each with a meat, a vegetable, and a cookie,\
    \ could she select?\n+   \n+   (a) 12       (b) 17       (c) 23       (d) 35      \
