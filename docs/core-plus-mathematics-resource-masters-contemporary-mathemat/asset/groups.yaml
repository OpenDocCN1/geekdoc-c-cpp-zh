    \ a. Write a polynomial function rule for $g(x)$ so that the degree of $f(x)+g(x)$\
    \ is 4. Explain your reasoning.\n  - b. Write a polynomial function rule for $h(x)$\
    \ so that the degree of $f(x)-h(x)$ is 2. Explain your reasoning.\n  - c. Write\
    \ a polynomial function rule for $p(x)$ so that the degree of $f(x)\\cdot p(x)$\
    \ is 6. Explain your reasoning.\n\n- 4. Write a rule for a cubic function that\
    \ has zeroes only at $(3, 0)$ and $(-2, 0)$. Explain your reasoning.\n\n- 5. The\
    \ daily revenue of the Lensic movie theater depends on the ticket cost $x$ according\
    \ to the function $R(x)=x(250-5x)$. The daily expenses of the theater are related\
    \ to the ticket price according to the rule $E(x)=1{,}250-30x$.\n\n  - a. Find\
    \ a rule in standard polynomial form for the daily profit.\n  - b. If the ticket\
    \ price is \\$8, what is the daily profit?\n\n### Suggested Solutions\n\n- 1.\n\
    \  - a. The polynomial must be at least degree 4 since it has three local maxima\
    \ or minima and four $x$-intercepts.\n  - b. The local maximum points are $(-3.9,\
    \ 8.1)$ and $(2.9, 8.1)$. Student estimates should be close to these.\n  - c.\
    \ The local minimum point is $(-0.5, -4.6)$.\n  - d. The zeroes of the function\
    \ are $x=-5$, $x=-2$, $x=1$, and $x=4$.\n\n- 2.\n  - a. The zeroes of $f(x)$ are\
    \ $x=0$, $x=1$, and $x=-5$.\n  - b. $f(x)=x^3+4x^2-5x$.\n\n- 3.\n  - a. Any polynomial\
    \ of degree 4 is correct.\n  - b. Any polynomial of degree 3 with $7x^3$ as the\
    \ leading term is correct.\n  - c. Any polynomial of degree 3 is correct.\n\n\
    - 4. The possible rules are of two forms:\n  - $f(x)=a(x-3)^2(x+2)$, where $a$\
    \ is any real number, and\n  - $f(x)=a(x-3)(x+2)^2$, where $a$ is any real number.\n\
    \n- 5.\n  - a. $P(x)=x(250-5x)-(1{,}250-30x)=-5x^2+280x-1{,}250$.\n  - b. The\
    \ daily profit is \\$670, since $P(8)=670$.\n\n### Form B\n\n- 1. Consider the\
    \ graph of the polynomial function shown below.\n\n  ![](img/524030daad8f78e8d291a7f96ed9b8cb_18_0.png)\n\
    \n  - a. What is the smallest possible degree for this polynomial function? Explain\
    \ your reasoning.\n  - b. Use a curve-fitting tool to find a polynomial function\
    \ rule that models the graph pattern. List the points you use as the basis of\
    \ your curve fitting.\n  - Points: ________________________________\n  - Function\
    \ rule: ________________________________\n\n- 2. Write an equivalent algebraic\
    \ expression in standard polynomial form.\n\n  - a. $(6x^3+3x^2-x+5)+(2x^3-3x^2-2)$\n\
    \  - b. $(12x^2+7x-1)-(5+3x-2x^2)$\n  - c. $(6x-5)(9x+1)$\n  - d. $(x+3)(2x^2+3x+6)$\n\
    \n- 3. Suppose that $f(x)$ is a cubic function and $g(x)$ is a quadratic function.\
    \ Decide if each of the following statements is true or false. Explain your reasoning\
    \ in each case.\n\n  - a. The polynomial function $h(x)=f(x)+g(x)$ will always\
    \ be a quadratic function.\n  - b. If $k(x)=f(x)\\cdot g(x)$, then the degree\
    \ of $k(x)$ must be 5.\n  - c. If $-1.6$ is a zero of $f(x)$, then $-1.6$ must\
