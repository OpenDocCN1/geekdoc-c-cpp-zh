    \ and \\(c\\) are both positive numbers, explain why the last two terms in the\
    \ formula for \\(F\\) are preceded by minus signs.\n  - **b.** The balloon will\
    \ rise or fall depending on whether \\(F\\) is positive or negative. Ignore the\
    \ weight of the equipment, that is, assume \\(c=0\\). What is the minimum radius\
    \ \\(R\\) of the balloon in terms of \\(b\\) and \\(w\\) that will keep it steady\
    \ (neither rising nor falling)? Show or explain your work.\n  - **c.** Suppose\
    \ that for a certain balloon, \\(b=0.1\\,\\text{lb/ft}^3\\) and \\(w=0.2\\,\\\
    text{lb/ft}^2\\). What minimum radius of the balloon is required to lift equipment\
    \ weighing \\(c=750\\) pounds?\n\n- **2.** Find three real number or nonreal complex\
    \ number solutions to the equation\n\n  \\[\n  x^3-2x^2+26x=0.\n  \\]\n\n- **3.**\
    \ Determine a possible function rule for the following graph. The scales on both\
    \ axes are one. The \\(x\\)-intercepts appear to be \\(\\frac{1}{2}\\) and 2.\
    \ Explain how the characteristics of the graph help you to determine this function\
    \ rule.\n\n  ![](img/524030daad8f78e8d291a7f96ed9b8cb_56_0.png)\n\n  Function\
    \ Rule: ______________________________\n\n### Suggested Solutions\n\n- **1.**\n\
    \n  - **a.** These terms represent forces that pull the balloon downward.\n  -\
    \ **b.** Solve \\(\\frac{4}{3}\\pi bR^3 - 4\\pi wR^2 = 4\\pi R^2\\left(\\frac{bR}{3}-w\\\
    right)=0\\). Since \\(4\\pi R^2>0\\), it follows that \\(R=\\frac{3w}{b}\\).\n\
    \  - **c.** Solve \\(\\frac{4}{3}\\pi R^3(0.1)-4\\pi R^2(0.2)-750\\ge0\\). Finding\
    \ the \\(x\\)-intercept of the graph shows that the minimum radius of the balloon\
    \ is approximately 14.51 ft.\n\n- **2.** Since \\(x^3-2x^2+26x=x(x^2-2x+26)\\\
    ), we know that \\(x=0\\) is one solution to the equation. The other solutions\
    \ will be solutions to \\(x^2-2x+26=0\\). They are \\(1\\pm5i\\). So, the three\
    \ solutions are \\(x=0\\), \\(x=1+5i\\), and \\(x=1-5i\\).\n\n- **3.** The zeros\
    \ are at \\(x=2\\) and \\(x=0.5\\), so the numerator could be \\((x-2)(2x-1)\\\
    ). The horizontal asymptote is \\(y=1\\), so the degrees of the numerator and\
    \ denominator are equal and their leading coefficients are equal. There are vertical\
    \ asymptotes at \\(x=1\\) and \\(x=-0.5\\), so the denominator could be \\((x-1)(2x+1)\\\
    ). The equation \\(y=\\frac{(x-2)(2x-1)}{(x-1)(2x+1)}\\) is a good choice, and\
    \ it can be verified by checking other points on the graph.\n\n## PROJECT: Volume\
    \ and Pressure\n\n### Purpose\n\nIn this unit and in previous ones, you have used\
    \ algebraic models in a variety of real-world applications. In this project, you\
    \ will explore such an application involving volume and pressure, two important\
    \ variables in physics.\n\n### Directions\n\nAs the piston of an engine rotates,\
    \ it compresses and decompresses the air in the chamber. A compressed air and\
    \ fuel mixture produces greater forces than an uncompressed mixture when the gas\
    \ is ignited by the spark plug. To model the compression of a piston, this project\
    \ will explore the relationship between the volume and pressure for a 60-cubic\
    \ centimeter (cc) syringe attached to a pressure sensor. There is no outlet for\
    \ the air inside the syringe.\n\n- **1.** Using a syringe and pressure sensor,\
    \ gather your own data that will help you determine the relationship between the\
    \ volume of air in the syringe and the pressure. If you cannot gather your own\
    \ data, the table on the right gives the pressure readings for a syringe at 5-cc\
    \ increments. The additional 3 cc of volume is to account for the volume of air\
    \ in the connector tube. Make a scatterplot of the \\((volume, pressure)\\) data.\n\
    \n- **2.** What do you expect to happen to the pressure as the volume continues\
    \ to decrease? What does this tell you about the graph of the \\((volume, pressure)\\\
    ) data?\n\n![](img/524030daad8f78e8d291a7f96ed9b8cb_58_0.png)\n\n| Volume (in\
    \ cc) | Pressure |\n|---:|---:|\n| 63 | 0.448 |\n| 58 | 0.487 |\n| 53 | 0.526\
    \ |\n| 48 | 0.577 |\n| 43 | 0.638 |\n| 39 | 0.716 |\n| 33 | 0.823 |\n| 28 | 0.963\
    \ |\n| 23 | 1.190 |\n| 18 | 1.530 |\n\n- **3.** If instead of pushing in the plunger\
    \ of the syringe, you pulled the plunger out (assuming a long syringe), what would\
    \ you expect to happen to the pressure? If a syringe is available, try this and\
    \ check your conjecture. How should your conjecture be reflected in a graph of\
    \ the \\((volume, pressure)\\) data?\n\n- **4.** Find an algebraic model that\
    \ you think best fits the data.\n\n- **5.** Graph your model on the same screen\
    \ as the scatterplot. Explain the significance of any asymptotes.\n\n- **6.**\
    \ Write a report that includes your complete responses to Items 1–5 above. In\
    \ your report, include a comparison of your relationship in Item 5 to Boyle’s\
    \ Law. Boyle’s Law states that an ideal gas will satisfy the equation \\(PV =\
    \ nRT\\) where \\(P\\) is the pressure, \\(V\\) is the volume, \\(n\\) is the\
