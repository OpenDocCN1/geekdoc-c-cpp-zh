  - "[PAGE 50]\n\n# # UNIT TEST\n\n# ## Form A\n### Suggested Solutions\n\n+   1.\
    \ **a.** The girth of the box is 4x. Thus, the greatest length must be 108 − 4x.\
    \ The area of one end of the box is x². Since the volume is the area of the end\
    \ times the length, the volume is x²(108 − 4x).\n+   \n+      **b.** V(x) = −4x³\
    \ + 108x²\n+   \n+      **c.** 3\n+   \n+      **d.** The zeroes are 0 and 27.\n\
    +   \n+      **e.** The maximum volume of the box is 11,664 in³. The dimensions\
    \ of this box are 18 in. × 18 in. × 36 in.\n\n+   2. **a.** IV\n+   \n+      **b.**\
    \ I\n+   \n+      **c.** III\n+   \n+      **d.** VII\n+   \n+      **e.** II\n\
    \n+   3. **a.** f(x) = x² + 6x + 9 − 4 − 9\n+   \n+      f(x) = (x + 3)² − 13\n\
    +   \n+      **b.** The minimum point has coordinates (−3, −13).\n+   \n+    \
    \  **c.** x = [−6 ± √(6² − 4(1)(−4))] / [2(1)] = −6/2 ± √52/2 = −3 ± √13\n\n+\
    \   4. **a.** x⁴ + 5x³ + 6\n+   \n+      **b.** −8x³ + 4x + 7\n\n+   5. **a.**\
    \ (3x − 15)/(x − 5) = 3(x − 5)/(x − 5) = 3\n+   \n+      **b.** (3x² + 6x)/(x\
    \ + 3)\n+   \n+      **c.** (x² − 3x − 16)/(x² − 4x)\n\n+   6. **a.** 3x⁴ + 15x³\
    \ − 6x² − 30x\n+   \n+      **b.** 2x³ + 7x² + 8x + 3\n+   \n+      **c.** 3x²\n\
    +   \n+      **d.** 6/(x + 5)\n\n+   7. **a.** It looks like a line because the\
    \ simplified form of f(x) = (x² + 7x + 6)/(x + 1) is f(x) = x + 6, which is a\
    \ rule for a linear function.\n+   \n+      **b.** The graph is not really a line\
    \ because the original function is undefined when x = −1. But the domain of a\
    \ linear function is all real numbers."
