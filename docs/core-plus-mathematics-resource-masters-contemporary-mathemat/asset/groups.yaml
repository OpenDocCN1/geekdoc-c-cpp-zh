    ### 使用单元资源母版\n\n### 单元资源母版概述\n\n为协助您教授 *Core-Plus Mathematics* 第3课程，已开发了针对各单元的资源书。所提供的单元资源可帮助您将学生的注意力集中到正在学习的重要数学内容上。它们可用于帮助学生整理与特定问题相关的结果、综合所学内容，并为标准化考试进行练习。\n\
    \n单元资源书按照单元中的使用顺序提供以下类型的母版。\n\n- *透明胶片母版*\n    1. 思考此情境（TATS）母版，用于帮助引入本课\n   \
    \ 2. 用于收集班级结果的母版\n    3. 总结数学（STM）母版，用于帮助促进对探究活动中数学思想的综合（为指导您的规划，教师指南中针对部分 TATS\
    \ 和 STM 讨论提供了名为“促进数学对话”的示例讨论场景。）\n\n- *学生用母版*\n    1. 帮助学生整理或展示其结果或思考的母版。\n  \
    \  2. 帮助学生培养证明写作能力的母版（差异化）\n    3. 技术提示，用于促进学习图形计算器、*CPMP*-Tools 软件和计算机代数系统（CAS）的技术功能\n\
    \    4. 操作教具模板\n    5. 单元总结母版，为汇集一个单元的主要数学思想提供起点\n    6. 标准化考试练习母版，为学生提供机会完成以大多数高风险考试格式呈现的任务，并考虑应试策略。（这些任务的解答印在教师指南中最后一个单元“总结数学”之后。这使您可以选择是否向学生提供解答。）\n\
    \n- *评估母版*\n    1. 测验（每课两种版本）\n    2. 课堂测试（每单元两种版本）\n    3. 家庭评估题（每单元三题）\n   \
    \ 4. 项目（除第1单元外，每单元两个）\n    5. 期中与课程结业评估题（第4单元和第8单元包含题库，可用于设计累积性期末考试。）\n\n本书中的所有题目均包含在\
    \ *Core-Plus Mathematics* TeacherWorks Plus CD-ROM 中，可供查看和打印。使用 ExamView Assessment\
    \ Suite 可对本书中的评估题进行定制调整，并创建额外题目。\n\n## Core-Plus 数学中的评估\n\n在 *Core-Plus Mathematics*\
    \ 课程中，“评估”一词旨在包括为作出教学决策而收集有关学生理解水平及其对数学态度的信息的所有情形。本课程所评估的学生表现维度（见下表）与全国数学教师委员会在\
    \ *学校数学评估标准*（NCTM，1995）中提出的评估建议一致。这些维度比典型测试项目的维度更全面。\n\n| **评估维度** |  |  |\n|\
    \ --- | --- | --- |\n| **过程** | **内容** | **态度** |\n| 问题解决<br>推理<br>交流<br>联系 |\
    \ 概念<br>应用<br>表征策略<br>程序 | 信念<br>坚持<br>自信<br>热情 |\n\n这些单元资源母版包含用于正式评估学生表现的过程维度和内容维度的工具。在大多数情况下，这些评估假定使用计算器。对于学生在评估期间能否使用教科书和数学工具包，教师应自行斟酌。一般来说，如果评估目标是问题解决和推理，而不太关注事实记忆和程序技能，则应允许使用资源。然而，如果评估的是程序的自动化或无辅助回忆，则适宜禁止使用资源材料。\n\
    \n您可能想查阅第3课程 *Core-Plus Mathematics Teacher’s Guide and Implementing Core-Plus\
    \ Mathematics* 前文中的评估扩展章节。这些资料中介绍的主题包括课程嵌入式评估、学生生成的评估，以及评估评分和成绩评定。由于 *Core-Plus\
    \ Mathematics* 的方法和材料提供了多种多样的评估信息，教师将能够很好地评定成绩。面对如此丰富的评估机会，适当的提醒是：*很容易对学生评估过度，必须注意避免这样做。*\
    \ 由于课程本身嵌入了许多丰富的学生评估机会，您可以选择不在每课结束时使用测验，或用家庭任务或项目替换全部或部分课堂测试。\n\n"
