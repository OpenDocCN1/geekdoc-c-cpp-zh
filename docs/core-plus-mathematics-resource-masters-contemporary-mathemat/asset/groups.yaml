    # # Proving the Quadratic Formula


    # ## Problem 1


    **Start:** If $ax^2+bx+c=0$ (and $a\ne0$),


    **Step 1.** Then $\frac{ax^2}{a}+\frac{bx}{a}+\frac{c}{a}=0$.


    **Step 2.** $x^2+\frac{b}{a}x+\frac{c}{a}=0$


    **Step 3.** $x^2+\frac{b}{a}x=-\frac{c}{a}$


    **Step 4.** $x^2+\frac{b}{a}x+\frac{b^2}{4a^2}=-\frac{c}{a}+\frac{b^2}{4a^2}$


    **Step 5.** $x^2+\frac{b}{a}x+\frac{b^2}{4a^2}=\frac{b^2}{4a^2}+\frac{-c}{a}$


    **Step 6.** $\left(x+\frac{b}{2a}\right)^2=\frac{b^2}{4a^2}+\frac{-c}{a}$


    **Step 7.** $\left(x+\frac{b}{2a}\right)^2=\frac{b^2}{4a^2}+\frac{-4ac}{4a^2}$


    **Step 8.** $\left(x+\frac{b}{2a}\right)^2=\frac{b^2-4ac}{4a^2}$


    **Step 9.** $x+\frac{b}{2a}=\frac{\sqrt{b^2-4ac}}{2a}$ or $x+\frac{b}{2a}=\frac{-\sqrt{b^2-4ac}}{2a}$


    **Step 10.** So, $x=\frac{-b}{2a}+\frac{\sqrt{b^2-4ac}}{2a}$ or $x=\frac{-b}{2a}-\frac{\sqrt{b^2-4ac}}{2a}$.'
