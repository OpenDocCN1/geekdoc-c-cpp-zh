  md: "\n## PROJECT\n### Chromatic Polynomials\n\n**Purpose**\n\nIn previous courses,\
    \ you may have learned about how coloring vertex-edge graphs can help you solve\
    \ problems. You probably found that you and your classmates often colored the\
    \ same graph differently. In this project, you will investigate the number of\
    \ ways a graph can be colored using *k* colors.\n\n**Directions**\n\nA *k*-coloring\
    \ of a network or vertex-edge graph is an assignment of *k* colors to the vertices\
    \ so that no two vertices connected by an edge have the same color. In the past,\
    \ you have explored the existence of a coloring using a minimum number of colors.\
    \ (See Course 1, Unit 4, Lesson 2.) Shown at the right are two different colorings\
    \ of a graph on 4 vertices using 3 colors. Two colorings are different if at least\
    \ one vertex has a different color.\n\n![](img/524030daad8f78e8d291a7f96ed9b8cb_61_0.png)\n\
    \n- **1.** How many different 3-colorings are there of the graph shown below?\
    \ Explain your reasoning.\n\n  ![](img/524030daad8f78e8d291a7f96ed9b8cb_61_1.png)\n\
    \n- **2.** The function that gives the number of *k*-colorings for a graph *G*\
    \ is called the chromatic polynomial and is denoted by $C_G(k)$. Think about the\
    \ chromatic polynomials for the following two graphs.\n\n  ![](img/524030daad8f78e8d291a7f96ed9b8cb_61_2.png)\n\
    \  Graph on 4 vertices with no edges\n\n  ![](img/524030daad8f78e8d291a7f96ed9b8cb_61_3.png)\n\
    \  Complete graph on 4 vertices (every edge)\n\n  - **a.** Let *G* be a graph\
    \ of 4 vertices with no edges. Explain why the chromatic polynomial for a graph\
    \ *G* of 4 vertices with no edges is $C_G(k)=k^4$.\n  - **b.** Explain why the\
    \ chromatic polynomial for a complete graph *G* on 4 vertices is $C_G(k)=k(k-1)(k-2)(k-3)$.\
    \ What are the zeros for this polynomial? Explain why the chromatic polynomial\
    \ must be zero for these values of *k*.\n  - **c.** What is the chromatic polynomial\
    \ for a graph *G* on *p* vertices with no edges? What is the chromatic polynomial\
    \ for a complete graph *G* on *p* vertices?\n\n- **3.** Find the chromatic polynomial\
    \ for each of the following graphs on 4 vertices.\n\n  ![](img/524030daad8f78e8d291a7f96ed9b8cb_62_0.png)\n\
    \n  ![](img/524030daad8f78e8d291a7f96ed9b8cb_62_1.png)\n\n- **4.** The graph shown\
    \ below is a cycle of length 4. The chromatic polynomial for a cycle of length\
    \ 4 is \\(k^4 - 4k^3 + 6k^2 - 3k\\).\n\n  ![](img/524030daad8f78e8d291a7f96ed9b8cb_62_2.png)\n\
    \n  Give a justification that shows this polynomial is correct.\n\n- **5.** Make\
    \ a chart that shows all possible graphs on 1, 2, 3, and 4 vertices and the corresponding\
    \ chromatic polynomials. (Hint: There are 4 possible graphs on 3 vertices and\
    \ 11 possible graphs on 4 vertices.)\n\n- **6.** Create at least three different\
    \ graphs on 5 vertices for which you can determine the chromatic polynomial. Give\
    \ a clear justification of the chromatic polynomial.\n\n- **7.** Write a report\
    \ which includes your complete responses to Items 1–6. Clearly explain the reasoning\
    \ you used to complete each item. Your drawings should be neat and accurate. Include\
    \ a summary in which you discuss your observations and ideas on how to find the\
    \ chromatic polynomial for a graph.\n\n## PROJECT\n### Suggested Solutions\n**Chromatic\
    \ Polynomials**\n\nStudents can work alone or in pairs on this project. You may\
    \ wish to spend some time introducing or reviewing the Multiplication Principle\
    \ of Counting before students begin work on this project. Every graph has a related\
    \ *chromatic polynomial*. Using the Multiplication Principle of Counting, these\
    \ polynomials are fairly easy to find for graphs with up to 4 vertices. However,\
    \ it is easy to create a graph with 5 vertices for which the chromatic polynomial\
    \ is complicated and difficult to justify. A recursive algorithm exists for computing\
    \ the chromatic polynomial for any graph G. The algorithm shows that every graph\
    \ has a chromatic polynomial. However, which polynomials have corresponding graphs\
    \ is still an unanswered question in mathematics. Students who are ready for a\
    \ challenge should be encouraged to investigate the recursive algorithm for computing\
    \ the chromatic polynomial that is described in some graph theory textbooks: $C_G(k)=C_{G-e}(k)-C_{G/e}(k)$,\
    \ where $G-e$ is the graph with the edge $e$ removed and $G/e$ is the graph where\
    \ the vertices of $e$ are identified together (made one).\n\n**Suggested Timeline**\n\
    \nAllow students several days to work on Items 1–6. Have them submit their solutions\
    \ in draft form. Check their drafts and provide them feedback. When you are comfortable\
    \ that their solutions are essentially correct, give them a few days to prepare\
    \ a draft of their report. After getting prompt feedback to their draft from you,\
    \ they should be able to complete their final report in a few more days.\n\n**Solutions**\n\
    \n- **1.** There are 6 different 3-colorings of the given graph. Start at any\
    \ vertex; there are 3 choices for coloring that vertex. Then there are 2 possible\
    \ colors for the next vertex that is chosen, and the last vertex must be colored\
    \ using the remaining color. This gives 6 possible 3-colorings. Some students\
    \ might choose to show all 6 possibilities. In this case, be sure they can justify\
    \ that they have all possible 3-colorings.\n\n- **2.**\n  - **a.** Since each\
    \ vertex can be assigned any of the $k$ colors, there are $k^4$ possible assignments.\
    \ Thus, the chromatic polynomial on a null graph (a graph with no edges) of 4\
    \ vertices is $C_G(k)=k^4$.\n  - **b.** Start with any vertex; choose one of $k$\
    \ colors. Choose a second vertex. Since it is adjacent to the first vertex, it\
    \ can be colored with $(k-1)$ colors. Choose one of these colors. The third vertex\
    \ can be colored with $(k-2)$ colors and the fourth vertex with $(k-3)$ colors.\
    \ Thus, the chromatic polynomial for a complete graph on 4 vertices is $C_G(k)=k(k-1)(k-2)(k-3)$.\
    \ The zeroes for this polynomial are 0, 1, 2, and 3, which indicates that there\
    \ are no colorings if only 0, 1, 2, or 3 colors are used.\n  - **c.** Graph on\
    \ $p$ vertices with no edges: $C_G(k)=k^p$; complete graph on $p$ vertices: $C_G(k)=k(k-1)(k-2)\\\
    cdots(k-p+1)$.\n\n## PRACTICING FOR STANDARDIZED TESTS\n### Practice Set\n\nSolve\
    \ each problem. Then record the letter that corresponds to the correct answer.\n\
    \n- **1.** If $a>0$ and $b>0$ and the slope of the line passing through $(-2a,a)$\
    \ and $(b,3a)$ is 2, which of the following is an expression for $b$ in terms\
    \ of $a$? (a) $-a$ (b) $-2a$ (c) $-2a-2$ (d) $3a$ (e) $4a$\n\n- **2.** Olivia\
    \ is planning the mathematics club annual picnic. She may choose from 3 meat selections,\
    \ 4 types of vegetables, and 5 kinds of cookies. How many different menus, each\
    \ with a meat, a vegetable, and a cookie, could she select? (a) 12 (b) 17 (c)\
    \ 23 (d) 35 (e) 60\n\n- **3.** In $\\triangle PQR$ at the right, if $y=35^\\circ$,\
    \ what is the value of $x$? (a) $30^\\circ$ (b) $35^\\circ$ (c) $40^\\circ$ (d)\
    \ $45^\\circ$ (e) $50^\\circ$\n\n  ![](img/524030daad8f78e8d291a7f96ed9b8cb_65_0.png)\n\
    \n- **4.** A school’s honor society has 150 members. There are 70 boys and 80\
    \ girls, of whom 40 are juniors and 110 are seniors. What is the smallest possible\
    \ number of senior girls in the society? (a) 0 (b) 20 (c) 40 (d) 60 (e) 80\n\n\
    - **5.** What value satisfies both $|3x-4|=5$ and $|1-2x|=5$? (a) $-2$ (b) $-\\\
    frac{1}{3}$ (c) $1$ (d) $3$ (e) $5$\n\n- **6.** If $p+q=5$ and $2pq=8$, what is\
    \ $p^2+q^2$? (a) 1 (b) 3 (c) 9 (d) 13 (e) 17\n\n- **7.** If \\(\\sqrt{k}\\) is\
    \ an integer, which of the following must be integers? I. \\(\\sqrt{\\frac{k}{4}}\\\
    ) II. \\((\\sqrt{5k})^2\\) III. \\(\\sqrt{9k}\\) (a) None (b) I and II only (c)\
    \ I and III only (d) II and III only (e) I, II, and III\n\n- **8.** If \\(m^2\
    \ - 4n^2 = 32\\) and \\(m + 2n = 8\\), what is the value of \\(m - 2n\\)? (a)\
    \ \\(-4\\) (b) \\(\\frac{1}{4}\\) (c) 2 (d) 4 (e) 16\n\n- **9.** In the figure,\
    \ \\(\\overline{AD} \\parallel \\overline{HE}\\) and \\(\\overline{BH} \\parallel\
    \ \\overline{DF}\\). Which one of the following quadrilaterals is a parallelogram?\
    \ (a) ADEH (b) CDFG (c) BDEH (d) BDFH (e) CDEG\n\n  ![](img/524030daad8f78e8d291a7f96ed9b8cb_66_0.png)\n\
    \n- **10.** Approximately 25% of the cars sold are red. Michael is observing cars\
    \ as they drive by his house. What is the probability that he has to watch at\
    \ least three cars go by in order to see a red one? (a) 0.140625 (b) 0.25 (c)\
    \ 0.4375 (d) 0.5625 (e) 0.75\n\n### TEST-TAKING TIP\n\n**Factoring a quadratic\
    \ expression often makes a question transparent.**\n\nCollege entrance examination\
    \ authors think it is important for students to be able to factor several simple\
    \ quadratic expressions such as \\(ax^2 + bx\\), \\(x^2 + 2ax + a^2\\), and \\\
    (x^2 - y^2\\). However, you are seldom directly asked to factor. Rather, you are\
    \ asked a question that is simple once you see that factoring a quadratic expression\
    \ is involved.\n\n**Example** Look back at Item 8. To use factoring, notice that\
    \ in \\(m^2 - 4n^2 = 32\\), the left-hand expression is the difference of two\
    \ squares, \\(m^2\\) and \\((2n)^2\\). Thus, \\(m^2 - 4n^2 = (m + 2n)(m - 2n)\
    \ = 32\\). Since \\(m + 2n = 8\\), \\(m - 2n = 4\\). So, the answer is (d).\n\n\
    Find, if possible, another test item in the practice set for which this strategy\
    \ might be helpful.\n"
  mdcn: "\n## 项目\n### 色多项式\n\n**目的**\n\n在之前的课程中，你可能已经学习过如何通过对顶点-边图进行着色来帮助解决问题。你很可能发现，你和同学经常对同一个图作出不同的着色。在本项目中，你将研究用\
    \ *k* 种颜色对一个图进行着色的方法数。\n\n**说明**\n\n网络或顶点-边图的一个 *k*-着色，是将 *k* 种颜色分配给顶点，使得由一条边相连的两个顶点不具有相同颜色。过去，你们已经探讨过使用最少颜色数进行着色的存在性。（见课程1，第4单元，第2课。）右图展示了用3种颜色对一个4顶点图进行着色的两种不同方式。如果至少有一个顶点的颜色不同，则两种着色不同。\n\
    \n![](img/524030daad8f78e8d291a7f96ed9b8cb_61_0.png)\n\n- **1.** 下图所示的图有多少种不同的3-着色？解释你的推理。\n\
    \n  ![](img/524030daad8f78e8d291a7f96ed9b8cb_61_1.png)\n\n- **2.** 给出图 *G* 的 *k*-着色数量的函数称为色多项式，记作\
    \ $C_G(k)$。思考下面两个图的色多项式。\n\n  ![](img/524030daad8f78e8d291a7f96ed9b8cb_61_2.png)\n\
    \  4个顶点且无边的图\n\n  ![](img/524030daad8f78e8d291a7f96ed9b8cb_61_3.png)\n  4个顶点的完全图（每两个顶点之间都有边）\n\
    \n  - **a.** 设 *G* 是一个有4个顶点且无边的图。解释为什么一个有4个顶点且无边的图 *G* 的色多项式是 $C_G(k)=k^4$。\n\
    \  - **b.** 解释为什么4个顶点的完全图 *G* 的色多项式是 $C_G(k)=k(k-1)(k-2)(k-3)$。这个多项式的零点是什么？解释为什么对于这些\
    \ *k* 值，色多项式必须为零。\n  - **c.** 一个有 *p* 个顶点且无边的图 *G* 的色多项式是什么？一个有 *p* 个顶点的完全图 *G*\
    \ 的色多项式是什么？\n\n- **3.** 求下列每个4顶点图的色多项式。\n\n  ![](img/524030daad8f78e8d291a7f96ed9b8cb_62_0.png)\n\
    \n  ![](img/524030daad8f78e8d291a7f96ed9b8cb_62_1.png)\n\n- **4.** 下图是一个长度为4的环。长度为4的环的色多项式为\
    \ \\(k^4 - 4k^3 + 6k^2 - 3k\\)。\n\n  ![](img/524030daad8f78e8d291a7f96ed9b8cb_62_2.png)\n\
    \n  给出一个能说明该多项式正确的论证。\n\n- **5.** 制作一张图表，展示1个、2个、3个和4个顶点的所有可能图及其对应的色多项式。（提示：3个顶点上有4种可能的图，4个顶点上有11种可能的图。）\n\
    \n- **6.** 构造至少三个不同的5顶点图，并能够确定它们的色多项式。给出色多项式的清晰论证。\n\n- **7.** 写一份报告，包括你对第1—6项的完整回答。清楚解释你完成每一项所用的推理。你的绘图应整洁准确。包含一个总结，讨论你对如何求一个图的色多项式的观察和想法。\n\
    \n## 项目\n### 建议解答\n**色多项式**\n\n学生可以独自或两人一组完成本项目。在学生开始本项目之前，你可能希望花一些时间介绍或复习计数乘法原理。每个图都有一个相关的*色多项式*。使用计数乘法原理，对于最多4个顶点的图，这些多项式相当容易求出。然而，很容易构造一个5顶点图，其色多项式复杂且难以论证。存在一种用于计算任意图\
    \ G 的色多项式的递归算法。该算法表明每个图都有色多项式。然而，哪些多项式有对应的图，在数学中仍是一个未解问题。对于准备好接受挑战的学生，应鼓励他们研究一些图论教材中描述的、用于计算色多项式的递归算法：$C_G(k)=C_{G-e}(k)-C_{G/e}(k)$，其中\
    \ $G-e$ 是删除边 $e$ 后得到的图，$G/e$ 是将 $e$ 的两个顶点合并（视为一个）后得到的图。\n\n**建议时间安排**\n\n给学生几天时间完成第1—6项。让他们以草稿形式提交解答。检查他们的草稿并提供反馈。当你确信他们的解答基本正确后，给他们几天时间准备报告草稿。在他们及时得到你对其草稿的反馈后，他们应该能在再过几天内完成最终报告。\n\
    \n**解答**\n\n- **1.** 给定图有6种不同的3-着色。从任意顶点开始；给该顶点着色有3种选择。然后，对于下一个被选中的顶点有2种可能的颜色，而最后一个顶点必须使用剩余的颜色着色。这样得到6种可能的3-着色。有些学生可能选择展示全部6种可能性。在这种情况下，要确保他们能论证自己列出了所有可能的3-着色。\n\
    \n- **2.**\n  - **a.** 由于每个顶点都可以分配 $k$ 种颜色中的任意一种，因此有 $k^4$ 种可能的分配。因此，4个顶点的空图（无边图）的色多项式是\
    \ $C_G(k)=k^4$。\n  - **b.** 从任意顶点开始；选择 $k$ 种颜色中的一种。选择第二个顶点。由于它与第一个顶点相邻，因此可以用 $(k-1)$\
    \ 种颜色给它着色。选择其中一种颜色。第三个顶点可以用 $(k-2)$ 种颜色着色，第四个顶点可以用 $(k-3)$ 种颜色着色。因此，4个顶点的完全图的色多项式是\
    \ $C_G(k)=k(k-1)(k-2)(k-3)$。这个多项式的零点是0、1、2和3，这表明如果只使用0、1、2或3种颜色，则不存在着色。\n  - **c.**\
    \ 有 $p$ 个顶点且无边的图：$C_G(k)=k^p$；有 $p$ 个顶点的完全图：$C_G(k)=k(k-1)(k-2)\\cdots(k-p+1)$。\n\
    \n## 标准化考试练习\n### 练习集\n\n解答每一题。然后记录与正确答案对应的字母。\n\n- **1.** 如果 $a>0$ 且 $b>0$，且经过\
    \ $(-2a,a)$ 和 $(b,3a)$ 的直线的斜率为2，那么下列哪一项是用 $a$ 表示 $b$ 的表达式？(a) $-a$ (b) $-2a$ (c)\
    \ $-2a-2$ (d) $3a$ (e) $4a$\n\n- **2.** 奥利维娅正在筹划数学俱乐部的年度野餐。她可以从3种肉类选择、4种蔬菜和5种饼干中选择。她可以选出多少种不同的菜单，每种菜单包含一种肉、一种蔬菜和一种饼干？(a)\
    \ 12 (b) 17 (c) 23 (d) 35 (e) 60\n\n- **3.** 在右图的 $\\triangle PQR$ 中，如果 $y=35^\\\
    circ$，那么 $x$ 的值是多少？(a) $30^\\circ$ (b) $35^\\circ$ (c) $40^\\circ$ (d) $45^\\\
    circ$ (e) $50^\\circ$\n\n  ![](img/524030daad8f78e8d291a7f96ed9b8cb_65_0.png)\n\
    \n- **4.** 一所学校的荣誉学会有150名成员。其中有70名男生和80名女生，其中40名是三年级学生，110名是四年级学生。该学会中四年级女生的最小可能人数是多少？(a)\
    \ 0 (b) 20 (c) 40 (d) 60 (e) 80\n\n- **5.** 什么值同时满足 $|3x-4|=5$ 和 $|1-2x|=5$？(a)\
    \ $-2$ (b) $-\\frac{1}{3}$ (c) $1$ (d) $3$ (e) $5$\n\n- **6.** 如果 $p+q=5$ 且 $2pq=8$，那么\
    \ $p^2+q^2$ 是多少？(a) 1 (b) 3 (c) 9 (d) 13 (e) 17\n\n- **7.** 如果 \\(\\sqrt{k}\\\
    ) 是整数，下列哪些必定是整数？I. \\(\\sqrt{\\frac{k}{4}}\\) II. \\((\\sqrt{5k})^2\\) III. \\\
    (\\sqrt{9k}\\) (a) 无 (b) 仅 I 和 II (c) 仅 I 和 III (d) 仅 II 和 III (e) I、II 和 III\n\
    \n- **8.** 如果 \\(m^2 - 4n^2 = 32\\) 且 \\(m + 2n = 8\\)，那么 \\(m - 2n\\) 的值是多少？(a)\
    \ \\(-4\\) (b) \\(\\frac{1}{4}\\) (c) 2 (d) 4 (e) 16\n\n- **9.** 在图中，\\(\\overline{AD}\
    \ \\parallel \\overline{HE}\\) 且 \\(\\overline{BH} \\parallel \\overline{DF}\\\
    )。下列哪一个四边形是平行四边形？(a) ADEH (b) CDFG (c) BDEH (d) BDFH (e) CDEG\n\n  ![](img/524030daad8f78e8d291a7f96ed9b8cb_66_0.png)\n\
    \n- **10.** 售出的汽车中大约25%是红色的。迈克尔正在观察从他家旁驶过的汽车。他必须至少观察三辆车经过才能看到一辆红色汽车的概率是多少？(a)\
    \ 0.140625 (b) 0.25 (c) 0.4375 (d) 0.5625 (e) 0.75\n\n### 考试技巧\n\n**对二次表达式进行因式分解往往能使问题变得清晰。**\n\
    \n大学入学考试命题者认为，学生能够分解几个简单的二次表达式（如 \\(ax^2 + bx\\)、\\(x^2 + 2ax + a^2\\) 和 \\(x^2\
    \ - y^2\\)）很重要。然而，你很少被直接要求进行因式分解。相反，你被问的问题一旦你看出其中涉及二次表达式的因式分解，就会变得简单。\n\n**示例**\
    \ 回顾第8题。要使用因式分解，注意在 \\(m^2 - 4n^2 = 32\\) 中，左边表达式是平方差，即 \\(m^2\\) 与 \\((2n)^2\\\
    ) 的差。因此，\\(m^2 - 4n^2 = (m + 2n)(m - 2n) = 32\\)。由于 \\(m + 2n = 8\\)，所以 \\(m -\
    \ 2n = 4\\)。因此，答案是 (d)。\n\n如果可能，在练习集中找出另一道该策略可能有所帮助的测试题。\n\n"
