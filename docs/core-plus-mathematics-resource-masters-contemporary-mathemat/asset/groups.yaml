    \n## 单元测试\n\n### A卷\n\n- **1.** 美国邮政署只接受长度与围长（环绕距离）之和不超 108 英寸的国内运输箱子。假设你想求出一个具有正方形端面且体积最大的箱子的尺寸。\n\
