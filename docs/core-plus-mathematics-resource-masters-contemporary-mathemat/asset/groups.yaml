    \n## 一种用于音乐对齐的动态时间规整新算法\n\n**匿名作者**  \n单位  \n地址  \n电子邮件\n\n### 摘要\n\n动态时间规整（DTW）是对齐两个序列的常用方法，广泛用于音频对齐、生物信息学等领域。传统\
    \ DTW 需要 \\(O(N^2)\\) 的时间和空间，这限制了其在大规模数据上的应用。本文提出一种新算法，将时间复杂度降低至 \\(O(N \\log\
    \ N)\\)，同时保持高精度。我们在音乐对齐任务上评估了该算法，并证明了其相对于现有方法的优越性。\n\n### 1. 引言\n\n时间序列数据的对齐是许多领域的基本问题。例如，在音乐信息检索中，将演奏与乐谱对齐可实现乐谱跟随和自动伴奏等应用。最广泛使用的方法是动态时间规整（DTW），它在特定约束条件下计算两个序列之间的最优对齐。然而，经典\
    \ DTW 算法具有二次方的时间和空间复杂度，这使得它难以处理长序列。\n\n近年来的工作尝试通过近似方法或并行计算来加速 DTW。这些方法往往牺牲精度或依赖特定硬件。相比之下，我们的算法以显著更低的复杂度提供精确解。主要思想是结合分治策略与快速距离计算。\n\
    \n本文其余部分组织如下。第 2 节回顾经典 DTW 算法及其变体。第 3 节详细介绍我们提出的算法。第 4 节描述实验设置和结果。第 5 节总结全文并讨论未来工作。\n\
    \n### 2. 预备知识\n\n设 \\(X = (x_1, x_2, ..., x_n)\\) 和 \\(Y = (y_1, y_2, ..., y_m)\\\
