    \  - **c.** x = [−6 ± √(6² − 4(1)(−4))] / [2(1)] = −6/2 ± √52/2 = −3 ± √13\n-\
    \ **4.**\n  - **a.** x⁴ + 5x³ + 6\n  - **b.** −8x³ + 4x + 7\n- **5.**\n  - **a.**\
    \ (3x − 15)/(x − 5) = 3(x − 5)/(x − 5) = 3\n  - **b.** (3x² + 6x)/(x + 3)\n  -\
    \ **c.** (x² − 3x − 16)/(x² − 4x)\n- **6.**\n  - **a.** 3x⁴ + 15x³ − 6x² − 30x\n\
    \  - **b.** 2x³ + 7x² + 8x + 3\n  - **c.** 3x²\n  - **d.** 6/(x + 5)\n- **7.**\n\
