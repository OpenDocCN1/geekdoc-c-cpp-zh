    \ a polynomial function not equal the number of its zeroes?\n\n*Be prepared to\
    \ explain your ideas to the class.*\n\n## Lesson 1 Quiz\n\n### Form A\n\n- 1.\
    \ Consider the graph of the polynomial function shown below.\n\n  ![](img/524030daad8f78e8d291a7f96ed9b8cb_15_0.png)\n\
