    a general equation for a function based on parameters, then view changes in its
    graph as the parameters are changed.


    | Calculator Commands | Expected Display |

    |---|---|

    | **Begin the application:**<br>`APPS`, highlight **Transfrm**, `ENTER` | Calculator
