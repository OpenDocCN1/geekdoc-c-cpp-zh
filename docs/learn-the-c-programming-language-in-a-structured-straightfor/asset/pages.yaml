  md: "# 21.6 Static Storage Duration\n\nWhen an object declaration is prepended with\
    \ a static specifier, it means the storage for a static object is allocated when\
    \ the program starts and deallocated when the program ends. There is only one\
    \ instance of such objects, and (with a few exceptions) their lifetime ends when\
    \ a program ends. They are objects we can access at any given time during the\
    \ execution of a program. We will talk about static specifier and static initialization\
    \ later in the book.\n\n# 21.7 Operators new and delete\n\nWe can dynamically\
    \ allocate storage for our object and have pointers point to this newly allocated\
    \ memory.\n\nThe operator new allocates space for an object. The object is allocated\
    \ on the free-store, often called heap or heap memory. The allocated memory must\
    \ be deallocated using operator delete. It deallocates the memory previously allocated\
    \ memory with an operator new. Example:\n\n```\n#include <iostream>\n\nint main(){\n\
    \    int* p = new int;\n    *p = 123;\n    std::cout << \"The pointed-to-value\
    \ is: \" << *p;\n    delete p;\n}\n```\n\nThis example allocates space for one\
    \ integer on the free-store. Pointer p now points to the newly allocated memory\
    \ for our integer. We can now assign a value to our newly allocated integer object\
    \ by dereferencing a pointer. Finally, we free the memory by calling the operator\
    \ delete."
