  md: "# CHAPTER 37\n\n# Input/Output Streams\n\nWe can convert the objects to streams\
    \ of bytes. We can also convert streams of bytes back to objects. The I/O stream\
    \ library provides such functionality.\n\nStreams can be output streams and input\
    \ streams.\n\nRemember the std::cout and std::cin? Those are also streams. For\
    \ example, the std::cout is an output stream. It takes whatever objects we supply\
    \ to it and converts them to a byte stream, Conversely, std::cin is an input stream.\
    \ It takes the input from the keyboard and converts that input to our objects.\n\
    \nThere are different kinds of I/O streams, and here we will explain two kinds:\
    \ file streams and string streams.\n\n# 37.1 File Streams\n\nWe can read from\
    \ a file, and we can write to a file. The standard-library offers such functionality\
    \ via file streams. Those file streams are defined inside the <fstream> header,\
    \ and they are:\n\n+   - std::ifstream - read from a file\n\n+   - std::ofstream\
    \ - write to a file\n\n+   - std::fstream - read from and write to a file\n\n\
    The std::fstream can both read from and write to a file, so let us use that one.\
    \ To create an std::fstream object we use:\n\n```\n#include <fstream>\n```\n\n\
    ```\nint main()\n{\n    std::fstream fs{ \"myfile.txt\" };\n}\n```"
