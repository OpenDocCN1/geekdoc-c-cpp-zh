  md: "# CHAPTER 40 C++ STANDARDS\n\nThe =default specifier, when used on a member\
    \ function, means: whatever the language rules, I want this default member function\
    \ to be there. I do not want it to be implicitly disabled.\n\nSimilarly, if we\
    \ want to disable a member function from appearing, we use the =delete specifier.\
    \ To disable the copy constructor and copy assignment, we would write:\n\n```\n\
    #include <iostream>\n\nclass MyClass {\npublic:\n    MyClass()\n    {\n      \
    \  std::cout << \"Default constructor invoked.\";\n    }\n    MyClass(const MyClass&\
    \ other) = delete; // delete the copy constructor\n    MyClass& operator=(const\
    \ MyClass& other) = delete; // delete the copy // assignment operator\n};\n\n\
    int main() {\n    MyClass o; // OK\n    MyClass o2 = o; // Error, a call to deleted\
    \ copy constructor\n    MyClass o3;\n    o3 = o; // Error, a call to deleted copy\
    \ assignment operator\n}\n```\n\nThese specifies are mostly used in situations\
    \ where we want to:\n\n+   a. force or the instantiation of implicitly defined\
    \ member functions such as constructors and assignment operators, when we use\
    \ the =default; expression\nb. disable the instantiation of implicitly defined\
    \ member functions using the =delete; expression\n\nThese expressions can also\
    \ be used on other functions as well."
