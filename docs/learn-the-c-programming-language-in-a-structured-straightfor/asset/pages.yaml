  md: "# CHAPTER 40 C++ STANDARDS\n\nWe can also have multiple threads executing code\
    \ from the same function\nconcurrently:\n\n```\n#include <iostream>\n#include\
    \ <thread>\n#include <string>\n\nvoid myFunction(const std::string& param)\n{\n\
    \    for (int i = 0; i < 10; i++)\n    {\n        std::cout << \"Executing function\
    \ from a \" << param << '\\n';\n    }\n}\n\nint main()\n{\n    std::thread t1(myfunction,\
    \ \"Thread 1\");\n    std::thread t2(myfunction, \"Thread 2\");\n\n    t1.join();\n\
    \    t2.join();\n```\n\nThreads sometimes need to access the same object. In our\
    \ example, both threads are accessing the global std::cout object in order to\
    \ output the data. This can be a problem. Accessing the std::cout object from\
    \ two different threads at the same time allows one to write a little to it, then\
    \ another thread jumps in and writes a little to it, and we can end up with some\
    \ strange text in the console\nExecuti.Executingngfunction1.Executingfunction2.\n\
    \nThis means we need to synchronize the access to a shared std::cout object somehow.\
    \ While one thread is writing to it, we need to ensure that the thread does not\
    \ write to it.\n\nWe do so by locking and unlocking mutex-es. A mutex is represented\
    \ by std::mutex class template from a <mutex>-header. A mutex is a way to synchronize\
    \ access to shared objects between multiple threads. A thread owns a mutex once\
    \ it locks the mutex, then performs access to shared data and unlocks the mutex\
    \ when access to shared data is no longer needed. This ensures only one thread\
    \ at the time can have access to a shared object, which is std::cout in our case."
