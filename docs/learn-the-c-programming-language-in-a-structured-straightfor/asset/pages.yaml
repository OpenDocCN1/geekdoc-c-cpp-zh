  md: "# CHAPTER 21\n\n# Scope and Lifetime\n\nWhen we declare a variable, its name\
    \ is valid only inside some sections of the source code. And that section (part,\
    \ portion, region) of the source code is called scope. It is the region of code\
    \ in which the name can be accessed. There are different scopes:\n\n# 21.1 Local\
    \ Scope\n\nWhen we declare a name inside a function, that name has a local scope.\
    \ Its scope starts from the point of declaration till the end of the function\
    \ block marked with {}.\nExample:\n\n```\nvoid myfunction()\n{\n    int x = 123;\
    \ // Here begins the x's scope\n} // and here it ends\n```\n\nOur variable x is\
    \ declared inside a myfunction() body, and it has a local scope. We say that name\
    \ x is local to myfunction(). It exists (can be accessed) only inside the function's\
    \ scope and nowhere else.\n\n# 21.2 Block Scope\n\nThe block-scope is a section\
    \ of code marked by a block of code starting with { and ending with }.\\ Example:\n\
    \n```\nint main()\n{\n    int x = 123; // first x' scope begins here\n```"
