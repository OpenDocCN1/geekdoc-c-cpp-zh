    \ adaptor containing odd numbers greater than two. We create this view by combining\
    \ two different range views into one.\nAnother ranges adaptors are algorithms.\
    \ The idea is to have the algorithms overload for ranges. To call an algorithm\
    \ adaptor we use: std::ranges::algorithm_name(parameters). Example using the std::ranges::reverse()\
    \ algorithm:\n\n```\n#include <iostream>\n#include <ranges>\n#include <vector>\n\
    #include <algorithm>\n```\n\n```\nint main()\n{\n    std::vector<int> v = { 1,\
    \ 2, 3, 4, 5 };\n    std::ranges::reverse(v);\n    for (auto el : v)\n    {\n\
    \        std::cout << el << '\\n';\n    }\n}\n```\n\nUnlike views, the ranges\
    \ algorithms modify the actual vector content."
