  md: "# CHAPTER 28 TEMPLATES\n\nTo instantiate a function template, we call a function\
    \ by supplying a specific type name, surrounded by angle brackets:\n\n```\n#include\
    \ <iostream>\n\ntemplate <typename T>\nvoid myfunction(T param)\n{\n    std::cout\
    \ << \"The value of a parameter is: \" << param;\n}\n\nint main()\n{\n    myfunction<int>(123);\n\
    \    function<double>(123.456);\n    function<char>('A');\n}\n```\n\nWe think\
    \ of T as a placeholder for a specific type, the one we supply when we instantiate\
    \ a template. So, in place of T, we now put our specific type. Neat, ha? This\
    \ way, we can utilize the same code for different types.\n\nTemplates can have\
    \ more than one parameter. We simply list the template parameters and separate\
    \ them using comma. Example of a function template that accepts two template parameters:\n\
    \n```\n#include <iostream>\n\ntemplate <typename T, typename U>\nvoid myfunction(T\
    \ t, U u)\n{\n    std::cout << \"The first parameter is: \" << t << '\\n';\n \
    \   std::cout << \"The second parameter is: \" << u << '\\n';\n}\n\nint main()\n\
    {\n    int x = 123;\n    double d = 456.789;\n    myfunction<int, double>(x, d);\n\
    }\n```"
