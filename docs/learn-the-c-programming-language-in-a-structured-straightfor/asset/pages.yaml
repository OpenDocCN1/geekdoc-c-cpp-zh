  md: "# 40.2.1 Binary Literals\n\nValues are represented by literals. So far, we\
    \ have mentioned three different kinds of binary literals: decimal, hexadecimal,\
    \ and octal as in the example below:\n\n```\nint main()\n{\n    int x = 10;\n\
    \    int y = 0xA;\n    int z = 0112;\n}\n```\n\nThese three variables have the\
    \ same value of 10, represented by different number literals. C++14 standard introduces\
    \ the fourth kind of integral literals called binary literals. Using binary literals,\
    \ we can represent the value in its binary form. The literal has a 0b prefix,\
    \ followed by a sequence of ones and zeros representing a value. To represent\
    \ the number 10 as a binary literal, we write:\n\n```\nint main()\n{\n    int\
    \ x = 0b101010;\n}\n```\n\nThe famous number 42 in binary form would be:\n\n```\n\
    int main()\n{\n    int x = 0b101010;\n}\n```\n\n> **Important to remember** Values\
    \ are values; they are some sequence of bits and bytes in memory. What can be\
    \ different is the value representation. There are decimal, hexadecimal, octal,\
    \ and binary representations of the value. These different forms of the same thing\
    \ can be relevant to us humans. To a machine, it is all bits and bytes, transistors,\
    \ and electrical current."
