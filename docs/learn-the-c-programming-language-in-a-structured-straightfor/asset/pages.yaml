  md: "# CHAPTER 28\n\n# # Templates\n\nTemplates are mechanisms to support the so-called\
    \ generic programming. Generic broadly means we can define a function or a class\
    \ without worrying about what types it accepts.\n\nWe define those functions and\
    \ classes using some generic type. And when we instantiate them, we use a concrete\
    \ type. So, we can use templates when we want to define a class or a function\
    \ that can accept almost any type.\n\nWe define a template by typing:\n\n```\n\
    template <typename T>\n// the rest of our function or class code\n```\n\nWhich\
    \ is the same as if we used:\n\n```\ntemplate <class T>\n// the rest of our function\
    \ or class code\n```\n\nThere stands for a type name. Which type? Well, any type.\
    \ Here T means, for all types T. Let us create a function that can accept any\
    \ type of argument:\n\n```\n#include <iostream>\n\ntemplate <typename T>\nvoid\
    \ myfunction(T param)\n{\n    std::cout << \"The value of a parameter is: \" <<\
    \ param;\n}\n\nint main()\n{\n}\n```"
