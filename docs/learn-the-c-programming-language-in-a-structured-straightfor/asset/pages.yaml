  md: "```\nint main()\n{\n    std::thread t1{function1 }; // create and start a thread\n\
    \    t1.join(); // wait for the t1 thread to finish\n}\n```\n\nHere we defined\
    \ a thread called t1 that executes a function function1. We supply the function\
    \ name to the std::thread constructor as a first parameter. In a way, our program\
    \ now has a main thread, which is the main() function itself, and the t1 thread,\
    \ which was created from the main thread. The .join() member function says: \"\
    hey, main thread, please wait for me to finish my work before continuing yours.\"\
    \ If we left out the join() function, the main thread would finish executing before\
    \ the t1 thread has finished its work. We avoid this by joining the child thread\
    \ to the main thread.\n\nIf our function accepts parameters, we can pass those\
    \ parameters when constructing the std::thread object:\n\n```\n#include <iostream>\n\
    #include <thread>\n#include <string>\n```\n\n```\nvoid function1(const std::string&\
