  md: "# CHAPTER 40 C++ STANDARDS\n\n# 40.1.13 Introduction to Concurrency\n\nC++11\
    \ standard introduces facilities for working with threads. To enable threading,\
    \ we need to add the -threads flag when compiling with g++ and clang on the command\
    \ line. Example:\n\n```\ng++ -std=c++11 -Wall -pthread source.cpp\n```\n\nWith\
    \ clang it will:\n\n```\nclang++ -std=c++11 -Wall -pthread source.cpp\n```\n\n\
    When we compile and link our source code program, an executable file is produced.\
    \ When we start the executable, the program gets loaded into memory and starts\
    \ running. This running program is called a process. When we start multiple executable\
    \ files, we can have multiple processes. Each process has its memory, its own\
    \ address space. Within a process, there can be multiple threads. What are the\
    \ threads? Threads of execution are an OS mechanism that allows us to execute\
    \ multiple pieces of code concurrently/simultaneously.\n\nFor example, we can\
    \ execute multiple functions concurrently using threads. In a broader sense, concurrently\
    \ can also mean in parallel. A thread is part of the process. A process can spawn\
    \ one or more threads. Threads share the same memory and thus can communicate\
    \ with each other using this shared memory.\n\nTo create a thread object, we use\
    \ the std::thread class template from a <thread> header file. Once defined, the\
    \ thread starts executing. To create a thread that executes a code inside a function,\
    \ we supply the function name to the thread constructor as a parameter. Example:\n\
    \n```\n#include <iostream>\n#include <thread>\n```\n\n```\nvoid function1()\n\
    {\n    for (int i = 0; i < 10; i++)\n    {\n        std::cout << \"Executing function1.\"\
    \ << '\\n';\n    }\n}\n```"
