  md: "# 40.4.6 Coroutines\n\nA coroutine is a function that can be suspended and\
    \ be resumed. The ordinary function is a coroutine if it uses any of the following\
    \ operators in its function body:\n\n+   - co_await - suspends the execution of\
    \ the coroutine until some other computation is performed, that is until the coroutine\
    \ resumes\n- co_yield - suspends a coroutine and return a value to the caller\n\
    - co_return - returns from a coroutine and stops its execution\n\n# 40.4.7 std::span\n\
    \nSome containers and types store their elements in a sequence, one next to the\
    \ other. This is the case for arrays and vectors. We can represent such containers\
    \ with a pointer to their first element plus the length of the container. A std::span\
    \ class template from a <span></span>-header is just that. A reference to a span\
    \ of contiguous container elements. One reason to use std::span, is that it is\
    \ cheap to construct and copy. Span does not own a vector or an array references.\
    \ However, it can change the value of the elements. To create a span from a vector\
    \ we use:\n\n```\n#include <iostream>\n#include <vector>\n#include <span>\n\n\
    int main()\n{\n    std::vector<int> v = { 1, 2, 3 };\n    std::span<int> myintspan\
    \ = v;\n    myintspan[2] = 256;\n\n    for (auto el : v) {\n        std::cout\
    \ << el << '\\n';\n    }\n}\n```"
  merge: -1
