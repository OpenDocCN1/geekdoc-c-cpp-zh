  md: "# CHAPTER 35 SMART POINTERS\n\npointer is for. Multiple pointers pointing to\
    \ a single object, and when all of them get out of scope, the object gets destroyed.\n\
    \nShared pointer is defined as std::shared_ptr<some_type>. It can be initialized\
    \ using the std::make_shared<some_type>(some_value) function. Shared pointers\
    \ can be copied. To have three smart pointers pointing at the same object we can\
    \ write:\n\n```\n#include <iostream>\n#include <memory>\n\nint main() {\n    std::shared_ptr<int>\
    \ p1 = std::make_shared<int>(123);\n    std::shared_ptr<int> p2 = p1;\n    std::shared_ptr<int>\
    \ p3 = p1;\n}\n```\n\nWhen all pointers get out of scope, the pointed-to-object\
    \ gets destroyed, and the memory for it gets deallocated.\n\nThe main differences\
    \ between unique and shared pointers are:\n\n+   - With unique pointers, we have\
    \ one pointer pointing at and owning a single object, whereas with shared pointers\
    \ we have multiple pointers pointing at and owning a single object.\n- Unique\
    \ pointers can not be copied, whereas shared pointers can.\n\nIf you wonder which\
    \ one to use, let us say that 90% of the time, you will be using the unique_ptr.\
    \ Shared pointers can be used to represent data structures such as graphs.\n\n\
    Smart pointers are class templates themselves, meaning they have member functions.\
    \ We will just briefly mention they can also accept custom deleters, a code that\
    \ gets executed when they get out of scope.\n\nNotice that with smart pointers,\
    \ we do not need to specify the <some_type>*, we just need to specify the <some_type>.\n\
    \nImportant!\n\nPrefer smart pointers to raw pointers. Smart pointers, we do not\
    \ have to worry if we properly matched calls to new with calls to delete as we\
    \ do not need them. We let the smart pointer do all the heavy lifting."
