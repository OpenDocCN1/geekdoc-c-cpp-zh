  md: "# CHAPTER 7 OPERATORS\n\n# 7.4 Increment/Decrement Operators\n\nIncrement/decrement\
    \ operators increment/decrement the value of the object. The operators are:\n\n\
    +   +x // pre-increment operator\nx++ // post-increment operator\n--x // pre-decrement\
    \ operator\nx-- // post-decrement operator\n\nA simple example:\n\n```\n#include\
    \ <iostream>\n\nint main() {\n    int x = 123;\n    x++; // add 1 to the value\
    \ of x\n    ++++; // add 1 to the value of x\n    ----; // decrement the value\
    \ of x by 1\n    x--; // decrement the value of x by 1\n    std::cout << \"The\
    \ value of x is: \" << x;\n}\n```\n\nBoth pre-increment and post-increment operators\
    \ add 1 to the value of our object, and both pre-decrement and post-decrement\
    \ operators subtract one from the value of our object. The difference between\
    \ the two, apart from the implementation mechanism (very broadly speaking), is\
    \ that with the pre-increment operator, a value of 1 is added first. Then the\
    \ object is evaluated/accessed in expression. With the post-increment, the object\
    \ is evaluated/accessed first, and after that, the value of 1 is added. To the\
    \ next statement that follows, it does not make a difference. The value of the\
    \ object is the same, no matter what version of the operator was used. The only\
    \ difference is the timing in the expression where it is used."
