  md: '# CHAPTER 1


    # # Introduction


    Dear Reader,


    Congratulations on choosing to learn the C++ programming language, and thank you
    for picking up this book. My name is Slobodan Dmitrović, I am a software developer
    and a technical writer, and I will try to introduce you to a beautiful world of
    C++ to the best of my abilities.


    This book is an effort to introduce the reader to a C++ programming language in
    a structured, straightforward, and friendly manner. We will use the “just enough
    theory and plenty of examples” approach whenever possible.


    To me, C++ is a wonderful product of the human intellect. Over the years, I have
    certainly come to think of it as a thing of beauty and elegance. C++ is a language
    like no other, surprising in its complexity, yet wonderfully sleek and elegant
    in so many ways. It is also a language that cannot be learned by guessing, one
    that is easy to get wrong and challenging to get right.


    In this book, we will get familiar with the language basics first. Then, we will
    move onto standard-library. Once we got these covered, we will describe the modern
    C++ standards in more detail.


    After each section, there are source code exercises to help us adopt the learned
    material more efficiently. Let us get started!'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# CHAPTER 2


    # # What is C++?


    C++ is a programming language. A standardized, general-purpose, object-oriented,
    compiled language. C++ is accompanied by a set of functions and containers called
    the C++ Standard-Library. Bjarne Stroustrup created C++ as an extension to a C
    programming language. Still, C++ evolved to be a completely different programming
    language.


    Let us emphasize this: C and C++ are two different languages. C++ started as "C
    with classes; but it is now a completely different language. C++ is not C; C++
    is not C with classes; and there is no such thing as a C/C++ programming language.


    C++ is widely used for the so-called systems programming as well as application
    programming. C++ is a language that allows us to get down to the metal where we
    can perform low-level routines if needed, or soar high with abstraction mechanisms
    such as templates and classes.


    # ## 2.1 C++ Standards


    C++ is governed by the ISO C++ standard. There are multiple ISO C++ standards
    listed here in chronological order: C++03, C++11, C++14, C++17, and the upcoming
    C++20 standard.


    Every C++ standard starting with the C++11 onwards is referred to as "Modern C++."
    And Modern C++ is what we will be teaching in this book.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# CHAPTER 3


    # C++ Compilers


    C++ programs are usually a collection of C++ code spread across one or multiple
    source files. The C++ compiler compiles these files and turns them into object
    files. Object files are linked together by a linker to create an executable file
    or a library. At the time of the writing, some of the more popular C++ compilers
    are:


    +   - The g++ frontend (as part of the GCC)

    - Visual C++ (as part of the Visual Studio IDE)

    - Clang (as part of the LLVM)


    # 3.1 Installing C++ Compilers


    The following sections explain how to install C++ compilers on Linux and Windows
    and how to compile and run our C++ programs.


    # 3.1.1 On Linux


    To install a C++ compiler on Linux, type the following inside the terminal:


    ```

    sudo apt-get install build-essential

    ```


    To compile the C++ source file source.cpp, we type:


    ```

    g++ source.cpp

    ```


    This command will produce an executable with the default name of a.out. To run
    the executable file, type:


    ```

    ./a.out

    ```'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# CHAPTER 3 C++ COMPILERS


    To compile for a C++11 standard, we add the -std=c++11 flag:


    ```

    g++ -std=c++11 source.cpp

    ```


    To enable warnings, we add the -Wall flag:


    ```

    g++ -std=c++11 -Wall source.cpp

    ```


    To produce a custom executable name, we add the -o flag followed by an executable
    name:


    ```

    g++ -std=c++11 -Wall source.cpp -o myexe

    ```


    The same rules apply to the Clang compiler. Substitute g++ with clang++.


    # 3.1.2 On Windows


    On Windows, we can install a free copy of Visual Studio.


    Choose Create a new project, make sure the C++ language option is selected, and
    choose - Empty Project - click Next and click Create. Go to the Solution Explorer
    panel, right-click on the project name, choose Add - New Item - C++ File (.cpp),
    type the name of a file (source.cpp), and click Add. Press F5 to run the program.


    We can also do the following: choose Create a new project, make sure the C++ language
    option is selected, and choose - Console App - click Next and click Create.


    If a Create a new project button is not visible, choose File - New - Project and
    repeat the remaining steps.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# CHAPTER 4


    # Our First Program


    Let us create a blank text file using the text editor or C++ IDE of our choice
    and name it source.cpp. First, let us create an empty C++ program that does nothing.
    The content of the source.cpp file is:


    ```

    int main() {

    ```


    The function main is the main program entry point, the start of our program. When
    we run our executable, the code inside the main function body gets executed. A
    function is of type int (and returns a result to the system, but let us not worry
    about that just yet). The reserved name main is a function name. It is followed
    by a list of parameters inside the parentheses () followed by a function body
    marked with braces {}. Braces marking the beginning and the end of a function
    body can also be on separate lines:


    ```

    int main()

    {}

    ```


    This simple program does nothing, it has no parameters listed inside parentheses,
    and there are no statements inside the function body. It is essential to understand
    that this is the main program signature.


    There is also another main function signature accepting two different parameters
    used for manipulating the command line arguments. For now, we will only use the
    first form.'
  merge: -1
  pgno: 17
- img_proc: true
  md: "# CHAPTER 4 OUR FIRST PROGRAM\n\n# 4.1 Comments\n\nSingle line comments in\
    \ C++ start with double slashes // and the compiler ignores them. We use them\
    \ to comment or document the code or use them as notes:\n\n```\nint main()\n{\n\
    \    // this is a comment\n}\n```\n\nWe can have multiple single-line comments:\n\
    \n```\nint main()\n{\n    // this is a comment\n    // this is another comment\n\
    }\n```\n\nMulti-line comments start with the /* and end with the */. They are\
    \ also known as C-style comments. Example:\n\n```\nint main()\n{\n    /* This\
    \ is a\n       multi-line comment **/\n}\n```\n\n# 4.2 Hello World Example\n\n\
    Now we are ready to get the first glimpse at our “Hello World” example. The following\
    \ program is the simplest “Hello World” example. It prints out Hello World. in\
    \ the console window:\n\n```\n#include <iostream>\nint main()\n{\n    std::cout\
    \ << \"Hello World.\";\n}\n```"
  merge: -1
  pgno: 18
- img_proc: true
  md: "# CHAPTER 4 OUR FIRST PROGRAM\n\nBelieve it or not, the detailed analysis and\
    \ explanation of this example is 15 pages long. We can go into it right now, but\
    \ we will no be wiser at this point as we first need to know what headers, streams,\
    \ objects, operators, and string literals are. Do not worry. We will get there.\n\
    \nA brief(ish) explanation\n\nThe #include <iostream> statement includes the iostream\
    \ header into our source file via the #include directive. The iostream header\
    \ is part of the standard library. We need its inclusion to use the std::cout\
    \ object, also known as a standard-output stream. The << operator inserts our\
    \ Hello World literal into that output stream. String literal is enclosed in double\
    \ quotes \"\". The ; marks the end of the statement. Statements are pieces of\
    \ the C++program that executed. Statements end with semicolon ; in C++. The std\
    \ is the standard-library namespace and :: is the scope resolution operator. Object\
    \ cout is inside the std namespace, and to access it, we need to prepend the call\
    \ with the std::. We will get more familiar with all of these later in the book,\
