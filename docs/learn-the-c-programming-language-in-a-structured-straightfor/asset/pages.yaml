  md: '# CHAPTER 21 SCOPE AND LIFETIME


    ```

    {

    int x = 456; // redefinition of x, second x'' scope begins here

    } // block ends, second x'' scope ends here

    // the first x resumes here

    }

    ```


    There are other scopes as well, which we will cover later in the book. It is important
    to introduce the notion of scope at this point to explain the object''s lifetime.


    # 21.3 Lifetime


    The lifetime of an object is the time an object spends in memory. The lifetime
    is determined by a so-called storage duration. There are different kinds of storage
    durations.


    # 21.4 Automatic Storage Duration


    The automatic storage duration is a duration where memory for an object is automatically
    allocated at the beginning of a block and deallocated when the code block ends.
    This is also called a stack memory; objects are allocated on the stack. In this
    case, the object''s lifetime is determined by its scope. All local objects have
    this storage duration.


    # 21.5 Dynamic Storage Duration


    The dynamic storage duration is a duration where memory for an object is manually
    allocated and manually deallocated. This kind of storage is often referred to
    heap memory. The user determines when the memory for an object will be allocated,
    and when it will be released. The lifetime of an object is not determined by a
    scope in which the object was defined. We do it through operator new and smart
    pointers. In modern C++, we should prefer the smart pointer facilities to operator
    new.'
