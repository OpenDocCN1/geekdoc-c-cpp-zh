  md: "# CHAPTER 23 CLASSES - INTRODUCTION\n\nIf a user does not provide a move constructor,\
    \ the compiler provides an implicitly\ngerated default move constructor.\n\nLet\
    \ us specify our own, user-defined move constructor:\n\n```\n#include <iostream>\n\
    #include <string>\n\nclass MyClass\n{\nprivate:\n    int x;\n    std::string s;\n\
    public:\n    MyClass(int xx, std::string ss) // user provided constructor\n  \
    \      : x{xx}, s{ss }\n    {}\n    MyClass(MyClass&& rhs) // move constructor\n\
    \        :\n        x{std::move(rhs.x)}, s{std::move(rhs.s)}\n        {\n    \
    \        std::cout << \"Move constructor invoked.\" << '\\n';\n        }\n};\n\
    int main()\n{\n    MyClass o1{1, \"Some string value\"};\n    MyClass o2 = std::move(o1);\n\
    }\n```\n\nThis example defines a class with two data members and two constructors.\
