  md: "When smaller integer types such as char or short are used in arithmetic operations,\
    \ they get promoted/converted to integers. This is referred to as integral promotion.\
    \ For example, if we use two chars in an arithmetic operation, both get converted\
    \ to an integer, and the whole expression is of type int. This conversion happens\
    \ only inside the arithmetic expression:\n\n```\nint main()\n{\n    char c1 =\
    \ 10;\n    char c2 = 20;\n\n    auto result = c1 + c2; // result is of type int\n\
    }\n```\n\nAny built-in type can be converted to boolean. For objects of those\
    \ types, any value other than 0, gets converted to a boolean value of true, and\
    \ values equal to 0, implicitly convert to a value of false. Example:\n\n```\n\
    int main()\n{\n    char mychar = 64;\n    int myint = 0;\n    double mydouble\
    \ = 3.14;\n    bool myboolean = true;\n\n    myboolean = mychar; // true\n   \
    \ myboolean = myint; // false\n    myboolean = mydouble; // true\n}\n```\n\nConversely,\
    \ a boolean type can be converted to int. The value of true converts to integer\
    \ value 1 and the value of false converts to integer value of 0.\n\nA pointer\
    \ of any type can be converted to void* type. An example where we convert an integer\
    \ pointer to void pointer:\n\n```\nint main()\n{\n    int x = 123;\n    int* pint\
