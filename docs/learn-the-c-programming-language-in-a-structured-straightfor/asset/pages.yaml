  md: "# CHAPTER 35\n\n# Smart Pointers\n\nSmart pointers are pointers that own the\
    \ object they point to and automatically destroy the object they point to and\
    \ deallocate the memory once the pointers go out of scope. This way, we do not\
    \ have to manually delete the object like it was the case with the new and delete\
    \ operators.\n\nSmart pointers are declared in the <memory> header. We will cover\
    \ the following smart pointers - unique and shared.\n\n# 35.1 Unique Pointer\n\
    \nA unique pointer called std::unique_ptr is a pointer that owns an object it\
    \ points to. The pointer cannot be copied. Unique pointer deletes the object and\
    \ deallocates memory for it, once it goes out of scope. To declare a unique pointer\
    \ to a simple int object, we write:\n\n```\n#include <iostream>\n#include <memory>\n\
    \nint main()\n{\n    std::unique_ptr<int> p(new int{ 123 }});\n    std::cout <<\
    \ *p;\n}\n```\n\nThis example creates a pointer to an object of type int and assigns\
    \ a value of 123 to the object. A unique pointer can be dereferenced in the same\
    \ way we as a regular pointer using the *p notation. The object gets deleted once\
    \ p goes out of scope, which in this case, is at the closing brace }. No explicit\
    \ use of delete operator is required."
  merge: -1
  pgno: 185
- img_proc: true
  md: "# CHAPTER 35 SMART POINTERS\n\nA better way to initialize a unique pointer\
    \ is through an std::make_unique<some_type>(some_value) function, where we specify\
    \ the type for the object in angle brackets and the value for the object pointer\
    \ points in parentheses:\n\n```\n#include <iostream>\n#include <memory>\n\nint\
    \ main() {\n    std::unique_ptr<int> p = std::make_unique<int>(123);\n    std::cout\
    \ << *p;\n}\n```\n\nThe std::make_unique function was introduced in the C++14\
    \ standard. Make sure to compile with the -std=c++14 flag to be able to use this\
    \ function.\n\nWe can create a unique pointer that points to an object of a class\
    \ and then use its -> operator to access iostream members:\n\n```\n#include <iostream>\n\
    #include <memory>\n\nclass MyClass {\npublic:\n    void printmessage() {\n   \
    \     std::cout << \"Hello from a class.\";\n    }\n};\n\nint main() {\n    std::unique_ptr<MyClass>\
    \ p = std::make_unique<MyClass>();\n    p->printmessage();\n}\n```\n\nThe object\
    \ gets destroyed once p goes out of scope. So, prefer a unique pointer to raw\
    \ pointer and their new-delete mechanism. Once p goes out of scope, the pointed-to\
    \ object of a class gets destroyed."
