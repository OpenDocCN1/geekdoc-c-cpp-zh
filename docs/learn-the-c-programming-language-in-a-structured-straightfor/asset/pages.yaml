  md: "# CHAPTER 29 ENUMERATIONS\n\nEach enumerator has a value of underlying type.\
    \ We can change those:\n\n```\nenum MyEnum\n{\n    myfirstvalue = 10,\n    mysecondvalue,\n\
    \    mythirdvalue\n};\n```\n\nThese unscoped enums have their enumerators leak\
    \ into an outside scope, the scope in which the enum type itself is defined. Old\
    \ enums are best avoided. Prefer scoped enums to these old-school, unscoped enums.\
    \ Scoped enums do not leak their enumerators into into an outer scope and are\
    \ not implicitly convertible to other types. To define a scoped enum, we write:\n\
    \n```\nenum class MyEnum\n{\n    myfirstvalue,\n    mysecondvalue,\n    mythirdvalue\n\
    };\n```\n\nTo declare a variable of type enum class (scoped enum) we write:\n\n\
    ```\nenum class MyEnum\n{\n    myfirstvalue,\n    mysecondvalue,\n    mythirdvalue\n\
    };\n```\n\n```\nint main()\n{\n    MyEnum myenum = MyEnum::myfirstvalue;\n};\n\
    ```\n\nTo access an enumerator value, we prepend the enumerator with the enum\
    \ name and a scope resolution operator :: such as MyEnum::myfirstvalue, MyEnum::mysecondvalue,\
    \ etc."
