  md: "Explanation: we have a simple vector with some elements. Then we create a view\
    \ range adaptor on that vector, which filters the numbers in the range. For this,\
    \ we use the pipe operator |. Only the numbers for which the predicate is true\
    \ are included. In our case, this means the even numbers are excluded. We iterate\
    \ over the filtered view and print out the elements.\n\nImportant to note, the\
    \ underlying vector's elements are unaffected as we are operating on a view, not\
    \ on a vector.\n\nLet us create an example which creates a view that returns only\
    \ numbers greater than 2:\n\n```\n#include <iostream>\n#include <ranges>\n#include\
    \ <vector>\n#include <algorithm>\n\nint main()\n{\n    std::vector<int> v = {\
    \ 1, 2, 3, 4, 5 };\n\n    auto greaterthan2view = v | std::views::filter([](int\
    \ x) { return x > 2; });\n    for (auto el : greaterthan2view)\n    {\n      \
    \  std::cout << el << '\\n';\n    }\n}\n```\n\nNow, let us combine the two views\
    \ into one big view by separating them with multiple pipe | operators:\n\n```\n\
    #include <iostream>\n#include <ranges>\n#include <vector>\n#include <algorithm>\n\
    ```"
