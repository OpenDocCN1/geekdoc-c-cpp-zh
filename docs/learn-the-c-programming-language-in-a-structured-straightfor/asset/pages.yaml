  md: "# CHAPTER 40 C++ STANDARDS\n\nHowever, in certain situations, the default constructor\
    \ will not be implicitly generated. For example, when we define a copy constructor\
    \ for our class, the default constructor is implicitly deleted. Example:\n\n```\n\
    #include <iostream>\n\nclass MyClass\n{\npublic:\n    MyClass(const MyClass& other)\n\
    \    {\n        std::cout << \"Copy constructor invoked.\";\n    }\n};\n\nint\
    \ main()\n{\n    MyClass o; // Error, there is no default constructor\n}\n```\n\
    \nTo force the instantiation of a default, compiler-generated constructor, we\
    \ provide the =default specifier in its declaration. Example:\n\n```\n#include\
    \ <iostream>\n\nclass MyClass\n{\npublic:\n    MyClass() = default; // defaulted\
    \ member function\n    MyClass(const MyClass& other)\n    {\n        std::cout\
    \ << \"Copy constructor invoked.\";\n    }\n};\n\nint main()\n{\n    MyClass o;\
    \ // Now OK, the defaulted default constructor is there\n    MyClass o2 = o; //\
    \ Invoking the copy constructor\n}\n```"
