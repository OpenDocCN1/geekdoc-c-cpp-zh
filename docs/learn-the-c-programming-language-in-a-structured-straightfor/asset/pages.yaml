  md: "# CHAPTER 37 INPUT/OUTPUT STREAMS\n\nThis example creates a file stream called\
    \ fs and associates it with a file name myfile.txt on our disk. To read from such\
    \ file, line-by-line, we use:\n\n```\n#include <iostream>\n#include <fstream>\n\
    #include <string>\n\nint main()\n{\n    std::ifstream fs{ \"myfile.txt\" };\n\
    \    std::string s;\n    while (fs) {\n        std::getline(fs, s); // read each\
    \ line into a string\n        std::cout << s << '\\n';\n    }\n}\n```\n\nOnce\
    \ associated with a file name, we use our file stream to read each line of text\
    \ from and print it on a screen. To do that, we declare a string variable which\
    \ will hold our line of text. Inside the while-loop, we read a line from a file\
    \ to a string. This is why the std::getline function accepts a file stream and\
    \ a string as arguments. Once read, we output the text line on a screen. The while\
    \ loop terminates once we reach the end of the file.\n\nTo read from a file, one\
    \ character at the time we can use file stream’s >> operator:\n\n```\n#include\
    \ <iostream>\n#include <fstream>\n\nint main()\n{\n    std::ifstream fs{ \"myfile.txt\"\
    \ };\n    char c;\n    while (fs >> c) {\n        std::cout << c;\n    }\n}\n\
    ```"
