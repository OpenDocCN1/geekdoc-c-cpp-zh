    \ would introduce the entire std namespace into the current scope via the using\
    \ namespace std; statement only to be able to type cout instead of the std::cout.\
    \ While this might save us from typing five additional characters, it is **wrong**\
    \ for many reasons. We do not want to introduce the entire std namespace into\
    \ the current scope because we want to avoid clashes and ambiguity. Good to remember:\
    \ do not introduce the entire std namespace via the current namespace std; statement.\
    \ So, instead of this wrong approach:\n\n```\n#include <iostream>\n\nusing namespace\
    \ std; // do not use this\n\nint main()\n{\n    cout << \"A bad example.\";\n\
    }\n```\n\nuse the following:\n\n```\n#include <iostream>\n\nint main()\n{\n  \
    \  std::cout << \"A good example.\";\n}\n```\n\nFor calls to objects and functions\
    \ that reside inside the std namespace, add the std:: prefix where needed."
