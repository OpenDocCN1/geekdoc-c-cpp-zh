  md: "# 23.6 Destructors\n\nAs we saw earlier, a constructor is a member function\
    \ that gets invoked when the object is initialized. Similarly, a destructor is\
    \ a member function that gets invoked when the object is destroyed. The name of\
    \ the destructor is tilde ~ followed by a class name:\n\n```\nclass MyClass\n\
    {\npublic:\n    MyClass() // constructor\n    ~MyClass() // destructor\n};\n```\n\
    \nDestructor takes no parameters, and there is one destructor per class. Example:\n\
    \n```\n#include <iostream>\nclass MyClass\n{\npublic:\n    MyClass() // constructor\n\
    \    ~MyClass()\n    {\n        std::cout << \"Destructor invoked.\";\n    } //\
    \ destructor\n};\nint main()\n{\n    MyClass o;\n} // destructor invoked here,\
    \ when o gets out of scope\n```\n\nDestructors are called when an object goes\
    \ out of scope or when a pointer to an object is deleted. We should not call the\
    \ destructor directly."
  merge: -1
  pgno: 123
- img_proc: true
  md: "CHAPTER 23 CLASSES - INTRODUCTION\n\nDestructors can be used to clean up the\
    \ taken resources. Example:\n\n```\n#include <iostream>\n\nclass MyClass\n{\n\
    private:\n    int* p;\npublic:\n    MyClass()\n        : p(new int{123}) \n  \
    \  {\n        std::cout << \"Created a pointer in the constructor.\" << '\\n';\n\
    \    }\n    ~MyClass()\n    {\n        delete p;\n        std::cout << \"Deleted\
    \ a pointer in the destructor.\" << '\\n';\n    }\n}\n\nint main()\n{\n    MyClass\
    \ o; // constructor invoked here\n    // destructor invoked memory for a pointer\
    \ in the constructor and deallocate the memory\n```\n\nHere we allocate memory\
    \ for a pointer in the constructor and deallocate the memory in the destructor.\
    \ This style of resource allocation/deallocation is called RAII or Resource Acquisition\
    \ is Initialization. Destructors should not be called directly.\n\n**Important**\
    \ The use of new and delete, as well as the use of raw pointers in Modern C++,\
    \ is **discouraged**. We should use **smart pointers** instead. We will talk about\
    \ them later in the book. Let us do some exercises for the class's introductory\
    \ part."
