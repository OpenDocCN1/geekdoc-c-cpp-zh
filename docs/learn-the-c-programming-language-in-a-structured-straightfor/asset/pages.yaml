  md: "# CHAPTER 14\n\n# Automatic Type Deduction\n\nWe can automatically deduce the\
    \ type of an object using the auto specifier. The auto specifier deduces the type\
    \ of an object based on the object's initializer type.\n\nExample:\n\n```\nauto\
    \ c = 'a';    // char type\n```\n\nThis example deduces c to be of type char as\
    \ the initializer 'a' is of type char. Similarly, we can have:\n\n```\nauto x\
    \ = 123;   // int type\n```\n\nHere, the compiler deduces the x to be of type\
    \ int because an integer literal 123 is of type int.\n\nThe type can also be deduced\
    \ based on the type of expression:\n\n```\nauto d = 123.456 / 789.10;  // double\n\
    ```\n\nThis example deduces d to be of type double as the type of the entire 123.456\
    \ / 789.10 expression is double.\n\nWe can use auto as part of the reference type:\n\
    \n```\nint main()\n{\n    int x = 123;\n    auto& y = x; // y is of int& y\n}\n\
    ```"
