  md: "# 23.4.5 Move Constructor\n\nIn addition to copying, we can also move the data\
    \ from one object to the other. We call it a move semantics. Move semantics is\
    \ achieved through a move constructor and move assignment operator. The object\
    \ from which the data was moved, is left in some valid but unspecified state.\
    \ The move operation is efficient in terms of speed of execution, as we do not\
    \ have to make copies.\n\nMove constructor accepts something called rvalue reference\
    \ as an argument. Every expression can find itself on the left-hand side or the\
    \ right-hand side of the assignment operator. The expressions that can be used\
    \ on the left-hand side are called lvalues, such as variables, function calls,\
    \ class members, etc. The expressions that can be used on the right-hand side\
    \ of an assignment operator are called rvalues, such as literals, and other expressions.\n\
    \nNow the move semantics accepts a reference to that rvalue. The signature of\
    \ an rvalue reference type is T&&, with double reference symbols. So, the signature\
    \ of a move constructor is:\n\n```\nMyClass(MyClass&& rhs)\n```\n\nTo cast something\
    \ to an rvalue reference, we use the std::move function. This function casts the\
    \ object to an rvalue reference. It does not move anything. An example where a\
    \ move constructor is invoked:\n\n```\n#include <iostream>\nclass MyClass { };\n\
    int main() {\n    MyClass o1;\n    MyClass o2 = std::move(o1);\n    std::cout\
    \ << \"Move constructor invoked.\";\n    // or MyClass o2{std::move(o1)};\n}\n\
    ```\n\nIn this example, we define an object of type MyClass called o1. Then we\
    \ initialize the second object o2 by moving everything from object o1 to o2. To\
    \ do that, we need to cast the o2 to rvalue reference with std::move(o1). This,\
    \ in turn, invokes the MyClass move constructor for o2."
  merge: -1
  pgno: 114
