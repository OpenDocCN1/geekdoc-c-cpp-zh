    ```\n\nRanges have a feature called adaptors. One of the range adaptors is views.\
    \ The views adaptors are accessed via std::ranges. Views are not owning. They\
    \ cannot change the values of the underlying elements. It is also said they are\
    \ lazily executed. This means the code from the views adaptors will not be executed\
    \ until we iterate over the result of such views.\n\nLet us create an example\
    \ which uses range views to filter-out even numbers and print only the odd numbers\
    \ from a vector by creating a range view:\n\n```\n#include <iostream>\n#include\
    \ <ranges>\n#include <vector>\n#include <algorithm>\n\nint main()\n{\n    std::vector<int>\
    \ v = { 1, 2, 3, 4, 5 };\n\n    auto oddnumbersview = v | std::views::filter([](int\
    \ x) { return x % 2 == 1; });\n    for (auto el : oddnumbersview)\n    {\n   \
    \     std::cout << el << '\\n';\n    }\n}\n```"
