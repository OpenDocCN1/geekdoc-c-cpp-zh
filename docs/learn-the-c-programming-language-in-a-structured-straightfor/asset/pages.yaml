    C++ standards can be bought, or a draft version can be downloaded for free. These
    drafts closely resemble the final C++ standard. When C++ code can be successfully
    transferred and compiled on different platforms (machines or compilers), and when
    C++ implementation closely follows the standard, we say that the code is often
    referred to as portable C++.


    The standards surrounded by braces represent the so-called “Modern C++.” Each
