  md: "# CHAPTER 27 THE STATIC SPECIFIER\n\nWe can define static class member fields.\
    \ Static class members are not part of the object. They live independently of\
    \ an object of a class. We declare a static member inside the class and define\
    \ it outside the class only once:\n\n```\n#include <iostream>\n\nclass MyClass\
    \ {\npublic:\n    static int x; // declare a static data member\n};\n\nint MyClass::x\
    \ = 123; // define a static data member\n\nint main() {\n    MyClass::x = 456;\
    \ // access the static data member\n    std::cout << \"Static data member value\
    \ is: \" << MyClass::x;\n}\n```\n\nHere we declared a static data member inside\
    \ a class. Then we defined it outside the class. When defining a static member\
    \ outside the class, we do not need to use the static specifier. Then, we access\
    \ the data member by using the MyClass::data_member_name notation.\n\nTo define\
    \ a static member function, we prepend the function declaration with the static\
    \ keyword. The function definition outside the class does not use the static keyword:\n\
    \n```\n#include <iostream>\nclass MyClass {\npublic:\n    static void myfunction();\
    \ // declare a static member function\n}\n```"
