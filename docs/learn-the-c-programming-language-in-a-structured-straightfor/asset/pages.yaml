  md: "# 23.3 Access Specifiers\n\nWouldn't it be convenient if there was a way we\
    \ could disable access to member fields but allow access to member functions for\
    \ our object and other entities accessing our class members? And that is what\
    \ access specifiers are for. They specify access for class members. There are\
    \ three access specifiers/labels: public, protected, and private:\n\n```\nclass\
    \ MyClass{\npublic:\n    // everything in here\n    // has public access level\n\
    protected:\n    // everything in here\n    // has protected access level\nprivate:\n\
    \    // everything in here\n    // has private access level\n}\n```\n\nDefault\
    \ visibility/access specifier for a class is private if none of the access specifiers\
    \ is present:\n\n```\nclass MyClass{\n    // everything in here\n    // has private\
    \ access by default\n}\n```\n\nAnother way to write a class is to write a struct.\
    \ A struct is also a class in which members have public access by default. So,\
    \ a struct is the same as a class but with a public access specifier by default:\n\
    \n```\nstruct MyStruct{\n    // everything in here\n    // is public by default\n\
    }\n```"
