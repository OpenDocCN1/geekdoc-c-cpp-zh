  md: "We can spawn multiple threads in our program/process by constructing multiple\
    \ std::thread objects. An example where we have two threads executing two different\
    \ functions concurrently/simultaneously:\n\n```\n#include <iostream>\n#include\
    \ <thread>\n\nvoid function1()\n{\n    for (int i = 0; i < 10; i++)\n    {\n \
    \       std::cout << \"Executing function1.\" << '\\\\n';\n    }\n}\n\nvoid function2()\n\
    {\n    for (int i = 0; i < 10; i++)\n    {\n        std::cout << \"Executing function2.\"\
    \ << '\\\\n';\n    }\n}\n\nint main()\n{\n    std::thread t1{ function1 };\n \
    \   std::thread t2{ function2 };\n\n    t1.join();\n    t2.join();\n}\n```\n\n\
    This example creates two threads executing two different functions concurrently.\
    \ The function1 code executes in a thread t1, and the function2 code executes\
    \ in a separate thread called t2."
