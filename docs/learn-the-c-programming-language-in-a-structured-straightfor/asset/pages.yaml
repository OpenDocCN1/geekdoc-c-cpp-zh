  md: "# CHAPTER 40 C++ STANDARDS\n\n```\nint main()\n{\n    std::vector<int> v =\
    \ { 1, 2, 3, 4, 5 };\n    auto oddandgreaterthan2 = v | std::views::filter([](int\
    \ x) { return x % 2 == 1; }) \n                               | std::views::filter([](int\
    \ x) { return x > 2; });\n    for (auto el : oddandgreaterthan2)\n    {\n    \
