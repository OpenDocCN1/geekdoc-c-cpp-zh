  md: "# 16.1.4 switch Statement\n\nThe switch statement is similar to having multiple\
    \ if-statements. It checks the value of the condition (which must be integral\
    \ or enum value) and, based on that value, executes the code inside one of a given\
    \ set of case labels. If none of the case statements is equal to the condition,\
    \ the code inside the default label is executed. General syntax:\n\n```\nswitch\
    \ (condition)\n{\n    case value1:\n        statement(s);\n        break;\n  \
    \  case value2etc:\n        statement(s);\n        break;\n    default:\n    \
    \    statement(s);\n        break;\n}\n```\n\nA simple example that checks for\
    \ the value of integer x and executes the appropriate case label:\n\n```\n#include\
    \ <iostream>\n\nint main()\n{\n    int x = 3;\n    switch (x)\n    {\n       \
    \ case 1:\n            std::cout << \"The value of x is 1.\";\n            break;\n\
    \        case 2:\n            std::cout << \"The value of x is 2.\";\n       \
    \     break;\n}\n```"
