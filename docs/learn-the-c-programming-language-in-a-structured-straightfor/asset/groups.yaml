    \ into)`。该函数从标准输入（`std::cin`）读取一行文本到字符串变量（`s`）中。\n\n一条经验法则：如果我们需要使用 `std::string`\
    \ 类型，请显式地包含 `<string>` 头文件。\n\n## 13.6 字符串指针\n\n字符串有一个成员函数 `.c_str()`，它返回一个指向其第一个元素的指针。它也被说返回一个指向我们的字符串所构造的空终止字符数组的指针：\n\
    \n```cpp\n#include <iostream>\n#include <string>\n```\n\n```cpp\nint main()\n\
    {\n    std::string s = \"Hello World.\";\n    std::cout << s.c_str();\n}\n```\n\
    \n该成员函数的类型为 `const char*`，当我们想要将 `std::string` 变量传递给接受 `const char*` 参数的函数时，它是很有用的。\n\
    \n## 13.7 子字符串\n\n要从字符串中创建一个子字符串，我们使用 `.substr()` 成员函数。该函数返回一个从主字符串特定位置开始且具有特定长度的子字符串。函数的签名是：`.substr(starting_position,\
    \ length)`。示例：\n\n```cpp\n#include <iostream>\n#include <string>\n\nint main()\n\
    {\n    std::string s = \"Hello World.\";\n    std::string mysubstring = s.substr(6,\
    \ 5);\n    std::cout << \"The substring value is: \" << mysubstring;\n}\n```\n\
    \n在这个示例中，我们有一个存有 \"Hello World.\" 值的主字符串。然后我们创建了一个只包含 \"World\" 值的子字符串。子字符串从主字符串的第六个字符开始，其长度为五个字符。\n\
    \n## 13.8 查找子字符串\n\n要在字符串中查找子字符串，我们使用 `.find()` 成员函数。它在字符串中搜索子字符串。如果找到了子字符串，该函数返回第一个找到的子字符串的位置。该位置是子字符串在主字符串中开始的字符位置。如果没有找到子字符串，函数返回一个\
    \ `std::string::npos` 值。函数本身的类型是 `std::string::size_type`。\n\n要在 \"This is a Hello\
    \ World string\" 字符串内部查找子字符串 \"Hello\"，我们写：\n\n```cpp\n#include <iostream>\n#include\
    \ <string>\nint main()\n{\n    std::string s = \"This is a Hello World string.\"\
    ;\n    std::string stringtofind = \"Hello\";\n    std::string::size_type found\
    \ = s.find(stringtofind);\n    if (found != std::string::npos)\n    {\n      \
    \  std::cout << \"Substring found at position: \" << found;\n    }\n    else\n\
    \    {\n        std::cout << \"The substring is not found.\";\n    }\n}\n```\n\
    \n在这里我们有一个主字符串和一个想要查找的子字符串。我们将子字符串作为参数提供给 `.find()` 函数。我们将返回值存储在变量 `found` 中。如果该值不等于\
    \ `std::string::npos`，则找到了子字符串。我们打印主字符串中子字符串所在的位置。\n\n# 第 14 章 自动类型推导\n\n我们可以使用\
    \ `auto` 标识符自动推导对象的类型。`auto` 标识符根据对象的初始化类型进行推导。\n\n示例：\n\n```cpp\nauto c = 'a';\
    \ // char type\n```\n\n这个示例推导 `c` 为 `char` 类型，因为初始化值 'a' 是 `char` 类型。同样，我们可以有：\n\
    \n```cpp\nauto x = 123; // int type\n```\n\n在这里，编译器推导 `x` 为 `int` 类型，因为字面量 123\
    \ 是 `int` 类型。\n\n类型也可以根据表达式的类型推导：\n\n```cpp\nauto d = 123.456 / 789.10; // double\n\
    ```\n\n这个示例推导 `d` 为 `double` 类型，因为整个表达式 123.456 / 789.10 是 `double`。\n\n我们可以作为引用类型使用\
    \ `auto`：\n\n```cpp\nint main()\n{\n    int x = 123;\n    auto& y = x; // y is\
    \ int&\n}\n```\n\n或者作为常量类型：\n\n```cpp\nint main()\n{\n    const auto x = 123;\
    \ // x is const int type\n}\n```\n\n当类型（名称）难以手动推导或非常麻烦时，我们使用 *auto* 标识符。\n\n#\
    \ 第 15 章 练习\n\n## 15.1 数组定义\n\n编写一个定义并初始化五个 `double` 数组的程序。修改并打印数组的和最后一个元素。\n\n\
    ```cpp\n#include <iostream>\nint main()\n{\n    double arr[5] = { 1.23, 2.45,\
    \ 8.52, 6.3, 10.15 };\n    arr[0] = 2.56;\n    arr[4] = 3.14;\n    std::cout <<\
    \ \"The first array element is: \" << arr[0] << '\\n';\n    std::cout << \"The\
    \ last array element is: \" << arr[4] << '\\n';\n}\n```\n\n## 15.2 对象的指针\n\n编写一个定义\
    \ `double` 类型对象的程序。定义一个指向该对象的指针。通过解引用指针打印指向对象的值。\n\n```cpp\n#include <iostream>\n\
