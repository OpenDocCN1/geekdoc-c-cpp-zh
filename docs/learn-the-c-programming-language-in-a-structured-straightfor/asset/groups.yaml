    ## 30.6 作用域枚举\n\n编写一个程序，定义一个代表星期几的作用域枚举（scoped enum）。创建该枚举的对象，为其分配一个值，检查该值是否为周一（Monday），如果是，则将对象的值更改另一个枚举值：\n\
