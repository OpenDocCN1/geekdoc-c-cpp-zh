    \ the first name. The second substring is the last name. Print the main string\
    \ and two substrings afterward.\n\n```\n#include <iostream>\n#include <iostream>\n\
    \nint main()\n{\n    std::string fullname = \"John Doe\";\n    std::string firstName\
    \ = fullname.substr(0, 4);\n    std::string lastname = fullname.substr(5, 3);\n\
    \    std::cout << \"The full name is: \" << fullname << \"\\n\";\n    std::cout\
    \ << \"The first name is: \" << firstName << \"\\n\";\n    std::cout << \"The\
    \ last name is: \" << lastname << \"\\n\";n}\n```"
- md: "\nCHAPTER 15 EXERCISES\n\n## 15.7 Finding a single Character\n\nWrite a program\
    \ that defines the main string with a value of “Hello C++ World.” and checks if\
    \ a single character 'C' is found in the main string.\n\n```cpp\n#include <iostream>\n\
    #include <string>\n\nint main()\n{\n    std::string s = \"Hello C++ World.\";\n\
    \    char c = 'C';\n    auto characterfound = s.find(c);\n    if (characterfound\
    \ != std::string::npos) {\n        std::cout << \"Character found at position:\
    \ \" << characterfound << \"\\n\";\n    } else {\n        std::cout << \"Character\
    \ was not found.\" << \"\\n\";\n    }\n}\n```\n\n## 15.8 Finding a Substring\n\
    \nWrite a program that defines the main string with a value of “Hello C++ World.”\
    \ and checks if a substring “C++” is found in the main string.\n\n```cpp\n#include\
    \ <iostream>\n#include <string>\n\nint main()\n{\n    std::string s = \"Hello\
    \ C++ World.\";\n    std::string mysub = \"C++\";\n    auto mysubfound = s.find(mysub);\n\
    if (mysubfound != std::string::npos)\n{\n    std::cout << \"Substring found at\
    \ position: \" << mysubfound << '\\n';\n}\nelse\n{\n    std::cout << \"Substring\
    \ was not found.\" << '\\n';\n}\n```\n\nBoth the 'C' character and the \"C++\"\
    \ substring start at the same position in our main string. That is why both examples\
    \ yield a value of 6.\nInstead of typing the length `std::string::size_type` for\
    \ your `characterfound` and `substringfound` variables, we used the `auto` specifier\
    \ to deduce the type for us automatically.\n\n## 15.9 Automatic Type Deduction\n\
    \nWrite a program that automatically deduces the type for char, int, and double\
    \ objects based on the initializer used. Print out the values afterward.\n\n```cpp\n\
    #include <iostream>\nint main()\n{\n    auto c = 'a';\n    auto x = 123;\n   \
    \ auto d = 3.14;\n\n    std::cout << \"The type of c is deduced as char, the value\
    \ is: \" << c << '\\n';\n    std::cout << \"The type of x is deduced as int, the\
    \ value is: \" << x << '\\n';\n    std::cout << \"The type of d is deduced as\
    \ double, the value is: \" << d << '\\n';\n}\n```\n\n# CHAPTER 16\n\n# Statements\n\
    \nEarlier, we described statements as commands, pieces of code that are executed\
    \ in some order. Expressions ending with a semicolon are statements. C++ language\
    \ comes with some built-in statements. We will start with the selection statements.\n\
    \n## 16.1 Selection Statements\n\nSelection statements allow us to check use conditions,\
    \ and based on that condition, execute the appropriate statements.\n\n### 16.1.1\
    \ if Statement\n\nWhen we want to execute a statement or more statements based\
    \ on some condition, we use the if-statement. if-statement has the format of:\n\
    \n`if (condition) statement`\n\nThe statement executes only if the condition is\
    \ true. Example:\n\n```cpp\n#include <iostream>\nint main()\n{\n    bool b = true;\n\
    \    if (b) std::cout << \"The condition is true.\";\n}\n```\n\nTo execute multiple\
    \ statements if the condition is true, we use the block scope {}:\n\n```cpp\n\
    #include <iostream>\n\nint main()\n{\n    bool b = true;\n    if (b) {\n     \
    \   std::cout << \"This is a first statement.\";\n        std::cout << \"\\nThis\
    \ is a second statement.\";\n    }\n}\n```\n\nAnother form is the if-else statement:\n\
    \n`if (condition) statement else statement`\n\nIf the condition is true, the first\
    \ statement executes, otherwise the second statement after the else keyword executes.\
    \ Example:\n\n```cpp\n#include <iostream>\n\nint main()\n{\n    bool b = false;\n\
    \    if (b) std::cout << \"The condition is true.\";\n    else std::cout << \"\
    The condition is false.\";\n}\n```\n\nTo execute multiple statements in either\
    \ if or else branch, we use brace-enclosed {}:\n\n```cpp\n#include <iostream>\n\
    \nint main()\n{\n    bool b = false;\n    if (b)\n{\n  std::cout << \"The condition\
    \ is true.\";\n  std::cout << \"\\nThis is the second statement.\";\n}\nelse {\n\
    \  std::cout << \"The condition is false.\";\n  std::cout << \"\\nThis is the\
    \ second statement.\";\n}\n```\n\n### 16.1.2 Conditional Expression\n\nA simple\
    \ statement can also be written as a conditional expression. The following is\
    \ a simple if-statement:\n\n```cpp\n#include <iostream>\n\nint main() {\n  bool\
    \ mycondition = true;\n  int x = 0;\n\n  if (mycondition) {\n    x = 1;\n  }\n\
    \  else {\n    x = 0;\n  }\n  std::cout << \"The value of x is: \" << x << \"\\\
    n\";\n}\n```\n\n# CHAPTER 16 STATEMENTS\n\nTo rewrite the previous example using\
    \ a conditional expression, we will write:\n\n```cpp\n#include <iostream>\n\n\
    int main()\n{\n    bool mycondition = true;\n    int x = 0;\n    x = (mycondition)\
    \ ? 1 : 0;\n    std::cout << \"The value of x is: \" << x << \"\\n\";\n}\n```\n\
    \nThe conditional expression is of the following syntax:\n\n`(condition) ? expression_1\
    \ : expression_2`\n\nThe conditional expression uses the unary ? operator, which\
    \ checks the value of the condition. If the condition is true, it returns expression_1.\
    \ If the condition is false, it returns expression_2. It can be thought of as\
    \ a way of replacing a simple if-else-statement with an onliner.\n\n### 16.1.3\
    \ The Logical Operators\n\nThe logical operators perform logical and, or, and\
    \ negation operations on their operands. The first is the && operator, which is\
    \ a logical AND operator. The result of a logical AND condition with two operands\
    \ is true if both operands are true. Example:\n\n```cpp\n#include <iostream>\n\
    \nint main()\n{\n    bool a = true;\n    bool b = true;\n    if (a && b)\n{\n\
    \        std::cout << \"The entire condition is true.\";\n    }\n}\n```\n\nThe\
    \ next operator is ||, which is a logical OR operator. The result of a logical\
    \ OR condition is true if at least one of the operands is true. Example:\n\n```cpp\n\
    #include <iostream>\n\nint main()\n{\n    bool a = true;\n    bool b = false;\n\
    \    if (a || b)\n{\n        std::cout << \"The entire condition is true.\";\n\
    \    }\n}\n```\n\nThe next operator is !, which is a negation operator. It negates\
    \ the value of the operand. Example:\n\n```cpp\n#include <iostream>\n\nint main()\n\
    {\n    bool a = true;\n    if (!a)\n    {\n        std::cout << \"The condition\
    \ is false.\";\n    }\n}\n```\n\n### 16.1.3 Comparison operators\n\nComparison\
    \ operators allow us to compare values. Comparison operators are less than <,\
    \ less equal to <=, greater than >, greater equal to >=, equal to ==, not equal\
    \ to !=\n\nWe can use the equality operator == to check if values are equal:\n\
    \n```cpp\n#include <iostream>\n\nint main()\n{\n    int x = 5;\n    if (x == 5)\n\
    \    {\n        std::cout << \"The value of x is equal to 5.\";\n    }\n}\n```\n\
    \nUse-case for other comparison operators:\n\n```cpp\n#include <iostream>\n\n\
    int main()\n{\n    int x = 10;\n    if (x > 5)\n    {\n        std::cout << \"\
    The value of x is greater than 5.\";\n    }\n}\n```\n\nNow, we can use both logical\
    \ and comparison operators in the same condition:\n\n```cpp\n#include <iostream>\n\
    \nint main()\n{\n    int x = 10;\n    if (x > 5 && x < 15)\n    {\n        std::cout\
    \ << \"The value of x is greater than 5 and less than 15.\";\n    }\n    bool\
    \ b = true;\n    if (x > 5 && b)\n    {\n        std::cout << \"The value of x\
    \ is greater than 5 and b is true.\";\n    }\n}\n```\n\nAny literal, object or\
    \ an expression implicitly convertible to true or false can be used as a condition:\n\
    \n```cpp\n#include <iostream>\n\nint main()\n{\n    if (1) // literal 1 is convertible\
    \ to true\n    {\n        std::cout << \"The condition is true.\";\n    }\n}\n\
    ```\n\nIf we used an integer variable with a value other than 0, the result would\
    \ be true:\n\n```cpp\n#include <iostream>\n\nint main()\n{\n    int x = 10; //\
    \ if x was 0, the condition would be false\n    if (x)\n    {\n        std::cout\
    \ << \"The condition is true.\";\n    }\n    else\n    {\n        std::cout <<\
    \ \"The condition is false.\";\n    }\n}\n```\n\nIt is good practice to use the\
    \ code blocks {} inside the if-statement branches, even if there is only one statement\
    \ to be executed.\n"
  mdcn: "\n第 15 章 练习\n\n## 15.7 查找单个字符\n\n编写一个程序，定义一个值为“Hello C++ World.”的主字符串，并检查主字符串中是否存在单个字符\
    \ 'C'。\n\n```cpp\n#include <iostream>\n#include <string>\n\nint main()\n{\n  \
    \  std::string s = \"Hello C++ World.\";\n    char c = 'C';\n    auto characterfound\
    \ = s.find(c);\n    if (characterfound != std::string::npos) {\n        std::cout\
    \ << \"Character found at position: \" << characterfound << \"\\n\";\n    } else\
    \ {\n        std::cout << \"Character was not found.\" << \"\\n\";\n    }\n}\n\
    ```\n\n## 15.8 查找子字符串\n\n编写一个程序，定义一个值为“Hello C++ World.”的主字符串，并检查主字符串中是否存在子字符串“C++”。\n\
    \n```cpp\n#include <iostream>\n#include <string>\n\nint main()\n{\n    std::string\
    \ s = \"Hello C++ World.\";\n    std::string mysub = \"C++\";\n    auto mysubfound\
    \ = s.find(mysub);\nif (mysubfound != std::string::npos)\n{\n    std::cout <<\
    \ \"Substring found at position: \" << mysubfound << '\\n';\n}\nelse\n{\n    std::cout\
    \ << \"Substring was not found.\" << '\\n';\n}\n```\n\n字符 'C' 和子字符串 \"C++\" 在我们的主字符串中从相同的位置开始。这就是为什么两个示例都返回值\
    \ 6。\n我们没有为变量 `characterfound` 和 `substringfound` 手动输入长度 `std::string::size_type`，而是使用了\
    \ `auto` 标识符自动为我们推导出类型。\n\n## 15.9 自动类型推导\n\n编写一个程序，根据使用的初始化器自动推导 char、int 和 double\
    \ 对象的类型。之后打印这些值。\n\n```cpp\n#include <iostream>\nint main()\n{\n    auto c = 'a';\n\
    \    auto x = 123;\n    auto d = 3.14;\n\n    std::cout << \"The type of c is\
    \ deduced as char, the value is: \" << c << '\\n';\n    std::cout << \"The type\
    \ of x is deduced as int, the value is: \" << x << '\\n';\n    std::cout << \"\
    The type of d is deduced as double, the value is: \" << d << '\\n';\n}\n```\n\n\
    # 第 16 章\n\n# 语句\n\n之前，我们把语句描述为命令，即按某种顺序执行的代码段。以分号结尾的表达式是语句。C++ 语言自带了一些内置语句。我们将从选择语句开始。\n\
    \n## 16.1 选择语句\n\n选择语句允许我们检查使用条件，并根据该条件执行相应的语句。\n\n### 16.1.1 if 语句\n\n当我们想要根据某些条件执行一个或多个条语句时，我们使用\
    \ if 语句。if 语句的格式为：\n\n`if (condition) statement`\n\n只有当条件为真时才会执行该语句。示例：\n\n```cpp\n\
    #include <iostream>\nint main()\n{\n    bool b = true;\n    if (b) std::cout <<\
    \ \"The condition is true.\";\n}\n```\n\n为了在条件为真时执行多条语句，我们使用块作用域 {}：\n\n```cpp\n\
    #include <iostream>\n\nint main()\n{\n    bool b = true;\n    if (b) {\n     \
    \   std::cout << \"This is a first statement.\";\n        std::cout << \"\\nThis\
    \ is a second statement.\";\n    }\n}\n```\n\n另一种形式是 if-else 语句：\n\n`if (condition)\
    \ statement else statement`\n\n如果条件为真，则执行第一条语句，否则执行 else 关键字之后的第二条语句。示例：\n\n```cpp\n\
    #include <iostream>\n\nint main()\n{\n    bool b = false;\n    if (b) std::cout\
    \ << \"The condition is true.\";\n    else std::cout << \"The condition is false.\"\
    ;\n}\n```\n\n为了在 if 或 else 分支中执行多条语句，我们使用大括号包含 {}：\n\n```cpp\n#include <iostream>\n\
    \nint main()\n{\n    bool b = false;\n    if (b)\n{\n  std::cout << \"The condition\
    \ is true.\";\n  std::cout << \"\\nThis is the second statement.\";\n}\nelse {\n\
    \  std::cout << \"The condition is false.\";\n  std::cout << \"\\nThis is the\
    \ second statement.\";\n}\n```\n\n### 16.1.2 条件表达式\n\n一个简单语句也可以写成条件表达式。以下是一个简单的\
    \ if 语句：\n\n```cpp\n#include <iostream>\n\nint main() {\n  bool mycondition =\
    \ true;\n  int x = 0;\n\n  if (mycondition) {\n    x = 1;\n  }\n  else {\n   \
    \ x = 0;\n  }\n  std::cout << \"The value of x is: \" << x << \"\\n\";\n}\n```\n\
    \n# 第 16 章 语句\n\n要使用条件表达式重写之前的示例，我们将写：\n\n```cpp\n#include <iostream>\n\nint main()\n\
    {\n    bool mycondition = true;\n    int x = 0;\n    x = (mycondition) ? 1 : 0;\n\
    \    std::cout << \"The value of x is: \" << x;\n}\n```\n\n条件运算符语法：\n\n`(condition)\
    \ ? expression_1 : expression_2`\n\n如果条件为真，则返回 expression_1，否则返回 expression_2。这可以用于替换简单的\
    \ if 语句。\n\n### 16.1.3 逻辑运算符\n\n逻辑运算符执行逻辑与、或、取反操作。逻辑运算符操作布尔值，结果也是布尔值。\n\n| 运算符\
    \ | 描述 |\n|---|---|\n| && | 逻辑 |\n| || | 逻辑 |\n| ! | 取反 |\n\n第一个运算符是 &&，是逻辑与运算符。结果当两个操作数都为真时为真\n\
    \n```cpp\n#include <iostream>\n\nint main()\n{\n    bool a = true;\n    bool b\
    \ = true;\n    if (a && b)\n    {\n        std::cout << \"The condition is true.\"\
    ;\n    }\n}\n```\n\n第二个运算符是 ||，是逻辑或运算符。结果当至少一个操作数为真时为真。\n\n```cpp\n#include <iostream>\n\
    \nint main()\n{\n    bool a = true;\n    bool b = false;\n    if (a || b)\n  \
    \  {\n        std::cout << \"The condition is true.\";\n    }\n}\n```\n\n下一个运算符是\
    \ !，是取反运算符。它取反操作数。\n\n```cpp\n#include <iostream>\n\nint main()\n{\n    bool a\
    \ = true;\n    if (!a)\n    {\n        std::cout << \"The condition is false.\"\
    ;\n    }\n}\n```\n\n### 16.1.4 比较运算符\n\n比较运算符允许我们比较值。比较运算符有小于 <、小于等于 <=、大于大于大于等于\
    \ >=、相等 ==、不等 !=\n\n我们可以使用 == 来检查值是否相等：\n\n```cpp\n#include <iostream>\n\nint\
    \ main()\n{\n    int x = 5;\n    if (x == 5)\n    {\n        std::cout << \"The\
    \ value of x is equal to 5.\";\n    }\n}\n```\n\n其他比较运算符的用法：\n\n```cpp\n#include\
    \ <iostream>\n\nint main()\n{\n    int x = 10;\n    if (x > 5)\n    {\n      \
    \  std::cout << \"The value of x is greater than 5.\";\n    }\n}\n```\n\n现在，我们可以在同一个条件中同时使用逻辑运算符和比较运算符：\n\
    \n```cpp\n#include <iostream>\n\nint main()\n{\n    int x = 10;\n    if (x > 5\
    \ && x < 15)\n    {\n        std::cout << \"The value of x is greater than 5 and\
    \ less than 15.\";\n    }\n    bool b = true;\n    if (x > 5 && b)\n    {\n  \
    \      std::cout << \"The value of x is greater than 5 and b is true.\";\n   \
    \ }\n}\n```\n\n任何字面量、对象或隐式转换为真或否的表达式都可以作为条件：\n\n```cpp\n#include <iostream>\n\n\
    int main()\n{\n    if (1) // 字面量 1 转换为真\n    {\n        std::cout << \"The condition\
    \ is true.\";\n    }\n}\n```\n\n如果我们使用了一个非 0 值的整数变量，结果将为真\n\n```cpp\n#include\
    \ <iostream>\n\nint main()\n{\n    int x = 10; // 如果 x 是 0，条件将为假\n    if (x)\n\
    \    {\n        std::cout << \"The condition is true.\";\n    }\n    else\n  \
    \  {\n        std::cout << \"The condition is false.\";\n    }\n}\n```\n\n即使只有一条语句要执行，在\
    \ if 语句的分支中使用代码块 {} 也是一个良好的习惯。\n\n"
