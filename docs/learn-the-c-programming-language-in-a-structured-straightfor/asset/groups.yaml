    如果一个头文件在同一个编译单元中被包含多次，会导致重复错误。为了防止这种情况，我们使用头文件保护（header guards）。头文件保护由 `#ifndef`、`#define`\
    \ 和 `#endif` 指令组成。\n\n```cpp\n#ifndef MY_HEADER_H\n#define MY_HEADER_H\n\n// 声明\n\
    \n#endif\n```\n\n或者，许多编译器支持 `#pragma once` 指令：\n\n```cpp\n#pragma once\n// 声明\n\
    ```\n\n### 31.3 命名空间\n\n到为止，我们已经见过如何将 C++ 代码分组到不同的文件中。另一种分组方式是通过命名空间。命名空间是一个命名的作用域。\n\
    \n```cpp\nnamespace MyNamespace\n{\n    // 声明\n}\n```\n\n要引用命名空间之外的对象，我们使用它们的完全限定名配合作用域运算符\
    \ `::`。\n\n```cpp\nnamespace MyNamespace\n{\n    int x = 10;\n}\n\nint main()\n\
    {\n    std::cout << MyNamespace::x << std::endl;\n}\n```\n\n要将整个命名空间引入当前作用域，可以使用\
    \ `using namespace` 指令：\n\n```cpp\nnamespace MyNamespace\n{\n    int x = 10;\n\
    }\n\nusing namespace MyNamespace;\n\nint main()\n{\n    std::cout << x << std::endl;\n\
    }\n```\n\n或者，我们可以使用 `using` 声明引入命名空间中特定的声明：\n\n```cpp\nnamespace MyNamespace\n\
    {\n    int x = 10;\n    int y = 20;\n}\n\nusing MyNamespace::x;\n\nint main()\n\
    {\n    std::cout << x << std::endl;\n    // y 在此处不可用\n}\n```\n\n"
