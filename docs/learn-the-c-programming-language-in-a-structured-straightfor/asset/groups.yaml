- md: "\n## CHAPTER 23 CLASSES - INTRODUCTION\n\nMyClass copyto;\ncopyto = copyfrom;\
    \ // uses a copy assignment operator\n\nA copy assignment operator is of the following\
    \ signature:\n\nMyClass& operator=(const MyClass& rhs)\n\nTo define a user-defined\
    \ copy assignment operator inside a class we use:\n\n```cpp\nclass MyClass\n{\n\
    public:\n    MyClass& operator=(const MyClass& rhs)\n    {\n        // implement\
    \ the copy logic here\n        return *this;\n    }\n};\n```\n\nNotice that the\
    \ overloaded = operators must return a dereferenced this pointer at the end. To\
    \ define a user-defined copy assignment operator outside the class, we use:\n\n\
    ```cpp\nclass MyClass\n{\npublic:\n    MyClass& operator=(const MyClass& rhs);\n\
    };\n```\n\n```cpp\nMyClass& MyClass::operator=(const MyClass& rhs)\n{\n    //\
    \ implement the copy logic here\n    return *this;\n}\n```\n\nSimilarly, there\
    \ is a move assignment operator, which we will discuss later in the book. More\
    \ on operator overloading in the following chapters.\n\n### 23.4.5 Move Constructor\n\
    \nIn addition to copying, we can also move the data from one object to the other.\
    \ We call it a move semantics. Move semantics is achieved through a move constructor\
    \ and move assignment operator. The object from which the data was moved, is left\
    \ in some valid but unspecified state. The move operation is efficient in terms\
    \ of speed of execution, as we do not have to make copies.\n\nMove constructor\
    \ accepts something called rvalue reference as an argument. Every expression can\
    \ find itself on the left-hand side or the right-hand side of the assignment operator.\
    \ The expressions that can be used on the left-hand side are called lvalues, such\
    \ as variables, function calls, class members, etc. The expressions that can be\
    \ used on the right-hand side of an assignment operator are called rvalues, such\
    \ as literals, and other expressions.\n\nNow the move semantics accepts a reference\
    \ to that rvalue. The signature of an rvalue reference type is T&&, with double\
    \ reference symbols. So, the signature of a move constructor is:\n\n```cpp\nMyClass(MyClass&&\
    \ rhs)\n```\n\nTo cast something to an rvalue reference, we use the std::move\
    \ function. This function casts the object to an rvalue reference. It does not\
    \ move anything. An example where a move constructor is invoked:\n\n```cpp\n#include\
    \ <iostream>\nclass MyClass { };\nint main() {\n    MyClass o1;\n    MyClass o2\
    \ = std::move(o1);\n    std::cout << \"Move constructor invoked.\";\n    // or\
    \ MyClass o2{std::move(o1)};\n}\n```\n\nIn this example, we define an object of\
    \ type MyClass called o1. Then we initialize the second object o2 by moving everything\
    \ from object o1 to o2. To do that, we need to cast the o2 to rvalue reference\
    \ with std::move(o1). This, in turn, invokes the MyClass move constructor for\
    \ o2.\n\nIf a user does not provide a move constructor, the compiler provides\
    \ an implicitly generated default move constructor.\n\nLet us specify our own,\
    \ user-defined move constructor:\n\n```cpp\n#include <iostream>\n#include <string>\n\
    \nclass MyClass\n{\nprivate:\n    int x;\n    std::string s;\npublic:\n    MyClass(int\
    \ xx, std::string ss) // user provided constructor\n        : x{xx}, s{ss }\n\
    \    {}\n    MyClass(MyClass&& rhs) // move constructor\n        :\n        x{std::move(rhs.x)},\
    \ s{std::move(rhs.s)}\n        {\n            std::cout << \"Move constructor\
    \ invoked.\" << '\\n';\n        }\n};\nint main()\n{\n    MyClass o1{1, \"Some\
    \ string value\"};\n    MyClass o2 = std::move(o1);\n}\n```\n\nThis example defines\
    \ a class with two data members and two constructors. The first constructor is\
    \ some user-provided constructor used to initialize data members with provided\
    \ arguments.\n\nThe second constructor is a user-defined move constructor accepting\
    \ an rvalue reference parameter of type MyClass&& called rhs. This parameter will\
    \ become our std::move(o1) argument/object. Then in the constructor initializer\
    \ list, we also use the std::move function to move the data fields from o1 to\
    \ o2.\n\n### 23.4.6 Move Assignment\n\nMove assignment operator is invoked when\
    \ we declare an object and then try to assign an rvalue reference to it. This\
    \ is done via the move assignment operator. The signature of the move assignment\
    \ operator is: MyClass& operator=(MyClass&& otherobject).\n\nTo define a user-defined\
    \ move assignment operator inside a class we use:\n\n```cpp\nclass MyClass\n{\n\
    public:\n    MyClass& operator=(MyClass&& otherobject)\n    {\n        // implement\
    \ the copy logic here\n        return *this;\n    }\n};\n```\n\nAs with any assignment\
    \ operator overloading, we must return a dereferenced this pointer at the end.\
    \ To define a move assignment operator outside the class, we use:\n\n```cpp\n\
    class MyClass\n{\npublic:\n    MyClass& operator=(const MyClass& rhs);\n};\n```\n\
    \n```cpp\nMyClass& MyClass::operator=(const MyClass& rhs)\n{\n    // implement\
    \ the copy logic here\n    return *this;\n};\n```\n\nMove assignment operator\
    \ example adapted from a move constructor example would be:\n\n```cpp\n#include\
    \ <iostream>\n#include <string>\n\nclass MyClass\n{\nprivate:\n    int x;\n  \
    \  std::string s;\npublic:\n    MyClass(int xx, std::string ss) // user provided\
    \ constructor\n        : x{xx}, s{ss }\n    {}\n    MyClass(MyClass&& rhs) //\
    \ move constructor\n        :\n        x{std::move(rhs.x)}, s{std::move(rhs.s)}\n\
    \        {\n            std::cout << \"Move constructor invoked.\" << '\\n';\n\
    \        }\n    MyClass& operator=(MyClass&& otherobject)\n    {\n        // implement\
    \ the move logic here\n        x = std::move(otherobject.x);\n        s = std::move(otherobject.s);\n\
    \        return *this;\n    }\n};\n\nint main()\n{\n    MyClass o1{1, \"Some string\
    \ value\"};\n    MyClass o2 = std::move(o1);\n    o2 = std::move(o1);\n    return\
    \ 0;\n}\n```\n\n### 23.5 Operator Overloading\n\nOperator overloading allows you\
    \ to redefine how operators (like +, -, *, *) work with user-defined types. This\
    \ can make your code more readable and intuitive.\n\nOperators can be overloaded\
    \ as member functions or as non-member functions.\n\n- Member-overloaded operators:-\
    \ The operator is a member of the class. The left operand is implicitly the `this`\
    \ pointer.\n- Non-member-overloaded operators: The operator is a free function,\
    \ and both operands are passed as arguments.\n\nSome operators cannot be overloaded:\n\
    - `.` (dot operator)\n- `::` (scope resolution operator)\n- `.*` (pointer-to-member\
    \ operator)\n- `sizeof`\n- `typeid`\n\nGenerally, for many operators, it is better\
    \ to implement them as non-member functions, especially if you want to allow implicit\
    \ conversions where the left operand is a built-in type.\n\n```cpp\nclass Complex\n\
    {\nprivate:\n    double real;\n    double imag;\npublic:\n    Complex(double r\
    \ = 0, double i = 0) : real(r), imag(i) {}\n\n    // Member function +\n    Complex\
    \ operator+(const Complex& rhs) const {\n        return Complex(real + rhs.real,\
    \ imag + rhs.imag);\n    }\n};\n\n// Non-member function +\nComplex operator+(const\
    \ Complex& lhs, const Complex& rhs) {\n    return Complex(lhs.real + rhs.real,\
    \ lhs.imag + rhs.imag);\n}\n```\n\n### 23.5.1 Increment and Decrement\n\nThe increment\
    \ (++) and decrement (--) operators can be overloaded in two forms: prefix (++x)\
    \ and postfix (x--). To distinguish between them, the postfix version takes a\
    \ dummy `int` argument.\n\n```cpp\nclass Counter\n{\nprivate:\n    int value;\n\
    public:\n    Counter(int v = 0) : value(v) {}\n\n    // Prefix increment\n   \
    \ Counter& operator++() {\n        ++value;\n        return *this;\n    }\n\n\
    \    // Postfix increment\n    Counter operator++(int) {\n        Counter tmp\
    \ = *this;\n        value++;\n        return tmp;\n    }\n\n    int getValue()\
    \ const { return value; }\n};\n```\n\n### 23.5.2 Array Subscript\n\nThe subscript\
    \ operator `[]` can be overloaded to allow objects to be used like arrays.\n\n\
    ```cpp\nclass Array\n{\nprivate:\n    int* data;\n    int size;\npublic:\n   \
    \ Array(int s) : size(s) {\n        data = new int[size];\n    }\n    ~Array()\
    \ { delete[] data; }\n\n    int& operator[](int index) {\n        return data[index];\n\
    \    }\n\n    const int& operator[](int index) const {\n        return data[index];\n\
    \    }\n};\n```\n"
  mdcn: "\n\n## 第 23 章 类 - 引言\n\nMyClass copyto;\ncopyto = copyfrom; // 使用拷贝赋值运算符\n\
    \n拷贝赋值运算符的签名如下：\n\nMyClass& operator=(const MyClass& rhs)\n\n要在类内部定义用户自定义拷贝赋值运算符，我们使用：\n\
    \n```cpp\nclass MyClass\n{\npublic:\n    MyClass& operator=(const MyClass& rhs)\n\
    \    {\n        // 在处实现拷贝逻辑\n        return *this;\n    }\n};\n```\n\n注意，重载的 `=`\
    \ 运算符必须在最后返回一个解引用后的 `this` 指针。要在类外部定义用户自定义拷贝赋值运算符，我们使用：\n\n```cpp\nclass MyClass\n\
    {\npublic:\n    MyClass& operator=(const MyClass& rhs);\n};\n```\n\n```cpp\nMyClass&\
    \ MyClass::operator=(const MyClass& rhs)\n{\n    // 在处实现拷贝逻辑\n    return *this;\n\
    }\n```\n\n同样，还有一个移动赋值运算符，我们将在书的后部分讨论。后续章节将介绍更多关于运算符重载的内容。\n\n### 23.4.5 移动构造函数\n\
    \n除了拷贝，我们还可以将数据从一个对象移动到另一个对象。我们称之为移动语义。移动语义通过移动构造函数和移动赋值运算符实现。移动数据的对象将处于某些有效但未指定的状态。移动操作执行执行方面是高效的，因为我们不需要进行拷贝。\n\
    \n移动构造函数接受一个被称为右值引用（rvalue reference）的作为参数。每个表达式都可以出现在赋值运算符的左侧或右侧。可以在左侧使用的表达式称为左值（lvalues），例如变量、函数调用、类成员等。可以在赋值运算符右侧使用的表达式称为右值（rvalues），例如字面量和其他表达式。\n\
    \n现在，移动语义接受一个指向该右值的引用。右值引用类型的签名是 `T&&`，带有双重引用符号。因此，移动构造函数的签名是：\n\n\n\n```cpp\n\
    MyClass(MyClass&& rhs)\n```\n\n要将某些内容转换为右值引用，我们使用 `std::move` 函数。该函数将对象转换为右值引用。它本身并不移动任何东西。一个调用移动构造函数的示例：\n\
    \n```cpp\n#include <iostream>\nclass MyClass { };\nint main() {\n    MyClass o1;\n\
    \    MyClass o2 = std::move(o1);\n    std::cout << \"Move constructor invoked.\"\
    ;\n    // 或者 MyClass o2{std::move(o1)};\n}\n```\n\n在这个示例中，我们定义了一个类型为 `MyClass`\
    \ 的对象 `o1`。然后我们通过从对象 `o1` 移动所有内容到 `o2` 来初始化第二个对象 `o2`。为此，我们需要使用 `std::move(o1)`\
    \ 将 `o2` 转换为右值引用。这反过来调用了 `o2` 的 `MyClass` 移动构造函数。\n\n如果用户没有提供移动构造函数，编译器会提供一个隐式生成的默认移动构造函数。\n\
    \n让我们定义自己的自定义移动构造函数：\n\n```cpp\n#include <iostream>\n#include <string>\n\nclass\
    \ MyClass\n{\nprivate:\n    int x;\n    std::string s;\npublic:\n    MyClass(int\
    \ xx, std::string ss) // 用户提供的构造函数\n        : x{xx}, s{ss }\n    {}\n    MyClass(MyClass&&\
    \ rhs) // 移动构造函数\n        :\n        x{std::move(rhs.x)}, s{std::move(rhs.s)}\n\
    \        {\n            std::cout << \"Move constructor invoked.\" << '\\n';\n\
    \        }\n};\nint main()\n{\n    MyClass o1{1, \"Some string value\"};\n   \
    \ MyClass o2 = std::move(o1);\n}\n```\n\n这个示例定义了一个具有两个数据成员和两个构造函数的类。第一个构造函数是用户提供的构造函数，用于用提供的参数初始化数据成员。\n\
    \n第二个构造函数是用户自定义的移动构造函数，接受一个类型为 `MyClass&&` 名为 `rhs` 的右值引用参数。该参数将成为我们的 `std::move(o1)`\
    \ 参数/对象。然后在构造函数初始化列表中，我们也使用 `std::move` 函数将数据字段从 `o1` 移动到 `o2`。\n\n### 23.4.6\
    \ 移动赋值\n\n当我们声明一个对象并尝试向其赋值一个右值引用时，就会调用移动赋值运算符。这是通过移动赋值运算符完成的。移动赋值运算符的签名是：`MyClass&\
    \ operator=(MyClass&& otherobject)`。\n\n要在类内部定义用户自定义移动赋值运算符，我们使用：\n\n```cpp\n\
    class MyClass\n{\npublic:\n    MyClass& operator=(MyClass&& otherobject)\n   \
    \ {\n        // 在处实现拷贝逻辑\n        return *this;\n    }\n};\n```\n\n与任何赋值运算符重载一样，我们必须在最后返回一个解引用后的\
    \ `this` 指针。要在类外部定义移动赋值运算符，我们使用：\n\n```cpp\nclass MyClass\n{\npublic:\n    MyClass&\
    \ operator=(const MyClass& rhs);\n};\n```\n\n```cpp\nMyClass& MyClass::operator=(const\
    \ MyClass& rhs)\n{\n    // 在处实现拷贝逻辑\n    return *this;\n};\n```\n\n根据移动构造函数示例改编的移动赋值运算符示例将：\n\
    \n```cpp\n#include <iostream>\n#include <string>\n\nclass MyClass\n{\nprivate:\n\
    \    int x;\n    std::string s;\npublic:\n    MyClass(int xx, std::string ss)\
    \ // 用户提供的构造函数\n        : x{xx}, s{ss}\n    {}\n    MyClass(MyClass&& rhs) //\
    \ 移动构造函数\n        :\n        x{std::move(rhs.x)}, s{std::move(rhs.s)}\n      \
    \  {\n            std::cout << \"Move constructor invoked.\" << '\\n';\n     \
    \   }\n\n    MyClass& operator=(MyClass&& otherobject) // 移动赋值运算符\n    {\n   \
    \     // 在处实现拷贝逻辑\n        return *this;\n    }\n};\n```\n*(注：此处原文示例代码逻辑在赋值运算符中仍写为\
    \ \"copy logic\"，翻译保持原样)*\n\n由于原文示例在 23.4.6 处的代码实现存在逻辑上的冗余（写了 copy logic 且签名为移动赋值），此处严格遵循原文内容进行翻译。\n\
    \n### 23.5 运算符重载\n\n运算符重载允许对自定义类型使用 `+`、`-`、`*` 等运算符。这可以使你的代码更直观。\n\n运算符可以实现为成员函数或非成员函数。\n\
    \n- 成员重载运算符：类的成员。左操作数是 `this` 指针。\n- 非成员重载运算符：自由函数，两个操作数作为参数传递。\n\n某些运算符无法重载：\n\
    - `.`（点运算符）\n- `::`（作用域解析运算符）\n- `.*`（成员指针运算符）\n- `sizeof`\n- `typeid`\n\n通常，对于许多运算符，最好将它们实现为非成员函数，特别是当你想允许左操作数是内置类型时。\n\
    \n```cpp\nclass Complex\n{\nprivate:\n    double real;\n    double imag;\npublic:\n\
    \    Complex(double r = 0, double i = 0) : real(r), imag(i) {}\n\n    // 成员函数\
    \ +\n    Complex operator+(const Complex& rhs) const {\n        return Complex(real\
    \ + rhs.real, imag + rhs.imag);\n    }\n};\n\n// 非成员函数 +\nComplex operator+(const\
    \ Complex& lhs, const Complex& rhs) {\n    return Complex(lhs.real + rhs.real,\
    \ lhs.imag + rhs.imag);\n}\n```\n\n### 23.5.1 增减运算符\n\n(++) 和 (--)运算符可以以两种形式重载：前置\
    \ (++x) 和后置 (x--)。为了区分它们，后置版本接受一个虚拟的 `int` 参数。\n\n```cpp\nclass Counter\n{\nprivate:\n\
    \    int value;\npublic:\n    Counter(int v = 0) : value(v) {}\n\n    // 前置增\n\
    \    Counter& operator++() {\n        ++value;\n        return *this;\n    }\n\
    \n    // 后置增\n    Counter operator++(int) {\n        Counter tmp = *this;\n  \
    \      value++;\n        return tmp;\n    }\n\n    int getValue() const { return\
    \ value; }\n};\n```\n\n### 23.5.2 下标运算符\n\n下标运算符 `[]` 可以重载，以便允许对象像数组一样使用。\n\n\
    ```cpp\nclass Array\n{\nprivate:\n    int* data;\n    int size;\npublic:\n   \
    \ Array(int s) : size(s) {\n        data = new int[size];\n    }\n    ~Array()\
    \ { delete[] data; }\n\n    int& operator[](int index) {\n        return data[index];\n\
    \    }\n\n    const int& operator[](int index) const {\n        return data[index];\n\
    \    }\n};\n```\n\n"
