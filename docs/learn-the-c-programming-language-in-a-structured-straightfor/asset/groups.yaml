    \ \"Value not found.\" << '\\n';\n    }\n    for (auto el : myset)\n    {\n  \
    \      std::cout << el << '\\n';\n    }\n}\n```\n\n## 39.9 基础映射\n\n编写一个程序，定义一个映射（map），其键的类型为\
    \ `char`，值为 `int` 类型。打印映射的内容。\n\n```cpp\n#include <iostream>\n#include <map>\n\
    \nint main()\n{\n    std::map<char, int> mymap = {{'a', 1}, {'b', 5}, {'e', 10},\
    \ {'f', 10}};\n    for (auto el : mymap)\n    {\n        std::cout << el.first\
    \ << ' ' << el.second << '\\n';\n    }\n}\n```\n\n说明：映射元素是键值对。这些键对由 `std::pair`\
    \ 类模板表示，该模板可以存储一个键值对。映射元素的类型是 `std::pair<char, int>`。在映射容器中，键是唯一的，而值不一定是唯一的。我们在初始化列表\
    \ `{}` 中使用键值对来初始化映射。使用范围的 for 循环（ranged-based for loop），我们遍历映射元素。要访问对中的键，我们使用对的\
    \ `.first` 成员函数，它代表对中的第一个元素，在我们的例子中就是键。同样地，我们使用对的 `.second` 成员函数访问第二个元素，它代表映射元素的值。\n\
    \n## 39.10 向映射插入数据\n\n编写一个程序，定义一个字符串和整数的映射。使用映射的 `insert()` 成员函数向映射插入一个元素。使用映射的\
    \ `operator []` 向映射中插入另一个键值对元素。之后打印映射的内容。\n\n```cpp\n#include <iostream>\n#include\
    \ <map>\n#include <string>\n\nint main()\n{\n    std::map<std::string, int> mymap\
