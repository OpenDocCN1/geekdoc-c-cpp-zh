    \ '\\n';\n    }\n}\n```\n\n据说函数对象携带它们它们的值。由于它们是类的对象，它们可以随随携带的数据成员。这使得它们与普通函数区分开来。\n\
    \n正如我们看到的，如果只需要一个简单的函数对象，重载 `operator()` 并编写整个类可能会相当繁琐。这就是 Lambda 表达式大显用场的地方。Lambda\
    \ 表达式是匿名/未命名的函数对象。Lambda 表达式的签名格式为：\n\n```cpp\n[captures](parameters){lambda_body};\n\
    ```\n\n要定义并调用 lambda，我们可以使用：\n\n```cpp\n#include <iostream>\n\nint main()\n{\n\
