    \    std::string firstName = fullname.substr(0, 4);\n    std::string lastname\
    \ = fullname.substr(5, 3);\n    std::cout << \"The full name is: \" << fullname\
    \ << \"\\n\";\n    std::cout << \"The first name is: \" << firstName << \"\\n\"\
    ;\n    std::cout << \"The last name is: \" << lastname << \"\\n\";\n}\n```\n"
