    # 40.4 C++20


    The C++20 standard promises to bring some big additions to the language. Its impact
    on the existing standards is said to be as big as the C++11 to a C++98/C++03 standard.
    At the time of writing, the C++20 standard is to be ratified around May 2020.
    The full implementation and the support in the compilers should follow. Some of
    the following things may, at first glance, seem intimidating, especially when
    beginning C++. However, do not worry. At the time of writing, none of the compilers
    fully support the C++20 standard, that is about to change. Once the compilers
    fully support the C++20 standard, trying out the examples will be much easier.
    With that in mind, let us go through some of the most exciting C++20 features.


    # 40.4.1 Modules


    Modules are the new C++20 feature, which aims to eliminate the need for the separation
    of code into header and source files. So far, in traditional C++, we have organized
    our source code using headers files and source files. We keep our declarations/interfaces
    in header files. We put our definitions/implementations in source files. For example,
    we have a header file with a function declaration:'
