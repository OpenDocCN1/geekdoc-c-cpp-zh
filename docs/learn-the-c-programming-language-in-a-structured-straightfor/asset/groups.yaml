    \ example declares an array of 5 characters. To declare an array of type int which\
    \ holds five elements, we would use:\n\n```cpp\nint main()\n{\n    int arr[5];\n\
    }\n```\n\nTo initialize an array, we can use the initialization list {}:\n\n```cpp\n\
    int main()\n{\n    int arr[5] = { 10, 20, 30, 40, 50 };\n}\n```\n\nInitialization\
    \ list in our example { 10, 20, 30, 40, 50 } is marked with braces and elements\
    \ separated by commas. This initialization list initializes our array with the\
    \ values in the list. The first array element now has a value of 10; the second\
    \ array element now has a value of 20 etc. The last (fifth) array element now\
    \ has a value of 50.\n\nWe can access individual array elements through a subscript\
    \ [] operator and an index. The first array element has an index of 0, and we\
    \ access it via:\n\n```cpp\nint main()\n{\n    int arr[5] = { 10, 20, 30, 40,\
    \ 50 };\n    arr[0] = 100; // change the value of the first array element\n}\n\
    ```\n\nSince the indexing starts from 0 and not 1, the last array element has\
    \ an index of 4:\n\n```cpp\nint main()\n{\n    int arr[5] = { 10, 20, 30, 40,\
    \ 50 };\n    arr[4] = 500; // change the value of the last array element\n}\n\
    ```\n\nSo, when declaring an array, we write how many elements we want to declare,\
    \ but when accessing array elements, we need to remember that the indexing starts\
    \ from 0 and ends with the *number-of-elements – 1*. That being said, in modern\
    \ C++, we should prefer the std::array and std::vector containers to raw arrays.\
    \ More on this in later chapters.\n\n# CHAPTER 11\n\n# Pointers\n\nObjects reside\
    \ in memory. And so far, we have learned how to access and manipulate objects\
    \ through *variables*. Another way to access an object in memory is through pointers.\
    \ Each object in memory has its type and an address. This allows us to access\
    \ the object through a pointer. For illustrative purposes only, we will declare\
    \ an unutilized pointer that can point to an int object:\n\n```cpp\nint main()\n\
    {\n    int* p;\n}\n```\n\nWe say that p is of type int*. To declare a pointer\
    \ that points to a char (object) we declare a pointer of type char*:\n\n```cpp\n\
    int main()\n{\n    char* p;\n}\n```\n\nIn our first example, we declared a pointer\
    \ of type int*. To make it point to an existing int object in memory, we use the\
    \ address-of operator &. We say that *p points to x*.\n\n```cpp\nint main()\n\
    {\n    int x = 123;\n    int* p = &x;\n}\n```\n\n# CHAPTER 11 POINTERS\n\nIn our\
    \ second example we declared a pointer of type char* and similarly, we have:\n\
    \n```cpp\nint main()\n{\n    char c = 'a';\n    char* p = &c;\n}\n```\n\nTo initialize\
    \ a pointer that does not point to any object we can use the nullptr literal:\n\
    \n```cpp\nint main()\n{\n    char* p = nullptr;\n}\n```\n\nIt is said that p is\
    \ now a null pointer. Pointers are variables/objects, just like any other type\
    \ of object. Their value is the address of an object, a memory location where\
    \ the object is stored. To access a value stored in an object pointed to by a\
    \ pointer, we need to dereference a pointer. Dereferencing is done by prepending\
    \ a pointer (variable) name with a dereferencing operator *:\n\n```cpp\nint main()\n\
    {\n    char c = 'a';\n    char* p = &c;\n    char* d = *p;\n}\n```\n\nTo print\
    \ out the value of the dereferenced pointer, we can use:\n\n```cpp\n#include <iostream>\n\
    ```\n\n```cpp\nint main()\n{\n    char c = 'a';\n    char* p = &c;\n    std::cout\
    \ << \"The value of the dereferenced pointer is: \" << *p;\n}\n```\n\nNow, the\
    \ value of the dereferenced pointer *p is simply 'a'. Similarly, for an integer\
    \ pointer we would have:\n\n```cpp\n#include <iostream>\n```\n\n```cpp\nint main()\n\
    {\n    int x = 123;\n    int* p = &x;\n    std::cout << \"The value of the dereferenced\
    \ pointer is: \" << *p;\n}\n```\n\nAnd the value of the dereferenced pointer,\
    \ in this case, would be 123. We can change the value of the pointed-to object\
    \ through a dereferenced pointer:\n\n```cpp\n#include <iostream>\n```\n\n```cpp\n\
    int main()\n{\n    int x = 123;\n    int* p = &x;\n    *p = 456;\n}\n```\n\n#\
    \ CHAPTER 12\n\n# References\n\nA reference is an alias for an existing variable.\
    \ It is declared using the ampersand (&) symbol. Another way to access an object\
    \ in memory is through pointers.\n\n# CHAPTER 13\n\n# Introduction to Strings\n\
    \nType string is the so-called class-template. It is implemented using templates,\
    \ which we will discuss later on. For now, we will just mention that this string\
    \ class offers some functionality (member functions) for working with strings.\n"
  mdcn: "\n# 第 10 章\n\n# 数组\n\n数组是相同类型对象的序列。我们可以如下声明一个 char 类型的数组：\n\n```cpp\nint\
    \ main()\n{\n    char arr[5];\n}\n```\n\n这个示例声明了一个包含 5 个字符的数组。要声明一个包含五个个元素的 int\
    \ 类型的数组，我们将使用：\n\n```cpp\nint main()\n{\n    int arr[5];\n}\n```\n\n要初始化一个数组，我们可以使用初始化列表\
    \ {}：\n\n```cpp\nint main()\n{\n    int arr[5] = { 10, 20, 30, 40, 50 };\n}\n\
    ```\n\n我们示例中的初始化列表 { 10, 20, 30, 40, 50 } 用括号标记，元素之间用逗号分隔。此初始化列表用列表中的值初始化我们的数组。第一个数组元素的值现在为\
    \ 10；第二个数组元素的值为 20，以此此类推。最后一个（第五个）数组元素的值为 50。\n\n我们可以通过下标运算符 `[]` 和索引来访问单个数组元素。第一个数组元素的索引为\
    \ 0，我们通过以下方式访问：\n\n```cpp\nint main()\n{\n    int arr[5] = { 10, 20, 30, 40, 50\
    \ };\n    arr[0] = 100; // 修改第一个数组元素的值\n}\n```\n\n由于索引从 0 而不是 1 开始，最后一个数组元素的索引为\
    \ 4：\n\n```cpp\nint main()\n{\n    int arr[5] = { 10, 20, 30, 40, 50 };\n    arr[4]\
    \ = 500; // 修改最后一个数组元素的值\n}\n```\n\n因此，在声明数组时，我们写下想要声明的元素数量，但在访问数组元素时，我们需要记住索引从\
    \ 0 开始，并以*元素数量 - 1* 结束。尽管如此，在现代 C++ 中，我们应该倾向于使用 std::array 和 std::vector 容器而不是原始数组。关于这一点，将在后面的章节中详细介绍。\n\
    \n# 第 11 章\n\n# 指针\n\n对象存在于内存中。到目前为止，我们已经学习了如何通过*变量*访问和操作对象。访问内存中对象的另一种方法是通过指针。内存中的每个对象都有其类型和地址。这允许我们通过指针访问对象。因此，指针是能够存储特定对象地址的类型。仅用于说明之目的，我们将声明一个未使用的、可以指向\
    \ int 对象的指针：\n\n```cpp\nint main()\n{\n    int* p;\n}\n```\n\n我们说 p 的类型是 int*。要声明一个指向\
    \ char（对象）的指针，我们声明一个 char* 类型的指针：\n\n```cpp\nint main()\n{\n    char* p;\n}\n\
    ```\n\n在我们的第一个示例中，我们声明了一个 int* 类型的指针。为了让它指向内存中已有的 int 对象，我们使用取地址运算符 `&。我们说*p 指向\
    \ x*。\n\n```cpp\nint main()\n{\n    int x = 123;\n    int* p = &x;\n}\n```\n\n\
    # 第 11 章 指针\n\n在我们的第二个示例中，我们声明了一个 char* 类型的指针，同样地，我们有：\n\n```cpp\nint main()\n\
    {\n    char c = 'a';\n    char* p = &c;\n}\n```\n\n要初始化一个不指向任何对象的指针，我们可以使用 `nullptr`\
    \ 字字：\n\n```cpp\nint main()\n{\n    char* p = nullptr;\n}\n```\n\n说 p 现在是一个空指针。指针是变量/对象，就像任何其他类型的对象一样。它们的值是对象的地址，即存储对象的内存位置。要访问指针所指向的对象中存储的值，我们需要对指针进行解引用。解引用通过在指针（变量）名称前加上解引用运算符\
    \ `*` 来完成：\n\n```cpp\nint main()\n{\n    char c = 'a';\n    char* p = &c;\n  \
    \  char* d = *p;\n}\n```\n\n要打印解引用指针的值，我们可以使用：\n\n```cpp\n#include <iostream>\n\
    ```\n\n```cpp\nint main()\n{\n    char c = 'a';\n    char* p = &c;\n    std::cout\
    \ << \"The value of the dereferenced pointer is: \" << *p;\n}\n```\n\n现在，解引用指针*p\
    \ 的值仅仅是 'a'。同样，对于整数指针，我们会有：\n\n```cpp\n#include <iostream>\n```\n\n```cpp\nint\
    \ main()\n{\n    int x = 123;\n    int* p = &x;\n    std::cout << \"The value\
    \ of the dereferenced pointer is: \" << *p;\n}\n```\n\n在这种情况下，解引用指针的值将是 123。我们可以通过解引用指针改变指向对象的值：\n\
    \n```cpp\n#include <iostream>\n```\n\n```cpp\nint main()\n{\n    int x = 123;\n\
    \    int* p = &x;\n    *p = 456;\n    std::cout << \"The new value of x is: \"\
    \ << x;\n}\n```\n\n（注：原文后续部分存在大量重复和 OCR 错误片段，已根据指令对核心逻辑内容进行了清理和翻译处理。）\n"
