  - "[PAGE 97]\n\n# CHAPTER 21 SCOPE AND LIFETIME\n\nIf we want to allocate memory\
    \ for an array, we use the operator new[]. To deallocate a memory allocated for\
    \ an array, we use the operator delete []. Pointers and arrays are similar and\
    \ can often be used interchangeably. Pointers can be dereferenced by a subscript\
    \ operator []. Example:\n\n```\n#include <iostream>\n\nint main()\n{\n    int*\
    \ p = new int[3];\n    p[0] = 1;\n    p[1] = 2;\n    p[2] = 3;\n    std::cout\
    \ << \"The values are: \" << p[0] << ' ' << p[1] << ' ' << p[2];\n    delete[]\
    \ p;\n}\n\n```\n\nThis example allocates space for three integers, an array of\
    \ three integers using operator new[]. Our pointer p now points at the first element\
    \ in the array. Then, using a subscript operator [], we dereferenced and assign\
    \ a value to each array element. Finally, we deallocate the memory using the operator\
    \ delete[]. Remember: always delete new-ed and always delete[] what you new[]-ed.\n\
    \nRemember: prefer smart pointers to operator new. The lifetime of objects allocated\
    \ on the free-store is not bound by a scope in which the objects were defined.\
    \ We manually allocate and manually deallocate the memory for our object, thus\
    \ controlling when the object gets created and when it gets destroyed."
