- md: "\n## 6.3 Definition\n\nWrite a program that defines three variables inside\
    \ the main function. The variables are of char, int, and type double. The names\
    \ of the variables are arbitrary. The initializers are arbitrary.\n\n```cpp\n\
    int main()\n{\n    char mychar = 'a';\n    int myint = 123;\n    double mydouble\
    \ = 456.78;\n}\n```\n\n## 6.4 Initialization\n\nWrite a program that defines three\
    \ variables inside the main function. The variables are of char, int, and type\
    \ double. The names of the variables are arbitrary. The initializers are arbitrary.\
    \ The initialization is performed using the initializer list. Print the values\
    \ afterward.\n\n```cpp\n#include <iostream>\n\nint main()\n{\n    char mychar{\
    \ 'a' };\n    int myint{ 123 };\n    double mydouble{ 456.78 };\n    std::cout\
    \ << \"The value of a char variable is: \" << mychar << '\\n';\n    std::cout\
    \ << \"The value of an int variable is: \" << myint << '\\n';\n    std::cout <<\
    \ \"The value of a double variable is: \" << mydouble << '\\n';\n}\n```\n\n##\
    \ CHAPTER 7\n\n# Operators\n\n## 7.1 Assignment Operator\n\nThe assignment operator\
    \ = assigns a value to a variable / object:\n\n```cpp\nint main() {\n    char\
    \ mychar = 'c';      // define a char variable mychar\n    mychar = 'd';     \
    \      // assign a new value to mychar\n    int x = 123;            // define\
    \ an integer variable x\n    x = 456;                // assign a new value to\
    \ x\n    int y = 789;            // define a new integer variable y\n    y = x;\
    \                  // assign a value of x to it\n}\n```\n\n## 7.2 Arithmetic Operators\n\
    \nWe can do arithmetic operations using arithmetic operators. Some of them are:\n\
    \n- + // addition\n- - // subtraction\n- * // multiplication\n- / // division\n\
    - % // modulo\n\n## CHAPTER 7 OPERATORS\n\nExample:\n\n```cpp\n#include <iostream>\n\
    \nint main()\n{\n    int x = 123;\n    int y = 456;\n    int z = x + y; // addition\n\
    \    z = x - y; // subtraction\n    z = x * y; // multiplication\n    z = x /\
    \ y; // division\n    std::cout << \"The value of z is: \" << z << '\\n';\n}\n\
    ```\n\nThe integer division, in our example, results in a value of 0. It is because\
    \ the result of the integer division where both operands are integers is truncated\
    \ towards zeros. In the expression x / y, x and y are operands and / is the operator.\n\
    \nIf we want a floating-point result, we need to use the type double and make\
    \ sure at least one of the division operands is also of type double:\n\n```cpp\n\
    #include <iostream>\n\nint main()\n{\n    int x = 123;\n    double y = 456;\n\
    \    double z = x / y;\n    std::cout << \"The value of z is: \" << z << '\\n';\n\
    }\n```\n\nSimilarly, we can have:\n\n```cpp\n#include <iostream>\nint main()\n\
    {\n    double z = 123 / 456.0;\n    std::cout << \"The value of z is: \" << z\
    \ << '\\n';\n}\n```\n\nand the result would be the same.\n\n## 7.3 Compound Assignment\
    \ Operators\n\nCompound assignment operators allow us to perform an arithmetic\
    \ operation and assign a result with one operator:\n\n- += // compound addition\n\
    - -= // compound subtraction\n- *= // compound multiplication\n- /= // compound\
    \ division\n- %= // compound modulo\n\nExample:\n\n```cpp\n#include <iostream>\n\
    int main()\n{\n    int x = 123;\n    x += 10; // the same as x = x + 10\n    x\
    \ -= 10; // the same as x = x - 10\n    x *= 2; // the same as x = x * 2\n   \
    \ x /= 3; // the same as x = x / 3\n    std::cout << \"The value of x is: \" <<\
    \ x;\n}\n```\n\n## CHAPTER 7 OPERATORS\n\n## 7.4 Increment/Decrement Operators\n\
    \nIncrement/decrement operators increment/decrement the value of the object. The\
    \ operators are:\n\n- +x // pre-increment operator\n- x++ // post-increment operator\n\
    - --x // pre-decrement operator\n- x-- // post-decrement operator\n\nA simple\
    \ example:\n\n```cpp\n#include <iostream>\n\nint main() {\n    int x = 123;\n\
    \    x++; // add 1 to the value of x\n    ++x; // add 1 to the value of x\n  \
    \  --x; // decrement the value of x by 1\n    x--; // decrement the value of x\
    \ by 1\n    std::cout << \"The value of x is: \" << x;\n}\n```\n\nBoth pre-increment\
    \ and post-increment operators add 1 to the value of our object, and both pre-decrement\
    \ and post-decrement operators subtract one from the value of our object. The\
    \ difference between the two, apart from the implementation mechanism (very broadly\
    \ speaking), is that with the pre-increment operator, a value of 1 is added first.\
    \ Then the object is evaluated/accessed in expression. With the post-increment,\
    \ the object is evaluated/accessed first, and after that, the value of 1 is added.\
    \ To the next statement that follows, it does not make a difference. The value\
    \ of the object is the same, no matter what version of the operator was used.\
    \ The only difference is the timing in the expression where it is used.\n\n##\
    \ CHAPTER 8\n\n# Standard Input\n\nC++ provides facilities for accepting input\
    \ from a user. We can think of the standard input as our keyboard. A simple example\
    \ accepting one integer number and printing it out is:\n\n```cpp\n#include <iostream>\n\
    \nint main()\n{\n    std::cout << \"Please enter a number and press enter: \"\
    ;\n    int x = 0;\n    std::cin >> x;\n    std::cout << \"You entered: \" << x;\n\
    }\n```\n\nThe std::cin is the standard input stream, and it uses the >> operator\
    \ to extract what has been read into our variable. The std::cin >> x; statement\
    \ means: read from a standard input into a variable. The cin object resides inside\
    \ the std namespace. So, std::cout << is used for outputting data (to a screen)\
    \ and std::cin >> is used for inputting the data (from the keyboard).\n\n## CHAPTER\
    \ 8 STANDARD INPUT\n\nWe can accept multiple values from the standard input by\
    \ separating them with multiple >> operators:\n\n```cpp\n#include <iostream>\n\
    \nint main()\n{\n    std::cout << \"Please enter two numbers separated by a space\
