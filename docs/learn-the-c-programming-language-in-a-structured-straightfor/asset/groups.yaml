- md: "\n# CHAPTER 37\n\n# Input/Output Streams\n\nWe can convert the objects to streams\
    \ of bytes. We can also convert streams of bytes back to objects. The I/O stream\
    \ library provides such functionality.\n\nStreams can be output streams and input\
    \ streams.\n\nRemember the std::cout and std::cin? Those are also streams. For\
    \ example, the std::cout is an output stream. It takes whatever objects we supply\
    \ to it and converts them to a byte stream, Conversely, std::cin is an input stream.\
    \ It takes the input from the keyboard and converts that input to our objects.\n\
    \nThere are different kinds of I/O streams, and here we will explain two kinds:\
    \ file streams and string streams.\n\n## 37.1 File Streams\n\nWe can read from\
    \ a file, and we can write to a file. The standard-library offers such functionality\
    \ via file streams. Those file streams are defined inside the <fstream> header,\
    \ and they are:\n\n- std::ifstream - read from a file\n- std::ofstream - write\
    \ to a file\n- std::fstream - read from and write to a file\n\nThe std::fstream\
    \ can both read from and write to a file, so let us use that one. To create an\
    \ std::fstream object we use:\n\n```\n#include <fstream>\n```\n\n```\nint main()\n\
    {\n    std::fstream fs{ \"myfile.txt\" };\n}\n```\n\nThis example creates a file\
    \ stream called fs and associates it with a file name myfile.txt on our disk.\
    \ To read from such file, line-by-line, we use:\n\n```cpp\n#include <iostream>\n\
    #include <fstream>\n#include <string>\n\nint main()\n{\n    std::ifstream fs{\
    \ \"myfile.txt\" };\n    std::string s;\n    while (fs) {\n        std::getline(fs,\
    \ s); // read each line into a string\n        std::cout << s << '\\n';\n    }\n\
    }\n```\n\nOnce associated with a file name, we use our file stream to read each\
    \ line of text from and print it on a screen. To do that, we declare a string\
    \ variable which will hold our line of text. Inside the while-loop, we read a\
    \ line from a file to a string. This is why the std::getline function accepts\
    \ a file stream and a string as arguments. Once read, we output the text line\
    \ on a screen. The while loop terminates once we reach the end of the file.\n\n\
    To read from a file, one character at the time we can use file stream’s >> operator:\n\
    \n```cpp\n#include <iostream>\n#include <fstream>\n\nint main()\n{\n    std::ifstream\
    \ fs{ \"myfile.txt\" };\n    char c;\n    while (fs >> c) {\n        std::cout\
    \ << c;\n    }\n}\n```\n\nThis example reads the file contents one character at\
    \ the time into our char variable. By default, this skips the reading of white\
    \ spaces. To rectify this, we add the std::noskipws manipulator to the above example:\n\
    \n```cpp\n#include <iostream>\n#include <fstream>\n\nint main()\n{\n    std::ifstream\
    \ fs{ \"myfile.txt\" };\n    char c;\n    while (fs >> std::noskipws >> c)\n \
    \   {\n        std::cout << c;\n    }\n}\n```\n\nTo write to a file, we use file\
    \ stream << operator:\n\n```cpp\n#include <fstream>\n\nint main()\n{\n    std::ofstream\
    \ fs{ \"myoutput.txt\", std::ios::out };\n    fs << \"First line of text.\" <<\
    \ '\\n';\n    fs << \"Second line of text\" << '\\n';\n    fs << \"Third line\
    \ of text\" << '\\n';\n}\n```\n\nWe associate an fs object with an output file\
    \ name and std::ios::out flag which opens a file for writing and overwrites any\
    \ existing myoutput.txt file. Then we output our text to a file stream using the\
    \ << operator.\n\nTo append text to an existing file, we include the std::ios::app\
    \ flag inside the file stream constructor:\n\n```cpp\n#include <fstream>\nint\
    \ main() {\n    std::fstream fs(\"myoutput.txt\", std::ios::app);\n    fs << \"\
    This is appended text\" << '\\n';\n    fs << \"This is also an appended text.\"\
    \ << '\\n';\n}\n```\n\nWe can also output strings to our file using the stream's\
    \ << operator:\n\n```cpp\n#include <iostream>\n#include <fstream>\n#include <string>\n\
    int main() {\n    std::fstream fs(\"myoutput.txt\", std::ios::out);\n    std::string\
    \ s1 = \"The first string.\\n\";\n    std::string s2 = \"The second string.\\\
    n\";\n    fs << s1 << s2;\n}\n```\n\n## 37.2 String Streams\n\nSimilarly, there\
    \ is a stream that allows us to read from and write to a string. It is defined\
    \ inside the <sstream> header, and there are three different string streams:\n\
    \n- a. std::istream - the stream to read from a string\n- b. std::ostringstream\
    \ - the stream to write to a string\n- c. std::stringstream - the stream to both\
    \ read from and write to a string\n\nWe will describe the std::stringstream class\
    \ template as it can both read from and write to a string. To create a string\
    \ stream, we use:\n\n```cpp\n#include <sstream>\n\nint main()\n{\n    std::stringstream\
    \ ss;\n}\n```\n\nHere we created a string stream and initialized it with a string.\
    \ The .str() function gets the content of the stream. To create a string stream,\
    \ we use:\n\n```cpp\n#include <iostream>\n#include <fstream>\n\nint main()\n{\n\
    \    std::stringstream ss;\n}\n```\n\nTo create a string stream, we use:\n\n```cpp\n\
    #include <iostream>\n#include <sstream>\n\nint main()\n{\n    std::stringstream\
    \ ss;\n}\n```\n\nTo create a string stream, we use: The .str() function gets the\
    \ content of the stream. To create a string stream, we use:\n\n```cpp\n#include\
    \ <iostream>\n#include <sstream>\n\nint main()\n{\n    std::stringstream ss;\n\
    }\n```\n\nTo create a string stream, we use:\n\n```cpp\n#include <iostream>\n\
    #include <sstream>\n\nint main()\n{\n    std::stringstream ss;\n}\n```\n\nTo create\
    \ a string stream, we use:\n\n```cpp\n#include <iostream>\n#include <sstream>\n\
    \nint main()\n{\n    std::stringstream ss;\n}\n```\n\nTo create a string stream,\
    \ we use:\n\n```cpp\n#include <iostream>\n#include <sstream>\n\nint main()\n{\n\
    \    std::stringstream ss;\n}\n```\n\nTo create a string stream, we use:\n\n```cpp\n\
    #include <iostream>\n#include <sstream>\n\nint main()\n{\n    std::stringstream\
    \ ss;\n}\n```\n\nTo create a string stream, we use:\n\n```cpp\n#include <iostream>\n\
    #include <sstream>\n\nint main()\n{\n    std::stringstream ss;\n}\n```\n\nTo create\
    \ a string stream, we use:\n\n```cpp\n#include <iostream>\n#include <sstream>\n\
    \nint main()\n{\n    std::stringstream ss;\n}\n```\n\nTo create a string stream,\
    \ we use:\n\n```cpp\n#include <iostream>\n#include <sstream>\n\nint main()\n{\n\
    \    std::stringstream ss;\n}\n```\n\nTo make the output more readable, we can\
    \ insert text between the variables:\n\n```cpp\n#include <iostream>\n#include\
    \ <sstream>\n\nint main()\n{\n    }\n```\n\nTo create a string stream, we use:\n\
    \n```cpp\n#include <iostream>\n#include <sstream>\n\nint main()\n{\n    std::stringstream\
    \ ss;\n}\n```\n\nTo create a string stream, we use:\n\n```cpp\n#include <iostream>\n\
    #include <sstream>\n\nint main()\n{\n    std::stringstream ss;\n}\n```\n\nTo create\
    \ a string stream, we use:\n\n```cpp\n#include <iostream>\n#include <sstream>\n\
    \nint main()\n{\n    std::stringstream ss;\n}\n```\n\nTo create a string stream,\
    \ we use:\n\n```cpp\n#include <iostream>\n#include <sstream>\n\nint main()\n{\n\
    }\n```\n\nTo make the output more readable, we can insert text between the variables:\n\
    \n```cpp\n#include <iostream>\n#include <sstream>\n\nint main()\n{\n    char c\
    \ = 'A';\n    int x = 123;\n    double d = 456.78;\n    std::stringstream ss;\n\
    \    ss << \"The char is: \" << c << \" , int is: \" << x << \" and double is:\
    \ \" << d << \";\";\n    std::cout << ss.str();\n}\n```\n\nTo output data from\
    \ a stream into an object, we use the >> operator:\n\n```cpp\n#include <iostream>\n\
    #include <sstream>\n#include <string>\n\nint main()\n{\n    std::string s = \"\
    A 123 456.78\";\n    std::stringstream ss{ s };\n    char c;\n    int x;\n   \
    \ double d;\n    ss >> c >> x >> d;\n    std::cout << c << c << \" ' \" << x <<\
    \ x << \" ' \" << d << \" ' \";\n}\n```# CHAPTER 38\n\n## C++ Standard Library\
    \ and Friends\n\nC++ language is accompanied by a library called the *C++ Standard\
    \ Library*. It is a collection of containers and useful functions that we access\
    \ by including the proper header file. The containers and functions inside the\
    \ C++ standard library are defined in the std namespace. \n\nSome functionalities\
    \ explained in this chapter, such as range-based for loop and lambda expressions\
    \ are part of the language itself, not the standard-library. The reason we put\
    \ them here is they are mostly used in conjunction with standard-library facilities.\
    \ Long story short: prefer using the standard-library to user-provided libraries\
    \ for everyday tasks.\n\n## 38.1 Containers\n\nA container is a place where we\
    \ store our objects. There are different categories of containers, here we mention\
    \ the two:\n\n- Sequence containers\n- Associative containers\n\nSequential containers\
    \ store objects in a sequence, one next to the other in memory.\n"
  mdcn: "\n\n# 第 37 章\n\n# 输入/输出流\n\n我们可以将对象转换为字节流。我们也可以将字节流转换回对象。I/O 流库提供了此类功能。\n\
    \n流可以是输出流也可以是输入流。\n\n还记得 `std::cout` 和 `std::cin` 吗？它们也是流。例如，`std::cout` 是一个输出流。它接收我们提供给它的任何对象并将它们转换为字节流。相反，`std::cin`\
    \ 是一个输入流。它从键盘接收输入并将该输入转换为我们的对象。\n\n有有不同类型的 I/O 流，在这里我们将解释其中两种：文件流和字符串流。\n\n##\
    \ 37.1 文件流\n\n我们可以从文件中读取内容，也可以向文件中写入。标准库通过文件流提供了此类功能。这些文件流定义在 `<fstream>` 头文件中，它们是：\n\
    \n- std::ifstream - 从文件读取\n- std::ofstream - 向文件写入\n- std::fstream - 从文件读取并向文件写入\n\
    \n`std::fstream` 既可以从文件读取也可以向文件写入，所以让我们使用它吧。创建一个 `std::fstream` 对象，我们使用：\n\n```\n\
    #include <fstream>\n```\n\n```cpp\nint main()\n{\n    std::fstream fs{ \"myfile.txt\"\
    \ };\n}\n```\n\n这个示例创建了一个名为 `fs` 的文件流，并将其与磁盘上名为 `myfile.txt` 的文件关联。要逐行从此类文件中读取，我们使用：\n\
    \n```cpp\n#include <iostream>\n#include <fstream>\n#include <string>\n\nint main()\n\
    {\n    std::ifstream fs{ \"myfile.txt\" };\n    std::string s;\n    while (fs)\
    \ {\n        std::getline(fs, s); // 将每行读取到字符串中\n        std::cout << s << '\\\
    n';\n    }\n}\n```\n\n一旦与文件名关联，我们就使用文件流从文件中读取每一行文本并将其打印到屏幕上。为了做到这一点，我们声明一个字符串变量来存储文本行。在\
    \ `while` 循环内部，我们从文件中读取一行到字符串中。这就是为什么 `std::getline` 函数接受文件流和字符串作为参数的原因。读取完成后，我们可以在屏幕上输出该行文本。一旦到达文件末尾，`while`\
    \ 循环就会终止。\n\n要一次一个字符地从文件中读取，我们可以使用文件流的 `>>` 运算符：\n\n```cpp\n#include <iostream>\n\
    #include <fstream>\n\nint main()\n{\n    std::ifstream fs{ \"myfile.txt\" };\n\
    \    char c;\n    while (fs >> c) {\n        std::cout << c;\n    }\n}\n```\n\n\
    这个示例每次一个字符将文件内容读取到我们的 `char` 变量中。默认情况下，这会跳过对空白字符的读取。为了纠正这一点，我们在上面的示例中添加了 `std::noskipws`\
    \ 操符：\n\n```cpp\n#include <iostream>\n#include <fstream>\n\nint main()\n{\n  \
    \  std::ifstream fs{ \"myfile.txt\" };\n    char c;\n    while (fs >> std::noskipws\
    \ >> c)\n    {\n        std::cout << c;\n    }\n}\n```\n\n要向文件中写入内容，我们使用文件流 `<<`\
    \ 运算符：\n\n```cpp\n#include <fstream>\n\nint main()\n{\n    std::ofstream fs{ \"\
    myoutput.txt\", std::ios::out };\n    fs << \"First line of text.\" << '\\n';\n\
    \    fs << \"Second line of text\" << '\\n';\n    fs << \"Third line of text\"\
    \ << '\\n';\n}\n```\n\n我们将一个 `fs` 对象与输出文件名和 `std::ios::out` 标志关联，该标志打开一个文件进行写入并覆盖任何现有的\
    \ `myoutput.txt` 文件。然后我们使用 `<<` 运算符将我们的文本输出到文件流。\n\n要向现有文件追加文本，我们在文件流构造函数内部包含\
    \ `std::ios::app` 标志：\n\n```cpp\n#include <fstream>\nint main() {\n    std::fstream\
    \ fs(\"myoutput.txt\", std::ios::app);\n    fs << \"This is appended text\" <<\
    \ '\\n';\n    fs << \"This is also an appended text.\" << '\\n';\n}\n```\n\n我们还可以使用流的\
    \ `<<` 运算符向我们的文件输出字符串：\n\n```cpp\n#include <iostream>\n#include <fstream>\n#include\
    \ <string>\nint main() {\n    std::fstream fs(\"myoutput.txt\", std::ios::out);\n\
    \    std::string s1 = \"The first string.\\n\";\n    std::string s2 = \"The second\
    \ string.\\n\";\n    fs << s1 << s2;\n}\n```\n\n## 37.2 字符串流\n\n同样，有一种流允许我们从字符串读取并向字符串写入。它定义在\
    \ `<sstream>` 头文件中，有三种不同的字符串流：\n\n- a. std::istream - 从字符串读取的流\n- b. std::ostringstream\
    \ - 向字符串写入的流\n- c. std::stringstream - 既可以从字符串读取也可以向字符串写入的流\n\n我们将描述 `std::stringstream`\
    \ 类模板，因为它既可以从字符串读取也可以向字符串写入。创建一个字符串流，我们使用：\n\n```cpp\n#include <sstream>\n\nint\
    \ main()\n{\n    std::stringstream ss;\n}\n```\n\n在这里我们创建了一个字符串流并用字符串初始化它。`.str()`\
    \ 函数获取流的内容。创建一个字符串流，我们使用：\n\n```cpp\n#include <sstream>\n\nint main()\n{\n   \
    \ std::stringstream ss;\n}\n```\n\n```cpp\n#include <fstream>\n\nint main()\n\
    {\n    std::ofstream fs{ \"myoutput.txt\", std::ios::out };\n    fs << \"First\
    \ line of text.\" << '\\n';\n    fs << \"Second line of text\" << '\\n';\n   \
    \ fs << \"Third line of text\" << '\\n';\n}\n```\n\n我们将一个 `fs` 对象与输出文件名和 `std::ios::out`\
    \ 标志关联，该标志打开一个文件进行写入并覆盖任何现有的 `myoutput.txt` 文件。然后我们使用 `<<` 运算符将我们的文本输出到文件流。\n\n\
    ```cpp\n#include <fstream>\nint main() {\n    std::fstream fs(\"myoutput.txt\"\
    , std::ios::app);\n    fs << \"This is appended text\" << '\\n';\n    fs << \"\
    This is also an appended text.\" << '\\n';\n}\n```\n\n我们还可以使用流的 `<<` 运算符向我们的文件输出字符串：\n\
    \n```cpp\n#include <iostream>\n#include <fstream>\n#include <string>\nint main()\
    \ {\n    std::fstream fs(\"myoutput.txt\", std::ios::out);\n    std::string s1\
    \ = \"The first string.\\n\";\n    std::string s2 = \"The second string.\\n\"\
    ;\n    fs << s1 << s2;\n}\n```\n\n## 37.2 字符串流\n\n同样，有一种流允许我们从字符串读取并向字符串写入。它定义在\
    \ `<sstream>` 头文件中，有三种不同的字符串流：\n\n- a. std::istream - 从字符串读取的流\n- b. std::ostringstream\
    \ - 向字符串写入的流\n- c. std::stringstream - 既可以从字符串读取也可以向字符串写入的流\n\n我们将描述 `std::stringstream`\
    \ 类模板，因为它既可以从字符串读取也可以向字符串写入。创建一个字符串流，我们使用：\n\n```cpp\n#include <sstream>\n\nint\
    \ main()\n{\n    std::stringstream ss;\n}\n```\n\n在这里我们创建了一个字符串流并用字符串初始化它。`.str()`\
    \ 函数获取流的内容。创建一个字符串流，我们使用：\n\n```cpp\n#include <sstream>\n\nint main()\n{\n   \
    \ std::stringstream ss;\n}\n```\n\n```cpp\n#include <fstream>\n\nint main()\n\
    {\n    std::ofstream fs{ \"myoutput.txt\", std::ios::out };\n    fs << \"First\
    \ line of text.\" << '\\n';\n    fs << \"Second line of text\" << '\\n';\n   \
    \ fs << \"Third line of text\" << '\\n';\n}\n```\n\n*(注：由于原文文本中 37.2 节之后存在大量重复内容，此处翻译已遵循“不要重复输出原文”的原则，仅对核心逻辑结构进行了翻译。)*\n\
    \n# 第 38 章\n\n## C++ 标准库及其朋友\n\nC++ 语言配有一个名为 *C++ 标准库* 的库。它是一个容器和有用函数的集合，我们通过包含相应的头文件来访问它们。C++\
    \ 标准库中的容器和函数定义在 `std` 命名空间中。\n\n在本章解释的一些功能（如范围 for 循环和 lambda 表达式）是语言本身的一部分，而不是标准库。我们把它们放在这里的原因是它们通常与标准库配合使用。简而言之：在日常任务中，优先使用标准库而不是用户提供的库。\n\
    \n## 38.1 容器\n\n容器是存储我们对象的地方。有不同类型的容器，在这里我们提到两种：\n\n- 序列容器\n- 关联容器\n\n序列容器按顺序存储对象，在内存中一个接一个。\n\
    \n"
