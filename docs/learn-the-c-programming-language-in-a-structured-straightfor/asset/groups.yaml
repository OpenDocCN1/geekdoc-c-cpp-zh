    \ 15 };\n    int findvalue = 5;\n    auto foundit = myset.find(findvalue);\n \
    \   if (foundit != myset.end())\n    {\n        std::cout << \"Value found. Deleting\
    \ the value...\" << '\\n';\n        myset.erase(foundit);\n        std::cout <<\
