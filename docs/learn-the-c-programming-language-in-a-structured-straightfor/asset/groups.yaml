    \ one of a given set of case labels. If none of the case statements is equal to\
    \ the condition, the code inside the default label is executed. General syntax:\n\
    \n```\nswitch (condition)\n{\n    case value1:\n        statement(s);\n      \
    \  break;\n    case value2etc:\n        statement(s);\n        break;\n    default:\n\
