    \ a value.\" << '\\n';\n}\n```\n\n## 40.3.7 std::variant\n\nC++ 中还有另一种数据类型称为 `union`（联合体）。联合体是一种其不同类型的数据成员占据相同内存类型。一次只能访问一个数据成员。联合体在内存中的大小是其最大数据成员的大小。数据成员在某种程度上是重叠的。在\
    \ C++ 中定义联合体类型，我们写：\n\n```cpp\nunion MyUnion\n{\n    char c;      // 一个字节\n  \
    \  int x;       // 四个字节\n    double d;   // 八个字节\n}\n```\n\n我们声明了一个可以持有字符、整数或浮点数的联合体类型。该联合体的大小是其最大数据成员\
    \ `double` 的大小，取决于实现，可能是八个字节。尽管联合体声明了多个数据成员，但它在任何时刻只能持有一个成员的值。这是因为所有数据成员共享同一个内存地址。并且我们只能访问最后写入的成员。示例：\n\
    \n```cpp\n#include <iostream>\n```\n\n"
