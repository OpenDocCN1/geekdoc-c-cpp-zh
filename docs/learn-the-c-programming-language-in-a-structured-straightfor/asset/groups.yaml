    \ two kinds of files: headers and source files. Header files usually contain declarations,\
    \ while source files contain definitions. Header files usually have .h or .hpp\
    \ extension, while source files usually have .cpp or .cc extension.\n\nTo include\
    \ a header in another file, we use the `#include` directive. We can include standard\
    \ library headers using angle brackets, e.g., `<iostream>`, and user-defined headers\
    \ using double quotes, e.g., `\"header.h\"`.\n\nExample of a header file and a\
    \ source file:\n\n**header.h**\n```cpp\n#ifndef HEADER_H\n#define HEADER_H\n\n\
    void printHello(int n);\n\n#endif\n```\n\n**source.cpp**\n```cpp\n#include <iostream>\n\
    #include \"header.h\"\n\nvoid printHello(int n)\n{\n    std::cout << \"Hello,\
    \ \" << n << std::endl;\n}\n```\n\n**main.cpp**\n```cpp\n#include \"header.h\"\
    \n\nint main()\n{\n    printHello(10);\n    return 0;\n}\n```\n\n### 31.2 Header\
    \ Guards\n\nIf a header file is included multiple times in the same translation\
    \ unit, it can cause redefinition errors. To prevent this, we use header guards.\
    \ A header guard consists of `#ifndef`, `#define`, and `#endif` directives.\n\n\
    ```cpp\n#ifndef MY_HEADER_H\n#define MY_HEADER_H\n\n// declarations go here\n\n\
    #endif\n```\n\nAlternatively, many compilers support the `#pragma once` directive:\n\
    \n```cpp\n#pragma once\n// declarations go here\n```\n\n### 31.3 Namespaces\n\n\
    So far, we have seen how to group parts of C++ code into separate files. There\
    \ is another way we can logically group through namespaces. A namespace is a scope\
    \ with a name.\n\n```cpp\nnamespace MyNamespace\n{\n    // declarations go here\n\
    }\n```\n\nTo refer to objects outside the namespace, we use their fully qualified\
    \ names with the scope resolution operator `::`.\n\n```cpp\nnamespace MyNamespace\n\
    {\n    int x = 10;\n}\n\nint main()\n{\n    std::cout << MyNamespace::x << std::endl;\n\
    }\n```\n\nTo introduce an entire namespace into the current scope, we can use\
    \ the `using namespace` directive:\n\n```cpp\nnamespace MyNamespace\n{\n    int\
    \ x = 10;\n}\n\nusing namespace MyNamespace;\n\nint main()\n{\n    std::cout <<\
    \ x << std::endl;\n}\n```\n\nAlternatively, we can introduce specific declarations\
    \ from a namespace using the `using` declaration:\n\n```cpp\nnamespace MyNamespace\n\
    {\n    int x = 10;\n    int y = 20;\n}\n\nusing MyNamespace::x;\n\nint main()\n\
    {\n    std::cout << x << std::endl;\n    // y is not available here\n}\n```\n"
