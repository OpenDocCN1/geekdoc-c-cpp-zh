  mdcn: "\n\n## 40.4.6 协程 (Coroutines)\n\n协程是一种可以挂起并恢复的函数。如果普通函数在函数体内使用了以下任何操作符，则它就是一个协程：\n\
    \n- co_await - 挂起协程的执行，直到完成其他计算，即直到协程恢复。\n- co_yield - 挂起协程并向调用者返回一个值。\n- co_return\
    \ - 从协程中返回并停止其执行。\n\n## 40.4.7 std::span\n\n某些容器和类型按顺序存储其元素，元素紧密相邻。数组（arrays）和向量（vectors）就是此类情况。我们可以通过指向其第一个元素的指针加上容器的长度来表示此类容器。来自\
    \ `<<span>`-头文件的 `std::span` 类模板正是如此：它是对连续容器元素 span 的引用。使用 `std::span` 的原因之一是它的构造和拷贝开销很小。Span\
    \ 并不拥有 vector 或数组的引用所有权。但是，它可以更改元素的值。要从 vector 创建 span，我们使用：\n\n```cpp\n#include\
    \ <iostream>\n#include <vector>\n#include <span>\n\nint main()\n{\n    std::vector<int>\
    \ v = { 1, 2, 3 };\n    std::span<int> myintspan = v;\n    myintspan[2] = 256;\n\
    \n    for (auto el : v) {\n        std::cout << el << '\\n';\n    }\n}\n```\n\n\
    ## 第 40 章 C++ 标准\n\n在这里，我们创建了一个引用 vector 元素的 span。然后我们使用该 span 更改了 vector 的第三个元素。有了\
    \ span，我们不需要担心传递指针和长度，只需要使用 span 包装器的整洁语法。由于 vector 的大小可能会发生，我们说我们的 span 具有动态范围（dynamic\
    \ extent）。我们可以从固定大小的数组创建一个固定大小的 span。我们现在说我们的 span 具有静态范围（static extent）。\n\n\
    ```cpp\n#include <iostream>\n#include <span>\n\nint main()\n{\n    int arr[] =\
    \ { 1, 2, 3, 4, 5 };\n    std::span<int, 5> myintspan = arr;\n    myintspan[4]\
    \ = 10;\n\n    for (auto el : arr)\n    {\n        std::cout << el << '\\n';\n\
    \    }\n}\n```\n\n## 40.4.8 数学常数\n\nC++20 标准引入了表示某些数学常数的方法。要使用它们，我们需要包含 `<numbers>`\
    \ 头文件。常量本身位于 `std::numbers` 命名空间中。以下示例展示了如何使用数字 pi 和 e、对数函数的结果以及数字 2 和 3 的平方根：\n\
    \n```cpp\n#include <iostream>\n#include <numbers>\n\nint main()\n{\n    std::cout\
    \ << \"Pi: \" << std::numbers::pi << '\\n';\n    std::cout << \"e: \" << std::numbers::e\
    \ << '\\n';\n    std::cout << \"log2(e): \" << std::numbers::log2e << '\\n';\n\
    }\n```\n\n```cpp\n    std::cout << \"log10(e): \" << std::numbers::log10e << '\\\
    n';\n    std::cout << \"ln(2): \" << std::numbers::ln2 << '\\n';\n    std::cout\
    \ << \"ln(10): \" << std::numbers::ln10 << '\\n';\n    std::cout << \"sqrt(2):\
    \ \" << std::numbers::sqrt2 << '\\n';\n    std::cout << \"sqrt(3): \" << std::numbers::sqrt3\
    \ << '\\n';\n}\n```\n\n## 总结与建议\n\n亲爱的读者，恭喜你完成了这本书。希望到目前，你已经熟悉了 C++ 语言、标准库以及各种\
    \ C++ 标准和特性。学习 C++ 并不是一项轻易的任务。但它是一项可以实现且有回报的任务。我的目标是介绍语言和标准库的骨架，这是每个追求的 C++ 开发者都应该了解的内容。\n\
    \n接下来该去哪里？我将推荐一些我认为对每个 C++ 专业人士必不可少的资源和书籍。\n\n## 首选参考\n\nC++ 语言和标准库的首选参考是 cppreference，地址为：https://www.cppreference.com\n\
    \n它是 C++ 及其库的顶级资源。这是一份编写极其优秀、社区驱动、维基风格的 C++ 参考，充满了理论和示例。即使 cppreference 是非官方的\
    \ C++ 文档，它也应该是你的第一首选参考资源。\n\n## StackOverflow\n\nStackOverflow 是一个社区驱动的编程问答网站。它拥有关于大量语言（包括\
    \ C++）的最新信息：\n\n```\nhttps://stackoverflow.com/questions/tagged/c%2b%2b\n```\n\
    \n## 其他在线资源\n\nStandard C++ Foundation 有一个 C++ 超 FAQ 页面，地址为：\nhttps://isocpp.org/faq\n\
    \n该资源包含关于 C++11、C++14 以及通用语言的一些优秀文章。它还列出了一些不错的 C++ 博客。\n\n## 其他 C++ 书籍\n\nStackOverflow\
    \ 维护了一个名为“The Definitive C++ Book Guide and List”的 C++ 书列表，地址为：\nhttps://stackoverflow.com/questions/388242/the-definitive-c-guide-and-list\n\
    \n从这个集中，我强烈推荐以下书籍：\n\n- Bjarne Stroustrup 编写的《The C++ Programming Language》\n\
    - Scott Meyers 编写的《Effective C++》\n- Scott Meyers 编写的《Effective C++》\n\n## 建议\n\
    \n亲爱的读者，恭喜你完成了这本书。希望到目前，你已经熟悉了 C++ 语言、标准库以及各种 C++ 标准和特性。学习 C++ 并不是一项轻易的任务。但它是一项可以实现且有回报的任务。我的目标是介绍语言和标准库的骨架，这是每个追求的\
    \ C++ 开发者都应该了解的内容。\n\n接下来该去哪里？我将推荐一些我认为对每个 C++ 专业人士必不可少的资源和书籍。\n\n不要被复杂性吓倒，从基础开始。C++\
    \ 是一个强大的工具，只要掌握它，它将带给你巨大的回报。\n\n## 索引\n\n### A\n- 访问修符/标签, 99-101, 123-124\n-\
    \ 算法, 224-225\n- 赋值 (=), 21\n- 数组, 32\n- 关联容器, 249\n- 自动存储期, 90\n- 自动类型推导, 244\n\
    - 常量类型, 48\n- 块作用域, 89\n- 二进制字面量, 63\n- C++11, 254\n- C++14, 262\n- C++17, 275\n\
    - 协程, 291\n- 构造函数 (见 Constructors)\n- 容器, 21\n- 命令行编译, 243\n- constexpr, 247\n\
    - constexpr 表达式, 265-266\n- C++ 开发者, 254\n- C++ 特性, 259\n- 字符类型, 12-14\n- 字符分隔符,\
    \ 64\n- 异常处理, 71\n- 异常安全的, 70\n- 异常初始化, 53\n- 异常操作, 72\n- 异常, 71\n- 异常 ,  1\n\
    -                    \n    , 21\n\n### C\n- 联合类型, 275\n- 偶数数, 283\n- 概念 (concepts),\
