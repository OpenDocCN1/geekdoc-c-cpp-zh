    \nstd::pair 只能包含两个值，而 `std::tuple` 包装器可以包含两个以上的值。我们需要包含 `<tuple>` 头文件。要访问特定的 tuple\
    \ 元素，我们使用 `std::get<index>(tuple_name)` 函数：\n\n```\n#include <iostream>\n#include\
    \ <utility>\n#include <tuple>\n\nint main()\n{\n    std::tuple<char, int, double>\
