    \ 3, 4, 5 };\n    std::ranges::reverse(v);\n    for (auto el : v) {\n        std::cout\
    \ << el << '\\n';\n    }\n}\n```\n\nUnlike views, the ranges algorithms modify\
    \ the actual vector content.\n"
