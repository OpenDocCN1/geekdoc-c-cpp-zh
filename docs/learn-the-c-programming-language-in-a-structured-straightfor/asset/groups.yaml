- md: "\n# CHAPTER 40 C++ STANDARDS\n\nWe can also use the map's operator [] to insert\
    \ an element. Normally, this operator is used to access an element value by key.\
    \ However, if the key does not exist, the operator inserts a new element into\
    \ the map:\n\n```\n#include <iostream>\n#include <unordered_map>\n\nint main()\n\
    {\n    std::unordered_map<char, int> myunorderedmap = { {'a', 1}, {'b', 2}, {'c',\
    \ 5} };\n    myunorderedmap['b'] = 4; // key exists, change the value\n    myunorderedmap['d']\
    \ = 10; // key does not exist, insert the new element\n    for (auto el : myunorderedmap)\n\
    \    {\n        std::cout << el.first << ' ' << el.second << ' '\\n';\n    }\n\
    }\n```\n\n### 40.1.11 std::tuple\n\nstd::pair can hold only two values, the std::tuple\
    \ wrapper can hold more than two values. We need to include the <tuple> header.\
    \ To access a certain tuple element, we use the std::get_index_of_an_element<tuple_name>(tuple_name)\
    \ function:\n\n```\n#include <iostream>\n#include <utility>\n#include <tuple>\n\
    \nint main()\n{\n    std::tuple<char, int, double> mytuple = { 'a', 123, 3.14\
    \ };\n    std::cout << \"The first element is: \" << std::get<0>(mytuple) << '\\\
    n';\n    std::cout << \"The second element is: \" << std::get<1>(mytuple) << '\\\
    n';\n    std::cout << \"The third element is: \" << std::get<2>(mytuple) << '\\\
    n';\n}\n```\n\nWe can create a tuple using the std::make_tuple function:\n\n```cpp\n\
    #include <iostream>\n#include <tuple>\n#include <string>\n\nint main() {\n   \
    \ auto mytuple = std::make_tuple<int, double, std::string>(123, 3.14, \"Hello\
    \ World.\");\n    std::cout << \"The first tuple element is: \" << std::get<0>(mytuple)\
    \ << '\\n';\n    std::cout << \"The second tuple element is: \" << std::get<1>(mytuple)\
    \ << '\\n';\n    std::cout << \"The third tuple element is: \" << std::get<2>(mytuple)\
    \ << '\\n';\n}\n```\n\nInstead of typing a lengthy tuple type, which is std::tuple<int,\
    \ double, std::string>, we used the auto specifier to deduce the type name for\
    \ us.\n\n### 40.1.12 static_assert\n\nThe static_assert directive checks a static\
    \ constexpr condition during compile time. If the condition is false, the directive\
    \ fails the compilation and displays an error message. Example:\n\n```cpp\nint\
    \ main() {\n    constexpr int x = 123;\n    static_assert(x == 456, \"The constexpr\
    \ value is not 456.\");\n}\n```\n\nThe static_assert checks if the value of x\
    \ is equal to 456 during compile time. Since it is not, the compilation will fail\
    \ with a \"The constexpr value is not 456.\" message. We can think of the static_assert\
    \ as a way of testing our code during compile time. It is also a neat way of testing\
    \ if the value of a constexpr expression is what we expect it to be.\n\n### 40.1.13\
    \ Introduction to Concurrency\n\nC++11 standard introduces facilities for working\
    \ with threads. To enable threading, we need to add the -threads flag when compiling\
    \ with g++ and clang on the command line. Example:\n\n```bash\ng++ -std=c++11\
    \ -Wall -pthread source.cpp\n```\n\nWith clang it will:\n\n```bash\nclang++ -std=c++11\
    \ -Wall -pthread source.cpp\n```\n\nWhen we compile and link our source code program,\
    \ an executable file is produced. When we start the executable, the program gets\
    \ loaded into memory and starts running. This running program is called a process.\
    \ When we start multiple executable files, we can have multiple processes. Each\
    \ process has its memory, its own address space. Within a process, there can be\
    \ multiple threads. What are the threads? Threads of execution are an OS mechanism\
    \ that allows us to execute multiple pieces of code concurrently/simultaneously.\n\
    \nFor example, we can execute multiple functions concurrently using threads. In\
    \ a broader sense, concurrently can also mean in parallel. A thread is part of\
    \ the process. A process can spawn one or more threads. Threads share the same\
    \ memory and thus can communicate with each other using this shared memory.\n\n\
    To create a thread object, we use the std::thread class template from a <thread>\
    \ header file. Once defined, the thread starts executing. To create a thread that\
    \ executes a code inside a function, we supply the function name to the thread\
    \ constructor as a parameter. Example:\n\n```cpp\n#include <iostream>\n#include\
    \ <thread>\n```\n\n```cpp\nvoid function1()\n{\n    for (int i = 0; i < 10; i++)\n\
    \    {\n        std::cout << \"Executing function1.\" << '\\n';\n    }\n}\n```\n\
    \n```cpp\nint main()\n{\n    std::thread t1{function1 };\n}\n```\n\n(Note: The\
    \ provided OCR text for pages 247-250 contained significant repetition and garbled\
    \ fragments. I have reconstructed the logical flow based on the technical context\
    \ of C++ concurrency provided in the source.)\n"
