    }\n```\n\n## 20.2 分离声明与定义\n\n编写一个程序声明并定义一个类型为 `void` 名为 `printmessage()` 的函数。该函数在标准输出上输出“Hello\
    \ World from a function.”消息。在 `main` 中调用该函数。\n\n```cpp\n#include <iostream>\n\n\
