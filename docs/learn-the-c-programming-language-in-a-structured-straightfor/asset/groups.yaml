    \ s2 = \" World!\";\n    std::string s3 = s1 + s2;\n    std::cout << \"The resulting\
    \ string is: \" << s3;\n}\n```\n\n## 15.5 Strings from Standard Input\n\nWrite\
    \ a program that accepts the first and last name from the standard input using\
