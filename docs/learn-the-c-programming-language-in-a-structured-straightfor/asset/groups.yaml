    \ it is **wrong** for many reasons. We do not want to introduce the entire std\
    \ namespace into the current scope because we want to avoid clashes and ambiguity.\
    \ Good to remember: do not introduce the entire std namespace via the current\
    \ namespace std; statement. So, instead of this wrong approach:\n\n```\n#include\
    \ <iostream>\n\nusing namespace std; // do not use this\n\nint main()\n{\n   \
    \ cout << \"A bad example.\";\n}\n```\n\nuse the following:\n\n```\n#include <iostream>\n\
    \nint main()\n{\n    std::cout << \"A good example.\";\n}\n```\n\nFor calls to\
    \ objects and functions that reside inside the std namespace, add the std:: prefix\
    \ where needed."
- md: "\n# CHAPTER 5\n\n## Types\n\nEvery entity has a type. What is a type? A type\
    \ is a set of possible values and operations. Instances of types are called objects.\
    \ An object is some region in memory that has a value of particular type (not\
    \ to be confused with an instance of a class which is also called object).\n\n\
    ## 5.1 Fundamental Types\n\nC++ has some built-in types. We often refer to them\
    \ as fundamental types. A declaration is a statement that introduces a name into\
    \ a current scope.\n\n### 5.1.1 Boolean\n\nLet us declare a variable b of type\
    \ bool. This type holds values of true and false.\n\n```cpp\nint main()\n{\n \
    \ bool b;\n}\n```\n\nThis example declares a variable b of type bool. And that\
    \ is it. The variable is not initialized, no value has been assigned to it at\
    \ the time of construction. To initialize a variable, we use an assignment operator\
    \ = followed by an initializer:\n\n```cpp\nint main()\n{\n  bool b = true;\n}\n\
    ```\n\n# CHAPTER 5 TYPES\n\nWe can also use braces {} for initialization:\n\n\
    ```cpp\nint main()\n{\n    bool b{ true};\n}\n```\n\nThese examples declare a\
    \ (local) variable b of type bool and initialize it to a value of true. Our variable\
    \ now holds a value of true. All local variables should be initialized. Accessing\
    \ uninitialized variables results in Undefined Behavior, abbreviated as UB. More\
    \ on this in the following chapters.\n\n### 5.1.2 Character Type\n\nType char,\
    \ referred to as character type, is used to represent a single character. The\
    \ type can store characters such as 'a', 'Z' etc. The size of a character type\
    \ is exactly one byte. Character literals are enclosed in single quotes ' ' in\
    \ C++. To declare and initialize a variable of type char, we write:\n\n```cpp\n\
    int main()\n{\n    char c = 'a';\n}\n```\n\nNow we can print out the value of\
    \ our char variable:\n\n```cpp\n#include <iostream>\nint main()\n{\n    char c\
    \ = 'a';\n    std::cout << \"The value of variable c is: \" << c;\n}\n```\n\n\
    Once declared and initialized, we can access our variable and change its value:\n\
    \n```cpp\n#include <iostream>\nint main()\n{\n    char c = 'a';\n    std::cout\
    \ << \"The value of variable c is: \" << c;\n    c = 'Z';\n    std::cout << \"\
    The new value of variable c is: \" << c;\n}\n```\n\nThe size of the char type\
    \ in memory is usually one byte. We obtain the size of the type through a sizeof\
    \ operator:\n\n```cpp\n#include <iostream>\nint main()\n{\n    std::cout << \"\
    The size of type char is: \" << sizeof(char)\n    << \" byte(s)\";\n}\n```\n\n\
    There are other character types such as wchar_t for holding characters of Unicode\
    \ character set, char16_t for holding UTF-16 character sets, but for now, let\
    \ us stick to the type char.\n\nA character literal is a character enclosed in\
    \ single quotes. Example: 'a', 'A', 'z', 'X', 'o' etc.\n\nEvery character is represented\
    \ by an integer number in the character set. That is why we can assign both numeric\
    \ literals (up to a certain number) and character literals to our char variable:\n\
    \n```cpp\nint main()\n{\n    char c = 'a';\n    // is the same as if we had\n\
    \    // char c = 97;\n}\n```\n\n# CHAPTER 5 TYPES\n\nWe can write: char c = 'a';\
    \ or we can write char c = 97; which is (probably) the same, as the 'a' character\
    \ in ASCII table is represented with the number of 97. For the most part, we will\
    \ be using character literals to represent the value of a char object.\n\n###\
    \ 5.1.3 Integer Types\n\nAnother fundamental type is int called integer type.\
    \ We use it to store integral values (whole numbers), both negative and positive:\n\
    \n```cpp\n#include <iostream>\n\nint main() {\n    int x = 123;\n    int y = -256;\n\
    \    std::cout << \"The value of x is: \" << x << \", the value of y is: \" <<\
    \ y;\n}\n```\n\nHere we declared and initialized two variables of type int. The\
    \ size of int is usually 4 bytes. We can also initialize the variable with another\
    \ variable. It will receive a copy of its value. We still have two separate objects\
    \ in memory:\n\n```cpp\n#include <iostream>\n\nint main() {\n    int x = 123;\n\
    \    int y = x;\n    std::cout << \"The value of x is: \" << x << \", the value\
    \ of y is: \" << y;\n    // x is 123\n    // y is 123\n    x = 456;\n    std::cout\
    \ << \"The value of x is: \" << x << \", the value of y is: \" << y;\n    // x\
    \ is now 456\n    // y is still 123\n}\n```\n\nOnce we declare a variable, we\
    \ access and manipulate the variable name by its name only, without the type name.\n\
    \nInteger literals can be decimal, octal, and hexadecimal. Octal literals start\
    \ with a prefix of 0, and hexadecimal literals begin with a prefix of 0x.\n\n\
    ```cpp\nint main() {\n    int x = 10;      // decimal literal\n    int y = 012;\
    \     // octal literal\n    int z = 0xA;     // hexadecimal literal\n}\n```\n\n\
    All these variables have been initialized to a value of 10 represented by different\
    \ integer literals. For the most part, we will be using decimal literals.\n\n\
    There are also other integer types such as int64_t and others, but we will stick\
    \ to int for now.\n\n### 5.1.4 Floating-Point Types\n\nThere are three floating-point\
    \ types in C++: float, double, long double, but we will stick to type double (double-precision).\
    \ We use it for storing floating-point values / real numbers:\n\n```cpp\n#include\
    \ <iostream>\n\nint main() {\n    double d = 3.14;\n    std::cout << \"The value\
    \ of d is: \" << d;\n}\n```\n\nSome of the floating-point literals can be:\n\n\
    ```cpp\nint main() {\n    double x = 213.456;\n    double y = 1.;\n    double\
    \ z = 0.15;\n    double w = .15;\n    double d = 3.14e10;\n}\n```\n\n### 5.1.5\
    \ Type void\n\nType void is a type with no values. Well, what is the purpose of\
    \ such type if we can not objects of that type? Good question. While we can not\
    \ have objects of type void, we can have functions of type void. Functions that\
    \ do not return a value. We can also have a void pointer type marked with void*.\
    \ More on this in later chapters when we discuss pointers and functions.\n\n##\
    \ 5.2 Type Modifiers\n\nTypes can have modifiers. Some of the modifiers are signed\
    \ and unsigned. The signed (default if omitted) means the type can hold both positive\
    \ and negative values, and unsigned means the type has unsigned representation.\
    \ Other modifiers are for the size: short - type will have the width of at least\
    \ 16 bits, and long - type will have the width of least 32 bits. Furthermore,\
    \ we can now combine modifiers:\n\n```cpp\n#include <iostream>\nint main() {\n\
    \    unsigned long int x = 4294967295;\n    std::cout << \"The value of unsigned\
    \ long integer is: \" << x;\n}\n```\n\nType int is signed by default.\n\n## 5.3\
    \ Variable Declaration, Definition, and Initialization\n\nIntroducing a name into\
    \ a current scope is called a *declaration*. We are letting the world know there\
    \ is a name (a variable, for example) of some type, from on in the current scope.\
    \ In a declaration, we prepend the variable name with a type name. Declaration\
    \ examples:\n\n```cpp\nint main()\n{\n    char c;\n    int x;\n    double d;\n\
    }\n```\n\nWe can declare multiple names on the same line:\n\n```cpp\nint main()\n\
    {\n    int x, y, z;\n}\n```\n\nIf there is an initializer for an object present,\
    \ then we call it *initialization*. We are declaring and initializing an object\
    \ to a specific value. We can initialize an object in various ways:\n\n```cpp\n\
    int main()\n{\n    int x = 123;\n    int y{ 123 };\n    int z = { 123 };\n}\n\
    ```\n\n# CHAPTER 5 TYPES\n\nA variable definition is setting a value in memory\
    \ for a name. The definition is making sure we can access and use the name in\
    \ our program. Roughly speaking, it is a declaration followed by an initialization\
    \ (for variables) followed by a semicolon. The definition is also a declaration.\
    \ Definition examples:\n\n```cpp\nint main()\n{\n    char c = 'a';\n    int x\
    \ = 123;\n    double d = 456.78;\n}\n```\n\n# CHAPTER 6\n\n## Exercises\n\n###\
    \ 6.1 Hello World and Comments\n\nWrite a program that has a comment in it, outputs\
    \ “Hello World.” on one line, and “C++ rocks!” on a new line.\n\n```cpp\n#include\
    \ <iostream>\nint main()\n{\n    // this is a comment\n    std::cout << \"Hello\
    \ World.\" << '\\n';\n    std::cout << \"C++ rocks!\";\n}\n```\n\n### 6.2 Declaration\n\
    \nWrite a program that declares three variables inside the main function. Variables\
    \ are of char, int, and type double. The names of the variables are arbitrary.\
    \ Since we do not use any input or output, we do not need to include the <iostream>\
    \ header.\n\n```cpp\nint main()\n{\n    char mychar;\n    int myint;\n    double\
    \ mydouble;\n}\n```\n"
  mdcn: "\n\n# 第5章\n\n## 类型\n\n每个实体都有一个类型。什么是类型？类型是可能的值和操作的集合。类型的实例被称为对象。对象是内存中的某一个区域，具有特定类型的值（**不要与类的实例混淆，类实例也被称为对象**）。\n\
    \n## 5.1 基础类型\n\nC++ 具有了一些内置类型。我们通常称它们为基础类型。声明是一个在当前作用域中引入一个名称的语句。\n\n### 5.1.1\
    \ 布尔型\n\n让我们声明一个 `bool` 类型的变量 `b`。该类型持有 `true` 和 `false` 的值。\n\n```cpp\nint main()\n\
    {\n  bool b;\n}\n```\n\n这个示例声明了一个 `bool` 类型的变量 `b`。到此为止。变量没有初始化，在构造时没有给它分配任何值。要初始化一个变量，我们使用赋值运算符\
    \ `=` 后跟一个初始化值：\n\n```cpp\nint main()\n{\n  bool b = true;\n}\n```\n\n# 第5章 类型\n\
    \n我们也可以使用大括号 `{}` 进行初始化：\n\n```cpp\nint main()\n{\n    bool b{ true};\n}\n```\n\
    \n这些示例声明了一个 `bool` 类型的（局部）变量 `b` 并将其初始化为值 `true`。我们的变量现在持有一个 `true` 值。所有局部变量都应该初始化。访问未初始化的变量会导致**未定义行为**，简称\
    \ **UB**。关于这一点，将在后续章节中详细介绍。\n\n### 5.1.2 字符类型\n\n`char` 类型，被称为字符类型，用于表示单个字符。该类型可以存储诸如\
    \ 'a'、'Z' 等字符。字符类型的大小恰好是一个字节。在 C++ 中，字符字面量用单引号 ' ' 包围。要声明并初始化一个 `char` 类型的变量，我们写道：\n\
    \n```cpp\nint main()\n{\n    char c = 'a';\n}\n```\n\n现在我们可以打印出 `char` 变量的值：\n\
    \n```cpp\n#include <iostream>\nint main()\n{\n    char c = 'a';\n    std::cout\
    \ << \"The value of variable c is: \" << c;\n}\n```\n\n一旦声明并初始化，我们就可以访问变量并更改它的值：\n\
    \n```cpp\n#include <iostream>\nint main()\n{\n    char c = 'a';\n    std::cout\
    \ << \"The value of variable c is: \" << c;\n    c = 'Z';\n    std::cout << \"\
    The new value of variable c is: \" << c;\n}\n```\n\n`char` 类型在内存中的大小通常是一个字节。我们通过\
    \ `sizeof` 运算符获取类型的大小：\n\n```cpp\n#include <iostream>\nint main()\n{\n    std::cout\
    \ << \"The size of type char is: \" << sizeof(char)\n    << \" byte(s)\";\n}\n\
    ```\n\n还有其他字符类型，例如用于持有 Unicode 字符集的字符 `wchar_t`，用于持有 UTF-16 字符集的 `char16_t`，但目前我们先使用\
    \ `char` 类型。\n\n字符字面量是用单引号包围的字符。例如：'a'、'A'、'z'、'X'、'o' 等。\n\n字符集中每个字符由一个整数表示。这就是为什么我们可以同时为\
    \ `char` 变量分配数字字面量（最高到某个数字）和字符字面量：\n\n```cpp\nint main()\n{\n    char c = 'a';\n\
    \    // 等同于我们写\n    // char c = 97;\n}\n```\n\n# 第5章 类型\n\n我们可以写：`char c = 'a';`\
    \ 或者我们可以写 `char c = 97;`，这（可能）是相同的，因为 ASCII 表中的字符 'a' 是用数字 97 表示的。在大多数情况下，我们将使用字符字面量来表示\
    \ `char` 对象的值。\n\n### 5.1.3 整数类型\n\n另一个基础类型是 `int`，称为整数类型。我们用它来存储积分值（整数），包括负数和正数：\n\
    \n```cpp\n#include <iostream>\n\nint main() {\n    int x = 123;\n    int y = -256;\n\
    \    std::cout << \"The value of x is: \" << x << \", the value of y is: \" <<\
    \ y;\n}\n```\n\n在这里我们声明并初始化了两个 `int` 类型的变量。`int` 的大小通常是 4 字节。我们也可以用另一个变量来初始化变量。它将接收其值的拷贝。我们在内存中仍然有两个独立的对象：\n\
    \n```cpp\n#include <iostream>\n\nint main() {\n    int x = 123;\n    int y = x;\n\
    \    std::cout << \"The value of x is: \" << x << \", the value of y is: \" <<\
