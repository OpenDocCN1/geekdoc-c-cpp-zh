    \ `bool`，我们写道：\n\n```cpp\ntemplate <typename T>\nconcept HasMemberFunction requires\
    \ (T x)\n{\n    { x.empty() } -> std::convertible_to<bool>;\n}\n```\n\nC++20 标准中有多个预定义概念。它们检查类型是否满足某些要求。这些预定义概念位于\
    \ `<concepts>` 头文件中。其中一些是：\n\n- std::integral - 指定该类型应为整数类型\n- std::boolean -\
    \ 指定该类型可以作为布尔类型使用\n- std::move_constructible - 指定特定类型的对象可以使用移动语义构造\n- std::movable\
    \ - 指定特定类型 T 的对象可以被移动\n- std::signed_integral - 说明该类型既是整数又是有符号整数\n\n## 40.4.3\
    \ Lambda 模板\n\n我们现在可以在 Lambda 函数中使用模板语法。示例：\n\n```cpp\nauto mylambda = []<typename\
    \ T>(T param)\n{\n    // 代码\n};\n```\n\n例如，要使用模板化的 Lambda 表达式打印泛型类型名称，我们将写道：\n\
    \n```cpp\n#include <iostream>\n#include <vector>\n#include <typeinfo>\n\nint main()\n\
    {\n    auto mylambda = []<typename T>(T param)\n    {\n        std::cout << typeid(T).name()\
    \ << '\\n';\n    }\n\n    std::vector<int> v = { 1, 2, 3, 4, 5 };\n    mylambda(v);\
    \ // integer\n\n    std::vector<double> v2 = { 3.14, 123.456, 7.13 };\n    mylambda(v2);\
    \ // double\n}\n```\n\n## 40.4.4 [[likely]] 和 [[unlikely]] 属性\n\n如果我们知道某些执行路径比其他路径更有可能执行，可以通过放置属性来帮助编译器优化代码。我们在更有可能执行的语句之前使用\
    \ `[[likely]]` 属性。也可以在不太可能执行的语句之前放置 `[[unlikely]]` 属性。例如，这些属性可以用 `switch` 语句内部的\
    \ `case` 分支：\n\n```cpp\n#include <iostream>\n\nvoid mychoice(int i)\n{\n    switch\
    \ (i)\n    {\n        [[likely]] case 1:\n            std::cout << \"可能会执行.\"\
    ;\n            break;\n        [[unlikely]] case 2:\n            std::cout <<\
    \ \"不太可能执行.\";\n            break;\n        default:\n            break;\n   \
    \ }\n}\nint main()\n{\n    mychoice(1);\n}\n```\n\n如果我们想在 `if-else` 分支上使用这些属性，我们写道：\n\
    \n```cpp\n#include <iostream>\n\nint main()\n{\n    if (true) [[likely]]\n   \
    \ {\n        std::cout << \"可能执行\";\n    }\n    else [[unlikely]]\n    {\n   \
    \     std::cout << \"不太可能执行\";\n    }\n}\n```\n\n## 40.4.5 范围 (Ranges)\n\n范围（Range）是一个可以被迭代的集合。在\
    \ C++20 中，我们引入了 `<ranges>` 头文件来更方便地处理这些集合。视图（Views）是范围的包装，它们不拥有数据，而是对原始数据进行惰性操作。视图是可拷贝的，且开销极小。例如：\n\
    \n```cpp\n#include <iostream>\n#include <vector>\n#include <ranges>\n\nint main()\n\
    {\n    std::vector<int> v = { 1, 2, 3, 4, 5 };\n    \n    // 使用视图 过滤出偶数\n    auto\
    \ ev = std::views::filter(v, [](int i) { return i % 2 == 0; });\n    \n    for\
    \ (int i : ev) {\n        std::cout << i << \" \";\n    }\n    return 0;\n}\n\
    ```\n\n视图（Views）的特点是它们不拥有底层数据，它们只是对原始数据的引用。当你销毁视图时，原始数据不会被销毁。此外，视图是惰性的，这意味着只有在迭代时才会执行转换操作。\n\
    \n范围（Ranges）还可以通过管道操作符 `|` 进行组合，使得代码更加易读：\n\n```cpp\n#include <iostream>\n#include\
    \ <vector>\n#include <ranges>\n\nint main()\n{\n    std::vector<int> v = { 1,\
    \ 2, 3, 4, 5 };\n\n    // 使用管道操作符组合操作：过滤偶数 -> 取平方\n    auto result = v | std::views::filter([](int\
    \ i) { return i % 2 == 0; })\n                     | std::views::transform([](int\
    \ i) { return i * i; });\n\n    for (int i : result) {\n        std::cout << i\
    \ << \" \";\n    }\n    return 0;\n}\n```\n\n范围（Ranges）还提供了生成器（Generators），可以动态产生序列。例如：\n\
    \n```cpp\n#include <iostream>\n#include <ranges>\n\nint main()\n{\n    // 生成从\
    \ 1 到 9 的序列\n    for (int i : std::views::iota(1, 10)) {\n        std::cout <<\
    \ i << \" \";\n    }\n    return 0;\n}\n```\n"
