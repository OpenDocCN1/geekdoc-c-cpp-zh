- md: "\n## CHAPTER 38 C++ STANDARD LIBRARY AND FRIENDS\n\nThe el represents a copy\
    \ of each of the vector's elements. If we want to operate on the actual vector\
    \ elements, we use a reference type:\n\n```cpp\n#include <iostream>\n#include\
    \ <vector>\n\nint main()\n{\n    std::vector<int> v = { 1, 2, 3, 4, 5 };\n   \
    \ v.push_back(10);\n\n    for (int& el : v) {\n        std::cout << el << '\\\
    n';\n    }\n}\n```\n\nNow, el is the actual vector element, so any changes we\
    \ do on el will be the changes to actual vector elements.\n\nWe can also use the\
    \ auto specifier and let the compiler deduce the type of the elements in the container:\n\
    \n```cpp\n#include <iostream>\n#include <vector>\n\nint main()\n{\n    std::vector<int>\
    \ v = { 1, 2, 3, 4, 5 };\n    v.push_back(10);\n\n    for (auto el : v) {\n  \
    \      std::cout << el << '\\n';\n    }\n}\n```\n\nTo iterate over a vector of\
    \ strings, we would use a const auto& specifier, as we should pass strings via\
    \ const reference for performance reasons:\n\n```cpp\n#include <iostream>\n#include\
    \ <vector>\n#include <string>\n\nint main() {\n    std::vector<std::string> v\
    \ = { \"Hello\", \"World\", \"C++\" };\n    v.push_back(\"Is great!\");\n    for\
    \ (const auto& el : v) {\n        std::cout << el << '\\n';\n    }\n}\n```\n\n\
    ### 38.3 Iterators\n\nContainers have iterators. Iterators are like pointers to\
    \ container elements. Iterator pointing at the first element of a vector is expressed\
    \ through a .begin() member function. Iterator pointing at the (not the last but)\
    \ one past the last element is expressed through a .end() member function. Iterators\
    \ can be incremented or decremented. We print a vector content using iterators:\n\
    \n```cpp\n#include <iostream>\n#include <vector>\n\nint main() {\n    std::vector<int>\
    \ v = { 1, 2, 3, 4, 5 };\n    for (auto it = v.begin(); it!=v.end(); it++) {\n\
    \        std::cout << *it << '\\n';\n    }\n}\n```\n\n## CHAPTER 38 C++ STANDARD\
    \ LIBRARY AND FRIENDS\n\nAs long as our vector's iterator it is not equal to v.end(),\
    \ we continue iterating through a vector. When a current iterator becomes equal\
    \ to v.end(), the for-loop terminates. v.end() is a signal that the end of the\
    \ container (not the last element, it is one past last) has been reached. One\
    \ learns to appreciate the ease use of range-based loops instead of this old-school\
    \ iterator usage in a for-loop.\n\nNow that we know about iterators, we can use\
    \ them to erase elements from a vector. Let us say we want to erase the third\
    \ element. We position the iterator to a third element and use the .erase(iterator_name)\
    \ member function:\n\n```cpp\n#include <iostream>\n#include <vector>\n\nint main()\n\
    {\n    std::vector<int> v = { 1, 2, 3, 4, 5 };\n    auto it = v.begin() + 3;\n\
    \    v.erase(it);\n\n    for (auto el : v)\n    {\n        std::cout << el <<\
    \ '\\n';\n    }\n}\n```\n\nWe also mentioned another group of containers called\
    \ associative containers. These containers are implemented as binary trees. They\
    \ allow for quick search times, and the data in these containers is sorted. These\
    \ associative containers are std::set and std::map. Set holds unique values. Map\
    \ holds pairs of key-value elements. Please note that there is also another group\
    \ of associative containers that allow duplicate values. They are std::multi_set\
    \ and std::multi_map.\n\n### 38.4 Algorithms and Utilities\n\nC++ standard library\
    \ provides a set of useful functions located in the <algorithm> header. These\
    \ functions allow us to perform various operations on our containers.\n\n### 38.4.1\
    \ std::sort\n\nFor example, if we want to sort our container, we can use the std::sort\
    \ function. To sort our vector in ascending order, we use:\n\nThe std::sort function\
    \ sorts a range of elements. It accepts arguments representing the start and end\
    \ of the range (one past the end of the range, to be exact). Here we passed in\
    \ the entire vector's range, where v.begin() represents the beginning and v.end()\
    \ represents one past the end of the range.\n\nTo sort a container in descending\
    \ order, we pass in an additional argument called comparator. There is a built-in\
    \ comparator std::greater, which does the comparisons using the operator > and\
    \ allows the std::sort function to sort the data in ascending order. Example:\n\
    \n```cpp\n#include <iostream>\n#include <vector>\n#include <algorithm>\n#include\
    \ <functional>\n\nint main() {\n    std::vector<int> v = { 1, 5, 2, 15, 3, 10\
    \ };\n    std::sort(v.begin(), v.end(), std::greater<int>());\n    for (auto el\
    \ : v)\n    {\n        std::cout << el << '\\n';\n    }\n}\n```\n\nComparator\
    \ or a comparison function is a so-called function object defined inside the <functional>\
    \ header. We can define our custom function object via the so-called unnamed functions\
    \ called lambda functions or lambdas. More on this later in the book.\n\nThe third\
    \ parameter of the std::sort function is often called a predicate. A predicate\
    \ is a function or a function object returning true or false. Standard-library\
    \ functions such as the std::sort accept predicates as one of its arguments. Yes,\
    \ it is a lot of text and theory, do not worry about it for the moment. Just remember\
    \ there are built-in functions in the standard library, and learning how to use\
    \ them is the catch. It will all become clear through examples.\n\n### 38.4.2\
    \ std::find\n\nTo find a certain element by value and return an iterator pointing\
    \ at that element, we use the std::find function. To search for a value of 5 in\
    \ our vector, we use:\n\n```cpp\n#include <iostream>\n#include <vector>\n#include\
    \ <algorithm>\n\nint main()\n{\n    std::vector<int> v = { 1, 5, 2, 15, 3, 10\
    \ };\n    auto result = std::find(v.begin(), v.end(), 5);\n    if (result != v.end())\n\
    \    {\n        std::cout << \"Element found: \" << *result;\n    }\n    else\n\
    \    {\n        std::cout << \"Element not found.\";\n    }\n}\n```\n\nAlternatively,\
    \ using freestanding begin(container) and end(container) functions:\n\n```cpp\n\
    #include <iostream>\n#include <vector>\n#include <algorithm>\n#include <iterator>\n\
    \nint main()\n{\n    std::vector<int> v = { 1, 5, 2, 15, 3, 10 };\n    auto result\
    \ = std::find(begin(v), end(v), 5);\n    if (result != end(v))\n    {\n      \
    \  std::cout << \"Element found: \" << *result;\n    }\n    else\n    {\n    \
    \    std::cout << \"Element not found.\";\n    }\n}\n```\n\nThere is also a conditional\
    \ find_if function which accepts a predicate. Depending on the predicate value,\
    \ the function performs a search on elements for which the predicate returns true.\
    \ More on this when we discuss lambda expressions.\n\n### 38.4.3 std::copy\n\n\
    **std::copy** function copies the elements from one container to another. It can\
    \ copy a range of elements marked with [starting_iterator, ending_iterator) from\
    \ the starting container to a specific position marked with (destination_iterator)\
    \ in the destination container. The function is declared inside the <algorithm>\
    \ header. Before we copy the elements, we need to reserve enough space in the\
    \ destination vector by supplying the size to its constructor. Example:\n\n```cpp\n\
    #include <iostream>\n#include <vector>\n#include <algorithm>\n\nint main() {\n\
    \    std::vector<int> copy_from_v = { 1, 2, 3, 4, 5 };\n    std::vector<int> copy_to_v(5);\
    \ // reserve the space for 5 elements\n    std::copy(copy_from_v.begin(), copy_from_v.end(),\
    \ copy_to_v.begin());\n    for (auto el : copy_to_v) {\n        std::cout << el\
    \ << '\\n';\n    }\n}\n```\n\nExplanation: we define a source vector called copy_from_v\
    \ and initialize it with some values. Then we define a copy_to_v destination vector\
    \ and reserve enough space for it to hold 5 elements by supplying the number 5\
    \ to its constructor. Then we copy all the elements from the beginning to an end\
    \ of a source vector to the (beginning of) destination vector.\n\nTo copy only\
    \ the first 3 elements, we would use the appropriate range marked with copy_from_v.begin()\
    \ and copy_from_v.begin() + 3. And we only need to reserve the space for 3 elements\
    \ in the destination vector:\n\n```cpp\n#include <iostream>\n#include <vector>\n\
    #include <algorithm>\n\nint main(){\n    std::vector<int> copy_from_v = { 1, 2,\
    \ 3, 4, 5 };\n    std::vector<int> copy_to_v(3);\n    std::copy(copy_from_v.begin(),\
    \ copy_from_v.begin() + 3, copy_to_v.begin());\n}\n```\n"
  mdcn: "\n\n## 第 38 章 C++ 标准库及其扩展\n\n`el` 是 `vector` 中每个元素的拷贝。如果我们想直接操作 `vector`\
    \ 的实际元素，我们需要使用引用类型：\n\n```cpp\n#include <iostream>\n#include <vector>\n\nint main()\n\
    {\n    std::vector<int> v = { 1, 2, 3, 4, 5 };\n    v.push_back(10);\n\n    for\
    \ (int& el : v) {\n        std::cout << el << '\\n';\n    }\n}\n```\n\n现在，`el`\
    \ 是真正的 vector 元素，因此我们对 `el` 进行的任何更改都将应用到实际的元素上。\n\n我们还可以使用 `auto` 标识符，让编译器推断容器中元素的类型：\n\
    \n```cpp\n#include <iostream>\n#include <vector>\n\nint main()\n{\n    std::vector<int>\
    \ v = { 1, 2, 3, 4, 5 };\n    v.push_back(10);\n\n    for (auto el : v) {\n  \
    \      std::cout << el << '\\n';\n    }\n}\n```\n\n为了遍历一个字符串的 `vector`，我们会使用 `const\
    \ auto&` 标识符，因为出于性能考虑，我们应该通过 `const` 引用传递字符串：\n\n```cpp\n#include <iostream>\n\
    #include <vector>\n#include <string>\n\nint main() {\n    std::vector<std::string>\
    \ v = { \"Hello\", \"World\", \"C++\" };\n    v.push_back(\"Is great!\");\n  \
    \  for (const auto& el : v) {\n        std::cout << el << '\\n';\n    }\n}\n```\n\
    \n### 38.3 迭代器\n\n容器拥有迭代器。迭代器类似于指向容器元素的指针。指向 `vector` 第一个元素的迭代器通过成员函数 `.begin()`\
    \ 表示。指向最后一个元素之后（而非最后一个元素本身）的迭代器通过成员函数 `.end()` 表示。迭代器可以递或或减。我们使用迭代器打印 `vector`\
    \ 的内容：\n\n```cpp\n#include <iostream>\n#include <vector>\n\nint main() {\n   \
    \ std::vector<int> v = { 1, 2, 3, 4, 5 };\n    for (auto it = v.begin(); it!=v.end();\
    \ it++) {\n        std::cout << *it << '\\n';\n    }\n}\n```\n\n## 第 38 章 C++\
    \ 标准库及其扩展\n\n只要 `vector` 的迭代器 `it` 不等于 `v.end()`，我们就继续遍历 `vector`。当当前迭代器等于 `v.end()`\
    \ 时，`for` 循环终止。`v.end()` 是一个表示到达容器末尾（不是最后一个元素，而是最后一个元素之后）的信号。人们会体会到使用基于范围的循环（range-based\
    \ loops）比这种在 `for` 循环中使用旧式的迭代器用法要方便得多。\n\n既然我们已经了解了迭代器，就可以用它们来从 `vector` 中删除元素。假设我们想删除第三个元素。我们将迭代器指向第三个元素，并使用成员函数\
    \ `.erase(iterator_name)`：\n\n```cpp\n#include <iostream>\n#include <vector>\n\
    \nint main()\n{\n    std::vector<int> v = { 1, 2, 3, 4, 5 };\n    auto it = v.begin()\
    \ + 3;\n    v.erase(it);\n\n    for (auto el : v)\n    {\n        std::cout <<\
    \ el << '\\n';\n    }\n}\n```\n\n我们之前还提到了另一组容器，称为关联容器（associative containers）。这些容器是以二叉树的形式实现的。它们允许快速搜索，且容器中的数据是经过排序的。这些关联容器包括\
    \ `std::set` 和 `std::map`。`set` 存储唯一值，`map` 存储键值对元素。请注意，还有另一组允许重复值的关联容器，它们是 `std::multi_set`\
    \ 和 `std::multi_map`。\n\n### 38.4 算法与工具类\n\nC++ 标准库提供了一组位于 `<algorithm>` 头文件的有用函数。这些函数允许我们对容器执行各种操作。\n\
    \n### 38.4.1 std::sort\n\n例如，如果我们想对容器进行排序，可以使用 `std::sort` 函数。要按升序对 `vector` 进行排序，我们使用：\n\
    \n`std::sort` 函数对元素范围进行排序。它接受表示范围开始和结束的参数（确切地说，是范围结束之后的位置）。在这里，我们传递了整个 `vector`\
    \ 的范围，其中 `v.begin()` 代表开始，`v.end()` 代表范围结束之后。\n\n要按降序对容器进行排序，我们传递一个名为比较器（comparator）的额外参数。这里有一个内置的比较器\
    \ `std::greater`，它使用 `>` 运算符进行比较，并允许 `std::sort` 函数按降序排列数据。示例下：\n\n```cpp\n#include\
    \ <iostream>\n#include <vector>\n#include <algorithm>\n#include <functional>\n\
    \nint main() {\n    std::vector<int> v = { 1, 5, 2, 15, 3, 10 };\n    std::sort(v.begin(),\
    \ v.end(), std::greater<int>());\n    for (auto el : v)\n    {\n        std::cout\
    \ << el << '\\n';\n    }\n}\n```\n\n比较器或比较函数是定义在 `<functional>` 头中的所谓的函数对象（function\
    \ object）。我们可以通过该头定义自定义的函数对象。\n\n`std::sort` 的第三个参数可以是谓词（predicate）或 Lambda 表达式。`std::sort`\
    \ 函数通常接受谓词。稍后会详细讨论 `std::sort`。\n\n### 38.4.2 std::find\n\n为了在 `vector` 中查找某个值并返回指向该元素的迭代器，我们使用：\n\
    \n```cpp\n#include <iostream>\n#include <vector>\n#include <algorithm>\n\nint\
