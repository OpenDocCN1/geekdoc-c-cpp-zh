    \ and observe the different outcomes of a floating-point division where at least\
    \ one of the operands is of type double. Print out the values afterward.\n\n```cpp\n\
    #include <iostream>\nint main()\n{\n    int x = 9 / 2;\n    std::cout << \"The\
    \ result is: \" << x << '\\n';\n    double d = 9 / 2;\n    std::cout << \"The\
    \ result is: \" << d << '\\n';\n    d = 9.0 / 2;\n    std::cout << \"The result\
    \ is: \" << d;\n}\n```\n"
  mdcn: "\n\n## 6.3 定义\n\n编写一个程序，在 `main` 函数内部定义三个变量。变量的类型分别为 `char`、`int` 和 `double`。变量名可以任意，初始化也可以任意。\n\
    \n```cpp\nint main()\n{\n    char mychar = 'a';\n    int myint = 123;\n    double\
    \ mydouble = 456.78;\n}\n```\n\n## 6.4 初始化\n\n编写一个程序，在 `main` 函数内部定义三个变量。变量的类型分别为\
    \ `char`、`int` 和 `double`。变量名可以任意，初始化也可以任意。使用初始化列表进行初始化。随后打印这些值。\n\n```cpp\n#include\
    \ <iostream>\n\nint main()\n{\n    char mychar{ 'a' };\n    int myint{ 123 };\n\
    \    double mydouble{ 456.78 };\n    std::cout << \"The value of a char variable\
    \ is: \" << mychar << '\\n';\n    std::cout << \"The value of an int variable\
    \ is: \" << myint << '\\n';\n    std::cout << \"The value of a double variable\
    \ is: \" << mydouble << '\\n';\n}\n```\n\n## 第 7 章\n\n# 运算符\n\n## 7.1 赋值运算符\n\n\
    赋值运算符 `=` 用于为变量/对象赋值：\n\n```cpp\nint main() {\n    char mychar = 'c';      //\
    \ 定义一个 char 类型变量 mychar\n    mychar = 'd';           // 给 mychar 赋新值\n    int\
    \ x = 123;            // 定义一个整数变量 x\n    x = 456;                // 给 x 赋新值\n\
    \    int y = 789;            // 定义一个整数变量 y\n    y = x;                  // 将 x\
    \ 的值赋给它\n}\n```\n\n## 7.2 算术运算符\n\n我们可以使用算术运算符进行算术运算。其中包含：\n\n- + // 加法\n- - //\
    \ 减法\n- * // 乘法\n- / // 除法\n- % // 取模\n\n## 第 7 章 运算符\n\n示例：\n\n```cpp\n#include\
    \ <iostream>\n\nint main()\n{\n    int x = 123;\n    int y = 456;\n    int z =\
    \ x + y; // 加法\n    z = x - y; // 减法\n    z = x * y; // 乘法\n    z = x / y; //\
    \ 除法\n    std::cout << \"The value of z is: \" << z << '\\n';\n}\n```\n\n在我们的示例中，整数除法的结果为\
    \ 0。这是因为当操作数都是整数时，整数除法的结果会向零截断。在表达式 `x / y` 中，`x` 和 `y` 是操作数，`/` 是运算符。\n\n如果我们想要浮点数结果，我们需要使用\
    \ `double` 类型，并确保除法操作数中至少有一个也是 `double` 类型\n\n```cpp\n#include <iostream>\n\n\
    int main()\n{\n    int x = 123;\n    double y = 456;\n    double z = x / y;\n\
    \    std::cout << \"The value of z is: \" << z << '\\n';\n}\n```\n\n同样地，我们可以拥有：\n\
    \n```cpp\n#include <iostream>\nint main()\n{\n    double z = 123 / 456.0;\n  \
    \  std::cout << \"The value of z is: \" << z << '\\n';\n}\n```\n\n结果将是相同的。\n\n\
    ## 7.3 复合赋值运算符\n\n复合运算符允许我们用一个运算符执行算术运算并赋值结果：\n\n- += // 复合加法\n- -= // 复合减法\n\
    - *= // 复合乘法\n- /= // 复合除法\n- %= // 复合取模\n\n示例：\n\n```cpp\n#include <iostream>\n\
    int main()\n{\n    int x = 123;\n    x += 10; // 同于 x = x + 10\n    x -= 10; //\
    \ 同于 x = x - 10\n    x *= 2; // 同于 x = x * 2\n    x /= 3; // 同于 x = x / 3\n}\n\
    ```\n\n## 第 7 章 运算符\n\n## 7.4 增/减运算符\n\n增/减运算符用于增加或减少对象的值。运算符有：\n\n- +x // 前增运算符\n\
    - x++ // 后置增运算符\n- --x // 前减运算符\n- x-- // 后置减运算符\n\n简单示例：\n\n```cpp\n#include\
    \ <iostream>\n\nint main() {\n    int x = 123;\n    x++; // 给 x的值加 1\n    ++x;\
    \ // 给 x的值加 1\n    --x; // 给 x的值减 1\n    x--; // 给 x的值减 1\n}\n```\n\n前增和后置增运算符都会增加对象的值，前减和后置减运算符都会从对象的值中减\
    \ 1。从实现机制上来说，区别在于：对于前增运算符，先加 1，然后在表达式中使用对象；对于后置增运算符，先在表达式中使用对象，然后再加 1。这对后续语句没有影响。区别在于表达式中使用的时机。\n\
    \n## 第 8 章\n\n# 标准输入\n\nC++ 提供了接受输入的功能。我们可以将标准输入视为键盘。一个接受整数并打印它的简单示例：\n\n```cpp\n\
    #include <iostream>\n\nint main()\n{\n    std::cout << \"Please enter a number:\
    \ \";\n    int x;\n    std::cin >> x;\n    std::cout << \"You entered: \" << x;\n\
    }\n```\n\n`std::cin` 是标准输入流，它使用 `>>` 运算符将内容提取到变量中。`std::cin >> x;` 意味着从标准输入读取。`cin`\
    \ 对象位于 `std` 命名空间中。因此，`std::cout <<` 用于输出数据（到屏幕），而 `std::cin >>` 用于输入数据（来自键盘）。\n\
    \n## 第 8 章 标准输入\n\n我们可以通过多个 `>>` 运算符从标准输入接受多个值：\n\n```cpp\n#include <iostream>\n\
    \nint main()\n{\n    std::cout << \"Please enter two numbers separated by a space\
    \ and press enter: \";\n    int x = 0;\n    int y = 0;\n    std::cin >> x >> y;\n\
    \    std::cout << \"You entered: \" << x << \" and \" << y << \"\\n\";\n}\n```\n\
    \n我们可以接受不同类型的值：\n\n```cpp\n#include <iostream>\n\nint main()\n{\n    std::cout\
    \ << \"Please enter a character, an integer and a double: \";\n    char c = 0;\n\
    \    int x = 0;\n    double d = 0.0;\n    std::cin >> c >> x >> d;\n    std::cout\
    \ << \"You entered: \" << c << \", \" << x << \" and \" << d;\n}\n```\n\n## 第\
    \ 9 章\n\n# 练习\n\n## 9.1 标准输入\n\n编写一个程序从标准输入接受一个整数并打印它。\n\n```cpp\n#include <iostream>\n\
    int main()\n{\n    std::cout << \"Please enter a number: \";\n    int x;\n   \
    \ std::cin >> x;\n    std::cout << \"You entered: \" << x;\n}\n```\n\n## 9.2 两个输入\n\
    \n编写一个程序从标准输入接受两个整数并打印它们。\n\n```cpp\n#include <iostream>\nint main()\n{\n    std::cout\
    \ << \"Please enter two numbers: \";\n    int x;\n    int y;\n    std::cin >>\
    \ x >> y;\n    std::cout << \"You entered: \" << x << \" and \" << y;\n}\n```\n\
    \n## 9.3 多个输入\n\n编写一个程序从标准输入接受类型分别为 `char`、`int` 和 `double` 的值。打印这些值。\n\n```cpp\n\
    #include <iostream>\nint main()\n{\n    std::cout << \"Please enter a character,\
    \ an integer and a double: \";\n    char c;\n    int x;\n    double d;\n    std::cin\
    \ >> c >> x >> d;\n    std::cout << \"You entered: \" << c << \", \" << x << \"\
    \ and \" << d;\n}\n```\n\n## 9.4 输入与算术运算\n\n编写一个程序接受两个整数，将它们求和，并将结果赋值给第三个整数。打印结果。\n\
    \n```cpp\n#include <iostream>\nint main()\n{\n    std::cout << \"Please enter\
    \ two numbers: \";\n    int x;\n    int y;\n    std::cin >> x >> y;\n    int z\
    \ = x + y;\n    std::cout << \"The result is: \" << z;\n}\n```\n\n## 9.5 后置增与复合赋值\n\
    \n编写一个程序，定义一个值为 123 的整变量 `x`，在下一语句中对其进行后置增，并在后续语句中使用复合赋值运算符加 20。随后打印该值。\n\n```cpp\n\
    #include <iostream>\nint main()\n{\n    int x = 123;\n    x++;\n    x += 20;\n\
    \    std::cout << \"The result is: \" << x;\n}\n```\n\n## 9.6 整数除法与浮点除法\n\n编写一个程序除\
    \ 9 以 2并将结果赋值给 `int` 和 `double` 变量。然后修改其中一个操作数使其变为 `double` 类型，并观察至少一个操作数为 `double`\
    \ 类型时浮点除法的不同结果。随后打印这些值。\n\n```cpp\n#include <iostream>\nint main()\n{\n    int\
    \ x = 9 / 2;\n    std::cout << \"The result is: \" << x << '\\n';\n    double\
    \ d = 9 / 2;\n    std::cout << \"The result is: \" << d << '\\n';\n    d = 9.0\
    \ / 2;\n    std::cout << \"The result is: \" << d;\n}\n```\n\n"
