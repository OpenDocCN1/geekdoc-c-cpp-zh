    # CHAPTER 40


    # C++ Standards


    C++ is an ISO standardized programing language. There are different C++ standards:


    +   - C++98

    - C++03

    - C++11

    - C++14

    - C++17 - Modern C++

    - C++20


    Everything starting with C++11 is referred to as “Modern C++.” These standards
    define the language in great technical detail. They also serve as manuals for
    C++ compiler writers. It is a mind-boggling set of rules and specifications. The
    C++ standards can be bought, or a draft version can be downloaded for free. These
    drafts closely resemble the final C++ standard. When C++ code can be successfully
    transferred and compiled on different platforms (machines or compilers), and when
    C++ implementation closely follows the standard, we say that the code is often
    referred to as portable C++.


    The standards surrounded by braces represent the so-called “Modern C++.” Each
    standard describes the language and introduces new language and library features.
    We may also introduce changes to the existing rules. We will describe notable
    features in each of these standards.


    # 40.1 C++11


    C++11 is an ISO C++ standard, published in 2011. To compile, add the `-std=c++11`
    flag when compiling with g++ or clang. If using Visual Studio, choose Project
    / Options / Configuration Properties / C/C++ / Language / C++ Language Standard
    and choose C++11. New Visual Studio versions already support this standard out
    of the box. We have already described the notable C++11 features in previous chapters,
    and here we will briefly go through them once again and introduce a few new ones:


    *Note:*'
- md: "\n# CHAPTER 40 C++ STANDARDS\n\n## 40.1.1 Automatic Type Deduction\n\nThis\
    \ standard introduces the auto keyword which deduces the type of the variable\
    \ based on the variable's initializer:\n\n```cpp\nint main()\n{\n    auto mychar\
    \ = 'A';\n    auto myint = 123 + 456;\n    auto mydouble = 456.789;\n}\n```\n\n\
    ## 40.1.2 Range-based Loops\n\nThe range-based loops allow us to iterate over\
    \ the range, such as C++ standard-library containers:\n\n```cpp\n#include <iostream>\n\
    #include <vector>\n```\n\n```cpp\nint main()\n{\n    std::vector<int> v = { 10,\
    \ 20, 40, 5, -20, 75 };\n    for (auto el : v)\n    {\n        std::cout << el\
    \ << '\\n';\n    }\n}\n```\n\nThe range-based for loop is of the following form:\
    \ (type element container). This is read as for each element in a container (do\
    \ something).\n\n## 40.1.3 Initializer Lists\n\nInitializer lists, represented\
    \ by braces {} allow us to initialize objects in a uniform way.\nWe can initialize\
    \ single objects:\n\n```cpp\nint main()\n{\n    int x{ 123 };\n    int y = { 456\
    \ };\n    double d{ 3.14 };\n}\n```\n\nAnd containers:\n\n```cpp\n#include <vector>\n\
    int main()\n{\n    std::vector<int> v = { 1, 2, 3, 4, 5 };\n}\n```\n\nList initialization\
    \ also prevents narrowing conversions. If we tried to initialize the integer object\
    \ with a double value inside the initializer list, the compilation would fail:\n\
    \n```cpp\nint main()\n{\n    int x = { 123.45 }; // Error, does not allowing narrowing\n\
    }\n```\n\nWhen initializing our objects, we should prefer initializer lists {}\
    \ to old-style parentheses ().\n\n## 40.1.4 Move Semantics\n\nC++ 11 standard\
    \ introduces the move semantics for classes. We can initialize our objects by\
    \ moving the data from other objects. This is achieved through move constructors\
    \ and move assignment operators. Both accept the so-called rvalue reference as\
    \ an argument. Lvalue is an expression that can be used on the left-hand side\
    \ of the assignment operation. Rvalues are expressions that can be used on the\
    \ right-hand side of an assignment. The rvalue reference has the signature of\
    \ some_type&. To cast an expression to an rvalue reference, we use the std::move\
    \ function. A simple move constructor and move assignment signature are:\n\n```cpp\n\
    class MyClass\n{\npublic:\n    MyClass(MyClass&& otherobject) // move constructor\n\
    \    {\n        // implement the move logic here\n    }\n    MyClass& operator=(MyClass&&\
    \ otherobject) // move assignment operator\n    {\n        // implement the copy\
    \ logic here\n        return *this;\n    }\n};\n```\n\n## 40.1.5 Lambda Expressions\n\
    \nLambda expressions are anonymous function objects. They allow us to write a\
    \ short code snippet to be used as a standard-library function predicate. Lambdas\
    \ have a capture list, marked by [] where we can capture local variables by reference\
    \ or copy, parameter list with optional parameters marked with (), and a lambda\
    \ body, marked with {}. An empty lambda looks like [] () {}: A simple example\
    \ of counting only the even numbers in a set using the lambda as the predicate:\n\
    \n```cpp\n#include <iostream>\n#include <vector>\n#include <algorithm>\n```\n\n\
    ```cpp\nint main()\n{\n    std::vector<int> v = { 1, 2, 3, 4, 5 };\n    auto counterven\
    \ = std::count_if(std::begin(v), std::end(v),\n        [](int x) {return x % 2\
    \ == 0;}); // lambda expression\n    std::cout << \"The number of even vector\
    \ elements is: \" << counterven;\n}\n```\n\n## 40.1.6 The constexpr Specifier\n\
    \nThe constexpr promises the variable or a function can be evaluated during compile-time.\
    \ If the expression can not be evaluated during compile-time, the compiler emits\
    \ an error:\n\n```cpp\nint main()\n{\n    constexpr int n = 123; //OK, 123 is\
    \ a compile-time constant\n    // expression\n    constexpr double d = 456.78;\
    \ //OK, 456.78 is a compile-time constant\n    // expression\n    constexpr double\
    \ d2 = d; //OK, d is a constant expression\n    int x = 123;\n    constexpr int\
    \ n2 = x; //compile-time error\n                         // the value of x is\
    \ not known during\n                         // compile-time\n}\n```\n\n## 40.1.7\
    \ Scoped Enumerators\n\nThe C++11 standard introduces the scoped enumerators.\
    \ Unlike the old enumerators, the scoped enumerators do not leak their names into\
    \ the surrounding scope. Scoped enums have the following signature: enum class\
    \ Enumerator_Name {value1, value2 etc} signature. A simple example of a scoped\
    \ enum is:\n\n```cpp\nenum class MyEnum\n{\n    myfirstvalue,\n    mysecondvalue,\n\
    \    mythirdvalue\n};\n```\n\n```cpp\nint main()\n{\n    MyEnum myenum = MyEnum::myfirstvalue;\n\
    }\n```\n\n## 40.1.8 Smart Pointers\n\nSmart pointers point to objects, and when\
    \ the pointer goes out of scope, the object gets destroyed. This makes them smart\
    \ in the sense that we do not have to worry about manual deallocation. There are\
    \ two kinds of smart pointers, the unique pointer with `std::unique_ptr<type>`\
    \ signature and a shared pointer with `std::shared_ptr<type>` signature. The difference\
    \ between the two is that we can have only one pointer pointing at the object.\
    \ In contrast, we can have multiple shared pointers pointing at an object. When\
    \ the last shared pointer goes out of scope, the object gets destroyed, and the\
    \ memory gets deallocated. A unique pointer example:\n\n```cpp\n#include <iostream>\n\
    #include <memory>\nint main()\n{\n    std::unique_ptr<int> p(new int{123 }); //\
    \ p goes out of scope here, the memory gets destroyed\n}\n```\n\nA unique pointer\
    \ can not be copied, only moved. To have multiple pointers pointing at the same\
    \ object, we would write:\n\n```cpp\n#include <iostream>\n#include <memory>\n\n\
    int main()\n{\n    std::shared_ptr<int> p1(new int{123 });\n    std::shared_ptr<int>\
    \ p2 = p1;\n    std::shared_ptr<int> p3 = p1; // Shared pointers can be copied.\
    \ It is said they share ownership of the object. When the last shared pointer\
    \ goes out of scope, the pointed-to object gets destroyed, and the memory gets\
    \ deallocated.\n}\n```\n\n## 40.1.9 std::unordered_set\n\nThe std::unordered_set\
    \ is a container that allows for constant time insertion, searching, and removal\
    \ of elements. This container is implemented as an array of buckets of linked\
    \ lists. The hash value of each element is calculated, and the object is placed\
    \ into an appropriate bucket based on the hash value. The elements are not sorted\
    \ in any particular order. To define an unordered set, we need to include the\
    \ <unordered_set> header. Example:\n\n```cpp\n#include <iostream>\n#include <unordered_set>\n\
    int main()\n{\n    std::unordered_set<int> myunorderedset = { 1, 2, 5, 4, 7, 10\
    \ };\n    for (auto el : myunorderedset)\n    {\n        std::cout << el << '\\\
    n';\n    }\n}\n```\n\nThe values are not sorted but are unique. To insert single\
    \ or multiple values into an unordered_set, we use the .insert() member function:\n\
    \n```cpp\n#include <iostream>\n#include <unordered_set>\n\nint main()\n{\n   \
    \ std::unordered_set<int> myunorderedset = { 1, 2, 5, 4, 7, 10 };\n    myunorderedset.insert(6);\
    \ // insert a single value\n    myunorderedset.insert({ 8, 15, 20 }); // insert\
    \ multiple values\n    for (auto el : myunorderedset) {\n        std::cout <<\
    \ el << '\\n';\n    }\n}\n```\n\nTo delete a value from an unordered_set, we use\
    \ the .erase() member function:\n\n```cpp\n#include <iostream>\n#include <unordered_set>\n\
    \nint main()\n {\n    std::unordered_set<int> myunorderedset = { 1, 2, 5, 4, 7,\
    \ 10 };\n    myunorderedset.erase(-4); // erase a single value\n    for (auto\
    \ el : myunorderedset) {\n        std::cout << el << '\\n';\n    }\n}\n```\n\n\
    ## 40.1.10 std::unordered_map\n\nSimilar to std::unordered_set, there is also\
    \ an std::unordered_map, an unordered container of key-value pairs with unique\
    \ keys. This container allows for fast insertion, searching, and removal of elements.\
    \ The container is also implemented as buckets. What element goes into what bucket\
    \ depends on the element's key hash value. To define an unordered map, we include\
