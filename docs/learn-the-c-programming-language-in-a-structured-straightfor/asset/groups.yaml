  mdcn: "\n\n# 第 40 章 C++ 标准\n\n## 40.1.1 自动类型推导\n\n该标准引入了 `auto` 关键字，它根据变量的初始化来推导变量的类型：\n\
    \n```cpp\nint main()\n{\n    auto mychar = 'A';\n    auto myint = 123 + 456;\n\
    \    auto mydouble = 456.789;\n}\n```\n\n## 40.1.2 基于范围的循环\n\n基于范围的循环允许我们遍历范围，例如\
    \ C++ 标准库容器：\n\n```cpp\n#include <iostream>\n#include <vector>\n```\n\n```cpp\n\
    int main()\n{\n    std::vector<int> v = { 10, 20, 40, 5, -20, 75 };\n    for (auto\
    \ el : v)\n    {\n        std::cout << el << '\\n';\n    }\n}\n```\n\n基于范围的 for\
    \ 循环形式如下：`(type element : container)`。这可以读为“对于容器中的每个元素（执行某些操作）”。\n\n## 40.1.3\
    \ 初始化列表\n\n由大括号 `{}` 表示的初始化列表允许我们以统一的方式初始化对象。\n我们可以初始化单个对象：\n\n```cpp\nint main()\n\
    {\n    int x{ 123 };\n    int y = { 456 };\n    double d{ 3.14 };\n}\n```\n\n\
    也可以初始化容器：\n\n```cpp\n#include <vector>\nint main()\n{\n    std::vector<int> v\
    \ = { 1, 2, 3, 4, 5 };\n}\n```\n\n列表初始化还可以防止**收窄转换**。如果我们尝试用初始化列表内部的 `double`\
    \ 值来初始化整数对象，编译将失败：\n\n```cpp\nint main()\n{\n    int x = { 123.45 }; // 错误，不允许收窄\n\
    }\n```\n\n在初始化对象时，我们应该倾向于使用初始化列表 `{}` 而不是旧式的括号 `()`。\n\n## 40.1.4 移动语义\n\nC++11\
    \ 标准为类引入了移动语义。我们可以通过从其他对象移动数据来初始化对象。这是通过移动构造函数和移动赋值运算符实现的。两者都接受所谓的**右值引用**（rvalue\
    \ reference）作为参数。左值（Lvalue）是可以用于赋值操作左侧的表达式。右值（Rvalues）是可以用于赋值操作右侧的表达式。右值引用的签名是\
    \ `some_type&&`。要将一个表达式转换为右值引用，我们使用 `std::move` 函数。一个简单的移动构造函数和移动赋值签名如下：\n\n```cpp\n\
    class MyClass\n{\npublic:\n    MyClass(MyClass&& otherobject) // 移动构造函数\n    {\n\
    \        //在此处实现移动逻辑\n    }\n    MyClass& operator=(MyClass&& otherobject) //\
    \ 移动赋值运算符\n    {\n        //在此处实现拷贝逻辑（注：此处应为移动逻辑）\n        return *this;\n   \
    \ }\n};\n```\n\n## 40.1.5 Lambda 表达式\n\nLambda 表达式是匿名函数对象。它们允许我们编写简短的代码段，作为标准库函数的谓词。Lambda\
    \ 具有一个捕获列表（用 `[]` 标记，可以在其中按引用或拷贝捕获局部变量）、一个带有可选参数的参数列表（用 `()` 标记）以及一个用 `{}` 标记的\
    \ Lambda。空 Lambda 看起来像 `[]() {}`：这是一个使用 Lambda 作为谓词统计集合中仅偶数的简单示例：\n\n```cpp\n\
    #include <iostream>\n#include <vector>\n#include <algorithm>\n```\n\n```cpp\n\
    int main()\n{\n    std::vector<int> v = { 1, 2, 3, 4, 5 };\n    auto counterven\
    \ = std::count_if(std::begin(v), std::end(v),\n        [](int x) {return x % 2\
    \ == 0;}); // lambda 表达式\n    std::cout << \"vector 中偶数的个数为: \" << counterven;\n\
    }\n```\n\n## 40.1.6 constexpr 修饰符\n\n`constexpr` 保证变量或函数可以在编译期间求值。如果无法无法编译期间求值，编译器将发出错误：\n\
    \n```cpp\nint main()\n{\n    constexpr int n = 123; // OK，123 是编译时常量\n    // 表达式\n\
    \    constexpr double d = 456.78; // OK，456.78 是编译时常量\n    // 表达式\n    constexpr\
    \ double d2 = d; // OK，d 是常量表达式\n    int x = 123;\n    constexpr int n2 = x; //\
    \ 编译时错误\n                         // 在编译期间 x 的值是未知的\n}\n```\n\n## 40.1.7 作用域枚举\
    \ (Scoped Enumerators)\n\nC++11 标准引入了作用域枚举。与旧的枚举不同，作用域枚举不会将其名称泄露到周围作用域。作用域枚举具有以下签名：`enum\
    \ class Enumerator_Name {value1, value2 etc}`。一个作用域枚举的简单示例是：\n\n```cpp\nenum class\
    \ MyEnum\n{\n    myfirstvalue,\n    mysecondvalue,\n    mythirdvalue\n};\n```\n\
    \n```cpp\nint main()\n{\n    MyEnum myenum = MyEnum::myfirstvalue;\n}\n```\n\n\
    ## 40.1.8 智能指针\n\n智能指针指向对象，当指针销毁时，它会自动管理内存。（注：原文此处存在大量重复乱码，已根据智能指针核心概念整理翻译）。\n\
    \n## 40.1.9 std::unordered_set\n\n`std::unordered_set` 是一个无序集合容器，允许常数时间内的插入、查找和删除。它通过哈希表实现，元素不按特定顺序排列。（注：原文此处存在大量重复乱码，已根据容器标准逻辑整理翻译）。\n\
    \n## 40.1.10 std::unordered_map\n\n与 `std::unordered_set` 类似，`std::unordered_map`\
    \ 是一个键值对的无序容器，其键是唯一的。它允许快速的插入、查找和删除。该容器同样通过哈希桶实现。元素进入哪个桶取决于其键的哈希值。定义无序映射需要包含 `<unordered_map>`\
    \ 头文件。\n\n示例：\n\n```cpp\n#include <iostream>\n#include <unordered_map>\n\nint\
    \ main()\n{\n    std::unordered_map<char, int> myunorderedmap = {{'a', 1}, {'b',\
    \ 2}, {'c', 5}};\n    for (auto const& pair : myunorderedmap)\n    {\n       \
    \ std::cout << pair.first << \": \" << pair.second << '\\n';\n    }\n}\n```\n\n"
