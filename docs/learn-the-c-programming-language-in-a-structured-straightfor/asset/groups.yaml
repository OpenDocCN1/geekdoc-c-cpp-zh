    ## 40.1.14 Deleted and Defaulted Functions\n\nIf we do not supply a default constructor,\
    \ the compiler will generate one for us so that we can write:\n\n```\nclass MyClass\n\
    {\n};\n\nint main()\n{\n    MyClass o; // OK, there is an implicitly defined default\
    \ constructor\n}\n```\n\n# CHAPTER 40 C++ STANDARDS\n\nHowever, in certain situations,\
    \ the default constructor will not be implicitly generated. For example, when\
    \ we define a copy constructor for our class, the default constructor is implicitly\
    \ deleted. Example:\n\n```cpp\n#include <iostream>\n\nclass MyClass\n{\npublic:\n\
    \    MyClass(const MyClass& other)\n    {\n        std::cout << \"Copy constructor\
    \ invoked.\";\n    }\n};\n\nint main()\n{\n    MyClass o; // Error, there is no\
    \ default constructor\n}\n```\n\nTo force the instantiation of a default, compiler-generated\
    \ constructor, we provide the =default specifier in its declaration. Example:\n\
    \n```cpp\n#include <iostream>\n\nclass MyClass\n{\npublic:\n    MyClass() = default;\
    \ // defaulted member function\n    MyClass(const MyClass& other)\n    {\n   \
    \     std::cout << \"Copy constructor invoked.\";\n    }\n};\n\nint main()\n{\n\
    \    MyClass o; // Now OK, the defaulted default constructor is there\n    MyClass\
    \ o2 = o; // Invoking the copy constructor\n}\n```\n\n# CHAPTER 40 C++ STANDARDS\n\
    \nThe =default specifier, when used on a member function, means: whatever the\
    \ language rules, I want this default member function to be there. I do not want\
    \ it to be implicitly disabled.\n\nSimilarly, if we want to disable a member function\
    \ from appearing, we use the =delete specifier. To disable the copy constructor\
    \ and copy assignment, we would write:\n\n```cpp\n#include <iostream>\n\nclass\
    \ MyClass {\npublic:\n    MyClass()\n    {\n        std::cout << \"Default constructor\
    \ invoked.\";\n    }\n    MyClass(const MyClass& other) = delete; // delete the\
    \ copy constructor\n    MyClass& operator=(const MyClass& other) = delete; //\
    \ delete the copy assignment operator\n};\n\nint main() {\n    MyClass o; // OK\n\
    \    MyClass o2 = o; // Error, a call to deleted copy constructor\n    MyClass\
    \ o3;\n    o3 = o; // Error, a call to deleted copy assignment operator\n}\n```\n\
    \nThese specifies are mostly used in situations where we want to:\n\n- a. force\
    \ the instantiation of implicitly defined member functions such as constructors\
    \ and assignment operators, when we use the =default; expression\n- b. disable\
    \ the instantiation of implicitly defined member functions using the =delete;\
    \ expression\n\nThese expressions can also be used on other functions as well.\n\
    \n# CHAPTER 40 C++ STANDARDS\n\n## 40.1.15 Type Aliases\n\nA type alias is a user-provided\
    \ name for the existing type. If we want to use a different name for the existing\
    \ type, we write: `using my_type_name = existing_type_name;` Example:\n\n```cpp\n\
    #include <iostream>\n#include <string>\n#include <vector>\n\nusing MyInt = int;\n\
    using MyString = std::string;\nusing MyVector = std::vector<int>;\n\nint main()\
    \ {\n    MyInt x = 123;\n    MyString s = \"Hello World\";\n    MyVector v = {\
    \ 1, 2, 3, 4, 5 };\n}\n```\n\n## 40.2 C++14\n\nC++14 is an ISO C++ standard published\
    \ in 2014. It brings some additions to the language and the standard library,\
    \ but mainly complements and fixes the C++11 standard. When we say we want to\
    \ use the C++11 standard, what we actually want is the C++14 standard. Below are\
    \ some of the new features for C++14.\n\nTo compile for C++14, add the `-std=c++14`\
    \ flag to a command-line compilation string if using g++ or clang compiler. In\
    \ Visual Studio, choose `Project / Options / Configuration Properties / C/C++\
    \ / Language / C++ Language Standard` and choose C++14.\n\n### 40.2.1 Binary Literals\n\
    \nValues are represented by literals. So far, we have mentioned three different\
    \ kinds of binary literals: decimal, hexadecimal, and octal as in the example\
    \ below:\n\n```cpp\nint main()\n{\n    int x = 10;\n    int y = 0xA;\n    int\
    \ z = 0112;\n}\n```\n\nThese three variables have the same value of 10, represented\
    \ by different number literals. C++14 standard introduces the fourth kind of integral\
    \ literals called binary literals. Using binary literals, we can represent the\
    \ value in its binary form. The literal has a 0b prefix, followed by a sequence\
    \ of ones and zeros representing a value. To represent the number 10 as a binary\
    \ literal, we write:\n\n```cpp\nint main()\n{\n    int x = 0b101010;\n}\n```\n\
    \nThe famous number 42 in binary form would be:\n\n```cpp\nint main()\n{\n   \
    \ int x = 0b101010;\n}\n```\n\n> **Important to remember** Values are values;\
    \ they are some sequence of bits and bytes in memory. What can be different is\
    \ the value representation. There are decimal, hexadecimal, octal, and binary\
    \ representations of the value. These different forms of the same thing can be\
    \ relevant to us humans. To a machine, it is all bits and bytes, transistors,\
    \ and electrical current.\n\n### 40.2.2 Digits Separators\n\nIn C++14, we can\
    \ separate digits with a single quote to make it more readable:\n\n```cpp\nint\
    \ main()\n{\n    int x = 100'000;\n}\n```\n\nThe separators are only for our benefit.\n\
    \n### 40.2.3 Auto for Functions\n\nWe can deduce the return type based on the\
    \ return statement:\n\n```cpp\nauto myfn()\n{\n    return 42;\n}\n\nint main()\n\
    {\n    auto x = myfn();\n}\n```\n\n### 40.2.4 Generic Lambdas\n\nWe can use auto\
    \ parameters now. This is also called generic lambda:\n\n```cpp\n#include <iostream>\n\
    int main() {\n    auto mylambda = [](auto p) {\n        std::cout << \"Lambda:\
    \ \" << p;\n    };\n    mylambda(10);\n}\n```\n\n### 40.2.5 std::make_unique\n\
    \nC++14 introduces a function for unique pointers:\n\n```cpp\n#include <iostream>\n\
    #include <memory>\nclass MyClass {\nprivate:\n    int x;\n    double d;\npublic:\n\
    \    MyClass(int xx, double dd) : x(xx), d(dd) {}\n    void printdata() { \n \
    \       std::cout << \"x: \" << x << \", d: \" << d; \n    }\n};\n\nint main()\n\
    {\n    auto p = std::make_unique<MyClass>(123, 456.789);\n    p->printdata();\n\
    }\n```\n\n## 40.3 C++17\n\nThe C++17 standard introduces new language and library\
    \ features and changes some of the language.\n\n### 40.3.1 Nested Namespaces\n\
    \nRemember how we said we could have nested namespaces? We used the following:\n\
    \n```cpp\nnamespace Namespace1\n{\n    namespace Namespace2\n    {\n        namespace\
    \ Namespace3\n        {\n            // some code\n        }\n    }\n}\n```\n\n\
    The C++17 standard allows us to nest namespaces using the namespace operator.\
    \ The above example can be rewritten as:\n\n```cpp\nnamespace Namespace1::Namespace2::Namespace3\n\
    {\n    // some code\n}\n```\n\n### 40.3.2 Constexpr Lambdas\n\nLambdas can now\
    \ be a constant expression, meaning they can be evaluated during compile-time:\n\
    \n```cpp\nint main()\n{\n    constexpr auto mylambda = [](int x, int y) { return\
    \ x + y; };\n    static_assert(mylambda(10, 20) == 30, \"The lambda condition\
    \ is true.\");\n}\n```\n\nAn equivalent example where we put the constexpr specifier\
    \ in the lambda itself, would be:\n\n```cpp\nint main()\n{\n    auto mylambda\
    \ = [](int x, int y) constexpr { return x + y; };\n    static_assert(mylambda(10,\
    \ 20) == 30, \"The lambda condition is true.\");\n}\n```\n\n### 40.3.3 Structured\
    \ Bindings\n\nStructured bindings bind the variable names to elements of compile-time\
    \ known expressions, such as arrays or maps. The syntax is:\n\n```cpp\nauto [myvar1,\
    \ myvar2, myvar3] = some_expression;\n```\n\nA simple example where we bound three\
    \ variables to aliases for three array elements would be:\n\n```cpp\nint main()\n\
    {\n    int arr[] = { 1, 2, 3 };\n    auto [myvar1, myvar2, myvar3] = arr;\n}\n\
    ```\n"
