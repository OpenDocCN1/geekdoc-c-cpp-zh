    \ << sw.substr(0, 5);\n}\n```\n\n`string_view` 允许我们在不拷贝数据的情况下处理（不修改）内存中的数据。该数据由字符串或字符数组所有。\n\
    \n## 40.3.6 std::any\n\n`std::any` 容器可以持有任意类型的单一值。该容器在头文件中声明。示例：\n\n```cpp\n#include\
    \ <any>\n\nint main()\n{\n    std::any a = 345.678;\n    std::any b = true;\n\
