    \    }\n}\n```\n\n## 39.7 集合成员函数\n\n编写一个程序，定义一个整数集合，并利用集合的成员函数检查集合的大小、检查它是否为空以及清空集合的内容。\n\
    \n```cpp\n#include <iostream>\n#include <set>\n\nint main() {\n    std::set<int>\
