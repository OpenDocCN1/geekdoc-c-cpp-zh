    int main()\n{\n    MyClass myobject;\n    myobject(123); // 调用函数对象\n}\n```\n\n\
    函数对象也可以返回值。例如，以下函数对象检查参数是否为偶数：\n\n```cpp\n#include <iostream>\n\nclass MyClass\n\
    {\npublic:\n    bool operator()(int x)\n    {\n        if (x % 2 == 0)\n     \
