- md: "\n## CHAPTER 21 SCOPE AND LIFETIME\n\nIf we want to allocate memory for an\
    \ array, we use the operator new[]. To deallocate a memory allocated for an array,\
    \ we use the operator delete []. Pointers and arrays are similar and can often\
    \ be used interchangeably. Pointers can be dereferenced by a subscript operator\
    \ []. Example:\n\n```cpp\n#include <iostream>\n\nint main()\n{\n    int* p = new\
    \ int[3];\n    p[0] = 1;\n    p[1] = 2;\n    p[2] = 3;\n    std::cout << \"The\
    \ values are: \" << p[0] << ' ' << p[1] << ' ' << p[2];\n    delete[] p;\n}\n\
    ```\n\nThis example allocates space for three integers, an array of three integers\
    \ using operator new[]. Our pointer p now points at the first element in the array.\
    \ Then, using a subscript operator [], we dereferenced and assign a value to each\
    \ array element. Finally, we deallocate the memory using the operator delete[].\
    \ Remember: always delete new-ed and always delete[] what you new[]-ed.\n\nRemember:\
    \ prefer smart pointers to operator new. The lifetime of objects allocated on\
    \ the free-store is not bound by a scope in which the objects were defined. We\
    \ manually allocate and manually deallocate the memory for our object, thus controlling\
    \ when the object gets created and when it gets destroyed.\n\n## CHAPTER 22\n\n\
    ## Exercises\n\n### 22.1 Automatic Storage Duration\n\nWrite a program that defines\
    \ two variables of type int with automatic storage duration (placed on the stack)\
    \ inside the main function scope.\n\n```cpp\n#include <iostream>\n\nint main()\n\
    {\n    int x = 123;\n    int y = 456;\n    std::cout << \"The values with automatic\
    \ storage durations are: \" << x << \" \" \" << y;\n}\n```\n\n### 22.2 Dynamic\
    \ Storage Duration\n\nWrite a program which defines a variable of type int* which\
    \ points to an object with dynamic storage duration (placed on the heap):\n\n\
    ```cpp\n#include <iostream>\n\nint main()\n{\n    int* p = new int{ 123 };\n \
    \   std::cout << \"The value with a dynamic storage duration is: \" << *p;\n \
    \   delete p;\n}\n```\n\n### Explanation\n\nIn this example, the object p only\
    \ points at the object with dynamic storage duration. The p object itself has\
    \ an automatic storage duration. To delete the object on the heap, we need to\
    \ use the delete operator.\n\n### 22.3 Automatic and Dynamic Storage Durations\n\
    \nWrite a program that defines a variable of type x, automatic storage duration,\
    \ and a variable of type int* which points to an object with dynamic storage duration.\
    \ Both variables are in the same scope:\n\n```cpp\n#include <iostream>\n\nint\
    \ main()\n{\n    int x = 123; // automatic storage duration\n    std::cout <<\
    \ \"The value with an automatic storage duration is: \" << x\n    << '\\n';\n\
    \    int* p = new int{ x }; // allocate memory and copy the value from x to it\n\
    \    std::cout << \"The value with a dynamic storage duration is: \" << *p <<\n\
    \    << '\\n';\n    delete p;\n} // end of scope\n```\n\n## Classes - Introduction\n\
    \nClass is a user-defined type. A class consists of members. The members are data\
    \ members and member functions. A class can be described as data and some functionality,\
    \ wrapped into one. An instance of a class is called an object. To only declare\
    \ a class name, we write:\n\n```cpp\nclass MyClass;\n```\n\nTo define an empty\
    \ class, we add a class body marked by braces {}:\n\n```cpp\nclass MyClass{};\n\
    ```\n\nTo create an instance of the class, an object, we use:\n\n```cpp\nclass\
    \ MyClass{};\n\nint main()\n{\n    MyClass o;\n}\n```\n\nExplanation\nWe defined\
    \ a class called MyClass. Then we created an object o of type MyClass. It is said\
    \ that o is an object, a class instance.\n\n## CHAPTER 23 CLASSES - INTRODUCTION\n\
    \n### 23.1 Data Member Fields\n\nA class can have a set of some data in it. These\
    \ are called member fields. Let us add one member field to our class and make\
    \ it of type char:\n\n```cpp\nclass MyClass\n{\n    char c;\n};\n```\n\nNow our\
    \ class has one data member field of type char called c. Let us now add two more\
    \ fields of type int and double:\n\n```cpp\nclass MyClass\n{\n    char c;\n  \
    \  int x;\n    double d;\n};\n```\n\nNow our class has three member fields, and\
    \ each member field has its name.\n\n### 23.2 Member Functions\n\nSimilarly, a\
    \ class can store functions. These are called member functions. They are mostly\
    \ used to perform some operations on data fields. To declare a member function\
    \ of type void called dosomething(), we write:\n\n```cpp\nclass MyClass\n{\n \
    \   void dosomething();\n};\n```\n\nThere are two ways to define this member function.\
    \ The first is to define it inside the class:\n\n```cpp\nclass MyClass\n{\n  void\
    \ dosomething()\n  {\n    std::cout << \"Hello World from a class.\";\n  }\n};\n\
    ```\n\nThe second one is to define outside the class. In that case, we write the\
    \ function type first, followed by a class name, followed by a scope resolution\
    \ :: operator followed by a function name:\n\n```cpp\nclass MyClass\n{\n  void\
    \ dosomething();\n};\n\nvoid MyClass::dosomething()\n{\n  std::cout << \"Hello\
    \ World from a class.\";\n}\n```\n\n### 23.3 Access Specifiers\n\nWouldn't it\
    \ be convenient if there was a way we could disable access to member fields but\
    \ allow access to member functions? And that is what access specifiers are for.\
    \ They specify access for class members. There are three access specifiers: public,\
    \ protected, and private:\n\n```cpp\nclass MyClass{\npublic:\n    // everything\
    \ in here\n    // has public access level\nprotected:\n    // everything in here\n\
    \    // has protected access level\nprivate:\n    // everything in here\n    //\
    \ has private access level\n}\n```\n\nDefault access specifier for a class is\
    \ private if none of the access specifiers is present:\n\n```cpp\nclass MyClass{\n\
    \    // everything in here\n    // has private access by default\n}\n```\n\nAnother\
    \ way to write a class is to write a struct. A struct is also a class in which\
    \ members have public access by default. So, a struct is the same as a class but\
    \ with a public access specifier by default:\n\n```cpp\nstruct MyStruct{\n   \
    \ // everything in here\n    // is public by default\n}\n```\n\nFor now, we will\
    \ focus only on public and private access specifiers. Public access members are\
    \ accessible anywhere. For example, they are accessible to other class members\
    \ and objects of our class. To access a class member from an object, we use the\
    \ dot . operator.\n\nLet's define a class where all the members have public access.\
    \ To define a class with public access specifier, we can write:\n\n```cpp\nclass\
    \ MyClass\n{\npublic:\n    int x;\n    void printx()\n    {\n        std::cout\
    \ << \"The value of x is:\" << x;\n    }\n};\n```\n\nLet us instantiate this class\
    \ and use it in our main program:\n\n```cpp\n#include <iostream>\nclass MyClass\n\
    {\npublic:\n    int x;\n    void printx()\n    {\n        std::cout << \"The value\
    \ of data member x is: \" << x;\n    }\n};\nint main()\n{\n    MyClass o;\n  \
    \  o.x = 123; // x is accessible to object o\n    o.printx(); // printx() is accessible\
    \ to object o\n}\n```\n"
  mdcn: "\n\n## 第 21 章 作用域与寿命\n\n如果我们想为数组分配内存，我们使用 `new[]` 运算符。为了释放为数组分配的内存，我们使用 `delete[]`\
    \ 运算符。指针和数组是类似的，通常可以互换使用。可以通过下标运算符 `[]` 对指针解引用。示例：\n\n```cpp\n#include <iostream>\n\
    \nint main()\n{\n    int* p = new int[3];\n    p[0] = 1;\n    p[1] = 2;\n    p[2]\
    \ = 3;\n    std::cout << \"The values are: \" << p[0] << ' ' << p[1] << ' ' <<\
    \ p[2];\n    delete[] p;\n}\n```\n\n这个示例为三个整数分配了空间，使用 `new[]` 运算符创建了一个包含三个整数的数组。我们的指针\
    \ `p` 现在指向数组中的第一个元素。然后，使用下标运算符 `[]`，我们对每个数组元素进行解引用并赋值。最后，我们使用 `delete[]` 运算符释放内存。记住：始终删除\
    \ `new` 出来的内存，并且始终删除 `new[]` 出来的内存。\n\n记住：优先使用智能指针而不是 `new` 运算符。在自由存储（free-store）上分配的对象的寿命不受定义对象作用域限制。我们手动为对象分配和释放内存，从而控制对象的何时创建以及何时销毁。\n\
    \n## 第 22 章\n\n## 练习题\n\n### 22.1 自动存储持续期\n\n编写一个程序，在 `main` 函数作用域内定义两个 `int`\
    \ 类型具有自动存储持续期（放在栈上）的变量。\n\n```cpp\n#include <iostream>\n\nint main()\n{\n    int\
    \ x = 123;\n    int y = 456;\n    std::cout << \"The values with automatic storage\
    \ durations are: \" << x << \" \" << y;\n}\n```\n\n### 22.2 动态存储持续期\n\n编写一个程序，定义一个\
    \ `int*` 类型变量，指向一个具有动态存储持续期（放在堆上）的对象：\n\n```cpp\n#include <iostream>\n\nint main()\n\
    {\n    int* p = new int{ 123 };\n    std::cout << \"The value with a dynamic storage\
    \ duration is: \" << *p;\n    delete p;\n}\n```\n\n### 解释\n\n在例例中，对象 `p` 仅指向具有动态存储持续期的对象。`p`\
    \ 对象本身具有自动存储持续期。要删除堆上的对象，我们需要使用 `delete` 运算符。\n\n### 22.3 自动与动态存储持续期\n\n编写一个程序，定义一个具有自动存储持续期的\
    \ `int` 类型变量 `x`，以及一个指向具有动态存储持续期对象的 `int*` 类型变量。这两个两个变量都在同一个作用域内：\n\n```cpp\n\
    #include <iostream>\n\nint main()\n{\n    int x = 123; // 自动存储持续期\n    std::cout\
    \ << \"The value with an automatic storage duration is: \" << x\n    << '\\n';\n\
    \    int* p = new int{ x }; // 分配内存并将 x 的值拷贝到它\n    std::cout << \"The value with\
    \ a dynamic storage duration is: \" << *p <<\n    << '\\n';\n    delete p;\n}\
    \ // 作用域结束\n```\n\n## 类 - 绪言\n\n类是一种用户定义的类型。类由成员组成。成员包括数据成员和成员函数。类可以被描述为将数据和某些功能封装在一起的。类的实例被称为对象。如果只声明类名，我们写道：\n\
    \n```cpp\nclass MyClass;\n```\n\n要定义一个空类，我们添加一个由大括号 `{}` 标记的类体：\n\n```cpp\nclass\
    \ MyClass{};\n```\n\n要创建一个类的实例（对象），我们使用：\n\n```cpp\nclass MyClass{};\n\nint main()\n\
    {\n    MyClass o;\n}\n```\n\n解释\n我们定义了一个名为 `MyClass` 的类。然后我们创建了一个类型为 `MyClass`\
    \ 的对象 `o`。我们说 `o` 是一个对象，一个类的实例。\n\n## 第 23 章 类 - 绪言\n\n### 23.1 数据成员字段\n\n类内部可以包含一组数据。这些被称为成员字段。让我们给类添加一个成员字段，并将其类型设为\
    \ `char`：\n\n```cpp\nclass MyClass\n{\n    char c;\n};\n```\n\n现在我们的类有了一个类型为 `char`\
    \ 名为 `c` 的数据成员字段。现在我们再添加两个类型为 `int` 和 `double` 的字段：\n\n```cpp\nclass MyClass\n\
    {\n    char c;\n    int x;\n    double d;\n};\n```\n\n现在我们的类有三个成员字段，每个成员字段都有自己的名字。\n\
    \n### 23.2 成员函数\n\n同样，类也可以存储函数。这些被称为成员函数。它们主要用于对数据字段执行某些操作。要声明一个类型为 `void` 名为\
    \ `dosomething()` 的成员函数，我们写道：\n\n```cpp\nclass MyClass\n{\n    void dosomething();\n\
    };\n```\n\n定义这个成员函数有两种方法。第一种是在类内部定义：\n\n```cpp\nclass MyClass\n{\n  void dosomething()\n\
    \  {\n    std::cout << \"Hello World from a class.\";\n  }\n};\n```\n\n第二种是在类外定义。在这种情况下，我们先写函数类型，接着是类名，然后是作用域解析运算符\
    \ `::`，最后是函数名：\n\n```cpp\nclass MyClass\n{\n  void dosomething();\n};\n\nvoid\
    \ MyClass::dosomething()\n{\n  std::cout << \"Hello World from a class.\";\n}\n\
    ```\n\n### 23.3 权限修符\n\n如果有一种方法可以禁用字段的访问但允许函数的访问，难道不是更方便吗？这就是权限修符的作用。它们指定类成员的访问权限。三种权限修符：`public`、`protected`\
    \ 和 `private`：\n\n```cpp\nclass MyClass{\npublic:\n    // 这里的内容具有公有访问权限\nprotected:\n\
    \    // 这里的内容具有受保护的访问权限\nprivate:\n    // 这里的内容具有私有访问权限\n}\n```\n\n如果如果没有出现任何权限修符，类的默认权限修符是\
    \ `private`：\n\n```cpp\nclass MyClass{\n    // 这里的内容默认是私有的\n}\n```\n\n编写类的另一种方式是写\
    \ `struct`。`struct` 也是类，其成员默认是公开的。因此，`struct` 等同于具有默认公开权限修符的类：\n\n```cpp\nstruct\
    \ MyStruct{\n    // 这里的内容默认是公开的\n}\n```\n\n目前，我们将只关注 `public` 和 `private` 权限修符。公开访问成员可以在任何地方访问。例如，它们可以被类的其他成员以及类的对象访问。从对象访问类成员，我们使用点运算符\
    \ `.`。\n\n让我们定义一个所有成员都是公开访问的类。定义一个具有公开权限修符的类，我们可以写道：\n\n```cpp\nclass MyClass\n\
    {\npublic:\n    int x;\n    void printx()\n    {\n        std::cout << \"The value\
    \ of x is:\" << x;\n    }\n};\n```\n\n让我们实例化这个类并在我们的主程序中使用：\n\n```cpp\n#include\
    \ <iostream>\nclass MyClass\n{\npublic:\n    int x;\n    void printx()\n    {\n\
    \        std::cout << \"The value of data member x is: \" << x;\n    }\n};\nint\
    \ main()\n{\n    MyClass o;\n    o.x = 123; // x 可以被对象 o 访问\n    o.printx(); //\
    \ printx() 可以被对象 o 访问\n}\n```\n\n"
