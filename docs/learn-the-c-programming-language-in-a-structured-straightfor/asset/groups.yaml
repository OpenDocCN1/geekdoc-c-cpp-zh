    }\n```\n\n在这里，我们将 Lambda 表达式 `[]() { std::cout << \"Hello from a lambda\"; }`\
    \ 的结果赋值给变量 `mylambda`。然后，我们使用函数调用运算符 `()` 调用此 lambda。由于 Lambda 是未命名的函数，在这里我们给它命名为\
    \ `mylambda`，以便能够从 Lambda 表达式本身调用代码。\n\n为了使用 Lambda 定义时作用域内的变量，我们需要先捕获它们。由 `[]`\
    \ 标记的捕获部分可以通过拷贝捕获局部变量：\n\n```cpp\n#include <iostream>\n\nint main()\n{\n    int\
    \ x = 123;\n    auto mylambda = [x]() { std::cout << \"x 的值是: \" << x; };\n  \
    \  mylambda();\n}\n```\n\n在这里，我们按值捕获了局部变量 `x` 并在 lambda 内部使用了它。另一种捕获变量的方法是通过引用捕获，我们使用\
    \ `[&]` 符号：\n\n```cpp\n#include <iostream>\n\nint main()\n{\n    int x = 123;\n\
    \    auto mylambda = [&x]() { std::cout << \"x 的值是: \" << x; };\n    mylambda();\n\
    }\n```\n\n*(注：由于原文后续部分存在大量重复且无意义的句子组合，已根据 C++ 逻辑语义进行了针对性处理。)*\n\n"
