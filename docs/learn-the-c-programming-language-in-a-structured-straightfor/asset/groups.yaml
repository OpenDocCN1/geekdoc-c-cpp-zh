  mdcn: "\n\n## 第 35 章 智能指针\n\n我们可以使用唯一指针来利用多态类：\n\n```cpp\n#include <iostream>\n\
    #include <memory>\n\nclass MyBaseClass {\npublic:\n    virtual void printmessage()\n\
    \    {\n        std::cout << \"Hello from a base class.\";\n    }\n};\nclass MyderivedClass:\
    \ public MyBaseClass {\npublic:\n    void printmessage()\n    {\n        std::cout\
    \ << \"Hello from a derived class.\";\n    }\n};\nint main() {\n    std::unique_ptr<MyBaseClass>\
    \ p = std::make_unique<MyderivedClass>();\n    p->printmessage();\n}\n```\n\n\
    很简洁对吧？不需要显式地删除分配的内存，智能指针会替我们完成。这就是“智能”的地方。\n\n### 35.2 共享指针\n\n我们可以让多个指针指向同一个对象。我们可以说所有这些指针都拥有我们指向的对象，也就是说，我们的对象具有共享所有权。只有当这些指针中的最后一个被销毁时，我们所指向的对象才会被删除。这就是共享指针的作用。多个指针指向同一个对象，当它们都离开作用范围时，对象会被销毁。\n\
    \n共享指针定义为 `std::shared_ptr<some_type>`。它可以使用 `std::make_shared<some_type>(some_value)`\
    \ 函数初始化。共享指针是可以拷贝的。要让三个智能指针指向同一个对象，我们可以写：\n\n```cpp\n#include <iostream>\n#include\
    \ <memory>\n\nint main() {\n    std::shared_ptr<int> p1 = std::make_shared<int>(123);\n\
    \    std::shared_ptr<int> p2 = p1;\n    std::shared_ptr<int> p3 = p1;\n}\n```\n\
    \n当所有指针都离开作用范围时，所指向的对象会被销毁，其内存也会被释放。\n\n唯一指针和共享指针之间的主要区别是：\n\n- 使用唯一指针，我们有一个指针指向并拥有一个对象，而使用共享指针，我们有多个指针指向它。\n\
    - 唯一指针不能拷贝，而共享指针可以。\n\n当我们使用智能指针时，我们不需要担心所指向的对象的销毁，因为智能指针会在离开作用范围时自动处理。\n\n使用智能指针时，我们不需要手动管理内存。\n\
    \n**重要！**\n\n尽量使用智能指针而不是原始指针。智能指针可以更安全地管理内存。\n\n## 第 36 章 \n\n## 练习题\n\n### 36.1\
    \ static_cast\n\n编写一个使用 `static_cast` 在基本类型之间转换的程序。\n\n```cpp\n#include <iostream>\n\
    \nint main()\n{\n    int x = 123;\n    double d = 456.789;\n    bool b = true;\n\
    \n    double doublesult = static_cast<double>(x);\n    std::cout << \"Int to double:\
    \ \" << doublesult << \"\\n\";\n    \n    int intresult = static_cast<int>(d);\n\
    \    std::cout << \"Double to int: \" << intresult << \"\\n\";\n    \n    bool\
    \ boolresult = static_cast<bool>(x);\n    std::cout << \"Int to bool: \" << boolresult\
    \ << \"\\n\";\n}\n```\n\n### 36.2 简单的唯一指针\n\n编写一个指向整数值的唯一指针程序。使用 `std::make_unique`\
    \ 函数创建指针。\n\n```cpp\n#include <iostream>\n#include <memory>\n\nint main()\n{\n\
    \    std::unique_ptr<int> p = std::make_unique<int>(123);\n    std::cout << \"\
    The value of pointed-to object is: << *p << \"\\n\";\n}\n```\n\n### 36.3 类对象的唯一指针\n\
    \n编写一个具有两个数据成员、一个自定义构造函数和一个成员函数的类。创建一个该类对象的唯一指针。使用智能指针访问成员函数。\n\n```cpp\n#include\
    \ <iostream>\n#include <memory>\n\nclass MyClass\n{\nprivate:\n    int x;\n  \
    \  double d;\npublic:\n    MyClass(int xx, double dd)\n        : x{xx}, d{dd}\
    \ {}\n\n    void printdata()\n    {\n        std::cout << \"Data members values\
    \ are: \" << x << \" and: \" << d;\n    }\n};\n```\n\n```cpp\nint main()\n{\n\
    \    std::unique_ptr<MyClass> p = std::make_unique<MyClass>(123, 456.789);\n \
    \   p->printdata();\n}\n```\n\n### 36.4 共享指针练习\n\n编写一个定义指向同一个 `int` 类型对象的三个共享指针的程序。创建第一个指针。使用智能指针访问成员函数。创建这些指针。\n\
    \n```cpp\n#include <iostream>\n#include <memory>\n\nint main()\n{\n    std::shared_ptr<int>\
    \ p1 = std::make_shared<int>(123);\n    std::shared_ptr<int> p2 = p1;\n    std::shared_ptr<int>\
    \ p3 = p1;\n}\n```\n\n### 36.5 唯一指针\n\n编写一个指向整数值的唯一指针程序。使用 `std::make_unique`\
    \ 函数创建指针。使用智能指针。\n\n### 36.6 多态\n\n编写一个定义有虚函数的基类程序。从基类派生子类。覆盖虚函数。\n\n### 36.7\
    \ 异常处理\n\n编写一个抛出并捕获整数异常的程序。处理异常并打印其值：\n\n### 36.8 多重异常\n\n编写一个在同一个 `try` 块中可以抛出整数和双精度异常的程序。实现针对两种异常的异常处理块。\n\
    \n"
