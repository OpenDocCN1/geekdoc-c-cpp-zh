- md: "\n# CHAPTER 10\n\n# Arrays\n\nArrays are sequences of objects of the same type.\
    \ We can declare an array of type char as follows:\n\n```cpp\nint main()\n{\n\
    \    char arr[5];\n}\n```\n\nThis example declares an array of 5 characters. To\
    \ declare an array of type int which holds five elements, we would use:\n\n```cpp\n\
    int main()\n{\n    int arr[5];\n}\n```\n\nTo initialize an array, we can use the\
    \ initialization list {}:\n\n```cpp\nint main()\n{\n    int arr[5] = { 10, 20,\
    \ 30, 40, 50 };\n}\n```\n\nInitialization list in our example { 10, 20, 30, 40,\
    \ 50 } is marked with braces and elements separated by commas. This initialization\
    \ list initializes our array with the values in the list. The first array element\
    \ now has a value of 10; the second array element now has a value of 20 etc. The\
    \ last (fifth) array element now has a value of 50.\n\nWe can access individual\
    \ array elements through a subscript [] operator and an index. The first array\
    \ element has an index of 0, and we access it via:\n\n```cpp\nint main()\n{\n\
    \    int arr[5] = { 10, 20, 30, 40, 50 };\n    arr[0] = 100; // change the value\
    \ of the first array element\n}\n```\n\nSince the indexing starts from 0 and not\
    \ 1, the last array element has an index of 4:\n\n```cpp\nint main()\n{\n    int\
    \ arr[5] = { 10, 20, 30, 40, 50 };\n    arr[4] = 500; // change the value of the\
    \ last array element\n}\n```\n\nSo, when declaring an array, we write how many\
    \ elements we want to declare, but when accessing array elements, we need to remember\
    \ that the indexing starts from 0 and ends with the *number-of-elements – 1*.\
    \ That being said, in modern C++, we should prefer the std::array and std::vector\
    \ containers to raw arrays. More on this in later chapters.\n\n# CHAPTER 11\n\n\
    # Pointers\n\nObjects reside in memory. And so far, we have learned how to access\
    \ and manipulate objects through *variables*. Another way to access an object\
    \ in memory is through pointers. Each object in memory has its type and an address.\
    \ This allows us to access the object through a pointer. So, pointers are types\
    \ that can hold the address of a particular object. For illustrative purposes\
    \ only, we will declare an unutilized pointer that can point to an int object:\n\
    \n```cpp\nint main()\n{\n    int* p;\n}\n```\n\nWe say that p is of type int*.\
    \ To declare a pointer that points to a char (object) we declare a pointer of\
    \ type char*:\n\n```cpp\nint main()\n{\n    char* p;\n}\n```\n\nIn our first example,\
    \ we declared a pointer of type int*. To make it point to an existing int object\
    \ in memory, we use the address-of operator &. We say that *p points to x*.\n\n\
    ```cpp\nint main()\n{\n    int x = 123;\n    int* p = &x;\n}\n```\n\n# CHAPTER\
    \ 11 POINTERS\n\nIn our second example we declared a pointer of type char* and\
    \ similarly, we have:\n\n```cpp\nint main()\n{\n    char c = 'a';\n    char* p\
    \ = &c;\n}\n```\n\nTo initialize a pointer that does not point to any object we\
    \ can use the nullptr literal:\n\n```cpp\nint main()\n{\n    char* p = nullptr;\n\
    }\n```\n\nIt is said that p is now a null pointer. Pointers are variables/objects,\
