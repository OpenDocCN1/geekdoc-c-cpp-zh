    \ templates and function templates providing generic types T? If we want our template\
    \ argument T to satisfy certain requirements, then we use concepts. In other words,\
    \ we want our T to satisfy certain compile-time criteria. The signature for a\
    \ concept is:\n\n```\ntemplate <typename T>\nconcept concept_name = requires (T\
    \ var_name) { requirement_expression };\n```\n\nThe second line defines a concept\
    \ name followed by a reserved word requires, followed by an optional template\
    \ argument T and a local var_name, followed by a requirement_expression which\
    \ is a constexpr bool.\n\nIn a nutshell, the concept predicate specifies the requirements\
    \ a template argument must satisfy in order to be used in a template. Some of\
    \ the requirements we can write ourselves, some are already pre-made.\n\nWe can\
    \ say that concepts constrain types to certain requirements. They can also be\
