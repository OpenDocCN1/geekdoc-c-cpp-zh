    \ t1{ myfunction, \"Thread 1\" };\n    std::thread t2{ myfunction, \"Thread 2\"\
    \ };\n\n    t1.join();\n    t2.join();\n}\n```\n\n## 40.1.14 被删除和默认函数\n\n如果我们不提供默认构造函数，编译器将为我们生成一个，以便我们可以写出：\n\
    \n```\nclass MyClass\n{\n};\n\nint main()\n{\n    MyClass o; // OK，存在一个隐式定义的默认构造函数\n\
    }\n```\n\n# 第40 章 C++ 标准\n\n然而，在某些情况下，默认构造函数不会被隐式生成。例如，当我们为类定义了拷贝构造函数时，默认构造函数会被隐式删除。示例：\n\
    \n```cpp\n#include <iostream>\n\nclass MyClass\n{\npublic:\n    MyClass(const\
    \ MyClass& other)\n    {\n        std::cout << \"Copy constructor invoked.\";\n\
    \    }\n};\n\nint main()\n{\n    MyClass o; // 错误，没有默认构造函数\n}\n```\n\n为了强制实例化编译器生成的默认构造函数，我们在其声明中提供\
    \ `=default` 标识符。示例：\n\n```cpp\n#include <iostream>\n\nclass MyClass\n{\npublic:\n\
    \    MyClass() = default; // 默认的成员函数\n    MyClass(const MyClass& other)\n    {\n\
    \        std::cout << \"Copy constructor invoked.\";\n    }\n};\n\nint main()\n\
    {\n    MyClass o; // 现在 OK，存在默认的默认构造函数\n    MyClass o2 = o; // 调用拷贝构造函数\n}\n```\n\
    \n# 第40 章 C++ 标准\n\n当 `=default` 标识符用在成员函数上，意味着：无论语言规则如何，我都想要这个默认成员函数存在。我不希望它被隐式禁用。\n\
    \n同样，如果我们想禁用某个成员函数的出现，我们使用 `=delete` 标识符。为了禁用拷贝构造函数和拷贝赋值运算符，我们可以写道：\n\n```cpp\n\
    #include <iostream>\n\nclass MyClass {\npublic:\n    MyClass()\n    {\n      \
    \  std::cout << \"Default constructor invoked.\";\n    }\n    MyClass(const MyClass&\
    \ other) = delete; // 删除拷贝构造函数\n    MyClass& operator=(const MyClass& other) =\
    \ delete; // 删除拷贝赋值运算符\n};\n\nint main() {\n    MyClass o; // OK\n    MyClass\
    \ o2 = o; // 错误，调用了被删除的拷贝构造函数\n    MyClass o3;\n    o3 = o; // 错误，调用了被删除的拷贝赋值运算符\n\
    }\n```\n\n这些标识符主要用于我们希望的情况：\n\n- a. 当使用 `=default;` 表达式时，强制实例化隐式定义的成员函数（如构造函数和赋值运算符）\n\
    - b. 使用 `=delete;` 表达式禁用隐式定义的成员函数的实例化\n\n这些表达式也可以用在其他函数上。\n\n# 第40 章 C++ 标准\n\n\
    ## 40.1.15 类型别名\n\n类型别名是为现有类型提供的名称。如果我们想为现有类型使用不同的名称，我们写道：`using my_type_name\
    \ = existing_type_name;` 示例：\n\n```cpp\n#include <iostream>\n#include <string>\n\
    #include <vector>\n\nusing MyInt = int;\nusing MyString = std::string;\nusing\
    \ MyVector = std::vector<int>;\n\nint main() {\n    MyInt x = 123;\n    MyString\
    \ s = \"Hello World\";\n    MyVector v = { 1, 2, 3, 4, 5 };\n}\n```\n\n## 40.2\
    \ C++14\n\nC++14 是2014年发布的 ISO 标准。它为语言和库增加了一些特性，并修复了 C++11 标准。当我们说使用 C++11 标准时，实际上想要的是\
    \ C++14 标准。如果使用 g++ 或 clang 编译器，请在命令行中添加 `-std=c++14` 标志。在 Visual Studio 中，选择\
    \ `Project / Options / Configuration Properties / C/C++ / Language Standard` 并选择\
    \ C++14。\n\n### 40.2.1 二进制字面量\n\n值由字面量表示。到目前为止提到了三种不同的字面量：十进制、十六进制和八进制：\n\n```cpp\n\
    int main()\n{\n    int x = 10;\n    int y = 0xA;\n    int z = 012;\n}\n```\n\n\
    C++14 标准引入了第四种整数字面量：二进制字面量。使用二进制字面量，我们可以如下表示数字 10（带有 `0b` 前缀）：\n\n```cpp\nint\
    \ main()\n{\n    int x = 0b1010;\n}\n```\n\n著名的数字 42 的二进制形式为：\n\n```cpp\nint main()\n\
    {\n    int x = 0b101010;\n}\n```\n\n> **重要的是记住** 值是值；是内存中的位和字节。这些值的不同形式对人类来说是相关的。对机器来说，它们都是位和字节、晶体管和电流。\n\
    \n### 40.2.2 数字分隔符\n\n在 C++14 中，我们可以单引号分隔数字以使其具可读性：\n\n```cpp\nint main()\n{\n\
    \    int x = 100'000;\n}\n```\n\n这些分隔符仅是为了我们的考虑。\n\n### 40.2.3 Auto 用于函数\n\n我们可以根据\
    \ return 语句推断返回类型：\n\n```cpp\nauto myfn()\n{\n    return 42;\n}\n\nint main()\n\
    {\n    auto x = myfn();\n}\n```\n\n### 40.2.4 泛型 Lambda\n\n现在可以使用 auto 参数。这也被称为泛型\
    \ lambda：\n\n```cpp\n#include <iostream>\nint main() {\n    auto mylambda = [](auto\
    \ p) {\n        std::cout << \"Lambda: \" << p;\n    };\n    mylambda(10);\n}\n\
    ```\n\n### 40.2.5 std::make_unique\n\nC++14 为智能指针引入了一个函数：\n\n```cpp\n#include\
    \ <iostream>\n#include <memory>\nclass MyClass {\nprivate:\n    int x;\n    double\
    \ d;\npublic:\n    MyClass(int xx, double dd) : x(xx), d(dd) {}\n    void printdata()\
    \ { \n        std::cout << \"x: \" << x << \", d: \" << d; \n    }\n};\n\nint\
    \ main()\n{\n    auto p = std::make_unique<MyClass>(123, 456.789);\n    p->printdata();\n\
    }\n```\n\n## 40.3 C++17\n\nC++17 标准引入了新的语言和库特性，并改变了语言的部分。\n\n### 40.3.1 嵌套命名空间\n\
    \n记得我们说过可以嵌套命名空间吗？我们使用了如下：\n\n```cpp\nnamespace Namespace1\n{\n    namespace Namespace2\n\
    \    {\n        namespace Namespace3\n        {\n            // 一代码\n        }\n\
    \    }\n}\n```\n\nC++17 标准允许我们使用命名空间运算符来嵌套命名空间。上面的示例可以重写为：\n\n```cpp\nnamespace\
    \ Namespace1::Namespace2::Namespace3\n{\n    // 一代码\n}\n```\n\n### 40.3.2 Constexpr\
    \ Lambda\n\nLambda 现在可以是一个常量表达式，这意味着它们可以在编译期间求值：\n\n```cpp\nint main()\n{\n  \
    \  constexpr auto mylambda = [](int x, int y) { return x + y; };\n    static_assert(mylambda(10,\
    \ 20) == 30, \"Lambda 条件为真。\");\n}\n```\n\n一个等效示例是在 lambda 本身中放入 constexpr 标识符：\n\
    \n```cpp\nint main()\n{\n    auto mylambda = [](int x, int y) constexpr { return\
    \ x + y; };\n    static_assert(mylambda(10, 20) == 30, \"Lambda 条件为真。\");\n}\n\
    ```\n\n### 40.3.3 结构化绑定\n\n结构化绑定将变量名绑定到编译时已知表达式元素，例如数组或映射。语法为：\n\n```cpp\nauto\
    \ [myvar1, myvar2, myvar3] = some_expression;\n```\n\n一个简单的示例是将三个变量绑定到三个数组元素的别名：\n\
    \n```cpp\nint main()\n{\n    int arr[] = { 1, 2, 3 };\n    auto [myvar1, myvar2,\
    \ myvar3] = arr;\n}\n```\n\n"
