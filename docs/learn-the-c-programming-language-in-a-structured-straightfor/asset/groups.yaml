- md: "\n# CHAPTER 13 INTRODUCTION TO STRINGS\n\n```cpp\n{\n  std::cout << \"The string\
    \ is equal to \\\"Hello\\\";\";\n}\n```\n\nComparing a string to another string\
    \ is done using the equality operator ==:\n\n```cpp\n#include <iostream>\n#include\
    \ <string>\n\nint main() {\n  std::string s1 = \"Hello\";\n  std::string s2 =\
    \ \"World.\";\n  if (s1 == s2) {\n    std::cout << \"The strings are equal.\"\
    ;\n  } else {\n    std::cout << \"The strings are not equal.\";\n  }\n}\n```\n\
    \n## 13.5 String Input\n\nPreferred way of accepting a string from the standard\
    \ input is via the std::getline function which takes std::cin and our string as\
    \ parameters:\n\n```cpp\n#include <iostream>\n#include <string>\n```\n\n```cpp\n\
    int main() {\n  std::string s;\n  std::cout << \"Please enter a string: \";\n\
    \  std::getline(std::cin, s);\n  std::cout << \"You entered: \" << s;\n}\n```\n\
    \nWe use the std::getline because our string can contain white spaces. And if\
    \ we used the std::cin function alone, it would accept only a part of the string.\n\
    \nThe std::getline function has the following signature: std::getline(read_from,\
    \ into); The function reads a line of text from the standard input (std::cin)\
    \ into a string (s) variable.\n\nA rule of thumb: if we need to use the std::string\
    \ type, include the <string> header explicitly.\n\n## 13.6 A Pointer to a String\n\
    \nA string has a member function .c_str() which returns a pointer to its first\
    \ element. It is also said it returns a pointer to a null-terminated character\
    \ array our string is made of:\n\n```cpp\n#include <iostream>\n#include <string>\n\
    ```\n\n```cpp\nint main()\n{\n    std::string s = \"Hello World.\";\n    std::cout\
    \ << s.c_str();\n}\n```\n\nThis member function is of type const char* and is\
    \ useful when we want to pass our std::string variable to a function accepting\
    \ a const char* parameter.\n\n## 13.7 Substrings\n\nTo create a substring from\
    \ a string, we use the .substr() member function. The function returns a substring\
    \ that starts at a certain position in the main string and is of a certain length.\
    \ The signature of the function is: .substr(starting_position, length). Example:\n\
    \n```cpp\n#include <iostream>\n#include <string>\n\nint main()\n{\n    std::string\
    \ s = \"Hello World.\";\n    std::string mysubstring = s.substr(6, 5);\n    std::cout\
    \ << \"The substring value is: \" << mysubstring;\n}\n```\n\nIn this example,\
    \ we have the main string that holds the value of \"Hello World.\" Then we create\
    \ a substring that only has the \"World\" value. The substring starts from the\
    \ sixth character of the main string, and its length is five characters.\n\n##\
    \ 13.8 Finding a Substring\n\nTo find a substring in a string, we use the .find()\
    \ member function. It searches for the substring in a string. If the substring\
    \ is found, the function returns the position of the first found substring. This\
    \ position is the position of a character where the substring starts in the main\
    \ string. If the substring is not found, the function returns a value that is\
    \ std::string::npos. The function itself is of type std::string::size_type.\n\n\
    To find a substring \"Hello\" inside the \"This is a Hello World string\" string,\
    \ we write:\n\n```cpp\n#include <iostream>\n#include <string>\nint main()\n{\n\
    \    std::string s = \"This is a Hello World string.\";\n    std::string stringtofind\
    \ = \"Hello\";\n    std::string::size_type found = s.find(stringtofind);\n   \
    \ if (found != std::string::npos)\n    {\n        std::cout << \"Substring found\
    \ at position: \" << found;\n    }\n    else\n    {\n        std::cout << \"The\
    \ substring is not found.\";\n    }\n}\n```\n\nHere we have the main string and\
    \ a substring we want to find. We supply the substring to the .find() function\
    \ as an argument. We store the function's return value to a variable *found*.\
    \ Then we check the value of this variable. If the value is not equal to `std::string::npos`,\
    \ the substring was found. We print the message and the position of a character\
    \ in the main string, where our substring was found.\n\n# CHAPTER 14\n\n# Automatic\
    \ Type Deduction\n\nWe can automatically deduce the type of an object using the\
    \ auto specifier. The auto specifier deduces the type of an object based on the\
    \ object's initializer type.\n\nExample:\n\n```cpp\nauto c = 'a';    // char type\n\
    ```\n\nThis example deduces c to be of type char as the initializer 'a' is of\
    \ type char. Similarly, we can have:\n\n```cpp\nauto x = 123;   // int type\n\
    ```\n\nHere, the compiler deduces the x to be of type int because an integer literal\
    \ 123 is of type int.\n\nThe type can also be deduced based on the type of expression:\n\
    \n```cpp\nauto d = 123.456 / 789.10;  // double\n```\n\nThis example deduces d\
    \ to be of type double as the type of the entire 123.456 / 789.10 expression is\
    \ double.\n\nWe can use auto as part of the reference type:\n\n```cpp\nint main()\n\
    {\n    int x = 123;\n    auto& y = x; // y is of int& y\n}\n```\n\nor as part\
    \ of the constant type:\n\n```cpp\nint main()\n{\n    const auto x = 123; // x\
    \ is of const int type\n}\n```\n\nWe use the *auto* specifier when the type (name)\
    \ is hard to deduce manually or cumbersome to type due to the length.\n\n# CHAPTER\
    \ 15\n\n# Exercises\n\n## 15.1 Array Definition\n\nWrite a program that defines\
    \ and initializes an array of five doubles. Change and print the values of the\
