    \ here\n        // throw an exception if there is an error\n    }\n    catch (type_of_the_exception\
    \ e)\n    {\n        // catch and handle the exception\n    }\n}\n```\n\nA simple\
    \ try/catch example would be:\n\n```cpp\n#include <iostream>\nint main()\n{\n\
    \    try\n    {\n        std::cout << \"Let's assume some error occurred in our\
    \ program.\" << \"\\n\";\n        std::cout << \"We threw an exception of type\
    \ int, for example.\\n\";\n        std::cout << \"This signals that something\
    \ went wrong.\" << \"\\n\";\n        throw 123; // throw an exception if there\
    \ is an error\n    }\n    catch (int e)\n    {\n        // catch and handle the\
    \ exception\n        std::cout << \"Exception raised!\" << \"\\n\";\n        std::cout\
    \ << \"The exception has a value of \" << e << \"\\n\";\n    }\n}\n```\n\nExplanation:\
    \ here we try to execute code inside the try block. If an error occurs, we throw\
    \ an exception that signals something went wrong. The exception in our case is\
    \ of type int, but it can be of any type. When the exception is thrown, the control\
    \ is transferred to a catch clause, which handles the exception. In our case,\
    \ it handles the exception of type int.\n\nWe can throw an exception of a different\
    \ type, std::string for example:\n\n```cpp\n#include <iostream>\n#include <string>\n\
    \nint main()\n{\n    try {\n        std::cout << \"Let's assume some error occured\
    \ in our program.\" << \"\\n\";\n        std::cout << \"We throw an exception\
    \ of type string, for example.\" << \"\\n\";\n        std::cout << \"This signals\
    \ that something went wrong.\" << \"\\n\";\n        throw std::string(\"Some string\
    \ error\"); // throw an exception\n    }\n    catch (const std::string& e)\n \
    \   {\n        // catch and handle the exception\n        std::cout << \"String\
    \ exception raised.\" << \"\\n\";\n        std::cout << \"The exception has a\
    \ value of: \" << e << \"\\n\";\n    }\n}\n```\n\nWe can have/raise multiple exceptions.\
    \ They can be of different types. In this case, we have one try and multiple catch\
    \ blocks. Each catch block handles a different exception.\n\n```cpp\n#include\
    \ <iostream>\n#include <string>\n\nint main() {\ntry {\n    throw 123;\n    //\
    \ the following will not execute as\n    // the control has been transferred to\
    \ a catch clause\n    throw std::string{\"Some string error\"};\n} catch (int\
    \ e) {\n    std::cout << \"Integer exception raised! The value is \" << e << \"\
    \\n\";\n} catch (const std::string& e) {\n    std::cout << \"String exception\
    \ raised.\" << \"\\n\";\n    std::cout << \"The exception has a value of: \" <<\
    \ e << \"\\n\";\n}\n}\n```\n\n# CHAPTER 35\n\n# Smart Pointers\n\nSmart pointers\
    \ are pointers that own object they point to and automatically destroy the object\
    \ once they go out of scope. Smart pointers are declared in the <memory> header.\
    \ We will cover the following smart pointers - unique and shared.\n\n## 35.1 Unique\
    \ Pointer\n\nA unique pointer called std::unique_ptr is a pointer that owns object\
    \ it points to. The pointer cannot be copied. To declare a unique pointer to a\
    \ simple int, we write:\n\n```cpp\n#include <iostream>\n#include <memory>\n\n\
    int main()\n{\n    std::unique_ptr<int> p(new int{123});\n    std::cout << *p;\n\
    }\n```\n\nThis example creates a pointer to an object of type int and assigns\
    \ a value of 123 to the object. A unique pointer can be dereferenced in the same\
    \ way as a regular pointer using the * notation. The object gets deleted once\
    \ p goes out of scope. No explicit use of delete operator is required.\n\nA better\
    \ way to initialize a unique pointer is through an std::make_unique<some_type>(some_value)\
    \ function, where we specify the type for the object in angle brackets and the\
    \ value for the object pointer points in parentheses:\n\n```cpp\n#include <iostream>\n\
    #include <memory>\n\nint main() {\n    std::unique_ptr<int> p = std::make_unique<int>(123);\n\
    \    std::cout << *p;\n}\n```\n\nThe std::make_unique function was introduced\
    \ in the C++14 standard. Make sure to compile with the -std=c++14 flag to be able\
    \ to use this function.\n\nWe can create a unique pointer that points to an object\
    \ of a class and then use its -> operator to access iostream members:\n\n```cpp\n\
    #include <iostream>\n#include <memory>\n\nclass MyClass {\npublic:\n    void printmessage()\
    \ {\n        std::cout << \"Hello from a class.\";\n    }\n};\n\nint main() {\n\
    \    std::unique_ptr<MyClass> p = std::make_unique<MyClass>();\n    p->printmessage();\n\
    }\n```\n\nThe object gets destroyed once p goes out of scope. So, prefer a unique\
    \ pointer to raw pointer and their new-delete mechanism. Once p goes out of scope,\
    \ the pointed-to object of a class gets destroyed.\n"
