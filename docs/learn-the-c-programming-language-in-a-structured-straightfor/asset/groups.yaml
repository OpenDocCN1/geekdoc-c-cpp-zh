- md: "\n# CHAPTER 40 C++ STANDARDS\n\nThis concept ensures your argument x of type\
    \ T must be able to accept operator ++, and the argument must be able to be incremented\
    \ by one. This check is performed during the compile-time. The requirement is\
    \ indeed true for types chars, int, and double. If we used a type for which the\
    \ requirement is not fulfilled, the compiler would issue a compile-time error.\n\
    \nWe can combine multiple concepts. Let us, for example, have a concept that requires\
    \ the T to be an even or odd number.\n\n```\ntemplate <typename T>\nconcept MustBeEvenOrOdd\
    \ = requires (T x) { x % 2; };\n```\n\nNow our template can include both the MustBeIncrementable\
    \ and MustBeEvenOrOdd concepts:\n\n```\ntemplate <typename T> requires MustBeIncrementable<T>\
    \ &&\nMustBeEvenNumber<T>;\nvoid myfunction(T x)\n{\n    // code goes in here\n\
    }\n```\n\nThe keyword requires is used both for the expression in the concept\
    \ and including the concept into our template class/function.\n\nThe complete\
    \ program, which includes both concept requirements, would be:\n\n```\n#include\
    \ <iostream>\n#include <concepts>\n\ntemplate <typename T>\nconcept MustBeIncrementable\
    \ = requires (T x) { x++; };\n\ntemplate <typename T>\nconcept MustBeEvenOrOdd\
    \ = requires (T x) { x % 2; };\n\ntemplate<typename T> requires MustBeIncrementable<T>\
    \ && MustBeEvenOrOdd<T>\nvoid myfunction(T x)\n{\n    std::cout << \"The value\
    \ conforms to both conditions: \" << x << '\\n';\n}\n```\n\n```\nint main()\n\
    {\n    myfunction<char>(123); // OK\n    myfunction<int>(124); // OK\n    myfunction<double>(345);\
    \ // Error, a floating point number is not even\n    // nor odd\n}\n```\n\nIn\
    \ this example, the template will be instantiated if both concept requirements\
    \ are evaluated to true during compile time. Only the myfunction<char>(123); and\
    \ myfunction<int>(124); functions can be instantiated and pass the compilation.\
    \ The arguments of types char and int are indeed incrementable and can be either\
    \ even or odd. However, the statement myfunction<double>(345); does not pass a\
    \ compilation. The reason is that the second requirement MustBeEvenOrOdd is not\
    \ fulfilled as floating-point numbers are not odd nor even.\n\nImportant! Both\
    \ concepts say: for every x of type T, the statement inside the codeblock {} compiles\
    \ and nothing more. It compiles. If it compiles, the requirement for that type\
    \ is fulfilled.\n\nIf we want T to have a member function, for example, .empty()\
    \ and we want the result of that function to be convertible to bool, we write:\n\
    \n```\ntemplate <typename T>\nconcept HasMemberFunction requires (T x)\n{\n  \
    \  { x.empty() } -> std::convertible_to<bool>;\n}\n```\n\nThere are multiple predefined\
    \ concepts in the C++20 standard. They check if the type fulfils certain requirements.\
    \ These predefined concepts are located inside the <concepts> header. Some of\
    \ them are:\n\n- std::integral - specifies the type should be an integral type\n\
    - std::boolean - specifies the type can be used as a boolean type\n- std::move_constructible\
    \ - specifies that the object of a particular type can be constructed using the\
    \ move semantics\n- std::movable - specifies that the object of a certain type\
    \ T can be moved\n- std::signed_integral - says the type is both integral and\
    \ is a signed integral\n\n## 40.4.3 Lambda Templates\n\nWe can now use template\
    \ syntax in our lambda functions. Example:\n\n```\nauto mylambda = []<typename\
    \ T>(T param)\n{\n    // code\n};\n```\n\nFor example, to printout the generic\
    \ type name, using a templated lambda expression, we would write:\n\n```cpp\n\
    #include <iostream>\n#include <vector>\n#include <typeinfo>\n\nint main()\n{\n\
    \    auto mylambda = []<typename T>(T param)\n    {\n        std::cout << typeid(T).name()\
    \ << '\\n';\n    }\n\n    std::vector<int> v = { 1, 2, 3, 4, 5 };\n    mylambda(v);\
    \ // integer\n\n    std::vector<double> v2 = { 3.14, 123.456, 7.13 };\n    mylambda(v2);\
    \ // double\n}\n```\n\n## 40.4.4 [[likely]] and [[unlikely]] Attributes\n\nIf\
    \ we know that some paths of execution are more likely to be executed than others,\
    \ we can help the compiler optimize the code by placing attributes. We use the\
    \ [[likely]] attribute before the statement that is more likely to be executed.\
    \ We can also put the [[unlikely]] attribute before the statement that is unlikely\
    \ to be executed. For example, the attributes can be used on case branches inside\
    \ the switch statement:\n\n```cpp\n#include <iostream>\n\nvoid mychoice(int i)\n\
    {\n    switch (i)\n    {\n        [[likely]] case 1:\n            std::cout <<\
    \ \"Likely to be executed.\";\n            break;\n        [[unlikely]] case 2:\n\
    \            std::cout << \"Unlikely to be executed.\";\n            break;\n\
    \        default:\n            break;\n    }\n}\nint main()\n{\n    mychoice(1);\n\
    }\n```\n\nIf we want to use these attributes on if-else branches, we write:\n\n\
    ```cpp\n#include <iostream>\n\nint main()\n{\n    bool choice = true;\n    if\
    \ (choice) [[likely]]\n    {\n        std::cout << \"This statement is likely\
    \ to be executed\";\n    } else [[unlikely]] {\n        std::cout << \"This statement\
    \ is unlikely to be executed\";\n    }\n}\n```\n\n## 40.4.5 Ranges\n\nA range,\
    \ in general, is an object that refers to a range of elements. The new C++20 feature\
    \ is declared inside the <ranges> header. The ranges themselves are accessed via\
    \ std::ranges. With classic containers such as std::vector, if we want to sort\
    \ the data, use:\n\n```cpp\n#include <iostream>\n#include <vector>\n#include <algorithm>\n\
    \nint main() {\n  std::vector<int> v = { 1, 2, 3, 4, 5 };\n  std::sort(v.begin(),\
    \ v.end());\n\n  for (auto el : v) {\n    std::cout << el << '\\n';\n  }\n}\n\
    ```\n\nThe std::sort function accepts vector's .begin() and end() iterators. With\
    \ ranges, it is much simpler, we just provide the name of the range, without iterators:\n\
    \n```cpp\n#include <iostream>\n#include <ranges>\n#include <algorithm>\n\nint\
    \ main()\n{\n    std::vector<int> v = { 3, 5, 2, 1, 4 };\n    std::ranges::sort(v);\n\
    \n    for (auto el : v) {\n        std::cout << el << '\\n';\n    }\n}\n```\n\n\
    Ranges have a feature called adaptors. One of the range adaptors is views. The\
    \ views adaptors are accessed via std::ranges. Views are not owning. They cannot\
    \ change the values of the underlying elements. It is also said they are lazily\
    \ executed. This means the code from the views adaptors will not be executed until\
    \ we iterate over the result of such views.\n\nLet us create an example which\
    \ uses range views to filter out even numbers and print only the odd numbers from\
    \ a vector by creating a range view:\n\n```cpp\n#include <iostream>\n#include\
    \ <ranges>\n#include <vector>\n#include <algorithm>\n\nint main()\n{\n    std::vector<int>\
    \ v = { 1, 2, 3, 4, 5 };\n\n    auto oddnumbersview = v | std::views::filter([]int\
    \ x) { return x % 2 == 1 });\n    for (auto el : oddnumbersview) {\n        std::cout\
    \ << el << '\\n';\n    }\n}\n```\n\nExplanation: we have a simple vector with\
    \ some elements. Then we create a view adaptor on that vector, which filters the\
    \ numbers in the range. For this, we use the pipe operator |. Only the numbers\
    \ for which the predicate is true are included. In our case, this means the even\
    \ numbers are excluded. We iterate over the filtered view and print out the elements.\n\
    \nImportant to note, the underlying vector's elements are unaffected as we are\
    \ operating on a view, not on a vector.\n\nLet us create an example which creates\
    \ a view that returns only numbers greater than 2:\n\n```cpp\n#include <iostream>\n\
    #include <ranges>\n#include <vector>\n#include <algorithm>\n\nint main()\n{\n\
    \    std::vector<int> v = { 1, 2, 3, 4, 5 };\n\n    auto greaterthan2view = v\
    \ | std::views::filter([]int x) { return x > 2; });\n    for (auto el : greaterthan2view)\
    \ {\n        std::cout << el << '\\n';\n    }\n}\n```\n\nNow, let us combine the\
    \ views into one big view by separating them with multiple pipe | operators:\n\
    \n```cpp\n#include <iostream>\n#include <ranges>\n#include <vector>\n#include\
    \ <algorithm>\n\nint main()\n{\n    std::vector<int> v = { 1, 2, 3, 4, 5 };\n\
    \    auto oddandgreaterthan2 = v | std::views::filter([]int x) { return x % 2\
    \ == 1; }) \n                               | std::views::filter([]int x) { return\
    \ x > 2; });\n    for (auto el : oddandgreaterthan2) {\n        std::cout << el\
    \ << '\\n';\n    }\n}\n```\n\nThis example creates a range adaptor containing\
    \ odd numbers greater than two. We create this view by combining two different\
    \ range views into one.\n\nAnother ranges adaptors are algorithms. The idea is\
    \ to have the algorithms overload for ranges. To call an algorithm adaptor we\
