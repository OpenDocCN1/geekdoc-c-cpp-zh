- md: "\n# CHAPTER 25 CLASSES – INHERITANCE AND POLYMORPHISM\n\nclass has a function\
    \ with the same name and same type of arguments (none in our case) in the derived\
    \ class.\n\nIn our main program, we create an instance of a MyDerivedClass class\
    \ through a base class pointer. Using the arrow operator -> we invoke the appropriate\
    \ version of the function. Here the object morphs into different types to invoke\
    \ the appropriate function. Here it invokes the derived version. That is why the\
    \ concept is called polymorphism.\n\nIf there were no dowork() function in the\
    \ derived class, it would invoke the base class version:\n\n```\n#include <iostream>\n\
    class MyBaseClass\n{\npublic:\n    virtual void dowork()\n{\n        std::cout\
    \ << \"Hello from a base class.\" << '\\n';\n    }\n};\nclass MyDerivedClass :\
    \ public MyBaseClass\n{\npublic:\n};\nint main()\n{\n    MyBaseClass* o = new\
    \ MyDerivedClass();\n    o->dowork();\n    delete o;\n}\n```\n\nFunctions can\
    \ be pure virtual by specifying the = 0; at the end of the function declaration.\
    \ Pure virtual functions do not have definitions and are also called interfaces.\
    \ Pure virtual functions must be re-defined in the derived class. Classes having\
    \ at least one pure virtual function are called abstract classes and cannot be\
    \ instantiated. They can only be used as base classes. Example:\n\n```\n#include\
    \ <iostream>\n\nclass MyAbstractClass {\npublic:\n    virtual void dowork() =\
    \ 0;\n};\n\nclass MyDerivedClass : public MyAbstractClass {\npublic:\n    void\
    \ dowork() {\n        std::cout << \"Hello from a derived class.\" << '\\n';\n\
    \    }\n};\n\nint main() {\n    MyAbstractClass* o = new MyDerivedClass;\n   \
    \ o->dowork();\n    delete o;\n}\n```\n\nOne important thing to add is that a\
    \ base class must have a virtual destructor if it is to be used in a polymorphic\
    \ scenario. This ensures the proper deallocation of objects accessed through a\
    \ base class pointer via the inheritance chain:\n\n```\nclass MyBaseClass {\n\
    public:\n    virtual void dowork() = 0;\n    virtual ~MyBaseClass() {};\n}\n```\n\
    \nPlease remember that the use of operator *new* and raw pointers is discouraged\
    \ in modern C++. We should use smart pointers instead. More on this, later in\
    \ the book. So, three pillars of object-oriented programming are:\n\n- Encapsulation\n\
    - Inheritance\n- Polymorphism\n\nEncapsulation is grouping the fields into different\
    \ visibility zones, hiding implementation from the user, and exposing the interface,\
    \ for example.\nInheritance is a mechanism where we can create classes by inheriting\
    \ from a base class. Inheritance creates a certain class hierarchy and relationship\
    \ between them.\nPolymorphism is an ability of an object to morph into different\
    \ types during runtime, ensuring the proper function is invoked. This is achieved\
    \ through inheritance, virtual and overridden functions, and base and derived\
    \ class pointers.\n\n# CHAPTER 26\n\n## Exercises\n\n## 26.1 Inheritance\n\nWrite\
    \ a program that defines a base class called Person. The class has the following\
    \ members:\n\n- A data member of type std::string called *name*\n- A single parameter,\
    \ user-defined constructor which initializes the name\n- A getter function of\
    \ type std::string called getName(), which returns the name's value\n\nThen, write\
    \ a class called Student, which inherits from the class Person. The Student has\
    \ the following members:\n\n- An integer data member called semester\n- A user-provided\
    \ constructor that initializes the name and semester fields\n- A getter function\
    \ of type int getsemester(), which returns the semester's value\n\nIn a nutshell,\
    \ we will have a base class Person and extend its functionality in the derived\
    \ Student class:\n\n```\n#include <iostream>\n#include <string>\n\nclass Person\n\
    {\nprivate:\n    std::string name;\n\npublic:\n    explicit Person(const std::string&\
    \ aname)\n    : name{ aname }\n    {\n}\n\n    std::string fullname() const {\
    \ return name; }\n};\n```\n\nclass Student : public Person\n{\nprivate:\n    int\
    \ semester;\npublic:\n    Student(const std::string& aname, int asemter)\n   \
    \     : Person::Person{ aname }, semester{ asemter }\n    {\n    }\n    int getsemester()\
    \ const { return semester; }\n};\n```\n\nint main() {\n    Person person(\"John\
    \ Doe.\");\n    std::cout << person.fullname() << '\\n';\n    Student student(\"\
    Jane Doe\", 2);\n    std::cout << student.fullname() << '\\n';\n    std::cout\
    \ << \"Semester is: \" << student.getsemester() << '\\n';\n}\n```\n\nExplanation:\
    \ We have two classes, one is a base class (Person), and the other (Student) is\
    \ a derived class. Single parameter constructors should be marked with explicit\
    \ to prevent the compiler from making implicit conversions. This is the case with\
    \ Person's user-provided single parameter constructor:\n\n```\nexplicit Person(const\
    \ std::string& aname)\n    : name{ aname }\n    {}\n```\n\n# CHAPTER 26 EXERCISES\n\
    \nMember functions that do not modify the member fields should be marked as const.\
    \ The const modifier in member functions promises the functions will not modify\
    \ the members and are easier for compiler to optimize the code. The const modifier\
    \ in member functions:\n\n```cpp\nstd::string fullname() const { return name;\
    \ }\n```\n\nand getsemester():\n\n```cpp\nint getsemester() const { return semester;\
    \ }\n```\n\nThe Student class inherits from the Person and extends its functionality.\
    \ The Student class has a static field. The user-provided constructor initializes\
    \ the name field:\n\n```cpp\nStudent(const std::string& aname, int asemter)\n\
    \  : Person::Person{ aname }, semester{ asemter }\n{}\n```\n\n# CHAPTER 27\n\n\
    # The static Specifier\n\nThe static specifier says the object will have a static\
    \ duration. The memory for static objects is allocated when the program starts\
    \ and deallocated when the program ends. Only one instance of static exists. To\
    \ define a local static variable inside a function we use:\n\n```cpp\n#include\
    \ <iostream>\n\nvoid myFunction()\n{\n    static int x = 0; // defined only the\
    \ first time, skipped every time\n    x++;\n    std::cout << x << '\\n';\n}\n\n\
    int main()\n{\n    myFunction(); // x == 1\n    myFunction(); // x == 2\n    myFunction();\
    \ // x == 3\n}\n```\n\nThis variable is initialized the first time the program\
    \ encounters this function. The value of this variable is preserved across function\
    \ calls. What does this mean? The last changes we made to it stays. It will not\
    \ get initialized to 0 for every function call, only the first time. This is convenient\
    \ as we do not have to store the value inside some global variable.\n\n# THE STATIC\
    \ SPECIFIER\n\nWe can define static class member fields. Static class members\
    \ are not part of the object. They live independently of an object of a class.\
    \ We declare a static member inside the class and define it outside the class\
    \ only once:\n\n```cpp\n#include <iostream>\n\nclass MyClass {\npublic:\n    static\
    \ int x; // declare a static data member\n};\n\nint MyClass::x = 123; // define\
    \ a static data member\n\nint main() {\n    MyClass::x = 456; // access the static\
    \ data member\n    std::cout << \"Static data member value is: \" << MyClass::x;\n\
    }\n```\n\nHere we declared a static data member inside a class. Then we defined\
    \ it outside the class. When defining a static member outside the class, we do\
    \ not need to use the static specifier. Then, we access the data member by using\
    \ the MyClass::data_member_name notation.\n\nTo define a static member function,\
    \ we prepend the function declaration with the static keyword. The function definition\
    \ outside the class does not use the static keyword:\n\n```cpp\n#include <iostream>\n\
    class MyClass {\npublic:\n    static void myfunction(); // declare a static member\
    \ function\n}\n```\n"
  mdcn: "\n\n# 第 25 章 类——继承与多态\n\n派生类中具有与基类相同名称和相同参数类型（在本例中为无）的函数。\n\n在我们的主程序中，我们通过基类指针创建了\
    \ `MyDerivedClass` 类的实例。使用箭头运算符 `->` 来调用函数的适当版本。在这里，对象转变为不同的类型以调用相应的函数。在这里它调用了派生类的版本。这就是为什么这个概念被称为多态。\n\
    \n如果派生类中没有 `dowork()` 函数，它将调用基类的版本：\n\n```\n#include <iostream>\nclass MyBaseClass\n\
    {\npublic:\n    virtual void dowork()\n{\n        std::cout << \"Hello from a\
    \ base class.\" << '\\n';\n    }\n};\nclass MyDerivedClass : public MyBaseClass\n\
    {\npublic:\n};\nint main()\n{\n    MyBaseClass* o = new MyDerivedClass();\n  \
    \  o->dowork();\n    delete o;\n}\n```\n\n通过在函数声明的末尾指定 `= 0;` 可以将函数设为纯虚。纯虚函数没有定义，也被称为接口。纯虚函数必须在派生类中重新定义。至少包含一个纯虚函数的类称为抽象类，不能被实例化。它们只能作为基类使用。示例：\n\
    \n```\n#include <iostream>\n\nclass MyAbstractClass {\npublic:\n    virtual void\
    \ dowork() = 0;\n};\n\nclass MyDerivedClass : public MyAbstractClass {\npublic:\n\
    \    void dowork() {\n        std::cout << \"Hello from a derived class.\" <<\
    \ '\\n';\n    }\n};\n\nint main() {\n    MyAbstractClass* o = new MyDerivedClass;\n\
    \    o->dowork();\n    delete o;\n}\n```\n\n需要补充的一个重要点是，如果基类要在多态场景中使用，则它必须有一个虚析构函数。这确保了通过基类指针通过继承链访问的对象能够被正确释放：\n\
    \n```\nclass MyBaseClass {\npublic:\n    virtual void dowork() = 0;\n    virtual\
    \ ~MyBaseClass() {};\n}\n```\n\n请记住，在现代 C++ 中不建议使用 *new* 运算符和原始指针。我们应该使用智能指针。关于这一点，将在本书后面详细介绍。因此，面向对象编程的三支柱是：\n\
    \n- 封装\n- 继承\n- 多态\n\n封装是将字段分组到不同的可见性区域，向用户隐藏实现，并暴露接口，例如。\n继承是一种机制，我们可以通过从基类继承来创建类。继承在类与之间创建了一种特定的类层次结构和关系。\n\
    多态是对象在运行时转变为不同类型的能力，确保调用正确的函数。这是通过继承、虚函数和覆盖函数，以及基类和派生类指针实现的。\n\n# 第 26 章\n\n##\
    \ 练习\n\n## 26.1 继承\n\n编写一个程序定义一个名为 `Person` 的基类。该类具有以下成员：\n\n- 一个类型为 `std::string`\
    \ 的数据成员，名为 *name*\n- 一个单参数用户自定义构造函数，用于初始化名称\n- 一个类型为 `std::string` 的get函数 `getName()`，返回名称的值\n\
    \n然后，写一个名为 `Student` 的类，它继承自 `Person` 类。`Student` 具有以下成员：\n\n- 一个整数数据成员名为 `semester`\n\
    - 一个用户提供的构造函数，用于初始化名称和学期字段\n- 一个类型为 `int` 的get函数 `getsemester()`，返回学期的值\n\n简而言之，我们将有一个基类\
    \ `Person` 并在派生类 `Student` 中扩展其功能：\n\n```\n#include <iostream>\n#include <string>\n\
    \nclass Person\n{\nprivate:\n    std::string name;\n\npublic:\n    explicit Person(const\
    \ std::string& aname)\n    : name{ aname }\n    {\n}\n\n    std::string fullname()\
    \ const { return name; }\n};\n```\n\nclass Student : public Person\n{\nprivate:\n\
    \    int semester;\npublic:\n    Student(const std::string& aname, int asemter)\n\
    \        : Person::Person{ aname }, semester{ asemter }\n    {\n    }\n    int\
    \ getsemester() const { return semester; }\n};\n```\n\nint main() {\n    Person\
    \ person(\"John Doe.\");\n    std::cout << person.fullname() << '\\n';\n    Student\
    \ student(\"Jane Doe\", 2);\n    std::cout << student.fullname() << '\\n';\n \
    \   std::cout << \"Semester is: \" << student.getsemester() << '\\n';\n}\n```\n\
    \n解释：我们有两个类，一个是基类（Person），另一个（Student）是派生类。单参数构造函数应该被标记为 `explicit` 以防止编译器进行隐式转换。`Person`\
    \ 的用户提供的单参数构造函数就是此类情况：\n\n```\nexplicit Person(const std::string& aname)\n   \
    \ : name{ aname }\n    {}\n```\n\n# 第 26 章练习\n\n不修改成员字段的成员函数应该被标记为 `const`。成员函数中的\
    \ `const` 修饰符承诺函数不会修改成员，并且更容易让编译器优化代码。成员函数中的 `const` 修饰符：\n\n```cpp\nstd::string\
    \ fullname() const { return name; }\n```\n\n以及 `getsemester()`：\n\n```cpp\nint\
    \ getsemester() const { return semester; }\n```\n\n`Student` 类继承自 `Person` 并扩展了它的功能。`Student`\
    \ 类有一个静态字段。用户提供的构造函数初始化了名称字段：\n\n```cpp\nStudent(const std::string& aname, int\
    \ asemter)\n  : Person::Person{ aname }, semester{ asemter }\n{}\n```\n\n# 第 27\
    \ 章\n\n# 静态限定符\n\n静态限定符表示对象将具有静态生存期。静态对象的内存在程序启动时分配，在程序结束时释放。静态只存在实例。在函数内部定义局部静态变量，我们使用：\n\
    \n```cpp\n#include <iostream>\n\nvoid myFunction()\n{\n    static int x = 0; //\
    \ 仅定义一次，之后跳过\n    x++;\n    std::cout << x << '\\n';\n}\n\nint main()\n{\n   \
    \ myFunction(); // x == 1\n    myFunction(); // x == 2\n    myFunction(); // x\
    \ == 3\n}\n```\n\n该变量在第一次遇到此函数时初始化。变量的值在函数调用之间保持。这意味着什么？我们对其进行的最后的更改会被保留。它不会在每次函数调用时初始化为\
    \ 0，只有第一次如此。这非常方便，因为我们不需要在全局变量中存储该值。\n\n静态限定符\n\n我们可以定义静态类成员。静态类成员不属于对象。它们独立于类的实例。我们在类内部声明静态成员，并仅在类外部定义一次：\n\
    \n```cpp\n#include <iostream>\n\nclass MyClass {\npublic:\n    static int x; //\
    \ 声明静态数据成员\n};\n\nint MyClass::x = 123; // 定义静态数据成员\n\nint main() {\n    MyClass::x\
    \ = 456; // 访问静态数据成员\n    std::cout << \"Static data member value is: \" << MyClass::x;\n\
    }\n```\n\n在这里我们在类内部声明了静态数据成员，然后在类外部定义。在类外部定义静态成员时，不需要使用静态限定符。然后通过 `MyClass::data_member_name`\
    \ 符号来访问数据成员。\n\n要定义静态成员函数，我们需要在函数声明前加上 `static` 关键字。类外的函数定义不使用 `static` 关键字：\n\
    \n```cpp\n#include <iostream>\nclass MyClass {\npublic:\n    static void myfunction();\
    \ // 声明静态成员函数\n}\n```\n\n"
