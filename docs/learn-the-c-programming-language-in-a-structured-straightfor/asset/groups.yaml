    \ v = { 10, 5, 8, 4, 1, 2 };\n    int findnumber = 4;\n\n    auto foundit = std::find(std::begin(v),\
    \ std::end(v), findnumber);\n    if (foundit != std::end(v))\n    {\n        std::cout\
    \ << \"Element found. Deleting the element.\" << '\\n';\n        v.erase(foundit);\n\
    \        std::cout << \"Element deleted.\" << '\\n';\n    }\n    else\n    {\n\
    \        std::cout << \"Element not found.\" << '\\n';\n    }\n\n    for (auto\
    \ el : v)\n    {\n        std::cout << el << '\\n';\n    }\n}\n```\n\n## 39 EXERCISES\n\
    \n```cpp\nint main()\n{\n    std::vector<int> v = { 10, 5, 8, 4, 1, 2 };\n   \
