- md: "\n## 40.4.6 Coroutines\n\nA coroutine is a function that can be suspended and\
    \ be resumed. The ordinary function is a coroutine if it uses any of the following\
    \ operators in its function body:\n\n- co_await - suspends the execution of the\
    \ coroutine until some other computation is performed, that is until the coroutine\
    \ resumes\n- co_yield - suspends a coroutine and return a value to the caller\n\
    - co_return - returns from a coroutine and stops its execution\n\n## 40.4.7 std::span\n\
    \nSome containers and types store their elements in a sequence, one next to the\
    \ other. This is the case for arrays and vectors. We can represent such containers\
    \ with a pointer to their first element plus the length of the container. A std::span\
    \ class template from a <span>-header is just that. A reference to a span of contiguous\
    \ container elements. One reason to use std::span, is that it is cheap to construct\
    \ and copy. Span does not own a vector or an array references. However, it can\
    \ change the value of the elements. To create a span from a vector we use:\n\n\
    ```cpp\n#include <iostream>\n#include <vector>\n#include <span>\n\nint main()\n\
    {\n    std::vector<int> v = { 1, 2, 3 };\n    std::span<int> myintspan = v;\n\
    \    myintspan[2] = 256;\n\n    for (auto el : v) {\n        std::cout << el <<\
    \ '\\n';\n    }\n}\n```\n\n## CHAPTER 40 C++ Standards\n\nHere, we created a span\
    \ that references vector elements. Then we used the span to change the vector's\
    \ third element. With span, we do not have to worry about passing a pointer and\
    \ a length around, and we just use the neat syntax of a span wrapper. Since the\
    \ size of the vector can change, we say our span has a dynamic extent. We can\
    \ create a fixed-size span from a fixed-sized array. We say our span now has a\
    \ static extent.\n\n```cpp\n#include <iostream>\n#include <span>\n\nint main()\n\
    {\n    int arr[] = { 1, 2, 3, 4, 5 };\n    std::span<int, 5> myintspan = arr;\n\
    \    myintspan[4] = 10;\n\n    for (auto el : arr)\n    {\n        std::cout <<\
    \ el << '\\n';\n    }\n}\n```\n\n## 40.4.8 Mathematical Constants\n\nC++20 standard\
    \ introduces a way to represent some of the mathematical constants. To use them,\
    \ we need to include the <numbers> header. The constants themselves are inside\
    \ the std::numbers namespace. The following example shows how to use numbers pi\
    \ and e, results of logarithmic functions and square roots of numbers 2 and 3:\n\
    \n```cpp\n#include <iostream>\n#include <numbers>\n\nint main()\n{\n    std::cout\
    \ << \"Pi: \" << std::numbers::pi << '\\n';\n    std::cout << \"e: \" << std::numbers::e\
    \ << '\\n';\n    std::cout << \"log2(e): \" << std::numbers::log2e << '\\n';\n\
    }\n```\n\n```cpp\n    std::cout << \"log10(e): \" << std::numbers::log10e << '\\\
    n';\n    std::cout << \"ln(2): \" << std::numbers::ln2 << '\\n';\n    std::cout\
    \ << \"ln(10): \" << std::numbers::ln10 << '\\n';\n    std::cout << \"sqrt(2):\
    \ \" << std::numbers::sqrt2 << '\\n';\n    std::cout << \"sqrt(3): \" << std::numbers::sqrt3\
    \ << '\\n';\n}\n```\n\n## Summary and Advice\n\nDear reader, congratulations on\
    \ finishing this book. Hopefully, by now, you are familiar with the C++ language,\
    \ the standard library, and various C++ standards and features. Learning C++ is\
    \ no small task. But, it is an achievable and rewarding task. My goal was to present\
    \ a language and standard library backbone, something every aspiring C++ developer\
    \ should know.\n\nWhere to go from here? I will recommend a few resources and\
    \ books I feel essential for every C++ professional.\n\n## The go-to Reference\n\
    \nThe go-to reference for the C++ language and the standard library is the cppreference\
    \ at: https://www.cppreference.com\n\nIt is the number one resource when it comes\
    \ to C++ and the library. It is an exceptionally well written, community-driven,\
    \ wiki-style C++ reference packed with theory and examples. It is even the cppreference\
    \ is unofficial C++ documentation. The cppreference should be your number one\
    \ reference resource.\n\n## StackOverflow\n\nStackOverflow is a community-driven\
    \ programming Q & A site. It has a wealth of up to date information on a plethora\
    \ of languages, including C++:\n\n```\nhttps://stackoverflow.com/questions/tagged/c%2b%2b\n\
    ```\n\n## Other Online Resources\n\nThe Standard C++ Foundation has a C++ super\
    \ FAQ page at:\nhttps://isocpp.org/faq\n\nThis resource has some great articles\
    \ for C++11, C++14, and the language in general. It also features a list of nice\
    \ C++ blogs.\n\n## Other C++ Books\n\nStackOverflow maintains a list of C++ books\
    \ called \"The Definitive C++ Book Guide and List\" at:\nhttps://stackoverflow.com/questions/388242/the-definitive-c-guide-and-list\n\
    \nFrom this collection, I highly recommend the following books:\n\n- \"The C++\
    \ Programming Language\" by Bjarne Stroustrup\n- \"Effective C++\" by Scott Meyers\n\
    - \"Effective Modern C++\" by Scott Meyers\n\n## Advice\n\nTo quote my good friend\
    \ and a fellow C++ developer: \"C++ is a fountain of constant learning. So, do\
    \ not get intimidated by the complexity in the beginning. C++ is a tool first\
    \ and foremost. Take from it what you need at first. You do not need to know every\
    \ language feature or quirk to be a successful developer. Aim to be around 5 people.\
    \ Get a mentor and learn from existing frameworks. Attend C++ conferences if able.\
    \ Being a C++ developer is a good choice. It pays you well, and is rewarding in\
    \ many ways.\"\n\n## Index\n\n### A\n- Access specifiers/labels, 99–101, 123–124\n\
