    \ << '\\n';\n    std::cout << \"The last array element is: \" << arr[4] << '\\\
    n';\n}\n```\n\n## 15.2 Pointer to an Object\n\nWrite a program that defines an\
    \ object of type double. Define a pointer that points to that object. Print the\
    \ value of the pointed-to object by dereferencing a pointer.\n\n```cpp\n#include\
    \ <iostream>\nint main()\n{\n    double d = 3.14;\n    double* p = &d;\n    std::cout\
    \ << \"The value of the pointed-to object is: \" << *p;\n}\n```\n\n## 15.3 Reference\
    \ Type\n\nWrite a program that defines an object of type double called myydouble.\
    \ Define an object of reference type called myreference and initialize it with\
    \ myydouble. Change the value of myreference. Print the object value using both\
    \ the reference and the original.\n\n```cpp\n#include <iostream>\n\nint main()\n\
    {\n    double myydouble = 3.14;\n    double& myreference = myydouble;\n\n    std::cout\
    \ << \"The values are: \" << myydouble << \" \" << myreference << \"\\n\";\n\n\
    \    myydouble = 9.45;\n    std::cout << \"The values are: \" << myydouble <<\
    \ \" \" << myreference << \"\\n\";\n}\n```\n\n## 15.4 Strings\n\nWrite a program\
