  - "[PAGE 284]\n\n# 40.4.6 Coroutines\n\nA coroutine is a function that can be suspended\
    \ and be resumed. The ordinary function is a coroutine if it uses any of the following\
    \ operators in its function body:\n\n+   - co_await - suspends the execution of\
    \ the coroutine until some other computation is performed, that is until the coroutine\
    \ resumes\n- co_yield - suspends a coroutine and return a value to the caller\n\
    - co_return - returns from a coroutine and stops its execution\n\n# 40.4.7 std::span\n\
    \nSome containers and types store their elements in a sequence, one next to the\
    \ other. This is the case for arrays and vectors. We can represent such containers\
    \ with a pointer to their first element plus the length of the container. A std::span\
    \ class template from a <span></span>-header is just that. A reference to a span\
    \ of contiguous container elements. One reason to use std::span, is that it is\
    \ cheap to construct and copy. Span does not own a vector or an array references.\
    \ However, it can change the value of the elements. To create a span from a vector\
    \ we use:\n\n```\n#include <iostream>\n#include <vector>\n#include <span>\n\n\
    int main()\n{\n    std::vector<int> v = { 1, 2, 3 };\n    std::span<int> myintspan\
    \ = v;\n    myintspan[2] = 256;\n\n    for (auto el : v) {\n        std::cout\
    \ << el << '\\n';\n    }\n}\n```"
  - "[PAGE 285]\n\n# CHAPTER 40 C++ Standards\n\nHere, we created a span that references\
    \ vector elements. Then we used the span to change the vector's third element.\
    \ With span, we do not have to worry about passing a pointer and a length around,\
    \ and we just use the neat syntax of a span wrapper. Since the size of the vector\
    \ can change, we say our span has a dynamic extent. We can create a fixed-size\
    \ span from a fixed-sized array. We say our span now has a static extent.\n\n\
    ```\n#include <iostream>\n#include <span>\n\nint main()\n{\n    int arr[] = {\
    \ 1, 2, 3, 4, 5 };\n    std::span<int, 5> myintspan = arr;\n    myintspan[4] =\
    \ 10;\n\n    for (auto el : arr)\n    {\n        std::cout << el << '\\n';\n \
    \   }\n}\n```\n\n# 40.4.8 Mathematical Constants\n\nC++20 standard introduces\
    \ a way to represent some of the mathematical constants. To use them, we need\
    \ to include the <numbers> header. The constants themselves are inside the std::numbers\
    \ namespace. The following example shows how to use numbers pi and e, results\
    \ of logarithmic functions and square roots of numbers 2 and 3:\n\n```\n#include\
    \ <iostream>\n#include <numbers>\n\nint main()\n{\n    std::cout << \"Pi: \" <<\
    \ std::numbers::pi << '\\n';\n    std::cout << \"e: \" << std::numbers::e << '\\\
    n';\n    std::cout << \"log2(e): \" << std::numbers::log2e << '\\n';\n}\n```"
