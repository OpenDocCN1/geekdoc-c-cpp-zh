    }\n```\n\n### 36.3 Unique Pointer to an Object of a Class\n\nWrite a program that\
    \ defines a class with two data members, a user-defined constructor, and one member\
    \ function. Create a unique pointer to an object of a class. Use the smart pointer\
    \ to access the member function.\n\n```cpp\n#include <iostream>\n#include <memory>\n\
    \nclass MyClass\n{\nprivate:\n    int x;\n    double d;\npublic:\n    MyClass(int\
