    \ They divide the parameters and return the result to themselves. The first function\
    \ overload is of type int and has two parameters of types int. The second overload\
    \ is of type double and accepts two parameters of type double. Invoke the appropriate\
    \ overload in main, by supplying integer arguments and then the double arguments.\
    \ Observe different results.\n\n```cpp\n#include <iostream>\n#include <string>\n\
    \nint division(int x, int y)\n{\n    return x / y;\n}\n\ndouble division(double\
    \ x, double y)\n{\n    return x / y;\n}\nint main()\n{\n    std::cout << \"Integer\
    \ division: \" << division(9, 2) << '\\n';\n    std::cout << \"Floating point\
    \ division: \" << division(9.0, 2.0);\n}\n```\n\n## CHAPTER 21\n\n## Scope and\
    \ Lifetime\n\nWhen we declare a variable, its name is valid only inside some sections\
    \ of the source code. And that section (part, portion, region) of the source code\
    \ is called scope. It is the region of code in which the name can be accessed.\
    \ There are different scopes:\n\n### 21.1 Local Scope\n\nWhen we declare a name\
    \ inside a function, that name has a local scope. Its scope starts from the point\
    \ of declaration till the end of the function block marked with {}.\nExample:\n\
    \n```cpp\nvoid myfunction()\n{\n    int x = 123; // Here begins the x's scope\n\
    } // and here it ends\n```\n\nOur variable x is declared inside a myfunction()\
    \ body, and it has a local scope. We say that name x is local to myfunction().\
    \ It exists (can be accessed) only inside the function's scope and nowhere else.\n\
    \n### 21.2 Block Scope\n\nThe block-scope is a section of code marked by a block\
    \ of code starting with { and ending with }.\\ Example:\n\n```cpp\nint main()\n\
    {\n    int x = 123; // first x' scope begins here\n    {\n        int x = 456;\
    \ // redefinition of x, second x' scope begins here\n    } // block ends, second\
    \ x' scope ends here\n    // the first x resumes here\n}\n```\n\nThere are other\
    \ scopes as well, which we will cover later in the book. It is important to introduce\
    \ the notion of scope at this point to explain the object's lifetime.\n\n### 21.3\
    \ Lifetime\n\nThe lifetime of an object is the time an object spends in memory.\
    \ The lifetime is determined by a so-called storage duration. There are different\
    \ kinds of storage durations.\n\n### 21.4 Automatic Storage Duration\n\nThe automatic\
    \ storage duration is a duration where memory for an object is automatically allocated\
    \ at the beginning of a block and deallocated when the code block ends. This is\
    \ also called a stack memory; objects are allocated on the stack. In this case,\
    \ the object's lifetime is determined by its scope. All local objects have this\
    \ storage duration.\n\n### 21.5 Dynamic Storage Duration\n\nThe dynamic storage\
    \ duration is a duration where memory for an object is manually allocated and\
    \ manually deallocated. This kind of storage is often referred to heap memory.\
    \ The user determines when the memory for an object will be allocated, and when\
    \ it will be released. The lifetime of an object is not determined by a scope\
    \ in which it was defined. We do it through operator new and smart pointers. In\
    \ modern C++, we should prefer the smart pointer facilities to operator new.\n\
    \n### 21.6 Static Storage Duration\n\nWhen an object declaration is prepended\
    \ with a static specifier, it means the storage for a static object is allocated\
    \ when the program starts and deallocated when the program ends. There is only\
    \ one instance of such objects, and (with a few exceptions) their lifetime ends\
    \ when a program ends. They are objects we can access at any given time during\
    \ the execution of a program. We will talk about static specifier and static initialization\
    \ later in the book.\n\n### 21.7 Operators new and delete\n\nWe can dynamically\
    \ allocate storage for our object and have pointers point to this newly allocated\
    \ memory.\n\nThe operator new allocates space for an object. The object is allocated\
    \ on the free-store, often called heap or heap memory. The allocated memory must\
    \ be deallocated using operator delete. It deallocates the memory previously allocated\
    \ with an operator new. Example:\n\n```cpp\n#include <iostream>\n\nint main(){\n\
    \    int* p = new int;\n    *p = 123;\n    std::cout << \"The pointed-to-value\
    \ is: \" << *p;\n    delete p;\n}\n```\n\nThis example allocates space for one\
    \ integer on the free-store. Pointer p now points to the newly allocated memory\
    \ for our integer. We can now assign a value to our newly allocated integer object\
    \ by dereferencing a pointer. Finally, we free the memory by calling the operator\
    \ delete.\n"
