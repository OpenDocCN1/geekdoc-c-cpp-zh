  - "[PAGE 185]\n\n# CHAPTER 35\n\n# Smart Pointers\n\nSmart pointers are pointers\
    \ that own the object they point to and automatically destroy the object they\
    \ point to and deallocate the memory once the pointers go out of scope. This way,\
    \ we do not have to manually delete the object like it was the case with the new\
    \ and delete operators.\n\nSmart pointers are declared in the <memory> header.\
    \ We will cover the following smart pointers - unique and shared.\n\n# 35.1 Unique\
    \ Pointer\n\nA unique pointer called std::unique_ptr is a pointer that owns an\
    \ object it points to. The pointer cannot be copied. Unique pointer deletes the\
    \ object and deallocates memory for it, once it goes out of scope. To declare\
    \ a unique pointer to a simple int object, we write:\n\n```\n#include <iostream>\n\
    #include <memory>\n\nint main()\n{\n    std::unique_ptr<int> p(new int{ 123 }});\n\
    \    std::cout << *p;\n}\n```\n\nThis example creates a pointer to an object of\
    \ type int and assigns a value of 123 to the object. A unique pointer can be dereferenced\
    \ in the same way we as a regular pointer using the *p notation. The object gets\
    \ deleted once p goes out of scope, which in this case, is at the closing brace\
    \ }. No explicit use of delete operator is required."
  - "[PAGE 186]\n\n# CHAPTER 35 SMART POINTERS\n\nA better way to initialize a unique\
    \ pointer is through an std::make_unique<some_type>(some_value) function, where\
    \ we specify the type for the object in angle brackets and the value for the object\
    \ pointer points in parentheses:\n\n```\n#include <iostream>\n#include <memory>\n\
    \nint main() {\n    std::unique_ptr<int> p = std::make_unique<int>(123);\n   \
    \ std::cout << *p;\n}\n```\n\nThe std::make_unique function was introduced in\
    \ the C++14 standard. Make sure to compile with the -std=c++14 flag to be able\
    \ to use this function.\n\nWe can create a unique pointer that points to an object\
    \ of a class and then use its -> operator to access iostream members:\n\n```\n\
    #include <iostream>\n#include <memory>\n\nclass MyClass {\npublic:\n    void printmessage()\
    \ {\n        std::cout << \"Hello from a class.\";\n    }\n};\n\nint main() {\n\
    \    std::unique_ptr<MyClass> p = std::make_unique<MyClass>();\n    p->printmessage();\n\
    }\n```\n\nThe object gets destroyed once p goes out of scope. So, prefer a unique\
    \ pointer to raw pointer and their new-delete mechanism. Once p goes out of scope,\
    \ the pointed-to object of a class gets destroyed."
- md: "\n## CHAPTER 35 SMART POINTERS\n\nWe can utilize polymorphic classes using\
    \ a unique pointer:\n\n```cpp\n#include <iostream>\n#include <memory>\n\nclass\
    \ MyBaseClass {\npublic:\n    virtual void printmessage()\n    {\n        std::cout\
    \ << \"Hello from a base class.\";\n    }\n};\nclass MyderivedClass: public MyBaseClass\
    \ {\npublic:\n    void printmessage()\n    {\n        std::cout << \"Hello from\
    \ a derived class.\";\n    }\n};\nint main() {\n    std::unique_ptr<MyBaseClass>\
    \ p = std::make_unique<MyderivedClass>();\n    p->printmessage();\n}\n```\n\n\
    Neat ha? No need to explicitly delete the allocated memory, the smart pointer\
    \ does for us. Hence the smart part.\n\n### 35.2 Shared Pointer\n\nWe can have\
    \ multiple pointers point to a single object. We can say that all of them own\
    \ our pointed-to object, that is, our object has shared ownership. And only when\
    \ last of those pointers get destroyed, our pointed to object gets deleted. This\
    \ is what a shared pointer pointer is for. Multiple pointers pointing to a single\
    \ object, and when all of them get out of scope, the object gets destroyed.\n\n\
    Shared pointer is defined as std::shared_ptr<some_type>. It can be initialized\
    \ using the std::make_shared<some_type>(some_value) function. Shared pointers\
    \ can be copied. To have three smart pointers pointing at the same object we can\
    \ write:\n\n```cpp\n#include <iostream>\n#include <memory>\n\nint main() {\n \
    \   std::shared_ptr<int> p1 = std::make_shared<int>(123);\n    std::shared_ptr<int>\
    \ p2 = p1;\n    std::shared_ptr<int> p3 = p1;\n}\n```\n\nWhen all pointers get\
    \ out of scope, the pointed-to-object gets destroyed, and the memory for it gets\
    \ deallocated.\n\nThe main differences between unique and shared pointers are:\n\
    \n- With unique pointers, we have one pointer pointing at and owning a single\
    \ object, whereas with shared pointers we have multiple pointers pointing at and\
    \ owning a single object.\n- Unique pointers can not be copied, whereas shared\
    \ pointers can.\n\nIf you wonder which one to use, let us say that 90% of the\
    \ time, you will be using the unique_ptr. Shared pointers can be used to represent\
    \ data structures such as graphs.\n\nSmart pointers are class templates themselves,\
    \ meaning they have member functions. We will just briefly mention they can also\
    \ accept custom deleters, a code that gets executed when they get out of scope.\n\
    \nNotice that with smart pointers, we do not need to specify the <some_type>*,\
    \ we just need to specify the <some_type>.\n\n**Important!\n\nPrefer smart pointers\
    \ to raw pointers. Smart pointers, we do not have to worry if we properly matched\
    \ calls to new with calls to delete as we do not need them. We let the smart pointer\
    \ do all the heavy lifting.\n\n## CHAPTER 36\n\n## Exercises\n\n### 36.1 static_cast\
    \ Conversion\n\nWrite a program that uses a static_cast function to convert between\
    \ fundamental types.\n\n```cpp\n#include <iostream>\n\nint main()\n{\n    int\
    \ x = 123;\n    double d = 456.789;\n    bool b = true;\n\n    double doublesult\
    \ = static_cast<double>(x);\n    std::cout << \"Int to double: \" << doublesult\
    \ << \"\\n\";\n    \n    int intresult = static_cast<int>(d); // double to int\n\
    \    std::cout << \"Double to int: \" << intresult << \"\\n\";\n    \n    bool\
    \ boolresult = static_cast<bool>(x); // int to bool\n    std::cout << \"Int to\
    \ bool: \" << boolresult << \"\\n\";\n\n}\n```\n\n### 36.2 A Simple Unique Pointer:\n\
    \nWrite a program that defines a unique pointer to an integer value. Use the std::make_unique\
