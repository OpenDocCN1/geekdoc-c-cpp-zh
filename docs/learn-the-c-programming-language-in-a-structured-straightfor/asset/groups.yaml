    # CHAPTER 38


    # ## C++ Standard Library and Friends


    C++ language is accompanied by a library called the *C++ Standard Library*. It
    is a collection of containers and useful functions that we access by including
    the proper header file. The containers and functions inside the C++ standard library
    are defined in the std namespace. Remember the std::string type mentioned earlier?
    It is also a part of the standard library. The standard library is implemented
    through class templates. Long story short: prefer using the standard-library to
    user-provided libraries for everyday tasks.


    Some functionalities explained in this chapter, such as range-based for loop and
    lambda expressions are part of the language itself, not the standard-library.
    The reason we put them here is they are mostly used in conjunction with standard-library
    facilities.


    #  38.1 Containers


    A container is a place where we store our objects. There are different categories
    of containers, here we mention the two:


    +   - Sequence containers


    +   - Associative containers


    Sequential containers store objects in a sequence, one next to the other in memory.'
- md: "\n# 38.1.1 std::vector\n\nVector is a container defined in <vector> header.\
    \ Vector is a sequence of contiguous elements. Of what type, may you ask? Any\
    \ type. A vector and all other containers are implemented as class templates allowing\
    \ for storage of (almost) any type. To define a vector, we use the following:\
    \ std::vector<some_type>. A simple example of initializing a vector of 5 integers:\n\
    \n```cpp\n#include <vector>\n\nint main(){\n    std::vector<int> v = { 1, 2, 3,\
    \ 4, 5 };\n}\n```\n\nWe defined a vector, called v, of 5 integer elements, and\
    \ we initialized a vector using the brace initialization. Vector can grow and\
    \ shrink on its own as we insert and delete elements into and from a vector. To\
    \ insert an element at the end of the vector, we use the vector's.push_back()\
    \ member function. Example:\n\n```cpp\n#include <vector>\n\nint main(){\n    std::vector<int>\
    \ v = { 1, 2, 3, 4, 5 };\n    v.push_back(10);\n}\n```\n\nThis example inserts\
    \ a value of 10 at the end of our vector. Now we have a container of 6 elements:\
    \ 1 2 3 4 5 10.\n\nVector elements are indexed, the first element has an index\
    \ of 0. Individual elements can be accessed via the subscript operator [element_index]\
    \ or a member function at(element_index):\n\n```cpp\n#include <iostream>\n#include\
    \ <vector>\n\nint main()\n{\n    std::vector<int> v = { 1, 2, 3, 4, 5 };\n   \
    \ std::cout << \"The third element is:\" << v[2] << '\\n';\n    std::cout << \"\
    The fourth element is:\" << v.at(3) << '\\n';\n}\n```\n\nVector's size as a number\
    \ of elements, can be obtained through a .size() member function:\n\n```cpp\n\
    #include <iostream>\n#include <vector>\n\nint main()\n{\n    std::vector<int>\
    \ v = { 1, 2, 3, 4, 5 };\n    std::cout << \"The vector's size is: \" << v.size();\n\
    }\n```\n\nA vector is a sequential container. It stores elements in a sequence.\
    \ Other sequential containers are:\n\n- a. std::list - A doubly linked list\n\
    - b. std::forward_list - A singly linked list\n- c. std::deque - A double-ended\
    \ queue\n\nSo, which one to use? When in doubt, use std::vector. Each of these\
    \ containers has different insertions and lookup times, and each one serves a\
    \ different purpose. Nevertheless, as far as sequence containers go, the std::vector\
    \ is the container we want to be using most of the time.\n\n# 38.1.2 std::array\n\
    \nstd::array is a thin wrapper around a C-style array. Arrays get converted to\
    \ pointers when used as function arguments, and we should prefer std::array wrapper\
    \ to old C-style arrays. The std::array is of the following signature: std::array<type_name,\
    \ array_size>; A simple example:\n\n```cpp\n#include <iostream>\n#include <array>\n\
    \nint main()\n{\n    std::array<int, 5> arr = { 1, 2, 3, 4, 5 };\n    for (auto\
    \ el : arr)\n    {\n        std::cout << el << '\\n';\n    }\n}\n```\n\nThis example\
    \ creates an array of 5 elements using a std::array container and prints them\
    \ out. Let us emphasizes this once again: prefer std::array or std::vector to\
    \ old/raw C-style arrays.\n\n# 38.1.3 std::set\n\nSet is a container that holds\
    \ unique, sorted objects. It is a binary tree of sorted objects. To use a set,\
    \ we must include the <set> header. To define a set we use the std::set<type>\
    \ set syntax. To initialize a set of 5 integers, we can write:\n\n```cpp\n#include\
    \ <iostream>\n#include <set>\n\nint main()\n{\n    std::set<int> myset = { 1,\
    \ 2, 3, 4, 5 };\n    for (auto el : myset) {\n        std::cout << el << '\\n';\n\
    \    }\n}\n```\n\nTo insert an element into a set, we use the set's .insert(value)\
    \ member function. Insert two new elements, we use:\n\n```cpp\n#include <iostream>\n\
    #include <set>\n\nint main()\n{\n    std::set<int> myset = { 1, 2, 3, 4, 5 };\n\
    \    myset.insert(10);\n    myset.insert(42);\n    for (auto el : myset)\n   \
    \ {\n        std::cout << el << '\\n';\n    }\n}\n```\n\nSince the set holds unique\
    \ values, the attempt to insert duplicate values will not succeed.\n\n# 38.1.4\
    \ std::map\n\nThe map is an associative container that holds key-value pairs.\
    \ Keys are sorted and unique. A map is also implemented as a balanced binary tree/graph.\
    \ So now, instead of one value per element, we have two. To use a map, we need\
    \ to include the header. To define a map, we use the std::map<type1, type2> map_name\
    \ syntax. Here the type1 represents the type of the key, and type2 represents\
    \ the type of a value. To initialize a map of int pairs, for example, we can write:\n\
    \n```cpp\n#include <iostream>\n#include <map>\n\nint main()\n{\n    std::map<int,\
    \ char> mymap = { {1, 'a'}, {2, 'b'}, {3, 'z'} };\n}\n```\n\nIn this example,\
    \ integers are keys, and the characters are the values. Every map element is a\
    \ pair. The pair's first element (the key) is accessed through first member variable,\
    \ the second element (the value) is accessed through second member function. To\
    \ print out our map, we can use:\n\n```cpp\n#include <iostream>\n#include <map>\n\
    \nint main()\n{\n    std::map<int, char> mymap = { {1, 'a'}, {2, 'b'}, {3, 'z'}\
    \ };\n    for (auto el : mymap)\n    {\n        std::cout << el.first << ' ' <<\
    \ el.second;\n    }\n}\n```\n\nWe can also construct a map through its default\
    \ constructor and some help from its subscript operator. If the key accessed through\
    \ a subscript operator does not exist, the entire key-value pair gets inserted\
    \ into a map. Example:\n\n```cpp\n#include <iostream>\n#include <map>\n\nint main()\n\
    {\n    std::map<int, char> mymap;\n    mymap[1] = 'a';\n    mymap[2] = 'b';\n\
    \    mymap[3] = 'z';\n}\n```\n\nTo insert into a map, we can use the .insert()\
    \ member function:\n\n```cpp\n#include <iostream>\n#include <map>\n\nint main()\
    \ {\n    std::map<int, char> mymap = { {1, 'a'}, {2, 'b'}, {3, 'z'} };\n    mymap.insert({2,\
    \ 'c'});\n\n    for (auto el : mymap) {\n        std::cout << el.first << ' '\
    \ << el.second;\n    }\n}\n```\n\nTo search for a specific key inside a map, we\
    \ can use the map's .find(key_value) member function, which returns an iterator.\
    \ If the key was not found, this function returns an iterator with the value of\
    \ .end(). If the key was found, the function returns the iterator pointing to\
    \ the pair containing the searched key:\n\n```cpp\n#include <iostream>\n#include\
    \ <map>\n\nint main() {\n    std::map<int, char> mymap = { {1, 'a'}, {2, 'b'},\
    \ {3, 'z'} };\n    auto it = mymap.find(2);\n    if (it != mymap.end()) {\n  \
    \      std::cout << \"Found: \" << it->first << \" \" << it->second << '\\n';\n\
    \    } else {\n        std::cout << \"Not found.\";\n    }\n}\n```\n\nIterator\
    \ now points at a map element. Map elements are pairs that consist of the first\
    \ element - the key and the second element – the value. To access these using\
    \ an iterator, first we must dereference an iterator using the arrow operator\
    \ ->. Then we call the pair's first member variable for a key and second for a\
    \ value.\n\n# std std::pair\n\nThe std::pair class template is a wrapper that\
    \ can represent a pair of values. To use the std::pair, we need to include the\
    \ <utility> header. To access the first value in a pair, we use the .first member\
    \ variable. To access the second value in a pair, we use the .second member variable.\
    \ Example:\n\n```cpp\n#include <iostream>\n#include <utility>\n\nint main() {\n\
    \    std::pair<int, double> mypair = { 123, 3.14 };\n    std::cout << \"The first\
    \ element is: \" << mypair.first << '\\n';\n    std::cout << \"The second element\
    \ is: \" << mypair.second << '\\n';\n}\n```\n\nAnother way to create a pair is\
    \ through a std::make_pair function:\n\n```cpp\n#include <iostream>\n#include\
    \ <utility>\n\nint main() {\n    int x = 123;\n    double d = 3.14;\n\n    std::pair<int,\
    \ double> mypair = std::make_pair(x, d);\n    std::cout << \"The first element\
    \ is: \" << mypair.first << '\\n';\n    std::cout << \"The second element is:\
    \ \" << mypair.second << '\\n';\n}\n```\n\n# 38.1.6 Other Containers\n\nThere\
    \ are other, less used containers in the standard library as well. We will mention\
    \ a few of them:\n\n- a. std::forward_list - a singly linked list\n- b. std::list\
    \ - a doubly linked list\n- c. std::deque - a double ended container that allows\
    \ insertion and deletion at both ends\n\n# 38.2 The Range-Based for Loop\n\nNow\
    \ is an excellent time to introduce the range-based loop, which allows us to iterate\
    \ over the container/range content. The range-based loop is of the following syntax:\n\
    \n```cpp\nfor (some_type element_name : container_name)\n{\n```\n\nWe read it\
    \ as: for each element_name of some_type inside the container_name (do something\
    \ inside the code block {}). To iterate over the elements of a vector, we can\
    \ use:\n\n```cpp\n#include <iostream>\n#include <vector>\n\nint main()\n{\n  \
    \  std::vector<int> v = { 1, 2, 3, 4, 5 };\n    v.push_back(10);\n    for (int\
    \ el : v)\n    {\n        std::cout << el << '\\n';\n    }\n}\n```\n"
