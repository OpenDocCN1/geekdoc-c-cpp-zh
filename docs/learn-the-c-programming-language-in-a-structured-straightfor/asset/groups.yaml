- md: "\n## 16.1.4 switch Statement\n\nThe switch statement is similar to having multiple\
    \ if-statements. It checks the value of the condition (which must be integral\
    \ or enum value) and, based on that value, executes the code inside one of a given\
    \ set of case labels. If none of the case statements is equal to the condition,\
    \ the code inside the default label is executed. General syntax:\n\n```\nswitch\
    \ (condition)\n{\n    case value1:\n        statement(s);\n        break;\n  \
    \  case value2etc:\n        statement(s);\n        break;\n    default:\n    \
    \    statement(s);\n        break;\n}\n```\n\nA simple example that checks for\
    \ the value of integer x and executes the appropriate case label:\n\n```\n#include\
    \ <iostream>\n\nint main()\n{\n    int x = 3;\n    switch (x)\n    {\n       \
    \ case 1:\n            std::cout << \"The value of x is 1.\";\n            break;\n\
    \        case 2:\n            std::cout << \"The value of x is 2.\";\n       \
    \     break;\ncase 3:\n\n```cpp\nstd::cout << \"The value of x is 3.\"; // this\
    \ statement will be\n// executed\nbreak;\n```\n\n```cpp\ndefault:\nstd::cout <<\
    \ \"The value is none of the above.\";\nbreak;\n}\n}\n```\n\nThe break statement\
    \ exits the switch statement. If there were no break statements, the code would\
    \ fall-through to the next case statement and execute the code there regardless\
    \ of the x value. We need to put breaks in all the case: and default: switches.\n\
    \n## 16.2 Iteration Statements\n\nIf we need some code to execute multiple times,\
    \ we use the iteration statements. Iteration statements are statements that execute\
    \ some code in a loop. The code in the loop executes 0, 1, or multiple times,\
    \ depending on the statement and the condition.\n\n## 16.2.1 for Statement\n\n\
    The for-statement executes code in a loop. The execution depends on the condition.\
    \ General syntax of the for-statement is: `for (init_statement; condition; iteration_expression)\
    \ { // execute some code }`. A simple example:\n\n```cpp\n#include <iostream>\n\
    int main()\n{\n    for (int i = 0; i < 10; i++)\n    {\n        std::cout << \"\
    The counter is: \" << i << '\\n';\n    }\n}\n```\n\nThis example executes the\
    \ code inside the loop for ten times. The init_statement is `int i = 0;`. We initialize\
    \ the counter to 0. The condition is: `i < 10;` and the iteration_expression is\
    \ `i++;`.\n\nA simple explanation:\n\nInitialize a counter to 0, check if the\
    \ counter is less than 10, execute the `std::cout << \"The counter is: \" << i\
    \ << '\\n';` statement inside the code-block and increment the counter i by 1.\
    \ So, the code inside the code block will continue executing as long as the `i\
    \ < 10` is true. Once the counter becomes 10, the condition is no longer true,\
    \ and the for-loop terminates.\n\nIf we wanted to execute 20 times, we would set\
    \ a different condition:\n\n```cpp\n#include <iostream>\nint main() {\n    for\
    \ (int i = 0; i < 20; i++) {\n        std::cout << \"The counter is: \" << i <<\
    \ '\\n';\n    }\n}\n```\n\n## 16.2.2 While Statement\n\nThe while-statement executes\
    \ code until the condition becomes false. The syntax for the while-loop is:\n\n\
    ```\nwhile (condition) { // execute some code }\n```\n\nAs long as the condition\
    \ is true, the while-loop will continue executing the code. When the condition\
    \ becomes false, the while-loop terminates. Example:\n\n```cpp\n#include <iostream>\n\
    \nint main() {\n    int x = 0;\n    while (x < 10)\n    {\n      std::cout <<\
    \ \"The value of x is: \" << x << \"\\n\";\n      x++;\n    }\n}\n```\n\nThe code\
    \ in this example executes ten times. After each iteration, the condition `x <\
    \ 10` is evaluated, and as long as it is equal to true, the code block will keep\
    \ executing. Once the condition becomes false, the while loop terminates. In this\
    \ example, we increment the value of x in each iteration. And once it becomes\
    \ 10, the loop terminates.\n\n## 16.2.3 do Statement\n\nThe do-statement is similar\
    \ to while-statement, but the condition comes after the body. The code inside\
    \ the do-statement is guaranteed to execute at least once. The syntax is:\n`do\
    \ { // execute some code } while (condition);`\n\nIf we used the previous example,\
    \ the code would be:\n\n```cpp\n#include <iostream>\n\nint main()\n{\n  int x\
    \ = 0;\n  do {\n    std::cout << \"The value of x is: \" << x << \"\\n\";\n  \
    \  x++;\n  } while (x < 10);\n}\n```\n\nThe do-statement is rarely used and better\
    \ avoided.\nPlease note that there is also an iteration statement called the range-for\
    \ statement.\nWe will talk about it when we get to containers later on.\n\n##\
    \ CHAPTER 17: Constants\n\nWhen we want to have a read-only object or promise\
    \ not to change the value of some object in the current scope, we make it a constant.\
    \ C++ uses the `const` type qualifier to mark the object as a read-only. We say\
    \ that our object is now *immutable*. To define an integer constant with a value\
    \ of 5, for example, we would write:\n\n```cpp\nint main()\n{\n  const int n =\
    \ 5;\n}\n```\n\nWe can now use that constant in places such as an array size:\n\
    \n```cpp\nint main()\n{\n  const int n = 5;\n  int arr[n] = { 10, 20, 30, 40,\
    \ 50 };\n}\n```\n\nConstants are not modifiable, attempt to do so results in a\
