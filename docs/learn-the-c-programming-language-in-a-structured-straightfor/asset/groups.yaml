  mdcn: "\n\n## 16.1.4 switch 语句\n\nswitch 语句类似于包含多个 if 语句。它检查条件的值（必须是整型或枚举值），并根据该值执行给定一组\
    \ case 标签中其中一个内部的代码。如果没有哪一个 case 语句与条件相等，则执行 `default` 标签内部代码。通用语法如下：\n\n```\n\
    switch (condition)\n{\n    case value1:\n        statement(s);\n        break;\n\
    \    case value2etc:\n        statement(s);\n        break;\n    default:\n  \
    \      statement(s);\n        break;\n}\n```\n\n一个简单的示例，用于检查整数 x 的值并执行相应的 case\
    \ 标签：\n\n```cpp\n#include <iostream>\n\nint main()\n{\n    int x = 3;\n    switch\
    \ (x)\n    {\n        case 1:\n            std::cout << \"The value of x is 1.\"\
    ;\n            break;\n        case 2:\n            std::cout << \"The value of\
    \ x is 2.\";\n            break;\ncase 3:\n\n```cpp\nstd::cout << \"The value\
    \ of x is 3.\"; // this statement will be\n// executed\nbreak;\n```\n\n```cpp\n\
    default:\nstd::cout << \"The value is none of the above.\";\nbreak;\n}\n}\n```\n\
    \n`break` 语句会退出 switch 语句。如果没有 `break` 语句，代码将“穿透”到下一个 case 语句，无论 x 的值如何都会执行那里的代码。我们需要在所有的\
    \ `case:` 和 `default:` switch 中放入 `break`。\n\n## 16.2 迭代语句\n\n如果我们需要某些代码执行多次，我们就使用迭代语句。迭代语句是在循环中执行某些代码的语句。循环中的代码根据语句和条件执行\
    \ 0 次、1 次或或次。\n\n## 16.2.1 for 语句\n\n`for` 语句在循环中执行代码。其执行取决于条件。`for` 语句的通用语法为：`for\
    \ (init_statement; condition; iteration_expression) { // execute some code }`。一个简单的示例：\n\
    \n```cpp\n#include <iostream>\nint main()\n{\n    for (int i = 0; i < 10; i++)\n\
    \    {\n        std::cout << \"The counter is: \" << i << '\\n';\n    }\n}\n```\n\
    \n此示例执行了十次循环内部的代码。`init_statement` 是 `int i = 0;`。我们将计数器初始化为 0。条件是 `i < 10;`，`iteration_expression`\
    \ 是 `i++;`。\n\n简单解释如下：\n\n初始化计数器为 0，检查计数器是否小于 10，执行代码块中的 `std::cout << \"The counter\
    \ is: \" << i << '\\n';` 语句并将计数器 i 增 1。因此，只要 `i < 10` 为真，代码块中的代码就会继续执行。一旦计数器变为\
    \ 10，条件不再为真，`for` 循环终止。\n\n如果我们想执行 20 次，就会设置一个不同的条件：\n\n```cpp\n#include <iostream>\n\
    int main() {\n    for (int i = 0; i < 20; i++) {\n        std::cout << \"The counter\
    \ is: \" << i << '\\n';\n    }\n}\n```\n\n## 16.2.2 While 语句\n\n`while` 语句执行代码，直到条件变为假。`while`\
    \ 循环的语法为：\n\n```\nwhile (condition) { // execute some code }\n```\n\n只要条件为真，`while`\
    \ 循环就会继续执行代码。当条件变为假时，`while` 循环终止。示例：\n\n```cpp\n#include <iostream>\n\nint main()\
    \ {\n    int x = 0;\n    while (x < 10)\n    {\n      std::cout << \"The value\
    \ of x is: \" << x << \"\\n\";\n      x++;\n    }\n}\n```\n\n此示例中的代码执行了十次。在每次迭代之后，都会评估条件\
    \ `x < 10`，只要它为真，代码块就会继续执行。一旦条件变为假，while 循环就会终止。在这个示例中，我们在每次迭代中增加 x 的值。一旦它变为 10，循环就会终止。\n\
    \n## 16.2.3 do 语句\n\n`do` 语句类似于 `while` 语句，但条件出现在正体之后。`do` 语句内部的代码保证至少执行一次。其语法为：\n\
    `do { // execute some code } while (condition);`\n\n如果我们使用之前的示例，代码将是：\n\n```cpp\n\
    #include <iostream>\n\nint main()\n{\n  int x = 0;\n  do {\n    std::cout << \"\
    The value of x is: \" << x << \"\\n\";\n    x++;\n  } while (x < 10);\n}\n```\n\
    \n`do` 语句很少被使用，最好避免。\n请注意，还有一种名为范围 for 语句（range-for）的迭代语句。\n我们稍后在介绍容器时会讨论它。\n\n\
    ## 第 17 章：常量\n\n当我们想要拥有一个只读对象，或者承诺不更改当前作用域内某些对象的值时，将其设为常量。C++ 使用 `const` 类型限定符将对象标记为只读。我们说我们的对象现在是*不可变的*。例如，要定义一个值为\
    \ 5 的整数常量，我们会写成：\n\n```cpp\nint main()\n{\n  const int n = 5;\n}\n```\n\n我们现在可以在这样的地方使用该常量，数组大小：\n\
    \n```cpp\nint main()\n{\n  const int n = 5;\n  int arr[n] = { 10, 20, 30, 40,\
    \ 50 };\n}\n```\n\n常量是不可修改的，尝试这样做会导致编译错误：\n\n```cpp\nint main()\n{\n  const int\
    \ n = 5;\n  n++; // error, modify read-only object\n}\n```\n\n声明为 `const` 的不能赋值；它需要初始化。所以我们不能：\n\
    \n```cpp\nint main()\n{\n    const int n;\n}\n```\n\n*(注：原文中存在大量由于 OCR 错误导致的重复文本，已根据要求进行清理并保留核心逻辑)*\n\
