    # CHAPTER 1


    # # Introduction


    Dear Reader,


    Congratulations on choosing to learn the C++ programming language, and thank you
    for picking up this book. My name is Slobodan Dmitrović, I am a software developer
    and a technical writer, and I will try to introduce you to a beautiful world of
    C++ to the best of my abilities.


    This book is an effort to introduce the reader to a C++ programming language in
    a structured, straightforward, and friendly manner. We will use the “just enough
    theory and plenty of examples” approach whenever possible.


    To me, C++ is a wonderful product of the human intellect. Over the years, I have
    certainly come to think of it as a thing of beauty and elegance. C++ is a language
    like no other, surprising in its complexity, yet wonderfully sleek and elegant
    in so many ways. It is also a language that cannot be learned by guessing, one
    that is easy to get wrong and challenging to get right.


    In this book, we will get familiar with the language basics first. Then, we will
    move onto standard-library. Once we got these covered, we will describe the modern
    C++ standards in more detail.


    After each section, there are source code exercises to help us adopt the learned
    material more efficiently. Let us get started!'
- md: "\n## CHAPTER 2\n\n## What is C++?\n\nC++ is a programming language. A standardized,\
    \ general-purpose, object-oriented, compiled language. C++ is accompanied by a\
    \ set of functions and containers called the C++ Standard-Library. Bjarne Stroustrup\
    \ created C++ as an extension to a C programming language. Still, C++ evolved\
    \ to be a completely different programming language.\n\nLet us emphasize this:\
    \ C and C++ are two different languages. C++ started as \"C with classes; but\
    \ it is now a completely different language. C++ is not C; C++ is not C with classes;\
    \ and there is no such thing as a C/C++ programming language.\n\nC++ is widely\
    \ used for the so-called systems programming as well as application programming.\
    \ C++ is a language that allows us to get down to the metal where we can perform\
    \ low-level routines if needed, or soar high with abstraction mechanisms such\
    \ as templates and classes.\n\n## 2.1 C++ Standards\n\nC++ is governed by the\
    \ ISO C++ standard. There are multiple ISO C++ standards listed here in chronological\
    \ order: C++03, C++11, C++14, C++17, and the upcoming C++20 standard.\n\nEvery\
    \ C++ standard starting with the C++11 onwards is referred to as \"Modern C++.\"\
    \ And Modern C++ is what we will be teaching in this book.\n\n## CHAPTER 3\n\n\
    ## C++ Compilers\n\nC++ programs are usually a collection of C++ code spread across\
    \ one or multiple source files. The C++ compiler compiles these files and turns\
    \ them into object files. Object files are linked together by a linker to create\
    \ an executable file or a library. At the time of the writing, some of the more\
    \ popular C++ compilers are:\n\n- The g++ frontend (as part of the GCC)\n- Visual\
    \ C++ (as part of the Visual Studio IDE)\n- Clang (as part of the LLVM)\n\n###\
    \ 3.1 Installing C++ Compilers\n\nThe following sections explain how to install\
    \ C++ compilers on Linux and Windows and how to compile and run our C++ programs.\n\
    \n### 3.1.1 On Linux\n\nTo install a C++ compiler on Linux, type the following\
    \ inside the terminal:\n\n```\nsudo apt-get install build-essential\n```\n\nTo\
    \ compile the C++ source file source.cpp, we type:\n\n```\ng++ source.cpp\n```\n\
    \nThis command will produce an executable with the default name of a.out. To run\
    \ the executable file, type:\n\n```\n./a.out\n```\n\n## CHAPTER 3 C++ COMPILERS\n\
    \nTo compile for a C++11 standard, we add the -std=c++11 flag:\n\n```\ng++ -std=c++11\
    \ source.cpp\n```\n\nTo enable warnings, we add the -Wall flag:\n\n```\ng++ -std=c++11\
    \ -Wall source.cpp\n```\n\nTo produce a custom executable name, we add the -o\
    \ flag followed by an executable name:\n\n```\ng++ -std=c++11 -Wall source.cpp\
    \ -o myexe\n```\n\nThe same rules apply to the Clang compiler. Substitute g++\
    \ with clang++.\n\n### 3.1.2 On Windows\n\nOn Windows, we can install a free copy\
    \ of Visual Studio.\n\nChoose Create a new project, make sure the C++ language\
    \ option is selected, and choose - Empty Project - click Next and click Create.\
    \ Go to the Solution Explorer panel, right-click on the project name, choose Add\
    \ - New Item - C++ File (.cpp), type the name of a file (source.cpp), and click\
    \ Add. Press F5 to run the program.\n\nWe can also do the following: choose Create\
    \ a new project, make sure the C++ language option is selected, and choose - Console\
    \ App - click Next and click Create.\n\nIf a Create a new project button is not\
    \ visible, choose File - New - Project and repeat the remaining steps.\n\n## CHAPTER\
    \ 4\n\n## Our First Program\n\nLet us create a blank text file using the text\
    \ editor or C++ IDE of our choice and name it source.cpp. First, let us create\
    \ an empty C++ program that does nothing. The content of the source.cpp file is:\n\
    \n```\nint main() {\n```\n\nThe function main is the main program entry point,\
    \ the start of our program. When we run our executable, the code inside the main\
    \ function body gets executed. A function is of type int (and returns a result\
    \ to the system, but let us not worry about that just yet). The reserved name\
    \ main is a function name. It is followed by a list of parameters inside the parentheses\
    \ () followed by a function body marked with braces {}. Braces marking the beginning\
    \ and the end of a function body can also be on separate lines:\n\n```\nint main()\n\
    {}\n```\n\nThis simple program does nothing, it has no parameters listed inside\
    \ parentheses, and there are no statements inside the function body. It is essential\
    \ to understand that this is the main program signature.\n\nThere is also another\
    \ main function signature accepting two different parameters used for manipulating\
    \ the command line arguments. For now, we will only use the first form.\n\n##\
    \ CHAPTER 4 OUR FIRST PROGRAM\n\n## 4.1 Comments\n\nSingle line comments in C++\
    \ start with double slashes // and the compiler ignores them. We use them to comment\
    \ or document the code or use them as notes:\n\n```\nint main()\n{\n    // this\
    \ is a comment\n}\n```\n\nWe can have multiple single-line comments:\n\n```\n\
    int main()\n{\n    // this is a comment\n    // this is another comment\n}\n```\n\
    \nMulti-line comments start with the /* and end with the */. They are also known\
    \ as C-style comments. Example:\n\n```\nint main()\n{\n    /* This is a\n    \
    \   multi-line comment **/\n}\n```\n\n### 4.2 Hello World Example\n\nNow we are\
    \ ready to get the first glimpse at our “Hello World” example. The following program\
    \ is the simplest “Hello World” example. It prints out Hello World. in the console\
    \ window:\n\n```\n#include <iostream>\nint main()\n{\n    std::cout << \"Hello\
    \ World.\";\n}\n```\n\n## CHAPTER 4 OUR FIRST PROGRAM\n\nBelieve it or not, the\
    \ detailed analysis and explanation of this example is 15 pages long. We can go\
    \ into it right now, but we will no be wiser at this point as we first need to\
    \ know what headers, streams, objects, operators, and string literals are. Do\
    \ not worry. We will get there.\n\nA brief(ish) explanation\n\nThe #include <iostream>\
    \ statement includes the iostream header into our source file via the #include\
    \ directive. The iostream header is part of the standard library. We need its\
    \ inclusion to use the std::cout object, also known as a standard-output stream.\
    \ The << operator inserts our Hello World literal into that output stream. String\
    \ literal is enclosed in double quotes \"\". The ; marks the end of the statement.\
    \ Statements are pieces of the C++program that executed. Statements end with semicolon\
    \ ; in C++. The std is the standard-library namespace and :: is the scope resolution\
    \ operator. Object cout is inside the std namespace, and to access it, we need\
    \ to prepend the call with the std::. We will get more familiar with all of these\
    \ later in the book, especially the std:: part.\n\nA brief explanation\n\nIn a\
    \ nutshell, the std::cout << is the natural way of outputting data to the standard\
    \ output/console window in C++.\n\nWe can output string literals by separating\
    \ them with multiple << operators:\n\n```\n#include <iostream>\n```\n\n```\nint\
    \ main()\n{\n    std::cout << \"Some string.\" << \"Another string.\";\n}\n```\n\
    \nTo output on a new line, we need to output a new-line character \\n literal.\
    \ The characters are enclosed in single quotes '\\n'.\n\nExample:\n\n```\n#include\
    \ <iostream>\n```\n\n```\nint main()\n{\n    std::cout << \"First line\" << '\\\
    n' << \"Second line.\";\n}\n```\n\n\\\\ represents an escape sequence, a mechanism\
    \ to output certain special characters as new-line character '\\n', single quote\
    \ character '\\'' or a double quote character '\\\"'.\n\nCharacters can also be\
    \ part of the string literal:\n\n```\n#include <iostream>\n\nint main()\n{\n \
    \   std::cout << \"First line\\nSecond line.\";\n}\n```\n\nDo not use using namespace\
    \ std;\nMany examples on the web would introduce the entire std namespace into\
    \ the current scope via the using namespace std; statement only to be able to\
    \ type cout instead of the std::cout. While this might save us from typing five\
    \ additional characters, it is wrong for many reasons. We do not want to introduce\
    \ the entire std namespace into the current scope because we want to avoid clashes\
    \ and ambiguity. Good to remember: do not introduce the entire std namespace via\
    \ the current namespace std; statement. So, instead of this wrong approach:\n\n\
    ```\n#include <iostream>\n\nusing namespace std; // do not use this\n\nint main()\n\
    {\n    cout << \"A bad example.\";\n}\n```\n\nuse the following:\n\n```\n#include\
    \ <iostream>\n\nint main()\n{\n    std::cout << \"A good example.\";\n}\n```\n\
    \nFor calls to objects and functions that reside inside the std namespace, add\
    \ the std:: prefix where needed.\n"
  mdcn: "\n\n## 第2章\n\n## 什么是 C++？\n\nC++ 是一种编程语言。一种标准化的、通用的、面向对象的编译型语言。C++ 伴随着一套被称为\
    \ C++ 标准库的函数和容器。Bjarne Stroustrup（比雅尼·斯特拉斯鲁普）为了扩展 C 语言而创建了 C++。但 C++ 演变成了一种完全不同的编程语言。\n\
    \n让我们强调这一点：C 和 C++ 是两种不同的语言。C++ 起于“带有类的 C”，但它现在已是一个完全不同的语言。C++ 不是 C；C++ 不是带有类的\
    \ C；而且不存在所谓的 C/C++ 编程语言。\n\nC++ 广泛用于所谓的系统编程以及应用程序编程。C++ 是一种允许我们深入底层硬件语言，在需要时执行低级例程，或者通过模板和类等抽象机制实现高层操作。\n\
    \n## 2.1 C++ 标准\n\nC++ 受 ISO C++ 标准的约束。这里列出了按时间顺序的多个 ISO C++ 标准：C++03、C++11、C++14、C++17\
    \ 以及即将到来的 C++20 标准。\n\n从 C++11 开始的每一个 C++ 标准都被称为“现代 C++”。而现代 C++ 正是我们书中将教授的内容。\n\
    \n## 第3章\n\n## C++ 编译器\n\nC++ 程序通常是分散在一个或多个源文件中的 C++ 代码的集合。C++ 编译器编译这些文件并将它们转换为对象文件。对象文件通过链接器链接在一起，以创建可执行文件或库。在编写期间，一些流行的\
    \ C++ 编译器包括：\n\n- g++ 前端（GCC 的一部分）\n- Visual C++（Visual Studio IDE 的一部分）\n- Clang（LLVM\
    \ 的一部分）\n\n### 3.1 安装 C++ 编译器\n\n接下来的章节将解释如何在 Linux 和 Windows 上安装 C C++ 编译器，以及如何编译和运行我们的\
    \ C++ 程序。\n\n### 3.1.1 在 Linux 上\n\n要在 Linux 上安装 C++ 编译器，请在终端中输入以下命令：\n\n```\n\
    sudo apt-get install build-essential\n```\n\n要编译 C++ 源文件 source.cpp，我们输入：\n\n\
    ```\ng++ source.cpp\n```\n\n此命令将生成一个默认名为 a.out 的可执行文件。要运行该可执行文件，输入：\n\n```\n./a.out\n\
    ```\n\n## 第3章 C++ 编译器\n\n要为 C++11 标准编译，我们添加 -std=c++11 标志：\n\n```\ng++ -std=c++11\
    \ source.cpp\n```\n\n要启用警告，我们添加 -Wall 标志：\n\n```\ng++ -std=c++11 -Wall source.cpp\n\
    ```\n\n要生成自定义的可执行文件名称，我们添加 -o 标志后跟可执行文件名：\n\n```\ng++ -std=c++11 -Wall source.cpp\
    \ -o myexe\n```\n\n相同的规则也适用于 Clang 编译器。将 g++ 替换为 clang++。\n\n### 3.1.2 在 Windows\
    \ 上\n\n在 Windows 上，我们可以安装免费版的 Visual Studio。\n\n选择“Create a new project”（创建新项目），确保选择了\
    \ C++ 语言选项，并选择“Empty Project”（空项目），点击“Next”（下一步）并点击“Create”（创建）。进入“Solution Explorer”（解决方案）面板，右键点击项目名称，选择“Add”（添加）—“New\
    \ Item”（新建项）—“C++ File (.cpp)”，输入文件名（source.cpp），并点击“Add”（添加）。按 F5 运行程序。\n\n我们也可以采取操作：选择“Create\
    \ a new project”，确保选择了 C++ 语言选项，并选择“Console App”（控制台应用），点击“Next”并点击“Create”。\n\
    \n如果看不到“Create a new project”按钮，请选择“File”—“New”—“Project”并重复剩余步骤。\n\n## 第4章\n\n\
    ## 我们的第一个程序\n\n让我们使用选择的文本编辑器或 C++ IDE 创建一个空白文本文件，并将其命名为 source.cpp。首先，让我们创建一个什么都不做的空\
    \ C++ 程序。source.cpp 文件的内容如下：\n\n```\nint main() {\n```\n\nmain 函数是主程序的入口点，是我们程序的起始点。当我们运行可执行文件时，main\
    \ 函数体内的代码会被执行。该函数类型为 int（并向系统返回结果，但让我们先不要担心那个）。保留名称 main 是一个函数名。它后面跟着圆括号 `()`\
    \ 内的参数列表，然后是用花括号 `{}` 标记的函数体。标记函数体开始和结束的花括号也可以分行写：\n\n```\nint main()\n{}\n```\n\
    \n这个简单的程序什么都不做，圆括号内没有列出参数，函数体内部也没有语句。理解这是主程序的签名至关重要。\n\n还有另一种 main 函数签名，它接受两个不同的参数，用于操纵命令行参数。目前，我们只使用第一种形式。\n\
    \n## 第4章 我们的第一个程序\n\n## 4.1 注释\n\nC++ 中的单行注释以双斜杠 `//` 开头，编译器会忽略它们。我们用它们来注释或记录代码，或者将其作为笔记：\n\
    \n```\nint main()\n{\n    // 这是一个注释\n}\n```\n\n我们可以有多个单行注释：\n\n```\nint main()\n\
    {\n    // 这是一个注释\n    // 这是另一个注释\n}\n```\n\n多行注释以 `/*` 开头，以 `*/` 结束。它们也被称为 C 风格注释。例如：\n\
    \n```int\nint main()\n{\n    /* 这是一个\n       多行注释 **/\n}\n```\n\n### 4.2 Hello\
    \ World 示例\n\n现在我们准备好了一个 Hello World 示例。在 C++ 中，输出到控制的最简单方法如下：\n\n```cpp\n#include\
    \ <iostream>\nint main()\n{\n    std::cout << \"Hello World.\";\n}\n```\n\n##\
    \ 第4章 我们的第一个程序\n\n信不信由，关于这个示例的详细分析有 15 页长。\n\n### 简要解释\n\n总而言之，`std::cout <<`\
    \ 是数据输出到标准输出的自然方式。\n\n我们可以通过多个 `<<` 运算符输出字符串字量：\n\n```cpp\n#include <iostream>\n\
    \nint main()\n{\n    std::cout << \"一些字符串.\" << \"另一个字符串.\";\n}\n```\n\n要输出新行，我们需要输出换行符\
    \ `\\n`。这些字符被包含在单引号 `'\\n'` 中。例如：\n\n```cpp\n#include <iostream>\n\nint main()\n\
    {\n    std::cout << \"第一行\" << '\\n' << \"第二行.\";\n}\n```\n\n`\\\\ 代表转义序列，一种输出某些特殊字符的机制，如换行符\
    \ `\\n`、单引号 `\\'` 或双引号 `\\\"`。\n\n字符也可以是字符串字量的一部分：\n\n```cpp\n#include <iostream>\n\
    \nint main()\n{\n    std::cout << \"第一行\\n第二行.\";\n}\n```\n\n### 不要使用 `using namespace\
    \ std;`\n\n网络上的许多示例通过 `using namespace std;` 语句将整个 std 命名空间引入当前作用域，以便输入 `cout`\
    \ 而不是 `std::cout`。虽然这可能为我们节省五个额外的字符，但从很多角度来说都是错误的。我们不希望将整个 std 命名空间引入当前作用域，因为我们想避免冲突和歧义。要记住：不要通过\
    \ `using namespace std;` 语句引入整个 std 命名空间。因此，与其使用这种错误的方法：\n\n```cpp\n#include <iostream>\n\
    \nusing namespace std; // 不要使用这个\n\nint main()\n{\n    cout << \"一个错误的示例.\";\n\
    }\n```\n\n不如使用以下方法：\n\n```cpp\n#include <iostream>\n\nint main()\n{\n    std::cout\
    \ << \"一个正确的示例.\";\n}\n```\n\n对于位于 std 命名空间内的对象和函数的调用，在需要的地方添加 `std::` 前缀。\n\n"
