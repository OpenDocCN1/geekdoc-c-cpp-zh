  - "[PAGE 146]\n\n# CHAPTER 27\n\n# The static Specifier\n\nThe static specifier\
    \ says the object will have a static storage duration. The memory space for static\
    \ objects is allocated when the program starts and deallocated when the program\
    \ ends. Only one instance of a static object exists in the program. If a local\
    \ variable is marked as static, the space for it is allocated the first time the\
    \ program control encounters its definition and deallocated when the program exits.\n\
    \nTo define a local static variable inside a function we use:\n\n```\n#include\
    \ <iostream>\n\nvoid myFunction()\n{\n    static int x = 0; // defined only the\
    \ first time, skipped every other\n    // time\n    x++;\n    std::cout << x <<\
    \ '\\n';\n}\n\nint main()\n{\n    myFunction(); // x == 1\n    myFunction(); //\
    \ x == 2\n    myFunction(); // x == 3\n}\n```\n\nThis variable is initialized\
    \ the first time the program encounters this function. The value of this variable\
    \ is preserved across function calls. What does this mean? The last changes we\
    \ made to it stays. It will not get initialized to 0 for every function call,\
    \ only the first time.\n\nThis is convenient as we do not have to store the value\
    \ inside some global variable x."
