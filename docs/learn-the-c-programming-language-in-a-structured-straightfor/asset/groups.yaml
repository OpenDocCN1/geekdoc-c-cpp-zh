    \ of x is: \" << x << \", the value of y is: \" << y;\n    // x 现在是 456\n    //\
    \ y 仍然是 123\n}\n```\n\n一旦我们声明了变量，我们只通过其名称来访问和操作该变量，而不需要类型名称。\n\n整数字面量可以是十进制、八进制和十六进制。八进制字面量以前缀\
    \ 0 开始，十六进制字面量以前缀 0x 开始。\n\n```cpp\nint main() {\n    int x = 10;      // 十进制字面量\n\
    \    int y = 012;     // 八进制字面量\n    int z = 0xA;     // 十六进制字面量\n}\n```\n\n我们可以写：`char\
    \ c = 'a';` 或者我们可以写 `char c = 97;`，这（可能）是相同的，因为 ASCII 表中的字符 'a' 用数字 97 表示。在大多数情况下，我们将使用字符字面量来表示\
    \ `char` 对象的值。\n\n### 5.1.4 浮点类型\n\n另一个基础类型是 `float`，称为浮点类型。我们用它来存储积分值（小数），包括负数和正数：\n\
    \n```cpp\n#include <iostream>\n\nint main() {\n    float x = 123.4;\n    float\
    \ y = -256.7;\n    std::cout << \"The value of x is: \" << x << \", the value\
    \ of y is: \" << y;\n}\n```\n\n在这里我们声明并初始化了两个 `float` 类型的变量。`float` 的大小通常是 4 字节。我们也可以用另一个变量来初始化变量。它将接收其值的拷贝。\n\
    \n浮点数字面量可以是十进制和科学计数法。\n\n```cpp\nint main() {\n    float x = 123.4;   // 十进制字面量\n\
    \    float y = 1.23e2;  // 科学计数法字面量 (123.0)\n}\n```\n\n浮点类型还有 `double` 和 `long\
    \ double`，它们分别提供了更高的精度。\n\n```cpp\n#include <iostream>\n\nint main() {\n    double\
    \ x = 123.45;\n    double y = -256.78;\n    std::cout << \"The value of x is:\
    \ \" << x << \", the value of y is: \" << y;\n}\n```\n\n浮点类型在内存中的大小通常是 4 字节。我们通过\
