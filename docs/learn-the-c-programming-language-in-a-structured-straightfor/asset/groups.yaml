    The compiler stitches the code from the header file and the source file together
    and produces what is called a translation unit. The compiler then uses this file
    to create an object file. A linker then links object files together to create
    a program.


    We should put the declarations and constants into header files and put definitions
    and executable code in source files.


    # 31.2 Header Guards


    Multiple source files might include the same header file. To ensure that our header
    is included only once in the compilation process, we use the mechanism called
    header guards. It ensures that our header content is included only once in the
    compilation process. We surround the code in our header file with the following
    macros:


    ```

    #ifndef MY_HEADER_H

    #define MY_HEADER_H


    // header file source code

    // goes here


    #endif

    ```


    This approach ensures the code inside a header file is included only once during
    the compilation phase.


    # 31.3 Namespaces


    So far, we have seen how to group parts of our C++ code into separate files called
    headers and source files. There is another way we can logically group parts of
    our C++, and that is through namespaces. A namespace is a scope with a name. To
    declare a namespace, we write:


    ```

    namespace MyNameSpace

    {

    }

    ```'
