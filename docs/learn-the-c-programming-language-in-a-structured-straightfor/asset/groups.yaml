    \ 赋值给该变量。检查变量是否大于 100 且小于 300。然后定义一个布尔变量，其值将是第一个变量的反。\n\n```cpp\n#include <iostream>\n\
    \nint main()\n{\n    int x = 256;\n    if (x > 100 && x < 300)\n    {\n      \
    \  std::cout << \"x is between 100 and 300\" << '\\n';\n    }\n    else\n    {\n\
    \        std::cout << \"x is not between 100 and 300\" << '\\n';\n    }\n    bool\
    \ mycondition = true;\n    bool mysecondcondition = !mycondition;\n}\n```\n\n\
    ### 18.3 switch 语句\n编写一个程序定义一个值为 3 的简单整数变量。使用 switch 语句检查该值是否在 [1..4] 范围内。\n\n\
    ```cpp\n#include <iostream>\n\nint main()\n{\n    int x = 3;\n    switch (x)\n\
    \    {\n        case 1:\n            std::cout << \"The value is equal to 1.\"\
    \ << '\\n';\n            break;\n        case 2:\n            std::cout << \"\
    The value is equal to 2.\" << '\\n';\n            break;\n        case 3:\n  \
    \          std::cout << \"The value is equal to 3.\" << '\\n';\n            break;\n\
    \        case 4:\n            std::cout << \"The value is equal to 4.\" << '\\\
