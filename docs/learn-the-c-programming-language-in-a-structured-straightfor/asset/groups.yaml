- md: "\n## CHAPTER 39 EXERCISES\n\n## 39.5 Basic Set\n\nWrite a program that defines\
    \ a set of integers. Print out the set content and observe the following: the\
    \ data is sorted, regardless of how we defined the set. This is because internally,\
    \ std::set is a sorted container that holds unique values.\n\n## 39.6 Set Data\
    \ Manipulation\n\nWrite a program that defines a set and inserts two new values\
    \ using the set's .insert() member function. Then, delete one arbitrary value\
    \ from a set using the set's .erase() member function. Print out the set content\
    \ afterward.\n\n```cpp\n#include <iostream>\n#include <set>\n\nint main()\n{\n\
    \    std::set<int> myset = {-10, 1, 3, 5, 6, 9, 15};\n    myset.insert(-5); //\
    \ inserts a value of -5\n    myset.insert(30); // inserts a value of 30\n\n  \
    \  myset.erase(6); // deletes a value of 6\n    for (auto el : myset)\n    {\n\
    \        std::cout << el << '\\n';\n    }\n}\n```\n\n## 39.7 Set Member Functions\n\
    \nWrite a program that defines a set of integers and utilizes the set's member\
    \ function to check the set's size, check whether it is empty and clear the set's\
    \ content.\n\n```cpp\n#include <iostream>\n#include <set>\n\nint main() {\n  \
    \  std::set<int> myset = {-10, 1, 3, 5, 6, 9, 15 };\n    std::cout << \"The set's\
    \ size is: \" << myset.size() << '\\n';\n    std::cout << \"Clearing the set...\"\
    \ << '\\n';\n    myset.clear(); // clear the set's content\n    if (myset.empty())\
    \ {\n        std::cout << \"The set is empty.\" << '\\n';\n    } else {\n    \
    \    std::cout << \"The set is not empty.\" << '\\n';\n    }\n}\n```\n\n## 39.8\
    \ Search for Data in a Set\n\nWrite a program that searches for a particular value\
    \ in a set using the set's .find member function. If the value is found, delete\
    \ it. Print out the set content.\n\n```cpp\n#include <iostream>\n#include <set>\n\
    \nint main() {\n    std::set<int> myset = {-10, 1, 3, 5, 6, 9, 15 };\n    int\
    \ findvalue = 5;\n    auto foundit = myset.find(findvalue);\n    if (foundit !=\
    \ myset.end())\n    {\n        std::cout << \"Value found. Deleting the value...\"\
    \ << '\\n';\n        myset.erase(foundit);\n        std::cout << \"Element deleted.\"\
    \ << '\\n';\n    }\n    else\n    {\n        std::cout << \"Value not found.\"\
    \ << '\\n';\n    }\n    for (auto el : myset)\n    {\n        std::cout << el\
    \ << '\\n';\n    }\n}\n```\n\n## 39.9 Basic Map\n\nWrite a program that defines\
    \ a map where keys are of type char and values are of type int. Print out the\
    \ map content.\n\n```cpp\n#include <iostream>\n#include <map>\n\nint main()\n\
    {\n    std::map<char, int> mymap = {{'a', 1}, {'b', 5}, {'e', 10}, {'f', 10}};\n\
    \    for (auto el : mymap)\n    {\n        std::cout << el.first << ' ' << el.second\
    \ << '\\n';\n    }\n}\n```\n\nExplanation. Map elements are key-value pairs. These\
    \ pairs are represented by std::pair class template which can store a pair. The\
    \ type of a map element is std::pair<char, int>. In a map container, keys are\
    \ unique, and values do not have to be unique. We initialize the map with our\
    \ key-value pairs inside the initializer list {}. Using a ranged-based for loop,\
    \ we iterate over map elements. To access the key in a pair, we use the pair's\
    \ .first member function, which represents the first element in a pair, or in\
    \ our case - the key. Similarly, we access the second element using the pair's\
    \ .second member function, which represents the map element value.\n\n## 39.10\
    \ Inserting Into Map\n\nWrite a program that defines a map of strings and integers.\
    \ Insert an element into a map using the map's insert() member function. Use the\
    \ map's operator [] to insert another key-value element into a map. Print the\
    \ map content afterward.\n\n```cpp\n#include <iostream>\n#include <map>\n#include\
    \ <string>\n\nint main()\n{\n    std::map<std::string, int> mymap = {{\"red\"\
    , 1}, {\"green\", 20}, {\"blue\", 15}};\n    mymap.insert({\"magenta\", 4});\n\
    \    mymap[\"yellow\"] = 5;\n\n    for (const auto &el : mymap)\n    {\n     \
    \   std::cout << el.first << ' ' << el.second << '\\n';\n    }\n}\n```\n\nWhen\
    \ using the map's [] operator, there are two scenarios. The key inside the []\
    \ operator exists in the map. This means we can use it to change the value of\
    \ an element. The key does not exist. In this case, using the map's operator [],\
    \ the key-value gets inserted into the map. This was the case with our mymap[\"\
    yellow\"] = 5; statement. Remember, maps are graphs, and the map's elements are\
    \ sorted based on a key. And since our keys are strings, the order would not necessarily\
    \ be the one we provided in the initializer list when printing out the elements:\n\
    \n```cpp\n#include <iostream>\n#include <map>\n#include <string>\n\nint main()\
    \ {\n    std::map<std::string, int> mymap = {{\"First\", 1}, {\"Second\", 2},\
    \ {\"Third\", 3}, {\"Fourth\", 4}};\n    for (const auto& el : mymap) {\n    \
    \    std::cout << el.first << ' ' << el.second << '\\n';\n    }\n}\n```\n\n##\
    \ 39.11 Searching and Deleting From a Map\n\nWrite a program that defines a map\
    \ of integers and strings. Search for a particular value by key using the map's\
    \ .find() member function. If the element is found, delete it. Print out the map\
    \ content.\n\n```cpp\n#include <iostream>\n#include <map>\n#include <string>\n\
    \nint main() {\n    std::map<int, std::string> mymap = {{1, \"First\"}, {2, \"\
    Second\"}, {3, \"Third\"}, {4, \"Fourth}};\n    int findkey = 2;\n    auto findit\
    \ = mymap.find(findkey);\n    if (foundit != mymap.end())\n    {\n        std::cout\
    \ << \"Key found. Deleting the element...\" << '\\n';\n        mymap.erase(findit);\n\
    \    }\n    else\n    {\n        std::cout << \"Key not found.\" << '\\n';\n \
    \   }\n    for (const auto& el : mymap)\n    {\n        std::cout << el.first\
    \ << ' ' << el.second << '\\n';\n    }\n}\n```\n\n## 39.12 Lambda Expressions\n\
    \nWrite a program that defines a vector of integers. Sort the vector in descending\
    \ order using the std::sort function, and a user-provided lambda as a predicate.\n\
    \n```cpp\n#include <iostream>\n#include <vector>\n#include <algorithm>\n\nint\
    \ main()\n{\n    std::vector<int> v = {5, 10, 4, 1, 3, 15};\n    std::sort(std::begin(v),\
    \ std::end(v), [](int x, int y) { return x > y; });\n    for (const auto& el :\
    \ v)\n    {\n        std::cout << el << '\\n';\n    }\n}\n```\n\nWrite a program\
    \ that defines a vector of integers. Use the std::count_if function and a user-provided\
    \ lambda function to count only even numbers.\n\n```cpp\n#include <iostream>\n\
    #include <vector>\n#include <algorithm>\n\nint main() {\n    std::vector<int>\
    \ v = {5, 10, 4, 1, 3, 8};\n    int mycount = std::count_if(std::begin(v), std::end(v),\
    \ [](int x) {\n        return x % 2 == 0;\n    });\n    std::cout << \"The number\
    \ of even numbers is: \" << mycount << '\\n';\n}\n```\n\nWrite a program that\
    \ defines a local lambda expression that can capture and modify the variable defined\
    \ inside the main() function:\n\n```cpp\n#include <iostream>\n\nint main() {\n\
    \    int x = 123;\n    std::cout << \"The value of a local variable is: \" <<\
    \ x << '\\n';\n    auto mylambda = [&x](){ x++; };\n    std::cout << \"Lambda\
    \ captured and changed the local variable to: \" << x << '\\n';\n}\n```\n\n##\
    \ CHAPTER 40\n\n## C++ Standards\n\nC++ is an ISO standardized programming language.\
    \ There are different C++ standards:\n\n- C++98\n- C++03\n- C++11\n- C++14\n-\
    \ C++17 - Modern C++\n- C++20\n\nEverything starting with C++11 is referred to\
    \ as “Modern C++.” These standards define the language in great technical detail.\
    \ They also serve as manuals for C++ compiler writers. It is a mind-boggling set\
    \ of rules and specifications. The C++ standards can be bought, or a draft version\
    \ can be downloaded for free. These drafts closely resemble the final C++ standard.\
    \ When C++ code can be successfully transferred and compiled on different platforms\
    \ (machines or compilers), and when C++ implementation closely follows the standard,\
    \ we say that the code is often referred to as portable C++.\n\nThe standards\
    \ surrounded by braces represent the so-called “Modern C++.” Each standard describes\
    \ the language and introduces new language and library features. We may also introduce\
    \ changes to the existing rules. We will describe notable features in each of\
    \ these standards.\n\n## 40.1 C++11\n\nC++11 is an ISO C++ standard, published\
    \ in 2011. To compile, add the `-std=c++11` flag when compiling with g++ or clang.\
    \ If using Visual Studio, choose Project / Options / Configuration Properties\
    \ / C/C++ / Language / C++ Language Standard and choose C++11. New Visual Studio\
    \ versions already support this standard out of the box. We have already described\
    \ the notable C++11 features in previous chapters, and here we will briefly go\
    \ through them once again and introduce a few new ones:\n"
