    \    std::cout << \"You entered: \" << x << \" and \" << y << \"\\n\";\n}\n```\n\
    \nWe can accept values of different types:\n\n```cpp\n#include <iostream>\n\n\
    int main()\n{\n    std::cout << \"Please enter a character, an integer and a double:\
    \ \";\n    char c = 0;\n    int x = 0;\n    double d = 0.0;\n    std::cin >> c\
    \ >> x >> d;\n    std::cout << \"You entered: \" << c << \", \" << x << \" and\
    \ \" << d;\n}\n```\n\n## CHAPTER 9\n\n# Exercises\n\n## 9.1 Standard Input\n\n\
    Write a program that accepts an integer number from the standard input and prints\
    \ that.\n\n```cpp\n#include <iostream>\nint main()\n{\n    std::cout << \"Please\
    \ enter a number: \";\n    int x;\n    std::cin >> x;\n    std::cout << \"You\
    \ entered: \" << x;\n}\n```\n\n## 9.2 Two Inputs\n\nWrite a program that accepts\
    \ two integer numbers from the standard input and prints them.\n\n```cpp\n#include\
    \ <iostream>\nint main()\n{\n    std::cout << \"Please enter two numbers: \";\n\
    \    int x;\n    int y;\n    std::cin >> x >> y;\n    std::cout << \"You entered:\
    \ \" << x << \" and \" << y;\n}\n```\n\n## 9.3 Multiple Inputs\n\nWrite a program\
    \ that accepts three values of type char, int, and double respectively from the\
    \ standard input. Print out the values.\n\n```cpp\n#include <iostream>\nint main()\n\
    {\n    std::cout << \"Please enter a character, an integer and a double: \";\n\
    \    char c;\n    int x;\n    double d;\n    std::cin >> c >> x >> d;\n    std::cout\
    \ << \"You entered: \" << c << \", \" << x << \" and \" << d;\n}\n```\n\n## 9.4\
    \ Inputs and Arithmetic Operations\n\nWrite a program that accepts two int numbers,\
    \ sums them up, and assigns a result to a third integer. Print out the result.\n\
    \n```cpp\n#include <iostream>\nint main()\n{\n    std::cout << \"Please enter\
    \ two numbers: \";\n    int x;\n    int y;\n    std::cin >> x >> y;\n    int z\
    \ = x + y;\n    std::cout << \"The result is: \" << z;\n}\n```\n\n## 9.5 Post-Increment\
    \ and Compound Assignment\n\nWrite a program that defines an int variable called\
    \ x with a value of 123, post-increments that value in the next statement, and\
    \ adds the value of 20 in the following statement using the compound assignment\
    \ operator. Print out the value afterward.\n\n```cpp\n#include <iostream>\nint\
    \ main()\n{\n    int x = 123;\n    x++;\n    x += 20;\n    std::cout << \"The\
    \ result is: \" << x;\n}\n```\n\n## 9.6 Integral and Floating-point Division\n\
    \nWrite a program that divides numbers 9 and 2 and assigns a result to an int\
