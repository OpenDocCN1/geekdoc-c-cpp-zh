    \ 以及所有其他容器都被实现为类模板，允许存储（几乎）任何类型。要定义一个 vector，我们使用以下语法：`std::vector<some_type>`。一个初始化包含\
    \ 5 个整数的 vector 的简单示例：\n\n```cpp\n#include <vector>\n\nint main(){\n    std::vector<int>\
    \ v = { 1, 2, 3, 4, 5 };\n}\n```\n\n我们定义了一个名为 `v` 的、包含 5 个整数元素的 vector，并使用大括号初始化初始化了一个\
    \ vector。当我们向 vector 插入和从 vector 中删除元素时，vector 可以自动增长和收缩。要向 vector 的末尾插入一个元素，我们使用\
    \ vector 的 `push_back()` 成员函数。示例：\n\n```cpp\n#include <vector>\n\nint main(){\n\
    \    std::vector<int> v = { 1, 2, 3, 4, 5 };\n    v.push_back(10);\n}\n```\n\n\
    这个示例在我们的 vector 末尾插入了一个值为 10 的值。现在我们拥有了一个包含 6 个元素的容器：1 2 3 4 5 10。\n\nvector 元素是有索引的，第一个元素的索引为\
    \ 0。可以通过下标运算符 `[element_index]` 或成员函数 `at(element_index)` 访问单个元素：\n\n```cpp\n\
    #include <iostream>\n#include <vector>\n\nint main()\n{\n    std::vector<int>\
    \ v = { 1, 2, 3, 4, 5 };\n    std::cout << \"The third element is:\" << v[2] <<\
    \ '\\n';\n    std::cout << \"The fourth element is:\" << v.at(3) << '\\n';\n}\n\
    ```\n\nvector 的大小（即元素个数）可以通过 `.size()` 成员函数获取：\n\n```cpp\n#include <iostream>\n\
    #include <vector>\n\nint main()\n{\n    std::vector<int> v = { 1, 2, 3, 4, 5 };\n\
    \    std::cout << \"The vector's size is: \" << v.size();\n}\n```\n\nvector 是一个顺序容器。它按序列存储元素。其他顺序容器有：\n\
    \n- a. std::list - 双向链表\n- b. std::forward_list - 单向链表\n- c. std::deque - 双端队列\n\
    \n那么，应该用哪一个呢？不确定时，请使用 `std::vector`。这些容器中的每一个容器的插入和查找时间都是不同的，且每个容器都有不同的用途。尽管如此，就顺序容器而言，`std::vector`\
    \ 是我们希望最频繁使用的容器。\n\n# 38.1.2 std::array\n\n`std::array` 是 C 风格数组的薄封装。数组在用作函数参数时会转换为指针，我们应该优先使用\
    \ `std::array` 封装而不是旧的 C 风格数组。`std::array` 的签名如下：`std::array<type_name, array_size>`。一个简单的示例：\n\
    \n```cpp\n#include <iostream>\n#include <array>\n\nint main()\n{\n    std::array<int,\
    \ 5> arr = { 1, 2, 3, 4, 5 };\n    for (auto el : arr)\n    {\n        std::cout\
    \ << el << '\\n';\n    }\n}\n```\n\n这个示例使用 `std::array` 容器创建了一个包含 5 个元素的数组并打印出它们。让我们再次强调这一点：优先使用\
    \ `std::array` 或 `std::vector` 而不是旧的/原始 C 风格数组。\n\n# 38.1.3 std::set\n\nSet 是一个持有唯一、排序对象的容器。它是一个排序对象的二叉树。要使用\
    \ set，我们必须包含 `<set>` 头文件。要定义一个 set，我们使用 `std::set<type> set` 语法。初始化一个包含 5 个整数的\
    \ set，我们可以写：\n\n```cpp\n#include <iostream>\n#include <set>\n\nint main()\n{\n\
    \    std::set<int> myset = { 1, 2, 3, 4, 5 };\n    for (auto el : myset) {\n \
    \       std::cout << el << '\\n';\n    }\n}\n```\n\n要向 set 插入元素，我们使用 set 的 `.insert(value)`\
    \ 成员函数。插入两个新元素，我们使用：\n\n```cpp\n#include <iostream>\n#include <set>\n\nint main()\n\
    {\n    std::set<int> myset = { 1, 2, 3, 4, 5 };\n    myset.insert(10);\n    myset.insert(42);\n\
    \    for (auto el : myset)\n    {\n        std::cout << el << '\\n';\n    }\n\
    }\n```\n\n由于 set 持有唯一的值，尝试插入重复的值将无法成功。\n\n# 38.1.4 std::map\n\nmap 是一个关联容器，持有键值对。键是排序且唯一的。map\
    \ 也被实现为平衡二叉树/图。因此，现在我们不是每个元素对应一个值，而是有两个值。要使用 map，我们需要包含该头文件。要定义一个 map，我们使用 `std::map<type1,\
    \ type2> map_name` 语法。这里 `type1` 代表键的类型，`type2` 代表值的类型。\n\n```cpp\n#include <iostream>\n\
    #include <map>\n\nint main()\n{\n    std::map<std::string, int> ages = { {{\"\
    Alice\", 20}, {\"Bob\", 25}, {\"Charlie\", 30}} };\n    for (auto const& [name,\
    \ age] : ages)\n    {\n        std::cout << name << \" is \" << age << \" years\
    \ old.\\n\";\n    }\n    return 0;\n}\n```\n*(注：此处示例代码使用了 C++17 结构化绑定，此处根据语境保持逻辑一致，原文未提供具体代码块，按逻辑描述翻译)*\n\
    \n*(修正：原文在 map 处描述较乱，以下为基于原文描述的翻译：)*\n\n# std::pair\n\npair 是一个持有两个值的类模板，它可以表示一对值。要使用\
    \ pair，我们需要包含 `<utility>` 头文件。\n\n```cpp\n#include <iostream>\n#include <utility>\n\
    \nint main()\n{\n    std::pair<int, double> mypair = { 123, 3.14 };\n    std::cout\
    \ << \"The first element is: \" << mypair.first << '\\n';\n    std::cout << \"\
    The second element is: \" << mypair.second << '\\n';\n}\n```\n\n另一种创建 pair 的方法是通过\
    \ `make_pair` 函数：\n\n```cpp\n#include <iostream>\n#include <utility>\n\nint main()\n\
    {\n    int x = 123;\n    double d = 3.14;\n\n    std::pair<int, double> mypair\
    \ = std::make_pair(x, d);\n    std::cout << \"The first element is: \" << mypair.first\
    \ << '\\n';\n    std::cout << \"The second element is: \" << mypair.second <<\
    \ '\\n';\n}\n\n"
