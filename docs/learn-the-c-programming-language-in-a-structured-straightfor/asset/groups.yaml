    \ argument you used is: \" << message;\n}\nint main()\n{\n    std::string mymessage\
    \ = \"My Custom Message.\";\n    custommessage(mymessage);\n}\n```\n\n## 20.5\
    \ 函数重载\n\n编写一个程序，包含两个函数重载。函数名为 `division`，且它们都接受两个参数。它们除这些参数并将结果返回给自己。第一个函数重载类型为\
    \ `int`，具有两个 `int` 类型的参数。第二个重载类型为 `double`，接受两个 `double` 类型的参数。在 `main` 中通过提供整数参数然后提供\
    \ double 参数来调用合适的重载。观察不同的结果。\n\n```cpp\n#include <iostream>\n#include <string>\n\
    \nint division(int x, int y)\n{\n    return x / y;\n}\n\ndouble division(double\
    \ x, double y)\n{\n    return x / y;\n}\nint main()\n{\n    std::cout << \"Integer\
    \ division: \" << division(9, 2) << '\\n';\n    std::cout << \"Floating point\
    \ division: \" << division(9.0, 2.0);\n}\n```\n\n## 第 21 章\n\n## 作用域与生命周期\n\n\
    当我们声明变量时，它的名称只在源代码的某些区域内有效。这被称为作用域。变量在内存中的某些代码区域内是可以访问的。有不同的作用域：\n\n### 21.1 局部作用域\n\
    \n我们在函数内部声明一个变量时，它的作用域仅在函数内部有效。这种作用域被称为局部作用域。示例：\n\n```cpp\nvoid myfunction()\n\
    {\n    int x = 123; // x 是局部变量\n}\n```\n\n当我们在函数内部声明 `x` 时，它的作用域仅在函数内部有效。我们说它的作用域是函数内部的。\n\
    \n### 21.2 块作用域\n\n块作用域是指从 `{` 开始到 `}` 结束的部分。示例：\n\n```cpp\nint main()\n{\n  \
    \  int x = 123; // x 的作用域开始\n    {\n        int y = 456; // y 的作用域开始\n    } //\
    \ y 的作用域结束\n} // x 的作用域结束\n```\n\n还有其他作用域，我们稍后会介绍。\n\n### 21.3 生命周期\n\n对象的生命周期是指对象在内存中所花费的时间。生命周期由存储周期决定。有不同的存储周期：\n\
    \n### 21.4 自动存储周期\n\n自动存储周期是指在块开始时自动分配内存并在块结束时释放内存的。这被称为栈内存。在这种情况下，对象的生命周期由作用域决定。\n\
    \n```cpp\nvoid myfunction()\n{\n    int x = 123; // x 在这里分配\n} // x 在这里释放\n```\n\
    \n### 21.5 动态存储周期\n\n动态存储周期是指手动分配和手动释放内存的。这种存储通常被称为堆内存。用户决定对象的内存何时分配以及何时释放。对象的生命周期不受其定义的作用域决定。我们通过\
    \ `new` 来实现。在现代 C++ 中，我们倾向于使用智能指针代替 `new`。\n\n### 21.6 静态存储周期\n\n当对象声明带有静态修饰时，意味着它的存储在程序启动时分配，在程序结束时释放。此类对象只有一个实例（少数例外除），它们的生命周期在程序结束时结束。它们是我们可以在程序执行期间任何时候访问的对象。我们稍后会讨论静态修饰符和静态初始化。\n\
    \n### 21.7 运算符 new 和 delete\n\n我们可以动态分配对象的存储并让指针指向这些新分配的内存。\n\n`new` 运算符为对象分配空间。对象分配在自由存储区（通常称为堆或堆内存）。分配的内存必须使用\
    \ `delete` 运算符释放。它释放之前用 `operator new` 分配的内存。示例：\n\n```cpp\n#include <iostream>\n\
    \nint main(){\n    int* p = new int;\n    *p = 123;\n    std::cout << \"The pointed-to-value\
    \ is: \" << *p;\n    delete p;\n}\n```\n\n"
