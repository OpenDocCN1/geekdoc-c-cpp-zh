- md: "\n# CHAPTER 40 C++ STANDARDS\n\nNow we have defined three integer variables.\
    \ These variables have array elements values of 1, 2, 3, respectively. These variables\
    \ are copies of array elements. Making changes to variables do not affect the\
    \ array elements themselves:\n\n```cpp\n#include <iostream>\n\nint main()\n{\n\
    \    int arr[] = { 1, 2, 3 };\n    auto [myvar1, myvar2, myvar3] = arr;\n    myvar1\
    \ = 10;\n    myvar2 = 20;\n    myvar3 = 30;\n    for (auto el : arr)\n    {\n\
    \        std::cout << el << ' ';\n    }\n}\n```\n\nWe can make structured bindings\
    \ of reference type by using the auto& syntax. This means the variables are now\
    \ references to array elements and making changes to variables also changes the\
    \ array elements:\n\n```cpp\n#include <iostream>\n\nint main()\n{\n    int arr[]\
    \ = { 1, 2, 3 };\n    auto& [myvar1, myvar2, myvar3] = arr;\n    myvar1 = 10;\n\
    \    myvar2 = 20;\n    myvar3 = 30;\n    for (auto el : arr)\n    {\n        std::cout\
    \ << el << ' ';\n    }\n}\n```\n\nIt is an excellent way of introducing and binding\
    \ multiple variables to some container-like expression elements.\n\n## 40.3.4\
    \ std::filesystem\n\nThe std::filesystem library allows us to work with files,\
    \ paths, and folders on our system. The library is declared through a <filesystem>\
    \ header. Paths can represent paths to files and paths to folders. To check if\
    \ a given folder exists, we use:\n\n```cpp\n#include <iostream>\n#include <filesystem>\n\
    \nint main()\n{\n    std::filesystem::path folderpath = \"C:\\\\MyFolder\\\\\"\
    ;\n    if (std::filesystem::exists(folderpath))\n    {\n        std::cout << \"\
    The path: \" << folderpath << \" exists.\";\n    }\n    else\n    {\n        std::cout\
    \ << \"The path: \" << folderpath << \" does not exist.\";\n    }\n}\n```\n\n\
    Similarly, we can use the std::filesystem::path object to check if a file exists:\n\
    \n```cpp\n#include <iostream>\n#include <filesystem>\n\nint main()\n{\n    std::filesystem::path\
    \ folderpath = \"C:\\\\MyFolder\\\\myfile.txt\";\n    if (std::filesystem::exists(folderpath))\n\
    \    {\n        std::cout << \"The file: \" << folderpath << \" exists.\";\n \
    \   }\n```\n\n```cpp\nelse\n{\n    std::cout << \"The file: \" << folderpath <<\
    \ \" does not exist.\";\n}\n```\n\nTo iterate over folder elements, we use the\
    \ std::filesystem::directory_iterator iterator:\n\n```cpp\n#include <iostream>\n\
    #include <filesystem>\n\nint main()\n{\n    auto folder = \"C:\\\\MyFolder\\\\\
    \";\n    for (auto el : std::filesystem::directory_iterator(folder))\n    {\n\
    \        std::cout << el.path() << '\\n';\n    }\n}\n```\n\nHere we iterate over\
    \ the directory entries and print each of the elements full path using the .path()\
    \ member function.\n\nFor Linux, we need to adjust the path and use the following\
    \ instead:\n\n```cpp\n#include <iostream>\n#include <filesystem>\n\nint main()\n\
    {\n    auto folder = \"MyFolder/\";\n```\n\nTo iterate over folder elements recursively,\
    \ we use the std::filesystem::recursive_directory_iterator. This allows us to\
    \ iterate recursively over all subfolders in a folder. On Windows, we would use:\n\
    \n```cpp\n#include <iostream>\n#include <filesystem>\n\nint main()\n{\n    auto\
    \ myfolder = \"C:\\\\MyFolder\\\\\";\n```\n\nOn Linux and similar OS-es, we would\
    \ use the following path:\n\n```cpp\n#include <iostream>\n#include <filesystem>\n\
    \nint main()\n{\n    auto myfolder = \"MyFolder/\";\n    for (auto el : std::filesystem::directory_iterator(myfolder))\n\
    \    {\n        std::cout << el.path() << '\\n';\n    }\n}\n```\n\nBelow are some\
    \ useful functions inside the std::filesystem namespace:\n\n- std::filesystem::create_directory\
    \ for creating directories\n- std::filesystem::copy for copying files and directories\n\
    - std::filesystem::remove for removing a file or an empty directory\n- std::filesystem::remove_all\
    \ for removing folders and subfolders\n\n## 40.3.5 std::string_view\n\nCopying\
    \ data can be an expensive operation in CPU. Passing substrings as function parameters\
    \ would require a copy. This is a costly operation. The string_view class is an\
    \ attempt to rectify that.\n\nThe string_view is a non-owning view of a string\
    \ or substring. It is a reference to something that is already there in the memory.\
    \ It is implemented as a pointer to some sequence plus the size of that sequence.\
    \ With this kind of structure, we can parse strings efficiently.\n\nThe string_view\
    \ is declared inside the <string_view> header. To create a string_view from an\
    \ existing string, we write:\n\n```cpp\n#include <iostream>\n#include <string>\n\
    #include <string_view>\n\nint main()\n{\n    std::string s = \"Hello World.\"\
    ;\n    std::string_view sw(s);\n    std::cout << sw;\n}\n```\n\nTo create a string_view\
    \ for a substring of the first characters, we use the different constructor. This\
    \ string_view constructor takes a pointer to the first element and the length\
    \ of the substring:\n\n```cpp\n#include <iostream>\n#include <string>\n#include\
