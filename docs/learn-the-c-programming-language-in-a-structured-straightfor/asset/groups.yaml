  - "[PAGE 45]\n\n# CHAPTER 12\n\n# # References\n\nAnother (somewhat) similar concept\
    \ is a reference type. A reference type is an alias to an existing object in memory.\
    \ References must be initialized. We describe a reference type as type_name followed\
    \ by an ampersand &. Example:\n\n```\nint main()\n{\n  int x = 123;\n  int& y\
    \ = x;\n}\n```\n\nNow we have two different names that refer to the same int object\
    \ in memory. If we assign a different value to either of them, they both change\
    \ as we have one object in memory, but we are using two different names:\n\n```\n\
    int main()\n{\n  int x = 123;\n  int& y = x;\n  x = 456;\n  // both x and y now\
    \ hold the value of 456\n  y = 789;\n  // both x and y now hold the value of 789\n\
    }\n```"
  - "[PAGE 46]\n\n# CHAPTER 12 REFERENCES\n\nAnother concept is a const-reference,\
    \ which is a read-only alias to some object.\nExample:\n\n```\nint main()\n{\n\
    \    int x = 123;\n    const int& y = x; // const reference\n    x = 456;\n  \
    \  // both x and y now hold the value of 456\n}\n```\n\nWe will discuss references\
    \ and const-reference in more detail when we learn functions and function parameters.\
    \ For now, let us assume they are an alias, a different name for an existing object.\n\
    \nIt is important not to confuse the use of * in a pointer type declaration such\
    \ as int* p; and the use of * when dereferencing a pointer such as *p = 456. Although\
    \ the same star character, it is used in two different contexts.\n\nIt is important\
    \ not to confuse the use of & in reference type declaration such as int& y = x;\
    \ and the use of ampersand as an address-of-operator int* p = &&x.s The same literal\
    \ symbol is used for two different things."
