    # About the Author


    ![](img/68f9f56ae1cb70e2aa8c79b739fce9fe_11_0.png)


    Emma Graham is a software development consultant and an author from Serbia. He
    specializes in C++ training, technical analysis, and software architecture. He
    is a highly visible member of the SE European C++ community and a StackOverflow
    contributor. Slobodan has gained international experience working as a software
    consultant in Denmark, Poland, Croatia, China, and the Philippines.


    # Acknowledgments


    I would like to thank my friends and fellow C++ peers who have supported me in
    writing this book.


    I owe my gratitude to outstanding professionals at Apress for their amazing work
    and support during the entire writing and production process.


    I am thankful to the StackOverflow and the entire C++ community for their help
    and feedback.


    My deepest appreciation goes to S. Antonijević, Jovo Arežina, and Saša Popović
    for their ongoing support.


    # CHAPTER 1


    # Introduction


    Dear Reader,


    Congratulations on choosing to learn the C++ programming language, and thank you
    for picking up this book. My name is Slobodan Dmitrović, I am a software developer
    and a technical writer, and I will try to introduce you to a beautiful world of
    C++ to the best of my abilities.


    This book is an effort to introduce the reader to a C++ programming language in
    a structured, straightforward, and friendly manner. We will use the “just enough
    theory and plenty of examples” approach whenever possible.


    To me, C++ is a wonderful product of the human intellect. Over the years, I have
    certainly come to think of it as a thing of beauty and elegance. C++ is a language
    like no other, surprising in its complexity, yet wonderfully sleek and elegant
    in so many ways. It is also a language that cannot be learned by guessing, one
    that is easy to get wrong and challenging to get right.


    In this book, we will get familiar with the language basics first. Then, we will
    move onto standard-library. Once we got these covered, we will describe the modern
    C++ standards in more detail.


    After each section, there are source code exercises to help us adopt the learned
    material more efficiently. Let us get started!

