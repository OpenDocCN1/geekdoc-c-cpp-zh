- md: "\n# CHAPTER 23 CLASSES - INTRODUCTION\n\nOur object o now has direct access\
    \ to all member fields as they are all marked public. Member fields always have\
    \ access to each other regardless of the access specifier. That is why the member\
    \ function print() can access the member field x and print or change its value.\n\
    \nPrivate access members are accessible only to other class members, not objects.\
    \ Example with full commentary:\n\n```cpp\n#include <iostream>\nclass MyClass\
    \ {\nprivate:\n    int x; // x now has private access\npublic:\n    void print()\
    \ {\n        std::cout << \"The value of x is:\" << x; // x is accessible to \n\
    \        // print()\n    }\n};\n```\n\n```cpp\nint main() {\n    MyClass o; //\
    \ Create an object\n    o.x = 123; // Error, x has private access and is not accessible\
    \ to\n    // object o\n    o.print(); // print() is accessible from object o\n\
    }\n```\n\nOur object o now has only access to a member function print() in the\
    \ public section of the class. It cannot access members in the private section\
    \ of the class.\n\nIf we want the class members to be accessible to our object,\
    \ then we put them inside the public area. If we want the class members not to\
    \ be accessible to our object, then we put them into the private area.\n\nWe want\
    \ the data members to have private access and function members to have public\
    \ access. This way, our object can access the member functions directly but not\
    \ the member fields. There is another access specifier called protected: which\
    \ we will talk about later.\n\n## 23.4 Constructors\n\nA constructor is a member\
    \ function that has the same name as the class. To initialize an object of a class,\
    \ we use constructors. Constructor's purpose is to initialize an object of a class\
    \ and set values to data members. If a class has a constructor, all objects of\
    \ that class will be initialized by it.\n\n### 23.4.1 Default Constructor\n\n\
    A constructor without parameters or with default parameters is called a default\
    \ constructor. It is a constructor which can be called without arguments:\n\n\
    ```cpp\n#include <iostream>\nclass MyClass {\npublic:\n    MyClass() {\n     \
    \   std::cout << \"Default constructor invoked.\" << '\\n';\n    }\n};\nint main()\
    \ {\n    MyClass o; // invoke a default constructor\n}\n```\n\nAnother example\
    \ of default constructor, the one with default arguments:\n\n```cpp\n#include\
    \ <iostream>\nclass MyClass {\npublic:\n    MyClass(int x = 0, int y = 0) {\n\
    \        std::cout << \"Default constructor invoked.\" << '\\n';\n    }\n};\n\
    int main() {\n    MyClass o; // invoke a default constructor\n}\n```\n\nIf a default\
    \ constructor is not explicitly defined in the code, the compiler will generate\
    \ a default constructor. When we define our own constructor that needs parameters,\
    \ the default constructor gets removed and is not generated by compiler. Constructors\
    \ are invoked when object initialization takes place. Constructors can have arbitrary\
    \ parameters; in which case we call them user-provided constructors.\n\n```cpp\n\
    #include <iostream>\nclass MyClass {\npublic:\n    int x, y;\n    MyClass(int\
    \ xx, int yy) {\n        x = xx;\n        y = yy;\n    }\n};\n\nint main() {\n\
    \    MyClass o{1, 2}; // invoke user-provided constructor\n    std::cout << \"\
    User-provided constructor invoked.\" << '\\n';\n    std::cout << o.x << \" \"\
    \ << o.y;\n}\n```\n\nIn this example, our class has two data fields of type int\
    \ and a constructor that accepts two parameters and assigns them to data members.\
    \ We invoke the constructor by providing arguments in the initializer list with\
    \ MyClass o{1, 2};\n\n### 23.4.2 Member Initialization\n\nIn our previous example,\
    \ we used a constructor body and assignments to assign value to each class member.\
    \ A better, more efficient way to initialize an object of a class is to use the\
    \ constructor’s member initializer list in the definition of the constructor:\n\
    \n```cpp\n#include <iostream>\n\nclass MyClass {\npublic:\n    int x, y;\n   \
    \ MyClass(int xx, int yy)\n        : x{xx}, y{yy} // member initializer list\n\
    {}\n};\n\nint main() {\n    MyClass o{1, 2}; // invoke user-defined constructor\n\
    \    std::cout << o.x << \" \" << o.y;\n}\n```\n\nA member initializer list starts\
    \ with a colon, followed by member names and their initializers, where each initialization\
    \ expression is separated by a comma. This is the preferred way of initializing\
    \ class data members.\n\n### 23.4.3 Copy Constructor\n\nWhen we initialize an\
    \ object with another object of the same class, we invoke a copy constructor.\
    \ If we do not supply our copy constructor, the compiler generates a default copy\
    \ constructor that performs the so-called shallow copy. Example:\n\n```cpp\n#include\
    \ <iostream>\n\nclass MyClass {\nprivate:\n    int x, y;\npublic:\n    MyClass(int\
    \ xx, int yy) : x{ xx }, y{ yy }\n{}\n};\n\nint main() {\n    MyClass o1{1, 2\
    \ };\n    MyClass o2 = o1; // default copy constructor invoked\n}\n```\n\nIn this\
    \ example, we initialize the object o2 with the object o1 of the same type. This\
    \ invokes the default copy constructor. We can provide our own copy constructor.\
    \ The copy constructor has a special parameter signature of MyClass(const MyClass&\
    \ rhs). Example of a user-defined copy constructor:\n\n```cpp\n#include <iostream>\n\
    \nclass MyClass {\nprivate:\n    int x, y;\npublic:\n    MyClass(int xx, int yy)\
    \ : x{ xx }, y{ yy }\n{}\n\n    // user-defined copy constructor\n    MyClass(const\
    \ MyClass& rhs)\n    : x{rhs.x}, y{rhs.y} // initialize members with other object's\
    \ members\n    {\n      std::cout << \"User defined copy constructor invoked.\"\
    ;\n    }\n};\n\nint main() {\n  MyClass o1{1, 2};\n  MyClass o2 = o1; // user\
    \ defined copy constructor\n}\n```\n\nHere we defined our own copy constructor\
    \ and we print a simple message in the console. Please note that the default copy\
    \ does does correctly copy members of some types, such as pointers. In order to\
    \ properly make copies, we need to define our own logic inside the copy constructor.\
    \ This is referred to as deep copy. For pointers, for example, we need to create\
    \ a pointer and assign a value to the object it points to:\n\n```cpp\n#include\
    \ <iostream>\n\nclass MyClass {\nprivate:\n  int x;\n  int* p;\npublic:\n  MyClass(int\
    \ xx, int pp)\n    : x{xx}, p{new int{pp}} {}\n\n  MyClass(const MyClass& rhs)\n\
    \    : x{rhs.x}, p{new int{*rhs.p}} {}\n};\n```\n\n### 23.4.4 Copy Assignment\n\
    \nSo far, we have used copy constructors to initialize one object with another\
    \ object. We can also copy the values to an object after it has been initialized/created.\
    \ We use a copy assignment for that. Simply, when we initialize an object with\
    \ another object using the = operator on the same line, then the copy operation\
    \ uses the copy constructor:\n\nMyClass copyfrom;\n\nMyClass copyto = copyfrom;\
    \ // on the same line, uses a copy constructor\n"
  mdcn: "\n\n# 第 23 章 类 - 简介\n\n现在我们的对象 `o` 可以可以直接访问所有成员字段，因为它们都被标记为公共（public）。无论访问修饰符如何，成员字段之间总是可以互相访问。这就是为什么成员函数\
    \ `print()` 可以访问成员字段 `x` 并打印或更改它的值。\n\n私有（private）成员只能由类的其他成员访问，而不能由对象访问。带有完整注释的示例：\n\
    \n```cpp\n#include <iostream>\nclass MyClass {\nprivate:\n    int x; // x 现在具有私有访问权限\n\
    public:\n    void print() {\n        std::cout << \"The value of x is:\" << x;\
    \ // print() 可以访问\n        // x\n    }\n};\n```\n\n```cpp\nint main() {\n    MyClass\
    \ o; // 创建对象\n    o.x = 123; // 错误，x 有私有访问权限，无法被\n    // 对象 o 访问\n    o.print();\
    \ // 对象 o 可以访问 print()\n}\n```\n\n现在我们的对象 `o` 只能访问类中公共部分的成员函数 `print()`。它不能访问类中私有部分的成员。\n\
    \n如果我们希望类成员可以被我们的对象访问，就把它们放在公共区域。如果我们希望类成员不能被我们的对象访问，就把它们放在私有区域。\n\n我们希望数据成员具有私有访问权限，而函数成员具有公共访问权限。这样，我们的对象可以直接访问成员函数，但不能访问成员字段。另一个访问修饰符称为保护（protected）：我们将稍后讨论。\n\
    \n## 23.4 构造函数\n\n构造函数是一个与类同名的成员函数。为了初始化类的对象，我们使用构造函数。构造函数的目的是初始化类的对象并为数据成员赋值。如果一个类有构造函数，该类的所有对象都将由它初始化。\n\
    \n### 23.4.1 默认构造函数\n\n没有参数或带有默认参数的构造函数被称为默认构造函数。它是可以在无参数调用的构造函数：\n\n```cpp\n\
    #include <iostream>\nclass MyClass {\npublic:\n    MyClass() {\n        std::cout\
    \ << \"Default constructor invoked.\" << '\\n';\n    }\n};\nint main() {\n   \
    \ MyClass o; // 调用默认构造函数\n}\n```\n\n另一个默认构造函数的示例，带有默认参数的：\n\n```cpp\n#include\
    \ <iostream>\nclass MyClass {\npublic:\n    MyClass(int x = 0, int y = 0) {\n\
    \        std::cout << \"Default constructor invoked.\" << '\\n';\n    }\n};\n\
    int main() {\n    MyClass o; // 调用默认构造函数\n}\n```\n\n如果代码中没有显式定义默认构造函数，编译器将生成一个默认构造函数。当我们定义自己的需要参数的构造函数时，默认构造函数会被移除且不再由编译器生成。构造函数在对象初始化时被调用。构造函数可以有任意参数；在这种情况下，我们称它们用户提供的构造函数。\n\
    \n```cpp\n#include <iostream>\nclass MyClass {\npublic:\n    int x, y;\n    MyClass(int\
    \ xx, int yy) {\n        x = xx;\n        y = yy;\n    }\n};\n\nint main() {\n\
    \    MyClass o{1, 2}; // 调用用户提供的构造函数\n    std::cout << \"User-provided constructor\
    \ invoked.\" << '\\n';\n    std::cout << o.x << \" \" << o.y;\n}\n```\n\n在这个示例中，我们的类有两个\
    \ `int` 类型的数据字段，以及一个接受两个参数并将它们赋值给数据成员的构造函数。我们通过在初始化列表中提供参数 `MyClass o{1, 2}` 来调用构造函数。\n\
    \n### 23.4.2 成员初始化\n\n在之前的示例中，我们使用构造函数体和赋值来给每个类成员赋值。初始化类对象的更好、更高效的方法是在构造函数的定义中使用构造函数的成员初始化列表：\n\
    \n```cpp\n#include <iostream>\n\nclass MyClass {\npublic:\n    int x, y;\n   \
    \ MyClass(int xx, int yy)\n        : x{xx}, y{yy} // 成员初始化列表\n{}\n};\n\nint main()\
    \ {\n    MyClass o{1, 2}; // 调用用户定义的构造函数\n    std::cout << o.x << \" \" << o.y;\n\
    }\n```\n\n成员初始化列表以冒号开头，后面是成员名称及其初始化器，其中每个初始化表达式之间用逗号分隔。这是初始化类数据成员的首选方式。\n\n###\
    \ 23.4.3 拷贝构造函数\n\n当我们用同类的另一个对象初始化一个对象时，我们会调用拷贝构造函数。如果我们不提供拷贝构造函数，编译器会生成一个默认拷贝构造函数，执行所谓的“浅拷贝”。示例：\n\
    \n```cpp\n#include <iostream>\n\nclass MyClass {\nprivate:\n    int x, y;\npublic:\n\
    \    MyClass(int xx, int yy) : x{ xx }, y{ yy }\n{}\n};\n\nint main() {\n    MyClass\
    \ o1{1, 2 };\n    MyClass o2 = o1; // 调用默认拷贝构造函数\n}\n```\n\n在这个示例中，我们用相同类型的对象\
    \ `o1` 初始化对象 `o2`。这调用了默认拷贝构造函数。我们可以提供自己的拷贝构造函数。拷贝构造函数有一个特殊的参数签名 `MyClass(const\
    \ MyClass& rhs)`。用户定义的拷贝构造函数的示例：\n\n```cpp\n#include <iostream>\n\nclass MyClass\
    \ {\nprivate:\n    int x, y;\npublic:\n    MyClass(int xx, int yy) : x{ xx },\
    \ y{ yy }\n{}\n\n    // 用户定义的拷贝构造函数\n    MyClass(const MyClass& rhs)\n    : x{rhs.x},\
    \ y{rhs.y} // 使用其他对象的成员初始化\n    {\n      std::cout << \"User defined copy constructor\
    \ invoked.\";\n    }\n};\n\nint main() {\n  MyClass o1{1, 2};\n  MyClass o2 =\
    \ o1; // 调用用户定义的拷贝构造函数\n}\n```\n\n在这里我们定义了自己的拷贝构造函数并在控制台打印了一条简单的消息。请注意，默认拷贝无法正确拷贝某些类型的成员，例如指针。为了正确地拷贝，我们需要在拷贝构造函数内部定义自己的逻辑。这被称为“深拷贝”。对于指针，我们需要创建一个指针并为它所指向的对象赋值值：\n\
    \n```cpp\n#include <iostream>\n\nclass MyClass {\nprivate:\n  int x;\n  int* p;\n\
    public:\n  MyClass(int xx, int pp)\n    : x{xx}, p{new int{pp}} {}\n\n  MyClass(const\
    \ MyClass& rhs)\n    : x{rhs.x}, p{new int{*rhs.p}} {}\n};\n```\n\n### 23.4.4\
    \ 拷贝赋值\n\n到目前为止，我们一直使用拷贝构造函数用另一个对象初始化一个对象。我们也可以在对象初始化/创建后将值拷贝到对象中。我们使用拷贝赋值。简单来说，当我们在同一行使用\
    \ `=` 运算符用另一个对象初始化对象时，该拷贝操作将使用拷贝构造函数：\n\nMyClass copyfrom;\n\nMyClass copyto =\
    \ copyfrom; // 在同一行，使用拷贝构造函数\n\n"
