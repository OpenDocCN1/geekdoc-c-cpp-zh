    void printmessage()\n{\n    std::cout << \"Hello World from a function.\";\n}\n\
    ```\n\n## 20.3 函数参数\n\n编写一个程序，包含一个类型为 `int` 名为 `multiplication` 的函数，接受两个值传递的 `int`\
    \ 参数。该函数乘以这两个参数并将结果返回给自己。在 `main` 中调用该函数并将函数的赋值赋值给一个本地 `int` 变量。在控制台中打印结果。\n\n\
    ```cpp\n#include <iostream>\n\nint multiplication(int x, int y)\n{\n    return\
    \ x * y;\n}\n\nint main()\n{\n    int myresult = multiplication(10, 20);\n   \
    \ std::cout << \"The result is: \" << myresult;\n}\n```\n\n## 20.4 参数传递\n\n编写一个程序，包含一个类型为\
