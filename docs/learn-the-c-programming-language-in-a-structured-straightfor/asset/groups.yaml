    \ 第 31 章 代码组织\n\n### 31.1 头文件与源文件\n\n我们可以将 C++ 代码拆分为多个文件。按照惯例，有两种文件：头文件和源文件。头文件通常包含声明，而源文件包含定义。头文件通常使用\
