  md: '# String Processing Summary


    # Searching strings


    +   - Search the string from index 0


    ```

    the_string.find("is")

    ```


    +   - Search the string from a specified index


    ```

    the_string.find("is", 3)

    ```


    # Splitting strings


    +   - Split the string using whitespaces as the delimiter


    ```

    the_string.split()

    ```


    +   - Split the string using a specified character as the delimiter


    ```

    the_string.split("#")

    ```


    # Replacing strings


    +   - All occurrences of the specified string will be replaced.


    ```

    the_string.replace("two", "2")

    ```


    +   - The specified string will only be replaced for the specified number of times.


    ```

    the_string.replace("three", "3", 1)

    ```


    # Glossary


    | database | 資料庫 | Line Feed (LF) | 換行 |

    |---|---|---||}{

    | delimiter | 定界符 | record | 記錄 |

    | End Of File (EOF) | 結尾 | stream | 串流 |

    | field | 欄位 | | |'
