    # ENRICHMENT


    Visual programming and textual programming

    Traditional programming languages are difficult for beginners. The reason is that
    textual programming (文字编程) requires us to write the code line by line as follow
    strict syntax (语法), otherwise our program cannot be run on the computer. Examples
    of textual programming are Python, C++, JavaScript and PHP.


    To help people who start learning programming, visual programming (视觉化编程) is developed.
    Examples are Scratch, MakeCode, App Inventor and mBlock. Visual programming lets
    us write programs by arranging visual elements (e.g. blocks or flowcharts), thus
    it is easy to read and write. Even if we do not know how to use the blocks, we
    can still guess the use of a program easily. Since each programming language has
    its own syntax, block programming languages allow students who are new to programming
    to focus on the basic concepts instead of spending time on learning complicated
    syntax.


    ![](img/6245c9a2f253de7e46e46099a7ee8520_320_2.png)'
