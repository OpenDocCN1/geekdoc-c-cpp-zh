  md: '# Stacks


    # The concept and manipulation of stacks


    Imagine that you are a librarian. You need to take books from a bookshelf and
    put them onto another bookshelf. While you are taking out the books, they are
    stacked and the first one you have taken out becomes the bottom of the stack.
    While you are putting the books back onto the bookshelf, you pick up the one at
    the top of the stack, i.e. the last book you have taken out. This mode of manipulation
    is called Last-In First-Out (LIFO).


    ![](img/6245c9a2f253de7e46e46099a7ee8520_158_0.png)


    A stack is a data structure that adopts the above mode of manipulation. When you
    add (push) a data item into a stack, the item will be added to the top of the
    stack; when you remove (pop) a data item from a stack, the removed item will be
    the one at the top of the stack, i.e. the last item that you have added.


    ![](img/6245c9a2f253de7e46e46099a7ee8520_158_1.png)


    Fig. 5.3 Push operation


    Fig. 5.4 Pop operation'
