  md: '# Manipulation of stacks in Python


    We can use a Python list to store items in a stack and implement various stack
    manipulations. See the following basic stack manipulations:


    | Stack manipulation | Python list manipulation | Description |

    |---|---|---|n| Define a stack | `the_stack = []` | Create an empty list. |

    | Push | `the_stack.append(item)` | Add an item `item` to the end of the list.
    |

    | Pop | `the_stack.pop()` | Return the item at the end of the list and delete
    this item from the list. |


    The following diagrams explain how to implement stack manipulations using a list:


    | Python code | Stack manipulation |

    |---|---|n| `the_stack = []` | Create empty list `the_stack`. |

    | `the_stack.append(''A'')` | Add "A" to the end of list `the_stack`.\n![image]

    | `the_stack.append(''B'')` | Add "B" to the end of list `the_stack`.\n![image]

    | `the_stack.append(''C'')` | Add "C" to the end of list `the_stack`.\n![image]

    | `temp = the_stack.pop()` | Take out the item at the end of list `the_stack`
    and save it at variable `temp`.\n![image] |'
