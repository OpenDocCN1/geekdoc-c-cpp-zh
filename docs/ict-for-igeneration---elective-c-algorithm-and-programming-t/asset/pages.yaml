  md: '# Splitting strings


    An English sentence is formed by multiple words, which are separated from one
    another by whitespaces. We use the split() function to split words into list items,
    and then the function returns this list. The following is a sample Python program:


    ```

    the_string = "I am fine"

    words = the_string.split())

    print(words)

    #[''I'', ''am'', ''fine'']

    print(type(words)) #<class ''list''>

    ```


    Apart from splitting strings by the default delimiter (i.e. whitespaces), we can
    specify another delimiter. The split() function uses the input parameter as the
    delimiter. The following example uses "#" as the delimiter for splitting strings.


    ```

    the_string.split("#")

    String to be split delimiter

    ```


    Sample Python programram:


    ```

    the_string = "cat#dog#bird"

    words = the_string.split("#")

    print(words)

    #[''cat'', ''dog'', ''bird'']

    print(type(words)) #<class ''list''>

    ```


    # Replacing strings


    We have often to update the content of text files. Python provides the replace()
    function, which returns the new string after the specified string has been updated.


    ```

    the_string.replace("two", "2")

    String to replaced New string

    ```


    Sample Python program:


    ```

    the_string = "one two three three three"

    new_string = the_string.replace("two", "2")

    print(the_string) #one two three three three

    print(new_string) #one 2 three three three three

    ```


    ![](img/6245c9a2f253de7e46e46099a7ee8520_289_0.png)'
  merge: -1
  pgno: 289
- img_proc: true
  md: '# MISCONCEPTION


    ❌ `replace()` function directly changes the specified string in `the_string` to
    a new string.


    ✅ `replace()` function returns the new string after the specified string has updated,
    while `the_string` remains unchanged.


    ![](img/6245c9a2f253de7e46e46099a7ee8520_290_0.png)


    If the number of replacements is not specified, all occurrences of the specified
    string will be replaced. An integer parameter can be added to the `replace()`
    function to specify the number of replacements.


    ```

    the_string.replace("three", "3", 1)

    String to be replaced New string No. of replacements

    ```


    Sample Python program:


    ```

    the_string = "one two three three three"

    new_string = the_string.replace("three", "3", 1)

    print(the_string)  #one two two three three three

    print(new_string)  #one two two 3 three three

    ```


    ![](img/6245c9a2f253de7e46e46099a7ee8520_290_1.png)'
