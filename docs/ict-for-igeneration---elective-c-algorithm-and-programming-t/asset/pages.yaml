    # Pixels and Image Manipulation


    Have you ever wondered how photo editing is done? It might be much easier than
    you think! Since photos are lattices of pixels, and each pixel is an integer representing
    the pixel''s colour, we can represent images using a 2D array of the integer data
    type. This is also one of the most popular ways of manipulating images.


    With the knowledge and understanding of 2D arrays, control structures, and iterations,
    we can easily add, change, and rearrange the values in 2D arrays. As a result,
    we can build our version of a photo editor and do all sorts of image manipulation
    like rotate, flip, scale and more.


