  md: "# Remarks\n\nIn Python, the print() function defaults to add a newline character\
    \ after printing, meaning that the content to be printed next will be placed in\
    \ a new line. If we add end = \"\"\" to the input parameter of print(), the content\
    \ to be printed next will be shown in the same line. The following is the Python\
    \ program rewritten from the above pseudocode:\n\n```\nL = int(input())\nfor i\
    \ in range(0, L):\n    for j in range(0, L):\n        print(\"*\", end=\"\")\n\
    print()\n```\n\n# 3.3 Nested Loops and Two-dimensional Arrays\n\nWe often use\
    \ a for loop to access items in a two-dimensional array by one one:\n\n| Pseudocode\
    \ | Explanation / Box analogy |\n|---|---|\n| for i from 0 to 2 | Use a for loop\
    \ to assign values to items in the two-dimensional array by one one. |\n| for\
    \ j from 0 to 5 | j=0 j=2 j=4 |\n| num[i,j] <- i * j | j=1 j=3 j=5 |\n| | i=0\
    \ 0 0 0 |\n| | i=1 0 2 3 4 5 |\n| | i=2 0 4 6 8 10 |\n\nNo matter whether values\
    \ will be assigned to list items individually or consecutively with the use of\
    \ a for loop, users must first create a list and assign default values before\
    \ they can access the items. This process is known as initialisation. The following\
