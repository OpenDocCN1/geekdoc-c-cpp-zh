  md: '# 7.5 Updating Records in a Text File


    A text file is similar to a simple database. We can record data in an external
    file independent of a program to facilitate storage and retrieval. Unlike internal
    data (stored in variables) of a program, data stored in external files does not
    disappear even when the program ends or the computer shuts down. This chapter
    will show you how to update records in a text file, such as adding, amending and
    deleting records, by Python programs.


    Most structured text files can help us store and process large amount of data
    effectively. By referring to the format of data storage in a database, we can
    store and display data in rows and columns.


    +   * Each column is a field;

    * Each row is a record.


    Take the following table that stores contact information as the example:


    | First name | Last name | Type | Phone number |

    |---|---|---|--- |

    | Rose | Wong | Mobile | 95784224 |

    | Daniel | Chan | Mobile | 90094786 |

    | Gary | Lee | Mobile | 23546030 |

    | Sally | Ho | Mobile | 68753694 |


    Assume that we store the above data in a text file "phonebook.txt", each line
    represents the record of a contact and each field is delimited by a semicolon.
    The format is as follows:


    ```

    Rose:Wong:Mobile:95784224

    Daniel:Chan:Mobile:90094786

    Gary:Lee:Home:23546030

    Sally:Ho:Mobile:68753694

    ```


    ![](img/6245c9a2f253de7e46e46099a7ee8520_297_0.png)'
  merge: -1
  pgno: 297
- img_proc: true
  md: "# Loading records\n\nTo update records in a text file by a program, we need\
    \ to load the data into the program first, and then store and process the data\
    \ in a two-dimensional list. In Checkpoint 7.1, we have understood how to store\
    \ the data in a text file as a two-dimensional list. The following two-dimensional\
    \ list record displays the information in the text file \"phonebook.txt\":\n\n\
    | | 0 | 1 | 2 | 3 |\n|---|---|---|---||\n| 0 | \"Rose\" | \"Wong\" | \"Mobile\"\
    \ | \"95784224\" |\n| 1 | \"Daniel\" | \"Chan\" | \"Mobile\" | \"90094786\" |\n\
    | 2 | \"Gary\" | \"Lee\" | \"Home\" | \"23546030\" |\n| 3 | \"Sally\" | \"Ho\"\
    \ | \"Mobile\" | \"68753694\" |\n\nThe following sub-program load_record() saves\
    \ the information in the text file to two-dimensional list record:\n\n```\ndef\
    \ load_record():\n    f = open(\"phonebook.txt\", \"r\")\n    global record\n\
    \    record = f.readlines()\n    for i in range(0, len(record)):\n        record[i]\
    \ = record[i].replace(\"\\n\", \"\")\n        record[i] = record[i].split(\":\"\
    )\n    f.close()\n```\n\nThe following sub-program print_record() prints the items\
    \ of two-dimensional list record in table format:\n\n```\ndef print_record():\n\
    \    for i in range(0, len(record)):\n        for j in range(0, 4):\n        \
    \    print(record[i][j], end = \"\\t\")\n        print(\"\")\n```\n\nThe following\
    \ is the output in the shell after loading the data and calling the sub-program\
    \ print_record():\n\n```\nShell -\nPython 3.7.9 (bundled)\n>>> %Run 'phonebook_manager.py'\n\
    Rose Wong Mobile 95784224\nDaniel Chan Mobile 90094786\nGary Lee Home 23546030\n\
    Sally No Mobile 68753694\n```\n\n> TIP Printing the tab character '\\t' advances\
    \ the cursor to the next tab stop\n\n![](img/6245c9a2f253de7e46e46099a7ee8520_298_0.png)"
  merge: -1
  pgno: 298
- img_proc: true
  md: "# Searching for records\n\nThe following sub-program search_recordByFirstName(firstName)\
    \ uses linear search to search for the existence of the target name firstName\
    \ in the list, and returns the search result:\n\n+   - If the input name exists\
    \ in the list, the sub-program returns the number of that record at the end;\n\
    - If the input name does not exist in the list, the sub-program outputs -1 at\
    \ the end.\n\n```\ndef search_recordByFirstName(firstName):\n  for i in range(0,\
    \ len(record)):\n    if record[i][0] == firstName:\n      return i\n  return -1\n\
    ```\n\n> THINK ABOUT\nWhat is the return value of calling the sub-program search_recordByFirstName(\"\
    Gary\")? 2\n\n# Deleting records\n\nThe following sub-program delete_recordByFirstName(firstName)\
    \ replaces the whole of the target name firstName with the string \"-\" to indicate\
    \ that the record has been deleted:\n\n```\ndef delete_recordByFirstName(firstName):\n\
    \  row = search_recordByFirstName(firstName)\n  if row != -1:\n    for j in range(0,\
    \ 4):\n      global record\n      record[row][j] = \"-\\\"\n```\n\nThe following\
    \ is the output in the shell after calling the data and calling the sub-programs\
    \ delete_recordByFirstName(\"Gary\") and print()record() sequentially:\n\n![](img/6245c9a2f253de7e46e46099a7ee8520_299_0.png)"
  merge: -1
