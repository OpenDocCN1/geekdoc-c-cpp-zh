  md: '# Sorting Algorithms


    # Selection sort


    Selection repeatedly carries out linear search in the unsorted part of the list
    in order to find the minimum or maximum value. Then, this value is swapped with
    the first item of the unsorted list so as to set up the sorted part of the list.
    This process is repeated until all items have been sorted.


    ![](img/6245c9a2f253de7e46e46099a7ee8520_273_0.png)


    # Insertion sort


    Insertion sort divides the list into the sorted and unsorted parts, then one of
    the items in the unsorted part (key value) is inserted into the correct position
    in the sorted part of the list. This process is repeated until all list items
    have been sorted.


    ![](img/6245c9a2f253de7e46e46099a7ee8520_273_1.png)


    # Bubble sort


    Bubble sort starts from the first item of the list and compares an item with its
    adjacent item. If the two items are in the wrong positions, they will be swapped.
    This process is repeated until all list items have been sorted.


    ![](img/6245c9a2f253de7e46e46099a7ee8520_273_2.png)'
