  md: "# Global variables\n\nA variable declared outside a sub-program is regarded\
    \ as a global variable.\nIts scope covers the whole program including all sub-programs.\n\
    \n```\nadj = \"fun\"\n\ndef fill():\n    print(\"Python is \" + adj)\n\nfill():\n\
    \    print(adj, adj, adj)\n```\n\nNo matter whether the global variable adj is\
    \ in the main program or the sub-program, the program can read its value. The\
    \ above program’s output is:\n\nPython is fun\nfun fun\n\nIn Python, a variable\
    \ declared within a sub-program is regarded as a local variable by default. To\
    \ change the value of a global variable in the sub-program, we need to use the\
    \ keyword global in the sub-program to represent the global variable.\n\nUsing\
    \ an undeclared local variable score\n\n```\ndef add1():\n    score = score +\
    \ 1\n\nadd():\n    print(score)\n```\n\nUsing the keyword global to refer to the\
    \ global variable score\n\n```\ndef add1():\n    global score\n    score = score\
    \ + 1\n\nadd1():\n    print(score)\n```\n\n> The value of a global variable can\
    \ be read directly in a sub-program. To change its value, the keyword global must\
    \ be used."
