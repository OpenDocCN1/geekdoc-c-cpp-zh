  md: '# Linear linked list


    A linked list is formed by many nodes. Each node stores its data and a pointer,
    which stores the address of the next node. Nodes in the linked list are all connected
    by pointers.


    ![](img/6245c9a2f253de7e46e46099a7ee8520_207_0.png)


    When we want to add a new node to or delete a node from the linked list, we simply
    need to change the pointers of the nodes.


    # Delete a node


    ![](img/6245c9a2f253de7e46e46099a7ee8520_207_1.png)


    # Add a node


    ![](img/6245c9a2f253de7e46e46099a7ee8520_207_2.png)


    # Comparison of linked lists and arrays


    | Types of data stored | Linked lists | Arrays |

    |---|---|---|n| Different | Same |

    | Data access method | Sequential access | Direct access / Random access |

    | Speed of data access | Low | High |

    | Speed of adding or deleting data | High | Low |


    # Glossary


    +   - array: node / 節點

    - circular queue: 循環隊列 / null pointer / 空值指標

    - data structure: 數據結構 / pointer / 指標

    - dequeue: 離開 / pop / 彈

    - direct access: 直接存取 / push / 推進

    - enqueue: 排序 / queue / 隊列

    - First-In-First-Out (FIFO): 先進後出法 / random access / 隨機存取

    - Last-In-First-Out (LIFO): 後進先出法 / sequential access / 順序存取

    - linked list: 鏈表 / stack / 堆疊'
