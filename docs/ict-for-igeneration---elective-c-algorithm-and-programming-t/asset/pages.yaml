  md: "# ENRICHMENT (递归)\n\nRecursion\nRecursion means the process of a function calling\
    \ itself in a function. Take the following code as an example, the parameter passed\
    \ in the first function call, passes the parameter sec-1 every time it calls the\
    \ recursive function. The recursion stops when the value of sec becomes zero.\n\
    \n```\ndef countdown(sec):\n    if sec == 0: # base case\n        print(\"Time's\
    \ up!\")\n    else:\n        countdown(sec-1)\n```\n\n![](img/6245c9a2f253de7e46e46099a7ee8520_135_0.png)\n\
    \nA recursive function must have a base case (基本情况) to prevent the function from\
    \ calling itself indefinitely. The control flow of a recursive function is as\
    \ follows:\n\n![](img/6245c9a2f253de7e46e46099a7ee8520_135_1.png)\n\nIf the recursive\
    \ function has a return value, the control flow is as follows:\n\n```\ndef summ(num):\n\
    \    if num == 1: # base case\n        return 1\n    else:\n        return (num\
    \ + summ(num-1))\n```\n\nprint(summ(4))\n\n![](img/6245c9a2f253de7e46e46099a7ee8520_135_2.png)"
