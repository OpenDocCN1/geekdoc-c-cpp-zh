  md: "# 4.5 Parameters Passing\n\nWhen calling a sub-program that requires an input\
    \ parameter, the actual parameter will be passed to the formal parameter. In Python,\
    \ the program determines the way of passing parameter according to the data type\
    \ of the actual parameter.\n\nFormal parameter\n\n```\ndef printx2(s):\n    print(s)\n\
    \    print(s)\n```\n\nsent = \"hello\"\n\n```\nprintx2(sent)\n```\n\nActual parameter\n\
    \n![](img/6245c9a2f253de7e46e46099a7ee8520_133_0.png)\n\n# A Passing immutable\
    \ objects\n\nIn Python, integers (int), floats (float), Booleans (bool) and strings\
    \ (str) are immutable objects. When calling a sub-program and passing an immutable\
    \ object, the value of the actual parameter will be copied to the formal parameter\
    \ of the sub-program. Since formal parameters belong to the local variables as\
    \ well, when the sub-program ends, all local variables will be destroyed. Therefore,\
    \ modifications to the formal parameter within the sub-program do not affect the\
    \ value of the actual parameter.\n\n| Python | Analogy |\n|---|---|\n| def add(add:,\
    \ x):\n    print(\"Inside, before add:\", x)\n    x = x + 1\n    print(\"Inside,\
    \ after add:\", x) | Memory address Data Actual parameter num |\n| 0x1000 | 1\
    \ Copy |\n| 0x1001 | |\n| 0x1002 | |\n| 0x1003 | |\n| 0x1004 | 2 Modify Formal\
    \ parameter x (local variable) |\n| 0x1005 | |\n| 0x1006 | |\n| 0x1007 | |\n\n\
    ```\nnum = 1\nprint(\"Outside, before add:\", num)\nadd(num)\nprint(\"Outside,\
    \ after add:\", num)\n```\n\n```\nOutside, before add: 1\nInside, after add: 1\n\
    Inside, after add: 2\nOutside, after add: 1\n```"
  merge: -1
  pgno: 133
- img_proc: true
  md: "# Passing mutable objects\n\nLists (list) are mutable objects in Python. When\
    \ calling a sub-program and passing a mutable object, the formal parameter of\
    \ the sub-program will store the computer memory address of the actual parameter.\
    \ The formal parameter is the pointer to the actual parameter. When the sub-program\
    \ is being run, the formal parameter will refer to the memory address of the actual\
    \ parameter, therefore any modifications made to the formal parameter within the\
    \ sub-program will be reflected in the actual parameter.\n\n```\ndef add(x):\n\
    \    print(\"Inside, before add:\", x)\n    x[0] = x[0] + 1\n    print(\"Inside,\
    \ after add:\", x)\n\nnum = []\nprint(\"Outside, before add:\", num)\nadd(num)\n\
    print(\"Outside, after add:\", num)\n```\n\n| Memory address | Data | Actual parameter\
    \ |\n| :--- | :--- | :--- |\n| 0x1000 | +2 | Modify |\n| 0x1001 | | |\n| 0x1002\
    \ | | |\n| 0x1003 | | |\n| 0x1004 | 0x1000 | Formal parameter x (local variable)\
    \ Refer |\n| 0x1005 | | |\n| 0x1006 | | |\n| 0x1007 | | |\n\n# ENRICHMENT\n\n\
    In C++, there are also two ways for passing, which are called call-by-value (按值调用)\
    \ and call-by-reference (按引用). When a sub-program is called by value, the value\
    \ in the actual parameter will be copied and become the formal parameter in the\
    \ sub-program, which is akin to the effect of passing an immutable object in Python.\
    \ Calling a sub-program by reference is the other way round. Since the value passed\
    \ is the computer memory address of the actual parameter, the formal parameter\
    \ can directly refer to the value of the actual parameter, which is akin to the\
    \ effect of passing a mutable object in Python.\n\nOutside, before add: [1]\n\
    Inside, before add: [1]\nInside, after add: [2]\nOutside, after add: [2]"
  merge: -1
