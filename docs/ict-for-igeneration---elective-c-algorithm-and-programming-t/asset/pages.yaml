    # Random functions


    Randomness is a common element in lucky draws and games, which makes the result
    difficult to predict and brings surprise to the participants. Below are random
    functions in the “random” library:


    | Random function | Description | Value of y |

    | --- | --- | --- |

    | random() | Return a random floating-point number from 0 to 1 (excluding 1).
    | 0 <= y <= 1 |

    | uniform(a, b) | Return a random floating-point number from a to b (excluding
    b). | 1 <= y <= 10 |

    | randint(a, b) | Return a random integer from a to b. | 1 <= y <= 10 |


    Table 4.3 Commonly used random functions in Python'
