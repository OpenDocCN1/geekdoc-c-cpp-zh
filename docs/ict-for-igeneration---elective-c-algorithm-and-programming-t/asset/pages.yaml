  md: '# Bubble sort


    Bubble sort starts from the first item of the list and compares an item with its
    adjacent item. If the two items are in the wrong positions, they will be swapped.


    # The concept of bubble sort


    The following list mark stores the exam marks of seven students, as shown below:


    | mark | 45 | 70 | 66 | 82 | 55 | 95 | 60 |

    | index | 0 | 1 | 2 | 3 | 4 | 5 | 6 |


    Suppose that the list is to sorted in descending order:


    +   1. Starting from the leftmost item of the list, compare two adjacent items.
    If the value on the left is smaller, swap the two items.


    ![](img/6245c9a2f253de7e46e46099a7ee8520_254_0.png)


    +   2. After the above operation has been completed of the whole list, the smallest
    value will move (rise) to the last item. This divides the list into the sorted
    and unsorted parts.


    ![](img/6245c9a2f253de7e46e46099a7ee8520_254_1.png)'
  merge: -1
  pgno: 254
- img_proc: true
  md: "3. Starting from the leftmost item in the unsorted part, compare two adjacent\
    \ list items. If the value on the left is smaller, swap the two items.\n\n![](img/6245c9a2f253de7e46e46099a7ee8520_255_0.png)\n\
    \n4. After the above operation has been completed once again, the second smallest\
    \ value will move (rise) to the second last item. This adds one item to the sorted\
    \ part.\n\n![](img/6245c9a2f253de7e46e46099a7ee8520_255_1.png)\n\n5. Repeat until\
    \ all list items have been sorted.\n\n![](img/6245c9a2f253de7e46e46099a7ee8520_255_2.png)\n\
    \n# The program for bubble sort\n\nThe following Python program writes the algorithm\
    \ of bubble sort:\n\n```\nfor i in range(len(mark)-1):\n  for j in range(0, len(mark)-1-i):\n\
    \    if mark[j] < mark[j+1]:\n      temp = mark[j]\n      mark[j] = mark[j+1]\n\
    \      mark[j+1] = temp\n```\n\n> If the value on the left is smaller, swap the\
    \ two items.\n\n> Inner loop of bubble sort\n\n> Outer loop of bubble sort"
