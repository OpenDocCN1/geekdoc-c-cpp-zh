  md: '# Algorithm Design & Basics of Python Programs


    # Comments


    Programming is often a long-term development project and possibly a collaboration
    between a lot of people. Therefore, using comments, which means explaining the
    use of code in simple ways, is a good and necessary habit. Comments do not affect
    the program operation, because they are ignored by the program compiler. The purpose
    of adding them is to make the program more readable, so that you or others can
    understand the gist quickly when reading the long program.


    Python does not require declaration of the data types of variables and the variables
    can be tagged as different data types at any time. Thus, we can add clear comments
    to avoid design errors in the future, e.g other programmers change the uses of
    variables and lead to errors. Python, all after the "# in a line is regarded as
    comments. Then displays in light grey.


    ```

    # Comments

    # This program is to calculate the area of a square

    print("to find the area of a square")

    length = input("enter a length for a square:")

    length = float(length) # The data type of length to float

    area = length * length # The data type of float is float

    print(area)

    ```


    # Basic Programming Concepts


    # Output statements


    In Python, the print() function prints the input parameter in the brackets to
    the console. The input parameter can be strings, variables or expressions:


    | Input parameter | Purpose | Output |

    | --- | --- | --- |

    | String | Display all characters within the quotation marks | print("Text") |
    Text |

    | Variable | Print the value of the variable | length = 10

    print(length) | 10 |

    | Expression | Print the input parameters sequentially. Different types of data
    or expressions are separated by ",". Whitespaces are added automatically when
    printing | name = "Sam"

    print("Hi", name) | Hi Sam |


    Table 1.3 Output statements of Python


    +   1. To add a quotation mark to a string, we can add a backslash (\ ) before
    the quotation mark. This backlash is called an "escape character", meaning that
    it "escapes" from "cancels") its original syntax function.

    2. The print() function is default to adding a line break after printing, meaning
    the content to be printed next will automatically be placed in a new line. If
    we use "end = "" at the end of the input parameter in print(), the last string
    output can be changed, and the content to be printed next will be in the same
    line.'
