    # Other errors


    Apart from numerical errors, other kinds of errors may appear in the program,
    which prevent the program from running properly and may even lead to wrong results.
    Programs include syntax errors, logical errors and run-time errors.


    > GOTO Syntax errors, logical errors and run-time errors are mentioned in Core
    section 6.2.


    | Definition | Syntax errors | Logical errors | Run-time errors |

    | --- | --- | --- | --- |

    | Definition | The code cannot be compiled and executed because it breaks the
    rule of the programming language. | The program behaves (functions) abnormally
    or produces results because of errors in terms of logics. | When the program is
    running, it encounters a problem and stops unexpectedly. |

    | Examples | - Missing columns -n Misspelled keywords -n Wrong choice of letter
    case -n Missing indentation or brackets | - Errors in the sequences -n Errors
    in the control structure of conditional statements -n Infinite loops | - Dividing
    by zero -n Calculating the square root of a negative number -n Accessing an item
    that is outside the range of the array index |

    | How to detect | IDE can detect syntax errors. | Test the logical flow of the
    program with test data. | IDE will display the error message after the program
    has stopped.'
