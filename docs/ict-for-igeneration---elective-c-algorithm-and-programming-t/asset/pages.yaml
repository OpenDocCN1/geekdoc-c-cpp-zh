  md: '# CHAPTER SUMMARY


    # Focus >>


    # Searching Algorithms


    +   - Linear search


    The program searches the list from the beginning until reaching the index of the
    target value or the last index of the list.


    ![](img/6245c9a2f253de7e46e46099a7ee8520_272_0.png)


    +   - Binary search


    Only applicable to sorted lists.


    +   1. The item in the middle of the list is compared first. If it is the same
    as the target value, the search ends.

    2. If this item is smaller/larger than the target value, it means that the target
    value can only appear in the second/first half of the list. The search range of
    the list is narrowed to the second/first half of the list, and then the item in
    the middle is compared.

    3. Repeat until the search range of the list is narrowed down to one item. If
    this is the same as the target value, the search ends. Otherwise, the target value
    does not exist in the list.


    ![](img/6245c9a2f253de7e46e46099a7ee8520_272_1.png)


    +   - Comparison of linear search and binary search


    | Algorithm design and program writing | Linear search | Binary search |

    |---|---|---|n| | Simple | Complicated |

    | Requirements for the list to be searched | No | The items in the list must be
    sorted |

    | Efficiency | Suppose that there are N items on a list: N | Suppose that there
    are N items on a list: log, N |

    | Average number of searches | N+1 | log, N |

    | Applicable to | Lists with fewer items | Lists with more items |'
  merge: -1
