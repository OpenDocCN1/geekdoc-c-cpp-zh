  md: '![](img/6245c9a2f253de7e46e46099a7ee8520_214_0.png)


    # The need for efficient sorting algorithms


    Sorted lists are everywhere in our daily life. Apart from simply reading lists
    to obtain information, we also add new data to them. Every time a new data is
    added, the list will be sorted again again using sorting algorithms. With the
    enormous amount of digital data in our modern society, imagine how much extra
    time we have to spend if we could only use selection sort! Therefore, efficient
    sorting algorithms are a necessity for people nowadays. We are constantly searching
    for new algorithms to handle more data in a shorter time frame and with fewer
    resources.


    You may wonder why we don''t use the fastest to sort everything? Why do we have
    so many different sorting algorithms? A major reason is that different sorting
    algorithms perform differently in different use cases. Their performances depend
    on many factors, such as the data structure for storing the information.


    ![](img/6245c9a2f253de7e46e46099a7ee8520_214_1.png)


    ![](img/6245c9a2f253de7e46e46099a7ee8520_214_2.png)'
