    # Blockchain


    Although Blockchain technology might sound intimidating, its fundamental concept
    is, in fact, quite similar to a basic linked list data structure! In a Blockchain,
    each block contains the block''s transactions and a hash pointing to the previous
    block. A Blockchain''s block is like a linked list''s node, which stores the node''s
    data and the pointer to another node.


    Despite their similarities, it is crucial to remember that Blockchain and linked
    lists are not without their differences in operations, nature, mutability and
    more. For example, processes like the deletion or insertion of a node cannot be
    done on a Blockchain.


    ![](img/6245c9a2f253de7e46e46099a7ee8520_154_1.png)'
