  md: 'In the second column, the number in $S[8, 1]$ can be found when the numbers
    in the first 8 cells are known. Write the algorithm to find the number in $S[8,
    1]$ and write down the answer on the grid.


    ```

    S[8,1] ← 45

    for i from 0 to 7

    S[8,1] ← S[8,1] - S[i,1]

    ```


    (c) The final rule is that numbers 1 to 9 must be included in each row of the
    $9 \times 9$ grid. All numbers must be used and no repetition is allowed. For
    example,


    | 0 | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 |

    |---|---|---|---|---|---|---|---|---||

    | 0 | 4 | 9 | 7 | 1 | 3 | 2 | 6 | 8 |

    | 1 | 1 | 2 | | | | | | |

    | 2 | 5 | 8 | 3 | 7 | 6 | 4 | 2 | 1 |

    | 3 | 9 | 3 | 1 | | | | | |

    | 4 | 6 | 7 | 8 | | | | | |

    | 5 | 2 | 4 | 5 | | | | | |

    | 6 | 3 | 5 | | | | | | |

    | 7 | 8 | 1 | | | | | | |

    | 8 | 7 | 6 | | | | | | |


    In the third row, the number in $S[2, 3]$ can be found when the numbers in the
    other 8 cells are known. Suppose that $S[2, 3]$ is set to 0, write the algorithm
    to find the number in $S[2, 3]$ and write down the answer on the grid.


    ```

    S[2,3] ← 0

    remain ← 45

    for j from 0 to 8

    remain ← remain - S[2,j]

    S[2,3] ← remain

    ```'
