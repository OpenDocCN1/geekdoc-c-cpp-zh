  md: '# Application of stacks in computer systems


    The “undo”(復原) and “redo”(取消復原) operations that we frequently perform make use
    of the stack structure. Suppose that we are using a drawing software.


    +   1. When we perform an operation, it will be added to the undo stack.


    ![](img/6245c9a2f253de7e46e46099a7ee8520_159_0.png)


    ![](img/6245c9a2f253de7e46e46099a7ee8520_159_1.png)


    ![](img/6245c9a2f253de7e46e46099a7ee8520_159_2.png)


    ![](img/6245c9a2f253de7e46e46099a7ee8520_159_3.png)


    +   2. When we perform another operation, it will be added on top of the previous
    operation.


    ![](img/6245c9a2f253de7e46e46099a7ee8520_159_4.png)


    ![](img/6245c9a2f253de7e46e46099a7ee8520_159_5.png)


    ![](img/6245c9a2f253de7e46e46099a7ee8520_159_6.png)


    +   3. If we press the “undo” button, the program will follow the last-in-first-out
    mode of manipulation, which means taking our last operation from the undo stack
    and put it into the redo stack.


    ![](img/6245c9a2f253de7e46e46099a7ee8520_159_7.png)


    ![](img/6245c9a2f253de7e46e46099a7ee8520_159_8.png)'
