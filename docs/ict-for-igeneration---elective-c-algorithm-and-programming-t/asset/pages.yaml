  md: "# # A Opening texts files\n\nIn Python, the most important function for handling\
    \ text files is the open() function. This requires two parameters: file name and\
    \ extension of the text file and the mode.\n\n```\nf = open(\"datafile.txt\",\"\
    r\")\n```\n\nName of the declared text file object  File name and extension  Mode\n\
    \n> TIP If the file and Python are different in folders, you need to provide the\
    \ complete path to the file.\n\nThere are four modes for opening a file:\n\n|\
    \ Mode | Description |\n| --- | --- |\n| \"r\" | Read the content of a text file.\
    \ If the file does not exist, a run-time error occurs. |\n| \"x\" | Create a file.\
    \ If the file already exists, a run-time error occurs. |\n| \"w\" | Open the file\
    \ and overwrite its content. If the file does not exist yet, the program will\
    \ create it. |\n| \"a\" | Open the file and append new content. If the file does\
    \ not exist yet, the program will create it. |\n\nAfter completing file operations,\
    \ remember to use the close() function to close the file.\n\n```\nf.close()\n\
    ```\n\nName of the text file object to be closed\n\n# # B Checking whether a text\
    \ file exists\n\nIf the file to be opened does not exist, a run-time error occurs\
    \ in the program. To avoid this, we can import the \"os\" library and use the\
    \ path.exists() function to check whether the file exists before trying to open\
    \ it.\n\n```\nos.path.exists(\"targetfile.txt\")\n```\n\nName of the file/path\
    \ to be checked\n\nThis function returns a Boolean value: it returns True if the\
    \ file exists; otherwise it returns False.\n\n```\nimport os\nif os.path.exists(\"\
    targetfile.txt\"):\n    print(\"The file exists.\")\nelse:\n    print(\"The file\
    \ does not exist.\")\n```"
