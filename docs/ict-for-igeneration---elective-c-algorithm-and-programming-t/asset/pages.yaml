  md: '# The concept and manipulation of circular queue


    As shown in the pointers manipulation above, in the case of an array with a fixed
    size, we can neither add new items nor reuse the array once the tail of the queue
    reaches the end of the array. This way of manipulation wastes computer resources.


    To solve this problem, we can simply reset the pointers. When a pointer reaches
    the end of the array, the next value of the pointer is to reset the index of the
    first item in the array. In this way, a circular queue is formed. The following
    explains how to implement the manipulation of circular queue using pointers:


    ![](img/6245c9a2f253de7e46e46099a7ee8520_179_0.png)


    | Queue manipulation | Pointer manipulation |

    | :--- | :--- |

    | | Assume that initially the data of the queue is at the end of the array. |

    | `cir_queue = [''A'', ''B'']` | ![cir_queue 0 1 2 3 4 5 6 7 head tail]() |

    | Since pointer tail has reached the end of the array, set the value of tail to
    0. |

    | `enq(cir_queue, ''C'')` | ![enq(cir_queue, ''C'') 0 1 2 3 4 5 6 7 tail head]()
    |

    | Increase the value of pointer tail by 1. |

    | `enq(cir_queue, ''D'')` | ![enq(cir_queue, ''D'') 0 1 2 3 4 5 6 7 tail head]()
    |

    | Increase the value of pointer head by 1. |

    | `deque(cir_queue)` | ![deque(cir_queue) 0 1 2 3 4 5 6 7 tail head]() |'
  merge: -1
  pgno: 179
