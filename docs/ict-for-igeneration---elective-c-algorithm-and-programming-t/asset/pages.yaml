    Method 1: The digit of each pixel is stored as an individual number in the text
    file. The position of a digit in the text file corresponds to the position of
    that pixel in the image.


    Method 2: An image is scanned from top to bottom and left to right. Consecutive
    pixels are regarded as a group and stored as [D,N] in a text file, where D and
    N represent the digit of pixel and consecutive occurrences respectively.


    Below are a 5 x 5 image and text file storing the pixels by one of the methods:


    | Image | Text file storing the image by Method 1 | Text file storing the image
    by Method 2 |

