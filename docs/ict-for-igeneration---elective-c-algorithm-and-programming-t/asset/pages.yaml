  md: "# Simple data types\n\nAfter declaring the name of a variable, the name becomes\
    \ the identifier of the variable. Besides, data types define the types of values\
    \ stored in the variables. The computer will assign suitable memory to each variable\
    \ based on the type of data stored in the variable. Data types also determine\
    \ the kinds of arithmetical, relational or logical operations that can be performed\
    \ on variables without causing errors in the program. The following are four simple\
    \ data types in Python:\n\n| Simple data type | Data |\n|--- |---|\n| Integer\
    \ (int) | Integers (both positive and negative) |\n| Float (float) | Integers\
    \ and decimals (both positive and negative) |\n| Boolean (bool) | Must either\
    \ \"True\" or \"False\" |\n| String (str) | A series of characters, which may\
    \ include any letters, numbers and some special symbols |\n\nTable 1.4 Simple\
    \ data types of Python\n\nUnlike most programming languages, Python declares the\
    \ types of variables by tagging values directly during assignments. Python uses\
    \ \"=\" as the assignment operator to put data into a specified variable, which\
    \ automatically tags the type of variable according to that piece of data. The\
    \ following are examples of assignment and tagging of variables:\n\n![](img/6245c9a2f253de7e46e46099a7ee8520_17_0.png)\n\
    \n| Pseudocode | Python | Output |\n|---|---|---|\nmark = 98 | mark = 98 | <class\
    \ 'int'> \nprint(type(mark)) | |\\grade = \"A\" | grade = \"A\" | <class 'str'>\
    \ \nprint(type(grade)) |\n\nTable 1.5 Assignment statements of Python\n\n> ANALOGY\
    \ Variables are very similar to algebra that we have learnt in Mathematics. Besides,\
    \ they are like boxes for storing objects in our daily life. A name is labelled\
    \ on a box for identifying the content. Variables can store various types of data,\
    \ such as numbers or text. Different data types will be explained in detail later.\n\
    \n![](img/6245c9a2f253de7e46e46099a7ee8520_17_1.png)"
