  md: '![](img/6245c9a2f253de7e46e46099a7ee8520_58_0.png)


    # Software Testing Levels


    There are four major levels of software testing, namely unit testing, integration
    testing, system testing and acceptance testing. Each level of testing has its
    own unique and specific objective. For example, programmers test the individual
    components in the unit testing phase, while end users test the entire system in
    the acceptance testing phase. Together, the four levels of software testing provide
    a comprehensive review of software testing to ensure minimal errors in the program.


    Performing tests of different levels has become a conventional practice in the
    industry. For example, Swift, the programming language for Apple products, supports
    unit testing. Apple also has an Apple Beta Software Program, which performs acceptance
    testing by allowing end-users to try the pre-release versions of their operating
    systems and programs.


    ![](img/6245c9a2f253de7e46e46099a7ee8520_58_1.png)'
