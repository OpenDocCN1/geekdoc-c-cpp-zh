  md: '# Algorithm Design & Basics of Python Programs


    # Data Structures


    Data structure helps organising data for easier use. An example is one-dimensional
    array (1D array). It is a simple linear data structure that stores a set of data
    sequentially in continuous variables. This set of data are often of the same type.


    > ANALOGY

    An array / List is like a cabinet: a cabinet has several drawers for different
    objects. A name is written on drawer so that the user can identify the object
    stored inside.


    # Arrays and Python lists (one-dimensional arrays)


