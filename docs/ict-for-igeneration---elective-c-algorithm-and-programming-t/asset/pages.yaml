  md: '# ENRICHMENT (双向链表)


    **Doubly linked list** stores not only its own data but also two pointers, which
    points to the previous node and the next node respectively. Thus, multiple pointers
    have to be redirected when we add a new node or delete a node. However, a merit
    of a doubly linked list is that a node can be accessed from both directions.


    ![](img/6245c9a2f253de7e46e46099a7ee8520_189_0.png)


    Circular linked list (环向链表)

    A circular list is formed when we direct the pointer of the last node in the linked
    list to the first node.


    ![](img/6245c9a2f253de7e46e46099a7ee8520_189_1.png)


    Think about what a doubly circular linked list is like.


    # Application of linked lists in computer systems


    After a file system has been used for a long time, a lot of files are created,
    edited and deleted. Files are stored in storage devices in the form of separate
    fragments. Such dispersed arrangement is called disk fragmentation. A linked list
    is one of the data structures used in memory management. The computer system connects
    all fragments of a file using a linked list.


    > GOTO

    Disk fragmentation is discussed in Core B section 3.2.


