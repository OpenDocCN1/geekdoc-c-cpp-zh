  md: "# Text file streaming\n\nPython treats content in a document as continuous\
    \ character streams. When a document is opened, the system generates a hidden\
    \ pointer to indicate the position being read at the moment, i.e. point to the\
    \ first character. The pointer will move in the order in which the program reads\
    \ the document, until it reaches the end of the file.\n\nIn text files, there\
    \ are some special characters for controlling the formats of printing and display.\
    \ Usually such characters are not shown in the document editor, but they are still\
    \ stored in the text files. The above example contains two kinds of special characters\
    \ that are commonly used:\n\n+   - Line Feed (LF) character “\n” is stored at\
    \ the end of every line;\n- End Of File (EOF) character “EOF” is stored at the\
    \ end of the text file.\n\n![](img/6245c9a2f253de7e46e46099a7ee8520_285_0.png)\n\
    \nIn Python, the read() function is used to read a document until it detects the\
    \ EOF, thus the returned string contains the whole content of the document; while\
    \ the readline() function is used to read a document until it detects a \n or\
    \ reaches the end of the file. Take the following Python program as example:\n\
    \n```\nf = open(\"testfile.txt\", \"r\")\nline1 = f.readline()\nline2 = f.readline()\n\
    line3 = f.readline()\nline4 = f.readline()\nf.close()\n#line1 = \"This is line\
    \ one.\\n\"\n#line2 = \"This is line two.\\n\"\n#line3 = \"This is line three.\"\
    \n#line4 = \"\"\n```"
  merge: -1
