- img_proc: true
  md: "# Quick sort\n\nQuick sort is also a sorting algorithm that makes use of the\
    \ strategies of divide-and-conquer and recursion. Its concept is as follows:\n\
    \n+   1. Use the first item in the list as the pivot.\n2. Divide the list into\
    \ two sub-lists using the pivot:\n   - list item(s) smaller than the pivot\n \
    \  - list items greater than or equal to the pivot\n3. Then, perform the above\
    \ two steps on the two sub-lists separately, until only one item is left in each\
    \ sub-list.\n\n![](img/6245c9a2f253de7e46e46099a7ee8520_270_0.png)\n\n# ENRICHMENT\n\
    \nEfficiency of merge sort and quick sort\nBoth merge sort and quick sort divide\
    \ the list until each sub-list has only one item left. Assume that the list has\
    \ N items, the program needs to divide it into i levels:\n\n```\n$N = 2!$$\n$$N\
    \ = 2^i$$\n$$\\log N = i \\log 2$$\n$$i = \\frac{\\log N}{\\log 2} = \\log_2 N$$\n\
    ```\n\nThe number of comparisons at every level is around N. Therefore, in the\
    \ worst case, the total number of comparisons made by both sorting algorithms\
    \ is $N \\log_2 N$."
  merge: -1
