  md: '# Naming sub-programs


    The name of a sub-program is its identifier. The rules for naming variables applying
    to naming sub-programs as well. Since both variable names and sub-program names
    are identifiers, every identifier in the same program must be unique and no repetition
    is allowed.


    # GOTO


    +   - Rules for naming variables

    - mentioned in section

    - 1.3 of Elective C.


    # Formal parameters


    > TIP To make a sub-program easier to understand, its name should reflect its
    actual use.


    The formal parameters to be passed to the sub-program are listed in the brackets.
    If there is more than one parameter to be passed, use commas to separate the parameters.
    If there are no parameters to pass, leave the brackets blank. The following are
    some examples:


    ```

    def myFunction(a):          #Pass one parameter

    def myFunction(a, b, c):    #Pass more than one parameter

    def myFunction(c):             #No parameter

    ```


    # Return value


    In a sub-program, the keyword return means ending and sending back the piece of
    data to the position where the sub-program is called. If there are no data to
    be returned by the sub-program, that keyword does not need to be added and the
    sub-program ends after executing the code in the main body.


    ```

    return value1          #Return one value

    return value1, value2    #Return more than one value

    ```


    Take the sub-program for adding three parameters to an example, the following
    is the Python code for defining the sub-program:


