  md: "When we store a number in a variable, if that number exceeds the range of values\
    \ that can be stored in the data type of variable, an overflow error occurs. On\
    \ the contrary, if number is lower than the range of values that can be stored\
    \ in the data type of variable, an underflow error occurs.\n\nFor example, if\
    \ we try to access an item outside the range of array index, or obtain a result\
    \ that exceeds the range after calculating the two's complement representation,\
    \ overflow error occurs.\n\n| GOTO errors |\n|---|\n| Overflow errors in the calculation\
    \ of the two's complement representation is mentioned in Core A section 3.1 |\n\
    \n# Numerical errors\n\n# Truncation errors\n\nWhen there is insufficient memory\
    \ space for storing a number, we need to shorten the number, and one way to do\
    \ so is to truncate the digits. Truncation error refers to the difference between\
    \ the true value and the actual value stored:\n\n> Truncation error = | True value\
    \ – Actual value stored |\n\nFor example, if we want to save the value of $\\\
    pi$ in a variable that can store three decimal places, only the actual value stored\
    \ will be 3.141, and the truncation error will be 0.00592653589…\n\n![](img/6245c9a2f253de7e46e46099a7ee8520_60_0.png)\n\
    \nIn Python, we can use the `trunc()` function in the `math` library to truncate\
    \ the decimal places.\n\n```\nimport math\n = 1234.56789ninteger_part = math.trunc(num)\n\
    print(integer_part)\n```\n\nAlternatively, we may make use of the `int()` function\
    \ to truncate the decimal places of a float and convert the float into integer\
    \ data type.\n\n```\nnum = 1234.56789\ninteger_part = int(num)\nprint(integer_part)\n\
    ```"
