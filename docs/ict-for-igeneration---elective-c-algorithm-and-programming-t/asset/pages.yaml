- img_proc: true
  md: '# Efficiency of the Sorting Algorithms


    Assume that there are $N$ items in the list, the number of comparisons required
    for performing selection sort, insertion sort or bubble sort in the worst case
    is:


    $$N(N-1) / 2$$


    As for merge sort and quick sort, the number of comparisons required in the worst
    case is:


    $$N \log N$$


    The following chart shows the number of comparisons required in the worst case
    when the program uses different sorting algorithms on lists of different lengths.
    It can be seen that when there are more items in the list, merge sort and quick
    sort are much more efficient than other sorting algorithms.


    Number of comparisons


    ![](img/6245c9a2f253de7e46e46099a7ee8520_271_0.png)


    Fig. 6.5 Comparison of the number of comparisons required by different sorting
    algorithms'
