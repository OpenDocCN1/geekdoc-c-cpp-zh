  md: '# Variables and simple data types


    Data is often used in the process of computation. Variables are locations in the
    computer memory for data storage.


    # Declaration of variables


    Most programming languages require us to declare the name and data type of any
    variable that we are going to use. Variables cannot be named arbitrarily, otherwise
    program errors or obstacles in reading may be caused. In Python, should pay attention
    to the following rules for naming variables:


    +   A variable name can only start with English letters (A-Z, a-z) or an underscore
    (_), but not numbers (0-9).


    ```

    _number1

    _number

    ```


    +   Only English letters, numbers and underscore (_) can be used in a variable
    name. "Whitespace" or other symbols such as !, #, $) must not be included.


    ```

    _new_number

    _new_number

    _new_number!

    ```


    +   We cannot use "keywords / reserved words" as variable names. Such keywords
    are reserved by the programming language and have predetermined meanings, so they
    are not available for use. The following are some examples of keywords in Python:


    ```

    _print

    _and

    _or

    _for

    _while

    _if

    ```


    > TIP Python is case-sensitive, "bmi" and "Bmi" represent two different variables.
    Variable names usually start with small letters.

    Although the data in variables can be changed, some values are fixed, e.g n=3.14159.
    Variables with fixed data (also constants) are often named in all letters, e.g
    "PI".

    To make the algorithm easier to understand, the variable name should reflect its
    actual use. If "weight" and "height" are changed to "A" and "B", it will be better
    to guess the uses of variables and the purpose of the whole algorithm.

    When more than one word is used in a variable name, the words can be separated
    by underscores or lower cases for ease of reading. For example, "sumscores" can
    be changed to sum_of_scores.\nSince variable names are for identifying variables
    in the computer memory, each variable name in the same program must be unique
    and repetition must be avoided.


    ![](img/6245c9a2f253de7e46e46099a7ee8520_16_0.png)'
  merge: -1
