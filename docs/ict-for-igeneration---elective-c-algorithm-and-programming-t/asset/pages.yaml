  md: "# Software Debugging Tools\n\nAfter we have finished writing a program, we\
    \ should test the program systematically and ensure that it fulfils its intended\
    \ purpose. We have used a series of test data to verify the accuracy of programs.\
    \ Substitute the data into the program and run it, and then compare the test result\
    \ with the expected result. If the test result does not match the expected result,\
    \ it means the program contains errors.\n\n![](img/6245c9a2f253de7e46e46099a7ee8520_64_0.png)\n\
    \nWhen the program is found to contain bugs, we must identify the locations where\
    \ they occur, so that we can formulate effective solutions and eliminate all the\
    \ errors. This process is known as debugging. Flags and stubs are some of the\
    \ many ways of debugging. Other than these, many Integrated Development Environments\
    \ provide some debugging functions to help us test and debug our programs.\n\n\
    +   GOTO\n**Stubs** are explained in detail in Elective C section 4.6.\n\n# Tracing\
    \ variable values\n\nWe have used dry runs and trace tables to analyse program\
    \ codes by line, tracing the flow of the program and the values of all variables.\
    \ Using the debug mode of the IDE, we can execute the program step by step and\
    \ monitor the variable in the program in order to spot errors. This method is\
    \ known as program trace.\n\n+   GOTO\nThe debug mode of Thonny is mentioned in\
    \ Core D section 6.2.\n\n```\nTommy - C:\\Users\\Desktop\\debugmode.py @ 6:17\n\
    File Edit View Run Tools Help\n  Step into (F7)\ndebugmode.py\n1 A = 1\n2 B =\
    \ 3\n3 if A < B:\n4   print(B-A/2)\n5 else:\n6   print(A-B/2)\n```\n\n| Variables\
    \ | Value |\n|---|---|\n| A | 1 |\n| B | 3 |\n\n# Breakpoints\n\nA breakpoint\
    \ is the position where the execution of a program is suspended, we can view its\
    \ current status in the IDE, such as the current values of variables, to find\
    \ out whether the error is before or after the breakpoint. We usually add a breakpoint\
    \ before a conditional statement or the part that we want to test."
