  md: '# Queue manipulation | Pointer manipulation


    Since pointer head has reached the end of the array, set the value of head to
    0.


    deq(cir_queue)


    ![](img/6245c9a2f253de7e46e46099a7ee8520_180_0.png)


    Same as stack manipulations, before performing queue manipulations, there are
    two things that we need to pay attention to:


    +   1. We cannot pop an item from an empty queue, otherwise an underflow error
    will occur.


    ![](img/6245c9a2f253de7e46e46099a7ee8520_180_1.png)


    +   2. We cannot push an item into a full queue, otherwise an overflow error will
    occur.


    ![](img/6245c9a2f253de7e46e46099a7ee8520_180_2.png)


    > TIP As shown in the two cases above, we cannot tell if a queue is empty or full
    simply from the positions of pointers (head > tail). Therefore, when using a circular
    queue, we should use an extra variable (N) to record the number of items in the
    queue.'
