  md: '# Queues manipulated with pointers


    To enhance the efficiency of queue manipulation, we can use two pointers (head
    and tail) to indicate the first and last items of the queue respectively. Whenever
    adding or deleting an item, we may have to move the pointers. The following explains
    how to implement queue manipulation using pointers:


    | Queue manipulation | Pointer manipulation |

    | --- | --- |

    | | Pointers head and tail both point to the same item, meaning that there is
    only one item in the queue. |

    | `the_queue = [''A'']` | ![image](0.334, 0.283, 0.766, 0.355) |

    | | Increase the value of pointer tail by 1. |

    | `enq(the_queue, ''B'')` | ![image](0.334, 0.423, 0.766, 0.506) |

    | | Increase the value of pointer tail by 1. |

    | `enq(the_queue, ''C'')` | ![image](0.334, 0.563, 0.766, 0.642) |

    | | Increase the value of pointer head by 1. |

    | `deq(the_queue)` | ![image](0.334, 0.696, 0.766, 0.779) |

    | | Increase the value of pointer head by 1. |

    | `deq(the_queue)` | ![image](0.334, 0.836, 0.766, 0.915) |'
