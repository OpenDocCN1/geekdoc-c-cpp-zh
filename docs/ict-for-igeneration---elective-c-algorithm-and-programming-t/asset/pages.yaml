  md: '# Efficiency of binary search


    Binary search assumes that the items in a list have been sorted and starts searching
    from the middle of the list. After each comparison, even if the item is not the
    same as the target value, the search range can be reduced by half. Suppose that
    there are N items in the list:


    +   1. If the target value is not found in the first iteration, the search range
    for the next iteration will be reduced to:


    $$\frac{N}{2} items$$


    2. If the target value is still not found in the second iteration, the search
    range of the next iteration will once again be reduced to:


    $$\frac{N}{4} items$$


    3. Similarly, after the $i^{th}$ iteration, the search range will be reduced to:


    $$\frac{N}{2^i} items$$


    4. The worst case is that the target value is stored in the last item in the list
    or does not exist in it. That is, after the $i^{th}$ iteration, only one item
    remains in the search range:


    $$\frac{N}{2^i}=1$$


    Using the above equation, we can calculate the maximum number of iterations required
    for searching a list with N items in the worst case:


    $$\frac{N}{2^i}=1$$

    $$

    N=2^i$$

    $$

    log N=i \log 2$$

    $$

    i=\frac{\log N}{\log 2}$$


    The maximum number of iterations required for a binary search of the list mark
    with ten items is 4 ($\log 10 = 3.32$).


    > TIP The log button on a calculator usually has a base of 10.


    ![](img/6245c9a2f253de7e46e46099a7ee8520_225_0.png)


    ![](img/6245c9a2f253de7e46e46099a7ee8520_225_1.png)'
  merge: -1
  pgno: 225
