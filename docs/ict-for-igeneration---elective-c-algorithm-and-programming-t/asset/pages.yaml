  md: '# Boolean expressions


    # Relational operators


    A Boolean expression gives only two possible results: "True" or "False", so the
    result belongs to the Boolean data type. Relational operators can be used to create
    Boolean expressions.


    ```

    mark >= 50

    ```


    | Relational operator | Meaning | Boolean expression | Logical result of inputting
    50 |

    |---|---|---||}{

    | == | Equal to | mark == 50 | True |

    | < | Less than | mark < 50 | False |

    | <= | Less than or equal to | mark <= 50 | True |

    | > | Greater than | mark > 50 | False |

    | >= | Greater than or equal to | mark >= 50 | True |

    | != | Not equal to | mark != 50 | False |


    **Table 1.8** Relational operators and Boolean expressions in Python


    > **MISCONCEPTION**

    **Confusion between relational operator "==" and assignment operator "="**

    Relational operator "==" is used in a Boolean expression, which gives either "True"
    or "False" and acts as an evaluation condition;

    Assignment operator "=" is used in an assignment statement, which replaces the
    original value of a variable on the left with the value of the operator.'
