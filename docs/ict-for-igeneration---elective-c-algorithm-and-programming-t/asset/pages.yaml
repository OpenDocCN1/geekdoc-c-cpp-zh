  md: '# 1.4 Control Structures


    In computer algorithms, there are three basic types of control structures, including
    sequence, selection, and iteration. The sequence control structure allows the
    program to execute statements according to the order of writing. Selection and
    iteration control structures let the program decide which statements to execute
    according to specified conditions.


    ![](img/6245c9a2f253de7e46e46099a7ee8520_23_0.png)


    # A Selection


