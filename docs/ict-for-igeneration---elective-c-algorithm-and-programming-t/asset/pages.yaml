  md: '# 5.3 Queues


    # # The concept and manipulation of queues


    Suppose that you are now waiting in a queue outside a newly opened restaurant.
    The restaurant has no table reservation system; instead, let diners enter sequentially
    using the first-come, first-served approach. Since you are the first diner in
    the queue, you can enter the restaurant first. This mode of manipulation is called
    First-In First-Out (FIFO).


    ![](img/6245c9a2f253de7e46e46099a7ee8520_171_0.png)


    A queue is a data structure that adopts the above mode of manipulation. When you
    add a data item to a queue (enqueue), that data item will be added to the end
    of the queue. When you take a data item from the queue (dequeue), the removed
    item will be the one at the beginning of the queue, i.e. the first item that you
    have added.


    ![](img/6245c9a2f253de7e46e46099a7ee8520_171_1.png)


    Fig. 5.5 Enqueue operation


    ![](img/6245c9a2f253de7e46e46099a7ee8520_171_2.png)


    Fig. 5.6 Dequeue operation'
