  md: '4. If we press the "redo" button, the program will pop the last operation that
    we have undone from the redo stack and put it back into the undo stack.


    ![](img/6245c9a2f253de7e46e46099a7ee8520_160_0.png)


    5. When we perform the next operation, the program will clear the redo stack.


    ![](img/6245c9a2f253de7e46e46099a7ee8520_160_1.png)


    Moreover, we need to use stacks when a program calls its sub-program. Call stack
    (调用堆) is a stack stored in RAM and used to coordinate sub-programs. When we call
    a sub-program, its stack frame, which stores information as return address, will
    be pushed into the call stack. When the sub-program has been executed, its stack
    frame will be popped. Following is the operating principle of a call stack.


    | Line | Code | Call sub-program square | Call sub-program area | Call sub-program
    multiply |

    |---|---|---|---||

    | 1 | def multiply(a, b): | | | |

    | 2 | return a*b | | | |

    | 3 | | | Line 8 | Line 5 |

    | 4 | def area(a, b): | Line 11 | Line 11 | Line 8 |

    | 5 | return multiply(a, b) | | | Line 11 |

    | 6 | | | | |

    | 7 | def square(n): | End sub-program multiply | End sub-program area | End sub-program
    square |

    | 8 | area = area(n, n) | Line 5 | Line 8 | Line 11 |

    | 9 | | | | |

    | 10 | #main program | | Line 11 | |

    | 11 | print(square(5)) | Call stack | Call stack | Call stack |'
