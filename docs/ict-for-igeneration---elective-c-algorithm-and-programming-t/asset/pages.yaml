  md: "Therefore, we need to use stubs. They replace the main body of sub-programs\
    \ by short, simple and temporary code, allowing the main program to run even when\
    \ the sub-programs have not been completed. Since stubs are also sub-programs,\
    \ we only need to define the sub-program names or return values when writing them.\
    \ The following are examples of some common stubs:\n\n+   - Stubs without a return\
    \ value:\n```\ndef stubs_with_no_return_value():\n    print()\n```\n\n+   - Stubs\
    \ with a return value:\n```\ndef stubs_with_return_value():\n    return 100 #Can\
    \ be modified according to the data type of return value\n```\n\nMoreover, since\
    \ stubs are simple code, it is very unlikely that they contain syntax or logical\
    \ errors. When debugging a program, we can replace certain sub-programs with stubs.\
    \ By excluding these sub-programs, we can narrow the scope of examination and\
    \ spot the issue more efficiently.\n\nTake the above BMI algorithm as an example,\
