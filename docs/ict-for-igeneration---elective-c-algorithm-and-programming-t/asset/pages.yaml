  md: '# 3.5 Algorithm Comparison


    A problem can be solved using several algorithms, yet each of them must have its
    merits and demerits. We need to compare different algorithms in order to select
    the most correct and appropriate solution. The merits and demerits of algorithms
    can be compared mainly in two aspects, steps of operation and resource usage.
    When there are more steps of operation, the program takes a longer to run, which
    usually means an increase in the time complexity (時間複雜度) of the program. When
    two algorithms use different data structures or numbers of variables, they occupy
    different amounts of resources. The more computer resources an algorithm occupies,
    the higher the space complexity (空間複雜度) of the program is.


    ![](img/6245c9a2f253de7e46e46099a7ee8520_99_0.png)


    > "appropriateness", you may refer to p.44-45 in Compulsory D2.


