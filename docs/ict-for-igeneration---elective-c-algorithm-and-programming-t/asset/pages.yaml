  md: '# Data Structures


    When writing programs, we usually use variables to store data. However, when it
    comes to storing a list of related data items, we will use data structures to
    organise the data. For example, to store the scores of all students in a class,
    we will choose to use an array instead of tens of variables.


    Data is stored in computer memory cells arranged in a row. Each computer memory
    location stores only one piece of data. Data structures refer to the methods of
    storing and organising data in the computer memory. They determine the sequences
    and locations of data items in the computer memory.


    ![](img/6245c9a2f253de7e46e46099a7ee8520_155_0.png)


    # Arrays


    As mentioned in Module D of the Compulsory Part, an array is a simple linear data
    structure that stores a list of data sequentially in a continuous computer memory.
    The following diagram shows an array that represents data items in a row:


    ![](img/6245c9a2f253de7e46e46099a7ee8520_155_1.png)


    Since data is stored continuously in the memory, the computer can use the index
    to calculate the memory address quickly and easily, and then access a given item
    directly. For example, the value of the_array[4] is “E”.


    > GOTOnArrays in computer memory is discussed in Core D section 5.1.'
