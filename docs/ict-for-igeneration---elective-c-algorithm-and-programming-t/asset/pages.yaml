    1. (2 marks)


    > The representation is simpler.

    The computation is quicker if the file is converted to a two-dimensional array.


    (d) With comparing in storing an image within a program, suggest an advantage
    of storing the pixels of an image in a text file. (1 mark)


    > Ensure the independence of data / The data is not-volatile, meaning it will
    be kept in the text file even after the program has ended.


    7. Audrey wants to improve the fan in her. She plans to make it more environmentally
    friendly and energy efficient by enabling it on and off as well as adjusting the
    wind speed according to needs. What type of sensor should she include and describe
    how the sensor controls the operation of the fan. (3 marks)


    Temperature sensor.

    When reading of the temperature sensor is higher than the threshold value, the
    system will turn off the fan;

    otherwise, if the fan is turned on, it will adjust the wind speed based on the
    difference between the current temperature and the threshold value. The larger
    the difference, the higher the wind speed.


