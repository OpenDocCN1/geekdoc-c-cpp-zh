  md: '# Differences between linked lists and arrays


    Linked lists and multidimensional arrays have similar uses in that both can store
    a series of data. However, as mentioned in Module D of the Compulsory Part, an
    array can store the same type of data. On the contrary, a linked list can store
    different types of data.


    Moreover, since array store data in a continuous memory, the computer can use
    index to calculate the memory address quickly and easily, and access a given item
    directly. This method of data access is called direct access (also known as random
    access). For example, if we want to access data item “D” in the array, we simply
    need to use the_array[3] to find the corresponding array item.


    ![](img/6245c9a2f253de7e46e46099a7ee8520_190_0.png)


    Since a linked list connects nodes by pointers, data items do not need to be stored
    in a continuous memory, instead, they can be stored separately in different locations.
    When we need to access the data item at a given location, we can only search the
    list from the beginning and follow the pointers. This access method is sequential
    access.


    ![](img/6245c9a2f253de7e46e46099a7ee8520_190_1.png)'
  merge: -1
  pgno: 190
- img_proc: true
  md: 'Although arrays are more convenient than linked lists in terms of data access,
    adding or deleting items in arrays is more complicated. For instance, if we need
    to add an item to an array, we move the items after a given location backwards
    one by one. In addition, to delete an item, we need to move the items after a
    given location forwards one by one.


    ![](img/6245c9a2f253de7e46e46099a7ee8520_191_0.png)


    Add an item


    the_array


    ![](img/6245c9a2f253de7e46e46099a7ee8520_191_1.png)


    Delete an item


    On the other hand, it is simpler to add or delete a node in a linked list. We
    only need to change the directions of the pointers.


    Delete a node


    linked_list


    ![](img/6245c9a2f253de7e46e46099a7ee8520_191_2.png)


    Add a node


    | Types of data stored | Linked lists | Arrays |

    |--- | --- | --- |

    | Data access method | Sequential access | Direct access / Random access |

    | Speed of data access | Low | High |

    | Speed of adding or deleting data | High | Low |


    Table 5.1 Comparison of arrays and linked lists'
