    3$ squares.


    (a) A rule in the sudoku game is that numbers 1 to 9 must be included in each
    $3 \times 3$ square. All numbers must be used and no repetition is allowed. For
    example,


    | 9 | 3 | 1 |

    | 6 | 7 | 8 |

    | 2 | 4 | 5 |


    (i) What should be the sum of the numbers in each $3 \times 3$ square? 45


    (ii) In the following $3 \times 3$ square, if we already know the numbers in eight
    of the cells, what is the number in $S[1, 2]$?


    | | 0 | 1 | 2 |

    | 0 | 4 | 9 | 7 |

    | S | 1 | 2 | 6 |

    | 2 | 5 | 8 | 3 |


    (b) Another rule is that numbers 1 to 9 must be included in each column of the
    $9 \times 9$ grid. All numbers must be used and no repetition is allowed. For
    example,


    | 1 | 0 | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 |

    | 0 | 4 | 9 | 7 | | | | | |

    | 1 | 2 | | | | | | | |

    | 2 | 5 | 8 | 3 | | | | | |

    | 3 | 9 | 3 | 1 | | | | | |

