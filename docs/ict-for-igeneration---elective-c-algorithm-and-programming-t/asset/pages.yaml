  md: '# CHAPTER SUMMARY


    # Focus


    # Stacks


    A data structure manipulated by the last-in-first-out approach.


    +   Push operation


    When you add (push) a data item into a stack, the data item will be added to the
    top of the stack.


    ![](img/6245c9a2f253de7e46e46099a7ee8520_206_0.png)


    +   Pop operation


    When you take (pop) a data item from a stack, the data item taken will be the
    one at the top of the stack.


    ![](img/6245c9a2f253de7e46e46099a7ee8520_206_1.png)


    # Queues


    A data structure manipulated by the first-in-first-out approach.


    +   Enqueue operation


    When you add a data item to a queue, the data item will be added to the end of
    the queue.


    ![](img/6245c9a2f253de7e46e46099a7ee8520_206_2.png)


    +   Dequeue operation


    When you take a data item from a queue, the data item taken will be the one at
    the beginning of the queue.


    ![](img/6245c9a2f253de7e46e46099a7ee8520_206_3.png)


    # Circular queue


    +   - Use two pointers (head and tail) to indicate the head and tail items of
    the queue respectively.

    - When an item is added, the value of pointer tail increases by 1.

    - When an item is deleted, the value of pointer head increases by 1.

    - When the pointer reaches the end of the array, the value of the next pointer
    will be reset to the index of the beginning of the array.


    ![](img/6245c9a2f253de7e46e46099a7ee8520_206_4.png)'
