  md: '# Boolean operators


    Boolean operators (also called logical operators) are used to determine the logical
    relationship between two conditions. A truth table lists all the combinations
    of condition evaluation results and the results after logical operations. Assume
    A and B represent condition 1 and condition 2 respectively. The following tables
    summarise the truth tables of all Boolean operators.


    | A | B | A and B | A or B | A | not A |

    |---|---|---|---|---|---|

    | True | True | True | True | True | False |

    | True | False | False | True | False | True |

    | False | True | False | True | True | False |

    | False | False | False | False | False | True |


    Table 1.9 The truth table for and operator Table 1.10 The truth table for or operator


    # Precedence and association of operators


    Like how we perform arithmetic operations, programs start with the expressions
    within brackets when processing arithmetic expressions. But how about expressions
    without brackets? Actually there is a rule similar to PEMDAS for operators. The
    order of operation is as follows:


    | Operator | Precedence | Association |

    |---|---|---|

    | () | | From inside to outside |

    | ** | | From left to right |

    | - (negative value) | | From left to right |

    | * / % | | From left to right |

    | + | | From left to right |

    | < <= >= | | From left to right |

    | == != | | From left to right |

    | not | | From left to right |

    | and | | From left to right |

    | or | | From left to right |

    | = | | From left to right |

    | += -= *= // | Lowest | From left to right |


    Table 1.12 Precedence and association of operators'
  merge: -1
