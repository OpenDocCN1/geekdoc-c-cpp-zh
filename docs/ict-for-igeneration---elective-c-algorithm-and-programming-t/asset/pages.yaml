  md: "# Efficiency of insertion sort\n\nEvery time the loop body of insertion sort\
    \ is executed:\n\n+   - the best case is the key value smaller than the item on\
    \ the left, which means there is no need to swap the items;\n- the worst case\
    \ is the key value should be inserted into the first position of the list. If\
    \ the index of the key value is k, it needs to perform (K - 1) comparisons and\
    \ swapping.\n\nTo conclude, suppose a list with N items is sorted in descending\
    \ order,\n\n+   - the best case is the list happens to be sorted in descending\
    \ order, which means there is no need to swap any items.\n- the worst case is\
    \ the list happens to be sorted in ascending order. The number of comparisons\
    \ and swapping for completing the whole insertion sort:\n\n$1 + 2 + 3 + ... +\
    \ (N - 2) + (N - 1) = \frac{N(N-1)}{2}$\n\n![](img/6245c9a2f253de7e46e46099a7ee8520_250_0.png)\n\
