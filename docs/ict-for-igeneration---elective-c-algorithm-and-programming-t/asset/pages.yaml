  md: "# The program for selection sort\n\nThe following Python program uses selection\
    \ sort to sort list mark in descending order:\n\n```\nfor i in range(0, len(mark)):\n\
    \    max_index = i\n    for j in range(i+1, len(mark)):\n        if mark[j] >\
    \ mark[max_index]:\n            max_index = j\n    temp = mark[i]\n    mark[i]\
    \ = mark[max_index]\n    mark[max_index] = temp\n```\n\n![](img/6245c9a2f253de7e46e46099a7ee8520_241_0.png)\n\
    \n> THINK ABOUT\nHow can we modify the program so that it uses selection sort\
    \ to sort mark in ascending order instead?\n\nChange the conditional statement\
    \ in line 4 to mark[j] < mark[min_index]\n\n# Efficiency of selection sort\n\n\
    Suppose that there are N items in the list:\n\n| i | The length of the unsorted\
    \ part of the list | Number of comparisons required by linear search |\n|---|---|---|\n\
    | 0 | N | N-1 |\n| 1 | N-1 | N-2 |\n| 2 | N-2 | N-3 |\n| | : | |\n| N-2 | 2 |\
    \ 1 |\n| N-1 | 1 | 0 |\n\nTherefore, the number of comparisons for completing\
    \ the whole selection sort is:\n\n(N-1) + (N-2) + (N-3) + ... + 2 + 1 = \frac{N(N-1)}{2}\n\
    \nWhen selection sort is performed on list mark with seven items, the maximum\
    \ number of comparisons to be performed by the program is 21."
