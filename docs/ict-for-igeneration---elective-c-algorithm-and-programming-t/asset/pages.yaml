  md: "# 4.4 Variable Scopes\n\nACTIVITY 4.3\n\nDo you know the reason why the following\
    \ program cannot be executed?\n\n| Python code | Cause of error |\n|---|---|\n\
    | def add(a, b): result = a + b | A variable that exceeds the scope is used. |\n\
    | add(1, 1) print(result) | |\n\nIn Python programs, each variable has a scope\
    \ in which it can be used. Variables can be categorised into local variables and\
    \ global variables according to the regions they cover.\n\n# Local variables\n\
    \nA variable declared within a sub-program is regarded as a local variable. After\
    \ the sub-program has ended, all local variables will be destroyed. If the user\
    \ tries to access a local variable outside the sub-program, the program will display\
    \ an error message.\n\n> TIP\nFormal parameters of a sub-program also belong to\
    \ local variables.\n\n```\ndef add(a, b):\n    result = a + b\n    print(result)\n\
    \ndef sub(a, b):\n    result = a - b\n    print(result)\n\nadd(1, 1)\nsub(10,\
    \ 7)\n```\n\nLocal variables in the sub-program (a, b, result) and their scopes\n\
    \nThey are different variables!\n\nLocal variables in the sub-program (a, b, result)\
    \ and their scopes"
  merge: -1
