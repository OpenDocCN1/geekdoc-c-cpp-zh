  md: '# Application of queues in computer systems


    Queues are widely applied in computer systems. For example, the order of printing
    documents is stored as a queue in the printer memory. When the user sends a task
    of printing a document, the printer adds the task to the queue, and then completes
    the tasks in the queue using the first-in-out approach.


    ![](img/6245c9a2f253de7e46e46099a7ee8520_172_0.png)


    ![](img/6245c9a2f253de7e46e46099a7ee8520_172_1.png)


    # Manipulation of queues in Python


    We use a Python list to store items in a queue and implement various queue manipulations.
    See the following basic queue manipulations:


    | Queue manipulation | Python list manipulation | Description |

    |---|---|---|n| Define a queue | the_queue = [] | Create an empty list. |

    | Enqueue | the_queue.append(item) | Add an item to the end of the list. |

    | Dequeue | the_queue.pop(0) | Return the item at the beginning of the list and
    delete this item from the list. |


    The following diagrams explain how to implement queue manipulations using a list:


    | Python code | Queue manipulation |

    |---|---|n| the_queue = [] | Create empty list the_queue. |

    | the_queue.append(*A*) | Add "A" to the end of list the_queue.

    ![the_queue 0]

    | the_queue.append(*B*) | Add "B" to the end of list the_queue.

    ![the_queue 0 1] |'
