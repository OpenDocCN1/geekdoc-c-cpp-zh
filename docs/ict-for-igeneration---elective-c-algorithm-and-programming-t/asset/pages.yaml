  md: '# STEAM +


    # Definition of functions in Mathematics


    In Mathematics, functions are expressed by symbols such as $f, g, h$ and the general
    format is


    $y = f(x)$


    ![](img/6245c9a2f253de7e46e46099a7ee8520_112_0.png)


    # ANALOGY


    # Black box


    We use functions when writing programs. Due to different reasons, such as the
    limits of our knowledge and the lack of access right to view the source code of
    libraries, we cannot understand the principles of some functions. Nonetheless,
    this does not prevent us from using those functions. They can be compared to a
    black box: we have no idea about the code and algorithm, yet the documentation
    (文档) lets us know the input and output values of the functions by using the functions.


    ![](img/6245c9a2f253de7e46e46099a7ee8520_112_1.png)


    For example, do you know what the following formula is?


    $e = \sum_{n=0}^{\infty} \frac{1}{n!} = 1 + \frac{1}{1} + \frac{1}{1\cdot2} +
    \frac{1}{1\cdot2\cdot3} + \dots$


    The above is the formula for calculating the mathematical constant $e$. We do
    not need to understand the principle of the formula nor write a program to perform
    the calculation. Instead, we simply need to use the function `math.exp(1)` to
    get the answer.


    ![](img/6245c9a2f253de7e46e46099a7ee8520_112_2.png)'
  merge: -1
