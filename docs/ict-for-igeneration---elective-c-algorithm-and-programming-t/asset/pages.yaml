  md: '3. State three benefits of automation.


    Reduce manual work / Enhance cost-effectiveness / Able to operate continuously


    # 8.5 Internet of Things (IoT), Artificial Intelligence (AI) and Smart Living


    We make use of technology to make our daily life safe, convenient and environmentally-friendly.
    The concept of smart home has existed for several decades, and some functions
    have already been realised. Most smart devices are not new inventions. However,
    because of the development and expansion of the Internet, many items can be connected
    with one another. This allows smart devices to have better functions and features
    than before.


    ![](img/6245c9a2f253de7e46e46099a7ee8520_330_0.png)


    For example, you can control your electronic appliances via the Internet. When
    the Global Positional System (GPS) on your smartphone detects that you are near
    your home, the smart air-conditioner will turn on the air-conditioner automatically.
    Then, you can enjoy comfortable breezes once you have arrived home.


    ![](img/6245c9a2f253de7e46e46099a7ee8520_330_1.png)


    Internet of Things (IoT) is the network of objects. These objects can connect
    to sensors and the Internet so that data can be transferred among one another.
    This also lets us collect the most updated information. When paired with pre-set
    programs, sensors and computers can collect and process data more effectively
    than humans do, and then help the system make automatic and appropriate decisions.


    IoT involves various communication technologies, including Wi-Fi, Bluetooth, Radio
    Frequency Identification (RFID) and Near Field Communication (NFC). For instance,
    we can control an electronic switch remotely using the Bluetooth function on our
    smartphone.


    ![](img/6245c9a2f253de7e46e46099a7ee8520_330_2.png)


    Fig. 8.13 Electronic modules for wireless communication (from left to right: a
    Wi-Fi module, a Bluetooth module and a RFID card reader with tags)


    > GOTO

    Internet of Things and smart city are discussed in Core C section 3.1.'
