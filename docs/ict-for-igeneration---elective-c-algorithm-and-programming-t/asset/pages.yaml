    # B Insertion sort


    Insertion sort divides the list into the sorted and unsorted parts, then one of
    the list items in the unsorted part (key value) is inserted into the correct position
    in the sorted part of the list. This process is repeated until all list items
    have been sorted.


    # The concept of insertion sort


    The following list mark stores the exam marks of seven students, as shown below:


    | mark | 45 | 70 | 66 | 82 | 55 | 95 | 60 |

    | index | 0 | 1 | 2 | 3 | 4 | 5 | 6 |


    Suppose that the list is to be sorted descending order:


    +   1. Firstly, set apart the first item of the list as the sorted part. Then,
    take out the first item of the unsorted part (known as "key value").


    ![](img/6245c9a2f253de7e46e46099a7ee8520_246_0.png)'
  merge: -1
  pgno: 246
- img_proc: true
  md: '# Searching and Sorting


    +   2. To find the correct position for inserting the key value, compare the key
    value with each list item in the sorted part on the left. If that item is smaller
    than the key value, move it backwards.


    +   3. Since all the list items in the sorted part have been compared, the key
    value should eventually be inserted into the first position of the list.


    Sorted

    Unsorted


    ![](img/6245c9a2f253de7e46e46099a7ee8520_247_0.png)


    Key value


    +   4. Now, an item is added to the sorted section. Similarly, take out the first
    item of the unsorted part. Compare with each list item in the sorted part on the
    left. If that item is smaller than the key value, move it backwards.


    +   5. When a larger item is found, stop moving the items. Here is the position
    where the key value should be inserted into the list.


    Sorted

    Unsorted


    ![](img/6245c9a2f253de7e46e46099a7ee8520_247_1.png)


