    # Chapter 15


    # Operator Precedence, II


    C contains many operators, and because of the way in which operator precedence
    works, the interactions between multiple operators can become confusing.


    ```

    x = 5 + 3 * 6;

    ```


    x receives the value 23, not because, in C multiplication and division have higher
    precedence than addition and subtraction.


    ```

    char *a[{}];

    ```


    Is a single pointer to an array of 10 characters, or is it an array of 10 pointers
    to character? Unless you know the precedence conventions in C, there is no way
    to find out. Similarly, the form of precedence statements as *p.i = 10; do not
    work. Instead, the form (*p).i = 10; must be used to force correctness.


    The following table from C Programming Language by Kernighan and Ritchie, shows
    the precedence hierarchy in C. The top line has the highest precedence.


    | Operators | Associativity |

    | --- | --- |

    | [ - ! ++ - + * & (type-cast) sizeof | Left to right |

    | (in the above line, +, - and are the unary forms) | Right to left |'
- md: "\n* / % Left to right\n+ - Left to right\n<< >> Left to right\n< <= > >= Left\
    \ to right\n== !== Left to right\n& Left to right\n^ Left to right\n| Left to\
    \ right\n&& Left to right\n|| Left to right\n?: Left to right\n= += -- = *= /=\
    \ %= &= ^= |= <= >= Right to left\n. Left to right\n\nUsing this table, you can\
    \ see that char*a[10]; is an array of 10 pointers to character. You can also see\
    \ why the parentheses are required if (*p).i is to be handled correctly. After\
    \ some practice, you will memorize most of this table, but every now and again\
    \ something will not work because you have been caught by a subtle precedence\
    \ problem. \n\n## Chapter 16\n## Command Line Arguments\n\nC provides a fairly\
    \ simple mechanism for retrieving command line parameters entered by the user.\
    \ It passes an argv parameter to the main function in the program. argv structures\
    \ appear in a fair number of the more advanced library calls, so understanding\
    \ them is useful to any C programmer.\n\nEnter the following code and compile:\n\
    \n```c\n#include <stdio.h>\n\nint main(int argc, char *argv[])\n{\n    printf(\"\
    %d\\n\",argc);\n    for (x = 0; x < argc; x++)\n        printf(\"%s\\n\", argv[x]);\n\
    \    return 0;\n}\n```\n\nIn this code, the main program accepts two parameters,\
    \ argv and argc. The argv parameter is an array of pointers to string that contains\
    \ the parameters entered when the program was invoked at the UNIX command line.\
    \ The argc integer contains a count of the number of parameters. This particular\
    \ piece of code types out the command line parameters. To try this, compile the\
    \ code to an executable file named aaa xxx yyy zzz. The code will print the command\
    \ line parameters xxx, yyy and zzz, one per line.\n\nThe char *argv[] is an array\
    \ of pointers to string. In other words, each element of the array is a pointer,\
    \ and each pointer points to a string (technically, to the first character of\
    \ the string). Thus, argv[0] points to a string that contains the first parameter\
    \ on the command line (the program's name), argv[1] points to the next parameter,\
    \ and so on. The argc variable tells you how many of the pointers in the array\
    \ are valid. You will find that the preceding code does nothing more than print\
    \ each of the valid strings pointed to by argv.\n\nBecause argv exists, you can\
    \ let your program react to command line parameters entered by the user fairly\
    \ easily. For example, you might have your program detect the word help as the\
    \ first parameter following the program name, and dump a help file to stdout.\
    \ File names can also be passed in and used in your fopen statements.\n\n## Chapter\
    \ 17\n## Text files\n\nText files in C are straightforward and easy to understand.\
    \ All text file functions and types in C come from the **stdio** library.\n\n\
    When you need text I/O in a C program, and you need only one source for input\
    \ information and one sink for output information, you can rely on **stdin** (standard\
    \ in) and **stdout** (standard out). You can use input and output redirection\
    \ at the command line to move different information streams through the program.\
    \ There are six different I/O commands in <stdio.h> that you can use with stdin\
    \ and stdout:\n\n- **printf** - prints formatted output to stdout\n- **scanf**\
    \ - reads formatted input from stdin\n- **puts** - prints a string to stdout\n\
    - **putc** - prints a character to stdout\n- **getc, getchar** - reads a character\
    \ from stdin\n\nThe advantage of stdin and stdout is that they are easy to use.\
    \ Likewise, the ability to redirect I/O is very powerful. For example, maybe you\
    \ want to create a program that reads from stdin and counts the number of characters:\n\
    \n```c\n#include <stdio.h>\n#include <string.h>\n\nint main(void)\n{\n    char\
    \ s[1000];\n    int count = 0;\n    while (gets(s)) {\n        count += strlen(s);\n\
    \    }\n    printf(\"%d\\n\",count);\n    return 0;\n}\n```\n\nEnter this code\
    \ and run it. It waits for input from stdin, so type a few lines. When you are\
    \ done, press CTRL-D to signal end-of-file (eof). The gets function reads a line\
    \ until it detects eof, then returns a 0 so that the while loop ends. When you\
    \ press CTRL-D, you see a count of the number of characters in stdout (the screen).\
    \ (Use man gets or your compiler's documentation to learn more about the gets\
    \ function.)\n\nNow, suppose you want to count the characters in a file. If you\
    \ compiled the program to execute an named xxx, you can type the following:\n\n\
    xxx < filename\n\nInstead of accepting input from the keyboard, the contents of\
    \ the file filename will be used instead. You can achieve the same result using\
    \ pipes:\n\ncat < filename | xxx\n\nYou can also redirect the output to the file:\n\
    \nxxx < filename > out\n\nThis command places the character count produced by\
    \ the program in a text file named out.\n\nSometimes, you need to use a text file\
    \ directly. For example, you might need to open a specific file and read from\
    \ or write to it. You might want to manage several streams of input or output\
    \ or create a program like a text editor that can save and recall data or configuration\
    \ files on command. In that case, use the text file functions in stdio:\n\n- **fopen**\
    \ - opens a file\n- **fclose** - closes a file\n- **feof** - detects end-of-file\
    \ marker\n- **fprintf** - prints formatted output to file\n- **fscanf** - reads\
    \ formatted input from file\n- **fputs** - prints a string to file\n- **fgets**\
    \ - reads a string from file\n- **putc** - prints a character to file\n- **getc**\
    \ - reads a character from file\n\n## Text files: opening\n\nTo open a file, use\
    \ fopen with mode. The most common are r, w, and a (for read, write, append).\
    \ It returns a pointer to the file, which is stored in the variable f. If the\
    \ fopen command fails, f will contain a NULL value. For example, you could use\
    \ the following code:\n\n```c\n#include <stdio.h>\n#define MAX 10\n\nint main(void)\n\
    {\n    FILE *f;\n    int x;\n```\n\n```c\nf = fopen(\"out\", \"w\");\nif (!f)\n\
    \    return 1;\nfor(x = 0; x < MAX; x++)\n    printf(\"%d\\n\",x);\nclose(f);\n\
    return 0;\n```\n\n## Text files: reading\n\nTo read a file, open it with r mode.\
    \ In general, it is not a good idea to use fscanf for reading: Unless the file\
    \ is perfectly formatted. Instead, use fgets to read in each line and then parse\
    \ the pieces you need. The following code demonstrates the process of reading\
    \ a file and dumping its contents to the screen:\n\n```c\n#include <stdio.h>\n\
    \nint main(void)\n{\n    FILE *f;\n    char s[1000];\n```\n\n```c\nf = fopen(\"\
    infile\",\"r\");\nif (!f)\n    return 1;\nwhile (fgets(s,1000,f) != NULL)\n  \
    \  printf(\"%s\", s);\nclose(f);\nreturn 0;\n```\n\nfgets statement returns a\
    \ NULL value at the end-of-file marker. It reads a line (up to 1,000 characters\
    \ in this case) and prints it to stdout. Notice that the printf statement does\
    \ not include \\n in the format string, because fgets includes \\n to the end\
    \ of each line it reads. Thus, you can tell if a line is not complete in the event\
    \ that it overflows the maximum length specified in the second parameter to fgets.\n\
    \n## Main function return values\n\nThis program is the first program in this\
    \ series that returns an error value from the main function. If the fopen command\
    \ fails, f will contain a NULL value (zero). We test for error with the if statement.\
    \ If the statement looks at the True/False value of the variable f. Remember that\
    \ in C, 0 is False and anything else is true. So if there was an error opening\
    \ the file, f would contain zero, which is False. The ! is the NOT operator. It\
    \ inverts a Boolean value. So if the statement could have been written like this:\n\
    \n```c\nif ( f == 0)\n```\n\nThat is equivalent. However, if (!f) is more common.\
    \ If there is a file error, we return a 1 from the main function. In Linux, you\
    \ can actually test for this value on the command line. See the shell documentation\
    \ for details.\n"
