    \ can return values of any type: int, float, etc. There are several correct ways\
    \ to call rand. For example: x=rand(); The variable x is assigned the value returned\
    \ by rand in this statement. Note that you use () in the function call, though\
    \ no parameter is passed. Otherwise, x is given the memory address of the function,\
    \ which is generally not what you intended.\n\nYou might also call rand this way:\n\
    \n```c\nif (rand () > 100)\n```\n\nOr this way:\n\n```c\nrand ();\n```\n\nIn the\
    \ latter case, the function is called but the value returned by rand is discarded.\
