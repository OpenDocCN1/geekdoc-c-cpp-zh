    \n# 第 5 章\n\n## 变量类型\n\nC 语言中有三种标准的变量类型：\n\n- 整数：int\n- 浮点数：float\n- 字符：char\n\
    \n`int` 是一个 4 字节的整数值。`float` 是一个 4 字节的浮点值。`char` 是一个 1 字节的单个字符（如“a”或“3”）。字符串被声明为字符数组。\n\
    \n有许多派生类型：\n\n- double（8 字节浮点值）\n- short（2 字节整数）\n- unsigned short 或 unsigned\
    \ int（正整数，无符号位）\n\n## 类型转换\n\nC 语言允许你随时进行类型转换。当你使用指针时，经常会这样做。在某些类型的赋值操作期间，也会发生类型转换。例如，在上面的代码中，整数值被自动转换为浮点数。\n\
    \n在 C 语言中进行类型转换的方法是将类型名放在括号中，并放在你想要更改的值前面。因此，在上面的代码中，将 `a = 10/3;` 替换为 `a = (float)10/3;`\
    \ 会产生结果 3.33333，因为 10 在除法之前被转换为浮点值。\n\n# Typedef\n\n你使用 `typedef` 语句在 C 语言中声明命名的、自定义类型。以下示例显示了\
    \ C 代码中经常出现的类型：\n\n```c\n#define TRUE 1\n#define FALSE 0\ntypedef int boolean;\n\
    \nint main(void){\n    boolean b;\n\n    b = FALSE;\n    blah blah blah\n}\n```\n\
    \n这段代码允许你在 C 程序中声明布尔类型。\n如果你不喜欢用 \"float\" 一词表示实数，可以这样说：\n\n```c\ntypedef float\
    \ real;\n```\n\n然后稍后说：\n\n```c\nreal r1,r2,r3;\n```\n\n你可以将 `typedef` 语句放在 C 程序的任何地方，只要它们在代码中第一次使用之前即可。\n\
    \n# 第 6 章\n\n## 运算符\n\nC 语言中的运算符与大多数语言中的运算符相似：\n\n- + 加法\n- - 减法\n- / 除法\n- *\
