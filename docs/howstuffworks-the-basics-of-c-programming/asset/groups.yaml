- md: "\n# CHAPTER 14. STRINGS\n\n(gets, puts, and so on) are implemented in <stdio.h>,\
    \ and a set of fairly simple string manipulation functions are implemented in\
    \ <string.h> (on some systems, <strings.h>).\n\nThe fact that strings are not\
    \ native to C forces you to create some fairly roundabout code. For example, suppose\
    \ you want to assign one string to another string; that is, you want to copy the\
    \ contents of one string to another. In C you cannot simply assign one array to\
    \ another. You have to copy it by element. The string library (<string.h or <strings.h>)\
    \ contains a function called strcpy for this task. Here is an extremely common\
    \ piece of code to find in a normal C program:\n\n```c\nchar s[100];\nstrcpy(s,\
    \ \"hello\");\n```\n\nThe following code shows how to use strcpy in C:\n\n```c\n\
    #include <string.h>\nint main(void) {\n    char s1[100],s2[100];\n    strcpy(s1,\
    \ \"hello\"); /* copy \"hello\" into s1 */\n    strcpy(s2,s1);               /*\
    \ copy s1 into s2 */\n    return 0;\n}\n```\n\nstrcpy is used whenever a string\
    \ is initialized in C. You use the strcmp function in the string library to compare\
    \ two strings. It returns an integer that indicates the result of the comparison.\
    \ Zero means the two strings are equal, a negative value means s1 is less than\
    \ s2, and a positive value means s1 is greater than s2.\n\n```c\n#include <stdio.h>\n\
    #include <string.h>\nint main(void) {\n    char s1[100],s2[100];\n    gets(s1);\n\
    \    gets(s2);\n    if (strcmp(s1,s2) == 0) {\n        printf(\"equals\\n\");\n\
    \    } else if (strcmp(s1,s2) < 0) {\n        printf(\"%s less than %s\\n\", s1,\
    \ s2);\n    } else {\n        printf(\"%s greater than %s\\n\", s1, s2);\n   \
    \ }\n    return 0;\n}\n```\n\nOther common functions in the string library include\
    \ **strlen**, which returns the length of a string, and **strcat** concatenates\
    \ two strings. The string library contains a number of other functions, which\
    \ you can peruse by reading the manual page.\n\nTo get started building string\
    \ functions, and to help you understand other programmers' code (everyone has\
    \ his or her own set of string functions for special purposes in a program), we\
    \ will look at two examples, **strlen** and **strpy**. Following is a strictly\
    \ Pascal-like version of **strlen**:\n\n```c\nint strlen(char s[]) {\n    int\
    \ x;\n    x=0;\n    while (s[x] != '\\0') {\n        x=x+1;\n    }\n    return(x);\n\
    }\n```\n\nMost C programmers shun this approach because it seems inefficient.\
    \ Instead, they often use a pointer-based approach:\n\n```c\nint strlen(char *s)\
    \ {\n    int x=0;\n    while (*s != '\\0') {\n        x++;\n        s++;\n   \
    \ }\n    return(x);\n}\n```\n\nYou can abbreviate this code to the following:\n\
    \n```c\nint strlen(char *s)\n  int x=0;\n  while (*s++)\n    x++;\n  return (x);\n\
    ```\n\nI imagine a true Expert could make this code even shorter.\nWhen I compile\
    \ three pieces of code with gcc, using no optimization, and run each 20,000 times\
    \ on a 120-character string, the first piece of code yields a time of 12.3 seconds,\
    \ the second 12.3 seconds, and the third 12.9 seconds. What does this mean? To\
    \ me, it means that you should write the code in whatever way is easiest for you\
    \ to understand. Pointers generally yield faster code, but the strlen code above\
    \ shows that is not always the case.\n\nWe can go with the same evolution with\
    \ strcpy(char s1[], char s2[]):\n\n```c\nint x;\nfor (x = 0; x <= strlen(s2);\
    \ x++)\n  s1[x] = s2[x];\n```\n\nNote that <= is incorrect in the for loop because\
    \ the code then copies the '\\0'. Major bugs occur later on if you leave it out,\
    \ the string has no end and therefore an unknown length. Note also that this code\
    \ is very inefficient, because strlen gets called every time the for loop. To\
    \ solve this problem, you could use the following code:\n\n```c\nvoid strcpy(char\
    \ s1[], char s2[]) {\n    int x, len;\n    len = strlen(s2);\n    for (x = 0;\
    \ x <= len; x++)\n      s1[x] = s2[x];\n}\n```\n\nThe pointer version is similar.\n\
    \n```c\nstrcpy (char *s1, char *s2)\n{\n    while (*s2 != '\\0')\n    {\n    \
    \    *s1 = *s2;\n        s1++;\n        s2++;\n    }\n}\n```\n\nYou can compress\
    \ this code further:\n\n```c\nstrcpy (char *s1, char *s2)\n{\n    while (*s2)\n\
    \        *s1++ = *s2++;\n}\n```\n\nIf you wish, you can even see while (*s1++\
    \ = *s2++); The first version of strcpy takes 415 seconds to copy a 120-character\
    \ string.\n"
  mdcn: "\n\n# 第 14 章 字符串\n\n(gets, puts 等) 实现在 <stdio.h> 中，而一组相当简单的字符串处理函数实现在 <string.h>\
    \ 中（在某些系统上为 <strings.h>）。\n\n字符串不是 C 语言的原生类型这一事实迫使你编写一些相当迂的代码。例如，假设你想将一个字符串赋值给另一个字符串；也就是说，你想将一个字符串的内容拷贝到另一个字符串。在\
    \ C 中，你不能简单地将一个数组赋值另一个数组。你必须按元素进行拷贝。字符串库（<string.h> 或 <strings.h>）包含一个名为 `strcpy`\
    \ 的函数用于此任务。以下是一个在普通 C 程序中非常常见的代码：\n\n```c\nchar s[100];\nstrcpy(s, \"hello\");\n\
    ```\n\n以下代码展示了如何在 C 中使用 `strcpy`：\n\n```c\n#include <string.h>\nint main(void)\
    \ {\n    char s1[100],s2[100];\n    strcpy(s1, \"hello\"); /* 将 \"hello\" 拷贝到\
    \ s1 */\n    strcpy(s2,s1);               /* 将 s1 拷贝到 s2 */\n    return 0;\n}\n\
    ```\n\n在 C 中每初始化字符串时都会使用 `strcpy`。你使用字符串库中的 `strcmp` 函数来比较两个字符串。它返回一个整数，表示比较的结果。零表示两个字符串相等，负值表示\
    \ s1 小于 s2，正值表示 s1 大于 s2。\n\n```c\n#include <stdio.h>\n#include <string.h>\nint\
    \ main(void) {\n    char s1[100],s2[100];\n    gets(s1);\n    gets(s2);\n    if\
    \ (strcmp(s1,s2) == 0) {\n        printf(\"equals\\n\");\n    } else if (strcmp(s1,s2)\
    \ < 0) {\n        printf(\"%s less than %s\\n\", s1, s2);\n    } else {\n    \
    \    printf(\"%s greater than %s\\n\", s1, s2);\n    }\n    return 0;\n}\n```\n\
    \n字符串库中的其他常用函数包括返回字符串长度的 **strlen**，以及连接两个字符串的 **strcat**。字符串库还包含许多其他函数，你可以通过阅读手册页来了解。\n\
    \n为了开始构建字符串函数，并帮助你理解其他程序员的代码（每个人为了程序中的特殊目的都有自己的一套字符串函数），我们将查看两个例子，**strlen** 和\
    \ **strcpy**。以下是一个严格类 Pascal 风格的 **strlen** 版本：\n\n```c\nint strlen(char s[])\
    \ {\n    int x;\n    x=0;\n    while (s[x] != '\\0') {\n        x=x+1;\n    }\n\
    \    return(x);\n}\n```\n\n大多数 C 程序员都避开这种方法，因为它看起来效率低下。相反，他们通常使用基于指针的方法：\n\n```c\n\
    int strlen(char *s) {\n    int x=0;\n    while (*s != '\\0') {\n        x++;\n\
    \        s++;\n    }\n    return(x);\n}\n```\n\n你可以将这段代码缩写为以下形式：\n\n```c\nint\
    \ strlen(char *s)\n  int x=0;\n  while (*s++)\n    x++;\n  return (x);\n```\n\n\
    我设真正的专家可以将这段代码写得更短。\n当我用 gcc 编译这三段代码（不使用优化），并在 120 个字符的字符串上各运行 20,000 次时，第一段代码耗时\
    \ 12.3 秒，第二段为 12.3 秒，第三段为 12.9 秒。这意味着什么？对我来说，这意味着你应该用你最容易理解的方式编写代码。指针通常会产生更快的代码，但上面的\
    \ strlen 代码表明情况并非总是如此。\n\n我们可以对 `strcpy(char s1[], char s2[])` 经历同样的演进过程：\n\n\
    ```c\nint x;\nfor (x = 0; x <= strlen(s2); x++)\n  s1[x] = s2[x];\n```\n\n注意，在\
    \ for 循环中使用 `<=` 是错误的，因为代码随后会拷贝 `\\0`。如果你漏掉了它，后续会出现严重的错误，字符串将没有结束符，因此长度未知。同样注意，这段代码效率非常低，因为\
    \ for 循环每次都会调用一次 `strlen`。要解决这个问题，你可以使用以下代码：\n\n```c\nvoid strcpy(char s1[], char\
    \ s2[]) {\n    int x, len;\n    len = strlen(s2);\n    for (x = 0; x <= len; x++)\n\
    \      s1[x] = s2[x];\n}\n```\n\n指针版本也是类似的。\n\n```c\nstrcpy (char *s1, char *s2)\n\
    {\n    while (*s2 != '\\0')\n    {\n        *s1 = *s2;\n        s1++;\n      \
    \  s2++;\n    }\n}\n```\n\n你可以进一步压缩这段代码：\n\n```c\nstrcpy (char *s1, char *s2)\n\
    {\n    while (*s2)\n        *s1++ = *s2++;\n}\n```\n\n如果你愿意，甚至可以看到 `while (*s1++\
    \ = *s2++);`。第一个版本的 `strcpy` 拷贝 120 个字符的字符串需要 415 秒。\n\n"
