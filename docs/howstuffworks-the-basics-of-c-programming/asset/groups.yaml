    # WHAT IS C?


    # CHAPTER 1. C PROGRAMMING


    # What is C?


    C is a computer programming language. That means that you can use C to create
    lists of instructions for a computer to follow. C is one of thousands of programming
    languages currently in use. C has been around for several decades and has widespread
    acceptance because it gives programmers maximum control and efficiency. C is an
    easy language to learn. It is a bit more cryptic in its style than some other
    languages, but you get beyond fairly quickly.


    C is what is called a compiled language. This means that once you write your program,
    you must run it through a C compiler to turn your program into an executable that
    the computer can run (execute). The C program is the human-readable form, while
    the executable that comes out of the compiler is the machine-readable and executable
    format. This means that to write and run a C program, you must have access to
    a C compiler.


    We will start at the beginning with an extremely simple C program and build up
    from there. I will assume that you are using the Linux command line and gcc as
    your environment for these examples; if you are not, all of the code will still
    work fine — you will simply need to understand and use whatever compiler you have
    available.


    # The simplest C program, I


    Let''s start with the simplest possible C program and use it both to understand
    the basics of C and the compilation process. Type the following program into a
    standard text editor. Save the program to a file named samp.c. If you leave .c,
    you will probably get some sort of error when you compile it, so make sure you
    remember the .c. Also, make sure that your editor does not automatically append
    some extra characters (such as .txt) to the name of the file. Here''s the first
    program:


    ```

    #include <stdio.h>


    int main(void)

    {}

    ```'
