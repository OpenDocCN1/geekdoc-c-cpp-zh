    \ |\n| i = i * j; | i *= j; |\n\n# Programming exercise\n\n- Try different pieces\
    \ of code to investigate typecasting and precedence.\n- Try out int, float, and\
    \ so on.\n- Create an array of records and write some code to sort that array\
    \ on one field.\n\n# Chapter 7\n\n## Functions\n\nMany languages allow you to\
