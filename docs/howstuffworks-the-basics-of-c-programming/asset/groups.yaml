    \ 章\n## 命令行参数\n\nC 语言了一种非常简单的机制来获取用户输入的命令行参数。它会将一个 `argv` 参数传递给程序的 `main` 函数。`argv`\
    \ 结构体出现在许多高级库函数调用中，因此理解它们对任何 C 语言程序员都是有用的。\n\n输入以下代码并编译：\n\n```c\n#include <stdio.h>\n\
    \nint main(int argc, char *argv[])\n{\n    printf(\"%d\\n\",argc);\n    for (x\
    \ = 0; x < argc; x++)\n        printf(\"%s\\n\", argv[x]);\n    return 0;\n}\n\
    ```\n\n在这段代码中，主程序接受两个参数：`argv` 和 `argc`。`argv` 参数是一个指向字符串的指针数组，包含了程序在 UNIX 命令行调用时输入的参数。`argc`\
    \ 整数包含参数数量的计数。这段特定的代码会打印出命令行参数。要尝试尝试，请将代码编译为一个名为 `aaa xxx yyy zzz` 的可执行文件。该代码将打印出命令行参数\
    \ `xxx`、`yyy` 和 `zzz`，每行一个。\n\n`char *argv[]` 是一个指向字符串的指针数组。换句话说，数组的每个元素都是一个指针，每个指针指向一个字符串（技术上指向字符串的第一个字符）。因此，`argv[0]`\
    \ 指向包含命令行上第一个参数（程序名称）的字符串，`argv[1]` 指向下一个参数，依此类推。`argc` 变量告诉你数组中有多少个指针是有效的。你会发现前面的代码仅仅是打印了\
    \ `argv` 指向的每个有效字符串。\n\n由于 `argv` 的存在，你可以相当容易让你的程序对用户输入的命令行参数做出反应。例如，你可能让程序检测程序名后的第一个参数为单词\
    \ `help`，并将帮助文件转储到 `stdout`。文件名也可以被传递并在你的 `fopen` 语句中使用。\n\n## 第 17 章\n## 文本文件\n\
    \nC 语言中的文本文件非常直观且易于理解。C 中所有的文本文件函数和类型都来自 **stdio** 库。\n\n当你在 C 程序中需要文本 I/O 时，且只需要一个输入信息源和一个输出信息汇时，你可以依靠\
    \ **stdin**（标准输入）和 **stdout**（标准输出）。你可以在命令行处使用输入和输出重定向来让不同的信息流通过程序。`<stdio.h>`\
    \ 中有六种不同的 I/O 命令可以与 `stdin` 和 `stdout` 使用：\n\n- **printf** - 将格式化输出打印到 stdout\n\
    - **scanf** - 从 stdin 读取格式化输入\n- **puts** - 将字符串打印到 stdout\n- **putc** - 将字符打印到\
    \ stdout\n- **getc, getchar** - 从 stdin 读取一个字符\n\n`stdin` 和 `stdout` 的优势是它们易于使用。同样，重定向\
    \ I/O 的能力非常强大。例如，你可能想创建一个程序从 stdin 读取并计算字符数：\n\n```c\n#include <stdio.h>\n#include\
    \ <string.h>\n\nint main(void)\n{\n    char s[1000];\n    int count = 0;\n   \
    \ while (gets(s)) {\n        count += strlen(s);\n    }\n    printf(\"%d\\n\"\
    ,count);\n    return 0;\n}\n```\n\n输入这段代码并运行。它会等待来自 stdin 的输入，所以输入几行。完成后，按下 CTRL-D\
    \ 信号文件结束 (eof)。`gets` 函数读取一行直到检测到 eof，然后返回 0 使得 `while` 循环结束。当你按下 CTRL-D 时，你会看到\
    \ stdout（屏幕）中字符数的计数。（使用 `man gets` 或你的编译器文档了解更多关于 `gets` 函数的信息。）\n\n现在，假设你想统计文件中的字符。如果你将程序编译为执行一个名为\
    \ `xxx` 的程序，你可以输入：\n\n```bash\nxxx < filename\n```\n\n与其接受键盘输入，不如使用文件 `filename`\
    \ 的内容。你可以使用管道来实现相同的结果：\n\n```bash\ncat < filename | xxx\n```\n\n你也可以将输出重定向到文件：\n\
    \n```bash\nxxx < filename > out\n```\n\n这条命令将程序产生的字符数放在名为 `out` 的文本文件中。\n\n有时，你想统计文件中的字符。如果你将程序编译为执行一个名为\
    \ `xxx` 的程序，你可以输入以下。在这种情况下，你可能需要使用 `stdio` 中的文件函数：\n\n- **fopen** - 打开文件\n- **fclose**\
    \ - 关闭文件\n- **feof** - 检测文件结束标记\n- **fprintf** - 将格式化输出到文件\n- **fscanf** - 从文件读取格式化输入\n\
    - **fputs** - 将字符串打印到文件\n- **fgets** - 从文件读取字符串\n- **fwrite** - 写入文件\n- **putc**\
    \ - 将字符写入文件\n- **getc** - 从文件读取一个字符\n\n在这种情况下，你可能需要使用 `fopen` 模式。最常用的有 `r`、`w`\
    \ 和 `a`（用于读、写、追加）。它返回一个指向文件的指针。如果 `fopen` 命令失败，`f` 将包含 NULL 值。例如，你可以使用以下代码：\n\n\
    ```c\n#include <stdio.h>\n#define MAX 10\n\nint main(void)\n{\n    FILE *f;\n\
    \    int x;\n```\n\n```c\nf = fopen(\"out\", \"w\");\nif (!f)\n    return 1;\n\
    for(x = 0; x < MAX; x++)\n    printf(\"%d\\n\",x);\nclose(f);\nreturn 0;\n```\n\
    \n## 文本文件：读取\n\n读取文件，使用 `r` 模式打开它。通常情况下，不要使用 `fscanf` 来读取：除非文件格式是完美的。相反，使用 `fgets`\
    \ 读取每一行并解析你需要的内容。以下代码演示了读取文件并将其内容到屏幕的过程：\n\n```c\n#include <stdio.h>\n\nint main(void)\n\
    {\n    FILE *f;\n    char s[1000];\n```\n\n```c\nf = fopen(\"infile\",\"r\");\n\
    if (!f)\n    return 1;\nwhile (fgets(s,1000,f) != NULL)\n    printf(\"%s\", s);\n\
    close(f);\nreturn 0;\n```\n\n`fgets` 语句在文件结束标记处返回 NULL 值。它读取一行（在本例中最多 1000 个字符）并将其打印到\
    \ stdout。注意 `printf` 语句格式字符串中没有包含 `\\n`，因为 `fgets` 在它读取的每行末尾包含了 `\\n`。因此，在溢出第二个参数指定的最大长度的情况下，你可以判断行是否不完整。\n\
    \n## main 函数返回值\n\n这个程序是该系列中第一个从 `main` 函数返回错误值的程序。如果 `fopen` 命令失败，`f` 将包含一个 NULL\
    \ 值（0）。我们用 `if` 语句检查错误。该语句查看变量 `f` 的真假值。记住在 C 语言中，0 是假，任何其他值都是真。所以如果打开文件发生错误，`f`\
    \ 将包含零，即为假。`!` 是取反运算符。它反转一个布尔值。所以语句可以写成这样：\n\n```c\nif ( f == 0)\n```\n\n这是等价的。然而，`(!f)`\
    \ 更常见。如果发生文件错误，我们从 `main` 函数返回 1。在 Linux 中，你实际上可以在命令行上测试此值。详情请参 shell 文档。\n\n"
