    \ programming language. That means that you can use C to create lists of instructions\
    \ for a computer to follow. C is one of thousands of programming languages currently\
    \ in use. C has been around for several decades and has widespread acceptance\
    \ because it gives programmers maximum control and efficiency. C is an easy language\
    \ to learn. It is a bit more cryptic in its style than some other languages, but\
    \ you get beyond fairly quickly.\n\nC is what is called a compiled language. This\
    \ means that once you write your program, you must run it through a C compiler\
    \ to turn your program into an executable that the computer can run (execute).\
    \ The C program is the human-readable form, while the executable that comes out\
    \ of the compiler is the machine-readable and executable format. This means that\
    \ to write and run a C program, you must have access to a C compiler.\n\nWe will\
    \ start at the beginning with an extremely simple C program and build up from\
    \ there. I will assume that you are using the Linux command line and gcc as your\
    \ environment for these examples; if you are not, all of the code will still work\
    \ fine — you will simply need to understand and use whatever compiler you have\
    \ available.\n\n## The simplest C program, I\n\nLet's start with the simplest\
    \ possible C program and use it both to understand the basics of C and the compilation\
    \ process. Type the following program into a standard text editor. Save the program\
    \ to a file named samp.c. If you leave .c, you will probably get some sort of\
    \ error when you compile it, so make sure you remember the .c. Also, make sure\
    \ that your editor does not automatically append some extra characters (such as\
    \ .txt) to the name of the file. Here's the first program:\n\n```c\n#include <stdio.h>\n\
    \nint main(void)\n{}\n```\n\n```c\nprintf(\"This is output from my first program!\\\
    n\");\nreturn 0;\n```\n\n### Spacing and indentation\n\nWhen you enter this program,\
    \ position #include so that the pound sign is in column (the far left side). Otherwise,\
    \ the spacing and indentation can be any way you like it. On some Linux systems,\
    \ you will find a program called indent, which will format code for you. The spacing\
    \ and indentation shown above is a good example to follow.\n\n### Compilation\
    \ and run\n\nWhen executed, this program instructs the computer to print out the\
    \ line “This is output from my first program!” – then the program quits. You can't\
    \ get much simpler than that!\n\nTo compile this code on a Linux machine, type\n\
    \n```bash\ngcc samp.c -o samp\n```\n\nThis line invokes the C compiler gcc, asks\
    \ it to compile samp.c and asks it to place the executable file it creates under\
    \ the name samp. To run the program, type\n\n```bash\n./samp\n```\n\nYou should\
    \ see the output “This is output from my first program!” when you run the program.\n\
    \nIf you mistype the program, it either will not compile or it will not run. If\
    \ the program does not compile or does not run correctly, edit it again and see\
    \ where you went wrong in your typing. Fix the error and try again.\n\n## THE\
    \ SIMPLEST C PROGRAM, II\n\nLet's walk through this program and start to see what\
    \ the different lines are doing:\n\n```c\n#include <stdio.h>\n\nint main(void)\n\
    {\n    printf(\"This is output from my first program!\\n\");\n    return 0;\n\
    }\n```\n\n- This C program starts with #include <stdio.h>. This line includes\
    \ the **standard input/output library** into your program. The standard I/O library\
    \ lets you read input from the keyboard (called \"standard in\").\n- The **int\
    \ main(void)** declares the main function. Every C program must have a function\
    \ **named main** somewhere in the code. We will learn more about functions shortly.\
    \ At run time, program execution starts at the first line of the main function.\n\
    - The **printf** statement in C allows you to send output (for us, the screen).\
    \ The portion in quotes is called the **format string** and describes how the\
    \ data is to be formatted when printed. The format string can contain string literals\
    \ as \"This is output from my first program!\", symbols for carriage returns (\\\
    n), and operators as placeholders for variables (see below).\n- The **return 0;**\
    \ line causes the function to return an error code of 0 (no error) to the shell\
    \ that started execution. More on this capability a bit later.\n\n## Variables\n\
    \nAs a programmer, you will frequently need to store and manipulate data. A variable\
