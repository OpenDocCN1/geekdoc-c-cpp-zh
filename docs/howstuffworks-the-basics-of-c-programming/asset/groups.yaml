    \ number of derivative types:\n\n- double (8-byte floating point value)\n- short\
    \ (2-byte integer)\n- unsigned short or unsigned int (positive integers, no sign\
    \ bit)\n\n## Typecasting\n\nC allows you to perform type conversions on the fly.\
    \ You do this especially often when using pointers. Typecasting also occurs during\
    \ the assignment operation for certain types. For example, in the code above,\
    \ the integer value was automatically converted to a float.\n\nYou do typecasting\
    \ in C by placing the type name in parentheses and putting it in front of the\
