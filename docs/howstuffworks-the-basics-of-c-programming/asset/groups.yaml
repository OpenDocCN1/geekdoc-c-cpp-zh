    \    a = 10/3;\n    printf(\"%f\\n\",a);\n    return 0;\n}\n```\n\nThis code prints\
    \ out a floating point value since a is declared as type float, but a will be\
    \ 3.0 because the code performed an integer division.\n\n# Operator precedence,\
    \ I\n\nOperator precedence in C is also similar to that in most other languages.\
    \ Division and multiplication occur first, then addition and subtraction. The\
    \ result of the calculation 5+3*4 is 17, not 32, because the * operator has higher\
    \ precedence than + in C. You can use parentheses to change the normal precedence\
