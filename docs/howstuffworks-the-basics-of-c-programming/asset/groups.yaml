    # # Chapter 18


    #  Binary Files


    Binary files are very similar to arrays of structures, except the structures are
    in a disk file faster rather than in an array in memory. Because the structures
    in a binary file are on disk, you can create very large collections of them (limited
    only by your available disk space). They are also permanent and always available.
    The only disadvantage is the slowness that comes from disk access time.


    Binary files have two features that distinguish them from text files:


    +   * You can jump instantly to any structure in the file, which provides random
    access as in an array.

    * You can change the contents of a structure anywhere in the file at any time.


    Binary files also have faster read and write times than text files, because a
    binary image of the record is stored directly from memory to disk (or vice versa).
    In a text file, everything has to be converted back and forth to text, and this
    takes time.


    C supports the file-of-structures concept very cleanly. Once you open the file
    you can read a structure, write a structure, or seek to any structure in the file.
    This file concept supports the concept of a **file pointer**. When the file is
    opened, the pointer points to record 0 (the first record in the file). Any **read
    operation** reads the currently pointed-to structure and moves the pointer down
    one structure. Any **write operation** writes to the currently pointed-to structure
    and moves the pointer down one structure. **Seek** moves the pointer to the requested
    record.'
