  - '[PAGE 5]


    # Chapter 1


    # Basics of C programming


    The C programming language is a popular and widely used programming language for
    creating computer programs. Programmers embrace C because it gives maximum control
    and efficiency to the programmer.


    If you are a programmer, or if you are interested in becoming a programmer, there
    are a couple of benefits you gain from learning C:


    +   - You will be able to read and write code for a large number of platforms
    – everything from microcontrollers to the most advanced scientific systems can
    be written in C.


    +   - Because of the performance and portability of C, almost all popular cross-platform
    programming languages and scripting languages, such as C++, Java, Python, Objective-C,
    Perl, Ruby, PHP, Lua, and Bash, are implemented in C and borrowed syntaxes and
    functions heavily from C. They share the similar operators, expressions, repetitions
    statements, control structures, arrays, input and output, and functions. Furthermore,
    almost all languages can interface with C and C++ to take advantage of a large
    volume of existing C/C++ libraries.


    In this article, we will walk through the entire language and show you how to
    become a C programmer, starting at the beginning.'
