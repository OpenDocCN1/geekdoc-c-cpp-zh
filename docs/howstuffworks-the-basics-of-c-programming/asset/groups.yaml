  mdcn: "\n\n# 什么是 C？\n\n## 第一章 C 语言编程\n\n## 什么是 C？\n\nC 是一种计算机编程语言。这意味着你可以使用 C 为计算机创建一组供其遵循的指令。C\
    \ 是目前使用的数千种编程语言之一。C 已经存在了几十年，并被广泛接受，因为它为程序员提供了最大的控制和效率。C 是一门容易学习的语言。它的风格比其他某些语言稍微晦涩一点，但你很快就能掌握。\n\
    \nC 是一种所谓的编译型语言。这意味着一旦你写好了程序，就必须通过 C 编译器运行它，将你的程序转换为计算机可以运行（执行）的可执行文件。C 程序是人类可读的形式，而编译器输出的可执行文件是机器可读可执行的格式。这意味着要编写和运行\
    \ C 程序，你必须拥有 C 编译器。\n\n我们将从头开始，从一个极其简单的 C 程序开始，并在此基础上构建。我假设你使用 Linux 命令行并将 `gcc`\
    \ 作为这些示例的环境；如果你不是这样，所有的代码仍然可以正常工作——你只需要理解并使用你所拥有的任何编译器即可。\n\n## 最简单的 C 程序、I\n\n\
    让我们从最简单的 C 程序开始，并用它来同时理解 C 的基础和编译过程。将以下程序输入标准文本编辑器中。将程序保存为名为 `samp.c` 的文件。如果你漏掉了\
    \ `.c`，在编译时可能会遇到某种错误，所以请记住加上 `.c`。另外，确保你的编辑器不会在文件名后自动添加一些额外的字符（如 `.txt`）。这是第一个程序：\n\
    \n```c\n#include <stdio.h>\n\nint main(void)\n{}\n```\n\n```c\nprintf(\"This is\
    \ output from my first program!\\n\");\nreturn 0;\n```\n\n### 空格和缩进\n\n当你输入此程序时，将\
    \ `#include` 的位置放置使得 `#` 号位于列（最左侧）。否则，空格和缩进可以随你喜欢的任何方式。在某些 Linux 系统上，你会找到一个名为\
    \ `indent` 的程序，它可以为你格式化代码。上面显示的空格和缩进是一个很好的遵循范例。\n\n### 编译与运行\n\n执行时，该程序指示计算机打印出行“This\
    \ is output from my first program!”然后程序退出。没有比这更简单的了！\n\n在 Linux 机器上编译这段代码，输入\n\
    \n```bash\ngcc samp.c -o samp\n```\n\n这一行调用了 C 编译器 `gcc`，要求它编译 `samp.c` 并要求它将创建的可执行文件命名为\
    \ `samp`。要运行程序，输入\n\n```bash\n./samp\n```\n\n运行程序时，你应该看到输出“This is output from\
    \ my first program!”。\n\n如果你拼写错了程序，它要么无法编译，要么无法运行。如果程序没有编译或运行不正确，再次编辑它并查看你在输入时哪里出错了。修复错误并重试。\n\
    \n## 最简单的 C 程序、II\n\n让我们过一遍这个程序，开始看到不同的行在执行什么：\n\n```c\n#include <stdio.h>\n\n\
    int main(void)\n{\n    printf(\"This is output from my first program!\\n\");\n\
    \    return 0;\n}\n```\n\n- 这个 C 程序以 `#include <stdio.h>` 开头。这一行将**标准输入输出库**包含到你的程序中。标准\
    \ I/O 库允许从键盘读取输入（称为“标准输入”）。\n- **int main(void)** 声明了主函数。每个 C 程序在代码的某处都必须有一个**命名为\
    \ main** 的函数。我们很快会学习更多关于函数的知识。在运行时，程序执行从 main 函数的第一行开始。\n- C语言中的 **printf** 语句允许你发送输出（对我们来说就是屏幕）。引号中的部分被称为**格式字符串**，它描述了打印时如何格式化数据。格式字符串可以包含字符串面字量（如\
    \ \"This is output from my first program!\"）、换行符（\\n）以及作为变量占位符的运算符（见下文）。\n- **return\
    \ 0;** 行导致函数向启动执行的 shell 返回一个错误代码 0（表示无错误）。稍稍后会详细介绍这种能力。\n\n## 变量\n\n作为一名程序员，你经常需要存储和处理数据。变量是内存中一个命名的位置，可以存储值。要使用变量，你必须首先通过指定其类型和名称来声明它。\n\
