    \n`int rand_seed=10` 行也声明了一个全局变量，这次名为 **rand_seed**，它在每次程序启动时都初始化为 10。这个值是后续随机数代码的起始种子。在真正的随机数生成器中，种子应该初始化为一个随机值，例如系统时间。在这里，`rand`\
