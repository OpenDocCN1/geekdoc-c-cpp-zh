    # # Chapter 11


    # # Pointers


    Pointers are used everywhere in C, so if you want to use the C language fully
    you have to have a very good understanding of pointers. They have to become comfortable
    for you. The goal of this section and the next several that follow is to help
    you build a complete understanding of pointers and how C uses them. For most people
    it takes a little time and some practice to become fully comfortable with pointers,
    but once you master them you are a full-fledged C programmer.


    C uses pointers in three different ways:


    +   - C uses pointers to create dynamic data structures – data structures built
    up from blocks of memory allocated from the heap at run-time.

    - C uses pointers to handle variable parameters passed to functions.

    - Pointers in C provide an alternative way to access information stored in arrays.
    Pointer techniques are especially valuable when you work with strings. There is
    an intimate link between arrays and pointers in C.


    In some cases, C programmers also use pointers because they make the code slightly
    more efficient. What you will find is that, once you are completely comfortable
    with pointers, you tend to use them all the time.


    We will start this discussion with a basic introduction to pointers and the concepts
    surrounding pointers, and then move on to the three techniques described above.
    Especially on this article, you will want to read things twice. The first time
    through'
  - '[PAGE 58]


    POINTERS: WHY?


    you can learn all the concepts. The second through you can work on binding the
    concepts together into an integrated whole in your mind. After you make your way
    through the material the second time, it will make a lot of sense.


    # Pointers: why?


    Imagine you would like to create a text editor – a program that lets you edit
    normal ASCII text files, like “vim” on UNIX or “Notepad” on Windows. A text editor
    is a fairly common thing for someone to create because, if you think about it,
    a text editor is probably a programmer’s most commonly used piece of software.
    The text editor is a programmer’s intimate link to the computer – it is where
    you enter all of your thoughts and manipulate them. Obviously, anything you use
    often and work with closely, you want it to be right. There many programmers create
    their own editors and customize them to suit their individual working styles and
    preferences.


    One day you sit down to begin working on your editor. After thinking about the
    features you use, you begin thinking about the “data structure” for your editor.
    That is, you begin thinking about how you will store the document you are editing
    in memory so that you can manipulate it in your program. What you need is a way
    to store the information you are entering in a form that can be manipulated quickly
    and easily. You believe that one way to do that is to organize the data on the
    basis of lines of characters. Given what we have discussed so far, the only thing
    you have at your disposal at this point is an array. You think, “Well, a typical
    line is 80 characters long, and a typical file is no more than 1,000 lines.” You
    therefore declare a two-dimensional array, like this:


    ```

    char doc[1000][80];

    ```


    This declaration requests an array of 1,000 80-character lines. This array has
    a total size of 80,000 characters.


    As you think about your editor and data structure some more, however, you might
    realize three things:


    +   - Some documents are long lists. Every line is short, but there are thousands
    of lines.'
  - '[PAGE 59]


    # CHAPTER 11. POINTERS


    +   - Some special-purpose text files have very long lines. For example, a certain
    data file might have lines containing 542 characters, with each character representing
    the amino acid pairs in segments of DNA.


    +   - In modern editors, you can open multiple files at once, one at a time.


    Let''s say you set a maximum of 10 open files at once, a maximum line length of
    1,000 characters and a maximum file size of 50,000 lines. Your declaration now
    looks like this:


    ```

    char doc[50000][1000][10];

    ```


    That doesn''t seem like unreasonable thing, until you pull out your calculator,
    multiply 50,000 by 1000 by 10 and realize the array can contain 500 million characters!
    Most computers today are going to have a problem with an array that size. They
    simply do not have the RAM, or even the virtual memory space, to support an array
    that large. If users were to run three or four copies of this program simultaneously
    on the largest multi-user system, it would put a severe strain on the facilities.


    Even if the computer would accept a request for such a large array, you can see
    that it is an extravagant waste of space. It seems strange to declare a 500 million
    character array when, in the vast majority of cases, you will run this editor
    to look at 100 line files that consume at most 4,000 or 5,000 bytes. The problem
    with an array is that you have to declare it has its maximum dimension from the
    beginning. Those maximum sizes often multiply to form very large numbers. Also,
    if you happen to be able to edit an old file with a 2,000 character line in it,
    there is really no way for you to predict and handle the maximum line length of
    a text file, technically, that number is infinite.


    Pointers are designed to solve this problem. With pointers, you can create dynamic
    data structures. Instead of declaring your worst-case memory consumption upfront
    in an array, you can allocate memory from the heap while the program is running.
    That way you can use the exact amount of memory a document needs, with no waste.
    In addition, when you close a document you can return the memory to the heap so
    that other parts of the program can use it. With pointers, memory can be recycled
    while the program is running.'
- md: "\n# Pointer Basics\n\nTo understand pointers, it helps to compare them to normal\
    \ variables.\n\nA \"normal variable\" is a location in memory that can hold a\
    \ value. For example, when you declare a variable i as an integer, four bytes\
    \ of memory are set aside for it. In your program, you refer to that location\
    \ in memory by the name i. At the machine level, a location has a memory address.\
    \ The four bytes at that address are known to you, the programmer, as i, and the\
    \ four bytes can hold one integer value.\n\nA pointer is a variable that points\
    \ to another variable. This means that a pointer holds the memory address of another\
    \ variable. Another way, the pointer does not hold a value in the traditional\
    \ sense; instead, it holds the address of another variable. A pointer \"points\
    \ to\" that other variable by holding a copy of its address.\n\nBecause a pointer\
    \ holds an address rather than a value, it has two parts. The pointer itself holds\
    \ the address. That address points to a value. There is the pointer and the variable\
    \ pointed to. This fact can be a little confusing until you get comfortable with\
    \ it, but becomes extremely powerful.\n\nThe following example code shows a typical\
    \ pointer:\n\n```c\n#include <stdio.h>\n\nint main(void) {\n    int i, j;\n  \
    \  int *p; /* a pointer to an integer */\n    p = &i;\n    *p = 5;\n    j = i;\n\
    \    printf(\"%d %d\\n\", i, j, *p);\n    return 0;\n}\n```\n\nThe first declaration\
    \ in this program declares two normal integer variables named i and j. The line\
    \ `int *p` declares a pointer named p. This line asks the compiler to\n\n## CHAPTER\
    \ 11. POINTERS\n\n## POINTERS: RAM ADDRESSES\n\ndeclare a variable p that is a\
    \ pointer to an integer. The * indicates that a pointer is being declared rather\
    \ than a normal variable. You can create a pointer to anything: float, a structure,\
    \ a char, and so on. Just use a * to indicate that you want a pointer rather than\
    \ a normal variable.\n\nThe line `p = &i;` will definitely be to you. In C, &\
    \ is called the address operator. The expression `&i` means, \"The memory address\
    \ of variable i.\" Thus, the expression `p = &i` means, \"Assign p to the address\
    \ of i.\" Once you execute this statement, p \"points to i.\" p contains a random,\
    \ unknown address, and its will likely cause a segmentation fault or similar program\
    \ crash.\n\nIn the program above variables i, j and p have been declared, but\
    \ none of the three have been initialized. Once p points to i, the memory location\
    \ has two names. It is still known as i, but now it is known as p as well. This\
    \ is how C talks about the two parts of a pointer variable: p is the location\
    \ holding the address, and *p is the location pointed to by that address. Therefore\
    \ `*p=5` means the location pointed to by p should be set to 5. The location *p\
    \ is also i, i also takes the value of 5. Consequently, `j = i` sets j to 5, and\
    \ the printf produces 5 5 5.\n\nThe main feature of a pointer is its two-part\
    \ nature. The pointer itself holds an address to a value of a specific type -\
    \ the value at the address it holds. The pointer itself, in this case, is p. The\
    \ value pointed to is *p.\n\n## Pointers: Understanding Memory Addresses\n\nThe\
    \ previous discussion becomes a little clearer if you understand how memory works\
    \ in a computer's hardware. All computers have memory, also known as RAM (Random\
    \ Access Memory). For example, your computer might have 16 or 32 megabytes of\
    \ RAM installed for the programs that your computer is currently running along\
    \ with the data they are manipulating (their variables and data structures). Memory\
    \ can be thought of simply as an array of bytes. In this array, every memory location\
    \ has its own address – the address of the first byte is 0, followed by 1, 2,\
    \ 3, and so on. Memory addresses act just like the indexes of a normal array.\
    \ The computer can access any address in memory at any time (hence the name \"\
    random access memory\").\n\n## POINTERS: RAM ADDRESSES CHAPTER 11. POINTERS\n\n\
    It can also group bytes together as it needs to form larger variables, arrays,\
    \ and structures. For example, a floating point variable consumes 4 contiguous\
    \ bytes in memory. You might make the following global declaration in a program:\n\
    \n```c\nfloat f;\n```\n\nThis statement says, \"Declare a location named f that\
    \ can hold one floating point value.\" When the program runs, the computer reserves\
    \ space for the variable f somewhere in memory. That location has a fixed address\
    \ in the memory space. The variable f consumes four bytes of RAM in memory.\n\n\
    While you think of the variable f, the computer thinks of a specific address in\
    \ memory (for example, 248,440). Therefore, when you create a statement like this:\n\
    \n```c\nf = 3.14;\n```\n\nThe compiler might translate that into, \"Load the value\
    \ 3.14 into memory location 248,440.\" The computer is always thinking of memory\
    \ in terms of addresses and values at those addresses.\n\nThere are, by the way,\
    \ several interesting side effects to the way your computer treats memory. For\
    \ example, say that you include the following code in one of your programs:\n\n\
    ```c\nint i, s[4], t[4], u = 0;\nfor (i = 0; i <= 4; i++)\n{\n    s[i] = i;\n\
    \    t[i] = i;\n}\nprintf(\"s\\t\\n\");\nfor (i = 0; i <= 4; i++\n```\n\nThe output\
    \ of the program will look like this:\n\n| s | t |\n|---|---|\n| 0 | 0 |\n| 1\
    \ | 1 |\n| 2 | 2 |\n| 3 | 3 |\n| 4 | 4 |\n\n"
