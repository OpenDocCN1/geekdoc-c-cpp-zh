    \ produces an random number\n * between 0 and 32767.\n */\nrand_seed = rand_seed\
    \ + 11031245;\nreturn (unsigned int)(rand_seed / 65536) % 32768;\n```\n\nThe rand()\
    \ line declares the function to the rest of the program and specifies that rand\
    \ will accept no parameters has no local variables, but if needed they would go\
    \ right below the opening { they exist until the program reaches the matching\
    \ } and then disappear. A function's local variables vanish as soon as the matching\
    \ } is reached. While they exist, local variables live on the stack. Note that\
    \ there is no ; after the () in the first line. If you accidentally put one in\
    \ you will get a cascade of error messages from the compiler that makes no sense.\
    \ Also note that even though there are no parameters you must use (). They tell\
    \ the compiler that you are declaring a function rather than simply declaring\
    \ an int. The return statement is important to any function that returns a result.\
    \ It specifies the value that the function will return and causes the function\
