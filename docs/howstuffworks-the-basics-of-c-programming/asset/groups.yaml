    \    int j, k;\n\n    j = 1;\n    for (k = 2; k <= i; k++) {\n        j = j*k;\n\
    \    }\n    return j;\n}\n```\n\nreturns the factorial of i, which is passed in\
    \ as an integer parameter. Separate multiple parameters with commas:\n\n```c\n\
    int add (int i, j)\n{\n    return i + j;\n}\n```\n\nC has evolved over the years.\
    \ You will sometimes see functions such as add written in the “old style,” as\
