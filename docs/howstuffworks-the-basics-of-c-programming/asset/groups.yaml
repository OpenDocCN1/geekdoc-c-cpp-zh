- md: "\n# Looping: an example\n\nLet's say that you would like to create a program\
    \ that prints a Fahrenheit-to-Celsius conversion table. This is easily accomplished\
    \ with a for loop or a while loop:\n\n```c\n#include <stdio.h>\n\nint main(void)\n\
    {\n    int a = 0;\n    while (a <= 100)\n    {\n        printf(\"%4d degrees F\
    \ = %4d degrees C\\n\",\n               a, (a - 32) * 5 / 9);\n        a = a +\
    \ 10;\n    }\n    return 0;\n}\n```\n\nIf you run this program, it will produce\
    \ a table of values starting at 0 degrees F and ending at 100 degrees F. The output\
    \ will look like this:\n\n- 0 degrees F = -17 degrees C\n- 10 degrees F = -12\
    \ degrees C\n- 20 degrees F = -6 degrees C\n- 30 degrees F = -1 degrees C\n- 40\
    \ degrees F = 4 degrees C\n- 50 degrees F = 10 degrees C\n- 60 degrees F = 15\
    \ degrees C\n- 70 degrees F = 21 degrees C\n- 80 degrees F = 26 degrees C\n- 90\
    \ degrees F = 32 degrees C\n- 100 degrees F = 37 degrees C\n\nThe table's values\
    \ are in increments of 10 degrees. You can see that you can easily change the\
    \ starting, ending or increment values of the table that the program produces.\n\
    \n# LOOPING: AN EXAMPLE CHAPTER 3. BRANCHING AND LOOPING\n\nIf you wanted your\
    \ values to be more accurate, you could use floating point values instead:\n\n\
    ```c\n#include <stdio.h>\n\nint main(void)\n{\n    float a = 0;\n    while (a\
    \ <= 100)\n    {\n        printf(\"%.2f degrees F = %.2f degrees C\\n\",\n   \
    \            a, (a - 32.0) * 5.0 / 9.0);\n        a = a + 10;\n    }\n    return\
    \ 0;\n}\n```\n\nYou can see that the declaration for a has been changed to a float,\
    \ and the %f symbol replaces the %d symbol in the printf statement. In addition,\
    \ the %f symbol has some formatting applied to it: The value will be printed with\
    \ six digits preceding the decimal point and two digits following the decimal\
    \ point.\n\nNow let's say that we wanted to modify the program so that the temperature\
    \ 98.6 is inserted in the table at the proper position. That is, we want the table\
    \ to increment every 10 degrees, but we also want the table to include an extra\
    \ line for 98.6 degrees F because that is the normal body temperature for a human\
    \ being. The following program accomplishes the goal:\n\n```c\n#include <stdio.h>\n\
    \nint main(void)\n{\n    float a = 0;\n    while (a <= 100)\n    {\n        if\
    \ (a > 98.6)\n        {\n          printf(\"%6.2f degrees F = %6.2f degrees C\\\
    n\",\n              98.6, (98.6 - 32.0) * 5.0 / 9.0);\n          printf(\"%6.2f\
    \ degrees F = %6.2f degrees C\\n\",\n              a, (a - 32.0) * 5.0 / 9.0);\n\
    \          a = a + 10;\n        }\n    }\n    return 0;\n}\n```\n\nThis program\
    \ works if the ending value is 100, but if you change the ending value to 200\
    \ you will find that the program has a bug. It prints the line for 98.6 degrees\
    \ too many times. We can fix the problem in several different ways. Here is one\
    \ way.\n\n```c\n#include <stdio.h>\n\nint main(void) {\n  float a, b;\n  a = 0;\n\
    \  b = -1;\n  while (a <= 100) {\n    if ((a > 98.6) && (b < 98.6)) {\n      printf(\"\
    %6.2f degrees F = %6.2f degrees C\\n\",\n          98.6, (98.6 - 32.0) * 5.0 /\
    \ 9.0);\n    }\n    printf(\"%6.2f degrees F = %6.2f degrees C\\n\",\n       \
    \ a, (a - 32.0) * 5.0 / 9.0);\n    a = a + 10;\n  }\n  return 0;\n}\n```\n\n#\
    \ Programming exercise\n\n- 1. Try changing the Fahrenheit-to-Celsius program\
    \ so that it uses scanf to accept the starting, ending and increment value for\
    \ the table from the user.\n- 2. Add a heading line to the table that is produced.\n\
    - 3. Try to find a different solution to the bug fixed by the previous example.\n\
    - 4. Create a table that converts pounds to kilograms or miles to kilometers.\n\
    \n# Chapter 4\n\n## Arrays\n\nIn this section, we will create a small C program\
    \ that generates 10 random numbers and sorts them. To do that, we will use a new\
    \ variable arrangement called an array.\n\nAn array lets you declare and work\
    \ with a collection of values of the same type. For example, you might want to\
    \ create a collection of five integers. One way to do it would be to declare five\
    \ integers directly:\n\n```c\nint a, b, c, d, e;\n```\n\nThis is okay, but what\
    \ if you needed a thousand integers? An easier way is to declare an array of five\
    \ integers:\n\n```c\nint a[5];\n```\n\nThe separate integers inside this array\
    \ are accessed by an index. All arrays start at zero and go to n-1 in C. Thus,\
    \ int a[5] contains five elements. For example:\n\n```c\nint a[5];\na[0] = 12;\n\
    a[1] = 9;\na[2] = 14;\na[3] = 5;\na[4] = 1;\n```\n\nOne of the nice things about\
    \ array indexing is that you can use a loop to manipulate the index. For example,\
    \ the following code initializes all of the values in the array to 0:\n\n```c\n\
    int a[5];\nint i;\nfor (i = 0; i < 5; i++)\n{\n    a[i] = 0;\n}\n```\n\nYou declare\
    \ arrays by inserting an size after a normal declaration, as shown below:\n\n\
    ```c\nint a[10];          /* array of integers */\nchar s[100];         /* array\
    \ of characters */\nfloat f[20];         /* array of reals */\nstruct rec[50];\
    \      /* array of records */\n```\n\n# Programming exercise\n\n- In the first\
    \ piece of code, changing the for loop that fills the array to a single line of\
    \ code. Make sure that the result is the same as the original code.\n- Take the\
    \ bubble sort out and put it into its own function. Then move the variables used\
    \ by the bubble sort to the function well, and make them local here. Because the\
    \ array is global, you do not need to pass parameters.\n- Initialize the random\
    \ number seed to different values.\n\nThe following code <stdio.h> initializes\
    \ the values in the array sequentially and then prints them out:\n\n```c\n#include\
    \ <stdio.h>\nint main(void)\n{\n    int a[5];\n    int i;\n\n    for (i = 0; i\
    \ < 5; i++)\n    {\n        a[i] = i;\n    }\n    for (i = 0; i < 5; i++)\n  \
    \  {\n        printf(\"%d = %d\\n\", i, a[i]);\n    }\n}\n```\n\nArrays are used\
    \ all the time in C. To understand a common usage, start an editor and enter the\
    \ following code:\n\n```c\n#include <stdio.h>\n#define MAX 10\nint a[MAX];\nint\
    \ rand_seed=10;\n\n```c\n/*\n* from K&R - produces an integer random number\n\
    * between 0 and 32767.\n*/\nint rand(void)\n{\n    rand_seed = rand_seed * 110315245\
    \ + 12345;\n    return (unsigned int)(rand_seed / 65536) % 32768;\n}\n\nint main(void)\n\
    {\n    int i, t, x, y;\n\n    /* fill array */\n    for (i = 0; i < MAX; i++)\n\
    \    {\n        a[i] = rand();\n        printf(\"%d\\n\", a[i]);\n    }\n\n  \
    \  /* more stuff will go here in a minute */\n    return 0;\n}\n```\n\nThis code\
    \ contains several new concepts. The **define** declares a constant named **MAX**\
    \ and sets it to 10. Constant names are traditionally written in all caps to make\
    \ them obvious in the code. The line **int a[MAX];** shows you how to declare\
    \ an array of integers in C. Note that because of the position of the array’s\
    \ declaration, it is global to the entire program.\n\nThe line **int rand_seed=10**\
    \ also declares a global variable, this time named **rand_seed**, that is initialized\
    \ to 10 each time the program begins. This value is the starting seed for the\
    \ random number code that follows. In a real random number generator, the seed\
    \ should initialize as a random value, such as the system time. Here, the rand\
    \ function will produce the same values each time you run the program.\n\nThe\
    \ line int rand(void) is a function declaration. The rand function accepts parameters\
    \ and returns an integer value. We will learn more about functions later. The\
    \ four lines that follow implement the rand function. We ignore them for now.\n\
    \nThe main function is normal. Four local integers are declared, and the array\
    \ is filled with 10 random values using a loop. Note that the array contains 10\
    \ individual integers. You point to a specific integer in the array using square\
    \ brackets. a[0] refers to the first integer in the array, a[1] refers to the\
    \ second, and so on. The line starting with /* and ending with */ is called a\
    \ comment. The compiler completely ignores the line. You can place notes to yourself\
    \ or other programmers in comments.\n\nAdd the following code in place of the\
    \ more stuff ... comment:\n\n```c\n/*\n* bubble sort the array\n*/\nfor (x = 0;\
    \ x < MAX-1; x++)\n{\n    for (y = 0; y < MAX-x-1; y++)\n    {\n        if (a[y]\
    \ > a[y+1])\n        {\n          t = a[y];\n          a[y] = a[y+1];\n      \
    \    a[y+1] = t;\n        }\n    }\n}\n/*\n* print sorted array\n*/\nprintf(\"\
    -------------------------------------------------\\n\");\nfor (i = 0; i < MAX;\
    \ i++)\n```\n"
  mdcn: "\n\n# 循环：一个示例\n\n假设你想创建一个程序，打印华氏度到摄氏度的转换表。这可以通过 `for` 循环或 `while` 循环很容易实现：\n\
    \n```c\n#include <stdio.h>\n\nint main(void)\n{\n    int a = 0;\n    while (a\
    \ <= 100)\n    {\n        printf(\"%4d degrees F = %4d degrees C\\n\",\n     \
    \          a, (a - 32) * 5 / 9);\n        a = a + 10;\n    }\n    return 0;\n\
    }\n```\n\n如果你运行这个程序，它将生成一个从 0 华氏度到 100 华氏度的数值表。输出如下：\n\n- 0 degrees F = -17 degrees\
    \ C\n- 10 degrees F = -12 degrees C\n- 20 degrees F = -6 degrees C\n- 30 degrees\
    \ F = -1 degrees C\n- 40 degrees F = 4 degrees C\n- 50 degrees F = 10 degrees\
    \ C\n- 60 degrees F = 15 degrees C\n- 70 degrees F = 21 degrees C\n- 80 degrees\
    \ F = 26 degrees C\n- 90 degrees F = 32 degrees C\n- 100 degrees F = 37 degrees\
    \ C\n\n表中的值是以 10 度为增量的。你可以看到轻松地更改程序生成的表格的起始值、结束值或增量。\n\n# 循环：一个示例 第 3 章：分支与循环\n\
    \n如果你想让数值更准确，可以使用浮点数：\n\n```c\n#include <stdio.h>\n\nint main(void)\n{\n    float\
    \ a = 0;\n    while (a <= 100)\n    {\n        printf(\"%.2f degrees F = %.2f\
    \ degrees C\\n\",\n               a, (a - 32.0) * 5.0 / 9.0);\n        a = a +\
    \ 10;\n    }\n    return 0;\n}\n```\n\n你可以看到 `a` 的声明已更改为 `float`，并且 `printf` 语句中的\
    \ `%f` 符号替换了 `%d` 符号。此外，`%f` 符号应用了一些格式设置：该值在打印时，小数点前有六位数字，小数点后有两个数字。\n\n现在假设我们想修改程序，将温度\
    \ 98.6 插入表格的正确位置。也就是说，我们希望表格每隔 10 度增加一次，但我们也希望表格中额外包含一行针对 98.6 华氏度的数据，因为这是人体正常体温。以下程序实现了这一目标：\n\
    \n```c\n#include <stdio.h>\n\nint main(void)\n{\n    float a = 0;\n    while (a\
    \ <= 100)\n    {\n        if (a > 98.6)\n        {\n          printf(\"%6.2f degrees\
    \ F = %6.2f degrees C\\n\",\n              98.6, (98.6 - 32.0) * 5.0 / 9.0);\n\
    \          printf(\"%6.2f degrees F = %6.2f degrees C\\n\",\n              a,\
    \ (a - 32.0) * 5.0 / 9.0);\n          a = a + 10;\n        }\n    }\n    return\
    \ 0;\n}\n```\n\n这个程序在结束值为 100 时可以工作，但如果你将结束值更改为 200，你会发现程序有一个 bug。它重复打印了多次 98.6\
    \ 度的那行。我们可以通过不同的方法修复这个问题。这里是其中一种：\n\n```c\n#include <stdio.h>\n\nint main(void)\
    \ {\n  float a, b;\n  a = 0;\n  b = -1;\n  while (a <= 100) {\n    if ((a > 98.6)\
    \ && (b < 98.6)) {\n      printf(\"%6.2f degrees F = %6.2f degrees C\\n\",\n \
    \         98.6, (98.6 - 32.0) * 5.0 / 9.0);\n    }\n    printf(\"%6.2f degrees\
    \ F = %6.2f degrees C\\n\",\n        a, (a - 32.0) * 5.0 / 9.0);\n    a = a +\
    \ 10;\n  }\n  return 0;\n}\n```\n\n# 编程练习\n\n- 1. 尝试修改华氏度转摄氏度的程序，使用 `scanf` 让用户输入起始、结束和增量值。\n\
    - 2. 为生成的表格添加表头。\n- 3. 尝试用不同的方案修复示例中的 bug。\n- 4. 创建一个磅转千克的表格。\n\n# 第 4 章\n\n##\
    \ 数组\n\n在本节中，我们将创建一个小的 C 程序，生成 10 个随机数并对其排序。为了实现这一点，我们将使用一种新变量数组。\n\n数组允许你声明并处理一组相同类型的值。例如，你可能想要创建一个整数集合。一种方法直接声明五个整数：\n\
    \n```c\nint a, b, c, d, e;\n```\n\n这样也可以，但如果你需要千个整数呢？更简单的方法是声明一个数组：\n\n```c\n\
    int a[5];\n```\n\n数组内部的整数通过索引访问。在 C 中，所有数组都从 0 开始到 n-1。因此，`int a[5]` 包含五个元素。例如：\n\
    \n```c\nint a[5];\na[0] = 12;\na[1] = 9;\na[2] = 14;\na[3] = 5;\na[4] = 1;\n```\n\
    \n数组索引的好处之一是你可以使用循环操作索引。例如，以下代码将数组中的所有值初始化为 0：\n\n```c\nint a[5];\nint i;\nfor\
    \ (i = 0; i < 5; i++)\n{\n    a[i] = 0;\n}\n```\n\n你在普通声明后插入大小来声明数组，如下：\n\n```c\n\
    int a[10];          /* 整数数组 */\nchar s[100];         /* 字符数组 */\nfloat f[20];\
    \         /* 浮点数数组 */\nstruct rec[50];      /* 结构体数组 */\n```\n\n# 编程练习\n\n- 在第一段代码中，将填充数组的循环改为单行。确保结果与原始代码相同。\n\
    - 将冒泡排序提取并放入自己的函数中。将冒泡排序使用的变量也移动到该函数中，并设为局部。因为数组是全局的，你不需要传递参数。\n- 将随机数种子初始化为不同的值。\n\
    \n以下 `<stdio.h>` 代码顺序初始化数组中的值并打印它们：\n\n```c\n#include <stdio.h>\nint main(void)\n\
    {\n    int a[5];\n    int i;\n\n    for (i = 0; i < 5; i++)\n    {\n        a[i]\
    \ = i;\n    }\n    for (i = 0; i < 5; i++)\n    {\n        printf(\"%d = %d\\\
    n\", i, a[i]);\n    }\n}\n```\n\n数组在 C 中被频繁使用。为了理解常见的用法，启动编辑器并输入以下代码：\n\n```c\n\
    #include <stdio.h>\n#define MAX 10\nint a[MAX];\nint rand_seed=10;\n```\n\n```c\n\
    /*\n* 来自 K&R - 产生一个 0 到 32767 之间的整数随机数。\n*/\nint rand(void)\n{\n    rand_seed\
    \ = rand_seed * 110315245 + 12345;\n    return (unsigned int)(rand_seed / 65536)\
    \ % 32768;\n}\n\nint main(void)\n{\n    int i, t, x, y;\n\n    /* 填充数组 */\n  \
    \  for (i = 0; i < MAX; i++)\n    {\n        a[i] = rand();\n        printf(\"\
    %d\\n\", a[i]);\n    }\n\n    /* 一会儿这里会有更多内容 */\n    return 0;\n}\n```\n\n这段代码包含了几个新概念。**define**\
