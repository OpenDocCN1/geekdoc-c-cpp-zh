    \ the machine code for the entire program, link the two object files by typing\
    \ the following:\n\n```\ngcc -o main.o util.o\n```\n\nThis links main.o and util.o\
    \ to form an executable named main. To run it, type main.\n\n# Chapter 10\n\n\
    # Makefiles\n\nIt can be cumbersome to type all of the gcc lines over and over\
    \ again, especially if you are making a lot of changes to the code and it has\
    \ several libraries. The make facility solves this problem. You can use the following\
    \ makefile to replace the compilation sequence above:\n\n```\nmain: main.o util.o\n\
    \    gcc -o main.o util.o\nmain.o: main.c util.h\n    gcc -c -g main.c\nutil.o:\
    \ util.c util.h\n    gcc -c -g util.c\n```\n\nEnter this into a file named makefile,\
    \ and type make to build the executable. Note that you must precede all gcc lines\
    \ with a tab. (Eight spaces will not suffice – it must be a tab. All other lines\
    \ must be flush left)\n\nThis makefile contains two types of lines. The lines\
    \ appearing flush left are dependency lines. The lines preceded by a tab are action\
    \ lines, which can contain any valid UNIX command. A dependency line says that\
    \ some file is dependent on some other set of files. For example, main.o:main.c\
    \ util.h says that the file main.o is dependent on the files main.c and util.h.\
    \ If either of these two files change, the following executable line(s) should\
    \ be executed to recreate main.o.\n\nNote that the final executable produced by\
    \ the whole makefile is main, on line 1 in the makefile. The final result of the\
    \ makefile should always go on line 1, which in this makefile says that the file\
    \ main is dependent on main.o and util.o. If either of these changes, execute\
    \ the line gcc -o main.o util.o to recreate main.\n\nIt is possible to put multiple\
    \ lines to be executed below a dependency line – they must all start with a tab.\
