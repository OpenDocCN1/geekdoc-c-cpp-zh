  - '[PAGE 12]


    Here is an explanation of the different lines in this program:


    +   * The line int a, b, c; declares three integer variables named a, b and c.
    Integer variables hold whole numbers.

    * The next line initializes the variable named a to the value 5.

    * The next line sets b to 7.

    * The next line adds a and b “assigns” the result to c.

    The computer adds the value in a (5) to the value in b (7) to form the result
    12, and then places new value (12) into the variable c. The variable c is assigned
    the value 12. For this reason, the = in this is called “the assignment operator."

    * The printf statement prints the line “5 + 7 = 12.” The %d placeholders in the
    printf statement act as placeholders for values. There are three %d names: a,
    b and c. C matches the first %d with a and substitutes 5 there. It matches the
    second %d with b and substitutes 7. It matches the third %d with c and substitutes
    12. Then it prints c and substitutes 12. Then it prints the completed line to
    the screen: 5 + 7 = 12. The +, the = and the spacing are a part of the format
    line and get embedded automatically between the %d operators as specified by the
    programmer.


    Let''s look at some variations to understand printf completely. Here is the simplest
    printf statement:


    ```

    printf(" Hello ");

    ```


    This call to printf has a format string that tells printf to send the word "Hello"
    to standard out. Contrast with it this:


    ```

    printf("Hello\n");

    ```'
  - '[PAGE 13]


    # CHAPTER 2. INPUT AND OUTPUT PRINTF


    The difference between the two is that the second version sends the word “Hello”
    followed by a carriage return to standard out.


    The following line shows how to output the value of a variable using printf.


    ```

    printf("%d", b);

    ```


    The %d is a placeholder that will be replaced by the value of the variable b when
    the print statement is executed. Often, you will want to embed the value within
    some other words. One way to accomplish that is like this:


    ```

    printf("The temperature is %d");

    printf("%d", b);

    printf("%d degrees\n");

    ```


    An easier way is to say this:


    ```

    printf("The temperature is %d degrees\n", b);

    ```


    You can also use multiple %d placeholders in one print statement:


    ```

    printf("%d + %d = %d\n", a, b, c);

    ```


    In the print statement, it is extremely important that the number of operators
    in the format string corresponds exactly with the number and type of the variables
    following it. For example, if the format string contains three %d operators, then
    it must be followed by exactly three parameters and they must have the same types
    in the order as those specified by the operators.


    You can print all of the normal C types with printf using different placeholders:


    +   * int (integer values) uses %d'
