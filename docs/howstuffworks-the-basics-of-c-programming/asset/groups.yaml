  mdcn: "\n\n## 第 7 章. 函数 函数原型\n\n在函数的实际声明之前向程序的其余部分提供信息。要理解为什么函数原型很有用，请输入以下代码并运行：\n\
    \n```c\n#include <stdio.h>\n\nint main(void)\n{\n    printf(\"%d\\n\",add(3));\n\
    \    return 0;\n}\n\nint add(int i, int j)\n{\n    return i+j;\n}\n```\n\n这段代码在许多编译器上可以编译，而不会给你任何警告，尽管\
    \ `add` 期望两个参数但只接收到了一个。它之所以能工作，是因为许多编译器不对参数的类型或数量进行匹配检查。你可能会在调试代码时浪费大量时间，而仅仅是因为你错误地多传了一个或少传了一个参数。上面的代码可以正常编译，但它产生的答案是错误的。\n\
    \n为了解决这个问题，C 语言允许你在程序的开头（实际上是任何位置）放置函数原型。如果你这样做这样做，C 语言就会检查所有参数列表的类型和数量。尝试编译以下内容：\n\
    \n```c\n#include <stdio.h>\n\nint add (int, int); /* add 的函数原型 */\n\nint main(void)\n\
    {\n    printf(\"%d\\n\",add(3));\n    return 0;\n}\n```\n\n## 函数原型 第 7 章. 函数\n\
    \n```c\nint add(int i, int j)\n{\n    return i + j;\n}\n```\n\n原型会导致编译器在 `printf`\
    \ 语句处标记一个错误。\n\n在程序的开头为每个函数放置一个原型。它们可以为你节省大量的调试时间，而且还能解决当你在函数声明之前使用它们时会遇到的问题。例如，以下代码将无法编译：\n\
    \n```c\n#include <stdio.h>\nint main(void)\n{\n    printf(\"%d\\n\",add(3));\n\
    \    return 0;\n}\n\nfloat add(int i, int j)\n{\n    return i+j;\n}\n```\n\n你可能会问，为什么当\
    \ `add` 返回 `int` 时可以编译，而返回 `float` 时却不行？因为较旧的 C 编译器默认返回值为 `int`。使用原型将解决这个问题。“旧式”（非\
    \ ANSI）编译器允许原型，但原型的参数列表必须是空的。旧式编译器不对参数列表进行错误检查。\n\n## 第 8 章\n\n## 结构\n\nC 语言中的结构允许你将变量分组为一个包。这里有一个示例：\n\
    \n```c\nstruct rec\n{\n    int a, b, c;\n    float d, e, f;\n}\n\nstruct rec r;\n\
    ```\n\n如所示，每当你想要声明类型为 `rec` 的结构时，必须说 `struct rec`。这一行很容易被忘记，你会得到很多编译器错误，因为你心不在焉地漏掉了\
    \ `struct`。你可以将代码压缩为形式：\n\n```c\nstruct rec\n{\n    int a, b, c;\n    float d,\
    \ e, f;\n} r;\n```\n\n其中 **rec** 的类型声明和变量 **r** 在同一个语句中声明。或者，你可以为结构体名称创建一个 `typedef`\
    \ 语句。例如，如果你不想在每次声明记录时都说 **struct rec r**，你可以说：\n\n```c\ntypedef struct rec rec_type;\n\
    ```\n\n然后通过说声明类型为 **rec_type** 的记录：\n\n```c\nrec_type r;\n```\n\n你使用句号访问结构的字段，例如，**r.a\
    \ = 5**；\n\n## 第 9 章\n\n## 库\n\n库在 C 语言中非常重要，因为 C 语言只支持它需要的最基础的功能。C 语言甚至不包含从键盘读取和写入屏幕的\
    \ I/O 函数。任何超出基础语言的内容必须由程序员编写。生成的代码块通常放在库中，以便于重复使用。我们已经见过了标准 I/O（即 `stdio`）库。标准库为标准\
    \ I/O、数学函数、字符串处理、时间操作等提供了标准支持。你可以在自己的程序中使用库将你的程序拆分成模块。这使得它们更容易被理解、测试和调试，同时也使得复用你编写其他程序的代码成为可能。\n\
    \n你可以轻松地创建自己的库。作为一个示例，我们将从之前的文章中取一些代码，并将其函数创建一个库。这是我们将开始的代码：\n\n```c\n#include\
    \ <stdio.h>\n\n#define MAX 10\n\nint a[MAX];\nint rand_seed = 10;\n\nint rand(void)\n\
    /*\n * K&R 产生一个 0 到 32767 之间的整数随机数。\n */\n{\n    rand_seed = rand_seed * 11035245\
    \ + 12345;\n    return (unsigned int)(rand_seed / 65536) % 32768;\n}\n\nint main(void)\n\
    {\n    int i, t, x, y;\n    /* 填充数组 */\n    for (i = 0; i < MAX; i++)\n    {\n\
