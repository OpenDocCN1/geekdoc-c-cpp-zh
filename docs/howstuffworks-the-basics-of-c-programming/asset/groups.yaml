    \ words. One way to accomplish that is like this:\n\n```c\nprintf(\"The temperature\
    \ is %d\");\nprintf(\"%d\", b);\nprintf(\"%d degrees\\n\");\n```\n\nAn easier\
    \ way is to say this:\n\n```c\nprintf(\"The temperature is %d degrees\\n\", b);\n\
    ```\n\nYou can also use multiple %d placeholders in one print statement:\n\n```c\n\
    printf(\"%d + %d = %d\\n\", a, b, c);\n```\n\nThe number of operators in the format\
    \ string corresponds exactly with the number and type of the variables following\
