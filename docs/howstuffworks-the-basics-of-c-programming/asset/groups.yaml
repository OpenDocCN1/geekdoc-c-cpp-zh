    # Chapter 14


    # Strings


    Strings in C are intertwined with pointers to a large extent. You must become
    familiar with the pointer concepts covered in the previous articles to use C strings
    effectively. Once you get used to them, however, you can often perform string
    manipulations very efficiently.


    A string in C is simply an array of characters. The following line declares an
    array that can hold a string of up to 99 characters.


    ```

    char str[100];

    ```


    It holds characters as you would expect: str[0] is the first character of the
    string, str[1] is the second character, and so on. But why is a 100-element array
    unable to hold up to 100 characters? Because C uses nullterminated strings, which
    means the end of any string is marked by the ASCII value 0 (the null character),
    which is also represented in C as ''\0''.


    Null termination is very different from the many other languages handles strings.
    For example, in Pascal, each string consists of an array of characters, with a
    length byte keeps count of the number of characters stored in the array. This
    structure gives Pascal a definite advantage when you ask for the length of a string.
    Pascal can simply return the length byte, whereas C has to count the characters
    until it finds ''\0''. This makes C much slower than Pascal in certain cases,
    but in others it is faster, as we will see in the examples below.


    Because C provides no explicit support for strings in the language itself, all
    of the string-handling functions are implemented in libraries. The string I/O
