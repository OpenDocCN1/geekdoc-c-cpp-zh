    # Chapter 12


    # Dynamic Data Structures


    Dynamic data structures are data structures that grow and shrink as you need them
    by allocating and deallocating memory from a place called the heap. They are extremely
    important in C because they allow the programmer to exactly control memory consumption.


    Dynamic data structures allocate blocks of memory from the heap as required, and
    link those blocks together into some kind of data structure using pointers. When
    the data structure no longer needs a block of memory, it will return the block
    to the heap for reuse. This recycling makes very efficient use of memory.


    To understand dynamic data structures completely, we need to start with the heap.


    # Dynamic Data Structures: The Heap


    The operating system and several applications, along with their global variables
    and stack spaces, all consume portions of memory. When a program completes execution,
    it releases its memory for reuse by other programs. Note that part of the memory
    space remains unused at any given time.


    Memory holds the executable code for the different applications currently running
    on the machine, along with the executable code for the operating system itself.
    Each application has certain global variables associated with it. These variables
    consume memory. Finally, each application uses an area of memory called the stack,
    which holds all local variables and parameters used by any function.'
