- img_proc: true
  md: 'The scanf function allows you to accept input from standard. in, which for
    us is generally the keyboard. The scanf function can do a lot of different things,
    but it is generally unreliable unless used in the simplest ways. It is unreliable
    because it does not handle human errors very well. But for simple programs it
    is good enough and easy-to-use.


    The simplest application of scanf looks like this:


    ```

    scanf("%d", &d);

    ```


    The program will read in an integer value that the user enters on the keyboard
    (%d is for integers, as is printf, so b must be declared as an int) and place
    that value into b.


    The scanf function uses the same placeholders as printf:


    +   * int uses %d

    * float uses %f

    * char uses %c

    * character strings (discussed later) use %s


    You must put & in the front of the variable used in scanf. The reason why will
    will become clear once you learn about pointers. It is easy to forget the & sign,
    and when you forget your program will almost always crash when you run it.


    In general, it is best to use scanf as shown here - to read a single value from
    the keyboard. Multiple calls to scanf to read multiple values. In any real program,
    you will use the gets or gets functions instead to read a line at a time. Then
    you will "parse" the line to read its values. The reason that you do is so you
    can detect errors in the input and handle them as you see fit.


    The printf and scanf functions will take a bit of practice to be completely understood,
    but once mastered they are extremely useful.'
