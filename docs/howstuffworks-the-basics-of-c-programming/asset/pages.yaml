    to give it exit points. If you do not place a return statement in a function,
    the function returns when it reaches } and returns a random value (many compilers
    warn you if you fail to return a specific value). In C, a function can return
    values of any type: int, float, struct, etc.


    There are several correct ways to call the **rand** function. For example: **x=rand();**
