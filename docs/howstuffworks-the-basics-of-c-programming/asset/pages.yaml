  md: "# CHAPTER 14. SPECIAL NOTE ON USING STRINGS WITH MALLOC\n\nThese two fragments\
    \ produce the same output, but their internal behavior is quite different. In\
    \ fragment 2, you cannot say s = \"hello\"; To understand the differences, you\
    \ have to understand how the string constant table works in C.\n\nWhen your program\
    \ is compiled, the compiler forms the object code file, which contains your machine\
    \ code and a table of all the string constants declared in the program. In fragment\
    \ 1, the statement s = \"hello\"; causes s to point to the address of the string\
    \ hello in the string constant table, and therefore technically a part of the\
    \ executable code, you cannot modify it. You can only point to and use it in a\
    \ read-only manner.\n\nIn fragment 2, string hello also exists in the constant\
    \ table, so you can copy it into the array of characters named s. Since s is not\
    \ a pointer, the statement s = \"hello\"; will not work in fragment 2. It will\
    \ not even compile.\n\n# Special Note on Using Strings with malloc\n\nSuppose\
    \ you write the following program:\n\n```\nint main(void)\n{\n    char *s;\n \
    \   s = (char *) malloc (100);\n    s = \"hello\";\n    free(s);\n    return 0;\n\
    }\n```\n\nIt compiles properly, but gives a segmentation fault at the free line\
    \ when you run it. The malloc allocates a block 100 bytes long and points s at,\
