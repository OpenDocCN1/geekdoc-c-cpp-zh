  md: '# CHAPTER 2. INPUT AND OUTPUT PRINTF


    The difference between the two is that the second version sends the word “Hello”
    followed by a carriage return to standard out.


    The following line shows how to output the value of a variable using printf.


    ```

    printf("%d", b);

    ```


    The %d is a placeholder that will be replaced by the value of the variable b when
    the print statement is executed. Often, you will want to embed the value within
    some other words. One way to accomplish that is like this:


    ```

    printf("The temperature is %d");

    printf("%d", b);

    printf("%d degrees\n");

    ```


    An easier way is to say this:


    ```

    printf("The temperature is %d degrees\n", b);

    ```


    You can also use multiple %d placeholders in one print statement:


    ```

    printf("%d + %d = %d\n", a, b, c);

    ```


    In the print statement, it is extremely important that the number of operators
    in the format string corresponds exactly with the number and type of the variables
    following it. For example, if the format string contains three %d operators, then
    it must be followed by exactly three parameters and they must have the same types
    in the order as those specified by the operators.


    You can print all of the normal C types with printf using different placeholders:


    +   * int (integer values) uses %d'
