  md: "# SCANF\n\n# CHAPTER 2. INPUT AND OUTPUT\n\n+   - float (floating point values)\
    \ uses %f\n\n+   - char (single character values) uses %c\n\n+   - character strings\
    \ (arrays of characters, discussed later) use %s\n\nYou can learn more about the\
    \ nuances of printf on a Linux machine by typing man 3 printf.\n\n# scanf\n\n\
    The previous program is good, but it would be better if it read in the values\
