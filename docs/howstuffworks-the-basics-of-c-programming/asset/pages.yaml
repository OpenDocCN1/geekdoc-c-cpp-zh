  md: '# Chapter 9


    # Libraries


    Libraries are very important in C because the C language supports only the most
    basic features that it needs. C does not even contain I/O functions to read from
    the keyboard and write to the screen. Anything that extends beyond the basic language
    must be written by a programmer. The resulting chunks of code are often placed
    in libraries to make them easily reusable. We have seen the standard I/O, orio,
    library already. Standard libraries exist for standard I/O, math functions, string
    handling, time manipulation, and so on. You can use libraries in your own programs
    to split your programs into modules. This makes them easier to understand, test,
    and debug, and also makes it possible to reuse code from other programs that you
    write.


    You can create your own libraries easily. As an example, we will take some code
    from a previous article in this series and make a library out of two of its functions.
    Here''s the code we will start with:


    ```

    #include <stdio.h>


    #define MAX 10


