    \n```\n#include <stdio.h>\nint main(void) {\n    int a, b, c;\n    printf(\"Enter\
    \ the first value:\\n\");\n    scanf(\"%d\", &a);\n    printf(\"Enter the second\
    \ value:\\n\");\n    scanf(\"%d\", &b);\n    c = a + b;\n    printf(\"%d + %d\
    \ = %d\\n\", a, b, c);\n    return 0;\n}\n```\n\nMake the changes, compile and\
    \ run the program to make sure it works. Note that scanf uses the same sort of\
    \ format string as printf (type man scanf for more info). Also note the & in front\
    \ of a and b. This is the address operator in C: It returns the address of the\
    \ variable (this will not make sense until we discuss pointers). You must use\
    \ the & operator in scanf on any variable of type char, int, or float, as well\
    \ as structure types (which we will get to shortly). If you leave out the & operator,\
    \ you will get an an error when you run the program. Try it so that you can see\
    \ what sort of run-time error looks like."
