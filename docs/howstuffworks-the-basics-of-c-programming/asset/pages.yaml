    In this program, a structure description rec has been used, but you can use any
    structure description you want. You can see that fopen and fclose work exactly
    as they did for text files.


    The new functions are fread, fwrite and fseek. The fread function takes four parameters:


    +   - A memory address

    - The number of bytes to read per block

    - The number of blocks to read

    - The file variable


    Thus, the line fread(sizeof(struct rec),1,f); says to read 12 bytes (the size
    of rec) from the file f (from the current location of the file pointer) in memory
    address &. One block of 12 bytes is requested. It would be as easy to read 100
    blocks from disk into an array in memory by changing 1 to 100.


    The fwrite function works the same way, but moves the blocks of bytes from memory
    to the file. The fseek function moves the file pointer to a byte in the file.
    Generally, you move the pointer in sizeof(struct rec) increments to keep the pointer
    at record boundaries. You can use three options when seeking:


    +   - SEEK_SET

    - SEEK_CUR

    - SEEK_END


    SEEK_SET moves the pointer x bytes down from the beginning of the file (from byte
    0 in the file). SEEK_CUR moves the pointer x bytes down from the current pointer
    position. SEEK_END moves the pointer from the end of the file (so you must use
    negative offsets with this option).


