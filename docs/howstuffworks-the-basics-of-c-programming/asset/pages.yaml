    # ## Variable Types


    There are three standard variable types in C:


    +   - Integer: int

    - Floating point: float

    - Character: char


    An int is a 4-byte integer value. A float is a 4-byte floating point value. A
    char is a 1-byte single character (like “a” or “3”). A string is declared as an
    array of characters.


    There are a number of derivative types:


    +   - double (8-byte floating point value)

    - short (2-byte integer)

    - unsigned short or unsigned int (positive integers, no sign bit)


