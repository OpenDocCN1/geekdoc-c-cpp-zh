  md: '# # Chapter 17


    #  Text files


    Text files in C are straightforward and easy to understand. All text file functions
    and types in C come from the **stdio** library.


    When you need text I/O in a C program, and you need only one source for input
    information and one sink for output information, you can rely on **stdin** (standard
    in) and **stdout** (standard out). You can use input and output redirection at
    the command line to move different information streams through the program. There
    are six different I/O commands in <stdio.h> that you can use with stdin and stdout:


    +   - **printf** - prints formatted output to stdout

