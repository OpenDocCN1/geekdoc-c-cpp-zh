    #include <stdio.h>\n\nint main(void)\n{\n    int a, b, c;\n    a = 5;\n    b =\
    \ 7;\n    c = a + b;\n    printf(\"%d + %d = %d\\n\", a, b, c);\n    return 0;\n\
    }\n```\n\nType this program into a file and save it as add.c. Compile it with\
    \ the gcc add.c -o add and then run it by typing ./add. You will see the line\
    \ \"5 + 7 = 12\" as output."
