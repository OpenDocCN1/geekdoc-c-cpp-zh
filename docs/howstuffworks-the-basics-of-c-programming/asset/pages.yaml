  md: '# CHAPTER 11. POINTERS

    POINTERS: COMMON BUGS


    ```

    int *p;

    *p = 12;

    ```


    The pointer p is uninitialized and points to a random location in memory when
    you declare it. It could be pointing into the system stack, the global variables,
    or into the program''s code space, or into the operating system. When you say
    *p=12; the program will simply try to write a 12 to whatever random location p
    points to. The program may explode immediately, or wait half an hour and then
    explode, or may corrupt data in another part of your program and you may never
    realize it. This can make this error very hard to track down. Make sure you initialize
    pointers to a valid address before dereferencing them.


    # Bug #2 - Invalid Pointer References


    An invalid pointer reference occurs when a pointer''s value is referenced even
    though the pointer doesn''t point to a valid block.


    One way to create this error is to say p = q; when q is uninitialized. The pointer
    p will then become uninitialized as well, and any reference to *p is an invalid
    pointer reference.


    The only way to avoid this is to draw pictures of each step of the program and
    make sure that all pointers point somewhere. Invalid pointer references cause
    a program to crash inexplicably for the same reasons given in Bug #1.


    # Bug #3 - Zero Pointer Reference


    A zero pointer reference occurs whenever a pointer pointing to zero is used in
    a statement that attempts to reference a block. For example, if p is a pointer
    to an integer, the following code is invalid:


    ```

    p = 0;

    *p = 12;

    ```'
