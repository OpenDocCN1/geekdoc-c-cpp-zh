    # Spacing and indentation


    When you enter this program, position #include so that the pound sign is in column
    (the far left side). Otherwise, the spacing and indentation can be any way you
    like it. On some Linux systems, you will find a program called indent, which will
    format code for you. The spacing and indentation shown above is a good example
    to follow.


    # Compilation and run


    When executed, this program instructs the computer to print out the line “This
    is output from my first program!” – then the program quits. You can''t get much
    simpler than that!


    To compile this code on a Linux machine, type


    ```

    gcc samp.c -o samp

    ```


    This line invokes the C compiler gcc, asks it to compile samp.c and asks it to
    place the executable file it creates under the name samp. To run the program,
    type


    ```

    ./ samp

    ```


    You should see the output “This is output from my first program!” when you run
    the program.


    If you mistype the program, it either will not compile or it will not run. If
    the program does not compile or does not run correctly, edit it again and see
    where you went wrong in your typing. Fix the error and try again.'
