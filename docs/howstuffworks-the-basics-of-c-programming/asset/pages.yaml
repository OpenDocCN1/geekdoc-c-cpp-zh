  md: '# Operator precedence, I


    Operator precedence in C is also similar to that in most other languages. Division
    and multiplication occur first, then addition and subtraction. The result of the
    calculation 5+3*4 is 17, not 32, because the * operator has higher precedence
    than + in C. You can use parentheses to change the normal precedence ordering:
    (5+3)*4 is 32. The 5+3 is evaluated first because it is in parentheses. We''ll
    get into precedence later – it becomes somewhat complicated in C once pointers
    are introduced.


    # Incrementing


    | Long Way | Short Way |

    | --- | --- |

    | i = i + 1; | i++; |

    | i = i - 1; | i--; |

    | i = i + 3; | i += 3; |

    | i = i * j; | i *= j; |


