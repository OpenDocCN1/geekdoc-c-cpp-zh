- md: "\n## CHAPTER 11 C++ QUICK START\n\nThe huge advantage of using std::string\
    \ array is that you never have to be concerned about the maximum size of the string\
    \ (unlike a character array that must be sized in advance). The negative aspect\
    \ of this is that it does dynamic memory allocations, resulting in calls to malloc(3).\
    \ In performance-critical sections of your application, you might want to avoid\
    \ its use.\n\n## String Streams\n\nI have avoided discussing C++ I/O because that\
    \ would require another chapter on its own. For many programmers the older C language\
    \ facilities work best from a productivity point of view. The printf() format\
    \ of \"%.3f\" to print a floating point value to three decimal places, padded\
    \ to a column width of 7, is so much more convenient to convert (and read) than\
    \ the multiple C++ method calls required to do the same job. Despite this prejudice,\
    \ though, you should be familiar with: std::stringstream. The object provides\
    \ a formatting convenience that can augment or even replace a sprintf() call in\
    \ your code. One huge benefit is that in its favor you are never have to be restricted\
    \ to a predetermined buffer size (like with sprintf()).\n\nConsider a code fragment\
    \ where you have:\n\n- A directory variable (type char[] array or std::string),\
    \ named dir_name.\n- A subdirectory name (type char[] array or std::string), named\
    \ subdir.\n- Year, month and day as an int, named year, month, and day, respectively.\n\
    \nThe task at hand is to construct a pathname for a log file. Using std::stringstream,\
    \ this is easily done:\n\n```cpp\nstd::string log_pathname;\n{\n    std::stringstream\
    \ ss;\n\n    ss << dir_name << \"/\" << subdir << \"/\"\n        year << \"-\"\
    \ << month << \"-\" << day << \".log\";\n    log_pathname = ss.str();\n}\n```\n\
    \nIn this code fragment we perform the pathname construction within a code block.\
    \ This code block will discard ss, once the log_pathname is saved in the last\
    \ line of block without having to allocate any buffers to a maximum size. Notice\
    \ that the method str() converts the string stream to a std::string that can be\
    \ assigned. It is also possible to convert a std::string to a C string, for use\
    \ in printf().\n\n```cpp\nprintf(\"The log_pathname=%s\\n\", ss.str().c_str());\n\
    ```\n\nThis example converts ss into a std::string, which can then have its method\
    \ c_str() called to return a C string for use in a printf() call. Chaining method\
    \ calls can sometimes provide some powerful shortcuts.\n\n## Predefined Macros\n\
    \nMacros are useful for code that must be portable. But do you know what macro\
    \ names are available? Using some compiler options, you can have them listed for\
    \ grep. The following example lists macros connected in system with the keyword\
    \ \"ARM\"[1]. Using grep -i allows us to filter while ignoring case.\n\n```bash\n\
    $ /usr/bin/g++-4.7 -DM -E c++ /dev/null | grep -i ARM\n#define __ARMEL 1\n#define\
    \ __FEATURE_UNALIGNED 1\n#define __ARM_PCS_VFP 1\n#define __ARCH_6 1\n#define\
    \ __arm 1\n#define __ARM_EABI 1\n#define __ARM_FEATURE_DSP 1\n```\n\nLeave out\
    \ the grep portion of the command to get the full macro list. Knowing that macro\
    \ __arm__ exists, for example, allows you to conditionally compile code specific\
    \ to the ARM architecture, using preprocessor statements like this:\n\n```cpp\n\
    #ifdef __arm__\n// Do something ARM specific\n#endif\n```\n\n## Summary\n\nBy\
    \ this point, you should have a general understanding of how to apply STL containers.\
    \ We've covered the main fundamentals that you need to get started. The remaining\
    \ details can be read at the cplus.com website. There you can discover other methods\
    \ like clear(), which empties the container of all values.\n\n## Bibliography\n\
    \n- [1] \"C/C Tip: How to List Compiler Predefined Macros\" http://nadeoftware.com/articles/2011/12/c_c_tip_how_list_compiler_predefined_macros.\
    \ Accessed August 4, 2015.\n\n## CHAPTER 12\n\n## Multicore Web Web Server\n\n\
    Given the Raspberry Pi 2 has four CPU cores of bristling computing power, this\
    \ chapter provides an example web server project that can use them all. Although\
    \ this project uses the C libevent library in the background, a nice C++ class\
    \ wraps the C API in a nice C++ package. In this chapter we examine a web server\
    \ built from scratch (from libevent) that is fast and lean. Most important, it\
    \ be easily extended to do just anything that the Pi can do.\n\n## libevent\n\n\
    The C libevent library has been a popular, time-tested library for implementing\
    \ portable web servers and web clients. The main web site for it can be found\
    \ at http://libevent.org/.\nA popular documentation site for libevent is http://www.wangafu.net/~nickm/libevent-2.0/doxygen/html/.\n\
    \nIn this API Reference at the bottom of the page, we will be making use of any\
    \ event, .event and event/h.h.\n\nIf you visit the event2/http.h link, you will\
    \ see that there is a large number of C API functions and macros available. Building\
    \ a web server from scratch could take considerable time, with the library resources\
    \ available.\n\nIn this chapter, we look at a very simple-to-use WebMain C++ class,\
    \ to make it as simple as it can be to build your own custom web server. You will\
    \ have the satisfaction of building precisely the way that you want.\n\n## ClassMain\n\
    \nIn your source code, you will see that there are some data members, which are\
    \ maintained internally by the class:\n\n```cpp\nclass WebMain {\n    int    \
    \             backlog;             // Listen backlog\n    std::string        \
    \ address;           // IPv4 Address\n    int                 port;          \
    \     // Listen port\n    int                 lsock;              // Listen socket\n\
    \    int                 threads;            // of worker threads\n    std::vector<Worker*>\
    \ workers;        // Ptrs to worker threads\n    Worker::http_callback_t callback;\
    \   // HTTP Callback\n\npublic:\n  WebMain();\n  ~WebMain();\n  void set_address(const\
    \ char *address);\n  void set_port(int port);\n  void set_backlog(int backlog);\n\
    \  void set_threads(int threads);\n  void set_callback(Worker::http_callback_t\
    \ cb);\n  int start();\n  void join();\n  void shutdown();\n};\n```\n\nThese members\
    \ are private to the WebMain class, so you don't need to manage them. The protected\
    \ method listen_socket() is also used internally. A class derived from WebMain\
    \ could make use of that if it needed to.\nOf interest to the public methods.\
    \ Most of these are straightforward.\n\n- set_address() sets the web server address\
    \ (the default is \"0.0.0.0\", which applies to all network interfaces).\n- set_port()\
    \ configures the server listener port number (default is 80).\n- set_backlog()\
    \ reconfigures the desired network backlog (default is 5000).\n- set_threads()\
    \ configures how many parallel server threads you want to have active (is 4).\n\
    - set_callback() registers a function to be called with each new HTTP request\
    \ (no default: on this later).\n\nThese methods must be called before starting\
    \ the server method start(). Once the server has been started, changing these\
    \ values has no effect. But set_callback() has default values, so if the default\
    \ is acceptable, the configure methods not be needed.\nTo request the server to\
    \ shut down, the method shutdown() can be invoked (by any thread). After the server\
    \ has been shut down, you should invoke the method join() to wait for the thread's\
    \ completion, and free the resources used by the worker thread(s).\n"
  mdcn: "\n\n## 第 11 章 C++ 快速入门\n\n使用 `std::string` 数组的巨大优势在于，你不需要担心字符串的最大尺寸（与必须提前指定大小的字符数组不同）。它的负面影响是会进行动态内存分配，导致对\
    \ `malloc(3)` 的调用。在应用程序对性能极其敏感的，你可能想要避免使用它。\n\n## 字符串流 (String Streams)\n\n我避免了讨论\
    \ C++ I/O，因为那需要专门开一个章节。对于许多程序员来说，从效率的角度来看，旧的 C 语言工具效果最好。使用 `printf()` 的 `\"%.3f\"\
    ` 格式将浮点数打印为三位小数，并对齐到 7 个列宽，这比完成相同任务所需的多次 C++ 方法调用要方便得多（转换和读取上都是如此）。尽管有这种偏见，你仍然应该熟悉：`std::stringstream`。该对象提供的格式化便利性可以增强甚至替换代码中的\
    \ `sprintf()` 调用。其中一个巨大的用处是，由于它的存在，你永远不会受限于预定义的缓冲区大小（如使用 `sprintf()` 时）。\n\n考虑一个包含以下内容的代码片段：\n\
    \n- 一个目录变量（类型为 `char[]` 数组或 `std::string`），名为 `dir_name`。\n- 一个子目录名（类型为 `char[]`\
    \ 数组或 `std::string`），名为 `subdir`。\n- 年、月、日作为 `int`，分别名为 `year`、`month` 和 `day`。\n\
    \n当前的任务是为日志文件构建路径。使用 `std::stringstream`，这可以很容易完成：\n\n```cpp\nstd::string log_pathname;\n\
    {\n    std::stringstream ss;\n\n    ss << dir_name << \"/\" << subdir << \"/\"\
    \n        year << \"-\" << month << \"-\" << day << \".log\";\n    log_pathname\
    \ = ss.str();\n}\n```\n\n在这个代码片段中，我们在代码块内执行路径构建。一旦 `log_pathname` 在块的最后一行保存，该代码块就会丢弃\
    \ `ss`，而无需为最大尺寸分配任何缓冲区。注意 `str()` 方法将字符串流转换为可以赋值的 `std::string`。同样可以将 `std::string`\
    \ 转换为 C 字符串，以便用于 `printf()`。\n\n```cpp\nprintf(\"The log_pathname=%s\\n\", ss.str().c_str());\n\
    ```\n\n这个示例将 `ss` 转换为 `std::string`，然后可以调用其方法 `c_str()` 返回一个 C 字符串，用于 `printf()`\
    \ 调用。链式调用有时可以提供一些强大的快捷方式。\n\n## 预定义宏 (Predefined Macros)\n\n宏对于必须具有可移植性的代码是有用的。但你知道可用哪些宏名称吗？使用某些编译器选项，你可以让\
    \ `grep` 列出它们。以下示例列出了系统中与关键字 \"ARM\"[1] 相关的宏。使用 `grep -i` 允许我们在忽略大小的情况下进行过滤。\n\
    \n```bash\n$ /usr/bin/g++-4.7 -DM -E c++ /dev/null | grep -i ARM\n#define __ARMEL\
    \ 1\n#define __FEATURE_UNALIGNED 1\n#define __ARM_PCS_VFP 1\n#define __ARCH_6\
    \ 1\n#define __arm 1\n#define __ARM_EABI 1\n#define __ARM_FEATURE_DSP 1\n```\n\
    \n省略命令中的 `grep` 部分以获取完整的宏列表。例如，知道宏 `__arm__` 的存在允许你使用如下预处理器语句条件编译特定于 ARM 架构的代码：\n\
    \n```cpp\n#ifdef __arm__\n// 执行某些 ARM 特的操作\n#endif\n```\n\n## 总结\n\n到此为止，你应该已经对如何应用\
    \ STL 容器有了通用的理解。我们涵盖了你入门所需的主要基础。其余细节可以在 cplus.com 网站上阅读。在那里，你可以发现其他方法，如 `clear()`，它可以清空容器中的所有值。\n\
    \n## 参考文献\n\n- [1] \"C/C Tip: How to List Compiler Predefined Macros\" http://nadeoftware.com/articles/2011/12/c_c_tip_how_list_compiler_predefined_macros.\
    \ 访问于2015年8月4日。\n\n## 第 12 章\n\n## 多核 Web 服务器\n\n鉴于树莓派 2 拥有四个强大计算能力的 CPU 核心，本章提供了一个可以利用所有这些核心的\
    \ Web 服务器项目。虽然该项目在后台使用了 C `libevent` 库，但一个良好的 C++ 类将 C API 封装在一个优雅的 C++ 包中。在本章中，我们将检查一个从零开始（基于\
    \ libevent）构建的快速且精简 Web 服务器。最重要的是，它可以轻松扩展以完成树莓派能做的任何事情。\n\n## libevent\n\nC `libevent`\
    \ 库是一个流行的、经过时间考验的实现可移植 Web 服务器和客户端的库。主网站可以在 http://libevent.org/ 找到。\n一个流行的 `libevent`\
    \ 文站点是 http://www.wangafu.net/~nickm/libevent-2.0/doxygen/html/。\n\n在页面底部的此 API\
    \ 参考中，我们将利用任何事件、`.event` 和 `event/h.h`。\n\n如果你访问 `event2/http.h` 链接，你会看到有很多可用的\
    \ C API 函数和宏。有了现有的库资源，从零开始构建 Web 服务器可能花费大量时间。\n\n在本章中，我们查看一个非常易用的 `WebMain` C++\
    \ 类，使构建你自己的自定义 Web 服务器尽可能简单。你将获得按照你想要的方式进行构建的满足感。\n\n## ClassMain\n\n在你的源代码中，你将看到一些由类内部维护的数据成员：\n\
    \n```cpp\nclass WebMain {\n    int                 backlog;             // 监听队列\n\
    \    std::string         address;           // IPv4 地址\n    int              \
    \   port;               // 监听端口\n    int                 lsock;              //\
    \ 监听 socket\n    int                 threads;            // 工作线程数量\n    std::vector<Worker*>\
    \ workers;        // 指向工作线程的指针列表\n    Worker::http_callback_t callback;   // HTTP\
    \ 回调\n\npublic:\n  WebMain();\n  ~WebMain();\n  void set_address(const char *address);\n\
    \  void set_port(int port);\n  void set_backlog(int backlog);\n  void set_threads(int\
    \ threads);\n  void set_callback(Worker::http_callback_t cb);\n  int start();\n\
    \  void join();\n  void shutdown();\n};\n```\n\n这些成员是 `WebMain` 类的私有的，因此你不需要管理它们。保护方法\
    \ `listen_socket()` 也在内部使用。派生自 `WebMain` 的类如果需要可以使用它。\n感兴趣的是公共方法。这些方法大部分都很直观。\n\
    \n- `set_address()` 设置 Web 服务器地址（默认是 \"0.0.0.0\"，适用于所有网络接口）。\n- `set_port()` 配置服务器监听端口号（默认是\
    \ 80）。\n- `set_backlog()` 配置所需的网络队列（默认是 5000）。\n- `set_threads()` 配置你希望激活的并行服务器线程数量（为\
    \ 4）。\n- `set_callback()` 注册每个新 HTTP 请求时调用的函数（无默认值：稍后）。\n\n这些方法必须在启动服务器方法 `start()`\
    \ 之前调用。一旦服务器启动，更改值将无效。但 `set_callback()` 有默认值，所以如果默认值可以，则不需要配置方法。\n要请求关闭服务器可以调用\
    \ `shutdown()` 方法（由任何线程调用）。服务器关闭后，你应该调用 `join()` 方法等待线程完成，并释放工作线程使用的资源。\n\n"
