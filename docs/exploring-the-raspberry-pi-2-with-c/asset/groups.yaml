    ## 第 3 章


    ## 矩阵（CPU 利用率）


    除了内存容量翻倍外，新款树莓派 2 的主要吸引力之一是四核心：四倍的脑力！在本章中，我们将查看几种可视化核心中存在的 CPU 活动的方法。


    ## LED 矩阵


    市面上可以低价购买到 8×8 的红色 LED 矩阵阵列。为了方便驱动这些 LED，还有 MAX7219 LED 显示驱动 IC。你可以自己构建，但这些也可以作为组装或未组装的
    PCB 套件购买。图 3-1 所示是在 eBay 上购买的组装版，价格为 2.24美元（免邮）。


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_35_0.png)


    图 3-1. MAX7219 LED 矩阵 PCB


    该 PCB 的连接如下：


    - 1. VCC (4.0V 到 5.5V)

    - 2. Gnd

    - 3. DIN（数据输入）

    - 4. CS（MAX7219 的负载）

    - 5. CLK（串行时钟）


    显然，VCC 对 GPIO 接口产生了一个问题，因为树莓派使用 3.3V 逻辑，且无法承受更高的电压。事实是 DIN、CS（即 MAX7219 的 LOAD）和
    CLK 输入到 IC 内部。然而，Maxim 数据书中的 $V_{cc}$ 参数列为 +3.5V。即使在理想情况下，你的树莓派 GPIO 输出也不会达到 +3.3V。


    ## 电平转换器


    然而，有一种非常好的、低成本且方便的解决方案：图 3-2 所示的 3V 转 5V 双向转换器。


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_36_0.png)


    **图 3-2.** 3V 转 5V 电平转换器


    图 3-2 所示的电平转换器是在 eBay 上 5.07美元购买（免邮），尽管可以更便宜（确保买的是双向的）。它们可能以不同的名称广告，但几乎总是会提到 I2C
    或 IIC。


    这些转换器的伟大之处在于它们可以在两个方向上工作，使其非常灵活（不要在非双向转换器上浪费时间）。3V 信号变化会反映在 5V 端，反之亦然。3-3 显示了我购买的电平转换器的底部。


    底部的丝印有助于直观理解单元的工作原理。有几种不同类型的电平转换器，让我们注意以下几点。


    丝印显示右侧的 +5V 端可以产生高达 150 mA 的 3V（图 3-3）。该转换器包含一个小型电压调节器，从 +5V 输入产生约 3V（或者带有齐纳二极管；我没能完成）。许多其他转换器没有这个
    3V 生成功能。

    作为测试，我向 5V 端添加了 +5V，GND 接地，在输出端测量到约 3.6V（无负载）。额外收获！此外，我发现一个小红 LED LED也亮了（PCB 顶侧）。


    了解 +3V 输入很重要，因为电平转换器在此处工作良好（为 3V 端的高侧电阻供电）。如果没有此功能，你将需要将3V 输入连接到树莓派的 3.3V 输入，同时向另一侧提供
    +5V。在我的情况下，+3V 已经在 PCB 上提供，并源自 +5V 输入。因此我们将 +5V 连接到 +5，但在这种情况下不要将 +3V 连接到超过 3.3V
    的树莓派上。


    对于其他不产生 +3V 电源的电平转换器，你需要从树莓派提供电源。在所有情况下，+5V 输入应连接到 3V 端，GPIO 从低到高会安全地导致靠近 5V 的变化。这些是双向转换器，反向工作方式相同，但我们的项目中不需要。


    ## 将 GPIO 连接到 MAX7219


    矩阵 PCB 通过 MAX7219 IC 驱动 LED。通过电平转换器，我们现在可以将树莓派连接到该芯片。现在让我们查看 MAX7219 IC 的信号要求。


    - DIN：此信号是串行输入 MAX7219 IC 的数据。数据在 CLK 信号上升沿进入芯片。高电平识别为 1 位，识别为 0 位。这在 CLK 上升之前必须至少稳定
    25 ns。

    - CLK：当信号从低变为高时，数据移入。该信号的操作频率不能超过 10 MHz。

    - CS（PCB 上），LOAD：当 LOAD 信号从低变为高（MAX7219 的第 12 引脚）时，处理移入的最后 16 位数据。在数据位移入期间，LOAD
    信号必须保持低电平（在时钟之前至少 25 ns）。


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_37_0.png)


