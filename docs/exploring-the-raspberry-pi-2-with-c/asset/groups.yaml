    \ gate |\n| 4002 | Dual 4-input NOR gate |\n| 4006 | 18-stage shift register |\n\
    | 4007 | Dual complementary pair + 1 NOT gate |\n| 4008 | 4-bit binary full adder\
    \ |\n| 4009 | Hex inverting buffer (replaced by 4049) |\n| 4010 | Hex noninverting\
    \ buffer (replaced by 4050) |\n\nA simple (ordered) map could use the following\
    \ declaration:\n\n```cpp\nstd::map<std::string,std::string> ic_map;\n```\n\nBut\
    \ now you want to add the 7400 series of parts of the map, as shown in Table 11-2.\n\
    \nTable 11-2. Additional values to be added\n| Part number | Description | Datasheet\
    \ |\n| :--- | :--- | :--- |\n| 7400 | Quad 2-input NAND gate | HC/HCT |\n| 7401\
    \ | Quad 2-input NAND gate with open collector outputs | |\n| 7402 | Quad 2-input\
    \ NOR gate | HC/HCT |\n| 7403 | Quad 2-input NAND gate with open collector outputs\
    \ | |\n\nThese come in the original series (74XX), as well as \"HC\" and \"HCT\"\
    \ (for this example). The CMOS series can be filed under \"CD\", how do we arrange\
    \ the map to segregate these parts by series? We can use a std::map as the map\
    \ type:\n\n```cpp\nstd::map<std::string, std::map<std::string,std::string>> ic_map;\n\
    ```\n\n> **Warning** There is a subtle problem that you need to be aware of. The\
    \ white space is important in this declaration to avoid confusing the compiler.\
    \ Consider the same declaration without the extra whitespace:\n\n```cpp\nstd::map<std::string,std::map<std::string,std::string>>\
    \ ic_map;\n```\n\nAll is well in this declaration except for the >> operator just\
    \ before the ic_map token. Some compilers choke on this and others sort it out.\
    \ It is best to solve the problem by using a space.\n\nThe first template parameter\
    \ will access the series of device. The keys used for the series will be as follows:\n\
    \n- \"CD\" for the 4000 series\n- \"74XX\" for the original 7400 series\n- \"\
    HC\" for the 74HCXX series\n- \"HCT\" for the 74HCTXX series\n\nThe second template\
    \ parameter will be the value's type, which in this case is another map. This\
    \ inner map will be organized by device type and its description as a value. Let's\
    \ look at an example of usage (for now, just accept the fact that a C string constant\
    \ can be used in many places where a std::string is expected).\n\nTo insert into\
    \ this multilevel map, the simplest way would be to do the following:\n\n```cpp\n\
    ic_map[\"CD\"][\"4010\"] = \"Hex non-inverting buffer (replaced by 4050)\";\n\
    ```\n\nThe first subscript operation will automatically create the inner map if\
    \ it doesn't exist for the key value \"CD\". If it does exist, its entry is referenced\
    \ and can be subscribed (allowing us to add to the existing map). This operation\
    \ can be broken down into two steps:\n\n```cpp\nstd::map<std::string,std::string&>\
    \ inner_map = ic_map[\"CD\"];\n```\n\nThis inner_map reference can access the\
    \ part entry:\n\n```cpp\ninner_map[\"4010\"] = \"Hex non-inverting buffer (replaced\
    \ by 4050)\";\n```\n\nSometimes in time, it will be best to split these operations\
    \ as just shown. Using the intermediate reference allows you to avoid unnecessary\
    \ repeated loops of the category. Let's revise the example database so that the\
    \ value is a struct instead:\n\n```cpp\nstruct s_part_info {\n    std::string\
    \ desc;\n    bool obsolete;\n};\n```\n\n## CHAPTER 11 C++ QUICK START\n\n```cpp\n\
    std::map<std::string, std::map<std::string,s_part_info> > ic_map;\nstd::map<std::string,s_part_info>&\
    \ series_ref = ic_map[\"CD\"];\n```\n\ns_part_info part = series_ref[\"4010\"\
    ]; // Access part entry\n\npart.desc = \"Hex non-inverting buffer (replaced by\
    \ 4050)\";\npart.obsolete = true;\n\nAfter accessing the part entry (part), the\
    \ data structure can be updated without further map lookups.\nOn the other hand,\
    \ this is an example of what not to do:\n\n```cpp\nic_map[\"CD\"][\"4010\"].desc\
    \ = \"Hex non-inverting buffer (replaced by 4050)\";\nic_map[\"CD\"][\"4010\"\
    ].obsolete = true;\n```\n\nThis is easy to read and work, but if the compiler\
    \ fails to optimize this code away, you will incur four map lookups. This is as\
    \ much as is wanted.\nThis section has demonstrated how a std::map can hold other\
    \ std::map containers. You can declare a std::unordered_set inside of a std::map.\n\
    You might mix and match other container types within containers using the same\
    \ principle.\nThis is not the only way to organize containers. If you need to\
