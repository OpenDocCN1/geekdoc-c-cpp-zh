    \n[content]\n# APPENDIX A CLASS GPIO 1\n\nIf you're concerned about added CPU\
    \ overhead, the effect of the macro can be disabled by defining the macro:\n\n\
    ```\n#define NDEBUG\n```\n\nYou would do this in the code or through the compiler\
    \ command-line option (-NDEBUG). With the NDEBUG macro defined, the production\
    \ code will no longer invoke the extra overhead. Often the overhead is so small\
    \ that you can leave it in for added protection.\n\n## Include File\n\nThe include\
    \ file needed for use of the GPIO class is provided by:\n\n```\n#include <librpi2/gpio.hpp>\n\
    ```\n\nThis is installed in `/usr/local/include` (the default install PREFIX=/usr/local),\
    \ unless you changed the PREFIX in the build and install. In your own makefile,\
    \ be sure to add the compiler option -I /usr/local/include to your g++ compile\
    \ command line. If necessary, add the compiler option -I /usr/local/include.\n\
    \n## Linking with the GPIO Library\n\nWhen using the default build and install\
    \ PREFIX=/usr/local, your installed librpi2 library should be located here:\n\n\
    `/usr/local/lib/librpi2.a`\n\nWhen linking your program, add the options -L/usr/local/lib\
    \ -lrpi2 to the link step of your makefile.\n\n## Class Definition (Part 1)\n\n\
    In this part of our look at the GPIO class, I'll focus only on the constructor\
    \ and associated GPIO methods directly. This will make the documentation less\
    \ cluttered. Other appendices will document the other functions available through\
    \ this class.\n\n```cpp\nClass GPIO {\n    bool errcode;      // errno if GPIO\
    \ open failed\n\npublic:\n    GPIO();\n    ~GPIO();\n\n    inline int get_error();\
    \      // Test for error\n\n    int configure(int gpio, IO io);      // Input/Output\n\
    \    int configure(int gpio, Pull pull);  // None/Pull/Pulldown\n    int configure(int\
    \ gpio, Event event, bool enable);\n    int events_off(int gpio);            //\
    \ Disable all input events\n\n    int read_event(int gpio);               // Read\
    \ event data\n    int clear_event(int gpio);          // Reset event for gpio\n\
    \n    int read(int gpio);                    // Read GPIO into data\n    int write(int\
    \ gpio, int bit);       // Write GPIO\n\n    uint32_t read_events();         \
    \        // Read all 32 GPIO events\n    uint32_t read();                    //\
    \ Read all 32 GPIO bits\n\nint alt_function(int gpio, int& io);\nint get_drive_strength(\n\
    \    int gpio,\n    bool& slew_limited,\n    bool& hysteresis,\n    int& drive);\n\
    int set_drive_strength(\n    int gpio,\n    bool slew_limited,\n    bool hysteresis,\n\
    \    int drive);\n};\n```\n\n## GPIO::GPIO Constructor\n\nThe GPIO class is simply\
    \ instantiated without arguments where you need it. For example:\n\n```cpp\n#include\
    \ <librpi2/gpio.hpp>\n```\n\n```cpp\nint\nmain(int argc, char **argv) {\n    GPIO\
    \ gpio;\n```\n\nBut you should plan your placement addresses carefully, since\
    \ upon construction, the GPIO class performs the following behind the scenes:\n\
    \n1. Locks an internal mutex (for thread safety)\n2. Determines the physical Broadcom\
    \ peripheral base address\n3. Maps the GPIO peripheral registers into memory at\
    \ a system-assigned address\n4. Saves some memory addresses to allow access to\
    \ the registers\n5. Unlocks the mutex\n\nEssentially, after performing the mutex\
    \ lock, the code checks to see if another instance of the GPIO class (perhaps\
    \ in another thread) has already done this procedure. If it has been done, the\
    \ current constructor simply uses the information already gathered. The constructor\
    \ is thread safe, allowing you to instantiate the GPIO class from multiple points\
    \ of your application.\n\nOne special note is in order, however: if the start-up\
    \ procedure fails for any reason, the system error code (errno) is saved in the\
    \ class member errcode. A constructor does not return any status information,\
    \ so it is up to you to check for an error. An example code fragment of this is\
    \ shown below:\n\n```cpp\n#include <librpi2/gpio.hpp>\n\nint\nmain(int argc, char\
    \ **argv) {\n    GPIO gpio; // Instantiate class GPIO as gpio\n\n    if (gpio.get_error()\
    \ != 0) {\n        fprintf(stderr, \"%s: GPIO\\n\", strerror(errno));\n      \
    \  exit(1);\n    }\n}\n```\n\nA common cause of failure is the lack of permission.\
    \ To access the GPIO registers directly, a memory mapping of the physical registers\
    \ into your process address space is required. It is a privileged operation, which\
    \ requires root access. You can grant root access to your program by performing:\n\
    \n```bash\n$ sudo chmod root program\n$ sudo chmod u+ program\n```\n\nIf you plan\
    \ to use GPIO in several points in your code, you may prefer to make the GPIO\
    \ instance global instead of local to the function, as in the previous example.\
    \ Just declare the instance global as the following code fragment illustrates:\n\
    \n```cpp\n#include <librpi2/gpio.hpp>\n\nGPIO gpio; // global declaration\n\n\
    int\nmain(int argc, char **argv) {\n    int rc;\n\n    if ((rc = gpio.get_error())\
    \ != 0 ) {\n        fprintf(stderr, \"%s: GPIO\\n\", strerror(errno));\n     \
    \   exit(1);\n    }\n}\n```\n\nIn this example, keep in mind that the global gpio\
    \ instance is constructed (and thus executed) before the main program itself is\
    \ started. For this reason, the object gpio will simply set its internal errcode,\
    \ if a problem occurs.\n\n## GPIO::get_error\n\nEssentially, after performing\
    \ the mutex lock, the code checks to see if another instance of the GPIO class\
    \ (perhaps in another thread) has already done this procedure. If it has been\
    \ done, the current constructor simply uses the information already gathered.\
    \ The constructor is thread safe, allowing you to instantiate the GPIO class from\
    \ multiple points of your application.\n\nOne special note is in order, however:\
    \ if the start-up procedure fails for any reason, the system error code (errno)\
    \ is saved in the class member errcode. A constructor does not return any status\
    \ information, so it is up to you to check for an error.\n\n## GPIO::configure\n\
    \nThere are three overloaded `configure` methods:\n\n- `int configure(int gpio,\
    \ IO io)`\n- `int configure(int gpio, Pull pull)`\n- `int configure(int gpio,\
    \ Event event, bool enable)`\n\nThe first method sets the pin as input or output.\
    \ The second sets the internal pull-up/down resistors (None, Pull, Pulldown).\
    \ The third enables or disables specific event interrupts.\n\n## GPIO::Pull\n\n\
    The second form of the `configure` method allows you to control pullup or down\
    \ resistors. Within the GPIO class, the following enumerated set is defined:\n\
    \n```cpp\nenum Pull {\n    None, // No pull or down\n    Up,   // Activate pullup\
    \ resistor\n    Down;  // Activate pulldown resistor\n};\n```\n\n## GPIO::Event\n\
    \nThe third variation of the `configure` method allows you to configure events.\
    \ The GPIO class declares the following enumerated set for this purpose:\n\n```cpp\n\
    enum Event {\n    Rising,       // Rising edge detection\n    Falling,      //\
    \ Falling edge detection\n    High,         // High level detection\n    Low,\
    \          // Low level detection\n    Async_Rising, // Asynchronous Rising edge\n\
    \    Async_Falling // Asynchronous Falling edge\n};\n```\n"
  mdcn: "\n# 附录 A GPIO 类 1\n\n如果你担心额外的 CPU 开销，可以通过定义以下宏来禁用该宏的效果：\n\n```\n#define NDEBUG\n\
    ```\n\n你可以在代码中执行此操作，也可以通过编译器命令行选项 (-NDEBUG) 实现。在定义了 NDEBUG 宏后，生产环境代码将不再调用额外的开销函数。通常这种开销非常微小，你也可以保留它以获得额外的保护。\n\
