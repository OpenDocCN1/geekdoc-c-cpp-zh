    assert(!rc); // Make sure this succeeds\n// Disable hysteresis\nrc = gpio.set_drive_strength(19,slew_limited,false,drive);\n\
    assert(!rc);\n```\n\n# APPENDIX B Class GPIO 2\n\nThe library class GPIO provides\
    \ a very simple API to work with Raspberry Pi hardware in C++. Using this class,\
    \ you can immediately define your application rather than rewrite code. This appendix\
    \ is useful for those wanting to:\n\n- Start and stop the General Purpose Clock\n\
    - Configure a PWM clock\n- Configure and start the PWM peripheral\n\nFor include\
    \ linking instructions, see Appendix A.\n\n## Class Definition (Part 2)\n\nIn\
    \ this second part of our look at the GPIO class, I'll discuss the methods applicable\
    \ to starting the General Purpose Clock and the PWM peripheral. In the following,\
    \ I've retained the basic constructor, destructor, and get_error() methods for\
    \ ease of reference. All other methods have been stripped for readability.\n\n\
    ```cpp\nclass GPIO {\n    bool err; // errno if GPIO failed\n\npublic:\n    GPIO();\n\
    \    ~GPIO();\n\n    inline int get_error(); // Test for error\n\n    int config_clock(\n\
    \        int gpio,\n        Source& src,\n        unsigned& divi,\n        unsigned&\
    \ divf,\n        unsigned& mash,\n        bool& enabled\n    );\n};\n```\n\n#\
    \ APPENDIX B CLASS GPIO 2\n\n```cpp\n// Clock control: GPIO 4, 12, 18, 13 or 19\n\
    int start_clock(\n  int gpio,\n  Source src,\n  unsigned divi,\n  unsigned divf,\n\
    \  unsigned mash=0,\n  bool enabled=true\n);\n```\n\n```cpp\n// PWM: GPIO 12 or\
    \ 18, PWM1: GPIO 13 or 19\nint pwm_configure(\n  int gpio,\n  PwmMode mode,\n\
    \  bool repeat,\n  int state,\n  bool invert,\n  bool fifo,\n  PwmAlgo algorithm\n\
    );\n```\n\n```cpp\nint pwm_control(int gpio,PWM_status&status);\nint pwm_status(int\
    \ gpio,PWM_status&status);\nint pwm_ratio(int gpio,uint32_t m,uint32_t s);\nint\
    \ pwm_enable(int gpio,bool enable);\nint pwm_clear_status(int gpio,const PWM_status&status);\n\
    int pwm_write_fifo(uint32_t *data,size_t n_words);\nbool pwm_fifo_full(int gpio);\n\
    bool pwm_fifo_empty(int gpio);\n```\n\n```cpp\nint get_pwm_ratio(int gpio,uint32_t\
    \ m,uint32_t &s);\n```\n\n## GPIO::config_clock\n\nThis class method returns information\
    \ about the selected General Purpose Clock.\n\n```cpp\nint config_clock(\n  int\
    \ gpio,\n  Source& src,\n  unsigned& divi,\n  unsigned& divf,\n  unsigned& mash,\n\
    \  bool& enabled\n);\n```\n\nThe argument gpio is an input argument, which selects\
    \ a peripheral, according to Table B-1.\n\n## Table B-1. GPIO and the Peripherals\n\
    \n| GPIO | Peripheral |\n| :--- | :--- |\n| 4 | General Purpose Clock 0 |\n| 12\
    \ | PWM 0 Clock |\n| 18 | PWM 0 Clock |\n| 13 | PWM 1 Clock |\n| 19 | PWM 1 Clock\
    \ |\n\nThe source argument returns (by reference) the oscillator source currently\
    \ selected for the clock. Table B-2 documents the GPIO constants used.\n\n## Table\
    \ B-2. GPIO Constants and Clock Source\n\n| GPIO::Source | Clock Source |\n| :---\
    \ | :--- |\n| GPIO::Gnd | Ground (disabled) |\n| GPIO::Oscillator | Oscillator\
    \ (19.2 MHz) |\n| GPIO::PLLA | PLLA (Audio - 393.216 MHz) |\n| GPIO::PLLC | 1000\
    \ MHz (changes with overclocking) |\n| GPIO::PLLD | 500 MHz |\n| GPIO::HDMI_Aux\
    \ | HDMI Aux (216 MHz) |\n\nThe returned div and interf parameters determine how\
    \ much the clock source is divided, which affects the frequency. Chapter 6 outlines\
    \ how to calculate the frequency from these values. The argument mash is a returned\
    \ value from 0 to 3, indicating how the clock signal is varied. Chapter 6 describes\
    \ the effect of this parameter. Finally, the returned boolean argument enabled\
    \ indicates whether the clock has been enabled (started). The function returns\
    \ a non-zero system error code when it fails and zero when successful. Assuming\
    \ the class GPIO has been instantiated as gpio, the following example shows how\
    \ to query the current settings of the General Purpose Clock:\n\n```cpp\ngpio\
    \ gpio;\n...\nint rc;\nGPIO::Source src;\nunsigned divi, divf, mash;\nbool enabled;\n\
    \nrc = gpio.config_clock(\n    4, // Input: General Purpose Clock GPIO\n    src,\
    \ // Output: Return source\ndivi, // Output: Return divi\ndivf, // Output: Return\
    \ divf\n)\n```\n"
