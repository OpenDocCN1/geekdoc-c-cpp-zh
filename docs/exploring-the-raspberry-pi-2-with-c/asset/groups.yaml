    # 第 9 章 PISPY


    这两者都不显而易见，但我看来它们应该是显而易见的。


    随着年龄的增长，我们最终都会面临难以看清近物体或眼睛变小的问题。根据我视科医生办公室的视频，这是由于眼睛内的晶状体无法通过眼睛收缩来聚焦近物。晶状体变得坚硬且缺乏弹性。无论我们做什么，都可以通过敲击来使波形更加剧烈——增大
    Signals 窗口的字体大小。字体大小的会导致波形随之增大。


    在你的主目录下创建一个名为 `.gtkwaverc` 的文件。在文件中写入如下所示的行（根据你的任务进行修改）。该行配置了字体选择及其大小。以下是我在书中示例使用的设置：


    ```

    $ cat ~/.gtkwaverc

    fontsize_signals Monospace 20

    ```


    此时，没有办法从 Waves 窗口中删除痕迹，但你可以通过高亮要删除的信号，然后使用 Edit（编辑）菜单来实现。选择 Cut（剪切），信号就会被移除。


    # 简述 PiSpy


    在本节中，我将向大家展示 pyspy 工作原理的鸟瞰图，因为详细描述它过于复杂。通过这个概述以及提供的源代码，内核程序员可以复用 librpi 中的类。


    - ~/pips2/pyspy/pyspy.cpp

    - ~/pips2/librpi/*.cpp

    - ~/pips2/include/*.cpp


    pyspy 命令使用了以下库：


    - 1. Logic Analyzer (#include "logana.hpp")

    - 2. GPIO (#include "gpio.hpp")

    - 3. VCD_Out (#include "vcdout.hpp")


    GPIO 类在附录中描述。其他类可以由内核程序员使用。


    使用 pyspy 程序捕捉并显示信号的基本步骤是：


    1. 解析命令行。

    2. 使用 LogicAnalyzer.open() 方法打开 mailbox。这会导致发生以下情况：


    1. 打开设备 `/dev/rpidma`（由 rpidma.ko 提供的内核模块）。

    2. 根据使用的是 Raspberry Pi 2（ARMv7）还是之前的模块（ARMv6），确定内存偏移和标志。

    3. 创建访问 mailbox 的设备 /dev/logana。

    4. 打开此驱动文件。

    5. 为 mailbox 分配页。

    6. 锁定内存。

    7. 根据选项 -b 获取 mailbox 的虚拟地址。

    4. 访问 控制器的第一个控制块。

    5. 调用 LogicAnalyzer 的 propagate() 方法将第一个控制块复制到其他内存块，进行必要的调整。

    6. 如果使用了选项 -v，则在终端上显示第一个控制块的状态。

    7. LogicAnalyzer.start() 方法启动 DMA 传输。

    8. 如果有触发器，等待 DMA 中断发生。此捕捉块准备好扫描信号。

    9. 如果在捕捉块中找到了触发条件，允许捕捉继续直到完成。

    10. 否则，当前的 DMA 捕捉并重启。如果未找到触发器，循环将停止。

    11. 如果使用了选项 -v，DMA 状态将报告到终端。

    12. 在这一点，捕捉完成并留在内存中。


    接下来发生的是将捕捉的数据写入文件。使用的捕捉格式是 `.vcd`（值变化 dump）。这种格式由 IEEE 标准 1364-1995 定义 [1]。pyspy
    工具创建 `captured.vcd` 文件，定义了 gpio0 到 gpio31 的信号，并写出定时信息。这些信息可以通过 gtkwave 命令加载并查看。在文件中捕捉数据后，除非指示了选项
    -x，否则 pyspy 将自动启动 `/usr/bin/gtkwave`（因为 gtkwave 在启动时产生很多 GTK 信息）。


    # 总结


    在本章中，你学习了如何使用 pyspy 将 GPIO 信号捕捉到 `captured.vcd` 文件中，该文件通常很小。你还学习了如何操作 gtkwave，这可能没那么明显。最后，gtkwave
    的自定义对某些非常有帮助。


    下一章将介绍书中提供的命令。使用该命令，我们将通用 Raspberry Pi 工作并使用 pyspy 检查我们的工作。


    # 参考文献


    - [1] "Value Change Dump", Wikipedia. http://en.wikipedia.org/wiki/Value_change_dump


    # 第 10 章


    ## 抖动


    将按按钮连接到 GPIO 输入的*想法*看起来非常简单。只需使用按按钮、几个连接和一些简单的软件来读取 1 或 0，不是吗？毕竟它是数字输入，只有 1 和
    0。这看起来很基础，但实际情况比这复杂得多。


    实际情况违背直觉，是因为我们的思考和操作比数字电路慢。按下按钮的物理动作可能需要大约半秒，所以我们倾向于那样思考。另一方面，数字电路可以在相同的时间范围内响应百万次事件。


    本章探索按按钮及其对电子输入带来的问题。对于 Raspberry Pi *制作者*来说，这是使用 GPIO 输入时必须掌握的关键点。本章向学生介绍解决问题的简单硬件方案。


    ## 引言


    图 10-1 显示了 GPIO 输入看到并读取的理想信号。休息时信号为低（读取为 0）。按下时，信号变为高电（1），只要按钮被按下，信号就保持高电。图 10-1
    是 PiSpy 从采用去抖电路的按按钮捕捉的信号。


    ![](img/1dfed1a8285c8a59b6ea8dbd2ed7fb_117_0.png)


    **图 10-1 理想的去抖按下**


    图 10-2 显示了低质量按钮关闭的结果。你可以看到接触在时间 0 附近关闭，并随着金属触点的弹跳，多次变为高电和低电。很久之后，触点最终稳定下来。


    # 第 10 章 去抖


    ![](img/1dfed1a8285c8a59b6ea8dbd2ed7fb_118_0.png)


    **图 10-2 一对弹跳的按钮触点**


    这里是阴险之处：按钮一直在改进，所以你可以把自己的按钮连接到 GPIO，它看起来可能运行正常，至少在某些时候是这样。


    这是一个实验。将按钮连接到 +3.3V 线，另一个触点连接到 GPIO 19（或你选择的任意一个）。将 GPIO 19 (-g19) 配置为带有下拉电阻 (-pd)
    的输入 (-i)，并通过读取 (-r) 进行验证：


    ```

    $ gp -g19 -i -pd -r

    GPIO 19 = 0

    ```


    输出零确认了你的 GPIO 19 被拉低读取。当按钮连接到它时，另一端连接到 +3.3V，读取应变为高（1）。使用监控选项进行监控：


    ```

    $ gp -g19 -m0

    Monitoring..

    00000 GPIO 19 = 0

    00001 GPIO 19 = 1

    00002 GPIO 19 = 0

    ```


    如果你有良好的连接，可能在输出中看不到任何“弹跳”。这部分部分是因为运行 gp 命令的 Raspberry Pi 采样率较低（另一方面，使用 CMOS 计数器并将它们碰在一起）。这就是我的尝试结果：


    ```

    $ gp -g19 -m0

    Monitoring..

    00000 GPIO 19 = 0

    00001 GPIO 19 = 1

    00002 GPIO 19 = 0

    00003 GPIO 19 = 1

    00004 GPIO 19 = 0

    00005 GPIO 19 = 1

    00006 GPIO 19 = 0

    00007 GPIO 19 = 1

    00008 GPIO 19 = 0

    00009 GPIO 19 = 1

    00010 GPIO 19 = 0

    00011 GPIO 19 = 1

    00012 GPIO 19 = 0

    00013 GPIO 19 = 1

    00014 GPIO 19 = 0

    ```


    一次简单的鳄鱼夹接触就产生了 15 次开启和关闭事件。


