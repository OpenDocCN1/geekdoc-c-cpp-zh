    你做出的第一个决策是如何为数据采集数据。数据以 64K 字节为块进行采集。每个样本需要 4 字节（32 位），这意味着每个块中捕获了 16,384 个样本。使用非时钟的树莓派
    2，采样速率约为 80.5 ns。关于此采样率的更多信息将在后文中介绍。


    这意味着一个块的采集大约需要 1.3 ms。因此，如果你需要捕获一个 20 ms 的事件，你需要大约 20/1.3 = 16 个捕获块。


