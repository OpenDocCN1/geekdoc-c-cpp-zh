    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_99_1.png)


    图 8-4. CMOS 开关切换


    相同的输入信号被应用于 M1 和 M2 的栅极。在输出端（标记为 Out），我们看到电压从关闭切换到开启，M1 在大约 2 ms 处关闭，M2 开启。当信号在
    8 ms 处变为高电平时，输出变为低电平，循环从 12 ms 处开始重复。这对 MOSFET 相当于一个反相器。当输入为高电平时，它们产生低输出电压；当输入变为低电平时，产生高输出电压。


