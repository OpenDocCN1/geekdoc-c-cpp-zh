    DMA 提供的采样率高于内部 GPIO 控制器的读取速率。DMA 外设对 GPIO 引脚进行了过采样。


    系统的 DMA 被 pispy 用于尽可能快地捕获 GPIO 样本，这意味着它不是规律的。由于其他复杂的相互作用，CPU 对内存的访问可能会中断特定的 DMA
    访问。然而，当以低于 2 MHz 的速率采样 GPIO 信号时，你不会察觉到这种轻微的不规则性。


