  - '[PAGE 134]


    # Initializer Lists


    Maps are often used for lookup tables. The C++ 11 standard provides initializer_list
    support, to make it easy to initialize these tables. The following is an excerpt
    from the gpio.cpp code in librpi2:


    ```

    std::unordered_map<int, std::string> gpio_alto = {

    { 0, "SDA0" }, { 1, "SCL0" }, { 2, "SDA1" }, { 3, "SCL1" },

    { 4, "GCLK0" }, { 5, "GCLK1" }, { 6, "GCLK2" },

    { 7, "SPI_CE1_N" }, { 8, "SPI_CE0_N" }, { 9, "SPI_MISO" },

    { 10, "SPI_MOSI" }, { 11, "SCLK" }, { 12, "PWM0" },

    { 13, "PWM1" }, { 14, "TXDO" }, { 15, "RDO0" },

    { 16, "reserved" }, { 17, "reserved" }, { 18, "PCM_CLK" },

    { 19, "PCM_F5" }, { 20, "PCM_DIN" }, { 21, "PCM_DOUT" },

    { 22, "reserved" }, { 23, "reserved" }, { 24, "reserved" },

    { 25, "reserved" }, { 26, "reserved" }, { 27, "reserved" },

    { 28, "SDA0" }, { 29, "SCL0" }, { 30, "reserved" },

    { 31, "reserved" }; };

    ```


    Each pair of values initializes the key and value for each map entry. Isn''t that
    convenient?


    # Iterating Maps


    Iterating maps is just as easy as iterating a vector. Using the gpio_alto map
    earlier, we can iterate this using:


    ```

    for ( auto it = gpio_alto.begin(); it != gpio_alto.end(); ++it )

    printf("%d = ''%s\n",it->first,it->second.c_str());

    ```


    The only new thing here is that you must use it->first or it->second to access
    the key or value in the pair of interest.


    # References


    Let''s take a moment to discuss C++ references, as they are often used in combination
    with STL containers. Let''s use a structure for illustration purposes:


    ```

    struct s_client {

    int id;

    double balance;

    ...

    };

    s_client best_client;

    ```


    This code declares an instance of structure s_client, named best_client. Now let''s
    declare a pointer and a reference to the same data:


    ```

    s_client *ptr_client = &best_client;

    s_client& ref_client = best_client;

    ```'
