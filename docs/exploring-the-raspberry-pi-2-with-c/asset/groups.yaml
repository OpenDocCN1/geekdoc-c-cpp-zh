    # CHAPTER 6 GENERAL PURPOSE CLOCK


    To actually hear a tone in the AM receiver, you need another signal to mix with
    it. This is where the BFO comes in. When two signals mix in a nonlinear circuit,
    additional signals are generated. If the lowest frequency is F1 and the upper
    frequency is F2, then you get additional by-products from the original two inputs.
    The strongest four signals will be as follows:


    +   - F2 - F1 frequency

    - F1 frequency

    - F2 frequency

    - F1 + F2 frequency


    Other products in diminishing strength are also present, but the most interesting
    by-product is the L-R signal. Let''s put some numbers to it.

    Assume that your BFO (Raspberry Pi) is producing a frequency of 455 kHz exactly
    and that signal is leaking into your AM demodulator stage somehow. Let''s also
    assume that you''ve tuned the CW signal so that it gets down-converted in your
    receiver to about 452 kHz. Subtracting F1 from F2 leaves a difference of 3,000
    Hz (3 kHz). This is an audio frequency that your audio amplifier can amplify and
    provide on the speaker. The other components like F1, F2, and F1+F2 are discarded
    (these are much too high to be amplified by an audio amplifier).


    Figure 6-2 is a picture of an old AIMOR TR-105 field radio that I purchased from
    a ham radio flea market years ago. You can even see the dust that has collected
    on the top of this (shame on me). What I''ve done here is tuned to a short wave
    band where there was some CW activity. Listen for some dot and dash pulsing.


