    # Matrix::display


    To display a bar graph row on the Matrix display, use the display() method:


    ```

    int display(int row,int v07);

    ```


    The function returns zero upon success or a system error code upon failure.

    The row argument selects the matrix row (0 through 7), while argument v07 selects
    the bar graph height

    (0 through 8). A value of zero displays a blank row, while values of 1 through
    8 show the corresponding

    number of LED pixels in a bar graph. The following example illustrates how to
    display a bar graph in row 3

    with a height of 4 LED pixels:


    ```

    Matrix matrix(16,26,21);

    int rc;

    ```


    ```

    rc = matrix.display(3,4); // row 3 bar graph is 4 pixels high

    assert(!rc);

    ```


    # Matrix::Pi


    When the mtop command exits, it leaves the Matrix display showing a π (Pi) symbol.
    It does so by invoking

    the Pi() method:


    ```

    int Pi();

    ```


    The method returns zero when successful or a system error code when it fails.
    An example is

    shown below:


    ```

    Matrix matrix(16,26,21);

    int rc;

    ```


    ```

    rc = matrix.Pi();

    assert(!rc);

    ```'
