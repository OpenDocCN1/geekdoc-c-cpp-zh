    \ is simultaneous with the last clock, but it actually follows the clock by a\
    \ microsecond or more. According to Maxim, the LOAD rising edge can occur simultaneous\
    \ with the CLK or follow, but must occur *before* the next rising clock.\n\n##\
    \ CPU Meter\n\nTo further enhance the CPU utilization display, we can use a 1\
