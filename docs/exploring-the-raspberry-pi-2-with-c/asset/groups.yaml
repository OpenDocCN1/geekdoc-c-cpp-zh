    # Raspberry Tools


    You will also need to download some tools for use later. You could do this in
    another terminal session, while you wait for the kernel sources to download:


    ```

    $ cd

    ```


    ```

    $ git clone https://github.com/raspberrypi/tools.git

    ```


    When completed, you can optionally eliminate what you don’t need. These were the
    subdirectories files I created. I deleted the others to save space:


    ```

    $ cd ~/

    ```


    ```

    $ ls -F

    configs/ mkimage/ sysdk usboot/

    ```


    # Prepare Configuration


    Now the kernel sources must be prepared and a configuration imported (current
    directory is ~linux):


    ```

    $ make mrproper

    ```


    ```

    $ zcat /proc/config >.config

    ```


    The second step involving zcat decodes and decompresses the kernel options you
    are currently using into the ~linux/.config file. This saves you a lot of trouble
    trying to duplicate what you already have. If the kernel sources you downloaded
    support options, you will be asked about them later.


    # # Build Configuration


    At this point, we need to build a configuration. The most convenient way to do
    this is to use the make target oldconfig. This avoids having to answer questions
    about options you are already using (from /proc/config). It will, however, ask
    about any new options. Press Return to accept the default if you like, which is
    the safest choice.


    ```

    $ oldconfig

    HOSTCC scripts/basic/fixdep

    HOSTCC scripts/kconfig/conf.o

    SHIPPED scripts/kconfig/conf.tab.c

    SHIPPED scripts/kconfig/conf.lex.c

    SHIPPED scripts/kconfig/hash.c

    HOSTCC scripts/kconfig/conf.tab.o

    HOSTLD scripts/kconfig/conf

    scripts/kconfig/conf --oldconfig Kconfig

    #

    # configuration written to .config

    #

    ```


    # CHAPTER 4 INSTALLING A KERNEL


    If you want to double-check the kernel version before you start the compile process,
    you can perform:


    ```

    $ make kernelversion

    3.18.13

    ```


    The kernel version is recorded in the first few lines of the top-level Makefile:


    ```

    $ head -s Makefile

    VERSION = 2

    PATCHLEVEL = 18

    SUBLEVEL = 13

    EXTRAVERSION = =

    NAME = Diseased Newt

    ```


    Now is a good time to make sure your updated files are physically written out
    to the SD card:


    ```

    $ sync

    ```


    # Kernel Compile


    The original Raspberry Pi model B takes a very long time to compile the kernel
    (it has been reported to take 22 hours!). However, the model B 2 with its extra
    memory and four CPU cores can build the kernel in about 2 hours if you use the
    correct make command options.


    If you have the mtop command installed and operational, now would be an excellent
    time to be watching the Pi in action. You can start it with its default GPIO assignments,
    or add command line arguments to specify your GPIO arrangement


    ```

    $ mtop &

    ```


    The ampersand allows the mtop command to run in the background as you work in
    the current terminal session. Figure 4-1 shows the matrix driven by mtop during
    a kernel compile. Three of four CPUs are at 100% utilization (left four columns),
    the memory is fully utilized (mostly by disk cache), and the right column shows
    the SD card I/O activity. The second and third last columns are paired to show
    total CPU utilization.


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_50_0.png)


    **Figure 4-1.** *mtop driving the Matrix during a kernel compile*


    If you don''t have the Matrix hardware ready to run yet, you can install htop
    and run instead (in a separate session):


    ```

    $ sudo apt-get install htop

    $ htop

    ```


    Because you have four CPU cores, the Linux kernel build process can take advantage
    of that to speed things along. There will be times during the build where a process
    is held up for I/O or something else.

    I recommend that you build the kernel using the **make** option -j6. This tells
    **make** to run six parallel "make jobs" instead of one. This way when processes
    are waiting for I/O, the cores can work on the other processes that are now ready.


    If you forget the -j6 option, the build will take many hours longer. So if you
    forget it, press ^C and restart with the added option. The build process should
    pick up where it left off:


    ```

    $ make -j6

    scripts/kconfig/conf --oldconfig Kconfig

    CHK include/config/kernel.release

    UPD include/config/kernel.release

    WRAP arch/arm/include/generated/asm/auxvec.h

    WRAP arch/arm/include/generated/asm/bitsperlong.h

    WRAP arch/arm/include/generated/asm/cputime.h

    WRAP arch/arm/include/generated/asm/current.h

    ...

    ```


    # Modules Build


    Now that the kernel has been compiled, it is time to build and install the kernel
    modules. The modules are compiled as follows (this takes about 5 minutes):


    ```

    $ make -j6 modules

    CHK include/config/kernel.release

    CHK include/generated/uapi/linux/version.h

    CHK include/generated/utsrelease.h

    make[1]: ''include/generated/mach-types.h'' is up to date.

    CALL scripts/checksyscall.sh

    Building modules, stage z.

    MODPOST 1328 modules

    ```


    Because we''re not cross-compiling, we can install the modules simply by:


    ```

    $ sudo make modules install

    INSTALL arch/arm/crypto/aes-arm-bs.ko

    INSTALL arch/arm/crypto/aes-arm.ko

    INSTALL arch/arm/crypto/shai-arm-neon.ko

    INSTALL arch/arm/crypto/shai-arm.ko

    INSTALL arch/arm/crypto/sha512-arm-neon.ko

    INSTALL arch/arm/lib/xor-neon.ko

    INSTALL arch/arm/oprofile/oprofile.ko

    INSTALL crypto/ablk_helper.ko

    INSTALL crypto/arc4.ko

    ...

    INSTALL /lib/firmware/keyspan_sda/keyspan_sda.fw

    INSTALL /lib/firmware/keyspan_sda/xircom_pgs.fw

    INSTALL /lib/firmware/cpia2/stv0672_vp4.bin

    INSTALL /lib/firmware/yam/1200.bin

    INSTALL /lib/firmware/yam/960.bin

    DEPMOD 3.18.13-v7+

    ```


    The last line of the session output confirms the release that we are installing.
    When we examine the /lib/modules directory, we see a new subdirectory (underlined)
    was created and populated for 3.18.13-v7:


    ```

    $ ls /lib/modules

    3.18.11-v7+ 3.18.13-v7+ 3.18.7+ 3.18.7-v7+

    $

    ```


