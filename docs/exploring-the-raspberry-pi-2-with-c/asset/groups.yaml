    \ pct_io(). As it samples the system, if it encounters more I/O time (provided\
    \ in milliseconds), the object keeps track of that as a new maximum. In this way,\
    \ a percentage of I/O can be calculated and returned.\n\nThe obvious result of\
    \ this approach is that early I/O readings will be inflated until early higher\
    \ maximums have been observed. Keep in mind that this facility is meant for a\
    \ MTop display result, rather than accurate accounting.\n\n# APPENDIX G\n\n# Other\
    \ librpi2 Classes\n\nThere are other librpi2 classes that advanced users may find\
    \ useful. These are used directly and indirectly by the PiSpy application:\n\n\
    - librpi2/mailbox.hpp: Kernel Mailbox facilities\n- librpi2/dmam.hpp: DMA Memory\
    \ allocation\n- librpi2/dma.hpp: DMA Register Definitions\n- librpi2/rpdma.hpp:\
    \ DMA Allocation Definitions\n- librpi2/logana.hpp: Logic Analyzer class\n- librpi2/vcdout.hpp:\
    \ VCD signal output class (VCD_Out)\n\nThese classes are rather advanced for casual\
    \ use. Yet they are the facilities that the PiSpy utility was built from.\n\n\
    # DMA Allocation\n\nDMA allocation under Linux is impossible (for the Raspberry\
    \ Pi at least) from a user mode application. PiSpy manages to allocate a DMA with\
    \ the aid of a kernel Linux module (provided with this book). The source code\
    \ for the driver is found in:\n\n- knmodules/rpdma/rpdma.c\n- include/rpdma.h\n\
    \nOnce the rpdma kernel module is loaded, PiSpy is able to open the module as\
    \ /dev/rpdma. Once the driver is opened, ioctl(2) calls are used to:\n\n1. Request\
    \ (allocate) a DMA channel\n2. Release a previously allocated DMA channel\n3.\
    \ Inquire about the DMA interrupt count that has been serviced\n\nThe rpdma kernel\
    \ module is able to make function calls to perform DMA allocation and release,\
    \ so you can use the module as an agent for land purposes. The third function\
    \ for inquiring about interrupt counts prevents PiSpy to gauge the sampling process.\n\
    \nThe DMA resource is precious within the Linux kernel. Should all DMA channels\
    \ get used up, the kernel will seize up at some point. So it is vital that any\
    \ allocated DMA be released when no longer needed.\n\n# APPENDIX G OTHER librpi12\
    \ CLASSES\n\nAs a side benefit of opening /dev/rpdma, the application (PiSpy)\
    \ can crash and yet reliably release any held DMA facilities. This works because\
    \ the kernel will automatically close all open file descriptors for the executing\
    \ program. When the /dev/rpdma driver is closed, the driver is able to release\
    \ any resources it held, including the allocated DMA channel and registered interrupt.\
    \ This provides kernel safety, even though you are using DMA from user land.\n\
    \nOnce the DMA channel is used, the PiSpy utility manipulates the DMA control\
    \ block and peripheral, through definitions found in librlp12/dma.hpp.\n\n# Warning\n\
    \nWhen doing development on kernel modules and working with the DMA peripheral,\
    \ expect some accidental crashes and seizures. The impact of a crash is usually\
    \ that your file changes have not been flushed out to the SD card. So prior to\
    \ performing a dangerous test, you should always precede this with the sync command:\n\
    \n```\nsync\n```\n\nThis causes your system to write out any unsaved changes.\
    \ If you have MTop running, you'll see that the I/O jumps up while this executes.\
    \ Sometimes do this twice to be sure.\n\n# Index\n\n**A**\n- absolute maximum\
