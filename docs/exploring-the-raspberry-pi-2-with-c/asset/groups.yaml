    ## CHAPTER 1


    ### Introduction


    The introduction of the Raspberry Pi 2 has ushered in exciting new opportunities.
    No longer is the software limited to one CPU core, but now executes on. Memory
    has doubled to 1 GB, providing a larger disk cache and resulting in better SD
    card performance. This also leaves room for larger applications. Having four built-in
    USB ports is also helpful in avoiding the need for a USB hub.


    Some things have changed under the hood, like the physical address for peripherals.
    The address BCM2708_PERI_BASE has changed from 0x20000000 to 0xF3F0000 for the
    Raspberry Pi 2. This means that a lot of software written for the earlier Raspberry
    Pi models will not work on the Pi 2 without changes. With device tree (DT) support
    built in Raspberry Linux, it is now a simple matter to automatically detect it.
    Consequently, the included libgpi2 class detects it. To this end,


    The main purpose of this book is to exploit the Raspberry Pi 2. To that end, this
    book comes with possible to access the GPIO on your Pi easier. Demand C++ libraries
    will make it possible to access the GPIO and other peripherals with only a few
    lines of code. Command line tools like the gg command will give you simply and
    ready to list your GPIO state and make changes. A feature of GPIO also allows
    a pin to be "monitored" for changes, making testing inputs easier. All installed
    tools include their own self-help display on command.


    A Raspberry Pi 2 designer is handicapped without any logic analyzer for tracing
    pins. For this reason, I feel that the reader should have to use one. This book
    provides you with a software-based logic analyzer for free (it requires no extra
    hardware). The PiSpy logic analyzer is able to see all GPIO inputs and outputs
    and records events to a file.


    The C++ programming language was chosen for this book to make your life easier.
    The C programmer need not fear this because I''ve kept to the basics without using
    language elements. Many Arduino use C++ every day without knowing it. The standardization
    efforts of the last decade have had a very positive effect on g++ and libc. And
    this availability of the Standard Template Library (STL) in glibc makes it a very
    productive environment for which to program.


    I''ve used a hybrid approach to the C++ code. I continue to use the well-understood
    I/O (stdio) routines like printf so that the code is easy to read and understand.
    I know that C++ purists will "tsk off about this, but this is a practical book
    rather than a computer science text.


