- md: "\n## Container std::vector\n\nThe vector is the easiest container to start\
    \ with. Think of all the problems you normally have with ordinary arrays:\n\n\
    - How large should I make it?\n- What is the maximum size?\n- Do I need to resize\
    \ it?\n- Where do I keep track of its dynamic size (if it can be resized)?\n-\
    \ Did I remember to free the dynamic storage when I was done with it?\n\nAll of\
    \ these problems vanish when you use the std::vector container. The std::vector\
    \ is a class that wraps around an array and manages its memory space and size.\n\
    Use a vector to hold an int type, simply include the header file and declare it.\
    \ The type of the member is specified by the C++ template angle brackets.\n\n\
    ```cpp\n#include <vector>\nstd::vector<int> myvec;\n```\n\nWhen first constructed,\
    \ the vector myvec is empty.\nTo add an int value to vector, use the method push_back:\n\
    \n```cpp\nmyvec.push_back(99);\n```\n\nThis internally resizes the array that\
    \ holds the values to be large enough to hold one more value and adds the value\
    \ to it. The actual size of this internal array might be 8 initially, the object\
    \ myvec knows that its current size is now 1. If you keep adding values, the object\
    \ could double its capacity to 16 internally to allow for growth, when you add\
    \ the ninth value. This is a detail you don't need to be concerned about.\n\n\
    To access the value of myvec, you can use the usual subscripting syntax:\n\n```cpp\n\
    int first_value = myvec[0];\n```\n\nThe nice thing about std::vector is that you\
    \ don't have to worry about allocating memory or resizing the array if you add\
    \ more values. When the object myvec goes out of scope, the storage associated\
    \ with myvec is automatically freed, thanks to the built-in destructor. No more\
    \ memory leaks!\nOnce you have a vector, you often need to iterate it; that is,\
    \ visit each entry as it is an array. With the vector, there are two ways to do\
    \ this. The first is nearly identical to the C language way, using subscribing.\
    \ The main idea is that you get the current size of the vector from myvec.size():\n\
    \n```cpp\nfor ( size_t x=0; x<myvec.size(); ++x ) {\n  printf(\"%d = %d\\n\",\
    \ x,myvec[x]);\n}\n```\n\nFrom this, you can see how naturally the std::vector\
    \ replaces an array. The template argument allows you to specify other data types,\
    \ you can declare objects of other types including struct and class. We haven't\
    \ covered strings yet, but the C++ way to create an array of strings is:\n\n```cpp\n\
    std::vector<std::string> myvec;\n```\n\n## CHAPTER 11 C++ QUICK START\n\nWe examine\
    \ strings later on so that we can remain focused on containers. Sometimes, you'll\
    \ need to access the underlying array so that you can pass it to a C language\
    \ function. This can be done using the myvec.data() method. Suppose your C language\
    \ function uses the following function prototype:\n\n```cpp\nextern void my_c_func(int\
    \ *int_array, unsigned count);\n```\n\nThis function can be passed the contents\
    \ of the array with myvec by:\n\n```cpp\nmy_c_func(myvec.data(),myvec.size());\n\
    ```\n\nThe data() method makes certain that the internal array std::vector is\
    \ contiguous and returns the starting address to it. We also supply myvec.size()\
    \ to the function so that the function knows the actual length of the array. As\
    \ a note of caution, if you add or delete members from the vector, the internal\
    \ array can be reallocated. Consequently, you must reacquire the actual array\
    \ address by calling the method data() again, if changes have been made to the\
    \ vector object.\n\n## STL Iterators\n\nThe second way to loop through the vector\
    \ involves iterators. This sometimes frightens people away, but bear with me.\
    \ These are not only simple to understand, but easy to use. We'll also see that\
    \ the C++ 11 standard has them even easier to use before. If your container is\
    \ std::vector<int>, then the iterator is just std::vector<int>::iterator. In other\
    \ words, it is the same as the container declaration but with ::iterator appended\
    \ to it. So, far it is not too bad, it is just syntax. Conceptually, you can imagine\
    \ iterators as just being some elaborate kind of pointer. They do point to something\
    \ (or to the “end”). How these are actually implemented on your platform (Raspberry\
    \ Linux in your case) should be ignored. Use them as conceptual pointers. All\
    \ containers have the following methods to provide iterator values:\n\n- container.begin()\n\
    - container.end()\n\nThe begin() method returns an iterator that points to the\
    \ first entry in the container (if there is one). The end() method returns iterator\
    \ representation marking the end of the container. If the container is empty,\
    \ then begin() returns the same value as end(). Now let's look at the verbose\
    \ C++ iterator loop for myvec:\n\n```cpp\nfor ( std::vector<int>::iterator it\
    \ = myvec.begin(); it != myvec.end(); ++it ) {\n  printf(\"myvec[] = %d\\n\",*it);\n\
    }\n```\n\nThe first iterator is initialized with the value myvec.begin() in the\
    \ loop. The loop continues as long as the iterator is not equal to the end().\
    \ At the bottom of the loop, the iterator is incremented (++it) so that it points\
    \ to the next item in the container. Within the for loop, the vector entry is\
    \ accessed by using the asterisk of the iterator name (*), as if it was a pointer.\
    \ The iterator's method operator*() is used to get the value. The iterator's method\
    \ operator++() is used to move to the next item.\n\n## CHAPTER 11 C++ QUICK START\n\
    \nOnce you have a vector, you often need to iterate it; that is, visit each entry\
    \ as it is an array. With the vector, there are two ways to do this. The first\
    \ is nearly identical to the C language way, using subscribing. The main idea\
    \ is that you get the current size of the vector from myvec.size():\n\n```cpp\n\
    for ( size_t x=0; x<myvec.size(); ++x ) {\n  printf(\"%d = %d\\n\", x,myvec[x]);\n\
    }\n```\n\n... (remaining text processed and merged based on logic provided)\n"
