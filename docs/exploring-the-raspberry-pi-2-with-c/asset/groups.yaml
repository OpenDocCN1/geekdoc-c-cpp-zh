    The CLOCK column just indicates that a PWM clock is involved (it is actually shared
    between both PWM peripherals). The PWM0 peripheral is accessed from GPIO 12 or
    18, and PWM1 is accessed by 13 and 19.

    Although not immediately obvious, GPIO 18 is currently operating as a PWM output
    (from PWM0).

    This can be verified by using the command:


    ```

    $ gp -C

    GPIO    ALTO    ALT1    ALT2    ALT3    ALT4    ALT5

    0       SDAO    SA5 (reserved) -       -       --

    1       SCLO    SA4 (reserved) -       -       --

    ...snip...

    18      PCM_CLK SD10 (reserved) BSCL SDA/MOSI SPI1_CEO_N PWM0

    ...snip...

    31 (reserved) SA2     PCM_DOUT RTS0    -       TTS1

    ```


    From this displayed chart, we are reminded that GPIO 18 requires ALT5 to access
    the PWM peripheral. The column marked C for the PWM output, is of two values,
    as shown in Table 7-1.


    ## Table 7-1. Possible Values for Column C Output


    | C Value | Description |

    | --- | --- |

    | - | Not in PWM peripheral mode |

    | C | Clock (this displays from the gpio command only) |

    | P | PWMx peripheral |


    The DIVI, DIVE, and MASH values are the PWM clock''s divisor values as explained
    in Chapter 6. The ENAB column indicates Y if the clock has been enabled. SRC indicates
    the clock''s oscillator source. The M and S columns indicate the mark and space
    values from the PWM peripheral (not its clock). The M/P column indicates which
    mode the PWM peripheral is operating in, as shown in Table 7-2.


    ## Table 7-2. M/P Values


    | M/P | Description |

    | --- | --- |

    | M/S | Mark/Space |

    | PWM | Pulse width mode |


    The E column contains Y if the PWM peripheral has been enabled.

    The S/P column indicates which PWM mode the peripheral is in, as shown in Table
    7-3.


    ## Table 7-3. S/P Values


    | S/P Value | Description |

    | --- | --- |

    | Ser | Serial data mode |

    | PWM | Pulse width modulation mode |


    ## CHAPTER 7 ■ PULSE WIDTH MODULATION


    The R column indicates whether the last data value should be repeated or not (when
    data is required).

    AY indicates that the last value used should be sent again if the FIFO is empty
    or data has not supply.

    The S column indicates the starting bit value for the PWM peripheral (0 or 1).
    The I column indicates Y if the data is to be inverted on, or N for normal polarity.

    The last column, F indicates the data source, as shown in Table 7-4.


    ## Table 7-4. F Values


    | F Value | Description |

    | --- | --- |

    | F | Data is written to FIFO |

    | D | Data is written to PWM peripheral |


    The command also lists a legend, and the options that can affect the configuration
    of the peripheral (when not just displaying information), as shown in Table 7-5.


    ## Table 7-5. Configuration Parameters


    | Parameter | Option | Description |

    | GPIO | -g gpio_pin | Selects PWM peripheral |

    | DIVI | -i divi | Sets the PWM clock''s DIVI parameter |

    | DIVF | -i divf | Sets the PWM clock''s DIVF parameter |

    | MASH | -m mash | Sets the PWM clock''s mask parameter |

    | ENAB | -c | PWM clock is enabled |

    | SRC | -s src | Choose the PWM''s oscillator source |

    | M | -M Mark | Sets mark value for mark space PWM signals |

    | S | -S space | Sets space value for mark space PWM signals |

    | M/P | -A arg | Choices M/s (m) or PWM mode (p) |

    | E | -no z option | Enables PWM peripheral |

    | S/P | -b | Serialize when -b else PWM mode |

    | R | -R | Repeats when -R used |

    | S | -Z n | Initial state of signal is n (0 or 1) |

    | I | -I | Invert signal when -I used |

    | F | -F | Use FIFO when -F used |


    For completeness, the few extra options are shown in Table 7-6.


    ## Table 7-6. Additional Options


    | Option | Description |

    | --- | --- |

    | -D | Display PWM peripheral status information (no configuration is performed)
    |

    | -v | Verbose: show additional messages |

    | -z | Stop the select PWM peripheral (selected by gpio option -g) |

    | -h | Show help information |


    ## PWM Modes


    If you''ve paid close attention or have some experience with the Raspberry Pi
    PWM peripheral, you know that there are two different applicable modes:


    - 1. M/S and PWM mode

    - 2. Serial or PWM data


    Let''s take a closer look at this.


    ## M/S and PWM Data Mode


    In M/S mode, the signal consists of cycles of mark and space. The mark (1) signal
    is sent with a length M, and the space (0) signal is sent with a length S-M (S
    is the length of the entire cycle). Figure 7-1 illustrates the relationship between
    M and S (for a noninverted signal).


    ![](img/1dfed1a8285c8a59b56ea8db2ed73fb_90_0.png)


    Figure 7-1. M/S signal


    The value S specifies counter value for the entire length of the cycle. The value
    M determines how many counts of the clock the signal will be high (1) for a noninverted
    signal. Once the count of M is reached, the signal goes low (0) until the count
    of S is reached.


    ## M/P = M/S Mode (-Am)


    From Chapter 6, we know that DIVI count of 192 generates 100 kHz clock from 1.2
    MHz oscillator source:


    ```

    DIVI = clock_src / F = 19,200,000 / 100,000 = 192

    ```


    Using the pwm command, we set the PWM0 to use this frequency (-i192), specifying
    PWM0 with GPIO 12 (-g12), we use DIVF = 0, mask = 0 source (-s1), mode M/S (-Am),
    initial state of zero (-0), and start the PWM clock (-c). Furthermore, we set
    mark count to 30 (-M30) out of maximum count 100 (-S100). With the M and S values,
    expect to see a signal on 30% of the time:


    ```

    $ pwm -g12 -i192 -f0 -s1 -Am -Z0 -c -M30

    ```


    Once the PWM peripheral should be started and running. This can be verified with:


    ```

    $ pwm -D

    ```


    | CLOCK | ALT | DIV | MASH | ENAB | SRC | M/P | E | R | I | F |

    | --- | --- | --- | --- | --- |--- | --- | --- | --- | --- | --- |

    | PIOCK | 12 | 192 | 0 | Y | Oscillator | M/S | Y | | | D |

    | PIOCK | 12 | 192 | 0 | Y | Oscillator | M/P | N | | | D |

    | PIOCK | 18 | 192 | 0 | Y | Oscillator | M/S | Y | | | D |

    | PIOCK | 19 | 192 | 0 | Y | Oscillator | M/P | N | | | D |


    Checking the line for GPIO 12, we see that DIVI = 192, DIVF = 0, MASH = 0, ENAB
    = Y, SRC = Oscillator (19.2 MHz), M/P = M/S, E = Y, S/P = PWM, S = 0. These displayed
    parameters match what we configured PWM0 to be. With the PWM peripheral working
    now, we can see it with pwm:


    ```

    $ pwm -b3

    ```

    Captured: writing.vcd


    > Note Chapter 9 looks at pwm in detail. The GtkWave viewer should automatically
    open after capture. The top left window titled Signal, click to highlight it.
    This causes available signal traces to appear in the subwindow below. Click gpio12
    (for this example) and drag it with your mouse to the Signals window just to the
    right, to display its trace. Finally, click the magnifying glass with the square
