    \ by using a C++ reference instead:\n\n```\nfor ( auto it = clients_map.begin();\
    \ it != clients_map.end(); ++it ) {\n    client.balance &client = it->second;\n\
    \nclient.balance -= some_adj;\n}\n```\n\nNow we can access members of client as\
