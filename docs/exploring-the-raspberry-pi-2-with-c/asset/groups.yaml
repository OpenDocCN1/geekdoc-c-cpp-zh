    ## 瞬间去抖


    在《Mastering the Raspberry Pi (Apress, 2014)》一书中，使用 CD4013 触发器电路对按钮或开关进行去抖。然而，对于按钮来说，触发器电路并不方便，因为它同时需要常开和常闭触点。这会导致更高的成本和额外的接线。


    一种更简单且经济的解决方案如图 10-3 所示，使用了施密特触发器（本例中为 CD40106）。按钮由 S1 表示，连接到电阻 R1 和电容 C1。这些元件与
    IC1A 的施密特触发作用共同，在 OUT 处产生清晰的去抖输出信号。由于它是一个反相器，在按下按钮时会产生输出。这种六路反相器的优势在于可以用一个的价格获得六个。


    ![](img/1dfed1a285c8a59b6ea8db2ed3fb_19_png)


    **图 10-3。** 瞬间按钮去抖电路


    ## 切换去抖


    开关的购买和安装可能很昂贵。相比之下，按钮有时很廉价。如果你能够使用按钮来切换信号，你可以将按钮作为开关。图 10-4 展示了使用 CMOS 器 CD4049
    可靠地实现此点的简单方法。


    ![](img/1dfed1a285c8a59b6ea8db23fb_20_png)


    第 10 章 去抖


    CD4049 是一个简单的反相器，但结合 R2 和 C1 以及反馈电阻 R1 使用时，按钮 (S1) 可用于切换。输出可以从 IC1A（引脚2）或 IC1B（引脚4）获取。在使用图
    10-4 所示的电路时，通常需要给用户提供某种反馈。如果 Raspberry Pi 应用在屏幕上显示了某些视觉反馈，则不需要进一步的操作。然而，如果没有这些信号，用户将不知道输入是开启还是关闭。图
    10-5 显示了该问题的另一种解决方案，代价是更多的元件。在这个电路中，切换功能仍然由 IC1A 和 IC1B 提供。LED 由另一个反相器 IC2A 驱动，信号由
    IC2B 驱动。如果你更喜欢，这些额外的反相器可以从 IC1 引出。


    ![](img/1dfed1a285c8a59b6ea8db23fb_21_png)


    **图 10-5。** 带有缓冲和 LED 指示的切换按钮


    该电路特别值得注意的是 LED是在没有限流电阻的情况下驱动的。通常需要一个限流电阻，这是一个良好的做法。在这里，你可以省略它，因为电路（用于 Raspberry
    Pi）将在 3.3V 下运行。此外，CMOS 输出将被 IC2A 能够提供的电流限制在 4mA 以内。因此，请确保为目的选择一个小电流 LED。


    ## MC1490


    接触抖问题严重到需要专门为此设计的芯片。ON 半导体的数据表显示 MC1490（也称为 CD4490）是一个 CMOS 器件，可以在 0V 到 5V 之间工作。再次，3.3V
    操作对于这些芯片相比其他逻辑门是理想的。


    MC1490 的工作原理是它以间隔采样输入。如果移位寄存器采样为零（按下），输出为低电平（0）。相反，如果移位寄存器采样为高（打开），输出变为高电平（1）。输入处的抖动在输出端被忽略。


    图 10-6 显示了一个带有两个按钮的电路（一个用于去抖，等等）。MC1490 内部带有上拉电阻，不需要外部电阻（用于静态处理）。


    ![](img/1dfed1a285c8a59b6ea8db23fb_22_png)


    **图 10-6。** MC1490 接触消除器


    采样频率由电容 C1 决定。数据手册提供了给定采样频率的公式。对于 15 Hz 的采样频率，ON 半导体提供的公式为 $15 = 6.5/C$，其中 $C$
    的单位为 $\mu F$。求解 $C_t 得到 $C_t = 6.5/15$，即 0.43 $\mu F$。下一个标准尺寸电容是 0.47 $\mu F$。因此，0.47
    $\mu F$ 的电容应该产生 13.8 Hz 的采样频率。可能需要一些实验。请记住许多电容的公差高达 30%。


    在自己的实验中，我没有那个，所以我尝试了 0.02 $\mu F$ 的电容。它产生了较高的采样频率，这会对故障更敏感，但证明了整体运行没有问题。


    使用 PiSpy，我能够采样引脚 9。由于振荡频率较低，你需要较长的采样周期。我选择使用 48 来进行采集。查看图 10-7 中的波形，可以看到波形约为 32
    ms。取其倒数得到大约 31.25 Hz 的频率（使用 0.02 $\mu F$ 的电容）。


    ```

    $ pyspy -b48 -R19 -T9

    Captured: writing.vcd

    ```


    ![](img/1dfed1a285c8a59b6ea8db23fb_23_png)


    **图 10-7。** MC1490 的 OSC_out（引脚9）的 PiSpy 采集


    要测试按钮动作，将按钮 S1 连接到图 10-6。将去抖后的 AO 连接到 GPIO 19。GPIO 19 启动为输入，但在建立连接之前，确保它通过 -i
    处于输入模式（-pu 添加上拉电阻，这应该是默认的）。


    以下命令为 GPIO 19 插入输入 (-i) (-g19)，添加上拉电阻 (-pu)，并监控该 GPIO (-m0)。一旦 `gp` 命令开始监控，你就能够获得干净的按钮事件了。我的会话如下：


    ```

    $ gp -g19 -pu -m0

    Monitoring..

    00000 GPIO 19 = 1

    00001 GPIO 19 = 0

    00002 GPIO 19 = 1

    00003 GPIO 19 = 0

    00004 GPIO 19 = 1

    00005 GPIO 19 = 0

    00006 GPIO 19 = 1

    00007 GPIO 19 = 0

    00008 GPIO 19 = 1

    ```


    我使用的按钮在电气术语上是个真正的次品，但它的表现非常出色。图 10-8 展示了我在 Raspberry Pi 2 工作站末端的面包板测试。这个电路非常容易在面包板上搭建，你应该亲自尝试一下。它只需要
    3.3V 电源（来自 Pi）、地、一个电容和一个按钮。输出直接连接到 GPIO 输入。


    ![](img/1dfed1a285c8a59b6ea8db23fb_24_png)


    **图 10-8。** MC1490 按钮测试的面板设置


    在购买此零件时，多买几个（建议买五个）。这种情况并不经常发生，但有时你会买到坏件（或者它会变成坏件）。当你准备就绪却发现零件是坏的时，最是最令人失望的。由于你将其连接到
    Pi 的输入，请确保从 3.3V 电源为 MC1490 电（而不是 5V 电源）。


    '
