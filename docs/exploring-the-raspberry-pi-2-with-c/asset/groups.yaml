    # CHAPTER 12 ■ MULTICORE WEB SERVER


    The request ends by calling worker.send_reply() with the response code (200) and
    a message text ("OK").


    The requests supported by piweb include these basic ones:


    +   - /cpuinfo: Displays /proc/cpuinfo

    - /gpio: Displays GPIO status

    - /shutdown: Shuts down the web server (this should be disabled in a production
    server to prevent abuse)


    Any other request just gets this response:


    +   - Path: /some/wild_request

    - URI: /some/wild_request

    - Thread: 2


    The /gpio request produces a result like this:


    | GPIO | ALTFUN | LEV | SLEW | HYST | DRIVE | DESCRIPTION |

    |---|---|---|---|---|---||

    | 0 | Input | 1 | Y | Y | 8 mA | Input |

    | 1 | Input | 1 | Y | Y | 8 mA | Input |

    | 2 | Alt0 | 1 | Y | Y | 8 mA | SDA1 |

    | 3 | Alt0 | 1 | Y | Y | 8 mA | SCL1 |

    | 4 | Input | 1 | Y | Y | 8 mA | Input |

    | ... | | | | | | |

    | 26 | Output | 0 | Y | Y | 8 mA | Output |

    | 27 | Input | 0 | Y | Y | 8 mA | Input |

    | 28 | Input | 1 | Y | Y | 16 mA | Input |

    | 29 | Input | 1 | Y | Y | 16 mA | Input |

    | 30 | Input | 0 | Y | Y | 16 mA | Input |

    | 31 | Output | 1 | Y | Y | 16 mA | Output |


    # Permissions


    Network ports less than 1024 require root privileges to create and listen on.
    For this reason, piweb server is built with setuid root. Running the web server
    on port 1024 or higher does not require root privileges, 8080 being a popular
    choice. To list the GPIO settings (with path /gpio), though, you will need root
    access because of the GPIO class access to kernel memory.


