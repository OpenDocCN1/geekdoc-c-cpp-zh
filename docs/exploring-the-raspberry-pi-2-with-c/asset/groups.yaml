    \ automatically so you won’t have to think about it.\n\n## CHAPTER 4 INSTALLING\
    \ A KERNEL\n\n## Disk Space\n\nFor this procedure, it is recommended that your\
    \ Pi SD card is 8 GB or larger. If you are using a smaller capacity card, you\
    \ might need to use a USB attached disk drive or a USB memory stick. The procedure\
    \ outlined in this chapter assumes that you are operating out of the pi account\
    \ on the root file system.\n\n## Downloading the Source\n\nA given branch of the\
    \ kernel release can be quite large in terms of. If you don't need a specific\
    \ version of the kernel, the most way to download it is to use the following command\
    \ (with the depth set to one), which creates a subdirectory .linux in your home\
    \ directory:\n\n```\n$ cd\n```\n\n```\n$ pwd\n/home/pi\n```\n\n```\n$ df . # Check\
    \ space available\nFilesystem 1K-blocks Used% Mounted on\n/dev/root 7319248 4138492\
    \ 2836724 60 %\n```\n\n```\n$ git clone --depth 1 git://github.com/raspberrypi/linux.git\n\
    Cloning into 'linux'\nremote: Counting objects: 51221, done.\nremote: Compressing\
