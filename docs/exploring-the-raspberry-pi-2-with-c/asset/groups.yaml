    \  }\n}\n```\n\n失败的常见原因是缺少权限。直接访问 GPIO 寄存器需要将物理寄存器映射到你的进程地址空间。这是一个特权操作，需要 root\
    \ 权限。你可以通过执行以下操作为程序授予 root 权限：\n\n```bash\n$ sudo chmod root program\n$ sudo chmod\
    \ u+ program\n```\n\n如果你计划在代码多处使用 GPIO，可能希望将 GPIO 实例设置为全局而不是局部（如之前的示例所示）。如下代码片段所示：\n\
