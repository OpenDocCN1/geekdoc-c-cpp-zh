    # Setting GPIO Output


    A GPIO can have its output level set using the gp command. The following sets
    GPIO 4 to a low (0) level:


    ```

    $ gp -g4 -s0

    ```


    In this example, the GPIO 4 is assumed to be previously configured as an output.
    Note that if the GPIO is not configured to be an output, the value can be established
    anyway. It will simply not be available at the GPIO pin.


    # Reading GPIO Input


    The gp command can read a GPIO input. The following example configures GPIO 4
    as an input, configures the pulldown resistor, and reads the input appearing at
    the pin:


    ```

    $ gp -g4 -pd -ir

    GPIO 4 = 0 (-r)

    ```


    In this example (on my Pi), the GPIO 4 is unconnected. Because it was configured
    as an input, with a pulldown resistor, the input read as low (0). If we use a
    pullup instead with this unconnected GPIO, we should be able to read a high level
    on the pin (1):


    ```

    $ gp -g4 -pu -ir

    GPIO 4 = 1 (-r)

    ```


    This is confirmed in the output. If, however, the GPIO pin is connected to something,
    then that determine how the pin reads.'
- md: '

    # Returning GPIO Value to Shell


    If you''re writing a shell script to read the GPIO value and act on the result,
    the -r option is inconvenient because it requires parsing the output text. The
    -x option is identical to the -r option, except that it also returns the result
    in the `gp command''s exit code as 0 or 1. Notice the result of the shell $ variable
    here:


    ```

    $ gp -g4 -pu -ix

    GPIO 4 = 1 (-r)

    $ echo $?

    1

    $ gp -g4 -pd -ix

    GPIO 4 = 0 (-r)

    $ echo $?

    0

    $

    ```


    To distinguish between a successfully read GPIO and a command failure, exit codes
    are 2 or higher returned when the command fails, as demonstrated here:


    ```

    $ gp -badddd

    No gpio specified with -g (-b addddd)

    $ echo $?

    2

    $

    ```


    # Reading 32 GPIOs


    If you need to read all 32 GPIO pins at once, use the -w option (no -g option
    required):


    ```

    $ gp -w

    GPIO: 0xB421C1EF (-w)

    $

    ```


    The result of all GPIO pins 0 through 31 is returned as a hexadecimal number.
    GPIO 0 is the least significant bit of this value, and GPIO 31 is the most significant.


    # Read GPIO Alternate Function


    Although you can display all GPIO pins with the -D option, you might just want
    to view the alternate function pin (perhaps from a shell script):


    ```

    $ gp -g16 -A

    GPIO 16 : Alt5 (2)

    $

    ```


    This output informs us that GPIO 16 is configured as alternate function 5. The
    value in brackets is the actual value used to configure the GPIO (alternate function
    5 is integer value 2).


    # Blinking Output GPIO


    Sometimes when wiring things it becomes unclear if we have the right connection
    or not. The -b option allows us to use “blink” a GPIO pin on and off (high and
    low). This is extremely helpful when there is an LED hooked up to the GPIO pin,
    as shown in Figure 5-1. The resistance is calculated to allow up to 10 mA, for
    LEDs with an approximate voltage $V_F = 2V$.


    ```

    $R = (V_{CC}-V_F) / 0.01 = 120$ ohms

    ```


    ![](img/1dfed1a8285c8a9b6ea8db73fb_0.png)

    Figure 5-1. LED driven by GPIO


    The -b option assumes that the GPIO has already been configured as an output.
    The option takes an argument, representing the number of seconds to blink. Specifying
    zero will cause it to blink until Control-C. The following example configures
    GPIO 4 as an output and blinks it on and off:


    ```

    $ gp -g4 -o -b

    GPIO 4 = 1 (-b)

    GPIO 4 = 0 (-b)

    ...

    ```

    Press Control-C to exit the gp command.


    # Monitoring Input


    Using the gp command with the -m option, it is possible to monitor an input for
    a period of time. The -m option takes an argument representing the number of seconds.
    Specify zero to indicate “forever.” Figure 5-2 illustrates an example pushbutton
    hooked up to a GPIO pin.


    ![](img/1dfed1a8285c8a9b6ea8db73fb_1.png)

    Figure 5-2. Pushbutton hooked up to input


    This example configures GPIO 4 as an input, configures a pull-up resistance, and
    monitors the input forever:


    ```

    $ gp -g4 -i -pu -m

    00000 GPIO 4 = 1

    00001 GPIO 4 = 0

    00002 GPIO 4 = 1

    00003 GPIO 4 = 0

    00004 GPIO 4 = 1

    00005 GPIO 4 = 0

    ...

    00026 GPIO 4 = 1

    00027 GPIO 4 = 0

    00028 GPIO 4 = 1

    00029 GPIO 4 = 0

    00030 GPIO 4 = 1

    $

    ```

    Here we see the result of the pushbutton, grounding the GPIO 4 input that was
    pulled high by the configured pull-up resistor. As the contact bounces, the GPIO
    input reads 1 and 0.


    # Configuring GPIO Slew Rate


    The GPIO pins provided by the SoC can be configured to be slew rate limited (as
    outputs). This is enabled by default. The configuration of this affects GPIO pins
    in groups:


    - GPIO 0 to 27

    - GPIO 28 to 45

    - GPIO 46 to 53


    The command does not support GPIOs above 31, as these are used by the system and
    should not be altered. Use this option with care. What does it mean to be slew
    rate limited? A simple explanation is that a slew rate limited output is slowed
    down as it transitions from low to a high level (or vice versa). One of the benefits
    of this is to reduce the amount of radio interference. Select any GPIO number
    within the required group with the -g option. The following examples demonstrate
    slew rate limiting for the first group (verify with the -D option):


    ```

    $ gp -g2 -R

    $ gp -g2 -D

    ```


    ```

    GPIO ALTIFN SLEW DESCRIPTION

    -------------------------------------------

    0 Input 1 N 8 mA Input

    1 Input 1 N 8 mA Input

    2 Input 1 N 8 mA Input

    3 Input 1 N 8 mA Input

    4 Input 1 N 8 mA Input

    5 Input 1 N 8 mA Input

    6 Input 1 N 8 mA Input

    ```

    Notice the SLEW column that all Y changed to N for GPIO numbers 0 through 27.
    To enable slew rate limiting again, use -R:


    ```

    $ gp -g2 -R1

    ```


    # Configuring GPIO Hysteresis


    Similar to the slew control, the hysteresis of GPIO pins can be changed in groups.
    The hysteresis configuration affects input pins (and is enabled by default). The
    following disables hysteresis for the first GPIO group:


    ```

    $ gp -g2 -H -D

    ```


    ```

    GPIO ALTIFN SLEW DESCRIPTION

    -------------------------------------------

    0 Input 1 Y 8 mA Input

    1 Input 1 Y 8 mA Input

    2 Input 1 Y 8 mA Input

    3 Input 1 Y 8 mA Input

    4 Input 1 Y 8 mA Input

    5 Input 1 Y 8 mA Input

    6 Input 1 Y 8 mA Input

    ...

    24 Input 0 Y 8 mA Input

    25 Input 0 Y 8 mA Input

    26 Input 1 Y 8 mA Input

    27 Input 0 Y 8 mA Input

    28 Input 1 Y 16 mA SDA0

    29 Input 1 Y 16 mA SCL0

    30 Input 0 Y 16 mA Input

    31 Input 1 Y 16 mA Output

    ```


    # CHAPTER 5: GPIO COMMAND


    To enable hysteresis, again use -H1:


    $ -g2 -H1


    What is hysteresis? Without hysteresis, an input signal is treated as 1 or 0 as
    the voltage crosses a certain threshold (say 50% of 3.3V, or 1.65V). When the
    signal moves deliberately from 0V to 3.3V, the transition clears if it moves rapidly.
    But if the signal were slow rising from 0V and stayed near 1.65V for a time, the
    digital system could interpret the instantaneous values as 0 or 1 until the signal
    rises significantly above 1.65V. This is because the voltage level is ambiguous
    at this level. This creates a nightmare for the software trying to make sense
    of the input.


    Adding hysteresis helps by allowing slow rising to read as 0 until it crosses
    a high threshold of say, 70% (2.31V). When the signal finally arrives past that
    point, the digital input system will snap into a 1 state and stay there. If the
    signal were to backtrack to 2V for a while, the system would insist on 1 as long
    as it could. After snapping into the 1 state, the signal would drop below the
    30% level (for example) to be read as 0. Dropping this lower threshold causes
    the digital input circuit to snap into a 0 state. For more information on this
    subject, look the Schmitt trigger [1].


    # Configuring GPIO Drive Level


    By default, the Raspberry Pi GPIO pins are configured for 8 mA output. The minimum
    drive is provided by -S0 (2 mA), and the maximum drive is -7 (16 mA). The following
    example shows the drive of the first group to 4 mA:


    $ -g0 -s1 -D


    ```

    GPIO ALTIFN SLE HYST DESCRIPTION

    -------------------------------------------

    0 Input 1 Y 8 mA Input

    1 Input 1 Y 8 mA Input

    2 Input 1 Y 8 mA Input

    3 Input 1 Y 8 mA Input

    4 Input 1 Y 8 mA Input

    5 Input 1 Y 8 mA Input

    6 Input 1 Y 8 mA Input

    ...

    24 Input 0 Y 8 mA Input

    25 Input 0 Y 8 mA Input

    26 Input 1 Y 8 mA Input

    27 Input 0 Y 8 mA Input

    28 Input 1 Y 16 mA SDA0

    29 Input 1 Y 16 mA SCL0

    30 Input 0 Y 16 mA Input

    31 Output 1 Y 16 mA Output

    ```


    To change this first group back to the 8 mA default, use:


    $ -g0 -s53


    This is one of the options you want to exercise with discretion. The 3.3V supply
    provided by the Raspberry Pi has a limited remaining capacity. It was indicated
    to be about 50 mA in the models before the Raspberry Pi B+ and Pi 2. It is uncertain
    if the B+ or the Pi 2 has more current budget.


    # Summary


    In this chapter you''ve seen the gp command put through all of its use cases.
    This command saves valuable time as you try things. The blink and monitor functions
    are very helpful in troubleshooting. The gp command further provides a convenient
    way to manage GPIO from a shell script.


    If you read the section on command line option conventions, you also learned how
    to abbreviate sequences and indicate where options end (when required). This will
    not only help you with the newly installed commands, but serve you with Linux
    (Unix) commands generally.


    # Bibliography


    +   [1] "Schmitt trigger," Wikipedia, the free encyclopedia. http://en.wikipedia.org/wiki/Schmitt_trigger.

