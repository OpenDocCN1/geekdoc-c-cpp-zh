    The load from the device''s shift register occurs when the LOAD signal goes


    It appears in Figure 3-6 that the LOAD low-to-high transition is simultaneous
    with the last clock, but it actually follows the clock by a microsecond or more.
    According to Maxim, the LOAD rising edge can occur simultaneous with the CLK or
    follow, but must occur *before* the next rising clock.


