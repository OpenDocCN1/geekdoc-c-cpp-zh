    ## GPIO::start_clock


    The start_clock() class method provides a convenient way to start the General
    Purpose or PWM clock. This is otherwise a tedious procedure, as evidenced in the
    implementation of this method in the library module gpio.cpp. You can avoid all
    of the hassle and invoke this method instead:


    ```

    int start_clock(

    int gpio,

    Source src,

    unsigned divi,

    unsigned divf,

    unsigned mask,

    bool on_gpio=true

    );

    ```


    The argument gpio selects the peripheral the same way as the config_clock() method.
    Arguments src, divi, divf, and mask determine how the clock peripheral is to be
    set up. Again, see config_clock() for the correct input values to use. Argument
    mask defaults to zero when not provided. Argument on_gpio defaults to true, which
    means the involved gpio pin is configured as an output. This is a convenience
    to have the correct alternate function selected for the given gpio, so that the
    clock''s signal can be seen externally. Supply false if you plan to take care
    of this yourself (using one of the methods documented in Appendix A).


    It should be noted that this method will block for a time while waiting for a
    successful clock start up. The following example shows a general purpose clock
    start up:


    GPIO gpio;


    ...

    int rc;


    ```

    rc = gpio.start_clock( // Start General Purpose Clock

    4,

    GPIO::Oscillator, // 19.2 MHz source

    5, // divi

    0, // divf

    0, // mask

    true // Enable clock on GPIO 4

    );

    ```


    ```

    assert(!rc);

    ```


    ## GPIO::stop_clock


    Use the stop_clock() method when you need the clock peripheral stopped.


    ```

    int rc = gpio.stop_clock(int gpio);

    ```


    The clock peripheral is chosen by the gpio number (review method config_clock()
    for the chart of values). A return status of zero is returned from stop_clock()
    when successful or else system error code is returned.


    Note that there can be a delay as the routine waits for a successful status change
    before returning to the caller.


    The following is an example of stopping the general purpose clock:


    ```cpp

    GPIO gpio;

    ...

    int rc;


    rc = gpio.stop_clock(gpio);

    assert(!rc);

    ```


    ## GPIO::pwm_configure


    The pwm_configure() takes care of a number of steps necessary to get the PWM peripheral
    of choice started. There is a finicky peripheral to get started. There are two
    use PWM peripherals available:


    - 1. PWM0

    - 2. PWM1


    Both of these share the same clock (this clock is not the same as the General
    Purpose Clock). The following general steps are performed by this method:


    - 1. DMA is disabled (if it was used before)

    - 2. The PWM peripheral is disabled

    - 3. A short delay is performed

    - 4. Peripheral error flags are cleared

    - 5. PWM parameters are configured

    - 6. The FIFO is cleared

    - 7. Another delay of 10 µs is performed


    Prior to invoking this method, it is expected that you would have configured the
    PWM clock with start_clock(), unless this has already been done. The calling signature
    is as follows:


    ```

    int pwm_configure(

    int gpio,

    PwmMode mode,

    bool repeat,

    int state,

    bool invert,

    bool fifo,

    PwmAlgo algorithm

    );

    ```


    The function return value is zero when successful or a non-zero system error code.

    The PWM peripheral used is chosen by the input gpio. The only valid gpio pins
    are shown in Table B-3.


    ## Table B-3. GPIO Pins and Their Peripherals


    | GPIO | Peripheral |

    |---|---|

    | 12 | PWM 0 Clock |

    | 18 | PWM 0 Clock |

    | 13 | PWM 1 Clock |

    | 19 | PWM 1 Clock |


    It is also assumed that you either set the correct configuration for the gpio
    pin yourself or have arranged to have this as part of start_clock().

    PwmMode mode input can have one of the values (see Chapter 7 for more information)
    presented in Table B-4.


    ### Table B-4. PwmMode and Its Values


    | GPIO::PwmMode | Description |

    |---|---|

    | GPIO::StartAddress | Serialize PWM data |

    | GPIO::Pwm_Mode | Generate PWM signal |


    The boolean input parameter repeat applies when using input data from the FIFO,
    if the FIFO should go empty. Use the value true to repeat the last value written
    out. State indicates the starting state of the signal you require. This should
    be either 0 (low) or 1 (high).

    The boolean input parameter invert should be true if you want the output signal
    to be inverted. For normal use, supply false.

    The boolean parameter fifo, when true, indicates that you will be supplying values
    from the FIFO queue. When false, no FIFO is used.

    The last input argument algorithm indicates which PWM output algorithm to use.
    These are summarized in Table B-5.


    ## Table B-5. Input Algorithms


    | GPIO::PwmAlgo | Description |

    |---|---|

    | GPIO::PwmAlgorithm | Use pulses to average out to a PWM level |

    | GPIO::MSAlgorithm | Use Mark/Space signal generation |


    The following is an example:


    ```cpp

    GPIO gpio;

    int rc;

    ...

    ```

