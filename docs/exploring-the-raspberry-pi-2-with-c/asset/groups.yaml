    \ = gpio_alt_func(gpio_no,io);\n// 返回 desc = \"SPI1_MOSI\"\n```\n\n## 附录 D\n\n\
    ### MAX7219 类\n\n本附录文档了 MAX7219 类，以便与同名芯片进行通信，对于想要以下操作的人有用：\n\n- 使用 MAX7219 (或\
