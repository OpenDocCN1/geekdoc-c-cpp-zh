    # CHAPTER 8 PHYSICS OF THE GPIO INTERFACE


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_101_0.png)


    **Figure 8-5.** CMOS input protection diodes


    If the input goes negative, the diode D1 begins to conduct and shunts current
    to ground (condition would be above about -0.6 V). Resistor R1 limits the current
    flow to avoid damaging the protection diode. This is the mechanism for discharging
    negative static charges. Likewise, if the voltage were to rise above $V_{DD}$
    then current would flow from input through R1 to D2 to $V_{DD}$ (D2 conduction
    begins at above $V_{DD}-0.5V). In time, R1 limits the current flow through D2.
    This simple keeps the MOSFET gate-voltage within the range of GND ($V_{DD}$ minus
    0.6V to plus 0.6V).


    From a design standpoint, you should not rely on R1 or D1 for the handling extreme
    signal waves. These are simply there to prevent electric charge from damaging
    the device. If you have sloppy swings above or below the gate limits, you should
    provide your own signal conditioning. The reason is simply that the diode or resistor
    might not handle the required current levels. For example, Broadcom does not provide
    current handling specifications of the GPIO protection diodes. They don''t want
    you to base design on them.


    Some of the CMOS 4000 series chips that you might use to interface with the Raspberry
    Pi use a zener diode in place of D1 or D2. This allows an extended input signal
    range. The CD4049 IC, for example, can be operated from a +3.3V supply and permit
    its input signal to be as high as +15V. This information is published in the manufacturer''s
    datasheet.


