    The converter was wired using some dont wires (female end for the connector and
    male for the breadboard). Connect VCC to +3.3V on the breakout, Gnd to Gnd of
    course, RX to RX, and TX to TX. When no serial port is needed, the dont wires
    can be removed. Be careful not hook VCC to +5V in haste one day (use +3.3V). This
    is an easy thing to do if you''ve worked with +5V systems over the years.


    I fired up a serial terminal program on the Mac (I used the old minicom) and set
    the baud rate to:


    +   - 115200

    - no parity

    - 8 bits

    - 1 stop bit


    I had expected that the console traffic would appear while booting, but there
    was none. The login prompt did appear, however, once the system came up. To get
    a boot console requires some reconfiguration.


