    \ int get_error();      // 检查错误\n\n    int configure(int gpio, IO io);      //\
    \ 输入/输出\n    int configure(int gpio, Pull pull);  // 无/上拉/下拉\n    int configure(int\
    \ gpio, Event event, bool enable);\n    int events_off(int gpio);            //\
    \ 禁用所有输入事件\n\n    int read_event(int gpio);               // 读取事件数据\n    int clear_event(int\
