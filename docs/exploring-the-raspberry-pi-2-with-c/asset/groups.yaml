    \ `librpi2` 中 `gpio.cpp` 代码的片段：\n\n```cpp\nstd::unordered_map<int, std::string>\
    \ gpio_alto = {\n{ 0, \"SDA0\" }, { 1, \"SCL0\" }, { 2, \"SDA1\" }, { 3, \"SCL1\"\
    \ },\n{ 4, \"GCLK0\" }, { 5, \"GCLK1\" }, { 6, \"GCLK2\" },\n{ 7, \"SPI_CE1_N\"\
