- md: "\n# APPENDIX A CLASS GPIO 1\n\nThe first argument names the gpio pin, while\
    \ the second argument specifies the bit value for the output\n(low order bit).\
    \ To write 1 bit to gpio pin 19, you could code:\n\n```cpp\nint rc;\n\nrc = gpio.write(19,1);\n\
    if (rc != 0) {\n    fprintf(stderr,\"%s: GPIO ::write(19)\\n\",\n           strerror(rc));\n\
    \    exit(1);\n}\n```\n\nWhile there is no error returned by this method, one\
    \ might be returned in the future. An example of an error might be EINVAL if the\
    \ gpio pin was out of range. Currently, this is not checked.\n\n## GPIO::read_event\n\
    \nThe read_event calling signature is as follows:\n\n```cpp\nint GPIO::read_event(int\
    \ gpio)\n```\n\nThe gpio pin must be configured for GPIO::Input and the events\
    \ that you are interested in\nconfiguring (for example, GPIO::Rising). The following\
    \ code tests to see if a signal rise event has occurred:\n\n```cpp\nint rc;\n\n\
    gpio.configure(23,GPIO::Input);\ngpio.configure(23,GPIO::Rising);\n```\n\n```cpp\n\
    rc = gpio.read_event(23);\nif (rc != 0) { // Did a configured event occur?\n//\
    \ The configured event occurred...\n```\n\nIt should be noted that multiple events\
    \ can be configured for the gpio pin. For example, you could\nconfigure to receive\
    \ both GPIO::Rising and GPIO::Falling events (in separate calls—do not \"or\"\
    \ them\ntogether). When configured this way, the read_event method would indicate\
    \ if either event has occurred\n(i.e., the status has changed).\n\nThe gpio event\
    \ flag is cleared upon return from the read_event method. Note that there is no\
    \ error\nreturned for this method.\n\n## GPIO::clear_event\n\nThe clear_event\
    \ method is defined as:\n\n```cpp\nint GPIO::clear_event(int gpio)\n```\n\nThis\
    \ clears the flag indicating the event(s) that just occurred. The returned value\
    \ is zero for success or a\nsystem error code if there was a problem.\n\n## GPIO::read_events\n\
    \nThe read_events method is declared as:\n\n```cpp\nuint32_t GPIO::read_events()\n\
    ```\n\nIt returns the flags for all 32 GPIO pins 0 through 31. No event flags\
    \ are reset by this call. If you need to reset one or more event flags, use the\
    \ GPIO::clear_event method.\n\n## GPIO::alt_function\n\nThe alt_function method\
    \ returns the configuration state of the specified gpio pin:\n\n```cpp\nint GPIO::alt_function(int\
    \ gpio, GPIO::IO& io)\n```\n\nThe return value is zero when successful or else\
    \ a system error code when it fails. The configured state of the gpio pin is returned\
    \ through the reference argument IO. To test if gpio pin 19 is configured as an\
    \ input, you could:\n\n```cpp\nint rc;\nGPIO::IO altfun;\n\nrc = gpio::alt_function(19,altfun);\n\
    assert(rc); // Check for success\nif ( altfun == GPIO::Input ) {\n    // pin is\
    \ configured as input\n```\n\n## GPIO::get_drive_strength\n\nThis method allows\
    \ the programmer to get three GPIO pins of interest:\n\n- 1. Boolean value indicating\
    \ slew limit enabled\n- 2. Boolean value indicating hysteresis is enabled\n- 3.\
    \ The drive strength of the group of gpio pins that the specified pin is a member\
    \ of (range 0 to 7).\n\nThe method returns an error indicator, while passing the\
    \ values of interest back through reference arguments:\n\n```cpp\nint GPIO::get_drive_strength(\n\
