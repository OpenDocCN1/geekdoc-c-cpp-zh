    \ within the FM broadcast band. Before you try this experiment, though, you should\
    \ be aware that transmitting any radio signal is illegal without a license.\n\n\
    Although there are many devices that can transmit low power signals to FM radios,\
    \ these have been approved through testing and a licensing procedure. Regulations\
    \ around the globe for enforcement of radio transmissions, but consequences can\
    \ include having computer and radio equipment confiscated and a lifetime ban on\
    \ owning a radio license. Remember that compliance with the law is your responsibility.\n\
    \nWith out of that, if you choose to accept the risk, there are some other things\
    \ you should be aware of:\n\n- The signal coming out of GPIO 4 is a square wave.\
    \ This means there will be many harmonics radiated around. If you have 100 MHz\
    \ on GPIO 4, these will also be 200 MHz, and higher multiples at various but reduced\
    \ amplitudes. These could represent severe interference to critical services.\n\
    \n- Never attach a wire to your GPIO pin to act as an antenna. Increasing your\
    \ transmission range is a bad idea when transmitting illegally.\n\n- Other reasons\
    \ for not attaching an antenna wire include the fact that it could destroy your\
    \ GPIO output driver (from standing waves, etc.).\n\n- Above all, do not run a\
    \ GPIO without! Antennas are subject to static electricity from thunderstorms\
    \ and other sources. Your Pi will certainly sustain damage if you do. Without\
    \ adequate planning, you also become susceptible to lightning strikes.\n\nIf you\
    \ observe some common sense and precautions, you can perform this experiment with\
    \ relative safety.\n\nIf you have a stereo or FM receiver, what can you do to\
    \ receive the antenna in to close proximity of the Pi. I ran a wire from my FM\
    \ receiver to the signal coming from GPIO 4 is no more than any other signal that\
    \ the Pi itself might radiate, but the receiver will see an increased signal.\n\
    \nUsing clock source 6 (500 MHz), we can generate a 100 MHz signal that can be\
    \ heard on the FM radio. Using the pinck command, select GPIO 4 (-g4), DIVI =\
    \ 5 (-i5), mask = 0 (-m0); enable the clock on the GPIO output (-e1); select clock\
    \ source 6 (-s6), and blink on off (-b). So that I can see and hear when the clock\
    \ is on or off, I also added verbose option (-v) in the following session:\n\n\
    ```\n$ pinck -g4 -i5 -m0 -s6 -b -v\nClock started.\ndriving gpio 4.\nPress Ctrl+C\
    \ to quit..\nClock off (stopped: -g 4)\nClock on (running: -g 4)\nClock off (stopped:\
    \ -g 4)\n```\n\n```\nClock on (running: -g 4)\nClock off (stopped: -g 4)\nClock\
    \ on (running: -g 4)\nClock off (stopped: -g 4)\nQuitting.\nClock on (running:\
    \ -g 4)\nClock off (stopped: -g 4)\n```\n\nWhile this runs, on your stereo or\
    \ radio and tune up or down to the 100 MHz point on the dial. Depending on the\
    \ accuracy of your receiver, you might have to tune to \"find the signal.\" You\
    \ should hear it go to noise in half-second intervals. Press Ctrl-C to terminate\
    \ the command.\n\nThe FM receiver go quiet when receiving the signal. The receiver\
    \ noise is from a lack of signal. If you have a strong station on 100 MHz, try\
    \ a different frequency. Use the procedure in this chapter to calculate a new\
    \ DIVI (and optionally DIVF) value. For fun, experiment with the mask and DIVF\
    \ values. Some combinations can produce interesting sounds on the receiver.\n\n\
    ## Summary\n\nIn this chapter, we have explored the General Purpose Clock (GPCLOCK)\
    \ the Raspberry Pi provides. The book's pinck command was explored and used to\
    \ experiment with the clock. Most important, you learned the procedure for choosing\
    \ the DIVI and DIVF parameters so that you can compute your target frequencies.\
    \ We also explored using the clock as a BFO, giving you a taste of radio theory.\
    \ Finally, you saw that radio frequencies can be generated and received on your\
    \ FM stereo receiver. All of these things demonstrate the flexibility of the Raspberry\
    \ Pi.\n\n## Bibliography\n\n- [1] \"Silicon Chip Online: Vintage Radio\", Silicon\
    \ Chip Online: Vintage Radio. http://www.walkingital.com/radio/trucchi_suggerimenti/article.html\
    \ Accessed July 16, 2015.\n- [2] \"Frequencies of Musical Notes, A4 = 440 Hz\"\
    , Frequencies of Musical Notes, A4 = 440 Hz. http://www.phy.mtu.edu/suits/notrefeqs.html\
    \ Accessed July 16, 2015.\n- [3] \"Turning the Raspberry Pi into an FM Transmitter\"\
    , Imperial College Robotics Society. http://www.icobotics.co.uk/wiki/index.php/Turning_Raspberry_Pi_Into_an_FM_Transmitter\
    \ Accessed July 16, 2015.\n\n# CHAPTER 7\n\n## Pulse Width Modulation\n\nThe Raspberry\
    \ Pi has two Pulse Width Modulation (PWM) peripherals available for the end user.\
    \ The PWM peripheral is surprisingly complex, but the complexity is large due\
