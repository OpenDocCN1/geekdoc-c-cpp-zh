    The mtop command outputs 8 columns of activity in the matrix:


    +   - CPU 1 utilization (leftmost)

    - CPU 2 utilization

    - CPU 3 utilization

    - CPU 4 utilization

    - Total memory utilization (includes disk cache)

    - 6&7 Total CPU utilizaton (all cores)

    - 8 Relative i/O activity (rightmost)


    Note:


    Memory utilization can show 100% due to disk cache activity. This memory is reclaimed
    for application use as needed by the kernel.


    You might want to start the mtop command using a system startup script so that
    it begins automatically. On the other hand, there will be times when you want
    to use one or more of GPIO pins for other experiments. You can start the mtop
    command on demand and leave it running in the background using:


    ```

    $ mtop &

    ```


    This assumes that it is wired according to its default GPIO pins. If you have
    the meter hooked up to gpio 18, you could use:


    ```

    $ mtop -m 16 &

    ```


    If you kill mtop, the matrix will flash a pi symbol on the matrix prior to stopping
    (leaving the pi displayed). When shutting down the system, the mtop command will
    be killed by the system but might not always be able to finish with the pi displayed.
    The system tends to be in a hurry to have all processes stopped.


    # Bibliography


