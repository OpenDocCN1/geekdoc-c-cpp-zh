- md: '

    # CHAPTER 6 GENERAL PURPOSE CLOCK


    When the mash value is zero, the DIVI divisor is to produce an accurate output
    frequency. When you configure the clock with a mash value ranging from 1 to 3,
    however, you can get some averaged frequencies, summarized in Table 6-1.


    Table 6-1. Averaged Output Frequencies


    | MASH | Minimum DIVI | Minimum Frequency | Average Frequency | Maximum Frequency
    |

    |---|---|---|---|---|

    | 0 | 1 | Source/DIVI | Source/DIVI | Source/DIVI |

    | 1 | 2 | Source/(DIVI + 1) | Source/(DIVI + DIVF/1,024) | Source/DIVI |

    | 2 | 3 | Source/(DIVI + 2) | | Source/(DIVI - 1) |

    | 3 | 4 | Source/(DIVI + 4) | | Source/(DIVI - 3) |


    If we choose the lowest frequency clock source (19.2 MHz), then Table 6-2 shows
    how the mash values relate when the value of DIVI = 42.


    Table 6-2. Mash Values When DIVI = 42


    | MASH | DIVI | Minimum Frequency | Average Frequency | Maximum Frequency |

    |---|---|---|---|---|

    | 0 | 42 | 457.143 kHz | 457.143 kHz | 457.143 kHz |

    | 1 | | 446.512 kHz | 417.482 to 457.143 kHz (DIVF = 4,095 to 0) | 457.143 kHz
    |

    | 2 | | 436.364 kHz | | 468.293 kHz |

    | 3 | | 417.391 kHz | | 492.308 kHz |


    # Determining DIVI and DIVF


    Knowing that values for DIVI and DIVF must be chosen for a target frequency, what
    is the procedure for calculating them? To illustrate this, let''s use as an example
    the assignment to generate a test 455 kHz signal to inject into an AM radio frequency
    (IF) stage. [1] How do we choose DIVI and DIVF for the best match?


    The procedure is as follows:


    - 1. Calculate DIVI by the source frequency by the desired frequency.

    - 2. If the number was an exact integer in Step 1, then use MASH = 0 (no DIVF
    applies) and stop.

    - 3. Otherwise, continue rounding the DIVI down to the nearest integer; that is,
    set DIVI to floor(DIVI).

    - 4. Compute DIVF based on source, frequency, and DIVF (below).


    Our source will use the clock frequency of 19.200 MHz. Calculate the trial DIVI,
    by dividing the source frequency (19.2 MHz) by the target frequency:


    ```

    DIVI = 19,200,000 / 455,000

    = 42.198 (Step 1)

    = 42 (Step 2)

    ```


    Because DIVI value in Step 1 was a fractional value, we will have to approximate
    the target frequency by using a mask and DIVF value. From the earlier charts,
    we know that the average frequency is given by:


    Frequency = Source/(DIVI + DIVF/1,024)


    Using algebra to solve for DIVF we get the formula:


    DIVF = 1024 × (Source/Frequency - DIVI)


    Now we can compute DIVF:


    ```

    DIVF = 1,024 × (Source/Frequency - DIVI)

    1024 × (19,200,000/455,000 - 42)

    = 202.5

    = 202 (as integer)

    ```


    Plugging this DIVF into the average frequency, we can check our math:


    ```

    Frequency = Source / (DIVI + DIVF/1,024)

    = 19,200,000 / (42 + 2/1,024)

    = 455.006 kHz

    ```


    Because the target frequency of 455 kHz is within the range of frequencies for
    Mash 1 (446.512 kHz-457.143 kHz), that will be the best approximation. When mash
    is zero (no mash), you have an exact frequency. Otherwise, the lower mask values
    provide the best approximations.


    # Beat Frequency Oscillator


    If you have a portable short radio, you probably know that it can''t receive continuous
    wave (CW, also known as Morse code) or sideband transmissions on it. You might
    be able to sense it on the dial, but it doesn''t receive well (sideband transmissions
    sound like ducks). This is because consumer radios lack the beat frequency oscillator
    (BFO) or sideband demodulating frequencies necessary.


    All modern radios mix the received frequency to an IF so that the signal can be
    more selectively amplified. One common frequency is 455 kHz (like our previous
    experiment). Depending on the design of your radio, you might use a different
    IF like 10.7 MHz. There are still other frequencies in use, but those are the
    most common.


    CW transmission is the simplest form of communication. It requires only that the
    transmitter provide a sine wave at one frequency. This makes it very spectrum.
    A message is encoded by keying the transmitter on and off with dots and dashes
    (and longer transmissions).


    At the receiving end, you could use an amplitude modulated (AM) receiver for one
    problem. Receiving a CW signal is just like receiving an AM carrier. When receiving
    CW and the transmitter goes off (between dots and dashes), the receiver notices
    this lack of signal and turns up the gain. The receiver tries to compensate for
    radio reception that can fade or get stronger. This is why you hear more noise
    in the dots and dashes. But why is there no "tone"?


    To actually hear a tone in the AM receiver, you need another signal to mix with
    it. This is where the BFO comes in. When two signals mix in a nonlinear circuit,
    additional signals are generated. If the lowest frequency is F1 and the upper
    frequency is F2, then you get additional by-products from the original two inputs.
    The strongest four signals will be as follows:


    - F2 - F1 frequency

    - F1 frequency

    - F2 frequency

    - F1 + F2 frequency


    Other products in diminishing strength are also present, but the most interesting
    by-product is the L-R signal. Let''s assume the mask values provide the best approximations.
    When mash is zero (no mash), you have an exact frequency. Otherwise, the lower
    mask values provide the best approximations.

    '
