    Figure 7-2 shows the pwm display for 30% PWM signal.


    ## Figure 7-2. PWM at 30%


    The capture here is annotated in milliseconds. With the PWM parameters set, we
    know that the input clock is operating at 100 kHz (a period of 10 us). Our S parameter
    was set to 100, so the period of our PWM signal should be 100 × 10 us, which is
    1 ms.


    Examination of the signal trace shows that we have three ticks of high (1) and
    a remaining seven ticks of low (0). Each of these ticks represents 100 us. This
    represents a 30% PWM signal. Now let''s try an 80% signal for comparison purposes:


    ```

    $ pwm -g12 -i192 -f0 -m0 -s1 -Am -Z0 -c -M80 -S100

    ```


    Capture with pwm:


    ```

    $ pwm -b3

    ```

    Captured: writing.vcd


    Figure 7-3 shows what you should see.


    ![](img/1dfed1a8285c8a59b56ea8db2ed73fb_92_0.png)


    ## Figure 7-3. PWM at 80%


    Clearly with eight ticks high and two ticks low, we have an 80% PWM signal. For
    another experiment, let''s invert the PWM signal (add option -I):


    ```

    $ pwm -g12 -i192 -f0 -m0 -s1 -Am -Z0 -c -M80 -S100 -I

    ```


    Capture with pwm:


    ```

    $ pwm -b3

    ```

