    \ vector 中添加或删除成员，内部数组可能会重新分配。因此，如果对 vector 对象发生了更改，你必须再次调用 `data()` 方法来重新获取实际数组地址。\n\
    \n## STL 迭代器\n\n遍历 vector 的第二种方法涉及迭代器。这有时会让人们望而畏之，但请听我说。它们不仅容易理解，而且容易使用。我们还将看到\
    \ C++ 11 标准让它们的使用比之前更加简单。如果你的容器是 `std::vector<int>`，那么迭代器就是 `std::vector<int>::iterator`。换句话说，它与容器的声明相同，只是后面附加了\
    \ `::iterator`。所以，到目前为止这并不坏，这只是语法问题。在概念上，你可以将迭代器想象成某种复杂的指针。它们确实指向某些东西（或指向“末尾”）。它们在你的平台（就你来说是树莓派\
    \ Linux）上是如何实现的应该被忽略。将它们作为概念性指针使用。所有容器都有以下方法来提供迭代器值：\n\n- container.begin()\n\
    - container.end()\n\n`begin()` 方法返回指向容器中第一个条目的迭代器（如果有的话）。`end()` 方法返回标记容器结束的迭代器表示。如果容器为空，则\
    \ `begin()` 返回的值与 `end()` 相同。现在让我们看看 myvec 冗长的 C++ 迭代器循环：\n\n```cpp\nfor ( std::vector<int>::iterator\
    \ it = myvec.begin(); it != myvec.end(); ++it ) {\n  printf(\"myvec[] = %d\\n\"\
    ,*it);\n}\n```\n\n第一个迭代器在循环中用 `myvec.begin()` 的值初始化。只要迭代器不等于 `end()`，循环继续。在循环底部，迭代器递增\
    \ (`++it`)，以便它指向容器中的下一个项目。在 `for` 循环内部，通过使用迭代器名称的星号 (`*`) 来访问 vector 条目，就像它是一个指针一样。迭代器的方法\
    \ `operator*()` 用于获取值。迭代器的方法 `operator++()` 用于移动到下一个项目。\n\n"
