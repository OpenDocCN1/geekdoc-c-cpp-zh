    # 将 GPIO 值返回到 Shell


    如果你正在编写 shell 脚本来读取 GPIO 值并根据结果采取操作，-r 选项会很不方便，因为需要解析输出文本。-x 选项与 -r 选项相同，不同之处在于它还会通过
    `gp command` 的退出码（为 0 或 1）返回结果。注意这里 shell 变量 $? 的结果：


    ```

    $ gp -g4 -pu -ix

    GPIO 4 = 1 (-r)

    $ echo $?

    1

    $ gp -g4 -pd -ix

    GPIO 4 = 0 (-r)

    $ echo $?

    0

    $

    ```


    为了区分成功读取 GPIO 和命令执行失败，当命令失败时，会返回 2 或更高的退出码，如下所示：


    ```

    $ gp -badddd

    No gpio specified with -g (-b addddd)

    $ echo $?

    2

    $

    ```


    # 读取 32 个 GPIO


    如果你需要一次性读取所有 32 个 GPIO 引，请使用 -w 选项（不需要 -g 选项）：


    ```

    $ gp -w

    GPIO: 0xB421C1EF (-w)

    $

    ```


    所有 GPIO 0 到 31 的结果将以十六进制的形式返回。GPIO 0 是该值的最低位，GPIO 31 是最高位。


    # 读取 GPIO 复用功能


    虽然你可以使用 -D 选项显示所有 GPIO 引，但你可能只想查看复用功能引（可能是通过 shell 脚本）：


    ```

    $ gp -g16 -A

    GPIO 16 : Alt5 (2)

    $

    ```


    此输出告诉我们 GPIO 16 配置为复用功能 5。括号中的值是用于配置 GPIO 的实际值（复用功能 5 的整数值为 2）。


    # 闪烁输出 GPIO


    有时在接接线时，我们不确定连接是否正确。-b 选项允许我们“闪烁” GPIO 引脚的开启和关闭（高电平和低电平）。当 GPIO 引脚连接了 LED 时，这非常有帮助，如图
    5-1 所示。计算出的电阻允许高达 10 mA，适用于近似电压 $V_F = 2V$ 的 LED。


    ```

    $R = (V_{CC}-V_F) / 0.01 = 120$ ohms

    ```


    ![](img/1dfed1a8285c8a9b6ea8db73fb_0.png)

    图 5-1. GPIO 驱动 LED


    -b 选项假设 GPIO 已经配置为输出。该选项接受一个参数，表示闪烁的秒数。指定为零将使其一直闪烁直到按下 Control-C 为止。以下示例将 GPIO
    4 配置为输出并使其闪烁：


    ```

    $ gp -g4 -o -b

    GPIO 4 = 1 (-b)

    GPIO 4 = 0 (-b)

    ...

    ```

    按下 Control-C 退出 gp 命令。


    # 监控输入


    使用带有 -m 选项的 gp 命令，可以监控一段时间的输入。-m 选项接受一个表示秒数的参数。指定为零表示“永远”。图 5-2 展示了一个连接到 GPIO
    引脚的示例按键开关。


    ![](img/1dfed1a8285c8a9b6ea8db73fb_1.png)

    图 5-2. 连接到输入的按键


    此示例将 GPIO 4 配置为输入，配置了上拉电阻，并永久监控输入：


    ```

    $ gp -g4 -i -pu -m

    00000 GPIO 4 = 1

    00001 GPIO 4 = 0

    00002 GPIO 4 = 1

    00003 GPIO 4 = 0

    00004 GPIO 4 = 1

    00005 GPIO 4 = 0

    ...

    00026 GPIO 4 = 1

    00027 GPIO 4 = 0

    00028 GPIO 4 = 1

    00029 GPIO 4 = 0

    00030 GPIO 4 = 1

    $

    ```

    在这里我们看到了按键的结果，即按键将被配置的上拉电阻拉高的 GPIO 4 输入端接地。随着触点抖动，GPIO 输入读取到 1 和 0。


    # 配置 GPIO 压变率（Slew Rate）


    SoC 提供的 GPIO 引脚可以配置压变率限制（作为输出）。这是默认开启的。此配置影响分组的 GPIO 引脚：


    - GPIO 0 到 27

    - GPIO 28 到 45

    - GPIO 46 到 53


    该命令不支持 31 以上的 GPIO，因为这些由系统使用且不应更改。请谨慎使用此选项。什么是压变率限制？简单解释是，压变率限制输出在从低电平转换到高电平（或反之）时会变慢。这样做的好处之一是减少电磁干扰。使用
    -g 选项在所需的组内选择任何 GPIO 号。以下示例演示了第一组的压变率限制（使用 -D 选项验证）：


    ```

    $ gp -g2 -R

    $ gp -g2 -D

    ```


    ```

    GPIO ALTIFN SLEW DESCRIPTION

    -------------------------------------------

    0 Input 1 N 8 mA Input

    1 Input 1 N 8 mA Input

    2 Input 1 N 8 mA Input

    3 Input 1 N 8 mA Input

    4 Input 1 N 8 mA Input

    5 Input 1 N 8 mA Input

    6 Input 1 N 8 mA Input

    ```

    注意 SLEW 列，对于 GPIO 0 到 27，所有的 Y 都变为了 N。要再次启用压变率限制，使用 -R：


    ```

    $ gp -g2 -R1

    ```


    # 配置 GPIO 滞回（Hysteresis）


    与压变控制类似，GPIO 引脚的滞回可以分组更改。滞回配置影响输入引脚（默认开启）。以下命令禁用第一组 GPIO 组的滞回：


    ```

    $ gp -g2 -H -D

    ```


    ```

    GPIO ALTIFN SLEW DESCRIPTION

    -------------------------------------------

    0 Input 1 Y 8 mA Input

    1 Input 1 Y 8 mA Input

    2 Input 1 Y 8 mA Input

    3 Input 1 Y 8 mA Input

    4 Input 1 Y 8 mA Input

    5 Input 1 Y 8 mA Input

    6 Input 1 Y 8 mA Input

    ...

    24 Input 0 Y 8 mA Input

    25 Input 0 Y 8 mA Input

    26 Input 1 Y 8 mA Input

    27 Input 0 Y 8 mA Input

    28 Input 1 Y 16 mA SDA0

    29 Input 1 Y 16 mA SCL0

    30 Input 0 Y 16 mA Input

    31 Input 1 Y 16 mA Output

    ```


    # 第 5 章：GPIO 命令


    要启用滞回，再次使用 -H1：


    $ -g2 -H1


    什么是滞回？如果没有滞回，当电压跨越某个阈值时，输入信号会被处理为 1 或 0（例如 3.3V 的 50%，即 1.65V）。当信号从 0V 有意识地移动到
    3.3V 时，如果它移动迅速，转换就会消除。但如果信号从 0V 缓慢上升并在 1.65V 附近停留一段时间，数字系统可能会将瞬间值解释为 0 或 1，直到信号显著高于
    1.65V。这是因为电压水平在该水平上是模糊的。这为软件带来了噩梦。


    添加滞回可以防止缓慢上升在低于高阈值（例如 2.3V）时被读取为 0。当信号最终到达该点时，数字输入将保持在 1 状态。如果信号回落到 2V 并在一段时间内保持，系统将保持
    1。关于此主题的更多信息，请参考 [1]。


    # 配置 GPIO 驱动电流


    默认情况下，Raspberry Pi GPIO 引脚配置为 8 mA 输出。最小驱动由 -S 提供（2 mA），最大驱动为 -7（16 mA）。以下示例将第一组的驱动改为
    4 mA：


    $ -g0 -s1 -D


    ```

    GPIO ALTIFN SLE HYST DESCRIPTION

    -------------------------------------------

    0 Input 1 Y 8 mA Input

    1 Input 1 Y 8 mA Input

    2 Input 1 Y 8 mA Input

    3 Input 1 Y 8 mA Input

    4 Input 1 Y 8 mA Input

    5 Input 1 Y 8 mA Input

    6 Input 1 Y 8 mA Input

    ...

    24 Input 0 Y 8 mA Input

    25 Input 0 Y 8 mA Input

    26 Input 1 Y 8 mA Input

    27 Input 0 Y 8 mA Input

    28 Input 1 Y 16 mA SDA0

    29 Input 1 Y 16 mA SCL0

    30 Input 0 Y 16 mA Input

    31 Output 1 Y 16 mA Output

    ```


    要将第一组改回 8 mA 默认，使用：


    $ -g0 -s53


    这是你希望谨慎使用的选项之一。Raspberry Pi 提供的 3.3V 电源剩余容量有限。在 Raspberry Pi B+ 和 Pi 2 之前的型号中指示为
    50 mA。不确定 B+ 还是 Pi 2 拥有更多电流预算。


    # 总结


    在本章中，你学习了 gp 命令的所有用例。这个命令在你尝试操作时节省了宝贵的时间。闪烁和监控功能对于故障排除非常有帮助。gp 命令进一步提供了从 shell
    脚本管理 GPIO 的方便方法。


    如果你阅读了命令行选项规范章节，你还学会了如何缩写序列以及指示选项结束的位置（当需要时）。这不仅将帮助你新安装的命令，也适用于通用的 Linux (Unix)
    命令。


    # 参考文献


    +   [1] "Schmitt trigger," Wikipedia, 自由百科书。http://en.wikipedia.org/wiki/Schmitt_trigger.


