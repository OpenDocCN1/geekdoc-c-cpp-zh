    # GPIO::get_pwm_ratio


    Use get_pwm_ratio() to query the currently configured mark and space integer values
    are for the specified PWM peripheral.


    ```

    int get_pwm_ratio(int gpio, uint32_t m,uint32_t s);

    ```


    The return value is zero for success or a system error code upon failure. Input
    parameter gpio selects the PWM peripheral. Parameters m and s are passed by reference,
    and are used to return these two values:


    ```

    GPIO gpio;

    int rc;

    uint32_t m, s;


    rc = gpio.get_pwm_ratio(18,m,s);

    assert(!rc);

    printf("PWMo=%u S=%u\n",

    unsigned(m),

    unsigned(s));


    ```


    # GPIO::pwm_control


    Use this method to call the control register contents:

    pwm_control(int gpio,s_PWM_control& control);


    The call returns zero upon success or else a system error code. The control status
    structure is defined as follows:


    ```

    struct s_PWM_control {

    uint32_v PWEnX : 1; // Channel enable

    uint32_v MODEX : 1; // 0=Serialise/1=PWM mode

    uint32_v RTPX : 1; // Last data in FIFO repeats

    uint32_v SBITX : 1; // State when no transmission

    uint32_v POLAX : 1; // 1=Inverted output

    uint32_v USEFX : 1; // 1=FIFO /0=PWM_DATX

    uint32_v MSENX : 1; // 0=PWM algorithm/1=M/S transmission

    };

    ```


    The following is an example querying the control settings for PWM0:


    ```

    GPIO gpio;

    GPIO:s_PWM_control ctrl;

    int rc;


    rc = gpio.pwm_control(18,ctrl);

    assert(!rc);

    printf("PWMo''s FIFO is %s\n",ctrl.USEFX ? "used" : "not used");

    ```'
