- md: "\n## CHAPTER 12 ■ MULTICORE WEB SERVER\n\n## WebMain::start()\n\nBefore the\
    \ main program invokes method start(), it registers a callback with the use of\
    \ set_callback(). In this way, the function http_callback() found in the source\
    \ module piweb.cpp will be called on behalf of the thread handling the request.\
    \ We'll see more about this later.\n\nOnce the configuration methods have been\
    \ called, the start( ) method gets the server up and running. The basic steps\
    \ are applied as follows:\n\n- 1. Create a listening socket (lsock) from the configured\
    \ address, port, and backlog values.\n- 2. Ignore the Unix SIGPIPE, which can\
    \ occur in network I/O.\n- 3. Create and start each configured worker thread to\
    \ process requests. This launches the server and it quickly becomes ready for\
    \ service.\n\nThe entire main program consists mainly of processing options and\
    \ starting the server.\n\n```cpp\nint\nmain(int argc\n```\n\n```cpp\nif ( opt_errs\
    \ ) {\n    usage(argv[0]);\n    exit(1);\n}\n```\n\n```cpp\nwebmain.set_callback(http_callback);\n\
    rc = webmain.start();\nif ( rc != 0 ) {\n    fprintf(stderr,\"%s: Starting webmain\\\
    n\",strerror(-rc));\n    exit(2);\n}\n```\n\n```cpp\nwebmain.join();\nreturn 0;\n\
    ```\n\n```cpp\n// End piweb.cpp\n```\n\nThe WebMain class takes care of all that\
    \ ugly stuff relating to sockets and the libevent calls.\n\n## Worker Design\n\
    \nThe remaining libevent stuff happens in the worker class.cpp. The curious can\
    \ look at the class definition in worker.hpp and the class implementation in worker.cpp.\
    \ We just discuss some of the亮点 here within this chapter.\n\nBy default, the libevent\
    \ structures are not thread safe. There are ways to configure libevent to turn\
    \ on thread safety, but this is best left to the programmer to control. This gives\
    \ us control over how much thread safety we really need and makes the server more\
    \ efficient.\n\nTo avoid race conditions, each worker creates its own \"event\
    \ base\" (struct event_base). Much of the libevent processing depends on this\
    \ structure (see worker::()). Each worker listens for connections on the same\
    \ listen socket. This allows any thread to accept the next connection and add\
    \ it to its own event_base for processing. Those already processing a request\
    \ will not be able to accept anyway, so has the natural effect of load balancing.\n\
    \nThe worker then basically loops in a tight thread within the dispatch() method:\n\
    \n```cpp\nWorker::dispatch() {\n    while (!shutdown) {\n        event_base_loop(thread_base,\
    \ EVLOOP_ONCE);\n    }\n}\n```\n\nBasically, once an event triggers on the thread's\
    \ own event_base (named thread_base), a call is triggered and delivered to the\
    \ callback we saw earlier. Before we look at that, though, let's examine how the\
    \ web server is triggered for shutdown.\n\n## Server Shutdown\n\nThe problem faced\
    \ by the worker thread is how to make it responsive to shutdown events. When the\
    \ server is busy, this is not an issue because the loop in Worker :dispatch can\
    \ test the shutdown flag (shutdown). But this flag is not tested when there are\
    \ no incoming requests! It takes a event to wake base_loop() to exit.\n\nThe way\
    \ this problem solved was to create an anonymous pipe (see Linux API for pipe(2)).\
    \ We then add the read end of the pipe to event_base. When the worker thread to\
    \ exit (shutdown, we simply write one byte to the pipe (from Worker :request_shutdown()).\
    \ This wakes up the base_loop(). The registered callback for the base event invokes\
    \ the worker's notify_cb() callback, which sets the shutdown member to true. On\
    \ return from this callback, base_loop() returns, testing the shutdown flag at\
    \ the top of the while loop.\n\nThis process shuts down one worker thread. To\
    \ shut down the entire server, the shutdown request must originate with the class\
    \ WebMain. This can then invoke a thread-safe shutdown on all the worker threads\
    \ (it is safe for any thread to write into the shutdown pipe).\n\n## HTTP Processing\n\
    \nWhen each worker thread receives an HTTP request, it does some overhead processing\
    \ and invokes the callback registered for WebMain. In this manner, much of the\
    \ grunt work is to care before you use the request.\n\nThe basic handling looks\
    \ like the following (slightly trimmed for clarity):\n\n```cpp\nstatic void\n\
    http_callback(evhttp_request *req,const char *uri,const char *path,Worker& worker)\
    \ {\n\n    if ( strcmp(path,\"/cpuinfo\") == 0 ) {\n        worker.add(\"<html><head><title>cpuinfo</title></head>\\\
    r\\n\");\n        worker.add(\"<body><pre>\\r\\n\");\n\n        FILE *f = fopen(\"\
    /proc/cpuinfo\",\"r\");\n        if ( f ) {\n            char inbuf[1024];\n\n\
    \            while ( fgets(inbuf,sizeof(inbuf),f) != nullptr ) {\n           \
    \     char *cp = strchr(inbuf,'\\n');\n                if ( cp != 0 && size_t(cp\
    \ - inbuf) < size_t(inbuf - 3 ) {\n                    strcpy(cp,\"\\r\\n\");\n\
    \                }\n                worker.add(inbuf,strlen(inbuf));\n       \
    \     }\n            fclose(f);\n            worker.add(\"</pre></body>\\r\\n\"\
    );\n    } else {\n        worker.send_reply(200,\"OK\\n\");\n    }\n}\n```\n\n\
    Here we test the path given to see if it matches \"/cpuinfo\". If it does, we\
    \ then copy the Linux /proc/cpuinfo to the body. The worker.add() method is like\
    \ printf.\n\nHere we test the path given to see if it matches \"/cpuinfo\". If\
    \ it does, we then copy the Linux /proc/cpuinfo to the body. The worker.add()\
    \ method is like printf.\n\n| GPIO | ALTFUN | LEV | HYST | DRIVE | DESCRIPTION\
    \ |\n|---|---|---|---|---|---|\n| 0 | Input | 1 | Y | 8mA | |\n| 1 | Input | 1\
    \ | Y | 8mA | |\n| 2 | Alt0 | 1 | Y | 8mA | |\n| 3 | Alt0 | 1 | Y | 8mA | |\n\
    | 4 | Input | 1 | Y | 8mA | |\n| 26 | Output | 0 | Y | 8mA | |\n| 27 | Input |\
    \ 0 | Y | 8mA | |\n| 28 | Input | 1 | Y | 16mA | |\n| 29 | Input | 1 | Y | 16mA\
    \ | |\n| 30 | Input | 0 | Y | 16mA | |\n| 31 | Output | 1 | Y | 16mA | |\n\n##\
    \ How Many Threads?\n\nBy default, the libevent structures are not thread safe.\
    \ There are ways to configure libevent to turn on thread safety, but this is best\
    \ left to the programmer to control. This gives us control over how much thread\
    \ safety we really need and makes the server more efficient.\n\n## To Do\n\nNo,\
    \ I didn't forget to finish this section. This is where you jump in and make your\
    \ changes. A good place to start is to look at the worker class and add other\
    \ functionality. For example, you might want to parse the request into variables.\n\
    \n## Summary\n\nThis chapter has demonstrated that C++ programs can make good\
    \ use of C libraries, yet provide a clean and simple interface. The piweb server\
    \ also demonstrated how to put four cores to work serving up content. Finally,\
    \ the source code provided can be extended and bent as you see fit. This puts\
    \ Pi power in your hands!\n\n## APPENDIX A\n\n### Class GPIO 1\n\nThe library\
    \ class GPIO provides a very simple API to work with the Raspberry Pi GPIO hardware\
    \ in a C++ program. Using this library class, you can immediately work to define\
    \ your application rather than rewrite or adapt the code.\n\nThis appendix is\
    \ useful for those wanting:\n\n- Learn about the file and linking options necessary\
    \ to librpi2\n- Use and understand the GPIO::GPIO class constructor\n- Configure\
    \ a GPIO for Input/Output or Alternate Function\n- Configure a GPIO pullup or\
    \ puldown resistor\n- Configure a GPIO drive strength, hysteresis, or slew rate\n\
    - Query the configuration of a GPIO pin\n- Read or Write a GPIO pin\n- Configure\
    \ and Read GPIO \"events\" on a pin (or all pins)\n\n### Assertion Macro Note\n\
    \nIn various program fragments, you will often see the use of the C language assertion\
    \ macro. Its support is provided by the following file:\n\n```cpp\n#include <assert.h>\n\
    ```\n\nThis facility is used to force an abort after an informative message when\
    \ the unexpected occurs. For example, if a return code rc is expected to succeed,\
    \ then the following assertion macro is a safeguard:\n\n```cpp\nint rc;\nassert(!rc);\
    \ // Abort if rc != 0\n```\n\nThe argument expression to the macro must evaluate\
    \ true. Otherwise it is designed to print to the terminal the source module name\
    \ and line number, followed by an abort. This is extremely useful in places where\
    \ you don't expect to see a failure, but still that check in case it does.\n"
  mdcn: "\n\n## 第 12 章 多核 Web 服务器\n\n## WebMain::start()\n\n在主程序调用 `start()` 方法之前，它会使用\
    \ `set_callback()` 注册一个回调函数。通过这种方式，在源模块 `piweb.cpp` 中找到 `http_callback()` 函数将代表处理请求的线程被调用。我们稍后会看到更多内容。\n\
    \n一旦调用了配置方法，`start( )` 方法就会启动并运行服务器。基本步骤应用如下：\n\n- 1. 根据配置的地址、端口和队列长度（backlog）值创建一个监听接字\
    \ (lsock)。\n- 2. 忽略 Unix SIGPIPE 信号，这可能在网络 I/O 中发生。\n- 3. 创建并启动每个配置好的工作线程来处理请求。这启动了服务器，它会迅速准备好提供服务。\n\
    \n整个主程序主要由处理选项和启动服务器。\n\n```cpp\nint\nmain(int argc\n```\n\n```cpp\nif ( opt_errs\
    \ ) {\n    usage(argv[0]);\n    exit(1);\n}\n```\n\n```cpp\nwebmain.set_callback(http_callback);\n\
    rc = webmain.start();\nif ( rc != 0 ) {\n    fprintf(stderr,\"%s: Starting webmain\\\
    n\",strerror(-rc));\n    exit(2);\n}\n```\n\n```cpp\nwebmain.join();\nreturn 0;\n\
    ```\n\n```cpp\n// End piweb.cpp\n```\n\nWebMain 类处理了所有与接字和 libevent 调用相关的繁琐工作。\n\
    \n## 工作线程设计\n\n剩余的 libevent 内容发生在 `worker class.cpp` 中。感兴趣的人可以查看 `worker.hpp`\
    \ 中的类定义以及 `worker.cpp` 中的类实现。我们在本章中仅讨论其中的一些**亮点**。\n\n默认情况下，libevent 结构不是线程安全的。有方法可以配置\
    \ libevent 以开启线程安全，但最好留给程序员来控制。这让我们能够控制真正需要多少线程安全性，并让服务器更高效。\n\n为了避免竞态条件，每个工作线程都创建了自己的“事件基底”（`struct\
    \ event_base`）。许多 libevent 处理依赖于此结构（参见 `worker::()`）。每个工作线程在同一个监听接字上监听连接。这允许任何线程接受下一个连接并将其添加到自己的事件基底中进行处理。已经在处理请求的线程将无法接受连接，因此具有天然的负载均衡效果。\n\
    \n工作线程基本上在 `dispatch()` 方法中的一个紧凑线程内循环：\n\n```cpp\nWorker::dispatch() {\n    while\
    \ (!shutdown) {\n        event_base_loop(thread_base, EVLOOP_ONCE);\n    }\n}\n\
    ```\n\n基本上，一旦在线程自身的事件基底（命名为 `thread_base`）上触发了事件，就会触发一个调用并传递到我们之前看到的回调函数。在查看此之前，让我们看看\
    \ Web 服务器是如何被触发关闭的。\n\n## 服务器关闭\n\n工作线程面临的问题是如何让它对关闭事件做出响应。当服务器忙碌时，这不是问题，因为 `Worker\
    \ :dispatch` 中的循环可以测试关闭标志（`shutdown`）。但当没有传入请求时，该标志位不会被测试！需要一个事件来唤醒 `base_loop()`\
    \ 以退出。\n\n解决这个问题的方法是创建一个匿名管道（参见 Linux API 的 `pipe(2)`）。然后我们将管道的读端添加到 `event_base`。当工作线程需要退出时（`shutdown`），我们只需向管道写入一个字节（通过\
    \ `Worker :request_shutdown()`）。这会唤醒 `base_loop()`。基底事件注册的回调会调用工作线程的 `notify_cb()`\
