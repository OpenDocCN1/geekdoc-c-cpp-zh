    ## Data Modes


    In the examples that we looked at, we generated steady PWM signals according to
    values of M and S. It is also possible to send data rather than fixed values,
    which is the Serial aspect of the peripheral is all about. Data can be written
    directly or it be queued to a FIFO. It must be noted, however, that the FIFO is
    shared between a pair of PWM peripherals. This makes it possible to generate stereo
    audio by interleaving the data left and right channels.


    Although said is an obvious option, other signal applications are possible. For
    example, if you want to send a single Manchester signal to a small microcontroller
    (MCU) like an AVR device, you could divide a PWM signal for data. This might be
    useful for one-way (half-duplex) communication where you want to save the MCU
    serial Universal Asynchronous Receiver Transmitter (UART) peripheral for other
    purposes.


    If this is something that interests you, you are encouraged to read more about
    the PWM peripheral''s capabilities in the Broadcom documentation.[1]. Furthermore,
    this is made easier by the GPIO class provided in the software for this book.
    Appendix B focuses on the PWM capabilities of the GPIO class.


    ## Summary


    In this chapter, the pipwm was described in detail to get you another Raspberry
    Pi 2 tool in your toolbox. If you used the PiSpy utility, you also gained hands-on-experience
    with the PWM peripheral. Finally, we looked at the Raspberry Pi that you have
    in the peripheral''s configuration. The PWM peripheral on the Raspberry Pi is
    a very capable resource.


