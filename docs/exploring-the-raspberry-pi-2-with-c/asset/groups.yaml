    电路在输出状态切换时确实会有电流尖峰。注意当输出状态切换时，尖峰在 8 ms 和 12 ms 处重复。


    CMOS 电路的主要优势是当处于稳定状态时几乎没有电流流动。由于一个 MOSFET 关而另一个开，因此只有极少的电流从顶部流向底部。


    ### CMOS 输入


    图 8-3 和 8-4 展示了 CMOS 配置最基本的方面。由于 MOSFET 使用电压激活的栅极，几乎没有电流流入输入。成对栅极对驱动电路几乎没有影响。


    然而，如果 M1 和 M2 的栅极保持未连接，电压会在栅极上“浮空”。空气中的电荷可能会聚集在栅极导体上并带高电电。干燥天气下带电物体经过会在附近的浮空导体上感应出极高的电压。相反，电子可能会从栅极中移除，导致极正电荷，这同样具有破坏性。


    如果电荷变得过负（正），当火花强制穿透时，MOSFET 与硅之间的隔离层就会损坏。这种穿孔会导致与硅连接，导致设备没有隔离的栅极。这就是为什么让 MOSFET
    栅极保持未连接是一个坏习惯。在没有过高电压的情况下，未连接的栅极可能会聚集电荷并变成正电或负电，导致异常行为。上拉或下拉电阻通过强制栅极在被驱动前保持高或低电平来解决这个问题。


    避免浮空栅极的另一个原因是避免大电流。回想图 8-4 所示的所有尖峰。如果你将输入保持在 +3.3V 和地之间的大一半处，M1 和 M2 都会严重导电。这不仅浪费能量，还可能导致永久损坏和过度过热。


    如果你使用上拉或下拉电阻，就可以防止 GPIO 引脚浮空。这些上拉和下拉电阻的值应约为 50 k欧姆。这些值足以将输入保持在高或低逻辑电平，并提供高输入阻抗。但要注意，可能会配置没有上拉或下拉电阻的输入，除非有其他连接，否则输入将处于浮空状态。提供的
    `gp` 命令 `-p` 允许你配置拉电阻。


    ### 输入保护


    图 8-5 说明了如何保护 MOSFET 的输入栅极免受高电压的影响。使用了反偏二极管，有时还会使用电阻。（Dan Lancaster 在他的《CMOS CookBook》中列出了四个，但我们在这里关注一个）。由于二极管是反偏的（不导电），它们不会干扰电路的正常运行。电阻
    R1（如果存在）通常是一个约为 500 欧姆的小值电阻。由于正常 CMOS 电路几乎没有电流，电路的运行就像电阻不存在一样。


    ## 第8 章 GPIO 接口的物理学


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_101_0.png)


    **图 8-5.** CMOS 输入保护二极管


    如果输入变为负电，二极管 D1 开始导电并将电流分流到地（条件在约 -0.6 V 以上）。电阻 R1 限制电流流以避免损坏保护二极管。这是释放负静电荷的机制。同样，如果电压升高于
    $V_{DD}$，电流将从输入经过 R1 流向 D2 到 $V_{DD}$（D2 导电开始于 $V_{DD}-0.5V$ 以上）。随着时间推移，R1 限制了通过
    D2 的电流。这种简单的结构将 MOSFET 栅电压保持在 GND（$V_{DD}$ 减 0.6V 到加 0.6V）范围内。


    从设计角度来看，你不应该依赖 R1 或 D1 来处理极端信号波。这些仅仅是为了防止电荷损坏设备。如果你在栅极限制以上或以下有杂乱的波动，你应该提供自己的信号处理。原因仅仅是二极管或电阻可能无法处理所需的电流水平。例如，Broadcom
    不提供 GPIO 的处理规格。例如，CM 4000 系列芯片可以从 +3.3V 供电，其输入范围允许高达 +15V。


    ### CMOS 输出


    图 8-3 展示了用于输出的 CMOS 对。在任何时刻只有 M1 或 M2 导电，当输入为低或高电平时。你可能有一个与 Raspberry Pi 连接的 CMOS
    输出。在系统启动的 20 秒左右时间内，两个 CMOS 输出连接在一起。一旦 GPIO 被重新配置为输出，电阻仍然存在但没有实际影响（GPIO 输入不导电）。只有在信号变化时，由于分布电容的充电和放电产生极小的电流。当
    GPIO 以高速率变化时使用低值 R1 (1k)。否则你可以可以使用高达 10k 欧姆的电阻作为 R1。


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_102_0.png)


    **图 8-6.** 输出冲突


    使用电阻进行 GPIO 安全


