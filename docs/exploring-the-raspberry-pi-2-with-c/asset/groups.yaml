    # Predefined Macros


    Macros are useful for code that must be portable. But do you know what macro names
    are available? Using some compiler options, you can have them listed for grep.
    The following example lists macros connected in system with the keyword "ARM"[1]
    Using grep -i allows us to filter while ignoring case.


    ```

    $ /usr/bin/g++-4.7 -DM -E c++ /dev/null | grep -i ARM

    #define __ARMEL 1

    #define __FEATURE_UNALIGNED 1

    #define __ARM_PCS_VFP 1

    #define __ARCH_6 1

    #define __arm 1

    #define __ARM_EABI 1

    #define __ARM_FEATURE_DSP 1

    ```


    Leave out the grep portion of the command to get the full macro list. Knowing
    that macro __arm__ exists, for example, allows you to conditionally compile code
    specific to the ARM architecture, using preprocessor statements like this:


    ```

    #ifdef __arm__

    // Do something ARM specific

    #endif

    ```


    # Summary


    By this point, you should have a general understanding of how to apply STL containers.
    We''ve covered the main fundamentals that you need to get started. The remaining
    details can be read at the cplus.com website. There you can discover other methods
    like clear(), which empties the container of all values.


    # Bibliography


    +   [1] "C/C Tip: How to List Compiler Predefined Macros" http://nadeoftware.com/articles/2011/12/c_c_tip_how_list_compiler_predefined_macros.
    Accessed August 4, 2015.'
  - "[PAGE 144]\n\n# CHAPTER 12\n\n# Multicore Web Web Server\n\nGiven the Raspberry\
    \ Pi 2 has four CPU cores of bristling computing power, this chapter provides\
    \ an example web server project that can use them all. Although this project uses\
    \ the C libevent library in the background, a nice C++ class wraps the C API in\
    \ a nice C++ package. In this chapter we examine a web server built from scratch\
    \ (from libevent) that is fast and lean. Most important, it be easily extended\
    \ to do just anything that the Pi can do.\n\n# libevent\n\nThe C libevent library\
    \ has been a popular, time-tested library for implementing portable web servers\
    \ and web clients. The main web site for it can be found at http://libevent.org/\n\
    A popular documentation site for libevent is http://www.wangafu.net/~nickm/libevent-2.0/doxygen/html/.\n\
    \nIn this API Reference at the bottom of the page, we will be making use of any\
    \ event, .event and event/h.h.\n\nIf you visit the event2/http.h link, you will\
    \ see that there is a large number of C API functions and macros available. Building\
    \ a web server from scratch could take considerable time, with the library resources\
    \ available.\n\nIn this chapter, we look at a very simple-to-use WebMain C++ class,\
    \ to make it as simple as it can be to build your own custom web server. You will\
    \ have the satisfaction of building precisely the way that you want it to be without\
    \ the bloat of some the popular offerings.\n\n# ClassWebMain\n\nIn your downloaded\
    \ source code, change that to the piweb subdirectory. There you will find the\
    \ source code and make files for the piweb C++ server. The primary focus of this\
    \ chapter is the class definition in the webmain.hpp.\n\nIn that source file,\
    \ you will see the overall class definition for WebMain:\n\n```\nclass WebMain\
    \ {\n    int                 backlog;             // Listen backlog\n    std::string\
    \         address;           // Listen IPv4 Address\n    int                 port;\
    \               // Listen port\n    int                 lsock;              //\
    \ Listen socket / -1\n    int                 threads;            // # of worker\
    \ threads\n    std::vector<Worker*> workers;        // Ptrs to worker threads\n\
    \    Worker::http_callback_t callback;   // HTTP Callback\n```"
