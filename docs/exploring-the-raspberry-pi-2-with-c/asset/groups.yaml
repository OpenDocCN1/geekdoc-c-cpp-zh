    \ steps to install pispy:\n\n- 1. Build the rpidma kernel module.\n2. Install\
    \ the rpidma module.\n3. Reboot to test autoloading of rpidma.\n\nOnce the rpidma\
    \ loadable module is installed, you'll be able to capture GPIO signals at your\
