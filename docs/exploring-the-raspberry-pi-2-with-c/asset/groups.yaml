    # CHAPTER 3 THE MATRIX (CPU UTILIZATION)


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_39_0.png)


    **Figure 3-5.** Location of $R_{set}$ on the matrix pcb (R1 = 10K)


    The unit I purchased uses a $R_{set}$ ($R_n$ on the pcb) value of 10K (white arrow
    in Figure 3-5). The removed LED matrix part number was 108AS. Looking up that
    datasheet provided the following information (these parameters vary among manufacturers):


    +   - Forward current: 2.1V to 2.5V

    - Forward current: 20 mA (other datasheets list this as the absolute maximum)


    The MAX7219 chip is limited to approximately 1066 mW at 70°C. Using the datasheet
    and the LED parameters, I was able to calculate that this pcb is safe at maximum
    brightness without the absolute limit (a good datasheet exercise for the reader).

    nReviewing the MAX7219 datasheet, you might have noticed that the $R_{set}$ value
    of 10K is designed to deliver 40 mA at maximum brightness (20 mA the limit for
    our LED). However, this is safe if the duty cycle is not 100% (continuous). When
    scanning eight rows of LEDs, a given row of LEDs is only consuming 1/8 of the
    power. One datasheet, in fact, notes that the "Forward Current is 100 mA [1]"

    In this connection, software can configure the MAX7219 IC to display fewer than
    eight (one is the default on power). If your software does this purposely or by
    accident, correct the situation as soon as possible (removing the Matrix pcb +5V).
    With fewer rows to display, the duty cycle for each row of LEDs is 1/8 duty 12.5%,
    but 1 in 100! It is possible for software to destroy hardware.


    # MAX7219 Commands


    The MAX7219 is interfaced to its microprocessor using a serial interface. We''ve
    already briefly looked at the three input signals CLK, DIN, and LOAD. The CLK
    signal does not need to be of a regular clock period, so we can say "bit-bang"
    all of the signals to the IC using GPIO signals. We only need to make certain
    that certain events do not happen too quickly.


    The input to the device is a 16-bit word, where the most significant bit (MSB)
    is shifted in first. The general format of the command word is illustrated in
    Table 3-1.


    23'
  - '[PAGE 40]


    # CHAPTER 3 THE MATRIX (CPU UTILIZATION)


    **Table 3-1.** MAX7219 Command Word Format


    # MAX7219 Command Word


    | D15 | D14 | D13 | D12 | D11 | D10 | D9 | D8 | D7 | D6 | D5 | D4 | D3 | D2 |
    D1 | D0 |

    |---|---|---|---|---|---|---|---|---|---|---|---|---|---|---||

    | X | X | X | X | Address/Command | Data | | | | | | | | | |


    D15 is the MSB of the word, and D0 is the least significant bit (LSB). The most
    significant bits D15 ... D12 are ignored by the device (“don’t care” is shown
    with an “X”), but must be provided when shifting data to the device. Bits D11
    ... D8 specify the row (or digit) *address*, and otherwise specify an “instruction”
    code for display commands. The applicable data is provided in the low-order eight
    bits of the word.


    # Display Data Commands


    When the Address field provides values 1 through 8 (0b0001 through 0b1000), the
    associated bits in the Data field drive the LEDs (in one of two modes). See Table
    3-2.


    **Table 3-2.** MAX7219 Display Digit Command


    | D15 | D14 | D13 | D12 | D11 | D10 | D9 | D8 | D7 | D6 | D5 | D4 | D3 | D2 |
    D1 | D0 |

    |---|---|---|---|---|---|---|---|---|---|---|---|---|---|---||

    | X | X | X | 0b0001 to 0b1000 | Display Data | | | | | | | | |


    The data contained in bits D7 ... D0 are interpreted as the *digit* configuration.
    Each digit may operate in Binary Coded Decimal (BCD) mode, or simply as individual
    bit drivers. In BCD mode, only the low-order bits D3 ... D0 are used and are mapped
    to a seven-segment display code according to a font map.


    When not operating in BCD mode, each 1-bit in D7 ... D0 causes the corresponding
    driver to turn on. This is the mode that we will be using with the Matrix.


    # Decode Mode Command


    The decode mode shown in Table 3-3 controls the configuration for each digit (row
    of LEDs). Each bit in D7 ... D0 controls the configuration of digits 7 through
    0. When the corresponding bit holds a 1-bit, the BCD mode will be in effect for
    that digit. A 0-bit specifies that no display mapping is to take place. Each bit
    D7 ... D0 will be displayed as given.


    **Table 3-3.** MAX7219 Decode Mode Command


    | D15 | D14 | D13 | D12 | D11 | D10 | D9 | D8 | D7 | D6 | D5 | D4 | D3 | D2 |
    D1 | D0 |

    |---|---|---|---|---|---|---|---|---|---|---|---|---|---|---||

    | X | X | X | 0b1001 (0x09) | Decode Modes | | | | | | | | | |


    In our project, we will set the bits to zero so that BCD mapping occurs.'
  - '[PAGE 41]


    # Intensity Command


    The MAX7219 can adjust its display intensity under software control. Table 3-4
    illustrates the format of the intensity setting command, which affects the entire
    display. The intensity value can be a value from 0 (minimum brightness 0b0000)
    to 15 (full brightness 0b1111). If you plan to display one to three digits (rows),
    use this command to reduce the intensity to a low value.


    | D15 | D14 | D13 | D12 | D11 | D10 | D9 | D8 | D7 | D6 | D5 | D4 | D3 | D2 |
    D1 | D0 |

    |---|---|---|---|---|---|---|---|---|---|---|---|---|---|---||

    | X | X | X | X | | 0b1010 (0x0A) | | | X | X | X | | Intensity | | |


    # Scan-Limit Command


    The number of digits (rows) to be displayed by the device is configured through
    the scan-limit command shown in Table 3-5. A value of 0 through 7 specifies that
    the number of digits displayed will be one through eight, respectively. We will
    be displaying all rows, so we will use 0b111 (7) in your project. If you choose
    a low number of digits (like one to three digits/rows), then you''ll want to reduce
    the intensity of the display significantly to avoid exceeding device limits. Fewer
    digits mean that each digit or row operates at a higher duty cycle.


    **Table 3-5.** MAX7219 Scan-Limit Command


    | D15 | D14 | D13 | D12 | D11 | D10 | D9 | D8 | D7 | D6 | D5 | D4 | D3 | D2 |
    D1 | D0 |

    |---|---|---|---|---|---|---|---|---|---|---|---|---|---|---||

    | X | X | X | X | | 0b11011 (0x0B) | | | X | X | X | X | | Digits | |


    # Shutdown Command


    Shutdown mode can be used to save power and is also the operating mode at startup.
    The command format is described in Table 3-6. When the flag F is a 1-bit, the
    device enters shutdown mode and the scan oscillator is stopped. All the digit
    (or row) drivers are disabled so that the display is blanked and not consuming
    power. It is still possible to program the device while it is shut down.


    **Table 3-6.** MAX7219 Shutdown/Enable Command


    | D15 | D14 | D13 | D12 | D11 | D10 | D9 | D8 | D7 | D6 | D5 | D4 | D3 | D2 |
    D1 | D0 |

    |---|---|---|---|---|---|---|---|---|---|---|---|---|---|---||

    | X | X | X | X | | 0b1100 (0x0C) | | | X | X | X | X | X | X | F |


    When bit F is a 0-bit, the device leaves shutdown mode and becomes enabled. It
    is important to realize that the device needs about 250 µs to leave shutdown mode.
    It is also important to keep in mind that test mode overrides shutdown command
    (see next).


    # Test Mode Command


    Test mode enables the display of all digits (rows) and all segment digits (LEDs).
    You need to be aware of this mode because it trumps shutdown and enables mode.
    You can enable the device (leaving shutdown mode) but still see that all LEDs
    remain lit. This is because test mode remains in effect and overrides the display
    regardless of all internal state changes.'
  - '[PAGE 42]


    # CHAPTER 3 THE MATRIX (CPU UTILIZATION)


    To regain normal control of the device, you need to disable test mode by setting
    the T bit in Table 3-7 to zero. When T = 0, test mode is disabled, otherwise T
    = 1 enables test mode.


    # Table 3-7. MAX7219 Test Mode Command


    | D15 | D14 | D13 | D12 | D11 | D10 | D9 | D8 | D7 | D6 | D5 | D4 | D3 | D2 |
    D1 | D0 |

    |---|---|---|---|---|---|---|---|---|---|---|---|---|---|---||

    | X | X | X | | | 0b1111 (0x0F) | | X | X | X | X | X | X | T |


    When discussing, it is worth mentioning a potential pitfall when developing new
    code for this device (I was bitten by). When the MAX7219 is powered on and initialized,
    it will appear that the device shift register high (1-bit), when you configure
    your GPIO pins for output and set the LOAD signal high if the former output state
    was low, or the pin was an input low enough to voltage to be so low, then setting
    the LOAD signal high will result in a command from the shift register (the device
    acts on a low-to-high transition). When the shift register contains all 1-bits,
    this results in a test mode command.

    You can send commands and configure the device in test mode, but the display will
    only reflect all LEDs you shift the fruit of your labors. One way to avoid this
    (at least until the code is mature) is simply to leave the LOAD signal at the
    low level until you have shifted known valued bits.


    # No Operation Command


    The no operation (NOP) command (see Table 3-8) seems like a silly operation to
    support at first, but the MAX7219 is designed to allow the engineer to link other
    MAX7219s in a chain for larger displays. To set one display in chain without changing
    the other requires use of a NOP command for the device to remain unaffected. We
    are using only one driver software, so this is only of academic interest to us.
    But you, the experimenter might have a need for it in your own projects.


    # Table 3-8. MAX7219 No Operation Command


    | D15 | D14 | D13 | D12 | D11 | D10 | D9 | D8 | D7 | D6 | D5 | D4 | D3 | D2 |
    D1 | D0 |

    |---|---|---|---|---|---|---|---|---|---|---|---|---|---|---||

    | X | X | X | X | 0b0000 (0x00) | | X | X | X | X | X | X | X | X |


    # Matrix Signals


    I have loosely described the CLK, DIN, and LOAD signals, but let''s look at a
    real example to cement all the concepts together. Figure 3-6 shows a logic analyzer
    trace of one command sent using the GPIO signals.'
- md: "\n![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_43_0.png)\n\n**Figure 3-6.** Example\
    \ MAX7219 GPIO command signals\n\nThe top row shows the clock (CLK) pulses. Data\
    \ is clocked into the device when the CLK signal goes from low to high. The middle\
