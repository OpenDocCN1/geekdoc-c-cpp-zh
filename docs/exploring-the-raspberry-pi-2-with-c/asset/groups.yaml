    \ by the system but might not always be able to finish with the pi displayed.\
    \ The system tends to be in a hurry to have all processes stopped.\n\n## Bibliography\n\
    \n[1] \"8x8 Dot-Matrix 3mm dia. Bicolour LED Display\", SURE Electronics. http://mail.rsgc.on.ca/~cdarcy/Datasheets/LE-MM103.pdf\n\
    \n## CHAPTER 4\n\n## Installing a Kernel\n\nTo install and use the pispy logic\
    \ analyzer tool, we must first build and install a kernel loadable module. This\
    \ rpidma module provides safe and automatic access to the Pi’s DMA peripheral\
    \ and its interrupts for the pisipy tool.\n\nIdeally, you would \"just\" compile\
    \ the module itself and install it. However, kernel loadable modules depend on\
    \ various parts of the entire kernel source tree. Furthermore, kernel loadable\
    \ modules must the kernel release that is running. You used to be short-circuit\
    \ this with the use of the modprobe -f option, but this no longer works (it silently\
    \ fails). This brings us back to building and installing a new kernel.\n\nThe\
    \ good news is that the Raspberry Pi 2 can build a kernel without cross-compiling\
    \ in about 2 hours. This greatly simplifies the overall procedure. This chapter\
    \ outlines every step of the way to make it painless and save you time.\n\n##\
    \ Overall Procedure\n\nThe overall steps involved in building and installing a\
    \ new kernel are listed here.\n\n- 1. Download the kernel source code.\n2. Check\
    \ out the branch (see the section “Specific Kernel Releases”).\n3. Prepare and\
