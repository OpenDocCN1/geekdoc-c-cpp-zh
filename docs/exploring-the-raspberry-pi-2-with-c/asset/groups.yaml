  - "[PAGE 141]\n\n# CHAPTER 11 C++ QUICK START\n\nWhat about getting a C string value\
    \ from std::string object? Consider this printf:\n\n```\nvoid\nmyfunc(std::string\
    \ arg_one) {\n    printf(\"arg_one=%s\\n\",arg_one.c_str());\n}\n```\n\nBy use\
    \ of std::string method c_str(), we are able to get a valid C string pointer out\
    \ of the std::string object. This was expensive in CPU and memory terms? No, because\
    \ the std::string object is organized to keep the internal copy of the string\
    \ in a format acceptable as a normal string. When arg_one.c_str() is called, it\
    \ only needs to return an internal pointer to the C's buffer.\nIf need further\
    \ proof of this, try this experiment (I called my file t.cpp):\n\n```\n#include\
    \ <stdio.h>\n#include <string>\n```\n\n```\nint\nmain(int argc,char **argv) {\n\
    \    const std::string hello = \"Hello World\";\n\n    printf(\"hello=%s\\n\"\
    ,hello.c_str());\n\n    return 0;\n}\n```\n\nAfter creating source file t.cpp,\
    \ compile and run it:\n\n```\n$ g++ -Wall t.cpp\n./a.out\nhello=Hello World\n\
    $\n```\n\nWhat does this prove?\n\n+   1. std::string hello was declared const,\
    \ meaning that after it is constructed, it must not be modified in any way.\n\
    2. When hello.c_str() is called, no compiler error is generated (the method c_str()\
    \ is declared as not modifying the object data (const)).\n3. The program execution\
    \ demonstrates this with works.\n\nArmed with only those two ideas, you can do\
