    # CHAPTER 9 ■ PISPY


    ```

    -L gpio    Trigger on level low

    -T tries    Retry trigger attempt n times (100)

    -v         Verbose

    -X         Don''t execute gtkwave

    -Z         Don''t suppress gtkwave messages

    -h         This info.

    ```


    Notes:


    + * Only one gpio may be specified as a trigger, but rising, falling high and
    low may be combined.

    * To run command with all defaults (no options), specify ''--'' in place of any
    options.

    * If gtkwave fails to launch, execute file .gtkwave.out in the current directory.


    # Capture Length


    The first decision you make is how to capture data for data. Data is captured
    in 64K byte blocks. Each sample requires 4 bytes (32 bits), so it means that 16,384
    samples are captured in each block. Using a non-clocked Raspberry Pi 2, the samples
    are captured at a rate of about 80.5 ns. More about this sampling rate follows
    later.


    This means one block of capture takes about 1.3 ms. So if you need to capture
    a 20 ms event, then you need about 20/1.3 = 16 capture blocks.


    When the number of blocks is not chosen, the default option used is -b1:


    ```

    $ pispy -b16

    ```


    When choosing your capture length, realize that the memory resource is temporarily
    borrowed from the GPU. In the Raspberry Pi 2, you must have DMA memory that is
    not interfered by the four CPU cores and their caches. To eliminate this problem,
    pispy uses the kernel mailbox facility to allocate memory from the GPU. The allocated
    memory is only used during the capture and is then returned. However, if your
    GPU is already short of memory (maybe by your custom configuration), then you
    don''t want to overflow the size of the memory block requests.


    # Capture Resolution


    In the preceding section, we noted that the capture occurs at the rate of about
    80.5 ns (nearly 12.4 MHz). However, if you experiment, you will find that the
    highest sample rate that you capture is about 1 MHz. This is due to the fact that
    the sampling rate provided by the DMA occurs at a higher rate than the internal
    GPIO controller can read. The DMA peripheral oversamples the GPIO pins.


    The system''s DMA is used by pispy to capture GPIO samples as fast as it can,
    meaning that it is not regular. CPU accesses to memory can disrupt a given DMA
    access among other complex interactions. However, when sampling GPIO signals at
    rates below 2 MHz, you will not notice this slight irregularity.


    # Verbose Option


    The -v (verbose) option for the command reports some internal information about
    the DMA request and interrupts, so on. The following is an example:


    ```

    $ pispy -b1 -v

    1 x 64k blocks allocated.

    GPLEVO = 0x7E200034

    DUMP of 1 DMA CBs:

    CB # 0 @ phys addr 0x3DB62000

    TI.INTEN : 1

    TI.TMODE : 0

    TI.WAIT_RESP : 1

    TI.DEST_INC : 1

    TI.DEST_WIDTH : 0

    TI.DEST_DREQ : 0

    TI.DEST_IGNORE : 0

    TI.SRC_INC : 0

    TI.SRC_WIDTH : 0

    TI.SRC_DREQ : 0

    TI.SRC_IGNORE : 0

    TI.BURST_LENGTH : 0

    TI.PERMAP : 0

    TI.WAITS : 0

    TI.NO_WIDE_BURSTS : 1

    SOURCE AD : 0x7E200034

    DEST_AD : 0x3DB62000

    TXFR_LEN : 65504

    STRIDE : 0x00000000

    NEXTCONBK : 0x00000000

    END DMA CB DUMP.

    No triggers.

    Interrupts.. 1 (1 blocks)

    Captured: writing capture.vcd

    exec /usr/bin/gtkwave -f captured.vcd

    $

    ```


    This information is targeted at those who want to make changes to pispy. However,
    one important piece of information is the number of interrupts (1 here). There
    should be one interrupt for each 64k block of cap data. If you don''t see that,
    then the driver is not doing its job.


    # Option -x


    By default, pispy invokes gtkwave automatically after the capture.vcd file has
    been written (in your current directory). If for some reason, you don''t have
    the X Window display available, then you might want to tell pispy not to try to
    execute it. The following is an example:


    ```

    $ pispy -b1 -x

    Captured: writing capture.vcd

    $

    ```


    # Triggers


    When you have a continuous waveform, like perhaps a PWM signal, then you don''t
    need a trigger. You simply capture a certain amount of time and display the signal.


    For other types of signals, there can be hundreds of milliseconds between interesting
    events. Trying to capture the interesting part can be challenging without a triggered
    capture.


    The pispy tool supports a limited form of triggering. The types of triggering
    options are as follows:


    - Trigger a capture on a rising GPIO (-R gpio)

    - Trigger a capture on a falling GPIO (-F gpio)

    - Trigger a capture on a high-level GPIO (-H gpio)

    - Trigger a capture on a low-level GPIO (-L gpio)


    These options can be combined if necessary (but only for the same GPIO). What
    are the limitations? The DMA capture performs the sampling of GPIO pins. This
    is faster and more reliable than trying to do from software. We set up the DMA
    control(s) and unleash it, pispy performs the following to implement trigger functionality:


    1. Set up DMA control and start the capture.

    2. pispy waits for the first interrupt (first block has been captured).

    3. While the DMA continues (for block captures), pispy examines the first block
    for trigger event.

    4. If the trigger event has been found in the first block, the capture is permitted
    to run to completion.

    5. Otherwise, pispy aborts the current capture.

    6. If the number of tries has not exceeded (-T), repeat from Step 1.


    For this reason, triggers must also provide a number of tries using the -T option.
    The following example shows attempt to capture a rising edge on GPIO4:


    ```

    $ pispy -b1 -R4 -T9

    ```


    # GTWave


    The gtkwave command is used to display the captured content, written to the file
    named capture.vcd. If you run pispy from the desktop, or using an X Window session,
    pispy will invoke gtkwave automatically (unless the -x option was provided). When
    using ssh, be sure to add the -X option:


    ```

    $ ssh -X pi@192.168.2.4

    ```


    Sometimes you find, however, X Window support fails, requiring me to log again.
    If you suspect this is happening because gtkwave does not come up, then add the
    option -z to the command line, or inspect the file .gtkwave.out in your current
    directory:


    ```

    $ pispy -b1 -z

    Captured: writing capture.vcd

    Could not initialize GTK! Is DISPLAY var set?

    Usage: -f [DUMPFILE] [SAVEFILE]

    ```


    The error message "Could not initialize GTK!" is an indication that the DISPLAY
    variable is not set, or X Window services are not working.


    # Invoking GTWave


    Normally pispy invokes GTWave for you. If your captured data is interesting, you
    might want to review it. To do this, you can manually start GTWave as follows:


    ```

    $ gtkwave -f captured.vcd

    ```


    If your DISPLAY environment variable is set and exported, then the gtkwave command
    should open a graphical display window, as shown in Figure 9-1.


    ![](img/1dfed1a8285ca59b56ea8db2ed73fb_112_png)


    Figure 9-1. Opening GTWave


    The same display occurs automatically if pispy starts it.


    # Using GTWave


    Normally, using a GUI like this should be intuitive, but you might find GTWave
    a bit unintuitive at first. After you know what to do, though, things work well.


    The first worry you have when you open it up is that it appears we have no information!
    It''s there, however, use your mouse and click Top in the top left window of the
    display. This should highlight Top and show signals in the window below after
    you do this. Figure 9-2 shows how all of the GPIO signals become active in the
    window below.


    ![](img/1dfed1a8285ca59b56ea8db2ed73fb_113_0.png)


    Figure 9-2. Signals are shown after clicking Top


    Now that you see the names, you must choose a signal and drag it into the Signals
    window to the right. This will get some sort of a plot going in the black window
