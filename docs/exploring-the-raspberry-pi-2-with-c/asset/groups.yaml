    使用内核邮箱箱机制（kernel mailbox facility）从 GPU 分配内存。所分配的内存仅在捕获期间使用，随后会返回。然而，如果你的 GPU
    内存已经短缺（可能是由于你的自定义配置），那么你就不希望内存块请求的大小溢出。


