    \ pin to use (26)\n- load_gpio Specifies LOAD gpio pin to use (21)\n- meter_gpio\
    \ Specifies the GPIO to use for the meter (none)\n  Meter gpio choices: 12, 13,\
    \ 18 or 19\n\nThe mtop command outputs 8 columns of activity in the matrix:\n\n\
    - CPU 1 utilization (leftmost)\n- CPU 2 utilization\n- CPU 3 utilization\n- CPU\
