  mdcn: '

    最好用的笔外部是圆形的，并且由相当坚固的塑料制成。这支笔比我手里的要软一点。取出圆珠笔和墨水，丢掉端盖。使用小型切管钳（见图 2-6），从末端切下一小段来测试塑料硬度。如果你发现它太软，就尝试换一支笔。早些，我从酒店免费获得了一支，非常完美。我希望我有更多那种笔。


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_25_0.png)


    **图 2-6.** 小型切管钳


    找一些长度足够穿过 PCB 并进入木材（3/4 英寸），且足够小能穿过 PCB 孔的螺丝。我的螺丝无法完全穿过 PCB，因此我不得不用钻头小心地削掉一些 PCB。我使用了一个刚好适合孔径的钻头，但通过稍微转动钻头，我获得了所需的少量额外间隙。不过，这一点要非常小心。任何暴力操作都可能损坏你的
    Pi。


    准备好木材并选好木螺丝后，确定所需的垫片长度。不要忘记考虑到 PCB 的厚度。在我的情况下，我选定的垫片长度约为 9 mm。图 2-7 显示我从笔上切下一个垫片。


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_26_0.png)


    图 2-7. 切割垫片


    即使你以前从未用过切管钳，该操作也非常简单安全。将工件放在切刀之间，转动手柄拧紧。不要过度拧紧，只需紧到刀片在你旋转切管钳时能够切割即可。转几圈后，再拧紧一点。如果你使用的是硬塑料，切管钳最终会切掉一段。我使用的笔是软塑料，所以切管钳只是留下了圆环。等环切得足够深后，你可以用美工刀完成（下方垫一块废木进行切割）。


    图 2-8 显示了立起的螺丝和垫片，让你直观地看到有多少螺丝会露出来。


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_26_1.png)


    图 2-8. 露出的垫片和木螺丝


    ## 第 2 章 工作站


    几乎完成的工作站如图 2-9 所示。树莓派 2 安装在左侧，所有接口都面向我。MicroSD 卡是从照片的背面插入的。MicroUSB 电源接口和 HDMI
    连接位于左侧（木材末端）。这留下了右侧的 GPIO 2x20 针排用于连接面包板，我们还没有讨论过它。


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_27_0.png)


    **图 2-9.** 几乎完成的树莓派 2 工作站


    ## 面包板排扩展 (Breadboard Breakout)


    为了方便进行原型实验，我购买了一个适用于树莓派 2（以及 B+）的 T 型排扩展板。图 2-10 显示我使用的扩展板。


    11


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_28_0.png)


    **图 2-10.** 树莓派 2 扩展板


    注意键槽，它可以帮助你对齐电缆引脚方向。如果你使用没有这种键的电缆，那么对齐电缆，使标记的导线（图 2-10 中的白色）与插座的 1 号引匹配非常重要。接收插座上应该有一个小三角形标记
    1 号引。


    排线的另一端必须插入树莓派 2 的 J8 接口。因为那里没有键槽插座，所以正确对齐连接器非常重要。图 2-11 显示了连接器如何配合 J8。


    ## 第 2 章 工作站


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_29_0.png)


    **图 2-11.** 连接到树莓派 PCB 的 2x20 排线


    在图 2-11 中，你可以看到左侧的三角形。中间的凸起有助于确认方向是否正确。此引脚必须与图 2-3 右上所示带有方孔焊垫的引脚匹配。方孔垫标识了 1 号引。


    一旦连接上扩展线，进行通电以双检所有部分都已插入。图 2-9 显示红色鳄鱼夹连接到扩展板的 +3.3V 引脚，黑色夹子连接到地。这些引线的另一端连接到数字万用表（DMM）。在不插
    microSD 卡的情况下为树莓派供电，这样你就可以开关而不用担心损坏数据。我们只是想检查 +3.3V 从扩展板的哪里输出的。


    如果方向正确，你会在万用表上读到 +3.3V。如果你得到的是 +5V（在本应出现 +3.3V 的地方），说明你的排线在某一端接反了。这些操作都很简单，但也很容易出错。


    我的连接器可能需要扭转排线（我发现有些设计是不扭转的）。为了固定电缆，我本可以将电缆跨在 Pi 的 PCB 上或扩展板引脚上。我不喜欢这两种想法，所以我选择接受扭转的电缆。也许你的情况会有所不同。


    此时值得提到工作站长度的选择。你的选择取决于你选择的扩展板尺寸。如果可能，选择长款扩展板；扩展连接器将占据大量的空间。


    ## RS-232 连接


    也许我有点儿“老派”，但我喜欢有串口的选项。通过 USB 转串口线，你可以与笔记本电脑进行通信。串口还允许在不使用 USB 的情况下与 Arduino/AVR
    设备通信。最后，在配置允许的情况下，串口可以作为串口控制台使用。


    我从 eBay 购买了转换器。商品标题为“MAX3232 RS232 串口转 TTL 转换模块 (DB9)”，花费了我 15 美元。由于包邮，很难找到理由自己制作这个。2-12
    显示了该微型适配器的顶视图。


    13


    ## 第 2 章 工作站


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_30_0.png)


    **图 2-12.** RS-232 转换器的顶视图


    MAX3232 芯片设计工作电压为 +3.0V 到 5.5V（无负载时 1 mA）。只要从树莓派的 +3.3V 电源为此转换器供电，它就能安全地与树莓派的
    GPIO 线交互。这种单元仅提供 RX 和 TX 数据线。如果你需要 RTS 等额外信号，请寻找支持它们的转换器。


    图 2-12 背面的引脚如下：


    - VCC（连接到 +3.3V）

    - GND

    - RX（连接到 Pi RX）

    - TX（连接到 Pi TX）


    2-13 显示了转换器的底部。使用尖嘴钳，我用废电线弯了一个钩。


    14


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_31_0.png)


    **图 2-13.** RS-232 转换器


    你可能需要第三手将其焊接。。足够的热量使焊锡渗透焊点，而不损坏 PCB。图 2-14 显示了完成后的工作，铜制的“翅膀”准备好安装。


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_31_1.png)


    **图 2-14.** 转换器上的铜翅膀


    ## 第 2 章 工作站


    完成这些工作后，用一对木螺丝和垫圈将其安装在工作站上（图 2-15）就很简单了。我将转换器安装在工作站的背面，因为我对正面有计划（稍后会覆盖）。


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_32_0.png)


    图 2-15. 安装好的 RS-232 转换器


    ## 面表


    木材的好处在于是，只需少量规划就能轻松增加额外功能。图 2-16 说明了如何将一个 1 mA 面表添加到工作站中。我们稍后进行 PWM 实验时会用到它。

