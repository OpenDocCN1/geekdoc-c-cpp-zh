    \ io);\nint get_drive_strength(\n    int gpio,\n    bool& slew_limited,\n    bool&\
    \ hysteresis,\n    int& drive);\nint set_drive_strength(\n    int gpio,\n    bool\
    \ slew_limited,\n    bool hysteresis,\n    int drive);\n};\n```\n\n## GPIO::GPIO\
    \ 构造函数\n\n在需要的地方，可以直接不带参数地实例化 GPIO 类。例如：\n\n```cpp\n#include <librpi2/gpio.hpp>\n\
    ```\n\n```cpp\nint\nmain(int argc, char **argv) {\n    GPIO gpio;\n```\n\n但你应该仔细规划放置地址，因为在构造时，GPIO\
    \ 类会在后台执行以下操作：\n\n1. 锁定内部互斥锁（为了线程安全）\n2. 确定物理 Broadcom 外设的基地址\n3. 将 GPIO 外设寄存器映射到系统分配地址的内存中\n\
    4. 保存一些内存地址以允许访问寄存器\n5. 解锁互斥锁\n\n本质上，在执行互斥锁锁定后，代码会检查是否有另一个 GPIO 类实例（可能在另一个线程中）已经执行了此过程。如果已经执行，当前构造函数将直接使用已收集的信息。构造函数是线程安全的，允许你从应用程序的多个点实例化\
    \ GPIO 类。\n\n然而，有一个特别说明：如果启动程序由于任何原因失败，系统错误代码 (errno) 将保存在类成员 `errcode` 中。构造函数不会返回任何状态信息，因此需要你来检查错误。以下是一个代码示例：\n\
    \n```cpp\n#include <librpi2/gpio.hpp>\n\nint\nmain(int argc, char **argv) {\n\
