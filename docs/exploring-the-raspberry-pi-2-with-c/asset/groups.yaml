    GPIO::Source src;\nunsigned divi, divf, mash;\nbool enabled;\n\nrc = gpio.config_clock(\n\
    \    4, // 输入：通用时钟 GPIO\n    src, // 输出：返回源\ndivi, // 输出：返回 divi\ndivf, // 输出：返回\
    \ divf\n)\n```\n\n"
