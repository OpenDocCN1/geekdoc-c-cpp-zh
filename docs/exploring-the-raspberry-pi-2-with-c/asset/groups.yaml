    Figure 7-4 shows what you should see.


    | Signals | Waves | | |

    |---|---|---|---|

    | Time gpio12 | 1 ms | 2 ms |


    ## Figure 7-4. Inverted 80% PWM signal


    The inverted signal is low for eight ticks and high for two. This clearly illustrates
