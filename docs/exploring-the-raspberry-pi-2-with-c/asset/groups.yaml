    # 第6章 通用时钟


    当 mash 值为零时，DIVI 分频器将产生精确的输出频率。然而，当你将 mash 值范围在 1 到 3 之间配置时钟时，你可以获得一些平均频率，如表 6-1
    所示。


    表 6-1. 平均输出频率


    | MASH | 最小 DIVI | 最小频率 | 平均频率 | 最大频率 |

    |---|---|---|---|---|

    | 0 | 1 | Source/DIVI | Source/DIVI | Source/DIVI |

    | 1 | 2 | Source/(DIVI + 1) | Source/(DIVI + DIVF/1,024) | Source/DIVI |

    | 2 | 3 | Source/(DIVI + 2) | | Source/(DIVI - 1) |

    | 3 | 4 | Source/(DIVI + 4) | | Source/(DIVI - 3) |


    如果我们选择最低频率的时源（19.2 MHz），那么表 6-2 显示了当 DIVI = 42 时，mash 值之间的关系。


    表 6-2. DIVI = 42时的 Mash 值


    | MASH | DIVI | 最小频率 | 平均频率 | 最大频率 |

    |---|---|---|---|---|

    | 0 | 42 | 457.143 kHz | 457.143 kHz | 457.143 kHz |

    | 1 | | 446.512 kHz | 417.482 to 457.143 kHz (DIVF = 4,095 to 0) | 457.143 kHz
    |

    | 2 | | 436.364 kHz | | 468.293 kHz |

    | 3 | | 417.391 kHz | | 492.308 kHz |


    # 确定 DIVI 和 DIVF


    已知必须为目标频率选择 DIVI 和 DIVF 的值，那么计算它们的步骤是什么？为了说明这一点，让我们以生成一个 455 kHz 测试信号并注入到  电台中频（IF）阶段的任务为例。[1]
    我们如何选择 DIVI 和 DIVF 以获得最佳匹配？


    步骤如下：


    - 1. 用源频率除以所需频率来计算 DIVI。

    - 2. 如果步骤 1 中的数字是精确整数，则使用 MASH = 0（不适用 DIVF）并停止。

    - 3. 否则，继续将 DIVI 向下取整到最近整数；即将 DIVI 设置为 floor(DIVI)。

    - 4. 根据源、频率和 DIVF（见下方）计算 DIVF。


    我们的源将使用 19.200 MHz 的时钟频率。通过将源频率（19.2 MHz）除以目标频率计算计算 DIVI：


    ```

    DIVI = 19,200,000 / 455,000

    = 42.198 (步骤 1)

    = 42 (步骤 2)

    ```


    由于步骤 1 中的 DIVI 值是小数，我们必须使用掩 和 DIVF 值来近似目标频率。根据之前的图表，我们知道平均频率由公式给出：


    Frequency = Source/(DIVI + DIVF/1,024)


    使用代数求解 DIVF，我们得到公式：


    DIVF = 1024 × (Source/Frequency - DIVI)


    现在我们可以计算 DIVF：


    ```

    DIVF = 1,024 × (Source/Frequency - DIVI)

    1024 × (19,200,000/455,000 - 42)

    = 202.5

    = 202 (整数)

    ```


    将此 DIVF 代入平均频率公式中，我们可以检查计算结果：


    ```

    Frequency = Source / (DIVI + DIVF/1,024)

    = 19,200,000 / (42 + 2/1,024)

    = 455.006 kHz

    ```


    由于 455 kHz 的目标频率在 Mash 1 的频率范围（446.512 kHz-457.143 kHz）内，这将是最佳的近似值。当 mash 为零（无
    mash）时，你将获得精确频率。否则，较低的掩码值提供了最佳近似。


    # 拍频振荡器


    如果你有一台便携式短波收音机，可能知道它无法接收连续波（CW，也称为摩斯密码）或旁带传输。你可能可以在刻盘上感应它，但接收效果不好（旁带传输听起来像鸭子叫）。这是因为消费级收音机缺乏所需的拍频振荡器（BFO）或旁带解调频率。


    所有现代收音机都会将接收频率混频到中频，以便信号进行更具选择性的放大。一个常用的频率是 455 kHz（如我们之前的实验）。根据收音机的设计，你可能会使用不同的中频，如
    10.7 MHz。其他其他使用的频率，但这些是最常见的。


    CW 传输是最简单的通信形式。它只需要发射器提供一个频率的正弦波。这使得它非常节省频谱。信息通过点和划（以及更长的传输）开启和关闭发射器来编码。


    在接收端，可以使用幅度调制（AM）收音机来解决一个问题。接收 CW 信号就像接收 AM 载波。当接收 CW 且发射器关闭（点和划之间）时，接收机会检测到信号缺失并增大增益。接收机会试图补偿可能会减弱或增强的无线接收。这就是为什么在点和划之间听到更多的噪声。但为什么没有音调呢？


    要在 AM 收音机中实际听到音调，你需要另一个信号与它混频。这就是 BFO 起作用的地方。当两个信号在非线性电路中混合时，会产生额外的信号。如果最低频率是
    F1，最高频率是 F2，那么将从原始两个输入产生额外的副产品。最强的四个信号如下：


    - F2 - F1 频率

    - F1 频率

    - F2 频率

    - F1 + F2 频率


    还有其他强度递减的产品，但最有趣的副产品是 L-R 信号。假设掩码值提供了最佳近似。当 mash 为零（无 mash）时，你将获得精确频率。否则，较低的掩码值提供了最佳近似。


    '
