    \ }, { 23, \"reserved\" }, { 24, \"reserved\" },\n{ 25, \"reserved\" }, { 26,\
    \ \"reserved\" }, { 27, \"reserved\" },\n{ 28, \"SDA0\" }, { 29, \"SCL0\" }, {\
    \ 30, \"reserved\" },\n{ 31, \"reserved\" }; };\n```\n\n每一对值都初始化了 map 每个条目的键和值。这难道不方便吗？\n\
    \n# 遍历 Map\n\n遍历 Map 和遍历 vector 一样简单。使用之前的 `gpio_alto` map，我们可以通过以下方式进行遍历：\n\n\
    ```cpp\nfor ( auto it = gpio_alto.begin(); it != gpio_alto.end(); ++it )\n   \
    \ printf(\"%d = '%s\\n\",it->first,it->second.c_str());\n```\n\n这里唯一的新点在于你必须使用\
    \ `it->first` 或 `it->second` 来访问感兴趣对中的键或值。\n\n# 引用\n\n让我们花点时间讨论 C++ 引用（references），因为它们经常与\
    \ STL 容器结合使用。让我们用结构体来说说明：\n\n```cpp\nstruct s_client {\n    int id;\n    double\
    \ balance;\n    ...\n};\ns_client best_client;\n```\n\n这段代码声明了一个名为 `best_client`\
    \ 的结构体 `s_client` 实例。现在我们为同一份数据声明一个指针和一个引用：\n\n```cpp\ns_client *ptr_client =\
    \ &best_client;\ns_client& ref_client = best_client;\n```\n\n# 第 11 章 C++ 快速入门\n\
    \n使用这两个变量，让我们修改 `best_client` 的余额：\n```cpp\nptr_client->balance = 100.00; // best_client.balance\
    \ == 100.00\nref_client.balance = 500.00; // best_client.balance == 500.00\n```\n\
    \n指针 (`ptr_client`) 和引用 (`ref_client`) 物理上访问同一个名为 `best_client` 的存储单元。一个使用指针语法\
    \ (`->`)，另一个使用点 (`.`)。引用变量具有一个特性：一旦建立就无法被“重新指向”。然而，指针变量可以随心所欲改变。引用提供的安全性非常有帮助。\n\
    \n现在让我们声明一个客户端 map，使用 `int` 作为客户端 ID 值的键：\n\n```cpp\nstd::unordered_map<int, s_client>\
    \ clients_map;\n```\n\n我们可以通过以下循环调整所有客户端的余额：\n\n```cpp\nfor ( auto it = clients_map.begin();\
    \ it != clients_map.end(); ++it ) {\n    it->second.balance -= some_adj;\n}\n\
    ```\n\n这段代码可以编译并运行，但迭代器使得代码不够清晰。问题是 `it->second` 并没有标示你正在访问的数据类型。你必须查看 `clients_map`\
    \ 的定义才知道 `it->second` 指的是 `s_client`。\n\n为了提高可读性，你可能会使用指针，但这仍然不是最优的：\n\n```cpp\n\
    for ( auto it = clients_map.begin(); it != clients_map.end(); ++it ) {\n    s_client\
    \ *client = &it->second;\n    client->balance -= some_adj;\n}\n```\n\n现在你立即知道\
    \ `it->second` 指向 `s_client` 结构体。但指针语法 `client->balance` 等很笨拙。在大段代码中，存在指针被意外改变的危险。从效率的角度来看，我们仍然很好，因为这些类型会被编译器优化。\n\
    \n不过，我们可以通过使用 C++ 引用来改进：\n\n```cpp\nfor ( auto it = clients_map.begin(); it !=\
    \ clients_map.end(); ++it ) {\n    s_client& client = it->second;\n    client.balance\
    \ -= some_adj;\n}\n```\n\n现在我们可以访问 `client` 的成员，就像它直接声明在循环内部一样。当然，在底层编译器使用了指针（这本质上就是引用的原理），但我们避免了使用指针语法。我们还获得了安全性，即\
    \ client 不指向其他任何地方（编译器不允许你改变它）。这些安全性在大段代码中是至关重要的。\n\n这是使用引用容器的另一个应用。假设你想向 map\
    \ 中添加一个新的 `s_client` 成员，且该结构很大。你可以按照下面的方式执行此操作，它是高效的：\n\n```cpp\ns_client new_client;\
    \ // 临时结构体\n\nnew_client.id = 1234;\nnew_client.balance = ...;\n\nclients_map[new_client.id]\
    \ = new_client; // 将 new_client 拷贝到 map\n```\n\n这在栈上创建一个名为 `new_client` 的临时结构体。`new_client`\
    \ 的成员通过赋值语句填充。最后一步使用键 `new_client.id` 来访问已有的 map 条目或创建一个新的。然后数据结构 `new_client`\
    \ 被拷贝到 map 中。\n\n然而，如果你想避免拷贝，可以使用引用：\n\n```cpp\ns_client& client = clients_map[new_client.id];\n\
    client.id = new_client.id;\nclient.balance = new_client.balance;\n```\n\n# Map\
    \ 与 Set\n\nSet（集合）与 map ，区别在于它们不存储键值对。它们只存储唯一元素。在 set 中，元素本身就是键。\n\n```cpp\nstd::set<int>\
    \ my_set;\nmy_set.insert(10);\nmy_set.insert(20);\nmy_set.insert(10); // 这不会被添加\n\
    ```\n"
