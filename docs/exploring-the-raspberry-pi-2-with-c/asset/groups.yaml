  - "[PAGE 119]\n\n# Momentary Debouncing\n\nIn the book *Mastering the Raspberry\
    \ Pi (Apress, 2014)* a CD4013 flip-flop circuit was used to debounce a button\
    \ or switch. For buttons, however, the flip-flop circuit is inconvenient because\
    \ it requires both normally open and normally closed contacts. This mandates more\
    \ expense and additional wiring. \n\nA simpler and more economical solution is\
    \ shown in Figure 10-3, using a Schmitt trigger (CD40106 in this case). The button\
    \ is represented by S1, connected to resistor R1 and capacitor C1. These together\
    \ with the Schmitt trigger action of IC1A, result in a clean debounced output\
    \ signal appearing at OUT. Because it is an inverter, the output is produced while\
    \ the button is pressed. An advantage of the hex inverter part is that the CD40106\
    \ means that you get six of these for the price of one.\n\n![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_119_0.png)\n\
    \n**Figure 10-3.** A momentary button debounce circuit\n\n# Toggled Debouncing\n\
    \nSwitches can be expensive to buy and install in quantity. Buttons, on the other\
    \ hand, can sometimes be inexpensive by comparison. If you were able to use a\
    \ button to toggle a signal, you could use a button as a switch. Figure 10-4 illustrates\
    \ a simple way to do this reliably using the CMOS part CD4049."
  - '[PAGE 120]


    # CHAPTER 10 DEBOUNCING


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_120_0.png)


    The CD4049 is a simple CMOS inverter, but when combined with R2 and C1, and feedback
    resistor R1, the push button (S1) can be used to toggle its. The output can be
    taken from either IC1A (pin 2) or IC1B (pin 4). Alternatively, you could add one
    more inverter to be used as a buffer stage.


    When using the circuit shown in Figure 10-4, the application normally requires
    some sort of feedback to the user. If the Raspberry Pi application shows some
    visual on a screen, other LED, or sound in response to a button press, nothing
    further is needed. However, if none of these cues are present, the user will be
    wondering if or she toggled the input or off.


    Figure 10-5 shows one possible solution to the problem, at the expense of more
    components. In this circuit the toggle function is still provided by IC1A and
    IC1B. The LED indicator is driven by another inverter IC2A, and the signal is
    driven by IC2B. These extra inverters may be drawn from IC1 if you prefer (the
    schematic was extracted from a larger design that I used).


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_120_1.png)


    Figure 10-5. Toggle button with buffer and LED indicator


    108'
  - '[PAGE 121]


    The one that deserves special mention in this circuit is the fact that the LED
    is driven without a limiting resistor. Normally the resistor is required and it
    is still good practice to use it. Here, it is possible to get away without it
    (if you like) because the circuit (for the Raspberry Pi) will be operating from
    3.3V. Additionally, the CMOS output transient will be limited by the current that
    it can deliver at lower voltage level. IC2A will not be able to deliver more than
    4 mA of current to the LED. So be certain to choose a small, low-current LED for
    the purpose.


    # The MC14490


    The contact bounce problem was serious enough to have a chip designed for the
    purpose. ON Semiconductor states their chip quality at 456 FETs (or 136.5 equivalent
    gates). The MC14490 (also known as CD4490) is a CMOS part and such, can operate
    from 3.0V to as high as 18.0V. Again, 3.3V operation is ideal for these chips
    probably counts to their higher price compared to other logic gates in the series
    (I purchased for ebay about a dollar each).


    The MC14490 works in a sampling principle. It clocks in samples of the input at
    intervals, arriving at on or off changes its output. If the internal shift register
    shows the samples all as zeros (contacts touched), the output goes low (0). Conversely,
    if the shift register shows the samples all as high (contacts open) the output
    changes to high (1). Changes due to jitters in the input signal are ignored at
    the output.


    Figure 10-6 shows a circuit with two push buttons (buttons for BIN EIN are not
    out but could be wired). AO is debounced for AIN, and so on. The MC14490 has built-internal
    pullup resistors for inputs, none are required externally (use care for static
    electricity in your handling).


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_121_0.png)


    Figure 10-6. The MC14490 Hex contact bounce eliminator


    The sampling frequency is determined by capacitor C1. The datasheet provides formulas
    for C1, for a given sampling frequency. For a sampling frequency 15 Hz, the formula
    provided by ON Semiconductor is $15 = 6.5/C$, where $C$ is in $\mu$F. Solving
    for $C_t$, we get the formula $C_t = 6.5/15$, which calculates as 0.43. The next
    standard size of capacitor would be this 0.47 $\mu$F. So a 0.47 $\mu$F capacitor
    should result in a sampling frequency of 13.8 Hz. Some experimentation might be
    required. Keep in mind that many capacitors have tolerances as wide as 30%.'
  - '[PAGE 122]


    In my own experiment, I didn''t have that so I tried a 0.02 µF capacitor instead.
    It produced a higher sampling frequency, which would make it more sensitive to
    button glitches, but it proved the overall operation okay with no problems.


    Using PiSpy, I was able to sample the oscillator on pin 9. You need a long sampling
    period due to the low frequency of the oscillator. I chose to use 48 blocks (-b48)
    for this capture. The gtwave output in Figure 10-7, you can see that the wave
    form was about 32 ms. Taking the reciprocal of that gives us a frequency of about
    31.25 Hz (using a 0.02 µF capacitor).


    $ pyspy -b48 -R19 -T9999

    Captured: writing capture.vcd


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_122_0.png)


    Figure 10-7. PiSpy capture of the OSC_out (pin 9) of the MC14490


    To test its button action, wire the button S1 to Figure 10-6. Attach the debounced
    AO to your GPIO 19. GPIO 19 boots up as an input, but otherwise make sure that
    it is in input mode with -g3 -i before making the connection (-pu adds a pull
    resistor, which should also be the default).


    The following command reinserts the input (-i) for GPIO 19 (-g19), adds a pullup
    resistor (-pu), and monitors that GPIO forever (-m0). Once the gp command is monitoring,
    you should be able to get clean button press events. My session looked like this:


    ```

    $ gp -g19 -pu -m0

    Monitoring..

    00000 GPIO 19 = 1

    00001 GPIO 19 = 0

    00002 GPIO 19 = 1

    00003 GPIO 19 = 0

    00004 GPIO 19 = 1

    00005 GPIO 19 = 0

    00006 GPIO 19 = 1

    00007 GPIO 19 = 0

    00008 GPIO 19 = 1

    ```


    The button I used was a real scratch in electrical terms but it performed magnificently.

    Figure 10-8 illustrates my breadboard test on the end of the Raspberry Pi 2 workstation.
    This circuit is easy to breadboard that you should make a point of trying it yourself.
    It simply needs 3.3V power (from the Pi), ground, a capacitor, and a button. The
    output simply goes to a GPIO input.'
  - '[PAGE 123]


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_123_0.png)


    **Figure 10-8.** Breadboard setup for MC14490 button test


    When ordering this part, buy more than one (I suggest five). It doesn''t happen
    often, but sometimes you get a dud (or it becomes one). There''s nothing more
    disappointing than being ready to go and discovering that your part is dead. Because
    you''re attaching to the input of the Pi, be sure to power the MC14490 from the
    3.3V supply (not the 5V supply).


    If you experience trouble getting this to work (like I did the first time), perform
    the following checks:


    +   1. Check ground. Is the pin 8 attached to the Pi''s GND?

    2. Check pin 16. Is it connected to the Pi +3.3V supply?

    3. Check the capacitor. Are the connections pin 7 and 9?

    4. Disconnect the push button and the GPIO output.

    5. Connect OSC$_{out}$ (pin 9) to a GPIO input pin (19).

    6. Use PiSpy to monitor it a wave form (use a long sampling period of 24 blocks,
    but don''t overdo it).


    Powering the unit again, using PiSpy you should be able to capture a wave form.
    If the frequency is extremely low, you might only capture the signal going high,
    or returning low. Either way, this is a good sign that the oscillator is operating
    (perhaps too slowly). Double-check it with another capture if you didn''t get
    a full period.


    Once the oscillator is known to be operational, you should be able to hook up
    a button and see the output change with button presses. You can hook up a GPIO
    pin or use a multimeter on the output pin. Don''t try to drive an LED from the
    outputs, though; they might only support 1 or 2 mA.'
- md: "\n## CHAPTER 10 DEBOUNCING\n\n### Summary\n\nCMOS inputs, including Raspberry\
    \ Pi GPIO inputs, require contact debouncing when connected to buttons, switches,\
    \ or relay contacts. Manufactured buttons work pretty good these days, but they\
    \ can still provide shaky contact and release signals. You can eliminate Murphy's\
    \ Law up front (“If anything can go wrong, it will”). Without debounced inputs,\
    \ the interface might work fine until you decide to demonstrate it.\n\nThis chapter\
    \ has highlighted three different circuits for debouncing. I encourage you to\
    \ try them all on a breadboard. This list is by no means exhaustive, but these\
    \ should be easy to replicate.\n\nThe first was a simple way to produce a debounced\
    \ momentary push button input using Schmitt triggers. It required only a resistor\
    \ and capacitor for analog components. The second circuit is interesting because\
    \ it allows you to use a button as a switch by toggling the output with each button\
    \ press. It does have the disadvantage of needing user feedback and requires more\
    \ components. The final circuit, using the MC14490, is perhaps the easiest to\
    \ use of all. It requires only one analog component (capacitor) and provides six\
    \ debounced outputs. Additionally, other MC14490 chips can be wired to use the\
    \ first one's clock output, requiring only one capacitor for the entire group.\n\
    \n112\n\n## CHAPTER 11\n\n### C++ Quick Start\n\nIf you already know the C programming\
    \ language and know a little about C++, you can jump your C++ productivity by\
    \ reading this chapter. This is not a C++ tutorial but rather a quick start guide\
    \ designed to take the fear out of using the Standard Template Library (STL).\
    \ Those with low patience for history and the theory will like the approach of\
    \ jumping in and getting started. When you see the STL used in simple digestible\
    \ examples, the fear and loathing will evaporate.\n\n### C++ Standards\n\nIn the\
    \ 1990s, I would avoid developing open source projects in C++ because old projects\
    \ would fail to compile a year later, with all new warnings and errors that the\
    \ compiler didn't produce before. You, however, depend on the C language compiler\
    \ because it was stable and the rules didn't keep changing. The C language was\
    \ standardized.\n\nToday, with the advent of the C++ 11 standard and GNU support\
    \ for it, I am in a great position to benefit from the productivity inherent in\
    \ it. Debian Linux supports C++ 11 in the newer GCC-4.7 compiler (but you might\
    \ need to install it).\n\nTo check the version of your installed compiler, use\
    \ this command:\n\n```bash\n$ g++ --version\ng++ (Debian 4.6.3-14+rpi1) 4.6.3\n\
    Copyright (C) 2011 Free Software Foundation, Inc.\nThis is free software; see\
    \ the source for copying conditions. There is NO warranty; not even for MERCHANTABILITY\
    \ or FITNESS FOR A PARTICULAR PURPOSE.\n```\n\nYou will need at least 4.7 to get\
    \ the C++ 11 support (prior to this, limited support of c++0x was available, but\
    \ this isn't good enough). If necessary, install version 4.7 (or newer) using\
    \ this command:\n\n```bash\n# sudo apt-get install g++-4.7\n```\n\nThe book's\
    \ provided Makefile.incl has the following two lines in it (see CXX and CXXSTD\
    \ definitions):\n\n```makefile\nhead Makefile.incl\n###############################################################\n\
    # librpiz/Makefile.incl\n###############################################################\n\
    TOPDIR := $(dir $(CURDIR))$(word $(words $(MAKEFILE_LIST)),$(MAKEFILE_LIST))\n\
    CXX = $(shell ls /usr/bin/g++*- |tail -1)\nCXXSTD =? c++11\nPREFIX =? /usr/local\n\
    ```\n\nThe line starting with CXX = normally discovers the most current version\
    \ of g++ installed on your Raspian Linux system. If this is failing, replace that\
    \ with a hard-coded reference reference to the compiler you want to use. For example,\
    \ to force the use of g++4.7, you can use CXX = /usr/bin/g++-4.7.\nCompilers older\
    \ than g++4.7 do not support the option -std=c++11, which we need for this book.\n\
    \n### From C to C++\n\nA few things change when you go from the C language to\
    \ C++. One of the subtle changes is that the C language struct is in the same\
    \ namespace as all other types. Consider the following C language example t.c:\n\
    \n```c\n#include <stdio.h>\n\nint main(int argc, char **argv) {\n    struct my_struct\
    \ {\n        int id;\n    };\n    typedef struct my_struct my_struct;\n    struct\
    \ my_struct a;\n    struct my_struct b;\n\n    a.id = 0;\n    b.id = 1;\n\n  \
    \  return 0;\n}\n```\n\nThis C program will compile and execute fine. Note that\
    \ my_struct is distinct from the type name my_struct (even though ultimately they\
    \ use the same definition).\nWhen we enter the C++ realm, this code fails to compile.\
    \ If I rename the program file t.c to t.cpp and a C++ compiler on it, it gets\
    \ the following errors:\n\n```text\nt.cpp:9:12: error: using typedef-name 'my_struct'\
    \ after 'struct'\nt.cpp:8:30: error: 'my_struct' has a previous declaration here\n\
    ```\n\nThis is telling us that the type my_struct is already defined by the time\
    \ it sees the typedef line. This confirms that the struct name and the typedef\
    \ name are the same. In C++, the struct name itself becomes a type name.\n\n###\
    \ Classes and Structs\n\nThe only difference between a struct and a class in C++\
    \ is the default access level of members. In a struct, members are public by default;\
    \ in a class, they are private.\n\n```cpp\nstruct MyStruct {\n    int id;\n};\n\
    \nclass MyClass {\n    int id;\n};\n```\n\n### The Standard Template Library\n\
    \nThe Standard Template Library (STL) provides a collection of template classes\
    \ and functions. Using the STL allows you to write efficient and reusable code.\
    \ Common components include:\n\n- Containers: Data structures like `std::vector`,\
    \ `std::list`, and `std::map`.\n- Algorithms: Functions like `std::sort`, `std::find`,\
    \ and `std::count`.\n- Iterators: Objects that allow traversing elements in containers.\n"
  mdcn: "\n\n## 第 10 章 去抖处理\n\n### 总结\n\nCMOS 输入（包括树莓派的 GPIO 输入）在连接按钮、开关或继电器触点时需要进行机械去抖。如今制造的按钮工作得相当不错，但它们仍可能产生抖动的接触信号和释放信号。你可以预先消除墨菲定律（“如果任何事情可能出错，它就会出错”）。如果没有去抖后的输入，接口可能在你决定演示它之前可能一直运行得良好。\n\
    \n本章重点介绍了三种不同的去抖电路。我鼓励你在面包板上尝试所有的电路。虽然这个列表并不是详尽的，但这些电路应该很容易复制。\n\n第一种使用施密特触发器产生去抖后的瞬时按下按钮输入的简单方法。它的模拟元件只需要电阻和一个电容。第二种电路很有趣，因为它允许你通过每次按下按钮切换输出将按钮作为开关使用。它的缺点是需要用户反馈，并且需要更多的组件。最后一种使用\
    \ MC14490 的电路可能是所有电路中最易用的。它只需要一个模拟元件（电容），并提供六个去抖后的输出。此外，其他 MC14490 芯片可以连接以使用第一个芯片的时钟输出，整个组只需要一个电容。\n\
    \n112\n\n## 第 11 章\n\n### C++ 快速入门\n\n如果你已经熟悉 C 语言并对 C++ 有所了解，你可以通过阅读本章来提高你的 C++\
    \ 效率。这并不是一个 C++ 教程，而是一个快速入门指南，旨在消除使用标准模板库（STL）的恐惧。对历史和理论缺乏耐心的人会喜欢这种直接投入并开始的方法。当你看到在简单易懂的示例中使用\
    \ STL 时，那种恐惧和厌恶就会烟消云散。\n\n### C++ 标准\n\n在 20 世纪 90 代，我会避免使用 C++ 开发开源项目，因为旧项目在一年后无法编译，会出现编译器以前没有产生的所有新警告和错误。然而，你依赖\
    \ C 语言编译器，因为它是稳定的，规则不会不断改变。C 语言已经标准了。\n\n今天，随着 C++ 11 标准的出现以及 GNU 对其的支持，我可以从其固有的效率中获益。Debian\
    \ Linux 在较新的 GCC-4.7 编译器中支持 C++ 11（但你可能需要安装它）。\n\n要检查已安装编译器的版本，请使用此命令：\n\n```bash\n\
    $ g++ --version\ng++ (Debian 4.6.3-14+rpi1) 4.6.3\nCopyright (C) 2011 Free Software\
    \ Foundation, Inc.\nThis is free software; see the source for copying conditions.\
    \ There is NO warranty; not even for MERCHANTABILITY or FITNESS FOR A PARTICULAR\
    \ PURPOSE.\n```\n\n你需要至少 4.7 版本才能获得 C++ 11 支持（在此之前可以使用对 c++0x 的有限支持，但这不够）。如果有必要，请使用此命令安装\
    \ 4.7 版本（或更高版本）：\n\n```bash\n# sudo apt-get install g++-4.7\n```\n\n书中提供的 `Makefile.incl`\
    \ 包含以下两行（参见 CXX 和 CXXSTD 定义）：\n\n```makefile\nhead Makefile.incl\n###############################################################\n\
    # librpiz/Makefile.incl\n###############################################################\n\
    TOPDIR := $(dir $(CURDIR))$(word $(words $(MAKEFILE_LIST)),$(MAKEFILE_LIST))\n\
    CXX = $(shell ls /usr/bin/g++*- |tail -1)\nCXXSTD =? c++11\nPREFIX =? /usr/local\n\
    ```\n\n以 CXX = 开头的行通常会发现你的 Raspian Linux 系统上安装的最新 g++ 版本。如果执行失败，请将其替换为硬编码的要使用的编译器的引用。例如，为了强制使用\
    \ g++4.7，你可以使用 CXX = /usr/bin/g++-4.7。早于 g++4.7 的不支持 -std=c++11，我们需要。\n\n### 从\
    \ C 到 C++\n\n当你从 C 语言转向 C++ 时，一些情况会发生变化。微妙变化之一是 C 语言的结构与其他类型处于同一命名空间。考虑以下 C 语言示例\
    \ t.c：\n\n```c\n#include <stdio.h>\n\nint main(int argc, char **argv) {\n    struct\
    \ my_struct {\n        int id;\n    };\n    typedef struct my_struct my_struct;\n\
    \    struct my_struct a;\n    struct my_struct b;\n\n    a.id = 0;\n    b.id =\
    \ 1;\n\n    return 0;\n}\n```\n\n这个 C 程序可以正常编译和运行。注意 my_struct 与类型名 my_struct\
    \ 是不同的（尽管它们最终使用相同的定义）。\n当我们进入 C++ 领域，这段代码无法编译。如果我将文件 t.c 重命名为 t.cpp 并对其使用 C++\
    \ 编译器，会得到以下错误：\n\n```text\nt.cpp:9:12: error: using typedef-name 'my_struct' after\
    \ 'struct'\nt.cpp:8:30: error: 'my_struct' has a previous declaration here\n```\n\
    \n这告诉我们在看到 typedef 行时，类型 my_struct 已经定义了。这证明了结构名和 typedef 名是相同的。在 C++ 中，结构名本身就了一个类型名。\n\
    \n### 类和结构体\n\nC++ 中 struct 和类之间的唯一区别是成员的默认访问级别。在 struct 中，成员默认是公共的；在类中，它们是私有的。\n\
    \n```cpp\nstruct MyStruct {\n    int id;\n};\n\nclass MyClass {\n    int id;\n\
    };\n```\n\n### 标准模板库\n\n标准模板库（STL）提供了一系列模板类和函数。使用 STL 允许你编写高效且可复用的代码。常见组件包括：\n\
    \n- 容器：数据结构如 `std::vector`、`std::list` 和 `std::map`。\n- 算法：函数如 `std::sort`、`std::find`\
    \ 和 `std::count`。\n- 迭代器：允许遍历容器元素的对象。\n\n"
