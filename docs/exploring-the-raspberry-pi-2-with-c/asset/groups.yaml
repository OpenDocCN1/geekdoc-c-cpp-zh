    # CHAPTER 11


    # C++ Quick Start


    If you already know the C programming language and know a little about C++, you
    can jump your C++ productivity by reading this chapter. This is not a C++ tutorial
    but rather a quick start guide designed to take the fear out of using the Standard
    Template Library (STL). Those with low patience for history and the theory will
    like the approach of jumping in and getting started. When you see the STL used
    in simple digestible examples, the fear and loathing will evaporate.


    # C++ Standards


    In the 1990s, I would avoid developing open source projects in C++ because old
    projects would fail to compile a year later, with all new warnings and errors
    that the compiler didn''t produce before. You, however, depend on the C language
    compiler because it was stable and the rules didn''t keep changing. The C language
    was standardized.


    Today, with the advent of the C++ 11 standard and GNU support for it, I am in
    a great position to benefit from the productivity inherent in it. Debian Linux
    supports C++ 11 in the newer GCC-4.7 compiler (but you might need need to install
    it).


    To check the version of your installed compiler, use this command:


    ```

    $ g++ --version

    g++ (Debian 4.6.3-14+rpi1) 4.6.3

    Copyright (C) 2011 Free Software Foundation, Inc.

    This is free software; see the source for copying conditions. There is NO\arrant;
    not even for MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE.

    ```


    You will need at least 4.7 to get the C++ 11 support (prior to this, limited support
    of c++0x was available, but this isn''t good enough). If necessary, install version
    4.7 (or newer) using this command:


    ```

    # sudo apt-get install g++-4.7

    ```


    The book''s provided Makefile.incl has the following two lines in it (see CXX
