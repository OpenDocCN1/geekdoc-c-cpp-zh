    assert(!rc); // 确保此操作成功\n// 禁用迟滞\nrc = gpio.set_drive_strength(19,slew_limited,false,drive);\n\
    assert(!rc);\n```\n\n# 附录 B GPIO 类 2\n\n库类 GPIO 提供了一个非常简单的 API，用于在 C++ 中树莓派硬件。使用此类，你可以立即定义应用程序，而无需重写代码。此附录对于想要以下操作的用户：\n\
    \n- 启动和停止通用时钟（General Purpose Clock）\n- 配置 PWM 时钟\n- 配置并启动 PWM 外设\n\n有关包含链接的指令，请参附录\
    \ A。\n\n## 类定义（部分 2）\n\n在 GPIO 类的第二部分中，我将讨论适用于启动通用时钟和 PWM 外设的方法。在接下来，为了方便参考，我保留了基础的构造函数、析构函数和\
    \ `get_error()` 方法。所有其他方法已删除以提高可读性。\n\n```cpp\nclass GPIO {\n    bool err; //\
    \ 如果 GPIO 失败则为 errno\n\npublic:\n    GPIO();\n    ~GPIO();\n\n    inline int get_error();\
    \ // 检查错误\n\n    int config_clock(\n        int gpio,\n        Source& src,\n\
    \        unsigned& divi,\n        unsigned& divf,\n        unsigned& mash,\n \
    \       bool& enabled\n    );\n};\n```\n\n# 附录 B GPIO 类 2\n\n```cpp\n// 时钟控制：GPIO\
    \ 4, 12, 18, 13 或 19\nint start_clock(\n  int gpio,\n  Source src,\n  unsigned\
    \ divi,\n  unsigned divf,\n  unsigned mash=0,\n  bool enabled=true\n);\n```\n\n\
    ```cpp\n// PWM：GPIO 12 或 18, PWM1: GPIO 13 或 19\nint pwm_configure(\n  int gpio,\n\
    \  PwmMode mode,\n  bool repeat,\n  int state,\n  bool invert,\n  bool fifo,\n\
    \  PwmAlgo algorithm\n);\n```\n\n```cpp\nint pwm_control(int gpio,PWM_status&status);\n\
    int pwm_status(int gpio,PWM_status&status);\nint pwm_ratio(int gpio,uint32_t m,uint32_t\
    \ s);\nint pwm_enable(int gpio,bool enable);\nint pwm_clear_status(int gpio,const\
    \ PWM_status&status);\nint pwm_write_fifo(uint32_t *data,size_t n_words);\nbool\
    \ pwm_fifo_full(int gpio);\nbool pwm_fifo_empty(int gpio);\n```\n\n```cpp\nint\
    \ get_pwm_ratio(int gpio,uint32_t m,uint32_t &s);\n```\n\n## GPIO::config_clock\n\
    \n此类方法返回所选通用时钟的信息。\n\n```cpp\nint config_clock(\n  int gpio,\n  Source& src,\n\
    \  unsigned& divi,\n  unsigned& divf,\n  unsigned& mash,\n  bool& enabled\n);\n\
    ```\n\n参数 `gpio` 是输入参数，用于选择外设，参见表 B-1。\n\n## 表 B-1 GPIO 与外设\n\n| GPIO | 外设 |\n\
    | :--- | :--- |\n| 4 | 通用时钟 0 |\n| 12 | PWM 0 时钟 |\n| 18 | PWM 0 时钟 |\n| 13 |\
    \ PWM 1 时钟 |\n| 19 | PWM 1 时钟 |\n\n`source` 参数通过引用返回当前选钟的时钟源。表 B-2 说明了使用的 GPIO常量。\n\
    \n## 表 B-2 GPIO常量与时钟源\n\n| GPIO::Source | 时钟源 |\n| :--- | :--- |\n| GPIO::Gnd\
    \ | 地（禁用） |\n| GPIO::Oscillator | 振荡器 (19.2 MHz) |\n| GPIO::PLLA | PLLA (音频 -\
    \ 393.216 MHz) |\n| GPIO::PLLC | 1000 MHz (随超频变化) |\n| GPIO::PLLD | 500 MHz |\n\
    | GPIO::HDMI_Aux | HDMI Aux (216 MHz) |\n\n返回的 `div` 和 `interf` 参数决定了时钟源的分频，从而影响频率。第6章概述了如何从这些值计算频率。`mash`\
    \ 参数是一个 0 到 3 的返回值，指示时钟信号如何变化。第6章描述了此参数的影响。最后，返回的布尔参数 `enabled` 表示时钟是否已启用（启动）。函数在失败时返回非零系统错误代码，成功时返回零。假设类\
