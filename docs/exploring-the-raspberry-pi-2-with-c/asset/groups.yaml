    **Warren W. Gay** started out in electronics at an early age, dragging discarded
    TVs and radios home from public school. In high school he developed a fascination
    for programming the IBM 1130 computer, which resulted in a career plan change
    to software development. After attending Ryerson Polytechnical Institute, he enjoyed
    a software developer career for more than 30 years, programming mainly in C/C++.
    Warren has been programming Linux since 1994 as an open source contributor and
    professionally on various Unix platforms since.


    Before attending Ryerson, Warren built an Intel 8008 system from scratch there
    were CP/M systems and before computers got personal. In later years, Warren earned
    an advanced amateur radio license (call sign VE3WWG) and worked the amateur radio
    satellites. A high point of his amateur radio hobby was making digital contact
    with the Mir space station (U2MIR) in 1991.


    Warren works at Datablocks.net, an enterprise-class ad-serving software services
    company. Where he programs C++ server solutions on Linux back-end systems.


