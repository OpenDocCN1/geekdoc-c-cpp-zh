    | GPIO | Alternate Function |

    |---|---|

    | 0 | Input |

    | 1 | Input |

    | 2 | SDA1 (Alto) |

    | 3 | SCL1 (Alto) |

    | 4 | Output |

    | 5 | Input |

    | 6 | Input |

    | 7 | GPIO_CE1_N |

