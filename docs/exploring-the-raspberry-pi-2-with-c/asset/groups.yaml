    \ The string object my_str is constructed, my_str will hold the string. The string\
    \ object my_str is constructed, my_str will hold the string. The string object\
    \ my_str is constructed, my_str will hold the string. The string object my_str\
    \ is constructed, my_str will hold the string. The string object my_str is constructed,\
    \ my_str will hold the string. The string object my_str is constructed, my_str\
    \ will hold the. This works even for function arguments:\n\n```cpp\nvoid myfunc(std::string\
    \ arg_one);\n```\n\n## CHAPTER 11 C++ QUICK START\n\nWhat about getting C string\
    \ value from std::string object? Consider this printf:\n\n```cpp\nvoid myfunc(std::string\
    \ arg_one) {\n    printf(\"arg_one=%s\\n\",arg_one.c_str());\n}\n```\n\nBy use\
    \ of std::string method c_str(), we are able to get a valid C string pointer out\
    \ of std::string object. This was expensive in CPU and memory terms? No, because\
    \ the std::string object is organized to keep internal copy of the. If need further\
    \ proof of this, try this experiment (I called my file t.cpp):\n\n```cpp\n#include\
    \ <stdio.h>\n#include <string>\n```\n\n```cpp\nint main(int argc,char **argv)\
    \ {\n    const std::string hello = \"Hello World\";\n\n    printf(\"hello=%s\\\
    n\",hello.c_str());\n\n    return 0;\n}\n```\n\nAfter creating source file t.cpp,\
    \ compile and run it:\n\n```bash\n$ g++ -Wall t.cpp\n./a.out\nhello=Hello World\n\
    $\n```\n\nWhat does this prove?\n\n1. std::string hello was declared const, meaning\
