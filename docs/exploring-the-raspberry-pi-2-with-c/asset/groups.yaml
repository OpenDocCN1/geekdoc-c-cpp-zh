    ## CHAPTER 1 INTRODUCTION


    Chapter 3 presents "The Matrix" construction project. It uses an LED matrix to
    produce a display that can provide instant display of CPU utilization for each
    of its cores. It also displays graphs for memory and I/O utilization. If you don''t
    want to construct this project, Chapters 4 and 9 cover the PiSpy logic analyzer,
    which is simple to use requiring no additional hardware. The PiSpy logic analyzer
    is able to see all GPIO inputs and outputs and records events to a file.


    Chapter 2 presents a simple Raspberry Pi 2 construction project. Using a short
    plank of wood, you can mount your Raspberry Pi 2 and a breadboard on it. That
    being organized this way helps considerably.


    Chapter 3 presents "The Matrix" construction project. It uses an LED matrix to
    produce a display that can provide instant display of CPU utilization for each
    of its cores. It also displays graphs for memory and I/O utilization. If you don''t
    want to construct this project, Chapters 4 and 9 cover the PiSpy logic analyzer,
    which is simple to use requiring no additional hardware. The PiSpy logic analyzer
    is able to see all GPIO inputs and outputs and records events to a file.


    Chapter 5 is dedicated to GPIO commands. With the provided you, it is a simple
    matter to easy-to-follow documentation and examples for the various class methods
    supported.


    Chapter 6 introduces the pwm utility, which can display or alter the configuration
    of the general purpose clock (or PWM).


    Chapter 7 expands on the clock by examining the Pulse Width Modulation (PWM) peripheral.
    The pwm utility and its options are explored in combination with PiSpy. PiSpy
    illustrates the effect of different settings.


    Chapter 8 takes a look at what GPIO is and the Complementary MOS (CMOS) technology
    that it is made from. Electronics students will find the explanation helpful what
    CMOS is and avoiding pitfalls in interfacing. Additionally CMOS inputs are explained
    with a brief description of static protection schemes.


    Chapter 9 provides a detailed look at the PiSpy logic analyzer and describes the
    various features of its application.


    Chapter 10 looks at GPIO input, focusing particularly on the problem of debouncing
    input from switches and buttons.


    Chapter 11 is a software-focused chapter. It provides a track to use C++ and the
    STL in a very easy and pragmatic way. The STL provides the programmer great benefits
    in programming time and reliability. In this chapter we look at the most popular
    containers and example code fragments are provided throughout.


    Chapter 12 is multithreaded software to take advantage of all CPU cores in an
    efficient web server. The server is based on the libevent library behind the scenes,
    but C++ classes are used to provide a very simple interface. This allows you to
    build and customize your own web server with little mainline code. The provided
    webb project can be used and extended.


    Appendix A through C document the libpi2 C++ classes for programming GPIO. With
    the provided you, it is a simple matter to easy-to-follow documentation and examples
    for the various class methods supported.


    Appendix D and E describe some other C++ classes that might be useful for people
    working with Matrix or 7-segment displays. Appendix F describes classes that have
    to do with gathering system performance metrics as measured by the mqtt utility.


    Appendix G provides some additional information about some of the remaining advanced
    classes found in libpi2.


