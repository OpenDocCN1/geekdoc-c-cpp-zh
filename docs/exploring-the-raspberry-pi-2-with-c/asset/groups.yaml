    # CHAPTER 4 INSTALLING A KERNEL


    # Disk Space


    For this procedure, it is recommended that your Pi SD card is 8 GB or larger.
    If you are using a smaller capacity card, you might need to use a USB attached
    disk drive or a USB memory stick. The procedure outlined in this chapter assumes
    that you are operating out of the pi account on the root file system.


    # Downloading the Source


    A given branch of the kernel source release can be quite large in terms of a git
    download. If you don''t need a specific version of the kernel, the most way to
    download it is to use the following git command (with the depth set to one), which
    creates a subdirectory .linux in your home directory:


    ```

    $ cd

    ```


    ```

    $ pwd

    /home/pi

    ```


    ```

    $ df . # Check disk space available

    Filesystem 1K-blocks Used Use% Mounted on

    /dev/root 7319248 4138492 2836724 60 % /

    ```


    ```

    $ git clone --depth 1 git://github.com/raspberrypi/linux.git

    Cloning into ''linux''

    remote: Counting objects: 51221, done.

    remote: Compressing objects: 100% (48663/48663), done.

    remote: Total 51221 (delta 40884), reused 15514 (delta 19330), pack-used 0

    Receiving objects: 100% (40884/40884), 138.53 MiB | 1.22 MiB/s, done.

    Resolving deltas: 100% (40884/40884), done.

    Checking files: 100% (48467/48467), done.

    ```


    If you leave out the --depth 1 option, you will download the entire history. This
    will take several times and occupy more disk space. Omitting the --depth option,
    however, does give you the ability to get a specific version of the kernel (a
    bit tricky). See the section "Specific Kernel Releases" at the end of the chapter
    for more information.


    Let''s know the branch you downloaded:


    ```

    $ ~/linux

    ```


    ```

    $ git status

    # On branch rpi-3.18.y

    nothing to commit (working directory clean)

    $

    ```


    In this example, we see the branch is rpi-3.18.y. There are several kernel versions
    in a given branch, but what you will have represent the most current. If you omitted
    the --depth parameter, the section "Specific Kernel Releases" at the end of the
    chapter before you proceed further.'
