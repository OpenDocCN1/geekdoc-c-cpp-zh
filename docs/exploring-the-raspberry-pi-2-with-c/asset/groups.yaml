    # GPIO::source_name


    This static method converts a GPIO::Source constant into a string, so that it
    can be printed:


    ```

    static const char *source_name(GPIO::Source src);

    ```


    For example:


    ```

    GPIO::Source src = GPIO::Oscillator;

    const char *description = GPIO::source_name(src);

    printf("Source is %s\n",description); // "Oscillator"

    ```


    # GPIO::alt_name


    This is static method to return a descriptive string that can be printed. This
    method takes a GPIO::IO input and returns descriptive text for this:


    ```

    static const char *alt_name(IO io);

    ```


    The following illustrates the call:


    ```

    GPIO::IO io = GPIO::Output;

    const char *description = GPIO::alt_name(io);

    printf("io = %s\n",description); // "Output"

    ```


    # GPIO::gpio_alt_func


