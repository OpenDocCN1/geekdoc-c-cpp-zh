  - "[PAGE 130]\n\n# Container std::vector\n\nThe vector is the easiest container\
    \ to start with. Think of all the problems you normally have with ordinary arrays:\n\
    \n+   - How large should I make it?\n- What is the maximum size?\n- Do I need\
    \ to resize it?\n- Where do I keep track of its dynamic size (if it can be resized)?\n\
    - Did I remember to free the dynamic storage when I was done with it?\n\nAll of\
    \ these problems vanish when you use the std::vector container. The std::vector\
    \ is a class that wraps around an array and manages its memory space and size.\n\
    Use a vector to hold an int type, simply include the header file and declare it.\
    \ The type of the member is specified by the C++ template angle brackets.\n\n\
    ```\n#include <vector>\nstd::vector<int> myvec;\n```\n\nWhen first constructed,\
    \ the vector myvec is empty.\nTo add an int value to vector, use the method push_back:\n\
    \nmyvec.push_back(99);\n\nThis internally resizes the array that holds the values\
    \ to be large enough to hold one more value and adds the value to it. The actual\
    \ size of this internal array might be 8 initially, the object myvec knows that\
    \ its current size is now 1. If you keep adding values, the object could double\
    \ its capacity to 16 internally to allow for growth, when you add the ninth value.\
    \ This is a detail you don't need to be concerned about.\n\nTo access the value\
    \ of myvec, you can use the usual subscripting syntax:\n\n```\nint first_value\
    \ = myvec[0];\n```\n\nThe nice thing about std::vector is that you don't have\
    \ to worry about allocating memory or resizing the array if you add more values.\
    \ When the object myvec goes out of scope, the storage associated with myvec is\
    \ automatically freed, thanks to the built-in destructor. No more memory leaks!\n\
    Once have a vector, you often need to iterate it; that is, visit each entry as\
    \ it is an array. With the vector, there are two ways to do this. The first is\
    \ nearly identical to the C language way, using subscribing. The main idea is\
    \ that you get the current size of the vector from myvec.size():\n\n```\nfor (\
    \ size_t x=0; x<myvec.size(); ++x ) {\n  printf(\"%d = %d\\n\", x,myvec[x]);\n\
    }\n```\n\nFrom this, you can see how naturally the std::vector replaces an array.\
    \ The template argument allows you to specify other data types, you can declare\
    \ objects of other types including struct and class. We haven't covered strings\
    \ yet, but the C++ way create an array of strings is:\n\nstd::vector<std::string>\
    \ myvec;"
  - "[PAGE 131]\n\n# CHAPTER 11 C++ QUICK START\n\nWe examine strings later on so\
    \ that we can remain focused on containers. Sometimes, you'll need to access the\
    \ underlying array so that you can perhaps it happens to a C language function.\
    \ This can be done using the myvec.data() method. Suppose your C language function\
    \ uses the following function prototype:\n\n```\nextern void my_c_func(int *int_array,\
    \ unsigned count);\n```\n\nThis function can be passed the contents of the array\
    \ with myvec by:\n\n```\nmy_c_func(myvec.data(),myvec.size());\n```\n\nThe data()\
    \ method makes certain that the internal array std::vector is contiguous and returns\
    \ the starting address to it. We also supply myvec.size() to the function so that\
    \ the function knows the actual length of the array. As a note of caution, if\
    \ you add or delete members from the vector, the internal array can be reallocated.\
    \ Consequently, you must reacquire the actual array address by calling the method\
    \ data() again, if changes have been made to the vector object.\n\n# STL Iterators\n\
    \nThe second way to loop through the vector involves iterators. This sometimes\
    \ frightens people away, but bear with me. These are not only simple to understand,\
    \ but easy to use. We'll also see that the C++ 11 standard has them even easier\
    \ to use before. If your container is std::vector<int>, then the iterator is just\
    \ std::vector<int>::iterator. In other words, it is the same as the container\
    \ declaration but with ::iterator appended to it. So, far it is not too bad, it\
    \ is syntax. Conceptually, you can imagine iterators as just being some elaborate\
    \ kind of pointer. They do point to something (or to the “end”). How these are\
    \ actually implemented on your platform (Raspberry Linux in your case) should\
    \ be ignored. Use them as conceptual pointers. All containers have the following\
    \ methods to provide iterator values:\n\n+   * container.begin())\n* container.end()\n\
    \nThe begin() method returns an iterator that points to the first entry in the\
    \ container (if there is one). The end() method returns iterator representation\
    \ marking the end of the container. If the container is empty, then begin() returns\
    \ the same value as end(). Now let's look at the verbose C++ iterator loop for\
    \ myvec:\n\n```\nfor ( std::vector<int>::iterator it = myvec.begin(); it != myvec.end();\
    \ ++it ) {\n  printf(\"myvec[] = %d\\n\",*it);\nn\n```\n\nThe first iterator is\
    \ initialized with the value myvec.begin() in the loop. The loop continues as\
    \ long as the iterator is not equal to the end(). At the bottom of the loop, the\
    \ iterator is incremented (++it) so that it points to the next item in the container.\
    \ Within the for loop, the vector entry is accessed by using the asterisk of the\
    \ iterator name (*), as if it was a pointer. The iterator's method operator*()\
    \ is used to make this happen, but let's not fuss over the mechanics of it. Just\
    \ enjoy the bliss of knowing that the iterator can be used as if it were a pointer.\
    \ Now let's look at an easier way to write this same loop.\n\n119"
  - "[PAGE 132]\n\n# CHAPTER 11 ■ C++ QUICK START\n\nWith the recycling of the auto\
    \ keyword in C++, iterators have become a lot more convenient. Now you can code\
    \ your vector iteration begin like this:\n\n```\nfor ( auto it = myvec.begin();\
    \ it != myvec.end(); ++it ) {\n    printf(\"myvec[] = %d\\n\",*it);\nn\n```\n\n\
    Wow! Isn't that easier on the eyes?\nThe auto keyword forces the compiler to figure\
    \ out what type it should be from the right side. Because myvec.begin() is returning\
    \ the data type std::vector<int>::iterator, the type of the variable it will be\
    \ automatically declared by the compiler to match. The auto keyword really does\
    \ live up to its name being automatic.\n\nC++ 11 also supports a new syntax for\
    \ use with containers, but that is unimportant for now.\n\n# Container::operator[]\n\
    \nAlthough std::vector allows you to directly access members using the subscribing\
    \ notation, you must be careful in some cases to keep the subset within its current\
    \ range. The valid range of a subscript for std::vector is:\n\n```\n0 <= x < std::vector<type>::size()\n\
    ```\n\nAccessing subscripts outside of this range is undefined and could result\
    \ in a program abort.\nFor containers like map and set, you need to be aware that\
    \ if you subscribe with a value that does not exist, it will be created. We look\
    \ at this when we look at them\n\n# Container::at()\n\nMany containers like std::vector\
    \ have an at () method (check it out on cplusplus.com). This does a bounds check\
    \ for containers like std::vector. For map and set, it checks to make sure the\
    \ argument (key value) exists in the container. If the key does not exist (or\
    \ out of range), an exception is thrown.\nExceptions can be expensive. To avoid\
    \ them, you can test if a key maps by use of the find()\nmethod. We will look\
    \ at that later on\n\n# Ordered and Unordered Map\n\nMaps are perhaps the most\
    \ useful container in the STL, but first we have to answer this question: Do you\
    \ use\norordered maps?\n\nUnordered maps are quicker to update and to search (and\
    \ use less CPU overhead). The disadvantage is, when you iterate the members of\
    \ map, they are not presented in any kind\nof sequence you can depend on. If you\
    \ need the members in an order, then you can apply a sort\noutside of the map\
    \ (or use an ordered map).\n\nOrdered maps, on the other hand, require more CPU\
    \ effort to insert values and take longer to search,\nbut they can be iterated\
    \ in order:\n\nThe following two map types are available:\n\n+   - include <unordered_map>\
    \ declared with std::unordered_map<key_type,data_type>\n- include <map> declared\
    \ with std::map<key_type,data_type>\n\n120"
  - "[PAGE 133]\n\nUnlike std::vector, maps have a pair of values:\n\n+   * A key\
    \ value of key_type\n* A data value of data_type\n\nAssuming STL type std::string\
    \ holds a string value, we can declare a map that keys on GPIO number (int type),\
    \ to look up a description as its value (std::string):\n\n```\n#include <unordered_map>\n\
    \nstd::unordered_map<std::string,std::string> my_map;\n```\n\nLike the vector,\
    \ we can use to access or lock an entry in the map:\n\n```\nstd::string desc =\
    \ my_map[4]; // Returns \"GPLKO\"\n```\n\nNormally, we have to be careful if we\
    \ don't want to create entries accidentally. The at() method can use to throw\
    \ an exception if the entry does not exist\n\n```\ntry {\n    std::string desc\
    \ = my_map.at(4);\n} catch (const std::string::out_of_range& oor) {\n}\n}\n```\n\
    \nAlthough we have used a key_type of int, other types like std::string can be\
    \ used instead. We can use iterators for lookup. The find method returns an iterator\
    \ to:\n\n```\nauto it = my_map.find(4);\nif ( it != my_map.end()) {\n    printf(\"\
    %g %s = '%s\\n\",\n        it->first,\n        it->second.c_str());\n} else {\n\
    \    // Not found...\n}\n\n```\n\nHere we use the find() method to return an iterator\
    \ to the map, if the item does not exist, then an iterator matching my_map.end()\
    \ is returned instead.\nYou should also have noticed something else in this example.\
    \ The values used in the printf() statement were:\n\n+   * it->first, which refers\
    \ to the key.\n* it->second, which refers to the value. Unlike a vector, a map\
    \ is a container of pairs. Only the first of the pair (the key) is searchable,\
    \ because a map's iterator returns a pair, we must select either the first or\
    \ second element of that pair. The value in this map is type:std::string. For\
    \ this reason, it->second.c_str() was used to convert the std::string to a C string\
    \ for use in printf (more about this later)."
- md: "\n# Initializer Lists\n\nMaps are often used for lookup tables. The C++ 11\
    \ standard provides initializer_list support, to make it easy to initialize these\
    \ tables. The following is an excerpt from the gpio.cpp code in librpi2:\n\n```cpp\n\
    std::unordered_map<int, std::string> gpio_alto = {\n{ 0, \"SDA0\" }, { 1, \"SCL0\"\
    \ }, { 2, \"SDA1\" }, { 3, \"SCL1\" },\n{ 4, \"GCLK0\" }, { 5, \"GCLK1\" }, {\
    \ 6, \"GCLK2\" },\n{ 7, \"SPI_CE1_N\" }, { 8, \"SPI_CE0_N\" }, { 9, \"SPI_MISO\"\
    \ },\n{ 10, \"SPI_MOSI\" }, { 11, \"SCLK\" }, { 12, \"PWM0\" },\n{ 13, \"PWM1\"\
    \ }, { 14, \"TXDO\" }, { 15, \"RDO0\" },\n{ 16, \"reserved\" }, { 17, \"reserved\"\
    \ }, { 18, \"PCM_CLK\" },\n{ 19, \"PCM_F5\" }, { 20, \"PCM_DIN\" }, { 21, \"PCM_DOUT\"\
    \ },\n{ 22, \"reserved\" }, { 23, \"reserved\" }, { 24, \"reserved\" },\n{ 25,\
    \ \"reserved\" }, { 26, \"reserved\" }, { 27, \"reserved\" },\n{ 28, \"SDA0\"\
    \ }, { 29, \"SCL0\" }, { 30, \"reserved\" },\n{ 31, \"reserved\" }; };\n```\n\n\
    Each pair of values initializes the key and value for each map entry. Isn't that\
    \ convenient?\n\n# Iterating Maps\n\nIterating maps is just as easy as iterating\
    \ a vector. Using the gpio_alto map earlier, we can iterate this using:\n\n```cpp\n\
    for ( auto it = gpio_alto.begin(); it != gpio_alto.end(); ++it )\n    printf(\"\
    %d = '%s\\n\",it->first,it->second.c_str());\n```\n\nThe only new thing here is\
    \ that you must use it->first or it->second to access the key or value in the\
    \ pair of interest.\n\n# References\n\nLet's take a moment to discuss C++ references,\
    \ as they are often used in combination with STL containers. Let's use a structure\
    \ for illustration purposes:\n\n```cpp\nstruct s_client {\n    int id;\n    double\
    \ balance;\n    ...\n};\ns_client best_client;\n```\n\nThis code declares an instance\
    \ of structure s_client, named best_client. Now let's declare a pointer and a\
    \ reference to the same data:\n\n```cpp\ns_client *ptr_client = &best_client;\n\
    s_client& ref_client = best_client;\n```\n\n# CHAPTER 11 C++ QUICK START\n\nUsing\
    \ these two variables, let's modify best_client's balance:\n```cpp\nptr_client->balance\
    \ = 100.00; // best_client.balance == 100.00\nref_client.balance = 500.00; //\
    \ best_client.balance == 500.00\n```\n\nBoth the pointer (ptr_client) and the\
    \ reference (ref_client) physically access the same storage named best_client.\
    \ One uses pointer syntax (->) and the other dot (.). The reference variable possesses\
    \ the trait that it cannot be \"repointed\" once it has been established. The\
    \ pointer variable, however, can be changed at will. The safety provided by a\
    \ reference is often helpful.\n\nNow let's declare a map of clients, using int\
    \ as a client ID value as a key:\n\n```cpp\nstd::unordered_map<int, s_client>\
    \ clients_map;\n```\n\nWe can adjust the balances of all clients using the following\
    \ loop:\n\n```cpp\nfor ( auto it = clients_map.begin(); it != clients_map.end();\
    \ ++it ) {\n    it->second.balance -= some_adj;\n}\n```\n\nThis code compiles\
    \ and executes fine, but the iterator makes the code less clear. The problem is\
    \ it it->second doesn't indicate what data type you are accessing. You have to\
    \ examine the definition of clients_map so that it->second refers to a s_client.\n\
    \nTo improve readability, you might use a pointer, but this is still suboptimal:\n\
    \n```cpp\nfor ( auto it = clients_map.begin(); it != clients_map.end(); ++it )\
    \ {\n    s_client *client = &it->second;\n    client->balance -= some_adj;\n}\n\
    ```\n\nNow you immediately know that it->second refers to the s_client structure.\
    \ But pointer syntax client->balance, and so on, is awkward. There is also the\
    \ danger in a large body of code that the pointer can get accidentally changed.\
    \ From an efficiency point of view, we are still good because these types of things\
    \ are optimized by the compiler.\n\nWe can improve this for, though, by using\
    \ a C++ reference instead:\n\n```cpp\nfor ( auto it = clients_map.begin(); it\
    \ != clients_map.end(); ++it ) {\n    s_client& client = it->second;\n    client.balance\
    \ -= some_adj;\n}\n```\n\nNow we can access members of client as if it were declared\
    \ right inside the loop. Behind the scenes, of course, the compiler uses a pointer\
    \ (essentially what the reference is), but we have been spared having to use pointer\
    \ syntax. We also gain the safety of the fact that client will not point to anything\
    \ else (the compiler won't let you change it). These safety things are huge inside\
    \ large bodies of code.\n\n# CHAPTER 11 C++ QUICK START\n\nHere is another application\
    \ for using a reference with containers. Say you want to add a new s_client member\
    \ to the map, and the structure is large. You could perform this procedure the\
    \ following way, but it is efficient:\n\n```cpp\ns_client new_client; // temp\
    \ struct\n\nnew_client.id = 1234;\nnew_client.balance = ...;\n\nclients_map[new_client.id]\
    \ = new_client; // copy new_client into map\n```\n\nThis creates a temporary struct\
    \ named new_client on the stack. The members of new_client are populated with\
    \ assignment statements. The last step, the key new_client.id is used to access\
    \ an existing map entry or create a new one. Then the data structure new_client\
    \ is copied into the map.\n\nThis gets job done. However, if you want to avoid\
