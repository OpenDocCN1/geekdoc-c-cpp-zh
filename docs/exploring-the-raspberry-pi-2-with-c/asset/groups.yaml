    | 31 | Output |


    # Configuring Pullup/Pulldown


    Input pins should normally have a pullup or pulldown resistor enabled. Otherwise
    the voltage on an unconnected pin can "float" between a high and low voltage.
    This can cause instability.


    The -p (pullup) option allows you to configure this. The -p option takes one of
    three arguments:


    - n (no pullup)

    - u (pullup)

    - d (pulldown)


    The following example configures GPIO 4 as an input, with a puldown resistor applied:


    ```

    $ gp -g4 -i -pd

    ```


    # Setting GPIO Output


    A GPIO can have its output level set using the gp command. The following sets
    GPIO 4 to a low (0) level:


    ```

    $ gp -g4 -s

    ```


    In this example, the GPIO 4 is assumed to be previously configured as an output.
    Note that if the GPIO is not configured to be an output, the value can be established
    anyway. It will simply not be available at the GPIO pin.


    # Reading GPIO Input


    The gp command can read a GPIO input. The following example configures GPIO 4
    as an input, configures the puldown resistor, and reads the input appearing at
    the pin:


    ```

    $ gp -g4 -pd -ir

    GPIO 4 = 0 (-r)

    ```


    In this example (on my Pi), the GPIO 4 is unconnected. Because it was configured
    as an input, with a puldown resistor, the input read as low (0). If we use a pullup
    instead with this unconnected GPIO, we should be able to read a high level on
    the pin (1):


    ```

    $ gp -g4 -pu -ir

    GPIO 4 = 1 (-r)

    ```


