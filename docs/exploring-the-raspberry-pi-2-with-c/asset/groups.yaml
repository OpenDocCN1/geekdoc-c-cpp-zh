    # CHAPTER 2


    # Workstation


    After a very brief introduction to the Raspberry Pi 2, we''ll take a look at a
    homemade version of an experimenter''s workstation. This information is intended
    to inspire rather than serve as instructions to be followed. Keep in mind that
    your Pi need not remain attached to the workstation forever. If you need it for
    a permanent project, it can be safely removed and “repurposed.”


    # The Raspberry Pi 2 Arrives


    My RaspberryPi 2 arrived from element14.com in a cute little box, labeled “Raspberry
    Pi 2 Model B 1GB.” I was looking forward to it mainly because the quad-core CPU
    and the doubled memory capacity meant a significant upgrade. Seeing confirmation
    of these two things on the box immediately told me that the item was shipped.


    There was some difficulty ordering this because most suppliers ship only by courier.
    In Canada, for example, couriers charge an extra fee when something is delivered.
    They call it a “customs brokerage fee.” Fortunately, I was able to mine it from
    adafruit.com, where they allowed me to have it shipped by the U.S. Postal Service.


    The box it came in and the booklet (see Figure 2-1) really don’t provide any practical
    value, other than giving you that warm and fuzzy feeling that you got a quality
    product for your money. The best part really is that you received four CPU cores
    and double the memory for same Raspberry Pi price. Kudos to the Raspberry Pi folks
    for that.


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_21_0.png)


    Figure 2-1. The Raspberry Pi 2 booklet and box


    5'
  - '[PAGE 22]


    With the Raspberry Pi in hand, the question “What''s next?” comes immediately
    to mind. I have personally found that prototyping and experimentation go best
    when things are well organized. Having loose wires and pcbs slipping over the
    workbench is a good way to invite short circuits, crashed operating systems, and
    corrupted files. By contrast, a clean workbench and an organized workstation make
    experimentation much more fun.


    # The Raspberry Pi 2 pcb


    Figure 2-2 shows a top view of the Raspberry Pi 2 pcb. First we have the new and
    improved 2x20 header strip for the GPIO header, which originated with the Raspberry
    Pi B+. Going clockwise around the board, we see the following:


    +   * Two pairs of USB ports at the upper right side.

    * The Ethernet port at the bottom left.

    * The Audio/Video connector J7 at the bottom.

    * The Camera connector J3.

    * HDMI output left of J3.

    * The mini USB power input at the lower left (marked “PWR IN”).

    * The display connector J4 at the left (marked “DISPLAY”).


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_22_0.png)


    **Figure 2-2.** The top view of the Raspberry Pi 2


    The other important improvement that I like is the orderly placement of the mounting
    holes. The square arrangement of these holes makes for easier and stable mounting
    of the pcb.'
  - '[PAGE 23]


    Figure 2-3 shows the bottom side of the Raspberry Pi 2. The most noteworthy aspect
    of this photo is the strategic placement of the MicroSD card slot (shown at right).
    It feels like it is in the correct place (under J4) and the card holder makes
    it easier to use without fear of breakage. The card slot is still small and delicate
    so some care handling the MicroSD card is still advised.


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_23_0.png)


    **Figure 2-3.** Bottom side of the Raspberry Pi 2 pcb


    One other improvement that is worth mentioning is that the power connector has
    no nearby capacitor to leverage your thumb or finger on. There were reported cases
    of these breaking off.


    # # Constructing the Workstation


    In this section, I describe how I built my own workstation. You need not do it
    the same way, because I know that Raspberry Pi folks are very self-expressive!

    For simple projects, I find that a chunk of wood works great (see Figure 2–4).
    Wood is an insulator, making it safe to attach things to it without being concerned
    with unwanted grounding or short circuits. You can stain and finish it for visual
    appeal (I used a sealing stain for mine).'
  - '[PAGE 24]


    # CHAPTER 2 ■ WORKstation


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_24_0.png)


    **Figure 2-4.** A stained piece of 3/4 inch pine


    I chose a piece of pine 3.5 inches wide and cut it to 10 inches in length (more
    about length later). The wood was 3/4 inch thick. I don''t recommend a thinner
    piece because that makes it harder to screw things into it without the screws
    coming out at the bottom. You don''t want to scratch the dining room table if
    that is where you work!


    Once your piece of wood is prepared, job one is to mount the Raspberry Pi 2 on
    it. This time we have four nicely placed holes in the pcb for this purpose. To
    mount the pcb, you''ll need some insulating spacers (don''t mount without spacers,
    as bending the pcb is likely to damage it). I prefer insulating spacers because
    you don''t have to worry about shorting out something if the spacer wanders too
    far from the hole area.


    Finding suitable spacers is often a challenge. I stumbled on the idea of using
    discarded pens one day, which seems to work rather well. Figure 2-5 shows an example
    of a discarded pen that I used for this project.


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_24_1.png)


    **Figure 2-5.** A discarded pen used as a spacer'
- md: '

    The best pens use are round on the outside and made of fairly sturdy plastic.
    This particular pen was a bit softer than I. Remove the ballpoint and ink, discard
    the end cap. With a small pipe cutter (see Figure 2-6), cutting off a small piece
    from the end to test the plastic. If you find it too soft, then try a different
    pen. Earlier, I had a free one from a hotel that was just perfect. I wish I had
    more of those.


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_25_0.png)


    **Figure 2-6.** A small pipe cutter


    Locate some screws that will be long enough to go through the pcb and into the
    wood (3/4 inch) and be small enough to pass through the pcb holes. My screws wouldn''t
    quite fit through the pcb so I had to carefully shave off some pcb using a drill
    bit. I used a bit that fit inside the hole, but by working the drill bit around
    a little, I was able to get the small amount of extra clearance that I needed.
    Be very careful about this, though. Any brute force applied could ruin your Pi.


    With your wood ready and your wood screws chosen, determine the length of the
    spacers you need. Don''t forget to allow for the pcb thickness. In my case, I
    settled on a spacer length of about 9 mm. Figure 2-7 shows me cutting a spacer
    from the pen.


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_26_0.png)


    Figure 2-7. Cutting a spacer


    Even if you''ve never used a pipe cutter before, the operation is quite simple
    and safe. Place the work between the cutters, turn the handle to tighten. Don''t
    overtighten, tighten enough that the blades cut as you turn the pipe cutter around
    the work. After a few rounds, tighten some more. If you have a stiff plastic,
    the pipe cutter will eventually cut a length right off. The pen I used was a softer
    plastic, so the cutter merely put rings in place. After the rings are cut deep
    enough, you can finish off with a utility knife (use a scrap of wood underneath,
    to cut it).


    Figure 2-8 shows the screw and spacer turned up so that you can get an idea of
    how much screw should be showing through.


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_26_1.png)


    Figure 2-8. Spacer and wood screw protruding


    ## CHAPTER 2 WORKSTATION


    The nearly completed workstation is shown in Figure 2-9. The Raspberry Pi 2 was
    mounted at the left with all the connectors facing me. The MicroSD card goes from
    the back side of this photo. The MicroUSB power connector and HDMI connections
    are at the left (at the end of the wood). This leaves the GPIO 2x20 header strip
    on the right side to connect to the breadboard, which we have not yet discussed.


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_27_0.png)


    **Figure 2-9.** The nearly completed Raspberry Pi 2 workstation


    ## Breadboard Breakout


    To facilitate easy prototyping experiments, I purchased a T-shaped breakout that
    works for the Raspberry Pi 2 (and B+). Figure 2-10 shows the breakout that I used.


    11


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_28_0.png)


    **Figure 2-10.** The Raspberry Pi 2 breakout


    Notice the keyway that helps you align the cable''s pin one the correct way. If
    you use a cable without this key, then it is important that you align the cable
    such that the marked wire (white in Figure 2-10) mates with pin one of the socket.
    There should be a small triangle on the receiving socket to mark pin one.


    The other end of the ribbon cable must plug into J8 on the Raspberry Pi 2. Because
    there is no keyed socket there, it is important to orient the connector the correct
    way. Figure 2-11 shows how the connector should mate to J8.


    ## CHAPTER 2 WORKSTATION


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_29_0.png)


    **Figure 2-11.** 2x20 ribbon connection to the Raspberry Pi pcb


    In Figure 2-11 you will be able to see the triangle at the left. The bump in the
    middle helps to confirm that it is oriented the correct way. This pin must mate
    with the pin with the square hole pad, shown in the upper right of Figure 2-3.
    The square pad identifies pin one.


    Once the breakout cable is attached, do a powered up to double-check that all
    is inserted. Figure 2-9 shows the red alligator clip connected to the +3.3V pin
    of the breakout, and the black is connected to ground. The other end of these
    leads goes to a digital multimeter (DMM). Power the Pi without the microSD card
    so that you can turn it on and off without worrying about corrupting data. We
    simply want to check where the +3.3V comes out of the breakout.


    If things are properly oriented, you read +3.3V on your multimeter. If you get
    +5V instead (where +3.3V should appear), your ribbon cable is connected backward
    at one end. All this is simple enough, but also easy to get wrong.


    My connector might need to twist the ribbon cable (I there are other designs that
    do not). To secure the cable, I would have had to drape the cable over the Pi''s
    pcb, or over the breakout pins. I didn''t like the idea of either, so I chose
    to live with the twisted cable. Maybe things will be different for you.


    It is worth mentioning at this point the choice of the workstation''s work length.
    Your choice depends on the size of the breakout you choose. Choose a long breakout
    if possible; the breakout connector will take up a significant portion of the
    real estate.


    ## RS-232 Connection


    Perhaps I''m a bit of "old school," but I like to have the option of a serial
    port. With USB to a serial cable you can communicate with your laptop, for example.
    The serial port also allows communication with Arduino/AVR devices without using
    USB. Finally, when configured for it, the serial port can be used as a serial
    port console.


    I purchased my converter from eBay. The item was titled "MAX3232 RS232 Serial
    Port to TTL Converter Module (DB9)" and cost me $1.15 US. With free shipping,
    it''s hard to find a good reason to build this yourself. 2-12 shows the very small
    adapter''s top view.


    13


    ## CHAPTER 2 ■ WORKSTATION


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_30_0.png)


    **Figure 2-12.** Top view of the RS-232 converter


    The MAX3232 chip is designed to operate from +3.0V to +5.5V, using 1 mA (with
    no load). Provided we power this converter from the Raspberry Pi’s +3.3V supply,
    it will interface with the Raspberry Pi’s GPIO lines safely. This particular unit
    provides only RX and TX data lines. If you need the extra control signals like
    RTS, then shop for a converter that supports them.


    The pins showing at the back of Figure 2-12 are as follows:


    - VCC (connect to +3.3V)

    - GND

    - RX (connect to Pi’s RX)

    - TX (connect to Pi’s TX)


    Figure 2-13 shows the bottom of the converter. Using needle nose pliers, I bent
    a hook from some leftover wiring.


    14


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_31_0.png)


    **Figure 2-13.** Bottom of RS-232 converter


    You might need a third hand to get this soldered into place. Apply sufficient
    heat for the solder to soak into the joint without damaging the pcb. Figure 2-14
    shows the finished job with copper "wings" ready for mounting.


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_31_1.png)


    **Figure 2-14.** Copper wings on the converter


    ## CHAPTER 2 WORKSTATION


    With that work out of the way, it is a simple matter to install it on the workstation
    (Figure 2-15) with a pair of wood screws and washers. I installed the converter
    on the back side of the station because I have plans for the front side (to be
    covered later).


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_32_0.png)


    Figure 2-15. The RS-232 converter installed


    ## Panel Meter


    The nice thing about wood is it is easy to build in extras with a small amount
    of planning. Figure 2-16 illustrates how a 1 mA panel meter was added to the workstation.
    We use that later when we do some PWM experiments.

