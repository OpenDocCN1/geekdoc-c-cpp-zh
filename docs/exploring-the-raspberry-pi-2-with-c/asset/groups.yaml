    # CHAPTER 8


    # Physics of the GPIO Interface


    With the popularity of the Raspberry Pi, many students without an electronics
    foundation are exploring the GPIO interface for the first time. This sometimes
    leads to problems and limitations because of missing vital concepts and understanding.


    I believe this can be largely avoided with a little bit of introduction. This
    chapter examines the electronic characteristics of the GPIO pins as inputs and
    outputs (and interfacing CMOS devices generally). I have used LTspice to model
    an equivalent circuit so that the currents and voltages can be visually plotted
    for ease of understanding. This chapter will equip you to avoid some of the pitfalls
    of working with GPIO and CMOS.


    # CMOS


    The Raspberry Pi GPIO interface is manufactured from CMOS components within the
    chip. Additionally, the CMOS 4000 series logic IC family interfaces to the Pi''s
    GPIO interface, mainly because of its ability to operate on a wide range of voltages,
    including 3.3V.


    For this reason, let''s begin with what CMOS is all. I''m going to skip the physical
    construction of the MOSFET transistor and discuss it as a black box component.
    This will avoid some electronics theory while keeping the novices student engaged.
    This will afford a wealth of information about CMOS the time-tested CMOS Cookbook...
    Don''t let the age of the book put you out.


    CMOS is short for Complementary MOS, where NMOS is a type of transistor. The Metal
    Oxide Semiconductor (MOS) transistor comes in n-channel (NMOS) and p-channel (PMOS)
    types in the same way as a bipolar transistor and they are also referred to as
    MOSFETs (MOS Field Effect Transistor). The term MOS and MOSFETs are used interchangeably.


    The MOSFET (as a component) usually has three terminals when the substrate is
    connected to:


    +   1. Drain

    2. Gate

    3. Source (usually connected to the substrate)


    NMOS and PMOS transistors are complements of each other. NMOS transistors have
    their source connected to ground (negative), whereas PMOS transistors connect
    their source to the positive.


    The gate of a MOSFET controls the current passing from source to drain. This gate
    is affected by a voltage level with no current flow (think of it as a very small
    capacitor). A bipolar transistor, on the other hand, is activated by a small current
    instead. It is important to remember that no current flows into or out of the
    gate of a MOSFET. Bit of static voltage levels as turning the device or off.


    The gate inside the MOSFET is a metal oxide over an insulation layer (the insulation
    layer can be damaged by static electricity). This construction causes the gate
    to behave as a capacitor between it and other two terminals. Only a very small
    amount of current flows to or deplete the gate of an electron charge. Once the
    charge is transferred, no further current flows.'
  - '[PAGE 97]


    # CHAPTER 8 PHYSICS OF THE GPIO INTERFACE


    The behavior of the MOSFET depends on the gate voltage as compared to its source
    terminal. When the gate voltage is positive with respect to the source terminal
    (for NMOS), the device conducts current between its source and drain terminals
    (turns on). The MOSFET does this with gain, providing amplification. Reduce the
    gate voltage to ground (zero, relative to its source) and it turns off.

    MOS device is sensitive to gate voltage, except that the polarities are reversed.
    Its source is connected to the positive power supply, so its gate must go negative
    to turn the device on. For this reason, the PMOS device acts as the complement
    of the NMOS device.


    # MOSFETs in Action


    Figure 8-1 illustrates a circuit modeled in LTspice to simulate the behavior of
    an NMOS transistor and a PMOS transistor beside each other (they are not in CMOS
    configuration). V1 supplies the power, which represents the +3.3V supply from
    the Raspberry Pi. The voltage V2 represents a gate (input) signal that will drop
    from an initial supply level (+3.3V) down to the ground over time and then back
    up and down again. This allows us to see the current flow changes in loads R1
    and R2.


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_97_0.png)


    Figure 8-1. Test MOSFET circuit for LTspice


    Running simulation and capturing the gate signal voltage V2 (Vn002) and the currents
    in resistors R1 (I(R1)) and R2 (I(R2)), we get the simulation output shown in
    Figure 8-2.'
