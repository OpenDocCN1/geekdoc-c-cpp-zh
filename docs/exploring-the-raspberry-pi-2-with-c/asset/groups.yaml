    \    }\n}\n```\n\n在这个示例中，请记住全局 gpio 实例在主程序启动之前就已经构造（并执行）。因此，如果发生问题，gpio 对象将仅设置其内部的\
    \ `errcode`。\n\n## GPIO::get_error\n\n本质上，在执行互斥锁锁定后，代码会检查是否有另一个 GPIO 类实例（可能在另一个线程中）已经执行了此过程。如果已经执行，当前构造函数将直接使用已收集的信息。构造函数是线程安全的，允许你从应用程序的多个点实例化\
    \ GPIO 类。\n\n然而，有一个特别说明：如果启动程序由于任何原因失败，系统错误代码 (errno) 将保存在类成员 `errcode` 中。构造函数不会返回任何状态信息，因此需要你来检查错误。\n\
    \n## GPIO::configure\n\n有三个重载 `configure` 方法：\n\n- `int configure(int gpio, IO\
    \ io)`\n- `int configure(int gpio, Pull pull)`\n- `int configure(int gpio, Event\
    \ event, bool enable)`\n\n第一个方法将引脚配置为输入或输出。第二个方法设置内部的上拉/下拉电阻。第三个方法启用或禁用特定的事件中断。\n"
