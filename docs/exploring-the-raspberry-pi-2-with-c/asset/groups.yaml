- md: "\n## Momentary Debouncing\n\nIn the book *Mastering the Raspberry Pi (Apress,\
    \ 2014)* a CD4013 flip-flop circuit was used to debounce a button or switch. For\
    \ buttons, however, the flip-flop circuit is inconvenient because it requires\
    \ both normally open and normally closed contacts. This mandates more expense\
    \ and additional wiring. \n\nA simpler and more economical solution is shown in\
    \ Figure 10-3, using a Schmitt trigger (CD40106 in this case). The button is represented\
    \ by S1, connected to resistor R1 and capacitor C1. These together with the Schmitt\
    \ trigger action of IC1A, result in a clean debounced output signal appearing\
    \ at OUT. Because it is an inverter, the output is produced while the button is\
    \ pressed. An advantage of the hex inverter part is that the CD40106 means that\
    \ you get six of these for the price of one.\n\n![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_119_0.png)\n\
    \n**Figure 10-3.** A momentary button debounce circuit\n\n## Toggled Debouncing\n\
    \nSwitches can be expensive to buy and install in quantity. Buttons, on the other\
    \ hand, can sometimes be inexpensive by comparison. If you were able to use a\
    \ button to toggle a signal, you could use a button as a switch. Figure 10-4 illustrates\
    \ a simple way to do this reliably using the CMOS part CD4049.\n\n# CHAPTER 10\
    \ DEBOUNCING\n\n![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_120_0.png)\n\nThe CD4049\
    \ is a simple CMOS inverter, but when combined with R2 and C1, and feedback resistor\
    \ R1, the push button (S1) can be used to toggle its. The output can be taken\
    \ from either IC1A (pin 2) or IC1B (pin 4). Alternatively, you could add one more\
    \ inverter to be used as a buffer stage.\n\nWhen using the circuit shown in Figure\
    \ 10-4, the application normally requires some sort of feedback to the user. If\
    \ the Raspberry Pi application shows some visual on a screen, other LED, or sound\
    \ in response to a button press, nothing further is needed. However, if none of\
    \ these cues are present, the user will be wondering if or she toggled the input\
    \ or off.\n\nFigure 10-5 shows one possible solution to the problem, at the expense\
    \ of more components. In this circuit the toggle function is still provided by\
    \ IC1A and IC1B. The LED indicator is driven by another inverter IC2A, and the\
    \ signal is driven by IC2B. These extra inverters may be drawn from IC1 if you\
    \ prefer (the schematic was extracted from a larger design that I used).\n\n![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_120_1.png)\n\
    \nFigure 10-5. Toggle button with buffer and LED indicator\n\nThe one that deserves\
    \ special mention in this circuit is the fact that the LED is driven without a\
    \ limiting resistor. Normally the resistor is required and it is still good practice\
    \ to use it. Here, it is possible to get away without it (if you like) because\
    \ the circuit (for the Raspberry Pi) will be operating from 3.3V. Additionally,\
    \ the CMOS output transient will be limited by the current that it can deliver\
    \ at lower voltage level. IC2A will not be able to deliver more than 4 mA of current\
    \ to the LED. So be certain to choose a small, low-current LED for the purpose.\n\
    \n## The MC14490\n\nThe contact bounce problem was serious enough to have a chip\
    \ designed for the purpose. ON Semiconductor states their chip quality at 456\
    \ FETs (or 136.5 equivalent gates). The MC14490 (also known as CD4490) is a CMOS\
    \ part and such, can operate from 3.0V to as high as 18.0V. Again, 3.3V operation\
    \ is ideal for these chips probably counts to their higher price compared to other\
    \ logic gates in the series (I purchased for ebay about a dollar each).\n\nThe\
    \ MC14490 works in a sampling principle. It clocks samples of the input at intervals,\
    \ arriving on or off changes. If the shift register samples all as zeros (touched),\
    \ the output goes low (0). Conversely, if the shift register samples all as high\
    \ (open) the output changes to high (1). Changes due to jitters in the input are\
    \ ignored at the output.\n\nFigure 10-6 shows a circuit with two push buttons\
    \ (one for BIN but could be wired for debounced, and so on. The MC14490 has built-internal\
    \ pullup resistors for inputs, none are required externally (care for static in\
    \ your handling).\n\n![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_121_0.png)\n\nFigure\
    \ 10-6. The MC14490 contact bounce eliminator\n\nThe sampling frequency is determined\
    \ by capacitor C1. The datasheet provides formulas for C for a given sampling\
    \ frequency. For a sampling frequency 15 Hz, the formula provided by ON Semiconductor\
    \ is $15 = 6.5/C$, where $C$ is in $\\mu F$. Solving for $C_t$, we get the formula\
    \ $C_t = 6.5/15$, which calculates as 0.43 $\\mu F$. The next standard size capacitor\
    \ would be 0.47 $\\mu F$. So a 0.47 $\\mu F$ capacitor should result in a sampling\
    \ frequency of 13.8 Hz. Some experimentation might be required. Keep in mind many\
    \ capacitors have tolerances as wide as 30%.\n\nIn my own experiment, I didn't\
    \ have that so I tried a 0.02 $\\mu F$ capacitor instead. It produced a higher\
    \ sampling frequency, which would make it more sensitive to glitches, but it proved\
    \ the overall operation with no problems.\n\nUsing PiSpy, I was able to sample\
    \ the oscillator on pin 9. You need a long sampling period due to the low frequency\
    \ of the oscillator. I chose to use 48 blocks for this capture. Looking at the\
    \ wave in Figure 10-7, you can see that the wave was about 32 ms. Taking the reciprocal\
    \ of that gives us a frequency of about 31.25 Hz (using a 0.02 $\\mu F$ capacitor).\n\
    \n$ pyspy -b48 -R19 -T9\nCaptured: writing.vcd\n\n![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_122_0.png)\n\
    \nFigure 10-7. PiSpy capture of the OSC_out (pin 9) of the MC14490\n\nTo test\
    \ its button action, wire the button S1 to Figure 10-6. Attach the debounced AO\
    \ to GPIO 19. GPIO 19 boots up as an input, but otherwise make sure that it is\
    \ in input mode with -i before making the connection (-pu adds a pull resistor,\
    \ which should also be the default).\n\nThe following command inserts the input\
    \ (-i) for GPIO 19 (-g19), adds a pullup resistor (-pu), and monitors that GPIO\
    \ (-m0). Once the gp command is monitoring, you should be able to get clean button\
    \ events. My session looked like this:\n\n```\n$ gp -g19 -pu -m0\nMonitoring..\n\
    00000 GPIO 19 = 1\n00001 GPIO 19 = 0\n00002 GPIO 19 = 1\n00003 GPIO 19 = 0\n00004\
    \ GPIO 19 = 1\n00005 GPIO 19 = 0\n00006 GPIO 19 = 1\n00007 GPIO 19 = 0\n00008\
    \ GPIO 19 = 1\n```\n\nThe button I used was a real scratch in electrical terms\
    \ but it performed magnificently. Figure 10-8 illustrates my breadboard test on\
    \ the end of the Raspberry Pi 2 workstation. This circuit is easy to breadboard\
    \ that you should make a point of trying it yourself. It simply needs 3.3V power\
    \ (from the Pi), ground, a capacitor, and a button. The output simply goes to\
    \ a GPIO input.\n\n![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_123_0.png)\n\n**Figure\
    \ 10-8.** Breadboard setup for MC14490 button test\n\nWhen ordering this part,\
    \ buy more than one (I suggest five). It doesn't happen often, but sometimes you\
    \ get a dud (or it becomes one). There's nothing more disappointing than being\
    \ ready to go and discovering that your part is dead. Because you're attaching\
    \ to the input of the Pi, be sure to power the MC14490 from the 3.3V supply (not\
    \ the 5V supply).\n\nIf you experience trouble getting this to work (like I did\
    \ the first time), perform the following checks:\n\n- 1. Check ground. Is the\
    \ pin 8 attached to the Pi's GND?\n- 2. Check pin 16. Is it connected to the Pi\
    \ +3.3V supply?\n- 3. Check the capacitor. Are the connections pin 7 and 9?\n\
    - 4. Disconnect the push button and the GPIO output.\n- 5. Connect OSC$_{out}$\
    \ (pin 9).\n"
