    \ A CLASS GPIO 1\n\nNote that these parameters are applied in groups to GPIO pins.\
    \ To choose the group, specify any gpio number that is part of the group. For\
    \ example, to get the values for gpio 19 (and group), you could code:\n\n```cpp\n\
    int rc;\nbool slew_limited, hysteresis;\nint drive;\n\nrc = gpio.get_drive_strength(19,slew_limited,\
    \ hysteresis,drive);\nassert(!rc);\nif ( slew_limited )\n...\nif ( hysteresis\
    \ )\n\nprintf(\"Drive strength is %d mA\\n\",2+drive*2);\n```\n\nThe value drive\
    \ is an integer ranging from 0 (2 mA) to 7 (16 mA). The return value of the method\
    \ is zero for success or a system error number when a problem occurs.\n\n## GPIO::set_drive_strength\n\
    \nYou can set the drive strength, slew limiting, and hysteresis by use of this\
    \ method:\n\n```cpp\nint set_drive_strength(int gpio,bool slew_limited,bool hysteresis,int\
