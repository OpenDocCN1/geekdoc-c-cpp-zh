    # APPENDIX D


    # Class MAX7219


    This appendix documents the class MAX7219 to facilitate communication with the
    chip with the same name and it is useful for those wanting to:


    +   - Working with the MAX7219 (or MAX7221) to control a display

    - To enable/disable the display

    - To display the test pattern

    - To configure the number of digits and decode mode

    - To configure the intensity of the display

    - To drive a display


    # Include File


    With the default build and install PREFIX=/usr/local, your installed librpi2 header
    files should be located in /usr/local/include. In your program use:


    ```

    #include <librpi2/max7219.hpp>

    ```


    If necessary, add the compiler option -I/usr/local/include.


    # Linking


    With the default build and install PREFIX=/usr/local, your installed librpi2 library
    should be located here: /usr/local/lib/librpi2.a


    When linking your program, add the options -L/usr/local/lib -librpi2 to the link
    step of your make file.'
