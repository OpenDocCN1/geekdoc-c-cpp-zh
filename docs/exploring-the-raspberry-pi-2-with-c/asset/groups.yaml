    The headings mean the following:


    - 1. GPIO: gpio pin

    - 2. ALTFUN: Input, Output or Alternate Function (Alt0–Alt5)

    - 3. LEV: Current level at the GPIO pin

    - 4. SLEW: Y=GPIO is slew rate limited (else N)

    - 5. HYST: Y=Input has hysteresis (else N)

    - 6. DRIVE: Output drive level in mA (when output)

    - 7. DESCRIPTION: Description of configured function


    The one setting is not reported is the current pullup/pulldown setting. The reason
    for this is the Raspberry Pi hardware does not permit you to read the current
    setting (you can change it, but you can''t read back what that setting is). If
    there is nothing attached to the pin, you can sometimes infer the setting for
    the pin. We''ll see an example of this shortly.


    # Configuring GPIO as Input


    To change a GPIO pin to an input, you can specify the GPIO pin with the -g option
    and provide the -i option. The following example sets GPIO pin 4 as an input:


    ```

    $ gp -g4 -i

    ```


    You can verify that it worked by displaying with the -D option.


    # Configuring GPIO as Output


    In a similar fashion, you can configure a GPIO pin as an output. The following
    example changes GPIO 40 to an output pin:


    ```

    $ gp -g4 -0

    ```


    Multiple GPIO pins can be changed by a sequence of options. The following makes
    GPIO 4 an output and GPIO 26 an output.


    ```

    $ gp -g4 -0 -g26 -0

    ```


    # Configuring GPIO as Alternate Function


    The option -a takes an argument from 0 through 5, for alternate functions 0 through
    5. For example, to configure GPIO 16 as alternate function 5, use:


    ```

    $ gp -g16 -a5

    ```


    Be careful, as some configurations can cause problems. See next section.


    # Chart of Alternate Functions


    The following chart will help you in choosing an alternate function and GPIO pin.
