    # PiSpy in a Nutshell


    In this section, I present a bird''s-eye view of how pyspy works because it is
    simply too complex to describe in detail. With this overview, and the provided
    source code, the kernel programmer can reuse the classes found in librpi for his
    or her programs.


    - ~/pips2/pyspy/pyspy.cpp

    - ~/pips2/librpi2/*.cpp

    - ~/pips2/include/*.cpp


    The pyspy command uses the following class libraries:


    - 1. Logic Analyzer (#include "logana.hpp")

    - 2. GPIO (#include "gpio.hpp")

    - 3. VCD_Out (#include "vcdout.hpp")


    The GPIO class is described in the appendix. The other classes can be used by
    the enterprising programmer by reviewing the include for them.


    The basic steps are to use the pyspy program to capture and display the signals:


    - 1. Parse command line.

    2. Open the kernel mailbox using class LogicAnalyzer.open() method. This causes
    the following to happen:


    - 1. Opens device /dev/rpidma (provided by our rpidma.ko loadable kernel module).

    2. Determines memory allocation offset and flags to use, depending on whether
    the Raspberry Pi 2 (ARMv7) or prior modules (ARMv6) is being used.

    3. Creates a device node to access the mailbox with (/dev/logana).

    4. Opens this driver file.

    - 5. Allocates pages for the mailbox.

    - 6. Locks that memory.

    - 7. Obtains a virtual address for the mailbox using (according to option -b).

    - 4. The first block is accessed by the DMA controller''s first control block
    will remain (the remainder of each memory block is used for holding samples).

    - 5. The LogicAnalyzer''s method propagate() is invoked to clone copies of the
    first DMA control to the other memory blocks, making the necessary adjustments
    to change these together.

    - 6. If the verbose (-v) option is used, the first control block is displayed
    on the terminal.

    - 7. The LogicAnalyzer.start() method initiates DMA transfer.

    - 8. If there are triggers, the code waits for the first DMA interrupt to occur.
    This signals to the data in the first capture block is ready for scanning.

    - 9. If there are triggers and the trigger condition is found in the first capture
    block, the capture is allowed to continue until completion.

    - 10. Otherwise, the current DMA is captured and restarted. The loop will give
    up if the trigger is not found in many tries (-T option).

    - 11. If the verbose option is used (-v), the DMA status is reported to the terminal
    session.

    - 12. At this point the capture is complete and sitting in memory.


    The next thing that happens is the data captured is written out to a file. The
    capture format used is *.vcd format (value change dump). This is a format defined
    by IEEE Standard 1364-1995 in 1995.[1]

    The pispy tool creates or overwrites the file captured.vcd defines signals gpi0
    through gpio31, and writes out timing and change information. This information
    can be loaded and viewed directly by the gtkwave command.

    After the data is captured in the file, pispy will automatically start the program
    /usr/bin/gtkwave, unless instructed not with the option -x. Because gtkwave puts
    out a lot of GTK messages at startup, they are either suppressed or sent to the
    file .gtkwave (option -2 affects this).


    # Summary


    In this chapter you learned how to use pispy to capture GPIO signals into a file
    captured.vcd, and that this file is normally small compared to the capture memory
    used. You also learned how to operate gtkwave, which is perhaps less obvious to
    use. Finally, the gtkwave customizations provided could be a great help to some.


    The next chapter introduces you to the piclock command provided with this book.
    Using this command, we''ll put the general purpose Raspberry Pi to work and use
    pispy to check our work.


