    **Figure 8-6.** Two CMOS outputs in conflict


    The dark airbrushed line shows one potential heavy current flow with output connected
    to output. M4 in the CMOS peripheral is on and the lower M1 in the GPIO output
    is on, then we have an epic struggle. There is nothing to restrict the current
    flow aside from the resistance of the active MOSFETs themselves. Another possible
    heavy current flow occurs when M2 is on and M3 is on. Either of these possibilities
    could lead to permanent damage.


    So the question is this: How do you design for the boot time conflict? It would
    be very limiting to be restricted to using only the GPIO pins configured as inputs
    at boot time.


    Figure 8-7 illustrates a simple solution. Resistor R1 is added between the GPIO
    pin and the driving CMOS peripheral. With R1 installed in the interface, the maximum
    current that can flow while the GPIO port is misconfigured (at boot time) is about
    3.3 mA (3.3V divided by resistance of 1k). This keeps the current flow well within
    the maximum limits of both devices.'
