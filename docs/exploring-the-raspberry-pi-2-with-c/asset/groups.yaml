    # The gp Command


    One of the utilities earlier is the gp command. This command displays and controls
    your GPIO pins. To get some help about its usage, use the -h option (help):


    $ gp -h

    Usage: gp [-g gpio] [-options] [-h]


    where:


    - -g gpio Selects the gpio to operate upon

    -i Configure gpio as Input

    - -o Configure gpio as Output

    - -a {0-s} Change to alternate function n

    - -p {n|u} Change pullup to None, Up or Down

    - -s n Set gpio value to 1 or 0 (non-zero=1)

    - -r Read gpio bit

    - -x Read (like -r) but return value as exit status

    - -w Read all 32 bits (-g ignored)

    - -A Read alternate function setting for gpio

    - -b n Blink gpio value for n times (0=forever)

    - -m n Monitor gpio for changes (n seconds)

    - -D Display all gpio configuration

    - -C Display a chart of GPIO vs Alt functions

    - -R n Set gpio pad slew rate limit on (1) or off (0)

    - -H n Set gpio hysteresis enabled (1) or disabled (0)

    - -S n Set gpio drive strength (0=2 mA .. 7=16 mA)

    - -h This info.


    All options are executed in sequence.


    Example:


    ```

    $ gp -g12 -o -s1 -g13 -ir

    ```


    Sets gpio 12 (-g12) to Output (-o), level to 1 (-s1), gpio 13 (-g13) as Input
    (-i) and reads it''s value (-r).


    Note: -R/-H/-S affect groups of gpio: 0-27, 28-45, and 46-53.


    Don''t let the number of options worry you. Many are only used in specialized
    circumstances. reviews the use of these options in bite-sized examples.


    # Displaying GPIO Settings


    A very handy feature is simple to take an inventory of your current GPIO settings.
    To do this, use the -D (display) option:


    ```

    $ gp -D

    ```


    | GPIO | ALTFUN | LEV | HYST | DRIVE | DESCRIPTION |

    |---|---|---|---|---|---|

    | 0 | Input | 1 | Y | 8 mA | Input |

    | 1 | Input | 1 | Y | 8 mA | Input |

    | 2 | Alto | 1 | Y | 8 mA | SDA1 |

    | 3 | Alto | 1 | Y | 8 mA | SCL1 |

