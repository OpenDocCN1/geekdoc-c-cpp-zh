    # CHAPTER 4 INSTALLING A KERNEL


    Here is the general procedure:


    +   1. Change to root (using sudo) to gain permissions.

    2. Check to make /boot has sufficient disk space for the new kernel.

    3. Rename kernel7.img as kernel7.was (in case you want to put it back).

    4. Copy the new kernel into /boot/kernel7.img.

    5. Sync! Make sure disk changes are written to the SD card.


    Once that has been accomplished, you can reboot your new kernel.

    sudo as root and change to the /boot directory (its mounted file system):


    ```

    $ sudo -i

    root@raspy:~# cd /boot

