    ## CHAPTER 8


    ## Physics of the GPIO Interface


    With the popularity of the Raspberry Pi, many students without an electronics
    foundation are exploring the GPIO interface for the first time. This sometimes
    leads to problems and limitations because of missing vital concepts and understanding.


    I believe this can be largely avoided with a little bit of introduction. This
    chapter examines the electronic characteristics of the GPIO pins as inputs and
    outputs (and interfacing CMOS devices generally). I have used LTspice to model
    an equivalent circuit so that the currents and voltages can be visually plotted
    for ease of understanding. This chapter will equip you to avoid some of the pitfalls
    of working with GPIO and CMOS.


    ## CMOS


    The Raspberry Pi GPIO interface is manufactured from CMOS components within the
    chip. Additionally, the CMOS 4000 series logic IC family interfaces to the Pi''s
    GPIO interface, mainly because of its ability to operate on a wide range of voltages,
    including 3.3V.


    For this reason, let''s begin with what CMOS is. CMOS is short for Complementary
    MOS, where Metal Oxide Semiconductor (MOS) transistor comes in n-channel (NMOS)
    and p-channel (PMOS) types in the same way as bipolar transistor and they are
    also referred to as MOSFETs (Field-Effect Transistor). The MOSFET usually has
    three terminals:


    1. Drain

    2. Gate

    3. Source (usually connected to substrate)


    NMOS and PMOS transistors are complements of each other. NMOS transistors have
    their source connected to ground (negative), whereas PMOS transistors connect
    their source to the positive supply. The gate of a MOSFET controls the current
    passing from source to drain. This gate is affected by a voltage level with no
    current (think of it as a capacitor). A bipolar transistor, on the other hand,
    is activated by a small current. It is important to remember that no current flows
    into or out of the gate. The gate inside the MOSFET is a metal oxide over an insulation
    layer; this construction causes the gate to behave as a capacitor between the
    two terminals. Only a very small amount of current flows.


    The behavior of the MOSFET depends on the gate voltage as compared to its source.
    When the gate voltage is positive with respect to the source (for NMOS), the device
    conducts current between its source and drain (turns on). With the gate voltage
    to ground (zero, relative to its source), it turns off. MOSFET device is sensitive
    to gate voltage, except that the polarities are reversed. PMOS acts as complement
    of NMOS device.


    ## MOSFETs in Action


    Figure 8-1 illustrates a circuit modeled in LTspice to simulate the behavior of
    an NMOS transistor and a PMOS transistor beside each other (they are in CMOS configuration).
    V1 supplies the power, which represents the +3.3V supply from the Raspberry Pi.
    The voltage V2 represents a gate (input) signal that will drop from initial supply
    level (+3.3V) down to ground over time and then back up and down. This allows
    us to see the current changes in loads R1 and R2.


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_97_0.png)


    Figure 8-1. Test MOSFET circuit for LTspice


    Running simulation and capturing the gate voltage V2 and the currents in resistors
    R1 (I(R1)) and R2 (I(R2)), we get the simulation output shown in Figure 8-2.


