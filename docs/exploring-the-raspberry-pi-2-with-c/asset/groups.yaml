    \n默认构造函数仅为终端用户初始化对象的内部结构。其实例化示例如下：\n\n```cpp\nDiskstat diskstat; // 磁盘统计对象，准备就绪\n\
    ```\n\n# Diskstat::io\n\n此方法计算发生的磁盘 I/O 量的百分比（0.0 到 100.0）。其调用签名简单为：\n\n```cpp\n\
    double pct_io();\n```\n\n其用法示例所示：\n\n```cpp\nDiskstat diskstat;\ndouble io_pct;\n\
    ```\n\n```cpp\nio_pct = diskstat.pct_io(); // 获取百分比 I/O\n```\n\n没有 Linux 资源指示最大\
    \ I/O 可以是多少。因此，Diskstat 类通过每次调用 `pct_io()` 方法来跟踪 I/O 使用情况。在采样时，如果遇到更多的 I/O 时间（以毫秒提供），对象将其记录为新的最大值。通过这种方式可以计算并返回\
    \ I/O 的百分比。\n\n这种方法显而见的结果是早期的 I/O 读取将偏高，直到观察到更高的最大值。请记住，此功能用于 MTop 显示结果，而不是精确的计数。\n\
    \n# 附录 G\n\n# 其他 librpi2 类\n\n高级用户可能会发现其他 librpi2 类很有用。这些类被 PiSpy 应用直接或间接地使用：\n\
