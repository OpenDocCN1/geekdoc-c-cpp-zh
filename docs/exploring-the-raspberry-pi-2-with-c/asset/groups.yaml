    # APPENDIX E


    # Class Matrix


    This appendix documents the Matrix class as used in the project in Chapter 3.
    This class can be used to drive an LED matrix, as shown in Chapter 3, for example:


    +   - When working with the MAX7219 to display a bar graph in an LED matrix

    - To control a CPU meter using PWM

    - To display a Pi symbol using the matrix


    This class is very simple compared with that for GPIO and MAX7219. What you will
    notice immediately in the sections that follow is the Matrix class inherits from
    the MAX7219 class. By doing so, it supports all the methods provided by the MAX7219
    but adds a few more related to the Matrix operation.


    # Include File


    With the default build and install PREFIX=/usr/local, your installed librpi2 header
    files should be located in /usr/local/include. In your program use:


    ```

    #include <libpi2/matrix.hpp>

    ```


    If necessary, add the compiler option -I/usr/local/include.


    # Linking


    With the default build and install PREFIX=/usr/local, your installed librpi2 library
    should be located here:


    ```

    /usr/local/lib/librpi2.a

    ```


    When linking your program, add the options -L/usr/local/lib -lrpi2 to the link
    step of your make file.'
