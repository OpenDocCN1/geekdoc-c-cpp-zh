  mdcn: "\n\n# 第 6 章 通用时钟\n\n## GPIO 最大输出频率\n\nBroadcom 文档指出：“通用时钟的最大工作频率在 1.2 V 下为\
    \ 125 MHz，但如果 GPIO 引脚负载过重或具有电容负载，该频率将会降低。树莓派的 GPIO 驱动程序无法驱动更高频率的信号，即使内部时钟源具备这种能力。”\n\
    \n## RF 生成\n\npfm[3] 项目利用了 GPCLK0 能够在 FM 广播频范围内生成 RF 信号的事实。但在尝试此实验之前，你应该意识到，没有许可传输任何无线电信号都是非法的。\n\
    \n虽然有很多设备可以向 FM 收音机发射低功率信号，但这些设备都通过了测试和许可程序。全球范围内对无线传输的执行都有规定，后果可能包括没收计算机和无线设备，以及终身禁止持有无线电照。请记住，遵守法律是你的责任。\n\
    \n除此，如果你选择接受风险，还有一些你应该注意的事：\n\n- 从 GPIO 4 输出的信号是方波。这意味着周围会辐射出许多谐波。如果你在 GPIO 4\
    \ 上设置了 100 MHz，那么也会出现 200 MHz 以及更高倍数的信号，但幅度会降低。这些信号可能会对关键业务造成严重干扰。\n\n- 永远不要在\
    \ GPIO 引脚上连接电线作为天线。在非法传输时，增加传输范围是一个糟糕的主意。\n\n- 不连接天线线的其他原因还包括它可能会破坏你的 GPIO 输出驱动器（由于驻波等原因）。\n\
    \n- 最重要的是，不要在没有接地的情况下运行 GPIO！天线容易受到雷暴和其他源静电的影响。如果你这样做，你的 Pi 肯定会遭受损坏。如果没有充分的规划，你也会受到雷击的影响。\n\
    \n如果你遵循一些常识和预防措施，就可以相对安全地进行这个实验。\n\n如果你有一个音响或 FM 收音机，你可以做什么来让天线靠近 Pi 呢？我从 FM 收音机连了一根线到来自\
    \ GPIO 4 的信号，这与 Pi 本身可能发射的其他信号没有区别，但收音机会看到信号增强。\n\n使用时钟源 6 (500 MHz)，我们可以生成一个可以在\
    \ FM 收音机上听到的 100 MHz 信号。使用 `pinck` 命令，选择 GPIO 4 (-g4)，DIVI = 5 (-i5)，mask = 0\
    \ (-m0)；启用 GPIO 输出时钟 (-e1)；选择时钟源 6 (-s6)，并闪烁 (-b)。为了让我看到并听到时钟开启或关闭，我在下面的会话中添加了详细选项\
    \ (-v)：\n\n```\n$ pinck -g4 -i5 -m0 -s6 -b -v\nClock started.\ndriving gpio 4.\n\
    Press Ctrl+C to quit..\nClock off (stopped: -g 4)\nClock on (running: -g 4)\n\
    Clock off (stopped: -g 4)\n```\n\n```\nClock on (running: -g 4)\nClock off (stopped:\
    \ -g 4)\nClock on (running: -g 4)\nClock off (stopped: -g 4)\nQuitting.\nClock\
    \ on (running: -g 4)\nClock off (stopped: -g 4)\n```\n\n在程序运行期间，在你的音响或收音机上向上调或向下调到调频盘上的\
    \ 100 MHz 点。根据你收音机的精度，你可能需要调谐来“找到信号”。你应该听到它每半秒切换到噪声状态一次。按 Ctrl-C 终止命令。\n\nFM 收音机在接收到信号时会安静。收音机的噪声是因为缺少信号。如果你在\
    \ 100 MHz 有一个强电台，请尝试不同的频率。使用本章中的程序计算新的 DIVI（以及可选的 DIVF）值。为了好玩，可以对 mask 和 DIVF\
    \ 值进行实验。某些组合可以在收音机上产生有趣的声音。\n\n## 总结\n\n在本章中，我们探索了树莓派提供的通用时钟 (GPCLOCK)。探索并使用了书中的\
    \ `pinck` 命令来对时钟进行实验。最重要的一是，你学习了选择 DIVI 和 DIVF 参数的方法，以便你能够计算目标频率。我们还探索了将时钟作为 BFO（拍频振器），让你领略了无线电理论。最后，你看到可以在你的\
    \ FM 立体收音机上生成和接收无线电频率。这一切都证明了树莓派的灵活性。\n\n## 参考文献\n\n- [1] \"Silicon Chip Online:\
    \ Vintage Radio\", Silicon Chip Online: Vintage Radio. http://www.walkingital.com/radio/trucchi_suggerimenti/article.html\
    \ Accessed July 16, 2015.\n- [2] \"Frequencies of Musical Notes, A4 = 440 Hz\"\
    , Frequencies of Musical Notes, A4 = 440 Hz. http://www.phy.mtu.edu/suits/notrefeqs.html\
    \ Accessed July 16, 2015.\n- [3] \"Turning the Raspberry Pi into an FM Transmitter\"\
    , Imperial College Robotics Society. http://www.icobotics.co.uk/wiki/index.php/Turning_Raspberry_Pi_Into_an_FM_Transmitter\
    \ Accessed July 16, 2015.\n\n# 第 7 章\n\n## 脉宽调制\n\n树莓派为终端用户提供了两个脉宽调制 (PWM) 外设。PWM\
    \ 外设出意料地复杂，但这种复杂性源于它的灵活性。\n\n为了对 PWM 外设进行实验，书中提供了 `pipwm` 命令。这避免了我们编写程序，并为通用用途提供了工具。\n\
    \n## pipwm 命令\n\n如果你安装了书中提供的软件，`pipwm` 命令应立即可用如下：\n\n```\n$ pipwm -h\nUsage: pipwm\
    \ [-options]\nwhere:\n  -a (a | p) 使用 PWM 算法或 MS (MS 为默认)\n  -i divi    时钟整数分频\
    \ (190)\n  -f divf     时钟分数分频 (0)\n  -m mask    时钟掩码配置 (0)\n  -s src      时钟源\
    \ (1)\n  -g gpio   PWM 引脚 gpio (12)\n  -b         串口模式 (默认 PWM 模式)\n  -c     \
    \    配置并启动 PWM 外设\n  -t secs     运行 PWM 秒数\n  -M m       PWM 比例值 (50)\n  -S s\
