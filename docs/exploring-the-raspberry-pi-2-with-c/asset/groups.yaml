    # CHAPTER 1 INTRODUCTION


    The open source software is important because:


    +   1. It provides you with several utilities: gpi, piclk, pipwm, mtop, and PiSpy.

    2. It includes the piweb C++ web server project.

    3. It provides library libprpi2, which can be used in your own C++ projects.


    If you are using git to display and control the source code use the command


    ```

    $ git clone https://github.com/ve3mwg/raspberry-pi2.git ./pi2

    ```


    The second argument tells git to install the source code into the new pi2 subdirectory.

    G command provides you with a first-class Unix utility to display and control
    the GPIO resources. This utility also includes some useful options to blink a
    GPIO pin, which is great for checking wiring to LEDs. Another option allows you
    to monitor an input to the terminal session, so you can check input wiring and
    so on.


    The pi1ck utility allows you to display and control the general clock (and PWM
    clock). The pi1ck and PiSpy are also used together for some projects.

    Pipwm allows you to display and control the PWM peripherals. The pipwm command
    and the PiSpy utility are also used to allow you to control the PWM peripherals.

    PiSpy gives you a GPIO logic analyzer. Using a Linux driver for DMA and the PiSpy
    user GPIO data can be captured at 2 MHz or less. This utility automatically assigns
    and releases the DMA resources it needs for ease of use and system integrity.


    If you choose to use the Matrix in Chapter 3, you will be able to visualize the
    system utilization in real time using the provided mtop command.

    Because Raspberry Pi 2 has four CPU cores, the piweb project demonstrates a high-performance
    C++ web server using. This server will pull all four CPU cores to work with sufficient
    web traffic. Yet, due to its C++ design, it is simple to program and enhance to
    meet your own needs.


    # Software Installation


    After downloading your source and unpacking it to a directory (directory ~/pi2
    is suggested), then the process of building and installing can be started. In
    these directions, I assume that the software directory is in subdirectory ~/pi2.


    +   1. Quickly check Chapter 11 to see if you need to download a new GNU compiler.
    It is my hope that for C++11 will already be included by the time you read this.
    If not, it is a simple matter to download and install a newer GNU compiler that
    does C++11 support.

    2. $ sudo apt-get install make

    3. $ sudo apt-get install libevent-dev (needed for the piweb project)

    4. $ sudo apt-get install cmake (needed for the PiSpy utility)

    5. $ sudo apt-get install help (recommended)

    6. $ cd ~/pi2

    7. Optional: When rebuilding: $ make clob

    8. $ make

    9. $ sudo make install


    3'
  - '[PAGE 20]


    This procedure takes care of all software except for the PiSpy utility. PiSpy
    requires the use of a Linux kernel loadable module. For this reason, the install
    of PiSpy has a separate procedure:


    +   1. See Chapter 4 before building PiSpy.

    2. Optional: If rebuilding PiSpy, do: $ make pispy_clobber

    3. $ make pispy

    4. $ sudo make pispy_install


    # # Installation Notes


    By default, the top-level Makefile uses the default install PREFIX=/usr/local.
    This causes the librpi2 to include files to be installed in //usr/local/include/librppi2.
    The library is installed in /usr/local/lib/librppi2.a. The utilities such as gp
    and pipwm will be installed in /usr/local/bin.


    If you need to change this, export PREFIX before performing the make and install
    steps. For example, if you want the software installed in /opt/local instead,
    you can use $ export PREFIX=/opt/local.

    Don''t forget to do the same, when you need to use sudo:


    ```

    $ sudo -i

    # export PREFIX=/opt/local

    # make install

    ```


    # # Thank You


    Thank you for buying this book and allowing me to guide you on your exploration.
    This book and its software will provide many hours of fun on your Raspberry Pi
    2.'
