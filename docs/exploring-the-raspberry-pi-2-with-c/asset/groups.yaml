  mdcn: "\n\n## 第 11 章 C++ 快速入门\n\n迭代器，`cbegin()` 和 `cend()` 方法。为了避免编译错误，请确保在声明引用时也应用了\
    \ `const`（例如这里的 `client`）。在这里使用 `auto` 隐藏了实际发生的情况，但 `cbegin()` 方法返回的是这种类型：\n\n\
    `std::unordered_map<int, std::client>::const_iterator`\n\n如果 `client` 没有用 `const`\
    \ 关键字声明，编译器将把该语句标记为错误（否则它会提示你可以修改它所引用的 map 条目）。如果循环中的任何任何部分尝试修改 map 条目，无论是通过引用\
    \ `client` 还是通过 `iterator->second` 引用，现在都会被编译器标记。通过这种方式，你安全地防止了 map 发生意外之外的\n\n\
    ## 容器的容器 (Containers of Containers)\n\n虽然简单的 `map` 已经很强大，但有时你需要一个更复杂的 `map`。例如，假设你有一个数字\
    \ IC 的内存中数据库。对于 CD 系列，你可能拥有一组类似于表 11-1 中的值开始的数据集合。\n\n表 11-1 数据集合中的值\n| 部件号 |\
    \ 描述 |\n| :--- | :--- |\n| 4000 | 双 3 输入 NOR 门 + 1 个 NOT 门 |\n| 4001 | 四路 2 输入\
    \ NOR 门 |\n| 4002 | 双 4 输入 NOR 门 |\n| 4006 | 18 级移位寄存器 |\n| 4007 | 双互补对 + 1 个\
    \ NOT 门 |\n| 4008 | 4 位二进制全加法器 |\n| 4009 | 六路反相缓冲器（被 4049 替换） |\n| 4010 | 六路非反相缓冲器（被\
    \ 4050 替换） |\n\n一个简单的（有序）`map` 可以使用以下声明：\n\n```cpp\nstd::map<std::string,std::string>\
    \ ic_map;\n```\n\n但现在你想向 map 中添加 7400 系列的部件，如表 11-2 所示。\n\n表 11-2 需要添加的额外值\n|\
    \ 部件号 | 描述 | 数据表 |\n| :--- | :--- | :--- |\n| 7400 | 四路 2 输入 NAND 门 | HC/HCT |\n\
    | 7401 | 开漏极输出的四路 2 输入 NAND 门 | |\n| 7402 | 四路 2 输入 NOR 门 | HC/HCT |\n| 7403 |\
    \ 开漏极输出的四路 2 输入 NAND 门 | |\n\n这些有原始系列 (74XX)，以及 \"HC\" 和 \"HCT\"本例）。CMOS 系列可以归类为\
    \ \"CD\"，我们如何安排 map 以按系列隔离这些部件？我们可以使用 `std::map` 作为 map 的类型：\n\n```cpp\nstd::map<std::string,\
    \ std::map<std::string,std::string>> ic_map;\n```\n\n> **警告** 有一个你需要注意的细微问题。在这个声明中，空格非常重要，以避免干扰编译器。考虑没有额外空格的相同声明：\n\
    \n```cpp\nstd::map<std::string,std::map<std::string,std::string>> ic_map;\n```\n\
    \n在这个声明中，除了 `ic_map` 标记之前的 `>>` 运算符外，一切正常。某些编译器会在这里卡住，而另一些则可以处理。最好的办法是使用空格来解决这个问题。\n\
    \n第一个模板参数将访问设备系列。用于系列的键如下：\n\n- \"CD\" 用于 4000 系列\n- \"74XX\" 用于原始的 7400 系列\n\
    - \"HC\" 用于 74HCXX 系列\n- \"HCT\" 用于 74HCTXX 系列\n\n第二个模板参数将是值的类型，在这种情况下是另一个 `map`。这个内部\
    \ `map` 将根据设备类型组织，并将描述作为值。让我们来看一个示例（目前，只需接受 C 字符串常量可以在许多预期 `std::string` 的地方使用的事实即可）。\n\
    \n要向这个多级 map 插入数据，简单的方法是如下：\n\n```cpp\nic_map[\"CD\"][\"4010\"] = \"六路非反相缓冲器（被\
    \ 4050 替换）\";\n```\n\n第一个下标操作如果键值 \"CD\" 不存在，则会自动创建内部 `map`。如果它存在，则引用其条目并可以订阅（允许我们向现有的\
    \ map 添加内容）。此操作可以拆分为两个步骤：\n\n```cpp\nstd::map<std::string,std::string&> inner_map\
    \ = ic_map[\"CD\"];\n```\n\n这个 `inner_map` 引用可以访问部件条目：\n\n```cpp\ninner_map[\"\
    4010\"] = \"六路非反相缓冲器（被 4050 替换）\";\n```\n\n有时，最好像显示那样拆分这些操作。使用中间引用允许你避免对分类进行必要的重复循环。让我们修改示例数据库，使值变为一个\
    \ `struct`：\n\n```cpp\nstruct s_part_info {\n    std::string desc;\n    bool obsolete;\n\
    };\n```\n\n## 第 11 章 C++ 快速入门\n\n```cpp\nstd::map<std::string, std::map<std::string,s_part_info>\
    \ > ic_map;\nstd::map<std::string,s_part_info>& series = ic_map[\"CD\"];\n\ns_part_info&\
    \ part = series[\"4010\"];\npart.desc = \"六路非反相缓冲器（被 4050 替换）\";\npart.obsolete\
    \ = true;\n\nic_map[\"CD\"][\"4010\"] = {\"非反相缓冲器（被 4050 替换）\", false};\n```\n\
    \n"
