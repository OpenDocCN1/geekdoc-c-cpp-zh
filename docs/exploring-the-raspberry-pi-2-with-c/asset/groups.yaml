    # Summary


    In this chapter you''ve seen the gp command put through all of its use cases.
    This command saves valuable time as you try things. The blink and monitor functions
    are very helpful in troubleshooting. The gp command further provides a convenient
    way to manage GPIO from a shell script.


    If you read the section on command line option conventions, you also learned how
    to abbreviate sequences and indicate where options end (when required). This will
    not only help you with the newly installed commands, but serve you with Linux
    (Unix) commands generally.


    # Bibliography


    +   [1] "Schmitt trigger," Wikipedia, the free encyclopedia. http://en.wikipedia.org/wiki/Schmitt_trigger.'
