    # Data Modes


    In the examples that we looked at, we generated steady PWM signals according to
    values of M and S. It also possible to send data rather than fixed values, which
    is the Serial aspect of the peripheral is all about. Data can be written directly
    or it be queued to a FIFO. It must be noted, however, that the FIFO is shared
    between a pair of PWM peripherals. This makes it possible to generate stereo audio
    by interleaving the data left and right channels.


    Although said is an obvious option, other signal applications are possible. For
    example, if you want to send a single Manchester signal to a small microcontroller
    (MCU) like an AVR device, you could divide a PWM signal for data. This might be
    useful for one-way (half-duplex) communication where you want to save the MCU
    serial Universal Asynchronous Receiver Transmitter (UART) peripheral for other
    purposes.


