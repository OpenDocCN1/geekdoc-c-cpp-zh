    # CHAPTER 4


    # Installing a Kernel


    To install and use the pispy logic analyzer tool, we must first build and install
    a kernel loadable module. This rpidma module provides safe and automatic access
    to the Pi’s DMA peripheral and its interrupts for the pisipy tool.


    Ideally, you would "just" compile the module itself and install it. However, kernel
    loadable modules depend on various parts of the entire kernel source tree. Furthermore,
    kernel loadable modules must the kernel release that is running. You used to be
    short-circuit this with the use of the modprobe -f option, but this no longer
    works (it silently fails). This brings us back to building and installing a new
    kernel.


    The good news is that the Raspberry Pi 2 can build a kernel without cross-compiling
    in about 2 hours. This greatly simplifies the overall procedure. This chapter
    outlines every step of the way to make it painless and save you time.


    # Overall Procedure


    The overall steps involved in building and installing a new kernel are listed
    here.


    +   1. Download the kernel source code.

    2. Check out the branch (see the section “Specific Kernel Releases”).

    3. Prepare and build the configuration.

    4. Compile the kernel.

    5. Compile and install the modules.

    6. Install the new kernel.

    7. Reboot.


    The list looks somewhat daunting, but the steps are simple enough to follow. Once
    you''ve got your Raspberry Pi up and running on the new kernel that you built,
    there are a few remaining steps to install pispy:


    +   1. Build the rpidma kernel module.

    2. Install the rpidma module.

    3. Reboot to test autoloading of rpidma.


    Once the rpidma loadable module is installed, you''ll be able to capture GPIO
    signals at your convenience using pispy. Each time you boot, the rpidma module
    will be loaded automatically so you won’t have to think about it.'
