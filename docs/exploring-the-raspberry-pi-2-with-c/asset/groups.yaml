    \ altfun;\n\nrc = gpio::alt_function(19,altfun);\nassert(rc); // 检查是否成功\nif (\
    \ altfun == GPIO::Input ) {\n    // 引脚被配置为输入\n```\n\n## GPIO::get_drive_strength\n\
    \n此方法允许程序员获取三个感兴趣的 GPIO 引脚信息：\n\n- 1. 表示斜率限制（slew limit）开启的布尔值\n- 2. 表示迟滞（hysteresis）开启的布尔值\n\
    - 3. 所指定引脚所属 GPIO 引脚组的驱动强度（范围 0 到 7）。\n\n该方法返回错误指示器，同时通过引用参数传回感兴趣的值：\n\n```cpp\n\
    int GPIO::get_drive_strength(\nint gpio,\nbool& slew_limited,\nbool& hysteresis,\n\
