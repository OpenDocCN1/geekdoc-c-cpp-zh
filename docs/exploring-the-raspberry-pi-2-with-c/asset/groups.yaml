    ## 第 1 章


    ### 引言


    树莓派 2 的引入开启了令人兴奋的新机遇。软件不再局限于单个 CPU 核心，而是可以在多个核心上执行。内存翻倍到 1 GB，提供了更大的磁盘缓存，并导致了更出
    SD 卡性能。这还为运行更大的应用程序留出了空间。四个内置 USB 端口也有助于避免对 USB 集线器的需求。


    底层某些事情发生了变化，例如用于外设的物理地址 BCM2708_PERI_BASE 从 0x20000000 变为 0xF3F0000 用于树莓派 2。这意味着为早期树莓派编写许多软件将无法工作。由于设备树（DT）的支持，在
    Linux 中自动检测它现在变得简单。因此，包含了 libgpi2 类。


    本书的主要目的是利用树莓派 2。为了实现这一目标，书中使得外设访问 GPIO 变得更加容易。只需几行代码，命令行工具就能让你列出 GPIO 状态并进行更改。C++
    库将使得访问 GPIO 和其他外设成为可能。


    我认为读者应该使用一种不需要额外硬件的软件逻辑分析仪。为此，本书提供了一个基于软件的逻辑分析仪来查看所有 GPIO 输入输出并将事件记录到文件中。


    本书选择 C++ 编程语言是为了让你的生活更简单。程序员不需要担心这一点，因为我保留了基础元素。过去十年中，标准化努力对 g++ 和 libc 产生了非常积极的影响。而标准模板库（STL）的可用性为
    glibc 编程提供了一个非常高效的环境。


    我使用了混合方法来处理 C++ 代码，继续使用熟悉的 I/O（stdio）例程，如 printf，使得代码易于阅读和理解。我知道 C++ 人士会认为这本书是实用书籍而非计算机科学教材。特别感兴趣的是包含的工具和库
    libgpi2。


    ### 概述


    第 2 章介绍了一个简单的树莓派 2 构建项目。使用一小块板，你可以将你的树莓派 2 挂载在面包板上。这种组织方式非常有帮助。


    ## 第 1 章 引言


    第 3 章介绍了一个“矩阵”构建项目。它使用 LED 矩阵产生一个可以提供每个核心实时利用率显示。它还显示了内存和 I/O 利用率。如果你不想构建这个项目，第
    4 章和第 9 章涵盖了逻辑分析仪，它不需要额外硬件。PiSpy 逻辑分析仪能够查看所有 GPIO 输入输出并将事件记录到文件中。


    第 2 章介绍了一个简单的树莓派 2 构建项目。使用一小块板，你可以将你的树莓派 2 挂载在面包板上。这种组织方式非常有帮助。


    第 3 章介绍了一个“矩阵”构建项目。它使用 LED 矩阵产生一个可以提供每个核心实时利用率显示。它还显示了内存和 I/O 利用率。如果你不想构建这个项目，第
    4 章和第 9 章涵盖了逻辑分析仪，它不需要额外硬件。PiSpy 逻辑分析仪能够查看所有 GPIO 输入输出并将事件记录到文件中。


    第 5 章专门介绍 GPIO 命令。通过提供的支持，为各种类方法提供了易于遵循的文档和示例。


    第 6 章引入了 pwm 工具，它可以显示或更改通用时钟（或 PWM）。


    第 7 章通过检查脉宽调制（PWM）外设扩展了时钟。结合 PiSpy 探索了 pwm 工具及其选项。PiSpy 展示了不同设置的影响。


    第 8 章查看 GPIO 是什么以及其制成的互补金属氧化物（CMOS）技术。电子学生会发现关于什么是 CMOS 以及如何避免接口陷阱的解释很有帮助。此外，解释了
    CMOS 输入并简要说明静态保护方案。


    第 9 章详细介绍了 PiSpy 逻辑分析仪，并描述了其应用的各种功能。


    第 10 章查看 GPIO 输入，特别关注开关和按钮输入的去抖问题。


    第 11 章是一个侧重于软件的章节。它提供了一种非常简单且实用的使用 C++ 和 STL 的方法。STL 为程序员在编程时间和可靠性方面提供了巨大收益。在本章中，我们查看了最流行的容器，并在处提供了示例代码片段。


    第 12 章是多线程软件，用于在高效的服务器中利用所有 CPU 核心。服务器在后台基于 libevent 库，但使用了 C++ 类来提供非常简单的接口。这允许你用极少的主线代码构建和自定义自己的
    Web 服务器。提供的 web 项目可以用于和扩展。


    附录 A 到 C 文档了用于编程 GPIO 的 libpi2 C++ 类。通过提供的支持，为各种类方法提供了易于遵循的文档和示例。


    附录 D 和 E 描述了一些其他对处理矩阵或七段显示器的人有用的 C++ 类。附录 F 描述了与 mqtt 工具测量的系统性能指标相关的类。


    附录 G 提供了关于 libpi2 中剩余一些高级类的额外信息。


