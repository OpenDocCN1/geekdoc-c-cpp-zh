    - 1. M/S 和 PWM 模式

    - 2. 串口或 PWM 数据


    让我们仔细观察一下。


    ## M/S 和 PWM 数据模式


    在 M/S 模式下，信号由标记（mark）和空间（space）周期组成。标记 (1) 信号以长度 M 发送，空间 (0) 信号以长度 S-M 发送（S 是整个周期的长度）。图
