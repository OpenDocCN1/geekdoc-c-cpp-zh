    ## CHAPTER 1 INTRODUCTION


    The open source software is important because:


    - 1. It provides you with several utilities: gpi, pigpi, pipwm, mtop, and PiSpy.

    - 2. It includes the piweb C++ web server project.

    - 3. It provides library libprpi2, which can be used in your own C++ projects.


    If you are using git to display and control the source code use the command


    ```

    $ git clone https://github.com/ve3mwg/raspberry-pi2.git ./pi2

    ```


    The second argument tells git to install the source code into the new pi2 subdirectory.

    Gpio command provides you with a first-class Unix utility to display and control
    the GPIO resources. This utility also includes some useful options to blink a
    GPIO pin, which is great for checking wiring to LEDs. Another option allows you
    to monitor an input to the terminal session, so you can check input wiring and
    so on.


    The pigpi utility allows you to display and control the general clock (and PWM
    clock). The pigpi and PiSpy are also used together for some projects.

    Pipwm allows you to display and control the PWM peripherals. The pipwm command
    and the PiSpy utility are also used to allow you to control the PWM peripherals.

    PiSpy gives you a GPIO logic analyzer. Using a Linux driver for DMA and the PiSpy
    user GPIO data can be captured at 2 MHz or less. This utility automatically assigns
    and releases the DMA resources it needs for ease of use and system integrity.


    If you choose to use the Matrix in Chapter 3, you will be able to visualize the
    system utilization in real time using the provided mtop command.

    Because Raspberry Pi 2 has four CPU cores, the piweb project demonstrates a high-performance
    C++ web server using them. This server will pull all four CPU cores to work with
    sufficient web traffic. Yet, due to its C++ design, it is simple to program and
    enhance to meet your own needs.


    ## Software Installation


    After downloading your source and unpacking it to a directory (directory ~/pi2
    is suggested), then the process of building and installing can be started. In
    these directions, I assume that the software directory is in subdirectory ~/pi2.


    - 1. Quickly check Chapter 11 to see if you need to download a new GNU compiler.
    It is my hope that for C++11 will already be included by the time you read this.
    If not, it is a simple matter to download and install a newer GNU compiler that
    does C++11 support.

    - 2. $ sudo apt-get install make

    - 3. $ sudo apt-get install libevent-dev (needed for the piweb project)

    - 4. $ sudo apt-get install cmake (needed for the PiSpy utility)

    - 5. $ sudo apt-get install help (recommended)

    - 6. $ cd ~/pi2

    - 7. Optional: When rebuilding: $ make clobber

    - 8. $ make

    - 9. $ sudo make install


    This procedure takes care of all software except for the PiSpy utility. PiSpy
    requires the use of a Linux kernel loadable module. For this reason, the install
    of PiSpy has a separate procedure:


    - 1. See Chapter 4 before building PiSpy.

    - 2. Optional: If rebuilding PiSpy, do: $ make pispy_clobber

    - 3. $ make pispy

    - 4. $ sudo make pispy_install


    ## Installation Notes


    By default, the top-level Makefile uses the default install PREFIX=/usr/local.
    This causes the librpi2 to include files to be installed in /usr/local/include/librpi2.
    The library is installed in /usr/local/lib/librpi2.a. The utilities such as gpio
    and pipwm will be installed in /usr/local/bin.


    If you need to change this, export PREFIX before performing the make and install
    steps. For example, if you want the software installed in /opt/local instead,
    you can use $ export PREFIX=/opt/local.

    Don''t forget to do the same, when you need to use sudo:


    ```

    $ sudo -i

    # export PREFIX=/opt/local

    # make install

    ```


    ## Thank You


    Thank you for buying this book and allowing me to guide you on your exploration.
    This book and its software will provide many hours of fun on your Raspberry Pi
    2.


    ## CHAPTER 2


    ## Workstation


    After a very brief introduction to the Raspberry Pi 2, we''ll take a look at a
    homemade version of an experimenter''s workstation. This information is intended
    to inspire rather than serve as instructions to be followed. Keep in mind that
    your Pi need not remain attached to the workstation forever. If you need it for
    a permanent project, it can be safely removed and “repurposed.”


    ## The Raspberry Pi 2 Arrives


    My RaspberryPi 2 arrived from element14.com in a cute little box, labeled “Raspberry
    Pi 2 Model B 1GB.” I was looking forward to it mainly because the quad-core CPU
    and the doubled memory capacity meant a significant upgrade. Seeing confirmation
    of these two things on the box immediately told me that the item was shipped.


    There was some difficulty ordering this because most suppliers ship only by courier.
    In Canada, for example, couriers charge an extra fee when something is delivered.
    They call it a “customs brokerage fee.” Fortunately, I was able to mine it from
    adafruit.com, where they allowed me to have it shipped by the U.S. Postal Service.


    The box it came in and the booklet (see Figure 2-1) really don’t provide any practical
    value, other than giving you that warm and fuzzy feeling that you got a quality
    product for your money. The best part really is that you received four CPU cores
    and double the memory for same Raspberry Pi price. Kudos to the Raspberry Pi folks
    for that.


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_21_0.png)


    Figure 2-1. The Raspberry Pi 2 booklet and box


    With the Raspberry Pi in hand, the question “What''s next?” comes immediately
    to mind. I have personally found that prototyping and experimentation go best
    when things are well organized. Having loose wires and pcbs slipping over the
    workbench is a good way to invite short circuits, crashed operating systems, and
    corrupted files. By contrast, a clean workbench and an organized workstation make
    experimentation much more fun.


    ## The Raspberry Pi 2 pcb


    Figure 2-2 shows a top view of the Raspberry Pi 2 pcb. First we have the new and
    improved 2x20 header strip for the GPIO header, which originated with the Raspberry
    Pi B+. Going clockwise around the board, we see the following:


    - Two pairs of USB ports at the upper right side.

    - The Ethernet port at the bottom left.

    - The Audio/Video connector J7 at the bottom.

    - The Camera connector J3.

    - HDMI output left of J3.

    - The mini USB power input at the lower left (marked “PWR IN”).

    - The display connector J4 at the left (marked “DISPLAY”).


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_22_0.png)


    **Figure 2-2.** The top view of the Raspberry Pi 2


    The other important improvement that I like is the orderly placement of the mounting
    holes. The square arrangement of these holes makes for easier and stable mounting
    of the pcb.


    Figure 2-3 shows the bottom side of the Raspberry Pi 2. The most noteworthy aspect
    of this photo is the strategic placement of the MicroSD card slot (shown at right).
    It feels like it is in the correct place (under J4) and the card holder makes
    it easier to use without fear of breakage. The card slot is still small and delicate
    so some care handling the MicroSD card is still advised.


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_23_0.png)


    **Figure 2-3.** Bottom side of the Raspberry Pi 2


    One other improvement that is worth mentioning is that the power connector has
    no nearby capacitor to leverage your thumb. There were reported cases of breaking
    off.


    ## Constructing the Workstation


    In this section, I describe how I built my own workstation. You need not do it
    the same way, because I know that Raspberry Pi folks are very self-expressive!
    For simple projects, I find that a chunk of wood works great (see Figure 2-4).
    Wood is an insulator, making it safe to attach things to it without concerned
    with grounding or short circuits. You can stain and finish it for visual appeal
    (I used a sealing stain for mine).


    ## CHAPTER 2 WORKstation


    ![](img/...fb_24_0.png)


    **Figure 2-4.** A stained piece of 3/4 inch pine


    I chose a piece of pine 3.5 inches wide and cut it to 10 inches in length (more
    about length later). The wood was 3/4 inch thick. I don''t recommend a thinner
    piece because that makes it harder to screw things into it without the screws
    coming out at the bottom. You don''t want to scratch the dining room table if
    that is where you work!


    Once your piece of wood is prepared, job one is to mount the Raspberry Pi 2 on
    it. This time we have four nicely placed holes in the pcb for this purpose. To
    mount the pcb, you''ll need some insulating spacers (don''t mount without spacers,
    as bending the pcb is likely to damage it). Finding suitable spacers is often
    a challenge. I stumbled on the idea of using discarded pens one day, which seems
    to work rather well. Figure 2-5 shows an example of a discarded pen that I used
    for this project.


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_24_1.png)


    **Figure 2-5.** A discarded pen used as a spacer

