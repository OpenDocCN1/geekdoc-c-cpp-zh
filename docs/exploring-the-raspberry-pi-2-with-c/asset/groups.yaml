    ## GPIO::start_clock


    start_clock() 类方法提供了一种便捷的方法来启动通用（General Purpose）或 PWM 时钟。否则，这是一个繁琐的过程，这在库模块 `gpio.cpp`
    中该方法的实现中得到了证明。你可以避免所有的麻烦，转而调用此方法：


    ```

    int start_clock(

    int gpio,

    Source src,

    unsigned divi,

    unsigned divf,

    unsigned mask,

    bool on_gpio=true

    );

    ```


    参数 `gpio` 选择外设的方式与 `config_clock()` 方法相同。参数 `src`、`divi`、`divf` 和 `mask` 决定了如何设置时钟外设。再次参考
    `config_clock()` 以获取正确的输入值。参数 `mask` 在未提供时默认为零。参数 `on_gpio` 默认`true`，这意味着相关的 gpio
    引脚被配置为输出。这种设计是为了为给定的 gpio 选择正确的复用功能，以便从外部看到时钟信号。如果你计划自己处理（使用附录 A 中文档说明的方法之一），请提供
    `false`。


    需要注意的是，此方法会在等待时钟成功启动时阻塞一段时间。以下示例展示了通用时钟的启动：


    GPIO gpio;


    ...

    int rc;


    ```

    rc = gpio.start_clock( // 启动通用时钟

    4,

    GPIO::Oscillator, // 19.2 MHz 源

    5, // divi

    0, // divf

    0, // mask

    true // 在 GPIO 4 上启用时钟

    );

    ```


    ```

    assert(!rc);

    ```


    ## GPIO::stop_clock


    当你需要停止时钟外设时，使用 `stop_clock()` 方法。


    ```

    int rc = gpio.stop_clock(int gpio);

    ```


    时钟外设通过 gpio 数字选择（请查看 `config_clock()` 方法中的数值表）。如果成功，`stop_clock()` 返回零，否则返回系统错误代码。


    请注意，程序在返回调用者之前会等待状态成功改变，可能会存在延迟。


    以下是停止通用时钟的示例：


    ```cpp

    GPIO gpio;

    ...

    int rc;


    rc = gpio.stop_clock(gpio);

    assert(!rc);

    ```


    ## GPIO::pwm_configure


    `pwm_configure()` 处理了启动所选 PWM 外设所需的若干步骤。启动该外设的过程非常复杂。这里有两个可用的 PWM 外设：


    - 1. PWM0

    - 2. PWM1


    这两者共享同一个时钟（此时钟与通用时钟不同）。此方法执行以下通用步骤：


    - 1. 禁用 DMA（如果之前使用过）

    - 2. 禁用 PWM 外设

    - 3. 执行短延迟

    - 4. 清除外设错误标志

    - 5. 配置 PWM 参数

    - 6. 清空 FIFO

    - 7. 执行另一个 10 µs 的延迟


    在调用此方法之前，预计你已经通过 `start_clock()` 配置了 PWM 时钟，除非已经完成了此操作。调用签名如下：


    ```

    int pwm_configure(

    int gpio,

    PwmMode mode,

    bool repeat,

    int state,

    bool invert,

    bool fifo,

    PwmAlgo algorithm

    );

    ```


    函数成功时返回值为零，否则返回非零系统错误代码。

    使用的 PWM 外设通过输入 `gpio` 选择。有效的 gpio 引脚见表 B-3。


    ## 表 B-3. GPIO 引脚及其外设


    | GPIO | 外设 |

    |---|---|

    | 12 | PWM 0 时钟 |

    | 18 | PWM 0 时钟 |

    | 13 | PWM 1 时钟 |

    | 19 | PWM 1 时钟 |


    还假设你已经自己设置了 gpio 引脚的正确配置，或者已将其作为 `start_clock()` 的一部分。

    `PwmMode mode` 输入可以取表 B-4 所示的任意值（更多信息请见第 7 章）。


    ### 表 B-4. PwmMode 及其值


    | GPIO::PwmMode | 说明 |

    |---|---|

    | GPIO::StartAddress | 序列化 PWM 数据 |

    | GPIO::Pwm_Mode | 生成 PWM 信号 |


    布尔输入参数 `repeat` 应用于使用 FIFO 输入数据时，取决于 FIFO 是否应该变为空。使用值 `true` 重复最后写入的值。`state`
    表示你所需的信号的起始状态。这应该是 0（低电）或 1（高电）。

    如果你希望输出信号反反，布尔输入参数 `invert` 应为 `true`。正常使用时请提供 `false`。

    布尔参数 `fifo` 为 `true` 时，表示你将从 FIFO 队列提供值。为 `false` 时，不使用 FIFO。

    最后一个输入参数 `algorithm` 指明使用哪种 PWM 输出算法。这些总结在表 B-5 中。


    ## 表 B-5. 输入算法


    | GPIO::PwmAlgo | 说明 |

    |---|---|

    | GPIO::PwmAlgorithm | 使用脉冲平均为 PWM 电平 |

    | GPIO::MSAlgorithm | 使用 Mark/Space 信号生成 |


    以下是一个示例：


    ```cpp

    GPIO gpio;

    int rc;

    ...

    ```


