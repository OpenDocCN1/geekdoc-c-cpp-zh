    # 第 3 章 矩阵（CPU 占用率）


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_39_0.png)


    **图 3-5。** $R_{set}$ 在矩阵 PCB 上的位置 (R1 = 10K)


    我购买的单元使用的 $R_{set}$（PCB 上的 $R_n$）值为 10K（见图 3-5 中的白色箭头）。拆除的 LED 矩阵零件号为 108AS。查阅该数据表可获得以下信息（这些参数随制造商而异）：


    - 正向电流（电压）：2.1V 至 2.5V

    - 正向电流：20 mA（其他数据表将其列为绝对最大值）


    MAX7219 芯片在 70°C 时的功率限制约为 1066 mW。通过数据表和 LED 参数，我计算出这块 PCB 在最大亮度下是安全的，不会超过绝对限制（这是给读者的一个很好的数据表练习）。


    查阅 MAX7219 数据表，你可能注意到 10K 的 $R_{set}$ 值设计用于在最大亮度下提供 40 mA（我们的 LED 限制为 20 mA）。然而，如果占空比不是
    100%（连续），这就是安全的。当扫描八行 LED 时，某一行 LED 仅消耗 1/8 的功率。事实上，有一份数据表提到“正向电流为 100 mA [1]”。


    与此联系，软件可以配置 MAX7219 IC 显示少于八个显示（通电时默认为一个）。如果你的软件有意或无意地执行这样做，请尽快纠正这种状况（移除矩阵 PCB
    的 +5V）。由于显示的行数较少，每行 LED 的占空比为 1/8（即 12.5%），但可能是 100 分之一 1！软件可能会损坏硬件。


    # MAX7219 命令


    MAX7219 使用串行接口与微处理器建立接口。我们已经简要查看了 CLK、DIN 和 LOAD 这三个输入信号。CLK 信号不需要固定的时钟周期，因此我们可以说使用
    GPIO 信号向 IC “位扫带（bit-bang）”所有信号。我们只需要确保某些事件发生得不过快。


    设备的输入是一个 16 位字，其中最高位 (MSB) 首先移入。命令字的通用格式如表 3-1 所示。


    **表 3-1。MAX7219 命令字格式**


    | D15 | D14 | D13 | D12 | D11 | D10 | D9 | D8 | D7 | D6 | D5 | D4 | D3 | D2 |
    D1 | D0 |

    |---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|

    | X | X | X | X | 地址/命令 | 数据 | | | | | | | | | | | |


    D15 是字的最高位，D0 是最低位 (LSB)。高位 D15 ... D12 被设备忽略（“不 care乎”用“X”表示），但在向设备移位数据时必须提供。位
    D11 ... D8 指定行（或数字）的*地址*，否则指定显示命令的“指令”代码。可用数据在字的低八位中提供。


    # 显示数据命令


    当地址字段提供 1 到 8 的值（0b0001 到 0b1000）时，数据字段中的相关位驱动 LED（以两种模式之一进行）。见表 3-2。


    **表 3-2。MAX7219 显示数字命令**


    | D15 | D14 | D13 | D12 | D11 | D10 | D9 | D8 | D7 | D6 | D5 | D4 | D3 | D2 |
    D1 | D0 |

    |---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|

    | X | X | X | 0b0001 到 0b1000 | 显示数据 | | | | | | | | | | | |


    位 D7 ... D0 中包含的数据被解释为*数字*配置。每个数字可以在二进制编码十码 (BCD) 模式下运行，或者简单地作为单独位驱动器。在 BCD 模式下，仅使用低位
    D3 ... D0，并根据字体映射映射到七段显示器代码。


    在不在 BCD 模式下运行时，D7 ... D0 中的每个 1 位都会导致相应的驱动器开启。这是我们在矩阵上将使用的模式。


    # 解码模式命令


    表 3-3 所示的解码模式控制每个数字（LED 行）的配置。D7 ... D0 中的每个位都控制数字 7 到 0 的配置。当对应位持有 1 位时，该数字将生效
    BCD 模式。0 位指定不进行任何显示映射。每个位 D7 ... D0 将按原样显示。


    **表 3-3。MAX7219 解码模式命令**


    | D15 | D14 | D13 | D12 | D11 | D10 | D9 | D8 | D7 | D6 | D5 | D4 | D3 | D2 |
    D1 | D0 |

    |---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|

    | X | X | X | 0b1001 (0x09) | 解码模式 | | | | | | | | | |


    在我们的项目中，我们将位设置为零以便发生 BCD 映射。


    # 亮度命令


    MAX7219 可以在软件控制下调整显示亮度。表 3-4 说明了亮度设置的格式，它影响整个显示。亮度值可以是 0（最小亮度 0b0000）到 15（全亮度
    0b1111）。如果你计划显示一到三个数字（行），请使用此命令将亮度降低到低值。


    | D15 | D14 | D13 | D12 | D11 | D10 | D9 | D8 | D7 | D6 | D5 | D4 | D3 | D2 |
    D1 | D0 |

    |---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|

    | X | X | X | X | 0b1010 (0xA) | | X | X | | 亮度 | | |


    # 扫描限制命令


    设备显示的数字（行）通过表 3-5 所示的扫描限制命令配置。0 到 7 的值指定显示数字的数量分别为一到八。在你的项目中，我们将显示所有行，因此使用 0b111
    (7)。如果你选择较少的数字（例如一到三个数字），你想大幅降低亮度以避免超过设备限制。数字越少，意味着每个数字或行的占空比越高。


    **表 3-5。MAX7219 扫描限制命令**


    | D15 | D14 | D13 | D12 | D11 | D10 | D9 | D8 | D7 | D6 | D5 | D4 | D3 | D2 |
    D1 | D0 |

    |---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|

    | X | X | X | X | 0b111 (7) | | | | | | | |


    # 关机命令


    MAX7219 可以在软件控制下调整显示亮度。表 3-4 说明了亮度设置的格式，它影响整个显示。（等等，见下方修正）。表 3-3 所示的解码模式控制每个数字（LED
    行）。D7 ... D0 中的每个位都控制数字 7 到 0 的配置。当对应位持有 1 位时，该数字将生效 BCD 模式。0 位指定不进行任何显示映射。每个位
    D7 ... D0 将按原样显示。


    **表 3-6。MAX7219 关机/启用命令**


    | D15 | D14 | D13 | D12 | D11 | D10 | D9 | D8 | D7 | D6 | D5 | D4 | D3 | D2 |
    D1 | D0 |

    |---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|

    | X | X | X | X | 0b1100 (0xC) | | X | X | X | | 关机 | |


    设备显示的数字（行）通过表 3-5 所示的扫描限制命令配置。0 到 7 的值指定显示数字的数量分别为一到八。在你的项目中，我们将显示所有行，因此使用 0b111
    (7)。如果你选择较少的数字（例如一到三个数字），你想大幅降低亮度以避免超过设备限制。数字越少，意味着每个数字或行的占空比越高。


    与此联系，软件可以配置 MAX7219 IC 显示少于八个（通电时默认为一个）。如果你的软件有意或无意地执行这样做，请尽快纠正这种状况（移除矩阵 PCB 的
    +5V）。由于显示的行数较少，每行 LED 的占空比为 1/8（即 12.5%），但可能是 100%！软件可能会损坏硬件。


    # 测试模式


    MAX7219 使用串行接口与微处理器建立接口。我们已经简要查看了 CLK、DIN 和 LOAD 这三个输入信号。CLK 信号不需要固定的时钟周期，因此我们可以说使用
    GPIO 信号向 IC “位扫带（bit-bang）”所有信号。我们只需要确保某些事件发生得不过快。


    设备的输入是一个 16 位字，其中最高位 (MSB) 首先移入。命令字的通用格式如表 3-1 所示。


    D15 是字的最高位，D0 是最低位 (LSB)。高位 D15 ... D12 被设备忽略（“不 care乎”用“X”表示），但在向设备移位数据时必须提供。位
    D11 ... D8 指定行（或数字）的*地址*，否则指定显示命令的“指令”代码。可用数据在字的低八位中提供。


    # 无操作命令


    无操作（NOP）命令（见表 3-8）起初看起来是一个很傻的操作，但 MAX7219 的设计允许工程师将其他 MAX7219 联起来形成更大的显示。要在不改变其他显示的情况下设置显示，需要使用
    NOP 命令使设备不受影响。我们只使用一个驱动器，所以这对我们来说仅具有学术兴趣。但你，作为实验者，可能在自己的项目中需要它。


    **表 3-8。MAX7219 无操作命令**


    | D15 | D14 | D13 | D12 | D11 | D10 | D9 | D8 | D7 | D6 | D5 | D4 | D3 | D2 |
    D1 | D0 |

    |---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|

    | X | X | X | X | 0b0000 (0x00) | | X | X | X | X | X | X | X | X |


    # 矩阵信号


    MAX7219 使用串行接口与微处理器建立接口。我们已经简要查看了 CLK、DIN 和 LOAD 这三个输入信号。CLK 信号不需要固定的时钟周期，因此我们可以说使用
    GPIO 信号向 IC “位扫带（bit-bang）”所有信号。我们只需要确保某些事件发生得不过快。


    图 3-6 显示了使用 GPIO 信号发送的一个命令的逻辑分析仪轨迹。


