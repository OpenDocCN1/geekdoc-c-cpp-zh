    ## CHAPTER 3


    ## The Matrix (CPU Utilization)


    Aside from the doubled RAM capacity, one of the main attractions of the new Raspberry
    Pi 2 is the four cores: four times the brain power! In this chapter, we''re going
    to look at a few ways to visualize the CPU activity present in the cores.


    ## The LED Matrix


    There is available an 8×8 matrix array of red LEDs that can be purchased at low
    cost. To make it easy to drive these, there is also the MAX7219 LED display driver
    IC. You could build it yourself, but these are available as an assembled or unassembled
    pcb kit. The one shown in Figure 3-1 was purchased on eBay assembled for $2.24
    (free shipping).


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_35_0.png)


    Figure 3-1. The MAX7219 LED matrix pcb


    The connections to this pcb are as follows:


    - 1. VCC (4.0V to 5.5V)

    - 2. Gnd

    - 3. DIN (data in)

    - 4. CS (load for MAX72119)

    - 5. CLK (serial clock)


    Obviously the VCC presents a problem for the GPIO interface, as the Raspberry
    Pi uses 3.3V logic, and will not tolerate higher voltages. The fact is that DIN,
    CS (which is LOAD for the MAX72119) and CLK inputs to the IC. However, the $V_{cc}$
    parameter of the Maxim datasheet is listed at +3.5V. Even on a good day, your
    Raspberry Pi GPIO output will not go +3.3V.


    ## Level Converters


    There is a very good solution available, however, at low cost and minimum of fuss:
    the 3V to 5V bidirectional converter shown in Figure 3-2.


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_36_0.png)


    **Figure 3-2.** 3V to 5V level converter


    The level converter shown in Figure 3-2 was purchased on eBay for $5.07 (free
    shipping), although can be found for less (make sure you get bidirectional). They
    might be advertised under different names, but I2C or IIC is almost always mentioned.


    The great thing about these converters is the fact that they work in both directions,
    making them flexible (don''t waste your time with the nonbidirectional converters.)
    A 3V signal change will be reflected on the 5V side and vice versa. 3-3 shows
    the bottom of the level converter I purchased.


    The bottom side silk screening helps visualize how this unit works. There are
    several different types of level converters, so let''s note a couple of things.


    The silkscreen shows that the +5V side produces up to 150 mA of 3V at the right
    (Figure 3-3). This converter includes a small voltage regulator producing approximately
    3V from the +5V input (or perhaps with a zener diode; I was unable to finish).
    Many others do not have this 3V generation feature.

    As a test, I added +5V to the 5V side, GND to ground, and measured about 3.6V
    on the output side (no load). Bonus! In addition to that, I discovered a little
    red LED also came on (top side of the pcb).


    The +3V input is important to know that the level converter works most (supplies
    to high-side resistors on the 3V side). Without this feature, you would need to
    wire up the +3V input to Raspberry Pi''s 3.3V input, in addition to supplying
    +5V to the other side. In my case, the +3V is already provided on the pcb and
    derived from the +5V input. So we wire the +5V to +5, but do not hook the +3V
    to your Raspberry Pi''s above 3.3V in this case.


    For the other level converters that do not generate the +3V supply, you will need
    to supply to it from the Raspberry Pi. In all cases, the +5V input should be wired
    to the 3V side signal level from ground to "high" (3V GPIO) will safely cause
    a ground near 5V change on the corresponding 5V signal-noise side. These are bidirectional
    converters and will work the same way in reverse, but we don''t need that for
    this project.


    ## Interfacing GPIO to MAX7219


    The matrix PCB drives the LEDs by means of the MAX7219 IC. With the level converters,
    we can now interface the Raspberry Pi to that chip. Let''s review now the signal
    requirements of the MAX7219 IC.


    - DIN: This signal is the data to be clocked serially into the MAX7219 IC. data
    clocked into the chip on the rising edge of the CLK signal. A high input registers
    as a 1 bit, whereas registers as a 0. This must be stable at least 25 ns prior
    to CLK rising.

    - CLK: This signal data in when it goes from low to high. This signal cannot operate
    above a 10 MHz clock speed.

    - CS (on pcb), LOAD: When the LOAD signal goes from low to high (pin 12 of the
    MAX7219), the last 16 bits of data that have been clocked in are processed. The
    LOAD signal must be held low while data bits are being clocked in (at least 25
    ns before the clock). The high and low period for the clock must be at least 50
    ns in length.


