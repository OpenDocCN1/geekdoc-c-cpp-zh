    ```


    ```

    $ ls -F

    configs/ mkimage/ sysdk usboot/

    ```


    # 准备配置


    现在必须准备内核源码并导入配置（当前目录为 ~linux）：


    ```

    $ make mrproper

    ```


    ```

    $ zcat /proc/config >.config

    ```


    第二步涉及 `zcat`，它将当前使用的内核选项解码并解压到 `~linux/.config` 文件中。这可以避免你尝试复制已有内容的麻烦。如果你下载的内核源码支持某些选项，稍后会询问你这些选项。


    # 构建配置


    此时，我们需要构建一个配置。这样做最方便的方法是使用 `make oldconfig` 目标。这避免了回答关于你正在使用的选项（来自 `/proc/config`）的问题。然而，它会询问任何新选项。如果你愿意，按回车键接受默认值，这是安全的选择。


    ```

    $ oldconfig

    HOSTCC scripts/basic/fixdep

    HOSTCC scripts/kconfig/conf.o

    SHIPPED scripts/kconfig/conf.tab.c

    SHIPPED scripts/kconfig/conf.lex.c

    SHIPPED scripts/kconfig/hash.c

    HOSTCC scripts/kconfig/conf.tab.o

    HOSTLD scripts/kconfig/conf

    scripts/kconfig/conf --oldconfig Kconfig

    #

    # configuration written to .config

    #

    ```


    # 第 4 章安装内核


    如果你想在开始编译过程之前双重检查内核版本，可以执行：


    ```

    $ make kernelversion

    3.18.13

    ```


    内核版本记录在顶层 Makefile 的前几行：


    ```

    $ head -s Makefile

    VERSION = 2

    PATCHLEVEL = 18

    SUBLEVEL = 13

    EXTRAVERSION = =

    NAME = Diseased Newt

    ```


    现在是时候确保更新后的文件已物理写入 SD 卡了：


    ```

    $ sync

    ```


    # 内核编译


    原始树莓派 B 型号编译内核需要很长时间（据报道需要 22 小时！）。然而，具有额外内存和四个 CPU 核心的 B 2 型号如果使用正确的 `make` 命令选项，可以在大约
    2 小时内完成构建。


    如果你已经安装并运行了 `mtop` 命令，现在是观察树莓派运行的绝佳时。你可以使用默认 GPIO 分配启动它，或添加命令行参数来指定你的 GPIO 布局。


    ```

    $ mtop &

    ```


    符号 `&` 允许 `mtop` 命令在你在当前终端会话运行时后台运行。图 4-1 显示了内核编译期间由 `mtop` 驱动的矩阵。四个 CPU 中的三个三个利用率为
    100%（左侧四列），内存被充分利用（主要通过磁盘缓存），右侧列显示 SD 卡的 I/O 活动。倒数第二和第三列配对以显示总 CPU 利用率。


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_50_0.png)


    **图 4-1.** *内核编译期间 mtop 驱动的矩阵*


    如果你还没有准备好运行 Matrix 的硬件，可以安装 `htop` 并运行而运行（在单独的会话中）：


    ```

    $ sudo apt-get install htop

    $ htop

    ```


    由于你有四个 CPU 核心，Linux 内核构建过程可以利用这一点来加速。在构建过程中，会有某些进程因 I/O 或其他原因被阻塞的情况。

    我建议你使用 **make** 选项 `-j6` 来构建内核。这告诉 **make** 运行六个并行的“make作业”而不是一个。这样，当进程在等待 I/O
    时，核心可以处理其他已就绪的进程。


    如果你忘记了 `-j6` 选项，构建将多花费好几个小时。所以，如果你忘记了，请按 `^C` 并带上该选项重启。构建过程将从上次中断的地方继续：


    ```

    $ make -j6

    scripts/kconfig/conf --oldconfig Kconfig

    CHK include/config/kernel.release

    UPD include/config/kernel.release

    WRAP arch/arm/include/generated/asm/auxvec.h

    WRAP arch/arm/include/generated/asm/bitsperlong.h

    WRAP arch/arm/include/generated/asm/cputime.h

    WRAP arch/arm/include/generated/asm/current.h

    ...

    ```


    # 模块构建


    现在内核已经编译，是时候构建并安装内核模块了。模块按如下编译（大约需要 5 分钟）：


    ```

    $ make -j6 modules

    CHK include/config/kernel.release

    CHK include/generated/uapi/linux/version.h

    CHK include/generated/utsrelease.h

    make[1]: ''include/generated/mach-types.h'' is up to date.

    CALL scripts/checksyscall.sh

    Building modules, stage z.

    MODPOST 1328 modules

    ```


    由于我们是交叉编译，可以通过以下方式安装模块：


    ```

    $ make modules install

    INSTALL arch/arm/crypto/aes-arm.ko

    INSTALL arch/arm/crypto/aes-arm.ko

    INSTALL arch/arm/crypto/shai-arm.ko

    INSTALL arch/arm/crypto/shai-arm.ko

    INSTALL arch/arm/crypto/sha512-arm-neon.ko

    INSTALL arch/arm/crypto/sha512-arm-neon.ko

    INSTALL arch/arm/lib/xor-neon.ko

    INSTALL arch/arm/lib/xor-neon.ko

    INSTALL arch/arm/oprofile/oprofile.ko

    INSTALL arch/arm/oprofile/oprofile.ko

    INSTALL crypto/ablk_helper.ko

    INSTALL crypto/ablk_helper.ko

    INSTALL crypto/arc4.ko

    INSTALL crypto/arc4.ko

    ...

    INSTALL /lib/firmware/keyspan_sda.fw

    INSTALL /lib/firmware/keyspan_sda.fw

    INSTALL /lib/firmware/keyspan_sda/xircom_pgs.fw

    INSTALL /lib/firmware/keyspan_sda/xircom_pgs.fw

    INSTALL /lib/firmware/cpia2/stv0672_vp4.bin

    INSTALL /lib/firmware/cpia2/stv0672_vp4.bin

    INSTALL /lib/firmware/yam/1200.bin

    INSTALL /lib/firmware/yam/1200.bin

    INSTALL /lib/firmware/yam/960.bin

    INSTALL /lib/firmware/yam/960.bin

    DEP 3.18.13-v7+

    ```


    会话的最后一行确认了我们正在安装的内容。当我们检查 `/lib/modules` 目录时，看到一个带下划线的子目录已为 `3.18.13-v7` 创建：


    ```

    $ ls /lib/modules

    3.18.11-v7+ 3.18.13-v7+ 3.18.7+ 3.18.7-v7

    ```


    # 安装内核


    树莓派 2 内核的准备与之前的模型不同。现在使用一个新的工具 `mknextimg`。内核可以在没有此调整的情况下使用，但将缺少设备树（DT）支持。使用 `mknextimg`
    添加你的内核附加以提供 DT 支持。如果你在内核 `.config` 中禁用了 DT 支持，请跳过此步骤并使用 `zimage`。


    让我们首先确保更新后的文件已物理写入 SD 卡：


    ```

    $ sync

    ```

