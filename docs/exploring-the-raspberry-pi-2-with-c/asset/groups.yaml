- md: "\n## GPIO::get_pwm_ratio\n\nUse get_pwm_ratio() to query the currently configured\
    \ mark and space integer values are for the specified PWM peripheral.\n\n```\n\
    int get_pwm_ratio(int gpio, uint32_t m,uint32_t s);\n```\n\nThe return value is\
    \ zero for success or a system error code upon failure. Input parameter gpio selects\
    \ the PWM peripheral. Parameters m and s are passed by reference, and are used\
    \ to return these two values:\n\n```\nGPIO gpio;\nint rc;\nuint32_t m, s;\n\n\
    rc = gpio.get_pwm_ratio(18,m,s);\nassert(!rc);\nprintf(\"PWMo=%u S=%u\\n\",\n\
    unsigned(m),\nunsigned(s));\n```\n\n## GPIO::pwm_control\n\nUse this method to\
    \ call the control register contents:\n`pwm_control(int gpio,s_PWM_control& control);`\n\
    \nThe call returns zero upon success or else a system error code. The control\
    \ status structure is defined as follows:\n\n```\nstruct s_PWM_control {\nuint32_t\
    \ PWEnX : 1; // Channel enable\nuint32_t MODEX : 1; // 0=Serialise/1=PWM mode\n\
    uint32_t RTPX : 1; // Last data in FIFO repeats\nuint32_t SBITX : 1; // State\
    \ when no transmission\nuint32_t POLAX : 1; // 1=Inverted output\nuint32_t USEFX\
    \ : 1; // 1=FIFO /0=PWM_DATX\nuint32_t MSENX : 1; // 0=PWM algorithm/1=M/S transmission\n\
    };\n```\n\nThe following is an example querying the control settings for PWM0:\n\
    \n```\nGPIO gpio;\nGPIO::s_PWM_control ctrl;\nint rc;\n\nrc = gpio.pwm_control(18,ctrl);\n\
    assert(!rc);\nprintf(\"PWMo's FIFO is %s\\n\",ctrl.USEFX ? \"used\" : \"not used\"\
    );\n```\n\n## GPIO::pwm_status\n\nMethod `pwm_status()` returns a status structure\
    \ for the PWM peripheral specified by input parameter gpio:\n\n```\nint pwm_status(int\
    \ gpio,s_PWM_status& status);\n```\n\nThe definition of GPIO::s_PWM_status` is\
    \ as follows:\n\n```\nstruct s_PWM_status {\n    uint32_t  fifo : 1;         \
    \ // FIFO full flag\n    uint32_t  fifo_empty : 1;     // FIFO empty flag\n  \
    \  uint32_t  fifo_werr : 1;      // FIFO error flag\n    uint32_t  fifo_rerr :\
    \ 1;      // FIFO read error flag\n    uint32_t  gap_occurred : 1;   // Gap occurred\
    \ flag\n    uint32_t  bus_error : 1;      // Bus error flag\n    uint32_t  chan_state\
    \ : 1;    // Channel state\n};\n```\n\nAn example of code testing to see if a\
    \ bus error has occurred for PWM0 is given below:\n\n```\nGPIO gpio;\nGPIO::s_PWM_status\
    \ sts;\nint rc;\n\nrc = gpio.pwm_status(18,sts);\nassert(!rc);\n\nif ( sts.bus_error\
    \ != 0 )\n    puts(\"PWM0 has a 'bus error'\");\n```\n\n## APPENDIX C\n\n### Class\
    \ GPIO 3\n\nThis appendix documents the static class method calls for the GPIO\
    \ class and is useful for those wanting to:\n\n- Determine the PWM number and\
    \ alternate function based on gpio number\n- Delay a short period of time for\
    \ configuration reasons\n- Obtain the \"peripheral base\" value\n- Obtain a text\
    \ string for GPIO::Source value\n- Return a text string for GPIO::IO value\n-\
    \ Return a descriptive string for the combination of gpio number and GPIO::IO\
    \ value\n\nFor find include file and linking instructions, see Appendix A.\n\n\
    ### Class Definition (Part 3)\n\nIn this third part of our look at the GPIO class,\
    \ I'll describe the methods applicable to static methods only:\n\n```\nClass GPIO\
    \ {\n    bool    errcode;              // errno if GPIO open failed\n\npublic:\n\
    \    GPIO();\n    ~GPIO();\n\n    inline int get_error();      // Test for error\n\
    \n    // Static methods\n    static int pwm(int gpio,int& pwm,IO& altf);\n   \
    \ static void delay();\n    static uint32_t peripheral_base();\n    static const\
    \ char *source_name(Source src);\n    static const char *alt_name(IO io);\n  \
    \  static const char *gpio_alt_func(int gpio,IO io);\n};\n```\n\n### APPENDIX\
    \ C CLASS GPIO 3\n\n## GPIO::pwm\n\nThis static class method returns information\
    \ about the selected PWM peripheral and it's alternate function number based on\
    \ the input gpio number alone:\n\n```\nstatic int pwm(int gpio,int& pwm,IO& altf);\n\
    ```\n\nExample code explains this better than words:\n\n```\nint rc, pwm;\nGPIO::IO\
    \ altf;\n\nrc = GPIO::pwm(13,pwm,altf);\nassert(!rc);\n// pwm == 1 (PwmM1)\n//\
    \ altf == GPIO::Alt0\n```\n\nUpon successful return rc will contain zero (or a\
    \ system error code). When successful, pwm will be populated with the PWM number\
    \ that the gpio accesses. The argument altf returns alternate function the PWM\
    \ uses for this. In the example (gpio=13), alternate function is returned as GPIO::Alt0.\n\
    \n## GPIO::delay\n\nGPIO::delay static class method takes no arguments. The call\
    \ does not return until a short delay has occurred. Some internals of the GPIO\
    \ class use of this since the CPU is able to act faster than some peripherals\
    \ respond:\n\n```\nstatic void delay();\n```\n\nIt is currently implemented as\
    \ follows, but may be amended in the future if the CPU increases significantly:\n\
    \n```\nvoid\nGPIO::delay() {\n  for ( int i=0; i<150; i++) {\n    asm(\"nop\"\
    );\n  }\n}\n```\n\nFrom this, you can see the delay is a matter of executing nop\
    \ instructions within a loop. An example of use is:\n\n```\nGPIO::delay();\n```\n\
    \n## GPIO::peripheral_base\n\nThis is another static method that used internally.\
    \ This function opens and reads the Linux file /proc/device-tree/soc/ranges determines\
    \ the peripheral base value for:\n\n- Raspberry Pi (0x20000000)\n- Raspberry Pi\
    \ 2 (0x3F000000)\n\nThe method calls no parameters and returns the peripheral\
    \ base address:\n\n```\nstatic uint32_t peripheral_base();\n```\n\nIn this particular\
    \ case, the value returned should be one of the values above. When zero is returned,\
    \ the procedure has failed.\n\n## GPIO::source_name\n\nThis static method converts\
    \ a GPIO::Source constant into a string so that it can be printed:\n\n```\nstatic\
    \ const char *source_name(Source src);\n```\n\nFor example:\n\n```\nGPIO::Source\
    \ src = GPIO::Oscillator;\nconst char *description = source_name(src);\nprintf(\"\
    Source is %s\\n\", \"Oscillator\");\n```\n\n## GPIO::alt_name\n\nThis is static\
    \ method to return a descriptive string that can be printed. This method takes\
    \ a GPIO::IO input and returns descriptive text for this:\n\n```\nstatic const\
    \ char *alt_name(IO io);\n```\n\nThe following illustrates the call:\n\n```\n\
    GPIO::IO io = GPIO::Output;\nconst char *description = alt_name(io);\nprintf(\"\
    io = %s\\n\", \"Output\");\n```\n\n## GPIO::gpio_alt_func\n\nThis static method\
    \ calls descriptive text for a given gpio pin and GPIO::IO setting:\n\n```\nstatic\
    \ const char *gpio_alt_func(int gpio, IO io);\n```\n\nThe following is an example:\n\
    \n```\nint gpio_no = 20;\nGPIO::IO io = GPIO::Alt4;\nconst char *desc = gpio_alt_func(gpio_no,io);\n\
    // Returns desc = \"SPI1_MOSI\"\n```\n\n## APPENDIX D\n\n### Class MAX7219\n\n\
    This appendix documents the class MAX7219 to facilitate communication with the\
    \ chip with the same name and is useful for those wanting to:\n\n- Working with\
    \ the MAX7219 (or MAX721) to control a display\n- To enable/disable the display\n\
    - To display the test pattern\n- To configure the number of digits and decode\
    \ mode\n- To configure the intensity of the display\n- To drive a display\n\n\
    ### Include File\n\nWith the default build and install PREFIX=/usr/local, your\
    \ installed librpi2 header files should be located in /usr/local/include. In your\
    \ program use:\n\n```\n#include <librpi2/max7219.hpp>\n```\n\nIf necessary, add\
    \ the compiler option -I/usr/local/include.\n\n### Linking\n\nWith the default\
    \ build and install PREFIX=/usr/local, your installed librpi2 library should be\
    \ located here: /usr/local/lib/librpi2.a\n\nWhen linking your program, add the\
    \ options -L/usr/local/lib -librpi2 to the link step of your make.\n\n### Class\
    \ Definition\n\nThe exposed (public) portion of the MAX7219 class is illustrated\
    \ below:\n\n```\nclass MAX7219 {\n    ..private and protected sections hidden\
    \ for clarity...\npublic:\n    MAX7219(int clk, int din, int load);\n\n    int\
    \ nop();              // No op\n    int shutdown();         // Shut device down\n\
    \    int test(bool on);      // Display test mode\n    int enable();         \
    \  // Enable normal operation\n\n    int config_decode(int digit, bool decode);\
    \ // Decode mode per digit\n\n    int config_digits(int d_digits);         //\
    \ Configure 1-8 digits\n    int config_intensity(int n);             // Configure\
    \ intensity 0-15\n\n    int data(int digit, int din, int load);\n};\n```\n\n###\
    \ MAX7219::MAX7219\n\nThe constructor for this class requires the arguments:\n\
    \n`MAX7219::MAX7219(int clk, int din, int load);`\n\nThree arguments determine\
    \ how the MAX7219 is wired to the Raspberry Pi GPIO pins:\n\n1. clk: this is the\
    \ GPIO output connected to the MAX7219 CLK input (clock)\n2. din: this is the\
    \ GPIO output connected to the MAX7219 DIN input (data input)\n3. load: this is\
    \ the GPIO output connected to the MAX7219 LOAD input (nload strobe)\n\nAs part\
    \ of the constructor execution, the following steps are performed (look for max7219.cpp\
    \ in the libripi subdirectory):\n\n1. The clk GPIO pin is configured for output\n\
    2. The din GPIO pin is configured for output\n3. The load GPIO pin is configured\
    \ for output\n4. The clk pin is set low (0)\n5. The din pin is set high (1)\n\
    6. The load pin is set low (0)\n7. Some default timings are configured for the\
    \ max7219 device\n"
