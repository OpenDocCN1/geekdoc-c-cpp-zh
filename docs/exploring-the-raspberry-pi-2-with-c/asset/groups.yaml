    # MAX7219::data


    To change the display data for a given digit, use the data() method:


    ```

    data(int digit, int data);

    ```


    The value returned is zero for success or else system error code. The digit is
    selected starting from zero, up to your configured maximum number. The chip supports
    up to digit 7 (for a maximum of an eight-digit display). The data is displayed
    by the data argument.


    When not using BCD encoding, the entire 8 bits of the data argument is mapped
    to the eight driver segments (or to individual LEDs). When BCD encoding is used,
    the lower 4 bits are used to a segment display (see the MAX7219 datasheet for
    the mapping). In BCD mode, setting 0x04 will cause the seven-segment display to
    display a 4 with no decimal point. The decimal is enabled by setting bit 7 as
    a 1. For example 0x84 displays a 4 with a decimal point.


    The following shows an example of:


    ```

    MAX7219 max7219(16,26,21);

    int rc;

    rc = max7219.data(3,0x84); // Digit 3 == 4 with D.P.

    asert(!rc);

    ```


    # MAX7219::test


    This class method tells the MAX7219 chip to enter "test mode" and display every
    possible segment or LED when the argument is true. Set the argument to false to
    disable test mode:


    ```

    int test(bool on);

    ```


    The following example illustrates how to put the device into test mode for 1 second:


    ```

    MAX7219 max7219(16,26,21);

    int rc;

    rc = max7219.test(true);

    asert(!rc);

    sleep(1);

    rc = max7219.test(false);

    asert(!rc);

    ```


    # MAX7219::shutdown


    This class method sends command to the MAX7219 devices to enter "shutdown mode."
    Use the enable() method to start the device again (allow some time for initialization
    to occur).


    From the Max datasheet:


    > When the MAX7219 is in shutdown mode, the scan oscillator is halted, all segment
    currents are pulled to ground, and all digits are pulled to V+, blanking the display.
    Data in the digit and control registers remains unaltered. Shutdown can be used
    to save power or as an alarm to flash the display by successively entering and
    leaving shutdown mode.'
