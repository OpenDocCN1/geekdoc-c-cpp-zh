  - "[PAGE 142]\n\n# CHAPTER 11 C++ QUICK START\n\nThe huge advantage of using std::[]\
    \ array is that you never have to be concerned about the maximum size of the string\
    \ (unlike a character array that must be sized in advance). The negative aspect\
    \ of this is that it does dynamic memory allocations, resulting in calls to malloc(3).\
    \ In performance-critical sections of your application, you might want to avoid\
    \ its use.\n\n# String Streams\n\nI have avoided discussing C++ I/O because that\
    \ would require another chapter on its own. For many programmers the older C language\
    \ facilities work best from a productivity point of view. The printf() format\
    \ of \"%.3f\" to print a floating point value to three decimal places, padded\
    \ to a column width of 7, is so much more convenient to convert (and read) than\
    \ the multiple C++ method calls required to do the same job. Despite this prejudice,\
    \ though, you should be familiar with: std::stringstream The object provides a\
    \ formatting convenience that can augment or even replace a sprintf() call in\
    \ your code. One huge benefit is that in its favor you are never have to be restricted\
    \ to a predetermined buffer size (like with sprintf()).\n\nConsider a code fragment\
    \ where you have:\n\n+   - A directory variable (type char[] array or std::string),\
    \ named dir_name.\n- A subdirectory name (type char[] array or std::string), named\
    \ subdir.\n- Year, month and day as an int, named year, month, and day, respectively.\n\
    \nThe task at hand is to construct a pathname for a log file. Using std::stringstream,\
    \ this is easily done:\n\n```\nstd::string log_pathname;\n{\nstd::stringstream\
    \ ss;\n\nss << dir_name << ''/' << subdir << ''/'\n    year << ''-' << month <<\
    \ ''-' << day << \".log\";\nlog_pathname = ss.str();\n}\n```\n\nIn this code fragment\
    \ we perform the pathname construction within a code block. This code block will\
    \ discard ss, once the log_pathname is saved in the last line of block without\
    \ having to allocate any buffers to a maximum size.\nNotice that the method str()\
    \ converts the string stream to a std::string that can be assigned. It is also\
    \ possible to convert a std::string to a C string, for use in printf().\n\n```\n\
    printf(\"The log_pathname=%s\\n\", ss.str().c_str());\n```\n\nThis example converts\
    \ ss into a std::string, which can then have its method c_str() called to return\
    \ a C string for use in a printf() call. Chaining method calls can sometimes provide\
    \ some powerful shortcuts."
