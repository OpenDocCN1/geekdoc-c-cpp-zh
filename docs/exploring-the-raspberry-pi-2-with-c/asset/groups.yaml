    \ == 1 (Pwm1)\n// altf == GPIO::Alt0\n```\n\n成功后 rc 将包含 0（或系统错误代码）。成功后 pwm 将填充\
    \ PWM 编号。altf 返回 PWM 使用的复用功能。在示例 (gpio=13) 中，返回的是 GPIO::Alt0。\n\n## GPIO::delay\n\
    \n`GPIO::delay` 静态类方法不接受参数。GPIO 类使用此方法是因为 CPU 可以比某些外设响应更快：\n\n```\nstatic void\
    \ delay();\n```\n\n目前实现如下，但如果 CPU 性能显著提升，可能会进行修改：\n\n```\nvoid\nGPIO::delay()\
