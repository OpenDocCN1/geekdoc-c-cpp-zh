    # PWM Modes


    If youve paid close attention or have some experience with the Raspberry Pi PWM
    peripheral, you know that there are two different applicable modes:


    +   1. M/S and PWM mode

    2. Serial or PWM data


    Let''s take a closer look at this.


    # M/S and PWM Data Mode


    In M/S mode, the signal consists of cycles of mark and space. The mark (1) signal
    is sent with a length M, and the space (0) signal is sent with a length S-M (S
    is the length of the entire cycle). Figure 7-1 illustrates the relationship between
    M and S (for a noninverted signal).


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_90_0.png)


    Figure 7-1. M/S signal


    The value S specifies the counter value for the entire length of the cycle. The
    value M determines how many counts of the clock that the signal will be high (1)
    for a noninverted signal. Once the count of M is reached, the signal goes low
    (0) until the count of S is reached.'
