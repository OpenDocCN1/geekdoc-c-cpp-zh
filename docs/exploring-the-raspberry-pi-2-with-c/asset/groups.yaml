  - "[PAGE 137]\n\n# CHAPTER 11 ■ C++ QUICK START\n\nstd::deque (pronounced \"deck\"\
    ) is a double-ended queue. You can push items onto the front or the back end,\
    \ and you can pop items off the front or back. This is a dynamic sized container\
    \ that expands or contracts at ends as required. The functionality is similar\
    \ to std::vector in some respects, obviously the internals get a bit nasty as\
    \ things grow and contract.\n\nA new item can be added to the back end (like std::vector)\
    \ using push_back(). To add the item to the front end, use push_front() instead.\n\
    \nOne area that you might find counterintuitive about this container (and std::stack)\
    \ is the need to copy the value using the methods front() or back() prior to popping\
    \ the value with pop_front() or pop_back(). The following illustrates the situation\
    \ in code:\n\n```\nstd::deque<int> queue;\n\nqueue.push_back(98);\n...\nint back_val\
    \ = queue.back(); // gets 98\nqueue.pop_back(); // pops 98 off back end\n```\n\
    \nThe back_val is assigned the value 98 by use of the method back(). The following\
    \ line uses pop_back() to remove the value from the queue. This might take a little\
    \ getting used to.\nThe std::stack<type> works similarly, except that you use\
    \ method top() to access the top value on the stack, prior to popping it off with\
    \ pop().\n\n# Safe Iterators\n\nSafety is job one when building large applications.\
    \ Bugs cost time, and time is money. To facilitate safety, the STL provides constant\
    \ iterators.\n\nUse constant iterators when you plan to iterate the container\
    \ without making changes to it. Perhaps all you want to do is something in the\
    \ map:\n\n```\nstd::unordered_map<int, s_client> clients_map;\ndouble total_outstanding\
    \ = 0.00;\n```\n\n```\nfor ( auto it = clients_map.begin(); it != clients_map.end();\
    \ ++it ) {\n    s_client& client = it->second;\n\n    total += client.owing;\n\
    }\n```\n\nThe code in this example loop is trivial, but in real production code,\
    \ there is likely to be several paragraphs between the top and the bottom of the\
    \ loop. To guarantee that the map members don't change, use the constant iterators\
    \ instead:\n\n```\nstd::unordered_map<int, s_client> clients_map;\ndouble total_outstanding\
    \ = 0.00;\n```\n\n```\nfor ( auto it = clients_map.cbegin(); it != clients_map.cend();\
    \ ++it ) {\n    const s_client& client = it->second;\n\n    total += client.owing;\n\
    }\n```\n\n125"
- md: "\n## CHAPTER 11 C++ QUICK\n\niterators, methods cbegin() and cend(). To avoid\
