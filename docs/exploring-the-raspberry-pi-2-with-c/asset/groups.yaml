  - "[PAGE 127]\n\nAs a convention, I often prefix a structure name with s_to to make\
    \ it clearer that I am using a struct name.\n\n```\nstruct s_advertiser {\n  int\
    \ id;\n  ...\n};\n```\n\nThis convention is also useful in making the struct type\
    \ distinct from an instance of the same.\nFor example:\n\ns_advertiser& advertiser\
    \ = ...\n\nThis clearly shows that struct s_advertiser (the type) named advertiser\
    \ (the instance) is a reference to something on the right side. We will look at\
    \ C++ references later.\n\n# Classes and Structs\n\nThe next subtle surprise that\
    \ many C++ programmers discover is that the struct and class types are identical\
    \ in function, except for member visibility. It is possible, therefore, for structures\
    \ to have constructors, destructors, and methods just like C++ classes. The only\
    \ difference between them is that all members of a structure are public unless\
    \ otherwise modified by the keywords private or protected. By way of contrast,\
    \ class definitions are all private unless otherwise specified.\n\n# Standard\
    \ Template Library\n\nUse of the STL can save you huge programming effort. At\
    \ the same time, the STL leverages well-tested code, avoiding costly debugging:\
    \ no more handcrafted lookup tables, debugging of memory leaks, and so on.\n\n\
    If you don't already use it, get to know the web site cplusplus.com. Throw away\
    \ your ancient STL book and open this site with your browser while you code. Figure\
