    \ 通道\n3. 查询已服务的 DMA 中断计数\n\nrpdma 内核模块能够调用函数执行 DMA 分配和释放，以便你可以将其用于用户目的。DMA 资源在\
    \ Linux 内核中是珍贵的。如果所有 DMA 通道都被用尽，内核将在某处停止。因此，当不再需要时释放任何分配的 DMA 至关重要。\n\n# 附录 G\
    \ 其他 librpi2 类\n\n作为打开 /dev/rpdma 的一个副作用，应用程序（PiSpy）可能会崩溃并可靠地释放任何持有的 DMA 设施。这是因为当\
