  md: '![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_123_0.png)


    **Figure 10-8.** Breadboard setup for MC14490 button test


    When ordering this part, buy more than one (I suggest five). It doesn''t happen
    often, but sometimes you get a dud (or it becomes one). There''s nothing more
    disappointing than being ready to go and discovering that your part is dead. Because
    you''re attaching to the input of the Pi, be sure to power the MC14490 from the
    3.3V supply (not the 5V supply).


    If you experience trouble getting this to work (like I did the first time), perform
    the following checks:


    +   1. Check ground. Is the pin 8 attached to the Pi''s GND?

    2. Check pin 16. Is it connected to the Pi +3.3V supply?

    3. Check the capacitor. Are the connections pin 7 and 9?

    4. Disconnect the push button and the GPIO output.

    5. Connect OSC$_{out}$ (pin 9) to a GPIO input pin (19).

    6. Use PiSpy to monitor it a wave form (use a long sampling period of 24 blocks,
    but don''t overdo it).


    Powering the unit again, using PiSpy you should be able to capture a wave form.
    If the frequency is extremely low, you might only capture the signal going high,
    or returning low. Either way, this is a good sign that the oscillator is operating
    (perhaps too slowly). Double-check it with another capture if you didn''t get
    a full period.


    Once the oscillator is known to be operational, you should be able to hook up
    a button and see the output change with button presses. You can hook up a GPIO
    pin or use a multimeter on the output pin. Don''t try to drive an LED from the
    outputs, though; they might only support 1 or 2 mA.'
