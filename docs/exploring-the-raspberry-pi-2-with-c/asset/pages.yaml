  md: '# How Many Threads?


    By default, this project creates four threads, assuming that you''re running it
    on a Raspberry Pi 2 with four cores. However, there is usually some advantage
    to overprovisioning threads by one or two, to take advantage of leftover idle
    time due to I/O, and so on. If you have four CPUs, then experiment with five or
    six worker threads to see if you can increase your overall transaction throughput.


    # To Do


    No, I didn''t forget to finish this section. This is where you get to jump in
    and make your changes to the piweb server to do your bidding. A good place to
    start is to look at the worker class and add other functionality that is provided
    by libevent or your own code (see the files .worker.hpp and worker.cpp). For example,
    you might want to parse the request into variables that control the results. By
    enhancing the worker class, you can keep the necessary interfaces clean and easy
    to maintain.


    # Summary


    This chapter has demonstrated that C++ programs can make good use of C libraries,
    yet provide a clean and simple interface. The piweb server also demonstrated how
    to put four CPU cores to work serving up web content in separate competing threads.
    Finally, the source code provided can be extended and bent as you see fit. This
    puts Pi power in your hands!'
