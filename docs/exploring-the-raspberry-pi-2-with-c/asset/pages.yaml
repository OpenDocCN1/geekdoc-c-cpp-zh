  md: 'In my own experiment, I didn''t have that so I tried a 0.02 µF capacitor instead.
    It produced a higher sampling frequency, which would make it more sensitive to
    button glitches, but it proved the overall operation okay with no problems.


    Using PiSpy, I was able to sample the oscillator on pin 9. You need a long sampling
    period due to the low frequency of the oscillator. I chose to use 48 blocks (-b48)
    for this capture. The gtwave output in Figure 10-7, you can see that the wave
    form was about 32 ms. Taking the reciprocal of that gives us a frequency of about
    31.25 Hz (using a 0.02 µF capacitor).


    $ pyspy -b48 -R19 -T9999

    Captured: writing capture.vcd


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_122_0.png)


    Figure 10-7. PiSpy capture of the OSC_out (pin 9) of the MC14490


    To test its button action, wire the button S1 to Figure 10-6. Attach the debounced
    AO to your GPIO 19. GPIO 19 boots up as an input, but otherwise make sure that
    it is in input mode with -g3 -i before making the connection (-pu adds a pull
    resistor, which should also be the default).


    The following command reinserts the input (-i) for GPIO 19 (-g19), adds a pullup
    resistor (-pu), and monitors that GPIO forever (-m0). Once the gp command is monitoring,
    you should be able to get clean button press events. My session looked like this:


    ```

    $ gp -g19 -pu -m0

    Monitoring..

    00000 GPIO 19 = 1

    00001 GPIO 19 = 0

    00002 GPIO 19 = 1

    00003 GPIO 19 = 0

    00004 GPIO 19 = 1

    00005 GPIO 19 = 0

    00006 GPIO 19 = 1

    00007 GPIO 19 = 0

    00008 GPIO 19 = 1

    ```


    The button I used was a real scratch in electrical terms but it performed magnificently.

    Figure 10-8 illustrates my breadboard test on the end of the Raspberry Pi 2 workstation.
    This circuit is easy to breadboard that you should make a point of trying it yourself.
    It simply needs 3.3V power (from the Pi), ground, a capacitor, and a button. The
    output simply goes to a GPIO input.'
