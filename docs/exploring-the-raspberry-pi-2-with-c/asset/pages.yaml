  md: '# CHAPTER 10 DEBOUNCING


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_120_0.png)


    The CD4049 is a simple CMOS inverter, but when combined with R2 and C1, and feedback
    resistor R1, the push button (S1) can be used to toggle its. The output can be
    taken from either IC1A (pin 2) or IC1B (pin 4). Alternatively, you could add one
    more inverter to be used as a buffer stage.


    When using the circuit shown in Figure 10-4, the application normally requires
    some sort of feedback to the user. If the Raspberry Pi application shows some
    visual on a screen, other LED, or sound in response to a button press, nothing
    further is needed. However, if none of these cues are present, the user will be
    wondering if or she toggled the input or off.


    Figure 10-5 shows one possible solution to the problem, at the expense of more
    components. In this circuit the toggle function is still provided by IC1A and
    IC1B. The LED indicator is driven by another inverter IC2A, and the signal is
    driven by IC2B. These extra inverters may be drawn from IC1 if you prefer (the
    schematic was extracted from a larger design that I used).


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_120_1.png)


    Figure 10-5. Toggle button with buffer and LED indicator


