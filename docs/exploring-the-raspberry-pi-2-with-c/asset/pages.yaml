  md: "# APPENDIX F CLASS MTOP AND DISSTAT\n\n```\nint sample(std::vector<double>&\
    \ cpus); // Return CPU %s\ndouble total_cpu_pct() const; // Return last total\
    \ CPU %\ndouble memory_pct(); // Return memory used (%)\ndouble swap_pct(); //\
    \ Return swap used (%)\n};\n```\n\n# MTop::MTop\n\nThe MTop class provides a default\
    \ constructor that internally initializes the object:\n\n```\nMTop();\n```\n\n\
    Its purpose after initializing is gather system usage information about the CPU\
    \ and memory.\nAn instantiation of MTop is given below:\n\n```\nMTop mtop;\n```\n\
    \n# MTop::sample\n\nEach time the sample() method is called, the CPU usage information\
    \ is internally captured. However, before any meaningful information can be returned,\
    \ this method must be called two or more times. The first time simply preloads\
    \ the statistics, each successive call will return the usage difference between\
    \ the current and previous call. The method prototype is as follows:\n\n```\n\
    int sample(std::vector<double>& cpus);\n```\n\nThe values are returned through\
    \ a std::vector<double> argument, which is passed by reference.\nThe sample()\
    \ method clears the vector to an empty container and then populates it according\
    \ to the number of CPUs found for the system. For the Raspberry Pi 2, this should\
    \ be four. The value returned in each cell is the percentage of utilization between\
    \ 0 and 100.0.\nThe following code illustrates an example of the set up and call\
    \ loop:\n\n```\n#include <vector>\n\nMTop mtop();\nstd::vector<double> cpus;\n\
    nmtop.sample(cpus); // Initial sampling\n\nfor (;;) {\n    mtop.sample(cpus);\
    \ // Return sampling differences\n    for ( size_t cpu=0; cpu<cpus.size(); ++cpu\
    \ ) {\n        double pct_utilization = cpus[cpu];\n        ...\n    }\n}\n```"
