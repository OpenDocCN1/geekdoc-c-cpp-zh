    \ you might use a pointer, but this is still suboptimal:\n\n```\nfor ( auto it\
    \ = clients_map.begin(); it != clients_map.end(); ++it ) {\n    s_client *client\
    \ = &it->second;\n\nclient->balance -= some_adj;\n}\n```\n\nNow you immediately\
    \ know that it->second refers to the s_client structure. But pointer syntax\n\
