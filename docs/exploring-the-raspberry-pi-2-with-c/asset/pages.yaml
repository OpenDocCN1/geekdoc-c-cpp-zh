  md: "# APPENDIX A CLASS GPIO 1\n\nOne special note is in order, however: if the\
    \ start-up procedure fails for any reason, the system error code (errno) is saved\
    \ in the class member errcode. A constructor does not return any status information,\
    \ so it is up to you to check for an error. An example code fragment of this is\
    \ shown below:\n\n```\n#include <libpi2/gpio.hpp>\n\nint\nmain(int argc, char\
    \ **argv) {\n    GPIO gpio; // Instantiate class GPIO as gpio\n\n    if (gpio_get_error()\
