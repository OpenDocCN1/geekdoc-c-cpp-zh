  md: '# APPENDIX G


    # Other librpi2 Classes


    There are other librpi2 classes that advanced users may find useful. These are
    used directly and indirectly by the PiSpy application:


    +   - librpi2/mailbox.hpp: Kernel Mailbox facilities

    - librpi2/dmam.hpp: DMA Memory allocation

    - librpi2/dma.hpp: DMA Register Definitions

    - librpi2/rpdma.hpp: DMA Allocation Definitions

    - librpi2/logana.hpp: Logic Analyzer class

    - librpi2/vcdout.hpp: VCD signal output class (VCD_Out)


    These classes are rather advanced for casual use. Yet they are the facilities
    that the PiSpy utility was built from.


    # DMA Allocation


    DMA allocation under Linux is impossible (for the Raspberry Pi at least) from
    a user mode application. PiSpy manages to allocate a DMA with the aid of a kernel
    Linux module (provided with this book). The source code for the driver is found
    in:


    +   - knmodules/rpdma/rpdma.c

    - include/rpdma.h


    Once the rpdma kernel module is loaded, PiSpy is able to open the module as /dev/rpdma.
    Once the driver is opened, ioctl(2) calls are used to:


    +   1. Request (allocate) a DMA channel

    2. Release a previously allocated DMA channel

    3. Inquire about the DMA interrupt count that has been serviced


    The rpdma kernel module is able to make function calls to perform DMA allocation
    and release, so you can use the module as an agent for land purposes. The third
    function for inquiring about interrupt counts prevents PiSpy to gauge the sampling
    process.


    The DMA resource is precious within the Linux kernel. Should all DMA channels
    get used up, the kernel will seize up at some point. So it is vital that any allocated
    DMA be released when no longer needed.'
  merge: -1
  pgno: 192
- img_proc: true
  md: '# APPENDIX G OTHER LIBLRP12 CLASSES


    As a side benefit of opening /dev/rpidma, the application (PiSpy) can crash and
    yet reliably release any held DMA facilities. This works because the kernel will
    automatically close all open file descriptors for the executing program. When
    the /dev/rpidma driver is closed, the driver is able to release any resources
    it held, including the allocated DMA channel and registered interrupt. This provides
    kernel safety, even though you are using DMA from user land.


    Once the DMA channel is used, the PiSpy utility manipulates the DMA control block
    and peripheral, through definitions found in librlp12/dma.hpp.


    # Warning


    When doing development on kernel modules and working with the DMA peripheral,
    expect some accidental kernel crashes and seizures. The impact of a crash is usually
    that your file changes have not been flushed out to the SD card!!! Ask me how
    I know this.


    So prior to performing a dangerous test, you should always precede this with the
    sync command:


    ```

    # sync

    ```


    This causes your system to write out any unsaved changes. If you have MTop running,
    you''ll see that the I/O jumps up while this executes. Sometimes I do this twice
    to be sure.'
  merge: -1
