  md: 'This is the kind of problem that lurks for the impatient. With a bit of planning
    and insight, these problems are easily avoided. Solutions for this problem include
    the following:


    +   1. Increasing the GPIO output drive capability to adequately meet the VIH
    requirement for the CMOS device.


    +   2. Increasing the resistance of R1 to reduce the load (this also decreases
    brightness of the LED).


    +   3. Using a separate GPIO line to drive the LED.


    # GPIO Drive


    The Raspberry Pi (including the B 2) has configurable output drive capability
    in multiples of 2 mA (this is the minimum drive strength). The flexibility of
    the GPIO as output, input, and drive strength requires a complicated configuration
    of CMOS transistors to realize. In this chapter we kept things simple by assuming
    one configuration or another (input or output), and this is sufficient for our
    needs. We simply configure the GPIO in software and the SoC makes it so.


    The GPIO output drive strength is customized by three bits in the PADS control
    register. I''ve labeled Drive0, Drive1, and Drive2 in Figure 8–9. When the Drive0
    has a 1 bit, there is an additional help of 2 mA drive (for a total of 4 mA).
    If you were to configure Drive2 as a 1 bit, then an additional 8 mA of drive is
    added, for a total drive capability of 12 mA. The Raspberry Pi can provide up
    to 16 mA of total drive.


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_105_0.png)


    Figure 8-9. Configurable GPIO output drive'
  merge: -1
  pgno: 105
- img_proc: true
  md: 'The configured GPIO drive strengths are configured in GPIO groups:


    +   1. GPIO 0 to 27 (8 mA at reset)

    2. GPIO 28 to 45 (16 mA at reset)

    3. GPIO 46 to 53 (8 mA at reset)


    GPIO Groups 2 and 3 affect internal system components, so it is inadmissible to
    change them. The gp command option -5 permits you to change the drive strength
    for Groups 1 and 2.


    # CMOS Usage Rules


    This chapter would be incomplete without a brief note on handling considerations
    for the GPIO pins and for CMOS logic ICs. Don Lancaster lists six rules in his
    CMOS Cookbook[3] but because the audience is different here, I''ll abbreviate
    and paraphrase his list as follows:


    +   1. All inputs must be grounded. Tied inputs to +VDD or to ground.

    2. Protect the protection. Don''t rely on the device''s protection diodes to fix
    sloppy input signals.

    3. Avoid static electricity when handling GPIO/CMOS pins or circuits attached
    to them.


    For static precautions, Lancaster says:


    > Any and all of these methods give good in-circuit protection against static
    problems. They will also give good out-of-circuit protection, provided you are
    reasonably careful with your handling of the devices. Most lists of rules for
    handling MOS devices are overdone and introduce more problems than they solve.
    To take care of MOS circuits, keep them in place with an ordinary small soldering
    carriers before use, and solder them in place with an ordinary soldering iron.
    Make sure your circuits have some sort of resistor for MOS leads going off the
    pc board. And that''s about all the precautions you''ll ever need.[4]


    As an additional point, keep in mind the cost and the static risk. More care should
    be given to GPIO pins because they are part of the larger Raspberry Pi. The CMOS
    logic, on the other hand, is inexpensive to replace.


    Figure 8-10 shows a photo of a low-cost ant wristband (available from eBay for
    as little as a dollar). Insert your hand in the wrist band and attach the clip
    to something grounded. This helps to bleed off any static charges that might accumulate
    as you move around.'
