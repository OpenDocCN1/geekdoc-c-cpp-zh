    \ hardware ready to run yet, you can install htop and run instead\n(in a separate\
    \ session):\n\n```\n$ sudo apt-get install htop\nn$ htop\n```\n\nBecause you have\
    \ four CPU cores, the Linux kernel build process can take advantage of that to\
    \ speed\things along. There will be times during the build where a process is\
    \ held up for I/O or something else.\nI recommend that you build the kernel using\
    \ the **make** option -j6. This tells **make** to run six parallel\n\"make jobs\"\
    \ instead of one. This way when processes are waiting for I/O, the cores can work\
    \ on the other\nprocesses that are now ready."
