  md: '# CHAPTER 4 INSTALLING A KERNEL


    If you want to double-check the kernel version before you start the compile process,
    you can perform:


    ```

    $ make kernelversion

    3.18.13

    ```


    The kernel version is recorded in the first few lines of the top-level Makefile:


    ```

    $ head -s Makefile

    VERSION = 2

    PATCHLEVEL = 18

    SUBLEVEL = 13

    EXTRAVERSION = =

    NAME = Diseased Newt

    ```


    Now is a good time to make sure your updated files are physically written out
    to the SD card:


    ```

    $ sync

    ```


    # Kernel Compile


    The original Raspberry Pi model B takes a very long time to compile the kernel
    (it has been reported to take 22 hours!). However, the model B 2 with its extra
    memory and four CPU cores can build the kernel in about 2 hours if you use the
    correct make command options.


    If you have the mtop command installed and operational, now would be an excellent
    time to be watching the Pi in action. You can start it with its default GPIO assignments,
    or add command line arguments to specify your GPIO arrangement


    ```

    $ mtop &

    ```


    The ampersand allows the mtop command to run in the background as you work in
    the current terminal session. Figure 4-1 shows the matrix driven by mtop during
    a kernel compile. Three of four CPUs are at 100% utilization (left four columns),
    the memory is fully utilized (mostly by disk cache), and the right column shows
    the SD card I/O activity. The second and third last columns are paired to show
    total CPU utilization.'
