  md: '# CHAPTER 6 GENERAL PURPOSE CLOCK


    Using the Raspberry Pi, I used the following piclk command to start the BFO Frequency
    of 455 kHz:


    ```

    $ piclk -g4 -i42 -m0 -e1 -s1

    ```


    You might want to add the -b option (blink) to start until you find your radio
    is on. If your radio signals turning on and off at half-second intervals, then
    your radio might be using a different IF (try 10.7 MHz as a second guard). One
    of the problems you will encounter in this experiment is the fact that your radio
    will also pick up interference from the running of your Pi, so for best reception.


    In Figure 6-2, above the sender of my receiver, you can see some loose wire around
    the antenna. This was done to improve the BFO ''injection'' into the receiver.
    The other end of the wire was plugged into GPIO 4. The wire was kept short, to
    avoid harming the GPIO port. Avoid doing this if possible (it could cause greater
    interference in your neighborhood).


    Once you''ve proven that you can hear the effects of the BFO in your receiver
    audio, you can tune on some CW signals (perhaps practice your Morse code receiving
    skills). To receive sideband, you will need to fiddle some more. There are upper
    and lower sidebands, requiring that your BFO be either higher or lower in frequency
    than the carrier. With a bit of practice you will turn ducks into human beings.


    # Audio Coverage


    Although the clock has a large range of operating frequencies, it doesn''t cover
    the end of the audio spectrum. Using the lowest frequency of 19.200 MHz and maximum
    DVI = 4,095, you get the lowest frequency of 4,689 Hz (for mash: 0). Given that
    the low E2 on a guitar is 82.41 Hz, you can see how much of the audio spectrum
    is unreachable.


    The 4689 kHz can be heard on a small speaker or through an amplifier. A quick
    test can be done by hooking up a 4.7 k to 5.6 ohm resistor in series with GPIO
    4 and an earphone (using an alligator jack to connect to one of the earphones
    in a pair; see Figure 6-3). Don''t use a lower valued resistor, which might damage
    your GPIO port (due to current and back electromagnetic frequency). You''ll be
    able to hear the 4689 kHz signal on and off: Using the **picl** command,


    ```

    $ piclk -g4 -i4095 -m0 -s1 -b

    ```


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_83_0.png)


    **Figure 6-3.** Alligator clips on a stereo headphone jack


    This command (with -b option) will "blink" at half-second intervals. Unless using
    an amplifier. When using an amplifier, be sure to turn the volume down before
    you start.


    If you need to cover the complete audio spectrum, you can add CMOS counters to
    divide by 256, driven by GPIO 4. This would bring your lowest frequency down to
    18.3 Hz.


    69'
