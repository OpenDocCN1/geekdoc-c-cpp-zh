  md: '# CHAPTER 6 GENERAL PURPOSE CLOCK


    # Maximum GPIO Output Frequency


    The Broadcom documentation states, “The maximum operating frequency of the General
    Purpose clocks is -125 MHz at 1.2 V but this will be reduced if the GPIO pins
    are heavily loaded or have a capacitive load. The Raspberry GPIO drivers are simply
    not up to the task of driving higher frequency signals, even when the internal
