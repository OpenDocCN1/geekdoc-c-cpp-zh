    red LED also came on (top side of the pcb).


    The +3V input is important to know that the level converter works most (supplies
    to

    high-side resistors on the 3V side). Without this feature, you would need to wire
    up the +3V input to

    Raspberry Pi''s3.3V input, in addition to supplying +5V to the other side. In
    my case, the +3V is already

    provided on the pcb and derived from the +5V input. So we wire the +5V to +5,
    but do not hook the +3V

    to your Raspberry Pi''s above 3.3V in this case.


    For the other level converters that do not generate the +3V supply, you will need
    to supply to it

    from the Raspberry Pi. In all cases, the +5V input should be wired to the 3V side
    signal level from ground to "high" (3V

    GPIO) will safely cause a ground near 5V change on the corresponding 5V signal-noise
    side. These are

    birectional converters and will work the same way in reverse, but we don''t need
    that for this project.


    # Interfacing GPIO to MAX7219


    The matrix PCB drives the LEDs by means of the MAX7219 IC. With the level converters,
    we can now

    interface the Raspberry Pi to that chip. Let''s review now the signal requirements
    of the MAX7219 IC.


    +   DIN: This signal is the data to be clocked serially into the MAX7219 IC.

    data clocked into the chip on the rising edge of the CLK signal. A high input

    registers as a 1 bit, whereas registers as a 0. This must be stable at least 25
    ns

    prior to CLK rising.


    +   CLK: This signal data in when it goes from low to high. This signal cannot

    operate above a 10 MHz clock speed.


    +   CS (on pcb), LOAD: When the LOAD signal goes from low to high (pin 12 of the

    MAX7219), the last 16 bits of data that have been clocked in are processed. The
    LOAD

    signal must be held low while data bits are being clocked in (at least 25 ns before

    the clock). The high and low period for the clock must be at least 50 ns in length.


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_37_0.png)'
  merge: -1
  pgno: 37
- img_proc: true
  md: '# CHAPTER 3 THE MATRIX (CPU UTILIZATION)


    The timings are mentioned because sometimes these things get overlooked on fast
    hardware, leaving us scratching our heads, wondering why a certain event hasn''t
    occurred. If we do things too quickly, the results are undefined.


    The Raspberry Pi 2 executes at an approximate MIPS rate of 1.9x clock speed in
    Mhz. This means it is possible to run about 1,710 million MIPS (per core). On
    average then, each instruction takes about 1.71 ns to execute. Consequently, it
    is possible to change GPIOs at an extremely high rate of change if we''re not
    careful.


    One thing about CLK signal is worth mentioning here. It doesn''t have to be periodically
    "regular." Nothing goes wrong if we hold the CLK signal high or low for long periods
    of time. We must simply allow enough time between different signal changes. We
    can use "bit-bang" these signals to the GPIO pins without any special driver code,
    interrupts, or timers.


    Figure 3-4 illustrates how the level converter can be soldered onto the pins for
    the LED matrix. V connects to the converter 5V pin and GND to Gnd. The three remaining
    matrix signal connections are connected to the 5V side of the converter. Pi GPIO
    signal connections can then be attached to the 3V header striped to the level
    converter pcb (at left in Figure 3-4).


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_38_0.png)


    Figure 3-4. LED matrix with level converter soldered on


    The 3V converter signal input is left unconnected (top left of Figure 3-4). Remember
    this, because when you light it up, you can find about how to connect to the three
    "end connections," but the very end connection should be left unconnected. I spent
    considerable time debugging before I discovered this error on my part! Also avoiding
    connecting GPIO lines to the 3V or Gnd pins of the level converter to avoid causing
    damage to the PI.


    # Absolute Maximum Ratings


    Before we look at programming the MAX7219 IC, there is one thing that you should
    be aware of (you likely won''t need to make any adjustments). On the pcb, there
    is a resistor Rss which is used to configure the MAX7219 IC''s maximum current
    for the LEDs. It is obscured by the LED matrix, so pry carefully from the socket
    (keeping track of which way it goes back). Figure 3-5 shows the components exposed.'
