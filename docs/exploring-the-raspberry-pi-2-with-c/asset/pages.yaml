  md: 'The one that deserves special mention in this circuit is the fact that the
    LED is driven without a limiting resistor. Normally the resistor is required and
    it is still good practice to use it. Here, it is possible to get away without
    it (if you like) because the circuit (for the Raspberry Pi) will be operating
    from 3.3V. Additionally, the CMOS output transient will be limited by the current
    that it can deliver at lower voltage level. IC2A will not be able to deliver more
    than 4 mA of current to the LED. So be certain to choose a small, low-current
    LED for the purpose.


    # The MC14490


    The contact bounce problem was serious enough to have a chip designed for the
    purpose. ON Semiconductor states their chip quality at 456 FETs (or 136.5 equivalent
    gates). The MC14490 (also known as CD4490) is a CMOS part and such, can operate
    from 3.0V to as high as 18.0V. Again, 3.3V operation is ideal for these chips
    probably counts to their higher price compared to other logic gates in the series
    (I purchased for ebay about a dollar each).


    The MC14490 works in a sampling principle. It clocks in samples of the input at
    intervals, arriving at on or off changes its output. If the internal shift register
    shows the samples all as zeros (contacts touched), the output goes low (0). Conversely,
    if the shift register shows the samples all as high (contacts open) the output
    changes to high (1). Changes due to jitters in the input signal are ignored at
    the output.


    Figure 10-6 shows a circuit with two push buttons (buttons for BIN EIN are not
    out but could be wired). AO is debounced for AIN, and so on. The MC14490 has built-internal
    pullup resistors for inputs, none are required externally (use care for static
    electricity in your handling).


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_121_0.png)


    Figure 10-6. The MC14490 Hex contact bounce eliminator


    The sampling frequency is determined by capacitor C1. The datasheet provides formulas
    for C1, for a given sampling frequency. For a sampling frequency 15 Hz, the formula
    provided by ON Semiconductor is $15 = 6.5/C$, where $C$ is in $\mu$F. Solving
    for $C_t$, we get the formula $C_t = 6.5/15$, which calculates as 0.43. The next
    standard size of capacitor would be this 0.47 $\mu$F. So a 0.47 $\mu$F capacitor
    should result in a sampling frequency of 13.8 Hz. Some experimentation might be
    required. Keep in mind that many capacitors have tolerances as wide as 30%.'
