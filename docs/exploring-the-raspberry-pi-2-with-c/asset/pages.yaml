  md: "APPENDIX C CLASS GPIO 3\n\n# GPIO::pwm\n\nThis static class method returns\
    \ information about the selected PWM peripheral and it's alternate function number\
    \ based on the input gpio number alone:\n\n```\nstatic int pwm(int gpio,int& pwm,IO&\
    \ altf);\n```\n\nExample code explains this better than words:\n\n```\nint rc,\
    \ pwm;\nGPIO::IO altf;\n\nrc = GPIO::pwm(13,pwm,altf);\nassert(!rc);\n// pwm ==\
    \ 1 (PwmM1)\n// altf == GPIO::Alt0\n```\n\nUpon successful return rc will contain\
    \ zero (or a system error code). When successful, pwm will be populated with the\
    \ PWM number that the gpio accesses. The argument altf returns alternate function\
    \ the PWM uses for this gpio. In the example (gpio=13), the alternate function\
    \ is returned as GPIO::Alt0.\n\n# GPIO::delay\n\nGPIO::delay static class method\
    \ takes no arguments. The call does not return until a short delay has occurred.\
    \ Some internals of the GPIO class make use of this since the CPU is able to act\
    \ faster than some peripherals respond:\n\nstatic void delay();\n\nIt is currently\
    \ implemented as follows, but may be amended in the future if the CPU pace increases\
    \ significantly:\n\n```\nvoid\nGPIO::delay() {\n  for ( int i=0; i<150; i++) {\n\
    \    asm volatile(\"nop\");\n  }\n}\n```\n\nFrom this, you can see the delay is\
    \ a matter of executing 150 nop instructions within a loop. An example of use\
    \ is:\n\n```\nGPIO::delay();\n```\n\n# GPIO::peripheral_base\n\nThis is another\
    \ static method that is used internally. This function opens and reads the Linux\
    \ pseudo file:\n\n```\n/proc/device-tree/soc/ranges\n```\n\n164"
