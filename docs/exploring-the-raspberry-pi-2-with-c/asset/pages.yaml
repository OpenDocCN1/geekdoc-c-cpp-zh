  md: "# Server Shutdown\n\nThe problem faced by the worker thread is how to make\
    \ it responsive to shutdown events. When the server is busy, this is not an issue\
    \ because the loop in Worker :dispatch can test the shutdown flag (shutdown).\
    \ But this flag is not tested when there are no incoming requests! It takes a\
    \ event to wake base_loop() to exit.\n\nThe way this problem solved was to create\
    \ an anonymous pipe (see Linux API for pipe(2)). We then add the read end of the\
    \ pipe to event_base. When the worker thread to exit (shutdown, we simply write\
    \ one byte to the pipe (from Worker :request_shutdown()). This wakes up the base_loop().\
    \ The registered callback for the base event invokes the worker's notify_cb()\
    \ callback, which sets the shutdown member to true. On return from this callback,\
    \ base_loop() returns, testing the shutdown flag at the top of the while loop.\n\
    \nThis process shuts down one worker thread. To shut down the entire server, the\
    \ shutdown request must originate with the class WebMain. This can then invoke\
    \ a thread-safe shutdown on all the worker threads (it is safe for any thread\
    \ to write into the shutdown pipe).\n\n# HTTP Processing\n\nWhen each worker thread\
    \ receives an HTTP request, it does some overhead processing and invokes the callback\
    \ registered for WebMain. In this manner, much of the grunt work is to care before\
    \ you use the request.\n\nThe basic handling looks like the following (slightly\
    \ trimmed for clarity):\n\n```\nstatic void\nhttp_callback(evhttp_request *req,const\
    \ char *uri,const char *path,Worker& worker) {\n\nif ( strcmpmp(path,\"/cpuinfo\"\
    ) == 0 ) {\n    worker.add(\"<html><head><ntitle>cpuinfo</title></head>\\r\\n\"\
    );\n    worker.add(\"<body><pre>\\r\\n\");\n\n    FILE *f = fopen(\"/proc/cpuinfo\"\
    ,\"r\");\n    if ( f ) {\n        char inbuf[1024];\n\n        while ( fgets(inbuf,sizeof(inbuf),f)\
    \ != nullptr ) {\n            char *cp = strchr(inbuf,'\\n\\');\n            if\
    \ ( cp != 0 && size_t(cp - inbuf) < size_t inbuf - 3 ) {\n                strcpy(cp,\"\
    \\r\\n\");\n            }\n            worker.add(inbuf,strlen(inbuf));\n    \
    \    }\n        fclose(f);\n    worker.add(\"</pre></body>\\r\\n\");\n} else {\n\
    worker.send_reply(200,\"OK\\n}\n```\n\nHere we test the path given to see if it\
    \ matches \"/cpuinfo\". If it does, we then copy the Linux /proc/cpuinfo file\
    \ to the response body. The worker.add() method is like printf, except that the\
    \ formatted content is sent to the response."
