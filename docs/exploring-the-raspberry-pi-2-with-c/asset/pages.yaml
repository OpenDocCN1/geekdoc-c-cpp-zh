  md: '# CHAPTER 10


    # # Debouncing


    The *idea* of attaching a push button to a GPIO input is deceptively simple. Use
    a push button and a couple of connections and some simple software to read a 1
    or 0, right? After all, it''s digital input and just 1s and 0s. It seems so elementary,
    yet things are more complicated than that.


    What actually goes against intuition because we think and operate more slowly
    than a digital circuit. The physical action of pushing a push button might require
    a half-second or so, so we tend to think in those terms. On the other hand, a
    digital circuit can react to a million of events in the same time frame.


    This chapter explores the push button and the problems it poses to electronic
    inputs. For the Raspberry Pi *maker*, this is a key thing to master when using
    GPIO inputs from a control panel. This chapter introduces students to some simple
    hardware solutions to the problem.


    # # Introduction


    The ideal signal to be seen and read by a GPIO input is shown in Figure 10-1.
    At rest, the signal is low (reading as 0). When pressed, the signal transitions
    to high (1) and remains high as long as the button is pressed. Figure 10-1 was
    a signal captured by PiSpy from a push button employing a debounce circuit.


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_117_0.png)


    **Figure 10-1.** Ideal debounced button press


    Figure 10-2 shows the result of a low-quality button closing. You can see that
    the contacts close near time 0, and go high and low several times, as the metal
    contacts bounce on and off. Much later the contacts eventually settle.'
