    Success! You could also review the dmesg output as a check, to see if any driver
    problems developed.


    # Recovering from Boot Failure


    Don''t panic if your new kernel doesn''t boot for some reason. We''ve left a way
    out so that we can easily recover. The /boot partition is a VFAT partition that
    Windows and Mac OS X can mount. Mount the SD card into your desktop and then simply
    rename your kernel back to the way it was. On Mac OS X, the session might look
    like this:


    ```

    $ cd /Volumes/untitled

    $ mv kernel7.img kernel7.bad

    $ mv kernel7.was kernel7.img

    ```


    > **Important** Make sure that you safely eject the SD card from the desktop or
    laptop. If you fail to do this correctly, unsaved changes to the /boot partition
    on the SD card will be lost.'
