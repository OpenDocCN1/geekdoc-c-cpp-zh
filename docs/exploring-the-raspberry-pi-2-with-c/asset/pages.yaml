  md: '# CHAPTER 4 INSTALLING A KERNEL


    Here is the general procedure:


    +   1. Change to root (using sudo) to gain permissions.

    2. Check to make /boot has sufficient disk space for the new kernel.

    3. Rename kernel7.img as kernel7.was (in case you want to put it back).

    4. Copy the new kernel into /boot/kernel7.img.

    5. Sync! Make sure disk changes are written to the SD card.


    Once that has been accomplished, you can reboot your new kernel.

    sudo as root and change to the /boot directory (its mounted file system):


    ```

    $ sudo -i

    root@raspy:~# cd /boot

    ```


    Check your disk space in /boot. It is a small partition so it is wise to manage
    your space wisely. In the session shown here, there is approx 38.6 MB of space
    available (our new kernel image requires 4 MB).


    ```

    root@raspy:$# df .

    Filesystem 1k-blocks Used Available% Mounted on

    /dev/mmblkp1 57228 18868 38600 33% /boot

    ```


    Next, rename kernel7.img to kernel7.was (or another name of your choosing). This
    keeps the current kernel in case something goes wrong.


    ```

    root@raspy:$# mv kernel7.img kernel7.was

    ```


    Now install the kernel by copying the adjusted image (current directory is /boot):


    ```

    root@raspy:$# cp /pi/linux/arch/arm/boot/kernel.img kernel7.img

    ```


    > Perform a sync command to force all disk writes in cache to be physically written
    out to the SD card. The critical flush is the mounted /boot filesystem. Do not
    skip this, even though a proper shutdown will automatically perform this. If these
    changes don''t get out properly, the next reboot will fail.


    ```

    root@raspy:$# sync

    ```


    Before reboot, do one last inspection. Is our new kernel properly named? Is the
    old one still available in case we have to back out the new one?


    ```

    root@raspy:$# ls -ltr

    total 22432

    -drwxr-xr-x 1 root root 1390 Apr 10 18:50 config.txt

    -drwxr-xr-x 1 root root 4024660 Apr 11 14:38 kernel7.img

    -drwxr-xr-x 1 root root 3986468 May 15 22:27 kernel7.img

    ```'
