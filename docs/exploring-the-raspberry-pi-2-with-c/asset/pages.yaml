  md: '# Triggers


    When you have a continuous wave form, like perhaps a PWM signal, then you don''t
    need a trigger. You simply capture a certain amount of time and display the signal.


    For other types of signals, there can be hundreds of milliseconds between interesting
    events. Trying to capture the interesting part can be challenging without a triggered
    capture.


    The pispy tool supports a limited form of triggering. The types of triggering
    options are as follows:


    +   - Trigger a capture on a rising GPIO (-R gpio)

    - Trigger a capture on a falling GPIO (-F gpio)

    - Trigger a capture on a high-level GPIO (-H gpio)

    - Trigger a capture on a low-level GPIO (-L gpio)


    These options can be combined, if necessary (but only for the same GPIO). So what
    are the limitations? The DMA capture performs the sampling of the GPIO pins. This
    is faster and more reliable than trying to do so from software. We set up the
    DMA control block(s) and unleash it, the DMA peripheral rips through its control
    blocks at breakspeed. We can start or abort a DMA transfer. So pispy performs
    the following to implement trigger functionality:


    +   1. Set up DMA control blocks and start the capture.

    2. pispy waits for the first interrupt (first block has been captured).

    3. While the DMA continues (for multiblock captures), pispy examines the first
    block for a trigger event.

    4. If the trigger event has been found in the first block, the capture is permitted
    to run to completion.

    5. Otherwise, pispy aborts the current DMA capture.

    6. If the number of tries has not been exceeded (option -T), repeat from Step
    1.


    For this reason, triggers must also provide a number of tries using the -T option.
    The following example shows an attempt to capture a rising edge on GPIO 4, trying
    virtually forever:


    ```

    $ pispy -b6 -R4 -T99999

    ```


    # GtkWave


    The gtkwave command is used to display the captured content, written to the file
    named capture .vcd.

    If you run pispy from the desktop, or using an X Window session in ssh, pispy
    will invoke gtkwave automatically (unless the -x option was provided). When using
    ssh, be sure to add the -X option. From my Mac, I often use the following:


    ```

    $ ssh -X pi@192.168.2.4

    ```'
