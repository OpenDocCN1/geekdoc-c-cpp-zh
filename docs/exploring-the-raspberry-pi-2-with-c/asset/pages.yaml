  md: '# GPIO::stop_clock


    Use the stop_clock() method when you need the clock peripheral stopped.


    ```

    int gpio.stop_clock(int gpio);

    ```


    The clock peripheral is chosen by the gpio number (review method config_clock()
    for the chart of values). A return status of zero is returned from stop_clock()
    when successful or else system error code is returned.


    Note that there can be a delay as the routine waits for a successful status change
    before returning to the caller.


    The following is an example of stopping the general purpose clock:


    ```

    GPIO gpio;

    ...

    int rc;


    rc = gpio.stop_clock(gpio);

    assert(!rc);

    ```


    # GPIO::pwm_configure


    The pwm_configure() takes care of a number of steps necessary to get the PWM peripheral
    of choice started. There is a finicky peripheral to get started. There are two
    use PWM peripherals available:


    +   1. PWM0

    2. PWM1


    Both of these share the same clock (this clock is not the same as the General
    Purpose Clock). The following general steps are performed by this method:


    +   1. DMA is disabled (if it was used before)

    2. The PWM peripheral is disabled

    3. A short delay is performed

    4. Peripheral error flags are cleared

    5. PWM parameters are configured

    6. The FIFO is cleared

    7. Another delay of 10 µs is performed


    Prior to invoking this method, it is expected that you would have configured the
    PWM clock with start_clock(), unless this has already been done. The calling signature
    is as follows:


    ```

    int pwm_configure(

    int gpio,

    PwmMode mode,

    bool repeat,

    ```'
