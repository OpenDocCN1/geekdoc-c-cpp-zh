- img_proc: true
  md: 'The -p (pullup) option allows you to configure this. The -p option takes one
    of three possible arguments:


    +   * n (no pullup)

    * u (pullup)

    * d (pulldown)


    The following example configures GPIO 4 as an input, with a puldown resistor applied:


    ```

    $ gp -g4 -i -pd

    ```


    Although the internal SoC pullup/pulldown resistor suffices for many situations,
    it might not be suitable for all applications. It is a weak resistor (approximately
    50K ohm).


    # Setting GPIO Output


    A GPIO can have its output level set using the gp command. The following sets
    GPIO 4 to a low (0) level:


    ```

    $ gp -g4 -s0

    ```


    In this example, the GPIO 4 is assumed to be previously configured as an output.
    Note that if the GPIO is not configured to be an output, the value can be established
    anyway. It will simply not be available at the GPIO pin.


    # Reading GPIO Input


    The gp command can read a GPIO input. The following example configures GPIO 4
    as an input, configures the pulldown resistor, and reads the input appearing at
    the pin:


    ```

    $ gp -g4 -pd -ir

    GPIO 4 = 0 (-r)

    ```


    In this example (on my Pi), the GPIO 4 is unconnected. Because it was configured
    as an input, with a pulldown resistor, the input read as low (0). If we use a
    pullup instead with this unconnected GPIO, we should be able to read a high level
    on the pin (1):


    ```

    $ gp -g4 -pu -ir

    GPIO 4 = 1 (-r)

    ```


    This is confirmed in the output. If, however, the GPIO pin is connected to something,
    then that determine how the pin reads.'
  merge: -1
  pgno: 68
- img_proc: true
  md: '# Returning GPIO Value to Shell


    If you''re writing a shell script to read the GPIO value and act on the result,
    the -r option is inconvenient because it requires parsing the output text. The
    -x option is identical to the -r option, except that it also returns the result
    in the `gp command''s exit code as 0 or 1. Notice the result of the shell $ variable
    here:


    ```

    $ gp -g4 -pu -ix

    GPIO 4 = 1 (-r)

    $ echo $?

    1

    $ gp -g4 -pd -ix

    GPIO 4 = 0 (-r)

    $ echo $?

    0

    $

    ```


    To distinguish between a successully read GPIO and a command failure, exit codes
    are 2 or higher returned when the command, as demonstrated here:


    ```

    $ gp -badddd

    No gpio specified with -g (-b addddd)

    $ echo $?

    2

    $

    ```


    # Reading 32 GPIOs


    If you need to read all 32 GPIO pins at once, use the -w option (no -g option
    required):


    ```

    $ gp -w

    GPIO: 0xB421C1EF (-w)

    $

    ```


    The result of all GPIO pins 0 through 31 is returned as a hexadecimal number.
    GPIO 0 is the least significant bit of this value, and GPIO 31 is the most significant.


    # Read GPIO Alternate Function


    Although you can display all GPIO pins with the -D option, you might just want
    to view the alternate function pin (perhaps from a shell script):


    ```

    $ gp -g16 -A

    GPIO 16 : Alt5 (2)

    $

    ```


    This output informs us that GPIO 16 is configured as alternate function 5. The
    value in brackets is the actual value used to configure the GPIO (alternate function
    5 is integer value 2).'
  merge: -1
