    # Class GPIO 1


    The library class GPIO provides a very simple API to work with the Raspberry Pi
    GPIO hardware in a C++ program. Using this library class, you can immediately
    work to define your application rather than rewrite or adapt the code.


    This appendix is useful for those wanting:


    +   - Learn about the file and linking options necessary to use librpi2

    - Use and understand the GPIO::GPIO class constructor.

    - Configure a GPIO for Input/Output or Alternate Function

    - Configure a GPIO pullup or puldown resistor

    - Configure a GPIO drive strength, hysteresis, or slew rate

    - Query the configuration of a GPIO pin

    - Read or Write a GPIO pin

    - Configure and Read GPIO "events" on a pin (or all pins)


    # Assertion Macro Note


    In various program fragments, you will often see the use of the C language assertion
    macro. Its support is provided by the following file:


    ```

    #include <assert.h>

    ```


    This facility is used to force an abort after an informative message when the
    unexpected occurs. For example, if a return code rc is expected to succeed, then
    the following assertion macro is a safeguard:


    ```

    int rc;

    ssert(!rc); // Abort if rc != 0

    ```


    The argument expression to the macro must evaluate true. Otherwise it is designed
    to print to the terminal the source module name and line number, followed by an
    abort. This is extremely useful in places where you don''t expect to see a failure,
    but still that check in case it does. This safety mechanism saves a great deal
    of debugging time!'
