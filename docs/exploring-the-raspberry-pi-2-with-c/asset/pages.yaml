  md: '# CHAPTER 6 GENERAL PURPOSE CLOCK


    The remaining display columns have the following meanings (to be explained later):


    +   - DIVI: Integer clock divisor value

    - DIVF: Fractional clock divisor value

    - MASH: Mash setting

    - ENAB: Enabled (Y) or not (N)

    - SRC: Clock source


    # Clock Source


    Every clock needs an oscillating source from which to derive its output. The sources
    available in the Raspberry Pi include the following:


    +   - 0: Grounded (no clock)

    - 1: Oscillator (19.2 MHz)

    - 4: PLLA (audio -393.216 MHz)

    - 5: PLL (1,000 MHz, affected by overclocking)

    - 6: PLLD (500 MHz, default)

    - 7: HDMI Aux (216 MHz)?


    The others that are not listed are either not useful or they''re documented.

    The first source is listed as grounded (source 0). A grounded source is not an
    oscillator, so it has the effect of causing the clock to stop, with no clock output.
    The other clocks listed operate at various frequencies. The most useful one for
    your experiments will be clock source 1 (19.2 MHz) because of pispy. Finally,
    source 4 allows us to perform one radio frequency (RF) experiment.


    # Clock DIVI


    The DIVI value is an integer divisor that is used by the clock on the source signal.
    Let''s generate an F = 100 KHz signal on GPIO 4. We''ll simply set DIVF and MASH
    equal to zero for now. We''ll use source 1 (19.2 MHz), so we need to calculate
    the divisor:


    ```

    DIVI = clock_src / F

    = 19,200,000 / 100,000

    = 192

    ```


    Let''s now set the clock GPCLK0 to this:


    pickl -g4 -i192 -f0 -m0 -e1 -s1 -vD

    Clock started.

    and driving gpio 4.'
