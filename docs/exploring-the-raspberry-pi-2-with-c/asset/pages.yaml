    ```\n\nWe can adjust the balances of all clients using the following loop:\n\n\
    ```\nfor ( auto it = clients_map.begin(); it != clients_map.end(); ++it ) {\n\
    \    it->second.balance -= some_adj;\n}\n```\n\nThis code compiles and executes\
    \ fine, but the iterator makes the code less clear. The problem is\nit it->second\
    \ doesn't indicate what data type you are accessing. You have to examine the definition\
