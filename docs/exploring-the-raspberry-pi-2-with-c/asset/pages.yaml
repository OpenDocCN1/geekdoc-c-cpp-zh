    \ guaranteed to succeed because they share common resources.\n\nAn example instantiation\
    \ is given below:\n\nGPIO gpio;\n\n```\nif ( gpio.get_error() != 0 ) { // Test\
    \ that GPIO opened ok\n    fprintf(stderr,\"%s: GPIO!\\n\",strerror(errno));\n\
    \    }\n```\n\n```\nMAX7219 max7219(16,26,21); // Instantiate max7219 device\n\
    ```\n\n# MAX7219::enable\n\nUse this method to enable the MAX7219 chip. With the\
    \ process of powering and configuring the GPIO pins, it is possible for the GPIO\
    \ to go into a \"shutdown\" state.\nThe Maxim datasheet warns:\n\n+   * Typically,\
    \ it takes less than 250us for the MAX7219/MAX7221 to leave shutdown mode. The\
    \ display driver can be programmed while in shutdown mode, and shutdown mode can\
    \ be overridden by the display-test function.\n\nSo allow some time when bringing\
    \ the device out of shutdown mode.\nThe prototype is as follows:\n\n```\nint MAX7219::enable();\n\
    ```\n\nThe call returns an error (non-zero) if the GPIO operation fails. Here\
    \ is some example code:\n\n```\nMAX7219 max7219(16,26,21);\nint rc;\nrc = max7219.enable();\n\
    assert(!rc);\n```\n\n# MAX7219::config_intensity\n\nThis method controls the intensity\
    \ of the MAX7219 driver output in levels from 0 to 15:\n\n```\nint config_intensity(int\
    \ n);\n```\n\nThe method returns EINVAL if the n is out of range. Otherwise zero\
    \ is returned for success. When initializing a display, it is best to configure\
    \ it to the lowest intensity until fully configured to avoid burning LED segments\
    \ or pixels (depending on what the device is hooked up). An example of this is\
    \ given here:\n\n```\nMAX7219 max7219(16,26,21);\nint rc;\nrc = max7219.config_intensity(0);\
