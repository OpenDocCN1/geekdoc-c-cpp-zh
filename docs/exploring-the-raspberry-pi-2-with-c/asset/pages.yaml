    Here we see the result of the pushbutton, grounding the GPIO 4 input that was
    pulled high by the configured pull resistor. As the contact bounce, the GPIO input
    read 1s and 0s.


    # Configuring GPIO Slew Rate


    The GPIO pins provided by the SoC can be configured to be slew rate limited (as
    outputs). This is enabled by default. The configuration of this affects GPIO pins
    in groups:


    +   * GPIO 0 to 27

    * GPIO 28 to 45

    * GPIO 46 to 53


    The command does not support GPIOs above 31, as these are used by the system and
    should not be altered. Use this option with care.

    What does it mean to be slew rate limited? A simple explanation is that a slew
    rate limited output is slowed down as it transitions from low to a high level
    (or vice versa). One of the benefits of this is to reduce the amount of radio
    interference.'
  merge: -1
