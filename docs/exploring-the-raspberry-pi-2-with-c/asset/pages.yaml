  md: "# MTop::total_cpu_pct\n\nWhen the method total_cpu_pct() is called immediately\
    \ after the sample() method, a total CPU utilization is worked out in a percentage\
    \ (0.0 to 100.0). This is used by the mtop utility to drive the total CPU usage\
    \ meter, as described in Chapter 3. The function prototype is:\n\n```\ndouble\
    \ total_cpu_pct() const;\n```\n\nAn example of the use of this is provided below:\n\
    \n```\n#include <vector>\n\nMTop mtop();\nstd::vector<double> cpus;\ndouble total_pct;\n\
    \nmtop.sample(cpus); // Initial sampling\n\nfor (;;) {\n    mtop.sample(cpus);\
    \ // Return sampling differences\n    total_pct = mtop.total_cpu_pct();\n\n  \
    \  for ( size_t cpu=0; cpu<cpus.size(); ++cpu) {\n        double pct_utilization\
    \ = cpus[cpu];\n    }\n}\n```\n\n# MTop::memory_pct\n\nThe memory_pct() method\
    \ takes a look at the system at the time of the call and determines the system\
    \ memory usage as a percentage of the total available memory. Its purpose is to\
    \ return a percentage that can be displayed on the matrix display. The calling\
    \ signature is simply:\n\n```\ndouble memory_pct();\n```\n\nIts use within the\
    \ sampling loop is shown below:\n\n```\n#include <vector>\n\nMTop mtop();\nstd::vector<double>\
    \ cpus;\ndouble total_pct, pct_memory;\n\nmtop.sample(cpus); // Initial sampling\n\
    \nfor (;;) {\n    mtop.sample(cpus); // Return sampling differences\n    total_pct\
    \ = mtop.total_cpu_pct();\n    pct_memory = mtop.memory_pct();\n}\n```"
