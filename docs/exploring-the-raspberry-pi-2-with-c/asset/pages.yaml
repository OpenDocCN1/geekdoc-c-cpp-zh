- img_proc: true
  md: '# CHAPTER 6


    # General Purpose Clock


    The Raspberry Pi has two hardware clocks available for the end user (the others
    are reserved or used by the system). One of these accessible clocks is used for
    Pulse Width Modulation (PWM), which is the subject of Chapter 7. The other is
    known as GPCLK0 in the Broadcom vernacular.


    To assist in our exploration, the piclk command has been provided as part of this
    book''s included software. This saves us from writing experiments to conduct remains
    and as a tool for you to use.


    # The piclk Command


    If you installed the book''s provided software, the piclk command should be immediately
    available as follows:


    ```

    $ piclk -h

    Usage: piclk [-g gpio] [-i divi] [-f divf] [-m mash] [-e 1:0] \\

    [-s src] [-q] [-z] [-D] [-v] [-h]

    where:

    ```


    ```

    -g gpio    clock chosen by gpio # (default 4)

    -i divi    idiv divisor value (5)

    -f divf    divf divisor value (0)

    -m mash    Mash value 0-3 (0)

    -e enable Enable/disable on gpio (1)

    -s src      Select clock source

    -q         Don''t stop the clock (used with -D)

    -z         Stop the clock peripheral

    -b         Blink on/off in .5 second intervals

    -D         Display clock settings

    -v         Verbose

    -h         This info.

    ```


    Notes:


    +   * Clock drives gpio 4, when enabled (-e1).

    * Defaults to 100 MHz (-i5 -f0 -m0 -e1)

    * Enabled on gpio pin by default (-e1)

    * Most other options are ignored when -z is used.

    * GPCLK on gpio 4 needs Alto (use -e1)

    * PWM on gpio 12 or 13 needs Alto (use -e1)

    * PWM1 on gpio 18 or 19 needs Alts (use -e1)

    * GPCLK output is a clock (C), vs PWM output (P)'
  merge: -1
