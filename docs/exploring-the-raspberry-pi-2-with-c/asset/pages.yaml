  md: "# Momentary Debouncing\n\nIn the book *Mastering the Raspberry Pi (Apress,\
    \ 2014)* a CD4013 flip-flop circuit was used to debounce a button or switch. For\
    \ buttons, however, the flip-flop circuit is inconvenient because it requires\
    \ both normally open and normally closed contacts. This mandates more expense\
    \ and additional wiring. \n\nA simpler and more economical solution is shown in\
    \ Figure 10-3, using a Schmitt trigger (CD40106 in this case). The button is represented\
    \ by S1, connected to resistor R1 and capacitor C1. These together with the Schmitt\
    \ trigger action of IC1A, result in a clean debounced output signal appearing\
    \ at OUT. Because it is an inverter, the output is produced while the button is\
    \ pressed. An advantage of the hex inverter part is that the CD40106 means that\
    \ you get six of these for the price of one.\n\n![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_119_0.png)\n\
    \n**Figure 10-3.** A momentary button debounce circuit\n\n# Toggled Debouncing\n\
    \nSwitches can be expensive to buy and install in quantity. Buttons, on the other\
    \ hand, can sometimes be inexpensive by comparison. If you were able to use a\
    \ button to toggle a signal, you could use a button as a switch. Figure 10-4 illustrates\
    \ a simple way to do this reliably using the CMOS part CD4049."
