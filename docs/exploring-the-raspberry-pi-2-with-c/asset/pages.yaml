- img_proc: true
  md: '# CHAPTER 8 ■ PHYSICS OF THE GPIO INTERFACE


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_98_0.png)


    **Figure 8-2.** LTspice simulation of the circuit in Figure 8-1


    Initially when the gate voltages for M1 and M2 are at +3.3V, we see that the current
    R1 is at 5 mA, and the current I(R2) is near zero. Effectively M1 is fully on,
    and M2 (PMOS) is fully off. Just before the gate voltage drops to the 1.7 level,
    NMOS M2 turns on as I(R2) jumps up to 5 mA. Shortly after, M1 turns off as the
    current I(R1) drops near zero. As time progresses, we see that this state of affair
    remains stable until the gate voltage crosses the threshold again going up. The
    important point to note is that the NMOS transistor M1 has gone from the initial
    "on" to "off," whereas the complementary M2 PMOS goes from "off" to "on." This
    occurs at approximately half of the supply voltage level.


    In looking at this circuit it is helpful to think of the PMOS transistor M2 operating
    upside down. Its source is connected to the supply and feeding current to R2,
    which is connected to ground. The PMOS circuit is the upside-down version of the
    NMOS circuit M1 and R1. The gates, however, are connected together and thus see
    the same input signal. M2 is reacting to the gate voltage relative to its own
    source terminal, though, M1, on the other hand, sees the gate signal relative
    to ground where its source is connected.


    If transistors M1 and M2 were exact complementary matches in the simulation, the
    transition would have occurred at the exact same time. It should be kept in mind
    that in real components, the complementary transistors are never perfectly matched.
    Some difference will always exist. For this reason, there can be regions of overlap,
    where M1 and M2 are conducting at the same time. We''ll see this when we examine
    the CMOS configuration.


    # CMOS Configuration


    In the preceding section we looked at the individual behaviors of the NMOS and
    the PMOS transistor with their gates connected together. We made note of the fact
    that when one turns on that the other turns off and vice versa. This behavior
    is exploited in the CMOS configuration, depicted in Figure 8-3.


