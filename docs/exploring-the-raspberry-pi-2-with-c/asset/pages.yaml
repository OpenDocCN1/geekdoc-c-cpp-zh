  md: 'This determines the peripheral base value for:


    +   - Raspberry Pi (0x20000000)

    - or RasberryPi 2 (0x3F000000)


    The method calls no parameters and returns the peripheral base address:


    ```

    static uint32_t peripheral_base();

    ```


    In this particular case, the value returned should be one of the values listed
    above. When zero is returned, the procedure has failed.


    # GPIO::source_name


    This static method converts a GPIO::Source constant into a string, so that it
    can be printed:


    ```

    static const char *source_name(GPIO::Source src);

    ```


    For example:


    ```

    GPIO::Source src = GPIO::Oscillator;

    const char *description = GPIO::source_name(src);

    printf("Source is %s\n",description); // "Oscillator"

    ```


    # GPIO::alt_name


    This is static method to return a descriptive string that can be printed. This
    method takes a GPIO::IO input and returns descriptive text for this:


    ```

    static const char *alt_name(IO io);

    ```


    The following illustrates the call:


    ```

    GPIO::IO io = GPIO::Output;

    const char *description = GPIO::alt_name(io);

    printf("io = %s\n",description); // "Output"

    ```


    # GPIO::gpio_alt_func


    This static method calls returns descriptive text for a given gpio pin and GPIO::IO
    setting:


    ```

    static const char *gpio_alt_func(int gpio, IO io);

    ```


    The following is an example:


    ```

    int gpio_no = 20;

    GPIO::IO io = GPIO::Alt4;

    const char *desc = GPIO::gpio_alt_func(gpio_no,io);

    ```


    ```

    // Returns desc = "SPI1_MOSI"

    ```'
