  md: '# CHAPTER 3 THE MATRIX (CPU UTILIZATION)


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_39_0.png)


    **Figure 3-5.** Location of $R_{set}$ on the matrix pcb (R1 = 10K)


    The unit I purchased uses a $R_{set}$ ($R_n$ on the pcb) value of 10K (white arrow
    in Figure 3-5). The removed LED matrix part number was 108AS. Looking up that
    datasheet provided the following information (these parameters vary among manufacturers):


    +   - Forward current: 2.1V to 2.5V

    - Forward current: 20 mA (other datasheets list this as the absolute maximum)


    The MAX7219 chip is limited to approximately 1066 mW at 70°C. Using the datasheet
    and the LED parameters, I was able to calculate that this pcb is safe at maximum
    brightness without the absolute limit (a good datasheet exercise for the reader).

    nReviewing the MAX7219 datasheet, you might have noticed that the $R_{set}$ value
    of 10K is designed to deliver 40 mA at maximum brightness (20 mA the limit for
    our LED). However, this is safe if the duty cycle is not 100% (continuous). When
    scanning eight rows of LEDs, a given row of LEDs is only consuming 1/8 of the
    power. One datasheet, in fact, notes that the "Forward Current is 100 mA [1]"

    In this connection, software can configure the MAX7219 IC to display fewer than
    eight (one is the default on power). If your software does this purposely or by
    accident, correct the situation as soon as possible (removing the Matrix pcb +5V).
    With fewer rows to display, the duty cycle for each row of LEDs is 1/8 duty 12.5%,
    but 1 in 100! It is possible for software to destroy hardware.


    # MAX7219 Commands


    The MAX7219 is interfaced to its microprocessor using a serial interface. We''ve
    already briefly looked at the three input signals CLK, DIN, and LOAD. The CLK
    signal does not need to be of a regular clock period, so we can say "bit-bang"
    all of the signals to the IC using GPIO signals. We only need to make certain
    that certain events do not happen too quickly.


    The input to the device is a 16-bit word, where the most significant bit (MSB)
    is shifted in first. The general format of the command word is illustrated in
    Table 3-1.


    23'
