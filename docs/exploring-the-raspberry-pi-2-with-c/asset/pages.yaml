    \nFigure 5-1. LED driven by GPIO\n\nThe -b option assumes that the GPIO has already\
    \ been configured as an output. The option takes an argument, representing the\
    \ number of seconds to blink for. Specifying zero will cause it to blink forever\
    \ until Control-C out of it. The following example configures GPIO 4 as an output\
