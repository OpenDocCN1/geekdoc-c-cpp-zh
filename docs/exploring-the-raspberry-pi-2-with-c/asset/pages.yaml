  md: "CHAPTER 11 ■ C++ QUICK START\n\nCXX = $(shell 1 ls /usr/bin/g++*-tail -1)\n\
    \nCXXSTD =? c++11\n\nPREFIX =? /usr/local\n\nThe line starting with CXX = normally\
    \ discovers the most current version of g++ installed on your Raspian Linux system.\
    \ If this is failing, replace that with a hard-coded reference to the compiler\
    \ you want to use. For example, to force the use of g++4.7, you can use CXX =\
    \ /usr/bin/g++-4.7.\nCompilers older than g++4.7 do not support the option -std=c++11,\
    \ which we need for this book.\n\n# From C to C++\n\nA few things change when\
    \ you go from the C language to C++. One of the subtle changes is that the C language\
    \ struct is in the same namespace as all other types. Consider the following C\
    \ language example t.c:\n\n```\n#include <stdio.h>\n\nint\nmain(int argc, char\
    \ **argv) {\n    struct my_struct {\n        int id;\n    };\n    typedef struct\
    \ my_struct my_struct;\n    struct my_struct a;\n    struct my_struct b;\n\n \
    \   a.id = 0;\n    b.id = 1;\n\n    return 0;\n}\n```\n\nThis C program will compile\
    \ and execute fine. Note that my_struct is distinct from the type name my_struct\
    \ (even though ultimately they use the same definition).\nWhen we enter the C++\
    \ realm, this code fails to compile. If I rename the program file t.c to t.cpp\
    \ and a C++ compiler on it, it gets the following errors:\n\n```\nt.cpp:9:12:\
    \ error: using typedef-name 'my_struct' after 'struct'\nt.cpp:8:30: error: 'my_struct'\
    \ has a previous declaration here\n```\n\nThis is telling us that the type my_struct\
    \ is already defined by the time it sees the typedef line. This confirms that\
    \ the struct name and the typedef names are in the same namespace.\nWhy is this\
    \ important? It means that you no longer have to say struct my_struct in your\
    \ code to declare a new instance of it (i.e., you can drop the keyword struct).\
    \ You can simply use the structure name like any other type. Once the structure\
    \ is defined, you can declare an instance of it as:\n\nmy_struct s;\n\n114"
