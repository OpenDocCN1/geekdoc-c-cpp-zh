    # # Summary


    In this chapter, we have explored the General Purpose Clock (GPCLOCK) the Raspberry
    Pi provides. The book''s pick command was explored and used to experiment with
    the clock. Most important, you learned the procedure for choosing the DIVI and
    DIVF parameters so that you can compute your target frequencies. We also explored
    using the clock as a BFO, giving you a taste of radio theory. Finally, you saw
    that radio frequencies can be generated and received on your FM stereo receiver.
    All of these things demonstrate the flexibility of the Raspberry Pi.


