    # GPIO::GPIO Constructor


    The GPIO class is simply instantiated without arguments where you need it. For
    example:


    ```

    #include <librpi2/gpio.hpp>

    ```


    ```

    int

    main(int argc,char **argv) {

    GPIO gpio;

    ```


    But you should plan your placement addresses carefully, since upon construction,
    the GPIO class performs the following behind the scenes:


    +   1. Locks an internal mutex (for thread safety)

    2. Determines the physical Broadcom peripheral base address

    3. Maps the GPIO peripheral registers into memory at a system-assigned address

    4. Saves some memory addresses to allow access to the registers

    5. Unlocks the mutex


    Essentially, after performing the mutex lock, the code checks to see if another
    instance of the GPIO class (perhaps in another thread) has already done this procedure.
    If it has been done, the current constructor simply uses the information already
    gathered. The constructor is thread safe, allowing you to instantiate the GPIO
    class from multiple points of your application.'
