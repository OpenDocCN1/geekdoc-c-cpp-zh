  md: "# MAX7219::config_digits\n\nAfter setting a low intensity for the driver, it\
    \ is necessary to select the number of digits. This is equally important, for\
    \ example, if the device is currently showing only one digit, the display current\
    \ will be large since there are no other digits with which to multiplex. The following\
    \ shows the method calling signature:\n\n```\nint config_digits(int n_digits);\n\
    ```\n\nThe call returns zero for success otherwise a system error code. EINVAL\
    \ is returned if the number of digits is out of range.\nnThe following code illustrates\
    \ how to select a display to use digits:\n\n```\nMAX7219 max7219(16,26,21);\n\
    int rc;\n```\n\n```\nrc = max7219.config_digits(8);\nassert(!rc);\n```\n\n# MAX7219::config_decode\n\
    \nThe MAX7219 driver chip is capable of driving LEDs as individual data bits or\
    \ decoding the pattern into a seven-segment display (with decimal point). To control\
    \ this, use:\n\n```\nint config_decode(int digit,bool decode);\n```\n\nThe call\
    \ returns zero when successful, otherwise a system error code is returned.\nTo\
    \ set the device not to decode for a given digit (as we do with the Matrix project),\
    \ use the loop shown below (for eight rows):\n\n```\nMAX7219 max7219(16,26,21);\n\
    int rc;\n```\n\n```\nfor ( int dx=0; dx<=7; ++dx ) {\n  max7219.config_decode(dx,0);\
    \ // No BCD decode\n}\n```\n\nIf you're drawing a seven-segment display, you'll\
    \ likely want to use the segment decode logic of the chip for each digit indent.\
    \ Change the loop to:\n\n```\nfor ( int dx=0; dx<=7; ++dx ) {\n  max7219.config_decode(dx,1<<dx);\
    \ // Decode BCD for digit dx\n}\n```\n\nThe above loop configures 1 bit for each\
    \ digit that needs to be decoded."
