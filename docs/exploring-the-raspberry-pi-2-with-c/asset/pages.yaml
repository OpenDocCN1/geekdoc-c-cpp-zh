  md: 'CHAPTER 10 DEBOUNCING


    # # Summary


    CMOS inputs, including Raspberry Pi GPIO inputs, require contact debouncing when
    connected to buttons, switches, or relay contacts. Manufactured buttons work pretty
    good these days, but they can still provide shaky contact and release signals.
    You can eliminate Murphy''s Law up front (“If anything can go wrong, it will\”).
    Without debounced inputs, the interface might work fine until you decide to demonstrate
    it.


    This chapter has highlighted three different circuits for debouncing. I encourage
    you to try them all on a breadboard. This list is by no means exhaustive, but
    these should be easy to replicate.


    The first was a simple way to produce a debounced momentary push button input
    using Schmitt triggers. It required only a resistor and capacitor for analog components.
    The second circuit is interesting because it allows you to use a button as a switch
    by toggling the output with each button press. It does have the disadvantage of
    needing user feedback and requires more components. The final circuit, using the
    MC14490, is perhaps the easiest to use of all. It requires only one analog component
    (capacitor) and provides six debounced outputs. Additionally, other MC14490 chips
    can be wired to use the first one''s clock output, requiring only one capacitor
    for the entire group.


    112'
