  md: 'The best pens use are round on the outside and made of fairly sturdy plastic.
    This particular pen was a bit softer than I. Remove the ballpoint and ink, discard
    the end cap. With a small pipe cutter (see Figure 2-6), cutting off a small piece
    from the end to test the plastic. If you find it too soft, then try a different
    pen. Earlier, I had a free one from a hotel that was just perfect. I wish I had
    more of those.


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_25_0.png)


    **Figure 2-6. A small pipe cutter


    Locate some screws that will be long enough to go through the pcb and into the
    wood (3/4 inch) and be small enough to pass through the pcb holes. My screws wouldn''t
    quite fit through the pcb so I had to carefully shave off some pcb using a drill
    bit. I used a bit that fit inside the hole, but by working the drill bit around
    a little, I was able to get the small amount of extra clearance that I needed.
    Be very careful about this, though. Any brute force applied could ruin your Pi.


    With your wood ready and your wood screws chosen, determine the length of the
    spacers you need. Don''t forget to allow for the pcb thickness. In my case, I
    settled on a spacer length of about 9 mm. Figure 2-7 shows me cutting a spacer
    from the pen.'
