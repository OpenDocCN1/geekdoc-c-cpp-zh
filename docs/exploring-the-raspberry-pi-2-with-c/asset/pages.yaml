  md: '# CHAPTER 5


    # 3 GPIO gp Command


    The Raspberry Pi has a rich pool of resources to draw from. The GPIO resources,
    however, make possible to interface it to all kinds of unplanned applications.
    In this chapter, we introduce the gp command and illustrate its use cases.


    # Unix Command Line Convention


    Some folks jumping into the Raspberry Pi are also jumping into Linux for the first
    time, before we look at the gp command and its options, it is worth noting the
    Unix (and thus Linux) command line convention. Knowing the rules will help you
    understand and apply the more complex command line sequences.


    When Unix was being developed (prior to Linux), programmers quickly recognized
    that command option processing needed to be done by some common library. Otherwise
    each command would not only have its own unique code for option parsing, but it
    was likely that each command would have its own varying conventions.


    > The getopt(3) library routine was the answer to this problem. Interested folks
    can read about it by:


    ```

    $ 3 getopt

    ```


    on your Pi. This getopt(3) routine provided consistency among Unix commands and
    saved programmers from having to code the option parsing themselves. In later
    years, GNU added getopt_long(3) to allow long options.


    The general convention used by Unix commands is the following:


    ```

    $ command -options arg1 arg2 ... argn

    ```


    In other words, options, when specified, are always given after the command name
    and before the arguments (if any). Arguments (when given) always follow the options.

    The options are separated from the arguments by a leading hyphen. For example,
    you can get help information from your gp command using:


    ```

    $ gp -h

    ```


    The hyphen in front of the h indicates to the command that it is an option letter
    (not a file name).

    Some options can have arguments. For example, you might use the gp command to
    set GPIO 4 to an output like:


    ```

    $ gp -g 4 -o

    ```'
  merge: -1
  pgno: 62
- img_proc: true
  md: '# CHAPTER 5 3 GPIO GP COMMAND


    The 4 after the option -g is an argument to that option. The following -o is simply
    another option indicating that the selected GPIO is to become an output (which
    takes no argument).


    The argument and the option do not need to be separated by a space, however. The
    following is perfectly valid and equivalent:


    ```

    $ gp -4 -o

    ```


    Sometimes options that take arguments can cause trouble. If you forget that option''s
    argument, the following option may be interpreted as its argument. This kind of
    error can be vexing as it leaves you wondering why the following option ignored
    (it was interpreted as an argument instead). Look for this if a command appears
    to be ignoring an option.


    Options that don''t take arguments can be bunched together. For example the gp
    command''s -o (set GPIO function to output) and -D (display GPIO settings) take
    no arguments, so both of the following commands are valid and equivalent:


    ```

    $ gp -4 -o -D

    $ gp -4 -OD

    ```


    One thing: If you start with a hyphen, then how do you work with arguments that
    also start with hyphens? As an experiment, create an empty test file named -testfile
    as follows:


    ```

    $ -testfile

    ```


    Now try to delete it.


    ```

    $ rm -testfile

    rm: invalid option -- ''./-testfile'' to remove the file `-testfile`.

    Try `rm --help` for more information.

    ```


    The problem with this command is that the rm command thinks you''ve bunched options,
    starting with -t. The command complains that it does not support such an option.


    To eliminate this ambiguity between options and arguments, the getopt(3) library
    routine recognizes the character sequence -- (two hyphens) to mean that this is
    the one of options. All other line arguments following are to be interpreted as
    arguments. Using this rule, we can easily remove that pesky file:


    ```

    $ rm --testfile

    ```


    These conventions hold true for most Linux commands (ignoring the GNU long option
    extensions). The commands provided by this book follow all these conventions.
    Unix (and Linux) do some reneade commands that break the rule, the dd for example,
    but those are the exception.


    The last thing to be conscious of is some commands process all options before
    acting on them. In conflicting options are given in these commands, the rightmost
    option will determine what is used (options are processed from left to right).
    Some other commands like the gp command, will take actions as the options are
    scanned from left to right. This allows several different actions to be performed
    as the options are encountered.


    48'
