  md: '# CHAPTER 8 ■ PHYSICS OF THE GPIO INTERFACE


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_103_0.png)


    **Figure 8-7.** *Using a resistor for GPIO safety*


    Once the GPIO pin has been reconfigured as an input by the application, the resistor
    remains in the circuit but has no real effect (the GPIO CMOS input gate does not
    conduct current). Only a very small current flows when the signal changes state
    due to charging and discharging of parasitic capacitance. Use a low value of R1
    (1k) when the GPIO operates at high rates of change. Otherwise you could possibly
    use a resistor as high as 10k ohm for R1.


    # Logic Levels


    As an interface designer, you''ll need to know what is considered a logic 0 and
    what is a logic 1. Broadcom states the signal levels for GPIO inputs as shown
    in Table 8-1.


    **Table 8-1.** Signal Levels for GPIO Inputs


    | Parameter | Voltage | Description |

    | --- | --- | --- |

    | $V_{il}$ | $\leq$ 0.8 Volts | Voltage, input low (0) |

    | $V_{ih}$ | $\geq$ 1.3 Volts | Voltage, input high (1) |


    A signal that rises in the middle region, above 0.8V and below 1.3V, is considered
    *undefined*. Voltages at these levels could read randomly as a logic 0 or 1, and
    cannot be depended on.


    What about CMOS 4000 series ICs? How do they compare with the GPIO signal levels?
    Because CMOS devices support a wide range of supply voltages, the signal levels
    are generally understood on the basis of percentages.[2] I have calculated the
    voltage for 3.3V systems for your convenience, as shown in Table 8-2.


    90'
