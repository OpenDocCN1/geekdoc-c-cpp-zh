  md: '# CHAPTER 6 GENERAL PURPOSE CLOCK


    * Max operating frequency on gpio pin is approx 125 MHz

    at about 1.2v in amplitude, with no load.

    * For -s, src be one of:


    +   0 - Grounded (no clock)

    1 - Oscillator (19.2 MHz)

    4 - PLLA (audio ~393.216 MHz)

    5 - PLLC (1000 MHz, affected by overclocking)

    6 - PLLD (500 MHz, default)

    7 - HDMI Aux (216 MHz?)


    See also the pipwm command.


    From this display, you can see that there are number of options. Many have defaults,
    which are shown

    in brackets.


    # Displaying Clock Settings


    One of my favorite options is the -D option to display the current status of these
    two user-accessible clocks:


    ```

    $ piclk -D

    CLOCK GPIO ALTFUN DIVI DIVF MAH ENAB SRC

    --------------------------------------

    GPCLK0 4 Alto C 5 0 0 Y PLLD

    PWMWCLK 12 Input 0 0 1 N Gnd

    PWMWCLK 13 Input 0 0 1 N Gnd

    PWMWCLK 18 Input 0 0 1 N Gnd

    PWMWCLK 19 Input 0 0 1 N Gnd

    ```


    This display needs a little explanation, however. In the CLOCK column there are
    two names shown:


    +   1. GPCLK0: General Purpose Clock 0


    +   2. PWMWCLK: PWM Clock


    As noted, there are other clocks which are reserved or used by the system. The
    clock named\PWMWCLK is the one used by the PWM peripheral, which is examined in
    Chapter 7. It gets listed four times in

    the display it is connected with the operation of PWM on four different GPIO output
    pins. Keep in

    mind, there is only one clock used by the PWM peripheral, GPCLK0.,


    The remaining clock, is the subject of this chapter. Both clocks can be configured
    by the piclk

    command, by specifying the "GPIO" pin


    +   1. Chooses GPCLK0


    +   2. Chooses PWMWCLK (for PWMW0)


    +   3. Chooses PWMWCLK (for PWM1)


    +   4. Chooses PWMWCLK (for PWMW0)


    +   5. Chooses PWMWCLK (for PWM1)'
