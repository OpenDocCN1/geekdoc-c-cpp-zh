    # MASH AND DIVF


    The clock''s DIV is an integer value that determines the output frequency (or
    clock period). But how do you generate intermediate frequencies when the desired
    DIV value doesn''t work out to an exact integer? The Broadcom solution is to apply
    a mash value, allowing the clock to alternate between two slightly different frequencies.
    This provides the illusion of an intermediate frequency based on averaging.


