  md: '# CHAPTER 4


    # Installing a Kernel


    To install and use the pispy logic analyzer tool, we must first build and install
    a kernel loadable module. This rpidma module provides safe and automatic access
    to the Pi’s DMA peripheral and its interrupts for the pisipy tool.


    Ideally, you would "just" compile the module itself and install it. However, kernel
    loadable modules depend on various parts of the entire kernel source tree. Furthermore,
    kernel loadable modules must the kernel release that is running. You used to be
    short-circuit this with the use of the modprobe -f option, but this no longer
    works (it silently fails). This brings us back to building and installing a new
    kernel.


    The good news is that the Raspberry Pi 2 can build a kernel without cross-compiling
    in about 2 hours. This greatly simplifies the overall procedure. This chapter
    outlines every step of the way to make it painless and save you time.


    # Overall Procedure


    The overall steps involved in building and installing a new kernel are listed
    here.


    +   1. Download the kernel source code.

    2. Check out the branch (see the section “Specific Kernel Releases”).

    3. Prepare and build the configuration.

    4. Compile the kernel.

    5. Compile and install the modules.

    6. Install the new kernel.

    7. Reboot.


    The list looks somewhat daunting, but the steps are simple enough to follow. Once
    you''ve got your Raspberry Pi up and running on the new kernel that you built,
    there are a few remaining steps to install pispy:


    +   1. Build the rpidma kernel module.

    2. Install the rpidma module.

    3. Reboot to test autoloading of rpidma.


    Once the rpidma loadable module is installed, you''ll be able to capture GPIO
    signals at your convenience using pispy. Each time you boot, the rpidma module
    will be loaded automatically so you won’t have to think about it.'
  merge: -1
  pgno: 46
- img_proc: true
  md: '# CHAPTER 4 INSTALLING A KERNEL


    # Disk Space


    For this procedure, it is recommended that your Pi SD card is 8 GB or larger.
    If you are using a smaller capacity card, you might need to use a USB attached
    disk drive or a USB memory stick. The procedure outlined in this chapter assumes
    that you are operating out of the pi account on the root file system.


    # Downloading the Source


    A given branch of the kernel source release can be quite large in terms of a git
    download. If you don''t need a specific version of the kernel, the most way to
    download it is to use the following git command (with the depth set to one), which
    creates a subdirectory .linux in your home directory:


    ```

    $ cd

    ```


    ```

    $ pwd

    /home/pi

    ```


    ```

    $ df . # Check disk space available

    Filesystem 1K-blocks Used Use% Mounted on

    /dev/root 7319248 4138492 2836724 60 % /

    ```


    ```

    $ git clone --depth 1 git://github.com/raspberrypi/linux.git

    Cloning into ''linux''

    remote: Counting objects: 51221, done.

    remote: Compressing objects: 100% (48663/48663), done.

    remote: Total 51221 (delta 40884), reused 15514 (delta 19330), pack-used 0

    Receiving objects: 100% (40884/40884), 138.53 MiB | 1.22 MiB/s, done.

    Resolving deltas: 100% (40884/40884), done.

    Checking files: 100% (48467/48467), done.

    ```


    If you leave out the --depth 1 option, you will download the entire history. This
    will take several times and occupy more disk space. Omitting the --depth option,
    however, does give you the ability to get a specific version of the kernel (a
    bit tricky). See the section "Specific Kernel Releases" at the end of the chapter
    for more information.


    Let''s know the branch you downloaded:


    ```

    $ ~/linux

    ```


    ```

    $ git status

    # On branch rpi-3.18.y

    nothing to commit (working directory clean)

    $

    ```


    In this example, we see the branch is rpi-3.18.y. There are several kernel versions
    in a given branch, but what you will have represent the most current. If you omitted
    the --depth parameter, the section "Specific Kernel Releases" at the end of the
    chapter before you proceed further.'
  merge: -1
  pgno: 47
- img_proc: true
  md: '# Raspberry Tools


    You will also need to download some tools for use later. You could do this in
    another terminal session, while you wait for the kernel sources to download:


    ```

    $ cd

    ```


    ```

    $ git clone https://github.com/raspberrypi/tools.git

    ```


    When completed, you can optionally eliminate what you don’t need. These were the
    subdirectories files I created. I deleted the others to save space:


    ```

    $ cd ~/

    ```


    ```

    $ ls -F

    configs/ mkimage/ sysdk usboot/

    ```


    # Prepare Configuration


    Now the kernel sources must be prepared and a configuration imported (current
    directory is ~linux):


    ```

    $ make mrproper

    ```


    ```

    $ zcat /proc/config >.config

    ```


    The second step involving zcat decodes and decompresses the kernel options you
    are currently using into the ~linux/.config file. This saves you a lot of trouble
    trying to duplicate what you already have. If the kernel sources you downloaded
    support options, you will be asked about them later.


    # Build Configuration


    At this point, we need to build a configuration. The most convenient way to do
    this is to use the make target oldconfig This avoids having to answer questions
    about options you are already using (from /proc/config). It will, however, ask
    about any new options. Press Return to accept the default if you like, which is
    the safest choice.


    ```

    $ oldconfig

    HOSTCC scripts/basic/fixdep

    HOSTCC scripts/kconfig/conf.o

    SHIPPED scripts/kconfig/conf.tab.c

    SHIPPED scripts/kconfig/conf.lex.c

    SHIPPED scripts/kconfig/hash.c

    HOSTCC scripts/kconfig/conf.tab.o

    HOSTLD scripts/kconfig/conf

    scripts/kconfig/conf --oldconfig Kconfig

    #

    # configuration written to .config

    #

    ```'
  merge: -1
