    # GPIO::pwm_clear_status


    This method allows the caller to clear certain PWM peripheral status flags. The
    PWM status flags are defined as follows:


    ```

    struct s PWM_status {

    uint32_t fifo_full : 1; // FIFO full flag

    uint32_t fifo_empty : 1; // FIFO empty flag

    uint32_t fifo_werr : 1; // FIFO error flag

    uint32_t fifo_rerr : 1; // FIFO read error flag

    uint32_t gap_occurred : 1; // Gap occurred flag

    uint32_t bus_error : 1; // Bus error flag

    uint32_t chan_state : 1; // Channel state

    };

    ```


    The method prototype is:


    ```

    int pwm_clear_status(int gpio,const s_PWM_status status);

    ```


    The method returns zero for success or a system error code when it fails.

    The following status flags are cleared when a 1 bit appears in the corresponding
    argument status:


    +   * status.fifo_full

    * status.fifo_rerr

    * status.fifo_werr

    * status.bus_error

    * status.gap_occurred


    The remaining status bits are left unmodified. See the Broadcom peripheral documentation
    for the details about the peripheral operation and flags.


    ```

    GPIO gpio;

    int rc;

    GPIO::s_PWM_status status;

    ```


    ```

    status.fifo_full = 0; // Don''t clear these flags

    status.fifo_rerr = 0;

    status.fifo_werr = 0;

