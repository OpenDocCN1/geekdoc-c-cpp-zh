  md: '# Diskstat::io


    This method calculates the amount of disk I/O that has occurred as a percentage
    (0.0 through 100.0). Its calling signature is simply:


    ```

    double pct_io();

    ```


    An example of its use is shown below:


    ```

    Diskstat diskstat;

    double io_pct;

    ```


    ```

    io_pct = diskstat.pct_io(); // Get percent I/O

    ```


    There is no Linux resource that indicates what the maximum I/O can be. So the
    Diskstat class tracks I/O usage with each call to the method pct_io(). As it samples
    the system, if it encounters more I/O time (provided in milliseconds), the object
    keeps track of that as a new maximum. In this way, a percentage of I/O can be
    calculated and returned.


    The obvious result of this approach is that early I/O readings will be inflated
    until early higher maximums have been observed. Keep in mind that this facility
    is meant for a MTop display result, rather than accurate accounting.'
  merge: -1
