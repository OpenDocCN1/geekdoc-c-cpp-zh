    \ One uses pointer syntax (->) and the other dot (.). The reference variable\n\
    al possesses the trait that it cannot be \"repointed\" once it has been established.\
    \ The pointer variable,\nhowever can be changed at will. The safety provided by\
    \ a reference is often helpful.\nNow let's declare a map of clients, using int\
