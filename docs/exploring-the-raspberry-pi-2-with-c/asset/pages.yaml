    # RF Generation


    The pfm[3] project has exploited the fact that the GPCLK0 is capable of generating
    an RF signal within the FM broadcast band. Before you try this experiment, though,
    you should be aware that transmitting any radio signal is illegal without a license.


    Although there are many devices that can transmit low power signals to FM radios,
    these have been approved through testing and a licensing procedure. Regulations
    around the globe for enforcement of radio transmissions, but consequences can
    include having computer and radio equipment confiscated and a lifetime ban on
    owning a radio license. Remember that compliance with the law is your responsibilities.


    With out of that, if you choose to accept the risk, there are some other things
    you should be aware of:


    +   - The signal coming out of GPIO 4 is a square wave. This means there will
    be many harmonics radiated around. If you have 100 MHz on GPIO 4, these will also
    be 200 Mhz, and higher multiples at various but reduced amplitudes. These could
    represent severe interference to critical services.


    +   - Never attach a wire to your GPIO pin to act as an antenna. Increasing your
    transmission range is a bad idea when transmitting illegally.


    +   - Other reasons for not attaching an antenna wire include the fact that it
    could destroy your GPIO output driver (from standing waves, etc.).


    +   - Above all, do not run a GPIO without! Antennas are subject to static electricity
    from thunderstorms and other sources. Your Pi will certainly sustain damage if
    you do. Without adequate planning, you also become susceptible to lightning strikes.


    If you observe some common sense and precautions, you can perform this experiment
    with relative safety.


    If you have a stereo or FM receiver, what can you do to receive the antenna in.
    to close proximity of the Pi. I ran a wire from my FM receiver to the signal coming
    from GPIO 4 is no more than any other signal that the Pi itself might radiate,
    but the receiver will see an increased signal.


    Using clock source 6 (500 MHz), we can generate a 100 MHz signal that can be heard
    on the FM radio. Using the는지 command, select GPIO 4 (-g4), DIVI = 5 (-15), mask
    = 0 (-m0); enable the clock on the GPIO output (-e1); select clock source 6 (-s6),
    and blink on off (-b). So that I can see and hear when the clock is on or off,
    I also added verbose option (-v) in the following session:


    ```

    $ pinck -g4 -i5 -m0 -s6 -b -v

    Clock started.

    d driving gpio 4.

    Press ° to quit..

    Clock off (stopped: -g 4)

    Clock on (running: -g 4)

    Clock off (stopped: -g 4)

    ```


