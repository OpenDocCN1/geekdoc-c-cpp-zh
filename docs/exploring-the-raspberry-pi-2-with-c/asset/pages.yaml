    # Summary


    To the nonelectronics reader, congratulations! You''ve stayed with me to the end
    of this chapter. Even if you don''t fully appreciate all of the electronics aspects
    of this chapter, you are at least aware of some of the issues.


    We have examined the foundation of Raspberry Pi GPIO operation in this chapter,
    which is largely the same as the CMOS 4000 series logic family of ICs. You have
    seen that the wide operating range of the 4000 series lends itself to playing
    nice with the Pi''s 3.3V GPIO, but successful use of CMOS interfaces requires
    some planning and care, which this chapter has prepared you for.


    Now that you''ve seen the CMOS configuration, it is clear which inputs should
    be connected (or have pull/down resistors configured). The resistor solution permits
    you to safely use a GPIO pin that might be misconfigured at boot time. This gives
    you greater freedom in your designs. Finally, the review of logic voltage levels
    has prepared you for avoiding the pitfall of combining loads with logic signal
    interfaces.


