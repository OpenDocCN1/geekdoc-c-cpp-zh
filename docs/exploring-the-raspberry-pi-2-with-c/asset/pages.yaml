  md: '# CHAPTER 1


    # Introduction


    The introduction of the Raspberry Pi 2 has ushered in exciting new opportunities.
    No longer is the software limited to one CPU core, but now executes on. Memory
    has doubled to 1 GB, providing a larger disk cache and resulting in better SD
    card performance. This also leaves room for larger applications. Having four built-in
    USB ports is also helpful in avoiding the need for a USB hub.


    Some things have changed under the hood, like the physical address for peripherals.
    The address BCM2708_PERI_BASE has changed from 0x20000000 to 0xF3F0000 for the
    Raspberry Pi 2. This means that a lot of software written for the earlier Raspberry
    Pi models will not work on the Pi 2 without changes. With device tree (DT) support
    built in Raspberry Linux, it is now a simple matter to automatically detect it.
    Consequently, the included libgpi2 class detects it. To this end,


    The main purpose of this book is to exploit the Raspberry Pi 2. To that end, this
    book comes with possible to access the GPIO on your Pi easier. Demand C++ libraries
    will make it possible to access the GPIO and other peripherals with only a few
    lines of code. Command line tools like the gg command will give you simply and
    ready to list your GPIO state and make changes. A feature of GPIO also allows
    a pin to be "monitored" for changes, making testing inputs easier. All installed
    tools include their own self-help display on command.


    A Raspberry Pi 2 designer is handicapped without any logic analyzer for tracing
    pins. For this reason, I feel that the reader should have to use one. This book
    provides you with a software-based logic analyzer for free (it requires no extra
    hardware). The PiSpy logic analyzer is able to see all GPIO inputs and outputs
    and records events to a file.


    The C++ programming language was chosen for this book to make your life easier.
    The C programmer need not fear this because I''ve kept to the basics without using
    language elements. Many Arduino use C++ every day without knowing it. The standardization
    efforts of the last decade have had a very positive effect on g++ and libc. And
    this availability of the Standard Template Library (STL) in glibc makes it a very
    productive environment for which to program.


    I''ve used a hybrid approach to the C++ code. I continue to use the well-understood
    I/O (stdio) routines like printf so that the code is easy to read and understand.
    I know that C++ purists will "tsk off about this, but this is a practical book
    rather than a computer science text.


    Of particular interest, are the included software utilities and the C++ library
    libgpi2. Tools and libraries


    # Overview


    Chapter 2 presents a simple Raspberry Pi 2 construction project. Using a short
    plank of wood, you can mount your Raspberry Pi 2 and a breadboard on it. That
    being organized this way helps considerably.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# CHAPTER 1 INTRODUCTION


    Chapter 3 presents "The Matrix" construction project. It uses an LED matrix to
    produce a display that can provide instant display of CPU utilization for each
    of its cores. It also displays graphs for memory and I/O utilization. If you don''t
    want to construct this project, you can install the hook utility instead.


    Chapters 4 and 9 cover an exciting tool that is also included in the book''s software,
    the PiSPy logic analyzer. This is is simple-to-use logic analyzer for your Pi,
    requiring no additional hardware. Through the use you can inspect and capture
    GPIO signals, whether the GPIO is an input or output. Through the use of the direct
    memory access (DMA) peripheral, PiSpy can capture signals up to about 1-2 MHz.
    The GikWave graph is then automatically updated to display the captured data.


    Chapter 5 is dedicated to GPIO commands. All provided with this book use command
    line option processing using the standard Unix. The chapter begins with a brief
    description of what command line interfaces are and then shows the gpio command
    use with examples.


    Chapter 6 introduces the pi2cmk utility, which can display or alter the configuration
    of the general purpose clock (or PWM clock). Experiments with the clock are included.


    Chapter 7 expands on the clock center by examining the Pulse Width Modulation
    (PWM) peripheral. The pwm utility and its options are explored in combination
    with PiSpy. PiSpy illustrates the effect of different configuration settings.


    Chapter 8 takes a look at what GPIO is and the Complementary MOS (CMOS) technology
    that it is made from. Electronics students will find the explanation helpful what
    CMOS is and avoiding pitfalls in interfacing. Additionally CMOS inputs are explained
    with a brief description of chip static protection schemes.


    Chapter 9 provides a detailed look at the PiSpy logic analyzer and describes the
    various features of its application.


    Chapter 10 looks at GPIO input, focusing particularly on the problem of debouncing
    input from switches and buttons.


    Chapter 11 is a software-focused chapter. It provides a track to use C++ and the
    STL in a very easy and pragmatic way. The STL provides the programmer great benefits
    in programming time and reliability. In this chapter we look at the most popular
    containers and example code fragments are provided throughout.


    Chapter 12 is multithreaded software to take advantage of all four CPU cores in
    an efficient web server. The server is based on the libevent library behind the
    scenes, but C++ classes are used to provide a very simple interface. This allows
    you to build and customize your own web server with little mainline code. The
    provided piveb project can be used and extended.


    Appendix A through C document the libpi2 C++ classes for programming GPIO. With
    the provided you, it is a simple matter to easy-to-follow documentation and examples
    for the various class methods supported.


    Appendix D and E describe some other C++ classes that might be useful for people
    working with Matrix or 7-segment displays. Appendix F describes classes that have
    to do with gathering system performance metrics as measured by the mqtt utility.


    Appendix G provides some additional information about some of the remaining advanced
    classes found in libpi2.


    # Software for This Book


    You will want to download the open source software written for this book. It is
    available from two sources:


    +   * www://www.apress.com/9781484217382


    +   * https://github.com/ve3wwg/raspberry_pi2.git'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# CHAPTER 1 INTRODUCTION


    The open source software is important because:


    +   1. It provides you with several utilities: gpi, piclk, pipwm, mtop, and PiSpy.

    2. It includes the piweb C++ web server project.

    3. It provides library libprpi2, which can be used in your own C++ projects.


    If you are using git to display and control the source code use the command


    ```

    $ git clone https://github.com/ve3mwg/raspberry-pi2.git ./pi2

    ```


    The second argument tells git to install the source code into the new pi2 subdirectory.

    G command provides you with a first-class Unix utility to display and control
    the GPIO resources. This utility also includes some useful options to blink a
    GPIO pin, which is great for checking wiring to LEDs. Another option allows you
    to monitor an input to the terminal session, so you can check input wiring and
    so on.


    The pi1ck utility allows you to display and control the general clock (and PWM
    clock). The pi1ck and PiSpy are also used together for some projects.

    Pipwm allows you to display and control the PWM peripherals. The pipwm command
    and the PiSpy utility are also used to allow you to control the PWM peripherals.

    PiSpy gives you a GPIO logic analyzer. Using a Linux driver for DMA and the PiSpy
    user GPIO data can be captured at 2 MHz or less. This utility automatically assigns
    and releases the DMA resources it needs for ease of use and system integrity.


    If you choose to use the Matrix in Chapter 3, you will be able to visualize the
    system utilization in real time using the provided mtop command.

    Because Raspberry Pi 2 has four CPU cores, the piweb project demonstrates a high-performance
    C++ web server using. This server will pull all four CPU cores to work with sufficient
    web traffic. Yet, due to its C++ design, it is simple to program and enhance to
    meet your own needs.


