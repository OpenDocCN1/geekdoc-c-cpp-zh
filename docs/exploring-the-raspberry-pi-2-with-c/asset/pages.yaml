  md: '# Table 8-2. CMOS Voltage for 3.3V Systems


    | Parameter | Voltage | Description |

    | --- | --- | --- |

    | $V_{IL}$ | $\leq 30\%$ of $V_{DD}$ / $0.99V when $V_{DD} = 3.3V$ | Voltage,
    input low (0) |

    | $V_{IH}$ | $\geq 70\%$ of $V_{DD}$ / $2.31V when $V_{DD} = 3.3V$ | Voltage,
    input high (1) |


    VDD for CMOS devices can vary from -3V up to +18V;2] making them ideal for interfacing
    a variety of devices, including the 3.3V GPIO of the Raspberry Pi. From Table
    8-2, you can see that the CMOS values for $VIL$ and $VIH$ differ somewhat from
    the Pi. Because CMOS inputs require no current to drive, the signals are extremely
    compatible provided that the circuit is not loaded. Without extra loads, GPIO
    or CMOS output will be very nearly zero volts for low, and very nearly +3.3V when
    high. These easily meet the $VIL$ and $VIH$ parameters.


    Because CMOS gates almost no current, there is a virtually unlimited fanout capability
    (fanout is the capability of one logic device to drive the inputs of others).
    Problems begin when you combine logic signals with loads that require current.


    Figure 8-8 is example of a GPIO output driving a CMOS input and an LED. The airbrushed
    lines indicate the current flow when the LED is lit (the CMOS inputs does not
    require current, but only a voltage). The LED might light up but the voltage level
    at the gate could be reduced because of the Load that LED places on GPIO transistor
    M2. The CDXXX device needs a minimum of 2.31V to register a logic 1 (operating
    over +3.3V).


    ![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_104_0.png)


    Figure 8-8. Combining the driving of a CMOS input and LED'
