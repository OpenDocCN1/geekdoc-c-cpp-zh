  md: '![](img/1dfed1a8285c8a59b56ea8dbd2ed73fb_43_0.png)


    **Figure 3-6.** Example MAX7219 GPIO command signals


    The top row shows the clock (CLK) pulses. Data is clocked into the device when
    the CLK signal goes from low to high. The middle trace shows the data in (DIN)
    signal. Looking at the rising CLK edges and the state of the DIN line, we can
    see that the word being loaded is 0b_0000_0110_1000_0000 (underscores are added
    for readability). This is display data for row 5 (address is one higher), and
    the data has a 1-bit for D7 goes from low to high (lower right of Figure 3-6).
    The load from the device''s shift register occurs when the LOAD signal goes


    It appears in Figure 3-6 that the LOAD low-to-high transition is simultaneous
    with the last clock, but it actually follows the clock by a microsecond or more.
    According to Maxim, the LOAD rising edge can occur simultaneous with the CLK or
    follow, but must occur *before* the next rising clock.


