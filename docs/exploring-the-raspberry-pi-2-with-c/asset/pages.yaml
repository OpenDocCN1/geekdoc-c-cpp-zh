  md: 'The same input signal is applied to the gates of M1 and M2. At the output (labeled
    Out) we see that the voltage switches from off to on, M1 turns off and M2 turns
    on at about the 2 ms point. The output goes low as the signal goes high at 8 ms
    and the cycle repeats starting at 12 ms. This pair of MOSFETs act as an inverter.
    They produce a low output voltage when the input is high and a high output when
    the input goes low.


    Notice the current(IR2) spike at 2 ms, nearly 100 mA in this simulation. This
    is much higher than you would see in logic circuits. The excessive charges in
    the circuit when the input is high is due to the choice of MOSFET components and
    mismatches between them. It is instructive to note, however, CMOS circuits do
    have current spikes when the output switch state. Notice the spikes repeat at
    8 ms and 12 ms when the output switches state.


    The main advantage of the CMOS circuit is almost no current flows when it is in
    a steady state. Because one MOSFET is off while the other is on, very few current
    flows from top to bottom.


    # CMOS Inputs


    Figures 8-3 and 8-4 demonstrate the most basic aspects of the CMOS configuration.
    Because a MOSFET uses a voltage activated gate, almost no current flows into the
    input. A pair tied has virtually no effect on the driving circuit.


    If the gates of M1 and M2 are left unconnected, however, a voltage can "float"
    on the gate. Electric charges in the air can collect on the gate conductors and
    become highly charged. Having a charged walk by dry weather can induce very high
    voltages on nearby floating conductors. Conversely, electrons can be removed from
    the gates, leading to extremely positive charges, which are equally damaging.


    If the charge becomes too negative (positive), the very layer of isolation between
    the MOSFET''S and the silicon breaks when a spark forces its way through. This
    perforation results in connection with the silicon, resulting in a device that
    has no isolated gate. This is why it is bad practice for MOSFET gates to be left
    unconnected. Without excessive voltages, unconnected gates can gather charges
    and become one positive moment and the negative, resulting in unusual behavior.
    A pullup or pulndown resistor solves the problem by forcing the gate to remain
    high or low until driven.


    Another reason to avoid floating gates is to avoid high currents. Recall all the
    spikes shown in Figure 8-4. If you hold the input at about halfway between +3.3V
    and ground, both M1 and M2 would be conducting heavily. This is not only wasteful
    of power, but could lead to permanent damage and excessive heating.


    The GPIO pins are prevented from floating if you use pullup or pulndown resistors.
    These pullup and pulndown resistors are to be about 50 k ohms values. These are
    sufficient to keep the inputs at a high or low logic level and provide a high
    input impedance. Beware, however, that it is possible to configure an input with
    no pullup or pulndown resistor, which will leave the input floating unless it
    is otherwise connected. The provided gp command -p allows you to configure pull
    resistors.


    # Input Protection


    Figure 8-5 illustrates how the input gate of a MOSFET can be protected from high
    voltages. Reversed biased diodes and sometimes a resistor is used. (Don Lancaster
    lists four in his CMOS Cookbook, but we focus on one here). Because the diodes
    are reversed biased (not conducting), they don''t interfere with the normal operation
    of the circuit. Resistor R1 (when present) is usually a low-value resistor of
    about 500 ohms. Because normal CMOS circuits have almost no current, the circuit
    operates as if the resistor was not present.'
