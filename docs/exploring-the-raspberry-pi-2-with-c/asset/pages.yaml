  md: '# APPENDIX D CLASS MAX7219


    The method prototype is provided below:


    ```

    int shutdown();

    ```


    The call returns zero for success or else a system error code. An example shutdown
    is provided below:


    ```

    MAX7219 max7219(16,26,21);

    int rc;

    ```


    ```

    rc = max7219.shutdown();

    assert(!rc);

    ```


    # MAX7219::nop


    This method causes the device''s "no operation" command to be sent. You might
    have a use for this in generating display effects where you need to display accurate
    timings. The method calling signature requires no arguments:


    ```

    int nop();

    ```


    > Zero is returned when GPIO is working, otherwise a system error is returned.
    An example code fragment follows:


    ```

    MAX7219 max7219(16,26,21);

    int rc;

    ```


    ```

    rc = max7219.nop();

    assert(!rc);

    ```


    # Initialization Procedure


    It must be remembered that the MAX7219 chip is like any peripheral and may not
    be able to keep up with the commands as your Raspberry Pi is able to. The recommended
    procedure for driving a display using the MAX7219 chip this is the following (pin
    assignments assumed from the constructor):


    +   1. Wait 20 µs in the case is just entering shutdown mode

    2. Invoke MAX7219::enable

    3. Wait 35 µs in the case is leaving shutdown mode (and initializing)

    4. Configure for minimum intensity using MAX7219::config_intensity

    5. Configure your maximum number of digits with MAX7219::config_digits

    6. Configure your normal intensity (3 is a good value to try) with MAX7219::config_intensity

    7. Configure decode mode for all digits using a loop and MAX7219::config_decode

    8. Optionally blank your display (initialize) using MAX7219::data for each digit'
