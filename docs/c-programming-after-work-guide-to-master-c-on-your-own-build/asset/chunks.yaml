  raw: 'What makes the C++ code?A variable is something that stores a value. It’s
    like a box, each box has a name and category on it, and the category is the type
    of item stored in it – the name is the specific variable. Each variable has a
    specific type, name, and size, and these govern exactly what can be stored inside
    of it.Line 7 is called an assignment. This assigns a value to the variable, and
    the = is the operator – this is what does the assigning. The value after the =
    is called a binary operator.Note that there are no quotation marks around the
    cout statement this time. This is because, rather than displaying the string,
    we are outputting the value. Compiling the program now would print “42” on the
    screen.As well as having a type a variable can also have a prefix added to the
    declaration and these changes how the variable behaves. Some will change the size
    of the variable while others let you use or block you from using negative numbers,
    while others do a completely different job. Almost all of them will be talked
    about here.Size ChangersTwo specific prefixes change the byte size of the variable
    – short and long. The idea behind this is to allow the variable to store more
    vales and bigger numbers. How big depends on the architecture of the computer
    that you are using:On a 32-bit computer int and long int are both 4 bytesOn a
    64-bit computer int is 4 bytes and long int is 8 bytesOn both architectures, short
    int is 2 bytesThere is nothing that dictates the size of the modifier for those
    particular keywords, except:Short must be equal to or smaller than a normal variableThe
    normal variable must, in turn, be equal to or smaller than a long.The only variable
    that can take a prefix is intEven more confusing, you can omit int and just use
    long or short, for example:short int s = 0;int i = 0;long int l = 0;short s2 =
    0;long l2 = 0;Sign ChangersTwo other prefixes can restrict the values that are
    stored by a type – signed and unsigned. A signed variable can store negative and
    positive values, while an unsigned variable can only take positives.Other PrefixesThere
    are some other prefixes that you can use in C++, not so common, and most of which
    we are not going to use and will not cover in this book. There are two very useful
    ones, though – const and static. The former is constant, never changing their
