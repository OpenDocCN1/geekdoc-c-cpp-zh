    # 是什么构成了 C++ 代码？


    变量是存储值的东西。它就像一个盒子，每个盒子上都有名称和类别，而类别是存储在其中的物品的类型——名称就是特定的变量。每个变量都有特定的类型、名称和大小，这些因素精确决定了内部可以存储什么。


    第 7 行被称为赋值。这为变量分配了一个值，而 `=` 是赋值运算符——它负责执行赋值操作。`=` 后面的值被称为二元操作符。


    注意，这次 `cout` 语句周围没有引号。这是因为我们不是在显示字符串，而是在输出值。现在编译该程序将在屏幕上打印“42”。


    除了具有类型外，变量还可以在声明中添加前缀，这些变化会改变变量的行为。有些会改变变量的大小，而另一些允许你使用或阻止你使用负数，而另一些则执行完全不同的工作。几乎所有的前缀都会在这里介绍。


    ## 大小改变者

    两个特定的前缀会改变变量的字节大小——`short` 和 `long`。这背后的想法是允许变量存储更多值和更大的数字。多大取决于你所使用的计算机架构：

    * 在 32 位计算机上，`int` 和 `long int` 都是 4 字节。

    * 在 64 位计算机上，`int` 是 4 字节，`long int` 是 8 字节。

    * 在两种架构上，`short int` 都是 2 字节。


    没有任何规定这些特定关键字修饰符的大小，除非：

    * `Short` 必须等于或小于普通变量。

    * 普通变量反过来必须等于或小于 `long`。

    * 唯一可以带前缀变量是 `int`。


    更让人混乱的是，你可以省略 `int` 直接使用 `long` 或 `short`，例如：

    ```cpp

    short int s = 0;

    int i = 0;

    long int l = 0;

    short s2 = 0;

    long l2 = 0;

    ```


    ## 符号改变者

    另外两个前缀可以限制类型所存储的值——`signed` 和 `unsigned`。有符号变量可以存储负值和正值，而 `unsigned` 变量只能取正值。


    ## 其他前缀

    C++ 中还可以使用一些其他前缀，它们并不常见，我们大多数将不会使用，也不会在书中介绍。不过，有两个非常有用的前缀——`const` 和 `static`。前者是常量，永远不会改变值，而后者保持变量的值不变，但仅限于函数调用之间；那是以后讨论的话题。


    # 语言的核心：理解 C++

    今天计算机运行着我们周围的几乎一切；在计算机或你偏爱的手机品牌的核心，是程序。对于我们的学习过程，我假设你已经知道什么是计算机程序及其背后的结构。所有程序的核心都是计算机语言。那么问题随之：C++
    到底是什么？


    C++（读作 "plus plus"）核心上是一种通用的编程语言。该语言的独特之处在于，它在提供低级内存管理的同时，整合了关键的面向对象和泛型编程。


    该语言及其设计偏向于系统编程，例如嵌入式系统和操作系统内核，仅举几例。由于其性能、灵活性效率，该语言是许多程序员的最爱。该语言在许多场景中都有有效用途，例如服务器（如
    Web 搜索 SQL 和电子商务）、桌面应用程序、性能关键型应用（如太空探测器和电话交换机），以及最重要的是娱乐软件，你最喜欢的视频游戏就属于此类。


    该语言被称为编译语言，其实现可以在全球许多平台上运行，并被 Intel、FSF、Microsoft 和 LLVM 等许多跨国公司使用，仅举此类。


    如果你搜索 ISO（国际标准组织），你会了解到 C++ 是标准化的。ISO 在 2011 年 9 月批准并发布了 C++ 的当前版本 `ISO/IEC 14882:2011`，非正式称为
    `C++11`。C++ 首次于 1998 年标准化为 `ISO/IEC 14882:1198`，然后修订为 `C++03`，然后在 2003 年再次修订为
    `ISO/IEC 14882:2003`。尽管上述信息很有用，但对你并不重要。更重要的是当前的标准 `C++11`，由于整合了新功能和更大的标准库，它取代了所有其他版本。


    与计算机相关的一切，事实上，世界上其他一切事物都有起源。C++ 是 Bjarne Stroustrup 早 1979 年在贝尔实验室的结晶（`C`）。每一项大创新都有原因或目的。Bjarne
    想要一种像 `C` 一样更灵活高效的语言，但同时也提供更高级程序组织功能的语言。


    这里有一个关键；记得我说过学习 C++ 会为你学习其他语言做准备吗？原因就在于：C++ 影响了许多语言，包括 `Java`、`C#` 以及 1998 年之后开发的所有后期
    `C` 版本。


    在结束第一章之前，我可能应该提到 `C` 是 C++ 的前身，因此，使用 C++ 需要一些对后者的知识。


    # 入门：第一次使用 C++

    虽然学习 C++ 令人兴奋，但在我们开始编写代码之前，有一些先决条件。在进行任何编程之前，你需要一个集成开发环境（IDE）。IDE 是一个编译器，它将你的代码翻译成机器可以理解的
    0 和 1（机器代码）。


    如果你还没有安装编译器，可以下载许多免费和付费的编译器。


    ## 安装 IDE

    IDE 构成了你编程非常核心的一部分。因此，我们查看一些更基础的方面——安装是有重要的。正如我提到的，你可以使用许多 IDE。大多数开发者都在纠结哪一个适合自己。但情况是，你可以安装多个
    IDE。最常见的集成编译器是 `CodeBlocks` 和 Microsoft 的 Visual C++。如果你觉得某个更易用，或者优于上述两个，不要受限。如果你在
    Windows 上编程，最好的选择是 Microsoft 的 Visual C++ 2010 Express 版，可以从 Microsoft 网站下载。如果你在没有网络的环境下工作，通过
    Google 的帮助你可以找到离线安装程序。（此处为原文中的重复内容）


    IDE 构成了你编程非常核心的一部分。因此，我们查看一些更基础的方面——安装是有重要的。正如我提到的，你可以使用许多 IDE。大多数开发者都在纠结哪一个适合自己。但情况是，你可以安装多个
    IDE。……（此处为原文中大段重复内容）


    取决于你的带宽，安装过程可能需要一些时间，一旦安装完成，Windows 将提示重启。你可能会在计算机响应中注意到这一点，不要感到惊讶，因为系统正在安装所有资源。然而，此时，安装程序将简单地运行。另一方面，你可能在
    Windows 上开发但反之亦然；在这种情况下，你的最佳选择是使用 `CodeBlocks`，这是一个跨平台的 IDE，可以在 Windows 和 Linux
    上运行。到目前为止，我们涵盖了几乎所有平台除了 Mac。如果你是 OSX 用户，可以使用 `Xcode` 或 `Eclipse`。Eclipse  C++
    不是自动设置；它需要下载和安装组件。如果 `CodeBlocks` 不合你意，你也可以使用 Dev-C++，这也是跨平台的，可以在 Windows 和 Linux
    上运行。你应该下载 MinGW。IDE 安装部分可能是任何编程教程中最难的部分。现在我们完成了这一部分，你准备好开始编码了。


    ## 你的第一个 C++ 程序

    欢迎来到最兴奋的部分，即让你拿起这本书使用 C++ 编写程序的部分。像大多数语言教程一样，我们的第一个目标是创建一个 hello world 程序。虽然“Hello
    world”代码听起来像陈词滥调，但在程序创建中，它是任何程序的最佳示例。无论你的程序复杂还是简单，都必须包含几行基础代码。


    上面的代码是我们所说的预处理器指令。如果你查看代码，你会发现有 `iostream` 和 `std`；它们分别代表输入和输出，是任何使用 C++ 创建的程序的绝对要求。另一方面，`namespace
    std` 告诉编译器你打算使用标准库。如果你没有使用代码行来指定这一点，你将限制自己，无法使用 `cin`、`cout` 或 `endl`，我们稍后会介绍。


    上面的代码指示了我们的 `main` 程序开始的地方，那里是大部分编码发生的地方。如果你好奇，`int` 表示整数。整数是返回给程序的值。同样重要的是，你不应该忽略括号
    `()`；即使它们是空的，它们也是重要的。在同时，你也不应该忽略大括号 `{`，因为它是必要的。现在我们理解了这些，让我们使用 `cout` 在屏幕上打印一些东西吧。


    我并不知道你是否熟悉 C 语言，但上述代码中的 `cout` 就是 `printf` 语句。代码 (`cout`) 在屏幕上打印引号内的任何内容、文本或其他内容。另一方面，`endl`
    表示行结束（它类似于在处理文文档文件时按回车键）。分号也是必须的，所以不要忘记。在上面的代码中，`return 0` 充当返回给 `int main` 的整数。不想像复读机一样，不要忘记用大括号结尾，因为它们标志着
    `main` 的结束。在上面的代码中，这就是我们的主程序代码外观。这可能让你感到惊讶，但如果你遵循了我们目前所做的一切，你刚刚创建了自己的第一个程序。


    惊喜！我们刚刚使用和创建的代码是所有程序的基本结构；把它想象成在幼儿园学习字母表一样。你应该尽力理解并记住它。其次，你应该记住使用 `cout` 和 `endl`
    的顺序。不要忘记声明 `using namespace std;`，否则编译器将返回错误。


    然而，有一种解决办法。如果你不使用 `namespace std` 声明，你必须使用 `std::` 来声明每个 `cout`、`cin` 和 `endl`。这是我意思的示例。为了清晰，如果你不熟悉通用编程或
    C++，你会发现 `cout`、`cin` 和 `endl` 在你的代码中经常出现。选择使用我刚刚描述的方法会让你的工作更快。


    # 第 2 章：声明常量

    常量是程序执行期间不能更改的固定值。当你有应该保持不变的值时，这很有用。在 C++ 中，定义常量有两种：使用 `const` 关键字或 `#define`
    预处理器指令。`const` 关键字通常更受欢迎，因为它是类型安全的且具有作用域。


    ```cpp

    const double PI = 3.14159;

    const int MAX_USERS = 100;

    ```


    另一种，你可以使用 `#define`：

    ```cpp

    #define PI 3.14159

    #define MAX_USERS 100

    ```

    注意 `#define` 是预处理器指令，意味着在编译器实际看到代码之前执行文本替换。


    ## 符号改变者

    另外两个前缀可以限制类型所存储的值——`signed` 和 `unsigned`。有符号变量可以存储负值和正值，而 `unsigned` 变量只能取正值。


    ```cpp

    signed int a = -10;

    unsigned int b = 10;

    ```


    ## 其他前缀

    C++ 中还可以使用一些其他前缀，它们并不常见，我们大多数将不会使用，也不会在书中介绍。不过，有两个非常有用的前缀——`const` 和 `static`。前者是常量，永远不会改变值，而后者保持变量的值不变，但仅限于函数调用之间；那是以后讨论的话题。


    # 语言的核心：理解 C++

    计算机运行我们周围的几乎一切；在计算机或你偏爱的手机品牌的核心，是程序。对于我们的学习过程，我假设你已经知道什么是计算机程序及其背后的结构。所有程序的核心都是计算机语言。那么问题随之出现：C++
    到底是什么？


    C++（读作 "plus plus"）核心上是一种通用的编程语言。该语言的独特之处在于，它在提供低级内存管理的同时，整合了关键的面向对象和泛型编程。


    该语言及其设计偏向于系统编程，例如嵌入式系统和操作系统内核，仅举几例。由于其性能、灵活性效率，该语言是许多程序员的最爱。该语言在许多场景中都有有效用途，例如服务器（如
    Web 搜索 SQL 和电子商务）、桌面应用程序、性能关键型应用（如太空探测器和电话交换机），以及最重要的是娱乐软件，你最喜欢的视频游戏就属于此类。


    该语言被称为编译语言，其实现可以在全球许多平台上运行，并被 Intel、FSF、Microsoft 和 LLVM 等许多跨国公司使用，仅举此类。如果你搜索
    ISO（国际标准组织），你会了解到 C++ 是标准化的。ISO 在 2011 年 9 月批准并发布了 C++ 的当前版本 `ISO/IEC 14882:2011`，非正式称为
    `C++11`。C++ 首次于 1998 年标准化为 `ISO/IEC 14882:1198`，然后修订为 `C++03`，然后在 2003 年再次修订为
    `ISO/IEC 14882:2003`。尽管上述信息很有用，但对你并不重要。更重要的是当前的标准 `C++11`，由于整合了新功能和更大的标准库，它取代了所有其他版本。


    与计算机相关的一切，事实上，世界上其他一切事物都有起源。C++ 是 Bjarne Stroustrup 早 1979 年在贝尔实验室的结晶（`C`）。每一项大创新都有原因或目的。Bjarne
    想要一种像 `C` 一样更灵活高效的语言，但同时也提供更高级程序组织功能的语言。


    这里有一个关键；记得我说过学习 C++ 会为你学习其他语言做准备吗？原因就在于：C++ 影响了许多语言，包括 `Java`、`C#` 以及 1998 年之后开发的所有后期
    `C` 版本。


