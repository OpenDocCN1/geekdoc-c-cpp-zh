    # C++ 程序结构

    正如我们讨论过的，计算机程序无非是一组告诉 CPU 要做什么的指令序列。


    ## 语句和表达式

    在 C++ 中，语句无非程序中最小的独立单元。它也是编程中最常见的指令形式。C++ 中，语句是将你的指令传递给编译器以执行特定任务的方法。我们使用 `;`
    来结束语句。在 C++ 中有许多种语句，下面给出最常见的语句类型。

    ```cpp

    int x;

    x = 5;

    std::cout << x;

    ```

    我们将在后面的章节中讨论上述语句的功能。


    ## 函数

    函数无非按顺序执行的语句序列。有一个名为 `main` 的函数，它是每个 C++ 程序中都必不可少的。当运行任何给定的 C++ 程序时，程序的执行从 `main`
    函数开始。函数有非常特定的任务要执行，并且它们只能执行这些任务。为了成为一名优秀的 C++ 程序员，你需要知道如何高效使用函数。在下一章中，你将学习更多函数的知识。


    ## 库和 C++ 标准库

    库无非预编译的代码集合。它们可以在不同的程序中使用。如果你想扩展程序的功能，可以添加库。C++ 核心语言是简约且直接的，但它也带有一个名为 C++ 标准库的内置库。C++
    标准库为用户提供了额外的功能。


