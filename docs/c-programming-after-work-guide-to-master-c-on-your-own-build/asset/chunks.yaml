    You can do this for any object you create, but we’ll talk more explicitly about
    that when we actually start creating objects in the next chapter.


    Another type of container, `lists`, functions very similarly to `vectors`. The
    specific differences between these two are beyond the grasp of a relative beginner.
    Still, the general rule concerning these two types of containers is that `vector`
    is generally the one that should be used unless you have to continually add or
    erase elements from anywhere other than the end of the container.


    There’s another type of container called an `associative container`, which is
    formatted with a key value and a mapped value. It’s generally ordered according
    to the keys. The most prominent type of associative container is called a `map`.
    This is great when you need to associate a set of data with a certain trait. For
    a real-world example, a store’s inventory system could be kept with a `map` of
    `SKU codes` (integers - the key) and item names (strings - the mapped data).


    For this, you’d import `<map>`, and declare a `map` by:

    ```cpp

    map<int, string> Inventory;

    Inventory[00400030] = “Tamagotchi, blue”;

    Inventory[00400031] = “Tamagotchi, white”;

    Inventory[00324359] = “Twilight, DVD”;

    Inventory[44539294] = “Dark Souls, Xbox 360”;

    ```

    If you wanted to recall a specific element later in your code, you could do something
    along the lines of:

    ```cpp

    cout << “Inventory[00400030] is: “ << Inventory[00400030] << “\n";

    ```

    Calling `Inventory[00400030]` would print out the mapped value, here being “Tamagotchi,
    blue”.


    There’s another type of associative container called a `set`. `Sets` function
    very similar to `maps`, except that they don’t allow duplicates. `Maps` allow
    duplicate values, but not duplicate keys.


    Also included in the `STL` is a library called “algorithms”. This library can
    be used to search, sort, and manipulate element ranges. Included in these are
    functions such as `equal()`, which determines if two sets of elements are equal
    to each other. There’s also `transform()`, which applies a given function to a
    given range.


    ## Conclusion


    We’ve come to the end of this book, but this is just the start of a long and fruitful
    journey for you, a life of programming. With the basics of `C++` under your belt,
    it’s time to start your real learning. Start writing those programs! Start implementing
    data structures and algorithms.


    If you enjoyed getting started with `C++`, there is so much more to learn and
    do with this wonderful language. Be sure to continue your journey with the second
    book in the series, which looks at slightly more complex topics while still being
    beginner-friendly.


    `C++` programming language is a competitive general-purpose platform which borrows
    some features of an imperative programming paradigm and can run on any platform.
    It is referred to as an imperative programming language because it uses step by
    step processes to achieve its goals. The language uses the concept of object-oriented
    programming to design and implement complex programs.


    The next step is to start writing out some of the different programs and codes
    that you want with the `C++` language. Even if you are just starting and you just
    want to spend your time practicing with some of the codes that are in this guidebook,
    you are still on the right path to seeing some great results with this language.


    The more practice you can get along the way with your own coding, the easier it
    will become to write and create your own codes along the way.


    The `C++` language is a unique option to work with, one that will help us to create
    some really powerful and strong codes, and the functionality that is found with
    this language is unlike any other that we are able to work with.


    All of these can be important in some of the codes that you want to write along
    the way, and when we are done with this guidebook, you should feel ready to handle
    these and add them to your own codes as well.


    As we can see, there is so much that we are able to do when it comes to working
    with the `C++` language. It is one of the best coding languages out there, whether
    you are a beginner, or you are someone who has worked with programming and coding
    for a long time.


    When you are ready to start your own coding journey, and you want to be able to
    create some of your own programs in no time. `C++` programming language utilizes
    the features of `OOP` paradigms to develop and execute a program. Some of these
    features include the use of objects, classes, data abstractions and encapsulation,
    inheritance, and polymorphism.


    The program focuses on the use of data rather than procedures to solve real-world
    problems. The program tries to eliminate the shortcomings of other conventional
    programming languages by improving the data security of programs, promoting code
    reusability, and its ability to use inheritance feature to make an effective program.


    Just like many other `OOP` languages, `C++` supports various building blocks.
    In this tutorial, you have learned how to use various built-in data types when
    handling simple to complex programs. The data types are divided into primitive
    data types, derived data types, and abstract data types. You not only learned
    how to use the primitive or standard data types but also how to declare your own
    user-defined datatypes.


    Enjoy your journey. If you don’t have fun while you program, it isn’t for you.
    Make it fun, make it exciting, and make it the reason you want to get up in the
    mornings.


    Good luck with your journey.

