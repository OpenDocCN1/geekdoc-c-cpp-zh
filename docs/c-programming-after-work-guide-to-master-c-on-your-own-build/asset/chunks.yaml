- fmt: "\n# Chapter 3: Functions\n\nYou may remember from math class at some point\
    \ where you had to deal with functions, like `f(x) = 2x + 5`. `f(0)` would have\
    \ been `5` (`2(0) = 5`), `f(1)` would have been `7` (`2(1) + 5`), `f(2)` would\
    \ have been `9` (`2(2) + 5`), and so on.\n\nFunctions in C++ work similarly. Functions\
    \ operate and then often return a value. They don’t always have to return a value.\
    \ However - functions that don’t return a value are void functions.\n\nFirst,\
    \ take a look at this chunk of code. It doesn’t have to make sense right now;\
    \ we’re going to go through it. Create a new project and erase the contents of\
    \ `main.cpp`, and type this in:\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nint getArea(int l, int w);\nint main(){\nint length, width;\ncout << \"\
    Enter the length, and then enter the width.\\n\";\ncin >> length >> width;\ncout\
    \ << \"The area is: \" << getArea(length, width);\nreturn 0;\n}\nint getArea(int\
    \ l, int w) {\nint area = l * w;\nreturn area;\n}\n```\n\nSo let’s break this\
    \ down line by line\n\n`#include <iostream>`\nThis includes the essential components\
    \ for input and output.\n\n`using namespace std;`\nThis denotes that we’re using\
    \ the standard input/output namespace.\n\n`int getArea(int l, int w);`\nThis is\
    \ where we declare our first function. C++ is procedurally compiled, so you can’t\
    \ just throw functions around willy-nilly. You have to declare them before you\
    \ write them later, or they have to write entirely before your main function.\
    \ For the sake of clarity, I prefer the initial declaration and then writing the\
    \ function after my main function, but it’s a personal choice. Regardless, we’re\
    \ creating a function here called `getArea`. The `int` before the name denotes\
    \ that it’s going to return an integer value. Likewise, a `float getArea(...)`\
    \ would return a float value, a `char getChararacter(...)` would return a character,\
    \ and so on. Within the declaration, we’ve given two variables, called `arguments`.\
    \ Much like how in `f(x)` equations, `x` was the thing that the equation modified,\
    \ the argument variables are what our C++ reads in and utilizes.\n\n`int main(){`\n\
    This is the start of our `main` function. In case you haven’t figured it out,\
    \ every program must have a `main` function. It’s the entry point for your code,\
    \ and the compiler will actively seek it out.\n\n`int length, width;`\nWe declare\
    \ two variables, `length`, and `width`.\n\n`cout << \"Enter the length, and then\
    \ enter the width.\\n\";`\n`cin >> length >> width;`\nWe ask the user to input\
    \ the length and width, and then accept their input.\n\n`cout << “The area is:\
    \ “ << getArea(length, width);`\nThis is where a bit of further explanation is\
    \ needed. The output stream puts out a value we give it, right? Since functions\
    \ simply return a value, we can put them straight in the output stream. Also,\
    \ since this function returns an integer value, you could create a new integer\
    \ and then assign its value as the value of the function, like this: `int area\
    \ = getArea(length, width);`. You could then just output: `cout << “The area is:\
    \ “ << area;`. This is a waste, though, because this variable doesn’t need to\
    \ be created for this program. If you do, however, need to store a variable such\
    \ as the area of a rectangle, you could do exactly that.\n\n`return 0;}`\nSimple,\
    \ every `main` function must return `0`.\n\n`int getArea (int l, int w) {`\nThis\
    \ mirrors the function declaration earlier and is where we start writing it.\n\
    \n`int area = l * w;`\n`return area;`\nWe create a new variable called `area`,\
    \ which takes the two arguments from the function header and multiplies them to\
    \ get its value. We then return that same integer. We also could have simply written\
    \ this: `return l * w;`. Both are valid ways of returning this function and will\
    \ give you an appropriate result.\n\nThat’s a cursory introduction to functions.\
    \ They’re a vital way of structuring your program. Programs, where everything\
    \ is only in one function, are tedious to read and challenging to maintain. Programs,\
    \ where things are more split up, are easier to understand and manage by far.\n\
    \n# Chapter 4: Polymorphism\n\nPolymorphism means to exist in many forms. In programing,\
    \ polymorphism occurs when we have many classes that are related to each other\
    \ through inheritance.\n\nIn C++, polymorphism means that a call to a function\
    \ will lead to the execution of a different function depending on the type of\
    \ object that has invoked the function. Consider the example given below in which\
    \ we have a base class derived or inherited by two other classes:\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\nclass Figure {\nprotected : int breadth\
    \ , length ;\npublic : Figure ( int x = 0 , int y = 0 ){\nbreadth = x ; length\
    \ = y ; }\nint area () {cout << \"Area of parent class is :\" << endl ; return\
    \ 0 ; }\n}; \nclass Rectangle : public Figure {\npublic : Rectangle ( int x =\
    \ 0 , int y = 0 ): Figure ( x , y ) { }\nint area () {cout << \"Area of Rectangle\
    \ class is :\" << endl ; return ( breadth * length ); }};\nclass Square : public\
    \ Figure {\npublic : Square ( int x = 0 , int y = 0 ): Figure ( x , y ) { }\n\
    int area () {cout << \"Area of Square class is :\" << endl; return(breadth * length);\
    \ }};\n\n// Main function\nint main () {\nFigure * figure ; \nRectangle rec (\
    \ 10 , 7 ); \nSquare sq ( 5 , 5 );\n// store address of Rectangle\nfigure = &\
    \ rec ;\n// call rectangle area.\nfigure -> area (\n// store address of Square\n\
    figure = & sq ;\n// call area\nfigure -> area ();\nreturn 0 ; }\n```\n\nThe code\
    \ will return the following: The output is incorrect. The reason for this is that\
    \ the call of `area()` function has been set only once by the compiler as the\
    \ version that has defined in the base class. This is referred to as static resolution\
    \ or static linkage of the function. The function call is fixed before the execution\
    \ of the program. Sometimes this is referred to as early binding since our `area`\
    \ has been set during the compilation.\n\nLet us make a modification to the code\
    \ so that the `area()` function is declared within the `Figure` class. However,\
    \ we will declare it with `virtual` keyword as shown below:\n\n```cpp\nclass Figure\
    \ {\nprotected : int breadth , length ;\npublic : Figure ( int x = 0 , int y =\
    \ 0 ){\nbreadth = x ; length = y ; }\nvirtual int area () {cout << \"Area of parent\
    \ class is :\" << endl; return 0; }};\n```\n\nThis means you should now have the\
    \ following:\n\n```cpp\n#include <iostream>\nusing namespace std;\nclass Figure\
    \ {\nprotected : int breadth , length ;\npublic : Figure ( int x = 0 , int y =\
    \ 0 ){\nbreadth = x ; length = y ; }\nvirtual int area () {cout << \"Area of parent\
    \ class is :\" << endl; return 0; }}; \nclass Rectangle : public Figure {\npublic\
    \ : Rectangle ( int x = 0 , int y = 0 ): Figure ( x , y ) { }\nint area () {cout\
    \ << \"Area of Rectangle class is :\" << endl ; return ( breadth * length ); }};\n\
    class Square : public Figure {\npublic : Square ( int x = 0 , int y = 0 ): Figure\
    \ ( x , y ) { }\nint area () {cout << \"Area of Square class is :\" << endl ;\
    \ return (bread * length ); }};\n\n// Main function\nint main () {\nFigure * figure\
    \ ; \nRectangle rec ( 10 , 7 ); \nSquare sq ( 5 , 5 );\n// store address of Rectangle\n\
    figure = & rec ;\n// call rectangle area.\nfigure -> area (\n// store address\
    \ of Square\nfigure = & sq ;\n// call area\nfigure -> area ();\nreturn 0 ; }\n\
    ```\n\nThe code should now return the following: The compiler has considered the\
    \ elements of the pointer rather than its type. The objects of `rec` and `sq`\
    \ have been stored in `figure`; their respective definition of the `area()` function\
    \ has been called. This shows that each of the derived classes has a different\
    \ implementation of the function named `area`. This is known as polymorphism.\
    \ You have more than one class with the same function name and the same parameters,\
    \ but the implementation is different.\n\nNotice that we used the `virtual` keyword\
    \ to make the function virtual. When a virtual function is defined in the base\
    \ class, and another version in the derived class, this will act as a signal to\
    \ the compiler that a static linkage to the function is not needed. We only need\
    \ a selection of the function to be called at any point in the program based on\
    \ the type of object for which the function is being called. This operation is\
    \ known as late binding or dynamic linkage.\n\nSometimes, you may need including\
    \ a virtual function in the base class for it to be redefined in a derived class\
    \ to suit the class objects, but you have no meaningful definition to give to\
    \ the function in the base class. In such a case, our virtual function `area()`\
    \ in the base class can be changed to the following:\n\n```cpp\nclass Figure {\n\
    protected : int breadth , length ;\npublic : Figure ( int x = 0 , int y = 0 ){\n\
    breadth = x ; length = y ; }\nvirtual int area () = 0 ; };\n```\n\nNotice the\
    \ use of `= 0;` in the function. This tells the C++ compiler that the function\
    \ doesn’t have a body. Such a function is known as a pure virtual function.\n\n\
    ### Object Destruction and Polymorphism\n\nObject destruction is tricky, especially\
    \ when it comes to the object being destroyed through an interface. You could\
    \ have code like this, for example:\n\n```cpp\nclass Drawable{\npublic:virtual\
    \ void draw () = 0;\n};\nclass MyDrawable : public Drawable{\npublic:virtual void\
    \ draw ();\nMyDrawable ();\n~MyDrawable ();\nprivate:int *mydata;\n};\nMyDrawable::MyDrawable\
    \ (){mydata = new int;}\nMyDrawable::~MyDrawable (){delete mydata;}\nvoid deleteDrawable\
    \ (Drawable *drawable){delete drawable;}\nint main (){deleteDrawable( new MyDrawable()\
    \ )}\n```\n\nWhat’s going on inside `deleteDrawable`? Remember, when `delete`\
    \ gets used, the destructor is called, so the line that reads `delete drawable`\
    \ makes a function call on the object. But how does the compiler know where the\
    \ `MyDrawable` destructor is? The compiler doesn’t know what the exact type of\
    \ the `drawable` variable is, but it does know that it’s a `Drawable`, something\
    \ that has a `draw()` method. All it knows is how the `MyDrawable` destructor\
    \ itself can found the destructor associated `Drawable`. As `MyDrawable` allocates\
    \ memory in its constructor, to free the memory, the `MyDrawable` destructor must\
    \ run.\n\nOkay, so you could be thinking that this is what virtual functions are\
    \ designed to fix. That’s correct. What we should be doing is declaring the destructor\
    \ `virtual` in `Drawable`; that way the compiler will know that it has to look\
    \ for a destructor that has been overridden when `delete` has been called on a\
    \ pointer to a `Drawable`:\n\n```cpp\nclass Drawable{\npublic:virtual void draw\
    \ ();\nvirtual ~Drawable ();\n};\nclass MyDrawable : public Drawable{\npublic:virtual\
    \ void draw ();\nMyDrawable ();\nvirtual ~MyDrawable ();\nprivate:int *mydata;\n\
    };\n```\n\nWhen we make the structure in the superclass virtual, and when `delete`\
    \ frees up a `Drawable` interface, the overridden destructor gets called. As a\
    \ rule, when you make any superclass method virtual, the superclass destructor\
    \ should be made virtual as well. Once one method has been made virtual, you are\
    \ saying that the class can be passed around to methods that will take an interface.\
    \ The methods can then do whatever they want, and that includes deleting the object,\
    \ so making the destructor virtual makes sure that the object is cleaned up properly.\n\
    \n# Chapter 5: Operator type and overloading\n\nOperators in C++\n\nC++ provides\
    \ a rich set of operators that perform a number for different functions on constants\
    \ and variables. C++ has mainly following types of operators:\nArithmetic Operators\
    \ as addition, multiplication, etc.\nRelational Operators as less than, greater\
    \ than, etc.\nLogical Operators as AND, OR, etc.\nBitwise Operators\nAssignment\
    \ Operators\n\nArithmetic Operators\n\nC++ mainly provides 7 arithmetic operators.\
    \ We will discuss each operator with two variables `x` and `y` where `x` has value\
    \ as `45` and `y` has value has `25`.\n"
