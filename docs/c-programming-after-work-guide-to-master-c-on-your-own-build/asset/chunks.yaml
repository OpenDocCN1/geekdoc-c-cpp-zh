    to be passed as an argument to the method. The syntax already knows that a_vector
    is to be passed as an implicit argument into the size method.The syntax below<variable>.<function
    call>( <args> );can be thought of as calling a function that goes with the type
    for the variable. In other words, it’s a bit like writing:<function call>( <variable>,
    <args> );In the example:a_vector.size();it would be like:size( a_vector );Over
    the next few sections, we will discuss more methods, including ways to declare
    and use them. For now, it’s enough for you to understand that several methods
    can be called on a vector, using the right syntax. The special method syntax is
    the only way of making that type of function call. You couldn’t, for example,
    write this: size(a_vector ).Other Vector FeaturesA vector also makes it very easy
    to up the number of items held without needing to allocate memory. For example,
    adding extra items to the vector would be written like this:a_vector.push_back(
    10 );This adds another item of 10 at the end of the vector. The vector will take
    care of the resizing. If you wanted to do this with an array, the memory would
    have to be allocated, the values copied over, and the new item added in. While
    a vector does do memory allocation and copying, it does it intelligently, in a
    manner in which it doesn’t have to resize itself every time a new item is added.However,
    although you can use push_back to add items to the end of the vector, using the
    brackets on their own wouldn’t be the same. Brackets let you work only with data
    that has already been allocated, mainly, so that memory allocation isn’t done
    without you being aware.So, a code like this:vector<int> a_vector( 10 );a_vector[
    10 ] = 10; // the last valid element is 9wouldn’t work and would likely result
    in the program crashing. Not to mention, it’s dangerous. Writing it like this:vector<int>
    a_vector( 10 );a_vector.push_back( 10 ); // add a new element to the vectorworks
    to resize the vector.MapsWe mentioned maps a little while ago using a value to
    look up another value. This is common in programming such as when you want to
    implement an address book for emails where addresses are looked up by name or
    a program where you look up an account using an account number or letting user’s
    login to their games.The STL gives us a map type that lets us specify the key
    type and value. An example would be a data structure that holds an email address
    book; this could be implemented as follows:#include <map>#include <string>using
    namespace std;map<string, string> name_to_email;We have to tell the structure
    that there are two types: string, for the key, and another string for the value,
    an email address in this case.One of these maps’ helpful features is that when
    a map is used, the syntax can also be used as an array. If you want to add value,
    it’s much like an array, except the key type is used instead of an integer:name_to_email[
    "Billy Bunter" ] = "billybunter@thisemailaddress.com";and getting value from a
    map is much the same:cout << name_to_email[ "Billy Bunter" ];You get the simplicity
    that goes with an array, but with the ability to store whatever type you want.
    And what’s even better is that, unlike the vector, the map size doesn’t have to
    be set before the [] operator is used to add an element.Removing items from maps
    is just as easy. Let’s say that you fell out with Billy Bunter and want him removed
    from your address book. You can do that using the erase method:name_to_email.erase(
    “Billy Bunter” );And you can use the size() method to check what size a map is:name_to_address.size();And
    the empty() method to see if a map is empty:if ( name_to_address.empty() ){cout
    << "The address book is empty. I bet you wish you hadn’t deleted Billy.";}Do not
    confuse this with how you make a map empty. That’s done using the clear() method:name_to_address.clear();Because
    of the consistency in the naming conventions in the STL, the same methods can
    be used on vectors.IteratorsAs well as data storage and the ability to access
    elements individually, you can also go through all the items in a data structure.
    With arrays or vectors, this is just a case of reading each element using the
    array length. But with maps, because they have both numeric and non-numeric keys,
    you can’t always iterate through using a counter variable.To get around this,
    the STL provides us with an iterator, which is a variable that lets you access
    the elements of a data structure sequentially, even if the data structure doesn’t
    usually have a good way of doing that. We’ll start by looking at using iterators
    with vectors and then move on to using one with the map elements. The idea is
    that the iterator will store the position in a structure so that you can use that
    position to access the element. Then you call a method on the iterator to move
    on to the next element.Some unusual syntax is required for declaring an iterator.
    For a vector of integers, it would look like this:vector<int>::iteratorWhat this
    says is that you have the vector and want an iterator that will work for the specific
    type, which is why we used the ::iterator. Because the iterator marks the position
    in the structure, the iterator is requested from the data structure: vector vec;vector<int>
    vec;vec.push_back( 1 );vec.push_back( 2 );vector<int>::iterator itr = vec.begin();The
    begin method call will return an iterator that allows you to access the vector’s
    first element.Iterators can be considered similar to pointers—you speak of element
    locations in the structure or use it for getting the element. In our case, we
    read the vector’s first element using this syntax:cout << *itr; // print out the
    vector’s first elementWe use the * operator in the same way we do with a pointer;
    it makes sense when you consider that both store locations.If you want the next
    element, the iterator is incremented:itr++;This lets the iterator know it needs
    to move on to the next element.The prefix operator can also be used:++itr;You
    can see if you have reached the end by making a comparison with the iterator and
    the end iterator; to do this, call:vec.end();If you want code that will loop over
    a whole vector, it will look like this:for ( vector<int>::iterator itr = vec.begin();
    itr != vec.end(); ++itr ){cout << *itr << endl;}We can loop over a map using a
    similar approach, but remember that the map doesn’t store single values; it stores
    key/value pairs. When you dereference an iterator, it has two fields—one for key
    and one for value:int key = itr->first; // get the key from iteratorint value
    = itr->second; // get the value from iteratorBelow is some code that will display
    a map’s content in an easy-to-read format:void displayMap (map<string, string>
    map_to_print){for ( map<string, string>::iterator itr = map_to_print.begin(),
    end =map_to_print.end();itr != end;++itr ){cout << itr->first << " --> " << itr->second
    << endl;}}This code is very similar to what is used for iterating over a vector;
    the only difference is that the map data structure is used along with the first
    and second fields on the iterator.Checking a Map for a ValueSometimes you want
    to be able to see if a given key has been stored in a map. Let’s say you’re looking
    for someone in your address book. You use the find() method to see if the specified
    value is there and, if it is, retrieve it. An iterator is returned and will either
    have the object location with the specified key or will be an end iterator if
    the object wasn’t found.map<string, string>::iterator itr = name_to_email.find(
    "Billy Bunter" );if ( itr != name_to_email.end() ){cout << "How it is to see Billy
    again. His email is: " << itr->second;}If you just want to access an element that
    isn’t in the list, use the standard brackets:name_to_email[ "John Doe" ];The map
    will insert an empty element if the value isn’t there already.Taking StockI have
    only touched on the basics of the STL, but you now have enough information to
    use some of the foundational types in the library. The vector can be used to replace
    arrays altogether and, if you don’t want to take the time to insert and modify,
    vectors can also be used in place of linked lists. With the vector type at your
    fingertips, there are very few reasons why you would want to use an array, and
    most of those reasons are advanced, such as when you work with the file I/O, which
    we will discuss at the end of the guide.The single most useful data type is the
    map. Using maps makes it easy to write sophisticated programs without having to
    worry too much about data structure creation. Instead, your attention can be focused
    on solving problems. In some ways, the map can replace a basic binary tree. Most
    of the time, you’ll want to go into binary tree implementation unless it’s for
    certain performance requirements, or you specifically need a tree structure.That’s
    where the STL’s true power lies: around 80 percent of the time, it gives you the
    core structures you need, leaving you free to write the code that solves the problems.
    The rest of the time, you will need the knowledge to build and implement your
    own data structures.Some programmers prefer using their code instead of ready-built
    code. Most of the time, you should NOT use your own data structures; the built-in
    ones are faster, better, and more complete. However, knowing how to build does
    give you much better insight into using them.So, when might you want to use your
    own structures? Let’s say you want a calculator that allows arithmetic expressions
    to be input by users and then evaluates the inputs with the correct order of operations.
    An example would be something like 4*9+8/3, evaluated in a way that the division
    and multiplication are done before the addition.This kind of structure can easily
    be thought of in terms of a tree. You could express 4*9+8/3 like this:+*  /4  *  8  3Each
    node is evaluated in one of two ways:If the node is a number, the value is returnedIf
    the node is an operator, the values of the two subtrees are computed, and the
    operation is performed.To build a tree like this will require a raw data structure;
    you can’t just use a map. If you only have the STL, you will struggle with this.
    However, once you understand recursion and binary trees, it becomes a lot easier.Chapter
    9: STLSTL/C++ Standard Library: Containers, Algorithms, IteratorsA common misnomer
    is to refer to the C++ Standard Library as the STL. The STL, or Standard Template
    Library, was a standard developed sometime in the past. The C++ Standard Library
    is a set of templates, many of which were adopted from the STL. The STL is now
    deprecated, but some extremely useful templates remain.The Standard Library offers
    a solution to this problem in the form of containers. Containers manage sets of
    data of the same type. They include vectors, sets, and lists, among others.Vectors
    are much like arrays, except they handle their own storage and size.Much like
    with strings, you need to import the vector library in order to use the template:#include
    <vector>Now you’re able to access everything regarding vectors.You declare a template
    like so:template< type> variableName;Let’s say we wanted to go back to the earlier
    example of grades, creating a self-sizing array of grades. We’d declare it like
    this:vector<int> grades;Adding values to a template is simple. You had an element
    by using the concept of pushing and popping. You push a new value onto the vector,
    or you pop a value off.Let’s say the first grade you wanted to add was a 55 (poor
    guy.) We could do this by typing:grades.push_back(55);You’ve now added your first
    value to the vector.What if you want to add a set of values? Well, luckily, in
    C++11, you can also insert a set of vectors in a similar manner to which you initialize
    a set of values in an array, using the vector.insert() function. This takes two
    arguments: the index at which you start inserting, and the values you’d like to
    insert. If you have multiple values in your vector, you can just use vector.end()
    to find the point of insertion.grades.insert(grades.end(), { 96, 64, 75, 83 });In
    earlier versions, you would need to create a temporary array to insert the data.int[]
    tmp = { 96, 64, 75, 83 };grades.insert(grades.end(), tmp, tmp + 4);To go through
    every item in the list, you can use something called a for each loop in other
    languages. If we wanted to print out every item on the list, we would do the following:for
    (int i : grades) {cout << i << “\n”;}What if we weren’t using a primitive data
    type but instead an object? There’s support for that as well, using something
    called iterators. By the usage of iterators, you can access methods of the object
    (such as .length() or .substr() for a string).If we had a vector of strings, for
    example, called j and we wanted to print the length of every string therein:'
