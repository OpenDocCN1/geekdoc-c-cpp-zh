    ```cpp

    for (string i : j) {cout << i << " - string length: " << i.length() << "\n"; }

    ```

    你可以对创建的任何对象执行此操作，但我们会在下一章开始实际创建对象时再更详细地讨论这一点。


    另一种类型的容器是 `lists`，它的功能与 `vectors` 非常相似。这两者之间的具体差异对于初学者来说可能难以理解。尽管如此，关于这两种类型容器的通用规则是：除非你需要在容器末尾的其他任何地方不断添加或删除元素，否则通常应该使用
    `vector`。


    另一种类型的容器被称为 `associative container`（关联容器），它以键值对和映射值的形式进行格式化。它通常根据键进行排序。最著名的关联容器类型被称为
    `map`。当你需要将一组数据与特定特征关联时，这种容器非常有用。用现实世界的例子来说，商店的库存系统可以使用 `map` 来维护 `SKU 代码`（整数
    - 键）和项目名称（字符串 - 映射数据）。


    为此，你需要导入 `<map>` 头文件，并通过以下方式声明 `map`：

    ```cpp

    map<int, string> Inventory;

    Inventory[00400030] = “Tamagotchi, blue”;

    Inventory[00400031] = “Tamagotchi, white”;

    Inventory[00324359] = “Twilight, DVD”;

    Inventory[44539294] = “Dark Souls, Xbox 360”;

    ```

    如果你想在代码稍后调用某个特定元素，可以执行类似的操作：

    ```cpp

    cout << “Inventory[00400030] is: “ << Inventory[00400030] << “\n";

    ```

    调用 `Inventory[00400030]` 将打印出映射值，这里是“Tamagotchi, blue”。


    另一种关联容器是 `set`。`Sets` 的功能与 `maps` 非常相似，不同在于它们不允许重复。`Maps` 允许重复值，但不允许重复键。


    `STL` 中还包含一个名为“algorithms”（算法）的库。该库可以用于搜索、排序和处理元素范围。其中包含函数如 `equal()`，用于判断两个元素集合是否相等。还有
    `transform()`，它可以将给定的函数应用于给范围。


    ## 结论


    我们已经来到了这本书的末尾，但对于你来说，编程生活只是漫长且果实累程的开始。掌握了 `C++` 的基础知识，是时候开始你真正的学习了。开始编写那些程序吧！开始实现数据结构和算法。


    如果你喜欢学习 `C++`，那么这门奇妙的语言还有很多可以学习和做的事情。请务必通过该系列的第二本书继续你的旅程，它在涵盖稍微复杂的话题的同时，仍然对初学者非常友好。


    `C++` 编程语言是一种具有竞争力的通用平台，它借用了命令式编程范式的一些特征，并可以在任何平台上运行。它被称为命令式编程语言，因为它通过分步执行的过程来实现目标。该语言使用面向对象编程的概念来设计和实现复杂的程序。


    下一步是开始使用 `C++` 语言编写你想要的的一些不同程序和代码。即使你只是刚起步，只想花时间练习本指南中的一些代码，你仍然处于通过这种语言取得优异成果的正确道路上。


    在旅途中你的自己的代码实践越多，编写和创建你自己的代码就会变得越容易。


    `C++` 语言是一个独特的工作选择，它将帮助我们创建一些真正强大健壮的代码，而且这种语言发现的功能与我们能够处理的任何其他语言都不同。


    所有这些在你旅途中想要编写的某些代码中可能都是重要的，当我们完成本指南后，你应该觉得已经准备好处理这些内容并将它们添加到你自己的代码中了。


    正如我们所看到的，在使用 `C++` 语言时，我们可以做的事情非常多。它是世界上最好的编程语言之一，无论你是初学者，还是已经从事编程编码工作很久的人。


    当你准备好开始自己的编码旅程，并想要能够迅速创建出一些自己的程序时，`C++` 编程语言利用 `OOP` 范式的特征来开发和执行程序。这些特征中的包括使用对象、类、数据抽象和封装、继承以及多态。


    程序侧重于使用数据而不是过程来解决现实问题。程序试图通过提高程序的数据安全性、促进代码重用性以及利用继承特性制作有效程序，来弥补其他传统编程语言的缺点。


    与许多其他 `OOP` 语言一样，`C++` 支持各种构建模块。在教程中，你学习了在处理从简单到复杂的程序如何使用各种内置数据类型。数据类型分为原始数据类型、派生数据类型和抽象数据类型。你不仅学习了如何使用原始或标准数据类型，还学习了如何定义你自己的用户数据类型。


    享受你的旅程。如果你在编程时觉得不好，那么它就不适合你。让它变得有趣，变得兴奋，并让它成为你早晨起床的理由。


    祝你的旅程顺利。


