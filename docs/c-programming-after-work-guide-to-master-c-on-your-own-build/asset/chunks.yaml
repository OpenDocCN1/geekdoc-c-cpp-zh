- fmt: "\nAll of these are very important for the creation of good data types. We’ll\
    \ use the string to demonstrate this. Strings must be able to initialize themselves,\
    \ even if they’re empty. They should need to rely on external code for that. Once\
    \ the string is declared, it’s immediately available for use. When you’re finished\
    \ with the string, it must be able to clean up because all strings allocate memory.\
    \ When the `string` class is used, there is no need for another method to be called\
    \ for that; the string does it automatically.\n\nLastly, it must be able to copy\
    \ from one variable to another, the same way that integers can be copied between\
    \ variables. Put together, all of this functionality should be made a part of\
    \ all classes so that they can easily be used. We’ll take these three features,\
    \ one at a time, and look at how easy C++ makes all of this.\n\n# Object Construction\n\
    \nYou might have spotted that we didn’t have any code for initializing the board\
    \ in our `ChessBoard` interface, which was the public section of the code. We\
    \ can fix that now.\n\nWhen a class variable is declared, the variable needs to\
    \ be able to be initialized:\n```cpp\nChessBoard board;\n```\n\nWhen an object\
    \ is declared, the code that runs it is called the constructor, and this should\
    \ set the object up so that it needs no more initialization. Constructors can\
    \ take arguments too—you saw this with the vector declaration of a particular\
    \ size: `vector<int> v( 10 );`. The `vector` constructor is called with a value\
    \ of 10; the new `vector` is initialized by the constructor so that it can hold\
    \ 10 integers immediately.\n\nCreating a constructor is nothing more than declaring\
    \ a function with the same name as the class, with no arguments and no return\
    \ value. You don’t even give it a `void` value; no type is provided for the return\
    \ value:\n\n```cpp\nenum ChessPiece { EMPTY_SQUARE, WHITE_PAWN /* and others */\
    \ };\nenum PlayerColor { PC_WHITE, PC_BLACK };\nclass ChessBoard{\npublic:\n \
    \   ChessBoard (); // <-- no return value at all!\n    PlayerColor getMove ();\n\
    \    ChessPiece getPiece (int x, int y);\n    void makeMove (int from_x, int from_y,\
    \ int to_x, int to_y);\nprivate:\n    ChessPiece _board[ 8 ][ 8 ];\n    PlayerColor\
    \ whosemove;\n};\n\nChessBoard::ChessBoard () // <-- no return value\n{\n    whosemove\
    \ = PC_WHITE;\n    // empty the entire board to start with and then add in the\
    \ pieces\n    for ( int i = 0; i < 8; i++ ){\n        for(int j = 0; j < 8; j++\
    \ ){\n            board[ i ][ j ] = EMPTYSQUARE;\n        }\n    }\n    // other\
    \ code needed for board initialization\n}\n```\n\nI won’t keep showing you the\
    \ method declarations, but I will continue to show you the class declaration,\
    \ so that you can see how it all fits together. Now, note that the constructor\
    \ above is in the public part of the class. If we didn’t make the `ChessBoard`\
    \ constructor public, we couldn’t create any object instances. Why not? Because,\
    \ whenever an object is created, the constructor has to be called; if we make\
    \ it private, it can’t be called from outside the class. Objects can only be initialized\
    \ by calling the constructor and, if you make it private, you won’t be able to\
    \ declare the object.\n\nThe constructor gets called on the same line the object\
    \ is created on:\n```cpp\nChessBoard board; // calls ChessBoard constructor\n\
    ```\nOr when memory is allocated:\n```cpp\nChessBoard *board = new board; // this\
    \ calls the ChessBoard constructor as part of the memory allocation\n```\nWhen\
    \ multiple objects are declared:\n```cpp\nChessBoard a;\nChessBoard b;\n```\n\n\
    Constructors are always run in the order of object declaration—`a` and then `b`.\
    \ As with a normal function, constructors can take one or more arguments, and\
    \ several constructors can be overloaded by the type of argument if there is a\
    \ different way of initializing the object. For example, a second constructor\
    \ could be created for `ChessBoard` to take the board size:\n\n```cpp\nclass ChessBoard{\n\
    \    ChessBoard ();\n    ChessBoard (int board_size);\n};\n```\n\nThe function\
    \ definition is the same as any class method:\n```cpp\nChessBoard::ChessBoard\
    \ (int size){// ... code}\n```\n\nThe argument is passed to the constructor like\
    \ this:\n```cpp\nChessBoard board( 8 ); // 8 is an argument to the ChessBoard\
    \ constructor\n```\n\nWhen you use the `new` keyword, passing an argument looks\
    \ like you’re calling the constructor directly:\n```cpp\nChessBoard *p_board =\
    \ new ChessBoard( 8 );\n```\n\nA note on the syntax: although parentheses are\
    \ used for passing arguments, you can’t use them to declare objects that have\
    \ no-argument constructors. You can’t do this:\n```cpp\nChessBoard board();\n\
    ```\nThe correct form is:\n```cpp\nChessBoard board;\n```\nHowever, you can use\
    \ parentheses when the `new` keyword is used:\n```cpp\nChessBoard *board = new\
    \ board();\n```\nThis is one of the unfortunate little foibles of C++ parsing\
    \ because the details are kept very obscure. Just don’t use parentheses when you\
    \ declare objects with a no-argument constructor.\n\nSo, what happens if a constructor\
    \ isn’t declared?\n\nIf a constructor isn’t declared, C++ creates one. It won’t\
    \ take arguments or initialize `int`, `char`, or any other primitive type, but\
    \ it will initialize every class field by calling the default constructor for\
    \ each one. Generally, you should create constructors just to make sure everything\
    \ gets properly initialized. As soon as the call constructor is declared, C++\
    \ won’t generate the default for you. The compiler assumes that you know exactly\
    \ what you’re doing and that you’re going to create the constructor you need.\
    \ In particular, if you create constructors that take arguments, the code no longer\
    \ has the default constructor unless you declare one specifically.\n\nThis can\
    \ have unexpected consequences. If the automatically generated constructor is\
    \ used and then you add a non-default one that takes arguments, the code that\
    \ depends on the automatic constructor won’t compile. It’s up to you to provide\
    \ a default constructor because the compiler won’t do it for you.\n\n## Initialization\
    \ List and Const Fields\n\nIf the class fields are declared as `consts`, the file\
    \ has to be initialized in the list:\n```cpp\nclass ConstHolder{\npublic:\n  \
    \  ConstHolder (int val);\nprivate:\n    const int _val;\n};\nConstHolder::ConstHolder\
    \ (): _val( val ){}\n```\n`const` fields can’t be initialized by assigning to\
    \ them because the fields are set and can’t be changed. The only place where the\
    \ class has not been formed fully is in the initialization list, so immutable\
    \ objects can safely be set. For the same reason, if a field is a reference, it\
    \ has to be initialized in the list.\n\n# Chapter 8: Library\n\n## The Standard\
    \ Template Library\n\nIt’s good to be able to write your own data structures.\
    \ However, as you might have picked up, it isn’t all that common. But you didn’t\
    \ work through all the previous content for no reason. You’ve now learned quite\
    \ a bit about building data structures as necessary, along with some of the more\
    \ common structures that you might need when writing a data structure. However,\
    \ C++ has a cool feature, a huge library of code that can be reused. It’s called\
    \ the Standard Template Library (`STL`) and contains the most common data structures...\
    \ These include binary trees and linked lists. These structures let you specify\
    \ what data type they will store.\n\n## Vectors\n\nContained in the STL is an\
    \ array replacement—the `vector`. This is much like an array but is resizable;\
    \ no longer have to worry about allocating memory and moving elements. The array\
    \ syntax is:\n```cpp\nint an_array[ 10 ];\n```\nwhereas the vector syntax is:\n\
    ```cpp\n#include <vector>\nusing namespace std;\nvector<int> a_vector( 10 );\n\
    ```\nThe `vector` header file must be included along with `std`. This is because,\
    \ like `cout` and `cin`, the `vector` is a part of the standard library. Furthermore,\
    \ when a vector is declared, you must provide the type being stored. This is done\
    \ using angled brackets:\n```cpp\nvector<int>\n```\n\n## Calling a Method on a\
    \ Vector\n\nA vector provides you with much more than an array. You can do all\
    \ sorts of things, such as adding elements beyond the end. The vector provides\
    \ functions to help with this. A vector uses a C++ feature known as a method.\
    \ Calling methods requires syntax as in this example:\n```cpp\na_vector.size();\n\
    ```\n\n## Other Vector Features\n\nA vector also makes it very easy to up the\
    \ number of items held without needing to allocate memory. For example, adding\
    \ extra items to the vector would be written like this:\n```cpp\na_vector.push_back(\
    \ 10 );\n```\nThis adds another item of 10 at the end of the vector. The vector\
    \ will take care of the resizing. If you wanted to do this with an array, the\
    \ memory would have to be allocated, the values copied over, and the new item\
    \ added in. While a vector does do memory allocation and copying, it does it intelligently,\
    \ in a manner in which it doesn’t have to resize every time a new item is added.\n\
    \nHowever, although you can use `push_back` to add items to the end of the vector,\
    \ using the brackets on their own wouldn’t be the same. Brackets let you work\
    \ only with data that has already been allocated, mainly, so that memory allocation\
    \ isn’t done without you being aware. So, a code like this:\n```cpp\nvector<int>\
    \ a_vector( 10 );\na_vector[ 10 ] = 10; // the last valid element is 9\n```\n\
    would’t work and would likely result in the program crashing. Not to mention,\
    \ it’s dangerous. Writing it like this:\n```cpp\nvector<int> a_vector( 10 );\n\
    a_vector.push_back( 10 ); // add a new element to the vector\n```\nworks to resize\
    \ the vector.\n\n## Maps\n\nWe mentioned maps a little while ago using a value\
    \ to look up another value. This is common in programming such as when you want\
    \ to implement an address book for emails where addresses are looked up by name\
    \ or a program where you look up an account using an account number or letting\
    \ user’s login to their games.\n\nThe STL gives us a `map` type that lets us specify\
    \ the key type and value. An example would be a data structure that holds an email\
    \ address book; this could be implemented as follows:\n```cpp\n#include <map>\n\
    #include <string>\nusing namespace std;\nmap<string, string> name_to_email;\n\
    ```\nWe have to tell the structure that there are two types: `string`, for the\
    \ key, and another `string` for the value, an email address in this case. One\
    \ of these maps’ helpful features is that when a `map` is used, the syntax can\
    \ also be used as an array. If you want to add value, it’s much like an array,\
    \ except the key type is used instead of an integer:\n```cpp\nname_to_email[ \"\
    Billy Bunter\" ] = \"billyunter@emailaddress.com\";\n```\nAnd getting value from\
    \ map is much the same:\n```cpp\ncout << name_to_email[ \"Billy Bunter\" ];\n\
    ```\n\n## Removing items from maps\n\nRemoving items from maps is just as easy.\
    \ Let’s say that you fell out with Billyunter and want him removed from your address\
    \ book. You can do that using `erase()` method:\n```cpp\nname_to_email.erase(\
    \ \"Billy Bunter\" );\n```\nAnd you can use `size()` method to check what a map\
    \ is:\n```cpp\nname_to_email.size();\n```\nAnd the `empty()` method to see if\
    \ a map is empty:\n```cpp\nif ( name_to_email.empty() ){\n    cout << \"The address\
    \ book is empty.\";\n}\n```\nDo not confuse this with how you make map empty.\
    \ That’s done using `clear()` method:\n```cpp\nname_to_address.clear();\n```\n\
    \n## Iterators\n\nAs well as data storage and the ability to access elements individually,\
    \ you can also go through all the items using iterators. With arrays or vectors\
    \ this is just a case. But with maps, because they have both numeric and non-numeric\
    \ keys, you can’t always iterate using a counter. To get around this, the STL\
    \ provides us with an iterator, which lets you access the elements.\n\nThe `begin()`\
    \ method will return an iterator that allows you to access the vector’s first\
    \ element:\n```cpp\nvector<int>::iterator itr = vec.begin();\n```\nIf you want\
    \ the next element, the iterator is incremented:\n```cpp\nitr++;\n```\nThe prefix\
    \ operator can also be used:\n```cpp\n++itr\n```\nYou can see if you have reached\
    \ the end by making a comparison with the iterator; to do this, call:\n```cpp\n\
    vec.end();\n```\nIf you want code that will loop over a whole vector, it will\
    \ look like this:\n```cpp\nfor ( vector<int>::iterator itr = vec.begin(); itr\
    \ != vec.end(); ++itr ){\n    cout << *itr << endl;\n}\n```\nWe can loop over\
    \ map using a similar approach, but remember that the map doesn’t store single\
    \ values; it stores key/value pairs. When you dereference an iterator, it has\
    \ two fields—one for key and one for value:\n```cpp\nint key = itr->first; //\
    \ get the key from iterator\nint value = itr->second; // get the value from iterator\n\
    ```\n\n## Taking Stock\n\nI have only touched on the basics of the STL, but you\
    \ now have enough information to use some of the foundational types in the library.\
    \ The `vector` can be used to replace arrays altogether and, if you don’t want\
    \ to take the time to insert and modify, vectors can also be used in place of\
    \ linked lists. With the `vector` type at your fingertips, there are very few\
    \ reasons why you would want to use an array, and most of those reasons are advanced,\
    \ such as when you work with the file I/O, which we will discuss at the end of\
    \ the guide.\n\nThe single most useful data type is the map. Using maps makes\
    \ it easy to write sophisticated programs without having to worry too much about\
    \ data structure creation. Instead, your attention can be focused on solving problems.\
    \ In some ways, the map can replace a basic binary tree. Most of the time, you’ll\
    \ want to go into binary tree implementation unless it’s for certain performance\
    \ requirements, or you specifically need a tree structure.\n\nThat’s where the\
    \ STL’s true power lies: around 80 percent of the time, it gives you the core\
    \ structures you need, leaving you free to write the code that solves the problems.\
    \ The rest of the time, you will need the knowledge to build and implement your\
    \ own data structures. Some programmers prefer using their code instead of ready-built\
    \ code. Most of the time, you should NOT use your own data structures; the built-in\
    \ ones are faster, better, and more complete. However, knowing how to build does\
    \ give you much better insight into using them.\n\n## Checking a Map for a Value\n\
    \nSometimes you want to be able to see if a given key has been stored in a map.\
    \ Let’s say you’re looking for someone in your address book. You use the `find()`\
    \ method to see if the specified value is there and, if it is, retrieve it. An\
    \ iterator is returned and will either have the object location with the specified\
    \ key or be an end iterator if the object wasn’t found.\n```cpp\nmap<string, string>::iterator\
    \ itr = name_to_email.find( \"Billy Bunter\" );\nif ( itr != name_to_email.end()\
    \ ){\n    cout << \"How it is to see Billy again. His email is: \" << itr->second;\n\
    }\n```\nIf you just want to access an element that isn’t in the list, use the\
    \ standard brackets:\n```cpp\nname_to_email[ \"John Doe\" ];\n```\nThe map will\
    \ insert an empty element if the value isn’t there already.\n"
