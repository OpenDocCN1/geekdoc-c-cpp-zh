  trans: "\n\n# 第 3 章：函数\n\n你可能记得在数学课上曾经处理过函数，例如 `f(x) = 2x + 5`。`f(0)` 的结果将是 `5`（`2(0)\
    \ = 5`），`f(1)` 将是 `7`（`2(1) + 5`），`f(2)` 将是 `9`（`2(2) + 5`），以此此类推。\n\nC++ 中的函数工作原理类似。函数执行操作后，通常会返回一个值。它们并不总是必须返回值。但是——不返回值的函数是空函数（void\
    \ functions）。\n\n首先，来看这段代码。它现在不需要逻辑上通；我们将对它进行过一遍。创建一个新项目并删除 `main.cpp` 中的内容，然后输入以下内容：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nint getArea(int l, int w);\n\
    int main(){\nint length, width;\ncout << \"Enter the length, and then enter the\
    \ width.\\n\";\ncin >> length >> width;\ncout << \"The area is: \" << getArea(length,\
    \ width);\nreturn 0;\n}\nint getArea(int l, int w) {\nint area = l * w;\nreturn\
    \ area;\n}\n```\n\n现在，让我们逐行分析一下：\n\n`#include <iostream>`\n这包含了输入输出所需的必需组件。\n\n\
    `using namespace std;`\n这表示我们正在使用标准输入/输出命名空间。\n\n`int getArea(int l, int w);`\n\
    这是我们声明第一个函数的地方。C++ 是过程编译的，所以你不能随随地乱放函数。你必须在之后编写它们之前声明它们，或者它们必须在你的 `main` 函数之前完全编写。为了清晰起见，我倾向于先初始声明，然后在\
    \ `main` 函数之后编写函数，但这是个人选择。无论如何，我们在这里创建了一个名为 `getArea` 的函数。名称前的 `int` 表示它将返回一个整数值。同样，`float\
    \ getArea(...)` 将返回一个浮点值，`char getChararacter(...)` 将返回一个字符，以此此类推。在声明中，我们给了两个变量，被称为“参数”（arguments）。就像在\
    \ `f(x)` 方程中，`x` 是方程修改的内容一样，参数变量就是我们的 C++ 读取并利用的内容。\n\n`int main(){`\n这是我们 `main`\
    \ 函数的开始。如果你还没有发现，每个程序都必须有一个 `main` 函数。它是你代码的入口点，编译器会积极寻找它。\n\n`int length, width;`\n\
    我们声明了两个变量，`length` 和 `width`。\n\n`cout << \"Enter the length, and then enter the\
    \ width.\\n\";`\n`cin >> length >> width;`\n我们要求用户输入长度和宽度，然后接受他们的输入。\n\n`cout\
    \ << “The area is: “ << getArea(length, width);`\n这里需要进一步的解释。输出流输出了我们给它的值，对吧？由于函数只是返回一个值，所以我们可以直接把它们放在输出流中。此外，由于此函数返回一个整数值，你可以创建一个新的整数，然后将其赋值赋值为函数的值，例如：`int\
    \ area = getArea(length, width);`。然后你只需要输出：`cout << “The area is: “ << area;`。不过这是一种浪费，因为这个程序不需要创建这个变量。但是，如果你确实需要存储像矩形面积这样的变量，你可以这样做。\n\
    \n`return 0;}`\n简单，每个 `main` 函数都必须返回 `0`。\n\n`int getArea (int l, int w) {`\n\
    这镜像了之前的函数声明，也是我们开始编写它的地方。\n\n`int area = l * w;`\n`return area;`\n我们创建了一个名为 `area`\
    \ 的新变量，它获取函数头中的两个参数并将它们相乘得到它的值。然后我们返回同一个整数。我们也可以简单地写成：`return l * w;`。这都是返回此函数的有效方式，并将带给你适当的结果。\n\
    \n这就是对函数的简要介绍。它们是结构化程序的重要方式。所有内容都只在一个函数中的程序读起来很枯燥，且难以维护。分工更细的程序要容易理解和管理得多。\n\n\
    # 第 4 章：多态\n\n多态意味着以多种形式存在。在编程中，当我们有许多通过继承相互相关的类时，就会发生多态。\n\n在 C++ 中，多态意味着对对函数的调用将根据调用函数的对象的类型导致执行不同的函数。考虑下面给出的示例，我们有一个基类被另外两个类派生或继承：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nclass Figure {\nprotected\
    \ : int breadth , length ;\npublic : Figure ( int x = 0 , int y = 0 ){\nbreadth\
    \ = x ; length = y ; }\nint area () {cout << \"Area of parent class is :\" <<\
    \ endl ; return 0 ; }\n}; \nclass Rectangle : public Figure {\npublic : Rectangle\
    \ ( int x = 0 , int y = 0 ): Figure ( x , y ) { }\nint area () {cout << \"Area\
    \ of Rectangle class is :\" << endl ; return ( breadth * length );};\nclass Square\
    \ : public Figure {\npublic : Square ( int x = 0 , int y = 0 ): Figure ( x , y\
    \ ) { }\nint area () {cout << \"Area of Square class is :\" << endl; return(breadth\
    \ * length); }};\n\n// Main function\nint main () {\nFigure * figure ;\nRectangle\
    \ rec ( 10 , 7 );\nSquare sq ( 5 , 5 );\n// store address of Rectangle\nfigure\
    \ = & rec ;\n// call rectangle area.\nfigure -> area (\n// store address of Square\n\
    figure = & sq ;\n// call area\nfigure -> area ();\nreturn 0 ; }\n```\n\n代码将返回如下：输出是错误的。这是因为\
    \ `area()` 函数的调用被编译器仅设置为基类中的版本。这被称为静态解析或静态链接。函数调用在程序执行之前就固定了。有时被称为早期绑定，因为我们的 `area`\
    \ 是在编译期间设置的。\n\n让我们对代码进行修改，使得 `area()` 函数在 `Figure` 类中声明。但是我们将使用 `virtual` 关键字来声明它，如下所示：\n\
    \n```cpp\nclass Figure {\nprotected : int breadth , length ;\npublic : Figure\
    \ ( int x = 0 , int y = 0 ){\nbreadth = x ; length = y ; }\nvirtual int area ()\
    \ {cout << \"Area of parent class is :\" << endl; return 0; }};\n```\n\n这意味着现在应该如下：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nclass Figure {\nprotected\
    \ : int breadth , length ;\npublic : Figure ( int x = 0 , int y = 0 ){\nbreadth\
    \ = x ; length = y ; }\nvirtual int area () {cout << \"Area of parent class is\
    \ :\" << endl; return 0; }}; \nclass Rectangle : public Figure {\npublic : Rectangle\
    \ ( int x = 0 , int y = 0 ): Figure ( x , y ) { }\nint area () {cout << \"Area\
    \ of Rectangle class is :\" << endl ; return ( breadth * length ); }};\nclass\
    \ Square : public Figure {\npublic : Square ( int x = 0 , int y = 0 ): Figure\
    \ ( x , y ) { }\nint area () {cout << \"Area of Square class is :\" << endl ;\
    \ return (breadth * length); }};\n\n// Main function\nint main () {\nFigure *\
    \ figure ;\nRectangle rec ( 10 , 7 );\nSquare sq ( 5 , 5 );\n// store address\
    \ of Rectangle\nfigure = & rec ;\n// call rectangle area.\nfigure -> area (\n\
    // store address of Square\nfigure = & sq ;\n// call area\nfigure -> area ();\n\
    return 0 ; }\n```\n\n代码现在应该返回如下：编译器考虑的是指针的元素而不是它的类型。`rec` 和 `sq` 的对象已存储在 `figure`\
    \ 中；它们各自的 `area()` 函数定义被调用。这显示每个派生类都有名为 `area` 的实现。这被称为多态。你有多个相同函数名和相同参数的类，但实现不同。\n\
    \n注意我们使用了 `virtual` 关键字使函数变为虚。当虚函数在基类中定义而在派生类中定义另一个版本时，这将向编译器发出信号，不需要静态链接。我们只需要根据调用函数的对象类型在程序的任何一点选择函数。这种操作被称为晚绑定或动态链接。\n\
    \n有时，你可能需要在基类中包含虚函数，以便在派生类中重新定义它以适应类对象，但你没有给基类中的函数提供意义定义。在这种情况下，我们基类中的虚函数 `area()`\
    \ 可以更改为：\n\n```cpp\nclass Figure {\nprotected : int breadth , length ;\npublic\
    \ : Figure ( int x = 0 , int y = 0 ){\nbreadth = x ; length = y ; }\nvirtual int\
    \ area () = 0 ; };\n```\n\n注意函数中使用 `= 0;`。这告诉 C++ 编译器该函数没有函数体。这样的函数被称为纯函数（pure\
    \ virtual function）。\n\n### 对象析构与多态\n\n对象析构是复杂的，特别是当通过接口销毁对象时。例如，你可以有这样的代码：\n\n\
    ```cpp\nclass Drawable{\npublic:virtual void draw () = 0;\n};\nclass MyDrawable\
    \ : public Drawable{\npublic:virtual void draw ();\nMyDrawable ();\n~MyDrawable\
    \ ();\nprivate:int *mydata;\n};\nMyDrawable::MyDrawable (){mydata = new int;}\n\
    MyDrawable::~MyDrawable (){delete mydata;}\nvoid deleteDrawable (Drawable *drawable){delete\
    \ drawable;}\nint main (){deleteDrawable( new MyDrawable() )}\n```\n\n`deleteDrawable`\
    \ 内部发生了什么？记住，当使用 `delete` 时，会调用析构函数，所以读取 `delete drawable` 的行在对象上调用了函数。但编译器如何知道\
    \ `MyDrawable` 析构函数在哪里？编译器不知道 `drawable` 变量的具体类型，但知道它是一个 `Drawable`，一个拥有 `draw()`\
    \ 方法的东西。它只知道 `MyDrawable` 析构函数本身如何找到与 `Drawable` 关联的析构函数。由于 `MyDrawable` 在其构造函数中分配了内存，为了释放内存，`MyDrawable`\
    \ 析构函数必须运行。\n\n# 第 5 章：运算符类型与重载\n\nC++ 中的运算符\n\nC++ 提供了丰富的运算符，用于对常量和变量执行不同的功能。C++\
    \ 主要有以下几种类型的运算符：\n算术运算符（加法、乘法等）\n关系运算符（小于、大于等）\n逻辑运算符（逻辑与、逻辑或等）\n位运算符\n赋值运算符\n\
    \n算术运算符\n\nC++ 主要提供了 7 种算术运算符。我们将使用两个变量 `x` 和 `y` 来讨论每个运算符，其中 `x` 的值为 `45`，`y`\
    \ 的值为 `25`。\n\n"
