    ```

    g++ -v

    ```

    如果安装了 GCC，你会得到如下消息：

    ```

    Target: i386-linux

    Configured with: posix

    gcc version 4.1

    ```


    ### Mac OS

    获取 Mac OS GCC 的最佳方法是访问 `developer.apple.com/x`，下载 Xcode 并遵循说明。


    ### Windows

    在 Windows 上获取 GCC 必须下载 MinGW。确保安装了最新版本的 MinGW 以及 g++，这些是基本要求。你可以考虑的另一件事是 IDE——集成开发环境。文本编辑器具有编译器和语法高亮功能。最好的是
    Code。还有其他我应该知道的吗？是的。C++ 的语法非常严格，并且对大小写敏感，所以输入时要小心。“Hello” 意味着什么，我们稍后会详细介绍。在进入更多细节之前，我想先介绍一下构成你代码的内容。首先，代码编写如下：

