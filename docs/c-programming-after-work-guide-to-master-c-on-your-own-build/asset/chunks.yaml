    # 引言

    欢迎来到奇妙编程世界。本书包含的章节将让你对 C++ 编程有基本的理解。到最后一个章节结束时，你将能够使用 C++ 独立创建一个完整的程序。


    本指南面向 C++ 的初学者。然而，如果你对编程完全陌生，我建议先阅读我们的《编程入门》。它涵盖了完全初级学者需要了解的所有概念、术语、编程范式和编码技术。


    本指南将花费一些时间来介绍我们使用 C++ 语言可以做的一切事情，以及学习这种语言有多大好处。


    这门 C++ 语言面向对象编程课程为学习者提供了设计、开发和有效实现健壮程序模型所需的概念和技术。作为一名学习者，你将掌握如何应用面向对象分析和设计的基本概念的实用知识，并解决日常活动中的各种问题。


    C++ 是一种广泛用于通用编程的计算机编程语言。它是 C 语言的扩展。可以通过 C 语言获得对 C++ 的基础理解。这就是为什么两种语言都表示为 C/C++。Bjarne
    Stroustrup 在 1979 年开发了这种多范式语言。


    在当今世界，许多操作系统使用 C++ 作为它们的基础语言。一些系统驱动程序、浏览器和游戏都是基于 C++ 程序的。它是一种自由形式、编译型且静态类型的编程语言。许多专业人士认为
    C++ 是实现所需结果最高效的语言。


    学习代码终究是未来的语言。我们生命中的某个时刻都曾听过类似这样的话。


    当你到达最后时，阅读 C++ 代码并编写既有趣又有用的程序对你来说将不再任何问题。那么，让我们深入学习 C++ 吧。


    # 第 1 章：C++ 剖析

    ## 编程语言简介

    如你所知，程序无非是一组指令。这些指令由硬件（即物理计算机设备）执行。尽管现代计算机速度很快，但它们也有自己的局限性。计算机只能理解以原生语言给出的指令指令。为此，你应该理解机器语言、汇编语言和高级语言的概念。


    ### 机器语言

    尽管计算机是非常先进的机器，但它们无法直接理解 C++ 这样的语言。计算机只理解 0 和 1。它们被称为位（bits）。它们只能理解以二进制格式给出的指令。我们给计算机的每组指令都会翻译成一组告诉处理器执行特定任务的指令。你应该理解不同类型的处理器具有不同的指令集。例如，奔腾（Pentium）处理器只理解它们自己的指令集。Macintosh
    的情况也是如此。在最开始，程序员必须用二进制语言编写指令。这非常耗时且具有挑战性。幸运的是，我们不需要经历这一切。


    ### 汇编语言

    由于机器语言很难处理，人们发明了一种名为汇编语言的新语言。在这里，每条指令都给出了一个短名称，变量用名称而不是二进制位来替换，使得程序员编写代码变得容易。你可能会问如何理解汇编语言。你不能。汇编语言将在汇编器的帮助下转换为机器语言。你应该记住每个
    CPU 都有自己的汇编语言。因此，一个 CPU 的汇编语言不能在另一个 CPU 上运行。即使汇编语言也有它的缺点。即使是简单任务，它们也需要大量的指令。


    ### 高级语言

    高级编程语言的出现是为了解决汇编和机器语言引起的问题。它们可以在任何计算机上运行。编译器的作用是生成 CPU 可以直接理解的可执行文件或程序。这些程序是独立程序。今天现有的现代编译器非常高效、快速，能将代码转换为可执行格式。一些编程语言使用解释器。解释器的工作是执行代码，但不将其编译为机器码。但这里我们不会学习解释器。任何给定的编程语言都可以被解释或编译。C、C++
    和 PASCAL 等语言是编译的，而 JavaScript 和 Perl 等脚本语言是解释的。


    问这个问题，你将得到十种不同的答案，但简单来说，C++ 是一种编译的、面向对象的计算机编程语言。如果你是编程新手，即使是这个定义可能让你感到有些困惑，所以让我们再详细地拆解一下。


    编程语言有两种类型——一种是解释型的，另一种是编译型的。解释型语言在解释器上运行——解释器读取代码并逐次执行命令。编译型语言在你的计算机上通过编译器将代码转换成程序。计算机无法读取字母；它们只能读取二进制数字，所以当你编写代码时，它必须先翻译成二进制。这被称为编译。面向对象的部分描述了代码的结构。


