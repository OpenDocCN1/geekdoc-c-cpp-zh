    # Introduction

    Welcome to the wonderful world of programming, the chapters contained in this
    book will give you a basic understanding of programming in C++. By its final chapter,
    you will be able to create a complete program on your own, using C++.


    This guide is aimed at newcomers to C++. If, however, you are entirely new to
    programming, I recommend first reading our primer to programming. It covers all
    the concepts, terms, programming paradigms, and coding techniques that a complete
    novice needs to know.


    This guidebook is going to take some time to look over all of the things that
    we can do with the C++ language, and how beneficial learning this language can
    be.


    This object-oriented programming course in C++ language presents learners with
    the concepts and techniques necessary to design, develop and implement a robust
    program model effectively. As a learner, you will be able to grasp practical knowledge
    on how to apply the fundamental concepts of object-oriented analysis and design
    and solve various problems in your day to day activities.


    C++ is a computer programming language widely used for general-purpose programming.
    It is an extension of C-language. The basic understanding of C++ can be acquired
    from C. That’s why both computer languages are represented as C/C++. Bjarne Stroustrup
    developed this multi-paradigm language in 1979.


    In today’s world, many operating systems use C++ as their basic language. Some
    system drivers, browsers, and games are based on C++ programs. It is a free form,
    compiled, and statically typed programming language. Many professionals believe
    that C++ is the most efficient language to achieve the desired results.


    Learning code is ultimately the language of the future. We have all heard something
    close to that at some point in our lives.


    By the time you reach the end, you should have no problem reading C++ code and
    writing programs that are both interesting and useful. So, let’s dive in and learn
    C++.


    # Chapter 1: Anatomy of C++

    ## Introduction to programming languages

    As you already know, the program is nothing but a set of instructions. These instructions
    are executed by the hardware, which is the physical computer machinery. Though
    modern computers are fast, they have their limitations. Computers can only understand
    a set of instructions given in their native language. For this, you should understand
    the concepts of machine language, assembly language, and high-level languages.


    ### Machine language

    Though computers are very advanced machines, they cannot understand languages
    like C++ directly. A computer only understands 0s and 1s. They are called bits.
    And they can only understand instructions given in the binary format. Every set
    of instructions that we give to sleep you are translated into a set of instructions
    that tell the processor to do a particular job. You should understand that different
    types of processors have different types of instruction sets. For example, the
    Pentium processors will only understand their instructions set. It is a similar
    case with Macintosh. In the very beginning, programmers had to write their instructions
    in the binary language. It was very time-consuming and challenging. Luckily, we
    don''t have to go through all of that.


    ### Assembly language

    As the machine language is tough to deal with, a new language called the assembly
    language was invented. Here every instruction is given a short name, and the variables
    are replaced by names and not by binary digits, making it easy for a programmer
    to write code. You may ask how you can understand and assembly language. It cannot.
    The assembly language will be converted into machine language with the help of
    an assembler. You should remember that each CPU has its assembly language. So,
    the assembly language of a CPU cannot be run on a different CPU. Even assembly
    language has got its drawbacks. They require large sets of instructions, even
    for simple tasks.


    ### High-level language

    The high-level programming languages came into existence to solve those problems
    that the assembly and machine languages were causing. These can run on any computer.
    High-level languages come with A program called a compiler. The role of a compiler
    is to generate an executable file or a program that a CPU can directly understand.
    These programs are standalone programs. The modern compilers that are available
    today are very efficient and fast and converting the code into an executable format.
    Some of the programming languages use the interpreter. The job of an interpreter
    is to execute the code but without compiling it to the machine code. But here
    we won’t learn about an interpreter. Any given programming language can be interpreted
    or compiled. Languages like C, C++, and PASCAL are compiled while scripting languages
    like JavaScript and Perl are interpreted.


    Ask this question, and you will get a dozen different answers, but, put simply,
    C++ is a compiled, object-orientated computer-programming language. If you are
    new to programming, even that has probably left you somewhat confused, so let’s
    break it down a bit more.


    There are two types of programming language – one is interpreted, and the other
    is compiled. Interpreted languages are run on an interpreter – this reads the
    code and executes the commands inside one at a time. The CPU reads compiled languages
    on your computer instead of a program. Computers cannot read letters; they can
    only read binary numbers so, when you write your code, it has to be translated
    into binary first. This is called compiling. The object-orientated part of the
    explanation just describes how the code is structured, but will be going into
    more detail on that.


    ## What does this all mean to me?

    To be successful at learning C++, need to use both a text editor and compiler.
    If you are using a Windows PC to do this on, you can use Notepad, which is already
    installed, on your computer as your text editor and, as your compiler, which is
    going to convert your code into an executable format, you should use.


    ### Linux/Unix

    A simple way to check whether GCC is installed on Linux/Unix is to bring up the
    command line and type in:

    ```

    g++ -v

    ```

    If GCC is installed you will get the following message, or something very like
    it:

    ```

    Target: i386-redhat-linux

    Configured with: ../configure --prefix=

    Thread: posix

    gcc version 4.1.2

    ```


    ### Mac OS X

    The best way to get GCC for Mac OS X is to go to `developer.apple.com/technologies`,
    download Xcode, and follow the installation instructions.


    ### Windows

    To get GCC on your Windows PC, you must first download MinGW. Make sure download
    the latest version of MinGW, as well as installing gcc-core, binutils, g++, and
    runtime – these are minimum requirements. One more thing you could consider is
    IDE – Integrated Development Environment. This text editor features an integrated
    compiler and syntax highlighting. The best one to use is Code.


    Is there anything else I should know? Yes. C++ is very rigid in its syntax, and
    everything is case sensitive, so be careful what you are typing. In C++, the word
    “Hello” means something different to “hello” but this is something you will learn
    more about later on. Before we go into too much detail, let’s get you started
    in writing simple code. This is a typical example for all types of computer programming,
    so, without further ado, let’s break it down. First of all, the code is written
    as:

    ![00002.jpeg](rsrc2YS.jpg)


    ```cpp

    int x;

    x = 5;

    std::cout << x;

    ```

    Line 1 is telling your computer that you want to link `iostream` to your program.
    The library is a repository where little bits of code are stored, along with variables
    and operators. The `iostream` library has code in it that lets us move characters
    to a text stream, which then appears on the screen. Line 2 tells the computer
    that we want to use `std` namespace – this is where your code will be stored,
    useful if you write bits of code with the same name. Line 4 is the start of the
    code. Everything that goes inside the braces is what the compiler reads and translates
    – this line must go every single program you write; otherwise, nothing is going
    to happen. The next stage is the printing of the program, which, in this case,
    is “Hello, World!” This is where we use some the code stored in `iostream` – a
    piece of code called `cout`. The `<<` that comes after the code is an operator,
    and this one translates to “output” which means we are telling the computer to
    send the code to a specified stream. The printing “Hello, World!” is called a
    string, which is nothing more than a character sequence enclosed in double quotations.
    Notice that the line ends with a semicolon – this is telling the computer that
    the code is finished, and if it is not used, the program cannot be compiled. Line
    8 is always placed at the end of `main`, and it is to inform the computer that
    the block is completed now that you have the source code for the program, it has
    to be compiled using your compiler. More detail later, first I want to start going
    over what makes up your code.


    # Structure of the C++ program

    As we have already discussed, a computer program is nothing but a set of instructions
    in a sequence that tell the CPU what to do.


    ## Statements and expressions

    In C++, the statement is nothing but the smallest independent unit in the program.
    It is also the most common form of instruction in a programming language. In C++,
    statements are a way to convey your instructions to the compilers to carry out
    a specific task. We use `;` to terminate a statement. In C++, there are many kinds
    of statements, and some of the most common types of statements are given below.

    ```cpp

    int x;

    x = 5;

    std::cout << x;

    ```

    We will discuss the functions of the above statements in the later chapters.


    ## Functions

    Functions are nothing but statements in a sequence, which are executed in sequential
    order. There is a function called the `main` function, and it is a must in every
    C++ program. When any given C++ program is run, the execution of the program starts
    within the `main` function. Functions have very specific jobs to perform. And
    they can perform only those jobs. For you to become a good C++ programmer, you
    need to know how to use functions efficiently. In the next chapter, you’ll learn
    more about functions.


    ## Libraries and the C++ standard library

    Libraries are nothing but a collection of code, which is pre-compiled. They can
    be used within different programs. If you wish to extend the capabilities of your
    program, you can add libraries. The core C++ language is minimalistic and straightforward,
    but it also comes with a built-in library called the C++ standard library. The
    C++ standard library provides the user with additional functionalities.


    ## Compiling your first program

    There are two important things that you should know before you can go to your
    first program. Your programs will be written in the `.cpp` files, which will be
    added to your project. Projects are also called as workspaces or solutions. The
    code files and the IDE settings will be saved to your project. You should start
    a new project by creating one as there are many kinds of projects.

