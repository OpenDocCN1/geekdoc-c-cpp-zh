  trans: "\n所有这些对于创建良好的数据类型都非常重要。我们将使用字符串（string）来演示这一点。字符串必须能够自我初始化，即使它们是空的。它们不应该依赖外部代码来完成初始化。一旦字符串声明，它就可以立即使用。当你用完字符串后，它必须能够进行清理，因为所有字符串都会分配内存。当使用\
    \ `string` 类时，不需要调用其他方法来完成这一操作；字符串会自动完成。\n\n最后，它必须能够将数据从一个变量拷贝到另一个变量，就像整数可以在变量之间拷贝一样。总而言之，这些功能都应该是所有类的一部分，以便它们被易地使用。我们将一个一个地处理这三个特征，看看\
    \ C++ 是轻松地实现这一切的。\n\n# 对象构造 (Object Construction)\n\n你可能已经注意到，我们在 `ChessBoard`\
    \ 接口中没有编写初始化棋面的代码，它是代码的公共部分。我们现在可以修复它。\n\n当声明类变量时，该变量需要能够被初始化：\n```cpp\nChessBoard\
    \ board;\n```\n\n当声明一个对象时，运行它的代码被称为构造函数，它应该设置好对象，使其不再需要额外的初始化。构造函数也可以接受参数——你在声明一个特定大小的\
    \ vector 时已经看到了：`vector<int> v( 10 );`。`vector` 构造函数被带有值为 10 的值调用；新的 `vector`\
    \ 由构造函数初始化，使其能够立即容纳 10 个整数。\n\n创建一个构造函数无非声明一个与类名同名的函数，它没有参数也没有返回值。你甚至不需要给它提供 `void`\
    \ 值；返回值不提供任何类型：\n\n```cpp\nenum ChessPiece { EMPTY_SQUARE, WHITE_PAWN /* 还有其他成员\
    \ */ };\nenum PlayerColor { PC_WHITE, PC_BLACK };\nclass ChessBoard{\npublic:\n\
    \    ChessBoard (); // <-- 完全没有返回值！\n    PlayerColor getMove ();\n    ChessPiece\
    \ getPiece (int x, int y);\n    void makeMove (int from_x, int from_y, int to_x,\
    \ int to_y);\nprivate:\n    ChessPiece _board[ 8 ][ 8 ];\n    PlayerColor whosemove;\n\
    };\n\nChessBoard::ChessBoard () // <-- 无返回值\n{\n    whosemove = PC_WHITE;\n  \
    \  // 首先清空整个棋盘，然后添加棋子\n    for ( int i = 0; i < 8; i++ ){\n        for(int j =\
    \ 0; j < 8; j++ ){\n            board[ i ][ j ] = EMPTYSQUARE;\n        }\n  \
    \  }\n    // 初始化棋盘所需的其他代码\n}\n```\n\n我不会一直向你展示方法声明，但我会继续向你展示类声明，以便你看到它们是如何结合的。现在注意，上面的构造函数位于类的公共部分。如果我们不把\
    \ `ChessBoard` 构造函数设置为公共，我们就无法创建任何对象实例。为什么呢？因为每当创建一个对象时，都必须调用构造函数；如果我们将其为私有，它就无法从类外部调用。对象只能通过调用构造函数来初始化，如果你将其为私有，你就无法声明该对象。\n\
    \n构造函数在创建对象的那一行被调用：\n```cpp\nChessBoard board; // 调用 ChessBoard 构造函数\n```\n或者在分配内存时：\n\
    ```cpp\nChessBoard *board = new board; // 这作为内存分配的一部分调用了 ChessBoard 构造函数\n```\n\
    当声明多个对象时：\n```cpp\nChessBoard a;\nChessBoard b;\n```\n\n构造函数总是按照对象的声明顺序运行——`a`\
    \ 然后是 `b`。和普通函数一样，构造函数可以接受一个或多个参数，如果存在不同的初始化对象的方法，可以通过参数类型对多个构造函数进行重载。例如，可以为 `ChessBoard`\
    \ 创建第二个构造函数来接收棋盘大小：\n\n```cpp\nclass ChessBoard{\n    ChessBoard ();\n    ChessBoard\
    \ (int board_size);\n};\n```\n\n函数定义与任何类方法相同：\n```cpp\nChessBoard::ChessBoard\
    \ (int size){// ... 代码}\n```\n\n参数像这样传递给构造函数：\n```cpp\nChessBoard board( 8 );\
    \ // 8 是 ChessBoard 构造函数的参数\n```\n\n当你你使用 `new` 关键字时，传递参数看起来就像直接调用了构造函数：\n```cpp\n\
    ChessBoard *p_board = new ChessBoard( 8 );\n```\n\n关于语法的说明：虽然使用圆括号来传递参数，但你不能用它们来声明具有无参数构造函数的对象。你不能这样做：\n\
    ```cpp\nChessBoard board();\n```\n正确的形式是：\n```cpp\nChessBoard board;\n```\n然而，在使用\
    \ `new` 关键字时你可以使用圆括号：\n```cpp\nChessBoard *board = new board();\n```\n这是 C++ 解析中一个不幸的小缺陷，因为细节保持得非常晦涩。只需在声明具有无参数构造函数的对象时不要使用括号即可。\n\
    \n那么，如果没有声明构造函数会发生什么？\n\n如果没有声明构造函数，C++ 会创建一个。它不会接受参数，也不会初始化 `int`、`char` 或任何其他原始类型，但它会通过调用默认构造函数初始化每个类字段。通常，你应该创建构造函数以确保一切都得到正确初始化。一旦声明了构造函数，C++\
    \ 就不会为你生成。编译器假设你清楚自己在做什么，并且你会创建所需的构造函数。特别是，如果你创建了接受参数的构造函数，除非你专门声明，否则可能会产生意外后果。如果使用了自动生成的构造函数而你添加了非默认的，依赖于自动构造函数的代码将无法编译。提供默认构造函数是你的责任。\n\
    \n## 初始化列表 (Initialization List) 和 常量字段 (Const Fields)\n\n如果类字段被声明为 `const`，则必须在列表中初始化：\n\
    ```cpp\nclass ConstHolder{\npublic:\n    ConstHolder (int val);\nprivate:\n  \
    \  const int _val;\n};\nConstHolder::ConstHolder (): _val( val){}\n```\n`const`\
    \ 字段不能通过赋值来初始化，因为字段被设置后无法更改。类没有被完全形成的地方是在初始化列表，这样对象可以被安全地设置。\n\n# 第 8 章：库 (Chapter\
    \ 8: Library)\n\n## 标准模板库 (The Standard Template Library)\n\n能够编写自己的数据结构是好事。但正如你可能学到的，这并不常见。你现在已经学习了很多关于构建数据结构的知识，C++\
    \ 有一个酷炫特性可以复用。它被称为标准模板库 (`STL`)，包含了常用的数据结构……这些包括二叉树和链表。这些结构让你指定它们存储的数据类型。\n\n\
    ## Vectors\n\n包含在 STL 中的是数组的替代品——`vector`。这非常像数组但它是可调整的；不再需要担心分配内存和移动元素。数组的语法是：\n\
    ```cpp\nint an_array[10 ];\n```\n而 vector 的语法是：\n```cpp\n#include <vector>\nusing\
    \ namespace std;\nvector> a_vector( 10 );\n```\n`vector` 头文件必须与 `std` 一起包含。这是因为就像\
    \ `cout` 和 `cin` 一样，`vector` 是标准库的一部分。此外，当声明 vector 时，必须提供存储的类型。这是使用角括号完成的：\n\
    ```cpp>\n\n## 在 Vector 上调用方法\n\nvector 提供的比数组多得多。你可以做各种事情，比如在末尾添加元素。vector 提供了函数来帮助这一点。vector\
    \ 使用了名为方法的 C++ 特性。调用方法的语法如下所示：\n```cpp\na_vector.size();\n```\n\n## 其他 Vector\
    \ 特性 (Other Vector Features)\n\nvector 还非常容易增加项的数量而不需要分配内存。例如，向 vector 添加额外的项会这样写：\n\
    ```cpp\na_vector.push_back( 10 );\n```\n这在 vector 末尾添加了另一个 10 的项。vector 会处理大小调整。如果你想用数组实现这一点，必须分配内存、复制值并添加新项。虽然\
    \ vector 确实执行内存分配和拷贝，但它是智能地执行的，不需要每次添加新项时都调整大小。\n\n然而，尽管你可以使用 `push_back` 将项添加到\
    \ vector 的末尾，但单独使用括号是不一样的。括号主要让你只能处理已经分配过的数据，这样内存分配就不会在你不知情的情况下进行。因此，像这这样的代码：\n\
    ```cpp\nvector<int> a_vector( 10 );\na_vector[ 10 ] = 10; // 最后一个有效元素是 9\n```\n\
    是不行通的，并且很可能导致程序崩溃。更不用说，它是危险的。像这样写：\n```cpp\nvector<int> a_vector( 10 );\na_vector.push_back(\
    \ 10 ); // 向 vector 添加一个新元素\n```\n是可以调整 vector 大小的。\n\n## 映射 (Maps)\n\n我们稍早提到过使用一个值来查找另一个值的映射。这在编程中很常见，例如你想实现一个电子邮件地址簿，通过名字查找地址，或者通过账户号码查找账户或允许用户登录游戏。\n\
    \nSTL 给我们一个 `map` 类型，让我们指定键类型和值。一个示例是持有电子邮件地址簿的数据结构；可以按如下方式实现：\n```cpp\n#include\
    \ <map>\n#include <string>\nusing namespace std;\nmap<string, string> name_to_email;\n\
    ```\n我们必须告诉结构有两个类型：一个 `string` 作为键，另一个 `string` 作为值（在本例中是电子邮件地址）。这些映射的有用功能之一是，当使用\
    \ `map` 时，该语法也可以作为数组使用。如果你想添加值，它和数组很像，使用的是键类型而不是整数：\n```cpp\nname_to_email[ \"\
    Billy Bunter\" ] = \"value@example.com\";\n```\n\n## 从映射移除项 (Removing items from\
    \ maps)\n\n我们稍早提到过使用一个值来查找另一个值。这在编程中很常见，例如你想实现一个通过名字查找地址的电子邮件地址簿，或者一个通过账户号码查找账户的程序或允许用户登录游戏。\n\
    \nSTL 给我们一个 `map` 类型，让我们指定键类型和值。一个示例是持有电子邮件地址簿的数据结构；可以按如下方式实现：\n```cpp\n#include\
    \ <map>\n#include <string>\nusing namespace std;\nmap<string, string> name_to_email;\n\
    ```\n我们必须告诉结构有两个类型：一个 `string` 作为键，另一个 `string` 作为值（在本例中是电子邮件地址）。这些映射的有用功能之一是，当使用\
    \ `map` 时，该语法也可以作为数组使用。如果你想添加值，它和数组很像，使用的是键类型而不是整数：\n```cpp\nname_to_email[ \"\
    Billy Bunter\" ] = \"value@example.com\";\n```\n\n从映射中移除项：我们稍早提到过使用一个值来查找另一个值。这在编程中很常见。使用\
    \ `erase()` 方法：\n```cpp\nname_to_email.erase( key );\n```\n使用 `size()` 方法：\n```cpp\n\
    name_to_email.size();\n```\n使用 `empty()` 方法来检查是否为空：\n```cpp\nif ( name_to_email.empty()\
    \ )\n```\n\n## 迭代器 (Iterators)\n\n正如你可能学到的，这并不常见。你可以通过 `begin()` 看到：\n```cpp\n\
