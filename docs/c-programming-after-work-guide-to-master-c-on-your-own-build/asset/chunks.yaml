    `<<` 是一个运算符，它翻译为“输出”，意味着我们告诉计算机将代码发送到指定的流。打印“Hello!” 被称为字符串，它只不过是双引号内的字符序列。注意该行以分号结尾——这告诉计算机代码已结束。如果没有使用，程序将无法编译。第八行始终位于
