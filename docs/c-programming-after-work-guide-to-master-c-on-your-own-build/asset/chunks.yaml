- fmt: "\n# Overloading in C++\n\nIn `OverloadingIn C++`, we can specify more than\
    \ one definition for a function or operator within the same scope. These are processes\
    \ known as `function overloading` and `operator overloading`, respectively. \n\
    \nAn overloaded declaration is done within the same scope as the previous declaration,\
    \ but both definitions have different arguments and a different implementation/definition.\
    \ \n\nAfter calling an overloaded function or operator, the compiler will determine\
    \ the most appropriate definition to use by comparing the types of arguments that\
    \ you have used to call the function or operator with the types of parameters\
    \ that have been specified in the definition. The process of determining the most\
    \ appropriate definition to use is referred to as `overload resolution`.\n\n##\
    \ Operators Overloading\n\nC++ allows you to redefine or overload the majority\
    \ of its in-built operators. This means that programmers can use operators with\
    \ user-defined types.\n\nOverloaded operators are simple functions with special\
    \ names, that is, the `operator` keyword and then symbol of the operator that\
    \ is under the definition. Just like a function definition, an overloaded operator\
    \ will have a return type and a list of parameters. The definition of an overloaded\
    \ operator is demonstrated below:\n\n`Rectangle operator +( const Rectangle &);`\n\
    \nIn the example given below, we are demonstrating the process of operator overloading\
    \ by the use of a member function. We will pass an object as an argument, and\
    \ the properties of the object will be accessed using the object. The object that\
    \ will call the operator will be accessible by use of this operator as demonstrated\
    \ below:\n\n```cpp\n#include <iostream>\nusing namespace std;\nclass Rectangle\
    \ {\npublic :\n    double getArea ( void ) {\n        return length * breadth\
    \ ;\n    }\n    void setLength ( double len ) {\n        length = len ;\n    }\n\
    \    void setBreadth ( double bre ) {\n        breadth = bre ;\n    }\n    //\
    \ Overload the + operator to add two Rectangle objects.\n    Rectangle operator+(\
    \ const Rectangle & r ) {\n        Rectangle rect ;\n        rect . length = this\
    \ -> length + r . length ;\n        rect . breadth = this -> breadth + r . breadth\
    \ ;\n        return rect ;\n    }\nprivate:\n    double length ; // Length of\
    \ a rectangle\n    double breadth ; // Breadth of a rectangle\n};\n// Main function\n\
    int main () {\n    Rectangle Rectangle1 ; // Declare Rectangle1 of type Rectangle\n\
    \    Rectangle Rectangle2 ; // Declare Rectangle2 of type Rectangle\n    Rectangle\
    \ Rectangle3 ; // Declare Rectangle3 of type Rectangle\n    double area = 0.0\
    \ ; // Store the area of a Rectangle here\n    // Rectangle 1 specification\n\
    \    Rectangle1 . setLength ( 6.0 );\n    Rectangle1 . setBreadth ( 7.0 );\n \
    \   // Rectangle 2 specification\n    Rectangle2 . setLength ( 12.0 );\n    Rectangle2\
    \ . setBreadth ( 13.0 );\n    // area of Rectangle 1\n    area = Rectangle1 .\
    \ getArea ();\n    cout << \"Area of Rectangle1 : \" << area << endl ;\n    //\
    \ area of Rectangle 2\n    area = Rectangle2 . getArea ();\n    cout << \"Area\
    \ of Rectangle2 : \" << area << endl ;\n    // Adding two objects: Rectangle3\
    \ = Rectangle1 + Rectangle2 ;\n    // area of rectangle 3\n    area = Rectangle3\
    \ . getArea ();\n    cout << \"Area of Rectangle3 : \" << area << endl ;\n   \
    \ return 0 ;\n}\n```\n\nWhen executed, the code will return the following: ![](rsrc2Z7.jpg)\
    \ \n\nConsider the following section extracted from the above code:\n\n```cpp\n\
    Rectangle operator +( const Rectangle & r ) {\n    Rectangle rect ;\n    rect\
    \ . length = this->length + r . length ;\n    rect . breadth = this->breadth +\
    \ r . breadth ;\n    return rect ;\n}\n```\n\nThis is where the mechanism of operator\
    \ overloading has been implemented. We have overloaded the `+` operator so that\
    \ it adds the measurements of two rectangle objects. Here is another line extracted\
    \ from the code:\n\n`Rectangle3 = Rectangle1 + Rectangle2 ;`\n\nIn the above line,\
    \ `Rectangle1` will be added to `Rectangle2`. This means that the length of `Rectangle1`\
    \ will be added to the length of `Rectangle2` to get the length of `Rectangle3`\
    \ while the breadth of `Rectangle1` will be added to the breadth of `Rectangle2`\
    \ to get the breadth of `Rectangle3`. These two will then be multiplied to give\
    \ the area of `Rectangle3`. The meaning of `+` operator has been overloaded!\n\
    \n# Chapter 6: Macros and template\n\n## Introduction to Templates\n\nTemplates\
    \ are an important feature in C++ programming language, as it allows functions\
    \ and classes to use generic types. They play an essential role in how functions\
    \ and classes work by allowing them to define different data types without rewriting\
    \ each other.\n\nUsing templates, you can write a generic code that can be used\
    \ with any data type. All you need is to pass the data types as parameters. Templates\
    \ promote code reusability and improve the flexibility of the program. You can\
    \ create a simple class or a function and pass data types as parameters and implement\
    \ the code to be used by any data type. Whenever you want to use the function,\
    \ you make a call to the function and specify the return type.\n\nFor example,\
    \ if you use `sort()` function to sort data in a warehouse, you can pass different\
    \ data types as parameters to the function. You don't have to write and maintain\
    \ multiple file codes to sort data. Based on the data type passed to the sorting\
    \ algorithm, your data in the warehouse is sorted irrespective of that particular\
    \ data type. Therefore, templates are used in situations where you need a code\
    \ to be reusable with more than one data type.\n\nTemplates are of great importance\
    \ when dealing with multiple inheritance and operator overloading. It is widely\
    \ applied where code reusability is of prime importance.\n\n## Types of Templates\n\
    \nTemplates are implemented in two ways:\n- Using function templates\n- Using\
    \ class templates\n\nA template can be defined as a macro. That is when you define\
    \ an object of a specific type, the template definition of that type of class\
    \ substitutes it with the appropriate data type. Templates are often referred\
    \ to as parameterized class or functions since a specified data type will replace\
    \ the defined parameter during execution time.\n\n### Class Templates\n\nClass\
    \ templates offer the specifications for creating a class based on the parameters.\
    \ A class template accepts members with parameter type. That is, you can instantiate\
    \ a class template by passing a given set of data type to its parameter list.\
    \ Class templates are mostly used in implementing containers.\n\n**Syntax:**\n\
    `Template <class identifier>`\n`class class-name{…//class member specifications…};`\n\
    \nExample: ![00018.jpeg]\n\nA class template definition is similar to normal class\
    \ definition except in templates, you add a prefix `template <class M>` where\
    \ `M` is the type. The template prefix tells the compiler that a class template\
    \ is declared, which uses `M` as the type. `M` can be replaced by any data type\
    \ or by a user-defined type.\n\nIf a class is derived from a class template, then\
    \ it's called instantiation. The objects of the template class are defined as\
    \ follows: `Classname<type> objectname (arglist);`. Before creating a derived\
    \ class, you have to debug the class template before converting it to a class.\n\
    \nExample:\n\n```cpp\ntemplate <class TT>\nclass Rectangle {\n    TT width;\n\
    \    TT height;\npublic:\n    void setvalues(TT num1,TT num2) {\n        width\
    \ = num1;\n        height = num2;\n    }\n    TT area() {\n        TT A;\n   \
    \     A=width*height;\n        return A;\n    }\n};\n\nint main() {\n    Rectangle<int>\
    \ obj1(5,6);\n    Rectangle<float> obj2(5.6,4);\n    cout << obj1.area();\n  \
    \  cout << obj2.area();\n    return 0;\n}\n```\nOutput:\n`obj1=30`, `obj2=22.4`\n\
    \nThe above program creates a class of type `TT`. The `<TT>` in `void Rectangle\
    \ <TT> ::setvalues (TT num1,TT2)` specifies that the function parameter is also\
    \ a template and should always be included when calling.\n\n### Class Templates\
    \ with Multiple Parameters\n\nYou can also have more than one generic type in\
    \ a class. You can declare the generic type with a comma-separated list inside\
    \ the template.\n\n**Syntax:**\n`Template <class xy, Class xyz, …>`\n`Class class-name{//function\
    \ body;}`\n\nExample: class with two generic types\n\n```cpp\ntemplate<class f1,class\
    \ f2>\nclass numbers{\n    f1 j;\n    f2 k;\npublic:\n    numbers (f1 x, f2 y)\
    \ {\n        j=x;\n        k=y;\n    }\n    void print() {\n        cout<<j<<\"\
    and\"<<k<<\"\\n\";\n    }\n};\n\nint main() {\n    Numbers<float, int> numbers1\
    \ (5.3,23);\n    Numbers<int, char> numbers2 (50,'Z');\n    numbers1.print();\n\
    \    numbers2.print();\n    return 0;\n}\n```\nOutput:\n`5.3 and 23`, `50 and\
    \ Z`\n\n### Function Templates\n\nFunction templates work like a normal function\
    \ except that the normal function works with only a single data type, while templates\
    \ accommodate multiple data types. With templates, you can overload a normal function\
    \ to work with different data types. This makes function templates more useful\
    \ since you only have to write a single program that works on all data types.\
    \ Templates are always expanded during compile time.\n\n**Syntax:**\n`Template\
    \ <class type>\nReturn-type function-name (arguments){Function body;}`\n\nWhen\
    \ defining function templates, you must include the template type in both the\
    \ function body and parameter list when necessary.\n\nExample 1: Function to swap\n\
    ```cpp\ntemplate <Class T1>\nVoid swap (T1&num1, T1&num2) {\n    T1 val= num1;\n\
    \    num1=num2;\n    num2=val;\n}\n```\n\nExample 2: Implementation of function\n\
    \n```cpp\ntemplate <class test>\ntest max (test x, test y) {\n    test results;\n\
    \    results=x>y? x:y;\n    return results;\n};\n\nint main() {\n    int a=5,\
    \ b=6, c;\n    double l=4, m=6, n;\n    c= max <int> (a,b);\n    n=max <double>\
    \ (l,m);\n    cout<< c<<endl;\n    cout<<n<<endl;\n    return 0;\n}\n```\nIn this\
    \ example, `test` is the template parameter. The function `max` is called twice\
    \ with different data types (`int` and `double`). When the compiler instantiates,\
    \ it calls the function each time by its type. The output object produced (after\
    \ instantiation of the template with specific type) will be of the same type with\
    \ the parameters `x` and `y`. The above program will sort values based on which\
    \ is higher. If using an array of numbers, the sorting algorithm will be applied\
    \ to sort the numbers from the smallest to highest.\n\n### Function Template with\
    \ Multiple Parameters\n\nJust like in class templates, you can have more than\
    \ one generic data type separated by commas. ![00019.jpeg]\n\nExample: Template\
    \ with multiple parameters\n\n```cpp\ntemplate<class Temp1,class Temp2>\nvoid\
    \ display( Temp1 j, Temp2 k) {\n    cout<<j<<“ ”<<k<<\"\\n”;\n}\nint main() {\n\
    \    display1(2019, “EDGE”);\n    display2(18.54, “1854”);\n    return 0;\n}\n\
    ```\nOutput:\n`2019 EDGE`, `18.54 1854`\n\n## Overloading Template Functions\n\
    \nYou can overload a template function using its template function or using the\
    \ ordinary function from its name. Overloading can be done through:\n- Calling\
    \ an ordinary function that matches the template function.\n- Calling a template\
    \ function that is built with the exact function.\n- Use normal overloading function\
    \ on an ordinary function and make a function call to the one that matches the\
    \ template function.\n\nIf there is no match found, an error message is generated\
    \ by the system.\n\nExample: Overloaded template using an explicit function\n\n\
    ```cpp\ntemplate <class M>\nvoid display(M n) {\n    cout<<”Display template function:”\
    \ << n<< “\\n”;\n}\nvoid display ( int n) {\n    cout<<”Explicit template display:\
    \ “ << n<<”\\n”;\n}\nint main() {\n    display (80);\n    display (15);\n    return\
    \ 0;\n}\n```\nOutput:\n`Explicit template display: 80`, `template function: 15`\n\
    The function call `display (80)` calls the ordinary version and not its template\
    \ version.\n\n## Member Function Templates\n\nWhen creating class templates, all\
    \ member functions can be defined outside the class since the member functions\
    \ in a template class are parameterized using type. Therefore, the function template\
    \ should define the member functions.\n\nMember function templates are defined\
    \ in three ways:\n- Explicit definition in a file scope for each return-type used\
    \ to instantiate a template.\n- File scope within the template.\n- Inline within\
    \ the class.\n\nA member function template can instantiate functions not. If a\
    \ class has both a member function and an explicit function, then the explicit\
    \ definition is given priority.\n\nExample: Class with a member function\n\n```cpp\n\
    template <typename T>\nclass ArrayWrapper {\n    T *pmem;\npublic:\n    ArrayWrapper(int\
    \ size) : pmem(new T[size]) {}\n};\n```\n\nExample: Class with a member function\
    \ template\n\n```cpp\ntemplate <typename T>\nclass ArrayWrapper {\n    T *pmem;\n\
    public:\n    ArrayWrapper(int size) : pmem(new T[size]) {}\n};\n\ntemplate <typename\
    \ T>\nArrayWrapper<T>::ArrayWrapper() {}\n\n## Non-type Template Arguments\n\n\
    Templates can have single or multiple type arguments. You can also use a non-type\
    \ argument in addition to the type. You can create a template argument using strings,\
    \ built-in types, and function names. ![0022.jpeg]\n\nThe above template passes\
    \ the size of array as an argument. The compiler will only know the size of the\
    \ array during the execution. The arguments are specified during the creation\
    \ of template.\n\n## Template Classes\n\nWhile template classes tend to be limited\
    \ to library writers who want classes such as `map` and `vector`, everyday programmers\
    \ can also benefit from being able to make their code generic. You shouldn’t use\
    \ a template just because you can; instead you should be looking for opportunities\
    \ to get rid of classes that only differ by the type. Declaring a template class\
    \ isn’t very different from a template function. Let’s say that we want to build\
    \ a small class that will wrap an array:\n\n```cpp\ntemplate <typename T>\nclass\
    \ ArrayWrapper {\nprivate:\n    T *pmem;\n};\n```\n\nAs with the template function,\
    \ we begin with the declaration that a template is being introduced. We use the\
    \ `template` keyword, and then the template parameters are added. We only have\
    \ one parameter here, `T`. `T` can be used whenever we want the type that would\
    \ be specified by a user, just like the template functions. When a function is\
    \ defined for a template class, the template syntax also has to be used. So let’s\
    \ add a constructor called `ArrayWrapper` to our class:\n\n```cpp\ntemplate <typename\
    \ T>\nclass ArrayWrapper {\npublic:\n    ArrayWrapper (int size);\nprivate:\n\
    \    T *pmem;\n};\n```\n\nSo that the constructor can be defined outside the class,\
    \ we start by indicating that the function is a template\n\n```cpp\ntemplate <typename\
    \ T>\nArrayWrapper<T>::ArrayWrapper (int size) : pmem(new T[size]) { }\n\nint\
    \ main() {\n    ArrayWrapper<int> arr(10);\n    return 0;\n}\n```\nThe difference\
    \ is, the class name now has `ArrayWrapper` template in it, which tells everyone\
    \ this belongs to a template class and isn’t a template function on a standard\
    \ class.\n\n## Templates and Header Files\n\nUp to now, the templates we have\
    \ looked at have been directly written into `.cpp` files. What if we wanted to\
    \ place our template declaration into the header file? Could we? The problem here\
    \ is that code that makes use of template classes or template functions needs\
    \ to be able to access the whole template definition for every single function\
    \ call to the template as well as to every member function that is called on template\
    \ classes.\n\nThis is not the way that a standard function works; these only require\
    \ the caller to know about the declaration. For example, if you placed the `Calc`\
    \ class inside its header file, you would also need to add the full constructor\
    \ definition along with `add()` method instead of putting them all into one `.cpp`\
    \ file as you would normally. If you didn’t do this, you would not be able to\
    \ use `Calc`. This is a rather unfortunate thing about templates, and it’s all\
    \ about how templates have been compiled. Most of the time, when the compiler\
    \ parses them the first time, it pretty much ignores templates. It’s only when\
    \ a template is used that has a concrete type attached that the compiler generates\
    \ the code for that type. To do that, the template has to be available to the\
    \ compiler so the code can be generated. A result of this is that all template\
    \ code has to be included in all of the files that will use that template. And,\
    \ when a file that has a template is compiled, you may not learn of any syntax\
    \ errors in that template until the template is used for the first time. The easiest\
    \ thing to do, when creating template classes, is to place all template definitions\
    \ into the header file. It’s also helpful if you use an extension other than `.h`,\
    \ just to indicate that the file is a template—.hxx, for example.\n\n## Analyzing\
    \ Template Error Messages\n\nIf there is one significant downside to using templates,\
    \ it’s that many compilers will throw out error messages that are not easy to\
    \ understand when a template is misused, whether you write it or not. You could\
    \ end up with pages of error messages just for one mistake. Template error messages\
    \ are not easy to read because the template parameters are expanded to their fullest,\
    \ even those you don’t normally use, such as the default. There is a similar constraint\
    \ on the default parameter for the template—this one requires a type that has\
    \ support for more than the humble. Finding the code where the error will always\
    \ be the first step to working out where all went wrong. More often than not,\
    \ and even so as you gain experience and confidence, a simple look at your code\
    \ will tell you what the error is. If it’t that obvious, you just keep going through\
    \ the template until the proper error appears: “error: int is not a class, struct\
    \ or union.” The compiler expected a structure or class, not any of types.\n\n\
    # Chapter 7: Classes\n\n## Introduction to Classes\n\nAt the heart of all object\
    \ oriented programming lies the notion of classes, objects that you create, and\
    \ utilize throughout your code. This helps with modularity, with ease of use,\
    \ and with higher level programming that is far more logical. In the early iterations\
    \ of C, there was a primitive class called `struct`. Structs still exist in C++\
    \ but are mainly deprecated in favor using classes instead. Nevertheless, structs\
