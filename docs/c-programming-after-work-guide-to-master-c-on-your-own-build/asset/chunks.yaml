  trans: "\n\n# C++ 中的重载\n\n在`C++ 中的重载` 章节中，我们可以在同一作用域内为函数或运算符指定多个一个定义。这些过程分别被称为`函数重载`和`运算符重载`。\n\
    \n重载声明是在与之前的声明相同的作用域内完成的，但两个定义具有不同的参数和不同的实现/定义。\n\n在调用重载函数或运算符后，编译器将通过比较你调用函数或运算符时使用的参数类型与定义中指定的参数类型，来确定使用最合适的定义。这种确定使用最合适定义的过程被称为`重载解析`（overload\
    \ resolution）。\n\n## 运算符重载\n\nC++ 允许你重新定义或重载其大多数内置运算符。这意味着程序员可以使用自定义类型配合运算符。\n\
    \n重载的运算符是具有特殊名称的简单函数，即 `operator` 关键字后跟所正在定义的运算符的符号。就像函数定义一样，重载的运算符将有一个返回类型和参数列表。重载运算符的定义如下所示：\n\
    \n`Rectangle operator +( const Rectangle &);`\n\n在下面给出的示例中，我们正在演示使用成员函数进行运算符重载的过程。我们将传递对象作为参数，并将使用该对象访问对象的属性。调用运算符的对象将可以通过该运算符访问，如下所示：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nclass Rectangle {\npublic\
    \ :\n    double getArea ( void ) {\n        return length * breadth ;\n    }\n\
    \    void setLength ( double len ) {\n        length = len ;\n    }\n    void\
    \ setBreadth ( double bre ) {\n        breadth = bre ;\n    }\n    // 重载 + 运算符以相两个\
    \ Rectangle 对象。\n    Rectangle operator+( const Rectangle & r ) {\n        Rectangle\
    \ rect ;\n        rect . length = this -> length + r . length ;\n        rect\
    \ . breadth = this -> breadth + r . breadth ;\n        return rect ;\n    }\n\
    private:\n    double length ; // 矩形的长度\n    double breadth ; // 矩形的宽度\n};\n//\
    \ 主函数\nint main () {\n    Rectangle Rectangle1 ; // 声明类型为 Rectangle 的 Rectangle1\n\
    \    Rectangle Rectangle2 ; // 声明类型为 Rectangle 的 Rectangle2\n    Rectangle Rectangle3\
    \ ; // 声明类型为 Rectangle 的 Rectangle3\n    double area = 0.0 ; // 在这里存储 Rectangle\
    \ 的面积\n    // Rectangle 1 规格\n    Rectangle1 . setLength ( 6.0 );\n    Rectangle1\
    \ . setBreadth ( 7.0 );\n    // Rectangle 2 规格\n    Rectangle2 . setLength ( 12.0\
    \ );\n    Rectangle2 . setBreadth ( 13.0 );\n    // Rectangle 1 的面积\n    area\
    \ = Rectangle1 . getArea ();\n    cout << \"Area of Rectangle1 : \" << area <<\
    \ endl ;\n    // Rectangle 2 的面积\n    area = Rectangle2 . getArea ();\n    cout\
    \ << \"Area of Rectangle2 : \" << area << endl ;\n    // 相加两个对象：Rectangle3 = Rectangle1\
    \ + Rectangle2 ;\n    // 矩形 3 的面积\n    area = Rectangle3 . getArea ();\n    cout\
    \ << \"Area of Rectangle3 : \" << area << endl ;\n    return 0 ;\n}\n```\n\n执行时，代码将返回以下内容：![](img/rsrc2Z7.jpg)\n\
    \n考虑从上述代码中提取的以下部分：\n\n```cpp\nRectangle operator +( const Rectangle & r ) {\n\
    \    Rectangle rect ;\n    rect . length = this->length + r . length ;\n    rect\
    \ . breadth = this->breadth + r . breadth ;\n    return rect ;\n}\n```\n\n这就是实现运算符重载机制的地方。我们重载了\
    \ `+` 运算符，使其能够加上两个矩形对象的测量值。这里是代码中提取的另一行：\n\n`Rectangle3 = Rectangle1 + Rectangle2\
    \ ;`\n\n在上述行中，`Rectangle1` 将被加到 `Rectangle2` 上。这意味着 `Rectangle1` 的长度将加到 `Rectangle2`\
    \ 的长度上以得到 `Rectangle3` 的长度，而 `Rectangle1` 的宽度将加到 `Rectangle2` 的宽度上以得到 `Rectangle3`\
    \ 的宽度。然后这两个值将相乘以得到 `Rectangle3` 的面积。`+` 运算符的含义被重载了！\n\n# 第 6 章：宏与模板\n\n## 模板简介\n\
    \n模板是 C++ 编程语言中的一项重要特性，因为它允许函数和类使用泛型。它们在函数和类的工作方式中起着至关重要的作用，允许它们在不重写彼此的情况下定义不同的数据类型。\n\
    \n使用模板，你可以编写适用于任何数据类型的泛型代码。你只需要将数据类型作为参数传递。模板促进了代码的重用性并提高了程序的灵活性。你可以创建一个简单的类或函数，并将数据类型作为参数传递，并实现供任何数据类型使用的代码。每当你想使用该函数时，调用该函数并指定返回类型。\n\
    \n例如，如果你使用 `sort()` 函数对仓库数据进行排序，可以将不同的数据类型作为参数传递给函数。你不需要编写和维护多个文件代码来排序数据。根据传递给排序算法的数据类型，你仓库中的数据将无视特定数据类型进行排序。因此，当你需要代码在多个数据类型上可重用时，就会使用模板。\n\
    \n在处理多重继承和运算符重载时，模板具有重要意义。它们在代码可重用性要求高的地方被广泛应用。\n\n模板通过以下两种方式实现：\n- 使用函数模板\n-\
    \ 使用类模板\n\n模板可以定义为宏。也就是说，当你定义特定类型的对象时，模板在执行时会替换相应的类型。\n\n### 类模板\n\n类模板提供了根据参数创建类的规格。类模板接受成员类型，并通常用于实现成员函数。\n\
    \n**语法：**\n`Template <class identifier>`\n`class-name{…}`\n\n示例：![00018.jpeg]\n\
    \n类模板定义与标准类定义相似，只是在模板处添加 `template <class M>` 前缀，`M` 是类型。如果从模板派生类，则通过 `Classname<type>\
    \ object(arg)` 实例化。\n\n示例：\n\n```cpp\ntemplate <class TT>\nclass Rectangle {\n\
    \    TT width;\n    TT height;\npublic:\n    void setvalues(TT num1,TT num2) {\n\
    \        width = num1;\n        height = num2;\n    }\n    TT area() {\n     \
    \   TT A;\n        A=width*height;\n        return A;\n    }\n};\n\nint main()\
    \ {\n    Rectangle<int> obj1(5,6);\n    Rectangle<float> obj2(5.6,4);\n    cout\
    \ << obj1.area();\n    cout << obj2.area();\n    return 0;\n}\n```\n输出：\n3022.4\n\
    \n上述程序创建了类型 `TT` 的类。`<TT>` 在 `void Rectangle <TT> ::setvalues (TT num1,TT2)` 中指定，函数参数也是模板。\n\
    \n### 多个参数的类模板\n\n你也可以在类中拥有多一个用逗号分隔的泛型类型。![0019.jpeg]\n\n**语法：**\n`Template <class\
    \ xy, …>`\n`Class class-name{//function body;}`\n\n示例：两个泛型类型的模板\n\n```cpp\ntemplate<class\
    \ f1,class f2>\nclass numbers{\n    f1 j;\n    f2 k;\npublic:\n    numbers (f1\
    \ x, f2 y) {\n        j=x;\n        k=y;\n    }\n    void print() {\n        cout<<j<<\"\
    and\"<<k<<\"\\n\";\n    }\n};\n\nint main() {\n    Numbers<float, int> numbers1\
    \ (5.3,23);\n    Numbers<int, char> numbers2 (50,'Z');\n    numbers1.print();\n\
    \    numbers2.print();\n    return 0;\n}\n```\n输出：\n5.3 and 23\n50 and Z\n\n###\
    \ 函数模板\n\n函数模板的工作方式与普通函数类似，但普通函数只处理单一数据类型，而模板可以适应多个数据类型。通过模板，你可以重载普通函数以处理不同的数据类型。这使得函数模板更有用，因为你只需要编写适用于所有数据类型的单一程序。模板始终在编译时展开。\n\
    \n**语法：**\n`Template <class type>`\n`Return-type function-name (arguments){Function\
    \ body;}`\n\n在定义函数模板时，必要时函数体和参数列表中包含模板类型。\n\n示例 1：交换函数\n```cpp\ntemplate <Class\
    \ T1>\nVoid swap (T1&num1, T1&num2) {\n    T1 val=num1;\n    num1=num2;\n    num2=val;\n\
    }\n```\n\n示例 2：函数的实现\n\n```cpp\ntemplate <class test>\ntest max (test x, test\
    \ y) {\n    test results;\n    results=x>y? x:y;\n    return results;\n}\n\nint\
    \ main() {\n    int a=5, b=6, c;\n    double l=4, m=6, n;\n    c= max <int> (a,b);\n\
    \    n=max <double> (l,m);\n    cout<< c<<endl;\n    cout<<n<<endl;\n    return\
    \ 0;\n}\n```\n在这个示例中，`test` 是模板参数。函数 `max` 被调用两次，使用不同的数据类型（`int` 和 `double`）。当编译器实例化时，它每次按其类型调用函数。产生的输出对象（在特定类型实例化模板后）将与参数\
    \ `x` 和 `y` 的类型相同。上述程序将根据哪个值更高对值排序。如果使用数字数组，将应用排序算法对数字从最小到最大进行排序。\n\n### 多个参数的函数模板\n\
    \n与类模板一样，你可以拥有多一个用逗号分隔的泛型类型。![0019.jpeg]\n\n示例：多个参数的模板\n\n```cpp\ntemplate<class\
    \ Temp1,class Temp2>\nvoid display( Temp1 j, Temp2 k) {\n    cout<<j<<“ ”<<k<<\"\
    \\n\";\n}\nint main() {\n    display(2019, “EDGE”);\n    display(18.54, “1854”);\n\
    \    return 0;\n}\n```\n输出：\n2019 EDGE\n18.54 1854\n\n## 重载模板函数\n\n你可以使用其模板函数或普通函数来重载模板函数。重载可以通过以下方式完成：\n\
    - 调用匹配模板函数的普通函数。\n- 使用精确类型的函数调用模板函数。\n- 在普通函数上进行匹配模板函数的函数调用。\n\n如果没有找到匹配，系统将生成错误消息。\n\
    \n示例：使用普通函数的重载模板\n\n```cpp\ntemplate <class M>\nvoid display(M n) {\n    cout<<”template\
    \ function:” << n<<“n”;\n}\nvoid display (int n) {\n    cout<<”Explicit display:\
    \ “ << n<<“n”;\n}\nint main() {\n    display (80);\n    display (15);\n    return\
    \ 0;\n}\n```\n输出：\nExplicit display: 80\ntemplate function: 15\n\n##在创建类模板时，所有成员函数都可以在类外定义，因为模板类中的成员函数是使用类型参数化的。因此，函数模板应该定义成员函数。\n\
    \n成员函数模板有三种定义方式：\n- 文件作用域内的显式定义。\n- 模板内的文件作用域。\n- 类内的内联。\n\n成员函数模板可以实例化。如果一个类既有成员函数又有普通函数，则显式定义优先。\n\
    \n示例：带有成员函数的类\n\n```cpp\ntemplate <typename T>\nclass ArrayWrapper {\n    T *pmem;\n\
    public:\n    ArrayWrapper(int size) : pmem(new T[size]) {}\n};\n```\n\n示例：带有成员函数的类模板\n\
    \n```cpp\ntemplate <typename T>\nclass ArrayWrapper {\n    T *pmem;\npublic:\n\
    \    ArrayWrapper(int size) : pmem(new T[size]) {}\n};\n\ntemplate <typename T>\n\
    ArrayWrapper<T>::ArrayWrapper() {}\n\n## 非类型模板参数\n\n模板可以有单个或多个类型参数。除了类型，你还可以使用字符串、内置类型和函数名创建模板参数![0022.jpeg]\n\
    \n上述模板将数组的大小作为参数传递。编译器只在执行期间知道数组的大小。参数在创建模板时指定。\n\n## 模板类\n\n虽然模板类倾向于编写 `map`\
    \ 和 `vector` 等类的编写者，但普通程序员也可以从代码泛化中受益。你不应该仅仅因为可以使用就模板；相反，你应该寻找在类型上不同的类。声明模板类与模板函数没有太大。假设我们要构建一个封装数组的小类：\n\
    \n```cpp\ntemplate <typename T>\nclass ArrayWrapper {\nprivate:\n    T *pmem;\n\
    };\n```\n\n与模板函数一样，我们从引入模板的声明开始。我们使用 `template` 关键字，然后添加模板参数。这里只有一个参数，`T`。每当我们需要用户指定的类型时，都可以使用\
    \ `T`，就像模板函数一样。为模板类定义函数时，也使用模板语法。所以，让我们为类添加一个名为 `ArrayWrapper` 的构造函数：\n\n```cpp\n\
    template <typename T>\nclass ArrayWrapper {\npublic:\n    ArrayWrapper (int size);\n\
    private:\n    T *pmem;\n};\n```\n\n为了使构造函数可以在类外定义，我们首先指示该函数是模板\n\n```cpp\ntemplate\
    \ <typename T>\nArrayWrapper<T>::ArrayWrapper (int size) : pmem(new T[size]) {\
    \ }\n\nint main() {\n    ArrayWrapper<int> arr(10);\n    return 0;\n}\n```\n区别是，类名现在包含了\
    \ `ArrayWrapper` 模板，这告诉所有人这是一个模板类，而不是标准类上的模板函数。\n\n## 模板与头文件\n\n到为止，我们看到的模板都是直接写入\
    \ `.cpp` 文件的。如果我们想把模板声明放在头文件中呢？可以吗？这里的问题是，使用模板类或模板函数的代码需要能够对模板的每一次函数调用以及在模板类上调用的每个成员函数访问整个模板定义。\n\
    \n这不是标准函数的工作方式；这些只需要调用者知道声明。例如，如果你将 `Calc` 类放在它的头文件中，你还需要需要添加完整的构造函数定义以及 `add()`\
    \ 方法，而不是像通常那样将它们都放入一个 `.cpp` 文件中。如果你不这样做，你将无法使用 `Calc`。这是模板的一个相当遗憾的问题，这与模板如何编译有关。在大多数情况下，当编译器第一次解析它们时，它几乎忽略模板。只有当使用模板时，连接了具体的类型，编译器才会生成代码。因此，为了生成代码，所有的模板定义必须包含在头文件中。创建模板类时最简单的方法是使用\
    \ `.h` 之外的扩展名来指示它是模板，例如。\n\n## 分析模板错误消息\n\n使用模板的一个显著缺点是，许多编译器会抛出易于理解的错误消息。无论你写还是不写，你可能得到数页的错误消息。因为模板参数被扩展到完全，模板错误消息并不容易读。在模板被误用时总是指出哪里出错了。如果这还不明显，你的代码会显示一个错误：“error:\
    \ int is not a class, struct or union.”\n\n# 第 7 章：类\n\n## 类的介绍\n\n面向对象编程的核心是类的概念，你创建并在贯穿整个代码中使用。这有助于模块化、易用性以及更具逻辑性的高层编程。在\
    \ C++ 的早期版本中，使用的是 `struct`，但现在更多地采用类。然而，`struct` 仍然存在。\n\n在进入那里之前，让我们简谈一下访问修符。我们已经讨论过\
    \ `int`、`string`、`bool` 和 `float` 等内容。我们创建了可以认为是某种类型的枚举。访问修符描述了代码中可以更改的内容。三种不同的访问修符：\n\
    \n- `Public`（公共）：对象和/或内部函数可以被程序的任何其他代码访问和修改。\n- `Protected`（保护）：对象和/或内部函数可以被其派生类修改（在我们进入继承和多态时会有意义）。\n\
    - `Private`（私有）：只有对象本身可以访问和修改其数据。这对于安全、清晰和代码安全很重要。\n\n`struct` 和类都是创建新对象的方法。`struct`\
    \ 的主要区别在于它们默认是公共的，而类默认是私有的。除此之外，差异是微不足道的。然而，在技术行业中，`struct` 有相当负面的含义。开发者倾向于将它们视为功能受限的未保护对象，而倾向于将类视为结构良好且功能强大的对象。因此，通常最好创建类。看这个\
    \ struct 和声明：\n\n```cpp\nstruct animal {\n    enum diet { herbivore, omnivore,\
    \ carnivore };\n    int legs;\n    string name;\n    diet naturalDiet;\n};\n\n\
    int main() {\n    animal dog;\n    dog.legs = 4;\n    dog.name = \"Dog\";\n  \
    \  dog.naturalDiet = carnivore;\n}\n```\n\n"
