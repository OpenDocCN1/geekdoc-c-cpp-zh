    #include <vector>\n#include <algorithm>\n#include <iostream>\n\nint main()\n{\
    \ \n    std::vector<int> v{1, 2, 3, 4, 5};\n\n    auto prod = \n        std::accumulate(v.begin(),\
    \ v.end(), \n                        1,\n                        [](auto x, auto\
