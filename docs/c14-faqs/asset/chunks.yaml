    \ and value initialization\n\n*** Question 35 make_unique and value initialization\n\
    \nGiven zero arguments, does make_unique make call to new T() for value-initialization\
    \ or to new T for default-initialization ?\n\nSOLUTION OF QUESTION [35](#part0000_split_007.html_x1-37001r35)\n\
    \nIt makes call to new T() for value-initialization because of the following reasons:\n\
    \n*   symmetry with make_shared< T > (),\n\n*   consistency with the empty parentheses\
    \ in the function call make_unique< T > (),\n\n*   predictability because this\
    \ is the expected result of a variadic implementation, and\n\n*   safety because\
    \ it is safe to get zero instead of garbage. \"zero is a strict subset of garbage\"\
    .\n\nOccasionally, the use may be interested in default-initialization due to\
    \ performance. We already know that make_unique< T > () is faster than make_shared<\
    \ T > (), but quite often the cost of a dynamic memory allocation plus the corresponding\
    \ deallocation is much higher than the cost of value-initializing a single object.\n\
    \n### 0.36 make_unique and single object\n\n*** Question 36 make_unique and single\
    \ object\n\nIllustrate the mechanism to manage single object’s dynamic memory\
    \ with make_unique.\n\nSOLUTION OF QUESTION [36](#part0000_split_007.html_x1-38001r36)\n\
    \nLet us take a simple example:\n\n1#include <memory> \n\n2#include <cassert> \n\
    \n3 \n\n4struct A \n\n5{ \n\n6  A() : b(false) { } \n\n7  A(int, double&, char&&, void*) : b(true) { } \n\
    \n8  bool b; \n\n9}; \n\n10 \n\n11int main() \n\n12{ \n\n13    int i = 0; \n\n\
    14    double d = 0.0; \n\n15    char c = 0; \n\n16 \n\n17    std::unique_ptr<A> a = std::make_unique<A>(i, d, std::move(c), nullptr); \n\
    \n18 \n\n19    assert( a != nullptr ); \n\n20    assert( a->b ); \n\n21 \n\n22    a = std::make_unique<A>(); \n\
    \n23    assert( a != nullptr ); \n\n24    assert( !a->b ); \n\n25}\n\nIt works\
    \ as expected, all asserts are true.\n\nSame is the case for the following example:\n\
    \n1#include <memory> \n\n2#include <string> \n\n3#include <cassert> \n\n4 \n\n\
    5int main() \n\n6{ \n\n7    std::unique_ptr<int> p1 = std::make_unique<int>(100); \n\
    \n8    assert ( *p1 == 100 ); \n\n9 \n\n10    p1 = std::make_unique<int> (); \n\
    \n11    assert ( *p1 == 0 ); \n\n12 \n\n13 \n\n14    std::unique_ptr<std::string> p2 = std::make_unique<std::string> ( \"\
    Chandra\" ); \n\n15    assert ( *p2 == \"Chandra\" ); \n\n16 \n\n17    p2 = std::make_unique<std::string> (); \n\
    \n18    assert ( *p2 == \"\" ); \n\n19 \n\n20    p2 = std::make_unique<std::string> ( 10, ’c’ ); \n\
    \n21    assert ( *p2 == \"cccccccccc\" ); \n\n22}\n\nTo understand the mechanism\
    \ better, let us go through the implementation details of make_unique as far as\
    \ managing single object’s memory is concerned.\n\nLet us recall the interface\
    \ :\n\ntemplate<class T, class... Args> unique_ptr<T> make_unique(Args&&... args);\n\
    \nAnd the implementation looks like:\n\n1template<typename T, typename... Args> \n\
    \n2inline unique_ptr<T> make_unique(Args&&... args) \n\n3{ \n\n4    return unique_ptr<T>(new T(std::forward<Args>(args)...)); \n\
    \n5}\n\n### 0.37 make_unique and default initialization\n\n** Question 37 make_unique\
    \ and default initialization\n\nWrite a function which would do the default initialization\
    \ with make_unique as far as managing single object’s memory is concerned.\n\n\
    SOLUTION OF QUESTION [37](#part0000_split_007.html_x1-39001r37)1template<class T> \n\
    \n2inline unique_ptr<T> make_unique_default_init() \n\n3{ \n\n4        return unique_ptr<T>(new T); \n\
    \n5}\n\nTo understand it better, let us recall certain concepts like default initialization,\
    \ value initialization and zero initialization.\n\n*   zero initialization :\n\
    \n    *   if T is a scalar type, the object is initialized to the value obtained\
    \ by converting the integer literal 0 (zero) to T.\n\n    *   if T is a (possibly\
    \ cv-qualified) non-union class type, each non-static data member and each base-class\
    \ subobject is zero-initialized and padding is initialized to zero bits.\n\n \
    \   *   if T is a (possibly cv-qualified) union type, the object’s first non-static\
    \ named data member is zero-initialized and padding is initialized to zero bits.\n\
    \n    *   if T is an array type, each element is zero-initialized.\n\n    *  \
    \ if T is a reference type, no initialization is performed.\n\n*   default initialization\
    \ :\n\n    *   if T is a (possibly cv-qualified) class type, the default constructor\
    \ for T is called and the initialization is ill-formed if T has no default constructor\
    \ or overload resolution results in an ambiguity or in a function that is deleted\
    \ or inaccessible from the context of the initialization.\n\n    *   if T is an\
    \ array type, each element is default-initialized.\n\n    *   otherwise, no initialization\
    \ is performed.\n\n    If a program calls for the default initialization of an\
    \ object of a const-qualified type T, T shall be a class type with a user-provided\
    \ default constructor.\n\n*   value initialization :\n\n    *   if T is a (possibly\
    \ cv-qualified) class type with either no default constructor or a default constructor\
    \ that is user-provided or deleted, then the object is default-initialized.\n\n\
    \    *   if T is a (possibly cv-qualified) class type without a user-provided\
    \ or deleted default constructor, then the object is zero-initialized and the\
    \ semantic constraints for default-initialization are checked, and if T has a\
    \ non-trivial default constructor, the object is default-initialized.\n\n    *\
    \   if T is an array type, then each element is value-initialized.\n\n    *  \
    \ otherwise, the object is zero-initialized.\n\n    An object that is value-initialized\
    \ is deemed to be constructed and thus labeled as constructed objects, objects\
    \ for which the constructor has completed, etc., even if no constructor is invoked\
    \ for the object’s initialization.\n\nA program that calls for default-initialization\
    \ or value-initialization of an entity of reference type is ill-formed. Every\
    \ object of static storage duration is zero-initialized at program startup before\
    \ any other initialization takes place.\n\nAn object whose initializer is an empty\
    \ set of parentheses, i.e., (), shall be value-initialized. Since () is not permitted\
    \ by the syntax for initializer, the following is not the declaration of an object\
    \ of class X, but the declaration of a function taking no argument and returning\
    \ an X:\n\nX a();\n\nIf no initializer is specified for an object, the object\
    \ is default-initialized. If no initialization is performed, an object with automatic\
    \ or dynamic storage duration has indeterminate value. Objects with static or\
    \ thread storage duration are zero-initialized.\n\nIf the initializer is (), the\
    \ object is value-initialized.\n\n### 0.38 make_unique and array T[n]\n\n*** Question 38\
    \ make_unique and array T[n]\n\nWhat is the output of the program ?\n\n1#include <memory> \n\
    \n2#include <iostream> \n\n3 \n\n4int main() \n\n5{ \n\n6    auto up = std::make_unique<int[5]>(); \n\
    \n7 \n\n8    for(int i = 0; i < 5; ++i) \n\n9    { \n\n10        std::cout << up[i] << \"\
     \"; \n\n11    } \n\n12    std::cout << std::endl; \n\n13}SOLUTION OF QUESTION [38](#part0000_split_007.html_x1-40001r38)\n\
    \nIt does not get compiled. Error with gcc 4.9 looks like:\n\nmake_unique_array1.cpp:6:40:\
    \  \n\nerror: use of deleted function  \n\n’typename std::_MakeUniq<_Tp>::__invalid_type\
    \  \n\nstd::make_unique(_Args&& ...)  \n\n[with _Tp = int [5]; _Args = {};  \n\
    \ntypename std::_MakeUniq<_Tp>::__invalid_type  \n\n= std::_MakeUniq<int [5]>::__invalid_type]’\
    \  \n\n     auto up = std::make_unique<int[5]>();  \n\n                                        ^\
    \  \n\nIn file included from  \n\n/usr/local/include/c++/4.9.0/memory:81:0,  \n\
    \n                 from make_unique_array1.cpp:1:  \n\n/usr/local/include/c++/4.9.0/bits/unique_ptr.h:773:5:\
