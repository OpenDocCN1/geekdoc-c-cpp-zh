    \ An lvalue is an expression with which we can use & operator. An rvalue is an\
    \ expression that is not an lvalue.\n\nObjects that are declared as rvalue reference,\
    \ &&, can be lvalues or rvalues. If it has a name, then it is an lvalue. Otherwise,\
    \ it is an rvalue.\n\nReference collapsing : If a typedef-name or a decltype-specifier\
    \ denotes a type TR that is a reference to a type T, an attempt to create the\
    \ type lvalue reference to cv TR creates the type lvalue reference to T, while\
    \ an attempt to create the type rvalue reference to cv TR creates the type TR.\n\
    \n*   T&& becomes T&\n\n*   T&&& becomes T&\n\n*   T&&& becomes T&\n\n*   T&&&&\
    \ becomes T&&\n\n1int i; \n\n2typedef int& LRI; \n\n3typedef int&& RRI; \n\n4 \n\
    \n5LRI& r1 = i; // r1 has the type int&6const LRI& r2 = i; // r2 has the type int&7const LRI&& r3 = i; // r3 has the type int&8910RRI& r4 = i; // r4 has the type int&11RRI&& r5 = 5;  // r5 has the type int&&1213decltype(r2)& r6 = i; // r6 has the type int&14decltype(r2)&& r7 = i; // r7 has the type int&\n\
    \nThere is a special template argument deduction rule for function templates that\
    \ take an argument by rvalue reference to a template argument:\n\n1template<typename T> \n\
    \n2void f(T&&);\n\nHere, the following apply:\n\n*   When f is called on an lvalue\
    \ of type A, then T resolves to A& and hence, by the reference collapsing rules\
    \ above, the argument type effectively becomes A&.\n\n*   When f is called on\
    \ an rvalue of type A, then T resolves to A, and hence the argument type becomes\
    \ A&&.\n\nBy this special template deduction rule, the template argument T will\
    \ resolve to A&. After evaluating the remove_reference and applying the reference\
    \ collapsing rules, we get\n\n1A&& std::move(A& a) noexcept \n\n2{ \n\n3  return static_cast<A&&>(a); \n\
    \n4}\n\nSo, the lvalue a will bind to the lvalue reference that is the argument\
    \ type, and the function passes it right through, turning it into an unnamed rvalue\
    \ reference. Simple !\n\n### 0.84 C++14 Compiler\n\n*** Question 84 C++14 Compiler\n\
    \nHow to get a C++14 Compiler ?\n\nSOLUTION OF QUESTION [84](#part0000_split_014.html_x1-93001r84)\n\
    \nThere are plenty of compilers available for free. Pick one which suits you.\n\
    \n*   Gnu Compiler Collection : gcc 4.9.0 : Easy steps for installing GCC 4.9.0:\n\
    \n    *   wget ftp://ftp.gnu.org/gnu/gcc/gcc-4.9.0/\n\n        gcc-4.9.0.tar.bz2\n\
    \n    *   tar -xvjf gcc-4.9.0.tar.bz2\n\n    *   cd gcc-4.9.0\n\n    *   ./contrib/download_prerequisites\n\
    \n    *   cd ..\n\n    *   mkdir gcc-4.9.0-build\n\n    *   cd gcc-4.9.0-build\n\
    \n    *   $PWD/../gcc-4.9.0/configure –enable-languages=c,c++\n\n    *   make\
    \ -j$(nproc)\n\n        Here nproc is the number of processors.\n\n    *   make\
    \ install\n\n        This will install gcc-4.9.0 in the path /usr/local/bin. g++\
    \ is the C++ compiler.\n\n*   Clang 3.5: A new open-source C++ compiler for various\
    \ platforms. Kindly note that you may need to include the latest libstdc++ in\
    \ your path to help clang build environment search it appropriately. On Linux-like\
    \ systems, it could be achieved by including the following somewhere(eg, .bashrc):\n\
    \n    export LD_LIBRARY_PATH=  \n\n    /usr/local/lib:$LD_LIBRARY_PATH\n\n   \
    \ In 64-bit systems, it may be:\n\n    export LD_LIBRARY_PATH=  \n\n    /usr/local/lib64:$LD_LIBRARY_PATH\n\
    \n*   Online Compilers:\n\n    *   gcc.godbolt.org (Clang, GCC, Intel ICC)\n\n\
    \    *   Rise4Fun (Microsoft VC++)\n\n    *   Stacked-Crooked (GCC)\n\n    * \
    \  Rextester (Clang, GCC)\n\n    *   ideone.com (GCC)\n\nclang++ is the C++ compiler.\n\
    \nFor C++11 features, the option is -std=c++11.\n\nFor C++14 features, the option\
    \ is -std=c+1y. We can also pass the option -std=c++14 with g++.\n\n## Books In\
    \ Print\n\n### Advanced C++ FAQs: Volume 1 : Fundamentals\n\nThis book is not\
    \ an introduction to C++. It assumes that the reader is aware of the basics of\
    \ C++98 and C++03 and wants to expand her horizon to latest and greatest in the\
    \ present and future of C++, including C++11 and C++1y(aka C++14). It contains\
    \ selected fundamental problems with detailed solutions to all of these which\
    \ will help the reader to hone her skills to solve a particular problem. The problems\
    \ are marked on a scale of one(*)(simplest) to five stars(*****)(hardest)."
