    \ 只管理对象。\n*   `allocate_unique` 的情况不同，因为 `shared_ptr` 是通过类型擦除实现的。因此，考虑到 `allocate_unique`\
    \ 的返回类型，它必须仔细设计。\n*   我们不能使用默认删除器，因此需要设计合适的删除器。\n*   `shared_ptr` 不处理数组，而 `unique_ptr`\
    \ 可以。`allocate_unique` 必须考虑到这一点。\n*   编写完美的变长参数模板可能是繁琐的。\n\n记住这些点，以下是 `allocate_unique`\
