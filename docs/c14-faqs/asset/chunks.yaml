    \ : \" << prod << std::endl;\n}\n```\n\nOr\n\nProgram 14: generic lambda and product\
    \ vector\n```cpp\n#include <vector>\n#include <algorithm>\n#include <iostream>\n\
    \nauto mult = [](auto x, auto y) { return x * y; };\n\nint main()\n{ \n    std::vector<int>\
    \ v{1, 2, 3, 4, 5};\n\n    auto prod = \n        std::accumulate(v.begin(), v.end(),\
    \ \n                        1,\n                        mult \n              \
    \          );\n    std::cout << \"product : \" << prod << std::endl;\n}\n```\n\
    \nIn C++14, `auto` type-specifier has been allowed to indicate a generic lambda\
    \ parameter.\n\nNote that this generic lambda-expression containing statement:\n\
    ```cpp\nauto mult = [](auto x, auto y) { return x * y; };\n```\nmight result in\
    \ the creation of a closure type, and object that behaves similar to the struct\
    \ below:\n\n```cpp\nstruct /* anonymous */ \n{ \n    template <typename T, typename\
    \ U> \n    auto operator()(T x, U y) const { return x * y; }\n} mult;\n```\nIf\
    \ the initial type-specifier within the declifier-seq of a lambda’s declaration\
    \ is `auto`, the expression creates a generic closure. A generic closure is just\
    \ like a familiar C++11 closure type except that its function call operator is\
    \ a member template. In the operator’s parameters, each use of `auto` is replaced\
    \ by a unique template parameter, which is added to the operator’s template-list.\n\
    \n### 0.72 generic lambda\n\nQuestion 72 generic lambda\nWrite a generic code\
    \ that accepts an argument of any type and returns the value of its parameter.\n\
    \nProgram 15: usage of generic lambda\n```cpp\n#include <iostream>\n\nint main()\n\
    {\n// 'Identity' is a lambda that accepts an argument of any type and\n// returns\
    \ the value of its parameter.\n    auto Identity = [](auto a) { return a; };\n\
    \n    int three_int = Identity(3);\n    char const three_str = Identity(\"three\"\
    );\n\n    std::cout << \"three as integer : \" << three_int << std::endl;\n  \
