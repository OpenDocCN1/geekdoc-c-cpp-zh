    ### 0.53 Piecewise construction of std::pair


    *** Question 53 Piecewise construction of std::pair


    Explain how piecewise construction of std::pair works.


    SOLUTION OF QUESTION [53](#part0000_split_009.html_x1-59001r53)


    The struct piecewise_construct_t is an empty structure type used as a unique type
    to disambiguate constructor and function overloading.


    struct piecewise_construct_t { }; 


    constexpr piecewise_construct_t piecewise_construct = piecewise_construct_t();


    Specifically, pair has a constructor with piecewise_construct_t as the first argument,
    immediately followed by two tuple arguments used for piecewise construction of
    the elements of the pair object:


    template <class... Args1, class... Args2> 


    pair(piecewise_construct_t, 


    tuple<Args1...> first_args, tuple<Args2...> second_args);


    The constructor initializes first with arguments of types Args1... obtained by
    forwarding the elements of first_args and initializes second with arguments of
    types Args2... obtained by forwarding the elements of second_args.


    Note that, forwarding an element x of type U within a tuple object means calling


    std::forward<U>(x).


    This form of construction, whereby constructor arguments for first and second
    are each provided in a separate tuple object, is called piecewise construction.


    One implementation technique is to delegate to a private constructor for pair
    that takes two types like std::index_sequence:


    template<class... Args1, class... Args2> 


    pair(std::piecewise_construct_t, std::tuple<Args1...> args1, std::tuple<Args2...> args2) 


        : 


    std::pair(args1, args2, std::index_sequence_for<Args1...>{}, std::index_sequence_for<Args2...>{}) 


    { } 


    private: 


    template<class... A1, class... A2, size_t... I1, size_t... I2> 


    pair(std::tuple<A1...>& a1, std::tuple<A2...>& a2, std::index_sequence<I1...>, std::index_sequence<I2...>) 


        : 


    first(std::get<I1>(std::move(a1))...), 


    second(std::get<I2>(std::move(a2))...) 


    { }


