    note: ’A’ has been explicitly marked deprecated  


          here  


    class A{};  


          ^  


    1 warning generated.  


    ### 0.24 Member initializers and aggregate class


    *** Question 24 Member initializers and aggregates


    What is the output of the program ?


    1#include <iostream> 


    2 


    3struct Univ 


    4{ 


    5    std::string name; 


    6    int rank; 


    7    int i; 


    8    std::string city = "unknown"; 


    9    char c = city[rank]; 


    10}; 


    11 


    12int main() 


    13{ 


    14    Univ u = {"Columbia", 3}; 


    15 


    16    std::cout << u.name << ’ ’ << u.rank 


    17              << ’ ’ << u.i << ’ ’ 


    18              << u.city << ’ ’ << u.c << ’\n’; 


    19}SOLUTION OF QUESTION [24](#part0000_split_005.html_x1-26001r24)


    Kindly note that the class Univ is an aggregate because it satisfies all the criteria
    enlisted ahead, it has


    *   no user-provided constructors,


    *   no private or protected non-static data members,


    *   no base classes,


    *   and no virtual functions


    If there are fewer initializer-clauses in the list than there are members in the
    aggregate, then each member not explicitly initialized will be initialized from


    *   its brace-or-equal-initializer or,


    *   an empty initializer list if there is no brace-or-equal-initializer.


    Hence


    *   u.name is initialized with Columbia,


    *   u.rank with 3,


    *   u.i with the value of an expression of the form int{}(), that is, 0


    *   u.city with unknown


    *   u.c with the value of u.city[c.rank], i.e., with the character at the 3rd
    index of the string unknown, i.e., with n.


    To summarize, it prints:


    Columbia 3 0 unknown n


