  trans: "\n\n# 问题 55 sfinae 与函数的表示类型\n\n开发一个泛型函数对象 `increment_me`，用于递增可递增类型的传入值，使得以下调用能够打印出\
    \ 6：\n\n```cpp\nstd::cout << increment_me()(5) << std::endl;\n```\n\n说明如何像普通函数函数调用\
    \ `call_increment_me` 一样使用它：\n\n```cpp\nstd::cout << call_increment_me(5) << std::endl;\n\
    ```\n\n同时，请考虑让它调用另一个同名的函数，以便用于不可递增的类型，且不会产生任何编译器错误。\n\n## 第 55 题解答\n\n```cpp\n\
    struct increment_me {\n    template<typename T>\n    auto operator()(T t) const\n\
    \        -> decltype(++t)\n    {\n        return ++t;\n    }\n};\n\ntemplate <typename\
    \ T>\ntypename std::result_of<increment_me(T)>::type\ncall_increment_me(T t)\n\
    {\n    return increment_me()(t);\n}\n```\n\n`std::result_of` 本质上是一个用于返回表达式类型的元函数。\n\
    \n或者，我们可以将上述函数重写为：\n\n```cpp\ntemplate <typename T>\ndecltype(std::declval<increment_me>()(std::declval<T>()))\n\
    call_increment_me(T t)\n{\n    return increment_me()(t);\n}\n```\n\n现在，如果尝试对不可递增的类型（如\
    \ `std::string`）使用此函数，会导致编译器错误，并引用替换失败（substitution failure）。\n\n我们希望利用在 C++14\
    \ 中 `std::result_of` 是对 SFINAE 友这一特性。\n\n```cpp\ntemplate <typename T>\ntypename\
    \ std::result_of<increment_me(T)>::type\ncall_increment_me(T t)\n{\n    return\
    \ increment_me()(t);\n}\n\nstruct A {};\nstruct B { template<typename T> B(T const&)\
    \ {} };\n\nA call_increment_me(B)\n{\n    std::cout << \"A call_increment_me()\
    \ called\" << std::endl;\n    return A();\n}\n```\n\n因此，接下来的客户端代码：\n\n```cpp\n\
    std::cout << increment_me()(5) << std::endl;\nstd::cout << call_increment_me(5)\
    \ << std::endl;\ncall_increment_me(std::string(\"5\"));\n```\n\n将打印：\n\n```\n\
    6\n6\nA call_increment_me() called\n```\n\n请注意，在 C++14 之前的时代，`std::result_of`\
    \ 并不是 SFINAE 友好的，会导致硬错误。因此用户别无选择，只能依赖 decltype 变体，这在这种情况下有些复杂。\n\n# 问题 56 元函数：检查类型成员的存在\n\
    \n开发一个类似于类特征（trait-like）元函数形式的工具，用于确定类型 `T` 是否拥有名为 `type` 的类型成员。\n\n## 第 56 题解答\n\
    \n```cpp\n#include <type_traits>\n#include <iomanip>\n#include <iostream>\n\n\
    template< class T >\n    using void_t = void;\n//using void_t = std::conditional_t<true,\
    \ void, T>;\n\ntemplate< class, class = void >\nstruct has_type_member : std::false_type\n\
    {\n};\n\ntemplate< class T >\nstruct has_type_member<T, void_t<typename T::type>>\
    \ : std::true_type even{};\n\nstruct A\n{\n    typedef int type;\n};\n\nstruct\
    \ B\n{\n};\n\nint main()\n{\n    static_assert(has_type_member<A>::value, \"\"\
    );\n    static_assert(!has_type_member<B>::value, \"\");\n\n    std::cout << std::boolalpha;\n\
    \    std::cout << has_type_member<A>() << std::endl;\n    std::cout << has_type_member<B>()\
    \ << std::endl;\n    std::cout << has_type_member<common_type<int, double>>()\
    \ << std::endl;\n    std::cout << has_type_member<common_type<int, std::string>>()\
    \ << std::endl;\n}\n```\n\n它打印：\n\n```\ntrue\nfalse\ntrue\nfalse\n```\n\n与计算此类结果传统代码相比，这个版本似乎明显简单得多，而且没有特殊情况（例如，避免任何指针到引用的情况）。`void_t`\
    \ 别名模板的目的仅仅是将任何给定类型映射到 `void`。\n\n在某些平台上，它可能会在别名特化中发出关于未使用 `T` 的错误，因此我们可能需要使用以下代码：\n\
    \n```cpp\nusing void_t = std::conditional_t<true, void, T>;\n```\n\n`conditional_t`\
    \ 作为变通方法确保我们的模板参数被使用。代码恰好包含两种情况，每种情况都很直观：\n\n1. 当存在名为 `type` 的成员时，特化是良好的（以 `void`\
    \ 作为第二个参数）并会被选中，产生 `true_type`。\n2. 当没有此类成员时，SFINAE 将起作用，特化将是不可行的，相反将选择主模板，产生\
    \ `false_type`。\n\n因此，每个情况都获得了适当的结果。请注意，我们可以扩展 `void_t` 代码，用于将类型序列映射到 `void`。\n\
    \n```cpp\ntemplate< class... >\nstruct voider { using type = void; };\n\ntemplate<\
    \ class... T0N >\nusing void_t = typename voider<T0N...>::type;\n```\n\n# 问题 57\
    \ common_type 和 sfinae\n\n提供 `common_type` 特性的合适实现，以便在没有公共类型时避免硬错误，并使该特征在 SFINAE\
    \ 上文中方便使用。\n\n## 第 57 题解答\n\n首先，让我们开发一个别名模板，用于在类型 `T` 和 `U` 有任何公共类型时确定类型：\n\n\
    ```cpp\ntemplate< class T, class U >\n    using common_type_helper = decltype(declval<bool>()\
    \ ? declval<T>() : declval<U>());\n```\n\n`common_type_helper` 的特化当条件表达式无效时是错误的，即当\
    \ `T` 和 `U` 没有公共类型时。这种情况也发生在类型列表为空时。\n\n```cpp\ntemplate< class... >\nstruct ctype\
    \ {};\n```\n\n让我们特化处理单个类型的情况：\n\n```cpp\ntemplate< class T >\nstruct ctype<void,T>\n\
    {\n    using type = decay_t<T>;\n};\n```\n\n第二个特化处理两个或更多类型的通用情况：\n\n```cpp\ntemplate<\
    \ class T, class U, class... V >\nstruct ctype<void_t<common_type_helper<T,U>>,\
    \ T, U, V >\n    : ctype<void, common_type_helper<T,U>, V...> {};\n```\n\n该特化只有当类型列表的前两个类型具有\
    \ `common_type` 定义的公共类型时可行。\n\n如果前两个类型没有公共类型，两个特化都将失效，因此选择主模板以结束递归。否则，一旦列表被递归归约为单个类型，第一个特化将被选中。\n\
    \n```cpp\ntemplate <class... T>\nstruct common_type : ctype<void, T...> {};\n\
    ```\n\n* 如果 `sizeof...(T)` 为零，则没有成员类型。\n* 如果 `sizeof...(T)` 为一，让 `T0` 表示组成 `T`\
    \ 的唯一类型。成员定义类型与 `decay_t<T0>` 相同。\n* 如果 `sizeof...(T)` 大于一，让 `T1`、`T2` 和 `R` 分别表示组成\
    \ `T` 的第一个、第二个和剩余包。`sizeof...(R)` 可能为零。最后，让 `C` 表示一个未求值的条件表达式的类型（如果有），其第一个操作数是\
    \ `bool` 类型的任意值，第二个操作数是类型 `T1` 的右值，第三个操作数是类型 `T2` 的右值。如果存在这样的类型 `C`，成员定义类型与 `common_type_t<C,R>`\
    \ 相同（如果有）。否则，则没有成员类型。\n\n"
- fmt: "\n# SOLUTION OF QUESTION [58]\n\nSimple design of the desired class is:\n\n\
    ## Program 2: class template : wrapper for arithmetic or pointer types\n\n```cpp\n\
    #include <cassert>\n#include <type_traits>\n\ntemplate<\n    class T,\n    class\
    \ = typename\n              std::enable_if<\n                          std::is_arithmetic<T>::value\n\
    \                          || std::is_pointer<T>::value\n              >::type\n\
    >\nstruct zero_init\n{\n    zero_init( )\n    : val( static_cast<T>(0) )\n   \
    \ { }\n\n    zero_init( T val ):val( val )\n    { }\n\n    operator T & ()\n \
    \   { return val; }\n\n    operator T() const\n    { return val; }\n\nprivate:\n\
    \    T val;\n};\n```\n\nPlease note that two conversion operators are provided\
    \ to cover the case of const and non-const objects being treated differently.\n\
    \nSimplified usage looks like:\n\n## Program 3: conversion with pointer and value\n\
    \n```cpp\nint main()\n{\n    zero_init<int*> p;\n    assert( p == 0 );\n\n   \
    \ p = new int(7);\n    assert( *p == 7 );\n\n    delete p;\n\n    zero_init<int>\
    \ i; assert( i == 0 );\n    i = 7;\n    assert( i == 7 );\n\n    switch( i )\n\
    \    {\n        case 7 :\n        std::cout << \"7\" << std::endl;\n        default:\n\
    \        exit(0);\n    }\n}\n```\n\nIt simply prints: 7.\n\n### Caveat\nCertain\
    \ compilers, which are not C++14 complaint, may lead to the following scenarios:\n\
    \n- `delete p` may produce diagnostics.\n- the expression `i` in `switch` may\
    \ be ill-formed.\n\nThe issue here is because of the restriction being implied\
    \ by single non-explicit conversion function with pre-c++14. And certain contextual\
    \ conversion rules that limit a class to only one conversion operator while allowing\
    \ for the conversion of a value of the class’s type to a corresponding value of\
    \ a type specified by the context.\n\n### Workaround with pre-C++14 Compilers\n\
    To address these embarrassing situations, simple workarounds may be to use `delete\
    \ (p+0)` or `delete +p` instead of `delete p`.\n\nSimilarly, we may use `switch(i\
    \ + 0)` or `switch(+i)` instead of `switch(i)`.\n\nGoing forward, C++14 lifted\
    \ these restrictions on contextual conversions by supporting the proven approach\
    \ of contextually conversion to bool. This change avoids the need for the embarrassing\
    \ workarounds as well as it brings the benefit of more consistent behavior by\
    \ eliminating the special cases for contextual conversions, aligning them with\
    \ the C++11 conversion to bool.\n\n## 0.59 Single quotation mark as digit separator\n\
    \n### Question 59 Single quotation mark as digit separator\n\nWhat is the output\
    \ of the following program?\n\n## Program 4: Single quotation mark as digit separator\n\
    \n```cpp\n#include <iostream>\n\n#define M(x,...) __VA_ARGS__\n\nint main()\n\
    {\n/*auto million = 1'000'000;\n    auto pi = 3.14159'26535'8973;\n    std::cout\
    \ << \"million is: \" << million << std::endl;\n    std::cout << \"pi is: \" <<\
    \ pi << std::endl;*/\n    int x[2] = { M(1'2,3'4) };\n\n    for(auto e : x)\n\
    \        std::cout << e << std::endl;\n}\n```\n\n### SOLUTION OF QUESTION [59]\n\
    \nThe code does get compiled with C++11 because the single quotes delimit a character\
    \ literal in C++11.\n\nThe error with clang++ 3.5\n`clang++ -std=c++11 digit_separator.cpp`\
    \ is:\n\n```\ndigit_separator.cpp:7:21:\nerror: expected ';' at end of declaration\n\
    \    auto million = 1'000'000;\n               ^\ndigit_separator.cpp:8:22:\n\
    error: expected ';' at end of declaration\n    auto pi = 3.14159'26535'89793;\n\
    \             ^\n```\n\n2 errors generated. Let us get rid of the lines containing\
    \ these errors, then C++11 compilers compiles it fine and but the output is\n\n\
    ```\n0\n0\n```\n\nWhereas with C++14 compilers,\n`clang++ -std=c++14 digit_separator.cpp`,\
    \ it correctly prints the values of million and pi and the array x is\n\n```\n\
    34\n0\n```\n\nBecause the single quotes are digit separators in C++14. Hence the\
    \ single-quote character `'` can now be used anywhere within a numeric literal\
    \ for aesthetic readability. It does not affect the numeric value.\n\nSimilarly,\
    \ the float literals `1.602'176'565e-19` and `1.602176565e-19` have the same value.\
    \ Optional separating single quotes in a digit-sequence are ignored when determining\
    \ its value.\n\nAlong the same lines:\nthe literals `10485764`, `1'048'576`, `0X100000`,\
    \ `0x10'0000`, and `0'004'000'000` all have the same value.\n\n## 0.60 Binary\
    \ Literals\n\n### Question 60 Binary literals\n\nWhat is a Binary Literal?\n\n\
    ### SOLUTION OF QUESTION [60]\n\nA binary integer literal (base two) begins with\
    \ `0b` or `0B` and consists of a sequence of binary digits.\n\nInteger constants\
    \ can be written as binary constants, consisting of a sequence of `'0'` and `'1'`\
    \ digits, prefixed by `'0b'` or `'0B'`. This is particularly useful in environments\
    \ that operate a lot on the bit level (like microcontrollers). The following statements\
    \ are identical:\n\n- `i = 4`\n- `i = 0x2`\n- `i = 05`\n- `i = 0b10101`\n\nThe\
    \ type of these constants follows the same rules as octal or hexadecimal constants,\
    \ so suffixes like `L` or `UL` can be applied. Integers can be specified in decimal,\
    \ binary, octal, or hexadecimal.\n\n- Decimal integers are digits.\n- Binary integers\
    \ are a sequence of binary digits preceded by `'0b'`.\n- Octal integers are a\
    \ sequence of octal digits preceded by `'0'`.\n- Hexadecimal integers are a sequence\
    \ of hexadecimal digits preceded by `'0x'`.\n\nIntegers can have embedded `_`\
    \ characters, which are ignored. The embedded `_` are useful for formatting literals,\
    \ such as using them as a thousands separator:\n\n- `123_456`\n- `1_2_3_4_5_6`\n\
    \nThe number twelve can be represented as:\n\n## Program 5: representation of\
    \ twelve\n\n```cpp\n#include <assert>\n\nint main()\n{\n    auto x1 = 12; // decimal\n\
    \    auto x2 = 04; // octal\n    auto x3 = XC // hexadecimal\n    auto x4 = 0b100;\
    \ // binary\n    auto x5 = 0B100; // binary\n\n    assert(x1 == x2);\n    assert(x2\
    \ == x3);\n    assert(x3 == x4);\n    assert(x4 == x5);\n}\n```\n\n## 0.61 auto\
    \ return type in function declaration\n\n### Question 61 auto return type in function\
    \ declaration\n\nReview the code fragments below:\n\n```cpp\nstruct A\n{\n   \
    \ auto f();\n};\nauto A::f() { return 42; }\n```\n\n```cpp\nauto f();\nauto f()\
    \ { return 42; }\nauto f();\nint f();\n```\n\n```cpp\ntemplate<class T> auto g(T\
    \ t);\ntemplate<class T> auto g(T t) { return t; }\ntemplate<class T> auto g(T\
    \ t);\n```\n\n```cpp\nauto f();\nint i = f();\n```\n\n```cpp\ntemplate<class T>\
    \ auto f(T t) { return t; }\ntemplate auto f(int);\ntemplate char f(char);\ntemplate<>\
    \ auto f(double);\n\ntemplate<class T> T f(T t) { return t; }\ntemplate char f(char);\n\
    template auto f(float);\n```\n\n### SOLUTION OF QUESTION [61]\n\nAllowing non-defining\
    \ function declarations with auto return type is not strictly necessary, but it\
    \ is useful for coding styles that prefer to define member functions outside the\
    \ class:\n\n```cpp\nstruct A\n{\n    auto f(); // forward declaration\n};\nauto\
    \ A::f() { return 42; }\n```\n\nNon-defining declarations are allowed so long\
    \ as all declarations have the same declared type, without considering the deduced\
    \ type.\n\n```cpp\nauto f(); // return type is unknown\nauto f() { return 42;\
    \ } // return type is int\nauto f(); // redeclaration\nint f(); // error, declares\
    \ a different function\n```\n\nSimilar rules apply for function templates as well:\n\
    \n```cpp\ntemplate<class T> auto g(T t); // forward declaration\ntemplate<class\
    \ T> auto g(T t) { return t; } // return type is deduced at instantiation time\n\
    template<class T> auto g(T t); // redeclaration\n```\n\nUsing such a function\
    \ in an expression when only a forward declaration has been seen is ill-formed:\n\
    \n```cpp\nauto f(); // return type is unknown\nint i = f(); // error, return type\
    \ of f is unknown\n```\n"
