  trans: "\n\n0.78 通用操作符仿函数\n0.79 交换工具类\n0.80 按类型寻址元组\n0.81 引号操作符\n0.82 空迭代器\n0.83\
    \ std::move 是 rvalue_cast\n0.84 C++14 编译器\n\n在售书籍书籍\n\n### 0.1 变量模板\n\n#### 问题\
    \ 1 变量模板\n什么是变量模板？\n\n问题解答\n\n变量模板是由变量的模板声明所引入的声明。正如我们所知道的，如果一个模板声明定义了一个函数、类、变量或静态数据成员，那么该模板声明也是一个定义。\n\
    \n类作用域范围内的变量模板是一个静态数据成员模板。\n\n考虑一个简单的模板元函数，它使用变量模板特性来存储两个类型比较结果的布尔值：\n\n```cpp\n\
    template <typename T, typename U>\nconstexpr bool is_same = std::is_same<T, U>::value;\n\
    \nbool t = is_same<int, int>; // true\nbool f = is_same<int, float>; // false\n\
    ```\n\n变量模板的类型不仅限于内置类型；它们也可以是用户定义的类型。\n\n```cpp\nstruct matrix_constants\n{\n\
    \    template<typename T>\n    using pauli = hermitian_matrix<T, 2>;\n\n    template<typename\
    \ T>\n    constexpr pauli<T> sigma1 = { { 0, 1 }, { 1, 0 } };\n\n    template<typename\
    \ T>\n    constexpr pauli<T> sigma2 = { { 0, -1i }, { 1i, 0 } };\n\n    template<typename\
    \ T>\n    constexpr pauli<T> sigma3 = { { 1, 0 }, { -1, 0 } };\n};\n```\n\n它使得参数化常量的定义和使用变得简单得多，从而简化了更简单、更统一的编程规则，例如：\n\
    \n```cpp\ntemplate<typename T>\nstruct lexical_cast_fn\n{\n    template<typename\
    \ U>\n    T operator()(U const &u) const\n    {\n        //...\n    }\n};\n\n\
    template<typename T>\nconstexpr lexical_cast_fn<T> lexical_cast{};\n\nint main()\n\
    {\n    lexical_cast<int>(\"42\");\n}\n```\n\n### 0.2 类模板的 constexpr 静态数据成员\n\n\
    #### 问题 2 类模板的 constexpr 静态数据成员\n类模板的 constexpr 静态数据成员有什么问题？\n\n问题解答\n\n让我们重新回顾\
    \ `std::is_same` 是如何设计的：\n\n```cpp\ntemplate<typename T, T v>\nstruct integral_constant\n\
    {\n    static constexpr T value = v;\n    typedef T value_type;\n};\n\ntemplate<typename\
    \ T, T v>\nconstexpr T integral_constant<T, v>::value;\ntypedef integral_constant<bool,\
    \ true> true_type;\ntypedef integral_constant<bool, false> false_type;\n\ntemplate<typename\
    \ T, typename U>\nstruct is_same: false_type{};\n\ntemplate<typename T>\nstruct\
    \ is_same<T, T>: true_type{};\n```\n\n静态成员的主要问题在于：\n- 它们需要重复声明：\n    1. 一次在类模板内部，\n\
    \    2. 一次在类模板外部，以便在使用了 ODR（单一定义规则）时提供实际定义。\n- 由于必须提供两次相同的声明而造成了困惑，而普通常量不需要。\n\
    \n标准类 `numeric_limits` 在 constexpr 数据成员方面也存在相同的问题。\n\n### 0.3 constexpr 函数模板\n\
    \n#### 问题 3 constexpr 函数模板\nconstexpr 函数模板有什么问题？\n\n问题解答\n\nconstexpr 函数模板提供了函数抽象。一个简单的\
    \ constexpr 函数：\n\n```cpp\ntemplate <typename T, typename U>\nconstexpr bool is_same()\n\
    {\n    return std::is_same<T, U>::value;\n}\n```\n\n然而，它们迫使我们在定义处预先选择如何传递常量：要么通过\
    \ `const` 引用，要么通过普通的非引用类型。如果通过 `const` 引用传递，则常量必须系统地分配在静态存储器中。如果通过非引用类型传递，则常量需要拷贝。对于内置类型来说，拷贝不是问题，但对于具有值语义且不仅仅是内置类型封装器的用户定义类型来说，这是一个问题。而普通的\
    \ constexpr 变量不受此影响。它们只提供了一个简单的定义，而常量是否实际上需要布局在存储中取决于用法。\n\n其他例子是 `std::numeric_limits`\
    \ 的静态成员函数以及像 `boost::constants::pi<T>()` 这样的函数：\n\n```cpp\n#include <boost/math/constants/constants.hpp>\n\
    \ntemplate <class Real>\nReal area(Real r)\n{\n    using namespace boost::math::constants;\n\
    \    return pi<Real>() * r * r;\n}\n```\n\n常量的函数模板版本是简单的内联函数，返回对于对应类型正确精度的常量。此外，对于支持此点的编译器，这些函数被声明为\
    \ `constexpr`，允许在模板参数为字面量类型的情况下将结果用于常量表达式。这看起来我们创建 constexpr 函数仅仅是为了返回一个常量。\n\n\
    ### 0.4 变量模板的实践\n\n#### 问题 4 变量模板的实践\n说明如何使用变量模板为具有适当精度的给定类型计算圆面积？\n\n问题解答\n\n\
    变量模板解决了前述说明的两个问题，并且在 C++11 中引入此功能不需要修改语法，因为现在的语法允许任何声明参数化。之前这是禁止的。\n\n让我们首先用浮点数据类型确定的数学常量\
    \ π 表示：\n\n程序 1：π 与变量模板\n\n```cpp\n#include <iostream>\n#include <iomanip>\n\n\
    template<typename T>\nconstexpr T pi= T(3.1415926535897932385);\n\nint main()\n\
    {\n    std::cout << std::setprecision(40);\n    std::cout << \"pi<int> : \" <<\
    \ pi<int> << std::endl;\n    std::cout << \"pi<float> : \" << pi<float> << std::endl;\n\
    \    std::cout << \"pi<double> : \" << pi<double> << std::endl;\n}\n```\n\n使用以下命令：\n\
    `clang++ -std=c++11 variable_template.cpp`\n\n我们得到以下输出：\npi<int> : 3\npi<float>\
    \ : 3.1415927410125732421875\npi<double> : 3.14159265358979311599796346854418516159\n\
    \n这个变量模板可以用于泛型函数为给定的半径计算面积：\n\n```cpp\ntemplate<typename T>\nT area_circle(T r)\n\
    {\n    return pi<T> * r * r;\n}\n```\n\n### 0.5 静态数据成员模板\n\n#### 问题 5 静态数据成员模板\n\
    为静态数据成员模板提供合适的定义：\n\n问题解答\n\n正如我们所知道的，类作用域范围内的变量模板是一个静态数据成员模板，静态成员或静态数据成员模板的定义可以在包含静态成员类模板定义的命名空间范围内提供。\n\
    \n```cpp\nstruct limits\n{\n    template<typename T>\n    static const T min;\
    \ // min 的声明\n};\n\ntemplate<typename T>\nconst T limits::min = {}; // min 的定义\n\
    ```\n\n### 0.6 变量模板的特化\n\n#### 问题 6 变量模板的特化\n\n"
- fmt: "\nSimplify the program below to do the needful:\n\n```cpp\ntemplate <typename\
    \ T, typename U>\nconstexpr bool is_same = std::is_same<T, U>::value;\n\nbool\
    \ t = is_same<int, int>; // true\nbool f = is_same<int, float>; // false\n```\n\
    \n### SOLUTION OF QUESTION 6\n\nVariable templates are subject to template specialization\
    \ like template functions, so we can simplify the code as follows:\n\n```cpp\n\
    template<typename T, typename U>\nconstexpr bool is_same = false;\n\ntemplate<typename\
    \ T>\nconstexpr bool is_same<T, T> = true;\n```\n\n### 0.7 default argument and\
    \ specialization of variable template\n\n#### Question7 default argument and specialization\
    \ of variable template\n\nWhat is the output of the program ?\n\n```cpp\n#include\
    \ <iostream>\n#include <iomanip>\n\ntemplate<typename T=double>\nconstexpr T pi\
    \ = T(3.1415926535897932385);\n\ntemplate<>\nconstexpr float pi<int> = pi<float>;\n\
    \nint main()\n{\n    std::cout << std::setprecision(30);\n    std::cout << \"\
    pi<> : \" << pi<> << std::endl;\n    std::cout << \"pi<int> : \" << pi<int> <<\
    \ std::endl;\n    std::cout << \"pi<float> : \" << pi<float> << std::endl;\n}\n\
    ```\n\n#### SOLUTION OF QUESTION 7\n`pi<> : 3.14159265358979311599796346854`\n\
    `pi<int> : 3.1415927410125732421875`\n`pi<float> : 3.1415927410125732421875`\n\
    \n### 0.8 lambda and variable template\n\n#### Question8 lambda and variable template\n\
    \nSimplify the program below.\n\n```cpp\ntemplate<typename T>\nT area_circle(T\
    \ r)\n{\n    return pi<T> * r * r;\n}\n```\n\n#### SOLUTION OF QUESTION 8\n```cpp\n\
    template<typename T>\nauto area_circle = [](auto r) { return pi<T> * r * r; };\n\
    ```\n\n### 0.9 variable templates variables vary\n\n#### Question 9 variable templates\
    \ variables vary\n\nIs this a legal code ?\n\n```cpp\n#include <iostream>\n\n\
    template<typename T>\nT magicVal = 42;\n\nint main()\n{\n    std::cout << magicVal<int>\
    \ << std::endl;\n    magicVal<int> = 0;\n    std::cout << magicVal<int> << std::endl;\n\
    }\n```\n\nIf yes, what is the output ?\n\n#### SOLUTION OF QUESTION 9\nYes, the\
    \ code is correct because variable template instances are first-class objects.\n\
    Output is :\n```\n42\n0\n```\n\n### 0.10 auto variable templates\n\n#### Question\
    \ 10 variable templates variables vary\n\nIs this a legal code ?\n\n```cpp\ntemplate<class>\
    \ constexpr auto X = 42;\n\nint main()\n{\n    static_assert(X<int> == 42, \"\"\
    );\n}\n```\n\n#### SOLUTION OF QUESTION 10\nYes, a specialization of a variable\
    \ template is a variable as per the standard : No diagnostic shall be issued for\
    \ a template which a valid specialization can be generated.\n\n### 0.1 valid specialization\
    \ but error\n\n#### Question 1 valid specialization but error\n\nWhy this code’t\
    \ compile ?\n\n```cpp\nclass Y\n{\n    typedef int type;\n};\n\ntemplate<Y::type\
    \ N>\nstruct X {};\n```\n\nTypical error is:\n```\nspecialize.cpp:3:17: error:\
    \ ‘Y::type’ is private\n    typedef int type;\nspecialize.cpp:6:13: error: within\
    \ this context\ntemplate<Y::type N>\n```\nBecause the template parameter is ill-formed,\
    \ it gets diagnosed immediately and does not form any structure. Hence there is\
    \ no template to be specialized in the place. There is no “ill-formed”, because\
    \ ill-formedness implies the state of not being. So, if the parameter is nonsensical,\
    \ then we don’t have a declaration. And if the template declaration itself is\
    \ nonsensical, we don’t have a declaration to specialize, hence the compiler error\
    \ is issued.\n\n### 0.12 variable templates and lambda\n\n#### Question 12 variable\
    \ templates and lambda\n\nExploit variable templates and lambda to compute the\
    \ area of a circle.\n\n```cpp\ntemplate<typename T>\nstruct Circle\n{\n    T radius;\n\
    \    using value_type = T;\n\n    Circle(T r) : radius(r) {}\n    Circle(const\
    \ Circle& c) : radius(c.radius) {}\n};\n\ntemplate<typename T=double>\nconstexpr\
    \ T pi = T(3.1415926535897932385);\n\nauto area = [](auto c)\n{\n    using T =\
    \ typename decltype(c):value_type;\n    return pi<T> * c.radius * c.radius;\n\
    };\n```\n\nAlternatively:\n```cpp\ntemplate<typename T>\nusing f_type = T(*)(Circle<T>);\n\
    \ntemplate<typename T>\nf_type<T> area = [](Circle<T> c)\n{\n    return pi<T>\
    \ * c.radius * c.radius;\n};\n```\n\n### 0.13 Incremental improvement to integral_constant\n\
    \n#### Question13 Incremental improvement to integral_constant\n\nRevisit the\
    \ class template `is_arithmetic`:\n\n```cpp\ntemplate <class T>\nstruct is_arithmetic\n\
    \  :\n    integral_constant<\n      bool,\n      is_integral<T>::value ||\n  \
    \    is_floating_point<T>::value\n    > {};\n```\n\nBefore C++14, the typical\
    \ usage of such a class template was:\n`std::is_arithmetic<T>::value`\nor\n`static_cast<bool>(std::is_arithmetic<T>{})`\n\
    \nWhat was the increment to the class `integral_constant` to enable simplified\
    \ usage like `std::is_arithmetic<T>()()`\n\nThe following addition was made to\
    \ allow the template to serve as a source of compile-time objects:\n`constexpr\
    \ value_type operator() { return value; }`\n\nSo the final looked like:\n```cpp\n\
    template <class T, T v>\nstruct integral_constant\n{\n    static constexpr T value\
    \ = v;\n    using value_type = T;\n    using type = integral_constant<T, v>;\n\
    \    constexpr value_type operator() { return value; }\n    constexpr value_type\
    \ operator() { return value; } // C++14\n};\n```\n\n### 0.14 is_same musings\n\
    \n#### Question 14 is_same musing\n\nEnumerate different ways to use `is_same\
    \ < T,U >`.\n\n1. As a function object: `std::is_same<T, U>()`\n2. As compile\
    \ time evaluation by invoking the nested value_type: `std::is_same<T, U>::value`\n\
    3. By having a template alias as follows:\n   ```cpp\n   template<typename T,\
    \ typename U>\n   using is_same_v = typename std::is_same<T, U>::value;\n   ```\n\
    \   Now we can use it like `is_same_v<T, U>()`\n4. In C++11: `static_cast<bool>(std::is_same<T,\
    \ U>{})`\n5. Using variable template:\n   ```cpp\n   template<typename T, typename\
    \ U>\n   constexpr bool is_same = false;\n   template<typename T>\n   constexpr\
    \ bool is_same<T, T> = true;\n   ```\n   It can be used like a variable: `is_same<T,\
    \ U>`\n\nNote that in C++14, template aliases like the following are incorporated:\n\
    ```cpp\ntemplate <class T, class U>\nusing is_same_t = typename is_same<T, U>::type;\n\
    ```\n\n### 0.15 auto variable template and generic lambda\n\n#### Question 15\
    \ auto variable template and generic lambda\n\nIs this a valid code?\n\n```cpp\n\
    template<typename T>\nauto f = [](auto a, T b){ /**/ };\n\nint main()\n{\n   \
    \ f<int>(1, 2);\n}\n```\n\n#### SOLUTION OF QUESTION 15\nYes and it works as expected\
    \ in C++14 and clang 3.5 trunk.\n\n### 0.16 constexpr member functions and implicit\
    \ const\n\n#### Question 16 constexpr member functions and implicit const\n\n\
    Review the program :\n\n```cpp\n#include <iostream>\n\nstruct A\n{\n    constexpr\
    \ A() : n(3) {}\n    constexpr int getN() const { return n; }\n\n    int n;\n\
    };\n\nstruct B\n{\n    constexpr B() : a() {}\n    constexpr const A &getA() const\n\
    \    {\n        return a;\n    }\n    A &getA()\n    {\n        return a;\n  \
    \  }\n\n    A a;\n};\n\nint main()\n{\n    constexpr int n = B().getA().getN();\n\
    }\n```\n\n#### SOLUTION OF QUESTION 16\nCompiler error looks like:\n```\nconstexpr_implicit_const.cpp:In\
    \ function 'int main()':\nconstexpr_implicit_const.cpp:31:32:\nerror: call to\
    \ non-constexpr function 'A& B::getA()'\n    constexpr int n = B().getA().getN();\n\
    ```\n"
