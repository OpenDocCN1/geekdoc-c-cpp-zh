    \n所有完美转发（perfectly forwarding）函数调用运算符也是完美返回（perfectly returning），甚至是比较器也是如此。\n\
    \nC++14 将此扩展到其他函数对象，如 `plus`、`minus`、`equal_to` 等，允许我们编写如下代码：\n\n```cpp\n#include\
    \ <algorithm>\n#include <iostream>\n#include <iterator>\n#include <ostream>\n\
    #include <set>\n#include <string>\n#include <vector>\n\nint main() \n{ \n    std::vector<const\
    \ char *> v {\"3\", \"2\", \"1\"};\n\n    std::set<std::string, std::greater<>>\
    \ s {\"a\", \"aaa\", \"aa\"};\n\n    std::vector<std::string> dest;\n\n    std::transform(v.begin(),\
    \ v.end(), s.begin(), \n        std::back_inserter(dest), std::plus<>()); \n\n\
    \    for (const auto& elem : dest) \n    { \n        std::cout << elem << std::endl;\
    \ \n    } \n}\n```\n\n输出结果：\n```\n3aaa\n2aa\n1a\n```\n\nC++14 还提供了一个新增的 `std::bit_xor`：\n\
    \n```cpp\ntemplate <class T = void> struct bit_xor;\n\ntemplate <> struct bit_xor<void>\n\
    { \n    template <class T, class U> auto operator()(T&& t, U&& u) const \n   \
    \     -> decltype(std::forward<T>(t) ^ std::forward<U>(u)) \n    { \n        return\
    \ std::forward<T>(t) ^ std::forward<U>(u); \n    } \n};\n```\n\n敏锐的读者可能会注意到，选择默认模板参数对\
    \ `void` 的显式特化这种技术是因为其非侵入性。此外，在 C++11 中 `std::greater< void >` 是无效的，因为它会尝试形成对\
    \ `void` 的引用，而这是被禁止的。\n\n## # 0.79 交换工具类 (Exchange Utility)\n\n### 问题 79 交换工具类\n\
    \n开发一个工具类，它为提供的对象分配一个新值并返回旧值，同时满足：\n\n*   当类型定义了移动构造函数时，避免拷贝旧值\n*   接受任何类型作为新值，利用任何转换赋值运算符\n\
    *   如果新值是临时变量或已被移动的，则避免拷贝新值。\n\n#### 问题 79 的答案\n\nC++14 提供了 `std::exchange` 工具，满足了这些标准。\n\
    \n典型的实现如下：\n\n```cpp\ntemplate<class T1, class T2 = T1> \ninline T1 exchange(T1\
    \ &obj, T2 &&new_value) \n{ \n    T1 old_value = std::move(obj);\n\n    obj =\
    \ std::forward<T2>(new_value);\n\n    return old_value; \n}\n```\n\n典型的用法：\n\n\
    ```cpp\n#include <utility>\n#include <cassert>\n#include <string>\n\nint main()\
    \ \n{ \n    { \n        int v = 12; \n        assert( exchange(v, 23) == 12);\
    \ \n        assert( v == 23);\n\n        assert( exchange(v, 6.2) == 23); \n \
    \       assert( v == 7);\n\n        assert((exchange<int, float>(v, {})) == 7);\
    \ \n        assert( v == 0); \n    }\n\n    { \n        bool b = false; \n   \
    \     assert( !exchange(b, true)); \n        assert( b); \n    }\n\n    { \n \
    \       const std::string s1 (\"Hi!\"); \n        const std::string s2 (\"Yo!\"\
    );\n\n        std::string s3 = s1;\n\n        assert( exchange(s3, s2) == s1);\
    \ \n        assert( s3 == s2);\n\n        assert( exchange(s3, \"Hi!\") == s2);\
    \ \n        assert( s3 == s1);\n\n        s3 = s2;\n\n        assert( exchange(s3,\
    \ {}) == s2); \n        assert( s3.size() == 0);\n\n        s3 = s2;\n\n     \
    \   assert( exchange(s3, \"\") == s2); \n        assert( s3.size() == 0); \n \
    \   }\n\n    { \n        const unsigned val = 4; \n        int i = 1; \n     \
    \   auto prev = std::exchange(i, val);\n\n        static_assert( std::is_same<decltype(prev),\
    \ int>::value, \"return type\" ); \n        assert( i == 4); \n        assert(\
    \ prev == 1);\n\n        prev = std::exchange(i, 3);\n\n        assert( i == 3);\
    \ \n        assert( prev == 4); \n    }\n}\n```\n\n它与用户定义类型配合良好良好：\n\n```cpp\n\
    #include <utility>\n#include <cassert>\n\nstruct Defaultible\n{\n    Defaultible(int\
    \ i = 0) : value(i) {} \n    int value;\n};\n\nstruct From {};\n\nstruct To\n\
    {\n    int value = 0;\n\n    To() = default;\n    To(const To&) = default;\n \
    \   To(const From&) = delete;\n\n    To& operator=(const From&) \n    { \n   \
    \     value = 1; return *this; \n    }\n\n    To& operator=(From&&) \n    { \n\
    \        value = 2; return *this; \n    } \n};\n\nint main() \n{ \n    Defaultible\
    \ x = 1;\n\n    auto old = std::exchange(x, {});\n\n    assert( x.value == 0);\
    \ \n    assert( old.value == 1);\n\n    To t;\n    From f;\n\n    auto prev =\
    \ std::exchange(t, f);\n\n    assert( t.value == 1); \n    assert( prev.value\
    \ == 0);\n\n    prev = std::exchange(t, From{});\n\n    assert( t.value == 2);\n\
    }\n```\n"
