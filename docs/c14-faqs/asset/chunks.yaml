    \ as a suffix to the intended entities to enforce expressiveness?\n\n#### SOLUTION\
    \ OF QUESTION [27](#part0000_split_005.html_x1-29001r27)\n\nC++14 introduced appropriate\
    \ `chrono` literals to apply user-defined integer literals by overloading the\
    \ operator “”:\n\n```cpp\nconstexpr chrono::hours operator\"\" h(unsigned long\
    \ long hours);\nconstexpr chrono::minutes operator\"\" min(unsigned long long\
    \ minutes);\nconstexpr chrono::seconds operator\"\" s(unsigned long long sec);\n\
    constexpr chrono::milliseconds operator\"\" ms(unsigned long long msec);\nconstexpr\
    \ chrono::microseconds operator\"\" us(unsigned long long usec);\nconstexpr chrono::nanoseconds\
    \ operator\"\" ns(unsigned long long nsec);\n```\n\nThe suffixes `h`, `min`, `s`,\
    \ `ms`, `us`, `ns` denote duration values of the corresponding types `hours`,\
    \ `minutes`, `seconds`, `miliseconds`, `microseconds` and `nanoseconds` respectively\
    \ if they are applied to integral literals.\n\nNote that these time duration literals\
    \ reside in inline namespace `std::literals::chrono_literals` which are made available\
    \ in the namespace `std::chrono_literals` too.\n\n```cpp\n#include <chrono>\n\
    #include <type_traits>\n\nint main()\n{\n    using namespace std::chrono_literals;\n\
    \n    auto a = 10h;\n    auto b = 2min;\n    auto c = 20s;\n    auto d = 10ms;\n\
