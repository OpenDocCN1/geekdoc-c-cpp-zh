    error: variables defined in a constexpr function must  


          be initialized  


        int a;  


            ^  


    2 errors generated.


    ### 0.22 constexpr vs member function revisited


    ** Question 22 constexpr vs member function revisited


    Is this code valid in C++14 ?


    1struct S 


    2{ 


    3    constexpr const int &f(); 


    4    int &f(); 


    5};SOLUTION OF QUESTION [22](#part0000_split_004.html_x1-24001r22)


    It was valid in C++11, but no more valid in C++14 because constexpr non-static
    member functions are not implicitly const member functions anymore.


    Rationale behind this change was to allow constexpr member functions to mutate
    the object.'
