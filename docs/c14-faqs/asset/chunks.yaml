  trans: "\n\n# 智能指针开始\n调用自定义 operator new\n调用全局 operator new\n调用 A 的构造函数\n调用 A 的析构函数\n\
    调用自定义 operator delete\n调用全局 operator delete\n智能指针结束\n\n# 共享指针开始\n调用全局 operator\
    \ new\n调用 A 的构造函数\n调用 A 的析构函数\n调用全局 operator delete\n共享指针结束\n\n## 0.35 make_unique\
    \ 与值初始化\n\n### 问题 35 make_unique 与值初始化\n\n在给定零参数的情况下，`make_unique` 是调用 `new T()`\
    \ 进行值初始化（value-initialization），还是调用 `new T` 进行默认初始化（default-initialization）？\n\
    \n**问题 35 的解答 35**\n\n它会调用 `new T()` 进行值初始化，原因如下：\n\n*   与 `make_shared<T>()`\
    \ 的对称性，\n*   与函数调用 `make_unique<T>()` 中的空括号保持一致性，\n*   具有可预测性，因为这是变参数实现的预期结果，以及\n\
    *   安全性，因为获取 0 而不是获取垃圾值是安全的。“0 是垃圾值的严格子集”。\n\n偶尔，出于性能考虑，可能需要默认初始化。我们已经知道 `make_unique<T>()`\
    \ 比 `make_shared<T>()` 快，但通常情况下，动态内存分配加上相应释放的成本远高于单个对象值初始化的成本。\n\n## 0.36 make_unique\
    \ 与单对象\n\n### 问题 36 make_unique 与单对象\n\n阐述使用 `make_unique` 管理单对象动态内存的机制。\n\n**问题\
    \ 36 的解答 36**\n\n让我们来看一个简单的示例：\n\n```cpp\n#include <memory>\n#include <cassert>\n\
    \nstruct A\n{\n  A() : b(false) {}\n  A(int, double&, char&&, void*) : b(true)\
    \ {}\n  bool b;\n};\n\nint main()\n{\n  int i = 0;\n  double d = 0.0;\n  char\
    \ c = 0;\n\n  std::unique_ptr<A> a = std::make_unique<A>(i, d, std::move(c), nullptr);\n\
    \n  assert( a != nullptr );\n  assert( a->b );\n\n```\n  a = std::make_unique<A>();\n\
    \  assert( a != nullptr );\n  assert( !a->b );\n}\n```\n\n它如预期工作，所有的断 均为真。\n\n\
    后续示例也是如此：\n\n```cpp\n#include <memory>\n#include <string>\n#include <cassert>\n\
    \nint main()\n{\n  std::unique_ptr<int> p1 = std::make_unique<int>(100);\n  assert\
    \ ( *p1 == 100 );\n\n  p1 = std::make_unique<int>();\n  assert ( *p1 == 0 );\n\
    \n  std::unique_ptr<std::string> p2 = std::make_unique<std::string> (\"Chandra\"\
    );\n  assert ( *p2 == \"Chandra\" );\n\n  p2 = std::make_unique<std::string>();\n\
    \  assert( *p2 == \"\" );\n\n  p2 = std::make_unique<std::string>(10, 'c');\n\
    \  assert( *p2 == \"cccccccccc\" );\n}\n```\n\n为了理解这一机制，让我们回顾 `make_unique` 在管理单对象内存方面的实现。让我们回顾一下接口：\n\
    \n```cpp\ntemplate<class T, class... Args>\nunique_ptr<T> make_unique(Args&&...);\n\
    ```\n\n其实现如下：\n\n```cpp\ntemplate<typename T, typename... Args>\ninline unique_ptr<T>\
    \ make_unique(Args&&... args)\n{\n  return unique_ptr<T>(new T(std::forward<Args>(args)));\n\
    }\n```\n\n## 0.37 make_unique 与默认初始化\n\n### 问题 37 make_unique 与默认初始化\n\n在涉及管理单对象内存时，写出一个使用\
    \ `make_unique` 进行默认初始化的函数。\n\n**问题 37 的解答 37**\n\n```cpp\ntemplate<class T>\n\
    inline unique_ptr<T> make_unique_default()\n{\n  return unique_ptr<T>(new T);\n\
    }\n```\n\n为了更好地理解这一机制，让我们回顾初始化初始化：\n\n*   **值初始化（value initialization）**：\n  \
    \  *   如果 `T` 是标量类型，则执行值初始化。\n    *   如果 `T` 是类类型，则调用其无参数构造函数。\n*   **默认初始化（default\
    \ initialization）**：\n    *   如果 `T` 是标量类型，则将其初始化为零。\n    *   如果 `T` 是类类型，则调用其默认构造函数。\n\
    \n## 0.38 make_unique 与数组 T[n]\n\n### 问题 38 make_unique 与数组 T[n]\n\n以下程序的输出是什么？\n\
    \n```cpp\n#include <memory>\n#include <iostream>\n\nint main()\n{\n  auto up =\
    \ std::make_unique<int[5]>();\n\n  for(int i = 0; i < 5; ++i)\n  {\n    std::cout\
    \ << up[i] << \" \";\n  }\n  std::cout << std::endl;\n}\n```\n\n**问题 38 的解答 38**\n\
    \n该程序无法编译。使用 4.9 的错误如下：\n\n```\nmake_unique_array1.cpp:6:40:\nerror: use of deleted\
    \ function \n’typename std::_MakeUniq<_Tp>::__invalid_type \nstd::make_unique(Args&&...)\
    \ \n[with _Tp = int [5]; _Args = {};] \ntypename std::_MakeUniq<_Tp>::__invalid_type\
    \ \n= std::_MakeUniq<int [5]>::__invalid_type]’\n    auto up = std::make_unique<int[5]>();\n\
    \                            ^\nIn file included from \n/usr/local/include/c++/4.9.0/memory:81:0,\
    \ \n  from make_unique_array1.cpp:1: \n/usr/local/include/c++/4.9.0/bits/unique_ptr.h:773:5:\
    \ \nnote: declared here \n  make_unique(_Args&&...) = delete; \n  ^\n```\n\n"
- fmt: "\nThis error brings forth the point that `std::make_unique` is disabled for\
    \ arrays of known bound, `T == U[N]`:\n\n```cpp\ntemplate <class T, class... Args>\
    \ unspecified make_unique(Args&&...) = delete;\n```\n\nTo understand the return\
    \ type `unspecified` better, let us dive a bit into the implementation details:\n\
    \n```cpp\ntemplate<class T> \nstruct unique_type \n{ \n    typedef unique_ptr<T>\
    \ single_object; \n}; \n\ntemplate<class T, size_t N> \nstruct unique_type<T[N]>\
    \ \n{ \n    typedef void array_known_bound; \n}; \n\ntemplate<class T, class...\
    \ Args> \ntypename unique_type<T>::array_known_bound \n    make_unique(Args&&...)\
    \ = delete;\n```\n\nAlternatively, we can define `array_known_bound` to be an\
    \ empty struct instead of `typedef to void`.\n\n### Rationale for disabling T[n]\n\
    \nAs of now, `unique_ptr` doesn’t provide a partial specialization for `T[n]`.\n\
    \nHowever, users will be strongly tempted to write `make_unique< T[n] > ()`.\n\
    \n- Returning `unique_ptr< T[N] >` would select the primary template for single\
    \ objects, which is bizarre.\n- Returning `unique_ptr< T[] >` would be an exception\
    \ to the otherwise ironclad rule that `make_unique< something > ()` returns `unique_ptr<\
    \ something >`.\n\nTherefore, `T[N]` is disabled.\n\nAlternatively, `T[N]` can\
    \ be made ill-formed as well:\n\n```cpp\ntemplate<class T> struct Never_True :\
    \ std::false_type { }; \n\ntemplate<class T> \nstruct unique_type \n{ \n    typedef\
    \ unique_ptr<T> single_object; \n}; \n\ntemplate<class T, size_t N> struct unique_type<T[N]>\
    \ \n{ \n    static_assert(Never_True<T>::value, \"make_unique forbids T[N]. Please\
    \ use T[].\"); \n};\n```\n\n### 0.39 make_unique and array T[]\n\n#### Question\
    \ 39 make_unique and array T[]\n\nRewrite the previous program. Describe how `make_unique`\
    \ works with arrays of runtime length.\n\nSOLUTION OF QUESTION [39]\n\n```cpp\n\
    #include <memory> \n#include <iostream> \n\nint main() \n{ \n    auto up = std::make_unique<int[]>(5);\
    \ \n\n    for(int i = 0; i < 5; ++i) \n    { \n        std::cout << up[i] << \"\
    \ \"; \n    } \n    std::cout << std::endl; \n}\n```\n\nIt prints:\n0 0 0 0 0\n\
    \nImplementation may look like:\n\n```cpp\ntemplate<class T> \nstruct unique_type\
    \ \n{ \n    typedef unique_ptr<T> single_object; \n}; \n\ntemplate<class T> \n\
    struct unique_type<T[]> \n{ \n    typedef  unique_ptr<T[]> array_unknown_bound;\
    \ \n}; \n\ntemplate<class T> \ntypename unique_type<T>::array_unknown_bound \n\
    make_unique(size_t n) \n{ \n    typedef typename std::remove_extent<T>::type Up;\
    \ \n\n    return unique_ptr<T>(new Up[n]()); \n}\n```\n\nWe could drop the `typedef`\
    \ and just get one-liner for the function body:\n\n```cpp\ntemplate<class T>\n\
    typename unique_type<T>::array_unknown_bound\nmake_unique(size_t n) \n{ \n   \
    \ return unique_ptr<T>(new std::remove_extent<T>::type[n]()); \n}\n```\n\nLet\
    \ us put forth another example to illustrate its usage (it runs fine):\n\n```cpp\n\
    #include <memory> \n#include <assert> \n\nstruct A\n{ \n    A() : b(true) { }\
    \ \n    A(int) : b(false) { } \n    bool b; \n}; \n\nint main()\n{ \n    std::unique_ptr<A[]>\
    \ a = std::make_unique<A[]>(3); \n    assert(a != nullptr); \n    assert(a[0].b\
    \ && a[1].b && a[2].b); \n}\n```\n\nSimilarly, the following calls are invalid:\n\
    \n```cpp\nstruct A { };\n\n// no matching function\nauto p1 = std::make_unique<A[]>();\n\
    \n// no matching function\nauto p2 = std::make_unique<A[]>(1, 2); \n\n// deleted\n\
    auto p3 = std::make_unique<A[1]>();\nauto p4 = std::make_unique<A[1]>(1, 2);\n\
    ```\n\nTo summarize, `make_unique<T[]>(n)` invokes `new T[n]()`, requesting value-initialization.\n\
    \n### 0.40 make_unique and default initialization with T[]\n\n#### Question 40\
    \ make_unique and default initialization with T[]\n\nHow would you support default\
    \ initialization with `T[]` when called with `make_unique`?\n\nSOLUTION OF QUESTION\
    \ [40]\n\nIt is very simple. We just need to replace the call to `new T[n]()`\
    \ with `new T[n]`.\n\nTo elaborate, the code with value initialization is:\n\n\
    ```cpp\ntemplate<class T>\ntypename unique_type<T>::array_unknown_bound\nmake_unique(size_t\
    \ n) \n{ \n    return unique_ptr<T>(new std::remove_extent<T>::type[n]()); \n\
    }\n```\n\nWith this, the code below will value initialize the array, i.e., all\
