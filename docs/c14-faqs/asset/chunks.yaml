    \ <class T> using remove_cv_t = typename remove_cv<T>::type;`，`template <class\
    \ T> using add_const_t = typename add_const<T>::type;`，`template <class T> using\
    \ add_volatile_t = typename add_volatile<T>::type;`，`template <class T> using\
    \ add_cv_t = typename add_cv<T>::type;`\n\n- **引用修饰**：`template <class T> using\
    \ remove_reference_t = typename remove_reference<T>::type;`，`template <class T>\
