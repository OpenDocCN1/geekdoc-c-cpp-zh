    In C++14, auto type-specifier has been allowed to indicate a generic lambda parameter.


    Note that this generic lambda-expression containing statement:


    1auto mult = [](auto x, auto y) { return x * y; };


    might result in the creation of a closure type, and object that behaves similar
    to the struct below:


    1struct /* anonymous */ 


    2{ 


    3    template <typename T, typename U> 


    4    auto operator()(T x, U y) const 


    5    { return x * y; } 


    6} mult;


    If the initial type-specifier within the decl-specifier-seq of a lambda’s parameter
    declaration is auto, the expression creates a generic lambda closure.


    A generic closure type is just like a familiar C++11 closure type except that
    its function call operator is a member function template.


    In the operator’s parameters, each use of auto is replaced by a unique template
    type parameter, which is added to the operator’s template-parameter-list as was
    demonstrated.


