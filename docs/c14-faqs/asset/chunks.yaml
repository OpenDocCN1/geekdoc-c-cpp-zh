    \n#### 问题 31 类型转换别名\n简化化以下代码：\n```cpp\ntemplate< class T >\nusing reference_t\
    \ = typename conditional<\n    is_reference<T>::value,\n    T,\n    typename add_lvalue_reference<T>::type\n\
    >::type;\n```\n\n在模板上下文中，C++ 要求每个对元函数的调用都要带有前言 `typename` 关键字形式的语法开销，以及后置的 `::type`\
    \ 后缀，如代码段所示。\n\n幸运的是，C++14 通过为库的转换特性（Transformation Traits）提供一组模板别名消除了这种负担，例如：\n\
    ```cpp\ntemplate <bool b, class T, class F>\nusing conditional_t = typename conditional<b,\
    \ T, F>::type;\n\ntemplate <class T>\nusing add_lvalue_reference_t = typename\
    \ add_lvalue_reference<T>::type;\n```\n因此，代码可以简化为：\n```cpp\ntemplate< class T\
    \ >\nusing reference_t = conditional_t<\n    is_reference<T>::value,\n    T,\n\
    \    add_lvalue_reference_t\n>;\n```\n\n在此基础上，进一步的添加包括：\n\n- **const-volatile\
    \ 修饰**：`template <class T> using remove_const_t = typename remove_const<T>::type;`，`template\
