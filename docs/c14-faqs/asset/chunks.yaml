    \ s {\"a\", \"aaa\", \"aa\"};\n\n    std::vector<std::string> dest;\n\n    std::transform(v.begin(),\
    \ v.end(), s.begin(), \n        std::back_inserter(dest), std::plus<>()); \n\n\
    \    for (const auto& elem : dest) \n    { \n        std::cout << elem << std::endl;\
    \ \n    } \n}\n```\n\nIt prints:\n```\n3aaa\n2aa\n1a\n```\n\nC++14 also provides\
    \ a new addition `std::bit_xor`:\n\n```cpp\ntemplate <class T = void> struct bit_xor;\n\
    \ntemplate <> struct bit_xor<void>\n{ \n    template <class T, class U> auto operator()(T&&\
    \ t, U&& u) const \n        -> decltype(std::forward<T>(t) ^ std::forward<U>(u))\
    \ \n    { \n        return std::forward<T>(t) ^ std::forward<U>(u); \n    } \n\
    };\n```\n\nAstute reader may notice that the technique of using default template\
    \ arguments and explicit specializations for `void` was chosen for its non-intrusiveness.\
    \ Moreover `std::greater< void >` isn’t valid in C++11 because it would attempt\
    \ to form a reference to `void`, which is forbidden.\n\n## # 0.79 Exchange Utility\n\
    \n### Question 79 Exchange Utility\n\nDevelop an utility which assigns a new value\
    \ to the supplied object and returns the old value as well as:\n\n* avoids copying\
    \ the old value when that type defines a move constructor\n* accepts any type\
    \ as the new value, taking advantage of any converting assignment operator and\n\
    * avoids copying the new value if it’s a temporary or moved.\n\n#### SOLUTION\
    \ OF QUESTION 79\n\nC++14 provides an utility `std::exchange` which fulfills these\
    \ criteria.\n\nTypical implementation looks like:\n\n```cpp\ntemplate<class T1,\
    \ class T2 = T1> \ninline T1 exchange(T1 &obj, T2 &&new_value) \n{ \n    T1 old_value\
    \ = std::move(obj);\n\n    obj = std::forward<T2>(new_value);\n\n    return old_value;\
    \ \n}\n```\n\nTypical usage:\n\n```cpp\n#include <utility>\n#include <cassert>\n\
    #include <string>\n\nint main() \n{ \n    { \n        int v = 12; \n        assert(\
    \ exchange(v, 23) == 12); \n        assert( v == 23);\n\n        assert( exchange(v,\
    \ 6.2) == 23); \n        assert( v == 7);\n\n        assert((exchange<int, float>(v,\
    \ {})) == 7); \n        assert( v == 0); \n    }\n\n    { \n        bool b = false;\
    \ \n        assert( !exchange(b, true)); \n        assert( b); \n    }\n\n   \
    \ { \n        const std::string s1 (\"Hi!\"); \n        const std::string s2 (\"\
    Yo!\");\n\n        std::string s3 = s1;\n\n        assert( exchange(s3, s2) ==\
    \ s1); \n        assert( s3 == s2);\n\n        assert( exchange(s3, \"Hi!\") ==\
    \ s2); \n        assert( s3 == s1);\n\n        s3 = s2;\n\n        assert( exchange(s3,\
    \ {}) == s2); \n        assert( s3.size() == 0);\n\n        s3 = s2;\n\n     \
    \   assert( exchange(s3, \"\") == s2); \n        assert( s3.size() == 0); \n \
    \   }\n\n    { \n        const unsigned val = 4; \n        int i = 1; \n     \
    \   auto prev = std::exchange(i, val);\n\n        static_assert( std::is_same<decltype(prev),\
    \ int>::value, \"return type\" ); \n        assert( i == 4); \n        assert(\
    \ prev == 1);\n\n        prev = std::exchange(i, 3);\n\n        assert( i == 3);\
    \ \n        assert( prev == 4); \n    }\n}\n```\n\nIt works with user defined\
    \ types well:\n\n```cpp\n#include <utility>\n#include <cassert>\n\nstruct Defaultible\n\
    {\n    Defaultible(int i = 0) : value(i) {} \n    int value;\n};\n\nstruct From\
    \ {};\n\nstruct To\n{\n    int value = 0;\n\n    To() = default;\n    To(const\
    \ To&) = default;\n    To(const From&) = delete;\n\n    To& operator=(const From&)\
    \ \n    { \n        value = 1; return *this; \n    }\n\n    To& operator=(From&&)\
    \ \n    { \n        value = 2; return *this; \n    } \n};\n\nint main() \n{ \n\
    \    Defaultible x = 1;\n\n    auto old = std::exchange(x, {});\n\n    assert(\
    \ x.value == 0); \n    assert( old.value == 1);\n\n    To t;\n    From f;\n\n\
    \    auto prev = std::exchange(t, f);\n\n    assert( t.value == 1); \n    assert(\
    \ prev.value == 0);\n\n    prev = std::exchange(t, From{});\n\n    assert( t.value\
    \ == 2); \n    assert( prev.value == 1); \n}\n```\n\n`std::exchange` is capable\
    \ to deduce type of overloaded function:\n\n```cpp\n#include <utility>\n#include\
    \ <cassert>\n\nint f(int) { return 0; }\n\ndouble f(double) { return 0; }\n\n\
    int (*fp)(int);\n\nint main() \n{ \n    std::exchange(fp, &f); \n    assert( fp\
    \ != nullptr ); \n}\n```\n\nIt helps rewrite the implementation of reset member\
    \ function of `std::unique_ptr`.\n\nTypical implementation:\n\n```cpp\ntemplate<typename\
    \ T, typename D> \nvoid unique_ptr<T, D>::reset(pointer p = pointer()) \n{ \n\
    \    pointer old = ptr_;\n    ptr_ = p;\n    if (old) deleter_(old);\n}\n```\n\
    \nRecommended implementation:\n\n```cpp\ntemplate<typename T, typename D> \nvoid\
    \ unique_ptr<T, D>::reset(pointer p = pointer()) \n{ \n    if (pointer old = std::exchange(ptr_,\
    \ p)) deleter_(old);\n}\n```\n\n## # 0.80 Addressing By Type\n\n### Question 80\
    \ Addressing By Type\n\nSuppose there is a function `get_order` that returns `tuple<date,\
    \ map<item, int>>` representing an order placed by a company. Find a point on\
    \ a graph, where the x coordinate is the day number of the date and the y coordinate\
    \ is the total number of items in the order.\n\nAssume that there is a function\
    \ which computes the day number for a given date: `int days_from_epoch(date);`\n\
    And `item` is represented by:\n\n```cpp\nstruct item\n{\n    item(int i) : id(i)\
    \ {}\n    int id;\n};\n```\n\nIn order to add up all the order counts, let us\
    \ have a convenient alias for our map:\n\n```cpp\ntemplate<class Key, class Value>\
    \ \nusing map_t = std::map<Key, Value, std::function<bool(const Key&, const Key&)>>;\n\
    ```\n\nNow it becomes easy to supply desired comparators on the fly using lambda:\n\
    \n```cpp\nmap_t<item, int> orderitems { \n    [](const item& a, const item& b)\
    \ \n    { return a.id < b.id; } \n}; \norderitems = {{1, 10}, {2, 20}, {3, 30}};\n\
    ```\n\nAdding up all the order counts:\n\n```cpp\nint items_in_order(const map_t<item,\
    \ int> &orderitems) \n{ \n    return std::accumulate(orderitems.begin(), orderitems.end(),\
    \ 0, \n        [](int acc, std::pair<item, int> const& p) { return acc + p.second;\
    \ }); \n}\n```\n\nNote that the following snippet will print 60:\n`std::cout <<\
    \ items_in_order(orderitems);`\n\nOur final code would look like:\n\n```cpp\n\
    auto point = std::make_tuple(days_from_epoch, items_in_order)(get_order(/* ...\
    \ */));\n```\n\nThis is possible because C++14 allows tuples to be addressed by\
    \ type as well as by numerical index:\n\n```cpp\ntuple<string, string, int> t(\"\
    foo\", \"bar\", 7);\nint i = get<int>(t); // i == 7\nint j = get<2>(t); // Equivalent\
    \ to the above: j == 7\nstring s = get<string>(t); // Compile-time error. Ambiguous\n\
    \nconst tuple<int, const int, double, double> t(1, 2, 3.4, 5.6);\nconst int &i1\
    \ = get<int>(t); // OK. Not ambiguous. i1 == 1\nconst int &i2 = get<const int>(t);\
    \ // OK. Not ambiguous. i2 == 2\nconst double &d = get<double>(t); // ERROR. ill-formed\n\
    ```\n\nIt also allows writing code like:\n\n```cpp\nauto funcs = std::make_tuple(sqrt,\
    \ strlen, atof);\n\nauto vals = std::make_tuple(9, \"foo\", \"7.3\");\n```\n"
