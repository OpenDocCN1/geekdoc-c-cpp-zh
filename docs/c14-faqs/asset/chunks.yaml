    1 error generated.


    The lambda return type is auto, which is replaced by the trailing-return-type
    if provided and/or deduced from return statements.


    Thus, auto is allowed in trailing-return-type because there is the only way to
    specify that a lambda returns by a deduced reference type:


    1[]()->auto& { return f(); }


    For x1, return type is int.


    For x3, return type is int&.


    Deduction from an initializer-list is prohibited. Although a variable declared
    auto and initialized with a brace-enclosed initializer list gets a type of std::initializer_list,
    it is not allowed for a function return type because the underlying array is allocated
    on the stack, it would immediately leak on return, and any use of the return value
    would have undefined behavior.


    ### 0.65 decltype(auto)


    **** Question 65 decltype(auto)


    What is decltype(auto) ?


    SOLUTION OF QUESTION [65](#part0000_split_011.html_x1-71001r65)


    For an expression e, The type denoted by decltype(e) is defined as follows:


    *   if e is an unparenthesized id-expression or an unparenthesized class member
    access, decltype(e) is the type of the entity named by e. If there is no such
    entity, or if e names a set of overloaded functions, the program is ill-formed;


    *   otherwise, if e is an xvalue, decltype(e) is T&&, where T is the type of e;


    *   otherwise, if e is an lvalue, decltype(e) is T&, where T is the type of e;


    *   otherwise, decltype(e) is the type of e.


    1const int&& foo(); 


    2int i; 


    3struct A { double x; }; 


    4const A* a = new A(); 


    5decltype(foo()) x1 = i;   // type is const int&&6decltype(i) x2;           // type is int7decltype(a->x) x3;        // type is double8decltype((a->x)) x4 = x3; // type is const double&


    The auto and decltype(auto) type-specifiers designate a placeholder type that
    will be replaced later, either by deduction from an initializer or by explicit
    specification with a trailing-return-type. If the function declarator includes
    a trailing-return-type, that specifies the declared return type of the function.
    If the declared return type of the function contains a placeholder type, the return
    type of the function is deduced from return statements in the body of the function,
    if any.


    The type of a variable declared using auto or decltype(auto) is deduced from its
    initializer. This use is allowed when declaring variables in a block, in namespace
    scope, and in a for-init-statement.


    1auto x = 5;                 // OK: x has type int 


    2const auto *v = &x, u = 6;  // OK: v has type const int*, u has type const int 


    3static auto y = 0.0;        // OK: y has type double 


    4auto int r;                 // error: auto is not a storage-class-specifier 


    5auto f() -> int;             // OK: f returns int 


    6auto g() { return 0.0; }     // OK: g returns double 


    7auto h();                    // OK, h’s return type will be deduced when it is defined 


    8 


    9auto x1 = { 1, 2 };    // decltype(x1) is std::initializer_list<int> 


    10auto x2 = { 1, 2.0 };  // error: cannot deduce element type


    If the placeholder is the decltype(auto) type-specifier, the declared type of
    the variable or return type of the function shall be the placeholder alone:


    1int i; 


    2int&& f(); 


    3auto           x3a = i;        // decltype(x3a) is int 


    4decltype(auto) x3d = i;        // decltype(x3d) is int 


    5auto           x4a = (i);      // decltype(x4a) is int 


    6decltype(auto) x4d = (i);      // decltype(x4d) is int& 


    7auto           x5a = f();      // decltype(x5a) is int 


    8decltype(auto) x5d = f();      // decltype(x5d) is int&& 


    9auto           x6a = { 1, 2 }; // decltype(x6a) is std::initializer_list<int> 


    10decltype(auto) x6d = { 1, 2 }; // error, { 1, 2 } is not an expression 


    11auto          *x7a = &i;       // decltype(x7a) is int* 


    12decltype(auto)*x7d = &i;       // error, declared type is not plain decltype(auto)'
