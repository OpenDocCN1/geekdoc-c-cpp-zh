  raw: '### 0.66 return type deduction for function templates


    *** Question 66 return type deduction for function templates


    What is the rule of deduction for return types in case of function templates with
    a placeholder ?


    SOLUTION OF QUESTION [66](#part0000_split_011.html_x1-72001r66)


    Return type deduction for a function template with a placeholder in its declared
    type occurs when the definition is instantiated even if the function body contains
    a return statement with a non-type-dependent operand.


    So any use of a specialization of the function template will cause an implicit
    instantiation. Any errors that arise from this instantiation are not in the immediate
    context of the function type, and can result in the program being ill-formed.


    1    template <class T> auto f(T t) { return t; } // return type deduced at instantiation time 


    2    typedef decltype(f(1)) fint_t; // instantiates f<int> to deduce return type 


    3    template<class T> auto f(T* t) { return *t; } 


    4    void g() { int (*p)(int*) = &f; } // instantiates both ’f’s to determine return types, chooses second


    Redeclarations or specializations of a function or function template with a declared
    return type that uses a placeholder type shall also use that placeholder, not
    a deduced type.


    1    auto f(); 


    2    auto f() { return 42; } // return type is int 


    3    auto f(); // OK 


    4    int f();  // error, cannot be overloaded with auto f() 


    5    decltype(auto) f(); // error, auto and decltype(auto) don’t match 


    6 


    7    template <typename T> auto g(T t) { return t; } // #1 


    8    template auto g(int);      // OK, return type is int 


    9    template char g(char);     // error, no matching template 


    10    template<> auto g(double); // OK, forward declaration with unknown return type 


    11 


    12    template <class T> T g(T t) { return t; } // OK, not functionally equivalent to #1 


    13    template char g(char);     // OK, now there is a matching template 


    14    template auto g(float);    // still matches #1 


    15 


    16    void h() { return g(42); } // error, ambiguous 


    17 


    18    template <typename T> struct A { 


    19      friend T frf(T); 


    20    }; 


    21    auto frf(int i) { return i; } // not a friend of A<int>


    ### 0.67 explicit instantiation and auto


    *** Question 67 explicit instantiation and auto


    Review the code below:


    1template <typename T> auto f(T t) { return t; } 


    2extern template auto f(int); 


    3int (*p)(int) = f;SOLUTION OF QUESTION [67](#part0000_split_011.html_x1-73001r67)


    An explicit instantiation declaration does not cause the instantiation of an entity
    declared using a placeholder type, but it also does not prevent that entity from
    being instantiated as needed to determine its type.


    Hence the line below does not instantiate f < int >.


    1extern template auto f(int);


    Whereas the next line instantiates f < int > to determine its return type, but
    an explicit instantiation definition is still required somewhere in the program:


    1int (*p)(int) = f;


    Like constexpr functions, it can be necessary to instantiate an auto function
    template even if it is not odr-used.


    1template <class T> auto f(T t) { return t; } // return type deduced at instantiation time 


    2typedef decltype(f(1)) fint_t; // must instantiate f<int> to deduce return type


    Kindly note that as far as SFINAE is concerned, since the return type is deduced
    by instantiating the template, if the instantiation is ill-formed, this causes
    an error rather than a substitution failure. This allows an auto function to return
    a lambda, which is not possible using the decltype(returned expression) pattern.


    The declarator of a variable declared with auto is not limited in the form of
    the declarator; the same should be true of a function with deduced return type.
    In particular, this is the only way to deduce return by reference:


    1    template <class T> struct A { static T t; }; 


    2    template <class T> auto& f() { return A::t; } // returns by reference


    To allow this, we should use the same auto deduction rules for function and lambda
    return type that we do for auto variables.


    Such a function must have a return statement, however, since there is no way to
    get void from auto&.


    1    auto& f() { } // error, no return statement


    ### 0.68 return type deduction and virtual


    ** Question 68 return type deduction and virtual


    How return type deduction works with virtual functions ?


    SOLUTION OF QUESTION [68](#part0000_split_011.html_x1-74001r68)


    A function declared with a return type that uses a placeholder type cannot be
    virtual.


    It would be possible to allow return type deduction for virtual functions, but
    that would complicate both override checking and vtable layout, so it seems preferable
    to prohibit this.


    As a side note, study the illegal code below:


    1auto h() { return h(); } // error, return type of h is unknown


    ### 0.69 deduce return type


    ** Question 69 deduce return type


    What are the return types of the following functions f1 and g1?


    1std::string f(); 


    2std::string& g(); 


    3 


    4decltype(auto) f1() 


    5{ 


    6    auto str = f(); 


    7    return str; 


    8} 


    9 


    10decltype(auto) g1() 


    11{ 


    12    auto str = g(); 


    13    return(str); 


    14}SOLUTION OF QUESTION [69](#part0000_split_011.html_x1-75001r69)


    f1 returns std::string.


    g1 returns std :: string&, which is a reference to the local variable str.


    ### 0.70 generalized lambda capture


    *** Question 70 generalized lambda capture


    What is the output of the program below ?


    Program 9: Generalized lambda captures 


    1#include <iostream> 


    2 


    3int main() 


    4{ 


    5    int x = 4; 


    6 


    7    auto y = [&r = x, x = x+1]() 


    8             { 


    9                 r += 2; 


    10                 std::cout << "r is : " << r << std::endl; 


    11                 return x+2; 


    12             }(); 


    13 


    14    std::cout << "y is : " << y << std::endl; 


    15}SOLUTION OF QUESTION [70](#part0000_split_011.html_x1-76001r70)


    It prints:


    r is : 6  


    y is : 7


    In C++14, lambda capture has been generalized to define arbitrary new local variables
    in the lambda object because each capture creates a new type-deduced local variable
    inside the lambda.


    This enables an init-capture like


    1x = std::move(x);


    the second x must bind to a declaration in the surrounding context.


    ### 0.71 generic lambda and product vector


    *** Question 71 generic lambda and product vector


    Write a generic code to multiply all the elements of a given vector. Generalize
    it to apply any operation on a vector of any type.


    SOLUTION OF QUESTION [71](#part0000_split_011.html_x1-77001r71)


    Before C++11, we could write the code for multiplying the contents of a vector
