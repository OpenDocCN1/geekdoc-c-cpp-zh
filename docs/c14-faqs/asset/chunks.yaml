    of the basics of `C++98` and `C++03` and wants to expand her horizon to latest
    and greatest in `C++14` (aka `C++1y`). The problems are marked on a scale of one
    `*` (simplest) to five stars `*****` (hardest).


    Forthcoming volumes will strengthen this particular approach spanning various
    areas of `C++`.


