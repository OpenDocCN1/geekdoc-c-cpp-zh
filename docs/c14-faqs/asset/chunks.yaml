    \ = std::find(std::begin(v), std::end(v), 3);\n\nif (first3 != std::end(v))\n\
    \    std::cout << \"First 3 in v = \" << *first3 << std::endl;\n\n// 应用于原生数组：\n\
    const char *names[] {\"Chan\", \"Chandra\", \"Shekhar\"};\n\nauto firstGT4 = std::find_if(std::begin(names),\
    \ std::end(names), strLenGT4);\n\nif (firstGT4 != std::end(names))\n    std::cout\
    \ << \"First long name: \" << *firstGT4 << std::endl;\n```\n\n在 C++14 中，存在非成员\
    \ `begin`/`end` 变体：\n- 返回 `const_iterators`：`cbegin`/`cend`\n- 返回 `reverse_iterators`：`rbegin`/`rend`\n\
    - 返回 `const_reverse_iterators`：`crbegin`/`crend`\n\n这使得我们可以编写如下代码：\n```cpp\ntemplate\
    \ <typename Container>\nvoid process_container(Container &c) // 注意：没有 const\n\
    {\n    typename C::const_iterator ci = std::begin(c); // C++11\n    auto ci2 =\
    \ std::cbegin(c); // C++14\n    ...\n}\n```\n\n哦，我们忽略了与空指针表示相关的问题。在旧的 C++ 中，空指针的概念可能是混惑和歧义的来源。`NULL`\
    \ 是如何定义的？`0` 指的是 `int` 还是指针？\n\n```cpp\nvoid f(long) { cout << \"f(long)\\n\"\
    ; }\nvoid f(char *) { cout << \"f(char *)\\n\";}\n\nint main()\n{\n    f(0L);\
    \ // 调用 f(long)\n    f(0); // 错误：歧义！\n    f(static_cast<char *>(0)); // 正确\n}\n\
    ```\n\n在 C++14 中，我们可以使用 `nullptr` 代替 `0` 来帮助消除歧义：\n```cpp\nvoid f(long) { cout\
    \ << \"f(long)\\n\"; }\nvoid f(char *) { cout << \"f(char *)\\n\";}\nint main()\n\
    {\n    f(0L); // 像以前一样，调用 f(long)\n    f(nullptr); // 好的，调用 f(char *)\n    f(0);\
    \ // 仍然存在歧义\n}\n```\n\n所以我们可以重写 C++11 中的函数 `findNull` 为：\n```cpp\ntemplate<typename\
    \ Cont>\nauto findNull(const Cont &c)\n    -> decltype(begin(c))\n{\n    auto\
    \ it = begin(c);\n    for (; it != end(c); ++it)\n        if (*it == nullptr)\n\
    \            break;\n    return it;\n}\n```\n\n在 C++14 中，支持泛化返回类型，允许从表达式（或多个表达式）推导出返回类型：\n\
    ```cpp\ntemplate<typename Cont>\nauto findNull(const Cont &c) // 我们不需要 decltype!\n\
    {\n    auto it = begin(c);\n    for (; it != end(c); ++it)\n    if (*it == nullptr)\n\
    \        break;\n    return it;\n}\n```\n\n在 C++14 中，函数类型推导实际上有两种方法：\n1. 声明返回\
    \ `auto` 的函数（或带有修饰的 `auto`）：采用模板推导，丢弃表达式类型中的引用和 `volatile`（当 `auto` 被修饰时可以重新加回）。\n\
    2. 声明返回 `decltype(auto)` 的函数：无修饰，采用 `decltype` 推导，表达式的实际类型即为返回类型。\n\n### 0. 泛型函数对象\n\
    \n对一个整数向量进行降序排序。将该逻辑分别扩展到无符号 32 位整数向量、64 位整数向量和 `const char` 向量。\n\n听起来像是一个轻而易的操作。我们可以如下使用函数对象\
    \ `std::greater`：\n```cpp\n#include <functional>\n#include <vector>\n#include\
    \ <assert>\n\nint main()\n{\n    std::vector<int> v {5, 1, 6, 3, 4, 2};\n    std::sort(v.begin(),\
    \ v.end(), std::greater<int>());\n    assert( v == std::vector<int>({6, 5, 4,\
    \ 3, 2, 1}));\n}\n```\n\n快速查看 `std::greater` 的内部实现：\n```cpp\ntemplate <class T>\n\
    struct greater : binary_function<T, T, bool>\n{\n    bool operator()(const T &x,\
    \ const T& y) const {return x > y;}\n};\n```\n\n典型用法：\n```cpp\ntypedef std::greater<int>\
    \ F;\nconst F f = F();\n\nstatic_assert((std::is_base_of<std::binary_function<int,\
    \ int, bool>, F>::value), \"\");\n\nassert(!f(36, 36));\nassert(f(36, 6));\nassert(!f(6,\
    \ 36));\n```\n\n我们也可以利用 Lambda 函数：\n```cpp\n#include <vector>\n#include <algorithm>\n\
    #include <cassert>\n\nint main()\n{\n    std::vector<int> v {5, 1, 6, 3, 4, 2};\n\
    \    std::sort(v.begin(), v.end(), [](int a, int b) { return a > b; });\n    assert(\
    \ v == std::vector<int>({6, 5, 4, 3, 2, 1}));\n}\n```\n（注：此处由于原文中 Lambda 示例不完整，翻译时保持了逻辑对应）\n\
    \n"
