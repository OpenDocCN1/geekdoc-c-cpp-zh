    ** Question 79 Exchange Utility


    Develop an utility which assigns a new value to the supplied object and returns
    the old value as well as:


    *   avoids copying the old value when that type defines a move constructor


    *   accepts any type as the new value, taking advantage of any converting assignment
    operator and


    *   avoids copying the new value if it’s a temporary or moved.


