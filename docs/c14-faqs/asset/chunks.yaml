    \ 3, 7.3)\n```\n\nas well as:\n\n```cpp\nauto funcs = \n    make_tuple(bind(std::multiplies<int,\
    \ int>, _1, _1), \n               function(&string::size), \n               [](char\
    \ const *cp)->double \n               { \n                   istringstream is(cp);\
    \ \n                   double d; \n                   is >> d; \n            \
    \       return d; \n               }); \n```\n\n```cpp\nauto vals = make_tuple(9,\
    \ \"foo\", \"7.3\"); \nauto result = funcs(vals); // result is tuple<int, size_t,\
    \ double>(81, 3, 7.3)\n```\n\n## 0.81 Quoted manipulators\n\n### Question 81:\
    \ Quoted manipulators\n\nWhat is the output of the program below? Modify the program\
    \ if needed to rectify issues if any.\n\n```cpp\n#include <sstream> \n#include\
    \ <iostream> \n\nint main() \n{ \n    std::stringstream ss; \n    std::string\
    \ original = \"Chandra Shekhar Kumar\"; \n\n    std::string round_trip; \n\n \
    \   ss << original; \n    ss >> round_trip; \n\n    std::cout << original << std::endl;\
    \ \n    std::cout << round_trip << std::endl; \n}\n```\n\n### Solution of Question\
    \ 81\n\nIt prints:\n```\nChandra Shekhar Kumar\nChandra\n```\n\nThe output is\
    \ not what we expected and it looks like that the standard library stream I/O\
    \ has a problem with embedded spaces in strings.\n\nFortunately, C++14 introduced\
    \ `quoted` stream I/O manipulator which places delimiters, defaulted to double-quote\
    \ (`\"`\"), around strings on output, and strips off the delimiters on input.\
    \ This ensures strings with embedded white space round-trip as desired.\n\nSo\
    \ the modified program meeting our expectation is as follows:\n\n```cpp\n#include\
    \ <sstream> \n#include <iomanip> \n#include <iostream> \n\nint main() \n{ \n \
    \   std::stringstream ss; \n    std::string original = \"Chandra Shekhar Kumar\"\
    ; \n\n    std::string round_trip; \n\n    ss << quoted(original); \n    ss >>\
    \ quoted(round_trip); \n\n    std::cout << original << std::endl; \n    std::cout\
    \ << round_trip << std::endl; \n}\n```\n\n`quoted` manipulators provide string\
    \ insertion and extraction of quoted strings and ensures that the content of a\
    \ string with embedded spaces remains unchanged if inserted and then extracted\
    \ via stream/O.\n\n```cpp\ntemplate<typename CharT>\ninline auto quoted(const\
    \ CharT *s, CharT delim = '\"', CharT escape = '\\\\'); \n\ntemplate<typename\
    \ CharT, typename Traits, typename Alloc>\ninline auto quoted(const basic_string<CharT,\
    \ Traits, Alloc>& s, CharT delim = '\"', CharT escape = '\\\\');\n```\n\nIf `out`\
    \ is an instance of `basic_ostream` with member type `char_type` as `CharT`, then\
    \ the expression `out << quoted(s, delim, escape)` behaves if it inserts the following\
    \ characters into `out` using character inserter templates:\n- `delim`.\n- Each\
    \ character in `s`. If the character to be output is equal to `escape` or `delim`,\
    \ as determined by `==`, first output `escape`. `delim`.\n\nType of the following\
    \ expression `out << quoted(s, delim, escape)` is `std::basic_ostream<CharT, Traits>&`\
    \ and value `out`.\n\n```cpp\ntemplate<typename CharT, typename Traits, typename\
    \ Alloc>\ninline auto quoted(basic_string<CharT, Traits, Alloc>& s, CharT delim\
    \ = '\"', CharT escape = '\\\\');\n```\n\nIf `in` is an instance of `basic_istream`\
    \ with member type `char_type` as `CharT`, then the expression `in >> quoted(s,\
    \ delim, escape)` behaves if it extracts the following characters from `in` using\
    \ `basic_istream::operator>>`:\n- If the first character extracted is equal to\
    \ `delim`, as determined by `==`, then:\n    - Turn off the `skipws` flag.\n \
    \   - `s.clear()`.\n    - Until an unescaped `delim` is reached or `!in`, extract\
    \ characters from `in` and append them to `s`, except that if an escape is reached,\
    \ ignore it and append the next character to `s`.\n    - Discard the final `delim`\
    \ character.\n    - Restore the `skipws` flag to its original value.\n- Otherwise,\
    \ `in >> s`.\n\nIf `out` is an instance of `basic_ostream` with member type `char_type`\
    \ as `CharT`, then the expression `out << quoted(s, delim, escape)` behaves as\
    \ specified for the `const basic_string<charT, traits, Allocator>&` overload of\
    \ the `quoted` function.\n\n#### Implementation of Quoted Manipulators\n\nTypical\
    \ implementation may look like:\n\n**Program 18: Structure for delimited strings**\n\
    ```cpp\ntemplate<typename String, typename CharT>\nstruct Quotedstring\n{\n  \
    \  static_assert(std::is_reference<String>::value || std::is_pointer<String>::value,\
    \ \"String must be pointer or reference\");\n    Quotedstring(String str, CharT\
    \ del, CharT esc) : M_string(str), M_delim{del}, M_escape{esc} {}\n    Quotedstring&\
    \ operator=(Quotedstring&) = delete;\n    String M_string;\n    CharT M_delim;\n\
    \    CharT M_escape;\n};\n```\nNote that the left and right delimiters can be\
    \ different.\n\n**Program 19: Inserter for delimited strings**\n```cpp\ntemplate<typename\
    \ CharT, typename Traits>\nauto& operator<<(std::basic_ostream<CharT, Traits>&\
    \ os, const Quotedstring<const CharT*, CharT>& str)\n{\n    os << str.M_delim;\n\
    \    for (const CharT* c = str.M_string; *c; ++c) {\n        if (*c == str.M_delim\
    \ || *c == str.M_escape)\n            os << str.M_escape;\n        os << *c;\n\
    \    }\n    os << str.M_delim;\n    return os;\n}\n\ntemplate<typename CharT,\
    \ typename Traits, typename String>\nauto& operator<<(std::basic_ostream<CharT,\
    \ Traits>& os, const Quotedstring<const CharT*, CharT>& str)\n{\n    os << str.M_delim;\n\
    \    for (auto &c = str.M_string) {\n        if (c == str.M_delim || c == str.M_escape)\n\
    \            os << str.M_escape;\n        os << c;\n    }\n    os << str.M_delim;\n\
    \    return os;\n}\n```\n\n**Program 20: Extractor for delimited strings**\n```cpp\n\
    template<typename CharT, typename Traits, typename Alloc>\nauto& operator>>(std::basic_istream<CharT,\
    \ Traits>& is, const Quotedstring<basic_string<CharT, Traits, Alloc>&, CharT>&\
    \ str)\n{\n    CharT c;\n    is >> c;\n    if (!is.good())\n        return is;\n\
    \    if (c != str.M_delim) {\n        is.get();\n        is >> str.M_string;\n\
    \        return is;\n    }\n    str.M_string.clear();\n    std::ios_base::fmtflags\
    \ flags = is.flags() & ~std::ios_base::skipws;\n    do {\n        is >> c;\n \
    \       if (!is.good())\n            break;\n        if (c == str.M_escape) {\n\
    \            is >> c;\n            if (!is.good()) break;\n        } else if (c\
    \ == str.M_delim)\n            break;\n        str.M_string += c;\n    } while\
    \ (true);\n    is.setf(flags);\n    return is;\n}\n\ntemplate<typename CharT>\n\
    inline auto quoted(const CharT* s, CharT delim = '\"', CharT escape = '\\\\')\
    \ { return Quotedstring<const CharT*, CharT>(s, delim, escape); }\n\ntemplate<typename\
    \ CharT, typename Traits, typename Alloc>\ninline auto quoted(const basic_string<CharT,\
    \ Traits, Alloc>& s, CharT delim = '\"', CharT escape = '\\\\') { return Quotedstring<const\
    \ basic_string<CharT, Traits, Alloc>&, CharT>(s, delim, escape); }\n\ntemplate<typename\
    \ CharT, typename Traits, typename Alloc>\ninline auto quoted(basic_string<CharT,\
    \ Traits, Alloc>& s, CharT delim = '\"', CharT escape = '\\\\') { return Quotedstring<basic_string<CharT,\
    \ Traits, Alloc>&, CharT>(s, delim, escape); }\n```\n\nIt allows to write code\
    \ like:\n"
