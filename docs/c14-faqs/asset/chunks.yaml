    \n### 0.32 unique_ptr vs make_unique as function argument\n\n*** Question32 unique_ptr\
    \ vs make_unique as function argument\n\nReview the code below :\n\n1#include <iostream> \n\
    \n2 \n\n3template<typename T1, typename T2> \n\n4void f(T1 * a, T2 * b) \n\n5{} \n\
