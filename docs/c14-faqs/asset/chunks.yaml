    \   there is no third type to which both can be converted.\n\nThis case also arises\
    \ when the given list of types is empty.\n\ntemplate< class, class... > \n\nstruct ctype { };\n\
    \nLet us specialize this template to handle the case of a single type:\n\ntemplate< class T > \n\
    \nstruct ctype<void,T> \n\n{ \n\n    using type = decay_t<T>; \n\n};\n\nThe second\
    \ specialization handles the general case of two or more types:\n\ntemplate< class T, class U, class... V > \n\
    \nstruct ctype<void_t<common_type_helper<T,U>>, T, U, V...> \n\n    : \n\nctype<void, common_type_helper<T,U>, V...> { };\n\
    \nThis specialization will be viable only so long as the first two types in the\
    \ argument list of types have a common type as defined by common_type_helper.\n\
    \nIf the first two types have no common type, both specializations will be nonviable\
    \ and so the primary template will be selected to terminate the recursion. Otherwise,\
    \ once the list has been recursively pairwise reduced to a single type, the first\
    \ specialization will be selected.\n\ntemplate <class... T> \n\nstruct common_type : ctype<void, T...> {};\n\
    \n*   If sizeof...(T) is zero, there shall be no member type.\n\n*   If sizeof...(T)\
    \ is one, let T0 denote the sole type comprising T. The member typedef type shall\
    \ denote the same type asdecay_t<T0>\n\n*   If sizeof...(T) is greater than one,\
    \ let T1, T2, and R respectively denote the first, second, and (pack of) remaining\
    \ types comprising T. sizeof...(R) may be zero. Finally, let C denote the type,\
    \ if any, of an unevaluated conditional expression whose first operand is an arbitrary\
    \ value of type bool, whose second operand is an xvalue of type T1, and whose\
    \ third operand is an xvalue of type T2. If there is such a type C, the member\
    \ typedef type shall denote the same type, if any, as\n\n    common_type_t<C,R...>\n\
    \n    Otherwise, there shall be no member type.\n\n### 0.58 Contextual Conversion\n\
    \n*** Question 58 Contextual Conversion\n\nImplement a class template that wraps\
    \ a value of arithmetic or pointer type T, ensuring that the wrapped value will\
    \ by default be initialized with T’s zero value.\n\nDemonstrate its use in contexts\
    \ like deletion of a pointer to a dynamic instance of this class and switch-case\
    \ scenarios with integer instances."
