    assert (quote (\"Hi\", '!') == \"!Hi!\");\nassert (quote (\"Hi!\", '!') == R\"\
    (!Hi\\!!)\");\nassert (quote (\"\") == \"\\\"\\\"\");\nassert (quote (\"a\") ==\
    \ \"\\\"a\\\"\");\n```\n\n### 0.82 Null Iterator\n\n**Question 82: Null Iterator**\n\
    \nDesign a class hierarchy that provides iterator access to a member vector, along\
    \ with other features. The base class does not actually have a vector, but some\
    \ derived classes do.\n\n**SOLUTION OF QUESTION [82](#part0000_split_014.html_x1-91001r82)**\n\
    \nTypical Interface may look like:\n\n```cpp\nstruct A\n{\n    virtual std::vector<int>::const_iterator\
    \ begin();\n    virtual std::vector<int>::const_iterator end();\n};\n\nstruct\
    \ B : A\n{\n    virtual std::vector<int>::const_iterator begin();\n    virtual\
    \ std::vector<int>::const_iterator end();\n\n    std::vector<int> v;\n};\n```\n\
    \nIt is not difficult to complete the design of derived class B:\n\n```cpp\nstruct\
    \ B : A\n{\n    explicit B(std::vector<int> & _v) : v(_v) {}\n\n    virtual std::vector<int>::const_iterator\
    \ begin()\n    {\n        return v.begin();\n    }\n\n    virtual std::vector<int>::const_iterator\
    \ end()\n    {\n        return v.end();\n    }\n\n    std::vector<int> v;\n};\n\
    ```\n\nBut how to do something similar with the base class A because there is\
    \ no vector to point to. So the real challenge is to create a valid iterator without\
    \ a container instance.\n\nC++14 provides support for null iterators by allowing\
    \ value-initialized forward iterators to be compared, and ensuring that all value-initialized\
    \ iterators for a particular container type compare equal. The result of comparing\
    \ a value-initialized iterator to an iterator with a non-singular value is undefined.\n\
    \nSo our base class looks like:\n\n```cpp\nstruct A\n{\n    A() {}\n    virtual\
    \ std::vector<int>::const_iterator begin()\n    {\n        return {};\n    }\n\
    \n    virtual std::vector<int>::const_iterator end()\n    {\n        return {};\n\
    \    }\n};\n```\n\nIt allows writing code like:\n\n```cpp\n#include <vector>\n\
    #include <cassert>\n\nint main()\n{\n    typedef std::vector<int> C;\n    C::iterator\
    \ ii1{}, ii2{};\n    C::iterator ii4 = ii1;\n    C::const_iterator cii{};\n  \
    \  assert (ii1 == ii2);\n    assert (ii1 == ii4);\n\n    assert (!(ii1 != ii2));\n\
    \    assert (ii1 == cii);\n    assert (cii == ii1);\n    assert (!(ii1 != cii));\n\
    \    assert (!(ii1 < cii));\n    assert (!(cii < ii1));\n    assert (ii1 <= cii);\n\
    \    assert (cii <= ii1);\n    assert (!(ii1 > cii));\n    assert (!(cii > ii1));\n\
    \    assert (cii - ii1 == 0);\n    assert (ii1 - cii == 0);\n}\n```\n\n### 0.83\
    \ std::move is rvalue_cast\n\n**Question 83: std::move is rvalue_cast**\n\nExplain\
    \ how `std::move` works and provide implementation details.\n\n**SOLUTION OF QUESTION\
    \ [83](#part0000_split_014.html_x1-92001r83)**\n\n`std::move` doesn’t guarantee\
    \ move, it unconditionally casts to an rvalue, so it can be treated as a rvalue_cast.\n\
    \nA possible implementation may look like:\n\n```cpp\ntemplate<typename T>\nconstexpr\
    \ std::remove_reference<T>::type&&\nmove(T&& t) noexcept\n{\n    return static_cast<typename\
    \ std::remove_reference<T>::type&&>(t);\n}\n```\n\nIn C++14, it can be simplified\
    \ further to:\n\n```cpp\ntemplate<typename T>\ndecltype(auto)\nmove(T&& t) noexcept\n\
    {\n    return static_cast<std::remove_reference_t<T>>&&>(t);\n}\n```\n\nIt is\
    \ recommended not to declare objects as `const` with `std::move`.\n\nLet us take\
    \ an example:\n\n```cpp\nA a;\nstd::move(a); // a is lvalue\n```\n\nRecall that\
    \ An lvalue is an expression with which we can use `&` operator. An rvalue is\
    \ an expression that is not an lvalue.\n\nObjects that are declared as rvalue\
    \ reference, `&&`, can be lvalues or rvalues. If it has a name, then it is an\
    \ lvalue. Otherwise, it is an rvalue.\n\nReference collapsing: If a typedef-name\
    \ or a decltype-specifier denotes a type `TR` that is a reference to a type `T`,\
    \ an attempt to create the type lvalue reference to `cv TR` creates the type lvalue\
    \ reference to `T`, while an attempt to create the type rvalue reference to `cv\
    \ TR` creates the type `TR`.\n\n* `T&&` becomes `T&`\n* `T&&&` becomes `T&`\n\
    * `T&&&` becomes `T&`\n* `T&&&&` becomes `T&&`\n\n```cpp\nint i;\ntypedef int&\
    \ LRI;\ntypedef int&& RRI;\n\nLRI& r1 = i; // r1 has the type int&\nconst LRI&\
    \ r2 = i; // r2 has the type int&\nLRI& r3 = i; // r3 has the type int&\nRRI&\
    \ r4 = i; // r4 has the type int&\nRRI& r5 = i; // r5 has the type int&\nLRI&\
    \ r6 = i; // r6 has the type int&\nRRI& r7 = i; // r7 has the type int&\n```\n"
