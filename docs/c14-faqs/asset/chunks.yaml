    \ `std::integer_sequence` 特化，具有 `N` 个模板非类型参数。\n\n```cpp\ntemplate<class T, T N>\n\
    using make_integer_sequence = std::integer_sequence<T, /* 一个序列 0, 1, 2, ..., N-1\
