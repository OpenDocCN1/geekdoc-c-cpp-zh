    \n    >::type;SOLUTION OF QUESTION [31](#part0000_split_006.html_x1-33001r31)\n\
    \nIn a template context, C++ requires that each metacall to a metafunction bear\
    \ syntactic overhead in the form of an introductory typename keyword, as well\
    \ as the suffixed ::type as could be seen in the code snippet.\n\nFortunately,\
    \ C++14 removes this burden by providing a set of template aliases for the library’s\
    \ Transformation Traits, for example:\n\ntemplate <bool b, class T, class F> \n\
    \nusing conditional_t \n\n    = typename conditional<b,T,F>::type; \n\ntemplate <class T> \n\
    \nusing add_lvalue_reference_t \n\n    = typename add_lvalue_reference<T>::type;\n\
    \nSo, the code provided can be simplified to look like:\n\ntemplate< class T > \n\
    \nusing reference_t \n\n    = conditional_t< \n\n            is_reference<T>::value, \n\
    \n            T, \n\n            add_lvalue_reference_t<T> \n\n    >;\n\nIn this\
    \ light, further additions are:\n\n*   const-volatile modifications:template <class T> \n\
    \n    using remove_const_t = typename remove_const<T>::type; \n\n    template <class T> \n\
    \n    using remove_volatile_t = typename remove_volatile<T>::type; \n\n    template <class T> \n\
    \n    using remove_cv_t = typename remove_cv<T>::type; \n\n    template <class T> \n\
    \n    using add_const_t = typename add_const<T>::type; \n\n    template <class T> \n\
    \n    using add_volatile_t = typename add_volatile<T>::type; \n\n    template <class T> \n\
    \n    using add_cv_t = typename add_cv<T>::type;\n\n*   reference modifications:template <class T> \n\
    \n    using remove_reference_t \n\n    = typename remove_reference<T>::type; \n\
    \n    template <class T> \n\n    using add_lvalue_reference_t = typename add_lvalue_reference<T>::type; \n\
    \n    template <class T> \n\n    using add_rvalue_reference_t = typename add_rvalue_reference<T>::type;\n\
    \n*   sign modifications:template <class T> \n\n    using make_signed_t \n\n \
    \   = typename make_signed<T>::type; \n\n    template <class T> \n\n    using make_unsigned_t = typename make_unsigned<T>::type;\n\
    \n*   array modifications:template <class T> \n\n    using remove_extent_t \n\n\
    \    = typename remove_extent<T>::type; \n\n    template <class T> \n\n    using remove_all_extents_t = typename remove_all_extents<T>::type;\n\
    \n*   pointer modifications:template <class T> \n\n    using remove_pointer_t = typename remove_pointer<T>::type; \n\
