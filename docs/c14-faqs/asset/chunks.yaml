    \n22}SOLUTION OF QUESTION [32](#part0000_split_006.html_x1-34001r32)\n\nSuppose\
    \ there is no exception raised, then the memories allocate by the calls new A\
    \ and new B are leaked as can seen in the output of the program :\n\nA()  \n\n\
    B()\n\nThe destructors are not called. Classic memory leak. Moreover it suffers\
    \ from problems associated with unspecified order of evaluation of the parameters\
    \ to the function as depicted ahead.\n\nImmediate Remedy: As a quick fix, suppose\
    \ the code is modified to use std::unique_ptr instead of raw pointers:\n\n1#include <iostream> \n\
    \n2#include <memory> \n\n3 \n\n4template<typename T1, typename T2> \n\n5void f(std::unique_ptr<T1> a, std::unique_ptr<T2> b) \n\
    \n6{} \n\n7 \n\n8struct A \n\n9{ \n\n10    A() { std::cout << \"A()\" << std::endl; } \n\
    \n11    ~A() { std::cout << \"~A()\" << std::endl; } \n\n12}; \n\n13 \n\n14struct B \n\
    \n15{ \n\n16    B() { std::cout << \"B()\" << std::endl; } \n\n17    ~B() { std::cout << \"\
    ~B()\" << std::endl; } \n\n18}; \n\n19 \n\n20int main() \n\n21{ \n\n22    f(std::unique_ptr<A>(new A), std::unique_ptr<B>(new B)); \n\
    \n23}\n\nIt prints now:\n\nA()  \n\nB()  \n\n~B()  \n\n~A()\n\nSo no leak this\
    \ time ! Is it ?\n\nThe order of evaluation of the parameters being passed to\
    \ the function is unspecified. And we know that the call to new A invokes at least\
    \ 2 different calls : operator new to allocate the memory followed by the call\
    \ to A’s constructor. Same is for B.\n\nLet us assume that the evaluation of unique_ptr’s\
    \ construction occur last.\n\nSuppose, new A succeeds and while evaluating new\
    \ B, either the operator new of the call to B’s constructor raises some exception,\
    \ then A’s memory will be leaked. Same is for B.\n\nSuppose, the evaluation is\
    \ like this : operator new gets called for A followed by B, the A’s constructor\
    \ gets called followed by B. If either A’s or B’s constructor fails then B’s or\
    \ A’s memory is leaked respectively.\n\nHence in case of any exception during\
    \ the evaluation of the parameters, there are possibilities of memory leak due\
    \ to unspecified evaluation order of the expressions used as parameters.\n\nSo\
    \ all we want is to provide a function template with perfect forwarding (because\
    \ the user will be passing new from outside this function template) that does\
    \ the work of allocation and construction of the object and construction of the\
    \ unique_ptr.\n\nLuckily, C++14 provides a perfectly forwarding variadic function\
    \ template std::make_unique.\n\nHence, the final code looks like :\n\n1#include <iostream> \n\
    \n2#include <memory> \n\n3 \n\n4template<typename T1, typename T2> \n\n5void f(std::unique_ptr<T1> a, std::unique_ptr<T2> b) \n\
    \n6{} \n\n7 \n\n8struct A \n\n9{ \n\n10    A() { std::cout << \"A()\" << std::endl; } \n\
    \n11    ~A() { std::cout << \"~A()\" << std::endl; } \n\n12}; \n\n13 \n\n14struct B \n\
    \n15{ \n\n16    B() { std::cout << \"B()\" << std::endl; } \n\n17    ~B() { std::cout << \"\
    ~B()\" << std::endl; } \n\n18}; \n\n19 \n\n20int main() \n\n21{ \n\n22    f(std::make_unique<A>(), std::make_unique<B>()); \n\
    \n23}\n\nmake_unique prevents the unspecified evaluation order leak triggered\
    \ by the expression\n\nf(std::unique_ptr<A>(new A), std::unique_ptr<B>(new B));\n\
    \nBecause, now the parameters are 2 functions, which will be executed irrespective\
    \ of the order of evaluation.\n\nSuppose the first call succeeds and the second\
    \ call fails(i.e. throws) then the temporary object created by the first call\
    \ is guaranteed to clean up because temporary objects are destroyed as the last\
    \ step in evaluating the full-expression that (lexically) contains the point where\
    \ they were created. This is true even if that evaluation ends in throwing an\
    \ exception.\n\nIf the first call throws, then there are no leaks because std::make_unique\
    \ is itself strongly exception-safe.\n\n### 0.33 make_unique as perfect forwarding\
    \ guy\n\n** Question 33 make_unique as perfect forwarding guy\n\nIn the code below,\
    \ we end up typing the name of the type UserDefinedLongTypeName twice:\n\nstd::unique_ptr<UserDefinedLongTypeName> up(new UserDefinedLongTypeName());\n\
    \nHow to resolve this ? Briefly describe the mechanism.\n\nSOLUTION OF QUESTION [33](#part0000_split_006.html_x1-35001r33)\n\
    \nAs already mentioned before, the code can be rewritten as:\n\nauto up = std::make_unique<UserDefinedLongTypeName>();\n\
    \nSo it helps us get rid of explicit call to new as well.\n\nMechanism : make_unique<\
    \ T >(args...) invokes new T(std::forward< Args >(args)...)\n\nAnd please note\
    \ that this meant T(params) with parentheses rather than T{params}. If T{params}\
    \ was adopted then the output of the following program will be 2 instead of 2014:\n\
    \nauto up_vec1 = std::make_unique<std::vector<int>>(2014, 2017); \n\nstd::cout << \"\
    size of the first vector is : \" << up_vec1->size() << std::endl;\n\n### 0.34\
    \ make_unique and new\n\n*** Question 34 make_unique and new\n\nDoes make_unique\
    \ calls plain new or global new ?\n\nSOLUTION OF QUESTION [34](#part0000_split_006.html_x1-36001r34)\n\
    \nAs we know that the class template default_delete serves as the default deleter\
    \ (destruction policy) for the class template unique_ptr.\n\ndefault_delete provides\
    \ the function call operator as follows :\n\n void operator()(T* ptr) const;\n\
    \nEffect of which is to calls plain delete on ptr. That’s why make_unique also\
    \ makes call to plain new, the matching guy, instead of the global one.\n\nPlease\
    \ note that make_shared< T >() makes call to the global new as ::new (ptr). The\
    \ reason is simple : it must invoke true placement new, which can’t be replaced,\
    \ instead of the following which is allowed to exist as well:\n\nT::operator new(size_t, void *)\n\
    \nSimilar behavior can be observed in this program:\n\n1#include <iostream> \n\
    \n2#include <memory> \n\n3#include <cstdlib> \n\n4 \n\n5void* operator new(std::size_t s) \n\
    \n6{ \n\n7    std::cout << \"global operator new called\" << std::endl; \n\n8    return std::malloc(s); \n\
