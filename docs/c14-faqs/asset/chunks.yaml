  trans: "\n为了更好地理解这种方法，让我们来看以下其中一个问题：\n\n#### 问题 7 通用滑动函数\n\n实现一个通用的滑动函数，将像 `vector`这样的顺序容器中连续选择的项移动到指定的区域（向前或向后）。\n\
    \n**问题 7 的答案**\n\n![PIC](img/00002.jpeg) `rotate{f, l, p}`; ![PIC](img/00003.jpeg)\n\
    \n![PIC](img/00004.jpeg) `rotate{p, f, l}`; ![PIC](img/00005.jpeg)\n\n将这些结合起来，我们得到：\n\
    \n```cpp\nif (p < f) rotate(p, f, l);\nif (l < p) rotate(f, l, p);\n```\n\n假设我们对最终位置也感兴趣，那么用\
    \ C++11 编写代码如下：\n\n```cpp\nif (p < f) return { p, rotate(p, f, l) };\nif (l <\
    \ p) return { rotate(f, l, p), p };\n```\n\n让我们加上第三种情况（完全不移动）来完成代码：\n\n![PIC](img/00006.jpeg)\n\
    \n```cpp\nreturn {f, l};\n// I models RandomAccessIterator \ntemplate <typename\
    \ I> \nauto slide(I f, I l, I p) -> pair<I, I> \n{ \n    if (p < f) return { p,\
    \ rotate(p, f, l) }; \n    if (l < p) return { rotate(f, l, p), p }; \n\n    return\
    \ { f, l }; \n}\n```\n\n即将出版的章节将加强这种跨 C++ 各领域的特定方法。\n\n### 高级 C++ FAQ：卷 2： 泛型编程\n\
    \n本书是第一卷《高级 C++ FAQ：卷 1：基础》的续作。它假设读者熟悉 C++98 和 C++03 的基础知识，并希望扩展视野，学习 C++ 现在和未来最新最强大的技术，包括\
    \ C++11 和 C++1y（即 C++14）。它包含了精选的泛型编程问题，并对所有这些问题提供了详细解答，这将帮助读者磨练解决特定问题的技能。问题按照从一星(*）（最简单）到五星（*****）（最困难）的标准进行标记。\n\
    \n为了更好地理解这种方法，让我们来看以下其中一个问题：\n\n#### 问题 56 元函数：检查类型成员是否存在\n\n开发一个类似于类特征（trait-like）元函数的实用程序，用于判断类型\
    \ `T` 是否具有名为 `type` 的类型成员。\n\n**问题 56 的答案**\n\n```cpp\n#include <type_traits>\
    \ \n#include <iomanip> \n#include <iostream> \n\ntemplate< class T > \n    using\
    \ void_t = void; \n    //using void_t = std::conditional_t<true, void, T>; \n\n\
    template< class, class = void >\nstruct has_type_member : std::false_type \n{};\
    \ \n\ntemplate< class T > \nstruct has_type_member<T, void_t<typename T::type>>\
    \ : std::true_type \n}; \n\nstruct A \n{\n    typedef int type; \n}; \n\nstruct\
    \ B \n{\n}; \n\nint main() \n{ \n    static_assert(has_type_member<A>::value,\
    \ \"\"); \n    static_assert(!has_type_member<B>::value, \"\"); \n\n    std::cout\
    \ << std::boolalpha;\n    std::cout << has_type_member<A>() << std::endl; \n \
    \   std::cout << has_type_member<B>() << std::endl; \n    std::cout << has_type_member<std::common_type<int,\
    \ double>>() << std::endl; \n    std::cout << has_type_member<std::common_type<int,\
    \ std::string>>() << std::endl; \n}\n```\n\n输出结果：\ntrue\nfalse\ntrue\nfalse\n\n\
    与计算此类结果的传统代码相比，这个版本似乎简单得多，而且没有特殊情况（例如避免形成指向引用的类型）。\n\n`void_t` 别名模板的作用仅仅是将任何给定的类型映射到\
    \ `void`。\n\n在某些平台上，它可能会因为别名特化中引用未使用参数 `T` 而发出错误，因此我们可能需要使用以下代码：\n\n`using void_t\
    \ = std::conditional_t<true, void, T>;`\n\n`conditional_t` 作为变通方法确保我们的模板参数始终被使用。\n\
    \n代码恰包含两种情况，每种情况都很直观：\n\n1. 当存在名为 `type` 的类型成员时，特化是有效的（以 `void` 作为第二个参数）并会被选中，产生\
    \ `true_type` 结果。\n2. 当没有此类类型成员时，将应用 SFINAE，特化将无效，转而选择主模板，产生 `false_type`。\n\n\
    因此，每种情况都获得了适当的结果。\n\n请注意，我们可以扩展 `void_t` 代码，用于将一系列类型映射到 `void`。\n\n```cpp\ntemplate<\
    \ class... > \nstruct voider { using type = void; }; \n\ntemplate< class... T0toN\
    \ > \nusing void_t = typename voider<T0toN...>::type;\n```\n"
