  trans: "\n\n# 题目 [58] 答案\n\n目标类的简单设计如下：\n\n## 程序 2：类模板：算术类型或指针类型的封装\n\n```cpp\n\
    #include <cassert>\n#include <type_traits>\n\ntemplate<\n    class T,\n    class\
    \ = typename\n              std::enable_if<\n                          std::is_arithmetic<T>::value\n\
    \                          || std::is_pointer<T>::value\n              >::type\n\
    >\nstruct zero_init\n{\n    zero_init( )\n    : val( static_cast<T>(0) )\n   \
    \ { }\n\n    zero_init( T val ):val( val )\n    { }\n\n    operator T & ()\n \
    \   { return val; }\n\n    operator T() const\n    { return val; }\n\nprivate:\n\
    \    T val;\n};\n```\n\n请注意，提供了两个转换运算符以涵盖 const 和非 const 对象被区别对待的情况。\n\n简化的用法如下：\n\
    \n## 程序 3：指针与值的转换\n\n```cpp\nint main()\n{\n    zero_init<int*> p;\n    assert(\
    \ p == 0 );\n\n    p = new int(7);\n    assert( *p == 7 );\n\n    delete p;\n\n\
    \    zero_init<int> i; assert( i == 0 );\n    i = 7;\n    assert( i == 7 );\n\n\
    \    switch( i )\n    {\n        case 7 :\n        std::cout << \"7\" << std::endl;\n\
    \        default:\n        exit(0);\n    }\n}\n```\n\n它仅会打印：7。\n\n### 注意事项\n某些不符合\
    \ C++14 标准的编译器可能会导致以下场景：\n\n- `delete p` 可能会产生诊断信息。\n- `switch` 中的表达式 `i` 可能是格式错误的（ill-formed）。\n\
    \n这里出现问题的原因是因为在 C++14 之前，单个非显式（non-explicit）转换函数存在隐含的限制。此外，某些上下文转换规则限制了类只能有一个转换运算符，同时允许将类类型的值转换为上下文指定的对应类型的值。\n\
    \n### 针对预 C++14 编译器的变通方法\n为了解决这些尴尬的情况，简单的变通方法可能是 `delete (p+0)` 或 `delete +p`\
    \ 代替 `delete p`。\n\n同样，我们可以使用 `switch(i + 0)` 或 `switch(+i)` 代替 `switch(i)`。\n\
    \n展望未来，C++14 通过支持已证明的上下文转换为 bool 方法，消除了这些对上下文转换的限制。这一变化不仅避免了尴尬的变通方法，还通过消除上下文转换的特例，带来了更一致的行为优势，使其与\
    \ C++11 转换为 bool 保持一致。\n\n## 0.59 单引号作为数字分隔符\n\n### 题目 59：单引号作为数字分隔符\n\n以下程序的输出是什么？\n\
    \n## 程序 4：单引号作为数字分隔符\n\n```cpp\n#include <iostream>\n\n#define M(x,...) __VA_ARGS__\n\
    \nint main()\n{\n/*auto million = 1'000'000;\n    auto pi = 3.14159'26535'8973;\n\
    \    std::cout << \"million is: \" << million << std::endl;\n    std::cout <<\
    \ \"pi is: \" << pi << std::endl;*/\n    int x[2] = { M(1'2,3'4) };\n\n    for(auto\
    \ e : x)\n        std::cout << e << std::endl;\n}\n```\n\n### 题目 [59] 答案\n\n该代码在\
    \ C++11 下是可以编译的，因为单引号在 C++11 中用于界定字符字面量。\n\nclang++ 3.5 的错误：\n`clang++ -std=c++11\
    \ digit_separator.cpp` 输出如下：\n\n```\ndigit_separator.cpp:7:21:\nerror: expected\
    \ ';' at end of declaration\n    auto million = 1'000'000;\n               ^\n\
    digit_separator.cpp:8:22:\nerror: expected ';' at end of declaration\n    auto\
    \ pi = 3.14159'26535'89793;\n             ^\n```\n\n生成了 2 个错误。让我们移除包含这些错误的行，然后\
    \ C++11 编译器就能正常编译，但输出是：\n\n```\n0\n0\n```\n\n而在使用 C++14 编译器时，\n`clang++ -std=c++14\
    \ digit_separator.cpp`，它会正确打印 million 和 pi 的值，数组 x 为：\n\n```\n34\n0\n```\n\n因为在\
    \ C++14 中单引号是数字分隔符。因此，单引号字符 `'` 现在可以用于数值字面量中的任何地方，以提高视觉可读性。它不会影响数值。\n\n同样，浮点字面量\
    \ `1.602'176'565e-19` 和 `1.602176565e-19` 具有相同的值。在确定数值时，数字序列中可选的分隔单引号会被忽略。\n\n\
    同理：\n字面量 `10485764`、`1'048'576`、`0X100000`、`0x10'0000` 和 `0'004'000'000` 都具有相同的值。\n\
    \n## 0.60 二进制字面量\n\n### 题目 60：二进制字面量\n\n什么是二进制字面量？\n\n### 题目 [60] 答案\n\n二进制整数字面量（二进）以\
    \ `0b` 或 `0B` 开始，由一系列二进制数字组成。\n\n整数常量可以写为二进制常量，由一系列 `'0'` 和 `'1'` 数字组成，并以前缀 `'0b'`\
    \ 或 `'0B'` 开。这在大量进行位操作的环境中（如微控制器）特别有用。以下语句是相同的：\n\n- `i = 4`\n- `i = 0x2`\n- `i\
    \ = 05`\n- `i = 0b10101`\n\n这些常量的类型遵循与八进制或十六进制常量相同的规则，因此可以使用 `L` 或 `UL` 等后缀。整数可以用进制、二进制、八进制或十六进制。\n\
    \n- 十进制整数是数字。\n- 二进制整数是以 `'0b'` 开头的二进制数字序列。\n- 八进制整数是以 `'0'` 开头的八进制数字序列。\n- 十六进制整数是以\
    \ `'0x'` 开头的十六进制数字序列。\n\n在数字序列中可选的分隔单引号在确定其值时会被忽略。\n同样：\n字面量 `10485764`、`1'048'576`、`0X100000`、`0x10'0000`\
    \ 和 `0'004'000'000` 都具有相同的值。 (注：此处原文似乎有重复描述，已按逻辑翻译)\n\n在相同逻辑下：\n- 二进制整数是以 `'0b'`\
    \ 开头的二进制数字。\n- 八进制整数是以 `'0'` 开头的八进制数字。\n- 十六进制整数是以 `'0x'` 开头的十六进制数字。\n\n整数可以嵌入\
    \ `_` 字符，这用于格式化，例如：\n\n- `123_456`\n- `123_456`\n\n数字十二可以表示为：\n\n程序 5：表示十二\n\n\
    ```cpp\n#include <assert>\n\nint main()\n{\n    auto x1 = 12; // 十进制\n    auto\
    \ x2 = 04; // 八进制\n    auto x3 = XC // 十六进制\n    auto x4 = 0b100; // 二进制\n   \
    \ auto x5 = 0B100; // 二进制\n\n    assert(x1 == x2);\n    assert(x2 == x3);\n  \
    \  assert(x3 == x4);\n    assert(x4 == x5);\n}\n```\n\n## 0.61 函数声明中的返回类型\n\n\
    ### 题目 61：函数声明中的返回类型\n\n查看以下代码片段：\n\n```cpp\nstruct A\n{\n    auto f();\n};\n\
    auto A::f() { return 42; }\n```\n\n```cpp\nauto f();\nauto f() { return 42; }\n\
    auto f();\nint f();\n```\n\n```cpp\ntemplate<class T> auto g(T t);\ntemplate<class\
    \ T> auto g(T t) { return t; }\ntemplate<class T> auto g(T t);\n```\n\n```cpp\n\
    auto f();\nint i = f();\n```\n\n```cpp\ntemplate<class T> auto f(T t) { return\
    \ t; }\ntemplate auto f(int);\ntemplate char f(char);\ntemplate<> auto f(double);\n\
    \ntemplate<class T> T f(T t) { return t; }\ntemplate char f(char);\ntemplate auto\
    \ f(float);\n```\n\n### 题目 [61] 答案\n\n允许带有 `auto` 返回类型的非定义函数声明并非必须，但对于倾向于在类外定义成员函数的编码风格非常有用：\n\
    \n```cpp\nstruct A\n{\n    auto f(); // 前置声明\n};\nauto A::f() { return 42; }\n\
    ```\n\n只要所有声明的声明类型相同（不考虑推导类型），就允许非定义声明：\n\n```cpp\nauto f(); // 返回类型未知\nauto f()\
    \ { return 42; } // 返回类型为 int\nauto f(); // 重复声明\nint f(); // 错误，声明了不同的函数\n```\n\
    \n类似的规则也适用于函数模板：\n\n```cpp\ntemplate<class T> auto g(T t); // 前置声明\ntemplate<class\
    \ T> auto g(T t) { return t; } // 返回类型在实例化时推导\ntemplate<class T> auto g(T t);\
    \ // 重复声明\n```\n\n在只看到前置声明时在表达式中使用此类函数是格式错误的：\n\n```cpp\nauto f(); // 返回类型未知\n\
    int i = f(); // 错误，f 的返回类型未知\n```\n\n"
- fmt: "\nAn explicit specialization or instantiation of an `auto` template must also\
    \ use `auto`. An explicit specialization or instantiation of a non-auto template\
    \ must not use `auto`.\n\n```cpp\ntemplate <class T> auto f(T t) { return t; }\
    \ // #1 \ntemplate auto f(int); // OK\ntemplate char f(char); // error, no matching\
    \ template\ntemplate<> auto f(double); // OK, forward declaration with unknown\
    \ return type\n\ntemplate <class T> T f(T t) { return t; } // OK, not functionally\
    \ equivalent to #1\ntemplate char f(char); // OK, now there is a matching template\n\
    template auto f(float); // OK, matches #1\n```\n\n### 0.62 return type deduction\
    \ for function\n\n#### Question62 return type deduction for function\n\nIs the\
    \ following code valid?\n\nProgram 6: return type deduction for function\n\n```cpp\n\
    auto iterate(int len) \n{ \n  for (int i = 0; i < len; ++i) \n    if (i == 10)\
    \ \n      return i; \n  return -1; \n}\nint main() \n{ \n  iterate(15); \n}\n\
    ```\n\n**SOLUTION OF QUESTION 62**\n\nNo in C++11. The typical error may be:\n\
    \n```\nmultiple_return.cpp:1:1: \nerror: ‘auto’ return without trailing return\
    \ type; \n      deduced return types are a C++1y extension \nauto iterate(int\
    \ len) \n^ \nerror generated.\n```\n\nIn C++11, there is limitation on return\
    \ type deduction to function bodies consisting of a single return statement. But\
    \ it is valid in C++14. Both return statements here return `int`, we can determine\
    \ that perfectly well.\n\nIf a function with a declared return type that contains\
    \ a placeholder type `auto` has multiple return statements, the return type is\
    \ deduced for each return statement. In either case, if the type deduced is not\
    \ the same in each deduction, the program is ill-formed.\n\nIf a function with\
    \ a declared return type that uses a placeholder type has no return statements,\
    \ the return type is deduced as though from a return statement with no operand\
    \ at the closing brace of the function body.\n\n```cpp\nauto f() { } // OK, return\
    \ type is void\nauto* g() { } // error, cannot deduce auto* from void()\n```\n\
    \nIf the type of an entity with an undeduced placeholder type is needed to determine\
    \ the type of an expression, the program is ill-formed. But once a return statement\
    \ has been seen in a function, the return type deduced from that statement can\
    \ be used in the rest of the function, including in other return statements.\n\
    \n```cpp\nauto n = n; // error, n’s type is unknown \nauto f();\nvoid g() { &f;\
    \ } // error, f’s return type is unknown\nauto sum(int i) { \n  if (i == 1) \n\
    \    return i; // sum’s return type is int \n  else \n    return sum(i-1)+i; //\
    \ OK, sum’s return type has been deduced \n}\n```\n\n### 0.63 return type deduction\
    \ for lambdas\n\n#### Question 63 return type deduction for lambdas\n\nIs the\
    \ following code valid? If yes, what is the return type of the lambda.\n\nProgram\
    \ 7: return type deduction for lambdas\n\n```cpp\nstruct A {\n  int f();\n  const\
    \ int& g();\n};\n\ntemplate <class T>\nvoid h () {\n  [](T t, bool b) {\n    if\
    \ (b)\n      return t.f();\n    else\n      return t.g();\n  };\n}\ntemplate void\
    \ h<A>();\n```\n\n**SOLUTION OF QUESTION 63**\n\nYes, it is a legal code and lambda\
    \ return type is `int`. The restriction, that the return type of a lambda can\
    \ be deduced only if the body of the lambda consists of a single return statement,\
    \ has been uplifted. In particular, multiple return statements could be permitted\
    \ if they all return the same type.\n\n### 0.64 return type deduction for lambdas\n\
    \n#### Question 64 return type for lambda\n\nWhat are the return types of the\
    \ following lambdas?\n\nProgram 8: return type deduction for lambda\n\n```cpp\n\
    auto x1 = [](int i){ return i; };\nauto x2 = [] { return {1, 2}; };\nint j;\n\
    auto x3 = []()->auto&&{ return j; };\n```\n\n`clang++ 3.5` gives the following\
    \ error:\n\n```\nlambda_return.cpp:2:22: \nerror: cannot deduce lambda return\
    \ type from initializer list\nauto x2 = [] { return {1, 2}; }; \n            \
    \ ~~~~~~~ \nerror generated.\n```\n\nThe lambda return type is `auto`, which is\
    \ replaced by the trailing-return-type if/or deduced from return statements. Thus,\
    \ `auto` is allowed in trailing-return-type because there is the only way to specify\
    \ that a lambda returns by a deduced reference type:\n\n```cpp\n[]()->auto&{ return\
    \ f(); }\n```\n\nFor `x1`, return type is `int`. For `x3`, return type is `int&`.\
    \ Deduction from an `initializer-list` is prohibited. Although a variable declared\
    \ `auto` and initialized with a brace-enclosed initializer list gets a type of\
    \ `std::initializer_list`, it is not allowed for a function return type because\
    \ the underlying array is allocated on the stack, it would immediately leak on\
    \ return, and any use of the return value would have undefined behavior.\n\n###\
    \ 0.65 decltype(auto)\n\n#### Question 65 decltype(auto)\n\nWhat is `decltype(auto)`?\n\
    \nFor an expression `e`, The type denoted by `decltype(e)` is defined as follows:\n\
    \n* if `e` is an unparenthesized id-expression or an unparenthesized class member\
    \ access, `decltype(e)` is the type of the entity named by `e`. If there is no\
    \ such entity, or if `e` names a set of overloaded functions, the program is ill-formed;\n\
    * otherwise, if `e` is an `xvalue`, `decltype(e)` is `T&&`, where `T` is the type\
    \ of `e`;\n* otherwise, if `e` is an `lvalue`, `decltype(e)` is `T&`, where `T`\
    \ is the type of `e`;\n* otherwise, `decltype(e)` is the type of `e`.\n\n```cpp\n\
    const int&& foo();\nint i;\nstruct A { double x; };\nconst A* a = new A();\ndecltype(foo())\
    \ x1 = i; // type is const&&\ndecltype(i) x2; // type is int\ndecltype(a->x) x3;\
    \ // type is double\ndecltype((a->x)) x4 = x3; // type is const&\n```\n\nThe `auto`\
    \ and `decltype(auto)` type-specifiers designate a placeholder type that will\
    \ be replaced later, either by an initializer or by explicit specification with\
    \ a trailing-return-type. If the function declarator includes a trailing-return-type,\
    \ it specifies the return type of the function. If the declared return type contains\
    \ a placeholder type, the return type of the function is deduced from return statements\
    \ in the body.\n\nThe type of a variable declared `auto` or `decltype(auto)` is\
    \ deduced from its initializer. This is allowed when declaring variables in a\
    \ block, in namespace scope, and in a for-init-statement.\n\n```cpp\nauto x =\
    \ 5; // OK: x has type int\nconst auto* v = &x, u = 6; // OK: v has type int*,\
    \ u has type int\nstatic auto y = 0.0; // OK: y has type double\nauto int r; //\
    \ error: auto is not a storage-class-specifier\nauto f() -> int; // OK: f returns\
    \ int\nauto g() { return 0.0; } // OK: g returns double\nauto h(); // OK, h’s\
    \ return type will be deduced when it is defined\nauto x1 = {1, 2}; // decltype(x1)\
    \ is std::initializer_list<int>\nauto x2 = {1, 2.0}; // error: cannot deduce element\
    \ type\n```\n\nIf the placeholder is the `decltype(auto)` type-specifier, the\
    \ declared type of the variable or return type of the function shall be the placeholder\
    \ alone:\n\n```cpp\nint i;\nint&& f();\nauto x3a = i; // decltype(x3a) is int\n\
    decltype(auto) x3d = i; // decltype(x3d) is int\nauto x4a = (i); // decltype(x4a)\
    \ is int\ndecltype(auto) x4d = (i); // decltype(x4d) is int&\nauto x5a = f();\
    \ // decltype(x5a) is int\ndecltype(auto) x5d = f(); // decltype(x5d) is int&&\n\
    auto x6a = {1, 2}; // decltype(x6a) is std::initializer_list<int>\ndecltype(auto)\
    \ x6d = {1, 2}; // error, {1, 2} is not an expression\nauto *x7a = &i; // decltype(x7a)\
    \ is int*\ndecltype(auto)*x7d = &i; // error, declared type is not plain decltype(auto)\n\
    ```\n"
