    \ 操符\n\n下面程序的输出是什么？如果需要，请修改程序以纠正任何问题。\n\n```cpp\n#include <sstream> \n#include\
    \ <iostream> \n\nint main() \n{ \n    std::stringstream ss; \n    std::string\
    \ original = \"Chandra Shekhar Kumar\"; \n\n    std::string round_trip; \n\n \
    \   ss << original; \n    ss >> round_trip; \n\n    std::cout << original << std::endl;\
    \ \n    std::cout << round_trip << std::endl; \n}\n```\n\n### 问题 81 的答案\n\n输出为：\n\
    ```\nChandra Shekhar Kumar\nChandra\n```\n\n输出并不是我们预期的，看起来标准库流 IO 在处理嵌入空格的字符串时存在问题。\n\
    \n幸运的是，C++14 引入了 `quoted` 流 IO 操符，它在输出时在字符串周围加上分隔符（默认为双引号 `\"`），并在输入时去除分隔符。这确保了嵌入空格的字符串可以按预期进行往返处理。\n\
    \n因此，符合我们预期的修改程序如下：\n\n```cpp\n#include <sstream> \n#include <iomanip> \n#include\
    \ <iostream> \n\nint main() \n{ \n    std::stringstream ss; \n    std::string\
    \ original = \"Chandra Shekhar Kumar\"; \n\n###    std::string round_trip; \n\n\
    \    ss << quoted(original); \n    ss >> quoted(round_trip); \n\n    std::cout\
    \ << original << std::endl; \n    std::cout << round_trip << std::endl; \n}\n\
    ```\n\n`quoted` 操符提供了带引号字符串的插入和提取，并确保如果对嵌入空格的字符串通过流 IO 插入后再次提取，其内容保持不变。\n\n```cpp\n\
    template<typename CharT>\ninline auto quoted(const CharT *s, CharT delim = '\"\
    ', CharT escape = '\\\\'); \n\ntemplate<typename CharT, typename Traits, typename\
    \ Alloc>\ninline auto quoted(const basic_string<CharT, Traits, Alloc>& s, CharT\
    \ delim = '\"', CharT escape = '\\\\');\n```\n\n如果 `out` 是一个成员类型 `char_type` 为\
    \ `CharT` 的 `basic_ostream` 实例，则表达式 `out << quoted(s, delim, escape)` 的行为是，它使用字符插入器模板向\
    \ `out` 插入以下字符：\n- `delim`。\n- `s` 中的每个字符。如果要输出的字符通过 `==` 判断等于 `escape` 或 `delim`，则先输出\
    \ `escape`。`delim`。\n\n表达式 `out << quoted(s, delim, escape)` 的类型为 `std::basic_ostream<CharT,\
    \ Traits>&`，值为 `out`。\n\n```cpp\ntemplate<typename CharT, typename Traits, typename\
    \ Alloc>\ninline auto quoted(basic_string<CharT, Traits, Alloc>& s, CharT delim\
    \ = '\"', CharT escape = '\\\\');\n```\n\n如果 `in` 是一个成员类型 `char_type` 为 `CharT`\
    \ 的 `basic_istream` 实例，则表达式 `in >> quoted(s, delim, escape)` 的行为是，它使用 `basic_istream::operator>>`\
    \ 从 `in` 提取以下字符：\n- 如果提取的第一个字符通过 `==` 判断等于 `delim`，则：\n    - 忽略 `skipws` 标志。\n\
    \    - `s.clear()`。\n    - 直到遇到未转义的 `delim` 或 `!in`，从 `in` 提取字符并将其追加到 `s` 中，但如果遇到转义字符，则忽略它并将下一个字符追加到\
    \ `s`。\n    - 丢弃最后的 `delim` 字符。\n    - 将 `skipws` 标志恢复到其原始值。\n- 否则，`in >> s`。\n\
    \n如果 `out` 是一个成员类型 `char_type` 为 `CharT` 的 `basic_ostream` 实例，则表达式 `out << quoted(s,\
    \ delim, escape)` 的行为如 `quoted` 函数的 `const basic_string<charT, traits, Allocator>&`\
    \ 载载版本所示。\n\n#### quoted 操符的实现\n\n典型的实现可能如下：\n\n**程序 18: 分隔符字符串结构**\n```cpp\n\
    template<typename String, typename CharT>\nstruct Quotedstring\n{\n    static_assert(std::is_reference<String>::value\
    \ || std::is_pointer<String>::value, \"String 必须是指针或引用\");\n    Quotedstring(String\
    \ str, CharT del, CharT esc) : M_string(str), M_delim{del}, M_escape{esc} {}\n\
    \    Quotedstring& operator=(Quotedstring&) = delete;\n    String M_string;\n\
    \    CharT M_delim;\n    CharT M_escape;\n};\n```\n注意左侧和右侧的分符可以不同。**程序 19: 分隔符插入器**\n\
    ```cpp\ntemplate<typename CharT, typename Traits>\nauto& operator<<(std::basic_ostream<CharT,\
    \ Traits>& os, const Quotedstring<const CharT*, CharT>& str)\n{\n    os << str.M_delim;\n\
    \    for (const CharT* c = str.M_string; *c; ++c) {\n        if (*c == str.M_delim\
    \ || *c == str.M_escape)\n            os << str.M_escape;\n        os << *c;\n\
    \    }\n    os << str.M_delim;\n    return os;\n}\n\ntemplate<typename CharT,\
    \ typename Traits, typename String>\nauto& operator<<(std::basic_ostream<CharT,\
    \ Traits>& os, const Quotedstring<CharT*, CharT>& str)\n{\n    os << str.M_delim;\n\
    \    for (auto &c = str.M_string; c; ++c) {\n        if (c == str.M_delim || c\
    \ == str.M_escape)\n            os << str.M_escape;\n        os << *c;\n    }\n\
    \    os << str.M_delim;\n    return os;\n}\n```\n\n**程序 20: 分隔符提取器**\n```cpp\n\
    template<typename CharT, typename Traits, typename Alloc>\nauto& operator>>(std::basic_istream<CharT,\
    \ Traits>& is, Quotedstring<basic_string<CharT, Traits, Alloc>&, CharT>& str)\n\
    {\n    CharT c;\n    is >> c;\n    if (!is.good())\n        return is;\n    if\
    \ (c != str.M_delim) {\n        is.get();\n        is >> str.M_string;\n     \
    \   return is;\n    }\n    str.M_string.clear();\n    std::ios_base::fmtflags\
    \ flags = is.flags() & ~std::ios_base::skipws;\n    do {\n        is >> c;\n \
    \       if (!is.good())\n            break;\n        if (c == str.M_escape) {\n\
    \            is >> c;\n            if (!is.good()) break;\n        } else if (c\
    \ == str.M_delim)\n            break;\n        str.M_string += c;\n    } while\
    \ (true);\n    is.setf(flags);\n    return is;\n}\n```\n\n它允许编写如下代码：\n\n"
