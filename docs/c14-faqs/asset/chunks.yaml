    \n### 0.45 编译时整数序列\n\n#### 问题 45 编译时整数序列\n描述库提供的可以在编译时表示整数序列的类模板。\n\n**[问题 45]\
    \ 的解答](#part0000_split_008.html_x1-50001r45)**\n\n该类模板是 `std::integer_sequence`，当它作为函数模板的参数时，定义序列的参数包可以被推导并在包展开中使用的。\n\
    \n```cpp\ntemplate<class T, T... I>\nstruct integer_sequence \n{ \n    typedef\
    \ T value_type; \n    static constexpr size_t size() noexcept\n    { \n      return\
    \ sizeof...(I); \n    } \n};\n```\n注意 `T` 是一个整数类型。\n```cpp\n#include <utility>\n\
    #include <type_traits>\n\n// 生成空整数序列\nstatic_assert(std::integer_sequence<int>::size()\
    \ == 0, \"size of integer_sequence<int> should be zero\");\n\n// 生成 int: 0, 1,\
    \ 2, 3, 4, 5\nstatic_assert(std::integer_sequence<int, 0, 1, 2, 3, 4, 5>::size()\
    \ == 6, \"\");\nstatic_assert(std::is_same<std::integer_sequence<int>::value_type,\
    \ int>::value, \"\");\n\n// 生成 unsigned short: 3, 8\nusing ushort = std::integer_sequence<unsigned\
    \ short, 3, 8>;\nstatic_assert(std::is_same<ushort::value_type, unsigned short>::value,\
    \ \"\");\nstatic_assert(ushort::size() == 2, \"\");\nstatic_assert(std::is_same<std::integer_sequence<bool>::value_type,\
    \ bool>::value, \"\");\n```\n遗憾的是，以下程序在 gcc 4.9 和 clang 4.5 trunk 中都可以编译（在本文写作时的\
    \ `libstdc++` 和 `libc++` 均如此）：\n```cpp\n#include <utility>\nusing float_seq =\
    \ std::integer_sequence<float>;\nfloat_seq::value_type fv;\n```\n这会导致编译失败，因为 `float`\
    \ 不是整数类型。我希望未来能通过引入类似 `static_assert` 和 `std::is_integral` 的简单代码来解决这个问题：\n```cpp\n\
