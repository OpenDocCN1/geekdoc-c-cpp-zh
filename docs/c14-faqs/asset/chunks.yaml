  trans: "\n\n`auto` 模板的显式特化或实例化必须使用 `auto`。非 `auto` 模板的显式特化或实例化不能使用 `auto`。\n\n```cpp\n\
    template <class T> auto f(T t) { return t; } // #1 \ntemplate auto f(int); //\
    \ OK\ntemplate char f(char); // error, no matching template\ntemplate<> auto f(double);\
    \ // OK, 未知返回类型的提前声明\n\ntemplate <class T> T f(T t) { return t; } // OK, 功能上与\
    \ #1 不等\ntemplate char f(char); // OK, 现在有匹配的模板\ntemplate auto f(float); // OK,\
    \ 匹配 #1\n```\n\n### 0.62 函数的返回类型推导\n\n#### 问题 62 函数的返回类型推导\n\n以下代码有效吗？\n\n程序 6：函数的返回类型推导\n\
    \n```cpp\nauto iterate(int len) \n{ \n  for (int i = 0; i < len; ++i) \n    if\
    \ (i == 10) \n      return i; \n  return -1; \n}\nint main() \n{ \n  iterate(15);\
    \ \n}\n```\n\n**问题 62 的答案**\n\n在 C++11 中无效。典型的错误可能是：\n\n```\nmultiple_return.cpp:1:1:\
    \ \nerror: ‘auto' return without trailing return type; \n      deduced return\
    \ types are a C++1y extension \nauto iterate(int len) \n^ \nerror generated.\n\
    ```\n\n在 C++11 中，对于仅包含单个返回语句的函数体，返回类型推导存在限制。但在 C++14 中是有效的。由于此处的两个返回语句都返回 `int`，我们可以完美地确定返回类型。\n\
    \n如果一个声明了返回类型且包含占位类型 `auto` 的函数有多个返回语句，则返回类型将对每个返回语句进行推导。在任何一种情况下，如果每次推导出的类型不相同，则程序将是不规范的（ill-formed）。\n\
    \n如果一个声明了返回类型且使用了占位类型的函数没有返回语句，则返回类型的推导方式就像在函数体结束括号处有一个没有操作数的返回语句。\n\n```cpp\n\
    auto f() { } // OK, 返回类型是 void\nauto* g() { } // error, 无法从 void() 推导出 auto*\n\
    ```\n\n如果需要一个具有未推导占位类型的实体类型来确定表达式的类型，则程序将是不规范的。但一旦在函数看到了返回语句，从该语句推导出的返回类型就可以在函数的其余部分使用，包括其他返回语句。\n\
    \n```cpp\nauto n = n; // error, n 的类型未知 \nauto f();\nvoid g() { &f; } // error,\
    \ f 的返回类型未知\nauto sum(int i) { \n  if (i == 1) \n    return i; // sum 的返回类型是 int\
    \ \n  else \n    return sum(i-1)+i; // OK, sum 的返回类型已完成推导 \n}\n```\n\n### 0.63\
    \ Lambda 表达式的返回类型推导\n\n#### 问题 63 Lambda 的返回类型推导\n\n以下代码有效吗？有效，lambda 的返回类型是什么？\n\
    \n程序 7：lambda 的返回类型推导\n\n```cpp\nstruct A {\n  int f();\n  const int& g();\n};\n\
    \ntemplate <class T>\nvoid h () {\n  [](T t, bool b) {\n    if (b)\n      return\
    \ t.f();\n    else\n      return t.g();\n  };\n}\ntemplate void h<A>();\n```\n\
    \n**问题 63 的答案**\n\n是的，这是法的代码，lambda 的返回类型为 `int`。之前“lambda 的返回类型只有在正体由单个返回语句组成时才能被推导”的限制已被取消。特别是，如果多个返回语句都返回相同类型，则允许多个返回语句。\n\
    \n### 0.64 Lambda 表达式的返回类型推导\n\n#### 问题 64 Lambda 的返回类型\n\n以下 lambda 的返回类型是什么？\n\
    \n程序 8：lambda 的返回类型推导\n\n```cpp\nauto x1 = [](int i){ return i; };\nauto x2 =\
    \ [] { return {1, 2}; };\nint j;\nauto x3 = []()->auto&&{ return j; };\n```\n\n\
    `clang++ 3.5` 给出了以下错误：\n\n```\nlambda_return.cpp:2:22: \nerror: cannot deduce\
    \ lambda return type from initializer list\nauto x2 = [] { return {1, 2}; }; \n\
    \             ~~~~~~~ \nerror generated.\n```\n\nlambda 的返回类型是 `auto`，它将通过尾随返回类型替换，或者或从返回语句中推导。因此，`auto`\
    \ 在尾随返回类型中是被允许的，因为这是指定 lambda 返回推导出的引用类型的唯一方法：\n\n```cpp\n[]()->auto&{ return\
    \ f(); }\n```\n\n对于 `x1`，返回类型是 `int`。对于 `x3`，返回类型是 `int&`。禁止从初始化列表（initializer-list）推导。尽管声明为\
    \ `auto` 并用大括号初始化列表初始化的变量会获得 `std::initializer_list` 类型，但它不允许作为函数返回类型，因为底层数组分配在栈上，它在返回时会立即泄漏，且对返回值的任何使用都将未定义行为。\n\
    \n### 0.65 decltype(auto)\n\n#### 问题 65 decltype(auto)\n\n`decltype(auto)` 是什么？\n\
    \n对于表达式 `e`，`decltype(auto)` 的定义如下：\n\n- 如果 `e` 是未带括号的标识符或成员访问，`decltype(auto)`\
    \ 是 `e` 的类型。如果没有这样的实体，或者 `e` 指向重载函数，则程序是不规范的；\n- 如果 `e` 是右值（xvalue），`decltype(auto)`\
    \ 是 `T&&`，其中 `T` 是 `e` 的类型；\n- 如果 `e` 是左值（lvalue），`decltype(auto)` 是 `T&`，其中 `T`\
    \ 是 `e` 的类型；\n- 否则，`decltype(auto)` 是 `e` 的类型。\n\n```cpp\nconst int&& foo();\n\
    int i;\nstruct A { double x; };\nconst A* a = new A();\ndecltype(foo()) x1; //\
    \ 类型是 const&&\ndecltype(i) x2; // 类型是 int\ndecltype(a) x3; // 类型是 A*\ndecltype(auto)\
    \ x;\n```\n\n`auto` 和 `decltype(auto)` 类型指定了一个占位类型，该类型将由初始化器或显式的尾随返回类型替换。如果函数声明符包含尾随返回类型，则它指定函数的返回类型。如果返回类型包含占位类型，则函数的返回类型从函数体中的返回语句推导。\n\
    \n变量 `auto` 或 `decltype(auto)` 类型由初始化器推导。这在块内、命名空间范围内以及初始化语句中是允许的。\n\n```cpp\n\
    auto x = 5; // OK: x 类型为 int\nconst auto* v = &x, u = 6; // OK: v 类型为 int*, u\
    \ 类型为 int\nstatic auto y = 0.0; // OK: y 类型为 double\nauto int r; // error: auto\
    \ 不是存储类说明符\nauto f() -> int; // OK: 返回 int\nauto g() { return 0.0; } // OK: 返回\
    \ double\nauto h(); // OK, h 的返回类型将在定义时推导\nauto x1 = {1, 2}; // decltype(x1) 是\
    \ std::initializer_list<int>\nauto x2 = {1, 2.0}; // error: 无法推导元素类型\n```\n\n\
    如果占位符是 `decltype(auto)` 类型说明符，则变量的声明类型或函数的返回类型应为占位符本身：\n\n```cpp\nint i;\nint&&\
    \ f();\nauto x3a = i; // decltype(x3a) 是 int\ndecltype(auto) x3d = i; // decltype(x3d)\
    \ 是 int\nauto x4a = (i); // decltype(x4a) 是 int\ndecltype(auto) x4d = (i); //\
    \ decltype(x4d) 是 int&\nauto x5a = f(); // decltype(x5a) 是 int\ndecltype(auto)\
    \ x5d = f(); // decltype(x5d) 是 int&&\nauto x6a = {1, 2}; // decltype(x6a) 是 std::initializer_list<int>\n\
    decltype(auto) x6d = {1, 2}; // error, {1, 2} 不是表达式\nauto *x7a = &i; // decltype(x7a)\
    \ 是 int*\ndecltype(auto)*x7d = &i; // error, 声明类型不是纯 decltype(auto)\n```\n\n"
- fmt: "\n# 0.66 return type deduction for function templates\n\n## Question 66 return\
    \ type deduction for function templates\n\nWhat is the rule of deduction for return\
    \ types in case of function templates with a placeholder?\n\n### SOLUTION OF QUESTION\
    \ 66\n\nReturn type deduction for a function template with a placeholder in its\
    \ declared type occurs when the definition is instantiated even if the function\
    \ body contains a return statement with a non-type-dependent operand.\n\nSo any\
    \ use of a specialization of the function template will cause an implicit instantiation.\
    \ Any errors that arise from this instantiation are not in the immediate context\
    \ of the function type, and can result in the program being ill-formed.\n\n```cpp\n\
    template <class T> auto f(T t) { return t; } // return type deduced at instantiation\
    \ time\ntypedef decltype(f(1)) fint_t; // instantiates f<int> to deduce return\
    \ type\ntemplate<class T> auto f(T* t) { return *t; }\nvoid g() { int (*p)(int*)\
    \ = &f; } // instantiates both ‘f’s to determine return types, chooses second\n\
    ```\n\nRedeclarations or specializations of a function or function template with\
    \ a declared return type that uses a placeholder type shall also use that placeholder,\
    \ not a deduced type.\n\n```cpp\nauto f();\nauto f() { return 42; } // return\
    \ type is int\nauto f(); // OK\nint f(); // error, cannot be overloaded with auto\
    \ f()\ndecltype(auto) f(); // error, auto and decltype(auto) don’t match\n\ntemplate\
    \ <typename T> auto g(T t) { return t; } // #1\ntemplate auto g(int); // OK, return\
    \ type is int\ntemplate char g(char); // error, no matching template\ntemplate<>\
    \ auto g(double); // OK, forward declaration with unknown return type\ntemplate\
    \ <class T> T g(T t) { return t; } // OK, not functionally equivalent to #1\n\
    template char g(char); // OK, now there is a matching template\ntemplate auto\
    \ g(float); // still matches #1\nvoid h() { return g(42); } // error, ambiguous\n\
    \ntemplate <typename T> struct A {\n  friend T frf(T);\n};\nauto frf(int i) {\
    \ return i; } // not a friend of A<int>\n```\n\n# 0.67 explicit instantiation\
    \ and auto\n\n## Question 67 explicit instantiation and auto\n\nReview the code\
    \ below:\n\n```cpp\ntemplate <typename T> auto f(T t) { return t; }\nextern template\
    \ auto f(int);\nint (*p)(int) = f;\n```\n\nAn explicit instantiation declaration\
    \ does not cause the instantiation of an entity declared using a placeholder type,\
    \ but it does not prevent that entity from being instantiated as needed to determine\
    \ its type. Hence the line below does not instantiate `f<int>`: `extern template\
    \ auto f(int);`.\n\nWhereas the next line instantiates `f<int>` to determine its\
    \ return type, but an explicit definition is still required somewhere: `int (*p)(int)\
    \ = f;`.\n\nLike `constexpr` functions, it can be necessary to instantiate an\
    \ `auto` function even if it is not used:\n```cpp\ntemplate <class T> auto f(T\
    \ t) { return t; } // return type deduced at instantiation time\ntypedef decltype(f(1))\
    \ fint_t; // instantiate f<int> to deduce return type\n```\n\nKindly note that\
    \ as far as SFINAE is concerned, since the return type is deduced by instantiating\
    \ the template, if the instantiation is ill-formed, this causes an error rather\
    \ than a substitution failure. This allows an `auto` function to return a lambda,\
    \ which is not possible using `decltype` pattern.\n\nThe declarator of a variable\
    \ declared with `auto` is not limited in the form of the declarator; the same\
    \ should be true of a function with deduced type. In particular, this is the only\
    \ way to deduce by reference:\n\n```cpp\ntemplate <class T> struct A {\n  static\
    \ T t;\n};\ntemplate <class T> auto& f() { return A::t; } // returns reference\n\
    ```\n\nTo allow this, we should use the same `auto` deduction rules for function\
    \ and lambda type that we do for `auto` variables. Such a function must have a\
    \ return statement, however, since there is no way to get `void` from `auto&`:\n\
    ```cpp\nauto& f() {} // error, no return statement\n```\n\n# 0.68 return type\
    \ deduction and virtual\n\n## Question 68 return type deduction and virtual\n\n\
    How return type deduction works with `virtual` functions?\n\nA function declared\
    \ with a return type that uses a placeholder type cannot be `virtual`. It would\
    \ be possible to allow return type deduction for `virtual` functions, but that\
    \ would complicate both override checking and vtable layout, so it seems preferable\
    \ to prohibit this. As a side note study the illegal code:\n\n```cpp\nauto h()\
