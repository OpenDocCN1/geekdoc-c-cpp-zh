    12       decltype(lambda_call_operator_invoker(declval<T>())) (*)(T); 


    13 


    14    template<class T> operator fptr_t<T>() const 


    15    { 


    16        return &lambda_call_operator_invoker; 


    17    } 


    18};


    If the generic lambda has no trailing-return-type or the trailing-return-type
    contains a placeholder type, return type deduction of the corresponding function
