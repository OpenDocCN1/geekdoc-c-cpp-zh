    0.84 C++14 Compiler\n\nBooks In Print\n\n### 0.1 variable templates\n\n#### Question\
    \ 1 variable template\nWhat is a variable template ?\n\nSOLUTION OF QUESTION\n\
    \nA variable template is a declaration which is introduced by a template declaration\
    \ of a variable. As we already know that a template declaration is also a definition\
    \ if its declaration defines a function, a class, a variable, or a static data\
    \ member.\n\nA variable template at class scope is a static data member template.\n\
    \nConsider a simple template meta function, which uses variable template feature\
    \ to store the boolean value of result of comparing two types:\n\n```cpp\ntemplate\
    \ <typename T, typename U>\nconstexpr bool is_same = std::is_same<T, U>::value;\n\
    \nbool t = is_same<int, int>; // true\nbool f = is_same<int, float>; // false\n\
    ```\n\nThe types of variable templates are not restricted to just built-in types;\
    \ they can be user defined types.\n\n```cpp\nstruct matrix_constants\n{\n    template<typename\
    \ T>\n    using pauli = hermitian_matrix<T, 2>;\n\n    template<typename T>\n\
    \    constexpr pauli<T> sigma1 = { { 0, 1 }, { 1, 0 } };\n\n    template<typename\
    \ T>\n    constexpr pauli<T> sigma2 = { { 0, -1i }, { 1i, 0 } };\n\n    template<typename\
    \ T>\n    constexpr pauli<T> sigma3 = { { 1, 0 }, { -1, 0 } };\n};\n```\n\nIt\
    \ makes definitions and uses of parameterized constants much simpler, leading\
    \ to simplified and more uniform programming rules to teach and to remember like:\n\
    \n```cpp\ntemplate<typename T>\nstruct lexical_cast_fn\n{\n    template<typename\
    \ U>\n    T operator()(U const &u) const\n    {\n        //...\n    }\n};\n\n\
    template<typename T>\nconstexpr lexical_cast_fn<T> lexical_cast{};\n\nint main()\n\
    {\n    lexical_cast<int>(\"42\");\n}\n```\n\n### 0.2 Constexpr static data members\
    \ of class templates\n\n#### Question 2 Constexpr static data members of class\
    \ templates\nWhat is issue with constexpr static data members of class templates\
    \ ?\n\nSOLUTION OF QUESTION\n\nLet us revisit how `std::is_same` is designed:\n\
    \n```cpp\ntemplate<typename T, T v>\nstruct integral_constant\n{\n    static constexpr\
    \ T value = v;\n    typedef T value_type;\n};\n\ntemplate<typename T, T v>\nconstexpr\
    \ T integral_constant<T, v>::value;\ntypedef integral_constant<bool, true> true_type;\n\
    typedef integral_constant<bool, false> false_type;\n\ntemplate<typename T, typename\
    \ U>\nstruct is_same: false_type{};\n\ntemplate<typename T>\nstruct is_same<T,\
    \ T>: true_type{};\n```\n\nThe main problems with static member are:\n- they require\
    \ duplicate declarations:\n    1. once inside the class template,\n    2. once\
    \ outside the class template to provide the real definition in case odr(One Definition\
    \ Rule) used.\n- It creates confusion by the necessity of providing twice the\
    \ same declaration, whereas ordinary constant do not need.\n\nThe standard class\
    \ `numeric_limits` suffers from the same problem as far as constexpr data members\
    \ are concerned.\n\n### 0.3 constexpr function templates\n\n#### Question 3 constexpr\
    \ function templates\nWhat is issue with constexpr function templates ?\n\nSOLUTION\
    \ OF QUESTION\n\nconstexpr functions templates provide functional abstraction.\
    \ A simple constexpr function:\n\n```cpp\ntemplate <typename T, typename U>\n\
    constexpr bool is_same()\n{\n    return std::is_same<T, U>::value;\n}\n```\n\n\
    However, they force us to chose in advance, at the definition site, how the constants\
    \ are to be delivered: either by a const reference, or by plain non-reference\
    \ type. If delivered by const reference then the constants must systematically\
    \ be allocated in static storage. If by non-reference type, then the constants\
    \ need copying. Copying isn’t an issue for built-in types, but it is an issue\
    \ for user-defined types with value semantics that aren’t just wrappers around\
    \ built-in types. Whereas ordinary constexpr variables do not suffer from this\
    \ problem. A simple definition is provided, and the decision of whether the constants\
    \ actually needs to be layout in storage depends on the usage.\n\nAnother examples\
    \ are the static member functions of `std::numeric_limits` and functions like\
    \ `boost::constants::pi<T>()`:\n\n```cpp\n#include <boost/math/constants/constants.hpp>\n\
    \ntemplate <class Real>\nReal area(Real r)\n{\n    using namespace boost::math::constants;\n\
    \    return pi<Real>() * r * r;\n}\n```\n\nThe function template versions of the\
    \ constants are simple inline functions that return a constant of the correct\
    \ precision for the type used. In addition, these functions are declared `constexpr`\
    \ for those compilers that support this, allowing the result to be used in constant\
    \ expressions provided the template argument is a literal type. It looks like\
    \ we are creating constexpr functions only to return a constant.\n\n### 0.4 variable\
    \ templates in action\n\n#### Question 4 variable templates in action\nIllustrate\
    \ how variable templates can be used to compute the area of a circle for a given\
    \ type with appropriate precision?\n\nSOLUTION OF QUESTION\n\nvariable templates\
    \ address both of the issues illustrated before and no syntax modification was\
    \ required to incorporate this feature in C++11 because current grammar allows\
    \ any declaration to be parameterized. It was prohibited earlier via semantic\
    \ constraints which is relaxed now.\n\nLet us first represent the mathematical\
    \ constant π with precision dictated by a floating point datatype:\n\nProgram\
    \ 1: π and variable template\n\n```cpp\n#include <iostream>\n#include <iomanip>\n\
    \ntemplate<typename T>\nconstexpr T pi= T(3.1415926535897932385);\n\nint main()\n\
    {\n    std::cout << std::setprecision(40);\n    std::cout << \"pi<int> : \" <<\
    \ pi<int> << std::endl;\n    std::cout << \"pi<float> : \" << pi<float> << std::endl;\n\
    \    std::cout << \"pi<double> : \" << pi<double> << std::endl;\n}\n```\n\nWith\
    \ the following command:\n`clang++ -std=c++11 variable_template.cpp`\n\nwe get\
    \ the following output:\npi<int> : 3\npi<float> : 3.1415927410125732421875\npi<double>\
    \ : 3.14159265358979311599796346854418516159\n\nThis variable template can be\
    \ used in a generic function to compute the area of a circle for a given radius:\n\
    \n```cpp\ntemplate<typename T>\nT area_circle(T r)\n{\n    return pi<T> * r *\
    \ r;\n}\n```\n\n### 0.5 static data member template\n\n#### Question 5 static\
    \ data member template\nProvide a suitable definition of the static data member\
    \ template:\n\nSOLUTION OF QUESTION\n\nAs we already know that a variable template\
    \ at class scope is a static data member template and a definition for a static\
    \ data member or static data member template may be provided in a namespace scope\
    \ enclosing the definition of the static member’s class template.\n\n```cpp\n\
    struct limits\n{\n    template<typename T>\n    static const T min; // declaration\
    \ of min\n};\n\ntemplate<typename T>\nconst T limits::min = {}; // definition\
    \ of min\n```\n\n### 0.6 specialization of variable template\n\n#### Question\
    \ 6 specialization of variable template\n"
