  trans: "\n\n`B().getA()` 选择了非 const 重载版本，导致了此错误。\n\n将代码渲染为如下形式：\n\n```cpp\n#include\
    \ <iostream> \n\nstruct A \n{ \n    constexpr A() : n(3) {} \n    constexpr int\
    \ getN() const { return n; } \n\n    int n; \n}; \n\nstruct B \n{ \n    constexpr\
    \ B() : a() {} \n    constexpr const A &getA() const \n    { \n        return\
    \ a; \n    } \n    constexpr A &getA() \n    { \n        return a; \n    } \n\n\
    \    A a; \n}; \n\nint main() \n{ \n    constexpr int n = B().getA().getN(); \n\
    }\n```\n\n在 C++11 下我们得到以下编译器错误：`clang++ -std=c++11`\n\n```\nconstexpr_implicit_const1.cpp:19:18:\
    \ \nwarning: 'constexpr' non-static member function will not be implicitly 'const'\
    \ in C++1y; \n      add 'const' to avoid a change in behavior [-Wconstexpr-not-const]\
    \ \n    constexpr A &getA() \n               ^ \n               const\nconstexpr_implicit_const1.cpp:19:18:\
    \ \nerror: functions that differ only in their return type cannot be overloaded\n\
    constexpr_implicit_const1.cpp:15:24: \nnote: previous declaration is here \n \
    \   constexpr const A &getA() const \n                   ^ \nconstexpr_implicit_const1.cpp:21:16:\
    \ \nerror: binding of reference to type 'A' to a value of type 'const A' drops\
    \ qualifiers \n    return a; \n             ^ \n1 warning and 2 errors generated.\n\
    ```\n\n它指向了几个问题，包括在 C++11 中 `constexpr` 成员函数是隐式 `const` 的限制，这为希望既可以在常量表达式内部也可以外部使用的字面量类型（literal\
    \ class types）带来了麻烦。\n\n因此在 C++14 中，这一规则被删除了。所以它在符合 C++14 的编译器（如 `clang 3.5 trunk`）上运行良好。\n\
    \n### 0.17 constexpr 构造函数与初始化\n\n**问题 17 constexpr 构造函数与初始化**\n\n查看该程序：\n\n```cpp\n\
    int x; \n\nstruct A \n{ \n    constexpr A(bool b) : m(b?42:x) {} \n    int m;\
    \ \n}; \n\nconstexpr int v = A(true).m; \n\nconstexpr int w = A(false).m;\n```\n\
    \n使用 `gcc 4.9 trunk` 的编译器错误为：\n\n```\nconstexpr_constructor.cpp:1:28: \nin expansion\
    \ of 'A(0)'\nconstexpr_constructor.cpp:1:28: \nerror: the value of 'x' is not\
    \ usable in a constant expression \n    constexpr int w = A(false).m; \n     \
    \          ^\nconstexpr_constructor.cpp:1:5: \nnote: 'int x' is not const \nint\
    \ x; \n  ^\n```\n\n使用 `clang 3.5 trunk` 的编译器错误为：\n\n```\nconstexpr_constructor.cpp:1:15:\
    \ \nerror: constexpr variable 'w' must be initialized by a constant expression\
    \ \n    constexpr int w = A(false).m; \n               ~~~~~~~~\nconstexpr_constructor.cpp:5:34:\
    \ \nnote: read of non-const variable 'x' is not allowed in a constant expression\
    \ \n    constexpr A(bool b) : m(b?42:x) {} \n                       ^\nconstexpr_constructor.cpp:11:19:\
    \ \nnote: call to 'A(false)' \n    constexpr int w = A(false).m; \n          \
    \     ^\nconstexpr_constructor.cpp:1:5: \nnote: declared here \n```\n\n"
- fmt: "\nSo the error is because it declares the same member function twice with\
    \ different return types.\n\nTypical error is, which is self-explanatory:\n\n\
    ```cpp\nconstexpr_memfn.cpp:4:10: \nerror: functions that differ only in their\
    \ return type \n    cannot be overloaded \n    int &f(); \n      ^\nconstexpr_memfn.cpp:3:26:\
    \ note: previous declaration is here \n    constexpr const int &f(); \n      \
    \                ^\n1 error generated.\n```\n\n### 0.23 deprecated attribute\n\
    \n#### Question 23 deprecated attribute\n\nDescribe a mechanism to mark the usage\
    \ of the class `A` and the function `func1` deprecated.\n\n```cpp\nclass A1 {};\n\
    \nvoid func1() {}\n\nint main()\n{\n    A1 a;\n    func1();\n}\n```\n\n#### SOLUTION\
    \ OF QUESTION 23\n\nC++14 introduced an attribute `[[deprecated]]` to do the needful.\
    \ So we can rewrite the above code as:\n\n```cpp\nclass [[deprecated]] A1 {};\n\
    \n[[deprecated]]\nvoid func1() {}\n\nint main()\n{\n    A1 a;\n    func1();\n\
    }\n```\n\nCompiler diagnostic messages with clang 3.5 trunk:\n\n```text\ndeprecated_attribute.cpp:8:5:\
    \ warning: ‘A1’ is deprecated \n    [-Wdeprecated-declarations] \n    A1 a; \n\
    \    ^\ndeprecated_attribute.cpp:1:22: \nnote: ‘A1’ has been explicitly marked\
    \ deprecated \n  here\nclass [[deprecated]] A1 {}; \n                  ^\ndeprecated_attribute.cpp:9:5:\
    \ warning: ‘func1’ is deprecated \n    [-Wdeprecated-declarations] \n    func1();\
    \ \n    ^\ndeprecated_attribute.cpp:4:6: \nnote: ‘func1’ has been explicitly marked\
    \ \n  deprecated here\nvoid func1() {} \n    ^\n2 warnings generated.\n```\n\n\
    With gcc 4.9 trunk:\n\n```text\ndeprecated_attribute.cpp: In function ‘int main()’:\n\
    deprecated_attribute.cpp:8:8: \nwarning: ‘A1’ is deprecated \n(declared at deprecated_attribute.cpp:1)\
    \ \n[-Wdeprecated-declarations] \n    A1 a; \n      ^\ndeprecated_attribute.cpp:9:5:\
    \ \nwarning: ‘void func1()’ is deprecated \n(declared at deprecated_attribute.cpp:4)\
    \ \n[-Wdeprecated-declarations] \n    func1(); \n    ^\ndeprecated_attribute.cpp:9:11:\
    \ \nwarning: ‘void func1()’ is deprecated \n(declared at deprecated_attribute.cpp:4)\
    \ \n[-Wdeprecated-declarations] \n    func1(); \n    ^\n```\n\nThe diagnostic\
    \ message can be customized by passing a literal string as an argument to `[[deprecated]]`:\n\
    \n```cpp\nclass [[deprecated(\"Usage of class A is deprecated. Please class X\
    \ instead.\")]] A1 {};\n\n[[deprecated(\"Usage of func1 is deprecated. Please\
    \ use func2 instead.\")]]\nvoid func1() {}\n\nint main()\n{\n    A1 a;\n    func1();\n\
    }\n```\n\ngcc 4.9 trunk yields now:\n\n```text\ndeprecated_attribute_msg.cpp:\
    \ In function ‘int main()’:\ndeprecated_attribute_msg.cpp:8:8: \nwarning: ‘A1’\
    \ is deprecated \n(declared at deprecated_attribute_msg.cpp:1) \nUsage of class\
    \ A is deprecated. Please class X instead.\n[-Wdeprecated-declarations] \n   \
    \ A1 a; \n      ^\ndeprecated_attribute_msg.cpp:9:5: \nwarning: ‘void func1()’\
    \ is deprecated \n(declared at deprecated_attribute_msg.cpp:4) \nUsage of func1\
    \ is deprecated. Please use func2 instead.\n[-Wdeprecated-declarations] \n   \
    \ func1(); \n    ^\ndeprecated_attribute_msg.cpp:9:11: \nwarning: ‘void func1()’\
    \ is deprecated \n(declared at deprecated_attribute_msg.cpp:4) \nUsage of func1\
    \ is deprecated. Please use func2 instead.\n[-Wdeprecated-declarations] \n   \
    \ func1(); \n    ^\n```\n\nThe `deprecated`-token can be used to mark names and\
    \ entities whose use is still allowed, but discouraged for some reason. The attribute\
    \ may be applied to the declaration of:\n- a `class`\n- a `typedef-name`\n- a\
    \ `variable`\n- a `non-static data member`\n- a `function`\n- an `enumeration`\n\
    - a `template specialization`\n\nA name or entity declared without the `deprecated`\
    \ attribute can later be redeclared with the attribute and vice-versa.\n\n```cpp\n\
    class A;\nclass [[deprecated]] A;\n\nclass A{};\n\nint main()\n{\n    A a;\n}\n\
    ```\nCompiler issues proper diagnostic. Thus, an entity declared without the attribute\
    \ can be marked as deprecated by a subsequent redeclaration.\n\nHowever, after\
    \ an entity is marked as deprecated, later redeclarations do not un-deprec the\
    \ entity. So for the code below, compiler still issues the relevant diagnostics:\n\
    \n```cpp\nclass [[deprecated]] A;\nclass A;\n\nclass A{};\n\nint main()\n{\n \
    \   A a;\n}\n```\n\nRedeclarations using different forms of the attribute (with\
    \ or without the `attribute-argument-clause` or with different `attribute-argument-clauses`)\
    \ are allowed:\n\n```cpp\nclass [[deprecated]] A;\nclass [[deprecated(\"Do not\
    \ use A.\")]] A;\nclass [[deprecated(\"A is dangerous.\")]] A;\n\nclass A{};\n\
    \nint main()\n{\n    A a;\n}\n```\nCompiler issues diagnostic message for the\
    \ last one:\n\n```text\ndeprecated_redeclare.cpp:9:5: \nwarning: ‘A’ is deprecated:\
    \ A is dangerous. \n    [-Wdeprecated-declarations] \n    A a; \n    ^\ndeprecated_redeclare.cpp:5:7:\
    \ \nnote: ‘A’ has been explicitly marked deprecated \n  here\nclass A{}; \n  ^\n\
    warning generated.\n```\n\n### 0.24 Member initializers and aggregate class\n\n\
    #### Question 24 Memberizers and aggregates\n\nWhat is the output of the program?\n\
    \n```cpp\n#include <iostream>\n\nstruct Univ {\n    std::string name;\n    int\
    \ rank;\n    int i;\n    std::string city = \"unknown\";\n    char c = city[rank];\n\
    };\n\nint main()\n{\n    Univ u = {\"Columbia\", 3};\n    std::cout << u.name\
    \ << \" \" << u.rank << \" \" << u.i << \" \" << u.c << \"\\n\";\n}\n```\n\nKindly\
    \ note that the class `Univ` is an aggregate because it satisfies all the criteria\
    \ ahead it has:\n- no user-provided constructors\n- no private or protected non-static\
    \ members\n- no base classes\n- no virtual functions\n\nIf there are fewer initializer-clauses\
    \ in the list than there are members in the aggregate, then each member not initialized\
    \ will be initialized from:\n- its `brace-or-initializer`,\n- an empty initializer\
    \ list if there is no brace-or-initializer.\n\nHence:\n- `u.name` is initialized\
    \ with `Columbia`\n- `u.rank` with `3`\n- `u.i` with the value of an expression\
    \ `int{}`, that is `0`\n- `u.city` with `unknown`\n- `u.c` with the value of `u.city[rank]`,\
    \ i.e., with the character at the 3rd index of the string, i.e., with `n`.\n\n\
    To summarize, it prints: `Columbia 3 0 unknown n`\n\n### 0.25 Member initializers\
    \ and aggregate array\n\n#### Question 25 Member initializers and aggregates\n\
    \nDoes `a` have two elements or three? Is actually possible to override the default\
    \ value for `k`? What are the values of `a[0].k` and `a[1].k`?\n\n```cpp\nstruct\
    \ X { int i, j, k = 42 };\nX a[] = {1, 2, 3, 4, 5, 6};\n```\n\n```cpp\n#include\
    \ <iostream>\n\nstruct X { int i, j, k = 42 };\n\nX a[] = {1, 2, 3, 4, 5, 6};\n\
    \nint main()\n{\n    size_t len = sizeof(a)/sizeof(a[0]);\n    std::cout << \"\
    size of a is : \" << len << std::endl;\n    std::cout << \"a[0].k : \" << a[0].k\
    \ << std::endl;\n    std::cout << \"a[1].k : \" << a[1].k << std::endl;\n}\n```\n\
    It simply prints:\n```text\nsize of a is : 2\na[0].k : 3\na[1].k : 6\n```\nSo\
    \ `a` is equivalent to `b`:\n\n### 0.26 Data Member initializers\n\n#### Question\
    \ 26 Data Member initializers\n\nIn the program below, how should `a.x.b` be initialized\
    \ here?\n\n```cpp\n#include <iostream>\n\nstruct A {\n    struct X { int a, b;\
    \ };\n    X x = {1, 2};\n    int n;\n};\n\nint main()\n{\n    A a = {{10}, 5};\n\
    \    std::cout << a.x.b << std::endl;\n}\n```\n"
