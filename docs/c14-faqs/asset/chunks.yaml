  trans: "\n\n```cpp\nusing aligned_storage_t = typename aligned_storage<Len,Align>::type;\n\
    \ntemplate <std::size_t Len, class... Types>\nusing aligned_union_t = typename\
    \ aligned_union<Len,Types...>::type;\n\ntemplate <class T>\nusing decay_t = typename\
    \ decay<T>::type;\n\ntemplate <bool b, class T=void>\nusing enable_if_t = typename\
    \ enable_if<b,T>::type;\n\ntemplate <bool b, class T, class F>\nusing conditional_t\
    \ = typename conditional<b,T,F>::type;\n\ntemplate <class... T>\nusing common_type_t\
    \ = typename common_type<T...>::type;\n\ntemplate <class T>\nusing underlying_type_t\
    \ = typename underlying_type<T>::type;\n\ntemplate <class T>\nusing result_of_t\
    \ = typename result_of<T>::type;\n```\n\n### 0.32 作为函数参数的 `unique_ptr` vs `make_unique`\n\
    \n#### 问题 32：作为函数参数的 `unique_ptr` vs `make_unique`\n\n查看下代码：\n\n```cpp\n#include\
    \ <iostream>\n\ntemplate<typename T1, typename T2>\nvoid f(T1 *a, T2 *b)\n{}\n\
    \nstruct A\n{\n    A() { std::cout << \"A()\" << std::endl; }\n    ~A() { std::cout\
    \ << \"~A()\" << std::endl; }\n};\n\nstruct B\n{\n    B() { std::cout << \"B()\"\
    \ << std::endl; }\n    ~B() { std::cout << \"~B()\" << std::endl; }\n};\n\nint\
    \ main()\n{\n    f(new A, new B);\n}\n```\n\n#### 问题 [32] 的解决方案\n\n假设没有抛出异常，那么通过调用\
    \ `new A` 和 `new B` 分配的内存将会泄漏，正如程序输出所示：\n\n```text\nA()\nB()\n```\n\n析构函数未被调用。典型的内存泄漏。此外，它还遭受了函数参数求值顺序不确定相关的问题，如下所示。\n\
    \n**立即补救**：作为快速修复，假设将代码修改为使用 `std::unique_ptr` 代替原始指针：\n\n```cpp\n#include <iostream>\n\
    #include <memory>\n\ntemplate<typename T1, typename T2>\nvoid f(std::unique_ptr<T1>\
    \ a, std::unique_ptr<T2> b)\n{}\n\nstruct A\n{\n    A() { std::cout << \"A()\"\
    \ << std::endl; }\n    ~A() { std::cout << \"~A()\" << std::endl; }\n};\n\nstruct\
    \ B\n{\n    B() { std::cout << \"B()\" << std::endl; }\n    ~B() { std::cout <<\
    \ \"~B()\" << std::endl; }\n};\n\nint main()\n{\n    f(std::unique_ptr<A>(new\
    \ A), std::unique_ptr<B>(new B));\n}\n```\n\n现在打印输出：\n\n```text\nA()\nB()\n~B()\n\
    ~A()\n```\n\n所以这次没有泄漏？传递给函数的参数的求值顺序是不确定的。我们知道调用 `new A` 至少会触发 2 次调用：用于分配内存的 `operator\
    \ new`，随后是调用 `A` 的构造函数。让我们假设 `unique_ptr` 的构造求值发生在最后。\n\n假设在评估 `new B` 时 `new\
    \ A` 成功，但 `operator new` 或对 `B` 构造函数的调用抛出了某些异常，那么 `A` 的内存将泄漏。`B` 也是如此。假设求值顺序如下：先调用\
    \ `A` 的 `operator new` 然后是 `B`，调用 `A` 的构造函数 然后是 `B`。如果 `A` 或 `B` 的构造函数失败，则分别泄漏\
    \ `B` 或 `A` 的内存。因此，在参数求值期间发生任何异常，由于求值顺序不确定，存在内存泄漏的可能性。\n\n因此，我们想要的是提供具有完美转发的函数模板（因为用户将从函数外部传递\
    \ `new`），该模板负责完成对象的分配、构造以及 `unique_ptr` 的构造工作。庆幸的是，C++14 提供了一个完美转发的变长参数函数模板 `make_unique`。因此，最终代码看起来如下：\n\
    \n```cpp\n#include <iostream>\n#include <memory>\n\ntemplate<typename T1, typename\
    \ T2>\nvoid f(std::unique_ptr<T1> a, std::unique_ptr<T2> b)\n{}\n\nstruct A\n\
    {\n    A() { std::cout << \"A()\" << std::endl; }\n    ~A() { std::cout << \"\
    ~A()\" << std::endl; }\n};\n\nstruct B\n{\n    B() { std::cout << \"B()\" << std::endl;\
    \ }\n    ~B() { std::cout << \"~B()\" << std::endl; }\n};\n\nint main()\n{\n \
    \   f(std::make_unique<A>(), std::make_unique<B>());\n}\n```\n\n`make_unique`\
    \ 防止了由表达式 `f(std::unique_ptr<A>(new A), std::unique_ptr<B>(new B))` 触发的未确定求值顺序导致的泄漏，因为现在参数是两个函数调用，它们无论求值顺序如何都会执行。假设第一次调用成功而第二次调用失败（即抛出异常），则临时对象将正确清理。\n\
    \n"
- fmt: "\n# Unique Pointer Start\ncustom operator new called\nglobal operator new\
    \ called\nA’s constructor called\nA’s destructor called\ncustom operator delete\
    \ called\nglobal operator delete called\nUnique Pointer End\n\n# Shared Pointer\
    \ Start\nglobal operator new called\nA’s constructor called\nA’s destructor called\n\
    global operator delete called\nShared Pointer End\n\n## 0.35 make_unique and value\
    \ initialization\n\n### Question 35 make_unique and value initialization\n\nGiven\
    \ zero arguments, does `make_unique` make call to `new T()` for value-initialization\
    \ or to `new T` for default-initialization ?\n\n**SOLUTION OF QUESTION [35](#link-placeholder)**\n\
    \nIt makes call to `new T()` for value-initialization because of the following\
    \ reasons:\n\n* symmetry with `make_shared<T>()`,\n* consistency with the empty\
    \ parentheses in the function call `make_unique<T>()`,\n* predictability because\
    \ this is the expected result of a variadic implementation, and\n* safety because\
    \ it is safe to get zero instead of garbage. \"zero is a strict subset of garbage\"\
    .\n\nOccasionally, the use may be interested in default-initialization due to\
    \ performance. We already know that `make_unique<T>()` is faster than `make_shared<T>()`,\
    \ but quite often the cost of a dynamic memory allocation plus the corresponding\
    \ deallocation is much higher than the cost of value-initializing a single object.\n\
    \n## 0.36 make_unique and single object\n\n### Question 36 make_unique and single\
    \ object\n\nIllustrate the mechanism to manage single object’s dynamic memory\
    \ with `make_unique`.\n\n**SOLUTION OF QUESTION [36](#link-placeholder)**\n\n\
    Let us take a simple example:\n\n```cpp\n#include <memory>\n#include <cassert>\n\
    \nstruct A\n{\n  A() : b(false) {}\n  A(int, double&, char&&, void*) : b(true)\
    \ {}\n  bool b;\n};\n\nint main()\n{\n  int i = 0;\n  double d = 0.0;\n  char\
    \ c = 0;\n\n  std::unique_ptr<A> a = std::make_unique<A>(i, d, std::move(c), nullptr);\n\
    \n  assert( a != nullptr );\n  assert( a->b );\n\n```\n  a = std::make_unique<A>();\n\
    \  assert( a != nullptr );\n  assert( !a->b );\n}\n```\n\nIt works as expected,\
    \ all asserts are true.\n\nSame is the case for the following example:\n\n```cpp\n\
    #include <memory>\n#include <string>\n#include <cassert>\n\nint main()\n{\n  std::unique_ptr<int>\
    \ p1 = std::make_unique<int>(100);\n  assert ( *p1 == 100 );\n\n  p1 = std::make_unique<int>();\n\
    \  assert ( *p1 == 0 );\n\n  std::unique_ptr<std::string> p2 = std::make_unique<std::string>\
    \ (\"Chandra\");\n  assert ( *p2 == \"Chandra\" );\n\n  p2 = std::make_unique<std::string>();\n\
    \  assert( *p2 == \"\" );\n\n  p2 = std::make_unique<std::string>(10, 'c');\n\
    \  assert( *p2 == \"cccccccccc\" );\n}\n```\n\nTo understand the mechanism, let\
    \ us go through implementation of `make_unique` as far as managing single object’s\
    \ memory is concerned. Let us recall the interface:\n\n```cpp\ntemplate<class\
    \ T, class... Args>\nunique_ptr<T> make_unique(Args&&...);\n```\n\nAnd the implementation\
    \ looks like:\n\n```cpp\ntemplate<typename T, typename... Args>\ninline unique_ptr<T>\
    \ make_unique(Args&&... args)\n{\n  return unique_ptr<T>(new T(std::forward<Args>(args)));\n\
    }\n```\n\n## 0.37 make_unique and default initialization\n\n### Question 37 make_unique\
    \ and default initialization\n\nWrite a function which would do default initialization\
    \ with `make_unique` as far as managing single object’s memory is concerned.\n\
    \n**SOLUTION OF QUESTION [37](#link-placeholder)**\n\n```cpp\ntemplate<class T>\n\
    inline unique_ptr<T> make_unique_default_init()\n{\n  return unique_ptr<T>(new\
    \ T);\n}\n```\n\nTo understand it better, let us recall certain concepts like\
    \ default initialization, value initialization and zero initialization.\n\n* **zero\
    \ initialization**:\n    * if `T` is a scalar type, the object is initialized\
    \ to the value obtained by converting the integer literal `0` to `T`.\n    * if\
    \ `T` is a (possibly-qualified) non-union class type, each non-static data member\
    \ and each base-class subobject is zero-initialized and padding is initialized\
    \ to zero bits.\n    * if `T` is a (possibly-qualified) union type, the object’s\
    \ first non-static named data member is zero-initialized and padding is initialized\
    \ to zero bits.\n    * if `T` is an array type, each element is zero-initialized.\n\
    \    * if `T` is a reference type, no initialization is performed.\n* **default\
    \ initialization**:\n    * if `T` is a (possibly-qualified) class type, the default\
    \ constructor for `T` is called and the initialization is ill-formed if `T` has\
    \ no default constructor or overload resolution results in an ambiguity or in\
    \ a function that is deleted or inaccessible from the context of the initialization.\n\
    \    * if `T` is an array type, each element is default-initialized.\n    * otherwise,\
    \ no initialization is performed.\n    If a program calls for the default initialization\
    \ of an object of a const-qualified type `T`, `T` shall be a class type with a\
    \ user-provided default constructor.\n* **value initialization**:\n    * if `T`\
    \ is a (possibly-qualified) class type with either no default constructor or a\
    \ default constructor that is user-provided or deleted, then the object is default-initialized.\n\
    \    * if `T` is a (possibly-qualified) class type without a user-provided or\
    \ deleted default constructor, then the object is zero-initialized and the semantic\
    \ constraints for default-initialization are checked, and if `T` has a non-trivial\
    \ default constructor, the object is default-initialized.\n    * if `T` is an\
    \ array type, then each element is value-initialized.\n    * otherwise, the object\
    \ is zero-initialized.\n\nAn object that is value-initialized is deemed to be\
    \ constructed and thus labeled as constructed objects, objects for which the constructor\
    \ has completed, etc., even if no constructor is invoked for the object’s initialization.\n\
    \nA program that calls for default-initialization or value-initialization of an\
    \ entity of reference type is ill-formed. Every object of static storage duration\
    \ is zero-initialized at program startup before any other initialization takes\
    \ place.\n\nAn object whose initializer is an empty set of parentheses, i.e.,\
    \ `()`, shall be value-initialized. Since `()` is not permitted by the syntax\
    \ for initializer, the following is not the declaration of an object of class\
    \ `X`, but the declaration of a function taking no argument and returning an `X`:\n\
    \n```cpp\nX a();\n```\n\nIf no initializer is specified for an object, the object\
    \ is default-initialized. If no initialization is performed, an object with automatic\
    \ or dynamic storage duration has indeterminate value. Objects with static or\
    \ thread storage duration are zero-initialized. If the initializer is `()`, the\
    \ object is value-initialized.\n\n## 0.38 make_unique and array T[n]\n\n### Question\
