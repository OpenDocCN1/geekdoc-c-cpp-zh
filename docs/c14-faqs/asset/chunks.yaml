    }\n```\n\n### 0.30 Square Literal Operator\n\n#### Question 30 Square Literal\
    \ Operator\nImplement a literal with suffix `_square` that computes the square\
    \ of a given number, so that it can be used like: `const long double num = 25.5_square;`\n\
    \n```cpp\nconstexpr long double operator \"\" _square(long double num)\n{\n  \
    \  return num*num;\n}\n```\n\n### 0.31 Type Transformation Aliases\n\n#### Question\
    \ 31 Type Transformation Aliases\nSimplify the code below:\n```cpp\ntemplate<\
    \ class T >\nusing reference_t = typename conditional<\n    is_reference<T>::value,\n\
    \    T,\n    typename add_lvalue_reference<T>::type\n>::type;\n```\n\nIn a template\
    \ context, C++ requires that each metacall to a metafunction bear syntactic overhead\
    \ in the form of an introductory `typename` keyword, as well as the suffixed `::type`\
    \ as could be seen in the code snippet.\n\nFortunately, C++14 removes this burden\
    \ by providing a set of template aliases for the library’s Transformation Traits,\
    \ for example:\n```cpp\ntemplate <bool b, class T, class F>\nusing conditional_t\
    \ = typename conditional<b, T, F>::type;\n\ntemplate <class T>\nusing add_lvalue_reference_t\
    \ = typename add_lvalue_reference<T>::type;\n```\nSo, the code can be simplified\
    \ to:\n```cpp\ntemplate< class T >\nusing reference_t = conditional_t<\n    is_reference<T>::value,\n\
    \    T,\n    add_lvalue_reference_t\n>;\n```\n\nIn this light, further additions\
    \ are:\n\n- **const-volatile modifications**: `template <class T> using remove_const_t\
    \ = typename remove_const<T>::type;`, `template <class T> using remove_volatile_t\
    \ = typename remove_volatile<T>::type;`, `template <class T> using remove_cv_t\
    \ = typename remove_cv<T>::type;`, `template <class T> using add_const_t = typename\
    \ add_const<T>::type;`, `template <class T> using add_volatile_t = typename add_volatile<T>::type;`,\
    \ `template <class T> using add_cv_t = typename add_cv<T>::type;`\n\n- **reference\
    \ modifications**: `template <class T> using remove_reference_t = typename remove_reference<T>::type;`,\
    \ `template <class T> using add_lvalue_reference_t = typename add_lvalue_reference<T>::type;`,\
    \ `template <class T> using add_rvalue_reference_t = typename add_rvalue_reference<T>::type;`\n\
    \n- **sign modifications**: `template <class T> using make_signed_t = typename\
    \ make_signed<T>::type;`, `template <class T> using make_unsigned_t = typename\
    \ make_unsigned<T>::type;`\n\n- **array modifications**: `template <class T> using\
    \ remove_extent_t = typename remove_extent<T>::type;`, `template <class T> using\
    \ remove_all_extents_t = typename remove_all_extents<T>::type;`\n\n- **pointer\
    \ modifications**: `template <class T> using remove_pointer_t = typename remove_pointer<T>::type;`,\
    \ `template <class T> using add_pointer_t = typename add_pointer<T>::type;`\n\n\
    - **other transformations**: `template <size_t Len, std::size_t Align>`\n"
