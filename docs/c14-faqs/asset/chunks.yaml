  trans: "\n\n# 0.66 函数模板的返回类型推导\n\n## 问题 66：函数模板的返回类型推导\n\n对于带有占位符的函数模板，其返回类型的推导规则是什么？\n\
    \n### 问题 66 的答案\n\n对于在声明类型中包含占位符的函数模板，其返回类型的推导发生在定义被实例化时，即使函数体中包含一个带有非类型依赖操作数的\
    \ return 语句。\n\n因此，任何对函数模板特化版本的使用都会导致隐式实例化。由于此实例化产生的任何错误不在函数类型的直接范围内，并可能导致程序不合法（ill-formed）。\n\
    \n```cpp\ntemplate <class T> auto f(T t) { return t; } // 返回类型在实例化时推导\ntypedef\
    \ decltype(f(1)) fint_t; // 实例化 f<int> 以推导返回类型\ntemplate<class T> auto f(T* t)\
    \ { return *t; }\nvoid g() { int (*p)(int*) = &f; } // 实例化两个 ‘f’ 以确定返回类型，选择第二个\n\
    ```\n\n对于使用占位符类型的已声明返回类型的函数或函数模板的重声明或特化，也应使用该占位符，而不是推导出的类型。\n\n```cpp\nauto f();\n\
    auto f() { return 42; } // 返回类型为 int\nauto f(); // OK\nint f(); // 错误，不能与 auto\
    \ f() 重载\ndecltype(auto) f(); // 错误，auto 和 decltype(auto) 不匹配\n\ntemplate <typename\
    \ T> auto g(T t) { return t; } // #1\ntemplate auto g(int); // OK，返回类型为 int\n\
    template char g(char); // 错误，没有匹配的模板\ntemplate<> auto g(double); // OK，未知返回类型的前向声明\n\
    template <class T> T g(T t) { return t; } // OK，功能上不等同于 #1\ntemplate char g(char);\
    \ // OK，现在有匹配的模板\ntemplate auto g(float); // 仍然匹配 #1\nvoid h() { return g(42);\
    \ } // 错误，歧义\n\ntemplate <typename T> struct A {\n  friend T frf(T);\n};\nauto\
    \ frf(int i) { return i; } // 不是 A<int> 的友\n```\n\n# 0.67 显式实例化与 auto\n\n## 问题\
    \ 67：显式实例化与 auto\n\n查看下面的代码：\n\n```cpp\ntemplate <typename T> auto f(T t) { return\
    \ t; }\nextern template auto f(int);\nint (*p)(int) = f;\n```\n\n显式实例化声明不会导致使用占位符类型声明的实体实例化，但它并阻止该实体在确定其类型需要时被实例化。因此，下面这一行并没有实例化\
    \ `f<int>`：`extern template auto f(int);`。\n\n而下一行实例化了 `f<int>` 以确定其返回类型，但某些处仍需要一个显式定义：`int\
    \ (*p)(int) = f;`。\n\n就像 `constexpr` 函数一样，即使 `auto` 函数没有被使用，也有必要实例化：\n```cpp\n\
    template <class T> auto f(T t) { return t; } // 返回类型在实例化时推导\ntypedef decltype(f(1))\
    \ fint_t; // 实例化 f<int> 以推导返回类型\n```\n\n请注意，就 SFINAE（替换失败不是错误）而言，由于返回类型是通过实例化模板推导的，如果实例化是不合法的，这会导致错误而不是替换失败。这允许\
    \ `auto` 函数返回 lambda，而这在使用 `decltype` 模式是不可能的。\n\n用 `auto` 声明的变量声明符在形式上不受限制；对于具有推导类型的函数也应如此。特别是，这是通过引用进行推导的唯一方法：\n\
    \n```cpp\ntemplate <class T> struct A {\n  static T t;\n};\ntemplate <class T>\
    \ auto& f() { return A::t; } // 返回引用\n```\n\n为了允许这一点，我们应该对函数和 lambda 类型使用与处理 `auto`\
    \ 变量相同的 `auto` 推导规则。然而，这种函数必须有一个 return 语句，因为无法从 `auto&` 获得 `void`：\n```cpp\n\
    auto& f() {} // 错误，没有 return 语句\n```\n\n# 0.68 返回类型推导与虚函数\n\n## 问题 68：返回类型推导与虚函数\n\
    \n返回类型推导如何作用于 `virtual` 函数？\n\n使用使用占位符类型的返回类型声明的函数不能是 `virtual` 的。允许 `virtual`\
    \ 函数进行返回类型推导是可能的，但这会复杂重写检查和虚表布局，因此禁止这种做法似乎是优的。顺便研究这段非法代码：\n\n```cpp\nauto h()\
    \ { return h(); } // 错误，h 的返回类型未知\n```\n\n# 0.69 推导返回类型\n\n## 问题 69：推导返回类型\n\n\
    以下函数 `f1` 和 `g1` 的返回类型是什么？\n\n```cpp\nstd::string f();\nstd::string& g();\n\n\
    decltype(auto) f1() {\n  auto str = f();\n  return str;\n}\n\ndecltype(auto) g1()\
    \ {\n  auto str = g();\n  return(str);\n}\n```\n\n`f1` 返回 `std::string`。`g1` 返回\
    \ `std::string&`，它是局部变量 `str` 的引用。\n\n# 0.70 泛化 lambda 捕获\n\n## 问题 70：泛化 lambda\
    \ 捕获\n\n下面程序的输出是什么？\n\n程序 9：泛化捕获\n```cpp\n#include <iostream>\n\nint main() {\n\
    \  int x = 4;\n  auto y = [&r = x, x = x+1]() {\n    r += 2;\n    std::cout <<\
    \ \"r is \" << r << std::endl;\n    return x+2;\n  }();\n```\n\n输出 `r is 6`, `y\
    \ is 7`。在 C++14 中，lambda 捕获已泛化，可以在 lambda 对象内部定义任意变量。第二个 `x` 必须绑定到周围上下文。\n\n#\
    \ 0.71 泛型 lambda 与向量\n\n## 问题 71：泛型 lambda 与向量\n\n编写一个泛型代码来乘以给定向量的所有元素。使其适用于任意类型向量的任意。\n\
    \n在 C++11 之前，我们可以这样编写整数向量的乘：\n\n程序 10：函数对象\n```cpp\n#include <vector>\n#include\
    \ <algorithm>\n#include <iostream>\n\nint main() {\n  std::vector<int> v{1, 2,\
    \ 3, 4, 5};\n  auto prod = std::accumulate(v.begin(), v.end(), 1, std::multiplies<int>());\n\
    \  std::cout << \"product: \" << prod << std::endl;\n}\n```\n\n在 C++11 中，我们可以使用\
    \ lambda 如下编写：\n\n程序 11：lambda 与向量\n```cpp\n#include <vector>\n#include <algorithm>\n\
    #include <iostream>\n\nint main() {\n  std::vector<int> v{1, 2, 3, 4, 5};\n  auto\
    \ prod = std::accumulate(v.begin(), v.end(), 1,\n    [](int x, int y) { return\
    \ x * y; }\n  );\n  std::cout << \"product: \" << prod << std::endl;\n}\n```\n\
    \n为了泛化到任意类型，让我们写一个多态函数对象：\n\n程序 12：多态函数对象与向量\n```cpp\n#include <vector>\n#include\
    \ <algorithm>\n#include <iostream>\n\nconstexpr struct {\n  template< class X,\
    \ class Y>\n  auto operator () (X x, Y y) -> decltype(x*y) {\n    return x * y;\n\
    \  }\n} multOp{};\n\nint main() {\n  std::vector<int> v{1, 2, 3, 4, 5};\n  auto\
    \ prod = std::accumulate(v.begin(), v.end(), 1, multOp);\n  std::cout << \"product:\
    \ \" << prod << std::endl;\n}\n```\n"
- fmt: "\n```cpp\nstd::accumulate(v.begin(), v.end(), 1, multOp);\nstd::cout << \"\
    product : \" << prod << std::endl;\n}\n```\n\nWith C++14 generic lambda, we can\
