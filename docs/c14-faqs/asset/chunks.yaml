    \        {\n            t.Begin();\n        }\n    };\n\n    template <typename\
    \ T>\n    constexpr begin_fn<T> begin{};\n\n    struct Task\n    {\n        void\
    \ Begin()\n    {}\n    };\n}\n```\n\n### 0.77 在容器中查找空指针\n\n**问题 77 在容器中查找空指针**\n\
    \n编写一个函数 `findNull`，它将针对给定的指针容器返回一个指向第一个空指针的迭代器，如果没有找到，则返回结束迭代器。\n\n问题解答 77\n\n\
    在 C++98 中，典型的代码看起来如下：\n\n```cpp\n#include <iostream>\n#include <vector>\n\ntemplate<typename\
    \ Container>\ntypename Container::const_iterator findNull(const Container &c)\n\
    {\n    typename Container::const_iterator iter;\n    for (iter = c.begin(); iter\
    \ != c.end(); ++iter)\n        if (*iter == 0)\n            break;\n\n    return\
    \ iter;\n}\n\nint main()\n{\n    int a = 10, b = 20, c = 30, d = 40;\n\n    std::vector<int\
    \ *> v;\n\n    v.push_back(&a);\n    v.push_back(&b);\n    v.push_back(&c);\n\
    \    v.push_back(0);\n    v.push_back(&d);\n\n    std::vector<int *>::const_iterator\
    \ cit = findNull(v);\n\n    if (cit == v.end())\n        std::cout << \"null pointers\
    \ in v\" << std::endl;\n    else {\n        std::vector<int *>::difference_type\
    \ pos = cit - v.begin();\n        std::cout << \"null pointer found at \" << pos\
    \ << std::endl;\n    }\n}\n```\n\n输出 `null pointer found at 3`。这很繁琐。在 C++11 中，我们可以简化这一点。客户端代码如下：\n\
    \n```cpp\nint main()\n{\n    int a = 10, b = 20, c = 30, d = 40;\n\n    std::vector<int\
    \ *> v {&a, &b, &c, 0, &d};\n\n    auto cit = findNull(v);\n\n    if (cit == v.end())\n\
    \    std::cout << \"null pointers in v\" << std::endl;\n    else {\n        auto\
    \ pos = cit - v.begin();\n        std::cout << \"null pointer found at \" << pos\
    \ << std::endl;\n    }\n}\n```\n\n让我们回顾一个与标记返回类型相关的经典问题，因为有时返回类型无法以通常的方式表示：\n\n\
    ```cpp\n// 返回两个未知类型乘积的函数模板\ntemplate<typename T, typename U>\n??? product(const\
    \ T &t, const U &u)\n{\n    return t * u;\n}\n```\n\n在这种情况下，`auto`、`decltype`\
    \ 和尾随返回类型提供了 C++11 的唯一解决方案：\n\n```cpp\n// 返回两个未知类型乘积的函数模板\ntemplate<typename T,\
    \ typename U>\nauto product(const T &t, const U &u)\n  -> decltype(t * u)\n{\n\
    \    return t * u;\n}\n```\n\n所以我们可以这样用 C++11 重写我们的 `findNull` 函数：\n\n```cpp\n\
    template<typename Cont>\nauto findNull(const Cont &c)\n  -> decltype(c.begin())\n\
    {\n    auto it = c.begin();\n    for (; it != c.end(); ++it)\n        if (*it\
    \ == 0)\n            break;\n    return it;\n}\n```\n\n这就是我们在 C++11 中能做的全部了吗？\n\
    \n幸运的是，有非成员 `begin`/`end`，它们是 `begin()` 和 `end()` 的新形式，甚至适用于原生数组，因此更具通用性。\n\n\
    ```cpp\n#include <iostream>\n#include <cstring>\n#include <vector>\n#include <algorithm>\n\
    \nbool strLenGT4(const char *s) { return std::strlen(s) > 4; }\n\nint main()\n\
    {\n    // 应用于 STL 容器：\n```\n\n"
