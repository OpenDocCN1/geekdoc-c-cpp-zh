  trans: "\n\n简化下面的程序以实现所需功能：\n\n```cpp\ntemplate <typename T, typename U>\nconstexpr\
    \ bool is_same = std::is_same<T, U>::value;\n\nbool t = is_same<int, int>; //\
    \ true\nbool f = is_same<int, float>; // false\n```\n\n### 第 6 题答案\n\n变量模板可以像模板函数一样进行模板特化，因此我们可以如下简化代码：\n\
    \n```cpp\ntemplate<typename T, typename U>\nconstexpr bool is_same = false;\n\n\
    template<typename T>\nconstexpr bool is_same<T, T> = true;\n```\n\n### 0.7 默认参数与变量模板的特化\n\
    \n#### 第 7 题默认参数与变量模板的特化\n\n程序的输出是什么？\n\n```cpp\n#include <iostream>\n#include\
    \ <iomanip>\n\ntemplate<typename T=double>\nconstexpr T pi = T(3.1415926535897932385);\n\
    \ntemplate<>\nconstexpr float pi<int> = pi<float>;\n\nint main()\n{\n    std::cout\
    \ << std::setprecision(30);\n    std::cout << \"pi<> : \" << pi<> << std::endl;\n\
    \    std::cout << \"pi<int> : \" << pi<int> << std::endl;\n    std::cout << \"\
    pi<float> : \" << pi<float> << std::endl;\n}\n```\n\n#### 第 7 题答案\n`pi<> : 3.14159265358979311599796346854`\n\
    `pi<int> : 3.1415927410125732421875`\n`pi<float> : 3.1415927410125732421875`\n\
    \n### 0.8 lambda 与变量模板\n\n#### 第 8 题 lambda 与变量模板\n\n简化下面的程序。\n\n```cpp\ntemplate<typename\
