    \ as function argument\n\n#### Question 32: `unique_ptr` vs `make_unique` as function\
    \ argument\n\nReview the code below:\n\n```cpp\n#include <iostream>\n\ntemplate<typename\
    \ T1, typename T2>\nvoid f(T1 *a, T2 *b)\n{}\n\nstruct A\n{\n    A() { std::cout\
    \ << \"A()\" << std::endl; }\n    ~A() { std::cout << \"~A()\" << std::endl; }\n\
    };\n\nstruct B\n{\n    B() { std::cout << \"B()\" << std::endl; }\n    ~B() {\
    \ std::cout << \"~B()\" << std::endl; }\n};\n\nint main()\n{\n    f(new A, new\
    \ B);\n}\n```\n\n#### SOLUTION OF QUESTION [32]\n\nSuppose there is no exception\
    \ raised, then the memories allocate by the calls `new A` and `new B` are leaked\
    \ as can seen in the output of the program:\n\n```text\nA()\nB()\n```\n\nThe destructors\
    \ are not called. Classic memory leak. Moreover it suffers from problems associated\
    \ with unspecified order of evaluation of the parameters to the function as depicted\
    \ ahead.\n\n**Immediate Remedy**: As a quick fix, suppose the code is modified\
    \ to use `std::unique_ptr` instead of raw pointers:\n\n```cpp\n#include <iostream>\n\
    #include <memory>\n\ntemplate<typename T1, typename T2>\nvoid f(std::unique_ptr<T1>\
    \ a, std::unique_ptr<T2> b)\n{}\n\nstruct A\n{\n    A() { std::cout << \"A()\"\
    \ << std::endl; }\n    ~A() { std::cout << \"~A()\" << std::endl; }\n};\n\nstruct\
    \ B\n{\n    B() { std::cout << \"B()\" << std::endl; }\n    ~B() { std::cout <<\
    \ \"~B()\" << std::endl; }\n};\n\nint main()\n{\n    f(std::unique_ptr<A>(new\
    \ A), std::unique_ptr<B>(new B));\n}\n```\n\nIt prints now:\n\n```text\nA()\n\
    B()\n~B()\n~A()\n```\n\nSo no leak this time? The order of evaluation of the parameters\
    \ passed to the function is unspecified. And we know that the call to `new A`\
    \ invokes at least 2 calls: `operator new` to allocate the memory followed by\
    \ the call to `A`'s constructor. Let us assume that the evaluation of `unique_ptr`'s\
    \ construction occur last.\n\nSuppose `new A` succeeds while evaluating `new B`,\
    \ either `operator new` or the call to `B`'s constructor raises some exception,\
    \ then `A`'s memory will be leaked. Same is for `B`. Suppose the evaluation is\
    \ like this: `operator new` gets called for `A` followed by `B`, `A`'s constructor\
    \ gets called followed by `B`. If `A`'s or `B`'s constructor fails then `B`'s\
    \ or `A`'s memory is leaked respectively. Hence in case of any exception during\
    \ the evaluation of the parameters, there are possibilities of memory leak due\
    \ to unspecified evaluation order.\n\nSo all we want is to provide a function\
    \ template with perfect forwarding (because the user will be passing `new` from\
    \ outside this function) that does the work of allocation and construction of\
    \ the object and construction of `unique_ptr`. Luckily, C++14 provides a perfectly\
    \ forwarding variadic function template `make_unique`. Hence the final code looks\
    \ like:\n\n```cpp\n#include <iostream>\n#include <memory>\n\ntemplate<typename\
    \ T1, typename T2>\nvoid f(std::unique_ptr<T1> a, std::unique_ptr<T2> b)\n{}\n\
    \nstruct A\n{\n    A() { std::cout << \"A()\" << std::endl; }\n    ~A() { std::cout\
    \ << \"~A()\" << std::endl; }\n};\n\nstruct B\n{\n    B() { std::cout << \"B()\"\
    \ << std::endl; }\n    ~B() { std::cout << \"~B()\" << std::endl; }\n};\n\nint\
    \ main()\n{\n    f(std::make_unique<A>(), std::make_unique<B>());\n}\n```\n\n\
    `make_unique` prevents the unspecified evaluation order leak triggered by the\
    \ expression `f(std::unique_ptr<A>(new A), std::unique_ptr<B>(new B))` because\
    \ now the parameters are 2 functions, which will be executed irrespective of the\
    \ order of evaluation. Suppose the first call succeeds and the second call fails\
    \ (i.e. throws) then the temporary object created by the first call is guaranteed\
    \ to clean up because temporary objects are destroyed as the last step in evaluating\
    \ the full-expression that (lexically) contains the point where they were created.\
    \ This is true even if that evaluation ends in throwing an exception. If the first\
    \ call throws, then there are no leaks because `std::make_unique` is itself strongly\
    \ exception-safe.\n\n### 0.33 `make_unique` as perfect forwarding\n\n#### Question\
    \ 33: `make_unique` as perfect forwarding guy\n\nIn the code below, we end up\
    \ typing the name of the type `UserDefinedTypeName` twice:\n\n```cpp\nstd::unique_ptr<UserDefinedTypeName>\
    \ up(new UserDefinedTypeName());\n```\n\nHow to resolve this? Briefly describe\
    \ the mechanism.\n\n#### SOLUTION OF QUESTION [33]\n\nAs already mentioned before,\
    \ the code can be rewritten as:\n\n```cpp\nauto up = std::make_unique<UserDefinedTypeName>();\n\
    ```\n\nSo it helps us get rid of explicit call to `new` as well. Mechanism: `make_unique<T>(args...)`\
    \ invokes `new T(std::forward<Args>(args)...)`. And please note that this meant\
    \ `T(params)` with parentheses rather than `T{params}`. If `T{params}` was adopted\
    \ then the output of the following program will be 2 instead of 2014:\n\n```cpp\n\
    auto up_vec1 = std::make_unique<std::vector<int>>(2014, 2017);\nstd::cout << \"\
    size of the first vector is : \" << up_vec1->size() << std::endl;\n```\n\n###\
    \ 0.34 `make_unique` and `new`\n\n#### Question 34: `make_unique` and `new`\n\n\
    Does `make_unique` calls plain `new` or global `new`?\n\n#### SOLUTION OF QUESTION\
    \ [34]\n\nAs we know that the class template `default_delete` serves as the default\
    \ deleter (destruction) for `unique_ptr`. `default_delete` provides the call as\
    \ follows: `void operator()(T*) const`. Effect of `make_unique` is to call `new`\
    \ that `make_unique` can be replaced. Similar behavior can be observed in this\
    \ program:\n\n```cpp\n#include <iostream>\n#include <memory>\n#include <cstdlib>\n\
    \nvoid* operator new(std::size_t s)\n{\n    std::cout << \"global new\" << std::endl;\n\
    \    return std::malloc(s);\n}\n\nvoid operator delete(void* ptr) noexcept\n{\n\
    \    std::cout << \"global delete\" << std::endl;\n    std::free(ptr);\n}\n\n\
    struct A\n{\n    A() { std::cout << \"A()\" << std::endl; }\n    ~A() { std::cout\
    \ << \"~A()\" << std::endl; }\n\n    static void operator new(std::size_t s)\n\
    \    {\n        std::cout << \"custom new\" << std::endl;\n        return ::operator\
    \ new(s);\n    }\n\n    static void operator delete(void* ptr)\n    {\n      \
    \  std::cout << \"custom delete\" << std::endl;\n        ::operator delete(ptr);\n\
    \    }\n};\n\nint main()\n{\n    std::cout << \"Unique Pointer Start\" << std::endl;\n\
    \    std::make_unique<A>();\n    std::cout << \"Unique Pointer End\" << '\\n'\
    \ << '\\n';\n\n    std::cout << \"Shared Pointer Start\" << std::endl;\n    std::make_shared<A>();\n\
    \    std::cout << \"Shared Pointer End\" << std::endl;\n}\n```\n"
