  trans: "\n\n```cpp\nstd::string quote (const char *p, char delim='\"', char escape='\\\
    \\') )\n{\n    std::stringstream ss;\n    ss << std::quoted(p, delim, escape);\n\
    \    std::string s;\n    ss >> s;   // no quote\n    return s;\n}\n```\n\n```cpp\n\
    assert (quote (\"Hi\", '!') == \"!Hi!\");\nassert (quote (\"Hi!\", '!') == R\"\
    (!Hi\\!!)\");\nassert (quote (\"\") == \"\\\"\\\"\");\nassert (quote (\"a\") ==\
    \ \"\\\"a\\\"\");\n```\n\n### 0.82 空迭代器 Null Iterator\n\n**问题 82：空迭代器**\n\n设计一个类层次结构，为成员\
    \ vector 提供迭代器访问，并带有其他功能。基类本身并不实际包含 vector，但某些派生类包含。\n\n**问题 82 的解答**\n\n典型的接口可能如下：\n\
    \n```cpp\nstruct A\n{\n    virtual std::vector<int>::const_iterator begin();\n\
    \    virtual std::vector<int>::const_iterator end();\n};\n\nstruct B : A\n{\n\
    \    virtual std::vector<int>::const_iterator begin();\n    virtual std::vector<int>::const_iterator\
    \ end();\n\n    std::vector<int> v;\n};\n```\n\n完成派生类 B 设计并不并不：\n\n```cpp\nstruct\
    \ B : A\n{\n    explicit B(std::vector<int> & _v) : v(_v) {}\n\n    virtual std::vector<int>::const_iterator\
    \ begin()\n    {\n        return v.begin();\n    }\n\n    virtual std::vector<int>::const_iterator\
    \ end()\n    {\n        return v.end();\n    }\n\n    std::vector<int> v;\n};\n\
    ```\n\n但是如何在基类 A 上实现类似的操作呢，因为没有 vector 可以指向。所以，真正的挑战是在没有容器实例的情况下创建一个有效的迭代器。\n\n\
    C++14 为空迭代器提供了支持，允许对值初始化的正向迭代器进行比较，并确保针对特定容器类型的所有值初始迭代器比较结果都相等。将值初始化的迭代器与具有非奇异值的迭代器进行比较的结果是未定义的。\n\
    \n因此，我们的基类看起来如下：\n\n```cpp\nstruct A\n{\n    A() {}\n    virtual std::vector<int>::const_iterator\
    \ begin()\n    {\n        return {};\n    }\n\n    virtual std::vector<int>::const_iterator\
    \ end()\n    {\n        return {};\n    }\n};\n```\n\n它允许编写如下代码：\n\n```cpp\n#include\
    \ <vector>\n#include <cassert>\n\nint main()\n{\n    typedef std::vector<int>\
    \ C;\n    C::iterator ii1{}, ii2{};\n    C::iterator ii4 = ii1;\n    C::const_iterator\
    \ cii{};\n    assert (ii1 == ii2);\n    assert (ii1 == ii4);\n\n    assert (!(ii1\
    \ != ii2));\n    assert (ii1 == cii);\n    assert (cii == ii1);\n    assert (!(ii1\
    \ != cii));\n    assert (!(ii1 < cii));\n    assert (!(cii < ii1));\n    assert\
    \ (ii1 <= cii);\n    assert (cii <= ii1);\n    assert (!(ii1 > cii));\n    assert\
    \ (!(cii > ii1));\n    assert (cii - ii1 == 0);\n    assert (ii1 - cii == 0);\n\
    }\n```\n\n### 0.83 std::move 是 rvalue_cast\n\n**问题 83：std::move 是 rvalue_cast**\n\
    \n解释 `std::move` 的工作原理并提供实现细节。\n\n**问题 83 的解答**\n\n`std::move` 并不保证移动，它无条件地转换为右值（rvalue），因此它可以被视为\
    \ `rvalue_cast`。\n\n一种可能的实现如下：\n\n```cpp\ntemplate<typename T>\nconstexpr std::remove_reference<T>::type&&\n\
    move(T&& t) noexcept\n{\n    return static_cast<typename std::remove_reference<T>::type&&>(t);\n\
    }\n```\n\n在 C++14 中，它可以进一步简化为：\n\n```cpp\ntemplate<typename T>\ndecltype(auto)\n\
    move(T&& t) noexcept\n{\n    return static_cast<std::remove_reference_t<T>>&&>(t);\n\
    }\n```\n\n建议不要使用 `std::move` 将对象声明为 `const`。\n\n让我们来看一个例子：\n\n```cpp\nA a;\nstd::move(a);\
    \ // a 是左值 (lvalue)\n```\n\n记住，左值（lvalue）是一个我们可以使用 `&` 运算符的表达式。右值（rvalue）是一个不是左值的表达式。\n\
    \n声明为右值引用 `&&` 的对象可以是左值也可以是右值。如果它有名称，那么它就是左值。否则，它就是右值。\n\n引用折叠（Reference collapsing）：如果一个\
    \ `typedef` 名称或 `decltype` 限定符指向一个表示为对类型 `T` 的引用的类型 `TR`，则尝试创建指向 `cv TR` 的左值引用类型将创建指向\
    \ `T` 的左值引用，而尝试创建指向 `cv TR` 的右值引用类型将创建 `TR`。\n\n* `T&&` 变为 `T&`\n* `T&&&` 变为 `T&`\n\
    * `T&&&` 变为 `T&`\n* `T&&&&` 变为 `T&&`\n\n```cpp\nint i;\ntypedef int& LRI;\ntypedef\
    \ int&& RRI;\n\nLRI& r1 = i; // r1 的类型为 int&\nconst LRI& r2 = i; // r2 的类型为 int&\n\
    LRI& r3 = i; // r3 的类型为 int&\nRRI& r4 = i; // r4 的类型为 int&\nRRI& r5 = i; // r5\
    \ 的类型为 int&\nLRI& r6 = i; // r6 的类型为 int&\nRRI& r7 = i; // r7 的类型为 int&\n```\n\
    \n"
- fmt: "To understand the approach better, let us look at one of the problems as follows:\n\
    \n#### Question 7 Generic Slide Function\n\nImplement a generic slide function\
    \ for shifting a contiguous selection of items in a sequential container like\
    \ `vector` to a specified location either back or forth.\n\n**SOLUTION OF QUESTION\
    \ [7](#part0000_split_015.html_x1-95001r7)**\n\n![PIC](images/00002.jpeg) `rotate{f,\
    \ l, p}`; ![PIC](images/00003.jpeg)\n\n![PIC](images/00004.jpeg) `rotate{p, f,\
    \ l}`; ![PIC](images/00005.jpeg)\n\nCombining these, we get:\n\n```cpp\nif (p\
    \ < f) rotate(p, f, l);\nif (l < p) rotate(f, l, p);\n```\n\nSuppose we are interested\
    \ in getting the final positions too, then we can write the code in C++11 as:\n\
    \n```cpp\nif (p < f) return { p, rotate(p, f, l) };\nif (l < p) return { rotate(f,\
    \ l, p), p };\n```\n\nLet us complete the code with the third case of no shifting\
    \ at all:\n\n![PIC](images/00006.jpeg)\n\n```cpp\nreturn {f, l};\n// I models\
    \ RandomAccessIterator \ntemplate <typename I> \nauto slide(I f, I l, I p) ->\
    \ pair<I, I> \n{ \n    if (p < f) return { p, rotate(p, f, l) }; \n    if (l <\
    \ p) return { rotate(f, l, p), p }; \n\n    return { f, l }; \n}\n```\n\nForthcoming\
    \ volumes will strengthen this particular approach spanning various areas of C++.\n\
    \n### Advanced C++ FAQs: Volume 2 : Generic Programming\n\nThis book is sequel\
    \ to the first volume Advanced C++ FAQs : Volume 1 : Fundamentals. It assumes\
    \ that the reader is aware of the basics of C++98 and C++03 and wants to expand\
    \ her horizon to latest and greatest in the present and future of C++, including\
    \ C++11 and C++1y(aka C++14). It contains selected generic programming problems\
    \ with detailed solutions to all of these which will help the reader to hone her\
    \ skills to solve a particular problem. The problems are marked on a scale of\
    \ one(*)(simplest) to five stars(*****)(hardest).\n\nTo understand the approach\
    \ better, let us look at one of the problems as follows:\n\n#### Question56 metafunction\
    \ : check presence of type member\n\nDevelop an utility in a form of trait-like\
    \ metafunction to determine whether a type `T` has a type member named `type`.\n\
    \n**SOLUTION OF QUESTION [56](#part0000_split_015.html_x1-96001r56)**\n\n```cpp\n\
    #include <type_traits> \n#include <iomanip> \n#include <iostream> \n\ntemplate<\
    \ class T > \n    using void_t = void; \n    //using void_t = std::conditional_t<true,\
    \ void, T>; \n\ntemplate< class, class = void >\nstruct has_type_member : std::false_type\
    \ \n{}; \n\ntemplate< class T > \nstruct has_type_member<T, void_t<typename T::type>>\
    \ : std::true_type \n}; \n\nstruct A \n{\n    typedef int type; \n}; \n\nstruct\
    \ B \n{\n}; \n\nint main() \n{ \n    static_assert(has_type_member<A>::value,\
    \ \"\"); \n    static_assert(!has_type_member<B>::value, \"\"); \n\n    std::cout\
    \ << std::boolalpha;\n    std::cout << has_type_member<A>() << std::endl; \n \
    \   std::cout << has_type_member<B>() << std::endl; \n    std::cout << has_type_member<std::common_type<int,\
    \ double>>() << std::endl; \n    std::cout << has_type_member<std::common_type<int,\
    \ std::string>>() << std::endl; \n}\n```\n\nIt prints:\ntrue\nfalse\ntrue\nfalse\n\
    \nCompared to traditional code that computes such a result, this version seems\
    \ considerably simpler, and has no special cases (e.g., to avoid forming pointer-to-reference\
    \ type).\n\nThe purpose of the `void_t` alias template is simply to map any given\
    \ type to `void`.\n\nOn some platforms, it may issue error citing unused argument\
    \ `T` in the alias specialization, so we may need to use the following code:\n\
    \n`using void_t = std::conditional_t<true, void, T>;`\n\n`conditional_t` works\
    \ as a workaround to ensure that our template’s argument is always used.\n\nThe\
    \ code features exactly two cases, each straightforward:\n\n1. when there is a\
    \ type member named `type`, the specialization is well-formed (with `void` as\
    \ its second argument) and will be selected, producing a `true_type` result\n\
    2. when there is no such type member, SFINAE will apply, the specialization will\
    \ be nonviable, and the primary template will be selected instead, yielding `false_type`.\n\
    \nThus, each case obtains the appropriate result.\n\nKindly note that we can extend\
    \ the code for `void_t` to be used for mapping a sequence of types to void.\n\n\
    ```cpp\ntemplate< class... > \nstruct voider { using type = void; }; \n\ntemplate<\
    \ class... T0toN > \nusing void_t = typename voider<T0toN...>::type;\n```"
