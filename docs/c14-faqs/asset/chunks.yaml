    The attribute-token deprecated can be used to mark names and entities whose use
    is still allowed, but is discouraged for some reason.


    The attribute may be applied to the declaration of


    *   a class,


    *   a typedef-name,


    *   a variable,


    *   a non-static data member,


    *   a function,


    *   an enumeration, or


    *   a template specialization.


    A name or entity declared without the deprecated attribute can later be redeclared
    with the attribute and vice-versa.


    1class A; 


    2class [[deprecated]] A; 


    3 


    4class A{}; 


    5 


    6int main() 


    7{ 


    8    A a; 


    9}


    Compiler issues proper diagnostic.


    Thus, an entity initially declared without the attribute can be marked as deprecated
    by a subsequent redeclaration.


    However, after an entity is marked as deprecated, later redeclarations do not
    un-deprecate the entity.


    So for the code below, compiler still issues the relevant diagnostics:


    1class [[deprecated]] A; 


    2class A; 


    3 


    4class A{}; 


    5 


    6int main() 


    7{ 


    8    A a; 


    9}


    Redeclarations using different forms of the attribute, with or without the attribute-argument-clause
    or with different attribute-argument-clauses) are allowed.


    1class [[deprecated]] A; 


    2class [[deprecated("Do not use A.")]] A; 


    3class [[deprecated("A is dangerous.")]] A; 


    4 


    5class A{}; 


    6 


    7int main() 


    8{ 


    9    A a; 


    10}


