    digit_separator.cpp:7:21:  


    error: expected ’;’ at end of declaration  


        auto million = 1’000’000;  


                        ^  


                        ;  


    digit_separator.cpp:8:22:  


    error: expected ’;’ at end of declaration  


        auto pi = 3.14159’26535’89793;  


                         ^  


                         ;  


    2 errors generated.


    Let us get rid of the lines containing these errors, then C++11 compilers compiles
    it fine and but the output is


    0  


    0


    Whereas with C++14 compilers,


    clang++ -std=c++1y digit_separator.cpp, it correctly prints the values of million
    and pi and the array x is


    34  


    0


    Because because the single quotes are digit separators in C++14\. Hence the single-quote
    character ’ can now be used anywhere within a numeric literal for aesthetic readability.
    It does not affect the numeric value.


    Similarly, the float literals 1.602′176′565e- 19 and 1.602176565e- 19 have the
    same value. Optional separating single quotes in a digit-sequence are ignored
    when determining its value.


    Along the same lines :


    the literals 10485764, 1′048′576, 0X100000, 0x10′0000, and


    0′004′000′000 all have the same value.


    ### 0.60 Binary Literals


    ** Question 60 Binary literals


    What is a Binary Literal ?


    SOLUTION OF QUESTION [60](#part0000_split_010.html_x1-66001r60)


    A binary integer literal (base two) begins with 0b or 0B and consists of a sequence
    of binary digits.


    Integer constants can be written as binary constants, consisting of a sequence
    of ’0’ and ’1’ digits, prefixed by ’0b’ or ’0B’. This is particularly useful in
    environments that operate a lot on the bit level (like microcontrollers).


    The following statements are identical:


    1     i =       42; 


    2     i =     0x2a; 


    3     i =      052; 


    4     i = 0b101010;


    The type of these constants follows the same rules as for octal or hexadecimal
    integer constants, so suffixes like ’L’ or ’UL’ can be applied.


    Integers can be specified in decimal, binary, octal, or hexadecimal.


    Decimal integers are a sequence of decimal digits.


    Binary integers are a sequence of binary digits preceded by a ’0b’.


    Octal integers are a sequence of octal digits preceded by a ’0’.


    Hexadecimal integers are a sequence of hexadecimal digits preceded by a ’0x’.


    Integers can have embedded ’_’ characters, which are ignored. The embedded ’_’
    are useful for formatting long literals, such as using them as a thousands separator:


    1123_456       // 123456 


    21_2_3_4_5_6_  // 123456


    The number twelve can be represented as :


    Program 5: representation of twelve 


    1#include <cassert> 


    2 


    3int main() 


    4{ 


    5    auto x1 = 12; // decimal 


    6    auto x2 = 014; // octal 


    7    auto x3 = 0XC; // hexadecimal 


    8    auto x4 = 0b1100; // binary 


    9    auto x5 = 0B1100; // binary 


    10 


    11    assert(x1 == x2); 


    12    assert(x2 == x3); 


    13    assert(x3 == x4); 


    14    assert(x4 == x5); 


    15}


    ### 0.61 auto return type in function declaration


    *** Question 61 auto return type in function declaration


    Review the code fragments below:


    1struct A 


    2{ 


    3    auto f(); 


    4}; 


    5auto A::f() { return 42; }1auto f(); 


    2auto f() { return 42; } 


    3auto f(); 


    4int  f();1template <class T> auto g(T t); 


    2template <class T> auto g(T t) { return t; } 


    3template <class T> auto g(T t);1auto f(); 


    2int i = f();1template <class T> auto f(T t) { return t; } 


    2template auto f(int); 


    3template char f(char); 


    4template<> auto f(double); 


    5 


    6template <class T> T f(T t) { return t; } 


    7template char f(char); 


    8template auto f(float);SOLUTION OF QUESTION [61](#part0000_split_010.html_x1-67001r61)


    Allowing non-defining function declarations with auto return type is not strictly
    necessary, but it is useful for coding styles that prefer to define member functions
    outside the class:


    1struct A 


    2{ 


    3    auto f(); // forward declaration 


    4}; 


    5auto A::f() { return 42; }


    Non-defining declarations are allowed so long as all declarations have the same
    declared type, without considering the deduced type.


    1auto f(); // return type is unknown 


    2auto f() { return 42; } // return type is int 


    3auto f(); // redeclaration 


    4int  f(); // error, declares a different function


    Similar rules apply for function templates as well:


    1template <class T> auto g(T t); // forward declaration 


    2template <class T> auto g(T t) { return t; } // return type is deduced at instantiation time 


    3template <class T> auto g(T t); // redeclaration


    Using such a function in an expression when only a forward declaration has been
    seen is ill-formed:


    1auto f();    // return type is unknown 


    2int i = f(); // error, return type of f is unknown'
