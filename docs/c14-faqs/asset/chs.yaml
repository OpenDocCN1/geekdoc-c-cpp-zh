  ## 0.27 持续时间字面量\n\n### 问题 27 时间时间字面量\n如何将小时、分钟、秒、毫秒、微秒和纳秒作为后缀附加到目标实体上，以增强表达式的可读性？\n\
  \n### 问题 27 的解决方案\n\nC++14 引入了相应的 `chrono` 字面量，通过重载运算符 `\"\"` 来应用用户定义的整数字面量：\n\n\
  ```cpp\nconstexpr chrono::hours operator\"\" h(unsigned long long hours);\nconstexpr\
  \ chrono::minutes operator\"\" min(unsigned long long minutes);\nconstexpr chrono::seconds\
  \ operator\"\" s(unsigned long long sec);\nconstexpr chrono::milliseconds operator\"\
  \" ms(unsigned long long msec);\nconstexpr chrono::microseconds operator\"\" us(unsigned\
  \ long long usec);\nconstexpr chrono::nanoseconds operator\"\" ns(unsigned long\
  \ long nsec);\n```\n\n如果后缀 `h`、`min`、`s`、`ms`、`us`、`ns` 用于整数常量，它们分别表示对应类型 `hours`、`minutes`、`seconds`、`miliseconds`、`microseconds`\
  \ 和 `nanoseconds` 的持续时间值。\n\n注意，这些时间字面量位于内联命名空间 `std::literals::chrono_literals`\
  \ 中，该空间在 `std::chrono_literals` 中同样可用。\n\n```cpp\n#include <chrono>\n#include <type_traits>\n\
  \nint main()\n{\n    using namespace std::chrono_literals;\n\n    auto a = 10h;\n\
  \    auto b = 2min;\n    auto c = 20s;\n    auto d = 10ms;\n    auto e = 20us;\n\
  \    auto f = 5ns;\n\n    static_assert(std::is_same<decltype(a), std::chrono::hours>::value,\
  \ \"\");\n    static_assert(std::is_same<decltype(b), std::chrono::minutes>::value,\
  \ \"\");\n    static_assert(std::is_same<decltype(c), std::chrono::seconds>::value,\
  \ \"\");\n    static_assert(std::is_same<decltype(d), std::chrono::milliseconds>::value,\
  \ \"\");\n    static_assert(std::is_same<decltype(e), std::chrono::microseconds>::value,\
  \ \"\");\n    static_assert(std::is_same<decltype(f), std::chrono::nanoseconds>::value,\
  \ \"\");\n}\n```\n\n```cpp\n#include <chrono>\n#include <type_traits>\n#include\
  \ <cassert>\n\nint main()\n{\n    using namespace std::literals::chrono_literals;\n\
  \n    // 确保类型正确\n    static_assert (std::is_same<decltype(3h), std::chrono::hours>::value,\
  \ \"\");\n    static_assert (std::is_same<decltype(3min), std::chrono::minutes>::value,\
  \ \"\");\n    static_assert (std::is_same<decltype(3s), std::chrono::seconds>::value,\
  \ \"\");\n    static_assert (std::is_same<decltype(3ms), std::chrono::milliseconds>::value,\
  \ \"\");\n    static_assert (std::is_same<decltype(3us), std::chrono::microseconds>::value,\
  \ \"\");\n    static_assert (std::is_same<decltype(3ns), std::chrono::nanoseconds>::value,\
  \ \"\");\n\n    std::chrono::hours h = 4h;\n    auto h2 = 4.0h;\n    assert(h ==\
  \ h2);\n\n    std::chrono::minutes min = 36min;\n    auto min2 = 36.0min;\n    assert(min\
  \ == min2);\n\n    std::chrono::seconds s = 24s;\n    auto s2 = 24.0s;\n    assert(s\
  \ == s2);\n\n    std::chrono::milliseconds ms = 27ms;\n    auto ms2 = 27.0ms;\n\
  \    assert(ms == ms2);\n\n    std::chrono::microseconds us = 867us;\n    auto us2\
  \ = 867.0us;\n    assert(us == us2);\n\n    std::chrono::nanoseconds ns = 645ns;\n\
  \    auto ns2 = 645.ns;\n    assert(ns == ns2);\n}\n```\n\n同样，C++14 在 `std::literals::string_literals`\
  \ 中引入了字符串字面量 `s`，并在内联命名空间 `std::literals::complex_literals` 中引入了复数字面量 `i`、`il`、`i_f`，通过提供运算符\
  \ `\"\"` 的适当重载：\n\n```cpp\nbasic_string<char> operator\"\" s(const char*str, size_t\
  \ len);\n```\n\n可以使用如下用法：\n`auto str = \"testing\"s;`\n\n## 0.28 表示 π 相乘\n\n###\
