- "# C++14 常见问题解答\n\n\n\n\n\n\n\n\n\n\n\n\n\n# 前言\n\n本书包含了与 `C++14` 相关的精选问题，并对所有这些问题提供了详细解答，这将帮助读者磨练解决特定问题的技能。\n\
  \n本教程的主要来源是：\n\n1. `Advanced C++ FAQs: Volume 1 : Fundamentals`\n2. `Advanced C++\
  \ FAQs: Volume 2 : Generic Programming`\n3. `Advanced C++ FAQs: Volumes 1 & 2`\n\
  \n本书并不是 `C++` 的入门教程。它假设读者已经熟悉 `C++98` 和 `C++03` 的基础知识，并希望将视野扩展到 `C++14`（也称为 `C++1y`）的最新特性。问题按照一星\
  \ `*`（最简单）到五星 `*****`（最困难）进行标记。\n\n即将出版的卷将加强这种涵盖 `C++` 各领域的特定方法。\n\n如有建议、反馈和意见，请联系：\n\
  \nchandrashekhar.kumar@gmail.com\n\nChandra Shekhar Kumar\n\n在售书籍书籍\n\n## 0.1 变量模板\n\
  \n### 问题 1 变量模板\n什么是变量模板？\n\n问题解答\n\n变量模板是由变量的模板声明所引入的声明。正如我们所知道的，如果一个模板声明定义了一个函数、类、变量或静态数据成员，那么该模板声明也是一个定义。\n\
  \n类作用域范围内的变量模板是一个静态数据成员模板。\n\n考虑一个简单的模板元函数，它使用变量模板特性来存储两个类型比较结果的布尔值：\n\n```cpp\n\
  template <typename T, typename U>\nconstexpr bool is_same = std::is_same<T, U>::value;\n\
  \nbool t = is_same<int, int>; // true\nbool f = is_same<int, float>; // false\n\
  ```\n\n变量模板的类型不仅限于内置类型；它们也可以是用户定义的类型。\n\n```cpp\nstruct matrix_constants\n{\n  \
  \  template<typename T>\n    using pauli = hermitian_matrix<T, 2>;\n\n    template<typename\
  \ T>\n    constexpr pauli<T> sigma1 = { { 0, 1 }, { 1, 0 } };\n\n    template<typename\
  \ T>\n    constexpr pauli<T> sigma2 = { { 0, -1i }, { 1i, 0 } };\n\n    template<typename\
  \ T>\n    constexpr pauli<T> sigma3 = { { 1, 0 }, { -1, 0 } };\n};\n```\n\n它使得参数化常量的定义和使用变得简单得多，从而简化了更简单、更统一的编程规则，例如：\n\
  \n```cpp\ntemplate<typename T>\nstruct lexical_cast_fn\n{\n    template<typename\
  \ U>\n    T operator()(U const &u) const\n    {\n        //...\n    }\n};\n\ntemplate<typename\
  \ T>\nconstexpr lexical_cast_fn<T> lexical_cast{};\n\nint main()\n{\n    lexical_cast<int>(\"\
  42\");\n}\n```\n\n## 0.2 类模板的 constexpr 静态数据成员\n\n### 问题 2 类模板的 constexpr 静态数据成员\n\
  类模板的 constexpr 静态数据成员有什么问题？\n\n问题解答\n\n让我们重新回顾 `std::is_same` 是如何设计的：\n\n```cpp\n\
  template<typename T, T v>\nstruct integral_constant\n{\n    static constexpr T value\
  \ = v;\n    typedef T value_type;\n};\n\ntemplate<typename T, T v>\nconstexpr T\
  \ integral_constant<T, v>::value;\ntypedef integral_constant<bool, true> true_type;\n\
  typedef integral_constant<bool, false> false_type;\n\ntemplate<typename T, typename\
  \ U>\nstruct is_same: false_type{};\n\ntemplate<typename T>\nstruct is_same<T, T>:\
  \ true_type{};\n```\n\n静态成员的主要问题在于：\n- 它们需要重复声明：\n    1. 一次在类模板内部，\n    2. 一次在类模板外部，以便在使用了\
  \ ODR（单一定义规则）时提供实际定义。\n- 由于必须提供两次相同的声明而造成了困惑，而普通常量不需要。\n\n标准类 `numeric_limits` 在\
  \ constexpr 数据成员方面也存在相同的问题。\n\n## 0.3 constexpr 函数模板\n\n### 问题 3 constexpr 函数模板\n\
  constexpr 函数模板有什么问题？\n\n问题解答\n\nconstexpr 函数模板提供了函数抽象。一个简单的 constexpr 函数：\n\n```cpp\n\
  template <typename T, typename U>\nconstexpr bool is_same()\n{\n    return std::is_same<T,\
  \ U>::value;\n}\n```\n\n然而，它们迫使我们在定义处预先选择如何传递常量：要么通过 `const` 引用，要么通过普通的非引用类型。如果通过\
  \ `const` 引用传递，则常量必须系统地分配在静态存储器中。如果通过非引用类型传递，则常量需要拷贝。对于内置类型来说，拷贝不是问题，但对于具有值语义且不仅仅是内置类型封装器的用户定义类型来说，这是一个问题。而普通的\
  \ constexpr 变量不受此影响。它们只提供了一个简单的定义，而常量是否实际上需要布局在存储中取决于用法。\n\n其他例子是 `std::numeric_limits`\
  \ 的静态成员函数以及像 `boost::constants::pi<T>()` 这样的函数：\n\n```cpp\n#include <boost/math/constants/constants.hpp>\n\
  \ntemplate <class Real>\nReal area(Real r)\n{\n    using namespace boost::math::constants;\n\
  \    return pi<Real>() * r * r;\n}\n```\n\n常量的函数模板版本是简单的内联函数，返回对于对应类型正确精度的常量。此外，对于支持此点的编译器，这些函数被声明为\
  \ `constexpr`，允许在模板参数为字面量类型的情况下将结果用于常量表达式。这看起来我们创建 constexpr 函数仅仅是为了返回一个常量。\n\n\
  ## 0.4 变量模板的实践\n\n### 问题 4 变量模板的实践\n说明如何使用变量模板为具有适当精度的给定类型计算圆面积？\n\n问题解答\n\n变量模板解决了前述说明的两个问题，并且在\
  \ C++11 中引入此功能不需要修改语法，因为现在的语法允许任何声明参数化。之前这是禁止的。\n\n让我们首先用浮点数据类型确定的数学常量 π 表示：\n\n\
  程序 1：π 与变量模板\n\n```cpp\n#include <iostream>\n#include <iomanip>\n\ntemplate<typename\
  \ T>\nconstexpr T pi= T(3.1415926535897932385);\n\nint main()\n{\n    std::cout\
  \ << std::setprecision(40);\n    std::cout << \"pi<int> : \" << pi<int> << std::endl;\n\
  \    std::cout << \"pi<float> : \" << pi<float> << std::endl;\n    std::cout <<\
  \ \"pi<double> : \" << pi<double> << std::endl;\n}\n```\n\n使用以下命令：\n`clang++ -std=c++11\
  \ variable_template.cpp`\n\n我们得到以下输出：\npi<int> : 3\npi<float> : 3.1415927410125732421875\n\
  pi<double> : 3.14159265358979311599796346854418516159\n\n这个变量模板可以用于泛型函数为给定的半径计算面积：\n\
  \n```cpp\ntemplate<typename T>\nT area_circle(T r)\n{\n    return pi<T> * r * r;\n\
  }\n```\n\n## 0.5 静态数据成员模板\n\n### 问题 5 静态数据成员模板\n为静态数据成员模板提供合适的定义：\n\n问题解答\n\n正如我们所知道的，类作用域范围内的变量模板是一个静态数据成员模板，静态成员或静态数据成员模板的定义可以在包含静态成员类模板定义的命名空间范围内提供。\n\
  \n```cpp\nstruct limits\n{\n    template<typename T>\n    static const T min; //\
  \ min 的声明\n};\n\ntemplate<typename T>\nconst T limits::min = {}; // min 的定义\n```\n\
  \n## 0.6 变量模板的特化\n\n### 问题 6 变量模板的特化\n\n\n\n\n\n简化下面的程序以实现所需功能：\n\n```cpp\ntemplate\
  \ <typename T, typename U>\nconstexpr bool is_same = std::is_same<T, U>::value;\n\
  \nbool t = is_same<int, int>; // true\nbool f = is_same<int, float>; // false\n\
  ```\n\n### 第 6 题答案\n\n变量模板可以像模板函数一样进行模板特化，因此我们可以如下简化代码：\n\n```cpp\ntemplate<typename\
  \ T, typename U>\nconstexpr bool is_same = false;\n\ntemplate<typename T>\nconstexpr\
  \ bool is_same<T, T> = true;\n```\n\n## 0.7 默认参数与变量模板的特化\n\n### 第 7 题默认参数与变量模板的特化\n\
  \n程序的输出是什么？\n\n```cpp\n#include <iostream>\n#include <iomanip>\n\ntemplate<typename\
  \ T=double>\nconstexpr T pi = T(3.1415926535897932385);\n\ntemplate<>\nconstexpr\
  \ float pi<int> = pi<float>;\n\nint main()\n{\n    std::cout << std::setprecision(30);\n\
  \    std::cout << \"pi<> : \" << pi<> << std::endl;\n    std::cout << \"pi<int>\
  \ : \" << pi<int> << std::endl;\n    std::cout << \"pi<float> : \" << pi<float>\
  \ << std::endl;\n}\n```\n\n### 第 7 题答案\n`pi<> : 3.14159265358979311599796346854`\n\
  `pi<int> : 3.1415927410125732421875`\n`pi<float> : 3.1415927410125732421875`\n\n\
  ## 0.8 lambda 与变量模板\n\n### 第 8 题 lambda 与变量模板\n\n简化下面的程序。\n\n```cpp\ntemplate<typename\
  \ T>\nT area_circle(T r)\n{\n    return pi<T> * r * r;\n}\n```\n\n### 第 8 题答案\n\
  ```cpp\ntemplate<typename T>\nauto area_circle = [](auto r) { return pi<T> * r *\
  \ r; };\n```\n\n## 0.9 变量模板的变量各异\n\n### 第 9 题变量模板的变量各异\n\n这段代码是法的吗？\n\n```cpp\n\
  #include <iostream>\n\ntemplate<typename T>\nT magicVal = 42;\n\nint main()\n{\n\
  \    std::cout << magicVal<int> << std::endl;\n    magicVal<int> = 0;\n    std::cout\
  \ << magicVal<int> << std::endl;\n}\n```\n\n如果是，输出是什么？\n\n### 第 9 题答案\n是的的，代码是正确的，因为变量模板实例是一一类对象。\n\
  输出为：\n```\n42\n0\n```\n\n## 0.10 auto 变量模板\n\n### 第 10 题变量模板的变量各异\n\n这段代码是法的吗？\n\
  \n```cpp\ntemplate<class> constexpr auto X = 42;\n\nint main()\n{\n    static_assert(X<int>\
  \ == 42, \"\");\n}\n```\n\n### 第 10 题答案\n是的，根据标准，变量模板的特化是一个变量：对于可以生成有效特化的模板，不应发布任何诊断信息。\n\
  \n### 0.1 合法的特化但报错\n\n### 第 1 题合法的特化但报错\n\n为什么这段代码无法编译？\n\n```cpp\nclass Y\n{\n\
  \    typedef int type;\n};\n\ntemplate<Y::type N>\nstruct X {};\n```\n\n典型的错误是：\n\
  ```\nspecialize.cpp:3:17: error: ‘Y::type’ is private\n    typedef int type;\nspecialize.cpp:6:13:\
  \ error: within this context\ntemplate<Y::type N>\n```\n因为模板参数是不符合规范的（ill-formed），它会被立即诊断且不会形成任何结构。因此，在所在位置没有可以特化的模板。这里不存在“不符合规范”，因为不符合规范意味着一种不存在的状态。所以，如果参数是毫无意义的，那么我们就没有声明。如果模板声明本身是毫无意义的，我们没有可以特化的声明，因此会产生编译器错误。\n\
  \n## 0.12 变量模板与 lambda\n\n### 第 12 题变量模板与 lambda\n\n利用变量模板和 lambda 计算圆的面积。\n\n```cpp\n\
  template<typename T>\nstruct Circle\n{\n    T radius;\n    using value_type = T;\n\
  \n    Circle(T r) : radius(r) {}\n    Circle(const Circle& c) : radius(c.radius)\
  \ {}\n};\n\ntemplate<typename T=double>\nconstexpr T pi = T(3.1415926535897932385);\n\
  \nauto area = [](auto c)\n{\n    using T = typename decltype(c):value_type;\n  \
  \  return pi<T> * c.radius * c.radius;\n};\n```\n\n或者：\n```cpp\ntemplate<typename\
  \ T>\nusing f_type = T(*)(Circle<T>);\n\ntemplate<typename T>\nf_type<T> area =\
  \ [](Circle<T> c)\n{\n    return pi<T> * c.radius * c.radius;\n};\n```\n\n## 0.13\
  \ 对 integral_constant 的增量改进\n\n### 第 13 题对 integral_constant 的增量改进\n\n重新类模板 `is_arithmetic`：\n\
  \n```cpp\ntemplate <class T>\nstruct is_arithmetic\n  :\n    integral_constant<\n\
  \      bool,\n      is_integral<T>::value ||\n      is_floating_point<T>::value\n\
  \    > {};\n```\n\n在 C++14 之前，这种类模板的典型用法是：\n`std::is_arithmetic<T>::value`\n或者\n\
  `static_cast<bool>(std::is_arithmetic<T>{})`\n\n对 `integral_constant` 类做了什么改进，以启用像\
  \ `std::is_arithmetic<T>()()` 这样的简化用法？\n\n为了允许模板用作编译时对象的源，进行了以下添加：\n`constexpr value_type\
  \ operator() { return value; }`\n\n所以最终的形式如下：\n```cpp\ntemplate <class T, T v>\n\
  struct integral_constant\n{\n    static constexpr T value = v;\n    using value_type\
  \ = T;\n    using type = T;\n    constexpr value_type operator() { return value;\
  \ }\n};\n```\n\n## 0.14 is_same\n\n### 第 14 题 is_same\n\n列举使用 `is_same<T, U>` 的不同方法。\n\
  \n1. 作为函数对象：`is_same<T, U>()`\n2. 通过嵌套进行求值：`is_same<T, U>::value`\n3. 使用如下模板别名：\n\
  \   ```cpp\n   template<typename T, typename U>\n   using is_same_v = typename is_same<T,\
  \ U>::value;\n   ```\n   我们可以这样使用：`is_same_v<T>`\n4. 在 C++11 中：`static_cast<bool>(is_same<T,\
  \ U>{})`\n5. 使用变量模板：\n   ```cpp\n   template<typename T, typename U>\n   constexpr\
  \ bool is_same = false;\n   template<typename T>\n   constexpr bool is_same<T, T>\
  \ = true;\n   ```\n   可以像变量一样使用：`is_same<T, U>`\n\n注意 C++14 包含了以下模板别名：\n```cpp\n\
  template <class T, class U>\nusing is_same_t = typename is_same<T, U>::type;\n```\n\
  \n## 0.15 auto 变量模板与泛型 lambda\n\n### 第 15 题 auto 变量模板与泛型 lambda\n\n这段代码是法的吗？\n\n\
  ```cpp\ntemplate<typename T>\nauto f = [](auto a, T b){ /**/ };\n\nint main()\n\
  {\n    f<int>(1, 2);\n}\n```\n\n### 第 15 题答案\n是的，在 C++14 和 clang 3.5 中工作正常。\n\n\
  ## 0.16 constexpr 成员函数与隐式 const\n\n### 第 16 题 constexpr 成员函数与隐式 const\n\n回顾程序：\n\
  \n```cpp\n#include <iostream>\n\nstruct A\n{\n    constexpr A() : n(3) {}\n    constexpr\
  \ int getN() const { return n;\n\n    int n;\n};\n\nstruct B\n{\n    constexpr B()\
  \ : a() {}\n    constexpr const A &getA() const\n    {\n        return a;\n    }\n\
  \    A &getA()\n    {\n        return a;\n    }\n\n    A a;\n};\n\nint main()\n\
  {\n    constexpr int n = B().getA().getN();\n}\n```\n\n### 第 16 题答案\n编译器错误看起来像：\n\
  ```\nconstexpr_implicit_const.cpp:In function 'int main()':\nconstexpr_implicit_const.cpp:31:32:\n\
  error: call to non-constexpr function 'A& B::getA()'\n    constexpr int n = B().getA().getN();\n\
  ```\n\n\n\n\n\n`B().getA()` 选择了非 const 重载版本，导致了此错误。\n\n将代码渲染为如下形式：\n\n```cpp\n#include\
  \ <iostream> \n\nstruct A \n{ \n    constexpr A() : n(3) {} \n    constexpr int\
  \ getN() const { return n; } \n\n    int n; \n}; \n\nstruct B \n{ \n    constexpr\
  \ B() : a() {} \n    constexpr const A &getA() const \n    { \n        return a;\
  \ \n    } \n    constexpr A &getA() \n    { \n        return a; \n    } \n\n   \
  \ A a; \n}; \n\nint main() \n{ \n    constexpr int n = B().getA().getN(); \n}\n\
  ```\n\n在 C++11 下我们得到以下编译器错误：`clang++ -std=c++11`\n\n```\nconstexpr_implicit_const1.cpp:19:18:\
  \ \nwarning: 'constexpr' non-static member function will not be implicitly 'const'\
  \ in C++1y; \n      add 'const' to avoid a change in behavior [-Wconstexpr-not-const]\
  \ \n    constexpr A &getA() \n               ^ \n               const\nconstexpr_implicit_const1.cpp:19:18:\
  \ \nerror: functions that differ only in their return type cannot be overloaded\n\
  constexpr_implicit_const1.cpp:15:24: \nnote: previous declaration is here \n   \
  \ constexpr const A &getA() const \n                   ^ \nconstexpr_implicit_const1.cpp:21:16:\
  \ \nerror: binding of reference to type 'A' to a value of type 'const A' drops qualifiers\
  \ \n    return a; \n             ^ \n1 warning and 2 errors generated.\n```\n\n\
  它指向了几个问题，包括在 C++11 中 `constexpr` 成员函数是隐式 `const` 的限制，这为希望既可以在常量表达式内部也可以外部使用的字面量类型（literal\
  \ class types）带来了麻烦。\n\n因此在 C++14 中，这一规则被删除了。所以它在符合 C++14 的编译器（如 `clang 3.5 trunk`）上运行良好。\n\
  \n## 0.17 constexpr 构造函数与初始化\n\n**问题 17 constexpr 构造函数与初始化**\n\n查看该程序：\n\n```cpp\n\
  int x; \n\nstruct A \n{ \n    constexpr A(bool b) : m(b?42:x) {} \n    int m; \n\
  }; \n\nconstexpr int v = A(true).m; \n\nconstexpr int w = A(false).m;\n```\n\n使用\
  \ `gcc 4.9 trunk` 的编译器错误为：\n\n```\nconstexpr_constructor.cpp:1:28: \nin expansion\
  \ of 'A(0)'\nconstexpr_constructor.cpp:1:28: \nerror: the value of 'x' is not usable\
  \ in a constant expression \n    constexpr int w = A(false).m; \n              \
  \ ^\nconstexpr_constructor.cpp:1:5: \nnote: 'int x' is not const \nint x; \n  ^\n\
  ```\n\n使用 `clang 3.5 trunk` 的编译器错误为：\n\n```\nconstexpr_constructor.cpp:1:15: \n\
  error: constexpr variable 'w' must be initialized by a constant expression \n  \
  \  constexpr int w = A(false).m; \n               ~~~~~~~~\nconstexpr_constructor.cpp:5:34:\
  \ \nnote: read of non-const variable 'x' is not allowed in a constant expression\
  \ \n    constexpr A(bool b) : m(b?42:x) {} \n                       ^\nconstexpr_constructor.cpp:11:19:\
  \ \nnote: call to 'A(false)' \n    constexpr int w = A(false).m; \n            \
  \   ^\nconstexpr_constructor.cpp:1:5: \nnote: declared here \n```\n\n\n\n\n因此错误是因为它用不同的返回类型重复声明了同一个成员函数。\n\
  \n典型的错误如下，其言而易懂：\n\n```cpp\nconstexpr_memfn.cpp:4:10: \nerror: functions that differ\
  \ only in their return type \n    cannot be overloaded \n    int &f(); \n      ^\n\
  constexpr_memfn.cpp:3:26: note: previous declaration is here \n    constexpr const\
  \ int &f(); \n                      ^\n1 error generated.\n```\n\n## 0.23 deprecated（已用）属性\n\
  \n### 问题 23 deprecated 属性\n\n描述一种机制，用于标记类 `A` 和函数 `func1` 的使用为已用。\n\n```cpp\nclass\
  \ A1 {};\n\nvoid func1() {}\n\nint main()\n{\n    A1 a;\n    func1();\n}\n```\n\n\
  ### 问题 23 答案\n\nC++14 引入了 `[[deprecated]]` 属性来实现此功能。因此，我们可以重写上述代码为：\n\n```cpp\n\
  class [[deprecated]] A1 {};\n\n[[deprecated]]\nvoid func1() {}\n\nint main()\n{\n\
  \    A1 a;\n    func1();\n}\n```\n\n使用 clang 3.5 trunk 的编译器诊断信息：\n\n```text\ndeprecated_attribute.cpp:8:5:\
  \ warning: ‘A1’ is deprecated \n    [-Wdeprecated-declarations] \n    A1 a; \n \
  \   ^\ndeprecated_attribute.cpp:1:22: \nnote: ‘A1’ has been explicitly marked deprecated\
  \ \n  here\nclass [[deprecated]] A1 {}; \n                  ^\ndeprecated_attribute.cpp:9:5:\
  \ warning: ‘func1’ is deprecated \n    [-Wdeprecated-declarations] \n    func1();\
