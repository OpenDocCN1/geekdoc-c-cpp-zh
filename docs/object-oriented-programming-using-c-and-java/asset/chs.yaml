  \  1. 公有 (Public)\n    2. 私有 (Private)\n\n\n\n\n# 错误、异常与运算符重载\n\n## 学习目标\n\n在本章结束时，你应当能够：\n\
  \n* 编写结合了错误和异常的面向对象 C++ 程序。\n* 编写带有你自定义错误和异常类的程序，以满足特定和个人的需求。\n* 编写带有运算符重载的程序。\n\
  \n## 11.1 引言\n\n你们许多人在使用互联网或操作系统时，可能都遇到过弹出窗口，其中的消息显示“操作系统或浏览器遇到严重问题，需要关闭。正在报告错误”。事实上，错误已经发生了。尽管在交付前经过详尽的测试，但错误是无法完全避免的，可以将其降到最低。在本章中，我们将学习\
  \ C++ 处理错误和异常的机制。\n\n任何现代 OOP 语言的一个重要特性是重载。重载意味着根据运行时提供的参数，使一个函数或运算符执行多于一个任务。函数重载就是此类中的一个例子。C++\
  \ 也对运算符进行了重载。内置运算符也被重载，从而增强了语言的效率。\n\n## 11.2 错误与异常\n\n程序中可能会出现三种类型的`errors`：\n\n\
  * 语法错误（Syntactical Errors）：可以被编译器轻松地检测和纠正。\n* 逻辑错误（Logical Errors）：由于程序员不理解逻辑流而产生。\n\
  * 这种错误可以通过广泛的测试来纠正。\n* 缺陷（Bugs）：程序员可以使用现有的 `assert()` 宏和调试器修复这些缺陷。\n\n相反，`Exceptions`（异常）是运行时发生的非常规的情况，可能会导致程序崩溃的错误。异常可以分类为：\n\
  \n**同步异常（Synchronous,），**即那些可以预测的异常。例如，数组索引超出允许范围可以很容易被检测，因为此类错误只在你执行涉及数组索引的语句时才会发生。同步异常可能发生在以下一种或多个情况中：\n\
  \n* 内存分配异常\n* IO 处理异常\n* 数学处理异常，如除以零\n\n**异步异常（Asynchronous exceptions），**即那些无法预测的异常。\n\
  \n通常，程序所需的资源在最开始时分配，而在运行时请求资源。因此，我们的程序可能会超过初始分配。例如，考虑为数组分配内存。当此类异常发生时，我们需要一种机制将此类信息传递到资源分配区域，以便我们采取纠正措施并防止程序崩溃。\n\
  \n## 11.3 Try 和 Catch 块\n\nC++ 会抛出一个异常对象。为了实现这一点，我们在预计可能发生异常的地方使用 `try` 块。跟随 `try`\
  \ 块的 `Catch` 块捕获异常对象并采取补救措施。\n\n考虑为二维矩阵分配动态内存的情况。`Try` 将分配动态内存。如果由于内存不可而失败，它将抛出异常对象。`Catch`\
  \ 块将捕获 `try` 块抛出的异常并采取补救措施。在接下来的示例中，我们将展示如何使用 `try` 和 `catch` 块为二维矩阵分配内存。\n\n**示例\
  \ 11.1：Try 和 Catch 块的使用。为二维矩阵分配内存**\n\n```\n1. try\n2. { A=new int * [m];\n3. for\
  \ (int i=0;i<m;i++)\n4. A[i]=new int[n];\n5. }catch (bad_alloc) { cout<<”\\n bad\
  \ allocation”<<endl;exit(1);}\n```\n\n**示例 11.2：Try 块可以捕获多个异常，如 IO 异常、索引越界异常等**\n\
  \n```\ntry\n{\n// 此处分配代码\n}\ncatch (bad allocation object){ }\ncatch ( File IO exception\
  \ object) { }\n```\n\n**示例 11.3：Try 块的嵌套**\n\n```\ntry\n  { // 此处分配代码\n      try{//\
  \ 内部 try 块代码}\n      catch ( File IO exception object) { }\n  }\ncatch (bad allocation\
  \ object){ }\ncatch ( File IO exception object) { }\n```\n\n## 11.4 异常类\n\n在接下来的示例中，我们将演示运行时发生除以零错误时的异常处理。该示例使用公式\
  \ `density = mass/area` 计算密度。输入是 `mass` 和 `radius`。在运行时，如果输入的 `radius` 为 0，程序将抛出一个名为\
  \ `DivideByZero()` 的异常对象。\n\n注意，我们定义了一个类 `DivideByZero`，其正体为空，这样我们就可以将其作为捕获异常并进入\
  \ catch 块的工具。在 catch 块中，我们将通知用户并通过 `exit(0)` 语句体面地退出。\n\n**示例 11.4：dividebyzero.cpp\
  \ 用于演示异常类——除以零的程序**\n\n```\n1.  #include<iostream> // 用于输入输出库的 cin 和 cout\n2.  using\
  \ namespace std;\n3.  class DivideByZero{} // 用于进入 catch 的异常类\n4.  template <class\
  \ T>\n5.  T FindDensity(T mass , T radius);\n6.  void main()\n7.  { double mass,\
  \ radius, area, density;\n8.  while (1)\n9.  { cout << “\\n Enter mass in Kgs :”;\n\
  10. cin>> mass;\n11. cout << “\\n Enter radius < 0 to test divide by zero and exit>”;\n\
  12. cin>> radius;\n13. try\n14. {if (radius==0)\n15. throw DivideByZero();\n16.\
  \ else\n17. {area = mass/area;}\n18. }catch (DivideByZero)\n19. { cout<<”n Divide\
  \ by zero error”<<endl;\n20. the parameters are : mass=25;\n21. density = mass/area;\n\
  22. exit(0);\n23. }\n/*Output:\nEnter mass in Kgs :25\nEnter radius < 0 to test\
  \ divide by zero and exit>0\nDivide by zero error\nthe parameters are : mass=25\
  \ radius=0\n*/\n```\n\n| **Line No. 3:** | **class DivideByZero{}** 当抛出异常时，控制传递到\
  \ catch 块，那里有纠正机制。为了进入 catch 块，我们在 main 类内部声明并定义了一个异常类。注意这个异常类没有主体。它的唯一目的是进入 catch\
  \ 块。 |\n| **Line No. 15:** | `throw DivideByZero()` 在 `try` 块内部。这意味着 `try` 块抛出了\
  \ `DivideByZero()` 对象。 |\n| **Lines No. 13–18:** | 是 `try` 块，18–24 是 catch 块。 |\n\
  \n我们将使用栈数据结构来演示错误和异常特性。在此之前，需要理解名为栈的数据结构。\n\n## 11.5 栈数据结构\n\n栈是一种线性数据结构。数据的插入和提取基于被称为“后进先出”（LIFO）的技术。例如，考虑学生向老师提交作业的活动。老师接收作业并将它们堆叠在桌子上，并从顶部开始批改。因此，最后提交的作业先获得服务。正如你所看到的，计算机系统依赖栈结构来解决许多问题。表示见图\
  \ 11.1。\n\n![栈的表示与术](img/249-1.png)\n\n**图 11.1** 栈的表示与术\n\n**栈操作**\n\n* 创建栈。\n\
  * 检查栈是否满或为空。我们不能向满栈插入。同样不能从空栈中提取。\n* 初始化栈。例如，`tos= –1` 和 `tos = max –1;` 是初始化命令。栈从\
  \ 0 到 (max –1)。\n* 如果栈未满，将元素推入（push）栈。\n* 如果栈不空，从栈中弹出（pop）元素。\n\n\n\n\n\n- 从栈顶读取。\n\
  - 显示/打印整个栈。\n\n作为一个示例，在编写栈操作时，我们可以包含两个异常，即 `stackfullexception` 和 `stackemptyexception`。\n\
  \n```cpp\nclass Stack\n{ public: ………………….\n  …………………..\n  // 异常类\n        class\
  \ stackfullerror {};\n  class stackemptyerror {};\n};\n```\n\n`try` 块及其关联的 `catch`\
  \ 块可以放在主程序中，其中考虑了 `push` 和 `pop` 操作。如下所示`try`\n\n```cpp\n{\n  s.push(“Thunder”);\n\
  \  cout<<s.top()<<endl;\n  s.push(“Anand”);\n  cout<<s.top()<<endl;\n  s.push(“Ramesh”);\n\
  }\n```\n\n以下程序 11.6 将突出这些特性：\n\n示例 11.5: stackassign2.cpp 使用动态数组实现栈 ADT\n\n```cpp\n\
  1\\.  #include<iostream>\n2\\.  #include<string>\n3\\.  using namespace std;\n4\\\
  .  const int max_size=3;\n5\\.  class Stack\n6\\.  { public:\n7\\.  Stack(); //默认构造函数\n\
  8\\.  ~Stack(); // 析构函数\n9\\.  Stack& operator=(const Stack&); // 赋值运算符重载\n10\\\
  . int size() const; // 返回栈中元素个数\n11\\. int empty() const; // 如果栈为空则返回 1\n12\\. int\
  \ & top(); // 返回栈顶\n13\\. void pop(); // 弹出栈顶\n14\\. void push(const int &); //\
  \ 将元素推入栈顶\n15\\. // 异常类\n16\\. class stackfullerror {};\n17\\. class stackemptyerror\
  \ {};\n18\\. private:\n19\\. int* stack_array; // 动态数组\n20\\. int tos; // 栈顶指针\n\
  21\\. int stack_size; // 动态数组的大小\n22\\. };\n23\\. //默认构造函数\n24\\. Stack :: Stack()\n\
  25\\. { stack_array = new int[max_size];\n26\\. stack_size = max_size;\n27\\. tos\
  \ = -1;\n28\\. }\n29\\. //析构函数\n30\\. Stack:: ~Stack() {delete [] stack_array;}\n\
  31\\. Stack& Stack :: operator=(const Stack& S) // 赋值运算符\n32\\. { stack_array =\
  \ new int[S.stack_size];\n33\\. tos = S.tos;\n34\\. stack_size = S.stack_size;\n\
  35\\. for(int i =0 ; i<S.size(); i++)\n36\\. stack_array[i] = S.stack_array[i];\n\
  37\\. return * this; // 用于链式调用\n38\\. }\n39\\. int Stack :: size() const {return\
  \ tos+1;}\n40\\. int Stack :: empty() const\n41\\. { if(tos == -1)\n42\\. return\
  \ 1;\n43\\. else return 0;\n44\\. }\n45\\. void Stack:: push(const int & val)\n\
  46\\. {if( tos<stack_size-1 )\n47\\.  { tos++;\n48\\.  stack_array[tos] = val;\n\
  49\\.  }\n50\\.  else\n51\\.  throw stackfullerror();\n52\\. }\n53\\. void Stack\
  \ :: pop()\n54\\.  { if(tos >= 0)\n55\\.  tos--;\n56\\.  else\n57\\.  throw stackemptyerror();\n\
  58\\.  }\n59\\. int& Stack :: top(){return(stack_array[tos]);}\n60\\. void main()\n\
  61\\. { Stack s;\n62\\.  //检查栈满异常\n63\\.  try\n64\\.  {s.push(10);s.push(20); s.push(30);\n\
