  \ 方法。 |\n\n![image](img/577-1.png)\n\n#### 23.8 总结\n\n1. JAVA 中的图形用户界面 (GUI) 开发是基于组件的。Java\
  \ 组件可以进一步分为容器（containers）和控件（widgets）。\n2. 容器进一步分为根容器和中间容器。\n3. 容器也称为顶层容器，对于每个 GUI\
  \ 程序都是必要的。示例有三个顶层容器：`JFrame`、`JDialog` 和 `JApplet`。\n4. 中间容器不是强制性的，但被广泛使用，因为它们有助于管理和组织控件。`JPanel`\
  \ 是 Swing 中最常用的中间容器。\n5. 控件是用于与用户交互的 GUI 元素。控件也用于获取用户输入。`JButton`、`JLabel`、`JScrollBar`\
  \ 和 `JCheckBox` 是 Swing 中的控件示例。\n6. 对于 Swing ，根节点总是 `JFrame`。\n7. 面板（Panels）是中间容器，因此对于创建\
  \ Java 图形用户界面程序并非必不可少。\n\n\n\n\n\n33. 由于安全限制，Applet 无法从本地文件/磁盘读取数据也无法写入磁盘。Applet\
