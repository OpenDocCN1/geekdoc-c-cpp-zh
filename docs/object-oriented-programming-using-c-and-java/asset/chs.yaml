  \ 覆盖了基类的 Learn()\n学生努力学习专业科目\n另外两个基类重载函数 Learn(int), Learn (int,int) 丢失了\nstd 仍然可以通过显式调用重载的基类函数\n\
  人类以良好的速度学习 */\n```\n\n## 12.7 虚函数\n\n如果函数在基类中声明为虚函数（virtual function），那么我们就可以通过基类指针在派生类中执行同名的覆盖函数。这意味着我们：\n\
  \n```\n存在继承关系。例如 Student 是一个 Human。\n必须声明基类指针并从堆（Heap）中获取内存。\nEx Human * ptr = new\
  \ Student; 这是一个有效的赋值，因为 Student 是一个 Human。\n```\n\n通过基类指针，我们可以访问派生类的所有成员数据和函数。但为了让这个“魔法”生效，我们必须将派生类中将被覆盖的基类函数声明为虚函数，如下：\n\
  \n```\n在基类中\nvirtual void Work() const { cout<<”\\n Human work ……base class.”;}\n\
  在派生类中\nvoid Work()const { cout<<”\\n Students work in\nLaboratories..”<<endl;}\n\
  ```\n\n此外，我们还可以调用被正常覆盖的基类函数，这需要进行显式调用，例如 `std.Human::Work()`，如所示所示所示：`cout<< ptr->GetRollNo();`。我们已经在下一个示例中展示了上述所有概念的工作原理：\n\
  \n**示例 12.6: inherit5.cpp 虚函数**\n\n```cpp\n//inherit5.cpp 虚函数：声明一个名为 Human 的基类和一个\n\
  //名为 Student 的派生类\n1. #include<iostream>\n2. using namespace std;\n3. enum CAT {\
  \ BTECH,MBA,MCA,MSC}; // 学生类别\n4. class Human\n5. {public:\n6. Human():idNo(0),name(“Noname”)\n\
  7. {cout<<”\\nHuman constructor..”<<endl;} // 基类构造函数\n8. ~Human(){cout<<”\\nHuman\
  \ destructor..”<<endl;} // 基类析构函数\n9. // 公有函数\n10. void Learn()const{ cout<<”\\\
  n Human beings strive to learn …”\n<<endl;}\n11.virtual void Work()const { cout<<”\\\
  n Human work ….”<<endl;}\n12. protected: int idNo; char *name;\n13. };\n14. class\
  \ Student:public Human\n15. { public:\n16. Student() {cout<<”\\n Student constructor..\"\
  <<endl;}\n17. ~Student(){}; // 默认析构函数\n18. // 覆盖基类的函数\n19. void Learn(){ cout<<”\\\
  n Students work at college laboratories…”<<endl;}\n20. // 学生自己的函数\n21. void UseNet(){\
  \ cout<<”\\n Students use internet for advancement…”<<endl;}\n22. // 基类虚函数的覆盖\n\
  23. void Work(){ cout<<”\\n Students strive to learn professional subjects\\n”;}\n\
  24. private:\n25. // 特意留空以便于理解程序\n26. };\n27. void main()\n28. {Human *pstd = new\
  \ Student;\n29. cout <<”\\n Calling overriding function Learn()…”<<endl;\n30. cout\
  \ <<”\\nThough object is derived class as the pointer is to base class\n... (注：此处原文存在大量重复的错误输出语句，已按核心逻辑处理)\n\
  ```\n\n\n\n\n\n## 12.9 虚析构函数：为什么以及如何做？\n\n在继承关系中，我们知道 `Student` **是一个** `Human`。因此，我们可以传递一个派生类的指针而不是基类的指针。现在当我们尝试删除该对象时，应该先调用派生类的析构函数，该函数反过来调用基类的析构函数。为了实现这一点，基类的析构函数必须声明为\
  \ `virtual`（虚）。请注意，构造函数**不能**被声明为虚函数。\n\n### 12.10 多重继承的混合继承\n\n在某些情况下，单继承是不够的并会导致歧义。考虑图\
  \ 12.4 所示的示例。\n\n![Hybrid inheritance](img/278-1.png)\n\n**图 12.4** 混合继承\n\n`Student`\
  \ 在大学实验室工作，而 `Athlete` 在大学课余余后在健身房锻炼。但让我们假设招聘公司需要一个 `Professional`，他既要在大学实验室工作，又对健身房和运动有浓厚兴趣。我们需要一个专业人员，根据需要继承\
  \ `Students` 的 `Work()` 以及 `Athlete` 的 `Work()`。此外，`Professional` 必须保留 `Human` 的所有基本素质（如虚箭头所示）。\n\
  \n**多重继承是从多个基类派生出一个类。** 同时也请注意图中，`Student` 和 `Athlete` 具有相同的基类。这种类型的基类**被称为虚基类**，因为尽管两个派生类共享一个基类，但每个派生类都认为它有自己自己的基类。\n\
  \n## 12.11 虚继承\n\n再次参考图 12.4。`Professional` 根据需要从 `Student` 和 `Athlete` 派生属性和品质。为了方便选择性地从\
  \ `Student` 和 `Athlete` 继承属性、函数和成员数据，我们需要将这两个类声明为**从基类的虚继承**。这一概念在我们的下一个示例中得到了说明。我们选择的示例是公司希望选择优秀的学生、优秀的运动员和优秀的人才。因此，我们引入了字段和变量\n\
  \n```\nenum OKAY{FALSE,TRUE}; // 是否符合选择标准。\nenum DIV { DISTINCTION,FIRST, SECOND,\
  \ NATIONAL, STATE, COLLEGE};\n// 用于记录运动员的成就。\n// Num 或 n 表示愿意重视全方位发展的公司数量。\n```\n\
  \n**示例 12.8: inherit7.cpp 虚继承**\n\n```\n1\\. #include<iostream>\n2\\. using namespace\
  \ std;\n3\\. enum CAT { BTECH,MBA,MCA,MSC}; // 学生类别\n4\\. enum BAT { ATHLETE,SPORTS};\n\
  5\\. enum DIV { DISTINCTION,FIRST,SECOND ,NATIONAL, STATE, COLLEGE};\n6\\. // 学生获得的等次\n\
  7\\. enum OKAY{FALSE,TRUE}; // 是否符合选择标准\n8\\. class Humans\n9\\. {public:\n10\\\
  . Humans(int n):idNo(n)\n11\\. {cout<<\"\\n default Humans constructor..\"<<endl;}\
  \ // 基类构造函数\n12\\. virtual ~Humans(){cout<<\"\\nHumans destructor..\"<<endl;} //\
  \ 基析构函数\n13\\. // 公有函数\n14\\. virtual int GetId()const{return idNo;}\n15\\. virtual\
  \ void SetId(int n) { idNo=n;}\n16\\. protected:\n17\\. int idNo;\n18\\. };\n19\\\
  . class Student:virtual public Humans\n20\\. { public:\n21\\. Student(CAT cat ,\
  \ DIV d , int num);\n22\\. virtual ~Student(){}; // 默认析构函数\n23\\. // 学生不同的函数\n24\\\
  . virtual void Learn()const{ cout<<”\\n Students learn relevant courses\\n”;}\n\
  25\\. virtual void Work()const{ cout<<”\\n Students worked Industry programs\\n”;}\n\
  26\\. virtual CAT GetCAT() const { return stcat;}\n27\\. virtual void SetCAT(CAT\
  \ c) { stcat=c;}\n28\\. virtual DIV GetDIV() const { return division;}\n29\\. virtual\
  \ void SetDIV ( DIV d) { division = d;}\n30\\. protected:\n31\\.     CAT stcat;\
  \ // 学生类别\n32\\.     DIV division; // 获得的等次：优/一等等\n33\\. };\n34\\. Student::Student(CAT\
  \ cat , DIV d , int idnum):\n35\\.     Humans(idnum),stcat(cat), division(d)\n36\\\
  .     { cout<<”\\n Students constructor..”<<endl;}\n37\\. class Athlet:virtual public\
  \ Humans\n38\\. { public:\n39\\. Athlet(CAT cat , DIV d , OKAY ok , int idnum);\n\
  40\\. virtual ~Athlet(){}; // 默认析构函数\n41\\. virtual void AtLearn()const{ cout<<”\\\
  n Athlets learn subjects & sports\\n;}\n42\\. virtual void AtWork()const{ cout<<”\\\
  n Athlets worked at lab and GYM\\n”;}\n43\\. virtual void Play() const{ cout<<”\\\
  n Athlets can play games and events\\n”;}\n44\\. virtual CAT GetCAT() const { return\
  \ stcat;}\n45\\. virtual void SetCAT(CAT c) { stcat=c;}\n46\\. virtual DIV GetDIV()\
  \ const { return division;}\n47\\. virtual void SetDIV ( DIV d) { division = d;}\n\
  48\\. virtual OKAY GetOKAY() const { return qualified;}\n49\\. virtual void SetOKAY\
  \ ( OKAY q) { qualified = q;}\n50\\. private:\n51\\.     CAT stcat;\n52\\.     DIV\
  \ division; // 国家/州/大学\n53\\.     OKAY qualified;\n54\\. };\n55\\. Athlet(CAT cat\
  \ , DIV d , OKAY ok, int idnum):\n56\\. Humans(idnum),stcat(cat),division(d),qualified(ok)\n\
  57\\. {cout<<”\\n Athlet constructor..\"<<endl;}\n58\\. class Professional : public\
  \ Student , public Athlet\n59\\. { public:\n60\\. Professional(CAT cat , DIV d ,\
  \ OKAY q ,int idnum , int n); ~Professional(){cout<<”\\n Professionals destructor..\"\
  <<endl;}\n61\\. // n 是重视全面发展的公司数量\n62\\. virtual GetNum() const { return num;}\n\
  63\\. // num：重视体育\n64\\. virtual DIV GetDIV() const { return Student::division;}\n\
  65\\. void AtLearn() const { Learn();} // 学生一样学习\n66\\. void AtWork() const { AtWork();}\
  \ // 学生一样工作\n67\\. private:\n68\\. int num ;\n69\\. };\n70\\. void main()\n71\\\
  . {Professional *ptr = new Professional(BTECH,FIRST,TRUE,5095,100);\n72\\. int rollNo\
  \ = ptr->GetId();\n73\\. ptr->Learn();\n74\\. // 虽然我们调用 Athlet 的 AtLearn()，它会调用\
  \ Student 的 learn()\n75\\. // 我们希望学生在知识上扎实\n76\\. ptr->AtLearn();\n77\\. ptr->Play();\
  \ // 运动员一样玩\n78\\. cout<<\"\\n 重视全方位发展的公司数量：\"<<ptr->GetNum()<<endl;\n79\\. cout<<\"\
  \\n 专业人士获得的等次：\"<<ptr->GetDIV()<<endl;\n80\\. cout<<\"\\n 选中的专业人士是： \"<<rollNo<<endl;\n\
  81\\. delete ptr;\n82\\. }\n```\n\n\n\n\n继承解决了重用性问题。这意味着派生类可以访问基类中声明为 `protected`\
  \ 的所有数据成员和函数成员。我们还学习了派生类可以重写基类中定义的函数。此外，在处理虚函数时，我们看到通过基类指针可以调用派生类对象。\n\n```\nHuman\
  \ *ptr=new Student;\n```\n\n将上述两个特性结合，C++ 为我们提供了一个强大的工具，称为**运行时多态**和**动态绑定**。对于程序员而言，这一特性意味着通过基类指针，我们可以在运行时决定调用某个特定派生类的重写函数。换句话说，我们可以通过基类指针将多个派生类的重写函数进行绑定。\n\
  \n## 12.13 抽象数据类型 (ADTs)\n\n上述这些特性，即运行时多态和动态绑定，允许我们定义一个带有无实现的虚函数（称为纯虚函数）或带有占位功能的基类，仅用于指示用户实现将由派生类完成。这些类被称为抽象数据类型，因为它们隐藏了实现细节。\n\
  \n我们将声明一个名为 `Shape` 的基类。你会发现 `Shape` 没有确定的形状，没有定义的面积、周长或特定的绘图程序。我们将派生出 `Circle`\
  \ 和 `Square` 等类，并提供这些虚函数的具体实现。“具体”意味着所有虚函数都将在每个派生类中被实现。所讨论的概念将在我们的下一个示例中体现。\n\n\
  ### 示例 12.9: inherit8.cpp ADT – 运行时多态和动态绑定\n\n```\n1\\. #include<iostream>\n2\\\
  . using namespace std;\n3\\. const double PI=3.14159;\n4\\. class Shape\n5\\. {\
  \ public:\n6\\. Shape(){};\n7\\. ~Shape(){}\n8\\. virtual double ComputeArea()\n\
  9\\. {cout<<”\\n Shape has no definite Area “<<endl;return 0.0;}\n10\\. virtual\
  \ double ComputePerimeter()\n11\\. {cout<<”\\n Shape has no definite Area “<<endl;\
  \ return 0.0;}\n12\\. virtual void DrawShape() {}};\n13\\. class Circle: public\
  \ Shape\n14\\. {public: Circle(double r):radius(r){};\n15\\. ~Circle(){}; // 默认析构函数\n\
  16\\. // 圆形的实现不同\n17\\. double ComputeArea()\n18\\. {cout<<\"\\n Circle implementation\
  \ of ComputeArea \"<<endl;\n19\\. return PI*radius*radius; }\n20\\. virtual double\
  \ ComputePerimeter()\n21\\. {cout<<\"\\n Circle implementation of ComputePerimeter\
  \ <<endl;\n22\\. return 2*PI*radius; }\n23\\. virtual void DrawShape() {cout<<\"\
  \\n Circle Draw code here\" <<endl;}\n24\\. private:double radius;\n25\\. };\n26\\\
  . class Square: public Shape\n27\\. {public: Square(double r):side(r){};\n28\\.\
  \ ~Square(){}; // 默认析构函数\n29\\. // 正方形的实现不同\n30\\. double ComputeArea()\n31\\. {cout<<\"\
  \\n Square implementation of ComputeArea \"<<endl;\n32\\. return side*side; }\n\
  33\\. virtual double ComputePerimeter()\n34\\. {cout<<\"\\n Square implementation\
  \ of ComputePerimeter <<endl;\n35\\. return 4*side; }\n36\\. virtual void DrawShape()\
  \ {cout<<\"\\n Square Draw code here\"<<endl;}\n37\\. private:double side;\n38\\\
  . };\n39\\. void main()\n40\\. { int choice;\n41\\.      Shape *ptr; // 基类指针\n42\\\
  .      while(choice!=3)\n43\\. {    cout<<\"\\n 1 : Circle 2 : Square 3: Exit ..\
  \ :\";\n44\\.      cin>>choice;\n45\\.      switch(choice)\n46\\.      { case 1\
  \ : ptr = new Circle(2.0); break;\n47\\.      case 2 : ptr= new Square(5.0); break;\n\
  48\\.      case 3 : exit(0);\n49\\.      default: cout<<\"\\n wrong choice. Try\
  \ Again..\"<<endl; continue;\n50\\.      }\n51\\.      // 函数多态和动态绑定的体现\n52\\.  \
  \    ptr->ComputeArea(); // 调用派生类函数\n53\\.      ptr->ComputePerimeter();ptr->DrawShape();\n\
  54\\.     }//end of while\n55\\.     }//end of main\n/*Output 1 : Circle 2 : Square\
  \ 3: Exit .. :1\nCircle implementation of ComputeArea\nCircle implementation of\
  \ ComputePerimeter\nCirle Draw code here\n1 : Circle 2 : Square 3: Exit .. :2\n\
  Square implementation of ComputeArea\nSquare implementation of ComputePerimeter\n\
  Square Draw code here\n1 : Circle 2 : Square 3: Exit .. :3 *//*output :1 : Circle\
  \ 2 : Square 3: Exit .. :1\nCircle implementation of ComputeArea\nCircle implementation\
  \ of ComputePerimeter\nCirle Draw code here\n1 : Circle 2 : Square 3: Exit .. :2\n\
  Square implementation of ComputeArea\nSquare implementation of ComputePerimeter\n\
  Square Draw code here\n1 : Circle 2 : Square 3: Exit .. :4\nwrong choice. Try Again..\n\
  1 : Circle 2 : Square 3: Exit .. :3 */\n```\n\n## 12.14 纯虚函数\n\n有时我们需要某些情况，即基类不应该有任何实现。例如我们在基类的\
  \ `ComputeArea()` 或 `DrawShape()` 函数中没有实现任何内容。它们仅仅是创建指向派生类函数指针（假设所有虚函数已实现）的工具。在这种情况下，使用纯虚函数更好。\n\
  \n```\nvirtual double ComputeArea()=0;\nvirtual void DrawShape()=0;\n```\n\n通过在基类中声明函数，我们是在告诉编译器实现位于派生类中。注意，如果基类拥有纯虚函数，我们完全无法创建基类的对象。此外，所有的纯虚函数必须在派生类中实现。\n\
  \n但如果你有一些每个派生类必须实现的通用功能，那么在每个派生类中重复代码将违背重用性的初衷。幸运的是，你可以将此类通用代码包含在基类 `Shape` 中，对于具体实现，使用派生类的\
  \ `DrawShape()`，完成后返回基类来处理通用功能。我们在接下来的示例中提供了纯虚函数的实现：\n\n### 示例 12.10: inherit9.cpp\
  \ ADT – 运行时多态和动态绑定\n\n\n\n\n\n```cpp\n#include<iostream>\nusing namespace std;\n\
  const double PI=3.14159;\nclass Shape\n{\npublic: \n    Shape(){};\n    ~Shape(){}\n\
  \    virtual double ComputeArea()=0; //pure virtual function\n    virtual double\
  \ ComputePerimeter() =0;\n    virtual void DrawShape()=0;\n};\n// 我们将实现 DrawShape()，尽管它是一个纯虚函数\n\
  // 以包含所有派生类函数的公共功能\nvoid Shape::DrawShape()\n{cout<<”n Completion of DrawShape()\
  \ mechanism from derived class…”<<endl; }\nclass Circle: public Shape\n{\npublic:\
  \ \n    Circle(double r):radius(r){};\n    ~Circle(){}; // 默认析构函数\n    // 圆形的实现方式不同\n\
  \    double ComputeArea()\n    {cout<<\"\\n Circle implementation of ComputeArea\
  \ \"<<endl;\n    return PI*radius*radius;}\n    double ComputePerimeter()\n    {cout<<\"\
  \\n Circle implementation of ComputePerimeter \"<<endl;\n    return 2*PI*radius;}\n\
  \    void DrawShape()\n    {cout<<\"\\n Circle Draw code here\"<<endl;\n    Shape::DrawShape();}\
  \ // 调用基类以完成公共功能\nprivate: double radius;\n};\nclass Square: public Shape\n{\npublic:\
  \ \n    Square(double r):side(r){};\n    ~Square(){}; // 默认析构函数\n    // 正方形的实现方式不同\n\
  \    double ComputeArea()\n    {cout<<\"\\n Square implementation of ComputeArea\
  \ \"<<endl;\n    return side*side;}\n    double ComputePerimeter()\n    {cout<<\"\
  \\n Square implementation of ComputePerimeter \"<<endl;\n    return 4*side;}\n \
  \   void DrawShape()\n    {cout<<\"\\n Square Draw code here\"<<endl;\n    Shape::DrawShape();\
  \ } // 调用基类以完成公共功能\nprivate:double side;\n};\nvoid main()\n{\nint choice;\n    Shape\
  \ *ptr; // 指向基类的指针\n    while(choice!=3)\n    {cout<<\"\\n 1 : Circle 2 : Square\
  \ 3: Exit .. :\";\n    cin>>choice;\n    switch(choice)\n    { \n    case 1 : ptr\
  \ = new Circle(2.0); break;\n    case 2 : ptr= new Square(5.0); break;\n    case\
  \ 3 : exit(0);\n    default: cout<<\"\\n wrong choice. Try Again..\"<<endl; continue;\n\
  \    }\n    ptr->ComputeArea(); ptr->ComputePerimeter(); ptr->DrawShape();\n}//end\
  \ of while\n}\n```\nOutput 1 : Circle 2 : Square 3: Exit .. :1\nCircle implementation\
  \ of ComputeArea\nCircle implementation of ComputePerimeter\nCirle Draw code here\n\
  Completion of DrawShape() mechanism from derived class…\n1 : Circle 2 : Square 3:\
  \ Exit .. :2\nSquare implementation of ComputeArea\nSquare implementation of ComputePerimeter\n\
  Square Draw code here\nCompletion of DrawShape() mechanism from derived class…\n\
  1 : Circle 2 : Square 3: Exit .. :3\n\n## 12.15 总结\n\n1. 重用性是继承被包含为 OOP 语言重要概念的主要原因。\n\
  2. 继承规定了关系的类型。\n3. 派生类可以继承公共、私有或保护成员。\n4. 如果是公有继承，则基类的公共和保护成员在派生类中仍保持为公共和保护。\n5.\
  \ 如果是保护继承，则公共和保护成员将变为保护成员。\n6. 如果是私有继承，则公共和保护成员将变为私有成员。\n7. 单继承是指派生类仅继承自一个基类的情况。\n\
  8. 多重继承是指派生类继承自多个基类的情况。\n9. 层次结构继承是指多个派生类继承自同一个基类的情况。\n10. 多级继承是指派生类继承自一个已经继承了另一个类的类的的情况。\n\
  11. 混合继承是指派生类继承自多个基类，而这些基类反又继承自同一个基类的情况。\n12. 在混合继承中，可能会出现歧义，要解决这种歧义，可以使用作用域解析运算符\
  \ `::` 进行显式调用，或将基类声明为虚。这被称为虚继承。\n13. 当派生类重写基类函数时，如果该基类函数被重载了三次，那么除了被重写的函数外，另外两个重载函数将被隐藏且不可用。\n\
  14. 如果函数在基类中声明为虚函数，那么我们可以使用基类指针在派生类中执行同名的重写函数。\n15. 在多重虚函数中，基类定义了一个虚函数，可以有多个派生类拥有它们自己的实现。\n\
  16. 析构函数可以是虚的，但构造函数不能是虚的。\n17. 运行时多态意味着我们可以从多个函数中绑定重写函数。\n18. 类是抽象类型，因为它们没有实现。\n\
  19. `virtual void DrawShape()=0;` 纯虚函数。\n\n## 练习题\n\n#### 单选题\n\n1. 继承规定了关系的类型。\n\
