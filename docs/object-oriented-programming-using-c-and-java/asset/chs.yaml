  \ //create an object\n15\\. Swap obj=new Swap();\n16\\. obj.SwapVars(x, y);\n17\\\
  . System.out.println(“X&Y variables after return from Method”);\n18\\. System.out.println(“\
  \ X = ” +x + “ Y = ” + y);\n19\\. }\n20 }// end of Swap\nOutput: X&Y variables before\
  \ calling Method X = 10 Y = 100\nX&Y variables inside Method after swapping X =\
  \ 100 Y = 10\nX&Y variables after return from Method X = 10 Y = 100\n```\n\n| **第\
