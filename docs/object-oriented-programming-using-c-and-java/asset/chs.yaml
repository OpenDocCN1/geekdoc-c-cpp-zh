  \ `System (GRCSYS)` 类的类图了。\n\n![image](img/100-1.png)\n\n## 5.7 可复用设计\n\n使用 OOAD\
  \ 原则设计软件项目是一个复杂的过程，而设计具有可复用特性的 OOAD 项目更为困难。但由于生产率的提高，我们需要使用可复用特性。可复用特性集中在两个方面：\n\
  \n* **代码的可复用**：这是内置语言特性，并使用了组合、聚合等语言特性。\n* **设计的可复用**：这一方面侧重于构建软件架构复用。\n\n因此，设计模式具有以下特征：\n\
  \n* **模式名称（Pattern Name）**：识别用于复用的设计模式。名称描述了设计问题、解决方案及其后果。\n* **问题（Problem）**：描述问题以及何时应用特定的设计模式。例如，问题描述了将算法表示对象的特定问题。\n\
  * **解决方案（Solution）**：设计元素、它们的关系、职责和协作。解决方案并不是精确的，因为设计模式像是一个模板，需要针对特定问题进行适配。设计模式提供了问题的类和对象的抽象描述。\n\
  * **后果（Consequences）**：将设计模式应用于问题后的后果。列出后果有助于设计者从替代方案中进行选择。\n\n设计模式如何帮助设计者？\n\n\
  * 识别不那么明显的对象，例如过程或算法。\n* 决定什么应该是对象——换之，对象的粒度。\n* 指定对象的接口。\n* 指定对象的实现。\n\n**可复用面向对象的设计原则**\n\
  \n* 继承扩展了类的功能，只需通过扩展现有类即可获得新类。\n* 由于多态性，所有派生类共享相同的接口。接口的用户仅受接口限制，通常不感知派生类的实现。这是复用的一大特性。我们可以面向接口编程而不是面向实现。\n\
  * 扩展功能的继承可以被看作破坏封装，而组合对于被组合的对象具有定义良好的接口，因此接口隐藏了实现。因此，组合比继承是更好的可复用特性。\n* 使用模板的泛型编程是除继承和组合之外的第三种复用方法。泛型模板允许我们在不指定所有类型的情况下定义类型。然后可以在运行时作为参数传递类型。例如，我们可以将\
  \ `integer` 作为类型传递给泛化列表。\n\n## 5.8 SASD 和 OOAD 方法论的比较\n\n\n\n\n\n- 分阶段的逐步开发和文档编制。\n\
  - 两种技术都使用图形化设计和 `CASE`、`UML` 等图形化工具来分析和建模需求。\n\n## 差异\n\n- `SASD` 是面向过程的。\n- `OOAD`\
  \ 是面向数据的。\n- `OOAD` 封装了数据和过程。\n- `OOAD` 高度依赖于可重用组件。\n- 在 `SASD` 中，收集用户需求并根据需求绘制规格书，然后要求用户对规格书签字确认。\n\
  - 在 `OOAD` 中，需求和规格书在整个开发期间反复匹配，且用户参与到每一个阶段。\n\n## 5.9 总结\n\n1. 项目管理有四个阶段，即：启动（inception）、深化（elaboration）、构建（construction）和交付（delivery）。\n\
  2. 软件开发周期的瀑布模型密切遵循结构化分析与设计方法，并在工业中广泛应用。\n3. 结构化分析与设计 (`SASD`) 方法用于将业务模型转换为可用于开发计算机程序的规格书。\n\
  4. `SASD` 技术试图通过将大型、复杂的问题分解为更小、更容易处理的问题来解决复杂问题。该技术可以被称为分治法。所采用的方法也可以称为自顶向下法。\n5.\
  \ `SASD` 包含数据建模和功能建模。使用 `DFDs` 描述数据流和控制流。\n6. `SASD` 的主要元素有：(1) 目的声明，(2) 上下图，(3)\
  \ 事件列表，(4) `DFDs`，(5) 数据字典，(6) 实体关系图等。\n7. `SASD` 的上下文是一组输入、输出和一个转换系统。\n8. 事件列表的目的是准备一份被设计系统应做出响应的外部事件/活动列表。\n\
  9. 数据流图 (`DFDs`) 也称为数据流图，用于分析阶段。`DFD` 将功能视为流过系统的数据流。`DFD` 突出了从输入阶段到输出阶段通过各种过程实现的数据转换。\n\
  10. 数据字典（或 `database dictionary`）是定义数据库的文件。数据字典只维护管理数据的信息，但不包含实际数据。我们可以将其称为关于数据的元数据（meta\
  \ data），而非实际数据。\n11. 实体关系图 (`ERD`) 是系统数据布局在高度抽象层次上的图形化表示。它定义了系统中的数据元素及其相互关系。\n12.\
  \ 过程规格显示了过程细节，这些细节在 `DFD` 中是不显示的。`DFD` 中模块的输入、输出和算法包含在过程规格中。\n13. 功能分解：为了确保有效性，我们需要指定约束和操作，以免原始规格和需求因功能分解而受损害。\n\
  14. 面向对象的类支持抽象、封装、多态和可重用的面向对象原则。类是对象的规格书。\n15. 类派生自用例、问题陈述或叙述；类提供了需求的抽象，并提供了应用程序的内部视图。\n\
  16. `OOAD` 的阶段为：(1) 识别类，(2) 识别属性，(3) 指定操作以及 (4) 确定关联和关系。\n17. 关系是类之间的关联。当一个类为其他类提供某些服务，或使用其他类提供的服务时，类之间就会发生关系。\n\
  18. 当一组数据不严格属于参与类中的任何一个类时，就需要创建关联类。\n19. 在组合中，一个类可以包含其他类。例如，`Student` 类可以包含 `Date`\
  \ 类。这可以被看作整体与部分的关系。这也意味着当整体被删除时，部分也会被删除。\n20. 在聚合中，整体被删除时部分不会被破坏。这相当于“拥有”类型的关系。\n\
  21. 泛化和专门源于继承关系。基类可以被视为泛类，而从基类扩展的类是专门的派生类。\n22. 接口提供了行为的通用规范，但与继承类不同，接口无法创建或实例化。接口仅指定其他类继承的通用行为。\n\
  23. 可重用性围绕代码的可用以及通过使用设计模式提供的可用。\n24. 设计模式当问题反复出现且存在可识别模式时形成的模式，因此在类似的情况下，可以使用设计模式来实现优雅的解决方案。换句话之，设计模式允许我们从设计方案中进行选择并使系统可重用。\n\
  25. 继承、组合和参数化模板是面向对象语言提供的确保可重用特性的工具。\n\n## 练习题\n\n### 单选题\n\n1. 规格书是以下交付物：\n   \
