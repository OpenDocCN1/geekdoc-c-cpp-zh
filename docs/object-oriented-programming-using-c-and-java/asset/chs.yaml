  \ 类似，唯一的区别在于 `GridLayout` 的实例化，如第 22 行所示。在我们当前的示例中，我们需要指定行数和列数；行和列数均为三。\n\n### 23.5.3\
  \ 流式布局 (Flow Layout)\n\n流式布局是默认布局。如果你不使用 `setLayout()` 指定任何布局，面板默认将从左到右、从上到下排列。流式布局见图\
  \ 23.7。Java 编程涉及两个部分：第一部分创建组件和容器，第二部分处理事件。事件分为两种类型：高级事件和低级事件。\n\n#### 23.6.1 监听器\
  \ (ActionListener)\n\n动作事件是 Java 中常见的事件之一。当用户点击按钮或从菜单中选择项目时，就会产生这些事件。为了处理动作事件，我们需要创建一个实现\
  \ `ActionListener` 接口的类。`ActionListener` 接口要求我们实现 `actionPerformed(ActionEvent e)`\
  \ 方法。当用户对组件执行操作时，`actionPerformed()` 函数会被调用。示例 23.12 说明了如何创建事件处理器并处理动作事件。\n\n**示例\
  \ 23.11：演示事件处理的程序**\n\n\n\n\n上述程序用于统计用户点击“Click Me”按钮的次数。计数会在屏幕上更新，如图 23.13 所示。程序启动时，计数为\
  \ 0；用户点击 12 次后，计数显示为 12。点击按钮时更新计数是在 `HandleEvent` 类第 33 行完成的，该类实现了 `ActionListener`\
  \ 接口。如上所述，任何实现 `ActionListener` 的类都应该实现 `actionPerformed()` 方法。这在第 34 行完成。每当用户按下“Click\
  \ Me”按钮时，`actionPerformed()` 函数就会被调用。在此函数中，我们在第 35 行更新 `count` 变量，并在第 36 行通过调用 `JLabel`\
  \ 的 `setText()` 函数更新显示计数的标签。我们将 `HandleEvent` 类实现为 `DisplayPanel` 的内部类，因为它需要使用在\
  \ `DisplayPanel` 类中定义的 `count` 和 `label` 变量。第 29 行 `button.addActionListener(new\
  \ HandleEvent())` 显示了如何将动作事件处理器绑定到按钮组件上。像第 29 行那样将组件与事件处理器绑定是至关重要的，否则事件将无法发送到事件处理器。\n\
  \n![Output of Example 23.1](img/560-1.png)\n\n**图 23.12** 示例 23.11 的输出\n\n![Output\
  \ of Example 23.12](img/563-1.png)\n\n**图 23.13** 示例 23.12 的输出\n\n#### 23.6.2 项目监听器\n\
  \n项目事件（Item events）通常由复选框、单选按钮和组合框等组件触发，用户在这些组件中选择或取消选择某项。为了能够在程序中处理项目事件，我们需要创建一个实现\
  \ `ItemListener` 接口的类。\n\n`ItemListener` 接口要求我们实现一个方法 `itemStateChanged(ItemEvent\
  \ e)`。每当用户在组件中选择或取消选择某项时，`itemStateChanged()` 函数就会被调用。示例 23.12 阐了如何创建一个项目事件处理器并处理项目事件。图\
  \ 23.13 显示了输出。\n\n**示例 23.12：演示项目事件处理的程序**\n\n```\n 1\\. import java.awt.*;\n  \
