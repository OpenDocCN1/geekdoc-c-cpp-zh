  ### 15.6.5 Java 开发环境\n\n在执行程序之前，需要了解 Java 开发环境（参考图 15.4）。\n\n**步骤 1：编辑：** 使用任何记事本编辑器编辑源程序。例如，我们的程序将有一个主类\
  \ `HelloWorld`。因此，我们的 Java 程序也应命名为 `HelloWorld.java`。记住，如图 15.8 所示，我们要使用包 `com.oops.chap1`。因此，移动到目录\
  \ `C:\\Oopsjava\\examples\\src\\com\\oops\\chap1` 并创建源文件。\n\n`cd C:\\Oopsjava\\\
  examples\\src\\com\\oops\\chap1> edit HelloWorld.java`\n\n**步骤 2：编译：** 我们需要将所有编译后的代码存储在\
  \ `C:\\Oopsjava\\examples\\bin\\com\\oops\\chap1` 中。因此，从 `C:\\Oopsjava\\examples\\\
  src\\com\\oops\\chap1` 目录，编译源文件并将类文件重定向到 `C:\\Oopsjava\\examples\\bin\\com\\oops\\\
  chap1`。要进行重定向，你需要使用 `-d` 选项并提供指向 bin 目录的完整路径：\n\n`C:\\OopsJava\\examples\\src\\\
  com\\oops\\chap1>javac -d c:\\Oopsjava\\examples\\bin HelloWorld.java`\n\n编译器创建字节码并以名为\
  \ `HelloWorld.class` 的文件存储在 `c:\\Oopsjava\\examples\\bin\\com\\oops\\chap1`。\n\n\
  **步骤 3：加载器：** `Class Loader`（类加载器）将字节码（`Class` 文件）加载到主内存。\n\n**步骤 4：字节码验证器：** 它检查字节码是否均正常且没有违反\
  \ Java 的安全限制。\n\n**步骤 5：JVM：**（Java 虚拟机）调用解释器和即时编译（JIT）编译器，并将字节码转换为本地机器可以理解的机器码。`JVM`\
  \ 是解释器和编译器的结合。`JVM` 在解释时会寻找“热点”，即程序中重复的部分，例如执行多次的循环。在这些情况下，`JIT` 编译器会将它们转换为机器码，而其他部分则由\
  \ `JVM` 的解释器处理。\n\n### 15.6.6 我们的第一个应用程序\n\n`HelloWorld.java` 的语法为：“Welcome to Object\
  \ Oriented in Java”。\n\n**示例 15.4: HelloWorld.java**\n\n```java\npackage com.oops.chap1;\n\
  \npublic class HelloWorld {\n    public static void main(String[] args) {\n    \
  \    System.out.println(\"Welcome to Object Oriented in Java\");\n    }\n}\n```\n\
  \n\n\n\n注意，由于这是一个简单的程序，我们是从 `bin` 目录执行执行的。对于大型程序或带有多个类的程序，我们会编写一个驱动程序，并将类程序放置在 `TestDriver`\
  \ 目录。然后，我们需要从 `TestDriver` 目录执行 Java 命令。\n\n### 15.6.7 使用 Swing 组件的应用程序\n\nJava\
