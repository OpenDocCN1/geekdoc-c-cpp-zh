  \ 6\\. { // 你需要浮点（实数）数据类型来存储半径和面积\n  7\\. float radius, area;\n  8\\. const double\
  \ PI=3.1415926; // PI 值是常量且不改变\n  9\\. // 从用户处获取半径。用户可以输入 0 来停止程序*/\n  10\\. cout<<”\\\
  n Enter radius of the ball. To stop enter 0 for the radius \\n”;\n  11\\. cout<<”\\\
  n Radius = ? “;\n  12\\. cin>>radius; // 用户输入半径值\n  13\\. /* 我们想要计算不同球的面积。因此用户输入不同的半径。用户可以通过为半径输入\
