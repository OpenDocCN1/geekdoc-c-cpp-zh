  \ `java.lang.Exception` 类。 |\n\n## 20.10 多线程概念\n\n你一定对电视提供的画中画功能很熟悉，当新闻播员正在播新闻时，会出现一个小窗口，显示完全不同的新闻条目或对播员正在介绍内容的放大（可能是板球比赛）。这是如何可能的呢？显然你需要两个独立的执行单元。\n\
  \n什么是 `thread`（线程）？简单来说，对于 `Java` 中的 `thread` 相当于操作系统的 `process`（进程）。`Thread` 是一个指令序列，当\
  \ `CPU` 被调度处理该 `thread` 时就会被执行。到目前为止，我们执行的 `void main()` 程序确实是由 `Java` 在单个 `thread`\
  \ 上执行的。这一概念在图 20.3 中所示。\n\n![Multithreaded program](img/486-1.png)\n\n**图 20.3**\
  \ 多线程程序\n\n### 20.10.1 多线程程序\n\n当多个 `thread` 正在执行独立的进程时，它被称为多线程程序。为什么需要多线程编程？在程序员需要同时处理多个任务的任何情况下，多线程都是用的。如游戏编程、前台和后台作业、多个输出的并发处理等情况非常适合多线程编程。线程和多线程程序非常适用于客户端服务器程序，其中服务器处理位于多个\
  \ `threads` 的客户端。\n\n## 20.11 进程 vs 线程\n\n### 20.11.1 进程\n\n`process`（进程）是一个正在运行的任务。我们也可以说，这是一个由\
  \ `CPU` 执行的简单指令序列。操作系统会创建多个 `processes`。然后，`OS` 会根据进程的优先级调度 `CPU` 来处理不同的进程。`OS`\
  \ 在进程之间切换 `CPU` 并分配 `CPU` 时间以完成所有任务。当发生进程切换时，必须保存当前执行的上下文，如栈、`variables`、`status`\
  \ 等。由于涉及上下文切换，进程被称为“重量级进程”。\n\n### 20.11.2 线程\n\n`Java` 通过名为“多线程编程”的创新且独特的特性，在程序员面前引入了并发处理（而非并行），就像\
  \ `OS` 对其 `processes` 做的那样。在多线程程序中，主程序运行在 `main thread` 上，但主程序会创建 `threads` 来运行独立且并发的程序流。正是主程序创建并启动了其他三个\
  \ `threads`，如图 20.3 所示。一旦启动，这三个子线程将根据设置的优先级和 `CPU` 的调度并发运行，共享 `CPU` 时间和其他公共资源。\n\
  \n`Threads` 也称为轻量级，因为它们消耗的内存资源较少。这是因为多线程编程不涉及上下文切换。\n\n## 20.12 如何创建和运行线程？\n\n默认情况下，我们的主程序运行在\
  \ `main thread` 上。要创建我们自己的 `threads`，使用以下步骤：\n\n*   **步骤 1：** `thread` 可以通过继承 `Thread`\
  \ 类或实现 `Runnable` 接口来创建。\n\n    **示例：** `class ThreadTest extends Thread` 或 `class\
  \ ThreadTest implements Runnable`\n\n*   **步骤 2：** 在类内部定义 `run()` 方法。在 `run` 方法内部，我们可以实现线程功能。`Run()`\
  \ 方法会被 `thread` 自动识别并执行。\n\n    ```\n     class ThreadTest extends Thread{ or\n\
  \          class ThreadTest extends implements Runnable{\n          public void\
  \ run()\n          {……………..}\n    ```\n\n    注意，`run` 方法是 `thread` 整个动作发生的地方。它就像\
  \ `main()` 方法。它可以声明自己的 `variables`，实例化其他类。`Run` 是任何新创建 `thread` 的入口。当 `run()` 结束时，创建的\
  \ `Thread` 也会结束。\n\n*   **步骤 3：** 在 `main()` 中创建 `ThreadTest` 对象。该对象用于调用 `run` 方法。\n\
  \n    ```\n     class ThreadTestDemo{\n          public static void main( String[]\
  \ args) {\n          ThreadTest obj =new ThreadTest();\n    ```\n\n*   **步骤 4：**\
  \ 在 `main` 中创建 `thread`并将线程附加到对象。\n\n    ```\n     Thread thrd = new Thread(obj);\n\
  \          Thread thrd = new Thread( obj “threadname”);\n    ```\n\n*   **步骤 5：**\
  \ 通过调用 `thread` 上的 `start` 方法运行 `thread`。\n\n    ```\n     Thrd.start();\n    ```\n\
  \n我们可以使用 `sleep()` 方法挂起 `thread` 执行指定一段时间。语法为：`static void sleep(milliseconds) throws\
  \ InterruptedException` 或 `static void sleep(milliseconds, nanoseconds) throws InterruptedException`。由于\
  \ `sleep` 是静态方法，我们可以直接调用：`Thread.sleep(ms)`。在线程挂起期间，`CPU` 会处理其他线程。\n\n`Thread` 类还提供了\
  \ `getName()` 和 `setName()` 方法，例如 `Thread.getname()` 和 `Thread.setName(“name”)`。`Thread`\
  \ 类和 `Runnable` 接口的方法如表 20.2 所示。\n\n**表 20.2** 线程类和 runnable 接口的方法\n\n| 方法 | 备注\
  \ |\n| --- | --- |\n| `getName();setName(stg);` | 获取并设置 `threads` 的名称 |\n| `getPriority();setPriority()`\
  \ | 获取和设置优先级的方法 |\n| `isAlive();join()` | 检查线程是否仍在运行。它会抛出 InterruptedException。调用它的线程将等待直到指定的线程加入它。\
  \ |\n| `sleep(ms);sleep(msec,nsec)` | 挂起线程执行毫秒时长 | 挂起线程执行毫秒和纳秒级时长 |\n\n我们在示例 20.8\
  \ 中使用 `extends` 方法实现 `threads` 的创建。我们在 Ex 20.4 中展示了使用 `Runnable` 接口的实现。`Runnable`\
  \ 是创建 `threads` 的接口。程序员必须执行重写的 `run()` 来创建并运行 `thread`。\n\n**示例 20.9：FirstThreademo.java\
