  3.  **对象（Object）：** 对象是一个实体。\n4.  类的方法对于对象的所有实例都是通用的；每个对象实例都有自己的一组属性。成员数据也称为实例变量。\n\
  5.  Java 的访问修饰符有 `Public`、`Private`、`protected` 和默认修饰符（包级别）。\n6.  当声明一个类并创建一个对象时，会调用类的构造函数。它的工作是创建对象、为数据成员分配内存，如果用户提供了初始值，则用这些值进行初始化。\n\
  7.  构造函数的名称与类名相同，但没有返回值。\n8.  构造函数默认总是被视为 `public`。每当创建对象时，构造函数都会自动调用。当我们在创建对象时传递初始值时，构造函数被称为参数化构造函数。\n\
  9.  将数据作为参数传递给方法有两种方法：值传递（Call by Value）和引用传递（Call by reference）。在值传递中，参数被拷贝到被调用的函数区域。被调用方法对变量的更改是局部的，不会反映到调用方法。Java\
  \ 使用值传递来传输所有原始数据类型。\n10. 在引用传递中，地址被传递给被调的方法。所做的更改会反映到调用方法。Java 使用引用传递将对象作为参数传递给方法。\n\
  11. 方法名相同但参数数量不同或类型不同，我们可以说方法被重载（overloaded）。重载方法可以有不同的返回值。\n12. 递归是 Java 语言支持的一种高级特性。递归意味着方法调用其自身。\n\
  13. `this` 操作符指向调用该方法的对象。它也用于解决命名冲突。\n14. Java 对对不再需要的对象采用自动内存释放。Java 使用自动垃圾回收器来管理内存。\n\
  15. Java 运行时在对象释放之前会调用 `finalize()` 方法。\n16. `Final` 关键字用于防止方法重写。\n17. **Public：**\
  \ 成员可以被任何代码访问。\n18. **Default（默认）：** 对包内可见，包外私有。\n19. **Private：** 成员对外部隐藏。\n20.\
  \ **Protected：** 成员对类的后代类可见。\n21. 静态变量是全局的。\n22. 静态方法可以在创建对象之前调用静态方法。\n23. `this`\
  \ 操作符不能在静态方法中使用。\n24. 嵌套类意味着类中的类，也称为容器类。\n25. 非静态嵌套类可以不使用外部对象引用外部类的所有成员。\n\n## 练习题\n\
