  \n### 学习目标\n\n在本章结束，你应该能够理解并使用：\n\n* 指针和引用，并知道何时使用它们？\n* 对象和指针。\n* 对象和引用。\n* 悬空指针和内存泄漏。\n\
  * 常量指针、常量对象和引用。\n\n## 9.1 引言\n\n在我们教授 C++ 的经验中，发现学习者对指针、引用以及相关的内存管理感到相当困惑。这主要是因为他们可能学会了指针和引用的“是什么”，而没有理解它们的“为什么”。在本章中，我们想介绍指针和引用的特殊特性，例如：\n\
  \n* 指针就像任何其他变量一样。\n* 指针像变量一样有地址。\n* 指针指向变量或结构（如数组或对象）。\n* 如果你想获取指针所指向对象的值，只需对指针解引用。\n\
  * `new` 运算符为指针分配内存，`delete` 释放内存。\n* 指针最棒的部分是它们可以被重新赋值。\n* 引用是对象的另一个别名。\n* 引用始终引用该对象。\n\
  * 引用不能被重新赋值。\n\n在本章中，我们将从基础开始，教你如何在 C++ 范式中处理指针和引用，而避免悬空指针和内存泄漏等陷阱。\n\n#### 9.2\
  \ 指针的、、为什么以及怎么\n\n在 C++ 中，我们想要使用指针是因为它们指向内存中的位置，并且作为函数参数在主程序和函数之间移动多个数据项时非常高效。此外，你可以拥有指向函数的指针，并根据用户的选择通过重新赋值指针来执行不同的函数。指针可以方便重新赋值，就像你可以用食指指向任何人一样。\n\
  \n《摩婆罗多》中著名的弓手阿尔朱那（Arjuna）是如何使用他的箭的？首先，他从存储器中取出一箭。其次，他给它起了一个名字（如图 9.1 所示的 `Nag Astra`\
  \ Mantra）。然后他在思考或从导师（克里希纳神）那里获取地址时将其指向地面。接着他指向地面，以免箭意外飞出击中路人或意外目标。最后，在释放箭之前，根据给定的地址对准目标！在处理指针时，我们将这样做。\n\
  \n![包含术语的指针示例](img/190-1.png)\n\n**图 9.1** 包含术语的指针示例\n\n```\nint *ptr=0; // 创建了一个\
  \ int 类型的指针\n        // 注意 ptr 是指针\n        // 指针是地址\n        // *ptr 是值\n     \
  \   // 你现在指向了 NULL (0 被处理为 NULL)\n```\n\n当 `*` 在声明语句的变量之前时，意味着该变量是一个指针变量。例如，`int\
  \ *ptr=0;` 中的 `ptr` 就是一个指针变量。在创建指针时立即初始化它是一个良好的安全编程习惯。\n\n## 9.3 指针的声明与用法\n\n假设在地址\
  \ 2513 处存储了一个名为 `age` 的整数变量，如图 9.2 所示。在地址 2613 处有一个整数变量 `age2`。\n\n![内存中的指针](img/190-2.png)\n\
  \n**图 9.2** 内存中的指针\n\n**示例 9.1: 指针的声明与用法**\n\n```\n int age=50;\nint age2=18;\n\
  \ //我们希望指针 ptr 指向 age;\n ptr = & age; // 你将 ptr 赋值给 age.& 称为地址运算符\n cout<< age;\
  \ // 显示 50\n cout<<*ptr; // 显示 50 . *ptr 是存储位置的值，即 50\n // 一旦创建你就可以重新赋值指针\n ptr=&\
  \ age2;\n cout<<*ptr; // 显示 18 . *ptr 是存储位置的值，即 18\n```\n\n解引用或间接运算符（`*`）用于获取指针所指向的值。例如，`cout<<*ptr;`\
  \ // 显示 50\n\n**示例 9.2: ptr1.cpp 指针的用法**\n\n```\n #include<iostream>\nusing namespace\
  \ std;\nvoid main()\n{ int age1=50;\n  int age2=18;\n  //创建一个指针\n  int * ptr=0;\n\
  \  // 将其赋值给 age1\n  ptr = & age1;\n  cout << age1 << endl;\n  cout << *age1 << endl;\
  \ // 注意：此处原代码可能有误，age1 不是指针，应为 ptr\n  cout << *ptr << endl;\n  // 将指针重新赋值给 age2\n\
  \  ptr = & age2;\n  cout << *ptr << endl;\n}\n```\n\n#### 9.4 值传递与引用传递（指针）\n\n它们是什么？你可以通过以下方式将变量传递给函数：\n\
  \n1. **值传递：** 每当调用函数时，参数的值都会复制到形式参数中。因此，存在复制开销。由于只有副本到达函数，在本地函数中进行的更改不会反映在调用函数的原始变量上。此外，如果复制的数据很大（例如结构体），这种方法效率很低。因此它仅用于小数据。\n\
  \n2. **引用传递：** 实际参数不复制，只传递地址（指针）。函数获取这些地址作为参数，并在传递地址的变量上进行操作。因此，对变量的更改会反映在调用函数的变量上。我们只传递地址——没有值传递那样的复制开销。引用传递有两种类型：\n\
  \n    1. 使用指针的引用传递\n\n    2. 使用引用的引用传递\n\n两种类型都是有效的。如果需要重新赋值，我们将使用指针；而如果你使用引用，其固定的内存位置和重新赋值到新位置是不可行的。\n\
  \n**示例 9.3: valptrref. 使用指针突出值传递和引用传递的程序**\n\n\n\n\n\n```cpp\n#include <iostream>\n\
  using namespace std;\n// 函数原型声明\nvoid Swap( int a , int b); // 值传递\nvoid PtrSwap\
  \ ( int *a , int * b); // 引用传递。a & b 默认是指针\nvoid main()\n  { int x=5;\n  int y=10;\
  \ \n  // 值传递\n  Swap( x,y);\n  cout<<\"\\nafter call by value :\"<<endl;\n  cout<<\"\
  x value after swap:\"<<x<<endl;\n  cout<<\"y value after swap:\"<<y<<endl;\n  //\
  \ 使用指针进行引用传递。注意我们必须发送指针\n  // 即 x & y 的地址。因此我们将传递 &x 和 & y。\n  PtrSwap(&x,&y); \n\
  \  cout<<\"\\nafter call by ref using pointers :\"<<endl;\n  cout<<\"x value after\
  \ Ptrswap:\"<<x<<endl;\n  cout<<\"y value after Ptrswap:\"<<y<<endl;\n}//end of\
  \ main\n// 函数定义\nvoid Swap ( int a, int b)\n { int temp ; // 两个局部变量\n   temp=a;\n\
  \   a=b;\n   b=temp;\n   cout<<\"\\ninside Swap using pointers :\"<<endl;\n   cout<<\"\
  x value inside Swap:\"<<a<<endl;\n   cout<<\"y value inside Swap:\"<<b<<endl;\n\
  }\nvoid PtrSwap ( int *a, int *b)\n   { // a & b 是指针。因此我们需要一个名为 temp 的指针\n   int\
  \ temp;\n   temp=*a;\n   *a=*b;\n   *b=temp;\n   cout<<\"\\ninside PtrSwap using\
  \ pointers :\"<<endl;\n   cout<<\"x value inside Ptrswap:\"<<*a<<endl;\n   cout<<\"\
  y value inside Ptrswap:\"<<*b<<endl;\n}\n/*输出：inside Swap using pointers :\nx value\
  \ inside Swap:10\ny value inside Swap:5\nafter call by value :\nx value after swap:5\n\
  y value after swap:10\ninside PtrSwap using pointers :\nx value inside Ptrswap:10\n\
  y value inside Ptrswap:5\nafter call by ref using pointers :\nx value after Ptrswap:10\n\
  y value after Ptrswap:5 */\n```\n\n在 `示例 9.3` 中，给出了一些有趣的结果。尽管在 `Swap` 函数内部值实际上交换了，但正如所述，它们并没有反映在主程序中。而在\
  \ `PtrSwap` 的情况下，我们传递了指针，`PtrSwap` 的结果反映到了主程序中。这与我们学到的一致。\n\n## 9.5 动态内存 new 和 delete\
  \ 函数\n\n我们在 `第 3 章` 中已经学习了 C++ 语言的内存管理和映射。在本节中，我们将学习通过指针和引用，使用 `new` 和 `delete`\
  \ 等运算符来使用堆内存（也称为空闲或动态内存）的工具和技术。\n\n动态内存（或称为堆内存）允许在有限的主内存资源上运行大型程序。例如，真实的内存需求只有在运行时从用户得知，而内存分配通常在编译时进行。此外，为了执行几个重载函数，系统会编译、加载然后运行。因此，如果用户在运行时只选择加载到主内存的几个函数之一，剩余内存就会浪费，因此我们无法解决需要大量内存的问题。动态内存通过\
  \ `new` 和 `delete` 运算符解决了这个问题。使用 `new` 运算符分配堆内存，并在使用后立即使用 `delete` 运算符释放内存。这样，宝贵且有限的内存就可以用于分配，从而我们就可以解决需要更大内存的问题。我们可以使用\
  \ `new` 运算符声明一个堆变量。\n\n```\nint *x = new int; // 堆内存的创建和分配\n*x=25; // 赋值\n或者，我们可以使用单语句\n\
  int *x = new int(12); // 为堆内存上的指针变量分配值 12。\n```\n\n一旦分配，你就可以像普通指针一样使用动态内存指针。记住，在使用后必须释放内存，以便释放的内存可以用于其他堆内存需求。通过这种方式，我们可以解决更复杂的问题，因为编译器加载堆变量并分配用户指定的确切内存需求，并在使用后释放内存。使用\
  \ `delete` 运算符删除分配的动态内存是一个良好的习惯。事实上，`new` 声明的数量必须与 `delete` 的数量匹配，尽管系统在程序结束时会自动释放内存。\n\
  \n```\nint *x = new int(12); // 在堆上创建了指针 x 并分配了值 =12\n*q *=*q ; // 找到值的平方，即 144\n\
  cout<<*q;\n……………\ndelete q; // q 指针已被删除\n```\n\n### 9.5.1 内存泄漏\n\n如果你在不删除现有赋值的情况下将动态指针重新指向新变量，则原始分配的变量和分配的堆内存将永久丢失且无法供程序使用。这被称为内存泄漏。\n\
  \n**示例 9.4：内存泄漏**\n\n```\nint *x = new int(12);\n*q *=*q ; // 找到值的平方，即 144\n  cout<<*q;\n\
  int *x = new int(75); // 错误，因为在没有删除的情况下重新赋值\n  delete q; // q 指针已被删除\n```\n\n###\
  \ 9.5.2 悬空指针\n\n如果你在不删除现有赋值的情况下将动态指针重新指向新变量，原始分配的变量和分配的堆内存将永久丢失且无法供程序使用。这被称为内存泄漏。\n\
  \n**示例 9.4：内存泄漏**\n\n```\nint *x = new int(12);\n*q *=*q ; // 找到值的平方，即 144\n  cout<<*q;\n\
  int *x = new int(75); // 错误，因为在没有删除的情况下重新赋值\n  delete q; // q 指针已被删除\n```\n\n在这种情况下，用户尝试：\n\
  \n**示例 9.5：悬空指针**\n\n```\nint *x = new int(12);\n*q *=*q ; // 找到值的平方，即 144\n  cout<<*q;\n\
  delete q; // q 指针已被删除\n```\n\n### 9.5.3 指针与数组\n\n让我们理解指针与数组之间的关系：\n\n注意 `x` 是数组名。假设你想打印第\
  \ 4 个元素，我们从 0 开始计数；我们感兴趣的是 `x[3]`。现在根据 C++，我们写 `x+3`。\n\n我们知道可以将 `a[1]` 写为 `*(a+1)`。因此，所需元素的地址\n\
  \n### 9.5.4 指针与二维数组\n\n假设你有一个具有 12 行 20 列的二维数组 `a`。\n\n那么我们可以将其声明为：\n\n```\n int\
  \ a[12][20]\n```\n\n或者\n\n```\n\n使用指针作为一维数组。例如：\n\n```\n int *a[20]\n```\n\n我们也可以将上述\
  \ `a` 视为二级指针。\n\n### 9.5.5 堆内存上的数组声明\n\n我们可以将 12 个整数的数组声明为：`int x[12]`。此数组声明在内存中预留了\
  \ 12 个连续的位置。如果用户未使用所有 12 个位置，内存将被浪费。数组声明是静态内存分配的一个示例。相反，我们也可以这样声明数组：\n\n```cpp\n\
  int *x =new int[12]; // x 是指向名为 x 的数组的指针变量\n//，具有 12 个连续的位置。\nint *ptr=x; // 现在\
  \ ptr 指向 x[0]，即数组的开头\n```\n\n\n\n\n\n```cpp\n#include<iostream>\nsing namespace\
  \ std;\n// 函数原型\ntemplate<class T>\nT FindMax( T x[] , int n);\ntemplate<class T>\n\
  void SortArray( T *a , int n);\nvoid main()\n{\n  int n;\n  int max; // n=数组中元素的个数\n\
  \  int *x; // x 是指向数组的指针\n  cout<<\"how many elements in your array :\";\n  cin>>n;\n\
  \  // 使用 new 运算符分配动态内存空间\n  x=new int[n]; // 为指针 x 分配 12 个连续的位置\n  // 读入数组\n  for\
  \ (int i=0;i<n;i++)\n  {\n    cout<<\"value for \"<<i+1<<\"element:\";\n    cin>>x[i];\n\
  \  }\n  cout<<(\"\\n The entered array is….\\n\");\n  for (i=0;i<n;i++)\n    cout<<\"\
  \ \"<<* (x+i); // 等同于写入 x[i]\n  // 调用 Findmax 函数\n  max=FindMax(x,n);//x 是指向数组的指针\n\
  \  cout<<\"\\n maximum value of given array=\"<<max<<endl;\n  // 调用 SortArray 函数\n\
  \  SortArray(x,n);\n  cout<<(\"\\n The entered array is….\\n\");\n  for (i=0;i<n;i++)\n\
  \    cout<<\" \"<<x[i]; // 等同于写入 *(x+i)\n  // 现在我们对数组的操作完成，让我们删除分配的内存\n  delete\
  \ [] x; // 使用 new 运算符分配的内存被释放\n}}//main 结束\n// Fn 定义\ntemplate<class T>\nT FindMax(T\
  \ x[], int n)\n{\n  T max;\n  int i;\n  max=T(); // *x 是 1 个元素的值\n  for(i=1;i<n;i++)\n\
  \  {\n    if (max<*(x+i))\n      max=*(x+i);\n  }\n  return max;\n} // FindMax 结束\n\
  template<class T>\nvoid SortArray( T *a ,int n)\n{\n  int i,j; // i 用于外层循环，j 用于内层循环，temp\
  \ 用于交换\n  T temp=T();\n  for ( i=0; i< n-1; i++) // 最后的值不需要排序\n  {\n    // 找到剩余数字中最小的并将其交换\n\
  \    for ( j=i+1; j< n; j++)\n    {\n      if (*(a+j) < *(a+i))\n        {\n   \
  \       // 交换\n          temp=*(a+i);\n          *(a+i)=*(a+j);\n          *(a+j)=temp;\n\
  \        }\n    }\n  }\n}\n/*输出 : how many elements in your array :6\nvalue for\
  \ 1element:32\nvalue for 2element:43\nvalue for 3element:34\nvalue for 4element:65\n\
  value for 5element:67\nvalue for 6element:12\nThe entered array is….\n32 43 34 65\
  \ 67 12\nmaximum value of given array=67\nThe sorted array is….\n12 32 34 43 65\
  \ 67\n```\n```\n\n### 9.5.6 指针的指针\n\n你可能记得我们曾经都玩过的寻宝游戏。在第一个线索中，我们会收到一张小纸条，上面提供了关于第二个地址的线索，第二个线索或宝藏就放在那里。指针的指针可以被看作指向地址的指针，即指向另一个地址的地址。我们可以从第二个地址中恢复值。例如，考虑一个二维矩阵。\n\
  \n假设你有一个 12 行 20 列的二维数组 `a`。\n\n那么我们可以将其声明为：\n\n```\n int a[12][20]\n          \
  \                或\n```\n\n使用指针声明为一维数组。例如：\n\n```\n int *a[20]\n```\n\n我们在第 9.4.4\
  \ 节中学习过，也可以将上述 `a` 表示为指针的指针 `a`。我们已经在示例 9.4 中展示了动态内存分配方法的部署。\n\n指针的指针何时有用？数组或函数通过其名称为人所。我们现在也了解到名称就是地址。符号地址表存储了函数、数组、变量等的名称以及地址分配。现在，在需要删除第一个条目（如数组的第一个元素）或需要在前面插入元素的情况下，普通指针将涉及符号地址表中符号名称的更改，并导致无用功。指针的指针会将系统存储的名称和地址隔离，因此在前面插入和删除操作将变得不再复杂。\n\
  \n### 9.5.7 二维数组的动态内存\n\n在我们的下一个示例中，我们将演示使用 `new` 运算符创建和使用动态内存。我们将读取一个 2 *`x` 2\
  \ 矩阵。首先，我们将为行分配动态内存，然后为每行的列分配内存。\n\n我们将使用 `try` 和 `catch` 块。这一特性将在错误和异常的章节中详细说明，但现在我们在这里简要介绍这一概念。当程序执行过程中发生错误时，由于资源不可用，程序通常会停止执行并报告错误或异常。`try`\
  \ 和 `catch` 块为程序员提供了纠正的方法。（注意：此部分包含一些重复句子，但核心逻辑已保留）。\n\n### 9.5.8 指针与三维数组\n\n访问元素\
  \ `a[3][4][5]`\n\n1. `a` 是指向第一行的指针。我们需要三行。因此，它是 `a[3]` 或 `*(a+3)`。\n\n2. 列偏移量为 4。因此，地址是\
  \ `*(a+3)+4`，值为 `*(*(a+3)+4)`。\n\n3. 三维偏移量为 5。因此，地址是 `*(*(a+3)+4)`。元素的值 `*(*a+3)+4)`\n\
  \n### 9.5.9 指针数组\n\n指针可以存储在数组中。你已经知道指针意味着地址，因此指针数组意味着地址的集合。例如，你可以存储五个指向字符串变量的指针：\n\
  \n```\nchar * ptr[5] = { “welcome”, “to”，“self_learning”，“C++” ”Book” }\n```\n\n\
  `ptr` 是维度为 5，即五个指针的数组。以下示例将使概念清晰：\n\n**示例 9.8: arrayofptr.cpp 展示指针数组使用的程序**\n\n\
  ```cpp\n#include<iostream>\nusing namespace std;\nvoid main()\n {  // 带有 5 个元素的指针数组\n\
  char *ptr[5]={“welcome”，“to”，“self_learning”，“C++A”，“Books”};\nchar *x; // x 是 char\
  \ 类型的指针\nx=ptr[0]; // x 现在指向 ptr，即指针数组中的起始指针\nfor ( int i = 0 ; i< 5; i++)\n   \
  \ cout<<”\\n”<< *(ptr+i)<<endl;\n// 接下来的 cout 语句将教你更多关于指针数组的知识\n cout<<”\\n”<< *ptr[3];\
  \ // 你可以期望 CDS 起始元素的值，即 C\n}\n/*输出:\nwelcome\nto\nself_learning\nC++\nBooks*/\n\
  ```\n\n### 9.5.10 空指针\n\n\n\n\n记住 `void` 是一个数据类型。通常，我们会声明指针来指向特定类型的数据。例如，`int *\
  \ ptr` 或 `char * ptr` 等。如果你的程序有多种数据类型，可以使用 `void`。但当 `void` 指针如图 9.4 所示时，类型转换是必须的。\n\
  \n![空指针的声明、定义和重新赋值](img/201-1.png)\n\n**图 9.4** 空指针的声明、定义和重新赋值\n\n**声明：**\n\n```\n\
  int x;\nfloat salary;\nvoid *ptr ; // void 数据类型的指针声明\n```\n\n**定义：**\n\n```\nptr\
  \ = & x ; // 将指针赋值为整数类型\n```\n\n**用法：**\n\n强制对空指针进行类型转换\n\n```\ncout<<*(int*)ptr;\n\
  ```\n\n**重新赋值：**\n\n```\nptr=&sal;\ncout<< * (float*)ptr; // ptr 转换为 float\n```\n\
  \n**示例 9.9: voidptr.cpp 一个演示空指针使用的程序**\n\n```\n#include<iostream>\nusing namespace\
  \ std;\nvoid main()\n{  int x=100;\n   float sal=2000.00;\n   void * ptr;// ptr\
  \ 是指向 void 数据类型的指针\n   // 将空指针赋值为 int\n   ptr=&x;\n   cout<<”\\nptr type casted\
  \ to integer :”<< *(int*)ptr; // ptr 转换为 int\n   // 将空指针赋值为 float\n   ptr=&sal;\n\
  \   cout<<”\\nptr type casted to float :”<<*(float*)ptr; // ptr 转换为 float}//程序结束\n\
  /*Output : ptr type casted to integer :100\nptr type casted to float :2000*/\n```\n\
  \n### 9.5.11 常量指针与 const 指针\n\n我们知道指针是地址，能够让我们快速访问内存并进行数据操作。但存在安全操作和数据完整性方面的问题。在某些情况下，我们希望数据不被修改。在这种情况下，我们将该数据声明为常量。指针的主要优势是它们可以重新赋值。这一特性允许我们遍历数组或内存等。但在某些情况下，我们需要指针是常量的，即它们不能被重新赋值。在这种情况下，我们会声明\
  \ const 指针。\n\n因此，涉及两种组合，`i.e. 指针类型和数据类型`。每种类型都有两种数据类型的变体：常量和普通。因此，在变量声明中总共有四种变体。如下所示：\n\
  \n例如，假设我们声明了两个变量：\n\n```\nint val = 25;\nconst float PI=3.14159;\n```\n\n**指向数据的指针\
  \ // 普通指针和普通数据**\n\n```\nint *x=& val;\n指向常量数据的指针\n// y 是一个指向常量 float 的指针。它不能被改变\
  \ const float * y=&PI;\n指向数据的 const 指针\n// 指向 int 数据类型的常量指针。指针不能重新赋值 int * const\
  \ x=& val;\n指向常量数据的常量指针\n// 指向常量数据类型的常量。因此值不能改变\n// 且指针不能重新赋值 const float * const\
  \ z=& PI\n```\n\n**示例 9.10: 指针指向常量数据和常量指针。类的构造函数和析构函数**\n\n```\n// 指向 int 的指针\n\
  int val = 25;                            // int 变量\nint *ptr = & val ;         \
  \       // ptr 是普通指针\ncout<<++(*ptr);    // 输出 26\ncout<<++ptr;       // ptr 增加\n\
  // 指向 int 的常量指针\nint const * cptr = & val; // cptr 是指向 int 的常量指针\ncout<<++(*cptr);\
  \   // 允许 . 输出 26\ncout<<++cptr;      // 不允许 . cptr 不能增加\n// 指向常量 float PI 的指针\n\
  const float PI=3.14159;                  // 声明为常量的变量 PI\nconst float * cfptr = &PI;\
  \        // cfptr 是指向常量数据类型 float 的指针\ncout<<++(*cfptr);  // 不允许，因为 *cfptr 是常量\n\
  cout<<++cfptr;     // 允许 . 增加 cfptr\n// 指向常量 float PI 的常量指针\nconst float * const\
  \ cfptc = & PI ; // cfptr 是指向数据的常量指针\ncout<<++(*cfptr);           // 不允许，因为 *cfptr\
  \ 是常量\ncout<<++cfptr;              // 不允许 . cfptr 是常量。\n```\n\n### 9.5.12 函数指针\n\
  \n我们知道名称意味着地址。就像数组一样，数组名是数组的地址。因此，我们可以将其称为指向数组的指针。函数名同样也是地址。我们可以将其视为指向常量的指针。在该地址处，存储了函数的代码。\n\
  \n因此，函数指针意味着指向常量指针的指针。\n\n```\nint Findmax( int a[] , int n); // 声明一个函数\nint (*ptrfun\
  \ ) (int) ; // 创建一个函数指针，即创建了 ptrfun\nptrfun = & FindMax ; // 将函数指针赋值给 FindMax 函数\n\
  ```\n\n注意在语句 `int (*ptrfun ) (int) ;` 中，函数接收 `int` 作为参数并返回 `int`。\n\n**示例 9.11:\
  \ ptrfun.cpp. 演示函数指针的程序**\n\n```\n#include<iostream>\nusing namespace std;\nint\
  \ Findmax( int a[] , int n); // 声明一个函数\nint (*ptrfun ) (int) ; // 创建一个函数指针，即创建了\
  \ ptrfun\nptrfun = & FindMax ; // 将函数指针赋值给 FindMax 函数\nvoid main()\n{\n   int x=100;\n\
  \   float sal=2000.00;\n   void * ptr;// ptr 是指向 void 数据类型的指针\n   // 将空指针赋值为 int\n\
  \   ptr=&x;\n   cout<<”\\nptr type casted to integer :”<< *(int*)ptr; // ptr 转换为\
  \ int\n   // 将空指针赋值为 float\n   ptr=&sal;\n   cout<<”\\nptr type casted to float\
  \ :”<<*(float*)ptr; // ptr 转换为 float}\n}\n```\n*(注：由于原文文本存在大量重复和混乱，译文已根据核心逻辑提取并进行了格式化处理。)*\n\
  \n\n\n\n# 指针\n\n`Pointers`（指针）用于需要重新赋值的场景。例如，如果你正在使用一个存储在连续内存位置的数组，你需要增加指针以指向数组的下一个元素。但是指针，虽然执行速度快，但也伴随着固有的危险，如内存泄漏、内存崩溃、悬空指针等。\n\
  \n`References`（引用）是别名——变量的另一个名称。它们不能被重新赋值。如果你坚持要重新赋值，由于引用是别名，第一个变量将被赋值为重新赋值的变量的值。\n\
  \n## 指针和引用的共同优点\n\n两者都只向函数传递地址，即它们采用了按引用传递的技术。因此，在将这些项传递给函数时，不会产生创建变量和对象副本的开销。函数可以返回多个值。\n\
  \n引用提供了一个整洁、高效且无风险错误的环境，因此它是资深程序员的首选。我们将在对象的章节中通过一系列程序介绍引用的高级概念。引用提供了无风险且高效的编程方式。首先，回想示例\
  \ 9.2 中的 `PtrSwap` 程序如何确保函数中的更改反映在主程序中。在下一个示例中，我们展示了如何通过按引用传递来实现相同的结果。\n\n## 示例\
  \ 9.13: RefSwap.cpp. 使用引用概念交换值的程序\n\n```cpp\n#include<iostream>\nusing namespace\
  \ std;\n// 函数原型的声明\nvoid RefSwap ( int &a ,int & b); // 引用调用。a & b 默认是指针。\nvoid\
  \ main()\n{  int x=5, y=10;\n   // 使用引用按引用调用。注意我们必须发送引用\n   // 在原型中我们已经承诺发送像 &a\
  \ 和 &b 这样的引用\n   // 即 x & y 的地址。因此我们传递 x 和 y。\n   RefSwap(x,y);\n   cout<<”\\nafter\
  \ call by ref using References :”<<endl;\n   cout<<”x value after RefSwap:”<<x<<endl;\n\
  \   cout<<”y value after RefSwap:”<<y<<endl;\n}//end of main\n// 函数定义\nvoid RefSwap\
  \ ( int &a, int &b)\n{ // a & b 是引用。因此我们需要普通的变量 temp\n  int temp; temp=a; a=b; b=temp;\n\
  \  cout<<”\\ninside RefSwap using reference :”<<endl;\n  cout<<”x value inside RefSwap:”<<a<<endl;\n\
  \  cout<<”y value inside RefSwap:”<<b<<endl;\n}\n/*Output:\ninside RefSwap using\
  \ reference :\nx value inside RefSwap:10\ny value inside RefSwap:5\nafter call by\
  \ ref using References :\nx value after RefSwap:10\ny value after RefSwap:5 */\n\
  ```\n\n## 示例 9.14: RefSwap.cpp. 使用引用概念交换值的程序\n\n在这个示例中，我们将展示如何从函数 `FindLarge` 返回一个引用。我们声明函数原型为\
  \ `double & FindLarge(double &r, double &s)`。\n\n该函数找到两个 double 类型数值中的最大值并返回最大值的引用，在这种情况下是对\
  \ `m`。同时观察 `FindLarge (k, m)=10 ; & FindLarge (k, m) ++;` 语句的工作原理。\n\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\ndouble & FindLarge(double &r, double &s);\n\
  int main ()\n{ double k=5, m=9;\n  cout <<\" Given Values k: \" << k <<\" : m: \"\
  \ << m << endl;\n  cout <<\"\\nValues after FindLarge (k, m) : \"<<FindLarge (k,\
  \ m)<<endl;\n  cout <<\" Values k: \" << k <<\" : m: \" << m << endl; //output 9\n\
  \  cout << endl;\n  FindLarge (k, m)=10; // 最大值是 m=9，它被替换为 10 。\n  cout <<\"\\nValues\
  \ after FindLarge (k, m) = 10\"<<endl;\n  cout << Values k: \" << k <<\" : m: \"\
  \ << m << endl; //output 3 & 10\n  cout << endl;\n  FindLarge (k, m) ++;\n  cout\
  \ <<\"\\nValues after FindLarge (k, m)++\"<<endl;\n  cout << Values k: \" << k <<\"\
  \ : m: \" << m << endl; //output 3 & 11\n  cout << endl;\n  return 0;\n}\ndouble\
  \ & FindLarge(double &r, double &s)\n{if (r > s) return r;\n  else return s;\n}\n\
  /*output :Given Values k: 5 : m: 9\nValues after FindLarge (k, m): 9\n Values k:\
  \ 5 : m: 9\nValues after FindLarge (k, m)=10\n Values k: 5 : m: 10\nValues after\
  \ FindLarge (k, m)++\n Values k: 5 : m: 11 :*/\n```\n\n## 9.7 总结\n\n1. 指针像变量。因此，它们有地址。\n\
