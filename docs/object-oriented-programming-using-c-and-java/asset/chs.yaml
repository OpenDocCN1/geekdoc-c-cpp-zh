  \ Exiting from thread1Sync1 Exiting from thread1Sync2\n```\n\n| **第 7 行:** | 将该块声明为\
  \ `synchronized(this)`，意味着正在同步该对象，使对象持有监视器，在它释放 CPU 之前，其他线程无法进入此代码块。 |\n\n#### 20.16\
  \ 线程间通信\n\n线程之间需要相互通信，以传递参数、同步并优化性能。生产者和消费者之间肯定存在速度不匹配的问题。\n\n考虑例如从键盘向计算机输入数据的操作。此过程涉及的步骤包括：\n\
  \n*   生产者，即键盘，按照用户击键的速率和速度产生数据。这是一个非常慢的过程，因为涉及到键盘输入。生产者在完成后填充缓冲区。\n*   消费者将键盘输入的数据拾取到系统中。这是一个极高速的设备。因此，我们需要缓冲区处于同步块中。\n\
  \n### 示例 20.14: ProducerConsumer.java: 一个显示线程间通信的程序\n\n```\n1\\. package com.oops.chap20;\n\
  2\\. class Producer extends Thread{\n3\\. StringBuffer buffer;\n4\\. Producer(StringBuffer\
  \ buffer){\n5\\. this.buffer=buffer;}\n6\\. public void run(){\n7\\. synchronized(buffer){\n\
  8\\. try{\n9\\. for(int i=1;i<=8;i++) {\n10\\. buffer.append(“Item”+i + “,”);\n\
  11\\. Thread.sleep(200);\n12\\. System.out.println(“Buffer Position :”+i + “ Filled.”);\n\
  13\\.catch(InterruptedException e){}\n14\\. buffer.notify();\n15\\. }\n16\\. }\n\
  17\\.\n18\\. class Consumer extends Thread{\n19\\. StringBuffer buffer;\n20\\. Consumer(StringBuffer\
  \ buffer){\n21\\. this.buffer=buffer;}\n22\\. public void run(){\n23\\. synchronized(buffer){\n\
  24\\. try{\n25\\. buffer.wait();\n26\\. System.out.println(“Displaying items from\
  \ Buffer..”);\n27\\. for(int i=1;i<=8;i++){\n28\\. System.out.println(buffer.toString());\n\
  29\\.catch(InterruptedException e){}\n30\\. }\n31\\. }\n32\\.\n33\\. public class\
  \ ProducerConsumer {\n34\\. public static void main(String[] args) throws Exception\
  \ {\n35\\. StringBuffer buffer = new StringBuffer();\n36\\. Producer prod = new\
  \ Producer(buffer);\n37\\. Consumer cons = new Consumer(buffer);\n38\\. cons.start();\n\
  39\\. prod.start();\n40\\. }}\nOutput:\nBuffer Position :1 Filled.\nBuffer Position\
  \ :2 Filled.\nBuffer Position :3 Filled.\nBuffer Position :4 Filled.\nBuffer Position\
  \ :5 Filled.\nBuffer Position :6 Filled.\nBuffer Position :7 Filled.\nBuffer Position\
  \ :8 Filled.\nDisplaying items from Buffer..\nItem1,Item2,Item3,Item4,Item5,Item6,Item7,Item8\n\
  ```\n\n\n\n\n\n| 行号 33: | 消费者线程正在等待来自第 19 行生产者的 notify(0) 通知。这是通过第 33 行的 `wait()`\
  \ 命令实现的：`prod.buffer.wait();` |\n\n## 20.17 多线程编程中的死锁\n\n如果存在同步对象，且两个独立在这些同步对象上工作的线程之间存在循环依赖，就会发生死锁。假设有两个同步对象，即每个对象都有一个监视器（monitor）。设对象分别为\
  \ `Obj1` 和 `Obj2`。创建两个线程，它们分别进入了 `Obj1` 和 `Obj2` 的监视器。现在，`Obj1` 调用 `Obj2` 上的任何同步方法，`thread1`\
  \ 将被阻塞，因为 `thread2` 拥有该监视器。到目前为止一切正常。\n\n现在如果 `thread2` 调用 `Obj1` 上的方法会发生什么？它显然会被阻塞，因为\
  \ `thread1` 拥有 `obj1` 的监视器。\n\n因此，我们可以看到一对同步对象上存在循环依赖。死锁发生了。要发生死锁，必须满足以下条件：\n\n\
  - 两个同步对象。\n- 两个或多个拥有对象监视器的线程且存在循环依赖。\n\n死锁无法预防，但可以减少其发生概率。当死锁发生时，线程会立即停止，释放资源并重启进程。\n\
  \n## 20.18 总结\n\n1. 错误（Errors）分为三类型：语法错误、逻辑错误和 Bug。语法错误可以被编译器捕获。Bug 可以通过断言语句和调试来修复。\n\
  2. 另一方面，异常（Exceptions）是运行时发生的异常情况，可能导致程序崩溃的错误。\n3. 异常可以是同步异常，如 `IOException`。这些是可以预测的。\n\
  4. 异常可以是异步异常，如 `OutOfMemoryException`，这些无法预测的。\n5. 检查异常（Checked Exception）是那些编译器可以处理且需要用户处理的异常。如果没有处理，则需要使用\
  \ `throws` 子句抛出异常。\n6. `try` 块创建异常对象`catch` 块捕获异常。`try` 块可以嵌套。一个 `try` 块可以引发多个异常。\n\
  7. `catch` 块可以捕获多个异常。\n8. `finally` 块位于所有 `catch` 块之后，可以用于执行所有管理任务，如关闭所有打开的文件、保存状态，以及在离开\
  \ `try` 和 `catch` 块之前显示常用的本质消息。\n9. 抛出异常：程序员可以显式地抛出异常。`Throw` 可以是 `java.lang.Exception`\
  \ 包提供的任何 `Exceptions` 或用户定义的异常类。\n10. 线程（Thread）是指令序列，当 CPU 调度处理该线程时，这些指令将被执行。简单来说，Java\
  \ 中的线程等于操作系统中的进程。\n11. 线程可以使用 `Runnable` 接口或通过扩展 `Thread` 类来创建。当没有新的开发计划时，使用 `Runnable`。\n\
  12. 当有多个线程在执行独立的进程时，它被称为多线程程序。\n13. 进程（Process）：进程是正在处理中的任务。由于涉及上下文切换，进程被被称为重量级进程。\n\
  14. Java 提供了：`final boolean isAlive()` 方法来测试线程是否存活。\n15. 方法 `final void join() throws\
  \ InterruptedException`。这是一个非贪婪方法，它会一直等待到调用它的线程终止为止。在这里，调用线程等待指定的线程加入它。\n16. 线程有五种状态。它们是：`NewBorn`、`Runnable`、`Running`、`Blocked`\
  \ 和 `Dead State`（死亡状态）。\n17. 线程可以被以下任一方法阻塞：`sleep()`、`suspend()` 和 `block()`。\n\
  18. `thrd.notify()`：释放对象并通知队列中等待的线程该对象已空可用。\n19. `Thrd.notifyAll()`：释放对象并向所有等待的线程发送通知。\n\
  20. `Obj.wait()`：线程等待直到收到 `notify()` 或 `notifyAll()` 方法。\n21. 线程优先级决定了等待线程的调度顺序。`MIN_PRIORITY\
  \ =1` ： `NORM_PRIORITY =5` `MAX_PRIORITY =10`。\n22. Java 提供了一种名为“同步”（synchronization）的功能，帮助我们解决多个线程共享公共资源以及使用同一对象（如打印机）的问题。\n\
  23. 通过同步提供了线程间通信。更好的技术是使用 `wait()` 和 `notify()` 命令。该功能对于在线程之间传递参数有用。\n\n## 练习题\n\
