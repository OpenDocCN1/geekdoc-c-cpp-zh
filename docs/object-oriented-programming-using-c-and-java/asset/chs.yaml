  \ `DataOutput`。因此，它支持 `writeShort()`，`writeInt()`，`writeDouble()`，`writeLong()`，`readLine()`，`writeFloat()`，`writeChar()`，`writeBoolean()`\
  \ 以及一个名为 `writeUTF()` 的统一文本格式。\n\n### 21.3.3 DataInput 和 DataOutputStream FileInput\
