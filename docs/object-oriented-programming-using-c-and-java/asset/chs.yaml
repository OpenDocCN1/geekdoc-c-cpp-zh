  \   void SetRollNo ( int n) { rollNo=n;}\n       char * GetName() const { return\
  \ name;}\n       void SetName( char *p) { name=p;}\nprivate:\n       int rollNo;\n\
  \       char *name;\n};\n\nvoid main()\n{ Student std; // 创建对象\n     Student *ptr\
  \ = new Student;// 在堆上创建对象\n     cout<<” \\n Students rollNo set by Default constructor\
  \ : “\n      <<ptr->GetRollNo()endl;\n     cout<<”\\n Students name set by Default\
  \ constructor : “\n      <<ptr->GetName()endl; // 从堆访问成员数据\n     // 将学号设置为 50\n\
