  ```\n\n| **第 10 行:** | `Polar4(Polar4 pol){ a= pol.a;b=pol.b;}` 和语句 21 `Polar4 pol4a\
  \ = new Polar4(pol4);` 显示了将对象传递给构造函数。`Pol4a` 是 `pol4` 的副本。 |\n\n### 18.5.6 方法重载\n\
  \n方法名称相同但参数数量不同或参数类型不同，我们可以说方法被重载了。重载方法可以有不同的返回类型。当方法的签名（即名称和参数）匹配时，Java 会将特定版本的方法加载到主内存区。虽然可以编译多个版本的同一个方法，但它们会在运行时根据用户提供的参数进行加载，从而节省主内存。请考虑以下重载示例，因为它们的名称相同但参数数量不同。\n\
  \n```\npublic double Find(double side){ return side*side;}//正方形面积\npublic double\
  \ Find(double l, double b ){ return l*b;}//矩形面积\npublic double Find( double l ,\
  \ double b , double h){ return l*b*h;}\n// 立方体积\n```\n\n第二组示例是用于重载方法的不同类型的参数：\n\n\
  ```\npublic int Find( int a , int b){ return ( a<b) ? a:b);}// a & b 中较小的整数\npublic\
  \ double Find( double a , double b){ return ( a<b) ? a:b);}// a & b 中较小的双浮点数\n```\n\
  \n一旦你声明了上述重载方法，以下语句将不是重载方法并会导致错误。为什么？\n\n```\npublic float Find(double l, double\
  \ b){return l*b;}//矩形面积\npublic short Find( int a, int b){ return ( a<b) ? a:b);}//\
  \ a & b 中较小的整数\n```\n\n### 示例 18.8: Find.Java 显示重载方法\n\n```\n //FindDemo.java\n\
  \   1\\.    package com.oops.chap19;\n   2\\.    import java.io.*;\n   3\\.    class\
  \ OverLoadedFind{ // 用于正方形、矩形、立方体的重载 Find\n   4\\.    public double Find( double\
  \ side){ return side*side;}\n   5\\.    public double Find( double l , double b\
  \ ){ return l*b;}\n   6\\.    public double Find(double l, double b, double h){return\
  \ l*b*h;}\n   7\\.    }\n   8\\.    class FindDemo {\n   9\\.    public static void\
  \ main(String[] args) {\n   10\\.   OverLoadedFind ovrfind = new OverLoadedFind();\n\
  \   11\\.   System.out.println“ Area of a square: “ + ovrfind.Find(10.0));\n   12\\\
  .   System.out.println“ Area of a rectangle: ” + ovrfind.Find(10.0,20.0));\n   13\\\
  .   System.out.println“ Volume of a cube: ” + ovrfind.Find(10.0,20.0,30.0));\n \
  \  14\\.   }\n   15\\.   }// end of class\n   Output: Area of a square: 100.0\n\
  \   Area of a rectangle: 200.0\n   Volume of a cube: 600.0\n```\n\n| **第 4, 5, 6\
  \ 行:** | 正方形、矩形、立方体的 `Find` 重载方法。 |\n| **第 11, 12, 13 行:** | 不同参数数量的 `Find` 调用。\
  \ |\n\n#### 18.5.7 递归\n\n递归是 Java 支持的一项高级特性。递归意味着方法调用自己。考虑寻找阶乘的问题。\n\n```\n 1\\\
  . Recursion.java\n2\\. package com.oops.chap19;\n3\\. class Factorial{\n4\\. public\
  \ long factrecur(int a)\n5\\. { long ans;\n6\\. if(a<=0) return(1);\n7\\. else ans=a*factrecur(a-1);\n\
  8\\. return(ans);\n9\\. }\n10\\. class Recursion{\n11\\. public static void main(String[]\
  \ args) {\n12\\. Factorial fact = new Factorial();\n13\\. System.out.println“ Factorial\
  \ of 5 : ”+ fact.factrecur(5));\n14\\. System.out.println“ Factorial of 7 : ” +\
  \ fact.factrecur(7));\n15\\. System.out.println“ Factorial of 10 : ” + fact.factrecur(10));\n\
  16\\. }\n17\\. }// end of class\nOutput: Factorial of 5 : 120\nFactorial of 7 :\
  \ 5040\nFactorial of 10 : 3628800\n```\n\n| **第 4 行:** | `factrecur(int a)` 通过递归寻找阶乘。\
  \ |\n| **第 7 行:** | `else ans=a*factrecur(a-1);` 意味着使用 `a-1` 作为参数调用 `factrecur`。\
  \ |\n\n### 示例 18.9: Recursion.Java 计算阶乘\n\n```\n1\\. Recursion.java\n2\\. package\
  \ com.oops.chap19;\n3\\. class Factorial{\n4\\. public long factrecur(int a)\n5\\\
  . { long ans;\n6\\. if(a<=0) return(1);\n7\\. else ans=a*factrecur(a-1);\n8\\. return(ans);\n\
  9\\. }\n10\\. class Recursion{\n11\\. public static void main(String[] args) {\n\
  12\\. Factorial fact = new Factorial();\n13\\. System.out.println“ Factorial of\
  \ 5 : ”+ fact.factrecur(5));\n14\\. System.out.println“ Factorial of 7 : ” + fact.factrecur(7));\n\
  15\\. System.out.println“ Factorial of 10 : ” + fact.factrecur(10));\n16\\. }\n\
  17\\. }// end of class\n```\n\n#### 18.6 *this* 关键字的使用\n\n我们知道 Java 的内存管理为代码分配了单独的内存区。因此，你的方法代码将位于该区域。但我们也知道变量存储在栈区。当方法被对象调用时，需要将被调用的方法与数据连接起来。因此，对象作为参数传递方法。但这个参数（即调用方法的对象的地址）不像普通参数那样可见，它是隐藏的。这个隐藏地址被称为\
  \ `this 对象`。它之所以被称为 `this`，因为它指向调用方法的对象。在方法中，如果你显式使用 `this 关键字`，它引用对象的成员数据。注意，我们可以通过对象获得相同的效果。但注意\
  \ **this** 具有快速访问对象的全部优势。下例示例中的第 22 行显示了这一特性。\n\n`this` 关键字的第二个用途是解决命名冲突。例如，如果我们的方法定义如下：`public\
  \ void Setr( double r){ r=r;}`，则存在命名冲突。`this` 关键字出现了。我们可以将方法写为：`public void Setr(double\
  \ r){this.r=r;}` 第 8 到 11 行显示了这一特性。查看[示例 18.5]中用 **this** 运算符重写的程序。\n\n### 示例 18.10:\
  \ PolarThis.java 显示 *this* 运算符的用法。类的构造函数和析构函数\n\n\n\n\n```\n 1\\. package com.oops.chap19;\n\
  \   2\\. import java.io.*;\n   3\\. class Polar3{\n   4\\. private double r; //\
  \ 长度\n   5\\. private double t; // 角度 theta\n   6\\. private double a; // 实部\n \
  \  7\\. private double b; // 虚部\n   8\\. public void Setr(double r){this.r=r;}\n\
  \   9\\. public void Sett(double t){this.t=t;}\n   10\\.   public void Seta(double\
  \ a){this.a=a;}\n   11\\.   public void Setb(double b){this.b=b;}\n   12\\.   //构造函数\
  \ 默认构造函数\n   13\\.   Polar3() {\n   14\\.   System.out.println(“Polar3 Default const..\"\
  ););\n   15\\.   Setr(0.0);Sett(0.0);Seta(0.0);Setb(0.0);}\n   16\\.   Polar3(double\
  \ a, double b){\n   17\\.   System.out.println(“parameterized(a & b) const…”);\n\
  \   18\\.   Setr(0.0);Sett(0.0);Seta(a);Setb(b);}\n   19\\.   // 公有访问器函数\n   20\\\
  .   public void ConvertToPolar(){double x=0.0;\n   21\\.   r=(a*a + b*b)*0.5; x=Math.atan(b/a);//x\
