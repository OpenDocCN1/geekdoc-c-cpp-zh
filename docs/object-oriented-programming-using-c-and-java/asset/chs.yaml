  \n\n\n\nJava 是专门为网络编程而设计的。这意味着什么呢？Java 支持一个名为 `java.net` 的包，该包定义了若干方法，可以通过常用的网络协议来连接和检索文件。Java\
  \ 还允许我们创建类 Unix 的套接字，并允许我们实现 TCP/IP 套接字。\n\n在上一章关于 Java IO 编程中，你已经接触了输入流（Input Stream）和输出流（Output\
  \ Stream）。通过将这些流文件与网络协议结合，你可以像向磁盘写入文件一样，向互联网上的文件写入数据并从中检索数据。\n\n本章涵盖了网络基础知识，例如 TCP/IP\
  \ 协议及其通过 TCP/IP 和数据报的实现。还介绍了 URL 连接和 `Inet` 寻址机制。并讨论了采用 TCP/IP 和套接字的客户端/服务器应用程序。\n\
  \n## 22.2 网络基础\n\n网络化是指从我们的独立应用程序或 Applet 连接到互联网的能力。这种互连所需的类存在于 `java.net` 包中。该包提供了创建套接字的方法，以及使用网络协议从任何其他网络协作系统检索文件的方法。通过将流类与这些网络套接字类结合，在互联网上读写数据变得变得简单。\n\
  \n有两个与 Java 编程密切相关的术语：互联网（Internet）和世界维网（WWW）。它们并不是同义词，也不是同一个。\n\n**网络（Network）**是计算机的集合，可以是同构或异构的。\n\
  \n**互联网（Internet）**是网络的集合或分组。我们可以说互联网是网络的网络，由数百万台计算机组成。这些计算机使用互联网协议相互通信。\n\n**世界维网（WWW）**是访问互联网信息的一种方式。它使用\
  \ HTTP 在通信的计算机之间交换数据。www 提供的服务使用互联网浏览器，如 Internet Explorer (IE)、FireFox、Google Chrome\
  \ 等。信息通过 HTTP 和网页进行交换。网页是存储所需信息的地方。网页通过超链接连接在一起。www 是一种在互联网上交换数据的方法。\n\n运行在互联网上的计算机之间使用传输控制协议（TCP）或用户数据报协议（UDP）进行通信。\n\
  \n### 22.2.1 TCP/IP\n\n协议是互联网上协作系统必须遵循的一系列规则，用于将数据从一个系统传输到另一个系统。TCP/IP，即传输控制协议和互联网协议，是用于数据传输的标准协议。\n\
  \nTCP/IP 是一种面向连接且可靠的服务。\n\n- 面向连接意味着发送端会确认接收端是否确实收到了数据。如果没有，则会进行数据重传。\n- TCP/IP\
  \ 是一种点对点的可靠通信，即它是一种确认服务，可确保数据在接收端被正确接收。TCP/IP 有五层，如图图 22.3 所示。\n- 编写的 Java 程序属于应用层。超文本传输协议（HTTP）、文件传输协议（FTP）和\
  \ Telnet 是应用层中一些广泛使用的协议。\n- 应用层接收来自发送端 IO 流的数据，并将数据格式化为连续字节流，将其发送到传输层，如图图 22.1 所示。\n\
  \n![TCP/UDP functionality](img/526-1.png)\n\n**图 22.1** TCP/UDP 功能\n\n- 传输层通过分配的端口接收这些数据流并制作数据包（图\
  \ 22.1）。一个数据包包含端口号和数据。\n- 端口号范围在 0 到 65535 之间，用 16 位数表示。注意，这些数字是逻辑上的，与计算机系统上的物理端口无关。0\
  \ 到 1022 之间的端口范围受到限制；它们被保留用于 HTTP、FTP 和其他系统服务等已知服务。已知端口的示例包括：\n    - 域名系统 (DNS):\
  \ 53\n    - 文件传输协议 (FTP): 21\n    - 超文本传输协议 (HTTP): 80\n    - 网络新闻传输协议 (NNTP): 119\n\
  \    - 邮局协议 (POP3): 110\n    - 简单邮件传输协议 (SMTP): 25\n    - Telnet: 22\n- IP 层接收数据包并将其封装成称为帧（frames）的信（图\
  \ 22.2）。帧将包含源地址、目的地址、数据以及一些预留用于错误检测和纠错机制的位。为了指定地址，使用了 IP 地址。IP 地址是一个 32 位地址，用于唯一标识连接到网络的计算机。例如，`192.167.169.24`。该协议被称为\
  \ IPv4。现在引入了一种名为 IPv6 的新协议，它遵循 48 位寻址机制，互联网允许这两种 IP。\n\n![IP layer encapsulation\
  \ of packet in a frame](img/527-1.png)\n\n**图 22.2** IP 层在帧中封装数据包\n\n![TCP/IP model\
  \ layers](img/527-2.png)\n\n**图 22.3** TCP/IP 模型层\n\n- 目的地址可以通过数值地址（如 `192.127.68.24`）或域名（如\
  \ `www.google.com`）指定。这种转换由域名服务器完成，它将地址从数值转换为域名，反之亦然。\n- 数据链路接收来自 IP 层的帧并将帧发送到目的计算机。这一层拥有设备驱动程序并在网卡中包含媒体访问协议（MAC）。网卡将\
  \ IP 地址映射为 48 位的唯一网卡 ID，并基于 MAC 协议进行传输。MAC 协议简单地告诉网络上正在发生什么，即它规定了多个帧共享单一介质的规则。\n\
  - 当目的计算机接收到帧时，将根据所使用的协议解码格式，并将帧交给 IP 层。IP 层产生数据包并将其交给传输层。传输层在指定的端口移交数据，如图图 22.3\
  \ 所示。\n\n### 22.2.2 用户数据报协议 (UDP)\n\nUDP 是一种无连接的服务。这意味着两个应用程序之间的通信是不保证的。递送并不重要，也不被保证。它主要用于视频和音频等的传输，在这些情况下不需要复杂的错误检测和纠正，少量数据丢失不会产生感知上的差异。\n\
  \n## 22.3 互联网地址\n\n我们可以使用 `java.net` 包中的 `InetAddress` 类获取任何网站的互联网地址。`InetAddress`\
  \ 类支持以下方法：\n\n```\nstatic InetAddress getByName (String hostName) throwsUnknownHostException\n\
  static InetAddress[] getAllByName (String hostName) throwsUnknownHostException returns\
  \ all addresses that a particular web site name is representing.\nstatic InetAddress\
  \ getLocalHost() throwsUnknownHostException\n```\n\n**示例 22.1: InetAddressDemo.java\
  \ 编写一个程序获取指定网站的 Inet 地址和本地主机名**\n\n\n\n\n\n```\n // 此程序需要连接连接\n   1\\. package com.oops.chap22;\n\
  \   2\\. import java.io.*;\n   3\\. import java.net.*;\n   4\\. import java.util.*;//\
  \ 用于 scanner 类\n   5\\. public class InetAddressDemo {\n   6\\. public static void\
  \ main(String[] args)throws IOException {\n   7\\. String websitename;\n   8\\.\
  \ Scanner scn=new Scanner(System.in);\n   9\\. System.out.print(“Enter WebSite Name\
  \ :“);\n   10\\. websitename=scn.next();\n   11\\. try{\n   12\\. InetAddress ipadd=InetAddress.getByName(websitename);\n\
  \   13\\. System.out.println(“ The IP address obtained from Internet is : “+ ipadd);\n\
  \   14\\. }catch(UnknownHostException e)\n   15\\. { System.out.println(“Web Site\
  \ NOT found”);}\n   16\\. }//end of main\n   17\\. }//end of class\n   OUTPUT :\
  \ Enter WebSite Name :www.google.com\n   The IP address obtained from Internet is\
  \ : www.google.com/209.85\\. 221.104\n�2 nd Run\n    Enter WebSite Name :www.vasappanavara.org\n\
