  \ // 逗号分隔的字符串\n   12. StringTokenizer stkn = new StringTokenizer( stg, ʺ,ʺ);\n \
  \  13. String Tokenizer 根据分隔符号逗号将单行字符串拆分为标记。我们可以使用 nextToken() 获取标记。\n   14. idNo\
  \ = stkn.nextToken(); // 标记\n   15. crdts = stkn.nextToken(); 拆分为标记\n   16. debts\
