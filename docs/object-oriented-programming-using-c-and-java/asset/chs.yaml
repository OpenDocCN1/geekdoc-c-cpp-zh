  下方的流程图展示了本书的内容以及使用本书的最佳方法：\n\n![成功的 OOP 程序员、系统分析师和设计师](img/f001-1.png)\n\n## 1.\
  \ 面向对象编程基础\n\n### 学习目标\n\n*在本章结束时，你应该能够理解：*\n\n*   编程概念。\n*   软件开发范式。\n*   OOP 范式以及\
  \ OOP 语言提供的扩展特性。\n\n## 1.1 引言\n\n为了解决一个问题，你需要知道“方法/程序”或拥有“窍门”。在计算机术语中，我们称之为算法。算法或程序是一系列需要遵循的步骤，用以产生预期的输出。步骤序列可以被称为过程，反之，一组过程可以被称为一个程序。对于解决简单问题，一组步骤就足够了，但如果问题很复杂，则需要一个包含良好集成且内聚的编程元素、构造结构和数据结构的编程环境。范式可以被看作一种编程风格，涉及函数、数据和数据结构等元素。目前已使用了多种编程范式。以\
  \ C 语言实现语言的结构化编程范式——其中程序员将要完成的任务分解为子任务，并指定逐步步进的程序或算法来完成该任务——这种范式在程序员中非常成功且流行，这很大程度上归于它以过程调用形式存在的可重用组件，以及操作内存从而处理硬件集成的能力。\n\
  \n由于用户需求变化、项目复杂性以及缺乏扩展和复用功能等因素，程序员的生产效率低下，导致项目永远无法按时完成。即使项目完成并实现，作用也有限。结构化编程环境由于过程调用提供的复用设施有限，且缺乏扩展特性（即无法从现有数据类型派生新数据类型），并不太适合处理由硬件和软件快速变化等复杂项目带来的挑战。面向对象编程（OOP）通过继承、标准模板库（STL）形式的库函数等承诺了广泛的复用特性。C++\
  \ 是最强大的 OOP 语言之一，既支持结构化范式也支持 OOP 范式。\n\n\n\n\n\n## 1.2 编程概念\n\n在 `C` 和 `C++` 发明之前，编程语言可以大致分类如下：\n\
  \n高级语言（如 `FORTRAN`、`Cobol` 和 `Pascal`）为程序员提供了如类英语代码语言等友好的特性。在这些语言中，程序员编写的代码被编译并转换为目标代码。实现细节和硬件细节（如地址）对用户来说是隐藏的。因此，用户可以为科学界和商业界编写应用程序。`Cobol`\
  \ 是一种在商业领域被广泛使用的语言。而 `FORTRAN` 和 `Pascal` 则是科学界使用的语言。\n\n低级语言如 `assemblers`（汇编语言）需要对硬件、寻址机制和操作系统深入了解。因此，这类语言由专家、学者和系统开发者使用。大多数涉及硬件与软件集成的接口都是使用这些语言编写的。\n\
  \n中间级语言如 `C`。这些语言结合了高级和低级语言的优点。\n\n*   代码几乎像英语一样。这种语言容易理解和编写程序。\n*   它具有处理硬件的能力，因为它的许多命令支持直接处理底层硬件，如\
  \ `memory`（内存）和硬件设备。\n*   业务编程和科学计算都可以被轻松处理。\n\n## 1.3 编程范式\n\n范式是一种编程语言的风格。它只是一种风格，而不是一种语言。它是利用\
  \ `functions`（函数）、`objects`（对象）和 `variables`（变量）等编程元素产生所需输出的方式。\n\n### 1.3.1 结构化编程范式\n\
  \n面向过程的编程（如 `C`）使用过程调用。主任务被分为带有输入和函数的子任务，以实现所需的结果。数据通过 `arguments` 给过程。在这个范式中，过程是重要的，数据由多个过程共享。\n\
  \n算法或程序或过程是需要遵循的步骤序列，遵循这些步骤就能得到所需的输出。一组过程可以被称为程序。过程也称为 `routine`（例程）、`subroutine`（子程序）、`function`（函数）或\
  \ `method`（方法）。执行中的程序或过程可以调用任何其他过程。\n\n因此，使用面向过程的语言，程序员将要完成的任务分解为子任务，并指定逐步的程序或算法来实现该任务。像\
  \ `C` 这样的面向过程的语言提供了语句来为任务指定的过程编写代码。面向过程的语言具有以下优点：\n\n*   **模块化：** 每个子任务都可以开发为一个\
  \ `module`（模块）。模块接受 `arguments` 作为输入并交付 `return values`（返回值）作为输出。\n*   独立且使用独立代码的模块可以避免如\
  \ `GOTO` 和 `Jump`（跳转）等编码陷阱，从而使代码易于维护。\n*   确保了可重用性。模块可以在执行过程中被任何其他模块调用。所有可重用的代码都可以维护为库。\n\
  *   `C` 提供的强大模块化和可重用特性使其成为开发复杂程序和项目最合适的语言平台。\n\n面向过程的语言也被称为“结构化语言”，因为它允许过程调用，这又允许程序员将主任务分解为子任务，并通过过程调用执行每个子任务。\n\
  \n那么，我们为什么需要学习面向对象编程呢？\n\n### 1.3.2 问题出在哪里？\n\n问题的产生源于快速变化。变化发生的速度之快，以至于基于特定时刻或时间输入所开发的项目和程序不再有效。因此，开发的项目仅被局限在部门图书馆的架子上，从未被实施。\n\
  \n这在软件项目中尤为如此，因为它们需要最新的软件编程范式和硬件。\n\n用户需求在项目开发过程中发生变化。在复杂项目中，用户需求的变化意味着要重新工作。\n\n\
  美国国防部（DoD）发现，大多数项目已经过时且无法实施。\n\n#### 1.3.3.1 问题的复杂性\n\n最初，计算机被用于基础的业务计算，如工资单、学生或员工记录以及科学计算。这些都是涉及输入、处理和输出的简单算法，可以很容易地通过结构化编程处理。\n\
  \n然而，问题的复杂性迅速增长，现代软件项目涉及多层输入以及与本地和远程处理器、网络等的通信。\n\n#### 1.3.3.2 用户的需求\n\n在项目实施初始阶段，对用户需求进行彻底研究后，安排分析、设计和开发。可以说，需求是决定软件设计和开发每个阶段的规范。因此，它们在开始开发阶段之前被“冻结”。\n\
  \n但在但在实际操作中，对于运营经理（例如机场运营经理）来说，实施更改以确保机场日常运行的顺畅是重要的。因此，他们期望将这些最新变化纳入正在开发的软件中是理所当然的。\n\
  \n你的初始估计付诸东流！开发者必须根据所求更改的性质重新进行设计。\n\n估计由于变化导致的重工作占了时间和精力估算的约 40%，对项目超期有重大影响。\n\n\
  #### 1.3.3.3 低效率\n\n扩展性和重用性是使程序员高效的两个特性。在 `C` 中，我们有 `struct`（结构体）和 `unions`（联合体）作为用户定义数据类型。无法根据已定义的类型定义新数据类型的功能。\n\
  \n引入的变化会导致多个过程的变化，并通常导致重新编译源码。\n\n无法通过继承扩展数据类型。程序员只能满足于过程调用。\n\n### 1.3.4 面向对象编程范式\n\
  \n面向对象的编程（如 `C++`）使用对象，并通过调用成员函数进行对象之间的交互。其特性包括数据隐藏、数据抽象、封装、继承和多态。\n\n\n\n\n随着 1969\
  \ 年起 UNIX 的出现以及通信硬件软件的发展，硬件和软件的复杂性不断增加，软件项目开发无法跟上这种速度。结果导致程序质量受到了影响。\n\n贝尔实验室的开发者和国防部（DoD）开始寻找替代范式，在这些范式中，重用性和扩展性是一个强大的特性。此外，规范强调了数据优先而非过程优先。\n\
  \nOOP 范式中的对象包含成员数据以及所有在内部实现的功能，以达到所需的结果。类以及该类的对象携带它们自己的运算符来实现特定的功能。例如，一个对象可以携带一个重载运算符\
  \ `>>` 来实现输入操作。对象通过传递消息与其他对象进行通信。\n\n## OOP 范式的显著特征\n\n- 数据优先，*而非* 过程优先。\n- 任务被划分为多个对象。\n\
  - 每个对象都是一个独立的机器，在自己的内存位置拥有它自己的数据结构和成员函数。\n- 方法和数据绑定在对象中。\n- 外部函数无法访问数据。\n- 对象可以向另一个协作对象发送消息。\n\
  \n## 1.4 面向对象语言的历史与发展\n\nSmalltalk 是第一个开发的 OOP 语言。目前 `C++`、`Java` 和 `C#` 是使用 OOP\
  \ 范式的受业界喜爱的语言。\n\n### 1.4.1 C++\n\n`C++` 由 Bjarne Stroustrup 于 1979 年在贝尔实验室开发。`C++`\
  \ 是 `C` 语言的延续，具有额外的特性。这些特性包括虚函数、函数名和运算符重载、引用以及空闲内存，以及通过继承、模板等实现重用和扩展性的许多特性。异常处理和完善的标准模板库是\
  \ `C++` 中提供的两个最先进的特性。\n\n### 1.4.2 Java\n\n`Java` 由 James Gosling 于 1995 年在太阳微系统公司开发。它与\
  \ `C` 和 `C++` 相似。`Java` 的主要优势它是硬件无关的。任何代码都被编译成字节码（`bytecodes`）。编译后的字节码存储在类文件中，并可以在任何\
  \ Java 虚拟机（`JVM`）上运行。\n\n`JVM` 获取字节码并将其转换为机器代码，随后本地机器使用该代码运行并产生所需的结果。\n\n`Java`\
  \ 1.0 于 1995 年发布。太阳微系统将其称为“一次编写，随运行”。事实上，随着包括 `IE explorer` 和 `Netscape Navigator`\
  \ 在多数浏览器支持 `Java` 1.0，`Java` 迅速成为行业标准。可以在网页浏览器上运行的 `Java` applets 也流行了起来。1998 年，太阳微系统发布了\
  \ `Java 2`，带有适用于不同类型平台的特殊配置，例如适用于企业应用的 `J2EE`、适用于移动计算的 `JEME` 以及标准版的 `J2SE`。这些分别被重命名为\
  \ `JavaEE`、`JavaME` 和 `JavaSE`。\n\n### 1.4.3 C#\n\n`C#` 由 Anders Hejlsberg 为微软开发。它结合了现有\
  \ `C++` 和 `Java` 等 OOP 编程语言的优点。它被开发为一种强大且多功能的完全面向对象的编程语言。\n\n## 1.5 软件开发方法论\n\n\
  软件开发是一项工程活动，涉及启动、分析、设计、开发、实现和交付阶段。使用软件工程（SE）实践开发项目的原则和准则由工程学的 SE 分支所规定。\n\n什么是方法论？方法论可以被视为从\
  \ SE 领域规定的最佳实践中解决 SE（项目）问题的一种风格。例如，我们可以采用结构化分析和设计（早期通被称为 `SAD`），它依赖于如 `C`、`Pascal`\
  \ 等面向过程的语言。\n\n另一种，我们也可以采用面向对象的分析和设计（`OOAD`），在其中，由成员数据和成员函数组成的对象通过它们之间的交互来实现预期的输出。\n\
  \n## 1.6 对象的必要性\n\n在 OOP 范式中，操作数据的数据结构和使用数据的函数不是分离的。OOP 将这两者结合成单一的`实体，称为对象`。\n\n\
  对象通过称为封装（encapsulation）的概念将数据和操作数据的功能绑定在一起，从而避免了未经授权的数据访问，并对数据保持更严格的控制。\n\n对象是运行时实例，通过传递参数与其他对象进行通信，从而实现结果。事实上，对象和对象之间的通信是面向对象程序采用的方法论。\n\
  \n## 1.7 面向对象语言特性\n\nOOP 风格可以分为两种，即基于对象的编程和面向对象的编程。在 OOP 范式中，对象是核心。\n\n### 1.7.1\
  \ 基于对象的编程\n\n要成为一种基于对象的语言，语言必须支持以下特性：\n\n- 数据封装\n- 数据隐藏\n- 运算符重载\n- 对象的初始化以及使用后的自动清理\n\
  \n### 1.7.2 面向对象的编程\n\n除了上述基于对象的特性外，OOP 必须支持广泛的重用和扩展特性，例如：\n- 继承\n- 动态绑定\n- 广泛且定义的标准模板库\n\
  \n在后续章节中，我们将学习 OOP 语言特性的基础。`C++` 和 `Java` 是支持结构化及 OOP 范式的最强大的 OOP 语言。\n\n## 1.8\
  \ OOP 语言类和对象的定义\n\n观察周围。你会发现几个对象（实体），如笔、桌子、笔记本电脑、学生等。图 1.1 显示了班级中的学生对象。每个`实体`都有属性，如颜色、身高、体重等。属性属于对象。例如，一个名为学生的对象具有姓名、学号、成绩、考勤等属性。属性也是对象的状态。大多数对象都有自己的行为。例如，一个名为学生的对象具有玩耍、唱歌等行为。\n\
  \n![对象](img/7-1.png)\n**图 1.1** 学生对象\n\n因此，当我们提到一个对象时，指的是它的属性和行为。图 1.2 显示了属性和行为。我们用矩形框对对象进行建模，如图\
  \ 1.3（chapter001.xhtml_image-1.3）所示。它顶部包含名称，随后是成员函数和成员数据的列表。通常将成员数据设为 `private`，将操作这些数据的设为\
  \ `public`。这是一种安全特性，在 `C++` 等 OOP 语言中被称为`数据隐藏和封装`，以防止外部函数访问对象的数据。\n\n![数据和功能](img/7-2.png)\n\
  **图 1.2** 数据和功能\n\n![模型](img/8-1.png)\n**图 1.3** 模型\n\n我们如何表示对象？\n\n### 1.8.1 对象的属性和行为\n\
  \n一个对象可能有多个实例。例如，上述名为学生的对象可以有 60 个实例，这意味着班级中有 60 名学生。因此，每个对象的实例都可以拥有它自己的数据，例如它自己的学号、姓名、成绩、考勤等。因此我们可以说，对象的属性（即数据）归该实例所有。因此，**属性也是对象的状态。**\n\
  \n所有学生对象将具有相同的功能，如 `Play()`、`Learn()`、`GetData()`、`PrintData()` 等。因此当我们说对象时，我们指的是属性和行为。\n\
  \n### 1.8.2 类\n\n\n\n\n\n# 类\n\n`Class`（类）是对象的集合，也可以定义为实例的数组。图 1.4 展示了包含三个实例的学生类。它还可以拥有成员函数和成员数据。这里与数组不同，类可以拥有不同数据类型作为其元素。\n\
  \n![包含三个学生对象实例的学生类](img/8-2.png)\n\n**图 1.4** 包含三个学生对象实例的学生类\n\n`Class` 定义了对象的抽象（即隐藏的）特征，包括属性和行为。名为\
  \ `student` 的类可以看作是一个工厂，产生 `student` 对象的实例，这些实例具有不同的属性（即个人数据）和共同的功能（即公共函数）。\n\n\
  类提供的属性和函数被称为成员数据和成员函数。在 Java 中，成员函数被称为方法（methods）。\n\n### 1.8.3 封装\n\n到目前，我们已经理解对象意味着属性和功能。`Class`\
  \ 可以包含对象的多个实例。\n\n我们还理解在面向对象编程中，这是一种以数据为主的语言，即数据是重要的，而函数不是重要的。根据 C++ 和其他 OOP 语言使用的内存映射，数据存储在栈和空闲空间的数据区域，函数存储在代码区域，并且有必要对函数对数据的访问进行严格控制。\n\
  \nOOP 语言通过使用封装功能来实现这种控制。`封装是将成员数据和调用函数与安全分级结合在一起，这样就不会发生对数据的未授权访问。`\n\n### 1.8.3.1\
  \ 安全或访问权限\n\nC++ 和 Java 严重依赖于访问修饰符来维护数据完整性。安全访问修饰符有 `public`（公共）、`private`（私有）和\
  \ `protected`（受保护）。\n\n*   **Public:** 声明为 `public` 的成员函数和数据（如果有）可以在类成员函数之外访问。\n\
  *   **Private:** 声明为 `private` 的成员数据只能在类成员函数内部访问，数据对外部隐藏。\n*   **Protected:** 声明为\
  \ `protected` 的成员数据和成员函数对外部是私有的，对具有 `inheritance`（继承）关系的后代是公开的。你将在后续 C++ 章节和 Java\
  \ 章节中学习更多相关内容。\n\n现在可以将封装定义为：\n\n*   `通过类使用如 `private`、`public` 和 `protected` 等访问修饰符将成员函数和成员数据绑定到对象中。`\n\
  *   `因此，类允许我们将成员函数和成员数据封装到称为对象的单一实体中。`\n\n## 1.8.4 数据隐藏 / 数据抽象\n\n通常做法是将所有成员数据仅声明为\
  \ `private`。但声明为 `private` 的数据是隐藏的，任何人都无法访问。这种特征被称为数据隐藏或数据抽象。但这是如何实现这一的呢？你只能通过公共成员函数访问它。没有其他方法。这就像即使大学的主图书管理员如果不使用图书馆提供的访问卡，也无法将书籍带回家。\n\
  \n### 1.8.5 函数重载\n\n当单个函数可以执行多项工作时，编译器的开销就会减少。例如，如果想计算圆的面积、足球的表面积或圆柱的表面积，我们需要写多少函数？通常是三个函数。但在\
  \ C++ 等 OOP 语言中，一个经过重载以执行所有三个工作的函数就足够了。\n\n重载函数根据用户提供的参数来决定将哪个版本的代码加载到主内存中。\n\n\
  为什么重载很重要？函数必须被编译并加载到主内存中。如果函数没有重载，则所有函数在编译时都必须加载并链接。用户可能使用或不使用所有加载的函数，从而浪费主内存，并导致无法解决需要更多主内存的复杂问题。\n\
  \n作为一个示例，考虑以下重载函数：\n\n```cpp\n // 单个参数。相同函数名\n  void FindArea( float r ){ return\
  \ ( 2*3.14158*r*r ) ; }\n  // 两个同名。寻找圆柱的表面积\n  void FindArea( float r , float h\
  \ ){ return ( 4*3.14158*r*h ) ; }\n```\n\n### 1.8.6 运算符重载\n\n预定义的运算符如 `+`、`–`、`*`\
  \ 等，由编译器定义并提供，用于处理 `int`、`char`、`double` 等内置数据类型。在讨论函数重载概念时，我们也看到，如果一个函数可以执行多项任务，我们可以将其称为重载。这是利用主内存等稀缺资源的高效方法。运算符重载通过节省\
  \ C++ 的主内存也提高了程序的效率和吞吐量。\n\n如果我们可以使用这些预定义运算符来处理类等自定义数据类型，我们就称之为运算符重载。例如，考虑一个预定义运算符\
  \ `+` 及其正常操作：\n\n```cpp\nint x = 10, y = 20;\nint z = x + y ; // x 和 y 的内容相加并放在\
  \ z 中\n```\n\n现在考虑两个极形式表示的复数：\n\n```cpp\nPolar v1(25.0,53.50); // 幅和角度 theta\nPolar\
  \ v2(5.0, 45.00);\n```\n\n如果我们可以写：\n\n```cpp\nPolar v3 = v2 + v1;\n```\n\n这意味着我们重载了\
  \ `+` 运算符。\n\n## 1.9 OOP 范式的扩展性与复用性\n\n范式的扩展性和复用性使得 OOP 语言变得多样。OOP 语言提供了多种工具来确保这些功能：\n\
  \n*   包含\n*   继承\n*   虚函数和抽象数据类型 (ADTs)\n*   标准模板库 (STL)\n\n我们将在后续章节中要描述上述功能。它们的实现将在\
  \ C++ 和 Java 章节中解释。\n\n## 1.10 扩展 / 衍生新类\n\n我们可以基于现有类派生新类。这可以通过 OOP 语言提供的继承和包含属性实现。包含是类中的类，即包含确保包含类的成员函数和成员数据。而继承为后代类提供了访问声明为\
  \ `protected` 的成员数据和成员函数。\n\n### 1.10.1 包含：类中的类——容器类\n\n容器类是 C++ 实现代码复用的技术之一。容器类意味着包含另一个类或多个类。例如，计算机内部有一个微处理器。此外，学生类可以有一个属于字符串类的数据成员。我们就可以说字符串类包含在学生类中。换句话说，也可以称为字符串类的组合或聚合。\n\
  \n包含的优势是，我们可以在学生类内部使用字符串类来存储属于姓名、地址等详细信息。同样，如果我们定义一个名为 `date` 的类，带有日、月、年信息，我们可以在名为\
  \ `student` 的类中定义 `date` 对象，并定义出生日期、入职日期等日期数据。因此，组合是一种关系。\n\n\n\n\n\n人类和动物从生物中获得特性。\n\
  \n专业人员、学生和运动员都是源自人类。我们说这三类人继承自人类。`human` 类被称为 `base class`（基类），而 `students` 和 `athletes`\
  \ 称为 `derived classes`（派生类）。可以继承什么？成员函数和成员数据都可以被继承。\n\n你注意到表示继承关系的箭头方向了吗？根据建模语言规范，它是指向向上的。\n\
  \n继承定义了一种“是”（`is`）类型的关系。观察发现，学生是一个人类。同样，哺乳动物是一个动物（`is`）。`Human` 是一个 `base class`，而\
  \ `student` 是一个 `derived class`。从基类派生是实现这种 `is` 类型关系的技术。一个基类可以有多个派生类。\n\n我们什么时候使用继承？你继承是为了从基类派生所有的功能和成员数据，而派生类可以添加自己的专门化或个性化功能。例如，`athlete`\
  \ 继承了 `human` 的所有功能和属性，在此基础上添加了自己的运动和竞技功能及属性。\n\n继承是程序员手中一种强大的工具，用于从现有类定义新类。\n\n\
  ### 1.10.3 单继承与多重继承\n\n继承意味着能够从基类派生一个具有附加功能的新后代类。\n\n在图 1.6a 中，我们展示了 `single inheritance`（单继承继承），其中派生类\
  \ `person` 继承自基类 `human`。\n\n![Single inheritance](img/12-1.png)\n\n**图 1.6a** 单继承\n\
  \n在图 1.6b 中，描述了 `multilevel inheritance`（多级继承），其中 `student` 继承自 `person` 的属性，而 `person`\
  \ 又继承自基类 `human` 的属性。\n\n![Multilevel inheritance](img/12-2.png)\n\n**图 1.6b** 多级继承\n\
  \n在图 1.6c 中，我们展示了涉及一个基类和三个派生类的 `hierarchical inheritance`（层次结构继承）。\n\n![Hierarchical\
  \ inheritance](img/12-3.png)\n\n**图 1.6c** 层次结构继承\n\n图 1.6d 展示了 `multiple inheritance`（多重继承）。在此情况下，基类被称为\
  \ `virtual`（虚的），因为一个基类被两个派生类使用，即派生类 1 (`DC1`) 和派生类 2 (`DC2`)。此外，你可以看到派生类 3 (`DC3`)\
  \ 同时继承自 `DC2` 和 `DC3`。这种类型的继承也被称为 `hybrid inheritance`（混合继承），因为它从两个基类 `DC1` 和 `DC2`\
  \ 派生出一个单一的派生类 `DC3`。\n\n![Multiple/hybrid inheritance](img/12-4.png)\n\n**图 1.6d**\
  \ 多重/混合继承\n\n### 1.11 虚拟函数\n\n在继承关系中，派生类通过公共辅助函数访问受保护的成员数据，从而实现了一种重要的面向对象编程功能——代码复用性。\n\
  \n但是使用属于派生类的成员函数进行对象到基类的操作呢？这一功能允许对象根据用户在运行时的选择，执行派生类的任何一个函数。\n\n这意味着为对象到基类提供了一个通往所选派生类函数的桥梁，因此它可以执行该函数。当我们在基类中声明\
  \ `virtual function`（虚函数）并且派生类重写（override）基类函数时，该桥梁便可用。\n\n如果一个函数在基类中被声明为 `virtual\
  \ function`，我们就可以通过指向基类的指针在派生类中执行同名的重写函数。指向基类的指针是由 `virtual function` 提供的。\n\n总结来说，我们可以说根据用户在运行时的选择，从基类执行任何与基类中\
  \ `virtual function` 同名的函数。\n\n### 1.12 运行时多态与动态数据绑定\n\n继承解决了复用性问题，即派生类可以访问基类中所有声明为\
  \ `protected`（受保护的）数据成员和函数成员。\n\n我们还学过派生类可以重写基类中定义的函数。\n\n此外，在处理 `virtual functions`\
  \ 时我们看到，通过指向基类的指针，我们可以调用派生类对象。\n\n将 C++ 等面向对象语言的上述两个特征相结合，给了我们一个强大的工具叫做 `run-time\
  \ polymorphism`（运行时多态）和动态绑定。\n\n这一特征对程序员意味着，通过指向基类的指针，我们可以在运行时决定调用覆盖了某个函数的特定派生类。换句话说，我们可以通过指向基类的指针，从多个派生类中绑定重写函数。在上一节中，我们看到了\
  \ `virtual functions` 的工作原理，通过它我们可以实现派生类函数与基类指针的绑定。\n\n### 1.13 类作为抽象数据类型 (ADT)\n\
  \n面向对象语言中的类也可以称为 `abstract data type (ADT)`（抽象数据类型）。面向对象语言的特性（如运行时多态和动态绑定）允许我们定义带有无实现的\
  \ `virtual functions`（称为 `pure virtual functions`纯虚函数）或带有占位功能的基类，仅用于告知用户实现由派生类完成。这些类被称为\
  \ `ADTs`，因为它们隐藏了实现细节。\n\n再次参考图 1.7。我们声明一个基类（ADT）为 `shape`。你会发现 `shape` 没有具体的形状、面积或周长，也没有具体的绘图程序，它只声明了虚函数。\n\
  \n![Abstract Data Type (ADT)](img/13-1.png)\n\n**图 1.7** 抽象数据类型 (ADT)\n\n我们将派生出\
  \ `circle` 和 `square` 类，并提供这些虚函数的具体实现。具体意味着在每个派生类中都有具体的代码实现。\n\n\n\n\n\n在面向对象的设计（OOD）模型中，对象之间存在类关系，即具有相同功能特征的对象被归类到一个\
  \ `class`（类）。一个 `class` 允许我们将成员函数和成员数据封装到一个名为 `object`（对象）的单一实体中。\n\n对象通过调用函数和向函数传递参数来与其他对象进行通信。\n\
  \n类与类之间存在关系。这些关系被称为 `associations`（关联）。\n\n还存在继承关系，通过它可以从现有类定义新类。也存在多重继承关系。\n\n\
  我们还学到，虚函数结合继承为我们提供了强大的工具，如运行时多态性，并允许我们定义 ADT（抽象数据类型）和接口。因此，我们可以实现接口与实现的的解耦。\n\n\
  `C` 语言的编程围绕函数展开。调用函数并获得所需的结果。在 OOP 方法论中，所需的结果通过在对象之间传递消息来实现，即对象通过相互调用函数和传递参数进行通信。\n\
  \n我们可以将执行一个大型项目所需的所有类定义在一个单一的工作空间中。这个空间可以被称为 `package`（包）。一旦包含在 `package` 中，我们就可以在其他程序和项目中使用所有类的声明，从而确保代码的可重用性。\n\
  \n### 1.16 面向对象分析与设计 (OOAD)\n\n为了准备解决方案，我们必须首先理解系统。为了理解系统，我们需要对系统进行建模。只有这样我们才能确保程序和项目按预期运行。因此，每当问题是非平凡且难以理解时，我们就对系统进行建模以研究系统的行为。\n\
  \n为了理解系统，用户规范由用户和专家准备。这些规范是用英语对问题的简单陈述。我们需要分析这些规范并遵循面向对象分析和设计原则。分析和设计非平凡复杂系统的最佳方法是通过使用\
  \ `UML` 进行建模。\n\n`UML` 是一种用于分析和设计方法的图形和图解语言。它被称为“统一的”，是因为它统一了面向对象技术三位奠父——格拉迪·布奇（Grady\
  \ Booch）、詹姆斯·兰伯（James Rambaugh）和艾瓦·雅各布森（Ivar Jacobson）所述的所有早期面向对象方法。`UML` 是由 HP、IBM、Oracle\
  \ 等行业联盟在名为对象管理组 (`OMG`) 的控制小组指导下创立的。我们将在随后的 OOPS 章节中介绍所有这些概念。\n\n在下一章中，我们将处理对象建模和\
  \ `UML` 相关的概念。\n\n## 1.17 总结\n\n1. 结构化编程涉及调用函数从而解决问题。\n2. `class` 允许我们将成员函数和成员数据封装到一个名为\
  \ `object` 的单一实体中。\n3. 类与类之间存在关系。这些关系被称为 `associations`（关联）。\n4. `Java` 的主要优势是硬件无关的。任何代码都被编译成\
  \ `bytecodes`（字节码）。编译后的 `bytecode` 存储在 `class` 文件中，可以在任何 `JVM` 上运行。\n5. `JVM` 获取\
  \ `bytecode` 并将其转换为机器代码，然后由本地机器运行并产生所需的结果。\n6. OOP 风格可以分为两种，即基于对象的编程和面向对象的编程。在 OOP\
  \ 范式中，对象是核心的。\n7. 要成为一种基于对象的语言，该语言必须支持以下特性：数据封装、数据隐藏、运算符重载以及对象的初始化和使用后的自动清除。\n8.\
  \ OOP 必须支持广泛的可重用性和扩展性特性，例如所有对象属性、继承、动态绑定以及广泛且定义良好的 `STL`。\n9. 每个 `object` 都有属性（状态）和行为。属性也称为对象的\
  \ `states`（状态）。\n10. **Class**（类）：对象的集合。`class` 定义了对象的抽象的（即隐藏的）特征，包括属性和行为。\n11.\
  \ `Encapsulation`（封装）是将成员数据和调用函数与安全分级结合在一起，以确保不会发生任何未经授权的数据访问。\n12. 一个 `class` 允许我们将成员函数和成员数据封装到一个名为\
  \ `object` 的单一实体中。\n13. 函数重载是指相同的函数名，但参数的数量或类型不同。\n14. 容器类意味着包含另一个类或多个类的 `class`。换句话说，它也可以被称为\
  \ `composition`（组合）或 `aggregation`（聚合）。\n15. 在继承类型的关系中，我们可以从现有类派生出新类。\n16. 继承意味着能够从基类派生出具有额外功能的新后生类。\n\
  17. 如果一个函数在基类中声明为虚函数，我们可以通过基类指针在派生类中执行同名的重写函数。基类指针由虚函数提供。\n18. 面向对象语言中的 `class`\
  \ 也可以称为 `ADT`（抽象数据类型）。\n19. OOP 语言的特性（如运行时多态性和动态绑定）允许我们定义带有无实现（称为纯虚函数）或仅有占位功能的虚函数的基类，用以指示用户实现由派生类完成。这些类被称为\
  \ ADT，因为它们隐藏了实现。\n20. 封装意味着绑定数据和代码。当使用运行时多态性时，最好多态地解耦封装，以防止离散的代码模块相互相互作用。\n21. 基类中的重写函数会被自动隐藏，并且可以通过引用基类函数来显式调用。\n\
