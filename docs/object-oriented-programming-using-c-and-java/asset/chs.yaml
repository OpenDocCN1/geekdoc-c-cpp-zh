  \ 18.5.4 值传递与引用传递\n\n##### 18.5.4.1 值传递\n\n调用方法与被调用方法之间的数据传输模式是通过将列为参数的变量复制到被调用方法的栈区域实现的，随后通过被调用函数将结果复制到主方法的栈区域来将返回值返回给调用函数。这被称为*值传递*。注意，由于涉及了正向传输和返回事务的变量复制，只有当要传输的值数量较少且为基本数据类型时，才是高效的。因此，Java\
  \ 使用值传递来传输所有原始数据类型。\n\n由于传递到方法的是副本，被调用方法对这些变量的更改是局部更改，不会反映回调用方法。\n\n**示例 18.5: PassByValDemo.java\
  \ – 通过值传递传递参数**\n\n```\n //PassByValDemo.java\n   1\\. package com.oops.chap19;\n\
  \   2\\. import java.io.*;\n   3\\. class CallByVal{\n   4\\. public void SwapData(int\
  \ x, int y) {\n   5\\. System.out.println“在 SwapData 交换之前……”…);\n   6\\. System.out.println“x:”\
  \ + x + “y:”+y);\n   7\\. int temp=x;x=y;y=temp;\n   8\\. System.out.println“在 SwapData\
  \ 内部交换后”);\n   9\\. }\n   10\\. class PassByVal {\n   11\\.   public static void\
  \ main(String[] args) {\n   12\\.   int x=10;\n   13\\.   int y=20;\n   14\\.  \
  \ CallByVal obj = new CallByVal();\n   15\\.   obj.SwapData(x,y);\n   16\\.   }\n\
  \   17\\. }\n   输出: 在 SwapData 交换之前………\n   x:10y:20\n   在 SwapData 内部交换后\n   x:20y:10\n\
  ```\n\n*(注：原文中 18.5 的描述存在混乱，此处排版工程师进行了处理)*\n\n| **第 16 和 17 行:** | 显示方法中所做的更改不会反映到调用方法。\
  \ |\n\n#### 18.5.4.2 引用传递\n\n对于占用内存空间的大项，访问将变得很高。因此我们不传递值；而是传递地址。这就是引用传递的特征。\n\n\
  #### 18.5.5 传递和返回对象\n\n我们可以将对象作为参数传递给方法，并通过返回语句接收对象。在接下来的示例中，方法接收对象并计算等级。\n\n**示例\
