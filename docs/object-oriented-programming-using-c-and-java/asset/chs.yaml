  \      /* 输出：Enter radius of the ball. To stop enter 0 for the radius\n      Radius\
  \ = ? 2\n      Surface area of football : 50.2655\n      Enter radius of the ball.\
  \ To stop enter 0 for the radius\n      Radius = ? 3\n      Surface area of football\
  \ : 113.097\n      Enter radius of the ball. To stop enter 0 for the radius\n  \
  \    Radius = ? 0 ```\n\n| **行号 4：** | 函数原型 `float radius, const double PI);` 告诉编译器函数定义在\
  \ `main()` 之后，但在 `main()` 中使用。 |\n\n| **行号 8：** | 我们将 `PI` 声明为 `double` 类型。`Double`\
  \ 意味着它是双精度数据类型。 |\n\n### 6.5.2 数组实现\n\n在本示例中，我们将展示数组的使用。数组是由连续内存组成的数据结构。它在所有位置存储相同的数据类型。在示例\
  \ 6.5.1 中，我们获取半径并立即声明结果，并持续直到用户输入 0 退出。在本示例中，我们将所有不同尺寸锥的半径和高度一起存储在内存位置中，计算这些锥相应的体积并同样存储起来。数组提供了帮助。数组用于在连续位置中持有相同的数据类型。我们将定义三个名为\
  \ `radius`、`height` 和 `volume` 的数组，每个维度均为 10，如[图 6.5]所示。\n\n在 C++ 语言中，习惯是从 0 开始编号数组单元。相应的，`radius[0]`\
  \ 持有值 `2.0`，而 `radius[9]` 持有 `11.0`。`height[0]` 持有值 `5.0`，而 `height[9]` 持有 `14.0`。锥的体积公式为\
  \ `4*PI*radius*radius`。我们将锥的体积存储在名为 `volume` 的数组中。\n\n### 示例 6.4：volume.cpp. 计算冰淇淋锥的体积\n\
  \n/*示例 6.5.2 volume.cpp. 使用数组计算锥体积的程序。我们将存储所有的半径和高度，计算体积并将它们存储在名为 volume 的数组中。当用户通过半径半径\
  \ 0 终止程序时，我们将声明所有结果.*/\n\n\n\n\n\n```cpp\n#include<iostream> // 用于使用库中的 cin 和 cout。\n\
  using namespace std; // 用于解决命名冲突。使用标准库。\n// 声明函数原型\nfloat FindVolume(float radius,\
  \ float height, const double PI);\nvoid main( )\n{ int n, i =0; // i 将用作数组索引，n 用于计数\n\
  \  const double PI=3.1415296;\n  float radius[50]; // 半径数组，最大数量为 50\n  float height[50];\
  \ // 高度数组，最大数量为 50\n  float volume[50]; // 体积数组，最大数量为 50\n  cout<<”\\n 输入圆锥的半径和高度\
  \ <半径输入 0 停止> ”<<endl;\n  cout<<” 半径与高度： ? “;\n  cin>>radius[i]>>height[i]; // 存储在\
  \ radius[i] & height[i] 的地址\n  while (radius[i] != 0)\n  { if (radius[i] < 0)\n\
  \            volume[i] = 0;\n      else\n            volume[i]= FindVolume(radius[i],height[i],PI);//\
  \ 结果在数组 volume 中\n  // 获取下一组数据。我们必须在获取新\n  // 数据之前增加 i，否则旧数据将被覆盖导致丢失。\n  i++;\n\
