  \ 变量的作用域和生命周期\n\n类变量和实例变量（即类的对象）声明在类内部。类声明封装在一组大括号 `{ }` 中。变量属于类的所有实例，而实例特定于正在创建的对象。我们为变量定义了两个特征：作用域和生命。\n\
  \nJava 是一种面向块的语言。块可以定义为一组封装在一对控制大括号内的语句。作用域被定义为跨方法、函数和程序段的可用性。生命被定义为控制大括号的寿命。这意味着变量的生命周期延伸到语句控制块。因此这些变量也被称为局部变量，即块局部变量。\n\
  \n变量的作用域是局部的。这意味着在函数中声明的变量只能在函数内部访问。此外，在函数内部声明的变量的生命周期就是函数本身的寿命。\n\n**示例 16.2: SwapDemo.java\
  \ Demo 局部变量的 Java 程序**\n\n```\n//SwapDemo.java to demonstrate local variables\n\
