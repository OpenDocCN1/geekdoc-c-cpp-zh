  \ Math 类\n\n在下一个示例中，我们将通过一个名为 `Polar` 的类声明来展示目前讨论的所有概念。在这个程序中，你将学习类和对象以及公共存取函数。我们将考虑的类是用直角坐标形式表示的实数\
  \ `a` 和虚部 `b` 的向量。在极坐标系中，相同的可以表示为幅度为 `r = √(² + b²)` 的向量，方向由 `θ = tan(b/a)` 给出。我们的程序将通过名为\
  \ `GetData()` 的公共函数接受实值 `a` 和虚部组件 `b`，并通过名为 `ConvertToPolar()` 的公共函数将其转换为具有幅度 `r`\
