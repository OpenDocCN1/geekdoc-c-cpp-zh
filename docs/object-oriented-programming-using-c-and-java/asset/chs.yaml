  \   32\\.}// 运行时多态结束\n   Output: A refrence to super can refer to sub class over\
  \ ridden Methods\n   Therefore create a referecne to super\n   A refrence to super\n\
  \   Inside Shape. No definite Area\n   A refrence to Circle\n   Inside Circle. Area=PI*r*r\n\
  \   A refrence to Triangle\n   Inside Triangle. Area=0.5*base*alt\n```\n\n- **第\
  \ 17–19 行：** 为类 `Shape`、`Circle` 和 `Triangle` 创建对象。`Shape` 是父类，`Circle` 和 `triangle`\
  \ 是子类，如第 6 行和 10 行所示。每个子类 `Circle` 和 `Triangle` 都在第 8 行和 11 行重写了父方法 `FindArea()`。\n\
  - **第 22 行：** 获取指向父类对象的引用。第 24、27 和 30 行显示该引用被指向 `Shape`、`Circle` 和 `Triangle` 对象。因此，在第\
  \ 25、28 和 31 行中，调用了相应的重写方法。\n\n## 19.8 抽象类\n\n当我们需要确保所有子类都共享公共方法，但同时又有它们自己的实现时，我们使用抽象类。抽象类将具有一个或多个抽象方法。一个抽象类也可以完全没有任何抽象方法。\n\
  \n抽象方法是一种已声明但未定义的方法。它用 `abstract` 关键字声明，具有与任何其他方法相同的头部，但以分号结尾且不包含方法体。语法为：`abstract\
  \ type Method Name (arguments);`\n\n非抽象类有时被称为具体类。\n\n抽象类不能被实例化，因为它包含了抽象方法。然而，从抽象类派生的子类可以有它们自己的实现。让我们重新回顾\
  \ 19.5 中的示例，这次我们把 `Shape` 声明为抽象类。\n\n**示例 19.6：Abstract.java 一个展示抽象类和方法使用的程序**\n\
  \n```\n 1\\. package com.oops.chap19;\n   2\\. abstract class Shape1{\n   3\\. abstract\
  \ void FindArea(); // 抽象方法\n   4\\. public void DisplayCommon(){\n   5\\. System.out.println“Inside\
  \ Shape. Exiting the Shape1 common message”);\n   6\\. }\n   7\\. }//end of class\
  \ Shape1\n   8\\. class Circle1 extends Shape1{\n   9\\. void FindArea(){\n   10\\\
  . System.out.println“Inside Circle1\\. Area=PI*r*r”);\n   11\\. super.DisplayCommon();//\
  \ 通过父类抽象类显示公共消息\n   12\\.   }\n   13\\. }// end of Circle1\n   14\\. class Triangle1\
  \ extends Shape1{\n   15\\. void FindArea(){\n   16\\. System.out.println“Inside\
  \ Triangle1\\. Area=0.5*base*alt”);\n   17\\. super.DisplayCommon();\n   18\\. \
  \  }\n   19\\. }//end of Triangle1\n   20\\. class AbstractDemo{\n   21\\.   public\
  \ static void main(String[] args) {\n   22\\.   // 为类创建对象\n   23\\.   //Shape1 shp\
  \ = new Shape1();//错误。不能实例化抽象类\n   24\\.   Circle1 circ1 = new Circle1();//Circle\
  \ 的对象\n   25\\.   Triangle1 trg1 = new Triangle1();//Triangle 的对象\n   26\\.   System.out.println“指向父类的引用可以指向子类被重写的方法”);\n\
  \   27\\.   System.out.println“因此创建一个指向父类的引用”);\n   28\\.   Shape refsuper; // 指父类\
  \ Shape 的引用\n   29\\.   System.out.println“指向父类的引用 ”);\n   30\\.   refsuper=shp;\
  \ // refsuper 指 Shape 对象\n   31\\.   refsuper.FindArea();\n   32\\.   System.out.println“指向\
  \ Circle 的引用 ”);\n   33\\.   refsuper=circ; // refsuper 指 Circle 对象\n   34\\.  \
  \ refsuper.FindArea();\n   35\\.   System.out.println“指向 Triangle 的引用 ”);\n   36\\\
  .   refsuper=trg; // refsuper 指 Triangle 对象\n   37\\.   refsuper.FindArea();}\n\
  \   38\\.   }\n   Output: A refrence to super can refer to sub class over ridden\
  \ Methods\n   Therefore create a referecne to super\n   A refrence to super\n  \
  \ Inside Shape. No definite Area\n   A refrence to Circle\n   Inside Circle. Area=PI*r*r\n\
  \   A refrence to Triangle\n   Inside Triangle. Area=0.5*base*alt\n```\n\n| **第\
  \ 2 行：** | 声明一个抽象类 `Shape1`。 |\n| **第 3 行：** | 声明抽象方法 `FindArea()`。 |\n| **第 4 行：**\
  \ | 声明一个非抽象方法 `public DisplayCommon()`，供所有子类使用。 |\n| **第 8–19 行：** | 在类 `Circle1`\
  \ 和 `Triangle1` 中声明并定义具体方法。注意在 `FindArea()` 方法结束这些方法调用了公共功能，可以通过 |\n| **第 11 和 17\
  \ 行：** | `super.DisplayCommon();` |\n| **第 28 行：** | `refsuper` 是一个指向 |\n| **第 31\
  \ 和 34 行：** | `Circle1` 和 `Triangle1` 的引用。\n\n## 19.9 在继承中使用 final\n\n在前一个章节中，我们展示了如何使用\
  \ `final` 关键字定义变量并在程序运行期间保持它们的值不变。\n\n### 19.9.1 final 方法\n\n`final` 修饰符也可以用于方法。你们知道继承中，派生类可以重写基类方法以使用自己的实现。当我们不希望这种情况发生时，我们需要在基类中将方法声明为\
  \ `final`。例如：\n\n**示例 19.7：展示对方法使用 final 修饰符的 Java 代码段。构造函数和析构函数**\n\n```\nclass\
  \ Person {\n    final void Update() { //此处此处此处。final 方法不能被继承}\n} // person 类结束\n\
  class Student extends Person {\n    void update() { // 错误无法继承}\n} // student 类结束\n\
  ```\n\n### 19.9.2 final 类\n\n当我们不希望一个类被继承时，我们将该类声明为 `final`。由于类不能被继承，那么默认情况下 final\
  \ 类内部所有的成员都被认为是 `final` 的，因此不能被继承。\n\n```\nfinal class Person {\n   void Update()\
  \ { //此处此处此处。final 方法不能被继承}\n   } // // person 类结束\n   class Student extends Person\
  \ { // 错误 Student 无法扩展 Person(final 类)\n   } // student 类结束\n```\n\n\n\n\n# Object\
  \ 类\n\n到目前，我们已经理解了运行时多态和已写代码复用的威力。我们创建的对象被自动视为 `java.lang` 包中名为 `Object` 的类的子类。这样做的优势是什么？\n\
  \n`Object` 类包含了几个非常有用的静态方法，可以在不创建对象的情况下直接使用。既然用户创建的所有对象都被视为子类，那么所有用户创建的对象都将访问 `java.lang`\
  \ 包中元类 `Object` 的静态方法。带有 `final` 饰符的方法不能被重写。`object` 类支持的方法见表 19.1。\n\n**表 19.1**\
  \ object 类的静态方法和 final 方法\n\n| 静态方法 | 备注 |\n| --- | --- |\n| `boolean equals()`\
  \ | 通过检查引用是否相同来比较两个对象。如果相同返回 true，否则返回 false。 |\n| `String toString()` | 返回一个描述对象的\
  \ `String`。它会随着与对象一起 `println` 语句自动调用。 |\n| `int hashCode()` | 返回与调用对象相关的哈希码。 |\n\
  | `void finalize()` | 在垃圾回收器不再需要对象并清理之前调用。 |\n| `final void notify()/notifyAll()`\
  \ | 恢复在调用对象上等待的高优先级线程/所有线程。 |\n| `Object clone()` | 创建克隆，即创建一个与被克隆对象相同的新对象。 |\n\
  | `final void wait()/wait(ms)/wait(ms,ns)` | 在指定线程（非执行状态）等待指定时间。 |\n| `final Class\
  \ getClass()` | 在运行时获取对象的类名。 |\n\n**示例 19.9:** `ObjectDemo.java` **一个展示 Object 类静态方法使用的\
  \ Java 程序**\n\n```\n 1\\. package com.oops.chap19;\n   2\\. class Person4 implements\
  \ Cloneable{\n   3\\. String name;\n   4\\. Person4(String nm){name=nm;}\n   5\\\
  . public String Getname() {return name;}\n   6\\. public void DisplayData() {\n\
  \   7\\. System.out.println(“Person Details are………”);\n   8\\. System.out.println(“overriden\
  \ toString() Method:” + toString());\n   9\\. System.out.println(“Obj Details from\
  \ static method hashcode()”);\n   10\\.   System.out.println(“Object Hash Code :”\
  \ + hashCode());}\n   11\\.   public String toString()\n   12\\.   {String stg;\n\
  \   13\\.   stg = “Name :” + Getname();\n   14\\.   return stg;}\n   15\\.   public\
  \ void CompareObjects(Person4 per2){\n   16\\.   System.out.println(“ using equals(obj)\
  \ static method”);\n   17\\.   if (this.equals(per2))\n   18\\.   System.out.println(“Per1&\
  \ Per2 are same.”);\n   19\\.   else System.out.println(“Per1 & Per2 are NOT same.”);}\n\
  \   20\\.   public Object CloneObj()throws CloneNotSupportedException\n   21\\.\
  \   {return super.clone();}\n   22\\.   }//end of class Person\n   23\\.   public\
  \ class ObjectDemo {\n   24\\.   public static void main(String[] args) throws CloneNotSupportedException\n\
  \   25\\.   {\n   26\\.   //Two different objects. Their references are NOT same\n\
  \   27\\.   // But Content same\n   28\\.   System.out.println(“Two objects per1&2\
  \ with same content”);\n   29\\.   Person4 per1 = new Person4(“Salman”);\n   30\\\
  .   Person4 per2 = new Person4(“Salman”);\n   31\\.   per1.CompareObjects(per2);\n\
  \   32\\.   System.out.println(“Displaying per1 data”);\n   33\\.   per1.DisplayData();\n\
  \   34\\.   System.out.println(“Clone per1 object to per3”);\n   35\\.   Person4\
  \ per3 = (Person4)per1.CloneObj();\n   36\\.   System.out.println(“Displaying per3\
  \ data”);\n   37\\.   per3.DisplayData();\n   38\\.   }\n   39\\.   }\nOutput:\n\
  Creating two objects per1 and2 with same content using equals(obj) static method\n\
  Per1 & Per2 are NOT same.\nDisplaying per1 data\nPerson Details are………\nUsing overriden\
  \ toString() Method:Name :\nObject Details from static method hashcode() of Object\
  \ class are\nHash Code of Object:16711\nClone per1 object to per3\nDisplaying per3\
  \ data\n```\n\n\n\n\n第 15 章 (第 15.6.2 节) 提供了运行 `path` 和 `class path` 变量所需的完整细节和设置。如果我们希望从任何目录运行\
  \ `java` 可执行文件而无需每次指定完整路径，设置 `path` 是关重要的。另一方面，`Class path` 是你给 Java 环境的消息，告诉它哪里搜索你的类文件。\n\
  \n## 19.13 包的导入\n\n包（Package）意味着将所有相关的类分组，以便它们重用。因此，同一个包中的所有类文件在包级别上都是公共的，因此不需要导入。然而，属于包包的类文件需要导入。例如，我们需要导入\
  \ `java.util.*;` 才能访问 `java.util` 包中的类文件。\n\n**示例 19.10a：Date1.java 一个使用包和类导入开发可重用类\
  \ Date1 的程序**\n\n```\n /* Date1.java Date1 类显示 dd:mm:yy 格式的日期并转换为 dd:mmm:yy 格式*/\n\
  \   1\\. package com.oops.chap19;\n   2\\. public class Date1 {\n   3\\. private\
  \ int dd;\n   4\\. private int mm;\n   5\\. private int yy;\n   6\\. //Date1 的构造函数\n\
  \   7\\. Date1(int d, int m,int y){dd=d;mm=m;yy=y;}\n   8\\. //验证日期\n   9\\. public\
  \ void validateDate(int d,int m,int y)\n   10\\.   {dd= ((d>=0 && d<=31 )?d:0);\n\
  \   11\\.   mm= ((m>=0 && d<=12 )?m:0);\n   12\\.   yy= ((y>=1900 && d<=1999)?y:0\
  \ );\n   13\\.   }// end of validateDate()\n   14\\.   // 日期格式为 dd-mmm-1910 例 01:Jan:10\
  \ 格式\n   15\\.   public String ConverttoMMM(int mm){\n   16\\.   String mmm=””;\n\
  \   17\\.   switch(mm)\n   18\\.   { case 1 : mmm=”JAN”;break;case 2 : mmm=”FEB”;break;\n\
  \   19\\.   case 3 : mmm=”MAR”;break;case 4 : mmm=”APR”;break;\n   20\\.   case\
  \ 5 : mmm=”MAY”;break;case 6 : mmm=”JUN”;break;\n   21\\.   case 7 : mmm=”JUL”;break;case\
  \ 8 : mmm=”AUG”;break;\n   22\\.   case 9 : mmm=”SEP”;break;case 10 : mmm=”OCT”;break;\n\
  \   23\\.   case 11: mmm=”NOV”;break;case 12 : mmm=”DEC”;break;\n   24\\.   }\n\
  \   25\\.   return mmm;\n   26\\.   }\n   27\\.   public String toDDMMMYYString()\n\
  \   28\\.   {return String.format(“%d:%s:%d”,dd,ConverttoMMM(mm),yy);}\n   29\\\
  .   public String toString()\n   30\\.   {return String.format(“%d:%d:%d”,dd,mm,yy);}\n\
  \   31\\.   }// end of Date1\n```\n\n| Line No. 1: | 声明包为 `com.oops.chap19;` |\n\
  | Line No. 2: | 显示任何可重用的类都应声明为 `public`。第 3–5 行声明了 `private` 变量。 |\n| Line No. 6:\
  \ | 声明了一个构造函数。第 9–13 行验证了月、日和年 |\n| Line Nos. 15–26: | 定义了一个公共方法 `public String\
  \ ConverttoMMM(int mm)` 将日期从 dd:mm:yy 格式转换为 dd:mmm:yy 格式 |\n| Line No. 27: | `public`\
  \ String toDDMMMYYString()` 将转换为 dd:mmm:yy 格式。为此，它使用了第 27 行中的方法 `ConverttoMMM(mm)`。还要注意，`toDDMMMYYString()`\
  \ 方法通过指定格式来创建字符串，使用了 `String.format` 方法。这里使用了 C 语言风格的格式化。%d` 用于整数，%s` 用于字符串。 |\n\
  \n**示例 19.10b：Datetester.java 一个测试 示例 19.10a 中 Date1 的驱动程序**\n\n```\n 1\\. package\
  \ com.oops.chap19;\n      //import com.oops.chap19.Date1; 因为是同一个包，不需要导入\n   2\\\
  . public class Date1tester{\n   3\\. public static void main(String[] args) {\n\
  \   4\\. //初始化 Date1 对象\n   5\\. Date1 date = new Date1(19,11,10);\n   6\\. System.out.println“date\
  \ in<dd:mm:yy>format”+ date.toString());\n   7\\. System.out.println();\n   8\\\
  . System.out.println(“date in<dd:mm:yy>format”+ date.toString());\n   9\\. System.out.println(“date\
  \ in<dd:mmm:yy>format”+ date.toString());\n   10\\.   }\n   11\\.   }//end of Date1\n\
  ```\n\n\n\n\n\n接口定义用关键字 `interface` 而不是 `class` 开始。例如 `public interface Shape`。接口可以是\
  \ `public` 或 `default` 饰符。接口仅包含方法名，而没有具体实现。这意味着所有方法都是抽象方法。然而，在 `interface` 面前不需要使用\
  \ `abstract` 关键字。接口还可以定义 `final` 和 `static` 声明。例如，我们在示例 19.11a 中的一个名为 `Shape` 的接口中展示了三个抽象方法。概念图如图\
  \ 19.6 所示。\n\n![圆形和三角形类实现形状接口](img/470-1.png)\n\n**图 19.6** 圆形和三角形类实现形状接口\n\n**示例\
  \ 19.11a: Shape.java 仅包含抽象方法的接口 Shape**\n\n```\n 1\\. package com.oops.chap19;\n\
  \   2\\. public interface Shape {\n   3\\. final static double PI = 3.141519;\n\
  \   4\\. // 抽象方法。只有头部没有身体。\n   5\\. // 使用关键字 abstract 是可选的\n   6\\. double ComputeArea(double\
  \ x);\n   7\\. double ComputePerimeter(double x);\n   8\\. void DrawShape();\n \
  \  }// end of interface shape\n```\n\n**示例 19.11b: ShapeTest.java 圆形和正方形类实现接口**\n\
  \n```\n 1\\. package com.oops.chap19;\n   2\\. // 圆形\n   3\\. class Circle2 implements\
  \ Shape\n   4\\. {public double ComputeArea(double radius){\n   5\\. double area=0;\
  \ area = PI*radius*radius;\n   6\\. return area;\n   7\\. }\n   8\\. public double\
  \ ComputePerimeter(double radius){\n   9\\. double perim=0;perim = 2*PI*radius;return\
  \ perim;}\n   10\\.   public void DrawShape(){\n   11\\.   System.out.println(“Draw\
  \ Circle Shape here!”);}\n   12\\.   }// end of class Circle1\n   13\\.   class\
  \ Square implements Shape\n   14\\.   {public double ComputeArea(double side){\n\
  \   15\\.   double area=0; area = side*side;return area;}\n   16\\.   public double\
  \ ComputePerimeter(double side){\n   17\\.   double perim=0;perim = 4*side;return\
  \ perim;}\n   18\\.   public void DrawShape(){\n   19\\.   System.out.println(“Draw\
  \ Square Shape here!”); }\n   20\\.   }// end of class Square\n   21\\.   class\
  \ ShapeTest{\n   22\\.   public static void main(String[] args){\n   23\\.   //\
  \ 创建接口 Shape 的引用\n   24\\.   Shape shp;\n   25\\.   // 创建子类的对象\n   26\\.   Circle2\
  \ circ = new Circle2();\n   27\\.   Square sqr = new Square();\n   28\\.   // 让引用指向圆形\n\
  \   29\\.   shp=circ;\n   30\\.   System.out.println(“Area of Circle”+ shp.ComputeArea(10.0));\n\
  \   31\\.   System.out.println(“Perim of Circle”+ shp.ComputePerimeter (10.0));\n\
  \   32\\.   shp.DrawShape();\n   33\\.   System.out.println(); //空行\n   34\\.  \
  \ shp=sqr;\n   35\\.   System.out.println(“Area of Square”+ shp.ComputeArea(10.0));\n\
  \   36\\.   System.out.println(“Perim of Square”+ shp.ComputePerimeter (10.0));\n\
  \   37\\.   shp.DrawShape();\n   38\\.   }\n   39\\.   }\n```\n\n由于接口 `Shape` 和实现类属于同一个包，因此不需要导入\
  \ `Shape` 接口。\n\n| **第 3 行：** | `class` `Circle2` `implements` `Shape` 显示 `Circle2`\
  \ 实现了 `Shape`。第 4–7 行显示 `Circle2` 实现了 `Shape` 的抽象方法。同样，第 8 到 12 行显示 `Circle2` 实现了另外其他抽象方法\
  \ `Computeperimeter()` 和 `DrawShape()`。 |\n\n| **第 13 到 19 行：** | 显示 `Square` 类的实现细节。\
  \ |\n\n| **第 24 行：** | `Shape shp;` 创建了一个接口的引用。第 29 行让 `shp` 指向 `circ` 对象。第 30、31\
  \ 和 32 行显示 `shp` 调用了 `circle2` 的具体方法并执行了它们。 |\n\n| **第 34 行：** | 让 `shp` 指向 `Square`\
  \ 对象。接后的行显示了 `Square` 方法的实现。 |\n\n#### #### 19.16 总结 \n\n1. 继承提供了一种从现有类创建新类的机制。现有类被称为\
  \ `super`（父类），新类被称为 `subclass`（子类）。\n2. 允许成员的访问饰符有 `public`、`private`、`protected`、`private\
  \ protected` 以及到包级别的 `default` 访问。\n3. 如果我们将成员声明为 `private`，那么它们仅在类内部可见。它们对子类或类外部不可见。\n\
  4. `Protected` 是一种访问饰符，允许子类通过子类派生成员。`Protected` 对所属类和子类可见，对其他人为 `private`。\n5. `Set`\
  \ 方法是修改器（mutator），`Get` 方法是访问器（accessor）。\n6. 可以使用 `super()` 调用父类构造函数。\n7. Java\
  \ 只允许单继承。Java 不支持多重继承。\n8. 接口是 Java 用于动态多态的强大工具。接口类使用关键字 `interface` 而不是 `class`。\n\
  \n#### #### 练习题\n\n##### #### 单选题\n\n1. Java 中可以被继承的成员是：\n   1. `public`\n   2.\
  \ `private`\n   3. `private protected`\n   4. `protected`\n   5. `default`\n   1.\
  \ i 和 ii\n   2. i 和 iii\n   3. i, iii, iv 和 v\n   4. ii, iv 和 v\n\n2. 父类构造函数可以使用以下方式调用：\n\
  \   1. `super()`\n   2. `super.Class Name`\n   3. `Class Name`\n   4. `super(Class\
  \ Name)`\n\n3. Java 支持以下类型的继承：\n   1. 多重继承\n   2. 多级继承\n   3. 单级继承\n   4. 虚继承\n\
  \   1. i 和 iv\n   2. i, ii 和 iii\n   3. ii 和 iii\n   4. iii 和 iv\n\n4. 关于子类对象调用构造函数，以下哪些陈述正确？\n\
  \   1. 子类构造函数后跟 super\n   2. super 构造函数\n   3. 子类\n   4. super 后跟子类构造函数\n\n5. 方法重写意味着：\n\
  \   1. 子类与父类具有相同的名称和相同的返回类型。\n   2. 子类定义了多个相同名称但参数不同的方法。\n   3. 父类定义了多个相同名称但参数不同的方法。\n\
  \   4. 子类定义了多个相同名称和参数的方法。\n\n6. 关于抽象类，以下哪些陈述正确？\n   1. 仅包含所有抽象方法\n   2. 可以包含非抽象方法\n\
