  \ | 用于发送数据的 OutputStream |\n| `ServletException` | Servlet 错误 |\n| `ServletUnavailableException`\
  \ | Servlet 不可用 |\n\n### 表 24.8 Servlet 接口−方法\n\n| Javax.servlet 接口方法 | 备注 |\n|\
  \ --- | --- |\n| `void service(ServiceRequest req, ServiceResonse res) throws Sevlet\
  \ Exception,IOException` | 处理来自客户端的请求并发送响应 |\n| `void init( ServletConfig config)`\
  \ | 设置初始化参数 |\n| `ServletConfig getServletConfig()` | Servlet 配置信息以及用于访问环境参数的 ServletContext\
  \ |\n| `String getServletInfo()` | 返回 servlet 作者和版本 |\n| `void destroy()` | 在 servlet\
  \ 卸载时调用 |\n| `ServletException` | Servlet 错误 |\n| `ServletUnavailableException`\
  \ | Servlet 不可用 |\n\n上述的 `ServletRequest` 和 `ServletResponse` 接口从客户端接收请求对象并准备发送响应。Servlet\
  \ 包定义了两种抽象类。一个是属于 `javax.servlet` 的 `GenericServlet`，另一个属于 `javax.servlet.http`\
  \ 包的 `HttpServlet`。在下一个示例中，我们将展示一个扩展到 `GenericServlet` 的程序。在这个示例中，我们将通过将客户端请求包含的参数名和值复制到\
  \ Java Utility 包 `Enumeration` 类的对象 `enm` 中读取它们。\n\n#### 示例 24.16: PostParam.java\
  \ 一个显示扩展到 GenericServlet 的程序。\n\n```java\n1\\. import java.io.*;\n2\\. import java.util.*;\n\
