  \ over rides Learn() of base class”<<endl;\n24. std.Learn(); // std 覆盖了基类函数之一 Learn()\n\
  25. cout<<”\\n Two other base class over loaded functions Learn(int), Learn(int,int)\
  \ are lost”<<endl;\n26. //std.Learn(2); // 丢失\n27. cout<<”\\nstd can still call\
