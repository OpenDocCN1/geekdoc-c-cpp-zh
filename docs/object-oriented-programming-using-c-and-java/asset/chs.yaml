  \n### 10.3 友元函数\n\n由于 C++ 的数据封装和数据隐藏特性，只有公共成员函数可以访问私有数据。我们也可以声明成员函数来访问私有数据，就像我们在程序中使用\
  \ `GetData()` 一样，但这很繁琐。是否有一种方法可以让我们通过非成员函数访问私有数据？友元运算符（friend operator）正实现了这一点。你可以通过将其声明为\
  \ `friend` 在类内部包含一个非成员函数。例如，让我们重新复习 `Polar` 类（不，应为重新复习 `Polar` 类，将 `GetData()` 声明为\
  \ `friend` 并看看程序如何简化）。\n\n```cpp\nfriend void DisplayPolar(Polar v);\nfriend Polar\
  \ Multiply(Polar v1, Polar v2);\n```\n\n在类外部定义这些函数时，不需要使用作用域运算符。\n\n```cpp\nvoid\
  \ DisplayPolar(Polar v) // 我们可以直接使用 r 和 t\ncout<<”Magnitude”<<v.r<<” Angle =”<<v.t<<endl;\n\
  }\n```\n\n```cpp\nPolar Multiply(Polar v1, Polar v2)\n{     Polar v3;\n      v3.r\
  \ = v1.r * v2.r; // 相乘幅度\n      v3.t = v1.t+v2.t; // 相加角度\n      return v3;\n}\n\
  ```\n\n此外注意，尽管这些函数是非成员，但它们是`friend functions`。这种简化的代价是什么？\n\n### 示例 10.6：class3.cpp\
  \ 类的友元函数\n\n```cpp\n/* 在此程序中，你将学习友元运算符的概念。\nMultiply 和 DisplayData 被声明为友元函数*/\n\
  #include<iostream>\n#include<cmath> // 用于数学相关的函数如 sqrt,cos, tan\nusing namespace\
  \ std;\n// Polar 类的声明\nclass Polar\n { // 公共辅助函数\n     public:\n     Polar():r(0.0),t(0.0){}\
  \ // 默认构造函数\n     Polar( double f, double g):r(f),t(g){} // 我们将这样声明\n          \
  \                     //构造函数\n     ~Polar(){} // 默认析构函数\n     friend void DisplayPolar(Polar\
  \ v); // 以极坐标显示\n     friend Polar Multiply(Polar v1, Polar v2);\n     // 所有成员数据都声明为私有\n\
  \     private:\n       double r; // 幅\n       double t; // 角度\n};\nvoid main()\n\
  {Polar v1(5.0,53.0),v2(6.0,28.0),v3; // v1,v2,v3 是 Polar 类的对象\n// 相乘 Polar 向量 v1\
  \ 和 v2 并存储在 v3 中\n   v3=Multiply(v1,v2);\n   cout<<”\\nThe Given Vectors in Polar\
  \ form form ….\\n”<<endl;\n   cout<<”\\nPolar form vector v1 :”;\n   DisplayPolar(v1);\n\
  \   cout<<”\\nPolar form vector 2 v2 :”;\n   DisplayPolar(v2);\n   cout<<”\\nv3=v1*v2\
  \ in Polar Form :”;\n   DisplayPolar(v3);\n}// main 结束\n```\n\n### 10.4 类中类：容器类\n\
  \n容器类是 C++ 提供的实现代码复用的技术之一。继承是另一个用于代码复用的强大特性，我们将在继承章节中探讨。\n\n\n\n\n`Container` 类意味着包含另一个类或多个类的类。例如，计算机内部包含（has）一个微处理器。此外，`Student`\
  \ 类可以拥有一个属于 `string` 类的数据成员。那么我们可以说 `string` 类被包含在 `Student` 类中。换句话说，它也可以称为 `string`\
  \ 类的`组合或聚合`（`composition or aggregation`）。包含包含的优势在于，我们可以在 `Student` 类中使用 `string`\
  \ 类来存储属于 `string` 类的姓名、地址等详细信息。同样，如果我们定义一个带有 `day`、`month` 和 `year` 信息的 `Date` 类，我们可以在\
  \ `Student` 类中定义 `Date` 类的对象，并定义 `Date` 相关的数据，如 `DOB`、`DOJ` 等。\n\n`组合是一种“拥有”类型的关系`。对于我们上面给出的例子，`Student`\
  \ 拥有 `string` 类的姓名和 `Date` 类的 `DOB`。\n\n### 示例 10.7: `PointCircle.cpp` 容器类示例，即类作为另一个类的数据成员。类的构造函数和析构函数\n\
  \n在这个程序中，你将学习类中类的概念。即类作为另一个类的数据成员。我们将定义一个名为 `Point` 的类，稍后将其声明为 `Circle` 类的数据成员。然后计算圆的面积。\n\
