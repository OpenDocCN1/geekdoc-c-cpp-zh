  ```\n\n| **第 12 行:** | 通过创建 `InetAddress` 类的对象 `ipadd` 并调用静态方法 `getByName()` 来获取网站的名称。第\
  \ 13 行显示结果。 |\n\n| **第 14 行:** | 捕获 (`UnknownHostException` e) |\n\n#### 22.4 URL\
  \ 和 URL 连接\n\n统一资源定位符（`URL`）的创建是为了从网络上获取信息，无论采用了哪种协议来创建它。我们知晓 `www` 是多个协议（如 `HTTP`/`FTP`/`finger`/`whois`）的集合。`URL`\
  \ 是从互联网获取信息的现代方式。`URL` 类提供了使用 `URL` 访问信息的方法。\n\n##### URL 构造函数\n\n* `URL (String\
  \ protocol, String host, int port, String file)` 抛出 `MalformedURLException`。\n*\
  \ `URL (String protocol, String host, String file)` 抛出 `MalformedURLException`。\n\
  * `URL (String urlString)` 抛出 `MalformedURLException`。\n\n##### URL 方法\n\n* `String\
  \ getFile()`\n* `String getHost()`\n* `int getPort()`\n* `String getProtocol()`\n\
  \n##### URL：如何使其工作？\n\n* 创建代表 `www` 地址资源的 `URL` 对象\n* `URL myurl = new URL(“http://www.vasappanavara.org”);`\n\
  * 创建可以连接到相关网站的 `URL` 连接\n* `InputStream inputstream = myurl.openStream();`\n* 使用\
  \ `StreamReader` 创建一个缓冲区（例如数据类型为 `byte`），用于从 `URL` 连接读取流数据。\n    `byte buffArray[\
  \ ] = new byte[1024];`\n* 使用该 `URLConnection` 对象的 `read()` 方法并创建 `InputStream` 用于从\
  \ `URL` 读取数据流。\n\n```\nwhile((i = inputstream.read(buffArray)) != -1) {\n   System.out.write(buffArray,\
  \ 0, i);}\n}\n```\n\n这些概念将在我们的下一个示例中展示。\n\n**示例 22.2：InetAddressDemo.java 编写程序以获取指定网站的\
  \ InetAddress 和本地主机名**\n\n```\n //此程序需要连接连接\n   import java.io.*;\n   import java.net.*;\n\
  \   import java.util.*;// 用于 scanner 类\n   public class URLDemo {\n   public static\
  \ void main(String[] args)throws IOException {\n   String websitename;\n   Scanner\
  \ scn=new Scanner(System.in);\n   System.out.print(“Enter WebSite Name :”);\n  \
  \ websitename=scn.next();\n   try{\n     URL myurl = new URL(websitename);\n   \
  \  // 获取输入流\n     InputStream inputstream = myurl.openStream();\n     // 从 URL 读取并显示数据\n\
  \     byte buffArray[] = new byte[1024];\n     int i;\n     while((i = inputstream.read(buffArray))\
  \ != -1) {\n     System.out.write(buffArray, 0, i);\n     }\n     }\n     catch\
  \ (Exception e) {\n     e.printStackTrace();\n     }\n     }\n     }\n   Output\
  \ : Enter WebSite Name :http://www.vasappanavara.org\n   <!DOCTYPE HTML PUBLIC “-//W3C//DTD\
  \ HTML 4.01 Transitional//EN”\n   “http://www.w3.org/TR/html4/loose.dtd”>\n   <html\n\
