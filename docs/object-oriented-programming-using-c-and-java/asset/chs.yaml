  \n\n\n## 拷贝构造函数\n\n这是特殊构造函数中的第二个，第一个是默认构造函数（如果你不自己创建，它将自动创建）。它接受一个参数，即要被复制的对象。查看下面的声明和定义：\n\
  \n```\nStudent( const Student & src) :rollNo(src.rollNo),name(src.name){}\n```\n\
  \n该对象以常引用的形式传递，这样它就不会被修改。一旦声明，我们就可以用它来将对象的整个状态拷贝到新对象中。\n\n```cpp\nStudent std; //\
  \ 创建对象\nStudent std1(std) ; // 将整个对象 std 复制到 std1\n```\n\n让我们尝试一个问题，以便更清楚地理解构造函数和析构函数。在程序程序中，你将学习类构造函数、重载构造函数、拷贝构造函数、默认析构函数等概念。\n\
  \n### 示例 10.5：classbasic2.cpp 类的构造函数和析构函数\n\n```cpp\n#include<iostream>\nusing namespace\
  \ std;\n//声明一个名为 Student 的类\nclass Student\n {   public:\n     // 重载构造函数\n     Student(){rollNo=0,name=”No\
  \ Name”;}\n     Student(int n, char *p){rollNo=n,name=p;}\n     Student( const Student\
  \ & src) // 拷贝构造函数\n     { rollNo=src.GetRollNo();name=src.GetName();\n        \
  \ cout<<” Copy Constructor….”<<endl;}\n     ~Student(){}; // 默认析构函数\n     // 公访问函数\n\
  \     int GetRollNo() const { return rollNo;}\n     void SetRollNo ( int n) { rollNo=n;}\n\
  \     char * GetName() const { return name;}\n     void SetName( char *p) { name=p;}\n\
  private:\nint rollNo;\n      char *name; // 指向名的指针\n};\n void main()\n { Student\
  \ std; // 创建对象\n      cout<<” \\n Students rollNo set by Default constructor : “\n\
  \         <<std.GetRollNo()endl;\n      cout<<”\\n Students name set by Default\
  \ constructor : “\n         <<std.GetName()endl;\n   //将学号设置为 6060，名字设置为 gautam。\n\
  \   // 我们必须使用公共辅助函数来更新私有数据\n   // 为什么？因为我们不在成员函数内部\n   std.SetRollNo(6060);\n  \
  \ std.SetName(“Gautam”);\n      cout<<”\\n Students rollNo set by SetRollNo :”\n\
  \         <<std.GetRollNo()endl;\n      cout<<”\\n Students name set by SetName\
  \ :”\n         <<std.GetName<<endl;\n   // 现在让我们利用重载构造函数\n   Student std2(7070,”Ramesh”);\n\
  \   cout<<” \\n Students rollNo set by (int n, char *p) overloaded \n   constructor\
  \ : “\n        <<std2.GetRollNo()endl;\n   cout<<”\\n Students name set by (int\
  \ n, char *p) overloaded : “\n       <<std2.GetName<<endl;\n   // 现在让我们使用拷贝构造并将\
  \ std2 复制到 std3\n   Student std3(std2); // std 被复制到名为 std3 的新对象\n   cout<<” \\n\
  \ Students(std3 rollNo) : “<<std3.GetRollNo()endl;\n   cout<<”\\n Students (std3\
  \ name) : “<<std3.GetName()endl;\n}\n/*输出：Students rollNo set by Default constructor\
  \ : 0\nStudents name set by Default constructor : No Name\nStudents rollNo set by\
  \ SetRollNo :6060\nStudents name set by SetName :Gautam\nStudent(std2.rollNo) set\
  \ by (int n, char *p) overloaded constructor : 7070\nStudent(std2.name) name set\
  \ by (int n, char *p) overloaded : Ramesh\nCopy Constructors\nStudents(std3 rollNo)\
  \ : 7070\nStudents (std3 name) : Ramesh*/\n```\n\n我们已经在运行的程序本身解释了这些特征。最后再看一眼我们使用的公共辅助函数。\n\
