  Java 的强项在于其可重用特性，而 Java beans 是 Java 中提供的实现这一特性的功能。Java bean 是一种可移植、平台无关的组件模型，便于编写高度可重用的组件。为此，我们将使用\
  \ Java  的 API。一旦开发了这些组件，我们就可以将其嵌入 applet 或应用程序中。Java beans 可以是视觉组件，也可以是非视觉组件。Beans\
  \ 是具有动态性的，因为它们可以被更改或自定义。我们可以使用 bean 组件的属性来定制 bean，并使用 bean 的持久化属性来保存 bean。\n\n###\
  \ 自省（Introspection）\n\n- Java 程序可以通过一个名为“自省（introspection）”的过程来发现 bean 的属性。\n- 一个名为\
  \ `Introspector` 的类使用核心反射 API 进行自省。为了使自省能够工作，我们需要遵循某些命名规范和一些特定规则，以便自省能够识别这些属性。\n\
  - 一个 bean 信息类实现了 `BeanInfo` 接口。`ABeanInfo` 类显式地列出了要暴露给应用程序构建器工具的 bean 特性。\n- 属性是\
  \ bean 的外观和行为特征。Beans 暴露属性以便在设计时对其进行自定义。属性可以在设计时通过自定义器或属性编辑器进行更改。\n- Bean 事件可用于\
  \ bean 组件之间的通信。接收信息的监听器 bean 必须向源 bean 注册。\n- 持久化（Persistence）允许 bean 保存并恢复它们的状态。\n\
  \n### Java Bean API 及重要的类和接口\n\n- `Introspector` 类提供了接口和方法，如 `getBeanInfo(Class<type>\
  \ bean) throws IntrospectionException`。\n- `PropertyDescriptor` 类描述 bean 的属性。它支持如\
  \ `getName()` 等方法。\n- `EventSetDescriptor` 类描述了与 bean 相关的事件。它支持如 `getAddListenerMethod()`\
  \ 等方法，用于获取 bean 支持的所有监听器的名称。`getName()` 获取事件的名称。\n- `MethodDescriptor` 类提供了有关方法的数据，并支持如\
  \ `getMethod()` 等方法。\n\n通常，多个 beans 由程序员开发，而第三部分由开发者完成。为了在你的应用程序中重用它们，你需要了解这些属性。因此，这里提供了这些内容。我们可以将\
  \ Java beans 总结为：\n\n- Java beans 就像一个 Java 类。\n- Java beans 将具有属性。在这种情况下，只有 bean\
  \ 类必须具有 `get()` 和 `set()` 方法。\n- Java beans 必须是可序列化的。\n- 由于 beans 是服务器端编程的一部分，因此\
  \ bean 在客户端不需要是视觉组件。\n\n让我们尝试我们的第一个 bean 示例。在这个示例中，老师欢迎了全班。为此，他调用了 beans 的 adds\
  \ 方法，发送了自己的消息，并触发了 beans。这是一个传统的欢迎学生示例，在这里用于突出所涉及的步骤。要执行 beans 程序，你将需要良好的构建工具，如\
  \ NetBeans 6.1（可从网上免费下载）或支持 beans 组件的 eclipse 企业级版本。对于我们的示例，我们选择了 NetBeans 6.1。概念图如图\
  \ 24.6 所示。\n\n### 示例 24.20: Welcomebean.java 一个演示使用 NetBeans 和 Beans 组件的 Java Beans\
