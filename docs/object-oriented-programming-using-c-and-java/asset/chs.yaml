  \ {\n  16\\. if (radius < 0) area = 0; // 如果半径为负，面积 = 0\n  17\\. else area = FindArea(radius,PI);\
  \ // 调用函数。半径 & PI 是参数 // 我们将 FindArea() 返回的结果存储在 area 中。\n  18\\. // 输出结果\n  19\\\
  . cout<<”\\n Surface area of football :”<<area<<endl; //\n  20\\. /* 引号内的内容将原样显示在输出中。\\\
  n 意味着打印后留空\n  21\\. 我们在 while 语句内部。我们刚刚完成了面积的打印。\n  22\\. 我们接下来应该做什么？向用户询问下一个问题，即下一个半径。询问它.*/\n\
  \  23\\. cout<<”\\n Enter radius of the ball. To stop enter 0 for the radius \\\
  n”;\n  24\\. cout<<”\\n Radius = ? “;\n  25\\. cin>>radius;\n  26\\. }// // while\
  \ 结束\n  27\\. }// // main 结束\n  28\\. // 函数定义。在这里我们将我们 FindArea 函数的作用\n  29\\. float\
