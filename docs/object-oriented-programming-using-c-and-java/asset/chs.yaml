  10. `a`\n11. `d`\n12. `True`\n\n# 20 Java 中的错误、异常与多线程编程\n\n## 学习目标\n在本章结束时，你将能够：\n\
  * 理解 Java 的错误（Errors）和异常（exceptions）。\n* 理解它们产生产生以及如何处理它们。\n* 创建你自己的异常类。\n* 理解多线程编程中的底层概念。\n\
  * 理解同步（synchronization）。\n\n## 20.1 引言\n许多人可能在使用互联网或操作系统时遇到过一个弹出窗口，显示浏览器遇到了严重问题并需要关闭。事实上，发生了错误。尽管在交付前进行了详尽的测试，错误是无法避免的，但可以降到最低。在本章中，我们将学习\
  \ Java 处理错误和异常的机制。\n\nJava 一个重要且创新的特性是多线程编程。正如操作系统并发管理多个进程并调度 CPU 应处理的下一个进程一样，Java\
  \ 提供了多线程编程，我们可以创建多个线程并在程序员级别管理线程调度。其优势是多个线程进程可以同时运行，尽管它们的优先级不同。\n\n## 20.2 错误与异常\n\
  \n程序中出现的错误有三种类型：\n* **语法错误（Syntactical Errors）**：可以被编译器轻松检测并修正。\n* **逻辑错误（Logical\
  \ Errors）**：由于程序员对逻辑流的理解不当而产生。可以通过大量的测试来修正。\n* **缺陷（Bugs）**：程序员可以使用 `assert()` 宏和调试器来修复。\n\
  \n另一方面，异常是运行时发生的非正常状况，可能导致程序崩溃。异常可以分类为：\n\n#### 20.2.2.1 同步异常（Synchronous）\n同步异常是可预测的。例如，数组索引超出允许范围可以被轻松检测，因为此类错误只有在你执行涉及数组索引的语句时才会发生。同步异常发生在以下情况的任何一种或多种：\n\
  * 内存分配异常。\n* IO 处理异常。\n* 数学异常（如除零）。\n\n#### 20.2.2.2 异步异常（Asynchronous）\n异步异常是无法预测的。通常，程序所需的资源在程序开始时分配，并在运行时请求。因此，程序可能会超出初始分配。例如，考虑为数组分配内存。当此类异常发生时，我们需要一种机制将此类信息传递到分配资源的区域，以便我们采取纠正措施并防止程序崩溃。\n\
  \n#### 20.2.2.3 检异常（Checked Exceptions）\n被编译器检查的异常称为检异常。示例：`public static void main(String\
  \ [] args) throws IOException`。\n\n\n\n\n#### 20.2.2.4 检查异常 (Unchecked Exceptions)\n\
  \n`JVM` 在运行时检查的异常称为非异常。在 Java 中，所有的异常和错误都是对象。这些对象源自 `java.lang.Throwable` 包，如图 20.1\
  \ 所示。\n\n![异常类层次](img/477-1.png)\n\n**图 20.1** 异常类层次\n\n![异常处理机制中的 try 和 catch 块](img/477-2.png)\n\
  \n**图 20.2** 异常处理机制中的 try 和 catch 块\n\n#### 20.2.2.5 Java 中的异常\n\n异常可能发生的区域是分配资源或涉及输入输出编程的地方。这些异常列在表\
  \ 20.1 中。\n\n**表 20.1** Java 异常\n\n| Java 异常 | 备注 |\n| --- | --- |\n| 算术异常 (Arithmetic\
  \ Exceptions) | 除以零和其他数学异常 |\n| 数组下标越界异常 (ArrayIndexOutOfBoundsException) | 索引超出原始定义的维度\
  \ |\n| 文件未找到异常 (FileNotFoundException) | 文件不存在 |\n| IO 异常 (IOException) | 由 IO 语句引起\
  \ |\n| 空指针异常 (NullPointerException) | 引用空对象 |\n| 数字格式异常 (NumberFormatException)\
  \ | 当从数字转换为字符串失败时发生 |\n| 内存溢出异常 (OutOfMemoryException) | 超过内存限制 |\n| 栈溢出异常 (StackOverFlowException)\
  \ | 栈溢出 |\n| 字符串越界异常 (StringOutOfBoundsException) | 当超过字符串定义限制时发生 |\n\n#### 20.3\
  \ try 和 catch 块\n\nJava 会出一个异常对象。为了实现这一点，我们在任何可能出现异常的地方使用 `try` 块。跟随 `try` 块的 `catch`\
  \ 块捕获异常对象并采取补救措施。\n\n**示例 20.1：try 和 catch 块的使用。二维矩阵的内存分配**\n\n```\n 1\\. package\
