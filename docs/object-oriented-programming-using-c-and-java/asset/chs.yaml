  \ 13.8 Seekg()/Seekp() 和 Tellg() and Tellp() 函数在 C++ 功能\n\n在 C 语言中，你使用了 `fseek()`\
  \ 和 `ftell()` 来对文件中的读/写光标定位。在 C++ 中，我们将使用 `seekg()` 和 `seekp()` 来用于获取位置和定位位置。这是因为在\
  \ C++ 中，同一个流被同时用于输入和输出。\n\n`seekg()` 修改获取位置（get position），即我们可以从文件中读取的位置起始。\n\n\
  `seekp()` 修改写入位置（write position）。\n\n```cpp\ninfile.seekg(256); // 跳过 256 字节并将获取光标置于位置\
  \ 217\noutfile.seekp(1024); // 将写入光标置于字节位置 1025 处\n```\n\n另一方面，`tellg()` 和 `tellp()`\
  \ 函数告诉我们下一次读取和写入操作期间的位置。\n\n```cpp\nint pos = infile.tellg(); // 表示下一次读取操作的位置。\n\
  int pos = infile.tellp(); // 表示下次写入操作的位置。\n```\n\n**示例 13.9：io7.cpp 向文件写入学生对象并使用\
  \ Seekg()/Tellg() 的程序**\n\n```cpp\n#include<iostream>\n#include<fstream>\n#include<iomanip>\n\
  using namespace std;\nconst int max =3;\n//声明一个名为 Student 的类\nclass Student\n{\n\
  public:\n    Student() {}\n    ~Student() {}; // 默认析构函数\n    // 公有访问函数\n    void\
  \ GetData(void);\n    void DisplayData(void);\nprivate:\n    int rollNo;\n    char\
  \ name[20];\n    float mat,sci,eng,total,avg;\n};\nvoid Student::GetData(void)\n\
  {\n    cout << \"\\n Enter name : \";\n    cin >> name;\n    cout << \"\\n Enter\
  \ id No : \";\n    cin >> rollNo;\n    cout << \"\\n Enter <Maths , Science and\
  \ English> Marks :\";\n    cin >> mat >> sci >> eng;\n    total = mat+sci+eng;\n\
  \    avg=total/3.0;\n}\nvoid Student::DisplayData(void)\n{\n    cout << \"\\n Name\
  \ :\" << setiosflags(ios::left) << setw(20) << name;\n    cout << \"\\n Total :\"\
  \ << setprecision(2) << setw(20) << setiosflags(ios::fixed) << total << endl;\n\
  \    cout << \"\\n Average :\" << setprecision(2) << setw(20) << avg << endl;\n\
  }\nvoid main()\n{\n    Student std[2]; //两个学生对象\n    char filename[30];\n    int\
  \ ch,pos;\n    ofstream outfile(filename,ios::binary);\n    // ... 文件 I/O 逻辑继续 ...\n\
  }\n```\n\n## 13.9 总结\n\n1. IO 流是数据从一个设备到另一个设备的流动。例如，从输入设备到内存或从内存到输出。\n\n2. 从键盘输入和到控制台输出被称为标准输入和输出。\n\
  \n3. 有像插入运算符和提取运算符（`<<` 和 `>>`）与 `cin`, `cout` 等 IO 流对象工作。\n\n4. `>>` 表示的提取器提供了用户翻译以及对特殊字符（如空格、制表符和文件结束）的处理。\n\
  \n5. IO 流函数利用缓冲区来适应不同 IO 设备和计算机系统的速度。IO 流函数设置各种标志以告知用户流状态。\n\n6. 高级磁盘 IO 称为标准 IO/流\
  \ IO：缓冲区管理由编译器/操作系统完成。\n\n7. 低级磁盘 IO 称为系统 IO：缓冲区管理由程序员负责。\n\n8. 控制台 IO：所有的输入和输出函数都控制了输入的方式以及输出在屏幕等标准输出设备上的显示。\n\
  \n9. 控制台 IO 进一步分为格式化 IO 和非格式化 IO。\n\n10. 非格式化 IO 也称为低级 IO。它在所有其他 IO 机制中提供了最高的效率和吞吐量。与格式化\
  \ IO 不同，这里的输入没有自动的空格、制表符、回车检测和处理，而且数据没有格式化——程序员必须自行解释数据。\n\n\n\n\n\n# 16. 文件是记录的集合。记录是字段的集合。字段是数据的最小单元。字段可以是基本数据类型或用户定义或派生数据。\n\
  \n# 17. 顺序文件：所有记录按照输入顺序顺序存储。\n\n# 18. 随机访问文件：在此访问模式下，使用为此目的维护的索引来访问记录。\n\n# 19.\
  \ 直接访问文件：在此模式下，记录根据其相对于第一个记录的相对位置进行存储。\n\n# 20. 文件可以进一步分类为`文本文件`或`二进制文件`。通常在文本文件中，使用\
  \ ASCII 字符编码存储数据。在二进制文件中，数据以其在内存中的方式存储。因此，二进制模式节省内存。\n\n# 21. C++ 中文件处理所需的类都包含在\
  \ `fstream` 头文件中。因此，插入语句：`#include<fstream>`。\n\n# 22. 在 C++ 中，逻辑非已被重载，用于检查流文件的创建。\n\
  ```\nif(!infile) {cerr<<”n Sorry cannot open the file infile..”<<endl; exit(1);\
  \ }\n```\n在 C++ 中，一个名为 `ios::binary` 的标志将指定模式。\n\n# 23. 流操作模式用于控制流文件的打开模式。在通过构造函数创建对象时包含这些模式切换器。\n\
  \n# 24. `Seekg()` 改变获取位置（get position），即我们可以从文件中读取的位置。\n\n# 25. `Seekp()` 改变写入的位置。\n\
  \n# 26. 另一方面，`tellg()` 和 `tellp()` 函数告诉我们在下一次读取和写入操作期间的读/写位置。\n\n## 练习题\n\n### 单选题\n\
