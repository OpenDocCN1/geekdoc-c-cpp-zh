  \ Sq Units”<<endl;\n}/*Output:\narea of the circle with radius = 3 Center(1.5,2.5)=28.2857\
  \ Sq Units*/\n```\n\n观察我们使用的 `cout` 语句，`circ.GetCircleCenter()` 返回一个 `Point` 数据类型。通过这个\
