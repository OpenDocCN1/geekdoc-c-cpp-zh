  \n# 25. `RandomAccessFile`（随机访问文件）。对文件的访问可以从任何位置开始。它实现了 `DataInput` 和 `DataOutput`\
  \ 接口并继承自 Java 的基类 `Object`。\n\n# 26. 访问指示符是一种决定 `RandomAccessFile` 操作模式的模式。“r”表示只读，“rw”表示可读可写。\n\
  \n# 27. 有一个名为 `seek()` 的方法可用于设置文件中的当前位置。`seek()` 方法证明了“随机文件”的名字。`seek()` 的语法为：`void\
  \ seek(long pos) throws IOException`。\n\n# 28. 序列化是将对象存储到文件中。反序列化是序列化的逆过程，意味着将对象从文件到内存中的类对象。要序列化的文件必须实现一个名为\
