  \ `n` 处的元素删除所有元素 |\n| `int size()``element get(pos)``void set(pos,obj)` | 返回对象数量返回\
  \ `pos` 处的元素在位置处设置 obj |\n| `Object[] toarray()` | 将内容复制到数组 |\n| `InsertElementAt()`\
  \ | 返回包含 vector 中所有元素的对象类型数组 |\n\n**示例 17.13: VectorDemo.java: 演示 Vector 类使用的程序**\n\
