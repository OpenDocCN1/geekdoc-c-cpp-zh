  \ **第 19 行:** | 将 `stg` 和 `text` 拼接在一起。 |\n\n## 6.7 总结\n\n1.  C++ 由 Bjarne Stroustrup\
  \ 于 1979 年在贝尔实验室开发的。\n2.  这些额外功能包括虚函数、函数名和运算符重载、引用、空闲内存以及通过继承、模板等实现的关于重用性和扩展性的若干特性。\n\
  3.  异常处理和完善的标准模板库是 C++ 中提供的两个高级特性之一。\n4.  C++ 允许使用单行注释语句和多行注释语句。\n5.  使用 `namespace\
  \ std;` 是一种用于解决由于不同程序中使用相同名称引起的冲突的语句。\n6.  `>>` 和 `<<` 是 `iostream` 中的提取运算符。它们分别用于通过\
  \ `cin` 和 `cout` 进行数据的输入输出流操作。\n7.  `endl` 是一个引导编译器到新行的命令。\n8.  数组是一种派生数据类型，在内存中不同的连续位置存储相同数据类型的数据。\n\
  9.  结构体（Structure）可以存储不同类型的数据，并作为结构体实例的形式封装在一起。\n10. 类（Class）将拥有成员数据和成员函数。我们称之为属性和行为。一旦创建了类，我们就会创建一个类的实例，称为对象（object）。\n\
  11. 对象调用函数并相互作用以实现所需的结果。\n12. 控制台 IO（Console IO）意味着从标准输入设备（即键盘）获取输入，并输出到标准 IO 设备（即屏幕或显示器）。\n\
