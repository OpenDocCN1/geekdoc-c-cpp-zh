  \n### 22.6.2 使用多线程的多个客户端和服务器程序\n\n在现实生活中，会有多个客户端想要连接到服务器。例如，当成绩公布时，许多学生会急着连接。处理此类情况的最佳方法是将每个客户端放在单独的线程中。服务器可以通过新连接实现。用户向服务器发送一个数字，服务器返回\
  \ true 或 false 表示该数字是偶数还是奇数。\n\n**示例 22.8a：编写 Java 客户端-服务器程序——服务器使用线程处理多个客户端**\n\
  \n```java\npackage com.oops.chap22;\nimport java.io.*;\nimport java.util.*;\nimport\
  \ java.net.*;\npublic class MultipleClientServer {\n    public static void main(String[]\
  \ args) throws IOException {\n        try {\n            //服务器 socket\n        \
  \    ServerSocket servskt = new ServerSocket(4000);\n            int count = 0;\
  \ // 计数线程\n            while (true) {\n                //监听请求\n                Socket\
  \ clientskt = servskt.accept();\n                System.out.println(\"\\n 启动线程 \"\
  \ + count);\n                //通过调用 CommThread 类的构造函数创建一个新线程\n                CommThread\
  \ thrd = new CommThread(clientskt, count);\n                thrd.start();\n    \
  \            count++;\n            } //while 循环结束\n        } catch (IOException\
  \ e) {}\n    } //main 方法结束\n} //类定义结束\nclass CommThread extends Thread {\n    private\
  \ Socket clientskt; // 已连接\n    private int count; // 用于标记线程的计数\n    CommThread(Socket\
  \ s, int i) {\n        clientskt = s;\n        count = i;\n    }\n    public void\
  \ run() {\n        boolean evenodd = true;\n        try {\n            // 创建 BufferedReaderStream\
  \ 从客户端获取数据\n            bufrclient = new BufferedReader(new InputStreamReader(clientskt.getInputStream()));\n\
  \            //创建 PrintWriter 流向客户端发送数据\n            PrintWriter prwtr = new PrintWriter(clientskt.getOutputStream(),\
  \ true);\n            // 在连续循环中服务\n            while (true) {\n                //从客户端接收字符串数据\n\
  \                StringTokenizer stkn = new StringTokenizer(bufrclient.readLine());\n\
  \                //获取数字\n                int num = new Integer(stkn.nextToken()).intValue();\n\
  \                System.out.println(\"\\n 收到来自客户端的数字 \" + num);\n              \
  \  //检查奇偶性\n                if (num % 2 != 0) evenodd = false;\n               \
  \ else evenodd = true;\n                //将 evenodd 发送到客户端\n                prwtr.println(evenodd);\n\
  \                System.out.println(\"\\n 数字 \" + num + \" 是：\" + evenodd);\n  \
  \          }\n        } catch (IOException e) {}\n    }\n    // 注意：bufrclient 和\
  \ prwtr 在原始片段中缺少声明，此处已补充\n    private BufferedReader bufrclient;\n    private PrintWriter\
  \ prwtr;\n}\n```\n*（注：22.8a 的原始片段在 `CommThread` 类内部缺少了 `bufrclient` 和 `prwtr` 的声明；为了使代码有效并保持逻辑不变，已添加这些声明。）*\n\
  \n\n\n\n\n```java\npackage com.oops.chap22;\nimport java.util.*;\nimport java.io.*;\n\
  import java.net.*;\npublic class MultipleclientsClient {\npublic static void main(String[]\
  \ args)throws IOException {\n//socket to connect to server\nSocket skt = new Socket(“localhost”,4000);\n\
  // Create a BufferedInputStream to get the data from the server\nBufferedReader\
  \ bufrserver=new BufferedReader\n( new InputStreamReader(skt.getInputStream()));\n\
  //create buffer writer stream for sending data to server\nPrintWriter prwtr = new\
  \ PrintWriter(skt.getOutputStream(),true);\n//continuously send number and get grade\
  \ from the server.\nwhile ( true)\n{ Scanner scn= new Scanner(System.in);\n  System.out.println(“\\\
  n Enter number< 50595 to 50599>”);\n  int id = scn.nextInt();\n  // send id to server\n\
  \  prwtr.println(id);\n  // get even or odd from the server\n  StringTokenizer stkn\
  \ =new StringTokenizer(bufrserver.readLine());\n  System.out.println(“EvenOdd received\
  \ from server of “+ id + “ is :”+ stkn.nextToken());\n}}}\n```\n\n![image](img/541-1.png)![image](img/542-1.png)\n\
  \n### 22.6.3 从服务器下载文件的客户端/服务器程序\n\n很多时候我们需要下载位于服务器上的文件。解决的示例 4a 和 4b 显示了从远程服务器下载文件的技术。按照服务器端的惯例，我们需要一个服务器\
  \ socket 和一个特定客户端的 socket。然后我们需要 `BufferedReader` 来接收来自客户端的数据，以及 `DataOutputStreamReader`\
  \ 将数据发送给客户端。\n\n### 22.7 总结\n\n1. `java.net` 是一个支持网络程序的包，允许我们创建类 Unix  socket 以及\
  \ TCP/IP socket 的实现。\n2. 通过将这些流文件与网络协议绑定，你可以像向磁盘上写文件一样，向 Internet 上的文件写入内容并从 Internet\
  \ 上的文件中检索数据。\n3. 网络化是从我们的单机应用程序或 Applet 连接互联网的能力。`Network` 是计算机的集合，可以是同构的也可以是异构的。\n\
  4. `Internet` 是网络的集合或分组。我们可以说 Internet 是一个网络的网络，由数百万台计算机组成。这些计算机使用 Internet 协议相互通信。\n\
  5. `World Wide Web (WWW)` 是访问互联网上信息的一种。它使用 `HTTP` 在通信的计算机之间交换数据。\n6. 运行在 Internet\
  \ 上的计算机使用传输控制协议 (TCP) 或用户数据报协议 (UDP) 相互通信。\n7. 协议是一组规则，Internet 上的协作系统遵循这些规则，将数据从一个系统传输到另一个系统。\n\
  8. `TCP/IP`，即传输控制协议和网协议，是用于数据传输的标准协议。\n9. `TCP/IP` 是一个面向连接且可靠的服务。\n10. 面向连接意味着发送者确认接收者是否确实收到了数据。如果未收到，则会发生数据重传。\n\
  11. `TCP/IP` 是点对点的可靠通信，即它是一种确认服务，确保数据在接收端被正确接收。\n12. `TCP/IP` 有五层，即：应用层、传输层、IP 层、数据链路层和物理层。\n\
  13. 目的地址可以通过数字地址如 `192.127.68.24` 或域名名如 `[www.google.com]` 来指定。\n14. 域名服务器将地址从数字转换为网站名称，反之亦然。\n\
  15. 数据链路层接收来自 IP 层的 `Frame`（帧）并将帧分发到目标计算机。\n16. 网卡将 `IP` 地址映射为 48 位的唯一网卡识别码，并根据\
  \ `MAC` 协议进行传输。 \n17. `MAC` 协议简单地告诉我们网络上下一步将发生什么，即它告诉了多个帧共享单个传输介质的规则。\n18. `UDP`\
  \ 是一个无连接的服务。这意味着两个应用程序之间的通信是不有保证的。交付并不重要，也不被保证。它主要用于视频和音频等内容的传输。\n19. 我们可以使用 `java.net`\
  \ 包中的 `InetAddress` 类获取任何网站的 Internet 地址。`Inet` 类会抛出 `UnknownHostException`。\n20.\
  \ `URL connection` 是一个类，允许我们在传输之前检查属性。\n21. `Socket` 有唯一的标识码，也称为端口号，占用 16 位（2 字节）。\n\
  22. 使用 `ServerSocket` 类创建的是 `ServerSocket`，第二个是客户端 socket，称为使用 `socket` 类创建的 socket。\n\
