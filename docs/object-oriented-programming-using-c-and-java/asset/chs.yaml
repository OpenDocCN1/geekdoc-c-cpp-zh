  \   magnitude <r> :12.5Angle<t>53.13\n```\n\n### 18.7 垃圾回收 (Garbage Collection)\n\
  \nJava 对不再需要的对象自动释放内存。Java 使用自动垃圾回收器来管理内存。那么什么是自动垃圾回收器？\n\n垃圾回收器是一个运行在后台的软件程序，用于识别并清理死对象占用的内存空间。它遵循预定义的算法来判断哪些对象没有剩余引用（即它们不再被引用），并自动释放内存。这一过程会在程序空闲或没有足够的可用内存进行分配时发生。\n\
  \n### 18.8 Finalizer 和 `finalize()` 方法\n\nJava 运行时环境在对象释放之前会调用 `finalize()` 方法。一个对象可能持有多个资源，如窗口句柄和文件等。我们需要在对象释放之前释放这些资源。这项工作在垃圾回收器处理该对象时完成，它会自动调用\
  \ `finalize()` 方法。\n\n```\nprotected finalize() {//在此处编写所有用于释放软件的代码}\n```\n\n请注意，`finalize()`\
  \ 的执行时间是不确定的，因为只有当垃圾回收器调用它时才会执行，而垃圾回收器遵循随机算法来释放对象。`protected` 关键字确保了代码在类外不可用。\n\n\
  ### 18.9 Final 变量 (Final Variable)\n\n很多时候，我们需要变量来存储一个常量值，且该值在程序执行期间不会改变。这时，我们需要使用\
  \ `final` 修饰符。例如，考虑 `private final double` `PI` = `3.141517;`，这意味着我们声明了一个私有变量 `PI`，它持有类型\
  \ double 类型的数据 `3.141517`。我们希望这个值是常量，因此我们使用限定符 `final`。\n\n### 18.10 访问控制与类成员的访问\n\
  \n安全访问修饰符有 `public`、`private`、`protected` 以及默认修饰符 `package`。`protected` 修饰符适用于继承关系。\n\
  \n**Public（公有）：** 任何声明为 `public` 的成员函数和数据都可以在类成员函数之外访问。这意味着公有成员可以被任何其他代码访问。例如，我们将\
  \ `main()` 定义为 `public`，因为 Java 在程序外部调用了它。\n\n**package（包级/默认）：** 你可以从同一目录下的任何其他类访问它。注意，当未指定访问修饰符时，默认在包级别上是\
  \ `public`，但对包外的成员是私有的。我们可以直接引用这些默认或公有成员数据，而无需类中定义的公有函数帮助。\n\n**Private（私有）：** 声明为\
  \ `private` 的成员数据只能在类成员方法内部访问，数据对外部隐藏的。我们无法直接访问私有成员。相反，我们需要公有的访问器方法来访问这些数据。\n\n\
  **Protected（受保护）：** 声明为 `protected` 的成员数据和成员函数对外部是私有的，但对于具有 `inheritance` 关系的类的后类是公开的。你将在后续继承章节中学习更多内容。\n\
