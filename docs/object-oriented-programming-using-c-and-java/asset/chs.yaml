  18. c\n\n# 2 对象建模\n\n### 学习目标\n\n*在本章结束时，你应该能够：*\n\n* 理解对象建模。\n* 使用 UML 符号来指定对象和类、它们的符号、元模型以及强制性配置文件（mandatory\
  \ profiles）、元数据、元类等概念。\n* 学习使用 UML 的类图和对象图。\n* 理解 OOPS 语言中链接、层次结构、多态和抽象类的概念。\n\n\
  ## 2.1 引言\n\n对象建模涵盖我们在第 1 章中学习关于面向对象（OO）方法的所有元素。对象建模的原理是抽象、封装、模块化、层次结构、类型化、并发和持久化。\n\
  \n在传统的编程风格中，我们构思问题并将主任务划分为子任务，然后开发函数或方法来解决这些子任务。我们称这种范式为面向过程的风格。在这种范式中，过程是主导，被处理的数据存储在计算机内存的不同位置，称为代码区域。在对象建模中，对象将数据和作用于数据的函数封装为一个单一实体。为了满足用户的需求，专家以英文问题陈述的形式准备规范。为了分析这些规范，我们需要从对象（名词）和类的角度研究问题陈述中的词汇，以及领域中类之间的关系。\n\
  \n## 2.2 对象模型\n\nOO 语言中的基本构建单元是模块。什么是模块？模块可以定义为类和对象的逻辑集合。如果说函数是动词，那么对象就是名词。对象包含了函数和成员数据。面向对象方法论中的构建单元如图\
  \ 2.1\n\n**图 2.1** 面向对象编程方法论 – 模块\n\n我们观察到，我们的构建单元不是函数、过程或算法，而是类、对象以及它们之间传递的消息。从上图可以看出，单个对象负责自己的成员数据和一组功能。因此，对象存储数据，还存储更新数据和对存储数据进行必要计算所需的函数。此外，协作对象通过调用函数和在它们之间传递信息进行通信。\n\
  \n对象建模不仅关于单纯的对象和包含的数据。很多时候，系统需要定义不同对象所属数据之间的 `links` 以实现某些全局功能。对象模型必须包含类之间的关系以及属于类的数据。这将由类之间的继承关系决定。\n\
  \n对象之间的链接是消息调用。它们是发送给接收对象的请求，使用请求对象发送的参数执行其所属的函数。\n\n我们现在准备好将 OOP 编程定义为一组协作对象的集合，这些对象反而是类的实例。协作类具有由继承关系定义的层次结构关系。\n\
  \n## 2.3 面向对象设计\n\n在分析和设计结束，我们最终开发代码。代码具有由对象、类、对象之间的消息和链接，以及类之间的关联和关系组成的结构。\n\n\
  现在，如果我们的设计模型由与代码结构相同的图表组成，不是更好吗？更好的是，是否存在一种图形和图表语言可以将我们的结构转换为代码？答案是 UML。UML 支持两种类型的图。一组图描述的是结构，即互连和产生的拓扑结构。这组图也称为静态图。另一组图被称为动态图，描述的是在对象之间传递的消息。\n\
  \n**示例 2.1：�����学院管理示例 – 案例研究**\n\n在本节中，我们使用学院管理系统来解释对象建模的概念及其在 UML 中的实现。学院学术管理围绕学生、教师和课程展开。学院有系，系提供课程。学生注册教师提供的课程。\n\
  \n\n\n\n\n我们通过与大学管理相关的对象模型来解释对象建模，这些学生、教师、系主任（HODs）、课程、部门等参与者。我们以此作为一个贯穿示例学习面向对象编程（OOPS）概念，并在后续章节中处理\
  \ `C++` 和 `Java` 的细节。我们模型的基础是一个名为 `student` 的类。它包含了学号、姓名等信息。我们使用名为 `student` 的类，并在名为\
  \ `StudentMaster` 的数据库中存储学生信息。课程文件将包含注册了特定课程的学生的详情。所有此类课程都将属于某个系部门。运行 BTech、MBA\
  \ 和 MCA 等课程的大学也将成为一个校区的一部分。\n\n## 2.4 类与对象\n\n对象是一个包含数据和功能的实体。大学管理拥有关于学生、教师和所提供课程的数据。在\
  \ OOP 设计中，我们需要做出的决策是如何将数据和功能划分为具有意义的对象，使这些对象之间相互交互，并产生大学管理层预期的结果。\n\n脑海中浮出的第一个想法是名为\
  \ `student` 的对象。在大学里有很多学生，但他们都具有相同的功能和个人属性。因此，这些对象可以被分组为一个名为 `student` 的类。\n\n类是共享共同行为和属性的对象的集合。类定义描述了属性以及实现该行为的函数。\n\
  \n对象是一个包含属性、成员函数和标识的实体。共同属性和功能的对象被组合在一个类中。\n\n### 2.4.1 类\n\n类是对对象的描述或规范，而对象是在运行时创建的类的实例。一个类可以有一个或多个实例。在示例\
  \ 2.2 中，我们展示了学生类在 `C++`、`Java` 和 UML 中的抽象表示形式。\n\n**示例 2.2：C++ 中 Student 类的表示**\n\
  \n```cpp\nclass Student\n{ // 构造函数和成员函数\n     public:\n       Student(){rollNo=0,name=”No\
  \ Name”;}\n       Student(int n, char *p){rollNo=n,name=p;}\n       int GetRollNo()\
  \ const { return rollNo;}\n       void SetRollNo ( int n) { rollNo=n;}\n       char\
  \ * GetName() const { return name;}\n       void SetName( char *p) { name=p;}\n\
  \     private: int rollNo; char *name; // 成员数据及指向名称的指针\n};\n```\n\n**示例 2.3：Java\
  \ 中 Student 类的表示**\n\n```java\npublic class Student\n {private String name;\n  \
  \   private long rollNo;\n    public Student( String n , long r )\n     {rollNo=r;\
  \ name=n; }\n    public String GetName() { return name;}\n    public long GetRollNo()\
  \ { return rollNo;}\n}// 类结束\n```\n\n**示例 2.4：UML 中 Student 类的表示**\n\n![UML 中的学生类表示](img/22-1.png)\n\
  \n**图 2.2** UML 中的学生类表示\n\n### 2.4.2 符号与元模型\n\nUML 采用了符号和元模型。符号是建模语言的图形化表示和语法。另一方面，元模型是用于定义语言的严谨性和复杂性的类图。在下面的示例中，你将看到我们将使用\
  \ UML 符号以及涉及类图的元模型来解释泛化、特化等复杂性。幸运的是，我们可以在 `C++` 和 UML 中使用相同的表示。矩形框表示对象的类。类名位于顶部。在框的中间部分，列出每个对象包含的数据。在类框的第三部分，列出对象可以执行的操作（函数）。\n\
  \n### 2.4.3 强制性配置（Mandatory Profile）\n\n它定义了最小服务，即类应提供的功能。因此，类定义中包含一个构造函数以正确初始化对象是非常关重要的。这种初始化通过带有默认参数的参数构造函数来实现，以确保类属性正确且所需的初始化，并创建具有最小强制服务的对象。考虑下所示示例：\n\
  \n```cpp\nclass Student\n{// 构造函数和成员函数\n    public:\n       Student(){rollNo=0,name=”No\
  \ Name”;}\n      Student(int n, char *p){rollNo=n,name=p;}\n        int GetRollNo()\
  \ const { return rollNo;}\n        void SetRollNo ( int n) { rollNo=n;}\n      \
  \  char * GetName() const { return name;}\n        void SetName( char *p) { name=p;}\n\
  \    private: int rollNo; char *name; // 成员数据及指向名称的指针\n};\n```\n\n如果在创建对象时未提供参数，则使用默认构造函数指定的默认值来初始化对象。默认构造函数要求该类具有适当的行为。因此，我们为名称提供了“no\
  \ name”，为学号提供了 0。在程序的稍后部分，我们可以使用 `SetRollNo()` 和 `GetRollNo()` 函数来修改初始值：\n\n```cpp\n\
  Student std; // 创建了对象\nstd.SetRollNo(6060);\nstd.SetName(“Gautam”);\n```\n\n在上面的声明中，可以看到我们需要提供两个参数，即学生的学号和年龄。在没有正确初始化的情况下创建对象通常会导致许多错误和问题。因此，将默认构造函数作为强制性配置的一部分是一种良好的编程实践。\n\
  \n## 2.4.4 元模型（Meta Models）\n\n### 2.4.4 元类（Meta Class）\n\n在面向对象编程中，元类是由语言创建的类，所有其他用户定义的类都是该元类的实例。元类定义了用户定义类及其实例的行为。当你创建一个类的实例并将类方法添加到类中时，它们实际上被添加到元类实例中。这意味着你能够根据需要更改已创建实例的行为。在\
  \ Java 中，你创建的类是 `java.lang.Class` 的实例。然而，Java 不直接支持元类，但这里也存在一个 `java.lang.Class`\
  \ 的实例。我们可以使用 `java.lang.Class` 定义的方法：`getName()` 或 `newInstance()` 或 `getMethod()`、`getConstructor()`、`isArray()`、`getInterfaces()`。例如，可以通过调用对象的\
  \ `getClass()` 获取其类的描述。\n\n### 2.4.4.2 元数据（Meta Data）\n\n元类还持有元数据，称为属性，即属于元类的数据。元类允许类或包访问元数据。属性以标记脚本的形式在面向对象的语言中指定，元类能够在运行时读取并加载这些脚本，使得元数据对程序员可用。\n\
  \n\n\n\n\n- **安全性**：安全问题的出现是因为操作层面的用户能够利用某些并非原始规范组成的操作。这种漏洞可能在其他类层级的操作中无意中产生。修复这些漏洞的考虑标准见下文。\n\
  - **访问控制**：功能的细分必须确保只有特定的类或用户能够通过授权代码启动并使用该功能。\n- **数据完整性**：数据是首位的，子模块中不允许任何未经授权的访问。合适的加密技术可以解决这些问题。\n\
  - **用户行为控制**：必须指定类用户的正常行为，模块必须识别任何偏离此正常及设计流程的偏差，并拒绝对非意图操作的进一步利用。\n\n## 2.4.6 对象创建\n\
  \n一旦在运行时定义了一个类，我们就可以创建该类的实例，即对象。记住，对象是类的变量。因此，你可以像定义数据类型变量一样定义对象。在接下来的示例中，我们创建了一个名为\
  \ `std` 的普通对象，以及 50 个 `student` 类的实例，还创建了一个用于在堆堆内存上创建 `student` 实例的指针。\n\n**示例 2.5：在\
  \ C++ 中创建类对象**\n\n```\nStudent Std; // Std 是 Student 类的一个对象\nStudent Std[50]; //为\
  \ Student 类创建了 50 个实例\nStd.SetRollNo(8345); // 设置学号为 8345\n```\n\n**示例 2.6：在 Java\
  \ 中创建 Student 类对象并分配初始值**\n\n```\nStudent Std = new Student(757,“Anand”)// std 是\
  \ Student 类的一个对象\n757 是学号，Anand 是分配给该对象实例的名字。Std 是对象的名称。\n```\n\n**示例 2.7：在 UML\
  \ 中创建 Student 类对象并分配初始值**\n\n### 2.4.7 垃圾回收\n\n**垃圾回收**是对不再使用的内存进行自动检测和释放。当一个对象不再被任何其他对象引用时，它就可以进行垃圾回收。Java\
  \ 使用垃圾回收，而不是像 C++ 等其他面向对象语言中使用的显式析构函数。\n\n## 2.5 对象属性\n\n对象是一个拥有自己的数据结构和实现行为的功能实体。对象应该具备哪些基本属性？\n\
  \n**状态**：对象的实例是一个对象，在运行时创建，并由默认构造函数设置初始值。这些值对于该实例是特定的，并在对象的生命范围内通过对象内部定义的辅助函数随时更改（参见图\
  \ 2.3）。`757` 和 `Anand` 的值仅在该实例上有效，因此它们代表了对象的状态。\n\n![用 UML 表示的对象实例](img/25-1.png)\n\
  \n**图 2.3** 用 UML 表示的对象实例\n\n**行为**：对象的行为由类定义的功能决定。然而，尽管一个类可以有多个实例（即属于同一类的多个对象），所有这些实例都具有由类定义的相同行为。因此，我们没有在图\
  \ 2.3 中单独显示行为（即函数）。行为可以是以更新和修改成员数据的函数和方法，也可以是作为实现某些全局功能的接口的通用函数。这些函数由其他对象调用，接收参数并为其他对象提供服务。\n\
  \n**对象名称**：当对象被创建时，它带有一个名称。例如，`Std` 是 `student` 类实例的名称。这是对象的标识。\n\n```\n Student\
  \ Std; // C++ Std 是 Student 类的一个对象\n   Student Std = new Student(757,“Anand”)//\
  \ Java\n```\n\n**对象标识**：对象的每个实例与其他实例都不同，尽管它们包含相同的数据值。当对象被创建时，会分配内存资源。因此，唯一的 ID 是对象的内存地址。\n\
  \n**封装**：对象的成员数据被声明为私有，因此细节被隐藏且对外部不可见。在 C++ 和 Java 等面向对象的语言中，属性和方法的定义位于类定义内部，因此对外部不可见，从而向外部隐藏内部细节。这被称为封装。\n\
  \n## 2.6 链接\n\n我们已经学过对象建模不仅仅是孤立对象的集合。如图 2.4 所示，系统要求定义属于不同对象的数据之间的链接，以实现某些全局功能。这里三个属于三个不同类的三个不同对象：`batch`、`student`\
  \ 和 `Registration`。名为 `batch` 的类将拥有注册该批次所有课程的学生实例，例如机械专业第三个学期。在这里，只持有学生的学号，为了获取学生的详细信息，我们需要引用另一个名为\
  \ `Registration` 的对象。这意味着对于每个学生对象，我们需要维护一个到 `Registration` 对象的链接，以便我们引用它获取学生的详细信息。同样，我们需要维护一个名为\
  \ `batch` 的链接类，以便获取学生的批次详细信息。\n\n我们将照常地在 C++、Java 和 UML 中展示链接的实现。然而，作为一个提醒，C++ 和\
  \ Java 的示例需要理解这些语言的编程技能基础。因此，第一次阅读的读者可以跳过 C++ 和 Java 示例，只关注 UML；他们可以在获得必要的 C++ 或\
  \ Java 技能后重新回顾这些主题。\n\n**示例 2.8：C++ 中的链接**\n\n```cpp\nclass StudentMaster\n{  public:\
  \ StudentMaster(char *p, int n){name=p, rollNo=n;}\n     char * GetName() const\
  \ { return name;}\n     int GetRollNo() const { return rollNo;}\n   private: int\
  \ rollNo; char *name; // 指向名字的指针}; // 类结束\nclass Student\n    { public: Student(StudentMaster\
  \ *std ){ sm=std;}\n      char *GetName() const { return Sm->GetName();}\n     \
  \ private: StudentMaster *sm; };\nvoid main()\n{StudentMaster *sm = new StudentMaster\
  \ ( “Anand”,757);\n  Student * S1 = new Student(sm);\n  cout<<s1->GetName();}\n\
  ```\n\n**示例 2.9：Java 中的链接**\n\n```java\npublic class StudentMaster\n {    private\
  \ String name;\n          private long rollNo;\n        public StudentMaster ( String\
  \ n , long r)\n        {name=n; rollNo=r; }\n        public String GetName() { return\
  \ name;}\n        public long GetRollNo() { return rollNo;}\n   }// 类结束\n   public\
  \ class Student\n   { private StudentMaster sm;\n          public Student( StudentMaster\
  \ std)\n          { sm= std; } }// Student 类结束\n```\n\n从上面你可以清楚地看到，每当创建一个学生对象（即\
  \ `sm`）时，我们在 `StudentMaster` 中也创建一个它的引用。我们将展示如何创建这些链接：\n\n```\n StudentMaster sm\
  \ = new StudentMaster(“Anand”,757);\n      Student S1 = new Student(sm);\n     Student\
  \ S2 = new Student(sm);\n     ……………………………………………… 此类推，直到五门科目\n      Student S5 =\
  \ new Student(sm);\n```\n\n**示例 2.10：UML 中的链接**\n\n链接在 UML 中通过指向对象的箭头表示：\n\n![UML\
  \ 中的链接](img/28-1.png)\n\n**图 2.5** UML 中的链接\n\n## 2.7 类图\n\n\n\n\n\n类图提供了系统概览。它们展示了类及其与其他类之间的关系。它们是静态图。这意味着它们告诉我们类之间的交互情况，但没有告诉我们对这些交互的响应。我们将解释类图以及与图书订购系统建模相关的各种术语。类图展示了管理员如何通过提交订单向供应商采购，并在随后进行支付。支付方式可以是现金、支票或信用卡。另一方面，订单包含书籍详情（参见图\
  \ 2.6）。在随后的章节中将对上述类图和概念进行详细解释。\n\n![大学图书馆采购系统类图](img/28-2.png)\n\n**图 2.6** 大学图书馆采购系统类图\n\
  \n## 2.8 类层次 (Class Hierarchy)\n\n为了体现类之间的关系和依赖关系，我们需要将类组织成层次结构。\n\n### 2.8.1 关联\
  \ (Associations)\n\n关联是层次结构的一种，显示了类之间独立且地位平等的关系。这些关系通过类之间的线表示；通常用关联名称命名。关联中的类通常在层次结构中占据相等的位置。例如，在图\
  \ 2.6 中，管理员和订单是独立的类。\n\n**多重性 (Multiplicity):** `order` 类处的 `0..*` 表示管理员可以下无限数量的订单，即从\
  \ 0 到未指定的数量。`0…1` 表示 0 到 1。同样，我们也可以将学生可以借阅书籍的最大数量规定为 `0…4`，如图 2.8 所示。\n\n![类之间的关联。关联命名为：ordering](img/29-1.png)\n\
  \n**图 2.7** 类之间的关联。关联命名为：ordering\n\n![关联 0…1](img/29-2.png)\n\n**图 2.8** 关联 0…1\n\
  \n学生可以借 0 到多本书。\n\n一本书最多可以被 1 个学生借（参见图 2.6）。上述所示的导航性（navigability）暗示了关联的方向以及谁拥有关联的实现。导航性告诉我们，可以通过查询\
  \ `DeptOrder` 找到书籍详情。另请注意，`DeptOrder` 是关联的所有者。\n\n### 2.8.2 相互依赖类的层次结构\n\n层次结构有两种类型：\n\
  \n*   **整体/部分层次结构 (Whole/part of hierarchy)。** 在这种层次结构中，一个类包含在另一个类中。这种关系被称为**拥有\
  \ (has a)** 关系。此外，整体/部分层次结构中有两个子类型，如下：\n\n*   **聚合 (Aggregation)。** 在这种类型中，对象不是固定的。它们可以被包含或移除。例如，考虑图\
  \ 2.9 中的示例。一个部门拥有一些类，类包含一些学生。聚合意味着**“部分”(part of)** 关系。\n\n![聚合关系。学生是类的一部分，即部门的一部分](img/30-1.png)\n\
  \n**图 2.9** 聚合关系。学生是类的一部分，即部门的一部分\n\n在涉及整体/部分的类层次结构中，部分是必不可少的，就像书的情况。书没有页面无法存在，客运火车没有车厢无法存在，等等。在图\
  \ 2.9 中，类没有学生无法存在。因此，它被显示为实心菱形。一个类包含 1 到多个学生，而一个部门可以没有类，即空部门。因此，它被显示为空心菱形。\n\n*\
  \   **组合 (Composition)。** 这是另一种整体/部分类型的层次结构。在这种类型中，对象是整体或整体中不可或缺的部分。例如，人类有心脏；计算机内部有一个微处理器。组合意味着“拥有”(has\
  \ a) 关系，即整体对象包含一个部分。\n\n聚合用指向整体类的**空心菱形**连线表示，而组合则使用**实心菱形**。实现整体/部分层次结构的一种方法是在定义容器类时，简单地将聚合对象的实例声明为一个属性：\n\
  \n**示例 2.11：C++ 和 Java 中容器类的示例**\n\n```cpp\nclass Date\n{public:\n     Date ( int\
  \ d=0, int m=0,int y=0) :dd(d),mm(m),yy(y) { } // \n构造函数\n    void SetDate( int\
  \ d, int m, int y){ dd=d,mm=m,yy=y;}\n     int GetDD() const { return dd;}; int\
  \ GetMM() const { return \nmm;};\n    int GetYY() const { return yy;};\n  private:\
  \ int dd; int mm; int yy;\n};\nclass Student\n{ public:\n   Student();\n   ~Student(){};\
  \ // 默认析构函数\n    int GetRollNo() const { return rollNo;}\n    void SetRollNo ( int\
  \ n) {rollNo=n;}\n    Date GetDOB() const { return dateDOB;}\n    Date GetDOJ()\
  \ const { return dateDOJ;}\n   void SetDOB(Date dtb) {dateDOB=dtb;}\n   void SetDOJ(Date\
  \ dtj) {dateDOJ=dtj;}\n  private: int rollNo; Date dateDOB; DateDOJ;\n};\n```\n\n\
  在上面的示例中，我们定义了一个 `Date` 类，它有自己的成员变量和函数。`Date` 类具有 `dd`、`mm`、`yy` 私有属性。现在名为 `Student`\
  \ 的类具有出生日期和入职日期的实例。\n\n### 2.8.3 独立类的层次结构\n\n此类别的类具有“是”(is a) 关系，也被称为**泛化/特化 (generalization/specialization)**。在面向对象编程语言中，该性的实现机制是继承。例如，我们在图\
  \ 1.5 中建模了人类层次结构。UML 使用空心箭头 ![image](img/31-3.png) 表示继承关系。\n\n我们在图 2.10 中展示了继承关系，四轮车和自行车继承自\
  \ `Automobile`。基类在文献中被称为 Super 类。我们在处理 Java 和 UML 时在 C++ 中使用 Super。派生类可以通过添加新属性以及选择性地**重写\
  \ (overriding)** 基类的现有属性来扩展 `Super`。例如，父亲(Super) 通过陆路从 A 地到 B 地，而儿子(子类) 通过空中从 A\
  \ 地到 B 地。\n\n![继承层次结构](img/31-1.png)\n\n**图 2.10** 继承层次结构\n\n![多重继承——多个父类类](img/31-2.png)\n\
  \n**图 2.11** 多重继承——多个父类类\n\n如果一个类派生自多个父类，则称为多重继承。Java 不支持多重继承，而 C++ 支持。从多个父类继承属性和特性时可能会产生困惑和歧义。Java\
  \ 通过引入接口 (interface) 概念解决这一歧义问题，而 C++ 则通过显式函数调用。在 Java 接口中，类将使用名为 **实现 (implements)**\
  \ 的 Java 规范，允许类实现接口所需的代码。你将在语言细节中学习更多这方面的内容。\n\n**示例 2.12：C++ 中多重继承的示例**\n\n```cpp\n\
  class Student\n{ public:\n      ……….. class declaration here………..\n  private:\n\
  \ };\nclass Athlet\n{  public:\n      …….. class declaration here.: };\nclass Professional\
  \ : public Student, public Athlet\n{ public:\n      …….. class declaration here.\
  \ ……………..\n private:\n};\n```\n\n\n\n\n对象图显示了类图的实例。在本示例中，请考虑学院部门结构。一个类可以包含若干个部门。工程学院的一个部门下可以包含许多个部门。图\
  \ 2.12a 显示了一个名为 `department` 的类图。一个部门也可以包含许多子部门。例如，像电气工程这样的部门可以拥有电子系和通信系等子部门。我们可以说，一个部门是子部门的集合。这在\
  \ UML 中是聚合（aggregation）的表示，用菱形符号标出。\n\n![部门包含 0 到多个子部门 – 聚合](img/32-1.png)\n\n**图\
  \ 2.12a** 部门包含 0 到多个子部门 – 聚合\n\n在图 2.12a 中显示的自循环描绘了聚合。它表示 `department` 可以包含 0 到\
  \ * ，这意味着 0 到多个子部门。这些部门被包含在 1 个 `department` 实例中。因此，请观察用于指示聚合的菱形。在图 2.12b 中显示的对象图实例化了类图，用一个具体的示例替换了它。\n\
  \n![显示部门包含多个子部门的对象图](img/32-2.png)\n\n**图 2.12b** 显示部门包含多个子部门的对象图\n\n## 2.10 通信与消息传递\n\
  \n在今天的技术中，程序的执行不再仅仅是逻辑编程步骤的执行。大多数 GUI 程序必须响应来自鼠标、传感器等外部单元的信号。但问题是，谁来监控外部单元的触发？是用户编写程序还是操作系统？答案是操作系统监控来自外部单元的信号并将信号发送给我们的程序。我们的程序将有一个接口，用于接收、解释并对操作系统发送的信号采取必要的行动。事实上，整个\
  \ Windows 和其他现代操作系统都是通过这种消息传递机制来实现任务的。\n\n协作对象之间还有其他通信方式。对象之间发送和接收消息。发送消息通过调用属于另一个对象的函数并传递参数来实现。接收消息意味着当前对象的函数被另一个对象调用了。因此，对象可以响应来自操作系统和其他对象的发送消息。\n\
  \n## 2.11 多态\n\n我们已经理解了在继承关系中，子类继承了父类的方法和属性。在继承中，子类可以扩展并简单地使用基类的功能，也可以用完全不同的函数实现来实现自己的功能。我们将这种特性称为重写（overriding）基类函数。\n\
  \n我们在图 2.13 中展示了一个人类层级结构。所有人都必须工作，因此 `human` 类定义了一个名为 `Work()` 的函数。所有人都要 `Work()`，但像\
  \ `student` 这样特殊的类（作为 `human` 的子类）必须在大学、图书馆和实验室工作。因此，你会发现 `student` 用它自己特有的 `Work()`\
  \ 方法重写了基类函数 `Work()`。此外请观察到，`CSESTUDENT` 想要使用（继承）与它的基类 `student` 相同的 `Work()`。因此，它没有定义自己的版本，因此基类函数\
  \ `Work()` 对它可用。另一方面，`ECESTUDENT` 可能需要在硬件实验室工作，因此它用自己的实现重写了基类的 `Students Work()`。\n\
  \n![多态的体现：ECE 学生有自己的工作：CSE 学生使用 Student Work() 工作，因为 CSESTUDENT 没有重写](img/34-1.png)\n\
  \n**图 2.13** 多态的体现：ECE 学生有自己的工作：CSE 学生使用 Student Work() 工作，因为 CSESTUDENT 没有重写。\n\
  \n当有多个子类实现同一个函数时，调用正确派生类的正确函数是至关重要的。也就是说，在运行时，必须通过函数调用来调用正确的函数。确保这种函数正确运行时绑定的特性称为`动态绑定`（dynamic\
  \ binding）。多态意味着确保基类对象按照计划以正确的方式运行。例如，`CSESTUDENT` 必须使用 `Students Work()`，而 `ECESTUDENT`\
  \ 必须使用它自己的 `Work()`，以此此类推。\n\n## 2.12 抽象类\n\n在设计 OO 系统时，我们可能需要一个完全没有函数实现的基类。该基类将只有函数名称而没有这些函数的实现。然而，源自此基类的派生类将重写基类函数，每个被重写的函数将有其自己的实现。多态和动态绑定特性将确保根据用户需求，将属于适当对象的正确方法链接到函数调用上。Java\
  \ 的接口特性就是抽象类。在 C++ 中，具有纯虚函数的基类可以被视为抽象类。抽象类由于没有实现的函数，因此无法实例化对象。\n\n## 2.13 具体类\n\n\
  与抽象类相反，具体类实现了它其中声明的所有函数和方法。因此，具体类是一个可以实例化对象或对象实例的类。在图 2.13 中，`student` 类是一个具体类。\n\
  \n### 2.13.1 OOPS – 对象建模案例研究\n\n我们将进行详细的建模练习，以巩固我们学到的关系。我们将学习与学院、部门、学生及相关的学院管理系统，如图\
  \ 2.14 所示。有两个主类：`Person` 和 `Dept`。这两个是超类（基类），持有所有人和部门共有的属性，如人或部门的名称、学院代码以及所有其他相关数据。`Student`\
  \ 和 `staff` 是源自超类 `person` 的子类，是一种特殊的人。它包含了特殊的属性，如身份号、地址、部门代码和其他相关数据。这种关系是继承，并用符号表示。\n\
  \n（注：正文继续如下）\n\n**聚合**由一条指向整体类的空心菱形线表示。一个部门拥有一些类，这些类拥有一些学生。聚合意味着“部分”关系，显示为 `![image](img/35-2.png)`\n\
  \n**组合**则使用实菱形。在这种类型中，对象是整体整体或不可或缺的一部分。组合意味着“拥有”关系，即整体对象包含一个部分，在 UML 中显示为 `![image](img/35-3.png)`。在图\
  \ 2.14 中，该类拥有 0…60 个学生。该类由学生组成。类为了操作学生所需的任何方法将在类中实现，这些方法对类的任何派生类可用。\n\n\n\n你可以观察到\
  \ `EngineeringDept` 派自 `Super Dept` 并且是一个专门部门。它将具有工程部门特有的额外信息，例如专业领域、资源人员以及指向属于部门学生的链接。查看\
  \ `CourseOffering` 类。它实现了学生与 `EngineeringDept` 之间存在的课程开设关系。此外还观察到 `CourseOffering`\
  \ 也是学院的一部分，学院是所有提供课程的工程部门的列表。学院还需要其他对象来跟踪已开设的课程。进一步名为 `CourseOffering` 的类可以具有额外的功能，例如跟踪某个学生被提供过哪些课程。`CourseOffering`\
  \ 类还可以跟踪正在运行的课程和/或已经结束的课程。请注意，我们定义了一个名为 `CourseOffering` 的类来管理 `EngineeringDept`\
  \ 和学生之间的关联关系。UML 中的虚线 ------------ 表示了上述描述的关系。上述在图 2.14 中所示的关联意味着，一个学生可以由一个 `EngineeringDept`\
  \ 提供 1…6 门课程，这些课程由 `CourseOffering` 类跟踪和监控。学院与 `EngineeringDept` 之间的关系是聚合。我们可以说\
  \ `EngineeringDept` 是学院的一部分。\n\n## 2.14 总结\n\n1. **模块 (Module)**：面向对象语言中的基本构建块是模块。模块可以被定义为类和对象的逻辑集合。模块不是函数、过程或算法，而是类、对象以及它们之间传递的消息。\n\
  2. **面向对象 (Object orientation)** 是一种基于对象在软件中对现实世界系统进行建模的技术。\n3. **面向对象编程 (OO programming)**\
  \ 是组协作对象的集合，这些对象反而是类的实例。协作类之间通过继承关系定义了层次关系。\n4. **面向对象语言 (OOP language)** 意味着：对象、类、继承。\n\
  5. **类 (Class)**：类是一组共享共同行为和属性的对象集合。类定义描述了属性以及实现行为的功能。\n6. **强制性配置 (Mandatory profile)**：这定义了最小服务，即类应提供的功能。\n\
  7. **对象 (Object)** 是一个包含属性、成员函数和标识的实体。具有共同属性和功能的对象被分组在一个类中。对象的行为由类定义定义的功能决定。\n8.\
  \ 对象的唯一标识是该对象的内存地址。\n9. **封装 (Encapsulation)** 是通过如 `private` 和 `protected` 等访问修饰符从外部世界隐藏对象所有内部细节的过程。\n\
  10. **链接 (Link)** 链接属于不同对象的数据以实现某些全局功能。链接在 UML 中用指向对象的箭头表示。链接也是关联的实例。\n11. **类图\
  \ (Class diagrams)** 提供了系统概览。它们显示了类以及它们与其他类之间的关系。它们是静态图。这意味着它们告诉我们类类类交互，但没有告诉我们对这些交互的响应。\n\
  12. **层次结构 (Hierarchy)**：类的排序。最常见的面向对象层次结构是继承和聚合。\n13. **关联 (Association)** 是一种层次结构类型，显示了类之间独立且地位平等的关系。关联是两个或多个类之间的关系。\n\
  14. **多重性 (Multiplicity)**：一种量化对象之间关联的属性。\n15. **整体/部分层次结构 (Whole/part of hierarchy)**：在这种层次结构中，一个类被包含在其他类中。这种关系被称为**拥有\
  \ (has a)** 关系。\n16. **聚合 (Aggregation)** 意味着“部分”关系。一个聚合对象拥有其他对象。其他对象是聚合对象的一部分。聚合由一条指向整体类的**空心菱形**的线表示\
  \ ![image](img/36-1.png)。\n17. **组合 (Composition)**：这是聚合的一种特殊情况，整体没有部分就无法存在。组合使用实心菱形\
  \ ![image](img/36-2.png)。\n18. **具有独立类的层次结构 (Hierarchies with independent classes)**：此类类别下的类具有\
  \ `is a` 关系，也被称为**泛化/特化 (generalization/specialization)**。\n19. **继承 (Inheritance)**\
  \ 指定了**是 (is)** 它们的关系。基类被称为**超类 (superclass)**。派生类也称为子类 (subclass)。继承在 UML 中用符号\
  \ ![image](img/36-3.png) 表示。\n20. **派生子类 (Derived subclass)** 不仅继承父类的属性，还可以扩展和修改它的行为和属性。\n\
  21. **对象图 (Object diagram)** 显示类图的实例。\n22. **动态绑定 (Dynamic binding)**：当有多个子类实现一个函数时，调用正确派生类的正确函数是至关重要的。也就是说，在运行时必须通过函数调用调用正确的函数。确保这种函数正确运行时绑定的特性称为**动态绑定**。\n\
  23. **多态性 (Polymorphism)** 意味着确保基类对象正确且按计划地运行。\n24. **抽象类 (Abstract class)**：这是一个完全没有函数实现的基类。然而，自此基类的派生类将重写基类函数，每个被覆盖的函数将有自己的实现。Java\
  \ 的接口特性就是抽象类。在 C++ 中，具有纯虚函数的基类可以被视为抽象类。\n25. 抽象类由于没有已实现的函数，因此不能实例化对象。\n26. **具体类\
  \ (Concrete class)** 是可以实例化对象或实例对象的类。\n\n## 练习题\n\n## 选择题\n\n1. **关于面向对象语言，以下哪些陈正确的？**\n\
