  \   4\\. OurOwnException(){} // 默认构造函数\n   5\\. OurOwnException(String stg){super(stg);}\
  \ // 带参数的构造函数\n   6\\. }// end 自定义异常\n   7\\. class OwnException1{\n   8\\. public\
  \ static void main(String[] args) {\n   9\\.  double credits = 20000.00;\n   10\\\
  .  double debits = 19900.00;\n   11\\.  try{\n   12\\.  if ( ( credits-debits)<1000.00\
  \ )\n   13\\.  throw new OurOwnException(“Sorry Transaction can not be processed.\
  \ Bal is <1000.00”);\n   14\\.  else\n   15\\.  System.out.println(“Transaction\
  \ sucessful”);\n   16\\.  }catch(OurOwnException e)\n   17\\.  {System.out.println(“Inside\
  \ a catch block- OurOwnException”);\n   18\\.  System.out.println(e.getMessage());}\n\
  \   19\\.}//end of main\n   20\\. }// end of ownException1\n   OUTPUT : Inside a\
