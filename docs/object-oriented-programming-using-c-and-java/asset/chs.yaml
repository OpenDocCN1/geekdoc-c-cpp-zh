  \ // x & y 是两个字符串\n  cout<<”enter any 2 strings\\n»;\n  cin>>x>>y; // 用户输入两个字符串\n\
  \  Concat(x,y); // 函数调用\n}// main 结束\nvoid Concat(char a[],char b[]) // 函数定义\n{\
  \ for(int i=0;a[i]!=’\\0’;i++) // 检查‘\\0’的出现\n       cout<<a[i];\n  cout<<» «;\n\
  \  for(i=0;b[i]!=’\\0’;i++)\n        cout<<b[i];\n} // concat 函数结束\n// 输出：enter\
  \ any 2 strings HELLO BROTHER : HELLO BROTHER*/\n```\n\n\n\n\n学习编程最好的方法就是编写程序。让我们编写自己的代码来实现上述功能。相关问题和解决方案位于本章末尾的示例部分。\n\
  \n## 8.14 总结\n\n1.  函数有助于将主任务分解为更小的模块。调用函数是调用其他函数的，被调用函数是被调用的函数。\n\n2.  函数原型在全局区域声明，即\
  \ `void main ()`，这样所有其他函数都可以访问它。\n\n3.  函数处理所有数据类型。一个函数根据运行时提供的参数，可以为所有数据类型执行操作。\n\
  \n4.  调用函数与被调用函数之间的数据传递模式，通过将列为参数的变量复制到被调用函数的栈区域，随后由被调用函数将结果复制到主函数的栈区域并返回给调用函数，这种方式被称为`值传递`\
  \ (`call by value`)。\n\n5.  在引用传递中，我们向函数传递地址。一旦函数通过引用接收到数据项，它就会对数据项进行操作，对数据项所做的更改也会反映在调用函数中。\n\
  \n6.  当我们希望防止值被接收函数修改时，使用常量引用传递。\n\n7.  递归意味着函数调用自身。\n\n8.  内联函数意味着 C++ 替换整个函数代码，而不是诉诸于通常函数处理机制。\n\
  \n9.  函数重载意味着一个函数根据运行时提供的参数执行多个任务。\n\n10. 如果没有为函数参数提供值，函数将采用默认选项。我们必须从左到右提供默认参数。\n\
  \n11. 声明为 `static` 的变量存储在连续的内存位置中。静态区域的唯一特殊之处是，即使函数终止，该静态区域中的变量也不会被擦除。\n\n12. 在为上述所有存储类分配了强制性空间后，剩余的内存称为堆内存或空闲空间。但对该空间的访问只能通过指针实现。\n\
  \n13. 使用 `extern` 的声明和定义即使对于使用不同文件名单独编写的程序（只要它们与 `main()` 程序一起编译和链接）来说也是可用的。\n\n\
