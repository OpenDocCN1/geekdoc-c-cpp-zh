  \ 从生物中继承了特性。专业人士、学生和运动员派自 `Human`。我们说这三类继承了 `Human`。`Human` 类被称为基类，而 `Student` 和\
  \ `Athlete` 称为派生类。什么可以被继承？成员函数和成员数据都可以被继承。你注意到表示继承关系的`箭头方向`了吗？根据建模语言规范，它是指向向上的。\n\
  \n![Inheritance hierarchy](img/266-1.png)\n\n**图 12.1** 继承层次结构\n\n继承规定了一种“是”类型的关系。观察发现\
  \ `Student` 是一个 `Human`。同样，`Mammal` 是 `Animal`。`Human` 是`基类`，`Student` 是`派生类`。从基类派生是实现“是”类型关系的技术。我们何时使用继承？继承是为了能够从基类派生所有的功能和成员数据，并且派生类可以添加自己的专门或个性化的功能。例如，`Athlete`\
  \ 继承了 `Human` 的所有功能和属性，并额外添加了自己的运动和体育功能及属性。\n\n**示例 12.1：继承的语法**\n\n```cpp\nclass\
  \ Human\n{ public:\n   protected: // 声明为 protected 的变量对\n   派生类公开的\n// protected\
  \ 变量\n};\n// Student 继承自 Human，继承类型为 public\n   class Student : public Human\n{\
  \ public:\nprivate:\n};\n```\n\n注意，声明为 `private` 的成员对派生类是不可见的。如果你将这些成员数据设置为 `public`，那么安全性就会受到。那么解决办法是什么？将成员数据声明为\
  \ `protected`。受保护变量意味着这些变量对派生类是公开的，而对其他类是私有的。\n\n如果公共成员函数拥有对象，即对象调用了该成员函数，那么该函数就可以访问`所有公共成员函数和公共成员数据`。`类的公共函数可以访问其所属类所有的私有成员数据和成员函数，以及其基类的受保护成员数据和成员函数`。\n\
  \n**示例 12.2：显示派生类和基类的继承 inherit1.cpp 程序**\n\n```cpp\n1\\. #include <iostream>\n\
  2\\. using namespace std;\n3\\. class BaseClass\n4\\. { public:\n5\\. void SetBase(int\
  \ a, int b) { length = a; bredth = b; }\n6\\. void DisplayBase(){ cout <<”length:”<<length\
  \ << “ : <<”bredth:”<<bredth <<endl; }\n7\\. protected:\n8\\. int length, bredth;\n\
  9\\. };\n10\\. // public inheritance\n11\\. class DerivedClass : public BaseClass\n\
  12\\. { public:\n13\\. DerivedClass(int x) { height = x; }\n14\\. void DisplayDerived()\
  \ { cout <<”Height:” << height <<endl; }\n15\\. private:\n16\\. int height;\n17\\\
  . };\n18\\. void main()\n19\\. { // 创建一个派生类对象 briefcase height=20\n20\\. DerivedClass\
  \ briefcase(10);\n21\\. briefcase.SetBase(25,30); // 访问基类的成员\n22\\. cout<<”\\naccess\
  \ & display member of base class”<<endl;\n23\\. briefcase.DisplayBase(); // 访问基类的成员\n\
  24\\. cout<<”\\nAccess & display members of derived class”<<endl;\n25\\. briefcase.DisplayDerived();\
  \ // 使用派生类的成员\n26\\. }//end of main\n/*Output: access & display member of base class\
  \ : length:25 : bredth:30\nAccess & display members of derived class : Height:10\
  \ */\n```\n\n| **第 11 行** | 基类扩展，即派生自基类 |\n| :--- | :--- |\n| **第 20 行** | 创建了一个派生类对象\
  \ briefcase Height=10 |\n| **第 21 行** | DC, briefcase 访问 BC 并设置了长度和宽度 (Bredth) |\n\
  | **第 23 & 25 行** | briefcase 显示了基类和派生类的数据 |\n\n## 12.3 继承的类型\n\n继承意味着从基类派生出后代类的能力。那么我们可以通过多少种方式来实现呢？我们将用\
  \ `BC` 表示基类，用 `DC` 表示派生类。\n\n**单继承：**图 12a。`DC` 派生自基类。\n\n![Single inheritance](img/268-1.png)\n\
  \n**图 12.2a** 单继承\n\n**多继承：** 在图 12.2b 中显示了多继承。注意子类 `DC` 继承自 `DC2` 且继承自 `DC1`。基类是虚拟的，因为\
  \ `DC1` 和 `DC2` 只有一个基类，但每个派生类都认为它有自己自己的基类。因此，使用了“virtual”一词。因此，我们也可以将这种继承称为虚基类继承。\n\
  \n![Multilevel inheritance](img/268-2.png)\n\n**图 12.2b** 多层继承（注：此处标签可能有误，对应图示应为多继承）\n\
