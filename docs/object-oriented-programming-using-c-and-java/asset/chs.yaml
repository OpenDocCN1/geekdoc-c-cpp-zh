  \n### 课作业题\n\n30. 为动物界编写继承层级结构。\n31. 用合适的例子解释多态。\n32. 用合适的例子解释泛化和特殊化。\n33. 用合适的例子解释聚合和分离。\n\
  34. 解释各种类型的继承。\n35. 你在什么时候使用继承？在什么情况下使用接口？\n\n### 单选题答案\n\n1. 错误 (False)\n2. 正确\
  \ (True)\n3. b\n4. c\n5. a\n6. a\n7. b\n8. b\n9. a\n\n\n\n对象是动态实体。它们在程序执行期间，根据程序的需求在运行时创建。我们称这种对象的创建为实例化。构造函数完成这项实例化工作，并为类实例的属性分配初始值。对象具有属性和行为。对象可以通过传递消息与其他对象进行通信。对象通过类中定义的\
  \ `get` 和 `set` 函数向其他对象传递其状态信息。返回属性值的 `get` 函数也称为存取器（assessors）。允许修改属性的 `set` 函数也称为修改器（mutators）。\n\
  \nJava 中的对象使用引用来唯一标识对象的实例，而 C++ 则使用指针和引用。\n\n一旦对象完成了分配给它的角色，就必须从内存中删除，以便将释放的内存动态地分配给其他对象。这在\
  \ Java 中通过通过垃圾回收器（garbage collector）实现。垃圾回收器是由 Java 运行时系统启动的程序，用于移除不再需要的对象。在 C++\
  \ 中，程序员可以通过使用 `delete` 函数显式地删除对象。\n\n## 4.3 统一建模语言 – 一种 OOAD 工具\n\n### 4.3.1 UML\
  \ 概述\n\n统一建模语言（UML）在面向对象的分析和设计（OOAD）方法论中作为图形化工具，用于对开发中的软件系统进行建模。\n\n我们何时需要建模？\n\n\
  * 当我们对系统进行建模并研究其行为时。\n* 当我们进一步希望模拟系统并研究其性能和操作时。\n* 当正在开发的系统非常复杂且并非琐事时。\n* 当软件系统的开发成本高到无法接受时。\n\
  \n我们在建模系统中寻找什么？\n\n* 它应该紧密遵循我们选择的开发模型，例如瀑布模型。\n* 它在本质上应该是图形化的。\n* 它应该对软件开发周期的各个方面进行建模。\n\
  * 它应该能够所有流行且广泛接受的对象对象技术理论，例如格拉迪·布奇（Grady Booch）、詹姆斯·兰博霍（James Rambaugh）和伊瓦·雅各布（Ivar\
  \ Jacobson）的理论。\n\nUML 由惠尔-帕奇（HP）、国际商业公司（IBM）、Oracle 等行业联合体在一个名为“对象管理组”（OMG）的控制小组庇护下创立，它满足了上述所有标准，确实是软件开发的行业标准。UML\
  \ 可以有效地用于概念化、修改、构建和交付面向对象的软件系统，包括完善的文档。\n\nUML 中的“统一”（Unified）一词意味着 UML 统一了来自名为\
  \ Rational Software 公司的三位领先科学家的理论：格拉迪·布奇（Booch 方法）、詹姆斯·兰博霍（对象建模技术 [OMT]）和伊瓦·雅各布（用例和对象化），这些理论构成了理性统一过程（RUP）。后来，RUP\
  \ 与 Booch 方法、OMT 和面向对象的软件工程（OOSE）等开发方法合并。\n\n#### 4.3.1.1 建模\n\nUML 是开发中系统的图形化表示。此外，它还包含了用于开发系统的用例等文档。UML\
  \ 有两种不同的视图，如下文所示：\n\n* **静态视图（Static view）：** 它从对象、属性和操作的角度提供了开发中系统的结构。这些方面通过类图和对象图来描述。\n\
  * **动态视图（Dynamic view）：** 它描述了系统的行为。它包括协作图、时序图、活动图和状态转换图。\n\nUML 2.2 版本包含 14 类图，其中\
  \ 7 种静态图和 7 种行为图。行为图包括 4 种交互图。\n\n#### 4.3.1.1.1 结构图\n\n结构意味着系统能够按照规范运行所必须存在的要素。例如，脊柱和颌骨是人体中维持直立姿势和咀嚼食物所必需的。结构图通过描述系统中存在的元素，代表了如下所示的架构：\n\
  \n* **类图（Class diagram）：** 描述类、它们的属性以及类之间的关系。\n* **组件图（Component diagram）：** 显示软件分解为组件的情况，以及这些组件之间的依赖关系。\n\
  * **复合结构图（Composite structure diagram）：** 描述类的内部结构以及该结构能够实现的协作。\n* **部署图（Deployment\
  \ diagram）：** 描述用于系统实现的硬件、执行环境以及部署在硬件上的制品构件。\n* **对象图（Object diagram）：** 它是某一时刻类图的实例。\n\
  * **包图（Package diagram）：** 通过显示这些分组之间的依赖关系，描述系统如何拆分为逻辑分组。\n* **配置图（Profile diagram）：**\
  \ 显示带有 `<<stereotype>>` 的类作为类，以及带有 `<<profile>>` 刻板的包。符号为 ![image](img/57-1.png)，表示元模型通过刻板类型进行了扩展。\n\
  \n#### 4.3.1.1.2 行为图\n\n行为图描述了系统的功能。所示了不同类型的行为图：\n\n* **活动图（Activity diagram）：**\
  \ 显示整体控制流。\n* **UML 状态机图（UML state machine diagram）：** 描述系统的状态和状态转换。\n* **用例图（Use\
  \ case diagram）：** 从参与者的角度描述系统提供的功能。\n\n### 4.3.2 UML 图的分类\n\nUML 采用的分类见图 4.1。类图、对象图和包图描述结构和静态特征。另一方面，用例图、交互图、状态图和活动图描述了行为建模。在第\
  \ 2 章中，我们详细讨论了结构。在后续章节中，我们将讨论动态行为。\n\n![Classification of UML diagrams](img/58-1.png)\n\
  \n**图 4.1** UML 图的分类\n\n## 4.4 用户需求 – 用例\n\n我们希望生产一个用户需要的系统。一旦系统产生，用户就会与之交互以产生预期结果。因此，我们需要关于如何操作的描述。用例通常提供这种描述。用例从外部用户的角度描述系统做了什么。它们提供了系统与用户之间交互的步骤序列。这种步骤序列被称为场景。\n\
  \n例如，对于大学的自动化图书馆系统，一个场景可能如下（图 4.2）：学生在线浏览图书馆的书目录，并选择他想要从图书馆借阅的书号。自动化系统的借阅子系统检查学生的权限并确认向学生借出书籍。系统通过电子邮件向借阅口发放授权单。学生将书带到借阅口，由负责人将授权单贴在内封页上。\n\
  \n![Use cases in an issue section of a library system](img/59-1.png)\n\n**图 4.2**\
  \ 图书借阅区的用例\n\n第二个场景可能是由于学生超过了借书限额导致授权失败。\n\n第三个场景可能是学生未通过身份检查。\n\n我们描述了从图书馆借书的三个场景；但学生在所有三个场景中的目标都是相同的，即借书。因此，我们现在可以说，一个用例是具有共同目标的不同场景的集合。\n\
  \n\n\n\n在用例中，我们将用户称为“参与者”（actors）。参与者可以是人类、设备或软件模块。例如，银行软件系统管理员、客户、烟雾传感器和在后台运行的软件代理都是参与者。一个用例可以有多个参与者，反之，一个参与者也可以使用多个用例。参与者用小人形状表示，用例则用椭圆形表示。UML\
  \ 有一种用例图，用于展示各个用例之间的关系。\n\n作为第二个例子，考虑一名学生注册第三学期课程的情况。该示例中涉及的参与者和用例如图图 4.3\n\n**图\
  \ 4.3** 学生注册过程中的用例\n\n用例解释了所研究系统的功能性需求。每个用例在实现之前都要求进行详细描述。下面提供了一个场景，解释了用户从系统中获取其所需内容的逐步执行程序：\n\
  \n**示例 4.1：来自学生注册过程用例的场景**\n\nGautam 注册了第三学期的课程。下面是具体的步骤程序：\n\n1. Gautam 去到注册窗口并输入他的身份信息。\n\
  2. 计算机给出了 Gautam 可以执行的操作列表。\n3. Gautam 选择第三学期课程的注册。\n4. 屏幕显示课程和开放选修课程的列表。\n5. Gautam\
  \ 选择课程和开放选修课程。\n6. 系统确认 Gautam 的第三学期注册。\n7. Gautam 退出。\n\n每个用例都有一个主要参与者，它调用该用例以交付预期的功能。用例内部可以定义另一个用例。用例中的每一步都是参与者与系统之间的交互。此外，每个用例都可以有`前置条件、保证的结果`，以及`一个触发用例启动的触发器`。\n\
  \n## 4.5 架构与领域：它们是什么？\n\n在任何现实问题中，我们都有用户以及他们的愿望和需求。因此，我们定义对象及其交互，即我们决定架构。用户的世界被称为`领域`（Domain）。\n\
  \n### 4.5.1 架构\n\n我们有系统的用户和用例。我们在开发的软件中有类。类是现实世界客户（用户）以及他们想要的内容（用例）的反映。基于客户及其现实世界的交互，我们定义对象与类之间的交互为链接和关联，以交付功能。这种安排被称为`架构`（architecture）。\n\
  \n我们将架构定义为对象及其属性的描述，以及这些对象为了满足用户规范或需求而执行的操作。\n\n### 4.5.2 领域\n\n客户和他们的交互存在于现实世界中。类是将现实世界问题映射到软件的概念模型。用户的世界被称为`领域`（domain）。\n\
  \n我们将用户领域和我们的架构显示为一组包含方框，其中包含对象的名称（图 4.4）。我们还将通过绘制互连线来展示它们的链接和关联。正如我们在第 2 章中所学的，我们还可以通过指定角色名称和重数来强化。在示例\
  \ 4.2 中，我们考虑了一所大学的领域和架构。\n\n![大学的领域和架构图](img/61-1.png)\n\n**图 4.4** 大学的领域和架构图\n\n\
  你看到的方框被称为“实体”（entities）。对于复杂的项目，每个实体的属性维护在一张表中。这张表被称为`数据字典`（data dictionary）。在面向对象编程范式出现之前，这些图也被称为`实体关系图`（entity-relation\
  \ diagrams）。\n\n**示例 4.2：大学的领域和架构**\n\n为了洞察哪个对象在执行什么，建议列出整个过程的步骤序列。让我们重新回顾一下在示例\
  \ 4.1 中讨论过的注册过程的总体操作序列，如下所示对注册过程进行了详细说明：\n\n1. Gautam 去到注册窗口并输入他的身份信息。\n2. 计算机给出了\
  \ Gautam 可以执行的操作列表。\n3. Gautam 选择第三学期课程的注册。\n    3.1 添加课程。\n    3.2 删除已添加的课程（更新）。\n\
  4. 屏幕显示课程和开放选修课程的列表。\n5. Gautam 选择课程和开放选修课程。他拥有添加或删除课程作为更新功能的选项。\n6. 系统确认 Gautam\
  \ 的第三学期注册。\n7. Gautam 退出。\n\n然后对于这个步骤序列中的每一步，我们可以准备一个序图或通信图和/或时序图。每个对象在做什么对用户来说是一个重要问题。UML\
  \ 提供了序图和通信图来解决这个问题。时序图是序图的一种变体，它针对时间基进行指定。\n\n## 4.6 序图\n\n用户用小人形象表示。每个对象用一个方框表示（对象表示）。从每个对象引出一条垂直线表示活动基线。从每条垂直线发出的箭头显示对象正在发送消息或调用属于其他对象的函数。\n\
  \n在图 4.5 中，我们展示了序图。研究的参与者是一个大三学生。课程协调员想要从 K 班中删除 Gautam 的名字。活动序列如下：\n\n![删除名字的序图](img/62-1.png)\n\
  \n**图 4.5** 删除名字的序图\n\n### 4.7 通信图（协作图）\n\n早期，通信图被称为协作图。它们与序图本质上相同，但在通信图的情况下例外。消息发生的时间（称为时间排序）通过对消息编号显式显示，如图图\
  \ 4.6 所示。协作图中的每个消息都有一个`序列号`。顶层消息编号为 1。同一层的消息（在同一调用期间发送）具有相同的数字前缀，但根据发生时间有不同的后缀 1、2\
  \ 等。\n\n![学生注册的通信图](img/63-1.png)\n\n**图 4.6** 学生注册的通信图\n\n通信图的关键元素有：\n\n- **作为分类对象**：用矩形框表示。对象角色框标记类名或对象名（或两者）。类名和对象名用冒号（:）分隔。\n\
  - **连接器**：表示消息的线。\n- **命名箭头**：表示发送者、接收者。\n\n为了阅读协作图，只需从编号为 1 的消息开始跟随数字。在图 4.6 中，我们使用了简单的命名方案。然而，UML\
  \ 使用嵌套编号系统，例如：\n\n简单命名方案：1, 2, 3, 4, …\n\n嵌套 UML 编号：1, 1.1, 1.1.1, 1.1.2, …\n\n\
  通信图传达与序图相同的信息；但它们关注的是对象角色而不是发送消息的时间。\n\n## 4.8 事件与状态\n\n类图是静态的，描述类与之间的链接和关联。它们不能用于描述对象在生命周期期间的行为。\n\
  \n\n\n\n\n对象具有行为和状态。对象的状态由属性的当前值定义。我们进一步了解到，像 `getters` 和 `setters` 这样的访问修饰符可以改变属性的值。我们可以说，某些事件触发了属性值的过程，从而改变对象的状态。\n\
  \n请注意，状态图描述的是类对象的行为。因此，所有对象共享同一个状态图。但对象在状态图中遵循的 `path` 是特定于对象实例的。\n\n### 状态图表示与自动机理论\n\
  \n状态图表示法在计算机科学中发展，是被称为`自动机理论`的自动机器理论的一部分。这门科学已被 UML 采用描述对象变化的方式。行为的每一次变化都被建模为状态的变化。\n\
  \n状态图表示事件和状态。当事件发生时，向下一个状态的转换取决于当前状态和该事件。状态图展示了这些状态的变化，并允许导致状态改变的操作。例如，让我们看看学生是如何进入大学的。状态图如图图\
  \ 4.7 所示。![学习专业课程的学生状态图](img/64-1.png)\n\n**图 4.7a** 学习专业课程的学生状态图\n\n![接受本科/研究生课程的学生](img/64-2.png)\n\
  \n**图 4.7b** 接受本科/研究生课程的学生\n\n在状态图中，观察到 `start` 和 `stop` 被显示为黑色实点。每个状态都显示为带圆角的矩形。状态的变化意味着对象改变了它的行为。例如，当一个学生经历本科（UG）课程（即第一至四年的课程）并符合条件时，他/她就变成了一个\
  \ `UG`。学生可以读本科课程，也可以直接读直贯制研究生（PG）课程。每个箭头代表一种变化。\n\n我们可以在状态图图中添加许多额外信息：\n\n*   它可以使用引起变化的\
  \ `function` 名称进行标记。\n*   添加触发对象状态发生变化的操作、事件或条件。\n*   添加在进入和离开状态时执行的操作。\n\n**示例\
  \ 4.3:  在线网上银行状态图**\n\n我们现在准备好定义一个动态模型，它是由所有通过交互事件相互作用的状态图构成的集合。\n\n在在线银行中，有以下不同的状态：\n\
  \n*   通过输入用户名和密码登录系统\n*   验证用户名和密码\n*   获取用户名和交易密码\n*   验证用户名和交易密码\n\n从每个状态都会产生交易。交易显示为从一个状态到另一个状态的箭头。触发从一个状态到另一个状态转换的事件显示在箭头旁边。在图\
  \ 4.8 中，我们的系统中在用户输入无效用户名或密码时发生的两个自转换。在用户输入 `tab key` 或 `enter key` 之前，光标保持不变并显示点以保持输入数据的机密性。\n\
  \n![网上银行状态图](img/64-1.png)\n\n**图 4.8** 网上银行状态图\n\n在状态图中，观察到 `start` 和 `stop` 被显示为黑色实点。每个状态都显示为带圆角的矩形。状态的变化意味着对象改变了它的行为。例如，当一个学生经历本科（UG）课程（即第一至四年的课程）并符合条件时，他/她就变成了一个\
  \ `UG`。学生可以读本科课程，也可以直接读直贯制研究生（PG）课程。每个箭头代表一种变化。\n\n### 4.8.1 与操作\n\n在状态图中，观察到 `start`\
  \ 和 `stop` 被显示为黑色实点。每个状态都显示为带圆角的矩形。状态的变化意味着对象改变了它的行为。例如，当一个学生经历本科（UG）课程（即第一至四年的课程）并符合条件时，他/她就变成了一个\
  \ `UG`。学生可以读本科课程，也可以直接读直贯制研究生（PG）课程。每个箭头代表一种变化。\n\n在状态图中，观察到 `start` 和 `stop` 被显示为黑色实点。每个状态都显示为带圆角的矩形。状态的变化意味着对象改变了它的行为。例如，当一个学生经历本科（UG）课程（即第一至四年的课程）并符合条件时，他/她就变成了一个\
  \ `UG`。学生可以读本科课程，也可以直接读直贯制研究生（PG）课程。每个箭头代表一种变化。\n\n### 4.8.2 嵌套状态图\n\n在状态图中，观察到\
  \ `start` 和 `stop` 被显示为黑色实点。每个状态都显示为带圆角的矩形。状态的变化意味着对象改变了它的行为。例如，当一个学生经历本科（UG）课程（即第一至四年的课程）并符合条件时，他/她就变成了一个\
  \ `UG`。学生可以读本科课程，也可以直接读直贯制研究生（PG）课程。每个箭头代表一种变化。\n\n## 4.9 活动图\n\n状态图告诉我们关于一个对象正在经历的过程的信息。活动图显示了单个过程中的活动流。它展示了每个活动依赖于其他活动的方式。因此，我们可以将活动定义为显示活动流及其相互依赖关系的图。\n\
  \n为了解释活动图的概念，我们选择了与示例 4.3 中相同的网上银行转账案例。\n\n涉及网上银行转账的类有**用户、客户端计算机系统和银行**。有关每个类的活动显示在称为**泳道**（swim\
  \ lane）的独立列圆角矩形中。活动图的显著特征如下：\n\n*   泳道识别负责执行特定活动的对象。\n*   每个活动产生一个转换，每个转换连接到下一个活动。\n\
  *   转换（有时基于决策框）可能会分支为两个或多个转换。\n*   每个导出的转换使用守卫表达式（[]）指示。\n*   分支和随后的合并使用浅菱形指示。\n\
  *   有时，转换可能会 `fork` 为并行活动并在稍后合并。这些在图 4.11 中用实线条显示。\n\n\n\n\n\n在使用网上银行进行转账时，涉及的活动所示：\n\
  \n* 用户输入用户名和密码登录系统。\n* 银行服务器（`bank`）验证用户名和密码。\n* 用户输入金额、交易密码（`IPIN`）和转账详情。\n* 银行验证交易密码。\n\
  * `IPIN` 验证成功后，银行检查资金可用。\n* 银行将金额转至目标账户。\n* 收到目标银行服务器的确认后，银行扣除账户。\n* 显示交易详情和资金余额。\n\
  * 用户注销。\n\n图 4.12 中的活动图是不言自明的，并遵循了上述描述的活动列表。它有两个泳道，一个用于银行服务器，另一个用于客户端机器。\n\n![在线网上银行活动图](img/69-1.png)\n\
  \n**图 4.12** 在线网上银行活动图\n\n![image](img/68-1.png) 用白色菱形表示分支，守卫表达式包含在 [] 中。\n\n![image](img/68-2.png)\
  \ 用粗线表示分叉，即启动多个活动，如扣除账户和转账金额。合并活动也使用相同的符号。\n\n## 4.10 包与组件 – 组织大型复杂项目的方法\n\n你熟悉文件和文件夹。为了组织工作，你打开文件夹并在文件夹内存储文件。包（Package）就像文件夹。我们可以直接将所有类存储在直接名为“包”的文件夹中。如果类的数量非常大，可以将类分组为组件（components），并将组件分组为包（图\
  \ 4.13）。\n\n![包的符号](img/70-1.png)\n\n**图 4.13** 包的符号\n\n组件（Components）包含类。它们为用户提供可插拔的接口。我们将使用插头和插座的概念来表示接口。例如，在图\
  \ 4.14 中，应用程序模块为学生模块提供接口。\n\n![组件的符号](img/70-2.png)\n\n**图 4.14** 组件的符号\n\n如果我们对组件中的类进行编码，那么这些编码后的类被称为制品（artefacts）。制品是\
  \ UML 给文件的名称。可以有多种文件类型，例如源代码、C++ 符号中称为 `.h` 的库文件、可执行文件。图 4.15 使得该概念变得清晰。在这里，我们展示了名为\
  \ `Student.cpp` 的源码、名为 `Student.h` 的库以及扩展名为 `.obj` 的相应对象模块。标准的制品有：`<<executable>>`、`<<document>>`、`<<file>>`、`<<library>>`、`<<script>>`\
  \ 和 `<<source>>`。\n\n![项目中的组件（制品）](img/70-3.png)\n\n**图 4.15** 项目中的组件（制品）\n\n在图\
  \ 4.16 中，我们展示了包如何通过依赖关系相互连接。虚线箭头表示包与其他包的依赖。\n\n![项目中的包](img/71-1.png)\n\n**图 4.16**\
  \ 项目中的包\n\n## 4.11 组件图与部署图\n\n**部署图（Deployment diagrams）**描述软件和硬件的物理配置。我们知道在面向对象的技术中，类图描述了应用程序的结构以及通过继承等各种关系类之间的相互作用。\n\
  \n我们进一步知道类包含成员函数，函数包含了实现功能所需的所有代码模块。\n\n组件被定义为代码模块。像网上购物这样的应用程序包含多个组件。应用程序将有一个用户界面。\n\
  \n硬件是节点的集合。组件位于节点上。\n\n远程节点使用网络硬件（如传输控制协议（`TCP`）IP 协议（`IP`））进行相互连接。\n\n因此，需要将上述所有内容组合到一个图中，这被称为组件和部署图，如图图\
  \ 4.17 所示。\n\n![在线组件和部署图](img/71-2.png)\n\n**图 4.17** 在线组件和部署图\n\n## 4.12 总结\n\n\
  1. 建模由结构建模和行为建模组成。结构建模也称为静态建模。行为建模也称为动态建模。\n2. 类图、对象图和包图描述了系统建模的静态特征。\n3. 对象的状态由对象属性所持有的当前值定义。它是对象直到该特定实例的行为变化的结果。\n\
  4. UML 在 OOAD 方法中作为图形化工具，用于对开发中的软件系统进行建模。它吸纳了面向对象技术中所有流行且接受的理论，例如 Grady Booch、James\
  \ Rambaugh 和 Ivar Jacobson 的理论。\n5. 用例（Use cases）提供了一系列步骤，描述了系统与用户之间的交互。这一系列步骤被称为场景（scenario）。用例解释了所研究系统的功能需求。\n\
  6. 步骤序列可以在序图中表示。\n7. 具有事件/活动时间顺序的序图称为时图（timing diagram）或通信图（communication diagram）。\n\
  8. 动态模型是状态图的集合。\n9. 通信图早期被称为协作图（colaboration diagrams）。通过消息编号，与序图本质相同。\n10. 状态的变化意味着行为的变化。\n\
  11. 活动图展示了活动的流及其相互依赖。关于每个类的活动显示在名为圆角泳道（swim lane）的列中。\n12. ![OEBPS/Images/68-1.png)\
  \ 用白色菱形表示分支，守卫表达式包含在 [] 中。\n13. ![OEBPS/Images/72-1.png) 用粗线表示分叉，即启动多个活动。\n14. 包就像文件夹。我们可以直接将所有类存储在直接名为“包”的文件夹中。如果类的数量非常大，可以将类分组为组件，并将组件分组为包。\n\
  15. 部署图描述软件和硬件的物理配置。\n16. 组件被定义为代码模块。硬件是节点的集合。组件位于节点上。\n\n## 练习题\n\n### 单选题\n\n\
  1. 状态图指定\n    i. 对象期间期间\n    ii. 对象当前的状态\n    iii. 对象在当前用例的状态\n    iv. 对象跨越所有用例的状态\n\
  \    1. i 和 iii\n    2. i 和 ii\n    3. i 和 iii\n    4. i, ii 和 iv\n\n2. 对象的状态由以下定义\n\
