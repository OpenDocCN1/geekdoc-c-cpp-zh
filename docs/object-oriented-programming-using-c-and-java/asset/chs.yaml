  \    4. 聚合意味着“部分”关系。\n    - i, iii 和 iv\n    - i, ii 和 iii\n    - ii 和 iv\n    -\
  \ i, ii 和 iv\n\n\n\n\n## 4. i, ii 和 iv\n\n## 6. 关于聚合（aggregation），下列哪些描述是正确的？\n\
  1. 聚合意味着“整体包含”的关系。\n2. 其他对象是聚合对象的一部分。\n3. 聚合由一条指向整体类的空心（hollow）菱形连线表示。\n4. 聚合意味着“是”的关系。\n\
  \n1. i, iii 和 iv\n2. i, ii 和 iii\n3. ii 和 iii\n4. i, ii 和 iv\n\n## 7. 关于组合（composition），下列哪些描述是正确的？\n\
