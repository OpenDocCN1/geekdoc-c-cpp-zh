  .   Polar2(double ad, double bd , double rd, double td){\n   24\\.   System.out.println“parameterized(\
  \ a,b,r,t) constructor.”)\n   25\\.   Setr(rd);Sett(td);Seta(ad);Setb(bd);}\n  \
  \ 26\\.   // 公访问函数\n   27\\.   public void ConvertToPolar(){double x=0.0;\n   28\\\
  .   r=(a*a + b*b)*0.5; x=Math.atan(b/a);//x 单位为弧度\n   29\\.   t=Math.toDegrees(x);\n\
  \   30\\.   } // 转换为极坐标形式\n   31\\.   public void DisplayPolar(){\n   32\\.   System.out.println“Inside\
