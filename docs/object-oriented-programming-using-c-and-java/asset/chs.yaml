  \ j=170, k;\n  7\\.    long int x=715000, y=918000, z;\n  8\\.    k=FindMax(i,j);\n\
  \  9\\.   z=FindMax(x,y);\n  10\\.   cout << “\\n 两个整数中较大的：”<<i<<” & “<<j<<” : “<<\
  \ k << endl;\n  11\\.   cout << “\\n 两个长型整数中较大的：”<<x<<” & “<<y<<” : “<< z << endl;\n\
  \  12\\.   getch();\n  13\\. }\n  14\\. //函数定义\n  15\\.   long int FindMax (long\
  \ int a, long int b)\n  16\\.   {\n  17\\.   long int max;\n  18\\.   //max = (a>b)?\
  \ a : b;\n  19\\.   if ( a>b)\n  20\\.   max=a;\n  21\\.   else\n  22\\.   max=b;\n\
  \  23\\.   //max = (a>b)? a : b;\n  24\\.   return (max);\n  25\\. }\n     /*输出:\
  \ 两个整数中较大的：150 & 170 : 170\n     两个长型整数中较大的：715000 & 918000 : 918000*/\n```\n\n\
