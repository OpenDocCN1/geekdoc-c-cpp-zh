  \      void SetCircleRadius(float f) { CircleRadius=f;}\n      float GetArea() const;\
  \ // 计算圆面积的函数\n private:\n      float CircleRadius;\n      Point CircleCenter; //\
  \ CircleCenter 是 Point 类的对象\n};\nCircle::Circle(float r, float p, float q)\n{\n\
  \      CircleCenter.SetX(p); // CircleCenter 是 Point 的对象 \n      class\n      CircleCenter.SetY(q);\n\
  \      CircleRadius=r;\n}\nfloat Circle::GetArea() const{return (22.0/7.0)*CircleRadius*CircleRadius;}\n\
  void main()\n{ Circle circ(3.0,1.5,2.5); // 创建中心点为(1.5,2.5) 半径为 3.0 的对象\n  float\
  \ area=circ.GetArea();\n  cout<<” area of the circle with radius = “<<circ.GetCircleRadius()\n\
