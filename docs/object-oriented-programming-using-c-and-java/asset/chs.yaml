  8. c\n9. d\n10. b\n11. a\n\n## 23\n## 使用 Swing 组件和 Applet 的图形\n\n### 学习目标\n\n在本章结束时，你将能够理解：\n\
  \n* 抽象窗口工具 (AWT) 工具包的使用。\n* 图形软件的层次结构、组件及其用法。\n* 事件类型和事件监听器。\n* Applet 及其与 Swing\
  \ 组件的使用。\n* 将 Applet 转换为应用程序反之亦然。\n\n### 23.1 图形编程与 Applet 简介\n\n我们目前为止所看到的程序都是基于文本的输出。它们是枯燥且乏味的。今天的世界是图形化的，以及带有音视频集成的客户端服务器程序。此外，这些应用程序都具有互联网功能并基于\
  \ Web。Web 应用程序广泛使用图形用户界面 (GUI)。本章将向你介绍这些 GUI 特性，如帧、面板、文本框、按钮、菜单等。这些内容共同包含在一个名为高级窗口工具\
  \ (AWT) 工具包的工具箱中。AWT 类提供了平台相关的接口及其实现。本章将向你介绍事件驱动程序、帧和面板的概念，这些在应用程序开发中被广泛使用。\n\n\
  Java 被设计为一种网络语言。之所以如此是因为支持 Applet。Applet 是编译成字节码的小型 Java 程序，可以使用 HTML（超文本标记语言）标签传输到网络中的任何地方。接收该类的系统使用\
  \ Java 虚拟机运行导入的类文件并在本地机器上执行 applet 代码。\n\n最后，Java 引入了比 applet 具有更好外观和感觉的 Swing 组件。本章仅使用\
  \ Swing 组件处理 AWT 的所有接口。\n\n### 23.2 图形软件的层次结构\n\nJAVA 中的图形用户界面 (GUI) 开发是基于组件的。Java\
  \ 组件可以进一步分为容器（containers）和小部件（widgets），如图 23.1 所示。\n\n![Java GUI hierarchy](img/546-1.png)\n\
  \n**图 23.1** Java GUI 层次结构\n\n容器进一步分类为根容器（Root Containers）和中间容器（Intermediate Containers）。根容器也称为顶层容器，每个\
  \ GUI 程序都是必须。Swing 为开发者提供了三个顶层容器：`JFrame`、`JDialog` 和 `JApplet`。中间容器不是强制的，但被广泛，因为它们有助于管理和组织部件。`JPanel`\
  \ 是 Swing 中最常用的中间容器。\n\n小部件是用于与用户交互的 GUI 元素；部件的典型用法是以文本、图像、菜单、按钮、复选框和单选框的形式向用户显示内容。部件也用于获取用户输入。`JButton`、`JLabel`、`JScrollBar`\
  \ 和 `JCheckBox` 是 Swing 中部件的示例。\n\n### 23.3 Swing 中的容器\n\n每个 Java GUI 应用程序都应该设计为层次结构，结构的根是根容器之一，即\
  \ `JFrame`、`JDialog` 或 `JApplet`。对于 Swing 应用程序，根始终是 `JFrame`。图 23.3 显示了细节。\n\n![Swing\
  \ containment hierarchy](img/546-2.png)\n\n**图 23.2** Swing 层次结构\n\n![Button](img/547-1.png)\n\
  \n**图 23.3** 按钮\n\n图 23.2 显示了仅有一个 `JButton` 部件的程序的层次结构。在图中，中间容器 `JPanel` 是可选的，但顶层容器是强制的。图中还描绘了创建和添加的规则；对于\
  \ Java GUI 程序，创建是从上到下的，这意味着我们先创建 `JFrame` 组件，最后创建 `JButton` 组件，而添加从底部开始。示例 23.1\
  \ 说明了 Java GUI 程序的创建和添加规则。\n\n**示例 23.1：创建 JFrame 并添加 GUI 组件**\n\n```\n 1\\. import\
  \ javax.swing.*;\n   2\\. public class SwingDemo {\n   3\\. public static void main(String[]\
  \ args) {\n   4\\. JFrame frame = new JFrame(“Swing Demo”);\n   5\\. JPanel panel\
  \ = new JPanel();\n   6\\. JButton button = new JButton(“Button”);\n   7.\n   8\\\
  . panel.add(button);\n   9\\. frame.setContentPane(panel);\n   10\\. frame.setVisible(true);\n\
  \   11\\. }\n   12\\. }\n```\n\n**输出**\n\n如上面的示例所示，我们在第 4 行首先实例化根容器 `frame`；然后我们在第\
  \ 5 行实例化中间容器 `panel`，最后在第 6 行实例化按钮部件。也就是说，在创建期间我们遵循了自上而下的方法。但在添加期间，我们先在第 7 行将按钮添加到\
  \ panel，然后在第 8 行将 panel 添加到 frame，最后在第 9 行显示 frame，从而遵循了自底向上的方法。\n\n添加和创建规则将适用于本章讨论的所有程序。\n\
  \n#### 23.3.1 JFrame 类\n\n帧通常提供许多服务；一些常用的服务包括设置标题、设置图像、提供菜单栏、设置帧的高度和宽度、设置帧的位置。为了管理帧的设置并使代码可复用，我们为帧创建一个名为\
  \ `DisplayFrame` 的独立类。在 `DisplayFrame` 的构造函数中定义根帧的所有设置。图 23.3 显示了细节。\n\n**示例 23.2：演示\
  \ JFrame 的程序**\n\n```\n 1\\. import javax.swing.*;\n   2\\. public class SwingDemo\
  \ {\n   3\\.   public static void main(String[] args) {\n   4\\.    JFrame frame\
  \ = new DisplayFrame();\n   5\\.     frame.setVisible(true);\n   6\\.   }\n   7\\\
  . }\n   8\\. class DisplayFrame extends JFrame{\n   9\\.   DisplayFrame(){\n   10\\\
  .   setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n   11\\.   setTitle(“Swing\
  \ Demo”);\n   12\\.   setSize(300,150);\n   13\\.   setLocation(100,100);\n   14\\\
  .  }\n   15\\. }\n```\n\n`JFrame` 类存在于 `javax.swing.JFrame` 中。为了使用此类，我们使用导入语句 `import\
  \ javax.swing.*`，如第 1 行所示。在第 4 行，我们实例化 `DisplayFrame` 对象，反过来调用第 9 行的构造函数 `DisplayFrame()`。我们在构造函数内部设置根帧的一些设置。\n\
  \n第 10 行的 `setDefaultCloseOperation()` 方法带有参数 `JFrame.EXIT_ON_CLOSE`，导致用户通过关闭关闭帧时帧关闭。第\
  \ 11 行的 `setTitle()` 设置帧名。第 12 行的 `setSize()` 设置帧的大小，最后第 13 行的 `setLocation()` 设置屏幕上的\
  \ x, y 位置。输出见图 23.4。\n\n![A frame in java swing](img/548-1.png)\n\n**图 23.4** Java\
  \ Swing 帧\n\n#### 23.3.2 JPanel 类\n\n面板是中间容器，因此对于创建 Java 图形用户界面程序并非必不可少。但面板在管理部件方面提供了很大的灵活性，因此始终建议在程序中使用面板。类似于扩展基本\
  \ `JFrame` 类的 `DisplayFrame` 类，我们创建一个名为 `DisplayPanel` 的新类，它扩展了 `JPanel` 类。\n\n\n\
  \n\n\n```java\n 1\\. import javax.swing.*;\n   2\\. public class SwingDemo {\n \
  \  3\\.  public static void main(String[] args) {\n   4\\.   JFrame frame = new\
  \ DisplayFrame();\n   5\\.    frame.setVisible(true);\n   6\\.  }\n   7\\. }\n \
  \  8\\. class DisplayFrame extends JFrame{\n   9\\.   DisplayFrame(){\n   10\\.\
  \   setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n   11\\.    setTitle(“Swing\
  \ Demo”);\n   12\\.    setSize(300, 150);\n   13\\.    setLocation(100,100);\n \
  \  14\\.    JPanel panel = new DisplayPanel();\n   15\\.    getContentPane().add(panel);\n\
  \   16\\.  }\n   17\\. }\n   18\\. class DisplayPanel extends JPanel{\n   19\\.\
  \ DisplayPanel() {\n   20\\.   //Widgets will be added here\n   21\\.    }\n   22\\\
  . }\n```\n\n示例 23.3 的代码与示例 23.2 几乎相似。在上面的示例中，我们在第 14 行实例化了`DisplayPanel`对象。`DisplayPanel`的构造函数目前是空的，但今后，正如我们在后续示例中看到的，所有的组件创建代码都将放置在类类中。每个`JFrame`对象都有一个内容面板（contentpane），所有想要区域的组件都必须添加到其中。第\
  \ 15 行演示了如何获取框架的内容面板并添加面板。\n\n## 23.4 Swing 中的显示组件（Display Widgets）\n\n显示组件（Widgets）是帮助我们构建用户界面的组件。它们是用户实际看到并与之交互的组件。典型的示例包括复选框、按钮和菜单。Java\
  \ Swing 提供了许多显示组件；在随后的章节中，我们将讨论一些最常用的组件。\n\n### 23.4.1 JLabel 类\n\n`JLabel` 对象用于在\
  \ Java 中显示文本、图像或同时显示文本和图像。图 23.5 展示了一个典型的使用场景，其中使用 `JLabel` 对象显示了字符串“Welcome to\
  \ Java”。示例 23.4 演示了如何在 Java 中创建和显示`JLabel` 对象。\n\n![JLabel](img/550-1.png)\n\n**图\
  \ 23.5** JLabel\n\n**示例 23.4: 演示 JLabel 类的程序**\n\n```java\n 1\\. import javax.swing.*;\n\
  \   2\\. public class SwingDemo {\n   3\\.  public static void main(String[] args)\
  \ {\n   4\\.   JFrame frame = new DisplayFrame();\n   5\\.     frame.setVisible(true);\n\
  \   6\\.  }\n   7\\. }\n   8\\. class DisplayFrame extends JFrame{\n   9\\.  DisplayFrame(){\n\
  \   10\\.    setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n   11\\.    setTitle(“Swing\
  \ Demo”);\n   12\\.    setSize(300, 150);\n   13\\.    setLocation(100,100);\n \
  \  14\\.    JPanel panel = new DisplayPanel();\n   15\\.    getContentPane().add(panel);\n\
  \   16\\.  }\n   17\\. }\n   18\\. class DisplayPanel extends JPanel{\n   19\\.\
  \ DisplayPanel() {\n   20\\. JLabel label = new JLabel\n   21\\. (“Welcome to Java\
  \ Swing” );\n   22\\. add(label);\n   23\\. }\n   24\\. }\n```\n\n`JLabel` 类存在于\
  \ `javax.swing.JLabel` 中。要使用此类，我们使用导入语句 `import javax.swing.*`，如第 1 行所示。我们在第 20\
  \ 行实例化了 `JLabel` 对象；要显示的字符串在实例化期间作为参数传递的。最后，我们在第 22 行将 `JLabel` 对象 `label` 添加到面板中。\n\
  \n### 23.4.2 JButton\n\n`JButton` 对象用于在 Java 中显示按钮。按钮是非常实用的用户界面元素，可以用于各种用户交互。图 23.6\
  \ 展示了一个典型的使用场景，其中使用 `JButton` 对象显示了按钮“Click Me”。示例 23.5 演示了如何在 Java 中创建和显示`JButton`\
  \ 对象。\n\n![JButton](img/551-1.png)\n\n**图 23.6** JButton\n\n**示例 23.5: 演示 JButton\
  \ 类的程序**\n\n```java\n 1\\. import javax.swing.*;\n   2\\. public class SwingDemo\
  \ {\n   3\\.  public static void main(String[] args) {\n   4\\.   JFrame frame =\
  \ new DisplayFrame();\n   5\\.     frame.setVisible(true);\n   6\\.  }\n   7\\.\
  \ }\n   8\\. class DisplayFrame extends JFrame{\n   9\\.  DisplayFrame(){\n   10\\\
  .   setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n   11\\.    setTitle(“Swing\
  \ Demo”);\n   12\\.    setSize(300, 150);\n   13\\.    setLocation(100,100);\n \
  \  14\\.    JPanel panel = new DisplayPanel();\n   15\\.    getContentPane().add(panel);\n\
  \   16\\.  }\n   17\\. }\n   18\\. class DisplayPanel extends JPanel{\n   19\\.\
  \ DisplayPanel() {\n   20\\. JButton button = new JButton(“Click Me”);\n   21\\\
  . add(button);\n   22\\. }\n   23\\. }\n```\n\n`JButton` 类存在于 `javax.swing.JButton`。要使用此类，我们使用导入语句\
