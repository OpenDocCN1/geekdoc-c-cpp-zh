  \ 错\n6. 错\n7. 对\n8. 错\n9. 错\n10. 对\n\n## 18 类对象与方法\n\n### 学习目标\n\n在本章结束时，你将能够理解并使用：\n\
  * Java 的类和对象。\n* 构造方法及其重载。\n* Java 的方法及其用法。\n* `this` 运算符。\n* 内部类。\n* `finalize()`\
  \ 方法和垃圾回收器。\n* 静态方法和静态类。\n\n## 18.1 引言\n\nJava 是一种纯面向对象的语言，因此所有的编程都封装在类中。面向对象编程涉及编写使用类的程序。我们创建不同类的对象来解决当前的问题，并通过成员函数让对象之间进行通信。\n\
  \n在本章中，我们将学习如何使用类和对象来解决问题。我们还将涵盖数据隐藏、抽象、类成员享有的访问权限，以及构造函数和析构函数的概念。我们还会讨论方法的各种变体，如方法的定义、递归和工厂方法。文中引入了类内部的类，即内部类。并解释了\
  \ `this` 运算符以及静态成员函数及其相关性和用法。我们还讨论了 Java 的垃圾回收器和 `finalize()` 方法。\n\n## 18.2 类与对象\n\
  \n看看你的教室。到处都是学生。首先，为什么他们被你的校长分在了一起？首先是因为他们有共同的兴趣，例如他们都想学习 Java 语言，或者他们想完成本科或研究生学习。在计算机术语中，我们可以说所有学生具有相同的功能。这就是为什么他们可以被分在一起。\n\
  \n但请注意，每个学生都有自己的个人属性。属性意味着自己的有的成员数据，如身高、体重、分数、考勤等。同样请注意，你班大约有 60 名学生，每个人都有自己的属性，但具有共同的功能。我们可以称\
  \ `Students` 类的 60 个 `object` 实例。好了，这么多背景介绍。图 18.1 显示了 student 类属性和方法。\n\n![类方法和属性](img/420-1.png)\n\
  \n**图 18.1** 类方法和属性\n\n**类**：对象的集合。我们也可以定义为实例对象的数组。但类可以拥有成员函数和成员数据。在这里，与数组不同，类可以拥有不同数据类型作为它的元素。\n\
  \n**对象**：对象是一个实体。也就是说，它是被感知和看到的。例如学生、笔、桌子、椅子等。因此，对象是一个拥有自己的成员数据和成员函数的独立实体。\n\n虽然类的方法对于对象的所有实例都是通用的，但对象的每个实例都有自己的属性集。因此，成员数据也被称为实例变量，即它们对于对象的每个实例都是不同的。\n\
  \n**数据隐藏/数据抽象**。习惯上将所有成员数据仅声明为 `private`。但声明为 `private` 的数据是被隐藏的，不能被任何人访问。这种特征被称为数据隐藏或数据抽象。但我们如何获取它们呢？你只能通过\
  \ `public` 成员方法访问。\n\n**封装**。像 Java 这样的面向对象编程是一种数据优先的语言，即数据很重要而函数不重要。根据内存映射，数据存储在数据区域（如栈和空闲），而函数存储在代码区域，有必要对函数访问数据进行严格控制。Java\
  \ 通过使用封装功能来实现这种控制。封装是将成员数据和调用函数与安全分类结合在一起，防止发生对数据的未授权访问。Java 极度依赖访问限定符来维护数据完整性。安全访问限定符有\
  \ `public`、`private` 和 `default`。\n\n### 18.3 声明类和创建类实例\n\n使用 `class` 关键字后跟大括号。在大括号内，我们可以包含成员数据和成员方法，如下所示。我们将创建一个名为\
  \ `Student` 的类。属性是 `name`、`rollNo` 和 `totalMarks`。根据总分授予等级：如果总分大于 80 分为 A，总分大于 60\
  \ 分为 B，总分大于 60 分（注：此处逻辑应为大于 50）为 C，小于 40 分为 D。\n\n**示例 18.1: 如何声明一个 Student 类**\n\
  \n```\n1. package com.oops;\n2. import java.io.*;\n3. class Student1{\n4.   //成员数据或属性\n\
  5.   String name=\"\"; //学生的名字\n6.   int rollNo;\n7.   double totalMarks;\n8.  \
  \ String grade=\"\";\n9.   }\n10. class StudentDemo {\n11. public static void main(String[]\
  \ args) {\n12.   //创建 Student1 类的实例\n13.   Student1 std = new Student1();\n14. \
  \  std.name=\"Gautam\";\n15.   std.rollNo=6274;\n16.   std.totalMarks=98.78;\n17.\
  \   //计算等级\n18.   if( std.totalMarks >=80.0) std.grade=\"A\";\n19.   else if (std.totalMarks>=\
  \ 60.0) std.grade=\"B\";\n20.   else if (std.totalMarks>= 50.0) std.grade=\"C\"\
  ;\n21.   else std.grade=\"D\";\n22.   System.out.println(\"Students Details are……);\n\
  23.   System.out.println(\"Roll Number:\" + std.rollNo);\n24.   System.out.println(\"\
  Name:\" + std.name);\n25.   System.out.println(\"Total Marks:\" + std.totalMarks);\n\
  26.   System.out.println(\"Grade:\" + std.grade);\n27.   }\n28. } // 结束 StudentDemo\n\
  \ 输出: Students Details are……\n Roll Number:6274 Name:Gautam Total Marks:98.78 Grade:A\n\
  ```\n\n| **行号 5 到 8：** | 声明如学号、名字、总分和等级等属性。由于我们没有声明访问限定符，这些属性在包内被认为是公共的。这意味着包内的所有类都可以访问这些属性。\
