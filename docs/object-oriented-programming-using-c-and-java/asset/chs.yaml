  \ |\n\n### 21.9 随机访问文件 (Random Access Files)\n\n在这种访问访问模式下，使用为该目的而维护的索引来访问记录。这就像是去书中翻到某一章节，然后在章节内翻到感兴趣的页码，使用书末提供的索引来实现。可以从任何位置访问文件。它实现了\
  \ `DataInput` 和 `DataOutput` 接口，并扩展了 Java 的基类 `Object`。在 Java 中使用随机文件的语法为：\n\n```\n\
  \   RandomAccessFile( File obj , String Access Specifier);\n   RandomAccessFile(\
  \ String filename , String Access Specifier);\n```\n\n访问指示符（Access specifier）是一种决定随机访问文件操作模式的模式。“r”表示只读，“rw”表示可读可写。此外，还有一个名为\
  \ `seek()` 的方法可以用于设置文件中的当前位置。`seek()` 方法证明了“随机文件”的名称。`seek()` 的语法为：`void seek(long\
  \ pos) throws IOException`。\n\n还有一个设置随机文件长度的规定：`void setlength(long n) throws IOException`，用于设置随机文件的长度。如果存在额外的条目，它们将被忽略。\n\
  \n**示例 21.5：RandomAccess.Java 一个展示 Java File 类使用的程序**\n\n```\n 1\\. package com.oops.chap21;\n\
  \   2\\. import java.io.*;\n   3\\. public class RandomAccess {\n   4\\. public\
  \ static void main(String[] args)throws IOException {\n   5\\. //为 RandomFile 创建对象\n\
  \   6\\. RandomAccessFile randfile = new RandomAccessFile“raf.dat ”，“rw”);\n   7\\\
  . try {\n   8\\. int idNo=50595;float sal =20000.00F;boolean malefemale= true;\n\
  \   9\\. char cadre = ‘S’;\n   10\\.  randfile.writeInt(idNo);\n   11\\.  randfile.writeDouble(sal);\n\
  \   12\\.  randfile.writeChar(cadre);\n   13\\. //跳转到文件开头\n   14\\.  randfile.seek(0);\n\
  \   15\\.  System.out.println“idno :”+ randfile.readInt());\n   16\\.  System.out.println“Salary\
  \ :”+ randfile.readDouble());\n   17\\.  System.out.println“Cadre :”+ randfile.readChar());\n\
  \   18\\.  randfile.seek(randfile.length());//跳转到文件末尾\n   19\\.  randfile.writeBoolean(malefemale);\n\
  \   20\\.  randfile.seek(3);\n   21\\.  System.out.println“Malefemale :”+ randfile.readBoolean());\n\
