  \ press ok`。\n\n| 步骤 0 | 在名为 `Demo1` 的目录中编写 Servlet 代码 `ServletWelcome.java`，并将目录\
  \ `Demo1` 放置在 `C:\\Program Files\\Apache Software Foundation\\Tomcat 6.0\\webapps`。`Demo1`\
