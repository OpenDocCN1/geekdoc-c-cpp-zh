  \ 多层继承\n\n**层级继承：**图 12.2d 自显易懂。\n\n![Hierarchical inheritance](img/268-4.png)\n\
  \n**图 12.2d** 层级继承\n\n**混合继承：**图 12.2e。`DC1` 和 `DC2` 派生自 `BC`。因此基类是虚基类。然而，`DC3`\
  \ 同时派生自 `DC2` 和 `DC3`。根据设计，`DC3` 持有部分来自 `DC2` 和 `DC3` 以及 `BC` 的属性和数据。因此，这种继承被称为混合继承。\n\
  \n![Hybrid inheritance](img/268-5.png)\n\n**图 12.2e** 混合继承\n\n## 12.4 构造函数与析构函数\n\
  \n当我们创建派生类对象（如 `Student`时，注意 `Student` 构造函数会调用基类构造函数 `Human`，并构造 `Human` 的成员数据如\
  \ `idNo` 和 `name`。然后 `Student` 构造函数将初始化它自己的数据如 `CAT`。\n\n同样，当对象需要删除时，首先调用派生类的析构函数，然后调用基类的析构函数。\n\
  \n#### 12.5 基类函数覆盖\n\n基类 `Human` 定义了两个函数即 `Work()` 和 `Learn()`。派生类如果不再次定义这些函数，可以使用基类的\
  \ `learn(0)` 或 `Work()`。但如果它想要与基类不同的自己的实现，可以在它的类定义中定义这些函数。\n\n```cpp\nvoid Learn(){\
  \ cout<<”\\n Students learn professional subjects… ”<< endl;}\nvoid Work(){ cout<<”\\\
  n Students work at college laboratories… ”<< endl;}\n```\n\n当派生类对象调用这些函数时，它只会获得派生类的功能，而不是基类的功能。如果派生类对象特别需要基类的功能，那么它必须使用作用域运算符调用基类函数，如下所示：\n\
  \n```cpp\ncout<<”\\n Student does Work() belonging to base class “<<endl;\nstd.Human::Work();\n\
  ```\n\n**示例 12.3：带有构造函数和析构函数的 inherit2.cpp 程序**\n\n\n\n\n```cpp\n1. #include<iostream>\n\
