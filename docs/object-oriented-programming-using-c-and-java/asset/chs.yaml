  \      cout<<“passed with first class”<<endl;\n```\n大括号决定了 `else` 语句的关联规则。以下代码中的\
  \ `else` 与第一个 `if` 语句链接：\n```cpp\n        if ( totalMarks > 60)\n          { if\
  \ ( total Marks > 70)\n           { cout<<“passed with distinction”<<endl;\n   \
  \       }\n```\n\n![if 语句中的控制流](img/142-1.png)\n\n**图 7.2** if 语句中的控制流\n\n![if–else\
  \ 语句中的流程](img/142-2.png)\n\n**图 7.3** if–else 语句中的流程\n\n```cpp\n else // 与内部 if\
  \ 关联\n          { cout<<“passed with first class”<<endl;\n          }\n        }\n\
  \        else // 与外部 if 关联\n        {…else 块……….}\n```\n\n### 示例 7.6：FindMax.cpp\
  \ 求两个数的最大值\n\n```cpp\n// 示例 7.6: Findmax.cpp 寻找两个数的最大值\n  1\\.  #include <iostream>\n\
