  \ {\n   17\\.   String grade=””;\n   18\\.   if( totalMarks >=80.0) std.grade=”A”;\n\
  \   19\\.   else if (totalMarks>= 60.0) std.grade=”B”;\n   20\\.   else if (totalMarks>=\
  \ 50.0) std.grade=”C”;\n   21\\.   else grade=”D”;\n   22\\.   return std;\n   23\\\
  .   }\n   24\\. }\n   25\\.   class StdGradeDemo {\n   26\\.   public static void\
