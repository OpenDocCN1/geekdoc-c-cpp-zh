  \ `Window` 菜单中。\n\n### 23.5 布局管理器\n\n到目前我们讨论了组件的创建；到目前为止的大多数示例都只有一个组件。但在实际应用场景中，同一个屏幕上会有多个组件，我们需要某种布局管理机制来管理这些组件在屏幕上的位置。Java\
  \ Swing 为我们提供了三种布局管理器来简化这一任务。在随后的章节中，我们将更详细地查看这些布局管理器。\n\n\n\n\n\n面板布局通过使用 `setLayout()`\
  \ 方法并传入 `BorderLayout` 类的实例来设置，如第 22 行所示。我们使用 `add()` 方法在面板中填充 `newLabel` 组件并带上位置信息，如第\
  \ 23 到 27 行所示。`newLabel` 组件是 `JLabel` 的扩展，带有额外的属性。它设置了标签中文本的对齐方式，使文本居中；这是通过使用 `setHorizontalAlignment()`\
  \ 方法并传递参数 `CENTER` 实现的，如第 33 行所示。我们为标签设置了黑色边框，以便标签占据的区域清晰可见。这是通过使用 `setBorder()`\
  \ 方法并传递参数 `black` 实现的，如第 34 行所示。参数 `black` 的类型为 `Border`，它在第 30 行创建。你可以通过更改 `createLineBorder()`\
  \ 中的参数来创建不同的线条颜色。\n\n### 23.5.2 网格布局 (Grid Layout)\n\n网格布局将屏幕分为指定的行和列，如下所示。当我们想要创建一个类似于\
  \ Windows 桌面的 UI，其中图标在屏幕上对称排列时，网格布局非常有用。图 23.11 显示了输出。\n\n![GridLayout](img/558-1.png)\n\
