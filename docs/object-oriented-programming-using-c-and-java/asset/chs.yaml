  \   17\\.  System.out.println“\\n\\t mass\\tarea\\tdensity”);\n   18\\.  for( int\
  \ i=0; i<len;i++){\n   19\\.  System.out.println(“\\t”+massArray[i]+”\\t”+areaArray[i]+”\\\
  t”+densityArray[i]);}\n   20\\.  }catch(ArithmeticException e)\n   21\\.  {System.out.println(“Divide\
  \ By Zero Exception has occurred ….”);}\n   22\\.  catch(ArrayIndexOutOfBoundsException\
  \ e)\n   23\\.  {System.out.println(“Array out of Bounds Exception has occured ….”);}\n\
  \   24\\.  finally{\n   25\\.  System.out.println(“We are inside finally block &\
  \ exiting the programme…….”);}\n   26\\.}// end of main\n   27\\.  }//end of class\n\
  \   Run 1 We have commented out Line No. 12 to test array\n       //index out of\
  \ bounds exception\n   OUTPUT1 :Divide By Zero Exception has occurred ….\n     \
  \  We are inside finally block & exiting the programme…….\n   Run 2 We have commented\
  \ out Line No. 13,14,and 15 to test Divide\n       //By Zero exception i.e ArithmeticException\n\
  \   OUTPUT2: Divide By Zero Exception has occured ….\n       We are inside finally\
  \ block & exiting the programme…….\n```\n\n- **第 7 行：**是 try 块，多个 catch 块位于第 20\
  \ 行和 22 行。\n- **第 9 行：**我们刻意定义了 `areaArray[3] = 0.0` 来模拟除以零的错误。\n- **第 12 行：**`for(\
  \ int i=0; i<len+1;i++){` 显示我们正在尝试超出数组大小（即 `len`）。这将将触发 `ArrayIndexOutOfBoundsException`。\n\
  - **第 14 行：**检查 `if( areaArray[i]==0)`，如果为真则 `throw new ArithmeticException`。该异常对象被第\
  \ 20 行的 catch 块捕获。这是用户抛出的异常对象。`Exception` 类由 `java.lang.Exception` 包提供。\n\n### 20.7\
  \ Throws 声明异常\n\n`java` 提供了另一种名为 `throws` 的变体。我们在所有与 IO 相关的程序中都使用了这一功能，例如 `public\
  \ static void main(String [] args) throws IOException`。所有的检查异常（即所有受检异常）都要求由用户处理。然而，如果用户不想处理异常，那么他必须使用\
  \ `throws` 子句将其抛出。\n\n### 示例 20.7：MultiCatchFinally.java 一个显示多个 Catch 语句和 Finally\
  \ 块的程序\n\n```\npackage com.oops.chap20;\nimport java.io.*;\nimport com.oops.chap20.OurOwnException;\n\
