  67\\.  cout<<”\\n 正在退出栈满异常的 catch 块 ...\"<<endl;\n68\\.  }\n69\\.  //重载赋值运算符\n70\\\
  .cout<<”\\n 栈对象 s = 运算符的结果...”<<endl;\n71\\.  Stack t;\n72\\.  t=s; // 赋值运算符\n73\\\
  .  cout<<”\\n 栈 s 的元素”<<endl;\n74\\.  while(!s.empty())\n75\\.  { cout<<s.top()<<endl;s.pop();}\n\
  76\\.  cout<<”\\n = 运算符后栈 t 的元素”<<endl;\n77\\.  while(!t.empty())\n78\\.  { cout<<t.top()<<endl;\
