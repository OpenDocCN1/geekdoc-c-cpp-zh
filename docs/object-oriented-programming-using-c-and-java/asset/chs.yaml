  \ i=0;i<rows;i++)\n   19\\. {for ( int j=0;j<cols;j++)\n   20\\. System.out.print(\
  \ (A[i][j]+B[i][j]) +” “);\n   21\\. System.out.print( “\\n”);}\n   22\\. }//end\
  \ of TranspMat\n   23\\. }//end of MatrixAlloc\n   24\\. class TwoDMatrix{\n   25\\\
  . public static void main(String[] args)\n   26\\. {try{\n   27\\. Scanner scn =\
  \ new Scanner(System.in);\n   28\\. MatrixAlloc obj=new MatrixAlloc();\n   29\\\
  . System.out.print(“Enter no of rows & columns:”);\n   30\\. int rows= scn.nextInt();\n\
  \   31\\. int cols= scn.nextInt();\n   32\\. int A[][]= new int[rows][cols];\n \
  \  33\\. int B[][]= new int[rows][cols];\n   34\\. MatrixAlloc mat = new MatrixAlloc();\n\
  \   35\\. System.out.println(“Enter Data for Matrix A”);\n   36\\. obj.ReadMat(\
  \ A ,rows,cols);\n   37\\. System.out.println(“Enter Data for Matrix B”);\n   38\\\
  . obj.ReadMat( B ,rows,cols);\n   39\\. System.out.println(“Addition of two Matrices”);\n\
  \   40\\. mat.AddMat(A,B,rows, cols);\n   41\\. } catch( Exception e){};\n   42\\\
  . }\n   43\\. } //end of MatTranspose\n   OUTPUT : Enter no of rows & columns:2\
  \ 2\n   Enter Data for Matrix A 10 20 30 40\n   Enter Data for Matrix B 10 20 30\
  \ 40\n   Addition of two Matrices\n   20 40\n   60 80\n```\n\n| **第 26 行：** | 显示我们包含了\
  \ `try {` 块，它会一直延伸到第 41 行的 `catch` 块。我们放置 `try` 块是因为在第 27 行和第 28 行有内存分配：`Scanner\
  \ scn = new Scanner(System.in);MatrixAlloc obj=new MatrixAlloc();` 第 32 行和第 33 行为矩阵\
  \ `A` 和 `B` 分配内存。 |\n| **第 41 行：** | `catch( Exception e){}` 捕获了异常。 |\n\n\n\n通常当发生异常时，异常处理代码可能会启动返回系统或调用调用程序。在那个时刻，有若干操作需要执行，如关闭所有打开的文件、将状态恢复到异常发生之前的状态等。这是通过使用\
  \ `finally()` 实现的，如下例所示。它位于最后一个 catch 块之后。\n\n### 示例 20.5：使用 Finally \n\n```\n try\n\
  \  { // allocation code here\n    public void DisplayNumbers() throws NumberFormatException{\n\
  \    //display code here that uses number formatting }\n    public int FindMaxArray(\
  \ int a[] , int n) throws ArrayOutOfBounds exception{\n    //FindMaxArray code here\
  \ that uses Array processing\n  }\n catch (NumberFormatException e1){ }\n catch\
  \ ( ArrayOutOfBoundsexception e2) { }\nfinally { // finally block\n/* includes all\
  \ house keeping code like saving current state ,closing of all open\nobjects and\
  \ file and restoring the state to a state that existed prior to occurring of the\n\
  problem*/\n} // end of finally block\n```\n\n### 20.6 抛出异常\n\n程序员可以显式地抛出异常。Throw\
  \ 可以用于 `java.lang.Exception` 包提供的任何异常或用户定义的异常类。在接下来的示例中，我们将展示用户抛出一个 `ArithmeticException`\
  \ 类的异常对象。\n\n### 示例 20.6：MultiCatchFinally.java 一个显示多个 Catch 语句和 Finally 块的程序\n\n\
  ```\n 1\\. package com.oops.chap20;\n   2\\. import java.util.*;\n   3\\. public\
