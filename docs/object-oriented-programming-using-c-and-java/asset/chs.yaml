  ```\n\n**输出: Hello Students! Welcome to Servlet Chapter**\n\n| 行号 | 说明 |\n| :---\
  \ | :--- |\n| 2 | 导入 `javax.servlet.*`；这是运行 Servlet 程序必不可少的包。确保你已经在类路径中包含了 `Servlets-api.jar`\
  \ 文件。 |\n| 3 | 创建一个 `ServletWelcome` 类，作为 `GenericServlet` 的子类。它提供了 `init()` 和 `destroy()`\
  \ 方法。我们将重写 `service()` 方法来实现我们自己的功能。`service()` 方法通过接受 `ServletRequest` 对象 `res`\
  \ 并输出 `ServletResponse` 对象 `res` 来处理客户端请求。 |\n| 5 | 将内容类型设置为 `html/text`。这是指示浏览器以\
  \ HTML 格式解释数据的信号。 |\n| 6 & 7 | 使用 `getWriter()` 获取 `PrintWriter` 对象 `pw`。在第 7 行中，对象\
  \ `pw` 将字符串写入网络浏览器以显示消息。 |\n\n\n\n\n\nServlet API 包含 `javax.servlet` 和 `javax.servlet.http`。这些是\
  \ `Tomcat wservlet-api.jar` 的一部分，而不属于 J2SE 5。`javax.servlet` 包提供了实现所需的所需的所有接口，并如表\
  \ 24.6 所示，而该包中的重要类在表 24.7 所示。接口显示在表 24.8 中。\n\n### 表 24.6 javax.servlet 包提供的接口\n\
