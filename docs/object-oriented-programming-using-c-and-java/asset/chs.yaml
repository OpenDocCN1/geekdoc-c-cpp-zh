  \n13. `DSN` 代表数据源导航器（Data Source Navigator）。程序员需要创建一个 `DSN` 名称，以便通过 `ODBC-JDBC Bridge`\
  \ 访问数据库。\n\n14. Oracle 数据库也使用 `ODBC-JDBC bridge`，因此需要创建 `DSN`。\n\n15. `PreparedStatement`\
  \ 是一种预解析并编译的语句，在每次执行语句时不需要重新编译。因此，如果预期多次执行，使用 `PreparedStatement` 是有益的。\n\n16. `Callable\
  \ statements` 是 Java 程序中调用存储过程的语句。存储过程是在数据库上执行的一系列语句，结果会被发送给调用的 Java 程序。\n\n17.\
  \ `Servlets` 像 `applets` 一样是位于 Web 服务器上的小型服务端程序，可以扩展互联网上 Web 服务器的功能。\n\n18. `Servelt\
  \ API` 包含 `javax.servlet` 和 `javax.servlet.http`。这些是 `Tomcat servlet-api.jar` 的一部分。\n\
  \n19. 上述的 `ServletRequest` 和 `ServletResponse` 接口接收来自客户端的请求对象并准备发送响应。\n\n20. `Servlet`\
  \ 包定义了两种类型的抽象类：一个属于 `javax.servlet` 的 `GenericServlet`，另一个属于 `javax.servlet.http`\
  \ 包的 `HttpServlet`。\n\n21. `Java beans` 是 Java 提供的一项功能，用于提供此类特性。`Java bean` 是一种可移植、平台独立的组件模型，便于编写高度可重用的组件。\n\
  \n22. Java 程序可以通过名为 `introspection`（内省）的过程发现 `beans` 属性。\n\n23. Bean 信息类实现了 `BeanInfo`\
  \ 接口。`BeanInfo` 类显式地列出了所有要暴露给应用程序构建工具的 bean 特性。\n\n24. `Properties` 是 bean 的外观和行为特征。\n\
  \n25. `Bean events` 可用于 bean 组件之间的通信。\n\n26. `Persistence`（持久化）允许 bean 保存并恢复其状态。\n\
  \n27. `Java beans` 必须是可序列化的。\n\n## 练习题\n\n### 单选题\n\n1. 关于 JDBC 连接，以下哪些描述是正确的？\n\
