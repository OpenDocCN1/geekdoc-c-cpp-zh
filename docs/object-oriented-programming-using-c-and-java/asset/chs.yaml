  ## 18.4 构造函数\n\n### 18.4.1 默认构造函数\n\n当你需要盖房子时，你会去找一位名为建筑师或石匠的专家，让他们准备好房子供居住和使用。类也是如此。当声明一个类并创建一个对象时，就会调用该类的构造函数。它的工作是创建对象，为数据成员分配内存，并在用户提供初始值时用这些值初始化它们。如果用户没有提供初始值，则用默认值进行初始化。同样，如果用户没有声明构造函数，则总是创建一个默认构造函数。构造函数的名称与类名相同，但没有返回值。构造函数默认被视为公共的（public）。每当创建对象时，构造函数就会被调用。\n\
  \n```\n Student Std = new Student(); // 调用了默认构造函数。\n```\n\n### 18.4.2 参数化构造函数和构造函数的重载\n\
  \n当我们在创建对象时传递初始值时，构造函数被称为参数化构造函数：`Student Gautam = new Student (“ Gautam”, 6274,74.00,”A”);`\
  \ 我们通过示例 18.2 中的 `Polar` 类示例来演示构造函数的概念：\n\n**示例 18.2: PassObjConst.java 一个用于显示重载方法的程序**\n\
