  \ 是 `java` J2SE `5.0` 提供的数据结构，用于存储任意数量、任意类型的对象，这些对象可以在运行时决定并分配资源。Vector 相比数组的优点可以总结如下：\n\
  \n- `Vectors` 是动态的，可以用于存储任意数量、任意类型和任意大小的对象。\n- 从 `vector` 中添加和删除对象非常容易，而 `array`\
  \ 中的删除和添加需要重新调整数据。\n\n缺点是只能存储对象而不能直接存储原始数据。因此，我们需要使用 `wrapper class`（包装类）将原始数据类型转换为对象。我们将实现\
  \ `vector class`，因为它在逻辑上与数组相关联，并将剩余的话题留到后续章节处理。\n\n### 17.5.2 Vector 方法\n\n`Vector\
  \ Class` 支持的方法位于表 17.6 中。\n\n**表 17.6** Vector 方法\n\n| 方法 | 备注 |\n| --- | --- |\n\
