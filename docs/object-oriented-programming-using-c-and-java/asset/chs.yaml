  \ 为`在线检查`开发`状态图`。\n\n42. 为`UML`开发`部署图`。\n\n\n\n\n\n## 5.2.2 系统开发生命周期 (SDLC)\n\n\
  SDLC 与结构化系统分析与设计 (SASD) 密切相关。SDLC 也称为瀑布模型。\n\n之所以被称为瀑布模型，因为它看起来像瀑布。它是一个描述信息系统开发过程中所步骤的模型。这一概念由\
  \ Horner 先生于 1993 年引入。\n\n![项目阶段](img/78-1.png)\n**图 5.1** 项目阶段\n\n![SDLC – 瀑布模型](img/79-1.png)\n\
  **图 5.2a** SDLC – 瀑布模型\n\n![结构化分析与设计 – 主要元素](img/80-1.png)\n**图 5.2b** 结构化分析与设计\
  \ – 主要元素\n\n下方了要采取的一系列行动步骤以及每个步骤的交付物：\n\n*   **问题定义：** 用户已准备好问题叙述。在收到用户系统开发的请求后，进行调查以说明要解决的问题。**交付物：**\
  \ 问题陈述。\n*   **可行性研究：** 定义软件项目研究的范围和目标，并建立可选的解决方案。**交付物：** 可行性报告。\n*   **系统分析阶段：**\
  \ 对现有系统进行分析。它是如何运作以及处理什么的。**交付物：** 现有系统的规范。\n*   **系统设计阶段：** 研究规范并准备规范文档，显示为了消除现有系统的缺点还需要做哪些工作。**交付物：**\
  \ 建议系统的规范。\n*   **系统设计（实现）：** 代码开发、用户手册的编写。**交付物：** 程序、其文档和用户手册。\n*   **系统测试与评估：**\
  \ 根据规范对系统进行测试、验证和确认。**交付物：** 测试和评估结果，以及准备交付给用户/客户的系统。\n\n瀑布模型的优点如下：\n\n*   每个阶段结束时都有明确定义的交付物，以便客户对继续继续项目做出决策。\n\
  *   资源可以增量地投入，而不是一次性全部投入。\n*   可以在开发阶段早期发现问题。\n*   详细的阶段性文档。\n\n瀑布模型的缺点如下：\n\n*\
  \   项目需要投入投入。它不是一个增量模型。\n*   问题必须尽早发现。后期阶段发现意味着巨大的成本。\n\n## 5.3 结构化分析与设计 (SASD)\n\
  \nSASD 是一种用于分析业务模型并将其转换为规范的方法，这些规范反过来会被修改计算机程序、硬件和/或手动程序。SASD 作为一种方法，是在结构化编程出现后，于\
  \ 20 世纪 70 年代后期由 DeMarco、Yourdon 和 Constantine 开发的。SASD 的目的是开发一个实用、高质量的信息系统，以满足终端用户的需求。CASE\
  \ 工具是实现 SASD 技术的图形化工具，现在已成为开发 SASD 模型的行业标准。\n\n### 结构化分析与设计的元素：\n\nSASD 涉及的步骤如下：\n\
  \n#### 步骤 0：目的声明\n这是一个清晰简洁的陈述，突出了系统的目的。它是作为概念文档供高层管理使用的，不能用于系统的开发。\n\n**目的声明示例**\
  \ – “农业卡系统”的目的是为银行向农民提供信贷提供一种方法。该系统将处理信贷申请、贷款管理、账单、收回和管理报告的细节。涉及的步骤包括：\n\n*   **步骤\
  \ 1：** 绘制`context 图`（上下文图）以定义项目范围。该图类似于框图，将系统作为一个整体显示，具有一组输入、输出和一个转换系统。系统上下文图的目标是关注在开发整套系统需求和约束条件时应该考虑的外部因素和事件。在图\
  \ 5.7 中，我们提供了了一个学生智能卡应用程序的上下文图。\n\n![信用卡系统的 ERD](img/86-2.png)\n**图 5.7** 信用卡系统的\
  \ ERD\n\n*   **步骤 2：** 这是一个显示现有系统如何运作的文档。它通过绘制现有系统的物理数据流图（`DFDs`）完成，这些图指定了其当前的实现。提出的关键问题是：\n\
  \    *   谁执行什么任务？\n    *   它们是如何以及何时执行的，执行频率是多少？\n    *   数据存储在何处以及如何？\n*   **步骤\
  \ 3：** 此阶段用于建议系统的文档编制。它是关于建议系统将实现什么。系统设计人员将研究现有系统的缺陷，并以逻辑`DFDs`的形式提出修改后的系统。\n* \
  \  **步骤 4：** 在此阶段，通过检查哪种实现符合标准，将`步骤 3`中的逻辑`DFDs`转换为物理`DFDs`。谁将执行各项任务？\n    *   谁执行什么任务？\n\
  \    *   它们是如何以及何时执行的，执行频率是多少？\n    *   数据存储在何处以及如何？\n\n### 5.3.1 概念设计 – 功能建模与数据建模\n\
  \n概念设计包括数据建模和功能建模。数据建模是一种组织数据的技术，而功能建模（也称为过程建模）是一种记录系统过程、输入和输出的技术。概念设计阶段提供了诸等问题的答案：\n\
  \n*   构成建议系统的过程是哪些？\n*   在每个过程中使用了哪些数据？\n*   输入是什么？\n*   输出是什么？\n\n### 5.3.2 模块化设计\n\
  \n建议系统被分解为称为模块的小型独立子系统。这些模块单独设计和编码，然后与其他模块组合以提供建议系统的完整功能。我们将采用自上而下的层次模型，其中层级模块范围较大，低级模块范围较小。分解为模块的设计考虑因素是：\n\
  \n![现有系统和建议系统的 DFDs](img/81-1.png)\n**图 5.3** 现有系统和建议系统的 DFDs\n\n*   由代码行指示的模块大小应该是小的。\n\
  *   模块必须是共享的以避免重复。\n\n### 5.3.3 分析与设计技术与工具\n\n分析部分将涉及将业务模型转换为数据流和控制流。通过使用`DFDs`来实现。数据字典对于描述数据流和控制流至关重要。数据字典（DD）是涉及的主过程功能分解的图形表示。过程规范和指定操作有助于分解为高内聚的子模块，函数之间的耦合导致结构化数据。这些划分的系统反保留了原始设计的约束和规范。SASD\
  \ 技术通过将复杂问题分解为更易处理的小问题来解决复杂问题。该技术可以被称为“分治法”。采用的方法也可以称为“自上而下的方法”。结构化方法的泛分解描述了过程而不定义系统行为，并规定了所需功能的形式。该方法识别了与活动相关的输入输出。结构化分析的结果是一系列相关的图形图、过程描述和数据定义。它们描述了需要发生的转换以及满足系统功能需求所需的数据。\n\
  \n\n\n\n\n此图类似于框图，展示了作为一个整体的系统，一组输入、输出以及一个转换系统。系统上下文图的目的是将注意力集中在开发完整的系统需求和约束时应该被考虑的外部因素和事件上。我们在图\
  \ 5.7 中提供了一个上下文图示例以及一个案例研究。\n\n## 目的\n\n* 突出了系统与外部世界之间的边界\n* 突出了与开发中的系统交互的人员、组织和外部系统\n\
  * 数据流图的特例\n\n## 上文图 – 符号\n\n![image](img/82-1.png)  – 代表提议的系统 ![image](img/82-2.png)\
  \ 流。数据输入/输出\n\n![image](img/82-3.png) 终端 – 代表外部实体\n\n### 5.3.5 事件列表\n\n事件列表的目的是列出设计中的系统应当响应的外部事件/活动列表。这与面向对象分析设计（OOAD）方法中的用例类似。事件可以分类为：\n\
  \n* 由输入数据触发的事件\n* 内部生成的事件\n* 外部不可预测事件\n\n事件列表的示例有：\n\n* 学生完成注册流程\n* 客户支付信用卡账\n\n\
  ### 5.3.6 数据流图\n\n数据流图（DFD）也称为数据流图，用于分析阶段，因为对于理解系统很有用，并且可以在分析期间有效使用。DFD 将功能看作流过系统的数据。DFD\
  \ 突出了从输入阶段到输出阶段通过各种过程的数据转换。\n\n#### 示例 5.1：学生发放成绩单的 DFD\n\n我们将展示准备学生成绩单的 DFD。我们将此系统命名为\
  \ `GradePrep` 系统，如图 5.5 所示。在 `GradePrep` 中，输入和输出为：\n\n![DFD 中的符号](img/83-1.png)\n\
  \n**图 5.4** DFD 中的符号\n\n![向学生发放成绩单的 DFD](img/83-2.png)\n\n**图 5.5** 向学生发放成绩单的 DFD\n\
  \n* 学生个人数据库，存储关于学生的基本信息，如姓名、学号、各科目得分和考勤详情。\n* 成绩规则数据库将存储关于计算成绩的标准的信息，考勤规则数据库包含关于宣布结果所需的强制性出勤的规则等。\n\
  * 学生成绩单是输出内容。\n\n### 5.3.7 数据字典\n\n数据字典或`数据库字典`是一个定义数据库的文件。数据库字典包含：\n\n* 数据库中所有文件和表的列表。\n\
  * 每个文件中记录的数量。\n* 每个数据字段的名称和类型。\n\n数据字典只维护管理数据的信息，但不包含实际数据。数据库管理系统没有数据字典无法运行。我们可以将其称为关于数据的元数据（meta\
  \ data），而不是实际数据。在上面的 DFD 中，我们使用了学生数据库、考勤规则、成绩规则等术语。但这些存储空间中数据的结构究竟是什么。数据字典定义了这些存储空间的数据结构：\n\
  \n```\n • Student Record = roll number + Name + course + Semester + marks1 + marks2\
  \ + marks3 + marks 4 + marks 5 + Attendance percentage\n  • Attendance rule: if\
  \ (attendance > 75) eligible = 1 else eligible = 0\n  • Marks Sheet: roll number\
  \ + Name + course + Semester + marks1 + marks2 + marks3 + marks 4 + marks 5 + Total\
  \ Marks + Grade\n  • Roll Number: digit + digit + digit + digit + digit (根据学号的位数决定数字个数)\n\
  \  • Grade: String “A” 或 “B” 或 “C” 或 “D,” 等。\n```\n\n### 5.3.8 多级 DFD\n\nDFD 和用于\
  \ DFD 的字典已经准备就；我们可以将 DFD 扩展到第二层及后续层次，以更好地理解涉及的过程。对于这项研究，让我们考虑大学或学院的图书馆信息系统（LIS）。学生根据在线检查的可用状态选择书籍进行借阅。图书馆工作人员必须处理借阅请求、验证并确认请求并处理请求。最后，学生凭借书授权单获得书籍，其账户也相应修改。注意，我们在这个案例研究中选择了\
  \ `LIS`，因为你熟悉图书馆运作。我们可以轻松地将该模型替换为任何其他模型，如采购订单系统等。在图 5.6a、b、c 中，我们展示了如何扩展 DFD 以深入了解图书馆借阅部门的运作。首先，检查传入的借阅请求是否有正确的书名、作者姓名和其他信息。在此阶段通过检查学生数据库来检查学生的权限。这一过程在\
  \ DFD 第 2 层中详细说明。最后，借阅过程在 DFD 第 3 层中详细说明。我们为 LIS 借阅部门绘制的 DFD 组所示在图 5.6a、b、c。\n\n\
  ![发放书籍的第一级 DFD](img/85-1.png)\n**图 5.6a** 发放书籍的第一级 DFD\n\n![借阅请求验证的第二级 DFD](img/85-2.png)\n\
  **图 5.6b** 借阅请求验证的第二级 DFD\n\n![处理系统](img/85-3.png)\n**图 5.6c** 处理系统\n\n#### 示例 5.2：图书馆信息系统借还系统的多级\
  \ DFD\n\n第 1 层：总体概念图\n\n第 2 层：扩展第 1 层的过程。在此处，我们将检查借阅请求并验证学生是否有权借书以及书籍是否发放。\n\n第\
  \ 3 层：扩展处理系统\n\n### 5.3.9 实体关系图\n\n实体类似于对象。它是系统中存在的一种事物。它是系统数据布局的图形化表示。它定义了数据元素及其相互关系。\n\
  \n实体关系图 – 符号\n\n![image](img/86-1.png)\n\n让我们研究银行信用卡系统的 ERD。系统中的实体是支付、账单、交易、账户。关系有：\n\
  \n* 用户使用支付交易\n* 账户持有卡片信息\n* 账户生成账单\n* 账单包含交易\n* 账户接收支付\n\n\n\n\n\n- 显示输入对象值与输出对象值之间关系的公式或方程\n\
  - 转换的文本描述\n\n### 2. 与外部实体的接口\n接口规定了系统的输入。规范可以作为检查功能是否满足要求的手段。在在图 4.21 中，我们将功能模型呈现为具有输入、输出和系统转换的系统视图。\n\
  \n操作可以分为系统操作和功能操作。系统操作是那些影响整个系统的操作。例如，从 `ATM` 提取现金会影响整个系统。功能操作则在本质上是局部的，影响该特定模块调用的属性。\n\
  \n### 3. 规范系统操作和功能操作的步骤\n\n- 识别所有的系统/功能操作\n- 对于每个系统操作，说明系统操作名称、输入对象（参数）、转换和输出对象（返回值）。此外，还要说明系统操作的前置条件、后置条件和异常。\n\
  - 准备系统/功能操作表，如下所示：\n\n![image](img/87-2.png)\n\n### 5.3.11 规范约束\n\n功能模型通过图形化表示描述得最为充分。图形化表示无非前面章节中所描述的功能分解，其中两条不同的路径——即\
  \ `control path` 和 `data path`——从上到下流动，覆盖所有分解的模块。\n\n因此，应用于最顶层的所有功能约束也必须应用于分解的较低层级。例如，如果可靠性是顶层模块的约束，那么它也必须是后续模块的约束。接下来将讨论约束及其影响。\n\
  \n- **性能：** 性能标准定义在最顶层。性能决定了操作。操作反过来决定了模块的功能。因此，当顶层模块被分解时，必须确保每个子模块的操作都符合规范。\n-\
  \ **可靠性：** 在软件中，功能模块的可靠性取决于可靠性维度在子分功能模块之间的分布方式，以及用户与这些模块交互的方式。用户操作特征与功能特征之间应该是匹配。\n\
  - **安全性：** 安全问题的出现是因为操作层的用户能够利用某些不是原始顶层规范一部分的功能。\n\n这种漏洞可能在较低的功能层无意中产生。堵住这些漏洞的考虑标准描述如下：\n\
  \n- **访问控制：** 功能分解必须确保只有某些类或用户能够通过授权代码启动并使用功能。\n- **数据完整性：** 数据是首要的，子模块中不允许任何未经授权的访问。合适的加密技术可以解决这些问题。\n\
  - **用户行为控制：** 必须指定功能模块用户的正常行为，任何偏离这种正常和设计流程的行为必须被模块识别，并拒绝对功能模块的进一步利用。\n- **可用性：**\
  \ 我们意识到用户操作分布在各个子模块中，必须保证用户能够随时以可靠的方式并按照预期的规范操作这些模块。我们将这一方面称为功能模块的可用性。可用性意味着我们必须能够根据规范监控功能的运行情况，且该监控应当是可衡量的。\n\
  - **可维护性：** 设计系统的成功取决于模块能够按照规范提供操作的能力。这意味着功能与操作之间的映射必须是可验证且有保障的。我们将这一方面称为系统的可维护性。\n\
  - **关键或非关键功能：** 建议将功能划分为关键或其他非关键，并专注于关键功能，以便操作和功能可以映射并确保规范得到。\n- **与硬件及其他功能模块兼容：**\
  \ 模块的分解必须确保每一层的操作都与硬件规范和其他功能模块兼容。\n\n### 5.4 结构化分析与设计的案例研究\n\n#### 5.4.1 目的示例\n\n\
  学生智能卡系统（`SSCS`）的目的是为学校管理层提供一种手段，向学生提供所有应有的设施。系统将处理费用支付详情、贷款申请详情、图书借阅以及（如有）罚金支付、考勤记录和管理报告。交易信息应对公司会计系统以及学校的学术管理部门可用。\n\
  \n![Context diagram for student smart card system](img/89-1.png)\n\n**图 5.9** 学生智能卡系统上下文图\n\
  \n#### 5.4.2 上文图\n上下文图描述了系统与外部世界之间的边界，并突出了与开发中系统交互的人、组织和外部系统。上下文图所示图 5.7。\n\n###\
  \ 5.4.3 事件列表\n- 学生申请智能卡\n- SSCS 告知学生其欠费\n- 学生缴纳欠费\n- 学生在合作社商店进行交易\n- 学生获得贷款\n- 学生获得信贷\n\
  \n#### 5.4.4 数据流图\n学生请求注册。`SSCS` 系统从财务部门检查学费支付状态，并从学生数据库获取学生记录并处理请求。如果发现符合条件，系统将发布注册过程授权。\n\
  \n![DFD for registration process – SSCS system](img/89-2.png)\n\n**图 5.10a** 注册过程的数据流图\
  \ – SSCS 系统\n\n![DFD for registration request verification](img/90-1.png)\n\n**图\
  \ 5.10b** 注册请求验证的数据流图\n\n![Issue request processing system](img/90-2.png)\n\n**图\
  \ 5.10c** 发放请求处理系统\n\n### 5.4.5 数据字典\n数据字典仅维护管理数据的信息但不但不实际数据。没有数据字典，数据库管理系统无法运行。我们可以将其称为数据的元数据，而不是实际数据。在上述数据流图中，我们使用了学生数据库、促销规则、账户数据库等术语。但这些存储空间中的数据结构到底是什么？数据字典定义了这些存储空间的数据结构：\n\
  \n```\n Student Record = roll number + Name + course + Semester + No of Back lag\
  \ papers weightage\n   Promotion rule: if (backlog paper weightage < 25) eligible\
  \ = 1 else eligible = 0\n   Reg. Authorization Sheet: roll number + Name + Semester\
  \ + courses registered\n   Roll Number: digit + digit + digit + digit + digit (位数与学号位数一样多)\n\
  \   Student Smart Card: Card Number = Uniquely identifies a card\n   Format = digit\
  \ + digit + digit + digit + digit + Hyphen + alphabet\n   Range = 50595 0000 0000\
  \ 0000 to 50595 9999 9999 9999\n```\n\n![ERD diagram for smart card payment system](img/91-1.png)\n\
  \n**图 5.11** 智能卡支付系统的 ER 图\n\n#### 5.4.6 实体关系图\n`SSCS` 中用于学生交易和支付的实体有：支付、账单、交易和账户。关系有：\n\
  \n- 学生使用智能卡支付交易\n- 部门持有智能卡信息\n- 账户生成账单\n- 账单包含交易\n- 账户接收付款\n\n\n\n\n\n### 5.4.7\
  \ 过程规范 – SSCS\n\n* 对于支付，实体过程规范为：\n    * `Read account`\n    * `Read amount`\n  \
  \  * `Add amount to account's credit`\n    * `Add amount to account's balance`\n\
  \    * `Update payment as applied`（根据应用情况更新支付状态）\n\n我们将针对事务、卡片、账户等的余额实体的规范编写留给读者作为练习。\n\
  \n### 5.4.8 结构化分析与设计 – 优缺点\n\n#### 优点\n* 具有清晰的可区分阶段，因此便于项目管理。\n* DFD（数据流图）、ERD（实体关系图）等是易于理解的图形工具。\n\
  * 广泛应用于，技术成熟。\n* 以功能/过程为导向。符合自然的思维过程。\n* 模块化，因此具有活性。\n\n#### 缺点\n* 仅满足功能性需求。忽略了非功能性需求。\n\
  * 用户与分析师之间的交互无法自动化。它是手动的且非迭代的。\n* 需求分析后不存在与用户的沟通。\n* 难以决定何时停止分解。\n\n#### 何时使用结构化分析与设计\n\
  * SASD 最适用于非常熟悉且标准的领域。\n* 已规定 SRS（软件需求说明书）的领域。\n* 在事务处理系统中。\n* 当有足够的开发时间时。\n\n###\
  \ 5.5 面向对象的软件分析与设计 (OOAD)\n\n俗说的 OOAD 是结构化分析与设计以及在其基础上构建的某些面向对象的特性。因此，我们从用户规范开始，并添加以下面向对象的特性：\n\
  * 通过叙述性语句的句法解析提取出对象列表。我们对 DFD 中名词或实体的属性内容感兴趣。\n* 从动词列出系统行为。\n* 对象向其他对象提供的服务。\n*\
  \ 扩展对象以及与其他对象的关系。\n\n#### 5.5.1 用于对象分析的不同模型\n\n在 OOAD 方法论中，与用户的交互非常频繁。它并不会随着规范的绘制和用户签署文档而结束。OOAD\
  \ 方法论依赖于 Rumbaugh、Grady Booch、Coad–Yourdon 以及 Shlaer–Mellor 提出的各种方法论。我们将在下一节回顾这些系统。在复杂项目的开发期间，需求会不断变化，并且需要实施这些变化，很多时候这种因素会导致设计从步骤\
  \ `1` 开始改变。OOAD 的假设是规范会变化，因此遵循迭代开发模式。每个迭代步骤要么添加新步骤，要么修改现有步骤。\n\n#### 5.5.1.1 Rumbaugh\
  \ 方法\n\nRumbaugh 与 OOAD 方法论的发展相关，该方法具有定义良好的分析和设计模型。Rumbaugh 分析部分处理对象建模技术（OMT）。它进一步包含一个研究开发中系统动态行为的模型。Rumbaugh\
  \ 模型还包括功能建模。Rumbaugh 模型与目前讨论的 SASD 技术相似，但增加了对象模型，包括类的定义以及其成员数据、函数，以及它们与其他类的相互作用。动态建模包括状态转换图，显示了对象在事件发生时如何从一个状态变化到另一个状态。功能规范由\
  \ DFD 处理。\n\n#### 5.5.1.2 Booch 方法\n\nBooch 方法论包含一个与 SASD 实践类似的需求分析阶段。此外，Booch 方法论将领域分析阶段作为分析阶段的一部分。Booch\
  \ 方法论拥有强大的设计技术，分为四个部分：\n* 第一部分：逻辑结构设计，其中定义了类层次结构\n* 第二部分：物理结构，描述对象的方法\n* 第三部分：动态建模，显示状态转换和对象转换的分析\n\
  * 第四部分：功能规范\n\n#### 5.5.1.3 Coad–Yourdon 方法\n\n分析阶段被称为 SOSAS，意味着分析和设计阶段的五个步骤：\n\
  * `S` 代表主体（subject）。它意味着 DFD。\n* `O` 代表对象（objects）。识别对象和类层次结构。\n* `S` 代表结构（structure）。它分为继承结构和组合结构。分类基于设计中使用了哪种扩展类的两种方法之一（即继承或组合）。\n\
  * `Attributes`（属性）。\n* 此类向其他类提供的服务。\n\n设计阶段：它由四部分组成：\n* 问题领域。包含属于问题领域的类。\n* 人机交互。\n\
  * 功能管理。识别负责功能和管理的系统级类。\n* 数据管理：系统的属性。\n\n#### 5.5.1.4 Shlaer–Mellor 方法\n\n该模型在系统分析和设计中包含三个部分：\n\
  * 信息模型包含对象、成员数据及其与其他对象的关系。\n* 状态模型包含对象的不同状态以及对象在转换时可能发生的变化。\n* 过程模型负责功能规范。\n\n在我们的书中，我们遵循上述所有方法中的优者。\n\
  \n在 OOAD 中执行的第一项活动是需求收集。与用户的一系列会议为我们提供了涉及问题的叙述。用户根据手动系统运行的经验（对现有系统的缺点）准备了问题陈述，或者使用可用工具编写了用例（use\
  \ cases）。面向对象的类支持抽象、封装、多态和可重用的面向对象原则。`Classes are specifications for objects.` 衍生自用例、问题陈述或叙述，类提供了需求的抽象，并提供了应用程序的内部视图。我们在\
  \ OOAD 中遵循的步骤如下。\n\n#### 5.5.2 识别类\n\n识别类可能是具有挑战性的。选择不当的类会使应用程序逻辑结构复杂化，降低重用性并碍维护。\n\
  * 一旦有了叙述，我们就进行句法解析以识别名词、动词等。建立名词初始列表。将其称为 `候选类`。\n* `Candidate Classes`（候选类）：从中产生实际集合的初始集合。候选类可以通过多种方法识别。下面显示了两种：\n\
  \    * 对叙述、用例或问题描述进行句法解析：识别名词和名词短语、动词和形容词。\n    * 类责任协作（CRC）卡。这是一组卡，列出了类名、其责任（功能）和协作（服务）。\n\
  * 分析候选类。寻找协作类。一个类如何与另一个类关联？如果是协作则保留该类，否则丢弃。\n* 遵循 Coad 和 Yourdon 建议的类选择原则来选择最终类列表。我们将此集合称为设计类。\n\
  \    1. 类是否有保留的信息？\n    2. 类提供的服务是否被其他类需要？\n    3. 类是否有多个属性？\n    4. 类是否有对其他类有用的公共属性？\n\
  \    5. 类是否有对其他类有用的公共操作？\n    6. 类是否属于本质类别被其他类需要？\n\n#### 5.5.3 识别属性\n\n属性定义类的特征。在设计模型中寻找属性时，寻找以下类型：\n\
  1. 寻找描述性属性。\n2. 哪些特征将该类与其他类区分开？\n3. 名称用于唯一标识对象？\n\n\n\n\n\n# 4. 特定对象是如何与其他对象链接的？\n\
  \n## 5.5.4 指定操作\n\n要指定类操作，需要识别每个类执行的操作。此列表源于类的职责。操作规范了类的行为。操作可以分类为：\n\n- 修改器操作：这些操作会修改属性。\n\
  - 状态检查操作：通过检查几个属性的值来检查状态。\n- 转换操作：运行算法或公式。\n- 检查事件发生的操作。\n\n一旦确定了操作和属性，我们就可以完成类的定义。让我们使用大学管理系统来演示面向对象分析设计（OOAD）原则。从叙述中识别出的设计类有：`professor`、`student`、`course`\
  \ 等。\n\n## 5.5.5 推导出关联\n\n关联是识别内聚类的关键。类与其他类相关联或相关。当一个类为其他类提供某些服务，或使用其他类提供的服务时，类之间就会发生关系。关系是类之间的关联。\n\
  \n### 如何识别这些关系？\n\n- 从与许多其他类交互的核心类开始。\n- 提问此类问题：谁对这个类感兴趣？为什么需要这个类？\n- 谁在使用这个类提供的服务？\n\
  \n### 5.5.5.1 从主要关联开始\n\n在我们案例中，我们将从 `professor` 和 `student` 开始。正如我们所学的，关联是连接两个类的实线。\n\
  \n![Professor is associated with student](img/95-1.png)\n\n**图 5.12a** 教授与学生关联\n\
  \n### 5.5.5.2 命名关联通常能阐明关系\n\n![Naming the association](img/95-2.png)\n\n**图 5.12b**\
  \ 命名关联\n\n### 5.5.5.3 强调类在关联中的角色\n\n赋予角色是可选的。但如果赋予了，它必须是类的名词。例如，我们给 `professor`\
  \ 赋予 `teacher` 角色，给 `student` 赋予 `learner` 角色。\n\n![Roles in an association](img/95-3.png)\n\
  \n**图 5.12c** 关联中的角色\n\n### 5.5.5.4 引入多重性因子\n\n角色可以具有多重性关系。多重性指示可以是有条件的或无条件的。例如：\n\
  \n![A professor can teach 0 to many students](img/95-4.png)\n\n**图 5.12d** 教授可以教\
  \ 0 到多个学生\n\n![A student can teach 0 to 1 student](img/95-5.png)\n\n**图 5.12e**\
  \ 学生可以教 0 到 1 个学生\n\n![A professor can have 0 to many students. But a student must\
  \ have at least one professor](img/96-1.png)\n\n**图 5.12f** 教授可以有 0 到多个学生。但学生必须至少有一个教授。\n\
  \n### 5.5.5.5 关联类\n\n当有一组数据不严格属于参与的任何一个一个类时，就需要创建关联类。例如，如果有 `student` 和 `course`\
  \ 两个类，那么 `grade`（成绩）和 `attendance`（出勤）属于哪个类呢？`student` 会获得不同的成绩，每个课程都有不同的出勤分数。我们在哪里存储这类数据？在哪里放置\
  \ `GRADE`？如果我们把它放在 `student` 中，那么 `student` 在所有课程中获得相同的相同的。相反，如果我们把 `grade` 放在 `course`\
  \ 文件中，那么修同一门课程的学生学生获得相同的成绩。\n\n![A student can undertake 0 to many courses](img/96-2.png)\n\
  \n**图 5.13a** 学生可以选 0 到多个课程\n\n解决方案是创建一个 `Association class`。`Association` 类将拥有它自己的属性和方法，以及指向两个参与类的指针和引用。\n\
  \n![An association class](img/96-3.png)\n\n**图 5.13b** 关联类\n\n### 5.5.5.6 组合\n\n\
  类可以包含其他类。例如，`Student` 类可以包含 `Date` 类。这可以被视为整体与部分的关系。部分的生命周期取决于整体的生命周期。这意味着当整体被删除时，部分也会被删除。要决定组合，需要问的问题是：\n\
  \n- 这个类是某些其他类的一部分吗？\n- 当其他类被销毁时，这个类也会被销毁吗？\n\n### 5.5.5.7 聚合\n\n在这里，整体被销毁时部分并不会销毁。这等同于“拥有”类型的关系。例如，计算机有一个\
  \ `microprocessor`（微）。当计算机被销毁时，`microprocessor` 可能不会被销毁。聚合的另一个是：汽车有 `engine`、`wheels`\
  \ 等。关键的问题是：这个类是另一个类的一部分吗，它是否独立于另一个类？\n\n### 5.5.5.8 泛化/专门化\n\n泛化和专门化来源于继承关系。基类可以被视为泛化类，而从基类扩展出来的类是专门派生类。这种关联通常被称为继承，因为派生类继承了基类的功能以提供专门的行为。继承提供了从现有类的属性和行为形成新类的机制。这是一种“是”的关系。识别继承关系的关键问题是：这个类是更通用类的专门化版本吗？\n\
  \n### 5.5.5.9 接口\n\n接口为行为提供了通用规范，但与继承的类不同，接口不能被创建或实例化。接口仅指定了其他类继承的通用行为。这意味着接口只有方法名而没有实现。\n\
  \n## 5.6 OOAD：案例研究\n\n要执行的第一项活动是需求收集。与用户的一系列会议为我们提供了问题的叙述。我们在这里的目标是通过为大学设计一种自动化的申诉处理机制来解决问题。我们将此系统命名为\
  \ `GRCSYS`。一旦有了叙述，我们就会进行语法解析以识别名词、动词等。我们在下面的叙述中展示了名词和动词。在叙述中，名词用**加粗**显示，而动词用*斜体*显示。\n\
  \n大学的申诉处理委员会 (`GRC`) 由申诉处理委员会主席 (`CGRC`) 领导，*调查*（inquires）学生关于女孩相关事务、校园欺凌、学术事务、校园设施相关方面，以及宿舍和食堂的申诉。学生可以*登录到*（log\
  \ on to）既可以在大学内网也可以互联网网站 (`GRCSITE`) 上访问的 `GRCSYS` 网站，并*报告*（report）申诉，说明申诉细节 (`GRCDET`)\
  \ 如学号、班级、课程、申诉类型 (`TGRC`) 和申诉发生日期 (`DOC`)。他们将被*分配*（allocated）申诉令牌号 (`TNO`)。为了*操作*（operating）网络账户，每个学生都提供了一个密码。\n\
  \n当在网上*接收*（received）投诉时，`CGRC` 会*要求*（calls for）`GRC`。GRC 然后*调查*（looks into）申诉，并与相关的教职人员或部门*组织*（organizes）活动，如*组织额外辅导或特殊培训、对违规学生采取行动以及必要的行动*。\n\
  \n行动启动报告 (`AIR`) 和采取采取报告 (`ATR`) 将*启动*（initiated）并通过网站*告知*（informed）学生。网站提供了一个合适的界面，供学生和家长*获取*（get）显示（displaying）`AIR`\
  \ 和 `ATR` 报告，这些报告被称为 `AirReport` 和 `AtrReport`，并在规定的最短时间内 (`TimePeriod`) 内完成。\n\n\
