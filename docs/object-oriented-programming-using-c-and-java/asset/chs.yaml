  \ void DisplayPolar(){\n   25\\.   System.out.println(“Inside DisplayPolar .”);\n\
  \   26\\.   System.out.println(“mag<r> :”+ this.r +”Angle<t>”+ this.t);\n   27\\\
  .   } // 以极坐标和直卡尔坐标形式显示\n   28\\.   }// Polar1 类结束\n   29\\.   class PolarThis1Demo\
