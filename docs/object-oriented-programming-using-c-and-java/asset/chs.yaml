  \n### 学习目标\n\n在本章结束时，你将能够理解并编写：\n* 流（Streams）的概念和类。\n* 使用 `InputStream` 和 `OutputStream`。\n\
  * 随机文件处理。\n* 文件 IO 以及文件 IO 中的错误。\n* 使用 `DataInputStream` 和 `DataOutputStream` 处理原始数据类型。\n\
  * 从文件读取对象并向文件写入对象。\n* 对象流和管道流（Piped Streams）。\n\n### 21.1 介绍\n\n我们都听说过水流；我们称它们从山顶流向平原。在\
  \ Java 中，数据从输出设备到计算机系统以及从计算机到任何一个输出设备的流动被称为 `Stream` 或 `IO streams`。\n\n本章将向你介绍\
  \ `IOStreaming` 的概念以及如 `ByteStream` 和 `CharacterStream` 等流类。我们将为你介绍 `File IO` 的概念。本章还详细讨论了文件\
  \ IO 以及在处理文件时遇到的错误。文件处理的主题包括字符、字节、原始类型和数据流的输入和输出。\n\n### 21.2 IO 流\n\n在 Java 中，IO\
  \ 流是从一个输入设备到内存的字节流，反之亦然。流就像管道。它可以携带管道中的任何东西，无论是原始数据等等。请参考 `Figure 21.1`。\n\n**图\
  \ 21.1** 流 – 一个概念\n\n左侧的图显示了一个带有输入管道和输出管道的水箱。右侧的图显示了从 CD 驱动器输入的输入流和到显示器的输出流。\n\n\
  `Figure 21.1` 详细观察了 IO。例如，Java 源码需要由 JRE 转换以适应计算机系统等输入设备。因此，来自 IO 设备的输入首先被缓冲，然后被计算机系统获取。同样，来自计算机的输出首先被缓冲，然后被打印机、内存等低速设备获取。`Figure\
  \ 21.2` 提供了更详细的 IO 流视图图。\n\n**图 21.2** IO 流 – 详细观察\n\n例如，考虑从键盘输入的情况。为了从键盘读取数据，我们需要挂载\
  \ `InputStream` 来接受来自键盘的输入数据，为了将其放入缓冲区，我们需要 `BufferedReader`。\n\n`DataInputStream`\
  \ 接受来自键盘的数据，`System.in` 代表键盘。因此，我们可以写：\n\n```\nDataInputStream input = new DataInputStream(System.in);\n\
  ```\n\n`Figure 21.3` 显示了从键盘输入的 `InputStream`。系统有三个代表三个不同设备的字段。它们是：\n\n* `System.in`:\
  \ 标准输入来自键盘。它代表 `InputStream` 对象。\n* `System.out`: 控制台由 `System.out` 表示。它代表 `PrintStream`\
  \ 对象。\n* `System.err`: Java 处理输入和输出的流对象，因此可能会遇到错误或异常。`System.err` 用于记录在处理流时发生的错误。\n\
  \n### 21.3 Java IO 流类\n\n在进入 IO 流的细节之前，有必要回顾文件。我们在去的任何地方都会遇到文件。例如，大学为每位学生保留一份文件。同样，市政府持有包含公民需要缴纳税款详情的文件。事实上，文件在我们的生活中非常常见；Java\
  \ 语言和其他语言都支持文件。**什么是文件？** 文件是记录的集合。\n\n`java.io` 包包含了处理文件 IO 的流类。流文件可以分为两类：`ByteStream`\
  \ 类和文本文件（Text Files），也称为 `CharacterStream` 类。这两个流都派自 Java 的 `Object` 类，如 `Figure\
  \ 21.4` 所示。`Table 21.1` 给出了类的详细信息。这些流从源读取并写入目标。\n\n**图 21.4** 输入和输出类的层级结构\n\n**表\
  \ 21.1** Java 流类\n\n| 字节流类 (ByteStream Classes) | 字符流类文本文件 (CharacterStream Classes\
  \ Text Files) |\n| :--- | :--- |\n| `FileInputStream` | `FileReader` |\n| `FileOutputStream`\
  \ | `FileWriter` |\n| `BufferedInputStream` | `BufferedReader` |\n| `BufferedOutputStream`\
  \ | `BufferedWriter` |\n\n### 21.3.1 字节流类的分类\n\n数据表示为字节（8 位）。所有文本文件以及需要通过互联网传输的音频和视频文件都使用\
  \ `ByteStream Classes` 进行存储。`Table 21.2` 提供了输入流和输出类的详细信息。`Table 21.3` 提供了 `InputStream/OutputStream`\
  \ 类的成员方法。\n\n**表 21.2** Java 字节流类 – 分类\n\n**表 21.3** inputstream/outputstream 方法\n\
  \n| InputStream 方法 | OutputStream 方法 |\n| :--- | :--- |\n| `read()`: 读取字节 `read(byte[]\
  \ a)`: 读取数组 `read(byte[] b, int n, int s)`: 从 `s` 读取 `n` 个字节。 | `write()`: 写入字节\
  \ `write(byte[] a)`: 写入数组 `write(byte[] b, int n, int s)`: 从 `s` 写入 `n` 个字节。 |\n\
  | `available()`: 返回字节数 | `close()`: 关闭输出流文件 |\n| `skip(m)`: 跳过输入流中的 `m` 个字节 | `flush()`:\
  \ 刷新输出流文件 |\n| `reset()`: 回到文件开始 | `close()`: 关闭流文件 |\n\n### 21.3.2 字符流类或文本类的分类\n\
  \n数据表示为字符，即两个字节。它们最适合处理所有文本文件。字符流类的分类如 `Table 21.4` 所示。\n\n**表 21.4** Java 字符流类\
  \ – 分类\n\n| Reader (读取器) | Writer (写入器) |\n| :--- | :--- |\n| `BufferedReader` |\
  \ `BufferedWriter` |\n| `CharArrayReader` | `CharArrayWriter` |\n| `FilterReader:PushbackReader`\
  \ | `Filter Writer:PrintWriter` |\n| `InputStreamReaderFileReader` | `OutputStreamWriterFileWriter`\
  \ |\n| `PipedReader` | `PipedWriter` |\n| `StringReader` | `StringWriter` |\n\n\n\
  \n\n\n注意 `DataInputStream` 是一个用于读取原始数据的有用类。它继承自 `FilterInputStream` 并实现了 `DataInput`。因此，它支持：`readShort()`，`readInt()`，`readDouble()`，`readLong()`，`readLine()`，`readLong()`，`readFloat()`，`readChar()`，`readBoolean()`\
  \ 以及一个名为 `readUTF()` 的统一文本格式。请参考图 21.5。\n\n![使用 FileOutputStream 从键盘输出到文件](img/510-1.png)\n\
