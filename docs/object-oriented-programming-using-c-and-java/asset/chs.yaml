  \ : ʺRameshʺ idNo : 50595\n   String = Credits :20000.00 debits : 2000.00 NetPay\
  \ 17000.00\n```\n\n### 17.3.1 数组的声明与创建\n\nJava 提供了两种方法来声明数组。第一种方法涉及两个步骤：\n\n**第\
  \ 1 步：** 使用语法 `datatype []` 声明数组，例如：\n```\nint[] name\n```\n\n**第 2 步：** 使用语法 `name\
  \ = new datatype[size]` 创建数组，例如，我们分配空间：\n```java\nint[size]\n```\n\n注意声明和第 2 步可以组合，我们将如下创建：\n\
  \n```java\nint[] name = new int[size];\n```\n\n第二种方法用于你想使用初始值来声明数组时。使用语法 `datatype\
  \ name = {初始化列表}`。例如：\n\n```java\nint[] name = {40,50,60,70,80,90};\n```\n\n或者使用\
  \ `new`：\n\n```java\nint[] name = new int[]{40,50,60,70,80,90};\n```\n\n上述两种声明都是有效的，我们不需要指定数组的大小。编译器将根据初始化列表计算数组的大小。\n\
  \n### 17.3.2 数组初始化\n\n*   如果数组规模较小，可以使用单行进行动态声明和分配：`int[] myArray = new int[5] {10,20,30,40,50};`\n\
  *   如果数组很大，我们将使用 for 循环输入数据：\n\n```java\nint[] myArray = new int[size];\nString\
  \ input;\nBufferedReader in;\nin=new BufferedReader(new InputStreamReader(System.in));\n\
  for ( int i =0; i<size; i++) {\n    System.out.println(\" Enter Array [\" + i +\
  \ \"] element\");\n    input=in.readLine();\n    myArray[i] = Integer.parseInt(input);\n\
  } // 循环结束\n```\n\n### 17.3.3 数组在内存中是如何存储？\n\n考虑一个名为 `x` 的数组，声明为 `int[] x = new int[]{80,90,100,50,65,70};`。\n\
  \n上面地址是虚拟地址。使用 `size` 运算符会告诉我们你的硬件上 `int` 数据类型的内存需求。假设它是 24 字节，数组元素的内存如图 17.3 所示。\n\
  \n![Representation arrays with memory locations](img/401.png)\n\n**图 17.3** 数组元素的内存表示\n\
  \n### 17.3.4 访问和修改数组元素\n\n\n\n\n\n要访问数组中的元素，必须提供数组名和该元素在数组中的索引。数组索引从 0 开始，到 `array\
  \ length –1`，其中索引 `0` 是第一个元素，索引 `length –1` 是最后一个元素。例如，在图 17.3 中，`marks` 数组的长度为\
  \ 6，因此索引范围从 0 到 5。访问数组元素的通用语法为 `arrayname[expression]`。至关重要的是`expression` 的值必须是一个整数，且该值必须在数组索引的范围内，即\
  \ `[0, length–1]`，否则我们将遇到数组越界异常。让我们来看几个访问数组元素的示例；以下所有语句均使用图 17.2 所示的 `marks` 数组。\n\
  \n```\nmarks[3] = 50 // 语句将 marks 数组中索引为 3 的存储的值改为 50\nval = marks[2] // 语句将索引为\
  \ 2 处的值 (100) 存变量 val\nint index = 6\nmarks[index -1] = 70 // 括号内的表达式求值为 4，等同于 marks[5]\
  \ = 75\nmarks[index +1] = 10 // 表达式求值为 7，因此得到数组越界异常\n```\n\nJava 为我们提供了一个 `length`\
  \ 属性，通过它可以在运行时获取数组的长度。获取数组长度的语法为 `arrayname.length`。如例例所示，在使用 `for` 循环处理数组元素时，`length`\
  \ 属性的使用特别有用。\n\n**示例 17.6: TestArrayLength.java 获取数组长度**\n\n```\n 1\\.  package\
  \ com.oops.chap17;\n   2\\.  public class ArrayLengthTest {\n   3\\.  public static\
  \ void main(String[] args) {\n   4\\.  int[] arr = new int[]{10,20,30,40,50,60,70};\n\
  \   5\\.  System.out.println(ʺ Given Array…………ʺ);\n   6\\.  for(int i = 0; i < arr.length\
  \ ; i++ )\n   7\\.  { System.out.print(arr[i] + ʺ, ʺ );}\n   8\\.  System.out.println(ʺ\\\
  nGiven Array Length :ʺ +arr.length);\n   9\\.  }\n   10\\. }\n   Output: Given Array…………\n\
  \   10, 20, 30, 40, 50, 60, 70,\n   Given Array Length :7\n```\n\n| **第 6 行:** |\
  \ 显示了 `arr.length` 的用法。在这里 `arr.length` 返回数组 `arr` 的长度。 |\n\n### 17.3.5 将数组作为参数传递给方法\n\
  \n数组可以作为参数传递给函数。定义带有数组作为参数的方法请使用以下语法：\n\n```\n ReturnType MethodName(datatype[]\
  \ arrayname).\n```\n\n在调用函数中将数组作为参数传递时使用以下语法：\n\n```\n MethodName(arrayname),\n\
  ```\n\n即使用不带括号的数组名。在下方所示的示例 17.7 程序中，当我们通过调用将数组传递给函数时，数组是通过引用传递的。\n\n**示例 17.7:\
  \ SortIntArray.java: 通过向方法发送数组对整数数组排序**\n\n```\n 1\\. package com.oops.chap17;\n\
  \   2\\. class IntSort1{\n   3\\. public void Sort(int myArray[], int len){\n  \
  \ 4\\. int temp;\n   5\\. for(int i=0; i <len-1; i++){\n   6\\. for ( int j=i+1;\
  \ j<len; j++){\n   7\\. if(myArray[i]<myArray[j]){ //交换\n   8\\. temp=myArray[i];\
  \ myArray[i]=myArray[j]; myArray[j]=temp; }//if 结束\n   9\\. }// 内层 for 循环结束\n  \
  \ 10\\.   }// 外层 for 循环结束\n   11\\.   }// 方法 Sort 结束\n   12\\.   }// 类 IntSort 结束\n\
