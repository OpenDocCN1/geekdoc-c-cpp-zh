  \ |\n\n### 17.3.8 Java.util.Arrays 类\n\n`java.util` 包提供了一个非常有用的集合类 `Arrays` 类。`Arrays`\
  \ 类定义了几个静态方法，可以直接使用而无需创建对象。这里讨论了 `Arrays` 类的一些重要且实用的静态方法。请注意，我们只展示一个基本数据类型的示例，但其语法和概念同样适用于其他数据类型。表\
  \ 17.2 中的类型]指的是基本数据类型，例如 `int`。\n\n**表 17.2** Arrays 类静态方法\n\n| Arrays 类静态方法 | 功能\
  \ |\n| --- | --- |\n| `static binarySearch(array[], val);` | 可用于排序后的数组。使用二分查找方法\
  \ |\n| `static boolean equals(array1[], array2[]);` | 如果两个数组相等则返回 true |\n| `static\
  \ boolean deepEquals(Object obj1,Object[] obj2)` | 如果两个数组及其嵌套数组都相等则返回 true |\n|\
  \ `static void sort(array[]);` | 对数组进行排序。指定数组中排序的范围。 |\n| `static void fill(array[],\
  \ val);` | 用 `val` 填充数组的所有元素。如果索引超出范围，则抛出 `ArrayIndexException` |\n\n**示例 17.10:\
  \ ArraysClassDemo.java: Arrays 静态方法的用法**\n\n```java\npackage com.oops.chap17;\n\
  import java.io.*;\nimport java.util;\nclass ArraysDemo {\n    public static void\
  \ main(String[] args)\n    throws IOException {\n        int[] myArray = new int[5];\
  \ //定义数组\n        for (int i=0;i<myArray.length;i++)\n            myArray[i]=i*2;\
  \ //为数组赋值\n        System.out.println(\"Array before sorting:\");\n        for (int\
  \ i=0;i<myArray.length;i++)\n            System.out.print(myArray[i] + \" \");\n\
  \        Arrays.sort(myArray); //排序\n        System.out.println(\"\\nArray after\
  \ sorting:\");\n        for (int i=0;i<myArray.length;i++)\n            System.out.print(myArray[i]\
  \ + \" \");\n        Arrays.fill(myArray,0); //填充数组\n        System.out.println(\"\
  \\nArray after filling:\");\n        for (int i=0;i<myArray.length;i++)\n      \
  \      System.out.print(myArray[i] + \" \");\n        int pos = Arrays.binarySearch(myArray,4);\
  \ //二分查找\n        System.out.println(\"\\nIndex of 4: \" + pos);\n    }\n}\n```\n\
  输出 : 排序前的数组:\n0 2 4 6 8 \n排序后的数组:\n0 2 4 6 8 \n填充后的数组:\n0 0 0 0 0 \n4 的索引: -1\n\n\
  #### 17.4 String\n\n`String` 是字符数组或字符序列。在 Java 中，`String` 占据着重要的地位，因为 Java 是一种为了网络而设计的语言，我们在网络上传输数据需要使用\
  \ `String`。它们由 `String` 类和 `StringBuffer` 类实现。我们可以使用以下三种方法之一创建一个 `String` 对象：\n\n\
  **方法 1：** `String name ; name = new String(\"Hello Class\");`\n\n或者将这两个语句合并为一个一个\n\
  \n```java\nString name = new String(\"Hello Class\");\n```\n\n**方法 2：** 将字符数组转换为\
  \ `String`。\n\n```java\nchar x[] = {'G',''o',''o',''d'};\n           String stg\
  \ = new String (stg);\n```\n\n**方法 3：** `String name = \" Hello Class \";`\n\n`String`\
  \ 中有两个重要且被广泛使用的方法。\n\n```java\n int len = name.length() // 获取 String name 的长度\n\
  ```\n\n字符串可以像下面所示进行拼接：\n\n```java\n System.out.println ( name + \" \" + x); // 输出\
  \ Hello Class Good\n```\n\n### 17.4.1 字符串数组\n\n\n\n\n我们可以创建一个 `Strings` 数组。例如，我们想要创建一个包含\
