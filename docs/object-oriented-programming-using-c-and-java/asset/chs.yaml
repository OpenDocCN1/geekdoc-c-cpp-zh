  \n## 6.1 引言\n\n为了解决问题，你需要“方法/过程”或“经验”。在计算机术语中，这可以被称为算法。算法或程序是遵循的步骤序列，遵循这些步骤后可以得到所需的输出。步骤序列可以被称为过程。\n\
  \n为了解决复杂问题，我们需要一个包含良好集成且内聚的编程元素、构造和数据结构的编程环境。以 C 语言为实现语言的结构化编程范式非常成功且流行。\n\n程序员生产率低由于用户需求、项目复杂性以及缺乏扩展性和重用特性等因素，这是项目无法按时完成的主要因素。面向对象编程（OOP）通过继承、标准模板库（STL）形式的函数承诺了广泛的重用特性。\n\
  \n#### 6.2 C++ 等面向对象语言的历史与发展\n\n\n\n\nOOP 风格分为两种类型，即基于对象的编程和面向对象的编程。在 OOP 范式中，对象是核心。面向对象的编程（如\
  \ `C++`）使用对象并通过调用成员函数来实现它们之间的交互。图 6.1 显示了持有数据和成员函数的对象。其特性包括数据隐藏、数据抽象、封装、继承和多态。\n\
  \n![OOP 范式中的数据和方法](img/108-1.png)\n\n**图 6.1** OOP 范式中的数据和方法\n\n## OOP 范式的显著特征\n\
  \n*   数据封装\n*   数据隐藏\n*   运算符重载\n*   对象的初始化以及使用后的自动清理\n*   动态绑定\n*   广泛且定义良好的的标准模板库\n\
  \n## 6.4 欢迎学习 C++ 语言\n\n我们希望让你对 `C++` 语言感到相当自如。我们的理念是让你从第一天起就能高效工作。在绪介绍章节中，就准备好开启一段精彩的\
