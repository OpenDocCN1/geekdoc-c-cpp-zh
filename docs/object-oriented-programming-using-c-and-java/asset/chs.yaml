  \ r=rd;}\n   11\\.   public void Sett( double td){ t=td;}\n   12\\.   public void\
  \ Seta( double ad){ a=ad;}\n   13\\.   public void Setb( double bd){ b=bd;}\n  \
  \ 14\\.   //构造函数\n   15\\.   //默认构造函数\n   16\\.   Polar2() {\n   17\\.   System.out.println“Polar2\
  \ Default constructor….”);\n   18\\.   Setr(0.0);Sett(0.0);Seta(0.0);Setb(0.0);}\n\
  \   19\\.   //参数化构造函数\n   20\\.   Polar2(double ad, double bd){\n   21\\.   System.out.println“parameterized(a\
