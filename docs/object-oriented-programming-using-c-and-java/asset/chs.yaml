  \ “X²” + “+” + b+ “*”+ “X”+”+”+c);\n9. d = ((b*b)-(4*a*c));\n10. if (d<0)\n11. {\
  \ System.out.println“由于 d<0，无实数解”);\n12. System.out.println“根是虚数\\n”);\n13. double\
  \ sqrd= (double)Math.sqrt(-d/(2*a));\n14. double real = (double)(-b)/(double)(2*a);\n\
  15. System.out.println( “root1 : “+ real + “+ i “+ (float)(sqrd));\n16. System.out.println(\
  \ “root1 : “+ real + “- i “+ (float)(sqrd));\n17. }\n18. if(d==0)\n19. { System.out.println“根是实数\\\
  n”);\n20. System.out.println“root1&2 相等 ”+ (float)-b/(2*a));\n21. }\n22. else\n\
