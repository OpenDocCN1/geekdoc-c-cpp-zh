  \n`For` 循环作为控制循环适用于循环需要执行的确切次数的情况。`for` 循环的语法为\n\n```cpp\nfor ( exp1 ; exp2 ; exp3)\n\
  \  {\n语句块\n  }\n  其中 exp1 是初始化块\n  exp2 是条件测试块\n  exp3 是赋值给 exp1 的修改\n```\n\n`Forever`\
  \ 循环如下所示：\n\n```cpp\nfor ( ; )\n  {\n    语句;\n  }\n```\n\n`for` 循环可以嵌套。这意味着我们可以在\
  \ `for` 循环内部编写 `for` 循环。在嵌套的 `for` 循环中，内部循环会为外部循环的每个值执行一次。例如，内部循环在 `i=0` 时执行，`j`\
  \ 的值从 `0` 开始变化。外部循环执行从 `0` 到 `n-1` 的值。语法为\n\n```cpp\nfor ( int i=0;i<n;i++)\n  {\n\
  \   for (int j=0;j<n;j++) {\n   语句\n }\n```\n\n# 示例 7.12: sumfor.cpp // 使用循环计算 n\
  \ 个数的和和平均值\n\n```cpp\n#include<iostream>\n#include<conio.h>// 用于 getch() 和 clrscr()\
  \ 的控制输入输出\nusing namespace std;\nvoid main()\n{\n   int n;\n   int num ,sum = 0,\
  \ avg=0,count;\n   // 输入 N\n   cout<<”\\n 输入<N> 的值：”;\n   cin>>n;\n   // 控制循环\n\
  \   for(count=1; count<=n ; count++)\n   {cout<<”\\n 输入第 ”<<count<<“个数字：”;\n   cin>>num;\n\
  \   sum+=num;\n   avg=sum/n;\n   cout<<”\\n ”<<n<<“ 个数的和 =”<<sum<<endl;\n   cout<<”\\\
  n ”<<n<<“ 个数字的平均值 =”<<avg<<endl;\n   getch();\n} // main 结束\n/*输出：输入<N> 的值：3\n \
  \ 输入第 1 个数字 67\n  输入第 2 个数字 76\n  输入第 3 个数字 87\n  3 个数的和=230\n  3 个数字的平均值=76*/\n\
  ```\n\n# 示例 7.13: nestedfor.cpp 演示嵌套循环的程序\n\n```cpp\n#include<iostream>\n#include<conio.h>//\
  \ 用于 getch() 和 clrscr() 的控制输入输出\nusing namespace std;\nvoid main()\n{ int i , j\
  \ ; // 外部和内部循环的计数器\nfor (i=15; i<16; i++) // 外部循环\n{\n   cout<<”\\n ”<<i<<“ X ”<<20<<endl;\n\
  \   for (j=15; j<20 ; j++) // 内部循环\n         {\n         cout<<endl<<i<<“ X = ”<<i*j;\n\
  \         } // 内部循环结束\n   } // 外部循环结束\n  } // main 结束\n/*输出：15 X 20 的乘法表\n15 X 15\
  \ = 225\n15 X 16 = 240\n15 X 17 = 255\n15 X 18 = 270\n15 X 19 = 285 */\n```\n\n\
  ## 7.8.6 何时使用 For 或 While 或 Do-while\n\n`For 循环` 最适用于程序员对初始化和需要满足的最终条件有确切了解的情况。\n\
  \n```cpp\nfor ( exp1 ; exp2 ; exp3)\n  {\n   语句块\n  }\n其中 exp1 是初始化块\n  exp2 是条件测试块\n\
  \  exp3 是赋值给 exp1 的修改\n```\n\n上述 `for` 循环等于以下 `while` 循环。当程序员不知道 `while` 块是否会执行时，使用\
  \ `while 循环`。换句话说，在我们必须先检查条件再执行块的情况下，使用 `while 循环`。\n\n```cpp\nexp1;\n  while(exp2)\n\
  \  {语句;\n  }\n```\n\n另一方面，`Do-while 循环` 适用于我们知道块至少执行一次的情况。换句话说，在我们必须执行块后再检查条件的情况下。\n\
  \n## 7.9 Break 和 Continue\n\n### 7.9.1 Break\n\n`Break 语句` 用于退出 `switch` 控制或控制循环。我们可以使用\
  \ `break 语句`退出 `for`、`while` 和 `do-while`。你已经已经在 `switch` 语句中看到了 `break` 的用法。观察下方\
  \ `if` 语句中如何使用 `break`：\n\n# 示例 7.14: break.cpp 演示 break 语句的程序\n\n```cpp\n#include<iostream>\n\
  #include<conio.h>// 用于 getch() 和 clrscr() 的控制输入输出\nusing namespace std;\nvoid main()\n\
  {\n  int count=0;\n  int sum,num;\n  for ( ;>>) // 无限 for 循环\n  { if(count == 5)\n\
  \   { cout<<”\\n 达到上限 5：退出 for 循环”;\n         break;\n   }\n   else\n   {\n    \
  \     cout<<”\\n 输入第 ”<<count+1<<“数字：”;\n         cin>>num;\n         sum+=num;\n\
  \         count++;\n   }\n  } // for 结束\n} // main 结束\n/*输出\n  输入第 1 个数字：89\n  输入第\
  \ 2 个数字：90\n  输入第 3 个数字：91\n  输入第 4 个数字：92\n  输入第 5 个数字：93\n  达到上限 5：退出 for 循环*/\n\
  ```\n\n### 7.9.2 Continue 语句\n\n`Continue` 用于我们希望停止处理后续循环语句并从控制循环的开始开始。在下所示示例中，我们想为\
  \ 0 到 10 之间的所有奇数增加 10 分，并跳过偶数。\n\n\n\n\n\n```cpp\n#include<iostream>\n#include<conio.h>//\
  \ 用于 getch() 和 clrscr() 的控制台输入输出\nusing namespace std;\nvoid main()\n{\n  int count;\n\
  \  for (count=0;count<=10;count++)\n  {\n    if((count %2)== 0) // 偶数。\n    {\n\
  \      cout<<”\\n even number: continue at the beginning if for loop: “<<count<<endl;\n\
  \      continue; // 控制回到 for 循环的开头\n    } // if 结束\n    else\n    {\n      cout<<”\\\
  n odd number : “<<count<<endl;\n    }\n  } // for 结束\n} // main 函数结束\n/*输出 even\
  \ number: continue at the beginning if for loop: 0\nodd number : 1\neven number:\
  \ continue at the beginning if for loop: 2\nodd number : 3\neven number: continue\
  \ at the beginning if for loop: 4\nodd number : 5\neven number: continue at the\
  \ beginning if for loop: 6\nodd number : 7\neven number: continue at the beginning\
  \ if for loop: 8\nodd number : 9\neven number: continue at the beginning if for\
  \ loop: 10*/\n```\n\n### 7.9.3 Goto 语句\n\n由于担心 `goto` 会导致程序无结构，“goto` 语句很少使用。`goto`\
  \ 语句可以是有条件的也可以是无条件的。其语法如下：\n\n```cpp\n goto label // 无条件分支\n```\n\n#### 示例 7.16:\
  \ goto.cpp 展示 goto 语句\n\n```cpp\n#include<iostream>\n#include<conio.h>// 用于 getch()\
  \ 和 clrscr() 的控制台输入输出\nusing namespace std;\nvoid main()\n{\n  int num ,sum=0,count=0;\n\
  \  start: cout<<”\\n Enter value of <number> number :”;\n       cin>>num;\n    \
  \   sum+=num;\n       count++;\n       cout<<”\\n number: “<<num<<endl;\n      \
  \ if ( count > 3)\n        goto stop1;\n  else\n        goto start;\n  stop1: cout<<”\\\
  n exiting the main program”<<endl;\n} // main 结束\n/*输出\nEnter value of <number>\
  \ number :55\nnumber: 55\nEnter value of <number> number :67\nnumber: 67\nEnter\
  \ value of <number> number :54\nnumber: 54\nEnter value of <number> number :65\n\
  number: 65\nexiting the main program*/\n```\n\n我们不建议使用 `goto`。习惯使用 `while`、`do-while`\
  \ 和 `for` 循环来实现相同的结果总是更好的。\n\n### 7.9.4 Exit 函数\n\n你可以通过 `exit()` 函数强制程序停止正在执行的操作并将控制权返回给操作系统。要使用此函数，你必须在包含部分包含\
  \ `stdlib.h`。\n\n```cpp\n exit(0); // 成功完成后返回操作系统(os)\n exit(1); // 运行失败时返回操作系统\n\
  ```\n\n## 7.10 总结\n\n1. 标记（token）是程序中最小的独立单元。\n2. C++ 有三种类型的整数常量，即十进制、八进制常量和十六进制常量。\n\
