  \ 目录如图 15.7 所示`bin` 目录包含了编译器和启动器。我们将在 `JDK1.6.0` 环境演示所有的程序。\n\n![安装 JDK 15.0.20\
  \ 的目录结构](img/343-1.png)\n\n**图 15.7** 安装 JDK 15.0.20 的目录结构\n\n### 15.6.2 设置 Path\
  \ 和 Classpath\n\n为 `JDK1.6.0_20` 设置环境变量非常重要，这样编译和执行才能非常顺畅。有两个环境变量需要设置。当然，如果不设置这些环境变量，你的程序也可以运行，但每次都必须指定路径和路径，这会非常疲惫且繁琐。因此，我们建议永久设置这些变量，以便在系统启动时可用。\n\
  \n\n\n\n假设我们要在 C 盘下创建一个名为“Oopsjava”的文件夹，并在该文件夹内创建一个名为“examples”的独立文件夹。在“examples”文件夹内部，创建了两个子文件夹，分别为\
  \ `bin` 和 `src`。`bin` 文件夹将存放所有的编译后的代码。在 Java 环境中，存放编译代码的文件被称为类文件（class file），其扩展名为\
