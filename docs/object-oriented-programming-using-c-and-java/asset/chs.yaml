  \ |\n\n### 21.10 对象的序列化与对象流\n\n序列化（Serialization）意味着将对象存储到文件中。反序列化（De-serialization）是序列化的逆过程，意味着从文件中获取内存中的类对象。要被序列化的文件必须实现一个名为\
  \ `Serializable` 的接口。将对象存储在文件中并读回对象涉及如 `ObjectOutputStream` 和 `ObjectInputStream`\
  \ 等对象流。涉及的步骤如下所示。\n\n#### 21.10.1 序列化\n\n| **步骤 1:** | 定义一个类并创建一个对象 `class Student\
  \ implements Serializable{{private : idNo; String name;} Student std=new Student()`\
  \ |\n| **步骤 2:** | 使用 `FileOutputStream`：`FileOutputStream fosobj= new FileOutputStream“std,dat”)`\
  \ |\n| **步骤 3:** | 使用 `ObjectOutputStream`：`ObjectOutputStream objoutstream = new\
  \ ObjectOutputStream( fosobj)` |\n| **步骤 4:** | 使用 `FileOutputStream` 的 `writeObject()`\
  \ 方法写入文件 |\n\n注意，`Serializable` 接口没有任何方法。它被 Java 用来标记文件为可序列化的（`Serializable`），即要写入文件的文件。静态变量不能被序列化。\n\
  \n#### 21.10.2 反序列化\n\n| **步骤 1:** | 定义一个类并创建一个对象 `class Student implements Serializable{{private\
  \ : idNo; String name;} Student std=new Student()` |\n| **步骤 2:** | 使用 `FileInputStream`：`FileInputStream\
  \ fisobj= new FileInputStream“std,dat”)` |\n| **步骤 3:** | 使用 `ObjectOutputStream`：`ObjectOutputStream\
  \ objoutstream = new ObjectOutputStream( fosobj)` |\n| **步骤 4:** | 使用 `FileInputStream`\
  \ 的 `readObject()` 方法读取文件 |\n\n**示例 21.6：SerializableDemo.Java 展示对象序列化与反序列化的程序**\n\
  \n```\n 1\\. package com.oops.chap21;\n   2\\. import java.io.*;\n   3\\. class\
  \ Student implements Serializable {\n   4\\. //成员数据或属性\n   5\\. private int idNo=50595;\n\
  \   6\\. private double totalMarks=990.0;\n   7\\. private String grade=”A”;\n \
  \  8\\. public double getMarks(){ return totalMarks;}\n   9\\. public int getIdNo(){\
  \ return idNo;}\n   10\\. public String getGrade(){ return grade;}\n   11\\. public\
  \ void DisplayData(Student std) {\n   12\\. System.out.println“Details from Student\
  \ are”);\n   13\\. System.out.println(\"idNo:” + std.getIdNo());\n   14\\. System.out.println(\"\
  Total Marks:” + std.getMarks());\n   15\\. System.out.println(\"Grade:” + std.getGrade());\n\
  \   16\\. }//DisplayData 结束\n   17\\. }//类结束\n   18\\. //驱动类\n   19\\. class SerializableDemo\
  \ {\n   20\\. public static void main(String[] args)throws IOException{\n   21\\\
  . //创建 Student 对象\n   22\\. Student std = new Student();\n   23\\. System.out.println“Displaying\
  \ Data from Student class…..);\n   24\\. std.DisplayData(std);\n   25\\. FileOutputStream\
  \ fosobj= new FileOutputStream“std.dat”);\n   26\\. ObjectOutputStream objoutstream\
  \ = new ObjectOutputStream(fosobj);\n   27\\. objoutstream.writeObject(std);\n \
  \  28\\. objoutstream.close();\n   29\\. System.out.println“Reading from Serialized\
  \ Object….”);\n   30\\. FileInputStream fisobj= new FileInputStream“std.dat”);\n\
  \   31\\. ObjectInputStream objinstream = new ObjectInputStream(fisobj);\n   32\\\
  . try{\n   33\\. std =(Student)objinstream.readObject();\n   34\\. }catch(ClassNotFoundException\
