  \n## 14.3 模板类\n\n假设我们实现了一个栈——一种后进先出的数据结构——来存储整数。然后我们通过剪切粘贴策略修改并实现了一个浮点数栈。现在，如果我们需要订单栈，该怎么办呢？继续通过剪切粘贴来复制吗！这并不是\
  \ C++ 所承诺的重用性。当逻辑相同但数据集不同时，模板类非常有用。例如，如果我们有一个 `Stack` 类的类模板，我们就可以在 `Stack` 上存储整数、浮点数和学生对象。同样，以模板形式表示的数组允许我们存储整数数组或学生数组等。模板类的主要优势在于，如果你声明了一个类模板，你就可以将其存储在目录中，并在程序开发需要时通过通过在需要时创建对象实例来使用这些类模板定义。正是这种重用性概念对开发者具有巨大的价值。这一方面将在后续关于标准模板库的章节中进行详细研究。\n\
  \n`Stack` 是问题求解中最广泛使用的自定义结构。C++ 模板允许我们实现一个带有类型参数 `T` 的通用 `Stack<T>` 模板。`T` 可以在运行时替换为实际类型，例如\
  \ `Stack<int>`，C++ 将生成类 `Stack<int>`。我们还创建创建诸如 `Stack<float>`、`Stack<Student>` 和\
  \ `Stack<char>` 等类。定义一次模板，并使用它来创建不同内置类型和用户定义数据类型的类。合并更改非常容易，因为一旦在模板 `Stack<T>` 中实现了更改，这些更改将立即反映在所有类——`Stack<float>`、`Stack<Student>`\
  \ 和 `Stack<char>` 中。我们的下一个示例将加强这些重要概念。\n\n### 示例 14.1：模板类 – 栈\n\n类模板的定义与普通类的定义一样。它的前面前面有关键字\
  \ `template`。例如，这里是 `Stack` 类模板的定义。注意 `T` 是一个参数值，它随着我们创建的每个类实例而改变。单词 `class` 是一个关键字，指定\
  \ `T` 是一个用于表示参数类型 (`T`) 的参数。我们可以在 `void main` 部分如下创建 `int`、`float` 和 `Students`\
  \ 的实例：\n\n```\n Stack<int> I; // 整数栈\n   Stack<float> F; // 浮点数栈\n   Stack<Student>\
  \ stdStack; // 学生栈\n```\n\n注意，我们可以在程序的任何地方将 `Stack<int>` 或 `Stack <float>` 等作为数据类型，就像你使用普通数据类型一样，例如传递参数、接收返回值等。下面所示的\
  \ `Stack` 类与其他类类似，只是参数类型 `T` 被用作数据类型：\n\n```\n 1\\. template <class T>\n   2\\.\
  \ class Stack\n   3\\. {public:Stack(); //默认构造函数\n   4\\. Stack(const Stack&); //拷贝构造函数\n\
  \   5\\. ~Stack(){ delete [] stack_array;} //析构函数\n   6\\. Stack& operator=(const\
  \ Stack&);//赋值运算符\n   7\\. int Size() const;\n   8\\. int empty() const; //如果栈为空则返回\
  \ 1\n   9\\. T& top(); //返回栈顶\n   10\\. void pop(); //弹出栈顶\n   11\\. void push(const\
  \ T&); //入栈\n   12\\. template<class T>\n   13\\. friend ostream & operator<<(ostream\
  \ & out1,Stack<T>&S);\n   14\\. private:\n   15\\. T *stack_array; // 整数、双精度、学生数据栈数组\n\
  \   16\\. int tos;\n   17\\. int stack_size; // 栈大小\n   18\\. };\n```\n\n通常，如果你在类内部声明并定义任何函数，例如，如下所示的\
  \ `Stack` 构造函数，那么就不需要使用参数类型 `T` 了：\n\n```\n Stack<T> :: Stack() { stack_array =\
  \ new T[max]; stack_size = max; tos = -1;}\n```\n\n但如果你在类外定义，你必须使用如下所示的限定符：\n  \
  \ ```\n   template <class T>\n   Stack<T> :: Stack(){ stack_array = new T[max];\
  \ stack_size = max; tos = -1;}\n```\n\n我们如下所示定义赋值运算符：\n\n```\n template <class T>\n\
  \   Stack<T>& Stack<T> :: operator=(const Stack& S)\n   { stack_array = new T[S.stack_size];\n\
  \   tos = S.tos;\n   stack_size = S.stack_size;\n   for(int i =0 ; i<size; i++)\n\
  \   stack_array[i] = S.stack_array[i];}\n   template <class T> // Size( ) 函数返回栈的大小\n\
  \   stack. int Stack<T> :: Size() const { return tos+1;}\n```\n\n在从栈顶检索数据之前，我们需要确保栈不为空。这通过下面所示的函数\
  \ `empty()` 来确保：\n\n```\n template <class T>\n   int Stack<T> :: empty() const\n\
  \   {if(tos == -1) return 1;}\n```\n\n`Stack` 数据结构中的入栈操作就像在栈顶添加元素。在每次入栈操作后都需要增加栈顶\
  \ (`tos`)。\n\n```\n template <class T>\n  void Stack<T> :: push(const T& val)\n\
  \  { if( tos<stack_size-1 )\n  { tos++;stack_array[tos] = val; }\n  }\n```\n\n在\
  \ `pop` 操作中，我们将从栈顶弹出值。这通过减少栈顶 (`tos`) 来实现。\n\n```\n template <class T>\n   void\
  \ Stack<T> :: pop()\n   {if(tos >= 0)tos;}\n```\n\n在 `top()` 操作中，我们将使用函数的返回值来显示栈顶。我们在\
  \ `top()` 操作后也会减少 `tos`：\n   ```\n   template <class T>\n   T& Stack<T> :: top()\n\
  \   { return (stack_array[tos--]); }\n   ```\n\n此外注意我们将 `<<` 运算符声明为 `Stack` 类的友。由于我们希望\
  \ `<<` 运算符是 `Stack` 类所有实例的朋友，我们如下所示声明为模板函数：\n\n```\n template<class T>\n   friend\
  \ ostream & operator<<(ostream & out1,Stack<T>&S)\n   {out1<<”\\n \\t””content”<<endl;\n\
  \   for ( int j=0 ; j<max; j++)\n   out1<<S.top() : \";\n   }\n```\n\n`Student`\
  \ 类是一个普通的类，用于创建模板类的学生实例。我们将学号存储在栈中，并按后进先出的原则进行提取。我们将 `<<` 运算符包含为 `Student` 类的友：\n\
  \n```\n friend ostream & operator<<(ostream &src, Student &S)\n   {src<<S.Display();\
  \ // 显示学生的学号\n   return src;}\n```\n\n在下一个示例中，我们将声明一个学生类。我们将使用该类将学生实例推入 `Stack`\
  \ 中。我们还会创建 `float Stack` 和 `int Stack` 的实例，以展示模板的用和威力。\n\n**示例 14.2：stacktemplate1b.cpp\
  \ 使用模板实现栈数据结构**\n\n\n\n\n\n```\n #include<iostream>\n   #include<iomanip>\n   using\
  \ namespace std;\n   const int max=10; // 声明数组大小的最大值\n   class Student\n   {public:\n\
  \       Student(int roll); // 带学号输入的构造函数\n       Student():rollNo(0){} // 默认构造函数\n\
  \       ~Student() {}; // 默认析构函数\n       int Display() const {return rollNo;}\n\
  \       friend ostream & operator<<(ostream &src, Student &S)\n       {src<<S.Display();return\
  \ src; }\nprivate: int rollNo;\n};\nStudent::Student(int roll):rollNo(roll){}\n\
  template <class T>\nclass Stack\n{ public: Stack(); // 默认构造函数\nStack(const Stack&);\
  \ //拷贝构造函数\n       ~Stack(){ delete [] stack_array;} //析构函数\n       Stack& operator=(const\
  \ Stack&);//赋值运算符\n       int Size() const;\n       int empty() const; // 如果栈为空则返回\
  \ 1\n       T& top(); //返回栈顶\n       void pop(); // 弹出栈顶\n       void push(const\
  \ T&); // 推入\n       template<class T>\n       friend ostream & operator<<(ostream\
  \ & out1,Stack<T>&S);\nprivate:\n       T *stack_array; // 整数、双精度、学生的栈\n       int\
  \ tos;  //栈顶\n       int stack_size; // 栈大小\n};\ntemplate<class T>\nostream & operator<<(ostream\
  \ & out1,Stack<T>&S)\n{out1<<”n \\t”<<”content”<<endl;\n       for ( int j=0 ; j<max;\
  \ j++)\n       out1<<S.top<<\" : \"; }\ntemplate <class T> // 默认构造函数\nStack<T> ::\
  \ Stack()\n{stack_array = new T[max]; stack_size = max; tos = -1;}\n//拷贝构造函数\ntemplate\
  \ <class T> //拷贝构造函数\nStack<T> :: Stack(const Stack& S): stack_array(new T[S.size]),\n\
  \   tos(S.tos),stack_size(S.stack_size)\n{for(int i =0 ; i<stack_size; i++) stack_array[i]\
  \ = S.stack_array[i]; }\ntemplate <class T>\nStack<T>& Stack<T> :: operator=(const\
  \ Stack& S)\n{  stack_array = new T[S.stack_size];\n   tos = S.tos;\n   stack_size\
  \ =S.stack_size;\n   for(int i =0 ; i<size; i++)\n   stack_array[i] = S.stack_array[i];\n\
  }\ntemplate <class T>\nint Stack<T> :: Size() const { return tos+1;}\ntemplate <class\
  \ T>\nint Stack<T> :: empty() const\n{if(tos == -1) return 1;\nelse return 0; }\n\
  template <class T>\nvoid Stack<T> :: push(const T& val)\n{if( tos<stack_size-1 )\n\
  { tos++;stack_array[tos] = val; }\n}\ntemplate <class T>\nvoid Stack<T> :: pop()\n\
  {if(tos >= 0) tos--; }\ntemplate <class T>\nT& Stack<T> :: top()\n{return (stack_array[tos--]);\
  \ }\nvoid main()\n{Stack<int> I; // 整数栈\n   Stack<float> F; // 浮点数栈\n   Stack<Student>\
  \ stdStack;\n   for ( int i=0;i<max;i++)\n   { I.push(i+10); F.push(i+20); stdStack.push(i+10000);\
  \ }\n   cout<<\"\\n 整数栈的内容\"<<endl;\n   cout<<\" \"<<I;cout<<endl;\n   cout<<\"\\\
  n 浮点数栈的内容\"<<endl;\n   cout<<\" \"<<F; cout<<endl;\n   cout<<\"\\n 栈中学生的的学号\"<<endl;\n\
  \   cout<<\" \"<<stdStack; cout<<endl;\n   cout<<\"\\n 程序结束\"<<endl;\n}\n/*输出： 整数栈的内容\n\
  \   内容 19 : 18 : 17 : 16 : 15 : 14 : 13 : 12 : 11 : 10 :\n浮点数栈的内容\n   内容 29 : 28\
  \ : 27 : 26 : 25 : 24 : 23 : 22 : 21 : 20 :\n栈中学生的学号\n   内容 10009 : 10008 : 10007\
  \ : 10006 : 10005 : 10004 : 10003 : 10002 : 10001 : 10000*/\n```\n\n#### 14.4 模板函数与向函数传递参数\n\
  \n接受普通数据实例的普通函数，例如名为 `FindMax` 的函数接受整数数组。\n\n你必须传递数组的整数实例：`int FindMax(Array<int>\
  \ &);`。\n\n对于接受 Student 数组的函数：`void FindMax (Array<Student>&);`。\n\n泛型模板函数声明可以处理所有类型的数组：`template\
  \ <class T> void FindMax( Array<T>& );`。\n\n泛型模板函数还可以处理模板的参数化特定实例：`template <class\
  \ T> `。\n\n### 14.5 模板类\n\n类可以拥有模板类的：\n\n* 模板类或函数\n* 模板类或函数\n\n### 14.5.1 非模板函数\n\
  \n类可以声明为模板类的非模板函数。在下面的示例中，该函数只处理整数数组。\n\n#### 14.5.2 模板类或函数\n\n在示例 14.2 中，我们使用提取运算符\
  \ `<<` 作为 `Stack` 类的模板友元函数。在本节中，我们将引入另一种广泛使用的数据结构，即数组。`Array` 类的模板声明如下：\n\n**示例\
  \ 14.4: 数组类的模板声明如下**\n\n\n\n\n\n```cpp\n template <class T>\n   class Array\n  \
  \ { public:\n      Array(int array_size=max); // 构造函数\n      Array(const Array&);\
  \ // 拷贝构造函数\n      ~Array(){ delete [] array;} // 析构函数\n      Array& operator=(const\
  \ Array&);//赋值运算符\n      T& operator[] (int i) {return array[i];}\n      const T&\
  \ operator[](int i) const {return array[i];}\n      int Size() const { return array_size;}\
  \ own     template<class T>\n     friend ostream & operator<<(ostream & out1,Array<T>&S);\n\
  \     private:\n     T *array; // 整数、double、学生的数组\n     int array_size; // 数组大小\n\
  \   };\n```\n\n`赋值运算符 =.`。首先，我们检查左侧的内容 (`lhs`) 与右侧等号的内容 (`rhs`) 是否为同一个对象。如果相同，则没有必要执行赋值操作。因此，我们向调用函数返回\
  \ `*this`。为什么要返回 `*this` 呢？你必须意识到 `=` 操作允许链式赋值，例如我们可以编写如 `A=B=C=D=25` 的语句。然后编译器首先赋值\
  \ `D=25`，并链式到 `C`，进而链到 `B` 和 `A`。因此，我们需要返回引用以便实现链式赋值。在在从 `rhs` 拷贝之前，删除 `lhs` 上的内容是一个好习惯。因此，我们使用\
  \ `delete *array;`：\n\n```cpp\n template <class T>\n   Array<T>& Array<T> :: operator=(const\
  \ Array& S)\n   {if( this==&S)\n      return *this; // 源和目标相同，无需执行赋值操作\n      delete\
  \ *array; // 从 rhs 拷贝前删除目标内存\n      array_size=S.Size();\n      array=new T[array_size];\n\
  \      for (int i=0;i<array_size;i++)\n      array[i]=S[i];\n      return *this;\
  \ // 这是为了允许赋值运算符的链式调用\n   }\n```\n\n`int Size() const { return array_size;}` 是提供的公共辅助函数，用于访问私有数据\
  \ `array_size`。\n\n我们还把 `<<` 声明为 `Array` 类的友函数。\n\n```cpp\n template<class T>\n\
  \     friend ostream & operator<<(ostream & out1,Array<T>&S)\n       {out1<<”\\\
  n \\t”<<”Index” <<”\\t\\t”<<”content”<<endl;\n          for ( int j=0 ; j<S.array_size;\
  \ j++)\n              out1<<”\\n\\t”<<j<<”\\t\\t”<<S[j];\n   }\n```\n\n还要注意，如果 `S[j]`\
  \ 属于 `Student` 类，则它将调用在 Student 类中定义的友运算符 `<<`。\n\n```cpp\n int Display() const\
  \ {return rollNo;}\n   friend ostream & operator<<(ostream &src, Student &S)\n \
  \  {src<<S.Display();return src; }\n```\n\n我们在 `Array` 类中重载了 `operator [ ]`，如下所示：\n\
  \n```cpp\n T& operator[] (int i) {return array[i];}\n   const T& operator[](int\
  \ i) const{return array[i];}\n```\n\n请注意，`array` 已声明为属于数据类型 `T` 的指针。给定数组的偏移量或单元数，`operator\
  \ [ ]` 返回类型 `T` 或 `const T` 的引用。由于这些重载运算符，我们可以使用如下语句：\n\n```cpp\n for ( int i=0;i<I.Size();i++)\n\
  \    { I[i]=i+10;\n      F[i]=i+20.0;\n      pstd=new Student(i+10000);\n      stdarray[i]=*pstd;\n\
  \  }\n```\n\n最后，观察到重载的友运算符 `<<` 允许我们在主程序中使用 `cout<<I;` 这样的语句。`Student` 类是一个普通类，用于为模板类创建实例。章节末的示例\
  \ 2 提供了完整的解决方案。\n\n#### 14.5.3 类模板中的特定类型友函数\n\n在下一个程序中，我们将使用一个模板友函数 `FindSum()`，因为它是一个模板友函数，它可以作用于所有类型的数组。我们还将把\
  \ `operator <<`（提取运算符）声明为 `Stack` 类的友元。\n\n注意，我们将这两个函数都放置在 `Stack` 类的公共和私有声明上方。在任何情况下，友元都可以访问私有数据。因此，它可以位于类的公共和私有声明之上。这是声明和定义友函数的方法之一。\n\
  \n进一步注意，我们声明的友函数是**特定类型的**。这意味着整数 `Stack` 将仅是 `Stack<int>` 类的友元。同样，`float Stack`\
  \ 将是 `Stack<float>` 类的友元。因此，我们在友函数的定义中省略了 `template <class T>`。\n\n在接下来的示例中，我们向你展示如何将模板对象作为参数传递给函数\
  \ `FindSum`。\n\n**示例 14.5: stacktemplate3b.cpp 特定类型友函数**\n\n*(注：由于原文此处代码块严重错乱，以下为根据文本描述还原的逻辑结构)*\n\
  \n```cpp\n// 逻辑还原示例\n#include<iostream>\nusing namespace std;\nconst int max=10;\
  \ // 声明数组最大大小\n\ntemplate <class T>\nclass Stack {\n    // 模板友函数\n    friend void\
  \ FindSum(Stack<T> I); \n    // 提取运算符友元\n    friend ostream & operator<<(ostream\
  \ & out1, Array<T>& S);\n\npublic:\n    int top();\n    void pop();\n    void push(const\
  \ T&);\n    void SetTos();\nprivate:\n    T *array;\n    int array_size;\n};\n```\n\
  \n\n\n\n在处理静态成员数据和成员函数时，所有适用于普通类静态声明的规则也适用于模板类和成员函数。模板中的静态声明允许模板的每个实例都拥有自己的静态数据。例如，如果我们在数组类中声明了一个如\
  \ `numberOfStacks` 这样的栈的静态成员数据，那么 `Student` 数组和 `integer` 数组的每次实例化都将拥有自己的 `numberOfStacks`，用于跟踪创建了多少个\
  \ `Student` 数组或整数型数组。\n\n#### **示例 14.6：演示静态成员的 `stacktemplate5b.cpp` 程序**\n\n```cpp\n\
  \ //functions 和静态数据\n   #include<iostream>\n   using namespace std;\n   const int\
  \ max=10; // 声明栈的最大尺寸 own\n   class Student\n   { public: Student(int roll); //\
  \ 带学号输入的构造函数\n            Student():rollNo(0){} // 默认构造函数\n            ~Student()\
  \ {}; // 默认析构函数\n       private: int rollNo;\n   };\n   Student::Student(int roll):rollNo(roll){}\n\
  \   template <class T>\n   class Stack\n   {friend void FindSum( Stack<T> I ) //\
  \ I 是整数型栈\n   {  T sum=T(0);\n       for ( int j=0 ; j<max; j++) sum+=I.top();\n\
  \       cout<< sum<<endl;\n   }\n   friend ostream & operator<<(ostream & out1,Stack<T>&S)\n\
  \   {out1<<”\\n \\t”<<”content”<<endl;\n       for ( int j=0 ; j<S.Size(); j++)\n\
  \       out1<<S.top<<\" : \";\n       return out1;\n   }\n   public: Stack(); //\
  \ 默认构造函数\n       Stack(const Stack&); // 拷贝构造函数\n       ~Stack(){ delete [] stack_array;}\
  \ // 析构函数\n       Stack& operator=(const Stack&);// 赋值运算符\n       int Size() const;\n\
  \       int empty() const; // 如果栈为空返回 1\n       T& top(); // 返回栈顶\n       void pop();\
  \ // 弹出栈顶\n       void push(const T&); // 入栈\n       void SetTos(){ tos=max-1;}\
  \ // 到栈顶\n       static int GetNumberOfStacks() { return numOfStacks;}\n   private:\n\
  \       T *stack_array; // 存储整数、double、学生数据的栈\n       int tos;\n       int stack_size;\
  \ // 栈大小\n       static int numOfStacks; // 用于跟踪栈数量的静态数据\n   };\n   // 静态成员的模板实例化\n\
  \   template < class T>\n   int Stack<T>::numOfStacks=0;\n   template <class T>\
  \ // 默认构造函数\n   Stack<T> :: Stack()\n   {  stack_array = new T[max];\n       stack_size\
  \ = max;\n       tos = -1;\n       numOfStacks++;\n   }\n   template <class T> //\
  \ 拷贝构造函数\n   Stack<T> :: Stack(const Stack& S): stack_array(new T[S.stack_size]),\n\
  \           tos(S.tos),stack_size(S.stack_size)\n   { int i;\n       for(i =0 ;\
  \ i<stack_size; i++)\n       stack_array[i] = S.stack_array[i];\n            numOfStacks++;\n\
  \   }\n   template <class T>\n   Stack<T>& Stack<T> :: operator=(const Stack& S)\n\
  \   { stack_array = new T[S.stack_size];\n      tos = S.tos;\n      stack_size =S.stack_size;\n\
  \      for(int i =0 ; i<size; i++)\n      stack_array[i] = S.stack_array[i];\n \
  \  }\n   template <class T>\n   int Stack<T> :: Size() const { return tos+1;}\n\
  \   template <class T>\n   int Stack<T> :: empty() const\n   {if(tos == -1) return\
  \ 1;\n      else return 0;\n   }\n   template <class T>\n   void Stack<T> :: push(const\
  \ T& val)\n   {if( tos<stack_size-1 )\n      { tos++;stack_array[tos] = val; }\n\
  \   }\n   template <class T>\n   void Stack<T> :: pop()\n   {if(tos >= 0) tos--;\
  \ }\n   template <class T>\n   T& Stack<T> :: top()\n   { return (stack_array[tos--]);\
  \ }\n   void main()\n   { Stack<int> I1; // 整数栈\n      Stack<float> F1; // 浮点数栈\n\
  \      Stack<Student> stdStack; // 学生栈\n      // 向所有三个栈中填充数据\n      for ( int i=0;i<max;i++)\n\
  \      {I1.push(i+10); F1.push(i+20.0); stdStack.push(i+10000);\n      }\n     \
  \ // 声明并填充第二组栈\n      Stack<int> I2; // 整数栈\n      Stack<float> F2; // 浮点数栈\n  \
  \    Stack<Student> stdStack2; // 学生栈\n      // 为第二组的三个栈填充数据\n      for ( i=0;i<I2.Size();i++)\n\
  \      { I2.push(i+10); F2.push(i+20.0); stdStack2.push(i+10000);\n      }\n```\n\
  *(注：由于原文末尾代码部分存在逻辑截断或重复，如 `i+10000` 和大括号不匹配，译文已根据原文结构进行对应翻译)*\n\n#### 14.7 异常\n\n\
  在模板模板处理异常时，程序员有以下选项：\n\n-   在模板外声明异常。\n-   在模板内声明异常。\n\n回顾第 11 章，我们可以在类内部包含两个异常，如下：\n\
  \n```cpp\n class Stack\n   {public: …………\n      class fullerror {};\n      class\
  \ emptyerror {}\n```\n\n当抛出异常时，控制传递到具有相应机制的 catch 块。注意我们使用了 `Stack<string>`，`string`\
  \ 指定了参数。\n\n```cpp\n catch(Stack<string>::fullerror)\n      { cout<<”n 异常。无法弹出:”<<endl;\n\
  \  cout<<”退出 catch 块.”<<endl;\n  }\n```\n本节提供了完整的解决方案。\n\n## 14.8 总结\n\n1. 通用编程意味着编写适用于任何数据类型的程序，即与类型无关。\n\
  2. 模板是 C++ 提供的一种实现重用性的工具。\n3. 类模板在逻辑相同但数据集不同时非常有用。\n4. 通用模板函数声明可以处理各种数组：`template\
  \ <class T>void FindMax( Array<T>& )`。\n5. 通用模板函数也可以处理参数化的特定模板实例：`template <class\
  \ T> void FindMax( Array<T>& , Array<float>)`。\n6. 类模板可以拥有友，即非模板类或函数、模板类或函数或特定类型的模板友函数。\n\
