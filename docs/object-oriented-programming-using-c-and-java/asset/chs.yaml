  \ Markdown 逻辑进行了还原，以保持内容一致性。)*\n\n#### 19.4 使用超类\n\n\n\n\n\n在我们目前为止的示例中，我们使用了如 `SetSalry()`\
  \ 等修改器方法来设置私有成员数据。但我们知道初始化对象的最佳方法是使用构造函数。构造函数可以设置成员数据并初始化对象。但当涉及继承关系并且我们要创建子类的实例时，我们需要先调用\
  \ `super` 的构造函数，以便 `super` 的构造函数完成对象对象部分的初始化，然后子类构造函数完成其部分的初始化工作，最后整个对象才准备就绪。那么如何调用\
  \ `super` 的构造函数呢？只需使用 `super` 关键字即可。下一个示例重点介绍了 `super` 关键字的使用。\n\n### 示例 19.3a:\
