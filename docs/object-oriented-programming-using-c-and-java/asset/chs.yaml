  \n**//[示例 6.3] SurfaceArea.cpp 计算球体表面积的程序**\n\n```c++\n 1\\. #include<iostream>\n\
  \  2\\. using namespace std;\n  3\\. /* 声明函数原型，根据浮点型（实数）数据类型的半径计算表面积，并再次返回浮点类型的面积\n\
