  ```\n\n\n\n在上面的示例中，我们在堆内存（heap memory）上创建了整个对象。我们也可以在堆内存上创建成员数据并使用间接运算符 `->` 来访问成员。注意，堆内存只能通过指针访问。因此，我们对成员数据的声明将是指针。\n\
  \n```\nint *rollNo; // 因为我们要使用堆内存，所以必须使用指针\nchar *name;\n```\n\n我们的公共访问器函数必须处理指针：\n\
  \n```\nint GetRollNo() const { return *rollNo;}\n```\n\n在堆内存上创建对象并访问成员的方法如下：\n\n\
  ```\nStudent *ptr = new Student;// 在堆上创建了对象\ncout<<ptr->GetRollNo()<<endl;\n```\n\
  \n### 示例 10.10：  objmemheap.cpp 在堆上创建对象和成员数据并使用间接运算符 -> 访问成员数据。类的构造函数和析构函数\n\n```cpp\n\
  #include<iostream>\nusing namespace std;\n//声明一个名为 Student 的类\nclass Student\n{\
