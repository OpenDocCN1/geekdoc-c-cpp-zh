  \ 使用 Java 进行集合与软件开发\n\n### 学习目标\n*在本章结束时，你将能够理解*\n* Java 通过集合类接口（如 `Set<T>`、`List<T>`、`Queue<T>`\
  \ 和 `Map<k,s>`）提供的集合。\n* 理解 Java 数据库连接（JDBC）以及 Java 及其他供应商（如 Microsoft、MySql.com\
  \ 和 Oracle）提供的工具和驱动程序。\n* 使用 Oracle、MySql 和 Access 数据库开发应用程序。\n* 理解并部署 Java 客户端/服务器编程中\
  \ Servlets 的底层概念。\n* 理解并部署 Java 客户端/服务器编程中 Java Beans 的底层概念。\n\n#### 24.1 引言\n虽然良好的算法可以提高程序的效率，但数据结构将允许程序员利用底层硬件和支持语言特性来增强程序员的吞吐量。J2SE\
  \ 5.0 及更高版本提供了集合框架，该框架提供了诸如 `Set<T>`、`List<T>`、`Queue<T>` 和 `Map<k,s>` 等接口。本章将向你介绍这些概念，以便你通过高效使用集合来交付程序，而不是自己开发程序，从而提高生产力。\n\
  \n在工业中，数据库被广泛使用，是因为它们无需通过名为 `sql query` 的软件进行复杂的编程就能轻松地提供查询答案。行业中最流行的数据库是 Oracle、`MySql`（由\
  \ MySql.com 开源）以及当然，通过所有流行的 MS Office 即可获取的 MS Access。本章将向你展示如何使用 `JDBC`、`JDBC-ODBC`\
  \ 和 `MySql` 连接工具等驱动程序通过 Java 程序处理这些数据库。Servlets 是 Java 处理客户端/服务器程序的重要实现。Servlets\
  \ 扩展了 Web 服务器面向网络用户的功能，就像 applet 扩展网络浏览器的功能一样。Java Beans 是为了重用而设计的。在本章中，你将学习部署 Java\
  \ beans 的程序。\n\n#### 24.2 Java 集合框架\n我们如何在数组中存储一组对象？J2SE 5.0 提供了一个集合框架。集合框架提供了一个\
  \ API，使得使用数据结构进行编程变得简单，从而增强了程序员的生产力。这与 C++ 的容器相似，但有许多差异。集合框架实现在 `java.util` 中。\n\
  \n其概念是创建一个集合对象，并将一组对象存储在集合对象中。\n\n\n\n\n\n`Collection Interface` 是 `List` 和 `Set`\
  \ 接口派生的主要接口。它指定了所有 `Collections` 通用的方法。`Collection Interface` 中定义的方法及其描述列在表 24.2\
  \ 中。\n\n**表 24.2** Collection Interface 及其描述\n\n| 方法 | 备注 |\n| --- | --- |\n| `boolean\
  \ add(Object o)` | 添加新对象 |\n| `boolean addAll(Collection c)` | 用法：`t.addAll(c)`\
  \ 模拟并操作。结果：`Collection t` 包含 `t` 和 `c` 中的所有对象 |\n| `void clear()` | 移除集合中的所有元素 |\n\
  | `boolean contains(Object o)` | 检查对象是否存在于集合 |\n| `boolean containsAll(Collection\
  \ c)` | 用法：`t.containsAll(c)` 模拟子集操作结果：如果 `Collection c` 是集合 `t` 的子集，则返回 true |\n\
  | `boolean isEmpty()` | 如果集合为空则返回 true |\n| `Iterator iterator()` | 用于遍历集合 |\n|\
  \ `boolean remove(Object o)` | 从集合中移除对象 |\n| `boolean removeAll(Collection c)` |\
  \ 用法：`t.removeAll(c)` 结果：移除 `Collection t` 中所有包含在集合 `c` 中的对象 |\n| `boolean retainAll(Collection\
  \ c)` | 用法：`t.retainAll(c)` 模拟交集操作。结果：`Collection t` 拥有 `t` 和 `c` 有的对象 |\n| `int\
  \ size()` | 集合中的对象数量 |\n| `Object[] toArray()` `Object[] toArray(Object[] a)` |\
  \ 数组操作允许将 `Collection` 内容转换为数组 |\n\n#### 24.4 Set Interface\n\n`Set` 接口的重要特性如下：\n\
  \n- 定义在 `java.util.Set` 中\n- `Set` 扩展了 `Collection Interface` 但没有添加任何新方法\n- 该接口模拟了数学集合抽象\n\
  - `Set` 不能包含重复元素\n- 集合框架提供了 `Set Interface` 的两种实现：`HashSet` 和 `TreeSet`\n\n我们将在示例\
  \ 24.1 中使用 `Set interface` 的 `HashSet` 实现来演示一些基本的集合操作。\n\n**示例 24.1: 演示基本集合操作的程序**\n\
  \n```\n1\\. import java.util.Set;\n2\\. import java.util.HashSet;\n3\\. public class\
  \ SetDemo {\n4\\. public static void main(String[] args) {\n5\\. Set<String> PoolA=new\
  \ HashSet<String>();\n6\\. PoolA.add(“India”);\n7\\. PoolA.add(“Australia”);\n8\\\
  . PoolA.add(“South Africa”);\n9\\. System.out.println(“PoolA: “ +PoolA);\n10\\.\
  \ Set<String> PoolB=new HashSet<String>();\n11\\. PoolB.add(“England”);\n12\\. PoolB.add(“India”);\n\
  13\\. PoolB.add(“New Zealand”);\n14\\. System.out.println(“PoolB: “ +PoolB);\n15.\n\
  16\\. PoolA.retainAll(PoolB);\n17\\. System.out.println(“Intersection Operation\
  \ PoolA: “ +PoolA);\n18\\. PoolA.addAll(PoolB);\n19\\. System.out.println(“Union\
  \ Operation PoolA: “ +PoolA);\n20\\. System.out.println(“Subset Operation: “\n21\\\
  . +PoolA.containsAll(PoolB));\n22\\. }\n23\\. }\n24\\. /* Output\n25\\. PoolA: [Australia,\
  \ South Africa, India]\n26\\. PoolB: [England, New Zealand, India]\n27\\. Intersection\
  \ Opeartion PoolA: [India]\n28\\. Union Operation PoolA: [England, New Zealand,\
  \ India]\n29\\. Subset Operation: true\n30\\. */\n```\n\n| **第 1 & 2 行:** | 导入了\
  \ `java.util` 包中定义的 `Set` 和 `HashSet`。第 5 行定义了一个名为 `PoolA` 的字符串集。 |\n| **第 6, 7\
  \ & 8 行:** | 展示了如何使用 `add` 方法填充 `Set PoolA`。 |\n| **第 9 行:** | 演示了我们如何在控制台上打印 `PoolA`\
  \ 中的元素。 |\n| **第 11–15 行:** | 创建一个新的 `Set PoolB` 并填充元素。 |\n| **第 17 行:** | 演示了集合之间的交集操作，第\
  \ 19 行并集操作以及第 21–22 行子集操作。 |\n\n#### 24.5 Iterators\n\n`Iterator` 允许我们遍历如 `Set`\
  \ 这样的集合。`iterator interface` 定义在 `java.util.Iterator` 中。该接口定义了如下所示三个方法：\n\n```\n\
  public interface Iterator {\npublic boolean hasNext();\npublic object next();\n\
  public void remove();\n}\n```\n\n`hasNext()` 方法在迭代还有更多元素时返回 true。`next()` 方法返回集合中的下一个元素，`remove()`\
  \ 方法用于移除迭代器返回的最后一个元素。示例 24.2 演示了在 `Set` 上使用迭代器。\n\n**示例 24.2: 演示 Iterator 使用的程序**\n\
  \n```\nimport java.util.Set;\nimport java.util.HashSet;\nimport java.util.Iterator;\n\
  public class SetDemo {\n  public static void main(String[] args) {\n    Set<String>\
  \ set=new HashSet<String>();\n    set.add(“Gautam”);\n    set.add(“Ramesh”);\n \
  \   set.add(“Anand”);\n  System.out.println(“HashSet Output”);\n  for(Iterator it\
  \ = set.iterator(); it.hasNext(); ){\n  System.out.println(“String: “ + it.next());\n\
  \    }\n  }\n}\n/*Output\nHashSet Output String: Gautam String: Ramesh String: Anand\
  \ */\n```\n\n| **第 12 行:** | 展示了如何使用 `iterator()` 方法为 `Set` 获取迭代器。如第 12 行所示，我们使用\
  \ `hasNext()` 方法作为循环的终止条件。要获取元素的值，如第 13 行所示，我们使用 `next()` 方法。 |\n\n#### 24.6 List\
  \ Interface\n\n`List interface` 的重要特性如下：\n\n- 定义在 `java.util.List` 中\n- `List` 扩展了\
  \ `Collection Interface` 并增加了一些新方法\n- 元素以线性方式存储，有起点和结尾\n- `List` 可以包含重复元素\n- 集合框架提供了\
  \ `List Interface` 的两种实现：`ArrayList` 和 `LinkedList`\n- `Lists` 具有扩展以容纳新元素的能力\n\n\
  表 24.3 描述了 `List interface` 定义的额外方法。\n\n**表 24.3** List Interface 定义的额外方法\n\n| 方法\
  \ | 备注 |\n| --- | --- |\n| `E get(int index)` | 获取索引处的元素 |\n| `E set(int index,\
  \ E element)` | 用新元素替换索引的值 |\n| `boolean add(E element)` | 将元素添加到列表尾 |\n| `void\
  \ add(int index, E element)` | 在指定索引添加元素 |\n| `E remove(int index)` | 移除索引处的元素 |\n\
  | `int indexOf(Object o)` | 返回对象 `o` 在列表中的索引 |\n| `int lastIndexOf(Object o)` |\
  \ 返回对象 `o` 最后一次出现的索引 |\n| `ListIterator<E> listIterator()` | `List Iterator` 扩展了\
  \ `iterator`，它具有双向遍历列表、修改列表并提供当前索引等位置信息的能力 |\n| `List<E> subList(int from, to)`\
  \ | 返回索引 `from`（包含）和 `to`（不包含）之间的列表视图。对子列表的更改将反映在主列表中 |\n\n我们将在示例 24.3 中演示 `List\
  \ Interface` 的一些重要方法以及 `List Iterator` 的用法。\n\n\n\n\n\n```java\n1\\. import java.util.ArrayList;\n\
  2\\. import java.util.LinkedList;\n3\\. import java.util.ListIterator;\n4\\. public\
  \ class ListDemo {\n5\\. public static void main(String[] args) {\n6\\. ArrayList<String>\
  \ AList = new ArrayList<String>();\n7\\. LinkedList<String> LList = new LinkedList<String>();\n\
  8\\. AList.add(new String(“Ramesh”));\n9\\. AList.add(new String(“Anand”));\n10\\\
  . AList.add(new String(“Gautam”));\n11\\. System.out.println(“ArrayList: “ +AList);\n\
  12\\. DemoArrayList(AList);\n13\\. LList.add(new String(“Ramesh”));\n14\\. LList.addFirst(new\
  \ String(“Anand”));\n15\\. LList.addLast(new String(“Gautam”));\n16\\. System.out.println(“LinkedList:\
  \ “ +LList);\n17\\. System.out.print(”Reversed LinkedList: ”);\n18\\. ListIterator<String>\
  \ it = LList.listIterator(LList.size());\n19\\. while(it.hasPrevious())\n20\\. System.out.println(it.previous());\n\
  21\\. }\n22\\. private static void DemoArrayList(ArrayList<String> list){\n23\\\
  . String s = new String(”Gautam“);\n24\\. System.out.println(”index: ” +list.indexOf(s));\n\
  25\\. list.remove(s);\n26\\. System.out.println(”ArrayList: ” +list);\n27\\. list.set(0,\
  \ ”Thunder“);\n28\\. System.out.println(”ArrayList: ” +list);\n29\\. }\n30\\. }\n\
  31\\. /* Output\n32\\. ArrayList: [Ramesh, Anand, Gautam]\n33\\. index: 2\n34\\\
  . ArrayList: [Ramesh, Anand]\n35\\. ArrayList: [Thunder, Anand]\n36\\. LinkedList:\
  \ [Anand, Ramesh, Gautam]\n37\\. Reversed LinkedList: Gautam Ramesh Anand\n38\\\
  . */\n```\n\n我们在第 6 行和第 7 行实例化了两个列表，一个是 `ArrayList(AList)` 类型，另一个是 `LinkedList(LList)`\
  \ 类型。这两个 `Lists` 都存储 `Strings`。第 9 行、第 10 行和第 11 行演示了如何向 `ArrayList` 添加元素。`DemoArrayList()`\
  \ 函数进一步演示了 `List` 接口的一些重要方法。第 15 行、第 16 行和第 17 行展示了可向 `LinkedList` 添加元素的方法，除了 `LinkedList`\
  \ 提供的 `add` 方法外，它还提供了 `addFirst()` 和 `addLast()` 方法，使我们能够轻松地向列表的开头和结尾添加元素。第 21 行展示了如何在实例化时通过传递\
  \ `LList.size()` 参数创建一个 `List` 迭代器并设置为列表的最后一个元素。第 22 行和第 23 行展示了如何反向遍历。\n\n####\
  \ 24.7 集合算法\n\nJava 平台提供了许多实用的算法。这些算法以静态方法的的形式实现在 `Collections` 类中。许多算法只能用于 `Lists`，而另一些可以用于所有的\
  \ `Collections`。这些算法在本质上是多态的，也就是说相同的方法可以用于 `Collection` 接口的不同实现。可以通过导入 `java.util.Collections`\
  \ 类来使用这些算法。在表 24.4 中，我们列出了集合类中存在的一些常用算法。\n\n**表 24.4** 集合算法描述\n\n| 算法 | 备注 |\n|\
  \ --- | --- |\n| sort | 使用优化的合并排序算法对输入列表进行排序。最坏情况的时间复杂度为 nlog(n)。 |\n| binarySearch\
  \ | `binarySearch` 算法在 `List` 中搜索指定的元素。在使用二分查找算法之前，必须对输入列表进行排序。 |\n| shuffle | 打乱列表中元素的顺序。\
  \ |\n| reverse | 反转 `List` 中元素的顺序。 |\n| fill | 用指定的值填充 `List`。 |\n| copy | 将源列表中的元素复制到目标列表。目标列表的大小必须等于或大于源列表。\
  \ |\n| swap | 交换 `List` 中指定位置的元素。 |\n| addAll | 将所有指定的元素添加到 `Collection` 中。通常元素会被添加到集合的末尾。\
  \ |\n| frequency | 返回集合中指定元素出现的次数。 |\n| disjoint | 用于判断两个集合是否没有共同元素。 |\n\n我们在示例\
  \ 24.4 中演示了某些算法用法。\n\n**示例 24.4: 演示集合算法用法的程序**\n\n```java\n1\\. import java.util.Collections;\n\
  2\\. import java.util.ArrayList;\n3\\. public class ListAlgorithmDemo {\n4\\. public\
  \ static void main(String[] args) {\n5\\. ArrayList<Integer> IList = new ArrayList<Integer>();\n\
  6\\. ArrayList<String> SList = new ArrayList<String>();\n7\\. IList.add(new Integer(7));\n\
  8\\. IList.add(new Integer(5));\n9\\. IList.add(new Integer(9));\n10\\. Collections.sort(IList);\n\
  11\\. System.out.println(“Ascending Order: “ +IList);\n12\\. System.out.println(“Index\
  \ of Integer 9 in sorted list: “\n13\\. +Collections.binarySearch(IList, 9));\n\
  14\\. Collections.reverse(IList);\n15\\. System.out.println(“Descending Order: “\
  \ +IList);\n16\\. Collections.shuffle(IList);\n17\\. System.out.println(“Shuffled\
  \ List: “ +IList);\n18\\. System.out.println(“Min: “ +Collections.min(IList));\n\
  19\\. System.out.println(“Max: “ +Collections.max(IList));\n20\\. SList.add(new\
  \ String(“Ramesh”));\n21\\. SList.add(new String(“Anand”));\n22\\. SList.add(new\
  \ String(“Gautam”));\n23\\. Collections.sort(SList);\n24\\. System.out.println(“Ascending\
  \ Order: “ +SList);\n25\\. }\n26\\. }\n27\\. /* Output\n28\\. Ascending Order: [5,\
  \ 7, 9]\n29\\. Index of Integer 9 in sorted list: 2\n30\\. Descending Order: [9,\
  \ 7, 5]\n31\\. Shuffled List: [7, 5, 9]\n32\\. Min: 5\n33\\. Max: 9\n34\\. Ascending\
  \ Order: [Ramesh, Anand, Gautam]\n35\\. */\n```\n\n| 第 5 行和第 6 行 | 我们实例化了两个列表，一个是\
  \ `ArrayList(AList)` 类型，另一个是 `LinkedList(LList)` 类型。 |\n| 第 7 行 | 这两个 `Lists` 都存储\
  \ `Strings`。 |\n| 第 9 行、第 10 行和第 11 行 | 演示了如何向 `ArrayList` 添加元素。 |\n| 第 22 行和 23\
  \ 行 | `DemoArrayList()` 函数进一步演示了 `List` 接口的一些重要方法。 |\n| 第 15 行、第 16 行和第 17 行 | 展示了可向\
  \ `LinkedList` 添加元素的方法，除了 `LinkedList` 提供的 `add` 方法外，它还提供了 `addFirst()` 和 `addLast()`\
  \ 方法，使我们能够轻松地向列表的开头和结尾添加元素。 |\n| 第 21 行 | 展示了如何在实例化时通过传递 `LList.size()` 参数创建一个 `List`\
  \ 迭代器并设置为列表的最后一个元素。 |\n| 第 22 行和第 23 行 | 展示了如何反向遍历。 |\n\n#### 24.7 集合算法\n\nJava\
  \ 平台提供了许多实用的算法。这些算法以静态方法的的形式实现在 `Collections` 类中。许多算法只能用于 `Lists`，而另一些可以用于所有的 `Collections`。这些算法在本质上是多态的，也就是说相同的方法可以用于\
  \ `Collection` 接口的不同实现。可以通过导入 `java.util.Collections` 类来使用这些算法。在表 24.4 中，我们列出了集合类中存在的一些常用算法。\n\
  \n#### 24.8 Map 接口\n\n`Map` 接口的重要特征如下：\n\n*   `Map` 类似于字典。\n*   `Map` 中的每个项涉及一对元素：键（keys）和值（values）。统称为键值对。\n\
  *   每个键映射到一个特定的值。例如，在考勤表中，学号（key）映射到姓名（value）。\n*   `Map` 不包含重复的键，但可以包含重复的值。\n*\
  \   键和值之间的关系是一一对应的，即每个键只能映射到一个值。\n*   集合框架提供了 `Map` 的两种实现：`HashMap` 和 `TreeMap`。\n\
  \n表 24.5 描述了 `Map` 接口定义的方法。\n\n**表 24.5** Map 接口描述\n\n| 方法 | 备注 |\n| --- | --- |\n\
  | `put(K key, V value)` | 为键和值创建一个新映射 |\n| `get(Object key)` | 返回与键关联的值 |\n| `remove(Object\
  \ key)` | 删除键的映射 |\n| `containsKey(Object key)` | 检查集合是否包含该键的映射 |\n| `containsValue(Object\
  \ value)` | 检查集合是否包含该值的映射 |\n| `size()` | 返回集合中存在的键值对数量 |\n| `isEmpty()` | 如果集合为空则返回\
  \ true |\n| `clear()` | 清除集合中的所有映射 |\n| `keySet()` | 该方法返回一个包含 `Map` 中所有键的 `Set`\
  \ |\n| `values()` | 该方法返回一个包含 `Map` 中所有值的 `Collection`。该方法返回 `Collection` 而不是 `Set`，因为值可以重复而键是唯一的\
  \ |\n| `entrySet()` | 该方法返回一个填充了 `Map.Entry` 对象的 `Set`，可以通过使用 `Map.Entry` 对象中定义的方法同时获取键值对\
  \ |\n\n#### 24.9 Map 的集合视图\n\n\n\n\n\n无法直接为 `Map` 附加迭代器（iterator）。因此，为了遍历 `Map`，`Map`\
  \ 接口提供了若干方法，允许 `Map` 被视为一个集合（`Collection）。示例 24.5 展示了两种此类方法：`keySet()` 和 `values()`。请注意，`Map`\
  \ 仅存储对象引用，因此无法使用 `double` 或 `int` 等原始数据类型。相反，我们可以使用如 `Integer` 或 `Double` 等包装类。\n\
  \n### 示例 24.5：演示 Map 集合视图的程序\n\n```\n1\\. import java.util.Collection;\n2\\. import\
  \ java.util.Map;\n3\\. import java.util.HashMap;\n4\\. import java.util.Iterator;\n\
  5\\. import java.util.Set;\n6\\. public class MapDemo{\n7\\. public static void\
  \ main(String[] args){\n8\\. Map<Object,String> map=new HashMap<Object,String>();\n\
  9\\. map.put(new Integer(120400), “Ramesh”);\n10\\. map.put(new Integer(120401),\
  \ “Anand”);\n11\\. map.put(new Integer(120402), “Gautam”);\n12\\. System.out.println(“Printing\
  \ Keys: “);\n13\\. Set s = map.keySet();\n14\\. for(Iterator itr = s.iterator();itr.hasNext();)\n\
  15\\. System.out.println(itr.next());\n16\\. System.out.println(“Printing Values:\
  \ “);\n17\\. Collection c = map.values();\n18\\. for(Iterator itr = c.iterator();itr.hasNext();)\n\
  19\\. System.out.println(itr.next());\n20\\. }\n21\\. }\n22\\. /* Output\n23\\.\
  \ Printing Keys: 120401 120400 120402\n24\\. Printing Values: Anand Ramesh Gautam\n\
  25\\. */\n```\n\n| 第 8 行： | 实例化了一个 `Map` 对象，其键（Keys）定义为 `Objects`，值（Values）定义为 `Strings`。该\
  \ `Map` 使用 `HashMap` 实现。 |\n| 第 9, 10, 11 行： | 使用 `Integer` 对象和 `String` 填充 `Map`。\
  \ |\n| 第 14 行： | 演示了如何使用 `keySet()` 方法获取键的集合视图。我们使用 `Set` 接口，因为 `Set` 像键一样不能有重复项。同样，第\
  \ 19 行展示了如何获取值（Values）的集合视图。 |\n\n有时，我们希望在迭代过程中修改与某个键关联的值。`Map` 接口提供了一个 `entrySet()`\
  \ 方法以及一个名为 `Map.Entry` 的嵌套接口来实现此目标。`entrySet()` 方法返回 `Map` 中存在的所有键值对的集合视图。嵌套接口 `Map.Entry`\
  \ 定义如下：\n\n```\npublic interface Entry {\nK getKey(); V getValue(); V setValue(V\
  \ value);}\n```\n\n从上所述可以看出，该接口提供了方法，我们可以通过这些方法访问并修改与键关联的值。示例 24.6 展示了如何使用方法 `entrySet()`\
  \ 和 `Map.Entry` 来迭代并访问与键关联的值。\n\n### 示例 24.6：演示 Map 集合视图的程序\n\n```\n1\\. import\
  \ java.util.Map;\n2\\. import java.util.HashMap;\n3\\. import java.util.Set;\n4\\\
  . import java.util.Iterator;\n5\\. public class MapDemo {\n6\\.   public static\
  \ void main(String[] args) {\n7\\.     Map<Object,String> map=new HashMap<Object,String>();\n\
  8\\.     map.put(new Integer(120400), “Ramesh”);\n9\\.     map.put(new Integer(120401),\
  \ “Anand”);\n10\\.    map.put(new Integer(120402), “Gautam”);\n11\\.  Set s=map.entrySet();\n\
  12\\.  for(Iterator it=s.iterator();it.hasNext();){\n13\\.    Map.Entry m =(Map.Entry)it.next();\n\
  14\\.    int rollno=(Integer)m.getKey();\n15\\.    String name=(String)m.getValue();\n\
  16\\.    System.out.println(“Roll No:”+ rollno + “ Name:” +name );\n17\\.    }\n\
  18\\.  }\n19\\. }\n20\\. /* Output\n21\\. Roll No:120401 Name:Anand\n22\\. Roll\
  \ No:120400 Name:Ramesh\n23\\. Roll No:120402 Name:Gautam\n24\\. */\n```\n\n| 第\
  \ 12 行： | 创建了一个 `Set s`，其中包含 `map` 中的所有键值对。在第 13 行中为 `Set` 关联了一个迭代器。第 14 行演示了如何创建一个\
  \ `Map.Entry` 对象。第 15 行和第 16 行展示了如何使用 `Map.Entry` 方法获取键和值。程序中使用的 for 循环可以使用如下 for-each\
  \ 循环简化： |\n\n```java\nfor (Map.Entry< Object, String > e : map.entrySet()){\nSystem.out.println(“Roll\
  \ No:”+ e.getKey() + “ Name:” +e.getValue());\n}\n```\n\n当使用上述 for 循环时，第 12 行的 `Set\
  \ s=map.entrySet()` 也不再需要。\n\n#### 24.10 JDBC 数据库连接\n\n为了连接到数据库，你需要驱动程序（`Drivers`）。首先，由于你从\
  \ Java 程序请求连接，你需要 `JDBC Manager` 来当 Java 组件（如 `Applet` 或 `Application`）与驱动程序之间的接口。\n\
  \n然后，为了与 `Oracle`、`MS Access` 和 `MySQL` 等第三方数据库协作，你需要如 `ODBC`（开放数据库连接）之类的驱动程序，它接收\
  \ `JDBC` 提供的调用并将其转换为适用于 `MS Access` 和 `Oracle 10g` 等专用数据库的格式。这意味着你的机器上必须可用 `Database`\
  \ 和 `ODBC`。`ODBC` 随 Windows 发布。`JDBC` 是我们已安装 `JDK` 的一部分。最后，`MySQL` 也提供了连接器 `mysql-connector-java-5.1.3`\
  \ 和 `mysql-5.1.51-win32.msi`。首先根据你的喜好下载并安装这些数据库。如果安装过程中没有提示，则由你设置路径。设置路径的方法见第 16.6.2\
  \ 节。图 24.4\n\n#### 24.11 使用 MS Access 数据库访问记录\n\nMS Access 是 MS Office 软件包中最流行且容易获取的数据库。学生可以轻松访问\
