  在本章结束时，你应该能够：\n\n* 良好的基础理解和掌握编写 Java 程序。\n* 理解数据类型及其用法。\n* 使用复合语句以及递增递减运算符。\n* 理解运算符及其优先级和结合规则。\n\
  * 使用关系运算符和相等运算符。\n\n\n\n\n\n# 理解和使用控制循环。\n\n## 16.1 引言\n\n在本章中，我们将向你介绍 Java 编程基础，如\
  \ Java 语言允许的数据类型，以及各种运算符，如逻辑运算符、算术运算符等。在第 15 章中，你已经用过了其中一些特性，但在本章中，我们将为你提供 Java\
  \ 语言的底层语法、规则和理论。我们通过示例程序展示了各种类型运算符的操作，例如二元运算符、一元运算符和位操作符。文中还介绍了运算符的优先级和结合性。\n\n\
  语句基本上有两种类型，即顺序语句和控制语句。控制语句会改变语句的执行顺序。语句块的重复执行由计数器控制语句控制，这些语句通过 `for`、`while`、`do-while`\
  \ 和 `switch` 语句执行。\n\n## 16.2 常数/字面量常量\n\n它们在程序运行时不会改变其值。注意，常量也被称为字面量常量，如图 16.1\
  \ 所示。\n\n![Java literal constants](img/362-1.png)\n\n**图 16.1** Java 字面量常量\n\n###\
  \ 16.2.1 整数常量\n\n它们可以细分为：\n\n1. **十进制整数常量：** 0 10 −745 999\n\n   示例：`int myAge=56;\
  \ // 56 是十进制`\n\n2. **八进制整数常量：** 仅允许 0 到 7 之间的数字。所有八进制数必须以数字 0 开头以标识八进制。\n\n   允许的八进制常量：`0777`、`001`、`0116`、`07565L`（八进制长型）\n\
  \n   非法的八进制常量有：`089` – 8 是非法的，`777` – 不以 0 开头\n\n   `-0675.76` – . 是非法的\n\n   示例：`int\
  \ myAgeOctal=070; // 70 是 56 的八进制等值值`\n\n3. **十六进制常量：** 十六进制数必须以 `0x` 或 `0X` 开头，后跟数字\
  \ 0 到 9 或字母 a 到 f，大或小写均可。\n\n   允许的十六进制常量有：`0xffff`、`0xa11f`、`0x65000UL`\n\n   非法的十六进制常量有：`0x14.55`，非法字符“。”\n\
  \n   示例：`int myAgeHexa=0x38; // 38 是 56 的十六进制等值`\n\n### 16.2.2 浮点常量/实数常量\n\n它们是基数为\
  \ 10 的数，可以用指数形式或小数表示法表示。\n\n   有效的浮点常量有：`0.01`、`789.89765`、`5E-5`、`1.768E+9`\n\n\
  \   无效的浮点声明有：\n\n`6 invalid .` 必须包含指数或浮点。\n\n`5E+12.5` 无效，因为指数不能是浮点数。\n\n`6,789.00`\
  \ 无效字符“，”\n\n   示例： \n```\nfloat area = 567.89; // float 值\ndouble area2 = 567.89;\
  \ //double 值\ndouble area3 = 5.6789e2 ; //科学计数法\n```\n\n### 16.2.3 字符常量\n\n字符常量可以根据计算机遵循的字符集进行声明。ANSI\
  \ 对这些值进行了标准化，如下所示。\n\n![image](img/363-1.png)\n\n此外，Java 允许 Unicode 字符，例如 ISO Latin：`\\\
  u0042`、`\\u0043` 等用于拉丁字符集 a、b 等。字符常量包含一个包含在一对单引号内的单个字符。字符常量的示例：‘5’ ‘X’ ‘；’ ‘ ‘ \n\
  \n注意，字符常量‘5’并不等于数字 5。最后一个常量是空格。字符常量具有整数值，称为 ASCII 值。无法正常打印的特殊字符，双引号（\"\"）、单引号（（'）、问号\
  \ (?) 和反斜杠（`\\`）可以使用转义序列来表示。转义序列始终以 `\\` 开头，后跟上述特殊字符*。\n\n### 16.2.4 字符串常量\n\n字符串常量可以包含任意数量的连续字符，但包含在双引号内。\n\
  \n```\n “new delhi” , “14 Nov 1954” ， 空字符串为“”。\n```\n\n请注意，NULL 字符 `\\0` 表示空字符，被\
  \ Java 语言用于表示字符串的结束。\n\n### 16.2.5 反斜杠字符字符串\n\nJava 支持的一些在输出编程中广泛使用的反斜杠字符常量如表 16.1\
  \ 所示。\n\n**表 16.1** 运算符的优先级和结合规则\n\n| 特殊字符 | 转义序列 |\n| --- | --- |\n| 响铃 | `\\a`\
  \ |\n| 退格 | `\\b` |\n| 水平制表符 | `\\t` |\n| 垂直制表符 | `\\v` |\n| 分页 | `\\f` |\n| 换行符\
  \ | `\\n` |\n| 回车符 | `\\r` |\n| 双引号 | `\\\"` |\n| 单引号 | `\\'` |\n| 反斜杠 | `\\\\`\
  \ |\n| 空字符 | `\\0` |\n| 八进制数 | `\\o` |\n| 十六进制数 | `\\xh` |\n\n### 16.2.6 布尔常量\n\n\
  布尔类型表示 true 或 false。例如：`boolean flag = true; boolean ready = false;`\n\n### 16.2.7\
  \ 符号常量\n\n很多时候我们需要使用符号常量如 `PI` 来表示 3.14159。符号常量使用大写字母。其语法如下：\n\n```\nfinal data_type\
  \ = value\ndouble pi = 3.14159;\nint MAX =50\n```\n\n\n\n\n\n浮点数据类型用于表示数据的小数部分，例如\
  \ `2.434`。浮点数有两种类型，即单精度和双精度。浮点数据类型及其范围见表 16.3。在默认情况下，Java 将 `float` 数据类型视为双精度数字，为了获取\
  \ `float` 类型，我们必须进行类型强制转换，或者附加‘f’或‘F’来表示单精度。例如，`1.4397f` 或 `1.4397e4F`。当我们需要更高的精度时，使用双精度数字。在\
  \ Java 中，所有的数学计算仅以双精度进行。\n\n**表 16.3** 浮点数据类型及其允许的范围\n\n![浮点数据类型及其允许的范围](img/362-1rk.png)\n\
  \n### 16.4.3 字符类型\n\nJava 支持 `char` 数据类型，它占用 2 个字节，但只能存储单个字符。分配 2 个字节是因为 Java 必须适应\
  \ Unicode 中数量大量的字符。\n\n### 16.4.4 布尔数据类型\n\n布尔数据类型仅使用一个位的存储。它用于表示 `true` 或 `false`\
  \ 状态。`true` 和 `false` 不能被放在单引号或双引号中，也不能作为标识符使用。\n\n**示例 16.1: FindMaxDemo.java 查找三个数最大值的程序**\n\
