  \   Details from Student are :idNo:50595\n   Total Marks:990.0\n   Grade:A\n   Reading\
  \ from Serialized Object….\n   Details from Student are :idNo:50595\n   Total Marks:990.0\n\
  \   Grade:A\n```\n\n\n\n\n\n# 8. `Java.io` 包包含用于处理文件 IO 的流类。流文件可以分为两种类型：`ByteStream`\
