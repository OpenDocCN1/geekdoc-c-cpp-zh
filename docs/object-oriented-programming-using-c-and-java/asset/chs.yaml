  \n\n\n让我们通过一个示例来看看提取器（extractors）和插入器（inserters）是如何工作的。考虑以下代码 `int n; cin >> n;`。假设用户使用键盘输入数字\
  \ 6、7、8 然后按下回车键。此操作后，与输入流相关的缓冲区将所示图 13.3。\n\n![输入流的表示](img/293-1.png)\n\n**图 13.3**\
  \ 输入流的表示\n\n单个数字的 ASCII 表示如下：\n\n```\n 6 = 0 × 36 = 0011 0110   7 = 0 × 37 = 0011\
  \ 0111   8 = 0 × 38 = 0011 1000\n```\n\n通过 `cin >> n` 语句，提取器知道输入流应该格式化为整数，因为 `n`\
  \ 的类型是整数。提取器接着从流中提取每个字符并将其转换为十进制值。为了从 ASCII 格式获取等值的十进制值，提取器从流中的每个字符减去 `0` 的 ASCII\
  \ 值（`0 × 30`）。\n\n```\n ‘6’ – ‘0’ = 0 × 36 – 0 × 30 = 6 : ‘7’ – ‘0’ = 0 × 37 – 0\
  \ × 30 = 7 : ‘8’ – ‘0’ = 0 × 38 – 0 × 30 = 8\n```\n\n提取器继续执行上述操作，直到在输入流中遇到 `\\n`\
  \ 或回车（CR）。如果遇到制表符（Tab）、空格（Space）和 EOF 标记，它也会停止提取。在提取过程中，提取运算符还会对已提取的数字或字符计数，并据此设置每个数字的位值。在我们的情况下，6\
  \ 被赋予位值 100，7 被赋予位值 10，8 被赋予位值 1。最后一步是将提取的十进制值与其相应的位值相乘并求加，得到整数表示：`n = 6*100 + 7*10\
  \ + 8*1 = 678`。但在内存中，表示形式为整数，因此 678 将表示为：\n\n```\n 678 = 0 × 2A6 = 0000 0010 1010\
  \ 0110.\n```\n\n插入器的工作方式完全相反。如上面的示例所示，`iostream` 库对象 `cin` 结合提取器运算符 `>>` 为用户提供翻译服务，以及对特殊字符（如回车\
  \ `CR`、空格、制表符和文件结束 `EOF`）的处理。这种 I/O 称为格式化 I/O 或高级 I/O。格式化 I/O 将用户从流的内部机制中抽象出来，更容易使用。格式化\
  \ I/O 的缺点是速度慢，不适用于大数据量。\n\n### 13.3.2 非格式化 IO\n\n非格式化 I/O 也称为低级 I/O。它在所有其他 I/O 机制中提供了最高的效率和吞吐量。与格式化\
  \ I/O 不同，这里的输入没有自动的空白、制表符、回车的检测和处理，而且数据不是格式化的——程序员必须解释数据。\n\n#### 输入：\n\n**get():**\n\
  \n*   从流中读取一个字符（包括空格、EOF 标记等分隔符）并返回它。\n*   用法 `cin.get()`\n\n**get(char& ch):**\n\
  \n*   从流中读取一个字符并将其存储在 `ch` 中。\n*   用法 `cin.get()`\n\n**get(char* str, int count,\
  \ char delim='\\n’):**\n\n*   函数读取 `count-1` 个字符或直到在流中遇到分隔符，并将字符存储在 `str` 缓冲区中。\n\
  *   遇到分隔符时，它不会被复制到 `str` 缓冲区。它留在输入流中。\n*   在数组 `str` 中插入空字符。\n*   `delimiter` 必须从流中刷新，否则它将留在流中。\n\
  *   用法 `cin.get(buffer, count)` // 当你想使用默认分隔符 ‘\\n’ 时\n*   用法 `cin.get(buffer, count,\
  \ ‘#’)` // 当你想使用不同的分隔符时\n\n**getline(char* str, int count, char delim='\\n’):**\n\
  \n*   操作类似于 `get(char* str, int count, char delim= ’\\n’)`\n*   遇到分隔符时，它不会被复制到 `str`\
  \ 缓冲区，但与 `get()` 不同，`getline()` 会从流中丢弃分隔符\n*   用法：类似于 `get(char* str, int count,\
  \ char delim='\\n’)`\n\n**read(char* str, int count) :**\n\n*   函数从流中读取 `count`\
  \ 个字符并放入数组 `str`。\n*   与格式化 I/O 函数不同，`read` 不向缓冲区 `str` 添加字符串终止字符。\n*   如果在读取过程中遇到\
  \ EOF 标记，函数返回错误。\n\n#### 输出：\n\n**put(char ch):**\n\n*   函数将字符 `ch` 写入流。\n*   用法：`cout.put(ch)`\n\
  \n**write(const char* str, int count):**\n\n*   函数将缓冲区 `str` 中的 `count` 个字符写入流。\n\
  *   写入操作不会因任何分隔符而终止。\n*   应采取措施确保缓冲区中有 `count` 个字符。\n*   用法：`cout.write(str, count)`\n\
  \n#### 杂记：\n\n**putback(char c)**\n\n*   将 `get()` 获取的字符 `c` 放回流中。\n\n**peek()**\n\
  \n*   返回流中的下一个字符而不将其移除。\n\n**ignore(num, delim):**\n\n*   跳过 `num` 个字符\n*   在遇到\
  \ `delim` 时终止\n\n考虑以下代码：\n\n```\n cout << filename;\n```\n\n假设你输入了 `filename.txt`\
  \ 并按下回车 `cin.getline(text,80)` 会将 `filename.txt` 存储在 `text` 中但与 `get()` 不同，`getline()`\
  \ 会从流中丢弃分隔符\n\n**示例 13.1:io1.cpp 显示 cin.get() 读取字符**\n\n```\ninclude<iostream>\n\
  #include<cstring>\nusing namespace std;\nvoid main()\n{char ch, str[10];\ncout<<\"\
  \\n Enter any string : Showing input through cin.get() :\nwhile((ch = cin.get())\
  \ != ‘n’) // 使用 get 函数\ncout << ch;\ncout<<\"\\n Enter a string<9 or less characters\
  \ : cin.read>: “; read fn\ncin.read(str, sizeof(str));\nstr[9] = ‘0’;\ncout << endl\
  \ << str;\n}\n```\n输出：Enter any string: Showing input through cin.get():Hello\n\
  Enter a string<9 or less characters: cin.read>:（注：简化输出）\n\n**示例 13.2:formatio2.cpp\
  \ 显示非格式化输出函数**\n\n```\ninclude<iostream>\n#include<conio.h>\n#include<string.h>\n\
  using namespace std;\nvoid main()\n{ int i;\nchar str[] = “I enjoy programming in\
  \ C++” ;\nfor(i = 0 ; str[i] != ‘\\0’; i++) cout.put(str[i]); //write 函数\ncout<<endl;\
  \ cout.write(str, strlen(str)); getch();\n}\n```\n输出 I enjoy programming in C++\
  \ I enjoy programming in C++*\n第 9 行显示了 `cout.write()` 的用法。注意 `write` 适用于 `cout`。\n\
  \n### 13.3.3 IO 流状态\n\nC++ 中的 I/O 库提供了一种机制来测试特定的 I/O 操作是否成功或失败。每个流对象维护一组标志，指示 I/O\
  \ 操作后流的状态。库还提供了一系列成员函数可用于测试这些标志。标志和相应的成员函数所示[表 13.1]。\n\n**表 13.1** 标志与成员函数\n\n\
  | 标志名称 | 描述 | 测试函数 |\n| --- | --- | --- |\n| goodbit | 当流未遇到任何错误时置为 1 | `good()`\
  \ 例: `cin.good()` |\n| eofbit | 当流遇到文件结束时置为 1 | `eof()` 例: `cin.eof()` |\n| failbit\
  \ | 当流遇到错误但可以恢复时置为 1 | `fail()` 例: `cin.fail()` |\n\n\n\n\n\n| `badbit` | 当流损坏且不可恢复时设置为\
  \ 1 | `bad()` 示例：`cin.bad()` |\n\n## 示例 13.3：显示流状态标志的 streamstate.cpp 程序\n\n```cpp\n\
  #include<iostream>\n#include<conio.h>\nusing namespace std;\nvoid main()\n{int value;\n\
  \ cout << “Enter Value: “;cin >> value;\ncout <<endl <<”goodbit: “<< cin.good();cout\
  \ <<endl <<”eofbit : “<< cin.eof();\ncout <<endl <<”failbit: “<< cin.fail();cout\
  \ <<endl <<”badbit : “<< cin.bad();\ncout <<endl <<\"Enter Value(enter characters\
  \ to see effect on flags): \";cin >> value;\ncout <<endl <<\"goodbit: \"<< cin.good();cout\
  \ << endl <<\"eofbit : \"<< cin.eof();\ncout <<endl <<”failbit: “<< cin.fail();cout\
  \ << endl <<”badbit : “<< cin.bad();\ngetch();\n}\n/* Output : Enter Value: 47 goodbit:\
  \ 1eofbit : 0failbit: 0badbit : 0\nEnter Value(enter characters to see effect on\
  \ flags): ghj :\ngoodbit: 0eofbit : 0failbit: 1badbit : 0*/\n```\n\n### 13.3.4 IO\
  \ 流库 – 头文件\n\n`<iostream>` 头文件允许字节数据从源流向目的地。流与所流传输的数据类型或源、目的地无关。\n\nC++ 支持 `istream`\
  \ 用于输入，支持 `ostream` 用于输出。IO 流库包含了四种预定义的流：\n\n- `cin`：用于标准缓冲输入\n- `cout`：用于标准缓冲输出\n\
  - `cerr`：用于无缓冲错误输出。工作方式与 `cout` 相同\n- `clog`：用于缓冲日志\n\n`<iomanip>` 头文件包含若干种用于处理格式化输出的功能，如\
  \ `setw()`、`setprecision()` 等。\n\n`<fstream>` 包含了处理文件所需的所有程序。IO 流的层次结构如图图 13.4 所示。\n\
  \n![IO stream class hierarchy](img/298-1.png)\n\n**图 13.4** IO 流类层次\n\n## 示例 13.4：显示\
  \ Cin 和 Cout 的 io1.cpp 程序\n\n```cpp\n#include<iostream>\nusing namespace std;\n\
  void main()\n{double price; char title[30]; char author[30];\n  char * tell = “\
  \ Enter the title of the Book, Author and price :”; cout<<tell;\n  cin>>title>>author>>price;\
  \ cout<<”\\nTile of the book :”<<title<<endl;\n  cout<<”\\nAuthor of the book :”<<author<<endl;\n\
  \  cout<<”\\nPrice of the book :”<<price<<endl;\n}\n/*Output :Enter the title of\
  \ the Book, Author and price :C++ ramesh 250.00\nTile of the book :C++ : Author\
  \ of the book :ramesh : Price of the book :250*/\n```\n\n## 13.4 操纵符\n\n操纵符改变流的状态。要使用此功能，我们需要在全局部分包含语句：`#include<iomanip>`。例如，如果我们使用操纵符\
  \ `setprecision(2)`，所有浮点型变量的输出将保留小数点后两位数字。一些重要的 IO 操纵符包括：\n\n```cpp\ncout<<dec<<intvar;整数的十进制/十六进制/八进制表示\n\
  cout<<hex; cout <<oct;\ncout<<setiosflags(ios::dec) 将格式位设为十进制\ncout<<resetiosflags(ios::hex)\
  \ 按照指定的格式重置已设置的标志\ncout<<setbase(int n) :将基设置为 n\ncout<<setw(int n) :为输出格式指定宽度\n\
  cout<<setfill：“*”); :用填充字符填充 setw() 设置的未填充空间\n```\n\n字符操纵符如表 13.2 所示。数值和数据流操纵符分别如表\
  \ 13.3 和 13.4 所示。\n\n**表 13.2** 字符操纵符\n\n| 操纵符 | 受影响的标志 | 说明 |\n| --- | --- | ---\
  \ |\n| `setw(val)` | 无 | 将输出字段的宽度设置为指定值 |\n| `setfil(char)` | 无 | 用指定的字符填充输出的未填充宽度\
  \ |\n| `right` | `ios::right` | 输出向右对齐 |\n| `left` | `ios::left` | 输出向左对齐 |\n| `internal`\
  \ | `ios::internal` | 左侧调整符号，右侧调整数值 |\n\n**表 13.3** 数值操纵符\n\n| 操纵符 | 受影响的标志 | 说明\
  \ |\n| --- | --- | --- |\n| `dec` | `ios::dec` | I/O 使用十进制法进行输入和输出 |\n| `hex` |\
  \ `ios::hex` | I/O 使用十六进制法进行输入和输出 |\n| `oct` | `ios::oct` | I/O 使用八进制法进行输入和输出 |\n\
  | `scientific` | `ios::scientific` | 以科学计数法显示浮点数 |\n| `fixed` | `ios::fixed` | 以定点法显示浮点数\
  \ |\n| `setprecision(n)` | 无 | 将浮点型变量的精度设置为 n |\n\n**表 13.4** 数据流操纵符\n\n| 操纵符 |\
  \ 受影响的标志 | 说明 |\n| --- | --- | --- |\n| `endl` | 无 | 在流中插入换行符并刷新（发送）缓冲区到输出端 |\n\
  | `flush` | 无 | 将输出缓冲区刷新到控制台 |\n| `ws` | 无 | 忽略输入中的空白字符 |\n\n```cpp\ncout<<endl;\
  \ :向 iostream 写入新行并刷新缓冲区。\ncout<<flush; :刷新 ostream 缓冲区\ncout<<ends; :在末尾插入空字符\n\
  ```\n\n#### 方法 1：使用 setiosflags 操控标志\n\n```cpp\ncout << setiosflags(ios::left);\n\
  cout << setw(10) << setfill(‘.') << “Hello” ;\n```\n\n#### 方法 2：使用操纵符\n\n```cpp\n\
  cout << left <<setw(10)<<setfill(‘.’)<<”Hello” ;\n```\n\n## 示例 13.5：显示 Cin 和 Cout\
  \ 工作的 io2.cpp 程序\n\n```cpp\n1\\.  #include<iostream>\n2\\.  #include<iomanip>\n\
  3\\.  using namespace std;\n4\\.  void main()\n5\\.  {double price; char title[30];\
  \ char author[30];\n6\\.  char * tell = “ Enter the title of the Book, Author and\
  \ price :”; cout<<tell;\n7\\.  cin>>title>>author>>price; cout<<”\\nTile of the\
  \ book :”<<title<<endl;\n8\\.  cout<<”\\nAuthor of the book :”<<author<<endl;\n\
  9\\.  cout<<”\\nPrice of the book :”<<price<<endl;\n10\\.  cout << setiosflags(ios::left);\n\
  11\\.  cout << setw(10) << setfill(‘.’) << “Hello” ;\n12\\.  cout << left <<setw(10)<<setfill(‘.’)<<”Hello”\
  \ ;\n13\\.  }\n```\n*(注：示例 13.5 提供的文本已破碎；已根据源代码中周围代码段的逻辑进行了重构。)*\n\n## 13.5 标志\n\
  \n传递给 `setiosflags` 和 `resetiosflags` 操纵符的参数所示：\n\n- `ios::skipws`：跳过输入中的空白\n- `ios::left`\
  \ 或 `ios::right`：左对齐或右对齐\n- `ios::scientific`：科学计数法\n- `ios::fixed`：浮点数遵循十进制法\n\
  - `ios::hex`, `ios::oct`：基数法\n- `ios::showbase`：输出基数符号\n- `ios::showpoint`：显示小数点\n\
  - `ios::showposs`：显示正数时显示 + 号\n\n## 13.6 文件 I/O\n\n我们在无论何处都会遇到文件。例如，大学为每位学生保留一个文件。同样，市政府也持有包含公民需要缴纳税款详情的文件。事实上，文件在生活中非常常见，C++\
  \ 语言和其他语言都支持文件。**什么是文件？** 文件是记录的集合。图 13.2 显示了一个名为 `student.dat` 的文件，其中包含属于 **n**\
  \ 个学生的 **n** 条记录。\n\n![File and records](img/301-1.png)\n\n**图 13.5** 一条记录\n\n\n\
  \n\n\n记录包含字段。图 13.6 显示了一个记录以及其中包含的字段。\n\n![Record and fields](img/301-2.png)\n\n\
  **图 13.6** 记录与字段\n\n### 13.6.1 文件类型\n\n文件可以根据从内存中访问的方式分类为：\n\n**顺序文件：** 所有记录都按照输入顺序顺序存储。当我们需要按顺序一个接一个访问所有记录时，这种类型最为合适。对某个类进行批处理就是一个例子。\n\
  \n**随机访问文件：** 在这种访问模式下，使用为该目的维护的索引来访问记录。这就像通过书开头提供的索引来查阅某个章节，并在该章节内找到感兴趣的页码。\n\n\
  **直接访问文件：** 在这种模式下，记录根据其相对于第一个记录的相对位置进行存储。例如，第 50 号记录距离第 1 号记录地址 50 个长度。这种访问模式的主要优点是不需要维护会产生内存开销的索引。缺点是内存位置会被阻塞。\n\
  \nC++ 语言支持顺序访问和直接访问模式。\n\n文件可以进一步分类为 `文本文件` 或 `二进制文件`。通常，在文本文件中，数据使用 ASCII 字符编码存储。因此，要在文本模式下存储\
  \ `1234.5`，我们需要 6 个字符空间，即 48 位；而如果你以二进制模式存储，将节省大量内存，因为我们将 `1234.5` 转换为二进制后再存储。因此，对于存储大数字和大型尺寸的内在数据，二进制模式总是首选。\n\
  \nC++ 中与文件处理相关的类都包含在 `fstream` 头文件中。因此，插入语句：`#include<fstream>`\n\n为了`open` 一个文件并写入数据，我们如下创建一个\
  \ `ofstream` 对象：\n\n```\nofstream outfile(“Student.dat”);\n```\n\n为了`open` 一个文件并读取数据，我们如下创建一个\
  \ `ifstream` 对象：\n\n```\nifstream infile(“Student.dat”);\n```\n\n我们需要检查 `infile`\
  \ 流是否已成功分配。在 C++ 中，逻辑非运算符被重载以检查流文件的创建：\n\n```cpp\nif(!infile) {cerr<<”\\n Sorry\
  \ cannot open the file infile..”<<endl; exit(1);}\n```\n\n使用后，每个打开的文件都需要像这样关闭：`outfile.close()`；`infile.close()`。\n\
  \n### 13.6.2 流打开模式\n\n可以控制文件的打开模式。在通过构造函数创建对象时，我们需要包含这些模式切换器。\n\n| ios::app | ;\
  \ 在文件末尾追加数据。 |\n| ios::ate | : 打开文件并将读取或写入控制器定位在末尾的读取头。 |\n| ios::in | : 打开文件进行读取。\
  \ |\n| ios::out | : 打开文件进行写入。 |\n| ios::nocreate | : 如果不存在则打开失败。 |\n| ios::noreplace\
  \ | : 文件必须存在，且应设置 `ios::ate` 或 `ios::app` 之一。 |\n| ios::trunk | : 如果文件已存在，则将其截断。\
  \ |\n\n我们将编写一个程序，将一个文件的内容复制到另一个文件中。在示例 13.6 中，我们将使用命令行参数功能。通过命令行参数，你可以从命令行提示符 `C:>\\\
  \ iop io2.cpp io2copy.cpp` 执行程序。共有三个参数，分别是 `argv[0] = io2.cpp`，`argv[1] = io2.cpp`\
  \ 是源。`argv[2] = io2copy.cpp` 是目标文件。此功能允许我们直接从命令行提示符执行程序，无需调用 Turbo C++ 或 VC++ 的\
  \ IDE。\n\n**示例 13.6: io3.cpp 通过命令行参数复制文件的程序**\n\n```cpp\n#include<fstream>\n#include<iostream>\n\
  using namespace std;\nvoid main(int argc , char **argv)\n{{if ( argc<3)\n      {cout<<”\\\
  n correct usage of command line argument is : copyfile inputfile\n      outputfile..\"\
  <<endl; exit(0); }\n      // 打开输入文件并将其连接到输入流 inputstream\n      ifstream inputstream(argv[1]);\n\
  \      if(!inputstream)\n      { cout<<”\\n cannot open the input file ..”<<argv[1]<<endl;\
  \ exit(1); }\n      // 打开输出文件并将其连接到输出 stream\n      of stream outputstream(argv[2]);\n\
  \      if(!outputstream)\n      { cout<<”\\n cannot open the output file ..”<<argv[2]<<endl;\
  \ exit(1); }\n      // 现在从输入文件读取并复制到输出文件\n      char ch;\n      while ( (inputstream.get(ch))\
  \ && outputstream ) outputstream.put(ch);\n}\n```\n\n我们在习题部分（章节末尾的 Ex 2）中展示了另一个版本，其中我们从用户处获取文件名，并执行将源文件复制到目标文件。\n\
  \n**示例 13.7: io5.cpp 以追加模式打开文件并追加一行**\n\n```cpp\n#include<fstream>\n#include<iostream>\n\
  using namespace std;\nvoid main()\n{   char text[30]; // 用户输入的缓冲区\n    cin.getline(text,30);\
  \ // getline 获取最多 30 个字符\n    // 但换行符 \\n 被忽略且未被读入\n    cin.ignore(1,'\\n’); //\
  \ 忽略第二个参数所示的 1 个字符\n}\n```\n*(注：提供的示例 13.7 文本较为混乱，已根据高级排版逻辑提取了核心代码结构)*\n\n## 13.7\
  \ 二进制文件\n\n通常，为了方便在控制台上直接读取，文件以文本格式存储。但为了效率和节省空间，将数据存储为二进制形式要有效得多，即 0 和 1 的形式。例如，数字\
  \ 50595 在文本文件中存储为‘5’‘0’‘5’‘9’‘5’，而二进制形式将根据使用的硬件分配 2 或 4 字节并以二进制等值存储。在 C++ 中，名为 `ios::binary`\
  \ 的标志将指定此模式。\n\n二进制文件可以存储所有内在数据类型以及用户定义的数据类型（如对象）。我们将使用 `write()` 将数据写入二进制文件，使用\
  \ `read()` 从二进制文件中获取数据。\n\n```cpp\nStudent std ( 20 , 70) ; // 带有学号和平均分的学生对象\nfileobject.write(\
  \ ( char*) & std , sizeof (std) );\nfileobject.read( ( char*) & std , sizeof (std)\
  \ );\n```\n\n**示例 13.8: io6.cpp 将名为 Student 的类写入文件并回读文件内容**\n\n\n\n\n\n```cpp\n\
