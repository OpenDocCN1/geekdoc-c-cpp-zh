  \nSmt. V. Usha Ramesh\n\n感谢你对家庭付出的卓越贡献。\n\n## 前言\n\n欢迎来到 C++ 和 Java 面向对象编程的世界。准备好开启精彩的旅程吧！\n\
  \n在多年向本科生、研究生以及行业专业人士教授 OOP、C++ 和 Java 的过程中，我们的经验表明：\n\n*   C++ 和 Java 领域都有优秀的程序员，但其中极少数人能理解底层的\
  \ OOP 概念。\n*   现有的教材将 C++、Java 和 OOP 概念视为不同且独立的内容，学生以碎片化的方式接触这些概念。\n*   对 OOP 语言、分析与设计以及软件开发的研究都是分开处理的，从而牺牲了集成的\
  \ OOP 方法。\n*   C++ 是一种高度演化的语言，用于系统开发，具有模板（templates）和容器等高级特性。大多数教材仅将 C++ 视为一种语言，而不是实现\
  \ OOP 概念的工具。\n*   Java 是一种庞大且广泛使用的网络语言，具有多种 OOP 概念、网络编程，并使用 `JDBC`、`Servlets`、图形编程和\
  \ Java Beans 等工具进行软件开发。大多数教材充分涵盖了 Java 核心内容，但在提供实现细节方面大不从心。\n*   目前没有单一教材能涵盖印度所有主要大学关于\
  \ OOP、C++ 和 Java 的教学大纲。\n\n本书恰好在这些关键方面能够为你提供帮助。\n\n尽管拥有 C 语言知识无疑是一个加分项，但我们并不假设读者具备任何背景知识。你可以直接精通\
  \ C++ 和/或 Java。本书采用的方法是让学生通过实践和示例来学习。\n\n每个概念都通过 C++ 和 Java 的代码段进行了解释。这些章节的独特特点是包含了大量的运行示例（超过\
  \ 600 个），以及如大学管理、网上银行、电子购物、图书馆采购等案例研究，学生可以利用底层概念和理论轻松地关联并学习。全书使用了统一建模语言（UML）符号。在每章的末尾，我们提供了客观题、简答题和论述题、带有答案的练习题以及作业题。\n\
  \n所有程序均在 Linux、`VC++` 和 `TC++` 平台上经过测试。我们运行 Java 程序的开发平台是 `eclipse`、`NetBeans` 和\
  \ `JDK1.6`。使用的数据库均为行业标准，如 `Oracle`、`MySql`（开源）以及广泛提供的 Microsoft Access 数据库。代码和说明详尽，旨在快速提供解决方案并增强学习体验。\n\
