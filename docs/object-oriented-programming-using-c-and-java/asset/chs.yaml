  \ 15.7 总结\n\n1. Java 是一种网络语言。互联网是协作网络的集合。网络是协作计算机的集合。\n\n2. `WWW`（世界维特网，或简称 web）是从网络访问信息的一种方式。我们使用\
  \ `HTTP`/`FTP` 从 Web 上检索信息。电子邮件（通过简单邮件协议 `SMP`）是 Web 上交换信息的另一种重要且广泛使用的方法。\n\n3.\
  \ Java 是平台无关的，即它独立于控制硬件资源的底层硬件和操作系统。\n\n4. Java 最初由其发明者 `James Gosling` 和 `Patrik\
  \ Naughton` 命名为“OAK”。\n\n5. 从现有类扩展/派生新类，通过内部类实现包含，通过 `Inheritance（继承）`机制实现扩展。\n\n\
  6. Java 支持单继承、多级继承和层次继承。Java 不支持多继承。\n\n7. 带有抽象方法的类称为带有 `abstract` 关键字的抽象类。抽象类一定需要抽象方法。\n\
  \n8. `Interface（接口）` 使用关键字 `interface` 而不是通常关键字 `class` 声明。接口只能包含抽象方法。然而，对这些方法使用\
  \ `abstract` 关键字是可选的。\n\n9. 一个类只能扩展一个类，但可以实现多个接口。\n\n10. 泛型编程是 Java 提供的一种实现代码复用性的机制。`Generics（泛型）`\
  \ 可以应用于类和方法。泛型编程对于类型抽象化非常有用。\n\n11. Java 支持单行、多行和 Java API 文档注释。\n\n12. 字节码（Byte\
  \ code）是 1 字节（8 位）的指令集。字节码是紧凑的数值代码和引用（通常是数值地址）。\n\n13. `JVM` 不可移植，但字节码是完全可移植的。`JVM`\
  \ 特定于硬件和操作系统。\n\n14. `Package（包）` 是所有类文件的集合。\n\n15. `Path` 命令用于链接位于任何目录下的资源。\n\n\
  16. `Classpath（类路径）` 用于告知 Java 运行时环境在何查找类文件。\n\n17. `Javadoc` 是用于为包生成 API 文档的编译器。\n\
  \n18. `java.io.*` 是用于导入所有与 `io` 相关的文件的导入语句。同样，`java.lang.*` 是被导入的包含 Java 特性的包。这是\
  \ Java 默认自动导入的默认包。\n\n19. 关键字 `public` 意味着公共类内部的方法可以在类层级之外被调用。\n\n20. 关键字 `static`\
  \ 意味着可以直接调用该类，而无需使用类的实例来调用 `main` 方法。\n\n21. Java 扩展包 `Javax` 包含了几个图形库，这些库可以极大增强图形组件。\n\
