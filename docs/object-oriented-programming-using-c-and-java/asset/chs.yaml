  \ C++语言字符串处理\n\n字符数组被称为字符串变量。字符串变量总是以 `\\0`（NULL）字符终止。C++ 编译器认为 NULL 字符意味着字符串的结束。在下面的程序中，我们将检查\
  \ `\\0` 的出现表示字符串的结束。考虑下面的字符串声明并判断哪种声明类型对 C++ 最优。\n\n```\nchar city[6] =”Mumbai”;\
