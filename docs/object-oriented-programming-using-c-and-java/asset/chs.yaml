  \ :”+ this.r +”Angle<t>”+ this.t);\n27\\.   } // 以极坐标和直卡尔坐标形式显示\n28\\.   }// Polar1\
  \ 类结束\n29\\.   class PolarThis1Demo {\n30\\.   public static void main(String[]\
