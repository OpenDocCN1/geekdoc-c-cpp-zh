  \   Date :Sun Dec 19 19:56:32 IST 2010\n   Size :16880\n   Date last modified:Fri\
  \ Oct 01 07:04:33 IST 2010\n```\n\n#### 22.5 TCP/IP 套接字（Sockets）\n\n你可能注意到过插座。插入插头，电源就会通过插座流动并运行你的设备。同样地，通信中的套接字是服务器和客户端之间的连接点，以便服务器和客户端之间可以进行可靠的双向通信。\n\
  \n\n\n\nSocket 有唯一的标识号，也称为端口号，占用 16 位（2 字节）。在第 22.2.1 节中，我们已经讨论了为 `http/ftp` 等标准应用程序保留的端口。请注意，每当创建一个新的\
  \ socket 时，必须为端口分配一个新的端口号。\n\nSocket 有两种：使用 `ServerSocket` 类创建的服务端 socket `ServerSocket`，以及使用\
  \ `socket` 类创建的客户端 socket `socket`。`ServerSocket` 可以存在任何提供服务的系统中。例如，如果客户端有任何可以提供的服务，可以在客户端上创建\
  \ `ServerSocket`。\n\n### 22.5.1 ServerSocket 类\n\n`ServerSocket` 创建后会监听本地或远程客户端，并在特定的发布端口上与它们连接。这是通过\
  \ `ServerSocket` 首先向系统注册自身来实现。构造函数接受端口号和队列长度（即服务器可以接受的客户端最大数量）。`ServerSocket` 的构造函数如表\
  \ 22.2 所示。`ServerSocket` 有一个名为 `accept()` 的方法，它会阻塞服务器并等待客户端的连接请求。服务器会为客户端创建一个 socket。\n\
  \n**表 22.2** ServerSocket 构造函数\n\n| ServerSocket 类构造函数 | 功能描述 |\n| --- | --- |\n\
  | `ServerSocket(int port)` | 在指定端口上创建一个默认队列长度为 50 的 `ServerSocket` |\n| `ServerSocket(int\
  \ port,int len)` | 在指定端口上创建一个队列长度为 `len` 的 `ServerSocket` |\n| `ServerSocket(int\
  \ port,int len, InetAddress localaddress)` | 在指定端口上创建一个队列长度为 `len` 且属于本地地址系统的 `ServerSocket`\
  \ |\n\n### 22.5.2 用于通信的 Server 和 Socket：如何让它们工作起来？\n\n* 在服务器端，使用 `ServerSocket`\
  \ 类创建一个服务端 socket 并分配一个端口号：`ServerSocket servskt = new ServerSocket (port number);`\n\
  * 通过使用 `Socket` 类创建客户端 socket 并使用 `accept()` 方法让服务器等待客户端的连接请求：\n  ```\n  Socket\
  \ clientskt = serverskt.accept();\n  ```\n* 使用 `getOutputStream()` 将 `OutputStream`\
  \ 链接到新创建的 socket 对象 `clientskt`，该方法返回一个输出流对象。该对象将用于 `clientskt` 向客户端发送数据。\n  ```\n\
  \  OutputStream comobj = clientskt. getOutputStream();\n  ```\n* 使用 `PrintStream`\
  \ 将数据传输到 socket：`clientskt`\n  ```\n  PrintStream prntobj =new PrintStream(comobj)\n\
  \  ```\n* 使用 `println` 或 `print` 方法发送数据\n  ```\n  prntobj.println(stg);//stg 是一条消息\n\
  \  ```\n* 在传输结束时关闭所有 socket：`servskt.close(); clientskt. close();` 和 `prntobj.close();。图\
  \ 22.4 显示了服务器、客户端、流读取器和缓冲区之间的连接。\n\n  ![来自远程客户端的输入](img/534-1.png)\n\n  **图 22.4**\
  \ 来自远程客户端的输入\n\n### 22.5.3 用于通信的客户端和 Socket：如何让它们工作起来？\n\n* 在客户端，使用 `Socket` 类创建一个客户端\
  \ socket，指定服务器的 IP 地址并分配一个端口号：\n  ```\n  Socket skt = new Socket (“IPaddress”, port\
  \ number);\n  ```\n  `IPAddress` 是服务器的 IP 地址。要查看计算机的 `IPAddress`，前往控制面板 ![image](img/arrow.png)\
  \ `NetworkConnections` ---> `Local area connections` ---> `TCP/IP` ----> 你可以看到机器的\
  \ `IPAddress`。\n* 使用 `getInputStream()` 将 `InputStream` 链接到新创建的 socket 对象 `skt`，该方法返回一个输入流对象。该对象将用于\
  \ `skt` 对象从服务器接收数据。\n  ```\n  InputStream comobj = skt. getgetInputStream();\n \
  \ ```\n* 使用 `BufferedReader` 从 socket `skt` 获取数据：\n  ```\n  BufferedReader bfrtobj\
  \ = new BufferedReader (new InputStreamReader(comobj));\n  ```\n* 使用 `read()` 或\
  \ `readLine()` 方法读取数据\n  ```\n  Stg= bfrobj.readLine(); // stg 是一条消息\n  ```\n* 在传输结束时关闭所有\
  \ socket：`skt.clos(); bfrobj.close();。图 22.5 显示了服务器、客户端、流读取器和缓冲区之间的连接。\n\n  ![来自远程服务器的输入](img/534-2.png)\n\
  \n  **图 22.5** 来自远程服务器的输入\n\n### 22.6 客户端/服务器程序\n\n在本节中，你将学习客户端服务器编程。正如标题所示，有一个一直在运行的服务器在发布的端口上监听客户端。显然，服务器提供一个客户端感兴趣的服务。服务器接受的客户端数量是有限的；这个限制被称为服务器的最大队列长度。服务器使用\
  \ `ServerSocket` 类。\n\n然后有一个客户端，它知道服务器的地址以及特定应用程序运行的端口号。客户端发送服务请求，服务器通过 `accept()`\
  \ 方法接收该请求。`accept()` 方法还会返回一个 `ServerSocket` 对象。\n\n连接建立后，服务器和客户端将建立流连接并进行通信。作为一个示例，我们将建立连接并向客户端传递字符串消息。\n\
  \n**示例 22.4: SrverDemo1.Java 向客户端传递字符串消息的服务端 Java 程序**\n\n```\npackage com.oops.chap22;\n\
  import java.io.*;\nimport java.net.*;\npublic class SrverDemo1 {\npublic static\
  \ void main(String[] args)throws IOException {\n//服务端 socket\nServerSocket servskt\
  \ = new ServerSocket (8345);\n//阻塞服务器即使用 accept() 并在客户端客户端 socket\nSocket clientskt\
  \ = serverskt.accept();\n//使用 getOutputStream() 将 OutputStream 链接到 socket 对象 clientskt\n\
  OutputStream comobj = clientskt. getOutputStream();\n//使用 PrintStream 向 socket 传输数据：clientskt\n\
  PrintStream prntobj =new PrintStream(comobj);\nString stg1 = “Welcome client”;\n\
  String stg2 = “ Networking program run a great!”;\n//发送数据\nprntobj.println(stg1);\n\
  //关闭所有\nprntobj.println(stg2);\n//关闭所有\nservskt.close(); clientskt.close();\n}\n\
  }\n```\n\n* 第 7 行创建一个名为 `sevkt` 的 `ServerSocket` 对象。第 9 行为客户端创建一个 `Socket` 类的对象并让服务器调用\
  \ `accept()` 方法。\n* 第 11 行通过 `getOutputStream()` 将输出流连接到客户端 socket `clientskt`。\n\
  * 第 12 行创建一个 `PrintStream` 用于向 socket 发送数据；第 17 和 18 行将字符串消息发送给客户端。\n\n\n\n```java\n\
  package com.oops.chap22;\nimport java.io.*;\nimport java.net.*;\npublic class ClientDemo1\
  \ {\n    public static void main(String[] args) throws IOException {\n        //使用\
  \ Socket 类创建一个客户端 socket\n        Socket skt = new Socket(\"localhost\", 8345);\n\
  \        //将输入流 绑定到 socket 对象 skt\n        InputStream comobj = skt.getInputStream();\n\
  \        //使用 BufferedReader 从 socket 获取数据\n        BufferedReader bfrtobj = new\
  \ BufferedReader(new InputStreamReader(comobj));\n        // 接收消息\n        String\
  \ stg;\n        while ((stg = bfrtobj.readLine()) != null)\n            System.out.println(\"\
  \\n 来自服务器的消息\" + stg);\n        //关闭所有\n        skt.close(); bfrtobj.close();\n\
  \    }\n}\n```\n输出: Message from Server :Welcome client\nMessage from Server Networking\
  \ program run a great fun!\n```\n\n### 22.6.1 客户端-服务器双向通信程序\n\n在本节中，我们将处理服务器与客户端之间的双向通信。服务器存储两个数组：其中一个数组存储学号（`RollNumbers`），另一个数组存储学术成绩。客户端发送学号，服务器检查成绩并将其发送给客户端。客户端随后显示结果。该概念在图\
  \ 22.6 中所示。\n\n![客户端服务器双向通信](img/536-1.png)\n\n**图 22.6** 客户端-服务器双向通信\n\n**示例 22.6a：编写\
  \ Java 客户端-服务器程序，其中客户端提交学号并从服务器获取成绩——服务器端编程**\n\n```java\npackage com.oops.chap22;\n\
