  \ 加法 - 减法 * 乘法\n / 除法 % 取模（除余数）\n```\n\n这些运算符被称为二元运算符，因为它们作用于两个操作数。例如，`a + b` 涉及一个二元运算符\
  \ `+` 和两个操作数 `a` 和 `b`。在 Java 中，除法意味着整数除法。例如，`5/4` 的结果为 `1`。`%` 运算符也称为取模运算符，其结果为余数。例如，`20%4`\
  \ 的结果为 `0`，`21%4` 的结果为 `5`。\n\n## 16.7 类型转换与强制转换\n\n### 16.7.1 类型转换\n\n如果操作涉及变量类型不同，Java\
  \ 会在操作之前自动进行类型转换。如果操作是在 `float` 和 `double` 之间进行的，`float` 将被转换为 `double`，结果也将是 `double`。我们可以说类型转换中发生了宽化或窄化。从小数据类型转换为大数据类型的过程称为宽化，从大数据类型转换为小数据类型的过程称为窄化。注意窄化会导致数据截断。如果表达式持有\
  \ `byte`、`short` 或 `int`，则结果会被宽化为 `int`。同样，对于浮点数，Java 会自动转换为 `double`，最后结果根据表达式中最大的数据类型显示，或者按照用户通过强制转换（在下一节解释）指定的显示。\n\
  \n### 16.7.2 类型强制转换\n\n假设我们想在特定数据类型中声明结果，可以如下所示进行强制转换。当方法返回不同的数据类型时，经常使用强制转换。\n\n\
  语法如下：\n\n```java\n type var1 = ( type casted) var2;\n int a , b; float x;\n x=(float)a/b;\
  \ // a/b 是整数除法，结果转换为 float。\n```\n\n**示例 16.3: QuadraticDemo.java 寻找二次方程的根**\n\n\
  //QuadraticDemo.java\n\n```java\n1. package com.oops.chap16;\n2. import java.io.*;\n\
