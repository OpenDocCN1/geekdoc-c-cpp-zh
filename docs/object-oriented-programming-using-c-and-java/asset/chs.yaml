  \n#### 20.15 同步\n\n当多个线程作用于不同的对象时，我们称之为多任务处理。根据分配的优先级以及 CPU 调度，线程执行不同的对象并产生结果。在这种情况下没有问题。\n\
  \n\n\n\n\n假设多个线程作用于同一个对象。这可能会导致问题。假设有两个线程，`thread1` `&` `thread2` 作用于该对象，即它们将并发执行相同的\
  \ `run()` 命令。每个线程只有一个任务，即递增 `counter` 并将其发送到 `printer` 进行打印。我们预期的输出是：`thread1 1001,thread2:\
  \ 1001; thread:1002, thread2: 1002` 等。请记住 `thread` 运行在 CPU 上，执行速度是纳秒级的，而 `printer`\
  \ 是一个慢设备。假设 `counter` 的初始值为 `1000`。在 `thread1` 将其递增到 `1001` 之后、打印计数之前（即 `1001`），控制权可能由于\
  \ `sleep()` 或 `wait()` 等原因传递给 `thread2`，这会将 `counter` 增加到 `1002`。`printer` 将查找 `count`\
  \ 并打印 `1002`，而不是我们通常预期的 `1001`，从而导致错误的结果。第二种情况是在打印 `1001` 之后，如果 CPU 仍由 `thread1`\
  \ 控制，它将再次递增并打印 `1002`，再次导致错误的结果。多个线程在单个对象上独立工作以及可能出现的问题见 Ex 20.6。\n\n![Multiple\
  \ objects on a single object](img/496-1.png)\n\n**图 20.5** 单个对象上的多个对象\n\nJava 提供了一种名为\
  \ `synchronization`（同步）的特性，帮助我们解决多个线程共享公共资源以及使用如 `printer` 相同的对象的问题。例如，我们可以使用：`synchronized\
  \ void UpDateCount(){ //此处的代码…}`\n\nJava 为 `UpDateCount()` 创建了一个监视器（monitor），并将其交给进入对象的线程。它就像一把钥匙。其他对象加入队列等待进入\
  \ `Member` 方法 `UpDateCount()` 的机会。因此就不会产生冲突。但同步的代价是什么呢？简单来说就是线程变成了串行处理，而不是并发处理。这类似于铁路火车在平台上等待通过一座只有单轨的桥。除非火车完成了桥段的操作并通知信号执行完毕，否则第二列火车无法进入桥段。\n\
  \n### 示例 20.13: SynchronisedDemo.java: 一个显示使用同步块解决多线程作用于单个对象问题的程序\n\n```\n 1\\.\
  \ package com.oops.chap20;\n   2\\. class Sync3 extends Thread{\n   3\\. Thread\
  \ thrd;\n   4\\. Sync3(String stg){\n   5\\. super(stg);}\n   6\\. public void run(){\n\
  \   7\\. synchronized(this) {\n   8\\. try{\n   9\\. for(int i=1000;i<1010;i++)\n\
  \   10\\.  {System.out.println(this.getName() + (i) + “ : “);\n   11\\.    Thread.sleep(500);\n\
  \   12\\.  }\n   13\\.  }catch(InterruptedException e )\n   14\\.  {System.out.println(“thread1\
  \ interrupted”);}\n   15\\.  System.out.println(“Exiting from thread1”+this.getName());\n\
  \   16\\.  }//end of try\n   17\\.  }//end of run\n   18\\.  }\n   19\\.  public\
  \ class SynchronisedDemo {\n   20\\.  public static void main(String[] args) {\n\
  \   21\\.  //create an object ofMaxPriority & MinPriority\n   22\\.  Sync3 obj1\
  \ =new Sync3(“Sync1”);obj1.start();\n   23\\.  Sync3 obj2 = new Sync3(“Sync2”);obj2.start();\n\
  \   24\\.  }//end of main\n   25\\.  }// end of class SynchronisedDemo\n   Sync11000\
  \ : Sync20000 : Sync11001 : Sync20001 : Sync11002 :\n   Sync20002 : Sync11003 :\
