  \ 对象 `dosfile`。这就是 `FilterOutputStream` 的工作原理。 |\n\n![image](img/515-1.png)\n\n\
  | **Line Nos. 24–25:** | 同样使用包装了 `FileInputStream` 的 `DataInputStream`。 |\n\n| **Line\
  \ Nos. 26–28:** | 使用 swing 组件通过消息框显示输出。 |\n\n## 21.8 File 类\n\n`File` 类帮助我们创建文件和目录。它包含了所有与文件相关的管理方法，如创建、打开、关闭、删除、获取文件名称和大小、重命名文件等。\n\
  \n我们一直通过抛出 `IOException` 来使用 `FileInputStream` 和 `FileOutputStream`。程序会停止。但是否有更好的方法来检查文件是否可以打开？`File`\
  \ 类和 `File` 对象可以测试文件是否已分配，以及执行列出目录等其他任务。使用字符串文件名创建文件，然后可以测试 `File` 类提供的不同方法。`File`\
  \ 类提供的方法如表 21.6 所示。\n\n**表 21.6** File 方法\n\n| 方法 | 功能 |\n| --- | --- |\n| boolean\
  \ `isFile()` | 如果是文件，则返回 true |\n| boolean `isDirectory()` | 如果是目录，则返回 true |\n\
  | boolean `canRead()` | 如果文件对象可读，则返回 true |\n| boolean `canWrite()` | 如果文件对象可写，则返回\
  \ true |\n| boolean `exists()` | 如果文件/目录存在，则返回 true |\n| String `getParent()` |\
  \ 返回父目录 |\n| String `getPath()`String `getAbsolutePath()` | 返回路径返回从根目录的绝对路径 |\n\
  | long `length()` | 返回以字节为单位的大小 |\n| boolean `delete()` | 删除文件 |\n| boolean `createNewFile()`\
  \ | 如果文件不存在，则创建一个新文件 |\n| boolean `mkdir()` | 创建目录 |\n| boolean `rename(File filename)`\
  \ | 重命名文件 |\n| String[] `list()` | 返回文件和目录列表 |\n\n**示例 21.4: FileDemo.Java 显示 File\
