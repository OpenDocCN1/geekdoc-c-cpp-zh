  \ A 到 Z、a 到 z、数字 0–9 以及以下特殊字符：\n\n![image](img/130-1.png)\n\n### 标记 (Tokens)\n标记是编译器识别的、无法进一步拆分的原子单词。它可以是单个字符，也可以是一组被\
  \ C++ 编译器识别的字符。\n\n示例：关键字、标识符、字面量、标点符号和运算符。\n\n### 关键字 (Keywords)\n在 C++ 语言中被保留并具有特殊含义。一些重要且常用的关键字包括：\n\
  \n![image](img/130-2.png)\n\n*   **标识符 (Identifiers)：** 标识符是赋予变量、函数名、结构体名等的名称。有效的变量有：`basic_pay`、`hra`、`FindArea()`、`d2000k`、`_std`。无效变量及原因如下：\n\
  \n    *   `2found` 不能以数字开头\n    *   `basic-pay` 非法字符\n    *   `My.pay` 非法字符\n  \
  \  *   `Your Age` 空格\n\n*   **字面量 (Literals)：** 它们称为字面量常量。它们在 C++ 程序运行期间不会改变值。C++\
  \ 允许以下字面量常量：整数常量、浮点数常量、字符常量、字符串字面量、枚举常量和符号常量。\n\n#### a) 整数常量\n它们可以细分为：\n\n**十进制整数常量：**\
  \ `0`、`10`、`-745`、`999`\n\n*   无符号整数可以在末尾添加字母 `U` 来指定。例如，`55556U` 或 `55556u`。\n\
  *   长整数可以在末尾添加字母 `L` 来指定。例如，`789654234L` 或 `7896s`（注：此处原文应为 `7896L`）。\n\n**八进制整数常量：**\n\
  \n*   只允许 0 到 7 之间的数字。所有八进制数必须以数字 `0` 开头以识别为八进制。\n*   允许的八进制常量：`0777`、`001`、`0117`、`07565L`（八进制长型）。\n\
  *   非法的八进制常量有：`089` – 8 是非法的；`777` – 不以 0 开头；`-0675.76` – `.`是非法的。\n\n**十六进制常量：**\n\
  \n*   十六进制数必须以 `0x` 或 `0X` 开头，后跟数字 0 到 9 或字母 a 到 f；允许大写或小写。\n*   允许的十六进制常量有：`0xffff`、`0xa11f`、`0x65000UL`。\n\
  *   非法的十六进制常量有：`0x14.55`，非法字符 `.`。\n\n#### b) 浮点数常量\n它们是基数为 10 的数，可以用指数形式或小数点表示法表示。\n\
  \n有效的浮点数常量有：`-0.01`、`789.89765`、`5E−5`、`1.768E+9`。\n\n无效的浮点数声明有：\n\n*   `6` 无效。必须包含指数或小数点。\n\
  *   `5E+12.5` 无效，因为指数不能是浮点。\n*   `6,789.00` 非法字符 `,`。\n\n#### c) 字符常量\n字符常量可以根据计算机遵循的字符集进行声明。ANSI\
