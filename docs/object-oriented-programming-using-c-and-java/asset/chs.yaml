  \n### 7.8.3 While 循环\n\n当程序员不确定 `while` 块是否会被执行时，会编写 `while` 循环。首先检查条件。如果为真，则执行\
  \ `while` 块。`while` 循环的控制流所示图 7.5。`while` 语句的语法如下：\n\n```\n While (expression)//while\
  \ 体包含单行，不需要大括号 Statement;\n   While(expression)\n   { statement1;\n     statement2;\n\
  \ }\n   while(1) // 表达式始终为真\n   { 语句块;\n   } // 该循环被称为死循环\n```\n\n\n\n\n\n# 示例 7.9:\
