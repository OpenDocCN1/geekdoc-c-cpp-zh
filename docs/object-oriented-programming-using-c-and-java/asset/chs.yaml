  \ stkn = new StringTokenizer( stg, ʺ,ʺ);`\n\n`String Tokenizer` 根据分隔符号逗号将单行字符串拆分为标记（tokens）。我们可以使用\
  \ `nextToken()` 获取标记。`String tkn = stkn.nextToken();`\n\n我们将尝试解决一个问题，读取一名员工的姓名、编号、学分和扣款。计算净工资并显示结果。\n\
