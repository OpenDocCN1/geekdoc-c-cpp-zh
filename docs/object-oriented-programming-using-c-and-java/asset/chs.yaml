  \ IO 错误和异常\n\n基本的 IO 操作可能会抛出异常。所有检查的 IO 异常都由用户使用 `try` 和 `catch` 块处理。如果任何异常没有被处理，则用户必须抛出异常，例如：`public\
  \ static void main(String[] args) throws IOException`。可能的异常列在表 21.5 中。\n\n**表 21.5**\
  \ IO 错误和异常\n\n| 输入 IO | 备注 |\n| --- | --- |\n| EOFException | 文件结束 |\n| FileNotFoundException\
  \ | 未找到文件 |\n| InterruptedIOException | IO 中 |\n| IOException | 通用 IO 异常 |\n\n###\
  \ 21.5 FilterInputStream 和 FilterOutputStream\n\n过滤器流基本上根据需要修改输出。例如，它可以包装 `DataInputStream`\
  \ 或 `BufferedInputStream`。使用过滤器流涉及的步骤如下：\n\n*   为数据源和数据目标创建流。\n\n*   与创建的流附加适当的过滤器流。\n\
  \n*   最后使用过滤流对象读取或写入数据，而不是原始流。\n\n\n\n\n\n```\n1 DataInputStream input = new DataInputStream(System.in);\n\
  \  while( (ch=(char)input.read())!=’.’){\n    Note that DataInputstream has been\
  \ derived from filterInput-stream\n2 FileOutputStream fileout = new FileOutputStream(“DisDos”);\n\
  \   DataOutputStream dosfile= new DataOutputStream(fileout);\n```\n\n## 21.6 使用缓冲输入和输出流\n\
  \nCPU 是快速设备，而与 CPU 相比，内存是慢设备。因此，当我们尝试将字符复制到文件时，需要操作系统来协调从 CPU 到内存的传输。这种方式是缓慢且低效的。相反，如果我们提供一个缓冲区（一个临时内存空间），系统可以将数据写入缓冲区，一旦缓冲区填满，操作系统就会一次性将其写入内存。这就是我们在第\
  \ 20 章中讨论过的生产者-消费者问题。\n\nJava 通过 `BufferedInputStream` 和 `BufferedOutputStream`\
  \ 提供了这一功能，从而提高了 IO 操作的效率。示例 21.4 讨论了使用 `BufferedOutputStream` 写入数据以及使用 `BufferedInputStream`\
  \ 读取数据的方法。图 21.6a 和 21.6b 显示了相关的概念。\n\n![BufferedOutputStream](img/513-1.png)\n\n\
  **图 21.6a** BufferedOutputStream\n\n![BufferedInputStream](img/513-2.png)\n\n**图\
  \ 21.6b** BufferedInputStream\n\n## 21.7 向文件写入基本数据类型：DataInputStream/DataOutputStream\n\
  \nJava 提供了 `FileInputStream`、`FileOutputStream`、`FileReader` 和 `FileWriter` 类来处理字节和字符类型。但如果我们想输入和输出\
  \ `int`、`char`、`float` 等基本原始数据类型，该怎么办呢？`DataInputStream` 和 `DataOutputStreams` 包装了\
  \ `FileInputStream` 和 `FileOutputStream`，允许我们处理基本数据类型。图 21.7 显示了 `DataOutputStream`\
  \ 相关的概念：\n\n![DataOutputStream](img/514-1.png)\n\n**图 21.7** DataOutputStream\n\n\
  **示例 21.3: DisDos.Java 一个使用 Scanner 类显示 DataInputStream 和 DataOutputStream 的程序**\n\
  \n```\n1. package com.oops.chap21;\n   2. import java.util.*;\n   3. import java.io.*;\n\
