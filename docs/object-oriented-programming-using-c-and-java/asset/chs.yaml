  \ Java 程序。\n\n**步骤 0:** 我们必须创建一个存储过程，假设 sutti.sql。进入 SQL 提示符并输入\n\n```\n SQL> select\
  \ * from oopsemp7;\n  IDNO NAME SALARY\n  ------------------------------\n  50595\
  \ Ramesh 20,000\n  50596 Usha 22,000\n```\n\n**步骤 1:** 在 SQL 提示符输入\n\n\n\n\n\n```\n\
  SQL> create or replace procedure sutti( no in int, pay out float) as sal float;\n\
  \    2 begin\n\t3 select salary into sal from oopsemp7 where idno=no;\n\t4 pay:=sal+10000;\n\
  \t5 end;\n\t6 / press enter\n\tProcedure created.\n\tSQL>\n```\n\n或者，你可以在任何地方打开记本，输入程序并将其保存为\
  \ `sutti.sql`。内容如下：\n\n```\ncreate or replace procedure sutti1(no in int, pay out\
  \ float) as sal float;\nbegin\nselect salary into sal from oopsemp5 where idNo=no;\n\
  pay := sal + 10000; // 注意这里使用的是 :=\nend;\n/ // 在 SQL 提示符中粘贴代码后按回车键\n```\n复制文件内容并将其粘贴到\
  \ `SQL>` 提示符行。它将显示为：\n`SQL> create or replace procedure sutti1\n2 (no in int, pay\
  \ out float) as sal float;\n3 begin\n4 select salary into sal from oopsemp5 where\
  \ idNo=no;\n5 pay := sal + 10000;\n6 end;\n7 /`\n按回车键。你将在 SQL 提示符屏幕上看到存储过程创建的消息。你已经准备好了。\n\
  \n### 示例 24.14: StoredDB.java 显示 CallableStatement 用法的程序\n\n```java\npackage com.oops.chap24;\n\
  import java.sql.*;\npublic class StoredDB{\n  public static void main(String args[]){\n\
  try{String userName = “system”;\nString password = “oracle”;\nString url = “jdbc:odbc:oopsempdsn”;\
  \ //数据库名称\nClass.forName (“sun.jdbc.odbc.JdbcOdbcDriver”);\nConnection conn = DriverManager.getConnection\
  \ (url, userName, password);\nSystem.out.println (“Database connection established”);\n\
  //处理 oopsemp5 表\nSystem.out.println“Using a callable statement”);\nCallableStatement\
  \ st2 = conn.prepareCall(“{ call sutti(?,?)}”);\nst2.setInt(1,50596); // 应用第一个 ?\
  \ 标记\n// 将输出参数注册为浮点数据类型\nst2.registerOutParameter(2,Types.FLOAT);\nst2.execute();\n\
  float incrPay = st2.getFloat(2);\n System.out.println (“\\n enhanced pay “ + incrPay);\n\
  conn.close();\n} catch(Exception ex){ex.printStackTrace();}\n} //main\n} // class\n\
  ```\n输出：`Database connection established\nUsing a callable statement\nenhanced pay\
  \ 32000.0`\n\n#### 如何更新数据库记录中的字段？\n\n在上面的示例中，存储过程并没有更新记录；相反，它将更新后的工资返回给调用它的过程。如果我们需要更新数据库，该怎么办？章节末尾的示例\
  \ 4 该程序。\n\n### 24.15 Servlets（Servlet）\n\n我们知道小程序（applets）是动态的，它们嵌入在网络浏览器中，并跨互联网扩展网络浏览器的功能。Servlet\
  \ 与小程序一样，是较小的服务器端程序，驻留在 Web 服务器上，并跨互联网扩展 Web 服务器的功能。因此被称为 `Servlets`。例如，考虑一个服务器为其多国、多地的分支机构托管一个集中库存控制系统的应用程序。该公司通过网页向所有分支机构实时提供库存信息。信息必须反映数据库中库存的最新位置。Servlet\
  \ 提供了扩展 Web 服务器到客户端的最优手段，此外提供了诸如平台独立性、与小程序、数据库和套接字交互等优势。\n\n#### 运行 Servlet 需要什么环境？\n\
  \n要托管 Servlet，你需要一个服务器。工业界广泛使用的最佳服务器是 `Tomcat Apache Server`。可以从 `Jakarta.apache.org`\
  \ 下载该软件，并可以下载到：`C:\\Program Files\\ Apache Soft Foundation\\Tomcat 5.0\\.`。要启动服务器，进入\
  \ `bin` 目录并点击 `C:\\Program Files\\Apache Software Foundation\\Tomcat 6.0\\bin>tomcat6.exe`。你还可以通过\
  \ `start![image](img/arrow.png)programs![image](img/arrow.png)Tomcat6.0-![image](img/arrow.png)\
  \ tomcat6` 启动 Tomcat 服务器，或者通过运行 `start![image](img/arrow.png)run![image](img/arrow.png)\
  \ config` 命令并选择 `tomcat6`，从而在每次启动系统时永久设置 Tomcat 服务器运行。\n\n**Servlet 库-servlet-api.jar：**\
  \ 注意 Servlet 并不是纯 Java 的。因此，你需要将 `servlet-api.jar`（位于 `c:\\Program Files\\Apache\
  \ Software Foundation\\Tomcat 6.0\\common\\lib\\` 文件）作为类路径的一部分包含。操作步骤是：`start![image](img/arrow.png)settings![image](img/arrow.png)controlpanel![image](img/arrow.png)system![image](img/arrow.png)advanced![image](img/arrow.png)\
