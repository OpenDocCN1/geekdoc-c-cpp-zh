  \n# 8\n\n## 函数、存储类、预处理器指令、以及数组和字符串\n\n### 学习目标\n\n*在本章结束时，你应该能够：*\n\n* 理解函数和函数模板，以及\
  \ C++ 如何处理函数执行。\n* 理解 C++ 采用的内存映射和存储类。\n* 借助宏和预处理器指令编写 C++ 程序。\n* 理解相关概念并使用数组和字符串数据结构。\n\
  \n## 8.1 引言\n\n众所周知，致力于某项工作的专家会把工作执行得更好、更快。我们向建筑师寻求帮助以建造兼具功能性和美感的房屋。同样地，我们将控制权交给医生来照顾我们的健康。在\
  \ C++ 语言中，我们将任务交给专门为该目的而编写的函数。同样，如果我们可以根据用户的需求让一个函数执行多个任务，那么这样的程序不仅高效，而且是多用途的。我们可以使用函数模板，使得单个函数可以处理所有类型的数据。\n\
  \n本章还向你介绍了 C++ 处理存储和内存的方法。变量根据我们在声明变量时使用的存储说明符进行存储的。这些被称为存储类。存储反过来决定了访问时间。预处理器指令是向编译器发出的、用于高效执行程序的指令。本章向读者介绍了这些指令涉及的概念。数组和字符串是派生数据类型，也是\
  \ C++ 最广泛使用的特性。示例和练习题中包含了若干问题，以加强相关概念。从现在起，只有当我们有新内容要告诉你时才会打印行号。\n\n### 8.2 为什么要使用函数模板？\n\
  \n其思想是将主问题分成更小的模块，并编写函数来实现这些模块。C++ 语言中的主函数称为：`main()`。有趣的是，它也是一个函数，尽管是一个主函数。`Main()`\
  \ 函数调用其他函数。调用函数是指调用被调用函数的函数。函数原型在全局区域声明，即 `void main()`，这样所有其他函数都可以访问它。\n\n语法为：\n\
  ```\nfunction_name <type>(parameters);\n```\n\n例如，我们可以为寻找两个数字的较大值声明一个函数模板：\n```cpp\n\
  template <class T>\nT FindMax (T a);\n```\n\n在声明或定义时，我们不知道 `T` 的数据类型，我们可以将其作为数据类型\
  \ `T` 使用。我们如下所示调用函数：\n```cpp\nFindMax <int>(x,y);\n```\n\n**示例 8.1 计算两个数字最大值的模板\
  \ cpp。函数模板：FindMax.cpp**\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
  // 函数定义\ntemplate <class T>\nT FindMax (T a, T b);\nvoid main ()\n{\n  int i=50,\
  \ j=70, k;\n  long int x=75000, y=98000, z;\n  k=FindMax<int>(i,j);\n  z=FindMax<long\
  \ int>(x,y);\n  cout << \"\\n 两个整数中较大的值：\" << i << \" & \" << j << \" : \" << k\
  \ << endl;\n  cout << \"\\n 两个长整数中较大的值：\" << x << \" & \" << y << \" : \" << z <<\
  \ endl;\n}\n// 函数定义\ntemplate <class T>\nT FindMax (T a, T b)\n{\n  T max;\n  max\
  \ = (a>b)? a : b;\n  return (max);\n}\n```\n*输出：\n两个整数中较大的值：50 & 70 : 70\n两个长整数中较大的值：75000\
  \ & 98000 : 98000*\n\n函数模板可以接受两个不同类型的参数，并返回任意一个参数的返回值。考虑以下声明：\n\n```cpp\nlong int\
  \ a ; int b;\ntemplate< class S , class T>\nT FindMax( S a , T b) { return ( ( a>b)?a:b\
  \ );}\n```\n编译器将进行必要的类型转换并返回 `T` 的数据类型。\n\n## 8.3 值传递\n\n\n\n\n\n调用函数与被调用函数之间的数据传输模式，通过将列为参数的变量复制到被调用函数的栈区域，随后由被调用函数将结果复制到主函数的栈区域并返回给调用函数，这种方式被称为`值传递`（Call\
  \ by value）。注意，由于正向传输和返回操作都涉及变量的复制，只有当要传输的值较少且属于基本数据类型时，它才是高效的。\n\n**示例 8.2：`swap.cpp`。演示目前讨论的函数概念并引出值传递的程序**\n\
  \n```cpp\n #include<iostream>\nusing namespace std;\n// function prototype declarations\n\
  template<class T>\nvoid Swap ( T x , T y); // 用于交换值\nvoid main() //Calling Function\n\
  \  { float x=100.00; // x & y are local to main()\n  float y=1000.00;\n  int a=5\
  \ , b=10;\n  cout<<”\\n Before calling Swap function <x and y >”<< x<<”\\t”<<y<<endl;\n\
  \  cout<<”\\n Before calling Swap function <a and b >”<< a<<”\\t”<<b<<endl;\n  //\
  \ call the function and pass arguments x & y\n  Swap(x,y); //Called Function\n \
  \ Swap(a,b); //Called Function\n  cout<<”\\n After return from Swap <x and y >”<<x<<”\\\
  t”<<y<<endl;\n  cout<<”\\n After return Swap function <a and b >”<< a<<”\\t”<<b<<endl;\n\
  \  }//end of main\n// function definition\ntemplate<class T>\nvoid Swap ( T x ,\
  \ T y)\n  { float temp ; // temp is local to Swap function\n  temp = x; // store\
  \ x in temp\n  x=y; // store y in x\n  y=temp; // store temp in y\n  cout<<”\\n\
  \ Inside Swap <x and y >”<<x<<”\\t”<<y<<endl;\n  } // end of Swap//\n //output :Before\
  \ calling Swap function <x and y >100 1000\n  Before calling Swap function <a and\
  \ b >5 10\n  Inside Swap <x and y >1000 100\n  Inside Swap <x and y >10 5\n  After\
  \ return from Swap <x and y >100 1000\n  After return Swap function <a and b >5\
  \ 10*/\n```\n\n这里有两个重要的教训可以学习。首先，注意到`Swap` 函数的`函数模板`处理了两组数据，即`float` 类型的 `x` 和 `y`，以及`integer`\
  \ 类型的 `a` 和 `b`。这就是函数模板的威力和用处。其次，观察输出。虽然函数 `Swap`已经完成了交换 `x` 和 `y` 值的任务（如主程序中 `Swap`\
  \ 内部的 `cout` 语句所示），但值并没有发生交换。这意味着什么？答案在于，变量的值以及你对它们进行的操作是局部的，即局限于块 `Swap` 函数。它与属于\
  \ `main()` 函数的变量 `x` 和 `y` 没有任何关系。\n\n事实上，`main()` 函数是通过将这些值复制到 `Swap` 函数的栈区域来传递参数的。这就像传递了一份复印件而保留了原件。显然，你在复印件上做的更改不会反映在原件上。\n\
  \n## 8.4 引用传递\n\n对于占用大量内存空间的大数据项（如数组、结构体和联合体），内存和访问时间的开销会非常高。因此，我们不再像值传递那样传递值；而是将地址传递给函数。注意，一旦函数通过引用接收到数据项，它对该数据项进行操作，对数据项进行的更改也会反映在调用函数中。这就像传递原始文档的地址而不是复印件。因此，对原始文档进行的更改也适用于文档的所有者。让我们看看当我们通过引用传递变量（即通过传递变量地址）时，我们的\
  \ `Swap` 程序是如何运行的，正如我们让函数中的更改也能反映在调用函数中。\n\n**示例 8.3：`RefSwap.cpp` 演示引用传递变量的概念**\n\
  \n```cpp\n #include<iostream>\nusing namespace std;\n// function prototype declarations\n\
  template<class T>\nvoid Swap ( T & x , T & y); // 通过引用交换值\nvoid main() //Calling\
  \ Function\n  { float x=100.00; // x & y are local to main()\n  float y=1000.00;\n\
  \  int a=5 , b=10;\n  cout<<”\\n Before calling Swap function <x and y >”<< x<<”\\\
  t”<<y<<endl;\n  cout<<”\\n Before calling Swap function <a and b >”<< a<<”\\t”<<b<<endl;\n\
  \  // call the function and pass arguments x & y\n  Swap(x,y); //Called Function\n\
  \  Swap(a,b); //Called Function\n  cout<<”\\n After return from Swap <x and y >”<<x<<”\\\
  t”<<y<<endl;\n  cout<<”\\n After return Swap function <a and b >”<< a<<”\\t”<<b<<endl;\n\
  \  }//end of main\n// function definition\ntemplate<class T>\nvoid Swap ( T & x\
  \ , T & y)\n  { float temp ; // temp is local to Swap function\n  temp = x; // store\
  \ x in temp\n  x=y; // store y in x\n  y=temp; // store temp in y\n  cout<<”\\n\
  \ Inside Swap <x and y >”<<x<<”\\t”<<y<<endl;\n  } // end of Swap//\n //output :Before\
  \ calling Swap function <x and y >100 1000\n  Before calling Swap function <a and\
  \ b >5 10\n  Inside Swap <x and y >1000 100\n  Inside Swap <x and y >10 5\n  After\
  \ return from Swap <x and y >100 1000\n  After return Swap function <a and b >5\
  \ 10*/\n```\n\n由于数组是包含多个类型的数据结构，编译器将其作为引用传递。注意我们调用了 `Sort(n,a)`；'a' 代表数组的名字。名字意味着数组的地址。实际上，我们将数组的地址给了\
  \ `Sort` 函数。我们用于整数排序的算法虽然简单，但并不高效。我们将通过指针的使用学习更多关于引用传递的知识。\n\n## 8.5 常量引用传递\n\n\
  当你通过引用传递变量时，由于其体积很大，存在接收函数可能会更改值的风险。如果你想防止函数更改值，则有通过常量引用传递的选项。\n\n**示例 8.5：`callbyconstref.cpp`：向函数传递常量引用**\n\
  \n\n\n\n\n```cpp\n#include<iostream>\nusing namespace std;\n// 函数原型声明\nvoid PrintNetPay(const\
  \ float & BP , float & cr , float db); \nvoid main()\n{ \n  float bp=2000.00, cr\
  \ = 0.60*bp, db = .25*bp;\n  // 我们正通过值传递、引用传递和常量引用传递变量\n  PrintNetPay(bp,cr,db);\n\
  }\n// main 函数结束\n// 函数定义\nvoid PrintNetPay(const float &bp, float & cr , float db)\n\
  { \n  float total = bp+cr-db;\n  //bp+=1000.00; // 错误。左值指定的是一个常量对象。常量引用。\n  // 因此无法修改。所以被注释掉了\n\
  \  cout<<”\\n Total Net Pay = “<< total<<endl;\n}\n// 输出：Total Net Pay = 2700 */\n\
  ```\n\n## 8.6 递归\n\n递归是 C++ 语言支持的一种高级特性。递归意味着函数调用自身。考虑寻找一个数字的阶乘问题。在示例中，我们可以清楚地看到\
  \ `Fact(5)` 调用 `Fact(4)`，依此类推。\n\n```\nFact(5) = 5 x 4 x 3 x 2 x 1\n        = 5\
  \ x Fact(4)\n        = 5 x 4 x Fact(3)\n        = 5 x 4 x 3x Fact(2)\n        =\
  \ 5 x 4 x 3x 2 x Fact(1)\n        = 5 x 4 x 3x 2 x 1 x Fact(0)\n        = 5 x 4\
  \ x 3x 2 x 1 ( Fact(0) =1)\n```\n\n**示例 8.6: factrecur.cpp 一个使用递归寻找数字阶乘的程序**\n\n\
  ```cpp\n#include<iostream>\nusing namespace std;\n// 函数原型\nint fact(int a);\nvoid\
  \ main()\n{ \n  int x,ans;\n  cout<<»输入一个数字:»;\n  cin>>x; // 从用户处输入*/\n  ans=fact(x);\
  \ //函数调用*/\n  cout<<»\\n 阶乘=»<<ans<<endl;\n} // main 函数结束*/\nint fact(int a) //函数定义*/\n\
  {     \n  int ans;\n  if(a<=0)\n   return(1); // 根据定义 fact(0) = 1\n  else\n   ans\
  \ =a*fact(a-1); // 递归函数调用*/\n  return(ans); // 将 fact 的值返回给 main*/\n} // fact 函数结束*/\n\
  // 输出：输入一个数字:7 阶乘=5040*/\n```\n\n## 8.7 内联函数\n\n每次调用函数都会产生一些开销，例如保存当前地址、跳转到函数代码区域、传递参数以及在函数执行完毕后返回主函数。对于大型函数，这种过程是合理的，但对于主体只有一或两行代码的函数，这种冗长且消耗资源的过程就是不合理的。因此，C++\
  \ 提供了内联函数。\n\n```cpp\ntemplate<class T>\ninline void FindMax( T & a , T & b ){ return\
  \ ( (a > b) ? a : b ) ; }\n```\n\n当编译器看到 `inline` 关键字时，它会放置 `FindMax` 的整个代码，而不是采用通常的函数处理技术，从而节省与\
  \ C++ 处理函数方式相关的开销。注意：对大型函数使用内联函数可能会适得其反，因为整个函数会在每次调用函数时被重新生成。因此，请对代码较短的一或两行函数使用内联函数。在类定义内部声明并定义的函数自动是内联函数，尽管你可能没有使用\
  \ `inline` 关键字。\n\n## 8.8 函数重载\n\n当单个函数可以执行多项任务时，编译器的开销也随之减少。例如，如果想计算圆的面积、足球的表面积以及圆柱的表面积。需要写多少函数？通常需要三个函数。但在\
  \ C++ 中，只需一个重载函数来执行所有三个任务就足够了。重载函数根据用户提供的参数决定将哪个版本的代码加载到主内存中。为什么重载很重要？函数必须被编译并加载到主内存中。如果函数没有被重载，则所有函数必须在编译时被加载和链接。用户可能使用或不使用所有加载的函数，从而浪费主内存，并导致无法解决需要更多主内存的复杂问题。\n\
  \n```cpp\n// 单参数计算圆面积\ntemplate<class T>\ninline void FindArea( T & r ){ return\
  \ ( 2*3.14158*r*r ) ; }\n// 两个参数计算圆柱表面积\ntemplate<class T>\ninline void FindArea(\
  \ T & r , T &h ){ return ( 4*3.14158*r*h ) ;\n}\n```\n\n## 8.9 默认参数\n\n函数接受参数并执行任务。但如果你不提供参数值会发生什么？C++\
  \ 提供了一项规定来指定默认选项。如果你提供了参数，函数将采用它们；如果你没有提供参数值，函数将采用默认选项。你可以为所有参数或仅为部分参数指定默认选项，但指定默认选项必须从左到右。为右侧边界参数指定默认值是非法的（编译器错误）。\n\
  \n```cpp\nfloat FindVolume( float r, float w, float h = 10.0 ); // 默认参数示例\n```\n\
  \n下表提供了 C++ 内存管理的详细信息。清晰理解这一概念非常重要。\n\n内存大致可以分为数据区域或代码区域，也称为数据段和代码段。根据变量访问时间、作用域和生命周期的要求，内存分为全局、堆、代码区域、栈和静态区域，如表\
  \ 8.1 所示。\n\n\n\n\n\n| `Global:` | 包含部分、函数声明、结构体和全局变量 | 所有声明和定义对所有函数均可见。 |\n| `Heap\
  \ Memory:` | 对堆内存的访问仅通过指针，即通过 `New` 和 `delete` 函数 | 为全局、代码和栈/静态变量分配空间后剩余的内存 |\n\
  | `Code Area:` | C++ 代码、函数等存储在此区域 | 所有函数的代码都存储在此处 |\n| `Stack Variables:` | 你声明的所有变量都存储在栈（Stack）上。也称为栈变量\
  \ | 变量的生命周期持续到其所在函数的生命结束，称为局部变量 |\n| `Static Variables:` | 静态变量的生命周期持续到 `main()`\
  \ 结束。对所有函数可见 |\n\n### `全局变量 (Global Variables)`\n这些变量是一些声明，例如包含部分、定义语句、函数原型声明以及结构体和联合体的声明，它们的作用范围延伸到所有函数。这意味着在全局部分声明的任何变量都可以被所有函数访问。该部分出现在\
  \ `main()` 函数之前。\n\n### `代码区 (Code Area)`\n所有函数及其代码都存储在这里。\n\n### `栈区 (Stack Area)`\n\
  在函数中声明的所有变量都会在内存的栈区自动分配空间。变量的作用范围是局部的。这意味着在函数中声明的变量在函数内部可访问。此外，函数内部声明的变量的生命周期与函数本身的生命周期相同，即函数的大括号范围内。因此，这些变量被称为局部变量或自动变量（autovariables）。参考表\
  \ 8.2 中的示例来了解局部或自动变量。\n\n**表 8.2 存储类及其位置、作用范围和生命周期**\n\n![image](img/160-1a.png)\n\
  \n### `静态变量 (Static Variables)`\n在某些情况下，你需要让所有函数都能访问在函数内部声明的变量；我们将此类变量声明为 `static`。例如：\n\
  \n![image](img/170-2.png)\n\n声明为 `static` 的变量存储在连续的内存位置中。语法见图 8.1。静态区唯一的特殊之处是，即使函数终止，该静态区域中的变量也不会被擦除。例如，我们声明\
  \ `times` 为 `static int`，以跟踪 `main()` 函数调用 `FindArea` 的次数。我们还初始化了 `times = 0`。当第一次调用函数时，它会递增。下一次调用\
  \ `FindArea()` 时，它会加 1 到 2。\n\n```\n![静态变量的语法](img/170-1.png)\n```\n**图 8.1 静态变量的语法**\n\
  \n### `堆内存或空空间 (Heap Memory or Free Space)`\n在为上述所有存储类分配了强制空间后，剩余的内存被称为堆内存或空空间。这是程序员根据运行时内存需求而提供的动态内存。但对该空间的访问只能通过指针实现。\n\
  \n#### 8.10.1 存储类的类型\n\nC 语言支持的存储类如表 8.2 所示。\n\n请注意，虽然静态全局和外部（external）声明范围可以到达所有函数，但存在一个至关重要的区别。静态全局声明和定义仅通过单个\
  \ `main()` 函数可用，而使用 `extern` 的声明和定义即使对于使用不同文件名单独编写的程序，只要它们被编译并链接到 `main()` 程序中即可。一个示例将使这些概念变得清晰：\n\
  \n**示例 8.8: stackstatic.cpp 一个演示静态变量和栈(自动)变量用法的程序**\n\n```cpp\n#include<iostream>\n\
  Using namespace std;\n#include<conio.h>\nfloat FindArea ( float x , float y); //\
  \ 函数原型声明\nvoid main()\n { int i;\n float x=200, y=100, area=0,ans;\n for (i=0;i<10;i++)\
  \ // 调用函数 FindArea 10 次\n { ans = FindArea(x++,y++);cout<<”\\n area = “ << ans;}\n\
  \ cout<<»\\n main 函数中变量 ans 的地址 : “<<ans;\n}// end of main\n// 函数定义\nfloat FindArea(float\
  \ x, float y)\n{ static int times=0; // 静态变量，用于跟踪\n                  // 函数被调用的次数。\n\
  \  float ans;\n  ans=x*y;\n  times++;\n  cout<<”\\n 调用 findArea 函数的次数 = “<<times;\n\
  \  if (times ==10)\n  cout<<»\\n FindArea 函数中变量 ans 的地址 : <<<<ans;\n  return ans;\n\
  }// end of FindArea\n/*Output : 调用 findArea 函数的次数 = 1\n area =20000.00\n 调用 findArea\
  \ 函数的次数 = 2\n area =20301.00\n 调用 findArea 函数的次数 = 3\n area =20604.00\n 调用 findArea\
  \ 函数的次数 = 4\n area =20909.00\n 调用 findArea 函数的次数 = 5\n area =21216.00\n 调用 findArea\
  \ 函数的次数 = 6\n area =21525.00\n 调用 findArea 函数的次数 = 7\n area =21836.00\n 调用 findArea\
  \ 函数的次数 = 8\n area =22149.00\n 调用 findArea 函数的次数 = 9\n area =22464.00\n 调用 findArea\
  \ 函数的次数 = 10\n FindArea 函数中变量 ans 的地址 : 12ff04\n area =22781.00\n main 函数中变量 ans\
  \ 的地址 : 12ff6c*/\n```\n\n**示例 8.9: reg.cpp 一个演示寄存器存储类用法及 栈(自动)变量用法的程序**\n\n请注意，CPU\
  \ 寄存器位于处理器芯片上；具体数量取决于处理器的硬件，并被视为主内存，因此具有最快的访问速度。然而，由于内存有限，必须节约使用。例如，CPU 最常用的变量可以声明为寄存器变量，从而节省访问时间。在下面的示例中，我们将使用寄存器内存来存储控制循环的计数器、数字的平方和平方根。\n\
  \n```cpp\n#include<iostrem>\nusing namespace std;\nvoid main()\n{register counter,square,sqroot;\n\
  for(counter=1;counter <=10; counter ++) square=counter*counter;\n  cout<<”\\nnumber\
  \ :”<<counter<< “ square : “<<endl;\n}\n/*Output:number : 1 : square : 1\nnumber\
  \ : 2 : square : 4\nnumber : 3 : square : 9\nnumber : 4 : square : 16\nnumber :\
  \ 5 : square : 25\nnumber : 6 : square : 36\nnumber : 7 : square : 49\nnumber :\
  \ 8 : square : 64\nnumber : 9 : square : 81\nnumber : 10 : square : 100*/\n```\n\
  \n**示例 8.10: extern.cpp 一个演示外部变量用法及栈(自动)变量用法的程序**\n\n```cpp\n在 main() 函数之外定义的变量属于外部存储类。\n\
  #include<iostream>\nusing namespace std;\n#include<conio.h>\n// 外部函数\nvoid FindArea();\n\
  float x=10;float y=10;float area;\nvoid main()\n { extern float area; extern float\
  \ x; extern float y;\n   area=0;\n   cout<<”\\n 调用 FindArea 之前的 area : “<<area<<endl;\n\
  \   FindArea ();\n   cout<<”\\n 调用 FindArea 之后的 area : “<<area<<endl;\n   getch();\n\
  }// end of main\nvoid FindArea()// 函数定义\n {extern float x; extern float y;extern\
  \ float area;\n  area = x*y;\n  cout<<”\\n FindArea 内部的 area : “<<area<<endl;}\n\
  /*Output:调用 FindArea 之前的 area 0.000000\n FindArea 内部的 area 100.000000\n调用 FindArea\
  \ 之后的 area 100.000000*/\n```\n\n注意，尽管 FindArea 没有返回 area 值，但主程序显示了正确的 area 值。因此，可以使用外部声明来避免在函数之间传递变量。我们还可以使用\
  \ extern 声明和定义来链接两个不同文件中声明的变量。我们将通过下一个示例来演示这一概念：\n\n**示例 8.11: externfile.cpp 一个演示外部程序用法及栈(自动)变量用法的程序**\n\
  \n外部文件存储在另一个文件中。在当前目录下编写 `void FindArea()` 的 C++ 代码并将其保存为 `findarea.h`。\n\n\n\n\n\
  \n```cpp\n#include<stdio.h>\nvoid FindArea()\n { extern float x; extern float y;extern\
  \ float area;\n   area = x*y;\n   cout<<“\\n area inside FindArea :”<<area;\n}\n\
  ```\n\n为 `void main()` 编写 C++ 代码，并如下所示包含其他包含语句：\n\n```cpp\n#include<iostream>\n\
  using namespace std;\n#include<conio.h>\n#include”findarea.h” // findarea.h 存储在当前工作目录\n\
  void FindArea(); // 外部函数\nfloat x=10;float y=10;float area;\nvoid main()\n { extern\
  \ float area; extern float x; extern float y;\n   area=0;\n cout<<”\\n area before\
  \ calling FindArea : “<<area<<endl;\n   FindArea ();\n cout<<”\\n area after calling\
  \ FindArea : “<<area<<endl;\n   getch();\n}// end of main\n```\n\n注意，如果你将 `findarea.h`\
  \ 复制到目录 `c:\\tc\\include\\`，则可以使用 `#include<findarea.h>`。\n\n输出：area before calling\
  \ FindArea 0.000000\narea inside FindArea 100.000000\narea after return from FindArea\
  \ 100.000000\n\n### 8.11 头文件与标准库\n\nC++ 语言不包含任何内置函数。但它包含了由 C++ 供应商提供的标准库。存储在这些库文件中的（也称为头文件）包含了所有有函数、它们的定义、数据类型的\
  \ `declaration` 以及常量。我们已经使用了其中几个，如 `iostream` 和 `conio.h`。这里提供了其中几个：\n\n- `iostream.h`：包含用于\
  \ c++ 的基础流 IO 文件。\n- `stdio.h`：方便输入输出语句。\n- `iomanip.h`：包含 IO 操纵符。\n- `conio.h`：包含用于调用\
  \ IO 例程的函数。\n- `math.h`：包含库函数。注意 `x` 可以是 `float` 或 `double`。C 语言不支持类型为 `x ^a` 的表达式。我们需要使用\
  \ `pow(x,a)`。\n    - `sqrt(x)`：确定 `x` 的平方根。\n    - `pow(,x,a)`：计算 `x^a`。\n    -\
  \ `exp(x)`：计算 `e^x`。\n    - `sin(x)` 和 `cos(x)`：计算正弦和余弦。\n    - `log(x)`：计算自然对数。\n\
  \    - `log10(x)`：计算以 10 为底的对数。\n- `stdlib.h`：包含标准库，如搜索和排序例程等。\n    - `abs(x)`：计算整数\
  \ `x` 的绝对值。\n    - `atof(s)`：将字符串 `s` 转换为 `double`。\n    - `atoi(s)`：转换为整数。\n  \
  \  - `malloc()`：分配内存并返回指针。\n    - `calloc()`：与 `malloc()`相同，但将内存初始化为 0。\n    - `free(x)`：释放\
  \ `x` 指向的堆内存。\n    - `rand()`：生成随机数。\n- `string.h`：包含与字符串相关的函数，例如：\n    - `strlen()`：字符数组的长度。\n\
  \    - `strcpy()`：将字符串拷贝到另一个。\n    - `strcat()`：连接两个字符串。\n    - `strcmp()`：比较两个字符串。\n\
  \    - `strlwr()`：从大写转为小写。\n    - `strupr()`：从小写转为大写。\n    - `strrev()`：反转字符串。\n\
  \n### 8.12 C++ 预处理器\n\n预处理器在将源代码提交给 C 编译器之前执行一些清理工作。它执行的任务包括：\n\n1. **包含**（Inclusion）所有的包含部分文件。例如，它会从\
  \ `tc\\include` 目录获取并追加 `stdio.h` 并将其包含在源文件中。\n2. **宏展开**。实际上，预处理器会对 `Macro` 语句给出的声明执行替换。例如，在语句\
  \ `#define PI 3.14159` 中，预处理器搜索符号 `PI` 的出现处并将其替换为 `3.141519`。\n3. **条件包含**。为了防止包含第二次或多次，我们可以采用条件包含。\n\
  4. **字符串替换**。\n\nC++ 语言中可用的指令有：\n\n```\n#include  包含来自指定文件的文本\n#define 定义一个宏\n#undef\
  \ 取消定义一个宏\n#if test  如果条件在编译时成立\n#endif    if 的结束（条件预处理器）\n#elif     用于编译时用于多条路径的\
  \ if–else–if\n#line     提供行号\n```\n\n#### 8.12.1 宏展开\n\n**示例 8.12：macro1.cpp 一个显示宏展开的程序。一个显示函数重载的程序**\n\
  \n```cpp\n#include<iostream>\n#include<conio.h>\nusing namespace std;\n#define GETDATA\
  \ cout << “Enter the value: “ <<endl\nvoid main()\n{int x , y;\nGETDATA;\ncin >>\
  \ x ;\nGETDATA;\ncin >> y;\ncout << endl << <<values entered are « <<x << « « <<\
  \ y;\ngetch();\n}\n// 输出: Enter the value: 35\nEnter the value: 45\nvalues entered\
  \ are 35 45*/\n```\n\n预处理器指令如 `#define GETDATA cout << “Enter the value: “ <<endl`。\n\
  \n#### 8.12.2 宏定义\n\n带参数的宏的通用语法是 `#define macro-name(arg1,arg2,...)`。**示例 8.13：macro2.cpp\
  \ 一个演示预处理器指令的程序。显示函数重载的程序**\n\n```cpp\n#include<iostream>\n#include<conio.h>\nusing\
  \ namespace std;\n#define GETDATA cout << “Enter the value: “ <<endl\n#define WRITEDATA(ans)\
  \ << ans\n#define SUM(a,b) ((a)+(b))\n#define PRODUCT(a,b) ((a)*(b))\n#define MIN(a,b)\
  \ ((a)<(b))?(a):(b))\n#define UPPER 5000\n#define BONUS1 1000\n#define BONUS2 500\n\
  \n { extern float area; extern float x; extern float y;\n   area=0;\n cout<<”\\\
  n area before calling FindArea : “<<area<<endl;\n   FindArea ();\n cout<<”\\n area\
  \ after calling FindArea : “<<area<<endl;\n   getch();\n}// end of main\n```\n\n\
  #### 8.12.3 文件包含\n\n注意，如果你将 `findarea.h` 复制到目录 `c:\\tc\\include\\`，则可以使用 `#include<findarea.h>`。\n\
  \n#### 8.12.4 条件包含\n\n源代码的某些部分是使用条件宏来包含的。语法如下：\n\n```\n #if 表达式\n      语句序列\n  \
  \  #else\n      语句序列\n    #endif\n```\n\n#### 8.12.5 条件编译 #ifdef 和 #ifndef 语句\n\n\
  为了防止多次包含宏导致多次声明，我们可以使用条件宏 `#ifdef` 和 `#ifndef` 来指示已定义或未定义。通用语法是：\n\n```\n#ifdef\
  \ macronname       #ifndef\n   语句   or     语句\n#endif                 #endif\n```\n\
  \n#### 8.12.6 #undef\n\n宏在重新定义之前必须取消定义。考虑宏定义。在本模块中，我们还将使用像 `#ifdef` 的条件包含。\n\n**示例\
  \ 8.15：undef.cpp 一个显示取消定义用用的程序**\n\n```cpp\n#include<iostream>\n#include<conio.h>\n\
  using namespace std;\n#define UPPER 100\n#define LOWER 10\n#define WRITEDATA cout\
  \ << “answer = “ << ans << endl ;\nvoid main()\n{ int temp= 70,ans=10;\n  if (temp<UPPER\
  \ && temp>LOWER)\n  WRITEDATA;\n  #ifdef UPPER\n  #undef UPPER\n  #endif\n  #ifdef\
  \ LOWER\n  #undef LOWER\n  #endif\n  // 现在我们可以为 UPPER 和 LOWER 设置新限制\n  #define UPPER\
  \ 60\n  #define LOWER 50\n  if (temp<UPPER && temp > LOWER)\n  WRITEDATA;\n  getch();\n\
  }// end of main\n//输出：Answer=10（从第一个 if 语句打印，第二个 WRITEDATA 未执行，因为第二个 if 循环返回假值。）*/\n\
  ```\n\n#### 8.12.7 #error 宏\n\n\n\n\n\n# `error` 宏用法用法所示。当遇到 `#error` 宏时，编译器会显示错误信息。注意，错误信息不是在双引号内的。\n\
  \n```\n#ifdef UPPER\n   #include<upper.h>\n#elifdef // 此宏类似于 if–else–if\n   #include<lower.h>\n\
  #else\n   #error Incorrect inclusion of Header files\n#endif\n```\n\n## 8.13 数组\n\
  \n在日常生活中，我们有几种情况需要在连续的内存中存储相同类型的数据，例如学生在六门不同科目获得的分数显示在一个名为 `***marks in Figure 8.2***`\
  \ 的数组中。数组元素通过数组名后加下标来引用。我们展示了一个名为 `marks` 的数组；学生得到的六门科目分数可以用 `marks[0]=80.0`、`marks[5]=70.0`\
