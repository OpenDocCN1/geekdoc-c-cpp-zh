  1. d\n2. c\n3. d\n4. a\n5. d\n6. c\n7. a\n8. b\n9. c\n10. c\n\n## 3 继承：扩展性与复用性\n\
  \n### 学习目标\n在本章结束时，你应该理解关于面向对象范式的以下概念：\n* 从现有类扩展和派生类。\n* 继承中的包含。\n* 单继承和多继承。\n*\
  \ 虚函数。\n* Java 语言提供的接口。\n* 运行时多态和数据绑定。\n* OOP 概念如 RTT 和 STL。\n\n### 3.1 面向对象范式的扩展性与复用性\n\
  类之间的关系使得面向对象语言变得灵活且强大。确保复用的工具包括：组合/包含、泛化/特化、虚函数、抽象数据类型（ADT）、标准模板库（STL）。\n\n### 3.2\
  \ 扩展/派生新类\n通过继承和包含从现有类派生新类。另一方面，继承是通过添加许多特殊功能创建一个新类。\n\n#### 3.2.1 包含：类中的类\n容器——容器类\n\
  容器类是面向对象语言实现复用的技术之一。容器类意味着一个类包含另一个类。例如，计算机有一个处理器。换句话说，它被称为组合或聚合。\n\n在组合中，一个类（我们假设为\
  \ Host）存储另一个类（我们称之为 Guest）的实例。Host 类通过调用该实例的方法来委托工作。\n\n例如，Student 类可以有一个属于 string\
  \ 类的成员变量。那么我们就说 string 类包含在 Student 类中。包含的优势是，可以在 Student 类内部使用 string 类来存储属于 string\
  \ 类的姓名和地址。同样，如果我们定义一个带有日、月、年信息的 `Date` 类，我们可以在 Student 类中定义 `Date` 对象，并定义日期相关数据，如出生日期、入职日期等。组合是一种“拥有”的关系。\n\
  \n**示例 3.1：C++ 的组合/包含**\n\n```cpp\nclass BankAccount { … };\nclass SavingAccount\n\
  {private: BankAccount Account;\n};\n```\n\n\n\n\n代码的可重用性是 `C++` 和 `Java` 等面向对象语言所提供的强大承诺之一，而继承是实现这一承诺的选工具。继承的概念对我们来说并不陌生。我们从父母那里继承属性、良好的品格和名字。同样，我们的后代也将从我们这里获得这些特质。研究图\
  \ 3.2 所示的继承层次结构。人类和动物从生物身上获得特质。专业人士、学生和运动员派生自人类。我们说这三个类别继承自人类。`Human` 类被称为基类，`Student`\
  \ 和 `Athlete` 被称为派生类或子类。在 `Java` 语言中，基类被称为超类。什么可以被继承？成员函数和成员数据都可以被继承。注意，根据建模语言规范，表示继承关系的箭头方向指向上方。\n\
  \n![Inheritance hierarchy](img/43-1.png)\n\n**图 3.2** 继承层次结构\n\n继承指定了“是（is）”类型的关系。观察发现学生是一个人类。同样，哺乳动物是一种动物。`Human`\
  \ 是基类/超类，`Student` 是派生类/子类。从基类派生是实现“是”类型关系的技术。基类可以有多个派生类。\n\n我们何时使用继承？你继承是为了能够从基类中派生所有的功能和成员数据，而派生类可以添加其自己的特有的或个性的功能。因此，我们可以说子类是其基类或超类的更专门的版本。它们可以派生超类的所有功能，并引入自己的特有行为。\n\
  \n例如，`Athlete` 派生了 `Human` 的所有功能和属性，并额外添加了自己的体育和运动功能及属性。假设基类 `Human` 定义了一个名为 `Work()`\
  \ 的方法以及一个如 `hoursAtWork` 的属性来表示人类工作的小时。`Human` 的三个派生类，即 `Person`、`Student` 和 `Athlete`，将派生超类定义的功能和属性。因此，代码不需要编写三次——写一次就足够。在接下来的示例中，我们将向你展示\
  \ `C++` 和 `Java` 中继承及其他相关主题示例语句。然而，建议用户参考相关章节对这些主题进行详细处理。\n\n**示例 3.2: C++ 中的继承与派生**\n\
  \n```cpp\nclass Human\n{public:\n  protected: // 声明为 protected 的变量对\n          \
  \      // 派生类可见\n      // protected variables\n};\n      // Student 继承自 Human，继承类型为\
  \ public\nclass Student : public Human\n{public:\n  private:\n};\n```\n\n注意，声明为\
  \ `private` 的成员对派生类是不可见的。如果你将这些成员数据声明为 `public`，那么安全性就会受到破坏。那么解决办法是什么？如上所示，将成员数据声明为\
  \ `protected`。如果一个公共成员函数拥有对象，即对象调用了该成员函数，那么该函数就可以访问：\n\n*   所有的公共成员函数和公共成员数据。\n\
  *   类的公共函数可以访问其类内部所有的私有成员数据和成员函数，以及其基类的受保护成员数据和成员函数。\n\n因此，如果你希望在继承中将成员数据传递给派生类，请将它们声明为\
  \ `protected`。\n\n**示例 3.3: Java 中的继承与派生**\n\n在 `Java` 中，继承通过扩展实现。假设我们有一个名为 `Human`\
  \ 的基类，具有属性和方法。然后使用 `extends` 关键字创建一个名为子类的派生类。如下例所示：\n\n```java\nClass Human\n{//\
  \ 成员数据 & 方法}\nclass Student extends Human {\n// 定义 Student 的新字段和方法将在这里}\n```\n\n\
  这使得 `Student` 拥有与 `Human` 相同的所有字段和方法，同时允许其代码专注于使其成为独特的特征。\n\n### 3.2.3 泛化（Generalization）与特化（Specialization）\n\
  \n泛化描述的是关系，而继承是面向对象语言实现泛化的工具或方法。我们可以说泛化是继承的通用称呼。图 3.3 展示了一个示例。\n\n![Generalization\
  \ – generic name for inheritance](img/44-1.png)\n\n**图 3.3** 泛化——继承的通用称呼\n\n泛化意味着派生的子类是基对象的子类型。例如，`CurrentAccount`（期期账户）是一个\
  \ `BankAccount`（银行账户）。因此，我们可以说 `BankAccount` 泛化了 `CurrentAccount` 和 `SavingsAccount`\
  \ 的共同行为和属性。\n\n共同功能仅在基类中提供。也就是说，基类是泛化，派生类或子类是特化。\n\n**示例 3.4 C++ 和 Java 中的泛化实现**\n\
  \n**C++ 中的实现**\n\n```cpp\nclass BankAccount { … };\nclass SavingAccount : public\
  \ BankAccount { … };\n```\n\n**Java 中的实现**\n\n```java\npublic class BankAccount\
  \ { … }\npublic class SavingAccount extends BankAccount { … }\n```\n\n现在让我们讨论继承的细节。考虑一个名为\
  \ `Father`（父亲）的基类以及一个名为 `Son`（儿子）的派生类，如图 3.4 所示。作为后代，你有权继承所有私有的成员数据和成员函数。\n\n![Inheritance\
  \ at work](img/45-1.png)\n\n**图 3.4** 继承的工作\n\n## 3.3 重写基类函数\n\n假设你父亲有一辆车。你可以继承并使用这辆车出行，或者买一辆摩托车取而代之。也就是说，你用自己的功能重写了父亲的\
  \ `Move()` 方法。因此当你调用 `Move()` 时，调用的是你自己的移动方法，你将骑摩托车移动。如果你想用汽车，应该显式地调用 `Father` 定义的\
  \ `Move()` 函数，如 `Father:Move()`。\n\n假设基类（超类）定义了 `age`（年龄）和 `weight`（体重）等属性，你可以添加额外的属性如\
  \ `height`（身高）。让我们假设超类定义了 `Move()` 和 `Work()` 等功能。假设你需要一种父亲定义的飞行功能，你可以定义自己的函数 `MoveByAir()`。\n\
  \n### 3.4 重载（Overloading）\n\n类可以声明多个同名但实现不同的函数变体。这被称为重载。我们在下方展示基类重载 `Move()` 方法：\n\
  \n```cpp\nMove() { cout<<”move by car”):\nMove(int m) { cout<<” move by Bus”); //\
  \ m =1\nMoveFamily(int m , int n ) { cout<<”move with family”); // n=number\n```\n\
  \n现在，如果派生类 `Son` 决定用自己的实现重写其中一个 `Move()` 函数，如：`Move() { cout<<”Move by scooter”)`\n\
  \n那么下方所示基类的另外两个重载函数将被截断，对派生类不可用，即：\n\n```cpp\nMove(int m) { cout<<” move by Bus”);\
  \ // m =1\nMoveFamily(int m , int n ) { cout<<”move with family”); // n=number\n\
  ```\n\n然而，子类可以通过显式提及基类来调用这些函数，如 `Father:Move(int m)`。\n\n## 3.5 单继承与多继承\n\n继承意味着能够从基类派生一个具有额外功能的新后代类。继承是程序员手中从现有类定义新类的强大工具。面向对象的语言支持不同类型的继承。\n\
  \n\n\n\n\n在图 1.6a 中，我们展示了`单继承`，其中派生类 `Person` 继承自基类 `Human`。在图 1.6b 中，展示了`多级继承`，其中\
  \ `Student` 继承 `Person` 的属性，而 `Person` 又继承基类 `Human`。在图 1.6c 中，我们展示了涉及一个基类三个派生类的`层级继承`。\n\
  \n图 1.6d 展示了`多继承`，其中基类被称为虚类，因为一个基类被两个派生类使用，即派生类 1 (`DC1`) 和派生类 2 (`DC2`)。此外，你可以看到派生类\
  \ 3 (`DC3`) 同时继承自 `DC1` 和 `DC2`。这种继承也被称为混合继承，因为有一个派生类 `DC3` 继承自两个基类 `DC1` 和 `DC2`。\n\
  \n## 3.6 虚继承\n\n看图 3.5。对于 `DC1`（学生）和 `DC2`（运动员）来说只有一个基类。该基类被称为虚基类，这种继承被称为虚继承。虚继承确保了在存在多个基类时可能出现的歧义性消失。\n\
  \n![Hybrid inheritance and virtual Inheritance](img/47-1.png)\n\n**图 3.5** 混合继承与虚继承\n\
  \n在某些情况下，单继承是不够的，而多继承会导致歧义。考虑图 3.5 中所示的示例。\n\n`Student` 在大学实验室工作，`Athlete` 在大学下课后在健身房锻炼。但让我们假设招聘公司需要一个既在大学实验室工作，又对健身房和运动有浓厚兴趣的\
  \ `Professional`（专业人士）。我们需要一个专业人士根据需求继承 `Students` 的 `Work()` 以及 `Athletes` 的 `Work()`。此外，`Professional`\
  \ 必须保留 `Human` 的所有基本素质（用虚箭头表示）。因此，这种关系可以称为混合继承。\n\n**多继承是从多一个基类中派生一个类**\n\n同样注意在图\
  \ 3.5 中，`Student` 和 `Athlete` 具有相同的基类 `Human`。这种类型的基类被称为`虚基类`，因为虽然两个派生类共享一个基类，但每个派生类都认为自己有自己的基类。为了方便从\
  \ `Student` 和 `Athlete` 中选择性地继承属性、函数和成员数据，我们需要将这两个类声明为`从基类的虚继承`。这种关系被称为`虚继承`，因为虽然对于派生类\
  \ `Professional` 存在名为 `Student` 和 `Athlete` 的基类，但它们的表现就像不存在一样，它们的存在仅仅是为了传递派生类 `Professional`\
  \ 所需的任何函数。\n\n我们按照所示方式声明虚继承：\n\n```\n class Student:virtual public Humans\n  class\
  \ Athlet:virtual public Humans\n```\n\n`Professional` 类声明所示：\n\n```\n class Professional\
  \ : public Student, public Athlet\n```\n\n## 3.7 多继承的问题\n\nC++ 疑提供了如多继承这样的强大功能。然而，这一功能在派生自多一个基类时会导致歧义。在图\
  \ 3.6 所示的示例中，`professional` 同时继承自 `Student` 和 `Athlete`。想象一种情况，即 `Student` 和 `Athlete`\
  \ 类都定义了一个名为 `Work()` 的函数。那么 `professional` 将继承哪一个函数？这里显然存在歧义。\n\n![Multiple inheritance\
  \ – UML diagram](img/48-1.png)\n\n**图 3.6** 多继承 – UML 图\n\n**示例 3.5: UML/C++ 中多继承的示例**\n\
  \n我们知道多继承意味着从多个基类派生。例如，参考图 3.7。\n\n![Java's solution for ambiguity problems of C++\
  \ multiple inheritance](img/48-2.png)\n\n**图 3.7** Java 解决 C++ 多继承歧义问题的方案\n\n**C++\
  \ 中的实现**\n\n```\nclass Student { … };\nclass Athlete { … };\nclass Professional\
  \ : public Student, public Athlete { … };\n```\n\n**Java 中的实现：**不支持\n\n## 3.8 接口\n\
  \n如上所示，Java 语言通过简单地不允许多继承功能，解决了多继承中的歧义问题。相反，它通过只允许一种继承（即单基类和多个接口）来解决这个问题。接口提供了其提供服务的函数名称，类可以实现一个接口，而接口的函数会在接口的其中一个派生类中实现。\n\
  \n**示例 3.6: Java 中接口的示例**\n\n对象需要与用户和外部世界交互。Java 的接口被对象用于与外部世界交互。接口简单地包含对象提供功能的所有函数的名称。只有名称但没有实现。因此，我们可以说接口是带有空体的函数名。例如，下面所示了一个\
  \ `Student` 对象的接口：\n\n```\n interface Student\n  { void GetData();void ComputeResult();void\
  \ Display();}\n```\n\n假设我们的类名为 `UGStudent`，我们可以如下所示使用接口 `Student`：\n\n```\n class\
  \ UGStudent implements Student\n  {  // 类定义}```\n\n我们可以说接口是类与外部世界之间关于功能的约定。\n\n\
  ## 3.9 继承中的访问修符\n\n继承允许一个数据类型获取另一个数据类型的属性。但这种机制在很大程度上取决于访问修符。访问修符有公共、私有和保护。\n\n\
  *   **公共继承**：在所有修符中，公共继承使用最广泛。事实上，当我们说继承时，指的是公共继承。在公共继承中，非私有成员（即公共和保护成员）对派生类可用。\n\
  *   **私有继承**：较少使用。在这里功能对派生类可用但属性不可。例如，可以通过私有继承获取 `Fly()` 函数像鸟一样飞行，但无法通过获取颜色、喙、翅膀等属性变成鸟。\n\
  *   **保护继承**：这种功能最少用，因为保护对派生类可见对其他人私有。\n\n当省略访问修符时，类按私有继承，因为类中定义的公共辅助函数对派生类可用，而不是属性，这符合私有继承的定义。用户定义的数据类型\
  \ `struct` 没有安全访问修符。因此，`struct` 默认按公共继承。\n\n### 3.10 运行时类型信息 – RTTI\n\n`dynamic_cast`\
  \ 运算符，允许程序安全地尝试将对象转换为更特定的对象类型。这一功能依赖运行时类型信息。\n\n`static_cast` 运算符：已知为特定类型的对象也可以使用\
  \ `static_cast` 转换为该类型，这是一个纯的编译时结构。\n\n## 3.11 虚函数\n\n\n\n\n\n在继承关系中，派生类通过公共访问函数获取受保护（protected）的成员数据，从而实现了一种重要的面向对象编程特性——代码重用。\n\
  \n但是如果使用派生类的成员函数来操作基类对象又会呢？这一特性允许基类对象根据用户在运行时的选择，执行派生类函数中的任何一个。\n\n这意味着为基类对象提供了一条通往所选派生类函数的“桥梁”，因此它可以能够执行该函数。当我们在基类中声明虚函数并且派生类重写该基类函数时，该桥梁就可用了。\n\
  \n如果函数在基类中被声明为虚函数，我们可以通过基类指针执行派生类中同名的重写函数。基类指针是由虚函数提供的。总之，我们可以说，从基类出发，我们可以根据用户在运行时的选择，执行与基类中虚函数同名的任何函数。\n\
  \n上述特性通过 C++ 通过为基类提供变量指针来实现。这些变量指针不仅可以指向与变量类型完全匹配的对象，还可以指向该类型任何派生类的对象。这使得数组和其他类型的容器能够持有指向不同类型对象的指针。由于给变量赋值通常发生在运行时，因此这必然是一个运行时现象。这一特性促进了下一节中解释的运行时多态和动态数据绑定。由于对象在创建时的类型在编译时是知的，因此构造函数（以及拷贝构造函数）不能是虚函数。如果类中的任何函数是虚函数，则析构函数也应该定义为虚函数。\n\
  \n## 3.12 纯虚函数\n\nC++ 支持虚函数的另一种变体，如纯虚函数。通过在函数声明末尾编写 `= 0` 可以将虚函数转换为：\n\n```\nvirtual\
  \ void FindArea() = 0;\n```\n\n注意，带有纯虚函数的类不能创建对象，此类类被称为抽象数据类型（ADT）。也可以通过在右括号之后、分号之前添加\
  \ `= 0` 来使成员函数变为“纯虚函数”。具有纯虚函数的类不能创建对象，并被称为 ADT。任何派生类继承的虚函数都是纯虚的，并且在创建派生类对象之前，必须提供该函数（以及所有其他纯虚函数）的非虚定义。尝试从具有纯虚函数或继承了纯虚函数的类创建对象将被标记为编译时错误。\n\
  \n### 3.13 运行时多态和动态数据绑定\n\n继承解决了重用问题。也就是说，派生类可以访问基类中所有声明为受保护的数据成员和函数成员。我们还学过派生类可以重写定义在基类中的函数。此外，我们在处理虚函数时看到，通过基类指针，我们可以调用派生类对象。将\
  \ OOP 语言的上述两个特性结合为我们提供了一个强大的工具，称为运行时多态和动态绑定。\n\n请参阅图 3.8，该图显示了在基类中定义虚函数的层级继承，每个派生类都用其自己的实现重写了基类的虚函数。\n\
  \n![层级继承](img/51-1.png)\n\n**图 3.8** 层级继承\n\n对于程序员而言，这一特性的意义是，通过基类指针我们可以在运行时决定调用特定的派生类重写函数。换句话说，我们可以通过基类指针将多个派生类中的重写函数绑定在一起。在上一节中，我们已经看到了虚函数的工作原理，通过它我们可以实现派生类函数与基类指针的绑定。\n\
  \n### 3.14 类作为抽象数据类型\n\n面向对象语言中的类也可以称为 `ADT`。\n\nOOP 语言的特性（如运行时多态和动态绑定）允许我们定义一个具有无实现的虚函数（称为纯虚函数）或具有占位符功能的基类，仅向用户指示实现由派生类完成。这些类被称为\
  \ ADT，因为它们隐藏了实现细节。\n\n再次参阅图 3.8。我们将声明一个名为 `Shape` 的基类（ADT）。你会发现 `Shape` 没有确定的形状、没有确定的面积或周长或特定的绘制程序。因此\
  \ `Shape` 将声明只有名称而没有实现细节的虚函数。我们将派生如 `Circle` 和 `Square` 等类，并提供这些虚函数的具体实现。具体意味着，所有的虚函数将在每个派生类中被实现。\n\
  \n### 3.15 行为与实现分离\n\n在某些 OOP 语言中，ADT 或带有无实现的虚函数的基类也被称为接口（interfaces）。基类将简单地作为接口，通过定义虚函数告知用户可用的功能，并根据用户的选择，执行任何一个派生类中的特定实现。用户被隐藏在实现细节之外。实际实现函数的代码仅在运行时链接到调用函数。\n\
  \n## 3.16 解耦\n\n在继承中，我们拥有可重用的代码。封装意味着数据和代码的绑定。当使用运行时多态时，最好以多态的方式解耦封装，以防止离散的代码模块相互相互作用。在实践中，你会注意到基类被重写的函数会自动隐藏，并且可以通过引用基类函数来显式调用。\n\
  \n## 3.17 标准模板库\n\n面向对象编程的真正定义之一是程序员通过语言使用库设施的能力。C++ 拥有非常发达的标准库，以流 IO 库的形式提供了广泛的输入输出功能。标准模板库（STL）是\
  \ C++ 提供的库最重要的补充。使用 STL 模块，程序员可以使用向量、列表、队列、映射等数据结构和算法实现编写代码。\n\n## 3.18 总结\n\n1.\
  \ OOP 语言的可扩展性和重用性通过继承、虚继承、标准模板等语言特性实现。\n2. 包含表示“拥有”（has）的关系。\nC++ 支持但 Java 不支持。一个类包含另一个类的实例。\n\
  3. 在文献中，包含被称为组合（composition）和聚合（aggregation）。\n4. 基类在 Java 中称为 superclass，派生类称为\
  \ subclass。在继承中，所有非私有成员对后代可用。也就是说，基类是泛化，派生类是特化。\n5. 子类函数可以重写基类函数。如果子类函数重写了基类重载函数中的一个，那么剩余的重载函数将被截断且对基类不可。\n\
  6. C++ 支持的继承类型有\n    - 单级和多级继承\n    - 层级继承\n    - 多重继承和混合继承（Java 不支持）\n7. 多重继承是从多个基类派生类。\n\
  8. 基类和派生类在 Java 中称为超类和子类。\n\n\n\n\n\n9. 子类方法可以重写基类函数。如果这种重写发生在基类重载函数的情况下，则重载函数的平衡将被截断，且子类无法使用这些函数。\n\
  \n10. 如果有多个子类派生自同一个基类，则该基类被称为虚基类。\n\n11. 如果一个子类派生自多个基类，为了解决由多重继承关系引起的歧义，必须将这两个基类都声明为虚类。这种继承被称为虚继承。\n\
  \n12. Java 通过仅允许单继承但多个接口来解决多重继承类型关系导致的歧义问题。接口仅包含函数名称并隐藏这些函数的实现。`Implementation of\
  \ an interface is also called realization`（接口的实现称为实现）。\n\n13. `Dynamic_cast operator`允许程序安全地尝试将对象转换为更具体的对象类型。此功能依赖于\
  \ RTTI。\n\n14. `Run-time polymorphism`（运行时多态）意味着通过基类指针，我们可以在运行时调用特定派生类的重写函数。换句话说，可以使用基类指针绑定多个派生类中的重写函数。\n\
  \n15. `Virtual Function`（虚函数）：如果函数在基类中声明为虚函数，那么我们可以通过基类指针执行派生类中同名的重写函数。基类指针由虚函数提供。\n\
  \n16. `Pure Virtual Function in C++`（C++ 中的纯虚函数）：纯虚函数是在结尾带有 `==0` 的虚函数。定义了纯虚函数的类无法创建对象。\n\
  \n17. Java 支持接口来实现 C++ 的纯虚函数概念。\n\n## 练习题\n\n### 单选题\n\n1. 子类可以访问父类的私有数据成员 – 正确\
