  \   44\\.    msg += “DELETE”;\n   45\\.    break;\n   46\\.  case KeyEvent.VK_END:\n\
  \   47\\.    msg += “END”;\n   48\\.    break;\n   49\\.  }\n   Listener\n   50\\\
  .    label.setText(msg);\n   51\\.     }\n   52\\.     public void keyReleased(KeyEvent\
  \ ke)\n   53\\.     {\n   54\\.     }\n   55\\.     public void keyTyped(KeyEvent\
  \ ke)\n   56\\.     { msg += ke.getKeyChar();\n   57\\.       label.setText(msg);\n\
  \   58\\.     }\n   59\\.   }\n   60\\. }\n```\n```\n\n上述应用程序在用户每当在键盘上输入（按下）一个按键时，都会动态地更新一个\
  \ `label`。标签的更新在第 32 行定义的 `HandleKeyEvent` 类中完成，该类实现了 `KeyListener` 接口。`HandleKeyEvent`\
  \ 类在第 26 行实例化并绑定到 `label` 上。正如之前讨论的，想要接收按键事件的控件必须拥有焦点。这是使用第 27 行的方法 `label.setFocusable(true)`\
  \ 实现的。对于不可打印按键，我们使用第 34 行的 `getKeyCode()` 方法来获取按下的按键；对于可打印按键，我们使用第 56 行的 `getKeyChar()`\
  \ 方法获取按键。这两个方法都定义在 `KeyEvent` 对象中，该对象作为参数传递给事件处理函数。从代码可以看出，`getKeyCode` 方法返回一个整数常量。我们使用\
  \ `switch` 语句来识别并处理特殊键。`keyRelased()` 函数是一个空函数（dummy function），但我们必须按照接口的定义它，否则我们将得到编译错误。\n\
  \n### 23.6.4 鼠标事件监听器\n\n鼠标事件与按键事件一样都是低级事件。为了处理鼠标事件，我们需要定义实现 `MouseListener` 接口的类。`MouseListener`\
  \ 接口定义五个函数：\n\n`mouseEntered(MouseEvent e)`：当光标进入控件区域时，调用此方法。\n\n`mouseExited(MouseEvent\
  \ e)`：当光标离开控件区域时，调用此方法。\n\n`mousePressed(MouseEvent e)`：当用户按下鼠标按钮时，调用此方法。\n\n`mouseReleased(MouseEvent\
  \ e)`：当用户释放鼠标按钮时，调用此方法。\n\n`mouseClicked(MouseEvent e)`：当用户点击（即按下并释放）鼠标按钮时，调用此方法。\n\
  \n示例 23.14 阐了如何创建一个鼠标事件处理程序并处理鼠标事件。图 23.15 显示了输出。\n\n**示例 23.14：演示鼠标事件处理的程序**\n\n\
  ```\n 1\\. import java.awt.*;\n   2\\. import java.awt.event.*;\n   3\\. import\
  \ javax.swing.*;\n   4\\. public class SwingDemo {\n   5\\.   public static void\
  \ main(String[] args) {\n   6\\.    JFrame frame = new DisplayFrame();\n   7\\.\
  \     frame.setVisible(true);\n   8\\.   }\n   9\\. }\n   10\\. class DisplayFrame\
  \ extends JFrame{\n   11\\.   DisplayFrame(){\n   12\\.    setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  \   13\\.    setTitle(“Swing Demo”);\n   14\\.    setSize(300, 150);\n   15\\. \
  \   setLocation(100,100);\n   16\\.    JPanel panel = new DisplayPanel();\n   17\\\
  .    getContentPane().add(panel);\n   18\\.   }\n   19\\. }\n   20\\. class DisplayPanel\
  \ extends JPanel{\n   21\\.   String msg = “”;\n   22\\.   JLabel label;\n   23\\\
  .   DisplayPanel() {\n   24\\.   label = new JLabel(msg);\n   25\\.   label.addKeyListener(new\
  \ HandleKeyEvent());\n   26\\.   label.setFocusable(true);\n   27\\.   JLabel disp_label\
  \ = new JLabel(“Enter Text”);\n   28\\.   add(disp_label);\n   29\\.   add(label);\n\
  \   30\\.   }\n   31\\. class HandleKeyEvent implements KeyListener{\n   32\\. \
  \  public void keyPressed(KeyEvent ke) {\n   33\\.    int key = ke.getKeyCode();\n\
  \   34\\.    switch(key)\n   35\\.  {\n   36\\.  case KeyEvent.VK_HOME:\n   37\\\
  .    msg += “HOME”;\n   38\\.    break;\n   39\\.  case KeyEvent.VK_INSERT:\n  \
  \ 40\\.    msg += “INSERT”;\n   41\\.    break;\n   42\\.  case KeyEvent.VK_DELETE:\n\
  \   43\\.    msg += “DELETE”;\n   44\\.    break;\n   45\\.  case KeyEvent.VK_END:\n\
  \   46\\.    msg += “END”;\n   47\\.    break;\n   48\\.  }\n   Listener\n   49\\\
  .    label.setText(msg);\n   50\\.     }\n   51\\.     public void keyReleased(KeyEvent\
  \ ke)\n   52\\.     {\n   53\\.     }\n   54\\.     public void keyTyped(KeyEvent\
  \ ke)\n   55\\.     { msg += ke.getKeyChar();\n   56\\.       label.setText(msg);\n\
  \   57\\.     }\n   58\\.   }\n   59\\. }\n```\n\n在该示例中，每当用户点击按钮时，我们就计数一次；另一个任务是在每次光标位于区域内时将面板背景设置为黄色。为了实现这些任务，我们使用了一个实现了\
  \ `MouseListener` 的鼠标事件处理程序 `HandleMouseEvent`。它在第 30 行实例化并绑定到按钮。\n\n### 23.7 Applet\n\
  \nApplet 是从一个计算机传输到另一个计算机的小型 Java 程序。它们不能独立运行，需要网络浏览器或名为 `appletviewer` 的程序在系统上运行。\n\
  \nApplet 与应用程序一样可以执行许多任务，如计算、获取用户输入、传递参数、使用丰富的图形功能显示、播放音乐以及最后创建动画。但它的妙之处在于，Applet\
  \ 可以嵌入 HTML 标签中从一个计算机传输到另一个计算机。\n\n### 23.7.1 Applet 概念\n\n我们拥有层次结构为 `java->applet->Applet`\
  \ 的 `Applet` 类。因此，我们要编写的 Applet 类必须继承 `java.applet.Applet` 包。详情见图 23.16。\n\n\n\n\
  \n\n### 初始化\nApplet 在诞生时会调用 `init()` 方法，该方法设置初始条件，例如创建所需的对象、设置字体、颜色和图像、设置窗口大小以及设置初始值。通常，我们需要编写自己的\
  \ `init()` 方法来覆盖基类的 `init()` 方法。\n\n### 运行\n当 applet 被创建时，它通过调用 `start()` 方法进入运行（Running）状态。`start()`\
  \ 方法在 applet 通过 `init()` 方法初始化时自动调用。处于空闲（idle）状态的 applet 也可以启动。因此，我们可以说 `start(0)`\
  \ 方法可以被调用任意次。\n\n### 空闲/stop() \n当调用 `stop(0)` 方法时，applet 会进入空闲（idle）状态。每当运行该 applet\
  \ 的网页离开时，就会自动调用此 `stop()`。如果 applet 运行在一个线程上，则该线程会被停止。\n\n### 死亡状态（Dead state）\n\
  这是 applet 从主内存中移除的状态。使用调用 `destroy()` 方法来清理任何内存空间。\n\n### 显示状态（Display state）\n\
  这发生在 applet 运行 `paint()` 方法，或者面板对象（panel object）被添加到容器对象（Container object）时，例如带有\
  \ swing 组件的 Applets。\n\n总结来说，当任何浏览器加载 applet 或 JApplet 时，调用的方法有四种由浏览器自动启动的。它们是\n\
  \n*   `Init()`：每当 Applet 加载时自动启动。它类似于一个构造函数。它最初创建 applet，包括线程的初始化。\n*   `Start()`：每当调用\
  \ `init()` 时自动启动。\n*   `Stop()`：每当调用 `destroy()` 方法时自动调用。\n*   `Destroy()`：每当浏览器关闭时自动调用。在此部分中，必须停止并移除线程。\n\
  *   `Paint(Graphics g)`：每当调用 `start()` 时自动调用。\n*   `Update(Graphics g)`：在 `paint()`\
  \ 之后，`update()` 更新容器。\n*   `Repaint(Graphics g)`：调用 `update()`，后者调用 `paint()`，反过来又调用\
  \ `update()` 来更新容器。\n\n#### 23.7.3 创建 Applet – HelloWorld Applet\n\n在我们的第一个示例中，我们将编写一个\
  \ applet 程序，以突出我们用于设置 applet 工作的问题和命令。Applet 编程有两个不同的阶段：\n\n*   开发 Applet 程序并像普通\
  \ Java 程序一样编译。输出将为 `HelloWorldApplet.class`。\n*   在任何文本编辑器中编写下所示 HTML（超文本标记语言）标签，并将文件命名为\
  \ `HelloWorldApplet.html`。在 html 文件中嵌入 applet 标签。\n*   使用 `appletviewer` 或网络浏览器执行\
  \ applet 程序。详细信息所示。\n\n**示例 23.15：HelloWorldApplet.java，在主 Java 程序中嵌入了 HTML 标签。此代码只能通过\
  \ Appletviewer 执行**\n\n```\n 1\\. /* <HTML>\n   2\\. <BODY>\n   3\\. <Applet Code=”HelloWorldApplet.class”\
  \ Height=320 Width=400>\n   4\\. </Applet>\n   5\\. </BODY>\n   6\\. </HTML>\n \
  \  7\\. */\n   8\\. import java.awt.*;\n   9\\. import java.applet.*;\n   10\\.\
  \ import java.awt.Graphics.*;\n   11\\. public class HelloWorldApplet extends Applet\
  \ {\n   12\\. public void paint(Graphics g) {\n   13\\. g.drawString(«Hello There\
  \ !This is how Applets look & feel !», 65 , 95);\n   14\\. }\n   15\\. }\n```\n\n\
  **编译：** 进入输入 java 文件的目录。\n\n`javac HelloWorldApplet.java`\n\n`Appletviewer HelloWorldApplet.java`\
  \ 输出如图 23.18 所示。\n\n![An applet output](img/570-1.png)\n\n**图 23.18** applet 输出\n\
  \n**示例 23.16：HelloWorldApplet.java，单独创建 HTML 文件并将类文件嵌入到 HTML 文件中。此代码可以使用 AppletViewer\
  \ 或网络浏览器执行。**\n\n```\n //HelloWorldApplet.java\n   1\\. import java.awt.*;\n   2\\\
  . import java.applet.*;\n   3\\. import java.awt.Graphics.*;\n   4\\. public class\
  \ HelloWorldApplet extends Applet {\n   5\\. public void paint(Graphics g) {\n \
  \  6\\. g.drawString(“Hello There !This is how Applets look & feel !”, 65, 95);\n\
  \   7\\. }\n   8\\. }\n```\n\n**编译：`javac HelloWorldApplet.java`**\n\n在同一目录中创建一个名为\
  \ `HelloWorldApplet.html` 的单独 html 文件。\n\n```\n 1\\. <HTML>\n   2\\. <BODY>\n  \
  \ 3\\. <Applet Code=”HelloWorldApplet.class” Height=320 Width=400>\n   4\\. </Applet>\n\
  \   5\\. </BODY>\n   6\\. </HTML>\n```\n\n**程序运行：**\n\n`Appletviewer HelloWorldApplet.html`\n\
  \n或者进入创建 html 文件的目录下的网络浏览器图标并双击图标。\n\n`import` 语句引导 [Java 编译器](http://en.wikipedia.org/wiki/Java_compiler)\
  \ 包含 `java.applet.*` 和 `java.Graphics.*`。由于 Applet 类广泛使用窗口功能，我们还需要导入一个名为 `awt` 的包，它代表高级窗口工具包（Advanced\
  \ Windowing ToolKit）。\n\nHello 类继承自 Applet 类；Applet 类为宿主应用程序提供了显示和控制 applet 生命的框架。Applet\
  \ 类为 applet 提供了显示 GUI 和响应用户事件的能力。\n\nHello 类覆盖了 `paintComponent(Graphics)` 方法，提供了显示\
  \ applet 的代码。`paint()` 方法被传递一个 `Graphics` 对象，该对象包含了用于显示 applet 的图形上下文。`paintComponent()`\
  \ 方法调用图形上下文的 `drawString(String, int, int)` 方法，在 applet 显示区域左上角 `(65, 95)` 处的像素偏移位置显示“Hello\
  \ there! This is how Applets look and feel” 字符串。\n\n**HTML 文档：** 为了运行 `HelloWorldApplet`，你需要另一个名为\
  \ `HelloWorldJApplet.html` 的程序，它本质上是一个包含 `HelloWorldJApplet` 类的程序。HTML 代表超文本标记语言。HTML\
  \ 是浏览器理解的语言，称为脚本语言。\n\n一个典型的 HTML 文档所示。调用：`HelloWorldApplet.html`\n\n```\n <html>\n\
  \   <head>\n   <title>Hello World Applet</title>\n   </head>\n   <body>\n   <applet\
  \ code=”HelloWorldApplet” width=”200” height=”200”>\n   </applet>\n   </body>\n\
  </html>\n```\n\n使用 `<applet>` HTML 元素在 HTML 文档中放置 applet。applet 标签设置了三个属性：`code=”HelloWorldApplet\"\
  ` 指定 Applet 类名，`width=”200” height=”200”` 设置 applet 的像素宽高度。\n\n主机应用程序（通常是网络浏览器）实例化\
  \ **HelloWorldApplet** applet 并为其创建一个 [AppContext](http://java.sun.com/javase/6/docs/api/java/applet/AppContext.html)。一旦\
  \ applet 完成初始化，它会被添加到 AWT 显示层次结构中。当 AWT 需要 applet 绘制自己时，就会调用 `paint()` 方法。\n\n####\
  \ 23.7.4 JApplets – 带有 Swing 组件的 Applets：更好的外观\n\nJava 引入了最新的 Java Swing 组件，类层次结构为：java->applet->Applet->JApplet。为了获得更好的特性，最好让我们的\
  \ Applet 类继承 `JApplet` 而不是 Applet。由于大多数 Applet 使用窗口功能，我们需要导入 javax 以提供丰富的库，以便轻松实现\
  \ GUI/界面等。\n\n我们可以从图 23.19 中清楚地看到 `JApplet` 继承自 `Panel`，而 `Panel` 又继承自 `Container`\
  \ 类。因此，我们需要向 `JApplet` 类添加组件。\n\n![Class hierarchy of JApplet class](img/572-1.png)\n\
  \n**图 23.19** JApplet 类层次结构\n\n**示例 23.17：HelloWorldJApplet.java：带有 Swing 的 Java\
  \ Applet**\n\n\n\n\n\n```\nimport javax.swing.*;\nimport java.awt.*;\npublic class\
  \ HelloWorldJApplet extends JApplet {\npublic void init() {\n//首先获取容器对象\nContainer\
  \ myContentPane=getContentPane();\n//我们设置了布局。我们将使用流式布局。\nmyContentPane.setLayout(new\
  \ FlowLayout());\n//准备要发布在 myContentPane 上的标签\nJLabel message = new JLabel(“Welcome\
  \ to swing components in Java”);\n//将标签添加到 myContentpane\nmyContentPane.add(message);\n\
  }\n}\n```\n\n| 行号 | 描述 |\n| :--- | :--- |\n| 第 7 行： | 定义了一个名为 `myContentpane` 的\
  \ `Container` 类对象。`getContentPane()` 返回一个 `Container` 的对象。 |\n| 第 9 行： | 正在将布局设置为\
  \ `FlowLayou()` |\n| 第 11 行： | 创建了一个 `JLabel` 对象并传递了一个用于显示的 `Tring`（字符串）。 |\n| 第\
  \ 13 行 | 仅将 `message` 添加到 `Container`。 |\n\n要获得输出，请编译程序以生成 `HelloWorld.class`。如果你正在使用\
  \ eclipse IDE，可以直接运行该程序以获得输出。或者按照上一节的说明创建一个 HTML 文档。输出所示图 23.20。\n\n![JApplet output](img/573-1.png)\n\
  \n**图 23.20** JApplet 输出\n\n**示例 23.18: HelloWorldJApplet.html: 用于 HelloWorldJApplet.java\
  \ 的 HTML 脚本**\n\n```\n<html>\n<title>HelloWorldJApplet</title>\n<body\n  <applet\
  \ code=”HelloWorldJApplet.class”\n  width=400 height = 200>\n </applet>\n</body\n\
  </html>\n```\n\n在目录 `c:\\oopsjava\\workspace\\oopstech2\\src\\com\\oops\\chap23`\
  \ 或你工作的任何目录中创建名为 `HelloWorldJApplet.html` 的上述程序。`appletviewer.exe` 是 Java 提供的测试\
  \ applet 的程序。执行 `C:\\Oopsjava\\examples\\bin\\> appletviewer HelloWorldJApplet.java`\
  \ 将产生上述输出。或者，你也可以创建一个单独的 html 文件并使用像 IE 这样的网络浏览器，通过双击 `HelloWorldJApplet.html` 文件来调用网络浏览器以获得相同的输出。\n\
  \n`import` 语句引导 [Java 编译器](http://en.wikipedia.org/wiki/Java_compiler) 包含 [javax.swing.JApplet](http://java.sun.com/javase/6/docs/api/javax/swing/JApplet.html)\
  \ 和 `java.Graphics.*`。由于 `JApplet` 类广泛使用了窗口的特性，我们还需要导入名为 `awt` 的包。\n\n`Hello` 类继承了\
  \ `JApplet` 类；`JApplet` 类为主机应用程序提供了显示和控制 applet 生命周框架。`JApplet` 类为 applet 提供了显示\
  \ GUI 和响应用户事件的能力。\n\n从外观和感觉来说，Applet 还是 JApplet 更好？请参考图 23.18 和 图 23.20。你会同意带有 swing\
  \ 组件的 applet 提供了更好的外观和良好感。因此，我们将在 Applets 中使用 swing 组件。从现在起，我们不再编写 HTML 标签。我们假定你将能够理解并执行你的\
  \ applet 程序。\n\n### 23.7.5 Applets 与 独立应用程序\n\n#### 独立应用程序\n\n我们到目前为止所做的程序被称为独立程序。独立应用程序的特征特征是它将包含一个\
  \ `main()` 方法。Java 中的独立应用程序类似于使用 `c++` 进行应用程序开发，并包含了该语言的所有特性。\n\n#### Applets\n\n\
  - Applets 由网络浏览器运行。它们被设计用于在互联网上运行。\n- applet 的特征是它将没有 `main()` 方法。相反，它会有 `init()`\
  \ 方法。\n- Applets 无法独立运行。它们需要嵌入到 HTML 标签中。HTML 代表超文本标记语言。\n- 由于安全限制，applets 无法读取本地文件/磁盘或向磁盘写入。\n\
  - Applets 无法访问存储在本地计算机上的任何其他程序。\n\n### 23.7.6 向 Applets 传递参数\n\n我们用于将类嵌入 HTML 标签的\
  \ applet 标签如下所示：\n\n`<applet code=”HelloWorldApplet” width=”200” height=”200”> </applet>`。这是一个简单的标签。现在我们将向你介绍一个完整的\
  \ HTML 文件。\n\n**示例 23.19: 一个完整的 HTML 文件的示例**\n\n```\n <APPLET\n    [CODEBASE = codebase_URL]\
  \ // html 文件的目录\n    CODE= “Applet 类名” // 例如 ”HelloWorldJApplet.class”\n    [ ALT\
  \ = 替代文本]\n    [ NAME = applet 实例名称]\n    WIDTH=像素数\n    HEIGHT = 像素数\n    [ ALLIGN\
  \ = 对齐方式] //TOP BOTTOM, LEFT,RIGHT,MIDDLE 等\n    [VSPACE]= 像素] // 使用 LEFT 或 RIGHT\
  \ 时使用\n    [HSPACE]=像素] // 使用 TOP 或 BOTTOM 时使用\n  >\n[PARAM NAME = name1 VALUE =\
  \ value1> // 用于传递参数\n[PARAM NAME = name2 VALUE = value2>\n</APPLET>\n```\n\n让我们尝试向\
  \ applet 传递参数的示例。我们将传递由 applet 显示的颜色和文本。此外，我们将传递由 applet 执行的数字。让我们看看结果。\n\n**示例\
  \ 23.20: 编写一个基于 Swing 的 Applet 从 HTML 标签接收字符串值。如果标签文件中输入 India，则显示 Hello India！否则必须显示\
  \ Hello Delhi！**\n\n```\n //: HTMLParam.java\n   1\\. /*<HTML><BODY><Applet Code=”HTMLParam.class”\n\
  \   2\\. width=400 height =200> <PARAM NAME = “String”VALUE= “India!” >\n   3\\\
  . </Applet></BODY></HTML> */\n   4\\. import javax.swing.*;\n   5\\. import java.awt.*;\n\
  \   6\\. public class HTMLParam extends JApplet {\n   7\\. String stg;\n   8\\.\
  \ public void init() {\n   9\\. //获取显示的字符串\n   10\\. stg=getParameter(“String”);\n\
  \   11\\. if ( stg==null)\n   12\\. stg=”Delhi!”;\n   13\\. stg=”Hello ”+stg;\n\
  \   14\\. //首先获取容器对象\n   15\\. Container myContentPane=getContentPane();\n   16\\\
  . //我们设置了布局。我们将使用流式布局。\n   17\\. myContentPane.setLayout(new FlowLayout());\n  \
  \ 18\\. //准备要发布在 myContentPane 上的标签\n   19\\. JLabel message = new JLabel(stg);\n\
  \   20\\. //将标签添加到 myContentpane\n   21\\. myContentPane.add(message);\n   22\\\
  . }\n   23\\. }\n```\n\n\n\n\n\n```java\n /*<HTML><BODY><Applet Code=”InputToApplet.class”\
  \ width=800 height =800></Applet></BODY></HTML> */\n   1\\. package com.oops.chap23;\n\
  \   2\\. import javax.swing.*;\n   3\\. import java.awt.*;\n   4\\. import java.awt.event.*;//\
