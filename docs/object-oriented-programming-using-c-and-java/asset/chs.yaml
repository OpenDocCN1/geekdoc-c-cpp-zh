  \ by Default constructor : ramesh\nStudents rollNo set by SetRollNo :6060\nStudents\
  \ name set by Default constructor :Gautam*/\n```\n\n### 10.6 this 指针 (This Pointer)\n\
  \n我们知道 C++ 的内存管理为你的代码分配了名为代码段（code section）的独立内存区域。因此，你的函数代码位于该区域。但我们也知道变量存储在栈区域（stack\
  \ area）或堆内存中。当函数被对象调用时，需要将被调用的函数与对象的数据连接起来。因此，对象作为函数的参数传递给函数。但这个参数（即调用函数的对象的地址）并像普通的形式参数那样可见，它是被隐藏的。这个隐藏的地址被称为\
  \ `this` 指针。它之所以 own `this`，是因为它指向该对象，即调用函数的对象。\n\n在函数中，如果你显式使用 `this` 指针，它指向对象的成员数据。注意，我们可以通过使用对象来达到相同的效果。但请注意，`this`\
  \ 是一个指针，因此它具有立即且快速访问对象的优势。查看使用 `this` 指针重写的示例 10.9 中的程序。\n\n### 示例 10.11： this.cpp\
  \ 使用 this 指针在堆上创建对象。类的构造函数和析构函数\n\n```cpp\n#include<iostream>\nusing namespace std;\n\
  class Student\n{ public:\n     Student(){rollNo=50595,name=”Anand”;}\n     ~Student(){};\
  \ // 默认析构函数\n     int GetRollNo() const { return this->rollNo;}\n     void SetRollNo\
  \ ( int n) { this->rollNo=n;}\n     char * GetName() const { return this->name;}\n\
  \     void SetName( char *p) { this->name=p;}\nprivate:\n     int rollNo;\n    \
  \ char *name;\n};\nvoid main()\n{    Student std; // 创建了对象\n     Student *ptr =\
  \ new Student;// 在自由存储区（free store）上创建了对象\n     cout<<” \\n Students rollNo set\
  \ by Default constructor : “\n           <<ptr->GetRollNo()endl;\n     cout<<”\\\
  n Students name set by Default constructor : “\n           <<ptr->GetName()endl;\
  \ // 从堆访问成员数据\n     //将学号设置为 50\n     ptr->SetRollNo(6060);\n     ptr->SetName(“Gautam”);\n\
  \     cout<<”\\n Students rollNo set by SetRollNo :”\n           <<ptr->GetRollNo()endl;\n\
  \     cout<<”\\n Students name set by Default constructor :”\n           <<ptr->GetName()endl;\n\
  \     //现在删除堆上的内存\n     delete ptr;\n}\n/*输出：Students rollNo set by Default constructor\
  \ : 50595\nStudents name set by Default constructor : Anand\nStudents rollNo set\
  \ by SetRollNo :6060\nStudents name set by Default constructor :Gautam*/\n```\n\n\
  ### 10.7 指针与对象：常量的使用 (Use of Constant)\n\n我们知道指针是地址，并为我们内存内存。在 4.5 节中，我们已经看到了常量指针的使用。在处理对象时，我们声明数据不应被更改。在这种情况下，我们会将其声明为\
  \ `const`。\n\n因此，涉及两种组合：指针类型和数据类型。每种都有两种变体：常量和普通。因此，我们可以有四种声明方式。所示：\n\n```cpp\n\
  指向对象的指针\n//堆上的普通指针\nStudent *ptr = new Student; // ptr 是堆上的普通指针\n指向常量对象的指针\n//指向常量\
  \ Student 的指针\nconst Student *conststudent = new Student;\n常量指针指向对象\n//指向 Student\
  \ 的常量指针\nStudent * constptr = new Student;\n常量指针指向常量对象\n//指向常量 student 的常量指针\nConst\
  \ Student * const cptrstd = new Student;\n```\n\n在接下来的示例中，我们将演示上述不同指针类型和数据类型的部署方法和规则。当我们使用堆上的普通指针指向普通对象时，我们使用\
  \ `Get()` 和 `Set()` 函数。`Set()` 函数的使用意味着我们可以修改对象的数据。注意，所有的 `Get()` 函数都声明为 `const`，这样它们就不会更改数据值，只能浏览这些值。\n\
  \n```cpp\nStudent *ptr = new Student;\nint GetRollNo() const { return rollNo;} //\
  \ 仅读。函数不能更改数据。\nvoid SetGrade( char p) { grade=p;}\n```\n\n当我们使用指向常量对象的指针时，我们无法使用\
  \ `SetGrade()` 函数，因为它设置了 grade 的数据。这样做是因为我们已经将对象声明为常量。\n\n```cpp\n//指向常量 Student\
  \ 的指针\nconst Student *conststudent = new Student;\nptr->SetGrade(‘C’); // 不允许\n\
  ```\n\n当使用第三种方案即指向常量对象的常量指针时，指针不能重新赋值，数据也不能被修改。\n\n```cpp\n//指向常量对象的常量指针\nConst\
  \ Student * const cptrstd = new Student;\nint GetRollNo() const { return rollNo;}\
  \ // 允许\nptr->SetGrade(‘C’); // 不允许\n```\n\n### 示例 10.12： ptrcdata.cpp 演示常量指针和常量对象的使用。类的构造函数和析构函数\n\
  \n\n\n\n\n```cpp\n#include<iostream>\nusing namespace std;\n// 声明一个名为 Student 的类\n\
  class Student\n{ public:\n     Student(){rollNo=50595,grade=’A’;}\n     ~Student(){};\
  \ // 默认析构函数\n     int GetRollNo() const { return rollNo;}\n     void SetRollNo (\
  \ int n) { rollNo=n;}\n     char GetGrade() const { return grade;}\n     void SetGrade(\
  \ char p) { grade=p;}\nprivate:\n     int rollNo;\n     char grade;\n};\nvoid main()\n\
  \     { // ptr 是堆上的普通指针\n     Student *ptr = new Student;\n     // conststudent\
  \ 是指向常量 Student 的指针\n     const Student *conststudent = new Student\n     //constptr\
  \ 是指向 Student 的常量指针\n     Student * const constptr = new Student;\n     const Student\
  \ * const cptr = new Student;\n     cout<<”explore the possibilities with normal\
  \ heap pointer *ptr”<<endl;\n     cout<<” \\n Students rollNo set by Default constructor\
  \ : “\n           <<ptr->GetRollNo<<endl;\n     cout<<”\\n Students Grade set by\
  \ Default constructor : “\n           <<ptr->GetGrade()endl;\n     // 将学号设为 60，等级设为\
  \ B\n           ptr->SetRollNo(6060);\n           ptr->SetGrade(‘B’);\n     cout<<“\\\
  n Students rollNo set by SetRollNo() function :“\n           <<ptr->GetRollNo<<endl;\n\
  \     cout<<“\\n Students name set by setgrade() function:“\n           <<ptr->GetGrade<<endl;\n\
  \     cout<<“\\nexplore the possibilities with pointer *conststudentto“<<endl;\n\
  \     cout<<“ constant object Student“<<endl;\n     cout << ”\\n Display Grade …”<<conststudent\
  \ ->GetGrade()<<endl;\n     //conststudent->SetGrade(‘C’); // 不允许。\n     /*常量指针调用非常量成员函数。这是错误。conststudent\
  \ 是指向常量 Student 的指针，而 SetGrade 是非常量函数并可以修改值。因此我们无法使用。你将观察到错误 C2662：‘SetGrade’：无法将‘this’指针从‘const\
  \ class Student’ 转换为‘class Student &’，因此在注释中显示 */\n     // 指向常量对象的常量指针\n     cout<<“\\\
  nexplore the possibilities with const pointer *cptr to“<<endl;\n     cout<<“ constant\
  \ object Student“<<endl;\n     cout<<“\\ncptr-> GetGrade()...<<cptr->GetGrade()endl;//允许\n\
  \     //cout<<“\\ncptr->SetGrade(‘C‘).。“<<cptr->SetGrade(‘C‘)<<endl;//不允许\n    \
  \ // 现在从堆中删除内存\n     delete ptr;\n     delete cptr;\n     delete conststudent;\n\
  }\n```\n\n## 为什么我们使用常量指针？\n\n我们之所以这样做是因为常量指针不能调用非常量成员函数，即可以修改成员数据的成员函数。这样，我们的成员数据就是安全的。虽然指向常量对象的常量指针是可行的，但这样做非常繁琐和麻烦。相反，如果使用引用，可以更优雅地实现同样的功能。记住，在无法重新赋值指针的情况下，引用是更好的替代方案。\n\
  \n## 10.8 通过引用传递对象和函数指针\n\n我们知道普通变量可以通过值传递和引用传递在函数之间进行传值。我们在第 6 章关于指针的节中中也学习过，通过引用传递涉及通过指针或引用（地址）传递。对象因为占用大量的内存，必须通过引用传递传递。更重要的是，如果你使用值传递，当对象传递给函数时会创建一个副本，当函数返回对象给调用函数时又会创建另一个副本。这是多么浪费内存内存！不仅如此，还会消耗其他资源，例如调用构造函数和析构函数。当你使用值传递时，你的程序正忙于这些不必要的工作。\n\
  \n在下一个示例中，我们将研究对象调用函数时，值传递和引用传递的影响。为此，我们将在类外声明三个不同的函数，并展示在不同调用模式下涉及的成本和效率。\n\n```cpp\n\
  Student FindGrade( Student std); // 值传递\nStudent * FindGrPtr(Student *std); // 使用指针的引用传递\n\
  Student & FindGrRef (Student &std); // 使用引用的引用传递\n```\n\n另外注意我们将所有成员数据声明为指针。\n\n\
  ```cpp\nint *rollNo; float *total; char *grade;\n```\n\n构造函数使用 `new` 运算符在堆内存中分配内存，如下：\n\
  \n```cpp\nStudent::Student(int n, float t, char c)\n{ cout<<”\\n This is Student(int,float,char)\
  \ constructor…\\n”;\nrollNo= new int(n);\ngrade= new char(c);\ntotal=new float(t);\n\
  }\n```\n\n每当我们需要毁对象时就会调用析构函数。但记住，我们的数据成员如 `rollNo`、`grade` 和 `total` 位于堆上。因此，我们必须删除它们。\n\
  \n```cpp\n~Student(){cout<<”\\n This is destructor..\\n”;\ndelete rollNo;\ndelete\
  \ grade;\ndelete total;\n}\n```\n\n拷贝构造函数从源获取数据并在堆上分配空间。\n\n```cpp\nStudent::Student(Student\
  \ &src)\n{ cout<<”This is copy constructor..\\n”;\nrollNo= new int(n);\ngrade= new\
  \ char(c);\ntotal=new float(t);\n}\n```\n\n`src` 是我们用来标识源的名称。通常左侧保留给当前对象，即目标放置在堆上。因此，`rollNo`、`grade`\
  \ 和 `total` 使用 `new` 运算符分配了空间。\n\n```cpp\nrollNo= new int(n);\ngrade= new char(c);\n\
  total=new float(t);\n}\n```\n\n\n\n\n\n# 示例 10.13: `refptr.cpp` 展示对象的引用传递、指针传递和值传递。类的构造函数与析构函数。\n\
  \n```cpp\n#include<iostream>\nusing namespace std;\n//声明一个名为 Student 的类\nclass Student\n\
  \ {  public:\n    Student();\n    Student(int n, float t, char c);\n    Student(Student\
  \ &);\n    ~Student(){cout<<”n This is destructor..\\n\";\n    delete rollNo;delete\
  \ grade;delete total;} // 默认析构函数\n    int *GetRollNo() const { return rollNo;}\n\
  \    void SetRollNo ( int n) { *rollNo=n;}\n    char *GetGrade() const { return\
  \ grade;}\n    void SetGrade( char p) { *grade=p;}\n    float * GetTotal() const\
  \ { return total;}\n    void SetTotal( float t) { *total=t;}\nprivate:\n    int\
  \ *rollNo;\n    float *total;\n    char *grade;\n};\n    Student::Student()\n  \
  \  { cout<<\"\\nThis is default constructor…\\n\";\n           rollNo= new int;\n\
  \           grade= new char(‘D’); // 默认 Grade\n           total=new float;\n   \
  \ }\n    Student::Student(int n, float t, char c)\n    { cout<<\"\\n This is Student(int,float,char)\
  \ constructor…\\n\";\n           rollNo= new int(n);\n           grade= new char(c);\n\
  \           total=new float(t);\n    }\n    Student::Student(Student &src) // src\
  \ 表示源对象\n    { cout<<\"This is copy constructor..\\n\";\n           rollNo=new int(*(src.rollNo));\n\
  \           grade=new char(*(src.grade));\n           total=new float(*(src.total));\n\
  \    }\n// 三非成员函数\nStudent FindGrade( Student std); // 值传递\nStudent * FindGrPtr(Student\
  \ *std); // 使用指针的引用传递\nStudent & FindGrRef (Student &std); // 使用引用的引用传递\nvoid main()\n\
  { cout<<\"\\n create an ordinary object called std for Student class..\\n\";\n \
  \   Student std; // 创建了一个对象。因此将调用构造函数 Student *std2=new Student(); // std2 在堆上创建。\n\
  std.SetRollNo(50);\n    std.SetTotal(99.0);\ncout<<”\\n RollNO:”<<*(std.GetRollNo())<<”\\\
  t”\n    <<”Total:”<<*(std.GetTotal())<<endl;\n// 现在调用函数 FindGrade(Student std)\n\
  // 查看构造函数是如何参与的，一个用于前向拷贝，一个用于返回\n// 同时也查看局部变量设置的值(grade =A)是如何反映在 main 函数中的\n//\
  \ 因为你通过使用 return std 语句按值返回对象\n// 你还应该看到两个析构函数\n     FindGrade(std);\n     cout<<”\\\
  n Students Grade set by FindGrade() :”\n           <<*(std.GetGrade())<<endl;\n\
  // 现在调用函数 FindGrPtr( Student *std)\n// 查看构造函数和析构函数完全没有参与\n// 同时也查看局部变量设置的值(grade)是如何反映在\
  \ main 函数中的\n     std2=FindGrPtr(std2); // 指针引用传递方法\n     cout<<”\\n Students Grade\
  \ set by FindGrPtr() : “\n           <<*(std2->GetGrade())<<endl; // 通过指针引用传递\n\
  // 现在调用函数 FindGrref(Student & std)\n// 查看构造函数和析构函数完全没有参与\n// 同时也查看局部变量设置的值(grade)是如何反映在\
  \ main 函数中的\n     FindGrRef(std); // 引用传递方法\n     cout<<”\\n Students Grade set\
  \ by FindGrRef() :”\n           <<*(std.GetGrade())<<endl; // 引用传递 */\n     }//\
  \ main 结束\n// 定义函数\nStudent FindGrade( Student std)\n    { cout<<”\\n FindGrade(\
  \ Student std) function …\\n”;\n      cout<<” \\n Students Grade set by FindGrade()\
  \ : \\n”;\n      std.SetGrade(‘A’);\n      cout<<”\\n inside FindGrade..:”<<*(std.GetGrade())<<endl;\n\
  \      return std;\n}\nStudent * FindGrPtr(Student *std)\n{     std->SetGrade(‘B’);\n\
  \      cout<<”\\n Inside FindGrPtr() : “<<*(std->GetGrade())<<endl;\n      return\
  \ std;\n}\nStudent & FindGrRef ( Student &std)\n{ std.SetGrade(‘C’);\n  cout<<”\\\
  n InsideGrRef() : “<<*(std.GetGrade())<<endl;\n  return std;\n}\n/*输出：这是拷贝构造函数..\n\
  FindGrade( Student std) function …\nStudents Grade set by FindGrade() :\ninside\
  \ FindGrade..:A\n这是拷贝构造函数..\n这是析构函数..\n这是析构函数..\nStudents Grade set by FindGrade()\
  \ :D\nInside FindGrPtr() : B\nStudents Grade set by FindGrPtr() : B\nInside FindGrRef()\
  \ : C\nStudents Grade set by FindGrRef() :C*/\n```\n\n#### 10.9 常指针与常量引用\n\n回顾上面的示例函数\
  \ `Student * FindGrPtr(Student *std)` 使用指针引用传递。它还修改了 `Grade`。如果我们希望函数按引用传递对象呢？\n\
  \n如果我们希望函数按引用传递对象但又不能修改它，可以使用 `const` 指针：\n\n```cpp\nStudent * FindGrPtr(const Student\
  \ *std);\n```\n\n同样，如果我们希望函数按引用传递对象且不能修改它，可以使用 `const` 引用：\n\n```cpp\nStudent &\
  \ FindGrRef(const Student &std);\n```\n\n`const` 关键字确保指向或引用的对象在函数内部不会被修改。这是一种确保代码安全并防止意外修改的常见做法。\n\
  \n\n\n\n注意，`main()` 函数中的 `cout` 语句和函数 `std.GetGrade()` 返回的是字符类型的指针，正如我们的函数原型声明所示。因此我们使用了解引用运算符\
  \ `*`：`*std.GetGrade()` 或 `*std->GetGrade()`。\n\n## 10.10 静态成员数据\n\n回想我们对封装的定义。它是类将成员数据和成员函数绑定到单一实体中。类对其数据成员定义了访问权限，并享受到数据隐藏、抽象等保护和安全特性的益处。此外，你已经知道成员数据是对象实例特有的。例如，`Student\
  \ Hari` 无法共享 `Student Shiva` 的数据。\n\n如果我们想让一个数据项对类的所有实例都可用，一种方法是将其声明为全局变量。但在那种情况下，我们将失去作为类成员的所有优势，如数据安全、访问权限等。\n\
  \n例如，如果我们想用一个名为 `count` 的变量来跟踪创建的对象数量和删除的对象数量，我们该如何声明这样的变量呢？\n\n如果我们在全局区域声明它，我们将失去在类内部的益处。但如果我们在类内部声明它，它就成了类的一部分，因此属于类的实例，并且不能在对象之间共享。那么变量如何能跟踪创建的对象数量呢？\n\
  \n声明为 `static` 的变量虽然位于类内部，但它可以跟踪被创建或销毁的对象。这意味着它对类的所有实例都是可访问的。我们可以说静态数据属于类而不是属于对象。\n\
  \n```\nclass Student\n{ public:\nStudent(){count++;}\n~Student(){count--;} //默认析构函数\n\
  static int count; // 声明为公共的静态数据成员\n};\n```\n\n因此，为了给类的所有实例提供访问权限，将变量声明为 `static`。它不属于类，且在对象创建时不会随成员数据一起初始化。还要注意，类内部的静态声明不会分配内存资源。因此，静态变量必须在类外全局声明，只有这样才会分配资源。\n\
  \n```\nint Student::count=0; // 必须在全局区域声明\n```\n\n在下例示例中，我们实例化了四个对象，两个在控制括号之外，两个在控制括号之内。我们可以对任何一个对象使用静态变量\
  \ `count` 来获取创建的对象计数：\n\n```\nStudent a,b;\n{ Student ramesh, suresh;\ncout<<”ramesh.count”<<ramesh.count<<”\\\
  t”<<”suresh.count”\n}\n```\n\n变量的生命周期持续到控制括号。因此，当我们在控制括号之后检查计数时，我们得到的 `count` 为\
  \ 2。\n\n**示例 10.15: static1.cpp 用于演示类内静态数据的用法**\n\n```\n#include<iostream>\nusing\
  \ namespace std;\n// 声明一个名为 Student 的类\nclass Student\n{ public:\n     Student(){count++;}\n\
  \     ~Student(){count--;} //默认析构函数\n     static int count; // 声明为公共的静态数据成员\n};\n\
  int Student::count=0; // 必须在全局区域声明\nvoid main()\n{\n{ Student a,b; // 创建了两个对象\n\
  \     Student ramesh, suresh;\n     cout<<”ramesh.count”<<ramesh.count<<”\\t”<<”suresh.count”\n\
  \     <<suresh.count<<endl;\n     cout<<”上述结果显示静态变量对 ramesh & suresh 可用”;\n}\n \
  \    cout<<”\\n 括号之后：”<<endl;\n     cout<<”a.count=”<<a.count<<endl;\n     Student\
  \ w,x,y,z;\n     cout<<”\\n 创建 w x y z ：”<<endl;\n     cout<<”a.count”<<a.count<<”\\\
  t”<<”b.count”<<b.count<<endl;\n}\n/*输出：ramesh.count4 suresh.count4\n上述结果显示静态变量对\
  \ ramesh & suresh 可用\n括号之后：\na.count=2\n创建 w x y z ：\na.count6 b.count6*/\n```\n\
  \n如果将静态数据声明为 `private` 会发生什么？非常简单。到目前为止你一定已经理解了，访问私有数据的唯一方法是通过公共访问器函数。以下是声明为 `private`\
  \ 的静态数据类型的重复代码。\n\n**示例 10.16: static2.cpp 用于演示类内私有静态数据的用法**\n\n```cpp\n#include<iostream>\n\
  using namespace std;\n// 声明一个名为 Student 的类\nclass Student\n {public:\n     Student(){count++;}\n\
  \     ~Student(){count--;} //默认析构函数\n     int GetCount() const { return count;}//\
  \ 访问静态私有数据的公共函数\n     private:\n     static int count; // 声明为私有的静态数据成员\n     };\n\
  \     int Student::count=0; // 必须在全局区域声明\n     void main()\n     { Student a,b;\n\
  \     { Student ramesh, suresh;\n       cout<<”ramesh.count”<<ramesh.GetCount()<<”\\\
  t”<<”suresh.count”\n           <<suresh.GetCount<<endl;\n       cout<<”上述结果显示静态变量对\
  \ ramesh & suresh 可用”;\n     }\n     cout<<”\\n 括号之后：”<<endl;\n     cout<<”a.count=”<<a.GetCount()<<endl;\n\
  \     Student w,x,y,z;\n     cout<<”\\n 创建 w x y z ：”<<endl;\n     cout<<”a.count”<<a.count<<”\\\
  t”<<”b.count”<<b.count<<endl;\n}\n```\n\n如果将静态数据声明为 `private` 会发生什么？非常简单。到目前为止你一定已经理解了，访问私有数据的唯一方法是通过公共访问器函数。以下是声明为\
  \ `private` 的静态数据类型的重复代码。\n\n## 10.11 静态成员函数\n\n声明为 `static` 的数据对类的所有实例可用。这就是为什么在上面的程序可以使用\
  \ `x.GetCount()` 和 `y.GetCount()`。\n\n为了使其独立于对象，我们需要将成员函数定义为 `static`。\n\n```\n\
  static int GetCount() { return count;}// 访问静态私有数据的函数\n```\n\n下一个程序说明了静态函数的概念。\n\n\
  **示例 10.17: static3.cpp 用于演示类内静态成员函数的用法**\n\n```\n#include<iostream>\nusing namespace\
  \ std;\n// 声明一个名为 Student 的类\nclass Student\n{ public:\n     Student(){count++;}\n\
  \     ~Student(){count--;} //默认析构函数\n     static int GetCount() { return count;}//\
  \ 访问静态私有数据的公共函数\n  private:\n     static int count; // 声明为私有的静态数据成员\n     };\n \
  \    int Student::count=0; // 必须在全局区域声明\n     void main()\n     { Student a,b;\n\
  \     { Student ramesh, suresh;\n            cout<<”Student.count”<<Student::GetCount()<<endl;\n\
  }\n     cout<<”\\n 括号之后：”<<endl;\n     cout<<”Student.count=”<<Student::GetCount()<<endl;\n\
  \    Student w,x,y,z;\n    cout<<”\\n 创建 w x y z ：”<<endl;\n    cout<<”Student count\
  \ :”<<Student::GetCount()<<endl;\n }\n/*输出：Student.count4\n括号之后：\nStudent.count=2\n\
  创建 w x y z ：\nStudent count :6*/\n```\n\n## 10.12 总结\n\n1.  我们在 `C++` 中使用 `Class`\
  \ 来定义自己的数据类型。类数据类型可以是不同的数据类型。\n2.  `Object` 是 `class` 类型的变量。\n3.  因此，类允许我们将成员函数和成员数据封装到称为对象的实体中。\n\
  4.  封装是通过类将数据和成员函数绑定到对象中。\n5.  访问权限有 `public`、`private` 和 `protected`。声明为 `public`\
  \ 的成员对所有人可见，而声明为 `private` 的成员仅对类的实例可见。`protected` 成员对都是私有的，但对后代（即继承关系中的派生类）是公开的。\n\
  6.  访问私有成员数据的唯一方法是通过公共访问器函数。\n7.  使用作用域运算符 `::` 在类外定义成员函数。\n\n\n\n\n8. 在类内部声明并定义的成员函数被视为内联函数，尽管没有显式说明。\n\
  \n9. 构造函数和析构函数的名称与类名相同，但它们没有返回类型。\n\n10. 友元函数带有 `friend` 关键字，即使在类内部声明，它也不属于该类。它可以直接访问所有私有数据成员，而无需通过公共访问函数。在类外部定义友元函数时，不需要使用作用域解析运算符，因为友元函数不属于该类。\n\
  \n11. C++ 提供了容器以实现代码的可重用性。包含关系也被称为组合（Composition）或聚合（Aggregation）。组合是一种“拥有（has）”类型的关系。\n\
  \n12. 对象和数据成员可以使用 `new` 运算符在堆内存上分配空间，并使用 `delete` 运算符释放。使用间接运算符 `->` 访问堆上的成员。\n\n\
  13. `this` 指针是一个传递给函数的隐藏指针。它之所以被称为 `this` 指针，因为它指向调用该函数的对象。\n\n14. 常量指针和常量对象用于确保数据的安全性和完整性。常量指针只能调用常量函数。\n\
  \n15. 对象通过引用传递，可以通过引用或指针进行传递。\n\n16. 使用 `const` 对象且不涉及重新赋值时，使用易用且优雅的引用方法比使用指向常量对象的\
  \ `const` 指针更好。\n\n17. 静态成员数据虽然位于类内部，但不属于类。它对类的所有实例都可用。必须在全局区域定义静态成员数据，以便分配内存资源。\n\
  \n18. 为了使成员函数的调用独立于对象，我们需要将处理静态数据的公共函数声明为静态函数。\n\n## 练习题\n\n### 单选题\n\n1. 构造函数在任何情况下会被调用\n\
