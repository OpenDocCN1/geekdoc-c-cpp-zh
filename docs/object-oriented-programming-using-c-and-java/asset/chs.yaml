  17. d\n18. False\n19. True\n20. True\n21. False\n\n## 10\n## 类\n\n##### 学习目标\n\n\
  *在本章结束时，你将能够：*\n\n* 使用类和对象编写 C++ 程序。\n* 理解构造函数、析构函数、成员数据和成员成员的概念。\n* 理解容器类及其用法。\n\
  * 理解友元函数和内联函数。\n* 理解对象以及结合指针和引用的动态内存使用。\n* 理解 `this` 运算符、静态声明及其用法。\n\n## 10.1 引言\n\
  \n我们在 C++ 中使用 `class` 来定义我们自己的数据类型。`class` 是一种派生数据类型，类似于数组。区别在于，数组中你只有一种数据类型，而在类中，数据类型可以包含不同的数据类型。这些不同的数据类型可以是**内建数据类型**（如\
  \ `int`、`float` 等），也可以是**派生或用户定义的数据类型**、**函数**或运算符。\n\n`Object`（对象）包含了由 `class`\
  \ 定义的数据类型、函数和/或运算符。因此，我们可以把 `object` 视为 `class` 的一个实例。换句话说，`object` 是数据类型为 `class`\
  \ 的变量。我们可以将对象定义为一个独立的实体，它持有自己的数据和成员函数。我们可以说，对象告诉我们它所持有的数据以及在对象上允许进行的操作。**因此，类允许我们将成员函数和成员数据封装到一个名为“对象”的单一实体中。**\n\
  \n面向对象编程涉及编写使用类的程序。我们创建不同类的对象来解决当前问题，并通过成员函数 string（此处此处应为成员函数）让对象之间进行相互通信。在本章中，我们将学习如何使用类和对象来解决问题。我们还将涵盖数据隐藏、抽象以及类成员享有的访问权限等主题。\n\
  \n本章引入了构造函数和析构函数的概念。讨论了成员函数的变体，如友元函数和内联函数。引入了类内部的类，称为容器类。重点介绍了使用指针和引用通过对象使用动态内存的不同方法，及其优缺点。解释了\
  \ `this` 运算符、静态成员函数及其相关性与用法。\n\n#### 10.2 类和对象\n\n环顾你的教室。到处都是学生。首先，为什么他们会被你的校长分在一起呢？首先，因为他们有**共同的兴趣**，例如他们都想学习\
  \ C++ 语言，或者他们想完成本科或研究生学业。在计算机术语中，我们可以说所有学生具有相同的功能。这就是为什么他们可以分在一起。图 10.1 显示了成员函数和成员数据。\n\
  \n![类成员函数和属性](img/212-1.png)\n\n**图 10.1** 类成员函数和属性\n\n但注意每个学生都有自己的个人属性。属性意味着成员数据，如身高、体重、出勤情况等。同样注意班级大约有\
  \ 60 名具有相同功能的学生。我们可以称之为该类的 60 个对象实例。**类**：对象的集合。我们也可以将其定义为实例的数组。但类可以拥有成员函数和成员数据。在这里，与数组不同，类可以拥有不同的数据类型作为其元素。\n\
  \n**对象:** 一个实体。也就是说，它是可以感知和看到的。例子有学生、笔、椅子等。因此，对象是一个拥有自己的数据和成员函数的独立实体。\n\n**数据隐藏/数据抽象**。习惯上是将所有成员数据声明为私有（private）。但声明为私有的数据是隐藏的，无法被任何人访问。这种特征被称为数据隐藏或数据抽象。但我们如何获取它们呢？你只能通过公共成员函数访问它们。没有其他方法。这就像大学图书馆的首席管理员如果不使用图书馆提供的访问卡，就无法将书籍带回家。\n\
  \n**公共 (public)**：声明为公共的成员函数和数据（如果有）可以在类成员进行访问。\n\n**私有 (private)**：声明为 **private**\
  \ 的成员数据只能在类成员函数内部访问，数据对外部隐藏。\n\n**受保护 (protected)**：声明为 **protected** 的成员数据和成员函数对外部是私有的，但对于**继承**关系中的类后代是公开的。你将在继承章节中学习更多内容。\n\
  \n**封装**：通过类将私有、公共等访问标识符的成员函数和成员数据绑定到对象中，这种行为被称为**封装**。\n\n**声明类**：使用关键字 `class`\
  \ 后接大括号。在大括号内部我们可以包含如下所示的成员数据成员函数：\n\n**示例 10.1: 类声明**\n\n```cpp\nclass Student\n\
  { // 构造函数和成员函数\n  public:\n      Student(){rollNo=50595,name=”Anand”;}\n      ~Student(){};\
  \ // 默认析构函数\n      int GetRollNo() const { return rollNo;}\n      void SetRollNo\
  \ ( int n) { rollNo=n;}\n  // 成员数据\n  private:\n      int rollNo;\n};\n```\n\n###\
  \ 10.2.1 如何为类创建对象？\n\n\n\n\n\n记住，对象是类的变量。因此，你可以像定义数据类型的变量一样定义对象。在接下来的示例中，我们创建了一个名为\
  \ `std` 的普通对象和 50 个 `Student` 类的实例，以及一个在堆内存（Heap memory）上创建 `Student` 实例的指针。\n\n\
  ### 示例 10.2：类对象的创建\n\n```\nStudent std; // std 是 Student 类的一个对象\nStudent std[50];\
  \ // 为 Student 类创建了 50 个实例\nStudent *ptr = new Student;// //在空闲存储器（free store）上创建了对象\n\
  ```\n\n### 10.2.2 如何访问成员数据和成员函数？\n\n一旦创建了类的对象，我们就可以使用点运算符`(.)` 来访问类的成员函数和公共成员数据。我们已经学习过，在\
  \ `C++` 中成员数据被声明为 `private` 以实现数据隐藏和抽象。因此，为了访问这些私有成员数据，我们需要定义公共成员函数。我们称它们为公共访问函数（public\
  \ accessory functions）。从我们的生活中举个例子，你可能观察到，只有持有借卡才能借阅图书馆里的书籍。主图书管理员也是如此；尽管他是书籍的保管者，但他也需要借卡才能将书籍带回家。\n\
  \n### 示例 10.3：访问成员函数和成员数据\n\n```\nStudent Std: // 创建了对象\nStd.SetRollNo(8345); //\
  \ 将学号设置为 8345\ncout<<Std.GetRollNo(); // 显示学号\n```\n\n在下一个示例中，我们将通过一个名为 `Polar`\
  \ 的类声明来展示目前讨论过的所有概念。在这个程序中，你将学习类和对象的概念、公共访问函数等。我们将考虑的类是笛卡尔形式的 `vector`，由实数 `a` 和虚部分量\
  \ `b` 表示。在极坐标系中，相同的内容可以用幅为 `r` 的向量表示，其由公式 `r = √ ( a² **+ b² ** )` 给出，方向由 `θ = tan`^−`(\
  \ b / a )` 给出。\n\n我们的程序将通过名为 `GetData()` 的公共访问函数接受实值 `a` 和虚部分量 `b`，通过名为 `ConvertToPolar()`\
  \ 的公共访问函数将其转换为具有值 `r` 和角度 `θ` 的极坐标形式，并通过名为 `DisplayPolar()` 的函数显示结果。关于我们将如何声明和定义函数，简单几句话。如果要实现的函数代码很大，那么我们会在类内部声明原型，如下：\n\
  \n```\n void ConvertToPolar(); // 转换为极坐标形式并在类外部定义函数代码如下所示：\nvoid Polar::ConvertToPolar()\n\
  { double x=0.0;\n  r=sqrt(a*a + b*b);\n  x=atan(b/a); // x 是弧度\n  t= (7.0/22.0)*180.0*x;\
  \ // 转换为角度 .PI 弧度 180 度\n}\n```\n\n注意，我们使用了名为 `::` 的运算符（作用域解析运算符），来告诉编译器与类内部声明的函数原型链接。假设实现的函数只有一行或两行；那么我们可以像在第\
  \ 3 章中解释的那样将其声明为内联函数（inline function）。\n\n```\n inline double GetMag() const { return\
  \ r ;}\n```\n\n还有一种更简单的选项，如我们所示，将代码包含在类定义本身：`double GetMag() const { return r;}`。然后编译器会自动将该函数视为内联函数。\n\
