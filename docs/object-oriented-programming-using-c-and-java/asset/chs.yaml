  \   …………………………………………………\n   </body>\n   </html>\n```\n\n#### 22.4.1 URL 连接\n\n通过\
  \ `URL` 类我们可以导入网站的内容，但在导入之前无法详细检查内容。`URLConnection` 是一个允许我们在传输之前检查属性的类。`URL connection`\
