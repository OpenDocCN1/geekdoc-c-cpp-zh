  \ a\n11. True\n12. False\n\n# 15\n# Java 面向对象编程\n\n#### 学习目标\n在本章结束时，你应该能够理解：\n\
  * 下载并安装运行程序所需的 JDK。\n* 设置环境变量。\n* 理解运行 Java 程序所涉及的过程。\n* 运行 Java 独立程序。\n* 运行带有 Java\
  \ Swing 组件的 Java Applet。\n* 使用工业标准的 Eclipse 开发工具。\n\n#### 15.1 介绍\nJava 专专为互联网而设计的。Java\
  \ 有许多特性非常适合作为网络语言。C 和 C++ 是经过证明有效的结构化和面向对象的语言，但它们并不是为网络和互联网构建的。Java 是一门纯的面向对象语言，我们可以在不使用对象的情况下用\
  \ Java 编程。\n\n在本章中，我们将介绍万维网，并讨论使 Java 语言最适合网络化的方面。我们将简要介绍 Java 的面向对象特性，并详细讨论与平台无关的特性。我们还特意提供了方法示例，以便你熟悉编程环境。\n\
  \n## 15.2 互联网与万维网\nJava 是作为一种网络语言专门创建的。与 Java 编程有两个密切相关的术语：互联网（Internet）和万维网（WWW）。它们并不是同义词，也不是一个东西。\n\
  \n首先，`网络` 是同构或异构的计算机集合。\n\n`互联网` 是网络中的集合或分组。我们可以说互联网是网络的网络，由数百万台计算机组成。\n\n`协议` 是计算机通信的规则。其中一种流行的协议是\
  \ `HTTP`（超文本传输协议），它被广泛使用。`FTP`（文件传输协议）也是另一种广泛使用的协议。\n\n`万维网 (WWW)` 是访问互联网上信息的一种。它使用\
  \ `HTTP` 在通信计算机之间交换数据。`www` 提供的服务使用 浏览器，如 `Internet Explorer (IE)`、`Firefox` 和 `Google\
  \ Chrome` 等。\n\n#### 15.3 C 和 C++ 已经存在 —— 为什么还需要 Java？\nC 是一种结构化、面向过程的强大语言，用于系统编程，如操作系统、编译器、数据库程序等。C\
  \ 最初是为 UNIX 操作系统设计的语言。C++ 开发为一种面向对象的编程语言，具有非常良好的重用性特性，如继承等。然而，这两种语言都不是为了配合互联网而设计的。C\
  \ 和 C++ 都是依赖机器的。这意味着程序将在具有与原始编写程序时相同的硬件和操作系统的计算机上运行。换句话说，C 和 C++ 程序缺乏更广泛的可移植性。\n\
  \n\n\n\n\n另一方面，Java 专为与互联网协作而设计。互联网通过 `www` 连接了异构计算机。因此，Java 被设计成与平台无关的。这意味着它独立于硬件和操作系统。关于\
  \ Java 语言有一句流行的话：在此处编写，随处执行！太阳微系统（Sun Micro Systems）确实将“一次编写，到处运行 (WORA)”作为其口号。\n\
  \n## 15.4 Java 故事\n\nJava 语言的发者 James Gosling 和 Patric Naughton 最初在寻找设计一种可以适用于任何机顶盒的通用遥控器。他们希望它是一个“虚拟机”，能够真正独立于机器（机顶盒）。后来，他们添加了高级功能并将其命名为“oak（橡树）”。它在一段时间内被称为“Green（绿色）”，最终定名为“Java”。Gosling\
  \ 的想法是构建一个虚拟机和一种语言，使其作为一种具有已流行的 C++ 语言语法特征的真正机器无关语言来运行。Java 发明者设想的设计目标是：\n\n* 它应该是简单、面向对象且易于理解的。\n\
  * 它应该是健壮且安全的。\n* 它应该是架构中立且可移植的。\n* 它应该能够高性能执行。\n* 它应该是解释执行的、多线程的和动态的。\n\n太阳微系统于\
  \ 1995 年发布了 Java 1.0。所有的主要的浏览器都集成并支持 Java 1.0。凭借其丰富的平台无关性和易于编程的特性，Java 很快变得流行。J2SE\
  \ 1.2 于 1998–1999 年发布，以适应不同的平台。J2EE 满足企业版的需求，J2ME 满足移动计算的需求。自 2006 年以来，Java 根据其提供的服务分段被称为三个名称，即\
  \ Java SE（标准版）、JavaEE 和 JavaME。\n\n## 15.5 Java 特性\n\n### 15.5.1 可移植性或平台无关性\n\n\
  依赖机器的语言（如 `C` 和 `C++`）使用编译器产生目标代码，这些代码高度依赖机器/硬件和操作系统；而用 Java 编写的程序可以在任何其他硬件或操作系统上无需任何修改即可直接运行。为了实现这一特性，Java\
  \ 使用了“字节码 (byte code)”和虚拟机。\n\n字节码由针对宿主硬件的虚拟机 (`VM`) 解释执行。用户需要安装 `JRE`（Java 运行环境）以及\
  \ `JDK` 来运行 Java 应用程序。浏览器中的 `JRE` 用于执行 Java Applet。获取所有重要的机器无关性和可移植性的代价是什么？速度。与编译过程相比，解释执行很慢。为了提高速度，引入了即时编译器\
  \ (`JIT compilers`)，将字节码转换为机器码。太阳微系统分发的 `JDK` 是 Java 编译器、`Javadoc` 和调试器的超集。\n\n\
  ### 15.5.2 自动垃圾回收\n\n与 `C++` 中程序必须手动跟踪使用后对象的释放不同，Java 对不再需要的对象采用自动内存释放。Java 使用自动垃圾回收器管理内存。什么是自动垃圾回收器？垃圾回收器是在后台运行的软件程序，负责收集并清理被死对象占用的内存空间。它遵循预定义的算法来决定哪些对象没有剩余引用（即它们不再被引用），并自动释放内存。这一过程会在程序空闲或堆上没有足够的可用内存供释放时发生。\n\
  \n### 15.5.3 面向对象的特性\n\n关于面向对象特性的详细介绍，我们强烈建议读者访问第 1 章、第 2 章和第 3 章。后续章节将提供相关概念的要概述。\n\
  \n#### 15.5.3.1 类和对象\n\n面向对象编程是一种创建协作对象并相互通信以完成所需任务的方法。Java 是一种纯面向对象的语言。没有类就无法编写\
  \ Java 程序。事实上，程序存在于类中。Java 程序使用对象和类。当我们引用名为 `Student`（学生）的对象时，我们指的是它的属性（状态）和行为。属性也称为对象的\
  \ `state`。\n\n**类**：对象的集合。我们也可以将其定义为实例对象的数组。但类可以拥有成员函数和成员数据。与数组不同，类可以拥有不同数据类型作为其元素。类定义了对象的抽象特性，包括属性和行为。名为\
  \ `Student` 的类可以被视为一个生产 `Object Student` 实例的工厂，这些实例具有不同的属性（即个人数据）和共同的功能（即公共函数）。类提供的属性和函数被称为成员数据和成员函数。在\
  \ Java 中，成员函数被称为方法 (methods)。类允许我们把成员函数和成员数据封装到一个名为对象的单一实体中。图 15.1 显示了学生类的对象。\n\n\
  ![Student objects](img/336-1.png)\n\n**图 15.1 |** 学生对象\n\n**对象 – 封装：**在像 Java 这样的面向对象编程中，它是数据优先的语言，即数据很重要，而函数不重要。根据内存映射，数据存储在栈、空闲空间等数据区域，函数存储在代码区域，因此需要对函数对数据的访问进行严格的控制。Java\
  \ 通过使用封装特性实现了这种控制。*封装是将成员数据和调用函数与安全分级结合在一起，确保不会发生对数据的未经授权的访问*。Java 依赖访问修饰符来维护数据的完整性。安全访问修饰符有\
  \ `public`、`private`、`protected` 和 `default`（默认）。\n\n**public**：任何声明为 `public` 的成员函数数据可以在类外部访问。\n\
  \n**private**：声明为 `private` 的成员数据只能在类成员函数内部访问，并对外部隐藏。\n\n**protected**：声明为 `protected`\
  \ 的成员数据和成员函数对外部私有，但对继承关系中的类后代类可见。你将在 `C++` 的继承章节以及随后的 Java 章节中学习更多。\n\n**package（默认）**：你可以从同一目录下的任何其他类访问它。封装现在可以定义为“将成员函数和成员数据结合\
  \ private、public、protected、package 等访问修饰符通过类封装到对象中。”\n\n#### 15.5.3.2 方法\n\n在 Java\
  \ 中，类成员函数被称为方法 (Methods)。方法只是为了实现结果而编写的代码。语法如下：\n\n![image](img/337-1.png)\n\n**参数**：参数的数量和类型称为参数\
  \ (arguments)。参数也称为形式参数 (formal parameters)。\n\n**签名**：名称和参数合方法的签名。方法将有一个返回类型，它位于签名之外。在方法内部定义的变量称为局部变量，在方法外部任何地方都不可用。可以通过向对象发送消息来执行方法。消息包括：对象的引用、一个点\
  \ (.)、方法名和实际参数 (arguments)。实际参数的值被复制到形式参数中，方法执行后，返回值替换消息。所有的局部值都会丢失。\n\n#### 15.5.3.3\
  \ 多态\n\n\n\n\n\n多态意味着一个方法可以根据用户的需求执行许多不同的任务。这是面向对象编程最强大的特征之一。多态有两种类型：重载（Overloading）和重写（Overriding）。重载意味着同名但不同的签名（参数的数量和类型）。当发送消息时，系统会比较签名并加载最匹配的方法。这发生在运行时。\n\
  \n`Overriding` 是一种发生在继承中的现象。重写通常用于使方法更具特殊性。假设基类和派生自基类的类都声明了具有相同签名的相同方法；那么当向对象发送消息时，将加载派生类的方法。\n\
  \n### 15.5.3.4 扩展/派生新类\n\n我们可以基于现有的类派生新类。这可以通过 Java 提供的继承和包含属性来实现。继承允许后代类访问声明为 `protected`\
  \ 的成员数据和成员函数。\n\n### 15.5.3.5 内部类\n\n`类中的类 – 内部类（Inner Class）`。内部类是 Java 实现代码复用的技术之一。内部类意味着包含另一个类或多个类的类。内部类不能被声明为\
  \ `static`。\n\n### 15.5.3.6 继承与类层次结构\n\n代码复用是 Java 设计者做出的强大承诺之一，而继承是 Java 选择的实现复用承诺的工具。继承的概念对我们来说并不陌生。我们从父母那里继承财产、名誉和名字。同样，我们的后代也将从我们这里继承这些品质。学习图\
  \ 15.2 所示的继承类层次结构。人类和动物从生物获得特质。专业人士、学生和运动员派生自人类。我们说这三个类别继承自人类。`Human` 类被称为基类，`Student`\
  \ 和 `Athlete` 称为派生类。什么可以被继承？成员函数和成员数据都可以被继承。\n\n![Inheritance hierarchy](img/338-1.png)\n\
  \n**图 15.2** 继承层次结构\n\n你注意到指示继承关系的箭头方向了吗？根据建模语言规范，它是指向向上的。\n\n继承指定了 `is`（是）类型的关系。观察发现一个\
  \ `Student` 是一个 `Human`。同样，`Mammal`（哺乳动物）是 `Animal`（动物）。`Human` 是一个 `superclass`（超类），`Student`\
  \ 是一个 `derived class`（派生类）。自基类是实现 `is` 类型关系的技术。超类可以有多个派生类。\n\n我们何时使用继承？继承是为了从基类派生所有的功能和成员数据，派生类可以添加自己的专门或个性化功能。例如，`Athlete`\
  \ 继承了 `Human` 的所有功能和属性，并额外添加了自己的运动和竞技功能及属性。\n\n继承是程序员手中一种强大的工具，用于从现有类定义新类。\n\n###\
  \ 15.5.3.7 类作为抽象数据类型 (ADT)\n\n类也可以称为 `Abstract Data Type (ADT)`。请参考图 15.3。\n\n![Hierarchical\
  \ inheritance](img/338-2.png)\n\n**图 15.3** 层次级继承\n\n层级继承是一个多个类派生自单个超类的过程。这创建了一个树形结构，超类位于根节点，派生类是分支。每个派生类继承超类的特征，但也可以添加自己的特征。\n\
  \n### 15.5.3.8 Java 中的泛型编程\n\n泛型编程是 Java 提供的一种用于实现代码复用的机制。泛型可以应用于类和方法。类模板对于实现不同类型代码的复非常有非常有。难怪\
  \ Java 如此高度地依赖泛型编程。泛型编程对类型进行抽象非常有用。例如，Java 的容器类型（展示了 Java 的集合层次结构）对于实现程序设计中经常使用的数据结构（如链表、队列、栈、搜索和排序等）非常有用。简而言之，泛型编程提高了程序员的生产力。\n\
  \n### 15.5.4 易于学习和卓越的文档\n\n由于 Java 消除了指针、运算符重载、多重继承等，对于程序员来说相对容易学习。它遵循 C 和 C++ 语法，这些语法在程序员中已经流行并在工业界广泛使用。此外，Java\
  \ 还提供了 .html 格式的优秀行内文档（称为 APIs），为程序员提供即时帮助。为此，Java 提供了三种注释语句。包含注释是为了增强程序的可读性。Java\
  \ 允许单行注释语句和多行注释语句，就像 C 和 C++ 一样。\n\n- **单行注释**。这些注释行以双斜杠 `//` 开头。\n\n  例：`// HelloWorld.java`，一个打印文本行的\
  \ Java 程序。\n\n- **多行注释**：当注释超出单行时使用这些注释行。它们以 `/*` 开头并以 `*/` 结束。\n\n  例：`/* Inheritance.java\
  \ :介绍了继承概念和 Java 的其他相关复用特性 */`\n\n- **Java API 文档注释**：这些注释用于描述 Java 程序的特性。Java 文档功能取决于\
  \ .html 格式并产生 .html 文件，我们需要使用这些文档注释。它们以 `/**` 开头并以 `*/` 结束。\n\n  例：`/** 显示扩展特性的类定义\
  \ 计算学生成绩的方法 */`\n\n这些 .html 文件被称为 APIs（应用程序接口）。为了生成这些 APIs，我们需要使用 Javadoc 编译器。在第\
  \ 15.5.4 节的示例 15.1 中，我们展示了为 Java 源程序生成 API 文档的步骤。\n\n### 15.5.5 字节码\n\n\n\n\n字节码（Byte\
  \ code）是一种单字节（8 位）的指令集。字节码通常可以直接在虚拟机（即解释器）上执行，也可以被进一步编译成机器码以获得更好的性能。使用这些字节码是因为它们减少了对硬件和操作系统的依赖。字节码是紧凑的数值代码和引用（通常是数值地址），它们编码了解析和语义分析的结果，因此比直接读取源代码性能要高得多。字节码程序可以由字节码解释器直接解析并逐条执行指令。这些代码是可移植的代码。在经过解析和语义分析后，需要重复执行的代码部分等会被交给即时编译器（`JIT\
  \ Compiler`），在运行时将字节码翻译成机器码。因此，`JVM` 本身不可移植的，但字节码是完全可移植的。由于性能优势，Java 语言的实现分两个阶段执行程序：首先将源代码编译成字节码，然后将字节码传递给虚拟机。因此，有了适用于\
  \ Java 的虚拟机。\n\n## 15.5.6 Java 虚拟机 (JVM)\n\n`JVM` 特定于特定的硬件和操作系统。每个 `JVM` 将包含以下组件：\n\
  \n* `Class Loader Mechanism`（类加载机制）用于加载类文件和接口。\n* `Execution Engine`（执行引擎）用于执行类文件中包含的指令。\n\
  * `Run-time data areas`（运行时数据区域）用于存储类文件、形式和实际参数、返回值等。\n* 每个 Java 虚拟机实例都有一个 `method\
  \ area`和一个 `heap`（堆）。这些 `run-time data areas` 由虚拟机内部运行的所有线程共享。所有实例化的对象都存储在堆区域。\n\
  * `Java Stack`（Java 栈）由多个栈帧组成。Java 为每个 Java 线程分配独立的栈帧（目前这只是一个新任务）。\n* 当新线程生效时，会被分配一个\
  \ `Program Counter (PC)`（程序计数器）和自己的 `Java Stack` 区域。`PC` 存储下一条指令的地址，`Java Stack`\
  \ 存储被调用的 `Java Methods` 的状态。Java 方法调用的状态包括局部变量、调用时的参数、返回值和中间计算结果。当线程调用方法时，Java 虚拟机在该线程的\
  \ Java 栈上推入新帧。当方法完成时，虚拟机弹出并丢弃该方法的帧。\n* `Native Stack`（原生栈）区域依赖于机器，并跟踪原生方法的调用。\n\
  * 这些区域对于所属线程是私有的。任何线程无法访问另一个线程的 `pc` 寄存器或 `Java stack`。\n\n图 15.4 提供了 Java 开发环境的细节。图\
  \ 15.5 描述了上述的架构。图 15.6 给出了运行时共享数据区域的细节。\n\n![Java 开发环境](img/341-1.png)\n\n**图 15.4**\
  \ Java 开发环境\n\n![JVM 架构](img/341-2.png)\n\n**图 15.5** JVM 架构\n\n![共享和私有数据区域。MethodArea\
  \ 和堆由所有线程共享。Java Stack 和 PC 是每个线程独有的，如阴影框所示](img/341-3.png)\n\n**图 15.6** 共享和私有数据区域。`MethodArea`\
  \ 和 `heap` 由所有线程共享。`Java Stack`、`PC` 是每个线程独有的，如阴影框所示\n\n### 15.5.7 与 C++ 的比较\n\n\
  C++ 和 Java 之间的主要差异总结在 表 15.1 中。\n\n**表 15.1** C++ 和 Java 的区别\n\n| C++ | Java |\n\
  | --- | --- |\n| C++ 不是纯的面向对象语言。可以编写不使用类的 C++ 程序 | Java 是纯的面向对象编程语言。Java 程序是类的集合\
  \ |\n| C++ 支持指针 | Java 不支持 C/C++ 风格的指针 |\n| C++ 原生数据类型是对象 | 原生类型不是对象 |\n| 在 C++\
  \ 中，当对象不再需要时，程序员必须释放对象占用的堆内存 | Java 垃圾回收器自动释放不再被引用的对象的堆内存 |\n| C++ 支持运算符重载 | Java\
  \ 不支持运算符重载 |\n| C++ 支持多重继承 | Java 不支持多重继承 |\n| 有构造函数和析构函数 | Java 只支持构造函数。垃圾回收器负责释放不再需要的对象\
  \ |\n| C++ 支持两种注释样式：用双斜杠（//）标记的单行样式，以及用斜杠星号（/*）开启并星号斜杠（*/)结束的多行样式 | 有三种不同的注释样式：用双斜杠（//）标记的单行样式，用斜杠星号（/*）开启并星号斜杠（*/)结束的多行样式，以及用斜杠双星号（/**）开启并星号斜杠（*/)结束的\
  \ Javadoc 注释样式 |\n| 写一次，到处编译 (WOCA) | 写一次，到处运行 (WORA / WORE) |\n| 允许直接调用原生系统库 |\
  \ 通过 Java Native Interface (Java 原生接口) 以及最近的 Java Native Access 调用 |\n| 暴露底层系统设施\
  \ | 在受保护的虚拟机环境中运行 |\n| C++ 支持原生无符号运算 | Java 不支持原生无符号运算 |\n| 指针、引用和按值传递 | 原生类型始终按值传递。对象按引用传递\
  \ |\n| 支持类、结构体和联合体并可分配在堆或栈上 | Java 只支持类并将其分配到堆内存 |\n| C++ 支持内联文档 | Java 有 Javadoc\
  \ 支持 |\n| C++ 支持函数指针和函数对象 | 没有函数指针。Java 使用接口和监听器实现相同目的 |\n| C++ 支持 const 关键字 | Java\
  \ 支持 final，针对原生类型的限制版本 |\n\n## 15.6 开发第一个应用程序\n\n### 15.6.1 安装和使用 Java 开发包\n\n我们将使用\
