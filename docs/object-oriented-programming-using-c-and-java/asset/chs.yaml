  \ |\n\n## 11.6 运算符重载\n\n预定义的运算符如 `+`、`*` 等由编译器定义并提供，用于处理内建（基本）数据类型如 `int`、`char`、`double`。我们在讨论函数重载概念时也详细讨论过，如果一个函数可以执行多个任务，我们就可以视为重载，这是利用主内存等稀缺资源的一种高效方式。\n\
  \n如果我们能让这些预定义运算符作用于用户定义的数据类型（如类），我们就称之为运算符重载。例如，考虑一个预定义的运算符 `+` 以及它的标准操作：\n\n```cpp\n\
  int x=10, y=20;\nint z = x + y ; // x 和 y 的内容相加并放入 z\n```\n\n现在考虑极坐标表示的复数：\n\n```cpp\n\
  Polar v1(25.0,53.50); // 模和角度 theta\nPolar v2(5.0, 45.00);\nPolar v3;\n```\n\n###\
  \ 11.6.1 + 运算符和 * 运算符的重载\n\n运算符重载意味着我们可以写 `v3 = v1 + v2`。在这种情况下，编译器会做什么？正是我们在运算符重载函数定义告诉它做的：\n\
  \n- 将极坐标向量转换为直角坐标 `r cos t + j sin t`。\n- 将 `v1` 和 `v2` 的实部相加并放入 `v3`。\n- 将 `v1`\
  \ 和 `v2` 的虚部相加并放入 `v3`。\n- 将结果 `v3` 转换为极坐标。\n\n对于乘法：\n\n- 将两者转换为极坐标。\n- 相乘 `polar1`\
  \ 和 `polar2` 的模以得到结果模。\n- 相加 `polar1` 和 `polar2` 的角度以得到结果 theta。\n- 声明结果模和结果 theta\
  \ 作为乘法的结果。\n\n让我们在下一个问题尝试这个有趣的问题。在这个程序中，我们将展示如何重载运算符 `+` 和 `*`，以便对对象 `v1` 和 `v2`\
  \ 进行操作，使我们可以写：\n\n```cpp\nv3=v1+v2; \nv3=v1*v2;\n```\n\n\n\n\n\n```cpp\n#include<iostream>\n\
  #include<cmath>\nusing namespace std;\nclass Polar\n{\n// 公共辅助函数\npublic:\n  Polar(){r=0.0;t=0.0;a=0.0;b=0.0;}\n\
  \  Polar(double x, double y){a=x;b=y;r=0.0;t=0.0;}\n  double GetA() const{return\
  \ a;}\n  double GetB() const {return b;}\n  double GetR() const{return r;}\n  double\
  \ GetT() const {return t;}\n  void ConvertToPolar(); // 转换为极坐标形式\n  void ConvertToCartesian();\
  \ // 转换为直角坐标形式\n  friend void DisplayPolar(const Polar &v); // 以极坐标形式显示\n  friend\
  \ void DisplayCartesian(const Polar &v);\n  Polar operator+(const Polar &v1);\n\
  \  Polar operator*(const Polar &v1);\nprivate:\n  double r; // 模\n  double t; //\
  \ 角度 theta\n  double a; // 实部\n  double b; // 虚部\n};\nvoid Polar::ConvertToPolar()\n\
  { double x=0.0;\n  r=sqrt(a*a + b*b);\n  x=atan(b/a);\n  t= (7.0/22.0)*180.0*x;\
  \ // PI 弧度等于 180 度\n}\nvoid Polar::ConvertToCartesian()\n{ double x=0.0;\n     \
  \ x=atan(b/a);\n      a=r*cos(x);\n      b=r*sin(x);\n}\nPolar Polar::operator+\
  \ (const Polar &v)\n{ Polar v3(a+v.GetA(),b+v.GetB()); return v3;}\nPolar Polar::operator*\
  \ (const Polar &v)\n{ Polar v3;\n  float x=0.0;\n  v3.r=r*v.GetR();\n  v3.t=t+v.GetT();\n\
  \  x = t*(7.0/22.0)*180;\n  v3.a=r*cos(x);\n  v3.b=r*sin(x);\n  return v3;\n}\n\
  void DisplayCartesian(const Polar & v)\n{ cout<< \"\\n 直角坐标向量：实部 = \"<<<<v.a<<\"\
  \ 虚部 =\"<<<<v.b<<endl; }\nvoid DisplayPolar(const Polar & v)\n{ cout<< \"\\n 极坐标向量等：模\
  \ = \"<<<<v.r<<\" 角度 =\" <<v.t<<endl;\n}\nvoid main()\n{ Polar v1(3.0,4.0),v2(3.0,4.0),v3\
  \ ,v4;\n  cout<<\"\\n 给定的向量 V1 :\";\n  DisplayCartesian(v1);\n  cout<<\"\\n 给定的向量\
  \ V2 :\";\n  DisplayCartesian(v2);\n  v3=v1+v2;\n  cout<<\"\\n v1 + v2 之后：运算符重载..\"\
  <<endl;\n  DisplayCartesian(v3);\n  v1.ConvertToPolar();\n  v2.ConvertToPolar();\n\
  \  DisplayPolar(v1);\n  DisplayPolar(v2);\n  v4=v1*v2;\n  cout<<\"\\n v1 * v2 之后：运算符重载.\"\
  \ <<endl;\n  DisplayPolar(v4);\n}\n```\n\n/* 给定的向量 V1：直角坐标向量：实部 = 3 虚部 = 4\n给定的向量\
  \ V2：直角坐标向量：实部 = 3 虚部 = 4\nv1 + v2 之后：运算符重载..\n直角坐标向量：实部 = 6 虚部 = 8\n极坐标向量等：模 =\
  \ 5 角度 =53.1087\n极坐标向量等：模 = 5 角度 =53.1087\nv1 * v2 之后：运算符重载..\n极坐标向量等：模 = 25 角度\
  \ =106.217*/\n```\n\n#### 11.6.2 运算符 `<<` 重载\n\n我们可以编写单独的函数显示对象对象如下所示（通过 `DisplayPolar()`\
  \ 函数），但这样做很繁琐。相反，我们能简单地写 `cout<<v3` 并期望相同的结果吗？运算符 `<<` 重载可以实现这一结果。\n\n**示例 11.7:\
  \ opcout.cpp 展示 `<<` 运算符重载**\n\n```cpp\n#include<iostream>\n#include<cmath> // 用于数学相关的函数如\
  \ sqrt,cos, tan, tan- 等\nusing namespace std;\n// Polar 类的声明\nclass Polar\n{\n public:\
  \ Polar():r(0.0),t(0.0){} // 默认构造函数\n  Polar(double f , double g):r(f),t(g){} //\
  \ 构造函数\n  ~Polar(){} // 析构函数\n  Polar operator*(const Polar &v1);\n  void Display(ostream\
  \ & src) const\n  { src<<<<\"模 = \"<<r<<\"\\t 角度 theta = \"<<t<<endl;}\n  double\
  \ GetR() const{return r;}\n  double GetT() const {return t;}\n private:double r;\
  \ t; // 模 & 角度 theta\n};\nostream & operator<<(ostream &src, const Polar v){ v.Display(src);}\n\
  Polar Polar::operator* (const Polar &v)\n{ Polar v3;\n  float x=0.0;\n  v3.r=r*v.GetR();\n\
  \  v3.t=t+v.GetT();\n  return v3;\n}\nvoid main()\n{ Polar v1(3.0,4.0),v2(3.0,4.0),v3;\n\
  \  cout << \"\\n 1：\";\n  cout << v1 << endl;\n  cout << \"\\n 1 向量 v2：\";\n  cout\
  \ << v2 << endl;\n  cout << \"\\n v1 + v2 \";\";cout << v3 << endl;\n  v3 = v1 <<\
  \ v2;\n  cout << \"\\n 赋值运算符：\";\n\n\n << << <<\n;\n}\n\n#### 11.6.3 不可以重载的运算符\n\
  \nC++ 中不能重载以下运算符：\n\n- 成员访问运算符 `.`\n- 解引用运算符 `*`\n- 条件运算符 `?`\n- 作用域运算符 `::`\n\n\
  #### 11.6.4 赋值运算符重载\n\n现在我们理解赋值运算符的含义。如果重载赋值运算符，我们可以像这样写 `x = y = 3`。\n\n```cpp\n\
  class Polar\n{\n private:\n  double r, t;\n public:\n  Polar() : r(0.0), t(0.0)\
  \ {}\n  Polar(double f, double g) : r(f), t(g) {}\n  Polar& operator=(const Polar\
  \ &src)\n  {\n    r = src.r;\n    t = src.t;\n    return *this;\n  }\n};\n\nvoid\
  \ main()\n{\n  Polar v1, v2, v3;\n  v1 = v2 = Polar(3.0, 4.0); // 链式赋值\n}\n```\n\
  \n#### 11.6.5 自增运算符重载\n\n虽然最终结果相同，但 C++ 处理前置和后置自增运算符的方式不同。\n\n对于前置自增运算符 `++`，语法为：`Polar\
  \ & operator ++ ();`\n对于后置自增运算符 `++`，语法为：`Polar & operator ++ (int);`\n\n注意，后置自增运算符中的参数\
  \ `int` 是一个占位符。它仅用于用于区分前置自增运算符。\n\n```cpp\nclass Polar\n{\n private:\n  double r,\
  \ t;\n public:\n  Polar() : r(0.0), t(0.0) {}\n  Polar(double f, double g) : r(f),\
  \ t(g) {}\n\n  // 前置自增\n  Polar & operator ++ ()\n  {\n    r++;\n    t++;\n    return\
  \ *this;\n  }\n\n  // 后置自增\n  Polar operator ++ (int)\n  {\n    Polar temp = *this;\n\
  \    r++;\n    t++;\n    return temp;\n  }\n};\n\nvoid main()\n{\n  Polar v1(3.0,\
  \ 4.0);\n  ++v1; // 前置\n  v1++; // 后置\n}\n```\n\n\n\n\n\n```cpp\n#include<iostream>\n\
  #include<cmath> // 用于数学相关函数如 sqrt,cos , tan , tan- 等\nusing namespace std;\nclass\
  \ Height {\npublic:\n    Height(float h);\n    Height & operator ++ (); // 前置\n\
  \    Height & operator ++ (int); // 后置\n    ~Height(); // 析构函数\n    Height(Height\
  \ const& m); // 拷贝构造函数\n    Height& operator= (Height const& m); // 赋值运算符\n    float\
  \ GetHeight() const { return yourHeight;}\nprivate:\n    float yourHeight;\n};\n\
  inline Height::Height(float h):yourHeight (h){}\ninline Height::~Height() {} //\
  \ 析构函数\nHeight & Height::operator++ (){ ++yourHeight;return * this;}\nHeight & Height::operator\
  \ ++ (int) {yourHeight++;return * this;}\nvoid main()\n{ \n    Height Ramesh(179.0),Gautam(172.0),Anand(171);\
  \ // 创建三个对象\n    cout<<”n Given Height…”<<endl;\n    cout <<Ramesh.GetHeight()<<”\
  \ : “<<Anand.GetHeight()<<” : “<<Gautam.GetHeight()endl;\n    ++Ramesh;++Anand;++Gautam;\n\
  \    cout<<”\\n Height after prefix ++ overloading…”<<endl;\n    cout <<Ramesh.GetHeight()<<”\
  \ : “<<Anand.GetHeight()<<” : “<<Gautam.GetHeight()endl;\n    Ramesh++;Anand++;Gautam++;\n\
  \    cout<<”\\n Height after postfix ++ overloading…”<<endl;\n    cout <<Ramesh.GetHeight()<<”\
  \ : “<<Anand.GetHeight()<<” : “<<Gautam.GetHeight()endl;\n}\n/*输出: Given Height…179\
  \ : 171 : 172\nHeight after prefix ++ overloading…180 : 172 : 173\nHeight after\
  \ postfix ++ overloading…181 : 173 : 174*/\n```\n\n| 第 17 和 18 行： | 前置和后置自增运算符的定义。观察发现你的\
  \ Height 增加了，并且返回了 `this`（引用对象） |\n\n## 11.8 重载 new 和 delete 运算符\n\n通过对动态内存分配的学习，我们知道\
  \ `new` 运算符用于在堆内存中分配内存。`new` 和 `delete` 运算符的语法所示：\n\n```cpp\nint *x = new int; //\
  \ 堆内存的创建与分配\n*x=25; // 赋值\n或者，我们可以使用单条语句\nint *x = new int(12); // 在堆内存的指针变量上分配值\
  \ 12\n……………………\ndelete x; // 指针 x 已删除\n\n对于数组声明：//x 是一个指向数组的指针变量\nint *x =new int[12];\
  \ // 拥有 12 个连续位置\n…………………….\ndelete [] x; // 删除指向数组的指针\n```\n\n在接下来的示例中，我们将展示 `new`\
  \ 和 `delete` 运算符的重载。由于我们正在重载用于内存分配的 `new` 和 `delete` 操作，因此不能使用它们的原始定义。相反，我们使用 C\
  \ 语言中的 `malloc()` 和 `free()` 函数。语法如下：\n\n```cpp\nint *x ; // x 是指针变量\n// 使用 malloc()\
  \ 分配动态内存空间\nx = (int *)malloc( 12 *sizeof(int));\n……………………..\nfree(x); // 删除已分配的内存\n\
  ```\n\n### 示例 11.9：Stundent.cpp 重载 new 和 delete 的程序\n\n```cpp\n#include <iostream>\n\
  #include <cstdlib> // 用于使用 malloc() & free 运算符\n#include <new> // 包含 C 标准库中的 new\n\
  using namespace std;\nclass Stundent\n{\npublic:\n    Stundent() {rollNo = marks\
  \ = 0;} // 默认构造函数\n    Stundent(int a, int b) {rollNo = a;marks = b;}\n    void\
  \ Display()\n    {cout <<”Roll No :”<<rollNo << “ Marks : “<<marks << endl;}\n \
  \   int GetrollNo()const { return rollNo;}\n    int Getmarks()const { return marks;}\n\
  \    void * operator new(size_t size);\n    void operator delete(void *std);\nprivate\
  \ :\n    int rollNo, marks;\n};\n// 重载 new 运算符\nvoid *Stundent::operator new(size_t\
  \ size)\n{ \n    void *std;\n    cout << “In overloaded new.\\n”;\n    std = malloc(size);\
  \ // 我们使用 malloc 是因为我们正在重载 new\n    if(!std)\n    {bad_alloc e; throw e;}\n    return\
  \ std;\n}\n// 重载 delete 运算符\nvoid Stundent::operator delete(void *std)\n{ cout <<\
  \ “In overloaded delete.\\n\";}\nvoid main()\n{ \n    Stundent *std;\n    try {\n\
  \        std = new Stundent(505, 89);\n        std->Display();\n    } catch (bad_alloc\
  \ e) {\n        cout << “Allocation error.\\n”;\n    }\n    delete std;\n}\n/*输出:\
  \ In overloaded new.\nRoll No : 505 Marks : 89\nIn overloaded delete.*/\n```\n\n\
  \n\n\n\n7. `try` 和 `catch` 块用于处理由错误和异常引起的问题。在可能出现错误或异常的地方，程序员会包含一个 `try` 块。`try`\
  \ 块检测错误和异常并抛出错误/异常对象。`try` 块可以捕获多个异常并嵌套。\n\n8. `catch` 块捕获错误/异常对象并采取补救措施。\n\n9.\
  \ 异常对象用于进入 `catch` 块。\n\n10. 运算符重载是指基本运算符除了对内置数据类型操作外，还能对类和对象等自定义数据类型操作。\n\n11.\
  \ 像 `<<` 和 `>>` 等输入输出运算符可以重载，以便与 `iostream` 中的 `cin` 和 `cout` 对象配合对对象进行操作。\n\n12.\
  \ 不能重载的运算符有：点运算符 (.)`、`*`、`?` 和 `::`。\n\n13. 转换运算符可将一个类的对象转换为另一个类的对象或基本类型。\n\n##\
