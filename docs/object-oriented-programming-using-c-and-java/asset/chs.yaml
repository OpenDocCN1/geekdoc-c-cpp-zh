  ```\n\n### 20.8 重新抛出异常\n\n假设异常发生在某个方法中，但纠正机制位于另一个方法中（例如 `main()`），那么被方法 catch 块捕获的异常可以重新抛出，以便\
  \ `main()` 捕获重新抛出的异常并执行纠正机制。示例 1 和 2 显示了如何捕获 String 和 Array 的异常。\n\n### 20.9 定义自定义异常\n\
  \n在许多情况下，我们需要项目开发中定义自己的异常处理器，例如验证期间的异常、数据验证等。我们需要抛出异常对象并编写 catch 块来捕获该异常。`Exception`\
  \ 类是所有异常的父类。异常类的层级结构如图 20.1 所示](#chapter20.xhtml_image-20.1)。\n\n#### 20.9.1 抛出自定义异常的步骤\n\
  \n- **步骤 1：**导入 `Exception` 类：`import java.lang.Exception;`\n- **步骤 2：**让你的自定义类继承\
  \ `Exception` 类：`class OurOwnException extends Exception;`\n- **步骤 3：**为我们的类定义构造函数。`OurOwnException(String\
  \ stg){super(stg);}`\n- **步骤 4：**创建一个可能发生异常的 `try` 块\n- **步骤 5：** 如果发生异常，通过创建异常对象抛出我们的自定义异常：`throw\
  \ new OurOwnException(“Sorry Transaction can not be processed. Bal is <1000.00”);`\n\
  - **步骤 6：**使用 catch 块捕获抛出的异常对象：`catch(OurOwnException e){System.out.println“Inside\
  \ a catch block- OurOwnException”);`\n- **步骤 7：**获取异常消息：`System.out.println(e.getMessage());}`\n\
  \n### 示例 20.8：OwnException.java 一个显示如何抛出自定义异常的程序\n\n\n\n\n\n```\n 1\\. package com.oops.chap20;\n\
