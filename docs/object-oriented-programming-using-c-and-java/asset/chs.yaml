  \n### 嵌套类\n\n嵌套类意味着类中的类，也称为容器类。容器类是实现重用的提供的技术之一。继承是重用的另一个强有功能，我们将在继承中探索它。\n\n容器类意味着包含另一个类或多个类的类。例如，一台计算机内部包含一个微处理器。此外，`Student`\
  \ 类可以有一个属于 `String` 类的成员。那么我们就可以说 `String` 类被包含在 `Student` 类中。换句话说，也可以称为 `String`\
  \ 类的组合或聚合。同样，如果我们定义一个包含日、月、年信息的 `Date` 类，我们可以在 `Student` 类中定义一个 `Date` 对象，并定义与 `Date`\
  \ 相关的数据，如出生日期、入学日期等。\n\n**组合是一种“拥有”类型的关系**。对于上面提供的示例，`Student` 拥有 `String` 类的姓名和\
  \ `Date` 类的生日。如果 `Date` 类定义在 `Student` 类内部，我们可以将 `Date` 称为内部类，将 `Student` 称为外部类。使用规则如下：\n\
  \n*   内部类仅在外部类中可见，在外部类之外不可见。\n*   嵌套类或内部类可以访问外部类的所有成员，包括外部类的私有成员。\n*   外部类无法访问内部类的成员。\n\
  \n嵌套类可以分为静态和非静态，如图 18.2 所示。\n\n**图 18.2** 嵌套类\n\n\n\n\n\n# 类中的类 – 内部类\n\n内部类是 Java\
  \ 提供的实现代码复用的技术之一。内部类意味着一个包含另一个类或多个类的类。内部类`cannot` 被声明为静态（static）。内部类有四种：\n\n*  \
  \ **成员类（Member class）：** 它像类的变量一样被定义。它的访问修饰符与变量相同。\n*   **静态成员类（Static member class）：**\
  \ 尽管它使用 `static` 关键字在类内部定义，但它实际上位于类外部。要从外部类之外引用静态内部类，请使用语法：`outerClassName.InnerClassName`。静态成员类可以包含静态字段和方法。\n\
  *   **局部内部类（Local inner class）：** 在方法内部定义的类称为局部内部类。所有关于局部变量作用域的规则也适用于此类类。局部内部类不能引用非局部方法或变量。\n\
  *   **匿名内部类（Anonymous inner class）：** 作为方法的参数创建的类，可以扩展一个类或实现一个接口。语法为：`new Super(parameters){methods}`\n\
