  \ *isAlive()* 和 *join()* 方法的使用\n\n`sleep()` 方法的引入使线程暂停指定的持续时间，CPU 切换到其他等待的线程。时间的选择是任意的，并且\
  \ CPU 在时间到达后会被强制从线程中取出。这不是一个满意的解决方案。Java 提供了 `final boolean isAlive()` 方法来测试线程是否存。Java\
  \ 还提供了一个更优雅的方法 `final void join() throws InterruptedException`。这是一个非贪婪的方法，它会等待被调用的线程终止。在这里，调用线程将等待指定的线程与其汇合。\n\
  \n\n\n\n\n```java\npackage com.oops.chap20;\nimport com.oops.chap20.FirstThread2;\n\
  import com.oops.chap20.SecondThread2;\npublic class IsAliveJoinDemo {\n    public\
  \ static void main(String[] args) {\n        FirstThread2 obj1= new FirstThread2();\n\
  \        SecondThread2 obj2 =new SecondThread2();\n        // check if threads are\
  \ alive. thrd1&2 is objects of First/SecondThread2\n        System.out.println(obj1.thrd1.isAlive());\
  \    //thrd1 is object of FirstThread2\n        System.out.println(obj2.thrd2.isAlive());\n\
  \        // wait for threads to finish. Use join method\n        try{\n        \
  \    System.out.println(\"\\nwaiting for threads to finish\");\n            obj1.thrd1.join();\n\
  \            obj2.thrd2.join();\n        }catch(InterruptedException e ) {\n   \
  \         System.out.println(\"main thread interrupted\");\n        }\n        System.out.println(\"\
  Exiting from main thread\");\n    }//end of main\n}// end of ThreadRunnableDemo\n\
  ```\nOutput:\nCreating FirstThread2\nCreating FirstThread2Thread[FirstThread2,5,main]\n\
  thread1 :0 : Creating SecondThread2\nCreating SecondThread2Thread[FirstThread2,5,main]\n\
  True true\nthread1 Details waiting for threads to finish\nName :FirstThread2 Priority\
  \ :5\nthread2 :0 : thread1 :1 : thread2 :1 : thread1 :2 : thread2 :2 :\nthread1\
  \ :3 : thread2 :3 : Exiting from thread1Exiting from thread2\nExiting from main\
  \ thread\n\n#### 20.13 线程的生命周期\n\n线程有五种状态。它们是：`NewBorn`、`Runnable`、`Running`、`Blocked`\
  \ 和 `Dead State`。运行中的线程可以通过 `stop()` 方法停止。线程可以被以下任何一种方法阻塞：\n\n*   `sleep()`\n* \
  \  `suspend()` . //已废用 。由于固有问题无法使用。相反，Java 建议使用 `isAlive(0` 和 `join()` 方法。\n*  \
  \ `wait()` ; 线程将被阻塞，直到满足特定条件\n\n新生的线程会进入 `Runnable` 状态或 `Dead State`。通过 `start()`\
  \ 方法，线程进入 `Runnable` 状态。`Runnable` 状态意味着线程已就绪，并在队列中等待 CPU 服务。根据优先级或基于轮询算法，线程被调度以接受\
  \ CPU 服务。然后线程进入运行状态。\n\n现在 `sleep()` 或 `suspended()` 或 `wait()` 会让线程进入阻塞状态。`Blocked`\
  \ 状态是一个不会被 CPU 处理的状态。`Resume` 或 `notify()` 或 `notifyall()` 将让线程进入可运行状态。`notify()`\
  \ 和 `notifyall()` 是由完成 CPU 任务并发出 `notify()` 或 `notifyall()` 的线程调用的方法。根据优先级，优先级最高的线程将获得\
  \ CPU 的关注。\n\n![新生线程所经历的状态](img/493-1.png)\n\n**图图 20.4** 新生线程经历的状态\n\n*   `thrd.notify()`\
  \ : 释放对象并通知队列中等待的线程该对象可用。\n*   `Thrd.notifyAll()`: 释放对象并向所有等待的线程发送通知\n*   `Obj.wait()`:\
  \ 线程等待直到接收到 `notify()` 或 `notifyAll()` 方法。\n\n#### 20.14 线程优先级\n\n线程优先级决定了等待线程的调度顺序。线程优先级从\
  \ 1 到 10。我们可以通过以下设置优先级：\n\n`ThreadName.setPriority(int )` 或 `ThreadName.setPriority(NORM\
  \ _PRIORITY )`。\n\n`Int` 可以是 1 到 10 之间的任何数字。\n\n```\nMIN_PRIORITY =1 : NORM _PRIORITY\
  \ =5 MAX _PRIORITY =10\n```\n\nJava 首先执行优先级最高的线程。当高优先级线程停止、 `sleep()` 或执行 `wait()`\
  \ 时，低优先级的线程获得 CPU 关注。当线程在运行时，如果有高优先级线程到达，它将抢占运行中的线程并调度高优先级线程。运行中的线程进入 `Runnable`\
  \ 状态。\n\n**示例 20.12: Priority.java: 一个显示如何为线程设置优先级的程序**\n\n```java\npackage com.oops.chap20;\n\
  class MaxPriority implements Runnable{\n    Thread thrd1;\n    MaxPriority(){\n\
  \        System.out.println(\"Creating MaxPriority\");\n        thrd1 = new Thread(this,\"\
  MaxPriority\");\n        thrd1.setPriority(Thread.MAX_PRIORITY);\n        System.out.println(\"\
  Creating MaxPriority\"+thrd1);\n        thrd1.start();\n    }\n    public void run(){\n\
  \        System.out.println(\"Maximum Thread Details\");\n        System.out.println(\"\
  Name :\"+thrd1.getName());\n        System.out.println(\"Priority :\"+thrd1.getPriority());\n\
  \        // MaxPriority 执行序列\n        try{\n            for (int i=0;i<4;i++) {\n\
  \                System.out.println(\" thread1 :\" + i + \" : \");\n           \
  \     Thread.sleep(600);\n            }\n        }catch(InterruptedException e )\
  \ {\n            System.out.println(\"thread1 interrupted\");\n        }\n     \
  \   System.out.println(\"Exiting from thread1\");\n    }//end of run\n}// end of\
  \ Thread\nclass MinPriority implements Runnable{\n    Thread thrd2;\n    MinPriority(){\n\
  \        System.out.println(\"Creating MaxPriority\");\n        thrd2 = new Thread(this,\"\
  MinPriority\");\n        thrd2.setPriority(Thread.MIN_PRIORITY);\n        System.out.println(\"\
  Creating MaxPriority\"+thrd2);\n        thrd2.start();\n    }\n    public void run(){\n\
  \        System.out.println(\"Maximum Thread Details\");\n        System.out.println(\"\
  Name :\"+thrd2.getName());\n        System.out.println(\"Priority :\"+thrd2.getPriority());\n\
  \        // MaxPriority 执行序列\n        try{\n            for (int i=0;i<4;i++) {\n\
