  \ 确保主线程睡眠 1200 秒。在此期间，其他线程由 CPU 处理。 |\n\n| **Line No. 6:** | `FirstThread` 内部的 `run()`\
  \ 方法作为程序的一部分执行一个 `for` 循环。在每次循环后，线程将睡眠 600 毫秒，以便 `SecondThread` 和 `MainThread` 获得它们的\
