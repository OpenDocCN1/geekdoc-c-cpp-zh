  }\n```\n\n如你所见，我们可以指定端口名称、描述，以及使用数据的端口的默认值。它们应该与我们之前声明的枚举顺序匹配。\n\n更改已使用节点的端口名称会破坏现有的图表。填充可选的\
  \ `humanName` 参数来显示名称。\n\n**[ 46 ]**\n\n*第 2 章*\n\n现在我们重复该过程，但使用输出函数集：`static const\
  \ SOutputPortConfig outputs[] =`\n\n```cpp\n{\n    OutputPortConfig<float>(\"Result\"\
  , \"计算结果\"),\n    {0}\n};\n```\n\n## 将数组分配给节点配置\n\n遵循创建端口的过程，我们需要将这些数组分配给 `config`\
  \ 参数，并提供描述和分类：`config.pInputPorts = inputs;`, `config.pOutputPorts = outputs;`,\
  \ `config.sDescription = _HELP(\"两个数字相乘\");` `config.SetCategory(EFLN_APPROVED);`。\n\
  \n如果你现在编译代码，节点在编辑器中应该是完全可见的。但正如你看到的，它现在什么都没做；要修复这个问题，我们必须实现 `ProcessEvent`！\n\n\
  ## Flownode 配置标志\n\n`SFlowNodeConfig` 结构体允许你为 flownode 分配可选标志，如下：\n\n- `EFLN_TARGET_ENTITY`:\
  \ 用于指示此节点应支持目标实体。要获取当前分配的目标实体，请查看 `SActivationInfo::pEntity`。\n- `EFLN_HIDE_UI`:\
