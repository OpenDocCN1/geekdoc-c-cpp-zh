  \ 控制节点的显示方式，以及它包含的输入端口和输出端口。`GetMemoryUsage` 不需要我们进行任何额外的实现，因此我们只需要为内存跟踪添加该节点的引用即可。\n\
  \n现在，验证你的代码是否可以编译是一个很好的点；如果没有通过，请检查你是否正确声明了所有函数签名，并包含了相应的头文件。\n\n## 实现 GetConfiguration\n\
  \n如前所述，`GetConfiguration` 是我们设置节点如何在 Flowgraph 编辑器中使用的的地方。首先，让我们设置一个枚举（enum）来描述我们的输入端口；我们将使用两个值，left（左）和\
  \ right（右），以及一个用于触发计算的激活端口。在类内部声明它：`enum EInput`\n\n```cpp\nenum EInput\n{\n   \
  \ EIP_Activate,\n    EIP_Left,\n    EIP_Right\n};\n```\n\n**[ 45 ]**\n\n*使用 Flowgraph\
  \ 进行视觉化脚本* 当然，我们还需要为计算准备一个输出端口，因此也为它创建一个单值的枚举。虽然不是强制要求的，但保持一致是一个良好的习惯，而且大多数节点都会有多个输出：\n\
  \n```cpp\nenum EOutput\n{\n    EOP_Result\n};\n```\n\n## 创建端口\n\n声明这些后，我们就可以开始构建我们的节点了。端口定义为\
  \ `GetConfiguration` 中声明的常量静态数组中的项，并使用一些辅助函数进行构造，即用于特定类型值的 `InputPortConfig<T>`、允许所有值的\
  \ `InputPortConfig_AnyType` 以及用于不使用数据端口的 `InputPortConfig_Void`。\n\n考虑到这些，我们知道除了两个\
  \ float 泛型端口外，我们的触发输入还需要一个 void 输入。我们还时一个 float 输出。\n\n```cpp\nvirtual void GetConfiguration(SFlowNodeConfig\
  \ &config)\n{\n    static const SInputPortConfig inputs[] =\n    {\n        InputPortConfig_Void(\"\
  Activate\", \"触发计算\"),\n        InputPortConfig<float>(\"Left\", 0, \"计算的左侧\"),\n\
