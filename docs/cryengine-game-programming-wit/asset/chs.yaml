  \n*第 2 章*\n\n### 创建新节点文件\n\n首先，我们包含了 `stdafx.h`；这为文件提供了常用功能和包含。之后，我们包含了第二个文件 `Nodes/GBaseNode.h`。虽然它不是一个\
