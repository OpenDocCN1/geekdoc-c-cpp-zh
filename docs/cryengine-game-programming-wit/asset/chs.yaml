  \n[ 90 ]\n\n## 创建自定义 Actor\n\n使用 CryENGINE actor 系统，我们可以创建具有自定义行为的玩家或 AI 控制的实体来填充我们的游戏世界。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- 学习 actor 的目的以及实现它们的核心思想\n- 在 C++ 和 C# 中创建自定义 actor\n- 创建我们的第一个玩家相机处理器\n\
  - 实现基础玩家移动\n\n## 介绍 actor 系统\n\n我们在 `Chapter 3`, `Creating and Utilizing Custom\
  \ Entities` 中学习了什么是游戏对象扩展以及如何使用它们。我们将基于这些知识在 C++ 和 C# 中创建自定义 actor。\n\nActor 由 `IActor`\
  \ 结构体表示，它们是核心层中的游戏对象扩展。这意味着每个 actor 都有一个底层实体和一个用于处理网络和 `IActor` 扩展的游戏对象。\n\nActor\
  \ 由 `IActorSystem` 接口处理，该接口管理每个 actor 的创建、删除和注册。\n\n## 通道标识符\n\n在网络上下文中，每个玩家都被分配了一个通道\
  \ ID 和一个 Net Nub 索引，我们将在 `Chapter 8`, `Multiplayer and Networking` 中进一步介绍。\n\n##\
  \ 创建自定义 Actor\n\n### Actor 生成\n\n玩家 actor 应该在客户端连接到游戏时生成，位于 `IGameRules::OnClientConnect`\
  \ 内部。要生成 actor，使用所示的 `IActorSystem::CreateActor`：\n\n```cpp\nIActorSystem *pAS =\
  \ gEnv->pGameFramework->GetIActorSystem(); pAS ->CreateActor(channelId, \"MyPlayerName\"\
  , \"MyCppActor\", Vec3(0, 0, 0), Quat(IDENTITY), Vec3(1, 1, 1));\n```\n\n注意，之前的代码仅适用于玩家控制的\
  \ actor。非玩家 actor 可以随时创建。\n\n### 删除 actor\n\n为了确保玩家 actor 在客户端断开连接时正确删除，我们需要通过 `IGameRules::OnClientDisconnect`\
  \ 回调手动删除它：\n\n```cpp\npActorSystem->RemoveActor(myActorEntityId);\n```\n\n在断开连接后忘记移除玩家\
  \ actor 可能会导致崩溃或严重的伪影。\n\n### 视图系统\n\n为了方便处理玩家和其他相机源视图（views）的需求，CryENGINE 提供了视图系统，可以通过\
  \ `IViewSystem` 接口访问。\n\n视图系统基于任意数量的视图，由 `IView` 接口表示，每个视图都有处理位置、旋转和配置的能力。\n\n为了方便处理玩家和其他相机源视图的需求，CryENGINE\
  \ 提供了视图系统，可以通过 `IViewSystem` 接口访问。\n\n视图系统的核心是拥有任意数量的视图，由 `IView` 接口表示，每个视图都有更新位置、旋转和配置的能力。\n\
  \n请记住，任何时候都只有一个视图是激活的。\n\n```cpp\nIViewSystem *pViewSystem = gEnv->pGameFramework()->GetViewSystem();\n\
  IView *pNewView = pViewSystem->CreateView();\n```\n\n[ 92 ]\n\n# 第 5 章\n\n我们可以使用\
  \ `IViewSystem::SetActiveView` 函数设置激活视图：\n\n```cpp\npViewSystem->SetActiveView(pNewView);\n\
  ```\n\n激活后，视图将更新系统相机。要修改视图的参数，我们可以调用 `IView::SetCurrentParams`。例如，要更改位置，使用以下代码：\n\
  \n```cpp\nSViewParams viewParams = *GetCurrentParams();\nviewParams.position = Vec3(0,\
  \ 0, 10);\nSetCurrentParams(viewParams);\n```\n\n现在的位置现在是 (0,0)。\n\n## 将视图链接到游戏对象\n\
  \n每个视图还可以将其链接到游戏对象，允许游戏对象扩展订阅 `UpdateView` 和 `PostUpdateView` 函数。\n\n这些函数允许轻松地更新分配视图的位置、旋转和配置。例如，这用于\
  \ actor，以便为玩家提供易用的自定义相机处理方法。\n\n关于相机处理的更多信息，请参见本章稍后的 *Camera handling* 部分。\n\n##\
  \ 创建自定义 Actor\n\n现在我们已经知道了 actor 系统是如何工作的，现在可以可以在 C# 和 C++ 中创建我们的第一个 actor。\n\n\
  默认情况下无法纯使用 Lua 脚本创建 actor。通常，actor 是在 C++ 中创建的，并处理 `Game/Scripts/Entities/Actors`\
  \ 文件夹中的 Lua 脚本。\n\n### 在 C# 中创建 Actor\n\n使用 CryMono，我们可以完全在 C# 中创建自定义 actor。这样做，我们可以如所示派生\
  \ `Actor` 类：\n\n```csharp\npublic class MyActor : Actor\n{\n}\n```\n\n[ 93 ]\n\n\
  ![](img/index-113_1.png)\n\n之前的代码是在 CryMono 中创建 actor 的最小配置。你可以进入游戏规则实现，并在客户端连接时通过\
  \ `Actor.Create` 静态方法生成 actor。\n\n## CryMono 类层次结构\n\n如果你对各种 CryMono/C# 类感到困惑，请查看以下继承图：\n\
  \n注意，在使用 `Entity.Get` 查询实体（通过 `Actor.Get` 查询 actor）时，你将获得一个 `EntityBase` 或 `ActorBase`\
  \ 类型的对象。\n\n这是因为原生实体和 actor 存在于托管系统之外，在查询时返回的是受限的表示。\n\n## 混合使用原生和 CryMono actor\n\
