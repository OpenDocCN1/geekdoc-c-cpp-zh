  \ `nFlags` 变量中：\n\n`config.nFlags |= EFLN_TARGET_ENTITY;`\n\n**[ 47 ]**\n\n*使用 Flowgraph\
  \ 进行视觉化脚本* **实现 ProcessEvent**\n\n`ProcessEvent` 是我们捕获节点所有有趣事件的地方，例如端口被触发。在我们的情况下，每当\
  \ `Activate` 端口被触发时，都要执行计算，因此我们需要检查端口激活情况。不过，我们可以通过检查我们想要处理的事件来节省一些处理工作。\n\n```cpp\n\
  virtual void ProcessEvent(EFlowEvent evt, SActivationInfo *pActInfo)\n{\n    switch\
  \ (evt)\n    {\n        case eFE_Activate:\n        {\n        }\n        break;\n\
  \    }\n}\n```\n\n通常你会处理多个一个事件，所以养成在此处使用 `switch` 语句的习惯是好的。\n\n在内部，让我们看看我们用于检查激活状态、检索数据并触发输出的各种\
  \ flownode 函数：`if (IsPortActive(pActInfo, EIP_Activate))`\n\n```cpp\n    float left\
  \ = GetPortFloat(pActInfo, EIP_Left);\n    float right = GetPortFloat(pActInfo,\
  \ EIP_Right); \n    float answer = left * right;\n    ActivateOutput(pActInfo, EOP_Result,\
  \ answer);\n}\n```\n\n总结来说，我们使用 `GetPort*` 函数通过各种端口类型来获取值，然后触发输出。\n\n**[ 48 ]**\n\
  \n![](img/index-68)\n\n*第 2 章*\n\n现在现在是时候加载编辑器并测试了；如果一切顺利，你已经写好了 C++ 代码。\n\n## 在\
  \ C# 中创建节点\n\nCryMono 也支持创建节点以免污染主命名空间。打开 `Scripts/GameCode.sln`，在 `flownodes` 文件夹创建一个新的\
  \ `.cs` 文件：\n\n```csharp\nusing CryEngine.Flowgraph;\n\nnamespace GameCode.FlowNodes\n\
  {\n    [FlowNode(Name = \"Multiplier\", Category = \"CSharp\", Filter = FlowNodeFilter.Approved)]\n\
  \    public class TutorialNode : FlowNode\n    {\n    }\n}\n```\n\n**[ 49 ]**\n\n\
  *使用 Flowgraph 进行视觉化脚本* 我们使用 `FlowNode` 类代替 `GetConfiguration` 来设置元数据，如类别和可见性。你的节点必须包含此属性并继承\
  \ `FlowNode` 才能被 CryEngine 注册；不需要任何手动调用。\n\n记住属性可以在不带名称的情况下放置。例如，`FlowNodeAttribute`\
  \ 可以作为 `[FlowNode]`。\n\n## 添加输入\n\n输入在 C# 中定义为函数，它们接受一个定义数据类型的参数，或者对于 void 端口不接受参数。它们还需要被\
  \ `Port` 属性装饰。在我们的情况下，让我们设置与 C++ 版本中相同的三个输入：\n\n```csharp\n[Port]\npublic void Activate()\n\
  {\n}\n\n[Port]\npublic void Left(float value)\n{\n}\n\n[Port]\npublic void Right(float\
  \ value)\n{}\n```\n\n我们稍后来看 `Activate` 的实现。虽然你可以通过设置属性中的可选参数来覆盖端口名称，但简单的方法是让你的函数名称定义它在编辑器中的显示方式。\n\
  \n## 添加输出\n\n输出存储为 `OutputPort` 或 `OutputPort<T>` 的实例（如果需要值的话）。让我们现在作为类的属性添加我们的\
  \ `Result` 输出：\n\n```csharp\npublic OutputPort<float> Result { get; set; }\n```\n\
  \n**[ 50 ]**\n\n![](img/index-70)\n\n## 实现 Activate\n\n让我们回到 `Activate` 输入；同样，我们需要检索我们的两个值并触发输出。`FlowNode`\
  \ 类为这些操作提供了方便的函数：\n\n```csharp\nvar left = GetPortValue<float>(Left);\nvar right\
  \ = GetPortValue<float>(Right);\nvar answer = left * right;\nResult.Activate(answer);\n\
  ```\n\n\n\n\n就是这样！下次当你打开 Flowgraph 编辑器时，你会看到新的 `CSharpTutorial:Multiplier` 节点，它的功能与你之前实现的\
  \ C++对应版本完全相同：\n\n再次祝贺你，你已经迈出了使用 .NET 平台和 CryENGINE 游戏代码的第一步！\n\n## 目标实体\n\n在 CryMono\
  \ 中添加对目标实体（target entities）的支持很容易，只需将 `FlowNode` 属性中的 `TargetsEntity` 属性设置为 true\
  \ 即可：\n\n```python\n[FlowNode(TargetsEntity = true)]\n```\n\n然后你就可以通过 `FlowNode.TargetEntity`\
  \ 获取实体实例，假设它已经在包含该节点的流程图内部被赋值。\n\n## [ 51 ]\n\n### 使用 Flowgraph 进行视觉脚本 - 总结\n\n\
  在本章中，我们学习了为什么流程图对于赋能设计师非常有用，并创建了自己的流程图。\n\n我们还研究了 CryENGINE 提供的一些现有节点，并用两种编程语言创建了我们自己的节点。你现在应该对流程图系统有了良好的理解，以及如何利用它来为自己服务。\n\
  \n在未来的章节中，我们将将介绍流程图可以实现的一些额外功能，包括设计用户界面、实现材质效果、创建表示世界中实体的特殊节点（flownodes），以及将 AI\
  \ 功能封装成方便的重用模块。\n\n现在，如果你想进一步探索流程图的世界，为什么不尝试研究如何实现更多的内置节点呢？熟悉编写 C++ 节点和 C# 节点之间的区别，看看你更偏好哪一种。\n\
  \n如果你特别想尝试 CryMono，可以尝试在 Sandbox 运行时编辑并保存你的节点脚本；你可能会惊喜地发现，它们在后台被重新编译并重新加载了！这应该帮助你测试新的节点想法，而不会被编译时间和重启阻碍你的实验。\n\
  \n## [ 52 ]\n\n### 创建和利用自定义实体\n\nCryENGINE 实体系统提供了创建从简单的物理对象到复杂的天气模拟管理器等一切内容。\n\n\
  在本章中我们将：\n\n- 详细阐述实体系统的基本概念和实现\n- 使用 `Lua`、`C#` 和 `C++` 创建我们的第一个自定义实体\n- 学习游戏对象系统\n\
  \n### 介绍实体系统\n\n实体系统的存在是为了在游戏世界生成和管理实体。实体是逻辑容器，允许在运行时发生巨大的行为改变。例如，实体可以在游戏的任何时候更改其模型、位置和朝向。\n\
  \n考虑这一点；你在引擎中交互过的每一个物品、武器、车辆甚至玩家都是实体。实体系统是引擎中存在的最模块之一，程序员经常需要处理它。\n\n可以通过 `IEntitySystem`\
  \ 接口访问实体系统，管理游戏中所有的实体。实体使用 `entityId` 类型定义进行引用，这允许在任何给定的时间内存在 65536 个唯一实体。\n\n如果实体被标记为删除，例如\
  \ `IEntity::Remove(bool bNow = false)`，实体系统将在下一帧开始时的更新之前删除该实体。如果 `bNow` 参数设置为 true，则实体将立即被移除。\n\
  \n### 创建和利用自定义实体 - 实体类\n\n实体仅仅是实体类的实例，由 `IEntityClass` 接口表示。每个实体类都分配了一个用于标识它的名称，例如\
  \ `SpawnPoint`。\n\n这些类可以通过 `IEntityClassRegistry::RegisterClass` 注册，或者通过 `IEntityClassRegistry::RegisterStdClass`\
  \ 使用默认的 `IEntityClass` 实现。\n\n### 实体\n\n`IEntity` 接口用于访问实体实现本身。\n\n`IEntity` 的核心实现包含在\
  \ `CryEntitySystem.dll` 中，无法修改。相反，我们能够使用游戏对象扩展（请看本章中的游戏对象扩展章节）和自定义实体类来扩展实体。\n\n\
  ### entityId\n\n每个实体实例都被分配了一个唯一标识符，该标识符在整个游戏会话期间有效。\n\n### EntityGUID\n\n除了 `entityId`\
  \ 参数外，实体还被赋予全局唯一标识符，与 `entityId` 不同，它在保存游戏等情况下可以在不同的游戏会话之间持续。\n\n## 游戏对象\n\n当实体需要扩展功能时，它们可以使用游戏对象和游戏对象扩展。这允许任何实体共享一个更大的功能集。\n\
  \n游戏对象允许处理实体到网络的绑定、序列化、每帧更新，以及利用现有（或创建新的）游戏对象扩展的能力，例如 `Inventory` 和 `AnimatedCharacter`。\n\
  \n通常在 CryENGINE 开发中，游戏对象仅对于更重要的实体实现是必要的，如 actor。actor 系统将在*第 5 章，创建自定义 Actor* 中进行更深入的解释，以及\
  \ `IActor` 游戏对象扩展。\n\n## [ 54 ]\n\n# 第 3 章\n\n## 实体池系统\n\n实体池系统允许对实体进行“池化”，从而有效地控制当前处理的实体。此系统通常通过流程图访问，并允许根据事件在运行时禁用/启用实体组。\n\
  \n池也用于频繁创建和释放的实体，例如子弹。\n\n一旦实体被标记为由实体系统处理，默认情况下它会在游戏中被隐藏。在实体准备好之前，它不存在于游戏世界中。一旦实体不再需要，释放该实体也是理想的的。\n\
  \n例如，如果你有一组 AI 只有在玩家到达定义的检查点触发器时才需要激活，可以使用 `AreaTrigger`（及其包含的 flownode）和 `Entity:EntityPool`\
  \ flownode 来设置。\n\n### 创建自定义实体\n\n现在我们已经学习了实体系统的基础，是时候创建我们的第一个实体了。在这个练习中，我们将演示使用\
  \ `Lua`、`C#` 和 `C++` 创建实体的能力。\n\n### 使用 Lua 创建实体\n\nLua 实体的设置非常简单，围绕着两个文件：实体定义和脚本本身。要创建一个\
  \ Lua 实体，我们首先必须创建实体定义以告诉引擎脚本的位置：\n\n```xml\n<Entity\nName=\"MyLuaEntity\"\nScript=\"\
  Scripts/Others/MyLuaEntity.lua\"\n/>\n```\n\n只需将此文件保存为 `Game/Entities/` 目录下的 `MyLuaEntity.ent`，引擎就会搜索\
  \ `Scripts/Others/MyLuaEntity.lua`。\n\n现在我们可以开始创建脚本本身了！首先，在之前设置的路径创建脚本并添加一个与实体同名的空表：`MyLuaEntity\
  \ = { }`\n\n## [ 55 ]\n\n![](img/index-75_1.png)\n\n### 创建和利用自定义实体\n\n解析脚本时，引擎执行的操作是搜索与实体名称相同的表，就像你在\
  \ .ent 定义文件中定义的那样。这个主表用于存储变量、编辑器属性和其他信息。\n\n例如，我们可以通过添加字符串变量来添加自己的属性：\n\n```lua\n\
  MyLuaEntity = {\n  Properties = {\n    myProperty = \"\",\n  },\n}\n```\n\n可以通过在\
  \ `Properties` 表中添加子表创建属性类别。这对于组织非常有用。\n\n完成更改后，当你通过位于编辑器右侧的 `RollupBar` 生成类实例时，你应该看到下面的截图：\n\
  \n## [ 56 ]\n\n# 第 3 章\n\n### 常用的 Lua 实体回调\n\n脚本系统提供了一组回调，可用于在实体事件发生时触发特定逻辑。例如，`OnInit`\
  \ 函数在实体初始化时被调用：\n\n```lua\nfunction MyEntity:OnInit()\n\nend\n```\n\n### 使用 C# 创建实体\n\
  \n\n\n\n第三方扩展 `CryMono` 允许在 .NET 中创建实体，这将引导我们演示如何在 C# 中创建我们自己的实体的能力。\n\n首先，打开 `Game/Scripts/Entities`\
  \ 目录，并创建一个名为 `MyCSharpEntity.cs` 的新文件。该文件将包含我们的实体代码，并在引擎启动时运行时进行编译。\n\n现在，使用你喜欢的\
  \ IDE 打开该脚本（`MyCSharpEntity.cs`）。我们将使用 Visual Studio 来提供 `IntelliSense`（智能感知）和代码高亮。\n\
  \n打开后，让我们创建一个基础骨架实体。我们需要添加对 `CryEngine` 命名空间的引用，该空间存储了最常用的 `CryENGINE` 类型。\n\n```c\n\
  using CryEngine;\n\nnamespace CryGameCode\n{\n\n[Entity]\n\npublic class MyCSharpEntity\
  \ : Entity\n{\n\n\n\n\n\n}\n```\n\n**[ 57 ]**\n\n![](img/index-77_1.png)\n\n*创建和利用自定义实体*\n\
  \n现在，保存文件并启动编辑器。你的实体现在应该出现在 `RollupBar`（折叠栏）的 `Default` 类别下。将 `MyEntity` 拖入视口中以将其生成：我们使用实体属性（`[Entity]`）作为一种为实体注册过程提供额外信息的方法，例如，使用\
  \ `Category` 属性将导致使用自定义的编辑器类别，而不是 `Default`。\n\n```\n[Entity(Category = \"Others\"\
  )]\n```\n\n### 添加编辑器属性\n\n编辑器属性允许关卡设计人员为实体提供参数，也许是为了指示触发区域的大小，或者指定实体的默认健康值。\n\n\
  在 `CryMono` 中，可以通过为支持的类型（查看下方的代码片段）标记 `EditorProperty` 属性来实现。例如，如果我们要添加一个新的字符串属性：\n\
  \n```csharp\n[EditorProperty]\n\npublic string MyProperty { get; set; }\n```\n\n\
  现在，当你启动编辑器并将 `MyCSharpEntity` 拖入视口时，你应该能看到 `MyProperty` 出现在 `RollupBar` 的下部分。\n\n\
  **[ 58 ]**\n\n![](img/index-78_1.png)\n\n*第 3 章*\n\nC# 中的 `MyProperty` 字符串变量会在用户通过编辑器编辑它时自动更新。记住，编辑器属性将随关卡一起保存，允许实体在纯游戏模式下也能使用关卡设计人员定义的编辑器属性。\n\
  \n### 属性文件夹\n\n与 Lua 脚本一样，`CryMono` 实体也可以将编辑器属性放在文件夹中以达到组织目的。为了创建文件夹，你可以如所示利用 `EditorProperty`\
  \ 属性的 `Folder` 属性：\n\n```csharp\n[EditorProperty(Folder = \"MyCategory\")]\n```\n\
  \n你现在知道如何使用 `CryMono` 创建带有自定义编辑器属性的实体了！\n\n这在创建简单的游戏元素供关卡设计人员在运行时放置和修改时非常有用，而无需去寻找最近的程序员。\n\
  \n**[ 59 ]**\n\n*创建和利用自定义实体* **在 C++ 中创建实体**\n\n在 C++ 中创建实体比使用 Lua 或 C# 创建稍微复杂一点，并且可以根据实体的需求以不同的方式完成。在本示例中，我们将详细介绍通过实现\
  \ `IEntityClass` 来创建自定义实体类。\n\n### 创建自定义实体类\n\n实体类由 `IEntityClass` 接口表示，我们将派自它并通过\
  \ `IEntityClassRegistry::RegisterClass(IEntityClass *pClass)` 其注册。\n\n首先，为我们的实体类创建头文件。在\
  \ Visual Studio 中右键点击你的项目或其任何过滤器，并在右键菜单中选择 `添加` | `新建项`。\n\n在提示时创建你的头文件（`.h`）。我们将其命名为\
  \ `CMyEntityClass`。\n\n现在，打开生成的 `MyEntityClass.h` 头文件，创建一个派自 `IEntityClass` 的新类：\n\
  \n```cpp\n#include <IEntityClass.h>\n\nclass CMyEntityClass : public IEntityClass\n\
  {\n\n};\n```\n\n现在我们已经设置好了类，我们需要实现从 `IEntityClass` 继承的纯虚方法，以便类成功编译。\n\n对于大多数方法，我们可以简单地返回空指针、零或空字符串。然而，有几个方法我们必须处理类才能正常工作：\n\
  \n- `Release()`：当类应该释放时调用，应简单执行 `delete this;` 来销毁该类\n- `GetName()`：它应该返回类的名称\n\
  - `GetEditorClassInfo()`：它应该返回 `ClassInfo` 结构体，其中包含给编辑器的编辑器类别、辅助程序和图标字符串\n- `SetEditorClassInfo()`：当需要更新刚才解释的编辑器类信息时调用\n\
  \n**[ 60 ]**\n\n*第 3 章*\n\n`IEntityClass` 是实体类的最基本要求，尚不支持编辑器属性（我们稍后会进一步介绍这一点）。\n\
  \n要注册实体类，我们需要调用 `IEntityClassRegistry::RegisterClasses`。这必须在 `CGameStartup` 中的 `IGameFramework::CompleteInit`\
  \ 调用之前完成。我们将在 `GameFactory.cpp` 的 `InitGameFactory` 函数中执行：\n\n```cpp\nIEntityClassRegistry::SEntityClassDesc\
  \ classDesc; classDesc.sName = \"MyEntityClass\";\n\nclassDesc.editorClassInfo.sCategory\
  \ = \"MyCategory\"; IEntitySystem *pEntitySystem = gEnv->pEntitySystem; IEntityClassRegistry\
  \ *pClassRegistry = pEntitySystem->GetClassRegistry();\n\nbool result = pClassRegistry->RegisterClass(new\
  \ CEntityClass(classDesc));\n```\n\n### 实现属性处理器\n\n为了处理属性，我们需要通过一个新的 `IPropertyHandler`\
  \ 实现来扩展我们的 `IEntityClass` 实现。\n\n属性处理器的实现如下所示。\n\n属性处理器负责属性的设置、获取和序列化。\n\n首先创建一个名为\
  \ `MyPropertyHandler.h` 的头文件。\n\n以下是 `IPropertyHandler` 的基本实现。\n\n为了正确支持属性，你需要实现\
  \ `LoadEntityProperties`（后者用于读取属性值）。\n\n然后创建一个派自 `IPropertyHandler` 的新类：\n\n```cpp\n\
  class CMyPropertyHandler : public IPropertyHandler\n{\n\n};\n```\n\n**[ 61 ]**\n\
  \n*创建和利用自定义实体* 为了让新类能够编译，你需要实现 `IPropertyHandler` 中定义的纯虚方法。对于属性处理器正常工作至关重要的方法如下所示：\n\
  \n- `LoadEntityProperties`：当启动器加载关卡时调用，用于读取编辑器保存的实体属性值\n- `GetPropertyCount`：它应该返回注册到类的属性数量\n\
  - `GetPropertyInfo`：用于获取指定索引的属性信息，最重要的是在编辑器获取属性时\n- `SetProperty`：用于设置实体的属性值\n-\
  \ `GetProperty`：用于获取实体的属性值\n- `GetDefaultProperty`：用于检索指定索引的默认属性值\n\n要使用新的属性处理器，创建其实例（将请求的属性传递给构造函数），并在\
  \ `IEntityClass::GetPropertyHandler()` 中返回新创建的处理器。\n\n我们现在有了一个基础实体类实现，它可以轻松扩展以支持编辑器属性。这种实现非常有可扩展性，可以用于许多用途，例如，后面看到的\
  \ C# 脚本简单地自动化了这一过程，减轻了程序员的代码责任。\n\n### 流程节点 (flownodes)\n\n在前章节中，我们涵盖了流程图系统以及流程节点的创建。你可能注意到，在图内部右键点击时，上下文选项之一是\
  \ `添加选中实体`。此功能允许你从关卡中选择一个实体，然后将其实体流程节点添加到图中。\n\n默认情况下，实体流程节点不包含任何端口，因此如右侧所示大部分没有用处。\n\
  \n**[ 62 ]**\n\n![](img/index-82_1.png)\n\n\n\n\n![](img/index-82_2.png)\n\n# 第\
  \ 3 章\n\n然而，我们可以轻松创建自己的实体流程节点 `flownode`，目标是我们在三种语言中选定的实体。\n\n## 在 Lua 中创建实体流程节点\n\
  \n通过扩展我们在 *使用 Lua 创建实体* 节中创建的实体，我们可以为它添加它自己的实体流程节点：\n\n```lua\nfunction MyLuaEntity:Event_OnBooleanPort()\n\
  \n  BroadcastEvent(self, \"MyBooleanOutput\"); end\n\nMyLuaEntity.FlowEvents =\n\
  \n{\n  Inputs =\n  {\n    MyBooleanPort = { MyLuaEntity.Event_OnBooleanPort, \"\
  bool\" },\n  },\n  Outputs =\n  {\n    MyBooleanOutput = \"bool\",\n  },\n}\n```\n\
  \n我们刚刚为我们的 `MyLuaEntity` 类创建了一个实体流程节点。如果你启动编辑器，生成你的实体，选择它，然后在流程图中点击 **Add Selected\
  \ Entity**（添加已选实体），你应该能看到该节点出现出现。\n\n**[ 63 ]**\n\n![](img/index-83_1.png)\n\n*创建和利用自定义实体*\n\
  \n### 使用 C# 创建实体流程节点\n\n在 C# 中创建实体流程节点非常简单，因为它的实现与普通流程节点几乎完全相同。要为你的实体创建一个新的流程节点，只需继承自\
  \ `EntityFlowNode<T>`，其中 `T` 是你的实体类名：\n\n```csharp\nusing CryEngine.Flowgraph;\n\
  \npublic class MyEntity : Entity { }\npublic class MyEntityNode : EntityFlowNode<MyEntity>\n\
  {\n  [Port]\n  public void Vec3Test(Vec3 input) { }\n  [Port]\n  public void FloatTest(float\
  \ input) { }\n  [Port]\n  public void VoidTest()\n  {\n  }\n  [Port]\n  OutputPort<bool>\
  \ BoolOutput { get; set; }\n}\n```\n\n我们刚刚在 C# 中创建了一个实体流程节点。这允许我们轻松地从上一节中学到的知识，并在新节点的逻辑中使用\
  \ `TargetEntity`。\n\n**[ 64 ]**\n\n*第 3 章*\n\n### 在 C++ 中创建实体流程节点\n\n本节假设你已经阅读了第\
  \ 2 章《使用 Flowgraph 进行视觉化脚本》中的 *在 C++ 中创建自定义节点* 节。\n\n简而言之，实体流程节点的实现与普通节点完全相同。区别在于节点注册的方式，以及实体支持\
  \ `TargetEntity` 的前提条件（更多信息请参阅上一节）。\n\n#### 注册实体节点\n\n我们使用与之前相同的方法来注册实体节点，唯一的区别是类别必须是\
  \ `entity`，且节点名称必须与其所属的实体相同：\n\n`REGISTER_FLOW_NODE(\"entity:MyCppEntity\", CMyEntityFlowNode);`\
  \ **最终代码**\n\n最后，根据我们现在以及在上一节中学到的知识，我们可以轻松地在 C++ 中创建第一个实体流程节点：\n\n```cpp\n#include\
  \ \"stdafx.h\"\n#include \"Nodes/G2FlowBaseNode.h\"\n\nclass CMyEntityFlowNode :\
  \ public CFlowBaseNode<eNCT_Instanced>\n{\n  enum EInput\n  {\n    EIP_InputPort,\n\
  \  };\n  enum EOutput\n  {\n    EOP_OutputPort\n  };\n\npublic:\n  CMyEntityFlowNode(SActivationInfo\
  \ *pActInfo)\n  {\n  }\n  virtual IFlowNodePtr Clone(SActivationInfo *pActInfo)\n\
  \  {\n    return new CMyEntityFlowNode(pActInfo);\n  }\n  virtual void ProcessEvent(EFlowEvent\
  \ evt, SActivationInfo *pActInfo)\n  {\n  }\n  virtual void GetConfiguration(SFlowNodeConfig\
  \ &config)\n  {\n    static const SInputPortConfig inputs[] =\n    {\n      InputPortConfig_Void(\"\
  Input\", \"Our first input port\"),\n      {0}\n    };\n    static const SOutputPortConfig\
  \ outputs[] =\n    {\n      OutputPortConfig_Void(\"Output\", \"Our first output\
  \ port\"),\n      {0}\n    };\n    config.pInputPorts = inputs;\n    config.pOutputPorts\
  \ = outputs;\n    config.sDescription = _HELP(\"Entity flow node sample\"); config.nFlags\
  \ |= EFLN_TARGET_ENTITY;\n  }\n  virtual void GetMemoryUsage(ICrySizer *s) const\n\
  \  {\n    s->Add(*this);\n  }\n};\n\nREGISTER_FLOW_NODE(\"entity:MyCppEntity\",\
  \ CMyEntityFlowNode);\n```\n\n**[ 65 ]**\n\n*创建和利用自定义实体* **[ 66 ]**\n\n## 游戏对象\n\
  \n正如章节开头提到的，当实体需要更高级的功能时，就会使用游戏对象（game objects），例如，如果实体需要绑定到网络上。\n\n实现游戏对象有两种方法：一种通过\
  \ `IGameObjectSystem::RegisterExtension` 直接注册实体（从而在实体生成时自动创建游戏对象），另一种是利用 `IGameObjectSystem::CreateGameObjectForEntity`\
  \ 方法在运行时为实体创建游戏对象。\n\n#### 游戏对象扩展\n\n可以通过创建扩展（extensions）来扩展游戏对象，这允许开发者挂钩许多实体和游戏对象的回调。例如，这就是\
  \ Actor（角色）的默认实现方式，我们将在 *第 5 章* *创建自定义 Actor* 中涵盖这一内容。\n\n我们将使用 C++ 创建我们的游戏对象扩展。在本节早些时候创建的\
  \ CryMono 实体之所以能够实现，得益于自定义的游戏对象扩展，目前无法通过 C# 或 Lua 创建此类扩展。\n\n##### 在 C++ 中创建游戏对象扩展\n\
  \nCryEngine 提供了一个名为 `CGameObjectHelper` 的模板类用于创建游戏对象扩展。这个辅助类用于避免重复编写游戏对象所需的代码，例如基础的\
  \ RMI 功能（我们将在第 8 章 *多人游戏与网络* 中介绍）。\n\n要正确实现 `IGameObjectExtension`，只需继承该模板类，并将第一个模板参数为你编写的类，第二个参数为\
  \ `IGameObjectExtension`。\n\n**[ 67 ]**\n\n*创建和利用自定义实体* 通常第二个参数是 `IGameObjectExtension`，但对于特定的实现（如\
  \ `IActor`），它可以不同。\n\n```cpp\nclass CMyGameObjectExtension : public CGameObjectHelper<CMyGameObjectExtension,\
  \ IGameObjectExtension>\n{\n```\n\n来实现所有的纯虚函数。许多方法可以重写并返回 false，而更重要的方法如下：\n\n-\
  \ `Init`: 用于初始化扩展。只需执行 `SetGameObject(pGameObject);` 并返回 `true`。\n- `NetSerialize`:\
  \ 用于在网络上序列化内容。\n\n你还需要在一个新类中实现 `IGameObjectExtensionCreator`，作为扩展工厂。当扩展准备激活时，将调用工厂的\
  \ `Create()` 方法来获取新的实例：\n\n```cpp\nstruct SMyGameObjectExtensionCreator : public\
  \ IGameObjectExtensionCreator\n{\n  virtual IGameObjectExtension *Create() { return\
  \ new CMyGameObjectExtension(); }\n  virtual void GetGameObjectExtensionRMIData(void\
  \ **ppRMI, size_t *nCount) { return CMyGameObjectExtension::GetGameObjectExtensionRMIData(ppRMI,\
  \ nCount); }\n};\n```\n\n**[ 68 ]**\n\n*第 3 章*\n\n现在你创建了游戏对象扩展实现以及游戏对象创建器，只需注册扩展：`static\
  \ SMyGameObjectExtensionCreator creator;`\n`gEnv->pGameFramework->GetIGameObjectSystem()->RegisterExtension(\"\
  MyGameObjectExtension\", &creator, myEntityClassDesc);`\n\n通过向 `IGameObjectSystem::RegisterExtension`\
  \ 传递实体类描述，你是在让它为你创建一个实体类。如果你已经这样做了，只需将最后一个参数 `pEntityCls` 设置为 `NULL` 即可使用你之前注册的类。\n\
  \n**激活我们的扩展**\n\n为了激活你的游戏对象扩展，你需要在实体生成后调用 `IGameObject::ActivateExtension`。一种方法是使用实体系统同步\
  \ `IEntitySystemSink` 并监听 `OnSpawn` 事件。\n\n我们现在已经注册了自己的游戏对象扩展。当实体生成时，我们的实体系统同步的\
  \ `OnSpawn` 方法将被调用，允许我们创建游戏对象扩展的实例。\n\n**总结**\n\n\n\n\n在本章中，我们学习了核心实体系统是如何实现和暴露的，并创建了我们自己的自定义实体。\n\
  \n现在你应该已经熟悉了为实体创建伴随流节点（flownodes）的过程，并掌握了关于游戏对象及其扩展的相关性知识。\n\n在随后的章节中，我们将介绍现有的游戏对象扩展和实体实现，例如通过创建我们自己的参与者（actor）并实现基础人工智能（AI）。\n\
  \n如果你想更深入地熟悉实体系统，为什么不尝试自己创建一个稍微复杂一点的实体呢？\n\n在下一章中，我们将介绍游戏规则系统。\n\n# [ 69 ]\n\n#\
  \ 游戏规则 (Game Rules)\n\n参与者（Actors）和实体（entities）是游戏中不可或缺的组成，但游戏规则是将它们连接在一起的纽带。游戏规则系统管理所有的初始玩家事件，例如\
  \ `OnConnect`、`OnDisconnect` 和 `OnEnteredGame`。\n\n使用游戏规则系统，我们可以创建自定义的游戏流程，以控制并将我们的游戏机制结合在一起。\n\
  \n在本章中，我们将：\n\n- 学习游戏模式（game mode）的基本概念\n- 在 C++ 中创建我们的 `IGameRules` 实现\n- 使用 Lua\
  \ 和 C# 编写游戏规则脚本\n\n## 游戏规则简介\n\n在思考一个游戏时，我们通常会将注意力引向游戏机制，例如死亡处理和游戏结束条件。根据我们在之前章节中学习的知识，我们实际上无法实现这一点，因为每个实体和参与者都没有影响一个更宏大的方案。\n\
  \n游戏规则的作用顾名其义：控制游戏的规则。规则可以很简单，例如当一个参与者射击另一个参与者时会发生的规则；也可以很复杂，例如回合的开始和结束。\n\nCryEngine\
  \ 的游戏规则实现围绕两个听起来非常相似但实际上大不同的类型展开：\n\n- **游戏规则 (Game rules)**：此实现是通过 C++ 中的 `IGameRules`\
  \ 接口完成的，它处理诸如 `OnClientConnect` 和 `OnClientDisconnect` 等回调。\n\n*游戏规则 (Game Rules)*\n\
  \n- **游戏模式 (Game mode)**：它依赖于游戏规则的实现，但通过参与者生成和击杀条件等游戏条件对其进行了扩展。例如，我们可以有两个游戏模式：`SinglePlayer`（单机）和\
  \ `DeathMatch`（击斗模式），它们都依赖于 `IGameRules` 实现提供的默认行为，但每个模式都增加了额外的功能，例如支持多个玩家。\n\n\
  ## IGameRules 接口 – 游戏规则\n\n在`第 3 章`《创建和利用自定义实体》结束时，我们学习了游戏对象扩展。我们将在本章中利用这些知识来实现\
  \ To `IGameRules`，这是一种用于初始化游戏上下文并将游戏机制结合在一起的游戏对象扩展。\n\n务必记住，当前激活的游戏模式是一个实体。\n\n\
  这有时可能会通过请求实体事件被滥用。例如，在 Crytek 的游戏《孤星危机》（Crysis）中，一种常见的黑客手段围绕向游戏模式发送子弹或击杀事件展开。这本质上“杀死”了游戏规则实体，并导致服务器硬崩溃。\n\
  \n`IGameRules` 实现通常负责游戏模式最基础的行为，并将所有其他内容转发给其 C# 或 Lua 脚本。\n\n## 脚本 – 游戏模式\n\n在注册我们的\
  \ `IGameRules` 实现后，我们需要注册一个利用它的游戏模式。这是通过 `IGameRulesSystem::RegisterGameRules` 函数完成的（通常在\
  \ `IGame::Init` 内部完成）。\n\n```cpp\npGameRulesSystem->RegisterGameRules(\"MyGameMode\"\
  , \"GameRules\");\n```\n处理完之前的代码段后，游戏规则系统将感知到我们的游戏模式。当 `sv_gamerules` 控制台变量变为 `MyGameMode`\
  \ 时，系统将创建一个新实体并激活其名为 `GameRules`（在上一节中注册）的游戏对象扩展。\n\n控制台变量 `sv_gamerules` 在 CryENGINE\
  \ 启动时被设置为 `sv_gamerulesdefault` 的值，除非运行在专用服务器上。\n\n此时，游戏将自动在 `Scripts/GameRules/`\
  \ 目录下搜索与你的游戏模式同名的 Lua 脚本。对于之前的代码段，它将找到并加载 `Scripts/GameRules/MyGameMode.lua`。\n\n\
  # [ 72 ]\n\n*第 4 章*\n\n(等待，文本继续...)\n\n## 加载关卡\n\n当使用 `map` 控制命令加载关卡时，游戏框架会在 `Game/Levels`\
  \ 搜索关卡。\n\n通过使用 `IGameRulesSystem::AddGameRulesLevelLocation`，我们可以在 `Game/Levels`\
  \ 中添加子目录，在寻找新关卡时会搜索这些目录。例如：\n\n```cpp\ngEnv->pGameFramework->GetIGameRulesSystem()->AddGameRulesLevelLocation\
  \ (\"MyGameMode\", \"MGM_Levels\");\n```\n当在 `sv_gamerules` 设置为 `MyGameMode` 时加载关卡，游戏框架现在会在\
  \ `Levels/MGM_Levels/` 目录下搜索关卡目录。\n\n这允许将特定模式的关卡移动到 `Game/Levels` 目录下的子目录，使得按游戏模式分类关卡变得简单得多。\n\
  \n## 实现游戏规则接口\n\n现在我们已经知道了游戏规则系统的基本工作原理，我们可以尝试创建一个自定义的 `IGameRules` 实现。\n\n在开始之前，考虑你的游戏是否真的需要自定义的\
  \ `IGameRules` 实现。随 `CGameRules` 带的默认 `GameDLL` 是专门用于**第一人称射击游戏** (****FPS**) 的\
  \ `IGameRules` 实现。如果你的游戏设定与 FPS 类似，或者你可以重用现有的功能，这可能比从头编写一个实现更好。\n\n为了开始，我们需要创建两个新文件：`GameRules.cpp`\
  \ 和 `GameRules.h`。\n\n完成后，打开 `GameRules.h` 并创建一个新类。\n\n我们将我们的命名为 `GameRules`。\n\n\
  # [ 73 ]\n\n*游戏规则 (Game Rules)*\n\n类就绪后，我们必须派生 `IGameRules`。正如之前提到的，游戏规则作为游戏对象扩展处理的。因此，我们必须使用\
  \ `CGameObjectHelper` 模板类：\n\n```cpp\nclass CGameRules: public CGameObjectHelper<CGameRules,\n\
  ```\n\n第三个可选 `CGameObjectHelper` 参数定义了该游戏对象支持的 RMI。我们将在*第 8 章**网络*中进一步讨论它。\n\n类存在后，我们可以开始实现\
  \ `IGameRules` 和 `IGameObjectExtension` 结构体中定义的虚方法。与实体一样，我们可以实现返回无、`nullptr`、零、`false`\
  \ 或空字符串的函数。需要单独处理的方法如下：\n\n| 函数名 | 描述 |\n| :--- | :--- |\n| `IGameObjectExtension::Init`\
  \ | 初始化游戏对象扩展。应调用 `IGameRulesSystem::SetCurrentGameRules(this)` |\n| `IGameRules::OnClientConnect`\
  \ | 当新客户端连接时在服务器上调用，必须使用 `IActorSystem::CreateActor` 创建新参与者 |\n| `IGameRules::OnClientDisconnect`\
  \ | 当客户端断开时在服务器上调用，必须包含对 `IActorSystem::RemoveActor` 的调用 |\n| `IGameObjectExtension::Release`\
  \ | Release 函数应删除实例并在析构函数中调用 `IGameRulesSystem::SetGameRules(nullptr)` |\n\n## 注册游戏对象扩展\n\
  \n完成后，使用 `REGISTER_FACTORY` 宏注册游戏规则实现。\n\n游戏对象扩展必须在游戏初始化早期注册，因此最常见是在 `IGame::Init`\
  \ 函数中完成（通过默认 GameDLL 中的 `GameFactory.cpp`）：\n\n```cpp\nREGISTER_FACTORY(pFramework,\
  \ \"GameRules\", CGameRules, false);\n```\n\n# [ 74 ]\n\n*第 4 章*\n\n## 创建自定义游戏模式\n\
  \n为了开始，我们需要注册第一个游戏模式。\n\n注意 `IGameRules` 实现与游戏模式本身之间的区别。游戏模式依赖于 `IGameRules` 实现，并单独注册。\n\
  \n\n\n要注册自定义游戏模式，CryENGINE 暴露了 `IGameRulesSystem::RegisterGameRules` 函数：\n\n```\n\
  gEnv->pGameFramework->GetIGameRulesSystem()->RegisterGameRules(\"MyGameMode\", \"\
  GameRules\");\n```\n\n上述代码将创建一个名为 `MyGameMode` 的游戏模式，它依赖于我们之前注册的 `GameRules` 游戏对象扩展。\n\
  \n当加载地图并将 `sv_gamerules` 设置为 `MyGameMode` 时，游戏规则实体将被创建并赋值为 `MyGameMode`。在生成后，我们之前创建的\
  \ `IGameRules` 扩展将被构造。\n\n如果你只是创建现有游戏模式的副本或子类，例如派自 `SinglePlayer.lua` 的默认 `DeathMatch.lua`\
  \ 脚本，你需要单独注册 `DeathMatch` 游戏模式。\n\n## 脚本编程\n\n游戏模式通常是强脚本导向的，生成、杀死和复活等游戏流程被委托给 `Lua`\
  \ 或 `C#` 等次要语言。\n\n### Lua 脚本\n\n由于 `Lua` 脚本已集成到 CryENGINE 中，我们不需要对其进行任何额外的加载即可工作。要访问你的脚本表（基于\
  \ `Game/Scripts/GameRules` 中与你的游戏模式同名的 `Lua` 文件）：`m_script = GetEntity()->GetScriptTable();`\n\
  \n[ 75 ]\n\n*游戏规则*\n\n### 调用方法\n\n要对你的脚本表进行调用方法，请参考 `IScriptSystem::BeginCall` 和\
  \ `EndCall` 函数：\n\n```\nIScriptSystem *pScriptSystem = gEnv->pScriptSystem; pScriptSystem->BeginCall(m_script,\
  \ \"MyMethod\"); pScriptSystem->EndCall();\n```\n\n执行上述代码时，我们将能够执行游戏模式脚本表内部名为 `MyMethod`\
  \ 的函数中的 `Lua` 代码。该表的示例所示：\n\n```\nMyGameMode = { }\n\nfunction MyGameMode:MyMethod()\n\
  \nend\n```\n\n### 带参数调用方法\n\n要为你的 `Lua` 方法提供参数，请在脚本调用的开始和之间之间 `IScriptSystem::PushFuncParam`：\n\
  \n```\npScriptSystem->BeginCall(m_script, name);\n\npScriptSystem->PushFuncParam(\"\
  myStringParameter\"); pScriptSystem->EndCall();\n```\n\n`IScriptSystem::PushFuncParam`\
  \ 是一个模板函数，它尝试使用提供的值创建一个 `ScriptAnyValue` 对象。如果默认的 `ScriptAnyValue` 构造函数不支持你的类型，将会出现编译错误。\n\
  \n恭喜，你现在调用了一个带有字符串参数的 `Lua` 函数：\n\n```\nfunction MyGameMode:MyMethod(stringParam)\n\
  \nend\n```\n\n### 获取从 Lua 返回的值\n\n你也可以通过向 `IScriptSystem::EndCall` 传递额外的参数来获取 `Lua`\
  \ 函数的返回值。\n\n```cpp\nint result = 0;\n\npScriptSystem->EndCall(&result);\n\nCryLog(\"\
  MyMethod returned %i!\", result);\n```\n\n[ 76 ]\n\n*第 4 章*\n\n### 获取表值\n\n有时可能需要直接从\
  \ `Lua` 表获取值，这可以使用 `IScriptTable::GetValue` 完成：\n\n```cpp\nbool bValue = false;\n\
  \nm_script->GetValue(\"bMyBool\", &bValue);\n```\n\n上述代码将在脚本中搜索名为 `bMyBool` 的变量，如果成功，则将其值赋给原生变量\
  \ `bValue`。\n\n### CryMono 脚本\n\n要在你的 `IGameObjectExtension::Init` 实现中创建 `CryMono`\
  \ 脚本实例，请参考 `IMonoScriptSystem::InstantiateScript`：\n\n```\nIMonoObja *pScript =\
  \ GetMonoScriptSystem()->InstantiateScript(GetEntity()->GetClass()->GetName(), eScriptFlag_GameRules);\n\
  ```\n\n此代码将找到与当前游戏模式同名的 `CryMono` 类，并返回它的新实例。\n\n没有同时使用 `Lua` 和 `CryMono` 游戏规则脚本。请决定哪种最适合你的用例。\n\
  \n### 调用方法\n\n现在你已经有了类实例，可以使用 `IMonoObject::CallMethod` 辅助函数调用其中一个函数：\n\n```\nm_pScript->CallMethod(\"\
  OnClientConnect\", channelId, isReset, playerName)\n```\n\n此代码将搜索名为 `OnClientConnect`\
  \ 具有匹配参数的方法并调用它：\n\n```cpp\npublic bool OnClientConnect(int channelId, bool isReset\
  \ = false, string playerName = \"\")\n\n{\n\n}\n```\n\n[ 77 ]\n\n*游戏规则*\n\n### 返回值\n\
  \n`IMonoObject::CallMethod` 默认返回 `mono::object` 类型，代表一个箱的托管对象。要获取原生值，我们必须对其解箱：\n\
  \n```cpp\nmono::object result = m_pScript->CallMethod(\"OnClientConnect\", channelId,\
  \ isReset, playerName);\n\nIMonoObject *pResult = *result;\n\nbool result = pResult->Unbox<bool>();\n\
  ```\n\n### 属性\n\n要获取托管对象中属性的值，请查看 `IMonoObject::GetPropertyValue`：\n\n```cpp\nmono::object\
  \ propertyValue = m_pScript->GetPropertyValue(\"MyFloatProperty\"); if(propertyValue)\n\
  {\n\nIMonoObject *pObject = *propertyValue;\nfloat value = pObject->Unbox<float>();\n\
  }\n```\n\n直接设置属性值也是可能的：\n\n```cpp\nfloat myValue = 5.5f;\n\nmono::object boxedValue\
  \ = GetMonoScriptSystem()->BoxAnyValue(myValue)); m_pScript->SetPropertyValue(\"\
  MyFloatProperty\", boxedValue);\n```\n\n### 字段\n\n以类似于属性的方式获取和设置字段的值，但使用 `IMonoObject`\
  \ 方法 `GetFieldValue` 和 `SetFieldValue`。\n\n### 在 C# 中创建游戏模式\n\n现在你已经有了基础的知识，为什么不这样做呢？为了开始，我们需要实体。\n\
  \n[ 78 ]\n\n*第 4 章*\n\n### 定义我们的意图\n\n让我们明确一下要做什么：\n1. 生成我们的实体。\n2. 将我们的实体分配给一个团队。\n\
  3. 当实体进入游戏时检查。\n\n### 创建实体\n\n我们首先要做的是生成我们的实体。为此，我们需要在 `Game/Scripts` 中创建一个 `MyActor.cs`\
  \ 文件并添加：\n\n```public class MyActor : Actor\n```\n\n此代码片段是实体所需的最小配置。\n\n我们还应该更新实体的视图，以确保玩家进入游戏时能看到内容。\n\
  \n```csharp\nprotected override void UpdateView(ref ViewParams viewParams)\n\n{\n\
  \nvar fov = MathHelpers.DegreesToRadians(60);\n\nviewParams.FieldOfView = fov;\n\
  \nviewParams.Position = Position;\n\nviewParams.Rotation = Rotation;\n\n}\n```\n\
  \n上述代码将简单地将相机设置为玩家的位置和旋转。要了解更多关于创建实体和视图的信息，请参考 *自定义实体*。\n\n现在我们已经有了实体，可以继续创建游戏模式：\n\
  \n```csharp\npublic class ReachThequarters : CryEngine.GameRules\n```\n\n[ 79 ]\n\
  \n*游戏规则*\n\n与 `Scripts/` 目录中的所有 CryMono 类型一样，我们的游戏模式将在 CryENGINE 启动时自动注册，紧随 `IGameFramework::Init`\
  \ 调用之后。\n\n在创建特定游戏逻辑之前，我们必须确保实体在实体连接时被创建。为此，我们实现一个 `OnClientConnect` 方法：\n\n```csharp\n\
  public bool OnClientConnect(int channelId, bool isReset = false, string playerName\
  \ = \"Dude\")\n{\n    // 只有服务器可以创建实体。\n    if (!Game.IsServer)\n        return false;\n\
  \n    var actor = Actor.Create<MyActor>(channelId, playerName);\n    if (actor ==\
  \ null)\n    {\n        Debug.LogWarning(\"创建玩家失败.\");\n        return false;\n\
  \    }\n\n    return true;\n}\n```\n\n然而，由于脚本函数不是自动化的，我们需要修改 `IGameRules` 实现中的 `OnClientConnect`\
  \ 方法，以便在 C# 中接收此回调：\n\n```cpp\nbool CGameRules::OnClientConnect(int channelId, bool\
  \ isReset)\n{\n    const char *playerName;\n    if (gEnv->bServer && gEnv->bMultiplayer)\n\
  \    {\n        if (INetChannel *pNetChannel = gEnv->pGameFramework->GetNetChannel(channelId))\n\
  \            playerName = pNetChannel->GetNickname();\n    }\n    else\n       \
  \ playerName = \"Dude\";\n\n    return m_pScript->CallMethod(\"OnClientConnect\"\
  , channelId, isReset, playerName) != 0;\n}\n```\n\n\n\n\n记住，游戏模式的 `OnClientConnect`\
  \ 被调用的非常早，就在新客户端连接到服务器的那个点。如果在 `OnClientConnect` 退出后，指定的 `channelId` 还没有创建 actor，游戏将抛出致命错误。\n\
  \n### 生成 actor (Spawning the actor)\n\n现在客户端连接会创建 actor，但实际上如何将 actor 移动到 `SpawnPoint`\
  \ 呢？首先，在 `Scripts` 目录任何地方创建一个新的 `SpawnPoint.cs` 文件：\n\n```csharp\n[Entity(Category\
  \ = \"Others\", EditorHelper = \"Editor/Objects/spawnpointhelper.cgf\")]\npublic\
  \ class SpawnPoint : Entity\n{\n    public void Spawn(EntityBase otherEntity)\n\
  \    {\n        otherEntity.Position = this.Position;\n        otherEntity.Rotation\
  \ = this.Rotation;\n    }\n}\n```\n\n重启编辑器后，该实体应该会出现在 `RollupBar` 中。我们将调用 `spawnPoint.Spawn`\
  \ 函数来生成我们的 actor。\n\n首先，我们需要打开 `ReachTheHeadquarters` 类并添加一个新的 `OnClientEnteredGame`\
  \ 函数：\n\n```csharp\npublic void OnClientEnteredGame(int channelId, EntityId playerId,\
  \ bool reset)\n{\n    var player = Actor.Get<MyActor>(channelId); \n    if (player\
  \ == null)\n    {\n        Debug.LogWarning(\"Failed to get player\"); \n      \
  \  return;\n    }\n\n    var random = new Random();\n    // 获取所有类型为 SpawnPoint 的生成实体\n\
  \    var spawnPoints = Entity.GetByClass<SpawnPoint>();\n\n    // 获取一个随机的生成点\n \
  \   var spawnPoint = spawnPoints.ElementAt(random.Next(spawnPoints.Count())); \n\
  \    if(spawnPoint != null)\n    {\n        // 找到了！在这里生成玩家。\n        spawnPoint.Spawn(player);\n\
  \    }\n}\n```\n\n此函数会在客户端进入游戏时被调用。在 `Launcher` 模式下，这通常发生在玩家完成加载之后；而在编辑器中，它在玩家通过\
  \ `Ctrl` + `G` 切换到 `pure game mode` 时被调用。\n\n在目前的状态下，我们将首先获取玩家的 `MyActor` 实例，然后在随机选择的\
  \ `SpawnPoint` 处生成。\n\n不要忘记在你的 `IGameRules` 实现中调用脚本的 `OnClientEnteredGame` 函数！\n\
  \n### 处理断线 (Handling disconnections)\n\n我们还必须确保在玩家断线时移除 actor：\n\n```csharp\npublic\
  \ override void OnClientDisconnect(int channelId)\n{\n    Actor.Remove(channelId);\n\
  }\n```\n\n不要忘记在你的 `IGameRules` 实现中调用 `OnClientConnect` 函数！\n\n如果在断线后没有移除玩家，会导致 actor\
  \ 持续留在游戏世界中，并且由于关联玩家不再连接到服务器，可能会出现更严重的问题。\n\n### 第 4 章：将玩家分配到队伍 (Assigning the player\
  \ to a team)\n\n现在玩家可以连接并生成了，让我们来实现一个基础的队伍系统，以便跟踪每个玩家所属队伍。\n\n首先，为我们的游戏模式添加一个新的的\
  \ `Teams` 属性：\n\n```csharp\npublic virtual IEnumerable<string> Teams\n{\n    get\n\
  \    {\n        return new string[] { \"Red\", \"Blue\" };\n    }\n}\n```\n\n这段代码简单决定了我们的游戏模式允许哪些队伍，在我们的情况下是红色和蓝色。\n\
  \n现在，让我们也为 `MyActor` 类添加新属性，以确定 actor 所属的队伍：\n\n```csharp\npublic string Team {\
  \ get; set; }\n```\n\n太棒了！然而，我们还需要将相同的代码添加到 `SpawnPoint` 实体中，以避免将同一队伍的玩家生成在一起。\n\
  \n完成后完成后，打开 `ReachTheHeadquarters` 游戏模式类并导航到我们之前创建的 `OnClientEnteredGame` 函数。我们要做的是扩展\
  \ `SpawnPoint` 的选择，只使用属于玩家队伍的点。\n\n查看以下代码片段：\n\n```csharp\n// 获取所有类型为 SpawnPoint\
  \ 的生成实体\nvar spawnPoints = Entity.GetByClass<SpawnPoint>();\n```\n\n现在将此片段替换为以下内容：\n\
  \n```csharp\n// 获取所有属于玩家队伍的 SpawnPoint 类型生成实体\nvar spawnPoints = Entity.GetByClass<SpawnPoint>().Where(x\
  \ => x.Team == player.Team);\n```\n\n这将自动移除所有 `Team` 属性不等于玩家的 `SpawnPoints`。\n\n\
  等一下，我们还必须将玩家分配到一个队伍！为此，在获取 `SpawnPoints` 之前添加以下内容：\n\n```csharp\nplayer.Team = Teams.ElementAt(random.Next(Teams.Count()));\n\
  ```\n\n当玩家进入游戏时，我们将选择一个随机队伍分配给他们。如果你愿意，为什么不扩展此功能以确保队伍始终平衡？例如，如果红色队伍比蓝色队伍多两个玩家，则不允许新玩家加入红色队伍。\n\
  \n在继续之前，请随意尝试当前的设置。你应该能够在游戏内生成生成了！\n\n### 实现总部 (Implementing Headquarters)\n\n最后，让我们开始创建游戏结束条件：总部（Headquarters）。简单来说，每个队伍将有一个\
  \ `Headquarters` 实体，当玩家进入对方的总部时，该玩家所在的队伍获胜。\n\n#### 添加游戏结束事件\n\n在创建 `Headquarters`\
  \ 实体之前，为我们的 `ReachTheHeadquarters` 类添加一个新的的 `EndGame` 函数：\n\n```csharp\npublic void\
  \ EndGame(string winningTeam)\n{\n    Debug.LogAlways(\"{0} won the game!\", winningTeam);\n\
  }\n```\n\n我们将从 `Headquarters` 实体中调用它，以通知游戏模式游戏应该结束。\n\n#### 创建总部实体\n\n现在我们需要创建 `Headquarters`\
  \ 实体。该实体将通过 `Sandbox` 放置在每个关卡中，每个队伍一个。我们将暴露三个 `Editor` 属性：`Team`、`Minimum` 和 `Maximum`：\n\
  \n- `Team`：决定 `Headquarters` 实例属于哪个队伍，在我们的情况下是蓝色或红色。\n- `Minimum`：指定触发区域的最小尺寸。\n\
  - `Maximum`：指定触发区域的最大尺寸。\n\n```csharp\npublic class Headquarters : Entity\n{\n \
  \   public override void OnSpawn()\n    {\n        TriggerBounds = new BoundingBox(Minimum,\
  \ Maximum);\n    }\n    protected override void OnEnterArea(EntityId entityId, int\
  \ areaId, EntityId areaEntityId)\n    {\n    }\n\n    [EditorProperty]\n    public\
  \ string Team { get; set; }\n\n    [EditorProperty]\n    public Vec3 Minimum { get;\
  \ set; }\n\n    [EditorProperty]\n    public Vec3 Maximum { get; set; }\n}\n```\n\
  \n很好！现在只需扩展 `OnEnterArea` 方法，在游戏应该结束时通知我们的游戏模式：\n\n```csharp\nprotected override\
  \ void OnEnterArea(EntityId entityId, int areaId, EntityId areaEntityId)\n{\n  \
  \  var actor = Actor.Get<MyActor>(entityId); \n    if (actor == null)\n        return;\n\
  \n    if (actor.Team != Team)\n    {\n        var gameMode = CryEngine.GameRules.Current;\n\
  \        var rthGameRules = gameMode as ReachTheHeadquarters;\n        if (rthGameRules\
  \ != null)\n            rthGameRules.EndGame(actor.Team);\n    }\n}\n```\n\n`Headquarters`\
  \ 实体现在会在对方实体进入时通知游戏模式。\n\n### 旁路——触发边界与实体区域 (Detour – trigger bounds and entity\
  \ areas)\n\n实体可以通过注册区域来接收回调。这可以通过将实体与形状实体链接或手动创建触发代理来实现。在 C# 中，我们可以像之前的代码片段那样通过设置\
  \ `EntityBase.TriggerBounds` 属性来手动创建代理。\n\n当实体位于区域内部或附近时，它将开始在该实体上接收事件。这允许创建特定的实体以跟踪玩家何时以及何时进入特定区域。\n\
  \n查看下表获取可用回调列表，可以通过 C++ 实体事件和 C# `Entity` 类中的虚函数接收：\n\n| 回调名称 | 说明 |\n| :--- | :---\
  \ |\n| `OnEnterArea` | 当实体进入与其链接的区域时调用。 |\n| `OnLeaveArea` | 当位于与其链接的区域内的实体离开时触发。\
  \ |\n| `OnEnterNearArea` | 当实体移动到与其链接的区域附近时触发。 |\n| `OnMoveNearArea` | 当实体与其链接的区域附近移动时调用。\
  \ |\n| `OnLeaveNearArea` | 当实体离开与其链接的区域附近时调用。 |\n| `OnMoveInsideArea` | 当实体重新定位到与其链接的区域内部时触发。\
  \ |\n\n\n\n\n基础示例现在已完成，但需要一些微调才能运行！首先，我们需要创建一个新关卡，并为每个团队放置 `Headquarters`（总部）。\n\
