  \n\n\n\n\n\n\n\n\n\n\n# 流程图 (Flowgraph)\n\nCryENGINE flowgraph 是一种强大的基于节点的可视化脚本系统，帮助开发人员快速原型化并创建特定关卡的逻辑，而无需处理复杂的代码库。\n\
  \n在本章中，我们将：\n\n*   讨论流程图（flowgraphs）的概念\n*   创建新的流程图\n*   调试我们的流程图\n*   在 Lua、C#\
  \ 和 C++ 中创建自定义流程图节点 (`flownode`)\n\n## 流程图的概念\n\n多年来，编写代码一直是创建游戏行为和逻辑的主要方法，甚至可以说是唯一的方法。让我们以一个关卡设计师为例，他正在为最新的游戏作品构建一个战斗区域。\n\
  \n按照传统做法，该设计师必须要求程序员来为这个场景创建逻辑。这导致了几个问题：\n\n*   它造成了设计与实现之间的脱节\n*   程序员被迫花费本该由设计师负责的工作时间\n\
  *   设计师对其/她的章节的运行效果没有即时反馈\n\n![](img/index-43_1.jpg)\n\n*使用流程图进行可视化脚本编程*\n\n这就是\
  \ CryENGINE 的 `flowgraph`（通常被称为 `FG`）所解决的问题。\n\n它提供了一组 `flownodes`，最好将其视为方便的逻辑乐高积木，设计师可以利用它们拼凑出整个场景。不再需要向游戏代码团队提出请求；设计师可以立即实现他们的想法！我们稍后会详细讨论创建节点本身，但现在，让我们来看一些简单的流程图，这样你就可以迈出进入\
  \ CryENGINE 游戏逻辑的第一步！\n\n## 打开流程图编辑器\n\n要开始，我们需要打开 Sandbox。Sandbox 包含了流程图编辑器作为其许多有用工具之一，可以通过\
  \ `View` | `Open View Pane` 打开它。\n\n在打开流程图编辑器时，你应该始终加载了一个关卡，因为 `flowgraph`s 是关卡特有的。如果你忘记了如何创建新关卡，请翻回\
  \ *第 1 章*，*引言与设置*！\n\n你刚刚访问了你的第一个 Sandbox 工具！你将看到一个带有许多子部分和功能的新窗口，但不要担心，让我们逐个解决它们吧。\n\
  \n**[ 24 ]**\n\n![](img/index-44_1.png)\n\n*第 2 章*\n\n## 流程图编辑器浏览\n\n流程图以 XML 文件的格式保存在磁盘上，但可以由流程图编辑器解析和编辑，以便为游戏逻辑创建过程提供可视化界面。\n\
  \n**[ 25 ]**\n\n![](img/index-45_1.png)\n\n*使用流程图进行可视化脚本编程*\n\n### 组件\n\n编辑器的此部分包含项目中的所有\
  \ `flownodes`，并组织成整齐的类别。让我们快速查看一下，打开 `Misc` 文件夹。你会看到一组分配到类别的节点：`Terminology`（术语）。\n\
  \n*   **Graph (图)**：指的是包含一组相互链接的节点的上下文。\n*   **Node (节点)**：这是类的可视化表示，可以从输入端口接收数据和事件，并通过其输出端口发送数据。它与图中的其他节点连接以创建逻辑。\n\
  *   **Port (端口)**：这是函数的可视化表示。节点可以指定多个输入和输出端口，然后从它们发送或接收事件。\n\n### 组件类别\n\n你在这里可能缺少了标记为\
  \ `Debug` 的节点；CryENGINE 为节点分配类别，以指示它们合适的使用位置。\n\n*   **Release (发布)**：此节点适用于生产环境。\n\
  *   **Advanced (高级)**：虽然此节点适用于生产环境，但在某些情况下它可能有复杂的行为。\n*   **Debug (调试)**：此节点应仅用于内部测试。\n\
  *   **Obsolete (废弃)**：不应使用此节点，且此节点在组件列表中可见。\n\n**[ 26 ]**\n\n![](img/index-46_1.png)\n\
  \n![](img/index-46_2.png)\n\n*第 2 章*\n\n例如，当你处理一个打算向公众发布的关卡时，你可能不想意外包含任何 `Debug`\
  \ 节点！我们可以通过 `View` | `Components` 在流程图编辑器内部启用或禁用前三个类的显示：\n\n### 流程图类型\n\n在创建新的流程图之前，我们想知道我们的目的与什么类型最相关。不同类型的流程图允许专门化，例如创建处理玩家用户界面布局和绘制的\
  \ `UI graphs`。\n\n**[ 27 ]**\n\n*使用流程图进行可视化脚本编程* **AI Actions (AI 动作)**\n\n这些是你可以创建的流程图，用于将\
  \ AI 行为封装成方便的节点，以便在其他地方复用。我们将在你学习 `人工智能` (`AI`) 后后讨论这些。\n\n**UI Actions (UI 动作)**\n\
  \nCryENGINE 允许你通过 UI 事件系统使用流程图来编写用户界面和游戏内抬头显示器（HUD）。我们将在 *第 7 章*，*用户界面*中讨论这些。\n\n\
  **Material FX (材质特效)**\n\nCryENGINE 支持设计师方便编辑的流程图，用于控制如何处理材质事件，例如，当附近被射击时，产生一个尘粒子并用一层灰尘遮挡玩家的屏幕。\n\
  \n**FG Modules (FG 模块)**\n\n你可以将流程图封装成方便的模块，以便在不同情况下进行复用。我们稍后会详细描述这些。\n\n**Entities\
  \ (实体)**\n\n这是我们在本章中花费大部分时间的地方！90% 的情况下，流程图会被分配给实体（也称为 `graph entity`），并且这发生在游戏世界中。\n\
  \n**Prefabs (预制件)**\n\nCryENGINE 支持预制件，即将实体打包成单个文件的集合。预制件中的任何流程图将显示在此文件夹中。\n\n###\
  \ 创建流程图\n\n现在我们对流程图编辑器的工作原理有了基本了解，让我们开始创建第一个流程图吧！你可以先关闭流程图编辑器。\n\n**[ 28 ]**\n\n\
  ![](img/index-48_1.png)\n\n*第 2 章*\n\n## 流程图实体\n\n流程图实体是一种极其轻量的 CryENGINE 对象，用于不需要应用于特定实体的流程图。像所有实体一样，可以在\
  \ Sandbox 的 `Rollbar` 中找到它。\n\n如果你不什么是实体，请跳过此节直到阅读 *第 3 章*，*创建和利用实体*。\n\n### 实例化\
  \ FlowgraphEntity\n\n选择 `FlowgraphEntity`，然后双击视图或将其拖入。你现在会在 `Rollbar` 中看到一组全新的选项，包括实体参数，但对我们最重要的是\
  \ `Entity:` `FlowgraphEntity` 部分。\n\n**[ 29 ]**\n\n![](img/index-49_1.png)\n\n*使用流程图进行可视化脚本编程*\n\
  \n### 附加新流程图\n\n在 `Entity:` `FlowgraphEntity` 部分中，我们需要找到 `Flow Graph` 子部分，然后点击 `Create`\
  \ 按钮：从这里，你将获得将流程图分配到组的选项。\n\n现在现在这样做并不真的重要，但它对于将相关的流程图分组很有用，特别是在处理较大的项目时。组用于为流程图创建结构，允许开发人员将不同的流程图分类到文件夹中。一旦完成，你应该看到流程图编辑器出现，背景上覆盖着的网格。我们现在可以开始创建逻辑了！\n\
  \n## 向流程图中添加节点\n\n向新图添加节点的最简单方法浏览 `Components` 列表并拖入新节点。然而，如果你知道要添加的节点名称，这种方法并不高效。因此，你也可以在流程图编辑器内部使用\
  \ `Q` 快捷键调出搜索功能，然后输入你想添加的节点名称。\n\n在我们的案例中，我们将从 `Misc:Start` 节点开始，这是一个在关卡加载或启动编辑器测试会议时触发其他事件的简单节点：\n\
  \n**[ 30 ]**\n\n![](img/index-50_1.png)\n\n![](img/index-50_2.png)\n\n\n\n\n\n#\
  \ 第 2 章\n\n## 输入和输出端口\n\n节点放置后，你将看到你的第一个节点输入和输出端口示例。在这种情况下，我们有两个输入值 `InGame` 和 `InEditor`，以及一个输出端口，在本例中方便地命名为\
  \ `output`：输入端口用于向节点提供数据或触发事件，而输出端口则用于将数据和事件传递给图中的其他节点。在这个示例中，可以编辑 `Misc:Start`\
  \ 节点来定义它实际在哪些游戏上下文中执行。可能你 own 了一些只想在编辑器（Editor）运行运行调试逻辑，这种情况下我们可以将 `InGame` 设置为\
  \ false 或 0。\n\n## 端口类型\n\n为了指定端口处理什么类型的数据，我们需要知道端口类型。在 Flowgraph 编辑器中，我们可以通过颜色来判断端口的类型。\n\
  \n以下是可用端口类型的列表：\n\n- **Void（空）**：用于不传递特定值的端口，但通过激活来发出信号。\n- **Int（整数）**：用于端口仅接收整数值。\n\
  - **Float（浮点数）**：用于表示端口处理浮点值。\n\n**[ 31 ]**\n\n![](img/index-51_1.png)\n\n*Visual\
  \ Scripting with Flowgraph*\n\n- **EntityId（实体 ID）**：表示端口期望一个实体标识符。（有关实体 ID 的更多信息，请参考*第\
  \ 3 章：创建和利用自定义实体*）\n- **Vec3（三维向量）**：用于处理三维向量的端口。\n- **String（字符串）**：在此，端口期望一个字符串。\n\
  - **Bool（布尔）**：用于端口期望 true 或 false 的布尔值。连接不同类型的端口将导致值的自动转换。\n\n## 目标实体\n\nFlownodes\
  \ 可以包含一个目标实体，允许用户将当前关卡中的实体链接到 flownode。这对于旨在影响游戏世界中实体的节点非常有用，例如，截图所示，`Entity:GetPos`\
  \ 节点获取指定实体的世界变换。\n\n我们也可以通过将 `EntityId` 输出端口连接到 `Choose Entity`（选择实体）端口来动态指定实体。\n\
  \n将实体分配给支持该特性的节点有两种方法：\n\n- 通过将另一个 flownodes 的 `EntityId` 输出连接到 `Choose Entity`\
  \ 输入\n- 通过右键点击 `Choose Entity` 输入并选择：\n    - **Assign selected entity（分配已选实体）**：将节点链接到编辑器视口中当前选中的实体\n\
  \    - **Assign graph entity（分配图实体）**：将节点链接到该图表所分配的实体\n\n**[ 32 ]**\n\n![](img/index-52_1.png)\n\
  \n![](img/index-52_2.png)\n\n*第 2 章*\n\n## 连接 flownodes\n\n单个 flownode 的功能有限；让我们连接两个，并构建一个真正的图表！\n\
  \n为了演示，我们将使用 `Time:TimeOfDay` 节点：要像上一个截图所示在端口之间创建链接，只需点击输出端口，并按住鼠标键将光标拖动到输入端口。释放鼠标，连接就会建立！\n\
  \n我们还修改了 `Time` 输入端口的值；输入端口可以通过输出端口提供数据，也可以直接在编辑器中编辑其值。要此操作，只需点击节点并查看 Flowgraph\
  \ 编辑器中的 `Inputs`（输入）部分。从那里，你可以简单地编辑值：\n\n你还可以看到关于节点的价值信息：例如，在这里我们可以看到此节点用于设置一天的时间以及游戏中时间流逝的速度。\n\
  \n**[ 33 ]**\n\n*Visual Scripting with Flowgraph* 完成此后，你现在可以关闭 Flowgraph 编辑器。Flowgraphs\
  \ 不需要手动保存；它们会随关卡自动保存。\n\n尽管 flowgraphs 会随关卡保存，但经常使用 `File` | `Save` 手动保存是一个好习惯，以免丢失工作。\n\
  \n## 测试我们的 flowgraph\n\n正如我们在上一章中学到的，使用 Sandbox 在 CryENGINE 中测试逻辑非常简单。只需按下 `Ctrl`\
  \ + `G` 快捷键，观察你进入游戏模式。现在，当你这样做时，你应该看到关卡的照明和整体氛围发生了变化，因为你刚刚改变了时间！\n\n恭喜你，你刚刚迈出了使用\
  \ CryENGINE 创建游戏的第一步！现在看起来并不多，但让我们这个图表多做一些事情。\n\n## 常用 flownode 概述\n\n为了让事情变得复杂一点，我们需要了解\
  \ CryENGINE 默认为我们提供了哪些节点。\n\n## 构建时钟\n\n我们能够访问的最实用的节点之一（至少对于调试目的）是 `HUD:DisplayDebugMessage`\
  \ 节点。它允许你在游戏窗口中显示信息，并可以选择带有超时时间。基于此，让我们根据之前学到的时间信息构建一个简单的调试时钟。\n\n`Time:TimeOfDay`\
  \ 节点输出 CryENGINE 时间格式的当前时间，其定义为小时加上分钟除以 60。例如，下午 1:30 在 CryENGINE 时间中表示为 13.5。我们现在知道我们需要一些数学运算，所以是时候检查\
  \ Math flownode 类别了。\n\n我们将做的第一件事是通过通过向下取整当前时间来获取小时。要执行此操作，放置 `Math:Floor`，然后连接\
  \ `Time:TimeOfDay` 的输出到 `A`。\n\n**[ 34 ]**\n\n![](img/index-54_1.png)\n\n![](img/index-54_2.png)\n\
  \n*第 2 章*\n\n进入游戏，你应该看到小时。然后我们需要从原始值中减去数值以获取分钟。要执行此操作，我们需要 `Math:Sub` 从原始值中减去。之后，`Math:Mul`\
  \ 节点将新时间放大 60，所以你的图表应该是这样的：\n\n**[ 35 ]**\n\n![](img/index-55_1.png)\n\n*Visual\
  \ Scripting with Flowgraph*\n\n## 监听玩家输入\n\n如果现在我们想允许玩家测试不同的时间呢？通常情况下，这是设置按键监听最简单的方法，我们在按下特定键时触发事件。CryENGINE\
  \ 经常将此功能很好地封装在一个节点中，即 `Input:Key`。\n\n让我们现在设置，使得按下 `P` 键会让时间移动得极快，而再次按下 `O` 则会让它停止。`Input:Key`\
  \ 节点是一个调试节点。在生产环境中使用调试节点通常被认为是坏习惯，因为可能会出现意外结果，所以请不要将此节点用于实际游戏逻辑\n\n我们需要设置 `Time:TimeOfDay`\
  \ 节点的 `Speed` 值，但在这种情况下，我们还需要输入两个值！我们使用两个键节点调用 `Math:SetNumber` 节点，然后 `Logic:Any`\
  \ 节点会将信息传递给 `Time:TimeOfDay` 节点，同时调用 `SetSpeed`：进入游戏，按下 *P* 开始时间移动！再次按下 *O*，时间应该应该冻结。\n\
  \n## 循环执行\n\n你可能注意到我们的时钟不再正确更新了。这是因为大多数节点在未被触发时不会输出数据；在这种情况下，如果不触发 `GetTime` 或 `SetTime`，我们将得任何输出。我们有两种调用它的方法：我们可以使用\
  \ `Time:Time` 每每一帧执行一次，或者使用 `Time:Timer`。\n\n**[ 36 ]**\n\n![](img/index-56_1.png)\n\
  \n\n\n\n后者可以控制 `tick` 的粒度，在这种情况下，我们可能希望它在快速移动时每帧都更新，所以让我们保持简单吧。将 `tick` 输出连接到我们的\
  \ `GetTime` 输入，我们的时钟应该就能再次正确更新了！\n\n## Flowgraph 模块\n\n流程图模块系统允许将流程图导出为模块，该模块可以从另一个图表触发。\n\
  \n通过创建模块，我们可以在多个关卡中复用逻辑，而无需维护多个版本的相同图表。我们还可以在模块之间发送和接收唯一数据，从而以非常模块化的方式实现动态逻辑。\n\n\
  ### [ 37 ]\n\n![](img/index-57_1.jpg)\n\n![](img/index-57_2.png)\n\n*使用 Flowgraph\
  \ 进行视觉化脚本*\n\n## 创建模块\n\n要开始创建你自己的模块，打开 Flowgraph 编辑器并选择 `File`（文件） | `New FG Module...`\
  \ | `Global`：\n\n在生成的 `Save`（保存）对话框中，用你选择的名称保存模块。然后你将看到模块的默认视图：\n\n模块默认包含两个节点；`Module:Start_MyModule`\
  \ 和 `Module:End_MyModule`。\n\n- `Module:Start_MyModule` 包含三个输出端口：\n    - `Start`：当模块被加载时被调用\n\
  \n### [ 38 ]\n\n![](img/index-58_1.png)\n\n*第 2 章*\n\n    - `Update`：当模块应该更新时被调用\n\
  \    - `Cancel`：当模块应该取消时被调用，它默认连接到 `Module:End_MyModule` 的 `Cancel` 输入\n- `Module:End_MyModule`\
  \ 包含两个输入端口：\n    - `Success`：在完成模块时应该调用，并向调用者传递“成功”状态\n    - `Cancel`：用于提前结束模块，并向调用者传递“已取消”状态\n\
  \n最后，为了为你的模块填充逻辑，只需将 `Start` 输出端口连接到你的逻辑节点即可。\n\n## 调用模块\n\n要调用已有的模块，在 Module 节点类别中找到相关节点。调用节点命名为\
  \ `Module:Call_<ModuleName>`：然后只需触发 `Call` 端口即可激活你的模块，触发 `Cancel` 即可中止它。\n\n## 模块参数/端口\n\
  \n从我们之前学到的，我们能够调用带有空端口的模块。这在所有情况下可能都不是最优的，因为你可能想向模块传递额外数据。\n\n### [ 39 ]\n\n![](img/index-59_1.png)\n\
  \n![](img/index-59_2.jpg)\n\n*使用 Flowgraph 进行视觉化脚本*\n\n为了实现这一点，模块系统暴露了模块参数。通过在 Flowgraph\
  \ 编辑器中选择 `Tools`（工具） | `Edit Module...`（编辑模块），我们可以为我们的模块添加一组参数：此操作将打开 `Module Ports`（模块端口）窗口，允许我们添加和删除端口：\n\
  \n通过选择 `New Input`（输入）或 `New Output`（输出），我们将能够添加在激活模块可以使用的新端口。\n\n### [ 40 ]\n\n\
  ![](img/index-60_1.png)\n\n![](img/index-60_2.png)\n\n![](img/index-60_3.png)\n\n\
  *第 2 章*\n\n添加新的输入或输出会自动输出 `Module:Start_MyModule` 或 `Module:End_MyModule` 节点，允许你接收数据：所有\
  \ `Module:Call_MyModule` 节点也会自动更新，让你立即访问新参数：\n\n## 自定义流程节点\n\n总结一下，CryENGINE 默认提供了许多实用的节点，涵盖了全范围的功能。然而，作为一名程序员，你经常会发现设计师会要求访问某些流程图默认无法提供的隐藏功能。\n\
  \n例如，假设你正在创建一个一个角色扮演游戏，并且你拥有一套经验值系统。在你的编写的代码中，有很多方法可以奖励玩家经验值，但关卡设计师也希望能够在关卡中的任意点利用此功能。\n\
  \n### [ 41 ]\n\n![](img/index-61_1.png)\n\n*使用 Flowgraph 进行视觉化脚本*\n\n在这种情况下，你非常适合创建一个自定义流程节点（flownode）；你可以为代码中存在的系统创建一个简化表示，也许允许设计师在节点被触发时只需指定要给玩家的经验值数量。\n\
  \n不过，现在我们将查看一些简单一点的东西。假设我们没有现有的 CryENGINE 节点可以使用，并且我们想要实现之前看到的 `Math:Mul` 节点。回顾一下，它只是一个简单的节点。\n\
  \n## 在 C++ 中创建自定义节点\n\n回到*第 1 章*，*引言与设置*，我们查看了编译和运行 `GameDLL`，在 Visual Studio 中名为\
  \ `MiniGame.sln`。现在我们要创建一个运行时使用的 CryENGINE 实例。\n\n### 组织节点\n\nCryENGINE 的标准做法是在\
