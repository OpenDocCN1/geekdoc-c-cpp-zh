    \ code.\n\n```\n#include <stdio.h>\n#include <pthread.h>\n#include <string.h>\n\
    #include <errno.h>\n\nvoid* perform(void *arg)\n{\n    int i;\n    int *n = (int\
    \ *)arg;\n    pthread_t tid;\n\n    printf(\"processing from thread\\r\\n\");\n\
    \    /* get the calling thread's ID */\n    tid = pthread_self();\n    printf(\"\
    Thread id: %d \\r\\n\",(int)tid);\n    for(i=0;i<(*n);i++)\n    {\n        printf(\"\
    %d \",i);\n    }\n    printf(\"\\r\\n\");\n}\n\nint main(int argc, char* argv[])\n\
    {\n    pthread_t thread;\n    int ret;\n    errno = 0;\n    int n = 10;\n\n  \
