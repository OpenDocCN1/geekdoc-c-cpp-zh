  md: "# 3.1 Array\n\nIn this section, we build an array using C. For illustration,\
    \ we develop single and multi dimensional array.\n\n# 3.1.1 Defining An Array\n\
    \nWe can define an array using [] syntax. For instance, we define array of int\
