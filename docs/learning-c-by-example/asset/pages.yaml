  md: "# 8.3 Terminating Thread\n\nWe can terminate a thread using two approaches,\
    \ terminating itself and terminating others. We are going to explore these approaches\
    \ on next section.\n\n# 8.3.1 Terminating Itself\n\nA thread can stop its processing\
    \ using pthread_exit(). The following is a syntax of pthread_exit().\n\n```\n\
    #include <pthread.h>\n\nvoid pthread_exit (void *retval);\n```\n\nFor illustration,\
    \ we build app based threading and call function perform(). On function perform(),\
    \ we do looping and will exit from internal thread after looped index 3 by calling\
    \ pthread_exit().\n\nTo implement, we create a file, called selfexit.c, and write\
    \ this code.\n\n```\n#include <stdio.h>\n#include <pthread.h>\n#include <string.h>\n\
    #include <errno.h>\n\nvoid* perform(void *arg)\n{\n    int i;\n    int *n = (int\
    \ *)arg;\n\n    printf(\"processing from thread\\r\\n\");\n    for(i=0;i<(*n);i++)\n\
    \    {\n        if(i==3)\n        {\n            printf(\"Terminating thread\\\
    r\\n\");\n            /* exit this thread */\n            pthread_exit((void *)0);\n\
    \        }\n        printf(\"%d \",i);\n    }\n    printf(\"\\r\\n\");\n}\n\n\
    int main(int argc, char* argv[])\n{\n```"
