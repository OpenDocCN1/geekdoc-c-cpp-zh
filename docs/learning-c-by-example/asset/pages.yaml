- pgno: 21
  md: "# 2.5 Input & Output on Console\n\nYou may want to show message on console\
    \ using C. You can use printf() to write message on console. printf() also can\
    \ be passed parameters inside using %d for integer numeric and %f for floating\
    \ numeric. For char data type, we can use %c for passing parameter.\n\nHere is\
    \ a sample code\n\n```\n#include <stdio.h>\n\nint main() {\n    int n = 10;\n\
    \    float m = 1.245;\n    char c = 'A';\n\n    printf(\"%d \\n\",n);\n    printf(\"\
    %f \\n\",m);\n    printf(\"%.2f \\n\",m);\n    printf(\"%.3f \\n\",m);\n    printf(\"\
    %c \\n\",c);\n\n    return 0;\n}\n```\n\nSave this code into a file, called inout.c.\n\
    \nCompile and run this code\n\n![](img/4e69d9ab92a6fdfd6a6bac3671deb952_21_0.png)\n\
    \nYou can see on %f that wrote floating data with 6 decimal digits. You can specify\
    \ the number of decimal digit by passing numeric after dot (.), for instance,\
    \ %.2f and %.3f."
  merge: -1
  img_proc: true
