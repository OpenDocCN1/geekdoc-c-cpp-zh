  md: "# 4.4 Function and Pointer\n\nWe can pass pointer as parameters in our function.\
    \ For illustration, we can create swap() to swap our values.\n\nTry to run this\
    \ program.\n\n```\n#include <stdio.h>\n\n// implicit declaration for functions\n\
    void swap(int *px, int *py);\n\nint main(int argc, const char* argv[]) {\n   \
    \ int *x, *y;\n    int a, b;\n\n    a = 10;\n    b = 5;\n\n    // set value\n\
    \    x = &a;\n    y = &b;\n\n    printf(\"value pointer x: %d \\n\",*x);\n   \
    \ printf(\"value pointer y: %d \\n\",*y);\n\n    swap(x,y);\n    printf(\"swap()\\\
    n\");\n    printf(\"value pointer x: %d \\n\",*x);\n    printf(\"value pointer\
    \ y: %d \\n\",*y);\n    return 0;\n}\n\nvoid swap(int *px, int *py){\n    int\
    \ temp;\n\n    // store pointer px value to temp\n    temp = *px;\n    // set\
    \ pointer px by py value\n    *px = *py;\n    // set pointer py by temp value\n\
    \    *py = temp;\n}\n```\n\nA sample of program output can be seen in Figure below."
