    What’s difference between pthread_cond_broadcast() and pthread_cond_signal()?
    pthread_cond_broadcast() notifies several threads but pthread_cond_signal() notifies
    a thread.


    For illustration, we use same code on previous section (section 8.6.1). In this
    scenario, we have 2 consumer threads and 1 producer thread.'
