  md: "# 5.4 Writing Data Into A File\n\nWe can write data into a file. The following\
    \ is the algorithm for writing data:\n\n+   - Create a file using fopen() function\n\
    +   - Write data into a file using fprintf() and fputs() functions\n+   - Close\
    \ a file using fclose() function\n\nFor testing, we create data into a file, **demo.txt**.\
    \ For implementation, create a file, called **filewrite.c**, and write this code.\n\
    \n```\n#include <stdio.h>\n\nint main(int argc, const char* argv[]) {\n    int\
    \ i;\n    FILE *f;\n\n    f = fopen(\"demo.txt\", \"w+\");\n\n    for(i=0;i<5;i++){\n\
    \        fprintf(f, \"fprintf message %d\\n\",i);\n        fputs(\"fputs message\\\
    n\", f); // no format\n    }\n\n    fclose(f);\n    printf(\"Data was written\
    \ into a file\\n\");\n\n    return 0;\n}\n```\n\nSave this code. Compile and run\
    \ this program.\n\n```\n$ gcc -o filewrite filewrite.c\n$ ./filewrite\n```\n\n\
    A sample output can be seen in Figure below."
