    \ It is defined as below.\n\n```\n#include <unistd.h>\n\nint gethostname(char\
    \ *name, size_t len);\n```\n\nFor illustration, we create a simple app to read\
    \ local hostname. Create a file, called gethostname.c, and write this code.\n\n\
