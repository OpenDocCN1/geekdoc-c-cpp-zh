  md: "# 8.6 Condition Variables\n\nWe have learned thread synchronization using thread\
    \ mutex. Now we explore another thread synchronization using condition variables\
    \ in controlling accessing resource.\n\nThere are two methods to implement condition\
    \ variables on thread synchronization:\n\n+   - Signaling\n+   - Broadcasting\n\
    \nEach method will be explained on next section.\n\n# 8.6.1 Signaling\n\nThe idea\
    \ of signaling is after you access a resource you must notify to another thread\
    \ to start accessing resource. To implement it, we can use the following functions.\n\
    \n```\n#include <pthread.h>\n\nint pthread_cond_init(pthread_cond_t *restrict\
    \ cond,\n    const pthread_condattr_t *restrict attr);\n\nint pthread_cond_wait(pthread_cond_t\
    \ *restrict cond,\n    pthread_mutex_t *restrict mutex);\n\nint pthread_cond_destroy(pthread_cond_t\
    \ *cond);\n```\n\nTo notify another thread, you can use pthread_cond_signal()\
    \ which is defined as below.\n\n```\n#include <pthread.h>\n\nint pthread_cond_signal(pthread_cond_t\
    \ *cond);\n```\n\nFor illustration, we create two threads that act as producer\
    \ and consumer. Producer can write data and consumer can only read data. The data\
    \ can be accessed by one thread, either producer or consumer.\n\nLet’s start to\
    \ create a file, called condvariable.c. Firstly we define headers and global variables.\n\
    \n```\n#include <stdio.h>\n#include <pthread.h>\n#include <string.h>\n#include\
    \ <errno.h>\n#include <unistd.h>\n```"
