  md: "# 10.3 Data Transfer\n\nWe can send and receive data via socket using read()\
    \ and write functions. These functions are defined as below.\n\n```\n#include\
    \ <unistd.h>\n\n ssize_t read(int fd, void *buf, size_t count);\n ssize_t write(int\
    \ fd, const void *buf, size_t count);\n```\n\nThese functions are general I/O\
    \ functions. We can use specific I/O for socket operations using send() and recv()\
    \ functions. They can implemented as follows.\n\n```\n#include <sys/types.h>\n\
    #include <sys/socket.h>\n\n ssize_t send(int sockfd, const void *buf, size_t len,\
    \ int flags);\n ssize_t recv(int sockfd, void *buf, size_t len, int flags);\n\
    ```\n\nIn this section we build client-server like section 10.2 but we try to\
    \ transfer data using write() and read() functions.\n\n# 10.3.1 Server\n\nAfter\
    \ client connected, we read data from client using read() function. Then we send\
    \ message to client using write() function. After that, we close connection.\n\
    \nFor implementation, we create a file, called data_server.c, and write this code.\n\
    \n```\n1 #include <stdio.h>\n2 #include <sys/types.h>\n3 #include <sys/socket.h>\n\
    4 #include <netinet/in.h>\n5 #include <string.h>\n6 #include <errno.h>\n7\n8\n\
    9 int main(void)\n10 {\n11\n12     int sockfd, newsockfd, portno, clilen, sz;\n\
    13     char buffer[256];\n14     struct sockaddr_in serv_addr, cli_addr;\n15\n\
    16     portno = 8059; // server port\n17     errno = 0;\n```"
