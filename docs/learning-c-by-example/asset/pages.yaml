  md: "# 5.2 Reading Input from Keyboard\n\nWe can read input from keyboard in many\
    \ ways. The following is a list of function for reading input from keyboard:\n\
    \n+   - getchar()\n+   - gets()\n+   - scanf()\n+   - \n\nWe will implement theses\
    \ functions on next section.\n\n# 5.2.1 getchar() and putchar() functions\n\n\
    getchar() function is used to get a character from keyboard and putchar() function\
    \ is used to print a character to Terminal.\n\nFor illustration, create a file,\
    \ called keyboard.c, and write this code.\n\n```\n#include <stdio.h>\n\nvoid getchar_putchar();\n\
    \nint main() {\n    getchar_putchar();\n    return 0;\n}\n\nvoid getchar_putchar(){\n\
    \    int c;\n    printf (\"Type a character: \");\n    c = getchar();\n    printf\
    \ (\"char: %c\\n\",c);\n    putchar(c);\n    printf(\"\\n\");\n}\n```\n\nCompile\
    \ and run this program.\n\n```\n$ gcc -o keyboard keyboard.c\n$ ./keyboard\n```"
