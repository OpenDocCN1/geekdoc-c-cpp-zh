    \   printf(\"%d / %d = %.2f\\\\n\",a,b,d);\n\n        float e =(float)a / b;\n\
    \        printf(\"%d / %d = %.2f\\\\n\",a,b,e);\n\n        return 0;\n}\n```\n\
