  md: "# 8.5 Thread Mutex\n\nYou have resources such as data variable, file, database\
    \ which can be accessed only by a thread. It’s called mutex. For illustration,\
    \ you have data which is stored on variable n. You also have 5 threads to access\
    \ this data. The first rule is data variable can be accessed by one thread. It\
    \ means data variable will be locked so another thread cannot access it.\n\nMutex\
    \ is one of thread synchronization mechanism to control accessing resource.\n\n\
    You can implement thread mutex using the following functions.\n\n```\n#include\
    \ <pthread.h>\n\nint pthread_mutex_init(pthread_mutex_t *restrict mutex,\n   \
    \ const pthread_mutexattr_t *restrict attr);\nint pthread_mutex_destroy(pthread_mutex_t\
    \ *mutex);\nint pthread_mutex_lock(pthread_mutex_t *mutex);\nint pthread_mutex_unlock(pthread_mutex_t\
    \ *mutex);\n```\n\nNote:\n\n+   - pthread_mutex_init() initialize mutex object\n\
    +   - pthread_mutex_destroy() destroy mutex object\n+   - pthread_mutex_lock()\
    \ locak mutex object\n+   - pthread_mutex_lock() unlock/release mutex object\n\
    \nFor implementation, we create a file, called mutex.c. Firstly we define headers\
    \ and global variables. Write this code.\n\n```\n#include <stdio.h>\n#include\
    \ <pthread.h>\n#include <string.h>\n#include <errno.h>\n#include <unistd.h>\n\n\
    pthread_t thread[5];\nint total_finished_jobs;\npthread_mutex_t lock;\n```\n\n\
    Variable total_finished_jobs can be accessed by only one thread.\n\nOn main()\
    \ point entry, we instantiate mutex object and create 5 threads.\n\n```\nint main(int\
    \ argc, char* argv[])\n{\n    int i, ret;\n    errno = 0;\n```"
