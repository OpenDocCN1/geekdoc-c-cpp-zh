  md: "# 4.3 Function with Array Parameters\n\nWe also can declare a function with\
    \ array as parameters. To know how array size, our function should declare array\
    \ size.\n\nWrite this code into your program for illustration.\n\n```\n```c\n\
    #include <stdio.h>\n\n// implicit declaration for functions\ndouble mean(int numbers[],int\
    \ size);\n\nint main(int argc, const char* argv[]) {\n\n    int numbers[8] = {8,4,5,1,4,6,9,6};\n\
    \    double ret_mean = mean(numbers,8);\n    printf(\"mean: %.2f\\n\",ret_mean);\n\
    \n    return 0;\n}\n\ndouble mean(int numbers[],int size){\n    int i, total;\n\
    \    double temp;\n\n    for (i = 0; i < size; ++i){\n        total += numbers[i];\n\
    \    }\n\n    temp = (double)total / (double)size;\n    return temp;\n}\n```\n\
