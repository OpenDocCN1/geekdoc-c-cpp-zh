  md: "# 2.7 Mathematical Functions\n\nC provides math library to manipulate mathematical\
    \ operations. You must include **math.h** to implement mathematical operations.\n\
    \nHere is an illustration code for mathematical functions usage:\n\n```\n```c\n\
    #include <stdio.h>\n#include <stdlib.h>\n\n#include <math.h>\n\nint main() {\n\
    \        float a;\n        float b;\n        float pi = 3.14;\n\n        a = 0.25;\n\
    \        printf(\"value a = %.2f \\\\n\", a);\n\n        b = abs(-a);\n      \
    \  printf(\"abs(a)=%.2f \\\\n\", b);\n\n        b = acos(a);\n        printf(\"\
    acos(a)=%.2f \\\\n\", b);\n\n        b = asin(a);\n        printf(\"asin(a)=%.2f\
    \ \\\\n\", b);\n\n        b = atan(a);\n        printf(\"abs(a)=%.2f \\\\n\",\
    \ b);\n\n        b = atan2(a,5);\n        printf(\"atan(a,5)=%.2f \\\\n\", b);\n\
    \n        b = cos(a);\n        printf(\"cos(a)=%.2f \\\\n\", b);\n\n        b\
    \ = sin(a);\n        printf(\"sin(a)=%.2f \\\\n\", b);\n\n        b = tan(a);\n\
    \        printf(\"tan(a)=%.2f \\\\n\", b);\n\n        b = sqrt(a);\n        printf(\"\
    sqrt(a)=%.2f \\\\n\", b);\n\n        return 0;\n}\n```\n```\n\nSave this code\
    \ into a file, called **mathdemo.c**. Then compile and run it. Because we use\
