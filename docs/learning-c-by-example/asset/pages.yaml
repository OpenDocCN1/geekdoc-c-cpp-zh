  md: "# 6.1 Concatenating Strings\n\nIf you have a list of string, you can concatenate\
    \ into one string. You can use strcat() function from string.h header. For illustration,\
    \ create a file, called stringdemo.c, and write the following code.\n\n```\n#include\
    \ <stdio.h>\n#include <string.h>\n\nvoid concatenating();\n\nint main(int argc,\
    \ const char* argv[]) {\n    concatenating();\n    return 0;\n}\n\nvoid concatenating(){\n\
    \    printf(\"====concatenating===\\n\");\n    char str1[30] = \"hello\";\n  \
