  md: "# 3.3 Pointer\n\nA pointer is a programming language object, whose value refers\
    \ to (or “points to”) another value stored elsewhere in the computer memory using\
    \ its address. A pointer references a location in memory, and obtaining the value\
    \ stored at that location is known as dereferencing the pointer (source: http://en.wikipedia.org/wiki/Pointer_(computer_programming).\n\
    \nTo obtain memory address of a variable, we can use & syntax. For instance, create\
    \ a file, called **address.c**, and write this code.\n\n```\n```c\n#include <stdio.h>\n\
    \nint main(int argc, const char* argv[]) {\n\n    int n;\n    n = 10;\n\n    printf(\"\
    value n: %d \\n\", n);\n    printf(\"address n: %x \\n\", &n);\n\n    return 0;\n\
    }\n```\n```\n\nSave this file. Then, try to compile and run.\n\n```\n```bash\n\
    $ gcc -o address address.c\n$ ./address\n```\n```\n\nIf success, we obtain memory\
    \ address of variable n. A sample output of program can be seen in Figure below."
  merge: -1
  img_proc: true
