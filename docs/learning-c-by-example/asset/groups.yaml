    \n### 4.3 带数组参数的函数\n\n我们也可以声明一个以数组作为参数的函数。为了知道数组大小，我们的函数应该声明数组大小。\n\n为了演示，请在程序中编写以下代码。\n\
    \n```c\n#include <stdio.h>\n\n// implicit declaration for functions\ndouble mean(int\
    \ numbers[],int size);\n\nint main(int argc, const char* argv[]) {\n\n    int\
    \ numbers[8] = {8,4,5,1,4,6,9,6};\n    double ret_mean = mean(numbers,8);\n  \
    \  printf(\"mean: %.2f\\n\",ret_mean);\n\n    return 0;\n}\n\ndouble mean(int\
    \ numbers[],int size){\n    int i, total;\n    double temp;\n\n    for (i = 0;\
    \ i < size; ++i){\n        total += numbers[i];\n    }\n\n    temp = (double)total\
    \ / (double)size;\n    return temp;\n}\n```\n\n现在你可以编译并运行这个程序了。\n\n![](img/4e69d9ab92a6fdfd6a6bac3671deb952_51_0.png)\n\
    \n### 4.4 函数与指针\n\n我们可以在函数中将指针作为参数传递。为了演示，我们可以创建 swap() 来交换我们的值。\n\n尝试运行这个程序。\n\
    \n```c\n#include <stdio.h>\n\n// implicit declaration for functions\nvoid swap(int\
