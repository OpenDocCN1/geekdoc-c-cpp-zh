    \n## 2.9 Logical Operators\n\nThese operators can be used to determine the logic\
    \ between variables or values.\n\n| && | and |\n| || | or |\n| ! | not |\n\nTo\
    \ illustrate how to use logical operators in C code, you can write this code.\n\
    \n```\n#include <stdio.h>\n\nint main() {\n    int a,b;\n    a = 5;\n    b = 8;\n\
    \n    printf(\"%d \\n\",a>b && a!=b);\n    printf(\"%d \\n\",!(a>=b));\n    printf(\"\
    %d \\n\",a==b || a>b);\n\n    return 0;\n}\n```\n\nSave this code into a file,\
    \ logical.c. Compile and run it.\n\n![](img/4e69d9ab92a6fdfd6a6bac3671deb952_26_0.png)\n\
    \n## 2.10 Increment and Decrement\n\nImagine you have operation as below\n\n```\n\
    num = num + 1;\n```\n\nyou can simply this syntax use ++.\n\n```\nnum++;\n```\n\
    \nusing the same approach for this case\n\n```\nnum = num - 1;\n```\n\nyou can\
    \ use -- syntax.\n\n```\nnum--;\n```\n\nNow how to implement them in code. Let’s\
    \ write this code.\n\n```\n#include <stdio.h>\n\nint main() {\n    int a = 10;\n\
    \n    a++;\n    printf(\"%d \\n\",a);\n\n    a++;\n    printf(\"%d \\n\",a);\n\
    \n    ++a;\n    printf(\"%d \\n\",a);\n\n    a--;\n    printf(\"%d \\n\",a);\n\
    \n    a--;\n    printf(\"%d \\n\",a);\n\n    --a;\n    printf(\"%d \\n\",a);\n\
    \n    return 0;\n}\n```\n\nSave this code into a file, called incdec.c.\n\nCompile\
    \ and run it. Here is sample of program output.\n\nagusk@ubuntu01:~/Documents/codes$\
    \ gcc incdec.c -o incdec\nagusk@ubuntu01:~/Documents/codes$ ./incdec\n11\n12\n\
    13\n12\n11\n10\nagusk@ubuntu01:~/Documents/codes$\n\n## 2.11 Decision\n\nThere\
    \ are two approaches to build decision on C. We can use if..then and switch..case.\n\
    \n### 2.11.1 if..then\n\nSyntax model for if..then can be formulated as below:\n\
    \n```\nif (conditional) {\n    // do something\n}else{\n    // do another job\n\
    }\n```\n\nconditional can be obtained by logical or/and comparison operations.\n\
    \nHere is the sample code:\n\n```\n#include <stdio.h>\n\nint main() {\n    int\
    \ a, b;\n    a = 5;\n    b = 8;\n\n    if(a>b || a-b<a){\n        printf(\"conditional-->a>b\
    \ || a-b<a \\n\");\n    }else{\n        printf(\"..another \\n\");\n    }\n  \
    \  return 0;\n}\n```\n\nSave this program into a file, called ifdemo.c. Then,\
    \ run this file.\n\nProgram run:\n\n![](img/4e69d9ab92a6fdfd6a6bac3671deb952_29_0.png)\n\
    \n### 2.11.2 switch..case\n\nswitch..case can be declared as below:\n\n```\nswitch(option){\n\
    \    case option1:\n        // do option1 job\n        break;\n    case option2:\n\
    \        // do option2 job\n        break;\n}\n```\n\nHere is the sample code\
    \ of switch..case usage:\n\n```\n#include <stdio.h>\n\nint main() {\n    // you\
    \ can obtain input value from keyboard\n    // or any input device\n    int input\
    \ = 3;\n\n    switch(input){\n    case 1:\n        printf(\"choosen 1\\n\");\n\
    \        break;\n    case 2:\n        printf(\"choosen 2\\n\");\n        break;\n\
    \    case 3:\n    case 4:\n        printf(\"choosen 3\\n\");\n        break;\n\
    \    }\n    return 0;\n}\n```\n\nSave this code into a file, called switch.c.\
    \ Try to build and run it.\n\nProgram run:\n\n```\n```bash\nagusk@ubuntu01:~/Documents/codes$\
