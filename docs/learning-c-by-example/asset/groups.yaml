    \n#### 3.3.2 动态数组\n\n在本节中，我们将使用指针创建一个动态数组。通常，我们可以使用带有大小的 [] 来声明数组。现在我们可以声明动态大小的数组。\n\
    \n基本上，当我们添加一个新值时，我们分配内存，然后将其附加到数组上。为了说明，我们定义一个大小为 10 的数组。然后，我们向该数组添加一些值。\n\n创建一个名为\
    \ **dpointer.c** 的文件，并写入以下代码。\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n\
    \nint main(int argc, const char* argv[]) {\n\n    // define dynamic array of pointer\n\
    \    int *numbers; // single array pointer\n\n    // a number of array\n    int\
    \ N = 10;\n\n    // allocate memory\n    numbers = malloc( N * sizeof(int));\n\
    \n    // set values\n    int i;\n    for(i=0;i<N;i++){\n        numbers[i] = i+3;\n\
    \    }\n\n    // display values\n    for(i=0;i<N;i++){\n        printf(\"%d \"\
    ,numbers[i]);\n    }\n    printf(\"\\n\");\n\n    // free memory\n    free(numbers);\n\
    \n    return 0;\n}\n```\n\n保存此代码。尝试编译并运行它。\n\n```\n$ gcc -o dpointer dpointer.c\n\
    $ ./dpointer\n```\n\n程序输出如下图所示。\n\n![](img/4e69d9ab92a6fdfd6a6bac3671deb952_44_0.png)\n\
