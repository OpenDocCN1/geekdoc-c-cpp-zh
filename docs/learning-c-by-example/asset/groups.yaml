    \ input-----\\n\");\n    name[0] = '\\0'; // clear\n    printf (\"Your name: \"\
    );\n    fgets(name,256,stdin);\n    printf (\"name: %s\\n\",name);\n    puts(name);\n\
    }\n```\n\nSave this code. Try to compile and run this program.\n\nA sample output\
