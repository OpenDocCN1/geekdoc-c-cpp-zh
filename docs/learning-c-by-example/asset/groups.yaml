  - '[PAGE 14]


    # HOW TO BREAK UP WITH YOUR MUSE


    A FIELD GUIDE TO CREATIVE RECOVERY


    Write faster with perfect concentration by breaking up with your muse. Artists
    who depend on inspiration fail. Learn how to identify your muse, assess the attachment,
    develop a ritual, and create new habits for sustainable creative work.


    +   - Identify your muse

    +   - Assess the attachment

    +   - Develop a ritual

    +   - Create new habits


    The following field guide is a compilation of the artistic and creative recovery
    techniques used by authors to sever ties with their muse forever.


    > The artist is free, but the muse is a ball and chain. - J. T.


    | Type | Characteristics | Prescription |

    | --- | --- | --- |

    | Type One: The Romantic Muse | Mood swings, requires inspiration, waxing and
    waning energy | Use a schedule, not a feeling; work in consistent blocks |

    | Type Two: The Monumental Muse | Overwhelming, full of grand ideas, none of which
    are finished | Cut projects into smaller pieces; finish every day |

    | Type Three: The Distracted Muse | Feeds on novelty, social media craving, disrupts
    workflow | Build a single daily workspace and one list of tasks |

    | Type Four: The Competitive Muse | Compares you to others, fuels jealousy and
    procrastination | Work in isolation; compare only to yesterday''s output |

    | Type Five: The Critic Muse | Judges your first draft, simplifies nothing, chases
    perfection | Write ugly first drafts; edit only in separate sessions |


    # MUSE TYPE ONE: THE ROMANTIC MUSE


    This is the passionate lover of the art. It wants you to wait for the perfect
    moment, the warm glow, the beautiful sunrise. It gives you sensations and takes
    away your discipline. The cure: ignore the feeling. Set an alarm. Work begins
    when the alarm rings, not when the inspiration sings.


    In practical terms, schedule your writing for the same time each day. This allows
    the subconscious to be ready. Lean into the boring ritual of showing up. Over
    time, routine becomes charismatic and the muse loses its power.'
