    ```c\n#include <stdio.h>\n#include <stdlib.h>\n\nint main(int argc, const char*\
    \ argv[]) {\n\n    // define dynamic array of pointer\n    int **matrix; // two\
    \ dimensional array pointer\n\n    // a number of array\n    int M = 3;\n    int\
    \ N = 5;\n\n    // allocate memory\n    matrix = malloc( M * sizeof(int*));\n\n\
