    \          inced.c          multiarray.c     while.c\nagusk$ gcc -o funcdemo funcdemo.c\n\
    agusk$ ./funcdemo\nvalue pointer x: 10\nvalue pointer y: 5\nswap()\nvalue pointer\
    \ x: 5\nvalue pointer y: 10\nagusk$\n```\n\n## 5. I/O 操作\n\n本章介绍如何处理 I/O 操作。\n\
    \n### 5.1 入门\n\n在本节中，我们将学习如何处理 I/O 操作。以下是我们使用 C 语言处理 I/O 的场景示例：\n\n- 从键盘读取输入\n\
    - 读取程序参数\n- 将数据写入文件\n- 从文件读取数据\n\n### 5.2 从键盘读取输入\n\n我们可以通过多种方式从键盘读取输入。以下是从键盘读取输入的函数列表：\n\
    \n- getchar()\n- gets()\n- scanf()\n\n我们将在下一节中实现这些函数。\n\n### 5.2.1 getchar() 和\
