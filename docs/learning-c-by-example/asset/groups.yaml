    \ char name[256];\n\n    printf (\"Your name: \");\n    gets (name);\n    printf\
    \ (\"name: %s\\n\", name);\n    puts(name);\n\n    printf (\"-----fgets() input-----\\\
    n\");\n    name[0] = '\\0'; // clear\n    printf (\"Your name: \");\n    fgets(name,256,stdin);\n\
