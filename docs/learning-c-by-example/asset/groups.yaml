    \nint main() {\n    getchar_putchar();\n    return 0;\n}\n\nvoid getchar_putchar(){\n\
    \    int c;\n    printf (\"Type a character: \");\n    c = getchar();\n    printf\
    \ (\"char: %c\\n\",c);\n    putchar(c);\n    printf(\"\\n\");\n}\n```\n\n编译并运行这个程序。\n\
    \n```text\n$ gcc -o keyboard keyboard.c\n$ ./keyboard\n```\n\n你可以在下图中看到程序输出。\n\
    \n![](img/4e69d9ab92a6fdfd6a6bac3671deb952_58_0.png)\n\n### 5.2.2 gets() 和 puts()\
    \ 函数\n\ngets() 用于读取文本。当你输入换行符（回车键）时，它会停止读取。遗憾的是，gets() 是一个不安全的函数。我们可以使用 fgets()\
    \ 来按长度限制读取文本。\n\n为了测试，我们在 keyboard.c 文件中添加 get_puts() 函数，并编写以下代码。\n\n```c\n#include\
    \ <stdio.h>\n\nvoid gets_puts();\n\nint main() {\n\n    gets_puts();\n\n    return\
