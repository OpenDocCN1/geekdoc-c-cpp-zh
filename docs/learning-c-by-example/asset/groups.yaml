    # 1.2 Compilers


    There are many C compilers to develop C program. In this book, we use GCC as C
    compiler for Linux, Mac and Windows. For Windows users, you also can use Visual
    C++ compiler.


    # 1.2.1 Linux


    Installation of GCC C is easy. For Ubuntu Linux, you can do it using console and
    write this script


    ```

    ```bash

    $ sudo apt-get install build-essential

    ```

    ```


    If installation already finished, you can check GCC version on console and write
    script as below


    ```

    ```bash

    gcc --version

    ```

    ```


    ![](img/4e69d9ab92a6fdfd6a6bac3671deb952_9_0.png)


    You will see gcc version, for instance shown in Figure above.


    # 1.2.2 Windows


    If your computer has Windows platform, you can use **Cygwin**. Download it on
    http://cygwin.com/setup.exe and then run it.


    On setup dialog, you choose **Devel** package as follows.'
