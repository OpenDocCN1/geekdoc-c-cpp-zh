    # 10.2 Creating and Connecting


    In this section we explore socket programming. For illustration we build client-server
    app. In this scenario, we just connect and then close.


    To create communication, we can use socket() function. It can be defined as below.


    ```

    #include <sys/types.h>

    #include <sys/socket.h>


    int socket(int domain, int type, int protocol);

    ```


    domain is defined as below.


    | Name | Purpose |

    |---|---|

    | AF_UNIX, AF_LOCAL | Local communication |

    | AF_INET | IPv4 Internet protocols |

    | AF_INET6 | IPv6 Internet protocols |

    | AF_IPX | IPX - Novell protocols |

    | AF_NETLINK | Kernel user interface device |

    | AF_X25 | ITU-T X.25 / ISO-8208 protocol |

    | AF_AX25 | Amateur radio AX.25 protocol |

    | AF_ATM PVC | Access to raw ATM PVCs |

    | AF_APPLETALK | Appletalk |

    | AF_PACKET | Low level packet interface |


    type is defined as below.


    |  |  |

    | SOCK_STREAM | Provides sequenced, reliable, two-way, connection-based byte streams.
    An out-of-band data transmission mechanism may be supported. |

    | SOCK_DGRAM | Supports datagrams (connectionless, unreliable messages of a fixed
    maximum length). |

    | SOCK_SEQPACKET | Provides a sequenced, reliable, two-way connection-based data
    transmission path for datagrams of fixed maximum length; a consumer is required
    to read an entire packet with each input system call. |

    | SOCK_RAW | Provides raw network protocol access. |

    | SOCK_RDM | Provides a reliable datagram layer that does not guarantee ordering.
    |

    | SOCK_PACKET | Obsolete and should not be used in new programs; |


    We will focus on socket type: SOCK_STREAM and SOCK_DGRAM.'
