    \    printf(\"My local hostname: %s\\n\", hostname);\n\n    return 0;\n}\n```\n\
    \n保存此代码并尝试编译和运行。\n\n以下是示例输出。\n\n![](img/4e69d9ab92a6fdfd6a6bac3671deb952_127_0.png)\n\
    \n### 10.2 Creating and Connecting\n\n在本节我们探索 socket 编程。为了说明我们构建客户端-服务器应用。在此场景中，我们只是连接然后关闭。\n\
    \n要创建通信，我们可以使用 socket() 函数。它可以定义如下。\n\n```\n#include <sys/types.h>\n#include <sys/socket.h>\n\
    \nint socket(int domain, int type, int protocol);\n```\n\ndomain 定义如下。\n\n| Name\
    \ | Purpose |\n|---|---|\n| AF_UNIX, AF_LOCAL | 本地通信 |\n| AF_INET | IPv4 Internet\
    \ 协议 |\n| AF_INET6 | IPv6 Internet 协议 |\n| AF_IPX | IPX - Novell 协议 |\n| AF_NETLINK\
    \ | 内核用户界面设备 |\n| AF_X25 | ITU-T X.25 / ISO-8208 协议 |\n| AF_AX25 | 业余无线电 AX.25\
    \ 协议 |\n| AF_ATM PVC | 访问原始 ATM PVC |\n| AF_APPLETALK | Appletalk |\n| AF_PACKET\
    \ | 低级数据包接口 |\n\ntype 定义如下。\n\n|  |  |\n| SOCK_STREAM | 提供有序、可靠、双向、基于连接的字节流。可能支持带外数据传输机制。\
    \ |\n| SOCK_DGRAM | 支持数据报（无连接、不可靠的固定最大长度消息）。 |\n| SOCK_SEQPACKET | 提供有序、可靠、双向基于连接的数据报传输路径，数据报长度固定最大；消费者需要用每次输入系统调用读取整个数据包。\
    \ |\n| SOCK_RAW | 提供原始网络协议访问。 |\n| SOCK_RDM | 提供可靠的数据报层，但不保证排序。 |\n| SOCK_PACKET\
    \ | 已废弃，不应在新程序中使用； |\n\n我们将重点关注 socket 类型：SOCK_STREAM 和 SOCK_DGRAM。\n\n#### 10.2.1\
    \ Server\n\n要构建服务器，你可以按照下图所示的步骤进行。\n\n![](img/4e69d9ab92a6fdfd6a6bac3671deb952_130_0.png)\n\
    \nbind(), listen(), accept() 和 close() 函数可以定义如下。\n\n```\n#include <sys/types.h>\n\
    #include <sys/socket.h>\n```\n\n```\n#include <unistd.h>\n\nint bind(int sockfd,\
    \ const struct sockaddr *addr, socklen_t addrlen);\nint listen(int sockfd, int\
    \ backlog);\nint accept(int sockfd, struct sockaddr *addr, socklen_t *addrlen);\n\
    int close(int fd);\n```\n\n我们通常使用 struct sockaddr_in 来传递参数 addr。它定义如下。\n\n```\n\
    struct sockaddr_in {\n    sa_family_t    sin_family;  /* address family: AF_INET\
    \ */\n    in_port_t      sin_port;    /* port in network byte order */\n    struct\
    \ in_addr sin_addr;    /* internet address */\n};\n\nstruct in_addr {\n    uint32_t\
    \       s_addr;      /* address in network byte order */\n};\n```\n\n对于实现，我们通过创建一个文件，名为\
    \ simple_server.c，并写入此代码来构建服务器应用。\n\n```\n1 #include <stdio.h>\n2 #include <sys/types.h>\n\
    3 #include <sys/socket.h>\n4 #include <netinet/in.h>\n5 #include <string.h>\n\
    6 #include <errno.h>\n7\n8 int main(void)\n9 {\n10\n11\n12     int sockfd, newsockfd,\
    \ portno, clilen;\n13     struct sockaddr_in serv_addr, cli_addr;\n14\n15    \
    \ portno = 8056; // server port\n16     errno = 0;\n17\n18     sockfd = socket(AF_INET,\
    \ SOCK_STREAM, 0);\n19     if (sockfd < 0)\n20     {\n21         printf(\"\\n\
    \ socket() failed with error [%s]\\n\",strerror(errno));\n22         return -1;\n\
    23     }\n24\n25     bzero((char *) &serv_addr, sizeof(serv_addr));\n26\n27  \
    \   serv_addr.sin_family = AF_INET;\n28     serv_addr.sin_addr.s_addr = INADDR_ANY;\n\
    29     serv_addr.sin_port = htons(portno);\n30\n31 if (bind(sockfd, (struct sockaddr\
    \ *) &serv_addr,\n32     sizeof(serv_addr)) < 0)\n33 {\n34     printf(\"\\n bind()\
    \ failed with error [%s]\\n\",strerror(errno));\n35     return -1;\n36 }\n37\n\
    38 printf(\"socket has created and binded\\n\");\n39 printf(\"listening incoming\
    \ socket client...\\n\");\n40\n41 listen(sockfd,5);\n42 clilen = sizeof(cli_addr);\n\
    43 newsockfd = accept(sockfd, (struct sockaddr *) &cli_addr, &clilen);\n44 if\
    \ (newsockfd < 0)\n45 {\n46     printf(\"\\n accept() failed with error [%s]\\\
    n\",strerror(errno));\n47     return -1;\n48 }\n49\n50 printf(\"a client was connected\\\
    n\");\n51\n52 // close socket\n53 close(newsockfd);\n54 close(sockfd);\n55\n56\
    \ return 0;\n57 }\n```\n\n你可以编译此程序。\n\n```\n$ gcc -o simple_server simple_server.c\n\
    ```\n\n#### 10.2.2 Client\n\n要连接服务器，我们可以使用 connect() 函数。此函数可以定义如下。\n\n```\n#include\
    \ <sys/types.h>\n#include <sys/socket.h>\n\nint connect(int sockfd, const struct\
    \ sockaddr *addr,\n    socklen_t addrlen);\n```\n\n服务器信息传递给 addr 参数。\n\n对于客户端实现，我们创建一个文件，名为\
    \ simple_client.c，并写入此代码。\n\n```\n#include <stdio.h>\n#include <sys/types.h>\n\
    #include <sys/socket.h>\n#include <netinet/in.h>\n#include <netdb.h>\n#include\
    \ <string.h>\n#include <errno.h>\n\nint main(void)\n{\n    int sockfd, portno;\n\
    \n    struct sockaddr_in serv_addr;\n    struct hostent *server;\n\n    // server\
    \ hostname. You can change it\n    char server_hostname[] = \"ubuntu15\";\n  \
    \  portno = 8056; // server port\n    errno = 0;\n\n    sockfd = socket(AF_INET,\
    \ SOCK_STREAM, 0);\n    if (sockfd < 0)\n    {\n        printf(\"\\n socket()\
    \ failed with error [%s]\\n\", strerror(errno));\n        return -1;\n    }\n\n\
    \    printf(\"socket has created\\n\");\n\n    server = gethostbyname(server_hostname);\n\
    \    if (server == NULL)\n    {\n        printf(\"\\n gethostbyname() failed with\
    \ error [%s]\\n\", strerror(errno));\n        return -1;\n    }\n\n    bzero((char\
    \ *) &serv_addr, sizeof(serv_addr));\n    serv_addr.sin_family = AF_INET;\n  \
    \  bcopy((char *)server->h_addr,\n          (char *)&serv_addr.sin_addr.s_addr,\n\
    \          server->h_length);\n    serv_addr.sin_port = htons(portno);\n\n   \
    \ printf(\"connecting to server...\\n\");\n    if (connect(sockfd,(struct sockaddr\
    \ *)&serv_addr,sizeof(serv_addr)) < 0)\n    {\n        printf(\"\\n connect()\
    \ failed with error [%s]\\n\", strerror(errno));\n        return -1;\n    }\n\n\
    \    printf(\"connected to server\\n\");\n```\n\n```\n54      // close socket\n\
    55      close(sockfd);\n56\n57      return 0;\n58 }\n```\n\n保存所有代码。尝试编译。\n\n```\n\
    $ gcc -o simple_client simple_client.c\n```\n\n#### 10.2.3 Testing\n\n现在我们可以测试我们的服务器和客户端应用。首先我们运行服务器应用。以下是示例输出。\n\
    \n![](img/4e69d9ab92a6fdfd6a6bac3671deb952_134_0.png)\n\n然后你运行客户端应用。\n\n![](img/4e69d9ab92a6fdfd6a6bac3671deb952_134_1.png)\n\
    \n客户端连接到服务器后，服务器和客户端关闭连接。\n\n"
