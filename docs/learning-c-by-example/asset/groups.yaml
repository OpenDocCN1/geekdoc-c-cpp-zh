    n\", b);\n\n        b = sqrt(a);\n        printf(\"sqrt(a)=%.2f \\n\", b);\n\n\
    \        return 0;\n}\n```\n```\n\nSave this code into a file, called **mathdemo.c**.\
    \ Then compile and run it. Because we use math.h, we add -lm parameter on compiling.\n\
    \n```\n```bash\n$ gcc mathdemo.c -lm -o mathdemo\n$ ./mathdemo\n```\n```\n\nA\
