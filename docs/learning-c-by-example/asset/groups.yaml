    \ -o jointhread jointhread.c -lm\n$ ./jointhread\n```\n```\n\n现在你可以运行它。示例输出如图所示。\n\
    \n![](img/4e69d9ab92a6fdfd6a6bac3671deb952_97_0.png)\n\n## 8.5 线程互斥锁\n\n你拥有诸如数据变量、文件、数据库等资源，只能由一个线程访问。它被称为互斥锁。为了说明，你有一个存储在变量\
    \ n 上的数据。你还有 5 个线程访问此数据。第一条规则是数据变量只能由一个线程访问。这意味着数据变量将被锁定，因此另一个线程无法访问它。\n\n互斥锁是控制访问资源的线程同步机制之一。\n\
    \n你可以使用以下函数实现线程互斥锁。\n\n```\n#include <pthread.h>\n\nint pthread_mutex_init(pthread_mutex_t\
    \ *restrict mutex,\n    const pthread_mutexattr_t *restrict attr);\nint pthread_mutex_destroy(pthread_mutex_t\
    \ *mutex);\nint pthread_mutex_lock(pthread_mutex_t *mutex);\nint pthread_mutex_unlock(pthread_mutex_t\
    \ *mutex);\n```\n\n注意：\n\n- pthread_mutex_init() 初始化互斥锁对象\n- pthread_mutex_destroy()\
    \ 销毁互斥锁对象\n- pthread_mutex_lock() 锁定互斥锁对象\n- pthread_mutex_unlock() 解锁/释放互斥锁对象\n\
    \n为了实现，我们创建一个文件，名为 mutex.c。首先我们定义头文件和全局变量。写入此代码。\n\n```\n#include <stdio.h>\n\
    #include <pthread.h>\n#include <string.h>\n#include <errno.h>\n#include <unistd.h>\n\
    \npthread_t thread[5];\nint total_finished_jobs;\npthread_mutex_t lock;\n```\n\
    \n变量 total_finished_jobs 只能由一个线程访问。\n\n在 main() 入口点，我们实例化互斥锁对象并创建 5 个线程。\n\n```\n\
    int main(int argc, char* argv[])\n{\n    int i, ret;\n    errno = 0;\n```\n\n\
    ```\n```c\ntotal_finished_jobs = 0;\n\nif (pthread_mutex_init(&lock, NULL) !=\
    \ 0)\n{\n    printf(\"\\n pthread_mutex_init() failed with error [%s]\\n\", strerror\n\
    \    return 1;\n}\n\nfor (i=0;i<5;i++)\n{\n    ret = pthread_create (&thread[i],\
    \ NULL, perform_job, NULL);\n    if (ret)\n    {\n        printf(\"\\n pthread_create()\
    \ failed with error [%s]\\n\", strerror\n        return -1;\n    }\n}\n\nint c\
    \ = getchar(); // hold app to exit\npthread_mutex_destroy(&lock);\n\nreturn 0;\n\
    }\n```\n```\n\n每个线程调用 perform_job() 函数。当访问变量 total_finished_jobs 时，我们尝试锁定对象 lock。之后，我们更新\
    \ total_finished_jobs 的值。\n\n以下是 perform_job() 函数的实现。\n\n```\n```c\nvoid* perform_job(void\
    \ *arg)\n{\n    int i;\n    pthread_t tid;\n\n    tid = pthread_self();\n    printf(\"\
    processing from thread %ld \\r\\n\", tid);\n    printf(\"Thread %ld. Started Job.\
    \ \\r\\n\", tid);\n\n    // do something for doing job\n    for(i=0;i<20;i++)\n\
    \    {\n        sleep(1);\n    }\n\n    // update job counter\n    pthread_mutex_lock(&lock);\n\
    \    total_finished_jobs++;\n    printf(\"Thread %ld. Finished Job. \\r\\n\",\
    \ tid);\n    printf(\"Total current finished job: %d \\r\\n\", total_finished_jobs);\n\
    \    pthread_mutex_unlock(&lock);\n}\n```\n"
