    \    int a, b;\n\n    a = 10;\n    b = 5;\n\n    // set value\n    x = &a;\n \
    \   y = &b;\n\n    printf(\"value pointer x: %d \\n\",*x);\n    printf(\"value\
    \ pointer y: %d \\n\",*y);\n\n    swap(x,y);\n    printf(\"swap()\\n\");\n   \
    \ printf(\"value pointer x: %d \\n\",*x);\n    printf(\"value pointer y: %d \\\
    n\",*y);\n    return 0;\n}\n\nvoid swap(int *px, int *py){\n    int temp;\n\n\
    \    // store pointer px value to temp\n    temp = *px;\n    // set pointer px\
    \ by py value\n    *px = *py;\n    // set pointer py by temp value\n    *py =\
