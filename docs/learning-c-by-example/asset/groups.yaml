    \n## 前言\n\n本书是一本关于C语言入门的实用书籍。它描述了该语言的所有要素，并通过代码示例说明其用法。\n\n阿古斯·库尔尼亚万\n德波，2015年3月\n\
    \n## 1. 开发环境\n\n本章讲解如何使用C语言开始搭建开发环境。\n\n### 1.2 编译器\n\n有许多用于开发C程序的C编译器。在本书中，我们使用GCC作为Linux、Mac和Windows下的C编译器。对于Windows用户，你也可以使用Visual\
    \ C++编译器。\n\n#### 1.2.1 Linux\n\n安装GCC C编译器很简单。对于Ubuntu Linux，你可以通过控制台执行以下脚本：\n\
    \n```bash\n$ sudo apt-get install build-essential\n```\n\n如果安装已完成，你可以在控制台上检查GCC版本，并输入如下命令：\n\
    \n```bash\ngcc --version\n```\n\n![](img/4e69d9ab92a6fdfd6a6bac3671deb952_9_0.png)\n\
    \n你会看到gcc版本，如上图所示。\n\n#### 1.2.2 Windows\n\n如果你的电脑是Windows平台，你可以使用**Cygwin**。从\
    \ http://cygwin.com/setup.exe 下载它，然后运行。\n\n在安装对话框中，选择**Devel**软件包，如下所示。\n\n![](img/4e69d9ab92a6fdfd6a6bac3671deb952_10_0.png)\n\
    \n安装完成后，你会得到Cygwin终端。运行它。\n\n你可以检查GCC版本。以下是GCC版本的输出示例：\n\n![](img/4e69d9ab92a6fdfd6a6bac3671deb952_10_1.png)\n\
    \n#### 1.2.3 Mac\n\n要安装GCC，你可以安装Xcode，从而获得GCC。安装完成后，你可以通过检查GCC版本来验证。\n\n```text\n\
    agusks$ gcc --version\nConfigured with: --prefix=/Applications/Xcode.app/Contents/Developer/usr\
    \ --with-gxx-include-dir=/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX10.10.sdk/usr/include/c++/4.2.1\n\
    Apple LLVM version 6.0 (clang-600.0.57) (based on LLVM 3.5svn)\nTarget: x86_64-apple-darwin14.0.0\n\
    Thread model: posix\nagusks$\n```\n\n### 1.3 开发工具\n\n基本上你可以使用任何编辑工具，例如 vi、vim、gedit、Eclipse。下面是Ubuntu中的vi编辑器。\n\
    \n![](img/4e69d9ab92a6fdfd6a6bac3671deb952_12_0.png)\n\n这是gedit编辑器：\n\n![](img/4e69d9ab92a6fdfd6a6bac3671deb952_12_1.png)\n\
    \n### 1.4 Hello World\n\n现在我们开始用C语言编写第一个程序。\n\n首先，打开你的文本编辑器，创建一个新文件，命名为**hello.c**。\n\
    \n让我们编写以下代码：\n\n```c\n#include <stdio.h>\n\nint main() {\n        printf(\"Hello\
    \ C\\n\");\n        return 0;\n}\n```\n\n保存这个文件。\n\n现在打开你的终端，编译这个文件。\n\n```bash\n\
    sudo gcc hello.c\n```\n\n![](img/4e69d9ab92a6fdfd6a6bac3671deb952_13_0.png)\n\n\
    如果你检查一下，会得到一个**a.out**文件。如果你没有指定输出文件名，GCC会生成一个a.out文件。你可以如下定义编译后的输出文件：\n\n```bash\n\
    sudo gcc hello.c -o hello\n```\n\n## 如何与你的缪斯女神分手\n\n创意恢复实用指南\n\n通过与缪斯女神分手，以完全专注的状态更快地写作。依赖灵感的艺术家终将失败。学习如何识别你的缪斯女神，评估依赖程度，制定仪式，并为可持续的创造性工作养成新习惯。\n\
    \n- 识别你的缪斯女神\n- 评估依赖程度\n- 制定仪式\n- 养成新习惯\n\n以下实用指南汇集了作者们用来永远切断与缪斯女神联系的创作恢复技巧。\n\
    \n> 艺术家是自由的，但缪斯女神是锁链。——J. T.\n\n| 类型 | 特征 | 处方 |\n| --- | --- | --- |\n| 第一类：浪漫型缪斯\
    \ | 情绪波动，需要灵感，精力时涨时消 | 依靠日程而非感觉；按固定时间段工作 |\n| 第二类：宏伟型缪斯 | 压倒一切，充满宏大想法，却没有一个完成\
    \ | 将项目切分为更小的部分；每天完成一点 |\n| 第三类：分心型缪斯 | 以新奇为食，渴望社交媒体，扰乱工作流程 | 建立单一日常工作区，只保留一个任务清单\
    \ |\n| 第四类：竞争型缪斯 | 将你与他人比较，助长嫉妒和拖延 | 隔离工作；只与昨天的产出比较 |\n| 第五类：批判型缪斯 | 评判你的初稿，不做任何简化，追求完美\
    \ | 先写出粗糙的初稿；只在单独的时段进行编辑 |\n\n### 第一类缪斯：浪漫型缪斯\n\n这是艺术的热情情人。它希望你等待完美的时刻、温暖的光辉、美丽的日出。它给你感觉，却夺走你的纪律。解决方法：忽略感觉。设定闹钟。当闹钟响起时工作开始，而不是当灵感歌唱时。\n\
    \n具体来说，每天在同一时间安排写作。这能让潜意识做好准备。拥抱那种“出现”的乏味仪式。久而久之，例行公事会变得富有魅力，缪斯的力量也会消失。\n\n##\
    \ 2. C语言基础\n\n### 2.1 通用规则\n\n在C语言中，如果你写一行代码，必须在代码末尾写分号（;）。\n语法规则如下：\n\n```\n\
    syntax_code;\n```\n\n### 2.2 声明变量\n\n要声明一个名为*myvar1*的变量，请编写以下代码：\n\n```c\nint\
    \ myvar1;\n```\n\n**int** 是数据类型。\n\n以下是在C语言中可以使用的一些常见数据类型列表。\n\n- int\n- long\n\
    - float\n- char\n- double\n\n我们也可以一次性声明多个变量，如下所示：\n\n```c\nint myvar1, myvar2;\n\
    ```\n\n一旦声明，这些变量就可以用来存储与其数据类型相符的数据。\n\n### 2.3 给变量赋值\n\n已声明的变量可以被赋予一个值。这可以使用等号（=）来完成。例如，变量myvar1将被赋值为数字100，你可以这样写：\n\
    \n```c\nint myvar1 = 100;\n```\n\n你也可以像下面这样声明：\n\n```c\nint myvar1;\nmyvar1 =\
    \ 100;\n```\n\n你必须根据数据类型正确地为变量赋值。如果没有，编译过程中会出现错误。例如，编写以下代码：\n\n```c\n#include\
    \ <stdio.h>\n\nint main() {\n    int n;\n    int i, j;\n\n    n=\"hello\";\n\n\
    \    return 0;\n}\n```\n\n将这个代码保存为名为var1.c的文件。\n\n尝试编译这个文件。你会得到一条警告消息，如下图所示：\n\
    \n![](img/4e69d9ab92a6fdfd6a6bac3671deb952_19_0.png)\n\n"
