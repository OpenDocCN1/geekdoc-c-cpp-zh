    agusk@ubuntu01:~/Documents/codes$ ./switch\nchoosen 3\nagusk@ubuntu01:~/Documents/codes$\n\
    ```\n```\n\n## 2.12 Iterations\n\nIteration operation is useful when we do repetitive\
    \ activities. We use for and *while* syntax\n\n### 2.12.1 For\n\nThe simple scenario\
    \ that illustrates iteration scenario is to show list of number. We do iteration\
    \ until the number value less than 10.\n\n```\n#include <stdio.h>\n\nint main()\
    \ {\n    int i;\n    for(i=0;i<10;i++){\n        printf(\"data %d\\n\",i);\n \
    \   }\n    return 0;\n}\n```\n\nSave this code into a file, called for.c. Compile\
    \ and run it.\n\nHere is a program output:\n\n![](img/4e69d9ab92a6fdfd6a6bac3671deb952_32_0.png)\n\
    \n### 2.12.2 While\n\nThe following is the same code like 2.12.1 scenario but\
    \ it uses *while* syntax.\n\n```\n#include <stdio.h>\n\nint main() {\n    int\
    \ num = 0;\n```\n\n```\nwhile(num<10){\n    printf(\"data %d\\n\",num);\n    num++;\n\
    }\nreturn 0;\n}\n```\n\nSave this code into a file, called **while.c**. Try to\
    \ compile and run it.\n\n![](img/4e69d9ab92a6fdfd6a6bac3671deb952_33_0.png)\n\n\
    ## 2.13 Struct\n\nWe can define a struct to declare a new data type. We use struct\
