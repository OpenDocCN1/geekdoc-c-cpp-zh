    # Creating a Physical Model


    When you create a new physical model, you must know what the RDBMS technology
    used will be because the only decision for creating a physical model is the RDBMS
    site. To be able to design an optimal physical model, you must know the technology
    quality well.


    # Administering RDBMS Sites


    An RDBMS site is a name associated to an RDBMS type supported by Data Modeler,
    such as Oracle 12c, Oracle 11g, SQL Server 2008, or DB2/390. Several RDBMS sites
    are already predefined in Data Modeler, but you can create new sites (aliases)
    for supported types. A physical model is always based on one RDBMS site. You can
    use an RDBMS site only once in one relational model, so if your relational model
    has several physical models, you cannot have two with the same RDBMS site. If
    you want to, let''s say, three different Oracle 12c physical models for a relational
    model (for test, education, and production environments), you must define your
    own RDBMS sites. Your test environment might be very simple, your education environment
    might be different from the other environments, and production might be using
    features such as encryption/reduction. Or you may be selling your own software
    and have support for both SQL Server and Oracle and therefore need a physical
    model for both SQL Server and Oracle along with different versions of those products
    and settings (small environment versus large environment). All this can be done
    by defining your own RDBMS sites.


    The RDBMS sites are all administered with the RDBMS Site Editor (see Figure 6-4),
    which you open by choosing Tools | RDBMS Site Administration. You can add RDBMS
    sites to the current design or to an external file. If you add them to an external
    file, you can share the sites with other users and others. A file called defaultRDBMSSites.xml
    is the default file for RDBMS sites, and it is kept in the directory defined by
    the default system types directory. Each design has its own file for RDBMS sites
    in its directory, but when you design, the new sites are copied from the default
    file to the file of this design. So, when opening a design, you will have all
    the sites defined for that design and those defined in the default file.'
  merge: -1
  img_proc: true
