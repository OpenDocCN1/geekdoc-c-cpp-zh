- pgno: 306
  md: 'There are many situations when you need to compare two designs with each other
    or the design with the database. You can compare two designs by choosing File
    | Import | Data Modeler Design or by choosing Tools | Compare/Merge Models. The
    main difference between these two methods is that in Compare/Merge Models you
    can compare only the relational and physical models, whereas via Import | Data
    Model Design you can compare everything in a design. On the other hand, by Compare/Merge
    Models you can also preview and influence the DDLs that will be generated. A design
    and a database can be compared with Synchronize Model With Data Dictionary or
    Synchronize Data Dictionary With Model, and the actual comparison will be done
    in the Compare Models dialog. A comparison to a design can also be based on DDLs
    or data dictionary. This comparison also takes place in the Compare Models dialog.


    In all comparisons, you always have a target and a source, and the possible changes
    are always performed on the target. The source is shown on the left, and the target
    is shown on the right in the comparison screens. A target in design is the one
    that is open in Data Modeler when the comparison starts. In synchronization, Synchronize
    Model With Data Dictionary the target is the model, and in Synchronize Data Dictionary
    With Model it is the database. The best part of comparisons and synchronizations
    is that you can select any differences you want from source and implement them
    in the target telling you what you want to be


