    # What Is Oracle SQL Developer Data Modeler?


    Oracle SQL Developer Data Modeler (referred as Data Modeler in this book) is a
    free tool for designing and documenting databases and data architecture. It supports
    not only Oracle databases but also DB2 and Microsoft Server databases, and at
    a certain level, any standards-based database has a Java Database Connectivity
    (JDBC) connector. Data Modeler supports all the steps in database design and has
    easy forward and backward engineering. After you have designed the database and
    have a physical model for it, you can export the scripts to the database objects.
    Data Modeler also supports different kinds of databases and multidimensional models.
    Data Modeler helps you keep your databases documented and enables to be agile.
    The tool is available as a stand-alone product, but it is also integrated into
    Oracle SQL Developer, so you can decide which is the best for you to use the tool.
    Installing the tool is simple, and is provided by Oracle if you have a database
    support contract.


    Data Modeler offers the following features for database designers:


    +   - Database design tools A collection of metadata about database is called
