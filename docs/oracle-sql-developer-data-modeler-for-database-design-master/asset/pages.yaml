- pgno: 261
  md: '# Summary


    You need to make a few decisions before starting to use Subversion, specifically,
    about privileges, the number of Subversion repositories, and the structure for
    Subversion directories. Also, it is valuable to use templates for comments that
    will be used when committing to Subversion to make finding the right revision
    easier.


    Data Modeler offers integration with Subversion, which means that you can use
    Subversion in Data Modeler fluently. Subversion can be used to enable a multiuser
    environment. In fact, Subversion can be used to version the database designs the
    same way the application design is versioned. Every design must have a working
    copy directory where changes are saved and then committed to Subversion. Every
    committed change in Subversion creates a new revision. In Pending Changes, you
    can see both incoming and outgoing changes as well as new files that should be
    added to Subversion.


    If there are conflicts, someone must resolve them; they cannot be resolved automatically.
    Conflicts are resolved by merging, committing, or reverting, depending on the
    desired outcome. Conflicts often can be avoided by saving and committing right
    after you have finished making a change.


    You can let end users edit the designs in Microsoft Excel and then upload those
    changes to Data Modeler easily.'
  merge: -1
  img_proc: true
