    ![](img/431f8ac8f273fa89a28377c500ed60d7_221_0.png)


    Start your multidimensional design by creating a cube. A cube is a database object
    that stores data in a dimensional array. In the General properties, you can define
    the name (Name) for the cube and some other properties. If you select Virtual,
    the cube will be defined as a virtual cube. A virtual cube is a logical combination
    of several cubes. Partitioning is a method for storing measures in a cube and
    can be used to improve the performance of large measures. You turn partitioning
    by selecting Partitioned If you have defined the cube to be partitioned, you should
    also define the other partitioning properties, but of course you can do them after
    you have defined the model with dimensions, hierarchies, and levels. In the Part.
    Dimension field, you specify the dimension for partitioning the cube. The dimension
    must have at least one hierarchy based on a level to be defined as a partitioning.
    Hierarchy field as a partitioning level in the Part. Level field. If the dimension
    has multiple hierarchies, choose the one that has the most members and define
    as the default hierarchy.


    A composite is an analytic workspace object that maintains a list of all the nonempty,
    sparse dimension-value combinations. When data is added to a measure dimension
    by space, the Oracle workspace automatically maintains the composite with new
    values. A global composite is a single composite for all data in a cube. Depending
    on the compression and partitioning decisions you make, if you select Global composites,
    the cube will use one composite; otherwise it will use several composites. This
    choice is valid only for uncompressed, partitioned cubes, and since compression
    is only more valuable for any cube, this option is not used. If a cube is not
    partitioned, it always has one composite for the cube and if it is partitioned,
    it has a composite for each partition. It means that the cube will be compressed.
    It is useful if the cube is very sparse. The Compression option (since Oracle
    OLAP 10g), which is excellent for aggregating sparse multidimensional data. It
    improves aggregation performance. Query performance might be improved and disk
    storage reduced with compression. This feature is for large volumes of sparse
    data but is not suitable for dense cubes.


