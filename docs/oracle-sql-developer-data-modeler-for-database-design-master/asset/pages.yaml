    # Using Subversion in Oracle

    SQL Data Modeler


    The main concept while using Subversion is the working copy on your local computer.
    Your working copy of the design will exist there, and all the changes you make
    be saved to your local working copy when you save the design. You commit your
    changes to version control always through the working copy (outgoing changes)
    and update changes others have made from version control (incoming changes) to
    your working copy. Only one design can be located in one working directory, so
    you must have one working directory for each design.


    > NOTE

    Remember to save! Your changes will be visible in Pending Changes only after a
    save operation.


    ![](img/431f8ac8f273fa89a28377c500ed60d7_238_0.png)


    You use Check Out when you get the files from Subversion for the first time and
    define the working directory for the design. Check Out brings the design files
    from Subversion to your working directory and creates the .svn directory for Subversion.
    Check Out has nothing to do with locks (unless you defined that in Preferences),
    and there is no concept of “checking in” like in many other version control tools.
    Subversion can be used with locks, but it is not recommended by Subversion or
    Data Modeler. Locking is complicated and makes working with Data Modeler more
    difficult. My recommendation is not to use locking, and all my advice and working
    models on this chapter are based on. If you want to use locking, make sure you
    have studied Subversion and how it works well before using it.


    When you are ready with your changes, you commit them to the Subversion repository.
    Remember to always commit as soon as you are ready to prevent conflicts.'
