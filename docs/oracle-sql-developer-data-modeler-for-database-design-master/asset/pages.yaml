    Objects Created In “Logical” Model limits the object to be engineered only to
    those objects explicitly created in the logical model.


    If you attached a glossary to a design using the Naming Standards of the Design
    dialog (see Chapter 2), you can use the glossary words to replace the names used
    for entities and attributes with other names defined in a glossary when engineering
    to tables and columns. You can do that by selecting Apply Name Translation. If
    you have defined a plural for the glossary for a table, that will be used for
    name translation; otherwise, the Abbreviation setting is used. If you do not have
    a plural or an abbreviation defined for a table, the Alternative Abbreviation
    setting will be. For a column, the order is Abbreviation, Plural, and Alternative
    Abbreviation, depending on which of them has defined for a column. If the glossary
    has no definition for the word, the entity/attribute name is used.


    During the name translation, also the model-level properties set on the Naming
    Options tab are followed using the glossary. If the new name doesn''t match the
    Max Name length restriction, the Alternative Abbreviations are used for translating
    the name. If the Character Case option is set to Mixed, no case transformation
    is performed. If it is set to Upper Case or Lower Case, the possible translation
    for cases is done. So, if you select Apply Name Translation, the tables and columns
    might not be the same as the related entity and its attributes, but the names
    will be translated according to the glossary. The same applies also for reverse
    engineering (From Relational To Logical). If you have the Apply Name Translation
    option when engineering, you should also have it enabled when reverse engineering
    if you do not, the names will be changed for entities and attributes like they
    are for tables and columns.


    ![](img/431f8ac8f273fa89a28377c500ed60d7_131_0.png)


    > NOTE

    If you select Apply Name Translation, it is wise to keep it all the time for engineering
    and for reverse engineering to guarantee correct naming for all your objects.


    It is also possible to translate the names of the entities and attributes to the
    ones defined in the Preferred Abbreviation setting for the tables and columns
    by selecting both Apply Name Translation and Use Preferred Abbreviations. In this
    case, all tables and columns will be whatever was defined as the Preferred Abbreviation
    property for the entity and the attribute. If you have Preferred Abbreviation
    selected when engineering, you should also have selected when reverse engineering
    if you do not, the names will be changed for entities and attributes like they
    are for tables and columns. If you select the Preferred Abbreviation option, it
    is wise to keep it all the time for engineering and reverse engineering to guarantee
    correct naming for all your objects.'
