    # # Defining Physical Model Properties


    In the physical model, there are elements linked to the relational model, but
    these elements do not have all the properties set yet for the DDL creation because
    these properties depend on the selected RDBMS type. One step in the physical database
    design is to set those properties. There are also new elements that did not exist
    in the relational model at all, and those elements are totally dependent on the
    selected RDBMS type. Another step in the physical database design is to define
    those elements and while doing that design the physical database. The elements
    and properties in the physical model depend on the RDBMS type; these are the elements
    and properties for getting a database created on the selected RDBMS. In this chapter,
    you will see the for Oracle since probably have at least one Oracle database and
    the number of elements and properties is the largest for Oracle. I will not go
    deep into the details of these properties but discuss them at a general level.


    Some of the objects were already created in previous phases of the design, and
    in the physical database design phase, you cannot create new ones; you only need
    to add some properties for the existing ones. If you need to create new ones,
    you do it in the logical or relational model.


    Some properties you cannot complete without creating a new physical object. For
    instance, to be able to complete the table properties, you must define all users
    and roles to be able to grant privileges. You must also define tablespaces, storage
    templates, rollback segments, temporary tablespaces, undo tablespaces, and so
    on, to be able to define storage settings. Then there are elements such as the
    actual database and directories, disk groups, external tables, materialized views,
    clusters, contexts, and so on.'
