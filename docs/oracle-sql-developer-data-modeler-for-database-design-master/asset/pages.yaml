    # An Entity and Its Attributes


    An entity is anything that happens to be of the target of modeling, for example,
    say Heli. Every entity is of some entity type. An entity type is a set of entities
    (Person) having certain properties in common (Heli, Marko, Patrik, and Matias—like
    all entities of type Person—have a name). An entity is always a noun (Company,
    Employee, Customer). An entity is a subset of an entity type, and it includes
    only those that belong to the target of modeling. In language, entity and entity
    sets are often called entities. In this book, we will call both entity and an
    entity set entity because in the context of Data Modeler. When referring to a
    single entity (Heli) we use the term entity instance. You can create an entity
    in Data Modeler on the logical model by clicking the entity icon and inserting
    the properties for the entity, as shown in Chapter 3.


    An entity can be strong or weak. A strong entity (for example, Customer) identifies
    itself without other entities or relationships; strong entities have independent
    existence. A weak entity (for example, Orderline) depends on other entities to
    identify it (Order, Customer) and has a mandatory, identifying relationship with
    them. The weakness of an entity is shown with a horizontal line at the end of
    the relationship line. You can define it in the Relation Properties dialog by
    selecting Identifying from the source side of the properties.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# Chapter 4: Introducing Conceptual Database Design (Logical Model) 65


