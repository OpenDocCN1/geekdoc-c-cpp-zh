    # Designing Databases with Oracle SQL Developer Data Modeler


    The design process when using Data Modeler starts with designing a logical model.
    In the logical model, you define entities, attributes, and relationships. The
    next step is to create a relational model based on the logical model. You do this
    simply by clicking the Engineer To Relational Model icon. When you are done with
    the relational model, it is time to create the physical model. You do this simply
    by right-clicking Physical Model in the Browser and selecting New. When creating
    a physical model, you must know what you will use for your database (Oracle, SQL
    Server, or DB2) as well as its version. All the properties for the physical model
    depend on the chosen technology. After you have created a physical model, you
    should define the properties for the physical objects. After you''ve done that,
    you are ready to generate the DDLs (which are the SQL scripts for creating database
    objects). You can create DDLs by selecting File | Export | DDL File. Then just
    run these DDLs on your database to create the objects. And all this can be done
    in a multiuser environment and while using version control.'
