    information, and requests requests as as well as all the objects models need (
    Every object (entity,, and so,) is a single Extensible Markup Language (XML) file
    in a hierarchy that the tool creates automatically. The design itself is saved
    with the extension .dmd, and the .dmd file contains pointers to individual XML
    files.


    +   - Customization You can tweak Data Modeler to your liking. In Preferences,
    you can, for instance, define where to keep your working copy of designs.


    +   - Version control Data Modeler is integrated into a version control tool called
