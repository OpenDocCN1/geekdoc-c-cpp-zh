- pgno: 13
  md: '# What Is Database Design, Anyway?


    Databases lie at the heart of so much of what we do in the IT world that it''s
    surely obvious that they need to be properly designed. Yet neither design theory,
    nor design best practice, appear to be very well understood in the industry at
    large. (You only have to look at the Wikipedia article on database design to see
    the truth of these claims.) With this state of affairs in mind, therefore, I offer
    the following definitions:


    **Database design** Either logical database design or physical database design,
    as the context demands—though the unqualified term *database design*, or sometimes
    even just *design*, is usually taken to mean logical database design specifically
    (unless the context demands).


    **Logical database design (or just logical design)** The process of, deciding
    what tables some database should contain, what columns those tables should have,
    and what integrity constraints those tables and columns should be subject to.
    The goal is to produce a design that''s independent of all considerations having
    to do with either physical implementation or specific applications (this latter
    objective being desirable for the very good reason that''s generally not the case
    that all uses to which the database will be put are known at design time). Overall,
    the logical design process can be summed up as one of (a) pinning down the table
    predicates and other business rules as carefully as possible, albeit necessarily
    somewhat informally, and then (b) mapping predicates and rules to specific tables,
    columns, and constraints—preferably in such a way as to ensure that the result
    of the process involves no uncontrolled redundancy. (I''ll explain in a few moments
    what I mean by the terms *table predicate, business rule,* and *uncontrolled redundancy*.)'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# Physical database design (or just physical design) The process, or the result
    of the process, of deciding, given some logical design, how that design should
    map to whatever physical constructs the target DBMS happens to support. Observe,
    therefore, that physical design should be derived from the logical design and
    not the other around; ideally, in fact, it should be derived automatically.


    For the remainder of this brief discussion, I''ll concentrate on logical design
    specifically. The first thing I want to say is that there exists some science
    that can help with the logical design process; I refer, of course, to matters
    such as the principles of further normalization and the principle of orthogonal
    design. Thus, if you''re a designer, you owe it to yourself—as well as to your
    clients, which is to say the people who are going to live with the databases you
    design—to be thoroughly familiar with those principles and to know how and when
    to apply them. (As an aside, note that there''s quite a bit of making that many
    people seem to realize. It''s certainly not a matter of making sure the tables
    are all in third norm form. However, this is not the place to go into details.)


    The second thing I want to say is that although the science is important, there
    are, sadly, numerous aspects of design that the science doesn''t address at all.
    And where practical experience comes in. If you have a lot of personal experience
    in the design field, good for you—you''ve learned (possibly around!) what works
    and what doesnt. If you don''t have much experience of your own to fall back on
    (and even if you do), then you''ll need sound advice you can follow, advice from
    someone who does have experience. A good book on design, by a suitably qualified
    professional, can help meet that need. A word of caution, though: Books on database
    technology (as opposed to books on design specifically) might not be what you
    need here. Such books often describe design concepts but fail to give much guidance
    on how to apply those concepts to the practical task of design. Caveat lector.


    Let me enumerate all these table predicate, business rule, and uncontrolled redundancy.
    First, the predicate for a given table is simply a reasonably precise, but informal,
    statement in natural language of what the table is. For example, suppose we have
    a table called EMP (“employees”), with columns called ENO, ENAME, DNO, and SALARY.
    Then the predicate for that table might look something like this:


    ```

    The person with employee number ENO is an employee of the company, named ENAME,
    works in the department with department number DNO, and is paid SALARY.

    ```'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Forewards XV


    ENO, ENAME, DNO, and SALARY are the parameters to this predicate, and of they
    correspond to the columns of the table.


    Second, a business rule is also a reasonably precise but informal language statement,
    one that captures some aspect of how the data in the database is supposed to be
    constrained. (Actually, some writers refer predicates as a special case of business
    rules); however, there''s more to business rules in general than just the table
    predicates as such.) To start with, there''ll be rules that specify what type
    of information is denoted by the parameters to those table predicates; in the
    case of employees, for example, there''ll be a rule to the effect that the SALARY
    parameter (“salaries”) denotes money values, expressed in, let''s say, euros or
    U.S. dollars. Then there''ll be rules that constrain the values parameters can
    take for a given employee considered in isolation (for example, a rule that says
    salaries must be negative and not less than specified upper limit). There''ll
    also be rules that constrain the set of employees taken as a whole, independent
    of other entities, that might be represented in the same database (for example,
    a rule to the effect that employee numbers must be unique). Finally, there''ll
    be rules that constrain employees considered with other entities (for example,
    a rule to the effect that every employee must be assigned to some department,
    or a rule to the effect that no employee can earn more than the manager of the
    department in question is assigned to).


    I''d like to say more about this business rules, because it''s important—also
    because in practice it does to get somewhat overlooked. The foregoing discussion
    should be sufficient to suggest, business rules can be quite complex (complex
    as you like, in fact). As I''ve already said, however, they''re necessarily somewhat
    informal. Their formal counterpart—i.e., the thing they do which needs to be stated
    in some formal language and enforced by the DBMSs. In other words, I depart here
    from other writers in stating categorizing database design isn''t just about choosing
    data structures—integrity constraints (constraints for constraints) are crucial
    as well. (Of course, it''s true that other writers do talk about foreign and key
    constraints—constraints too—but particular constraints are really nothing but
    important special cases of a more general phenomenon.) In this connection, I''d
    like to draw your attention to some remarks (somewhat paraphrased here) from the
    Business Rule Book by Ron Ross (2nd edition, Business Rule Solutions Inc., 1997):


    Even though business rules (like the data itself) are “shared” and universal,
    traditionally they''haven''t been captured in database design. Instead, they''ve
    usually been stated vaguely (if all) in largely uncoordinated analytical and design
    documents, and then buried deep in the logic of application programs. Since application
    programs are notoriously unreliable in the'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Oracle SQL Developer Data Modeler for Database Design Mastery


    I couldn''t agree more. Moreover, note the implicit but strong criticism of DBMS
    products that fail to provide adequate support for integrity constraints! (Interestingly,
    the support provided in this area by the SQL standard is actually not too bad;
    SQL products have been rather slow, to the least, implementing this aspect of
    the standard.)


    Finally, what about matter of uncontrolled redundancy? We can say, loosely, that
    the database displays redundancy if and only if it "says the same thing twice.\
    And we often say, again loosely, that we don''t want the database to display redundancy
    in this sense. But it would be more accurate to say we don''t want to display
    any uncontrolled redundancy. Uncontrolled redundancy can be a problem, but controlled
    redundancy shouldn''t be. Let me explain. First some more details:


    +   **Controlled redundancy** Redundancy in the database is controlled if the
    user is aware of it, but it is guaranteed never to lead to any inconsistencies.


    +   **Uncontrolled** Redundancy in the database is uncontrolled if it has the
    potential to lead to inconsistencies.


    +   **Inconsistency** The database is inconsistent (at least from a formal point
    of view) if and only there''s some integrity constraint it''s supposed to satisfy
    but doesn''t.


    So if controlled redundancy means no inconsistencies, it must also mean no constraints
    are violated. Of course, not all constraints have to do with redundancy as such;
    for example, if the database were to show some employee as having a negative salary;
    Thus, for example, a constraint to the effect that salaries mustn''t be negative
    doesn''t. Thus, salary, it would certainly be inconsistent, but that particular
    inconsistency wouldn''t be one that arises from redundancy. (It would, however,
    mean the database would be incorrect, in the sense that it didn''t faithfully
    reflect the state of affairs in the real world. Inconsistent implies incorrect,
    though the converse is false—the database can be incorrect without being inconsistent.
    For example, if I showed some employee as earning a salary different from employee''s
    true salary, it would be incorrect but not inconsistent.)


    To say again, constraints don''t always have to do with redundancy. But redundancy
    always has to do with constraints. For example, suppose—very unrealistic?—that
    a constraint to the effect that all employees in the same department must earn
    the same salary. Suppose further that the database shows Heli and Chris are in
    the same department. If it were also to show Heli and Chris as earning the same
    salary, it would be redundant; by contrast, if it were to show Heli and Chris
    as earning different salaries, it would be inconsistent (and incorrect).'
