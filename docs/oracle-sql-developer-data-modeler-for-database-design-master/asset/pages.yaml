  md: '# 206 Oracle SQL Data Modeler for Database Design Mastery


    Usually software development projects implement a version control tool and methods.
    Therefore, it makes sense to use version control for database design as well and
    maybe use the same version-numbering system and logic as in application development.
    Often the development team asks for a specific version of a database. Without
    a version control tool integrated into the database design, this would be impossible
    to produce.


    For database designers who are usually not familiar with version control tools
    and how they work might sound difficult. In fact, when I heard that Oracle SQL
    Developer Data Modeler would be based on files and version control inside of a
    real database, I disapproved because version control was not something I believe.
    I decided to take a look at the version control capabilities and then form my
    opinion. I think the decision Oracle made was correct because Data Modeler provides
    much better support for database design in the world we live in than if it were
    built on top of a database. Believe me, I never would say that.


    Data Modeler has an integrated interface to a version control called Subversion.
    Subversion is a free, open source version control tool. In the Preferences dialog
    (choose Tools | Preferences | Versioning | Subversion) on the Subversion tab,
    you can check which version of Subversion is supported by your version of Data
    Modeler.


    All the content in Data Modeler consists of directories and files, so any version
    control product that supports versioning files could be used manually, but that
    would not be wise since there are many files in each design and the filenames
    are based on object IDs that are not easy for humans to read and identify. Managing
    those files manually would not end well, so I do not advise you to use any other
    version control tool. Also, the integration to Subversion in Data Modeler has
    been implemented so that instead of showing the filename, Data Modeler shows the
    object name, as in Pending Changes.


    Before starting subversion you must make many decisions. First, you need to decide
    whether you will have only one Subversion repository or several repositories.
    Then, you need a directory for designs. If you already decided that earlier, as
    in Chapter 2 (the Default Designs Field in the Preferences dialog), you do not
    need to think about it any further. In this design, you need to create a directory
    for each design. The reason for this is that each design is considered a project
    in Subversion, and each project must have its own working directory to be linked
    to Subversion as the working directory.


    You should also decide how to name the designs in Subversion. If you have decided
    on the naming for designs already, you don''t need to worry about it anymore.
    These are other questions to consider: What other files do you want to bring to
    Subversion? Will you share files with other users using version control? Will
    you use templates for commenting the changes? What kind of templates?'
