- pgno: 88
  md: '62 Oracle SQL Developer Data Modeler for Database Design Mastery


    # # Introducing the Logical Model


    When designing the database, it is valuable to start the design work as soon as
    possible in the project because when turning the requirements into a formal form,
    the designer may realize there are many questions that have not been asked. In
    fact, there are many ways of modeling techniques. You can''t always say one way
    is better than another, but sometimes you can. The theory of logic will give you
    guidance in finding and choosing one definition over another. The relational theory
    helps when implementing the requirement in an ER model in the right way. For instance,
    an end user might simply say, "A customer must place an order." With that, the
    user might think that this statement defines a customer (that is, to be a customer
    at all, must place an order). In other words, the end user might think they have
    defined the concept of a customer. A person trained in logic realizes that that
    is not the case; there are many possible formal interpretations. The important
    task is to find out which of them is the one intended before modeling any solution.
    To clarify, the definition of a customer in the example could be any of the following:


    +   - Every customer places at least one order.

    - At least one customer places at least one order.

    - There''s at least one order that every customer places.

    - Each customer places exactly one order.

    - There''s exactly one order that every customer places.


    Or it could mean something.

    In this case, it would be quite easy to find the right definition because a customer
    is a familiar concept to most people, but you will face the same kind of assertions
    about concepts you are not familiar with, and you still must be prepared to ask
    the right questions to be able to make the right decisions when modeling. You
    can find more information about logic and relational theory from several books
    on the topic, for instance written by C.J. Date.

    It is important to be consistent on how you model, at least in one model. It is
    much easier to read and understand the model if the solution for the problem is
    always the same. C.J. Date says, "You can be consistent or you can be inconsistent,
    but never keep switching the time between the two." It is also important to understand
    that the goal is to model the target, not the whole world. One reason to have
    a clear and simple model is that this model will be your best tool when talking
    with end users. You might be surprised how well they can read and understand it.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# Chapter 4: Introducing Conceptual Database Design (Logical Model) 63


    TIP

    Try not to be too smart and make too complex a solution; remember that usually
