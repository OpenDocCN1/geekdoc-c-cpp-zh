    compare the design to the database (read more in Chapter 12) and get the ALTER
    DDLs for altering the column types.


    > NOTE

    Discover Foreign Keys works if primary or unique keys are defined for the parent
    table and if the columns in the parent and child tables are of same date type.
    For instance, if the column name matches the primary key column name in the parent
