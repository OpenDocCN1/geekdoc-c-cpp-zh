    # Examples for Engineering to the Relational Model


    There are general rules for transforming to the relational model, as discussed
    earlier in this chapter. During the transformation, also the names of elements
    in the relational model are defined. Here are some guidelines about that:


    +   - If you do not interfere with the naming while transforming, an entity will
    become a table with the same Name setting as the entity, with a long name of the
    entity, and with an abbreviation of an entity’s short name. A column will be named
    after the Attribute Name, and the Abbreviation field for a column will be empty
    by default.'
