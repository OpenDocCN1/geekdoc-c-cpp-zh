    of these tasks if you did not change requests in Data Modeler.


    # # Summary


    It is important that the database designer is involved with the project at the
    stage of requirements analysis because the requirements for the database must
    be collected and documented. The database designer will need to ask a lot of questions
    to find and document all the possible information needed. The formal ways to document
    the requirements are usually entity-relationship diagrams and data flow diagrams.
    The more the documentation can be inserted into a tool in a formal way, the better
    it will be used in the next phases of database design. It is valuable to document
    everything that you hear and see during the requirements analysis. But do not
    worry if you cannot because luckily the same tools are available in the conceptual
    design phase.'
