- pgno: 36
  md: '# 10 Oracle SQL Data Modeler for Database Design Mastery


    This chapter will cover what you need to know about Oracle SQL Data Modeler before
    start using it. Agreeing on and implementing certain guidelines with your team
    before start working with the tool will help you streamline your workflow. Specifically,
    before starting to use Data Modeler in production or in a multiser environment,
    it is valuable to decide on standardization issues, tweak some settings in the
    tool, and tune it particularly for your needs. In many cases, it is good to start
    with a small project when first implementing Data Modeler into your workflow,
    not because it is a difficult tool to use because there are so many decisions
    to make in order to use its full potential.


    A simple way to standardize your team''s workflow and to improve the quality of
    your database design is to use domains, glossaries, and design rules. A domain
    defines the possible values for an attribute. Creating domains is easy, but deciding
    what might encompass is difficult. A glossary is a pre-accepted set of terms,
    in other words, a vocabulary that can be used in a design. Creating a glossary
    will probably be more challenging than creating a domain because on what to call
    concepts is usually difficult. Design rules are a predefined set of rules for
    the quality of design. Creating domains and glossaries for all the designers to
    share with it, and implementing domains and glossaries will increase your productivity
    and the quality of all your designs. In addition, using the design rules before
    moving to the next phase in the design process will improve the quality of the
    final database.


    Here are some other questions to consider: Which reports do you use? Where will
    you save them? What kind of data definition language (DDL) files will you have,
    and will you will save them? How will you use version control, if at all? What
    kind of relational database management system (RDBMS) will you use? I will touch
    on these topics throughout this book.


    # Downloading and Exploring the Tool


    You can download Data Modeler from the Oracle Technical Network (OTN) at www.oracle.com/technwork/developer-tools/datameler/overview/index.html.
    After downloading the .zip file, unzip it to start using Data Modeler.


    There are different versions of Data Modeler depending on your operating system
    and whether you want the version with or without the Runtime Environment (JRE).
    You can download the free, stand-alone product of Data Modeler or Oracle SQL Developer,
    which has Data Modeler integrated into it. You should agree on which version of
    the product will be used in your organization to avoid conflicts with different
    versions, especially if you are using version control in a multiser environment.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# Chapter 2: Getting Started with Oracle SQL Data Modeler 11


    # # What Is a Design?


    In Data Modeler the collection of objects you create is called a design. A design
    consists of one Extensible Markup Language (XML) file with the extension .dmd
    (for example, Customer.dmd), a directory (for example, Customer), and subdirectories
    and XML files. Each element (for instance, a design, a table, or an entity) in
    a design has its own XML file and its unique identifier (object ID). The .dmd
    file creates all the needed directories and subdirectories automatically when
    you create a design. You should not edit these XML files outside the tool unless
    you know what you are doing because you breaking the files. Common reasons for
    an XML file to break is using an editor that does not support XML or using the
    wrong character set. If you break one of these files, Data Modeler will not be
    able to read it.


    > TIP

    If you want to give the design to another Data Modeler user, just compress the
    .dmd file and the directories in one .zip file and pass that to the other person.


    A design consists of one logical model, optionally one or more relational models
    that are based on that logical model, and optionally one or more physical models
    that are based on one relational model. There can also be multidimensional models,
    data type models, process models, domains, business information, and so on.


    You need to decide what a design will consist of before starting to use Data Modeler
    in production: and how you will name it. A design can consist of all the databases
    in your organization, one database instance, one schema, or something totally
    different. You''ll want to define what a design is so you know how you to deal
    with objects that might be shared between applications, schemas, or databases.
    If you want to share objects, they should be in the same design since Data Modeler
    does not fully support sharing objects between different designs. Also, it is
    valuable to decide who will use Data Modeler and what they will do with it. This
    decision might help you to understand what a design means in your organization
    and to give the right privileges to the people in your organization. In addition,
    you should create a naming standard for your designs. For example, you could call
    a design Customer or CUSTOMER or CustomerDB or CustomerData. Which one will you
    use? It is much more efficient if designs are named consistently and you know
    where to find them.'
  merge: -1
  img_proc: true
