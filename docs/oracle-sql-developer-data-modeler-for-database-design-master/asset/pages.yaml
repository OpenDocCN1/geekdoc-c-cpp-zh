    # # Summary


    Designing a database for a data warehouse is a bit different than designing an
    operational database. The main difference is that you do not concentrate on the
    business processes, business rules, and requirements for reporting and analytics.
    A data warehouse database usually consists of the business processes described
    in a dimensional model.


    The main tools in Data Modeler to assist in data warehouse design are data flow
    diagrams, transformation packages, dimensional modeling (the logical model and
    the relational model), and the multidimensional model. The process for data warehouse
    modeling is similar to the one described in Chapters 3 to 7 except that usually
    a warehouse-specific modeling technique is used instead of 3NF. The most common
    techniques are star schema, snowflake, and Data Vault. The multidimensional model
    is created based on dimensional model (star or snowflake) and can be implemented
    in a database that supports multidimensional arrays. Multidimensional objects
    are used by OLAP tools for analyzing the data.


    Data Modeler has excellent support for many kinds of search and reporting operations.
    You can also create your templates for reporting. Dynamic properties and user-defined
    properties can be used to add your own functionality to Data Modeler.'
  merge: -1
