- pgno: 84
  md: '# 58 Oracle SQL Developer Data Modeler for Database Design Mastery


    Conceptual database design is the process of translating the requirements into
    a formal conceptual data model and process models. The result of a conceptual
    database design is a conceptual schema and process models. Conceptual database
    design is similar to requirements analysis, but the difference is that the database
    designer must get all the information needed to be able to design the database.
    The main concern is the data and how it should be saved and retrieved.


    This chapter will focus on entity-relationship (ER) modeling. Data flow diagrams
    are also important, and if they were not made during the requirements analysis,
    you''ll need to spend some time working on them. They are valuable for showing
    how the database will be used; you can learn more about data flow diagrams in
    Chapter 3.


    A problem that arises during the conceptual database design phase is the poor
    quality of requirements analysis. There is usually not enough material and information
    to understand the whole picture, which is important when designing a database.
    The database designer must ask a lot of questions and demand complete answers.
    Modeling is a demanding job, but the fact that spoken language is not exact makes
    it even more difficult. In addition, users do not always realize they should tell
    the database everything they know, even all the basic information because the
    designer is not a business expert. A designer should have at least an elementary
    awareness of basic logic to be able to formalize the spoken language and should
    have the courage to ask a lot of questions to understand what the end users mean.


    To be able to generate valuable reports, it is important to insert all the information
    you have in Oracle SQL Developer Data Modeler. See Chapter 11 for information
    on reporting. Data Modeler has useful features for setting common properties for
    several objects of the same type. See Chapter 11 for more information on those
    functionalities.


    # Setting Preferences and Properties


    It is important to set some standards for the design work. Now is the time to
    agree on naming standards and rules, as covered in Chapter 2, if you haven''t
    already done so. For example, will you choose Scandinavian letters? Will names
    be uppercase, or can they be mixed case? There are many ways to get Data Modeler
    to work the way you want and to support your standards.


    Select your design in the Browser pane, right-click it, and select Properties.
    The Design Properties dialog box opens how your diagrams will look or set some
    design-level properties discussed in Chapter 2. You can specify your naming standards
    and templates. You can also define a naming standard for attributes, columns,
    domains, entities, and tables by setting a pattern for the name. A pattern is'
  merge: -1
  img_proc: true
