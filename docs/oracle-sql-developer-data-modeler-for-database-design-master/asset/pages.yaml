- pgno: 118
  md: '# Oracle SQL Developer Data Modeler for Database Design Mastery


    The process of creating the logical database design mainly consists of transforming
    the conceptual model (logical model) into a relational model. Usually that called
    the logical data model, but in Oracle SQL Developer it is called a relational
    model. The result of this phase of database design is the relational database
    schema, which is a set of relational schemas and their constraints. If the conceptual
    design was done with Data Modeler, engineering to the relational model is easy.
    If it was done with another tool or without a tool, the first step is to insert
    all the data into Data Modeler to be able to use the functionalities Data Modeler
    provides for the transformation.


    The logical database design process starts with the entity-relational (ER) model
    that was created in previous phases of database design. Depending on how it was
    done, either you continue working on it or you move straight to transformation.
    Usually the model is not complete yet; you might need to add more attributes,
    define the data types, and so on. Now you start thinking about whether the entities
    and relationships are modeled according relational theory, and you make decisions
    on more difficult issues about modeling. This is the point where you must know
    how this database will be used (its functional models).


    If we not done earlier, it is good to start thinking about what to do with the
    data history, whether you need a security solution, what kind of roles there are
    for the users, and so on. It will be easier to implement these functionalities
    when there is a clear vision and understanding of the database.


    # Setting Preferences and Properties


    There are some preferences you have not investigated that affect the relational
    model. You can find the preferences by choose Tools | Preferences. In the Preferences
    dialog, on the Data Modeler, you''ll see a preference called Show Select Relational
    Models Dialog. If you select it, you can specify which relational models (and
    physical models) will be opened automatically when opening a design. If it is
    not selected, all relational models will be opened, but you will not be able to
    specify whether the physical designs will be opened, and they will not be opened
    automatically. My recommendation is to select Select Relational Models Dialog
    so you can control what will be opened and what will not be opened.


    To define the preferences for the relational model diagram, select Preferences
    and go to Data Modeler | Diagram | Relational. There is only one preference to
    define: Foreign Key Arrow Direction. This preference controls whether the arrow
    points toward the primary key or toward the foreign key in a foreign key relationship.


    To define the preferences for the logical model, select Preferences and go to
    Data Modeler | Model | Logical. (These preferences were shown in Chapter 4; see
    Figure 4-2.) on the Model | Logical tab, you can define the following:


    +   - By Selecting Name – Keep As Name Of The Originating Attribute, tell Data
    Modeler to keep the name specified for the attribute same'
