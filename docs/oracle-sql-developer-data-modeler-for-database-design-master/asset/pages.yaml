    # Sequences


    A sequence is a database object for generating unique integers that multiple users
    can use. You can, for instance, use a sequence to automatically generate primary
    key values, and usually that is combined with a trigger to get the next value
    from a sequence and add it to the primary key column. A sequence is not guaranteed
    to be gapless since the sequence is always incremented after a sequence'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'number is generated, no matter the transaction was committed or rolled back.
    You can also use the CACHE option with sequences. The sequence numbers will be
    reserved—those numbers are defined in cache—and none of them will be returned.
    If CACHE is set to 20 and the next value of sequence A is 1, this next value operation
    takes 20 from the sequence, and when you ask for the next value again, you will
    get 21. The CACHE option is usually used with bulk loading. A sequence number
    is unique in that two users cannot get the same sequence number (unless the sequence
    is altered or re-created), but a user can use the sequence number generated as
    many times as needed (Oracle does not stop). One can be used for multiple tables,
    but that is not usually recommended. Usually it is recommended to create one sequence
    per table.


    In the physical model you define a sequence in the Browser pane and choosing New.
    For a sequence you define the name, the owner (User), the first number for the
    sequence (StartWith), how much the sequence is increased (Increment By), the smallest
    and largest values for the sequence (Min Value, Max Value), whether the sequence
    can start from the first value when the last value has been reached (Cycle, NO/YES),
    whether the cache will be disabled (Disable Cache, NO/YES), the cache size (Cache),
    whether the order of sequences generated in a Real Application Cluster (RAC) environment
    is guaranteed to be the order of requests (Order, NO/YES), and whether the sequence
    is only session (Session Only, NO/YES). You can also enter comment and notes and
    add privileges by clicking the Permissions button.


    In Oracle 12c you can also use an identity column. In a CREATE TABLE clause, you
    simply tell that the column is an identity column, and the value is automatically
    incremented as you have defined it; no trigger is needed. Data Modeler supports
    this, and it is defined for a column in the relational model in Column Properties
    by selecting Identity Column.


    # Views


    If you create views in the relational model, you will see them in the physical
    model automatically. You cannot create new views in the physical model, but you
    can add the schema and other physical properties related to the selected RDBMS
    site and grant privileges.


    # Materialized Views


    A materialized view is a database object that contains the result of a query at
    a certain moment, and you can define how and when the result is updated. A materialized
    view can be based on tables, views, or other materialized views. In replication
    terms, the term for these objects that the materialized view is based on *master
    tables*; in data warehouse terms, they are called *detail tables*. In previous
    versions of Oracle, some of the functionalities of materialized views were called
    *snapshots*'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# Chapter 6: Introducing Physical Database Design 157


    You can create a materialized view in the physical model by selecting Materialized
    Views in the Browser pane, right-clicking, and choosing New. For a materialized
    view''s properties there are seven tabs: General, Body, Cluster Columns, Partitioning,
    Refresh Clause, Comments, and Notes. On the General tab you can define the name
    and the owner schema (User) for the materialized view. You can also define whether
    it will be partitioned, part of a cluster, the tablespace it will be saved, storage
    settings, and other physical properties for the DDL clause. You can also define
    whether it will be updated (Build) immediately or deferred, whether it will be
    updatable (Update), and if it is query rewrite enabled. On the Body tab, you can
    specify the refresh part of the DDL. In Comments and Notes, you can document the
    materialized view. And with the Permission button, you can grant privileges for
    the materialized view.


    # Stored Procedures, Functions, and Packages


    In Oracle Database there are objects that are actually PL/SQL programs such as
    stored procedures, functions, and packages; you can also create these with Data
    Modeler. In the Browser pane, go to the object type you want to create (Stored
    Procedures, Functions, or Packages), right-click, and choose New. Then define
    the name and the owner for this object (User). You can also add comments and grant
    privileges (Permissions). When you save the object (OK), you will be taken to
    an editor somewhere else. After you have finished editing, you can save it by
    clicking the Save icon. You can edit these objects if you select the object name
    in the Browser pane, right-click, and choose Edit, and you can delete an object
    by choosing Delete.


    Although you can create these types of objects with Data Modeler, the editor is
    not great, so probably it would be wiser to create them with Oracle SQL Developer.
    You can just document the names and privileges to Data Modeler or copy and paste
    the code from Oracle SQL Developer to Data Modeler.


    # Triggers


    In Data Modeler you can create triggers for tables and views. In Oracle you can
    also assign them to a schema or a database, but those features are not supported
    in the current version of Data Modeler, and probably there is no need for that
    functionality either. A trigger is like a stored procedure except you cannot explicitly
    invoke it; the database it automatically based on a triggering event. If a trigger
    is disabled, it will not be invoked at all. Maybe this is the reason everyone
    likes triggers. There can be a lot of traffic in the database without anybody
    actually calling a program, and so, having triggers in a database means you need
    to have processes to control, maintain, and watch them in order to know what is
    happening and to be able to be prepared.'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# Oracle SQL Developer Modeler for Database Design Mastery


    To create a new trigger, go to the physical model''s Browser pane select the table
    or view name you want to add the trigger for, go to Triggers, right-click, and
    choose New. For a trigger you define properties on four tabs: General, Trigger
    Body, Update Columns, and Comments. On the General tab, you define the name for
    the trigger and the schema owner (User) and the action that will invoke it (Insert/or
    Update and/or Delete). You also specify the triggering time (Before/After), the
    scope (for each row, for each statement), and the state (enable/disable). You
    can also define the names for old parameters (Ref OLD as), new parameters (Ref
    NEW as), and parent parameters (Ref PARENT as) and the Condition. On the Trigger
    Body tab, you can write the actual PL/SQL code for the trigger action, and on
    the Update Columns tab, you can select or remove columns to be updated if the
    action for the trigger is Update. On the Comments tab, you can document the trigger.


    # User-Defined Data Types


    You are not able to create data types in the physical model, but the collection
    types and structured types you might have defined early in the data types model
    will be automatically brought to the physical model.


    You are able to change the name of a collection type and define the settings Owner,
    Force Place (NO/YES), OID (Object Identifier), and Comments for it. You can also
    define privileges by clicking the Permissions button.


    You can also rename a structured type and define the settings Owner, Force Place
    (NO/YES), Global ID, Invoker Rights (empty, Current_user, Defined), Map Order
    Functions, Map To Java Class (NO/YES), and Comments for it. You can also define
    privileges by clicking the Permissions button.


    # Other Elements


    If you want have the whole database designed and documented in Data Modeler, you
    can do that. You can add a database with its properties to the physical model
    to get the DDLs for it. In Database Properties, you can define properties on the
    General, Logging, and Tablespaces, and you can write comments. After defining
    the database for the physical model, you can see in the Browser pane new branches
    for adding data files, redo log groups, and SYSAUX files to database.


    You can define directories and disk groups, and you define contexts, which are
    sets of application-defined attributes that validate and secure an application.
    You can also create clusters. A cluster is a schema object that contains data
    from one or more tables. The data of a cluster is that the data are retrieved
    together saved close to each other to enable fast performance. All the tables
    in a cluster must have at least one column in common. An index cluster stores
    all the rows from all the tables that share the same cluster key, and a hash cluster
    stores rows that have the same hash value together. In the physical model, you
    can create a cluster and attach tables or materialized views in it on the Table/Materialized
    View Properties tabs of the Cluster Properties dialog.'
