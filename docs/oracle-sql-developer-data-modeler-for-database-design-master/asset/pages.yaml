- pgno: 1
  md: 'In the real world, the foundation of everything we think about and do is data.
    Our brains organize data by patterns, which is another way of saying sets. In
    the virtual world of programming, it''s still all about data. But now we have
    to build and manage the sets of data ourselves. We can and should use the SQL
    language as our means of communication, but even before that, we''ve got to make
    sure the data is organized so that it accurately captures and expresses the relationships
    between them. Skip or do a poor job at database design, and everything else in
    your application process will suffer. Do it right, and everything that follows
    is more intuitive, easier to build, and much easier to maintain.


    With long and deep experience. Heli has written an ideal guide to both database
    design and Oracle SQL Developer Data Modeler.


    > --Steven Feuerstein

    Architect, Oracle Corporation


    Working as a database administrator and developer, one of the hardest problems
    you encounter is coming late to a project that is suffering from performance problems.
    In many cases the problems are caused by fundamental flaws in the database design.
    Identify these too late in the development process and the job of redesigning
    the database and refactoring the associated code can be a huge problem.


    Over the last 30+ years programming paradigms have come and gone, but data has
    remained king. Regardless of your chosen development methodology, if you are planning
    to use a relational database, you have little choice but to spend time on the
    design phase. Trying to cut corners will always results in problems later.


    > --Tim Hall

    Oracle ACE Director

    Database Administrator, Developer, and Author

    http://oracle-base.com


    Data modeling is critical to success. Data modeling and data design are more important
    than ever. With the onslaught of big data, our job is even more critical; turning
    data into information is a necessary task and cannot be accomplished without understanding
    the structure of the data really is. If we do not run our focus to understanding
    the structures of the data, then we cannot properly identify it or make sense
    of it, much less turn it into information that the business can utilize.


    > --Dan Linstedt

    Founder and CEO

    http://LearnDataVault.com'
  merge: -1
  img_proc: true
- pgno: 2
  md: 'Enterprise applications are used to enable business. A great application not
    only supports a process but allows the organization to understand what is happening
    and allows it to respond. Key to all this is the data, and a well-designed database
    allows that access and flexibility.


    My reality is that whenever I have struggled to get the information I need from
    an application, it has been because of poor database design. This book will reinforce
    the need for good-quality database design.


    > —Debra Lilley

    ACE Director


    The idea of producing a formal database design is regarded by many as being old-fashioned
    these days. However, from my 25+ years’ experience of working in the field of
    database performance, I do see a clear correlation between the time spent designing
    a database up front to meet the functional requirements and the chance of success
    of the project. The correlation in the other direction is even clearer; if time
    is not invested in understanding the requirements of the application system and
    in understanding the database that stores its data, then the chances of building
    a system that meets user requirements is small, and the probability of heading
    off on a tangent from the core requirements is greatly increased. Performance
    cannot be retrofitted to a system; it has to be designed in.


    Using tools to help automate the design process, as recommended in this book,
    reduces the time needed for the design stage and makes it less likely that there
    will be a temptation to short the design stage. And that has to be better for
    everyone.


    > —Graham Wood

    Architect

    Oracle Corporation'
  merge: -1
  img_proc: true
