- pgno: 299
  md: '# Chapter 11: Generating Reports and Using Search 273


    # Simple Mode


    In simple mode, you can search using strings, or you can use regular expressions
    as the search criteria. You can also run a report on the search result or change
    common properties for the search result.


    To start a search in simple mode, select the Simple Mode radio button and enter
    a string to be searched for in the box with the binoculars sign, as shown earlier
    in Figure 11-7. Depending on what you selected in Preferences, the display is
    either as you type or when you press ENTER.


    ![](img/431f8ac8f273fa89a28377c500ed60d7_299_0.png)


    > TIP

    If you want to search everything, just type an asterisk (*) in the field.


    Select either All or one of the object types in Filter to limit the search. If
    you select Case Sensitive, the search will also check the case sensitivity. If
    you select Stop On First, the first occurrence of the result is displayed if there
    are duplicates Name.


    In Results, you can see the elements that fulfilled the criteria. If you double-click
    an element in the list, you can see and edit the properties for that element.
    You can change the column order in Results by dragging and dropping the columns,
    and you can sort the result by clicking the column header.


    In Diagrams, you can see the diagram or diagrams where the object can be found.
    If you double-click the diagram name, the diagram will open.


    If you want to save the search, go to Searches (<New Search> field, enter a name
    for the search, click More, and select Save. If you select Clear for More, the
    search result will be deleted. Before deleting it, Data Modeler asks, “Are you
    sure to delete saved search?” If you use one of the saved searches, click the
    button next to <New Search> and select the desired search from the list. You can
    pin the search by clicking the pin icon, and if another operation is started,
    it will be on its own tab.


    If you use Regex, you will have an enormous number of possibilities for searching
    the content in open designs with regular expressions. You can, for example, search
    for anything in open designs that have some indication of having a URL (includes
    any of these strings: http;, https;, or ftps:) by searching for (http|https?):),
    group the pattern elements into a single element, and the pipe symbol (|) says
    that one of the alternatives should match (or or ht). The question mark (?) says
    that the pattern (s) is optional. Then, the preceding regular expression matches
    it; http;, https;, and strings. Figure 11-9 shows an example of a search with
    a regular expression. The search returns the Comment property of an attribute
    EMPLOYEEs.\


    The characters | and ? are called metacters, and using them makes regular expressions
    powerful. Another example of a metacharacter is (,), which means an interval.
    {1} means exactly one, {1} means at least one, and {1,7} between 1'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# 274 Oracle SQL Data Modeler for Database Design Mastery


    ![](img/431f8ac8f273fa89a28377c500ed60d7_300_0.png)


    # FIGURE 11-9. Global search with regular expression


    7. Using this you can find, for example, anything that has two p''s in it with
    p[2] or at least two p''s with p[*]. This search would return, for instance, humppa.

    Curly braces, {}, are called a quantifier. Other quantifiers are: * meaning 0
    or more, + meaning 1 or more, and ? 0 or 1. As mentioned earlier, (...) is a group.
    The square brackets, [], indicate a range. For instance, [abc] means "a or b or
    c". [^abc] means "not a or b or c". [1-9] means "any digit between 1 and 9", and
    [a-q] means "a letter between a and q". Ranges are inclusive. There are plenty
    of other metacharacters that can be used as well. You can use all the basic elements
    to create complex and powerful patterns. For instance, ((?=*/d)?[*a-z])(?=*[A-Z]){8,15})
    can be used to check that the string includes at least one digit, one lowercase
    letter, and one uppercase letter, and is 8 to 15 characters long.


    > TIP You can read more about regular expressions at http://docs.Oracle.com.


    # Advanced Mode


    Advanced mode has more features for searching than simple mode. In advanced mode,
    you can search by object properties, and you can specify ORs and ANDs in the search
    logic. Select the Advanced Mode radio button to enable these features.'
  merge: -1
  img_proc: true
