- pgno: 23
  md: 'Database design is vital for any company that is serious about its data, our
    most valuable asset. To support efficient database design work, a designer must
    have a tool to be able to document the data and data usage in a formal way. This
    book helps people design their databases better and shows how to use a tool called
    Oracle SQL Developer Data Modeler in that job.


    Database design consists of analyzing requirements and creating the conceptual,
    logical, and physical designs. This process is iterative and incremental, and
    all these phases will be done over and over again to get the correct and optimal
    design for the purpose. Database design is a process of producing detailed entity-relationship
    (ER) diagrams and data flow diagrams (DFDs), and it ends up producing the scripts
    (DDLs) for creating all the objects needed for the database. In this book, I go
    through the entire process of database design using Oracle SQL Developer Data
    Modeler.


    # Chapter 1: Introducing Database Design and Oracle SQL Developer Data Modeler


    In this chapter, you''ll learn the basics of database design and Data Modeler,
    and you will get some ideas on designing databases in an agile development process.


    # Chapter 2: Getting Started with Oracle SQL Developer Data Modeler


    In this chapter, you''ll explore how to get started with Data Modeler and how
    to set it up to meet your needs.'
