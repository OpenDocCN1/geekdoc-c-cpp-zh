    # Adding a Design to Subversion


    On your local computer you should have specified a directory to serve as the parent
    for design-specific working directories when you specified the Default Designs
    Directory preference (see Chapter 2 for more information). Under that directory
    you should create directories for all your designs as working copies. For instance,
    you may want to create a design called Customer and need to create a design called
    Customer under the design directory to serve as a working copy directory for the
    design Customer. If you have not created the connection to the Subversion repository
    yet, you must do it before you use Subversion.


    Now is the time to add the design to Subversion. There are two ways of doing it:
    You can save the design to a directory that has been defined as the working copy
    directory, or you can import the design to version control. Oracle recommends
    only the save-as method because the import method also adds .local files to Subversion,
    which is not recommended.


    To save a design to a working directory and add it to version control (the save-as
    method), follow these steps:


    +   1. Create your design and save it to some other location than the working
    copy directory. Close the design.'
