    In Figure 1-1, you can see my version of agile database design. It starts with
    requirements analysis and finding the main concepts and their relationships. Next
    you try to model the conceptual model as well as you can. Then you design the
    conceptual model for iteration n, making it as detailed as possible; continue
    to the logical design of iteration n; and finally move to physical design and
    creating the database objects with the DDL scripts. Then you perform the whole
    again for iteration n+1, and so on. The process is the same as it is in other
    projects; the only difference in an agile project is that you move from phase
    to phase faster, and you design in pieces, rather than as a whole.


