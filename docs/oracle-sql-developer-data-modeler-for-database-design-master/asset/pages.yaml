    # Synonyms


    You might have defined synonyms in previous phases of your designing process.
    Those synonyms are completely different synonyms than the ones Oracle Database
    has objects. The first time and place to define the Oracle synonyms is in the
    physical database design and physical model. A synonym is an object in the database
    that provides an alternative name for another database object (table, view, sequence,
    procedure, stored function, package, user-defined object type, and so on). Synonyms
    provide both data independence and location transparency, meaning that you do
    not need to know which user is the owner of the object or in which database the
    object is located; all this information is hidden in the synonym details. A synonym
    does not replace privileges. If you do not have privileges to the object synonym,
    you cannot access the object.


    To create a new synonym, go to the Browser pane, select Synonyms, right-click,
    and choose New. For a synonym, you must create a name, the owner of this synonym
    (User), and YES/NO. If a synonym is public, it is available to all database users.
    If it is private, then only the database user who owns the synonym can actually
    use it. Next you define the Object Owner and Object Name settings for this object
    synonym is created for. The owner can be selected from the list, but unfortunately
    the name must be written manually. I hope in future releases of Data Modeler there
    will be a list of values here since there is a big risk you might misspell the
    object name. You can also specify the database link (DB Link)'
