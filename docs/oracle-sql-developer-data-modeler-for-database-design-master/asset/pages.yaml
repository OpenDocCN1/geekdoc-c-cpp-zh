- pgno: 149
  md: '# Chapter 5: Introducing Logical Database Design (Relational Model) 123


    The General tab has properties for controlling engineering, reverse engineering,
    and DDL generation. Engineer defines whether the table and its properties will
    be included when engineering to the logical model (reverse engineering), and Allow
    Columns Reorder During Engineering lets Data Modeler reorder the attributes of
    the associated entity in the same order as their associated columns in the table
    definition. This property is copied from the properties (Allow Columns Reorder
    During Engineering) earlier in this chapter but can be changed if needed for an
    individual table. Generate In DDL defines whether the table is included during
    backward engineering.


    Engineer As Relationship defines whether relationship attributes are created during
    backward engineering. In other words, if the table is an intersection table, selecting
    this will let the table be backward engineered as a many-to-many (m:n) relationship
    in columns which are not in the foreign key attributes of the relationship. This
    is the opposite behavior for transformation when the logical model has a many-to-many
    relationship with possible attributes. If you want to associate a schema with
    a table, you can do that in the table properties by selecting the schema from
    the drop-down list. If you have not added the schema, you can do it in the Browser
    pane under Relational Model by right-clicking the schema, selecting New Schema,
    and giving a name to the schema. You can add views, tables, and indexes to a schema
    either on view/index properties or by selecting them in the schema properties.
    If you associate a schema to your relational model object, the schema name will
    appear in diagrams, and the schema name is also used during DDL generation. You
    can read more about DDL generation in Chapter 7. Usually schemas are added in
    the physical design, as shown in Chapter 6.


    > TIP

    If you have created schemas and associated them with objects, you can create relational
    models based on that. In the Browser pane, go to the relational model, right-click,
    and select New Models Based On Schema Names. Data Modeler will create a new relational
    model for each schema you have specified and name it with the same name as the
    schema.


    There are also other properties for a table. You can tell that the table is a
    spatial table by selecting Register As Spatial Table. For a structured type, you
    can allow type substitution for DDL generation by selecting Allow Type Substitution.
    You can define that the table will have an object identifier primary key (OID)
    by selecting Object Identifier Is PK, and in DDL generation for Oracle the OBJECT
    IDENTIFIER IS PRIMARY KEY clause is generated.'
