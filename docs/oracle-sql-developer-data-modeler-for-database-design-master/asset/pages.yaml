    # Tablespaces


    Before entering tablespaces in Data Modeler, you must design them and plan how
    you will use them. A database object is saved on a tablespace, which is a logical
    set of data files in a database. These tablespaces are categorized as permanent
    tablespaces because they save the data permanently. There are also two kinds of
    tablespaces: temporary and undo. A Temporary tablespace is used, for instance,
    to manage space for database sort operations and to store global tables. A temporary
    tablespace contains schema objects only for the duration of a session. Objects
    in temporary tablespaces are stored in tempiles. An undo tablespace is for managing
    undo. Undo records used to roll back transactions when ROLLBACK statement is issued,
    to recover the database, to provide consistency and by Oracle Flashback Query
    to analyze data of an earlier point in time or to recover logical corruptions.
    Oracle Database versions before Oracle 9 used rollback segments for that. Data
    Modeler supports rollback segments even though Oracle strongly recommends using
    undo tablespaces rather than rollback segments.


    +   One object must be saved in one tablespace, but several objects can be saved
    on the same tablespace. Usually the objects saved on the same tablespace are similar
    in the way of stability and size. Usually just one kind of object is saved in
    one tablespace (this is not a rule, but it makes life easier): tables to one,
    indexes to another, and so on. Whatever your preference is when designing the
    tablespace use, remember to design and know why you did it the way you did.


    A tablespace is created in the Browser by selecting the tablespace, right-clicking,
    and selecting New. The tablespace properties have eight tabs: General, Default
