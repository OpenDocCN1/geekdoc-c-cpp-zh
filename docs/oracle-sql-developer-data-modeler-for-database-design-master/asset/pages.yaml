  md: '# 210 Oracle SQL Data Modeler for Database Design Mastery


    works as it should. If you accidentally remove the _svn subdirectory or anything
    else happens to it, the easiest way to fix the problem is to remove all the files
    and directories from the design directory and check out the design from version
    control again to the same directory. The Subversion server does not know there
    are working copies on your computer, deleting the working copy does not affect
    Subversion. But make sure you have committed all the changes before deleting the
    working copy. There is no need on performance or any other reason to delete the
    working copies unless you will not be working with this design anymore.


    The working model with Subversion is a copy-modify-merge solution. Copy (from
    the version control to your working directory), modify your copy in the working
    directory, and merge your changes to Subversion. Each time you commit, you create
    a new revision of your design to the Subversion repository. There is always a
    number identifying the revision. Each revision number has a file system tree attached
    to it, which is a snapshot of the moment it was saved. The revision number applies
    to the whole tree, not individual files.


    In Subversion, a project is a solid unit of something like in Data Modeler. It
    is a directory under which all the files are saved. In Subversion you can define
    permissions for user groups and add user accounts to the rights to grant them
    permissions. But first if you really need to do that in case somebody must create
    the projects/design directories in Subversion and grant privileges before anyone
    can insert the files. And somebody must maintain the hierarchies. The other possibility
    is to grant privileges to the Subversion repository or to the main data for Data
    Modeler designs.


    Subversion does not give the structure for your project layout, and it does not
    define for you whether you need one repository or several repositories. You can
    have one project per Subversion repository, all your projects in one repository,
    or something in the middle. If you decide to have one repository, it typically
    means less administration, but revision numbers are global and cannot be used
    as meaningful. Large projects can cause problems to other projects in the same
    repository, for instance, by taking a lot of resources from the repository. Multiple
    repositories usually work best if the projects have nothing to do with each other
    and need to be administered separately. In that case, the repository structure
    can be tailored to each repository and user permissions can be defined easily,
    but there is a big limitation: Subversion does not support merging between different
    repositories. In general, the easiest solution is to have one repository for all
    the Data Modeler designs.


    Subversion does not define the structure of a repository or the project layout.
    You might want to have three subdirectories in your Subversion repository either
    in the root or per design directory: trunk, branch, and tags. Trunk is the main
    line or root of the design, and the main development line should be saved in the
    trunk folder. You might want to create specific branches, and they should be saved
