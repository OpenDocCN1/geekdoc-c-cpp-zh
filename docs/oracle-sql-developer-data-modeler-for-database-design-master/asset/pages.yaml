- pgno: 208
  md: '# 182 Oracle SQL Data Modeler for Database Design Mastery


    Designing a data warehouse (DW) database is usually different from designing an
    operational database, which is a database for online transaction processing (OLTP).
    A DW database can be designed like any other database using the principles of
    entity-relationship (ER) modeling, as third normal form (3NF) and so on, but usually
    that is not an optimal solution because of the need for complex relationships,
    drill-downs, and so on. Therefore, you can use a logical design technique called
    dimensional modeling to design a data warehouse. The biggest difference is that
    designing a dimensional model is about business rules, while designing an ER model
    is about data and rules.


    An operational database usually faces a lot of short and fast inserts, updates,
    and deletes and reasonably select queries for fundamental operational tasks, while
    a DW database is usually for bulk loading and complicated queries on a large amount
    of data for planning, analyzing, and decision support purposes called online analytical
    processing (OLAP). The data for a DW database comes from several other databases,
    and the data can be transformed or consolidated on the database. There are several
    techniques for modeling a DW database: ER modeling (3NF), dimensional modeling
    (the most popular ones are star schema and snowflake), and Data Vault (a hybrid
    of ER and dimensional modeling). These techniques also include pattern solutions
    for known issues when designing a DW database. Often a DW database is constructed
    with data marts (or information marts) that are called in Data Vault 2.0 that
    include one or more dimensional models. The dimensional modeling is done with
    ER notation. If the database supports OLAP features, multidimensional notation
    can be used on top of the dimensional modeling. Multidimensional modeling includes
    the concept of cubes.


    This chapter does not go into all the details of designing a DW database, which
    would be a topic of a whole new book, but you will learn how Data Modeler can
    help you when designing a DW database.


    # Introducing Dimensional Modeling Techniques


    In an OLAP environment, the queries to the database can be much more complex than
    the ones in OLTP. Here''s an example of a two-dimensional query in OLTP: “How
    much of product has been sold this month?” In an OLAP environment, the query is
    probably not two-dimensional but multidimensional;'
  merge: -1
  img_proc: true
- pgno: 209
  md: '# Chapter 8: Designing a Data Warehouse Database 183


    it is probably something like this: “How much of each of our products was sold
    on a particular day, by a particular salesperson, in a particular city?” In a
    multidimensional model, each separate part of that query is called a dimension.
    In a database in an OLAP environment, many of the answers to the subqueries are
    not calculated but retrieved from the database.


    Several techniques are available for modeling a DW database with a dimensional
    model. You will learn about three of them: star schema, snowflake, and Data Vault
    model. These techniques include the modeling techniques and predefined solutions
    for known issues in DW databases.


    A star schema is based on one central table (fact) and several tables that are
    connected by primary and foreign keys. The snowflake schema is also based on a
    central table (fact) and a set of constituent dimension tables that are further
    normalized into subdomain tables. The Data Vault model consists of three basic
    parts: the architecture (systems, three-tier architecture), methodology (rules
    on how and why), and the model (standardized data model with strictly defined
    entities). The Data Vault model is a combination of the star schema and 3NF. The
    model is based on three components: hubs, links, and satellites. A hub is a unique
    list of business keys for tracking and identifying information, a link is an association
    to hook together multiple sets of information, and a satellite is a descriptor
    that provides context for hubs and links.


    When building data warehouses using the agile methodology, the Data Vault method
    is the most flexible and probably the best for the purpose. But what is the difference
    between star schema and snowflake, and which one should you choose? Snowflake
    has less redundancy than star schema since the dimension tables are in normalized
    form. That makes a snowflake model is easier to maintain, but queries on it get
    quite complicated and sometimes perform badly. The snowflake model is good with
    dimensional analysis, whereas star schema is better for the data core and when
    there are complex many-to-many relationships, and star schema is better for marts
    and simple relationships (one-to-one and one-to-many). Snowflake modeling is a
    bottom-up approach, and star schema is a top-down approach to modeling.


    # Exploring Dimensional Design


    The process of dimensional design is of course similar to designing any database,
    but there are some tricks and tools that will help when designing a DW database.


    The requirements analysis is mainly about collecting requirements and documenting
    them as described in Chapter 3. The difference in a DW database is that you must
    also collect the source-driven requirements. They can be collected by investigating
    the ER models of the source databases and the business process documentation.
    If the source databases do not have documentation and process models, you can
    easily generate the model as described in Chapter 10 if the source database'
  merge: -1
  img_proc: true
- pgno: 210
  md: '# 184 Oracle Developer Data Modeler for Database Design Mastery


    system is supported in Data Modeler. Otherwise


    In conceptual and logical database design, the tools are ER models and data flow
    diagrams. The process is similar to the one described in Chapters 4 and 5. What
    is special in DW database design is that you should take advantage of the classification
    types and sometimes also transformations. There are already preset classification
    types in the Data Modeler tool, but you can create many new ones as you want.
    Right-click the design and select Properties. In the Design Properties dialog,
    go to the Settings | Diagram | Classification Types tab. You can see all classification
    types defined for this design. You can add new ones by clicking the green plus
    sign or you can change the existing ones by selecting the one you want and changing
    the properties you want. You can define the name for the classification type,
    define a prefix for it, and define the color used for that type of object in designs.
    Using classification types not only makes the diagrams easier but also gives you
    as a designer more tools when operating with different kinds of objects in your
    DW database. Classification types have been used in all the figures in this chapter.


    What is different from what you learned in Chapters 4 and 5 is the relationship
    between an ER model for an operational database and a dimensional model (made
    with ER notation) that is a single ER diagram might be broken into multiple dimensional
    models based on the business processes. For instance, ordering by might one business
    process and invoicing another process, but they both would be modeled in same
    ER diagram. That is why the business processes must be ordered and well documented
    to be able to understand them.


    The process of loading data into the data warehouse database can be designed with
    data flow diagrams, and the transformations can be designed with transformation
    packages (introduced in Chapter 3). In data flow diagrams, you design the process
    of loading the data, and in transformation packages, you design all the transformations
    needed for the data before loading it into the data warehouse database.


    # Star Schema or Snowflake


    There are already predefined classification types called Fact and Dimension for
    designing a star model or a snowflake model. You can edit those specifications
    if you want to define the prefixes for the classification types (on the Settings
    | Diagram | Classification Types tab of the Design Properties dialog). You could,
    instance, define FACT for fact tables and DIM for dimensions. First you design
    the dimensional model using ER notation from the logical model as you would for
    a star/snowflake: You select the business process, declare the grain, identify
    the dimensions, and identify the facts. The grain of the model describes the central
    process of this dimensional model in a single sentence and helps you to define
    the dimensions and facts. Then you define the classification type for every entity
    in design. You can do it in the Entity Properties dialog under Classification
    Types, or in the Browser pane you can right-click'
  merge: -1
  img_proc: true
