    # Partitioning


    If a table, or materialized view is big, it is possible to partition it. Partitioning
    in Oracle requires the partitioning option that is available for Enterprise Edition
    databases. Partitioning makes maintaining easier and improves the performance.
    In my opinion, the main advantage of partitioning is the maintenance, and second
    is the improvement on performance. For instance, partitioning makes deleting fast;
    you can just drop a partition. If you decide to use partitioning, carefully carefully
    the possibilities your RDBMS has for it and design partitioning carefully.


    Partitioning operation affects only the physical schema. That means the logical
    model (and relational model) stay untouched, and no programs need to be changed.
    Some partitioning may need some extra columns to get a working partition key,
    and then the logical model and programs must be changed.


    You can create a new partition in the physical model in the Browser pane; under
    the table you want to create, right-click, and choose New. There are five tabs:
    General, Subpartition Order, Subpartitions, Local Index, and Comments. On the
    General tab you can specify the following settings: Name, List (free text edit),
    Tablespace (from the list of tablespaces), Logging (null, YES, NO), Storage (select
    from the list of storage templates), and Data Compression (null, YES, NO). For
    a table in Table Properties, you set the Partition property to YES, and on the
    Partitioning tab you select the partition type and if needed the subpartition
    type. After selecting the subpartition type for the table, you can create a new
    subpartition of the selected type (Hash, List, Range) and specify the parameters
    needed for the DDL. In Browser pane (under the table) you can also define a storage
    template and LOB storage for a subpartition.


    ![](img/431f8ac8f273fa89a28377c500ed60d7_187_0.png)'
