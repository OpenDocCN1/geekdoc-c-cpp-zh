- pgno: 164
  md: '# 138 Oracle SQL Developer Data Modeler for Database Design Mastery


    The physical database design continues from the relational model created in the
    logical design. One relational model can have no physical models or as many as
    needed, and the physical model will be defined by its relational database model
    (RDBMS) site. An RDBMS site is an alias associated with an DBMS type (Oracle 12c,
    Oracle 11g, SQL Server 2008, and so on) supported by Oracle SQL Developer Data
    Modeler. To be able to design the physical model, you need a good understanding
    of the RDBMS site selected to be able to make the right decisions.


    In physical database design, design the physical database elements related to
    the selected technology (tablespaces, data files, and so on) and add physical
    properties to elements from the relational model. You estimate the space needed
    for the database, plan disks and groups, and figure out which database objects
    to put in which disk. You must plan the backup and recovery strategies and decide
    how to document the database changes, including changes in objects and changes
    in the RDBMS (which patch run when, and so on). You also need to agree who will
    create the documentation, what they will document, and where they will do it.
    You also design the database schemas, which are subsets of the database based
    on namespaces defined by schema names. You define users, roles, and privileges.
    You index, other than just primary keys and foreign keys. You design the physical
    database so that you will be able to create the database as designed. The data
    definition language (DDL) script generation will be mainly based on a physical
    model. Physical models do not have graphical presentations or diagrams, only a
    browser to create, edit, and remove elements. The outcomes from the physical database
    design process are the DDLs needed to create the database designed. In Chapter
    7, you will learn how to get the database generation files after all the objects
    and their properties have been defined in the physical model.


    > TIP

    Agree on naming standards for creating physical objects such as tablespaces and
    data files. These cannot be documented as part of the naming standards in Data
    Modeler, but for the consistency it is valuable to have a standard naming convention.


    ![](img/431f8ac8f273fa89a28377c500ed60d7_164_0.png)


    This chapter will not go through all the tasks in the physical design process.
    You will read about only those tasks that can be done with Data Modeler to design
    a physical model for Oracle 12c. All technologies have their own physical objects
    that need to be designed. There is a lot of designing work in physical database
    design, and some of the decisions must be made with the end users (such as user
    and role definitions) and even with the company board (such as backup strategy
    and definitions for sensitive data).'
  merge: -1
  img_proc: true
