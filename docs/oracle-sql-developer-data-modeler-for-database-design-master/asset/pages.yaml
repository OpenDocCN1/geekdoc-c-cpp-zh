- pgno: 122
  md: 'If you have one-to-one relationships in your logical model, check one one-to-one
    time that they are correct. Sometimes there is a good reason for having a one-to-one
    relationship, for instance the life cycle of the metadata and the rest of the
    data is different. An example could be an entity named Letter. There might be
    a business rule that the information about who the letter is for and when the
    letter was sent must be saved for 10 years but the content of the letter must
    be saved for only one month. From a maintenance perspective, two separate entities
    and a one-to-one relationship would be a good solution. If you make solutions
    that are purposeful but not obvious, remember to document them.


    > **TIP**

    Document solutions that are justified but not so obvious. You can use the Notes
    property for that.


    Now make sure you have normalized the logical model as far as needed. Data Modeler
    supports normalized design, and it also allows you to document the level of normalization
    in each entity (and table) on the Properties tab in the Normal Form property and
    to define whether it is normalized enough with the Adequate Normalized property.
    There are plenty of good books on relational theory that will explain normalization,
    among other things. In short, it means that the information has been saved and
    modeled once. It is vital to make sure the data quality in your database is good;
    what is the point of having a database full of information you cannot trust? If
    the data is saved only once, it stays correct and good quality much easier than
    if it has been duplicated in the database in many places. When you are ready with
    your logical model, it is time to move on transforming the relational model.


    # Setting Transformation Rules


    The transformation from a logical model to a relational model is straightforward.
    An entity will become a table, an attribute will become a column, and a relationship
    will become a foreign key. For a one-to-many relationship, a new column for the
    foreign key will be added to the child table, and in a one-to-one relationship,
    it will be added to the table on the mandatory side of the relationship. In both
    cases, if the relationship is identifying, the new foreign key column will be
    also added to the primary key of the child table. If the Create Surrogate Key
    property is selected for the entity, a surrogate primary key is automatically
    generated for a table.'
