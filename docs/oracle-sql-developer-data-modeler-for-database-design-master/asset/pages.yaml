    into smaller components. For example, Zip Code is an atomic attribute. An attribute
    can also be a composite attribute, which means it is a combination of two or more
    attributes that can be atomic or composite. An example of a composite attribute
    would be Name = First + Lastname. An attribute can be multivalued or set-valued,
