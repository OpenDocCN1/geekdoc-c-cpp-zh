    Teams menu to compare and merge the changes from the version in Subversion to
    your local working copy, or can you use the compare/merge functionalities to merge
    two local working versions of the designs and then commit the changes to control.


    If you want to use Merge Design first, open the main version (trunk) of the design
    in Data Modeler. Then follow these steps:


    +   1. Get all the incoming changes, and even if there might not be any available,
    select Update Working Copy in Pending Changes. That is even though you might not
    changed the trunk version of the design, you have changed the branch version of
    it, and therefore Subversion and your local working copy of the design are not
    synchronized.

    2. Make sure you have committed all outgoing changes and saved the design.

    3. Choose Team | Merge Design.

    4. Select the URL for the design in the branch directory (the branch version of
    your design) and click OK.

    5. In the Merge Design pane, you can see all the revisions for the version of
    your design in that branch. Select the revision (if you have written good comments
    in Comment when saving the revision, selecting should be easy).

    6. In the Action pane, you can see each change in that revision. Right-click the
    change and choose Compare And Merge. If you know you to merge everything, you
    can also select the revision from the revision list, right-click, and choose Merge.

    7. In the XML Metadata Comparator, you can see what the differences are, and you
    can select which of the changes to bring to the local working copy of the latest
    version of the trunk version of the design. Select the changes and click Merge.

    8. Save your design. Commit all the outgoing changes, and you will have a merged
    version of the design in version control as your latest revision.'
