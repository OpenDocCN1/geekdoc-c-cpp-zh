- pgno: 295
  md: '# Chapter 11: Generating Reports and Using Search 269


    On the Maintenance tab, you can drop the reporting repository, delete designs,
    and enable and delete indexes. If you drop the repository, all the database objects
    and all the content of a repository will be deleted. When you click the Drop Repository
    button, Data Modeler says, "Are you sure want to drop the reporting repository?"
    you decide to drop it, after the deletion is done Data Modeler says, "Reporting
    repository has been dropped successfully." If you click the Delete Designs button,
    you can select which to delete from the repository. From each design you can see
    the date and time of exporting; the name, and the comments. If you want to delete
    a design, select Selected for that design and click Delete Selected. Now the repository
    is not deleted; only data of selected designs is deleted. If you enable Indexes,
    the indexes for the repository database objects will be rebuilt, and if you set
    Disable Indexes to Unusable. If the indexes are used, the reports will be generated
    later.


    On the Glossary tab, you can export a glossary to the reporting repository by
    clicking the Export button, and you can delete a glossary from the repository
    by clicking the Delete Glossary button. To export a glossary, you select Selected
    for the glossary in the repository and click Delete Selected. It might sound strange
    there might be users without access to Data Modeler, and they might be interested
    in glossaries as well. Exporting all the information to the reporting repository
    gives them the chance to see all the information related to Data Modeler designs.


    To export the design that is open, click OK, and it will be exported to the repository
    that can be found in the connection selected. Data Modeler will inform you that
    the design has been exported successfully.


    # Running Reports from the Reporting Repository


    When you have the reporting repository created and designs exported, you can run
    reports from the repository, or you can use SQL to query it. The reports will
    be saved to the directory defined as Default Reports Directory in the Preferences
    dialog. To run a report from the reporting repository, choose File | Reports.
    Running the report is the same as explained earlier in this chapter, but now you
    select Reporting Schema instead of Loaded Designs. Specifically, you select the
    repository connection wanted in the Reporting Schema section. In this section
    you can add, remove, and test a connection. Click Reload Design Models to get
    the Available Designs and Available Models populated with information from the
    reporting repository. Then you can select the available design, available model,
    and report configuration from the lists, as explained earlier. The values in the
    lists depend on the Available Report setting and the selected Reporting Schema
    setting. You can also select Clear Diagrams if you want the diagrams to be created
    again. You can edit, add, and delete report configurations by clicking Manage
    and defining them in the Standard Reports Configurations dialog, and when you
    are done with the report configuration, you click the Generate Report button.'
  merge: -1
  img_proc: true
- pgno: 296
  md: '# Using Searching


    If there are several people running repository reports constantly, the temporary
    directory on the server might get busy. You can define a different directory when
    starting the report by entering the directory in the Directory Path field in the
    Reports dialog. Remember that you must have privileges to the server to create
    directories; otherwise, it will not succeed.


    In SQL Developer there are several reports for Data Modeler''s reporting repository.
    Go to SQL Developer, run the report, get the SQL, and use that as the basis for
    your own SQL query.


    Data Modeler has search features. The improved search features were introduced
    in version 3.3. You are able to search in many ways and on many search levels.
    At the end of the search, you can produce a report from the search result. The
    Search operation will look only inside the scope selected. A global search will
    search the whole design and a model search will only search the model. You can
    find the Search operation in both the Edit (Find) and View (Model Search) menus,
    as well as in the right-click menu of a logical or relational model in the Browser
    pane. There is also a Search icon on the toolbar for the logical and relational
    models. In the View menu, you will also find Global Search, which will search
    throughout the whole design.


    You can use search for searching, but you can also use it for reporting and setting
    common properties. You can make searches in two different modes: simple or advanced
    mode.


    # Reporting with Search


    The search functionality offers fine-tuned possibilities for finding the information
    needed and for turning that into a report. You can search in a selected scope,
