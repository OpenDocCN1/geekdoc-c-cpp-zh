    code, and talk to people who know this application to be sure about the primary
    keys. When creating the primary key for the parent table you will get an error
    message if there is duplicate data in the database.


    Sometimes the date types are equal in the parent table''s primary key column and
    the child table''s foreign key candidate column but the other definitions do not
    match. For instance, in the parent table, the column must be NUMBER(16,0), and
    in the child table, it might be NUMBER. In case you might need to change the definition
    for the child tables to NUMBER(16,0). You can do that using the search functionality
    and using the setting properties operation related to that. You can read more
