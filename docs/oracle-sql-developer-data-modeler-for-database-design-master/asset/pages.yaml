    Designer 9 and newer, CA Erwin Data Modeler 4.x and 7.x, Sterling COOL: DBA v2.1,
    Sterling Bsnteam v7.2, and Cayenne Bsnteam v7.2 formats. For multidimensional
    models, there is support for Cube Views metadata and XMLA. A database that has
    no documentation can be reverse engineered into Data Modeler by importing from
    a data dictionary or a DDL file. At the moment, the supported databases are Microsoft
    SQL Server 2000, 2005, IBM DB2/LU v7 or v8, IBM DB2 for OS/390 and zOS, and ODBC/JDBC/ODBC-compliant
    data dictionaries. If the database has no foreign keys, you can use Discover Foreign
    Keys to try and get the possible foreign keys. After importing the physical and
    relational models, you can use the Engineer To Logical Model functionality to
