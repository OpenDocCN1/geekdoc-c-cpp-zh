    # Storage Templates and LOB Storages


    A storage template is a template for properties of physical_attributes_clause
    in DDLs for tables, materialized views, or clusters. The clause physical_attributes_clause
    lets you specify how Oracle Database should store a permanent object, and the
    storage parameters are not only because they affect the amount of space needed
    in the database but also because of the time it takes to access data stored in
    the database. It is good practice to define storage templates both to make physical
    designing easier and to make the database definitions more standardized. Before
    you define storage templates, you must define how you will use them.


    To create a new storage template, select Storage Templates in the Browser pane,
    right-click and choose Next. On the General tab of the properties, you can define
    the values for the parameters in the clause physical_attributes_clause: PCTFREE
    (PCT), USED (PCT Used), INTRANS (initrans), INITIAL (SC Initial Ext), NEXT (SC
    Next Ext), MINEXTENTS (SC Min Ext.), MAXEXTENTS (SC Max Ext.), maxsize_clause,
    INCREASE (SC PCT Increase), FREELIST (SC Free List), FREELIST GROUPS (SC Free
    Groups), and BUFFER_POOL (SC Buffer Pool). The physical_attributes_clause parameters
    OPTIMAL, FLASH_CACHE and ENCRYPT cannot be specified for the storage template.
    In the storage template General tab, the Currently property is automatically selected
    when this storage template is used.


    On the Clusters, Tables, Indexes, and Materialized Views tab, you can set objects
    to be using the specified storage template. Click the green plus, select from
    the list the objects that you want to use the storage template, and click OK.
    You can also specify in, for instance, table properties that a table will be using
    this storage template.


    You can also specify LOB storage for columns in a table or a materialized view.
    Go to the Browser pane and select LOB Storages under the table or materialized'
