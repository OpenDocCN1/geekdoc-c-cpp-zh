  md: '# Warning


    In Chapter 5, "Adding Variables to Your Programs," you learned how to define variables
    by specifying their initial types and giving them a name and an initial value.
    Constants that you define with #define are not variables, even though they sometimes
    look like variables when they are used.


    Here is the format of the #define directive:


    Click here to view code image


    ```

    #define CONSTDefinition

    ```


    As with most things in C, using defined constants is easier than the format you
    like to believe. Here are some sample #define directives:


    ```

    #define AGELIMIT 21

    #define MYNAME "Paula Holt"

    #define PI 3.14159

    ```


    In a nutshell, here''s what #define tells C: Every place in the program that the
    CONSTANT appears, replace it with the constantDefinition. The first #define just
    instructs C to find every occurrence of the word AGELIMIT and replace it with
    a 21. Therefore, if this statement appeared somewhere in the program after the
    #define:


    ```

    if (employeeAge < AGELIMIT)

    ```


    the compiler acts as if you typed this:


    ```

    if (employeeAge < 21)

    ```


    even though you didn''t.'
