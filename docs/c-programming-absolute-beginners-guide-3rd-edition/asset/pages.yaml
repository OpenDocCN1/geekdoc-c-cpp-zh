  md: '# 4. Your World Premiere—Putting Your Program’s Results Up on the Screen


    +   In This Chapter

    * Using printf()

    * Printing strings

    * Coding escape sequences

    * Using conversion characters

    * Putting it all together with a code example


    If you nor anybody else could see your program''s output, there would be little
    use for your program. Ultimately, you have to be able to view the results of a
    program. C''s primary means of output is the printf() function. No actual command
    performs output, but the printf() function is a part of every C compiler and one
    of the most used features of the language.


    # How to Use printf()


    In a nutshell, printf() produces output on your screen. As the sample code listings
    in Chapters 2, "Writing Your First C Program," and 3, "What Does This Do? Clarifying
    Your Code with Comments," demonstrated, printf() sends characters, numbers, and
    words to the screen. There is a lot to printf(), but you don''t have to be an
    expert in all the printf() options (very few C programmers are) to use it for
    all your programs'' screen output.


    # The Format of printf()


    The printf() function takes many forms, but when you get used to its format, printf()
    is easy to use. Here is the general format of printf():


    Click here to view code image'
  merge: -1
