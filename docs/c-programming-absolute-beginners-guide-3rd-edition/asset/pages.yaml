    data-entry ability.


    Exception to the ampersand rule does exist. If you''re getting input into an array
    using %s, as happens when you ask users for a name to be stored in a character
    array, do not use the ampersand. The bottom-line rule is this: if you''re asking
    the user to type integers, floating points, characters, doubles, or any of the
    other single-variable combinations (long integers and so on), put an ampersand
    before the variable names in the scanf(). If you are asking the user for a string
    to input into a character array, don''t put the ampersand before the array name.'
