    # Case-Changing Functions


    C has two important character-changing functions (also called character-mapping
    functions) that return their arguments changed a bit. Unlike isupper() and islower(),
    which only test character values and return a true or false result of the test,
    toupper() and tolower() return their arguments converted to a different case.
    toupper() returns its parentheses as uppercase. tolower() returns their parentheses
    as lowercase.'
