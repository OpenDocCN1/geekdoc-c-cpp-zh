  md: '# Warning


    Most C programmers define their file pointers before main(). This makes the file
    pointer global, which is a fancy term meaning the entire program can use the file.
    (Most other kinds of variables are local, not global). Because part of the file
    pointer statement is in upper case, FILE is defined someplace with #define. FILE
    is defined in stdio.h, which is the primary reason you should include the stdio.h
    header file when your program uses the disk for.


    After you define a file pointer, you can connect pointer to a file with fopen().
    After you specify fopen(), you can use the file throughout the rest of the program.
    Here is the way to open a file named C:\cprograms\cdata.txt.


    # Tip


    If you don''t have a C: drive, change the C: in these examples to a different
    drive letter. In fact, if you want to put your files in a specific folder but
    are not sure of the path, right-click a file in that folder and select Properties
    from the menu. You should see the directory path of the folder, which you can
    then use in your fopen ()


    Click here to view code <stdio.h>


    ```

    #include <stdio.h

    FILE *fptr; // Defines a file pointer

    main()

    {\    fptr = fopen("c:\cprograms\cdata.txt", "w");

    ```'
