  md: '# 24. Solving the Mystery of Pointers


    +   In This Chapter

    * Working with memory addresses

    * Defining pointer variables

    * Using the dereferencing *


    Pointer variables, often called pointers, let you do much more with C than you
    can with programming languages that don''t support pointers. When you first learn
    about pointers, you''ll probably ask “What’s the point?” (Even after you master
    them, you might ask the same thing!) Pointers provide the means for the true power
    of C programming. This book exposes the tip of the pointer iceberg. The concepts
    you learn here will form the foundation of your C future.


    # Memory Addresses


    Inside your computer is a bunch of memory. The memory holds your program as it
    executes, and it also holds your program’s variables. Just as every house has
    a different address, every memory location has a different address. Not coincidentally,
    the memory locations have their own addresses as well. With house addresses, the
    memory addresses are all unique; no two are the same. Your memory acts a little
    like big hardware array, with each address being a different subscript and each
    memory location being a different element.


    When you define variables, C finds an unused place in memory and attaches to that
    memory location. That’s a good thing. Instead of having to remember that an order
    number is stored at memory address 34532, you only have to remember the name orderNum
    (assuming that you named the variable orderNum when you defined the variable).
    The name orderNum is much easier to remember than a number.'
  merge: -1
  pgno: 283
- img_proc: true
  md: '# Defining Pointer Variables


    As with any other type of variable, you must define a pointer variable before
    you can use it. Before going further, you need to learn two new operators. Table
    24.1 shows them, along with their descriptions.


    | Operator | Description |

    |---|---|

    | & | Address of operator |

    | * | Dereferencing operator |


    # TABLE 24.1 The Pointer Operators


    You''ve seen the * before. How does C know the difference between multiplication
    and dereferencing? The context of how you use them determines how C interprets
    them. You''ve also seen the & before scanf() variables. The & in scanf() is the
    address of operator. scanf() requires that you send it the address of non-array
    variables.


    The following shows how you would define an integer and a floating-point variable:


    ```

    int num;

    float value;

    ```


    To define an integer pointer variable and a floating-point pointer variable, you
    simply insert an *:


    Click here to view code image


    ```

    int * pNum; /* Defines two pointer variables */

    float * pValue;

    ```


    ![](img/a7086d2ec25d9e20dd06cdcc839fe8b9_284_0.png)


    > Note

    There''s nothing special about the names of pointer variables. Many C programmers
    like to prefix pointer variable names with a p, as done here, but you can name
    them anything you like. The p simply reminds you they are pointer variables, not
    regular variables.'
  merge: -1
  pgno: 284
- img_proc: true
  md: 'All data types have corresponding pointer data types—there are character pointers,
    long integer pointers, and so on.


    Pointer variables hold addresses of other variables. That''s their primary purpose.
    Use the address-of operator, &, to assign the address of one variable to a pointer.
    Until you assign an address of a variable to a pointer, the pointer is uninitialized
    and you can''t use it for anything.


    The following code defines an integer variable named age and stores 19 in age.
    Then a pointer named pAge is defined and initialized to point. The address-of
    operator reads just like it sounds. The second line that tells C to put the address
    of age into pAge.


    [Click here to view code image]


    ```

    int age = 19; /* Stores a 19 in age */

    int * pAge = &age; /* Links up the pointer */

    ```


    You have no idea exactly what C will store age at. However, whatever address C
