  md: '# Using the Dereferencing *


    As soon as you link up a pointer to another variable, you can work with the other
    value by dereferencing the pointer. Programmers never use an easy word when a
    hard one will do just as well (and confuse more people). Dereferencing just means
    that you use the pointer to get to the other variable. When you dereference, use
    the * dereferencing operator.


    In a nutshell, here are two ways to change the value of age (assuming the variables
    are defined as described earlier):


    +   * age = 25;


    and


    Click here to view code image


    ```

    *pAge = 25; /* Stores the value 25 where pAge points */

    ```


    This assignment tells C to store the value 25 at the address pointed to by pAge.
    Because pAge points to the memory location holding the variable age, 25 is stored
    in age.


    Notice that you can use a variable name to store a value or dereference a pointer
    that points to the variable. You can also use a variable''s value in the same
    way. Here are two ways to print the contents of age:


    Click here to view code image


    ```

    printf("The age is %d.\n", age);

    ```


    and


    Click here to view code image


    ```

    printf("The age is %d.\n", pAge);

    ```


    The dereferencing operator is used when a function works with a pointer variable
    that it sent. In Chapter 32, "Returning Data from Your Functions," you''ll learn
    how to pass pointers to functions. When a function uses a pointer variable that
    is sent from another function,'
