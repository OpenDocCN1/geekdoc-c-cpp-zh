  md: "# The Small-Change Operators: ++ and --\n\nAlthough the conditional operator\
    \ works on three arguments, the increment and decrement operator work on only\
    \ one. The increment operator adds 1 to a variable, and the decrement operator\
    \ subtracts 1 from a variable. That's 'Nuff said. Almost....\n\nIncrementing and\
    \ decrementing variables are things you would need to do if you were counting\
    \ items (such as the number of customers who shopped in your store yesterday)\
    \ or counting down (such as removing items from an inventory as people buy). In\
    \ [Chapter 10, \"Powering Up Your Variables with Assignments and Expressions.\"\
    ]() you read how to increment and decrement variables using compound operators.\
    \ Here, you learn two operators that can more easily do the same. The decrement\
    \ operator is --. If you want to add 1 to the variable count, here's how you do\
    \ it:\n\n```\ncount++;\n```\n\nYou also can do this:\n\n```\n++count;\n```\n\n\
    The decrement operator does the same thing, except that the 1 is subtracted from\
    \ the variable. You can do this: \n\n```\ncount--;\n```\n\nYou also can do this:\n\
    \n```\n--count;\n```\n\nAs you can see, the operators can go on either side of\
    \ the variable. If the operator is on the left, it's called a prefix increment\
    \ or prefix decrement operator. If the operator is on the right, it's known as\
    \ a postfix increment or postfix decrement operator."
