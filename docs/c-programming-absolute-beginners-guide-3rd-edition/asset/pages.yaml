    Within each case section of code, if and else statements test the user''s entry
    to present the information they want to see.


    You might be thinking, "Hey, the switch statement was a great idea for the top
    menu—why not use it for the next level of menu choices as well? Well, although
    you nest if statements in other if statements and nest for statements within other
    for statements, nesting switch statements are not a good idea, particularly when
    the default choices start overlapping. It confuses your compiler, and the program
    will not run.


    Another note is that, in the first program, you did not enter open and closing
    braces for the statements after each case (expression): statement, but here you
    did. The braces are not needed, but with more complex blocks of code, the braces
    can help keep things clear.


