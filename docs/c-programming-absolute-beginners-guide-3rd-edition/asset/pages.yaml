  md: '# Practicing Your Math


    All functions this chapter describes require the use of the math.h header file.
    Be sure to include math.h along with stdio.h if you use a math function. The first
    few math functions are not so much math functions as are numeric functions. These
    functions convert numbers to and from other numbers.


    The floor() and ceil() functions are called the floor and ceiling functions, respectively.
    They "push down" and "push up" nonintegers to their next-lower or next-higher
    integer values. For example, if you wanted to compute how many dollar bills were
    in a certain amount of change (that includes dollars and cents), you could use
    floor() on the amount. The following code does just that:


    [Click here to view code image]


    ```

    change = amtPaid - cost; //These are all floating-point values

    dollars = floor(change);

    printf("The change includes %f dollar bills.\n", dollars);

    ```


    ![](img/a7086d2ec25d9e20dd06cdcc839fe8b9_236_0.png)


    # Warning


    > Although ceil() and floor() convert their arguments to integers, each function
    returns a float value. That''s why the dollars variable was printed using the
    %f conversion code.


    The ceil() function (which is the opposite of floor()) finds the next-highest
    integer. Both ceil() and floor() work with negative values, too, as the following
    lines show:


    [Click here to view code image]


    ```

    lowVal = floor(18.5); // Stores 18.0

    low2 = floor(-18.5); // Stores -19.0

    hiVal = ceil(18.5); // Stores 19.0

    hi2 = ceil(-18.5); // Stores -18.0

    ```'
  merge: -1
  pgno: 236
- img_proc: true
  md: '> Note The negative values make sense when you think about the direction of
    negative numbers. The next integer down from -18.5 is -19. The next integer up
    from -18.5 is -18.


    See, these functions aren''t so bad, and they come in handy when you need them.


    # Doing More Conversions


    Two other numeric functions convert numbers to other values. The fabs() function
    returns the floating-point absolute value. When you first hear about absolute
    value, it sounds like something you''ll never need. The absolute value of a number,
    whether it is negative or positive, is the positive version of the number. Both
    of these print() functions print 25:


    Click here to view code image


    ```

    printf("Absolute value of 25.0 is %0f.\n", fabs(25.0));

    printf("Absolute value of -25.0 is %0f.\n", fabs(-25.0));

    ```


    > Note The floating-point answers print without decimal places because of the
    .0 inside the %f conversion codes.


    Absolute values are useful for computing differences in ages, weights, and distances.
    For example, the difference between people''s ages is always a positive number,
    no matter how you subtract one from the other.'
