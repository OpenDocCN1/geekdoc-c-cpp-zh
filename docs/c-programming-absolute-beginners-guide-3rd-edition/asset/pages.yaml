    The variables firstInitial, lastInitial, and age hold whatever the user types
    before pressing Enter. If the user types more than a single character in the first
    two examples, it can confuse the program and create problems for the later values.


    Another point to notice about the scanf() statements is the spaces right before
    each %c or %d. The space isn''t required here, but it never hurts, and sometimes
    helps the input work better when you get numbers and characters in succession.
    Adding the extra space is a good habit to get into now while learning scanf().


    Enough about all that. Let''s get to the most obvious scanf() problem: the ampersand
    (&) before the three variables. Guess what? scanf() requires that you put the
    ampersand before all variables, even though the ampersand is not part of the variable
    name? Do it, and scanf() works; leave off the ampersand, and scanf() won''t accept
    the user''s values into the variables.'
