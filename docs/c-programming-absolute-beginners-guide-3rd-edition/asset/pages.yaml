    files later; for now, understand that a header file does two things. The built-in
    header files help C properly execute built-in functions. The header files you
    write often contain code that you want to place in more one file.


    > > Tip

    > It''s best to put your #include directives before main().


    > > Note

    > The Draw Poker program in Appendix B, "The Draw Poker Program," includes several
    header files because it uses lots of built-in functions. Notice the placement
    of the #include statements; they come before main().


    # ## Defining Constants


    The #define preprocessor directive defines constants. A constant is really the
    same as a literal. You learned in Chapter 2, Writing Your First C Program, that
    a literal is a data value that doesn''t change, like the number 4 or the string
    "C programming". The #define preprocessor directive lets you give names to literals.
    When you give a name to a literal, the named literal is known in C terminology
    as a named constant or a defined constant.'
