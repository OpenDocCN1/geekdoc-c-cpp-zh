    # Tip


    Don''t do too much at one time when evaluating such expressions for practice.
    As the figure shows, you should compute one operator at a time and then bring
    the rest of the expression down for the next round.


    An expression such as the one in Figure 9.1 contains more than one operator that
    sits on the same level in the order of operators table, you must use the third
    column, labeled Associativity, to determine how the operators are evaluated. In
    other words, because *, /, and % all reside on the same level, they were evaluated
    from left to right, as dictated by the order of operators table''s Associativity
    column.


    You might wonder why you have to learn this stuff. After all, doesn''t C do math
    for you? The answer is "Yes, but..." C does math, but you need to know how to
    set up your expressions properly. The classic reason is as follows: Suppose you
