- img_proc: true
  md: 'name, balance, address, city, state, and zip code, like the customer structure
    just described. Later in this chapter, you''ll see how C structures are stored
    in memory, and you''ll see even more similarities to the cardfile cards.


    # Defining a Structure


    The first thing you must do is tell C exactly what your structure will look like.
    When you define variables of built-in data types such as `int`, you don''t have
    to tell C what an `int` is—C already knows. When you want to define a structure,
    however, you must first tell C exactly what your structure looks like. Only then
    can you define variables for that structure.


    Try to view a structure as a group of individual data types. The entire structure
    has a name and can be considered a single value (such as a customer) taken as
    a whole. The individual members of the structure are built-in data types, such
    as `int` and `char` arrays, that could represent an age and a name. You can access
    the individual members if you want to.


    Not only is a structure like a cardfile, but you also can see that a structure
    is lot like a paper form with blanks to fill in. A blank form, such as one you
    might fill out when applying for a credit card, is useless by itself. If the credit
    card company prints 10,000 forms, that doesn''t mean it has 10,000 customers.
    And only when you define a variable for the structure you describe C give memory
    space to a structure variable.


    To define an `int` variable, you only have to do this:


    ```

    int i;

    ```


    You don''t first have to tell C what an `int` is. To define a structure variable,
    you must first define what the structure looks like and assign a data type name,
    such as `customer`, to C. After defining the structure''s format, you can define
    a variable.'
