    # Getting Random


    For games and simulation programs, you often need to generate random values. C''s
    built-in rand() function just does that. It returns a random number from 0 to
    32767. The rand() function requires the stdlib.h (standard library) header file.
    If you want to narrow the random numbers, you can use % (the modulus operator)
    to do so. The following expression puts a random number from 1 to 6 in the variable
    dice:


    Click here to view code image


    ```

    dice = (rand() % 5) + 1;   /* From 1 to 6 */

    ```


    ![](img/a7086d2ec25d9e20dd06cdcc839fe8b9_242_0.png)


    > Note

    Because a die can have a value from 1 to 6, the modulus operator returns the integer
    division remainder (0 through 5), and then a 1 is added to produce a die value.


    You must do one crazy thing if you want a truly random value.

    To seed the random number generator means to give it an initial base value from
    which the rand() function can offset with a random'
