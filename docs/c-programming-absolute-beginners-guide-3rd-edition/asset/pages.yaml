    your programs by explaining what they do.


    # Commenting on Your Code


    Throughout a C program, you should add comments. Comments are messages scattered
    throughout your programs that explain what''s going on. If you write a program
    to calculate payroll, the program’s comments explain the gross pay calculations,
    state tax calculations, federal tax calculations, social security calculations,
    deductions, and all the other calculations that are going on.'
