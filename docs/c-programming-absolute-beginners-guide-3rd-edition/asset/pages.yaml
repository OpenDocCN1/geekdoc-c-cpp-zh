  md: '# B. The Draw Poker Program


    Programming is not all work and play, and the following Draw Poker game proves
    it! The game program provides a long example that you can study you master C.
    Although the game is simple and straightforward, a lot happens in this program.


    As with all well-written programs, this one is commented thoroughly. In fact,
    if you read each chapter of this book, you will understand the programming of
    Draw Poker. One of the reasons the program is kept simple is to keep it compiler-independent.
    For your program, you might want to find out how your C compiler produces colors
    onscreen so that you can add pizazz to the game''s display. Also, when you master
    enough of C to understand the program''s inner workings, you''ll want to explore
    graphics capabilities and actually draw the cards.


    ![](img/a7086d2ec25d9e20dd06cdcc839fe8b9_397_0.png)


