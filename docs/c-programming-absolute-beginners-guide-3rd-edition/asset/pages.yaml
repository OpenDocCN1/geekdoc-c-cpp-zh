  md: '# About the Authors


    **Greg Perry** is a speaker and writer in both the programming and applications
    sides of computing. He is known for bringing programming topics down to the beginner’s
    level. Perry has been a programmer and trainer for two decades. He received his
    first degree in computer science and then earned a Master’s degree in corporate
    finance. Besides writing, he consults and lectures across the country, including
    at the acclaimed Software Development programming conferences. Perry is the author
    of more than 75 other computer books. In his spare time, he gives lectures on
    traveling in Italy, his second favorite place to be.


    **Dean Miller** is a writer and editor with more than 20 years of experience in
    both the publishing and licensed consumer product businesses. Over the years,
    he has created or helped shape a number of bestselling books and series, including
    *Teach Yourself in 21 Days*, *Teach Yourself in 24 Hours*, and the *Unleashed*
    series, all from Sams Publishing. He has written books on C programming and professional
    wrestling, and is still looking for a way to combine the two into one strange
    amalgam.'
