    # Note


    A relational operator simply tests how two values relate (how they compare to
    each other). The logical operators combine relational operators.


    # Note


    # Getting Logical


    Three logical operators exist (see Table 12.1). Sometimes logical operators are
    known as compound relational operators because you combine more than one relational
    operator. (See the previous Note.)


    | Logical Operator | Meaning |

    | && | And |

    | || | Or |

    | ! | Not |


