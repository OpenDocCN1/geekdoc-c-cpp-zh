    \ Here's how this for statement works: When the for begins, the startExpression,\
    \ which is ctr = 1;, executes. The startExpression is executed only once in any\
    \ loop. The testExpression is then tested. In this example, the testExpression\
    \ is ctr<= 5;. If it is true—and it will be true the first time in this code—the\
    \ body of the for loop executes. When the body of the loop finishes, the countExpression\
    \ is executed (ctr is incremented).\n\n> Tip\n you can see, indenting the body\
    \ of a for loop helps separate the body of the loop from the rest of the program,\
