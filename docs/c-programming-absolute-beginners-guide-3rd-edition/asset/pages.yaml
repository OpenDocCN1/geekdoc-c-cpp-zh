    > > Close your filing cabinet drawers when you''re done with your files, or you''ll
    hit your head! Close all open files when you''re finished with them, or you could
    lose some data. fclose() is the opposite of fopen(). In its parentheses, fclose()
    requires a file pointer of the file you want to close.


    If the file pointer equals 0, you know that an error happened. C returns a 0 from
    fopen() if an error occurs when you open a file. For example, if you attempt to
    open a file on a disk drive that doesn''t exist, fopen() returns an error.


    The "w" (the second argument in the previous code''s fopen()) means write. The
    second argument of fopen() must be one of the string mode values in Table 28.1.


    | Mode | Description |

    | *w* | Write mode that creates a new file whether it exists or not. |

    | *r* | Read mode that lets you read an existing file. If the file doesn''t exist,
    you get an error. |

    | *a* | Append mode that lets you add to the end of a file or create the file
    if it doesn''t already exist. |


