  md: '# The Absolute Minimum


    This chapter''s goal was to teach you about structures. A structure is an aggregate
    variable data type. Whereas an array must hold values that are all the same data
    type, a structure can hold several values of different data types.


    Before using a structure variable, you must tell C exactly what the structure
    looks like with a struct statement. The struct statement lets C know how many
    members are in the structure and the data types of each member. A structure variable
    is like a group of more than one variable of different data types. Key concepts
    in this chapter include:


    +   - Define structures when you want to group items of different data types.

    - Declare a structure before defining a structure variable.

    - Use the dot operator to access individual data members within a structure variable.

    - Use the -> (the structure pointer operator) to access individual data members
    within a structure pointed to by a pointer variable.

    - Don''t use member names as variables. Member names exist only so you can work
    with an individual part of a structure.

    - Don''t forget to add a semicolon to the end of all structure definitions.

    - Don''t intermix the dot operator and the structure pointer operator. Remember
    that a structure variable must appear before the dot operator, and a structure
    pointer variable must appear before the -> operator.'
