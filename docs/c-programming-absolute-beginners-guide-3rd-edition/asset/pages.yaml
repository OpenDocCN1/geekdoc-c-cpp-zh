    it also results in a completed value of 9, which is available to store somewhere
    else, if needed. The fact that every assignment results in an expression lets
    you do things like this that you can''t always do in other programming languages:


    Click here to view code image


    ```

    a = 5 * (b = 2); /* Puts a 2 in b and a 10 in a * /

    ```'
