    file data. Often you will want to change a person''s address, change an inventory
    item''s quantity, and so on without rewriting the entire file as you would have
    to if you used sequential file processing. Key concepts from this chapter include:


    +   - Use a plus sign in the `fopen()` mode string if you need to change data
    in a file.


    +   - Remember that `fseek()` moves a file pointer around a random file so that
    you can read or write from the beginning, middle, or end.


