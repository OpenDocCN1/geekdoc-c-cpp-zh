  md: '# The Absolute Minimum


    The goal of this chapter was to teach you the building-block approach to writing
    C programs. Long programs can become unruly unless you break them into several
    separate functions. One long main() function is analogous to a long book without
    chapter divisions. Break your long programs into separate functions, and each
    have function perform a single, separate task in the program.


    When you divide your programs into several functions, you have to consider how
    variables are used throughout the code. Local variables are defined inside a function
    and are usable only in that function. The opposite of a local variable is a global
    variable, whose value is usable in all functions after its definition. Global
    variables are frowned upon. Local variables are safer because you can limit their
    access to only functions that need to use them. In the next chapter, you learn
    how to share local variables between functions. Key concepts from this chapter
    include:


    +   - Define local variables after a block''s opening brace.

    - Define global variables before a function begins.

    - Local variables are safer than global variables, so use local variables as much
    as possible.

    - Break your programs into lots of functions to ease maintenance and speed development
    time.

    - Don''t define global variables in the middle of a program. They''re too hard
    to locate if you do.

    - Don''t start out using global variables. As your program grows, you might occasionally
    see the need for a global variable—add one then. (The next chapter talks more
    about using local variables in place of globals.)'
