    At first glance, the scan() function might seem confusing, but it is so important
    to learn, to increase the power of your programs through user interactivity. For
    a beginner, scan() makes little sense, despite its strange format, it is the easiest
    function to use for input at this point in the book because of its ties to the
    printf() function. Practice with scan() will make your programs perfect!


    # Looking at scan()


    scan() is a built-in C function that comes with all C compilers. Its header file
    is the same as printf() (stdio.h), so you don''t have to worry about including
    an additional header file for scan(). scan() fills variables with values typed
    by the user.


