  md: '# Tip


    Think of the f at the beginning of fputs() and gets() as standing for file. puts()
    and gets() go to the screen and keyboard, respectively; fputs() and gets() write
    and read their data from files.


    Unlike gets(), gets() requires you to specify a maximum length for the array you''re
    reading into. You might read past the end of the file (producing an error) if
    you''re not careful, be sure to check for the location of the end of the file.


    fgets() reads one line at a time. If you specify more characters to read in the
    fgets() than actually read on the file''s line you''re reading, fgets() stops
    reading the line of data as long as the file''s ends with a newline character.
