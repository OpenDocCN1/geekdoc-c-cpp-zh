    FIGURE 31.1 Getting the terms correct.


    # Methods of Passing Arguments


    You pass arguments from a function to another function in two ways by value and
    by address. Both of these methods pass arguments to a receiving function from
    a calling function. There is also a way to return a value from a function back
    to the calling function (see the next chapter).


    All this talk of passing values focuses on the parentheses that follow function
    names. That''s right, those empty parentheses have a use after all! The variables
    you want to pass go inside the parentheses of the function call and also in the
    receiving function, as you''ll see in the next section.'
