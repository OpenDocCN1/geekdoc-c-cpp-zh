  md: '# # A Little Faster: get()


    A character input function named get() helps eliminate the leftover keypress that
    getchar() leaves. get() is unbuffered—that is, get() gets whatever the user types
    immediately and doesn''t wait for an Enter keypress. The drawback to get() is
    that the user can''t press the Backspace key to correct bad input. For example,
    with getchar(), a user could press Backspace if she typed a B instead of a D.
    The B would be taken off the buffer by the Backspace, and the D would be left
    for getchar() to get after the user pressed Enter. Because get() does not buffer
    input, there is no chance of the user pressing Backspace. The following code gets
    two characters without an Enter keypress following each one:


    Click here to view code image


    ```

    printf("What are your two initials?\n");

    firstInit = get();

    lastInit = get();

    ```


    get() is a little faster than getchar() because it doesn''t wait for an Enter
    keypress before grabbing the user''s keystrokes and continuing. Therefore, you
    don''t need a standalone get() to get rid of the \n as you do with getchar().'
