  md: 'number. Use srand() to seed the random number generator. The number inside
    the srand() parentheses must be different every time you run the program, unless
    you want to produce the same set of random values.


    The trick to giving rand() a different number each run is to put the exact time
    of day inside the srand() parentheses. Your computer keeps track of the time of
    day, down to hundredths of a second. So first declare a time variable, using the
    time_t declaration, and then send its address (using the & character at the front
    of the variable name) to the srand() function.


