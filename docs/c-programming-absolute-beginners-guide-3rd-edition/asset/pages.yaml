  md: '# Assignments Everywhere


    As you can see from the order of operators table, the assignment operator has
    precedence and associativity, as do the rest of the operators. Assignment has
    very low priority in the table, and it associates from right to left.


    The right-to-left associativity lets you perform an interesting operation: You
    can assign a value to more than one variable in the same expression. To assign
    the value of 9 to 10 different variables, you could do this:


    Click here to view code image


    ```

    a = 9; b = 9; c = 9; d = 9; e = 9; f = 9; g = 9; h = 9; i = =

    9; j = 9;

    ```


    but this is easier:


    Click here to view code image


    ```

    a = b = c = d = e = f = g = i = j = 9;

    ```


    Because of the right-to-left associativity, C first assigns the 9 to j, then puts
    the 9 in i, and so on.


    ![](img/a7086d2ec25d9e20dd06cdcc839fe8b9_122_0.png)


