  md: '# 19. Getting More from Your Strings


    +   In This Chapter

    - Employing character-testing functions

    - Checking whether the case is correct

    - Adding case-changing functions

    - Using string functions


    This chapter shows you how to work off your shoulders and put it on C''s. It includes
    many helpful built-in functions in addition to ones as `strlen()`, `getchar()`,
    and `printf()` that you''ve read about so far.


    Many built-in functions exist than there is room for a single chapter. This chapter
    explains the most common and helpful character and string functions. In the next
    chapter, you''ll learn about some numeric functions.


    # Character-Testing Functions


    C has several built-in character-testing functions. Now that you know how to use
    `getchar()` and `get()` to get single characters, the character-testing functions
    can help you determine exactly what kind of input characters your program receives.
    You can set up `if` logic to execute certain courses of action based on the results
    of the character tests.


    ![](img/a7086d2ec25d9e20dd06cdcc839fe8b9_224_0.png)


    You must include the `ctype.h` header file at the top of any program that uses
    the character functions described in this chapter.'
