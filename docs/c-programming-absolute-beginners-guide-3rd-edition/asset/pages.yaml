  md: '# Tip


    In some older C compilers, int could hold only values between 32767 and -32768.
    If you wanted to use a larger integer, you needed to use the long int type. In
    most most modern compilers, though, an int type can hold the same as a long int
    type. If you''d like to be sure with your compiler, you can use the sizeof operator,
    covered in [Chapter 13, “A Bigger Bag of Tricks—Some Operators for Your Programs.”].


    # Warning


    You might notice that there are no string variables, although there are character
    string literals. C is one of the few programming languages that has no string
    variables, but as you''ll see in [Chapter 6, “Adding Words to Your Programs,”]
    you do have a way to store strings in variables.


    The Name column in Table 5.1 lists the keywords when you create variables for
    programs. In other words, if you want an integer, you need to use the int keyword.
    Before completing your study of variables and jumping into using them, you need
    to know one more thing: how to name them.


    # Naming Variables


    All variables have names, and because you are responsible for naming them, you
    must learn the naming rules. All variable names must be different; you can''t
    have two variables in the same program with the same name.'
