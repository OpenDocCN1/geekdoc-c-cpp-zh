  md: '# Getting into Trig and Other Really Hard Stuff


    Only a handful of readers will need the trigonometric and logarithmic functions.
    If you know you won''t, or if you hope you won''t, go ahead and skip to the next
    section. Those of you who need them now won''t require much explanation, so not
    much is given.


    Table 20.1 explains the primary trigonometric functions. They require an argument
    expressed in radians.


    | Function | Description |

    | --- | --- |

    | cos(x) | Returns the cosine of the angle x |

    | sin(x) | Returns the sine of the angle x |

    | tan(x) | Returns the tangent of the angle x |

    | acos(x) | Returns the arc cosine of the angle x |

    | asin(x) | Returns the arc sine of the angle x |

    | atan(x) | Returns the arc tangent of the angle x |


    # TABLE 20.1 C Trigonometric Functions


    Again, it''s unlikely you will need these functions, unless you want to relearn
    trigonometry (or have a child or relative taking the class and want to check their
    homework), but it''s good to know the capabilities of your programming language.


    ![](img/a7086d2ec25d9e20dd06cdcc839fe8b9_239_0.png)


    > If you want to supply an argument in degrees instead of radians, you can convert
    from degrees to radians with this formula:


    Click here to view image


    ```

    radians = degrees * (3.14159 / 180.0);

    ```


    Table 20.2 shows the primary log functions.'
