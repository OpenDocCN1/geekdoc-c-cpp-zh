  md: 'read and change it randomly. To C, a file is just a stream of bytes, and the
    way you access it isn''t linked to any format of the file.


    # Opening Random Files


    To read or write a file randomly, you must open the file randomly. Table 29.1
    lists the modes that access random files. As you can see, the cornerstone of random-access
    files is the use of the plus sign with the access modes you learned about in the
    previous chapter.


    | Mode | Description |

    | --- | --- |

    | r+* | Opens an existing file for both reading and writing |

    | w+ | Opens a new file for writing and reading |

    | a+ | Opens a file in append mode (the file pointer points to the end of the
    file), but lets you move back through the file, reading and writing as you |


    # TABLE 29.1 The Random-Access fopen() Modes


    ![](img/a7086d2ec25d9e20dd06cdcc839fe8b9_348_0.png)


    > Note

    As with sequential files, the access mode is a string that appears as the last
    argument of fopen(). You close open random files with fclose(), just as you do
    with sequential files.


    All three modes let you read and write to the file. The access mode you choose
    depends on what you want to do first to the file. If the file exists and you want
    to access the file randomly, the r+ mode. If you want to create the file, use
    w+. (If the file already exists, C overwrites the existing version.) If you want
    to add to the end of a file but optionally “back up” and read existing data, use
    a+.


    Here is a sample fopen() statement that opens a new file for writing and reading:


