    # Problems with scanf()


    As mentioned earlier in this chapter, scanf() is not the easiest function to use.
    One of the first problems with scanf() is that although the user must type exactly
    what scanf() expects, the user rarely does this. If the scanf() needs a floating-point
    value, but the user types a character, there is little you can do. The floating-point
    variable you supply will have bad data because a character is not a floating-point
