  md: '```

    printf(controlString [, data] );

    ```


    Throughout this book, when you are introduced to a new command or function, you
    will see its basic format. The format is the general look of the statement. If
    something in a format appears in brackets, as data in the printf function just
    shown, that part of the statement is optional. You almost never type the brackets
    themselves. If brackets are required in the command, that is made clear in the
    text following the format printf() requires a controlString, but the data following
    the controlString is optional.


    # Warning


    printf() doesn''t actually send output to your screen, but it sends it to your
    computer''s standard output device. Most operating systems, including Windows,
    route the standard output to your screen unless you know enough to route the output
    elsewhere. Most of the time, you can ignore this standard output device stuff
    because you''ll almost always want output to go to the screen. Other C functions
    you will learn about later route to your printer and disk drives.


    # Note


    You might be wondering why some of the words in the format appear in italics.
    It''s because they''re placeholders. A placeholder is a name, symbol, or formula
    that you supply. Placeholders are italicized in the format of functions and commands
    to let you know that you should substitute something at that place in the command.'
