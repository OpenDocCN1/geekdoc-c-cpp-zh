  md: '# TABLE 29.2 origin Values That Can Appear in fseek()


    The origin value tells C the position from where you want to access the random
    file next. After you position the file pointer with fseek(), you can use file
    input and output functions to write and read to and from the file. If you position
    the file pointer at the end of the file (using SEEK_END) and then write data,
    new data goes to the end of the file. If you position the file pointer over existing
    data (using SEEK_SET and SEEK_CUR) and then write data, the new data replaces
    the existing data.


    ![](img/a7086d2ec25d9e20dd06cdcc839fe8b9_350_0.png)


    > Use fseek() for random-access files only. Sequential files can be accessed only
    in the order of the data.


    Table 29.2''s values are in uppercase, which implies that they''re defined somewhere.
    They''re defined in stdio.h using #define directives.


