- img_proc: true
  md: '| Relational Operator | Description |

    | --- | --- |

    | == | Equal to |

    | > | Greater than |

    | < | Less than |

    | >= | Greater than or equal to |

    | <= | Less than or equal to |

    | != | Not equal to |


    # ### TABLE 11.1 C Relational Operators


    ![](img/a7086d2ec25d9e20dd06cdcc839fe8b9_135_0.png)


    # Note


    Relational operators compare two values. You always put a variable, literal, or
    expression—or a combination of any two of them—on either side of a relational
    operator.


    Before delving into `if`, let''s look at a few relational operators and see what
    they really mean. A regular operator produces a mathematical result. A relational
    operator produces a `true` or `false` result. When we compare two data values,
    the data values either produce a true comparison or they don''t. For example,
    given the following values:


    ```

    int i = 5;

    int j = 10;

    int k = 15;

    int l = 5;

    ```


    the following statements are `true`:


    ```

    i == 1;

    j < k;

    k > i;

