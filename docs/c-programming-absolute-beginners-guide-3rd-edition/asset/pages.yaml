    written, you can scan through your comments, finding sections of code that you
    need faster. If you didn''t comment, you would have to decipher your C code every
    time you looked through a piece of it.


    Program maintenance is the process of changing a program over time to fix hidden
    bugs and adapt the program to a changing environment. If you write a payroll program
    for a company, that company could eventually change the way it does payroll (to
    go from biweekly to weekly, as an example), and you (or another'
