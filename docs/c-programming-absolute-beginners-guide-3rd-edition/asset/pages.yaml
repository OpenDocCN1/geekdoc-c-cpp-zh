  md: 'Click here to code image


    ```

    avg = i + j + k + 1 / 4;   /* Will NOT compute average! */

    ```


    The reason is simple when you understand the order of operators. C computes the
    division first, so 1 / 4 is evaluated first and then i, j, and k are added to
    that divided result. If you want to override the order of operators, you would
    do this in this case, you will have to use ample parentheses around expressions.


    # Break the Rules with Parentheses


    If you need to override the order of operators, you can. As demonstrated in Table
    9.1, if you group an expression inside parentheses, C evaluates that expression
    before the others. Because the order of operators table shows parentheses before
    any of the other math operators, parentheses have top precedence, as the following
    statement shows:


    Click here to code image


    ```

    ans = (5 + 2) * 3;   /* Puts 21 in ans */

    ```


    Even though multiplication is usually performed before addition, the parentheses
    force C to evaluate 5 + 2 first and then multiply the resulting 7 by 3. Therefore,
    if you want to average four values, you can do so by grouping the addition of
    the values in parentheses:


    Click here to code image


    ```

    avg = (i + j + k + 1) / 4;   /* Computes average */

    ```


    ![](img/a7086d2ec25d9e20dd06cdcc839fe8b9_121_0.png)


    > Tip

    lots of parentheses. They clarify your expressions. Even if the regular operator
    order will suffice for your expression, parentheses make the expression easier
    for you to decipher if you need to change the program later.'
