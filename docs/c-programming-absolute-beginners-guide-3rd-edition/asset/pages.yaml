    # # Character Arrays: Lists of Characters


    Character arrays hold strings in memory. An array is a special type

    of variable that you''ll hear much about in upcoming chapters.

    All the data types—int, float, char, and the rest—have

    corresponding array types. An array is nothing more than a list of

    variables of the same data type.


    Before you use a character array to hold a string, you must tell C that

    y need a character array in the same place you would tell C that

    y need any other kind of variable. Use brackets ([ ]) after the

    array name, along with a number indicating the maximum number of

    characters the string will hold.'
