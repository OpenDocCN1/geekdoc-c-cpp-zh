  md: "# Using while\n\nIf you want to repeat a section of code until a certain condition\
    \ becomes false, while is the way to go. Let's revisit the counter up and down\
    \ program for a fourth go-round and use while loops this time:\n\n[Click here\
    \ to view code image](#)\n\n```\n// Example program #1 from Chapter 14 of Absolute\n\
    Beginner's Guide\n// to C, 3rd Edition\n// File Chapter14ex1.c\n\n/* This program\
    \ increases a counter from 1 to 5, printing\nupdates\nand counts it back down\
    \ to 1. However, it uses while\nloops and\nnd the increment and decrement operators\
    \ */\n\n#include <stdio.h>\n\nmain()\n{\n    int ctr = 0;\n\n    while (ctr <\
    \ 5)\n    {\n        printf(\"Counter is at %d.\\\\n\", ++ctr);\n    }\n\n   \
    \ while (ctr > 1)\n    {\n        printf(\"Counter is at %d.\\\\n\", --ctr);\n\
    \    }\n\n    return 0;\n}\n```\n\nYou might be getting a little sick of \"Counter\
    \ is at...\" code example, but using different statements, formats, and functions\
    \ to accomplish the same task is an excellent method to show how new skills can\
    \ help you execute a task differently or more efficiently."
