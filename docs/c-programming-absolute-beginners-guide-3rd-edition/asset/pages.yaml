    # Moving Around in a File


    Use the fseek() function to move around in a file. After you open a file, C initializes
    the file pointer to point to the next place in the file you can read or write.
    fseek() moves the file pointer to that that you can read and write at places that
    normally would not be pointed at using sequential access. Here is the format


    Click here to view code image


    ```

    fseek():

    fseek(filePtr, longVal, origin);

    ```


    The filePtr is the file pointer used in the fopen() function that used a random-access
    mode. The longVal is a longterm variable literal that can be positive or negative.
    The longVal is the number of bytes to skip forward or backward in the file. The
    origin is always one of the values shown in Table 29.2. origin tells fseek() where
    to start seeking.


    | Origin | Description |

    | SEEK_SET | Beginning of file |

    | SEEK_CUR | Current position in file |

    | SEEK_END | End of file |'
