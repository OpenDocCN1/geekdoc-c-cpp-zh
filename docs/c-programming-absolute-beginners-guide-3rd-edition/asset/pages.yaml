- img_proc: true
  md: '# Disk Files


    Disks hold data in files. You already understand the concept of files if you''ve
    saved a C program to a disk file. Files can hold either programs or data. Your
    programs must be loaded from disk into memory before you run them. You also must
    load data from the disk file into variables before you can work with the data.
    The variables also hold data before the data goes to a disk file.


    Two types of files exist: sequential-access files and random-access files. Their
    types determine how you can access them. If you work with a sequential-access
    file, you have to read or write the file in the order of the data. In a random-access
    file, you can jump around, reading and writing any place in the file.


    ![](img/a7086d2ec25d9e20dd06cdcc839fe8b9_335_0.png)


    > Tip A sequential file is like a video tape, and a random-access file is like
    a DVD or Blu-Ray. You have to watch a movie in sequence on a tape (or fast-forward
    through it in order), whereas you can skip to different chapters on a DVD or a
    Blu-Ray.


    All disk files have names that conform to the same naming rules as filenames on
    your operating system. Before you can use a disk file, whether to create, read,
    or change the data in the file, you must open the file.


    As with a filing cabinet, you can''t use a disk file without opening the file.
    Instead of pulling out a drawer, your computer attaches something called a file
    pointer to the file and makes sure that the disk is properly set up to hold the
    file you specify.'
