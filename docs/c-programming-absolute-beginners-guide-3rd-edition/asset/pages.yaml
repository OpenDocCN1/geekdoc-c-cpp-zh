  md: '# 25. Arrays and Pointers


    +   In This Chapter

    - Understanding that array names are pointers

    - Getting down in the list

    - Working with characters and pointers

    - Being careful with string lengths

    - Creating arrays of pointers


    ![](img/a7086d2ec25d9e20dd06cdcc839fe8b9_292_0.png)


    This chapterte teaches how C''s array and pointer variables share a lot of principles.
    As a matter of fact, an array is a special kind of pointer. Because of their similarities,
    you can use pointer notation to get array values, and you can use array notation
    to get pointed-at values.


    Perhaps the most important reason to learn arrays and pointers overlap is for
    character string handling. By combining pointer notation (using the dereferencing
    operation) and array notation (using subscripts), you can store lists of character
    strings and reference them as easily as you reference array values of other data
    types.


    Also, after you master the heap—a special place in memory that the next chapter
    introduces you to—you''ll see that pointers are the only way to get to heap memory,
    where you put data values.


    # Array Names Are Pointers


    An array is nothing more than a pointer to the first element in that array. The
    array name is not exactly a pointer variable, though. Array names are known as
    pointer constants. The following statement defines an integer array and initializes
    it:


    Click here to view code image


    ```

    int vals[5] = {10, 20, 30, 40, 50};

    ```'
