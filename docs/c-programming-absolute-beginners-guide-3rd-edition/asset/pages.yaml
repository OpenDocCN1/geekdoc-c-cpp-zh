  md: '# Introduction


    +   In This Introduction

    * Who''s This Book For?

    * What Makes This Book Different?

    * This Book''s Design Elements

    * How Can I Have Fun with C?

    * What Do I Do Now?


    Are you tired of seeing your friends get C programming jobs while you''re left
    out in the cold? Would you like to learn C but just don''t have the energy? Is
    your old, worn-out computer in need of a hot programming language to spice up
    its circuits? This book is just what the doctor ordered.


    C Programming Absolute Beginner''s Guide breaks the commonality of computer books
    by talking to you at your level without talking down to you. This book is like
    your best friend sitting next to you teaching. C Programming Absolute Beginner''s
    Guide attempts to express without impressing. It talks to you in plain language,
    not in "computerese." The short chapters, line drawings, and occasionally humorous
    straight talk guides you through the maze of C programming faster, friendlier,
    and easier than any other book today.


    # Who''s This Book For?


    This is a beginner''s book. If you have never programmed, this book is for you.
    No knowledge of any programming concept is assumed. You can''t even spell C, you
    can learn to program in C with this book. The phrase absolute beginner has different
    meanings at different times. Maybe you''ve tried to learn C but gave up. Many
    books and classes make C much more technical than it is. You might have'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'programmed in other languages but are a beginner in C. If so, read on, O faithful
    one, because in 32 quick chapters, you''ll know C.


    # What Makes This Book Different?


    This book doesn''t cloud issues with internal technical stuff that beginners in
    C don''t need. We''re of the firm belief that introductory principles have be
    taught well and slowly. After you tackle the basics, the “harder” parts never
    seem hard. This book teaches you the real C that you need to get started.


    C can be an extremely cryptic and difficult language. Many people try to learn
    C more than once. The problem is simply this: Any subject, whether it be brain
    surgery, mail sorting, or C programming, is easy if it''s explained properly.
    Nobody can teach you anything because you have to teach yourself—but if the instructor,
    book, or video doing the teaching doesn''t make the subject simple and fun, you
    won''t want to learn the subject.


    We challenge you to find a more straightforward approach to C than is offered
    in the C Programming Absolute Beginner''s Guide. If you can, call one of us because
    we''d like to read it. (You thought maybe we''d offer you your money back?) Seriously,
    we''ve tried to provide you with a different kind of help from which you find
    in most places.


    The biggest advantage this book offers is that we really like to write C programs—and
    we like to teach C even more. We believe that you will learn to like C, too.


    # This Book''s Design Elements


    Like many computer books, this book contains lots of helpful hints, tips, warnings,
    and so on. You will run across many notes and sidebars that bring these specific
    items to your attention.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# Tip


    Many of reviewing this book''s tricks and tips (and there are lots of them) are
    highlighted as a Tip. When a really neat feature or code trick coincides with
    the topic you''re reading about, a Tip pinpoints what you can do to take advantage
    of the added bonus.


    # Note


    Throughout the C language, certain subjects provide a deeper level of understanding
    than others. A Note tells you about something you might not have thought about,
    such as a new use for the topic being discussed.


    # Warning


    A Warning points out potential problems you could face with the particular topic
    being discussed. It indicates a warning you should heed or provides a way to fix
    a problem that can occur.


    Each chapter ends by reviewing the key points you should remember from that chapter.
    One of the key features that ties everything together is the section titled “The
    Absolute Minimum.” This summary states the chapter’s primary goal, lists a code
    example that highlights the concepts taught, and provides a code analysis that
    explains code example. You’ll find these chapter'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'summaries, which begin in Chapter 2, "Writing Your First C Program," to be
    a welcome wrap-up of the chapter’s main points.


    This book uses the following typographic conventions:


    +   - Code lines, variables, and any text you see onscreen appears in monospace.

    - Placeholders on format lists appear in italic monospace.

    - Parts of program output that the user typed appear in bold monospace.

    - New terms appear in italic.

    - Optional parameters in syntax explanations are enclosed in flat brackets ({
    }). You do not type the brackets when you include these parameters.


    # How Can I Have Fun with C?


    Appendix B, "The Draw Poker Program," contains a complete, working Draw Poker
    program. The program was kept as short as possible without sacrificing readable
    code and game-playing functionality. The game also had to be kept generic to work
    on all C compilers. Therefore, you won’t find fancy graphics, but when you learn
    C, you’ll easily be able to access your compiler’s specific graphics, sound, and
    data-entry routines to improve the program. The program uses as much of this as
    the book’s contents as possible. Almost every topic taught in this book appears
    in the Draw Poker game. Too many books offer nothing more than snippets of code.
    The Draw Poker game gives you the chance to see the “big picture.” As you progress
    through this book, you’ll understand more and more of the game.


    # What Do I Do Do Now?


    Turn the page and learn the C language.'
