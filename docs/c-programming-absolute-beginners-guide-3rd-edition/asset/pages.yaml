    - Use a standalone getchar() to get rid of the Enter keypress if you don''t want
    to capture it. You can also create a loop to call getchar() until the return value
    is \n, as shown in the sample code.

    - Use getch() to get unbuffered single characters as soon as the user types them.

    - Don''t use a character I/O function with character variables. Use an int variable
    instead.

