    # The Absolute Minimum


    The goal of this chapter was to show you some built-in character and string functions
    that help you test and change strings. The string functions presented in this
    chapter work on both string literals and arrays. The character functions test
    for digits and letters, and convert uppercase and lowercase characters to their
    opposites. Key concepts from this chapter include:


    +   - Use C''s built-in character-testing and character-mapping functions so your
    programs don''t have to work as hard to determine the case of character data.

    - Use gets() to get strings and puts() to print strings.

    - Use gets() when you must get strings that contain spaces. Remember that scanf()
    cannot grab strings with spaces.

    - Use strcat() to merge two strings.

