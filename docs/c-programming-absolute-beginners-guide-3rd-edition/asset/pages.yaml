  md: 'When comparing this listing to the previous times you wrote programs to accomplish
    the same goal, you can see that your number of lines decreases significantly when
    using a loop. Previously, you needed to type five printf() statements for the
    count up and then type another four to count down. However, by using while loops,
    you need only one printf() statement in the count up and one in the count down
    loop, which streamlines the program.


    The variable ctr is initially set to 0. The first time while executes, i is less
    than 5, so the while condition is true and the body of the while executes. In
    the body, a newline is sent to the screen and ctr is incremented. The second time
    the condition is tested, ctr has a value of 1, but 1 is less than 5, so the body
    executes again. The body continues to execute until ctr is incremented to 5. Because
    5 is not less than 5 (they are equal), the condition becomes false and the loop
    stops repeating. The rest of the program is free to execute, leading to the second
    while loop that counts down from 5 to 1, when it eventually makes the second condition
    false and ends the loop.


