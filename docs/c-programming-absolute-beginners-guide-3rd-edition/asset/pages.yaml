  md: '# 14. Code Repeat—Using Loops to Save Time and Effort


    +   In This Chapter

    * Saving time by looping through code

    * Using while

    * Using do...while


    Now that you''ve learned the operators, you''re ready to play "loop" with your
    programs. A loop is simply a section of code that repeats a few times. You don''t
    want a loop to repeat forever—that''s called an infinite loop. The loops you write
    (if you write them properly—and, of course, you will) should come to a conclusion
    when they finish doing the job you set up to.


    Why would you want a program to loop? The answer becomes clear when you think
    about the advantage of using a computer for tasks that people wouldn''t want to
    do. Computers never get bored, so you should give them mundane and repetitive
    tasks; leave the tasks that require thought to people. You wouldn''t want to pay
    someone to add a list of hundreds of payroll figures, and few people would want
    to do it anyway. Computer programs can do that kind of repetitive work. People
    can then analyze the results when the computer loop finishes calculating all the
    figures.


    If you want to add a list of figures, print company sales totals for the past
    12 months, or add up the number of students who enroll in a computer class, you
    need to use a loop. This chapter explains two common C loops that use the while
    command.'
  merge: -1
  pgno: 171
- img_proc: true
  md: "# while We Repeat\n\nThe while statement always appears at the beginning or\
    \ end of a loop. The easiest type of loop that uses while is called the while\
    \ loop. (The other is called the do...while loop. You'll see it a little later.)\
    \ Here is the format of while:\n\nClick here to view code image\n\n```\nwhile\
    \ (condition)\n  { block of one or more C statements; }\n```\n\nThe condition\
    \ is a relational test that is exactly like the relational test condition you\
    \ learned for if. The block of one or more C statements is the body of the while.\n\
    \nThe body of the while repeats as like the condition is true. This is the difference\
    \ between while statement and an if statement: The body of the if executes if\
    \ the condition is true. The body of the if executes only once, whereas the deas\
    \ the body of the while can execute a lot of times.\n\nFigure 14.1 helps explain\
    \ the similarities and differences between if and while. The formats of the two\
    \ commands are similar, in that braces are required if the body of the while has\
    \ more than one statement. Even if the body of the while contains only a single\
    \ statement, you should enclose the body in braces so that braces will still be\
    \ there if you later add statements to the while. Never put a semicolon after\
    \ the while's parenthesis. The semicolon follows only the statements inside the\
    \ body of the while.\n\n![](img/a7086d2ec25d9e20dd06cdcc839fe8b9_172_0.png)\n\n\
    > The two statements in Figure 14.1 are similar, but they don't do the same thing.\
    \ while and if are two separate statements that do two separate things."
  merge: -1
  pgno: 172
- img_proc: true
  md: "You must somehow change a variable inside the while loop's condition. If you\
    \ don't, the while will loop forever because it will test the same condition each\
    \ time through the loop. Therefore, you avoid infinite loops by making sure the\
    \ body of the while loop changes something in the condition so that eventually\
    \ the condition becomes false and the program continues with the statements that\
    \ follow the while loop.\n\nUsing if:\n\n```\nif(amount < 25) {\n    printf(\"\
    Amount is too small.\\n\");\n    wrongVal++; MOVE ALONG\n}\n```\n\nExecutes only\
    \ one time but then if amount is less than 25.\n\nUsing while:\n\n```\nwhile (amount\
    \ < 25) {\n    printf(\"Amount is too small.\\n\");\n    wrongVal++;\n    printf(\"\
    Try again...What is new amount?\\n\");\n    scanf(\"%d\",&amount); GO BACK\n}\n\
    ```\n\nKeeps repeating as amount is less than 25.\n\n# FIGURE 14.1 If the while\
    \ body executes once; the while body repeat more than once.\n\n> NotenAs with\
    \ if, the while might never execute! If the condition is false going into while\
    \ the first time, the body of the while doesn't execute."
