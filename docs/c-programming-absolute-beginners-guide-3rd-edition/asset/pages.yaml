  md: '> **Warning**

    The only thing you don''t call the string-terminating zero is zero! C programmers
    use the special names for the string-terminating zero so that you''ll know that
    a regular numeric zero or a character ''0'' is not being used at the end of the
    string; only the special null zero appears at the end of a string.


    C marks the end of all strings with the string-terminating zero. You never have
    to do anything special when entering a string literal as "My name is Julie." C
    automatically adds the null zero. You''ll never see the null zero, but it is there.
    In memory, C knows when it gets to the end of a string only when it finds the
    null zero.


    > Appendix A, "The ASCII Table," contains an ASCII table (first mentioned in Chapter
    2, "Writing Your First C Program"). The first entry is labeled null, and the ASCII
    number for null is 0. Look further down at ASCII 48, and ASCII 48 is the character
    ''0'', whereas the first ASCII value is the null zero. C puts the null zero at
    the end of strings. Even the string "Iam" ends in an ASCII 0 directly after the
    character 0 in 20.


    The string terminator is sometimes called \0 (backslash zero) because you can
    represent the null zero by enclosing \0 in single quotes. Therefore, ''0'' is
    the character zero, and ''\0'' is the string terminator. (Remember the escape
    sequences covered in Chapter 4,'
