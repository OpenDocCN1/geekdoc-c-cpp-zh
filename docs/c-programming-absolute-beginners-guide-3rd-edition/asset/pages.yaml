    \ never see this: \n\n```\n--14; /* Don't do this! */\n```\n\nPrefix and postfix\
    \ operators produce identical results when used by themselves. Only when you combine\
    \ them with other expressions does a small \"gotcha\" appears on the line. Consider\
    \ the following code:\n\n```\nint i = 2, j = 5, n;\nn = ++i * j;\n```\n\nThe question\
    \ is, what is n when the statements finish executing? It's easy to see what's\
    \ in j because j doesn't change and holds 5. The ++ ensures that i is always incremented,\
    \ so you know that i becomes 3. The trick is determining exactly when i increments.\
    \ If i increments increments before the multiplication, n becomes 15, but if i\
    \ increments after the multiplication, n becomes 10.\n\nThe answer lies in the\
    \ prefix and postfix placements. If the ++ or is a prefix, C computes before anything\
    \ else on the line. If the ++ or is a postfix, C computes it after everything\
    \ else on the line finishes. Because the ++ in the preceding code is a prefix,\
    \ i increments to 3 before being multiplied by j. The following increments i after\
    \ multiplying i by j and storing the answer in n:\n\nClick here to view code image\n\
    \n```\nn = i++ * j; /* Puts 10 in n and 3 in i */\n```\n\nBeing able to increment\
    \ a variable in the same expression as you use the variable means less work on\
    \ the programmer's part. The"
