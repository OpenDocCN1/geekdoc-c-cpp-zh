    # The Newline Consideration


    Although getchar() gets a single character, control isn''t returned to your program
    until the user presses Enter. The getchar() function actually instructs C to accept
    input into a buffer, which is a memory area reserved for input. The buffer isn''t
    released until the user presses Enter, and then the buffer''s contents are released
    a character at a time. This means two things. One, the user can use the Backspace
    key to correct bad character input, as long as he or she hasn''t pressed Enter.
    Two, the Enter keypress is left on the input buffer if you don''t get rid of it.


