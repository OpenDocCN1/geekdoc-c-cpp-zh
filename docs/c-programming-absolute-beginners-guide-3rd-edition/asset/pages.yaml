  md: '# 1. What Is C Programming, and Why Should I Care?


    +   In This Chapter

    - Understanding the basics of C programming

    - Finding and installing a C compiler

    - Learning the steps of the programming process


    Although some people consider C to be difficult to learn and use, you''ll soon
    see that they are wrong. C is touted as being a cryptic programming language,
    and it can be—but a well-written C program is just as easy to follow as a program
    written in any other programming language. The demand for programmers and developers
    today is high, and learning C is an effective foundation to build the skills needed
    in a variety of fields, including app development, game programming, and so much
    more.


    If you''ve never written a program in your life, this chapter is an excellent
    beginning because it teaches introductory programming concepts, explains what
    a program is, and provides a short history of the C language. Get ready to be
    excited! C is a programming language rich in its capabilities.


    # What Is a Program?


    A computer isn''t smart. Believe it or not, on your worst days, you are still
    light-years ahead of your computer in intelligence. You can think, and you can
    tell a computer what to do. Here is where the computer shines: It will obey your
    instructions. Your computer will sit for days processing the data you supply,
    without getting bored or wanting overtime pay.


    The computer can''t decide what to do on its own. Computers can''t think for themselves,
    so *programmers* (people who tell computers what to do) must give computers extremely
    detailed instructions.'
  merge: -1
  pgno: 26
- img_proc: true
  md: 'Without instructions, a computer is useless; with incorrect instructions, a
    computer will not successfully execute your desired task. A computer can no more
    process your payroll without detailed instructions than an automobile can start
    by itself and drive around the block independently. The collection of detailed
    expressions you supply when you want your computer to perform a specific task
    is known as a program.


    > > **Note Word processors, apps, spreadsheets, and computer games are nothing
    more than computer programs. Facebook is a collection of programs. Without such
    programs, the computer would just sit there, not knowing what to do next. A word-processing
    program contains a list of detailed instructions, written in a computer language
    such as C, that tells your computer exactly how to be a word processor. When you
    program, you are telling the computer to follow the instructions in the program
    you have supplied.


    You can buy or download thousands of programs for your computer, tablet, or phone,
    but when a business needs a computer to perform a specific task, that business
    hires programmers and developers to create software that follows the specifications
    the business needs. You can make your computer or mobile device do many things,
    but you might not be able to find a program that does exactly what you want. This
    book rescues you from that dilemma. After you learn C, you will be able to write
    programs that contain instructions that tell the computer how to behave.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# Tip


    A computer program tells your computer how to do what you want. Just as a chef
    needs a recipe to make a dish, a program needs instructions to produce results.
    A recipe is nothing more than a set of detailed instructions that, if properly
    written, describes that proper sequence and the contents of the steps needed to
    prepare a certain dish. That''s exactly what a computer program is to your computer.


    Programs produce output when you run or execute them. The prepared dish is a recipe''s
    output, and the word processor or app is the output produced by a running program.


    # Warning


    Just as when a chef gets an ingredient wrong or misses a step in a recipe, the
    resulting dish can be inedible; if you mistype code or skip a step, your program
    will not work.


    # What You Need to Write C Programs


    Before you can write and execute a C program on your computer, you need a C compiler.
    The C compiler takes the C program you write and builds or compiles it (technical
    terms for making the program computer-readable), enabling you to run the compiled
    program when you''re ready to look at the results. Luckily, many excellent free
    software packages are available in which you can edit and compile your C programs.
    A simple web search will provide a list. This book uses Code::Blocks (www.codeblocks.org).'
  merge: -1
  pgno: 28
- img_proc: true
  md: '> Tip If you run a search for "C Programming Compilers," you''ll see a number
    of freeware options, including offerings from Borland and Microsoft. So why does
    this book use Code::Blocks? Because it offers versions for Windows, Macs, and
    Linux, so you can use a version of the software no matter what operating system
    you use. However, feel free to pick whichever programming environment looks best
    to you.


    If you surf to the Code::Blocks page and read the very first sentence, you may
    worry a bit (or a lot):


    The open source, cross platform, free C++ IDE. Open source refers to software
    that users can alter or improve (You will not be doing this anytime, so put it
    out of your mind.) Cross-platform is an adjective that means the software can
    run on different operating systems—as a beginner, however you need concern yourself
    with only your own platform. I free is a term we can all get behind, and IDE is
    short for integrated development environment, which just means you can write,
    edit, and debug your programs without having to switch software to do. We get
    to it debugging shortly.


    Don''t panic about the C++ part. You can write either C or C++ programs in Code::Blocks.
    Finding a C compiler these days is harder. Most of the time, C compilers bundled
    with an advanced version of C, known as C++. Therefore, when you look for a C
    compiler, you will almost always find a combination C and C++ compiler, and often
    the C++ functionality is highlighted. The good news is that, after you learn C,
    you will already have a C++ compiler and you won''t have to learn the ins and
    outs of a new IDE.


    Figure 1.1 shows the Code::Blocks home page. To download the C/C++ IDE, click
    the Downloads choice under the Main section in the'
  merge: -1
