  md: '# 15. Looking for Another Way to Create Loops


    +   ### In This Chapter

    * Looking for another way to repeat code

    * Working for


    Another type of C loop is called the for loop. A for loop offers more control
    than while and do-while. With a for loop, you can specify exactly how many times
    you want to loop; with while loops, you must continue looping as long as a condition
    is true.


    C programs have room for all three kinds of loops. Sometimes one loop fits one
    program''s requirements better than another. For example, if you wrote a program
    to handle customer orders as customers from the inventory, you would need to use
    a while loop. The program would process orders while customers came through the
    door. If 100 customers happened to buy things, the while loop would run 100 times.
    At the end of the day, you might want to add the 100 customer purchases to get
    a total for the day. You could then use a for loop because you would then know
    exactly how many times to loop.


    > By incrementing counter variables, you can simulate a for loop with a while
    loop. You can also simulate a while with a for! Therefore, the kind of loop you
    use ultimately depends on which kind you feel comfortable with at the time.'
  merge: -1
  pgno: 180
