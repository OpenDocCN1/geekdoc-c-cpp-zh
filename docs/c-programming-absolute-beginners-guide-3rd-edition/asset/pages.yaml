  md: '# 16. Breaking in and out of Looped Code


    +   In This Chapter

    * Taking a break

    * Continuing to work


    This chapter doesn''t teach you how to use another kind of loop. Instead, this
    chapter extends the information you learned in the last two chapters. You have
    ways available to control the while loop in addition to a relational test, and
    you can change the way a for loop operates via means other than the counter variable.


    The break and continue statements let you control loops for those special occasions
    when you want to quit a loop early or repeat a loop sooner than it would normally
    repeat.


    # Take a break


    The break statement rarely, if ever, appears on a line by itself. Typically, break
    appears in the body of an if statement. The reason for this will be made clear
    shortly. Here is the format of break:


    ```

    break;

    ```


    ![](img/a7086d2ec25d9e20dd06cdcc839fe8b9_191_0.png)


    > break is easy, isn''t it? Yep, not much to it. keep in mind that break usually
    resides in the body of an if. In a way, if is the first part of almost every break.'
  merge: -1
  pgno: 191
- img_proc: true
  md: 'break always appears inside a loop. The purpose of break is to terminate the
    current loop. When a loop ends, the code following the body of the loop takes
    over. When break appears inside a loop’s body, break terminates that loop immediately,
    and the rest of the program continues.


    Here is a for loop that normally would print 10 numbers. Instead of printing 10,
    however the break causes the loop to stop after printing 5 numbers.


    Click here to view code image


    As a real-world example, suppose a teacher wrote a program to average the 25 students''
    test scores. However, if a student or two missed the test, the teacher wouldn’t
    want to average the entire 25 student scores. If the teacher enters a -1.0 for
    a test score, the -1.0 triggers the break statement and the loop terminates early.


    Click here to view code image


    ```

    // Example program #1 from Chapter 16 of Absolute Beginner''s Guide

    // to C, 3rd Edition

    // File Chapter16xl.c

    ```


    ```

    /* This program will ask users to input test grades for the 25 students in a class
    and then compute an average grade. If fewer than 25 students took the test, the
    user can enter -1 as a grade and break the loop, and only those entered grades
    will be used to compute the average.

    */

    ```'
