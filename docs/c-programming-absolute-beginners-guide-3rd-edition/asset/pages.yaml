    numeric conversion functions, time and date functions, and random number–generating
    functions.

    You don''t have to understand every function in this chapter at this time. You
    might write hundreds of C programs and never use many of these functions. Nevertheless,
    they are in C if you need them.


    +   - Use the built-in numeric functions when you can so that you don''t have
    to write code to perform the same calculations.

    - Many of the numeric functions, such as `floor()`, `ceil()`, and `fabs()`, convert
    one number to another.

    - Be sure to seed the random number generator with the time of day if you want
    random numbers with `rand()` to be different every time you run a program.

    - Don''t feel that you must master the `trig` and `log` functions if you don''t
