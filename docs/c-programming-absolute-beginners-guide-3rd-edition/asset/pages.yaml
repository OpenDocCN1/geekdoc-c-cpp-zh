  md: '# 11. The Fork in the Road—Testing Data to Pick a Path


    +   In This Chapter

    - Testing data

    - Using-if

    - Using else


    C provides an extremely useful statement called if. if lets your programs make
    decisions and execute certain statements based on the results of those decisions.
    By testing contents of variables, your programs can produce different output,
    given different input.

    This chapter also describes relational operators. Combined with if, relational
    operators make C a powerful data-processing language. Computers would be really
    boring if they couldn''t test data; they would be little more than calculators
    if they had no capability to decide courses of action based on data.


    # Testing Data


    The C if statement works just like it does in spoken language: If something is
    true, do one thing; otherwise, do something else.

    Consider these statements:


    > If I make money, we''ll go to Italy.

    If the shoes don''t fit, take them back.

    If it''s hot outside, water the lawn.


    Table 11.1 lists the C relational operators, which permit testing of data. Notice
    that some of the relational operators consist of two symbols.'
