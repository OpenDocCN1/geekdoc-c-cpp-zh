  md: '%s and %d. scanf() is the mirror-image function of printf().

    Often you will write programs that ask the user for values with a printf() and
    get those values with scanf(). Here is the format of scanf():


    [Click here to view code image]()


    ```

    scanf(controlString [, data] );

    ```


    When your program gets to scanf(), C stops and waits for the user to type values.
    The variables listed inside scanf() (following the controlString) will accept
    whatever values the user types. scanf() quits when the user presses Enter after
    typing values.

    Even though scanf() uses the same conversion as printf(), never specify escape
    sequences as \n, \a, or \t. Escape sequences confuse scanf().scanf() quits getting
    values from the user when the user presses Enter, so you never specify the \n.


    # Prompting for scanf()


    Almost every scanf() you should write with printf(). If you don''t start with
    a printf(), the program stops and waits for input, and the user has no idea what
    to do. For example, if you need to get an amount from the user, you would put
    a printf() function like before scanf():


    [Click here to view code image]()


    ```

    printf("What is the amount?"); /* Prompt */ /* A scanf *

    would follow */

    ```


    printf() before a scanf() sends a prompt to the user. If you don''t prompt the
    user for the value or values you want, the user has no way of knowing what values
    should be typed. Generally, printf() requests the data from the user, and the
    scanf() gets the data that the user types.'
