    # Local or Global?


    The program outline explained in the preceding section needs more to work. Before
    being able to add code, you need to take a closer look at variable definitions.
    In C, all variables can be either local or global. All the variables you have
    seen so far have local. Most of the time, a local variable is safer than a global
    variable because a local variable offers itself a need-to-know access. That is,
    if a function needs a variable, it can have access to another function''s local
    variables through a variable-passing process described in the next chapter.


    If a function doesn''t need to access another function''s local variable, it can''t
    have access. Any function can read, change, and zero out global variables, so
    they don''t offer as much safety.


    The following rules describe the difference between local and global variables:'
