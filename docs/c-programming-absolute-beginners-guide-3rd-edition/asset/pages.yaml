    # The Absolute Minimum


    The goal of this chapter was to show you ways to test data and execute one set
    of code or another, depending on the result of that test. You don''t always want
    the same code to execute every time someone runs your program because the data
    is not always the same. Key concepts from this chapter include:


    +   - Use relational operators to compare data.

    - Remember that a true relational result produces a 1, and a false relational
    result produces a 0.

    - Use if to compare data and else to specify what to do if the test fails.

    - Put braces around the if body of code and around the else body of code. All
    the code in the braces either executes or does not execute, depending on the relational
    comparison.

    - Don''t put a semicolon after if or else. Semicolons go only at the end of each
    statement, inside the body of the if or the else.'
