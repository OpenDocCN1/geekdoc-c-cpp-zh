    ![](img/a7086d2ec25d9e20dd06cdcc839fe8b9_250_0.png)


    # Warning


    > After you define an array to a certain size, don''t try to store more elements
    than were allowed in the original size. After defining name as just done, the
    strcpy() function lets you store a string longer than Italy in name, but the result
    would be disastrous because other data in memory could be overwritten unintentionally.
    If another variable happened to be defined immediately after name, that other
    variable''s data will be overwritten if you try to store a too-long string in
    name.


    If the initial array needs to be larger than the initial value, specify a larger
    array size when you define the array, like this:


    Click here to view code image


    ```

    char name[80] = "Italy";      /* Leaves lots of extra room */

    ```


    Doing this makes room for a string much longer than Italy if you want to store
    a longer string in name. For example, you might want to use gets() to get a string
    from the user that could easily be longer than Italy.


