    Add comments as you write your programs. Get in the habit now, because programmers
    rarely go back and add comments later. When they must make a change later, programmers
    often lament about their program''s lack of comments.


    Another advantage is gained when commenting as you write the program instead of
    waiting until you finish. While writing programs, you often refer back to statements
