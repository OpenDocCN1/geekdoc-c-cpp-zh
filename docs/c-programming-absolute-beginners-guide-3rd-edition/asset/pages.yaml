  md: '# 29. Saving Random Files to Your Computer


    +   In This Chapter

    * Opening random files

    * Moving around in a file


    This chapter shows you how to skip around in a file, reading and writing data
    as you go. The preceding chapter introduced methods you can use to write, read,
    or append data to a file. The problem is, when you open a sequential file for
    reading, you can *only* read it.

    Sometimes you might want to read a customer structure from disk and change the
    customer''s balance. You certainly wouldn''t want to have to create a new file
    just so you could write that one change. Instead, you would want to read the customer
    information into a variable, change it, and then write back to disk exactly where
    it first resided. As Figure 29.1 shows, random files let you skip around in the
    file, reading and writing at any point you access.


    ![](img/a7086d2ec25d9e20dd06cdcc839fe8b9_347_0.png)


    FIGURE 29.1 Random files let you read and write data in any order.


    The physical layout of a file doesn''t define the type of file (whether random
    or sequential). You can create a file sequentially and then'
