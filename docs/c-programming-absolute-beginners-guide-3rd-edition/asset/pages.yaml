    file directory. Leave C''s supplied header files intact. There is rarely a reason
    to override C''s headers, but you might want to add some headers of your own.


    You might write your own header files when you have program statements that you
    frequently use in many programs. Instead of typing them in every program, you
    can put them in a file in your program directory and use the #include directive
