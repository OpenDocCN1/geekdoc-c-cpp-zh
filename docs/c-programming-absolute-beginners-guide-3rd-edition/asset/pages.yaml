  md: '# Opening a File


    To open a file, you must use the fopen() function, whose description is included
    along with printf()''s in stdio.h. Before seeing fopen(), you have to understand
    the concept of a file pointer.


    ![](img/a7086d2ec25d9e20dd06cdcc839fe8b9_336_0.png)


    > ### Note

    The concept of a file pointer is easy to understand. A regular pointer holds the
    address of data in a variable. A file pointer holds the disk location of the disk
    file you''re working with.


    You must specify a special statement to define a file pointer. As with any variable,
    you can name file pointers anything you want. Suppose you want to open an employee
    file. Before the fopen(), you must define a file pointer variable. If you called
    the file pointer fptr, here is how you would define a file pointer:


    Click here to view code image


    ```

    FILE * fptr;      /* Defines a file pointer named fptr */

    ```'
