  md: '# The Absolute Minimum


    The goal of this chapter was to introduce you to pointer variables. A pointer
    variable is nothing more than a variable that holds the location of another variable.
    You can refer to the pointed-to-variable by its name or by dereferencing the pointer.


    Pointers have many uses in C, especially in advanced C programming. As you''ll
    learn in the next chapter, arrays are nothing more than pointers in disguise.
    Because pointers offer more flexibility than arrays, many C programmers stop using
    arrays when they master pointers. Key concepts from this chapter include:


    +   - Get comfortable with memory addresses because they form the basis of pointer
    usage.


    +   - Use the & to produce the address of a variable.


    +   - Use the * to define a pointer variable and to dereference a pointer variable.
    *pAge reference the same memory location, as long as you''ve made pAge point to
    age.


    +   - Don''t try to make a pointer variable of one data type point to a variable
    of a different data type.


    +   - Don''t worry about the exact address that C uses for variable storage. If
    you use &, C takes care of the rest.


    +   - Don''t forget to use * when dereferencing your pointer, or you''ll get the
    wrong value.


    +   - Don''t get too far ahead. You will fully appreciate pointers only after
    programming in C for a while. At this point (pun not intended!), pointers will
    not seem to help at all. The only thing you might feel a little better about is
    knowing what the & inside scanf() really means.'
