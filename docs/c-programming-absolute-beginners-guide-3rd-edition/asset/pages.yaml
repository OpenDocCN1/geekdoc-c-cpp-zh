  md: '# 27. Setting Up Your Data with Structures


    +   In This Chapter

    - Defining a structure

    - Putting data in structure variables


    Arrays and pointers are nice for lists of values, but those values may all be
    of the same data type. Sometimes you have different data types that must go together
    and be treated as a whole.


    A perfect example is a customer record. For each customer, you have to track a
    name (character array), balance (double-point), address (character array), city
    (character array), state (character array), and zip code (character array or long
    integer). Although you would want to be able to initialize and print individual
    items within the customer record, you would also want to access the customer record
    as a whole, such as when you write it to a customer disk file (explained in the
    next chapter).


    The C structure is the vehicle by which you group data such as would appear in
    a customer record and get all the individual parts, called members. If you have
    many occurrences of that data and many customers, you need an array of structures.


    ![](img/a7086d2ec25d9e20dd06cdcc839fe8b9_322_0.png)


    Other programming languages have equivalent data groupings called records. The
    designers of C wanted to call these data groupings structures, however, so that''s
    what they are in C.


    Many times, a C structure holds data that you might store on 3×5 cards in a cardfile.
    For personal computers, companies maintained a cardfile box with cards that contained
    a customer’s'
