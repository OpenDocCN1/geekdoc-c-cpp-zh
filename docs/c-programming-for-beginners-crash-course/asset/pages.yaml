  md: '# Introduction


    Congratulations on downloading *C Programming for Beginners: Crash Course – Ultimate
    Edition* and thank you for doing so.


    The following chapters will discuss some of the things that you need to know in
    order to get started with working in the C programming language. This is one of
    the first coding languages that worked to make things easier for people to use.
    Many of the programming languages that came before this were too complicated and
    only those really advanced in computers were able to figure it out. The C language
    changed all this and made it easier for anyone to learn how to code and it is
    now the basis for many of our modern languages.


    This guidebook is going to take some time to look over the basics of the C language
    and how you can learn how to use it on your own. We will discuss some of the history
    that comes with this programming language as well as the basics in functions,
    variables, and keywords before moving on to comparisons, such as the if and if
    else statements inside of this language.


    When you are done with this book, you will have experience writing some of your
    own code, with some of the examples that are inside, and the confidence to go
    out there and make some new programs. When you are ready to learn one o the best
    programming languages out there, and one of the first that made programming easier
    for everyone, make sure to read through this guidebook and learn how the C programming
    language can work for you!


    There are plenty of books on this subject on the market, thanks again for choosing
    this one! Every effort was made to ensure it is full of as much useful information
    as possible, please enjoy!'
