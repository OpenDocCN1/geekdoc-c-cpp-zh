  md: "There are times and places when you would want to use an endless loop, but\
    \ as a beginner, you will most likely come across this unintentionally. There\
    \ are ways to fix the endless loops by adding in a break statement to your code.\
    \ Here we will insert the break statement right at the 8th line of the code like\
    \ in the following:\n\n```\n#include <stdio.h>\n\n    Int main()\n    {\n    While(1)\n\
    \    {\n    Printf(\"I'm endlessly looping!\");\n    Break;\n    }\n\n    Return(0);\n\
    \    }\n```\n\nNow save, build, and then run the code. Since the break statement\
    \ is in there, the loop is only going to spin through once, rather than having\
    \ it go through and keep looping all of the time. You can even use this break\
    \ code in order to allow the loop to break out prematurely if you would like.\n\
    \nBasically, the while loop and the do/while loop are very similar. With the while\
    \ loop, you will have the code look to see if the conditions are met and if this\
    \ is true, the statements or the loop will execute. On the other hand, the do/while\
    \ loop is going to execute at least once, doing the execution and then determining\
    \ whether the conditions are true before looping again and again. You could use\
    \ them the same way, but if you want to make sure that the loop happens at least\
    \ once, you would go with the do/while loop.\n\n# The For Keyword\n\nThe for keyword\
    \ is a great one to use when you want to create a loop inside the code."
