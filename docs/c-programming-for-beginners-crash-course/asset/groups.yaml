  mdcn: "\n## switch 语句在代码中是什么样子，以及它如何同时处理多种决策：\n\n```\n#include <stdio.h>\n\nint\
    \ main()\n{\n    char a;\n    printf(\"Your choice (1,2,3): \");\n    scanf(\"\
    %c\", &a);\n    switch(a)\n    {\n    case '1':\n        puts(\"Excellent choice!\"\
    );\n        break;\n    case '2':\n        puts(\"This is the most common choice:\"\
    );\n        break;\n    case '3':\n        puts(\"I question your judgment.\"\
    );\n        break;\n    default:\n        puts(\"That's not a valid choice:\"\
    );\n        break;\n    }\n    return(0);\n}\n```\n\n这段代码的大部分都放在 switch/case 结构中。它从第10行开始作为一个\
    \ switch 语句，然后是一系列 case 语句，每个 case 语句都有自己的语句（你可以根据正在编写的代码，以任何喜欢的方式更改这些语句）。switch\
    \ case 也有自己的语句，然后是一个右花括号。所有这些都是 switch/case 结构附带的重要元素。\n\n你可能已经注意到，它内部有 break\
    \ 关键字。因此，这个结构内部共有四个关键字，包括 break、default、case 和 switch。把它放进编译器，然后运行几次，选择不同的选项，看看输出是什么，以及你是否正确放置了代码中的所有内容。\n\
    \n那么这一切是如何工作的呢？switch 语句处理的是单个值，而不是整个比较。它可以保存一个数学表达式，但结果最终必须只是一个值。然后，由 switch\
    \ 指定的这个值会与每个 case 语句的值进行比较。如果发现比较结果为真，属于该 case 语句的语句就会被标记出来并执行。那些不被视为真的语句则会被跳过。\n\
    \n例如，如果用户在第12行输入数字1，那么第13行中的 puts 语句就会被执行，其余语句则被跳过。但如果他们选择数字2，你会看到第一个 case 被跳过，转而执行第二个\
    \ case，以此类推，直到找到为真的那个。\n\n如果用户输入的值由于某种原因不匹配任何 case 条件，你的代码就会转到 default 条件。在这个例子中，如果用户输入数字4，它就会跳到\
    \ default 并执行随附的代码。\n\n你可以把它用于任何允许用户输入某些内容的代码，比如菜单功能。这给了他们一些选择，而你可以教代码根据用户给出的答案或输入进行交互。只要他们给出的是\
    \ switch 语句允许的答案，他们就会看到你放入的正确答复！\n\n## 第4章：在C语言中使用循环\n\n循环可以是为C语言代码增添的有用内容。它们允许你在代码中创建事物列表，甚至创建图形和图表。它们很好用，因为只需几行代码，你就能完成一个巨大的图表，而不必试图把沿途需要的每一行都打出来。例如，如果你想制作一个从1到100的图表，逐行写出来可不太有趣，但使用合适的循环语句，你只需要几行就能做到。\n\
    \n循环是你在C语言代码中进行比较的另一种方式，而且有几种循环选项可以真正为你的代码增添力量。while 循环、嵌套循环和 do/while 循环是你可以使用的最常见类型，但本章中我也会花一些时间讨论\
    \ for 关键字。\n\n### while 循环\n\n循环将是一种非常重复的控制程序执行方式。你可以指定让该循环重复的条件，以及你希望在代码中重复的一组语句，还有让循环停止的方法。如果你忘记加入停止循环的部分，程序基本上会一直运行下去并使计算机卡死，所以一定要加入这一部分。\n\
    \n下面是一个代码示例，它将使用 while 循环让代码从1数到10。\n\n```c\n#include <stdio.h>\n\nint main()\n\
    {\n    int x;\n    x = 1;\n    while(x <= 10)\n    {\n        printf(\"%d\\n\"\
    ,x);\n        x++;\n    }\n    return(0);\n}\n```\n\n循环条件显示在第8行，它表示当变量的值小于或等于数字10时，只要条件最终为真，循环内部的语句就会继续重复。第11行显示\
    \ x 的值将会递增，因此每次执行循环时它都会增加1，直到 x 的值大于10。当你构建并运行这段代码时，你将能看到数字1到10的显示。\n\n你可以对此进行更改，以获得任意多个\
    \ while 循环。例如，假设你希望代码数到20。你只需要转到 while 语句所在的部分，更改你想使用的数字。你也可以更改希望递增的步长。上面的代码设置为\
    \ x = 1，所以它只是增加1，但你可以把这个变量改成任何你想要的值，比如以2或5为步长计数，以获得你想要的结果。\n\n### do/while 循环\n\
    \n在进行循环时，你还有另一个选项，那就是 do/while 循环。它类似于 while 循环，但几乎就像是倒过来的版本。对于 while 循环，代码会检查条件是否为真，如果为真，然后才执行。对于\
    \ do/while 循环，代码会先执行一次，然后检查条件是否满足，再决定是否再次运行。如果你想确保语句至少运行一次，do/while 循环就是最适合你的选项。让我们看看下面的代码，了解\
    \ do/while 代码如何工作。\n\n```c\n#include <stdio.h>\n\nint main()\n{\n    char ch;\n\
    \    ch = 'A';\n    do\n    {\n        putchar(ch);\n        ch++;\n    }\n  \
    \  while (ch != 'z');\n    putchar('\\n');\n    return(0);\n}\n```\n\n你会注意到，do/while\
    \ 循环从第9行的语句“do”开始。这一个没有条件，因为这些语句会一个接一个地执行。然后你可以看到，while 条件会出现在第14行。该循环将依赖 ch 变量作为条件，它首先在第7行初始化，然后在第12行被修改。花点时间在编译器中构建并运行这段代码。\n\
    \n在这段代码中，'z' 不会被打印出来，因为它被视为退出条件。如果你希望在代码中看到 'z'，你需要将代码末尾的退出条件设为 'z+1'。这样一来，你基本上创建了一个无限循环，因为它带有一个加一。如果你构建并尝试运行这个版本，你最终会陷入无限循环，需要按\
    \ Ctrl + C 才能退出程序。\n\n有时你确实会想要使用无限循环，但作为初学者，你很可能会无意中遇到这种情况。可以通过在代码中添加 break 语句来修复无限循环。这里我们将把\
    \ break 语句正好插入到代码的第8行，如下所示：\n\n```c\n#include <stdio.h>\n\nint main()\n{\n   \
    \ while(1)\n    {\n        printf(\"I'm endlessly looping!\");\n        break;\n\
    \    }\n    return(0);\n}\n```\n\n现在保存、构建并运行代码。由于其中加入了 break 语句，循环只会运行一次，而不是一直反复循环。如果你愿意，甚至可以使用这个\
    \ break 代码来让循环提前跳出。\n\n基本上，while 循环和 do/while 循环非常相似。对于 while 循环，你会让代码检查条件是否满足，如果为真，语句或循环就会执行。另一方面，do/while\
    \ 循环至少会执行一次，先执行，然后判断条件是否为真，再决定是否反复循环。你可以用同样的方式使用它们，但如果你想确保循环至少发生一次，就应该选择 do/while\
    \ 循环。\n\n### for 关键字\n\n当你想在代码中创建循环时，for 关键字是一个很好用的关键字。\n"
