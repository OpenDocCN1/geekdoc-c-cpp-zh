  mdcn: "\n\n幸运的是，这些编程语言所用的大多数 IDE 都可以免费下载和使用，因此你不需要花太多钱就能把它们搭建起来。在本书中，我会使用 Code Blocks\
    \ IDE 来运行 C 语言，不过你也可以根据自己希望用代码实现的目标，选择其他不同的工具来帮助你。\n\nCode Blocks IDE 是最好的选择之一，因为它具备你需要的所有功能。你不需要再去网上寻找编译器或其他组件来帮助你编写代码，因为它们已经整合在一起。你可以访问下面的网站下载\
