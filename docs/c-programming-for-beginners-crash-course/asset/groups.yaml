    # Functions:


    Functions are really important in this language and many of them are held inside
    the library that are found in the C language. The function is going to knit together
    the code so that it is able to make the program that you want. When you want to
    make or use a function inside of your own program, you will need to incorporate
    in a header file, which is going to define the function. There is so much that
    you are able to do with your functions and I will give some examples of how powerful
    this can be later on.


    # Operators


    Operators are gong to be used inside of your code in order to manipulate the data
    that is inside the program. There are several types of operators and each of them
    are going to work in a different manner depending on how you use them. Some of
    the most common operators used inside of the C language include:


    +   - Mathematical: these would include any of the signs that you would need in
    order to add, subtract, divide, or multiply information together in the code.

    +   - Comparison: these operators allow you to compare different values or pieces
    of information to each other inside of the code to determine if the statement
    is true or false.

    +   - Assignment: the assignment operators make it easier to assign a value to
    your variable inside the code.


    # Variables and Values


    The variables and values are going to be similar to each other, but there are
    a few differences. The values are going to contain numeric values and characters
    and you can make them contain anything that you would like. For example, the numeric
    values can be fractions and decimal points or really small or really big numbers.
    Or with the characters, you could have one letter or a whole sentence or more
    depending on what you would like the code to do.'
