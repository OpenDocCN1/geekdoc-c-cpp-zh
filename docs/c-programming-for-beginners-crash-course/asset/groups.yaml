  mdcn: "\n## 第三章：C 编程语言中的语言比较\n\n在大多数情况下，当你编写代码时，程序会按照代码中出现的顺序逐行执行语句。但有时你会想要改变程序的流程。if\
    \ 语句是改变程序流程顺序最简单的方法之一，它使程序能够为你做出决策，而不是仅仅逐行读取代码。\n\n本章中，我们将花一些时间研究 if 关键字，并学习 C\
    \ 语言内部是如何进行不同比较的，以便编译器能够根据你放入代码中的内容以及用户输入到系统中的内容处理多个决策。\n\n### 使用比较\n\n我将讨论的第一部分是如何在\
    \ C 语言内部实现比较。在进行比较时，程序会评估两个表达式或值。为了进行这些评估，你可以使用该语言中提供的一些比较运算符。一些常见的比较运算符包括：\n\n\
    - (!=): 这表示不等于\n- (>=): 这表示大于或等于。\n- (<=): 这表示小于或等于。\n- (<): 这表示小于。\n- (>): 这表示大于。\n\
    - (==): 这表示等于。\n\n现在我们已经学习了一些最常见的比较运算符，是时候通过以下示例看看它在代码中是如何工作的了。\n\n```c\n#include\
    \ <stdio.h>\nint main()\n{\n    int a;\n\n    printf(\"Type an integer:\");\n\
    \    scanf(\"%d\", &a);\n    printf(\"You typed %d. \\n\", a);\n    if(a > 10)\n\
    \    printf(\"%d is greater than \\n\", a);\n\n    return(0);\n}\n```\n\n在此示例中，用户将被提示输入其整数值。第\
    \ 9 行显示的值，然后当你到达第 10 行时，if 语句将评估该值。如果它确定该值高于 10，则第 11 行将被执行。但如果该值低于 10，则第 11 行将被跳过。花点时间构建然后运行此代码以设置它。\n\
    \n完成之后，输入你想要的任何值。我将使用数字 45。当你将此数字输入代码时，它将起作用，编译器将显示第 11 行的 printf 语句。但如果我选择像 5\
    \ 这样的数字，第 11 行及其对应的语句将被跳过，程序将终止。\n\n### If 语句\n\n我上面稍微谈到了 if 语句在代码中如何工作。大体上，if\
    \ 语句的格式与其他我们将要处理的语句略有不同。它将被拆分为至少两行。第一行将把 if 条件放在括号中。如果它评估条件并发现为真，则下一行将被执行。它基本上只是一个被分成两行的语句，因此分号将与语句的第二部分一起，而不是在第一部分之后。\n\
    \n现在，如果你愿意，可以将 if 语句写在一行中，但这不是常见的编程礼仪，通常当它们被分成两行或更多行并用括号括起来时，代码更易于阅读。\n\n你也可以选择在代码中加入多个\
    \ if 语句。这允许你根据设定的条件和用户提供的输入在代码内部执行几件事。以下是一个很好的示例，你也可以在程序中尝试：\n\n```c\n#include\
    \ <stdio.h>\nint main()\n{\nint a;\nprintf(\"Type an integer: \");\nscanf(\"%d\"\
    , &a);\nprintf(\"You typed %d.\\n\", a);\nif(a > 10)\n{\nprintf(\"%d is greater\
    \ than\\n\", a);\n}\nif(a < 10)\n{\nprintf(\"%d is lesser than\\n\", a);\n}\n\
    return(0);\n}\n```\n\n通过这段代码，我们可以看到有两个 if 比较语句紧挨着。它们各自都有自己的括号，并且将评估两个不同的条件；一个检查大于，另一个检查小于。花点时间构建并运行此代码。\n\
    \n运行代码后，你会看到根据输入的值，对于大于 10 或小于 10 的值，将显示必要的输出。请注意，使用此选项时，当你输入数字 10 时不会显示输出，只有当你输入大于\
    \ 10 或小于 10 的数字时才会显示。你可以在第 16 行将其改为“小于或等于 10”，以便更改此问题并在你使用数字 10 时获得输出。\n\n###\
    \ Else 语句\n\n虽然 if 语句可以帮助在 C 语言中添加一些比较，但你也可以使用 else 语句来帮助你。这些对于你想要创建的二选一决策非常有用。看看下面的代码，了解\
    \ else 语句如何在你的代码中工作：\n\n```c\n#include <stdio.h>\n\nint main()\n{\n    int a;\n\
    \n    printf(\"Type an integer: \");\n    scanf(\"%d\", &a);\n    printf(\"You\
    \ typed %d. \\n\", a);\n    if(a > 10)\n    {\n        printf(\"%d is greater\
    \ than \\n\", a);\n    }\n    else\n    {\n        printf(\"%d is less than or\
    \ equal to 10. \\n\", a);\n    }\n\n    return(0);\n}\n```\n\n上面的代码基本上是对我们之前使用的代码的重写，但我们添加了\
    \ else 语句。在第 10 行，我们使用了 if 条件来进行评估。如果该条件被评估为真，则该语句将被执行。如果条件被评估为假，则代码中 else 部分的语句将被执行。花点时间构建并运行此代码，并尝试几个输入以查看其工作原理。\n\
    \n请注意在这段代码中我没有使用分号，而是使用了大括号。你可以不使用括号将所有内容写出来，因为只有一个语句，但这是一种很好的写法，以确保所有内容保持在一起，并且是良好的编程实践。\n\
    \n### Else If 语句\n\n有时你会在代码中使用至少三个，如果不是更多的话，你想要使用的条件。在这些情况下，你需要比 if 和 else 语句稍微不同的东西。这时我们将使用\
    \ else if 语句的结构。让我们看看以下代码，了解 else if 语句的工作原理。\n\n```c\n#include <stdio.h>\n\n\
    int main()\n{\n    int a;\n\n    printf(\"Type an integer: \");\n    scanf(\"\
    %d\", &a);\n    printf(\"You typed %d. \\n\", a);\n    if(a > 10)\n    {\n   \
    \     printf(\"%d is greater than \\n\", a);\n    }\n    else if(a < 10)\n   \
    \ {\n        printf(\"%d is less than or equal to 10. \\n\", a);\n    }\n    else\n\
    \    {\n        printf(\"%d is 10, \\n\", a);\n    }\n    return(0);\n}\n```\n\
    \n使用此结构，你可以从第 10 行的 if 语句开始。如果此条件为真，则与其关联的语句将被执行。如果该语句被评估为假，它将继续到第 14 行检查的 else\
    \ if 语句。如果此条件最终被评估为真，则该语句将被执行，其余所有内容将被跳过。最后是 else 语句。如果上面两个条件都不满足，则执行此语句。\n\n\
    好的一点是你可以添加任意多个 else if 语句。这使得系统能够根据你设定的条件和用户输入到系统中的输入，更容易评估复杂情况。\n\n### Switch\
    \ 语句\n\n在 C 语言内部，你可以使用 if 和 else 条件来处理复杂的决策。你可以根据需要向系统添加任意多个这些条件来处理此问题，但代码中涉及的条件越多，代码可能变得越难看，写起来也越困难。不要处理这个问题，你可以使用\
    \ switch case 结构，它也可以帮助你在 C 语言中做出更多决策，而不会有所有混乱。让我们看看以下代码 to see\n"
