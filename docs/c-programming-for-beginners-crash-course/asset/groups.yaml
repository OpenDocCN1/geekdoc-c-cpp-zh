    # # Chapter 1: An Introduction to the C Programming Language


    When it comes to learning a new programming language, there may seem to be a lot
    of parts that you need to keep track of. You may worry as a beginner that it is
    too hard to put together a code on your own and that you need years of experience.
    Even if you have worked in coding in the past, you may worry about how difficult
    it will be to learn something new and how different it is from your chosen computer
    language. But coding can be simple to learn, even when you are brand new to the
    process.


    In this book, I am going to take some time to show you how to use the C programming
    languages, one of the best options out there for all the options and power that
    come with learning how to do your own coding. I will show you some of the jargon
    that comes with learning how to program and walk you through some of the steps
    that are needed to end this book with writing your own code.




    The C programming language started in 1972 with the help of Dennis Ritchie. At
    the time, Ritchie was a computer scientist at the AT&T Bell Laboratories and he
    needed to develop a few programs for his own personal use. He was trying to make
    the process of computing as simple as he could and he realized that many of the
    current languages were too complex for what he wanted and for what other people
    were able to use.


    The goal with this new language was to help create a programming language that
    was efficient, but also one that could help the community form a fellowship. They
    knew that to keep things working smoothly you couldn''t just have information
    put into the terminal of the code, but you needed to have some post programming
    communication there as well.


    The result of all this work was the C programming language. This is a language
    that is general purpose as well as structured and it is known as a procedural
    oriented programming language. It is not a language that is designed for a specific
    application, but it is well suited for those who need a scientific or business
    application. There are'
