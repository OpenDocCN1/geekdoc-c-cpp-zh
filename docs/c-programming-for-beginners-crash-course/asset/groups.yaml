  mdcn: "\n与使用 while 循环不同，for 循环只需一行就能完成，这确实让它用起来稍微隐晦一些，但它仍然是一种更流行、更传统的循环类型。一个很好的例子如下：\n\
    \n```c\n#include <stdio.h>\n\nint main()\n{\n    int x;\n\n    for (x = 0; x <\
    \ 10; x++)\n        printf(\"%d\\n\", x);\n\n    return(0);\n}\n```\n\n你看到的第一部分是初始化，即语句\
    \ x=0，这是在循环开始时进行的赋值。这段代码中的第二项是循环条件。循环会继续重复，直到该条件不再为真；在这个例子中，就是直到 x 等于 10。最后，你会注意到迭代语句。每当循环重复自身时，这个特定的语句都会被执行。\n\
    \n分号不会跟在 for 语句的圆括号后面，而是会跟在单个循环语句后面，也就是第 8 行花括号内的那条语句。花点时间构建并运行这段代码。按照现在的设置，代码会从\
    \ 0 开始一直到 9，然后一旦到 10 循环就会停止，因为此时条件不再为真。在这个程序中，除非你另行指定，否则程序会从 0 而不是 1 开始计数。\n\n\
    由于大多数时候你会希望从 1 开始计数，因为这是大多数人习惯的方式，你会转到第 8 行，把 x 改成 x+1。这不会改变 x 的值，但会影响输出结果。请务必保存、构建并运行这段代码，看看它会给你带来什么结果。\n\
    \n### 嵌套循环\n\nfor 循环对于清理一些代码编写工作真的很有帮助，而且在你处理所谓的嵌套循环时也能帮上忙。嵌套循环一开始听起来可能很复杂，但它比\
    \ while 循环更容易使用。让我们通过下面的代码来看看如何使用嵌套循环：\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n\
    #include <time.h>\n\nint main()\n{\n    int column, r;\n    srand((unsigned)time(NULL));\
    \       /*Seed Randomizer*/\n\n    for (column = 0; column < 10; column++)\n \
    \   {\n        r = rand();\n        printf(\"%2d\\t\", r % 100);\n    }\n    putchar('\\\
    n');\n\n    return(0);\n}\n```\n\n我上面放出的代码会输出十个随机选择的数字。花点时间构建并运行这段代码，然后你会看到输出中有一行十个随机选择的值。这些值之间的间距将通过使用我们在第\
    \ 14 行用到的 ‘\\t’ 字符来实现。\n\n这只是使用嵌套循环时所能做到的事情之一。你还可以用它来制作 1 到 100 或更多数字的网格，并在图表中加入各种你需要的不同项目。这比单独写出每个部分要快，而且完成后确实能做出不错的最终成果。\n\
    \n## 第 5 章：C 编程语言中的变量\n\n正如我之前稍微提到过的，变量将成为代码中不同数据类型的容器。变量，或者说容器，能够保存浮点值、字符、整数或其他值。在本章中，我将进一步解释变量，以及如何在\
    \ C 语言代码中使用它们，并说明它们如何工作。\n\n那么，如何区分变量和值呢？值几乎可以是代码中的任何东西，比如整数、字符，或代码中可以定义的其他东西。另一方面，变量将是把这些数据类型放在一起的容器。通常它们必须有某种东西把它们联系起来，但它们不必完全相同。例如，你可以有一个包含学校用品的变量，比如铅笔、钢笔、纸、粉笔、笔记本等等。这些东西在某个方面是相似的，放在一起也说得通，但它们并不完全相同。\n\
    \n当你在 C 语言中声明一个变量时，你会了解变量的类型和变量的名称。让我们先看看如何声明一个整数变量：\n\n```c\n#include <stdio.h>\n\
    \nint main()\n{\n    int a;\n\n    printf(\"The value of a is %d\\n\", a);\n\n\
    \    return(0);\n}\n```\n\n在这个例子中，整数变量类型是 \"int\"，它的名称是 a。上面代码中的变量从未被赋值，但即使从未给它赋值，你仍然可以在代码中使用它，就像第\
    \ 7 行所示那样。快速构建并运行这个程序。在你那边，可能会看到一个随机值出现。与你可能遇到的其他一些语言不同，C 语言不会在声明变量时初始化它们。在内部，程序会分配一块内存来存储该变量的信息。\n\
    \n在这种情况下，这块内存尚未被初始化，但也没有被设置为零。它只是被放在你内存中的某个位置。无论那里已经放了什么值，都会被变量立即接收，你会在屏幕上看到它作为输出。这背后的意思是，你需要在尝试使用变量之前先初始化它。解决这个问题的一个好方法是使用以下代码：\n\
    \n```c\n#include <stdio.h>\n\nint main()\n{\n    int a;\n\n    a = 65;\n\n   \
    \ printf(\"The value of a is %d\\n\", a);\n\n    return(0);\n}\n```\n\n保存这些更改，然后构建并运行程序。现在代码的输出更加可预测，因为你知道变量的值。\n\
    \n除了知道变量的名称和值之外，你还可以在这种语言中了解关于变量的其他一些信息。其中之一就是 sizeof 运算符。\n\n`sizeof` 是 C 语言中的关键字之一，但它也被视为运算符。sizeof\
    \ 关键字的作用是返回该变量使用了多少字节的存储空间。这似乎不太重要，但当你在使用 C 语言时，它会派上用场，有时你会需要知道这些信息。下面是一个如何在代码中使用\
    \ sizeof 关键字的示例：\n\n```c\n#include <stdio.h>\n\nint main()\n{\n    int a;\n\n\
    \    printf(\"An int variable occupies %lu bytes of storage\\n\", sizeof(a));\n\
    \n    return(0);\n}\n```\n\n在这个示例中，变量 a 没有被初始化，但由于它没有被使用，所以这不是大问题。sizeof 运算符出现在\
    \ printf 语句内部，它只是把变量 a 作为 int 变量进行求值，以返回计算机上占用了多少存储空间。你将得到的输出是一个长无符号整数值。你可以通过修改一些代码来反映这一点，从而改变你想获取的信息，比如查询一个字符会占用多少空间，而不仅仅是变量。\n\
    \n你还可以了解关于变量的另一件事，那就是内存位置。这会具体告诉你变量的数据位于哪里。要获取有关内存位置的信息，你需要使用和号运算符。下面是一个很好的代码示例，你可以用它来实现这一点：\n\
    \n```c\n#include <stdio.h>\n\nint main()\n{\n    int a;\n    char b;\n    float\
    \ c;\n\n    puts(\"memory location:\");\n    printf(\"A is at %p\\n\", &a);\n\
    \    printf(\"B is at %p\\n\", &b);\n    printf(\"C is at %p\\n\", &c);\n\n  \
    \  return(0);\n}\n```\n\n这段代码中声明了三个不同的变量：浮点值、字符和整数。这些变量在这段代码中没有被初始化，因为它们没有被使用，但程序仍然会在内存中的不同位置为它们分配一些空间。为了访问这些位置，需要在变量名前加上和号。你需要在\
    \ printf 语句中使用 %p 占位符，才能得到你想要的结果。\n\n你将收到的输出值会因所使用的机器而异。甚至格式也可能因所使用的操作系统而变化。计算机负责分配内存中的位置，这有时取决于你系统上可用的内存量，或者系统决定把它放在哪里。了解信息存储在计算机上的哪里，此时可能看起来有点微不足道，但它可以让你之后更容易找到东西并处理代码。\n\
    \n使用变量可以帮助你在代码中正确存储信息。你可以给变量赋予任何你想要的值，你只需要注意在编写的代码中初始化它，并确保它与变量中存储的所有其他数据类型相容。\n"
