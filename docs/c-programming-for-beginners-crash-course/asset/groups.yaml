  mdcn: "\n## 第 6 章：编写代码时函数的基础知识\n\n像许多其他编程语言一样，C 语言包含一个库。作为编程初学者，你会发现这个库是你最好的朋友。它让你能够浏览并找到代码中的一些函数，也就是代码的骨架，从而帮助你写出你希望发生的事。它可以向编译器发出命令，帮助你设置代码，还有更多功能。\n\
    \nC 语言库中有许多你可以使用的函数，这些函数将帮助你完成不少事情。话虽如此，它们并不能做所有事情，有时你需要在这种语言中自己编写一些函数。事实上，许多使用这种语言工作了一段时间的程序员已经创建了许多自己的函数，来帮助代码正常运行。\n\
    \n在本章中，我会花一些时间讨论函数，包括如何设置函数、如何为它编写原型、如何调用或访问你想要的任何函数，甚至如何在需要时提前退出函数。在 C 语言中，函数会有类型、名称，以及放在圆括号中的参数。名称将是唯一的，并应用于标识你正在使用的函数。参数是零个、一个或多个值，它们会被传入函数，也被称为输入。\n\
    \n下面我给出了 alpha 函数，它没有输入也没有输出；这在 C 语言中是合法的。这种类型将被称为 void 函数，如下所示：\n\n```\nvoid\
    \ alpha(void)\n```\n\nvoid 是变量类型，它基本上告诉编译器你没有变量类型。count 函数是整型函数，它负责生成或返回某种整数值。它需要比上面更多的输入，因此它没有任何参数。它看起来会是这样：\n\
    \n```\nint count(void)\n```\n\n你还可以对函数做的另一件事是 hangup 函数，它将不返回任何值，所以它也是一个 void\
    \ 函数。然而，这个函数略有不同，因为它确实接受单个字符作为输入，你可以选择将该字符作为参数。在 C 语言中，它将通过“ch”变量来引用。不过，在你能够使用函数之前，无论你使用哪种类型，都需要向编译器介绍它，并让编译器检查参数，以确保一切都使用正确。\n\
    \n当你想要调用函数时，你会通过名称调用它，然后使用圆括号。当函数被调用时，控制权会传递给该函数的语句。一旦函数全部结束，流程将继续执行函数调用之后的语句。让我们快速看看函数在代码中如何工作。下面的代码将包含两个函数来帮助说明这一点：\n\
    \n```\n#include <stdio.h>\n\nvoid blorf(void);\n\nint main()\n{\n    puts(\"the\
    \ main () function always runs first\");\n    blorf();\n    puts(\"thanks, blorf()\"\
    );\n\n    return(0);\n}\n```\n\nmain 函数同样是 C 语言中所有代码都需要的函数。你还会注意到有一个 blorf 函数，这对系统来说是新的。在第\
    \ 3 行，你正在为函数编写原型，并将函数参数和类型告知编译器。然后，编译器可以通过检查原型来确认你在代码中正确使用了该函数。而且由于原型是一条语句，它会像其他语句一样以分号结束。\n\
    \n然后我们继续看第 8 行，它将调用该函数。由于这个函数没有参数，圆括号将保持为空。函数本身直到第 14 行才会出现。这实际上是在重复原型，只是没有分号。属于这个特定函数的语句将位于花括号内。现在，花几分钟构建并运行这段代码，看看它是如何工作的。\n\
    \n现在假设你想再次调用该函数。这很简单，因为你只需要将第 8 行复制到第 9 行，它就会再次重复自身。因此，新代码看起来会是这样：\n\n```\n#include\
    \ <stdio.h>\n\nvoid blorf(void);\n\nint main()\n{\n    puts(\"the main () function\
    \ always runs first\");\n    blorf();\n    blorf();\n    puts(\"thanks, blorf()\"\
    );\n    return(0);\n}\n```\n\n当你再次保存并运行代码时，你会看到这段输出会出现两次。\n\n代码中的原型作用类似于函数的定义，基本上是在函数出现在代码中之前，向编译器描述它将如何被使用。有时你不需要指定原型；只有在你于使用函数之前写出函数时，这种做法才有效。下面是一个很好的例子：\n\
    \n```\n#include <stdio.h>\n\nvoid soup(void)\n{\n    puts(\"Pea green soup!\"\
    );\n}\n\nint main()\n{\n    printf(\"For breakfast I had\");\n    soup();\n  \
    \  printf(\"For lunch I had\");\n    soup();\n    return(0);\n}\n```\n\n在这段代码中，soup\
    \ 函数会出现在 main 函数之前。这只是因为编译器仍然会在函数内部看到它们，而 main 始终是程序中第一个被执行的函数。这个示例中缺少的是 soup\
    \ 函数的原型。也花点时间构建并运行这段代码。\n\n现在我将展示另一个你可以使用的示例，它允许你在需要时使用 return 关键字提前退出函数。当你处理循环或代码中其他持续进行、而你想提前停止的事情时，就可以使用它。查看第\
    \ 26 行的 return，了解它是如何工作的：\n\n```\n#include <stdio.h>\n\nvoid cheers(void);\n\n\
    int main()\n{\n    int x;\n    x=21;\n    puts(\"Everyone gets free dinner!\"\
    );\n    cheers();\n    puts(\"Everyone gets free dessert!\");\n    cheers();\n\
    \    printf(\"%d\\n\", x);\n    puts(\"Everyone pays higher taxes!\");\n    return(0);\n\
    }\n\nvoid cheers(void)\n{\n    int x;\n    for(x=0;x<3;x++)\n        printf(\"\
    Huzzah!\");\n    return;\n    putchar('\\n');\n}\n```\n\n在这个示例中，你不必指定值，因为 cheers\
    \ 函数被视为 void 函数，意味着它不会返回任何内容。在 main 函数中，第 17 行的 return 需要指定一个值，就像这个示例中那样，因为 main\
    \ 被视为 int 函数。保存这个示例的更改，然后构建并运行代码。\n\n这个示例的输出可能有点乱，因为你的 putchar 语句被跳过了。然而，由于紧挨在它上面的\
    \ return 语句，这段代码永远不会被执行。更常见的是看到函数基于条件提前返回，这通常会用循环或 if 语句来体现。否则，如果你看到 return 函数，这里就是函数退出的位置，控制权将回到调用该函数的地方。\n\
    \n在代码中使用函数的方式有很多。只要你正确定义它们，它们就能帮助编译器了解代码内部发生了什么；虽然 C 语言库中已经有许多可用函数，但你也有能力创建一些自己的函数。请记住，在这种语言中使用函数之前必须先定义它们，否则编译器会搞不清楚你想做什么，并且通常会发出错误消息。总的来说，这些函数让你在代码中能够创建的内容方面拥有很大的自由。\n\
    \n## 结论\n\n感谢你读到最后，完成《C 编程入门：速成课程——终极版》；希望它富有信息量，并能够为你提供实现目标所需的所有工具，无论你的目标是什么。\n\
    \n下一步是开始写出一些你自己的代码。你可以尝试本指南中提供的一些代码，或者使用我们讨论过的提示和技巧，来编写适合你自己需求的代码。\n\n作为初学者，你可能会担心编写代码过于复杂，但\
    \ C 编程语言让这件事真的很容易处理。它也是许多较新编程语言的基础，因此你可以使用这些技巧将它们整合起来，并在未来学习其他编程语言，这样入门就不必显得那么令人生畏。\n\
    \n在本指南中，你将了解 C 编程语言可以多么简单。我们将讨论这种语言的许多不同部分，包括 C 语言的历史、这种语言代码中的一些基础部分、如何在 C 语言中处理比较，甚至如何处理不同类型的循环以及更多内容。当你读完时，你将能够使用\
    \ C 语言创建一些基本代码，并且你会有信心继续工作并创建一些自己的程序。\n\n当你准备好进入编程世界，并想学习如何制作一些自己的代码和项目时，请翻阅本指南，了解\
    \ C 编程语言如何让这一切成为可能。\n\n最后，如果你觉得这本书在任何方面有用，我们始终感谢你在亚马逊上留下评论！\n"
