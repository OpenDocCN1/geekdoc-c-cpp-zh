  [14] 更多细微的扩展\n\n### 19.2.9 移除和弃用的特性\n\n世界上有数亿行 C++ 代码，没有人确切知道哪些特性正在使用。因此，ISO 委员会在移除旧特性时非常不情愿，且是在多年警告之后。然而，有时某些有问题的特性会被移除或*弃用*。\n\
  \n通过弃用某个特性，标准委员会表达了该特性消失的愿望。然而，委员会并没有权力立即移除一个频繁使用的特性——无论它是多么多余或危险。因此，弃用是避免该特性的强烈暗示。它在未来可能会消失。\n\
  \n- 移除 异常规范：`void f() throw(X,Y); // C++98; 现在是错误`\n- 移除 异常规范的支持设施，`unexpected_handler`、`set_unexpected()`、`get_unexpected()`\
  \ 和 `unexpected()`。相反使用 `noexcept` (§4.2)。\n- 移除 三元符（Trigraphs）。\n- 移除 `auto_ptr`。相反使用\
  \ `unique_ptr` (§15.2.1)。\n- 移除存储限定符 `register` 使用。\n- 移除对 `bool` 使用 `++` 操作。\n\n\
  \n\n\n\n*   已移除：C++98 的 `export` 特性。它非常复杂且主要供应商并未提供。相反，`export` 被用作模块的关键字（§3.2.2）。\n\
