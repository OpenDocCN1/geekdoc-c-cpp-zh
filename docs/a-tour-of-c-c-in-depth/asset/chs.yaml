  \ |\n| `<ranges>` | `sized_range`, `subrange`, `take()`, `split()`, `iterator_t`\
  \ | §14.1 |\n| `<regex>` | `regex`, `smatch` | §10.4 |\n| `<string>` | `string`,\
  \ `basic_string` | §10.2 |\n| `<string_view>` | `string_view` | §10.3 |\n| `<set>`\
  \ | `set`, `multiset` | §12.8 |\n| `<sstream>` | `istringstream`, `ostringstream`\
  \ | §11.7.3 |\n| `<stdexcept>` | `length_error`, `out_of_range`, `runtime_error`\
  \ | §4.2 |\n| `<tuple>` | `tuple`, `get<>()`, `tuple_size<>` | §15.3.4 |\n| `<thread>`\
  \ | `thread` | §18.2 |\n| `<unordered_map>` | `unordered_map`, `unordered_multimap`\
