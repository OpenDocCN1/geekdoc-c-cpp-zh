  [36] 在注释中说明意图；[CG: NL.2]。\n[37] 保持一致的缩进风格；[CG: NL.4]。\n\n# 2\n## 用户定义类型\n*不要恐慌！*\n\
  \n– Douglas Adams\n\n*   结构体\n*   类\n*   枚举\n*   联合体\n\n\n\n我们将从基本类型（§1.4）、`const`\
  \ 修饰符（§1.6）以及声明符操作符（§1.7）构建的类型称为*内置类型*。C++ 的内置类型和操作 set 非常丰富，但刻意保持低级性。它们直接且高效地反映了传统计算机硬件的能力。然而，它们并没有为程序员提供高级的设施来方便地编写高级应用程序。相反，C++\
  \ 使用一套复杂的*抽象机制*来增强内置类型和操作，程序员可以利用这些机制构建出此类高级设施。\nC++ 的抽象机制主要设计用于让程序员设计并实现自己具有适当表示和操作的类型，并让程序员能够简单、优雅地使用这些类型。使用\
  \ C++ 抽象机制由其他类型构建的类型称为*用户定义类型*。它们被称为*类*和*枚举*。用户定义类型既可以用内置类型构建，也可以用其他用户定义类型构建。本书的大部分内容致力于用户定义类型的设计、实现和使用。用户定义类型通常优于内置类型，因为它们更容易使用、更不容易出错，并且执行相应功能时，其效率通常与直接使用内置类型相当，甚至更高。\n\
  \n本章的其余部分介绍了定义和使用类型最简单、最基础的设施。第 4 章–8 章是对抽象机制及其支持的编程风格的更完整的描述。用户定义类型提供了标准库的骨架，因此标准库章节（9-17\
  \ 章）提供了如何使用第 1 章–8 章中介绍的语言设施和编程技术来构建内容的示例。\n\n\n构建新类型的第一步通常是将它需要的元素组织成一个数据结构，即 `struct`：\n\
  \n[](ch02_images.xhtml_f0022-01a)\n```\nstruct Vector {\n    double* elem;  // 指元素的指针\n\
  \    int sz;        // 元素的个数\n```\n\n这个 `Vector` 的第一个版本由一个 `int` 和一个 `double*` 组成。\n\
  \n\n```\nVector v;\n```\n然而，单靠它并没有什么用，因为 `v` 的 `elem` 指针没有指向任何地方。为了让它有用，我们必须给 `v`\
  \ 一些它可以指向的元素。例如：\n\n[](ch02_images.xhtml_f0022-02a)\n\nvoid vector_init(Vector&\
  \ v, int s)    // 初始化 Vector\n{\n    v.elem = new double[s];  // 分配一个包含 s 个 double\
  \ 的数组\n    v.sz = s;\n```\n\n也就是说，`v` 的 `elem` 成员获得了由 `new` 操作符产生的指针，而 `v` 的 `sz`\
  \ 成员获得了元素的个数。`Vector&` 中的 `&` 表示我们通过非 `const` 传递 `v`（§1.7）；这样，`vector_init()` 就可以修改传递它的\
  \ vector。\n\n\n`Vector` 的简单用法如下：\n\n[](ch02_images.xhtml_f0022-03a)\n```\ndouble\
  \ read_and_sum(int s)\n    // 从 cin 读取 s 个整数并返回它们的和；假设 s 为正数\n{\n    vector_init(v,s);\
  \     //为 v 分配 s 个元素\n\n    for (int i=0; i!=s; ++i)\n        cin>>v.elem[i];  \
  \ // 读取到元素中\n    double sum = 0;\n    for (int i=0; i!=s; ++i)\n        sum+=v.elem[i];\
  \   // 计算元素的和\n    return sum;\n```\n\n在我们的 `Vector` 变得像标准库 `vector` 一样优雅灵活之前，还有很长的路要走。特别是，`Vector`\
  \ 用户必须知道 `Vector` 表示的每一个细节。本章其余部分和后两章将作为语言特性和技术的示例，逐步改进 `Vector`。第 12 章介绍了标准库的 `vector`，它包含了很多改进。\n\
  \n\n*   说明语言特性和设计技术，以及\n*   帮助你学习和使用标准库组件。\n\n\n[](ch02_images.xhtml_f0024-01a)\n\
  \n```\npublic:\n    Vector(int s) :elem{new double[s]}, sz{s} { } // 构造 Vector\n\
  \    double& operator[](int i) { return elem[i]; } // 访问：下标\n    int size() { return\
  \ sz; }\n    double* elem; // 指元素的指针\n    int sz;        // 元素的个数\n};\n```\n\n\n\
  [](ch02_images.xhtml_f0024-04a)\n\ndouble read_and_sum(int s)\n{\n    Vector v(s);\
  \      // make a vector of s elements\n    for (int i=0; i!=v.size(); ++i)\n\n \
  \   double sum = 0;\n    for (int i=0; i!=v.size(); ++i)\n        sum+=v[i];   \
  \ // take the sum of the elements\n}\n```\n\n与类名同名的成员函数被称为*构造函数*（constructor），也就是说，用于*构造*类对象的函数。因此，构造函数\
  \ `Vector()` 替换了 §2.2 中的 `vector_init()`。与普通函数不同，构造函数保证用于初始化该类的对象。因此，定义构造函数可以消除该类中变量未初始化的问题。\n\
  `Vector(int)` 定义了 `Vector` 类型对象是如何构造的。特别是，它规定需要一个整数来执行此操作。该整数被用作元素的数量。构造函数使用成员初始化列表初始化\
  \ `Vector` 成员：\n\n```\n:elem{new double[s]}, sz{s}\n\n也就是说，我们首先使用从自由存储器（free store）获取的\
  \ s 个 `double` 类型元素的指针初始化 `elem`。然后，我们将 `sz` 初始化为 `s`。\n\n元素的访问通过下标函数提供，称为 `operator[]`。它返回指向适当元素的引用（`double&`\
  \ 允许读取和写入）。\n提供 `size()` 函数是为了向用户提供元素的数量。\n\n显然，这里完全缺失错误处理，但我们将在第 4 章中回到这个问题。同样，我们没有提供一种机制来“归还”通过\
  \ `new` 获取的 `double` 数组；§5.2.2 展示了如何定义析构函数来优雅地这一点。\n\n\n### 2.4 枚举\n\n除了类之外，C++\
  \ 还支持一种简单的用户定义类型，我们可以对它的值进行列举：\n[](ch02_images.xhtml_f0025-01a)\n\n```\nenum class\
  \ Color { red, blue, green };\n\nColor col = Color::red;\nTraffic_light light =\
  \ Traffic_light::red;\n```\n注意，枚举成员（例如 `red`）位于其 `enum class` 作用域内，因此它们可以在不同的 `enum\
  \ class` 中重复使用而不会混淆。例如，`Color::red` 是 `Color` 的 `red`，它与 `Traffic_light::red` 不同。\n\
  \n枚举用于表示整数值的小集合。它们使得代码更具可读性，并且比不使用这些符号化（且助记性的）枚举成员名称时，代码更不容易出错。\n\n\n[](ch02_images.xhtml_f0025-02a)\n\
  \n```\nColor y2 = Traffic_light::red;   // 错误：那个 red 不是 Color\nColor z3 = Color::red;\
  \           // OK\nauto x4 = Color::red;            // OK: Color::red 是一个 Color\n\
  ```\n同样，我们不能隐式地混合 `Color` 和整数值：\n\n[](ch02_images.xhtml_f0026-01a)\n\nint i = Color::red;\
  \    // 错误：Color::red 不是 int\nColor c = 2;           // 初始化错误：2 不是 Color\n```\n\n\
  \n[](ch02_images.xhtml_f0026-02a)\n\n```\nColor y {6};         // 也是 OK\n```\n\n\
  同样，我们可以显式将 `enum` 值转换为其底层类型：\n```\nint x = int(Color::red);\n```\n\n\n[](ch02_images.xhtml_f0026-03a)\n\
  \n```\n{\n    switch (t) {\n        case green: t = yellow; break;\n        case\
  \ yellow: t = red; break;\n    }\n}\n```\n\n\n保持 `type field`（有时称为 `discriminant`\
  \ 或 `tag`，此处为 `t`）与 `union` 中持有的类型之间的对应关系是非常出错的。为了避免错误，我们可以通过将 `union` 和类型字段封装在一个类中来强制这种对应关系，并仅通过正确使用\
  \ `union` 的成员函数来提供访问。在应用层面，依赖于此类 `tagged unions`（标记联合体）的抽象是常见且实用的。尽量减少使用“裸露”的 `union`。\n\
  \n标准库类型 `variant` 可用于消除大多数对 `union` 的直接使用。`variant` 存储一组可选类型中的一个值（§15.4.1）。例如，`variant<Node*,int>`\
  \ 可以持有 `Node*` 或 `int`。使用 `variant`，`Entry` 示例可以写成：\n[](ch02_images.xhtml_f0028-02a)\n\
  \n```\nstruct Entry {\n    variant<Node*,int> v;\n};\n\nvoid f(Entry* pe)\n    if\
  \ (holds_alternative<int>(pe->v))   // *pe 持有一个 int 吗？（见 §15.4.1）\n        cout\
  \ << get<int>(pe->v);         // 获取该 int\n    // ...\n}\n\n对于许多用途，使用 `variant` 比使用\
  \ `union` 更简单更安全。\n\n### 2.6 建议\n[1] 当内置类型过于低级时，优先使用定义良好的用户自定义类型， own 内置类型；§2.1。\n\
  \n[2] 将相关数据组织成结构体（`struct`）或类（`class`）；§2.2; [CG: C.1]。\n\n\n[4] `struct` 仅仅是一个成员默认为\
  \ `public` 的 `class`；§2.3。\n\n[5] 定义构造函数以保证并简化 `class` 的初始化；§2.3; [CG: C.2]。\n[6]\
  \ 使用枚举（enumerations）来表示命名常量集；§2.4; [CG: Enum.2]。\n\n[7] 优先使用 `class enum` 而非“普通”\
  \ `enum` 以减少意外；§2.4; [CG: Enum.3]。\n\n\n[9] 避免使用“裸露”的 `union`；将其封装在类中并配合类型字段；§2.5;\
  \ [CG: C.181]。\n\n[10] 优先使用 `std::variant` 而非“裸露 `union`”；§2.5。\n# 3\n\n## 模块化\n\
  \n\n*– 传统*\n\n*   引言\n    *   头文件; 模块\n*   命名空间\n*   函数参数与返回值\n    *   参数传递; 值返回;\
  \ 返回类型推导; 后缀返回类型; 结构化绑定\n\n### 3.1 引言\n\n一个 C++ 程序由许多独立开发的部分组成，例如函数（§1.2.1）、用户自定义类型（第\
  \ 2 章）、类层次结构（§5.5）以及模板（第 7 章）。管理这么多部分的关键在于清晰地定义这些部分之间的交互。第一步也是重要的一步是区分部分的接口和实现。在语言层面，C++\
  \ 通过声明表示接口。`声明` 指定了使用函数或类型所需的所有内容。例如：\n[](ch03_images.xhtml_f0029-01a)\n\n```\n\
  double sqrt(double);    // 平方函数接收一个 double 并返回一个 double\nclass Vector {    // 使用\
  \ Vector 所需的内容\npublic:\n    Vector(int s);\n    double& operator[](int i);\n\n\
  private:\n    double* elem;    // elem 指向一个 double 数组\n    int sz;\n```\n\n关键在于函数体（`definitions`）可以放在“别处”。例如，我们可能如下定义\
  \ `Vector`（§5.3）。头文件的使用将如下：\n\n\n```\ndouble sqrt(double); // 平方函数接收一个 double 并返回一个\
  \ double\n```\n（注：由于提供的文本包含大量重复和碎片化内容，已根据逻辑对其进行了整理和去重处理。）\n\n一个 C++ 程序由许多独立开发的部分组成，例如函数（§1.2.1）、用户自定义类型（第\
  \ 2 章）……（此处省略重复内容，直接呈现最终的 3.1 引言翻译及逻辑结构）。\n\n\nC++ 支持独立编译的概念。这可以通过两种方式实现：\n\n* \
  \  *头文件*（§3.2.1）\n\n头文件技术追溯到 C 的早期时代，并且仍然是最常用的方法。为了帮助编译器确保一致性，提供实现的 `.cpp` 文件将包含提供接口的\
  \ `.h` 文件。例如：\n\n```cpp\n```\n\n`user.cpp` 和 `Vector.cpp` 共享 `Vector.h` 中提供的 `Vector`\
  \ 接口信息，但这两个文件在其他方面是独立的，可以独立编译。模块的使用是 C++20 的新特性，并提供了巨大的优势。\n\n\n\n\n程序组织的最佳方法是将程序视为一组具有良好定义依赖关系的模块。头文件通过文件来表示这种模块化，然后通过独立编译来利用这种模块化。\n\
  一个独立编译的 `.cpp` 文件（包括它 `#include` 的 `.h` 文件）被称为*翻译单元*（translation unit）。一个程序可以由数千个翻译单元组成。\n\
  \n使用头文件和 `#include` 是模拟模块化的一种非常老的方法，具有显著的缺点：\n\n*   **顺序依赖**：如果我们在 `#include header2.h`\
  \ 之前 `#include header1.h`，那么 `header1.h` 中的声明和宏（§19.3.2.1）可能会影响 `header2.h` 中代码的含义。相反，如果你在\
  \ `#include header1.h` 之前 `#include header2.h`，那么可能是 `header2.h` 影响了 `header1.h`\
  \ 中的代码。\n*   **不一致性**：在一个文件中定义一个实体（如类型或函数），然后在另一个文件中以略微不同的方式定义它，可能会导致崩溃或微妙的错误。如果我们——无意或故意——在两个源文件中分别声明一个实体，而不是将其放在头文件中，或者通过不同头文件之间的顺序依赖，就会发生这种情况。\n\
  *   **传递性**：在头文件中表示声明所需的所有代码都必须存在于该头文件中。这导致了大量的代码膨胀，因为头文件 `#include` 其他头文件，从而导致头文件的使用者——无意或故意——变得依赖于这些实现细节。\n\
  \n\n### 3.2.2 模块\n\n在 C++20 中，我们终于有了语言支持的直接表示模块化的方法（§19.2.4）。考虑如何使用 `module` 来表达\
  \ §3.2 中的 `Vector` 和 `sqrt_sum()` 示例：\n[](ch03_images.xhtml_f0033-01a)\n\n```\n\
  export module Vector;    // 定义一个名为 \"Vector\" 的模块\nexport class Vector {\npublic:\n\
  \    Vector(int s);\n    double& operator[](int i);\nprivate:\n    double* elem;\
  \    // elem 指向一个 sz 个 double 的数组\n    int sz;\n};\nVector::Vector(int s)\n    :elem{new\
  \ double[s]}, sz{s}    // 初始化成员\n{\n}\ndouble& Vector::operator[](int i)\n{\n  \
  \  return elem[i];\n}\nint Vector::size()\n{\n    return sz;\n}\nexport bool operator==(const\
  \ Vector& v1, const Vector& v2)\n{\n    if (v1.size()v2.size())\n        return\
  \ false;\n        if (v1[i]!=v2[i])\n            return false;\n    return true;\n\
  }\n\n这定义了一个名为 `Vector` 的 `module`，它导出了 `Vector` 类、其所有的成员函数以及定义运算符 `==` 的非成员函数。\n\
  \n我们使用这个 `module` 的方式是在需要的地方对其 `import` 它。例如：\n[](ch03_images.xhtml_f0034-01a)\n\
  \n```\n// file user.cpp:\nimport Vector;    // 获取 Vector 的接口\n#include <cmath> \
  \ // 获取标准库数学函数接口，包括 sqrt()\n\ndouble sqrt_sum(Vector& v)\n    double sum = 0;\n\
  \    for (int i=0; i!=v.size(); ++i)\n        sum+=std::sqrt(v[i]);    // 平方根和\n\
  \    return sum;\n```\n\n我也可以 `import` 标准库的数学函数，但我使用了旧式的 `#include` 只是为了展示我们可以混合新旧技术。这种混合对于逐渐将旧代码从使用\
  \ `#include` 升级到使用 `import` 是关重要的。\n\n\n*   模块只编译一次（而不是在每个使用它的翻译单元中编译）。\n*   两个模块可以以任何顺序\
  \ `import` 而不改变它们的含义。\n*   如果你向一个模块 `import` 或 `#include` 某些内容，那么你模块的用户不会隐式地获得这些内容（且不会被其困扰）：`import`\
  \ 不是传递的。\n这对可维护性和编译时性能的影响可能是惊人的。例如，我测量过使用\n\n```\nimport std;\n\n编译“Hello, World!”程序的速度比使用\n\
  \n```\n```\n\n的版本快了 10 倍。\n\n\n\n\n访问另一个命名空间中的名称的最简单方法是用命名空间名称对其进行限定（例如，`std::cout`\
  \ 和 `My_code::main`）。“真正的 `main()`”定义在全局命名空间中，即不属于任何定义的命名空间、类或函数。\n如果反复限定名称变得很繁琐或分散注意力，我们可以通过*using-declaration*（using\
  \ 声明）将名称引入作用域：\n\n[](ch03_images.xhtml_f0036-02a)\n\nvoid my_code(vector<int>& x,\
  \ vector<int>& y)\n{\n    using std::swap;    // 让标准库的 swap 在本地可用\n    // ...\n\
  \    other::swap(x,y);   // 另一个 swap()\n    // ...\n}\n```\n`using`声明使得命名空间中的名称可以使用，就像它在出现的作用域中声明的一样。在\
  \ `using std::swap` 之后，就好像 `swap` 在 `my_code()` 中声明过一样。\n\n为了访问标准库命名空间中的所有名称，我们可以使用*using-directive*（using\
  \ 指令）：\n\nusing namespace std;\n```\n\n`using`指令使得来自指定命名空间的未限定名称在放置该指令的作用域中变得可访问。因此，在对\
  \ `std` 使用 `using` 指令后，我们可以直接写 `cout` 而不是 `std::cout`。例如，我们可以在简单的微的 `vector_printer`\
  \ 模块中避免重复的 `std::` 限定：\n[](ch03_images.xhtml_f0037-01a)\n\n```\nexport module vector_printer;\n\
  import std;\nusing namespace std;\n\nexport\nvoid print(vector<T>& v)    // 这是用户所看到的（唯一）函数\n\
  {\n    cout << \"{\\n\";\n    for (const T& val : v)\n    cout << '}';\n}\n```\n\
  \n\n通过使用 `using`指令，我们失去了选择性使用该命名空间中名称的能力，因此这种功能应谨慎使用，通常用于应用程序中无处不在的库（例如 `std`），或在对未使用\
  \ `namespace` 的应用程序进行过渡时使用。\n\n命名空间主要用于组织较大的程序组件，例如库。它们简化了由独立开发的部分组合程序。\n## 3.4\
  \ 函数参数和返回值\n\n从程序的一个部分向另一个部分传递信息的首要且推荐的方法是通过函数调用。执行任务所需的信息作为参数传递给函数，产生的结果作为返回值传回。例如：\n\
  \n\n```\nint sum(const vector<int>& v)\n{\n    for (const int i : v)\n        s\
  \ += i;\n    return s;\n}\nvector fib = {1, 2, 3, 5, 8, 13, 21};\n\nint x = sum(fib);\
  \    // x 变为 53\n```\n还有其他路径可以在函数之间传递信息，例如全局变量（§1.5)）和类对象的共享状态（第 5 章）。强烈不建议使用全局变量，它是已知的错误来源，且状态通常只在共同实现定义良好的抽象的函数之间共享（例如，类的成员函数；§2.3）。\n\
  \n鉴于向函数和从函数传递信息的重要性，有多种方法这样做并不意外。关键关注点是：\n\n*   如果对象是共享的，它是可变的吗？\n*   对象是否被移动，从而留下一个“空对象”（§6.2.2）？\n\
  \n参数传递和值返回默认行为都是“制作拷贝”（§1.9），但许多拷贝可以隐式地优化为移动。\n在 `sum()` 示例中，生成的 `int` 被从 `sum()`\
  \ 拷贝，但将可能巨大的 `vector` 拷贝到 `sum()` 是低效且无意义的，因此参数通过引用传递（由 `&` 表示；§1.7）。\n\n`sum()`\
  \ 没有理由修改其参数。这种不可变性通过将 `vector` 参数声明为 `const` 来指示（§1.6），因此 `vector` 通过 `const` 引用传递。\n\
  \n\n首先考虑如何将值传入函数。默认情况下，我们进行拷贝（按值传递），如果我们想引用调用者环境中的对象，则使用引用（按引用传递）。例如：\n\n[](ch03_images.xhtml_f0038-01a)\n\
  ```\nvoid test(vector<int> v, vector<int>& rv)    // v 按值传递；rv 按引用传递\n{\n    v 是按值传递的；rv\
  \ 是按引用传递的\n\nint main()\n{\n    vector fib = {1, 2, 3, 5, 8, 13, 21};\n    test(fib,\
  \ rv);\n}\n```\n*(等一下，让我根据提供的源文本重新格式化代码块)*\n```\nvoid test(vector<int> v, vector<int>&\
  \ rv)    // v 是按值传递；rv 是按引用传递\n{\n    v 是按值传递的；rv 是按引用传递的\n```\n*(实际上，源文本的块结构略有不同，我将遵循提供的文本并应用规则：)*\n\
  \n```\n{\n    v 是按值传递的；rv 是按引用传递的\n}\n```\n\n```\nvoid test(vector<int> v, vector<int>&\
  \ rv)    // v 是按值传递；rv 是按引用传递\n{\n}\n```\n\n\n即使在现代硬件上，一个 `Matrix` 也可能非常大且拷贝起来代价非常昂贵。因此，我们不进行拷贝，而是为\
  \ `Matrix` 提供一个移动构造函数 (§6.2.2)，它可以非常廉价地将 `Matrix` 从 `operator+()` 中移动出来。即使我们没有定义移动构造函数，编译器通常也能能够优化掉拷贝（消除拷贝），并在需要的地方恰好构造\
  \ `Matrix`。这被称为拷贝消除（copy elision）。\n\n我们不应该退回到使用手动的内存管理：\n\nMatrix* add(const Matrix&\
  \ x, const Matrix& y)    // 复杂且容易出错的 20 世纪风格\n{\n    Matrix* p = new Matrix;\n \
  \   // ... 对于所有的 *p[i,j], *p[i,j] = x[i,j]+y[i,j] ...\n}\n\nMatrix m1, m2;\n// ...\n\
  // ...\ndelete m3;    // 容易被忘记\n```\n\n\n如果一个函数无法完成其所需的任务，它可以抛出一个异常 (§4.2)。这可以帮助避免代码中充斥着“异常问题”的错误码检测测试。\n\
  \n### 3.4.3 返回类型推导\n函数的返回类型可以从其返回值推导出来。例如：\n\n```\nauto mul(int i, double d) { return\
  \ i*d; }    // 这里，“auto\" 意味着“推导返回类型”\n\n这可以非常方便，特别是对于泛型函数 (§7.3.1) 和 lambda 表达式\
  \ (§7.3.3)，但应该谨慎使用，因为推导出的类型不提供稳定的接口：函数（或 lambda）的实现改变可能会改变它的类型。\n\n### 3.4.4 后缀返回类型\n\
  为什么返回类型出现在函数名和参数之前？这很大程度上出于历史原因。那是 Fortran、C 和 Simula 采用的方式（而且现在仍然这样做）。然而，有时我们需要查看参数来确定结果的类型。返回类型推导是其中一个例子，但不是唯一一个。在本书范围之外的示例中，这个问题与命名空间\
  \ (§3.3)、lambda 表达式 (§7.3.3) 和概念 (§8.2) 相关出现。因此，当我们想要显式指定返回类型时，允许参数列表之后添加返回类型。这使得\
  \ `auto` 意味着“返回类型将在稍后提到或被推导”。例如：\n\n```\nauto mul(int i, double d) -> double { return\
  \ i*d; }    // 返回类型是 \"double\"\n\n与变量 (§1.4.2) 一样，我们可以使用这种记法来更整齐地排列名称。将这种后缀返回类型的使用与\
  \ (§1.3) 中的版本对比：\n\n```\nauto exit(int) -> void;\nauto sqrt(double) -> double;\n\
  ```\n\n\n### 3.4.5 结构化绑定\n\n函数只能返回一个值，但该值可以是具有许多成员的类对象。这允许我们优雅地返回多个值。例如：\n```\n\
  struct Entry {\n    string name;\n    int value;\n\nEntry read_entry(istream& is)\
  \    // 原始的读取函数（更好的版本，请见 §11.5）\n{\n    string s;\n    is >> s >> i;\n    return\
  \ {s,i};\n}\n\n\ncout << \"{ \" << e.name << \" , \" << e.value << \" }\\n\";\n\
  ```\n\n\n```\nauto [n,v] = read_entry(is);\ncout << \"{ \" << n << \" , \" << v\
  \ << \" }\\n\";\n\n`auto [n,v]` 声明了两个局部变量 `n` 和 `v`，它们的类型从 `read_entry()` 的返回类型推导而来。这种为类对象的成员赋予局部名称的机制被称为结构化绑定。考虑另一个例子：\n\
  \n```\n// ... 填充 m ...\nfor (const [key,value] : m)\n    cout << \"{\" << key <<\
  \ \",\" << value << \"}\";\n```\n像往常一样，我们可以用 `const` 和 `&` 装饰 `auto`。例如：\n\n```\n\
  void incr(map<string,int>& m)    // ...\n\n\n\n错误处理是一个庞大且复杂的话题，其关注点的影响远超语言本身，涉及到编程技术和工具。然而，C++\
  \ 确实了一些功能来帮助。主要的工具是类型系统本身。我们与其从内置类型（例如 `char`、`int` 和 `double`）和语句（例如 `if`、`while`\
  \ 和 `for`）费力地构建应用程序，不如构建适用于我们应用程序的类型（例如 `string`、`map` 和 `thread`）和算法（例如 `sort()`、`find_if()`\
  \ 和 `draw_all()`）。这种更高级层次的构造简化了我们的编程，限制了我们犯错的机会（例如，你不太可能尝试对对话框应用树遍历），并增加了编译器捕捉错误的几率。C++\
  \ 语言的大部分构造都用于设计和实现优雅且高效的抽象（例如用户自定义类型以及使用这些类型的算法）。使用此类抽象的一个效果是，检测运行时错误的地方与处理该错误的地方隔离开来。随着程序的增长，特别是当大量使用库时，处理错误的标准变得至关重要。在程序开发早期确定错误处理策略是一个好主意。\n\
  ## 4.2 异常\n\n再次考虑 `Vector` 示例。当我们尝试访问超出 §2.3 中 vector 范围的元素时，*应该*做什么？\n\n*   `Vector`\
  \ 的用户无法一致地检测到该问题（如果用户能一致地检测到，越界访问根本就不会发生）。\n\n假设越界访问是我们想要恢复的错误，那么解决方案是让 `Vector`\
  \ 的实现者检测到尝试的越界访问并通知用户。用户随后可以采取适当行动。例如，`Vector::operator[]()` 可以检测尝试的越界访问并抛出一个 `out_of_range`\
  \ 异常：\n\n\n```\ndouble& Vector::operator[](int i)\n{\n        throw out_of_range{\"\
  Vector::operator[]\"};\n    return elem[i];\n}\n```\n`throw` 将控制权转移给直接或间接调用 `Vector::operator[]()`\
  \ 的某个函数中处理 `out_of_range` 类型异常的处理器。为了实现这一点，实现将根据需要*回溯*函数调用栈，以返回该调用者的上下文。也就是说，异常处理机制将根据需要退出作用域和函数，直到返回一个表示感兴趣处理此类异常的调用者，并在此根据需要调用析构函数（§5.2.2）。例如：\n\
  \n[](ch04_images.xhtml_f0044-02a)\n\nvoid f(Vector& v)\n{\n    // ...\n    try {\
  \    // 此块中抛出的 out_of_range 异常将由下面定义的处理器处理\n        Vector v2 = compute2(v);   \
  \ // 可能会尝试访问 v 结尾之外\n        compute3(v2);   // 可能会尝试访问 v2 结尾之外\n    }\n    catch\
  \ (const out_of_range& err) {    // 哎：out_of_range 错误\n        cerr << err.what()\
  \ << '\\n';\n    }\n    // ...\n}\n\n我们将我们感兴趣处理异常的代码放入 `try` 块中。对 `compute1()`、`compute2()`\
  \ 和 `compute3()` 的调用代表了无法预先简单确定是否会发生范围错误的代码。提供 `catch` 子句是为了处理 `out_of_range` 类型的异常。如果\
  \ `f()` 不是处理此类异常的好地方，我们本不会使用 `try` 块，而是让异常隐式地传递给 `f()` 的调用者。\n\n`out_of_range` 类型定义在标准库（在\
  \ `<stdexcept>` 中）中，实际上它被某些标准库容器访问函数使用。\n我通过引用捕获异常以避免拷贝，并使用 `what()` 函数打印在 `throw`\
  \ 点存入的错误信息。\n\n异常处理机制的使用可以使错误处理更简单、系统化且更具可读性。为了实现这一点，不要过度使用 `try` 语句。在许多程序中，`throw`\
  \ 和能够合理处理所抛出异常的函数之间通常有几十次函数调用。因此，大多数函数应该只需允许异常沿调用栈向上传播。使错误处理简单且系统化的主要技术（称为*资源获取即初始化；RAII*）在\
  \ §5.2.2 中进行了解释。RAII 的基本思想是让构造函数获取类运行所需的全部资源，并让析构函数释放所有资源，从而确保资源释放的保证性和隐式性。\n\n\n\
  `operator[]` 在 `Vector` 类型的对象上操作，除非 `Vector` 成员具有“合理”的值，否则它的任何操作都是意义的。特别是，我们说 `elem`\
  \ 指向一个包含 `sz` 个 double 的数组，但这只是在注释中说的。这种对类假设真实的陈述被称为*类不变性*，或简单的*不变性*。构造函数的任务是为该类建立不变性（以便成员函数可以依赖它），而成员函数退出时要确保不变性仍然。遗憾的是，我们的\
  \ `Vector` 构造函数只完成了部分工作。它正确地初始化了 `Vector` 成员，但未能检查传递给它的参数是否合理。考虑：\n\n```cpp\n```\n\
  \n这可能会导致混乱。\n\n\n[](ch04_images.xhtml_f0045-01a)\n\n```cpp\n{\n    if (s<0)\n  \
  \      throw length_error{\"Vector constructor: negative size\"};\n    elem = new\
  \ double[s];\n}\n```\n\n我使用标准库异常 `length_error` 来报告负数量元素，因为某些标准库操作使用该异常来报告此类问题。如果运算符\
  \ `new` 找不到分配内存，它会抛出 `std::bad_alloc`。现在我们可以：\n[](ch04_images.xhtml_f0046-01a)\n\
  \n```cpp\nvoid test(int n)\n    try {\n        Vector v(n);\n    }\n    catch (std::length_error&\
  \ err) {\n    }\n    catch (std::bad_alloc& err) {\n        // ... 处理内存耗尽 ...\n\
  \    }\n\nvoid run()\n{\n    test(-27);   // 抛出 length_error (-27 太小)\n    test(10);\
  \    // 可能正常\n}\n```\n\n\n如果你请求的内存超过了机器提供的内存，或者你的程序已经消耗了几乎所有的内存，而你的请求使其超过了限制，就会发生内存耗尽。注意，现代操作系统通常提供的空间会比物理内存一次能容纳的要多，因此请求过多内存可能会在触发\
  \ `bad_alloc` 之前就导致严重的变慢。\n\n你可以定义自己的类作为异常，并让它们从检测到错误点到可以处理点之间携带你需要的少量或大量信息（§4.2）。这并不需要使用标准库的异常层次结构。\n\
  通常情况下，函数在抛出异常后没有方法完成其分配的任务。此时，“处理”异常意味着进行最少的局部清理并重新抛出异常。例如：\n\n```\nvoid test(int\
  \ n)\n    try {\n        Vector v(n);\n    }\n    catch (std::length_error&) { \
  \   // do something and rethrow\n        throw;    // rethrow\n    }\n    catch\
  \ (std::bad_alloc&) {    // ouch! this program is not designed to handle memory\
  \ exhaustion\n        std::terminate();    // terminate the program\n}\n```\n\n\
  在设计良好的代码中，`try`-块是很少的。通过系统地使用 RAII 技术避免过度使用（§5.2.2, §6.3）。\n不变式（invariants）的概念是类设计的的核心，而前置条件（preconditions）在函数设计中起着类似的作用：\n\
  \n* 制定不变式有助于我们精确理解我们想要什么。\n* 不变式强制我们变得具体；这使我们有更大的机会编写正确的代码。\n不变式的概念是 C++ 资源管理概念的基础，这些由构造函数（第\
  \ 5 章）和析构函数（§5.2.2, §15.2.1）支持。\n\n### 4.4 错误处理的替代方案\n\n\n在某些语言中，异常的设计仅仅是为了提供一种返回值的替代机制。C++\
  \ 并不是这种语言：异常的设计是为了用于报告完成给定任务的失败。异常与构造函数和析构函数集成，为错误处理和资源管理提供了一个一致的框架（§5.2.2, §6.3）。编译器经过优化，使得返回一个值比将相同的值作为异常抛出要便宜得多。\n\
  \n抛出异常不是报告无法在本地处理的错误的唯一方法。函数可以通过以下方式指示其无法执行分配的任务：\n* 抛出异常\n* 以某种方式返回一个指示失败的值\n*\
  \ 终止程序（通过调用如 `terminate()`、`exit()` 或 `abort()` 等函数（§16.8））\n\n\n* 失败是正常且符合预期的。例如，打开文件的请求失败是非常正常的（可能没有该名称的文件，或者无法按照请求的权限打开文件）。\n\
  * 直接调用者可以合理地预期处理该失败。\n* 错误发生在一组并行任务中的某一个，我们需要知道是哪个任务失败了。\n\n当以下发生时，我们抛出异常：\n\n*\
  \ 错误极其罕见，以程序员可能会忘记检查它。例如，你上次检查 `printf()` 的返回值是什么时候？\n* 应用程序的低层模块可以添加新类型的错误，使得高层模块不需要编写来应对此类错误。例如，当以前的单线程应用程序修改为使用多线程，或者资源被放置在远程以便通过网络访问时。\n\
  * 没有可用的错误代码返回路径。例如，构造函数没有返回值供“调用者”检查。特别是，构造函数可能会为几个局部变量或在一个部分构造的复杂对象被调用，因此基于错误代码的清理将非常复杂。同样，运算符通常没有明显的错误代码返回路径。例如，`a*b+c/d`。\n\
  * 由于需要同时返回值和错误指示器（例如 `pair`；15.3.3），导致函数的返回路径变得更加复杂或昂贵，可能导致使用输出参数、非局部错误状态或其他变通方法。\n\
  * 从错误的恢复取决于多个函数调的结果，导致需要在复杂的控制结构之间维护局部状态。\n* 错误意味着需要某些“撤销操作”（§5.2.2）。\n\n当以下发生时，我们终止程序：\n\
  \n* 系统是一种一旦检测到平凡错误就基于重启线程、进程或计算机的系统。\n\n确保终止的一种方法是对函数添加 `noexcept` (§4.5.3)，这样函数实现中的任何地方\
  \ `throw` 都会转换为 `terminate()`。注意，某些应用程序无法接受无条件终止，因此必须使用替代方案。通用库永远不应该终止。\n\n\n\n\
  目前，我们不得不依赖于特设机制（ad hoc mechanisms）。有很多这样的机制。它们需要是灵活的、通用的，并且在未启用时不产生开销。这意味着概念上要简单，实现上要复杂。这里有一个我使用过的一种方案：\n\
  \n\n```cpp\nenum class Error_action { ignore, throwing, terminating, logging };\
  \    // 错误处理方案\n\n\nenum class Error_code { range_error, length_error };    // 具体错误\n\
  \nstring error_code_name[] { \"range error\", \"length error\" };    // 具体错误的名称\n\
  template<Error_action action = default_Error_action, class C>\nconstexpr void expect(C\
  \ cond, Error_code x)    // 如果预期条件 \"cond\" 不成立，则采取 \"action\"\n{\n    if constexpr\
  \ (action == Error_action::logging)\n                               << int(x) \n\
  \                               << '' \n                               << error_code_name[int(x)]\
  \ \n                               << '\\n';\n        if (!cond()) throw x;\n  \
  \  if constexpr (action == Error_action::terminating)\n        if (!cond()) terminate();\n\
  \    // 或者不采取动作\n```\n\n初看看这可能令人困惑，因为使用的许多语言特性尚未介绍。然而，正如要求的，它既非常灵活又易于使用。例如：\n\n\n\
  ```cpp\ndouble& Vector::operator[](int i)\n{\n           Error_code::range_error);\n\
  \    return elem[i];\n}\n```\n这会检查下标是否在范围内，如果不在，则采取默认动作（抛出异常）。预期的成立条件 `0 <= i &&\
  \ i < size()` 被作为一个 lambda 表达式传递给 `expect()`：`[i,this]{return 0 <= i && i < size();}`\
  \ (§7.3.3)。`if constexpr` 测试在编译时完成 (§7.4.3)，因此对于每次调用 `expect()` 最多执行一次运行时测试。将 `action`\
  \ 设置为 `Error_action::ignore` 则不采取任何动作，且不会为 `expect()` 生成任何代码。\n\n通过设置 `default_Error_action`，用户可以选择适用于程序特定部署的动作，例如\
  \ `terminating` 或 `logging`。为了支持日志记录，需要定义一个 `error_code_name` 表。可以通过 `source_location`\
  \ (§16.5) 来改进日志信息。\n\n\n### 4.5.1 `assert()`\n\n标准库提供了调试宏 `assert()`，用于断言某个条件在运行时必须成立。例如：\n\
  [](ch04_images.xhtml_f0049-03a)\n\n```cpp\nvoid f(const char* p)\n    assert(p!=nullptr);\
  \    // p 不能为 nullptr\n    // ...\n}\n```\n如果 `assert()` 的条件在“调试模式”下失败，程序将终止。如果不在调试模式，则\
  \ `assert()` 不会被检查。这相当粗糙且不灵活，但通常比没有要好。\n\n### 4.5.2 静态断言（Static Assertions）\n\n\n\
  [](ch04_images.xhtml_f0050-01a)\n\n```cpp\n```\n\n如果 `4<=sizeof(int)` 不成立，它将写入 `integers\
  \ are too small`；也就是说，如果此系统上的 `int` 至少有 4 个字节。我们将这种关于期望的语句称为*断言*（assertions）。\n\n\
  \n[](ch04_images.xhtml_f0050-02a)\n\n```cpp\n\nvoid f(double speed)\n{\n    constexpr\
  \ double local_max = 160.0/(60*60);        // 160 km/h == 160.0/(60*60) km/s\n \
  \   static_assert(speed < C,\"can't go that fast\");     // 错误：speed 必须\n    static_assert(local_max\
  \ < C,\"can't go that fast\"); // OK\n\n    // ...\n```\n\n通常情况下，如果 `A` 为假，`static_assert(A,S)`\
  \ 会打印 `S`。`static_assert` 的一个重要用法是关于类型进行断言 (§8.2)。\n\n\n不应抛出异常的函数可以声明为 `noexcept`。例如：\n\
  \n[](ch04_images.xhtml_f0050-04a)\n```cpp\nvoid user(int sz) noexcept\n{\n    Vector\
  \ v(sz);\n```\n\n如果 `noexcept` 函数调用了抛出异常的函数，将立即调用 `std::terminate()`。随意使用 `noexcept`\
  \ 是危险的。与其他强大特性一样，应该在理解的基础上应用它。\n\n\n1. 抛出异常以表示无法执行任务 (§4.4)。\n2. 仅用于异常处理 (§4.4)。\n\
  3. 打开文件或迭代结束是预期事件，而非异常情况 (§4.4)。\n5. 对于预期跨越多次函数调用的错误，抛出异常简体 4.4)。\n6. 如果不确定是使用异常还是错误代码，优先选择异常简体\
  \ 4.4)。\n7. 在设计早期制定错误处理策略简体 4.4)。\n8. 使用专门设计的用户定义类型作为异常（而不是内置类型）简体 4.2)。\n10. 你不必使用标准库的异常层次结构简体\
  \ 4.3)。\n11. 优先使用 RAII 而不是显式的 `try`-块简体 4.2, §4.3)。\n12. 让构造函数建立不变性，如果无法建立则抛出异常简体\
  \ 4.3)。\n13. 围绕不变性设计你的错误处理策略简体 4.3)。\n15. 使用断言机制为失败的含义提供单一的控制点简体 4.5)。\n\n\n\n\n\
  [16] 概念 (§8.2) 是编译时谓词，因此在断言中通常有用；§4.5.2。\n\n[17] 如果你的函数可能不会抛出异常，将其声明为 `noexcept`；§4.4;\
  \ [CG: E.12]。\n[18] 不要盲目地应用 `noexcept`；§4.5.3。\n\n# 5 类\n\n\n*– Doug McIlroy*\n\n\
  * 介绍\n* 具体类型\n    算术类型; 容器; 初始化容器\n* 抽象类型\n* 虚拟函数\n    层次体系的益处; 层级导航; 避免资源泄漏\n*\
  \ 建议\n\n## 5.1 介绍\n本章及接下来的三章旨在让你对 C++ 的抽象和资源管理支持有一个了解，而不涉及过多细节：\n\n* 本章非正式地介绍了定义和使用新类型（*用户定义类型*）的方法。特别是，它展示了用于*具体类*、*抽象类*和*类层次结构*的各种属性、实现技术和语言设施。\n\
  \n\n* 第 7 章 引入了模板，作为使用其他类型和算法对类型及算法参数化的机制。对用户定义类型和内置类型的计算表示为函数，有时泛化为*函数模板*和*函数对象*。\n\
  \n* 第 8 章 概述了泛型编程的基础概念、技术和语言特性。重点是使用*概念*来精确指定模板的接口并指导设计。引入了*变长模板*以指定最通用、最灵活的接口。\n\
  这些语言设施是支持被称为*面向对象编程*和*泛型编程*的风格的基础。第 9 章–第 18 章 随后介绍了标准库设施的示例及其用法。\n\n### 5.1.1 类\n\
  \n\n从根本上说，基本类型、运算符和语句之外的所有语言设施都是为了帮助定义更好的类或更方便地使用类。我所说的“更好”，是指更正确、更易维护、更高效、更优雅、更易用、更易读且更容易推理。大多数编程技术都依赖于特定类的设计和实现。程序员的英雄主义和品味迥异。因此，对类的支持是非常广泛的。在这里，我们考虑对三类重要类的基本支持：\n\
  \n* 具体类 (§5.2)\n* 类层次结构中的类 (§5.5)\n\n数量大量的有用类结果证明是这三类中的一种。更多的类可以被视为这些类的简单变体，或者通过使用这些类技术的组合来实现的。\n\
  \n\n*具体类*的基本思想是它们的行为“就像内置类型一样”。例如，复数类型和无限精度整数与内置的 `int` 非常相似，当然，它们有自己的语义和一组操作。同样，`vector`\
  \ 和 `string` 与内置数组非常相似，但它们更灵活，行为也更好 (§10.2, §11.3)。\n\n具体类型的定义特征是其表示形式是其定义的一部分。在许多重要情况下（如\
  \ `vector`），该表示位于栈上。因此，如果表示形式发生任何重大变化，用户必须重新编译。对于不经常改变且局部变量可以提供清晰度和效率的类型，这是可以的且是理想的。为了增加灵活性，具体类型可以将大部分表示放在自由存储器（动态内存、堆）中，并通过类对象访问它们。这就是\
  \ `vector` 和 `string` 的实现方式；它们可以被视为具有精心接口资源句柄。\n### 5.2.1 算术类型\n\n“经典的用户定义算术类型”是\
  \ `complex`：\n\n\n```cpp\nclass complex {\n    double re, im;    // 表示：两个浮点数\n \
  \   complex(double r, double i) :re{r}, im{i} {}    // 从两个标量构造复数\n    complex(double\
  \ r) :re{r}, im{0} {}              // 从一个标量构造复数\n    complex() :re{0}, im{0} {}\
  \                      // 默认复数：{0,0}\n    complex(complex z) :re{z.re}, im{z.im}\
  \ {}       // 拷贝构造函数\n    double real() const { return re; }\n    void real(double\
  \ d) { re=d; }\n    double imag() const { return im; }\n    void imag(double d)\
  \ { im=d; }\n    complex& operator+=(complex z)\n    {\n        re+=z.re;    //\
  \ 加到 re 和 im\n        im+=z.im;\n    }\n\n    complex& operator-=(complex z)\n \
  \   {\n        im-=z.im;\n        return *this;\n    }\n\n    complex& operator/=(complex);\
  \    // 在某处类外定义\n};\n```\n\n\n\n\n这是标准库 `complex` (§17.4) 的简化版本。该类的定义本身只包含需要访问表示的操作。该表示是简单且符合常规的。出于实际考虑，它必须与\
  \ 60 年前 Fortran 提供的的内容兼容，并且我们需要一组常规的运算符。除了逻辑需求外，`complex` 必须是高效的，否则它将无人使用。这意味着简单的操作必须是内联（inlined）。也就是说，简单操作（如构造函数、`+=`\
  \ 和 `imag()`）在生成的机器代码中必须在没有函数调用的情况下实现。类中定义的函数默认是内联的。可以通过在函数声明前加上关键字 `inline` 来显式请求内联。一个工业级的\
  \ `complex`（如标准库中的一个）经过了精心实现，以执行适当的内联。此外，标准库的 `complex` 将此处所示函数声明为 `constexpr`，以便我们可以在编译时进行复数算术。\n\
  ### 拷贝赋值与拷贝初始化\n\n拷贝赋值和拷贝初始化是隐式定义的 (§6.2)。\n\n\n返回实部和虚部的函数上的 `const` 修饰符表示这些函数不会修改被调用的对象。`const`\
  \ 成员函数可以被 `const` 和非 `const` 对象调用，但非 `const` 成员函数只能被非 `const` 对象调用。例如：\n\n```cpp\n\
  const complex cz {1,3};\nz = cz;    // 允许: 赋值给非 const 变量\ncz = z;    // 错误: 赋值给\
  \ const\ndouble x = z.real();    // OK: complex::real() 是 const\n\n### 重载运算符\n\n\
  许多有用操作不需要直接访问 `complex` 的表示，因此它们可以与类定义分开定义：\n```cpp\ncomplex operator+(complex a,\
  \ complex b) { return a+=b; }\ncomplex operator-(complex a, complex b) { return\
  \ a-=b; }\ncomplex operator-(complex a) { return {-a.real(), -a.imag()};    // 一元负号\n\
  complex operator/(complex a, complex b) { return a/=b; }\n```\n\n在这里，我利用了按值传递参数会被拷贝的这一事实，这样我就可以修改参数而不影响调用者的拷贝，并将结果作为返回值。\n\
  `==` 和 `!=` 的定义是简单的：\n\n```cpp\nbool operator==(complex a, complex b) { return a.real()==b.real()\
  \ && a.imag()==b.imag(); }    // 相等\n```\n\n`complex` 类可以像这样使用：\n\nvoid f(complex\
  \ z)\n{\n    complex a {2.3};    // 从 2.3 构造 {2.3,0.0}\n    complex b {1/a};\n \
  \   if (c != b)\n        c = -(b/a)+2*b;\n}\n```\n编译器将涉及复数的运算符转换为适当的函数调用。例如，`c!=b`\
  \ 意味着 `operator!=(c,b)`，而 `1/a` 意味着 `operator/(complex{1},a)`。\n\n自定义运算符（“重载运算符”）应该谨慎且按照惯例使用\
  \ (§6.4)）。语法由语言固定，因此你不能定义一元 `/`。此外，无法更改内置类型运算符的含义，因此你不能重定义 `+` 来相减 `int`。\n\n\n\
  *容器*是一个持有元素集合的对象。我们称 `Vector` 类为容器，因为 `Vector` 类型的对象就是容器。正如 §2.3 中定义的，`Vector` 并不是一个不合理的\
  \ `double` 容器：它易于理解，建立了一个有用的不变性 (§4.3)，提供了范围检查的访问 (§4.2)，并提供了 `size()` 允许我们遍历其元素。然而，它确实有一个致命缺陷：它使用\
  \ `new` 分配元素，但从不释放它们。这不是一个好主意，因为 C++ 不提供垃圾回收器使未使用的内存供新对象可用。在某些环境中，你无法使用回收器，而且通常出于逻辑或性能考虑，你倾向于对析构进行更精确的控制。我们需要一种机制来确保构造函数分配的内存被释放；该机制就是*析构函数*：\n\
  \n```cpp\npublic:\n    Vector(int s) :elem{new double[s]}, sz{s}    // 构造函数: 获取资源\n\
  \    {\n        for (int i=0; i!=s; ++i)    // 初始化元素\n    }\n\n    ~Vector() { delete[]\
  \ elem; }    // 析构函数: 释放资源\n\n    int size() const;\nprivate:\n    double* elem;\
  \    // elem 指向 sz 个 double 的数组\n    int sz;\n```\n\n析构函数的名字是取补运算符 `~` 加上类名；它是构造函数的取反。\n\
  \n\n这一切在没有 `Vector` 用户干预的情况下完成。用户只需像使用内置类型的变量一样创建和使用 `Vector`。。例如：\n\n```cpp\n\n\
  Vector* gp = new Vector(100);    // 自由存储上的 Vector; 永远不会销毁\n\nvoid fct(int n)\n \
  \   Vector v(n);\n    // ... 使用 v ...\n    {\n        Vector v2(2*n);\n    } //\
  \ v2 在此处销毁\n    // ... 使用 v ..\n} // v 在此处销毁\n```\n`Vector` 在命名、作用域、分配、生命周期等方面 (§1.5)\
  \ 遵循内置类型（如 `int` 和 `char`）遵循相同的规则。这个 `Vector` 通过省略错误处理被简化了；请参见 §4.4。\n\n构造函数/析构函数的组合是许多优雅技术的基础。特别是，它是大多数\
  \ C++ 通用资源管理技术的基础 (§6.3, §15.2.1)。\n\n\n构造函数分配元素并适当初始化 `Vector` 成员。析构函数释放元素。这种*句柄-数据模型*常用于管理对象生命周期内大小会变化的数据。\n\
  \n### 5.2.3 初始化容器\n容器是为了持有元素，因此显然我们需要方便的方法将元素放入容器。我们可以创建一个具有适当数量元素的 `Vector`，然后以后进行赋值，但通常其他方法更优雅。在这里，我只提到两个最喜欢的：\n\
  \n*   *初始化列表构造函数*：使用元素列表初始化。\n\n\n\n*   `push_back()`: 在序列的末尾（后面）添加一个新元素。\n\n\n\
  [](ch05_images.xhtml_f0058-03a)\n\n```\npublic:\n    Vector();    // 默认初始化为“空”；即没有元素\n\
  \    Vector(std::initializer_list<double>);    // 使用 double 列表初始化\n    // ...\n\
  \    // ...\n};\n```\n\n\n[](ch05_images.xhtml_f0059-01a)\n\n```\n{\n    Vector\
  \ v;\n    for (double d; is>>d; ) // 将浮点值读入 d\n        v.push_back(d);     // 将\
  \ d 添加到 v\n}\n```\n\n输入循环由文件结束或格式错误终止。在这种情况发生之前，每个读入的数字都会被添加到 `Vector` 中，以便在最后 `v`\
  \ 的大小等于读入元素的数量。我使用 `for`语句而不是更传统的 `while`-语句是为了将 `d` 的作用范围限制在循环内。\n从 `read()` 返回可能的大量数据可能是昂贵的。保证返回\
  \ `Vector` 是廉价的方法是为其提供一个移动构造函数 (§6.2.2)：\n\n[](ch05_images.xhtml_f0059-02a)\n\n\
  Vector v = read(cin);    // 这里没有 Vector 元素的拷贝\n```\n\n`std::vector` 的表示方式使得 `push_back()`\
  \ 和其他改变 `vector` 大小的操作变得高效，见 §12.2。\n用于定义初始化列表构造函数的 `std::initializer_list` 是编译器已知的标准库类型：当我们使用\
  \ `{}` 列表时，例如 `{1,2,3,4}`，编译器将创建一个 `initializer_list` 类型的对象并交给程序。因此，我们可以这样写：\n\n\
  [](ch05_images.xhtml_f0059-03a)\n\nVector v1 = {1, 2, 3, 4, 5};      // v1 有 5 个元素\n\
  Vector v2 = {1.23, 3.45, 6.7, 8}; // v2 有 4 个元素\n```\n\n\n[](ch05_images.xhtml_f0059-04a)\n\
  \n```\n    :elem{new double[lst.size()]}, sz{static_cast<int>(lst.size())}\n{\n\
  \    copy(lst.begin(),lst.end(),elem);    // 从 lst 拷贝到 elem (§13.5)\n}\n\n遗憾的是，标准库使用\
