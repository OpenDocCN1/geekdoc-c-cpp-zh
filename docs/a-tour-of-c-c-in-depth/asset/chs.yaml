  \n\n如果重定义了两个名称相同但参数类型不同的函数，编译器将为每次调用选择最合适的函数来执行。例如：\n\n[](ch01_images.xhtml_f0005-01a)\n\
  ```\nvoid print(int);      // 接收整数参数\nvoid print(double);   // 接收浮点数参数\nvoid print(string);\
  \   // 接收字符串参数\nvoid user()\n{\n    print(42);             // 调用 print(int)\n  \
  \  print(9.65);           // 调用 print(double)\n}\n```\n\n如果可以调用两个备选函数，但两者都不优，则该调用被认为是歧义的，编译器会给出错误。例如：\n\
  [](ch01_images.xhtml_f0005-02a)\n\n```\nvoid print(int, double);\n\nvoid user2()\n\
