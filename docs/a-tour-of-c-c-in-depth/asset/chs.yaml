  *   `object` 对象是内存。\n*   `value` 值是内存。\n\n参数传递的语义与初始化的语义是相同的（§3.4.1)）。也就是说，程序会对参数类型进行检查，并在必要时进行隐式参数类型转换（§1.4)）。例如：\n\
  \n[](ch01_images.xhtml_f0004-03a)\n```\ndouble s2 = sqrt(2);          // 使用参数 double{2}\
  \ 调用 sqrt()\ndouble s3 = sqrt(\"three\");    // 错误：sqrt() 需要类型为 double 的参数\n```\n\
  这种编译检查和类型转换的价值不应低估。\n\n函数声明可以包含参数名称。这可以帮助程序的阅读者，但除非该声明也是一个函数定义，否则编译器会直接忽略这些名称。例如：\n\
  \n\n```\ndouble sqrt(double d);     // 返回 d 的平方根\ndouble square(double);     //\
  \ 返回参数的平方\n\n函数的类型由其返回类型以及后续括号内的参数类型序列组成。例如：\n\n[](ch01_images.xhtml_f0004-05a)\n\
  ```\ndouble get(const vector<double>& vec, int index);    // 类型: double(const vector<double>&,int)\n\
  ```\n\n\n[](ch01_images.xhtml_f0004-06a)\n\n```\n```\n\n我们希望代码是可理解的，因为这是通往可维护性的第一步。可理解的第一步是将计算任务分解为有意义的块（用函数和类表示）并为它们命名。这些函数随后提供了计算的基础词汇，就像类型（内置和用户定义）提供了数据的基础词汇一样。C++\
  \ 标准算法（例如 `find`、`sort` 和 `iota`）提供了一个良好的开始（第 13 章）。接下来，我们可以将表示常见或特定任务的函数组合成更大的计算。\n\
  \n\n（注：输入文本中存在大量重复内容，已按要求仅对唯一内容进行处理。）\n\n\n\n位逻辑运算符产生的结果是针对每个位执行操作时对应的操作数类型的结果。逻辑运算符\
  \ `&&` 和 `||` 简单地根据其操作数的值返回 `true` 或 `false`。\n\n在赋值和算术运算中，C++ 在基本类型之间执行所有有意义的转换，以便它们自由混合：\n\
  [](ch01_images.xhtml_f0007-04a)\n\n```cpp\nvoid some_function()   // 不返回值的函数\n \
  \   double d = 2.2;    // 初始化浮点数\n    int i = 7;         // 初始化整数\n    d = d+i;\
  \           //将和赋值给 d\n    i = d*i;           // 将乘积赋值给 i；注意：将 double d*i 截断为 int\n\
  ```\n\n在表达式中使用的转换被称为*通常算术转换*，其目的是确保表达式按照其操作数的最高精度进行计算。例如，`double` 和 `int` 的相加是使用双精度浮点算术计算的。\n\
  \n\n除了传统的算术和逻辑运算符外，C++ 还提供了更具体的操作来修改变量：\n\n[](ch01_images.xhtml_f0008-01a)\n```cpp\n\
  x+=y       // x = x+y\n++x        // 增：x = x+1\nx-=y       // x = x-y\nx*=y    \
  \   // 乘：x = x*y\nx/=y       // 除：x = x/y\nx%=y       // 取模：x = x%y\n```\n这些运算符简洁、方便且被频繁使用。\n\
  \n`x.y`、`x->y`、`x(y)`、`x[y]`、`x<<y`、`x>>y`、`x&&y` 和 `x||y` 的求值顺序是从左到右的。赋值（例如 `x+=y`）是从右到左。由于历史，，表达式（例如\
  \ `f(x)+g(y)`）以及函数参数（例如 `h(f(x),g(y))`）的求值顺序遗憾地是不指定的。\n\n\n在对象可以使用之前，必须给它赋一个值。C++\
  \ 提供了多种表示初始化的符号，例如上面使用的 `=`，以及一种基于大括号分隔初始化列表的通用形式：\n\n[](ch01_images.xhtml_f0008-02a)\n\
  ```cpp\ndouble d1 = 2.3;                   // 将 d1 初始化为 2.3\ndouble d2 {2.3};  \
  \                 // 将 d2 初始化为 2.3\ndouble d3 = {2.3};                 // 将 d3 初始化为\
  \ 2.3（使用 { ... } 时 = 是可选的）\ncomplex<double> z = 1;             // 一个带有双精度浮点数标量的复数\n\
  complex<double> z2 {d1,d2};\ncomplex<double> z3 = {d1,d2};      // 使用 { ... } 时\
  \ = 是可选的\n\n```\n\n`=` 形式是传统的，可以追溯到 C，但如果不确定，请使用通用的 `{}` 列表形式。即使无无，它也能让你避免导致丢失信息的转换：\n\
  \n\n```cpp\nint i1 = 7.8;    // i1 变成 7（意外吧？）\nint i2 {7.8};    // 错误：浮点到整数的转换\n\
  \n遗憾的是，丢失信息的转换（*窄化转换*），例如从 `double` 到 `int` 以及 `int` 到 `char`，在在使用 `=` 时是被允许并隐式应用的（但在使用\
  \ `{}` 时不会）。隐式窄化转换引起的问题是为兼容 C 所付出的代价（§19.3）。\n\n常量不能留未初始化，变量只有在极少数情况下才应该保持未初始化状态。在为它找到合适的值之前，不要引入名称。用户定义的类型（如\
  \ `string`、`vector`、`Matrix`、`Motor_controller` 和 `Orc_warrior`）可以定义为隐式初始化（§5.2.1）。\n\
  在定义变量时，当类型可以从初始化器推断出时，不需要显式说明其类型：\n\n[](ch01_images.xhtml_f0008-04a)\n\nauto b =\
  \ true;          // 一个 bool\nauto ch = x ;           // 一个 char\nauto i = 123; \
  \          // 一个 int\nauto d = 1.2;           // 一个 double\nauto bb {true};    \
  \     // bb 是一个 bool\n```\n\n使用 `auto` 时，我们倾向于使用 `=`，因为不涉及任何可能产生问题的类型转换，但如果你喜欢一致地使用\
  \ `{}` 初始化，也可以这样做。\n在没有特定理由要显式提到类型时，我们使用 `auto`。“特定理由”包括：\n\n* 定义定义在一个较大的作用域内，我们希望类型对代码读者清晰可见。\n\
  * 初始化初始器的类型并不显而易见。\n\n使用 `auto`，我们避免了冗余和编写长类型名。这在泛型编程中特别重要，因为程序员很难知道对象的精确类型，且类型名称可能很长（§13.2）。\n\
  \n### 1.5 作用域和生命周期\n声明将其名称引入一个作用域：\n\n* *局部作用域*：在函数（§1.3）或 lambda（§7.3.2）中声明的名称被称为*局部名称*。它的作用域从声明点延伸到其声明所在块的结束。*块*由\
  \ `{ }` 来界定。\n\n\n* *命名空间作用域*：如果一个名称定义在命名空间内（§3.3），则它被称为*命名空间名称*。它的作用域从声明点延伸到命名空间的结束。\n\
  \n未在任何结构内部声明的名称被称为*全局名称*，并被认为位于全局命名空间。\n此外，我们可以拥有没有名称的对象，例如临时对象和使用 `new` 创建的对象（§5.2.2](#ch05.xhtml_sec5_2_2)）。例如：\n\
  \n[](ch01_images.xhtml_f0009-02a)\n\nvector<int> vec;     // vec 是全局整数向量\n\nvoid\
  \ fct(int arg)    // fct 是全局的（命名全局函数）\n                     // arg 是局部的（命名整数参数）\n\
  \    string motto {\"Who dares wins\"};    // motto 是局部的\n    auto p = new Record{\"\
  Hume\"};        // p 指向一个无名的 Record（创建）\n    // ...\n}\nstruct Record {\n    string\
  \ name;     // name 是 Record 的成员（字符串成员）\n    // ...\n};\n\n对象在使用之前必须被构造（初始化），并在作用域结束时被销毁。对于命名空间对象，销毁点是程序的结束。对于成员，其销毁点取决于其所属对象的销毁点。由\
  \ `new` 创建的对象“存活”直到被 `delete` 销毁（§5.2.2](#ch05.xhtml_sec5_2_2)）。\n\n### 1.6 常量\n\
  C++ 支持两种*不可变性*的概念（具有不可改变状态的对象）：\n\n* **const**：大致意思是“我承诺不更改此值”。它主要用于指定接口，以便可以使用指针和引用向函数传递数据而不必担心它被修改。编译器会强制执行\
  \ `const` 所做的承诺。`const` 的值可以在运行时计算。\n\n\n\n*   **`constexpr`**：含义大致“在编译时求值”。它主要用于指定常量，允许将数据放在只读内存中（那里极不可能被破坏），并用于优化性能。`constexpr`\
  \ 的值必须由编译器计算。\n\n\n[](ch01_images.xhtml_f0010-02a)\n\n```\nint var = 17;       \
  \                // var 不是常量\nconst double sqv = sqrt(var);       // sqv 是一个命名常量，可能在运行时计算\n\
  \ndouble sum(const vector<double>&);  // sum 不修改其参数 (§1.7)\nvector<double> v {1.2,\
  \ 3.4, 4.5};   // v 不是常量\nconst double s1 = sum(v);           // OK: sum(v) 在运行时求值\n\
  constexpr double s2 = sum(v);       // error: sum(v) 不是常量表达式\n```\n为了使一个函数能够在*常量表达式*中使用（即在由编译器评估的表达式中），它必须定义为\
  \ `constexpr` 或 `consteval`。例如：\n\n[](ch01_images.xhtml_f0010-03a)\n\nconstexpr\
  \ double square(double x) { return x * x; }\n\nconstexpr double max1 = 1.4 * square(17);\
  \   // OK: 1.4*square(17) 是常量表达式\nconstexpr double max2 = 1.4 * square(var);  //\
  \ error: var 不是常量，所以 square(var) 不是常量\n```\n\n`constexpr` 函数可以用于非常量参数，但当这样做时，结果不是常量表达式。我们允许在不需要常量表达式的语文中，使用非常量表达式参数调用\
  \ `constexpr` 函数。这样，我们就不需要定义两次本质相同的函数：一次用于常量表达式，一次用于变量。当我们希望一个函数仅用于编译时求值时，我们将其声明为\
  \ `consteval` 而不是 `constexpr`。例如：\n\n\n```\nconsteval double square2(double x) {\
  \ return x * x; }\n\nconst double max3 = 1.4 * square2(var);     // error: var 不是常量\n\
  ```\n\n声明为 `constexpr` 或 `consteval` 的函数是 C++ 对*纯函数*概念的实现。它们不能有副作用，并且只能使用作为参数传递给它们的信息。特别是它们不能修改非局部变量，但可以使用循环并使用它们自己的局部变量。例如：\n\
  [](ch01_images.xhtml_f0011-02a)\n\n```\nconstexpr double nth(double x, int n)  \
  \  // 假设 0<=n\n    double res = 1;\n    int i = 0;\n    while (i<n) {    // while\
  \ 循环：条件为真时执行 (§1.7.1)\n        res *= x;\n    }\n    return res;\n}\n```\n在某些地方，语言规则要求常量表达式（例如数组边界\
  \ (§1.7)、分支标签 (§1.8)、模板值参数 (§7.2) 以及使用 `constexpr` 声明的常量）。在其他情况下，编译时求值对性能很重要。除了性能之外，不可变性（状态不可改变的对象）是一个重要的设计考虑。\n\
  \n### 1.7 指针、数组和引用\n\n\n[](ch01_images.xhtml_f0011-03a)\n\n```\n```\n\n同样，指针可以这样声明：\n\
  \n\n```\nchar* p;      // 指向字符的指针\n```\n在声明中，`[ ]` 意味着“...数组”，`*` 意味着“指向...”。所有数组都以\
  \ `0` 为下界，因此 `v` 有六个元素，`v[0]` 到 `v[5]`。数组的大小必须是一个常量表达式 (§1.6)。指针变量可以持有适当类型对象的地址：\n\
  \n[](ch01_images.xhtml_f0011-05a)\n\nchar* p = &v[3];    // p 指向 v 的第四个元素\nchar\
  \ x = *p;        // *p 是 p 指向的对象\n```\n\n\n\n\n\nint count_x(const char* p, char\
  \ x)\n    // count the number of occurrences of x in p[]\n    // p is assumed to\
  \ point to a zero-terminated array of char (or to nothing)\n{\n        return 0;\n\
  \    int count = 0;\n    for (; *p!=0; ++p)\n        if (*p==x)\n    return count;\n\
  }\n```\n\n\n`count_x()` 的定义假设 `char*` 是一个*C 风格字符串*，也就是说，该指针指向一个以零结尾的 `char` 数组。字符串字面量中的字符是不可变的，因此为了处理\
  \ `count_x(\"Hello!\")`，我将 `count_x()` 的参数声明为 `const char*`。\n\n在较旧的代码中，通常使用 `0`\
  \ 或 `NULL` 代替 `nullptr`。然而，使用 `nullptr` 可以消除整数（如 `0` 或 `NULL`）与指针（如 `nullptr`）之间的潜在混淆。\n\
  在 `count_x()` 示例中，我们没有使用 `for` 语句的初始化部分，因此可以使用更简单的 `while`-语句：\n\n[](ch01_images.xhtml_f0014-01a)\n\
  \nint count_x(const char* p, char x)\n    // count the number of occurrences of\
  \ x in p[]\n    // p is assumed to point to a zero-terminated array of char (or\
  \ to nothing)\n{\n        return 0;\n    int count = 0;\n    while (*p) {\n    \
  \    if (*p==x)\n        ++p;\n    }\n    return count;\n}\n\n`while`-语句会一直执行直到其条件变为\
  \ `false`。\n\n对数值进行测试（例如 `count_x()` 中的 `while (*p)`）等同于将该值与 `0` 比较（例如 `while (*p!=0)`）。对指针值进行测试（例如\
  \ `if (p)`）等同于将该值与 `nullptr` 比较（例如 `if (p!=nullptr)`）。\n不存在“空引用”。引用必须引用一个有效对象（实现层假设是如此）。虽然有一些晦涩而聪明的方法可以违反这条规则，但不要这样做。\n\
  \n### 1.8 测试\n\n\n[](ch01_images.xhtml_f0014-02a)\n\n```cpp\n{\n    cout << \"Do\
  \ you want to proceed (y or n)?\\n\";    // 写问题\n    char answer = 0;    // 初始化为一个不会在输入中出现的值\n\
  \    cin >> answer;                                                            \
  \  读答案\n    if (answer == 'y')\n        return true;\n    return false;\n}\n\n为了匹配\
  \ `<<` 输出运算符（“放入”），输入使用了 `>>` 运算符（“从...获取”）；`cin` 是标准输入流（第 11 章）。`>>` 右侧的操作数决定了接受什么样的输入，其右侧的操作数是输入操作的目标。输出字符串末尾的\
  \ `\\n` 字符表示换行（§1.2.1）。\n\n注意，`answer` 的定义出现在它需要的地方（而不是之前）。声明可以出现在任何语句出现的地方。\n通过考虑\
  \ `n`（代表“否”）的答案，可以改进该示例：\n\n[](ch01_images.xhtml_f0015-01a)\n\nbool accept2()\n\
  {\n    cout << \"Do you want to proceed (y or n)?\\n\";    // 写问题\n    char answer\
  \ = 0;    // 初始化为一个不会在输入中出现的值\n\n    switch (answer) {\n        case 'y':\n    \
  \        return true;\n            return false;\n        default:\n           \
  \ cout << \"I'll take that for a no.\\n\";\n            return false;\n}\n```\n\n\
  `switch`-语句将一个值与一组常量进行测试。这些常量被称为 `case`-标签，它们必须是唯一的，如果所测试的值不与其中任何一个匹配，则选择 `default`。如果该值不匹配任何\
  \ `case`-标签且没有提供 `default`，则不采取任何操作。\n我们不必通过从包含其 `switch`-语句的函数中返回来退出 `case`。通常情况下，我们只是想继续执行\
  \ `switch`-语句之后的语句。我们可以使用 `break` 语句来实现这一点。例如，考虑一个为简单的命令行动作游戏编写的、过于聪明但又原始的解析器：\n\
  \n[](ch01_images.xhtml_f0015-02a)\n\nvoid action()\n{\n    while (true) {\n    \
  \    cout << \"enter action:\\n\";\n        cin >> act;\n\n        switch (act)\
  \ {\n            case \"u\":   // 上\n                break;\n            case \"\
  n\":   // 北\n                y++;\n                break;\n                x++;\n\
  \                break;\n            case \"e\":   // 东\n                x++;\n\
  \            default:\n                cout << \"I freeze!\\n\";\n             \
  \   break;\n        }\n}\n```\n\n### 1.9 映射到硬件\nC++ 提供了到硬件的直接映射。当你使用其中一种基本操作时，实现取决于硬件所提供的，通常是单条机器指令。例如，两个\
  \ `int` 相加 `x+y` 会执行一条整数加法指令。\n\nC++ 实现将机器内存视为一系列位置，它可以在这些位置放置（带类型的）对象，并使用指针对其进行寻址：\n\
  \n\n指针在内存中表示为机器地址，因此 `p` 的数值值将是 `103`。如果这看起来非常像数组（§1.7），那是因为数组是 C++ 对“连续对象序列”的基本抽象。\n\
  \n基础语言结构到硬件的简单映射，对于 C 和 C++ 数十以来一直闻名的原始底层性能至关重要。\n#### 1.9.1 赋值\n\n内置类型的赋值是一个简单的机器拷贝操作。考虑：\n\
  \nint x = 2;\nint y = 3;\nx = y; // x 变为 3；所以我们 x==y\n```\n这是显而易见的。这两个对象是独立的。我们可以改变\
  \ `y` 的值而不影响 `x` 的值。例如，`x=99` 不改变 `y` 的值。与 Java、C# 等其他语言不同，但与 C 相同，这适用于所有类型，而不仅仅是\
  \ `int`。\n\n\n\n如果我们想要不同的对象引用同一个（共享）值，我们必须明确说明。例如：\n\n[](ch01_images.xhtml_f0017-04a)\n\
  \nint x = 2;\nint y = 3;\nint* p = &x;\nint* q = &y;       // p!=q and *p!=*q\n\
  ```\n\n我们可以像下面这样用图形化的表示：\n\n\n我随手选择了 `88` 和 `92` 作为 `int` 的地址。再次，我们可以看到被赋值的对象从被赋值的对象获取值，从而产生两个具有相同值的独立对象（这里是指针）。也就是说，`p=q`\
  \ 使得 `p==q`。在 `p=q` 之后，两个指针都指向 `y`。\n\n引用和指针都引用/指向一个对象，并且在内存中都表示为一个机器地址。然而，使用它们的语言规则有所不同。对引用的赋值不会改变引用所引的对象，而是赋值给被引的对象：\n\
  [](ch01_images.xhtml_f0018-01a)\n\n```\nint x = 2;\nint& r = x;       // r refers\
  \ to x\nint& r2 = y;      // r2 refers to y\nr = r2;           // read through r2,\
  \ write through r: x becomes 3\n```\n我们可以像下面这样用图形化的表示：\n\n![Images](img/f0018-02.jpg)\n\
  \n\n在 `x=y` 之后，对于每一个内置类型和设计良好的用户定义类型（第 2 章），只要它们提供了 `=`（赋值）和 `==`（相等比较），就有 `x==y`。\n\
  \n### 1.9.2 初始化\n初始化不同于赋值。通常，为了使赋值正确工作，被赋值的对象必须有一个值。另一方面，初始化的任务是将未初始化的内存变为一个有效对象。对于几乎所有类型，从未初始变量读取或对其写入的效果都是未定义的。考虑引用：\n\
  \n[](ch01_images.xhtml_f0018-03a)\n\nint x = 7;\nint& r {x};         // bind r to\
  \ x (r refers to x)\nr = 7;              // assign to whatever r refers to\n\nr2\
  \ = 99;            // assign to whatever r2 refers to\n```\n\n幸运的是，我们无法拥有未初始化的引用；如果可以，那么\
  \ `r2=99` 将把 `99` 赋值给某个未指定的内存位置；结果最终会导致糟糕的结果或崩溃。\n你可以使用 `=` 来初始化引用，但请不要因此让你困惑。例如：\n\
  \n[](ch01_images.xhtml_f0018-04a)\n\nint& r = x;        // bind r to x (r refers\
  \ to x)\n```\n\n这仍然是初始化，并将 `r` 绑定到 `x`，而不是任何形式的值拷贝。\n初始化和赋值之间的区别对于许多用户定义类型也关重要，例如\
  \ `string` 和 `vector`，其中被赋值的对象拥有一个最终需要释放的资源 (§6.3)）。\n\n参数传递和函数值返回的基本语义是初始化 (§3.4)）。例如，这就是我们获得引用传递的方式\
  \ (§3.4.1)）。\n\n\n这里的建议是 C++ Core Guidelines 的子 [Stroustrup,2015]。引用指南的形式如下所示 [CG:\
