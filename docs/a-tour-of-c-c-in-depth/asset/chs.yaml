  ```\n\n\n参数传递的语义与初始化的语义（§3.4.1)）是相同的。也就是说，程序会根据参数类型进行检查，并在必要时进行隐式参数类型转换（§1.4)）。例如：\n\
  \n[](ch01_images.xhtml_f0004-03a)\n```\ndouble s2 = sqrt(2);          // 使用参数 double{2}\
