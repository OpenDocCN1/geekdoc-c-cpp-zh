  \ `auto`。\n*   已移除：某些 C++ 标准库函数对象及相关函数。大部分与参数绑定有关。请改用 lambda 和 `function`（§16.3）。\n\
  *   已弃用：将 `enum` 值与来自不同 `enum` 的值或浮点值进行比较。\n*   已弃用：两个数组之间的比较。\n*   已弃用：下标中的逗号操作（例如\
  \ `[a,b]`）。这是为了允许允许带有多个参数的用户定义 `operator[]()` 留空间。\n*   已弃用：lambda 表达式中隐式捕获 `this`。请改用\
  \ `[=,this]`（§7.3.3）。\n*   已移除：垃圾回收器的标准库接口。C++ 垃圾器不该接口。\n*   已弃用：`strstream`；请改用\
  \ `spanstream`（§11.7.4）。\n\n## 19.3 C/C++ 兼容性\n\n在少数例外情况下，C++ 是 C 的超集（意味着 C11；[C,2011]）。大多数差异源于\
  \ C++ 对类型检查的更加重视。编写良好的 C 程序通常也是 C++ 程序。例如，K&R2 [Kernighan,1988] 中的每个示例都是 C++。编译器可以诊断\
  \ C++ 和 C 之间的每一个差异。C11/C++20 的不兼容性列在标准的附录 C 中 [C++,2020]。\n\n### 19.3.1 C 和 C++\
  \ 是兄弟\n\n我该如何称呼 C 和 C++ 兄弟呢？看这个简化的族树：\n\n![Images](img/f0268-01.jpg)\n\n经典 C 有两个主要的后代：ISO\
  \ C 和 ISO C++。年来，这些语言以不同的速度和方向演变。结果之一是，每种语言都以略有不同的方式提供对传统 C 风格编程的支持。由此产生的不兼容性可能会让同时使用\
  \ C 和 C++ 的人感到痛苦，让用一种语言编写并使用另一种语言实现的库的人痛苦，也让 C 和 C++ 库及工具的实现者痛苦。\n\n实线表示特征的大规模继承，虚线表示借用主要特征，点线表示借用次要特征。从此，ISO\
  \ C 和 ISO C++ 成为 K&R C [Kernighan,1978] 的两个主要后代，并成为兄弟。它们各自携带了经典 C 的关键方面，且没有一个与经典\
  \ C 100% 兼容。我“经典 C”这个术语是从一个以前贴在 Dennis Ritchie 终端上的贴纸上选的。它是 K&R C 加上枚举和 `struct`\
  \ 赋值。BCPL 由 [Richards,1980] 定义，C89 由 [C1990] 定义。\n\n曾有一个 C++03，我没有列出因为它是一个错误修复版本。同样，C17\
  \ 也没有列出，因为它是对 C11 的错误修复版本。\n\n注意，C 和 C++ 之间的差异并不一定是在 C++ 中对 C 进行更改的结果。在某些情况下，不兼容性源于在\
  \ C++ 中常见很久之后才以不兼容的方式采纳到 C 中的特征。例如将 `T*` 赋值给 `void*` 的能力，以及全局 `const` 的链接 [Stroustrup,2002]。有时，某个特征在成为\
  \ ISO C++ 标准的一部分后，甚至以不兼容的方式采纳到 C 中，例如 `inline` 含义的细节。\n\n### 19.3.2 兼容性问题\n\nC 和\
  \ C++ 之间存在许多细小的不兼容。所有这些都可能给程序员带来问题，但在 C++ 的语境下，所有问题都可以被解决。至少，C 代码段可以被编译为 C，并使用 `extern\
  \ \"C\"` 机制进行链接。\n\n将一个 C 程序转换为 C++ 的主要问题可能是：\n\n*   次优的设计和编程风格。\n*   一个 `void*`\
  \ 隐式转换为 `T*`（即在没有类型转换的情况下转换）。\n*   C++ 关键字（如 `class` 和 `private` 在在 C 代码中被用标识符。\n\
  *   作为 C 编译的代码片段与作为 C++ 编译的代码片段之间不兼容的链接。\n\n#### 19.3.2.1 风格问题\n\n自然，C 程序是用 C 风格编写的，例如\
