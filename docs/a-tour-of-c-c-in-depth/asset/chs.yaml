  ### A.5 建议\n\n\n## 前言\n\n当你想要教导他人时，请保持简洁。\n现在的 C++ 感觉像是一门新语言。也就是说，今天我比在 C++98 或\
  \ C++11 中能够更清晰、更简单、更直接地表达我的想法。此外，生成的程序经过编译器的更好的检查，并且运行得更快。\n\n本书概述了由 C++20 定义（当前的\
  \ ISO C++ 标准）并由主要 C++ 供应商实现的 C++。此外，它还提到了当前使用的一些库组件，但这些组件尚未计划在 C++23 之前纳入标准。\n\n\
  \n本书假设你以前写过程序。如果没有，请在继续阅读此处之前，考虑阅读一本教材，例如 *Programming: Principles and Practice\
  \ Using C++ (Second edition)*。即使你以前写过程序，你所使用的语言或编写的应用程序可能与这里介绍的 C++ 风格大不相同。\n\n\
  想象一次对城市（如哥本哈根或纽约）的观光游。在短短几个小时内，你就能快速一览主要景点，听几个背景故事，并获得一些关于下一步做什么的建议。游览结束后，你并不了解这座城市。你并不理解你所看到和听到的所有；有些故事听起来可能很奇怪甚至不可思议。你不知道如何应对城市生活的正式和非正式规则。要真正了解一个城市，你必须住在那里，通常要住几年。然而，如果运气好，你将获得一个基本的概述，对这座城市特殊之处的认知，以及对你可能感兴趣的内容的想法。游览结束后，真正的探索才开始。\n\
  本次游览介绍了支持编程风格（如面向对象和泛型编程）的主要 C++ 语言特性。它并没有试图提供详尽的、手册式的、逐一特性的语言视图。遵循教科书优良传统，我尝试在使用某个特性之前对其进行解释，但这并不总是可能的，而且并不是所有人都会严格按照顺序阅读。我假设读者具有一定的技术成熟。因此，鼓励读者使用交叉引用和索引。\n\
  \n同样，本书通过示例来介绍标准库，而不是详尽地介绍。鼓励读者根据需要寻找额外的支持性材料。C++ 生态系统远比 ISO 标准提供的设施（例如库、构建系统、分析工具和开发环境）要丰富得多。网络上有大量的（质量不异的）材料。大多数读者会发现来自\
  \ CppCon 和 Meeting C++ 等会议的实用教程视频和概述视频。对于 ISO C++ 标准提供的语言和库的技术细节，我推荐查看 Cppreference。\n\
  \n\n\n\n\n编程语言参考手册或标准仅仅陈述了可以做什么，但程序员通常对学习如何良好地使用这种语言更感兴趣。这方面部分体现在涵盖的主题选择中，部分体现在文中，特别是在建议章节中得到了解决。关于什么是良好的现代\
  \ C++ 的更多建议，可以在《C++ 核心指南》[Stroustrup,2015] 中找到。核心指南可以是进一步探索书中介绍的理念的良好来源。你可能会发现核心指南与本书在建议的表述甚至建议的编号上具有惊人的相似性。原因之一是，《C++\
  \ 之旅》（*A Tour of C++*）的第一版是最初核心指南的主要来源。\n\n## 致谢\n\n本书由作者使用 troff 设置，并使用了源自 Brian\
