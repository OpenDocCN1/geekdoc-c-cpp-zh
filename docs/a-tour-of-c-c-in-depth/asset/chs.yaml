  再次考虑 `Container` 的使用：\n[](ch05_images.xhtml_f0062-03a)\n\n```\nvoid use(Container&\
  \ c)\n    const int sz = c.size();\n\n    for (int i=0; i!=sz; ++i)\n        cout\
  \ << c[i] << '\\n';\n```\n\n`use()` 中的调用 `c[i]` 如何解析到正确的 `operator[]()`？当 `h()`\
  \ 调用 `use()` 时，必须调用 `List_container` 的 `operator[]()`。当 `g()` 调用 `use()` 时，必须调用\
  \ `Vector_container` 的 `operator[]()`。为了实现这种解析，`Container` 对象必须包含信息，允许其在运行时选择正确的函数。通常的实现技术是让编译器将虚函数的名称转换为函数指针表中的索引。该表通常被称为*虚函数表*（virtual\
  \ function table）或简单称为 `vtbl`。每个带有虚函数的类都有它们自己的 `vtbl` 来识别其虚函数。可以像这样图形化表示：\n\n\n\
  `vtbl` 中的函数允许对象在调用者不知道对象的大小和数据布局的情况下仍被正确使用。调用者的实现只需要知道 `Container` 中指向 `vtbl` 指针的位置，以及用于每个虚函数的索引。这种虚函数调用机制的效率几乎可以达到与“普通函数调用”机制相相当的水平（差异在\
  \ 25% 以内，且对于对同一对象的重复调用要廉得多）。它的空间开销是每个带有虚函数的类的每个对象占用一个指针，加上每个此类类占用一个 `vtbl`。\n\n\
  ### 5.5 类层次结构\n`Container` 示例是*类层次结构*（class hierarchy）的一个简单示例——一组派生自根类的类。给定这个定义，我们可以编写操作指针向量的通用函数：\n\
  \n![Images](img/f0063-02.jpg)\n\nclass Shape {\npublic:\n    virtual Point center()\
  \ const =0;  // 纯虚\n    virtual void move(Point to) =0;    // 纯虚\n    virtual void\
  \ rotate(int angle) = 0; // 纯虚\n\n    virtual ~Shape() {}               // 析构函数\n\
  \    // ...\n```\n\n当然，这个接口除了 `vtbl` 指针的位置外与 `Container` 和 `Vector_container` 示例相比并没有新。例如，派生自\
  \ `Shape` 的 `Circle`：\n\nvoid rotate_all(vector<Shape*>& v, int angle) // 将 v 的元素旋转\n\
  {\n    for (auto p : v)\n        p->rotate(angle);\n```\n\n定义一个特定的形状，必须说明它是 `Shape`\
  \ 并指定它的特定属性（包括它的虚函数）：\n\n\n```\nclass Circle : public Shape {\npublic:\n\n    Point\
  \ center() const override { return x; }\n    void move(Point to) override { x =\
  \ to; }\n    void draw() const override;\nprivate:\n    Point x;    // 中心\n    int\
  \ r;    // 半径\n};\n\n到为止，`Shape` 和 `Circle` 示例与 `Container` 和 `Vector_container`\
  \ 示例相比没有提供新东西，但我们可以进一步构建：\n\n[](ch05_images.xhtml_f0064-04a)\n```\nclass Smiley\
  \ : public Circle {    将圆形作为脸的基类\npublic:\n    Smiley(Point p, int rad) : Circle{p,rad},\
  \ mouth{nullptr} { }\n    {\n        delete mouth;\n        for (auto p : eyes)\n\
  \            delete p;\n\n    void move(Point to) override;\n\n    void draw() const\
  \ override;\n    void rotate(int) override;\n\n    void add_eye(Shape* s)\n    {\n\
  \        eyes.push_back(s);\n    }\n\n    void set_mouth(Shape* s);\n    virtual\
  \ void wink(int i); // 眨眼睛 i 号\n\n    // ...\n\nprivate:\n    vector<Shape*> eyes;\
  \    // 通常是只眼睛\n    Shape* mouth;\n};\n```\n\n`vector` 的 `push_back()` 成员将其参数拷贝到\
  \ `vector`（这里是 `eyes`）中作为最后一个元素，使该向量增加一个。\n\n\n\n\n\n我们现在可以通过调用 `Smiley` 的基类和成员\
  \ `draw()` 来定义 `Smiley::draw()`：\n\n```\nvoid Smiley::draw() const\n{\n    Circle::draw();\n\
  \    for (auto p : eyes)\n        p->draw();\n    mouth->draw();\n}\n```\n\n注意 `Smiley`\
  \ 使用标准库的 `vector` 保留它的眼睛，并在析构函数中删除它们。`Shape` 的析构函数是 `virtual` 的，而 `Smiley` 的析构函数覆盖了它。对于抽象类来说，`virtual`\
  \ 析构函数是关重要的，因为派生类对象通常通过其抽象基类提供的接口进行操作。特别是，它可能会通过基类指针被 `delete`。这时，虚函数调用机制确保了调用正确的析构函数。然后，该析构函数会隐式地调用其基类和成员的析构函数。\n\
  \n在这个简化的示例中，程序员的任务是将眼睛和嘴巴适当地放置在代表脸部的圆内。\n\n当我们通过派生定义新类时，可以添加数据成员、操作或两者兼顾。这提供了极大的灵活性，但也带来了产生困惑和设计缺陷的机会。\n\
  \n### 5.5.1 层次结构带来的好处\n\n类层次结构提供了两种好处：\n\n*   `接口继承（Interface inheritance）：派生类对象可以用任何需要基类对象的地方。也就是说，基类充当派生类的接口。`Container`\
  \ 和 `Shape` 类就是例子。此类类通常是抽象类。\n*   `实现继承（Implementation inheritance）：基类提供函数或数据，简化派生类的实现。`Smiley`\
  \ 对 `Circle` 构造函数和 `Circle::draw()` 的使用就是例子。此类基类通常拥有数据成员和构造函数。\n\n具体类——尤其是表示较小的类——与内置类型非常相似：我们将它们定义为局部变量，使用它们的名称访问它们，进行拷贝等。类层次结构中的类则不同：我们倾向于使用\
  \ `new` 在自由存储上分配它们，并通过指针或引用访问它们。例如，考虑一个从输入流中读取描述形状的数据并构造相应的 `Shape` 对象的函数：\n\n[](ch05_images.xhtml_f0066-01a)\n\
  \n```\nenum class Kind { circle, triangle, smiley };\n\nShape* read_shape(istream&\
  \ is)    // 从输入流 is 读取形状描述\n{\n    // ... 从 is 读取形状头并找到其 Kind k ...\n\n    switch\
  \ (k) {\n        case Kind::circle:\n            // ... 将圆数据 {Point,int} 读入 p 和\
  \ r ...\n            return new Circle{p,r};\n        case Kind::triangle:\n   \
  \         // ... 将三角形数据 {Point,Point,Point} 读入 p1, p2, and p3 ...\n            return\
  \ new Triangle{p1,p2,p3};\n        case Kind::smiley:\n            // ... 将 Smiley\
  \ 数据 {Point,int,Shape,Shape,Shape} 读入 p, r, e1, e2, and m ...\n            Smiley*\
  \ ps = new Smiley{p,r};\n            ps->add_eye(e1);\n            ps->add_eye(e2);\n\
  \            ps->set_mouth(m);\n            return ps;\n    }\n}\n```\n\n程序可以这样使用该形状读取器：\n\
  \n[](ch05_images.xhtml_f0066-02a)\n\n```\nvoid user()\n{\n    std::vector<Shape*>\
  \ v;\n\n    while (cin)\n        v.push_back(read_shape(cin));\n\n    draw_all(v);\
  \      // 为每个元素调用 draw()\n    rotate_all(v,45); // 为每个元素调用 rotate(45)\n\n    for\
  \ (auto p : v)  // 忘记删除元素\n        delete p;\n}\n```\n\n显然，这个示例是简化的——特别是在错误处理方面——但它生动地说明了\
  \ `user()` 完全不知道它正在操作的是哪种形状。`user()` 代码可以编译一次，稍后用于程序中添加的新 `Shape`。注意，在 `user()`\
  \ 外部没有指向形状的指针，因此 `user()` 负责释放它们。这是通过 `delete` 操作符实现的，并关键地依赖于 `Shape` 的虚析构函数。正因为该析构函数是虚的，`delete`\
  \ 会调用最派生类的析构函数。这至关重要，因为派生类可能获取了各种资源（如文件句柄、锁和输出流），这些资源需要释放。在这种情况下，`Smiley` 会删除它的\
  \ `eyes` 和 `mouth` 对象。一旦完成，它就会调用 `Circle` 的析构函数。对象通过构造函数“自底向上”（基类优先）构造，并通过析构函数“自顶向下”（派生类优先）销毁。\n\
  \n### 5.5.2 层次结构导航\n\n`read_shape()` 函数返回 `Shape*`，以便以相同的方式对待所有 `Shapes`。然而，如果我们想使用由特定派生类提供的成员函数，例如\
  \ `Smiley` 的 `wink()`，我们该怎么办？我们可以使用 `dynamic_cast` 操作符来询问“这个 `Shape` 是 `Smiley`\
  \ 吗？”：\n\n[](ch05_images.xhtml_f0067-01a)\n\n```\nShape* ps {read_shape(cin)};\n\
  \nif (Smiley* p = dynamic_cast<Smiley*>(ps)) { // ps 指向 Smiley Smiley？\n    // ...\
  \ 使用 p\n}\nelse {\n    // ... ps 不是 Smiley\n}\n```\n\n如果节制地使用 `dynamic_cast`，代码会更整洁。如果我们能避免在运行时测试类型，可以编写更简单、高效的代码，但偶尔会丢失类型需要恢复。\n\
  \n### 5.5.3 避免资源泄漏\n\n*泄漏（leak）* 是我们在获取资源后未能释放它时的习惯术语。必须避免资源泄漏，因为泄漏会导致系统无法使用该资源。因此，随着系统耗尽所需的资源，泄漏最终会导致运行变慢甚至崩溃。\n\
  \n丰富的程序员会注意到我在 `Smiley` 示例中留下了犯错的机会：\n\n*   `Smiley` 的实现者可能忘记 `delete` 指向 `mouth`\
  \ 的指针。\n*   `read_shape()` 的用户可能忘记 `delete` 返回的指针。\n*   Shape 指针容器的所有者可能忘记 `delete`\
  \ 所指向的对象。\n\n从这个意义上说，指向在自由存储上分配对象的指针是危险的：普通指针不应表示所有权。例如：\n\n[](ch05_images.xhtml_f0068-01a)\n\
  \n```\nvoid user(int x)\n{\n    Shape* p = new Circle{Point{0,0},10};\n    // ...\n\
  \    if (x<0) throw Bad_x{};    // 潜在泄漏\n    if (x==0) return;    // 潜在泄漏\n    //\
  \ ...\n    delete p;\n}\n```\n\n除非 `x` 为正数，否则将会泄漏。将 `new` 的结果赋值给“裸指针”是自自找麻烦。\n\n\
  解决此类问题的简单方法是在需要删除时，使用标准库的 `unique_ptr` (§15.2.1) 而不是“裸指针”。\n\n\n\n\n\n```cpp\nclass\
  \ Smiley : public Circle {\n    // ...\nprivate:\n    vector<unique_ptr<Shape>>\
  \ eyes;    // 通常有两个眼睛\n    unique_ptr<Shape> mouth;\n};\n```\n\n这是一个简单、通用且高效的资源管理技术示例（§6.3）。\n\
  \n作为这一更改的令人愉的副作用，我们不再需要为 `Smiley` 定义析构函数。编译器将隐式地生成一个析构函数，负责对 `vector` 中的 `unique_ptr`\
  \ s 执行所需的析构操作（§6.3）。使用 `unique_ptr` 的代码效率与正确使用原始指针的代码效率完全一致。\n\n现在考虑 `read_shape()`\
  \ 的用户：\n\n[](ch05_images.xhtml_f0068-03a)\n\n```cpp\nunique_ptr<Shape> read_shape(istream&\
  \ is)    // 从输入流 is 中读取形状描述\n{\n    // ... 从 is 中读取形状头信息并找到其类型 k ...\n\n    switch\
  \ (k) {\n        case Kind::circle:\n        // ... 将形状数据 {Point,int} 读入 p 和 r ...\n\
  \        return unique_ptr<Shape>{new Circle{p,r}\n    };    // §15.2.1\n    //\
  \ ...\n}\n\nvoid user()\n{\n    vector<unique_ptr<Shape>> v;\n\n    while (cin)\n\
  \        v.push_back(read_shape(cin));\n\n    draw_all(v);    // 为每个元素调用 draw()\n\
  \    rotate_all(v,45);    // 为每个元素调用 rotate(45)\n} // 所有 Shapes 被隐式析构\n```\n\n现在，每个对象都由一个\
  \ `unique_ptr` 所有，当该对象不再需要时（即其 `unique_ptr` 离开作用域时），它将 `delete` 该对象。\n\n为了让 `unique_ptr`\
  \ 版本的 `user()` 能够工作，我们需要接受 `vector<unique_ptr<Shape>>`s 的 `draw_all()` 和 `rotate_all()`\
  \ 版本。编写许多此类 `_all()` 函数可能会变得繁琐，因此 §7.3.2 展示了一种替代方案。\n\n### 5.6 建议\n\n[1] 直接在代码中表达思想；§5.1;\
  \ [CG: P.1]。\n\n[2] 具体类型是最简单的类类型。在适用情况下，优先使用具体类型而不是更复杂的类或纯数据结构；§5.2; [CG: C.10]。\n\
  \n[3] 使用具体类来表示简单概念；§5.2。\n\n[4] 对于性能关键型组件，优先使用具体类而不是类层次级结构；§5.2。\n\n[5] 定义构造函数来处理对象的初始化；§5.2.1,\
  \ §6.1.1; [CG: C.40] [CG: C.41]。\n\n[6] 只有当函数需要直接访问类的表示时，才将其成为成员函数；§5.2.1; [CG:\
  \ C.4]。\n\n[7] 定义运算符主要是为了模拟习惯用法；§5.2.1; [CG: C.160]。\n\n[8] 使用非成员函数处理对称运算符；§5.2.1;\
  \ [CG: C.161]。\n\n[9] 声明一个不修改对象状态的成员函数为 `const`；§5.2.1。\n\n[10] 如果构造函数获取了资源，该类就需要一个析构函数来释放该资源；§5.2.2;\
  \ [CG: C.20]。\n\n[11] 避免“裸露”的 `new` 和 `delete` 操作；§5.2.2; [CG: R.11]。\n\n[12] 使用资源句柄和\
  \ RAII 来管理资源；§5.2.2; [CG: R.1]。\n\n[13] 如果一个类是容器，给它提供一个初始化列表构造函数；§5.2.3; [CG: C.103]。\n\
  \n[14] 当需要接口与实现完全分离时，使用抽象类作为接口；§5.3; [CG: C.122]。\n\n[15] 通过指针和引用访问多态对象；§5.3。\n\n\
  [16] 抽象类通常不需要构造函数；§5.3; [CG: C.126]。\n\n[17] 使用类层次级结构来表示具有固有层次结构的概念；§5.3。\n\n[18]\
  \ 具有虚析构函数的类应该是虚的；§5.3; [CG: C17]。\n\n[19] 使用 `override` 显式标记重写；§5.3; [CG:9]。\n\n\
  [20] 在设计类时，区分实现和继承；§5.2; [CG: C14]。\n\n[21] 在不可避免时使用 `dynamic_cast` 到类型；§5.2; [CG:\
  \ C25]。\n\n[22] 使用 `unique_ptr` 或 `shared_ptr` 避免 `delete` 对象；§5.2; [CG: C23]。\n\
  \n# 6 核心操作\n\n当有人说我需要时：\n\n### 6.1 引言\n\n某些操作，如初始化、赋值、拷贝和移动，在意义上是基础性的，因为语言对它们做出了假设。\n\
  \n#### 6.1.1 核心操作\n\n构造函数、析构函数以及拷贝和移动操作在逻辑上并不是独立的。我们必须成对定义。如果类 `X` 有执行复杂任务的析构函数，该类可能需要全套函数：\n\
  \n[](06_images.xhtml_f0072-01a)\n\n```cpp\nclass X {\npublic:\n    X(Sometype);\
  \               // “普通构造函数”创建对象\n    X();                       // 默认构造函数\n    X(const\
  \ X&);               // 拷贝构造函数\n    X(X&&);                    // 移动构造函数\n    X&\
  \ operator=(const X&);    // 拷贝赋值：清理目标并拷贝\n    X& operator=(X&&);         // 移动赋值：清理目标并移动\n\
  \    ~X();                      // 析构函数：清理\n    // ...\n};\n```\n\n对象被拷贝或移动的情况五：\n\
  \n*   作为赋值源\n*   作为对象初始化\n*   作为函数参数\n*   作为返回值\n\n赋值使用拷贝或移动赋值运算符。原则上，其他情况使用拷贝或移动构造函数。然而，拷贝或移动构造函数的调用通常会被优化，直接在用于初始化的目标对象中构造。例如：\n\
  \n```cpp\nX make(Sometype);\nX x = make(value);\n```\n\n在这里，编译器通常会直接在 `x` 中从 `make()`\
  \ 构造 `X`，从而消除（eliding）了拷贝。\n\n除了命名对象和自由存储上对象的初始化外，构造函数还用于初始化临时对象以及实现显式类型转换。\n\n\
  除了“普通构造函数”之外，这些特殊成员函数将根据需要自动生成。如果你想显式地生成默认实现，可以：\n\n\n\n\n```cpp\nclass Y {\npublic:\n\
  \    Y(Sometype);\n    Y(const Y&) = default; // 我确实想要默认拷贝构造函数\n    Y(Y&&) = default;\
  \      // 还有默认移动构造函数\n    // ...\n};\n```\n\n如果你显式地指定了某些默认值，其他的默认定义将不会生成。\n\n当类包含一个指针成员时，显式指定拷贝和移动操作通常是一个好主意。这是因为指针可能指向类需要\
  \ `delete` 的某些内容，在这种情况下，默认的成员级拷贝是错误的。或者，它可能指向类*不能* `delete` 的某些内容。无论哪种情况，代码阅读者都希望知道这一点。例如，请参见\
  \ §6.2.1。\n\n一个好的经验法则（有时被称为*零规则*）是在定义所有的核心操作，要么全部都不定义（对所有操作使用默认值）。例如：\n\n[](ch06_images.xhtml_f0073-01a)\n\
  \n```cpp\nstruct Z {\n    Vector v;\n    string s;\n};\n\nZ z1;      // 默认初始化 z1.v\
  \ 和 z1.s\nZ z2 = z1; // 默认拷贝 z1.v 和 z1.s\n```\n\n在这里，编译器将需要合成成员级的默认构造、拷贝、移动和析构函数，且都具有正确的语义。\n\
  \n为了补充 `=default`，我们使用了 `=delete` 来指示某个操作不被生成。类层次结构中的基类是我们不想允许成员级拷贝的经典示例。例如：\n\n\
  [](ch06_images.xhtml_f0073-02a)\n\n```cpp\nclass Shape {\npublic:\n    Shape(const\
  \ Shape&)=delete;    // 禁止拷贝\n    Shape& operator=(const Shape&)=delete;\n    //\
  \ ...\n};\n\nvoid copy(Shape& s1, const Shape& s2)\n{\n    s1 = s2;    // 错误：Shape\
  \ 拷贝已删除\n}\n```\n\n`=delete` 会使尝试使用被 `delete` 的函数成为编译时错误；`=delete` 可用于抑制任何函数，而不是核心成员函数。\n\
  \n### 6.1.2 转换\n\n接受单个参数的构造函数定义了从其参数类型的转换。例如，`complex` (§5.2.1) 提供了一个从 `double`\
  \ 的构造函数：\n\n[](ch06_images.xhtml_f0073-03a)\n\n```cpp\ncomplex z1 = 3.14;    //\
  \ z1 变为 {3.14,0.0}\ncomplex z2 = z1*2;    // z2 变为 z1*{2.0,0} == {6.28,0.0}\n```\n\
  \n这种隐式转换有时是理想的，但并非总是。例如，`Vector` (§5.2.2) 提供了一个从 `int` 的构造函数：\n\n[](ch06_images.xhtml_f0073-04a)\n\
  \n```cpp\nVector v1 = 7;    // OK：v1 有 7 个元素\n```\n\n这通常被认为是不幸的，标准库的 `vector` 不允许这种从\
  \ `int` 到 `vector` 的“转换”。\n\n避免此问题的方法是说明只允许显式“转换”；也就是说，我们可以这样定义构造函数：\n\n[](ch06_images.xhtml_f0074-01a)\n\
  \n```cpp\nclass Vector {\npublic:\n    explicit Vector(int s);    // 禁止从 int 到 Vector\
  \ 的隐式转换\n    // ...\n};\n```\n\n这让我们得到了：\n\n[](ch06_images.xhtml_f0074-02a)\n\n\
  ```cpp\nVector v1(7);    // OK：v1 有 7 个元素\nVector v2 = 7;   // 错误：从 int 的隐式转换\n\
  ```\n\n在转换方面，像 `Vector` 的类型比像 `complex` 的类型多，因此对于接受单个参数的构造函数使用 `explicit`，除非有充分理由。\n\
  \n### 6.1.3 成员初始化\n\n当定义数据成员时，我们可以提供一个称为*成员初始化*的默认值。考虑 `complex` (§5.2.1) 的修订：\n\
  \n[](ch06_images.xhtml_f0074-03a)\n\n```cpp\nclass complex {\n    double re = 0;\n\
  \    double im = 0;    // 表示：两个 double 默认值为 0.0\npublic:\n    complex(double r,\
  \ double i) :re{r}, im{i} {} // 从两个标量构造：{r,i}\n    complex(double r) :re{r} {} \
  \                  // 从一个标量构造：{r,0}\n    complex() {}                          \
  \        // 默认 complex：{0,0}\n}\n```\n\n当构造函数没有提供值时，就会使用默认值。这简化了代码并帮助我们避免意外初始化成员。\n\
  \n### 6.2 拷贝与移动\n\n默认情况下，对象是可以拷贝的。这对于自定义类型和内置类型都是如此。拷贝的默认含义是成员级拷贝。例如，`complex` (§5.2.1)\
  \ 提供了一个从 `double` 的构造函数：\n\n\n\n我们可以通过定义拷贝构造函数和拷贝赋值来控制拷贝，但对于大型容器来说，拷贝代价可能是昂贵的。当我们通过引用传递对象给函数时，我们避免了拷贝的开销，但我们无法返回一个局部对象的引用作为结果（因为当调用者有机会查看它时，局部对象已经被销毁了）。考虑一下：\n\
  \n[](ch06_images.xhtml_f0076-04a)\n\n```cpp\nVector operator+(const Vector& a, const\
  \ Vector& b)\n{\n    if (a.size()!=b.size())\n        throw Vector_size_mismatch{};\n\
  \n    Vector res(a.size());\n\n    for (int i=0; i!=a.size(); ++i)\n        res[i]=a[i]+b[i];\n\
  \    return res;\n}\n```\n\n从 `+` 返回涉及到将结果从局部变量 `res` 拷贝到调用者可以访问的地方。我们可能会这样使用 `+`：\n\
  \n[](ch06_images.xhtml_f0077-02a)\n\n```cpp\nvoid f(const Vector& x, const Vector&\
  \ y, const Vector& z)\n{\n    Vector r;\n    // ...\n    r = x+y+z;\n    // ...\n\
  }\n```\n\n这将至少拷贝两次 `Vector`（每个使用 `+` 运算符都会拷贝一次）。如果一个 `Vector` 很大，比如有 10,000 个 `double`，那可能会非常尴尬。最尴尬的部分是，`operator+`\
  \ 中的 `res` 在拷贝之后再也没有被用过。我们并不真正想要拷贝，我们只是想把结果从函数中提取出来：我们想要*移动*一个 `Vector` 而不是*拷贝*它。幸运的是，我们可以陈述这种意图：\n\
  \n[](ch06_images.xhtml_f0077-03a)\n\n```cpp\nclass Vector {\n    // ...\n\n    Vector(const\
  \ Vector& a);            // 拷贝构造函数\n    Vector& operator=(const Vector& a); // 拷贝赋值\n\
  \n    Vector(Vector&& a);            // 移动构造函数\n    Vector& operator=(Vector&& a);\
  \ // 移动赋值\n};\n```\n\n给定该定义，编译器将选择*移动构造函数*来实现返回值从函数外部的转移。这意味着 `r=x+y+z` 将不涉及 `Vector`\
  \ 的拷贝。相反，`Vectors` 只是被移动了。\n\n通常情况下，`Vector` 的移动构造函数很容易定义：\n\n[](ch06_images.xhtml_f0077-04a)\n\
  \n```cpp\nVector::Vector(Vector&& a)\n    :elem{a.elem},    // 从 a 中“夺取元素”\n   \
  \ sz{a.sz}\n{\n    a.elem = nullptr; // 现在 a 没有元素了\n    a.sz = 0;\n}\n```\n\n`&&`\
  \ 意味着“右值引用”，是一个可以绑定到右值的引用。“右值（rvalue）”一词是为了补充“左值（lvalue）”，左值大致指“可以出现在赋值表达式左侧的东西”\
  \ [Stroustrup,2010]。因此，右值——粗略来说——是你无法对其赋值的值，例如函数调用返回的整数。因此，右值引用是对一个*其他人*无法赋值的对象的引用，所以我们可以安全地“偷取”它的值。`Vectors`\
  \ 的 `operator+` 中的局部变量 `res` 就是一个例子。\n\n移动构造函数*不接受* `const` 参数：毕竟，移动构造函数的作用是从其参数中移除该值。*移动赋值*的定义也类似。\n\
  \n当右值引用被用初始化器或赋值的右侧时，就会应用移动操作。\n\n移动之后，被移动的对象应该处于一种允许运行析构函数的状态。通常，我们还允许对被移动过的对象进行赋值。标准库算法(第\
  \ 13 章) 假设了这一点。我们的 `Vector` 就是这样做的。\n\n当程序员知道某个值不会被再次使用，但指指编译器足够聪明能发现这一点时，程序员可以明确指定：\n\
  \n[](ch06_images.xhtml_f0078-01a)\n\n```cpp\nVector f()\n{\n    Vector x(1000);\n\
  \    Vector y(2000);\n    Vector z(3000);\n    z = x;            // 我们得到了一个拷贝 (x\
  \ 可能会在 f() 之后被使用)\n    y = std::move(x); // 我们得到了一个移动 (移动赋值)\n    // ... 最好不要在这里使用\
  \ x ...\n    return z;         // 我们得到了一个移动\n}\n```\n\n标准库函数 `move()` 实际上并没有移动任何东西。相反，它返回了其参数的引用，我们可以从该引用进行移动——即一个*右值引用*；它是一种类型转换\
  \ (§5.2.3)。\n\n在 `return` 之前，我们有：\n\n![Images](img/f0078-02.jpg)\n\n当我们从 `f()` 返回时，`z`\
  \ 在其元素被 `return` 移出 `f()` 之后被销毁。然而，`y` 的析构函数将 `delete[]` 它的元素。\n\n### 6.3 资源管理\n\
  \n通过定义构造函数、拷贝操作、移动操作和析构函数，程序员可以完全控制包含资源的生命周期（例如容器的元素）。移动构造函数允许对象简单廉地从一个范围移动到另一个范围。这对于性能至关重要。与\
  \ `new` 和 `delete` 从应用程序代码中消失的方式非常相似，我们可以将指针变为资源句柄。在这两种情况下，结果都是代码更简单、更易维护且没有额外的开销。特别是，我们可以实现*强资源安全*；即我们可以消除资源泄漏，例如持有内存的\
  \ `vector`、持有系统线程的 `thread` 以及持有文件的 `fstream`。\n\n在许多语言中，资源管理主要委托给垃圾收集。在 C++ 中，你可以接入垃圾收集。然而，在用尽了更清晰、更通用且更好的局部资源管理替代方案后，我认为垃圾收集是最后的选择。不要产生垃圾！\n\
  \n垃圾收集从根本上是一种全局内存管理方案。聪明的实现可以补偿，但随着系统变得越来越分布式（考虑缓存、多核心和集群），局部性比以往任何时候都重要。\n\n资源句柄（如\
  \ `Vector` 和 `thread`）在许多情况下是直接使用指针的优越替代方案。事实上，“智能指针”（如 `unique_ptr`）本身就是资源句柄 (15.2.1)。使用标准库的\
  \ `vector` 来持有 `thread`，因为直到 §7.2](ch07.xhtml_sec7_2) 我们才能对简单的 `Vector` 进行元素类型的参数化。\n\
  \n[](ch06_images.xhtml_f0079-01a)\n\n```cpp\nstd::vector<thread> my_threads;\n\n\
  Vector init(int n)\n{\n    thread t {heartbeat}; // 并发运行心脏（在单独线程中）\n    my_threads.push_back(std::move(t));\
  \ // 将 t 移动到 my_threads (§16.6)\n    // ... 其他初始化 ...\n\n    Vector vec(n);\n  \
  \  for (auto& x : vec)\n        x = 777;\n    return vec; // 将 vec 移出 init\n}\n\n\
  auto v = init(1 000 000); // 启动心脏并初始化 v\n```\n\n\n\n此外，内存并不是唯一的资源。资源是指任何必须获取并在在使用后（显式或隐式地）释放的实体。例如内存、锁、套接字、文件句柄和线程句柄。意料不用，不仅仅是内存的资源被称为\
  \ `non-memory resource`（非内存资源）。良好的资源管理系统会处理各种资源。在任何长时间运行系统中都必须避免泄漏，但过度的资源保留几乎与泄漏一样糟糕。例如，如果一个系统持有内存、锁、文件等的时间延长了一倍，那么该系统可能需要配置两倍的资源。\n\
  \n在诉诸垃圾回收之前，应系统地使用资源句柄：让每个资源在某个作用域内有一个所有者，并默认在所有者作用域结束时释放。在 C++ 中，这被称为 `RAII`（资源获取即初始化），并以异常的形式与错误处理集成。资源可以使用移动语义或“智能指针”从一个作用域移动到另一个作用域，共享所有权可以通过“共享指针”来表示（§15.2.1）。\n\
  \n在 C++ 标准库中，RAII 无处不在：例如内存（`string`、`vector`、`map`、`unordered_map` 等）、文件（`ifstream`、`ofstream`\
  \ 等）、线程（`thread`）、锁（`lock_guard`、`unique_lock` 等）以及通用对象（通过 `unique_ptr` 和 `shared_ptr`）。结果是实现了在使用时不可见的隐式资源管理，并导致短的资源保留时间。\n\
  \n### 6.4 运算符重载\n\n我们可以为用户定义的类型赋予 C++ 运算符意义（§2.4, §5.2.1）。这被称为 `operator overloading`（运算符重载），因为当在使用时，必须从一组同名的运算符中选择正确的运算符实现。例如，我们在\
  \ `z1+z2` 中复杂的 `+`（§5.2.1）必须区别于整数 `+` 和浮点数 `+`（§1.4.1）。\n\n定义新运算符是不可能的，例如，我们无法定义\
  \ `^^`、`===`、`******`、`$` 或一元的 `%` 运算符。允许这样做带来的混乱将大于收益。\n\n强烈建议定义具有常规语义的运算符。例如，一个执行减法操作的\
  \ `+` 运算符对任何人都没有好处。\n\n我们可以为用户定义的类型（类和枚举）定义运算符：\n\n*   二元算术运算符：`+`、`-`、`*`、`/` 和\
  \ `%`\n*   二元逻辑运算符：`&`（位与）、`|`（位或）和 `^`（位异异）\n*   二元关系运算符：`==`、`!=`、`<`、`<=`、`>`、`>=`\
  \ 和 `<=>`\n*   逻辑运算符：`&&` 和 `||`\n*   一元算术和逻辑运算符：`+`、`-`、`~`（位取反）和!`\n*   赋值：`=`、`+=`、`*=`\
  \ 等\n*   自增和自减：`++` 和 `--`\n*   指针操作：`->`、一元的 `*` 和一元的 `&`\n*   应用（调用）：`()`\n* \
  \  下标：`[]`\n*   逗号：`,`\n*   移位：`>>` 和 `<<`\n\n遗憾的是，我们不能定义运算符点（`.`）来获取智能引用。\n\n运算符可以定义为成员函数：\n\
  \n[](ch06_images.xhtml_f0080-01a)\n\n```\nclass Matrix {\n    // ...\n    Matrix&\
  \ operator=(const Matrix& a); // 将 m 赋值给 *this; 返回对 *this 的引用\n};\n```\n\n按照惯例，这用于修改其第一个操作数的运算符，并且由于历史原因，`=`、`->`、`()`\
  \ 和 `[]` 必须这样做。\n\n或者，大多数运算符可以定义为全局函数：\n\n[](ch06_images.xhtml_f0081-01a)\n\n```\n\
  Matrix operator+(const Matrix& m1, const Matrix& m2); // 将 m1 赋值给 m2 并返回和\n```\n\
  \n将具有对称操作数的运算符定义为全局函数是惯惯例，这样两个操作数被视为相同对待。为了从返回像 `Matrix` 这样的大对象中获得良好的性能，我们依赖于移动语义（§6.2.2）。\n\
  \n### 6.5 常规操作\n\n某些操作在为类型定义时具有常规意义。程序员和库（特别是标准库）通常假假设这些常规意义，因此在设计对这些操作合理的新类型时，遵循这些惯例是明智的。\n\
  \n*   比较：`==`、`!=`、`<`、`<=`、`>`、`>=` 和 `<=>` (§6.5.1）\n*   容器操作：`size()`、`begin()`\
  \ 和 `end()` (§6.5.2）\n*   迭代器和“智能指针”：`->`、`*`、`[]`、`++`、`--`、`+`、`-`、`+=` 和 `-=`\
  \ (§6.5.2）\n*   函数对象：`()` (§15.2.1](#ch15.xhtml_sec15_2_1))\n*   输入和输出：`>>` 和 `<<`\
  \ (§6.5.2）\n*   哈希函数：`<>` (§6.5.2](#ch06.5_2))\n\n#### 6.5.1 比较（关系运算符）\n\n`==` 的意义与\
  \ `!=` 密切相关。例如，如果你定义了默认的 `<=>`，关系运算符会被定义：\n\n[](ch06_images.xhtml_f0082-01a)\n\n\
  ```\nclass R {\n    // ...\n    auto operator<=>(const R& a) const = default;\n\
  };\n\nvoid user(R r1, R r2)\n{\n    bool b1 = (r1<=>r2) == 0;   // r1==r2\n    bool\
  \ b2 = (r1<=>r2) < 0;    // r1<r2\n    bool b3 = (r1<=>r2) > 0;    // r1>r2\n\n\
  \    bool b4 = (r1==r2);\n    bool b5 = (r1<r2);\n}\n```\n\n像 C 的 `strcmp()` 一样，`<=>`\
  \ 实现三路比较。负返回值表示小于，0 表示相等，正值表示大于。如果 `<=>` 定义为非默认，`==` 不会被隐式定义，但 `<` 和其他关系运算符会被定义！例如：\n\
  \n[](ch06_images.xhtml_f0082-02a)\n\n```\nstruct R2 {\n    int m;\n    auto operator<=>(const\
  \ R2& a) const { return a.m == m ? 0 : a.m < m ? -1 : 1; }\n};\n```\n\n在这里，我使用了\
  \ `if`语句的表达式形式：`p?x:y` 是一个评估条件 `p` 的表达式，如果它为真，则 `?:` 表达式的值为 `x`，否则为 `y`。\n\n[](ch06_images.xhtml_f0082-03a)\n\
  \n```\nvoid user(R2 r1, R2 r2)\n{\n    bool b4 { (r1==r2);   // 错误：无默认 ==\n    bool\
  \ b5 = (r1<r2);    // OK\n}\n```\n\n这导致了非平凡类型的这种定义模式：\n\n[](ch06_images.xhtml_f0082-04a)\n\
  \n```\nstruct R3 { /* ...*/ };\n\nauto operator<=>(const R3& a,const R3& b) { /*\
  \ ...*/ }\n\nbool operator==(const R3& a, const R3& b) { /* ...*/ }\n```\n\n\n\n\
  大多数标准库类型（如 `string` 和 `vector`）都遵循这种模式。原因在于，如果一个类型有多个元素参与比较，默认的 `<=>` 会逐个检查它们，从而产生字典序。在这种情况下，额外提供一个独立的、优化的\
  \ `==` 往往是值得的，因为 `<=>` 必须检查所有元素以确定所有三种结果。考虑比较字符字符串：\n\n[](ch06_images.xhtml_f0083-01a)\n\
  \n```\nstring s1 = \"asdfghjkl\";\nstring s2 = \"asdfghjk\";\n\nbool b1 = s1==s2;\
  \    // false\nbool b2 = (s1<=>s2)==0;    // false\n```\n\n使用传统的 `==`，我们通过查看字符数量发现字符串不相等。使用\
  \ `<=>`，我们必须读取 `s2` 的所有字符，才能发现它小于 `s1`，因此不相等。\n\n运算符 `<=>` 还有更多细节，但这些细节主要让库设施的高级实现者感兴趣，他们关注的是超出本书范围的比较和排序。旧版代码不使用\
  \ `<=>`。\n\n### 6.5.2 容器操作\n\n除非有非常有理由不这样做，否则按照标准库容器的风格设计容器（第 12 章）。特别是，通过将其实现为具有适当基本操作的句柄来确保容器资源安全\
  \ (§6.1.1, §6.2)。\n\n标准库容器都知道元素的数量，我们可以通过调用 `size()` 来获取。例如：\n\n[](ch06_images.xhtml_f0083-02a)\n\
  \n```\nfor (size_t i = 0; i!=c.size(); ++i)   // size_t 是标准库 size() 返回的类型名称\n  \
  \  c[i] = 0;\n```\n\n然而，标准算法并不是使用从 `0` 到 `size()` 的索引遍历容器（第 13 章），而是依赖于迭代器对界定的序列概念：\n\
  \n[](ch06_images.xhtml_f0083-03a)\n\n```\nfor (auto p = c.begin(); p!=c.end(); ++p)\n\
  \    *p = 0;\n```\n\n在这里，`c.begin()` 是指向 `c` 第一个元素的迭代器，`c.end()` 指向 `c` 最后一个元素之后。像指针一样，迭代器支持通过\
  \ `++` 移动到下一个元素并通过 `*` 访问指向元素的值。\n\n这些 `begin()` 和 `end()` 函数也用于范围 for 循环实现，因此我们可以简化范围遍历：\n\
  \n```\nfor (auto& x : c)\n    x= 0;\n```\n\n迭代器用于将序列传递给标准库算法。例如：\n\n```\nsort(v.begin(),v.end());\n\
  ```\n\n这种*迭代器模型* (§13.3) 允许极通用性和效率。有关细节和更多容器操作，请参阅 第 12 章 和 第 13 章。\n\n`begin()`\
  \ 和 `end()` 也可以定义为独立函数；见 节 7.2。`const` 容器的 `begin()` 和 `end()` 版本被称为 `cbegin()`\
  \ 和 `cend()`。\n\n### 6.5.3 迭代器与“智能指针”\n\n用户定义的迭代器 (§13.3) 和“智能指针” (§15.2.1) 实现了其目的所需的指针运算符和特性，并根据需要添加了语义。\n\
  \n*   访问：`*`、`->`（用于类）和 `[]`（用于容器）\n*   迭代/导航：`++`（向前）、`--`（向后）、`+=`、`-=`、`+` 和\
  \ `-`\n*   拷贝和/或移动=`\n\n### 6.5.4 输入输出操作\n\n对于整数对，`<<` 意味着左移，`>>` 意味着右移。然而，对于 `iostreams`，它们分别是输出运算符和输入运算符\
  \ (§1.8, 第 11 章)）。有关细节和更多 I/O 操作，请参阅 第 11 章。\n\n### 6.5.5 swap()\n\n许多算法（特别是 `sort()`）使用交换两个对象值的\
  \ `swap()` 函数。此类算法通常假设 `swap()` 非常快且不会抛出异常。标准库提供了 `std::swap(a,b)`，其实现为三次移动操作 (§16.6)。如果你设计了一个拷贝开销大且可能被交换的类型，标准库也提供了通过三次移动操作实现的\
  \ `std::swap(a,b)` (§16.6)。\n\n\n\n\n[7] 默认情况下，将单参数构造函数声明为 `explicit`；§6.1.2; [CG:\
  \ C.46]。\n\n[8] 如果类成员有一个合理的默认值，请作为数据成员初始化器提供它；§6.1.3; [CG: C.48]。\n\n[9] 如果默认值不适用于某种类型，请重新定义或禁止拷贝；§6.1.1;\
  \ [CG: C.61]。\n\n[10] 按值返回容器（依赖拷贝消除和移动语义来提高效率）；§6.2.2; [CG: F.20]。\n\n[11] 避免显式使用\
  \ `std::copy()`；§16.6; [CG: ES.56]。\n\n[12] 对于大操作数，使用 `const` 引用参数类型；§6.2.2; [CG:\
  \ F.16]。\n\n[13] 提供强资源安全性；即，永远不要泄露任何你认为是资源的内容；§6.3; [CG: R.1]。\n\n[14] 如果一个类是资源句柄，它需要一个用户定义的构造函数、析构函数和非默认的拷贝操作；§6.3;\
  \ [CG: R.1]。\n\n[15] 使用 RAII 管理所有资源——内存和非内存资源；§6.3; [CG: R.1]。\n\n[16] 重载操作以模拟惯用用法；§6.5;\
  \ [CG: C.160]。\n\n[17] 如果你重载了一个运算符，请定义所有在惯例上共同工作的操作；§6.1.1, §6.5。\n\n[18] 如果你为类型定义了非默认的\
  \ `<=>`，也定义 `==`；§6.5.1。\n\n[19] 遵循标准库容器的设计；§6.5.2; [CG: C.100]。\n\n# 7\n\n## 模板\n\
  \n*在此输入你的引言。*\n\n*– B. Stroustrup*\n\n* 引言\n* 参数化类型\n    * 受约束的模板参数; 值模板参数; 模板参数推导\n\
  * 参数化操作\n    * 函数模板; 函数对象; Lambda 表达式\n* 模板机制\n    * 变量模板; 别名; 编译时 `if`\n* 建议\n\n\
  ### 7.1 引言\n\n想要一个 vector 的人可能总是想要一个 `double` 类型的 vector。vector 是一个通用的概念，独立于浮点数的概念。因此，vector\
  \ 的元素类型应当被独立表示。`template` 是我们用一组类型或值进行参数化的类或函数。我们使用模板来表示最好被理解为通用概念的想法，通过指定参数可以生成特定的类型和函数，例如将\
  \ `double` 作为 `vector` 的元素类型。\n\n本章侧重于语言机制。第 8 章 介绍了编程技巧，而库章节（第 10 章–第 18 章）提供了许多示例。\n\
  \n### 7.2 参数化类型\n\n我们可以通过将 vector 变为 `template` 并将特定类型 `double` 替换为类型参数，将 double\
  \ vector 类型 (§5.2.2) 泛化为任意类型 vector。例如：\n\n[](ch07_images.xhtml_f0088-01a)\n\n```\n\
  template<typename T>\nclass Vector {\nprivate:\n    T* elem;    // elem 指向 sz 个\
  \ T 类型元素的数组\n    int sz;\npublic:\n    explicit Vector(int s);      // 构造函数：建立不变性，获取资源\n\
  \    ~Vector() { delete[] elem; } // 析构函数：释放资源\n\n    // ... 拷贝和移动操作\n\n    // 重载操作以模拟惯用用法\n\
  \    T& operator[](int i);\n    const T& operator[](int i) const;\n    int size()\
  \ const { return sz; }\n};\n```\n\n`template<typename T>` 前缀使得 `Vector` 成为一种类型。事实上，为\
  \ `Vector<double>` 生成的代码与 第 5 章 中 `Vector` 的代码是相同的。此外，标准库 `vector<double>` 生成的代码可能更好（因为在实现上上付了更多精力）。\n\
  \n\n\n\n\n标准库元素的类型要求稍微有点复杂（§12.2)），但对于我们简单的 `Vector` 来说，`Element` 可以类似于标准库概念 `copyable`（§14.5)）。\n\
  \n尝试对不符合其要求的类型使用模板会导致编译时错误。例如：\n\n[](ch07_images.xhtml_f0090-02a)\n\n```\nVector<int>\
  \ v1;    // OK: 我们可以拷贝一个 int\nVector<thread> v2; // error: 我们无法拷贝标准线程 (§18.2)\n\
  ```\n\n因此，概念（concepts）允许编译器在用点进行类型检查，从而比使用无约束的模板参数能够在更早的阶段提供更好的错误信息。在 C++20 之前，C++\
  \ 官方并不支持概念，因此旧代码使用无约束的模板参数，并将要求留存在文档中。然而，从模板生成的代码是经过类型检查的，因此即使是无约束的模板代码也像手写代码一样类型安全。对于无约束参数，在所有涉及实体的类型可用之前无法进行类型检查，因此它可能会在编译过程的相当晚的阶段发生，即实例化时（§8.5)），而且错误信息通常非常糟糕。\n\
  \n概念检查是一种纯粹的编译时机制，生成的代码与无约束模板生成的代码一样好。\n\n### 7.2.2 值模板参数\n\n除了类型参数外，模板还可以接收值参数。例如：\n\
  \n[](ch07_images.xhtml_f0090-03a)\n\n```\ntemplate<typename T, int N>\nstruct Buffer\
  \ {\n    constexpr int size() { return N; }\n    T elem[N];\n    // ...\n};\n```\n\
  \n值参数在许多上下文中非常有用。例如，`Buffer` 允许我们创建任意大小的缓冲区，而不使用自由存储（动态内存）：\n\n[](ch07_images.xhtml_f0091-01a)\n\
  \n```\nBuffer<char,1024> glob;    // 全局字符缓冲区（静态分配）\n\nvoid fct()\n{\n    Buffer<int,10>\
  \ buf;    // 本地整数缓冲区（在栈上）\n    // ...\n}\n```\n\n遗憾的是，由于某些技术原因，字符串字面量尚未作为模板值参数。然而，在某些上下文中，使用字符串值进行参数化至关重要。幸运的是，我们可以使用持有字符串字符的数组：\n\
  \n[](ch07_images.xhtml_f0091-02a)\n\n```\ntemplate<char* s>\nvoid outs() { cout\
  \ << s; }\n\nchar arr[] = \"Weird workaround!\";\n\nvoid use()\n{\n    outs<\"straightforward\
  \ use\">();    // error（目前）\n    outs<arr>();    // 写入: Weird workaround!\n}\n```\n\
  \n在 C++ 中，通常有替代方案；我们不需要为每种用例提供直接支持。\n\n### 7.2.3 模板参数推导\n\n当定义一个类型作为模板的实例化时，我们必须指定其模板参数。考虑使用标准库模板\
  \ `pair`：\n\n[](ch07_images.xhtml_f0091-03sa)\n\n```\npair<int,double> p = {1, 5.2};\n\
  ```\n\n必须指定模板参数类型可能是繁琐的。幸运的是，在许多情况下，我们可以简单让 `pair` 的构造函数从初始化列表中推导模板参数：\n\n[](ch07_images.xhtml_f0091-03ssa)\n\
  \n```\npair p = {1, 5.2};    // p 是一个 pair<int,double>\n```\n\n容器提供了另一个示例：\n\n[](ch07_images.xhtml_f0091-03a)\n\
  \n```\ntemplate<typename T>\nclass Vector {\npublic:\n    Vector(int);\n    Vector(initializer_list<T>);\
  \    // 初始化列表构造函数\n    // ...\n};\n\nVector v1 {1, 2, 3}; // 从初始化元素类型推导 v1 的元素类型:\
  \ int\nVector v2 = v1;      // 从 v1 的元素类型推导 v2 的元素类型: int\n\nauto p = new Vector{1,\
  \ 2, 3};    // p 是一个 Vector<int>*\n\nVector<int> v3(1);    // 这里我们需要显式指定元素类型（未提到元素类型）\n\
  ```\n\n显然，这简化了符号，并可以消除由于误写冗余模板参数类型引起的烦恼。然而，它并不是万灵药。像所有其他强大的机制一样，推导可能会导致意外。考虑：\n\n\
  [](ch07_images.xhtml_f0092-02a)\n\n```\nVector<string> vs {\"Hello\", \"World\"\
  };      // OK: Vector<string>\nVector vs1 {\"Hello\", \"World\"};             //\
  \ OK: 推导为 Vector<const char*> (意外？)\nVector vs2 {\"Hello\"s, \"World\"s};      \
  \     // OK: 推导为 Vector<string>\nVector vs3 {\"Hello\"s, \"World\"};           \
  \ // error: 初始化列表不是同质的\nVector<string> vs4 {\"Hello\"s, \"World\"};    // OK: 元素类型是显式的\n\
  ```\n\nC 风格字符串字面量的类型是 `const char*` (§1.7.1)。如果这不是 `vs1` 的意图，我们必须显式指定元素类型，或使用 `s`\
  \ 后缀使其成为真正的 `string` (§10.2)。\n\n如果初始化列表的元素类型不同，我们无法推导出唯一的元素类型，因此会导致歧义错误。\n\n有时，我们需要解决歧义。例如，标准库的\
  \ `vector` 有一个构造函数接受一对用于界定序列的迭代器，还有一个可以接受一对值的初始化列表构造函数。考虑：\n\n[](ch07_images.xhtml_f0092-03a)\n\
  \n```\ntemplate<typename T>\nclass Vector {\npublic:\n    Vector(initializer_list<T>);\
  \   // 初始化列表构造函数\n\n    template<typename Iter>\n        Vector(Iter b, Iter e);\
  \    // b:e) 迭代器对构造函数\n\n    struct iterator { using value_type = T; /* ... */ };\n\
  \    iterator begin();\n\n    // ...\n};\n\nVector v1 {1, 2, 3};           // 元素类型为\
  \ int\nVector v2(v1.begin(),v1.begin()+2); // 迭代器对: 元素类型为 int\nVector v3(9,17);\
  \              // error: 歧义\n```\n\n我们可以使用概念 (§[8.2) 来解决这个问题，但标准库和其他许多代码是在语言支持概念之前编写的。在\
  \ `Vector` 声明后添加一个*推导指南*（deduction guide）可以做到这一点：\n\n[](ch07_images.xhtml_f0092-04a)\n\
  \n```\ntemplate<typename Iter>\n    Vector(Iter,Iter) -> Vector<typename Iter::value_type>;\n\
  ```\n\n现在我们有了：\n\n[](ch07_images.xhtml_f0093-01a)\n\n```\nVector v1 {1, 2, 3, 4,\
  \ 5};           // 元素类型为 int\nVector v2(v1.begin(),v1.begin()+2);  // 元素类型为 int\n\
  Vector v3 {v1.begin(),v1.begin()+2}; // 元素类型为 Vector::iterator\n```\n\n`{}` 初始化总是优先\
  \ `initializer_list` 构造函数（如果存在），因此 `v3` 是迭代器向量：`Vector<int>::iterator`。\n\n`()`\
  \ 初始化语法 (§12.2) 通常用于我们不需要 `initializer_list` 的情况。\n\n推导指南的影响通常很微妙，因此最好设计类模板时不需要推导指南。\n\
  \n人们将“类模板参数推导”称为 CTAD。\n\n### 7.3 参数化操作\n\n模板的用途远不止是用元素类型参数化容器。特别是，它们被广泛用于标准库中类型和算法的参数化\
  \ (§12.8, §13.5)）。\n\n*   函数模板\n\n*   函数对象：可以携带数据并像函数一样调用的对象\n\n*   lambda 表达式：函数对象的简写表示法\n\
  \n#### 7.3.1 函数模板\n\n我们可以写这样一个函数，计算任何可以通过 range-for 遍历的序列（例如容器）的元素值和：\n\n[](ch07_images.xhtml_f0093-02a)\n\
  \n```\ntemplate<typename Sequence, typename Value>\nValue sum(const Sequence& s,\
  \ Value v)\n{\n    for (auto x : s)\n        v+=x;\n    return v;\n}\n```\n\n\n\n\
  \n`Value` 模板参数和函数参数 `v` 的目的是允许调用者指定累加器（用于累加和的变量）的类型和初始值：\n\n[](ch07_images.xhtml_f0093-03a)\n\
  \n```cpp\nvoid user(Vector<int>& vi, list<double>& ld, vector<complex<double>>&\
  \ vc)\n{\n    int x = sum(vi,0);                 // int 向量的和（整数相加）\n    double d\
  \ = sum(vi,0.0);            // int 向量的和（浮点数相加）\n    double dd = sum(ld,0.0);   \
  \        // 浮点数列表的和\n    auto z = sum(vc,complex{0.0,0.0}); // complex<double> 向量的和\n\
  }\n```\n\n在 `double` 中添加 `int` 的目的是为了优雅地处理大于最大 `int` 的和。注意 `sum<Sequence,Value>`\
  \ 模板参数的类型是从函数参数推导出来的。幸运的是，我们不需要显式地指定这些类型。\n\n这个 `sum()` 是标准库 `accumulate()` (§17.3)\
  \ 的简化版本。\n\n函数模板可以是成员函数，但不能是 `virtual`（虚）成员函数。编译器 own 程序中此类模板的所有实例化，因此它无法生成 `vtbl`\
  \ (§5.4)。\n\n### 7.3.2 函数对象\n\n一种特别有用的模板是*函数对象*（function object，有时称为 *functor*），它用于定义可以像函数一样调用的对象。例如：\n\
  \n[](ch07_images.xhtml_f0094-01a)\n\n```cpp\ntemplate<typename T>\nclass Less_than\
  \ {\n    const T val;    // 用于比较的值\npublic:\n    Less_than(const T& v) :val{v} {\
  \ }\n    bool operator()(const T& x) const { return x<val; }  // 调用运算符\n};\n```\n\
  \n名为 `operator()` 的函数实现了*应用运算符* `()`，也称为“函数调用”或简单的“调用”。\n\n我们可以为某些参数类型定义 `Less_than`\
  \ 类型的命名变量：\n\n[](ch07_images.xhtml_f0094-02a)\n\n```cpp\nLess_than lti {42};   \
  \           // lti(i) 将使用 < 比较 i 和 42 (i<42)\nLess_than lts {\"Backus\"s};     \
  \  // lts(s) 将使用 < 比较 s 和 \"Backus\" (s<\"Backus\")\nLess_than<string> lts2 {\"\
  Naur\"}; // \"Naur\" 是 C 风格字符串，所以我们需要 <string> 来获取正确的 <\n```\n\n我们可以像调用函数一样调用这样的对象：\n\
  \n[](ch07_images.xhtml_f0094-03a)\n\n```cpp\nvoid fct(int n, const string& s)\n\
  {\n    bool b1 = lti(n);    // 如果 n<42 则为真\n    bool b2 = lts(s);    // 如果 s<\"\
  Backus\" 则为真\n    // ...\n}\n```\n\n函数对象被广泛用算法参数。例如，我们可以统计谓词返回 `true` 的值的出现次数：\n\
  \n[](ch07_images.xhtml_f0094-04a)\n\n```cpp\ntemplate<typename C, typename P>\n\
  int count(const C& c, P pred)  // 假设 C 是容器，P 是作用于元素的谓词\n{\n    int cnt = 0;\n  \
  \  for (const auto& x : c)\n        if (pred(x))\n            ++cnt;\n    return\
  \ cnt;\n}\n```\n\n这是标准库 `count_if` 算法 (§13.5) 的简化版本。\n\n给定概念 (§8.2)，我们可以形式化 `count()`\
  \ 对其参数的假设并在编译时检查这些假设。\n\n*谓词*（predicate）是我们可以调用以返回 `true` 或 `false` 的东西。例如：\n\n\
  [](ch07_images.xhtml_f0095-01a)\n\n```cpp\nvoid f(const Vector<int>& vec, const\
  \ list<string>& lst, int x, const string& s)\n{\n    cout << \"number of values\
  \ less than \" << x << \": \" << count(vec,Less_than{x}) << '\\n';\n    cout <<\
  \ \"number of values less than \" << s << \": \" << count(lst,Less_than{s}) << '\\\
  n';\n}\n```\n\n在这里，`Less_than{x}` 了一个类型为 `Less_than<int>` 的对象，其调用运算符与名为 `x` 的 `int`\
  \ 值进行比较；`Less_than{s}` 构造了一个与名为 `s` 的 `string` 值进行比较的对象。\n\n函数对象的优之处在于它们携带了用于比较的值。我们不需要为每个值（以及每个类型）编写单独的函数，也不引入糟糕的全局变量来存储值。此外，对于像\
  \ `Less_than` 这样简单的函数对象，捕获列表是简单的。\n\n\n\n\n```cpp\ntemplate<class S>\nvoid rotate_and_draw(vector<S>&\
  \ v, int r)\n{\n    for_each(v,[](auto& s){ s->rotate(r); s->draw(); });\n}\n```\n\
  \n在这里，与变量声明一样，`auto` 意味着接受任何类型的值作为初始化器（在调用时，参数被视为初始化形式参数）。这使得带有 `auto` 参数的 lambda\
  \ 变成了一个模板，即*泛型 lambda*（generic lambda）。当需要时，我们可以用概念（concept）对参数进行约束 (§8.2)）。例如，我们可以定义\
  \ `Pointer_to_class` 要求支持 `*` 和 `->`，并编写：\n\n[](ch07_images.xhtml_f0096-04a)\n\n\
  ```cpp\nfor_each(v,[](Pointer_to_class auto& s){ s->rotate(r); s->draw(); });\n\
  ```\n\n我们可以使用这个泛型 `rotate_and_draw()` 来处理任何可以 `draw()` 和 `rotate()` 的对象的容器。例如：\n\
  \n[](ch07_images.xhtml_f0097-01a)\n\n```cpp\nvoid user()\n{\n    vector<unique_ptr<Shape>>\
  \ v1;\n    vector<Shape*> v2;\n    // ...\n    rotate_and_draw(v1,45);\n    rotate_and_draw(v2,90);\n\
  }\n```\n\n为了更严格的检查，我们可以定义一个 `Pointer_to_Shape` 概念，指定类型类型作为形状时所需的属性。这将允许我们使用并非派自\
  \ `Shape` 类的形状。\n\n### 7.3.3.2 用于初始化的 Lambda\n\n使用 lambda，我们可以将任何语句转换为表达式。这主要用于提供一个操作来计算值作为参数值，但这种能力是通用的。考虑一个复杂的初始化：\n\
  \n[](ch07_images.xhtml_f0097-02a)\n\n```cpp\nenum class Init_mode { zero, seq, cpy,\
  \ patrn };    // 初始化替代方案\n\nvoid user(Init_mode m, int n, vector<int>& arg, Iterator\
  \ p, Iterator q)\n{\n    vector<int> v;\n\n    // 混乱的初始化代码：\n\n    switch (m) {\n\
  \        case zero:\n            v = vector<int>(n);    // n 个元素初始化为 0\n       \
  \     break;\n        case cpy:\n            v = arg;\n            break;\n    };\n\
  \n    // ...\n\n    if (m == seq)\n        v.assign(p,q);    // 从序列 p:q) 拷贝\n\n\
  \    // ...\n}\n```\n\n这是一个风格化的示例，但遗憾的是并不并不见。我们需要在一组替代方案中选择初始化数据结构（这里是 `v`），并且为不同的替代方案执行不同的计算。这种代码通常是混乱的，被认为是为了“效率”所的，而且是\
  \ bug 的来源：\n\n*   变量可能在获取预期值之前就被使用。\n*   “初始化代码”可能与其他代码混合在一起，导致难以理解。\n*   当“初始化代码”与其他代码混合在一起时，更容易遗漏某个分支。\n\
  *   这不是初始化，而是赋值 (§[1.9.2)。\n\n相反，我们可以将其转换为用作初始化器的 lambda：\n\n[](ch07_images.xhtml_f0098-01a)\n\
  \n```cpp\nvoid user(Init_mode m, int n, vector<int>& arg, Iterator p, Iterator q)\n\
  {\n    vector<int> v = [&] {\n        switch (m) {\n            case zero:\n   \
  \             return vector<int>(n);    // n 个元素初始化为 0\n            case seq:\n\
  \                return vector<int>{p,q};  // 从序列 p:q) 拷贝\n            case cpy:\
  \         \n                return arg;\n        }\n    }();\n\n    // ...\n}\n\
  ```\n\n我仍然“遗忘”了一个 `case`，但现在更容易被发现了。在很多情况下，编译器会发现问题并发出警告。\n\n### 7.3.3.3 最后\n\n\
  析构函数为对象使用后的清理工作提供了一种通用且隐式的机制（RAII；§[6.3)），但如果我们需要执行某些与单个对象无关的清理工作，或者与没有析构函数的对象关联（例如，因为它是与\
  \ C 程序共享的类型）该怎么办？我们可以定义一个函数 `finally()`，它接受一个要在离开作用域时执行的动作：\n\n[](ch07_images.xhtml_f0098-02a)\n\
  \n```cpp\nvoid old_style(int n)\n{\n    void* p = malloc(n*sizeof(int));    // C\
  \ 风格\n    auto act = finally([&]{free(p);});  // 在作用域退出时调用 lambda\n    // ...\n\
  }// p 在作用域退出时被隐式释放\n```\n\n这是临时的做法，但比试图在函数的所有出口处都正确且一致地调用 `free(p)` 要好得多。\n\n`finally()`\
  \ 函数非常简单：\n\n[](ch07_images.xhtml_f0098-03a)\n\n```cpp\ntemplate <class F>\n[[nodiscard]]\
  \ auto finally(F f)\n{\n    return Final_action{f};\n}\n```\n\n等待，我看到提供的源文本末尾存在一些重复。我将根据逻辑流合并最后部分。\n\
  \n### 7.4 机制\n\n标准库使用变量模板来提供数学常数，例如 `pi` 和 `log2e` (§17.9)。\n\n#### 7.4.1 变量模板\n\
  \n当我们使用类型时，通常需要常数。这里有一个模板的示例：\n\n[](ch07_images.xhtml_f0099-02a)\n\n```cpp\ntemplate\
  \ <class T>\n    constexpr T viscosity = 0.4;\n\ntemplate <class T>\n    constexpr\
  \ space_vector<T> external_acceleration = { T{}, T{-9.8}, T{} };\n\nauto vis2 =\
  \ viscosity<double>;\nauto acc = external_acceleration<float>;\n```\n\n在这里，`space_vector`\
  \ 是一个三维向量。\n\n#### 7.4.2 别名\n\n意外的是，为类型或模板引入别名是有用的。例如，标准头文件 `<cstddef>` 包含别名 `size_t`\
  \ 的定义，可能是：\n\n```cpp\nusing size_t = unsigned int;\n```\n\n名为 `size_t` 的实际类型取决于实现，因此在另一个实现中\
  \ `size_t` 可能是 `unsigned long`。拥有别名 `size_t` 允许程序员编写可移植的代码。\n\n参数化类型为与与其模板参数相关的类型提供别名是非常普遍的。例如：\n\
  \n```cpp\ntemplate<typename T>\nclass Vector {\npublic:\n    using value_type =\
  \ T;\n    // ...\n};\n```\n\n\n\n\n\n事实上，每个标准库容器都提供了 `value_type` 作为其元素类型的名称（参见第\
  \ 12 章）。这使得我们能够编写适用于所有遵循这一惯例容器的代码。例如：\n\n[](ch07_images.xhtml_f0100-03a)\n\n```\n\
  template<typename C>\nusing Value_type = C::value_type;    // C 的元素的类型\n\ntemplate<typename\
  \ Container>\nvoid algo(Container& c)\n{\n    Vector<Value_type<Container>> vec;\
  \    // 将结果存储在此处\n    // ...\n}\n```\n\n这个 `Value_type` 是标准库 `range_value_t` (§16.4.4)\
  \ 的简化版本。别名机制可以用于通过绑定部分或全部模板参数来定义一个新模板。例如：\n\n[](ch07_images.xhtml_f0101-01a)\n\n\
  ```cpp\ntemplate<typename Key, typename Value>\nclass Map {\n    // ...\n};\n\n\
  template<typename Value>\nusing String_map = Map<string,Value>;\n\nString_map<int>\
  \ m;    // m 是一个 Map<string,int>\n```\n\n### 7.4.3 编译时 if\n\n考虑编写一个可以使用两个函数 `slow_and_safe(T)`\
  \ 或 `simple_and_fast(T)` 之一来实现的操作。这类问题在基础代码中随处可见，在其中通用性和最优性能至关重要。如果涉及到类层次结构，基类可以提供\
  \ `slow_and_safe` 通用操作，而派生类可以使用 `simple_and_fast` 实现来重写。\n\n另一种，我们可以使用编译时 `if`：\n\
  \n[](ch07_images.xhtml_f0101-02a)\n\n```cpp\ntemplate<typename T>\nvoid update(T&\
  \ target)\n{\n    // ...\n    if constexpr(is_trivially_copyable_v<T>)\n       \
  \ simple_and_fast(target);  // 用于“普通旧数据”\n    else\n        slow_and_safe(target);\
  \    // 用于更复杂的类型\n    // ...\n}\n```\n\n`is_trivially_copyable_v<T>` 是一个类型谓词 (§16.4.1)，它告诉我们一个类型是否可以平凡复制。\n\
  \n编译器只检查 `if constexpr` 的被选分支。这种解决方案提供了最优的性能和优化的局部性。\n\n重要的是，`if constexpr` 不是一种文本处理机制，不能用于打破语法、类型和作用域的常规规则。例如，这里有一个简单且失败的尝试，试图条件地将调用包裹在\
  \ `try`-块中（此处应为包裹在 `try` 块中，原文意为逻辑示例）：\n\n[](ch07_images.xhtml_f0101-03a)\n\n```cpp\n\
  template<typename T>\nvoid bad(T arg)\n{\n    if constexpr(!is_trivially_copyable_v<T>)\n\
  \        try {    // 哎，if 延伸到了这一行之后\n\n    g(arg);\n\n    if constexpr(!is_trivially_copyable_v<T>)\n\
  \        } catch(...) { /* ... */ }    // 语法错误\n}\n```\n\n允许此类文本处理可能会严重损害代码的可读性，并为依赖现代程序表示技术的工具（如“抽象语法树”）带来问题。\n\
  \n许多此类尝试的黑科技也是没有必要的，因为有不违反作用域规则的更整洁的解决方案。例如：\n\n[](ch07_images.xhtml_f0102-02a)\n\
  \n```cpp\ntemplate<typename T>\nvoid good(T arg)\n{\n    if constexpr (is_trivially_copyable_v<T>)\n\
  \        g(arg);\n    else\n        try {\n            g(arg);\n        }\n    \
  \    catch (...) { /* ... */ }\n}\n```\n\n### 7.5 建议\n\n[1] 使用模板适用于许多参数类型的算法；§7.1；[CG:\
  \ T.2]。\n\n[2] 使用模板表示容器；§7.2；[CG: T.3]。\n\n[3] 使用模板提高代码的抽象层次；§7.2；[CG: T.1]。\n\n\
  [4] 模板是类型安全的，但对于无约束的模板，检查得太晚；§7.2。\n\n[5] 让构造函数或函数模板推导类模板参数类型；§7.2.3。\n\n[6] 使用函数对象作为算法的参数；§7.3.2；[CG:\
  \ T.40]。\n\n[7] 如果你只需要在一个地方使用简单的函数对象，请使用 lambda；§7.3.2。\n\n[8] 虚函数成员不能是模板成员函数；§7.3.1。\n\
  \n[9] 使用 `finally()` 为没有需要“清理操作”的析构函数的类型提供 RAII 支持；§[7.3.3.3]。\n\n[10] 使用模板别名来简化符号并隐藏实现；§7.4。\n\
  \n[11] 使用 `if constexpr` 提供替代实现；§7.4。\n\n# 8 概念与泛型编程\n\n### 8.1 引言\n\n模板是什么用的？换句话说，什么是有效的？模板第一个最常见的用途是支持*泛型编程*，即专注于通用算法的设计、实现和使用。在这里，“通用”意味着只要满足算法的要求，就可以接受各种类型。结合概念，模板是\
  \ C++ 支持泛型编程的主要。模板提供了（编译时）多态。\n\n### 8.2 概念\n\n考虑来自 §7.3.1](#ch07.xhtml_sec7_3_1)\
  \ 的 `sum()`：\n\n[](08_images.xhtml_f0104-01a)\n\n```cpp\ntemplate<typename Seq,\
  \ typename Value>\nValue sum(Seq s, Value v)\n{\n    for (const auto& x : s)\n \
  \       v+=x;\n    return v;\n}\n```\n\n这个 `sum()` 要求\n\n*   第一个模板参数是某种序列，且\n\n\
  *   第二个模板参数是某种数字。\n\n更具体地说，`sum()` 可以为一对参数调用：\n\n*   序列 `Seq`，支持 `begin()` 和 `end()`，以便范围-**for**\
  \ 循环可以工作（参见 §1.7](#ch01.xhtml_sec1_7)；§14.1](#ch14.xhtml_sec14_1)）。\n\n*   算术类型\
  \ `Value`，支持 `+=`，以便序列中的元素可以相加。\n\n我们将此类要求称为*概念*。\n\n满足这些简化要求（以及更多）作为序列（也称为*范围*）的类型示例包括标准库\
  \ **vector**、**list** 和 **map**。满足这些简化要求（以及更多）作为算术类型的类型示例包括 **int**、**double** 和\
  \ **Matrix**（对于任何合理的 **Matrix** 定义）。\n\n\n\n\n\n大多数模板参数必须满足特定要求，模板才能正确编译，生成的代码才能正常工作。这意味着，大多数模板应该是受约束模板（§7.2.1)）。类型名称标识符\
  \ `typename` 是约束最少的，它仅要求参数是一个类型。通常，我们可以做得比这更好。再次考虑 `sum()`：\n\n[](ch08_images.xhtml_f0104-02a)\n\
  \n```\ntemplate<Sequence Seq, Number Num>\nNum sum(Seq s, Num v)\n{\n    for (const\
  \ auto& x : s)\n        v+=x;\n    return v;\n}\n```\n\n这要清晰得多。一旦我们定义了概念 `Sequence`\
  \ 和 `Number` 的含义，编译器就可以通过查看 `sum()` 的接口来拒绝错误的调用，而不需要查看它的实现。这改进了错误报告。\n\n然而，`sum()`\
  \ 接口的规范是不完整的：我“忘记”说明了我们应该能够将 `Sequence` 的元素加到 `Number` 上。我们可以做到：\n\n[](ch08_images.xhtml_f0105-01a)\n\
  \n```\ntemplate<Sequence Seq, Number Num>\n    requires Arithmetic<range_value_t<Seq>,Num>\n\
  Num sum(Seq s, Num n);\n```\n\n序列的 `range_value_t` (§16.4.4) 是该序列中元素的类型；它来自标准库，在其中命名了\
  \ `range` (§14.1) 元素的类型。`Arithmetic<X,Y>` 是一个概念，规定对类型为 `X` 和 `Y` 的数字进行算术运算。这避免了我们意外尝试计算\
  \ `vector<string>` 或 `vector<int****>` 的 `sum()`，同时仍然接受 `vector<int>` 和 `vector<complex<double>>`。通常，当算法需要不同类型的参数时，这些类型之间存在某种关系，显式说明这种关系更好。\n\
  \n在这个例子中，我们只需要 `+=`，但为了简单和灵活，我们不应该将模板参数约束得太紧。特别是，也许有一天我们可能想用 `+` 和 `=` 来表示 `sum()`\
  \ 而不是 `+=`，那时我们就会很高兴使用了一个通用的概念（这里是 `Arithmetic`），而不是一个狭隘的“拥有 `+=`”的要求。\n\n像第一个使用概念的\
  \ `sum()` 那样，部分规范是非常有用的。除非规范是完整的，否则某些错误在实例化之前才会被发现。然而，即使是部分规范也表达了意图，对于平滑的增量开发至关重要，因为在初期我们可能无法识别出所有需要的要求。有了成熟的概念库，初始规范将接近完美。\n\
  \n意乎的是，`requires Arithmetic<range_value_t<Seq>,Num>` 被称为 `requirements` 子句。`template<Sequence\
  \ Seq>` 仅仅是显式使用 `requires Sequence<Seq>` 的简写。如果我喜欢冗长，我可以等价地写成：\n\n[](ch08_images.xhtml_f0105-02a)\n\
  \n```\ntemplate<typename Seq, typename Num>\n    requires Sequence<Seq> && Number<Num>\
  \ && Arithmetic<range_value_t<Seq>,Num>\nNum sum(Seq s, Num n);\n```\n\n另一方面，我们也可以利用两种符号之间的等效性来写：\n\
  \n[](ch08_images.xhtml_f0105-03a)\n\n```\ntemplate<Sequence Seq, Arithmetic<range_value_t<Seq>>\
  \ Num>\nNum sum(Seq s, Num n);\n```\n\n在尚无法使用 `concept` 的代码库中，我们必须依靠命名规范和注释，例如：\n\
  \n[](ch08_images.xhtml_f0105-04a)\n\n```\ntemplate<typename Sequence, typename Number>\n\
  \    // requires Arithmetic<range_value_t<Sequence>,Number>\nNumber sum(Sequence\
  \ s, Number n);\n```\n\n无论我们选择何种符号，设计一个对其参数具有具有语义意义约束的模板都是重要的（§8.2.4)）。\n\n### 8.2.2\
  \ 基于概念的重载\n\n一旦我们正确地指定了模板及其接口，就可以根据它们的属性进行重载，就像处理函数一样。考虑一个稍微简化的标准库函数 `advance()`，它移动迭代器\
  \ (§13.3)：\n\n[](ch08_images.xhtml_f0106-01a)\n\n```\ntemplate<forward_iterator\
  \ Iter>\nvoid advance(Iter p, int n)    // 将 p 向移动 n 个元素\n{\n    while (n--)\n \
  \       ++p;    // 前向迭代器有 ++，但没有 + 或 +=\n}\n\ntemplate<random_access_iterator Iter>\n\
  void advance(Iter p, int n)    // 将 p 向移动 n 个元素\n{\n    p+=n;    // 随机访问迭代器有 +=\n\
  }\n```\n\n编译器将选择满足参数最大要求的模板。在这种情况下，`list` 只提供前向迭代器，而 `vector` 提供随机访问迭代器，因此我们得到：\n\
  \n[](ch08_images.xhtml_f0106-01a)\n\n```\ntemplate<forward_iterator Iter>\nvoid\
  \ advance(Iter p, int n) // 将 p 向移动 n 个元素\n{\n    while (n--)\n        ++p;    //\
  \ 前向迭代器有 ++，但没有 + 或 +=\n}\n\ntemplate<random_access_iterator Iter>\nvoid advance(Iter\
  \ p, int n) // 将 p 向移动 n 个元素\n{\n    p+=n;    // 随机访问迭代器有 +=\n}\n```\n等等，文本说“编译器将选择满足参数最大要求的模板。在这种情况下，`list`\
  \ 只提供前向迭代器，但 `vector` 提供随机访问迭代器，因此我们得到：”后面跟着图片。让我根据提供的文本重新格式化：\n\n```\ntemplate<forward_iterator\
  \ Iter>\nvoid advance(Iter p, int n) // 将 p 向移动 n 个元素\n{\n    while (n--)\n    \
  \    ++p;    // 前向迭代器有 ++，但没有 + 或 +=\n}\n\ntemplate<random_access_iterator Iter>\n\
  void advance(Iter p, int n) // 将 p 向移动 n 个元素\n{\n    p+=n;    // 随机访问迭代器有 +=\n}\n\
  ```\n实际上，源代码文本有一个奇怪的重复。我将严格遵循提供的文本：\n\n编译器将选择满足参数最大要求的模板。在这种情况下，`list` 只提供前向迭代器，但\
  \ `vector` 提供随机访问迭代器，因此我们得到：\n\n[](ch08_images.xhtml_f0106-01a)\n\n```\ntemplate<forward_iterator\
  \ Iter>\nvoid advance(Iter p, int n) // 将 p 向移动 n 个元素\n{\n    while (n--)\n    \
  \    ++p;    // 前向迭代器有 ++，但没有 + 或 +=\n}\n\ntemplate<random_access_iterator Iter>\n\
  void advance(Iter p, int n) // 将 p 向移动 n 个元素\n{\n    p+=n;    // 随机访问迭代器有 +=\n}\n\
  ```\n实际上，源代码文本有一个重复。我将按照提供的文本结构：\n\n编译器将选择满足参数最大要求的模板。在这种情况下，`list` 只提供前向迭代器，但 `vector`\
  \ 提供随机访问迭代器，因此我们得到：\n\n```\ntemplate<forward_iterator Iter>\nvoid advance(Iter p,\
  \ int n) // 将 p 向移动 n 个元素\n{\n    while (n--)\n        ++p;    // 前向迭代器有 ++，但没有\
  \ + 或 +=\n}\n\ntemplate<random_access_iterator Iter>\nvoid advance(Iter p, int n)\
  \ // 将 p 向移动 n 个元素\n{\n    p+=n;    // 随机访问迭代器有 +=\n}\n```\n等等，再次查看源代码，它说：“编译器将选择满足参数最大要求的模板。在这种情况下，`list`\
  \ 只提供前向迭代器，但 `vector` 提供随机访问迭代器，因此我们得到：”后面跟着一个代码块。然后它重复道：“编译器将选择满足参数最大要求的模板。在这种情况下，`list`\
  \ 只提供前向迭代器，但 `vector` 提供随机访问迭代器，因此我们得到：”后面也是一个代码块。查询中提供的文本是冗余的。我将提供该文本的格式化版本。\n\n\
  ```\ntemplate<forward_iterator Iter>\nvoid advance(Iter p, int n) // 将 p 向移动 n 个元素\n\
  {\n    while (n--)\n        ++p;    // 前向迭代器有 ++，但没有 + 或 +=\n}\n\ntemplate<random_access_iterator\
  \ Iter>\nvoid advance(Iter p, int n) // 将 p 向移动 n 个元素\n{\n    p+=n;    // 随机访问迭代器有\
  \ +=\n}\n```\n等等，我看到了我分析中的错误。提示中提供的用户文本有点乱。我将只格式化一次。\n\n### 8.2.3 有效代码\n\n一组模板参数是否提供了模板要求的内容，归结为某些表达式是否有效。\n\
  \n使用 `requires` 表达式，我们可以检查一组表达式是否有效。例如，我们可能尝试在未使用标准库概念 `random_access_iterator`\
  \ 的情况下编写 `advance()`：\n\n```\ntemplate<forward_iterator Iter>\n    requires requires(Iter\
  \ p, int i) { p[i]; p+i; } // Iter 有下标和整数加法\nvoid advance(Iter p, int n) // 将 p\
  \ 向移动 n 个元素\n{\n    p+=n;\n}\n```\n不，那 `requires requires` 不是输入错误。第一个 `requires`\
  \ 开始 `requirements` 子句，第二个 `requires` 开始 `requires` 表达式。\n\n```\nrequires(Iter p,\
  \ int i) { p[i]; p+i; }\n```\n\n`requires` 表达式是一个谓词，如果它内部的语句有效则为 `true`，否则为 `false`。\n\
  \n我将 `requires` 表达式视为泛型编程的汇编代码。与普通的汇编代码一样，`requires` 表达式极其灵活且不实施任何编程纪律。以某种形式，它们位于大多数有趣的通用代码的底部，就像汇编代码位于大多数有趣的普通代码底部。它们属于抽象的实现。如果你在代码中看到\
  \ `requires requires`，它可能太底层了，最终会变成一个问题。在 `advance()` 中使用 `requires requires` 是故意不优雅且拙劣的。注意我“忘记”指定\
  \ `+=` 以及操作所需的返回类型。因此，某些 `advance()` 版本的用法将通过概念检查但仍然无法编译。你已经收到警告了！正确的随机访问版本 `advance()`\
  \ 更简单且更易读：\n\n[](ch08_images.xhtml_f0107-02a)\n\n\n\n\n```\ntemplate<random_access_iterator\
  \ Iter>\nvoid advance(Iter p, int n)    // move p n elements forward\n{\n    p+=n;\
  \    // a random-access iterator has +=\n}\n```\n\n优先使用命名良好且具有明确定义语义的概念（§8.2.4），并在定义这些概念时主要使用\
  \ `requires`表达式。\n\n### 8.2.4 概念的定义\n\n我们在库中可以发现许多有用的概念，例如标准库中的 `forward_iterator`（§14.5）。对于类和函数，通常使用良好库中的概念比编写一个新概念要容易，但定义简单的概念并不困难。标准库中的名称（如\
  \ `random_access_iterator` 和 `vector`）都是小写的。在这里，我遵循将自己定义的概念名称首字母大写的约定，例如 `Sequence`\
  \ 和 `Vector`。\n\n概念是一个编译时谓词，规定了一个或多个类型如何被使用。首先考虑最简单的例子之一：\n\n[](ch08_images.xhtml_f0107-03a)\n\
  \n```cpp\ntemplate<typename T>\nconcept Equality_comparable =\n    requires (T a,\
  \ T b) {\n        { a == b } -> Boolean;    // 使用 == 比较 Ts\n        { a != b } ->\
  \ Boolean;    // 使用 != 比较 Ts\n    };\n```\n\n`Equality_comparable` 是我们用来确保可以比较某种类型的相等和不相等值的概念。我们简单地说，给定该类型的两个值，它们必须能够使用\
  \ `==` 和 `!=` 进行比较，且这些操作的结果必须是 `Boolean`。例如：\n\n[](ch08_images.xhtml_f0108-01a)\n\
  \n```cpp\nstatic_assert(Equality_comparable<int>);  // 成功\n\nstruct S { int a; };\n\
  static_assert(Equality_comparable<S>);    // 失败，因为结构体不会获得 == 和 !=\n```\n\n`Equality_comparable`\
  \ 概念的定义与英文描述完全等价，不再如此。`concept` 的值始终是 `bool`。\n\n在 `->` 之后指定的 `{ ... }` 的结果必须是一个概念。遗憾的是，标准库并没有\
  \ `boolean` 概念，所以我定义了一个（§14.5）。`Boolean` 仅仅意味着可以作为条件使用的类型。\n\n定义 `Equality_comparable`\
  \ 来处理非同构比较同样简单：\n\n[](ch08_images.xhtml_f0108-02a)\n\n```cpp\ntemplate<typename\
  \ T, typename T2 =T>\nconcept Equality_comparable =\n    requires (T a, T2 b) {\n\
  \        { a == b } -> Boolean;    // 使用 == 比较一个 T 和 T2\n        { a != b } -> Boolean;\
  \    // 使用 != 比较一个 T 和 T2\n        { b == a } -> Boolean;    // 使用 == 比较一个 T2 和\
  \ T\n        { b != a } -> Boolean;    // 使用 != 比较一个 T2 和 T\n    };\n```\n\n`typename\
  \ T2 =T` 表示如果不指定第二个模板参数，`T2` 将与 `T` 相同；`T` 是一个*默认模板参数*。\n\n我们可以这样测试 `Equality_comparable`：\n\
  \n[](ch08_images.xhtml_f0108-03a)\n\n```cpp\nstatic_assert(Equality_comparable<int,double>);\
  \ // 成功\nstatic_assert(Equality_comparable<int>);        // 成功（T2 默认为 int）\nstatic_assert(Equality_comparable<int,string>);\
  \ // 失败\n```\n\n这个 `Equally_comparable` 与标准库中的 `equality_comparable`（§14.5）几乎相同。\n\
  \n现在我们可以定义一个要求数字之间算术运算有效的概念。首先，我们需要定义 `Number`：\n\n[](ch08_images.xhtml_f0108-04a)\n\
  \n```cpp\ntemplate<typename T, typename U = T>\nconcept Number =\n    requires(T\
  \ x, U y) {   // 包含算术运算和零\n        x+y; x-y; x*y; x/y;\n        x+=y; x-=y; x*=y;\
  \ x/=y;\n        x=x;    // 拷贝\n        x=0;\n    };\n```\n\n这没有对结果类型做任何假设，但对于简单使用已经足够。给定一个参数类型，`Number<X>`\
  \ 检查 `X` 是否具有 `Number` 的所需属性。给定两个参数，`Number<X,Y>` 检查两个类型是否可以使用所需的操作一起使用。此，我们可以定义自己的\
  \ `Arithmetic` 概念（§8.2.1）：\n\n[](ch08_images.xhtml_f0109-01a)\n\n```cpp\ntemplate<typename\
  \ T, typename U = T>\nconcept Arithmetic = Number<T,U> && Number<U,T>;\n```\n\n\
  对于更复杂的例子，考虑一个序列：\n\n[](ch08_images.xhtml_f0109-02a)\n\n```cpp\ntemplate<typename\
  \ S>\nconcept Sequence = requires (S a) {\n    { a.begin() } -> same_as<typename\
  \ S::iterator_type>;\n    { a.end() } -> same_as<typename S::iterator_type>;\n};\n\
  ```\n\n\n\n\n在开发和维护大型代码库时，两者都至关重要。为了这一重要收益所付出的代价是，某些错误（例如在仅保证可以使用 `==` 的地方使用了 `<`）在编译过程的后期才会被捕获（§8.5）。\n\
  \n### 8.2.5 概念与 `auto`\n\n`auto` 关键字可以表示对象的类型应该是其初始化器的类型（§1.4.2）：\n\n[](ch08_images.xhtml_f0110-03a)\n\
  \n```\nauto x = 1;                    // x 是一个 int\nauto z = complex<double>{1,2};\
  \ // z 是一个 complex<double>\n```\n\n然而，初始化不仅发生在简单的变量定义中：\n\n[](ch08_images.xhtml_f0110-04a)\n\
  \n```\nauto g() { return 99; }          // g() 返回一个 int\n\nint f(auto x) { /* ...\
  \ */ }       // 接受任意类型的参数\n\nint x = f(1);                    // 此 f() 接受一个 int\n\
  int z = f(complex<double>{1,2}); // 此 f() 接受一个 complex<double>\n```\n\n`auto` 关键字表示对值约束最少的概念：它仅要求该必须是某种类型的值。使用\
  \ `auto` 参数会将函数变成一个模板函数。\n\n在给定概念的情况下，我们可以通过在 `auto` 之前加上一个概念来加强所有此类初始化的要求。例如：\n\
  \n[](ch08_images.xhtml_f0111-01a)\n\n```\nauto twice(Arithmetic auto x) { return\
  \ x+x; } // 仅针对数字\nauto thrice(auto x) { return x+x+x; }         // 针对任何有 + 操作的对象\n\
  \nauto x1 = twice(7);    // OK: x1==14\nstring s \"Hello \";\nauto x2 = twice(s);\
  \    // 错误：string 不是 Arithmetic\nauto x3 = thrice(s);   // OK x3 == \"Hello Hello\
  \ Hello \"\n```\n\n除了约束函数参数外，概念还可以约束变量的初始化：\n\n[](ch08_images.xhtml_f0111-02a)\n\
  \n```\nauto ch1 = open_channel(\"foo\");            // 适用于 open_channel() 返回的类型\n\
  Arithmetic auto ch2 = open_channel(\"foo\"); // 错误：channel 不是 Arithmetic\nChannel\
  \ auto ch3 = open_channel(\"foo\");    // OK：假设 Channel 是合适的概念\n               \
  \                // 且 open_channel() 返回该类型\n```\n\n这对于防止过度使用 `auto` 以及为使用泛型函数的代码记录要求非常有用。\n\
  \n为了可读性和调试，让类型错误尽可能在接近源头的地方被捕获通常是重要的。约束返回类型可以有所帮助：\n\n[](ch08_images.xhtml_f0111-03a)\n\
  \n```\nNumber auto some_function(int x)\n{\n    // ...\n    return fct(x);    //\
  \ 除非 fct(x) 返回 Number，否则会报错\n    // ...\n}\n```\n\n自然地，我们可以通过引入局部变量来实现这一点：\n\n[](ch08_images.xhtml_f0111-04a)\n\
  \n```\nauto some_function(int x)\n{\n    // ...\n    Number auto y = fct(x);   \
  \ // 除非 fct(x) 返回 Number，否则会报错\n    return y;\n    // ...\n}\n```\n\n然而，那有点冗长，而且并非所有类型都可以廉价地复制。\n\
  \n### 8.2.6 概念与类型\n\n类型：\n\n*   指定了可以隐式或显式应用于对象的操作集\n*   依赖于函数声明和语言规则\n*   指定了对象在内存中的布局方式\n\
  \n单参数概念：\n\n*   指定了可以隐式或显式应用于对象的操作集\n*   依赖于反映函数声明和语言规则的使用模式\n*   对对象的布局一无未言\n*\
  \   允许使用一组类型\n\n因此，使用概念约束代码比使用类型约束代码更具灵活性。此外，概念可以定义多个参数之间的关系。我的理想是，最终大多数函数将定义为模板函数，并对其参数由概念约束。遗憾的是，目前对这种表示法的支持还不完美：我们必须将概念作为形容词，而不是名词。例如：\n\
  \n[](ch08_images.xhtml_f0112-01a)\n\n```\nvoid sort(Sortable auto&); // 需要 'auto'\n\
  void sort(Sortable&);      // 错误：概念名后需要 'auto'\n```\n\n### 8.3 泛型编程\n\nC++ 直接支持的泛型编程形式核心在于：从具体的、高效的算法抽象出来，以获得泛型算法，这些算法可以与不同的数据表示相结合，产生各种有用软件\
  \ [Stepanov,2009]。代表基本操作和数据结构的抽象被称为概念。\n\n#### 8.3.1 概念的使用\n\n良好且实用的概念是基础性的，它们的发现多于设计。例如，整数和浮点数（即使在经典\
  \ C 中也有定义 [Kernighan,1978]）、序列，以及更通用的数学概念，如环和向量。\n\n#### 8.3.2 使用模板进行抽象\n\n良好的抽象是从具体的示例中精心培养出来的。通过尝试准备每种可能的需求和技术来“抽象”并不是一个好主意；那样会导致不优雅和代码膨肿。相反，应该从一个（或多个）真实使用的具体示例开始，并尝试消除不必要的细节。\n\
  \n\n\n\n- 初始值现在是一个输入；累加器的类型就是该初始值的类型。\n\n快速的检查或——更好的是——测量将表明，为各种数据结构的调用生成的代码与你手动编写的示例代码是相同的。考虑以下：\n\
  \n[](ch08_images.xhtml_f0113-03a)\n\n```cpp\nvoid use(const vector<int>& vec, const\
  \ list<double>& lst)\n{\n    auto sum = accumulate(begin(vec),end(vec),0.0);   \
  \ // 在 double 中累加\n    auto sum2 = accumulate(begin(lst),end(lst),sum);\n    //\
  \ ...\n}\n```\n\n从具体的代码（最好是好几段代码）泛化并同时保持性能的 same 被称为 `lifting`（提升）。相反，开发一个模板的最佳方法通常是：\n\
  \n* 首先，编写一个具体的版本\n* 然后对其进行调试、测试和测量\n* 最后，将具体类型替换为模板参数。\n\n自然地，`begin()` 和 `end()`\
  \ 的重复是冗余的，因此我们可以稍微简化用户界面：\n\n[](ch08_images.xhtml_f0114-01a)\n\n```cpp\ntemplate<forward_range\
  \ R, Arithmetic<value_type_t<R>> Val>\nVal accumulate(const R& r, Val res = 0)\n\
  {\n    for (auto x : r)\n        res += x;\n    return res;\n}\n```\n\n`range` 是一个标准库概念，表示一个具有\
  \ `begin()` 和 `end()` 的序列 (§13.1)。为了完全的泛化性，我们也可以抽象 `+=` 操作；见 §17.3。\n\n`accumulate()`\
  \ 的迭代器对版本和范围版本都是用的：迭代器对版本用于泛化，范围版本用于常见用例的简单性。\n\n### 8.4 变参模板\n\n可以定义一个模板来接受任意数量、任意类型的参数。这种模板被称为`变参模板`（variadic\
  \ template）。考虑一个简单的函数，用于输出具有 `<<` 运算符的任何类型的值：\n\n[](ch08_images.xhtml_f0114-02a)\n\
  \n```cpp\nvoid user()\n{\n    print(\"first: \", 1, 2.2, \"hello\\n\"s);    // first:\
  \ 1 2.2 hello\n\n    print(\"\\nsecond: \", 0.2, 'c', \"yuck!\"s, 0, 1, 2, '\\n');\
  \    // second: 0.2 c yuck! 0 1 2\n}\n```\n\n传统上，实现变参模板的方法是将第一个参数与其他参数分离，然后对参数的尾部递归调用变参模板：\n\
  \n[](ch08_images.xhtml_f0114-03a)\n\n```cpp\ntemplate<typename T>\nconcept Printable\
  \ = requires(T t) { std::cout << t; } // 仅一个操作！\n\nvoid print()\n{\n    // 无参数的情况：什么都不做\n\
  }\n\ntemplate<Printable T, Printable... Tail>\nvoid print(T head, Tail... tail)\n\
  {\n    cout << head << ' '; // 首先，我们对 head 执行的操作\n    print(tail...);      // 然后，我们对\
  \ tail 执行的操作\n}\n```\n\n`Printable...` 表示 `Tail` 是一个类型序列。`Tail...` 表示 `tail` 是 `Tail`\
  \ 中类型对应的值序列。用 `...` 声明的参数被称为`参数包`（parameter pack）。在这里，`tail` 是一个（函数参数）参数包，其元素类型是（模板参数）参数包\
  \ `Tail` 中的类型。因此，`print()` 可以接受任意数量、任意类型的参数。\n\n`print()` 的调用将参数分为头部（第一个）和尾部（剩余）。打印头部，然后对尾部调用\
  \ `print()`。最终，`tail` 将将变为空，因此我们需要一个无参数的 `print()` 版本来处理这种情况。如果我们不想允许零参数的情况，可以使用编译时\
  \ `if` 来消除掉那一个 `print()`：\n\n[](ch08_images.xhtml_f0115-01a)\n\n```cpp\ntemplate<Printable\
  \ T, Printable... Tail>\nvoid print(T head, Tail... tail)\n{\n    cout << head <<\
  \ ' ';\n    if constexpr(sizeof...(tail) > 0)\n        print(tail...);\n}\n```\n\
  \n我使用了编译时 `if` (§7.4.3) 而不是普通的运行时 `if`，以避免生成最后的 `print()` 调用。鉴于此，不需要定义“空的” `print()`。\n\
  \n变参模板的优势在于它们可以接受你提供的任何参数。缺点包括：\n\n* 递归实现很难正确编写。\n* 接口的类型检查可能是复杂的模板程序。\n* 类型检查代码是随时的，而不是定义在标准中的。\n\
  * 递归实现在编译时间和编译器内存需求上可能异常昂。\n\n由于其灵活性，变参模板在标准库中被广泛使用，有时甚至过度使用。\n\n#### 8.4.1 折叠表达式\
  \ (Fold Expressions)\n\n为了简化变参模板的实现，C++ 提供了对参数包的有限形式迭代。折叠（fold）并不一定执行数值计算。考虑一个著名的例子：\n\
  \n[](ch08_images.xhtml_f0114-02a)\n\n```cpp\ntemplate<Printable ...T>\nvoid print(T&&\
  \ args)\n{\n    (std::cout << ... args) << '\\n';    // 打印所有参数\n}\n\nprint(\"Hello!\"\
  s, ' ', \"World \", 2017);    // (((std::cout << \"Hello!\"s) << ' ') << \"World\
  \ \") << 2017) << '\\n');\n```\n\n*Fold*（折叠）是一种非常强大的抽象，与标准库的 `accumulate()` 密切相关，在不同的语言和社区中有多种名称。在\
  \ C++ 中，折叠表达式目前限于 2017 年 (§19.2.3)。\n\n折叠有四种类型：左折叠、右折叠、一元左折叠和一元右折叠。\n\n左折叠 `(pack\
  \ op init)` 展开为 `((pack1 op pack2) ... op init)`。右折叠 `(init op pack)` 展开为 `(init\
  \ op (pack1 op pack2))`。一元左折叠 `(pack op op)` 展开为 `((op pack1) op pack2)`。一元右折叠 `(pack\
  \ op op)` 展开为 `(pack1 op (op pack2))`。\n\n\n\n\n\n在调用点，模板的参数将根据其概念（concepts）进行检查。在这里发现的错误将立即报告。在此时无法检查的内容（例如未约束模板参数的参数）将推迟到为一组模板参数生成模板代码时处理：即“模板实例化时”。\n\
  \n实例化时类型检查的一个遗憾副作用是，类型错误可能在非常晚的阶段才被检测到（§8.2.4.1）。此外，晚期检查通常会导致极其糟糕的错误信息，因为编译器没有能够提供程序员意图提示的类型信息，而且通常在结合了程序中多个处的信息后才能检测出问题。\n\
  \n为模板提供的实例化时类型检查检查了模板定义中参数的使用。这提供了一种通常被称为`鸭子类型`（duck typing）的编译时变（“如果它走起来像鸭子，叫起来也像鸭子，它就是鸭子”）。或者——使用更技术术语来说——我们对值进行操作，而操作的存在和意义完全取决于其操作数的值。这与另一种观点不同，对象具有类型，类型决定了操作的存在和意义。值“存在”于对象中。这是\
  \ C++ 中对象（例如变量）的工作方式，只有符合对象要求的值才能被放入其中。在编译时使用模板执行的操作大部分不涉及对象，只有值。例外是`constexpr`函数（§1.6）中的局部变量，它们在编译器内部被当作对象使用。\n\
  \n要使用未约束的模板，其定义（而不只是声明）必须在调用点处于作用域内。当使用头文件和`#include`时，这意味着模板定义必须在头文件中找到，而不是在`.cpp`\
  \ 文件中。例如，标准头文件`<vector>` 包含了 `vector` 的定义。\n\n当我们开始使用模块（§3.2.2）时，情况发生了变化。使用模块，源代码可以像普通函数和模板函数一样进行组织。模块被半编译为一种表示形式，使其能够快速`import`\
  \ 和使用。将该表示形式视为一个易于遍历的图，包含了所有可用的作用域和类型信息，并由符号表支持以快速访问单个实体。\n\n### 8.6 建议\n\n[1] 模板为编译时编程提供了一种通用机制；§8.1。\n\
  \n[2] 在设计模板时，仔细考虑为其模板参数所假设的概念（要求）；§8.3.2。\n\n[3] 在设计模板时，使用一个具体版本进行初始实现、调试和测量；§8.3.2。\n\
  \n[4] 将概念作为一种设计工具；§8.2.1。\n\n[5] 为所有模板参数指定概念；§8.2；[CG: T.10]。\n\n[6] 尽可能使用命名的概念（例如标准库概念）；§8.2.4§§14.5；[CG:\
  \ T.11]。\n\n[7] 如果你只需要在一个地方使用简单的函数对象，请使用 lambda；§7.3.2。\n\n[8] 使用模板来表示容器和范围；§8.3.2；[CG:\
  \ T.3]。\n\n[9] 避免没有意义语义的“概念”；§8.2；[CG: T.20]。\n\n[10] 为一个概念要求完整的操作集；§8.2；[CG: T.21]。\n\
  \n[11] 使用命名的概念§8.2.3。\n\n[12] 避免 `requires requires`；§8.2.3。\n\n[13] `auto` 是约束性最小的概念§8.2.5。\n\
  \n[14] 当你需要一个接受各种类型可数量参数的函数时，使用变长模板；§8.4。\n\n[15] 模板提供了编译时的“鸭子类型”；§8.5。\n\n[16]\
  \ 使用头文件时，在每个使用它们的编译单元中`#include` 模板定义（而不只是声明）；§8.5。\n\n[17] 使用模板时，确保其定义（而不只是声明）在作用域内；§8.5。\n\
  \n[18] 未约束的模板提供了编译时的“鸭子类型”；§8.5。\n\n# 9 库概览\n\n*既然无知是瞬间完成的，何必浪费时间学习呢？*\n\n*– 霍布斯*\n\
  \n*   引言\n*   库组件\n*   库组织\n    *   命名空间\n    *   模块\n    *   头文件\n*   建议\n\n###\
  \ 9.1 引言\n\n没有重要的程序是只用基础语言编写的。首先，开发一套库。这些库构成了基础。用基础语言编写程序是枯燥的，而使用良好的库可以使任何任务变得简单。\n\
  \n接下来的第 1 章到第 8 章之后，第 9 章到第 18 章将对关键设施进行快速介绍。我非常简要地介绍了常用的类型，如 `string`、`ostream`、`variant`、`vector`、`map`、`path`、`unique_ptr`、`thread`、`regex`、`system_clock`、`time_zone`\
  \ 和 `complex`，以及它们常用的方法。本章的目的是传递基础理解。\n\n### 9.2 库组件\n\n标准库提供的设施分类如下：\n\n*   运行时支持（分配、异常和运行时类型信息）。\n\
  *   C 标准库（经过微调以减少类型系统违规）。\n*   支持国际字符集、本地化和字符串只读视图的字符串§10.2。\n*   正则表达式匹配的支持§10.4。\n\
  *   以可移植方式操作文件系统的库§11.9。\n\n\n\n\n\n# C++ 标准库\n\n*   一个容器框架（如 `vector` 和 `map`；第\
  \ 12 章）和算法框架（如 `find()`、`sort()` 和 `merge()`；第 13 章）。该框架通常被称为 STL [Stepanov,1994]，它是可扩展的，用户可以添加自己的容器和算法。\n\
  *   范围（Ranges）（§14.1），包括视图（§14.2）、生成器（§14.3）和管道（§14.4）。\n*   基本类型和范围的概念（Concepts）（§14.5）。\n\
  *   对数值计算的支持，例如标准数学函数、复数、带有算术运算的向量、数学常数和随机数生成器（§5.2.1 和 第 16 章）。\n*   对并发编程的支持，包括\
  \ `thread` 和锁（第 18 章）。并发支持是基础性的，用户可以通过库的形式添加新并发模型的支持。\n*   同步和异步协程（§18.6）。\n*  \
  \ 大多数 STL 算法以及某些数值算法的并行版本，例如 `sort()`（§13.6）和 `reduce()`（§17.3.1）。\n*   支持元编程的实用程序（例如，类型函数；§16.4）、STL\
  \ 风格的泛型编程（例如 `pair`；§15.3.3）以及通用编程（例如 `variant` 和 `optional;` §15.4.1，§15.4.2）。\n\
  *   用于资源管理的“智能指针”（例如 `unique_ptr` 和 `shared_ptr`；§15.2.1）。\n*   特殊用途容器，如 `array`（§15.3.1）、`bitset`（§15.3.2）和\
  \ `tuple`（§15.3.3）。\n*   对绝对时间和持续时间的支持，例如 `time_point` 和 `system_clock`（§16.2.1）。\n\
  *   对日历的支持，例如 `month` 和 `time_zone`（§16.2.2，§16.2.3）。\n*   常用单位的后缀，例如用于毫秒的 `ms`\
  \ 和用于虚数的 `i`（§6.6）。\n*   操作元素序列的方法，例如视图（§14.2）、`string_view`（§10.3）和 `span`（§15.2.2）。\n\
  \n将类包含在库中的标准是：\n*   它对几乎每个 C++ 程序员（无论是新手还是专家）都有帮助。\n*   它能以通用形式提供，且与该功能的简单版本相比，不会增加显著的开销。\n\
  *   简单用法应该易于学习（相对于其任务固有的复杂性而言）。\n\n本质上，C++ 标准库提供了最常见的基础数据结构以及用于这些结构的基础算法。\n\n##\
  \ 9.3 标准库组织\n\n标准库的功能放置在 `std` 命名空间中，并通过模块或头文件向用户提供。\n\n### 9.3.1 命名空间\n\n每个标准库功能都通过某些标准头文件提供。例如：\n\
  \n```cpp\n#include<string>\n#include<list>\n```\n\n使得标准的 `string` 和 `list` 可用。\n\
  \n标准库定义在名为 `std` 的命名空间中（§3.3）。使用标准库功能时可以使用 `std::` 前缀：\n\n```cpp\nstd::string sheep\
  \ {\"Four legs Good; two legs Baaad!\"};\nstd::list<std::string> slogans {\"War\
  \ is Peace\", \"Freedom is Slavery\", \"Ignorance is strength\"};\n```\n\nC++ 标准库提供了最常见的基础数据结构以及用于这些结构的基础算法。\n\
  \n使用标准库功能时可以使用 `std::` 前缀：\n\n```cpp\nstd::string sheep {\"Four legs Good; two legs\
  \ Baaad!\"};\nstd::list<std::string> slogans {\"War is Peace\", \"Freedom is Slavery\"\
  , \"Ignorance is strength\"};\n```\n\nC++ 标准库提供了最常见的基础数据结构以及用于这些结构的基础算法。\n\n使用标准库功能时可以使用\
  \ `std::` 前缀：\n\n```cpp\nstd::string sheep {\"Four legs Good; two legs Baaad!\"\
  };\nstd::list<std::string> slogans {\"War is Peace\", \"Freedom is Slavery\", \"\
  Ignorance is strength\"};\n```\n\nC++ 标准库提供了最常见的基础数据结构以及用于这些结构的基础算法。\n\n使用标准库功能时可以使用\
  \ `std::` 前缀：\n\n```cpp\nstd::string sheep {\"Four legs Good; two legs Baaad!\"\
  };\nstd::list<std::string> slogans {\"War is Peace\", \"Freedom is Slavery\", \"\
  Ignorance is strength\"};\n```\n\nC++ 标准库提供了最常见的基础数据结构以及用于这些结构的基础算法。\n\n使用标准库功能时可以使用\
  \ `std::` 前缀：\n\n```cpp\nstd::string sheep {\"Four legs Good; two legs Baaad!\"\
  };\nstd::list<std::string> slogans {\"War is Peace\", \"Freedom is Slavery\", \"\
  Ignorance is strength\"};\n```\n\nC++ 标准库提供了最常见的基础数据结构以及用于这些结构的基础算法。\n\n使用标准库功能时可以使用\
  \ `std::` 前缀：\n\n```cpp\nstd::string sheep {\"Four legs Good; two legs Baaad!\"\
  };\nstd::list<std::string> slogans {\"War is Peace\", \"Freedom is Slavery\", \"\
  Ignorance is strength\"};\n```\n\nC++ 标准库提供了最常见的基础数据结构以及用于这些结构的基础。\n\n（注：提供的文本包含大量重复片段和碎片，此处已根据指令进行清理和重构。）\n\
  \n标准库提供了几个用于字面量的子命名空间：\n*   `std::literals::chrono`：`y`（年）、`d`（天）、`h`（小时）、`min`（分钟）、`ms`（毫秒）、`ns`（纳秒）、`s`（秒）、`us`（微秒）。\n\
  *   `std::literals::complex`：`i` 用于虚数双精度浮点数。\n*   `std::literals::string`：`s` 用于字符串。\n\
  *   `std::literals::string_view`：`sv` 用于字符串视图。\n\n## 9.3.2 **ranges** 命名空间\n\n标准库提供了算法，如\
  \ `sort()` 和 `copy()`，分为两个版本：\n*   传统的接收迭代器对的版本；例如 `sort(begin(v),v.end())`。\n*\
  \   接收单个范围的范围版本；例如 `sort(v)`。\n\n理想情况下，这两个版本应该能够完美重载。然而，事实并非如此。例如：\n\n```cpp\nusing\
  \ namespace std;\nusing namespace ranges;\n\nvoid f(vector<int>& v) {\n    sort(v.begin(),v.end());\
  \ // 错误：歧义\n    sort(v);                 // 错误：歧义\n}\n```\n\n为了在使用无约束模板时防止冲突，标准要求我们显式地将标准库的范围版本引入作用域：\n\
  \n```cpp\nusing namespace std;\n\nvoid g(vector<int>& v) {\n    sort(v.begin(),v.end());\
  \    // OK\n    sort(v);                    // 错误：在 std 中未找到匹配函数\n    ranges::sort(v);\
  \            // OK\n    using ranges::sort;         // 从此处起 sort(v) OK\n    sort(v);\
  \                    // OK\n}\n```\n\n### 9.3.3 模块\n\n目前还没有标准库模块。C++23 可能会弥补这一缺失。目前，我使用可能标准的\
  \ `module std`，它提供了 `namespace std` 中的所有功能。\n\n### 9.3.4 头文件\n\n以下是一些标准库头文件，均在 `std`\
