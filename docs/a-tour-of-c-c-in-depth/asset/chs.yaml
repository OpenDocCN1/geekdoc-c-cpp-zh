  \ 1974. |\n\n## 19.5 建议\n\n1. 学习 C++ 时，使用 C 和 C++ 的通用子集。\n2. 在为新项目选择风格时，依赖 C++ 核心指南；\n\
  3. 在现代化代码库时，不要孤立地关注语言特性；\n4. 在使用新功能之前，通过编写小型程序来测试其实现。\n5. 为了可移植性和类型安全，如果你必须使用 C，请编写通用子集。\n\
  6. 将 C 转换为 C++ 时，重命名与 C++ 关键字相同的变量。\n7. 将 C 转换为 C++ 时，将 `malloc()` 的结果转换为适当类型或将所有\
  \ `malloc()` 更改为 `new`。\n8. 将 `malloc()` 和 `free()` 转换为 `new` 和 `delete` 时，考虑使用\
  \ `vector`、`push_back()` 和 `reserve()` 代替 `realloc()`。\n9. C++ 中没有整数到枚举的隐式转换；必要时使用显式类型转换。\n\
  10. 对于每个标准 C 头 `<X.h>` 将命名放在全局命名空间，对应的 `<cX>` 将命名放在 `std` 命名空间。\n11. 在声明 C 函数时使用\
  \ `extern \"C\"`；\n12. 避免强制转换；\n13. 优先使用 `string` 而不是 C 风格字符串（直接操作零终止字符数组）；\n14.\
  \ 优先使用 `iostream` 而不是 `stdio`；\n15. 优先使用命名强制转换（如 `static_cast`）而不是 C 风格强制转换。\n\n\
  # A\n\n## Module std\n\n*一项发明的伟大之处在于，你必须拥有一个完整的运行系统。*\n*– J. Presper Eckert*\n\n\
  * 引言\n* 使用实现提供的功能\n* 头文件\n* 制作自己的 **module std**\n* 建议\n\n### A.1 引言\n\n在编写本文时，**module\
  \ std** [Stroustrup,2021b] 遗憾尚未成为标准的一部分。我有理由相信它将成为 C++23 的一部分。\n\n**module std**\
  \ 的理念是通过单一的 `import std;` 语句，简单且廉价地使用标准库的所有组件。我在整个章节中都依赖于这一点。提及和命名头文件主要是是因为它们是传统且通用的，部分是因为它们反映了标准库（不完美的）的历史组织。\n\
  \n\n\n\n\n一些标准库组件会将名称（例如来自 `<cmath>` 的 `sqrt()`）导出到全局命名空间。模块 `std` 并没有这样做，但当我们需要获取此类全局名称时，可以使用\
  \ `import std.compat`。导入 `std.compat` 而不是 `std` 的唯一真正充分理由是：在不破坏旧代码库的同时，仍然可以从模块带来的编译速度提升中获益。\n\
  \n请注意，模块是非常刻意地不导出宏（macros）。如果你需要宏，请使用 `#include`。模块和头文件是共存的；也就是说，如果你同时 `#include`\
  \ 和 `import` 一组相同的声明，你将得到一个一致的程序。这对于大型代码库从依赖头文件向使用模块的演进至关重要。\n\n### A.2 使用实现提供的功能\n\
  \n运气好的话，我们想要使用的实现已经有了 `module std`。在这种情况下，我们的首选应该是使用它。它可能被标记为“实验性”（experimental），并且使用它可能需要一些设置或几个编译器选项。因此，首先要探索该实现是否具有\
  \ `module std` 或等效项。例如，目前（2022 年春季）Visual Studio 提供了许多“实验性”模块，因此使用该实现，我们可以这样定义模块\
  \ `std`：\n\n```cpp\nexport module std;\nexport import std.regex;            // <regex>\n\
  export import std.filesystem;    // <filesystem>\nexport import std.memory;    \
  \   // <memory>\nexport import std.threading;     // <atomic>, <condition_variable>,\
  \ <future>, <mutex>,\n                                                 // <shared_mutex>,\
  \ <thread>\nexport import std.core;             // 其他所有\n```\n\n为了让这些生效，我们显然必须使用\
  \ C++20 编译器，并设置选项以访问实验性模块。注意，所有“实验性”的内容都会随时间改变。\n\n### A.3 使用头文件\n\n如果一个实现尚未支持模块，或者尚未提供\
  \ `module std` 或等效项，我们可以回到使用传统的头文件。它们是标准且随处可。障碍在于，为了让示例运行，我们需要找出需要哪些头文件并 `#include`\
  \ 它们。第 9 章可以提供此帮助，我们可以在 Cppreference 上查找想要使用的特性名称，查看它属于哪个头文件。如果这很繁琐，我们可以将常用的头文件收集到一个\
  \ `std.h` 头文件中：\n\n```cpp\n// std.h\n\n#include <iostream>\n#include <string>\n\
  #include <vector>\n#include <list>\n#include <memory>\n#include <algorithms>\n//\
  \ ...\n```\n\n然后\n\n```cpp\n#include \"std.h\"\n```\n\n这里的问题是，`#include` 这么多内容会导致编译非常缓慢\
  \ [Stroustrup,2021b]。\n\n### A.4 编写你自己的 module std\n\n这是最没有吸引力的替代方案，因为它可能是工作量最大的，但一旦有人完成了，就可以共享：\n\
  \n```cpp\nmodule;\n#include <iostream>\n#include <string>\n#include <vector>\n#include\
  \ <list>\n#include <memory>\n#include <algorithms>\n// ...\n\nexport module std;\n\
  export istream;\nexport ostream;\nexport iostream;\n// ...\n```\n\n有一个捷径：\n\n```cpp\n\
  export module std;\n\nexport import \"iostream\";\nexport import \"string\";\nexport\
  \ import \"vector\";\nexport import \"list\";\nexport import \"memory\";\n// ...\n\
  ```\n\n导入*头文件单元*（header unit）是模块和头文件之间的折中方案。它将头文件转换成类似模块的东西，但它也可以将名称注入全局空间（类似于 `#include`），并且会泄露宏。它的编译速度不像\
  \ `#include` 那么慢，但也没有构建良好的模块快。\n\n### A.5 建议\n\n1. 优先使用实现提供的模块 (A.2)。\n2. 使用模块 (A.3)。\n\
  3. 优先使用命名模块而非头文件单元 (A.4)。\n4. 使用标准库中的宏和全局名称，请 `import std.compat` (A.1)。\n5. 避免宏\
  \ (A.1)。\n\n# 索引\n\n两种知识。我们自己了解某个主题，或者我们知道在哪里可以找到关于它的信息。\n\n- `container` 容器 169\n\
