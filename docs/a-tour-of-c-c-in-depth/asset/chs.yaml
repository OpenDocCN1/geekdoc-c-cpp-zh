  \n自然，一个 C 程序是用 C 风格编写的，例如 K&R [Kernighan,1988] 中使用的风格。这意味着指针和数组的广泛使用，可能还有许多宏。这些设施在大型程序中很难可靠地使用。\n\
  \n[1] 声明一个变量之前，并立即初始化它，例如在 `for`语句的初始化器和条件中。\n\n[2] 不要使用 `malloc()`。`new` 运算符 (§5.2.2)\
  \ 能更好地完成相同的工作；而不是 `realloc()`，请尝试 `vector` (§6.3](#ch06.xhtml_sec6_3), 12.2)。\n\n\
  [3] 避免使用 `void*`、`union` 和强制转换，除非在某些函数或类的实现内部。这些用法限制了从类型系统中获得的支持并损害性能。\n\n[4] 如果必须使用显式类型转换，使用适当的命名转换（例如\
  \ `static_cast`; (§5.2.3)）来更精确地陈你正在做什么。\n\n\n\n\n\n[11] 对于简单的数组遍历，请使用 `range-for`\
  \ (§1.7)。它比传统的 C 循环更容易编写、速度更快且更安全。\n\n[12] 使用 `nullptr` (§1.7.1) 而不是 `0` 或 `NULL`。\n\
  \n[13] 不要假设用 C 风格费力编写的代码（避开 C++ 特性，如类、模板和异常）会比更短的替代方案（例如，使用标准库设施）更高效。通常情况下（但当然不是总是如此），情况恰恰相反。\n\
  \n### 19.3.2.2 void*\n\n在 C 语言中，`void*` 可以用作对任何指针类型变量进行赋值或初始化的右值操作数；在 C++ 中则可能不行。例如：\n\
  \n[](ch19_images.xhtml_f0270-01a)\n\n```\nvoid f(int n)\n{\n    int* p = malloc(n*sizeof(int));\
  \  /* not C++; in C++, allocate using “new”*/\n    // ...\n}\n```\n\n这可能是最难处理的不兼容性问题。注意，将\
  \ `void*` 转换为不同指针类型的隐式转换通常并非无害：\n\n[](ch19_images.xhtml_f0271-01a)\n\n```\nchar\
  \ ch;\nvoid* pv = &ch;\nint* pi = pv;                  // not C++\n*pi = 666;  \
  \                    // overwrite ch and other bytes near ch\n```\n\n在两种语言中，都要将\
  \ `malloc()` 的结果转换为正确的类型。如果你只使用 C++，请避免使用 `malloc()`。\n\n### 19.3.2.3 链接\n\nC 和\
  \ C++ 可以（且通常也是）实现为使用不同的链接规范。最根本的原因是 C++ 对类型检查的重视。一个实用的原因是 C++ 支持重载，因此可以存在两个名为 `open()`\
  \ 的全局函数。这必须反映在链接器的工作方式上。\n\n要给 C++ 函数赋予 C 链接（以便可以从 C 程序片段调用），或允许从 C++ 程序片段调用 C 函数，请将其声明为\
  \ `extern \"C\"`。例如：\n\n[](ch19_images.xhtml_f0271-02a)\n\n```\nextern \"C\" double\
  \ sqrt(double);\n```\n\n现在 `sqrt(double)` 可以从 C 或 C++ 代码片段中调用。`sqrt(double)` 的定义也可以被编译为\
  \ C 函数或 C++ 函数。\n\n在一个作用域内，给定名称的函数只能有一个 C 链接（因为 C 不允许函数重载）。链接规范不影响类型检查，因此 C++ 的函数调用和参数检查规则仍然适用于声明为\
  \ `extern \"C\"` 的函数。\n\n## 19.4 参考文献\n\n| *[Boost]* | *The Boost Libraries: 免费同行评审的可移植\
