  \    * 空指针\n* 测试\n    * 赋值; 初始化\n* 建议\n\n### 1.1 引言\n本章非正式介绍了 C++ 的表示法、C++ 的内存与计算模型以及将代码组织成程序的各种机制。这些是支持\
  \ C 语言中常见风格（有时被称为*过程化编程*）的语言设施。\n\n### 1.2 程序\n\n\n![Images](img/f0002-01.jpg)\n\
  \n可执行程序是针对特定的硬件/系统组合创建的；它不是可移植的，例如无法从 Android 设备迁移到 Windows 电脑。当我们谈论 C++ 程序的移植性时，我们通常指的是源代码的可移植性；也就是说，源代码可以在多种系统上成功编译并运行。\n\
  ISO C++ 标准定义了两种实体：\n\n* *核心语言特征*，例如内置类型（例如 `char` 和 `int`）和循环（例如 `for`-语句和 `while`-语句）\n\
  * *标准库组件*，例如容器（例如 `vector` 和 `map`）和 I/O 操作（例如 `<<` 和 `getline()`）\n标准库组件是每个 C++\
  \ 实现都提供的、完全普通的 C++ 代码。也就是说，C++ 标准库可以用 C++ 自身来实现（并且在处理 `thread` 上下文切换等任务时仅使用了极少量的机器代码）。这意味着\
  \ C++ 具有足够的表达能力和效率来处理最最苛刻的系统编程任务。\n\nC++ 是一种静态类型化语言。这意味着，每个实体（例如对象、值、名称和表达式）的类型在它们使用时必须是编译器知的。实体的类型决定了对其可以执行的操作。\n\
