  md: '# # Dynamic Memory and the String Class


    If you have a C++ compiler created in the past 5 or 10 years, you almost have
    support for the Standard Template Library (STL), and that includes support for
    the automatic new string class described in Chapter 7—in addition to old-fashioned
    C-strings (arrays of char).


    But in this chapter, we are going to write our own version of the string class,
    calling it String. Why go to this trouble? Because the String class, even though
    it''s already provided for you, provides a perfect demonstration of many things
    you need to consider when writing your own classes, including the use of the new,
    delete, and this keywords.


    And by some chance you don''t have a compiler that supports STL, you can always
    use the String class presented in this chapter.


    # ## Dynamic Memory: the “new” Keyword


    As you become more experienced with C++, you''ll find you need dynamic memory
    allocation. This big phrase means you can create new data "on the fly" in response
    to the needs of dynamic. Dynamic memory gives you more direct control over when
    data is allocated. It''s also an aspect of memory in which there is a use for
    pointers.


    Up till now, I''ve described pointer operations in two familiar steps: Allocate
    data by declaring a variable, and then assign its address to a pointer:


    ```

    int n;

    int *p = 4;

    ```


    This procedure is perfectly fine for simple programs. But such statements either
    static data (which is created just once, at the beginning of the program) or automatic
    (local variables). Automatic variables are allocated in response to a function
    call.


    With dynamic memory allocation, which is more flexible, C++ uses the new keyword.


    ![](img/a7964e9035b7ca0710b559c70a60c09a_234_0.png)


    This syntax is an expression that produces a pointer to the specified type. The
    type can be any C++ standard type or a class. For example:


    ```

    int *p;

    p = new int;

    ```


    You can combine these two statements into one:


    The effect of this statement is to create an unnamed integer variable, accessible
    only through a pointer,


    ![](img/a7964e9035b7ca0710b559c70a60c09a_234_1.png)


    ```

    int *p = new int;

    ```


    By using the pointer, you can (as usual) manipulate the value of the integer and
    use it in expressions.


    ```

    *p = 5;

    *p += 1;

    cout << "The value of the integer is " << *p;

    ```


    This approach gives you control over when the memory is allocated. Each use of
    new causes memory allocation at runtime. You can therefore control memory allocation,
    creating new items in response to runtime conditions.


    The operator has a counterpart, an operator that gives back the memory that new
    requested. This is the delete operator, which has the'
