  md: '# Interlude: Interlude for Math Junkies


    A little reflection shows why the lowest divisor is a prime number. Suppose we
    test a positive whole number and A is the lowest divisor is not a prime, it must
    have at least one divisor of its own, B, that is not equal to 1 or A.


    But if B divides into A and B is a divisor of the target number, then B must also
    be a divisor of the target further. B is less than A. Therefore, the hypothesis
    that the lowest divisor is not prime results in a contradiction.


    This is easy to see by example. Any number by 4 (a nonprime) is also divisible
    by 2 (a prime). The prime factors will always be found, as long as you keep looking
    for the lowest divisor.


    # Exercises


