    \ is stored in double format.\n\nHere's an example:\n\n```\nint a = 0xFF;    \
    \      // Assign 1111 1111 (256) to a.\nint b = 0100;          // Assign octal\
    \ 100 (64) to b.\ndouble x = 3.1415;     // Assign ft. number\n(double)\ny z =\
    \ 3.0;           // Assign ft. pt. number\ndouble z = 1.6e5;     // Use of scientific\
    \ notation:\n                       // 1.6 times to the 10th\n```\n\nIn addition,\
    \ several suffixes may affect how the value of a literal is stored. Storage of\
    \ a literal can sometimes matter because it can affect the precision, how it is\
    \ converted, or how a function has applied later on to copy the data to another\
    \ location. Furthermore, some integer values cannot be represented without the\
    \ proper suffix.\n\n+   - The L suffix indicates storage of an integer in long\
    \ format. long long is equivalent to int on most computers used today.\n- The\
    \ U suffix indicates storage of an unsigned int. (This doubles the range supported\
    \ for positive numbers; \"Two's Complement Format for Signed Integers\" in this\
    \ appendix).\n- The F suffix indicates storage in float (usually 4-byte floating)\
    \ rather than double (8-byte floating). This is usually unnecessary or even undesirable\
    \ unless in a situation where you will be reading 4-byte floating numbers from\
    \ a binary file, example.\n- If long long is supported, the LL and ULL suffixes\
    \ are supported for long long and unsigned long long formats. Some integer values\
    \ are so large they cannot be written as literals except with one of these suffixes\
    \ (because otherwise the compiler attempts to fit literals into int format).\n\
    \n# # String Literals Escape Sequences\n\nOrdinary string literals have char*\
    \ format. They are translated into a char* array with one byte allocated for each\
    \ character plus an extra byte for the null terminator.\n\nWide character strings\
    \ are similar, but to indicate a wide-character literal, an \"L\" prefix causes\
    \ the compiler to allocate a wchar_t array, which has two bytes for each character,\
    \ including the null terminator.\n\n```\nwchar_t unicode_str[] = L\\\"This is\
    \ a Unicode string.\\\\\";\"\n```\n\nThe appearance of a backslash in a string\
    \ indicates that the backslash itself—along with the next character—is not interpreted\
    \ as a backslash but instead treated as an escape character: Table B.2 summarizes\
    \ of escape characters."
