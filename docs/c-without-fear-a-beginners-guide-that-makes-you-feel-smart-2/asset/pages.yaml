  md: 'The principal floating-point data type in C++ is **double**. This may seem
    like a strange name; it stands for "double-precision floating point." There is
    also a single-precision **float**, but its use is rare. When you need alike to
    retain fractional portions, you''ll get better results—fewer errors if you stick
    to **double**.


    A **double** declaration has the following syntax. Note that this statement is
    terminated with a semicolon (;), just as most kinds of statements are.


    ```

    double variable_name;

    ```


    You can also use a **double** declaration to create a series of variables:


    ```

    double variable_name1, variable_name2, ...;

    ```


    For example, this statement creates a **double** variable named aFloat:


    ```

    double aFloat;

    ```


    This statement creates a variable of type **double**.


    The next statement declares **double** variables named b, c, d, and amount:


    ```

    double b, c, d, amount;

    ```


    The effect of this statement is equivalent to the following:


    ```

    double b;

    double c;

    double d;

    double amount;

    ```


    The result of these declarations is to create four variables of type **double**.


    # Interlude: Why Double Precision, Not Single?


    > Double precision is like single, except better. Double precision supports a
    greater range of values, with better accuracy. It uses eight bytes rather than
    four.


    C++ converts all data to double precision when doing calculations, which makes
    sense given that today''s PCs include 8-byte processors. C++ also stores floating-point
    constants in double unless you specify otherwise (for example, by using the notation
    12.5f instead of 12.5).


    Double precision has one drawback; it requires more space. This is a factor only
    when you have large amounts of floating-point values to be stored in a disk file.
    Then, and only then, should you consider using the single-precision type,float**.


