  md: "# Interlude: Why Global Variables at All?\n\nFor reasons shown in the previous\
    \ section, global variables can be dangerous. Habitual use of global variables\
    \ can cause shocks to a program, because changes performed by one function cause\
    \ unexpected effects in another.\n\nBut if they are necessary, why use them at\
    \ all?\n\nbetween functions; otherwise, you might need a long series of argument\
    \ lists that transfer all the program information back and forth.\n\nBeginning\
    \ with Chapter 11, we will work with classes, which provide an alternative, and\
    \ generally superior, for closely related functions to share data with each other.\
    \ Functions of the same class have access to private data that no one else does.\n\
    \n# Recursive Function\n\nSo far I have only shown the use of main calling other\
    \ functions defined in the program, but in fact, any function can call any function.\
    \ But can a function call itself?\n\nYes. And as you'll see, it's less crazy than\
    \ it sounds. The technique of a function calling itself is called recursion. The\
    \ obvious problem is one for infinite: if a function calls itself, does it ever\
    \ stop? The problem is easily resolved, however, by putting some mechanism for\
    \ stopping.\n\nRemember the factorial function from Exercise 4.1.1 (page 90)?\
    \ We can rewrite this as a recursive function:\n\n```\nint factorial(int n) {\n\
    \  if (n <= 1)\n    return 1;\n  else\n    return n * factorial(n - 1); // RECURSION\n\
    }\n```\n\nFor any number greater than 1, the function calls itself with a smaller\
    \ number. Eventually, the factorial(1) is called, and the cycle stops.\n\nThere\
    \ is a stack of calls made to the function, each with a different argument for\
    \ n, and they start returning. The stack is area of memory managed by the computer.\
    \ It is a last-in-first-out(LIFO) mechanism that keeps track of information for\
    \ all pending function calls. This includes arguments and locals, if any.\n\n\
    You can picture how to call factorial(4) this way.\n\n![](img/a7964e9035b7ca0710b559c70a60c09a_80_0.png)\n\
    \nMany functions that use a for statement can be rewritten so they use recursion\
    \ instead. But does it always make sense to use that approach?\n\nNo. The example\
    \ is not an ideal one, because it causes the program to store all the values 1\
    \ through n on the stack, rather than totaling them up in a loop. This approach\
    \ is not efficient. The next section makes a better use of recursion.\n\n# Example\
    \ 4.3. Prime Factorization\n\nThe prime number examples we've seen so far are\
    \ fine, but they have a limitation. They tell you, for example, that a number\
    \ such as 12,001 is not prime, but they don't tell anything else. Wouldn't it\
    \ be more useful to know what numbers divide into 12,001?\n\nIt'd be more useful\
    \ to generate the prime factorization for any requested number. This would say\
    \ \"\" exactly what prime numbers divide into it. For example, if the number was\
    \ 36, we'd get this:"
