  md: "# Protected Members\n\nThe FloatFraction inherits the two data members, num\
    \ and den. Because they are declared private, they are accessible only within\
    \ the base class (Fraction). In the subclass function-definition code, you have\
    \ to resort to the get_num and get_den functions to get the values of num and\
    \ den.\n\nWouldn't it be to let subclasses access num and den? The ideal arrangement\
    \ might be to let subclass the data, while restricting access from outside the\
    \ class hierarchy.\n\nThere is a way to that. C++ supports a third access level—protected—which\
    \ is midway between private and public. If num and den have been given this level\
    \ (through the use of the protected keyword), then all the subclasses can refer\
    \ to them directly.\n\n```\nclass Fraction {\nprotected:\n    int num, den;\n\
    \    // Numerator and denominator.\n```\n\nWhen should members be declared protected\
    \ rather than private? Although it's it's usually clear what should be, the decision\
    \ to make something protected or private is not obvious. When you declare something\
    \ protected, you're saying you don't want to alter it or pay attention to it (not\
    \ even yourself) when writing a subclass. It probably makes sense, for example,\
    \ to make the support functions (lcd, gcf) private, because they are the only\
    \ function that should use them.\n\nOther members might be protected. The normalize\
    \ function itself is probably a good candidate, since this function is useful\
    \ generally. And others of a subclass would find it useful to refer to the data\
    \ members, num and den, as we've seen.\n\nBut could one also allow the author\
    \ of a subclass to set num and den directly rather than relying on the \"set\"\
    \ function. So, it might make sense to keep num and den protected, depending on\
    \ how much you trust the people who might try to write a subclass.\n\nHere's a\
    \ summary of the three access levels in C++.\n\n| MEMBER ACCESS LEVEL | DESCRIPTION\
    \ |\n| public | The member can be accessed by any function, whatever part of the\
    \ class or not. |\n| protected | The member can be accessed by a function only\
    \ if the function is a member of the class or its subclasses. |\n| private | The\
    \ member can be accessed by a function only if the function is a member of the\
    \ same class. |\n\nWithin the scope of the class, all the class's members are\
    \ accessible—even if they are in another object of the same class (as opposed\
    \ to \"this\" object). For example:\n\n```\nclass Node {\nprivate:\n    string\
    \ my_own_business;\npublic:\n    Node(string s) : my_own_business(s);\n    void\
    \ do_some_stuff(Node other) {\n        cout << my_own_business << endl; // This\
    \ is\n    }\nOK;\n    cout << other.my_own_business; // Also OK.\n};\n```\n\n\
    # Object Constraint\n\nAn alternative strategy is object constraint. A class can\
    \ contain any kind of type, including objects of other classes. This is, of course,\
    \ an important restriction: You cannot create objects of a particular class before\
    \ that class is declared.\n\n> Note\nThe restriction against using a class before\
    \ declaring it is necessary because it prevents you from declaring two classes,\
    \ A and B, containing each other! Nor can you declare a class containing itself.\
    \ Either case would lead to Alice in Wonderland, like Alice looking in a mirror\
    \ while holding another mirror to her face (or taking too much photo and growing\
    \ infinitely). You, however, can declare a class that contains a pair to be fully\
    \ declared, as shown in Chapter 15."
