  md: '# Introducing Loops


    One of the most powerful concepts in any programming language is that of loops.
    It is one of the things that enable a to do far more than a simple calculation
    and quit. In this section, you''ll see how a few lines of C++ can set up an operation
    to be performed—potentially—thousands of times.


    When a program is in a loop, it performs an operation over and over as long as
    a condition is true. The simplest form is the while statement:


    ```

    while (condition)

    statement

    ```


    As with if, you can replace statement with a compound statement, which in turns
    lets you put as many statements inside the loop as you want.


    ```

    while (condition) {

    statements

    }

    ```


    while evaluates the condition and executes the statement if condition is true.
    Then it repeats that operation until condition evaluates to false.


    About the simplest program example is a loop that prints numbers 1 to N, where
    N is a number input at the keyboard. We''ll look first at this program in pseudocode
    form. For the next page or so, I use the variable names I and N, because it makes
    the pseudocode easier to follow. Assume that the variables have already been declared.


    Here''s how to print the numbers from 1 to N:


    +   1 Get a number from the keyboard and store in N.

    2 Set I to 1.

    3 While I is less than or equal to N,

    3A Output I to the console.

    3B Add 1 to I.


    The first two steps initialize the variables I and N, which are integers. I is
    set directly to 1. N is set by keyboard input. Assume that the user inputs


    Step 3 is the interesting one. The program first considers I (which is 1) is less
    than or equal to N (which is 2). Since I less than N, the program carries out
    steps 3A and 3B, it prints the value of I.'
