  md: '# Integer vs. Floating-Point Division


    Most of the operators in Table A.1 are self-explanatory, but special considerations
    apply to some types. When one integer is divided by another, the remainder is
    thrown away.


    ```

    int quotient = 19 / 10;   // quotient = 1

    ```


    In this case, the fractional part (0.9) is discarded. To get a remainder from
    integer division, use the modulus (%) operator:


    ```

    int remainder = 19 % 10; // remainder = 9

    ```


    In the following example, integer division is performed, carrying away much of
    the result, even though quotient has floating point format and could have stored
    the result, 1.9.


    ```

    double quotient = 19 / 10; // quotient = 1.0

    ```


    However, if one of the operands has type double (which is the case when a decimal
    point is used in a numeric literal), the other operand is promoted to double and
    floating point division is carried out.


    ```

    double quotient = 19 / 10.0; // quotient = 1.9

    ```


    # Bitwise Operators (&, |, ^, ~, <<, >>)


    Bitwise AND, OR, and XOR operate on two integer expressions of the same width.
    If one operand has a different width (size), then the smaller of the two is promoted
    to the larger width. The action of these operators is to bit-clear in-n or set-bit
    in-n the other respectively. For example:


    ```

    cout << <<;

    cout << (0xe & 0x03); // 1110 & 0011 -> 0010 (AND)

    cout << endl;

    cout << (0xe | 0x03); // 1110 | 0011 -> 1111 (OR)

    cout << endl;

    cout << (0xe ^ 0x03); // 1110 ^ 0011 -> 1101 (XOR)

    cout << endl;

    ```


    Note that exclusive OR (also called XOR) means "either or not both.\nBitwise negation
    (-) is a unary operator that produces the remaining setting of each bit in its
    operand. For example:


    ```

    cout << <<;

    cout << (-(char)0xff); // 1111 1111 -> 0000 0000 (0)

    cout << endl;

    cout << (-(char)0x89); // 1000 1001 -> 0111 0110 (76)

    ```


    When used on integers, double-angle brackets (<< and >>) are not stream operators
    but bit-shift operators:


    ```

    integer << number_of_positions_to_shift

    integer >> number_of_positions_to_shift

    ```


