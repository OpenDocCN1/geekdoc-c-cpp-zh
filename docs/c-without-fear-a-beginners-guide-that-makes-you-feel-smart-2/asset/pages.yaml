  md: "Suppose you want to customize the Fraction class by adding a string containing\
    \ units (\"meters,\" \"miles,\" \"liters,\" and so on) and by adding a floating-point\
    \ field. We could keep modifying the Fraction class by subclassing and adding\
    \ new fields.\n\nOr we could declare a completely new class—let's call it Quantity—containing\
    \ several data members: a Fraction, a string, and a double member. In this case,\
    \ there is no inheritance. There is simply one large type containing three objects\
    \ of smaller type.\n\n# Quantity class:\n\n![](img/a7964e9035b7ca0710b559c70a60c09a_282_0.png)\n\
    \nThe second approach in the figure illustrates object containment. You don't\
    \ have to worry about what is inherited or not inherited or how access levels\
    \ change. Each object is manipulated through its public members.\n\nBut because\
    \ no members are inherited, merely contained, you usually end up having to do\
    \ more programming. You may have to write data access functions just to make your\
    \ object usable. And that's the beginning. If you want operator functions for\
    \ the new class, for example, you will have to write them all yourself. And you\
    \ have no access to private or protected data within the contained classes.\n\n\
    The following statements create a minimal structure for such a class, assuming\
    \ the three contained objects are private. This doesn't leave you\n\n```\nclass\
    \ Quantity {\nprivate:\n    Fraction frAmount;\n    string units;\n    double\
    \ x;\npublic:\n    set(int n, int d);\n    set(int n);\n    set(double x);\n \
    \   set(string new_units);\n    set(int n, int d, string new_units);\n    int\
    \ get_num();\n    int get_den();\n    double get_float();\n    string get_units();\n\
    }\n\n```\n\n# Safe Inheritance Through Class Hierarchies\n\nSo far, this chapter\
    \ has taken an ad approach to inheritance. Increasingly, programmers and computer\
    \ scientists are discouraging this laid-back approach to subclassing.\n\nInstead,\
    \ most programmers suggest inheritance should be carried out in the context of\
    \ well-thought-out inheritance schemes. For example, consider a case of graphical-user\
    \ interface classes.\n\n+   - In the root class, Graphical Object, you put functionality\
    \ common to all your classes: for example, a resize function.\n\n+   - Under the\
    \ root is a class common Control that has functionality for end-user controls\
    \ such as text boxes and picture boxes. Here you put your functionality common\
    \ to all controls, such as get_focus and lose_focus.\n\n+   - Under Control is\
    \ Text Box, Picture Box, and so on. Here you add functionality unique to each\
    \ specific control type. For example, Text Box has member functions as set_text\
    \ and get_text not using other types of."
