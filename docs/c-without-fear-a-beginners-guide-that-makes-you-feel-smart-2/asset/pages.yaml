    \ loop can be shortened to:\n\n```\nwhile (i < n) { // while is less than or equal\
    \ to n\n\tcout << i++ << \"\"; // Print i, then add 1 to i.\n}\n```\n\nDo you\
    \ see what this does? The statement prints the current value of i and i++.\n\n\
    But be careful that in a complex statement that features multiple uses of i, side\
    \ effects can produce undefined results. (\"Undefined\" is a polite way of saying\
    \ \"Good luck, for we have no idea what will happen next, but it will probably\
    \ be bad.\")\n\nTherefore, to be safe, use the increment operator (++) on a given\
    \ variable no more than once each statement.\nYou might wonder whether there is\
    \ a corresponding operator for subtraction. In fact, there are many numeric variable:\
    \ Generally, it should be an integer to work with these operators reliably.\n\n\
    | OPERATOR | ACTION |\n|---|---|\n| var++ | Pass the current value of var; then\
    \ add 1 to var. |\n| ++var | Add 1 to var; then pass the result. |\n| var-- |\
    \ Pass the current value of var; then subtract 1 from it. |\n| --var | Subtract\
    \ 1 from var; then pass the result. |\n\n# Statements vs. Expressions\n\nNow,\
    \ we're going along with the terms statement and expression. These are fundamental\
    \ terms in C++, so it's important to clarify them. In general, you recognize a\
    \ statement by its terminating semicolon (;).\n\n```\ncout << i++ << \" \";\n\
    ```\n\nA simple statement like that is usually one line of a C++ program. But\
    \ remember that a semicolon terminates a statement, so it's legal (though not\
    \ especially recommended) to put two statements on a line:\n\n```\ncout << i <<\
    \ \" \"; i++;\n```\n\nFine, you say-a statement is usually one line of a C++ program,\
    \ terminated with a semicolon. But what's an expression? An expression to terminate\
    \ a statement is here. Here's a sample list of expressions, with descriptions\
    \ of what each value produces:\n\n```\nx // Produces value of x\nl12 // Produces\
    \ 12\nx + 12 // Produces x + 12\nx == 33 // Test for equality: true or false\n\
    x = 33 // Assignment: produces value assigned\nnum++ // Produces value before\
    \ incrementing\ni = num++ + 2 // Complex expression; produces\n// new value of\
    \ i\n```\n\nBecause these are expressions, any of them can be used as part of\
    \ a larger expression, including assignment (=). They have three side effects:\
    \ x = 33 alters the value of x, and num++ alters the value of num. The last example\
    \ changes the value of both num and i. Any expression can be turned into a statement\
    \ by using a semicolon (;). Remember,\n\n```\nnum++;\n```\n\nThe fact that any\
    \ expression can be turned into a statement makes some strange statements possible.\
    \ You could, for example, turn a literal into a statement but such a statement\
    \ would do not exist."
