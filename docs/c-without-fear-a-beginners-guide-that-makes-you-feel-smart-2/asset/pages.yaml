  md: 'You can visualize a call to this function.


    ![](img/a7964e9035b7ca0710b559c70a60c09a_219_0.png)


    Now both operands are interpreted as functions. The left operand (point2 in this
    case) gives its value to the first argument, pt1. There is no concept of "this
    object", and all references to Point data members must be qualified.


    That can create problem, if the data members are not public, this function cannot
    access them. One solution is to use function calls, if available, get access to
    the data.


    ```

    Point operator+(Point pt1, Point pt2) {

    Point new_pt;

    int a = pt1.get_x() + pt2.get_x();

    int b = pt1.get_y() + pt2.get_y();

    new_pt.set(a, b);

    return new_pt;

    }

    ```


    But that''s not a pretty solution, and with some classes, it may not work. (For
    example, you might have a class in which the private data members are completely
    inaccessible, but you still will be able to write operator functions.)A better
    solution is to declare a function as a friend function, which means that the function
    is global, but it has access to private members.


    ```

    class Point {

    //...

    public:

    friend Point operator+(Point pt1, Point pt2);

    }

    ```


    Sometimes it''s necessary to write operator functions as a global function. In
    a member function, the left is interpreted as "this object" in the function definition.
    But what if the left operand does not have an object type? If you want to support
    an operator like this:


    ```

    point1 = 3 * point2;

    ```


    The problem is here that the left operand has int type. The only way to support
    such an operation is to write a global function.


    ```

    Point operator*(int n, Point pt) {

    Point new_pt;

    new_pt.x = pt.x * n;

    new_pt.y = pt.y * n;

    return new_pt;

    }

    ```


    To gain access to private data members, the function may need to be made a friend
    of the class:


    ```

    class Point {

    //...

    public:

    friend Point operator*(int n, Point pt);

    }

    ```


    You can visualize the call to this function way.


    ![](img/a7964e9035b7ca0710b559c70a60c09a_219_1.png)


    # Improve Efficiency with References


    As Chapter 12 pointed out, every object is passed or returned as a value, a call
    to the copy constructor is issued and must be allocated. You can make your programs
    more efficient by writing classes in such a way they minimize object creation.
    An easy way to do that is: Use references.'
