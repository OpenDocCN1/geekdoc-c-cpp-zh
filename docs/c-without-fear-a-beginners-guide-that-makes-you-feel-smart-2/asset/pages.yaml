  md: '# 7. Strings: Analyzing the Text


    Most computer programs, at some point in their lives, have to communicate with
    a human being. The standard way to do this is to use strings; that''s especially
    true for the console-based applications in this book.


    Using text to print messages is easy enough. Text strings get more interesting
    when you pick apart, combine, or analyze them as value. That''s what this chapter
    is all about.


    # Text Storage on the Computer


    In Chapter 1, I said the computer stores text numerically, just like any other
    kind of data. But with text data, each byte uses a special code to correspond
    to a character. This is called ASCII code. Suppose I declared the following string:


    ```

    char *str = "Hello";

    ```


    C++ allocates exactly seven bytes—one byte for each character and for a terminating
    null byte. Here''s what the data looks like in memory.


    | Actual data: | 72 | 101 | 108 | 108 | 111 | 33 | 0 |

    |---|---|---|---|---|---|---||}{

    | ASCII code: | ''H'' | ''e'' | ''l'' | ''l'' | ''o'' | ''!'' | (null) |


    You can turn Appendix D and see the ASCII code for every character. In reality,
    the computer doesn''t actually store alphanumeric characters; it stores only numbers.
    When and how, do the numeric values get translated into text characters?


    This translation happens at least twice: when data is typed at the keyboard and
    when it''s displayed on the monitor. When you press H on the keyboard, a series
    of actions happen at a low level in the ASCII code for (72) getting into your
    program, which then stores that as value.


    The rest of the time, a text string is just a series of numbers—or more specifically,
    as a series of bytes ranging in value from 0 to 255. But as programmers, we can
    think of C++ storing text characters in memory, one byte per character. (Exception:
    the international standard, Unicode, uses more than one byte per character).


    > Interlude: How Does the Computer Translate Programs?


    Programming books sometimes point out that the CPU doesn''t understand the C++
    language. All the C++ statements must be translated into machine code before they
    can be executed. Who does the translation?


    Oh, that no mystery; the translation is done by the compiler—which itself is a
    computer program. But in that case, the computer is doing the translation.


    When I was first learning to program this, it seemed to me as an insoluble paradox.
    The CPU (the "brain" at the heart of the computer) doesn''t understand a of C++,
    yet it performs the translation between C++ and its own internal language. Isn''t
    that a contradiction?


    ![](img/a7964e9035b7ca0710b559c70a60c09a_123_0.png)


    A large part of the answer is: C++ source code is stored in a text file, just
    like you might store an article or a memo. But text characters, as I''ve pointed
    out, are stored in numeric format. When the compiler works on this data, it''s
    doing another form of numeric crunching, evaluating and making decisions according
    to precise rules.


    In case that clears things up, imagine you have the task of reading letters from
    a person who knows Japanese but not English. Meanwhile, English but not one of
    Japanese. (My apologies to philosopher John Searle, who originated this idea with
    "Chinese thought" experiment).


    But suppose you have an instruction book that tells you how to translate characters
    into their English-language equivalent. The instruction book is written in English,
    so you have no problem using


    So, even if you don''t understand Japanese, you''re able to translate all the
    Japanese you want, by following careful instructions.


    That''s what a computer program is, really: an instruction book read by the CPU.
    A program is an intent sequence of'
