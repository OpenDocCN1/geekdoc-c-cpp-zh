  md: '# H. STL Classes and Objects


    The Standard Template Library (STL) supports many useful templates, this appendix
    summarizes the use of just three (the ones used in this book):


    +   - The string class

    - The list template

    - The stack template


    # The STL String Class


    The features in this section require including <string>.


    STL string objects are declared simply as string; std::string if the std namespace
    is not being used. The simple string class instantiates the template using basic_string
    for type char, so the functions listed here are also supported by basic_string
    classes:


    ```

    #include <string>

    basic_string<char> s1; // Equivalent to string

    basic_string<char> s2 = "Hello"; // Wide string

    cout << s2;

    ```


    Once declared, string objects support copying of contents (=), concatenation (+),
    and comparison of contents (<, >, and =). Unlike C-strings (char), STL strings
    can be assigned data without worrying about size considerations.


    ```

    #include <string>

    using namespace std;

    ...

    string your_dog = "Fido";

    your_dog = "Montgomery"; // String automatically

    // // grows.

    string my_dog = "Mr. " + your_dog;

    ```


    The string objects can be indexed as they were char strings.


    ```

    cout << "The third character is" << my_dog[2];

    ```


    With most of the functions listed in Table H.1, str may be a STL string or a char*
    string. The return value, except otherwise noted, is a reference to the current
    string object (the object through which the function is called).


    # Table H.1. String Member Functions'
