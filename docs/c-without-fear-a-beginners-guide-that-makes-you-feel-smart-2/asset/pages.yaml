  md: '# # Your First C++ Programs


    There''s nothing to fear about C++ programming—really! Like all programming languages,
    it''s just a way to give logically directions to a computer.


    C++ can get complicated as you want, but the easiest way to start learning is
    to use it to solve the fudamental programming tasks. That''s the approach.


    In the first course of sections, I review the basic concepts of programming. If
    you''ve programmed in any language, you might want to skip these. But if you stick
    around, I promise not to be too long-winged.


    # ## Thinking Like a Programmer


    Programming may not be exactly like any activity you ever do. Basically, you''re
    just giving instructions—but doing so in a logical, systematic manner.


    # ## Computers Do Only What You Tell Them


    Computers do only what you tell them: this the most important rule in this book,
    especially if you are new to programming. By using a computer language, such as
    C++, Visual Basic, Pascal, or FORTRAN, you give the computer a list of things
    to do; this is [program].


    A computer needs information—of course—that data. But it also needs to know what
    to do with that data. The instructions that it will tell is what we called [code].


    # ## Determine What the Program Will Do


    So, to get a computer to doing, it has to be exactly what to do.


    So far, you''ve probably used a computer by running programs that other people
    have written for you. In this extent, you''ve been [end user—] or, for short.


    By writing programs yourself, you will promote yourself into the next echelon
    of computer usage. Now, you''ll decide what a program does. You''ll make things
    happen.


    But a computer—much more than Dustin Hoffman in Rain Man—is the ultimate idiot
    servant. It can never guess what you want. It can never make independent judgments.
    It is extremely literal and can precisely exactly what you say, no matter how
    stupid. Therefore, you have to be careful of what you mean.


    You can''t give the computer a command that might seem relatively clear to a human,
    such as "Convert a number from Celsius to Fahrenheit for me." Even that''s too
    general. In, you have to be more specific, writing down steps as these:


    +   1. Print the "Enter Celsius temperature." message.

    2. Get a number from the keyboard and store it in the variable temp.

    3. Convert to Fahrenheit using the formula temp (ctemp * 1.8) + 32.

    4. Print the "The Fahrenheit temperature is." message.

    5. Print the value of the variable temp.


    If you have to go this much just to do something simple, even bother? The answer
    is that once a program is written, you run it over and over. And programs take
    time to write, while you execute at lightning speed.


    # ## Write the Equivalent C++ Statements


    After you''ve decided precisely what you want your program to do, step-by-step,
    you need to write down the equivalent C++ statements. A statement is roughly the
    C++ equivalent of a sentence in English.


    For example, say you want program to do the following:'
