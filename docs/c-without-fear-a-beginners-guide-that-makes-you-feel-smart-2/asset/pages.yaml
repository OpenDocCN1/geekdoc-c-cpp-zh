  md: "# Polymorphism: Object Independence\n\nIf you've made it far, congratulations!\
    \ You're about to scale the highest peak of all in the mountain range of object-oriented\
    \ concepts: polymorphism. It is the key to making objects truly independent.\n\
    \nRemember that objects—which are instances of classes—are data items that have\
    \ built-in behavior. More than anything else, this ability of an unknown object\
    \ to bring in new kinds of behavior—essentially plugging software into an existing\
    \ framework—makes good on the promise of object orientation.\n\n# A Different\
    \ Approach to the FloatClass\n\nVirtual functions are at the core of polymorphism.\
    \ Understand why they are useful, let's look at an example building on the Fraction\
    \ class.\n\nThe Fraction class in Chapter 12 calculates a floating-point (double)\
    \ value “on the fly”—that is, whenever user of the object asked for value by calling\
    \ get_float. But what if you wanted making the floating-point value persistent,\
    \ recalculating it only when values change. To do that, you'd need to do the following:\n\
    \n+   * Declare a new member, float_val.\n* Override the normalize function so\
    \ it calculates the floating-point value, in addition to performing its other\
    \ tasks. Remember that normalize is called whenever a new value is set.\n\nIn\
    \ the previous chapter, I barely mentioned the override ability, and for a good\
    \ reason. It is dangerous to override members without using virtual.\n\nHere is\
    \ the overridden version of normalize. You'll notice the scope operator (::) to\
    \ explicitly call the base-class version of the function before anything else.\n\
    \n```\nvoid Fraction::normalize() {\n  Fraction::normalize();\n  int x = get_num();\n\
    \  float_val = x / get_den();\n}\n```\n\nBut there's a catch. There are two versions\
    \ of normalize—Fraction::normalize and FloatClass::normalize. Which version does\
    \ the function call? To verify, here is the definition of set-inherited and used\
    \ by both classes:\n\n```\nvoid set(int n, int d)\n  num = n; den = d; normalize();\n\
    ```\n\nWhen the C++ compiler reads the definition of set in the Fraction class,\
    \ it had to make a decision then and there—at compile time—about how to call the\
    \ function. To do that, it had to fix the function address. as well as have been\
    \ written in this way:\n\n```\nvoid set(int n, int d)\n  num = n; den = d; Fraction::normalize();\n\
    ```\n\nConsequently, this function never calls the overridden version of normalize,\
    \ and consequently, the new value of float_val is never recalculated, even for\
    \ Float-Fraction objects. Unfortunately, there is an easy solution:\"eight\">\n\
    \n# Virtual Functions to the Rescue!\n\nThe solution is to use the virtual keyword,\
    \ which must be applied in the base class (Fraction). This makes this function\
    \ virtual in both class and in all subclasses. Essentially virtual says \"Which\
    \ version of the function to execute at runtime.\" In other words, make sure that\
    \ the correct version of the function—the one defined for the object's class—gets\
    \ called.\n\n```\nclass Fraction {\nprotected:\n  virtual void normalize(); //\
    \ Put in standard form.\n\n};\n```\n\nIn addition to using virtual, I also need\
    \ to use the protected keyword (in private) to enable overriding of the function.\
    \ This is an important rule in object-oriented classes:"
