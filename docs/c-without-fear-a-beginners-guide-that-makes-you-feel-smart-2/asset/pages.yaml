  md: "This is an easy solution to a lot of problems, but there are some caveats.\n\
    \nFirst, use this syntax is all-or-nothing. If you use it, you inherit all the\
    \ base-class constructors.\n\nSecond, there might be cases where a base-class\
    \ constructor's behavior is inadequate. In the Point class example, none of the\
    \ inherited constructors sets a value for z.\n\n```\nclass Point3D : public Point\
    \ {\nprivate:\n    int z;\npublic:\n    using Point::Point; // Inherit Point constr'\n\
    \    int get_z() { return z; }\n    void set_z(int n) { z = n; }\n};\n```\n\n\
    This problem is easily solved by initializing z within the class declaration (which\
    \ is another C++0x capability, introduced in Chapter 12) of the following example.\n\
    \n```\nclass Point3D : public Point {\nprivate:\n    int z = 0;\npublic:\n   \
    \ using Point::Point; // Inherit Point constr'\n    Point3D(int new_x, int new_y,\
    \ int new_z) {\n        set_x(new_x); set_y(new_y); z = new_z;\n    }\n    int\
    \ get_z() { return z; }\n    void set_z(int n) { z = n; }\n};\n```\n\nThis example\
    \ also adds a new constructor, which initializes z as well as x and y.\n\n# Example\
