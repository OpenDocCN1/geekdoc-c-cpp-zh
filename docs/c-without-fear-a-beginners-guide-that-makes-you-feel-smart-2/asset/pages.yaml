  md: "# Problems with the FloatFraction Class\n\nCreating a subclass almost easy\
    \ as I did in the previous section. But if you do some experimenting, you'll run\
    \ into limitations.\nThe following innocent-looking code does just what you'd\
    \ want it to do, given a complete Fraction class:\n\n```\nFraction f1(1, 2);\n\
    f1 = f1 + Fraction(1, 3);\nif (f1 == Fraction(5, 6))\ncout << 1/2 + 1/3 = 5/6;\n\
    ```\n\nBut if you use the FloatFraction—which according to what I've said, ought\
    \ to support everything the Fraction class does—each of these\nstates errors:\n\
    \n```\nFloatFraction f1(1, 2); // Error!\nf1 = f1 + FloatFraction(1, 3); // Error!\n\
    if (f1 == FloatFraction(5, 6)) // Error!\ncout << 1/2 + 1/3 = 5/6;\n```\n\nThe\
    \ problem is that subclasses do not inherit constructors from their base class\
    \ a letdown—although fortunately, C++ox (if your compiler supports it) offers\
    \ a\nvery easy fix. This issue so significant it deserves to be another cardinal\
    \ rule:\n\n> Subclasses do not inherit constructors from their base class (although\
    \ C++ox provides a simple way around this).\n\nThe missing constructors for the\
    \ FloatFraction class are easy enough to supply in this case, although it is tedious\
    \ work. These\nconstructions do no more than the corresponding Fraction constructors\
    \ do.\n\n```\nFraction() { set(0, 1); }\nFraction(int n, int d) { set(n, d); }\n\
    Fraction(int n, int d) { set(n, d); }\nFloatFraction(const Fraction &src)\n{set(src.get_num(),\
    \ src.get_den()); }\n```\n\nI also had to make one other change. You'd like keep\
    \ the definition of the copy constructor simple so that it looks like this:\n\n\
    ```\nFloatFraction(const Fraction &src)\n{set(src.num, src.den); } // ERROR! Private:\n\
    ```\n\nThe problem is that num and den are private members—of the Fraction class.\
    \ This means they are not accessible from other classes, even\nsubclasses of Fraction!(That's\
    \ a problem we'll revisit in this chapter). Consequently, in FloatFraction code,\
    \ you need to use the public functionsnget_num and get_den, instead of referring\
    \ directly to num and den.\n\n# C++ Ox: Inheriting Base-Class Constructors\n\n\
    # C++ox\n\nThis section applies only to compilers that are C++ox compliant.\n\n\
    This is one of the most convenient and requested features of C++ox. A single statement\
    \ (which should be declared in the public section of a\nclass) allows a subclass\
    \ to inherit the constructors of its base class.\n\nFor example, we could implement\
    \ this in the FloatFraction class (with the new statements in bold):\n\n```\n\
    class FloatFraction : public Fraction {\npublic:\n  using Fraction::Fraction;\
    \ // Inherit const's\n\ndouble get_float() {\n  double x = get_num();\n  return\
    \ x / get_den();\n}\n```"
