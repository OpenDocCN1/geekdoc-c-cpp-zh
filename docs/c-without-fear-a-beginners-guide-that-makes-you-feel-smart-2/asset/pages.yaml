    Look at again line of code:\n\n```\nPoint() : Point(0, 0) {}\n```\n\nThis declares\
    \ a default constructor, but delegates the work to the other constructor: It calls\
    \ the constructor with two integer arguments passes the arguments 0, 0. With the\
    \ C++0x specification, still another way to achieve this result is to initialize\
    \ default data members within the class.\n\n```\nClass Point {\nprivate:\n   \
    \ int x = 0;\n    int y = 0;\npublic:\n    Point(int new_x, int new_y) (x = new_x;\
    \ y = new_y);\n    Point() {};\n```\n\nIn either case, the default constructor\
    \ needs to be declared somewhere—unless you make a deliberate decision to restrict\
    \ the class user from using a default constructor (that is, to restrict the user\
    \ from declaring objects without explicit initialization).\n\n# C++0x Only: Consistent\
    \ Initialization\n\n# C++0x\n\nThis section applies only to compilers that are\
    \ C++0x compliant.\n\nTraditional C++ (that is, versions of the language prior\
    \ to the C++0x specification) handles initialization of different kinds of data\
    \ in an inconsistent way. Consider how arrays and objects are initialized.\n\n\
    ```\nint int_array[] = {1, 2, 3, 4, 5};\nstring beats[] = {\"John\", \"Paul\"\
    , \"George\", \"Ringo\"};\n\nPoint pt1;\nPoint pt2(3, 4);\nPoint pt3 = Point(1,\
    \ 2);\n```\n\nTo improve consistency, the C++ standard supports use of braces\
    \ {} in all situations initialization. For the sake of backward compatibility,\
    \ the statements you are showing are still supported. You can still use \"function\
    \ style\" (which uses parentheses) for initializing data. But the following use\
    \ of braces is also supported:\n\n```\nPoint pt1;\nPoint pt2(3, 4);\nPoint pt3\
    \ = Point(1, 2);\nPoint pt4 = (0, 1);\n```\n\nIn Chapter 14, you' learn how to\
    \ use the new keyword to dynamically allocate objects from memory. Traditional\
    \ C++ uses this syntax with new:\n\n```\nPoint *p = new Point(1, 3);\n```\n\n\
    With C++0x, you can use braces instead of the functional style initialization\
    \ (which uses parentheses).\n\n```\nPoint *p = new Point(1, 3);\n```\n\n# Example\
    \ 12.1. Point Class Constructors"
