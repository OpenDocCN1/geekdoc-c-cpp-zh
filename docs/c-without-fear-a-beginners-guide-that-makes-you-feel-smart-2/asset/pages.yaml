  md: '# # Preprocessor Directives


    The C++ preprocessor can perform a number of useful actions before the regular
    compilation phase. For example, the #define can be used to replace occurrences
    of a word with another—creating easy-to-interpret symbolic constants rather than
    arbitrary-looking numbers. The directives have other uses, the most important
    of which are including header files and making sure such header files are compiled
    once.


    In addition to the directives listed here, C++ also supports a #pragma directive,
    but its use is entirely implementation defined. See your compiler documentation
    for more information.


    This appendix covers the directives in alphabetical order, followed by a list
    of predefined compiler constants.


    # # The #define Directive


    The #define has three forms, each of which has a different use.


    ```

    #define symbol_name

    #define symbol_name replacement_text

    #define symbol_name(args) replacement_text

    ```


    The first version of #define is used to control compilation, by affecting the
    behavior of and related directives. For example, you might use the directive to
    indicate that the C++0 feature is supported. See #if, #ifdef, and #ifndef for
    more information.


    ```

    #define COL_PLUS_OX

    #define COL_WIDTH 80

    char input_string(COL_WIDTH+1);

    ```


    The second version is useful in creating predefined constants to remove "magic
    numbers" (that is


    One of the advantages of this approach is that if you decide to change the column
    width, you only need to change it in one place (the #define); the change is automatically
    reflected throughout the source file wherever COL_WIDTH appears.


    The third version is used to define macro functions, which take one or more arguments
    and expand them into larger expressions. The effect is something like inline functions,
    which are expanded into the body of the caller. Macro functions, however, have
    limitations. They are usually limited to simple expressions, and they have no
    type checking.


    The following example macro produces the maximum of two numbers. It takes advantage
    of the conditional (?:) operator see Appendix A for more information.


    ```

    #define MAX(A, B) ((A)>(B) ? (A) : (B))

    ```


    The extra parentheses, though not always necessary, ensure that the expressions
    A and B are evaluated in their entirety before the operators are applied (just
    in case A and B are complex expressions). Here is an example that uses this:


    ```

    int x, y;

    cout << "Enter a number: ";

    cin >> x;

    cout << "Enter another: ";

    cin >> y;

    cout << "The maximum is: " << MAX(x, y);

    ```


    During preprocessing, the compiler expands the last line in the previous code
    into the following (in which we removed the extra parentheses for clarity). The
    action of the conditional (?:) operator is to evaluate the first expression (in
    this case, x>y) and return x if true or y if false.


    ```

    cout << "The maximum is: " << (0 func? ? x : y);

    ```


