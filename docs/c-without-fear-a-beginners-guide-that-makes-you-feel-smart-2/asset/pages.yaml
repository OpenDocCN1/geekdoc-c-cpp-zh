  md: "# Working with 64-Bit Literals (Constants)\n\nFor the most part, using the\
    \ 64-bit type is as easy as declaring variables long long. But there is a little\
    \ more to it: You typically need to initialize variables.\n\nFortunately, the\
    \ following works just fine, even though the numeric literal, 0 is int type and\
    \ long long int type:\n\n```\nlong n = 0;\n```\n\nThis is OK, C++ automatically\
    \ promotes a smaller type, like int, to a larger type such as long long and without\
    \ conflict. But what if you need to initialize n with a larger value?\n\n```\n\
    long n = 123000123000456; // ERROR\n```\n\nThe problem is that the literal in\
    \ this example is too large to be stored as a int, so you will likely get an error\
    \ message. To ensure that a larger number (beyond 2 billion or so) can be stored,\
    \ you must use the \"ULL\" suffix, which stands for unsigned long long, of course:\n\
    \n```\nlong n = 123000123000456LL; // LL used; no error\n```\n\nYou can also use\
    \ the \"ULL\" prefix for unsigned long long.\n\n```\nlong n = 123000123000456ULL;\
    \ // ULL used; OK.\n```\n\n# Accepting long long Input\n\nEarly on, you use the\
    \ ato to convert strings to integers. C++ supports long long also provide a useful\
