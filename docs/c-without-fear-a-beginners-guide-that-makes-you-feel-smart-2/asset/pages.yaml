    # The auto and decltype Keywords


    For beginners, the **auto** is only a minor convenience, but when you start to
    write more complicated programs with exotic types, you mind find it so significant
    work.


    > Note

    The **auto** keyword has another use, which is mostly obsolete: to indicate automatic
    (that is, stack-based) storage. Local variables are given this storage class name.
    The compiler differentiates according to context. The old use of **auto** precedes
    another type name; the new use of **auto** is used in place of a type.


    When a variable is declared with the **auto** keyword, its type is determined
    by context—specifically, by the variable it initializes. Once fixed, the variable''s
    type does not change. **auto** is not a variable-data type.


    For example:


    ```

    auto x1 = 5;           // x1 is an int.

    auto x2 = 3.1415      // x2 has type double

    auto x3 = "Hello",;  // x3 has type char*

    ```


    You may wonder, at first, what point of the keyword is given...that it''s hardly
    any keystrokes...Consider a function return_pp that returns a pointer to a Fraction
    object (You''ll need to create Fraction objects in the next chapter.). In that
    case, you could declare and initialize x by writing:


    ```

    Fraction **x = return_pp_Fraction;

    ```


    But with the new keyword, you could instead write this:


    ```

    auto x = return_fraction;

    ```


    Even better is the use of the **auto** keyword within range-based **for**. Suppose
    weirdContainer is an array of pointers to Fraction objects. In this case, you
    could write:


    ```

    for (Fraction& **x : weirdContainer) ...

    ```


    or you could just write this:


    ```

    for (auto& x : weirdContainer) ...

    ```


    **auto** is so useful in this context that we can state it as part of an alternative
    syntax for range-based **for**.


    ![](img/a7964e9035b7ca0710b559c70a60c09a_175_0.png)'
