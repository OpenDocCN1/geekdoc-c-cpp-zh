  md: 'C-string: The old text type supported by C and still fully supported in C++.
    The format consists of an array of char and offers many advantages over C-strings,
    string literals are still stored as chars, some of the string functions (like
    strtok) are still useful. See Chapter 7 for more information.


    callback: a function used to enable another process or function such that it can
    call back at the specified address. An example may help clarify. The C++ standard
    library function qsort does not need to pass a address of a comparison function
    qsort calls this function in order to determine the proper ordering of any two
    elements of an array.


    With C++ and other object-oriented languages, callback functions are largely obsolete
    without the use of virtual functions, which provide a much safer and simpler way
    of doing the same thing.


    cast: Also known as type cast (and occasionally as cast). An operation that changes
    the type of an expression. When a type with a smaller size is assigned to variable
    of larger range, C++ automatically promotes the smaller type and cast is usually
    unnecessary. However, when going in the reverse direction, as assigning a pointer-to-number
    to an integer, a cast is necessary to avoid a warning message.


    Casts are also used in other situations. In writing to a binary file, a pointer
    of base type char is expected, so you need to cast address other types to char,
    as well as the C-style cast, reinterpret_cast provides it pointers. For more examples,
    see Appendix A.


    class: A user-defined data type (or data type defined in a library). In C++, a
    class can be declared by using the class struct, or union keyword. In traditional
    programming, a class can contain any number of data fields (data members in C++);
    object-oriented programming in C++ adds the ability to declare members as well.
    Thus, you define a data type by what it stores and how it behaves. Once a class
    is declared, you can create any number of instances, called objects.


    code: Another word for "the program." The word implies the programmer''s point
    of view, rather than the user, who sees the result at runtime. When C++ speaks
    of "code", they are usually referring to the C++ source code, which is the group
    of C statements that make up the program. This word was used in the early days
    of computer programming, when all programming had to be in machine code. In those
    days, every instruction was executed in a particular pattern of 1s and 0s.


    compiler: The language translator that reads your C++ program and produces code
    (executable that can actually be run on the computer. This executable file is
    also called an application.


    compound statement: A group of zero or more statements (typically more than one)
    enclosed in curly braces ({}); Also called a block or compound statement. The
    fundamental rules of C and C++ state that any place a single statement is valid,
    so is a compound statement. So, for example, you can put any number of statements
    inside the body of a while loop so that loop through them, multiple statements


    constant: A value that is not allowed to change. All literals are constants, but
    not all constants are literals. For example, an array name is a symbol (the name
    is but constant).


    constructor: A special function that is automatically initialized when an object
    (an instance of a class) is created. A constructor has no explicit return type.
    (Syntactically, every function in C++ must have a return type—even if it is void—the
    two exceptions being constructors and destructors). A constructor performs initialization
    of some kind; not, however, the compiler-supplied default constructor (see default
    constructor) performs none.


    control structure: A way to control what happens in a program rather than just
    "goto to the next statement," which is usually what happens. Control structures
    can make decisions (albeit very limited ones), repeat operations, or transfer
    execution to a new program location. If, while, for, and switch case statements
    are all control structures.


    copy constructor: A constructor that is initialized from another object of the
    same type. For each class, the compiler provides a copy constructor if you don''t
    write one; it performs a simple member-by-member copy.


    CPU: Central processing unit. Although nearly all computers in today have coprocessors
    that do some of the work (namely floatingpoint operations and graphics), a program
    computer generally has only one central processor, which is a silicon "chip" that
    executes each machine-code instruction in turn, one by one (Remember that all
    programs are translated into machine code before running.) The central processor''s
    execution of these instructions, for the most part, is what drives a computer
