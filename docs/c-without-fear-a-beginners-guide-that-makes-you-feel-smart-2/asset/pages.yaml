  md: '# Chapter 7 Summary


    Here are the main points of Chapter 7:


    +   - Text characters are stored in the computer according to their ASCII codes.
    For examples, the string "Hello" is represented by the byte values 72, 101, 108,
    108, 111, 33, and 0 (for the terminating null).


    +   - The traditional "C-string" type uses a terminating null—a 0 byte value.
    This enables string-handling functions to determine where the string ends. When
    you declare a string literal like "Hello", C++ automatically allocates space for
    this terminating null along with the other characters.


    +   - The current length of a string (determined by searching for the terminating
    null) is not the same as the amount of total storage reserved for the string.
    The declaration reserves 10 bytes of str but initializes so that its current length
    is only six. The string will have three unused bytes as a result, allowing it
    to grow if needed.


    ```

    char str[10] = "Hello";

    ```


    +   - Library functions such as strcpy (copy string) and strcat (string concatenation)
    can alter the length of an existing string. When you perform these operations,
    it is important that you have enough space to accommodate the new string.


    +   - The strlen function gets the current length of the string.


    +   - Include the string.h file to provide type information for string-handling
    functions.


    ```

    #include <string>

    ```


    +   - If you try to increase the length of a string without having the necessary
    space, you will overwrite another variable''s area, creating hard-to-find bugs.


    ```

    char str[] = "Hello";

    strcat(str, " So happy to see you."); // ERROR!!!

    ```


    +   - To ensure that you don''t copy too many characters to a string, you can
    use the strcat and strcpy functions.


    ```

    char str[100];

    strncpy(str, s2, 99);

    strncat(str, s2, 99 - strlen(str));

    ```


    +   - The stream operator (>>), when using the cin object, provides only limited
    control over input. When you use it to send data to a string address, it gets
    the characters up to the first white space (blank, tab, or newline).


    +   - To get a full line of input, use the cin.getline function. The second argument
    specifies the maximum number of characters to copy the string (not counting the
    terminating null).


    ```

    cin.getline(input_string, max);

    ```


    +   - An expression represents a single integer value (after translation into
    ASCII code); an expression such as "A" represents an array of char and is therefore
    translated into an address.


    +   - The STL class lets you to create, copy contents (=), test for equality of
    contents (=), and concatenate (+) strings without having to worry about size issues.'
