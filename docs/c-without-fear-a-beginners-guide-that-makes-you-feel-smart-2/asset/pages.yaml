  md: 'For example, the following can be used to prevent compilation of a header file
    that has already been compiled. For example:


    ```

    #ifndef FRACT_H

    #define FRACT_H


    // Here is the body of Fraction.h

    #endif

    ```


    The first time that the Fraction.h is read in, it defines the symbol FRACT_H;
    that in, prevents Fraction.h from being compiled a second time, no matter how
    many different files it includes.


    # The #include Directive


    The **include** directive has two versions. Both are almost always used to include
    header files, which contain function prototypes and symbolic constants used to
    work with a project or a portion of the standard library.


    ```

    #include <filename>

    #include "filename"

    ```


    In either case, the effect of **include** is to suspend compilation of the current
    file and run the compiler on the named file until the end of that file is reached.


    The first version (using angle brackets) searches for the name in the directory
    or folder set aside header files. In the case of MS-DOS and Windows, for example,
    this directory is indicated by the setting of an NC environment variable.


    By convention, the second version (using quotation marks) searches for the named
    file in the same way but also searches the current directory or folder.


    The first version is always used to include library header files or files supplied
    by vendors (though both versions would work), while the second version is used
    for header files. For example:


    ```

    #include <iostream>

    #include <cmath>

    #include "Fraction.h"

    ```


    > Note

    Each standard library file beginning with c, as in cmath, corresponds to a traditional
    .h file inherited from the C language. Another example is ctype, which corresponds
    to the ctype.h file used in C. With C++, the newer format is preferred, even if
    the older (C-style) headers still work for now.


    # The #line Directive


    The #line directive has two forms.


    ```

    #line filename number

    #line number

    ```


    The effect is to reset the values of the __FILE__ and __LINE__ constants, as well
    as affecting how error messages are printed by the compiler. For example:


    ```

    #line myfile.cpp 100

    ```


    # The #undef Directive


    The **undef** directive undoines the definition of the named symbol, so it is
    no longer considered defined.


    ```

    #undef symbol_name

    ```'
