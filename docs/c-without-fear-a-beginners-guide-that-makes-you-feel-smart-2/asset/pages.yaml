    Now iter can be used to iterate through the list LS, since their underlying types
    (string) are compatible.


    STL lists have begin and end functions that return an iterator to the beginning
    and the end of the list, respectively. The following statement uses begin to initialize
    an iterator:


    ```

    list<string>::iterator iter = LS.begin();

    ```


    For a string LS with four elements, you can visualize this operation way.


    ![](img/a7964e9035b7ca0710b559c70a60c09a_264_0.png)


    Properly initialized can now be used almost like a pointer. You can make iter
    point to the next item by using the increment operator:


    ```

    iter++; // Advance one element in the list.

    ```


    The effect of incrementing the iterator can be visualized this way.


    ![](img/a7964e9035b7ca0710b559c70a60c09a_264_1.png)


    To access the data pointed to by the iterator, apply the indirection operator
    (*) just as you would with a pointer.


    ```

    cout << *iter << endl; // Print pointer pointed to.

    ```


    Putting all this together, we can write a loop that prints all the elements of
    the list, to a line. This works because the end member produces an iterator that
    points to the position after the last element, not the last element itself. Therefore,
    if we are at the end of the position, we''ve processed all the elements. We''re
    done!


    Conversely, if we have reached LS.end(), we are not done. Makes the loop condition
    easy to write.


    ```

    iter = LS.begin(); // Start at beginning.

    while (iter != LS.end()) { // While not done,

    cout << *iter << endl; // Advance to next.

    }

    ```


    This can be written more succinctly as follows:


    ```

    for (iter = LS.begin(); iter != LS.end(); iter++) {

    cout << *iter << endl;

    }

    ```


