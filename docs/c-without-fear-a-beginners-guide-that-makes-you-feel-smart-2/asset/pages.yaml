    # Objects and "new"


    So far, I''ve said little about an important concept in object orientation: pointers
    to objects. This concept turns out to be critical in the more advanced concepts
    in object orientation.


    When a program interacts with other programs in a graphical user interface or
    network environment, it typically passes or receives pointers to objects. Passing
    pointers is usually far more efficient than creating new copies.


    ![](img/a7964e9035b7ca0710b559c70a60c09a_235_0.png)


    Remember that new and delete work with classes as well as other data types. For
    example, you can allocate a Fraction object and get a pointer to it.


    ```

    Fraction *pFract = new Fraction;

    ```


    This statement creates a Fraction object and calls the default constructor because
    no arguments are specified. But you can specify arguments if you choose.


    ```

    Fraction *pFract = new Fraction(1, 2); // Init to 1/2

    ```


    The syntax for using new to allocate an object with an argument list is as follows:


    +   - new class_name(argument_list)


    This expression allocates an object of the specified class, calls the appropriate
    constructor (determined by argument_list), and returns the address of the object.


    Once you have a pointer to an object, how do you use it? How do you refer to the
    object''s members? The obvious way is to deference the pointer and then access
    a member type:


    ```

    Fraction *pFract = new Fraction(1, 2);

    cout << "The numerator is " << (*pFract).get_num();

    ```


    This operation—dereferencing a pointer and then accessing members of the object
    pointed to—is so common that C++ supplies a special operator to make it easy to
    write. Here is the syntax of this expression, which access a class member:


    ```

    pointer->member

    pointer->member();

    ```


    These expressions are equivalent to the following:


    ```

    (*pointer).member

    (*pointer).member();

    ```


    The example shown earlier, where The numerator is " << pFract->get_num();, can
    be rewritten as follows:


    ```

    cout << "The numerator is " << pFract->get_num();

    ```'
