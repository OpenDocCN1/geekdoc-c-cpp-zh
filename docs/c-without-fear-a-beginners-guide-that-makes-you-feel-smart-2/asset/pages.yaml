    # Conditional Operator


    The conditional operator (?) provides a way to perform if-then-else logic within
    an expression; it is another option for writing extremely complex code. A simple
    example is by comparing x to 1 and printing 1 or 0 depending on the result.


    ```

    if (x == 1)

    cout << 1 << endl;

    else

    cout << 0 << endl;

    ```


    With the conditional operator, this could be expressed as:


    ```

    cout << (x == 1 ? 1 : 0) << endl;

    ```


    The general form of the conditional operator ?expr1:expr2. The condition is evaluated.
    If true (nonzero), expr1 is evaluated and returned as the value of the expression;
    otherwise, expr2 is evaluated and returned as the value of the expression.


    Precedence of the conditional operator is very low, so a conditional expression
    (like that just shown) typically needs to be enclosed in parentheses.


    # Assignment Operators


    All the assignment operators return the value that was assigned, permitting multiple
    assignments such as the following:


    ```

    x = y = z;

    ```


    Many assignment operators are provided as convenient shorthand for some operate-assign
    action. For example, the expression


    ```

    i += 1;

    ```


    is functionally equivalent to the following:


    ```

    i = i + 1;

    ```


    Similarly, for all the operators such as \=, *= -=, and so on, note that the expression


    ```

    (i += 1)

    ```


    is equivalent to


    ```

    (++i)

    ```


    because they both say, "Add 1 to the value of i, and then pass this value along
    to the larger expression."


    # Join (,) Operator


    The join, or comma, is a way of combining multiple expressions in the space of
    a single expression. This is useful for statements in which there''s a need to
    initialize or increment more than one variable:


    ```

    for (i = 0

    ```


    In general, the comma operator is to evaluate both conditions on either side of
    the comma (,) and then return the value of the second expression. In addition
    to for, another useful situation is the following, where the comma is used to
    execute several actions at the top of a loop before finally testing the condition
    < 10:


    ```

    while (i = j + 1, cout << "i", i < 10)

    i++;

    ```


