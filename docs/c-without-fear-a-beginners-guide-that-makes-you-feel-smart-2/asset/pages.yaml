    # Formatting long Numbers

    Printing formatted numbers with the proper digit-group separators is more of a
    challenge, because the program has to make intelligent decisions about where to
    put those characters.


    Fortunately, the programming is made easier if you use the STL subclass, which
    treats strings as outputs: you can write a string you would to the console or
    a file. Make sure you include both these files:


    ```

    #include <string>

    #include <sstream>

    ```


    Now you can create and use a "string stream." You can write to the following object,
    s_out, just as you would to cout. After you are writing the object, convert to
    an actual string by using the str method.


    ```

    stringstream s_out;

    s_out << "The value of i answer is" << i << endl;

    string s = s_out.str();

    ```


