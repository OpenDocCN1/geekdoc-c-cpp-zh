  md: '# Example 6.2. Array Sorter


    Now it''s time to show how this swap function works. Pointers are not limited
    to pointing to simple variables—although I used to keep things simple. An int
    pointer (for example) can point to any memory location that stores an int value.
    This means it can point to elements of an array as well as pointing to a variable.


    For example, here the swap function is to swap the values of two elements of an
    array named arr:


    ```

    int arr[5] = {0, 10, 30, 25, 50};


    swap(&arr[2], &arr[3]);

    ```


    Given the right procedure, you can use the swap function to sort the values of
    an array. Take a look at arr again—this time with the data jumbled


    | 30 | 25 | 0 | 50 | 10 |

    | arr[0] | arr[1] | arr[2] | arr[3] | arr[4] |


    Here''s a straightforward solution—the well-known "bubble sort" algorithm:


    +   1. Find the lowest value and put that value in arr[0].

    2. Find the next lowest value and put that value in arr[1].

    3. Continue in this manner until you get to the end.


    Here is the solution written in pseudocode:


    For i = 0 to n - 2

    Find the lowest value in the range a[i] to a[n-1]

    If i is not equal to the index of the lowest value found

    swap(a[i], a[index_of_lowest])


    That''s the plan. It will be to put the lowest value in a[0], the next lowest
    value in a[1]. Note that


    For i = 0 to n - 2,


    I mean a for loop in which i is set to 0 during the first cycle of the loop, 1
    during the next cycle of the loop, and so on, until i is set to n-2, at which
    point it completes the last cycle. Each cycle of the loop places the correct element
    in a[i] and increments i.


    Inside the loop, a[i] is compared to all the remaining elements (the range a[i]
    to a[n-1]), which includes all elements on the right). By the time every of i
