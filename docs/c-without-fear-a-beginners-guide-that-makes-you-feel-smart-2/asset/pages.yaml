    \ << pt1.y + 4; // Print sum of two integers.\n```\n\nBefore we leave the simple\
    \ version of the Point class, there's an aspect of syntax worth commenting on.\
    \ A class declaration ends with a semicolon.\n\n```\nclass Point {\npublic:\n\
    \  int x, y;\n};\n```\n\nWhen you are starting to write C++, the semicolon is\
    \ easy to get tripped up. A class declaration requires a semicolon after the closing\
    \ brace (_), whereas a function definition rejects that a semicolon. In other\
    \ words, you'd get a syntax error.\n\nKeep in mind this cardinal rule:\nA class\
    \ declaration always ends with a semicolon.\n\n> A class or data declaration places\
    \ a semicolon after the closing brace, whereas function definitions do not.\n\n\
    # Interlude: Interlude for C Programmers: Structures and Classes\n\nIn C++, the\
    \ **struct** and **class** keywords are equivalent, except that members of a **struct**\
    \ are public by default. Both keywords create members. This means that the general\
    \ term **class** and the **class** are not precisely co-extensive.\n\nIn C, when\
    \ you declare a struct, you have to reuse the **struct** keyword whenever the\
    \ new type name appears—for example, when creating individual data items.\n\n\
    ```\nstruct Point pt1, pt2, pt3;\n```\n\nThis is not necessary in C++. Once you\
    \ declare it (with either the **struct** or **class** keyword), you can use the\
    \ name in all contexts involving a type. So if you port C-language code to C++,\
    \ you can replace the previous data declaration with this:\n\n```\nPoint pt1,\
    \ pt2, pt3;\n```\n\nThe support of **struct** in C++ arises from the need for\
    \ backward compatibility. Code often uses the **struct** keyword.\n\n```\nstruct\
    \ Point {\n  int x, y;\n};\n```\n\nThe C language has no **public** or **private**\
    \ keywords, and the user of a **struct** type must be able to access all members.\
    \ For backward compatibility with C, **struct** had no public members by default.\n\
    \nDoes C++ even need a **class** keyword? Technically, no. The **class** keyword\
    \ performs a self-documenting function, because the purpose of a **class** is\
    \ to easily add function members. Moreover, **class** members are private by design.\
    \ In object orientation, making a member public to happen only to be a deliberate\
    \ choice.\n\n# Private: Members Only (Protecting the Data)\n\nIn the previous\
    \ section, the Point class permitted access to its data members because they were\
    \ declared public.\n\nBut what if you want to control access to data members?\
    \ You might, for example, want to ensure that the data is in a particular range.\
    \ The way to do that is to make members private and provide access through public\
    \ functions.\n\nThe following version of Point prevents direct access to x and\
    \ y from outside the class:"
