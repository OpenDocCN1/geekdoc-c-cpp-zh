    \ empty state.\n\nThis approach provides a lot of flexibility. As long as the\
    \ size doesn't exceed MAX_LEVELS (a constant declared in the program), the animation\
    \ can be restarted with any size requested by the user. For example, if the stack\
    \ size is 5, the populate and clear functions are called to fill the st-tops with\
    \ values 1 to 5 and leave the other stacks empty (0 value) in the first five positions.\n\
    \n![](img/a7964e9035b7ca0710b559c70a60c09a_258_0.png)\n\nWith this array of objects\
    \ in place (each of which contains its own array), we can now move rings between\
    \ the three positions by calling pop and push as appropriate and, after each move,\
    \ painting a picture that represents the new state.\n\n# Example 15.2. Animated\
    \ Tower\n\nWith the class design in place, we can now write the animation Tower\
    \ of Hanoi. This program builds on the Tower of Hanoi example Chapter 4, using\
    \ the recursive logic to solve the problem of moving all rings from pole 1 to\
    \ pole 3.\n\nRemember the two constraints: You can move only one ring at a time,\
    \ and a larger ring can never be placed on a smaller ring.\n\nThis version solves\
    \ the problem and displays the state of the three poles (that is, the three stacks\
    \ of rings) after each and every move.\n\n```\n#include <iostream>\n\nusing namespace\
    \ std;\n\n#define MAX_LEVELS\n\n// Declare three pole positions, or rather, stacks.\n\
    // Each stack is an object containing ring values.\n// stacks[3] is an array of\
    \ these objects.\n\nclass mystack {\npublic:\n    int rings[MAX_LEVELS]; // Array\
    \ of ring values.\n    int tos; // Top-of-stack index.\n    void populate(int\
    \ size); // Initialize stack.\n    void clear(int size); // Clear the stack.\n\
    \    void push(int n);\n    int pop(void);\n} stacks[3];\n\nvoid mystack::populate(int\
    \ size) {\n    for (int i = 0; i < size; i++)\n    rings[i] = i + 1;\n    tos\
