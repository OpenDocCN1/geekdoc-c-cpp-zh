  md: "This example revisits the Point class from the previous chapter and adds a\
    \ couple of simple constructors—the default constructor and a constructor taking\
    \ two arguments. It tests these in a simple program.\n\n# Point2.cpp\n\n```\n\
    #include <iostream>\nusing namespace std;\n\nclass Point {\nprivate:\n    int\
    \ x, y; // Data members\npublic:\n    Point() {x=0; y=0}; // Constructors\n  \
    \  Point(int new_x, int new_y) {set(new_x, new_y)};\n\n// Other member functions\n\
    \    void set(int new_x, int new_y);\n    int get_x();\n    int get_y();\n};\n\
    \nint main() {\n    Point pt1, pt2;\n    Point pt3(5, 10);\n\n    cout << \"The\
    \ value of pt1 is: \";\n    cout << pt1.get_x() << \", \" << endl;\n    cout <<\
    \ pt1.get_y() << \", \" << endl;\n\n    cout << \"The value of pt3 is: \";\n \
    \   cout << pt3.get_x() << \", \" << endl;\n    cout << pt3.get_y() << \", \"\
    \ << endl;\n    system(\"PAUSE\");\n    return 0;\n}\n\nvoid Point::set(int new_x,\
    \ int new_y) {\\n    if (new_x < 0)\n        new_x *= -1;\n    if (new_y < 0)\n\
    \        new_y *= -1;\n    x = new_x;\n    y = new_y;\n}\n\nint Point::get_x()\
    \ {\n    return x;\n}\n\nint Point::get_y() {\n    return y;\n}\n```\n\n![](img/a7964e9035b7ca0710b559c70a60c09a_207_0.png)\n\
    \n# How It Works\n\nTwo lines in the class declaration add the constructors. Because\
    \ these are provided as inline functions, no other external function need to be\
    \ added.\n\n```\npublic: // Constructors\nPoint() {x=0; y=0};\nPoint(int new_x,\
    \ int new_y) {set(new_x, new_y)};\n```\n\nNote that the two constructors are defined\
    \ in the public section of the class. If they were declared private, they wouldn't\
    \ be accessible to users of the Point class, and so the whole (point) would be\
    \ lost.\n\nThe default constructor sets Point members to zero—useful behavior\
    \ if the user of the class forgets to initialize them explicitly."
