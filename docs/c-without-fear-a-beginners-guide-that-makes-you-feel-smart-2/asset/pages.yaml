  md: '# # Introducing Boolean (Short-Circuit) Logic


    Sometimes you need words like *and*, *or*, and not to express a decision. This
    is just common sense. For example, here (in pseudocode) is a decision that uses
    "and".


    ```

    if age > 12 and age < 20

    The subject is a teenager

    ```


    Programmers use Boolean algebra, named for nineteenth-century mathematician George
    Boole, to express such conditions. For example, subexpressions "age > 12" and
    "age < 20" are evaluated, and if both are true, the whole expression is true:


    ```

    age > 12 and age < 20

    ```


    The following table summarizes the three logical (Boolean) operators in C++:


    | SYMBOL | OPERATION | C++ SYNTAX | ACTION |

    | --- | --- | --- | --- |

    | && | AND | expr1 && expr2 | Evaluate expr1. If it''s true, evaluate expr2. If
    both are true, return true; otherwise, return false. |

    | || | OR | expr1 || expr2 | Evaluate expr1. If it''s false, evaluate expr2. Return
    true unless both are false. |

    | ! | NOT | !expr1 | Evaluate expr1. Return the inverse value. |


    So, the earlier example "and" would look in C++:


    ```

    if (age > 12 && age < 20)    // if age>12 age<20

    cout << "The subject is a teenager.";

    ```


    Logical operators have lower precedence than the relational operators (<, >, >=,
    <=, !=, ==), which in turn have lower precedence than arithmetic operators (+
    and -). Consequently, the statement does what you''d probably expect:


    ```

    if ((x + 2) > y && a == b)

    cout << "The data passes test.";

    ```


    This means "x + 2 is greater than y and is equal to b, then print the message."
    Of course you can create greater clarity by using parentheses:


    ```

    if (((x + 2) > y) && (a == b))

    cout << "The data passes test.";

    ```


    In C++, the "and" and "or" operators employ short-circuit logic: This means the
    second operand is evaluated only if it needs to be. For example with "and" (&&),
    the first condition is evaluated: If it''s false, the value of the entire expression
    is false, and the second condition is not evaluated. This can make a difference
    if the second condition has side effects.


    # Logical AND (&&)


    ![](img/a7964e9035b7ca0710b559c70a60c09a_56_0.png)


    > Note


    Don''t confuse the logical operators with the C++ bitwise operators (&, ^, and
    ~). The bitwise operators compare each bit in one operand to the corresponding
    bit in the other. Bitwise operators do not use short-circuit logic, while logical
    operators do.


    # Interlude: What is "true"?


    The logical operators—&&, ||, and !—can take any input as long as they are convertible
    to bool, which is a subset of'
