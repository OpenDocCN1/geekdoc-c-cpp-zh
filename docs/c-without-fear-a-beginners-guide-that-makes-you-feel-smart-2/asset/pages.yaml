  md: '# # Single-Character Functions


    To use any of the functions in [Table F.3](#) or [Table F.4](#), include `<cctype>`.
    Each of the functions in this first subgroup tests a single character and returns
    true or false.


    # ## Table F.3. Character-Testing Functions


    | FUNCTION | ACTION |

    | --- | --- |

    | `isalnum(ch)` | Is the character alphanumeric (a letter or digit)? |

    | `isalpha(ch)` | Is the character a letter? |

    | `iscntrl(ch)` | Is the character a control character? (These include backspace,
    newline, feed, and tab, among others; these are nonprintable characters that perform
    actions.) |

    | `isdigit(ch)` | Is the character a digit in the range 0 to 9? |

    | `isgraph(ch)` | Is the character visible (This includes printable characters
    other than a space.) |

    | `islower(ch)` | Is the character lowercase letter? |

    | `isprint(ch)` | Is the character printable? (This includes space characters.)
    |

    | `ispunct(ch)` | Is the character punctuation character? |

    | `isspace(ch)` | Is the character white space? (This includes tab, newline, and
    form feed, in addition to the simple space character.) |

    | `isupper(ch)` | Is the character an uppercase letter? |

    | `isxdigit(ch)` | Is the character a hexadecimal digit? This includes digits
    in the range 0 through 9, as well as A through E and a through e. |


    Including `<cctype>` also adds declarations for the following two conversion functions.


    # ## Table F.4. Character Conversion Functions


    | FUNCTION | ACTION |

    | --- | --- |

    | `tolower(ch)` | Returns a lowercase letter if ch is an uppercase letter; otherwise,
    returns ch as is |

    | `toupper(ch)` | Returns an uppercase letter if ch is a lowercase letter; otherwise,
    returns ch as is |


