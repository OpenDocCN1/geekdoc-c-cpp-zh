  md: '# 12. Constructors: If You Build It...


    One of the themes in this book is that object orientation is a way to create fundamental
    new data types—types that, if useful, can be reused in multiple programs.

    The promise that you can make classes as convenient as standard data types has
    yet to be fulfilled. One of the most important features of types such as int,
    float, double, and so on, is that you can initialize them as you declare them.

    nBut you''re about to see how to do that with classes. Welcome to the craft of
    C++ construction.


    # Introducing Constructors


    The term constructor is C++speak for an initialization function, specifically,
    I mean functions that the compiler knows how to interpret declarations like this:


    ```

    Fraction a(1, 2);      // a = 1/2

    ```


    Given you''ve seen of the Fraction class, you''d probably guess what that this
    declaration ought to have the same effect as the following statements:


    ```

    Fraction a;

    a.set(1, 2);

    ```


    And in, in this chapter, we''re going to make the class behave precisely that
    way. But the computer has no way of guessing this is what you want to do. You
    have tell the computer how to carry out initializations. This is what constructors
    are for.


    A constructor is a special member function (and so, it must be declared inside
    the class). It has this syntax:


    ```

    class_name(argument_list)

    ```


    This makes for an odd-looking function. There is no return type—void! The class
    name, in a sense, is the return type. Here''s an example:


    ```

    Fraction(int n, int d);

    ```


    Within the context of the class, the declaration looks like:


    ```

    class Fraction {

    public:

    //

    Fraction(int n, int d);

    //

    };

    ```


    This is only a declaration, of course. Like any function, the constructor needs
    to be defined somewhere. You can place the definition outside the class declaration,
    if you choose, in which case you to use a Fraction:: prefix to clarify scope:


    ```

    Fraction::Fraction(int n, int d) {

    set(n, d);

    }

    ```


    A constructor defined outside of the declaration has this syntax:


    ```

    class_name::class_name(argument_list) {

    stements;

    n

    ```


    The first use of class_name is in the prefix (class_name::), which states that
    this is a member function of the specified class. The second use of class_name
    defines the scope; the third uses the function name itself.


    Confused? Just remember the name of the constructor is always the name of the
    class. Therefore, the first use of class_name defines the scope;


    You can also inline the constructor. Because most constructors are short, they
    are often good candidates for inlining.'
