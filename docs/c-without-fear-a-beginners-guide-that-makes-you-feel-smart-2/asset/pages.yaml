    All data on a computer is ultimately numeric, but it is organized into one of
    three basic formats: integer, floating-point, and text string.


    | Integer | 5 | -33 | 106 |

    | Floating-point | -8.7 | 2.003 | 387.6 |

    | Text String | "Call me Ishmael" |


    There are several differences between floating-point and integer format. But the
