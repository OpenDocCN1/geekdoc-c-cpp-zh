  md: '# C. Syntax Summary


    This appendix gives a general overview of the core C++ language.


    # Basic Expression Syntax


    Except in the case of void expressions, an expression is something that produces
    a value. Expressions are the fundamental building blocks of statements, because
    an expression can be turned into a statement by adding a semicolon (.).


    Smaller expressions can form part of larger expressions. For example, an expression
    is formed by addition:


    ```

    expression + expression

    ```


    Each of these can be any smaller expressions that produce a numeric value. (Also,
    pointers may be added to integers; see Appendix A.) The result is that an expression
    can be used, in turn, in larger expression.


    In C and C++, expressions can produce side effects. For example, the decrements
    j by 1, multiplies the result by 3, and assigns the result of j to x and y:


    ```

    x = (y = 3 * --j);

    ```


    This statement contains one long expression terminated by a semicolon (;). Note
    that assignment is not a kind of statement but merely another kind of expression.
    Several of these expressions have side effects. --j decrements the value of j
    before using j in the assignment expression:


    ```

    y = 3 * --j

    ```


    Assignment is with a side effect, in this case, setting the value of y. As all
    assignment operators (see Appendix A), the value is assigned along the larger
    expression, which in turn assigns this value to x.


    The following are all expressions:


    ```

    literal

    symbol

    expression op // (binary op)

    op expression // (unary op)

    expression expression // (unary op)

    function(args)

    ```


    In addition, C++ supports one ternary operator: the conditional operator.


    # Basic Statement Syntax


    Statements are the building blocks of C++ programs because a program consists
    of one or more functions, and each function consists of zero or more statements.


    The most common form of a statement in C++ is an expression terminated by a semicolon
    (;). Notably, semicolons are statement terminators, not statement separators as
    they are in Pascal.


    ```

    expression;

    ```


    It is also valid to have a statement with no expression. This is an empty statement.


    ```

    ;

    ```


    Any number of statements can be grouped together to form a compound statement
    (also called a block). Remember that a compound statement is valid anywhere a
    single statement is valid.


    ```

    { statements }

    ```


    Each of the control structures (covered in the next four sections) also defines
    a statement. Control structures can therefore be nested to any level.'
