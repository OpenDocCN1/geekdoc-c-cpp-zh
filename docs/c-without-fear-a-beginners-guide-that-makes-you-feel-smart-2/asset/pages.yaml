    example if there are four rings, the following is:


    +   - An empty stack has array values [0, 0, 0, 0]; tos = 3.

    - A stack with just one ring, the largest, has (0, 0, 0, 3); tos = 2.

    - If the smallest is pushed onto that, it has (0, 0, 1, 3); tos = 1.

    - A full stack has array values'
