    # Interleave: Infinite Loopness


    > Can you set the loop condition in a way that it always be true? And if so, what
    happens? The answer is yes, and the loop will run until something interrupts it
    (One way is to use the break keyword, as seen in upcoming material).


    Unless you have a mechanism for escaping a loop, it''s important to make sure
    it doesn''t run forever. Otherwise, the program will seem to reach a state where
    it sits and does nothing. It''s not nothing; it can''t break out of a pointless
    loop that left to itself, threatens until the end of time.


    Therefore, always sure there''s a way to exit.


