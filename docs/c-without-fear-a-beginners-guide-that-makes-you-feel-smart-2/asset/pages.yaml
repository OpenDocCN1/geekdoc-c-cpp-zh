    \ + 1];\ncin.get(input_string, MAX_WIDTH);\nlong n = atoll(input_string);\n```\n\
    \nThe long long type presents another challenge: When numbers get too big, they\
    \ are difficult for an end user to read or write. For example, you might have\
    \ a program that tests numbers for prime being, but you want to use it on very\
