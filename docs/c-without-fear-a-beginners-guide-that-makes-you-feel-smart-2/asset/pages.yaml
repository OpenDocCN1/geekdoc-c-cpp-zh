  md: "# Operator Functions: Doing It with Class\n\nAfter reading Chapter 12, you\
    \ know how to write classes (objects) that work like standard data types, right?\n\
    \nWell, almost. One of the most important features of a standard data type such\
    \ as int, float, double, and even char is that you can perform operations on them.\
    \ Without these operators, it would be difficult to perform any calculations in\
    \ C++ at all.\n\nC++ lets you define how to perform these operations (such as\
    \ +, -, *, and /) on objects of your class. You can also define how test-for-equality\
    \ is carried out, helping you determine whether two quantities are equal, in this\
    \ fragment of code:\n\n```\nFraction a(1, 2), b(1, 3);\nif (a + b == Fraction(5,\
    \ 6))\ncout << \"1/2 + 1/3 equals 5/6\";\n```\n\n# Introducing Class Operator\
    \ Functions\n\nThe basic syntax for writing class-operator functions is fairly\
    \ simple.\n\n![](img/a7964e9035b7ca0710b559c70a60c09a_217_0.png)\n\n```\nreturn_type\
    \ operator@(argument_list);\n```\n\nIn this syntax, replace the symbol @ with\
    \ a valid C++ operator, such as +, -, *, or /. Any operator supported by C++ standard\
    \ types can be used. Normal precedence rules are enforced, and so appropriate,\
    \ for the symbol. (See Appendix A.)\n\nYou can declare an operator function as\
    \ either a member function or a global (that is, nonmember) function.\n\n+   *\
    \ If you declare an operator function as a member function, then the object through\
    \ which the function is called corresponds to the left operand.\n* If you declare\
    \ an operator function as a global function, then each operand corresponds to\
    \ a function argument.\n\nHere's how the + and - operator functions are declared\
    \ inside the Point class:\n\n```\nclass Point {\n//..\npublic:\n  Point operator+(Point\
    \ pt);\n  Point operator-(Point pt);\n};\n```\n\nGiven these declarations, you\
    \ can apply operators to a Point object:\n\n```\nPoint point1, point2, point3;\n\
    point1 = point2 + point3;\n```\n\nThe compiler interprets this by calling the\
    \ operator+ function through the left operand—point2 in this case. The right operand—point3—becomes\
    \ the argument to the ber function. You can visualize the relationship this way.\n\
    \n```\npoint2 + point3\noperator+(Point pt)\n```\n\nWhat happens to point2? Is\
    \ its value ignored? No. The function treats point2 as \"this object,\" so that\
    \ unqualified use to x and y refer to point2's copy of x and y. You can see how\
    \ this works in the function definition:\n\n```\nPoint::operator+(Point pt) {\n\
    \  Point new_pt;\n  new_pt.x = x + pt.x;\n  new_pt.y = y + pt.y;\n  return new_pt;\n\
    }\n```"
