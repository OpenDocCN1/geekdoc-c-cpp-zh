    # # Allocating Multiple Data


    So far, I''ve shown how to dynamically allocate memory at runtime—to ask for more
    than the program originally required. This sounds good, but is it it of value?
    Actually, in advanced applications, it''s all the time of.


    A simple and rather common, case is this: What if need to allocate space for an
    array, but you don''t know ahead of time how big to make the array? One obvious
    solution is to use arrays so you don''t think they''ll be exceeded and nothing
    goes wrong. This clearly is the best solution.


    C++ enables you to declare a memory block of arbitrarily large size by using new—subject
    only to the physical limits of the computer and the operating system.


    ![](img/a7964e9035b7ca0710b559c70a60c09a_236_0.png)


    new type[size]


    This expression allocates size elements, in element each has the specified type;
    then it returns the address of the first element. The type can be either standard
    type (int, double, char, or a class. size is an integer value.


    This version produces the kind of expression—a pointer to the specified type—produced
    by other uses of new. You can use it as you would an array name.


    ```

    double *p = new double[50];

    p[0] = 3.1415;

    p[20] = -25.7;

    ```


    The specified size need not to be a constant. You can determine how many elements
    are needed at runtime. For example:


    ```

    int n;

    cout << "How many elements?";

    cint >> n;

    int *p = new int[n];

    ```


    Remember that this use of new produces the same kind of expression as the single-item
    version: a pointer to the requested type. You can allocate multiple Fraction objects,
    for example, getting back a pointer of type Fraction.


    ![](img/a7964e9035b7ca0710b559c70a60c09a_236_1.png)


    By the end of the program, you should use the delete operator to destroy any new
    memory objects you''ve created. If you have allocated memory block using this
    syntax in section, release that block by using this form of delete.


    ![](img/a7964e9035b7ca0710b559c70a60c09a_236_2.png)


    ```

    delete []pointer;

    ```


    This syntax describes a complete statement.


    # Interlude: Dealing with Problems in Memory Allocation'
