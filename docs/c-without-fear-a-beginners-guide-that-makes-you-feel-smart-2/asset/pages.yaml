  md: '# Arrays: All in a Row...


    Much of the power of computers stems from their ability to work on arbitrarily
    large amounts of data—arbitrary in this case meaning “any number of times you
    like.”


    An array is an arbitrarily large collection of data indexed by number. With a
    few keystrokes you can create array data structures of any size. Then, by using
    loops, you can process the data structure efficiently, often with just a few lines
    of code. Loops and arrays go in hand. Together, they make programs not just powerful
    but useful.


    # A First Look at C++ Arrays


    Suppose you are writing a program to analyze scores given by five judges in an
    Olympic kite-flying contest. You need to store all five values for a while so
    you can measure statistical properties: range, average, median, and so on. Suppose
    the judges are known by number.


    One way to store the information is to declare five variables. Since the scores
    have a fractional portion (0.1 being the lowest and 9.9 being the highest), use
    type double.


    ```

    double scores1,scores2,scores3,scores4,scores5;

    ```


    That''s a lot to enter. Wouldn''t it be easier to just enter the word scores and
    let C++ to declare variables for you?


    That''s exactly what happens when you declare an array.


    ```

    double scores[5];

    ```


    This declaration creates five items of type double and places them next to each
    other in memory. In C++ programs, these items are referred to as scores[0], scores[1],
    scores[2], scores[3], and scores[4]. The numbers between brackets are indexes.


    | scores[0] | scores[1] | scores[2] | scores[3] | scores[4] |


    In the rest of the program, you can perform operations on each of these as if
    it were an individual variable.


    ```

    scores[0] = 2.7;      // Judge 0 gives a low score.

    scores[2] = 9.5;       // Judge 2 gives a high score.

    scores[1] = scores[2];  // Judge 1 copies Judge #2.

    ```


    Each of these array elements (scores[0], scores[1], and so on) acts like a variable
    of type double—the difference being it is referred to, by number. After these
    operations are performed, the array looks like this:


    ```

    scores[0] = 2.7;

    scores[2] = 9.5;

    ```


    | 2.7 | 9.5 | 9.5 | |

    | scores[0] | scores[1] | scores[2] | scores[3] | scores[4] |


    ```

    scores[1] = scores[2];

    ```


    With only five elements, an array can be helpful. But that''s nothing compared
    to the convenience of larger arrays. How much labor you suffer if you have an
    array of 1,000 elements?


    ```

    int votes[1000];      // Declare array with 1000

    elements

    ```


    This declaration creates an array with 1,000 elements, running from votes[0] to
    votes[999].


    To summarize, you can declare variables of int or double (or any other supported
    data type) using this syntax:


    ```

    type array_name[size];

    ```


    As a result, array_name is created as an array of the size. Each element of the
    array has the indicated type.'
