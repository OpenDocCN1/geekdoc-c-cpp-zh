  md: '# Chapter 6 Summary


    Here are the main points of Chapter 6:


    +   * A pointer is a variable that can contain a numeric memory address. You can
    declare a pointer by using the following syntax:

    type *p;


    +   * You can initialize a pointer using the address operator (&):

    p = &n; // Assign address of n to p.


    +   * Once a pointer is initialized, you can use the indirection operator (''*'')
    to manipulate data pointed to the pointer:

    p = 5; // Assign 5 to n.


    +   * To enable a function to manipulate data (pass by reference), pass an address:

    double double_it(double *n);


    +   * To receive an address, declare an argument pointer type:

    void double_it(int *p);


    +   * An array name is a constant that translates to the address of its first
    element. A reference to an array element a[n] is translated into the pointer reference,
    (*a + n).


    +   * When an integer value is added to an address expression, C++ performs scaling,
    multiplying the integer by the size of the expression''s base type:

    new_address = address_expression + (integer * size_of_base_type);


    +   * The unary operators * and ++ operators associate right-to-left. Consequently,
    this expression:

    *p++ = 0;


    does the same thing as the following expression, which sets *p to 0 and then increments
    the pointer p to point to the next element:

    (*p++) = 0;'
