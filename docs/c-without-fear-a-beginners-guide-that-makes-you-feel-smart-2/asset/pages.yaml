    | ctemp | ftemp |


    How do values get into variables? One way is through console input. In C++, you
    can input values using the cin object, representing (appropriately enough) console
    input. With cin, you use a stream operator showing data flowing to the right (>>):


    ![](img/a7964e9035b7ca0710b559c70a60c09a_36_0.png)


    Here''s what happens in response to this statement. (The actual process is a little
    more complicated, but don''t worry about that now.)


    +   1. The program suspends running and waits for him to enter a number.

    2. The user types a number and presses ENTER.

    3. The number is accepted and placed in the variable ctemp (in this case).

    4. The program resumes running.


    So, if you think about it, a lot happens in response to this statement:


    ```

    cin >> ctemp;

    ```


    But before you can use a variable in C++, you must declare it. This is an absolute
    rule, and it makes C++ different from Basic, which is sloppy in this regard and
    does not require declaration. (But generations of Basic programmers have banged
    their heads against their terminals as they discovered errors cropping up as a
    result of Basic''s lackness about variables.)


    This is important to justify stating, so I''ll make it a cardinal rule:


    > In C++, you must declare a variable before using it.


    To declare a variable, you have to first know what data type to use. This is a
    critical concept in C++ as in most other languages.


    # Introduction to Data Types


    So, a variable is something you can think of as a magic box into which you can
