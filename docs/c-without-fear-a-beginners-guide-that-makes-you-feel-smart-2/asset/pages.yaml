  md: '![](img/a7964e9035b7ca0710b559c70a60c09a_295_0.png)


    These days, I still think that there''s no bad way to get grip on some of the
    concepts. Individual, self-contained entities like to shield their contents; they
    however fear encapsulation—the ability to keep their private data.


    I''m not sure how well intelligence is demonstrated by this model, although you
    can make it. If each of the individual objects is like a microprocessor or chip
    (think of it in hardware terms), then ideally you be able to pop out a chip, make
    some modifications or improvements to it, and pop it back in.


    Above all, the model of “independent entities sending messages to each other”
    is a good way of illustrating polymorphism and virtual functions are all.


    Recall what I said little earlier about the Printable interface in the introduction
    to Example 17.2. Here I paraphrase it in general terms:


    > You may use an object without knowing its type or what functions it calls, because
    the knowledge of how perform the service is built into the object itself, not
    the user of that object.


    This principle is consistent with the idea of independent objects that communicate
    by sending messages. The user of an object doesn''t need to tell it how to do
    its job. What goes inside another object is a mystery. You send a message, knowing
    that the object will respond in some appropriate way.


    In essence, objects—independent units of code and data—are liberated from slavish
    dependence on the internal structure of other objects.


    But the result is not anarchy. Object-oriented programming systems enforce discipline
    in the area of checking. If you want to support an interface, you have to implement
    all services (that is, virtual functions) of that interface, and you have to match
    the types in the list exactly.


    You can implement a function in a way that had not been written at the time the
    client code was written. Remember that the following will always work—without
    being reordered or recompiled—even if the specific type of an_object changes.


    ```

    Printable = &anobject;

    cout << *;

    ```


    # # A Final, Final Word


    What does this all mean? Why does polymorphism matter? Is it because it contributes
    to code reuse? Well, it''s not primarily that.


    Object-oriented programming is more like systems—practical systems, network communication,
    and other aspects of the technology we become more immersed in. In a graphical-user
    interface, or in a network, like independent objects sending messages to each
    other.


    Traditional programming techniques were developed for a different world, a world
    in which it could be a triumph to submit a pack of chunks and program a successful
    beginning, middle, and end, rather than gathering and puking. When you assume
    that you''re the only one in game,


    Today''s software has become more complex as it has become. The success of Microsoft
    Windows, for example, is in its set of components. And the component model is
    not easy to implement with traditional programming techniques. You want to be
    able to reuse software objects, combining existing frameworks, such as Windows.


    Ultimately, this way of looking is closer to the reality of the great world. One
    of the most exalted claims for object orientation is that “it closely models the
    real world.” An inflated claim but one with a nugget of truth. We live in a world
    with things and people independent from ourselves. We do need to trust in specialized
    knowledge that others can bring. And if we could liberate software objects, giving
    them the independence and freedom to do what each knows how to do best, we might
    feel more encouraged to liberate ourselves.'
