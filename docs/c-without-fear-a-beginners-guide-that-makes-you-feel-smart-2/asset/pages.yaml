    # # Reference Variables and Arguments (&)


    Before you proceed to learn about the other special constructor (called the copy
    constructor), it''s necessary to take a detour to learn about C++ references.


    Simply stated, a reference in C++ provides the behavior of a pointer without the
    pointer syntax. That''s an important point, so let me state it again.


    > > A reference variable, argument, or return value provides behavior very much
    like a pointer, but it does not have pointer syntax.


    The simplest way to manipulate a variable, of course, is to do so directly:


    ```

    int n;

    n = 5;

    ```


    The next way to manipulate a variable—as you should recall from Chapter 6—is to
    use a pointer.


    ```

    int n, *p; // Let p point to n.

    *p = 5; // Set the thing p POINTS TO, to 5.

    ```


    Here, p points to n, so setting ''*p to 5 has the same effect as setting n to
    5.


    The important point here (and I will resist the temptation to use puns) is that
    there is only one copy of n, but you can have any number of pointers to it. Getting
    a reference does not create a new integer, just it creates another way to manipulate
    n.


    ```

    int n;

    int &r = n;

    ```


    You may notice amass (&) is the same character used for the address operator.
    The difference is that amass is being used in a data declaration. Given this context,
    it creates a reference variable that refers to the variable n. This means that
    changes to r (the reference variable) cause changes to n.


    ```

    r = 5; // This has the effect of setting n to 5.

    ```


    This operation has essentially essentially the same effect of using pointer p
    to set the value of n, but with reference variable r, no ''at operator'' (*) is
    used, because it involves pointer redirection.


    ```

    *p = 5;

    ```


    The crucial thing is that references and pointers have in common is that they
    just create another way to access an existing item...they do not allocate memory.
    For example, I can create many references to n:


    ```

    int n;

    int &r1 = n;

    int &r2 = n;

    int &r3 = n;


    r1 = 5; // n is now 5.

    r2 = 25; // n is now 25.

    ```'
