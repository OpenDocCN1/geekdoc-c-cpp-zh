  md: "```\nclass Point { // Data members (private)\nprivate:\n    int x, y;\npublic:\n\
    \    void set_x(int new_x, int new_y);\n    int get_x();\n    int get_y();\n};\n\
    ```\n\nThis class declaration is simple direct. It declares public member functions—set_x\
    \ and get_y—as well as two data members.\nNow, after declaring Point objects,\
    \ the object's user can manipulate values only by calling one of the functions:\n\
    \n```\nPoint point1;\npoint1.set(10, 20);\ncout << point1.get_x() << \", \" <<\
    \ point1.get_y();\n```\n\nThis prints the following:\n\n10, 20\n\nWhat is this\
    \ syntax used with get_x and get_y? Actually, it's not new, we've seen it before\
    \ with other objects, such as string objects and cin.\nThe dot (.) syntax specifies\
    \ that a certain function (in this case, get_x) applies specifically to a particular\
    \ object:\n\n```\npoint1.get_x();\n```\n\nThis function returns the x value stored\
    \ in point1. If you instead try to access a private data member directly, the\
    \ compiler flags that as an error:\n\n```\npoint1.x = 10; // ERROR! The x member\
    \ is private\n```\n\nOf course you have to define the member functions. The function\
    \ definitions can go anywhere, as long as the class is declared. You don't have\
    \ to prototype prototype these functions; in fact the class declaration itself\
    \ defines prototypes.\n\nThe prefix clarifies the scope of these definitions so\
    \ that the compiler knows they apply to the Point class. This is important, because\
    \ other classes could have their own functions with these same names:\n\n```\n\
    void Point::set_x(int new_x, int new_y) {\n    x = new_x;\n    y = new_y;\n}\n\
    \nint Point::get_x() {\n    return x;\n}\n\nint Point::get_y() {\n    return y;\n\
    }\n```\n\nThe scope prefix is added to the function name. The return type (void\
    \ or int, as the case may still appears where it would be with a standard function-definition—at\
    \ the very beginning.\n\nThe syntax for member-function definitions can be summarized\
    \ as follows:\n\n```\ntype class_name::function_name (argument_list) {\n    statements\n\
    }\n```\n\nGiven these functions, you have control over the data. For, for example,\
    \ rewrite the Point::set function so that negative input values are converted\
    \ to positive.\n\n```\nvoid Point::set_x(int new_x, int new_y) {\n    if (new_x\
    \ < 0) {\n        new_x *= -1;\n    }\n    if (new_y < 0) {\n        new_y *=\
    \ -1;\n    }\n    x = new_x;\n    y = new_y;\n}\n```\n\nHere, I am using the multiplication-assignment\
    \ operator (*=); \"new_x *= -1\" that has the same effect as \"new_x = new_x *\
    \ -1\" (You could also use the abs function for this purpose)."
