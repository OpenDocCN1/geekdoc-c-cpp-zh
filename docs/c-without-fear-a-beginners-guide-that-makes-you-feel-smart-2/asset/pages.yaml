    # # Tower of Hanoi, Animated


    Chapter 4 showed how to solve the Tower of Hanoi puzzle by printing instructions
    on how to move the rings. But it would be much more fun to watch the rings move
    around!


    Of course, this requires more programming. We need to track the state of each
