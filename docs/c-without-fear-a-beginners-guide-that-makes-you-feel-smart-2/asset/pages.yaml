  md: "The const is what you need. This keyword ensures that argument cannot be altered\
    \ by the function (which makes sense, because making a copy of something should\
    \ never corrupt the original). The C++ compiler requires you to use const in the\
    \ copy-constructor\n\nThe other thing that's new about this syntax is the use\
    \ of a reference argument. The function gets a reference to the source object,\
    \ not a new copy of it. It is as if the constructor creates a pointer to source,\
    \ using reference rather than pointer syntax.\n\nHere's an example for the Point\
    \ class. First, the copy constructor has to be declared within the class declaration.\
    \ \n\n```\nclass Point {\n    // ...           // Constructors\npublic:\n    Point(Point\
    \ const &src);\n    // ...\n};\n```\n\nBecause this function was not inlined,\
    \ the definition has to be declared separately. Outside of the class declaration,\
    \ Point must occur three times, the first time to define the scope.\n\n```\nPoint::Point(Point\
    \ const &src) {\n    x = src.x;\n    y = src.y;\n}\n```\n\nA short function like\
    \ this can be inlined.\nWhy write a copy constructor at all, if the compiler supplies\
    \ one? In this case—and also in the case of the Fraction class—it't necessary.\
    \ The compiler-supplied copy constructor performs a simple member-by-member copy\
    \ operation, which is sufficient.\n\nIn Chapter 14, I show an example of a class,\
    \ String, that definitely needs a programmer-defined copy constructor to work\
    \ correctly.\n\n![](img/a7964e9035b7ca0710b559c70a60c09a_212_0.png)\n\n> Interlude:\
    \ The Constructor and References\nOne of the main reasons C++ supports references\
    \ is that you can write copy constructors. Without this syntax, it would be impossible.\
    \ Consider, for example, what would happen if you declared a copy constructor\
    \ this way:\n\n```\nPoint(Point const *src)\n```\n\nThe compiler doesn't allow,\
    \ and a little reflection shows why. When an argument is passed to a function,\
    \ a copy of that object must be placed on the stack (the area of memory used to\
    \ store function arguments and addresses). But this would mean for the copy constructor\
    \ to work, it would have to make a copy of that same kind of first object; therefore,\
    \ it would have to call itself! This would be an infinite recursion.\n\nWhat if\
    \ the copy constructor were declared this way?\n\n```\nPoint(Point const *src)\n\
    ```\n\nThere's nothing syntactically wrong with such a declaration, and in fact\
    \ it is a valid constructor. But it can't be used as a copy constructor. This\
    \ syntax indicates that a pointer, not an object, is the argument...and so it\
    \ could only be used with addresses of Points, not with Point objects themselves.\n\
    \nHappily, the difficulty is not insurmountable, because it's basically a problem\
    \ in syntax.\n\nUsing a reference allows the function to work as a copy constructor.\
    \ Syntactically, the argument is an object, not a pointer. However, because the\
    \ implementation of (most likely) involves pointers under the cover, no infinite\
    \ recursion occurs. The function does not have to copy an object as part of the\
    \ process of copying an object!\n\n```\nPoint(Point const &src)\n```\n\n# Example\
    \ 12.3. Fraction Class Copy Constructor"
