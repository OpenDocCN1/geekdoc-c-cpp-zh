  md: "Arithmetic overflow during a calculation.\n\nAn exception is usually, but not\
    \ always, an error. It may be the program's way of sending a signal to itself.\
    \ But in any case, an exception must be handled or the program terminates.\n\n\
    The point of exception handling is to respond to the situation smoothly and reasonably.\
    \ Even if you decide to terminate the program, you want to do so after shutting\
    \ down your resources and providing a helpful message to the user, explaining\
    \ what is going on. The alternative—just abruptly—is not only bad programming\
    \ but plain rude.\n\n# Handling Exceptions: A First Attempt\n\nIn a small program—one\
    \ that involves only a few function calls—you can check for error conditions and\
    \ handle them where you find them. For example, suppose you have a function that\
    \ opens a file for reading after the name of the file from the user. Here's how\
    \ it might look:\n\n```\nifstream input_file;\n\nint open_file({\n    string file_name;\n\
    \n    cout << \"Enter a file name: \";\n    getline(cin, file_name);\n    input_file.open(file_name);\n\
    \    if (!input_file) {\n        cout << \"File could not be opened\";\n     \
    \   return -1;\n    }\n\n    else\n        return 0;\n}\n```\n\nIn this case,\
    \ the program tests for the error condition and responds directly. An error code\
    \ of -1 is generated; but for this, the rest of the program will be able to recognize\
    \ and respond to this value intelligently.\n\nAnd there's a bigger problem. In\
    \ a complex program, this error value must be propagated upward, possibly through\
    \ many functions, up to the level of code that understands the exception. In a\
    \ big program, writing such code can be a headache.\n\n# Introducing try-catch\
    \ Exception Handling\n\nAll the oldest versions of C++ now support the try, catch,\
    \ and throw keywords for handling exceptions. Exception handling centralizes handling\
    \ in your program so that no matter where an exception occurs, control \"pops\
    \ up\" to the right handler.\n\nIn the simple case (shown here), there is just\
    \ one catch block:\n\n![](img/a7964e9035b7ca0710b559c70a60c09a_162_0.png)\n\n\
    ```\ntry {\n    try_statements\n}\ncatch (exception_type [arguments]) {\n    catch_statements\n\
    }\n```\n\nWhen this is structured, the try_statements are executed unconditionally;\
    \ that is, the try_statements are always executed, unless until an exception is\
    \ raised.\n\nIf an exception is raised, either by the try_statements themselves\
    \ or by a function called during execution of these statements, an exception may\
    \ be caught and handled by the catch block, subject to the following conditions.\n\
    \nThe action of the catch block is follows: if the exception matches the specified\
    \ type, control is transferred to the catch block. If it does not match, the next\
    \ catch block is checked, and so on, until the list of catch blocks is exhausted.\
    \ If not the program terminates.\n\nThe items it follows catch may include type\
    \ argument or by itself. The argument is optional."
