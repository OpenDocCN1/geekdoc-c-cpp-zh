    # Building a C++ Program


    Writing a program is the only first step of creating an application. First, you
    enter the program statements.


    # Enter the Program Statements


    To write a C++ program, you need a way to enter the program statements:


    +   * You can use a text editor, such as Microsoft Word or Notepad.


    +   * You can enter text in an integrated development environment (IDE). A development
    environment is a text editor combined with other helpful programming tools. Microsoft
    Visual Studio is a development environment.


    # Build the Program (Compile and Link)


    Building the program is the process of converting your source code (C++ statements)
    into an application. This is usually as easy as pressing a function key. The process
    has two steps: compiling and linking (which brings in standard functions that
    have been written for you). If these steps are successful, you are ready to run
    the program.


    ![](img/a7964e9035b7ca0710b559c70a60c09a_29_0.png)


    If the build was successful, you can pat yourself on the back; neither the compiler
    nor linker found errors. Does that mean you''re done? No. The compiler catches
    syntax errors, as well as errors in program structure. But there are many errors
    it cannot find. Consider this analogy... suppose you have the following sentence:


    > The moon is made green cheese.


    This is not a grammatically correct sentence in English. To fix the grammar, you''d
    insert the word of **of**.


    > The moon is made of green cheese.


    Now the sentence has no syntax errors. But does that necessarily mean it''s a
    true statement? Of course not. You''d need to insert the word **not** in this
    case:


    > The moon is not made of green cheese.


    Programming languages are similar. The C++ compiler determines whether you have
    a syntactically correct program, and the larger question...the of *whether the
    program behaves correctly in all cases*...is not obvious, which brings us to the
    next step...


    # Test the Program'
