  md: '# I/O Stream Objects and Classes


    The classes in this appendix support reading and writing to the console, as well
    as to files and strings. To read and to the console, include <iostream>:


    ```

    #include <iostream>

    cout << "Hello, world." << endl;

    ```


    To write data to a string, include <sstream>. String streams support a member
    function (in addition to the ones listed here, str), which returns the data in
    string format:


    ```

    #include <sstream>

    stringstream s_out;

    s_out << "The value of i is " << i << endl;

    string s = s_out.str();

    ```


    # Console Stream Objects


    The objects listed in Table G.1 provide declared streams to read or write text
    to the console. Each of them supports the appropriate stream operator (<< >>).
    For example:


    ```

    cout << "n is equal to " << n << endl;

    ```


    # Table G.1. Stream Objects


    | FUNCTION | DESCRIPTION |

    | --- | --- |

    | cerr | Console error stream. By default it writes characters to the console
    as cout does; however, this stream may be redirected-with affecting console. Use
    of this object is rarely used. |

    | cin | Console input stream. Reads input from the console as a stream of ASCII
    characters. |

    | clog | Console log stream. Similar to cerr and cout, but intended to display
    runtime messages that are not necessarily errors. Use of this object is rare;
    many programmers never use it. |

    | cout | Console output stream. Displays output to the console as a stream of
    ASCII (8-bit) characters. |

    | wcerr | Wide-character error message stream. Similar to cerr but writes text
    as a series of wide characters. |

    | wcin | Wide Console Output. Similar to cin reads input from the console as a
    stream of wide characters. |

    | wlog | Wide-character log stream. Similar to clog but writes text as a series
    of wide characters. |

    | wcout | Wide-character Output. Similar to cout but writes text as a series of
    wide characters. |


    # I/O Stream Manipulators


    The I/O manipulators in Table G.2 can be used with stream objects to modify how
    they read or write text. For example, the following statement "0x1" to the console:


    ```

    cout << hex << showbase << 31; // Output 0xf.

    ```


    # Table G.2. Stream Manipulators'
