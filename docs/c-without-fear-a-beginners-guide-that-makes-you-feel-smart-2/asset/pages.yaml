  md: '# Interlude: The Virtue of Predefined Constants


    As a beginning programmer, you''ll probably want to enter numbers in a program
    and not worry about defining constants. But the further you move up the level
    of professional programming, the more you''ll be urged, even required, to use
    predefined constants.


    ```

    #define NUMBER_OF_ROWS 20

    ```


    Why is this so important? As I mentioned earlier, a number that appears for no
    apparent reason is as a "magic number." The purpose of such a number is not at
    evident; it seems like some obscure bit of magic dreamed up by the programmer.


    Programmers by nature tend to be people who love order and hate misteries. Reading
    other people''s code is a task that''s challenging without having to decipher
    what it means. So, in most programming "shops," programmers are encouraged to
    define all their constants, just as they are encouraged to use comments.


    This reminds me of an accelerated course in higher math taken by freshmen at Yale.
    The course critiqued wisely, "At least half the semester went before anyone say
    any numbers." This is the way professional programmers are: They want to see symbols
    more than numbers.


    ![](img/a7964e9035b7ca0710b559c70a60c09a_155_0.png)


