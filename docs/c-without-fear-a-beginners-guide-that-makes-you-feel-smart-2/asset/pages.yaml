    \ evaluated.\n\n+   - Use of the statement-block syntax is particularly helpful\
    \ with the **do-while** statement. For example:\n\n```\ndo {\n  i++;\n} while\
    \ (card_drawn(i));\n```\n\n+   - As long as you have more than one function or\
    \ global data declaration, you can subdivide your program into multiple sources.\
    \ Each of these files is a [module](#).\n\n+   - Among other advantages, the use\
    \ of multiple modules enables you to have more than one programmer at a time working\
    \ on a large programming project.\n\n+   - A function can call a function in another\
    \ module, but only if the function is prototyped. For this reason, the common\
    \ practice is to place prototypes for all the common functions at the beginning\
    \ of each and every module. For example:\n\n```\nvoid calc();\nint get_int(int);\n\
    double get_dbl(double);\n```\n\n+   - A conventional approach to managing the\
    \ common functions is to put them into a single file, called an **include** file.\
    \ That file can then be read into each source file with the help of the **#include**\
    \ directive.\n\n```\n#include \"myproj.h\"\n```\n\n+   - Variables to be shared\
    \ throughout the program need to be given an **extern** declaration in each module.\
