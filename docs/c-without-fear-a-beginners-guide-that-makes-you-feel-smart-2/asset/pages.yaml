    # Introducing the Generalized STL Class


    In the previous section, we saw how a simple stack mechanism, storing numbers,
    could be used to implement a Reverse Polish Notation Calculator. Let''s use an
    STL stack for the program.


    Before using the list template, you need to turn on support for it by using an
    **#include** directive.


    ```

    #include <stack>

    ```


    You can then generate a generalized stack mechanism with syntax similar to that
    used for STL lists:


    ![](img/a7964e9035b7ca0710b559c70a60c09a_270_1.png)


    ```

    stack<type> stack_name;

    ```


    For example, you can create stacks with statements like this:


    ```

    #include <stack>

    stack<int> stack_of_ints;

    stack<Fraction> stack_of_Fr;

    stack<Double> xStack;

    ```


    Each of these statements creates an empty stack. To insert elements, use the **push**
    member function. Most of the useful stack member functions are shown in this:


    | CLASS FUNCTION | DESCRIPTION |

    | --- | --- |

    | push(data) | Pushes (data) of stack (of underlying) from top of stack-but does
    not return data; for use, pop. |

    | top() | Returns data of top element |

    | pop() | Removes item of stacks does not return data. |

    | size() | Returns the number of items currently stored in the stack. |

    | empty() | Returns true if stack is empty, false otherwise. |


    Using a stack to push data off the top of the stack is easy enough.


    ```

    stack<int> stack_of_ints;

    stack_of_ints.push(-5);

    ```


    However, the STL design splits the pop operation in two steps (and I don''t know
    why it does this), popping off an item requires ''top'' and ''pop'' operation.


    ```

    int n = stack_of_ints.top(); // Copy top of stack.

    stack_of_ints.pop(); // Remove top of stack.

    ```


