    # Revisiting the Assignment Operator


    Now, remember how assignment works in C++. The assignment operator (=) produces
    an expression just like any other and return a value, which has an important side
    effect: setting the value of the left operand.


    The value returned by an assignment expression, ''X = Y'' returns the value that
    was assigned—in other words, the new value of the left operand. This value can
    be reused in a larger expression. For example, consider this expression:


    ```

    x = y = 0;

    ```


    This statement is equivalent to the following, in which the expression "y = 0"
    returns the new value of y (which is 0) and passes it along:


    ```

    x = (y = 0);

    ```


    The statement assigns 0 to both x and y.


    In C++, assignment-operator functions must return a value, and the value you want
    to return is that of the left operand. In a class operator functin (you''ll recall),
    the left operand is the object through which the function was called.


    But how does an object return itself? That''s right; it uses this pointer. By
    applying the indirection (*) to this, you do not get a pointer to the current
    object it itself.


    In other words, this statement


    ```

    return *this;

