    This statement should create a list of lists. This behavior is perfectly intelligible;
    C++ is directed to create a container class that contains other containers within
    it—no matter how complex that sounds, it is perfectly valid.


    In this case, traditional C++ is syntactically challenged. It is used to interpreting
    two right-angle brackets in a row (>>) as the right-operator, and that causes
    a baffling syntax error. (This same operator, incidentally, is overloaded as a
    stream in-flow operator, that matters as cin.)


    In traditional C++, it is necessary to insert a space between the two right-angle
    brackets to ensure correct interpretation:


    ```

    list<int >    list_of_stacks;

    ```


    In C++, however, adding this space is not necessary, because it specifies that
    the language must correctly interpret two right-angle brackets according to context.


    # Chapter 16 Summary


    Here are the main points of Chapter 16:


    +   - To enable use of the list template, use an include directive:


    ```

    #include <list>

    ```


    +   - Each of the name "list" must be qualified as std::list, unless, of course,
    you place a using statement in your program.


    ```

    namespace std;

    ```


    +   - You declare a list container class using this syntax:


    ```

    list<type>    list_name;

    ```


    +   - Once a list is created, you can add items to it—of the appropriate type—by
    using push_back (push to back of list) and push_front (push to front of list).


    ```

    #include <list>

    using namespace std;

    ...

    list<int> Ilist;

    list.push_back(11);

    list.push_back(42);

    ```


    +   - You can access members of a list by creating an iterator, which is not a
