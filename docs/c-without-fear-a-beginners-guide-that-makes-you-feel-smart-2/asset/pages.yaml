  md: "object (through your class declaration and implementation) to perform certain\
    \ tasks—Repaint, Resize, Move, and so on. These actions are all virtual functions,\
    \ and that is what ensures your implementation of your code.\n\n![](img/a7964e9035b7ca0710b559c70a60c09a_290_0.png)\n\
    \nCentral to this is the concept of interface, which is explicitly part of the\
    \ Java language but is implemented through class inheritance in C++.\n\nIn discussing\
    \ interfaces, I first need to talk about pure virtual functions. A pure virtual\
    \ function is one that has no implementation—at-least, not in the base class.\
    \ You define a pure virtual function by using the notation =0. For example, a\
    \ class might define normalize as follows:\n\n```\nclass Number {\nprotected:\n\
    \    virtual void normalize() = 0;\n}\n```\n\nHere, the normalize function is\
    \ pure virtual. The declaration has no function definition.\n\nWhat is the point\
    \ of such declarations? Well, it all has to do with abstract classes, which I\
    \ describe next.\n\n# Abstract Classes and Interfaces\n\nAn abstract class is\
    \ a class that has one or more pure virtual functions—that is, virtual functions\
    \ without implementations. An important rule is that abstract classes means you\
    \ cannot use the class to declare objects.\n\n> Number a, b, c; // ERROR: Number\
    \ is abstract class\n// because it has a pure virtual\n// func. a, b, c cannot\
    \ be created.\n\nBut an abstract class can be used as a general pattern for its\
    \ subclasses. Suppose you have an inheritance hierarchy for Windows development\
    \ and that hierarchy includes an abstract Form class. You can subclass this to\
    \ create individual, concrete forms.\n\n![](img/a7964e9035b7ca0710b559c70a60c09a_290_1.png)\n\
    \nBefore you use a subclass to instantiate (that is, create) objects, it must\
    \ provide function definitions for all the pure virtual functions in a class.\
    \ A class that has even one of these unimplemented is abstract and therefore cannot\
    \ be instantiated objects.\n\nAll this is useful in turn, because it gives you\
    \ a way of specifying and enforcing a general set of services, or interface. Note\
    \ the following:"
