  md: 'the resulting class Hierarchy can be pictured as here.


    ![](img/a7964e9035b7ca0710b559c70a60c09a_283_0.png)


    Do you see the goal? Point of this inheritance scheme is never to write the same
    function more than once.


    For the example, the Graphical Object—can declare functions common to all the
    classes in this hierarchy. One such function might be inherited by everyone else
    and not be written when again.


    ```

    void Graphical Object::resize(int left, right,

    t top, int bottom)

    {

    nx1 = left;

    x2 = right;

    y1 = top;

    y2 = bottom;

    redraw();

    }

    ```


    But there is a catch here: Each subclass will likely need to implement a different
    version of the redraw function, because each type of graphical object needs to
    display different items on the screen.


    Each of the subclasses override the definition of redraw in Graphical Object by
    supplying its own implementation, which would seem to solve the problem.


    But in that case, which version of redraw gets called? What ensures the correct
    version of redraw is called for any given object?


    That''s a very big issue in object orientation: The answer involves the virtual
    keyword and polymorphism, and we''ll take that matter at the beginning of the
    next (and final) chapter.


    For now, I will end this by showing skeleton code for this hierarchy—which doesn''t
    provide implementations but shows the relationships between classes.


    ```

    class Graphical_Object {


    // Root class. Put most common functions here.

