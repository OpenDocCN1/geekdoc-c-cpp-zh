  md: 'When used within **main**, the **return** statement returns control to the
    operating system. In such a case, the return value may be a success or failure
    code (0 usually associated with no errors, or success).


    ```

    return EXIT_SUCCESS;

    ```


    # The throw Statement


    The **throw** statement raises an exception, which must then handled by the nearest
    catch block; otherwise, the program terminates abruptly. See [Chapter 9 for more
    information on throw and catch.


    ```

    throw exception_object;

    ```


    The *exception_object* may have any type; **catch** statements handle an object
    of that type. The matching catch block will have either the same type or a base-class
    type (that is, it must be an ancestor class of the type thrown).


    # Variable Declarations


    A data declaration is a statement that creates one or more variables of a particular
    type. If the type is a class, the variables are objects. In the syntax, **var_dec**
    is one or more variable declarations, separated by commas if there is more than
    one:


    ```

    modifiers type var_dec;

    ```


    Each **var_dec** is a variable declaration with an optional initialization. For
    the meaning of the optional *modifiers*, see the end of this section.


    Either of these is valid:


    ```

    var_name

    var_name = init_expression

    ```


    The **init_expression** is any valid expression of the corresponding type or an
    expression that can be converted to the type. If the variable is array, **init_expression**
    may also be an aggregate:


    ```

    { init_expression, init_expression... }

    ```


    For example, the following statements declare three variables of **int**; two
    of them are initialized:


    ```

    int i = 0, j = 1, k;

    ```


    And this example declares a two-dimensional array and initializes it:


    ```

    double[2][2] = {{ (1.5, 3.9), (23.0, -8.1) };

    ```


    If the variable declared is an object (has class type), it can be initialized
    through "function-style" syntax, which passes arguments to the appropriate constructor.


    ```

    Fraction fraction1(1, 2);

    ```


    The C++03 specification allows you to use aggregate-style initialization with
    objects:


    ```

    Fraction fraction1{1, 2};

    Fraction fraction2{0, 10};

    ```


    In a variable declaration, the name can be qualified with operators, [], (), and
    &; these create arrays, pointers, pointers to functions, and references respectively.
    To determine what kind of item has been declared, ask yourself what the item would
    necessarily represent in executable code. For example, the variable declaration


    ```

    int **ptr;

    ```


    means that "ptr", when it is used in executable code, its type is int; ptr is
    a pointer to an integer, which would have to be dereferenced twice to produce
    an integer. Likewise, the following declaration creates a pointer to a function—and
    that function must take a single double argument and return a double value.


    ```

    double (*fPointer)(double);

    ```'
