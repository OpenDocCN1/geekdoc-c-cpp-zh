  md: "```\nreturn;\n\nint Fraction::gcf(int a, int b) {\n  return 0;\n}\n\nint Fraction::lcm(int\
    \ a, int b) {\n  return 0;\n}\n```\n\nIf the action functions to only a few actions,\
    \ you improve efficiency by writing it as an inline function. A true function\
    \ involves overhead, and when the function acts to less than this overhead, it\
    \ ought to be inlined.\n\nBut functions that have more than a few simple statements\
    \ should not be inlined. If such an inline function is called often, the program\
    \ ends up taking more space than it needs. Inline functions also have additional\
    \ restrictions. They cannot call themselves recursively, for example.\n\nThe three\
    \ support functions—normalize, gcf, and lcm—are going to get longer, so we won't\
    \ make them inline.\n\n# Find the Greatest Common Factor\n\nThe actions inside\
    \ the Fraction class rest on two concepts in number theory: greatest common factor\
    \ and lowest common multiple. Fortunerately, in Chapter 4 we used an ingenious\
    \ linear recursive algorithm, thanks to the ancient Greek scientist Euclid and\
    \ that it worked beautifully.\n\nRemember, the greatest common is the largest\
    \ number that evenly divides two other numbers. For example:\n\n| NUMBERS | GREATEST\
    \ COMMON FACTOR |\n| --- | --- |\n| 12,18 | 6 |\n| 12,10 | 2 |\n| 25,50 | 25 |\n\
    | 30,25 | 5 |\n\nHere is Euclid's algorithm from Chapter 4, written as a C++ function:\n\
    \n```\nint gcf(int a, int b) {\n  if (b == 0)\n    return a;\n  else\n    return\
    \ gcf(b, a%b);\n}\n```\n\nNow, to relive this as a member function, we just add\
    \ the Fraction:: prefix to it Fraction-class scope:\n\n```\nint Fraction::gcf(int\
    \ a, int b) {\n  if (b == 0)\n    return a;\n  else\n    return gcf(b, a%b);\n\
    }\n```\n\nWe're almost done. But there is one concern that things happen if negative\
    \ numbers are passed to the GCF function: it still produces-(35,-25) produces\
    \ -5—the negative sign being incorrect. To prevent this problem, we use the **abs**\
    \ (absolute value) function to ensure only positive values are returned. (This\
