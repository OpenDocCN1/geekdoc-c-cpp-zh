  md: "<< \"New value of n \" << r3; // Print n.\n\nNow, changes to any reference\
    \ variable, r1, r2, and r3—all cause changes to n.\n\nUnlike pointers, a reference\
    \ variable can be set to reference something else—during initialization. At no\
    \ time can you ever make it reference again. (Unless it goes out of scope, and\
    \ comes in, a different variable)\n\n```\nint &r = // For the rest of time, r\
    \ refers to n.\n```\n\nBut reference arguments are used like this in C++. Much\
    \ more useful reference arguments. Remember from Chapter 6 which required pointers?\
    \ You can create the same behavior using reference arguments.\n\n```\nvoid swap_ref(int\
    \ &a, int &b) {\n    int temp = a;\n    a = b;\n    b = temp;\n}\n```\n\nThis\
    \ example may help what violated violated I said in Chapter 6—about how using\
    \ references pointers—but actually does, because reference arguments behave very\
    \ much like pointers. (In fact, the compiler almost certainly implements references\
    \ by using pointers under the cover.)\n\nRemember that in this example, the swap\
    \ function does not get copies of a and b references to them. This enables swap\
    \ to make changes to the objects.\n\n```\nint big = 100;\nint little = 1;\nswap_ref(big,\
    \ little); // swap big and little\n```\n\nWhen the compiler implements this, it\
    \ copies addresses under the cover. But that fact is hidden. It looks like you're\
    \ passing ordinary integers. The pointer version, in, requires you to explicitly\
    \ pass addresses:\n\n```\nint big = 100;\nint little = 1;\nswap_ptr(&big, &little);\
    \ // swap big and little\n```\n\n# The Copy Constructor\n\nEarlier I introduced\
    \ a special constructor: the default constructor. Another special constructor\
    \ is the copy constructor.\n\nThe copy constructor is special for two reasons:\
    \ first, this constructor gets called in a common situations, whether you're aware\
    \ of its existence or not.\n\nSecond, if you don't write one, the compiler automatically\
    \ supplies one for you. The compiler is somewhat more forgiving than it is the\
    \ default constructor. It doesn't wreck the automatic copy constructor just because\
    \ you decided to write constructors of your own. There will always be a copy constructor,\
    \ whether you or not.\n\nThe copy constructor is automatically called in these\
    \ circumstances:\n\n+   - When the return value of a function has class type.(We've\
    \ already seen this in the case of the add and mult functions from Chapter 11.\
    \ The function creates a copy of the object and hands this back to the caller.\n\
    - When an argument has class type. Copy of the argument is made and then passed\
    \ to the function.\n- When you use one to initialize another. For example:\n\n\
    ```\nFraction(a, 2);\nFraction(b);\n```\n\nThe copy constructor is not called\
    \ when a pointer to an object is passed. That's why it's called the copy constructor.\
    \ It's called only when a new copy of an existing object needs to be made.\n\n\
    The syntax for the copy constructor declaration is as follows:\n\n![](img/a7964e9035b7ca0710b559c70a60c09a_211_0.png)"
