- img_proc: true
  md: 'The general rule is that any signed quantity with 1 in its leftmost bit is
    interpreted as a negative number.


    Incidentally, taking the two''s complement of 0 produces 0 itself. This is mathematically
    correct, because multiplying 0 by -1 should produce 0.


    ```

    0000 0000 // Start with 0

    1111 1111 // Reverse bit (one''s complement)

    +      1 // Now add 1 to get two''s complement

    ============

    0000 0000 // "Flips over," producing 0 again!

    ```


    The advantage of using two''s complement format for representing signed numbers
    is that so many mathematical operations work smoothly without it needing to check
    a sign bit. With a few exceptions, the same machine instructions that work on
    unsigned integers work correctly, without change, on signed integers. For example,
    if you add any number to its negative, you end up with zero, exactly as expected.


    ```

    0000 0001 1

    1111 1111 Add -1

    ============

    0000 0000 Result "flips over," producing 0.

    ```'
