  md: '**Introduction to Standard Template Library (STL):** Although I lacked the
    space to do a complete STL manual, this edition (first) introduces you to these
    exciting features of C++, showing how it can save you time and energy and enable
    you to perform powerful applications in a remarkably small space.


    **Expanded reference:** The appendices in the book are intended to be a min desk
    reference to use in writing C++ programs. This edition has significantly expanded
    these appendices.


    **Essays, or “Interludes” for the philosophically inclined:** Throughout the book,
    I detour into areas related to C++ but that impact the larger world, such as computer
    science, history of programming, mathematics, philosophy, and artificial intelligence.
    These essays are set aside so as not to interfere with the flow of the subject.
    You can read them at your leisure leisure.


    # ## Where Do I Begin?”


    As mentioned, this book assumes nothing about programming. If you can turn on
    a computer and use usually a menu system, keyboard, and mouse, you can begin on
    page 1. If you already have some familiarity with programming, you will go through
    the first two chapters quickly.


    If you are not know about C or C++ and are mainly interested in the new features
    of C++xx, you may want to go straight to Chapter 10, “New Features of C++.


    And if you know C and are starting to learn about object orientation with the
    C++ language, you may want to start with Chapter 11, “Introducing Classes: The
    Fraction Class.”


    # ## Icons, Icons, Who’s the Icons?


    Building on the helpful icons used in the first edition, this edition provides
    even more—as signposts on the pages to help you find what you need. Be sure to
    use for these symbols.


    ![](img/a7964e9035b7ca0710b559c70a60c09a_21_0.png)


    These sections take apart examples and explain, line by line, how and why the
    examples work. You don’t have to wade through long programming examples. I do
    that for you! (Or rather, we go through the examples together.)


    ![](img/a7964e9035b7ca0710b559c70a60c09a_21_1.png)


    After each full programming example, I provide at least one exercise, and usually
    several, that do base on the example in some way. These encourage you to learn
    and extend the programming code you’ve just seen. This is the best way to learn.
    The answers can be found on the book’s Web site (www.informat.com/title/9780132673266).


    ![](img/a7964e9035b7ca0710b559c70a60c09a_21_2.png)


    These sections develop an example by showing how it can be improved, made shorter,
    or made more efficient.


    ![](img/a7964e9035b7ca0710b559c70a60c09a_21_3.png)


    As “Optimizing,” these sections take the example in new directions, helping you
    learn by showing how the example can be varied or modified to do other things.


    ![](img/a7964e9035b7ca0710b559c70a60c09a_21_4.png)


    This icon indicates a place where a keyword of the language is introduced and
    its usage clearly defined.'
