  md: 'Many years ago, when I had to learn C become making a living as a programmer
    (this was before C++), I would have given half my salary to find a mentor, a person
    would say, "Here are the potholes in the road...errors that you are sure to make
    in learning C. And here is how to steer around them." Instead, I had to sweat
    and through every error a person could make.


    I''m not just talking about programmers who can write or writers who can program.
    Each of those is enough. Much rarer is still the person who is programmer, writer,
    and teacher—someone who will steer you around elementary gotchas and enthusiastically
    communicate the "whys" of the language, why this is not just useful, but in its
    own way, kind of cool.


    It''s hard to find such a person. But back when, I swore this is the person I''ve
    become.


    Later, at Microsoft, I was in tech support and working my way into management.
    My most important job (I felt) was explaining new technology. I was the second
    or third person in the world to see a new feature of a programming language, and
    my job was to turn a cryptic spec into readable prose for the rest of the universe
    to understand. I took the goal of "make this simple as not just a job but a mission.


    # About This Book: How''s Different


    What''s different about this book is that I''m an advocate for the reader. I''m
    on your side, and not of some committee. I am aware of all the ways you are "supposed"
    to program and how they are supposed to be better (and do discuss those, but I''m
    mostly concerned about telling you what works.


    This book assumes you know nothing about programming—that you basically know how
    to turn on a computer and a mouse. For those of you more knowledgeable, you''ll
    want to browse through the first few chapters.


    The creators of C and C++—Dennis Ritchie and Brian Stroustrup—are geniuses, and
    I''m in awe of what they accomplished. Although both C and C++ are great languages,
    there are some features that beginners (and even advanced programmers) never find
    use, at least not for the first few years. I''m not afraid to tell you that information
    for: what language features you can and ignore. At the same time, I''m also eager
    to tell you the elementary features of C++ that can save you time and energy.


    This is a book about practical examples. It''s also about having fun! The great
    majority of examples in this book are either useful and practical—or by using
    puzzles and games—are intrinsically entertaining.


    So, have no fear I''ll not bore you with overly we (and highly abused) terms like
    data abstraction, which professors love but forever remain fuzzy to the rest of
    us. At the same time, there are some others—object orientation and polymorphism—that
    you will want know, and provide concrete, practical contexts for understanding
    and using them.


    # Onward to the Second Edition


    The first edition has sold incredibly well over the years. I believe that''s a
    testament to the variety of learning paths it fulfills: complete examples, exercises,
    and general use of conceptual art. The second edition builds on these strengths
    in many ways:


    +   **Coverage of new features in C++**: This is the specification for C++ that
    will be the standard by the time you have this book in your hands. Compiler either
    have their versions of C++ up to this standard or are in the process of doing
    so. This book covers over a dozen features from this specification in depth.


    +   **Examples galore, puzzling and games**: By the end of Chapter 2, you will
    have learned how to program, a fairly long path, that not only a complete game
    but has an optimal strategy for the computer. You will see just well you can!
    But this is only the beginning. This edition features puzzles and games, much
    more than the first edition.


    +   **Generous use of conceptual art**: The use of clarifying illustrations to
    address abstract points was one of the strengths of the first edition. This edition
    has substantially more of them.


    +   **Even more exercises**: We encourage the reader to learn in best—by taking
    an apart the works that you are analyzing, and figuring out how to modify it to
    do your own thing.


    +   **No-nonsense syntax diagrams**: Programming and playing games is fun, but
    sometimes you need straightforward information. The syntax diagrams in this book,
    accompanied by examples, clarify exactly how the language works, statement by
    statement and keyword by keyword.'
