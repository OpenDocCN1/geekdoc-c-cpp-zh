  md: "```\nvoid String::cpy(char *s) {\n  delete ptr;\n  int n = strlen(s);\n  ptr\
    \ = new char[n + 1];\n  strcpy(ptr,s);\n}\n```\n\nNow it's an easy matter to write\
    \ an assignment-function.\n\n```\nString String::operator=(const String &src)\
    \ {\n  cpy(src.ptr);\n  return *this;\n}\n```\n\nNotice that the function returns\
    \ a String object (a short type \"String&\"), rather than a String object itself.\
    \ This return type prevents an unnecessary use of the copy constructor. We don't\
    \ want to have extra, redundant copies proliferate in the computer.\n\nYou can\
    \ just as easily write an assignment-function that takes a char* argument. Although\
    \ adding this function to the class is not strictly necessary, it is very necessary\
    \ (because one of the constructors performs a conversion from the char* type),\
    \ it makes evaluation of some string expressions much more expressive.\n\n```\n\
    String String::operator=(char *s) {\n  cpy(s);\n  return *this;\n}\n```\n\nBoth\
    \ of these functions are short enough to be inlined.\n\n> Note If you compare\
    \ the definitions of the copy constructor and the assignment-function (which calls\
    \ the copy member function), you'll find they are similar. There is an important\
    \ difference: the cpy member function ensures that the current object has already\
    \ been created and initialized. It uses the delete operator to free the memory\
    \ currently pointed to by ptr. The copy constructor makes no such assumption,\
    \ since the object is new.\n\n# Writing a Concatenation Function\n\nThis String\
    \ class is getting to be a lot more useful. But we can make the String class even\
    \ better still. What you'd like to write statements like this:\n\n```\nString\
    \ a(\"the \");\nString b(\"end.\");\nString c = \"This is \" + b + c;\n```\n\n\
    What you have to do, is implement an operator+ function for the String class.\
    \ Just to make writing a cat (short) let's start by writing a cat for \"concatenation\"\
    \ function. Writing the operator+ function will be a breeze.\n\nThe basic problem\
    \ to solve here—is just how most String functions—is how much space to allocate.\
    \ It's not too difficult, because you all have to use the strlen library function\
    \ to determine lengths and then add them.\n\nThe algorithm for the \"cat\" function\
    \ is as follows:\n\n+   1. Set N to length of the current string plus the length\
    \ of the string data to be added.\n2. Allocate a new char memory block of size\
    \ N, and set a pointer P1 to this block.\n3. Copy current string data to this\
    \ memory (pointed to by P1) and concatenate the new string data onto the old.\n\
    4. Delete the old memory pointed to by the data member, ptr.\n5. Set ptr to the\
    \ address as P1.\n\nThis algorithm is designed so that the old memory block (pointed\
    \ to ptr) is not deleted until its data is copied to the block. That means you\
    \ can't use the delete operator right away, and you have to temporarily store\
    \ the address in another pointer—P1.\n\nHere is the C++ code that implements this:"
