  md: '# # B. Data Types


    The C++ specification is somewhat Unesco when it comes to ranges of types, certain
    ranges are (for all purposes) universal on computers with a 32-bit architecture.
    This includes all computers used today, both PCs and Macs. However, some of these
    are subject to change. When 64-bit architecture becomes standard, for example,
    you expect int to be identified with 64-bit integers.


    The int and double are the "natural" sizes for integer and floating-point numbers,
    respectively, for the computer''s architecture. This means that any integer used
    in an expression (such as char), it is automatically promoted to int which can
    be done so without loss of information. There is never any reason to use short
    or float when compact storage of or data stream requires it.


    Table B.1 lists data types and their ranges on 32-bit computers and is followed
    by sections describing other issues in data-type usage "billion" in the American
    sense: a thousand million (1,000,000,000).


