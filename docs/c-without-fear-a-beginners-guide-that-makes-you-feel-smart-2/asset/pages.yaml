  md: "The LCM is the lowest number that is a multiple of two inputs. This is the\
    \ inverse of the greatest common factor (GCF). The LCM of 200 and 300 is 600.\
    \ The greatest common factor, meanwhile, is 100.\n\nThe trick in finding the LCM\
    \ is to isolate the greatest common factor and multiply by this only once. In\
    \ multiplying A and B, you include the factor twice. The common factor must be\
    \ removed from A and from B. The formula is\n\n```\nn = GCF(a, b)\n\nLCM(A, B)\
    \ = n* (a / n) * (b / n)\n```\n\nwhich simplifies to the following:\n\n```\nLCM(A,\
    \ B) = a / n* b\n```\n\nThe LCM function is now easy to write:\n\n```\nint Fraction::lcm(int\
    \ a, int b) {\n    int n = gcf(a, b);\n    return a / n * b;\n}\n```\n\n# Example\
    \ 11.2. Fraction Support Functions\n\nNow that we know how to write the gcf and\
    \ lcm functions, it's easy to add code to the Fraction class. Here is a first\
    \ working version of the class. I have also added code for the normalize function,\
    \ which simplifies fractions after each operation.\n\nCode that is new or altered\
    \ from earlier versions is in bold.\n\n# Fract1.cpp\n\n```\n#include <cstdlib>\n\
    \nclass Fraction {\nprivate:\n    int num, den;      // Numerator and denominator.\n\
    public:\n    void set(int n, int d) {\n        num = n; den = d; normalize();\n\
    \    }\n    int get_num() { return num; }\n    int get_den() { return den; }\n\
    private:\n    void normalize() { // Convert to standard form.\n        int gcf\
    \ = gcf(num, den); // Greatest Common Factor.\n        int lcm = lcm(num, den);\
    \ // Lowest Common Denom.\n    }\n\n    // Normalize: put fraction into standard\
    \ form,\n    // for each mathematically different value.\n    //\n    // Handle\
    \ cases involving 0\n    if (den == 0 || num == 0) {\n        num = 0;\n     \
    \   den = 1;\n    }\n\n    // Put neg. sign in numerator only.\n\n    if (den\
    \ < 0) {\n        num *= -1;\n        den *= -1;\n    }\n\n    // Factor out GCF\
    \ from numerator and denominator.\n    int n = gcf(num, den);\n    num = num /\
    \ n;\n    den = den / n;\n```"
