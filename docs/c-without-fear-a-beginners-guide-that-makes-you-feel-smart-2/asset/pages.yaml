    OK, you say. So, this translation must be done when printing strings on the console.
    But is it necessary for text files as well?


    Yes. Data to a text file must have the same format as data sent to the console.
    This allows C++ to treat all streams of text (whether console or on disk) the
    same way.


    But with a binary file, no such translation should ever be performed. The value
    10 may occur in the middle of a numeric field, and it must not be interpreted
    as a newline. If you translated this value, you would likely create a great errors.


    There''s another difference—probably the most important—between text-mode and
    binary-mode operations. It concerns the choices you make as a programmer.


    +   * If a file is opened in text mode, you should use the same operations used
    for communicating with the console; these involve the stream operators (<<, >>)
    and the getline function.

    * a file is opened in binary mode, you should transfer data only by using the
    read and write member functions. These are direct read/write operations.


    In the next section, I discuss these two functions.


    # Interlude: Are "Binary Files" Really More Binary?


    The reason people use the term binary file is because with such file, if you write
    the byte value 255, you''re actually writing the binary value of 255 directly.


    ```

    11111111

    ```


    The use of term is in some ways misleading. If you write 255 as text, you''re
    still writing binary data—except that each of these binary values is an ASCII
    character code. Conceptually, programmers tend to think of this as "text" format
    as opposed to "binary," because a text editor displays it as text.


    Incidentally, here''s how 255 is actually written in text mode:


    ```

    00110010 00110101 00110011

    ```


    This sequence represents the numbers 50, 53, and 53, which in turn are ASCII codes
    for the numbers 2, 5, and 5. When this is sent to the console, you see the string
    of 255.


    But the important point here is: this mode is opposed to binary mode while working
    in text mode, you don''t care about the underlying binary representation. You
    all care about that the file is as a stream of text characters. So, although everything
    is binary, you just think of this mode as "text mode."


    Throughout this chapter, I adopt the term binary file to mean a file in which
    data isn''t interpreted as ASCII character codes. With a text file, everything
    is assumed to be readable as text, given the right text-file reader. Files in
    this is not true binary.


    # Introducing Binary Operations


    When working with binary files, you read and write data to the file rather than
    translating data into text representations. Suppose you have the following data
    declarations. These variables occupy 4, 8, and 16 bytes respectively.


    ```

    int n = 1;

    double x = 215.3;

    char *str[16] = "It''s C++"

    ```'
