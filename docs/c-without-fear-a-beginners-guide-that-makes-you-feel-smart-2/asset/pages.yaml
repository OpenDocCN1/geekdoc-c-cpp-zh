  md: "# Easy Programming with STL\n\nI couldn really introduce the Standard Template\
    \ Library (STL) without first introducing the core C++ language and the basics\
    \ of dealing with classes and pointers. But now that you've mastered these ideas,\
    \ you not only find the STL useful but may end up loving it. It makes some programming\
    \ tasks much easier.\n\nThese days, the great majority of C++ compilers in wide\
    \ use now provide full support for STL. (If you have one of the rare compilers\
    \ that doesn't, of course, you may want to skip this chapter.) If your compiler\
    \ is C++0x compliant, it should definitely support STL.\n\n# Introducing the List\
    \ Template\n\nSTL—again, that's the Standard Template Library—provides broad support\
    \ for new classes, mostly in the form of templates.\nA template is a generalized\
    \ class that can be used to create unlimited container types. The basic idea is\
    \ that using such an underlying type (int, string, and Fraction in the following\
    \ examples), STL builds a sophisticated container around it. Here is how you would\
    \ use the list template:\n\n```\nlist<int>         // List of integers\nlist<string>\
    \      // List of strings\nlist<Fraction>   bunchOfFract; // List of Fractions\n\
    ```\n\nAll these list created is similar to the one we developed in Chapter 15,\
    \ except that (as you'll see), the STL version is more powerful and versatile.\n\
    \nThere's no limit to how many kinds of linked lists you can create this way.\
    \ You can write your own class—although, as later described, your class may need\
    \ to support certain operator functions to work—plug and it into the list template.\
    \ STL does the rest of the work!\n\n> Note\nAll names are part of the std namespace,\
    \ which you must either use the characters std:: before and every std name as\
    \ \"stack\" or \"list\" or just keep using namespace std; in your programs, as\
    \ I have been suggesting in every example.\n\n# Interlude: Writing Templates in\
    \ C++\n\nwidth=\"0\">The earliest versions of C++ contained no support for writing\
    \ templates at all. But within a few years of C++'s first appearance, programmers\
    \ (especially professional programmers) were clamoring for template support.\n\
    \nThe technology is still one of the most advanced realizations of the philosophy\
    \ of reusable code, which says once a problem has been solved, it shouldn't have\
    \ to be solved again.\n\nTemplates take this idea to the level of general algorithms.\
    \ Once mechanism has been created to contain integers, for it should be possible\
    \ to reuse the same code with other data types: double, for example, or strings,\
    \ or objects of any class. It's as though someone took a set of classes and related\
    \ functions and then a global-search-replace operation, replacing all instances\
    \ of int with other type.\n\nC++ provides support for writing your own template\
    \ classes and template functions. For example, you can use the template keyword\
    \ to declare a generalized class called \"pair\":\n\n```\ntemplate class<T>\n\
    class pair {\npublic:\n  T first, last;\n};\n```\n\nGiven this declaration, you\
    \ can declare any number of \"pair\" container classes:\n\n```\npair<int> intPair;\n\
    pair<double> floatPair;\npair<string> full_name;\n```"
