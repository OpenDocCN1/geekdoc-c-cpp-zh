    # # The <stack> Template


    To enable use of list template, include <stack>.


    ```

    #include <stack>

    ```


    Stack class, which can be instantiated, with each declaration creating a stack
    that uses the indicated type.


    The stack template creates a single last-in-last-out(LIFO) mechanism supporting
    a few member functions. The template doesn''t provide begin and end functions
    for iteration, a stack class is not a container class; it cannot be used with
    range-supported for algorithms or C++Ox exceptions.


    Once you declare a stack class, you can push and pop members. Note that popping
    an STL stack actually requires two operations: top to get the top member of the
    stack and pop to remove it, remember to use "top" and "pop.",


    ```

    stack<string> beats;

    beats.push("John");

    beats.push("Mary");

    beats.push("George");

    beats.push("Ringo");

    cout << beats.top() << endl; // Print "Ringo"

    beats.pop();

    cout << beats.top() << endl; // Print "George"

    a_stack.pop()();

    ```


    ## Table H.3. Stack Template Member Functions

    | FUNCTION | DESCRIPTION |

    | push(val) | Pushes value (of stack''s underlying type) onto top of the stack.
    |

    | top() | Returns data (of stack''s underlying type) from top of stack—but it
    does not remove data; for that, use pop. |

    | pop() | Removes top item of stack; does not return data. |

    | size() | Returns the number of items currently stored in the stack. |

    | empty() | Returns true if stack is empty; * false otherwise. |'
