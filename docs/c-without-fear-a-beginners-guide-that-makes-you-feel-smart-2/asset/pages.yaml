    \ unless there is a good reason not to do so. If you look back at Example 2.3,\
    \ **main** and prime each declare their own version of i.\n\nIs there ever a good\
    \ reason not to make a local variable? Yes, although if you have a choice, it\
    \ is better to go local, because you want functions interfering with each other\
    \ as little as possible.\n\nYou can declare global—that is, nonlocal—by declaring\
    \ them outside of any function definition. It's usually best to put all global\
    \ variables near the beginning of the program, before the first function. A variable\
    \ is recognized only from the point it is declared, to the end of the file.\n\n\
    For example, you could declare a global variable named status:\n\n```\n#include\
