    # A Class \"Print\" Function\n\nIt's a real better to keep writing essentially\
    \ the same lines of code every time we want to print the contents of a fraction:\n\
    \n```\ncout << f3.get_num() << \"/\";\ncout << f3.get_den() << \".\" << endl;\"\
    \n```\n\nThe obvious way to handle this is to write a function. Since each class\
    \ has its own data format, each should ideally have its own \"print\" function.\
    \ You can name a member function \"print,\" because it is not a reserved word\
    \ in C++.\n\n```\nvoid Fraction::print() {\n    cout << num << \"/\";\n    cout\
    \ << den;\n}\n```\n\nBut as good as this solution is, it is far from the best.\
    \ A more object-oriented solution takes advantage of the fact that cout is an\
    \ object. The ideal \"print\" would interact with cout and all objects of the\
    \ same class.\n\nThis is what you ought to be able to do:\n\n```\ncout << fract;\n\
    ```\n\nThe way to support such is to write an operator<< that interacts with cout's\
    \ parent class, ostream. The function must be a global function, because the left\
    \ operand is an object of ostream, and we don't have access to updating or altering\
    \ ostream code.\n\nThe function should be declared as a friend of the Fraction\
    \ class so that it has access to private members.\n\n```\nclass Fraction {\n//..\n\
    public:\n    friend ostream &operator<<(ostream &os, Fraction &fr);\n};\n```\n\
    \nNotice that the function refers to an ostream object. This is necessary so that\
    \ statements such as the following work correctly:\n\n```\ncout << \"The fraction's\
    \ value is \" << fract << endl;\n```\n\nFinally, here is a working definition\
    \ for the operator<< function:\n\n```\nostream &operator<<(ostream &os, Fraction\
    \ &fr) {\n    os << fr.num << \"/\" << fr.den;\n    return os;\n}\n```\n\nThis\
    \ solution allows the Fraction to output to any ostream object specified. For\
    \ example, if it is a file-text object, you can use it to print to the file.\n\
    \n```\noutfile << fract;\ncout << \"The object \" << fract << endl;\ncout << \"\
    \ was printed to a file.\" << endl;\n```"
