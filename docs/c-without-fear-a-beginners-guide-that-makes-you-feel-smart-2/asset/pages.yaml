  md: '# # Introducing ClassesThe Fraction Class


    It''s time to turn towards a new world: the world of classes and objects. Up until
    now, you''ve read about features that are already in the old C language or represent
    slight refinements to that language.


    The major feature of C++ is that it adds this capacity—classes—to the C language.
    (There''s also another big feature called templates we''ll get in [Chapter 16].)
    And to understand what classes are, we''ll develop a class that''s particularly
    useful and not too difficult to write: the Fraction class.


    # ## Object Orientation: Quasi-Intelligent Data Types


    Before embarking on the journey of creating a Fraction class, let me say a few
    words as to why the journey is necessary. In other words, what objects and classes
    all about?


    In traditional programming, code and data are separate. Object-oriented programming
    (OOP) alters this relationship. It enables you to package code and data into something
    called a *class*. The important thing to know about classes is:


    > *A class creates a data type that has both (values) and behavior.


    Once a class is declared, you can use it to create individual data items: *objects*,
    each of which has its own values but the behavior programmed into the class. For
    example, you can write code like the following: The Fraction object knows how
    to respond to the operator (+) as well how to print them.


    ```

    Fraction a(1,2), b(1,3); // Declare objects.

    Fraction c = a + b;


    cout << "The total of 1/2 and 1/3 is " << c <<;

    ```


    OOP has a couple of immediate practical advantages: First, each class defines
    its own namespace. So, for example, every class has its own size function:


    ```

    aString.size()

    aList.size()

    aStack.size()

    ```


    This is however better than having string_size, list_size, stack_size, stack_size,
    and so on, to differentiate function names according to what kind of data they
    operate on.


    ```

    myFractionList.push_back(fr)

    ```


    instead of this:


    ```

    list_push_back<Fraction>(&myFractionListStruct, fr);

    ```


    The OOP version is more succinct, but it''s not just the grace in brevity that
    it''s significant. It is the gain in comprehensibility. The OOP version says I
    have an object, myFractionList, with a built-in ability, push_back. This is easier
    to read and understand.


    The most advanced feature of OOP involves polymorphism, which has important uses
    in graphical, event-based, and network programming. In simplest terms, it means
    the following:


    > *The knowledge of how to respond to a function is built into the object itself.


    Objects, then, are quasi-intelligent data items. They contain the "knowledge,"
    as it were, of how to respond to requests in form of function calls and operators.'
