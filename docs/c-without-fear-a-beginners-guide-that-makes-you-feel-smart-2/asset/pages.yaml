  md: '# I. Glossary of Terms


    This section provides an overview of terminology used in this book. For more detailed
    information on these topics, see the index.


    **abstract class**: a class that cannot be used to create objects but may still
    be useful as a general pattern (in other words, interface) for other classes.
    An abstract class has at least one pure function.


    **access level**: the level—private, protected, or public—that determines who
    or what can access members of a class. Public members are freely accessible outside
    the class (although references to them must be properly qualified). Private members
    are accessible within the class but not outside and protected members are accessible
    within the class and any derived classes.


    **address**: the numeric location of a piece of data or program code in memory.
    This location is often called a "physical location" in memory (allowing the computer
    to try to find this location is not to help). Addresses, when displayed, are usually
    in hexadecimal (base 16) and are not very meaningful in the context of a program.
    The CPU understands only numbers, not words: Numbers used by the CPU to access
    locations within main addresses.


    **ANSI**: American National Standards Institute. ANSI C++ is a recent specification
    of C++ that includes many features (such as the **bool** type and new-style casts)
    required for compilers to be up-to-date. However, it is superseded by the C++0,
    which is even newer.


    **application**: a functioning program, from the user''s point of view. Word processor
    is an application; so is a spreadsheet. The C++ compiler is a kind of application,
    although only to specialized audiences (programmers).


    **argument**: a value passed to a function; also known as a parameter.


    **array**: a data structure made up of multiple elements, which each element has
    the same base type. Individual elements are indexed by an number such as the array
    name. For example, an array declared as int arr[5] is an array of five integers,
    accessed as arr[0] through arr[4]. From 0 to n-1, where n is the size of the array.


    **ASCII**: a coding standard, which assigns each printable character (and nonprintable
    characters) a unique number in the 1-byte range (0 to 255). In C++, a character
    is stored as **char** (a 1-byte integer), and a string is stored in an array of
    **char**. Use of ASCII code is used to build low-level and know software, so when
    you have an H, for example, the ASCII code is put into the data stream and H is
    displayed on the screen. (These details are below the level of most programs,
    which you do not have to worry about all this).


    Some code is necessary for programs to handle text; at the machine level (the
    computer''s native language), only numbers are understood. There are other character
    coding systems (EBCDIC), while ASCII is universally adopted among personal computers
    and many-computer systems.


    **associativity**: the rule (either left-to-right or right-to-left) that determines
    how to evaluate two or more operators at the same level of precedence. For example,
    in "p++p", the operators associate left-to-right, so the expression is equal to
    "++p". (This means the pointer increments to the next element, rather than incrementing
    the element itself).


    **base class**: a class from which you derive another. All members of the base
    class are inherited by the derived class, except for constructors.


    **bit**: a single digit equal to 0 or 1, stored in the CPU or memory. Eight bits
    make up a byte. You get access to individual bits through bit-field and bitwise
    operations.


    **bool**: comment statement.


    **boolean**: true/false value or false value. In ANSI C++, the bool type is supported;
    if it''s not available, you can use the int to hold boolean values. C++ define
    true and false (also defined in ANSI C++) as 1 and 0, respectively. A boolean
    is expected, any converted to 1 and interpreted as integer


    **byte**: a group of bits stored together. Memory in a computer is stored in bytes,
    so each byte has a unique address.


    **C++**: the up-to-date specification of the C language that includes many features.
    Some of these features—such as user-defined literals, ranged-base, and ability
    to inherit base-class constructors—are features that programmers have requested
    for years. C++ is the version of the language that compiler vendors need to start
    implementing in order to be state-of-the-art... if they haven''t already done
    so.'
