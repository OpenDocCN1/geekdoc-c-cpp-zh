  md: "# C++0x\n\nIf you initialize individual data members as described earlier,\
    \ your objects will, of course, get those initial values...even if you rely on\
    \ the compiler-supplied default constructor, which is otherwise a no-op.\n\n#\
    \ Interlude: Is C++ Out to Try The Default Constructor?\n\nIt may seem that C++\
    \ operates this way: lulling you into a false sense of security by supplying a\
    \ default constructor (again, that's the constructor with no arguments) and then\
    \ yanking it away from you as soon as you write any other constructor.\n\nAdmittedly,\
    \ this is weird. It is one of the quirks that C++ has because it has to be an\
    \ object-oriented language and a language designed to be relatively backward compatible\
    \ with C. (Actually, it is not 100 percent backward compatible, but it is close.)\n\
    \nThe **struct** keyword, in particular, causes some issues. C++ treats **struct**\
    \ type as a class (as I've mentioned), but it also has to work so that code does,\
    \ as with the following, struct completes successfully in C++:\n\n```\nstruct\
    \ Point {\n  int x, y;\n}\n\nstruct Point a;\n  a.x = 1;\n```\n\nThe C has no\
    \ **public** or **private** keyword, so this code can compile only if **struct**\
    \ classes have public members by *default*. Another problem is that C++ has no\
    \ concept of a constructor; so if this code is to compile in C++, then the compiler\
    \ *must* supply a default constructor, enabling statements like this to:\n\n```\n\
    struct Point a;\n```\n\nBy the way, C++ supports this usage but also allows you\
    \ to drop *struct* in this context:\n\n```\nPoint a; // \"struct\" not necessary\n\
    ```\n\nSo for backward compatibility, C++ had to provide an automatic default\
    \ constructor. However, if you want any custom constructor at all, or if you are\
    \ writing original code in C++ and therefore, you can define all member functions\
    \ and constructors.\n\nIn that case, your excuse—that you don't know about constructors—is\
    \ gone, and C++ assumes you to write everything you need, including the default\
    \ constructor. C++ also gives you the choice of not writing a default constructor\
    \ in order to force the class to initialize objects explicitly. In some cases,\
    \ you might want that.\n\n# C++0x Only: Delegating Constructors\n\n# C++0x\n\n\
    This section applies only to compilers that are C++0x compliant.\n\nIf you've\
    \ written a constructor for a given class, it would be nice to be able to reuse\
    \ it in other constructors. C++0x lets you do this: Suppose you have this simple\
    \ declaration of the Point class:\n\n```\nclass Point {\nprivate:\n  int x, y;\n\
    public:\n  Point(int new_x, int new_y) (x = new_x; y = new_y);\n};\n```\n\nIt\
    \ would be nice to write a default constructor by using the existing constructor.\
    \ Here's how to do that with C++0x compilers:"
