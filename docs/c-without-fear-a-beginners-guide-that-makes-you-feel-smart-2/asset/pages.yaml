    # Some Nerdy Definitions—A Review


    I like to avoid jargon. But when you start learning programming, you enter into
    a world that requires new terminology. The following are some definitions you
    need to survive in this world.


    application


    Essentially the same thing as program but from a user''s point of view. An application
    is a program that uses to accomplish some task. A worker is an application; so
    an Internet browser or a database manager. Even a compiler (defined in a moment)
    is an application, but of a very special kind, it''s used by programmers. To put
    the matter simply, your program is written, built, and tested—is an application.


    code


    Another synonym for "program," but from the programmer''s point of view. The use
    of the code stems from machine code. Each machine instruction is encoded into
    a unique combination of 0s and 1s and therefore the computer is code for doing
    some action.


    Programmers have continued to talk "code" even when using languages such as C++,
    FORTRAN, or Visual Basic (The definition of source code). Also, the term code
    is used to differentiate between the passive information in a program (its data)
    and the part of the program that performs (its actions).


    compiler


    The language translator that takes C++ statements (that is, C++ source code) as
    input and outputs the program in machine-code form. This is necessary, because
    the computer itself—its central processing unit (CPU)—only understands machine
    code.


    data


    Information operated by a program. At its most basic level, this information consists
    of words and/or numbers.


    machine code


    The CPU''s native language, in which each computer instruction consists of a unique
    combination (or of 0s and 1s. It is still possible to program in machine code,
    but requires looking up each instruction, as well as having elaborate knowledge
    of the CPU''s architecture.


    Languages such as C++ provide a way to write programs that is closer to English
    but still logically precise enough to be translated into machine code.


