  md: "# do-while Statement\n\nThe **do-while** statement has the following syntax:\n\
    \n```\ndo\n  statement\nwhile (condition);\n```\n\nThe operation of the **do-while**\
    \ statement is the same as the **while** statement, except that with the **do-while**\
    \ statement, the enclosed is executed at least once, the condition is evaluated\
    \ afterwards.\n\n# The for Statement\n\nThe **for** statement provides a compact\
    \ way of using three expressions (abbreviated expr) to control execution of a\
    \ loop.\n\n```\nfor (init_expr; condition_expr; increment_expr)\n  statement\n\
    ```\n\nThis expression is essentially the same as in the following (except, as\
    \ noted later, with regard to the continue statement):\n\n```\ninit_expr;\nwhile\
    \ (condition_expr) {\n  statement\n  increment_expr;\n}\n```\n\nThe **init_expression**\
    \ can declare one or more variables; if so, the variables declared are local to\
    \ the **for** statement. For example, the following code prints the numbers from\
    \ 1 to 10:\n\n```\nfor (int i = 1; i <= 10; i++) {\n  cout << i << endl; // local\
    \ to this block.\n}\n```\n\nFor more information, see Chapter 3, which I have\
    \ devoted entirely to the **for** statement.\n\n# The switch-case Statement\n\n\
    The **switch-case** statement is an alternative to the use of repeated if-else.\
    \ It has this syntax:\n\n```\nswitch (target_expression) {\n  statements\n}\n\
    ```\n\nWithin the switch, you can place any number of statements labeled with\
    \ the case keyword. A case statement has this syntax:\n\n```\ncase constant: statement\n\
    ```\n\nIt follows from the recursive nature of the syntax that a single statement\
    \ may (optionally) have multiple labels. For example:\n\n```\ncase 'e':\ncase\
    \ 'i':\ncase 'o':\ncase 'u':\n  cout << \"is a vowel\";\n```\n\nYou can also include\
    \ an optional label.\n\n```\ndefault: statement\n```\n\nStatement labels need\
    \ to be unique within the scope of the **switch** statement. Control is transferred\
    \ to the case statement, if any, whose constant value matches the value of **target_expression**.\
    \ If none of those values matches but there is a default label, then control is\
    \ transferred there; control passes to the first statement after the end of switch."
