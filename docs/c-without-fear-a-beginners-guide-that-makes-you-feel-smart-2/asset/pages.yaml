  md: "# # 4. Functions: Many Are Called\n\nThe most fundamental building block in\
    \ the programming toolkit is the function—often known as procedure or subroutine\
    \ in other languages. A function is a group of related statements that accomplish\
    \ a specific task. Once you define a function, you can execute it whenever you\
    \ need to do.\n\nUnderstanding functions is a crucial step to programming in C++.\
    \ Without functions, it would be a practical impossibility to engage in serious\
    \ programming projects. Imagine how difficult it would be to write a word processor,\
    \ for example, without some means of dividing the labor. Functions makes this\
    \ possible.\n\n# ## The Concept of Function\n\nIf you've followed the book up\
    \ until this point, you've already seen of a function—the sqrt, which takes a\
    \ single number as input and returns a result.\n\n```\ndouble sqrt_of_n = sqrt(n);\n\
    ```\n\nThis is not far from the mathematical concept of function. A function takes\
    \ zero or more inputs—called arguments—and returns an output, called a return\
    \ value. Here's an example. This function takes two inputs and returns their average:\n\
    \n```\ncout << avg(1.0, 4.0);\n```\n\nOnce a function is defined, you can call\
    \ it any number of times. By calling a function, you transfer execution of the\
    \ program to the function-code, which runs until it finishes or encounters a return\
    \ statement; execution is then transferred back to the caller.\n\nThis may sound\
    \ like foreign language if you're not used to it. It's easy to see in a conceptual\
    \ diagram. In the following example, program 1 normally runs until it calls the\
    \ function avg, passing the arguments a and b as a result, the program transfers\
    \ execution to avg. The values of a and b are passed to x and y, respectively.\n\
    \n```\nvoid main() {\n    double a = 1.2;\n    double b = 2.7;\n    cout << \"\
    Avg is \" << avg(a,b);\n    cout << endl;\n    cout << endl;\n    system(\"PAUSE\"\
    );\n}\n\ndouble avg(double x, double y) {\n    double v = (x + y)/2;\n    return\
    \ v;\n}\n```\n\nThe function runs until it encounters return, or until point 3)\
    \ execution returns to the caller of the function, which in this case the value\
    \ was returned. Then, 4) execution resumes normally inside main, and the program\
    \ continues until it ends.\n\n```\nvoid main() {\n    double a = 1.2;\n    double\
    \ b = 2.7;\n    cout << \"Avg is \" << avg(a,b);\n    cout << endl;\n    cout\
    \ << endl;\n    system(\"PAUSE\");\n}\n\ndouble avg(double x, double y) {\n  \
    \  double v = (x + y)/2;\n    return v;\n}\n```\n\nNote that only main is guaranteed\
    \ to be executed. Other functions run only as called. But there are many ways\
    \ a function can be called. For example, main can call a function A, which in\
    \ turn calls B and C, which in turn calls D."
