    \ the values have been exchanged.\n\n```\ncout << \"The value of big is now \"\
    \ << big << endl;\ncout << \"The value of little is now \" << little << endl;\n\
    ```\n\nThe values at addresses p1 and p2 change, not p1 and p2 themselves. This\
    \ is why the indirection operator (\\*) is often called the at operator."
