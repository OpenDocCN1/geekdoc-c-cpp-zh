  md: "Unqualified data members x and y refer to values in the left operand (point2\
    \ in this case). The expressions pt.x and pt.y refer to the right operand (point3\
    \ in this case). If you subtract one point from another, you should get another\
    \ point. But C++ allows you to specify any value for the return-value type.\n\n\
    The operator function is declared with Point return type, which returns a Point\
    \ object. If you add two points together, or you subtract one point from another,\
    \ you should get another point. But C++ allows you to specify any value for the\
    \ return-value type.\n\nIf there is a Point(int,int) constructor, you can write\
    \ the operator more succinctly as follows:\n\n```\nPoint Point::operator+(Point\
    \ pt) {\n    return Point(x + pt.x, y + pt.y);\n}\n```\n\nThe argument list can\
    \ contain any type. Overloading is permitted: You can declare an operator function\
    \ that interacts with the int type, another that interacts with the float type,\
    \ and so on.\n\nIn the case of the Point class, it might make sense to permit\
    \ multiplication by an integer. The declaration of the corresponding operator\
    \ function (within the class) would look like this:\n\n```\nPoint operator*(int\
    \ n);\n```\n\nThe function definition might reasonably look like this:\n\n```\n\
    Point Point::operator*(int n) {\n    Point new_pt;\n    new_pt.x = x * n;\n  \
    \  new_pt.y = y * n;\n    return new_pt;\n}\n```\n\nAgain, the function returns\
    \ a Point object, although you could return anything you choose.\n\nAs a contrasting\
    \ example, you could create an operator function that calculates the distance\
    \ between two points and a floating-point (double) result. For example, I have\
    \ chosen the % operator, but you could choose any other binary operator defined\
    \ in C++. The important thing here is that you choose any return type that would\
    \ be appropriate for the operation you're performing.\n\n```\n#include <cmath>\n\
    double Point::operator%(Point pt) {\n    int d1 = pt.x - x;\n    int d2 = pt.y\
    \ - y;\n    return sqrt(d1 * d1 + d2 * d2);\n}\n```\n\nGiven this function, the\
    \ code below would correctly print out the distance between points (20,20) and\
    \ (24, 23) as 5.0:\n\n```\nPoint pt1(20, 20);\nPoint pt2(24, 23);\ncout << \"\
    Distance between points is: \" << pt1%pt2;\n```\n\n# Operator Functions as Global\
    \ Functions\n\nIn the previous section, I stated that you can declare operator\
    \ functions as global functions. There is a disadvantage to doing this way: You\
    \ no longer have all the relevant functions centered in the class declaration.\
    \ But in one case (which I will discuss in a moment) it out to be necessary to\
    \ use this approach.\n\nA global operator function is declared outside of any\
    \ class. The types in the argument list determine what kind of functions the operator\
    \ applies to. For example, the Point class addition-operator function can be rewritten\
    \ as a global function. Here's the declaration (prototype), which should appear\
    \ before the function is called:\n\nHere's the function definition:\n\n```\nPoint\
    \ operator+(Point pt1, Point pt2) {\n    Point new_pt;\n    new_pt.x = pt1.x +\
    \ pt2.x;\n    new_pt.y = pt1.y + pt2.y;\n}\n```"
