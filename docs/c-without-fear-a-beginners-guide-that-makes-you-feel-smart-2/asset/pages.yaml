    You can have multiple file-stream objects at the same time—one for each file you
    want to interact with.


    ```

    ofstream out_file_1("memo.txt");

    ofstream out_file_2("messages.txt");

    ```


    When reading or writing to a file, you should call the **close** function. This
    causes the program to give ownership of the file so that some other process can
    access it. C++ closes the file for you when the program exits successfully, but
    it''s a good idea to close files as soon as you no longer need them.


    ```

    out_file_1.close();

    out_file_2.close();

    ```


    # # How to Refer to Files


    In the previous section, I showed how you can create a file object by specifying
    the file''s name. If successful, this opens the file for output, giving you exclusive
    access.


    ```

    ofstream fout("output.txt");

    ```


    By default, the file is referred to in the current directory—the directory from
    which you run the program. (Or, to use Windows or Macintosh home, this is the
    current *folder*). But you can, if you want, specify a complete path name, optionally
    including a drive letter. This is all or more of the complete filename–specification.


    For example, you can open a file in the root directory of C: drive.


    ```

    ofstream fout("C:\output.txt");

    ```


    The string literal uses the C++ backslash notation. In the previous chapter, I
    explained that the backslash character has a special meaning in C++ programs:
    For example, \n represents a newline, and \t represents a tab. To represent the
    backslash itself, use two in a C++. So, C:\output.txt in a C++ program code names
    this file:


    ```

    c:output.txt

    ```


    When you enter c:\output.bt, C++ interprets it as a single backslash, just as
    it interprets \n to mean a newline.


    As another example, the following statement creates a file-stream object located
    in the c:\programs\text directory:


    ```

    ofstream fout("C:\programs\text\output.txt");

    ```


    This opens this file:


    ```

    c:\programs\output.txt

    ```


