  md: '# # Files: Electronic Storage


    Most practical applications (reservation systems, database systems, spreadsheets,
    and even games) store and retrieve persistent information. This is data that hangs
    around the program ends and even after the computer is turned off.


    Main memory (RAM) is not persistent. As soon as the computer is turned off, data
    in memory is lost forever. But even if memory were more permanent—even if it didn''t
    disappear when the computer shuts down—main memory is too precious a resource
    to be dedicated to long-term record storage.


    So you need a place to put data for later use, put it in a disk file.


    # ## Introducing File-Objects


    In using **cin** and **cout** (console input and output), you''ve already made
    use of objects. Now it''s time to introduce some new objects. C++ provides files
    that support the same set of function calls and operations **cin** and **cout**
    do.


    C++ programmers often talk about **streams**. A stream is something you can read
    or write data. The term evokes the image of flowing water in a river—flowing from
    some source (for example, the console) or toward some destination (for example,
    a file). Although data is not always as endless as a river, it''s a useful image.


    Writing to a file involves a few simple steps. The first step is to enable support
    for file-stream operations by an `#include <fstream>` directive. This implicitly
    implies in declarations for file-stream.


    ```

    #include <fstream>

    ```


    The second step is to create a file-stream object and associate it with a disk
    file. (If you chose the name fout, you could choose any name you want: MyOutputFile,
    RoundFile, Trash, or whatever). Also, if you specified a name output.


    ```

    ofstream fout("output.txt"); // Open file output

    ```


    The object is associated with the file output and has type **ofstream**. When
    you open a file, you can use any of the following types:


    +   - **ofstream**, for file-output streams

    - **fstream**, for a generic file stream (to which you have to specify input,
    output, or both when you open it—on that later)


    The third step is as follows: After the file is successfully created, you can
    write to it just as you would write to **cout**. This sends the data to the associated
    file—in case, output.txt.


    ```

    fout << "This is a line of text.";

    ```


    As a variation on an example from [Chapter 1](https://example.com/chapter1), you
    could use the following code to write to the file output.txt:


    ```

    #include <fstream>

    //...

    ofstream fout("output.txt"); // Open file output

    fout << "I am Blaxxon," << endl;

    fout << "the cosmic computer."";

    ```


    The fout object provides access to the disk file. In object-oriented terms, we
    can say that fout encapsulates the file, in terms of its ability to receive output.
    First, fout is declared, associating it with a particular disk file (output.txt
    in this example). Afterward, writing to fout results in sending data to this same
    file.'
