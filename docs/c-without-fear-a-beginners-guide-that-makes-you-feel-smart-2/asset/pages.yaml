  md: 'The algorithm assigns the old value of B to A and the value A*B to B. The new
    arguments are equal or less to the old. They get smaller until B equals 0.


    For example, if A = 300 and B = 500, the first recursive call switches their order.
    (This always happens if B is larger) From point onward, each gcf invokes smaller
    arguments until the terminal case is reached:


    | VALUE OF A | VALUE OF B | VALUE OF A&B (DIVIDE AND GET REMAINDER) |

    |---|---|---|

    | 300 | 500 | 300 |

    | 500 | 200 | 200 |

    | 200 | 100 | 100 |

    | 100 | 0 | 0 |

    | | | Terminal case answer is 100 |


    When B is 0, the gcf function returns A*B but instead produces an answer.


    If the initial value of A is larger than B, the algorithm produces an even sooner.
    For example, suppose A = 35 and B = 25.


    | VALUE OF A | VALUE OF B | VALUE OF A&B (DIVIDE AND GET REMAINDER) |

    |---|---|---|

    | 35 | 25 | 10 |

    | 25 | 10 | 5 |

    | 10 | 5 | 0 |

    | 5 | 0 | Terminal case answer is 5 |


    # Interlude: Who Was Euclid?


    Who was Euclid? Wasn''t he the Greek who wrote about geometry? (Something like
    “The shortest distance between two points is a straight line”)


    Indeed, Euclid''s Elements is one of the most famous books in Western civilization.
    For almost 2,500 years it was used as a standard textbook in schools. In his work
    he demonstrated the first time a tour de force of deductive logic, proving that
    all that was known about geometry. In fact, he invented the idea of proof which
    has profound impact on mathematicians and philosophers ever.


    It was Euclid (according to legend) set by King Ptolemy of Alexandria, “Sire,
    there is no road to geometry.” In other words, you gotta work for it.


    Although its focus is on geometry, Euclid''s book has results in number theory
    as well. The algorithm is the most famous of results. Euclid expressed the problem
    geometrically, finding the biggest length commensurable with two sides of a rectangle.
    He conceived the problem in terms of rectangles, but we can use any two integers.


