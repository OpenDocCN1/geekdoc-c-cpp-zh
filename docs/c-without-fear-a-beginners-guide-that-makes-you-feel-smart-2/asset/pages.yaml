    # Chapter 13 Summary


    Here are the main points of [Chapter 13](#) and @ any valid C++ operator.


    +   - An operator function for a class having the following declaration, in which
    @ stands for valid C++ operator.


    return_type operator@(argument_list)


    An operator function may be declared as a member function or a global function.
    If it is a member function, then for a (binary operator) there is one argument.
    For example, the operator+ argument for the Point class could have this declaration
    and definition:


    ```

