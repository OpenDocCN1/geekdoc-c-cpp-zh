  md: "When you use the **new** operator, the program makes a request to the operating\
    \ system, asking for memory. The system responds by checking available memory\
    \ and whether there is space available.\n\nWith modern computer platforms, large\
    \ amounts of memory are available. Unless you're making exceptionally large requests,\
    \ you can generally expect to get the memory you need. Still, it is possible that\
    \ the memory may not be available. Commercial (that is, widely sold) programs\
    \ need to plan for this possibility.\n\n> If the memory is not requested, the\
    \ **new** operator returns a null pointer. You can test for this possibility and\
    \ take the appropriate action.\n\n```\nint *p = new int[1000];\nif (p) {\n   \
    \ cout << \"Insufficient memory\";\n    exit(-1);\n}\n```\n\nAnother problem that\
    \ can occur is due to memory leaks. When you successfully request memory with\
    \ **new**, the system reserves the memory block until it is released with **delete**.\
    \ If you end the program without releasing all your dynamically allocated blocks,\
    \ the system loses some memory every time you run the program. Eventually, your\
    \ computer has a great deal less usable memory.\n\nThe computer isn't losing physical\
    \ memory, of course, and rebooting restores memory completely. But users have\
    \ to do that.\n programming systems—such as Java and Microsoft Visual Basic—have\
    \ a process called garbage collector, which runs in the background, finding and\
    \ deleting objects no longer needed. Old versions of C++ do not have such a feature,\
    \ but the new C++ specifications support \"smart pointers,\" introduced in [Chapter\
    \ 15](https://www.example.com/cpp/ch15_smart.html) which automate memory clean-up.\n\
    \n# Example 14.1. Dynamic Memory in Action\n\nThis example allocates an array\
    \ of any requested size. The array is then to hold values input by the user, print\
    \ them, and print out the average.\n\n# new1.cpp\n\n```\n#include <iostream>\n\
    using namespace std;\n\nint main() {\n    int sum = 0;\n    int n = 0;\n\n   \
    \ cout << \"Enter number of items: \";\n    cin >> n;\n\n    int *p = new int[n];\
    \ // Allocate n integers\n    for (int i = 0; i < n; i++) {\n        cout << \"\
    Enter item \" << i << \": \";\n        cin >> p[i];\n        sum += p[i];\\  \
    \  }\n}\n\ncout << \"Here are the items: \";\nfor (int i = 0; i < n; i++) {\n\
    \    cout << p[i] << \", \";\n}\ncout << endl;\ncout << \"The total is: \" <<\
    \ (double)sum / n;\ncout << endl;\n\ndelete [] p; // Release n integers.\n\nsystem(\"\
    PAUSE\");\n    return 0;\n}\n```"
