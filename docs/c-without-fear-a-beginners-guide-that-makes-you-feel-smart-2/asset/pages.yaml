  md: '# # F. Standard Library Functions


    The most commonly used functions fall into a few categories: string functions,
    data-conversion functions, single character functions, math functions, and randomization
    functions. This appendix provides an overview. Note that I do not cover I/O functions
    such as print or fprintf, because I use C++ stream classes.


    For more information on the stream objects cout, and the stream classes, see [Appendix
    G.](https://example.com)


    # ## String (C-String) Functions


    To use these functions, include the file <cstring>. The functions apply to traditional
    C* strings, not to the STL string class.


    In [Table F.1.](https://example.com), s0, s1, and s2 are null-terminated char*
    strings; or rather, each of these equates to one of these strings. n is an integer,
    and is is a character. Except where otherwise noted, each of these functions returns
    the address of its first argument.


    # ## Table F.1. Common String Functions


    | FUNCTION | ACTION |

    |---|---|

    | strcat(s1, s2) | Concatenates s2 onto the end of s1. |

    | strchr(s1, c) | Returns a pointer to the first occurrence of c in s1; returns
    NULL if cannot be found. |

    | strcmpmp(s1, s2) | Performs a comparison between s1 and s2, returning a negative
    integer, zero or a positive integer, depending on whether s1 appears before s2
    in alphabetical order, or which string is longer than the other. |

    | strcpy(s1, s2) | Copies s2 into s1, replacing existing characters. |

    | strncmp(s1, s2, n) | Searches for the first occurrence of any character in s2;
    returning the first of n matching characters or the length of n if none are found.
    |

    | strlen(s1) | Returns the length of s1 (excluding the null byte). |

    | strncat(s1, s2, n) | Same as strcat but copies at most n characters. |

    | strncmp(s1, s2, n) | Same as strcmp but compares at most n characters. |

    | strstr(s1, s2) | Searches for the first occurrence of s2 in s1; returning a
    pointer to first matching. |

    | strbrk(s1, c) | Returns a pointer to any character in s1; returns NULL if not
    found. |

    | strrchr(s1, c) | Same as strchr but searches s1 in reverse order. |

    | strcspn(s1, s2) | Searches for the first character that does not match any character
    in s2; returns index of this character or length of s1 if none found. |

    | strstr(s1, s2) | Searches for the first occurrence of substring s2; returning
    a pointer to substring within s1; returns NULL if not found. |

    | strtok(s1, s2) | Returns a pointer to the first character in s1, using delimiters
    specified in s2; Subsequent calls to this function with NULL first argument find
    the next tokens within the current string—the previously set value of s1; specifying
    a non-null value for s1 meets the tokenization process with a new string. |


    # ## Data-Conversion Functions


    To use the functions in [Table F. 2.](https://example.com), include <cdef>.


    # ## Table F.2. Data-Conversion Functions


    | FUNCTION | ACTION |

    |---|---|

    | atof(s) | Reads a char* string as a double. (The function skips leading spaces
    and stops after the first character that doesn''t form part of a floating-point
    representation (such as "1.5" or "-2.3")). | |

    | atoi(s) | Reads a char* string as a string and returns the equivalent int. The
    function skips leading spaces and stops after the first character that doesn''t
    form part of a valid integer representation (such as "-22"). |

    | at(s) | Reads a char* string and returns a long value; on 32-bit systems, this
    is equivalent to atoi. |

    | atoll(s) | Similar to atoi, but returns a long integer value. Required in the
    C++98 specification |'
