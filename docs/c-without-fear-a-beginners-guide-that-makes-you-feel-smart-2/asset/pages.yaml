    \ This type would be\n  flagged as an error\n  void set(int n, int d); // ERROR:\
    \ need override\n);\n```\n\nNotice that the override keyword comes after the function\
    \ name (normalize, in this case) but before the argument list.\n\n# \"Pure Virtual”\
