  md: "If you write no constructors at all, this approach provides an alternative\
    \ way to initialize objects to reasonable default values. Regardless of which\
    \ C++ you have, heed the heading in the next section\n\n# # The Default Constructor—and\
    \ a Warning\n\nEvery time you write a class, you should usually write a default\
    \ constructor—that's the constructor with no arguments—unless you want to strictly\
    \ require the user of the class to initialize as soon as he or she declares it.\
    \ This is because\n\n> > If you write no constructors, the compiler automatically\
    \ supplies a default constructor for you (which is a \"no-op\"). If you write\
    \ any constructors at all, the compiler does not supply a default constructor.\n\
    \nOK, that's an odd but critical point. Let me go over it again. Let's say you\
    \ define a class with no\n\n```\nclass Point {\nprivate:\n    int x, y;\npublic:\n\
    \    set(int new_x, int new_y);\n    int get_x();\n    int get_y();\n};\n```\n\
    \nBecause you wrote a class no constructors, the compiler obliges you by supplying\
    \ one: a default constructor. That's the constructor with no arguments. This constructor\
    \ is supplied for you, you can go ahead and use the class to declare objects.\
    \ (By the way, this constructor is a brain-dead no-op that performs initialization.)\n\
    \nPoint a, b, c;\n\nSo far, so good! If you write no constructors, one is supplied\
    \ for you the user of the class can declare objects. But look what happens as\
    \ soon as you define a constructor:\n\n```\nclass Point {\nprivate:\n    int x,\
    \ y;\npublic:\n    Point(int new_x, int new_y) set(new_x, new_y);\n    set(int\
    \ new_x, int new_y);\n    int get_x();\n    int get_y();\n};\n```\n\nGiven this\
    \ constructor, you can now declare objects this way:\n\nPoint a(1), b(2), c(-20);\n\
    \nBut now, you get an error if you try to declare objects with no arguments\n\n\
    ```\nPoint c; // ERROR! No default constructor\n```\n\nWhat happened? The problem\
    \ is the one I mentioned earlier. If you define any constructors at all, the compiler\
    \ does not supply a default constructor for you. The automatic default constructor,\
    \ which you had been relying upon, is rudely yanked away!\n\nWhen you start writing\
    \ classes, this behavior can take you by surprise. You use a class without writing\
    \ constructors, leaving users of the class declare objects this way:\n\nPoint\
    \ a, b, c;\n\nBut this innocent-looking code breaks as soon as you write a constructor\
    \ other than the default constructor.\n\nIn some cases, you might not want the\
    \ default constructor at all. You might want to force the class to initialize\
    \ objects. In that case, this behavior is fine.\n\nMore often, you probably want\
    \ the objects to default to some reasonable value, such as all-zero values for\
    \ data members. Another warning: the default constructor supplied by the compiler\
    \ does not do that for you It is a no-op. And objects, remember, like other data\
    \ items, if they are local and uninitialized, they are guaranteed to contain garbage."
