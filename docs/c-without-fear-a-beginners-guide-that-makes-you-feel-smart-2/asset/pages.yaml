    \ number n and finds the first prime number larger than n.\n\n# # Local and Global\
    \ Variables\n\nNearly every programming language has a concept of local variables.\
    \ As long as two functions mind their own data, they won't interfere with each\
    \ other.\n\nThat's definitely false in the previous example (Example 4.2) **main**\
