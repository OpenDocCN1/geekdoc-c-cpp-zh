    | long double | | At least as great as |


    Here are some notes on version support:


    +   - Some types are marked "ANSI." Almost all the oldest compilers now support
    ANSI-required types, unless your compiler is out of date, it should support them.

    - Some types are marked "C++0x." Others are C++0x compliant support, but some
    C++ vendors are supporting these even before the C++0x specification was proposed.


    # # Precision of Data Types


    All integers have absolute precision at all. That is one of their greatest advantages.
    For example, you can be close to the top of the long range, and adding 1 to the
    amount is accurately reflected in the new value, adding 1 to a very high float
    number might have no effect, with the added value of 1 lost of rounding.


    +   - The float type has 7 (decimal) digits of precision.

    - The double type has 15 (decimal) digits of precision.

    - Values in float format store the value 0.0 precisely. They can also store tiny
    values as close to zero as 1.175 x 10 to the -38.

    - Values in double format can store the value 0.0 precisely. They can also store
    tiny values as close to zero as 2.225074 x 10 to the -308th.


