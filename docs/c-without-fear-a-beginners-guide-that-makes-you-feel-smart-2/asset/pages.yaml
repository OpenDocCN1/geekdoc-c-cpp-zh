  md: "Since we've worked with the Fraction class, we'll create a format for Fraction\
    \ literals. It would be nice to write an expression like `1/` standing for \"\
    rational\", but that wouldn't work because the `/` is an operator; C++ would interpret\
    \ it as a separate number and integer division, rounding down. So we must pick\
    \ some other separator, such as the underscore `_`.\n\n```\n1_2r      // One half\n\
    2_3r      // Two thirds (2/3)\n13_50r    // 13/50\n```\n\n# Defining a Raw-String\
    \ Literal\n\nOne way to define a literal is to read the string data and process\
    \ that data directly. This approach uses the following syntax:\n\n```\ntype operator\
    \ \"suffix\" (const char *str)\n```\n\nIn this syntax, the type is of object you\
    \ want to produce: In our case, it will be Fraction. The `suffix` consists of\
    \ the operator and characters that indicate the format: When this `suffix` appears\
    \ at the end of a literal, it is finished. (Only suffixes are supported, not prefixes.)\n\
    \nWe can build on the code from [Chapter 12] to create a function defining literals\
    \ for the Fraction class, using the `_r` suffix. (Note that this function takes\
    \ advantage of a constructor to create a Fraction object on the \"fly\" and return\
    \ it).\n\n```\n#include <string>\n#include <cstring>\n...\nFraction operator \"\
    r\"const char *str {\nint n = 0;\nint d = 1;\nchar *p1 = strtok(str, \"_\");\n\
    char *p2 = strtok(nullptr, \"_\");\nif (p1)\n    n = atoi(p1);\nif (p2)\n    d\
    \ = atoi(p2);\nreturn Fraction(n,d);\n}\n```\n\nAgain, the underscore is used\
    \ as a separator here, because it does not conflict with any C++ operator.\n\n\
    Once this function is defined, you could write it like this:\n\n```\nFraction\
    \ a = 11_12r;    // Assign 11/12.\nFraction b = 1_2r + 1_3r;  // Assign 5/6.\n\
    ```\n\n# Defining a Cooked Literal\n\nUpon hearing about \"cooked literals\",\
    \ you might visualize Julia Child walking away in her kitchen, following a complex\
    \ recipe, burning the flamb, and dropping the souffle.\n\nBut don't worry. The\
    \ cooked-literal approach is easier to work with than raw-string literals. Cooked\
    \ literals use an existing data format, **int** or **double**.\n\nFor floating-point\
    \ data **operator (double) \"suffix\" (double data)**, the syntax is as follows:\n\
    \n```\ntype operator \"suffix\" (double data)\n```\n\nThe characters in the suffix\
    \ are the same as used to form a number in **double**; this number is then automatically\
    \ promoted as a numeric argument. For example, assume you've declared your Complex\
    \ number class:\n\n```\nclass Complex {\npublic:\n    double real;\n    double\
    \ imag;\n    Complex(double r)\n    {real = r; imag = 0; }\n    Complex(double\
    \ r, double i)\n    {real = r; imag = i; }\n}\n```"
