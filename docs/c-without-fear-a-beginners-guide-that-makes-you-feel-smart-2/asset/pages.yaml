    object that reconstructs its contents rather than simply copying a pointer value.
    In the case of the String class, this means giving the destination object its
    own copy of the string data.


    So the copy constructor must utilize the deep-copy technique. The code here makes
    use of the strlen library (which gets the length of a string, but not including
    its null terminator) and the strcpy function (which copies string data from one
