  md: '# # The if Directive


    The **if** is used to begin a conditional compilation block. It is mostly used
    in conjunction with the **defined** function. Although this implementation may
    specify, compilers may choose to refer to predefined constants such as `__win32_`
    or `__linux_` to indicate what operating system they are running on.


    ```

    # if defined(__win32_)

    char op_sys[]="Microsoft Windows";n#endif

    ```


    If the value **if** is true, the compiler reads and processes lines of code up
    until the next matching **elif**, **else**, or **endif**; otherwise, it ignores
    those lines.


    Another use for **#if** and **#endif** is to temporarily "comment out" large blocks
    of code. Notice that C-style comment symbols (/* and *) do not work properly—and
    if you do them—cause errors:


    ```

    /* (Begin a "commented-out" block...\nchar op_sys[]="Overco Operating System";

    */

    /* OOPS! This ends the first comment.\n*/ Syntax error!

    ```


    However, **#if#endif** can be paired as deeply as you like. Each **#if#endif**
    can be used to "comment out" lines of code that you do not want to compile at
    particular time. One commented-out block can be placed inside another.


    ```

    #if 1


    // Do some stuff.

    #if 1


    // Do some more stuff.

    #endif

    ...

    #endif

    ```


    # # The #ifdef Directive


    The **#ifdef** begins a conditional compilation block. Although closely related
    to the **#if** directive, it is a more succinct way of expressing what the **#if**
    directive usually does. The following syntax

    p height="7" width="00">


    ```

    #ifdef symbol_name

    ```


    is exactly equivalent to the following:


    ```

    #if defined(symbol_name)

    ```


    The first example in the previous section could be rewritten as follows:


    ```

    #ifdef __win32__

    char op_sys[]="Microsoft Windows";n#endif

    ```


    # # The #ifndef Directive


    This directive is similar to the **#ifdef** directive but reverses its logical
    meaning; it enables conditional compilation only if the specified symbol has not
    been defined.


    ```

    #ifndef symbol_name

    ```


    This directive is used to avoid conflicts that can occur when multiple header
    files are in use.'
