    # # Raw String Literals


    The string literals introduced in Chapter 7 create a C-string type of char*. (C++
    also supports a wchar_t type for wide-character strings used in international
    applications.)


    The standard convention for string literals supports special characters such as
    tab and newline, but it also forces certain characters—\ and "—to be "escaped"
    by the backslash. For example, to represent this string data in traditional C++


    > The "file" is c:\docs\a.txt.,


    ```

    char s[] = "\"file\" is c:\\docs\a.txt.";

    ```


    This has at the virtue of being unambiguous to the compiler. But the C++0x specification
    supports a new "raw string" notation, where everything between R" is considered
    literal and no characters need to be "escaped". Everything really is literally
    taken.


    ```

    char s[] = R"("\

    ```


    The R prefix signs a C++ raw-string literal. This is more readable, don''t you
    think? In general, the syntax is as follows:


    > R"(raw-string-text)",


    Instead of using \ and \" to escape the string


    ```

    char s[] = R"*("\

    ```


    The delimiter character—in this case, *—takes on special meaning only in the special
    contexts shown. Otherwise, it can be used literally within the string, as any
    character can.


    # # Chapter 10 Summary


    Here are the main points of Chapter 10:


    +   • C++0x adds support for the **long long int**, a 64-bit integer. There is
    also a corresponding **unsigned long long** type. For variables of other type,
    the **int** keyword is optional. In declaring


    ```

    long long x = 0;

    unsigned long long y = 0;

    ```


    +   • For numeric literals outside the range of long integers, C++0x provides
    new numeric literals: LL for **long long** and ULL for **unsigned long long


    ```

    long long x = 1230004560012LL;

    ```


    +   • The **atol** function takes a string input and returns a **long long** (64-bit)
    integer.'
