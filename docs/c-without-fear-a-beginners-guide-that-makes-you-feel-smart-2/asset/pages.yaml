  md: '# Chapter 18 Summary


    Here are the main points of [Chapter 18](:


    +   * Polymorphism means that the knowledge of how to perform a service is built
    into the object itself, not the client (that is, the software uses it). Consequently,
    the resolution of a single function call or operation can take unlimited forms.


    +   * Polymorphism is made possible by virtual functions.


    +   * The address of a virtual function is not resolved until runtime. (This is
    also called *late binding*.) The class of an object—as known at runtime—determines
    which implementation of a virtual function gets executed.


    +   * To make a virtual function, precede its declaration in the class with the
    **virtual** keyword. For example:


    ```

    protected:

    virtual void normalize();

    ```


    +   * Once a function is declared virtual, it is virtual in all subclasses. You
    don''t need to use the **virtual** keyword more than once per function.


    +   * You cannot make a constructor or an inline virtual function.


    +   * There is a small performance penalty and a small space penalty when a function
    is made virtual. However, these losses of efficiency are in terms of today''s
    powerful computers.


    +   * As a general rule, any member function that might be overridden should be
    declared virtual.


    +   * A [pure virtual function]() has no implementation (that is, no function
    definition) in the class in which it is declared. You declare a pure virtual function
    by using `=0`.


    ```

    virtual void print_me() = 0;

    ```


    +   * A class with at least one virtual function is an [abstract class](:. Such
    a class cannot be used to instantiate objects.


    ```

    Number a, b, c; // ERROR!

    ```


    +   * Abstract classes are useful as a means to create a general interface—a list
    of services that a subclass provides by implementing all the virtual functions.


    +   * In the final analysis, polymorphism is a way of liberating objects from
    slavish dependence on each other—because the knowledge of how to perform a service
    is built into each individual object. It'' ultimately this feature that gives
    object orientation its special favor and makes it [object]() oriented, not merely
    class oriented.'
