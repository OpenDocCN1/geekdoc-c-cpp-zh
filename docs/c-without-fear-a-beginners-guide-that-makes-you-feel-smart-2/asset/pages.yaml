  md: "Actually, it is possible to refer to an object whose type isn't defined. One\
    \ way to do that is to use a void pointer, which is a pointer to an object of\
    \ any type. If you use such a pointer, you will not be able to print the object.\n\
    \n```\nvoid *p = &object; // ERROR! *p cannot be printed\ncout << *p;\n```\n\n\
    Ideally, you should be able to do the following: you ought be able to see a dereferenced\
    \ pointer to an object (that is, an expression such as *p) and the object although\
    \ is printed in the correct format. Another way of saying this is, the knowledge\
    \ of how to print an object is built into the object itself.\n\nThis is important\
    \ in systems programming. You might give a pointer to your object over the interface.\
    \ You'd like to ensure that the function code gets called, even if the object\
    \ has a type that the client (the user of object) knows nothing about.\n\nIn short,\
    \ you'd like your programs to work seamlessly with new types that are defined\
    \ in the future.\n\nTo do this, we can declare an abstract class named Printable,\
    \ which declares a virtual function named print_me. In the next example, I will\
    \ show that any subclasses of Printable implements print_me can be called by cout\
    \ (any instance of an ostream—even if it is not known to the client—so that the\
    \ specific class of the object isn't even known by the main program.\n\nThe following\
    \ statement will work, though may not be known by the class of an object beyond\
    \ the fact it subclasses Printable.\n\n```\nPrintable *p = &object; // Object's\
    \ class must\n               // subclass Printable.\n\ncout << *p; // This will\
    \ be printed in the\n           // correct format,\n           // as defined by\n\
    \           // the class of an_object.\n```\n\nThere's an important rule that\
    \ can make this possible. An object of subclass can be passed where a base-class\
    \ object is expected. And a pointer to a subclass can be passed to a pointer of\
    \ base-class type. Or, to put it simply:\n\n> Something specific (a subclass)\
    \ can always be passed to something more general (a base class).\n\nThe converse\
    \ is not generally true (passing a base-class pointer to a subclass pointer) unless\
    \ there is a conversion function to support it.\n\n# Example 18.2. True Polymorphism:\
    \ The Printable Class\n\nThis next example demonstrates how to work with output\
    \ streams classes and objects (such as cout) that are truly polymorphic. By observing\
    \ a general interface—realized here by the abstract class Printable—you can correctly\
    \ print any kind of object, even if the type of object is not known at compile\
    \ time.\n\nThis approach is polymorphic (meaning \"many forms\") because a single\
    \ function can result in in unlimited number of implementations at runtime. The\
    \ number of possible implements is theoretically infinite.\n\nThat may seem impossible.\
    \ But I meant what I wrote. You can print an object without knowing its type or\
    \ its function code, because you (the client code) don't need to know how to print\
    \ the object. The knowledge of how to print is built into the object and its class.\n\
    \n# Printme.cpp\n\n```\n#include <iostream>\nusing namespace std;\n\nclass Printable\
    \ {\n    virtual void print_me(ostream &os) = 0;\n\n    friend ostream &operator<<(ostream\
    \ &os,\n                               Printable &p);\n\n};\n\n// Operator<< function:\n\
    // All this does is to call virtual function print_me\n```"
