    # source code


    A program written out in a high-level language such as C++. Source code needs
    to be translated into machine code before it can actually be run on a computer.
    Machine code is typically represented in hexadecimal (base 16), so it looks like
    this:


    ```

    08 A7 C3 9E 58 6C 77 90

    ```


    It''s not obvious what this does, is it? Unless you look all the instructions,
    such a program is incomprehensible—which is why no one writes it in machine code.
    In contrast, source code bears least some resemblance to English. The following
    C++ statement says, "if salary is less than 0, print error message":


    ```

    if (salary < 0)

    print_error_message();

    ```


    # statement


    A simple statement usually corresponds to one line of a C++ program, and it is
    terminated by a semicolon (just as an English statement is terminated by a period).
    But C++ supports compound statements, just as English, and these can take multiple
    lines. Most C++ statements perform an action, although perform many actions.


    # user


    The person who runs a program—that is, the person who uses the computer to do
    something useful, such as edit a text file, read email, explore the Internet,
    or balance a checkbook. The more official name for user is end user.


    When I was at Microsoft, the user who was have caused the most of the trouble
    in the world, but he or she was also the person who paid the bills. If this hypothetical
    person was a nontechnical "bozo", there would be no Microsoft without users buying
    their products. So when designing programs, it''s important that you consider
    the needs of the user.


    # What''s Difference About C++?


    Most of the things I''ve just said about C++ apply to other programming languages
    such as Pascal, Java, FORTRAN, and Basic. These are all high-level languages,
    meaning they do not correspond closely to machine code but use keywords (such
    as "if" and "while") that bear some resemblance to English.


    Each language was developed for a different purpose. Basic was designed to be
    easy to learn and to use. As a result, permitted loose syntax that unfortunately
    led to bad programming habits. Still, Microsoft Visual Basic became a powerful,
    quick-application tool for Microsoft Windows and cleaned up some of its sloppiness.


    Pascal was developed in academic environments, to teach sophisticated programming
    concepts. Pascal is more elaborate than Basic, but it cannot do everything that
    C or C++ can.


    The legendary scientist Dennis Ritchie originally designed C for help in writing
    operating systems. It''s a clean language that supports shortcuts and makes it
    possible to write more code. The straightforward but comprehensive syntax of C
    has proven popular throughout the world. Another advantage of C is that it imposes
    fewer restrictions than other languages.


    So what about C++?


    The major difference between C and C++ is that C++ has the ability to do object-oriented
    programming. This is an approach especially suited to working with complex systems,
    such as graphical user interfaces and network environments. As an object-oriented
    programmer, you would ask the following:


    +   1. What are the major kinds of data (that is, information) in the problem
    to be solved?

    2. What operations should be defined for each kind of data?

    3. How do the data objects interact with each other?


    In learning object-oriented programming, I''ve found it easier to do if you''ve
    mastered basic statement syntax first. Therefore, I don''t focus on'
