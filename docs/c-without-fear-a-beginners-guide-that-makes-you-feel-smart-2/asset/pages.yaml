    \ includes with `<iostream>).\n\nHere, the changes to the original version of\
    \ gcf are in bold:\n\n```\nint Fraction::gcf(int a, int b) {\n  if (b == 0)\n\
    \    return abs(a);\n  else\n    return gcf(b, a%b);\n}\n```\n\n# Find the Lowest\
    \ Common Denominator\n\nAnother support function that will come in handy is getting\
    \ the lowest common multiple (LCM). But with the gcf function at hand, this will\
    \ be an easy task."
