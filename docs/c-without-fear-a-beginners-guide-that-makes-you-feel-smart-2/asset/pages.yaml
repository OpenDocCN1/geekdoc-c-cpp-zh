    # Mystack Class Design


    To store the ring positions for the three stacks (pole positions), we need to
    create a data structure called a stack. Earlier, I discussed a special area of
    memory called "the stack", which stores arguments and local variables. But that''s
    not the stack I''m talking about here.


    This example calls for a special, customized stack class. Unlike most stacks,
    this class has to allow empty space at the top, the rings fall to the bottom.
    The first few places may contain 0. When the program displays a picture of the
    three stacks, you''ll see why this approach is necessary shown here.


    We need to design our own customized "stack" class—let''s call it "mystack"—from
    which three objects will be created. The class has the design shown here.


    ```

    rings[MAX_LEVELS]    // Data members

    tos (top of stack)

    populate(int size)

    clear(int size)

    push(int n)        // Function members

    pop()


    Mystack class

    ```


    The rings array contains most of the data of different sizes by using a series
    of integers, indicating the smallest ring and 0 indicating empty space. (So, 1,
    2, 3) indicates the three smallest rings, and ({0, 0, 2}) indicates the second
    smallest ring, with two empty spaces above it). The tos member signifies the top-of-the-stack
    position.


    The populate and clear functions perform initialization that''s useful if you
    want the program to be able to reset and start over.


    # Using the Mystack Class


    Once the Mystack class is declared, we use it by creating three of these customized
    stack objects and initializing them. The three objects are placed in an array.


    ```

    mystack stacks[3];

    ```


    At the beginning of each animation cycle, the following happens:


    +   * stacks[0].populate() is called to fill the first stack.'
