  md: '# Basics of Using Functions


    I recommend the following approach for creating and calling user-defined functions:


    +   1. At the beginning of your program, declare the function.

    2. Somewhere in your program, define the function.

    3. Other functions can call the function.


    # Step 1: Declare (Prototype) provides the Function


    A declaration (or prototype) provides type information. It has this syntax:


    ```

    return_type function_name (argument_list);

    ```


    The return_type is a data type indicating what kind of value the function returns
    (what it passes back). If the function does not return a value, use void.

    The argument_list is a list of zero or more argument names—separated by commas
    if there are more than one—each preceded by the corresponding type. (Technically,
    you don''t need the argument names in a prototype, but it is a good programming
    practice.) For example, the following statement declares a function named avg,
    which takes two arguments of type double and returns a double value.


    ```

    double avg(double x, double y);

    ```


    The argument_list may be empty, indicates that it takes no arguments.


    # Step 2: Define the Function


    The function defines what the function does. It uses this syntax:


    ```

    return_type function_name (argument_list) {

    stements}

    ```


    Most of this looks like a declaration. The only thing that''s different is the
    semicolon is replaced by zero or more statements between two braces ().The braces
    are required no matter how few statements you have. For example:


    ```

    double avg(double x, double y)

    return (x + y) / 2;

    ```


    The return statement executes immediate, and it specifies that the function returns
    the amount (x + y) /2 . With no return value can still use the return statement
    but only to exit early.


    ```

    return;

    ```


    # Step 3: Call the Function


    Once a function is declared and defined, it can be used—or rather, called—any
    number of times, from any function. For example:


    ```

    n = avg(9.5, 11.5);

    n = avg(5, 25);

    n = avg(27, 154.3);

    ```


    A function call is an expression. As it returns a value other than void, it can
    be used inside a larger expression. For example:


    ```

    z = x + y + avg(a, b) + 25.3;

    ```


    When the function is called, the values specified in the function are passed to
    function arguments. Here''s a call to the avg function works, with sample values
    9.5 and 11.5 as input. These are passed to the function, as arguments. When the
    function returns, the value in this case is assigned to z.'
