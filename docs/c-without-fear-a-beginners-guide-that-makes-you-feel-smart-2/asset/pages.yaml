    # The Scope (:: Operator


    This operator has several related uses. First, it can be used to refer to a symbol
    declared in a class or namespace.


    ```

    class::symbol_name

    namespace::symbol_name

    ```


    The scope operator can also be used to refer to a global—or rather, unqualified—name.
    This might be used, for example, to refer to a global symbol within a class''s
    member function when there is a name conflict.


    ```

    ::symbol_name

    ```


    # The sizeof Operator


    The sizeof operator returns the size of its operand in bytes:


    +   * sizeof is used on a pointer, it returns the width of the pointer itself
    (currently 4 bytes on 32-bit computers), not the base type of.


    ```

    double x = 0.0;

    double *p = x;

    cout << sizeof(p);    // Print 4.

    cout << sizeof(x);    // Print 8.

    ```


    +   * sizeof is used on an array, it returns the total size of all the elements
    of the array. For example, if sizeof(int) is 4, then the code returns 40:


    ```

    int arr[10];

    cout << sizeof(arr);    // Print 40.

    ```


    +   * sizeof can be used on a type name (including class names).


    ```

    cout << sizeof(char);    // Print 1.

    ```


    # Old and New Style Type Casts


    For backward compatibility, C++ supports the old-style C type cast:


    ```

    (type) expression

    ```


    The C++ standards have long planned to deprecate this usage. A deprecated usage
    is one that the programmer avoids using, generating a warning message. Because
    C++ is still used to compile large amounts of legacy code, the committee did not
    deprecate this type cast.


    The new-style casts are still preferred within the C++ community (see Table A.2).
    Admittedly, they are longer and more work to put into programs, but they have
    the advantage of being self-documenting. The habit of using these operators (and
    not the old-style C cast) reduces the possibility of using an improper cast.


