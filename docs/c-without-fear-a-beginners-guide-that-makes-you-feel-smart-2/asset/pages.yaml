    # Individual Characters vs. Strings


    C++ makes a distinction between individual characters and strings. A lot depends
    on whether you use single or double quotation marks.


    The expression ''A'' represents a single character. During compilation, C++ replaces
    this expression with the ASCII value for a letter ''A'', which happens to be 65
    decimal.


    On the other hand, the expression "A" represents a string of length 1. When C++
    sees this expression, it places two bytes in the data area:


    +   * The ASCII code for ''A''

    * A null-terminating byte.


    The C++ compiler then replaces the expression "A" with the address of this two-byte
    array. ''A'' and "A" are different because one is an integer value, whereas the
    other a string and is converted to an address.


    This may seem like a lot, but just remember to pay close attention to the quotation
    marks. The following code provides an example of how they can be used incorrectly:


    ```

    char s[] = "A";

    if (s[0] == ''A'')  cout << "The first letter of the string is ''A''.";

    ```


    This produces a correct result. But this comparison is an error, because it tries
    to compare a character to an address:


    ```

    if (s[0] == "A")  // WRONG!

    //...

    ```


    This fragment attempts to compare the element of the string s with an address
    expression, "A". The cardinal rules are as follows:


    > Expressions in single quotation marks (such as ''A'') are treated as numeric
    values after translation into ASCII codes. They are not arrays.'
