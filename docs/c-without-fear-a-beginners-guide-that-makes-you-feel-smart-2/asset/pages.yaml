  md: "# Interludo: Who was Fibonacci?\n\nFibonacci did not invent Fibonacci numbers;\
    \ we can thank him for computers. By decimal numbers to Europe, and if we didn't\
    \ understand the decimal system, without binary numbers, computers.\n\nThis great\
    \ visionary was a man named Leonardo Bonacci, whose name was \"son of Bonacci\"\
    \ or in Italian, \"Fibonacci.\" Born in 1170, he is considered the greatest mathematician\
    \ in the Middle Ages.\n\nHis most famous work, Liber Abaci (\"Book of Calculation\"\
    ), introduced Europe to the decimal-system devised by India and used by Arabic\
    \ numerals. It also introduced Europe a fascinating problem that Hindu mathematicians\
    \ had answered back in the thirteenth century. There were many series of numbers\
    \ they wondered, that described the growth of a population of rabbits in an ideal\
    \ environment, free of famine and predators. Their answer was a series of numbers:\
    \ 1, 1, 2, 3, 5, 8, 13, 21, and so on, dubbed \"Fibonacci numbers\" in West.\n\
    \nDid the ancient Hindus realize the secrets of Nature hidden in this deceptively\
    \ simple series? It turns the ratio of consecutive numbers converge towards a\
    \ mysterious transcendental number, approximately 1.618, which the Greeks called\
    \ the Golden Ratio. The Parthenon is designed on this ratio...and2000 years later,\
    \ Leonardo da Vinci's famous 1.618 \"Vitruvian Man\" would describe the human\
    \ body. How thoroughly the Golden Ratio matches the ratios of the human form:\
    \ the length of a leg to the torso, for example, and the ratio of the body.\n\n\
    When we see so much nature much this way, what does mean someone is trying to\
    \ use us? And we know for sure that there is no nature of existence that responds\
    \ to the beauty of mathematics.\n\n# Range-Based \"for\" (For Each)\n\nOne of\
    \ the most easy-to-use and programmer-friendly features of C++ is called range-based\
    \ for. In simple terms, this is a technique for writing clean code and getting\
    \ fewer errors—when you use for to loop through any array or container.\n\nSome\
    \ other languages had this feature for years. It says, \"Process every item in\
    \ the group (or list or STL string)\" without having to worry about where to begin\
    \ or end: C++ handles all the details of beginning and ending.\n\nThis approach\
    \ has two benefits:\n\n+   * It saves programming effort, it frees you from worrying\
    \ about how to initialize the beginning and ending conditions in a for loop.\n\
    \n+   * More importantly, you are free from one of the most sources of bugs in\
    \ C++ programs: incorrectly setting loop conditions. The most experienced programmers\
    \ commit this when tired, overworked, or stressed. But you can't go wrong when\
    \ the pointers are handled automatically.\n\nHere is the syntax. It comes in two\
    \ ways:\n\n![](img/a7964e9035b7ca0710b559c70a60c09a_172_0.png)\n\n```\nfor (base_type&\
    \ variable : container) // Reference\n    statement\n```\n\n```\nfor (base_type\
    \ variable : container) // By Value\nstatement\n```\n\nIn either case, statement\
    \ can, as well as compound statement: a series of zero or more statements enclosed\
    \ in braces ({}). The variable has scope limited to the statement, as may be the\
    \ case.\n\nIn the first version of this, variable is a reference type, which means\
    \ it has the ability to manipulate the data. No other special syntax is needed.\
    \ If you want to set values to items in container, use this version. The second\
    \ version of C++ provides access only to the values in container. Chapter 12 provides\
    \ more in-depth information on reference types.\n\nFor now, you might need to\
    \ use the ampersand (&) if you want to alter values inside the container (an array,\
    \ or container); otherwise, it's fine.\n\nLet's look at a practical example of\
    \ using an array. This code fragment sets every member of my_array to 0:\n\n```\n\
    int my_array[10];\n```"
