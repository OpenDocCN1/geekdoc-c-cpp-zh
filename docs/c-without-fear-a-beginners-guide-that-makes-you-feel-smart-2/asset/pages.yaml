    \ another. This kind of copying—requires the author of a class to write a copy\
    \ constructor and an assignment-operator function—is necessary for classes that\
    \ manipulate system resources, such as memory or file access.\n- The **this**\
    \ keyword is translated into a pointer to the current object (that is, the object\
