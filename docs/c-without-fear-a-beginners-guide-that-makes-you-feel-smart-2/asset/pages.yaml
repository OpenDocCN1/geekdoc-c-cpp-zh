    # What Is Not Covered?


    Relatively little, as it turns out. The features not covered at all are bit fields
    and unions. Although these features are useful for some people, their application
    tends to be highly specialized—limited to a few special situations—and not particularly
    useful to people first learning the language. Of course I encourage you to learn
    about them on your own later.


    Another area in which (if there other books) is the topic of writing your own
    template classes, which I touch on briefly in [Chapter 16](#). Without a doubt,
    to write template classes is one of the most amazing features of state-of-the-art
    C++, but it is a very advanced and complex topic. For me to cover it adequately
    and exhaustively would easily have taken 400 or 500 pages!


    Fortunately, although templates and the Standard Template Library (STL) are adjacent
    subjects, there are some good books on the subject—for example, C++ The Template
    Guide; by David Vandonde and Nicola Jositis; STL Tutorial and Reference Guide;
    C++ Programming with the Standard Template Library, Second Edition, by David R.
    Musser, Gilmer J. Dege, and Atul Saini; Effective STL: 50 Specific Ways to Improve
    Your Use of the Standard Template Library, by Scott Meyers.


    And remember that [Chapter 16](#) introduces you to use STL, which provides extremely
    useful, existing templates for you to take advantage of.


    # Getting Started with C++: A Free Compiler


    Although this edition doesn''t come a CD with a free compiler on it, that is no
    longer necessary. You can download some excellent share (that is, free) versions
    of C++ from the Internet that not only have a free compiler (that''s the application
    that translates your programs into machine-readable form) but also a very good
    development environment. And they install easily.


    To download this free software, start by going to the book''s Web site: [www.informit.com/title/9780132673266](http://www.informit.com/title/9780132673266).


    As mentioned earlier, you will also find downloadable copies of all the full program
    examples in the book, as well as answers to exercises.


    # A Final Note: Have Fun!


    Once again, there is nothing to fear about C++. Yes, there are those nasty potholes
    I started out-disting, but remember, I''m going to steer you around them. Admittedly,
    C++ is not a language for the weak of heart; it assumes you know exactly what
    you''re doing. But it doesn''t have to be intimidating. I hope you use the practical
    examples and find the puzzles entertaining. This is a book about learning and
    taking a road to new knowledge, but more than that, it''s a book about enjoying
    the ride.'
