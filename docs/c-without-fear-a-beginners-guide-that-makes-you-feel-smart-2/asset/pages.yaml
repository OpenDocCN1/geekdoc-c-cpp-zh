  md: 'A(B) is also the greatest common factor of the pair (A, B). This is true if
    we can show the following:


    +   - If a number is a common factor of A and B, it is also a factor of A,B.

    - If a number is a factor of B and A,B, it is also a factor of A.


    If these are true, then all the common factors of one pair are common factors
    of the other pair. In other words, the set of Common Factors (A, B) is identical
    to the set of common factors (B, A,B). Since the two sets are identical, they
    have the greatest—member they share the same common factor.


    Consider the remainder-division operator (%). It implies the following, where
    m is a whole number:


    ```

    A = mB + A%

    ```


    A% is equal or less than A, the general tendency of the algorithm is to progressively
    smaller numbers. Assume that n, who is a factor of A and B (meaning it divides
    both evenly), in that case:


    ```

    A = cn

    d = dn

    ```


    where c and d are whole numbers. Therefore:


    ```

    cn = (dn) + AB

    A% = cn - mdn = n(c - md)

    ```


    This demonstrates that if n is a factor of A and B, it is also a factor of A%B.
    By similar reasoning, we can show that if n is a factor of both B and A%B, it
    is also a factor of A.


    Because the common factors for the pair (A, B) are identical to the common factors
    for the pair (B, A%B), it follows that they share the greatest common. Therefore,
    GCF(A, B) equals GCF(B, A%B). QED.


    # Example 4.5. Beautiful Recursion: Tower of Hanoi


    Strictly speaking, the earlier examples do not require recursion. With some effort,
    they can be revised as iterative (loop-based) functions. There is a problem that
    illustrates recursion beautifully, solving a problem that would be very difficult
    to solve otherwise.


    This is the Tower of Hanoi puzzle: You three stacks of rings. Each ring is smaller
    than the one it sits on. The challenge is to move all the rings from the first
    stack to the third, subject to these constraints:


    +   - You can move only one ring at a time

    - You can place a ring only on of a larger ring, never a smaller.


    It sounds easy, until you try it! Consider a stack four rings: High by moving
    the top ring from the first stack, but do you move it, and what do you do after?


    To solve the problem, we already know how to move a group of N-1 rings. To move
    N rings from a source to a destination stack, do the following:


    +   - Move N-1 rings from the source stack to the (currently) unused, or "other,"
    stack.

    - Move a single ring from the "other" stack to the destination stack.

    - Move N-1 rings from the "other" stack to the destination stack.


    This is easier to envision graphically. The algorithm moves N-1 rings from the
    source stack to the "other" stack ("other") being the stack that is neither source
    nor destination for the current move). In this case, N is 4 and N-1 is 3, but
    these will be numbers.


    +   - Move N-1 rings from source to "others"


    ![](img/a7964e9035b7ca0710b559c70a60c09a_86_0.png)


    After this recursive move, at least one ring is at the top of the source stack.
    This top ring is then moved: This is a simple action, moving one from source to
    destination.'
