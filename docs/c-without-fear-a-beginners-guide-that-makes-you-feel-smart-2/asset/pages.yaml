  md: "# Interlude: OOP...ls It Worth It?\n\nObject orientation goes as far back as\
    \ the 1960s with the Simula language, along with others making programming more\
    \ data-centric. It got a boost in the 1970s when the Xerox PARC group (the people\
    \ who developed graphical user interface) invented Smaltalk, a language built\
    \ on the idea of independent objects sending messages to each other. By the 1980s,\
    \ the concepts began to be widely accepted.\n\nIn the early 1990s OOP became the\
    \ standard it is today. Bjarne Stroustrup mapped OOP to the popular culture, creating\
    \ C++. Pascal and Basic also got object-oriented extensions. Thereafter, new languages\
    \ followed such as C# and Java. You can't get away from it.\n\nBut does OOP help\
    \ you program more efficiently? There has been some backlash against the great\
    \ push for everyone to become object-oriented. Detractors argue that you end up\
    \ writing the same amount of code and data anyway.\n\nA couple of points are undeniable:\n\
    \n+   - Graphical-user interface (GUI) systems have come to dominate the world.\
    \ Although you don't have to use an OOP language to write for systems, they are\
    \ well matched. Conceptually, they are highly compatible, both developed at PARC.\n\
    - More, code and data are packed into OOP form. If you want to take advantage\
    \ of libraries like Microsoft Foundation Classes (for Windows) or the C++ Standard\
    \ Template Library (STL), you have no choice but to master the basics of object-oriented\
    \ syntax.\n\nClearly, then OOP is here to stay. And when you use the Structured\
    \ Template Library, you'll reap benefits.\n\n![](img/a7964e9035b7ca0710b559c70a60c09a_185_0.png)\n\
    \n# Point: A Simple Class\n\nHere is the general syntax of the C++ class keyword:\n\
    \n```\nclass class_name {\n    declarations\n};\n```\n\nExcept when you write\
    \ a subclass (also called a derived class), the syntax is no more complicated\
    \ than this. The declarations can include data, functions, or here's a simple\
    \ example that involves only data declarations:\n\n```\nclass Point {\n    int\
    \ x, y; // private -- may not be accessed\n};\n```\n\nBut members are private,\
    \ which means they cannot be accessed. This first attempt at declaring a Point\
    \ class is not useful. To be of any use, the class needs to have at least one\
    \ public member.\n\n```\nclass Point {\npublic:\n    int x, y;\n};\n```\n\nThis\
    \ is better. Now the class can actually be used. Given a class declaration for\
    \ Point, you can declare individual Point objects, such as pt1, pt2,\n\n+   -\
    \ Point pt1, pt2, pt3;\n\nYou can then assign values to individual data fields\
    \ (called data members):\n\n```\npt1.x = 1;\npt1.y = -2;\n```"
