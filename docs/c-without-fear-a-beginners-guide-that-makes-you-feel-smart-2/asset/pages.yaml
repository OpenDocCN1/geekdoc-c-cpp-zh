  md: '# 6. Pointers: Getting a Handle on Data


    In interviewing technical for Microsoft, I would see on candidates'' resumes advanced
    C and C++ programming listed as accomplished skills. So, I would ask candidates
    to explain the concept of a pointer to me in their own words. I was interested
    only in how articulate they could be on a technical subject.


    Often too, they''d look at me dumbfounded. They had forgotten an important rule
    of resume padding: if you claim to know C++, you''re supposed to know what a pointer
    is...or at least make up a good bluff answer.


    In this chapter, I''ll explain what pointers are and—more importantly—why you
    should care.


    # What the Heck Is a Pointer, Anyway?


    First, you need to know what an address is. The CPU doesn''t understand names
    or letters: It refers to locations in memory by, address. You don''t know what
    these numbers are, although you can print them out if you want. For example, the
    computer might store variables a, b, c, at numeric addresses 0x220004, 0x220008,
    and 0x22000c. These are in hexadecimal notation (that''s base 16).


    | Value | Address |

    | a | 0x220004 |

    | b | 0x220008 |

    | c | 0x22000c |


    There''s nothing magic about these particular addresses...they are just numbers
    I picked at random. Many things can affect what addresses are used at runtime.


    Now you''re ready to understand what a pointer is.


    # The Concept of Pointer


    A pointer is a variable that contains an address. While most variables contain
    useful information (such as 5, 3, and 8 in this example), a pointer contains the
    numeric location of another variable. A pointer is a useful as a way to get to
    something else.


    | Value | Address |

    | a | 0x220004 |

    | b | 0x220008 |

    | c | 0x22000c |

    | p | 0x220010 |


    Why is this useful? Sometimes a function needs to send another function a large
    amount of data. One way is to copy all information and pass it along. But another,
    more efficient is to give the address of the data to work on.


    Another reason is this: Suppose you want to give a function not just copy of some
    data but the ability to change the original value; I want to write a function
    double___values(x, y) that doubles all the variables passed to it. In C++, the
    principal way is to pass a series of pointers. This function gives the location
    of the variables and lets the function manipulate the variables themselves, not
    just copies.


    There are other reasons for using pointers. In more advanced programming, pointers
    enable you to create data structures with links to other data, level of complexity.
    So, you can have linked lists and internal networks in memory.


    # Interlude: What Addresses Look Like?


    In the previous section, I assumed the variables a, b, and c had the physical
    addresses 0x220004, 0x220008, and 0x22000c. They are hexadecimal, meaning they
    use base 16.'
