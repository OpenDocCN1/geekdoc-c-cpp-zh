    +   - Given this code, the compiler now knows how to interpret the addition sign
    when applied to two objects of the class.

    point1 + point2


    When an operator function is used this way, the left operand becomes the object
    through which the function is called, and the right operand is passed as an argument.
    Then, the operator+ definition should appear, unqualified references to x and
    y refer to the values of the left operand.


    Operator functions can also be declared as global functions. For a binary operator,
    the function has two arguments. For example:


    ```

    Point operator+(Point pt1, Point pt2) {

    Point new_pt;

    new_pt.x = pt1.x + pt2.x;

    new_pt.y = pt1.y + pt2.y;

    return new_pt;

    }


    ```


    +   - One drawback of writing this operator function is that it has access to
    private members. To overcome this, declare the global function as a friend of
