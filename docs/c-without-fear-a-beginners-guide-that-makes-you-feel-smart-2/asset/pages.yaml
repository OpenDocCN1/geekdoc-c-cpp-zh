  md: '# 10. New Features of C++0x


    The C++ language has gone through many improvements since it was created by Bjarne
    Stroustrup. But more than that, the new C++0x specification is a landmark, adding
    many flexible and time-saving features programmers have requested for years. C++0x
    is the new standard that major vendors are expected to implement in coming years
    if not already.


    Later in the book, I present C++0x features specific to classes and object-oriented
    programming. For now, let''s look at the features you can start using with right
    away.


    # Overview of C++0x Features


    ```

    C++0x

    ```


    This chapter is for readers who have C++0x-complaint compilers, although some
    features (notably the long long int) have been supported by some compilers for
    years.


    The new C++0x-specific features described in this chapter include the following:


    +   - **long long int**. This new data type stores values far beyond the limit
    of the **long int**, which is only plus or minus 2 (thousand million). The **long
    long int** is a 64-bit number that can store astronomical values in excess of
    a billion...but without absolute precision, unlike **double**.

    - **Ranged-based** (for "each"). This syntax is a variation on the C++ for keyword.
    Instead of beginning and ending explicitly in a loop, you just use "Process each
    item in the group." It''s simpler, easier, and less error-prone.

    - The **auto** and **deduct** keywords. These are convenient when working with
    complex, exotic types.

    - The **nullptr** keyword. This is the new way to set null pointers. Although
    not strictly required, it may be needed to write fully correct programs.

    - **Strongly typed enumerations**. You can use this feature to refer to meaningful
    symbolic names rather than arbitrary numbers; it''s another way to get rid of
    "magic numbers." This is an existing feature in C++ specs but gets strengthened
    in C++0x. Both weak and strong **enum** types are now supported.

    - **Rawstring**. This feature lets you enter string literals without having to
    use escape characters for " and \


    In later chapters, I describe C++0x features that will help you when you write
    classes or templates, introducing them along with related topics:


    +   - Initializing data members within a class (Chapter 12)

    - Delegating constructors (Chapter 12)

    - Consistent initialization (Chapter 12)

    - Creating user-defined literals (Chapter 13)

    - Smart pointers (Chapter 15)

    - Correct interpretation of right-angle brackets (Chapter 16)

    - Inheriting base-class constructors (Chapter 17)

    - Requiring explicit override of virtual functions (Chapter 18)


