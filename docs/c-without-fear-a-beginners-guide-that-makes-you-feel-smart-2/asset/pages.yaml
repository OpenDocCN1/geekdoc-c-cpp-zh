  md: 'There''s a good reason for using hexadecimal. Because 16 is an exact power
    of 2 (2 * 2 * 2 * 2 = 16), each hexadecimal corresponds to a pattern of four binary
    digits—no more, here''s how hexadecimal digits work.


    | HEXADIMAL DIGIT | EQUIVALENT | EQUIVALENT BINARY |

    |---|---|--|

    | 0 | 0 | 0000 |

    | 1 | 1 | 0001 |

    | 2 | 2 | 0010 |

    | 3 | 3 | 0011 |

    | 4 | 4 | 0100 |

    | 5 | 5 | 0101 |

    | 6 | 6 | 0110 |

    | 7 | 7 | 0111 |

    | 8 | 8 | 1000 |

    | 9 | 9 | 1001 |

    | a | 10 | 1010 |

    | b | 11 | 1011 |

    | c | 12 | 1100 |

    | d | 13 | 1101 |

    | e | 14 | 1110 |

    | f | 15 | 1111 |


    The advantage of hexadecimal notation is its close relation to binary. For example,
    the hex numeral 8 is 1000 in binary, and every hex numeral f is 1111. 88ff is
    equivalent to 1000 1000 1111 1111.


    For computer architects, who need to quickly translate numbers into bit patterns,
    this is essential. Also, no less—you can tell at a glance how wide an address
    is: 0x8000 has four digits; it every hex digit corresponds to 16 binary digits.


    Every computer architecture uses addresses of some fixed width. It''s important
    to know at glance whether an address is too large to fit on a certain computer.


    At the time of writing, 32-bit architecture is the universal norm on normal computers,
    although it will someday give way to 64-bit architecture. With 32-bit addresses,
    no address can have more than 32 binary digits (eight hexadecimal digits). Technically,
    all addresses should be expressed in hex digits; for example, 0x000080ff. For
    simplicity, this chapter will use smaller addresses and neglect the leading zeros,
    to make the figures manageable on the page.


    Remember that 32-bit addresses support more than 4 billion locations in memory,
    although this is even being exceeded by memory hardware, requiring clever work
    around the part of computer and operating-system designers. Someday, 64-bit architecture
    will support a virtually unlimited number of addresses>


    # Declaring and Using Pointers


    A pointer declaration uses the following syntax:


    ```

    type *name;

    ```


    For example, you can declare a pointer p, which can point to variables of type
    int:


    ```

    int *p;

    ```


    At the moment, the pointer is not initialized. All we know that it can point to
    data objects of type int. But type matters. The base type of a pointer determines
    how the data it points is interpreted; so it should point to int variables.


    The next statements declare an integer n, initializes it to 0, and assigns its
    address to pointer p:


    ```

    int n = 0; // p points to n!

    ```


    The ampersand (&) gets the address of it. You generally don''t care what the address
    is; all that matters is that p contains the address of n—that is, p points to
    n—and you can use p to manipulate n.


    After p=&n is executed, p contains the address of n. A possible memory layout
    for the program is shown here.'
