    the message "Enter a number (0 = exit)". The program should call get divisors
    to show the prime factorization and then prompt the user again, until he or she
    exits (0. If you want to look at code, check Example 4.2, 90.)


    **Exercise 4.3.2.** Write a program that calculates triangle numbers using a recursive
    function. A triangle is the sum of all numbers from 1 to N, in which N is number.
    For example, triangle(5) = 5 + 4 + 3 + 2 + 1.


    **Exercise 4.3.3.** Modify Example 4.3 so that it is a **recursive** solution.
    You will end up having much less code. (Hint: To make the job easier, use your
    functions: get_all_divisors and get_lowest_divisor. The **main** function should
    call get_all_divisors, which in turn has a loop: get_all_divisors it aet_lowest_divisor
    repeat each n with n, where i is the divisor that found. If n is not prime, then
    return the prime; and the loop stop.)


    # Example 4.4. Euclid''s Algorithm for GCF


    In the early years of school, we''re asked to find greatest common factors (GCFs).
    For example, the greatest common factor of 15 is 5. Your teacher lectured you
    about GCF until you didn''t want to hear about it.


    If I wouldn''t have to write a function for this! We''ll just focus on GCF, as
    I''ll show in Chapter 11, if you can figure the GCF of two numbers, you can compute
    the lowest common multiple (LCM).


    The technique was used almost 2,500 years ago by a Greek mathematician Euclid,
    and it''s one of the most famous in mathematics.


    To GCF: for two numbers A and B:


    +   # B equals 0,

    The answer is A.

    Else

    The answer is GCF(B, A%B)


    You may remember remainder division (%) from earlier chapters. A%B means this:


    Divide A by B and produce the remainder.


    For example, 5%2 equals 1, and 4%2 equals 0. A result of 0 means that B divides
    A evenly.'
