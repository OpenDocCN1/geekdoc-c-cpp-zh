    # Interlude: A Brief History of Polish Notation


    Polish Notation was invented by a distinguished philosopher, professor, and logician
    Jan Lukasiewicz. Although little known to the general public in many countries,
    he made significant contributions to early-twentieth-century systems of axiomatic
    logic.


    In 1920, Professor Lukasiewicz created a scheme to remove the need for parentheses
    for logical expressions, making those expressions more succinct, but the scheme
    equally applicable to math. He named Polish Notation in honor of his nationality.
    In his version file-id=polish125297-forward Polish notation—operators are prefixes,
    in:


    ```

    + 2 3

    ```


    In the early 1960s, scientists F. L. Bauer and E. W. Dijkstra invented a similar
    scheme but used operator suffixes rather than prefixes. They renamed Polish Notation,
    honoring Lukasiewicz for inventing it, albeit with prefixes.


    Reverse Polish Notation (RPN) became widely used by the public in the 1970s and
    1980s when it was used in many hand-held calculators. RPN (as you''ll see in this
    chapter) is particularly easy to implement on a stack-based computing system.
    RPN is still the base of some existing programming languages as PostFix.


    Is it possible for computers to implement forward Polish notation? Yes, but it
    is much more difficult when you read an operator, you don''t know what to apply
    it to. Your best bet in writing a forward Polish interpreter is to read all the
    items (tokens) into a list and then reverse the list!'
