  md: 'In the PC environment, the C and C++ languages have generally supported 16-bit
    integers as short and as long. 16 bits was standard for computers in the Dark
    Ages, but 16 bits cant store numbers larger than 64KB, a huge limitation. It was
    necessary to have a long integer (which at 32 bits wide) ranges over 4 billion.


    But it''s not had beyond this limit: Alternative is to switch to floating point,
    --because of scientific notation--can store astronomically big and very tiny.
    Floating-point data cannot store long integers with absolute precision. But...


    Six-four bits is the future of computing and the natal size for integers to migrate
    to, but the long type is already taken (32 bits).


    | TYPE | TYPICAL MEANING (SUPPORTED ON NEAR ALL PCS) | C++ SPECIFICATION |

    | --- | --- | --- |

    | char | 8 bits, large enough to hold an ASCII character | Enough to hold a standard
    character |

    | short int | 16 bits, limit of 64KB | Size equal to or greater than short in
    size |

    | long int | 32 bits, limit of approximately 4 billion (plus or minus 2 billion)
    | Size equal to or greater than int in size |

    | long long int | 64 bits, limit of 4 billion | Size greater than long |


    There is also a generic int, which I use a great deal in both. The int, or "natural
    integer", is intended to match the processor size of the architecture on which
    the program runs, so it naturally results in more efficient programs. On current,
    32-bit systems, int is equivalent to long. (More on this in the Interlude.)


    Each of these types has an unsigned version, as unsigned int and unsigned long.
    Unsigned do not store negative values, instead store twice as many positive values.
    So, what in the negative range, you gain back by having a bigger positive range.
    Signed integers (the default) store both positive and negative values.


    The syntax for declaring long int is similar to that for any type. Integer types
    a quirk. Except with the int type itself, the keyword int is optional.


    ![](img/a7964e9035b7ca0710b559c70a60c09a_166_0.png)


    ```

    long long variables;

    long long int variables; // int is optional

    ```


    And there is also the unsigned version, which does not store negative values:


    ```

    unsigned long variables;

    unsigned long int variables; // int is optional

    ```


    For example:


    ```

    long long i;           // i is uninitialized 64-bit int

    long long i = 0;    // i initialized to 0.

    long long i, j, k;  // i, j, and all 64-bit ints.

    ```


    # Interlude: Why a "Natural" Integer?


    I use the int type throughout this book. For the PC environment, int is equivalent
    to long, the 32-bit type. As the "natural" integer, int is intended to match the
    processor size of the target environment so programs run efficiently.


    There is one downside: if you ever port your code to a smaller architecture (16
    bits), programs that ran beautifully on 32-bit architecture can break without
    warning. It''s possible your int holds values larger than 64KB; if so, when ported
    to a 16-bit architecture, your programs will encounter serious bugs.


    The upset is that using int at Microsoft avoids this approach. The int is never
    used in serious commercial projects. Microsoft developers consistently stick to
