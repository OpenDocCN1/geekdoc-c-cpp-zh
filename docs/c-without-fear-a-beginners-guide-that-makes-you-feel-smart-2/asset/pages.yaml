    In all these examples, the addresses shown are arbitrary. A program will likely
    use different addresses every time it is run. The important thing about pointers
    is the relationships that they create.


    Here comes the interesting part. Applying the indirection operator (*) says "the
    thing pointed to." Assigning a value to *p has the same effect as assigning to
    n, because n is p points to.


    ```

    * p = 5; // Assign 5 to the int pointed to by p.

    ```


    So, because of the asterisk (*), this operation changes the thing that p points
    to, not the value of itself. Now the memory layout looks like this:


    | Value | Address |

    |---|---|

    | -> n | 0x230004 |

    | --- p | 0x230004 | 0x230220 |


    ```

    * p = 5;

    ```


    The effect of the statement, in this case, is the computer finds the memory location
    pointed to by b and puts value 5 at that location.


    You can use a pointer to a pointer both to get and assign data. Here''s another
    example of pointer usage:


    ```

    * p = *p + 3; // Add 3 to the int pointed to by p.

    ```


    The value of n changes again—time from 5 to 8. The effect of this statement is
    the same as n = n + 3. The computer finds the memory location pointed to p and
    adds 3 to the value at that location.


    | Value | Address |

    |---|---|

    | -> n | 0x230004 |

    | --- p | 0x230004 | 0x230220 |


    ```

    * p = *p + 3;

    ```


    To summarize, when p points to n, referring to *p has the same effect as referring
    to n. Here are more examples:


    | WHEN P POINTS TO N, THIS STATEMENT... | HAS THE SAME EFFECT THIS STATEMENT...
    |

    |---|---|

    | *p = 33; | n = 33; |

    | *p = *p + 2; | n = n + 2; |

    | cout << *p; | cout << n; |

    | cin >> *p; | cin >> n; |


    But if using p is the same as n, why not use *p in the first place? One reason,
    remember, that pointers enable a function to change the value of an argument passed.
    Here''s how it works in C and C++:


    +   1. The caller of a function passes the address of a variable to be changed.
    For example, the caller calls (&address of n).

    2. The function has a pointer argument, as p, that receives this value. The function
    can then use *p to manipulate the value of n.'
