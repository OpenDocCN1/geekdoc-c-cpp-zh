  md: 'The following statements write the values of the three variables (n, amount,
    str) directly to the file. Assume that binfil is a file-binary mode


    ```

    binfil.write((char*)(n), sizeof(n));

    binfl.write((char*)(x), sizeof(x));

    binfil.write(str, sizeof(str));

    ```


    By this way, in contrast [Chapter 10](#) use the old-fashioned C language type:


    ```

    (type) data_item

    ```


    Normally, using the [reinterpret_cast](#) (which operates on registers) would
    be preferred. But frankly, I don''t have to go that all in... and while the C++
    specification does like old-style casts, it has decided to use them. You will
    not get an error message using the shorter—and frankly more convenient—older style.
    (For information on the newer, preferred, see [Appendix A](#).


    Here''s what data lines look after being written. (The actual binary representations
    are strings of 1s and 0s, but I have translated them to make them more readable.)


    | 4 bytes | 8 bytes | 16 bytes |

    |---|---|---|n| 3 | 215.3 | "It''s C++" |


    To read this file, you need to know how to read these three files. In reality,
    the lines between different fields are invisible; in fact, they don''t even exist,
    except in the mind of the programmer. (Remember, that a computer—including disk
    files—is nothing but a series of bytes containing numbers.)


    There is nothing in the file that tells you where one field begins and starts.
    With a text file, you can always read a field by reading to the next newline or
    space, but you can''t do that with a binary file.


    Therefore, when you read a binary file, you need to know what kind of data to
    expect. In the example shown, that data structure: an **double**, and a 16-byte
    array of **char**, in that order. You could read the data by following this procedure:


    +   - Read four bytes directly into an integer variable.

    - Read eight bytes directly into a **double** variable.

    - Read 16 bytes into a string.


    That''s exactly what the lines of code do:


    ```

    binfil.read((char*)(n), sizeof(n));

    binfil.read((char*)(x), sizeof(x));

    binfil.read(str, 20);

    ```


    The order in which these are done is critical. For example, if you tried to read
    the **double** (floating-point) field first, the results would be garbage—because
    integer and floating-point have incompatible formats.


    Binary reads require more precision than reading streams of text. With text input,
    a string of digits like "12000" can be read exactly how to interpret a string.
    A direct binary read performs no integer to floating-point conversions of any
    kind. Copying an eight-byte double directly to a four-byte integer would create
    a very unfortunate situation


    The moral is to know your data formats precisely before proceeding binary IO.


    You perform input/output to a file using the **read** and **write** member functions.
    These functions take two arguments: an address and a number of bytes.


    ```

    fstream.read(addr, number_of_bytes);    // Read data into addr

    fstream.write(addr, number_of_bytes); // Write data from addr

    ```


    The first argument is an address in memory: in the case of the **read** function,
    this is a destination to read the data into. In the case of the **write** function,
    this is a source address where to write the data to the file.


    In either case, this function must have the type **char**, so you need to pass
    an address expression (a pointer, an name, or an address obtained with &). You
    only need to change the type using a **char** type cast, unless the type is already
    **char**.


    ```

    binfil.write((char*)(n), sizeof(n));

    ```


    In the case of string data, you don''t need to use the **char** cast, because
    strings already have that type.


    ```

    binfil.write(str, sizeof(str));

    ```'
