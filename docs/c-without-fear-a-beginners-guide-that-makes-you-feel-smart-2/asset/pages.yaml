  md: '# Table B.2 Escape Characters in C++


    | ESCAPE CHARACTER | MEANING |

    | --- | --- |

    | \'' | Literal single quotation mark. |

    | \" | Literal double quotation (This is necessary, because otherwise a quotation
    mark is recognized as terminating the string literal.) |

    | \\ | Literal backslash. |

    | \a | Bell. |

    | \b | Backspace. |

    | \f | Feed. |

    | \n | Newline. |

    | \r | Carriage return. |

    | \t | Horizontal tab. |

    | \v | Vertical tab. |

    | \ooo | ASCII character corresponding to number nnn, where nnn is an octal number
    (base 8). |

    | \xhh | ASCII character corresponding to number hhh, where hhh is a hexadecimal
    number (base 16). |


    # Two''s Complement Format for Signed Integers


    Virtually all personal computers in use today (including Macs) use two''s complement
    format for storing signed integers. Two''s complement is a technique for representing
    negative numbers with positive numbers. Although the leftmost bit indicates the
    sign of the quantity, it is not precisely as a sign bit.


    With signed formats (for example, int as opposed to unsigned int), the bottom
    half of the range is used to represent positive values, along with zero. The top
    half of the range represents negative values. Consequently, a pattern with leftmost
    bit set to 1 indicates a negative value.


    Here''s how it works. To negate any number, follow these steps:


    +   1. Reverse the setting of each bit (this is bitwise negation, called the one''s
    complement).

    2. Add 1.


    For example, to produce -1 for a single-byte number, first start with the bit
    pattern for 1. Remember, we''re going to get the result by reversing each bit
    and adding 1.


    ```

    0000 0001

    ```


    First, we reverse each bit:


    ```

    1111 1110

    ```


    Adding 1 then produces the two''s complement. This is therefore the two''s complement
    representation of: -1


    ```

    1111 1111

    ```


    In fact, for every signed integer format, the setting of all 1s in every bit position
    signifies -1. If we use unsigned format, this bit pattern would be interpreted
    as 255.


    Using all 1s to represent -1 is mathematically sound. If you take the negative
    again, you get positive 1, exactly as expected. Remember, to get the negative
    of any signed number, reverse each dig 1:


    ```

    1111 1111      (This is -1)

    ```


    ```

    0000 0000    Reverse each bit.

    + 0000 0001  Add 1.

    ------------

    0000 0001

    ```'
