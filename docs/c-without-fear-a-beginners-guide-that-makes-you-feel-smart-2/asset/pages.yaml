  md: "# 3. The Handy, All-Purpose \"for\" Statement\n\nSome tasks are so common that\
    \ C++ provides special syntax to represent them with fewer keystrokes; for example,\
    \ the increment operator (++). Because adding 1 is so common, C++ provides this\
    \ operator even though you could get away without it.\n\n```\nn++; // Add 1 to\
    \ n.\n```\n\nAnother case is the for statement. Its only purpose in life is to\
    \ make certain kinds of while loops more concise. But this turns out to be so\
    \ useful that programmers come to rely on it heavily. I use it throughout the\
    \ rest of this book.\n\nYou'll find that once you use it a few times, the for\
    \ statement will become second nature. But it looks strange the first time you\
    \ see it.\n\n# Loops Used for Counting\n\nAs worked with while loops in Chapter\
    \ 2, you may have noticed the typical use of a loop to count to a number, performing\
    \ some action a specific number of times. For example:\n\n```\ni = 1;\nwhile(i\
    \ <= 10) {\n    cout << i << \" \";\n    i++;\n}\n```\n\nThis code basically prints\
    \ numbers from 1 to 10. The loop variable gets an initial value of 1 and then\
    \ incremented each time through the loop. You can summarize what happens this\
    \ way:\n\n+   1. Set i to 1.\n2. Perform the loop action.\n3. Set i to 2.\n4.\
    \ Perform the loop action.\n5. Set i to 3.\n6. Perform the loop action.\n7. Continue\
    \ in this manner up to, and including, i being set to 10.\n\nIn other words, the\
    \ for loop executes 10 times, each time giving a successively higher value to\
    \ i. Loops of this kind tend to do the same over over.\n\nWe can identify three\
    \ such actions: initialize the loop counter; test the loop condition; and, if\
    \ true, execute the statement and increment. Then go back to step 2 until the\
    \ condition is false.\n\ninitializer: evaluated just once, before the loop begins\n\
    \n```\ni = 1;\nwhile (i <= 10) {\n    cout << i << \" \";\n    i++;\n}\nincrement:\
    \ evaluated after each\nexecution of the loop statement\n```\n\nIt would be nice\
    \ to have a way to express these actions in one succinct statement. Then it would\
    \ be easy to write a loop that counts to 10.\n\n![](img/a7964e9035b7ca0710b559c70a60c09a_64_0.png)\n\
    \n# Introducing the \"for\" Loop\n\nThe for statement provides this mechanism,\
    \ letting you specify the initializer, condition, and increment in one compact\
    \ line."
