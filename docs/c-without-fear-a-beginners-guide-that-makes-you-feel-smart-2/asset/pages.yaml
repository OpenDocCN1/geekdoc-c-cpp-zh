  md: "B does not equal 0, the algorithm replaces the A, B with the arguments B, A%B\
    \ and calls itself recursively. This solution works for two reasons:\n\n+   -\
    \ The terminal case (B equals 0) is valid. The answer is A.\n\n+   - The general\
    \ case: GCF(A, B) equals GCF(B, A%B), so the function calls itself with new arguments\
    \ B and A%B.\n\nThe terminal case, in B equals 0, is valid assuming A is nonzero.\
    \ You can see that A divides evenly into itself and 0, nothing larger can divide\
    \ into A. (Note that 0 can divide evenly by by any whole number except itself.)\
    \ For example, 997 is the greatest common factor for the pair (997, 0). Nothing\
    \ larger divides evenly into both.\n\nThe general case is valid if the following\
    \ is true:\n\nThe greatest common factor of the pair (B, A%B) is also the greatest\
    \ common factor of the pair (A, B).\n\nIt turns out this is true, and because\
    \ it is, the GCF problem is passed along the pair (A, B) to the pair (B, A%B).\
    \ This is the general idea of recursion: Pass the problem to a simpler case involving\
    \ smaller numbers.\n\nIt can be shown that the pair (B, A%B) involves less than\
    \ or equal to the pair (A, B). Therefore, during each recursive call, the algorithm\
    \ usesively smaller numbers until B is zero.\n\nI have the rest of the proof for\
    \ an interude at the end of this section. Here is a complete program for computing\
    \ common factors:\n\n#  gcf.cpp\n\n```\n#include <cstddef>\n#include <iostream>\n\
    using namespace std;\n\nint gcf(int a, int b);\n\nint main()\n{\n    int a = 0,\
    \ b = 0; // Inputs to GCF.\n\n    cout << \"Enter a: \";\n    cin >> a;\n    cout\
    \ << \"Enter b: \";\n    cin >> b;\n    cout << \"GCF = \" << gcf(a, b) << endl;\n\
    \n    system(\"PAUSE\");\n    return 0;\n}\n\nint gcf(int a, int b) {\n    if\
    \ (b == 0)\n        return a;\n    else\n        return gcf(b, a%b);\n}\n```\n\
    \n![](img/a7964e9035b7ca0710b559c70a60c09a_84_0.png)\n\n# How It Works\n\nAll\
    \ the main does in this case is to prompt for two input variables a and b, call\
    \ the greatest-common-factor function (gcf), and print results:\n\n```\ncout <<\
    \ \"GCF = \" << gcf(a, b) << endl;\n```\n\nAs for the gcf function, it implements\
    \ the algorithm discussed earlier:\n\n```\nint gcf(int a, int b) {\n    if (b\
    \ == 0)\n        return a;\n    else\n        return gcf(b, a%b);\n}\n```"
