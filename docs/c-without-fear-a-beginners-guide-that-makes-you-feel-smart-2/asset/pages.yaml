    # # Multiple Modules


    In Chapter 4, I mentioned that the use of functions in your program enables you
    to adopt a division-of-labor approach, making large projects more doable. This
    is true any time you use functions, but it''s especially true when you put functions
    into multiple modules.


    What do I mean module? Well, consider the way all the programs have been created
    in this book: There is one source file (.cpp file), which is translated into one
    object file containing machine code (.o file) and then linked into an executable
    (.exe file).


    But you can use more than one source-code. A single function cannot span more
    than one source file. You can, however, place individual functions in different
    files.


    Here''s a simple example. This program has four functions: main, calc, get_int
    and get_dbl. These all could be in one source file, but for the sake of illustration,
    I''ve put the function definitions into two separate files, mod1.cpp and mod2.cpp.


    ```

    void calc();

    int get_int(int i);

    double get_dbl(double f);

    ```


    ![](img/a7964e9035b7ca0710b559c70a60c09a_160_0.png)


    Each of the two source files (.cpp files) is a separate module.


    This example also illustrates the use of an include file, myproj.h (in this fact,
    this is a good illustration of how include files are useful in general.). Assume
    that any of the three other functions than main—these—remember, calc, get_int,
    and get_dbl—may be called by a function in another module. To compile this, you
    need to put function declarations at the beginning of each source file.


    For example:


    ```

    void calc();

    int get_int(int);

    double get_dbl(double);

    ```


    This can get a little confusing, so remember these rules:


    +   1. Each function is defined in exactly one place—that is, in one source file.
    For instance, in the current example, the calc function is defined in mod1.cpp.

    2. Every source file needs a declaration (a prototype) of a function before the
    function can be called.


    The C++ compiler will look for the definition of every prototyped function in
    the source file, but if it does not find the definition, the compiler will assume
    the function is defined in another module.


    When going to be shared between modules, the best practice is to place all such
    function declarations (prototypes) in a central file—an include file—and use an
    #include directive to make sure that each file gets those prototypes.


    You can share variables in the same way, but variables are private to the module
    in which they are created—unless an external declaration is added to each file
    (or to the include file). For example, the following declaration states that variables
    a, b, and c are declared somewhere in the program (possibly though not necessarily)
    in another module.


    ```

    extern int a, b, c;

    ```


    Each of these variables to be created in one and only module—just as each function
    has to be defined in only one module. You create a variable using a standard variable
    declaration, optionally with initialization.'
