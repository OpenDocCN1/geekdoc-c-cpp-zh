  md: '# Inheritance: What a Legacy


    Inheritance (also called *subclassing*, or deriving a class) was once the most
    heavily promoted idea in object orientation. It promised to save a lot of work.


    These days, it is more controversial; programmers debate how to use it. Near the
    end of the chapter, I will show it in the context of a costly thought-out inheritance
    tree...but those take a lot of work to build an around.


    For now, we''ll look at simple uses of inheritance—including new features of C++ox
    that make it easier to use—and consider its more sophisticated uses later.


    # How to Subclass


    One of the themes of this book is reusable code. If a problem is solved once,
    you don''t want to solve it again. So if a class does a particular job, you don''t
    want to rewrite that class. You just want to go on reusing it in new projects.


    The problem is, what if a *class almost* satisfies the needs of a new problem
    but doesn''t quite do the job? What if you need to extend its capabilities?


    You have a couple of choices. One is inheritance, or subclassing. Another is object
    containment. Finally, there is the use of subclassing within a well-thought inheritance
    hierarchy. We will consider simple cases of inheritance first.


    To derive, or subclass, one class from another, use this syntax:


    ```

    class class_name : public base_class {

    declarations

    };

    ```


    The *class_name*, in this context, specifies the new class. It inherits all the
    members of the [base class](except for constructors—more about that later).


    The *declarations* specify additional members, which may specify new members or
    override old ones.


    Here''s an example that creates a new class based on the Fraction class:


    ```

    class FloatFraction : public Fraction {

    public:

    double get_float();

    };

    ```


    The FloatFraction is declared as a subclass of the existing Fraction class so
    that each object of the new class has all the members declared in the Fraction
    class. In addition, each Fraction object supports get_float, a new member function.


    Once this class is declared, you can use to create objects, just like any other
    class.


    This next example declares a new class, Point3D, deriving from the existing Point
    class. As you may recall, the Point class has two data members: x and y.


    ```

    class Point3D : public Point {

    private:

    int z;

    public:

    int get_z() {return z;}

    void set_z(int n) {z = n;}

    };

    ```


    ```

    Point3D mypoint;

    ```


    A Point3D object has three data members: x, y, and z.


    Here''s another example involving inheritance from the Fraction class—but this
    time through an intermediate class (FloatFraction):'
