  md: '# Pointer Arithmetic


    One of the important uses of pointers is efficiently arrays. Suppose you declare
    this:


    ```

    int arr[5] = (5, 15, 25, 35, 45);

    ```


    The elements arr[0] through arr[4], of course, can be used like individual integer
    variables. You can, for example, write statements as "arr[1]=10";


    But what is the expression "arr" itself? Can "arr" appear by itself?


    Yes, "arr" is a constant that translates into an address—specifically, the address
    of the first element. Because it''s a constant, you cannot change the value of
    "arr" itself. You can, use it to assign a value to a pointer variable:


    ```

    int *p;

    p = arr;

    ```


    The statement "p = arr" is equivalent to this:


    ```

    p = arr[0];

    ```


    This is a more concise, cleaner to initialize a pointer to the address of the
    first element, arr[0]. Is there a similar technique for other elements? You betcha.
    For example, to assign the address of arr[2], you would use:


    ```

    p = arr + 2;

    // p = &arr[2];

    ```


    C++ interprets all array names as address expressions. arr[2] translates into
    the following:


    ```

    * (arr + 2)

    ```


    If you''ve been paying attention, this might looks looks odd. We add 2 to the
    address of the array, arr. But the element arr[2] is not two, but eight bytes
    (for each integer—assuming you are using a 32-bit system!) Yet it still works.
    Why?


    It''s because of pointer arithmetic. Only certain arithmetic operations are allowed
    on pointers and other address expressions (such as arr). These are as follows:


    ```

    address_expression + integer

    i-pointer + address_expression

    address_expression - integer

    address_expression - address_expression

    ```


    When integer and address expressions are added together, the result is another
    address expression. Before the calculation, however, the integer is automatically
    scaled by the size of the base type. The C++ compiler performs this scaling for
    you.


    ```

    new_address = old_address + (integer *

    size_of_base_type)

    ```


    So, for example, if p has base type int, adding 2 to p has the effect of increasing
    it by 8—because 2 times the size of the base (4 bytes) is incremented by 1, this
    always has the effect of making p point to the next element:


    Scaling is an extremely convenient feature of C++, because it means that when
    a pointer points to an address of an array and it is incremented by 1, this always
    has the effect of making p point to the next element:


    ```

    p++; // Point to next element in the array.

    ```


    This is one of the most important things to remember when using pointers:


    > When an integer value is added or subtracted from an address expression, the
    compiler automatically multiplies that integer by the size of the base type.


    Another way of saying this is to say that adding N to a pointer produces an address
    N elements away from the original pointer value.'
