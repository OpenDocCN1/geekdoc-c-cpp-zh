  md: "to rebot.\nSo, before we go further, it's a good idea to release memory allocated\
    \ with **new**.\n\nBut once you release the memory attached to a node, you can\
    \ no longer use the node, so how do you get to the rest of the list? Fortunately,\
    \ there's an easy solution: Use a temporary variable.\n\n```\nvoid delete_list(node\
    \ *p_node) {\n  node *temp;\n\n  while (p_node) {\n    temp = p_node;\n    p_node\
    \ = p_node->next;\n    delete temp;\n  }\n}\n```\n\nGiven this function, you delete\
    \ the entire list by passing the address of the first node:\n\n```\ndelete_list(root);\n\
    ```\n\nThis is an iterative solution because it uses a straightforward **while**\
    \ loop that traverses the list and deletes nodes as it goes. It is elegant because\
    \ it uses a look-ahead approach, saving the address of the next node just before\
    \ deleting the current node.\n\nA more elegant but less efficient approach is\
    \ to use recursion. In this version, a call to the function deletes the portion\
    \ of the list to the **right** of the node selected (through a recursive call).\
    \ Then it deletes the node itself.\n\n```\nvoid delete_list(node *p_node) {\n\
    \  if (p_node->next) // If not at end,\n    delete_list(p_node->next); // Delete\
    \ list.\n  delete p_node; // Delete me.\n}\n```\n\nThis clearly looks more efficient,\
    \ doesn't it? But this is misleading. Conceptually, it is elegant because it uses\
    \ the simplifying device of recursion: we assume the problem is already solved\
    \ for the N-1 case and have to solve the Nth case. Here we assume that our program\
    \ knows how to delete the rest of the list (that is, the portion to the right\
    \ of the current node).\n\n# C++ Only: Using Smart Pointers to Clean Up\n\n# C++0x\n\
    \nThis section applies to C++0x-compliant compilers only.\n\nIf you are working\
    \ with a C++0x-compliant compiler, an even easier solution is open to you: Use\
