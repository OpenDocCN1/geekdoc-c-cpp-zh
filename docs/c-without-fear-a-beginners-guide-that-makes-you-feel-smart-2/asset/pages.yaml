  md: '# Interlude: A New Kind of#include?


    In the previous example, you may notice I introduced new syntax for the **#include**
    directive. Remember to turn on support for any area of the C++ library, the preferred
    method is to use angle brackets:


    ```

    #include <iostream>

    ```


    But to include declarations from your project files, you need to use quotation
    marks:


    ```

    #include "Fraction.h"

    ```


    The two forms of **#include** do almost the same thing, but with the quote-mark
    syntax, the C++ compiler is directed to first look in the current directory and
    then only look in the include-file directory (which is usually set by an environment
    variable or environment setting of the operating system).


    Depending on which C++ compiler you have, you could probably get away with using
    the quote-mark syntax for both library files and project files. But the standard
    practice is to use angle brackets to turn on features of the standard library,
    as I follow in this book.


    ![](img/a7964e9035b7ca0710b559c70a60c09a_197_0.png)


    Exercise


    **Exercise 11.3.1.** Write a program that uses the Fraction class by setting a
    series of values by calling the "set" function: 2/2, 4/8, -9/10, 100/200. Have
    the program print out the results and verify that each fraction was correctly
    simplified.


    # Example 11.4. Fraction Arithmetic: add and mult


    The next step in creating a Fraction class is to add arithmetic functions, and
    add mult. In [Chapter 13](#) we will create operator functions that call these
    arithmetic functions.


    Addition is the hardest, but you may recall the technique from grade school. Consider
    addition of two fractions:


    ```

    A/B + C/D

    ```


    The trick is to find the lowest common denominator—which is the same as the lowest
    common multiple (lcm) between B and D:


    ```

    LCD = LCM(B, D).

    ```


    Fortunately, we have a convenient utility function, lcm, to do that. Then A/B
    has to be converted to a fraction that uses this lowest common denominator (LCD).


    ```

    A * LCD/B

    ---------

    B * LCD/B

    ```


    We then get a fraction in which the denominator is LCD. It''s similar for C/D:


    ```

    C * LCD/D

    ---------

    D * LCD/D

    ```


    ```

    (A * LCD/B) + (C * LCD/D)

    -----------------------

    LCD

    ```


