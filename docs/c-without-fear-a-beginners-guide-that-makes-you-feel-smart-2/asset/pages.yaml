  md: "# How It Works\n\nAll the functions in this example have been described in\
    \ previous sections, so I won't devote space to explaining them. There is one\
    \ aspect of this example, which merits a little discussion. You may notice that\
    \ there is only one version of the operator=` function.\n\n```\nString String::operator+(char\
    \ *s) {\n    String new_str(ptr);\n    new_str.cat(s);\n    return new_str;\n\
    }\n```\n\nThis function assumes that the right operand has type char. therefore\
    \ it supports operations like this one:\n\n```\nString a(\"King\");\nString b\
    \ = a + \"Kong\";\n```\n\nBut how does the class support operations like the following,\
    \ in which both operands are String objects?\n\n```\nString a(\"King\"), b(\"\
    Kong\");\nString b = a + b;\n```\n\nThe answer is that although the class does\
    \ not directly support the + operation between two String objects, the hidden\
    \ conversion function comes to the rescue.\n\n```\noperator char*(() const { return\
    \ ptr; }\n```\n\nThe class knows how to convert a String object into a char*,\
    \ whenever such conversion would imply the only to legally evaluate an expression.\
    \ The \"Kong\" expression shown clearly, the object b is converted into a char*,\
    \ and the statement is executed as if it were written this way.\n\n```\nString\
    \ b = a + \"Kong\";\n```\n\nWe therefore can get away with just one operator+\
    \ function.\n\nThere's still a limitation with the way this function is written.\
    \ Because the operator+ function is a member function and not a global function,\
    \ a String object must be the right operand. This means you can't execute statements\
    \ such as the following:\n\n```\nString b = \"My name is \" + a + \"Kong\";\n\
