  md: '*Any function that might be overridden by a subclass should be declared virtual
    and protected (rather private).


    Once a function has been declared virtual, it is virtual in all subclasses. You
    don''t need to apply the keyword again.

    There are a few restrictions:


    +   * Only member functions can be made virtual.

    * Inline functions cannot be made virtual.

    * Constructors cannot be made virtual, although destructors can be.


    It is legal for a subclass to override a function that is not virtual, but by
    doing so creates a risk that in certain contexts, the right function might not
    get called (as we saw with normalize in this discussion). If you think a member
    function might be overridden, make it virtual.


    # Interlude: What Is the Virtual Penalty?


    Although it''s not necessary to know how virtual function calls are implemented
    by C++, it''s useful to understand the trade-off: Virtual functions are more flexible,
    but there is a small penalty to pay. If you''re really certain that a certain
    function will never be overridden, there is no point in making it virtual.


    > The penalty however, is small, in light of the speed and capacity of today''s
    computers. There are actually two penalties: a performance penalty and a space
    penalty.


    When a C++ program executes a standard function call, it does what I outlined
    in Chapter 4: It transfers control of the program to a specific address and returns
    when the function is done. This is a simple action.


    ```

    normalize() {


    }

    ```


    Execution of a virtual function is more involved. Each object contains a hidden
    "vtable" pointer that points to a table of all the virtual functions for its class.
    For example, all objects of FloatFraction contain a vtable pointer to the table
    of virtual functions for FloatFraction (if a class has no virtual functions at
    all, by the way, its objects don''t need to have a vtable pointer, and that saves
    some space).


    To call a virtual function, the program uses the vtable pointer to make an indirect
    function call. This process, looks up the function address at runtime (Remember,
    this is done under the covers and so is completely invisible to the C++ source
    code). You can visualize this action this way:


    ```

    vtable | normalize() {

    | funct1

    | funct2

    an_object | Virtual function table: contains the addresses for the virtual functions
    in a given class

    ```


    Because each object contains a vtable, you can see that the "knowledge," of how
    to carry out an action is inside the object itself. The vtable pointer enables
    each object to point to implementations specific to its own class.


    Clearly, the penalties are slight. The performance penalty arises from the greater
    time required to make an indirect function call (although that is measured in
    microseconds). The space penalty arises from the bytes taken up by the vtable
    pointer and the table itself. The moral: Make a virtual function if there''s any
    chance it will be overridden. The cost is slight.'
