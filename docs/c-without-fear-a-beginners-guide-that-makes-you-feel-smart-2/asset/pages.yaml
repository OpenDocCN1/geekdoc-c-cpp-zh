  md: '# 2. Decisions, Decisions


    Once you know how to do input, output, and data calculations, you are on your
    way to writing real programs. The most useful programs have behavior: the ability
    to respond to conditions.


    Although they don''t have human judgment, computers make simple decisions. That''s
    what this chapter is about. We''ll start looking at short programs. By the end
    of the chapter, you''ll have the tools to write a complete game program!


    # But First, a Few Words about Data Types


    You might think of variable as a magic box or a bucket to hold data. But it can
    hold so much information—information being a precious commodity, it''s not infinite.


    Chapter 1 developed examples using floating-point data. This chapter uses integer
    data, which (unlike floating point) cannot hold fractional portions. You might
    think that you can just use double, the floating-point type, for all situations.
    But it''s very inefficient to use double when you don''t really need it.


    Under the covers, integer and floating-point looks nothing alike. Here''s a value—150—stored
    in different formats, I have made a map of simplifying assumptions here: For example,
    floating-point format uses binary, not decimal, and integer format uses something
    called two''s complement, which I describe in Appendix B. The sign bit, s, is
    0 for positive, and 1 for negative.


    | Integer | 0 | 150 |

    | | value |

    | Floating-point (double) | 2 | 1.50000000 |

    | | exponent | mantissa |


    The range of double is much greater than integer; it can also store fractional
    portions of a number. But it is more taxing on computer resources. However, its
    precision for very integers is limited, and rounding errors can occur.


    So, use the right data type for the job. It is definitely better to use the integer
    format when you''re working with only numbers.


    Here''s the syntax for declaring an int (integer) variable:


    ![](img/a7964e9035b7ca0710b559c70a60c09a_44_0.png)


    ```

    int variable_name;

    ```


    ```

    int variable_name = initial_value;

    ```


    You can also declare multiple int variables:


    ```

    int variable1, variable2, variable3,...

    Each (variable1, variable2, and so on) can be initialized, whether or not the
    others are. For example:

    ```


    ```

    int a = 0, b = 1, c, d, e, f, g = 20;

    ```


    You can assign values between integer and floating-point variables, but if you
    assign a floating-point value to an int, the compiler complains about lost data.


    ```

    int n = 5;

    double n = 3.7;

    // OK: convert 5 to floating-pt

    // Warning: convert from double to int

    // This also gets a warning.

    ```


    If you assign 3.7 to n, the fractional portion, 0,) is dropped, so that the value
    3 is stored in the variable n. But assigning 3.0 is also problematic, because
    of a decimal point (.) causes a value to be stored in floating-point (double)
    format.


    ```

