  md: "# Two Complete OOP Examples\n\nIf you've stayed with me the last three chapters—I\
    \ call them \"object-oriented boot camp\"—then congratulations! I've taken you\
    \ through a number of the subtleties of writing C++ classes, with constructors\
    \ and operator functions.\n\nBut now it's time to have fun with classes! In this\
    \ chapter, we'll use classes to implement a customized linked list and animate\
    \ the Tower of Hanoi puzzle solution from Chapter 4.\n\n# Introducing Linked Lists\n\
    \nWe've been able to use arrays to do quite a lot. With dynamic memory allocation,\
    \ arrays can even be given a size determined at runtime. But there are still limitations:\
    \ Once, the length of an array can't be changed without destroying the array and\
    \ starting over.\n\nA linked list is far more dynamic, because its length can\
    \ continually change. Every time you add another link in the chain, to speak,\
    \ capacity automatically grows...subject only to the limitations of the computer.\
    \ Support for such data structures is one of the reasons C++ has pointers.\n\n\
    > Note\nAlthough the design of a node class is simple, the ins and outs of operating\
    \ lists gets a little tricky, at least with the ordered list in this chapter.\
    \ If you want to avoid this logic and your C++ compiler has STL support, you might\
    \ want to turn to the linked-list example in the next chapter...or go right to\
    \ the animated Tower of Hanoi later in this chapter.\n\n# Node Design\n\nEach\
    \ individual item inside a linked list is called a node. You design a general\
    \ class for the nodes, create nodes as needed by the new keyword, and link them\
    \ together using pointers.\n\nAt minimum, a node needs a data field—which we will\
    \ use to hold a string object—and a pointer to the next node. The class also needs\
    \ a constructor, for ease of use.\n\n```\nclass node {\npublic:\n    string name;\n\
    \    node *next;\n    node(string aName) : name = aName, next = NULL);\n};\n```\n\
    \nAll members are public (remember that class members are private by default).\
    \ We could protect the data. We, for example, make \"name\" private and provide\
    \ access through a \"get\" function, but it's easier for making everything public.\n\
    \nThe second member, \"next,\" might seem:\n\n```\n*next;\n```\n\nWhat's this?\
    \ We're in the middle of the definition for the node class, and here is a member\
    \ that has the same type as the class itself (node)—even though we haven't finished\
    \ defining the it's a pointer.\n\nC++ allows this declaration because it is a\
    \ pointer. The compiler doesn't have to have the complete definition of node yet.\
    \ There is no Alice in Wonderland infinite regress (as is the case of a set containing\
    \ itself, which philosopher Bertrand Russell would argue logically invalid). The\
    \ compiler needs only allocate enough space for a pointer.\n\nThe only constructor\
    \ defined here enables the user to initialize a node by setting the value of \"\
    name.\" The \"next\" member is initialized to NULL.\n\n# C++0x\n\nNote that if\
    \ your compiler supports the C++0x specification, you should use nullptr instead\
    \ of NULL."
