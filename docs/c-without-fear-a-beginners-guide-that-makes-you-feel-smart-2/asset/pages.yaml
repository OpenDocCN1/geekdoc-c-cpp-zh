  md: "# Strongly Typed Enumerations\n\nThe more you program, the more you want to\
    \ get rid of \"magic numbers,\" which are numeric literals that appear in the\
    \ program for no apparent reason. It's much better off using symbolic names.\n\
    \nIn the next section, we're going to build the game of Rock, Paper, Scissors,\
    \ in which two players secretly pick one of three choices—rock, paper, or scissors—and\
    \ then reveal them. Such a program needs a way to store a player's choice.\n\n\
    As a first approach, one might assign the numbers 1, 2, and 3 to the choices.\
    \ Most of the time, the values don't matter. The most important thing (at least\
    \ for now) is that the three numbers used consistently to identify the choices.\n\
    \n```\ncout << \"Enter Rock, Paper, or Scissors: \";ncin >> input_str;\nint c\
    \ = input_str[0];\n\nif (c == 'R' || c == 'r') // 1 = rock\n    player_choice\
    \ = 1;\nelse if (c == 'P' || c == 'p') // 2 = paper\n    player_choice = 2;\n\
    else if (c == 'S' || c == 's') // 3 = scissors\n    player_choice = 3;\n```\n\n\
    The programmer has to remember that 1 means rock, 2 means paper, and 3 means scissors.\
    \ Without comments, this kind of program is nearly incomprehensible. We need to\
    \ get rid of \"magic numbers\" and replace them with meaningful names.\n\nOur\
    \ next attempt at storing this information is to use a series of **define** directives.\n\
    \n```\n#define ROCK 1\n#define PAPER 2\n#define SCISSORS 3\n```\n\nNow we represent\
    \ ROCK as 1, PAPER as 2, and SCISSORS as 3. The code is instantly readable.\n\n\
    ```\nif (comp == ROCK && player == SCISSORS)\ncout << \"Rock smashes scissors.\
    \ We WIN!\" << endl;\n```\n\nThis is a big improvement, but wouldn't it be better\
    \ to automate the assignment of these numbers? C++ allows you to do just that,\
    \ with the **enum** keyword:\n\n```\nenum (rock, paper, scissors);\n```\n\nThe\
    \ effect of this is that rock, paper, and scissors constant assigned values of\
    \ three consecutive integers: 0, 1, and 2 (By default they start at 0). You can\
    \ then assign these values to class and test them as appropriate.\n\n```\nif (c\
    \ == 'R' || c == 'r') c = rock;\nif (comp == ROCK && player == SCISSORS)\ncout\
    \ << \"Rock smashes scissors. We WIN!\" << endl;\n```\n\nIn C++, you can optionally\
    \ define an enumerated typing type name after **enum**. This is a **weak type**:\
    \ you can assign integer values to it but not the other way around. C++ continues\
    \ to support this weak way.\n\n```\nenum Choice {rock, paper, scissors};\nChoose\
    \ your_pick = my_pick = rock;\nint i = my_pick;\nif (my_pick == -1) // Error!\
    \ Requires cast.\nmy_pick = static_cast<Choice>(i); // Ok.\n```\n\n# enum Classes\
    \ in C++\n\nC++ supports a new way of using the **enum** keyword. By combining\
    \ **enum** with **class**, you create not just symbolic names but a new type—and\
    \ this is stronger than the one used for old C++.\n\n```\nenum class Choice {rock,\
    \ paper, scissors};\n```"
