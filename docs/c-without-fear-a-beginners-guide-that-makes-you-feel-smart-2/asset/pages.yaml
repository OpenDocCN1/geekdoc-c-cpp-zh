  md: 'This is possible if we write a constructor that takes a char* string as its
    one argument. With this constructor, it becomes easier to initialize arrays of
    Fraction objects.


    ```

    Fraction arr_of_frac[4] = {"1/2", "1/3", "3/4"};

    ```


    Of course, it would be nice to do it without the quotation marks. But we won''t.
    Without the use of a char string (necessitating the quote marks), C++ would actually
    perform the integer division 1/3 and round it down to 0.


    ```

    Fraction a = 1/3; // This won''t do what we want!

    ```


    So, let''s accept the quotation marks. We''re going to need to access C-string
    functions, that mandates an include directive:


    ```

    #include <cstring>

    ```


    Next, the constructor has to be declared in the Fraction class declaration:


    ```

    Fraction(char* s);

    ```


    OK, that was easy. Writing the function definition is more involved, but don''t
    worry: We''ll decode the code and see how it works.


    ```

    Fraction::Fraction(char* s) {

    t n = 0;

    t d = 1;


    char *p1 = strtok(s, "/ ");

    char *p2 = strtok(NULL, "/ ");

    if (p1 != NULL) {

    t = atoi(p1);

    }

    if (p2 != NULL) {

    d = atoi(p2);

    }

    set(n, d);

    }

    ```


    The first thing this function declares two integer variables and give them reasonable
    defaults: This is essential because we can''t assume the argument has any characters
    at all, or if it does, we don''t know how we get two substrings out of it.


    ```

    int n = 0;

    t d = 1;

    ```


    The default value of d (which will be assigned to the denominator) is 1. This
    will enable the user of the class to initialize Fraction objects:


    ```

    Fraction a = "5"; // Initialize a to 5/1.

    ```


    The next two extract two strings separated by the divide sign (/) or, optionally,
    comma (,).


    ```

    char *p1 = strtok(s, "/ ");

    char *p2 = strtok(NULL, "/ ");

    ```


    Remember that if the strtok function (explained in Chapter 6) can''t get another
    substring from the input string, it returns a null pointer. Therefore, the code
    needs to test whether p1 or p2 are null pointers before passing them to the atoi
    function and finally calling set.


    ```

    if (p1 != NULL) {

    t = atoi(p1);

    }

    if (p2 != NULL) {

    d = atoi(p2);

    }

    set(n, d);

    ```


    Putting this code into the Fraction class and testing it is left as an exercise
    for the reader.


