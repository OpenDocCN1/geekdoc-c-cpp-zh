    \n# Control Structures and Branch Statements\n\nThis section contains a section\
    \ on each of the statements that controls execution in a C++ program.\n\n# The\
    \ if-else Statement\n\nThe **if** statement has two forms. The first form is as\
    \ follows, in which **condition** is an expression that evaluates to true (any\
    \ nonzero value) or false (a zero value):\n\n```\nif (condition)\nstatement\n\
    ```\n\nStandard practice is to use relational expressions (such as **n > 0**),\
    \ which always produce **true** or **false**, or an expression of type **bool**.\
    \ It can also be effective to use a pointer as a condition in C++. If the pointer\
    \ is null (for example, because a file-open attempt failed), the condition equates\
    \ to false; otherwise, it equates to true.\n\nPointers can be converted to NULL\
    \ by logical negation (!), meaning \"not.\" For example, in this case, several\
    \ statements are executed if the file was not successfully opened:\n\n```\nofstream\
    \ fout (silly_file_name);\nif (fout) {\n  cout << \"Could not print \";\n  cout\
    \ << silly_file_name;\n  return -1;\n}\n```\n\nAn **if** statement can have an\
    \ optional **else** clause:\n\n```\nif (condition)\nstatement1\nelse\nstatement2\n\
    ```\n\n# The while Statement\n\nThe **while** statement has the following syntax:\n\
    \n```\nwhile (condition)\nstatement\n```\n\nThe **condition** is a true/false\
    \ expression; so the **if** statement is for rules applying to conditions.\n\n\
    The action of the **while** statement is to first evaluate the **condition**.\
    \ If it is true, the **statement** is executed, and the condition is tested again.\
    \ The cycle continues until **condition** is false or some other action terminates\
    \ the loop, such as **break**.\n\nFor example, the following code fragment prints\
    \ five times:\n\n```\nint n = 5;\nwhile (n-- > 0) {\n  cout << \"Hello.\";\n \
    \ cout << endl;\n}\n```"
