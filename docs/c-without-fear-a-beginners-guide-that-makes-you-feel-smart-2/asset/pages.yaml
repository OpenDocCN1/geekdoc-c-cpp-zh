    # Interlude: Why Two Operators (= and ==)?


    If you''ve used another programming language like Pascal or Basic, you might wonder
    why = and == are two separate operators. After all, Basic uses a single sign (=)
    for both assignment and test-for-equality, using context to tell them apart.


    In C and C++, the following code is freely permitted. It''s almost always wrong.


    ```

    int x, y;

    if (x = y) // ERROR! Assignment!

    cout << "x and y are equal";

    ```


    What this example does assign the value of y to x and use that as the condition.
    If this value is nonzero, it is considered "true." Consequently, if is any value
    other than zero, the previous condition is "true," and the statement is always
    executed


    Here is the correct version, which will do what you want:


    ```

    if (x == y) // CORRECT: test equality

    cout << "x and y are equal";

    ```


    "x = y" is an operation that tests for equality and evaluates as true or false.
    The important thing to remember is not to confuse test-for-equality with assignment
    (x=y).


    Why this potential source of problems? Well, most exceptions in C++ (the main
    exception being void functions) produce a value, and this includes assignment
    (=), which is an expression with a side effect. So, you can initialize three variables
    at once by doing this:


    ```

    x = y = z = 0; // Set all vars to 0.

    ```


    which is equivalent to:


    ```

    x = (y = (z = 0)); // Set all vars to 0.

    ```


    Each assignment, beginning with the right one (z = 0), produces the value that
    was assigned (0), which is then used in the next assignment (y = 0). In other
    words, y is passed along three times, each to a new variable.


    C++ treats "x=y" as an expression that produces a value. And there would be nothing
    wrong with that, except that almost valid numeric expression can be. The compiler
    will not complain if you write this, though it''s usually wrong:


    ```

    if (x = y)

    // (Probably should have used ==)

    ```'
