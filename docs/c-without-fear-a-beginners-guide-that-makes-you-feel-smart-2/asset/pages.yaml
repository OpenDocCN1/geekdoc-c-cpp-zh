  md: 'I don''t use multiple modules in this book for my part, because the examples
    are short. For large software projects, using multiple modules offers big advantages:


    +   - Probably the biggest advantage is that multiple modules support multiple
    programmers. Each programmer can work on their own module.


    +   - The multiple approach provides another way to logically subdivide the program.
    Functions that specialize in number crunching can be placed in one module, while
    another in user-interface functions.


    +   - You can control the degree of communication between modules.


    This last advantage has a connection to object-oriented programming. In older
    languages, such as C, the use of separate modules is the only way to create groups
    of symbols in which some are private and some are public (that is, shared).


    This is useful for large, complex projects. A programmer responsibility for implementing
    public items, but the programmer can also write his own functions, not intended
    to be used by anyone else. The private portion of the module is protected from
    the outside so that the programmer never worry about other programmers calling
    these private functions (or referring to private data) and in the process making
    all kinds of assumptions about how they work.


    The public/private distinction is a way of achieving encapsulation—something I''ll
    explore in upcoming chapters because it is one of the benefits of C++ classes.


    Once you''ve written all the code, each of the modules can be compiled and linked.
    If you set up a project correctly from your development environment, then this
    process of compiling and linking is automated for you.


    ![](img/a7964e9035b7ca0710b559c70a60c09a_161_0.png)


    # Exception Handling: I Take Exception to That!


    Exception handling is the best way to recover from errors cropping up in the middle
    of complex programs, and in commercial applications, it''s often a necessity.
    But in general, this feature will be useful only after you start developing large
    programs.


    With that in, let''s look at C++ exception handling.


    # Say Hello to Exceptions


    So far, we''ve discussed two major kinds of errors:


    +   - Syntax errors, which require you to fix your program code before you can
    successfully compile your program.


    +   - Program-logic errors, which you discover only after compiling the program,
    running, and testing it.


    There''s also a third kind of error—although it can be considered a special case
    of the second category. This third kind of runtime errors, also called exceptions.


    The term refers to an occurrence at runtime that is ''exceptional'' because it
    interrupts the normal flow of the program. The program must respond to the situation,
    exit, or both. Examples include the following:


    +   - Attempt to divide by zero.


    +   - Use of a null pointer in an that requires a valid address.


    +   - Failure to allocate requested memory (if, for example, memory is full).'
