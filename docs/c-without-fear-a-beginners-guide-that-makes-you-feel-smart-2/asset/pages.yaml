    # # Interlude: Recursion vs. Iteration Compared


    The recursive solution for deleting a list is tempting-the code that is shorter.
    But is it more efficient? The truth is, as much as I pushed recursion Chapter
    4, if you have a choice between an iterative and a recursive solution, the iterative
    solution is usually more efficient. In days of super-fast processors, that difference
    may not matter. You may prefer the recursive solution because you want to get
    fewer lines of code. But it''s useful to consider what happens with recursion.


    A recursive solution calls a function at each level. In the linked-list example,
    there''d be one additional function call for each node. And if the list were million
    nodes, the system would have to execute a million function calls!


    When we get into numbers that, function-call overhead becomes expensive. The program
    traverses the list and puts


    ```

    0x1000ff40

    0x1000ff30

    0x1000ff10

    0x1000ff20

    Etc.

    ```


    In contrast, the iterative solution goes through the list and deletes the nodes
    in the order it finds. The recursive solution, in contrast, is a "breadcrumb"
    that leaves a trail of breadcrumbs as it traverses the list (metaphorically speaking)
    and goes back and picks up the crumbs, deleting nodes in process. That''s inefficient.


    Recursion is not only more elegant, but for a certain class of problem, it is
    the only practical solution. The Tower of Hanoi puzzle, which we''ll review shortly,
    would be vastly more difficult to solve without recursion. And the C++ code that
    builds the compiler you''re using now lots of recursive function calls, without
    which it would be far more to write.


