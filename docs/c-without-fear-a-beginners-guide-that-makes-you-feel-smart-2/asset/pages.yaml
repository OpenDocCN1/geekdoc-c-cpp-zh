    # Function Overloading


    Natural languages—particularly English—often employ a word to mean different things
    depending on the context. Think of how many meanings there are for the word fair
    You can go to the fair, enjoy fair weather, and notice which fair-haired people
    are playing fair.


    In computer-programming terminology, this is an example of overloading—loading
    a word with multiple meanings.


    C++ uses overloading as well. But rather than a source of confusion, overloading
    in C++ is precise: You can use a function to work with different types of data.


    Consider the swap function. As with all C++ functions, swap must be declared with
    definite type information.


    ```

    void swap(int *p1, int *p2);

    ```


    The swap function needs to work on one type of data, in C, pointers to int. But
    you might want to swap on other kinds of data.


    One solution—the solution you''d have to use with Basic, and non-object-oriented
    languages—is to write a different version of the function for each type of data,
    adding a naming convention so you never reuse the same name.


    ```

    void swap(int *p1, int *p2);

    void swap(double *p1, double *p2);

    void swap(char *p1, char *p2);

    ```


    This solution works, but it''s clumsy. C++ lets you use one name—swap—with different
    kinds of data, relying on the type in the argument list to keep the versions separate.
    The name swap is used—that is, overloaded—for programmer convenience.


    ```

    void swap(int *p1, int *p2);

    ```'
