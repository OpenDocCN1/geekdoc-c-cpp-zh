  md: "Each subclass is free to implement all services (i.e., pure-virtual functions)\
    \ in any way it wants.\n\nEvery service needs to be implemented, the class cannot\
    \ be instantiated.\n\nEvery class must strictly observe its type-return type and\
    \ the type of each argument. This gives the inheritance discipline that must strictly\
    \ obey actions (the wrong kind of data, for example) is flagged by the compiler.\n\
    \nThe author of a subclass knows that he or she must implement the services defined\
    \ in the interface—such as Repaint, Move, and Load—but within that mandate, he\
    \ or she is free. And because all these are virtual, the correct implementation\
    \ is always executed, no matter how an object is accessed.\n\nI'm about to show,\
    \ I hope, an example of how all of this is useful.\n\n# Object Orientation and\
    \ I/O\n\nThe best simple demonstration of the power of object orientation (OOP)\
    \ may be the way it extends input/output through the stream of the classes.\n\n\
    Once upon a time, there was the C language, which required the use of a library\
    \ function called **printf** if you wanted to print to the console. This function\
    \ had cousins **fprintf** (print to a text file) and **sprintf** (print to a string).\n\
    \n```\nprintf(\"Here's an int: %d\", i); // Print an integer\nprintf(\"Here's\
    \ a float: %f\", x); // Print a double\n```\n\nThe problem with these functions\
    \ is if you create your data type—a Fraction class or complex-number class—there\
    \ is no way to extend **printf** to work with your class because **printf** and\
    \ its cousins have a fixed set of formats (%d, %f, %s, and so on), and can never\
    \ be modified.\n\nYou could, in theory, redefine printf using **define** to intercept\
    \ calls, substitute your own function, and call **printf** through yourself when\
    \ you needed to, but this is a horrendous \"hack,\" requiring massive amounts\
    \ of ugly programming.\n\n# cout Is Extensible Effectively\n\nC++ introduced the\
    \ IO stream classes, but it still supports the old C functions for backward compatibility.\
    \ The classes demonstrate the extensibility of OOP beautifully.\n\nThe C++ specification\
    \ adds this to every feature, enabling you to create user-defined literals as\
    \ in Chapter 13.\n\nAs we saw in Chapter 13, with C++, making a class \"printable\"\
    \ is a matter of writing an **operator<<** function.\n\n```\nostream &operator<<(ostream\
    \ &os, Fraction &fr) {\n  os << fr.num << \"/\" << fr.den;\n}\n```\n\nThis operator\
    \ makes Fractions printable in many contexts—not only with console output (**cout**)\
    \ but also with any string or using\n\n```\nFraction frl(1, 2); // frl = 1/2.\n\
    cout << frl; // Print to console.\nf << \"The value is: \" << frl; // Print to\
    \ file.\n```\n\nSo, in theory, one might say that for any class of object, the\
    \ following statement can be made to work smoothly:\n\n```\ncout << \"The value\
    \ of the object is \" << an_object;\n```\n\n# But cout Is Not Polymorphic\n\n\
    However—although this is not at obvious—stream classes can work with an object\
    \ only if its type is known at compile time. The client code must know all the\
    \ object's class."
