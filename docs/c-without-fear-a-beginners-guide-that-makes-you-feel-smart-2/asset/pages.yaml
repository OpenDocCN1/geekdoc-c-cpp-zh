  md: 'The advantage is you never accidentally declare variables of type Choice. Such
    variables can be set or initialized only to Choice values, name, paper, or scissors.
    Conversion between an enum value to an integer, or vice versa, requires a static_cast
    conversion.


    ```

    Choice comp = Choice::rock;

    Choice player = Choice::paper;

    // Error - not in class Choice!

    Choice y = 1; // Error - not in class Choice!

    Choice me = static_cast<Choice>(0); // Ok, cast used

    int i = Choice::rock; // Error -- requires cast.

    ```


    The first thing you''ll notice about the enum class syntax is that it creates
    a separate namespace. This eliminates a potential source of name conflicts, but
    it means that references to the names must be qualified using the scope operator
    (::).


    ```

    Choice my_move = Choice::rock;

    my_move = Choice::paper; // This is fine.

    my_move = rock; // Error--out of scope.

    ```


    If you want, you can remove the need for the scope operator with a using statement.


    ```

    enum class Choice {rock, paper, scissors };nusing namespace Choice;

    Choice my_move = paper; // Now this is Ok.

    ```


    The simple version of the enum class syntax is as follows:


    ![](img/a7964e9035b7ca0710b559c70a60c09a_178_0.png)


    ```

    enum class type_name {

    symbols};

    ```


    Here, symbols is a list of symbolic names separated by commas. After this declaration,
    type_name can be used just like any C++ type.


    # Extended enum Syntax: Controlling Storage


    The syntax in the previous section is probably sufficient for all of class name
    declarations, but occasionally you may need more control over storage. The full
    syntax is as follows:


    ```

    enum class enumeration_type : storage_type {

    symbols};

    ```


    For example, you can specify that your symbols should be implemented by the C++
    as unsigned long integers:


    ```

    enum class Choice : unsigned long {

    rock

    ```


    Another flexibility of the syntax is that you can optionally specify values for
    the symbols, as follows:


    ```

    enum class Numbers {

    zero,

    ten = 10,

    eleven,

    ```


    ```

    twelve,

    hundred = 100,

    hundred_and_one

    };

    ```


    By default, enumerations start at 0. Otherwise, if not explicitly assigned a value,
    each symbol is assigned the value of the previous symbol plus one. In the example
    I just showed, the symbols would have the values you''d expect.


    ```

    Numbers oceans = Numbers::eleven; // Assign oceans 11

    ```'
