    ;\ncin >> n;\n```\n\nHaving a value for n, the program allocates space for n elements.\n\
    \n```\nint *p = new int[n]; // Allocate n integers\n```\n\nThe pointer p now contains\
    \ the address of the first element. You can use it as a base address for indexing,\
    \ just as you would use an array name. The rest of the code proceeds to do that,\
    \ until the final statement, which uses **delete []** to release all the elements\
    \ allocated by **new**.\n\n```\ndelete [] p; // Release n integers.\n```\n\nNote\
