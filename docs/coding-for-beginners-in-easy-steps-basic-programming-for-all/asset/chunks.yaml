    \ “Too high, try again : “ ) ; }\nelse {\n    System.out.println( “Correct...\
    \ My number is ” + num + “\\n” ) ;\n    flag = false ;\n}\n```\n\n![image](Images/image00407.jpeg)\n\
    \n![image](Images/image00408.jpeg)\n\nThe Java Development Kit (JDK) is needed\
