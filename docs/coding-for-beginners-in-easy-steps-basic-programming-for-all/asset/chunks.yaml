    support for the application


    •Traditionally, a setup script is named setup.py and consists mainly of a call
    to the cx_Freeze setup() function


    •Applications can be deployed on Windows systems using the cx_Freeze tool to create
    a simple installer


    •When a setup script is executed with the bdist_msi command an MSI installer is
    created that will copy the distribution bundle onto the host computer, including
    an executable file


    13


    **Transferring skills**


    *This chapter demonstrates similarities and differences in coding various popular
    programming languages*.


    [**Understanding compilers**](#part0016.xhtml_sec1)


    [**Compiling code**](#part0016.xhtml_sec2)


    [**Coding C**](#part0016.xhtml_sec3)


    [**Coding C++**](#part0016.xhtml_sec4)


    [**Coding C#**](#part0016.xhtml_sec5)


    [**Coding Java**](#part0016.xhtml_sec6)


    [**Summary**](#part0016.xhtml_sec7)


    **Understanding compilers**


    Modern apps are coded in “high-level” languages that provide a high level of abstraction
    between machine code, which is understood by computers, and source code that is
    human-readable. In order to run programs the source code must first be rendered
    into machine code that the computer can execute. This process is accomplished
    either by an “interpreter” or by a “compiler” depending upon the language in which
    the program is written.


    The Python programming language, used for demonstration throughout the previous
    chapters of this book, uses an interpreter to translate program source code. As
    a program proceeds, the interpreter dynamically translates its functions and statement
    code objects into “bytecode”. The bytecode can then be executed via Python’s bytecode
    interpreter (a.k.a “Virtual Machine” or “VM”).


    ![image](Images/image00194.jpeg)


    Often languages that employ an interpreter are referred to as “interpreted languages”
    and those that use a compiler are referred to as ”compiled languages”.


    Other programming languages that employ an interpreter to translate source code
    into bytecode for execution by the computer via their virtual machine include
    Java and Ruby.


    ![image](Images/image00398.jpeg)


    Traditional programming languages, such as the C language, use a compiler to convert
    program source code into machine code. Compilation takes the entire source code
    and first generates intermediate “object code” representing the program’s functions
    and statements in binary machine code format. The compiler then combines the object
    code into a single binary machine code file (.exe) that can be executed directly
    by the computer.


    ![image](Images/image00193.jpeg)


    Notice that the Virtual Machine (VM) must be present on the user’s computer to
    execute those programs written in interpreted languages.


    Other programming languages that employ a compiler to convert source code into
    machine code for direct execution by the computer include C++ (“C plus plus”)
    and C# ( “C sharp”).


    ![image](Images/image00399.jpeg)


    There are, therefore, fundamental differences in the way programs written in “interpreted
    languages”, such as Python, and “compiled languages” such as the C language, are
    executed by the computer. Each offers some advantages and disadvantages in terms
    of performance and portability, as listed in the table below:


    | **Interpreter:** | **Compiler:** |


    | Takes individual code objects as input for *translation* | Takes the entire
    source code as input for *conversion* |


    | *Does not* generate intermediate object code | *Does* generate intermediate
    object code |


    | Executes conditional control statements *slowly* | Executes conditional control
    statements *quickly* |


    | Requires *little* memory as object code is not generated | Requires *more* memory
    as object code is generated |


    | Translates the source code *every time* the program runs | Converts the source
    code *once* during compilation |


    | Reports any errors *immediately* when they occur in a statement | Reports any
    errors only *after* an attempt to compile the entire source code |


    | Programs run *slower* while code objects get individually translated to machine
    code | Programs run *faster* while machine code runs directly on the computer
    |


    | Distributed programs are human-readable source code so are *easy* to modify
    | Distributed programs are compiled machine code so are *difficult* to modify
    |


    | Offers *poorer* protection of intellectual property rights | Programs run *faster*
    while machine code runs directly on the computer |


    ![image](Images/image00215.jpeg)


    Don’t be confused by Java programs. They are “compiled” into bytecode as a distributable
    (.class) file that nonetheless require the Java VM bytecode interpreter to run.


    **Compiling code**


    To more fully understand the compilation process it is useful to examine in detail
    the compilation of a simple C language program. In producing an executable file
    from an original C source code file the compilation process actually undergoes
    four separate stages, which each generate a new file:


    •Preprocessing – the preprocessor stage first substitutes all “preprocessor” directives,
    such as statements to import libraries, with the actual library code. For instance,
    in the C language the library code is substituted for #include import directives.
    The generated file containing the substitutions is in text format and typically
    has a .i file extension


    •Translating – the compiler stage translates the high-level instructions in the
    .i file into low-level Assembly language instructions. The generated file containing
    the translation is in text format and typically has a .s file extension


    •**Assembling** – the assembler stage converts the Assembly language text instructions
    in the .s file into machine code. The generated object file containing the conversion
    is in binary format and typically has a .o file extension


    •**Linking** – the linker stage combines one or more binary object .o files into
    a single executable file. The generated file is in binary format and typically
    has a .exe file extension


    ![image](Images/image00400.jpeg)


    Strictly speaking, “compilation” describes the first three stages above, which
    operate on a single source code text file and ultimately generate a single binary
    object file. Where the program source code contains syntax errors, such as a missing
    statement terminator or a missing parenthesis, they will be reported by the compiler
    and compilation will fail.'
