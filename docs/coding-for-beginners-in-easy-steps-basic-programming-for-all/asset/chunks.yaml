    ![image](Images/image00193.jpeg) You can use `sep` parameter to specify between
    output.


    ## Assigning values


    The assignment operator commonly used in computer programs uses `=` to assign
    a value. The assignment operators used to code Python programs are listed in the
    table below:


    | Operator: | Example: |

    | :--- | :--- |

    | `=` | `a = b` |

    | `+=` | `a += b` |

    | `-=` | `a -= b` |

    | `*=` | `a *= b` |

    | `/=` | `a /= b` |

    | `%=` | `a %= b` |

    | `//=` | `a //= b` |

    | `**=` | `a **= b` |


    In the example above, variable `a` is assigned the value. The `+=` operator is
    useful to add a value onto an existing variable. The `-=` operator subtracts a
    value from an existing variable. The `*=` operator multiplies a value by an existing
    variable. The `/=` operator divides the first variable by the second value. The
    `%=` operator assigns the remainder of the division to the first variable. The
    `//=` operator performs floor division and assigns the result to the first variable.
    The `**=` operator performs exponentiation and assigns the result to the first
    variable. All these other operators work in the same way by making


    ![image](Images/image00193.jpeg) It is important to regard the `=` operator to
    mean “assign” rather than “equals” to avoid confusion with the `==` operator.


