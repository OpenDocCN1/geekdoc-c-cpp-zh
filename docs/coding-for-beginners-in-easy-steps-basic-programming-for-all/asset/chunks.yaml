    Variable containers that you create in your code to store data within a program
    can be given any name of your choosing – providing you do not use any of the programming
    language keywords, such as the Python keywords in the table above, and the name
    adheres to the naming rules listed in the table below:


    | Naming rule: | Example: |

    | :--- | :--- |

    | CANNOT contain any keywords | `True` |

    | CANNOT contain arithmetic operators | `a+b*c` |

    | CANNOT contain symbols | `%$#@!` |

    | CANNOT contain any spaces | `no spaces` |

    | CANNOT start with a number | `2bad` |

    | CAN contain numbers elsewhere | `good1` |

    | CAN contain letters of mixed case | `UPdown` |

    | CAN contain underscores | `is_ok` |


