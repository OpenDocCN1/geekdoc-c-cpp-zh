    \ |\n| **width** | 以字符数为单位的按钮宽度，或图像的像素 |\n| **wraplength** | 文本换行的长度 |\n\n![image](img/image00194.jpeg)\n\
    \n你还可以调用按钮的 `invoke()` 方法，继而调用指定给其 `command` 选项的函数。\n\n分配给其他选项的值决定了部件的外观。可以通过向部件的\
