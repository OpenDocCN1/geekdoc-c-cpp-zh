    **Programming objects**


    *This chapter demonstrates how to code virtual objects into your programs*.


    [**Defining classes**](#part0013.xhtml_sec1)


    [**Copying instances**](#part0013.xhtml_sec2)


    [**Addressing properties**](#part0013.xhtml_sec3)


