    ## Programming objects


    *This chapter demonstrates how to code virtual objects into your programs*.


    - [Defining classes](#part0013_1)

    - [Copying instances](#part0013_2)

    - [Addressing properties](#part0013_3)

    - [Deriving classes](#part0013_4)

    - [Overriding methods](#part0013_5)

    - [Applying sense](#part0013_6)

    - [Summary](#part0013_7)


    ### Defining classes


    The real-world objects that surround us each have attributes and behaviors we
    can describe. For example, a car might be described with a color attribute “red”
    and an “acceleration” behavior. Programming objects are like virtual representations
    of real-world objects that describe.


    A “class” is a prototype describing a set of properties that characterize an object.
    Each class has a data structure that can contain both functions and variables.
    The properties of a class are referred to as its data “members”. Class function
    members are known as “methods”, and class variable members (declared within a
    class but outside any method definitions) are known as its “attributes”. Class
    members can be referenced throughout a program using dot notation, suffixing the
    member name after the class name, with syntax of `class-name.method-name()` or
    `class-name.attribute-name`.


    ![image](Images/image00336.jpeg)


    A class declaration begins with the `class` keyword, followed by a programmer-specified
    name (adhering to the usual naming conventions but beginning in uppercase) then
    a `:` colon. Next come indented statements, optionally specifying a class document
