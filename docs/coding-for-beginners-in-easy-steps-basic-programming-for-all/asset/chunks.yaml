    \ r’\\n’ )** |\n| :--- | :--- | :--- |\n| **‘‘ ‘‘‘** | **Docstring – describe\
    \ a module, function, class, or method** | **def sum( a,b ) : ‘‘‘ Add Args ‘‘‘**\
    \ |\n\n![image](Images/image00215.jpeg)\n\nThe membership operators perform a\
    \ case-sensitive match, so `‘A’ in ‘abc’` will fail.\n\nThe `[ ]` slice operator\
    \ and `[ :]` range slice operator recognize that a string is simply a list containing\
    \ an individual character within each list element, which can be referenced by\
    \ their index number.\n\nSimilarly, the `in` and `not in` membership operators\
    \ iterate through each element seeking to match the specified character.\n\nThe\
    \ raw string operator `r` (or uppercase `R`) must be placed immediately before\
    \ the opening quote mark to suppress escape characters in the string and is useful\
    \ when the string contains the backslash character.\n\n![image](Images/image00215.jpeg)\n\
    \nThe Range Slice returns the string up to, but not including, the final specified\
    \ index position.\n\nA “docstring” is a descriptive string literal that occurs\
    \ as the first statement in a module, a function, a class, or a method definition.\
    \ This should be enclosed within triple single quote marks. Uniquely, the docstring\
    \ becomes the `__doc__` special attribute of that object, so can be referenced\
    \ using its name and dot-suffixing. All modules should normally have docstrings,\
    \ and all functions and classes exported by a module should also have docstrings.\n\
    \n![image](Images/image00188.jpeg)\n\n### manipulate.py\n\n![image](Images/image00225.jpeg)Start\
    \ a new program by defining a simple function that includes a docstring description\n\
    \n```python\ndef display( s ) :\n    ‘‘’Display an argument value.’’’\n    print(\
    \ s )\n```\n\n![image](Images/image00226.jpeg)Next, add a statement to display\
    \ the function description\n\n```python\ndisplay( display.doc )\n```\n\n![image](Images/image00227.jpeg)Now,\
    \ add a statement to display a raw string value that contains the backslash character\n\
    \n```python\ndisplay( r’C:\\Program Files’ )\n```\n\n![image](Images/image00228.jpeg)Then,\
    \ add a statement to display a concatenation of two string values that include\
    \ an escape character and a space\n\n```python\ndisplay( ‘\\nHello’ + ‘ Python’\
    \ )\n```\n\n![image](Images/image00231.jpeg)Next, add a statement to display a\
    \ slice of a specified string within a range of element index numbers\n\n```python\n\
    display( ‘Python In Easy Steps\\n’ [ 7 : ] )\n```\n\n![image](Images/image00232.jpeg)Finally,\
    \ display the results of seeking characters within a specified string\n\n```python\n\
    display( ‘P’ in ‘Python’ )\ndisplay( ‘p’ in ‘Python’ )\n```\n\n![image](Images/image00240.jpeg)Save\
    \ then run the program – to see manipulated strings get displayed\n\n![image](Images/image00325.jpeg)\n\
    ![image](Images/image00193.jpeg)\n\nRemember that strings must be enclosed within\
    \ either single quote marks or double quote marks.\n\n![image](Images/image00194.jpeg)\n\
    \nWith range slice, if the start index number is omitted zero is assumed and if\
    \ the end index number is omitted the string length is assumed.\n\n### Formatting\
    \ strings\n\nThe Python built-in `dir()` function can be useful to examine the\
    \ names of functions and variables defined in a module by specifying the module\
    \ name within its parentheses. Interactive mode can easily be used for this purpose\
    \ by importing the module name then calling the `dir()` function. The example\
    \ below examines the “dog” module created [here](#part0009.xhtml_page_82) in [Chapter\
    \ Six](#part0009.xhtml):\n\n![image](Images/image00326.jpeg)\n![image](Images/image00194.jpeg)\n\
    \nNotice that the `__doc__` attribute introduced in the previous example appears\
    \ listed here by the `dir()` function.\n\nThose defined names that begin and end\
    \ with a double underscore are Python objects, whereas the others are programmer-defined.\
    \ The `__builtins__` module can also be examined using the `dir()` function, to\
    \ reveal the names of functions and variables defined by default, such as the\
    \ `print()` function and a `str` object.\n\nThe `str` object defines several useful\
    \ functions for string formatting, including an actual `format()` function that\
    \ performs replacements. A string to be formatted by the `format()` function can\
    \ contain both text and “replacement fields” marking places where text is to be\
    \ inserted from an ordered comma-separated list of values. Each replacement field\
    \ is denoted by `{ }` braces, which may optionally contain the index number position\
    \ of the replacement in the list.\n\n![image](Images/image00193.jpeg)\n\nDo not\
    \ confuse the `str` object described here with the `str()` function that converts\
    \ values to the string data type.\n\nStrings may also be formatted using the C-style\
    \ `%s` substitution operator to mark places in a string where text is to be inserted\
    \ from a comma-separated ordered list of values.\n\n![image](Images/image00188.jpeg)\n\
    \n### format.py\n\n![image](Images/image00225.jpeg)Start a new program by initializing\
    \ a variable with a formatted string\n\n```python\nsnack = ‘{} and {}’.format(\
    \ ‘Burger’ , ‘Fries’ )\n```\n\n![image](Images/image00226.jpeg)Next, display the\
    \ variable value to see the text replaced in their listed order\n\n```python\n\
    print( ‘\\nReplaced:’ , snack )\n```\n\n![image](Images/image00227.jpeg)Now, assign\
    \ a differently formatted string to the variable\n\n```python\nsnack = ‘{1} and\
    \ {0}’.format( ‘Burger’ , ‘Fries’ )\n```\n\n![image](Images/image00228.jpeg)Then,\
    \ display the variable value again to see the text now replaced by their specified\
    \ index element value\n\n```python\nprint( ‘Replaced:’ , snack )\n```\n\n![image](Images/image00231.jpeg)Assign\
    \ another formatted string to the variable\n\n```python\nsnack = ‘%s and %s’ %\
    \ ( ‘Milk’ , ‘Cookies’ )\n```\n\n![image](Images/image00232.jpeg)Finally, display\
    \ the variable value once more to see the text substituted in their listed order\n\
    \n```python\nprint( ‘\\nSubstituted:’ , snack )\n```\n\n![image](Images/image00240.jpeg)Save\
    \ then run the program – to see formatted strings get displayed\n\n![image](Images/image00327.jpeg)\n\
    ![image](Images/image00215.jpeg)You cannot leave spaces around the replacement\
    \ field.\n\n![image](Images/image00194.jpeg)Other data types can be substituted\
    \ using `%d` for a decimal integer, `%c` for a character, and `%f` for a floating-point\
    \ number.\n\n### Modifying strings\n\nThe `str` object has many useful functions\
    \ that can be dot-suffixed to its name for modification of the string and to examine\
    \ its contents. Most commonly used string modification functions are listed in\
    \ the table below together with a brief description:\n\n| **Method:** | **Description:**\
    \ |\n| :--- | :--- |\n| `capitalize()` | Change string’s first letter to uppercase\
    \ |\n| `title()` | Change all first letters to uppercase |\n| `upper()` `lower()`\
    \ `swapcase()` | Change the case of all letters to uppercase, to lowercase, or\
    \ to the inverse of the current |\n| `join(seq)` | Merge string into separator\
    \ seq |\n| `lstrip()` `rstrip()` `strip()` | Remove leading whitespace, trailing\
    \ whitespace, or both leading and trailing respectively |\n| `replace(old, new)`\
    \ | Replace all occurrences of *old* with *new* |\n| `ljust(w, c)` `rjust(w, c)`\
    \ | Pad string to right or left respectively to total width *w* with character\
    \ *c* |\n| `center(w, c)` | Pad string each side to total width *w* with character\
    \ *c* ( default is space ) |\n| `count(sub)` | Return the number of occurrences\
    \ of *sub* |\n| `find(sub)` | Return the index number of the first occurrence\
    \ of *sub* or return -1 if not found |\n| `startswith(sub)` `endswith(sub)` |\
    \ Return True if *sub* is found at start or end respectively – otherwise return\
    \ False |\n| `isalpha()` `isnumeric()` `isalnum()` | Return True if all characters\
    \ are letters only, are numbers only, are letters or numbers only – otherwise\
    \ return False |\n| `islower()` `isupper()` `istitle()` | Return True if string\
    \ characters are lowercase, uppercase, or all first letters are uppercase only\
    \ – otherwise return False |\n| `isspace()` | Return True if string contains only\
    \ whitespace – otherwise return False |\n"
