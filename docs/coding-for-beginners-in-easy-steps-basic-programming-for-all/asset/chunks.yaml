    **Manipulating strings**


    String values can be manipulated in a Python program using the various operators
    listed in the table below:


    | **Operator:** | **Description:** | **Example:** |


    | **+** | **Concatenate – join strings together** | **‘Hello’ + ‘Mike’** |


    | ***** | **Repeat – multiply the string** | **‘Hello’ * 2** |


    | **[ ]** | **Slice – select a character at a specified index position** | **‘Hello’
    [0]** |


    | **[ : ]** | **Range Slice – select characters in a specified index range** |
    **‘Hello’ [ 0 : 4 ]** |


    | **in** | **Membership Inclusive – return True if character exists in the string**
    | **‘H’ in ‘Hello’** |


    | **not in** | **Membership Exclusive – return True if character doesn’t exist
    in string** | **‘h’ not in ‘Hello’** |'
