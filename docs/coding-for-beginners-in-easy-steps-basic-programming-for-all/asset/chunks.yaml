    \nPython 字典有一个 `keys()` 方法，可以在字典名后加上点 `.` 后缀，返回该字典中所有键的列表，顺序是随机的。如果你希望键按字母和数字顺序排序，只需将该语句括在\
    \ Python `sorted()` 函数的括号内即可。\n\n可以使用 Python 的 `in` 运算符对字典进行搜索，检查其是否包含特定键，语法为\
    \ `key in dictionary`。当在指定的字典中找到键时，搜索将返回布尔值 `True`，否则返回 `False`。\n\n字典是 Python\
    \ 编程中可用的最后一种数据容器类型。总而言，各种类型如下：\n\n- **变量（Variable）** – 存储单个值\n- **列表（List）** –\
    \ 在有序索引数组中存储多个值\n- **元组（Tuple）** – 在序列中存储多个固定值\n- **集合（Set）** – 在无序集合中存储多个唯一值\n\
    - **字典（Dictionary）** – 存储多个无序的键值对\n\n![image](img/image00194.jpeg)\n\n数据经常以键值对的形式关联——例如，当你提交\
    \ Web 表单时，在输入字段中输入的文本值通常与该文本字段的名称作为键关联。\n\n![image](img/image00188.jpeg)\n\ndict.py\n\
    \n![image](img/image00257.jpeg)通过初始化字典启动新程序，然后显示其数据类类型和其键值内容\n\n```\ninfo = {\
    \ ‘name’ : ‘Bob’ , ‘ref’ : ‘Python’ , ‘sys’ : ‘Win’ }\nprint( ‘info:’ , type(\
    \ info ) )\nprint( ‘Dictionary:’ , info )\n```\n\n![image](img/image00258.jpeg)接下来，通过键显示引用的单个值\n\
    \n```\nprint( ‘\\nReference:’ , info[ ‘ref’ ] )\n```\n\n![image](img/image00259.jpeg)现在，显示字典中的所有键\n\
    \n```\nprint( ‘\\nKeys’ , info.keys() )\n```\n\n![image](img/image00260.jpeg)从字典中删除一个对并添加一个替换对，然后显示新的键值内容\n\
    \n```\ndel info[ ‘name’ ]\ninfo[ ‘user’ ] = ‘Tom’\nprint( ‘\\nDictionary:’ , info\
    \ )\n```\n\n![image](img/image00261.jpeg)最后，在字典中搜索特定键并显示搜索结果\n\n```\nprint( ‘\\\
    nIs There A name Key?:’ ,’name’ in info )\n```\n\n![image](img/image00262.jpeg)保存文件并运行此程序——查看字典的键和值\n\
    \n![image](img/image00268.jpeg)\n\n![image](img/image00215.jpeg)\n\n注意，字符串内的引号必须由反斜杠转义字符引导——防止字符串被提前终止。\n\
    \n## 总结\n\n- 可以使用一系列 `=` 赋值在单个语句中初始化多个变量\n- Python 列表是一个数组，可以在从零开始的顺序元素中存储多个数据项\n\
    - 存储在列表元素中的数据可以通过列表名后跟 `[]` 中的索引来引用\n- 列表元素可以有多个索引来表示多个维度，例如 `X` 和 `Y`\n- 列表变量有许多方法，可以在列表名后加上点\
    \ `.` 后缀进行操作\n- `len()` 函数返回指定列表的长度\n- 通过向 `del` 关键字指定列表名和元素编号可以删除单个列表元素\n- Python\
    \ 元组是一个不可变列表，其值可以通过“序列”赋值给单个变量\n- 存储在元组元素中的数据可以通过元组名后跟 `[]` 中的索引来引用\n- Python\
    \ 集合是唯一元素的有序集合，其值可以通过其方法进行比较和操纵\n- 存储在集合中的数据不能通过其索引引用\n- 集合变量有方法，可以在列表名后加上点 `.`\
    \ 后缀进行比较\n- Python 内置 `in` 运算符可在集合中查找值\n- 集合可以使用 `list()` 转换为普通列表，允许通过索引引用元素\n\
    - Python 字典是一个键值对列表，其中每个键必须是唯一的\n- 存储在字典元素中的数据可以通过字典名后跟 `[]` 中的键来引用\n\n## 5 控制结构\n\
    \n本章演示了如何控制程序的流程。\n\n- 分支选择\n- 计数循环\n- 循环条件\n- 跳过循环\n- 捕获错误\n- 总结\n\n### 分支选择\n\
    \n与许多编程语言一样，Python 的 `if` 关键字执行基础条件测试，评估给定的表达式是否为布尔值 `True` 或 `False`。这允许程序根据测试结果向不同的方向运行，被称为“条件分支”。\n\
    \n在 Python 中，测试表达式后面必须紧跟一个冒号 `:`，然后是测试成功时要执行的语句，这些语句写在下方的新行，且每行必须相对于 `if` 测试缩进。缩进的大小并不重要，但每行必须保持相同。因此语法看起来如下：\n\
    \n```\nif test-expression :\n    statements-to-execute-when-test-expression-is-True\n\
    ```\n\n![image](img/image00269.jpeg)\n\n`if: elif: else:` 序列是其他语言中 `switch` 或\
    \ `case` 语句的等价物。`if` 测试可以通过附加 `else` 关键字来提供测试失败时执行的备用语句。`else` 关键字必须后跟冒号 `:` 并与\
    \ `if` 关键字对齐，但其语句必须缩进，因此语法如下：\n\n```\nif test-expression :\n    statements-to-execute-when-test-expression-is-True\n\
    else :\n    statements-to-execute-when-test-expression-is-False\n```\n\n`if` 测试块可以使用\
    \ `elif` 关键字（else if）跟随另一个测试，提供在测试成功时执行的语句。这同样必须与 `if` 关键字对齐，后跟一个冒号 `:`。然后可以添加最终的\
    \ `else` 关键字来提供测试失败时的备用语句。完整的 `if-elif-else` 结构语法如下：\n\n```\nif test-expression-1\
    \ :\n    statements-to-execute-when-test-expression-1-is-True\nelif test-expression-2\
    \ :\n    statements-to-execute-when-test-expression-2-is-True\nelse :\n    statements-to-execute-when-test-expressions-are-False\n\
    ```\n\n![image](img/image00215.jpeg)\n\n代码的缩进在 Python 中非常重要，因为它向解释器标识代码块——其他编程语言使用如\
    \ `{}` 括号。\n\n![image](img/image00188.jpeg)\n\nif.py\n\n![image](img/image00270.jpeg)通过用户输入整数值初始化变量启动新程序\n\
    \n```\nnum = int( input( ‘Please Enter A Number: ‘ ) )\n```\n\n![image](img/image00271.jpeg)接下来，测试变量并显示相应的响应\n\
    \n```\nif num > 5 :\n    print( ‘Number Exceeds 5’ )\nelif num < 5 :\n    print(\
    \ ‘Number is Less Than 5’ )\nelse :\n    print( ‘Number Is 5’ )\n```\n\n![image](img/image00272.jpeg)现在，再次使用两个表达式测试变量，并仅在成功时显示响应\n\
    \n"
