    ![image](img/image00272.jpeg)保存文件并运行程序——你会看到每个小 Label 现在都显示省略号，并且“Reset”（重置）按钮已禁用


    ![image](img/image00385.jpeg)


    ![image](img/image00193.jpeg)


    按钮状态通过 `tkinter` 的常量 `DISABLED`（禁用）、`NORMAL`（正常）或 `ACTIVE`（激活）来识别。


    ## 添加功能


    在上一页中创建了初始化动态属性的代码后，你现在可以添加运行时功能，以响应程序执行期间对 `Button` 组件的点击。


    ![image](img/image00188.jpeg)


    `lotto.py`


    ![image](img/image00270.jpeg)通过在最后一个循环语句之前插入一个新部分来修改上一页的程序，该部分通过从 `random` 模块引入
    `sample()` 函数。


    ### # 动态属性：


    ```python

    from random import sample

    ```


    ![image](img/image00271.jpeg)接下来，定义一个函数，生成并为小 Label 分配六个唯一的随机数，并反转两个按钮的状态。


    ```python

    def pick() :

    nums = sample( range( 1, 49 ), 6 )

    label1.configure( text = nums[0] )

    label2.configure( text = nums[1] )

    label3.configure( text = nums[2] )

    label4.configure( text = nums[3] )

    label5.configure( text = nums[4] )

    label6.configure( text = nums[5] )

    getBtn.configure( state = DISABLED )

    resBtn.configure( state = NORMAL )

    ```


    ![image](img/image00272.jpeg)现在，定义一个函数在每个小 Label 上显示省略号并将并将按钮恢复到初始状态。


    ```python

    def reset() :

    label1.configure( text = ‘...’ )

    label2.configure( text = ‘...’ )

    label3.configure( text = ‘...’ )

    label4.configure( text = ‘...’ )

    label5.configure( text = ‘...’ )

    label6.configure( text = ‘...’ )

    getBtn.configure( state = NORMAL )

    resBtn.configure( state = DISABLED )

    ```


    ![image](img/image00273.jpeg)然后，添加语句指定在用户按下每个按钮时调用的相关函数。


    ```python

    getBtn.configure( command = pick )

    resBtn.configure( command = reset )

    ```


    ![image](img/image00276.jpeg)最后，保存文件——完整的程序应该像下面所示。


    ![image](img/image00386.jpeg)


    ![image](img/image00194.jpeg)


    这些步骤提供的功能与此处的控制台应用程序的功能相当。


    ![image](img/image00193.jpeg)


    将所有 `import` 语句放在脚本开头是习惯，但它们可以像此处所示出现在任何位置。


    ## 测试程序


    在完成了上一页的程序计划后，所需的组件和功能现在已添加到应用程序中——因此它就可以进行测试了。


    ![image](img/image00270.jpeg)启动应用程序并检查其初始外观。


    ![image](img/image00387.jpeg)


    静态文本出现在窗口标题栏和 `Button` 组件上，窗口的缩放按钮被禁用，小 Label 包含它们的初始省略号文本，且“Reset”按钮处于初始禁用状态。


    ![image](img/image00271.jpeg)接下来，点击“Get My Lucky Numbers”（获取我的幸运数字）按钮组件——执行 `pick()`
    函数中的所有语句。


    ![image](img/image00388.jpeg)


    显示了一系列指定范围内的数字，按钮状态已按要求更改——在应用程序重置之前，无法生成另一系列数字。


    ![image](img/image00272.jpeg)记录下第一系列中生成的数字，以便稍后比较。


    ![image](img/image00193.jpeg)


    任何序列中都没有重复数字，因为随机 `sample()` 函数返回的是一个唯一的随机整数集合。


    ![image](img/image00273.jpeg)点击“Reset”按钮组件——执行 `reset()` 函数中的所有语句，并查看应用程序按要求恢复到初始外观。


    ![image](img/image00389.jpeg)


    ![image](img/image00276.jpeg)再次点击“Get My Lucky Numbers”按钮组件——再次执行其 `pick()` 函数并确认新的系列数字与第一系列不同。


    ![image](img/image00390.jpeg)


    ![image](img/image00277.jpeg)最后，重启应用程序并再次点击“Get My Lucky Numbers”按钮组件——确认第一系列数字与应用程序上次运行时的第一系列数字不同。


    ![image](img/image00391.jpeg)


    ![image](img/image00193.jpeg)


    每次启动应用程序时生成的数字都不会重复，因为随机生成器是用当前系统时间种子的——每次生成器被调用时时间都是不同的。


