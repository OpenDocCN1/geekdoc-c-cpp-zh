    **Assigning values**


    The assignment operator commonly used in coding computer programs simply uses
    a = symbol to assign a value to a variable. Optionally, this may be combined with
    an arithmetical operator to perform arithmetic and assignment in one single operation.


    The assignment operators used to code Python programs are listed in the table
    below together with the operation they perform:


    | **Operator:** | **Example:** | **Equivalent:** |


    | **=** | **a = b** | **a = b** |


    | **+=** | **a += b** | **a = ( a + b )** |


    | **-=** | **a -= b** | **a = ( a - b )** |


    | ***=** | **a *= b** | **a = ( a * b )** |


    | **/=** | **a /= b** | **a = ( a / b )** |


    | **%=** | **a %= b** | **a = ( a % b )** |


    | **//=** | **a //= b** | **a = ( a // b )** |


    | ****=** | **a **= b** | **a = ( a ** b )** |


    In the example above, variable a is assigned the value contained in variable b
    – so that becomes the new value in the a variable.


