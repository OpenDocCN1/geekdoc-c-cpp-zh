    the program runs.


    A custom Python function is created using the def (definition) keyword followed
    by a name of your choice and ( ) parentheses. The coder can choose any name for
    a function except the keywords of the programming language and the name of an
    existing built-in function. This line must end with a : colon character, then
    the statements to be executed whenever the function gets called must appear on
    lines below and indented. Syntax of a function definition, therefore, looks like
    this:


    **def *function-name* ( ) :**


    ***statements-to-be-executed


    statements-to-be-executed***


    ![image](Images/image00286.jpeg)


    Function statements must be indented from the definition line by the same amount
    so the Python interpreter can recognize the block.


    Once the function statements have been executed, program flow resumes at the point
    directly following the function call. This modularity is very useful in programming
    to isolate set routines so they can be called upon repeatedly.


    To create custom functions it is necessary to understand the accessibility (“scope”)
    of variables in a program:


    •Variables created outside functions can be referenced by statements inside functions
    – they have “global” scope


    •Variables created inside functions cannot be referenced from outside the function
    in which they have been created – these have “local” scope


    The limited accessibility of local variables means that variables of the same
    name can appear in different functions without conflict.


    ![image](Images/image00215.jpeg)


    Avoid using global variables in order to prevent accidental conflict – use only
    local variables where possible.


    If you want to coerce a local variable to make it accessible elsewhere it must
    first be declared with the Python global keyword followed by its name only. It
    may subsequently be assigned a value that can be referenced from anywhere in the
    program. Where a global variable and a local variable have the same name, the
    function will use the local version.


    ![image](Images/image00188.jpeg)


    def.py


