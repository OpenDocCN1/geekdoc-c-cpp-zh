    \ add the loop to capture this window’s events\n\n`window.mainloop()`\n\n![image](Images/image00368.jpeg)Save\
    \ the file then run the program – to see the image on the Label, Button, Text\
    \ and Canvas widgets\n\n![image](Images/image00374.jpeg)\n\n![image](Images/image00215.jpeg)\n\
    \nNotice that the `Text` method is `image_create()` but the `Canvas` method is\
    \ `create_image()` – similar yet different.\n\n![image](Images/image00194.jpeg)\n\
    \n`Text` and `Canvas` widgets are both powerful and flexible – discover more online\
    \ at `[docs.python.org/3.3/library/tkinter.html](http://docs.python.org/3.3/library/tkinter.html)`\n\
    \n## Summary\n\n- The `tkinter` module can be imported into a Python program to\
    \ provide attributes and methods for windowed applications\n- Every `tkinter`\
    \ program must begin by calling `Tk()` to create a window and call its `mainloop()`\
    \ method to capture events\n- The window object’s title is specified by its `title()`\
    \ method\n- A `label` widget is created by specifying the name of its parent container\
    \ and its text as arguments to the `Label()` constructor\n- Widgets can be added\
    \ to an application using the `pack()`, `grid()` or `place()` geometry managers\n\
    - A `button` widget is created by specifying the name of its parent container,\
    \ its text, and the name of a function to call when the user pushes it, as arguments\
    \ to the `Button()` constructor\n- The `tkinter.messagebox` module can be imported\
    \ into a Python program to provide attributes and methods for message boxes\n\
    - Message boxes that ask the user to make a choice return a value to the program\
    \ for conditional branching\n- The `Frame()` constructor creates a container in\
    \ which multiple widgets can be grouped for better positioning\n- The `Entry()`\
    \ constructor creates a single line text field whose current contents can be retrieved\
    \ by its `get()` method\n- Items are added to a `Listbox` object by its `insert()`\
    \ method and retrieved by specifying their index number to its `get()` method\n\
    - `Radiobutton` and `Checkbutton` objects store values in the `StringVar` or `IntVar`\
    \ object nominated by their variable attribute\n- The `PhotoImage()` constructor\
    \ creates an image object that has a `sample()` method which can scale down the\
    \ image\n- Images can be added to `Button` and `Label` objects, embedded in `Text`\
    \ objects, and painted on `Canvas` objects\n\n12\n\n## Developing apps\n\n*This\
    \ chapter brings together elements from previous chapters to develop a windowed\
    \ application*.\n\n- [Generating randoms](#part0015.xhtml_sec1)\n- [Planning needs](#part0015.xhtml_sec2)\n\
    - [Designing layout](#part0015.xhtml_sec3)\n- [Assigning statics](#part0015.xhtml_sec4)\n\
    - [Loading dynamics](#part0015.xhtml_sec5)\n- [Adding functionality](#part0015.xhtml_sec6)\n\
    - [Testing programs](#part0015.xhtml_sec7)\n- [Deploying applications](#part0015.xhtml_sec8)\n\
    - [Summary](#part0015.xhtml_sec9)\n\n## Generating randoms\n\nThe graphical application\
    \ developed on subsequent pages of this book will generate six random numbers\
    \ within a specific range. Initially, its functionality can be developed as a\
    \ console application then transferred later to illustrate how it can be applied\
    \ to graphical widget components.\n\nThe standard Python library has a `random`\
    \ module that provides methods to generate pseudo-random numbers. The current\
    \ system time is used by default to “seed” the random generator whenever it gets\
    \ initialized – so it does not repeat its selections.\n\nA pseudo-random floating-point\
    \ number from 0.0 to 1.0 can be generated by calling the `random()` method from\
    \ the `random` module. The range of generated numbers can be modified using the\
    \ `*` multiplication operator to specify a maximum value and can be rounded down\
    \ to integer values using the built-in `int()` function. For example, to generate\
    \ an integer within the range of zero to nine:\n\n```\nint( random.random() *\
    \ 10 )\n```\n\nOr to generate a whole number within the range of 1 to 10:\n\n\
    ```\nint( random.random() * 10 ) + 1\n```\n\n![image](Images/image00215.jpeg)\n\
    \nFloating-point numbers cast from the `float` data type to the `int` data type\
    \ by the built-in `int()` function get truncated at the decimal point.\n\nThis\
    \ statement could be used in a loop to generate multiple random integers within\
    \ a given range but any number may be repeated in that output – there is no guaranteed\
    \ uniqueness. Instead, multiple unique random integers within a given range can\
    \ be generated by the `sample()` method from the `random` module. This requires\
    \ two arguments to specify the range and the number of unique integers to be returned.\
    \ It is convenient to use the built-in `range()` function to specify a maximum\
    \ value. For example, to generate six unique numbers within the range of 1 to\
    \ 9:\n\n```\nrandom.sample( range( 10 ) , 6 )\n```\n\nOr to generate six unique\
    \ numbers within the range of 1 to 10:\n\n```\nrandom.sample( range( 1 , 11 )\
    \ , 6 )\n```\n\nThis technique could represent a random lottery entry by choosing,\
    \ say, six unique numbers between 1 and 49.\n\n![image](Images/image00193.jpeg)\n\
    \nThe `range()` function can specify start and end values. If no starting value\
    \ is supplied, zero is assumed by default.\n\n![image](Images/image00188.jpeg)\n\
    \nsample.py\n\n![image](Images/image00270.jpeg)\n\nStart a new program by importing\
    \ two functions from “random” module\n\n```\nfrom random import random , sample\n\
    ```\n\n![image](Images/image00271.jpeg)\n\nNext, assign a random floating-point\
    \ number to a variable then display its value\n\n```\nnum = random()\nprint('Random\
    \ Float 0.0-1.0 : ', num)\n```\n\n![image](Images/image00272.jpeg)\n\nNow, multiply\
    \ the floating-point number and cast it to an integer then display its value\n\
    \n```\nnum = int( num * 10 )\nprint('Random Integer 0 - 9 : ', num)\n```\n\n![image](Images/image00273.jpeg)\n\
    \nAdd a loop to assign multiple random integers to a list, then display the list\n\
    \n```\nnums = [] ; i = 0\nwhile i < 6 :\n    nums.append( int( random() * 10 )\
    \ + 1 )\n    i += 1\nprint('Random Integers 1-10 : ', nums)\n```\n\n![image](Images/image00276.jpeg)\n\
    \nFinally, assign unique random integers to the list then display the list\n\n\
    ```\nnums = sample( range( 1, 49 ) , 6 )\nprint('Random Sample 1 - 49 : ', nums)\n\
    ```\n\n![image](Images/image00277.jpeg)Save the file then run the program several\
    \ times – to see the generated numbers\n\n![image](Images/image00375.jpeg)\n\n\
    The `random.sample()` function returns a list but does not actually replace any\
    \ elements in the specified range.\n\n![image](Images/image00194.jpeg)\n\n## Planning\
    \ needs\n\nWhen creating a new graphical application it is useful to first spend\
    \ some time planning its design. Clearly define the program’s precise purpose,\
    \ decide what application functionality will be required, then decide what interface\
    \ widgets will be needed.\n\n![image](Images/image00376.jpeg)\n\nA plan for a\
    \ simple application to pick numbers for a lottery entry might look like this:\n\
    \n**Program purpose**\n\n- The program will generate a series of six random numbers\
    \ in the range 1-49 and have the ability to be reset\n\n**Functionality required**\n\
    \n- A function to generate and display six unique random numbers\n- A function\
    \ to clear the last six random numbers from display\n\n**Interface widgets needed**\n\
    \n- One non-resizable window to contain all other widgets and to display the application\
    \ title.\n- One Label widget to display a static application logo image – just\
    \ to enhance the appearance of the interface.\n- Six Label widgets to dynamically\
    \ display the generated series of unique random numbers – one number per Label.\n\
    - One Button widget to generate and display the numbers in the Label widgets when\
    \ this Button gets clicked. This Button will not be enabled when the numbers are\
    \ on display.\n- One Button widget to clear the numbers on display in the Label\
    \ widgets when this Button gets clicked. This Button will not be enabled when\
    \ the numbers are not on display.\n\nHaving established a program plan means you\
    \ can now produce the application basics by creating all the necessary widgets.\n"
