    \n`for in` 循环按照项在序列中出现的顺序对任何列表或字符串的项进行迭代，但不能直接指定迭代次数、停止条件或迭代步长。然而，你可以使用 Python\
    \ 的 `range()` 函数，通过在括号内指定一个数值结束值来遍历数字序列。这将生成一个从零开始并持续到（但不包含）指定结束值的序列。例如，`range(5)`\
    \ 生成 `0,1,2,3,4`。\n\n可选地，你可以在 `range()` 函数的括号内指定开始值和结束值，并用逗号分隔。例如，`range(1,5)`\
    \ 生成 `1,2,3,4`。此外，你可以在 `range()` 函数的括号内以逗号分隔列表的形式指定开始值、结束值和步长。例如，`range(1,14,4)`\
    \ 生成 `1,5,9,13`。\n\n你可以在 Python `enumerate()` 函数的括号内指定列表名称，以显示每个元素的索引数字及其关联的值。\n\
    \n![image](img/image00193.jpeg)\n\n`range()` 函数可以生成递减（倒计时）的序列，也可以生成向上计数的序列。\n\n\
    当同时遍历多个列表时，可以通过在 Python 的 `zip()` 函数的括号内将列表名称作为逗号分隔的列表，将每个列表中相同索引的元素值显示在一起。\n\n\
    当遍历字典时，你可以使用字典的 `items()` 方法并为 `for` 关键字指定两个逗号分隔的变量名——一个用于键名，另一个用于值——来显示每个键及其关联的值。\n\
    \n![image](img/image00188.jpeg)\n\nfor.py\n\n![image](img/image00270.jpeg)通过初始化普通列表、固定元组列表和关联字典列表来启动新程序\n\
    \n```python\nchars = [ ‘A’ , ‘B’, ‘C’ ]\nfruit = ( ‘Apple’ , ‘Banana’ , ‘Cherry’\
    \ )\ninfo = { ‘name’ : ’Mike’ , ‘ref’ : ’Python’ , ‘sys’ : ’Win’ }\n```\n![image](img/image00271.jpeg)接下来，添加语句显示所有列表元素值\n\
    \n```python\nprint( ‘Elements: \\t’ , end = ‘ ‘ )\nfor item in chars :\n    print(\
    \ item , end = ‘ ‘ )\n```\n![image](img/image00272.jpeg)现在，添加语句显示所有列表元素值及其对应的索引号\n\
    \n```python\nprint( ‘\\nEnumerated:\\t’ , end = ‘ ‘ )\nfor item in enumerate(\
    \ chars ) :\n    print( item , end = ‘ ‘ )\n```\n![image](img/image00273.jpeg)然后，添加语句显示所有列表和元组元素\n\
    \n```python\nprint( ‘\\nZipped: \\t’ , end = ‘ ‘ )\nfor item in zip( chars , fruit\
    \ ) :\n    print( item , end = ‘ ‘ )\n```\n![image](img/image00276.jpeg)最后，添加语句显示所有字典键名和关联元素值\n\
    \n```python\nprint( ‘\\nPaired:’ )\nfor key , value in info.items() :\n    print(\
    \ key , ‘=’ , value )\n```\n![image](img/image00277.jpeg)保存并运行程序 – 查看循环迭代显示的项\n\
    \n![image](img/image00278.jpeg)\n\n![image](img/image00194.jpeg)\n\n在编程术语中，任何包含多个可以遍历的项的内容被称为“可迭代的”（iterable）。\n\
    \n### 循环条件\n\n`while` 循环是在条件表达式为 `True` 时重复的代码段。`while` 关键字后面跟着测试表达式和一个冒号 `:`。循环内部执行的语句需要缩进。只要测试表达式为\
    \ `True`，循环就会继续——直到测试表达式变为 `False`，此时循环结束。\n\n在 Python 编程中，`True` 和 `False` 以大写字母开头。\n\
    \n必须观察代码块的缩进，就像这个产生斐波那契数列的示例一样：\n\n![image](img/image00193.jpeg)\n\n与其他语言不同，交互式解释器在等待你的更多代码时会自动缩进。\n\
    \n![image](img/image00188.jpeg)\n\nwhile.py\n\n通过初始化计数器变量并使用该变量作为测试表达式定义外部循环来启动新程序\n\
    \n```python\ni = 1\nwhile i < 4 :\n    print( ‘Outer Loop Iteration:’ , i )\n\
    \    i += 1\n```\n![image](img/image00271.jpeg)接下来，添加缩进语句显示计数的值并在循环每次迭代中对其递增\n\
    \n![image](img/image00272.jpeg)现在（仍缩进）初始化第二个计数器变量并使用该变量作为测试表达式定义内部循环\n\n```python\n\
    \    j = 1\n    while j < 4 :\n        print( ‘\\tInner Loop Iteration:‘ , j )\n\
    \        j += 1\n```\n![image](img/image00273.jpeg)最后，添加进一步缩进的语句显示此计数器的值并在每次迭代中对其递增\n\
    \n从内部循环打印的内容相对于外部循环通过 **\\t** 制表符进行了缩进。\n\n循环可以嵌套（一个在另一个内部），允许在外部循环的每次迭代中完整执行内部循环。计数器变量可以在循环定义之前初始化起始值，包含在测试表达式中，并在每次迭代中递增，直到测试失败。\n\
    \n![image](img/image00276.jpeg)保存并运行此程序 – 查看每次迭代显示的输出\n\n![image](img/image00280.jpeg)\n\
    \n"
- fmt: "\nThe Python `break` keyword can be used to prematurely terminate a loop when\
    \ a specified condition is met. The `break` statement is situated inside the loop\
    \ statement block and is preceded by a test expression. When the test returns\
    \ `True`, the loop ends immediately and the program proceeds on to the next task.\
    \ For example, in a nested inner loop it proceeds to the next iteration of the\
    \ outer loop.\n\n![image](Images/image00188.jpeg)\n\n`nest.py`\n\n![image](Images/image00270.jpeg)Start\
    \ a new program with a statement creating a loop that iterates three times\n\n\
    ```python\nfor i in range( 1, 4 ) :\n```\n\n![image](Images/image00271.jpeg)Next,\
    \ add an indented statement creating a “nested” inner loop that also iterates\
    \ three times\n\n```python\nfor j in range( 1, 4 ) :\n```\n\n![image](Images/image00272.jpeg)Now,\
    \ add a further-indented statement in the inner loop to display the counter numbers\
    \ (of both the outer loop and the inner loop) on each iteration of the inner loop\n\
    \n```python\nprint( ‘Running i=’ + i + ‘ j=’ + j )\n```\n\n![image](Images/image00273.jpeg)Save\
    \ then run this program – to see the counter values on each loop iteration\n\n\
    ![image](Images/image00281.jpeg)\n\n![image](Images/image00194.jpeg)\n\nCompare\
    \ these nested `for` loops with the nested `while` loops example [here](#part0008.xhtml_page_67).\n\
    \n![image](Images/image00188.jpeg)\n\n`break.py`\n\n![image](Images/image00276.jpeg)Insert\
    \ a break statement at the start of the inner loop to break from that loop – then\
    \ run the program again\n\n```python\nif i == 2 and j == 1 :\n    print( ‘Breaks\
    \ inner loop at i=2 j=1’ )\n    break\n```\n\n![image](Images/image00282.jpeg)\n\
    \nThe Python `continue` keyword can be used to skip a single iteration of a loop\
    \ when a specified condition is met. The `continue` statement is situated inside\
    \ the loop statement block and is preceded by a test expression. When the test\
    \ returns `True`, that one iteration ends and the program proceeds to the next\
    \ iteration.\n\n![image](Images/image00277.jpeg)Now, insert a `continue` statement\
    \ at the start of the inner loop block to skip the first iteration of that loop\
    \ – then run the program once more\n\n```python\nif i == 1 and j == 1 :\n    print(\
    \ ‘Continues inner loop at i=1 j=1’ )\n    continue\n```\n\n![image](Images/image00283.jpeg)\n\
    \n![image](Images/image00193.jpeg)\n\nThe `break` statement halts all three iterations\
    \ of the inner loop when the outer loop runs it for the second time.\n\n![image](Images/image00188.jpeg)\n\
    \n`continue.py`\n\n![image](Images/image00193.jpeg)\n\nThe `continue` statement\
    \ skips the first iteration of the inner loop when the outer loop first runs it.\n\
    \n### Catching errors\n\nSections of a program in which it is possible to anticipate\
    \ errors, such as those handling user input, can typically be enclosed in a `try\
    \ except` block to handle “exception errors”. The statements to be executed are\
    \ grouped in a `try:` block and exceptions are passed to the ensuing `except:`\
    \ block for handling. Optionally, this may be followed by a `finally:` block containing\
    \ statements to be executed after exceptions have been handled.\n\nPython recognizes\
    \ many built-in exceptions such as the `NameError` which occurs when a variable\
    \ name is not found, the `IndexError` which occurs when trying to address a non-existent\
    \ list index, and the `ValueError` which occurs when a built-in operation or function\
    \ receives an inappropriate value.\n\nEach exception returns a descriptive message\
    \ that can usefully assigned to a variable with the `as` keyword. This can then\
    \ be used to display the nature of the exception when it occurs.\n\n![image](Images/image00188.jpeg)\n\
    \n`try.py`\n\n![image](Images/image00270.jpeg)Start a new program by initializing\
    \ a variable with a string value\n\n```python\ntitle = ‘Coding for Beginners In\
    \ Easy Steps’\n```\n\n![image](Images/image00271.jpeg)Next, add a try statement\
    \ block that attempts to display the variable value – but specifies the name incorrectly\n\
    \n```python\ntry :\n    print( titel )\n```\n\n![image](Images/image00272.jpeg)Now,\
    \ add an except statement block to display an error message when a `NameError`\
    \ occurs\n\n```python\nexcept NameError as msg :\n    print( msg )\n```\n\n![image](Images/image00273.jpeg)Save\
    \ then run the program – to see how the error gets handled\n\n![image](Images/image00284.jpeg)\n\
    \n![image](Images/image00194.jpeg)\n\nIn some programming languages this structure\
    \ is known as try-catch exception handling.\n\nMultiple exceptions can be handled\
    \ by specifiying their type as a comma-separated list in parentheses within the\
    \ `except` block:\n\n```python\nexcept ( NameError , IndexError ) as msg :\n \
    \   print( msg )\n```\n\nYou can also compel the interpreter to report an exception\
    \ by using the `raise` keyword to specify the type of exception to be recognized\
    \ and a custom descriptive message in parentheses.\n\n![image](Images/image00188.jpeg)\n\
    \n`raise.py`\n\n![image](Images/image00270.jpeg)Start a new Python script by initializing\
    \ a variable with an integer value\n\n```python\nday = 32\n```\n\n![image](Images/image00271.jpeg)Next,\
    \ add a try statement block that tests the variable then specifies an exception\n\
    \n```python\ntry :\n    if day > 31 :\n        raise ValueError(Invalid Day’ )\n\
    ```\n\n![image](Images/image00272.jpeg)Now, add an except statement block to display\
    \ a message when a `ValueError` occurs\n\n```python\nexcept ValueError as msg\
    \ :\n    print( ‘The found An’ , msg )\n```\n\n![image](Images/image00273.jpeg)Then,\
    \ add a finally statement to specify statements to be executed\n\n```python\n\
    finally :\n    print( ‘But Today Is Beautiful.’ )\n```\n\n![image](Images/image00276.jpeg)Save\
    \ then run the program – to see the raised error handled\n\n![image](Images/image00281.jpeg)\n\
    \n![image](Images/image00193.jpeg)\n\nStatements in the `try` block are all executed\
    \ unless an exception occurs.\n\n#### Summary\n\n- The `if` keyword performs a\
    \ conditional test on an expression for a Boolean value of `True` or `False`\n\
    - Conditional branching provides alternatives to an `if` test with `else` and\
    \ `elif` keywords\n- Python tested expressions must be followed by a `:` character\
    \ and statement blocks be indented from the test line\n- A `for in` loop iterates\
    \ over each item in a specified list or string\n- Python `for in` loop statements\
    \ must be followed by a `:` character and statement blocks be indented from the\
    \ statement\n- The `range()` function generates a numerical sequence that can\
    \ be used to specify the length of a `for in` loop\n- The `enumerate()` function\
    \ can specify the name of a list to display each element index and its stored\
    \ value\n- The `zip()` function can display the stored values of the same index\
    \ number in multiple lists\n- A `while` loop repeats while an initial test expression\
    \ remains `True` and ends when that test expression becomes `False`\n- Python\
    \ while loop statements must be followed by a ` `:` character and statement blocks\
    \ be indented from the statement\n- The value of a counter variable can be tested\
    \ in a test expression to control the number of loop iterations\n- The `break`\
    \ keyword can be used to test an expression for a `True` value and immediately\
    \ exit a loop when the test returns `False`\n- The `continue` keyword can be used\
    \ to test an expression for a `True` value and exit a single iteration when the\
    \ test returns `False`\n- Anticipated runtime exception errors can be handled\
    \ by enclosing statements in a `try except` block\n- Optionally, a `finally` statement\
    \ can be used to specify statements to be executed after exceptions have been\
    \ handled\n"
  raw: 'The Python break keyword can be used to prematurely terminate a loop when
    a specified condition is met. The break statement is situated inside the loop
    statement block and is preceded by a test expression. When the test returns True,
    the loop ends immediately and the program proceeds on to the next task. For example,
    in a nested inner loop it proceeds to the next iteration of the outer loop.


    ![image](Images/image00188.jpeg)


    nest.py


    ![image](Images/image00270.jpeg)Start a new program with a statement creating
    a loop that iterates three times


    **for i in range( 1, 4 ) :**


    ![image](Images/image00271.jpeg)Next, add an indented statement creating a “nested”
    inner loop that also iterates three times


    **for j in range( 1, 4 ) :**


    ![image](Images/image00272.jpeg)Now, add a further-indented statement in the inner
    loop to display the counter numbers (of both the outer loop and the inner loop)
    on each iteration of the inner loop


    **print( ‘Running i=’ + i + ‘ j=’ + j )**


    ![image](Images/image00273.jpeg)Save then run this program – to see the counter
    values on each loop iteration


    ![image](Images/image00281.jpeg)


    ![image](Images/image00194.jpeg)


    Compare these nested **for** loops with the nested **while** loops example [here](#part0008.xhtml_page_67).


    ![image](Images/image00188.jpeg)


    break.py


    ![image](Images/image00276.jpeg)Insert a break statement at the start of the inner
    loop to break from that loop – then run the program again


    **if i == 2 and j == 1 :**


    **print( ‘Breaks inner loop at i=2 j=1’ )**


    **break**


    ![image](Images/image00282.jpeg)


    The Python continue keyword can be used to skip a single iteration of a loop when
    a specified condition is met. The continue statement is situated inside the loop
    statement block and is preceded by a test expression. When the test returns True,
    that one iteration ends and the program proceeds to the next iteration.


    ![image](Images/image00277.jpeg)Now, insert a **continue** statement at the start
    of the inner loop block to skip the first iteration of that loop – then run the
    program once more


    **if i == 1 and j == 1 :**


    **print( ‘Continues inner loop at i=1 j=1’ )**


    **continue**


    ![image](Images/image00283.jpeg)


    ![image](Images/image00193.jpeg)


    The **break** statement halts all three iterations of the inner loop when the
    outer loop runs it for the second time.


    ![image](Images/image00188.jpeg)


    continue.py


    ![image](Images/image00193.jpeg)


    The **continue** statement skips the first iteration of the inner loop when the
    outer loop first runs it.


    **Catching errors**


    Sections of a program in which it is possible to anticipate errors, such as those
    handling user input, can typically be enclosed in a try except block to handle
    “exception errors”. The statements to be executed are grouped in a try : block
    and exceptions are passed to the ensuing except : block for handling. Optionally,
    this may be followed by a finally : block containing statements to be executed
    after exceptions have been handled.


    Python recognizes many built-in exceptions such as the NameError which occurs
    when a variable name is not found, the IndexError which occurs when trying to
    address a non-existent list index, and the ValueError which occurs when a built-in
    operation or function receives an inappropriate value.


    Each exception returns a descriptive message that can usefully be assigned to
    a variable with the as keyword. This can then be used to display the nature of
    the exception when it occurs.


    ![image](Images/image00188.jpeg)


    try.py


    ![image](Images/image00270.jpeg)Start a new program by initializing a variable
    with a string value


    **title = ‘Coding for Beginners In Easy Steps’**


    ![image](Images/image00271.jpeg)Next, add a try statement block that attempts
    to display the variable value – but specifies the name incorrectly


    **try :**


    **print( titel )**


    ![image](Images/image00272.jpeg)Now, add an except statement block to display
    an error message when a NameError occurs


    **except NameError as msg :**


    **print( msg )**


    ![image](Images/image00273.jpeg)Save then run the program – to see how the error
    gets handled


    ![image](Images/image00284.jpeg)


    ![image](Images/image00194.jpeg)


    In some programming languages this structure is known as try-catch exception handling.


    Multiple exceptions can be handled by specifiying their type as a comma-separated
    list in parentheses within the except block:


    **except ( NameError , IndexError ) as msg :**


    **print( msg )**


    You can also compel the interpreter to report an exception by using the raise
    keyword to specify the type of exception to be recognized and a custom descriptive
    message in parentheses.


    ![image](Images/image00188.jpeg)


    raise.py


    ![image](Images/image00270.jpeg)Start a new Python script by initializing a variable
    with an integer value


    **day = 32**


    ![image](Images/image00271.jpeg)Next, add a try statement block that tests the
    variable value then specifies an exception and custom message


    **try :**


    **if day > 31 :**


    **raise ValueError( ‘Invalid Day Number’ )**


    **# More statements to execute get added here**.


    ![image](Images/image00272.jpeg)Now, add an except statement block to display
    an error message when a ValueError occurs


    **except ValueError as msg :**


    **print( ‘The Program found An’ , msg )**


    ![image](Images/image00273.jpeg)Then, add a finally statement block to display
    a message after the exception has been handled succesfully


    **finally :**


    **print( ‘But Today Is Beautiful Anyway.’ )**


    ![image](Images/image00276.jpeg)Save then run the program – to see the raised
    error get handled


    ![image](Images/image00285.jpeg)


    ![image](Images/image00193.jpeg)


    Statements in the try block are all executed unless or until an exception occurs.


    **Summary**


    •The if keyword performs a conditional test on an expression for a Boolean value
    of True or False


    •Conditional branching provides alternatives to an if test with the else and elif
    keywords


    •Python tested expressions must be followed by a : colon character and statement
    blocks be indented from the test line


    •A for in loop iterates over each item in a specified list or string


    •Python for in loop statements must be followed by a : colon character and statement
    blocks be indented from the statement


    •The range() function generates a numerical sequence that can be used to specify
    the length of a for in loop


    •The enumerate() function can specify the name of a list to display each element
    index number and its stored value


    •The zip() function can display the stored values of the same index number in
    multiple lists


    •A while loop repeats while an initial test expression remains True and ends when
    that test expression becomes False


    •Python while loop statements must be followed by a : colon character and statement
    blocks be indented from the statement


    •The value of a counter variable can be tested in a test expression to control
    the number of loop iterations


    •The break keyword can be used to test an expression for a True value and immediately
    exit a loop when the test returns False


    •The continue keyword can be used to test an expression for a True value and exit
    a single iteration when the test returns False


    •Anticipated runtime exception errors can be handled by enclosing statements in
    a try except block


    •Optionally, a finally statement can be used to specify statements to be executed
    after exceptions have been handled


    •Python try, except, and finally statements must be followed by a : colon and
    statement blocks be indented from the statement


    6


