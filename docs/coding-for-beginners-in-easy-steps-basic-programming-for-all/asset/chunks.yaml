    **from Polygon import ***


    **class Rectangle( Polygon ) :**


    **def area( self ) :**


    **return self.width * self.height**


    ![image](Images/image00188.jpeg)


    Triangle.py


    ![image](Images/image00243.jpeg)Now, create another class file that declares a
    derived class with a method to return manipulated class variable values


    **from Polygon import ***


    **class Triangle( Polygon ) :**


    **def area( self ) :**


    **return ( self.width * self.height ) / 2**


    ![image](Images/image00244.jpeg)Save the three class files then start a new program
    by making features of both derived classes available


    **from Rectangle import ***


    **from Triangle import ***


    ![image](Images/image00245.jpeg)Next, create an instance of each derived class


    **rect = Rectangle()**


    **trey = Triangle()**


    ![image](Images/image00246.jpeg)Now, call the class method inherited from the
    base class, passing arguments to assign to the class variables


    **rect.set_values( 4 , 5 )**


    **trey.set_values( 4 , 5 )**


    ![image](Images/image00247.jpeg)Finally, display the result of manipulating the
    class variables inherited from the base class


    **print( ‘Rectangle Area:’ , rect.area() )**


    **print( ‘Triangle Area:’ , trey.area() )**


    ![image](Images/image00248.jpeg)Save then run the program – to see output get
    displayed using inherited features


    ![image](Images/image00346.jpeg)


    ![image](Images/image00188.jpeg)


    inherit.py


    ![image](Images/image00194.jpeg)


    A class declaration can derive from more than one class by listing multiple base
    classes in the parentheses after its name in the declaration.


    ![image](Images/image00215.jpeg)


    Don’t confuse class instances and derived classes – an instance is a copy of a
    class, whereas a derived class is a new class that inherits properties of the
    base class from which it is derived.


    **Overriding methods**


    A method can be declared in a derived class to override a matching method in the
    base class – if both method declarations have the same name and the same number
    of listed parameters. This effectively hides the base class method as it becomes
    inaccessible unless it is called explicitly, using the base class name for identification.


    Where a method in a base class supplies a default parameter value this can be
    used in an explicit call to the base method or alternative values can be supplied
    by overriding methods.


    ![image](Images/image00188.jpeg)


    Person.py


    ![image](Images/image00241.jpeg)Create a new class file that declares a base class
    with a initializer method to set an instance variable and a second method to display
    that variable value


    **class Person :**


    **‘‘’A base class to define Person properties.’’’**


    **def __init__( self , name ) :**


    **self.name = name**


    **def speak( self , msg = ‘(Calling The Base Class)’ ) :**


    **print( self.name , msg )**


    ![image](Images/image00188.jpeg)


    Man.py


    ![image](Images/image00242.jpeg)Next, create a class file that declares a derived
    class with a method that overrides the second base class method


    **from Person import ***


    **‘‘’A derived class to define Man properties.’’’**


    **class Man( Person ) :**


    **def speak( self , msg ) :**


    **print( self.name , ‘:\n\tHello!’ , msg )**


    ![image](Images/image00188.jpeg)


    Hombre.py


    ![image](Images/image00243.jpeg)Now, create another class file that also declares
    a derived class with a method that once again overrides the same method in the
    base class


    **from Person import ***


    **‘‘’A derived class to define Hombre properties.’’’**


    **class Hombre( Person ) :**


    **def speak( self , msg ) :**


    **print( self.name , ‘:\n\tHola!’ , msg )**


    ![image](Images/image00188.jpeg)


    override.py


    ![image](Images/image00244.jpeg)Save the three class files then start a new program
    by making features of both derived classes available


    **from Man import ***


    **from Hombre import ***


    ![image](Images/image00245.jpeg)Next, create an instance of each derived class,
    initializing the “name” instance variable attribute


    **guy_1 = Man( ‘Richard’ )**


    **guy_2 = Hombre( ‘Ricardo’ )**


    ![image](Images/image00246.jpeg)Now, call the overriding methods of each derived
    class, assigning different values to the “msg” parameter


    **guy_1.speak( ‘It\’s a beautiful evening.\n’ )**


    **guy_2.speak( ‘Es una tarde hermosa.\n’ )**


    ![image](Images/image00247.jpeg)Finally, explicitly call the base class method,
    passing a reference to each derived class – but none for the “msg” variable so
    its default value will be used


    **Person.speak( guy_1 )**


    **Person.speak( guy_2 )**


    ![image](Images/image00248.jpeg)Save then run the program – to see output from
    overriding and base class methods


    ![image](Images/image00347.jpeg)


    ![image](Images/image00348.jpeg)


    Man – Richard


    Hombre – Ricardo


    ![image](Images/image00193.jpeg)


    The method declaration in the derived class must exactly match that in the base
    class to override it.


    **Applying sense**


    The three cornerstones of Object Oriented Programming (OOP) are encapsulation,
    inheritance, and polymorphism. Examples earlier in this chapter have demonstrated
    how data can be encapsulated within a Python class, and how derived classes inherit
    the properties of their base class. This example introduces the final cornerstone
    principle of polymorphism.


    The term “polymorphism” (from Greek, meaning “many forms”) describes the ability
    to assign a different meaning, or purpose, to an entity according to its context.


    ![image](Images/image00349.jpeg)'
