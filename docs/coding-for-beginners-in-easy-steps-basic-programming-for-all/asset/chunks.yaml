    *c* ( default is space ) |


    | **count( *sub* )** | Return the number of occurrences of *sub* |


    | **find( *sub* )** | Return the index number of the first occurrence of *sub*
    or return -1 if not found |


    | **startswith( *sub* ) endswith( *sub* )** | Return True if *sub* is found at
    start or end respectively – otherwise return False |


