    **Summary**


    •An algorithm is a well-defined sequence of instructions to perform a specific
    task


    •Each algorithm takes one or more values as input and produces one or more resulting
    values as output


    •An algorithm may be created in code as a function whose statements define a sequence
    of instructions to perform a task


    •The efficiency of sorting algorithms may depend upon the nature of the list to
    be sorted


    •A sorting algorithm function can make a copy of a list passed as input and return
    a sorted copy of that list as output


    •There are several popular algorithms to sort array lists in place but each have
    their own strengths and weaknesses


    •Selection Sort algorithms repeatedly select the lowest element in the unsorted
    section of an array list and move it to the end of the sorted section of that
    array


    •Insertion Sort algorithms repeatedly take the next element in the unsorted section
    of an array list and insert it into the sorted section of that array at the correct
    position


    •Bubble Sort algorithms repeatedly compare adjacent elements in an unsorted array
    list and swap them into the correct order


    •Selection Sort, Insertion Sort, and Bubble Sort are simple comparison algorithms
