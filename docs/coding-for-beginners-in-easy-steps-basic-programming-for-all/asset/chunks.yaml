    ## Summary


    - Functions are defined using the `def` keyword followed by a name of your choice
    and `()` parentheses.

    - A function definition line must end with a `:` colon character and its block
    of statements to execute when the function gets called must be indented below
    that line.

    - Variables with global scope can be referenced from anywhere within that program.

    - Variables with local scope can only be referenced from within the function in
    which they are declared.

    - A local variable can be coerced to make it globally accessible by first declaring
    it using the `global` keyword.

    - Function parameters are special variables for use only within a function, and
    arguments are data values passed to parameters.

    - Parameters are declared as a comma-separated list within the parentheses of
    a function definition.

    - Function calls must supply argument data for each function parameter unless
    a default value is specified in their declaration.

    - Data passed to parameters in a function call must appear in the same order as
    the parameters unless their names are specified.

    - Optionally, the `return` keyword can be used within a function to return a value
    to the caller.

    - Functions can be stored in modules that are named as the file name without the
    `.py` file extension.

    - An `import` statement makes module functions available in a program by dot-suffixing
    their name after the module name.

    - Internally, each Python module has its own symbol table so like-named functions
    in different modules do not conflict.

    - A `from` import statement makes module functions available in a program without
    the need to dot-suffix their name.

    - An `import *` statement can be used to import a module’s functions into the
    program’s own symbol table.


