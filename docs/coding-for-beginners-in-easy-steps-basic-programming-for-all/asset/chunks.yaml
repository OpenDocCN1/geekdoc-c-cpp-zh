    that evaluates an expression for a True or False condition then returns one of
    two specified values depending on the result of the evaluation. A ?: ternary operator
    has this syntax:


    **( *test-expression* ) ? *if-true-return-this* : *if-false-return-this***


    Unlike other programming languages, Python does not have a ?:


    ternary operator but has instead a “conditional expression” that works in a similar
    way using if and else keywords with this syntax:


    ***if-true-return-this* if ( *test-expression* ) else *if-false-return-this***


    Although the conditional expression syntax can initially appear confusing it is
    well worth becoming familiar with this expression as it can execute powerful program
    branching with minimal code. For example, to branch when a variable is not a value
    of one:


    ***if-true-do-this* if ( var != 1 ) else *if-false-do-this***


    The conditional expression can be used in Python programming to assign the maximum
    or minimum value of two variables to a third variable. For example, to assign
    a minimum like this:


    **c = a if ( a < b ) else b**'
