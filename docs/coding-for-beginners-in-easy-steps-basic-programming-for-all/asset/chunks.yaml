    # 总结


    ## 列表


    某些编程语言允许声明变量时不赋初始值，但在 Python 编程中，变量必须在声明语句中分配一个初始值（初始化）——否则解释器将报告“未定义”（not defined）错误。


    可以使用一系列 `=` 赋值在单个语句中为多个变量初始化相同的公共值。例如，同时为三个变量分配一个公共值：


    `a = b = c = 10`


    ![image](img/image00255.jpeg)


    或者，也可以使用逗号作为分隔符在单个语句中为多个变量初始化不同的值。例如，同时为三个变量分配不同的值：


    `a , b , c = 1 , 2 , 3`


    普通变量只能存储单项数据，不同，数组变量可以存储多个数据项。在 Python 中，这些被称为“列表”（list）变量。数据按顺序存储在列表“元素”中，索引从零开始计数。因此，第一个值存储在元素
    0 中，第二个值存储在元素 1 中，依此类推。数组列表的创建方式与其他任何变量类似，但它是通过在方括号内分配逗号分隔的列表值来初始化的。例如，创建一个名为“nums”的列表：


    `nums = [ 0 , 1 , 2 , 3 , 4 , 5 ]`


    可以使用列表名后跟包含该元素索引的方括号来引用单个列表元素。这意味着 `nums[1]` 引用的是示例中的第二个元素——而不是第一个元素。由于元素编号从零开始，其第一个元素通过
    `nums[0]` 引用。


    ![image](img/image00256.jpeg)


    列表可以有多个索引——表示多个维度，而不是普通列表的单维度。具有三个及更多索引的多维列表并不常见，但二维列表对于存储基于网格的信息（如 X,Y 坐标）非常有用。


    字符串字符串值列表甚至可以被视为多维列表，因为每个字符串本身都是字符列表。因此，每个字符都可以通过其在特定字符串内的索引号来引用。


    ![image](img/image00188.jpeg)


    `list.py`


    ![image](img/image00257.jpeg)通过初始化一个包含三个字符串值元素的列表来启动一个新程序


    `quarter = [ ‘January’ , ‘February’ , ‘March’ ]`


    ![image](img/image00258.jpeg)接下来，添加语句单独显示每个列表元素中包含的值


    ```

    print( ‘First Month :’ , quarter[0] )

    print( ‘Second Month :’ , quarter[1] )

    print( ‘Third Month :’ , quarter[2] )

    ```


    ![image](img/image00259.jpeg)添加一条语句创建一个两个元素的二维维列表，这些元素本身也是列表，每个列表都包含三个整数值的元素


    `coords = [ [ 1 , 2 , 3 ] , [ 4 , 5 , 6 ] ]`


    ![image](img/image00260.jpeg)现在，添加语句显示两个特定内部列表元素中包含的值


    ```

    print( ‘\nTop Left 0,0 :’ , coords[0][0] )

    print( ‘Bottom Right 1,2 :’ , coords[1][2] )

    ```


    ![image](img/image00261.jpeg)最后，添加一条语句只显示字符串值中的一个字符


    ```

    print( ‘\nSecond Month First Letter :’ , quarter[1][0] )

    ```


    ![image](img/image00262.jpeg)保存并运行程序——看到列表元素值被显示


    ![image](img/image00263.jpeg)


    ![image](img/image00194.jpeg)


    字符串索引也可以是负数——以便从右侧开始计数，其中 -1 最后一个字母。


    ![image](img/image00193.jpeg)


    在本章后面介绍的循环结构通常用于遍历列表元素。


    ## 修改列表


    列表变量可以包含多个数据项，在 Python 编程中被广泛使用，并有各种函数“方法”，这些方法可以通过“点后缀”的形式附加在列表名后来进行操作：


    | 列表方法: | : |

    | :--- | :--- |

    | `list.append(x)` | 将项 `x` 添加到列表末尾 |

    | `list.extend(L)` | 将列表 `L` 中的所有项添加到列表末尾 |

    | `list.insert(i,x)` | 在索引位置 `i` 处插入项 `x` |

    | `list.remove(x)` | 从列表中删除第一个项 `x` |

    | `list.pop(i)` | 索引位置 `i` 处的项并返回它 |

    | `list.index(x)` | 返回列表中第一个项 `x` 的索引位置 |

    | `list.count(x)` | 返回 `x` 在列表中出现的次数 |

    | `list.sort()` | 原地排序所有列表项 |

    | `list.reverse()` | 原地反转所有列表项 |


    ![image](img/image00194.jpeg)


    对于既包含数值又包含字符串值的列表，`sort()` 方法返回的列表元素先按数值排序，然后按字母顺序排序——例如如 1,2,3,A,B,C。


    Python 还有一个非常有用的 `len(L)` 函数，它返回列表的长度。


    `str(n)` 返回列表的字符串表示。像 `index()` 和 `count()` 方法一样，返回的值是数值，因此不能直接连接到字符串。然而，列表的字符串表示可以通过
    Python 的 `str(L)` 函数产生。在这两种情况下，原始版本保持不变，返回的只是副本。


    单个列表元素可以通过 `del` 关键字指定列表名和索引号来删除。这可以删除指定索引位置的元素，或者使用切片语法 `i1:i2` 删除元素的“切片”，其中
    `i1` 是要删除元素的第一个索引，但不包括 `i2` 索引处的元素。


    ![image](img/image00261.jpeg)


    Python 还有一个 `int(s)` 函数，返回字符串 `s` 的数值版本。


    ![image](img/image00188.jpeg)


    `pop.py`


    ![image](img/image00257.jpeg)通过初始化两个包含三个字符串元素的列表来启动一个新程序


    `basket = [ ‘Apple’ , ‘Bun’ , ‘Cola’ ]`

    `crate = [ ‘Egg’ , ‘Fig’ , ‘Grape’ ]`


    ![image](img/image00258.jpeg)接下来，添加语句显示第一个列表元素的内容及其长度


    ```

    print( ‘Basket List:’ , basket )

    print( ‘Basket Elements:’ , len( basket) )

    ```


    ![image](img/image00259.jpeg)现在，添加语句添加一个元素并显示所有列表元素，然后删除最后一个元素再次显示所有列表元素


    ```

    basket.append( ‘Damson’ )

    print( ‘Appended:’ , basket )

    print( ‘Last Item Removed:’ , basket.pop() )

    print( ‘Basket List:’ , basket )

    ```


    ![image](img/image00260.jpeg)最后，添加语句将第二个列表的所有元素添加到第一个列表中并显示所有的第一个列表元素，然后删除元素并再次显示第一个列表


    ```

    basket.extend( crate )

    print( ‘Extended:’ , basket )

    del basket[1]

    print( ‘Item Removed:‘ , basket )

    del basket[1:3]

    print( ‘Slice Removed:’ , basket )

    ```


