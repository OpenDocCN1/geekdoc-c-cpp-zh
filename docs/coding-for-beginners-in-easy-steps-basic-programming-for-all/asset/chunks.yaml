    ![image](Images/image00195.jpeg)Open an IDLE Shell Window then precisely enter
    this statement at the interactive prompt


    ```

    print( ‘Hello World!’ )

    ```


    ![image](Images/image00196.jpeg)Next, hit the Return key to see the interpreter’s
    response


    ![image](Images/image00205.jpeg)


    ![image](Images/image00197.jpeg)Now, enter this sum statement at the interactive
    prompt


    ```

    8 + 4

    ```


    ![image](Images/image00194.jpeg)


    Spaces in statements are ignored – so `8+4` can be entered without spaces.


    ![image](Images/image00200.jpeg)Hit Return to see the interpreter print the result
    total


    ![image](Images/image00206.jpeg)


    ![image](Images/image00202.jpeg)Enter this invalid statement at the interactive
    prompt


    ```

    8 / 0

    ```


    ![image](Images/image00207.jpeg)Hit Return to see the interpreter print an error
    message


    ![image](Images/image00208.jpeg)


    ![image](Images/image00193.jpeg)


    The Shell Window is mostly used to test snippets of code.


    ## Getting help


    The IDLE Shell Window provides a great Help utility where you can find help on
    any Python topic when coding Python programs. Help can be sought by entering a
    Python `help()` statement at the interactive `>>>` prompt. A welcome message appears
    and the prompt changes to help> to denote you are now in Help mode.


    ![image](Images/image00195.jpeg)Open an IDLE Shell Window then precisely enter
    this statement at the interactive prompt


    ```

    help( )

    ```


    ![image](Images/image00196.jpeg)Next, hit the Return key to enter Help mode


    ![image](Images/image00209.jpeg)


    ![image](Images/image00197.jpeg)Now, enter this topic name at the Help utility
    prompt keywords


    ![image](Images/image00200.jpeg)Hit Return to list all keywords of the Python
    language


    ![image](Images/image00210.jpeg)


    ![image](Images/image00194.jpeg)


    The Help utility welcome message also contains handy hints – but are omitted here
    for brevity.


    ![image](Images/image00193.jpeg)


    Keywords are the vocabulary of a programming language. Note that Python keywords
    are case-sensitive – these are all in lowercase except `False`, `None`, and `True`.


    ![image](Images/image00202.jpeg)Then, enter this command at the Help utility prompt
    quit


    ![image](Images/image00207.jpeg)Hit Return to exit Help and return to an interactive
    Shell Window prompt


    ![image](Images/image00211.jpeg)


    ![image](Images/image00193.jpeg)


    There are no parentheses required after the `quit` instruction – here it is a
    Help utility command, not a Python statement.


    When you just want help on a single topic you can simply enter the topic name
    within quote marks inside the parentheses of a `help()` statement at the interactive
    prompt:


    ![image](Images/image00212.jpeg)Precisely enter this statement at the interactive
    prompt


    ```

    help( ‘keywords’ )

    ```


    ![image](Images/image00213.jpeg)Hit Return to list all keywords of the Python
    language and remain at an interactive Shell Window prompt


    ![image](Images/image00214.jpeg)


    ![image](Images/image00215.jpeg)


    Keywords have special meaning in a programming language – they cannot be used
    to name items in your code.


    ## Saving programs


    The IDLE Shell Window, described on the previous page, is a great place to try
    out snippets of code, but cannot save your code. Happily IDLE also provides an
    Edit Window where you can create longer pieces of programming code that can be
    stored in a (`.py`) file on your computer. This means you can easily re-run the
    code without re-typing all the instructions at the Shell Window `>>>` prompt and
    this lets you edit your code to try new ideas. The procedure to create, save,
    and run your code looks like this:


    * Open an Edit Window from the Shell Window by selecting `File`, `New File` from
    the Shell Window menu items – or by pressing the `Ctrl + N` shortcut keys

    * Type code into the Edit Window then save it by selecting `File`, `Save` from
    the Edit Window menu items – or by pressing the `Ctrl + S` shortcut keys

    * Run saved code from the Edit Window by selecting `Run`, `Run Module` from the
    Edit Window menu items – or by pressing the `F5` shortcut key


    ![image](Images/image00194.jpeg)


    The procedure described here will be used to demonstrate the code examples given
    throughout this book.


    Output from your program code will appear in the Shell Window as the program runs,
    or a helpful error message will appear there if the interpreter discovers an error
    in your code.


    ![image](Images/image00195.jpeg)Open an IDLE Shell Window then select the `File`,
    `New File` menu item to open an IDLE Edit Window


