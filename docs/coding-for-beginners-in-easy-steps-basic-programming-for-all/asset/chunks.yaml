    The `math.pow()` function requires two arguments to raise a specified value by
    a specified power. The `math.sqrt()` function, on the other hand, simply requires
    a single argument and returns the square root of that specified value. Both function
    results are returned as a numeric value of the `float` data type.


    ![image](Images/image00193.jpeg)


    Integers can be cast from the `int` data type to the `float` data type using the
    `float()` function and to the `string` data type using the `str()` function.


    Typical trigonometry can be performed using functions from the `math` module too,
    such as `math.sin()`, `math.cosin()` and `math.tan()`.


    Additionally, Python includes a `random` module that can be used to produce pseudo
    random numbers once imported into a program.


    The `random.random()` function produces a single floating-point number between
    zero and 1.0. Perhaps, more interestingly, the `random.sample()` function produces
    a list of elements selected at random from a sequence. This method requires two
    arguments to specify the sequence to select from, and the length of the list to
    be produced. As the `range()` function returns a sequence of numbers, this can
    be used to specify a sequence as the first argument to the `random.sample()` function
    – so it will randomly select numbers from that sequence to produce a list in which
    no numbers repeat.


    ![image](Images/image00188.jpeg)


    maths.py


    ![image](Images/image00195.jpeg)Start a new program by importing the `math` and
    `random` modules to make their features available


    ```python

    import math , random

    ```


    ![image](Images/image00196.jpeg)Next, add statements to display two rounded values


    ```python

    print( ‘Rounded Up 9.5:‘ , math.ceil( 9.5 ) )

    print( ‘Rounded Down 9.5:‘ , math.floor( 9.5 ) )

    ```


    ![image](Images/image00197.jpeg)Now, add a statement to initialize a variable
    with an integer value


    ```python

    num = 4

    ```


    ![image](Images/image00200.jpeg)Add statements to display the square and square
    root of the variable value


    ```python

    print( num , ‘Squared:‘ , math.pow( num , 2 ) )

    print( num , ‘Square Root:‘ , math.sqrt( num ) )

    ```


    ![image](Images/image00202.jpeg)Then, add a statement to produce a random list
    of six unique numbers between one and 49


    ```python

    nums = random.sample( range( 1, 49 ) , 6 )

    ```


    ![image](Images/image00207.jpeg)Finally, add a statement to display the random
    list


    ```python

    print( ‘Your Lucky Lotto Numbers Are:‘ , nums )

    ```


    ![image](Images/image00212.jpeg)Save then run the program – to see math results
    and random samples


    ![image](Images/image00319.jpeg)


    ![image](Images/image00193.jpeg)


    All the math functions here return floating-point numbers of the `float` data
    type.


    ![image](Images/image00194.jpeg)


    The list produced by `random.sample()` does not actually replace elements of the
    sequence but merely copies a sample, as its name says.


    ### Calculating decimals


    Python programs that attempt floating-point arithmetic can produce unexpected
    and inaccurate results because the floating-point numbers cannot accurately represent
    all decimal numbers.


    ![image](Images/image00188.jpeg)


    inaccurate.py


    ![image](Images/image00195.jpeg)Start a new program by initializing two variables
    with floating-point values


    ```python

    item = 0.70

    rate = 1.05

    ```


    ![image](Images/image00196.jpeg)Next, initialize two more variables by attempting
    floating-point arithmetic with the first two variables


    ```python

    tax = item * rate total = item + tax

    ```


    ![image](Images/image00197.jpeg)Now, add statements to display variable values
    formatted to have two decimal places so trailing zeros are shown


    ```python

    print( ‘Item:\t’ , ‘%.2f’ % item )

    print( ‘Tax:\t’ , ‘%.2f’ % tax )

    print( ‘Total:\t’ , ‘%.2f’ % total )

    ```


    ![image](Images/image00200.jpeg)Save then run the program – to see the output
    display an inaccurate addition total


    ![image](Images/image00320.jpeg)


    ![image](Images/image00188.jpeg)


    expanded.py


    ![image](Images/image00202.jpeg)To help understand this problem edit all three
    print statements to display the variable values expanded to 20 decimal places,
    then run the modified program


    ```python

    print( ‘Item:\t’ , ‘%.20f’ % item )

    print( ‘Tax:\t’ , ‘%.20f’ % tax )

    print( ‘Total:\t’ , ‘%.20f’ % total )

    ```


    ![image](Images/image00321.jpeg)


