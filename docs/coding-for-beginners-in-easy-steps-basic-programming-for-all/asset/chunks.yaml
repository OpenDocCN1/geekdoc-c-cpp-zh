    - Python 内置 `input()` 函数可以将输入赋值给变量，并可选地指定一个要显示的字符串。

    - Python 内置 `print()` 函数可以在其括号中以逗号分隔列表的形式指定输出的多个值。

    - 默认情况下，`print()` 函数会在输出后自动添加一个 `\n` 换行符，除非指定了结束备选参数（end）。

    - `+` 拼接运算符可以将两个字符串连接在一起。

    - 数据类型本质上是 `str` 字符串、`int` 整数、`float` 小数、或 `bool` 布尔真值。

    - 布尔值是逻辑真值，在 Python 中通过 `True` 和 `False` 关键字表示。

    - Python 内置 `type()` 函数可以识别任何指定变量中的值属于哪种类的数据类型。

    - Python 内置 `input()` 函数赋值给变量的值始终被赋予 `str` 字符串数据类型。

    - 可以 Python 内置的 `int()`、`float()` 和 `str()` 转换函数对数据类型进行转换以便操作。

    - 对 `int` 整数和 `float` 小数进行算术运算将产生 `float` 数据类型的结果。

    - 因代码错误导致的语法错误会在程序执行之前被解释器识别。

    - 因异常导致的运行时错误会在程序执行期间被解释器识别。

    - 因非预期性能导致的语义错误不会被解释器识别。


    # 执行操作


    本章演示了如何在你的代码语句中使用运算符符号。


    - 进行算术运算

    - 赋值

    - 比较值

    - 寻找真值

    - 测试条件

    - 设置顺序

    - 总结


    ## 进行算术运算


    在计算机程序编程中常用的算术“运算符”通常使用 `+` 符号进行加法，使用 `-` 符号进行减法，正如你所期的那样。通常，它们还使用 `*` 星号进行乘法，而不是
    `x` 符号，并使用 `/` 正斜线进行除法，而不是 `÷` 符号。


    用于编写 Python 程序的算术运算符列如下，连同它们执行的操作：


    | 运算符: | 操作: |

    | :--- | :--- |

    | `+` | 加法 |

    | `-` | 减法 |

    | `*` | 乘法 |

    | `/` | 除法 |

    | `%` | 取余 |

    | `//` | 整除 |

    | `**` | 幂 |


    `+` 运算符将两个数字相加，`-` 运算符从第一个数中减去第二个数。


    `*` 运算符将第一个数乘以第二个数，`/` 运算符将第一个数除以第二个数。


    `%` 取余运算符将第一个数除以第二个数并返回运算的余数。这对于确定一个数是奇数还是偶数很有用。


    `//` 整除运算符的操作与 `/` 除法运算符相同，但会在小数点处截断结果——移除结果数字中的任何浮点部分。


    `**` 幂运算符返回第一个数对于第二个数幂的结果。


    ![image](img/image0019.jpeg)


    用于运算符形成表达式的值被称为“操作数”——在表达式 `2 + 3` 中，数值 `2` 和 `3` 就是操作数。


    ![image](img/image00188.jpeg)


