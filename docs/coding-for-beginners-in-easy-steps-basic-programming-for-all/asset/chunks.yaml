    ## Converting data


    Often you will need to convert data in your programs to perform some manipulation
    – such as arithmetic or concatenation. Arithmetic can only be performed on numeric
    types, such as `int` and `float`, whereas concatenation can only be performed
    on string types, such as `str`.


    Python provides several built-in functions that allow you to easily convert data
    to a different type. These do not convert the original itself but merely return
    a converted representation. In programming terms this is known as a “cast” operation:


    | Function: | Description: |

    | :--- | :--- |

    | `int(x)` | Converts `x` to an integer number |

    | `float(x)` | Converts `x` to a floating-point number |

    | `str(x)` | Converts `x` to a string |


    ![image](Images/image00193.jpeg)


    Numeric values in your code should not be enclosed within quote marks – numbers
    within quotes will be seen as string values!


    Numeric values assigned to variables manually in your code are automatically appointed
    the appropriate data type of `int` or `float`. Values assigned to variables from
    users by the built-in `input()` function are, however, always appointed the `str`
    data type – even when they are simply numeric values! This means they must be
    converted (cast) to an appropriate numeric type before you can perform arithmetic
    with them.


    Conversely numeric values assigned to variables manually in your code, which are
    automatically appointed the appropriate data type of `int` or `float`, cannot
    be concatenated into a string. This means they must be converted to a `str` data
    type for inclusion in a string.


    In Python, as in many other programming languages, the `+` symbol has more than
    one purpose according to its context. Where the `+` symbol is used between two
    numeric values it performs an addition (seen as an “addition operator”) where
    the `+` symbol is used between two string values it performs a concatenation (seen
    as a “concatenation operator”). Variables that are assigned the result of either
    kind of operation will automatically be appointed the appropriate data type of
    the result.


    ![image](Images/image00194.jpeg)


    Arithmetic performed on an `int` and `float` data type together will be automatically
    cast into a `float` result. Cast values to the `float` data type to allow for
    decimal number input.


    ![image](Images/image00188.jpeg)


