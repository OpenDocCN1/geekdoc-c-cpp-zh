    ## 赋值


    计算机程序中常用的赋值运算符使用 `=` 来赋值。用于编写 Python 程序的赋值运算符列如下：


    | 运算符: | 示例: |

    | :--- | :--- |

    | `=` | `a = b` |

    | `+=` | `a += b` |

    | `-=` | `a -= b` |

    | `*=` | `a *= b` |

    | `/=` | `a /= b` |

    | `%=` | `a %= b` |

    | `//=` | `a //= b` |

    | `**=` | `a **= b` |


    在上面的示例中，变量 `a` 被赋予了值。`+=` 运算符用于向现有变量添加一个值。`-=` 运算符从现有变量中减去一个值。`*=` 运算符将现有变量乘以一个值。`/=`
    运算符将第一个变量除以第二个值。`%=` 运算符将除法的余数赋值给第一个变量。`//=` 运算符执行整除并将结果赋值给第一个变量。`**=` 运算符执行幂运算并将结果赋值给第一个变量。所有这些运算符都以相同的方式工作


