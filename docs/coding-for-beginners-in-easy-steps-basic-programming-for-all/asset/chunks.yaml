    ```python

    a /= b

    print( ‘Divide & Assign:\t’ , ’a =’ , a , ‘\t(32 ÷ 4)’ )


    a %= b

    print( ‘Remainder & Assign:\t’ , ’a =’ , a , ‘\t(8 % 4)’ )

    ```

