  trans: "\n\n| **r/R** | **原始字符串 – 抑制转义字符的含义** | **print( r’\\n’ )** |\n| :--- |\
    \ :--- | :--- |\n| **‘‘ ‘‘‘** | **Docstring – 描述模块、函数、类或方法** | **def sum( a,b\
    \ ) : ‘‘‘ Add Args ‘‘‘** |\n\n![image](img/image00215.jpeg)\n\n成员运算符执行大小敏感的匹配，因此\
    \ `‘A’ in ‘abc’` 将失败。\n\n`[ ]` 切片操作符和 `[ :]` 范围切片操作符识别出字符串实际上是一个列表，其中每个列表元素包含一个单独字符，可以通过它们的索引数字进行引用。\n\
    \n同样，`in` 和 `not in` 成员运算符会遍历每个元素，寻找匹配指定的字符。\n\n原始字符串运算符 `r`（或大写的 `R`）必须紧置于起始引号之前，以抑制字符串中的转义字符，这在字符串包含反斜线字符时非常有用。\n\
    \n![image](img/image00215.jpeg)\n\n范围切片（Range Slice）返回直至（但不包括）最后一个指定的索引位置的字符串。\n\
    \n“docstring”（文档字符串）是一个描述性的字符串字面量，作为模块、函数、类或方法定义的第一个语句出现。它应该包含在三个单引号内。独特的是，docstring\
    \ 成为该对象的 `__doc__` 特殊属性，因此可以使用其名称和点后缀进行引用。通常所有模块都应该有 docstring，由模块导出的所有函数和类也应该有\
    \ docstring。\n\n![image](img/image00188.jpeg)\n\n### manipulate.py\n\n![image](img/image00225.jpeg)通过定义一个包含\
    \ docstring 描述的简单函数来启动新程序\n\n```python\ndef display( s ) :\n    ‘‘’Display an\
    \ argument value.’’’\n    print( s )\n```\n\n![image](img/image00226.jpeg)接下来，添加一条语句来显示函数描述\n\
    \n```python\ndisplay( display.doc )\n```\n\n![image](img/image00227.jpeg)现在，添加一条语句来显示包含反斜线字符的原始字符串值\n\
    \n```python\ndisplay( r’C:\\Program Files’ )\n```\n\n![image](img/image00228.jpeg)然后，添加一条语句来显示包含转义字符和空格的两个字符串值的拼接\n\
    \n```python\ndisplay( ‘\\nHello’ + ‘ Python’ )\n```\n\n![image](img/image00231.jpeg)接下来，添加一条语句来显示元素索引编号范围内指定字符串的切片\n\
    \n```python\ndisplay( ‘Python In Easy Steps\\n’ [ 7 : ] )\n```\n\n![image](img/image00232.jpeg)最后，显示在指定字符串内查找字符的结果\n\
    \n```python\ndisplay( ‘P’ in ‘Python’ )\ndisplay( ‘p’ in ‘Python’ )\n```\n\n![image](img/image00240.jpeg)保存并运行程序\
    \ – 查看处理后的字符串被显示\n\n![image](img/image00325.jpeg)\n![image](img/image00193.jpeg)\n\
    \n记住字符串必须包含在单引号或双引号内。\n\n![image](img/image00194.jpeg)\n\n使用范围切片时，如果省略起始索引数字，则认为零；如果省略结束索引数字，则认为字符串长度。\n\
    \n### 格式化字符串\n\nPython 内置 `dir()` 函数可以通过在括号内指定模块名来检查模块中定义的函数和变量名称，非常有用。交互模式可以轻松用于此目的，即导入模块名然后调用\
    \ `dir()` 函数。以下示例检查了在第六章中此处创建的“dog”模块：\n\n![image](img/image00326.jpeg)\n![image](img/image00194.jpeg)\n\
    \n注意，上一个示例中引入的 `__doc__` 属性出现在 `dir()` 函数列出的列表中。\n\n那些以双下划线开头和结尾的定义名称是 Python\
    \ 对象，而其他是程序员定义的。也可以使用 `dir()` 函数检查 `__builtins__` 模块，以揭示默认定义的函数和变量名称，例如 `print()`\
    \ 函数和 `str` 对象。\n\n`str` 对象定义了几个用于字符串格式化的有用函数，包括一个执行替换的实际 `format()` 函数。由 `format()`\
    \ 函数格式化的字符串可以同时包含文本和“替换字段”，标记了从逗号分隔的有序值列表中插入文本的位置。每个替换字段由 `{ }` 括号表示，括号中可选地包含替换在列表中的索引位置。\n\
    \n![image](img/image00193.jpeg)\n\n不要将此处描述的 `str` 对象与将值转换为字符串数据类型的 `str()` 函数混淆。\n\
    \n字符串也可以使用 C 风格的 `%s` 替换操作符进行格式化，标记字符串中从逗号分隔的有序值列表中插入文本的位置。\n\n![image](img/image00188.jpeg)\n\
    \n### format.py\n\n![image](img/image00225.jpeg)通过用格式字符串初始化变量启动新程序\n\n```python\n\
    snack = ‘{} and {}’.format( ‘Burger’ , ‘Fries’ )\n```\n\n![image](img/image00226.jpeg)接下来，显示变量值以查看按列出的顺序替换的文本\n\
    \n```python\nprint( ‘\\nReplaced:’ , snack )\n```\n\n![image](img/image00227.jpeg)现在，为变量分配一个不同格式的字符串\n\
    \n```python\nsnack = ‘{1} and {0}’.format( ‘Burger’ , ‘Fries’ )\n```\n\n![image](img/image00228.jpeg)然后，再次显示变量值以查看文本现在按指定的索引元素值进行替换\n\
    \n```python\nprint( ‘Replaced:’ , snack )\n```\n\n![image](img/image00231.jpeg)为变量分配另一个格式化字符串\n\
    \n```python\nsnack = ‘%s and %s’ % ( ‘Milk’ , ‘Cookies’ )\n```\n\n![image](img/image00232.jpeg)最后，再次显示变量值以查看按列出的顺序替换的文本\n\
    \n```python\nprint( ‘\\nSubstituted:’ , snack )\n```\n\n![image](img/image00240.jpeg)保存并运行程序\
    \ – 查看格式化字符串被显示\n\n![image](img/image00327.jpeg)\n![image](img/image00215.jpeg)不能在替换字段周围留空格。\n\
    \n![image](img/image00194.jpeg)其他数据类型可以使用 `%d` 替换整数，`%c` 替换字符以及 `%f` 替换浮点数。\n\n\
    ### 修改字符串\n\n`str` 对象有许多有用函数可以通过点后缀调用来修改字符串并检查其内容。常用的字符串修改函数列在下表中，并带有简要描述：\n\n\
    | **方法:** | **描述:** |\n| :--- | :--- |\n| `capitalize()` | 将字符串的首字母转换为大写 |\n|\
    \ `title()` | 将所有首字母转换为大写 |\n| `upper()` `lower()` `swapcase()` | 将所有字母转换为大写、小写或当前大小的反转\
    \ |\n| `join(seq)` | 使用分隔符合并字符串 |\n| `lstrip()` `rstrip()` `strip()` | 分别移除领先空格、尾部空格或两端空格\
    \ |\n| `replace(old, new)` | 将所有的 *old* 出现替换为 *new* |\n| `ljust(w, c)` `rjust(w,\
    \ c)` | 分别向右或左侧填充字符串直到总宽度 *w*，使用字符 *c* |\n| `center(w, c)` | 在两两侧填充字符串直到总宽度 *w*，使用字符\
    \ *c*（默认是空格） |\n| `count(sub)` | 返回 *sub* 出现的次数 |\n| `find(sub)` | 返回 *sub* 首次出现的索引数字，如果未找到则返回\
    \ -1 |\n| `startswith(sub)` `endswith(sub)` | 如果 *sub* 分别位于开头或结尾，则返回 True；否则返回\
    \ False |\n| `isalpha()` `isnumeric()` `isalnum()` | 如果所有字符均为字母、均为数字或均为字母或数字，则返回\
    \ True；否则返回 False |\n| `islower()` `isupper()` `istitle()` | 如果字符串字符为小写、大写或所有首字母均为大写，则返回\
    \ True；否则返回 False |\n| `isspace()` | 如果字符串仅包含空格，则返回 True；否则返回 False |\n\n"
- fmt: "\n| `isdigit()` `isdecimal()` | Return True if string contains only digits\
    \ or decimals – otherwise return False |\n\n![image](Images/image00215.jpeg)\n\
    \nA space character is not alphanumeric so `isalnum()` returns `False` when examining\
    \ strings that contain spaces.\n\n![image](Images/image00188.jpeg)\n\n### `modify.py`\n\
    \n![image](Images/image00225.jpeg)Start a new program by initializing a variable\
    \ with a string of lowercase characters and spaces\n\n```python\nstring = ‘coding\
    \ for beginners in easy steps’\n```\n\n![image](Images/image00226.jpeg)Next, display\
    \ the string capitalized, titled, and centered\n\n```python\nprint( ‘\\nCapitalized:\\\
    t’ , string.capitalize() )\nprint( ‘\\nTitled:\\t\\t’ , string.title() )\nprint(\
    \ ‘\\nCentered:\\t’ , string.center( 30 , ‘*’ ) )\n```\n\n![image](Images/image00227.jpeg)Now,\
    \ display the string in all uppercase and merged with a sequence of two asterisks\n\
    \n```python\nprint( ‘\\nUppercase:\\t’ , string.upper() )\nprint( ‘\\nJoined:\\\
    t\\t’ , string.join( ‘**’ ) )\n```\n\n![image](Images/image00228.jpeg)Then, display\
    \ the string padded with asterisks on the left\n\n```python\nprint( ‘\\nJustified:\\\
    t\\t’ ,string.rjust( 30 , ‘*’ ) )\n```\n\n![image](Images/image00231.jpeg)Finally,\
    \ display the string with all occurrences of the ‘s’ character replaced by asterisks\n\
    \n```python\nprint( ‘\\nReplaced:\\t’ , string.replace( ‘s’ , ‘*’ ) )\n```\n\n\
    ![image](Images/image00232.jpeg)Save then run the program – to see modified strings\
    \ get displayed\n\n![image](Images/image00328.jpeg)\n\n![image](Images/image00193.jpeg)\n\
    \nWith the `rjust()` function a RIGHT-justified string gets padding added to its\
    \ LEFT, and with the `ljust()` function a LEFT-justified string gets padding added\
    \ to its RIGHT.\n\n### Accessing files\n\nThe `__builtins__` module can be examined\
    \ using the `dir()` function to reveal that it contains a file object that defines\
    \ several methods for working with files, including `open()`, `read()`, `write()`,\
    \ and `close()`.\n\nBefore a file can be read or written it firstly must always\
    \ be opened using the `open()` function. This requires two string arguments to\
    \ specify the name and location of the file, and one of the following “mode” specifiers\
    \ in which to open the file:\n\n| File mode: | Operation: |\n| :--- | :--- |\n\
    | `r` | Open an existing file to read |\n| `w` | Open an existing file to write.\
    \ Creates a new file if none exists or opens an existing file and discards all\
    \ its previous contents |\n| `a` | Append text. Opens or creates a text file for\
    \ writing at the end of the file |\n| `r+` | Open a text file to read from or\
    \ write to |\n| `w+` | Open a text file to write to or read from |\n| `a+` | Open\
    \ or creates a text file to read from or write to at the end of the file |\n|\
    \ Where the mode includes a `b` after any of the file modes listed above, the\
    \ operation relates to a binary file rather than a text file. For example `rb`\
    \ or `w+b` |\n\n![image](Images/image00215.jpeg)\n\nFile mode parameters are string\
    \ values so must be surrounded by quotes.\n\nOnce a file is opened and you have\
    \ a file object and can get various information related to that file from its\
    \ properties:\n\n| Property: | Description |\n| :--- | :--- |\n| `name` | Name\
    \ of the opened file |\n| `mode` | Mode in which the file was opened |\n| `closed`\
    \ | Status Boolean value of `True` or `False` |\n| `readable()` | Read permission\
    \ Boolean value of `True` or `False` |\n| `writable()` | Write permission Boolean\
    \ value of `True` or `False` |\n\n![image](Images/image00194.jpeg)\n\nYou can\
    \ also use a `readlines()` function that returns a list of all lines.\n\n![image](Images/image00188.jpeg)\n\
    \n### `access.py`\n\n![image](Images/image00225.jpeg)Start a new program by creating\
    \ a file object for a new text file named “example.txt” in which to write content\n\
    \n```python\nfile = open( ‘example.txt’ , ‘w’ )\n```\n\n![image](Images/image00226.jpeg)Next,\
    \ add statements to display the file name and mode\n\n```python\nprint( ‘File\
    \ Name:’ , file.name )\nprint( ‘File Open Mode:’ , file.mode )\n```\n\n![image](Images/image00227.jpeg)Now,\
    \ add statements to display the file access permissions\n\n```python\nprint( ‘Readable:’\
    \ , file.readable() )\nprint( ‘Writable:’ , file.writable() )\n```\n\n![image](Images/image00228.jpeg)Then,\
    \ define a function to determine the file’s status\n\n```python\ndef get_status(\
