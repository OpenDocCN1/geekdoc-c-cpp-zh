    print( ‘\\nChick Attributes...’ )\nfor attrib in dir( chick ) :\nif attrib[0]\
    \ != ‘_’ :\n    print( attrib , ‘:’ , getattr( chick , attrib ) )\n```\n\n![image](img/image00247.jpeg)最后，删除新属性并使用内置函数确认其已删除\n\
    \n```python\ndelattr( chick , ‘age’ )\nprint( ‘\\nChick age Attribute?’ , hasattr(\
    \ chick , ‘age’ ) )\n```\n\n![image](img/image00248.jpeg)保存并运行程序 – 查看实例属性如何被处理\n\
    \n![image](img/image00342.jpeg)\n\n![image](img/image00343.jpeg)\n\n鸟类实例 – 小鸡\n\
    \n![image](img/image00193.jpeg)\n\n此循环会跳过任何以下划线开头的属性，因此“私有”属性将不会显示在列表中。\n\n##\
    \ 派生类 (Deriving classes)\n\nPython 类可以作为一个全新的类创建（如之前的示例所示），也可以从现有类“派生”。重要的是，派生类继承其所派生的父类（基类）的成员，同时也包含它自己的成员。\n\
    \n从基类继承成员的能力允许创建共享某些共同属性的派生类，这些属性已经在基类中定义。例如，“多边形”（Polygon）基类可以定义所有多边形通用的宽度和高度属性。“矩形”（Rectangle）和“三角形”（Triangle）类可以从\
    \ `Polygon` 类派生 – 继承宽度和高度属性，以及定义其独特特征的成员。\n\n![image](img/image00344.jpeg)\n\n\
    ![image](img/image00345.jpeg)\n\n继承的优点非常强大，它是面向对象编程（OOP）的第二个原则。\n\n派生类的声明在其类名后添加\
    \ `()` 括号，并指定其父基类的名称。\n\n![image](img/image00188.jpeg)\n\nPolygon.py\n\n![image](img/image00241.jpeg)创建一个新的类文件，声明一个带有两个类变量和一个设置值方法的基类\n\
    \n```python\nclass Polygon :\nwidth = 0\nheight = 0\ndef set_values( self , width\
    \ , height ) :\n    Polygon.width = width\n    Polygon.height = height\n```\n\n\
    ![image](img/image00188.jpeg)\n\nRectangle.py\n\n接下来，创建一个类文件，声明一个派生类，带一个返回处理后的类变量值的方法\n\
    \n```python\nfrom Polygon import *\nclass Rectangle( Polygon ) :\ndef area( self\
    \ ) :\n    return self.width * self.height\n```\n\n![image](img/image00188.jpeg)\n\
    \nTriangle.py\n\n现在，创建另一个类文件，声明一个派生类，带一个返回处理后的类变量值的方法\n\n```python\nfrom Polygon\
    \ import *\nclass Triangle( Polygon ) :\ndef area( self ) :\n    return ( self.width\
    \ * self.height ) / 2\n```\n\n![image](img/image00244.jpeg)保存这三个类文件，然后通过提供两个派生类的特征启动一个新程序\n\
    \n```python\nfrom Rectangle import *\nfrom Triangle import *\n```\n\n![image](img/image00245.jpeg)接下来，创建每个派生类的实例\n\
    \n```python\nrect = Rectangle()\ntrey = Triangle()\n```\n\n![image](img/image00246.jpeg)现在，调用从基类继承的类方法，传递参数以分配类变量\n\
    \n```python\nrect.set_values( 4 , 5 )\ntrey.set_values( 4 , 5 )\n```\n\n![image](img/image00247.jpeg)最后，显示处理从基类继承的类变量的结果\n\
    \n```python\nprint( ‘Rectangle Area:’ , rect.area() )\nprint( ‘Triangle Area:’\
    \ , trey.area() )\n```\n\n![image](img/image00248.jpeg)保存并运行程序 – 查看使用继承特征显示的输出\n\
    \n![image](img/image00346.jpeg)\n\n![image](img/image00188.jpeg)\n\ninherit.py\n\
    \n![image](img/image00194.jpeg)\n\n类声明可以通过在声明中名称后的括号内列出多个基类来派生自多个类。\n\n![image](img/image00215.jpeg)\n\
    \n不要混淆类实例和派生类 – 实例是类的拷贝，而派生类是一个继承其所派生的基类属性的新类。\n\n## 方法重写 (Overriding methods)\n\
    \n可以在派生类中声明一个方法来重写基类中匹配的方法 – 如果两个方法的声明具有相同的名称且列出的参数数量相同。这实际上隐藏了基类方法，因为除非显式使用基类名进行标识并调用，否则它是它是不可访问的。\n\
    \n当基类中的方法提供默认参数值时，可以在显式调用基类方法时使用该值，或者通过重写方法提供替代值。\n\n![image](img/image00188.jpeg)\n\
    \nPerson.py\n\n![image](img/image00241.jpeg)创建一个新的类文件，声明一个基类，带一个初始化方法来设置实例变量，以及第二个显示该变量值的方法\n\
    \n```python\nclass Person :\n'''用于定义 Person 属性的基类。’’\ndef __init__( self , name\
    \ ) :\n    self.name = name\ndef speak( self , msg = ‘(Calling The Base Class)’\
    \ ) :\n    print( self.name , msg )\n```\n\n![image](img/image00188.jpeg)\n\n\
    Man.py\n\n![image](img/image00242.jpeg)接下来，创建一个类文件，声明一个派生类，带一个重写第二个基类方法的方法\n\n\
    ```python\nfrom Person import *\n‘‘用于定义 Man 属性的派生类。’’\nclass Man( Person ) :\n\
    def speak( self , msg ) :\n    print( self.name , ‘:\\n\\tHello!’ , msg )\n```\n\
    \n![image](img/image00188.jpeg)\n\nHombre.py\n\n![image](img/image00243.jpeg)现在，创建另一个类文件，声明一个派生类，带一个再次重写基类中相同的方法\n\
    \n```python\nfrom Person import *\n‘‘用于定义 Hombre 属性的派生类。’’\nclass Hombre( Person\
    \ ) :\ndef speak( self , msg ) :\n    print( self.name , ‘:\\n\\tHola!’ , msg\
    \ )\n```\n\n![image](img/image00188.jpeg)\n\noverride.py\n\n![image](img/image00244.jpeg)保存三个类文件，然后通过提供两个派生类的特征启动新程序\n\
    \n```python\nfrom Man import *\nfrom Hombre import *\n```\n\n![image](img/image00245.jpeg)接下来，创建每个派生类的实例，初始化“name”实例变量\n\
    \n```python\nguy_1 = Man( ‘Richard’ )\nguy_2 = Hombre( ‘Ricardo’ )\n```\n\n![image](img/image00246.jpeg)现在，调用每个派生类的重写方法，为“msg”参数分配不同的值\n\
    \n```python\nguy_1.speak( ‘It’s a beautiful evening.\\n’ )\nguy_2.speak( ‘Es una\
    \ tarde hermosa.\\n’ )\n```\n\n![image](img/image00247.jpeg)最后，显式调用基类方法，传递每个派生类的引用\
    \ 但 但没有“msg”变量，因此将使用其默认值\n\n```python\nPerson.speak( guy_1 )\nPerson.speak( guy_2\
    \ )\n```\n\n![image](img/image00248.jpeg)保存并运行程序 – 查看重写方法和基类方法的输出\n\n![image](img/image00347.jpeg)\n\
    \n![image](img/image00348.jpeg)\n\nMan – Richard\n\nHombre – Ricardo\n\n![image](img/image00193.jpeg)\n\
    \n派生类中的方法声明必须与基类中的完全匹配才能重写它。\n\n## 应用意义 (Applying sense)\n\n面向对象编程（OOP）的三大基石是封装、继承和多态。本章之前的示例演示了如何将数据封装在\
    \ Python 类中，以及派生类如何继承基类的属性。本示例引入了多态这一最后一个基石原则。\n\n“多态”（源自希腊语，意为“多种形式”）描述了根据上下文给实体分配不同含义或目的的能力。\n\
    \n![image](img/image00349.jpeg)\n\n"
- fmt: "\nIn Python, the `+` character entity can be described as polymorphic because\
    \ it represents either the arithmetical addition operator, in the context of numerical\
    \ operands, or the string concatenation operator in the context of character operands.\n\
    \nPerhaps more importantly, Python class methods can also be polymorphic because\
    \ the Python language uses “duck typing” – meaning... if it walks like a duck,\
    \ swims like a duck, and quacks like a duck, then that bird is reckoned to be\
    \ a duck.\n\nIn a duck-typed language you can create a function to take an object\
    \ of any type and call that object’s methods. If the object does indeed have the\
    \ called methods (is reckoned to be a duck) they are executed, otherwise the function\
    \ signals a run-time error.\n\nLike-named methods of multiple classes can be created\
    \ and instances of those classes will execute the associated version.\n\n![image](Images/image00188.jpeg)\n\
    \n`Duck.py`\n\n![image](Images/image00241.jpeg)Create a new class file that declares\
    \ a class with methods to display strings unique to the class\n\n```python\nclass\
    \ Duck :\n    def talk( self ) :\n        print( ‘\\nDuck Says: Quack!’ )\n  \
    \  def coat( self ) :\n        print( ‘Duck Wears: Feathers’ )\n```\n\n![image](Images/image00188.jpeg)\n\
    \n`Mouse.py`\n\n![image](Images/image00242.jpeg)Next, create a class file that\
    \ declares a class with like-named methods but to display strings unique to this\
    \ class\n\n```python\nclass Mouse :\n    def talk( self ) :\n        print( ‘\\\
    nMouse Says: Squeak!’ )\n    def coat( self ) :\n        print( ‘Mouse Wears:\
    \ Fur’ )\n```\n\n![image](Images/image00188.jpeg)\n\n`polymorph.py`\n\n![image](Images/image00243.jpeg)Save\
    \ the two class files then start a new program by making features of both classes\
    \ available\n\n```python\nfrom Duck import *\nfrom Mouse import *\n```\n\n![image](Images/image00244.jpeg)Next,\
    \ define a function that accepts any single object as its parameter and attempts\
    \ to call methods of that object\n\n```python\ndef describe( object ) :\n    object.talk()\n\
    \    object.coat()\n```\n\n![image](Images/image00245.jpeg)Now, create an instance\
    \ object of each class\n\n```python\ndonald = Duck()\nmickey = Mouse()\n```\n\n\
    ![image](Images/image00246.jpeg)Finally, add statements to call the function and\
    \ pass each instance object to it as an argument\n\n```python\ndescribe( donald\
    \ )\ndescribe( mickey )\n```\n\n![image](Images/image00247.jpeg)Save then run\
    \ the program – to see the methods of the associated versions get called\n\n![image](Images/image00350.jpeg)\n\
    \n![image](Images/image00351.jpeg)\n\nDuck – donald\n\n![image](Images/image00352.jpeg)\n\
    \nMouse – mickey\n\n![image](Images/image00193.jpeg)\n\nA class can have only\
    \ one method with a given name – method overloading is not supported in Python.\n\
    \nObject Oriented Programming with Python allows data encapsulation, inheritance,\
    \ and polymorphism. Base class methods can be overridden by like-named methods\
    \ in derived classes. Python does not, however, support the technique of “overloading”\
    \ found in other languages – in which methods of the same name can be created\
    \ with different parameter lists in a single class.\n\n### Summary\n\n- Programming\
    \ objects are like virtual representations of real-world objects describing attributes\
    \ and behaviors in a “class”\n- A class is a data structure prototype describing\
    \ object properties with its methods and attribute members\n- Each class declaration\
    \ begins with the `class` keyword and is followed by an indented code block that\
    \ may contain a class document string, class variables, and class methods\n- Class\
    \ variables have global scope but instance variables (declared within method definitions)\
    \ have only local scope\n- Instance variables encapsulate data securely in a class\
    \ structure and are initialized when a class instance is created\n- Properties\
    \ of a class are referenced by dot notation and are addressed internally using\
    \ the `self` prefix\n- A class instance is a copy of the prototype that automatically\
    \ calls its `__init__()` method when the instance is first created\n- An attribute\
    \ of a class can be added, modified, or removed using dot notation or manipulated\
    \ using the built-in functions `getattr()`, `hasattr()`, `setattr()`, and `delattr()`\n\
    - The name of attributes automatically supplied by Python begin with an underscore\
    \ character to notionally indicate privacy\n- A derived class inherits the method\
    \ and attribute members of the parent base class from which it is derived\n- The\
    \ declaration of a derived class must state the name of its parent base class\
    \ in parentheses after its own class name\n- A method of a derived class can override\
    \ a matching method of the same name in its parent base class\n- A method of a\
    \ base class can be called explicitly using the base class name for identification\n\
    - Python is a duck-typed language that supports polymorphism for like-named methods\
    \ of multiple classes\n- The three cornerstones of Object Oriented Programming\
    \ (OOP) are Encapsulation, Inheritance, and Polymorphism\n\n11\n\n### Building\
    \ interfaces\n\n*This chapter demonstrates how to code graphical windowed programs*.\n\
    \n- [Launching interfaces](#part0014.xhtml_sec1)\n- [Responding buttons](#part0014.xhtml_sec2)\n\
    - [Displaying messages](#part0014.xhtml_sec3)\n- [Gathering entries](#part0014.xhtml_sec4)\n\
    - [Listing options](#part0014.xhtml_sec5)\n- [Polling interfaces](#part0014.xhtml_sec6)\n\
    - [Checking buttons](#part0014.xhtml_sec7)\n- [Adding images](#part0014.xhtml_sec8)\n\
    - [Summary](#part0014.xhtml_sec9)\n\n#### Launching interfaces\n\nThe standard\
    \ Python module you can use to create graphical applications is called `tkinter`\
    \ – a tool to interface with the system GUI (Graphical User Interface). The `tkinter`\
    \ module can be imported into a program like any other module to provide attributes\
    \ and methods. Every `tkinter` program must begin by calling the `Tk()` constructor\
    \ to create a window. The window’s size can optionally be specified as a `widthheight`\
    \ string argument to the window object’s `geometry()` method. Similarly, the window’s\
    \ title can be specified as a `title` string argument to the window object’s `title()`\
    \ method. If not specified default size and title values will be used.\n\n![image](Images/image00215.jpeg)\n\
    \nThere can be only one call to the `Tk()` constructor and it must be at the start\
    \ of the program.\n\nEvery `tkinter` program must also call the window object’s\
    \ `mainloop()` method to capture events, such as when the user closes the window\
    \ to quit. This loop should appear at the end of the program as it also handles\
    \ window updates that may be implemented.\n\nWith `tkinter`, all the graphical\
    \ controls that can be included in the application window, such as buttons or\
    \ checkboxes, are referred to as “widgets”. Perhaps the simplest widget is a non-interactive\
    \ label object that merely displays text or an image. A label object can be created\
    \ by specifying the window object’s name and `text='string’` as arguments to a\
    \ `Label()` constructor.\n\nOnce created, each widget, such as a label, must then\
    \ be added to the window using one of these “geometry manager” methods:\n\n- `pack()`\
    \ – places the widget against a specified side of the window using `TOP`, `BOTTOM`,\
    \ `LEFT`, or `RIGHT` constant values specified to its `side=` argument\n-place()`\
    \ – places the widget at XY coordinates in the window using numerical values specified\
    \ to its `x=` and `y=` arguments\n- `grid()` – places the widget in a cell within\
    \ the window using numerical values specified to its `row=` and `column=` arguments\n\
    \n![image](Images/image00194.jpeg)\n\nThe `grid()` geometry manager method is\
    \ demonstrated in the example [here](#part0015.xhtml_page_161).\n\nOptionally,\
    \ the `pack()` method may include a `fill` argument to expand the widget in available\
    \ space. For example, with `fill='x’`. Alternatively, the `pack()` method may\
    \ include `padx` and `pady` arguments to expand the widget along an axis a specified\
    \ amount.\n\n![image](Images/image00188.jpeg)\n\n`window.py`\n\n![image](Images/image00257.jpeg)Start\
    \ a new program with a statement to make the “tkinter” module GUI methods and\
    \ attributes available\n"
