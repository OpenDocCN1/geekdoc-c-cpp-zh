  trans: "\n\nPython 的 `break` 关键字用于在满足指定条件时提前终止循环。`break` 语句位于循环语句块内部，其前面是一个测试表达式。当测试返回\
    \ `True` 时，循环立即结束，程序继续执行下一个任务。例如，在嵌套内层循环中，它将进入外层循环的下一次迭代。\n\n![image](img/image00188.jpeg)\n\
    \n`nest.py`\n\n![image](img/image00270.jpeg)启动一个新程序，创建一个循环三次的循环语句\n\n```python\n\
    for i in range( 1, 4 ) :\n```\n\n![image](img/image00271.jpeg)接下来，添加一个缩进的语句，创建一个同样循环三次的“嵌套”内层循环\n\
    \n```python\nfor j in range( 1, 4 ) :\n```\n\n![image](img/image00272.jpeg)现在，在内层循环中添加一个进一步缩进的语句，在内层循环的每次迭代中显示计数器数值（外层循环和内层循环的计数器）\n\
    \n```python\nprint( ‘Running i=’ + i + ‘ j=’ + j )\n```\n\n![image](img/image00273.jpeg)保存并运行此程序——查看每次循环迭代的计数器值\n\
    \n![image](img/image00281.jpeg)\n\n![image](img/image00194.jpeg)\n\n将这些嵌套的 `for`\
    \ 循环与此处的嵌套 `while` 循环示例对比。\n\n![image](img/image00188.jpeg)\n\n`break.py`\n\n\
    ![image](img/image00276.jpeg)在内层循环的开始插入 `break` 语句以跳该循环——然后再次运行程序\n\n```python\n\
    if i == 2 and j == 1 :\n    print( ‘Breaks inner loop at i=2 j=1’ )\n    break\n\
    ```\n\n![image](img/image00282.jpeg)\n\nPython 的 `continue` 关键字用于在满足指定条件时跳过循环的单次迭代。`continue`\
    \ 语句位于循环语句块内部，其前面是一个测试表达式。当测试返回 `True` 时，该次迭代结束，程序进入下一次迭代。\n\n![image](img/image00277.jpeg)现在，在内层循环块的开始插入\
    \ `continue` 语句以跳过该循环的第一次迭代——然后再次运行程序\n\n```python\nif i == 1 and j == 1 :\n \
    \   print( ‘Continues inner loop at i=1 j=1’ )\n    continue\n```\n\n![image](img/image00283.jpeg)\n\
    \n![image](img/image00193.jpeg)\n\n当外层循环第二次运行内层循环时，`break` 语句会停止内层循环的所有三次迭代。\n\
    \n![image](img/image00188.jpeg)\n\n`continue.py`\n\n![image](img/image00193.jpeg)\n\
    \n当外层循环第一次运行时，`continue` 语句会跳过内层循环的第一次迭代。\n\n### 捕获错误\n\n程序中可以预判错误的部分（例如处理用户输入的部分）通常包含在\
    \ `try except` 块中以处理“异常错误”。要执行的语句被分组在 `try:` 块中，异常将传递给随后的 `except:` 块进行处理。可选情况下，后面可以跟一个\
    \ `finally:` 块，其中包含在异常处理后要执行的语句。\n\nPython 识别许多内置异常，例如在未找到变量名时发生的 `NameError`，在尝试访问不存在的列表索引时发生的\
    \ `IndexError`，以及在内置操作或函数接收不适当值时发生的 `ValueError`。\n\n每个异常都会返回一个描述性消息，可以使用 `as`\
    \ 关键字将其方便地赋值给变量。然后可以使用该变量来显示异常发生时的性质。\n\n![image](img/image00188.jpeg)\n\n`try.py`\n\
    \n![image](img/image00270.jpeg)通过初始化一个带有字符串值的变量启动一个新程序\n\n```python\ntitle = ‘Coding\
    \ for Beginners In Easy Steps’\n```\n\n![image](img/image00271.jpeg)接下来，添加一个 `try`\
    \ 语句块，尝试显示变量值——但错误地指定的名称\n\n```python\ntry :\n    print( titel )\n```\n\n![image](img/image00272.jpeg)现在，添加一个\
    \ `except` 语句块，在发生 `NameError` 时显示错误消息\n\n```python\nexcept NameError as msg :\n\
    \    print( msg )\n```\n\n![image](img/image00273.jpeg)保存并运行程序——查看错误如何被处理\n\n\
    ![image](img/image00284.jpeg)\n\n![image](img/image00194.jpeg)\n\n在某些编程语言中，这种结构被称为\
    \ try-catch 异常处理。\n\n可以通过在 `except` 块的括号内指定逗号分隔的异常类型列表来处理多个异常：\n\n```python\n\
    except ( NameError , IndexError ) as msg :\n    print( msg )\n```\n\n你还可以使用 `raise`\
    \ 关键字来强制解释器报告异常，通过指定要识别的异常类型并在括号中提供自定义的描述性消息。\n\n![image](img/image00188.jpeg)\n\
    \n`raise.py`\n\n![image](img/image00270.jpeg)通过初始化一个带有整数值的变量启动一个新的 Python 脚本\n\
    \n```python\nday = 32\n```\n\n![image](img/image00271.jpeg)接下来，添加一个 `try` 语句块来测试变量并指定异常\n\
    \n```python\ntry :\n    if day > 31 :\n        raise ValueError(Invalid Day’ )\n\
    ```\n\n![image](img/image00272.jpeg)现在，添加一个 `except` 语句块，在发生 `ValueError` 时显示消息\n\
    \n```python\nexcept ValueError as msg :\n    print( ‘The found An’ , msg )\n```\n\
    \n![image](img/image00273.jpeg)然后，添加一个 `finally` 语句来指定要执行的语句\n\n```python\nfinally\
    \ :\n    print( ‘But Today Is Beautiful.’ )\n```\n\n![image](img/image00276.jpeg)保存并运行程序——查看抛出的错误如何被处理\n\
    \n![image](img/image00281.jpeg)\n\n![image](img/image00193.jpeg)\n\n`try` 块中的语句在发生异常之前都会被执行。\n\
    \n#### 总结\n\n- `if` 关键字对表达式进行布尔值测试，结果为 `True` 或 `False`。\n- 条件分支通过 `else` 和 `elif`\
    \ 关键字提供了 `if` 测试的替代方案。\n- Python 测试表达式后必须跟随 `:` 字符，语句块相对于测试行缩进。\n- `for in` 循环遍历列表或字符串中的每个项。\n\
    - Python `for in` 循环语句后必须跟随 `:` 字符，语句块相对于语句缩进。\n- `range()` 函数生成一个数值序列，可用于指定 `for\
    \ in` 循环的长度。\n- `enumerate()` 函数可以指定列表名称以显示每个元素的索引及其存储的值。\n- `zip()` 函数可以显示多个列表中相同索引的存储值。\n\
    - `while` 循环在初始测试表达式保持为 `True` 时重复，在表达式变为 `False` 时结束。\n- Python `while` 循环语句后必须跟随\
    \ `:` 字符，语句块相对于语句缩进。\n- 计数器变量的值可以在测试表达式中进行测试，以控制循环迭代次数。\n- `break` 关键字用于测试表达式为\
    \ `True`，并在测试返回 `False` 时立即退出循环。\n- `continue` 关键字用于测试表达式为 `True`，并在测试返回 `False`\
    \ 时跳过单次迭代。\n- 预期的运行时异常错误可以通过将语句包含在 `try except` 块中来处理。\n- 可选，可以使用 `finally` 语句来指定在异常处理后执行的语句。\n\
    \n"
- fmt: "\nPrevious examples in this book have used built-in functions of the Python\
    \ programming language, such as the `print()` function. However, most programs\
    \ have a number of coder-defined custom functions that can be called as required\
    \ when the program runs.\n\nA custom Python function is created using the `def`\
    \ (definition) keyword followed by a name of your choice and `()` parentheses.\
    \ The coder can choose any name for a function except the keywords of the programming\
    \ language and the name of an existing built-in function. This line must end with\
    \ a `:` colon character, then the statements to be executed whenever the function\
    \ gets called must appear on lines below and indented. Syntax of a function definition,\
    \ therefore, looks like this:\n\n```python\ndef function-name():\n    statements-to-be-executed\n\
    ```\n\n![image](Images/image00286.jpeg)\n\nFunction statements must be indented\
    \ from the definition line by the same amount so the Python interpreter can recognize\
    \ the block.\n\nOnce the function statements have been executed, program flow\
    \ resumes at the point directly following the function call. This modularity is\
    \ very useful in programming to isolate set routines so they can be called upon\
    \ repeatedly.\n\nTo create custom functions it is necessary to understand the\
    \ accessibility (“scope”) of variables in a program:\n\n* Variables created outside\
    \ functions can be referenced by statements inside functions – they have “global”\
    \ scope\n* Variables created inside functions cannot be referenced from outside\
    \ the function in which they have been created – these have “local” scope\n\n\
    The limited accessibility of local variables means that variables of the same\
    \ name can appear in different functions without conflict.\n\n![image](Images/image00215.jpeg)\n\
    \nAvoid using global variables in order to prevent accidental conflict – use only\
    \ local variables where possible.\n\nIf you want to coerce a local variable to\
    \ make it accessible elsewhere it must first be declared with the Python `global`\
    \ keyword followed by its name only. It may subsequently be assigned a value that\
    \ can be referenced from anywhere in the program. Where a global variable and\
    \ a local variable have the same name, the function will use the local version.\n\
    \n![image](Images/image00188.jpeg)\n\n`def.py`\n\n![image](Images/image00287.jpeg)Start\
    \ a new program by initalizing a global variable\n\n```python\nglobal_var = 1\n\
    ```\n\n![image](Images/image00288.jpeg)Next, create a function named `my_vars()`\
    \ to display the value contained within the global variable\n\n```python\ndef\
    \ my_vars():\n    print('Global variable:', global_var)\n```\n\n![image](Images/image00289.jpeg)Now,\
    \ add indented statements to the function block to initialize a local variable\
    \ and display the value it contains\n\n```python\nlocal_var = 2\nprint('Local\
    \ variable:', local_var)\n```\n\n![image](Images/image00290.jpeg)Then, add indented\
    \ statements to the function block to create a coerced global variable and assign\
    \ an initial value\n\n```python\nglobal inner_var\ninner_var = 3\n```\n\n![image](Images/image00291.jpeg)Add\
    \ a statement after the function to call upon that function to execute the statements\
    \ it contains\n\n```python\nmy_vars()\n```\n\n![image](Images/image00292.jpeg)Finally,\
    \ add a statement to display the value contained in the coerced global variable\n\
    \n```python\nprint('Coerced Global:', inner_var)\n```\n\n![image](Images/image00293.jpeg)Save\
    \ then run the program – to see the custom function display the variable values\n\
    \n![image](Images/image00294.jpeg)\n\n![image](Images/image00194.jpeg)\n\nVariables\
    \ that are not global but appear in some outer scope can be addressed using the\
    \ `nonlocal` keyword.\n\n### Adding parameters\n\nWhen defining a custom function\
    \ in a program you may optionally specify a “parameter” name between the function’s\
    \ parentheses. An “argument” value can then be passed to that parameter by specifying\
    \ the value in the parentheses of the call to the function. The function can now\
    \ use that passed in value during its execution by referencing it via the parameter\
    \ name. For example, defining a function to accept a parameter to print out:\n\
    \n```python\ndef echo(user):\n    print('User:', user)\n```\n\n![image](Images/image00193.jpeg)\n\
    \nParameters are special variables for internal use only within a function – they\
    \ must adhere to the same naming rules as regular variables.\n\nA call to this\
    \ function must specify an argument value to be passed to the parameter in its\
    \ parentheses so it can be printed out:\n\n```python\necho('Mike')\n```\n\nMultiple\
    \ parameters can be specified in the function definition by including a comma-separated\
    \ list of parameter names within the function parentheses:\n\n```python\ndef echo(user,\
    \ lang, sys):\n    print('User:', user, 'Language:', lang, 'Platform:', sys)\n\
    ```\n\nWhen calling a function whose definition specifies parameters, the call\
    \ must include the same number of arguments as parameters. For example, to call\
    \ this example with multiple parameters:\n\n```python\necho('Mike', 'Python',\
    \ 'Windows')\n```\n\nThe passed values must appear in the same order as the parameter\
    \ list unless the caller also specifies the parameter names like this:\n\n```python\n\
    echo(lang='Python', user='Mike', sys='Windows')\n```\n\nOptionally, a default\
    \ value may be specified in the parameter list when defining a function. This\
    \ will be overridden when the caller specifies a value for that parameter but\
    \ will be used by the function when no argument value gets passed by the caller:\n\
    \n```python\ndef echo(user, lang, sys='Linux'):\n    print('User:', user, 'Language:',\
    \ lang, 'Platform:', sys)\n```\n\nThis means you may call the function fewer values\
    \ than the number of parameters specified, to use the default value, or pass the\
    \ same number of values as parameters to override it.\n\n![image](Images/image00194.jpeg)\n\
    \nName parameters as variables to make the data movement obvious.\n\n`param.py`\n\
    \n![image](Images/image00287.jpeg)Start a new program by defining a function with\
    \ three parameters that will print out passed-in argument values\n\n```python\n\
    def echo(user, lang, sys):\n    print('User:', user, 'Language:', lang, 'Platform:',\
    \ sys)\n```\n\n![image](Images/image00288.jpeg)Next, call the function passing\
    \ argument values to the function parameters in the order they appear\n\n```python\n\
    echo('Mike', 'Python', 'Windows')\n```\n\n![image](Images/image00289.jpeg)Now,\
    \ call the function passing string arguments to the function parameters by specifying\
    \ the parameter names\n\n```python\necho(lang='Python', sys='Mac OS', user='Anne')\n\
    ```\n\n![image](Images/image00290.jpeg)Then, define another function with two\
    \ parameters having default values that will print out parameter values\n\n```python\n\
    def mirror(user='Carole', lang='Python'):\n    print('\\nUser:', user, 'Language:',\
    \ lang)\n```\n\n![image](Images/image00291.jpeg)Finally, add statements to call\
    \ the second function both using and overriding default values\n\n```python\n\
    mirror()\nmirror(lang='Java')\nmirror(user='Tony')\nmirror('Susan', 'C++')\n```\n\
    \n![image](Images/image00292.jpeg)Save then run the program – to see the function\
    \ display the argument values or default parameter values\n\n![image](Images/image00295.jpeg)\n\
    \n![image](Images/image00194.jpeg)\n\nArguments are the actual data values passed\
    \ to function parameters by the function call.\n\n### Returning results\n\nLike\
    \ Python’s built-in `str()` function, which returns a string representation of\
    \ the value specified as its argument by the caller, your custom functions can\
    \ also return a value to their caller by using the `return` keyword to specify\
    \ a value to be returned. For example, to return to the caller the total of adding\
    \ two specified parameter values like this:\n\n```python\ndef sum(a, b):\n   \
    \ return a + b\n```\n\nThe returned result may be assigned to a variable by the\
    \ caller for subsequent use by the program like this:\n\n```python\ntotal = sum(8,\
    \ 4)\nprint('Eight Plus Four Is:', total)\n```\n\nOr the returned result may be\
    \ used directly “in-line” like this:\n"
