    [**Adding parameters**](#part0009.xhtml_sec2)


    [**Returning results**](#part0009.xhtml_sec3)


    [**Storing functions**](#part0009.xhtml_sec4)


    [**Importing functions**](#part0009.xhtml_sec5)


    [**Summary**](#part0009.xhtml_sec6)


    **Defining blocks**'
