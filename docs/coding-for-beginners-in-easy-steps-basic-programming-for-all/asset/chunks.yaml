  trans: "\n\n本书中之前的示例使用了 Python 编程语言的内置函数，例如 `print()` 函数。然而，大多数程序都有许多由编码员定义的自定义函数，这些函数可以在程序运行时根据需要进行调用。\n\
    \n自定义 Python 函数是使用 `def`（定义）关键字创建的，后面跟着你选择的名称和 `()` 括号。编码员可以为函数选择任何名称，但不能使用编程语言的关键字和现有内置函数的名称。此行必须以\
    \ `:`（冒号）结尾，然后每当函数被调用时要执行的语句必须出现在下方的行中并进行缩进。因此，函数定义的语法如下：\n\n```python\ndef function-name():\n\
    \    statements-to-be-executed\n```\n\n![image](img/image00286.jpeg)\n\n函数语句相对于定义行必须保持相同的缩进量，以便\
    \ Python 解释器识别该代码块。\n\n一旦函数语句执行完毕，程序流将从函数调用后的直接点继续执行。这种模块化在编程中非常有用，它可以隔离一组例程，以便重复调用。\n\
    \n要创建自定义函数，有必要理解程序中变量的可访问性（“作用域”）：\n\n*   函数外部创建的变量可以被函数内部的语句引用——它们具有“全局”作用域\n\
    *   函数内部创建的变量无法从创建它们的函数外部引用——这些具有“局部”作用域\n\n局部变量的访问访问限制意味着同名的变量可以出现在不同的函数中而不会产生冲突。\n\
    \n![image](img/image00215.jpeg)\n\n避免使用全局变量以防止意外冲突——尽可能只使用局部变量。\n\n如果你想强制转换一个局部变量使其在其他地方可访问，必须先用\
    \ Python 的 `global` 关键字对其声明，后仅跟其名称。随后可以给它赋值，该值可以在程序的任何地方被引用。当全局变量和局部变量具有同名时，函数将使用本地版本。\n\
    \n![image](img/image00188.jpeg)\n\n`def.py`\n\n![image](img/image00287.jpeg)通过初始化全局变量开始一个新程序\n\
    \n```python\nglobal_var = 1\n```\n\n![image](img/image00288.jpeg)接下来，创建一个名为 `my_vars()`\
    \ 的函数来显示全局变量中包含的值\n\n```python\ndef my_vars():\n    print('Global variable:',\
    \ global_var)\n```\n\n![image](img/image00289.jpeg)现在，在函数块中添加缩进语句来初始化局部变量并显示其包含的值\n\
    \n```python\nlocal_var = 2\nprint('Local variable:', local_var)\n```\n\n![image](img/image00290.jpeg)然后，在函数块中添加缩进语句来创建一个强制转换全局变量并分配初始值\n\
    \n```python\nglobal inner_var\ninner_var = 3\n```\n\n![image](img/image00291.jpeg)在函数后添加一条语句调用该函数以执行其包含的语句\n\
    \n```python\nmy_vars()\n```\n\n![image](img/image00292.jpeg)最后，添加一条语句显示强制转换全局变量中包含的值\n\
    \n```python\nprint('Coerced Global:', inner_var)\n```\n\n![image](img/image00293.jpeg)保存并运行程序——查看自定义函数显示变量值\n\
    \n![image](img/image00294.jpeg)\n\n![image](img/image00194.jpeg)\n\n不是全局变量但出现在某些外部作用域的变量可以使用\
    \ `nonlocal` 关键字进行处理。\n\n### 添加参数\n\n在程序中定义自定义函数时，你可以在函数的括号之间可选地指定一个“参数”名称。然后可以通过在函数调用的括号中指定值，将“参数”值传递给该参数。函数现在可以在执行期间通过参数名称引用它来使用该传递的值。例如，定义一个接受参数并打印的函数：\n\
    \n```python\ndef echo(user):\n    print('User:', user)\n```\n\n![image](img/image00193.jpeg)\n\
    \n参数是仅供函数内部使用的特殊变量——它们必须遵守与普通变量相同的命名规则。\n\n调用此函数必须指定一个参数值传递给其括号中的参数，这样才能将其打印出来：\n\
    \n```python\necho('Mike')\n```\n\n可以在函数定义中指定多个参数，方法是在函数括号内包含一个由逗号分隔的参数名称列表：\n\n\
    ```python\ndef echo(user, lang, sys):\n    print('User:', user, 'Language:', lang,\
    \ 'Platform:', sys)\n```\n\n调用定义中指定了参数的函数时，调用包含的参数数量必须与参数数量相同。例如，使用多个参数调用此示例：\n\
    \n```python\necho('Mike', 'Python', 'Windows')\n```\n\n传递的值必须按照参数列表相同的顺序出现，除非调用者也像这样指定参数名称：\n\
    \n```python\necho(lang='Python', user='Mike', sys='Windows')\n```\n\n在定义函数时，可以在参数列表中可选地指定一个默认值。当调用者为该参数指定一个值时，该值将被覆盖，但当调用者没有传递参数值时，函数将使用该值：\n\
    \n```python\ndef echo(user, lang, sys='Linux'):\n    print('User:', user, 'Language:',\
    \ lang, 'Platform:', sys)\n```\n\n这意味着你调用函数传递的值可以少于参数数量以使用默认值，或者传递与参数数量相同的值来覆盖它。\n\
    \n![image](img/image00294.jpeg)\n\n将参数命名为变量以使数据移动清晰可见。\n\n`param.py`\n\n![image](img/image00287.jpeg)通过定义一个具有三个参数的函数开始一个新程序，该函数将打印传入的参数值\n\
    \n```python\ndef echo(user, lang, sys):\n    print('User:', user, 'Language:',\
    \ lang, 'Platform:', sys)\n```\n\n![image](img/image00288.jpeg)接下来，按照参数出现的顺序传递参数值调用函数\n\
    \n```python\necho('Mike', 'Python', 'Windows')\n```\n\n![image](img/image00289.jpeg)现在，通过指定参数名称传递字符串参数调用函数\n\
    \n```python\necho(lang='Python', sys='Mac OS', user='Anne')\n```\n\n![image](img/image00290.jpeg)然后，定义另一个具有默认值的两个参数的函数，它将打印参数值\n\
    \n```python\ndef mirror(user='Carole', lang='Python'):\n    print('\\nUser:',\
    \ user, 'Language:', lang)\n```\n\n![image](img/image00291.jpeg)最后，添加语句既使用又覆盖默认值来调用第二个函数\n\
    \n```python\nmirror()\nmirror(lang='Java')\nmirror(user='Tony')\nmirror('Susan',\
    \ 'C++')\n```\n\n![image](img/image00292.jpeg)保存并运行程序——查看函数显示参数值或默认参数值\n\n![image](img/image00295.jpeg)\n\
    \n![image](img/image00194.jpeg)\n\n参数是通过函数调用传递给函数参数的实际数据值。\n\n### 返回结果\n\n就像 Python\
    \ 的内置函数 `str()` 返回调用者作为其参数指定的值的字符串表示一样，你的自定义函数也可以通过 `return` 关键字指定要返回的值来向调用者返回值。例如，向调用者返回两个指定参数值的和：\n\
    \n```python\ndef sum(a, b):\n    return a + b\n```\n\n调用者可以将返回的结果赋值给变量，供程序后续使用，如下：\n\
    \n```python\ntotal = sum(8, 4)\nprint('Eight Plus Four Is:', total)\n```\n\n或者返回的结果可以这样直接“内联”使用：\n\
    \n"
- fmt: "\n```\nprint( ‘Eight Plus Four Is:’ , sum( 8 , 4 ) )\n```\n\nTypically, a\
    \ return statement will appear at the very end of a function block to return the\
    \ final result of executing all statements contained in that function.\n\nA return\
    \ statement may, however, appear earlier in the function block to halt execution\
    \ of all subsequent statements in that block. This immediately resumes execution\
    \ of the program at the caller. Optionally, the return statement may specify a\
    \ value to be returned to the caller or the value may be omitted. Where no value\
    \ is specified, a default value of `None` is assumed. Typically, this is used\
    \ to halt execution of the function statements after a conditional test is found\
    \ to be `False`. For example, where a passed argument value is below a specified\
    \ number:\n\n```\ndef sum( a , b ) :\nif a < 5 :\n    return\nreturn a + b\n```\n\
    \n![image](Images/image00193.jpeg)\n\nYou can specify a default value for a parameter\
    \ in the function definition.\n\nIn this case, the function will return the default\
    \ value `None` when the first passed argument value is below five and the final\
    \ statement will not be executed.\n\nWhere the function is to perform arithmetic,\
    \ user input can be validated for integer values with the built-in `isdigit()`\
    \ function.\n\n![image](Images/image00188.jpeg)\n\nreturn.py\n\n![image](Images/image00287.jpeg)Start\
    \ a new program by initializing a variable with user input of an integer value\
    \ for manipulation\n\n```\nnum = input( ‘Enter An Integer:’ )\n```\n\n![image](Images/image00288.jpeg)Next,\
    \ add a function definition that accepts a single argument value to be passed\
    \ from the caller\n\n```\ndef square( num ) :\n```\n\n![image](Images/image00289.jpeg)Now,\
    \ insert into the function block an indented statement to validate the passed\
    \ argument value as an integer or halt further execution of the function’s statements\n\
    \n```\nif not num.isdigit() :\n    return ‘Invalid Entry’\n```\n\n![image](Images/image00290.jpeg)Then,\
    \ add indented statements to cast the passed argument value as an `int` data type\
    \ then return the sum of squaring that value to the caller\n\n```\nnum = int(\
    \ num )\nreturn num * num\n```\n\n![image](Images/image00291.jpeg)Finally, add\
    \ a statement to output a string and the returned value from the function call\n\
    \n```\nprint( num , ‘Squared Is:’ , square( num ) )\n```\n\n![image](Images/image00292.jpeg)Save\
    \ then run the program – to see the function display the returned values\n\n![image](Images/image00296.jpeg)\n\
    \n![image](Images/image00215.jpeg)\n\nRemember that user input is read as a `str`\
    \ data type – so must be cast into an `int` or `float` data type for arithmetic.\n\
    \n## Storing functions\n\nFunction definitions can usefully be stored in one or\
    \ more separate files for easier maintenance and to allow them to be used in several\
    \ programs without copying the definitions into each one. Each Python file storing\
    \ function definitions is called a “module” and the module name is the file name\
    \ without the `.py` extension.\n\nFunctions stored in the module are made available\
    \ to a program using the Python `import` keyword followed by the module name.\
    \ Although not essential, it is customary to put any import statements at the\
    \ beginning of the program.\n\nImported functions can be called using their name\
    \ dot suffixed after the module name. For example, a “steps” function from an\
    \ imported module named “ineasy” can be called with `ineasy.steps()`.\n\nWhere\
    \ functions stored in a module include parameters, it is often useful to assign\
    \ a default value to the parameter in the definition. This makes the function\
    \ more versatile as it becomes optional for the call to specify a parameter value.\n\
    \n![image](Images/image00188.jpeg)\n\ncat.py\n\n![image](Images/image00287.jpeg)Start\
    \ a new module by defining a function that supplies a default string value to\
    \ its parameter for display\n\n```\ndef purr( pet = ‘A Cat’ ) :\nprint( pet ,\
    \ ‘Says MEOW!’ )\n```\n\n![image](Images/image00288.jpeg)Next, add two more function\
    \ definitions that also supply default string values to their parameters for display\n\
    \n```\ndef lick( pet = ‘A Cat’ ) :\nprint( pet , ‘Drinks Milk’ )\n\ndef nap( pet\
    \ = ‘A Cat’ ) :\nprint( pet , ‘Sleeps By The Fire’ )\n```\n\n![image](Images/image00289.jpeg)Now,\
    \ save the file as “cat.py” so the module is named “cat”\n\n![image](Images/image00290.jpeg)Start\
    \ a new program with a statement to make the “cat” module functions available\n\
    \n```\nimport cat\n```\n\n![image](Images/image00188.jpeg)\n\nkitty.py\n\n![image](Images/image00291.jpeg)Next,\
    \ call each function without supplying an argument\n\n```\ncat.purr()\ncat.lick()\n\
    cat.nap()\n```\n\n![image](Images/image00292.jpeg)Now, call each function again\
    \ and pass an argument to each then save the file\n\n```\ncat.purr( ‘Kitty’ )\n\
    cat.lick( ‘Kitty’ )\ncat.nap( ‘Kitty’ )\n```\n\n![image](Images/image00293.jpeg)Start\
    \ another program by making the “cat” module functions available once more\n\n\
    ```\nimport cat\n```\n\n![image](Images/image00297.jpeg)Then request the user\
    \ enters a name to the default value\n\n```\npet = input( ‘Enter A Name:’ )\n\
    ```\n\n![image](Images/image00298.jpeg)Finally, call each function using the module\
    \ prefix\n\n```\ncat.purr( pet )\ncat.lick( pet )\ncat.nap( pet )\n```\n\n![image](Images/image00299.jpeg)Save\
    \ then run the programs – to see output from the module\n"
