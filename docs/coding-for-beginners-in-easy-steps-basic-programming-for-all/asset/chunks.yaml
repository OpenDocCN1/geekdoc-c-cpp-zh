    \ = 0 ;\n```\n\n![image](Images/image00290.jpeg)Add a statement to request user\
    \ input\n\n```csharp\nConsole.WriteLine( “Guess my number 1-20 : “ ) ;\n```\n\n\
    ![image](Images/image00291.jpeg)Then, add a loop statement that reads input into\
