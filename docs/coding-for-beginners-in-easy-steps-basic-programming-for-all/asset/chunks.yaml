    ‘‘‘ class-documentation-string ‘‘

    class-variable-declarations

    class-method-definitions

    ```


    The class declaration, which specifies its attributes and methods, is a blueprint
    from which working copies (“instances”) can be made. All variables declared within
    method definitions are known as “instance” variables and are only available locally
    within the method in which they are declared they cannot be directly referenced
    outside the class structure.


    ![image](Images/image00194.jpeg)


    It is conventional to begin class names with an uppercase character and object
    names with lowercase.


    Typically, instance variables contain data passed by the caller when an instance
    copy of the class is created. As this data is only available locally for internal
    use it is effectively hidden from the rest of the program. This technique of data
    “encapsulation” ensures that data is securely stored within the class structure
    and is the first principle of Object Oriented Programming (OOP).

