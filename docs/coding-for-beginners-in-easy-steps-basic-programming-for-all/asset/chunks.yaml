    ## 转换数据


    你通常需要转换数据以执行某些操作——例如算术运算或连接。算术运算可以在数值类型（如 `int` 和 `float`）上进行，而连接只能在字符串类型（如 `str`）上进行。


    Python 提供了几个内置函数允许你将数据转换为不同的类型。这些函数并不转换本身，而是返回一个转换后的表示。在编程术语中这被称为“强制转换”（cast）操作：


    | 函数: | 描述: |

    | :--- | :--- |

    | `int(x)` | 将 `x` 转换为整数 |

    | `float(x)` | 将 `x` 转换为浮点数 |

    | `str(x)` | 将 `x` 转换为字符串 |


    ![image](img/image0193.jpeg)代码中的数值不应放在引号内——引号内的数字将被视为字符串值！


    手动赋值给变量的数值会自动赋予相应的 `int` 或 `float` 类型。然而，通过内置 `input()` 函数赋值给变量的值始终是 `str` 数据类型——即使它们是数值！这意味着在进行算术运算之前，必须将它们转换（cast）为相应的数值类型。


    相反，手动赋值给变量的数值（自动赋予 `int` 或 `float` 类型）无法连接到字符串中。这意味着必须将它们转换为 `str` 数据类型以便包含在字符串中。


    在 Python 中，与其他许多编程语言一样，`+` 符号根据其上下文有多个用途。当 `+` 符号用于两个数值之间时，它执行加法（被称为“加法运算符”）；当
    `+` 符号用于两个字符串值之间时，它执行连接（被称为“连接运算符”）。赋值任何类型操作结果的变量将自动获得结果的数据类型。


    ![image](img/image0194.jpeg)


    对 `int` 和 `float` 数据类型共同进行的算术运算将自动转换为 `float` 结果。将值转换为 `float` 数据类型以允许小数输入。


