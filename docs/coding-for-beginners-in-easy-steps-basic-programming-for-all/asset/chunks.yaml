    ```python

    print( ‘Multiplication:\t’ , a , ‘x’ , b , ''='' , a * b )

    ```


    ![image](img/image00245.jpeg) 显示数字除法的结果，带有和不带浮点部分


    ```python

    print( ‘Division: \t’ , a , ‘÷’ , b , ''='' , a / b )

    print( ‘Floor Division:\t’ , a , ‘÷’ , b , ''='' , a // b )

    ```


