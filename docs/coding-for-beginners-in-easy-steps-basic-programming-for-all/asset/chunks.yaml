    ## Storing values


    One essential feature of all programming languages is the ability to store values.
    This ability is provided by a simple data structure called a “variable”. A variable
    is a container in which an item of data can be stored, much like a real-life object
    can be stored in a box.


    When creating a variable you give it a name, subject to the naming conventions
    of the language, that acts like a label on a box. The data stored within the variable
    can subsequently be retrieved using its name.


    Data to be stored in a variable is assigned in a Python program statement with
    the `=` operator. For example, to store the numeric value eight in a variable
    named `a`:


    ```

    a = 8

    ```


    The stored value can then be retrieved using the variable’s name, so that the
    statement `print( a )` will output the stored value `8`. That variable can subsequently
    be assigned a different value, so its value can vary as the program proceeds –
    hence the term “variable”.


    In Python programming a variable must be assigned an initial value (“initialized”)
    in the statement that declares it – otherwise the interpreter will report a “not
    defined” error.


    Multiple variables can be initialized with a common value in a single statement
    using a sequence of `=` assignments. For example, to initialize named `a`, `b`
    and `c` each with a numeric value of eight like this:


    ```

    a = b = c = 8

    ```


    Some programming languages, such as Java, demand you specify in its declaration
    what type of data a variable may contain. This reserves a specific amount of memory
    space and is known as “static typing”. Python variables, on the other hand, have
    no such limitation and adjust the memory allocation to suit the various data values
    assigned to their variables (“dynamic typing”). This means they can store integer
    whole numbers, floating-point numbers, text strings, or Boolean values of `True`
    or `False` as required.

