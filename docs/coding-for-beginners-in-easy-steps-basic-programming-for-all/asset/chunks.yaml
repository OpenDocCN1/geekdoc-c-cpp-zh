    ## 程序对象


    *本章演示了如何将虚拟对象编码到程序中*


    - 定义类

    - 复制实例

    - 处理属性

    - 派生类

    - 重写方法

    - 应用意义

    - 总结


    ### 定义类


    我们周围的真实对象每个都有我们可以描述的属性和行为。例如，一个汽车可以用“红色”属性和“加速”行为来描述。


    “类”是描述一组属性的原型。每个类都有一个包含函数和变量的数据结构。类的属性被称为数据“成员”。类函数成员被称为“方法”，而类变量成员（定义在类内但在方法定义之外）被称为“属性”。类成员可以通过点符号在程序中引用，在类名后加上成员名，语法为
    `class-name.method-name()` 或 `class-name.attribute-name`。


    ![image](img/image00336.jpeg)


    类声明以 `class` 关键字开头，后面跟着程序员指定的名称（遵循命名规范但首字母大写），然后是 `:` `:`。接下来是缩进语句，可选指定类文档字符串、类变量声明和类方法定义——因此类块的语法如下：


    ```python

    class ClassName :

    ‘’‘ class-documentation-string ‘‘

    class-variable-declarations

    class-method-definitions

    ```


    类声明指定了它的属性和方法，是从它可以创建工作副本（“实例”）的蓝图。所有在方法定义定义的变量都被称为“实例”变量，仅在定义它们的方法局部可用，无法在类结构之外直接引用。


    ![image](img/image00194.jpeg)


    习惯上类名以大写字母开头，对象名以小写字母开头。

