    all decimal numbers.


    ![image](Images/image00188.jpeg)


    inaccurate.py


    ![image](Images/image00195.jpeg)Start a new program by initializing two variables
    with floating-point values


    **item = 0.70**


    **rate = 1.05**


    ![image](Images/image00196.jpeg)Next, initialize two more variables by attempting
    floating-point arithmetic with the first two variables


    **tax = item * rate total = item + tax**


    ![image](Images/image00197.jpeg)Now, add statements to display variable values
    formatted to have two decimal places so trailing zeros are shown


    **print( ‘Item:\t’ , ‘%.2f’ % item )**


    **print( ‘Tax:\t’ , ‘%.2f’ % tax )**


    **print( ‘Total:\t’ , ‘%.2f’ % total )**


    ![image](Images/image00200.jpeg)Save then run the program – to see the output
    display an inaccurate addition total


    ![image](Images/image00320.jpeg)


    ![image](Images/image00188.jpeg)


    expanded.py


    ![image](Images/image00202.jpeg)To help understand this problem edit all three
    print statements to display the variable values expanded to 20 decimal places,
    then run the modified program


    **print( ‘Item:\t’ , ‘%.20f’ % item )**


    **print( ‘Tax:\t’ , ‘%.20f’ % tax )**


    **print( ‘Total:\t’ , ‘%.20f’ % total )**


    ![image](Images/image00321.jpeg)


    ![image](Images/image00194.jpeg)


    Here, the variable values are formatted using a string substitution technique
    to show two decimal places – described in more detail [here](#part0012.xhtml_page_114).


    ![image](Images/image00193.jpeg)


    This problem is not unique to Python – Java has a BigDecimal class that overcomes
    this problem in much the same way as the decimal module in Python.


    It is now clear that the tax value is represented numerically slightly below 0.735
    so gets rounded down to 0.73\. Conversely, the total value is represented numerically
    slightly above 1.435 so gets rounded up to 1.44, creating the apparent addition
    error.


    Errors in floating-point arithmetic can be avoided using Python’s “decimal” module.
    This provides a Decimal() object with which floating-point numbers can be more
    accurately represented.


    ![image](Images/image00188.jpeg)


    decimals.py


    ![image](Images/image00207.jpeg)Add a statement at the beginning of the program
    to import the “decimal” module to make all features available


    **from decimal import ***


    ![image](Images/image00212.jpeg)Next, edit the first two variable assignment to
    objects


    **item = Decimal( 0.70 )**


    **rate = Decimal( 1.05 )**


    ![image](Images/image00213.jpeg)Save the changes then run the modified program
    to see both tax and total representations will now get rounded down – so the output
    will show accurate addition when string formatting is changed back to two decimal
    places


    ![image](Images/image00321.jpeg)


    ![image](Images/image00194.jpeg)


    Always use the **Decimal()** object to calculate monetary values or anywhere that
    accuracy is essential.


    **Telling time**


    The Python “datetime” module can be imported into a program to make use of times
    and dates. It provides a datetime object with attributes of year, month, day,
    hour, minute, second, microsecond.


    A datetime object has a today() function that assigns the current date and time
    values to its attributes and returns them in a tuple. It also has a getattr()
    function that requires two arguments specifying the datetime object name and attribute
    to retrieve. Alternatively, the attributes can be referenced using dot notation
    such as datetime.year.


    ![image](Images/image00194.jpeg)


    As the datetime object is in a module of the same name, simply importing the module
    means it would be referenced as **datetime.datetime**. Use **from datetime import
    *** so it can be referenced just as **datetime** alone.


    All values in a datetime object are stored as numeric values but can be usefully
    transformed into text equivalents using its strftime() function. This requires
    a single string argument that is a “directive” specifying which part of the tuple
    to return and in what format. The possible directives are listed in the table
    below:


    | **Directive:** | **Returns:** |


    | **%A** | Full weekday name (%a for abbreviated day name) |


    | **%B** | Full month name (%b for abbreviated month name) |


    | **%c** | Date and time appropriate for locale |


    | **%d** | Day of the month number 1-31 |


    | **%f** | Microsecond number 0-999999 |


    | **%H** | Hour number 0-23 (24-hour clock) |


    | **%I** | Hour number 1-12 (12-hour clock) |


    | **%j** | Day of the year number 0-366 |


    | **%m** | Month number 1-12 |


    | **%M** | Minute number 0-59 |


    | **%p** | AM or PM equivalent for locale |


    | **%S** | Second number 0-59 |


    | **%w** | Week day number 0(Sunday)-6 |


    | **%W** | Week of the year number 0-53 |


    | **%X** | Time appropriate for locale (%x for appropriate date) |


    | **%Y** | Year 0001-9999 (%y for year 00-99) |


    | **%z** | Timezone offset from UTC as +HHMM or -HHMM |


    | **%Z** | Timezone name |


    ![image](Images/image00215.jpeg)


    As the **strftime()** function requires a string argument, the directive must
    be enclosed between quote marks.'
