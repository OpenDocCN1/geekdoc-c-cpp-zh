    When you begin to code longer programs it is useful to add comments at the start
    of each piece of code describing the purpose of that piece. This makes the code
    more easily understood by others, and by yourself when revisiting the code at
    a later date. In the Python programming language everything on a single line after
    a # hash character is ignored by the interpreter. This means that a single-line
    comment can be inserted after a # character.


