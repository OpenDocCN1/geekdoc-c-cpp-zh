    `float` 类。


    布尔值是一个逻辑真值。变量通过关键字 `True` 和 `False` 或者如果该值求值为 `True` 或 `False`，将赋值的值识别为属于 `bool`
    “类”。


    在 Python 编程中，通过在内置 `type()` 函数的括号内指定变量名，你可以轻松地发现存储在变量中的数据类型。


