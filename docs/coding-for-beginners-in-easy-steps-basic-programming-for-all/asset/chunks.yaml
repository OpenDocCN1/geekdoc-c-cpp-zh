    The technique of swapping elements with a selection sort algorithm, demonstrated
    in the previous example, works well but an alternative technique can be employed
    to simply insert elements into an array list at the correct ascending order position.


    An “insertion sort” algorithm examines the next element in the unsorted part of
    an array list and, if required, inserts the element at the correct ascending order
    position in the array list. To accommodate the inserted element, all other elements
    in the unsorted part of the list shift to the right – increasing the size of the
    sorted part of the array and decreasing its unsorted part. This process is repeated
    for each element in turn until all element values are sorted into ascending order.


    Insertion sort is a simple algorithm that is relatively easy to understand and
    code as a function algorithm. Along with the selection sort algorithm it is one
    of the two most efficient algorithms for sorting small arrays of 20 or so elements.
    Typically, insertion sort will require fewer comparisons than a selection sort
