    **print( ‘Python Version:‘ , sys.version )**


    ![image](Images/image00197.jpeg)Now, add a statement to display the actual location
    on your system of the Python interpreter


    **print( ‘Python Interpreter Location:‘ , sys.executable )**


    ![image](Images/image00200.jpeg)Then, add statements to display a list of all
    directories where the Python interpreter looks for module files


    **print( ‘Python Module Search Path: ‘ )**


    **for folder in sys.path :**


    **print( folder )**


    ![image](Images/image00202.jpeg)Finally, add statements to display a list all
    the Python keywords


    **print( ‘Python Keywords: ‘ )**


    **for word in keyword.kwlist :**


    **print( word )**


    ![image](Images/image00207.jpeg)Save and then run the program – to see details
    of the Python version on your own system


    ![image](Images/image00318.jpeg)


    ![image](Images/image00193.jpeg)


    The first item on the Python search path is your current directory – so any file
    within there or within any subdirectories you make there will be found by the
    Python interpreter.


    ![image](Images/image00194.jpeg)


    Spend a little time with the Interactive Mode help utility to discover lots more
    about Python.


    **Doing mathematics**


    Python includes a “math” module that provides lots of functions you can use to
    perform mathematical procedures once imported.


    The math.ceil() and math.floor() functions enable a program to perform rounding
    of a floating point value specified between their parentheses to the closest integer
    – math.ceil() rounds up and math.floor() rounds down but the value returned, although
    an integer, is a float data type rather than an int data type.'
