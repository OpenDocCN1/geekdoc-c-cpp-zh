    The position within the file, from which to read or at which to write, can be
    finely controlled by the file object’s `seek()` function. This accepts an integer
    argument specifying how many characters to move position as an offset from the
    start of the file.


    The current position within a file can be discovered at any time by calling the
    file object’s `tell()` function to return an integer location.


    When working with file objects it is good practice to use the Python `with` keyword
    to group the file operational statements within a block. This technique ensures
    that the file is properly closed after operations end, even if an exception is
    raised on the way, and much shorter than writing equivalent `try except` blocks.


    ![image](Images/image00188.jpeg)


    update.py


    ![image](Images/image00225.jpeg)Start a new program by assigning a string value
    to a variable containing text to be written in a file


    ```python

    text = ‘The political slogan “Workers Of The World Unite!” \nis from The Communist
    Manifesto.’

    ```


    ![image](Images/image00226.jpeg)Next, add statements to write the text string
    into a file and display the file’s current status in the “with” block


    ```python

    with open( ‘update.txt’ , ‘w’ ) as file :

    file.write( text )

    print( ‘\nFile Now Closed?:’ , file.closed )

    ```


    ![image](Images/image00227.jpeg)Now, add a non-indented statement after the “with”
    code block to display the file’s new status


    ```python

    print( ‘File Now Closed?:’ , file.closed )

    ```


    ![image](Images/image00228.jpeg)Then, re-open the file and display its contents
    to confirm it now contains the entire text string


    ```python

    with open( ‘update.txt’ , ‘r+’ ) as file :

    text = file.read()

    print( ‘\nString:’ , text )

    ```


    ![image](Images/image00231.jpeg)Next, add indented statements to display the current
    file position, then reposition and display that new position


    ```python

    print( ‘\nPosition In File Now:’ , file.tell() )

    position = file.seek( 33 )

    print( ‘Position In File Now:’ , file.tell() )

    ```


    ![image](Images/image00232.jpeg)Now, add an indented statement to overwrite the
    text from the current file position


    ```python

    file.write( ‘All Lands’ )

    ```


    ![image](Images/image00240.jpeg)Then, add indented statements to reposition in
    the file once more and overwrite the text from the new position


    ```python

    file.seek( 61 )

    file.write( ‘the tombstone of Karl Marx.’ )

    ```


    ![image](Images/image00332.jpeg)Finally, add indented statements to return to
    the start of the file and display its entire updated contents


    ```python

    file.seek( 0 )

    text = file.read()

    print( ‘\nString:’ , text )

    ```


    ![image](Images/image00333.jpeg)Save then run the program – to see the file strings
    get updated


    ![image](Images/image00335.jpeg)


    ![image](Images/image00194.jpeg)


    The `seek()` function may optionally accept a second argument value of `0`, `1`,
    or `2` to move the specified number of characters from the start, current, or
    end position respectively – zero is the default start position.


    ![image](Images/image00193.jpeg)


    As with strings, the first character in a file is at index position zero – not
    at index position one.


    ## Summary


    - Strings can be manipulated by operators for concatenation `+` , to join strings
    together, and for repetition `*` of strings

    - Strings can be manipulated by operators for slice `[ ]`, and range slice `[
    : ]` , that reference the index number of string characters

    - Strings can be manipulated by membership operators `in` and `not in` that seek
    to match a specified character within a string

    - The `r` (or `R`) raw string operator can be placed immediately before a string
    to suppress any escape characters it contains

    - A “docstring” is a descriptive string within triple quote marks at the start
    of a module, class, or function, to define its purpose

    - The `__doc__` attribute can be used to reference the string description within
    a docstring

    - The `__builtins__` module can be examined using the `dir()` function to reveal
    the names of default functions and variables

    - A `str` object has a `format()` function for string formatting and many functions
    for string modification, such as `capitalize()`

    - Replacement fields in a string to be formatted using the `format` function are
    denoted in a comma-separated list by `{ }` braces

    - Strings can also be formatted using the C-style `%s` substitution operator to
    mark places in a string where text is to be inserted

    - A file object has `open()`, `read()`, `write()`, and `close()` functions for
    working with files, and features that describe the file properties

    - The `open()` function must specify a file name string argument and a file mode
    string parameter, such as ’r’ to read the file

    - A opened file object has information properties that reveal its current status,
    such as `mode` and `readable()` values

    - Position in a file, at which to read or write, can be specified with the `seek()`
    method and reported by the `tell()` function

    - The Python `with` keyword groups file operational statements within a block
    and automatically closes an open file


