  trans: "\n\n计算机仅仅是一台能够快速处理一组简单指令的机器。它所处理的指令集被称为“程序”，而这些指令被称为“代码”。\n\n编写计算机程序的人被称为“程序员”或“编码员”。他们的程序使计算机在现代生活的几乎每个领域都变得有用：\n\
    \n-   **在手中** – 计算机存在于手机设备中，用于语音、文本和社交媒体通信等任务\n-   **在家中** – 计算机存在于电视、游戏主机和洗衣机等家用设备中\n\
    -   **在办公室** – 计算机存在于台式设备中，用于文字处理、工资发放和图形设计等任务\n-   **在商店** – 计算机存在于自动提取机（ATM）和条形扫描仪等零售设备中\n\
    -   **在汽车里** – 计算机存在于控制设备中，用于发动机管理、防锁刹车和安全任务\n-   **在空中** – 计算机存在于飞机中用于飞行，存在于空中交通控制中心用于安全导航\n\
    \n![image](img/image00192.jpeg)\n\n事实上，这些只是计算机如何影响我们今天生活的几个例子。然而，计算机其实非常笨！它们只能从\
    \ 0 数到 1，不能独立思考。\n\n计算机是电子组件的集合——统称为“硬件”。为了使计算机运行，必须给它一组程序指令——被称为“软件”。\n\n每个计算机程序都必须提供清晰的分步指令，以便计算机能够无错误地执行，这是非常重要的。因此，编码员必须将计算机所需的任务分解为简单、无歧的步骤。例如，一个将移动机器人从室内移动到户外的程序必须包含让机器人定位门框并绕过任何障碍物的指令。因此，编码员必须始终考虑程序可能会遇到哪些可能的意外困难。\n\
    \n程序指令必须以计算机能够理解的语言呈现给计算机。在最基础的层，计算机可以理解“机器码”，它通过在内存中移动项目来执行任务。这种晦涩的低级代码极其枯燥，因为即使执行一个简单的任务也需要许多行指令。\n\
    \n幸运的是，多年来，已经开发了许多“高级”编程语言，允许编码员以更易于人类阅读的形式编写指令。这些现代高级程序通过“编译器”或“解释器”自动翻译计算机可以理解的机器码。为了成为一名编码员，你通常必须至少学习这些高级编程语言之一：\n\
    \n-   **C** – 一种强大的编译语言，与机器码紧密对应，用于开发操作系统\n-   **C++** – 一种在 C 的基础上开发的增强型编译语言，为面向对象编程（OOP）提供类\n\
    -   **C#** – 一种由微软设计的现代编译语言，用于 .NET 框架和通用语言基础结构\n-   **Java** – 一种可移植的编译语言，设计用于运行在不取决于硬件架构的任何平台上\n\
    -   **Python** – 一种动态解释型语言，同时允许函数式编程和面向对象编程（OOP）\n\n![image](img/image00193.jpeg)\n\
    \n用解释语言编写的程序可以立即运行，但用编译语言编写的程序在运行之前必须先编译。\n\n就像人类语言有相似之处（如动词和名词）一样，这些编程语言也有相似之处，因为它们都拥有用于存储信息的“数据结构”，以及决定程序如何运行的“控制结构”。\n\
    \n书中的示例使用 Python 语言来演示如何编写计算机程序，因为它具有简单的语法、不需要编译、包含大型标准函数库，并可以用于创建控制台程序和窗口化 GUI（图形用户界面）应用。\n\
    \n![image](img/image00194.jpeg)\n\nPython 是一个“自带电池”的完整软件包（batteries included）。\n\
    \n## 设置\n\n在开始用 Python 语言编写程序之前，你需要通过安装 Python 解释器和自带的经过测试的代码模块标准库在你的计算机上设置编程环境。你可以从\
    \ Python 软件基金会在免费下载。\n\n![image](img/image00195.jpeg)\n\n启动网络浏览器并导航到 [python.org/downloads](http://python.org/downloads)，然后点击\
    \ Downloads 按钮获取适用于系统的最新版本——在本例中它是“Python 3.4.2”\n\n![image](img/image00196.jpeg)\n\
    \n下载完成后，运行安装程序并选择为所有用户安装还是仅为你自己安装，然后点击 Next 按钮继续\n\n![image](img/image00197.jpeg)\n\
    \n现在，接受建议的默认安装位置，这将是你的根目录 `C:\\` 上的一个名为“Python”加上版本号的目录——在本例中，它是 Python 3.4.2\
    \ 版本的目录 `C:\\Python34`\n\n![image](img/image00198.jpeg)\n\n![image](img/image00199.jpeg)\n\
    \nMac OS X 和其他平台的安装程序也可以在 **[python.org/downloads](http://python.org/downloads)**\
    \ 免费获取\n\n![image](img/image00194.jpeg)\n\n请接受建议的目标目录——例如此处建议的 `C:\\Python34`。\n\
    \n![image](img/image00200.jpeg)\n\n点击 Next 按钮继续，然后确保选择“将 `python.exe` 添加到 Path”功能\n\
    \n![image](img/image00201.jpeg)\n\n![image](img/image00202.jpeg)\n\n点击 Next 开始将文件复制到你的计算机，然后点击\
    \ Finish 按钮完成安装\n\n安装完成后，Python 组被添加到你的开始/应用程序菜单。该组中最重要的是启动 Python 开发环境的 IDLE\
    \ 项\n\n![image](img/image00203.jpeg)\n\n![image](img/image00194.jpeg)\n\n将 Python\
    \ 添加到系统 Path 可以使其在任何目录中使用。安装后，你可以在命令提示符输入命令 `python -V` 来查看解释器响应的版本号\n\n![image](img/image00194.jpeg)\n\
    \n你会经常使用 IDLE 启动器，因此右键点击其图标并选择“固定到任务栏”，以便从桌面快速访问\n\n## 探索 IDLE\n\n安装的 Python 软件包包含集成开发环境\
    \ (IDLE)，你可以在其中轻松编写和运行用 Python 语言编写的程序或片段。IDLE 提供了两个不同的窗口：\n\n- Shell \n- 编辑窗口\n\
    \n当你启动 IDLE 时，它会打开一个包含菜单栏、描述版本的横和一个 `>>>` 提示符的新窗口。这就是 Shell 窗口，你可以在提示符处输入语句与 Python\
    \ 解释器直接交互\n\n![image](img/image00204.jpeg)\n\n如果解释器理解你的输入，它将给出相应的回复，否则它将报告错误。\n\
    \n你可以通过在交互式提示符处输入 Python `print()` 函数语句，并在括号内用引号包含字符串，来让解释器打印出文本字符串\n\n![image](img/image00194.jpeg)\n\
    \n大多数编程语言都将文本字符串包含在引号内，以区别于程序代码。按照习惯，Python 编码员使用单引号\n\n你还可以通过在提示符处输入有效的算术和语句，让解释器打印出简单算术和的结果\n\
    \n如果你的语句无效，例如尝试除以零的算术和，解释器将打印出能够帮助地描述错误性质的错误信息\n\n"
