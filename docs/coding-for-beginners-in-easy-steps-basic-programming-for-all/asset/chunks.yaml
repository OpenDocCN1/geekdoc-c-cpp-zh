    • The standard Python library has a `random` module that provides functions to
    generate pseudo-random numbers

    • A pseudo-random floating-point number from 0.0 to 1.0 can be generated by the
    random module’s `random()` function

    • Multiple unique random integers within a given range can be generated by the
    random module’s `sample()` function

    • A program plan should define the program’s Purpose, required Functionality,
    and the Interface widgets needed

    • In designing a program interface the `grid()` layout manager positions widgets
    in rows and columns

    • Static properties do not change during execution of a program

    • Dynamic properties do change during execution of a program using runtime functionality
    to respond to a user action

    • Upon completion, a program should be tested to ensure it performs as expected
    in every respect

    • Program files can be “frozen” into a bundle for distribution to other computers
    where the Python interpreter is not present

    • The `cx_Freeze` tool uses Python’s “disutils” package to freeze programs into
    executables for Windows, Mac, or Linux

