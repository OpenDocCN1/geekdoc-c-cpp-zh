  raw: '![image](Images/image00272.jpeg)Save the file then run the program – to see
    each small Label now displays an ellipsis and that the “Reset” Button has been
    disabled


    ![image](Images/image00385.jpeg)


    ![image](Images/image00193.jpeg)


    Button states are recognized by **tkinter** constants of **DISABLED** (off), **NORMAL**
    (on), or **ACTIVE** (pressed).


    **Adding functionality**


    Having created code to initialize dynamic properties, on the previous page, you
    can now add runtime functionality to respond to clicks on the Button widgets during
    execution of the program.


    ![image](Images/image00188.jpeg)


    lotto.py


    ![image](Images/image00270.jpeg)Modify the program on the previous page by inserting
    one more new section just before the final loop statement, which begins by making
    the sample() function available from the “random” module


    **# Dynamic Properties:**


    **from random import sample**


    ![image](Images/image00271.jpeg)Next, define a function that generates and assigns
    six unique random numbers to the small Labels and reverses the state of both Buttons


    **def pick() :**


    **nums = sample( range( 1, 49 ), 6 )**


    **label1.configure( text = nums[0] )**


    **label2.configure( text = nums[1] )**


    **label3.configure( text = nums[2] )**


    **label4.configure( text = nums[3] )**


    **label5.configure( text = nums[4] )**


    **label6.configure( text = nums[5] )**


    **getBtn.configure( state = DISABLED )**


    **resBtn.configure( state = NORMAL )**


    ![image](Images/image00272.jpeg)Now, define a function to display an ellipsis
    on each small Label and revert both Buttons to their initial states


    **def reset() :**


    **label1.configure( text = ‘...’ )**


    **label2.configure( text = ‘...’ )**


    **label3.configure( text = ‘...’ )**


    **label4.configure( text = ‘...’ )**


    **label5.configure( text = ‘...’ )**


    **label6.configure( text = ‘...’ )**


    **getBtn.configure( state = NORMAL )**


    **resBtn.configure( state = DISABLED )**


    ![image](Images/image00273.jpeg)Then, add statements to nominate the relevant
    function to be called when each Button is pressed by the user


    **getBtn.configure( command = pick )**


    **resBtn.configure( command = reset )**


    ![image](Images/image00276.jpeg)Finally, save the file – the complete program
    should look like that shown below


    ![image](Images/image00386.jpeg)


    ![image](Images/image00194.jpeg)


    These steps provide comparable functionality to that of the console application
    [here](#part0015.xhtml_page_159).


    ![image](Images/image00193.jpeg)


    It is convention to place all **import** statements at the start of the script
    but they can appear anywhere, as listed here.


    **Testing programs**


    Having worked through the program plan, on the previous pages, the widgets needed
    and functionality required have now been added to the application – so it’s ready
    to be tested.


    ![image](Images/image00270.jpeg)Launch the application and examine its initial
    appearance


    ![image](Images/image00387.jpeg)


    Static text appears on the window title bar and on the Button widgets, the window’s
    resize button is disabled, the small Labels contain their initial ellipsis text
    values, and the “Reset” button is in its initial disabled state.


    ![image](Images/image00271.jpeg)Next, click the “Get My Lucky Numbers” Button
    widget – to execute all the statements within the pick() function


    ![image](Images/image00388.jpeg)


    A series of numbers within the desired range is displayed and the Button states
    have changed as required – a further series of numbers cannot be generated until
    the application has been reset.


    ![image](Images/image00272.jpeg)Make a note of the numbers generated in this first
    series for comparison later


    ![image](Images/image00193.jpeg)


    No number is repeated in any series because the random **sample()** function returns
    a set of unique random integers.


    ![image](Images/image00273.jpeg)Click the “Reset” Button widget – to execute all
    the statements within the reset() function and see the application resume its
    initial appearance as required


    ![image](Images/image00389.jpeg)


    ![image](Images/image00276.jpeg)Click the “Get My Lucky Numbers” Button widget
    again – to execute its pick() function again and confirm that the new series of
    numbers differ from the first series


    ![image](Images/image00390.jpeg)


    ![image](Images/image00277.jpeg)Finally, restart the application and click the
    “Get My Lucky Numbers” Button widget once more – and confirm that this first series
    of numbers are different to those noted in the first series when the application
    last ran


    ![image](Images/image00391.jpeg)


    ![image](Images/image00193.jpeg)


    The series of generated numbers are not repeated each time the application gets
    launched because the random generator is seeded by the current system time – which
    is different each time the generator gets called.


    **Deploying applications**


    Your apps developed in the Python language can be deployed on Windows systems
    where the Python interpreter is not installed. To do so, all the program files
    must be “frozen” into a bundle that includes an executable (.exe) file to create
    a simple MSI installer. The “cx_Freeze” tool is a free set of scripts and modules
    for freezing Python programs available at [cx-freeze.sourceforge.net](http://cx-freeze.sourceforge.net)


    The cx_Freeze tool uses Python’s “distutils” package and requires a setup script
    to describe your module distribution in order to bundle appropriate support for
    your application. The setup script is traditionally named setup.py and consists
    mainly of a call to a cx_Freeze setup() function – supplying information as parameter
    pairs. This specifies any required build options, such as image files or modules
    to be included, and identifies the executable script and system platform type.
    For example, the setup script for the application developed throughout this chapter
    must include the logo image file lotto.gif and specify the final code script named
    lotto.py as the executable script. Once cx_Freeze is installed, a setup script
    can be executed from a Windows Command Prompt with the argument bdist-msi – to
    create a sub-directory named “dist” containing a distributable MSI installer for
    your app.


    ![image](Images/image00194.jpeg)


    The cx_Freeze tool can also create executable files for Mac and Linux systems.
    Discover more on cx_Freeze online at **[cx_freeze.readthedocs.org](http://cx_freeze.readthedocs.org)**
    setup.py


    ![image](Images/image00188.jpeg)


    setup.py


    ![image](Images/image00270.jpeg)In IDLE start a Python setup script by making
    available the “sys” module and items from the “cx_Freeze” module


    **import sys**


    **from cx_Freeze import setup, Executable**


    ![image](Images/image00271.jpeg)Next, add statements to identify the base platform
    in use


    **base = None**


    **if sys.platform == ‘win32’ : base = ‘Win32GUI’**


    ![image](Images/image00272.jpeg)Now, add a statement listing options to be included


    **opts = { ‘include_files’ : [ ‘lotto.gif’ ] , ‘includes’ : [ ‘re’ ] }**


    ![image](Images/image00273.jpeg)Finally, add a call to the setup() function passing
    all information as parameter pairs


    **setup( name = ‘Lotto’**,


    **version = ‘1.0’**,


    **description = ‘Lottery Number Picker’**,


    **author = ‘Mike McGrath’**,


    **options = { ‘build_exe’ : opts }**,


    **executables = [ Executable( ‘lotto.py’, base= base ) ] )**


    ![image](Images/image00276.jpeg)Save the setup script alongside the application
    files then run the script command to create the Windows installer


    ![image](Images/image00392.jpeg)


    ![image](Images/image00277.jpeg)Wait until the process creates the installer in
    a “dist” sub-directory then copy the installer onto portable media, such as a
    USB flash drive


    ![image](Images/image00379.jpeg)Now, copy the installer onto another Windows computer
    where Python may not be present and run the installer


    ![image](Images/image00380.jpeg)Then, select an installation location, or accept
    the suggested default location


    ![image](Images/image00393.jpeg)


    ![image](Images/image00394.jpeg)'
