    ## Doing arithmetic


    The arithmetical “operators” commonly used in coding computer programs use a `+`
    symbol for addition and a `-` symbol for subtraction, as you would expect. Typically,
    they also use an `*` asterisk for multiplication, rather than an `x` symbol, and
    a `/` forward slash for division, rather than a `÷` symbol.


    The arithmetical operators used to code Python programs are listed in the table
    below, together with the operation they perform:


    | Operator: | Operation: |

    | :--- | :--- |

    | `+` | Addition |

    | `-` | Subtraction |

    | `*` | Multiplication |

    | `/` | Division |

    | `%` | Remainder |

    | `//` | Floor division |

    | `**` | Exponent |


    The `+` operator adds two numbers together and the `-` operator subtracts the
    second number from the first number.


    The `*` operator multiplies the first number by the second number and the `/`
    operator divides the first number by the second number.


    The `%` remainder operator divides the first number by the second number and returns
    the remainder of the operation. This is useful to determine if a number has an
    odd or even value.


    The `//` floor division operator performs just like the `/` division operator
    but truncates the result at the decimal point – removing any floating point part
    from the resulting number.


    The `**` exponent operator returns the result of the first number raised to the
    power of the second number.


    ![image](Images/image0019.jpeg)


    Values used with operators to form expressions are called “operands” – in the
    expression `2 + 3` the numerical values `2` and `3` are the operands.


    ![image](Images/image00188.jpeg)


    arithmetic.py


    ![image](Images/image00241.jpeg) Start a new program by creating two variables
    containing whole numbers (integers)


    ```python

    a = 8

    b = 2

    ```


    ![image](Images/image00242.jpeg) Next, display the result of adding the numbers


    ```python

    print( ‘Addition: \t’ , a , ''+'' , b , ''='' , a + b )

    ```


    ![image](Images/image00243.jpeg) Now, display the result of subtracting the numbers


    ```python

    print( ‘Subtraction:\t’ , a , ''-'' , b , ''='' , a - b )

    ```


    ![image](Images/image00244.jpeg) Then, display the result of multiplying the numbers


    ```python

    print( ‘Multiplication:\t’ , a , ‘x’ , b , ''='' , a * b )

    ```


    ![image](Images/image00245.jpeg) Display the result of dividing the numbers, both
    with and without the floating-point part


    ```python

    print( ‘Division: \t’ , a , ‘÷’ , b , ''='' , a / b )

    print( ‘Floor Division:\t’ , a , ‘÷’ , b , ''='' , a // b )

    ```


    ![image](Images/image00246.jpeg) Next, display the remainder after dividing the
    numbers


    ```python

    print( ‘Remainder:\t’ , a , ‘%’ , b , ''='' , a % b )

    ```


    ![image](Images/image00247.jpeg) Finally, display the result of raising the first
    number to the power of the second number


    ```python

    print( ‘Exponent:\t ‘ , a , ‘² = ’ , a ** b , sep = '''' )

    ```


    ![image](Images/image00248.jpeg) Save then run the program to see the result of
    the arithmetical operations


    ![image](Images/image00249.jpeg)


    ![image](Images/image00215.jpeg)


