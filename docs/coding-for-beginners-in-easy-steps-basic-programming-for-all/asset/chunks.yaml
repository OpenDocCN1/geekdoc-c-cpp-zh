    ![image](Images/image00294.jpeg)


    ![image](Images/image00194.jpeg)


    Variables that are not global but appear in some outer scope can be addressed
    using the **nonlocal** keyword.


    **Adding parameters**


    When defining a custom function in a program you may optionally specify a “parameter”
    name between the function’s parentheses. An “argument” value can then be passed
    to that parameter by specifying the value in the parentheses of the call to the
    function. The function can now use that passed in value during its execution by
    referencing it via the parameter name. For example, defining a function to accept
    a parameter to print out:


    **def echo( user ) :**


    **print( ‘User:’ , user )**


    ![image](Images/image00193.jpeg)


    Parameters are special variables for internal use only within a function – they
    must adhere to the same naming rules as regular variables.


    A call to this function must specify an argument value to be passed to the parameter
    in its parentheses so it can be printed out:


    **echo( ‘Mike’ )**


    Multiple parameters can be specified in the function definition by including a
    comma-separated list of parameter names within the function parentheses:


    **def echo( user , lang , sys ) :**


    **print( User:’ , user , ‘Language:’ , lang , ‘Platform:’ , sys )**


    When calling a function whose definition specifies parameters, the call must include
    the same number of arguments as parameters. For example, to call this example
    with multiple parameters:


    **echo( ‘Mike’ , ‘Python’ , ‘Windows’ )**


    The passed values must appear in the same order as the parameter list unless the
    caller also specifies the parameter names like this:


    **echo( lang = ‘Python’ , user = ‘Mike’ , sys = ‘Windows’ )**


    Optionally, a default value may be specified in the parameter list when defining
    a function. This will be overridden when the caller specifies a value for that
    parameter but will be used by the function when no argument value gets passed
