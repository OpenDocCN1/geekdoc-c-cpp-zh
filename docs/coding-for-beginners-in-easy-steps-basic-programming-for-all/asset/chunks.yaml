    The values in a regular list can be changed as the program proceeds. Each element
    may be assigned a replacement value using the `=` assignment operator to specify
    the list name, element index number, and the replacement value. In programming
    terms the values stored in a regular list are “mutable” – they can be changed.
    Elements can also be dynamically added to a regular list, and dynamically removed
    from a regular list, as the program proceeds. This means that a regular list is
    ideal if your program will make changes to element values.


    Where a list will only contain constant values, that will never change when the
    program runs, a fixed list can better be created. In programming terms, the values
    stored in a fixed list are “immutable” – they cannot be changed. Elements cannot
    be dynamically added to a fixed list, or dynamically removed from a fixed list,
    as the program proceeds. This means that a fixed list is ideal if your program
    will never make changes to element values.


    ![image](Images/image00193.jpeg)


    ### Tuples


    Like index numbering, with lists the items in a tuple sequence are numbered from
    zero.


    A restrictive immutable Python list is known as a “tuple” and is created by assigning
    values as a comma-separated list between parentheses in a process known as “tuple
    packing”:


    ```

    colors_tuple = ( ‘Red’ , ‘Green’ , ‘Red’ , ‘Blue’, ‘Red’ )

    ```


    An individual tuple element can be referenced using the tuple name followed by
    square brackets containing that element’s index number. Usefully, all values stored
    inside a tuple can be assigned to individual variables in a process known as “sequence
    unpacking”:


    ```

    a , b , c , d , e = colors_tuple

    ```


    Regular list methods, such as `sort()` and `reverse()`, cannot be used on tuples
    but the built-in Python `type()` function can be used to reveal the data class
    type and the built-in `len()` function can be used to return the length of the
    tuple.


    ![image](Images/image00215.jpeg)


    There must be the same number of variables as items to unpack a tuple.


    Typically, a tuple is used to store values that are a collection of constant unchanging
    values such as day-of-the-week names, month-of-the-year names, or personal details
    of first name, last name, date-of-birth, address, phone number, etc.


    ![image](Images/image00188.jpeg)


    tuple.py


    ![image](Images/image00257.jpeg)Start a new program by initializing a tuple then
    display its class type


    ```

    days = ( ‘Mon’ , ‘Tue’ , ‘Wed’ , ‘Thu’ , ‘Fri’ , ‘Sat’ , ‘Sun’ )

    print( ‘days:’ , type( days ) )

    ```


    ![image](Images/image00258.jpeg)Next, display the entire contents of the tuple,
    its length, and the value stored in its first element


    ```

    print( ‘Days of the week:’ , days )

    print( ‘No. of days in week:’ , len( days ) )

    print( ‘Start day of week:’ , days[0] )

    ```


    ![image](Images/image00259.jpeg)Now, initialize another tuple containing some
    personal details of a user


    ```

    user = ( ‘John’ , ‘Doe’ , ‘Paris’ , ‘555-1234’ )

    ```


    ![image](Images/image00260.jpeg)Then, display the user’s full name


    ```

    print( ‘Name:’ , user[0] , user[1] )

    ```


    ![image](Images/image00261.jpeg)Finally, display the user’s phone number


    ```

    print( ‘Phone:’ , user[3] )

    ```


    ![image](Images/image00262.jpeg)Save then run this program – to see the tuple
    values


    ![image](Images/image00265.jpeg)


    ![image](Images/image00194.jpeg)


    A tuple may contain items that are not unique to its other elements.


    ### Sets


    The values in a regular list or a fixed list tuple can be repeated in its elements,
    but a list of unique values can be created where duplication is not allowed. A
    restrictive Python list of unique values is known as a “set” and is created by
    assigning values as a comma-separated list between curly brackets (braces) like
    this:


    ```

    phonetic_set = { ‘Alpha’ , ‘Bravo’ , ‘Charlie’ }

    ```


    ![image](Images/image00194.jpeg)


    A set may not contain items that are not unique to its other elements.


    Unlike regular lists or tuples, individual elements in a set cannot be referenced
    using the set name followed by square brackets containing an index number. Instead,
    sets have powerful methods that can be dot-suffixed to the set name for manipulation
    and comparison of values:


    | Set Method: | Description: |

    | :--- | :--- |

    | `set.add(x)` | Adds item `x` to the set |

    | `set.update(x,y,z)` | Adds multiple items to the set |

    | `set.copy()` | Returns a copy of the set |

    | `set.pop()` | Removes one random item from the set |

    | `set.discard(i)` | Removes item at position `i` from the set |

    | `set1.intersection(set2)` | Returns items that appear in both sets |

    | `set1.difference(set2)` | Returns items in `set1` but not in `set2` |


    The built-in Python `type()` function can be used to reveal the data class type.
    The built-in `len()` function can be used to return the length of the set. The
    `in` operator can be used to search the set for specific values.


    ![image](Images/image00257.jpeg)Start a new program by initializing a set with
    unique values then display its class type


    ```

    party_goers = { ‘Andrew’ , ‘Barbara’ , ‘Carole’ , ‘David’ }

    print( ‘party_goers:’ , type( party_goers ) )

    ```


    ![image](Images/image00258.jpeg)Next, add statements to search the set elements
    for two values


    ```

    print( ‘Did David go to the party?’ , ‘David’ in party_goers )

    print( ‘Did Kelly go to the party?’ , ‘Kelly’ in party_goers )

    ```


    ![image](Images/image00259.jpeg)Now, initialize another set with unique values


    ```

    students = { ‘Andrew’ , ‘Kelly’ , ‘Lynn’ , ‘David’ }

    ```


    ![image](Images/image00260.jpeg)Then, create a further set containing only common
    values that appear in both previous sets


    ```

    commons = party_goers.intersection( students )

    ```


    ![image](Images/image00261.jpeg)Initialize a regular list of the common values
    – so the elements values can be individually accessed


    ```

    party_students = list( commons )

    ```


    ![image](Images/image00262.jpeg)Finally, display all common values and the value
    stored in the first regular list element


    ```

    print( ‘Students at the party:’ , party_students )

    print( ‘First student at the party:’ , party_students[0] )

    ```


    ![image](Images/image00266.jpeg)Save then run this program – to see the set values


    ![image](Images/image00267.jpeg)


    ![image](Images/image00215.jpeg)Notice that the `list()` function may not place
    element values in the same order as they appear in the set.


    ### Dictionaries


    In Python programming a “dictionary” is a data container that can store multiple
    items of data as a list of key:value pairs. Unlike regular list container values,
    which are referenced by their index number, values stored in dictionaries are
    referenced by their associated key. The key must be unique within that dictionary
    and is typically a string name, although numbers may be used.


    Creating a dictionary is simply a matter of assigning the key:value pairs as a
    comma-separated list between curly brackets (braces) to a name of your choice.
    Strings must be enclosed within quotes, as usual, and a `:` colon character must
    come between the key and its associated value.


    ![image](Images/image00194.jpeg)


    In other programming languages a list is often called an “array” and a dictionary
    is often called an “associative array”.

