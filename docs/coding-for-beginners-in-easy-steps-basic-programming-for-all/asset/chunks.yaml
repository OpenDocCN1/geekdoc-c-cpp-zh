    \ to call upon a constructor to create a window object\n\n```python\nwindow =\
    \ Tk()\n```\n\n![image](Images/image00259.jpeg)Now, add a statement to specify\
    \ a title for this window\n\n```python\nwindow.title( ‘Label Example’ )\n```\n\
    \n![image](Images/image00260.jpeg)Then, add a statement to call upon a constructor\
    \ to create a label object\n\n```python\nlabel = Label( window , text = ‘Hello\
    \ World!’ )\n```\n\n![image](Images/image00261.jpeg)Use the packer to add the\
    \ label to the window with both horizontal and vertical padding for positioning\n\
    \n```python\nlabel.pack( padx = 200 , pady = 50 )\n```\n\n![image](Images/image00262.jpeg)Finally,\
    \ add the mandatory statement to maintain the window by capturing events\n\n```python\n\
    window.mainloop()\n```\n\n![image](Images/image00266.jpeg)Save then run the program\
    \ – to see a window appear containing a label widget\n\n![image](Images/image00353.jpeg)\n\
    \n![image](Images/image00193.jpeg)\n\nWidgets will not appear in the window when\
    \ running the program unless they have been added with a geometry manager.\n\n\
    ## Responding buttons\n\nA `Button` widget provides a graphical button in an application\
    \ window that may contain either text or an image to convey the button’s purpose.\
    \ A button object is created by specifying the window name and options as arguments\
    \ to a `Button()` constructor. Each option is specified as an option=value pair.\
    \ The `command` option must always specify the name of a function or method to\
    \ call when the user clicks that button. The most popular options are listed below\
    \ together with a brief description:\n\n| **Option:** | **Description:** |\n\n\
    | **activebackground** | Background color when the cursor is over |\n| **activeforeground**\
    \ | Foreground color when the cursor is over |\n| **bd** | Border width in pixels\
    \ (default is 2) |\n| **bg** | Background color |\n| **command** | Function to\
    \ call when clicked |\n| **fg** | Foreground color |\n| **font** | Font for button\
    \ label |\n| **height** | Button height in text lines, or pixels for images |\n\
    | **highlightcolor** | Border color when in focus |\n| **image** | Image to be\
    \ displayed instead of text |\n| **justify** | Multiple text lines as LEFT, CENTER,\
    \ or RIGHT |\n| **padx** | Horizontal padding |\n| **pady** | Vertical padding\
    \ |\n| **relief** | Border style of SUNKEN, RIDGE, RAISED or GROOVE |\n| **state**\
    \ | Enabled status of NORMAL or DISABLED |\n| **underline** | Index number in\
    \ text of character to underline |\n| **width** | Button width in letters, or\
    \ pixels for images |\n| **wraplength** | Length at which to wrap text |\n\n![image](Images/image00194.jpeg)\n\
    \nYou can also call a button’s `invoke()` method to, in turn, call the function\
    \ nominated to its `command` option.\n\nThe values assigned to other options determine\
    \ the widget’s appearance. These can be altered by specifying a new option=value\
    \ pair as an argument to the widget’s `configure()` method. Additionally, a current\
    \ option value can be retrieved by specifying its name as a string argument to\
    \ the widget’s `cget()` method.\n\n![image](Images/image00188.jpeg)\n\nbutton.py\n\
    \n![image](Images/image00257.jpeg)Start a new program by making GUI features available\
    \ then create a window and specify a title\n\n```python\nfrom tkinter import ***\n\
    window = Tk()\nwindow.title( ‘Button Example’ )\n```\n\n![image](Images/image00258.jpeg)Next,\
    \ create a button to exit the program when clicked\n\n```python\nbtn_end = Button(\
    \ window , text = ‘Close’ , command=exit )\n```\n\n![image](Images/image00259.jpeg)Now,\
    \ add a function to toggle the window’s background color when another button gets\
    \ clicked\n\n```python\ndef tog() :\n    if window.cget( ‘bg’ ) == ‘yellow’ :\n\
    \        window.configure( bg = ‘gray’ )\n    else :\n        window.configure(\
    \ bg = ‘yellow’ )\n```\n\n![image](Images/image00260.jpeg)Then, create a button\
    \ to call the function when clicked\n\n```python\nbtn_tog = Button( window , text\
    \ = ‘Switch’ , command=tog )\n```\n\n![image](Images/image00261.jpeg)Add the buttons\
    \ to the window with positional padding\n\n```python\nbtn_end.pack( padx = 150\
    \ , pady = 20 )\nbtn_tog.pack( padx = 150 , pady = 20 )\n```\n\n![image](Images/image00262.jpeg)Finally,\
    \ add the loop to capture this window’s events\n\n```python\nwindow.mainloop()\n\
    ```\n\n![image](Images/image00266.jpeg)Save then run the program and click the\
    \ button – to see the window’s background color change\n\n![image](Images/image00354.jpeg)\n\
    \n![image](Images/image00355.jpeg)\n\n![image](Images/image00215.jpeg)\n\nOnly\
    \ the function name is specified to the `command` option. Do not add trailing\
    \ parentheses in the assignment.\n\n![image](Images/image00194.jpeg)\n\nThe ‘gray’\
    \ color is the original default color.\n\n## Displaying messages\n\nA program\
    \ can display messages to the user by calling methods provided in the “tkinter.messagebox”\
    \ module. This must be imported separately:\n\n| **Method:** | **Icon:** | **Buttons:**\
    \ |\n| :--- | :--- | :--- |\n| `showinfo()` | ![image](Images/image00356.jpeg)\
    \ | OK |\n| `showwarning()` | ![image](Images/image00357.jpeg) | OK |\n| `showerror()`\
    \ | ![image](Images/image00358.jpeg) | OK\n| `askquestion()` | ![image](Images/image00359.jpeg)\
    \ | Yes, No |\n| `askokcancel()` | ![image](Images/image00360.jpeg) | OK, Cancel\
    \ |\n| `askyesno()` | ![image](Images/image00359.jpeg) | Yes, No |\n| `askretrycancel()`\
    \ | ![image](Images/image00360.jpeg) | Retry, Cancel |\n\nThe `askyesno()` method\
    \ returns two values – Yes (1) and No (0). Those that return a value can be used\
    \ for conditional branching by testing that value. Those that do not return a\
    \ value when the button gets clicked.\n\nmessage.py\n\n```python\nfrom tkinter\
    \ import ***\nimport tkinter.messagebox as box\n\nwindow = Tk()\nwindow.title(\
    \ ‘Message Box’ )\n\ndef dialog() :\n    var = box.askyesno( ‘Message Box’ , ‘Proceed?’\
    \ )\n    if var == 1 :\n        box.showinfo( ‘Yes Box’, ‘Proceeding...’ )\n \
    \   else :\n        box.showwarning( ‘No Box’, ‘Canceling...’ )\n\nbtn = Button(\
    \ window , text = ‘Click’ , command=dialog )\nbtn.pack( padx = 150 , pady = 50\
    \ )\nwindow.mainloop()\n```\n\nOptions can be added as a third argument to these\
    \ method calls. For example, add `type='abortretryignore'` to get three buttons.\n\
    \n## Gathering entries\n\nAn `Entry` widget provides a single-line input field\
    \ in an application where the program can gather entries from the user.\n"
