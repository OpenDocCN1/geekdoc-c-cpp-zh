  raw: 'The expression in parentheses returns True when the value of variable a is
    less than that of variable b – so in this case the lesser value of variable a
    gets assigned to variable c.


    Similarly, replacing the < less than operator in the test expression with the
    > greater than operator would assign the greater value of variable b to variable
    c.


    Another common use of the conditional expression incorporates the % remainder
    operator in the test expression to determine if the value of a variable is an
    odd number or an even number:


    ***if-true(odd)-do-this* if ( var % 2 != 0 ) else *if-false(even)-do-this***


    Where the result of dividing the variable value by two does leave a remainder,
    the number is odd – where there is no remainder the number is even. The test expression
    ( var % 2 == 1 ) would have the same effect but it is preferable to test for inequality
    – it’s easier to spot when something is different than when it’s identical.


    ![image](Images/image00194.jpeg)


    In general programming terms an “expression” always returns a value, whereas a
    “statement” need not – but a statement may include one or more expressions.


    ![image](Images/image00193.jpeg)


    The conditional expression has, in effect, three operands – the test expression
    and two possible return values.


    ![image](Images/image00188.jpeg)


    condition.py


    ![image](Images/image00241.jpeg)Start a new program by initializing two variables
    with integer values for conditional evaluation


    **a = 1**


    **b = 2**


    ![image](Images/image00242.jpeg)Next, add statements to display the results of
    conditional evaluation – describing the first variable’s value


    **print( ‘\nVariable a Is :’ , ‘One’ if ( a == 1 ) else ‘Not One’ )**


    **print( ‘Variable a Is :’ , ‘Even’ if ( a % 2 == 0 ) else ‘Odd’ )**


    ![image](Images/image00243.jpeg)Now, add statements to display the results of
    conditional evaluation – describing the second variable’s value


    **print( ‘\nVariable b Is :’ , ‘One’ if ( b == 1 ) else ‘Not One’ )**


    **print( ‘Variable b Is :’ , ‘Even’ if ( b % 2 == 0 ) else ‘Odd’ )**


    ![image](Images/image00244.jpeg)Then, add a statement to assign the result of
    a conditional evaluation to a new variable


    **top = a if ( a > b ) else b**


    ![image](Images/image00245.jpeg)Finally, add a statement to display the assigned
    result – identifying the greater of the two variable values


    **print( ‘\nGreater Value Is:’ , top )**


    ![image](Images/image00246.jpeg)Save then run this program – to see the result
    of conditional expression operations


    ![image](Images/image00253.jpeg)


    ![image](Images/image00215.jpeg)


    You may find that some Python programmers dislike conditional expressions as they
    consider its syntax contradicts the principle of easy readability.


    **Setting order**


    Operator precedence determines the order in which expressions get evaluated. For
    example, in the expression 3 * 8 + 4 the default order of precedence determines
    that multiplication with the * multiply operator is completed first, so the result
    is 28 (24 + 4).


    The table below lists Python’s operator precedence in descending order – those
    on the top row have highest precedence, those on lower rows have successively
    lower precedence. The precedence of operators on the same row is chained Left-To-Right.


    | **Operator:** | **Description:** |


    | ****** | Exponent |


    | **+** | Positive |


    | **-** | Negative |


    | **~** | Bitwise NOT |


    | ***** | Multiplication |


    | **/** | Division |


    | **//** | Floor division |


    | **%** | Remainder |


    | **+** | Addition |


    | **-** | Subtraction |


    | **&#124;** | Bitwise OR |


    | **^** | Bitwise XOR |


    | **&** | Bitwise AND |


    | **>>** | Bitwise right shift |


    | **<<** | Bitwise left shift |


    | **>, >=, <, <=, ==, !=** | Comparison |


    | **= , %= , /= , //= , -= , += , *= , **=** | Assignment |


    | **is , is not** | Identity |


    | **in , not in** | Membership |


    | **not** | Boolean NOT |


    | **and** | Boolean AND |


    | **or** | Boolean OR |


    ![image](Images/image00193.jpeg)


    The ***** multiply operator is on a higher row than the **+** addition operator
    – so in the expression **3 * 8 + 4** multiplication is completed first, before
    the addition.


    ![image](Images/image00194.jpeg)


    Bitwise operators are used for low-level manipulation so are omitted from this
    book. Identity and membership operators are introduced later but are included
    here for completeness.


    ![image](Images/image00188.jpeg)


    order.py


    ![image](Images/image00241.jpeg)Start a new program by initializing three variables
    with integer values for precedence comparison


    **a = 2**


    **b = 4**


    **c = 8**


    ![image](Images/image00242.jpeg)Next, add statements to display the results of
    default precedence and forcing addition before multiplication


    **print( ‘\nDefault Order:\t’, a, ‘*’, c,’+’, b, ‘=’, a * c + b )**


    **print( ‘Forced Order:\t’, a, ‘* (‘, c,’+’, b, ‘) =’, a * ( c + b ) )**


    ![image](Images/image00243.jpeg)Now, add statements to display the results of
    default precedence and forcing subtraction before division


    **print( ‘\nDefault Order:\t’, c, ‘//’, b, ‘-’, a, ‘=’, c // b - a )**


    **print( ‘Forced Order:\t’, c, ‘// (‘, b,’-’, a, ‘) =’, c // ( b - a ) )**


    ![image](Images/image00244.jpeg)Finally, add statements to display the results
    of default precedence and forcing addition before remainder operation and before
    exponent operation


    **print( ‘\nDefault Order:\t’, c, ‘%’, a, ‘+’, b, ‘=’, c % a + b )**


    **print( ‘Forced Order:\t’, c, ‘% (‘, a, ‘+’, b, ‘) =’, c % ( a + b ) )**


    **print( ‘\nDefault Order:\t’, c, ‘**’, a, ‘+’, b, ‘=’, c ** a + b )**


    **print( ‘Forced Order:\t’, c, ‘** (‘, a, ‘+’, b, ‘) =’, c ** ( a + b ) )**


    ![image](Images/image00245.jpeg)Save then run this program – to see the results
    of default and explicit precedence


    ![image](Images/image00254.jpeg)


    ![image](Images/image00193.jpeg)


    The **//** floor division operator truncates floating point values at the decimal
    point – but the **/** division operator retains them.


    ![image](Images/image00215.jpeg)


    Do not rely upon default precedence – always use parentheses to clarify your expressions.


    **Summary**


    •Arithmetical operators can form expressions with two operands for addition +,
    subtraction -, multiplication *, division /, floor division //, remainder %, or
    exponent **


    •The % remainder operator is useful to determine whether a number is an odd or
    even value


    •Floor division with the // operator removes any floating-point part from the
    result


    •The assignment = operator can be combined with an arithmetical operator to perform
    an arithmetical calculation then assign its result


    •The += operator is useful to add a value onto an existing value stored in a variable
    to make a combined total value


    •Comparison operators can form expressions comparing two operands for equality
    ==, inequality !=, greater >, lesser <, greater or equal >=, and lesser or equal
    <= values


    •Logical and and or operators form expressions evaluating two operands to return
    a Boolean value of True or False


    •The logical not operator returns the inverse Boolean value of a single operand
    - turning True to False , and vice versa


    •The not operator is useful to toggle a value between True and False on successive
    iterations of a loop


    •A conditional if-else expression evaluates a given expression for a Boolean True
    or False value then returns one of two operands depending on its result


    •Expressions containing multiple operators will execute their operations in accordance
    with the default precedence rules unless explicitly determined by the addition
    of parentheses ( )


    •Typically, addition + and subtraction - will be performed before multiplication
    * and division / unless explicitly specified


    4


    **Making lists**


    *This chapter demonstrates how to create code to store data in lists and how to
    retrieve data from lists*.


    [**Writing lists**](#part0007.xhtml_sec1)


    [**Changing lists**](#part0007.xhtml_sec2)


    [**Fixing lists**](#part0007.xhtml_sec3)


    [**Setting lists**](#part0007.xhtml_sec4)


