    - The Python built-in `input()` function can assign input to a variable and may
    optionally specify a string to be displayed

    - The Python built-in `print()` function can specify multiple values for output
    as a comma-separated list in its parentheses.

    - By default, the `print()` function will automatically add a `\n` newline after
    its output unless an end alternative is specified.

    - The `+` concatenation operator can join two strings together.

    - Data types are essentially `str` text strings, `int` integer numbers, `float`
    decimal numbers, or `bool` Boolean truth values.

    - Booleans are logical truth values that are represented in Python by the `True`
    and `False` keywords.

    - The Python built-in `type()` function can identify to which class data type
    a value in any specified variable belongs.

    - Values assigned to a variable by the Python built-in `input()` function are
    always appointed the `str` string data type.

    - Data types can be converted for manipulation using the Python built-in `int()`,
    `float()`, and `str()` casting functions.

    - Arithmetic performed on an `int` integer number and a `float` decimal number
    will produce a `float` data type result.

    - Syntax errors due to incorrect code are recognized by the interpreter before
    execution of the program.

    - Runtime errors due to exceptions are recognized by the interpreter during execution
    of the program.

    - Semantic errors due to unexpected performance are not recognized by the interpreter.


