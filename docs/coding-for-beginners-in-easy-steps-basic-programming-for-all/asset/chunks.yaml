    \n![image](img/image00194.jpeg)\n\n## 规划需求\n\n在创建新的图形化应用程序时，先花时间规划设计是有用的。明确定义程序的精确目的，决定需要哪些应用程序功能，然后决定需要哪些界面组件。\n\
    \n![image](img/image00376.jpeg)\n\n一个彩票条目的简单应用程序计划可能如下：\n\n**程序目的**\n\n- 程序将在\
    \ 1-49 范围内生成一组六个随机数，并具有重置的能力\n\n**所需的功能**\n\n- 生成并显示六个唯一随机数的函数\n- 清除显示器上最后六个随机数的函数\n\
