    **Partitioning sorts**


    The technique of dividing an array list into sub-sections around the array’s mid-point
    with a merge sort algorithm, demonstrated in the previous example, works well
    but an alternative technique can be employed to partition an array list around
    a “pivot” point.


    A “quick sort” algorithm is a complex sorting algorithm that also employs the
    “divide and conquer” strategy. This first specifies a particular array element
    whose value will act as the pivot. The algorithm then repeatedly divides the array
    into two “partitions” – one partition containing values less than the pivot and
    the other partition containing values more than the pivot. Once the partition
    operation is complete, the final pivot is in its correct position so the algorithm
    then merges the lesser partition with the pivot and the greater partition into
    a single sorted list.


    Quick sort is a complex algorithm that can be coded as a function algorithm, which
    makes “recursive” calls to repeatedly divide an array. Quick sort is a fast algorithm
    that compares element values when dividing the elements into partitions.


    ![image](Images/image00316.jpeg)


    ![image](Images/image00193.jpeg)


    In this example the array is only small but the quick sort algorithm efficiently
    partitions then re-assembles large arrays in exactly the same way.


    Opinions vary as to which element is best to choose as the pivot in the quick
    sort algorithm. Some coders like to choose a middle element, as in the merge sort
    algorithm in the previous example. Others prefer to choose the first or last element,
    or an element at some arbitrary position in between – like the example opposite.


