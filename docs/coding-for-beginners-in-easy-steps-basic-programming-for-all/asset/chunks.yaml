    A class can have only one method with a given name – method overloading is not
    supported in Python.


    Object Oriented Programming with Python allows data encapsulation, inheritance,
    and polymorphism. Base class methods can be overridden by like-named methods in
    derived classes. Python does not, however, support the technique of “overloading”
    found in other languages – in which methods of the same name can be created with
    different parameter lists in a single class.


    **Summary**


    •Programming objects are like virtual representations of real-world objects describing
    attributes and behaviors in a “class”


    •A class is a data structure prototype describing object properties with its methods
    and attribute members


    •Each class declaration begins with the class keyword and is followed by an indented
    code block that may contain a class document string, class variables, and class
    methods


    •Class variables have global scope but instance variables (declared within method
    definitions) have only local scope


    •Instance variables encapsulate data securely in a class structure and are initialized
    when a class instance is created


    •Properties of a class are referenced by dot notation and are addressed internally
    using the self prefix


    •A class instance is a copy of the prototype that automatically calls its __init__()
    method when the instance is first created


    •An attribute of a class can be added, modified, or removed using dot notation
    or manipulated using the built-in functions getattr(), hasattr(), setattr(), and
    delattr()


    •The name of attributes automatically supplied by Python begin with an underscore
    character to notionally indicate privacy


    •A derived class inherits the method and attribute members of the parent base
    class from which it is derived


    •The declaration of a derived class must state the name of its parent base class
    in parentheses after its own class name


    •A method of a derived class can override a matching method of the same name in
    its parent base class


    •A method of a base class can be called explicitly using the base class name for
    identification


    •Python is a duck-typed language that supports polymorphism for like-named methods
    of multiple classes


    •The three cornerstones of Object Oriented Programming (OOP) are Encapsulation,
    Inheritance, and Polymorphism


    11


    **Building interfaces**


    *This chapter demonstrates how to code graphical windowed programs*.


    [**Launching interfaces**](#part0014.xhtml_sec1)


    [**Responding buttons**](#part0014.xhtml_sec2)


    [**Displaying messages**](#part0014.xhtml_sec3)


    [**Gathering entries**](#part0014.xhtml_sec4)


    [**Listing options**](#part0014.xhtml_sec5)


    [**Polling radios**](#part0014.xhtml_sec6)


    [**Checking boxes**](#part0014.xhtml_sec7)


    [**Adding images**](#part0014.xhtml_sec8)


    [**Summary**](#part0014.xhtml_sec9)


    **Launching interfaces**


    The standard Python module that you can use to create graphical applications is
    called “tkinter” – a **t**ool**k**it to **inter**face with the system GUI (Graphical
    User Interface).


    The tkinter module can be imported into a program like any other module to provide
    attributes and methods for windowed apps. Every tkinter program must begin by
    calling the Tk() constructor to create a window object. The window’s size can
    optionally be specified as a *‘widthxheight’* string argument to the window object’s
    geometry() method. Similarly, the window’s title can be specified as a *‘title’*
    string argument to the window object’s title() method. If not specified default
    size and title values will be used.


    ![image](Images/image00215.jpeg)


    There can be only one call to the **Tk()** constructor and it must be at the start
    of the program code.


    Every tkinter program must also call the window object’s mainloop() method to
    capture events, such as when the user closes the window to quit the program. This
    loop should appear at the end of the program as it also handles window updates
    that may be implemented during execution.


    With tkinter, all the graphical controls that can be included in the application
    window, such as buttons or checkboxes, are referred to as “widgets”. Perhaps the
    simplest widget is a non-interactive label object that merely displays text or
    an image in the app interface. A label object can be created by specifying the
    window object’s name and text=*’string’* as arguments to a Label() constructor.


    Once created, each widget, such as a label, must then be added to the window using
    one of these “geometry manager” methods:


    •pack() – places the widget against a specified side of the window using TOP,
    BOTTOM, LEFT, or RIGHT constant values specified to its side= argument


    •place() – places the widget at XY coordinates in the window using numerical values
    specified to its x= and y= arguments


    •grid() – places the widget in a cell within the window using numerical values
    specified to row= and column= arguments


    ![image](Images/image00194.jpeg)


    The grid() geometry manager method is demonstrated in the example [here](#part0015.xhtml_page_161).


    Optionally, the pack() method may include a fill argument to expand the widget
    in available space. For example, with fill = ‘x’. Alternatively, the pack() method
    may include padx and pady arguments to expand the widget along an axis a specified
    amount.


    ![image](Images/image00188.jpeg)


    window.py


    ![image](Images/image00257.jpeg)Start a new program with a statement to make the
    “tkinter” module GUI methods and attributes available'
