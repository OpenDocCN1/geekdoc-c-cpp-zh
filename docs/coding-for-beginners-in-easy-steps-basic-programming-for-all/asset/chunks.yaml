    \ == 1 or num == 3 :\n    print( ‘Number Is 1 or 3’ )\n```\n![image](Images/image00273.jpeg)Save\
    \ then run the program – to see conditional branching in action\n\n![image](Images/image00274.jpeg)\n\
    \n![image](Images/image00193.jpeg)\n\nThe user input is read as a string value\
    \ by default so must be cast as an `int` data type with `int()` for arithmetical\
    \ comparison.\n\n![image](Images/image00194.jpeg)\n\nThe `and` keyword ensures\
    \ the evaluation is `True` only when both tests succeed, whereas the `or` keyword\
    \ ensures the evaluation is `True` when either test succeeds.\n\n### Counting\
    \ loops\n\nAs in other programming languages, the Python `for` keyword loops over\
    \ all items in any list specified to the `in` keyword. In Python, this statement\
    \ must end with a `:` colon character and statements to be executed on each iteration\
    \ of the loop must be indented:\n\n```python\nfor each-item in list-name :\n \
    \   statements-to-execute-on-each-iteration\n```\n\nBecause a string is simply\
    \ a list of characters, the `for in` statement can loop over each character. Similarly,\
    \ a `for in` statement can loop over each element in a list, each item in a tuple,\
    \ each member of a set, or each key in a dictionary.\n\n![image](Images/image00275.jpeg)\n\
    \nThe `for` loop in Python is unlike that in other languages such as `C` as it\
    \ does not allow step size and end to be specified.\n\nA `for in` loop iterates\
    \ over the items of any list or string in the order that they appear in the sequence\
    \ but you cannot directly specify the number of iterations to make, a halting\
    \ condition, or the size of iteration step. You can, however, use the Python `range()`\
    \ function to iterate over a sequence of numbers by specifying a numeric end value\
    \ within its parentheses. This will generate a sequence that starts at zero and\
    \ continues up to, but not including, the specified end value. For example, `range(5)`\
    \ generates `0,1,2,3,4`.\n\nOptionally, you can specify both a start and end value\
    \ within the parentheses of the `range()` function, separated by a comma. For\
    \ example, `range(1,5)` generates `1,2,3,4`. Also, you can specify a start value,\
    \ end value, and a step value to the `range()` function as a comma-separated list\
    \ within its parentheses. For example, `range(1,14,4)` generates `1,5,9,13`.\n\
    \nYou can specify the list’s name within the parentheses of Python’s `enumerate()`\
    \ function to display each element’s index number and its associated value.\n\n\
    ![image](Images/image00193.jpeg)\n\nThe `range()` function can generate a sequence\
    \ that decreases, counting down, as well as those that count upward.\n\nWhen looping\
    \ through multiple lists simultaneously, the element values of the same index\
    \ number in each list can be displayed together by specifying the list names as\
    \ a comma-separated list within the parentheses of Python’s `zip()` function.\n\
    \nWhen looping through a dictionary, you can display each key and its associated\
    \ value using the dictionary `items()` method and specifying two comma-separated\
    \ variable names to the `for` keyword – one for the key name and the other for\
    \ its value.\n\n![image](Images/image00188.jpeg)\n\nfor.py\n\n![image](Images/image00270.jpeg)Start\
    \ a new program by initializing a regular list, a fixed tuple list, and an associative\
    \ dictionary list\n\n```python\nchars = [ ‘A’ , ‘B’, ‘C’ ]\nfruit = ( ‘Apple’\
    \ , ‘Banana’ , ‘Cherry’ )\ninfo = { ‘name’ : ’Mike’ , ‘ref’ : ’Python’ , ‘sys’\
    \ : ’Win’ }\n```\n![image](Images/image00271.jpeg)Next, add statements to display\
    \ all list element values\n\n```python\nprint( ‘Elements: \\t’ , end = ‘ ‘ )\n\
    for item in chars :\n    print( item , end = ‘ ‘ )\n```\n![image](Images/image00272.jpeg)Now,\
    \ add statements to display all list element values and their relative index number\n\
    \n```python\nprint( ‘\\nEnumerated:\\t’ , end = ‘ ‘ )\nfor item in enumerate(\
    \ chars ) :\n    print( item , end = ‘ ‘ )\n```\n![image](Images/image00273.jpeg)Then,\
    \ add statements to display all list and tuple elements\n\n```python\nprint( ‘\\\
    nZipped: \\t’ , end = ‘ ‘ )\nfor item in zip( chars , fruit ) :\n    print( item\
    \ , end = ‘ ‘ )\n```\n![image](Images/image00276.jpeg)Finally, add statements\
    \ to display all dictionary key names and associated element values\n\n```python\n\
    print( ‘\\nPaired:’ )\nfor key , value in info.items() :\n    print( key , ‘=’\
    \ , value )\n```\n![image](Images/image00277.jpeg)Save then run the program –\
    \ to see the items displayed by the loop iterations\n\n![image](Images/image00278.jpeg)\n\
    \n![image](Images/image00194.jpeg)\n\nIn programming terms, anything that contains\
    \ multiple items that can be looped over is described as “iterable”.\n\n### Looping\
    \ conditions\n\nA `while` loop is a piece of code that repeats while a conditional\
    \ expression is `True`. The `while` keyword is followed by a test expression then\
    \ a `:` colon. Statements to execute within the loop are indented. While the tested\
    \ expression is found to be `True`, the loop continues – until the tested expression\
    \ is found to be `False`, at which point the loop ends.\n\nIn Python programming,\
    \ `True` and `False` begin with uppercase letters.\n\nIndentation of code blocks\
    \ must also be observed in Python – like this example that produces a Fibonacci\
    \ sequence of numbers:\n\n![image](Images/image00193.jpeg)\n\nUnlike other languages,\
    \ the interactive interpreter automatically indents and waits when it expects\
    \ further code from you.\n\n![image](Images/image00188.jpeg)\n\nwhile.py\n\n![image](Images/image00270.jpeg)Start\
    \ a new program by initializing a “counter” variable and define an outer loop\
    \ using the counter variable in its test expression\n\n```python\ni = 1\nwhile\
    \ i < 4 :\n    print( ‘Outer Loop Iteration:’ , i )\n    i += 1\n```\n![image](Images/image00271.jpeg)Next,\
    \ add indented statements to display the counter’s value and increment its value\
    \ on each iteration of the loop\n\n![image](Images/image00272.jpeg)Now, (still\
    \ indented) initialize a second “counter” variable and define an inner loop using\
    \ this variable in its test expression\n\n```python\n    j = 1\n    while j <\
    \ 4 :\n        print( ‘\\tInner Loop Iteration:‘ , j )\n        j += 1\n```\n\
    ![image](Images/image00273.jpeg)Finally, add further-indented statements to display\
    \ this counter’s value and increment its value on each iteration\n\nThe output\
    \ printed from the inner loop is indented from that of the outer loop by the **\\\
    t** tab character.\n\nLoops can be nested, one within another, to allow complete\
    \ execution of an inner loop on each iteration of the outer loop. A “counter”\
    \ variable can be initialized with a starting value before the loop definition,\
    \ included in the test expression, and incremented on each iteration until the\
    \ test fails.\n\n![image](Images/image00276.jpeg)Save then run this program –\
    \ to see the output displayed on each iteration\n\n![image](Images/image00280.jpeg)\n\
    \n![image](Images/image00194.jpeg)\n"
