    \ | Background color of selected text |\n| `selectforeground` | Foreground color\
    \ of selected text |\n| `show` | Hide password characters with `show='*'` |\n\
    | `state` | Enabled status of `NORMAL` or `DISABLED` |\n| `width` | Entry width\
    \ in letters |\n\nMultiple widgets can be grouped in frames for better positioning.\
    \ A frame object is created by specifying the name of the window to a `Frame()`\
    \ constructor. The frame’s name can then be specified as the first argument to\
    \ the widget constructors to identify it as that widget’s container.\n\nWhen actually\
    \ adding widgets to the frame, you can specify which side to pack them to in the\
    \ frame with `TOP`, `BOTTOM`, `LEFT`, or `RIGHT` constants. For example, `entry.pack(\
    \ side=LEFT )`.\n\n![image](Images/image00194.jpeg)\n\nUse the `Text` widget instead\
    \ of an `Entry` widget if you want to allow the user to enter multiple lines of\
    \ text.\n\nTypically, an entry widget will appear alongside a label describing\
    \ the type of input expected there from the user, or alongside a button widget\
    \ that the user can click to perform some action on the data they have entered,\
    \ so positioning in a frame is ideal. Data currently entered into an entry widget\
    \ can be retrieved by the program using that widget’s `get()` method.\n\n![image](Images/image00188.jpeg)\n\
    \nentry.py\n\n![image](Images/image00257.jpeg)Start a new program by making GUI\
    \ features available and message box features available as a short alias\n\n```python\n\
    from tkinter import *\nimport tkinter.messagebox as box\n```\n\n![image](Images/image00258.jpeg)Next,\
    \ create a window object and specify a title\n\n```python\nwindow = Tk()\nwindow.title(\
    \ ‘Entry Example’ )\n```\n\n![image](Images/image00259.jpeg)Now, create a frame\
    \ to containing an entry field for input\n\n```python\nframe = Frame( window )\n\
    entry = Entry( frame )\n```\n\n![image](Images/image00260.jpeg)Then, add a function\
    \ to display data currently entered\n\n```python\ndef dialog() :\n    box.showinfo(\
    \ ‘Greetings’ , ‘Welcome ’ + entry.get() )\n```\n\n![image](Images/image00261.jpeg)Now,\
    \ create a button to call the function when clicked\n\n```python\nbtn = Button(\
    \ frame, text = ‘Enter Name’ , command=dialog )\n```\n\n![image](Images/image00262.jpeg)Add\
    \ the button and entry to the frame at set sides\n\n```python\nbtn.pack( side\
    \ = RIGHT , padx = 5 )\nentry.pack( side = LEFT )\nframe.pack( padx = 20 , pady\
    \ = 20 )\n```\n\n![image](Images/image00266.jpeg)Finally, add the loop to capture\
    \ this window’s events\n\n```python\nwindow.mainloop()\n```\n\n![image](Images/image00362.jpeg)Save\
    \ the file and run the program, then enter your name and click the button – to\
    \ see a greeting message appear\n\n![image](Images/image00363.jpeg)\n![image](Images/image00364.jpeg)\n\
    ![image](Images/image00194.jpeg)\n\nUse a `Label` widget instead of an `Entry`\
    \ widget if you want to display text that the user cannot edit.\n\n### Listing\
    \ options\n\nA `Listbox` widget provides a list of items in an application from\
    \ which the user can make a selection. A listbox object is created by specifying\
    \ the name of its parent container, such as a window or frame name, and options\
    \ as arguments to a `Listbox()` constructor. Popular options are listed below\
    \ together with a brief description:\n\n| Option: | Description |\n| :--- | :---\
    \ |\n| `bd` | Border width in pixels (default is 2) |\n| `bg` | Background color\
    \ |\n| `fg` | Foreground color used to render the text |\n| `font` | Font for\
    \ the text |\n| `height` | Number of lines in list (default is 10) |\n| `selectbackground`\
    \ | Background color of selected text |\n| `selectmode` | SINGLE (the default)\
    \ or MULTIPLE selections |\n| `width` | Listbox width in letters (default is 20)\
    \ |\n| `yscrollcommand` | Attach to a vertical scrollbar |\n\n![image](Images/image00193.jpeg)\n\
    \nWith tkinter, a scrollbar is a separate widget that can be attached to `Listbox`,\
    \ `Text`, `Canvas` and `Entry` widgets. Items are added to the listbox by specifying\
    \ a list index number and the item string as arguments to its `insert()` method.\n\
    \nYou can retrieve any item from a listbox by specifying its index number within\
    \ the parentheses of its `get()` method. Usefully, a listbox also has a `curselection()`\
    \ method that returns the index number of the currently selected item, so this\
    \ can be supplied as the argument to its `get()` method to retrieve the current\
    \ selection.\n\n![image](Images/image00188.jpeg)\n\nlistbox.py\n\n![image](Images/image00257.jpeg)Start\
    \ a new program by making GUI features available and message box features available\
    \ as a short alias\n\n```python\nfrom tkinter import *\nimport tkinter.messagebox\
    \ as box\n```\n\n![image](Images/image00258.jpeg)Next, create a window object\
    \ and specify a title\n\n```python\nwindow = Tk()\nwindow.title( ‘Listbox Example’\
    \ )\n```\n\n![image](Images/image00259.jpeg)Now, create a frame to contain widgets\n\
    \n```python\nframe = Frame( window )\n```\n\n![image](Images/image00260.jpeg)Create\
    \ a listbox widget\n\n```python\nlistbox = Listbox( frame )\nlistbox.insert( 1\
    \ , ‘Option1’ )\nlistbox.insert( 2 , ‘Option2’ )\nlistbox.insert( 3 , ‘Option3’\
    \ )\n```\n\n![image](Images/image00261.jpeg)Next, add a function to display listbox\
    \ selection\n\n```python\ndef dialog() :\n    box.showinfo( ‘Selection’ , listbox.get(listbox.curselection())\
    \ )\n```\n\n![image](Images/image00262.jpeg)Now, create a button to call the function\
    \ when clicked\n\n```python\nbtn = Button( frame, text = ‘Choose’ , command=dialog\
    \ )\n```\n\n![image](Images/image00266.jpeg)Then, add the button and listbox to\
    \ the frame at set sides\n\n```python\nbtn.pack( side = RIGHT , padx = 5 )\nlistbox.pack(\
    \ side = LEFT )\nframe.pack( padx = 20 , pady = 20 )\n```\n\n![image](Images/image00362.jpeg)Finally,\
    \ add the loop to capture this window’s events\n\n```python\nwindow.mainloop()\n\
    ```\n\n![image](Images/image00363.jpeg)Save the file and run the program, then\
    \ select an option and click the button – to see your selection confirmed\n\n\
    ### Polling radios\n\nA `Radiobutton` widget provides a single item in an application\
    \ that the user may select. Where a number of radio buttons are grouped together\
    \ the user may only select any item in the group. With tkinter, radio button objects\
    \ are grouped together when they nominate the same control variable to assign\
    \ a value upon selection. An empty string variable object can be created for this\
    \ purpose using the `StringVar()` constructor or an empty integer variable object\
    \ using the `IntVar()` constructor.\n\n![image](Images/image00215.jpeg)\n\nYou\
    \ cannot use a regular variable to store values assigned from a radio button –\
    \ it must be an object. A radio button object is created by specifying four arguments\
    \ to a `Radiobutton()` constructor:\n\n- Name of the parent container, such as\
    \ the frame\n- Text for a display label, specified as a `text=` pair\n- Control\
    \ variable object, specified as a `variable=` pair\n- Value to be assigned, specified\
    \ as a `value=` pair\n\nEach radio button object has a `select()` method that\
    \ can be used to specify a default selection in a group of radio buttons when\
    \ the program starts. A string value assigned by selecting a radio button can\
    \ be retrieved from a string variable object by its `get()` method.\n\n![image](Images/image00188.jpeg)\n\
    \nradio.py\n\n![image](Images/image00257.jpeg)Start a new program by making GUI\
    \ features available and message box features available as a short alias\n\n```python\n\
    from tkinter import *\nimport tkinter.messagebox as box\n```\n\n![image](Images/image00258.jpeg)Next,\
    \ create a window object and specify a title\n\n```python\nwindow = Tk()\nwindow.title(\
    \ ‘Radio Button Example’ )\n```\n\n![image](Images/image00259.jpeg)Now, create\
    \ a frame to contain widgets\n\n```python\nframe = Frame( window )\n```\n\n![image](Images/image00260.jpeg)Then,\
    \ construct a string variable object to store a selection\n\n```python\nbook =\
    \ StringVar()\nrb1 = Radiobutton(frame, text='Option 1', variable=book, value=1)\n\
    rb2 = Radiobutton(frame, text='Option 2', variable=book, value=2)\nrb3 = Radiobutton(frame,\
    \ text='Option 3', variable=book, value=3)\nrb1.select()\n```\n"
