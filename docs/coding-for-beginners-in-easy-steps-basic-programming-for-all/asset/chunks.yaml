    ## Sorting algorithms


    This chapter demonstrates how to code a variety of sorting algorithm instruction
    sequences.


    - [Copying sorts](#part0010.xhtml_sec1)

    - [Selecting sorts](#part0010.xhtml_sec2)

    - [Inserting sorts](#part0010.xhtml_sec3)

    - [Bubbling sorts](#part0010.xhtml_sec4)

    - [Merging sorts](#part0010.xhtml_sec5)

    - [Partitioning sorts](#part0010.xhtml_sec6)

    - [Summary](#part0010.xhtml_sec7)


    ### Copying sorts


    An “algorithm” is a well-defined sequence of instructions to perform a specific
    task. Each algorithm takes one or more values as input and produces one or more
    resulting values as output.


    An algorithm may be created in code as a function whose statements define a sequence
    of instructions to perform the task. Input values can be passed as arguments in
    the function call and resulting values can be returned as output from the function.
    Algorithms can be coded, using data structures and control structures in a variety
    of ways, to perform tasks such as sorting lists into order.


    ![image](Images/image00302.jpeg)


    Python provides the `sort()` method for lists (described [here](#part0007.xhtml_page_52))
    but examples in this chapter demonstrate how to code various sorting algorithms
    that are found in many programming languages.


    Sorting efficiency may depend upon the nature of the list to be sorted so different
    algorithms may be best-suited to particular tasks. Where the task requires a list
    to be sorted, while the original unsorted list remains intact, an algorithm function
    can be passed a reference to the list in an argument as input. The function can
    then make a copy of the original list, sort elements of that copy into order,
    then return the sorted copy list as output. This algorithm simply copies element
    values from the original list into a new list array then arranges them in ascending
    value order.


    ![image](Images/image00303.jpeg)


    ![image](Images/image00193.jpeg)


    Array list elements are numbered from zero. So here, element `[0]` contains 5,
    element `[1]` contains 3, and so on.


    ![image](Images/image00188.jpeg)


    `copy.py`


    ![image](Images/image00304.jpeg)Start a new program by declaring a function to
    receive a list reference as input and return a sorted copy as output


    ```python

    def copy_sort( array ) :

    copy = array[ ]

    sorted_copy = [ ]

    # Algorithm sequence to be added here.

    return sorted_copy

    ```


    ![image](Images/image00305.jpeg)Next, add the indented algorithm sequence to insert
    the copied element values into the empty list in order


    ```python

    while len( copy ) > 0 :

    minimum = 0

    for element in range( copy ) :

    if copy[ element ] < copy[ minimum ] :

    minimum = element

    sorted_copy.append( copy.pop( minimum ) )

    ```


    ![image](Images/image00306.jpeg)Now, add statements to create and display an unsorted
    list


    ```python

    array = [ 5 , 3 , 1 , 2 , 4 ]

    print( ‘Copy...\nArray :’ )

    ```


    ![image](Images/image00307.jpeg)Finally, add statements to display the unsorted
    list and its sorted copy then save and run the program – to see original list
    remains intact in unsorted order


    ```python

    print( ‘Copy :’ , copy_sort( array ) )

    print( ‘Array :’ )

    ```


    ![image](Images/image00308.jpeg)


    ![image](Images/image00194.jpeg)

    Each value is popped off the list in sequence – to build the sorted version by
    appending each.


    ### Selecting sorts


    Often you will want to sort the elements of an unsorted list array “in place”
    rather than sort a copy of the original list, as demonstrated in the previous
    example. There are several popular algorithms you can employ to sort arrays in
    place, each using a different technique with their own strengths and weaknesses.


    A “selection sort” algorithm examines each element in the unsorted part of an
    array list and selects the element containing the lowest value. It then swaps
    the element value with that contained in the element at the beginning of the unsorted
    part – thereby increasing the size of the sorted part of the array and decreasing
    its unsorted part. This process is repeated until all element values are sorted
    into ascending order.


    Selection sort is a simple swap-based algorithm that is relatively easy to understand
    and code as a function algorithm. It is one of the two most efficient algorithms
    for sorting small arrays of 20 or so elements.


    ![image](Images/image00309.jpeg)


    ![image](Images/image00194.jpeg)

    In this example, the final element will already contain the highest value when
    the penultimate element has been sorted.


    ![image](Images/image00188.jpeg)


    `selection.py`


    ![image](Images/image00304.jpeg)Start a new program by declaring a function to
    receive a list reference as input and begin a loop to store each element’s value
    and current index number


    ```python

    def selection_sort( array ) :

    for index in range( 0 , len( array ) -1 ) :

    value = array[ index ]

    current = index

    # Algorithm sequence to be added here.

    ```


    ![image](Images/image00305.jpeg)Next, add the algorithm sequence to repeatedly
    swap the smallest unsorted value with the first unsorted value


    ```python

    for element in range( index+1 , len( array ) ) :

    if array[ element ] < array[ current ] :

    current = element

    array[ index ] = array[ current ]

    array[ current ]= value

    ```

