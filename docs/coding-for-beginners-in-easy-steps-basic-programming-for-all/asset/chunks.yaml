    \nPython 标准库有一个 `random` 模块，它提供了生成伪随机数的方法。每当初始化随机生成器时，默认都会使用当前系统时间作为“种子” – 这样它就不会重复其选择。\n\
    \n通过调用 `random` 模块中的 `random()` 方法可以生成一个从 0.0 到 1.0 之间的伪随机浮点数。生成的数字范围可以使用 `*`\
    \ 乘法运算符修改以指定最大值，并可以使用内置 `int()` 函数向下取整为整数值。例如，生成 0 到 9 范围内的整数：\n\n```\nint( random.random()\
    \ * 10 )\n```\n\n或者生成 1 到 10 范围内的整数：\n\n```\nint( random.random() * 10 ) + 1\n\
    ```\n\n![image](img/image00215.jpeg)\n\n通过内置 `int()` 函数从 `float` 数据类型转换为 `int`\
    \ 数据类型的浮点数会在小数点处被截断。\n\n该语句可以在循环中使用，以在给定范围内生成多个随机整数，但输出中的任何数字都可能重复 – 无法保证唯一性。相反，可以通过\
    \ `random` 模块中的 `sample()` 方法在给定范围内生成多个唯一的随机整数。这需要两个参数来指定范围和要返回的唯一整数数量。使用内置的 `range()`\
    \ 函数来指定最大值非常方便。例如，生成 1 到 9 范围内的六个唯一数字：\n\n```\nrandom.sample( range( 10 ) , 6\
    \ )\n```\n\n或者生成 1 到 10 范围内的六个唯一数字：\n\n```\nrandom.sample( range( 1 , 11 ) , 6\
    \ )\n```\n\n这种技术可以代表一个随机彩票条目，例如在 1 到 49 之间选择六个唯一的数字。\n\n![image](img/image00375.jpeg)\n\
    \n`range()` 函数可以指定起始和结束值。如果不提供起始值，默认假设为零。\n\n![image](img/image00188.jpeg)\n\n\
    sample.py\n\n![image](img/image00270.jpeg)\n\n从“random”模块导入两个函数启动新程序\n\n```\n\
    from random import sample\n```\n\n![image](img/image00271.jpeg)\n\n接下来，将随机浮点数赋值给变量并显示其值\n\
    \n```\nnum = random()\nprint('Random Float 0.0-1.0 : ', num)\n```\n\n![image](img/image00272.jpeg)\n\
    \n现在将浮点数相乘并转换为整数后显示其值\n\n```\nnum = int( num * 10 )\nprint('Random Integer 0 -\
