    ## Recognizing types


    There are four essential types of data you can represent when coding a computer
    program and that can be stored in variables. Although variables in the Python
    language can store any type of data it is important to understand the different
    types as you will sometimes need to convert from one type to another in your code:


    | Data type: | Description: | Example: |

    | :--- | :--- | :--- |

    | `str` | A string of characters, which can include letters, numbers, spaces,
    and symbols | ‘Daytona 500’ |

    | `int` | An integer whole number, which DOES NOT have a decimal point part |
    `1000` |

    | `float` | A floating-point number, which DOES have a decimal point part | `98.6`
    |

    | `bool` | A Boolean logical truth value, which is either True or False | `True`
    |


    ![image](Images/image00215.jpeg)


    Integer `int` numbers should not include any punctuation – so code one thousand
    as `1000` rather than `1,000`.


    Strings are simply any collection of characters you can enter from the computer
    keyboard, grouped together within quote marks. Variables recognize a value being
    assigned to it as belonging to the `str` “class” if that value is enclosed within
    quote marks.


    ![image](Images/image00193.jpeg)


    String `str` values must always be enclosed with quote marks.


    Numbers are any numeric value you can enter from the keyboard but are defined
    by the inclusion or omission of a decimal point. Variables recognize a numeric
    value being assigned to it as belonging to the `int` “class” if that value has
    no decimal point or as belonging to the `float` class if it does indeed have a
    decimal point.


    Booleans are a logical truth value. Variables recognize a Boolean value being
    assigned to it as belonging to the `bool` “class” by the keywords `True` and `False`,
    or if that value evaluates to `True` or `False`.


    In Python programming you can easily discover the type of data stored within a
    variable by specifying that variable’s name within the parentheses of the built-in
    `type()` function.


    ![image](Images/image00188.jpeg)


    `types.py`


