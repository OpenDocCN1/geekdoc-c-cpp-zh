    ```python

    a -= b

    print( ‘Subtract & Assign:\t’ ,’a =’ , a , ‘\t(12 - 4)’ )

    a *= b

    print( ‘Multiply & Assign:\t’ , ’a =’ , a , ‘\t(8 x 4)’ )

    ```


    ![image](Images/image00244.jpeg) Finally, divide and assign a new value to the
    first variable and display its stored value, then remainder and assign a value
