    to encapsulate all relevant attributes and actions.


    **Copying instances**


    An “instance” of a class object is simply a copy of the prototype created by calling
    that class name’s constructor and specifying the required number of parameters
    within its parentheses. The call’s arguments must match those specified by the
    __init__() method definition – other than a value for the internal self parameter.


    The class instance object returned by the constructor is assigned to a variable
    using the syntax *instance-name* = *ClassName*( *args* ).


    Dot notation can be used to reference the methods and class variable attributes
    of an instance object by suffixing their name as *instance-name.method-name*()
    or *instance-name.attribute-name*.


    ![image](Images/image00194.jpeg)


    A constructor creates a class instance using the class name followed by parentheses
    containing any required parameters.


    Typically, a base class can be defined as a Python module file so it can be imported
    into other scripts where instance objects can be easily created from the “master”
    class prototype.


    ![image](Images/image00188.jpeg)


    Bird.py


    ![image](Images/image00241.jpeg)Start a new class file by declaring a new class
    with a descriptive document string


    **class Bird :**


    **‘‘’A base class to define bird properties.’’’**


    ![image](Images/image00242.jpeg)Next, add an indented statement to declare and
    initialize a class variable attribute with an integer zero value


    **count = 0**


    ![image](Images/image00243.jpeg)Now, define the intializer class method to initialize
    an instance variable and to increment the class variable


    **def __init__( self , chat ) :**


    **self.sound = chat**


    **Bird.count += 1**


    ![image](Images/image00244.jpeg)Finally, add a class method to return the value
    of the instance variable when called – then save this class file


    **def talk( self ) :**


    **return self.sound**


    ![image](Images/image00193.jpeg)


    You must not pass an argument value for the self parameter as this is automatically
    incorporated by Python.


    ![image](Images/image00188.jpeg)


    instance.py


    ![image](Images/image00245.jpeg)Start a program by making features of the class
    file available then display its document string


    **from Bird import ***


    **print( ‘\nClass Instances Of:\n’ , Bird.__doc__ )**


    ![image](Images/image00246.jpeg)Next, add a statement to create an instance of
    the class and pass a string argument value to its instance variable


    **polly = Bird( ‘Squawk, squawk!’ )**


    ![image](Images/image00247.jpeg)Now, display this instance variable value and
    call the class method to display the common class variable value


    **print( ‘\nNumber Of Birds:’ , polly.count )**


    **print( ‘Polly Says:’ , polly.talk() )**


    ![image](Images/image00337.jpeg)


    Bird instance – polly


    ![image](Images/image00248.jpeg)Create a second instance of the class passing
    a different string argument value to its instance variable


    **harry = Bird( ‘Tweet, tweet!’ )**


    ![image](Images/image00338.jpeg)Finally, display this instance variable value
    and call the class method to display the common class variable value


    **print( ‘\nNumber Of Birds:’ , harry.count )**


    **print( ‘Harry Says:’ , harry.talk() )**


    ![image](Images/image00339.jpeg)


    Bird instance – harry


    ![image](Images/image00340.jpeg)Save both files then run the program – to see
    two instances of the Bird class get created


    ![image](Images/image00341.jpeg)


    ![image](Images/image00215.jpeg)


    The class variable **count** can also be referenced with **Bird.count** but the
    encapsulated instance variable **sound** can only be accessed by calling an instance’s
    **talk()** method.


    **Addressing properties**


    An attribute of a class instance can be added, modified, or removed at any time
    using dot notation to address the attribute. Making a statement that assigns a
    value to an attribute will update the value contained within an existing attribute
    or create a new attribute of the specified name containing the assigned value:


    ***instance-name.attribute-name* = *value***


    **del *instance-name.attribute-name***


    Alternatively, you can use the following Python built-in functions to add, modify,
    or remove an instance variable:


    •getattr( *instance-name , ‘attribute-name‘* ) – return the attribute value of
    the class instance


    •hasattr( *instance-name , ‘attribute-name‘* ) – return True if the attribute
    value exists in the instance, otherwise return False


    •setattr( *instance-name , ‘attribute-name‘ , value* ) – update the existing attribute
    value or create a new attribute in the instance


    •delattr( *instance-name , ‘attribute-name‘* ) – remove the attribute from the
    instance


    ![image](Images/image00215.jpeg)


    The attribute name specified to these built-in functions must be enclosed within
    quotes.


    The name of attributes automatically supplied by Python always begin with an underscore
    character to notionally indicate “privacy” – so these should not be modified,
    or removed. You can add your own attributes named in this way to indicate privacy
    if you wish, but in reality these can be modified like any other attribute.


    ![image](Images/image00188.jpeg)


    address.py


    ![image](Images/image00241.jpeg)Start a new program by making features of the
    Bird class available that was created [here](#part0013.xhtml_page_128)


    **from Bird import ***


    ![image](Images/image00242.jpeg)Next, create an instance of the class then add
    a new attribute with an assigned value using dot notation


    **chick = Bird( ‘Cheep, cheep!’ )**


    **chick.age = ‘1 week’**


    ![image](Images/image00243.jpeg)Now, display the values in both instance variable
    attributes


    **print( ‘\nChick Says:’ , chick.talk() )**


    **print( ‘Chick Age:’ , chick.age )**


    ![image](Images/image00244.jpeg)Then, modify the new attribute using dot notation
    and display its new value


    **chick.age = ‘2 weeks’**


    **print( ‘Chick Now:’ , chick.age )**


    ![image](Images/image00245.jpeg)Next, modify the new attribute once more, this
    time using a built-in function


    **setattr( chick , ‘age’ , ‘3 weeks’ )**'
