  \n# 商标\n\n所有商标均承认属于其各自的公司。\n\n\n\n# 前言\n\n编写这本书为我（Mike McGrath）提供了一个向没有经验的读者介绍编程的好机会。虽然这是一本面向初者的书，但它超越了基础知识，因此某些主题在有了简单程序之后可能会更容易理解。所有的示例都使用流行的\
  \ Python 语言，书籍截图展示了实际结果。\n\n# 本书约定\n\n为了清晰示例中的代码，我采用了 Python 编辑器提供的着色。Python 语言关键字为橙色，内置函数名称为紫色，用户指定的函数名称为蓝色，文本字符串为绿色，注释为红色，所有其他代码为黑色，如下：\n\
  \n```python\n# 显示问候的函数\ndef greet(reader):\n    print('Welcome to Coding Beginners')\n\
  ```\n\n此外，为了识别步骤中描述的源文件，图标和文件名会出现在步骤旁边的边距中，如下：\n\n![image](img/image0188.jpeg)\n\
  \nprogram.py\n\n# 获取源代码\n\n为了方便起见，我将书中示例的源代码文件放在一个 ZIP 压缩包中。您可以按照以下简单步骤获取压缩包：\n\n\
  ![image](img/image0189.jpeg)访问 [www.ineasysteps.com](http://www.ineasysteps.com)，然后导航到\
  \ Free Resources（免费资源）并选择 Downloads（http://ineasysteps.com/resource-centre/downloads/)\
  \ 部分\n\n![image](img/image0190.jpeg)在列表中找到 Coding for Beginners in easy steps，然后点击标题为\
  \ All Code Examples 的链接下载压缩包\n\n![image](img/image0191.jpeg)现在将压缩包内容解压到计算机上任何方便的位置\n\
  \n\n\n\n\n计算机仅仅是一台能够快速处理一组简单指令的机器。它所处理的指令集被称为“程序”，而这些指令被称为“代码”。\n\n编写计算机程序的人被称为“程序员”或“编码员”。他们的程序使计算机在现代生活的几乎每个领域都变得有用：\n\
  \n-   **在手中** – 计算机存在于手机设备中，用于语音、文本和社交媒体通信等任务\n-   **在家中** – 计算机存在于电视、游戏主机和洗衣机等家用设备中\n\
  -   **在办公室** – 计算机存在于台式设备中，用于文字处理、工资发放和图形设计等任务\n-   **在商店** – 计算机存在于自动提取机（ATM）和条形扫描仪等零售设备中\n\
  -   **在汽车里** – 计算机存在于控制设备中，用于发动机管理、防锁刹车和安全任务\n-   **在空中** – 计算机存在于飞机中用于飞行，存在于空中交通控制中心用于安全导航\n\
  \n![image](img/image00192.jpeg)\n\n事实上，这些只是计算机如何影响我们今天生活的几个例子。然而，计算机其实非常笨！它们只能从\
  \ 0 数到 1，不能独立思考。\n\n计算机是电子组件的集合——统称为“硬件”。为了使计算机运行，必须给它一组程序指令——被称为“软件”。\n\n每个计算机程序都必须提供清晰的分步指令，以便计算机能够无错误地执行，这是非常重要的。因此，编码员必须将计算机所需的任务分解为简单、无歧的步骤。例如，一个将移动机器人从室内移动到户外的程序必须包含让机器人定位门框并绕过任何障碍物的指令。因此，编码员必须始终考虑程序可能会遇到哪些可能的意外困难。\n\
  \n程序指令必须以计算机能够理解的语言呈现给计算机。在最基础的层，计算机可以理解“机器码”，它通过在内存中移动项目来执行任务。这种晦涩的低级代码极其枯燥，因为即使执行一个简单的任务也需要许多行指令。\n\
  \n幸运的是，多年来，已经开发了许多“高级”编程语言，允许编码员以更易于人类阅读的形式编写指令。这些现代高级程序通过“编译器”或“解释器”自动翻译计算机可以理解的机器码。为了成为一名编码员，你通常必须至少学习这些高级编程语言之一：\n\
  \n-   **C** – 一种强大的编译语言，与机器码紧密对应，用于开发操作系统\n-   **C++** – 一种在 C 的基础上开发的增强型编译语言，为面向对象编程（OOP）提供类\n\
  -   **C#** – 一种由微软设计的现代编译语言，用于 .NET 框架和通用语言基础结构\n-   **Java** – 一种可移植的编译语言，设计用于运行在不取决于硬件架构的任何平台上\n\
  -   **Python** – 一种动态解释型语言，同时允许函数式编程和面向对象编程（OOP）\n\n![image](img/image00193.jpeg)\n\
  \n用解释语言编写的程序可以立即运行，但用编译语言编写的程序在运行之前必须先编译。\n\n就像人类语言有相似之处（如动词和名词）一样，这些编程语言也有相似之处，因为它们都拥有用于存储信息的“数据结构”，以及决定程序如何运行的“控制结构”。\n\
  \n书中的示例使用 Python 语言来演示如何编写计算机程序，因为它具有简单的语法、不需要编译、包含大型标准函数库，并可以用于创建控制台程序和窗口化 GUI（图形用户界面）应用。\n\
  \n![image](img/image00194.jpeg)\n\nPython 是一个“自带电池”的完整软件包（batteries included）。\n\
  \n## 设置\n\n在开始用 Python 语言编写程序之前，你需要通过安装 Python 解释器和自带的经过测试的代码模块标准库在你的计算机上设置编程环境。你可以从\
  \ Python 软件基金会在免费下载。\n\n![image](img/image00195.jpeg)\n\n启动网络浏览器并导航到 [python.org/downloads](http://python.org/downloads)，然后点击\
  \ Downloads 按钮获取适用于系统的最新版本——在本例中它是“Python 3.4.2”\n\n![image](img/image00196.jpeg)\n\
  \n下载完成后，运行安装程序并选择为所有用户安装还是仅为你自己安装，然后点击 Next 按钮继续\n\n![image](img/image00197.jpeg)\n\
  \n现在，接受建议的默认安装位置，这将是你的根目录 `C:\\` 上的一个名为“Python”加上版本号的目录——在本例中，它是 Python 3.4.2 版本的目录\
  \ `C:\\Python34`\n\n![image](img/image00198.jpeg)\n\n![image](img/image00199.jpeg)\n\
  \nMac OS X 和其他平台的安装程序也可以在 **[python.org/downloads](http://python.org/downloads)**\
  \ 免费获取\n\n![image](img/image00194.jpeg)\n\n请接受建议的目标目录——例如此处建议的 `C:\\Python34`。\n\
  \n![image](img/image00200.jpeg)\n\n点击 Next 按钮继续，然后确保选择“将 `python.exe` 添加到 Path”功能\n\
  \n![image](img/image00201.jpeg)\n\n![image](img/image00202.jpeg)\n\n点击 Next 开始将文件复制到你的计算机，然后点击\
  \ Finish 按钮完成安装\n\n安装完成后，Python 组被添加到你的开始/应用程序菜单。该组中最重要的是启动 Python 开发环境的 IDLE 项\n\
  \n![image](img/image00203.jpeg)\n\n![image](img/image00194.jpeg)\n\n将 Python 添加到系统\
  \ Path 可以使其在任何目录中使用。安装后，你可以在命令提示符输入命令 `python -V` 来查看解释器响应的版本号\n\n![image](img/image00194.jpeg)\n\
  \n你会经常使用 IDLE 启动器，因此右键点击其图标并选择“固定到任务栏”，以便从桌面快速访问\n\n## 探索 IDLE\n\n安装的 Python 软件包包含集成开发环境\
  \ (IDLE)，你可以在其中轻松编写和运行用 Python 语言编写的程序或片段。IDLE 提供了两个不同的窗口：\n\n- Shell \n- 编辑窗口\n\
  \n当你启动 IDLE 时，它会打开一个包含菜单栏、描述版本的横和一个 `>>>` 提示符的新窗口。这就是 Shell 窗口，你可以在提示符处输入语句与 Python\
  \ 解释器直接交互\n\n![image](img/image00204.jpeg)\n\n如果解释器理解你的输入，它将给出相应的回复，否则它将报告错误。\n\n\
  你可以通过在交互式提示符处输入 Python `print()` 函数语句，并在括号内用引号包含字符串，来让解释器打印出文本字符串\n\n![image](img/image00194.jpeg)\n\
  \n大多数编程语言都将文本字符串包含在引号内，以区别于程序代码。按照习惯，Python 编码员使用单引号\n\n你还可以通过在提示符处输入有效的算术和语句，让解释器打印出简单算术和的结果\n\
  \n如果你的语句无效，例如尝试除以零的算术和，解释器将打印出能够帮助地描述错误性质的错误信息\n\n\n\n\n\n![image](img/image00195.jpeg)打开一个\
  \ IDLE Shell 窗口，然后在交互式提示符处精确输入此语句\n\n```\nprint( ‘Hello World!’ )\n```\n\n![image](img/image00196.jpeg)接下来，按下\
  \ Return 键查看解释器的响应\n\n![image](img/image00205.jpeg)\n\n![image](img/image00197.jpeg)现在，在交互式提示符处输入此加法语句\n\
  \n```\n8 + 4\n```\n\n![image](img/image00194.jpeg)\n\n语句中的空格会被忽略——因此可以不带空格地输入 `8+4`。\n\
  \n![image](img/image00200.jpeg)按下 Return 键查看解释器打印出的结果结果\n\n![image](img/image00206.jpeg)\n\
  \n![image](img/image00202.jpeg)在交互式提示符处输入此无效语句\n\n```\n8 / 0\n```\n\n![image](img/image00207.jpeg)按下\
  \ Return 键查看解释器打印的错误信息\n\n![image](img/image00208.jpeg)\n\n![image](img/image00193.jpeg)\n\
  \nShell 窗口主要用于测试代码片段。\n\n## 获取帮助\n\nIDLE Shell 窗口提供了一个非常强大的帮助工具，在编写 Python 程序时可以在这里找到任何\
  \ Python 主题的帮助。可以通过在交互式 `>>>` 提示符处输入 Python `help()` 语句来寻求帮助。会出现一条欢迎消息，提示符会变为 `help>`，表示你现在处于帮助模式。\n\
  \n![image](img/image00195.jpeg)打开一个 IDLE Shell 窗口，然后在交互式提示符处精确输入此语句\n\n```\nhelp(\
  \ )\n```\n\n![image](img/image00196.jpeg)接下来，按下 Return 键进入帮助模式\n\n![image](img/image00209.jpeg)\n\
  \n![image](img/image00197.jpeg)现在，在帮助工具关键字关键字处输入此主题名称\n\n![image](img/image00200.jpeg)按下\
  \ Return 键列出 Python 语言的所有关键字\n\n![image](img/image00210.jpeg)\n\n![image](img/image00194.jpeg)\n\
  \n帮助工具的欢迎消息还包含实用的提示——但为了简洁起见此处省略了。\n\n![image](img/image00193.jpeg)\n\n关键字是编程语言的词汇。注意\
  \ Python 关键字是区分大小写的——除了 `False`、`None` 和 `True` 之外，这些均为小写。\n\n![image](img/image00202.jpeg)然后，在帮助工具提示符退出处输入此命令\n\
  \n![image](img/image00207.jpeg)按下 Return 键退出帮助并返回交互式 Shell 窗口提示符\n\n![image](img/image00211.jpeg)\n\
  \n![image](img/image00193.jpeg)\n\n`quit` 指令后不需要括号——在这里它是帮助工具命令，而不是 Python 语句。\n\
  \n当你只需要某个特定主题的帮助时，只需在交互式提示符的 `help()` 语句括号内用引号输入主题名称：\n\n![image](img/image00212.jpeg)在交互式提示符处精确输入此语句\n\
  \n```\nhelp( ‘keywords’ )\n```\n\n![image](img/image00213.jpeg)按下 Return 键列出 Python\
  \ 语言的所有关键字并保持在交互式 Shell 窗口提示符\n\n![image](img/image00214.jpeg)\n\n![image](img/image00215.jpeg)\n\
  \n关键字在编程语言中具有特殊含义——它们不能用于为代码中的项命名。\n\n## 保存程序\n\n上一页描述的 IDLE Shell 窗口是尝试代码片段的好地方，但无法保存你的代码。幸运的是，IDLE\
  \ 还提供了一个编辑窗口（Edit Window），你可以在其中创建较长的程序代码，并将其存储在计算机上的 `.py` 文件中。这意味着你可以轻松重新运行代码，而无需在\
  \ Shell 窗口 `>>>` 提示符处重新输入所有指令，这允许你编辑代码以尝试新想法。创建、保存和运行代码的步骤如下：\n\n* 从 Shell 窗口菜单项中选择\
  \ `File`、`New File` 打开编辑窗口——或者按下快捷键 `Ctrl + N`\n* 在编辑窗口中输入代码，然后通过选择编辑窗口菜单项中的 `File`、`Save`\
  \ 保存它——或者按下快捷键 `Ctrl + S`\n* 通过选择编辑窗口菜单项中的 `Run`、`Run Module` 运行保存的代码——或者按下快捷键 `F5`\n\
  \n![image](img/image00194.jpeg)\n\n这里描述的步骤将用于演示书中给出的代码示例。\n\n你的程序代码的输出将在程序运行时出现在\
  \ Shell 窗口中，如果解释器发现你的代码中有错误，那里将显示一条有用的错误信息。\n\n![image](img/image00195.jpeg)打开一个\
  \ IDLE Shell 窗口，然后选择菜单项 `File`、`New File` 打开 IDLE 编辑窗口\n\n![image](img/image00216.jpeg)\n\
  \n![image](img/image00194.jpeg)\n\n注意 `File`、`Open` 和 `File`、`Recent Files` 菜单项，可以使用它们来重新运行之前保存的程序代码。\n\
  \n![image](img/image00188.jpeg)\n\nhelloworld.py\n\n![image](img/image00196.jpeg)现在，在编辑窗口中输入此代码\n\
  \n```\nprint( ‘Hello World!’ )\n```\n\n![image](img/image00217.jpeg)接下来，在编辑窗口中选择菜单项\
  \ `File`、`Save` 将代码保存为 helloworld.py\n\n![image](img/image00216.jpeg)最后，在编辑窗口中选择菜单项\
  \ `Run`、`Run Module` 运行代码并查看输出\n\n![image](img/image00220.jpeg)\n\n![image](img/image00194.jpeg)注意\
  \ Shell 窗口每次运行代码时都会重启\n\n## 存储值\n\n所有编程语言的一个基本功能是存储值。这种能力由名为“变量”的简单数据结构提供。变量是一个可以存储数据的容器，就像现实中的物体可以存储在盒子里一样。创建变量时，你给它一个名称（遵循语言的命名规范），这就像盒子上的标签。存储在变量中的数据可以通过其名称检索。\n\
  \n要存储在变量中的数据在 Python 程序语句中使用 `=` 运算符进行赋值。例如，将数值 8 存储在名为 `a` 的变量中：\n\n```\na = 8\n\
  ```\n\n存储的值随后可以使用变量名进行检索，因此语句 `print( a )` 将输出存储的值 `8`。该变量随后可以分配不同的值，因此它的值可以随着程序的运行而变化——这就是“变量”一词的由来。\n\
  \n在 Python 编程中，必须在声明语句为变量分配初始值（初始化）——否则解释器将报告“未定义”错误。多个变量可以在同一个语句中使用一系列 `=` 赋值初始化为相同的值。例如，将\
  \ `a`、`b` 和 `c` 均初始化为数值 8：\n\n```\na = b = c = 8\n```\n\n\n\n\n\n![image](img/image00195.jpeg)打开一个\
  \ IDLE 编辑窗口，然后输入代码创建一个名为 `var` 的变量来存储一个整数\n\n```python\nvar = 8\n```\n\n![image](img/image00196.jpeg)接下来，添加一条语句来显示存储的整数值\n\
  \n```python\nprint( var )\n```\n\n![image](img/image00197.jpeg)给变量赋一个新的浮点数，然后添加一条语句来显示存储的浮点值\n\
  \n```python\nvar = 3.142\nprint( var )\n```\n\n![image](img/image00200.jpeg)现在，给变量赋一个文本字符串，然后添加一条语句来显示存储的字符串值\n\
  \n```python\nvar = ‘Coding for Beginners in easy steps’\nprint( var )\n```\n\n![image](img/image00202.jpeg)最后，给变量赋一个逻辑真值，然后添加一条语句来显示存储的布尔值\n\
  \n```python\nvar = True\nprint( var )\n```\n\n![image](img/image00202.jpeg)保存文件（File,\
  \ Save）然后运行程序（Run, Run Module），即可在输出中看到存储的值\n\n![image](img/image00222.jpeg)\n\n\
  ![image](img/image00193.jpeg)\n\n文本字符串数据必须包含在引号内，以表示该特定字符串的开始和结束。\n\n### 添加注释\n\n\
  当你开始编写复杂的程序时，在每段代码的开头添加注释来描述该段代码的作用非常有帮助。这使得其他人更容易理解代码，也能让你在日后回顾代码时更容易理解。在 Python\
  \ 编程语言中，单行内 `#` 字符之后的所有内容都会被解释器忽略。这意味着可以在 `#` 字符之后插入单行注释。\n\n![image](img/image00188.jpeg)\n\
  \ncomment.py\n\n![image](img/image00195.jpeg)打开一个 IDLE 编辑窗口，然后输入带注释的代码初始化变量并显示其状态\n\
  \n```python\n# 初始化程序状态\nrunning = True\nprint( ‘Run state: ‘ , running )\n```\n\n\
  ![image](img/image00196.jpeg)保存文件然后运行程序，查看注释被忽略以及输出中显示存储的值\n\n![image](img/image00223.jpeg)\n\
  \n为了方便识别代码的各个部分，IDLE 会自动在 Shell 窗口和编辑窗口中对你的代码进行着色，默认颜色列表所示：\n\n![image](img/image00224.jpeg)\n\
  \n![image](img/image00193.jpeg)\n\n书中各个步骤中列出的代码也使用了默认 IDLE 颜色以保持一致性。\n\n### 命名规则\n\
  \n| 关键字: | | | |\n| :--- | :--- | :--- |\n| `False` | `None` | `True` |\n| `and`\
  \ | `as` | `assert` |\n| `break` | `class` | `continue` |\n| `def` | `del` | `elif`\
  \ |\n| `else` | `except` | `finally` |\n| `for` | `from` | `global` |\n| `if` |\
  \ `import` | `in` |\n| `is` | `lambda` | `nonlocal` |\n| `not` | `or` | `pass` |\n\
  | `raise` | `return` | `try` |\n| `while` | `with` | `yield` |\n\n![image](img/image00194.jpeg)\n\
  \n选择反映变量内容本质的有意义名称是良好的编程习惯。\n\n你在代码中创建的用于存储程序内数据的变量容器可以赋予你选择的任何名称——只要你不使用任何编程语言的关键字（如上表中的\
  \ Python 关键字），并且名称符合下表列出的命名规则：\n\n| 命名规则: | 示例: |\n| :--- | :--- |\n| 不得包含任何关键字\
  \ | `True` |\n| 不得包含算术运算符 | `a+b*c` |\n| 不得包含符号 | `%$#@!` |\n| 不包含任何空格 | `no spaces`\
  \ |\n| 不能以数字开头 | `2bad` |\n| 可以在其他地方包含数字 | `good1` |\n| 可以包含大小写混合字母 | `UPdown` |\n\
  | 可以包含下划线 | `is_ok` |\n\n![image](img/image00215.jpeg)\n\nPython 中的变量名对大小写敏感——所以名为\
  \ `VAR`、`Var` 和 `var` 的变量会被视为三个独立的变量。\n\n## 总结\n\n- 计算机程序是由编码员编写的指令集，使计算机变得有用\n\
  - 计算机的电子组件是其硬件，而程序指令则是其软件\n- 计算机理解低级机器码\n- 人类可读形式的高级编程语言会自动翻译成低级机器码\n- 编程语言拥有存储信息的数据结构和确定进展的控制结构\n\
  - Python 编程语言语法简单，不需要编译，并包含函数库\n- Python 的开发环境称为 IDLE\n- IDLE 提供了一个包含用于测试的交互式提示符的\
  \ Shell 窗口和一个用于编写程序的编辑窗口\n- 在 Shell 窗口提示符处输入 `help()` 语句即可访问 IDLE 帮助工具\n- 在 IDLE\
  \ 编辑窗口中输入程序代码后，必须先保存为文件才能运行，输出中显示的值\n\n2\n\n### 保存数据\n\n本章演示了如何使用各种类型的数据。\n\n- **存储输入**\n\
  - **控制输出**\n- **识别类型**\n- **数据转换**\n- **猜游戏**\n- **纠正错误**\n- **总结**\n\n### 存储输入\n\
  \n存储和替换代码数据的能力非常好，但这种能力也可以用于增加程序的交互性。\n\n在 Python 编程中，可以使用内置 `input()` 函数接受键盘输入并将其赋值给变量。可选，该函数可以指定一个字符串（括号内的引号）作为提示。程序将等待用户按下\
  \ Return 键后将其输入赋值给变量。\n\n可以通过在函数中指定变量名使用内置 `print()` 输出输出变量的值。多个值也可以作为括号内的逗号分隔列表的形式输出。\n\
