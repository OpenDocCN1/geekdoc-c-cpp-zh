  \n![image](img/image00194.jpeg)\n\n参数是通过函数调用传递给函数参数的实际数据值。\n\n### 返回结果\n\n就像 Python\
  \ 的内置函数 `str()` 返回调用者作为其参数指定的值的字符串表示一样，你的自定义函数也可以通过 `return` 关键字指定要返回的值来向调用者返回值。例如，向调用者返回两个指定参数值的和：\n\
  \n```python\ndef sum(a, b):\n    return a + b\n```\n\n调用者可以将返回的结果赋值给变量，供程序后续使用，如下：\n\
  \n```python\ntotal = sum(8, 4)\nprint('Eight Plus Four Is:', total)\n```\n\n或者返回的结果可以这样直接“内联”使用：\n\
  \n\n\n\n\n```\nprint( ‘Eight Plus Four Is:’ , sum( 8 , 4 ) )\n```\n\n通常情况下，return\
  \ 语句会出现在函数块的末尾，用于返回执行该函数中包含的所有语句后的最终结果。\n\n然而，return 语句也可能出现在函数块中较早的位置，以停止该块中所有后续语句的执行。这会立即在调用者处恢复执行程序。可选地，return\
  \ 语句可以指定一个要返回给调用者的值，也可以省略该值。如果未指定值，则假设默认值为 `None`。通常，这用于在发现条件测试结果为 `False` 时停止函数语句的执行。例如，当传递的参数值低于指定的数字时：\n\
  \n```\ndef sum( a , b ) :\nif a < 5 :\n    return\nreturn a + b\n```\n\n![image](img/image00193.jpeg)\n\
  \n你可以在函数定义中为参数指定默认值。\n\n在这种情况下，当第一个传递的参数值小于五时，函数将返回默认值 `None`，且不会执行最后的语句。\n\n当函数需要执行算术运算时，可以使用内置的\
  \ `isdigit()` 函数对用户输入进行整数值验证。\n\n![image](img/image00188.jpeg)\n\nreturn.py\n\n\
