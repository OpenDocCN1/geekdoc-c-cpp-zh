  \ 对象的 `replace()` 函数为其属性分配新值，例如 `today = today.replace(year=2015)`。\n\n## 运行计时器\n\
  \n在事件发生前后分别获取当前时间，意味着可以通过计算它们之间的差值来计算事件的持续时间。可以将 Python 的“time”模块导入程序中以提供各种时间相关的函数。\n\
  \n当前系统时间通常被视为自 1970 年 1 月 1 日 GMT 00:00:00（Epoch）以来经过的秒数。时间模块的 `time()` 函数在调用时会返回自\
  \ Epoch 以来的秒数（浮点数）。\n\n![image](img/image00193.jpeg)\n\n`gmtime()` 函数将从 Epoch 开始的经过时间转换为\
  \ UTC 的 `struct_time` 对象，其中夏令时始终设置为 0，而 `localtime()` 则将其转换为本地系统时间的 `struct_time`\
  \ 对象。\n\n`time()` 函数返回的图形可以使用 `gmtime()` 或 `localtime()` 函数转换为“struct_time”对象。该对象具有\
  \ `tm_year`、`tm_mon`、`tm_mday`、`tm_hour`、`tm_min`、`tm_sec`、`tm_wday`、`tm_yday` 和\
  \ `tm_isdst` 属性，可以使用点符号引用。例如，`struct.tm_wday`。\n\n`struct_time` 对象中的所有值都存储为数值，但可以使用\
  \ `strftime()` 函数转换为文本等效值。这需要一个作为格式“指令”的参数，后面跟着 `struct_time` 对象的名称。可能的指令包括 datetime\
  \ 对象此处表中列出的。例如，用于周日的 `strftime( ‘%A’ , struct)`。\n\n很有用的是时间模块还提供了一个 `sleep()` 函数，可以用于暂停程序的执行。它的参数指定了延迟执行的秒数。\n\
  \n![image](img/image00188.jpeg)\n\n# timer.py\n\n![image](img/image00195.jpeg)通过导入“time”模块启动新程序以可以使用其功能\n\
  \n```python\nfrom time import *\n```\n\n![image](img/image00196.jpeg)接下来，用一个浮点数初始化变量，该数是自\
  \ Epoch 以来的当前经过时间\n\n```python\nstart_timer = time()\n```\n\n![image](img/image00197.jpeg)现在，添加一条语句从经过的时间值创建一个\
  \ struct_time 对象\n\n```python\nstruct = localtime( start_timer )\n```\n\n![image](img/image00200.jpeg)然后，宣布倒计时器将从当前时间起点开始\n\
  \n```python\nprint( ‘Starting Countdown At:’ , strftime( ‘%X’ , struct ) )\n```\n\
  \n![image](img/image00202.jpeg)添加一个循环来初始化并打印计数器变量值，然后在每次迭代中计数器减一并暂停一秒\n\n```python\n\
  i = 10\nwhile i > -1 :\n    print( i )\n    i -= 1\n    sleep( 1 )\n```\n\n![image](img/image00207.jpeg)接下来，用一个浮点数初始化变量，该数是现在自\
  \ Epoch 以来的当前经过时间\n\n```python\nend_timer = time()\n```\n\n![image](img/image00212.jpeg)现在，用两个计时点之间差值的四舍五入秒值初始化变量\n\
  \n```python\ndifference = round( end_timer - start_timer )\n```\n\n![image](img/image00207.jpeg)最后，添加一条语句来显示花费的时间\n\
  \n```python\nprint( ‘nRuntime:’ , difference , ‘Seconds’ )\n```\n\n![image](img/image00322.jpeg)保存并运行程序——查看显示的日期和时间值\n\
  \n![image](img/image00212.jpeg)\n\n![image](img/image00194.jpeg)注意在此循环中如何使用 `\\\
  ` 反斜线字符，它允许语句延续到下一行而不会引起错误。![image](img/image00194.jpeg)你可以使用 datetime 对象的 `replace()`\
  \ 函数为其属性分配新值，例如 `today = today.replace(year=2015)`。\n\n## 总结\n\n- `sys` 模块具有包含 Python\
  \ 版本、解释器位置和路径的属性。\n- `keyword` 模块拥有所有关键字的列表。\n- `math` 模块提供了 `ceil()`、`floor()`、`pow()`\
  \ 和 `sqrt()` 函数。\n- 三角函数计算可以使用 `math` 模块函数 `sin()`、`cos()` 和 `tan()` 完成。\n- `random`\
  \ 模块提供产生伪随机数的 `random()` 函数和一个产生随机选择列表的 `sample()` 函数。\n- 浮点数无法精确表示小数。\n- `decimal`\
  \ 模块提供 `Decimal()` 对象，用它可以精确地表示小数。\n- `datetime` 模块提供了 `year`、`month`、`day`、`hour`、`minute`、`microsecond`\
  \ 属性，可以使用点符号或 `getattr()` 。\n- `datetime` 对象具有 `strftime()` 函数，可以指定指令返回对象的格式化部分。\n\
  - `time` 模块提供 `time()` 函数返回自 Epoch 以来的经过时间。\n- `gmtime()` 和 `localtime()` 函数返回一个包含日期时间组件属性的\
  \ `struct_time` 对象。\n\n# 管理文本\n\n本章介绍了如何在程序中操作文本字符串以及如何在文件中存储文本。\n\n### 操作字符串\n\n\
  ### 格式化字符串\n\n### 修改字符串\n\n### 访问文件\n\n## 操作内容\n\n## 更新内容\n\n## 总结\n\n### 操作字符串\n\
  \n在 Python 程序可以使用下表列的各种运算符来操作字符串值：\n\n| 运算符 | 描述 | 示例 |\n| :--- | :--- | :--- |\n\
  | `+` | 拼接 – 将字符串连接 | `‘Hello’ + ‘Mike’` |\n| `*` | 重复 – 乘以字符串 | `‘Hello’ * 2` |\n\
  | `[ ]` | 切片 – 选择指定索引的字符 | `‘Hello’ [0]` |\n| `[ :]` | 范围切片 – 选择索引范围内的字符 | `‘Hello’\
  \ [ 0 : 4 ]` |\n| `in` | 成员包含性 – 如果字符存在于字符串中返回 True | `‘H’ in ‘Hello’` |\n| `not\
  \ in` | 成员排斥性 – 如果字符不在字符串中返回 True | `‘h’ not in ‘Hello’` |\n\n\n\n\n\n| **r/R**\
  \ | **原始字符串 – 抑制转义字符的含义** | **print( r’\\n’ )** |\n| :--- | :--- | :--- |\n| **‘‘\
  \ ‘‘‘** | **Docstring – 描述模块、函数、类或方法** | **def sum( a,b ) : ‘‘‘ Add Args ‘‘‘** |\n\
  \n![image](img/image00215.jpeg)\n\n成员运算符执行大小敏感的匹配，因此 `‘A’ in ‘abc’` 将失败。\n\n`[ ]`\
  \ 切片操作符和 `[ :]` 范围切片操作符识别出字符串实际上是一个列表，其中每个列表元素包含一个单独字符，可以通过它们的索引数字进行引用。\n\n同样，`in`\
  \ 和 `not in` 成员运算符会遍历每个元素，寻找匹配指定的字符。\n\n原始字符串运算符 `r`（或大写的 `R`）必须紧置于起始引号之前，以抑制字符串中的转义字符，这在字符串包含反斜线字符时非常有用。\n\
  \n![image](img/image00215.jpeg)\n\n范围切片（Range Slice）返回直至（但不包括）最后一个指定的索引位置的字符串。\n\
  \n“docstring”（文档字符串）是一个描述性的字符串字面量，作为模块、函数、类或方法定义的第一个语句出现。它应该包含在三个单引号内。独特的是，docstring\
  \ 成为该对象的 `__doc__` 特殊属性，因此可以使用其名称和点后缀进行引用。通常所有模块都应该有 docstring，由模块导出的所有函数和类也应该有\
  \ docstring。\n\n![image](img/image00188.jpeg)\n\n### manipulate.py\n\n![image](img/image00225.jpeg)通过定义一个包含\
  \ docstring 描述的简单函数来启动新程序\n\n```python\ndef display( s ) :\n    ‘‘’Display an argument\
  \ value.’’’\n    print( s )\n```\n\n![image](img/image00226.jpeg)接下来，添加一条语句来显示函数描述\n\
  \n```python\ndisplay( display.doc )\n```\n\n![image](img/image00227.jpeg)现在，添加一条语句来显示包含反斜线字符的原始字符串值\n\
  \n```python\ndisplay( r’C:\\Program Files’ )\n```\n\n![image](img/image00228.jpeg)然后，添加一条语句来显示包含转义字符和空格的两个字符串值的拼接\n\
  \n```python\ndisplay( ‘\\nHello’ + ‘ Python’ )\n```\n\n![image](img/image00231.jpeg)接下来，添加一条语句来显示元素索引编号范围内指定字符串的切片\n\
  \n```python\ndisplay( ‘Python In Easy Steps\\n’ [ 7 : ] )\n```\n\n![image](img/image00232.jpeg)最后，显示在指定字符串内查找字符的结果\n\
  \n```python\ndisplay( ‘P’ in ‘Python’ )\ndisplay( ‘p’ in ‘Python’ )\n```\n\n![image](img/image00240.jpeg)保存并运行程序\
  \ – 查看处理后的字符串被显示\n\n![image](img/image00325.jpeg)\n![image](img/image00193.jpeg)\n\
  \n记住字符串必须包含在单引号或双引号内。\n\n![image](img/image00194.jpeg)\n\n使用范围切片时，如果省略起始索引数字，则认为零；如果省略结束索引数字，则认为字符串长度。\n\
  \n### 格式化字符串\n\nPython 内置 `dir()` 函数可以通过在括号内指定模块名来检查模块中定义的函数和变量名称，非常有用。交互模式可以轻松用于此目的，即导入模块名然后调用\
  \ `dir()` 函数。以下示例检查了在第六章中此处创建的“dog”模块：\n\n![image](img/image00326.jpeg)\n![image](img/image00194.jpeg)\n\
  \n注意，上一个示例中引入的 `__doc__` 属性出现在 `dir()` 函数列出的列表中。\n\n那些以双下划线开头和结尾的定义名称是 Python 对象，而其他是程序员定义的。也可以使用\
  \ `dir()` 函数检查 `__builtins__` 模块，以揭示默认定义的函数和变量名称，例如 `print()` 函数和 `str` 对象。\n\n\
  `str` 对象定义了几个用于字符串格式化的有用函数，包括一个执行替换的实际 `format()` 函数。由 `format()` 函数格式化的字符串可以同时包含文本和“替换字段”，标记了从逗号分隔的有序值列表中插入文本的位置。每个替换字段由\
  \ `{ }` 括号表示，括号中可选地包含替换在列表中的索引位置。\n\n![image](img/image00193.jpeg)\n\n不要将此处描述的 `str`\
  \ 对象与将值转换为字符串数据类型的 `str()` 函数混淆。\n\n字符串也可以使用 C 风格的 `%s` 替换操作符进行格式化，标记字符串中从逗号分隔的有序值列表中插入文本的位置。\n\
  \n![image](img/image00188.jpeg)\n\n### format.py\n\n![image](img/image00225.jpeg)通过用格式字符串初始化变量启动新程序\n\
  \n```python\nsnack = ‘{} and {}’.format( ‘Burger’ , ‘Fries’ )\n```\n\n![image](img/image00226.jpeg)接下来，显示变量值以查看按列出的顺序替换的文本\n\
  \n```python\nprint( ‘\\nReplaced:’ , snack )\n```\n\n![image](img/image00227.jpeg)现在，为变量分配一个不同格式的字符串\n\
  \n```python\nsnack = ‘{1} and {0}’.format( ‘Burger’ , ‘Fries’ )\n```\n\n![image](img/image00228.jpeg)然后，再次显示变量值以查看文本现在按指定的索引元素值进行替换\n\
  \n```python\nprint( ‘Replaced:’ , snack )\n```\n\n![image](img/image00231.jpeg)为变量分配另一个格式化字符串\n\
  \n```python\nsnack = ‘%s and %s’ % ( ‘Milk’ , ‘Cookies’ )\n```\n\n![image](img/image00232.jpeg)最后，再次显示变量值以查看按列出的顺序替换的文本\n\
  \n```python\nprint( ‘\\nSubstituted:’ , snack )\n```\n\n![image](img/image00240.jpeg)保存并运行程序\
  \ – 查看格式化字符串被显示\n\n![image](img/image00327.jpeg)\n![image](img/image00215.jpeg)不能在替换字段周围留空格。\n\
  \n![image](img/image00194.jpeg)其他数据类型可以使用 `%d` 替换整数，`%c` 替换字符以及 `%f` 替换浮点数。\n\n\
  ### 修改字符串\n\n`str` 对象有许多有用函数可以通过点后缀调用来修改字符串并检查其内容。常用的字符串修改函数列在下表中，并带有简要描述：\n\n|\
  \ **方法:** | **描述:** |\n| :--- | :--- |\n| `capitalize()` | 将字符串的首字母转换为大写 |\n| `title()`\
  \ | 将所有首字母转换为大写 |\n| `upper()` `lower()` `swapcase()` | 将所有字母转换为大写、小写或当前大小的反转 |\n\
  | `join(seq)` | 使用分隔符合并字符串 |\n| `lstrip()` `rstrip()` `strip()` | 分别移除领先空格、尾部空格或两端空格\
  \ |\n| `replace(old, new)` | 将所有的 *old* 出现替换为 *new* |\n| `ljust(w, c)` `rjust(w,\
  \ c)` | 分别向右或左侧填充字符串直到总宽度 *w*，使用字符 *c* |\n| `center(w, c)` | 在两两侧填充字符串直到总宽度 *w*，使用字符\
  \ *c*（默认是空格） |\n| `count(sub)` | 返回 *sub* 出现的次数 |\n| `find(sub)` | 返回 *sub* 首次出现的索引数字，如果未找到则返回\
  \ -1 |\n| `startswith(sub)` `endswith(sub)` | 如果 *sub* 分别位于开头或结尾，则返回 True；否则返回 False\
  \ |\n| `isalpha()` `isnumeric()` `isalnum()` | 如果所有字符均为字母、均为数字或均为字母或数字，则返回 True；否则返回\
  \ False |\n| `islower()` `isupper()` `istitle()` | 如果字符串字符为小写、大写或所有首字母均为大写，则返回 True；否则返回\
  \ False |\n| `isspace()` | 如果字符串仅包含空格，则返回 True；否则返回 False |\n\n\n\n\n\n| `isdigit()`\
  \ `isdecimal()` | 如果字符串仅包含数字或小数则返回 True，否则返回 False |\n\n![image](img/image00215.jpeg)\n\
  \n空格字符不是字母数字，因此在检查包含空格的字符串时 `isalnum()` 返回 `False`。\n\n![image](img/image00188.jpeg)\n\
  \n### `modify.py`\n\n![image](img/image00225.jpeg)通过初始化包含小写字母和空格的字符串变量启动新程序\n\n\
  ```python\nstring = ‘coding for beginners in easy steps’\n```\n\n![image](img/image00226.jpeg)接下来，显示首字母大写、标题化和居中后的字符串\n\
  \n```python\nprint( ‘\\nCapitalized:\\t’ , string.capitalize() )\nprint( ‘\\nTitled:\\\
  t\\t’ , string.title() )\nprint( ‘\\nCentered:\\t’ , string.center( 30 , ‘*’ ) )\n\
  ```\n\n![image](img/image00227.jpeg)现在，显示全大写的字符串，并与两个星号的序列合并\n\n```python\nprint(\
  \ ‘\\nUppercase:\\t’ , string.upper() )\nprint( ‘\\nJoined:\\t\\t’ , string.join(\
  \ ‘**’ ) )\n```\n\n![image](img/image00228.jpeg)然后，显示左侧用星号填充的字符串\n\n```python\n\
  print( ‘\\nJustified:\\t\\t’ ,string.rjust( 30 , ‘*’ ) )\n```\n\n![image](img/image00231.jpeg)最后，显示将所有出现的\
  \ ‘s’ 字符替换为星号的字符串\n\n```python\nprint( ‘\\nReplaced:\\t’ , string.replace( ‘s’ ,\
  \ ‘*’ ) )\n```\n\n![image](img/image00232.jpeg)保存并运行程序——查看修改后的字符串显示\n\n![image](img/image00328.jpeg)\n\
  \n![image](img/image00193.jpeg)\n\n使用 `rjust()` 函数，右对齐的字符串会在**左侧**添加填充；使用 `ljust()`\
  \ 函数，左对齐的字符串会在**右侧**添加填充。\n\n### 访问文件\n\n可以使用 `dir()` 函数检查 `__builtins__` 模块，发现它包含一个文件对象，该对象定义了几个处理文件的方法，包括\
  \ `open()`、`read()`、`write()` 和 `close()`。\n\n在读取或写入文件之前，必须始终使用 `open()` 函数打开。这需要两个字符串参数来指定文件的名称和位置，以及以下“模式”标识之一来打开文件：\n\
  \n| 文件模式: | 操作: |\n| :--- | :--- |\n| `r` | 打开现有文件进行读取 |\n| `w` | 打开现有文件进行写入。如果不存在则创建新文件，或者打开现有文件并丢弃所有原有内容\
  \ |\n| `a` | 追加文本。在文件末尾打开或创建文本文件进行写入 |\n| `r+` | 打开文本文件进行读取或写入 |\n| `w+` | 打开文本文件进行写入或读取\
  \ |\n| `a+` | 在文件末尾打开或创建文本文件进行读取或写入 |\n| 如果模式在上述列出的任何文件模式后包含 `b`，则操作涉及二进制文件而非文本文件。例如\
  \ `rb` 或 `w+b` |\n\n![image](img/image00215.jpeg)\n\n文件模式参数是字符串值，因此必须用引号括起来。\n\n\
  一旦打开文件并获得文件对象，就可以从其属性获取与该文件相关的各种信息：\n\n| 属性: | 说明 |\n| :--- | :--- |\n| `name` |\
  \ 打开的文件名 |\n| `mode` | 打开文件的模式 |\n| `closed` | 状态布尔值，`True` 或 `False` |\n| `readable()`\
  \ | 可读权限布尔值，`True` 或 `False` |\n| `writable()` | 可写权限布尔值，`True` 或 `False` |\n\n\
  ![image](img/image00194.jpeg)\n\n你还可以使用 `readlines()` 函数，它返回所有行的列表。\n\n![image](img/image00188.jpeg)\n\
  \n### `access.py`\n\n![image](img/image00225.jpeg)通过为名为 “example.txt” 的新文本文件创建文件对象来启动新程序并在其中写入内容\n\
  \n```python\nfile = open( ‘example.txt’ , ‘w’ )\n```\n\n![image](img/image00226.jpeg)接下来，添加语句显示文件名和模式\n\
  \n```python\nprint( ‘File Name:’ , file.name )\nprint( ‘File Open Mode:’ , file.mode\
  \ )\n```\n\n![image](img/image00227.jpeg)现在，添加语句显示文件访问权限\n\n```python\nprint( ‘Readable:’\
  \ , file.readable() )\nprint( ‘Writable:’ , file.writable() )\n```\n\n![image](img/image00228.jpeg)然后，定义一个函数来确定文件的状态\n\
  \n```python\ndef get_status( f ) :\n    if ( f.closed != False ) :\n        return\
  \ ‘Closed’\n    else :\n        return ‘Open’\n```\n\n![image](img/image00231.jpeg)最后，显示将所有出现的\
  \ ‘s’ 字符替换为星号的字符串\n\n```python\nprint( ‘\\nReplaced:\\t’ , string.replace( ‘s’ ,\
  \ ‘*’ ) )\n```\n\n\n\n\n文件中的位置（即读取或写入的位置）可以通过文件对象的 `seek()` 函数进行精细控制。该函数接受一个整数参数，用于指定从文件开始处作为偏移量移动多少个字符。\n\
  \n可以随时通过调用文件对象的 `tell()` 函数来获取文件内的当前位置，该函数会返回一个整数位置。\n\n在处理文件对象时，使用 Python 的 `with`\
  \ 关键字将文件操作语句分组在一个块中是一项良好的做法。这种技术可以确保文件在操作结束后被正确关闭，即使在过程中抛出异常也是如此，而且比编写相应的 `try except`\
  \ 块要短得多。\n\n![image](img/image00188.jpeg)\n\nupdate.py\n\n![image](img/image00225.jpeg)通过给包含文本的变量赋值一个字符串值来启动一个新程序，该文本将写入文件中\n\
  \n```python\ntext = ‘The political slogan “Workers Of The World Unite!” \\nis from\
  \ The Communist Manifesto.’\n```\n\n![image](img/image00226.jpeg)接下来，添加语句将文本字符串写入文件，并在“with”\
  \ 块中显示文件的当前状态\n\n```python\nwith open( ‘update.txt’ , ‘w’ ) as file :\nfile.write(\
  \ text )\nprint( ‘\\nFile Now Closed?:’ , file.closed )\n```\n\n![image](img/image00227.jpeg)现在，在“with”代码块之后添加一个非缩进的语句来显示文件的新状态\n\
  \n```python\nprint( ‘File Now Closed?:’ , file.closed )\n```\n\n![image](img/image00228.jpeg)然后，重新打开文件并显示其内容，以确认它现在包含了整个字符串\n\
  \n```python\nwith open( ‘update.txt’ , ‘r+’ ) as file :\ntext = file.read()\nprint(\
  \ ‘\\nString:’ , text )\n```\n\n![image](img/image00231.jpeg)接下来，添加缩进语句显示当前文件位置，然后重新定位并显示该新位置\n\
  \n```python\nprint( ‘\\nPosition In File Now:’ , file.tell() )\nposition = file.seek(\
  \ 33 )\nprint( ‘Position In File Now:’ , file.tell() )\n```\n\n![image](img/image00232.jpeg)现在，添加一个缩进语句从当前文件位置开始覆盖文本\n\
  \n```python\nfile.write( ‘All Lands’ )\n```\n\n![image](img/image00240.jpeg)然后，添加缩进语句再次在文件中重新定位，并从新位置覆盖文本\n\
  \n```python\nfile.seek( 61 )\nfile.write( ‘the tombstone of Karl Marx.’ )\n```\n\
  \n![image](img/image00332.jpeg)最后，添加缩进语句返回到文件开头并显示其更新后的完整内容\n\n```python\nfile.seek(\
  \ 0 )\ntext = file.read()\nprint( ‘\\nString:’ , text )\n```\n\n![image](img/image00333.jpeg)保存并运行程序——查看文件字符串的更新\n\
  \n![image](img/image00335.jpeg)\n\n![image](img/image00194.jpeg)\n\n`seek()` 函数可选地接受第二个第二个参数值\
  \ `0`、`1` 或 `2`，分别从起始、当前或结束位置移动指定数量的字符—— 0 是默认的起始位置。\n\n![image](img/image00193.jpeg)\n\
  \n与字符串一样，文件中的第一个字符位于索引位置零，而不是索引位置一。\n\n## 总结\n\n- 字符串可以通过运算符 `+` 进行拼接以连接字符串，以及通过\
  \ `*` 进行字符串重复\n- 字符串可以通过运算符切片 `[ ]` 和范围切片 `[ : ]` 进行操作，这些操作引用了字符串字符的索引数字\n- 字符串可以通过成员运算符\
  \ `in` 和 `not in` 进行操作，用于在字符串内查找匹配指定的字符\n- `r`（或 `R`）原始字符串运算符可以放置在字符串之前，以抑制其中包含的任何转义字符\n\
  - “文档字符串”（docstring）是模块、类或函数开头用三引号括的描述性字符串，用于定义其用途\n- `__doc__` 属性可用于引用文档字符串中的字符串描述\n\
  - 使用 `dir()` 函数可以检查 `__builtins__` 模块以显示默认函数和变量的名称\n- `str` 对象拥有一个用于字符串格式化的 `format()`\
  \ 函数，以及许多用于修改字符串的函数，如 `capitalize()`\n- 使用 `format` 函数进行格式化的字符串中的替换字段用逗号分隔的列表中的\
  \ `{ }` 大括号表示\n- 字符串也可以使用 C 风格的 `%s` 替换运算符进行格式化，标记字符串中要插入文本的地方\n- 文件对象拥有 `open()`、`read()`、`write()`\
  \ 和 `close()` 函数用于处理文件，以及描述文件属性的特征\n- `open()` 函数必须指定文件名字符串参数和一个文件模式字符串参数，例如用于读取文件的\
  \ ’r’\n- 打开的文件对象具有信息属性，可以揭示其当前状态，例如 `mode` 和 `readable()` 值\n- 文件中的读取或写入位置可以通过 `seek()`\
  \ 方法指定，并通过 `tell()` 函数报告\n- Python `with` 关键字将文件操作语句分组在一个块中\n\n10\n\n## 程序对象\n\n\
  *本章演示了如何将虚拟对象编码到程序中*\n\n- 定义类\n- 复制实例\n- 处理属性\n- 派生类\n- 重写方法\n- 应用意义\n- 总结\n\n###\
  \ 定义类\n\n我们周围的真实对象每个都有我们可以描述的属性和行为。例如，一个汽车可以用“红色”属性和“加速”行为来描述。\n\n“类”是描述一组属性的原型。每个类都有一个包含函数和变量的数据结构。类的属性被称为数据“成员”。类函数成员被称为“方法”，而类变量成员（定义在类内但在方法定义之外）被称为“属性”。类成员可以通过点符号在程序中引用，在类名后加上成员名，语法为\
  \ `class-name.method-name()` 或 `class-name.attribute-name`。\n\n![image](img/image00336.jpeg)\n\
  \n类声明以 `class` 关键字开头，后面跟着程序员指定的名称（遵循命名规范但首字母大写），然后是 `:` `:`。接下来是缩进语句，可选指定类文档字符串、类变量声明和类方法定义——因此类块的语法如下：\n\
  \n```python\nclass ClassName :\n‘’‘ class-documentation-string ‘‘\nclass-variable-declarations\n\
  class-method-definitions\n```\n\n类声明指定了它的属性和方法，是从它可以创建工作副本（“实例”）的蓝图。所有在方法定义定义的变量都被称为“实例”变量，仅在定义它们的方法局部可用，无法在类结构之外直接引用。\n\
  \n![image](img/image00194.jpeg)\n\n习惯上类名以大写字母开头，对象名以小写字母开头。\n\n\n\n类的所有属性都通过点表示法前缀\
  \ `self` 在内部引用——因此，名为“sound”的属性是 `self.sound`。此外，类中的所有方法定义必须将 `self` 作为其第一个参数——因此，名为“talk”的方法是\
  \ `talk( self )`。\n\n当创建类实例时，会自动调用一个特殊的 `__init__( self )` 方法。如果需要传递值来初始化其属性，可以在该方法的括号中添加后续参数。\n\
  \n一个完整的 Python 类声明可能像示例所示：\n\n```python\nclass Critter :\n    ‘‘‘ 所有小生物属性的基类。 ‘‘\n\
  \    count = 0\n    def __init__( self , chat ) :\n        self.sound = chat\n \
  \       Critter.count += 1\n    def talk( self ) :\n        return self.sound\n\
  ```\n\n![image](img/image00193.jpeg)\n\n可以通过特殊的 `__doc__` 文档字符串属性 `ClassName.__doc__`\
  \ 访问类的文档字符串。\n\n检查此示例的类组件是有用的：\n\n- 变量 `count` 是一个类变量，其整数值由该类的所有实例共享——该值可以在类内部或外部通过\
  \ `Critter.count` 引用\n- 第一个方法 `__init__()` 是初始化方法，在创建类实例时自动调用\n- 在这种情况下，`__init__()`\
  \ 方法初始化了一个实例变量 `sound`，其值从 `chat` 参数传递而来，并且每当创建该类的实例时，都会增加 `count` 类变量的值\n- 第二个方法\
  \ `talk()` 的声明像普通函数一样，不同之处在于第一个参数是 `self`，它是自动包含的——调用者不需要传递值\n- 在这种情况下，`talk()`\
  \ 方法简单返回封装在 `sound` 实例变量中的值\n\n![image](img/image00194.jpeg)\n\n虽然程序类不能完美模拟真实世界的对象，但其目的是封装所有相关的属性和操作。\n\
  \n### 复制实例\n\n类对象的“实例”仅仅是通过调用该类的构造函数并在其括号内指定所需的参数数量而创建的原型的副本。调用的参数必须与 `__init__()`\
  \ 方法定义的参数匹配——除了内部 `self` 参数的值除外。\n\n构造函数返回的类实例对象将使用语法 `instance-name = ClassName(\
  \ *args )` 赋值给变量。\n\n点表示法可以通过在名称后添加后缀 `instance-name.method-name()` 或 `instance-name.attribute-name`\
  \ 来引用实例对象的方法和类变量属性。\n\n![image](img/image00194.jpeg)\n\n构造函数使用类名后包含任何必要参数的括号创建一个类实例。\n\
  \n通常，基类可以定义为 Python 模块文件，这样它可以被导入到其他脚本中，在脚本中可以从“主”类原型轻松创建实例对象。\n\n![image](img/image00188.jpeg)\n\
  \n### Bird.py\n\n![image](img/image00241.jpeg)通过声明一个带有描述性文档字符串的新类来开始一个新的类文件\n\n\
  ```python\nclass Bird :\n    ‘‘‘ 定义鸟类属性的基类。’’\n    count = 0\n    def __init__(\
  \ self , chat ) :\n        self.sound = chat\n        Bird.count += 1\n    def talk(\
  \ self ) :\n        return self.sound\n```\n\n![image](img/image00242.jpeg)接下来，添加一个缩进的语句来声明并初始化一个整数零值的类变量属性\n\
  \n```python\ncount = 0\n```\n\n![image](img/image00243.jpeg)现在，定义初始化类方法来初始化实例变量并增加类变量的值\n\
  \n```python\ndef __init__( self , chat ) :\n    self.sound = chat\n    Bird.count\
  \ += 1\n```\n\n![image](img/image00244.jpeg)最后，添加一个类方法在被调用时返回实例变量的值——然后保存此类文件\n\n\
  ```python\ndef talk( self ) :\n    return self.sound\n```\n\n![image](img/image00193.jpeg)你不能为\
  \ `self` 参数传递参数值，因为这是由 Python 自动包含的。\n\n![image](img/image00188.jpeg)\n\n### instance.py\n\
  \n![image](img/image00245.jpeg)通过使类文件的功能可用启动程序，然后显示其文档字符串\n\n```python\nfrom Bird\
  \ import ***\nprint( ‘\\nClass Instances Of:\\n’ , Bird.__doc__ )\n```\n\n![image](img/image00246.jpeg)接下来，添加一个语句创建类的实例并向其实例变量传递字符串参数值\n\
  \n```python\npolly = Bird( ‘Squawk, squawk!’ )\n```\n\n![image](img/image00247.jpeg)现在，显示类变量的值并向其实例变量传递字符串参数值\n\
  \n```python\nprint( ‘\\nNumber Of:’ , Bird.count )\nprint( ‘Polly Says:’ , polly.talk()\
  \ )\n```\n\n![image](img/image00337.jpeg)类实例——polly\n\n![image](img/image00248.jpeg)创建类的第二个实例并向其实例变量传递不同的字符串值\n\
  \n```python\nharry = Bird( ‘Tweet, tweet!’ )\n```\n\n![image](img/image00338.jpeg)最后，显示实例变量的值并调用方法显示类变量的值\n\
  \n```python\nprint( ‘\\nNumber Of:’ ,.count )\n\n((Harry Says:’ , harry.talk() )\n\
  ```\n\n![image](img/image00339.jpeg)类实例——harry\n\n![image](img/image00340.jpeg)保存这两个文件后运行程序——看到两个类的实例\n\
  \n![image](img/image00341.jpeg)类变量 `count` 可以通过 `Bird.count` 引用，但实例变量 `sound` 只能通过调用实例的\
  \ `talk()` 方法访问。\n\n![image](img/image00215.jpeg)Python 自动提供的属性名称始终以划线字符开头，在逻辑上表示“私有”——因此这些不应被修改或删除。你可以按照这种方式添加自己的属性以表示私有，但实际上它们可以像其他属性一样被修改。\n\
  \n### 属性访问\n\n类实例的属性可以使用点表示法随时添加、修改或删除。向属性赋值的语句将更新现有属性或创建一个新属性：\n\n`instance-name\
  \ = value`\n\n或者，你可以使用以下内置函数来添加、修改或删除实例变量：\n\n- `getattr(instance-name, ‘attribute-name‘)`\
  \ —— 返回实例的属性值\n- `hasattr(instance-name, ‘attribute-name‘)` —— 如果属性存在于实例中返回 True，否则返回\
  \ False\n- `setattr(instance-name, ‘attribute-name‘, value)` —— 更新现有属性或在实例中创建一个新属性\n\
  - `delattr(instance-name, ‘attribute-name‘)` —— 从实例中删除属性\n\n这些内置函数指定的属性名必须包含引号内。\n\
  \n### address.py\n\n![image](img/image00188.jpeg)通过使此处创建的 Bird 类功能可用启动新程序\n\n```python\n\
  from Bird import ***\nchick = Bird( ‘Cheep, cheep!’ )\nchick.age = ‘1 week’\n```\n\
  \n现在，显示两个实例变量属性的值：\n\n```python\nprint( ‘\\nChick Says:’ , chick.talk() )\nprint(\
  \ ‘Chick Age:’ , chick.age )\n```\n\n然后使用点表示法修改新属性并显示其新值：\n\n```python\nchick.age\
  \ = ‘2 weeks’\nprint( ‘Chick Now:’ , chick.age )\n```\n\n接下来，再次修改新属性，这次使用内置函数：\n\
  \n```python\nsetattr(chick, ‘age’, ‘3 weeks’ )\n```\n\n\n\n\n![image](img/image00246.jpeg)现在，使用内置函数显示所有非私有实例属性及其对应的值\n\
  \n```python\nprint( ‘\\nChick Attributes...’ )\nfor attrib in dir( chick ) :\nif\
  \ attrib[0] != ‘_’ :\n    print( attrib , ‘:’ , getattr( chick , attrib ) )\n```\n\
  \n![image](img/image00247.jpeg)最后，删除新属性并使用内置函数确认其已删除\n\n```python\ndelattr( chick\
  \ , ‘age’ )\nprint( ‘\\nChick age Attribute?’ , hasattr( chick , ‘age’ ) )\n```\n\
  \n![image](img/image00248.jpeg)保存并运行程序 – 查看实例属性如何被处理\n\n![image](img/image00342.jpeg)\n\
  \n![image](img/image00343.jpeg)\n\n鸟类实例 – 小鸡\n\n![image](img/image00193.jpeg)\n\n\
  此循环会跳过任何以下划线开头的属性，因此“私有”属性将不会显示在列表中。\n\n## 派生类 (Deriving classes)\n\nPython 类可以作为一个全新的类创建（如之前的示例所示），也可以从现有类“派生”。重要的是，派生类继承其所派生的父类（基类）的成员，同时也包含它自己的成员。\n\
  \n从基类继承成员的能力允许创建共享某些共同属性的派生类，这些属性已经在基类中定义。例如，“多边形”（Polygon）基类可以定义所有多边形通用的宽度和高度属性。“矩形”（Rectangle）和“三角形”（Triangle）类可以从\
  \ `Polygon` 类派生 – 继承宽度和高度属性，以及定义其独特特征的成员。\n\n![image](img/image00344.jpeg)\n\n![image](img/image00345.jpeg)\n\
  \n继承的优点非常强大，它是面向对象编程（OOP）的第二个原则。\n\n派生类的声明在其类名后添加 `()` 括号，并指定其父基类的名称。\n\n![image](img/image00188.jpeg)\n\
  \nPolygon.py\n\n![image](img/image00241.jpeg)创建一个新的类文件，声明一个带有两个类变量和一个设置值方法的基类\n\n\
  ```python\nclass Polygon :\nwidth = 0\nheight = 0\ndef set_values( self , width\
  \ , height ) :\n    Polygon.width = width\n    Polygon.height = height\n```\n\n\
  ![image](img/image00188.jpeg)\n\nRectangle.py\n\n接下来，创建一个类文件，声明一个派生类，带一个返回处理后的类变量值的方法\n\
  \n```python\nfrom Polygon import *\nclass Rectangle( Polygon ) :\ndef area( self\
  \ ) :\n    return self.width * self.height\n```\n\n![image](img/image00188.jpeg)\n\
  \nTriangle.py\n\n现在，创建另一个类文件，声明一个派生类，带一个返回处理后的类变量值的方法\n\n```python\nfrom Polygon\
  \ import *\nclass Triangle( Polygon ) :\ndef area( self ) :\n    return ( self.width\
  \ * self.height ) / 2\n```\n\n![image](img/image00244.jpeg)保存这三个类文件，然后通过提供两个派生类的特征启动一个新程序\n\
  \n```python\nfrom Rectangle import *\nfrom Triangle import *\n```\n\n![image](img/image00245.jpeg)接下来，创建每个派生类的实例\n\
  \n```python\nrect = Rectangle()\ntrey = Triangle()\n```\n\n![image](img/image00246.jpeg)现在，调用从基类继承的类方法，传递参数以分配类变量\n\
  \n```python\nrect.set_values( 4 , 5 )\ntrey.set_values( 4 , 5 )\n```\n\n![image](img/image00247.jpeg)最后，显示处理从基类继承的类变量的结果\n\
  \n```python\nprint( ‘Rectangle Area:’ , rect.area() )\nprint( ‘Triangle Area:’ ,\
  \ trey.area() )\n```\n\n![image](img/image00248.jpeg)保存并运行程序 – 查看使用继承特征显示的输出\n\n\
  ![image](img/image00346.jpeg)\n\n![image](img/image00188.jpeg)\n\ninherit.py\n\n\
  ![image](img/image00194.jpeg)\n\n类声明可以通过在声明中名称后的括号内列出多个基类来派生自多个类。\n\n![image](img/image00215.jpeg)\n\
  \n不要混淆类实例和派生类 – 实例是类的拷贝，而派生类是一个继承其所派生的基类属性的新类。\n\n## 方法重写 (Overriding methods)\n\
  \n可以在派生类中声明一个方法来重写基类中匹配的方法 – 如果两个方法的声明具有相同的名称且列出的参数数量相同。这实际上隐藏了基类方法，因为除非显式使用基类名进行标识并调用，否则它是它是不可访问的。\n\
  \n当基类中的方法提供默认参数值时，可以在显式调用基类方法时使用该值，或者通过重写方法提供替代值。\n\n![image](img/image00188.jpeg)\n\
  \nPerson.py\n\n![image](img/image00241.jpeg)创建一个新的类文件，声明一个基类，带一个初始化方法来设置实例变量，以及第二个显示该变量值的方法\n\
  \n```python\nclass Person :\n'''用于定义 Person 属性的基类。’’\ndef __init__( self , name\
  \ ) :\n    self.name = name\ndef speak( self , msg = ‘(Calling The Base Class)’\
  \ ) :\n    print( self.name , msg )\n```\n\n![image](img/image00188.jpeg)\n\nMan.py\n\
  \n![image](img/image00242.jpeg)接下来，创建一个类文件，声明一个派生类，带一个重写第二个基类方法的方法\n\n```python\n\
  from Person import *\n‘‘用于定义 Man 属性的派生类。’’\nclass Man( Person ) :\ndef speak( self\
  \ , msg ) :\n    print( self.name , ‘:\\n\\tHello!’ , msg )\n```\n\n![image](img/image00188.jpeg)\n\
  \nHombre.py\n\n![image](img/image00243.jpeg)现在，创建另一个类文件，声明一个派生类，带一个再次重写基类中相同的方法\n\
  \n```python\nfrom Person import *\n‘‘用于定义 Hombre 属性的派生类。’’\nclass Hombre( Person\
  \ ) :\ndef speak( self , msg ) :\n    print( self.name , ‘:\\n\\tHola!’ , msg )\n\
  ```\n\n![image](img/image00188.jpeg)\n\noverride.py\n\n![image](img/image00244.jpeg)保存三个类文件，然后通过提供两个派生类的特征启动新程序\n\
  \n```python\nfrom Man import *\nfrom Hombre import *\n```\n\n![image](img/image00245.jpeg)接下来，创建每个派生类的实例，初始化“name”实例变量\n\
  \n```python\nguy_1 = Man( ‘Richard’ )\nguy_2 = Hombre( ‘Ricardo’ )\n```\n\n![image](img/image00246.jpeg)现在，调用每个派生类的重写方法，为“msg”参数分配不同的值\n\
  \n```python\nguy_1.speak( ‘It’s a beautiful evening.\\n’ )\nguy_2.speak( ‘Es una\
  \ tarde hermosa.\\n’ )\n```\n\n![image](img/image00247.jpeg)最后，显式调用基类方法，传递每个派生类的引用\
  \ 但 但没有“msg”变量，因此将使用其默认值\n\n```python\nPerson.speak( guy_1 )\nPerson.speak( guy_2\
  \ )\n```\n\n![image](img/image00248.jpeg)保存并运行程序 – 查看重写方法和基类方法的输出\n\n![image](img/image00347.jpeg)\n\
  \n![image](img/image00348.jpeg)\n\nMan – Richard\n\nHombre – Ricardo\n\n![image](img/image00193.jpeg)\n\
  \n派生类中的方法声明必须与基类中的完全匹配才能重写它。\n\n## 应用意义 (Applying sense)\n\n面向对象编程（OOP）的三大基石是封装、继承和多态。本章之前的示例演示了如何将数据封装在\
  \ Python 类中，以及派生类如何继承基类的属性。本示例引入了多态这一最后一个基石原则。\n\n“多态”（源自希腊语，意为“多种形式”）描述了根据上下文给实体分配不同含义或目的的能力。\n\
  \n![image](img/image00349.jpeg)\n\n\n\n\n\n在 Python 中，`+` 字符实体可以被描述为多态的，因为它在数值操作数的上下文中表示算术加法运算符，在字符操作数的上下文中则表示字符串拼接运算符。\n\
  \n也许更重要的是，Python 类方法也可以多态的，因为 Python 语言使用了“鸭子类型”（duck typing）——这意味着……如果一只鸟走起来像鸭子，游泳像鸭子，叫起来也像鸭子，那么这只鸟就被认为是鸭子。\n\
  \n在一种鸭子类型语言中，你可以创建一个函数来接收任何类型的对象并调用该对象的方法。如果该对象确实具有被调的方法（被认为是鸭子），则执行这些方法；否则函数将报告运行时错误。\n\
  \n可以为多个类创建同名方法，且这些类的实例将执行关联的版本。\n\n![image](img/image00188.jpeg)\n\n`Duck.py`\n\n\
  ![image](img/image00241.jpeg)创建一个新的类文件，声明一个带有显示该类唯一字符串方法的类\n\n```python\nclass Duck\
  \ :\n    def talk( self ) :\n        print( ‘\\nDuck Says: Quack!’ )\n    def coat(\
  \ self ) :\n        print( ‘Duck Wears: Feathers’ )\n```\n\n![image](img/image00188.jpeg)\n\
  \n`Mouse.py`\n\n![image](img/image00242.jpeg)接下来，创建一个类文件，声明一个具有同名方法但显示此类唯一字符串的类\n\
  \n```python\nclass Mouse :\n    def talk( self ) :\n        print( ‘\\nMouse Says:\
  \ Squeak!’ )\n    def coat( self ) :\n        print( ‘Mouse Wears: Fur’ )\n```\n\
  \n![image](img/image00188.jpeg)\n\n`polymorph.py`\n\n![image](img/image00243.jpeg)保存这两个类文件，然后通过这两个类的特性启动一个新程序\n\
  \n```python\nfrom Duck import *\nfrom Mouse import *\n```\n\n![image](img/image00244.jpeg)接下来，定义一个接受任何单个对象作为参数并尝试调用该对象方法的函数\n\
  \n```python\ndef describe( object ) :\n    object.talk()\n    object.coat()\n```\n\
  \n![image](img/image00245.jpeg)现在，为每个类创建一个实例对象\n\n```python\ndonald = Duck()\nmickey\
  \ = Mouse()\n```\n\n![image](img/image00246.jpeg)最后，添加语句调用函数并将每个实例对象作为参数传递给它\n\n\
  ```python\ndescribe( donald )\ndescribe( mickey )\n```\n\n![image](img/image00247.jpeg)保存并运行程序——以看到关联版本的方法被调用\n\
  \n![image](img/image00350.jpeg)\n\n![image](img/image00351.jpeg)\n\nDuck – donald\n\
  \n![image](img/image00352.jpeg)\n\nMouse – mickey\n\n![image](img/image00193.jpeg)\n\
  \n一个类只能有一个给定名称的方法——Python 不支持方法重载。\n\n面向对象的对象编程（Python）允许数据封装、继承和多态。基类方法可以被派生类中的同名方法覆盖。然而，Python\
  \ 不支持在其他语言中常见的“重载”技术——在其他语言中，可以在同一个类中创建具有不同参数列表的同名方法。\n\n## 总结\n\n-   编程对象类似于真实对象的虚拟表示，在“类”中描述属性和行为\n\
  -   类是数据结构的原型，通过其方法和属性成员描述对象的属性\n-   每个类声明都以 `class` 关键字开头，后紧跟一个缩进的代码块，该代码块可能包含类文档字符串、类变量和类方法\n\
  -   类变量具有全局作用域，但实例变量（在方法定义内部声明的变量）只有局部作用域\n-   实例变量在类结构中安全地封装数据，并在类实例创建时进行初始化\n\
  -   类的属性通过点符号法进行引用，并在内部使用 `self` 前缀进行处理\n-   类实例是原型的副本，在实例首次创建时会自动调用其 `__init__()`\
  \ 方法\n-   可以使用点符号法添加、修改或删除类的属性，或者使用内置函数 `getattr()`、`hasattr()`、`setattr()` 和 `delattr()`\
  \ 对属性进行操作\n-   Python 自动提供的属性名称以下划线字符开头，用在名义上表示私有性\n-   派生类继承其所自出的父基类的方法和属性成员\n\
  -   派生类的声明必须在自己的类名后的括号中指明其父基类的名称\n-   派生类的方法可以覆盖其父基类中同名的匹配方法\n-   可以使用基类名进行标识来显式调用基类的方法\n\
  -   Python 是一种鸭子类型语言，支持多个类同名方法的多态性\n-   面向对象编程（OOP）的三大基石是封装、继承和多态\n\n11\n\n### 构建接口\n\
  \n*本章演示了如何编写图形化窗口程序*。\n\n-   启动接口\n-   响应按钮\n-   显示消息\n-   收集条目\n-   列出选项\n-   轮询接口\n\
  -   检查按钮\n-   添加图像\n-   总结\n\n### 启动接口\n\n用于创建图形应用程序的标准 Python 模块称为 `tkinter` ——\
  \ 一个与系统 GUI（图形用户界面）交互的工具。`tkinter` 模块可以像其他模块一样导入到程序中。每个 `tkinter` 程序必须通过调用 `Tk()`\
  \ 构造函数创建一个窗口。窗口的大小可以通过对象的 `geometry()` 方法可选地指定。同样，窗口标题可以通过对象的 `title()` 方法作为字符串参数指定。如果没有指定，将使用默认的大小和标题。\n\
  \n![image](img/image00215.jpeg)\n\n`Tk()` 构造函数只有一个调用且必须位于程序的开头。\n\n每个 `tkinter`\
  \ 程序还必须调用对象的 `mainloop()` 方法来捕捉事件，例如用户关闭窗口退出。此循环应该出现在程序的末，因为它还处理可能实现的窗口更新。\n\n使用\
  \ `tkinter`，包含在应用程序中的图形控件（如按钮或复选框）被称为“部件”（widgets）。简单的部件可能是非交互式的标签对象，仅显示文本或图像。可以通过指定窗口对象的名称和作为\
  \ `Label()` 构造函数的 `text='string’` 参数来创建标签对象。\n\n一旦创建，每个部件（如标签）都必须使用这些“几何管理器”方法添加到窗口中：\n\
  \n-   `pack()` —— 使用指定的 `side=` 参数的 `TOP`、`BOTTOM`、`LEFT` 或 `RIGHT` 常量将部件放置在窗口的某侧\n\
  -   `place()` —— 使用指定的 `x=` 和 `y=` 数值将部件放置在窗口的 XY 坐标\n-   `grid()` —— 使用指定的 `row=`\
  \ 和 `column=` 数值将部件放置在窗口的单元格内\n\n![image](img/image00194.jpeg)\n\n`grid()` 几何管理器方法在此处示例\
  \ 中进行了演示。\n\n可选地，`pack()` 方法可以包含 `fill` 参数以在可用空间内扩展。例如，使用 `fill='x’`。或者，`pack()`\
  \ 方法可以包含 `padx` 和 `pady` 参数，沿轴按指定量扩展部件。\n\n\n\n\n\nfrom tkinter import ***\n\n![image](img/image0025.jpeg)接下来，添加一条语句调用构造函数来创建一个窗口对象\n\
  \n```python\nwindow = Tk()\n```\n\n![image](img/image00259.jpeg)现在，添加一条语句为此窗口指定标题\n\
  \n```python\nwindow.title( ‘Label Example’ )\n```\n\n![image](img/image00260.jpeg)然后，添加一条语句调用构造函数来创建一个标签对象\n\
  \n```python\nlabel = Label( window , text = ‘Hello World!’ )\n```\n\n![image](img/image00261.jpeg)使用\
  \ packer 将标签添加到窗口中，并设置水平和垂直内边进行定位\n\n```python\nlabel.pack( padx = 200 , pady =\
  \ 50 )\n```\n\n![image](img/image00262.jpeg)最后，添加必要的语句通过捕获事件来维持窗口\n\n```python\n\
  window.mainloop()\n```\n\n![image](img/image00266.jpeg)保存并运行程序 – 看到一个包含标签部件的窗口\n\
  \n![image](img/image00353.jpeg)\n\n![image](img/image00193.jpeg)\n\n运行程序时，除非使用几何管理器添加部件，否则部件不会出现在窗口中。\n\
  \n## 响应按钮\n\n`Button` 部件在应用程序窗口中提供一个图形按钮，其中可以包含文本或图像以传达按钮的作用。通过将窗口名称和选项作为参数传递给 `Button()`\
  \ 构造函数创建按钮对象。每个选项都以 `option=value` 对的形式指定。`command` 选项必须始终指定用户点击该按钮时要调用的函数或方法名称。常用的选项列如下，并附有简要描述：\n\
  \n| **选项 (Option):** | **描述 (Description):** |\n| :--- | --- |\n| **activebackground**\
  \ | 光标悬停时的背景颜色 |\n| **activeforeground** | 光标悬停时的前景颜色 |\n| **bd** | 像素单位的边宽（默认为\
  \ 2） |\n| **bg** | 背景颜色 |\n| **command** | 点击时调用的函数 |\n| **fg** | 前景颜色 |\n| **font**\
  \ | 按钮标签的字体 |\n| **height** | 以文本行数为单位的高度，或图像的像素 |\n| **highlightcolor** | 获得焦点时的边框颜色\
  \ |\n| **image** | 代替文本显示的图像 |\n| **justify** | 多行文本对齐方式：LEFT、CENTER 或 RIGHT |\n\
  | **padx** | 水平内边距 |\n| **pady** | 垂直内边距 |\n| **relief** | 边框样式：SUNKEN、RIDGE、RASED\
  \ 或 GROOVE |\n| **state** | NORMAL 或 DISABLED 启用状态 |\n| **underline** | 文本中需要下划线的字符索引号\
  \ |\n| **width** | 以字符数为单位的按钮宽度，或图像的像素 |\n| **wraplength** | 文本换行的长度 |\n\n![image](img/image00194.jpeg)\n\
  \n你还可以调用按钮的 `invoke()` 方法，继而调用指定给其 `command` 选项的函数。\n\n分配给其他选项的值决定了部件的外观。可以通过向部件的\
  \ `configure()` 方法传递一个新的 `option=value` 对来更改这些值。此外，可以通过将选项名称作为字符串参数传递给部件的 `cget()`\
  \ 方法来获取当前的选项值。\n\n![image](img/image00188.jpeg)\n\nbutton.py\n\n![image](img/image00257.jpeg)通过启用\
  \ GUI 功能启动新程序，然后创建一个窗口并指定标题\n\n```python\nfrom tkinter import ***\nwindow = Tk()\n\
  window.title( ‘Button Example’ )\n```\n\n![image](img/image00258.jpeg)接下来，创建一个按钮，在点击时退出程序\n\
  \n```python\nbtn_end = Button( window , text = ‘Close’ , command=exit )\n```\n\n\
  ![image](img/image00259.jpeg)现在，添加一个函数在另一个按钮被点击时切换窗口的背景颜色\n\n```python\ndef tog()\
  \ :\n    if window.cget( ‘bg’ ) == ‘yellow’ :\n        window.configure( bg = ‘gray’\
  \ )\n    else :\n        window.configure( bg = ‘yellow’ )\n```\n\n![image](img/image00260.jpeg)然后，创建一个按钮，在点击时调用该函数\n\
  \n```python\nbtn_tog = Button( window , text = ‘Switch’ , command=tog )\n```\n\n\
  ![image](img/image00261.jpeg)带有位置内边距将按钮添加到窗口\n\n```python\nbtn_end.pack( padx =\
  \ 150 , pady = 20 )\nbtn_tog.pack( padx = 150 , pady = 20 )\n```\n\n![image](img/image00262.jpeg)最后，添加循环来捕获此窗口的事件\n\
  \n```python\nwindow.mainloop()\n```\n\n![image](img/image00266.jpeg)保存并运行程序并点击按钮\
  \ – 看到窗口背景颜色的变化\n\n![image](img/image00354.jpeg)\n\n![image](img/image00355.jpeg)\n\
  \n![image](img/image00215.jpeg)\n\n`command` 选项仅指定函数名。在赋值时不要添加末尾括号。\n\n![image](img/image00194.jpeg)\n\
  \n‘gray’ 颜色是默认颜色。\n\n## 显示消息\n\n可以通过调用“tkinter.messagebox”模块提供的方法向用户显示消息。这必须单独导入：\n\
  \n| **方法 (Method):** | **图标 (Icon):** | **按钮 (Buttons):** |\n| :--- | --- | ---\
  \ |\n| `showinfo()` | ![image](img/image00356.jpeg) | OK |\n| `showwarning()` |\
  \ ![image](img/image00357.jpeg) | OK |\n| `showerror()` | ![image](img/image00358.jpeg)\
  \ | OK |\n| `askquestion()` | ![image](img/image00359.jpeg) | Yes, No |\n| `askokcancel()`\
  \ | ![image](img/image00360.jpeg) | OK, Cancel |\n| `askyesno()` | ![image](img/image00359.jpeg)\
  \ | Yes, No |\n| `askretrycancel()` | ![image](img/image00360.jpeg) | Retry, Cancel\
  \ |\n\n`askyesno()` 方法返回两个值：Yes (1) 和 No (0)。返回值的函数可以通过测试该值来进行条件分支。不返回值的在按钮被点击时不会返回。\n\
  \nmessage.py\n\n```python\nfrom tkinter import ***\nimport tkinter.messagebox as\
  \ box\n\nwindow = Tk()\nwindow.title( ‘Message Box’ )\n\ndef dialog() :\n    var\
  \ = box.askyesno( ‘Message Box’ , ‘Proceed?’ )\n    if var == 1 :\n        box.showinfo(\
  \ ‘Yes Box’, ‘Proceeding...’ )\n    else :\n        box.showwarning( ‘No Box’, ‘Canceling...’\
  \ )\n\nbtn = Button( window , text = ‘Click’ , command=dialog )\nbtn.pack( padx\
  \ = 150 , pady = 50 )\nwindow.mainloop()\n```\n\n可以将选项作为第三个参数添加到这些方法调用中。例如，添加 `type='abortretryignore'`\
  \ 获取三个按钮。\n\n## 获取输入\n\n`Entry` 部件在应用程序中提供单行输入字段，程序可以从中获取用户的输入。\n\n\n\n\n\n| `highlightcolor`\
  \ | 处于获得焦点状态时的边框颜色 |\n| :--- | :--- |\n| `selectbackground` | 选中文本的背景颜色 |\n| `selectforeground`\
  \ | 选中文本的前景颜色 |\n| `show` | 使用 `show='*'` 隐藏密码字符 |\n| `state` | `NORMAL` 或 `DISABLED`\
  \ 启用状态 |\n| `width` | 以字母为单位的输入框宽度 |\n\n多个小部件可以组在框架（frames）中以实现更好的定位。通过向 `Frame()`\
  \ 构造函数指定窗口名称来创建一个框架对象。然后，可以将框架的名称作为小部件构造函数的第一个参数，以将其标识为该小部件的容器。\n\n在实际将小部件添加到框架中时，你可以使用\
  \ `TOP`、`BOTTOM`、`LEFT` 或 `RIGHT` 常量来指定它们打包在框架的哪一侧。例如，`entry.pack( side=LEFT )`。\n\
  \n![image](img/image00194.jpeg)\n\n如果你想允许用户输入多行文本，请使用 `Text` 小部件而不是 `Entry` 小部件。\n\
  \n通常，一个输入小部件会出现在描述用户预期输入类型的标签（label）旁边，或者出现在一个用户可以点击以对其输入的数据执行某些操作的按钮小部件旁边，因此在框架中进行定位是理想的。当前输入到输入小部件中的数据可以通过程序使用该小部件的\
  \ `get()` 方法获取。\n\n![image](img/image00188.jpeg)\n\nentry.py\n\n![image](img/image00257.jpeg)让\
  \ GUI 功能和消息框功能作为短别名可用来启动新程序\n\n```python\nfrom tkinter import *\nimport tkinter.messagebox\
  \ as box\n```\n\n![image](img/image00258.jpeg)接下来，创建一个窗口对象并指定标题\n\n```python\nwindow\
  \ = Tk()\nwindow.title( ‘Entry Example’ )\n```\n\n![image](img/image00259.jpeg)现在，创建一个包含用于输入的输入字段的框架\n\
  \n```python\nframe = Frame( window )\nentry = Entry( frame )\n```\n\n![image](img/image00260.jpeg)然后，添加一个函数来显示当前输入的数据\n\
  \n```python\ndef dialog() :\n    box.showinfo( ‘Greetings’ , ‘Welcome ’ + entry.get()\
  \ )\n```\n\n![image](img/image00261.jpeg)现在，创建一个按钮，在点击时调用该函数\n\n```python\nbtn =\
  \ Button( frame, text = ‘Enter Name’ , command=dialog )\n```\n\n![image](img/image00262.jpeg)将按钮和输入框按指定的侧添加到框架\n\
  \n```python\nbtn.pack( side = RIGHT , padx = 5 )\nentry.pack( side = LEFT )\nframe.pack(\
  \ padx = 20 , pady = 20 )\n```\n\n![image](img/image00266.jpeg)最后，添加循环来捕获此窗口的事件\n\
  \n```python\nwindow.mainloop()\n```\n\n![image](img/image00362.jpeg)保存文件并运行程序，然后输入你的名字并点击按钮——查看问候消息出现\n\
  \n![image](img/image00363.jpeg)\n![image](img/image00364.jpeg)\n![image](img/image00194.jpeg)\n\
  \n如果你想显示用户无法编辑的文本，请使用 `Label` 小部件而不是 `Entry` 小部件。\n\n### 选项列表\n\n`Listbox` 小部件提供了应用程序中的项目列表，用户从中进行选择。listbox\
  \ 对象通过指定其父容器名称（例如窗口或框架名称）并将选项作为 `Listbox()` 构造函数的参数来创建。下面列出了常用选项及其简要描述：\n\n| 选项:\
  \ |  |\n| :--- | :--- |\n| `bd` | 以像素为单位的边框宽度（默认为 2） |\n| `bg` | 背景颜色 |\n| `fg`\
  \ | 用于渲染文本的前景颜色 |\n| `font` | 文本字体 |\n| `height` | 列表行数（默认为 10） |\n| `selectbackground`\
  \ | 选中文本的背景颜色 |\n| `selectmode` | SINGLE（默认）或 MULTIPLE 多次选择 |\n| `width` | 以字母为单位的\
  \ Listbox 宽度（默认为 20） |\n| `yscrollcommand` | 绑定垂直滚动条 |\n\n![image](img/image00193.jpeg)\n\
  \n在 tkinter 中，滚动条是一个独立的小部件，可以绑定到 `Listbox`、`Text`、`Canvas` 和 `Entry` 小部件。通过指定列表索引数字和项目字符串作为其\
  \ `insert()` 方法的参数，可以将项目添加到 listbox。\n\n你可以通过在 `get()` 方法的括号内指定索引号来从 listbox 获取任何项目。有用的是，listbox\
  \ 还有一个 `curselection()` 方法，它可以返回当前选中项目的索引号，因此可以将其作为其 `get()` 方法的参数来获取当前选择。\n\n![image](img/image00188.jpeg)\n\
  \nlistbox.py\n\n![image](img/image00257.jpeg)让 GUI 功能和消息框功能作为短别名可用来启动新程序\n\n```python\n\
  from tkinter import *\nimport tkinter.messagebox as box\n```\n\n![image](img/image00258.jpeg)接下来，创建一个窗口对象并指定标题\n\
  \n```python\nwindow = Tk()\nwindow.title( ‘Listbox Example’ )\n```\n\n![image](img/image00259.jpeg)现在，创建一个包含小部件的框架\n\
  \n```python\nframe = Frame( window )\n```\n\n![image](img/image00260.jpeg)创建一个 listbox\
  \ 小部件\n\n```python\nlistbox = Listbox( frame )\nlistbox.insert( 1 , ‘Option1’ )\n\
  listbox.insert( 2 , ‘Option2’ )\nlistbox.insert( 3 , ‘Option3’ )\n```\n\n![image](img/image00261.jpeg)接下来，添加一个函数来显示\
  \ listbox 选择\n\n```python\ndef dialog() :\n    box.showinfo( ‘Selection’ , listbox.get(listbox.curselection())\
  \ )\n```\n\n![image](img/image00262.jpeg)现在，创建一个按钮，在点击时调用该函数\n\n```python\nbtn =\
  \ Button( frame, text = ‘Choose’ , command=dialog )\n```\n\n![image](img/image00266.jpeg)然后，将按钮和\
  \ listbox 按指定的侧添加到框架\n\n```python\nbtn.pack( side = RIGHT , padx = 5 )\nlistbox.pack(\
  \ side = LEFT )\nframe.pack( padx = 20 , pady = 20 )\n```\n\n![image](img/image00362.jpeg)最后，添加循环来捕获此窗口的事件\n\
  \n```python\nwindow.mainloop()\n```\n\n### 单选框 (Polling radios)\n\n`Radiobutton`\
  \ 小部件提供了应用程序中的单项，用户可以从中选择。当多个单选框组合在一起时，用户只能选择一组中的一项。在 tkinter 中，单选框通过指定相同的控制变量组合在一起。为了此，可以使用\
  \ `StringVar()` 构造创建一个空的字符串变量对象，或使用 `IntVar()` 构造创建一个空的整数变量对象。\n\n![image](img/image00215.jpeg)\n\
  \n不能使用普通变量来存储来自单选框的值——它必须是一个对象。通过向 `Radiobutton()` 构造函数指定四个参数创建一个单选框对象：\n\n- 父容器名称，例如框架\n\
  - 用于显示的文本，指定为 `text=` 参数\n- 控制变量对象，指定为 `variable=` 参数\n- 要赋值的值，指定为 `value=` 参数\n\
  \n每个单选框对象都有 `select()` 方法，可用于程序启动时指定单选框组中的默认选择。选择单选框后分配的字符串值可以通过字符串变量对象的 `get()`\
  \ 方法获取。\n\n![image](img/image00188.jpeg)\n\nradio.py\n\n![image](img/image00257.jpeg)让\
  \ GUI 功能和消息框功能作为短别名可用来启动新程序\n\n```python\nfrom tkinter import *\nimport tkinter.messagebox\
  \ as box\n```\n\n![image](img/image00258.jpeg)接下来，创建一个窗口对象并指定标题\n\n```python\nwindow\
  \ = Tk()\nwindow.title( ‘Radio Button Example’ )\n```\n\n![image](img/image00259.jpeg)现在，创建一个包含小部件的框架\n\
  \n```python\nframe = Frame( window )\n```\n\n![image](img/image00260.jpeg)然后，构造一个字符串变量对象来存储选择\n\
  \n```python\nbook = StringVar()\nrb1 = Radiobutton(frame, text='Option 1', variable=book,\
