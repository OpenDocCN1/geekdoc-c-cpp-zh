  \n### 控制输出\n\n正如对面页面示例所示，存储在变量中的值可以重复使用，直到它被新值替换或程序结束。\n\n\n\n\n\n关于此示例的输出，还有两点需要注意。首先，`print()`\
  \ 函数会在输出后自动添加一个不可见的 `\\n` 换行符——因此，下一个 `print()` 函数的输出默认出现在下方的下一行。其次，当指定逗号分隔的列表进行输出时，`print()`\
  \ 函数会在每个项目之间自动添加空格。\n\n你可以通过指定行尾为空格而不是默认的 `\\n` 来覆盖自动换行的行为。你也可以通过使用 `+` 符号对项目进行“连接”而不是使用逗号，从而避免自动添加的间距行为。\n\
  \n![image](img/image00188.jpeg)\n\n`concat.py`\n\n![image](img/image00225.jpeg)打开\
  \ IDLE 编辑窗口，然后输入以下代码以请求用户输入，并初始化一个变量\n\n```python\nname = input( ‘Please enter your\
  \ name: ‘ )\n```\n\n![image](img/image00226.jpeg)接下来，添加一条语句输出一个字符串和变量中存储的值——但末尾不加换行符\n\
  \n```python\nprint( ‘Hello ’ + name , end = ‘ ‘ )\n```\n\n![image](img/image00227.jpeg)现在，添加语句输出一个字符串，然后是一个与变量存储的值连接的字符串\n\
  \n```python\nprint( ‘Welcome to Coding for Beginners’ )\nprint( ‘Remember to have\
  \ fun ’ + name + ‘!’ )\n```\n\n![image](img/image00228.jpeg)保存并运行程序，在提示时输入你的名字，按回车键查看控制输出\n\
  \n![image](img/image00230.jpeg)\n\n![image](img/image00194.jpeg)\n\n注意字符串已经经过编辑，以良好的格式格式输出。\n\
  \n## 识别类型\n\n在编写计算机程序时，你可以表示四种可以存储在变量中的基本数据类型。虽然 Python 语言中的变量可以存储任何类型的数据，但理解不同的类型是非常重要的，因为你有时可能需要在代码中将一种类型转换为另一种类型：\n\
  \n| 数据类型: | 描述: | 示例: |\n| :--- | :--- | :--- |\n| `str` | 字符字符串，可以包括字母、数字、空格和符号\
  \ | ‘Daytona 500’ |\n| `int` | 整数全数，**没有**小数部分 | `1000` |\n| `float` | 浮点数，**有**小数部分\
  \ | `98.6` |\n| `bool` | 布尔逻辑真值，非 True 即为 False | `True` |\n\n![image](img/image00215.jpeg)\n\
  \n整数 `int` 数字不应包含任何标点符号——所以代码中一千应编写为 `1000` 而不是 `1,000`。\n\n字符串简单来说你可以从计算机键盘输入的任何字符集合，它们在引号内组合在一起。如果赋值给变量的值包含在引号内，变量就会识别出该值属于\
  \ `str` “类”。\n\n![image](img/image00193.jpeg)\n\n字符串 `str` 值必须始终用引号括起来。\n\n数字是你可以从键盘输入的任何数值，但它们通过是否包含或省略小数点来定义。如果赋值给变量的数值没有小数点，则变量将将其识别为属于\
  \ `int` “类”；如果确实有小数点，则识别为属于 `float` 类。\n\n布尔值是一个逻辑真值。变量通过关键字 `True` 和 `False` 或者如果该值求值为\
  \ `True` 或 `False`，将赋值的值识别为属于 `bool` “类”。\n\n在 Python 编程中，通过在内置 `type()` 函数的括号内指定变量名，你可以轻松地发现存储在变量中的数据类型。\n\
  \n![image](img/image00188.jpeg)\n\n`types.py`\n\n![image](img/image00225.jpeg)打开\
  \ IDLE 编辑窗口，通过赋值字符串来初始化变量，然后显示它的值和数据类型\n\n```python\nrace = ‘Daytona 500’\nprint(\
  \ race , ‘is‘ + type( race ) )\n```\n\n![image](img/image00226.jpeg)接下来，通过赋值一个整数来初始化变量，然后显示它的值和数据类型\n\
  \n```python\nkilo = 1000\nprint( kilo , ‘is‘ + type( kilo ) )\n```\n\n![image](img/image00227.jpeg)现在，通过赋值一个小数来初始化变量，然后显示它的值和数据类型\n\
  \n```python\ntemp = 98.6\nprint( temp , ‘is‘ + type( temp ) )\n```\n\n![image](img/image00228.jpeg)通过赋值一个真值关键字初始化变量，然后显示它的值和数据类型\n\
  \n```python\nflag = True\nprint( flag , ‘is‘ + type( flag ) )\n```\n\n![image](img/image00231.jpeg)最后，将最后一个变量值替换为比较的真结果，然后再次显示它的值和数据类型\n\
  \n```python\nflag = 4 > 8\nprint( flag , ‘is‘ + type( flag ) )\n```\n\n![image](img/image00232.jpeg)保存并运行程序，以发现你创建的变量中存储的数据类型\n\
  \n![image](img/image00233.jpeg)\n\n![image](img/image00194.jpeg)\n\n这里的比较检查 4 是否大于\
  \ 8，显然为假的\n\n## 转换数据\n\n你通常需要转换数据以执行某些操作——例如算术运算或连接。算术运算可以在数值类型（如 `int` 和 `float`）上进行，而连接只能在字符串类型（如\
  \ `str`）上进行。\n\nPython 提供了几个内置函数允许你将数据转换为不同的类型。这些函数并不转换本身，而是返回一个转换后的表示。在编程术语中这被称为“强制转换”（cast）操作：\n\
  \n| 函数: | 描述: |\n| :--- | :--- |\n| `int(x)` | 将 `x` 转换为整数 |\n| `float(x)` | 将 `x`\
  \ 转换为浮点数 |\n| `str(x)` | 将 `x` 转换为字符串 |\n\n![image](img/image0193.jpeg)代码中的数值不应放在引号内——引号内的数字将被视为字符串值！\n\
  \n手动赋值给变量的数值会自动赋予相应的 `int` 或 `float` 类型。然而，通过内置 `input()` 函数赋值给变量的值始终是 `str` 数据类型——即使它们是数值！这意味着在进行算术运算之前，必须将它们转换（cast）为相应的数值类型。\n\
  \n相反，手动赋值给变量的数值（自动赋予 `int` 或 `float` 类型）无法连接到字符串中。这意味着必须将它们转换为 `str` 数据类型以便包含在字符串中。\n\
  \n在 Python 中，与其他许多编程语言一样，`+` 符号根据其上下文有多个用途。当 `+` 符号用于两个数值之间时，它执行加法（被称为“加法运算符”）；当\
  \ `+` 符号用于两个字符串值之间时，它执行连接（被称为“连接运算符”）。赋值任何类型操作结果的变量将自动获得结果的数据类型。\n\n![image](img/image0194.jpeg)\n\
  \n对 `int` 和 `float` 数据类型共同进行的算术运算将自动转换为 `float` 结果。将值转换为 `float` 数据类型以允许小数输入。\n\n\
  ![image](img/image00188.jpeg)\n\n`cast.py`\n\n![image](img/image00225.jpeg)打开 IDLE\
  \ 编辑窗口，通过赋值数值型用户输入来初始化两个变量\n\n```python\nnum1= input( ‘Please enter a whole number:\
  \ ‘ )\nnum2= input( ‘Now enter another whole number: ‘ )\n```\n\n![image](img/image00226.jpeg)接下来，显示每个变量的数据类型，以查看这些数值实际上存储为字符串\n\
  \n```python\nprint( ‘Input is: ‘ , type( num1 ) , type( num2 ) )\n```\n\n\n\n\n\n\
  ![image](img/image00227.jpeg)现在，使用 `+` 运算符尝试相加，但你会发现结果被拼接为了 `str` 数据类型\n\n```python\n\
  total = num1 + num2\nprint( ‘Total:‘ , total , type( total ) )\n```\n\n![image](img/image00228.jpeg)再次使用\
  \ `+` 运算符尝试相加，但将存储的值强制转换，以查看结果作为 `int` 数据类型\n\n```python\ntotal = int( num1 ) +\
  \ int( num2 )\nprint( ‘Total:‘ , total , type( total ) )\n```\n\n![image](img/image00231.jpeg)最后，将存储的值强制转换为\
  \ `float` 数据类型，并将浮点结果值拼接到输出的 `str` 字符串中\n\n```python\ntotal = float( num1 ) + float(\
  \ num2 )\nprint( ‘Total: ‘ + str( total ) , type( total ) )\n```\n\n![image](img/image00232.jpeg)保存并运行程序，通过内置函数强制转换查看存储的数据类型转换情况\n\
  \n![image](img/image00234.jpeg)\n\n![image](img/image00215.jpeg)\n\n如果你忘记转换为正确的数据类型，解释器将报告错误——尝试将一个\
  \ `int` 加到 `str` 数据类型以查看错误信息。\n\n# 猜数字游戏\n\n之前的简单示例已经说明了如何在程序中使用变量来存储文本字符串值、数值型整数和浮点小数值以及布尔真值。现在，它们可以被用来创建一个猜数字游戏程序，方法是：存储一个随机生成的整数（用户必须猜测其值）、一个在用户猜对时结束游戏的布尔真值，以及一个包含用户猜想结果的字符串。\n\
  \n此示例中的代码包含了一些在本书稍后才会介绍的功能，但由于 Python 是一门易于人类阅读的编程语言，你应该能够从原理上理解此程序是如何工作的。\n\n![image](img/image00188.jpeg)\n\
  \nguess.py\n\n![image](img/image00225.jpeg)打开 IDLE 编辑窗口，并通过导入“random”库类开始编写程序，该类提供了随机数生成器函数\n\
  \n```python\nimport random\n```\n\n![image](img/image00226.jpeg)现在，初始化三个变量：一个 1\
  \ 到 20 之间的随机数、一个在游戏进行期间保持为 True 的布尔值，以及一个稍后存储用户输入的零值\n\n```python\nnum = random.randint(\
  \ 1 , 20 )\nflag = True\nguess = 0\n```\n\n![image](img/image00227.jpeg)接下来，显示一条消息让用户进行猜测\n\
  \n```python\nprint( ‘Guess my number 1-20 : , end = ‘ ‘ )\n```\n\n![image](img/image00228.jpeg)然后，精确复制这段代码，它将存储的用户猜想与存储的随机数进行比较\n\
  \n```python\nwhile flag == True :\n    guess = input( )\n    if not guess.isdigit()\
  \ :\n        print( ‘Invalid! Enter only digits 1-20‘ )\n        break\n    elif\
  \ int( guess ) < num :\n        print( ‘Too low, try again : ‘ , end = ‘ ‘ )\n \
  \   elif int( guess ) > num :\n        print( ‘Too high, try again : ‘ , end = ‘\
  \ ‘ )\n    else :\n        print( ‘Correct... My number is ‘ + guess )\n       \
  \ flag = False\n```\n\n![image](img/image00215.jpeg)许多编程语言使用如 `{ }` 等字符将语句组合在一起，但\
  \ Python 使用缩进——因此此处显示的缩进必须正确保留。\n\n![image](img/image00231.jpeg)保存并运行程序，输入猜测的值以查看你的输入与存储的随机数的比较结果\n\
  \n![image](img/image00235.jpeg)\n\n![image](img/image00194.jpeg)注意程序拒绝了 `str` 字符串或\
  \ `float` 值的用户输入。\n\n## Python 中的猜数字游戏 – 程序分析\n\n- `random` 库类的 `randint()` 函数在括号内指定了随机范围的上限和下限\n\
  - `flag` 变量指定了程序的初始条件，允许程序开始检查用户的输入\n- `while` 关键字指定了一个“循环”控制结构，它将重复其包含的语句，直到测试条件失败\n\
  - `if not guess.isdigit()` 测试指定了一个动作，如果用户输入不是整数，则跳循环\n- `elif int( guess ) < num`\
  \ 测试指定了当转换的用户输入小于存储的随机数时执行的备选动作\n- `elif int( guess ) > num` 测试指定了当转换的用户输入大于存储的随机数时执行的备选动作\n\
  - `else` 关键字指定了一个最后的备选动作来改变程序条件，从而结束程序\n\n![image](img/image00193.jpeg)你尚不需要详细理解这个程序——每个方面将在本书稍后的示例中解释。\n\
  \n## 纠正错误\n\n在编写程序时可能会发生三种常见的错误。在 Python 编程中识别这些不同的错误类型非常有用，这样可以更容易地进行：\n\n- **语法错误（Syntax\
  \ Error）** – 当解释器遇到不符合 Python 语言规则的代码时发生。例如，字符串周围缺少引号。解释器会停止并报告错误，而不执行程序。\n- **运行时错误（Runtime\
  \ Error）** – 发生在程序执行期间，即程序运行时。例如，当变量名后续拼写错误导致无法识别。\n- **语义错误（Semantic Error）** –\
  \ 当程序运行结果不符合预期时发生。例如，未指定优先级时。解释器会运行但不会报告错误。\n\n编程错误通常被称为“虫（bugs）”，追踪它们的过程通常被称为“调试（debugging）”。纠正语法和运行时错误非常简单，因为解释器会报告错误发生的位置，但语义错误需要检查代码。\n\
  \n![image](img/image00188.jpeg)\n\nsyntax.py\n\n![image](img/image00225.jpeg)打开\
  \ IDLE 编辑窗口，然后添加一条语句输出缺少引号的字符串\n\n```python\nprint( ‘Coding for Beginners in easy\
  \ steps )\n```\n\n![image](img/image00226.jpeg)保存并运行程序，查看解释器如何突出语法错误并指示其性质\n\n![image](img/image00237.jpeg)\n\
  \n![image](img/image00215.jpeg)红色的语法错误指示指向发生行尾（EOL）错误的行。\n\n![image](img/image00227.jpeg)在右括号前插入一个引号以结束字符串，保存并再次运行程序——查看错误已纠正\n\
  \n![image](img/image00188.jpeg)\n\nruntime.py\n\n![image](img/image00228.jpeg)接下来，通过初始化一个变量开始新程序，然后尝试用错误的变量名输出其值——查看解释器报告错误\n\
  \n```python\ntitle = ‘Coding for Beginners in easy steps’\nprint( titel )\n```\n\
  \n![image](img/image00238.jpeg)修改变量名以匹配变量声明，保存并再次运行程序——查看错误已纠正\n\n![image](img/image00188.jpeg)\n\
  \nsemantic.py\n\n![image](img/image00232.jpeg)现在，通过初始化一个变量开始新程序，然后在在没有显式优先级的情况下使用其值输出表达式——查看可能的意外结果\
  \ 28\n\n```python\nnum = 3\nprint( ‘Result: ‘ , num * 8 + 4 )\n```\n\n![image](img/image00239.jpeg)\n\
  \n![image](img/image00240.jpeg)添加括号将表达式分组为 `3 * ( 8 + 4 )`，然后保存文件并再次运行程序——查看预期的结果\
  \ 36，纠正语义错误\n\n有关如何在脚本代码中处理运行时异常（Exception）错误的详情请参阅此处。\n\n**总结**\n\n- 变量可以存储程序代码中指定的数据值，也可以存储用户输入的值\n\
  - 存储在变量中的值在被新值替换或程序结束之前一直保持可重复使用\n\n\n\n\n\n- Python 内置 `input()` 函数可以将输入赋值给变量，并可选地指定一个要显示的字符串。\n\
  - Python 内置 `print()` 函数可以在其括号中以逗号分隔列表的形式指定输出的多个值。\n- 默认情况下，`print()` 函数会在输出后自动添加一个\
  \ `\\n` 换行符，除非指定了结束备选参数（end）。\n- `+` 拼接运算符可以将两个字符串连接在一起。\n- 数据类型本质上是 `str` 字符串、`int`\
  \ 整数、`float` 小数、或 `bool` 布尔真值。\n- 布尔值是逻辑真值，在 Python 中通过 `True` 和 `False` 关键字表示。\n\
  - Python 内置 `type()` 函数可以识别任何指定变量中的值属于哪种类的数据类型。\n- Python 内置 `input()` 函数赋值给变量的值始终被赋予\
  \ `str` 字符串数据类型。\n- 可以 Python 内置的 `int()`、`float()` 和 `str()` 转换函数对数据类型进行转换以便操作。\n\
  - 对 `int` 整数和 `float` 小数进行算术运算将产生 `float` 数据类型的结果。\n- 因代码错误导致的语法错误会在程序执行之前被解释器识别。\n\
  - 因异常导致的运行时错误会在程序执行期间被解释器识别。\n- 因非预期性能导致的语义错误不会被解释器识别。\n\n# 执行操作\n\n本章演示了如何在你的代码语句中使用运算符符号。\n\
  \n- 进行算术运算\n- 赋值\n- 比较值\n- 寻找真值\n- 测试条件\n- 设置顺序\n- 总结\n\n## 进行算术运算\n\n在计算机程序编程中常用的算术“运算符”通常使用\
  \ `+` 符号进行加法，使用 `-` 符号进行减法，正如你所期的那样。通常，它们还使用 `*` 星号进行乘法，而不是 `x` 符号，并使用 `/` 正斜线进行除法，而不是\
  \ `÷` 符号。\n\n用于编写 Python 程序的算术运算符列如下，连同它们执行的操作：\n\n| 运算符: | 操作: |\n| :--- | :---\
