  \ ASCII 值为 65，但小写字母“a”是 97 – 所以它们在这里的比较返回 `False`。\n\n## 寻找真值\n\nPython 编程中最常用的逻辑运算符列如下表所示：\n\
  \n| **运算符:** | **操作:** |\n| :--- | :--- |\n| `and` | 逻辑与 |\n| `or` | 逻辑或 |\n| `not`\
  \ | 逻辑非 |\n\n逻辑运算符用于具有布尔值 `True` 或 `False` 的操作数，或者可以转换为 `True` 或 `False` 的值。\n\n\
  （逻辑与）`and` 运算符将评估两个操作数，只有当两个操作数本身都是 `True` 时，才返回 `True`。否则 `and` 运算符将返回 `False`。这在编程中执行“条件分支”非常有用，其中程序的方向通过测试两个条件来决定\
  \ – 如果两个条件都满足，程序将进入某个方向，否则它将进入另一个方向。\n\n与需要两个操作数均为 `True` 的 `and` 运算符不同，逻辑或）`or`\
  \ 运算符将评估它的两个操作数，如果其中任何一个操作数本身返回 `True`，则返回 `True`。如果两个操作数都不返回 `True`，那么 `or` 运算符将返回\
  \ `False`。\n\n（逻辑非）`not` 运算符是一个一元运算符，用于反转操作数的值。如果给定的操作数为 `True`，则返回 `False`；反之亦然。这在编程中非常有用，用于在其中一个条件满足时执行特定的操作。\n\
  \n![image](img/image00194.jpeg)“布尔”一语指的是英国数学家布尔（1815-1864）开发的系统。\n\n![image](img/image00188.jpeg)\n\
