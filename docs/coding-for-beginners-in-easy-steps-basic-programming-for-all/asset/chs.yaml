  \n```\ndef square( num ) :\n```\n\n![image](img/image00289.jpeg)现在，在函数块中插入一个缩进的语句，以验证传递的参数值是否为整数，或停止函数语句的进一步执行\n\
  \n```\nif not num.isdigit() :\n    return ‘Invalid Entry’\n```\n\n![image](img/image00290.jpeg)然后，添加缩进语句将传递的参数值强制转换为\
