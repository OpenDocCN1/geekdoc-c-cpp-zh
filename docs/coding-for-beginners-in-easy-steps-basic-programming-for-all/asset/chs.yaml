  \ ‘OR :’ )\n\n( ‘a or b =’ , a or b )\n\n(\n\n or b\n’ , b or b )\n```\n\n![image](img/image00245.jpeg)添加语句显示逻辑非评估的结果\n\
  \n```python\nprint( ‘NOT :’ )\nprint( ‘a =’ , a , ‘\\tnot a =’ , not a )\nprint(\
  \ ‘b =’ , b , ‘\\tnot b =’ , not b )\n```\n\n![image](img/image00246.jpeg)保存并运行此程序\
  \ – 查看逻辑操作的结果\n\n![image](img/image00251.jpeg)\n\nimage/00194.jpeg)在 Python 编程中，布尔值也可以用数值表示，其中\
  \ `True` 为 `1`，`False` 为 `0`（零）。\n\n![image](img/image00193.jpeg)注意表达式 `False and\
  \ False` 返回 `False` 而不是 `True` – 这可能证明了“错错不为直”的格言。\n\n## 测试条件\n\n许多编程语言（如 C++ 或\
  \ Java）都有 `?:` 三元运算符，它可以评估一个 True 或 False 条件，然后根据评估结果返回两个值之一。`?:` 三元运算符的语法如下：\n\n\
  **( *test-expression* ) ? *if-true-return-this* : *if-false-return-this***\n\n与其他编程语言不同，Python\
  \ 没有 `?:` 三元运算符，而是使用“条件表达式”，它使用 `if` 和 `else` 关键字以类似的方式工作，语法如下：\n\n***if-true-return-this*\
  \ if ( *test-expression* ) else *if-false-return-this***\n\n虽然条件表达式的语法最初看起来很困惑，但熟悉它是非常有价值的，因为可以用最少的代码执行强大的程序分支。例如，当变量的值不为\
  \ 1 时进行分支：\n\n***if-true-do-this* if ( var != 1 ) else *if-false-do-this***\n\n\
  条件表达式可以在 Python 编程中将两个变量的最大值或最小值赋值给第三个变量。例如，如所示赋值最小值：\n\n**c = a if ( a < b ) else\
  \ b`\n\n\n\n\n当变量 `a` 的值小于变量 `b` 的值时，括号中的表达式返回 `True` —— 在这种情况，变量 `a` 的较小值被赋值给变量\
  \ `c`。\n\n同样，将测试表达式中的 `<` 小于运算符替换为 `>` 大于运算符，会将变量 `b` 的较大值赋值给变量 `c`。\n\n条件表达式的另一个常见用法是在测试表达式中引入\
  \ `%` 取余运算符，以判断变量的值是奇数还是偶数：\n\n`if-true(odd)-do-this if ( var % 2 != 0 ) else if-false(even)-do-this`\n\
  \n如果变量值除以二的 result 有余数，则该数字为奇数；如果没有余数，则该数字为偶数。测试表达式 `( var % 2 == 1 )` 具有相同的效果，但最好测试不相等性——发现不同之处比发现相同之处更容易。\n\
  \n![image](img/image00194.jpeg)\n\n从通用的编程术语来说，“表达式”（expression）总是返回一个值，而“语句”（statement）则一定——但语句可以包含一个或多个表达式。\n\
  \n![image](img/image00193.jpeg)\n\n条件表达式实际上有三个操作数 —— 测试表达式和两个可能的返回值。\n\n![image](img/image00188.jpeg)\n\
  \n`condition.py`\n\n![image](img/image00241.jpeg)通过初始化两个带有整数值的变量来启动一个新程序，用于条件评估\n\
  \n`a = 1`\n\n`b = 2`\n\n![image](img/image00242.jpeg)接下来，添加语句来显示条件评估的结果 —— 描述第一个变量的值\n\
  \n`print( \\nVariable a Is :’ , ‘One’ if ( a == 1 ) else ‘Not One’ )`\n\n`print(\
  \ ‘Variable a Is :’ , ‘Even’ if ( a % 2 == 0 ) else ‘Odd’ )`\n\n![image](img/image00243.jpeg)现在，添加语句来显示条件评估的结果\
  \ —— 描述第二个变量的值\n\n`print( \\nVariable b Is :’ , ‘One’ if ( b == 1 ) else ‘Not One’\
  \ )`\n\n`print( ‘Variable a Is :’ , ‘Even’ if ( a % 2 == 0 ) else ‘Odd’ )`\n\n![image](img/image00244.jpeg)然后，添加一条语句将条件评估的结果赋值给新变量\n\
  \n`top = a if ( a > b ) else b`\n\n![image](img/image00245.jpeg)最后，添加一条语句来显示赋值的结果\
  \ —— 识别两个变量值中较大的一个\n\n`print( \\nGreater Value Is:’ , top )`\n\n![image](img/image00246.jpeg)保存并运行此程序\
  \ —— 以看到条件表达式操作的结果\n\n![image](img/image00253.jpeg)\n\n![image](img/image00215.jpeg)\n\
  \n你可能会发现某些 Python 程序员不喜欢条件表达式，因为他们认为它的语法违背了易读性原则。\n\n### 设置顺序\n\n运算符优先级决定了表达式进行求值的顺序。例如，在表达式\
  \ `3 * 8 + 4` 中，默认优先级决定先完成使用 `*` 运算符的乘法，因此结果为 28 (24 + 4)。\n\n下表列出了 Python 运算符优先级的降序排列\
  \ —— 顶行的优先级最高，较低行的优先级依次递减。同一行内运算符的优先级从左到右链式。\n\n| Operator: | Description: |\n|\
  \ :--- | :--- |\n| `**` | 幂 |\n| `+` | 正数 |\n| `-` | 负数 |\n| `~` | 按位非 |\n| `*`\
  \ | 乘法 |\n| `/` | 除法 |\n| `//` | 整除 |\n| `%` | 取余 |\n| `+` | 加法 |\n| `-` | 减法 |\n\
  | `\\|` | 按位或 |\n| `^` | 按位异异 |\n| `&` | 按位与 |\n| `>>` | 按位右移 |\n| `<<` | 按位左移 |\n\
  | `>, >=, <, <=, ==, !=` | 比较 |\n| `= , %= , /, //= , -= , += , *= , **=` | 赋值 |\n\
  | `is , is not` | 标识 |\n| `in , not in` | 成员 |\n| `not` | 逻辑非 |\n| `and` | 逻辑与 |\n\
  | `or` | 逻辑或 |\n\n![image](img/image00193.jpeg)\n\n`*` 乘法运算符位于 `+` 加法运算符更高的行 ——\
  \ 所以在表达式 `3 * 8 + 4` 中，乘法在加法之前完成。\n\n![image](img/image00194.jpeg)\n\n按位运算符用于低级操作，因此在书中省略了。标识和成员运算符稍后介绍，但为了完整性起见包含在此处。\n\
  \n![image](img/image00188.jpeg)\n\n`order.py`\n\n![image](img/image00241.jpeg)通过初始化三个带有整数值的变量来启动一个新程序，用于优先级比较\n\
  \n`a = 2`\n\n`b = 4`\n\n`c = 8`\n\n![image](img/image00242.jpeg)接下来，添加语句来显示条件评估的结果\
  \ —— 描述第一个变量的值\n\n`print( \\nVariable a Is :’ , ‘One’ if ( a == 1 ) else ‘Not One’\
  \ )`\n\n`print( ‘Variable a Is :’ , ‘Even’ if ( a % 2 == 0 ) else ‘Odd’ )`\n\n\n\
  \n\n\n## 总结\n\n## 列表\n\n某些编程语言允许声明变量时不赋初始值，但在 Python 编程中，变量必须在声明语句中分配一个初始值（初始化）——否则解释器将报告“未定义”（not\
  \ defined）错误。\n\n可以使用一系列 `=` 赋值在单个语句中为多个变量初始化相同的公共值。例如，同时为三个变量分配一个公共值：\n\n`a = b\
  \ = c = 10`\n\n![image](img/image00255.jpeg)\n\n或者，也可以使用逗号作为分隔符在单个语句中为多个变量初始化不同的值。例如，同时为三个变量分配不同的值：\n\
  \n`a , b , c = 1 , 2 , 3`\n\n普通变量只能存储单项数据，不同，数组变量可以存储多个数据项。在 Python 中，这些被称为“列表”（list）变量。数据按顺序存储在列表“元素”中，索引从零开始计数。因此，第一个值存储在元素\
  \ 0 中，第二个值存储在元素 1 中，依此类推。数组列表的创建方式与其他任何变量类似，但它是通过在方括号内分配逗号分隔的列表值来初始化的。例如，创建一个名为“nums”的列表：\n\
  \n`nums = [ 0 , 1 , 2 , 3 , 4 , 5 ]`\n\n可以使用列表名后跟包含该元素索引的方括号来引用单个列表元素。这意味着 `nums[1]`\
  \ 引用的是示例中的第二个元素——而不是第一个元素。由于元素编号从零开始，其第一个元素通过 `nums[0]` 引用。\n\n![image](img/image00256.jpeg)\n\
  \n列表可以有多个索引——表示多个维度，而不是普通列表的单维度。具有三个及更多索引的多维列表并不常见，但二维列表对于存储基于网格的信息（如 X,Y 坐标）非常有用。\n\
  \n字符串字符串值列表甚至可以被视为多维列表，因为每个字符串本身都是字符列表。因此，每个字符都可以通过其在特定字符串内的索引号来引用。\n\n![image](img/image00188.jpeg)\n\
  \n`list.py`\n\n![image](img/image00257.jpeg)通过初始化一个包含三个字符串值元素的列表来启动一个新程序\n\n`quarter\
  \ = [ ‘January’ , ‘February’ , ‘March’ ]`\n\n![image](img/image00258.jpeg)接下来，添加语句单独显示每个列表元素中包含的值\n\
  \n```\nprint( ‘First Month :’ , quarter[0] )\nprint( ‘Second Month :’ , quarter[1]\
  \ )\nprint( ‘Third Month :’ , quarter[2] )\n```\n\n![image](img/image00259.jpeg)添加一条语句创建一个两个元素的二维维列表，这些元素本身也是列表，每个列表都包含三个整数值的元素\n\
  \n`coords = [ [ 1 , 2 , 3 ] , [ 4 , 5 , 6 ] ]`\n\n![image](img/image00260.jpeg)现在，添加语句显示两个特定内部列表元素中包含的值\n\
  \n```\nprint( ‘\\nTop Left 0,0 :’ , coords[0][0] )\nprint( ‘Bottom Right 1,2 :’\
  \ , coords[1][2] )\n```\n\n![image](img/image00261.jpeg)最后，添加一条语句只显示字符串值中的一个字符\n\
  \n```\nprint( ‘\\nSecond Month First Letter :’ , quarter[1][0] )\n```\n\n![image](img/image00262.jpeg)保存并运行程序——看到列表元素值被显示\n\
  \n![image](img/image00263.jpeg)\n\n![image](img/image00194.jpeg)\n\n字符串索引也可以是负数——以便从右侧开始计数，其中\
  \ -1 最后一个字母。\n\n![image](img/image00193.jpeg)\n\n在本章后面介绍的循环结构通常用于遍历列表元素。\n\n## 修改列表\n\
  \n列表变量可以包含多个数据项，在 Python 编程中被广泛使用，并有各种函数“方法”，这些方法可以通过“点后缀”的形式附加在列表名后来进行操作：\n\n|\
  \ 列表方法: | : |\n| :--- | :--- |\n| `list.append(x)` | 将项 `x` 添加到列表末尾 |\n| `list.extend(L)`\
  \ | 将列表 `L` 中的所有项添加到列表末尾 |\n| `list.insert(i,x)` | 在索引位置 `i` 处插入项 `x` |\n| `list.remove(x)`\
  \ | 从列表中删除第一个项 `x` |\n| `list.pop(i)` | 索引位置 `i` 处的项并返回它 |\n| `list.index(x)` |\
  \ 返回列表中第一个项 `x` 的索引位置 |\n| `list.count(x)` | 返回 `x` 在列表中出现的次数 |\n| `list.sort()`\
  \ | 原地排序所有列表项 |\n| `list.reverse()` | 原地反转所有列表项 |\n\n![image](img/image00194.jpeg)\n\
  \n对于既包含数值又包含字符串值的列表，`sort()` 方法返回的列表元素先按数值排序，然后按字母顺序排序——例如如 1,2,3,A,B,C。\n\nPython\
  \ 还有一个非常有用的 `len(L)` 函数，它返回列表的长度。\n\n`str(n)` 返回列表的字符串表示。像 `index()` 和 `count()`\
  \ 方法一样，返回的值是数值，因此不能直接连接到字符串。然而，列表的字符串表示可以通过 Python 的 `str(L)` 函数产生。在这两种情况下，原始版本保持不变，返回的只是副本。\n\
  \n单个列表元素可以通过 `del` 关键字指定列表名和索引号来删除。这可以删除指定索引位置的元素，或者使用切片语法 `i1:i2` 删除元素的“切片”，其中\
  \ `i1` 是要删除元素的第一个索引，但不包括 `i2` 索引处的元素。\n\n![image](img/image00261.jpeg)\n\nPython\
  \ 还有一个 `int(s)` 函数，返回字符串 `s` 的数值版本。\n\n![image](img/image00188.jpeg)\n\n`pop.py`\n\
  \n![image](img/image00257.jpeg)通过初始化两个包含三个字符串元素的列表来启动一个新程序\n\n`basket = [ ‘Apple’\
  \ , ‘Bun’ , ‘Cola’ ]`\n`crate = [ ‘Egg’ , ‘Fig’ , ‘Grape’ ]`\n\n![image](img/image00258.jpeg)接下来，添加语句显示第一个列表元素的内容及其长度\n\
  \n```\nprint( ‘Basket List:’ , basket )\nprint( ‘Basket Elements:’ , len( basket)\
  \ )\n```\n\n![image](img/image00259.jpeg)现在，添加语句添加一个元素并显示所有列表元素，然后删除最后一个元素再次显示所有列表元素\n\
  \n```\nbasket.append( ‘Damson’ )\nprint( ‘Appended:’ , basket )\nprint( ‘Last Item\
  \ Removed:’ , basket.pop() )\nprint( ‘Basket List:’ , basket )\n```\n\n![image](img/image00260.jpeg)最后，添加语句将第二个列表的所有元素添加到第一个列表中并显示所有的第一个列表元素，然后删除元素并再次显示第一个列表\n\
  \n```\nbasket.extend( crate )\nprint( ‘Extended:’ , basket )\ndel basket[1]\nprint(\
  \ ‘Item Removed:‘ , basket )\ndel basket[1:3]\nprint( ‘Slice Removed:’ , basket\
  \ )\n```\n\n\n\n\n普通列表中的值可以随着程序的进行而更改。可以使用 `=` 赋值运算符为每个元素分配替换值，并指定列表名称、元素索引号和替换值。在编程术语中，存储在普通列表中的值是“可变的”（mutable）——它们可以被更改。随着程序的进行，还可以动态地向普通列表中添加元素，或从普通列表中动态删除元素。这意味着，如果你的程序会对元素值进行更改，那么普通列表是理想的选择。\n\
  \n如果列表只包含常量（即这些值在程序运行时永远不会改变），那么创建一个固定列表（fixed list）会更好。在编程术语中，存储在固定列表中的值是“不可变的”（immutable）——它们无法被更改。随着程序的进行，无法动态地向固定列表添加或删除元素。这意味着，如果你的程序永远不会对元素值进行更改，那么固定列表是理想的。\n\
  \n![image](img/image00193.jpeg)\n\n### 元组 (Tuples)\n\n与列表的索引编号一样，元组序列中的项也从零开始编号。\n\
  \n限制性的不可变 Python 列表被称为“元组”，它通过在括号之间将逗号分隔的列表作为赋值值来创建，这一过程被称为“元组打包”（tuple packing）：\n\
  \n```\ncolors_tuple = ( ‘Red’ , ‘Green’ , ‘Red’ , ‘Blue’, ‘Red’ )\n```\n\n可以使用元组名称后跟包含该元素索引号的方括号来引用单个元组元素。很有用的是，元组内部存储的所有值都可以赋值给单个变量，这一过程被称为“序列解包”（sequence\
  \ unpacking）：\n\n```\na , b , c , d , e = colors_tuple\n```\n\n普通列表方法（如 `sort()`\
  \ 和 `reverse()`）不能用于元组，但可以使用 Python 内置的 `type()` 函数来显示数据类类型，并可以使用内置的 `len()` 函数来返回元组的长度。\n\
  \n![image](img/image00215.jpeg)\n\n解包元组时，变量的数量必须与项的数量相同。\n\n通常，元组用于存储一组常量且不变的值的集合，例如星期名称、月份名称，或个人详情（如名、姓、出生日期、地址、电话号码等）。\n\
  \n![image](img/image00188.jpeg)\n\ntuple.py\n\n![image](img/image00257.jpeg)通过初始化元组启动新程序，然后显示其类类型\n\
  \n```\ndays = ( ‘Mon’ , ‘Tue’ , ‘Wed’ , ‘Thu’ , ‘Fri’ , ‘Sat’ , ‘Sun’ )\nprint(\
  \ ‘days:’ , type( days ) )\n```\n\n![image](img/image00258.jpeg)接下来，显示元组的所有内容、其长度以及存储在第一个元素中的值\n\
  \n```\nprint( ‘Days of the week:’ , days )\nprint( ‘No. of days in week:’ , len(\
  \ days ) )\nprint( ‘Start day of week:’ , days[0] )\n```\n\n![image](img/image00259.jpeg)现在，初始化另一个包含用户个人详情的元组\n\
  \n```\nuser = ( ‘John’ , ‘Doe’ , ‘Paris’ , ‘555-1234’ )\n```\n\n![image](img/image00260.jpeg)然后，显示用户的全名\n\
  \n```\nprint( ‘Name:’ , user[0] , user[1] )\n```\n\n![image](img/image00261.jpeg)最后，显示用户的电话号码\n\
  \n```\nprint( ‘Phone:’ , user[3] )\n```\n\n![image](img/image00262.jpeg)保存并运行此程序——查看元组的值\n\
  \n![image](img/image00265.jpeg)\n\n![image](img/image00194.jpeg)\n\n元组可能包含与其其他元素不重复的项。\n\
  \n### 集合 (Sets)\n\n普通列表或固定列表元组中的值可以在其元素中重复，但可以创建一个不允许重复的唯一值列表。限制性的唯一值 Python 列表被称为“集合”（set），它是通过像这样在大括号（花括号）之间将逗号分隔的列表作为赋值值来创建的：\n\
  \n```\nphonetic_set = { ‘Alpha’ , ‘Bravo’ , ‘Charlie’ }\n```\n\n![image](img/image00194.jpeg)\n\
  \n集合中可能包含与其其他元素重复的项。\n\n与普通列表或元组不同，集合中的单个元素不能通过集合名称后跟包含索引号的方括号来引用。相反，集合拥有强大的方法，可以作为集合名称的后缀，用于对值进行操作和比较：\n\
  \n| 集合方法: | : |\n| :--- | :--- |\n| `set.add(x)` | 向集合添加项 `x` |\n| `set.update(x,y,z)`\
  \ | 向集合添加多个项 |\n| `set.copy()` | 返回集合的副本 |\n| `set.pop()` | 从集合中随机删除一个项 |\n| `set.discard(i)`\
  \ | 从集合中删除位置为 `i` 的项 |\n| `set1.intersection(set2)` | 返回在两个集合中都出现的项 |\n| `set1.difference(set2)`\
  \ | 返回 `set1` 中但不在 `set2` 中的项 |\n\n可以使用 Python 内置的 `type()` 函数来显示数据类类型。可以使用内置的 `len()`\
  \ 函数返回集合的长度。可以使用 `in` 运算符搜索集合中的值。\n\n![image](img/image00257.jpeg)通过初始化具有唯一值的集合启动新程序，然后显示其类类型\n\
  \n```\nparty_goers = { ‘Andrew’ , ‘Barbara’ , ‘Carole’ , ‘David’ }\nprint( ‘party_goers:’\
  \ , type( party_goers ) )\n```\n\n![image](img/image00258.jpeg)接下来，添加语句搜索集合中的两个值\n\
  \n```\nprint( ‘Did David go to the party?’ , ‘David’ in party_goers )\nprint( ‘Did\
  \ Kelly go to the party?’ , ‘Kelly’ in party_goers )\n```\n\n![image](img/image00259.jpeg)现在，初始化另一个具有唯一值的集合\n\
  \n```\nstudents = { ‘Andrew’ , ‘Kelly’ , ‘Lynn’ , ‘David’ }\n```\n\n![image](img/image00260.jpeg)然后，创建一个仅包含两个集合共同值的集合\n\
  \n```\ncommons = party_goers.intersection( students )\n```\n\n![image](img/image00261.jpeg)初始化一个共同值的普通列表——以便单独访问元素值\n\
  \n```\nparty_students = list( commons )\n```\n\n![image0262.jpeg)最后，显示所有共同值以及存储在第一个普通列表元素中的值\n\
  \n```\nprint( ‘Students at the party:’ , party_students )\nprint( ‘First student\
  \ at the party:’ , party_students[0] )\n```\n\n![image](img/image00266.jpeg)保存并运行此程序——查看集合的值\n\
  \n![image](img/image00267.jpeg)\n\n![image](img/image00215.jpeg)注意 `list()` 函数放置元素值的顺序可能与它们在集合中的顺序不同。\n\
  \n### 字典 (Dictionaries)\n\n在 Python 编程中，“字典”是一种数据容器，以键值对列表的形式存储多个数据项。与通过索引号引用的普通列表容器值不同，存储在字典中的值是通过其关联的键引用的。键在字典内必须是唯一的，通常是字符串名称，尽管也可以使用数字。\n\
  \n创建字典只需将键值对作为逗号分隔的列表在大括号（花括号）之间赋值给任选择的名称。字符串必须往常一样包含在引号内，键与其关联的值之间必须有一个 `:` 冒号字符。\n\
  \n![image](img/image00194.jpeg)\n\n在其他编程语言中，列表通常被称为“数组”（array），字典通常被称为“关联数组”（associative\
  \ array）。\n\n\n\n\n通过向 `del` 关键字指定字典名和键对的键，可以从字典中删除一个键值对。相反，通过为字典名和一个新键赋值值，可以向字典中添加一个键值对。\n\
  \nPython 字典有一个 `keys()` 方法，可以在字典名后加上点 `.` 后缀，返回该字典中所有键的列表，顺序是随机的。如果你希望键按字母和数字顺序排序，只需将该语句括在\
  \ Python `sorted()` 函数的括号内即可。\n\n可以使用 Python 的 `in` 运算符对字典进行搜索，检查其是否包含特定键，语法为 `key\
  \ in dictionary`。当在指定的字典中找到键时，搜索将返回布尔值 `True`，否则返回 `False`。\n\n字典是 Python 编程中可用的最后一种数据容器类型。总而言，各种类型如下：\n\
  \n- **变量（Variable）** – 存储单个值\n- **列表（List）** – 在有序索引数组中存储多个值\n- **元组（Tuple）** –\
  \ 在序列中存储多个固定值\n- **集合（Set）** – 在无序集合中存储多个唯一值\n- **字典（Dictionary）** – 存储多个无序的键值对\n\
  \n![image](img/image00194.jpeg)\n\n数据经常以键值对的形式关联——例如，当你提交 Web 表单时，在输入字段中输入的文本值通常与该文本字段的名称作为键关联。\n\
  \n![image](img/image00188.jpeg)\n\ndict.py\n\n![image](img/image00257.jpeg)通过初始化字典启动新程序，然后显示其数据类类型和其键值内容\n\
  \n```\ninfo = { ‘name’ : ‘Bob’ , ‘ref’ : ‘Python’ , ‘sys’ : ‘Win’ }\nprint( ‘info:’\
  \ , type( info ) )\nprint( ‘Dictionary:’ , info )\n```\n\n![image](img/image00258.jpeg)接下来，通过键显示引用的单个值\n\
  \n```\nprint( ‘\\nReference:’ , info[ ‘ref’ ] )\n```\n\n![image](img/image00259.jpeg)现在，显示字典中的所有键\n\
  \n```\nprint( ‘\\nKeys’ , info.keys() )\n```\n\n![image](img/image00260.jpeg)从字典中删除一个对并添加一个替换对，然后显示新的键值内容\n\
  \n```\ndel info[ ‘name’ ]\ninfo[ ‘user’ ] = ‘Tom’\nprint( ‘\\nDictionary:’ , info\
  \ )\n```\n\n![image](img/image00261.jpeg)最后，在字典中搜索特定键并显示搜索结果\n\n```\nprint( ‘\\\
  nIs There A name Key?:’ ,’name’ in info )\n```\n\n![image](img/image00262.jpeg)保存文件并运行此程序——查看字典的键和值\n\
  \n![image](img/image00268.jpeg)\n\n![image](img/image00215.jpeg)\n\n注意，字符串内的引号必须由反斜杠转义字符引导——防止字符串被提前终止。\n\
  \n## 总结\n\n- 可以使用一系列 `=` 赋值在单个语句中初始化多个变量\n- Python 列表是一个数组，可以在从零开始的顺序元素中存储多个数据项\n\
  - 存储在列表元素中的数据可以通过列表名后跟 `[]` 中的索引来引用\n- 列表元素可以有多个索引来表示多个维度，例如 `X` 和 `Y`\n- 列表变量有许多方法，可以在列表名后加上点\
  \ `.` 后缀进行操作\n- `len()` 函数返回指定列表的长度\n- 通过向 `del` 关键字指定列表名和元素编号可以删除单个列表元素\n- Python\
  \ 元组是一个不可变列表，其值可以通过“序列”赋值给单个变量\n- 存储在元组元素中的数据可以通过元组名后跟 `[]` 中的索引来引用\n- Python 集合是唯一元素的有序集合，其值可以通过其方法进行比较和操纵\n\
  - 存储在集合中的数据不能通过其索引引用\n- 集合变量有方法，可以在列表名后加上点 `.` 后缀进行比较\n- Python 内置 `in` 运算符可在集合中查找值\n\
  - 集合可以使用 `list()` 转换为普通列表，允许通过索引引用元素\n- Python 字典是一个键值对列表，其中每个键必须是唯一的\n- 存储在字典元素中的数据可以通过字典名后跟\
  \ `[]` 中的键来引用\n\n## 5 控制结构\n\n本章演示了如何控制程序的流程。\n\n- 分支选择\n- 计数循环\n- 循环条件\n- 跳过循环\n\
  - 捕获错误\n- 总结\n\n### 分支选择\n\n与许多编程语言一样，Python 的 `if` 关键字执行基础条件测试，评估给定的表达式是否为布尔值 `True`\
  \ 或 `False`。这允许程序根据测试结果向不同的方向运行，被称为“条件分支”。\n\n在 Python 中，测试表达式后面必须紧跟一个冒号 `:`，然后是测试成功时要执行的语句，这些语句写在下方的新行，且每行必须相对于\
  \ `if` 测试缩进。缩进的大小并不重要，但每行必须保持相同。因此语法看起来如下：\n\n```\nif test-expression :\n    statements-to-execute-when-test-expression-is-True\n\
  ```\n\n![image](img/image00269.jpeg)\n\n`if: elif: else:` 序列是其他语言中 `switch` 或 `case`\
  \ 语句的等价物。`if` 测试可以通过附加 `else` 关键字来提供测试失败时执行的备用语句。`else` 关键字必须后跟冒号 `:` 并与 `if` 关键字对齐，但其语句必须缩进，因此语法如下：\n\
  \n```\nif test-expression :\n    statements-to-execute-when-test-expression-is-True\n\
  else :\n    statements-to-execute-when-test-expression-is-False\n```\n\n`if` 测试块可以使用\
  \ `elif` 关键字（else if）跟随另一个测试，提供在测试成功时执行的语句。这同样必须与 `if` 关键字对齐，后跟一个冒号 `:`。然后可以添加最终的\
  \ `else` 关键字来提供测试失败时的备用语句。完整的 `if-elif-else` 结构语法如下：\n\n```\nif test-expression-1\
  \ :\n    statements-to-execute-when-test-expression-1-is-True\nelif test-expression-2\
  \ :\n    statements-to-execute-when-test-expression-2-is-True\nelse :\n    statements-to-execute-when-test-expressions-are-False\n\
  ```\n\n![image](img/image00215.jpeg)\n\n代码的缩进在 Python 中非常重要，因为它向解释器标识代码块——其他编程语言使用如\
  \ `{}` 括号。\n\n![image](img/image00188.jpeg)\n\nif.py\n\n![image](img/image00270.jpeg)通过用户输入整数值初始化变量启动新程序\n\
  \n```\nnum = int( input( ‘Please Enter A Number: ‘ ) )\n```\n\n![image](img/image00271.jpeg)接下来，测试变量并显示相应的响应\n\
  \n```\nif num > 5 :\n    print( ‘Number Exceeds 5’ )\nelif num < 5 :\n    print(\
  \ ‘Number is Less Than 5’ )\nelse :\n    print( ‘Number Is 5’ )\n```\n\n![image](img/image00272.jpeg)现在，再次使用两个表达式测试变量，并仅在成功时显示响应\n\
  \n\n\n\n\n```python\nif num > 7 and num < 9 :\n    print( ‘Number is 8’ )\n\nif\
  \ num == 1 or num == 3 :\n    print( ‘Number Is 1 or 3’ )\n```\n![image](img/image00273.jpeg)保存并运行程序\
  \ – 查看条件分支的\n\n![image](img/image00274.jpeg)\n\n![image](img/image00193.jpeg)\n\n\
  用户输入默认被作为字符串值读取，因此必须使用 `int()` 转换为 `int` 数据类型以便进行算术比较。\n\n![image](img/image00194.jpeg)\n\
  \n`and` 关键字确保只有在两个测试都成功时结果才为 `True`，而 `or` 关键字确保在任一测试成功时结果即为 `True`。\n\n### 计数循环\n\
  \n与其他编程语言一样，Python 的 `for` 关键字会遍历 `in` 关键字指定的任何列表中的所有项。在 Python 中，该语句必须以冒号 `:` 结尾，并且循环每次迭代中执行的语句必须缩进：\n\
  \n```python\nfor each-item in list-name :\n    statements-to-execute-on-each-iteration\n\
  ```\n\n由于字符串仅仅是字符列表，`for in` 语句可以遍历每个字符。同样，`for in` 语句可以遍历列表中的每个元素、元组中的每个项、集合中的每个成员或字典中的每个键。\n\
  \n![image](img/image00275.jpeg)\n\nPython 中的 `for` 循环与 `C` 等语言不同，因为它不允许指定步长和结束位置。\n\
  \n`for in` 循环按照项在序列中出现的顺序对任何列表或字符串的项进行迭代，但不能直接指定迭代次数、停止条件或迭代步长。然而，你可以使用 Python 的\
  \ `range()` 函数，通过在括号内指定一个数值结束值来遍历数字序列。这将生成一个从零开始并持续到（但不包含）指定结束值的序列。例如，`range(5)`\
  \ 生成 `0,1,2,3,4`。\n\n可选地，你可以在 `range()` 函数的括号内指定开始值和结束值，并用逗号分隔。例如，`range(1,5)` 生成\
  \ `1,2,3,4`。此外，你可以在 `range()` 函数的括号内以逗号分隔列表的形式指定开始值、结束值和步长。例如，`range(1,14,4)` 生成\
  \ `1,5,9,13`。\n\n你可以在 Python `enumerate()` 函数的括号内指定列表名称，以显示每个元素的索引数字及其关联的值。\n\n\
  ![image](img/image00193.jpeg)\n\n`range()` 函数可以生成递减（倒计时）的序列，也可以生成向上计数的序列。\n\n当同时遍历多个列表时，可以通过在\
  \ Python 的 `zip()` 函数的括号内将列表名称作为逗号分隔的列表，将每个列表中相同索引的元素值显示在一起。\n\n当遍历字典时，你可以使用字典的\
  \ `items()` 方法并为 `for` 关键字指定两个逗号分隔的变量名——一个用于键名，另一个用于值——来显示每个键及其关联的值。\n\n![image](img/image00188.jpeg)\n\
  \nfor.py\n\n![image](img/image00270.jpeg)通过初始化普通列表、固定元组列表和关联字典列表来启动新程序\n\n```python\n\
  chars = [ ‘A’ , ‘B’, ‘C’ ]\nfruit = ( ‘Apple’ , ‘Banana’ , ‘Cherry’ )\ninfo = {\
  \ ‘name’ : ’Mike’ , ‘ref’ : ’Python’ , ‘sys’ : ’Win’ }\n```\n![image](img/image00271.jpeg)接下来，添加语句显示所有列表元素值\n\
  \n```python\nprint( ‘Elements: \\t’ , end = ‘ ‘ )\nfor item in chars :\n    print(\
  \ item , end = ‘ ‘ )\n```\n![image](img/image00272.jpeg)现在，添加语句显示所有列表元素值及其对应的索引号\n\
  \n```python\nprint( ‘\\nEnumerated:\\t’ , end = ‘ ‘ )\nfor item in enumerate( chars\
  \ ) :\n    print( item , end = ‘ ‘ )\n```\n![image](img/image00273.jpeg)然后，添加语句显示所有列表和元组元素\n\
  \n```python\nprint( ‘\\nZipped: \\t’ , end = ‘ ‘ )\nfor item in zip( chars , fruit\
  \ ) :\n    print( item , end = ‘ ‘ )\n```\n![image](img/image00276.jpeg)最后，添加语句显示所有字典键名和关联元素值\n\
  \n```python\nprint( ‘\\nPaired:’ )\nfor key , value in info.items() :\n    print(\
  \ key , ‘=’ , value )\n```\n![image](img/image00277.jpeg)保存并运行程序 – 查看循环迭代显示的项\n\n\
  ![image](img/image00278.jpeg)\n\n![image](img/image00194.jpeg)\n\n在编程术语中，任何包含多个可以遍历的项的内容被称为“可迭代的”（iterable）。\n\
  \n### 循环条件\n\n`while` 循环是在条件表达式为 `True` 时重复的代码段。`while` 关键字后面跟着测试表达式和一个冒号 `:`。循环内部执行的语句需要缩进。只要测试表达式为\
  \ `True`，循环就会继续——直到测试表达式变为 `False`，此时循环结束。\n\n在 Python 编程中，`True` 和 `False` 以大写字母开头。\n\
  \n必须观察代码块的缩进，就像这个产生斐波那契数列的示例一样：\n\n![image](img/image00193.jpeg)\n\n与其他语言不同，交互式解释器在等待你的更多代码时会自动缩进。\n\
  \n![image](img/image00188.jpeg)\n\nwhile.py\n\n通过初始化计数器变量并使用该变量作为测试表达式定义外部循环来启动新程序\n\
  \n```python\ni = 1\nwhile i < 4 :\n    print( ‘Outer Loop Iteration:’ , i )\n  \
  \  i += 1\n```\n![image](img/image00271.jpeg)接下来，添加缩进语句显示计数的值并在循环每次迭代中对其递增\n\n![image](img/image00272.jpeg)现在（仍缩进）初始化第二个计数器变量并使用该变量作为测试表达式定义内部循环\n\
  \n```python\n    j = 1\n    while j < 4 :\n        print( ‘\\tInner Loop Iteration:‘\
  \ , j )\n        j += 1\n```\n![image](img/image00273.jpeg)最后，添加进一步缩进的语句显示此计数器的值并在每次迭代中对其递增\n\
  \n从内部循环打印的内容相对于外部循环通过 **\\t** 制表符进行了缩进。\n\n循环可以嵌套（一个在另一个内部），允许在外部循环的每次迭代中完整执行内部循环。计数器变量可以在循环定义之前初始化起始值，包含在测试表达式中，并在每次迭代中递增，直到测试失败。\n\
  \n![image](img/image00276.jpeg)保存并运行此程序 – 查看每次迭代显示的输出\n\n![image](img/image00280.jpeg)\n\
  \n\n\n\n\nPython 的 `break` 关键字用于在满足指定条件时提前终止循环。`break` 语句位于循环语句块内部，其前面是一个测试表达式。当测试返回\
  \ `True` 时，循环立即结束，程序继续执行下一个任务。例如，在嵌套内层循环中，它将进入外层循环的下一次迭代。\n\n![image](img/image00188.jpeg)\n\
  \n`nest.py`\n\n![image](img/image00270.jpeg)启动一个新程序，创建一个循环三次的循环语句\n\n```python\n\
  for i in range( 1, 4 ) :\n```\n\n![image](img/image00271.jpeg)接下来，添加一个缩进的语句，创建一个同样循环三次的“嵌套”内层循环\n\
  \n```python\nfor j in range( 1, 4 ) :\n```\n\n![image](img/image00272.jpeg)现在，在内层循环中添加一个进一步缩进的语句，在内层循环的每次迭代中显示计数器数值（外层循环和内层循环的计数器）\n\
  \n```python\nprint( ‘Running i=’ + i + ‘ j=’ + j )\n```\n\n![image](img/image00273.jpeg)保存并运行此程序——查看每次循环迭代的计数器值\n\
  \n![image](img/image00281.jpeg)\n\n![image](img/image00194.jpeg)\n\n将这些嵌套的 `for`\
  \ 循环与此处的嵌套 `while` 循环示例对比。\n\n![image](img/image00188.jpeg)\n\n`break.py`\n\n![image](img/image00276.jpeg)在内层循环的开始插入\
  \ `break` 语句以跳该循环——然后再次运行程序\n\n```python\nif i == 2 and j == 1 :\n    print( ‘Breaks\
  \ inner loop at i=2 j=1’ )\n    break\n```\n\n![image](img/image00282.jpeg)\n\n\
  Python 的 `continue` 关键字用于在满足指定条件时跳过循环的单次迭代。`continue` 语句位于循环语句块内部，其前面是一个测试表达式。当测试返回\
  \ `True` 时，该次迭代结束，程序进入下一次迭代。\n\n![image](img/image00277.jpeg)现在，在内层循环块的开始插入 `continue`\
  \ 语句以跳过该循环的第一次迭代——然后再次运行程序\n\n```python\nif i == 1 and j == 1 :\n    print( ‘Continues\
  \ inner loop at i=1 j=1’ )\n    continue\n```\n\n![image](img/image00283.jpeg)\n\
  \n![image](img/image00193.jpeg)\n\n当外层循环第二次运行内层循环时，`break` 语句会停止内层循环的所有三次迭代。\n\n\
  ![image](img/image00188.jpeg)\n\n`continue.py`\n\n![image](img/image00193.jpeg)\n\
  \n当外层循环第一次运行时，`continue` 语句会跳过内层循环的第一次迭代。\n\n### 捕获错误\n\n程序中可以预判错误的部分（例如处理用户输入的部分）通常包含在\
  \ `try except` 块中以处理“异常错误”。要执行的语句被分组在 `try:` 块中，异常将传递给随后的 `except:` 块进行处理。可选情况下，后面可以跟一个\
  \ `finally:` 块，其中包含在异常处理后要执行的语句。\n\nPython 识别许多内置异常，例如在未找到变量名时发生的 `NameError`，在尝试访问不存在的列表索引时发生的\
  \ `IndexError`，以及在内置操作或函数接收不适当值时发生的 `ValueError`。\n\n每个异常都会返回一个描述性消息，可以使用 `as` 关键字将其方便地赋值给变量。然后可以使用该变量来显示异常发生时的性质。\n\
  \n![image](img/image00188.jpeg)\n\n`try.py`\n\n![image](img/image00270.jpeg)通过初始化一个带有字符串值的变量启动一个新程序\n\
  \n```python\ntitle = ‘Coding for Beginners In Easy Steps’\n```\n\n![image](img/image00271.jpeg)接下来，添加一个\
  \ `try` 语句块，尝试显示变量值——但错误地指定的名称\n\n```python\ntry :\n    print( titel )\n```\n\n\
  ![image](img/image00272.jpeg)现在，添加一个 `except` 语句块，在发生 `NameError` 时显示错误消息\n\n```python\n\
  except NameError as msg :\n    print( msg )\n```\n\n![image](img/image00273.jpeg)保存并运行程序——查看错误如何被处理\n\
  \n![image](img/image00284.jpeg)\n\n![image](img/image00194.jpeg)\n\n在某些编程语言中，这种结构被称为\
  \ try-catch 异常处理。\n\n可以通过在 `except` 块的括号内指定逗号分隔的异常类型列表来处理多个异常：\n\n```python\nexcept\
  \ ( NameError , IndexError ) as msg :\n    print( msg )\n```\n\n你还可以使用 `raise` 关键字来强制解释器报告异常，通过指定要识别的异常类型并在括号中提供自定义的描述性消息。\n\
  \n![image](img/image00188.jpeg)\n\n`raise.py`\n\n![image](img/image00270.jpeg)通过初始化一个带有整数值的变量启动一个新的\
  \ Python 脚本\n\n```python\nday = 32\n```\n\n![image](img/image00271.jpeg)接下来，添加一个\
  \ `try` 语句块来测试变量并指定异常\n\n```python\ntry :\n    if day > 31 :\n        raise ValueError(Invalid\
  \ Day’ )\n```\n\n![image](img/image00272.jpeg)现在，添加一个 `except` 语句块，在发生 `ValueError`\
  \ 时显示消息\n\n```python\nexcept ValueError as msg :\n    print( ‘The found An’ , msg\
  \ )\n```\n\n![image](img/image00273.jpeg)然后，添加一个 `finally` 语句来指定要执行的语句\n\n```python\n\
  finally :\n    print( ‘But Today Is Beautiful.’ )\n```\n\n![image](img/image00276.jpeg)保存并运行程序——查看抛出的错误如何被处理\n\
  \n![image](img/image00281.jpeg)\n\n![image](img/image00193.jpeg)\n\n`try` 块中的语句在发生异常之前都会被执行。\n\
  \n## 总结\n\n- `if` 关键字对表达式进行布尔值测试，结果为 `True` 或 `False`。\n- 条件分支通过 `else` 和 `elif`\
  \ 关键字提供了 `if` 测试的替代方案。\n- Python 测试表达式后必须跟随 `:` 字符，语句块相对于测试行缩进。\n- `for in` 循环遍历列表或字符串中的每个项。\n\
  - Python `for in` 循环语句后必须跟随 `:` 字符，语句块相对于语句缩进。\n- `range()` 函数生成一个数值序列，可用于指定 `for\
  \ in` 循环的长度。\n- `enumerate()` 函数可以指定列表名称以显示每个元素的索引及其存储的值。\n- `zip()` 函数可以显示多个列表中相同索引的存储值。\n\
  - `while` 循环在初始测试表达式保持为 `True` 时重复，在表达式变为 `False` 时结束。\n- Python `while` 循环语句后必须跟随\
  \ `:` 字符，语句块相对于语句缩进。\n- 计数器变量的值可以在测试表达式中进行测试，以控制循环迭代次数。\n- `break` 关键字用于测试表达式为 `True`，并在测试返回\
  \ `False` 时立即退出循环。\n- `continue` 关键字用于测试表达式为 `True`，并在测试返回 `False` 时跳过单次迭代。\n- 预期的运行时异常错误可以通过将语句包含在\
  \ `try except` 块中来处理。\n- 可选，可以使用 `finally` 语句来指定在异常处理后执行的语句。\n\n\n\n\n\n本书中之前的示例使用了\
  \ Python 编程语言的内置函数，例如 `print()` 函数。然而，大多数程序都有许多由编码员定义的自定义函数，这些函数可以在程序运行时根据需要进行调用。\n\
  \n自定义 Python 函数是使用 `def`（定义）关键字创建的，后面跟着你选择的名称和 `()` 括号。编码员可以为函数选择任何名称，但不能使用编程语言的关键字和现有内置函数的名称。此行必须以\
  \ `:`（冒号）结尾，然后每当函数被调用时要执行的语句必须出现在下方的行中并进行缩进。因此，函数定义的语法如下：\n\n```python\ndef function-name():\n\
  \    statements-to-be-executed\n```\n\n![image](img/image00286.jpeg)\n\n函数语句相对于定义行必须保持相同的缩进量，以便\
  \ Python 解释器识别该代码块。\n\n一旦函数语句执行完毕，程序流将从函数调用后的直接点继续执行。这种模块化在编程中非常有用，它可以隔离一组例程，以便重复调用。\n\
  \n要创建自定义函数，有必要理解程序中变量的可访问性（“作用域”）：\n\n*   函数外部创建的变量可以被函数内部的语句引用——它们具有“全局”作用域\n*\
  \   函数内部创建的变量无法从创建它们的函数外部引用——这些具有“局部”作用域\n\n局部变量的访问访问限制意味着同名的变量可以出现在不同的函数中而不会产生冲突。\n\
  \n![image](img/image00215.jpeg)\n\n避免使用全局变量以防止意外冲突——尽可能只使用局部变量。\n\n如果你想强制转换一个局部变量使其在其他地方可访问，必须先用\
  \ Python 的 `global` 关键字对其声明，后仅跟其名称。随后可以给它赋值，该值可以在程序的任何地方被引用。当全局变量和局部变量具有同名时，函数将使用本地版本。\n\
  \n![image](img/image00188.jpeg)\n\n`def.py`\n\n![image](img/image00287.jpeg)通过初始化全局变量开始一个新程序\n\
  \n```python\nglobal_var = 1\n```\n\n![image](img/image00288.jpeg)接下来，创建一个名为 `my_vars()`\
  \ 的函数来显示全局变量中包含的值\n\n```python\ndef my_vars():\n    print('Global variable:', global_var)\n\
  ```\n\n![image](img/image00289.jpeg)现在，在函数块中添加缩进语句来初始化局部变量并显示其包含的值\n\n```python\n\
  local_var = 2\nprint('Local variable:', local_var)\n```\n\n![image](img/image00290.jpeg)然后，在函数块中添加缩进语句来创建一个强制转换全局变量并分配初始值\n\
