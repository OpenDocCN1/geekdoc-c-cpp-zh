  \ | 整除 |\n| `**` | 幂 |\n\n`+` 运算符将两个数字相加，`-` 运算符从第一个数中减去第二个数。\n\n`*` 运算符将第一个数乘以第二个数，`/`\
  \ 运算符将第一个数除以第二个数。\n\n`%` 取余运算符将第一个数除以第二个数并返回运算的余数。这对于确定一个数是奇数还是偶数很有用。\n\n`//` 整除运算符的操作与\
  \ `/` 除法运算符相同，但会在小数点处截断结果——移除结果数字中的任何浮点部分。\n\n`**` 幂运算符返回第一个数对于第二个数幂的结果。\n\n![image](img/image0019.jpeg)\n\
