  • 使用 `cx_Freeze` 工具可以在 Windows 系统上创建一个简单的安装程序\n• 当使用 `bdist_msi` 命令执行设置脚本时，会创建一个\
  \ MSI 安装程序，它会将分发包复制到主机计算机，其中包含可执行文件\n\n13\n\n## 技能迁移\n\n*本章展示了编写各种流行编程语言时的相似之处与差异*。\n\
  \n- 理解编译器\n- 编译代码\n- 编写 C 语言\n- 编写 C++ 语言\n- 编写 C# 语言\n- 编写 Java 语言\n- 总结\n\n##\
  \ 理解编译器\n\n现代应用程序使用“高级级”语言编写，这些语言在计算机理解的机器码和人类可读的源代码之间提供了高度的抽象。为了运行程序，源代码必须先渲染成计算机可以执行的机器码。这一过程取决于编写程序的语言，可以通过“解释器”或“编译器”来完成。\n\
  \nPython 编程语言在本书之前的的几个章节中一直被用于演示，它使用解释器来翻译程序源代码。随着程序的运行，解释器动态地将其函数和语句代码对象翻译成“字节码”。然后，可以通过\
  \ Python 的字节码解释器（又称“虚拟机”或“VM”）执行这些字节码。\n\n![image](img/image00194.jpeg)\n\n通常使用解释器的语言被称为“解释型语言”，而使用编译器的语言被称为“编译型语言”。\n\
  \n其他使用解释器将源代码翻译成字节码并通过其虚拟机由计算机执行的编程语言包括 Java 和 Ruby。\n\n![image](img/image00398.jpeg)\n\
  \n传统的编程语言（如 C 语言）使用编译器将程序源代码转换为机器码。编译会处理整个源代码，并首先生成中间“对象代码”，它以二进制机器码格式表示程序的函数和语句。然后，编译器将对象代码合并成单一的二进制机器码文件（`.exe`），该文件可以直接由计算机执行。\n\
  \n![image](img/image00193.jpeg)\n\n注意，为了执行用解释型语言编写的程序，用户的计算机上必须存在虚拟机 (VM)。\n\n其他使用编译器将源代码转换为机器码以供计算机直接执行的编程语言包括\
  \ C++（“C 加加”）和 C#（“C sharp”）。\n\n![image](img/image00399.jpeg)\n\n因此，用 Python 等“解释型语言”编写的程序与用\
  \ C 语言等“编译语言”编写的程序在执行方式存在根本差异。它们在性能和移植性方面各有优缺点，如下表所示：\n\n| 解释器: | 编译器: |\n| :---\
  \ | :--- |\n| 以单个代码对象作为输入进行*翻译* | 以整个源代码作为输入进行*转换* |\n| *不*生成中间对象代码 | *会*生成中间对象代码\
  \ |\n| 执行条件控制语句*较慢* | 执行条件控制语句*快速* |\n| 需要*较少*内存，因为不生成对象代码 | 需要*更多* 内存，因为生成了对象代码\
  \ |\n| 程序*每次*运行时都会翻译源代码 | 在编译期间*转换一次*源代码 |\n| 语句出现任何错误时*立即*报告 | 仅在尝试编译整个源代码*后*报告任何错误\
  \ |\n| 代码对象逐一翻译为机器码时，程序运行*较慢* | 机器码直接在计算机上运行时，程序运行*更快* |\n| 分发的程序是人类可读的源代码，因此*易于*修改\
  \ | 分发的程序是编译后的机器码，因此*难以*修改 |\n| 对知识产权的保护*较差* | 机器码直接在计算机上运行时，程序运行*更快* |\n\n![image](img/image00215.jpeg)\n\
  \n不要被 Java 程序误导。它们被“编译”成可分发的（`.class`）文件，但仍然需要 Java VM 字节码解释器来运行。\n\n## 编译代码\n\n\
  为了更全面地理解编译过程，详细检查一个简单的 C 语言程序的编译是有用的。从原始源代码文件生成可执行文件时，编译过程实际上经历了四个独立的阶段，每个阶段都会生成一个新文件：\n\
  \n- 预处理：预处理器阶段首先将所有“预处理器”指令（如导入库的语句）替换为实际库代码。例如，在 C 语言中用库代码替换 `#include` 导入指令。生成的包含替换的内容为文本格式，通常具有\
  \ `.i` 扩展名。\n- 翻译：编译器阶段将 `.i` 文件中的高级指令翻译为低级汇编指令。生成的包含翻译的文件为文本格式，通常具有 `.s` 扩展名。\n\
  - **汇编**：汇编器阶段将 `.s` 文件中的汇编文本指令转换为机器码。生成的转换对象文件为二进制格式，通常具有 `.o` 扩展名。\n- **链接**：链接器阶段将一个或多个二进制对象文件\
  \ `.o` 合并成单一的可执行文件。生成的文件为二进制格式，通常具有 `.exe` 扩展名。\n\n![image](img/image00400.jpeg)\n\
  \n严格来说，“编译”描述的是上述三个阶段，它们作用于单一源代码文本文件，并最终生成单一的二进制对象文件。如果程序源代码包含语法错误（例如缺少语句终止符或缺少括号），编译器将报告这些错误且编译将失败。\n\
  \n\n\n\n另一方面，链接器可以对多个目标文件进行操作并最终生成单个可执行文件。这允许从模块化的目标文件创建大型程序，每个目标文件都可能包含可重用的函数。当链接器在多个目标文件中找到同名的函数时，它将报告错误且不会创建可执行文件。\n\
  \n通常情况下，编译过程中中间阶段创建的临时文件会自动删除，但 GNU C 编译器 (`gcc`) 在编译器命令中提供了 `-save-temps` 选项，允许将这些文件保存以供检查。\n\
  \n![image](img/image00287.jpeg)对于一个简单的 C 语言“Hello World!”程序，输入命令 `gcc hello.c -save-temps\
  \ -o hello.exe` 然后按回车键来编译并保存临时文件。\n\n![image](img/image00401.jpeg)\n\n![image](img/image00288.jpeg)用纯文本编辑器（如\
  \ Windows 记事本）打开 `hello.i` 文件，即可在文件的最末尾看到源代码——其前面是经过替换的库代码。\n\n![image](img/image00289.jpeg)现在，用纯文本编辑器打开\
  \ `hello.s` 文件，查看翻译后的低级汇编代码，并注意它与高层代码相比是多么难读。\n\n![image](img/image00402.jpeg)\n\
  \n![image](img/image00194.jpeg)\n\n在此处的命令中，`gcc` 调用了编译器，源代码文件为 `hello.c`，而 `-o hello.exe`\
  \ 指定了输出的可执行文件。\n\n![image](img/image00194.jpeg)\n\n上方提供了一个演示如何在 C 编程语言中编写和编译程序的完整示例。\n\
  \n# C 语言编程\n\n本书中通过 Python 编程语言描述和演示的编码数据结构和控制结构也存在于其他编程语言中。通过识别相似之处，你通过 Python\
  \ 编程获得的技能可以转移到其他语言，例如 C 编程语言。C 编程语言起源于 20 世纪 70 年代，设计为易于编译成低级机器代码。它的效率使其适用于从嵌入式系统到操作系统的各种应用。\n\
  \n在 Python 代码中此处和此处描述的简单猜数字游戏程序可以用类似的 C 等效程序实现。\n\n![image](img/image00188.jpeg)\n\
  \n## C 语言实现\n\n`guess.c`\n\n![image](img/image00287.jpeg)通过导入库来使输入输出、随机数时间和函数可用，从而开始一个新的\
  \ C 程序。\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n#include <time.h>\n```\n\
  \n![image](img/image00288.jpeg)接下来，定义一个“main”函数体，它将包含整个游戏代码并在完成后返回零。\n\n```c\nint\
  \ main( )\n{\n    /* 在此处添加语句 */\n    return 0 ;\n}\n```\n\n![image](img/image00289.jpeg)现在，添加语句将变量初始化为\
  \ 1-20 范围内的随机数、一个布尔真值和一个整数。\n\n```c\nsrand( time( NULL ) ) ;\nint num = ( rand()\
  \ % 20 ) + 1 ;\nint flag = 1 ;\nint guess = 0 ;\n```\n\n![image](img/image00290.jpeg)添加一条语句请求用户输入。\n\
  \n```c\nprintf( “Guess my number 1-20 : “ ) ;\n```\n\n![image](img/image00291.jpeg)然后，添加一个循环语句，将输入读入整数变量并包含一个条件测试。\n\
  \n```c\nwhile ( flag == 1 )\n{\n    scanf( “%d” , &guess ) ; fflush( stdin ) ;\n\
  \    /* 在此处添加条件测试 */\n}\n```\n\n![image](img/image00215.jpeg)此 C 程序将接受浮点数猜测，因为它们的值在赋值给变量\
  \ `guess` 变量时会被截断为整数。\n\n![image](img/image00292.jpeg)最后，在循环内部添加条件测试，然后保存、编译并运行程序。\n\
  \n```c\nif( guess == 0 )\n{\n    printf( “Invalid! Enter only digits 1-20\\n” )\
  \ ;\n    break ;\n}\nelse if ( guess < num ) { \n    printf( “Too low, try again\
  \ : “ ) ; \n}\nelse if ( guess > num ) { \n    printf( “Too high, try again : “\
  \ ) ; \n}\nelse\n{\n    printf( “Correct... My number is %d \\n” , num ) ;\n   \
  \ flag = 0 ;\n}\n```\n\n![image](img/image00403.jpeg)\n\n![image](img/image00404.jpeg)GNU\
  \ C 编译器 (`gcc`) 被广泛使用，并作为 Minimalist GNU for Windows (MinGW) 软件包的一部分免费提供，来自 [sourceforge.net/projects/mingw](http://sourceforge.net/projects/mingw)。有关安装说明和其他帮助，请参考\
  \ [mingw.org/wiki](http://mingw.org/wiki) 文档。\n\n# C 语言猜数字游戏 – 程序对比\n\n- 库函数在 C\
  \ 程序可用。\n- `main()` 函数是入口点。\n- `num`、`flag` 和 `guess` 等变量存储状态。\n- `while` 循环和 `if-else`\
  \ 结构处理控制流。\n\n## C++ 编程\n\nC++ 版本利用了逻辑，但使用了 `iostream` 和布尔类型。\n\n![image](img/image00405.jpeg)\n\
  \n```cpp\n#include <iostream>\n#include <cstdlib>\n#include <ctime>\n```\n\nint\
  \ main( )\n{\n    /* 在此处添加语句 */\n    return 0 ;\n}\n```\n\n```cpp\nsrand( time(\
  \ 0 ) ) ;\nint num = ( rand() % 20 ) + 1 ;\nbool flag = true ;\nint guess = 0 ;\n\
  ```\n\n```cpp\nstd::cout << “Guess my number 1-20 : “ ;\n```\n\n```cpp\nwhile (\
  \ flag == 1 )\n{\n    std::cin >> guess ; std::cin.ignore( 256 , ‘\\n’ ) ;\n   \
  \ /* 在此处添加条件测试 */\n}\n```\n\n```cpp\nif( guess == 0 )\n{\n    std::cout << “Invalid!\
  \ Enter only digits 1-20\\n” ;\n    break ;\n}\nelse if ( guess < num ) { \n   \
  \ std::cout << “Too low, try again : “ ; \n}\nelse if ( guess > num ) { \n    std::cout\
  \ << “Too high, try again : “ ; \n}\nelse\n{\n    std::cout << “Correct... My number\
  \ is ” << num << “\\n” ;\n    flag = 0 ;\n}\n```\n\n\n\n\n来自 `[sourceforge.net/projects/mingw](http://sourceforge.net/projects/mingw)`\
  \ 的 Minimalist GNU for Windows (MinGW) 包也可选地提供了 C++ 代码的编译器。在此处的命令中 `c++` 调用编译器，源代码文件为\
  \ `guess.cpp`，而 `-o guessplus.exe` 指定了输出的可执行文件。\n\n## C++ 猜数字游戏 – 程序比较\n\n- 库函数通过\
  \ `#include` 指令在 C++ 程序中可用，类似于使用 Python 的 `import` 关键字\n- C++ 程序始终有一个 `main()` 函数，每当程序运行时，该函数都会被自动调用\n\
  - C++ 程序中的语句被被分组在 `{ }` 大括号内\n- C++ 中的变量不是弱类型，因此它们的数据类型（例如 `int`（整数））必须在声明时定义\n\
  - C++ 中每个条语句的末尾必须用 `;` 分号字符标记——制表符和空格无关\n- C++ 程序中的控制结构使用 `if`、`else` 和 `while`\
  \ 关键字——与 Python 程序的方式非常相似\n\n## 编写 C#\n\n书中用 Python 编程语言描述并演示的编码数据结构和控制结构在 C# 语言中也存在。通过识别其与\
  \ Python 代码的相似之处，你通过 Python 编码获得的技能可以迁移到该语言中。C# 编程语言由微软为其 .NET 计划开发。C# 程序需要在宿主计算机上安装通用语言运行时\
  \ (CLR) 以在运行时生成机器码——这一过程被称为“即时”（JIT）编译。\n\n在 Python 代码中此处 和此处 描述的简单猜数字游戏程序可以在类似的\
  \ C# 等效程序中重新创建。\n\n![image](img/image00188.jpeg)\n\n`guess.cs`\n\n![image](img/image00287.jpeg)通过导入命名空间来启动一个新的\
  \ C# 程序，以使输入输出和随机数函数可用\n\n```csharp\nusing System ;\n```\n\n![image](img/image00288.jpeg)接下来，定义一个类结构，将整个游戏代码封装在一个“Main”函数内\n\
  \n```csharp\nclass Guess\n{\n    static void Main( )\n    {\n        /* Statements\
  \ to be added here */\n    }\n} ;\n```\n\n![image](img/image00289.jpeg)现在，添加语句初始化变量为\
  \ 1-20 范围内的随机数、一个布尔值 true 以及一个整数\n\n```csharp\nRandom generator = new Random( )\
  \ ;\nint num = generator.Next( 1 , 20 + 1 ) ;\nbool flag = true ;\nint guess = 0\
  \ ;\n```\n\n![image](img/image00290.jpeg)添加一条语句请求用户输入\n\n```csharp\nConsole.WriteLine(\
  \ “Guess my number 1-20 : “ ) ;\n```\n\n![image](img/image00291.jpeg)然后，添加一个循环语句，将输入读取到整数变量中并封装一个条件测试\n\
  \n```csharp\nwhile ( flag == true )\n{\n    int.TryParse( Console.ReadLine( ) ,\
  \ out guess ) ;\n    /* Conditional test to be added here */\n}\n```\n\n![image](img/image00194.jpeg)\n\
  \n此 C# 程序不会接受浮点数猜测，因为它们会被 `int.TryParse()` 函数智能地识别为非整数。\n\n![image](img/image00292.jpeg)最后，在循环内部添加条件测试，然后保存、编译并运行程序\n\
  \n```csharp\nif( guess == 0 ) {\n    Console.Write( “Invalid! Enter only digits\
  \ 1-20\\n” ) ;\n    break ;\n}\nelse if ( guess < num ) {\n    Console.Write( “Too\
  \ low, try again : “ ) ; }\nelse if ( guess > num ) {\n    Console.Write( “Too high,\
  \ try again : “ ) ; }\nelse {\n    Console.Write( “Correct... My number is ” + num\
  \ + “\\n” ) ;\n    flag = false ;\n}\n```\n\n![image](img/image00407.jpeg)\n\n![image](img/image00408.jpeg)\n\
  \nVisual Studio Community IDE 是 C# 编程的极佳开发环境。它可以从 `[visualstudio.com](http://visualstudio.com)`\
  \ 免费获取，并包含 C# 编译器 (`csc.exe`)。在此处的命令中 `csc` 调用编译器，`/out: guesssharp.exe` 指定了输出的可执行文件，而源代码文件名为\
  \ `guess.cs`。\n\n## C# 猜数字游戏 – 程序比较\n\n- 库函数通过 `using` 指令在 C# 程序中可用，类似于使用 Python\
  \ 的 `import` 关键字\n- C# 程序始终有一个类结构，封装着一个 `Main()` 函数，该函数在程序运行时会被自动调用\n- C# 程序中的语句被被分组在\
  \ `{ }` 大括号内\n- C# 中的变量不是弱类型，因此它们的的数据类型（例如 `bool`（布尔值））必须在声明时定义\n- C# 中每个条语句的末尾必须用\
  \ `;` 分号字符标记——制表符和空格无关\n- C# 程序中的控制结构使用 `if`、`else` 和 `while` 关键字——与 Python 程序的方式非常相似\n\
  \n## 编写 Java\n\n书中用 Python 编程语言描述并演示的编码数据结构和控制结构在 Java 语言中也存在。通过识别其与 Python 代码的相似之处，你通过\
  \ Python 编码获得的技能可以迁移到该语言中。Java 程序需要宿主计算机上安装 Java 运行时 (JRE) 以在运行时生成机器码——这一过程被称为“一次编写，随处运行”。\n\
  \n在 Python 代码中此处 和此处 描述的简单猜数字游戏可以在类似的 Java 等效程序中重新创建。\n\n![image](img/image00188.jpeg)\n\
  \n`guess.java`\n\n![image](img/image00287.jpeg)通过定义类结构将整个游戏代码封装在一个“main”函数内来启动一个新的\
  \ Java 程序\n\n```java\nclass Guess\n{\n    public static void main( String[] args\n\
  \    {\n        /* Statements to be added here */\n    }\n}\n```\n\n![image](img/image00289.jpeg)现在，添加语句初始化变量为\
  \ 1-20 范围内的随机数、一个布尔值 true 以及一个整数\n\n```java\nint num = ( int ) Math.random( ) *\
  \ 20 + 1 ) ;\nboolean flag = true ;\nint guess = 0 ;\n```\n\n![image](img/image00290.jpeg)添加一条语句请求用户输入\n\
  \n```java\nSystem.out.print( “Guess my number 1-20 : “ ) ;\n```\n\n![image](img/image00291.jpeg)然后，添加一个循环语句，将输入读取到整数变量中并封装一个条件测试\n\
  \n```java\nwhile ( flag == true )\n{\n    try {\n        guess = Integer.parseInt(\
  \ System.console().readLine() ) ;\n    } catch ( NumberFormatException ex ) {\n\
  \    }\n    /* Conditional test to be added here */\n}\n```\n\n![image](img/image00194.jpeg)\n\
  \n此 Java 程序不会接受浮点数猜测，因为它们会被 `Integer.parseInt( ` 函数识别为非整数。\n\n![image](img/image00292.jpeg)最后，在循环内部添加条件测试，然后保存、编译并运行程序\n\
  \n```java\nif( guess == 0 ) {\n    System.out.println( “Invalid! Enter only digits\
  \ 1-20\\n” ) ;\n    break ;\n}\nelse if ( guess < num ) {\n    System.out.print(\
  \ “Too low, try again : “ ) ; }\nelse if ( guess > num ) {\n    System.out.print(\
  \ “Too high, try again : “ ) ; }\nelse {\n    System.out.println( “Correct... My\
  \ number is ” + num + “\\n” ) ;\n    flag = false ;\n}\n```\n\n![image](img/image00407.jpeg)\n\
  \n![image](img/image00408.jpeg)\n\n创建 Java 程序需要 Java 开发包 (JDK)。它可以从 `[oracle.com](http://oracle.com)`\
  \ 免费获取，并包含命令行 Java 编译器 (`javac.exe`)。在此处的命令中 `javac` 调用 `Guess.java` 源代码的编译器，并自动输出名为\
  \ `Guess.exe` 的可执行文件。然后可以使用 `java` 命令通过 JRE 运行。\n\n## Java 猜数字游戏 – 程序比较\n\n- 输入输出和随机数函数在\
  \ Java 程序中无需导入语句即可可用\n- Java 程序始终有一个类结构，封装着一个 `main()` 函数，该函数在程序运行时会被自动调用\n- Java\
  \ 程序中的语句被被分组在 `{ }` 大括号内\n\n\n\n\n\n- `Java` 中的变量不是弱类型类型，因此它们的数据类型（例如 `boolean`）必须在声明时定义。\n\
  - `Java` 中每条语句的末尾必须用分号 `;` 表示——制表符和空格并不相关。\n- `Java` 程序中的控制结构使用 `if`、`else` 和 `while`\
  \ 关键字——这与 Python 程序的方式非常相似。\n\n## 总结\n\n- 现代编程语言（如 `Python` 或 `C`）提供了从低层机器码到高层的抽象。\n\
  - 人类可读的高级源代码可以通过解释器或编译器渲染成低层机器码。\n- 解释型编程语言（如 `Python`）将源代码翻译成字节码，然后通过其虚拟机字节码解释器执行字节码。\n\
  - 编译型编程语言（如 `C`）生成中间对象代码，该代码随后被组合成机器码，然后可以直接在计算机上执行。\n- `C` 程序的编译将高级源代码翻译成低层汇编语言，然后翻译成机器码。\n\
  - 编译过程中生成的中间文件通常会由编译器自动删除。\n- `Python` 中使用的数据结构和控制结构也存在于 `C`、`C++`、`C#` 和 `Java`\
  \ 语言中——因此编程技能可以在语言之间迁移。\n- 编译型编程语言（如 `C`）有一个 `main` 函数，它在程序运行时会被自动调用。\n- 许多编程语言中的语句分组在\
  \ `{ }` 大括号内并必须以分号 `;` 结束。\n- 强类型变量编程语言要求在变量声明中定义变量可能包含的数据类型，例如整数 `int`。\n- 与 `Python`\
  \ 类似，其他编程语言也可以从库中导入功能。\n- `C#` 程序需要安装通用语言运行时 (`CLR`）以便在运行时生成机器码。\n- `Java` 程序需要安装\
  \ Java 运行时环境 (`JRE`）以便在运行时生成机器码。\n\n![image](img/image00411.jpeg)\n![image](img/image00412.jpeg)\n\
