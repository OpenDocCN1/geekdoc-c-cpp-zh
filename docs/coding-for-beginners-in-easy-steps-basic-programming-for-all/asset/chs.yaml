  \ pet )\n```\n\n![image](img/image00299.jpeg)\n保存并运行这些程序 – 查看来自导入函数的输出\n\n![image](img/image00301.jpeg)\n\
  \n![image](img/image00188.jpeg)\n\n`fido.py`\n\n![image](img/image00194.jpeg)\n\n\
  对于较大的程序，你可以将模块导入到其他模块中以构建模块层次结构。\n\n## 总结\n\n- 函数使用 `def` 关键字后跟你选择的名称和 `()` 括号来定义。\n\
  - 函数定义行必须以冒号 `:` 结尾，当函数被调用时执行的语句块必须在行行下方缩进。\n- 具有全局作用域的变量可以在程序的任何地方被引用。\n- 具有局部作用域的变量只能在声明它的函数内部被引用。\n\
  - 通过首先使用 `global` 关键字声明局部变量，可以强制将其转变为全局可用。\n- 函数参数是仅在函数内部使用的特殊变量，而参数是传递给参数的数据值。\n\
  - 参数在函数定义的括号内被声明为由逗号分隔的列表。\n- 除非在声明中指定了默认值，否则函数调用必须为每个函数参数提供参数数据。\n- 在函数调用中传递给参数的数据顺序必须与参数的顺序相同，除非指定了它们的名称。\n\
  - 可选地，可以在函数内部使用 `return` 关键字向调用者返回值。\n- 函数可以存储在模块中，模块命名为不带 `.py` 后缀的文件名。\n- `import`\
  \ 语句通过在模块名后添加点后缀名称来使模块函数在程序中可用。\n- 在内部，每个 Python 模块都有自己的符号表，因此不同模块中的同名函数不会发生冲突。\n\
  - `from` 导入语句使模块函数在程序可用，而无需为它们的名称添加点后缀。\n- `import *` 语句可将模块函数导入到程序自身的符号表中。\n\n\
  7\n\n## 排序算法\n\n本章演示了如何编写各种排序算法指令序列。\n\n- 复制排序\n- 选择排序\n- 插入排序\n- 冒泡排序\n- 合并排序\n\
  - 分区排序\n- 总结\n\n### 复制排序\n\n“算法”是执行特定任务的定义良好的指令序列。每个算法接受一个或多个值作为输入，并产生一个或多个结果值作为输出。\n\
  \n算法可以在代码中创建为函数，其语句定义了执行任务的指令序列。输入值可以作为参数传递给函数调用，结果值可以作为函数的输出返回。可以使用多种方式使用数据结构和控制结构对算法进行编码，以执行列表排序等任务。\n\
  \n![image](img/image00302.jpeg)\n\nPython 为列表提供了 `sort()` 方法（描述见此处），但本章的示例演示了如何编写在许多编程语言中常见的各种排序算法。\n\
  \n排序效率可能取决于待排序列表的性质，因此不同的算法可能最适合特定的任务。当需要对列表进行排序同时保持原始未排序列表完整时，可以将列表的引用作为输入参数传递给算法函数。该函数可以创建原始列表的副本，将副本的元素排序，然后将排序后的副本列表作为输出返回。这种算法简单是将元素值从原始列表复制到新列表数组，然后按升值顺序进行排列。\n\
  \n![image](img/image00303.jpeg)\n\n![image](img/image00193.jpeg)\n\n数组元素从零开始编号。在这里，元素\
  \ `[0]` 包含 5，元素 `[1]` 包含 3，依此类推。\n\n![image](img/image00188.jpeg)\n\n`copy.py`\n\
  \n![image](img/image00304.jpeg)声明一个函数接收列表引用作为输入并返回排序后的副本作为输出来启动新程序\n\n```python\n\
  def copy_sort( array ) :\ncopy = array[ ]\nsorted_copy = [ ]\n# 在处添加算法序列。\nreturn\
  \ sorted_copy\n```\n\n![image](img/image00305.jpeg)接下来，添加缩进序列将复制的元素插入空列表\n\n```python\n\
  while len( copy ) > 0 :\nminimum = 0\nfor element in range( copy ) :\nif copy[ element\
  \ ] < copy[ minimum ] :\nminimum = element\nsorted_copy.append( copy.pop( minimum\
  \ ) )\n```\n\n![image](img/image00306.jpeg)现在，添加语句创建未排序列表\n\n```python\narray =\
  \ [ 5 , 3 , 1 , 2 , 4 ]\nprint( ‘Copy...\\nArray :’ )\n```\n\n![image](img/image00307.jpeg)最后，添加语句显示未排序列表及其排序副本，然后保存并运行程序\
  \ – 查看原始列表保持未排序顺序\n\n```python\nprint( ‘Copy :’ , copy_sort( array ) )\nprint( ‘Array\
  \ :’ )\n```\n\n![image](img/image00308.jpeg)\n\n![image](img/image00194.jpeg)\n\
  从列表中弹出弹出值以构建排序版本\n\n### 选择排序\n\n通常你想原地排序未排序列表的元素，而不是排序原始列表的副本，正如前面的示例所示。有几种常用的算法可以原地排序数组，每种算法都有自己的优缺点。\n\
  \n“选择排序”算法检查数组未排序部分的每个元素，并选择包含最低值的元素。然后将该元素值与未排序部分起始的元素值进行交换 – 从而增加数组排序部分的大小并缩小其未排序部分。重复此过程直到所有元素值按顺序排序。选择排序是一种基于交换的简单算法，相对容易理解和编码为函数算法。它是排序\
  \ 20 个元素左右的小数组的两种高效算法之一。\n\n![image](img/image00309.jpeg)\n\n![image](img/image00194.jpeg)\n\
  在这个示例中，当倒数第二个元素被排序时，最后一个元素已经包含了最大值。\n\n![image](img/image00188.jpeg)\n\n`selection.py`\n\
  \n![image](img/image00304.jpeg)声明一个函数接收列表引用作为输入并开始循环以存储每个元素的值和当前索引号\n\n```python\n\
  def selection_sort( array ) :\nfor index in range( 0 , len( array ) -1 ) :\nvalue\
  \ = array[ index ]\ncurrent = index\n# 在处添加算法序列。\n```\n\n\n\n\n\n```python\nprint(\
  \ ‘\\tResolving element[‘ , index , ‘] to ‘ , array )\n```\n\n![image](img/image00306.jpeg)现在，添加语句来创建并显示一个未排序列表\n\
  \n```python\narray = [ 5 , 3 , 1 , 2 , 6 , 4 ]\n```\n\n```python\nprint( ‘Selection\
  \ Sort...\\nArray :’ , array )\n```\n\n![image](img/image00307.jpeg)最后，添加语句调用算法函数并再次显示列表——以查看原地排序后的列表\n\
  \n```python\nselection_sort( array )\nprint( ‘Array :’ , array )\n```\n\n![image](img/image00310.jpeg)\n\
  \n![image](img/image00193.jpeg)\n\n原地排序会交换原始引用数组列表中包含的元素值。\n\n### 插入排序\n\n在前一个示例中展示的这种使用选择排序算法交换元素的技术效果良好，但也可以采用另一种技术，简单地将元素插入到数组列表中正确的升序位置。\n\
  \n“插入排序”算法会检查数组列表中未排序部分的下一个元素，并在需要时将该元素插入到数组列表中正确的升序位置。为了容纳插入的元素，列表未排序部分的所有其他元素都会向右移动——增加数组已排序部分的大小并减小其未排序部分。此过程对每个元素轮流重复，直到所有元素值都按升序排序。\n\
  \n插入排序是一种简单的算法，相对容易理解并可以编写为函数算法。与选择排序算法一起，它是处理约 20 个左右元素的小数组排序时最高效的两种算法之一。通常，插入排序所需的比较次数比选择排序少，因此通常被视为排序小数组的最佳方法。\n\
  \n![image](img/image00311.jpeg)\n\n![image](img/image00193.jpeg)\n\n在这个示例中，需要两个步骤将最低值放入第一个元素中——因为\
  \ 3 小于 5，然后 1 小于 3。\n\n![image](img/image00188.jpeg)\n\ninsertion.py\n\n![image](img/image00304.jpeg)通过声明一个接收列表引用作为输入的函数来启动一个新程序，并开始一个循环来存储当前元素的值\n\
  \n```python\ndef insertion_sort( array ) :\n    for index in range( 1 , len( array\
  \ ) ) :\n        value = array[ index ]\n        # Algorithm sequence to be added\
  \ here.\n        print( ‘\\tResolving element[‘ , index , ‘] to ‘ , array )\n```\n\
  \n![image](img/image00305.jpeg)接下来，添加算法序列，如果当前值小于当前元素中的值，则重复插入当前值\n\n```python\n\
  while array[ index-1 ] > value and index >= 1 :\n    array[ index ] = array[ index-1\
  \ ]\n    index -=1\n    array[ index ] = value\n```\n\n![image](img/image00306.jpeg)现在，添加语句来创建并显示一个未排序列表\n\
  \n```python\narray = [ 5 , 3 , 1 , 2 , 6 , 4 ]\nprint( ‘Insertion Sort...\\nArray\
  \ :’ , array )\n```\n\n![image](img/image00307.jpeg)最后，添加语句调用算法函数并再次显示列表——以查看原地排序后的列表\n\
  \n```python\ninsertion_sort( array )\nprint( ‘Array :’ , array )\n```\n\n![image](img/image00194.jpeg)\n\
  \n在某些迭代中，该算法识别出“未排序”部分的元素在之前的插入后已经是排序状态的。\n\n### 冒泡排序\n\n“冒泡排序”算法是选择排序和插入排序技术的进一步的简单替代方案。该算法反复检查数组列表中的每一对相邻元素，并在需要时交换它们的位置，以将较低值放在较高值之前——直到所有元素都按升序排序。\n\
  \n冒泡排序是一种简单的算法，非常容易理解并编写为函数算法。虽然冒泡排序技术的效率通常低于插入排序或选择排序，但它是处理近乎有序数组时最快的算法之一。\n\n\
  ![image](img/image00312.jpeg)\n\n![image](img/image00193.jpeg)\n\n在这个示例中，第一轮通过时对元素\
  \ [3] 和 [4] 不需要交换，因为它们的值 5 和 6 顺序正确。\n\n![image](img/image00188.jpeg)\n\nbubble.py\n\
  \n![image](img/image00304.jpeg)通过声明一个接收列表引用作为输入的函数来启动一个新程序，并开始一个外层循环反复遍历数组列表\n\n\
  ```python\ndef bubble_sort( array ) :\n    for index in range( len( array ) ) :\n\
  \        # Algorithm sequence to be added here.\n```\n\n![image](img/image00305.jpeg)接下来，添加算法序列遍历数组元素，直到倒数第二个元素，如果下一个值大于当前值，则交换值\n\
  \n```python\nfor element in range( len( array -1 ) - index ) :\n    if array[ element\
  \ ] > array[ element+1 ] :\n        array[ element ] , array[ element+1 ] = array[\
  \ element+1 ] , array[ element ]\n```\n\n```python\nprint( ‘\\tResolving element[‘\
  \ , element , ‘] to ‘ , array )\n```\n\n![image](img/image00306.jpeg)现在，添加语句来创建并显示一个未排序列表\n\
  \n```python\narray = [ 5 , 3 , 1 , 2 , 6 , 4 ]\nprint( ‘Bubble Sort...\\nArray :’\
  \ , array )\n```\n\n![image](img/image00307.jpeg)最后，添加语句调用算法函数并再次显示列表——以查看原地排序后的列表\n\
  \n```python\nbubble_sort( array )\nprint( ‘Array :’ , array )\n```\n\n![image](img/image00313.jpeg)\n\
  \n![image](img/image00194.jpeg)\n\n在平均情况下，插入排序优于选择排序，而选择排序优于冒泡排序。\n\n### 合并排序\n\n\
  虽然简单的选择排序、插入排序和冒泡排序在小数组上效果良好，但更高效复杂的算法在较大的列表中表现更好。“合并排序”算法采用“分治”策略，首先将数组分为左右子部分，直到它们为空或仅有一个元素。一旦划分完成，所有子部分都是单个元素。算法随后将这些元素合并成一个排序后的列表。\n\
  \n合并排序是一种复杂的算法，可以编写为函数，通过递归调用反复划分数组然后将其合并为有序顺序。\n\n![image](img/image00314.jpeg)\n\
  \n![image](img/image00193.jpeg)在这个示例中，数组很小，但合并排序算法以相同的方式划分并重新组合大型数组。\n\n![image](img/image00304.jpeg)通过声明一个接收列表引用的函数来启动一个新程序并反复遍历数组\n\
  \n```python\ndef merge_sort( array ) :\n    if len( array ) > 1 :\n        middle\
  \ = int( len( array ) / 2 )\n        left = array[ 0 : middle ] ; right = array[\
  \ middle : ]\n        print( ‘\\tSplit to’ , left , right )\n        merge_sort(\
  \ left ) ; merge_sort( right )\n        # Algorithm sequence to be added here.\n\
  ```\n\n![image](img/image00188.jpeg)\n\nmerge.py\n\n![image](img/image00305.jpeg)接下来，添加算法序列将数组元素分为子部分然后合并在一起\n\
  \n```python\n    i = j = 0\n    for element in range( len( array ) ) :\n       \
  \ L = left[ i ] if i < len( left ) else None\n        R = right[ j ] if j < len(\
  \ right ) else None\n        if( ( L and R ) and ( L < R ) ) or R is None :\n  \
  \          array[ element ] = L ; i += 1\n        elif( ( L and R ) and ( L >= R\
  \ ) ) or L is None :\n            array[ element ] = R ; j += 1\n        print(\
  \ ‘\\t\\tMerging’ , left , right )\n```\n\n![image](img/image00306.jpeg)现在，添加语句创建并显示数组列表\n\
  \n```python\narray = [ 5 , 3 , 1 , 2 , 6 , 4 ]\nprint( ‘Merge Sort...\\nArray :’\
  \ , array )\nmerge_sort( array )\nprint( ‘Array :’ , array )\n```\n\n![image](img/image00315.jpeg)\n\
  \n\n\n\n\n此处列出的代码使用分号 `;` 分隔符在某些行中编写了两个语句 – 这仅由于页面限制。\n\n## 分区排序\n\n在前述示例中演示了通过归并排序算法围绕数组中点将数组列表划分为子部分的技术，这种方法运行良好，但也可以采用另一种技术来围绕“基准值”（pivot）点对数组列表进行分区。\n\
  \n“快速排序”算法是一种复杂的排序算法，它也采用了“分治”策略。该算法首先指定一个特定的数组元素，其值将作为 `pivot`。然后，算法反复地将数组划分为两个“分区”——一个分区包含小于基准值的数值，另一个分区包含大于基准值的数值。一旦分区操作完成，最终的基准值就处于了正确的位置，因此算法随后将较小的分区与基准值以及较大的分区合并成一个单一的排序后列表。\n\
  \n快速排序是一种复杂的算法，可以被编写为函数算法，通过“递归”调用来重复地划分数组。快速排序是一种快速算法，在将元素划分为分区时会比较元素的值。\n\n![image](img/image00316.jpeg)\n\
  \n![image](img/image00193.jpeg)\n\n在这个示例中，数组很小，但快速排序算法以完全相同的方式高效地对大型数组进行分区然后重组。\n\
  \n对于在快速排序算法中选择哪个元素作为基准值最佳，意见不一。有些程序员喜欢选择中间元素，如前一个示例中的归并排序算法。另一些人倾向于选择第一个或最后一个元素，或者中间某个任意位置的元素\
  \ – 如对应的示例所示。\n\n![image](img/image00304.jpeg)通过声明一个函数接收列表引用并反复遍历数组列表来启动新程序\n\n\
  ```python\ndef quick_sort( array ) :\nif len( array ) > 1 :\n    pivot = int( len(\
  \ array ) -1 )\n    less = [ ] ; more = [ ]\n    # 此处应添加算法序列。\n    quick_sort( less\
  \ ) ; quick_sort( more )\n    print( ‘\\tLess:’ , less , ‘\\tPivot:’ , array[ pivot\
  \ ] , \\\n    ‘\\tMore:’ , more )\n    array[ : ] = less + [ array[ pivot ] ] +\
  \ more\nprint( ‘\\t\\t...Merged:’ , array )\n```\n\n![image](img/image00188.jpeg)\n\
  \nquick.py\n\n![image](img/image00305.jpeg)接下来，添加算法序列将数组列表元素划分为分区然后将合并在一起\n\n```python\n\
  for element in range( len( array ) ) :\n    value = array[ element ]\n    if element\
  \ != pivot :\n        if value < array[ pivot ] :\n            less.append( value\
  \ )\n        else :\n            more.append( value )\n```\n\n![image](img/image00306.jpeg)现在，添加语句创建并显示数组列表\n\
  \n```python\narray = [ 5 , 3 , 1 , 2 , 6 , 4 ]\nprint( ‘Quick Sort...\\nArray :’\
  \ , array )\nquick_sort( array )\nprint( ‘Array :’ , array )\n```\n\n![image](img/image00317.jpeg)\n\
  \n![image](img/image00194.jpeg)\n\n快速排序算法使用的内存比归并排序少，通常被认为是最好的排序算法。\n\n## 总结\n\n\
  - 算法是一系列为了执行特定任务而定义良好的指令\n- 每个算法都接受一个或多个值作为输入，并产生一个或多个结果值作为输出\n- 算法可以在代码中创建为函数，其语句定义了执行任务的指令序列\n\
  - 排序算法的效率可能取决于待排序列表的性质\n- 排序算法函数可以对作为输入的列表进行复制，并将该列表的排序后副本作为输出\n- 有几种流行的算法可以对数组列表进行原地排序，但每种算法都有自己的优缺点\n\
  - 选择排序算法反复选择数组列表未排序部分中的最低元素，并将其移动到该数组已排序部分的末尾\n- 插入排序算法反复获取数组列表未排序部分的下一个元素，并将其插入到数组已排序部分的正确位置\n\
  - 冒泡排序算法反复比较未排序数组列表中的相邻元素，并将它们交换为正确顺序\n- 选择排序、插入排序和冒泡排序是简单的比较算法，但速度相对较慢\n- 归并排序算法反复从数组中点将未排序数组列表划分为左、右子部分，然后将这些子部分合并成单一的排序后列表\n\
  - 快速排序算法反复将未排序数组列表划分为包含大于或小于基准值的分区，然后将这些分区合并成单一的排序后列表\n- 归并排序和快速排序算法都是快速的复杂算法，它们都分别采用了分治策略\n\
  \n8\n\n## 导入库\n\n*本章演示了如何将预定义的库功能编码到你的程序中*。\n\n- 检查 Python\n- 进行数学计算\n- 计算小数\n-\
  \ 告知时间\n- 运行计时器\n- 总结\n\n### 检查 Python\n\nPython 包含了 `sys` 和 `keyword` 模块，它们对于查询\
  \ Python 系统有用。`keyword` 模块包含了所有 关键字的列表，如果你想测试任何单词，它提供了 `iskeyword()` 函数。你可以使用交互模式帮助工具探索\
  \ `sys` 模块的许多功能。只需在 `>>>` 提示符处输入 `help()` 启动帮助系统，然后在出现的 `help>` 提示符处输入 `sys`。也许有用的是，`sys`\
  \ 模块的属性包含了 Python 版本号、解释器位置以及解释器寻找模块文件的目录列表 – 因此，如果你将模块文件保存在这些目录之一，可以确定解释器会找到它们。\n\
  \n```python\nimport sys , keyword\nprint( ‘Python Version:’ , sys.version )\nprint(\
  \ ‘Interpreter Location:’ , sys.executable )\nprint( ‘Python Search Path:’ )\nfor\
  \ folder in sys.path :\n    print( folder )\nprint( ‘Python Keywords:’ )\nfor word\
  \ in keyword.kwlist :\n    print( word )\n```\n\nPython 搜索路径的第一项是当前目录 – 因此该目录下或你创建的任何子目录下的文件都会被\
  \ Python 解释器找到。花点时间交互模式帮助工具发现更多关于 Python 的知识。\n\n### 进行数学计算\n\nPython 包含一个 `math`\
  \ 模块，在导入后提供了你可以使用的许多函数来执行数学过程。\n\n`math.ceil()` 和 `math.floor()` 函数允许程序对括号内指定的浮点值进行最接近整数取整\
  \ – `math.ceil()` 向上取整，`math.floor()` 向下取整，但返回的值虽然是整数，但它是浮点类型而非 `int` 类型。\n\n\n\n\
  \n`math.pow()` 函数需要两个参数来将指定的值提升到指定的幂。相比之下，`math.sqrt()` 函数仅需一个参数，并返回该指定值的平方根。这两个函数的结果都以\
  \ `float` 数据类型的数值形式返回。\n\n![image](img/image00193.jpeg)\n\n整数可以使用 `float()` 函数从\
  \ `int` 数据类型转换为 `float` 数据类型，并使用 `str()` 函数转换为 `string` 数据类型。\n\n典型的三角函数也可以使用 `math`\
  \ 模块中的函数来执行，例如 `math.sin()`、`math.cosin()` 和 `math.tan()`。\n\n此外，Python 还包含一个 `random`\
  \ 模块，一旦导入到程序中，就可以用来生成伪随机数。\n\n`random.random()` 函数产生一个 0 到 1.0 之间的单个浮点数。也许有趣的是，`random.sample()`\
  \ 函数会生成一个从序列中随机选择的元素列表。该方法需要两个参数：指定要从中选择的序列以及要生成的列表长度。由于 `range()` 函数返回一个数字序列，因此它可以作为\
  \ `random.sample()` 函数的第一个参数——这样它就会从该序列中随机选择数字，生成一个不重复数字的列表。\n\n![image](img/image00188.jpeg)\n\
