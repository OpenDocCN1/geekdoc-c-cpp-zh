  \ = ‘A Cat’ ) :\nprint( pet , ‘Sleeps By The Fire’ )\n```\n\n![image](img/image00289.jpeg)现在将文件保存为“cat.py”，这样模块名为“cat”\n\
  \n![image](img/image00290.jpeg)使用一个语句使“cat”模块函数可用以启动新程序\n\n```\nimport cat\n```\n\
