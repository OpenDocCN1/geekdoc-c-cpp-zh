  \ IDLE 编辑窗口，然后输入此代码请求输入以初始化变量\n\n```python\nname = input( ‘Please enter your name:\
  \ ‘ )\n```\n\n![image](img/image00226.jpeg)接下来，添加一条语句输出字符串和存储的变量值\n\n```python\n\
  print( ‘Hello’ , name )\n```\n\n![image](img/image00227.jpeg)现在，添加语句输出一个字符串，然后再次输出字符串和存储的变量值\n\
  \n```python\nprint( ‘Welcome to Coding for Beginners’ )\nprint( ‘Remember to have\
  \ fun’ , name , ‘!’ )\n```\n\n![image](img/image00228.jpeg)保存然后运行程序，在要求时输入名字并按 Return，即可在输出中看到你的名字\n\
