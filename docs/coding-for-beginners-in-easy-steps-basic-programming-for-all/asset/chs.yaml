  \n![image](img/image00296.jpeg)\n\n![image](img/image00215.jpeg)\n\n记住用户输入是以 `str`\
  \ 数据类型读取的——因此在进行算术运算时必须转换为 `int` 或 `float` 数据类型。\n\n## 存储函数\n\n函数定义可以很有用地存储在一个或多个独立文件中，以便于维护，并允许它们在多个程序中使用，而无需将定义复制到每个程序中。每个存储函数定义的\
  \ Python 文件被称为“模块”（module），模块名是不带 `.py` 扩展的文件名。\n\n存储在模块中的函数可以通过 Python 的 `import`\
  \ 关键字后跟模块名来供程序使用。虽然不是必须的，但习惯上是将任何 import 语句放在程序的开头。\n\n导入的函数可以使用“模块名.函数名”的形式进行调用。例如，可以从名为“ineasy”的导入模块中调用“steps”函数，方式为\
  \ `ineasy.steps()`。\n\n当模块中的函数包含参数时，在定义中为参数分配默认值通常是很有用的。这使得函数变得更加灵活，因为在调用时指定参数值就变成了可选的。\n\
  \n![image](img/image00188.jpeg)\n\ncat.py\n\n![image](img/image00287.jpeg)通过定义一个函数为其参数提供默认字符串值用于显示，从而启动一个新模块\n\
  \n```\ndef purr( pet = ‘A Cat’ ) :\nprint( pet , ‘Says MEOW!’ )\n```\n\n![image](img/image00288.jpeg)接下来，再添加两个函数定义，也为它们的参数提供默认字符串值用于显示\n\
