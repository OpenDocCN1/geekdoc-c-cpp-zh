  \ 上发现更多信息\n\n## 总结\n\n- `tkinter` 模块可以导入到 Python 程序中，为窗口应用程序提供属性和方法\n- 每一个 `tkinter`\
  \ 程序都必须从调用 `Tk()` 开始以创建一个窗口，并调用其 `mainloop()` 方法来捕获事件\n- 窗口对象的标题通过其 `title()` 方法指定\n\
  - `label` 组件通过指定其父容器的名称和文本作为参数传递给 `Label()` 构造函数来创建\n- 使用 `pack()`、`grid()` 或 `place()`\
  \ 几何布局管理器可以将组件添加到应用程序中\n- `button` 组件通过指定其父容器的名称、文本以及用户点击时调用的函数名称作为参数传递给 `Button()`\
  \ 构造函数来创建\n- `tkinter.messagebox` 模块可以导入到 Python 程序中，为消息框提供属性和方法\n- 请求用户做出选择的消息对话框会向程序返回一个值，用于条件分支\n\
  - `Frame()` 构造函数创建一个容器，在其中多个组件可以被组合在一起以实现更好的定位\n- `Entry()` 构造函数创建一个单行文本字段，其当前内容可以通过\
  \ `get()` 方法获取\n- 通过其 `insert()` 方法将项添加到 `Listbox` 对象中，并通过指定索引号传递给 `get()` 方法来获取\n\
  - `Radiobutton` 和 `Checkbutton` 对象将值存储在由其变量属性指定的 `StringVar` 或 `IntVar` 对象中\n- `PhotoImage()`\
  \ 构造函数创建一个图像对象，该对象具有一个 `sample()` 方法，可以缩小图像\n- 图像可以添加到 `Button` 和 `Label` 对象中，嵌入\
  \ `Text` 对象中，并绘制在 `Canvas` 对象上\n\n12\n\n## 开发应用程序\n\n*本章结合了之前的章节元素来开发一个窗口应用程序*\n\
  \n- 生成随机数\n- 规划需求\n- 设计布局\n- 分配静态变量\n- 加载动态数据\n- 添加功能\n- 测试程序\n- 部署应用程序\n- 总结\n\n\
  ## 生成随机数\n\n在本书后续页面中开发的图形化应用程序将在特定范围内生成六个随机数。最初，它的功能可以先开发为控制台应用程序，稍后转换以说明它可以如何应用于图形化组件组件。\n\
  \nPython 标准库有一个 `random` 模块，它提供了生成伪随机数的方法。每当初始化随机生成器时，默认都会使用当前系统时间作为“种子” – 这样它就不会重复其选择。\n\
  \n通过调用 `random` 模块中的 `random()` 方法可以生成一个从 0.0 到 1.0 之间的伪随机浮点数。生成的数字范围可以使用 `*` 乘法运算符修改以指定最大值，并可以使用内置\
  \ `int()` 函数向下取整为整数值。例如，生成 0 到 9 范围内的整数：\n\n```\nint( random.random() * 10 )\n```\n\
  \n或者生成 1 到 10 范围内的整数：\n\n```\nint( random.random() * 10 ) + 1\n```\n\n![image](img/image00215.jpeg)\n\
  \n通过内置 `int()` 函数从 `float` 数据类型转换为 `int` 数据类型的浮点数会在小数点处被截断。\n\n该语句可以在循环中使用，以在给定范围内生成多个随机整数，但输出中的任何数字都可能重复\
  \ – 无法保证唯一性。相反，可以通过 `random` 模块中的 `sample()` 方法在给定范围内生成多个唯一的随机整数。这需要两个参数来指定范围和要返回的唯一整数数量。使用内置的\
  \ `range()` 函数来指定最大值非常方便。例如，生成 1 到 9 范围内的六个唯一数字：\n\n```\nrandom.sample( range( 10\
  \ ) , 6 )\n```\n\n或者生成 1 到 10 范围内的六个唯一数字：\n\n```\nrandom.sample( range( 1 , 11 )\
  \ , 6 )\n```\n\n这种技术可以代表一个随机彩票条目，例如在 1 到 49 之间选择六个唯一的数字。\n\n![image](img/image00375.jpeg)\n\
  \n`range()` 函数可以指定起始和结束值。如果不提供起始值，默认假设为零。\n\n![image](img/image00188.jpeg)\n\nsample.py\n\
  \n![image](img/image00270.jpeg)\n\n从“random”模块导入两个函数启动新程序\n\n```\nfrom random import\
  \ sample\n```\n\n![image](img/image00271.jpeg)\n\n接下来，将随机浮点数赋值给变量并显示其值\n\n```\n\
  num = random()\nprint('Random Float 0.0-1.0 : ', num)\n```\n\n![image](img/image00272.jpeg)\n\
  \n现在将浮点数相乘并转换为整数后显示其值\n\n```\nnum = int( num * 10 )\nprint('Random Integer 0 - 9\
  \ : ', num)\n```\n\n![image](img/image00273.jpeg)\n\n添加循环将多个整数添加到列表中，然后显示列表\n\n\
  ```\nnums = [] ; i = 0\nwhile i < 6 :\n    nums.append( int( random() * 10 ) + 1\
  \ )\n    i += 1\nprint('Random Integers 1-10 : ', nums)\n```\n\n![image](img/image00276.jpeg)\n\
  \n最后，将唯一的整数赋值给列表并显示列表\n\n```\nnums = sample( range( 1, 49 ) , 6 )\nprint('Random\
  \ Sample 1 - 49 : ', nums)\n```\n\n![image](img/image00277.jpeg)保存文件并运行程序几次 – 查看生成的数字\n\
  \n![image](img/image00374.jpeg)\n\n`random.sample()` 函数返回一个列表，但不会实际替换指定范围内的元素。\n\
  \n![image](img/image00194.jpeg)\n\n## 规划需求\n\n在创建新的图形化应用程序时，先花时间规划设计是有用的。明确定义程序的精确目的，决定需要哪些应用程序功能，然后决定需要哪些界面组件。\n\
  \n![image](img/image00376.jpeg)\n\n一个彩票条目的简单应用程序计划可能如下：\n\n**程序目的**\n\n- 程序将在 1-49\
  \ 范围内生成一组六个随机数，并具有重置的能力\n\n**所需的功能**\n\n- 生成并显示六个唯一随机数的函数\n- 清除显示器上最后六个随机数的函数\n\n\
  **需要的界面组件**\n\n- 一个不可调整大小的窗口，包含所有其他组件并显示应用程序标题。\n- 一个 Label 组件，用于显示静态应用程序 Logo –\
  \ 只为了增强界面外观。\n- 六个 Label 组件，用于动态显示生成的唯一随机数序列 – 每个 Label 显示一个数字。\n- 一个 Button 组件，当用户点击时生成并显示\
  \ Label 组件中的数字。当数字显示时，该按钮将被禁用。\n- 一个 Button 组件，当用户点击时清除 Label 组件中显示的数字。当数字未显示时，该按钮将被启用。\n\
  \n\n\n\n\n![image](img/image00194.jpeg)\n\n将 `Button` 部件的 `state` 属性从 `NORMAL` 切换为\
  \ `DISABLED` 以引导用户——在这种情况下，在生成后续系列唯一随机数之前，必须重置应用程序。\n\n![image](img/image00188.jpeg)\n\
  \n`lotto(widgets).py`\n\n![image](img/image00270.jpeg)通过从 `tkinter` 模块导入所有功能启动一个新程序\n\
  \n# Widgets\n\n```python\nfrom tkinter import *\n```\n\n![image](img/image00271.jpeg)接下来，添加语句创建窗口对象和图像对象\n\
  \n```python\nwindow = Tk()\nimg = PhotoImage( file = ‘lotto.gif’ )\n```\n\n![image](img/image00373.jpeg)\n\
  \n`lotto.gif`\n\n![image](img/image00272.jpeg)现在，添加语句创建所有必要的部件\n\n```python\nimgLbl\
  \ = Label( window, image = img )\nlabel1 = Label( window, relief = ‘groove’, width\
  \ = 2 )\nlabel2 = Label( window, relief = ‘groove’, width = 2 )\nlabel3 = Label(\
  \ window, relief = ‘groove’, width = 2 )\nlabel4 = Label( window, relief = ‘groove’,\
  \ width = 2 )\nlabel5 = Label( window, relief = ‘groove’, width = 2 )\nlabel6 =\
  \ Label( window, relief = ‘groove’, width = 2 )\ngetBtn = Button( window )\nresBtn\
  \ = Button( window )\n```\n\n![image](img/image00273.jpeg)然后，使用 grid 布局管理器将部件添加到窗口中——准备好在下一个设计阶段接收参数以指定部件应如何定位\n\
