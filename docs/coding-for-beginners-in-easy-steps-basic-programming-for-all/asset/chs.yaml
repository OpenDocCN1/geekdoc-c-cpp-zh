  \ | **比较性测试:** |\n| :--- | :--- |\n| `==` | 等于 |\n| `!=` | 不等于 |\n| `>` | 大于 |\n\
  | `<` | 小于 |\n| `>=` | 大于等于 |\n| `<=` | 小于等于 |\n\n`==` 等于运算符比较两个操作数，如果两者的值相等，它将返回\
  \ `True`，否则它将返回 `False` 值。如果两者都是相同的数字，则它们相等等的；如果两者都是字符，则通过对它们的 ASCII 码进行数值比较来获得比较结果。\n\
  \n相反，`!=` 不等于运算符当两个操作数不相等时返回 `True`，其使用的规则与 `==` 等于运算符相同，否则返回 `False`。相等和不等于运算符对于测试两个变量的状态非常有用，以便根据结果在程序中执行条件分支。\n\
  \n`>` “大于”运算符比较两个操作数，如果第一个的值大于第二个，则返回 `True`；如果它的值等于或小于第二个，则返回 `False`。`<` “小于”运算符执行相同的比较，但如果第一个操作数的值小于第二个的，则返回\
  \ `True`，否则返回 `False`。`>` “大于”或 `<` “小于”运算符经常用于测试循环中计数器的值。\n\n在 `>` “大于”或 `<` “小于”运算符后添加\
  \ `=` 运算符可以使其在两个操作数值完全相等时也返回 `True`。\n\n![image](img/image00194.jpeg)\n\nA-Z 大写字母的\
