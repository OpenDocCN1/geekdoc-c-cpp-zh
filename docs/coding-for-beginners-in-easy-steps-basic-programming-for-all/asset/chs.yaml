  \ `nonlocal` 关键字进行处理。\n\n### 添加参数\n\n在程序中定义自定义函数时，你可以在函数的括号之间可选地指定一个“参数”名称。然后可以通过在函数调用的括号中指定值，将“参数”值传递给该参数。函数现在可以在执行期间通过参数名称引用它来使用该传递的值。例如，定义一个接受参数并打印的函数：\n\
  \n```python\ndef echo(user):\n    print('User:', user)\n```\n\n![image](img/image00193.jpeg)\n\
  \n参数是仅供函数内部使用的特殊变量——它们必须遵守与普通变量相同的命名规则。\n\n调用此函数必须指定一个参数值传递给其括号中的参数，这样才能将其打印出来：\n\
  \n```python\necho('Mike')\n```\n\n可以在函数定义中指定多个参数，方法是在函数括号内包含一个由逗号分隔的参数名称列表：\n\n\
  ```python\ndef echo(user, lang, sys):\n    print('User:', user, 'Language:', lang,\
  \ 'Platform:', sys)\n```\n\n调用定义中指定了参数的函数时，调用包含的参数数量必须与参数数量相同。例如，使用多个参数调用此示例：\n\n\
  ```python\necho('Mike', 'Python', 'Windows')\n```\n\n传递的值必须按照参数列表相同的顺序出现，除非调用者也像这样指定参数名称：\n\
  \n```python\necho(lang='Python', user='Mike', sys='Windows')\n```\n\n在定义函数时，可以在参数列表中可选地指定一个默认值。当调用者为该参数指定一个值时，该值将被覆盖，但当调用者没有传递参数值时，函数将使用该值：\n\
  \n```python\ndef echo(user, lang, sys='Linux'):\n    print('User:', user, 'Language:',\
  \ lang, 'Platform:', sys)\n```\n\n这意味着你调用函数传递的值可以少于参数数量以使用默认值，或者传递与参数数量相同的值来覆盖它。\n\
  \n![image](img/image00294.jpeg)\n\n将参数命名为变量以使数据移动清晰可见。\n\n`param.py`\n\n![image](img/image00287.jpeg)通过定义一个具有三个参数的函数开始一个新程序，该函数将打印传入的参数值\n\
