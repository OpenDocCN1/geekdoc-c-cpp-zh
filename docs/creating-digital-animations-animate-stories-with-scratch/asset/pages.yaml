- pgno: 60
  md: '# QUICK CHARACTER

    IMPROVEMENTS


    If you simply must spend a bit more time working on your characters, here are
    some tips that might help:


    +   - **Compare to other animation characters:** Spend a few minutes reviewing
    a few of your favorite characters from animated films or shows with a critical
    eye. What details help distinguish one character from another?

    +   - **Add texture:** Bring your design skills to clothing by adding patterns,
    shapes, and texture. A few wavy lines can also make for a better hairstyle.

    +   - **Add a more striking pose:** Rather than just having your characters stand
    around, experiment with more dramatic poses, which helps you express their personalities.

    +   - **Add drama:** Choose a specific scene from the story you have in mind and
    adjust the characters’ poses and expressions to match the tone and mood you want
    to express.


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_60_0.png)'
  merge: -1
  img_proc: true
