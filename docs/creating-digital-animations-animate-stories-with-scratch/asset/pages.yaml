- pgno: 35
  md: "```\n~~~scratch\nwhen green flag clicked\nswitch costume to [sleep v]\nwait\
    \ 2 secs\nswitch costume to [wake v]\nwait 2 secs\nrepeat 3\n    switch costume\
    \ to [wag v]\n    wait 0.25 secs\n    switch costume to [wake v]\n    wait 0.25\
    \ secs\n~~~\n```\n\n# ## TALK LIKE A MAN\n\nThe characters are stick figures,\
    \ so I think it works best to “stick” (pretty hilarious, right?) to speech bubbles,\
    \ rather than recorded sounds and voices. (You use digital audio in Project 4.)\
    \ You could draw a speech bubble into a new costume or make a separate sprite,\
    \ but I find using the SAY blocks easier.\n\nI want my figure to speak WHILE doing\
    \ jumping jacks. If I put a SAY block inside the REPEAT block, Sticky will keep\
    \ saying the same thing over and over until the last jumping jack is finished.\n\
    \nWhat is a poor little animator to do?\n\nScratch can have different chunks of\
    \ code running at the same time on different sprites and even within the same\
    \ sprite. This means you can keep your current gliding and jumping jacks code\
    \ blocks on the stick figure, add a second WHEN GREEN FLAG"
  merge: -1
  img_proc: true
