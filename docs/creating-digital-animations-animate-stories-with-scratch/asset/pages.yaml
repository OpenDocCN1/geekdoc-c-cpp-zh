- pgno: 108
  md: '# CAMERA (OR WHAT DO I FOCUS ON?)


    Have you noticed how animators alternate between wide shots that show you the
    entire scene and close-ups that may show only part of a character (most frequently,
    the face)?


    In the following three images, I used the SET SIZE TO block to change the size
    of *Hector*, the window, and the couch from 100% to 250% to 500%:


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_108_0.png)


    Wait a minute! Why is there so little difference between the size of *Hector*''s
    face in the second and third image? Scratch has limitations on how much you can
    increase a sprite size when using **LOOKS** blocks. Fortunately, I can make *Hector*
    even larger in the Paint Editor.


    # INCREASE THE COSTUME SIZE


    You can increase the size of a character''s costume by grouping the shapes and
    using the **Grow** tool near the very top of the Paint Editor. It is a good idea
    to duplicate a costume before changing its size so you can quickly switch back
    to its original size:


    +   1. Click the **Costumes** tab.

    +   2. Shift-click the current costume and choose **Duplicate**.'
  merge: -1
  img_proc: true
- pgno: 109
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 110
  md: 'A camera is capable of more than only zooming in and out on characters. Another
    frequently employed camera technique is to alternate views, such as seeing a character
    from the front or from the side.


    # ## CREATE A BACK VIEW OF CHARACTERS


    I ended Project 3 with *Zomberta’s* back to the viewer as she appeared to walk
    toward a camp cabin in the distance.


    The following sequence of images shows how I modified the sprite from a front
    view to a rear view by pulling the hair over her face and then sending her arms
    to the back layer.


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_110_0.png)


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_110_1.png)


    After you have a front and back view for each character, you can alternate between
    them during an encounter.


    If you don’t like having a blank wall behind *Zomberta*, you could try flipping
    the wall sprite so the window appears on the other side.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_111_0.png)


    # ## CREATE A SIDE VIEW OF CHARACTERS


    The most frequent use of a side view is for characters walking or running. Here''s
    how you could change *Hector* to a side view by using the **Reshape** tool:


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_111_1.png)


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_111_2.png)


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_111_3.png)


    You can spend days (even weeks) tweaking each character view. Scratch makes it
    easy to swap costumes later, so don''t spend too much time on views until you
    know your animation really needs each one.


    # ## ACTION! (OR LET''S GET THE STORY MOVING)


    It is finally time to bring your characters to life, tell your story, and impress
    your friends, family, and classmates. If you find yourself'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'getting frustrated, check out the credits from any animated film to remind
    yourself how many people come together to make an animated tale. If you enjoy
    one part of the process much more than another, perhaps it''s time to recruit
    a few collaborators.


    # ANIMATE SPRITE ENTERING THE SCENE


    To save a bit of time, I''m going to use the "cheap" walking technique, in which
    a character keeps facing the camera and bounces up and down:


    +   1. **Click and drag your sprite to the *ending position* on the Stage** (where
    you want the character to stop once on the Stage).

    +   2. **Click the Scripts tab.**

    +   3. **Drag the following blocks into the Scripts Area and change the values
    to better fit your sprite and scene:**


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_112_0.png)


    When you click the Green Flag button, you should notice that the character looks
    like it''s being pulled across the floor rather than walking.


    # ADD A (SLIGHTLY) MORE REALISTIC WALK


    When people walk, they do not just move horizontally across the floor. With each
    step, their entire bodies also move up and down. Replacing that GLIDE block with
    the following code blocks is a quick way to make your character''s walk more believable:


    +   1. **Click the Scripts tab for your character''s sprite.**

    +   2. **Delete the GLIDE block below the GO TO X Y block.** (Shift-click and
    choose Delete.)'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# PROJECT 5 LIGHTS, CAMERA, ACTION!


    +   3. Drag and snap the following blocks to the bottom of the GO TO block (shown)
    and change the values to match:


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_113_0.png)


    When you click the Green Flag button, your character has a more realistic walk.
    You can tweak the WAIT values to make your character a bit faster or slower, and
    change the X and Y values for a better-looking stride.


    # BROADCAST ANIMATION MESSAGES


    When a character reaches its destination, how do you send a message to other sprites
    and backdrops to do their thing? That''s where *broadcasting* comes in!


    # SEND A BROADCAST MESSAGE


    Let me show you how I''d broadcast a message that *Hector* has entered the room
    to trigger the lightning flash, a sound effect, and the werewolf''s sudden appearance:


    +   1. Click the **Scripts** tab for your character''s sprite, and then click
    the **Events** category.

    +   2. Drag and snap a **BROADCAST AND WAIT** block to the bottom of the "walking"
    blocks (the REPEAT loop you created in the preceding section).'
  merge: -1
  img_proc: true
- pgno: 114
  md: <!-- no content -->
