- pgno: 84
  md: '+   2. **If you are online, browse and open the project you want to copy. If
    offline, choose File ⇨ Open and select your project.**

    +   3. **Name your project. If online, click the File menu and choose Save a Copy.
    If offline, choose File ⇨ Save As.**

    +      I will name my version *Animation Soundtrack*.

    +   4. **Delete the cat.**


    You can add sound to a Scratch project in three ways:


    - Choose a sound from the Sound Library.

    - Import a sound file (.mp3 or .wav format).

    - Record a sound directly in Scratch.


    Although the Sound Library has a bunch of music and sound effects to choose from,
    it has no dialogue.


    # FIND THE RECORD BUTTON


    In the previous projects, you spent most of your time in the Paint Editor. As
    you may have guessed, in this project you will be spending more time in the Sound
    Editor.


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_84_0.png)


    Click the Sounds tab (to the right of the Costumes tab) to get to the Sound Editor.'
  merge: -1
  img_proc: true
- pgno: 85
  md: "# # PROJECT 4 SOUNDS GOOD TO ME\n\n*Note:* If you do not have a microphone\
    \ connected to your computer or you want to use audio recorded on a different\
    \ device (such as a phone or a digital recorder), click the **Upload Sound from\
    \ File** button and skip ahead to the “Edit Sound Waves” section.\n\nBefore you\
    \ start clicking, recording, and playing, it’s important to decide where each\
    \ sound should go.\n\nIn Scratch, sounds are handled the same way as costumes\
    \ and scripts. Just as each sprite can have several different costumes and code\
    \ blocks, each sprite can also contain several different sounds. Because my character,\
    \ *Hector*, has the first line of dialogue, I will select his sprite before recording:\n\
    \n+   1. Click the sprite of the character who will be speaking (or growling or\
    \ moaning), and then click the **Sounds** tab.\n+   2. Shift-click the **Pop**\
    \ sound and choose **Delete**. Or click the **X** on the **Sound** icon to delete\
    \ it.\n+   \n+      By default, each sprite has the *Pop* sound. Unless you are\
    \ planning to have your character pop (or have it attack a roll of bubble wrap),\
    \ you need to delete the sound.\n+   3. Click the **Record New Sound** button.\n\
    \nYou might think that Scratch would start recording as soon as you click the\
    \ **Record New Sound** button. Nope! That button works like the **Paint New Costume**\
    \ button; it creates a sound object that appears in the **New Sound** column of\
    \ the **Sound Editor**. Like using the Paint tools (Rectangle, Line, and so) to\
    \ add shapes to a costume, recording adds sound to a sound object.\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_85_0.png)\n\
    \n*If you have more than one character in your animation, it is generally a good\
    \ idea to record each of their lines separately. Later, you will learn how to\
    \ use code blocks to control when each sound will play.*"
  merge: -1
  img_proc: true
- pgno: 86
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 87
  md: 'While you are speaking or growling or moaning, a vertical green bar should
    appear to the left of the recording controls. The bar shows how loud your voice
    sounds through the microphone. As your voice gets louder, you may see yellow or
    even red appear near the top of the bar. This means the sound is too loud and
    may be distorted. You can either lower your voice or adjust the Microphone Volume
    slider below the Record button. (Move the slider to the left for a real loudmouth
    or to the right for that friend you are always asking, “Say what?”)


    # EDIT AUDIO CLIPS


    Editing your sound recordings is one of the coolest features of Scratch! Imagine
    if you bribe your big sister to act as the voice of a mad scientist in your cartoon;
    you go to all the trouble of writing down her dialogue, you hit Record, and she
    makes a mistake or just pauses too long between two words. Instead of recording
    the lines again, you can cut out the part you don''t want, as easily as selecting
    and deleting a shape on the Paint Editor canvas.


    After you finish recording your sound, something like this should appear in the
    sound canvas:


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_87_0.png)


    That row of black, squiggly shapes is called a sound wave, which is a visual version
    of the sound you just recorded.


    ▶ Do I really need to tell you to click the Play button to hear your recording?
    Seriously? In case you have trouble finding the button, it’s beside Stop and Record.


    Now that you have recording and playing sound out of the way, let’s get to the
    cool part: editing sound clips!'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'When editing a long sound clip, you might find it helpful to expand the Sound
    Editor. Choose Edit → Small Stage Layout or click the small, gray triangle between
    the Stage and the Sound Editor to expand and contract your work area.


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_88_0.png)


    # TRIM BEGINNING OF SOUND


    Start by deleting the extra silence (where the line is completely flat) at the
    beginning of the sound wave:


    +   1. **Select the sprite you recorded audio on, and then click the Sounds tab.**

    +   2. **If you have more than one sound, click the one you want to edit.**

    +   3. **Use the horizontal scroll bar to find the beginning of the sound you
    want to use.**

    +   4. **Click the sound wave right at the point where the silence ends and drag
    left, all the way to the beginning of the sound wave.**

    +   5. **Below the sound wave, click the Edit menu and choose Delete.**


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_88_1.png)'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'Okay, maybe you don''t think it''s that cool to **delete silence**. A bit like
    deleting nothing, right? But check this out: Each blob represents one word, and
    the flat lines are the bits of silence in between (unless you talk as fast as
    my friends in New York City, whose words practically overlap).


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_89_0.png)


    You can delete a word the same way you deleted silence, by clicking and dragging
    over the word and then choosing Edit⇢ Delete. The Edit menu also enables you to
    undo and redo edits, copy part of your audio and paste it somewhere else, and
    select the entire sound wave.


    # ## USE SOUND EDITING EFFECTS


    *Sound Editor effects* allow you to modify the volume of any part of your sound
    wave, as well as reversing a sound (fun to try out, but not useful for recorded
    dialogue unless you want a character possessed by a demon).


    Try making one of the words in your recording louder:


    +   1. **Click and drag to select the part of the sound wave you want to make
    louder.**

    +   2. **Below the sound wave, click the Effects menu and choose Louder.**'
  merge: -1
  img_proc: true
- pgno: 90
  md: '![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_90_0.png)


    Notice how that part of the sound wave appears taller after the effect is applied.
    Sound may be invisible in the real world but not inside Scratch!


    # # PLAY SOUND WITH CODE BLOCKS


    You know how to play sound in the Sound Editor, but how do you get the sound to
    play along with the animation? Two code blocks make the recorded dialogue start
    when the Green Flag button on the Stage is clicked:


    +   1. Click the sprite of the character for which you recorded dialogue.

    +   2. Click the Scripts tab.

    +   3. Click the Sound category.

    +   4. Drag the PLAY SOUND block or the PLAY SOUND UNTIL DONE block into the Scripts
    Area.

    +   5. Click the Events category and then drag and snap the WHEN GREEN FLAG CLICKED
    block onto the top of the PLAY SOUND block:


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_90_1.png)'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# PROJECT 4 SOUNDS GOOD TO ME


    If you have more than one sound stored in your character sprite, you can choose
    which one to play by using the drop-down menu in the PLAY SOUND block. Then when
    you click the Green Flag button, the selected sound should play.


    What''s the difference between PLAY SOUND and PLAY SOUND UNTIL DONE? If you have
    more code blocks snapped into place below the PLAY SOUND block, those commands
    will run *while* the sound is playing. If you use PLAY SOUND UNTIL DONE, the other
    blocks will not run until the sound has finished playing.


    If you do not want your sound to play right away, snap a WAIT block above it and
    set the number of seconds to wait:


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_91_0.png)


    # ANIMATE CHARACTER SPEECH


    If you''ve recorded dialogue for one of your characters, the next logical step
    is to make them look like they are speaking. You can achieve this in several ways:


    +   - Display the character while playing the recorded voice. (Duh!)

    +   - Animate the character''s mouth. (Easier said than done, right?)

    +   - Show who or what the character is speaking to. (Like how you only see Charlie
    Brown while some invisible adult is saying, "Whuh wuh wh wh whaughh.")

    +   - Use a voiceover, where you see the character but when he or she starts talking,
    you show something else. (You often see this in a flashback, where a character
    tells you about something that already happened while you see some of the stuff
    he or she is describing.)'
  merge: -1
  img_proc: true
