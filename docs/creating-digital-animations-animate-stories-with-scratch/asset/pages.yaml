- pgno: 18
  md: '![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_18_0.png)


    +   2. **Click and drag each corner of the body into a new position.**

    +   3. **Click and drag the end of each arm onto the top body corners where the
    shoulders would be.**

    +   4. **Click and drag the top of each leg onto the bottom body corners.**


    See how the *Reshape* tool helps you modify your stick figure easily? Because
    you have been working zoomed in to 200% on the **Paint Editor** canvas, check
    to see how your figure looks on the **Stage** (the large area to the left of the
    Paint Editor). My lines appear a bit too thin.


    # **ADJUST THE THICKNESS OF MULTIPLE LINES**


    Fortunately, there is a quick way to adjust all the lines that make up your *vector
    sprite*:


    +   1. **Click the Select tool.**

    +   2. **Click and drag across the entire figure on the Paint Editor canvas to
    select all the lines.**

    +   3. **Use the Line Width slider to increase the line thickness.**

    +   4. **Check the sprite on the Stage to determine the best thickness for your
    figure.**'
