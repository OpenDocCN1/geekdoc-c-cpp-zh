- pgno: 24
  md: '# # ANIMATE WITH CODE BLOCKS


    You start by creating a loop, which will allow you to repeat part of your animation
    as many times as you want. For ten jumping jacks, follow these steps:


    +   1. **Click the Scripts tab for Sprite1.**

    +   2. **Drag the following blocks into the Scripts Area and change the values
    to match.**


    ```

    when [flag] clicked

    switch costume to arms down

    switch costume to arms mid

    switch costume to arms up

    ```


    If you click the Green Flag button to test your code, what happens? Nothing appears
    to happen because the costume changes appear so fast you can’t see them. You need
    to add WAIT blocks between the SWITCH COSTUME blocks to slow down the change enough
    for you to see it. The default of 1 second is too long, so try changing the value
    to .25 (for a quarter of a second) for each block:


    ```

    when [flag] clicked

    switch costume to arms down

    wait .25 secs

    switch costume to arms mid

    wait .25 secs

    switch costume to arms up

    wait .25 secs

    ```


    Now when you click the Green Flag button, you should be able to see the costume
    changes. If you want your figure to do ten jumping jacks, you could drag a whole
    lot more blocks over or add just one REPEAT block.'
  merge: -1
  img_proc: true
- pgno: 25
  md: "```\n```scratch\nwhen green flag clicked\nrepeat 10\n    switch costume to\
    \ arms down\n    wait 0.25 secs\n    switch costume to arms mid\n    wait 0.25\
    \ secs\n    switch costume to arms up\n    wait 0.25 secs\n```\n```\n\nYour stick\
    \ figure should do ten jumping jacks, but they don’t look right. Can you spot\
    \ what is missing in the code? The figure starts in the arms down position, switches\
    \ to arms mid, then arms up, and then skips back to arms down for the repeat.\
    \ You need to add another arms mid position to smooth the animation between each\
    \ repeat. And each SWITCH COSTUME needs a WAIT block, too:\n\n```\n```scratch\n\
    when green flag clicked\nrepeat 10\n    switch costume to arms down\n    wait\
    \ 0.25 secs\n    switch costume to arms mid\n    wait 0.25 secs\n    switch costume\
    \ to arms up\n    wait 0.25 secs\n    switch costume to arms mid\n    wait 0.25\
    \ secs\n```\n```\n\nClick the Green Flag button and you should now see all the\
    \ costume changes through ten jumping jacks. But there’s still one more problem.\
    \ When you do jumping jacks, don’t you pause a moment in both your arms up and\
    \ arms down positions? There should be a longer WAIT after those poses, right?\
    \ I spent a few"
  merge: -1
  img_proc: true
- pgno: 26
  md: "minutes trying different WAIT values and found that these ones work best:\n\
    \n```\nwhen [green flag] clicked\nrepeat (10)\n  switch costume to [arms down]\n\
    \  wait (0.5) secs\n  switch costume to [arms mid]\n  wait (0.25) secs\n  switch\
    \ costume to [arms up]\n  wait (0.5) secs\n  switch costume to [arms mid]\n  wait\
    \ (0.25) secs\n```\n\nThe jumping jacks should look much better when you click\
    \ the Green Flag button. But did you notice how it freezes on the last jumping\
    \ jack mid-jump? You need one more SWITCH COSTUME block after the REPEAT block\
    \ to bring your figure back to the upright position:\n\n```\nwhen [green flag]\
    \ clicked\nswitch costume to [sleep]\nwait (5) secs\nswitch costume to [wake]\n\
    ```\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_26_0.png)\n\n> > Maybe I am in\
    \ too much of a rush, but I don't want to have to sit through ten jumping jacks\
    \ every time I make a change in my code. I usually use a smaller number while\
    \ coding and then raise the value when I am happy with how the animation looks."
  merge: -1
