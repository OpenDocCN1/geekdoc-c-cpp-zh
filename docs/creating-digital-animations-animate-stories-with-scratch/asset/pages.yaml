- pgno: 80
  md: '# # QUICK SCENERY IMPROVEMENTS


    Here are a few tips to enhance your scenes:


    +   - **Use reference photographs:** You can use the web or your own camera to
    grab interior and exterior images. If you want to trace over them, be sure to
    convert to Vector mode after you import your photo as a sprite or backdrop.

    +   - **Apply more gradients:** Gradients are not just for sky, ground, and road.
    Try horizontal, vertical, and radial gradients on trees, buildings, or your favorite
    breakfast cereal. Radial gradients work best on circular objects, and horizontal
    and vertical gradients work better inside rectangular shapes.

    +   - **Add shadows:** Think about how you might duplicate a sprite, fill it with
    a dark gray color, and reshape it (like the trees in the first image in this project).
    Be warned: After you put a shadow on one object, you have to put one on all the
    other objects or your scene may look incomplete.

    +   - **Consider the weather:** Is it a cloudy day? Rainy? Brainy?

    +   - **Consider the time:** Especially for exterior scenes, it is important to
    choose whether it is morning, afternoon, or evening.


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_80_0.png)'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# PROJECT 4 SOUNDS GOOD TO ME


    **ARE YOU LIKE MY NIECE AND NEPHEW?** Half the time that you are supposedly watching
    television, your eyes are not even on the screen. You’re texting somebody with
    your phone or looking up something on your tablet or playing a game on your laptop
    or even doing homework. One of the easiest ways to catch your attention is to
    hit the Mute button on the remote, right? “Hey, I was watching that!” This should
    illustrate how important sound is to conveying a story.


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_81_0.png)


    # THAT’S WHAT HE SAID


    In previous projects, you began thinking about your story, designed some characters,
    and created an interior and an exterior scene. The next step in the animation
    process is to add dialogue.'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'Dialogue is so important to the animation process that voices are recorded
    before almost any animation begins because synchronizing character animation to
    sound is easier than trying to fit sound into finished animation. In the animation
    world, this initial sound recording is the *scratch track*. How perfect is that?


    *Although this project is about recording and playing audio, there is another
    way to have your characters speak to one another in Scratch. If you add the SAY
    block to a character, any text you type in the block will appear in a speech bubble.
    You can even control how long the speech bubble appears by using a SAY FOR SECONDS
    block.*


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_82_0.png)


    # WRITE DIALOGUE FOR YOUR CHARACTERS


    Okay, don’t hate me, but even if you are going to provide the voice for all your
    characters, writing your dialogue before you'
  merge: -1
  img_proc: true
