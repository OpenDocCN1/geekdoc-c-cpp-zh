    # ## GIVE ’EM A NOSE JOB


    Although some zombies may have lost a nose in their travels, I think my little
    ghoul could use a petite schnoz. Use the Pencil tool to draw the nose on yours
    and then use the Reshape tool to smooth it.


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_44_1.png)


    Nose placement can affect your character as much as the location of the eyes and
    mouth, so you might want to try a few positions before you lock in your face for
    all eternity.


    # ## A LITTLE BODY WORK


    Having the body, arms, and legs as separate objects makes characters easier to
    animate.


    +   1. **Click the Ellipse tool, choose your outline color, and then draw an oval
    the approximate size you want for the body.**


    I’ll choose classic black for my outline color.


    +   2. **Click the Color a Shape tool, choose a color for the character’s shirt
    or dress, and then click inside the initial body shape.**'
