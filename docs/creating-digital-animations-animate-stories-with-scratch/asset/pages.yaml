- pgno: 115
  md: '# # PROJECT 5 LIGHTS, CAMERA, ACTION!


    You can trigger a sound effect at the same time by snapping a PLAY SOUND block
    between the WHEN I RECEIVE and the SET BRIGHTNESS EFFECT blocks:


    ```

    ~~~

    when I receive [Lightning v]

    play sound [pop v]

    set [brightness v] effect to (10)

    ~~~

    ```


    You get the idea? Each event in your story can trigger as many code blocks as
    you want to use by broadcasting and receiving messages, like a director calling
    out instructions to actors and technicians during a rehearsal.


    # ## SWITCH BETWEEN ANIMATION SCENES


    To change scenes in your animation, you need a way to hide sprites that make up
    your first scene and display sprites that make up your second scene, as well as
    change any backdrops that may appear.


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_115_0.png)


    How do you send a message to hide or show several sprites and change backdrops?
    This is another ideal use of broadcasting:


    +   1. Add the following code to each sprite that you want to show at the beginning
    of your animation and then hide in your second scene:'
  merge: -1
  img_proc: true
- pgno: 116
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 117
  md: 'It might also be a good idea to add a pause at the end of your scene for dramatic
    effect by using another BROADCAST or simply a WAIT block.


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_117_0.png)


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_117_1.png)


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_117_2.png)


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_117_3.png)


    # # LEARN MORE ABOUT ANIMATION


    The following websites offer tons of tips, techniques, and tutorials to expand
    your skills.


    +   - www.scratch.mit.edu: Come on, I''m not the only Scratch animator out there
    (and I''m sure not the best, either!). If you search for animation tutorials,
    you''ll find thousands of projects and hundreds of studios covering a wide range
    of styles.

    +   - www.youtube.com: On YouTube, you get the best results when you type a specific
    search. Try searching for "scratch animation tutorial," "simple animation tutorial,"
    or "2d animation tutorial." (If you are in a school that blocks access to YouTube,
    try www.schooltube.com.)'
  merge: -1
  img_proc: true
- pgno: 118
  md: '+   - www.vimeo.com: Enter the same search terms that you use in YouTube to
    find many unique tutorials. For example, *The Six Steps of Animation* is a great
    introduction to more traditional animation techniques that can also be applied
    to Scratch.

    +   - www.animatorisland.com: An animation community built to share animation
    techniques from storytelling to drawing to special effects.

    +   - www.jerrysartarama.com/art-lessons/Skill-Level/Kids/: Don’t let the long
    web address scare you off. This site has a bunch of great art and design tutorials.

    +   - diy.org/tags/animation: The online community for kids who like to make stuff,
    create all kinds of art, learn about the world around them, and experiment with
    everything from baking to beekeeping.


    # AND CUT!


    The world of animation has so many possibilities. If you go to your favorite library
    or bookstore, you will find a bunch of books dedicated to animation, from the
    classic hand-drawn approach to stop motion and computer animation. In the nearby
    sidebar, you will find several great resources for inspiration and for expanding
    your animation skills.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# # AUTHOR NOTES


    ***THERE IS STILL SO MUCH I HAVEN''T SHARED!*** Honestly, I''ve only scratched
    the surface of the programming power in those colorful blocks. But rather than
    trying to squeeze in one more game project, I''d like to share some important
    tips for all your Scratch projects.


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_119_0.png)


    # ## SHARE YOUR SCRATCH PROJECTS IN THE SCRATCH ONLINE COMMUNITY


    By default, you are the only person who can see your Scratch projects. To allow
    other Scratch users to view your project, remix it, or add it to their studio,
    you must enable sharing. Sharing a project makes it available to all users around
    the world, so you should delete any personal information or other elements (spare
    sprites, blocks, and sounds) that you do not want strangers to see. If your project
    is not yet complete, click the Draft check box before sharing it to inform people
    that it is a work in process.'
  merge: -1
  img_proc: true
- pgno: 120
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 121
  md: '# # AUTHOR NOTES


    +   5. Fill out the Instructions box and the Notes and Credits box, and choose
    one to three tags.


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_121_0.png)


    # ## SHARE PROJECT FROM THE OFFLINE SCRATCH EDITOR


    If you are using the offline Scratch editor, click the File menu and choose Share
    to Website. You will need to log in with your Scratch account, and then follow
    Steps 2–5 in the preceding section.


    # ## BROADCAST SCRATCH ANIMATION ON ANY WEBSITE


    You have seen how sharing a Scratch project will allow logged-in Scratch users
    to view and remix your projects. You can also display working Scratch projects
    on your own blog or on another website.


    +   1. Go to [www.scratch.mit.edu](http://www.scratch.mit.edu) and log into your
    account.


    +   2. Click the My Stuff button near the top-right part of the web page.


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_121_1.png)'
  merge: -1
  img_proc: true
- pgno: 122
  md: '+   5. Click the title of the project you want to share on another website.


    +   4. If the project has not yet been shared, click the Share button.


    +   5. Click the Embed button.


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_122_0.png)


    +   6. Select and copy the embed html code.


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_122_1.png)


    +   7. Paste the code into your external blog or website.


    # # RECORD/EXPORT SCRATCH VIDEOS


    You can record and export a video of your Scratch project, but this feature is
    currently limited to 60 seconds or less. Depending on what kind of computer you
    have, you may need to download'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'another program, such as VLC Media Player ([www.videolan.org](http://www.videolan.org)),
    to play the file. This file will run on YouTube, Vimeo, and Facebook but may need
    to be converted for other websites such as Twitter and Tumblr:


    +   1. **Open your Scratch project.**

    +   2. **From the Scratch File menu, choose Record Project Video.**


    You need to be signed in to see this option.


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_123_0.png)


    +   3. **In the More Options menu, choose recording options (such as recording
    sound and mouse clicks).**

    +   4. **To record the beginning of your project, click the Start button. Or if
    you want to start recording sometime after the start of the project, click the
    Green Flag button.**

    +   5. **Click the Stop Recording button (below the Stage).**


    After you have recorded for 60 seconds, Scratch stops recording automatically.


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_123_1.png)


    +   6. **Click the Save and Download button to download the file to your computer.**'
  merge: -1
  img_proc: true
