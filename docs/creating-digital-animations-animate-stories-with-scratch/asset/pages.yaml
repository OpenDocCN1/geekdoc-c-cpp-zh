- pgno: 63
  md: '# SHARE SPRITES BETWEEN PROJECTS


    What if you want to bring in characters from more than one project or start with
    a blank project, work on your backdrops, and then bring characters in later? Whether
    working online or offline, Scratch allows you to export sprites, individual costumes,
    and backdrops from one project and then import them into another project.


    Shift-click a sprite, costume, or backdrop and select Save to Local File.


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_63_0.png)


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_63_1.png)


    Use the Upload Sprite from File or Upload Costume from File button to load your
    character into a new project.


    If you are working online and do not have permission to save files to your computer,
    fear not! You can use the Scratch Backpack (at the bottom of your Scripts/Costumes/Sounds
    page when working online).


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_63_2.png)


    You can drag sprites, backdrops, costumes, scripts, and sounds into and out of
    your Backpack. To date, the offline version of Scratch does not include a Backpack.'
