    \ You can adjust the value to suit your taste.\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_107_0.png)\n\
    \n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_107_1.png)\n\n# ## FADE-IN AND FADE-OUT\n\
    \nYou can achieve a fade-in effect at the beginning of a scene by gradually changing\
    \ the Ghost value from 0 to 100.\n\n```\n```\nset ghost effect to 0\nrepeat 100\n\
