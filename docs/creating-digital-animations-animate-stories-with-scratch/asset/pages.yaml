- pgno: 70
  md: '![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_70_0.png)


    To make the scene more immersive, you can add something inside the room that the
    character can move in front of and behind. In theater, film, and television, these
    objects are called *props*.


    # ## *BUILD YOUR OWN FURNITURE*


    Nothing quite says “living room” like a big fluffy couch. You can follow along
    or draw a different prop that fits your room (and your story) better.


    The simplest way to draw props is to break them down into smaller parts. Even
    though most couch cushions are rectangular, it is better to begin with an ellipse
    and then use the Reshape tool to get the rounded corners right:


    +   1. Click the **Paint New Sprite** icon below the Stage.

    +   2. Click the **Costumes** tab and then click the **Convert to Vector** button.

    +   3. Click the **Ellipse** tool, choose the black color swatch, drag the **Line
    Width** slider to adjust the line thickness, and then choose the **Outline** option.

    +   4. Click and drag to draw the first cushion.

    +      Leave enough room for the arms and two more cushions.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '+   5. Click the Reshape tool, select the cushion, and then click and drag
    the middle edge points inward to form a rounded rectangle.


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_71_0.png)


    +   6. Click the Color a Shape tool, click the color you think will look good
    in your room, and then click inside the cushion.


    The color should contrast the color of the wall and the character''s skin, hair,
    and clothing.


    +   7. Click the Duplicate tool, click the first cushion, and drag the copy into
    place beside it. Repeat for the third cushion.


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_71_1.png)


    > > *If you hold down the Shift key, you can keep making duplicates of the shape
    without having to reselect the Duplicate button each time. Release the Shift key
    before dragging the final copy into place.*


    +   8. Click the Select tool and then Shift-click each cushion until all three
    are selected.


    Don''t worry about the gaps; you can fill them in later.


    +   9. Click the Group button.'
  merge: -1
