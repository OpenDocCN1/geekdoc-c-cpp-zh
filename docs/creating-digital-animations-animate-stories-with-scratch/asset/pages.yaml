- pgno: 104
  md: 'Some Scratchers don''t even think to add code to their backdrop, but several
    blocks in the Looks category work on backdrops. One of them can help you transform
    day into night:


    +   1. **Click the Stage button** located to the left of your sprite icons.

    +   2. **Click the Scripts tab.**

    +   3. **Click the Looks category.**

    +   4. **In the Scripts Area, click one time in the SET EFFECT TO block.**


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_104_0.png)


    Inside the SET EFFECT TO block, choose Brightness, change the value to **50**,
    and then click one time in the block. What happens to the backdrop? It gets quite
    a bit brighter. If you changed the value to the maximum of **100**, the backdrop
    would be completely white. So how would you make it darker? Try a negative number!'
  merge: -1
  img_proc: true
- pgno: 105
  md: '# **PROJECT 5** *LIGHTS, CAMERA, ACTION!*


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_105_0.png)


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_105_1.png)


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_105_2.png)


    I find -35 works well for my exterior scene. I''ll unhide (Shift-click and select
