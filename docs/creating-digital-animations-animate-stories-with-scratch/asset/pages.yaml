    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_105_3.png)


    Better. But what if I want it to be darker inside?


    # **TURN OUT THE LIGHTS**


    What if you could put a black curtain over the entire scene and then make it partially
    transparent? That''s where the Ghost effect comes in! (Hint: It''s not just for
    ghosts.)


    +   1. Below the Stage, click the Paint New Sprite icon.

    +   2. Click the Costumes tab.

    +   3. Click the Fill with Color tool.'
