  md: '# ANIMATE THE DOG


    I think it''s finally time to bring the dog to life, don''t you? Design an awake
    costume for Woof:


    +   1. Shift-click Woof''s sleeping costume and choose Duplicate.

    +   2. Rename the costume Wake.

    +   3. Click the Select tool.

    +   4. Click and drag the dog''s head up a bit (or you can use the Up Arrow key
    for a more precise movement).

    +   5. Click and drag to rotate the tail up.


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_33_0.png)


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_33_1.png)


    # ADD CODE TO ANIMATE THE STICK DOG


    Timing is essential in animation, especially when you have two or more characters
    interacting. Can you figure out how many seconds the dog should wait until waking
    up? Look back at the code on *Sticky*: three seconds to glide in and then a one-second
    pause before starting the jumping jacks. So the dog should wait about five seconds,
    right?


    +   1. Click the Scripts tab.

    +   2. If you duplicated the stick figure sprite to make the dog as I did, the
    tab will already contain jumping jack code. Shift-click the `WHEN GREEN FLAG CLICKED`
    block and choose Delete.


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_33_2.png)'
