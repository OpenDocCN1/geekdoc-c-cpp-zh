- pgno: 27
  md: '# ## BRING HUMOR TO YOUR ANIMATION


    If you search YouTube or other online video sites, you can find thousands of hilarious
    stick figure animations. What do they all have in common? Like any story, your
    animation should have a beginning, a middle, and an end. But what makes most of
    them funny? Usually, it''s the element of surprise!


    I know nothing is surprising about a stick figure who does ten jumping jacks.
    If you want to make it funny, what could you add to surprise the audience? Right
    now, the jumping jacks are like a story that''s just a middle (no beginning or
    ending).


    To transform this scene into a funny story, you need to answer two questions:


    +   1. **Why is a stick figure doing jumping jacks?**

    +   2. **What could prevent the stick figure from finishing jumping jacks?**


    Watch just about any humorous scene and you will notice a character who really
    wants something and an obstacle preventing the character from getting it. In the
    Pixar movie *Up*, a grumpy old man wants to get away from everybody, so he straps
    all these balloons on his house and then takes off. What goes wrong? An annoying
    little Boy Scout flies off with him.


    Maybe you need a second character, like the little boy in *Up*, or Batman in *The
