  md: '![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_29_0.png)


    # ### DEVELOP YOUR HUMOROUS STORY


    The dog will be the obstacle to *Sticky* finishing his morning exercise, but how
    can you start the story? Why is *Sticky* exercising? I can think of all kinds
    of reasons, but what would be a simple one that you could show quickly (so you
    do not have to spend hours animating)? What if *Sticky* puts up a new poster of
    muscle stick man? It might be funny to see a skinny stick figure walk across the
    Stage and put up a poster of a stick figure with crazy muscles.


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_29_1.png)


    Then *Sticky* starts doing jumping jacks, but the dog runs over and nags him.
    *Sticky* ignores the dog until it jumps up and tears part of the poster. Then
    *Sticky* ends up chasing the dog for so long, he ends up with huge leg muscles
    instead of muscular arms, chest, and six-pack abs. *That* could be funny.'
