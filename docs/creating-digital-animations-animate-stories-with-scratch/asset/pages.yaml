  md: '# # PROJECT 1 ANIMATION ESSENTIALS


    *THIS IS WHERE I AM SUPPOSED TO TALK ABOUT THE HISTORY OF ANIMATION.* And then
    describe all the different kinds and give a bunch of examples and . . . (yawn)
    . . . No thanks! Wouldn’t you rather start animating right now?


    In this project, you begin by telling a short story with one of the simplest forms
    of animation: stick figures. An obvious advantage of stick figures is that they
    are almost as easy to animate as they are to draw.


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_15_0.png)


    # ## DRAW YOUR FIRST CHARACTER


    Go ahead and start drawing! Just kidding. Of course you must create a project
    before you can draw anything.'
