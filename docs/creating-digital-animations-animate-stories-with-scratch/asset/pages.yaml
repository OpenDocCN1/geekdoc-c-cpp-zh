  img_proc: true
- pgno: 67
  md: '# CHANGE A BACKDROP INTO A SPRITE


    Although you cannot convert a backdrop into a sprite, you can drag a backdrop
    onto a sprite, which will become a new costume on that sprite:


    +   1. Click the Paint New Sprite button.

    +   2. Click the Stage button (below the actual Stage).

    +   3. On the Backdrops tab, click and drag onto the new sprite the backdrop that
    includes your window.


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_67_0.png)


    +   4. While you are still on the Backdrops panel, select the plain white backdrop.


    If you do not have a backdrop, click the Paint New Backdrop button.


    +   5. Click and drag the new wall sprite into position on the Stage.


    # DESIGN SEE-THROUGH WINDOWS


    You can enable seeing other sprites through windows in a few ways. One way is
    to delete the color inside the windowpanes, but that won''t work here. Can you
    figure out why? You drew the wall'
