    \ and then bring characters in later? Whether working online or offline, Scratch\
    \ allows you to export sprites, individual costumes, and backdrops from one project\
    \ and then import them into another project.\n\nShift-click a sprite, costume,\
    \ or backdrop and select Save to Local File.\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_63_0.png)\n\
    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_63_1.png)\n\nUse the Upload Sprite from\
    \ File or Upload Costume from File button to load your character into a new project.\n\
