  mdcn: "\n\n### 用透视绘制场景\n\n通过使用透视，你可以让一些物体看起来很远，而另一些物体看起来离观看者更近。将道路形状的顶部变窄，会带来更好的透视感。\n\
    \n点击“整形”工具，点击道路矩形将其选中，然后点击并拖动顶部两个点，使它们靠得更近。\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_76_0.png)\n\
    \n> *如果你无法让道路的顶部边角与笔直的地平线对齐，或者你只是想和我一样偷懒，可以试试这个小技巧。选中天空矩形，将其置于最前图层（按住 Shift 键点击“前移一层”按钮），然后将底部向下拖动，使其覆盖草地和道路矩形的顶部。*\n\
    \n你可以调整左右两个边角之间的距离，来表现道路的宽度和长度。最棒的是，道路会为你场景中的其他对象提供参考引导。\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_76_1.png)\n\
    \n## 快速美化场景\n\n这里有一些提升场景效果的小贴士：\n\n- **使用参考照片：** 你可以通过网络或自己的相机获取室内外图片。如果你想临摹这些图片，请确保在将照片作为角色或背景导入后，切换到矢量模式。\n\
    - **多应用渐变：** 渐变不只用于天空、地面和道路。可以尝试在树木、建筑或你最爱的早餐麦片上使用水平、垂直和径向渐变。径向渐变在圆形对象上效果最好，水平渐变和垂直渐变在矩形对象内效果更佳。\n\
    - **添加阴影：** 想一想如何复制一个角色，用深灰色填充它，并改变其形状（就像本项目第一张图中的树木一样）。提醒一下：一旦你给一个对象添加了阴影，就必须给所有其他对象也添加阴影，否则场景看起来会不完整。\n\
    - **考虑天气：** 是多云天？雨天？还是有风？\n- **考虑时间：** 尤其是室外场景，选择是早晨、下午还是傍晚非常重要。\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_80_0.png)\n\
    \n## 项目4 听起来不错\n\n**你和我侄女、侄子一样吗？** 你以为在看电视的时间里，有一半时间你的眼睛根本没盯着屏幕。你在用手机发短信，或在平板上查资料，或在笔记本电脑上打游戏，甚至在做作业。而吸引你注意力的最简单方法之一，就是按下遥控器的静音键，对吧？“嘿，我刚才还在看呢！”这足以说明声音对于讲述故事有多么重要。\n\
    \n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_81_0.png)\n\n### 他就是这么说的\n\n在之前的项目中，你开始构思故事、设计角色，并创建了室内和室外场景。动画流程的下一步是添加对话。\n\
    \n对话在动画流程中非常重要，以至于几乎所有动画开始前都要先录制声音，因为让角色动画与声音同步，比试图将声音硬塞进已经完成的动画要容易得多。在动画界，这种初始声音录制被称为*草稿音轨*。多么贴切啊？\n\
    \n*尽管本项目是关于录制和播放音频的，但在 Scratch 中还有一种方法可以让你的角色相互对话。如果你向角色添加一个“说”积木，那么你在积木中输入的文本就会出现在对话气泡中。你甚至可以通过“说\
    \ 秒”积木来控制对话气泡显示的时间。*\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_82_0.png)\n\n\
    ### 为你的角色编写对话\n\n好吧，别讨厌我，但即使你打算为所有角色配音，也要在开始之前把对话写下来。\n\n- 2. **如果你在线，浏览并打开你想复制的项目。如果离线，选择“文件\
    \ ⇨ 打开”并选择你的项目。**\n- 3. **为你的项目命名。如果在线，点击“文件”菜单并选择“保存副本”。如果离线，选择“文件 ⇨ 另存为”。**\n\
    \n  我将我的版本命名为*动画配乐*。\n- 4. **删除那只猫。**\n\n你可以通过三种方式将声音添加到 Scratch 项目中：\n\n- 从声音库中选择一个声音。\n\
    - 导入音频文件（.mp3 或 .wav 格式）。\n- 直接在 Scratch 中录制声音。\n\n虽然声音库中有许多音乐和音效可供选择，但没有对话。\n\
    \n### 找到录音按钮\n\n在之前的项目中，你大部分时间都在画图编辑器中度过。你大概已经猜到，在这个项目中，你将在声音编辑器中花更多时间。\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_84_0.png)\n\
    \n点击“声音”标签页（位于“造型”标签页右侧），即可进入声音编辑器。\n\n"
