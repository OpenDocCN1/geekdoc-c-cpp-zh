  - '[PAGE 38]


    # # PROJECT 2 ANIMATE CREAT CHARACTERS


    ENOUGH WITH STICK PEOPLE! In this project, you create a unique cast of characters
    by using vector-drawing tools and then you learn a few design techniques to help
    bring them to life.


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_38_0.png)


    # ## KEEP IT SIMPLE, STUPID


    When I was younger, I learned that KISS means more than just smacking your lips
    into somebody. It can stand for Keep It Simple, Stupid. The more complex your
    characters are, the harder it is to animate them. So keep your character design
    simple, dummy!'
