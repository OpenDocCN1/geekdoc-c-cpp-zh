    # PROJECT 1 ANIMATION ESSENTIALS


    +   4. If necessary, use the Line Width slider to adjust the line thickness the
    way you did for your stick figure.


    Compare your figure and the new line on the Stage.


    # ADJUST MOVEMENT AGAINST THE BACKDROP


    In each jumping jack pose, the feet should be on the ground. You can treat the
    bottom of the Paint Editor canvas as the ground for all your costumes to make
    them consistent.


    +   1. Click your stick figure sprite and then click Costume1 on the Scripts tab.


    +   2. Use the Select tool to click and drag over the entire figure.


    +   3. Click the Down Arrow key on your keyboard several times until the stick
    figure''s feet line up with the bottom of the Paint Editor canvas.


    +   4. If necessary, use the Reshape tool to align the bottom of each leg with
    the bottom of the window.


    +   5. Repeat Steps 1–4 for Costume2.


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_21_0.png)


    Why use the Down Arrow key when you can just click and drag? Because you don''t
    want to move the sprite left or right accidentally (which would make the animation
    appear jittery).


    Return to the Stage, click your stick figure, and then drag it so the bottom of
    each leg aligns with the ground. If you alternate'
  - '[PAGE 22]


    between Costume1 and Costume2, the feet should now remain on the ground.


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_22_0.png)


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_22_1.png)


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_22_2.png)


    But something is still missing. Stand up and do a few jumping jacks. Seriously!
    One thing you need to do as an animator is act out each movement.


    Do your feet stay in contact with the floor the entire time? Of course not. Why
    do they call them *jumping jacks*? Because you jump up!


    # ## PUTTING THE JUMP IN JACKS


    Right now, if you alternate costumes, it''s like the feet just slide across the
    floor. You need to add a pose between Costume1 and Costume2 with the arms and
    legs midway between the other poses and the body above the ground. This also a
    good time to rename the costumes so you don''t get confused.


    +   1. **Click Costume1**, select the costume name, and then type Arms Up.

    +   2. **Click Costume2** and rename it Arms Down.

    +   3. **Shift-click the Arms Up costume** and select Duplicate.

    +   4. **Click and drag the new costume up** so it comes between Arms Up and Arms
    Down.

    +   5. **Rename the middle costume** Arms Mid.'
