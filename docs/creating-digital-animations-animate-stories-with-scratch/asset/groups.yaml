    # # PROJECT 2 ANIMATE GREAT CHARACTERS


    Ah, the fangs make my character much more ferocious, but he kinda looks like he''s
    wearing a furry dress. Well, who says Werewoof is a boy? Okay, then she looks
    like she''s wearing a furry dress!


    # ## UNDRESS THE BEAST


    Before you delete the dress (or some other body part), take a moment to think
    about whether it could serve another purpose. It occurs to me that if I resize
    the dress and move it up to the shoulders, it could look more like fur:


    +   1. Click the Select tool, click the dress, and then drag the bottom side up
    to make it shorter.

    +   2. Click and drag the shape up to the shoulder area.

    +   3. Click the Ellipse tool and then draw a new body shape.


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_51_0.png)


    +   4. Click the Reshape tool, click the body, and then drag the points to make
    ribs.

    +   5. Click the Select tool, click the legs shape, and then resize the legs to
    fit.


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_51_1.png)'
