    # ## ARMING YOUR CHARACTERS


    Although you can get away with combining legs, your character should have two
    arms, right? You can follow the lazy animator way by drawing the left arm and
    then using the ole’ one-two punch of duplicate and flip.


    +   1. Use the Ellipse tool to draw the left arm.


    +   2. Use the Reshape tool to refine the shape.


    +   3. Fill the shape with skin color.


    I’ll choose zombie-white.


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_46_1.png)


    +   4. Click the Duplicate tool, click the arm, and then drag the copy to the
    other side.


    +   5. Click the Flip Left-Right button.


    +   6. Click the Select tool and then drag the arm into the correct position.


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_46_2.png)


    Oops, I just noticed my character is missing a neck! Why not duplicate the leg
    shape and flip it vertically?'
