    \ Shift-clicking the sprite and selecting Hide.**\n- 2. **Select Sticky and change\
    \ his costume to Arms Down.**\n- 3. **Click and drag Sticky to the far-right side\
    \ of the Stage.**\n\n## PROJECT 1 ANIMATION ESSENTIALS\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_31_0.png)\n\
    \nYou want *Sticky* to walk onto the Stage before doing the jumping jacks, so\
    \ the new code needs to go between **WHEN GREEN FLAG CLICKED** and the **REPEAT**\
    \ block. Snap the following code blocks right under **WHEN GREEN FLAG CLICKED**\
    \ and change the values to match:\n\n```scratch\nwhen green flag clicked\nswitch\
    \ costume to arms down\ngo to x: (-260) y: (-18)\nglide (1) secs to x: (200) y:\
    \ (-30)\nwait (1) secs\n```\n\nWhat if you add a sleeping pose to *Woof* and have\
    \ the dog wake up when the man begins exercising?\n\n### ROTATE PARTS WITH THE\
    \ SELECT TOOL\n\nTo preserve the length of lines while rotating, use the Select\
    \ tool. With vector shapes, you can even change the point around which they rotate\
    \ by following these steps.\n\n- 1. Shift-click the *Woof* icon and select Show.\n\
    - 2. Click *Woof* to select the sprite and then click the **Costumes** tab.\n"
  mdcn: "\n## 用代码块制作动画\n\n首先创建一个循环，这样你就可以按需重复动画的某一部分任意多次。要做十个开合跳，请按以下步骤操作：\n\n- 1.\
    \ **单击 Sprite1 的脚本选项卡。**\n- 2. **将以下积木块拖到脚本区，并更改数值以匹配。**\n\n```scratch\nwhen [flag]\
    \ clicked\nswitch costume to arms down\nswitch costume to arms mid\nswitch costume\
    \ to arms up\n```\n\n如果你单击绿旗按钮测试代码，会发生什么？看起来什么也没发生，因为造型变化出现得太快，你看不到它们。你需要在切换造型积木块之间添加等待积木块，把变化速度放慢到足以看清。默认的\
    \ 1 秒太长了，所以试着把每个积木块的值改为 .25（即四分之一秒）：\n\n```scratch\nwhen [flag] clicked\nswitch\
    \ costume to arms down\nwait .25 secs\nswitch costume to arms mid\nwait .25 secs\n\
    switch costume to arms up\nwait .25 secs\n```\n\n现在当你单击绿旗按钮时，应该能看到造型变化。如果你想让角色做十个开合跳，你可以拖过来一大堆积木块，或者只添加一个重复积木块。\n\
    \n```scratch\nwhen green flag clicked\nrepeat 10\n    switch costume to arms down\n\
    \    wait 0.25 secs\n    switch costume to arms mid\n    wait 0.25 secs\n    switch\
    \ costume to arms up\n    wait 0.25 secs\n```\n\n你的火柴人应该会做十个开合跳，但看起来不太对。你能看出代码中缺少什么吗？这个角色从手臂放下的姿势开始，切换到手臂中间位置，然后到手臂举起，接着在重复时又直接跳回手臂放下。你需要在每次重复之间再添加一个手臂中间位置，让动画更平滑。而且每个切换造型也都需要一个等待积木块：\n\
    \n```scratch\nwhen green flag clicked\nrepeat 10\n    switch costume to arms down\n\
    \    wait 0.25 secs\n    switch costume to arms mid\n    wait 0.25 secs\n    switch\
    \ costume to arms up\n    wait 0.25 secs\n    switch costume to arms mid\n   \
    \ wait 0.25 secs\n```\n\n单击绿旗按钮，现在你应该能看到十个开合跳中的所有造型变化。但还有一个问题。你做开合跳时，在手臂举起和手臂放下这两个姿势上不都会停顿一下吗？这些姿势之后应该有更长的等待，对吧？我花了几分钟尝试不同的等待值，发现这些值效果最好：\n\
    \n```scratch\nwhen [green flag] clicked\nrepeat (10)\n  switch costume to [arms\
    \ down]\n  wait (0.5) secs\n  switch costume to [arms mid]\n  wait (0.25) secs\n\
    \  switch costume to [arms up]\n  wait (0.5) secs\n  switch costume to [arms mid]\n\
    \  wait (0.25) secs\n```\n\n当你单击绿旗按钮时，开合跳应该看起来好多了。但你注意到它在最后一个开合跳跳到一半时卡住了吗？你需要在重复积木块之后再添加一个切换造型积木块，让角色回到直立姿势：\n\
    \n```scratch\nwhen [green flag] clicked\nswitch costume to [sleep]\nwait (5) secs\n\
    switch costume to [wake]\n```\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_26_0.png)\n\
    \n> 也许我太着急了，但我不想每次修改代码都要坐着看完十个开合跳。我通常会在编写代码时使用较小的数字，等我对动画效果满意后再把数值调大。\n\n### 为动画增添幽默\n\
    \n如果你在 YouTube 或其他在线视频网站搜索，可以找到成千上万个搞笑的火柴人动画。它们有什么共同点？像任何故事一样，你的动画应该有开头、中间和结尾。但大多数动画为什么好笑？通常是惊喜元素！\n\
    \n我知道一个做十个开合跳的火柴人没什么好惊讶的。如果你想让它变得有趣，可以添加什么来让观众惊喜？现在，这些开合跳就像只有一个中间部分的故事（没有开头或结尾）。\n\
    \n要把这个场景变成一个有趣的故事，你需要回答两个问题：\n\n- 1. **一个火柴人为什么在做开合跳？**\n- 2. **什么可能阻止这个火柴人完成开合跳？**\n\
    \n只要观看几乎任何幽默场景，你都会注意到一个角色非常想要某样东西，而一个障碍阻止这个角色得到它。在皮克斯电影 *《飞屋环游记》* 中，一个脾气暴躁的老人想远离所有人，于是他把所有这些气球绑在房子上，然后起飞。哪里出错了？一个烦人的小童子军跟着他飞走了。\n\
    \n也许你需要第二个角色，比如 *《飞屋环游记》* 中的小男孩，或 *《乐高大电影》* 中的蝙蝠侠，或 *《怪物史莱克》* 系列电影中的驴子，或者……电影里的那只狗——有了！让我们给火柴人一只火柴宠物吧！一只阻止他完成晨练的狗！\n\
    \n### 添加火柴人最好的朋友\n\n下面是我最喜欢的另一个 Scratch 火柴人动画技巧。你不必绘制新角色，而是可以复制第一个角色并重新拼装身体部位（有点像弗兰肯斯坦博士）。这样，你就能确保角色比例合适，并且放在一起好看：\n\
    \n- 1. 按住 Shift 单击 Sprite1，然后选择“复制”。\n- 2. 要重命名这两个角色，请选择“信息”，然后更改名称。\n\n  我会把第一个角色叫作\
    \ Sticky，第二个角色叫作 Woof。\n\n- 3. 单击“返回”按钮退出信息视图。\n\n现在你应该有两个角色了。单击 Woof 角色的图标，转到“造型”选项卡，并单击每个造型图标上的小\
    \ X，删除除第一个造型之外的所有造型。第一个造型将作为新角色的基础。\n\n### 修改身体部位以创建新角色\n\n你将使用选择工具旋转身体，并把其他身体部位拖到合适位置。然后使用重塑工具雕刻狗的头部：\n\
    \n- 1. 单击选择工具。\n- 2. 单击身体形状。\n- 3. 单击旋转手柄（所选形状上方的小圆圈），并拖动将身体旋转到水平位置。\n- 4. 单击并拖动胳膊和腿到合适位置。\n\
    - 5. 单击重塑工具。\n- 6. 单击头部，然后单击并拖动控制点，把头部雕刻得更像狗头形状。\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_29_0.png)\n\
    \n### 展开你的幽默故事\n\n这只狗将成为 *Sticky* 完成晨练的障碍，但你要如何开始这个故事呢？*Sticky* 为什么锻炼？我能想到各种理由，但有什么简单的理由可以让你快速展示（这样你就不必花几个小时做动画）？如果\
    \ *Sticky* 贴上一张新的肌肉火柴人海报，会怎么样？看到一个瘦瘦的火柴人走过舞台，贴上一张有着夸张肌肉的火柴人海报，可能会很有趣。\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_29_1.png)\n\
    \n然后 *Sticky* 开始做开合跳，但狗跑过来缠着他。*Sticky* 不理狗，直到狗跳起来撕掉海报的一部分。然后 *Sticky* 追狗追了太久，结果练出了巨大的腿部肌肉，而不是强壮的手臂、胸肌和六块腹肌。*那*可能会很有趣。\n\
    \n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_30_0.png)\n\n你怎么能把它变得更容易？如果 *Sticky*\
    \ 进场时海报已经在墙上，会怎么样？狗也可以在那里。然后你只需要让这个男人进入场景。\n\n## 像男人一样走路\n\n我们尽快把 *Sticky* 弄到舞台上，好吗？等等，他已经在舞台上了。把他弄下去！\n\
    \n- 1. **暂时按住 Shift 单击角色并选择“隐藏”来隐藏 Woof。**\n- 2. **选择 Sticky，并把他的造型改为“手臂放下”。**\n\
    - 3. **单击并拖动 Sticky 到舞台最右侧。**\n\n## 项目1 动画基础\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_31_0.png)\n\
    \n你想让 *Sticky* 在做开合跳之前走上舞台，所以新代码需要放在**当绿旗被点击**和**重复**积木块之间。将以下代码块直接吸附到**当绿旗被点击**正下方，并更改数值以匹配：\n\
    \n```scratch\nwhen green flag clicked\nswitch costume to arms down\ngo to x: (-260)\
    \ y: (-18)\nglide (1) secs to x: (200) y: (-30)\nwait (1) secs\n```\n\n如果你给 *Woof*\
    \ 添加一个睡觉姿势，并让狗在男人开始锻炼时醒来，会怎么样？\n\n### 使用选择工具旋转身体部位\n\n要在旋转时保持线条长度，请使用选择工具。对于矢量形状，你甚至可以按照以下步骤更改旋转所围绕的点。\n\
    \n- 1. 按住 Shift 单击 *Woof* 图标并选择“显示”。\n- 2. 单击 *Woof* 以选择该角色，然后单击**造型**选项卡。\n"
