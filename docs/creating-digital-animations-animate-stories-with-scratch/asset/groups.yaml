    \  - It's okay to overlap the curtain and the floor a bit.\n- 3. **Hold down the\
    \ Shift key while you click the Back a Layer button.**\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_69_0.png)\n\
    \n- 4. **Repeat Steps 2 and 3 for the remaining three sections of the wall. Click\
