    - 2. **Click the Scripts tab.**\n- 3. **Drag the following blocks into the Scripts\
    \ Area and change the values to better fit your sprite and scene:**\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_112_0.png)\n\
    \nWhen you click the Green Flag button, you should notice that the character looks\
    \ like it's being pulled across the floor rather than walking.\n\n### ADD A (SLIGHTLY)\
    \ MORE REALISTIC WALK\n\nWhen people walk, they do not just move horizontally\
    \ across the floor. With each step, their entire bodies also move up and down.\
    \ Replacing that GLIDE block with the following code blocks is a quick way to\
    \ make your character's walk more believable:\n\n- 1. **Click the Scripts tab\
    \ for your character's sprite.**\n- 2. **Delete the GLIDE block below the GO TO\
    \ X Y block.** (Shift-click and choose Delete.)\n- 3. Drag and snap the following\
    \ blocks to the bottom of the GO TO block (shown) and change the values to match:\n\
    \n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_113_0.png)\n\nWhen you click the Green\
    \ Flag button, your character has a more realistic walk. You can tweak the WAIT\
    \ values to make your character a bit faster or slower, and change the X and Y\
    \ values for a better-looking stride.\n\n### BROADCAST ANIMATION MESSAGES\n\n\
    When a character reaches its destination, how do you send a message to other sprites\
    \ and backdrops to do their thing? That's where *broadcasting* comes in!\n\n###\
    \ SEND A BROADCAST MESSAGE\n\nLet me show you how I'd broadcast a message that\
    \ *Hector* has entered the room to trigger the lightning flash, a sound effect,\
    \ and the werewolf's sudden appearance:\n\n- 1. Click the **Scripts** tab for\
    \ your character's sprite, and then click the **Events** category.\n- 2. Drag\
    \ and snap a **BROADCAST AND WAIT** block to the bottom of the \"walking\" blocks\
    \ (the REPEAT loop you created in the preceding section).\n\nYou can trigger a\
    \ sound effect at the same time by snapping a PLAY SOUND block between the WHEN\
    \ I RECEIVE and the SET BRIGHTNESS EFFECT blocks:\n\n```\nwhen I receive [Lightning\
    \ v]\nplay sound [pop v]\nset [brightness v] effect to (10)\n```\n\nYou get the\
    \ idea? Each event in your story can trigger as many code blocks as you want to\
    \ use by broadcasting and receiving messages, like a director calling out instructions\
    \ to actors and technicians during a rehearsal.\n\n### SWITCH BETWEEN ANIMATION\
    \ SCENES\n\nTo change scenes in your animation, you need a way to hide sprites\
    \ that make up your first scene and display sprites that make up your second scene,\
    \ as well as change any backdrops that may appear.\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_115_0.png)\n\
    \nHow do you send a message to hide or show several sprites and change backdrops?\
    \ This is another ideal use of broadcasting:\n\n- 1. Add the following code to\
    \ each sprite that you want to show at the beginning of your animation and then\
    \ hide in your second scene:\n"
  mdcn: "\n有些 Scratch 用户甚至不会想到给背景添加代码，但“外观”类别中的几个积木可用于背景。其中一个能帮你把白天变成夜晚：\n\n- 1. **单击舞台按钮**，它位于角色图标的左侧。\n\
    - 2. **单击脚本选项卡。**\n- 3. **单击外观类别。**\n- 4. **在脚本区中，单击一次“将效果设为”积木。**\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_104_0.png)\n\
    \n在“将效果设为”积木中，选择“亮度”，将值改为 **50**，然后单击一次该积木。背景会发生什么变化？它会变得亮不少。如果你把值改为最大值 **100**，背景会完全变白。那么怎样让它变暗呢？试试负数！\n\
    \n## **项目5** *灯光，摄影，开拍！*\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_105_0.png)\n\
    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_105_1.png)\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_105_2.png)\n\
    \n我发现 -35 很适合我的室外场景。我会取消隐藏（按住 Shift 单击并选择“显示”）墙壁、沙发和*赫克托*，看看现在场景的样子。\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_105_3.png)\n\
    \n好多了。但如果我想让室内更暗呢？\n\n### **关灯**\n\n如果你能在整个场景上盖一块黑色幕布，然后让它部分透明，会怎样？这就是“幽灵”效果的用武之地！（提示：它可不只是给幽灵用的。）\n\
    \n- 1. 在舞台下方，单击“绘制新角色”图标。\n- 2. 单击“造型”选项卡。\n- 3. 单击“填充颜色”工具。\n\n当你把“将效果设为”的值改为“幽灵”和\
    \ 35，并单击绿旗按钮时，你的场景会变暗。你可以调整该值以符合自己的喜好。\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_107_0.png)\n\
    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_107_1.png)\n\n### 淡入和淡出\n\n你可以通过逐渐把“幽灵”值从\
    \ 0 改为 100，在场景开始时实现淡入效果。\n\n```\nset ghost effect to 0\nrepeat 100\n    change\
    \ ghost effect by 1\n```\n\n要在场景结束时淡出到黑屏，请将“幽灵”值设为 100，并每次改变 -1：\n\n```\nset ghost\
    \ effect to 100\nrepeat 100\n    change ghost effect by -1\n```\n\n### 摄像机（或者，我该聚焦什么？）\n\
    \n你有没有注意到，动画师会交替使用展示整个场景的远景镜头和可能只展示角色一部分（最常见的是脸部）的特写镜头？\n\n在下面三张图中，我使用“将大小设为”积木，把*赫克托*、窗户和沙发的大小从\
    \ 100% 改为 250%，再改为 500%：\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_108_0.png)\n\
    \n等等！为什么第二张和第三张图里*赫克托*脸部大小的差别这么小？使用**外观**积木时，Scratch 对角色大小的增加幅度有限制。幸运的是，我可以在绘图编辑器中把*赫克托*做得更大。\n\
    \n### 增大造型尺寸\n\n你可以通过将形状编组并使用绘图编辑器最上方的**放大**工具，来增大角色造型的尺寸。在改变造型尺寸之前复制一份造型是个好主意，这样你就能快速切换回原始尺寸：\n\
    \n- 1. 单击**造型**选项卡。\n- 2. 按住 Shift 单击当前造型，并选择**复制**。\n\n摄像机不仅能对角色进行放大和缩小。另一种常用的摄像机技巧是切换视角，比如从正面或侧面看一个角色。\n\
    \n### 创建角色的背面视图\n\n我在项目3结尾处让*佐姆伯塔*背对观众，看起来她正朝远处的营地小屋走去。\n\n下面这组图片展示了我是如何把角色从正面视图改为背面视图的：把头发拉到脸前，然后把她的手臂送到后层。\n\
    \n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_110_0.png)\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_110_1.png)\n\
    \n为每个角色准备好正面和背面视图后，你可以在遭遇场景中在两者之间切换。\n\n如果你不喜欢*佐姆伯塔*身后是一面空白的墙，可以尝试翻转墙壁角色，让窗户出现在另一侧。\n\
    \n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_111_0.png)\n\n### 创建角色的侧面视图\n\n侧面视图最常见的用途是表现角色走路或奔跑。下面展示了如何用**重塑**工具把*赫克托*改成侧面视图：\n\
    \n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_111_1.png)\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_111_2.png)\n\
    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_111_3.png)\n\n你可能会花上几天（甚至几周）来调整每个角色视图。Scratch\
    \ 让之后更换造型变得很容易，所以在确定动画确实需要每个视图之前，不要花太多时间在视图上。\n\n### 开拍！（或者，让故事动起来）\n\n终于到了让你的角色活起来、讲述你的故事，并让你的朋友、家人和同学印象深刻的时候了。如果你感到沮丧，可以看看任何一部动画电影的片尾字幕，提醒自己一部动画故事需要多少人共同完成。如果你对制作过程的某一部分远比对另一部分更感兴趣，也许是时候招募几位合作者了。\n\
    \n### 让角色进入场景的动画\n\n为了节省一点时间，我将使用“廉价”的走路技巧，即角色一直面向镜头并上下弹跳：\n\n- 1. **单击并将你的角色拖到舞台上的*结束位置***（也就是你希望角色进入舞台后停下的位置）。\n\
    - 2. **单击脚本选项卡。**\n- 3. **将以下积木拖到脚本区，并更改数值以更好地适配你的角色和场景：**\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_112_0.png)\n\
    \n当你单击绿旗按钮时，你会注意到角色看起来像是被拖着滑过地板，而不是在走路。\n\n### 添加一个（稍微）更真实的走路动作\n\n人们走路时并不只是在地板上水平移动。每走一步，他们的整个身体也会上下移动。用下面的代码积木替换那个“滑行”积木，是一种快速让你的角色走路更可信的方法：\n\
    \n- 1. **单击你的角色对应的脚本选项卡。**\n- 2. **删除“移到x y”积木下方的“滑行”积木。**（按住 Shift 单击并选择“删除”。）\n\
    - 3. 将以下积木拖动并吸附到“移到”积木的底部（如图所示），并更改数值以匹配：\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_113_0.png)\n\
    \n当你单击绿旗按钮时，你的角色会有更真实的走路动作。你可以调整“等待”值，让角色稍微快一点或慢一点，并更改 X 和 Y 值，以获得更好看的步幅。\n\n\
    ### 广播动画消息\n\n当角色到达目的地时，你如何向其他角色和背景发送消息，让它们执行各自的任务？这就是*广播*的用武之地！\n\n### 发送广播消息\n\
    \n让我展示一下我会如何广播一条*赫克托*已经进入房间的消息，以触发闪电闪光、音效和狼人的突然出现：\n\n- 1. 单击你的角色对应的**脚本**选项卡，然后单击**事件**类别。\n\
    - 2. 将一个**广播并等待**积木拖动并吸附到“走路”积木的底部（即你在上一节创建的重复循环）。\n\n你还可以通过在“当我接收”和“将亮度效果设为”积木之间吸附一个“播放声音”积木，同时触发音效：\n\
    \n```\nwhen I receive [Lightning v]\nplay sound [pop v]\nset [brightness v] effect\
    \ to (10)\n```\n\n明白了吗？故事中的每个事件都可以通过广播和接收消息，触发任意数量的代码积木，就像导演在排练时向演员和技术人员发出指令一样。\n\
    \n### 在动画场景之间切换\n\n要在动画中切换场景，你需要一种方法来隐藏构成第一个场景的角色、显示构成第二个场景的角色，并更改可能出现的任何背景。\n\
    \n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_115_0.png)\n\n你如何发送消息来隐藏或显示多个角色并更改背景？这是广播的另一个理想用途：\n\
    \n- 1. 将以下代码添加到每个你想在动画开头显示、然后在第二个场景中隐藏的角色：\n"
