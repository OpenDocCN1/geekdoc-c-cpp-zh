    \ Leave enough room for the arms and two more cushions.\n"
  mdcn: "\n\n## 在项目之间共享角色\n\n如果你想从多个项目中引入角色，或者想先从一个空白项目开始，处理好背景，然后再引入角色，该怎么办？无论是线上还是离线工作，Scratch\
    \ 都允许你从某个项目导出角色、单个造型和背景，然后将它们导入到另一个项目中。\n\n按住 Shift 键点击角色、造型或背景，然后选择“保存到本地文件”。\n\
    \n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_63_0.png)\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_63_1.png)\n\
    \n使用“从文件上传角色”或“从文件上传造型”按钮，将你的角色加载到新项目中。\n\n如果你在线上工作，且没有权限将文件保存到自己的电脑上，别担心！你可以使用\
    \ Scratch 的“背包”（在线上工作时，它位于“脚本 / 造型 / 声音”页面的底部）。\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_63_2.png)\n\
    \n你可以将角色、背景、造型、脚本和声音拖入或拖出你的“背包”。到目前为止，Scratch 的离线版本还没有“背包”功能。\n\n- 5. 对于地板，请点击“绘图编辑器”画布左下角边缘外侧，然后朝墙的右下角方向拖动。\n\
    - 6. 点击“为形状着色”工具，选择你想要的颜色，然后填充墙和地板的形状。\n\n我为地板选择了深棕色，为墙壁选择了浅棕褐色。\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_64_0.png)\n\
    \n我房子里的大多数墙壁要么有窗户，要么有门。窗户的好处是能帮你看到一天中的时间、天气，或者一个正在寻找下一餐的凶猛怪物：\n\n- 1. 点击“矩形”工具，选择黑色色板，然后拖动“线宽”滑块来调整线条粗细。\n\
    - 2. 点击并拖动来绘制窗户的外部部分。\n- 3. 点击“线条”工具，按住 Shift 键，然后在矩形中间拖动，将形状分成两部分。\n- 4. 按住 Shift\
    \ 键点击，并在上半部分中间向下拖动，以表示上窗中的两块玻璃。\n- 5. 点击“为形状着色”工具，选择浅灰色色板，然后点击窗户内部为其填充颜色。\n\n\
    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_65_0.png)\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_65_1.png)\n\
    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_65_2.png)\n\n添加窗帘会让房间更有色彩，并让人明显看出你是在室内：\n\
    \n- 1. 点击“矩形”工具，然后在窗户左侧点击并拖动。\n- 2. 点击“重塑”工具，按住 Shift 键点击矩形右侧边的中间位置，以添加一个点和一段曲线，然后向左拖动，形成窗帘拉开的样子。\n\
    - 3. 点击并拖动，以调整右上和右下两个点的位置。\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_65_3.png)\n\
    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_65_4.png)\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_65_5.png)\n\
    \n- 4. 点击“为形状着色”工具，选择一种窗帘颜色，然后点击窗帘内部。\n- 5. 点击“复制”工具，点击窗帘，然后将副本拖到窗户的右侧。\n- 6.\
    \ 点击“左右翻转”按钮。\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_66_0.png)\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_66_1.png)\n\
    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_66_2.png)\n\n你可以使用“重塑”工具来调整窗帘的长度，或展示更多窗户区域。\n\
    \n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_66_3.png)\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_66_4.png)\n\
    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_66_5.png)\n\n## 让场景更具沉浸感\n\n如果你希望观众能看到窗外的物体，或者希望角色通过门进出，或躲在树后，该怎么办？与其把墙壁、窗户、地板和门全部放在一个背景中，不如把它们放进一个角色里！Scratch\
    \ 角色比背景灵活得多；角色可以在彼此前后移动、左右移动，还能变大变小。\n\n### 将背景转换为角色\n\n虽然你不能直接将背景转换为角色，但你可以把一个背景拖到一个角色上，它会变成该角色的一个新造型：\n\
    \n- 1. 点击“绘制新角色”按钮。\n- 2. 点击“舞台”按钮（位于实际舞台下方）。\n- 3. 在“背景”选项卡中，点击并拖动包含窗户的背景到你新建的角色上。\n\
    \n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_67_0.png)\n\n- 4. 仍在“背景”面板中时，选择纯白色背景。\n\
    \n如果你没有背景，请点击“绘制新背景”按钮。\n\n- 5. 点击并将新的墙壁角色拖到舞台上的适当位置。\n\n### 设计透视窗户\n\n你可以通过几种方式，让其他角色透过窗户被看到。一种方法是删除窗格内部的颜色，但在这里行不通。你能想出原因吗？你先画了墙的矩形，*然后*在它上面画了窗户。因为这是一个矢量角色，每个对象都在自己的图层上。\n\
    \n相反，在窗户的左侧、右侧、顶部和底部边缘画出不同的墙壁部分，并移除玻璃：\n\n- 1. 选择墙 / 地板 / 窗户角色，然后点击“造型”选项卡。\n\
    - 2. 在“绘图编辑器”画布上，点击墙上的任意位置，然后按键盘上的 Delete 键。\n- 3. 点击“为形状着色”工具，点击空色板，然后点击玻璃。\n\
    \n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_68_0.png)\n\n要让角色从窗户中出现，请将角色移动到合适位置，然后将该角色发送到后层：\n\
    \n- 1. 在舞台上，点击并拖动角色，使其与窗户重叠。\n- 2. 点击窗帘或地板上的任意位置，并按住鼠标或触控板按钮几秒钟，使该角色移到前层。\n\n\
    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_68_1.png)\n\n为了保持窗户透明，你需要将墙壁分成四个部分来绘制，并在窗户周围留出一个空洞：\n\
    \n- 1. **在“绘图编辑器”画布上，点击“矩形”工具。然后点击“实心”选项，并在“绘图编辑器”中选择你墙壁的颜色。**\n- 2. **从右上角正上方开始，点击并拖动，跨越画布一直到窗帘右侧，再向下延伸到地板。**\n\
    \  - 稍微与窗帘和地板重叠也没关系。\n- 3. **按住 Shift 键，同时点击“后移一层”按钮。**\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_69_0.png)\n\
    \n- 4. **对剩余的墙壁三个部分重复步骤 2 和 3。点击画布外部，以确保各部分填充好各自区域。**\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_69_1.png)\n\
    \n当你的新墙壁填充完成后，你可以把一个角色放在窗户内，把另一个角色放在窗外向里看，从而让观众获得更好的纵深感。\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_70_0.png)\n\
    \n为了让场景更具沉浸感，你可以在房间里添加一些角色可以在其前面和后面移动的物体。在戏剧、电影和电视中，这些物体被称为*道具*。\n\n### 打造你自己的家具\n\
    \n没有什么比一张又大又蓬松的沙发更能体现“客厅”了。你可以跟着做，也可以绘制一个更适合你房间（以及你的故事）的其他道具。\n\n绘制道具最简单的方法是把它们分解成更小的部分。尽管大多数沙发靠垫是矩形的，但最好先用椭圆来画，再使用“重塑”工具来获得合适的圆角：\n\
    \n- 1. 点击舞台下方的“绘制新角色”图标。\n- 2. 点击“造型”选项卡，然后点击“转换为矢量”按钮。\n- 3. 点击“椭圆”工具，选择黑色色板，拖动“线宽”滑块来调整线条粗细，然后选择“轮廓”选项。\n\
    - 4. 点击并拖动来绘制第一个靠垫。为扶手和另外两个靠垫留出足够空间。\n\n"
