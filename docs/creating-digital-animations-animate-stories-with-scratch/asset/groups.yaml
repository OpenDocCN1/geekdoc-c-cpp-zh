  mdcn: "\n\n## 引言\n\n- 让你能够浏览、播放和改编其他项目\n- 让你能够分享自己的项目\n- 创建一个可以互相学习的在线社区\n\n现在回顾一下那六个目标的列表。哪里写着“强迫父母、老师、教练或孩子买一本又大又厚的\
    \ Scratch 书”？哪里都没有！那你为什么还在读？难道你不知道现在就可以访问 scratch.mit.edu 开始 Scratch 创作吗？！？\n\n\
    如果你完全是 Scratch 新手，最好从内置教程之一开始。要查看这些教程，请点击右上角的问号。\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_9_0.png)\n\
    \n## 关于本书\n\n在本书中，你可以从任何项目开始。如果你在 Scratch 中没做过多少动画，可能会发现从项目 1 开始很有用，它会引导你创建一个基本的火柴人动画。如果你想设计自己的卡通角色，请查看项目\
    \ 2，我在那里分享了各种技巧（你会发现，要创作出好看的角色，不必是了不起的艺术家）。\n\n### 本书使用的图标\n\n- **提示图标** – *提示图标标记提示和快捷方式，你可以用它们让编程更容易。*\n\
    - **警告图标** – *警告图标提醒你要小心！它标记重要信息，可能让你避免大伤脑筋。*\n\n### 访问 Scratch\n\n要在线使用 Scratch，请访问\
    \ www.scratch.mit.edu，创建在线账户，然后开始 Scratch 创作。要在不创建账户的情况下使用 Scratch，你必须下载并安装 Scratch\
    \ 离线版（参见后面的“离线使用 Scratch”一节）。\n\n严格来说，你可以不使用账户访问 Scratch 网站，但必须将项目保存到自己的电脑上，并且每次访问\
    \ Scratch 网站继续处理时都要重新上传它们。有了账户，你可以在线保存文件，并与其他 Scratch 用户分享项目。\n\n### 创建在线账户\n\n\
    来吧，开始使用 Scratch！打开电脑，打开网页浏览器，访问 scratch.mit.edu。如果你已经有 Scratch 账户，请点击页面右上角的“登录”按钮。如果没有账户，请点击“加入\
    \ Scratch”按钮，并填写简短的在线表单。如果你未满 13 岁或没有电子邮件账户，请让成年人帮你创建账户（或跳到后面的“离线使用 Scratch”一节）。\n\
    \n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_11_0.png)\n\n> 要在线运行 Scratch，你需要一个较新的网页浏览器（Chrome\
    \ 35 或更高版本、Firefox 31 或更高版本，或 Internet Explorer 8 或更高版本），并安装 Adobe Flash Player\
    \ 10.2 或更高版本。Scratch 2 设计支持 1024 × 768 或更大的屏幕尺寸。\n\n### 离线使用 Scratch\n\n你可以安装\
    \ Scratch 2 离线编辑器，在没有 Scratch 用户账户的情况下处理项目。安装 Scratch 2 后，处理项目将不需要互联网连接。此版本可在\
    \ Mac、Windows 和某些版本的 Linux（32 位）上运行。访问 www.scratch.mit.edu/scratch2download 下载并安装\
    \ Adobe AIR（离线运行 Scratch 所需）和 Scratch 2 离线编辑器。\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_13_0.png)\n\
    \nSCRATCH 界面起初可能有点吓人，但当你完成第一个项目时，应该就会相当熟悉了。\n\n- 复制\n- 删除\n- 放大\n- 缩小\n- 积木帮助\n\
    \n### 编辑器选项卡\n\n```\nwhen [green flag] clicked\nmove (10) steps\nsay [Hello!]\
    \ for (2) secs\nstop this script\n```\n\n- 提示\n- 逐步操作\n- 操作方法\n- 关于积木\n\n### 脚本区\n\
    \n- 设置造型中心\n- 垂直翻转\n- 水平翻转\n- 裁剪\n\n脚本   造型   声音\n\n新造型：costume1\n\n清除   添加  \
    \ 导入\n\n### 造型\n\n- costume1\n- costume2\n\n### 工具选项\n\n- 画笔\n- 线条\n- 矩形\n- 椭圆\n\
    - 文本\n- 填充颜色\n- 橡皮擦\n- 选择\n- 复制\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_14_0.png)\n\
    \n- 100%\n- 200%\n\n位图模式  \n转换为矢量\n\n## 项目 1 动画基础\n\n*这里本来应该由我来讲动画史。* 然后描述所有不同种类，给出一大堆例子，还有……（打哈欠）……不了，谢谢！你难道不想现在就动手做动画吗？\n\
    \n在这个项目中，你先用最简单的动画形式之一来讲一个短故事：火柴人。火柴人的一个明显优势是，它们做动画几乎和画出来一样容易。\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_15_0.png)\n\
    \n### 绘制你的第一个角色\n\n来吧，开始画吧！开玩笑的。当然，你必须先创建一个项目，然后才能画任何东西。\n\n### 创建项目\n\n- 1. 转到\
    \ scratch.mit.edu 或打开 Scratch 2 离线编辑器。\n- 2. 如果在线，点击创建。如果离线，选择 文件 ▸ 新建。\n- 3.\
    \ 为项目命名。（在线时，选择标题并输入 Stick Figure Animation。离线时，选择 文件 ▸ 另存为 并输入 Stick Figure Animation。）\n\
    - 4. 删除猫。（按住 Shift 单击并选择删除。）\n\n### 绘制身体部位\n\n对于你的火柴人，需要一个圆作为头，一个矩形作为身体，以及线条作为手臂和腿。最初，分别绘制各个部分可能更容易。\n\
    \n- 1. 点击“绘制新角色”图标。\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_16_0.png)\n\n\
    - 2. 点击“造型”选项卡。\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_18_0.png)\n\n- 2.\
    \ **单击并拖动身体的每个角，将其移到新位置。**\n- 3. **单击并拖动每条手臂的末端，将其放到身体上方的两个角上，也就是肩膀的位置。**\n- 4.\
    \ **单击并拖动每条腿的顶部，将其放到身体下方的两个角上。**\n\n看到*重塑*工具如何帮助你轻松修改火柴人了吗？由于你一直在**造型编辑器**画布上以\
    \ 200% 缩放工作，请检查你的图形在**舞台**（造型编辑器左侧的大区域）上看起来如何。我的线条似乎有点太细了。\n\n### 调整多条线条的粗细\n\n\
    幸运的是，有一种快速方法可以调整构成*矢量角色*的所有线条：\n\n- 1. **点击选择工具。**\n- 2. **在造型编辑器画布上单击并拖过整个图形，以选择所有线条。**\n\
    - 3. **使用线宽滑块增加线条粗细。**\n- 4. **在舞台上检查角色，以确定你的图形的最佳粗细。**\n\n- 4. 如有必要，使用线宽滑块像调整火柴人那样调整线条粗细。\n\
    \n在舞台上比较你的图形和新线条。\n\n### 根据背景调整动作\n\n在每个开合跳姿势中，双脚都应在地面上。你可以把造型编辑器画布的底部当作所有造型的地面，以保持一致。\n\
    \n- 1. 点击你的火柴人角色，然后在“脚本”选项卡上点击 Costume1。\n- 2. 使用选择工具单击并拖过整个图形。\n- 3. 多次按键盘上的向下方向键，直到火柴人的双脚与造型编辑器画布的底部对齐。\n\
    - 4. 如有必要，使用重塑工具将每条腿的底部与窗口底部对齐。\n- 5. 对 Costume2 重复步骤 1–4。\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_21_0.png)\n\
    \n既然可以直接单击并拖动，为什么还要使用向下方向键？因为你不希望意外地左右移动角色（这会让动画看起来抖动）。\n\n返回舞台，点击你的火柴人，然后拖动它，使每条腿的底部与地面对齐。如果你在\
    \ Costume1 和 Costume2 之间切换，双脚现在应该保持在地面上。\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_22_0.png)\n\
    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_22_1.png)\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_22_2.png)\n\
    \n但还是少了点什么。站起来做几个开合跳。说真的！作为动画师，你需要做的一件事就是把每个动作表演出来。\n\n你的双脚全程都接触地面吗？当然不是。为什么它们叫*开合跳*？因为你要跳起来！\n\
    \n### 让开合跳跳起来\n\n现在，如果你切换造型，就像双脚只是在地板上滑动。你需要在 Costume1 和 Costume2 之间添加一个姿势，让手臂和腿位于其他两个姿势的中间，并让身体离开地面。这也是重命名造型的好时机，以免混淆。\n\
    \n- 1. **点击 Costume1**，选择造型名称，然后输入 Arms Up。\n- 2. **点击 Costume2** 并将其重命名为 Arms\
    \ Down。\n- 3. **按住 Shift 单击 Arms Up 造型**，然后选择复制。\n- 4. **单击并拖动新造型向上**，使其位于 Arms\
    \ Up 和 Arms Down 之间。\n- 5. **重命名中间的造型**为 Arms Mid。\n\n"
