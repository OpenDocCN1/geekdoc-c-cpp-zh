  - '[PAGE 27]


    # ## BRING HUMOR TO YOUR ANIMATION


    If you search YouTube or other online video sites, you can find thousands of hilarious
    stick figure animations. What do they all have in common? Like any story, your
    animation should have a beginning, a middle, and an end. But what makes most of
    them funny? Usually, it''s the element of surprise!


    I know nothing is surprising about a stick figure who does ten jumping jacks.
    If you want to make it funny, what could you add to surprise the audience? Right
    now, the jumping jacks are like a story that''s just a middle (no beginning or
    ending).


    To transform this scene into a funny story, you need to answer two questions:


    +   1. **Why is a stick figure doing jumping jacks?**

    +   2. **What could prevent the stick figure from finishing jumping jacks?**


    Watch just about any humorous scene and you will notice a character who really
    wants something and an obstacle preventing the character from getting it. In the
    Pixar movie *Up*, a grumpy old man wants to get away from everybody, so he straps
    all these balloons on his house and then takes off. What goes wrong? An annoying
    little Boy Scout flies off with him.


    Maybe you need a second character, like the little boy in *Up*, or Batman in *The
    Lego Movie*, or Donkey in the *Shrek* movies, or the dog in . . . that''s it!
    Let''s give our stick person a stick pet! A dog that prevents him from finishing
    his morning exercises!


    # ## ADD STICK MAN''S BEST FRIEND


    Here''s another of my favorite Scratch stick figure animation tricks. Instead
    of drawing a new character, you can duplicate your first character and reassemble
    the body parts (a bit like'
  - "[PAGE 28]\n\nDr. Frankenstein). This way, you make sure the characters are the\
    \ right scale and look good together:\n\n+   1. Shift-click Sprite1 and choose\
    \ Duplicate.\n+   2. To rename the two sprites, choose Info and then change the\
    \ names.\n+   \n+      I'll call the first sprite Sticky and the second sprite\
    \ Woof.\n+   3. Click the Back button to exit Info view.\n\nYou should now have\
    \ two sprites. Click the Woof sprite's icon, go to the Costumes tab, and delete\
    \ all but the first costume by clicking the small X on each costume's icon. The\
    \ first costume will be the basis for the new character.\n\n# ## MODIFY PARTS\
    \ TO CREATE A NEW CHARACTER\n\nYou will use the Select tool to rotate the body\
    \ and drag the other body parts into position. Then use the Reshape tool to sculpt\
    \ the dog's head:\n\n+   1. Click the Select tool.\n+   2. Click the body shape.\n\
    +   3. Click the rotate handle (the small circle above the selected shape) and\
    \ drag to rotate the body into a horizontal position.\n+   4. Click and drag the\
    \ arms and legs into position.\n+   5. Click the Reshape tool.\n+   6. Click the\
    \ head, and then click and drag the control points to sculpt the head into more\
    \ of a dog head shape."
