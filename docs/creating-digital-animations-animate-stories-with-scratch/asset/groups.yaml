    +   - **Animate the eyes and eyebrows:** People tend to raise their eyebrows and
    open their eyes a bit wider when asking a question. What other ways can you change
    the eyes when a character speaks? (Your mirror beckons.)

    +   - **Add blinking:** Unless your characters are in a staring contest, try adding
    an occasional blink to make them more realistic (or a wink to get them a date).

    +   - **Animate hands:** Have you noticed how some people move their hands as
    they speak, almost as if they are conducting an orchestra (or trying to distract
