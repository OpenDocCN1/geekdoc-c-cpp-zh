    like it''s being pulled across the floor rather than walking.


    # ADD A (SLIGHTLY) MORE REALISTIC WALK


    When people walk, they do not just move horizontally across the floor. With each
    step, their entire bodies also move up and down. Replacing that GLIDE block with
    the following code blocks is a quick way to make your character''s walk more believable:


    +   1. **Click the Scripts tab for your character''s sprite.**

    +   2. **Delete the GLIDE block below the GO TO X Y block.** (Shift-click and
    choose Delete.)'
