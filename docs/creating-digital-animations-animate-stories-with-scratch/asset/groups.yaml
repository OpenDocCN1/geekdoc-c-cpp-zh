    2. 将“切换造型为”、“等待”和“重复”积木拖放并吸附到脚本区中另外两个积木的底部：


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_94_0.png)


    我用下拉菜单在一个“切换造型为”积木中选择“张开”，在另一个中选择“闭合”。我还把“等待”时间从默认的 1 秒改为 .25 秒，并把“重复”值改为 8。至少，你很可能需要为自己的角色调整“重复”值。你能弄明白原因吗？


    单击绿旗按钮后，我希望在音频播放期间嘴一直张开和闭合。我并不是一开始就知道要开合 8 次才能与音频匹配。第一次我猜的是 10。那太长了，所以我试了 6，最后试了
    8。你需要根据音频长度调整这个值。你也可以为“等待”积木尝试不同的时间，直到得到你想要的效果。


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_94_1.png)


    > 如果你不使用“等待”积木，造型会切换得太快，以至于你看不到造型变化。


    ## 实现更逼真的口型同步


    走到镜子前，站得非常近，盯着自己的嘴，尽可能慢地说 donut 这个词。注意不只是嘴唇，连牙齿甚至舌头也会根据你正在形成的字母或声音以不同方式配合。发 *d*
    时，你的牙齿起初合在一起，舌头抵在上颚。发到 *o* 时，你的嘴张开，然后部分闭合，同时舌头向上弯到上颚，准备发 *n*。发 *u* 时嘴张开，发 *t*
    时又回到与 *n* 相同的位置。


    别担心：你*不*必画出对话中的每一个字母（那会花上永远的时间！）大多数人说话太快，你只能看到少数几个明显不同的口型。如果你不信我，就回到那面镜子前，用你平常说话的方式说“I
    love donuts”。


    要做出更逼真的说话动画，关键在于为嘴在关键时刻形成的形状制作动画，这些关键时刻也称为*关键帧*（发生重要变化的帧）。动画师把你形成元音和辅音时嘴部做出的基本形状称为*音素*。虽然英语字母表有
    26 个字母，但音素要少得多，因为许多字母会重叠，例如 M、P 和 B（双唇闭合），以及 D 和 T（舌头抵住上齿）。


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_95_0.png)


    为了让你和我进度一致，我们让所有角色都说“I love donuts”。（我的意思是，谁*不*爱甜甜圈呢？）我要切换到 Zomberta。要是僵尸尝过那些黏糊糊的果冻甜甜圈，肯定会爱上它们。


    1. **单击将要说话的角色，然后单击“声音”选项卡。**

    2. **单击“录制新声音”按钮。**

    3. **重命名新的声音对象**为 Donuts。

    4. **单击“录制”按钮，并说：“I love donuts。”**

    5. **单击“停止”按钮。**

    6. **选中声波开头处的任何静音部分，然后选择“编辑”→“删除”。**


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_96_0.png)


    当你的甜甜圈录音准备好后，就该选择要添加到角色中的关键音素了。我认为下面这些会最有效：


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_97_0.png)


    明白我说的重复音素是什么意思了吧（#1 用了三次，#3 和 #6 各用了两次）？我没有为 *donuts* 中的 u 或 t 创建音素。你能弄明白原因吗？t
    和 d 是同一个音素，而且当我说 *donuts* 时，重音在第一个音节（“DO-nuts”），所以发 *u* 时我的嘴几乎不张开。


    ## 创建自定义音素造型


    你的句子只需要音素 1、3、4 和 6。如果你想用“张开的嘴”造型作为 #1，只需再创建两个口型：


    1. 选择你想制作动画的角色，然后单击“造型”选项卡。

    2. 按住 Shift 单击“张开的嘴”造型，然后选择“复制”。

    3. 重命名新造型，使其对应你正在创建的新音素口型（例如“D/5/T/E”）。

    4. 使用“重塑”工具把嘴改成想要的音素口型。

    5. 对每个剩余音素重复步骤 2–4。


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_98_0.png)


    *想节省大量动画制作时间吗？为什么不新建一个名为 Talking 的角色，把每个音素做成不同的造型。然后你可以把那张嘴放到舞台上的任何角色上。这个技巧让你能把角色身体和嘴分开制作动画，然后复制该角色，而不必为每个角色创建一套不同的音素。*


    创建好所需音素后，剩下的就是把它们与录音同步。


    ## 切换造型以匹配音素


    确保已重命名所有造型；否则，编写代码会很麻烦：


    1. 选择包含音素造型的角色。

    2. 单击“脚本”选项卡。

    3. **将以下积木拖到脚本区：**


    ```

    ~~~scratch

    when [green flag v] clicked

    play sound [donuts v]

    switch costume to [L, N, TH v]

    wait (1) secs

    ~~~

    ```


    4. **按住 Shift 单击“切换造型为”积木，选择“复制”，然后把副本拖放并吸附到当前积木的底部：**


    ```

    ~~~scratch

    when [green flag v] clicked

    play sound [donuts v]

    switch costume to [L, N, TH v]

    wait (1) secs

    switch costume to [L, N, TH v]

    wait (1) secs

    ~~~

    ```


    5. **重复步骤 4，直到每个音素都有一个“切换造型为”积木和一个“等待”积木。**


    6. **在每个“切换造型为”积木中选择音素。**


    7. **调整“等待”积木的值，使音素造型在播放音频时于恰当的时间出现。**


    我最终的脚本如下（我在 Scratch 外部添加了红色字母，以显示哪些积木对应我的甜甜圈音频的每个部分）：


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_100_0.png)


    最后那个 *M* 口型会在角色说完话时闭上嘴。


    在你掌握 *donuts* 中的音素之后，你应该能够为所有动画角色进行口型同步。关键在于找出任意给定单词或短语中最重要的口型。角色说话越快，你应使用的音素就越少。否则，角色的嘴会动得像疯了一样！


    ## 更多对话技巧


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_101_0.png)


    - **让下颌动起来：** 说话时，不只是嘴唇、牙齿和舌头的事。回到镜子前，看看你发这些音素时下颌在哪里。添加起来很容易：只需使用“重塑”工具微调头部底部。

    - **让眼睛和眉毛动起来：** 人们提问时往往会扬起眉毛，把眼睛睁得更大一些。角色说话时，你还能用哪些方式改变眼睛？（镜子在召唤你。）

    - **添加眨眼：** 除非你的角色在玩对视比赛，否则试着偶尔加一次眨眼，让他们更真实（或者眨一只眼，帮他们约到对象）。

    - **让手动起来：** 你有没有注意到，有些人说话时会挥动手，几乎像在指挥管弦乐队（或者想分散你的注意力，好偷你的钱包）？

    - **试试 Audacity：** Audacity（audacity.sourceforge.net）是一款免费的音频编辑应用程序，能让你比在 Scratch
    中拥有更强的音频编辑控制力。它最大的优势包括：可以放大和缩小声波、显示精确时间信息、加快和放慢音频，以及应用更复杂的声音效果。


    ## 项目 5　灯光、摄像机、开拍！


    你已经想好了一个故事，选好了角色，创建了背景，并录制了一些对话。


    现在，是时候把所有元素组合成一部动画了。本项目融合了设计与编程技巧，可以简化你的动画制作流程。


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_102_0.png)


    ###（并非）从零开始


    你应该先打开一个项目，其中包含你想加入动画的任何角色、背景或声音（最好三者都有）。在本项目中，我会一直使用我的角色、背景和声音，而你应使用你自己的。


    ### 创建夜景


    我想让第一个场景是夜晚赫克托公寓的室内。但如果我设计的角色和背景看起来像这样，该怎么办？

    '
