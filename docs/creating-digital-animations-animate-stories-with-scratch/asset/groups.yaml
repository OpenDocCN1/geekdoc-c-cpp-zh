    # ## SHARE PROJECT FROM THE OFFLINE SCRATCH EDITOR


    If you are using the offline Scratch editor, click the File menu and choose Share
    to Website. You will need to log in with your Scratch account, and then follow
    Steps 2–5 in the preceding section.


    # ## BROADCAST SCRATCH ANIMATION ON ANY WEBSITE


    You have seen how sharing a Scratch project will allow logged-in Scratch users
    to view and remix your projects. You can also display working Scratch projects
    on your own blog or on another website.


    +   1. Go to [www.scratch.mit.edu](http://www.scratch.mit.edu) and log into your
    account.


    +   2. Click the My Stuff button near the top-right part of the web page.


