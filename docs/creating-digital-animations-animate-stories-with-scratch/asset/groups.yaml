    # # PROJECT 5 LIGHTS, CAMERA, ACTION!


    You can trigger a sound effect at the same time by snapping a PLAY SOUND block
    between the WHEN I RECEIVE and the SET BRIGHTNESS EFFECT blocks:


    ```

    ~~~

    when I receive [Lightning v]

    play sound [pop v]

