    # DRAW SCENES WITH PERSPECTIVE


    By using perspective, you can make some objects appear far away while others appear
    to be closer to the viewer. Making the top of the road shape narrower will give
    a better sense of perspective.


    Click the Reshape tool, click the road rectangle to select it, and then click
    and drag the top points closer together.


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_76_0.png)


    > *If you are having trouble getting the top corners of the road to line up with
    the straight horizon or you just want to be lazy like me, try this simple trick.
    Select the sky rectangle, bring it to the front layer (Shift-click on the Forward
    A Layer button), and then drag the bottom down to cover the top of the grass and
    road rectangles.*


    You can adjust the distance between the left and right corners to give a sense
    of the road''s width and length. The best part is that the road acts as a guide
    for the rest of the objects in your scene.


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_76_1.png)'
