    +   1. Click the Reshape tool and then click the legs.

    +   2. Shift-click and drag a new point and curve on each side.

    +   3. Click the Select tool, click the legs, and then drag up.

    +   4. Click the feet and drag them up to the new leg position.


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_53_0.png)


    Rotating the arms was not enough. Now that the werewolf is crouching, I want to
    bend the arms and add some claws! You could draw new claws, but your lazy author
    will simply duplicate the fangs and reshape them to fit each paw:


    +   1. Click the Reshape tool and then click the left arm.

    +   2. Click and drag points into a bent arm position.

    +   3. Click the Duplicate tool, click one set of fangs, and then drag them to
