    # SHARE SPRITES BETWEEN PROJECTS


    What if you want to bring in characters from more than one project or start with
    a blank project, work on your backdrops, and then bring characters in later? Whether
    working online or offline, Scratch allows you to export sprites, individual costumes,
    and backdrops from one project and then import them into another project.


    Shift-click a sprite, costume, or backdrop and select Save to Local File.


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_63_0.png)


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_63_1.png)


    Use the Upload Sprite from File or Upload Costume from File button to load your
    character into a new project.


    If you are working online and do not have permission to save files to your computer,
    fear not! You can use the Scratch Backpack (at the bottom of your Scripts/Costumes/Sounds
    page when working online).


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_63_2.png)


    You can drag sprites, backdrops, costumes, scripts, and sounds into and out of
    your Backpack. To date, the offline version of Scratch does not include a Backpack.'
  - "[PAGE 64]\n\n+   5. For your floor, click off the bottom-left edge of the Paint\
    \ Editor canvas and then drag toward the lower-right corner of the wall.\n+  \
    \ 6. Click the Color a Shape tool, select the color you want to use, and then\
    \ fill the wall and floor shapes.\n+   \n+   I chose dark brown for the floor\
    \ and light tan for the wall.\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_64_0.png)\n\
    \nMost of the walls in my house have either a window or a door. Windows have the\
    \ advantage of helping you see the time of day, the weather, or a vicious monster\
    \ looking for its next meal:\n\n+   1. Click the Rectangle tool, choose the black\
    \ color swatch, and drag the Line Width slider to adjust the line thickness.\n\
    +   2. Click and drag to draw the outer part of the window.\n+   3. Click the\
    \ Line tool, hold down the Shift key, and drag across the middle of the rectangle\
    \ to divide the shape into two parts.\n+   4. Shift-click and drag down the middle\
    \ of the top section to indicate two panes of glass in the upper window.\n+  \
    \ 5. Click the Color a Shape tool, choose the light gray color swatch, and click\
    \ inside the window to fill it with color."
  - '[PAGE 65]


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_65_0.png)


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_65_1.png)


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_65_2.png)


    Adding curtains will bring more color into the room and make it obvious that you
    are inside:


    +   1. Click the Rectangle tool, and then click and drag across the left side
    of the window.


    +   2. Click the Reshape tool, Shift-click midway down the right side of the rectangle
    to add a point and a curve, and then drag to the left for an open-curtain look.


    +   3. Click and drag to adjust the top-right and bottom-right points.


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_65_3.png)


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_65_4.png)


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_65_5.png)


    +   4. Click the Color a Shape tool, choose a curtain color, and then click inside
    the curtain.


    +   5. Click the Duplicate tool, click the curtain, and then drag the copy to
    the right side of the window.'
  - '[PAGE 66]


    # 6  Click the Flip Left-Right button.


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_66_0.png)


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_66_1.png)


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_66_2.png)


    You can use the Reshape tool to adjust the length of the curtain or reveal more
    of the window.


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_66_3.png)


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_66_4.png)


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_66_5.png)


    # MAKE SCENES MORE IMMERSIVE


    What if you want viewers to see objects through a window, or have characters enter
    and exit through doors or hide behind trees? Instead of putting the walls, windows,
    floors, and doors all in one backdrop, you can put them in a sprite! Scratch sprites
    are far more flexible than backdrops; sprites can move behind and in front of
    each other, move from side-to-side, and get smaller and larger.'
  - '[PAGE 67]


    # CHANGE A BACKDROP INTO A SPRITE


    Although you cannot convert a backdrop into a sprite, you can drag a backdrop
    onto a sprite, which will become a new costume on that sprite:


    +   1. Click the Paint New Sprite button.

    +   2. Click the Stage button (below the actual Stage).

    +   3. On the Backdrops tab, click and drag onto the new sprite the backdrop that
    includes your window.


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_67_0.png)


    +   4. While you are still on the Backdrops panel, select the plain white backdrop.


    If you do not have a backdrop, click the Paint New Backdrop button.


    +   5. Click and drag the new wall sprite into position on the Stage.


    # DESIGN SEE-THROUGH WINDOWS


    You can enable seeing other sprites through windows in a few ways. One way is
    to delete the color inside the windowpanes, but that won''t work here. Can you
    figure out why? You drew the wall'
  - '[PAGE 68]


    rectangle first and *then* drew the window over it. Because it''s a vector sprite,
    each object is on its own layer.


    Instead draw a different section of wall to the left, right, top, and bottom edges
    of the window, remove the glass:


    +   1. Select the wall/floor/window sprite and click the Costumes tab.

    +   2. On the Paint Editor canvas, click anywhere on the wall and then click the
    Delete key on your keyboard.

    +   3. Click the Color a Shape tool, click the empty color swatch, and then click
    the glass.


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_68_0.png)


    To make a character appear through the window, move the sprite into position,
    and then send the character to a back layer:


    +   1. On the Stage, click and drag the character(s) to overlap with the window.

    +   2. Click anywhere on the curtain or floor and hold down your mouse or trackpad
    button for a few seconds to make that sprite move to the front layer.


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_68_1.png)'
  - '[PAGE 69]


    To keep the window transparent, you will need to draw the wall in four sections
    and leave a hole around the window:


    +   1. **On the Paint Editor canvas, click the Rectangle tool. Then click the
    Solid option and choose the color of your wall in the Paint Editor.**

    +   2. **Click and drag from just above the top-right corner across the canvas
    to the right side of the curtain and down to the floor.**

    +      - It''s okay to overlap the curtain and the floor a bit.

    +   3. **Hold down the Shift key while you click the Back a Layer button.**


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_69_0.png)


    **4 Repeat Steps 2 and 3 for the remaining three sections of the wall. Click off
    the canvas to ensure the section fills each area.**


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_69_1.png)


    After your new wall is filled, you can give viewers a better sense of depth by
    placing one character inside and placing another outside the window looking in.'
  - '[PAGE 70]


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_70_0.png)


    To make the scene more immersive, you can add something inside the room that the
    character can move in front of and behind. In theater, film, and television, these
    objects are called *props*.


    # ## *BUILD YOUR OWN FURNITURE*


    Nothing quite says “living room” like a big fluffy couch. You can follow along
    or draw a different prop that fits your room (and your story) better.


    The simplest way to draw props is to break them down into smaller parts. Even
    though most couch cushions are rectangular, it is better to begin with an ellipse
    and then use the Reshape tool to get the rounded corners right:


    +   1. Click the **Paint New Sprite** icon below the Stage.

    +   2. Click the **Costumes** tab and then click the **Convert to Vector** button.

    +   3. Click the **Ellipse** tool, choose the black color swatch, drag the **Line
    Width** slider to adjust the line thickness, and then choose the **Outline** option.

    +   4. Click and drag to draw the first cushion.

    +      Leave enough room for the arms and two more cushions.'
  md: "\n## SHARE SPRITES BETWEEN PROJECTS\n\nWhat if you want to bring in characters\
