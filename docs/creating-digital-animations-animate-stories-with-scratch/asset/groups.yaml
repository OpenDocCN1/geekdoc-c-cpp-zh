  - '[PAGE 95]


    in different ways depending on which letters or sounds you are forming. For the
    *d*, your teeth start together and your tongue is at the roof of your mouth. When
    you get to *o*, your mouth is open and then it closes partway while your tongue
    bends up to the roof of your mouth for the *n*. Your mouth opens for the *u* and
    returns to the same position as the *n* for the *t*.


    Don''t worry: You do *not* have to draw every single letter of your dialogue (that
    would take forever!) Most people talk so fast you see only a few distinct mouth
    shapes. If you don''t believe me, go back to that mirror and say, “I love donuts,”
    the way you normally speak.


    The key to getting more realistic speaking animation is to animate the shapes
    the mouth makes at key times, otherwise known as *keyframes* (frames in which
    something important changes). Animators refer to the basic shapes your mouth makes
    to form the vowel and consonant sounds as *phonemes*. Although the English alphabet
    has 26 letters, there are far fewer phonemes because many letters overlap, such
    as M, P, and B (lips together) and D and T (tongue against upper teeth).


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_95_0.png)'
