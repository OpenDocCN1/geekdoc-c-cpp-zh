  - '[PAGE 93]


    # # PROJECT 4 SOUNDS GOOD TO ME


    Did you notice how all the characters I designed in Project 2 start with an open
    mouth? This lets me add teeth or a tongue or both. Then I can just duplicate the
    costume and reshape the mouth for the closed-mouth view.


    +   1. Select the sprite that will be talking, and then click the **Costumes**
    tab.

    +   2. Shift-click the costume with the character’s mouth open and select **Duplicate**.

    +   3. Rename the first costume to *Mouth Open* and the second costume to *Mouth
    Closed*.

    +   4. Select the Mouth Closed costume.

    +   5. Use the Reshape tool to modify the mouth so it appears closed.


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_93_0.png)


    You should now have a character sprite with at least two costumes (Mouth Open
    and Mouth Closed), recorded dialogue, and a short script (two code blocks) that
    makes the audio play as soon as somebody clicks the Green Flag button.


    # ## EASY LIP-SYNCHING


    You will use a sequence of code blocks to alternate between the open- and closed-mouth
    costumes while the audio is playing:


    +   1. Select the sprite that will be talking, and then click the **Scripts**
    tab.'
