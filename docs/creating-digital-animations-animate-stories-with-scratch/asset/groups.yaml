    # ## CREATE PROJECT


    +   1. Go to scratch.mit.edu or open the Scratch 2 Offline Editor.

    +   2. If you are online, click Create. If offline, choose File ▸ New.

    +   3. Name your project. (Online, select the title and type Stick Figure Animation.
    Offline, choose File ▸ Save As and type Stick Figure Animation.)

    +   4. Delete the cat. (Shift-click and select Delete.)


    # ## DRAW BODY PARTS


    For your stick figure, you need a circle for a head, a rectangle for a body, and
    lines for arms and legs. Initially, drawing the parts separately might be easier.


    +   1. Click the Paint New Sprite icon.


    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_16_0.png)


