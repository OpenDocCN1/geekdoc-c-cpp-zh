  mdcn: "\n\n## 项目4：这声音正合我意\n\n*注意：* 如果你的电脑没有连接麦克风，或者你想使用在其他设备（如手机或数码录音机）上录制的音频，请点击**从文件上传声音**按钮，然后跳到“编辑声波”一节。\n\
    \n在开始点击、录制和播放之前，先决定每个声音应该放在哪里是很重要的。\n\n在Scratch中，声音的处理方式与造型和脚本相同。正如每个角色可以有多个不同的造型和积木，每个角色也可以包含多个不同的声音。因为我的角色*Hector*有第一句台词，所以我将在录制前选中他的角色：\n\
    \n1. 点击将要说话（或咆哮、呻吟）的角色，然后点击**声音**标签页。\n2. 按住Shift键并单击**Pop**声音，然后选择**删除**。或者单击**声音**图标上的**X**将其删除。\n\
    \n   默认情况下，每个角色都有*Pop*声音。除非你打算让角色发出“噗”的一声（或让它攻击一卷气泡膜），否则你需要删除该声音。\n3. 点击**录制新声音**按钮。\n\
    \n你可能会认为，只要点击**录制新声音**按钮，Scratch就会立即开始录制。并不是！这个按钮的工作原理与**绘制新造型**按钮相同；它会创建一个声音对象，显示在**声音编辑器**的**新声音**列中。就像使用绘图工具（矩形、直线等）向造型添加形状一样，录制操作会将声音添加到声音对象中。\n\
    \n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_85_0.png)\n\n*如果你的动画中有多个角色，通常最好分别录制每个角色的台词。稍后，你将学习如何使用积木来控制每个声音的播放时机。*\n\
    \n当你说话、咆哮或呻吟时，录制控件的左侧应该会出现一条垂直的绿色条。该条显示你的声音通过麦克风时的响度。随着你的声音变大，你可能看到条顶部附近出现黄色甚至红色。这意味着声音太大，可能会失真。你可以压低声音，或者调整录制按钮下方的麦克风音量滑块。（对于真正的大嗓门，将滑块向左移动；对于你总是问“你说什么？”的那种朋友，则向右移动。）\n\
    \n### 编辑音频片段\n\n编辑录制的声音是Scratch最酷的功能之一！想象一下，你贿赂你的姐姐，让她在你的动画片中为疯狂科学家配音；你费尽心思写下她的台词，点击录制，然后她犯了个错误，或者只是在两个词之间停顿了太久。与其重新录制这些台词，你可以剪掉不想要的部分，就像在绘图编辑器画布上选择并删除一个形状一样容易。\n\
    \n录制完声音后，声音画布上应该会出现类似这样的内容：\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_87_0.png)\n\
    \n那一排黑色弯曲的形状被称为声波，它是你刚刚录制的声音的可视化版本。\n\n▶ 我真的需要告诉你去点击播放按钮来听你的录音吗？说真的？如果你找不到按钮，它就在停止和录制旁边。\n\
    \n既然你已经掌握了录制和播放声音，接下来让我们进入最酷的部分：编辑音频片段！\n\n在编辑较长的音频片段时，你可能会发现展开声音编辑器很有帮助。选择编辑\
    \ → 小舞台布局，或者点击舞台与声音编辑器之间的灰色小三角形，来展开和收缩你的工作区。\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_88_0.png)\n\
    \n### 裁剪声音开头\n\n首先删除声波开头多余的空隙（线条完全平坦的部分）：\n\n1. **选择你录制音频的角色，然后点击声音标签页。**\n2.\
    \ **如果你有多个声音，点击你想要编辑的那一个。**\n3. **使用水平滚动条找到你想使用的声音的开头。**\n4. **在空隙结束处点击声波，然后向左拖动，一直拖到声波的开头。**\n\
    5. **在声波下方，点击“编辑”菜单并选择“删除”。**\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_88_1.png)\n\
    \n好吧，也许你觉得**删除空隙**没那么酷。有点像删除不存在的东西，对吧？但看看这个：每个小团块代表一个单词，而平坦的线条是单词之间的小段空隙（除非你说话像我纽约的朋友们那么快，他们的单词几乎重叠在一起）。\n\
    \n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_89_0.png)\n\n你可以像删除空隙一样删除一个单词：在单词上点击并拖动，然后选择编辑\
    \ → 删除。“编辑”菜单还允许你撤销和重做编辑、复制部分音频并粘贴到其他地方，以及选中整个声波。\n\n### 使用声音编辑效果\n\n*声音编辑器效果*允许你修改声波任意部分的音量，还可以反转声音（试一下很有趣，但对录制的对话没什么用，除非你想让角色被魔鬼附身）。\n\
    \n试着让你录音中的某个单词更响亮：\n\n1. **点击并拖动，选中你希望让声音更大的声波部分。**\n2. **在声波下方，点击“效果”菜单并选择“大声”。**\n\
    \n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_90_0.png)\n\n注意，在应用效果后，声波的该部分看起来变得更高。声音在现实世界中可能是看不见的，但在Scratch中并非如此！\n\
    \n### 使用积木播放声音\n\n你知道如何在声音编辑器中播放声音，但如何让声音随动画一起播放呢？两个积木会让录制的对话在点击舞台上的绿旗按钮时开始播放：\n\
    \n1. 点击你录制对话的那个角色。\n2. 点击“脚本”标签页。\n3. 点击“声音”类别。\n4. 将“播放声音”积木或“播放声音直到结束”积木拖到脚本区。\n\
    5. 点击“事件”类别，然后拖动“当绿旗被点击”积木，将其拼接在“播放声音”积木的顶部：\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_90_1.png)\n\
    \n如果你的角色中存储了多个声音，可以通过“播放声音”积木中的下拉菜单选择要播放的声音。然后当你点击绿旗按钮时，所选的声音就会播放。\n\n“播放声音”和“播放声音直到结束”有什么区别？如果在“播放声音”积木下方拼接了更多积木，这些命令会在声音播放*期间*运行。如果使用“播放声音直到结束”，其他积木要等声音播放完毕后才会运行。\n\
    \n如果你不希望声音立即播放，可以在它上方拼接一个“等待”积木，并设置要等待的秒数：\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_91_0.png)\n\
    \n### 让角色说话动起来\n\n如果你为某个角色录制了对话，下一步自然是让他们看起来像是在说话。你可以通过以下几种方式实现：\n\n- 在播放录好的声音时显示该角色。（废话！）\n\
    - 让角色的嘴巴动起来。（说起来容易做起来难，对吧？）\n- 显示角色正在和谁（或什么）说话。（就像你只看到查理·布朗，而某个隐形的大人正在说：“Whuh\
    \ wuh wh wh whaughh。”）\n- 使用画外音，即你看到该角色，但当他或她开始说话时，你展示其他内容。（你经常在倒叙中看到这种手法：一个角色向你讲述已经发生过的事情，同时你看到一些他或她正在描述的事物。）\n\
    \n你注意到我在项目2中设计的所有角色都是从张着嘴的状态开始的吗？这让我可以添加牙齿、舌头或两者都添加。然后我可以直接复制造型，重新塑造嘴巴，使其呈现闭嘴状态。\n\
    \n1. 选择将要说话的角色，然后点击**造型**标签页。\n2. 按住Shift键并单击角色嘴巴张开的造型，然后选择**复制**。\n3. 将第一个造型重命名为*嘴巴张开*，第二个造型重命名为*嘴巴闭合*。\n\
    4. 选择“嘴巴闭合”造型。\n5. 使用“变形”工具修改嘴巴，使其看起来是闭合的。\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_93_0.png)\n\
    \n现在，你的角色应该至少有两个造型（嘴巴张开和嘴巴闭合）、录制的对话，以及一个简短的脚本（两个积木），只要有人点击绿旗按钮，音频就会播放。\n\n###\
    \ 简易口型同步\n\n当音频播放时，你将使用一系列积木在张嘴和闭嘴造型之间交替：\n\n1. 选择将要说话的角色，然后点击**脚本**标签页。\n\n"
