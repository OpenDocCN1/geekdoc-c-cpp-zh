  - "[PAGE 85]\n\n# # PROJECT 4 SOUNDS GOOD TO ME\n\n*Note:* If you do not have a\
    \ microphone connected to your computer or you want to use audio recorded on a\
    \ different device (such as a phone or a digital recorder), click the **Upload\
    \ Sound from File** button and skip ahead to the “Edit Sound Waves” section.\n\
    \nBefore you start clicking, recording, and playing, it’s important to decide\
    \ where each sound should go.\n\nIn Scratch, sounds are handled the same way as\
    \ costumes and scripts. Just as each sprite can have several different costumes\
    \ and code blocks, each sprite can also contain several different sounds. Because\
    \ my character, *Hector*, has the first line of dialogue, I will select his sprite\
    \ before recording:\n\n+   1. Click the sprite of the character who will be speaking\
    \ (or growling or moaning), and then click the **Sounds** tab.\n+   2. Shift-click\
    \ the **Pop** sound and choose **Delete**. Or click the **X** on the **Sound**\
    \ icon to delete it.\n+   \n+      By default, each sprite has the *Pop* sound.\
    \ Unless you are planning to have your character pop (or have it attack a roll\
    \ of bubble wrap), you need to delete the sound.\n+   3. Click the **Record New\
    \ Sound** button.\n\nYou might think that Scratch would start recording as soon\
    \ as you click the **Record New Sound** button. Nope! That button works like the\
    \ **Paint New Costume** button; it creates a sound object that appears in the\
    \ **New Sound** column of the **Sound Editor**. Like using the Paint tools (Rectangle,\
    \ Line, and so) to add shapes to a costume, recording adds sound to a sound object.\n\
    \n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_85_0.png)\n\n*If you have more than\
    \ one character in your animation, it is generally a good idea to record each\
    \ of their lines separately. Later, you will learn how to use code blocks to control\
    \ when each sound will play.*"
