    \ the Select tool to rotate the tail.\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_34_0.png)\n\
    \nUse a REPEAT block to switch between the Wake and Wag costumes. I think we also\
    \ should add a two-second delay between the dog first waking and then wagging\
    \ its tail. (Surely dogs need a few seconds between waking and showing excitement.)\n\
    \n```scratch\nwhen green flag clicked\nswitch costume to [sleep v]\nwait 2 secs\n\
    switch costume to [wake v]\nwait 2 secs\nrepeat 3\n    switch costume to [wag\
    \ v]\n    wait 0.25 secs\n    switch costume to [wake v]\n    wait 0.25 secs\n\
    ```\n\n## TALK LIKE A MAN\n\nThe characters are stick figures, so I think it works\
    \ best to “stick” (pretty hilarious, right?) to speech bubbles, rather than recorded\
    \ sounds and voices. (You use digital audio in Project 4.) You could draw a speech\
    \ bubble into a new costume or make a separate sprite, but I find using the SAY\
    \ blocks easier.\n\nI want my figure to speak WHILE doing jumping jacks. If I\
    \ put a SAY block inside the REPEAT block, Sticky will keep saying the same thing\
    \ over and over until the last jumping jack is finished.\n\nWhat is a poor little\
    \ animator to do?\n\nScratch can have different chunks of code running at the\
    \ same time on different sprites and even within the same sprite. This means you\
    \ can keep your current gliding and jumping jacks code blocks on the stick figure,\
    \ add a second WHEN GREEN FLAG\n\n## 总体国家安全观\n\n国家安全是指国家政权、主权、统一和领土完整、人民福祉、经济社会可持续发展和国家其他重大利益相对处于没有危险和不受内外威胁的状态，以及保障持续安全状态的能力。\n\
    \n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_36_0.png)\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_37_0.png)\n\
    \n## PROJECT 2 ANIMATE GREAT CHARACTERS\n\nENOUGH WITH STICK PEOPLE! In this project,\
    \ you create a unique cast of characters by using vector-drawing tools and then\
    \ you learn a few design techniques to help bring them to life.\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_38_0.png)\n\
    \n### KEEP IT SIMPLE, STUPID\n\nWhen I was younger, I learned that KISS means\
    \ more than just smacking your lips into somebody. It can stand for Keep It Simple,\
    \ Stupid. The more complex your characters are, the harder it is to animate them.\
    \ So keep your character design simple, dummy!\n\n... draw a simple line for a\
    \ mouth ...\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_40_0.png)\n\n... and then\
    \ fill each face with a different color:\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_40_1.png)\n\
    \nWow, I don't know what you see, but I see a zombie, a person, and a werewolf!\n\
    \n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_40_2.png)\n\nTo keep it simple, I will\
    \ create a story that involves these three characters and explore ways to bring\
    \ the characters and their world to life.\n\n### GETTING A HEAD START\n\nBefore\
    \ starting, take a moment to think about the story you want to tell and the characters\
    \ who would be the most fun to bring to life. If you don't have a good idea yet,\
    \ don't worry, you can start messing around with a few characters and see where\
    \ they lead you.\n\n### CREATE A NEW PROJECT\n\n- 1. Go to scratch.mit.edu or\
    \ open the Scratch 2 Offline Editor.\n- 2. If you are online, click Create. If\
    \ offline, choose File > New.\n- 3. Name your project. (Online, select the title\
    \ and type Animation Characters. Offline, choose File > Save As and type Animation\
    \ Characters.)\n- 4. Delete the cat!\n\n### PAINT A NEW SPRITE\n\n- 1. Click the\
    \ Paint New Sprite icon.\n- 2. Click the Costumes tab.\n- 3. Click the Convert\
    \ to Vector button.\n- 4. Click the Ellipse tool.\n- 5. Click the Outline option.\n\
    - 6. Choose the black color swatch.\n- 7. Click and drag to draw a head and two\
    \ eyes.  \n  You can hold down the Shift key to draw a perfect circle.\n- 8. Draw\
    \ two more ellipses for eye pupils.\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_41_0.png)\n\
    \n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_42_0.png)\n\nIf you want your eyes\
    \ to be exactly the same size, use the Duplicate tool to make exact copies.\n\n\
    Is your character beginning to emerge? If not, perhaps a bit of hair will help.\n\
    \n### QUICK HAIRSTYLING\n\nYou can draw hair with the Pencil tool or sculpt it\
    \ by using the Reshape tool on an ellipse or a rectangle. I will combine techniques\
    \ to get a unique hairstyle for my zombie:\n\n- 1. Click the Ellipse tool.\n-\
    \ 2. Click the Solid option.\n- 3. Choose a color swatch for your hair color.\n\
    - 4. Click and drag right over your character’s face.\n- 5. Shift-click the Back\
    \ a Layer button to send the hair to the bottom layer (behind the head and eyes).\n\
    - 6. Click the Reshape tool.\n- 7. Click the hair to select it.\n- 8. Click and\
    \ drag control points to style your hair.\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_42_1.png)\n\
    \nThe Pencil tool is better at drawing jagged shapes, like zombie hair bangs!\n\
    \n- 1. Click the Pencil tool.\n- 2. Choose a color swatch.\n- 4. **Click the Select\
    \ tool, click the mouth, and then use the Line Width slider to adjust the line\
    \ thickness.**\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_44_0.png)\n\n### GIVE\
    \ ’EM A NOSE JOB\n\nAlthough some zombies may have lost a nose in their travels,\
    \ I think my little ghoul could use a petite schnoz. Use the Pencil tool to draw\
    \ the nose on yours and then use the Reshape tool to smooth it.\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_44_1.png)\n\
    \nNose placement can affect your character as much as the location of the eyes\
    \ and mouth, so you might want to try a few positions before you lock in your\
    \ face for all eternity.\n\n### A LITTLE BODY WORK\n\nHaving the body, arms, and\
    \ legs as separate objects makes characters easier to animate.\n\n- 1. **Click\
    \ the Ellipse tool, choose your outline color, and then draw an oval the approximate\
    \ size you want for the body.**\n\nI’ll choose classic black for my outline color.\n\
    \n- 2. **Click the Color a Shape tool, choose a color for the character’s shirt\
    \ or dress, and then click inside the initial body shape.**\n\n- 3. Click the\
    \ Reshape tool, click the body to select it, and then click and drag points into\
    \ the shape that looks best to you.\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_45_0.png)\n\
    \n### ADD SIMPLE LEGS\n\nYou can use the Rectangle tool to draw the legs together,\
    \ use the Reshape tool to taper them at the ankles, and then fill them in with\
    \ the pants, tights, or zombie skin color of your choice.\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_45_1.png)\n\
    \nSomething doesn’t look right. Oh yeah! I don’t want the zombie’s dress to be\
    \ too short. Shift-click the Back a Layer button so the legs appear behind the\
    \ body. Then draw an ellipse and reshape it into shoes.\n"
  mdcn: "\n## 让狗动起来\n\n我想终于该让狗活起来了，你觉得呢？为 Woof 设计一个醒着的造型：\n\n- 1. 按住 Shift 单击 Woof\
    \ 的睡觉造型，然后选择“复制”。\n- 2. 将造型重命名为“醒来”。\n- 3. 单击选择工具。\n- 4. 单击并向上拖动狗的头一点（或者你可以使用向上箭头键进行更精确的移动）。\n\
    - 5. 单击并拖动，将尾巴向上旋转。\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_33_0.png)\n\n\
    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_33_1.png)\n\n## 为让火柴狗动起来添加代码\n\n时机在动画中至关重要，尤其当有两个或更多角色互动时。你能算出狗应该等多少秒才醒来吗？回看\
    \ *Sticky* 上的代码：滑行进来用三秒，然后在开始开合跳前暂停一秒。所以狗应该等大约五秒，对吧？\n\n- 1. 单击“脚本”选项卡。\n- 2.\
    \ 如果你像我一样复制了火柴人角色来制作狗，该选项卡中应该已经有开合跳代码。按住 Shift 单击 `WHEN GREEN FLAG CLICKED` 积木，然后选择“删除”。\n\
    \n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_33_2.png)\n\n- 3. **将以下代码积木拖到脚本区，并修改数值以匹配：**\n\
    \n```scratch\nwhen green flag clicked\nswitch costume to sleep\nwait 5 secs\n\
    switch costume to wake\n```\n\n单击绿旗按钮，狗应该睡五秒，然后通过抬起头和尾巴来表示醒来。狗接下来可能会做什么？当我进入有狗的房间时，它通常会开始摇尾巴。\n\
    \n## 让尾巴摇起来\n\n要快速摇尾巴，复制“醒来”造型，将新造型重命名为 **摇尾**，并使用选择工具旋转尾巴。\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_34_0.png)\n\
    \n使用 `REPEAT` 积木在“醒来”和“摇尾”造型之间切换。我想我们还应该在狗刚醒来和开始摇尾巴之间加两秒延迟。（狗肯定需要几秒钟从醒来到表现兴奋。）\n\
    \n```scratch\nwhen green flag clicked\nswitch costume to [sleep v]\nwait 2 secs\n\
    switch costume to [wake v]\nwait 2 secs\nrepeat 3\n    switch costume to [wag\
    \ v]\n    wait 0.25 secs\n    switch costume to [wake v]\n    wait 0.25 secs\n\
    ```\n\n## 像人一样说话\n\n角色是火柴人，所以我认为最好“stick”（很搞笑，对吧？）用对话气泡，而不是录制的声音和语音。（你在项目4中使用数字音频。）你可以把对话气泡画进新造型，或制作一个单独的角色，但我发现使用\
    \ `SAY` 积木更容易。\n\n我想让我的角色一边做开合跳一边说话。如果我把 `SAY` 积木放进 `REPEAT` 积木里，Sticky 会一遍又一遍地说同一句话，直到最后一个开合跳结束。\n\
    \n一个可怜的小动画师该怎么办呢？\n\nScratch 可以让不同的代码块在不同角色上同时运行，甚至在同一角色内同时运行。这意味着你可以把当前的滑行和开合跳代码块保留在火柴人上，再添加第二个\
    \ WHEN GREEN FLAG\n\n## 总体国家安全观\n\n国家安全是指国家政权、主权、统一和领土完整、人民福祉、经济社会可持续发展和国家其他重大利益相对处于没有危险和不受内外威胁的状态，以及保障持续安全状态的能力。\n\
    \n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_36_0.png)\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_37_0.png)\n\
    \n## 项目2 让了不起的角色动起来\n\n受够火柴人了！在这个项目中，你将使用矢量绘图工具创建一组独特的角色，然后学习一些设计技巧，帮助它们活起来。\n\
    \n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_38_0.png)\n\n### 保持简单，笨蛋\n\n我年轻时了解到，KISS\
    \ 不只是把嘴唇贴到别人身上。它可以代表 Keep It Simple, Stupid（保持简单，笨蛋）。你的角色越复杂，给它们做动画就越难。所以，傻瓜，让你的角色设计保持简单！\n\
    \n……为嘴巴画一条简单的线……\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_40_0.png)\n\n……然后给每张脸填充不同的颜色：\n\
    \n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_40_1.png)\n\n哇，我不知道你看到了什么，但我看到了一个僵尸、一个人和一个狼人！\n\
    \n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_40_2.png)\n\n为了保持简单，我将创作一个涉及这三个角色的故事，并探索让角色及其世界活起来的方法。\n\
    \n### 抢先一步\n\n开始之前，花点时间想想你想讲的故事，以及哪些角色最适合做成动画。如果你还没有好主意，别担心，你可以先随便摆弄几个角色，看看它们会把你带向哪里。\n\
    \n### 创建新项目\n\n- 1. 访问 scratch.mit.edu 或打开 Scratch 2 离线编辑器。\n- 2. 如果在线，单击“创建”。如果离线，选择“文件\
    \ > 新建”。\n- 3. 给你的项目命名。（在线时，选择标题并输入 Animation Characters。离线时，选择“文件 > 另存为”并输入 Animation\
    \ Characters。）\n- 4. 删除猫！\n\n### 绘制新角色\n\n- 1. 单击“绘制新角色”图标。\n- 2. 单击“造型”选项卡。\n\
    - 3. 单击“转换为矢量”按钮。\n- 4. 单击椭圆工具。\n- 5. 单击“轮廓”选项。\n- 6. 选择黑色色块。\n- 7. 单击并拖动以画出一个头和两只眼睛。\
    \  \n  你可以按住 Shift 键画出正圆。\n- 8. 再画两个椭圆作为瞳孔。\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_41_0.png)\n\
    \n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_42_0.png)\n\n如果你想让两只眼睛大小完全一致，使用“复制”工具制作完全相同的副本。\n\
    \n你的角色开始成形了吗？如果没有，也许加点头发会有帮助。\n\n### 快速发型设计\n\n你可以用铅笔工具画头发，也可以对椭圆或矩形使用“重塑”工具来塑造头发。我会结合这些技巧，为我的僵尸打造独特发型：\n\
    \n- 1. 单击椭圆工具。\n- 2. 单击“实心”选项。\n- 3. 选择用于头发颜色的色块。\n- 4. 在角色脸部正上方单击并拖动。\n- 5. 按住\
    \ Shift 单击“后移一层”按钮，将头发移到最底层（头和眼睛后面）。\n- 6. 单击“重塑”工具。\n- 7. 单击头发以选中它。\n- 8. 单击并拖动控制点来设计发型。\n\
    \n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_42_1.png)\n\n铅笔工具更擅长绘制锯齿状形状，比如僵尸刘海！\n\
    \n- 1. 单击铅笔工具。\n- 2. 选择一个色块。\n- 4. **单击选择工具，单击嘴巴，然后使用“线宽”滑块调整线条粗细。**\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_44_0.png)\n\
    \n### 给它们做个鼻子\n\n虽然有些僵尸在旅途中可能丢了鼻子，但我觉得我的小食尸鬼可以用一个小巧的鼻子。用铅笔工具给你的角色画鼻子，然后用“重塑”工具把它变平滑。\n\
    \n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_44_1.png)\n\n鼻子的位置对角色影响很大，和眼睛、嘴巴的位置一样，所以在永久锁定面部之前，你也许想多试几个位置。\n\
    \n### 做点身体工作\n\n将身体、手臂和腿作为独立对象，会让角色更容易做动画。\n\n- 1. **单击椭圆工具，选择轮廓颜色，然后画出大小大致符合身体需要的椭圆。**\n\
    \n我会选择经典的黑色作为轮廓颜色。\n\n- 2. **单击“给形状上色”工具，为角色的衬衫或连衣裙选择颜色，然后单击初始身体形状内部。**\n\n- 3.\
    \ 单击“重塑”工具，单击身体以选中它，然后单击并拖动控制点，调整成你觉得最好看的形状。\n\n![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_45_0.png)\n\
    \n### 添加简单的腿\n\n你可以使用矩形工具把两条腿一起画出来，用“重塑”工具在脚踝处把它们收窄，然后用你选择的裤子、紧身裤或僵尸肤色填充。\n\n\
    ![](img/4bf9ba0253c33fcb16d2bd3d8eb1b121_45_1.png)\n\n有些地方看起来不对。哦对！我不想让僵尸的连衣裙太短。按住\
    \ Shift 单击“后移一层”按钮，让腿出现在身体后面。然后画一个椭圆，并把它重塑成鞋子。\n"
