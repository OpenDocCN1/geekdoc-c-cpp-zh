    # Chapter 1 - Starting C++ Language Programming


    This chapter presents a brief overview of C++ programming. `C++` was designed
    with a basis toward system programming with high performance, efficiency and flexibility
    of use as its design highlights. This chapter presents the things needed in starting
    C++ programming.


    ## Brief history of C++


    The `C++` programming language has a history path in 1979. `Bjarne Stroustrup`,
    a Danish computer scientist, is working with the language called `Simula`, which
    is a language principally intended for simulations. The `Simula 67` language underpins
    object-oriented programming paradigm. Stroustup started working with `C` with
    classes. `C` is considered as middle-level language which has the power of Low-level
    language but has high-level language features and `C` is considered as the predecessor
    of `C++`. `Bjarne Stroustrup`, at Bell Labs designed `C++` in the early 80s, as
    an object oriented language based on the `C` language, which powered pretty much
    all systems software since its creation in 1972. The first `C` with Classes compiler
    was called `Cfront`, which was derived from a `C` compiler called `CPre`. `C++`''s
    goal is to add object-oriented programming into `C` language. The `++` operator
    in the `C` language is an operator for incrementing a variable, which gives some
    insight into how Stroustrup regarded the language. In 1985, Stroustrup''s reference
    to the language entitled "The C++ Programming Language" was published.


    ## Reasons to use C++


    To start with, `C++` is highly recommended for beginning programmers in starting
    their programming career because `C++` covers both procedural and object-oriented
    programming approach. Once someone learned the concepts behind programming language
    with `C++`, adopting or migrating to other programming language will be a lot
    easier whether it''s object-oriented or procedural-oriented programming, as most
    of the things needed are pretty similar.


    `C++` has been around a while and it has solved several industry challenges considering
    that it is also the primary language that drives the mobile experience today.
    In addition to high performance server and middleware, `C++` is a great choice
    for client side development on the two most popular mobile platforms `Android`
    and `iOS` and the two most popular desktop platforms, `Windows` and `Mac OS X`.
    With the recent introduction of developer tools that enable, among other things,
    visual design for clients, middleware, and server side apps; `C++` is extremely
    productive and really makes it a great choice for modern app development, so learning
    the basics of `C++` will make someone be competitive in the industry''s stiff
    competition.


    This book will bring the world of C++ programming closer to you.


    ## Beginning to Program in C++ Language


    All the `C++` programs are written into text files with extension `.cpp` for example
    `hello.cpp`, where `.cpp` is the extension file name. These text files are called
    source files. The source files contains the C++ source codes and will later be
    transformed into a running executable file. The program development cycle of C++
    language are:


    1. Write the source codes into a text editor (ex: `notepad`) to create the source
    file.

    2. Compile the source file to create the object file.

    3. The object file is link into an executable (ex: `.exe` for windows) file.

    4. Run the program and see the result.


    Based from the program development cycle of `C++`, notice that there are several
    things needed which includes a text editor, a compiler, and a linker. The good
    news is that, for Windows users, there is a software that comprises the three.
    It is called `Dev-C++` which is available at [http://bloodshed.net](http://bloodshed.net/)
    and for the download direct link at [http://bloodshed-dev-c.en.softonic.com/download](http://bloodshed-dev-c.en.softonic.com/download).


    `Dev-C++` is a C++ source code editor, a compiler, and a linker. All the things
    needed in creating a C program.


    Note: You may ought to use other compilers as the sample codes in this book will
    work just fine.


