    ### C++ Programming Language: Simple, Short, and Straightforward Way of Learning
    C++ Programming


    Copyright 2016 - KDP Edition


    Sherwyn Allibang


    Edition License Notes


    This book is authorized for your own personal use. This book may not be re-sold
    or offered away to other individuals. Much thanks to you for regarding the diligent
    work of the author.


    Introduction


    This book is for absolute beginners with or without prior knowledge in programming,
    as this book uses **S**imple words, **S**hort sentences, and **S**traightforward
    paragraphs. The triple **S** way of learning C++ programming. C++ (pronounced
    as cee plus plus) is a general-purpose programming language. The main object of
    C++ is to add object-orientation to its predecessor C language. C++ has imperative,
    object-oriented and generic programming features, while also providing facilities
    for low-level memory manipulation. There are also other useful features added
    to C++ such as inheritance and polymorphism. The topics covered in this book includes
    brief introduction to C++ programming, variables, data types, control structures,
    functions, pointers, and file management of external files. This book starts its
    discussion from short history to installation of the needed software resource
    and a step by step screen shots of how to write C++ programming code, compile
    and execute C++ programs. It presents graphical representation of algorithms for
    simpler learning. This book is packed with working and running C++ program samples
    and after reading this book, the reader would be able to develop and create C++
    language programs based particularly from problems given in computer science courses,
    hence, adopting to other programming language will be a lot easier**. This book
    is your initial step in your programming career.**


    TO GOD BE ALL THE GLORY!


    The resources used in this book are:


    > Personal Computer running Windows 7 Operating System


    > Dev-C++ available at [http://bloodshed.net](http://bloodshed.net/)


    Other Operating Systems can also be used and you may also ought to use other C++
    compilers or IDE.


    **NOTE:** All links provided in this book are updated occasionally. If a link
    becomes unavailable, email me at zherwyndbest@facebook.com


