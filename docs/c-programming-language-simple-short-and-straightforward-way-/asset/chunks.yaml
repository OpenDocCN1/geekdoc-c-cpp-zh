    \ 2 行展示了将程序引入 `\"string\"` 库。第 6 行声明了一个字符串数据类型，它是字符串库的一部分。第 8 行使用 `cin` 接收字符串并将输入的字符串赋值给变量\
    \ `strFname`。图 4.10 展示了程序的示例输出。\n\n图 4.10\n\n![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_a382897.png)\n\
    \n#### 图 4.9 的代码列表\n\n```cpp\n#include<iostream>\n#include<string>\n\nusing namespace\
    \ std;\n\nint main()\n{\n    string strFname;\n    cout<<\"What is your first\
    \ name:\";\n    cin>>strFname;\n    cout<<\"Your name is \"<<strFname;\n    fflush(stdin);\n\
    \    getchar();\n    return 0;\n}\n```\n\n然而，`cin` 提取总是将空格、空白符、制表符和换行符视为提取值的终止符，因此提取字符串意味着总是提取单个单词，而不是短语或整个句子。例如，如果程序要求用户的全名，如果用户输入了\
    \ \"Sherwyn Allibang\"，接收到的值只有 \"Sherwyn\"，因为空格被视为终止符，因此 \"Allibang\" 被忽略了。\n\n\
    要从 `cin` 获取整行内容，存在一个名为 `getline` 的函数，它将流 (`cin`) 作为第一个参数，将字符串变量作为第二个参数。\n\n####\
    \ `getline()` 函数的语法：\n\n```\ngetline(cin,<str-varname>);\n```\n\n图 4.11 展示了一个使用\
    \ `getline()` 函数的示例程序。\n\n图 4.11\n\n![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m7c8d0.png)\n\
    \n"
