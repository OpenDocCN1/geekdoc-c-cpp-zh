    ### 1.1 Nested for() loop statement


    A `for()` loop statement can also be executed within another `for()` loop statement.
    This is called nesting. The following statements illustrates the concept.


    ```cpp

    for(<ctr1-init>;<ctr1-condition>;<ctr1-modifier>)

    {

    for(<ctr2-init>;<ctr2-condition>;<ctr2-modifier>)

    {

    <statement(s)>;

    }

    }

    ```


    A nested `for()` loop has no limits to how many nest can it have as long as it
    conform to the syntax. Typically, the first loop is called outer loop, and the
    loop inside is called a inner loop. Figure 8.3 presents a sample program that
    uses a nested `for()` loop statement which prints numbers 1 to 10 and the character
    ''X'' several times base on the current number being printed.


    Figure 8.3 (source file name: ch8sample2.cpp)


    ![](tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m46ac4acc.png)


    Line 5 declares two integer variables for the two `for()` loops'' counter named
    `iCtr1` for `loop1` (outer `for` loop) and `iCtr2` for `loop2` (inner `for` loop).
    Line 7 starts the first `for()` loop statement. The initial value of `iCtr1` is
    set to 1\. Evaluating the condition, this outer loop executes as long as `iCtr`
    is less than or equal to 10\. On first execution which evaluates to true, line
    9 is executed.


    Line 9 contains the second `for()` loop (inner for loop) statement. Here, the
    initial value of `iCtr2` is set to 1, and the counter condition will execute this
    loop as long as `iCtr2` is less than or equal to `iCtr1`. Because `iCtr2` is less
    than or equal to `iCtr1`, line 11 is executed, printing an ''X'' on-screen. `iCtr2`
    is then incremented, and the loop continues until `iCtr2` becomes greater than
    `iCtr1\. When `iCtr2` is greater than `iCtr1`, the `for()` loop (inner loop) ends,
    and control goes back to line 7 (outer loop), incrementing `iCtr1` and evaluates
    again the counter condition of the `for()` loop (outer loop) in line 7\. As long
    as `iCtr1` is less than or equal to 10, the `for()` loop (inner loop) in line
    8 is re-executed until the counter condition in the outer loop evaluates to false.
