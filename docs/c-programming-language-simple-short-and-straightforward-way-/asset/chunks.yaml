    \ from the file\" << endl;\ninfile >> data;\n// 将数据写到屏幕。\ncout << data << endl;\n\
    // 再次从文件中读取数据并显示。\ninfile >> data;\ncout << data << endl;\n// 关闭已打开的文件。\ninfile.close();\n\
