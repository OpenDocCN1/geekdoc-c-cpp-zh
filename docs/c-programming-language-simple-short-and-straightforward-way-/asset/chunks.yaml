    the range column, there are no value that represents the alphabet, because alphabet
    characters are stored in the computer''s memory in form of binary numbers, hence
    the range is definitely in numeric value. However, each character including the
    alphabet has an equivalent numeric value which corresponds to the 255 characters
    found in the keyboard including the alphabet and special characters like ! ? $.
    The data type used for these characters is the data type Character (`char`).


