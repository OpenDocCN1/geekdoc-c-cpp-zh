    However, cin extraction always considers spaces such as whitespaces, tabs, and
    new-lines as terminator of the value being extracted, and thus extracting a string
    means to always extract a single word, not a phrase or an entire sentence. For
    example, if the program ask for the complete name of the user, if the user entered
    "Sherwyn Allibang", the accepted value is only "Sherwyn" because the space is
    considered a terminator, hence "Allibang" is disregarded.


    To get an entire line from cin, there exists a function, called getline, that
    takes the stream (cin) as first argument, and the string variable as second.


    Syntax of getline() **function**:


    getline(cin,<str-varname>);


