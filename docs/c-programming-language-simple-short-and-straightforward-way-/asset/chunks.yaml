    \ 或 `fstream` 对象而不是 `cout` 对象。\n\n## 从文件读取\n\n程序员使用流提取运算符（`>>`）将信息从文件读取到程序中，就像使用它从键盘输入信息一样。唯一的区别是，应该使用\
    \ `ifstream` 或 `fstream` 对象而不是 `cin` 对象。\n\n图 14.1 展示了一个示例程序，该程序以读写混合模式打开一个文件。在将用户输入的信息写入名为\
    \ `data.txt` 的文件后，程序从文件中读取信息并将其输出到屏幕上。\n\n图 14.1（源文件名：`ch14sample1.cpp`）\n\n![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_2b1f03f1.png)\n\
    \n![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_444d442.png)\n\n第 2\
