    ## Chapter 2 - Our First C++ Program


    This chapter presents the "know how" of writing, compiling, and running C++ language
    programs. It presents a detailed discussions on the steps to be undertaken.


    ### Definition of programming terms


    The following terms are defined conceptually and operationally in order to have
    a common understanding of the terms used in this book.


    - **Argument**: Arguments are actual value being pass to a function.

    - **Bug**: A bug is a general term used to describe any unexpected problem with
    the program during execution or when the programming is already running.

    - **Block**: A block is composed of two or more C statements. Also called compound
    statements. A block is enclosed with a pair of { } braces.

    - **CamelCase**: CamelCase is the naming convention for compound word which uses
    capital letters to delimit the word parts. For example, `studName`, `studAge`,
    and `intNum`.

    - **Clause**: A section in the statement.

    - **Code**: It is the term used for statements written that make up a C program.

    - **Condition**: A statement that evaluates to either true (non zero) or false
    (zero).

    - **Data Type**: it the type of data being stored to a storage location like variable.

    - **Debug**: This refers to the process of examining and removing errors from
    a program''s source code.

    - **Expression**: It is a statement that result to a numeric value.

    - **Function**: Function perform a specific task.

    - **Label**: Label is used a give details to a certain line of code in C language,
    hence this labels are ignored by the compiler, thus it does not affect the output
    of the program. Usually used for internal documentation.

    - **Null**: In computer programming, null is the term used for an uninitialized,
    undefined, empty, or meaningless value.

    - **Parameter**: Parameters are argument declaration of a function.

    - **Statement**: A statement is a complete direction instructing the computer
    to carry out some task. In C, statements are usually written one per line, although
    some statements span multiple lines. This term can be interchangeably use with
    code.

    - **Syntax**: Syntax is the grammar, structure, or order of the elements in a
    C language or any other programming language statement. (Semantics is the meaning
    of these elements.)

    - **Variable**: Variables are storage location for data in C programs.


    ### The components of a C++ program


    Lets discuss the components of a C++ programs through a sample program. This program
    prints the word "Hello World!" into the screen. The code listings is presented
    in figure 2.1


    Figure 2.1 (source file name: hello.cpp)


    ![](tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m29c65458.png)


    The line numbers on the left most part of figure 2.1 are not part of the source
    code. This line numbers are just included for referencing with the discussion.
    This is done in all sample programs in this book.


    The compiler of C++ programs reads the source file from top to bottom and from
    left to right reading one line after another and note that C++ is a case sensitive
    language. The following are the explanations for each line of codes.


    **Note:** the `<>` angle brackets and the word inside which is used in the syntax
    represents that it should be replaced with an appropriate instruction code.


    Code listings of figure 2.1


    ```cpp

    #include<iostream>


    using namespace std;


    int main()

    {


    //The line below prints a string

    cout<<"Hello World!";


    getchar();

    return 0;

    }

    ```


    **Line 1.** `#include<iostream>`


    This line includes a C++ library for the use of the program. The inclusion of
    library in C++ program usually comes first.


    Syntax `#include` directive:


    `#include<<lib-name>>`


    The `<lib-name>` in the syntax should be replaced with the library name. The other
    term for library is "include file" because literally, a library is a separate
    disk file that contains information needed by the program or the compiler.


    The `#include` directive instructs the C++ compiler to add the contents of library
    or include file (sometimes called "Header files") into the program during compilation.
    The library files usually comes with the compiler, hence in Dev-C++, several libraries
    comes with its default installation. These library files should have a `.h` file
    extension.


    In line 1, the library included is the `iostream` which stands for **input/output
    stream**. This library is used in dealing with programs that accepts input and
    provides output, hence this is the most used library. Other libraries are discussed
    in the succeeding chapters of this book.


    Note: Other program examples from other sources includes the ".h" extension for
    its library, but take note that the standard now longer include the .h extension.


    **Line 2.** `using namespace std;`


    C++ uses namespaces to organize different names used in programs. Every name used
    in the iostream standard library file is part of a namespace called `std` (probably
    stands for "standard"). Consequently, the `cout` object is really called `std::cout`.
    The `using namespace std;` statement avoids the need for putting `std::` before
    every reference to `cout`, so that the `cout` alone can be used in the code.


    **Line 3.** `int main()`

