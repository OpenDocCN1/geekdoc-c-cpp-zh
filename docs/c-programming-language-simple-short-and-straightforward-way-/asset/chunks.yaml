    \ 的文件变量，表示创建并写入文件。第 11 行定义了该文件变量，它将打开一个名为 `data.txt` 的文件，或者在它文件不存在时创建它。第 13 行到\
    \ 15 行告诉并接受了用户的字符串输入，在第 15 行中，它使用 `cin.getline` 将输入字符串赋值给变量 `data`。第 25 行使用 `<<`\
    \ 运算符将 `data` 变量的值写入文件，第 28 行关闭文件。\n\n第 31 行声明了另一个数据类型为 `ifstream` 的文件变量，表示从文件读取。第\
    \ 32 行定义了文件变量，打开了第 11 行中使用的 `data.txt`。第 35 行和 41 行使用 `>>` 运算符读取 `data.txt` 的内容并将其赋值给\
    \ `data` 变量，第 45 行关闭文件变量。\n\n图 14.2 展示了程序的示例屏幕输出，同时，在程序的源文件目录下会创建一个名为 `data.txt`\
    \ 的文件。\n\n图 14.2\n\n![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_67024ebe.png)\n\
    \n### 图 14.1 的代码列表\n\n```cpp\n#include<iostream>\n\n#include<fstream>\n\nusing\
    \ namespace std;\n\nint main()\n{\n\nchar data[100];\n// 以写模式打开文件。\nofstream outfile;\n\
    outfile.open(\"data.txt\");\ncout << \"Writing to the file\" << endl;\ncout <<\
    \ \"Enter your name: \";\ncin.getline(data, 100);\n// 将输入的数据写入文件。\noutfile <<\
