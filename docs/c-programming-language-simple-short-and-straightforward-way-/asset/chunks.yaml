    # Chapter 11 - Classes in C++


    Most of the discussions in chapter 10 on structures applies also to classes. Indeed,
    for the most part we can simply substitute the `class` keyword for the `struct`
    keyword when declaring the class. However, there is an important difference between
    structures and classes. While both has member variables, classes can also have
    methods which are not available in structures. Classes are the central feature
    of C++ and this chapter presents the fundamental of C++ classes.


    ## What is a class?


    A class is used to specify the form of an object and it combines data representation
    known as member variables and methods which is similar to function for manipulating
    that data into one neat package. The data and method within a class are called
    members of the class. Classes extend the built-in capabilities of C++ to assist
    programmer in representing and solving complex, real-world problems.


    ## Creating New Types


    Creating new `type` is similar to creating a `structure` as discussed in the previous
    chapter and follows similar principles. In C++, the programmer can create any
    type needed, and each of these new types can have all the functionality and power
    of the built-in data types.


    Programs are usually written to solve real-world problems, such as simulating
    the workings of a heating system. Although it is possible to solve complex problems
    by using programs written with only integers and characters, it is far easier
    to grapple with large, complex problems if programmers can create representations
    of the objects like simulating the workings of a heating system which makes it
    easier if programmers can create variables that represent rooms, heat sensors,
    thermostats, and boilers. The closer these variables correspond to reality, the
    easier it is to write the program.


    ## Classes and Members


    Programmer can make a new type by declaring a `class`. A `class` is just a collection
    of variables (often of different types) combined with a set of related functions
    like for example a car having data with regards to its wheels, doors, seats, windows,
    etc. A `class` enables the programmer to `encapsulate`, or bundle, these various
    parts and various functions into one collection, which is called an object. This
    process is known as encapsulation.


    Similar to structures, a class can consist of any combination of primitive data
    types and also other class types. The variables in the class are referred to as
    the `member variables` or `data members`. The functions in the class typically
    manipulate the member variables referred to as `member functions` or `methods
    of the class`. For example, a `Dog` class might have data members that represent
    age and color and its methods include `bark()`, `walk()`, and `sit()`.


    ## Declaring of a Class in C++


    To declare a class, use the `class` keyword followed by an opening brace, and
    then list the member variables and methods of that class and end the declaration
    with a closing brace and a semicolon.


    Syntax of declaring a class:


    ```cpp

    class <class-name>

    {

    // Access control here

    // Class variables and methods declared here

    };

    ```


    In the syntax, `<class-name>` is the name that should be given to the class to
    be created and enclosed in the curly { } braces, the programmer can declare member
    variables which can be defined as `private` or `public` as its access control
    and also, declaration of the `member methods`/methods of the class`.


    Presented below is a declaration of class `Dog`.


    ```cpp

    class Dog

    {

    //Member variables are age & weight

    public:

    unsigned int age;

    unsigned int weight;


    //Member method

    void Bark();

    };

    ```


    In the example, declaring the class Dog doesn''t allocate memory for that class.
    The class Dog just tells the compiler what a Dog is, what data it contains (age
    and weight), and what it can do (Bark()). It also tells the compiler how big a
    Dog is, that is, how much room the compiler must set aside for each Dog that will
    be created.


    In this example, the member variable as declared as Public and if an integer is
    two bytes, a Dog is only four bytes big: age is two bytes, and weight is another
    two bytes. Bark() takes up no room, because no storage space is set aside for
    member methods (function). Private and public access control is discussed further
    in the succeeding sections of this chapter.


    ## Definition of a Class member method(s) in C++


    A member method(s) definition begins with the name of the class, followed by two
    colons, the name of the method, and its parameters if any.


    Syntax of member method definition:


    ```cpp

    <ret-type> <class-name>::<method-name>(<par>)

    {

    //Body of the method

    }

    ```

