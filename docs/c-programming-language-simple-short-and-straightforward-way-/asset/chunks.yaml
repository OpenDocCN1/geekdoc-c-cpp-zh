    Self-assessment questions


    Answer the following.


    1\. Which of the two will ignore a leading newline character in the input buffer,
    the cin object with the stream extraction operator (>>), or the getline() member
    function?


    2\. To declare a string data type, what is the name of the library that should
    be included?


    3\. The \n manipulator produces a newline character, but it also has an additional
    behavior wherein the stream''s buffer (if any) is flushed, which means that the
    output is requested to be physically written to the device, if it wasn''t already.


    4\. To insert a line break, a new-line character shall be inserted at the exact
    position where the line should be broken. In C++, a new-line character can be
    specified as endl and should be included inside the literal string.


    Chapter 5 - Arrays and Strings in C++


    This chapter presents more complex used of variables through arrays which are
    a type of data storage that is often use in C++ programs.


    Array


    An array is a collection of same data type elements which are sheltered under
    a common name. A variable when declared as an array can store one or more data
    of the same data type under the same name but they are distinguished based from
    their array element numbers or subscript numbers. There are two type of array,
    single-dimensional array and multi-dimensional array.


    1\. **Single-Dimensional** array is useful for simple grouping of data that is
    relatively small in size. A single-dimensional array has only a single subscript.
    A subscript is a number in brackets that follows an array''s name.


    Syntax for declaring a **single-dimensional array**:


    <data-type> <array-name> [<size>];


    The <data-type> is the data type of elements that an array stores. It can be any
    of the available variable data types. If the array stores an integer elements
    then the type of array is **int**. The <array-name> is the name that is given
    to the array. It can be any string but should abide to the rules in naming variables
    as discussed in chapter 3\. The <size> is the size of array, the value in subscripts
    [ ] enclosed in brackets, indicates the number of elements of how many data the
    array can store.


    Example of declaring array:


    int num[5];


    The above example declares an array with the data type integer and the array name
    is num having 5 elements. 5 elements means that the array can hold 5 integer numbers.
    The array elements or the different data stored in an array is distinguished through
    the array''s **subscript** number. The subscript number of arrays always start
    with 0 zero. Therefore, the above array declaration example can be initialized
    as:


    num[0]=7;


    num[1]=4;


    num[2]=6;


    num[3]=1;


    num[4]=12;


    Since the array is declared with 5 elements, the array can hold 5 integer numbers,
    and its subscript starts with 0 and ends with 4\. Arrays can also be declared
    and defined (initialized) in a single line like the example below. This example
    is an array declaration and definition in single line.


    int num[5]={7,4,6,1,12};'
