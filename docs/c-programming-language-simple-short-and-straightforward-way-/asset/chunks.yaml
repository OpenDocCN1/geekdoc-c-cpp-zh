    }

    ```


    ## Null Statements


    If a `;` semicolon is placed by itself on a line, it''s called a null statement.
    Null is a statement that doesn''t perform any action. This is perfectly legal
    in C++ and sometimes can be useful.


    ## White spaces


    The term white space refers to spaces, tabs, and blank lines in the source code.
    The C++ compiler isn''t sensitive to white space. When the compiler reads a statement
    in the source code, it looks for the characters in the statement and for the terminating
    semicolon, but it ignores white space. White spaces are presented in figure 2.10.


