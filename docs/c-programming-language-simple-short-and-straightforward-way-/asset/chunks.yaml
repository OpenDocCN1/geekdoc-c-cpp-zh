    \nA `switch` statement allows a variable to be tested for equality against a list\
    \ of values. Each value is called a `case`, and the variable being switched on\
    \ is checked for each `switch case`.\n\n### Syntax of switch() statement\n\n```cpp\n\
    switch(<expression>)\n{\n    case <cons-expression-1> :\n        <statement(s)>;\n\
    \        break; /* optional */\n    case <cons-expression-N> :\n        <statement(s)>;\n\
    \        break; /* optional */\n    /* Can have any number of case statements\
    \ */\n    default : /* Optional */\n        statement(s);\n}\n```\n\nIn the syntax,\
    \ the `<expression>` in the `\"switch\"` keyword should be an integral type like\
    \ integer values, signed or unsigned. Boolean values, where `0` is equivalent\
    \ to `false` and any nonzero number is equivalent to `true`. Can also be a character,\
    \ which are automatically converted to an integer value by the compiler.\n\nThe\
    \ `<cons-expression-1/N>` in the `case` clause must be the same data type as the\
    \ `<expression>` in the `switch` keyword, and it must be a constant or a literal.\n\
