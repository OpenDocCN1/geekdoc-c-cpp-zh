    ## Installing compiler for Linux


    To compile a C or C++ program on any Linux distro such as Ubuntu, Red Hat, Fedora,
    Debian and other Linux distro the following are needed to be installed:


    1. GNU C and C++ compiler collection

    2. Development tools

    3. Development libraries

    4. IDE or text editor to write programs


    ### Step #1: Install C/C++ compiler and related tools


    If linux version is Fedora, Red Hat, CentOS, or Scientific Linux, use the following
    `yum` command to install the GNU c/c++ compiler:


    ```bash

    yum groupinstall ''Development Tools''

    ```


    If linux version is Debian or Ubuntu Linux, type the following `apt-get` command
    to install the GNU c/c++ compiler:


    ```bash

    sudo apt-get update

    sudo apt-get install build-essential manpages-dev

    ```


    ### Step #2: Verify installation


    Type the following command to display the version number and location of the compiler
    on Linux:


    ```bash

    whereis gcc

    which gcc

    gcc --version

    ```


    Congratulations! You have successfully installed and verified C/C++ compiler for
    Linux. We are now ready for our very first C++ program.


