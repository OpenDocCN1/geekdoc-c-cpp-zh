    \ `iCtr2`（内层 `for` 循环）。第 7 行开始第一个 `for()` 语句。`iCtr1` 的初始值设置为 1。评估条件，只要 `iCtr`\
    \ 小于或等于 10，该外层循环就会执行。在第一次执行且评估为真时，执行第 9 行。\n\n第 9 行包含第二个 `for()` 循环（内层 for 循环）语句。在这里，`iCtr2`\
    \ 的初始值设置为 1，只要 `iCtr2` 小于或等于 `iCtr1`，计数器条件就会执行此循环。由于 `iCtr2` 小于或等于 `iCtr1`，执行第\
    \ 11 行，在屏幕上打印一个 'X'。然后增加 `iCtr2`，循环继续直到 `iCtr2` 大于 `iCtr1`。当 `iCtr2` 大于 `iCtr1`\
    \ 时，`for()` 循环（内循环）结束，控制返回第 7 行（外循环），增加 `iCtr1` 并再次评估第 7 行中 `for()` 语句（外循环）的计数器条件。只要\
    \ `iCtr1` 小于或等于 10，第 8 行的 `for()` 循环（内循环）就会重新执行，直到外循环中的计数器条件评估为假。图 8.4 展示了示例程序的输出。\n\
    \n图 8.4\n\n![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m289d41de.png)\n\
    \n图 8.3 的代码列表\n\n```cpp\n#include<iostream>\n\nusing namespace std;\n\nint main()\n\
    {\n\nint iCtr1,iCtr2;\nfor(iCtr1=1; iCtr1<=10; iCtr1++)\n{\nfor(iCtr2=1;iCtr2<=iCtr1;iCtr2++)\n\
    {\ncout<<\"X\";\n}\ncout<<iCtr1<<endl;\n}\n\nfflush(stdin);\n\ngetchar();\n\n\
    return 0;\n}\n```\n\n### 2. 条件控制循环\n\n条件控制循环是 C++ 程序根据条件重复一个或多个各种语句的方法。\n\n####\
    \ 2.1 前测试循环\n\n前测试循环可以使用 `while()` 语句执行。前测试循环的 `while()` 语句语法如下：\n\n```cpp\nwhile(<condition>)\n\
    {\nstatement(s)>;\n}\n```\n\n在语法中，前测试循环在执行循环体之前评估条件。如果条件为真，则执行循环体。\n\n#### 2.2\
    \ 后测试循环\n\n后测试条件控制循环可以使用 `do while()` 语句执行。它会至少执行一次循环体，然后评估条件。`do while()` 语句的语法如下：\n\
    \n```cpp\ndo\n{\nstatement(s)>;\n} while(<condition>);\n```\n"
