    ## C++ 中的 C 字符串预定义函数


    字符数组是一种特殊的数组类型，在末尾使用 `"\0"` 空字符。因此，在 C++ 中，它有自己的包含文件或头文件库名为 `"cstring"`，其中包含了对这些特定数组类型执行操作的预定义函数。


    程序必须包含 `cstring` 库才能使用字符串的预定义函数。下面是使用 `#include` 指令包含 `cstring` 库的代码。


    ```cpp

    #include<cstring>

    ```


    以下是字符串的预定义函数：


    ### 1. 字符串长度


    使用 `strlen()` 函数获取字符串的长度。该函数返回表示字符串长度的整数值。


    `strlen()` 的语法：


    `int strlen(<string>);`


    语法中的 `<string>` 可以是字面量、变量或返回字符串的函数。


    示例：


    ```cpp

    char name[30]="Sherwyn";

    ```


    '
- fmt: '

    ```

    int intLen=strlen(name);

    ```


    The example would set the value of `intLen` to 7, because the literal string `"Sherwyn"`
    has 7 characters.


    ## 2. Concatenation of Strings


    The `strcat()` function appends one string to another.


    ### Syntax `strcat()`:


    ```c

    char strcat(<str1>, <str2>);

    ```


    The first string `<str1>` gets the second string `<str2>` appended to it. In the
    syntax, the `<str1>` should be a variable that holds a string and the `<str2>`
    can be a literal string, a variable, or a function that returns a string.


    ### Example:


    ```cpp

    char fname[30] = "Sherwyn";

    char lname[30] = "Allibang";

    cout<<strcat(fname, lname);

    ```


    In the example, the output is "SherwynAllibang" as `lname` is appended to `fname`.


    ## 3. Compare Two Strings (Case Sensitive)


    Sometimes it is needed to determine if two strings are the same. For this, the
    `strcmp()` function should be used. This function returns an integer number.


    ### Syntax of `strcmp()`:


    ```c

    int strcmp(<str1>, <str2>);

    ```


    The return value indicates how the 2 strings relate to each other. If they are
    equal `strcmp()` returns 0 zero. The value will be negative if string `<str1>`
    is less than string `<str2>`, or positive in the opposite case. The `<str1>` and
    `<str2>` in the syntax can be a literal string, a variable, or a function that
    returns a string.


    ### Example:


    ```cpp

    char strDep1[10]="CSE";

    char strDep2[10]="ITE";

    char strAdd1[10]="Prontera";

    char strAdd2[10]="Prontera";

    int intVal1=strcmp(strDep1, strDep2);

    int intVal2=strcmp(strAdd1, strAdd2);

    ```


    In the example, the `intVal1` will be assigned to a value -1, because `strDep1`
    and `strDep2` is not the same. Moreover, `intVal2` will be assigned to a value
    of 0, because `strAdd1` and `strAdd2` is the same.


    ## 4. Compare Two Strings (Not Case Sensitive)


    If one do not care whether the strings are in upper or lower case then use `strcmpi()`
    function instead of the `strcmp()`. Other than that, it''s exactly the same.


    ### Syntax of `strcmpi()`:


    ```c

    int strcmpi(<str1>, <str2>);

    ```


    The `<str1>` and `<str2>` in the syntax can be a literal string, a variable, or
    a function that returns a string.


    ### Example:


    ```cpp

    char strDep1[10]="CSE";

    char strDep2[10]="ITE";

    char strAdd1[10]="Prontera";

    char strAdd2[10]="PRONTERA";

    int intVal1=strcmp(strDep1, strDep2);

    int intVal2=strcmp(strAdd1, strAdd2);

    ```


    The `intVal1` will have a value of -1 similar to `strmp()` function, and at the
    same time the `intVal2` will still have a value of 0, because `strAdd1` and `strAdd2`
    is the same regardless of cases.


    ## 5. Copy Strings


    To copy one string to another string variable, the `strcpy()` function should
    be used. This makes up for not being able to use the `=` assignment operator to
    set the value of a string variable.


    ### Syntax of `strcpy()`:


    ```c

    strcpy(<str-var>,<str2>);

    ```


    The `<str-var>` must be a char array variable, and the `<str2>` can be a literal
    string, variable, or a function that returns a string.


    ### Example:


    ```cpp

    char strName[10]="Sherwyn";

    char strOfficer[10];

    strcpy(strOfficer,strName);

    ```


    The value of `strOfficer` upon executive the codes above is "Sherwyn" as it copied
    the value of `strName` into `strOfficer`. Below is another example when copying
    a literal string to `<str-val>`.


    ```cpp

    char strOfficer[10];

    strcpy(strOfficer,"Allibang");

    ```


    The value of `strOfficer` from the example above is "Allibang" as the literal
    string "Allibang" has been copied to `strOfficer`. This is actually another way
    of defining a char array or string variable.


    ## 6. Reversing the Order of a String


    The `strrev()` function is not part of the ANSI standard and therefore strongly
    recommended against if it is needed for the program to be portable to platforms
    other than Windows.


    ### Syntax of `strrev()`:


    ```c

    strrev(<string>);

    ```


    This function will reverse the order of string `<string>`. The `<string>` in the
    syntax can be a literal text, a variable, or a function that returns a string.


    ### Example:


    ```cpp

    char strName[10]="Sherwyn";

    strrev(strName);

    ```


    The string is "Sherwyn", `strrev()` reverses the string then the new value of
    `strName` would become "nywrehS".


    ## 7. Converting Uppercase Strings to Lowercase Strings


    The `strlwr()` function is not part of the ANSI standard and therefore strongly
    recommended against if it is needed for the program to be portable to platforms
    other than Windows.


    ### Syntax of `strlwr()`:


    ```c

    strlwr(<string>);

    ```


    This function will convert uppercase characters in string `<string>` to lowercase.
    The `<string>` in the syntax can be a literal text, a variable, or a function
    that returns a string.


    ### Example:


    ```cpp

    char strName[10]="Sherwyn";

    strlwr(strName);

    ```


    The string is "Sherwyn", `strlwr()` converts the string into lowercase, therefore
    the new value of `strName` would become "sherwyn".


    ## 8. Converting Lowercase Strings to Uppercase Strings


    The `strlwr()` function is not part of the ANSI standard and therefore strongly
    recommended against if it is needed for the program to be portable to platforms
    other than Windows.


    ### Syntax of `strlwr()`:


    ```c

    strlwr(<string>);

    ```


    This function will convert uppercase characters in string `<string>` to uppercase.
    The `<string>` in the syntax can be a literal text, a variable, or a function
    that returns a string.


    ### Example:


    ```cpp

    char strName[10]="Sherwyn";

    strlwr(strName);

    ```


    The string is "Sherwyn", `strlwr()` converts the string into uppercase, therefore
    the new value of `strName` would become "SHERWYN".


