    Note: The sizes of variables in other computers might be different from those
    shown in the above table, depending on the compiler and the computer being use.


    In table 3.1, notice that different data types corresponds to different range
    of values they can store. For example the data type character can store values
    from -128 to 127 and the data type integer can store values from -2147483648 to
    2147483647. However, integer data type requires 4 bytes in the computer''s memory
    where on the other hand the data type character only requires 1 byte.


    Based from table 3.1, a programmer needs to determine the appropriate data type
    for the needed data, because it is essential to save memory space. For example,
    the best data type for a person''s age would be the `unsigned char`. A person''s
    age can be any number between 0 and up, therefore choosing unsigned char with
    the range of 0-255 is the best choice considering that there''s no more person
    alive beyond the age of 255, and also this data type only requires 1 byte.


