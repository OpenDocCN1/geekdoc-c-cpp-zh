  raw: 'In C++, an expression is anything that evaluates to a numeric value. C++ expressions
    come in all levels of complexity. Below is an example of C++ expression.


    5 + 12


    The example above is consist of the expressions 5 and 12 together with the addition
    operator +. The expression 5+12 evaluates to 17\. Below is another example of
    C++ expression of great complexity.


    5.46 / 12 + 7 * intRate / cost


    When an expression contains multiple operators, the evaluation of the expression
    depends on operator precedence as discussed on the latter part of this chapter.
    C++ expressions get even more interesting. Look at the following assignment statement:


    intNum = intVal + 15;


    The statement above evaluates the expression intVal + 15 and assigns the result
    to intNum. In addition, the entire statement intNum=intVal+15; is itself an expression
    that evaluates to the value of the variable on the left side of the equal sign.


    Operators


    An operator is a symbol that instructs C++ to perform some operation, or action,
    on one or more operands. An operand is something that an operator acts on. In
    C++, all operands are expressions. C++ operators fall into several categories
    which are:


    1\. Assignment Operator


    The assignment operator uses the **=** equal sign (introduced in chapter 3''s
    variable definition). The = equal sign in C programming is somewhat different
    from its use in regular mathematics. Like for example is the expression below.


    a = b;


    In regular math, the statement above means "**a** is equivalent to **b**" , but
    in C++ programming, it means "assign the value of **b** to **a**". Hence, it''s
    called assignment operator.


    Syntax in using assignment operator:


    <var-name>=<val-2b-assigned>;


    In the syntax, the <val-2b-assigned> on the right side can be any expression,
    constant, variable or function, and the left side <var-name> should be a variable
    name.


    2\. **Mathematical Operators**


    C++''s mathematical operators perform mathematical operations such as addition
    and subtraction. C++ has five binary mathematical operators and two unary mathematical
    operators.


    2.1 **Binary**


    C''s binary operators take two operands. The binary operators, which include the
    common mathematical operations found on a calculator, are listed in table 6.1.


    Table 6.1


    ![](tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m771a1fe2.png)


    Based from table 6.1, the following are example statements of using binary operators.


    int intNum1=5, intNum2=4;


    int intVal;


    /*intVal is assigned to a value 7 */


    intVal=intNum1+2;


    /*intVal is assigned to a value 1 */


    intVal=intNum1-intNum2;


    /*intVal is assigned to a value 6 */


    intVal=3*2;


    /*intVal is assigned to a value 2 */


    intVal=intNum2/2;


    /*intVal is assigned to a value 1 */


    intVal=intNum1%2;


    Figure 6.1 presents a sample program that accepts two numbers and perform binary
    operations.


    Figure 6.1 (source file name: ch6sample1.cpp)


    ![](tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_37b0ae6b.png)


    Line 5 declares two integer variables. Lines 7 and 10 accepts integer input using
    cin>> and assigns them to the two integer variables. Lines 12 to 16 performs arithmetic
    operations and prints them on-screen. In line 15 where the division operator is
    used, notice that the result is a integer value disregarding the remainder. intNum1
    and intNum2 are integer variables and by how C++ language was designed, the result
    would be implicitly converted into an integer value. To solve this problem, data
    type casting should be considered. Type casting is discussed at the last section
    of this chapter. Figure 6.2 presents the output of the program.


    Figure 6.2


    ![](tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m7123550f.png)


    Code listings of figure 6.1


    #include<iostream>


    using namespace std;


    int main()


    {


    int intNum1, intNum2;


    cout<<"Enter first integer number: ";


    cin>>intNum1;


    cout<<"Enter second integer number: ";


    cin>>intNum2;


    cout<<"\nThe sum of the 2 numbers is: "<<intNum1+intNum2<<endl;


    cout<<"The difference of the 2 numbers is:"<<intNum1-intNum2<<endl;


    cout<<"The product of the 2 numbers is: "<<intNum1*intNum2<<endl;


    cout<<"The quotient of the 2 numbers is: "<<intNum1/intNum2<<endl;


    cout<<"The modulo of the 2 numbers is: "<<intNum1%intNum2;


    fflush(stdin);


    getchar();


    return 0;


    }


    2.2 **Unary**


    The unary mathematical operators take a single operand. C++ has two unary mathematical
    operators as listed in table 6.2


    Table 6.2


    ![](tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_5b960742.png)


    The unary operators can be used only with variables. The operation performed is
    to add one or to subtract one from the operand. Below is an example statement
    of using the unary operator increment.


    int intNum=5;


    intNum++;


    After executing the above statement, the value of intNum will become 6\. The increment
    operator will add 1 to itself. Therefore, the statement above is similar to the
    statement:


    intNum=intNum+1;


    Similar to increment, the decrement operator subtracts 1 to itself. Below is an
    example of using the decrement operator.


    int intNum=5;


    intNum--;


    The value of intNum becomes 4 after executing the statement above. The above statement
    is similar to:


    intNum=intNum-1;


    As presented in table 6.2, unary operators can either be postfix or prefix. The
    above examples uses a postfix mode of increment and decrement operators. The difference
    between prefix and postfix is that in prefix ++<var>, the value of the variable
    is incremented by 1, then it returns the value, while the postfix <var>++, the
    original value of the variable is returned first, then variable is incremented
    by 1\. Figure 6.3 presents a sample program/


    Figure 6.3 (source file name: ch6sample2.cpp)


    ![](tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_3ef70365.png)


    Line 4 declares an integer variable named intNum and is initialized to 5\. In
    line 7, the postfix increment operation is used, hence it returns to the cout
    the original value of intNum first which is 5 before it executes the increment
    operation. The intNum''s value then becomes 6. In line 10, the postfix increment
    operation is executed first, therefore intNum''s value is incremented by 1 before
    it is returned to the cout, returning the value 7.


    Figure 6.4


    ![](tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m23a4a880.png)


    Code listings of figure 6.3


    #include<iostream>


    using namespace std;


    int main()


    {


    int intNum=5;


    //5 is displayed then, intNum is increased to 6.


    cout<<intNum++<<endl;


    // Initially, intNum=6\. It is increased to 7 then, it is displayed.


    cout<<++intNum;


    fflush(stdin);


    getchar();


    return 0;


    }


    2.3 **Mathematical operators precedence level and parentheses**


    If an expression contains more than one operator, there is an order in which operations
    are performed. The precedence level of operators will determine on which operation
    must be performed first. The order of precedence is illustrated in the statement
    below.


    intNum=3+2*4;


    If the statement above is performed from left to right, the value of intNum is
    20 because 3+2 is performed first which results to a value of 5, then performs
    multiplication of 5*2 which results to 20\. However, the order of precedence states,
    that multiplication must be performed first, hence 2*4 is first performed resulting
    to a value of 8, followed by addition which is 3+8, resulting to the value 11\.
    The value of intNum is 11.


    In C++ language, each operator has a specific precedence. When an expression is
    evaluated, operators with higher precedence level are performed first. Table 6.3
    lists the precedence level of C++''s mathematical operators. Number 3 is the highest
    level of precedence and thus it is evaluated first.


