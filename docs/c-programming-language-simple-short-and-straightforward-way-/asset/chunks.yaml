  trans: "\n\n在 C++ 中，表达式是任何求值为数值结果的结构。C++ 表达式具有各种复杂程度。下面是一个 C++ 表达式的示例。\n\n```\n\
    5 + 12\n```\n\n上面的示例由表达式 `5` 和 `12` 以及加法运算符 `+` 组成。表达式 `5+12` 的求值结果 `17`。下面是另一个具有极大复杂的\
    \ C++ 表达式示例。\n\n```cpp\n5.46 / 12 + 7 * intRate / cost\n```\n\n当一个表达式包含多个运算符时，表达式的评估取决于运算符优先级，正如在本章后半部分讨论的那样。C++\
    \ 表达式变得更加有趣。看下面的赋值语句：\n\n```cpp\nintNum = intVal + 15;\n```\n\n上面的语句求值表达式 `intVal\
    \ + 15` 并将结果赋值给 `intNum`。此外，整个语句 `intNum=intVal+15;` 本身也是一个表达式，其求值为等号左侧变量的值。\n\
    \n# 运算符\n\n运算符是一个符号，指示 C++ 对一个或多个操作数执行某些操作或动作。操作数是运算符作用的对象。在 C++ 中，所有操作数都是表达式。C++\
    \ 运算符分为几类，如下：\n\n## 1. 赋值运算符\n\n赋值运算符使用 `=` 等号（在第 3 章的变量定义中引入）。C 语言中的 `=` 等号与其普通数学中的用法有些不同。例如下面的表达式：\n\
    \n```cpp\na = b;\n```\n\n在普通数学中，上面的语句意味着“`a` 等 `b`”，但在 C++ 编程中，它的意思是“将 `b` 的值赋值给\
    \ `a`”。因此，它被称为赋值运算符。\n\n赋值运算符的使用语法：\n\n```\n<var-name>=<val-2b-assigned>;\n```\n\
    \n在语法中，右侧的 `<val-2b-assigned>`可以是任何表达式、常量、变量或函数，而左侧的 `<var-name>`应该是变量名。\n\n##\
    \ 2. 数学运算符\n\nC++ 的数学运算符执行加法和减法等数学运算。C++ 有五个二元数学运算符两个一元数学运算符。\n\n### 2.1 二元\n\n\
    C 的二元运算符接受两个操作数。包括计算器上常见的数学运算在内的二元运算符如表 6.1 所示。\n\n表 6.1\n\n![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m771a1fe2.png)\n\
    \n根据表 6.1，以下是使用二元运算符的示例语句。\n\n```cpp\nint intNum1=5, intNum2=4;\nint intVal;\n\
    /*intVal 被赋值为值 7 */\nintVal=intNum1+2;\n/*intVal 被赋值为值 1 */\nintVal=intNum1-intNum2;\n\
    /*intVal 被赋值为值 6 */\nintVal=3*2;\n/*intVal 被赋值为值 2 */\nintVal=intNum2/2;\n/*intVal\
    \ 被赋值为值 1 */\nintVal=intNum1%2;\n```\n\n图 6.1 展示了一个接受两个数字并执行二元运算的程序。\n\n图 6.1\
    \ (源文件名: ch6sample1.cpp)\n\n![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_37b0ae6b.png)\n\
    \n第 5 行声明了两个整数变量。第 7 行和第 10 行使用 `cin>>` 接收整数输入并将其赋值给两个整数变量。第 12 到 16 行执行算术运算并在屏幕上打印。在第\
    \ 15 行使用除运算符的地方，注意结果是一个忽略余数的整数值。`intNum1` 和 `intNum2` 是整数变量，根据 C++ 语言的设计，结果将被隐式转换为整数值。为了解决这个问题，应该考虑数据类型转换。类型转换在本章的最后一节讨论。图\
    \ 6.2 展示了程序的输出。\n\n图 6.2\n\n![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m7123550f.png)\n\
    \n图 6.1 的代码列表\n\n```cpp\n#include<iostream>\nusing namespace std;\n\nint main()\n\
    {\n    int intNum1, intNum2;\n    cout<<\"Enter first integer number: \";\n  \
    \  cin>>intNum1;\n    cout<<\"Enter second integer number: \";\n    cin>>intNum2;\n\
    \    cout<<\"\\nThe sum of the 2 numbers is: \"<<intNum1+intNum2<<endl;\n    cout<<\"\
    The difference of the 2 numbers is:\"<<intNum1-intNum2<<endl;\n    cout<<\"The\
    \ product of the 2 numbers is: \"<<intNum1*intNum2<<endl;\n    cout<<\"The quotient\
    \ of the 2 numbers is: \"<<intNum1/intNum2<<endl;\n    cout<<\"The modulo of the\
    \ 2 numbers is: \"<<intNum1%intNum2;\n    fflush(stdin);\n    getchar();\n   \
    \ return 0;\n}\n```\n\n### 2.2 一元\n\n一元数学运算符接受单个操作数。C++ 有两个一元数学运算符如表 6.2 所示。\n\
    \n表 6.2\n\n![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_5967)\n\n\
    一元运算符只能作用于变量。下面是使用一元运算符的示例。\n\n```cpp\nintNum=5;\nintNum++;\n```\n\n上面的语句显示 `intNum`\
    \ 变为 6。下面是另一个使用一元运算符的示例。\n\n```cpp\nintNum=5;\nintNum--;\n```\n\n上面的语句显示 `intNum`\
    \ 为 4。图 6.3 (文件名: ch6sample2.cpp)\n\n![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_37035)\n\
    \n第 4 行声明了一个整数变量 `intNum` 并初始化为 5。第 7 行使用了后增运算符，因此返回 `intNum` 的原始值并增加到 6。第 10\
    \ 行使用了前增运算符，因此 `intNum` 的值变为 7。图 6.4\n\n![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_62007)\n\
    \n图 6.2 的代码列表\n\n```cpp\n#include<iostream>\nusing namespace std;\n\nint main()\n\
    {\n    int intNum=5;\n    // 显示 5，然后 intNum 增加到 6。\n    cout<<intNum++<<endl;\n\
    \    // 初始 intNum=6。它增加到 7。\n    cout<<++intNum;\n    fflush(stdin);\n    getchar();\n\
    \    return 0;\n}\n```\n\n### 2.3 数学运算符优先级和括号\n\n如果一个表达式包含多个运算符，则存在执行顺序。运算符优先级将决定先执行哪种操作。优先级在如下语句所示。\n\
    \n```cpp\nintNum=3+2*4;\n```\n\n如果从左到右执行上面的语句，则 `intNum` 的值为 20，因为先执行 `3+2` 得到\
    \ 5，然后执行 `5*2` 得到 20。然而，优先级规定必须先执行乘法，因此先执行 `2*4` 得到 8，然后执行加法 `3+8`，得到结果值 11。`intNum`\
    \ 的值为 11。\n\n在 C++ 语言中，每个运算符都有特定的优先级。在评估表达式时，高优先运算符先执行。表 6.3 列出了 C++ 数学运算符的优先级。数字\
    \ 3 是最高优先级，因此最先求值。\n\n表 6.3\n\n![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_6ad7046d.png)\n\
    \n"
- fmt: "\nLooking at table 6.3, operations are performed in the following order: first\
    \ to be performed are the unary increment and decrement which has the highest\
    \ level of precedence; second to be performed are multiplication, division, and\
    \ modulus , and last to be performed are addition and subtraction which has the\
    \ lowest level of precedence.\n\nIf an expression contains more than one operator\
    \ with the same precedence level, the operators are performed from left to right\
    \ as they appear in the expression. Below is an example of expression having the\
    \ `/` and `*` which have the same precedence level, but the `/` is the leftmost\
    \ operator, so it is performed first, therefore resulting to the value 12.\n\n\
    ```\n24/4*2\n```\n\nIn some cases, there are times when operations in an expression\
    \ should be evaluated as desired by the programmer. For instance, the programmer\
    \ needs that evaluation from the above expression result to the value of 3, performing\
    \ multiplication before the division. In `C++`, parentheses `( )` are used to\
    \ modify the order of evaluation. A sub expression enclosed in parentheses is\
    \ evaluated first, without regard to operator precedence level. The example below\
    \ modifies the expression above in order to result to the value 3.\n\n```\n24/(4*2)\n\
    ```\n\nThe expression `4 * 5` inside parentheses is evaluated first, so the value\
    \ 24 is divided by 8. Below is an example of a more complicated expression.\n\n\
    ```\nintNum=30-(2*(10+(6/2)));\n```\n\nThe evaluation of the above expression\
    \ proceeds as follows:\n\n1. The innermost expression, `6/2`, is evaluated first,\
    \ yielding the value 3:\n   ```\n   30-(2*(10+3))\n   ```\n2. Moving outward,\
    \ the next expression, `10+3`, is evaluated, yielding the value 13:\n   ```\n\
    \   30-(2*13)\n   ```\n3. The last, or outermost, expression, `2*13`, is evaluated,\
    \ yielding the value 26:\n   ```\n   30-26\n   ```\n4. The final expression, `30-26`,\
    \ is evaluated, assigning the value 4 to the variable `intNum`:\n   ```\n   intNum=4\n\
    \   ```\n\n### 3. Relational Operators\n\n`C++`'s relational operators are used\
    \ to compare expressions, asking questions such as, \"if Num is greater than 5?\"\
    \ or \"if Num is equal to 10?\". An expression containing a relational operator\
    \ evaluates to either `true` (non-zero) or `false` (zero 0). Remember that in\
    \ `C++`, expressions returns a numeric value. `C++`'s six relational operators\
    \ are listed in table 6.4.\n\nTable 6.4\n![](tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_2dad3b7a.png)\n\
    \nTable 6.5 presents some examples of how relational operators might be used.\
    \ These examples use literal constants, but the same principles hold with variables.\n\
    \nTable 6.5\n![](tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_581494f4.png)\n\
    \nFor expressions that uses two or more relational operators, table 6.6 lists\
    \ their precedence level.\n\nTable 6.6\n![](tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m3854b997.png)\n\
    \nRelational operators are used in conjunction with conditional statements which\
    \ are discussed in the next chapter of this book.\n\n### 4. Logical Operators\n\
    \nLogical operators in `C++` language let programmers combine two or more relational\
    \ expressions into a single expression (also called compound expression) that\
    \ evaluates to either `true` or `false`. The three logical operators are listed\
    \ in table 6.7.\n\nTable 6.7\n![](tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m206729ac.png)\n\
    \nIn table 6.7, `exp1` and `exp2` evaluate to either `true` or `false`. For example,\
    \ if `exp1` evaluates to `true` and `exp2` evaluates to `false`, the logical operator\
    \ will combine the results into a compound result of either `true` or `false`\
    \ which varies on what logical operator is used. The `NOT` operator is the only\
    \ logical operator that does not combine expressions. Table 6.8 presents the truth\
    \ table of the logical operators.\n\nTable 6.8\n![](tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m4cd3393e.png)\n\
    \nAs presented in table 6.8, the compound result of `AND` operator, evaluates\
    \ to `TRUE`, if and only if, both expressions are true, otherwise the compound\
    \ result is `FALSE`. Moreover, the compound result of the `OR` operator, evaluates\
    \ to `TRUE`, if any of the expressions is true, otherwise the compound result\
    \ is `FALSE`. And finally, the `NOT` operator neglects the truth. `True` becomes\
    \ `FALSE`, and `false` becomes `TRUE`.\n\nProgrammer can also create expressions\
    \ that use multiple logical operators. For example, to ask the question \"If `intNum`\
    \ is equal to 5, 9, or 3?\" , it would be written as:\n\n```\n(intNum==5)||(intNum==9)||(intNum==3)\n\
    ```\n\nIn the example above, figure 6.5 presents how it is evaluated if the value\
    \ of `intNum` is 5.\n\nFigure 6.5\n![](tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_7017e.png)\n\
    \nThe expression `4 * 5` inside parentheses is evaluated first, so the value 24\
    \ is divided by 8. Below is an example of a more complicated expression.\n\n```\n\
    intNum=30-(2*(10+(6/2)));\n```\n\nThe evaluation of the above expression proceeds\
    \ as follows:\n\n1. The innermost expression, `6/2`, is evaluated first, yielding\
    \ the value 3:\n   ```\n   30-(2*(10+3))\n   ```\n2. Moving outward, the next\
    \ expression, `10+3`, is evaluated, yielding the value 13:\n   ```\n   30-(2*13)\n\
    \   ```\n3. The last, or outermost, expression, `2*13`, is evaluated, yielding\
    \ the value 26:\n   ```\n   30-26\n   ```\n4. The final expression, `30-26`, is\
    \ evaluated, assigning the value 4 to the variable `intNum`:\n   ```\n   intNum=4\n\
    \   ```\n\n### Type Casting\n\nType casting is a way to convert one data type\
    \ to another. In `C++`, there are two types of casting: implicit and explicit.\n\
    \n#### Implicit Casting\n\nImplicit casting is performed automatically by the\
    \ compiler. For example, when an `int` is assigned to a `float` variable.\n\n\
    ```cpp\nint i = 5;\nfloat f = i;\n```\n\n#### Explicit Casting\n\nExplicit casting\
    \ is performed by the programmer. There are two ways to do explicit casting in\
    \ `C++`:\n\n```cpp\nint i = 5;\nfloat f = (float)i; // C-style cast\n```\n```cpp\n\
    int i = 5;\nfloat f = static_cast<float>(i); // C++-style cast\n```\n\nThe `static_cast`\
    \ operator is preferred over the C-style cast because it is safer and more explicit.\n\
    \n#### Type Casting Example\n\nBelow is an example of how to use explicit casting:\n\
    \n```cpp\nint a = 5;\nint b = 2;\nfloat result = (float)a / b;\n```\n\nThe result\
    \ of the expression will be 2.5. If the cast was not used, the result would be\
    \ 2 because of integer division.\n"
