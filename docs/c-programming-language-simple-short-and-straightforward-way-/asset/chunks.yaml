    3\. **Relational** **Operators**


    C++''s relational operators are used to compare expressions, asking questions
    such as, "if Num is greater than 5?" or "if Num is equal to 10?". An expression
    containing a relational operator evaluates to either **true** (non-zero) or **false**
    (zero 0). Remember that in C++, expressions returns a numeric value. C++''s six
    relational operators are listed in table 6.4.


    Table 6.4


    ![](tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_2dad3b7a.png)


    Table 6.5 presents some examples of how relational operators might be used. These
    examples use literal constants, but the same principles hold with variables.


    Table 6.5


    ![](tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_581494f4.png)


    For expressions that uses two or more relational operators, table 6.6 lists their
    precedence level.


    Table 6.6


    ![](tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m3854b997.png)


    Relational operators are used in conjunction with conditional statements which
    are discussed in the next chapter of this book.


    4\. **Logical Operators**


    Logical operators in C++ language let programmers combine two or more relational
    expressions into a single expression (also called compound expression) that evaluates
    to either true or false. The three logical operators are listed in table 6.7.


    Table 6.7


    ![](tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m206729ac.png)


    In table 6.7, exp1 and exp2 evaluate to either true or false. For example, if
    exp1 evaluates to true and exp2 evaluates to false, the logical operator will
    combine the results into a compound result of either true or false which varies
    on what logical operator is used. The NOT operator is the only logical operator
    that does not combine expressions. Table 6.8 presents the truth table of the logical
    operators.


    Table 6.8


    ![](tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m4cd3393e.png)


    As presented in table 6.8, the compound result of **AND** operator, evaluates
    to TRUE, if and only if, both expressions are true, otherwise the compound result
    is FALSE. Moreover, the compound result of the **OR** operator, evaluates to TRUE,
    if any of the expressions is true, otherwise the compound result is FALSE. And
    finally, the NOT operator neglects the truth. True becomes FALSE, and false becomes
    TRUE.


    Programmer can also create expressions that use multiple logical operators. For
    example, to ask the question "If intNum is equal to 5, 9, or 3?" , it would be
    written as:


    (intNum==5)||(intNum==9)||(intNum==3)


    In the example above, figure 6.5 presents how it is evaluated if the value of
    intNum is 5.


    Figure 6.5


    ![](tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_49aa661c.png)


    In figure 6.5, the evaluation is from left to right because both uses the OR operator.
    However, if the AND, OR, and NOT operators are used, its evaluation is base from
    their precedence level as presented in table 6.9.


    Table 6.9


    ![](tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m995cbfe.png)


    Both relational and logical operators are use in conjunction with conditional
    statements which are discussed in the next chapter. Program samples of using relational
    and logical operators are presented in chapter 7.


    Type Casting


    Type casting is a way to convert a variable from one data type to another data
    type. A way to make a variable of one type, such as an int, act like another type,
    such as a char, for one single operation. Type casting is an **explicit** conversion
    of values from one type to another.


    Format of type casting:


    (<data-type>) <expression>


    The <data-type> can be any of the data types available in C++ and must be enclosed
    with parentheses and the <expression> is the value that will be converted into
    the same data type of the <data-type>. Below is an example of type casting an
    integer to float.


    int num1=5;


    float num2=(float)num1/2;


    In the example above, num1 is first converted into a float data type converting
    the value 5 into 5.000000 before dividing it into 2\. The result is a float data
    type and is then assigned to num2.


    Let''s look at a sample program that executes division operation without type
    casting its data as presented in figure 6.6.


    Figure 6.6 (source file name: ch6sample3.cpp)


    ![](tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m7001717e.png)


    Line 5 declares two integer variable for the dividend and divisor of a division
    operation. Line 6 declares float variable that will hold the value of the quotient.
    Float is the data type used considering that quotient may have a remainder or
    a floating value. In lines 9 and 12, the dividend and divisor are entered through
    the cin>>. Line 14 executes the division operation. Line 15 prints the quotient.
    If the dividend is 9 and the divisor the 2, the quotient should be 4.5. However,
    without type casting, the remainder has been trimmed out as presented in figure
    6.7\. This happens because in line 14, iDividend is an integer value. When the
    division is performed, the quotient is implicitly converted into an integer value
    trimming out the remainder before it is assigned to fQuotient. C++ language was
    designed this way performing implicit conversions of data. To solve this problem,
    type casting must be performed. Figure 6.8 presents a modified program that performs
    type casting.


    Figure 6.7


    ![](tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m38a1d653.png)


    Code listings of figure 6.6


