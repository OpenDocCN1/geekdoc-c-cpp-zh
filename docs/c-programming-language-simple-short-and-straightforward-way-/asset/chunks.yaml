    ## The C-Style Character String


    The C-style character string originated within the C language and continues to
    be supported within C++. This string is actually a one-dimensional array of characters
    which is terminated by a null character `''\0''`. Thus a null-terminated string
    contains the characters that comprise the string followed by a null.


    ### Declaring and defining a string


    In C language, strings are stored in an array of `char` type along with the null
    terminating character `"\0"`. In other words to create a string in C, it is needed
    to create an array of `chars` to set each element in the array to a value. When
    sizing the string array, it is needed to add one to the actual size of the string
    to make space for the null terminating character `"\0"`. For example `"hello"`
    which has 5 characters. Instead of declaring a array of `char` with size of 5,
    it should be 6 because of null terminating character.


    ```cpp

    char word[6];

    word[0]=''h'';

    word[1]=''e'';

    word[2]=''l'';

    word[3]=''l'';

    word[4]=''o'';

    word[5]=''\0'';

    ```


    Note that the Null terminating character is considered as single character. The
    above example can also be declared and define as:

    `char word[6]={''h'',''e'',''l'',''o'',''\0''}`


    To make things simpler, the above examples can be written as:

    `char word[6]="hello";`


