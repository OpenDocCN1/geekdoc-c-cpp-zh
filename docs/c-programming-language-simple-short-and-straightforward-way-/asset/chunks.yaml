    ### 使用输入函数定义字符串


    C 语言中的字符串可以使用两个输入函数 `scanf()` 和 `gets()` 进行初始化。


    1. 使用 `scanf()` 函数定义字符串的格式为：

    `char <str-name>[<size>];`

