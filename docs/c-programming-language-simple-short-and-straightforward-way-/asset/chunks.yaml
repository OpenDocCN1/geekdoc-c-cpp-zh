    ## C 风格字符字符串


    C 风格字符字符串起源于 C 语言，并在 C++ 中继续受到支持。这种字符串实际上是一个一维字符数组，以空字符 `''\0''` 终止。因此，空终止字符串包含构成字符串的字符后跟一个空。


    ### 声明和定义字符串


    在 C 语言中，字符串存储在 `char` 类型的数组中，并带有空终止字符 `"\0"`。换句话说，在 C 中创建一个字符串，需要创建一个 `chars`
    数组来设置数组中的每个元素。在对数组进行大小时，需要在字符串的实际大小上加 1，为空终止字符 `"\0"` 留出空间。例如 `"hello"` 有 5 个字符。声明大小为
    5 的 `char` 数组应该是 6，因为有空终止字符。


    ```cpp

    char word[6];

    word[0]=''h'';

    word[1]=''e'';

    word[2]=''l'';

    word[3]=''l'';

    word[4]=''o'';

    word[5]=''\0'';

    ```


    注意空终止字符被视为单个字符。上面的示例也可以声明和定义为：`char word[6]={''h'',''e'',''l'',''o''}`。


    为了方便，上面的示例可以写成：`char word[6]="hello";`


