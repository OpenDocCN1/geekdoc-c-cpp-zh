    # C++ 中的变量与数据类型


    本章介绍了 C++ 语言如何在程序中存储和使用数据。它介绍了不同数据类型背后的概念及其使用方法。


    ## 变量


    变量是数据的临时存储位置。变量是内存中命名的数据存储位置。通过在程序中使用变量名，实际上引用了存储的数据。


    变量可以存储不同的数据，如姓名、年龄、日薪等。这些数据有多种类型，表 3.1 展示了数据类型的列表。这些数据类型是由 C++ 语言提供的，被称为原生类型（primitive）或内置数据类型。


    表 3.1


    ![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_2704ae01.png)


    ![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_4d09002.png)


    注意：其他计算机变量的大小可能与上表所示的不同，取决于使用的编译器和计算机。


    在表 3.1 中，注意不同数据类型对应于它们可以存储的值范围。例如，字符类型可以存储 -128 到 127 的值，而整数数据类型可以存储 -2147483648
    到 2147483647 的值。然而，整数数据类型在计算机内存中占用 4 个字节，而字符类型只需要 1 个字节。


    根据表 3.1，程序员需要为所需数据确定合适的数据类型，因为节省内存空间至关重要。例如，年龄的最佳数据类型将是 `unsigned char`。人的年龄可以是
    0 及以上的任何数字，因此选择范围为 0-255 的 `unsigned char` 是最佳选择，考虑到没有人的年龄超过 255 岁，而且这种数据类型只需要
    1 个字节。


    那么姓名应该使用哪种数据类型呢？在表 3.1 的“范围”列下，没有代表字母的值，因为字母字符是以二进制形式存储在计算机内存中的，因此范围显然是数值值。然而，包括字母在内的每个字符都有一个相应的数值，对应于键盘上找到
    255 个字符（包括字母和特殊字符如 ! ? $）。用于这些字符的数据类型是字符类型（`char`）。


