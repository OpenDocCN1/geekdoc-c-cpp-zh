    Chapter 9 - User-Defined Functions in C++ Language


    A function is a group of statements which together perform a task. Every C++ program
    has at least one function, which is the main() function. There are two types of
    functions in C++ which are 1) **pre-defined** functions which some of them has
    been discussed in the previous chapters of this book, and the other type is called
    2) **user-defined function**. This chapter presents the fundamentals of defining
    and using a user-defined function.


    User-defined function


    C++ allows programmer to define functions according to their need. These functions
    are known as user-defined functions. To create a user-defined function, it involves
    function declaration known as the **function prototype** and **function definition**
    which defines the statements that the user-defined function will perform.


    The following discussions is an example of creating a user-defined function that
    returns the area of a rectangle. The data needed to compute the area of a rectangle
    is the length and width. The name of the function would be getArea().


    User-defined function prototype


    A function prototype is simply the declaration of a function that specifies the
    function''s name, parameters and return type. It doesn''t contain function body.
    A function prototype gives information to the compiler that the function may later
    be used in the program.


    Syntax of **user-defined function prototype:**


    <ret-type> <func-name>(<type par1>, <type parN>,..);


    In the syntax, the <ret-type> is the return data type of the user-defined function.
    The return type in the example is the area of a rectangle hence, it could be an
    integer data type. The <func-name> is the function name of the user-defined function,
    and enclose with the ( ) parentheses are the user-defined function''s parameters.
    The parameters are the type(s) of data, which may be passed to the function, hence
    in the example, the needed data are the length and width of the rectangle which
    could be an integer data type. A user-defined function may have 0 or N number
    of parameters. If no parameter is needed, just leave the ( ) parentheses empty.


    Below is the creation of the function prototype of the user-defined function getArea():


    int getArea(int len, int wid);


    The return type is integer which represents the area of the rectangle, and the
    parameters needed are the length and width with the names len and wid respectively
    of type integers.


    Figure 9.1 presents the place where the function prototype should be declared.


    Figure 9.1


    ![](tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_fbac489.png)


    Line 4 presents the declaration of the function prototype, and it must be declared
    before the main() function.


    User-defined function definition


    A function definition of a user-defined function contains the block of statement
    that the function will perform.


    Syntax of **user-defined** **function definition**:


    <ret-type> <func-name>(<type par1>, <type parN>,..)


    {


    <statement(s)>;


    }


    The first line in the syntax is similar to the function prototype but note that
    it should not end with a ; semi-colon. The <statement(s) is the body of the user-defined
    function which can be a single statement or block of statements. When a user-defined
    function is called, the execution of the program is transferred to the function
    definition. The compiler starts executing the codes inside the body of a function,
    hence if the user-defined function is not called, its body of statement(s) will
    not be executed.


    Below is the creation of the function definition of the user-defined function
    getArea():


    int getArea(int len, int wid)


    {


    int iArea;


    iArea=len*wid;


    return iArea;


    }


    The function definition contains the statement(s) that the function will perform.
    In this example, the area of the rectangle is computed by getting the product
    of length and width of the rectangle, and the return keyword is used to return
    the value to the calling statement.


    Figure 9.2 presents where the function definition should be placed.


    Figure 9.2


    ![](tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_68fa8eb2.png)


    Lines 12 to 17 presents the function definition of the getArea() user-defined
    function. The statement(s) in the function definition in lines 14 to 16 will only
    be executed when it is called.


