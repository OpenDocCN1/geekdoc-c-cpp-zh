    该示例定义了一个常量变量名 `PI`，其常量值为 `3.1416`，这实际上是 `PI` 的常量值。`#define` 指令将为赋值给它的值确定合适的数据类型。


    `const` 关键字是定义常量变量的第二种方法。`const` 是可以应用于任何变量声明的修饰符。声明为 `const` 的变量在程序执行期间不能被修改，且仅在声明时初始化。


    ### `const` 的语法：


    ```cpp

    const <data-type> <varname>=<value>;

    ```


    `<data-type>` 必须替换为表 3.1 中列出的相应数据类型。`<varname>` 是用户定义的常量变量名，`<value>` 是常量变量的常量值。


    ### 使用 `const` 关键字声明常量变量的示例：


    ```cpp

    const float PI=3.1416;

    ```


    该示例声明了一个名为 `PI` 的常量变量，数据类型为 `float`，常量值为 `3.1416`。


    ### 关键字


    关键字是编程中预定义的、保留的单词，具有特殊含义。关键字是语法的一部分，不能用作标识符或用户定义的名称。由于 C++ 是一种大小写敏感的语言，所有关键字必须小写写。表
    3.3 是 C++ 中若干关键字的列表。


    #### 表 3.3


    ![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m147b4c6.png)

    ![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m5b4d0c6e.png)


    除了这些关键字外，C++ 还支持取决于编译器的许多其他关键字。


    ### typedef 声明


    程序员可以使用 `typedef` 为现有类型创建一个新名称。


    #### `typedef` 的语法：


    ```cpp

    typedef <data-type> <new-name>;

    ```


    `<data-type>` 可以是表 3.1 中列出的任何数据类型之一，`<new-name>` 是用户定义的名称，该名称也应符合变量命名规则。


    例如，以下代码告诉编译器 `numeric` 是 `int` 的另一个名称：


    ```cpp

    typedef int numeric;

    ```


    现在，接的声明是完全合法的并创建了一个名为 `distance` 的整数变量：


    ```cpp

    numeric value;

    ```


