    Chapter 8 - Looping Statements in C++


    This chapter presents repetition structures in C++ language. It presents the different
    looping statements in C++ and the fundamentals behind their logic and algorithm.


    What is a Loop?


    Loops provide a way to repeat commands and control how many times they are repeated.
    Loops allow C++ statement to be repeated several number of times as needed. C++
    provides a number of looping way and there are two types of loop in C++. The counter-controlled
    loop and condition-controlled loop.


    1\. **Counter-controlled loop**


    Counter-controlled loop performs a statement in a specific number of times base
    from its counter. This loop keeps count on the number of times a statement is
    executed and runs only on specific number of times it is instructed to, and stops
    after. The C++ uses the for()loop statement in executing a counter-controlled
    loop.


    A for()loop statement is a C++ programming construct that executes a block of
    one or more statements a certain number of times.


    Syntax of for() statement:


    for (<ctr-init>;<ctr-condition>;<ctr-modifier>)


    {


    <statement(s)>;


    }


    In the syntax, the <ctr-init> is the counter initialization. A numeric variable
    must be declared as the loop''s counter variable, and its initial value must take
    place in the <ctr-init> section of the for() loop statement. The <ctr-condition>,
    must be a expression that evaluates to either true or false which is typically
    a relational expression, wherein, as long as it evaluates to true, the <statement(s)>
    is executed, otherwise, exit for() loop. The <ctr-modifier> is the counter modifier
    which can either be a counter increment or counter decrement. This section updates
