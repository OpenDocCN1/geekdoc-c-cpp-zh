    Chapter 10 - User-Defined Data Types in C++


    A data type in C++ programming language is a set of data with values having defined
    characteristics. There are two kinds of data types. The first one is the primitive
    data types or built-in types which include int, float, double, etc as discussed
    in [chapter 3](#tmp_480d342d62b142d3035f515983d694d0_PG1Fmz.ch.fixed.fc.tidied.stylehacked.xfixed_split_013.html_C3).
    The second one is the composite types or user-defined data types which can be
    constructed in a program using the primitive data types and even other composite
    types. This chapter presents the fundamentals of user-defined data types.


    Structures


    A user-defined data types or composite types can be constructed using the structure
    statement in C++. A structure is a collection of one or more variables grouped
    under a single name for easy manipulation. The variables in a structure, unlike
    those in an array, can be of different data types. A structure can contain any
    of C++''s primitive data types, including arrays and other structures. Each variable
    within a structure is called a **member** of the structure.


    **Declaring a** structure


    Declaring a structure is the process of creating a user-defined data type which
    can be later be defined. Declaring structure comes first before declaring variable
    of that type.


    Syntax of struct statement:


    struct <struct-name>


    {


    <member variable(s)>;


    };


    In the syntax, the struct keyword, which identifies the beginning of a structure
    declaration, must be followed immediately by the <struct-name> which is the name
    of the structure, or tag (which follows the same rules as other C++ variable names).


    Within the braces following the <struct-name> is a list of the structure''s member
    variables which are variable declarations that comprises the structure. And, the
    struct statement must end with a ; semi-colon. The structure declaration should
    take place before the main() function.


    Below is an example of a user-defined data type using struct.


    struct stud


    {


    unsigned int id;


    char name[50];


    unsigned int yob;


    };


    The name of the structure is "**stud**" with three member variables which are
    **unsigned int** **id** for the student''s identification number, the **char name[50]**
    for student''s name and **unsigned int** **yob** for year of birth.


    **Defining a** structure


    Defining a structure is similar to declaring variables of primitive type. However,
    in defining structure, programmer should include the struct keyword and the structure''s
    name.


    Syntax of defining a structure:


    struct <struct-name> <struct-varname>;


    Defining structure must adhere to the rules in declaring variables. Below is an
    example of declaring a variable of type **stud** (defining structure).


    struct stud studRecord;


    In the example, stud is the structure name and studRecord is the name of variable
    with a data type stud.


    Accessing Structure Members


    Structure members are accessed using the structure member operator (.), also called
    the . dot operator, between the structure name and the member name. The **.**
    dot is used to refer or access member variable(s).


    Syntax of using the **.** dot access member operator:


    <struct-varname>.<member-variable>


    Figure 10.1 presents a sample program that uses a user-defined data type using
    the structure statement.


    Figure 10.1 (source file name: ch10sample1.cpp)


    ![](tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m3c45b9d7.png)


    ![](tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_1927e10e.png)


    Lines 4 to 9 presents the structure declaration of structure named "stud". Lines
    6 to 8 are the member variables of the struct **stud.** Line 14 is the structure
    definition. Here, the studRecord is declared as a variable with the data type
    stud and studRecord is locally declared variable. Line 19 accepts integer input
    using the cin>> and assigns the entered integer to the member variable named id
    of studRecord through the use of . dot member access operator in the statement
    studRecord.id. Similarly, lines 22 and 25 does the same. Lines 27 to 30 prints
    registration processing and uses again the . dot access member operator to print
    the values contained in the member variables of studRecord.


    Figure 10.2 presents the sample program output.


    Figure 10.2


    ![](tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m59660ffb.png)


    Code listings of figure 10.1


    #include<iostream>


    using namespace std;


    struct stud


    {


    unsigned int id;


    char name[50];


    unsigned int yob;


    };


    int main()


    {


    struct stud studRecord;


    cout<<"Student''s Registration form"<<endl;


    cout<<"Enter your ID No.: ";


    cin>>studRecord.id;


    cout<<"Enter your Name: ";


    cin>>studRecord.name;


    cout<<"Enter your year of birth:";


    cin>>studRecord.yob;


    cout<<"\nRegistering id: "<<studRecord.id<<endl;


