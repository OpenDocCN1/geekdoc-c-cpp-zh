    # Chapter 3 - Storing Data: Variables and Data Types in C++


    This chapter presents how C++ language store and use data into the program. It
    presents the concepts behind different data types and ways to use them.


    ## Variable


    Variables are temporary storage location of data. A variable is a named data storage
    location in the computer''s memory. By using a variable''s name in the program,
    it is in effect referring to the data stored.


    There are different data that can be stored in variable like the name of person,
    the age of person, the daily salary, and many others. These data has several types
    and table 3.1 presents the list of data types. These data types are called `primitive`
    or built-in data types as they are provided by the C++ language.


    Table 3.1


    ![](tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_2704ae01.png)


