  trans: "\n\n在 C++ 程序中使用变量之前，必须对其进行声明。变量声明告诉编译器变量的名称和数据类型，并可以可选地初始化为一个特定值。变量声明在计算机内存中分配一个空间，用于存放数据。如果程序尝试使用未声明的变量，编译器将生成一条错误信息。\n\
    \n### 变量声明的语法\n\n```\n<data-type> <variable-name>;\n```\n\n在语法中，`<variable-name>`\
    \ 应该替换为任何用户定义的名称，而`<data-type>` 必须替换为表 3.1 中列出的相应数据类型。\n\n### 变量声明示例\n\n```cpp\n\
    unsigned char age;\n```\n\n该示例声明了一个名为 `age` 的变量，其数据类型为 `unsigned char`（无符号字符）。因此，`age`\
    \ 现在可以存储 `unsigned char` 类型。在 C 语言中命名变量时，变量名必须遵循以下规则：\n\n1. 名字可以包含字母、数字和下划线字符\
    \ `_`；\n2. 名称的第一个字符必须是字母。下划线也是合法的起始字符，但不建议这样做；\n3. 大小写敏感。`A` 与 `a` 不同；以及\n4. C++\
    \ 关键字或保留字不能作为变量名。关键字是 C++ 语言中具有特殊含义的单词。本章最后节的表 3.3 展示了 C++ 关键字列表。\n\n表 3.2 中的列表包含了一些合法和非法的\
    \ C++ 变量名示例：\n\n表 3.2 \n\n![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m77560d9e.png)\n\
    \n对于许多编译器来说，C++ 变量名的长度可达 31 个字符。（实际上它可以比这更长，但编译器只查看名称的前 31 个字符。）在为变量命名时，请考虑以下几点：\n\
