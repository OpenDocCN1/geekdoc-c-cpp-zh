    这一行定义了程序的主体。每个 C++ 程序中唯一要求的组件是 `main()` 函数。在最简单的形式下，`main()` 函数由名称 `main`、后面的一对空括号
    `()` 以及在第 4 行和第 9 行所示的一对大括号 `{ }` 组成。大括号内部是构成程序主体的语句。在正常情况下，程序执行从 `main()` 函数的第一条语句开始，并在
    `main()` 的最后一条语句结束。


    通常函数由其他函数唤起或调用，但 `main()` 是特殊的。当程序启动时，`main()` 会自动调用。


    `main()` 函数和所有函数一样，必须说明它将返回什么类型的值。示例程序中 `main()` 的返回值类型为 `int`，表示整数，但对于一个只是打印“Hello
    World”单词的程序来说，这并不是必须的，因此第 8 行返回的值 `0` 只是为了满足格式要求。从函数返回返回值将在本书的后续章节中详细讨论。


    ### 第 4 行和第 9 行。`{ }`


    大括号 `{ }` 用于封装构成每个 C++ 函数（包括 `main()` 函数）的程序行。一组被包含在大括号内的一个或多个语句被称为块（block）。第
    4 行表示主函数内容的开始，第 9 行表示其结束。


    ### 第 5 行。`//The line below prints a string`


    `//`（双斜杠）被称为注释。`//` 之后的任何内容都将成为注释。注释是程序员通常用于在源文件中引用某行代码语句的文本细节。编译器会忽略注释，因此它们不会影响程序的输出。无论是否有注释，程序都能正常执行和运行。在第
    5 行中，注释用于提供一个引用或细节，说明下一行将在屏幕上打印一个字符串。


    单行注释的语法：


    ```

    //<string-comment>

    ```


    语法中的 `<string-comment>` 应该替换为代表程序员代码中注释的文本条。注释可以是单行的，也可以是多行的。第 5 行是单行注释的示例。多行注释使用
    `/* */`（斜杠星号星号斜杠），其中包含的任何内容都被视为注释。它可以跨越多行。格式如下所示。


    多行注释的语法：


    ```

    /* <string-comment-string-comment

    -string-comment> */

    ```


    ### 第 6 行。`cout<<"Hello World!";`


    `cout` 读作“C-out”。`cout` 语句是 `"iostream"` 库下的库对象流，用于在屏幕上显示信息。`cout` 语句可以显示简单的文本消息，也可以显示一个或多个程序变量的值。`cout`
    后面跟着 `<<`（输出重定向运算符），其后的任何内容都会写在屏幕上。如果需要打印字符字符串，请确保将其包含在双引号 `"` 中，如第 6 行所示。


    打印字面量文本的 `cout` 语法：


    ```

    cout<<"<string-to-print>";

    ```


    在语法中，双引号 `" "` 内的任何内容都被视为字面量并打印在屏幕上。`<string-to-print>` 应该替换为要在屏幕上打印的文本条。`cout`
    语句必须以分号 `;` 结尾。


    注意：如果省略了第 2 行的 `namespace std;`，则 `cout` 语句应写为 `std::cout<<"<string-to-print>";`。


    ### 第 7 行。`getchar();`


    `getchar()` 意为“获取字符”，是一个库函数，接受从键盘接收的字符。如果代码中省略了 `getchar()`，程序将运行，但在打印“Hello World!”单词后，程序会立即终止。这就是
    Dev-C++ 显示控制台的设计方式。程序输出会立即关闭，用户可能无法看到。因此，`getchar()` 被用作触发器，当输出显示在屏幕上时，用户在程序终止之前必须按下键盘上的某个键（空格键除外）。`getchar()`
    仅被用作终止符，并用于书中的其他示例程序。`getchar()` 函数必须以分号 `;` 结尾。


    注意：如果你使用具有不同显示控制台行为的其他编译器，你可能需要移除 `getchar()`。


    ### 第 8 行。`Return 0`


    从技术上说，在 C++ 中，`main()` 函数必须返回一个值，因为大多数编译器要求声明时带有返回值，并且将其声明为 `int main()` 是一种传统，表示它应该返回一个整数值。返回值通常会传回操作系统。传统上，`0`
    表示程序确实成功。


    注意：你不需要显式返回 `0`，因为这会在 `main()` 函数终止时自动发生。但请记住，`main()` 函数是唯一允许省略返回值的函数。C++ 程序员在
    `main()` 函数中包含 `return 0` 也是常见做法，因此书中的其余示例程序的 `main()` 函数中都包含了 `return 0`。


