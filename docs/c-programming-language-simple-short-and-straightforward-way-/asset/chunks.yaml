    \ using the keyboard or even mouse pointer. In most program environments, the\
    \ standard input by default is the keyboard, and the C++ stream object defined\
    \ to access it is `cin`.\n\n### Syntax for standard input `cin`:\n\n```\ncin >>\
    \ <var-name>\n```\n\nFor formatted input operations, `cin` is used together with\
    \ the extraction operator, which is written as `>>`. This operator is then followed\
    \ by the variable where the extracted data is stored. The `<var-name>` in the\
    \ syntax should be replaced with the variable name where the entered value will\
    \ be assigned to. Figure 4.7 presents a sample output of using `cin`.\n\nFigure\
    \ 4.7 (source file name: `ch4sample5.cpp`)\n\n![](tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_3b2ddc81.png)\n\
    \nLine 5 declares a variable named `intAge`. Line 7 presents the use of `cin`\
    \ which accepts a key entry from the keyboard and assigns it to variable `intAge`.\
    \ In line 10, `fflush(stdin)` flushes the content of the standard input. This\
    \ line is used to enable the `getchar()` function in line 11, because the combination\
    \ of the `cin` and `getchar()` in one program may cause problems. These problems\
    \ are due to the conflicting behaviors of the two. All succeeding sample programs\
    \ using the `cin` standard input uses the `fflush(stdin)` and `getchar()` functions\
    \ to display the console output and terminates upon keypress.\n\nFigure 4.8 presents\
    \ the output of the sample program.\n\nFigure 4.8\n\n![](tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m5a9acd2e.png)\n\
    \n#### Code listings of figure 4.7\n\n```cpp\n#include<iostream>\n\nusing namespace\
    \ std;\n\nint main()\n{\n    int intAge;\n    cout<<\"How old are you? \";\n \
    \   cin>>intAge;\n    cout<<\"You are \"<<intAge<<\" years old.\";\n    fflush(stdin);\n\
    \    getchar();\n    return 0;\n}\n```\n\nExtractions on `cin` can also be chained\
    \ to request more than one datum in a single statement:\n\n```\ncin>>intNum1>>intNum2;\n\
    ```\n\nThe above statement is equivalent to:\n\n```cpp\ncin>>intNum1;\ncin>>intNum2;\n\
    ```\n\n### `cin` and strings\n\nUnlike C language which uses array of character\
    \ to deal with strings, C++ already has a library intended to deal with string.\
    \ This library is called `string` which enables the use of string data type. To\
    \ include the string library, the format is presented below.\n\n```cpp\n#include<string>\n\
    ```\n\nThe extraction operator can be used on `cin` to get strings of characters\
    \ in the same way as with fundamental data types.\n\n#### Syntax of accepting\
    \ string with `cin`:\n\n```\ncin >> <str-varname>;\n```\n\nThe `<str-varname>`\
    \ in the syntax should be replaced with the string variable name where the entered\
    \ string will be stored. Figure 4.9 presents a sample program that accepts string\
    \ using the `cin`.\n\nFigure 4.9 (source file name: `ch4sample6.cpp`)\n\n![](tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m2f26d610.png)\n\
    \nLine 2 presents the inclusion of `\"string\"` library into the program. Line\
    \ 6 declares a string data type which is a part of the string library. Line 8\
    \ accepts a string using the `cin` and assigns the entered string to the `strFname`\
    \ variable. Figure 4.10 presents the sample output of the program.\n\nFigure 4.10\n\
    \n![](tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_a382897.png)\n\n#### Code\
    \ listings of figure 4.9\n\n```cpp\n#include<iostream>\n#include<string>\n\nusing\
    \ namespace std;\n\nint main()\n{\n    string strFname;\n    cout<<\"What is your\
    \ first name:\";\n    cin>>strFname;\n    cout<<\"Your name is \"<<strFname;\n\
    \    fflush(stdin);\n    getchar();\n    return 0;\n}\n```\n\nHowever, `cin` extraction\
    \ always considers spaces such as whitespaces, tabs, and new-lines as terminator\
    \ of the value being extracted, and thus extracting a string means to always extract\
    \ a single word, not a phrase or an entire sentence. For example, if the program\
    \ ask for the complete name of the user, if the user entered \"Sherwyn Allibang\"\
