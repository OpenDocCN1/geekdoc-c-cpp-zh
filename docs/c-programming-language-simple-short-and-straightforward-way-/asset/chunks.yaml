    Compound declaration and definition of structure


    Structure definition can take place immediately after the declaration of structure.
    However, the declared structure is automatically declared as a global structure
    variable.


    Syntax of compound declaration and definition of structure:


    struct <struct-name>


    {


    <member variable(s)>


    } <struct-varname>;


    As presented in the syntax, the structure definition <struct-varname> immediately
    follows the structure declaration and before the ; semi-colon terminator.


