  trans: "\n计算机程序需要用户与程序之间存在交互。在屏幕上显示信息非常重要，以便根据给定的输入提供程序的响应。输入意味着向程序馈送某些数据。输入可以以文件的形式，也可以通过键盘或甚至鼠标指针从命令行提供。在大多数程序环境中，默认的标准输入是键盘，而用于访问它的\
    \ C++ 流对象定义为 `cin`。\n\n### 标准输入 `cin` 的语法：\n\n```\ncin >> <var-name>\n```\n\n\
    对于格式化输入操作，`cin` 与提取运算符一起使用，该运算符写为 `>>`。该运算符后面紧跟存储所提取数据的变量。语法中的 `<var-name>` 应该替换为赋值输入值的变量名。图\
    \ 4.7 展示了使用 `cin` 的示例输出。\n\n图 4.7（文件名：`ch4sample5.cpp`)\n\n![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_3b2ddc81.png)\n\
    \n第 5 行声明了一个名为 `intAge` 的变量。第 7 行展示了 `cin` 的用法，它接受键盘的键入并将其赋值给变量 `intAge`。在第 10\
    \ 行，`fflush(stdin)` 刷新标准输入的内容。此行用于启用第 11 行中的 `getchar()` 函数，因为在一个程序中使用 `cin` 和\
    \ `getchar()` 可能会导致问题。这些问题是由于两者行为冲突引起的。后续所有使用 `cin` 标准输入的示例程序都使用 `fflush(stdin)`\
    \ 和 `getchar()` 函数来显示控制台输出，并在按键后终止。\n\n图 4.8 展示了示例程序的输出。\n\n图 4.8\n\n![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m5a9acd2e.png)\n\
    \n#### 图 4.7 的代码列表\n\n```cpp\n#include<iostream>\n\nusing namespace std;\n\nint\
    \ main()\n{\n    int intAge;\n    cout<<\"How old are you? \";\n    cin>>intAge;\n\
    \    cout<<\"You are \"<<intAge<<\" years old.\";\n    fflush(stdin);\n    getchar();\n\
    \    return 0;\n}\n```\n\n`cin` 的提取也可以链式调用，以便在单个语句中请求多个数据：\n\n```\ncin>>intNum1>>intNum2;\n\
    ```\n\n上述语句等同于：\n\n```cpp\ncin>>intNum1;\ncin>>intNum2;\n```\n\n### `cin` 与字符串\n\
    \n与 C 语言使用字符数组处理字符串不同，C++ 已经有一个用于处理字符串的库。该库被称为 `string`，它允许使用字符串数据类型。包含字符串库的格式如下所示：\n\
    \n```cpp\n#include<string>\n```\n\n提取运算符可以用于 `cin` 来获取字符字符串，其方式与基本数据类型相同。\n\n\
    #### 使用 `cin` 接收字符串的语法：\n\n```\ncin >> <str-varname>;\n```\n\n语法中的 `<str-varname>`\
    \ 应该替换为存储输入字符串的字符串变量名。图 4.9 展示了一个使用 `cin` 接收字符串的示例程序。\n\n图 4.9（文件名：`ch4sample6.cpp`)\n\
