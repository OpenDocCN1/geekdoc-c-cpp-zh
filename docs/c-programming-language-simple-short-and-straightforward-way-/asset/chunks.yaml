    ### 在条件语句中需要考虑的因素：\n\n1. **何时使用 `if()` 语句而不是 `switch()` 语句：**\n   在条件简单且较少的情况下，`if()`\
    \ 语句执行更快且更容易编写。`if()` 语句允许在条件中使用复杂的表达式，而 `switch()` 需要常量。此外 `if()` 接受所有数据类型（包括字符串），而\
    \ `switch()` 则不允许。因此，根据程序的需要，程序员应该自己决定使用哪种条件语句。\n\n2. **何时使用 `switch()` 语句而不是\
