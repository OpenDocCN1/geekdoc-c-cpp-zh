    Chapter 4 - Fundamentals of Input And Output in C++


    This chapter presents the essentials of displaying data on-screen, accepting input
    from the user and other input and output stream in C++.


    Displaying text on-screen


    The most common operation in any C++ program is to display a text on-screen and
    the stream responsible for this is the cout. A stream is an entity where a program
    can either insert or extract characters to/from.


    Syntax of the **standard output** cout:


    cout << <value-to-print>


    The **<<** operator inserts the data that follows it into the stream that precedes
    it. The <value-to-print> can either be a **literal text**, a **numeric value**,
    a **variable**, or a **expression**.


    The cout is used in conjunction with the stream insertion operator, which is written
    as << which are two less than signs as shown in figure 4.1.


    Figure 4.1 (source file name: ch4sample1.cpp)


    ![](tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m2f0bbb7c.png)


    Lines 5 to 7 prints several literal strings/text on-screen and figure 4.2 presents
    the output of the sample program.


    Figure 4.2


    ![](tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m7b2ea00e.png)


    Code listings of figure 4.1


    #include<iostream>


    using namespace std;


    int main()


    {


    cout<<"Hello World.";


    cout<<"Hello C++.";


    cout<<"I Love C++!";


    getchar();


    return 0;


    }


    What cout does not do automatically is add line breaks at the end, unless instructed
    to do so as presented in figure 4.2 in the example above.


    To insert a **line break**, a new-line character shall be inserted at the exact
    position where the line should be broken. In C++, a new-line character can be
    specified as \n (backslash n) and should be included inside the literal string.
    Figure 4.3 presents a sample program that uses the line break \n.


    Figure 4.3 (source file name: ch4sample2.cpp)


    ![](tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m6e1f3e0e.png)


    Lines 5 and 6 presents the use of line break \n and figure 4.4 presents the output.


    Figure 4.4


    ![](tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m523ca069.png)


    Code listings of figure 4.3


    #include<iostream>


    using namespace std;


    int main()


    {


    cout<<"Hello World.\n";


    cout<<"Hello C++.\n";


    cout<<"I Love C++!";


    getchar();


    return 0;


    }


    Alternatively, the endl manipulator can also be used to break lines. Figure 4.5
    presents a sample program.


    Figure 4.5 (source file name: ch4sample3.cpp)


    ![](tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_146f8fbf.png)


    Lines 5 and 6 presents the use of endl manipulator. It should follow the << stream
    insertion operator. The endl manipulator produces a newline character, exactly
    as the insertion of ''\n'' does; but it also has an additional behavior wherein
    the stream''s buffer (if any) is flushed, which means that the output is requested
    to be physically written to the device, if it wasn''t already. Bear in mind that
    a flushing operation incurs a certain overhead, and on some devices it may produce
    a delay. The program output will render the same results as presented in figure
    4.4.


    Code listings of figure 4.5


    #include<iostream>


    using namespace std;


    int main()


    {


    cout<<"Hello World."<<endl;


    cout<<"Hello C++."<<endl;


    cout<<"I Love C++!";


    getchar();


    return 0;


    }


    Multiple insertion operations (<<) may be chained in a single statement as presented
    below.


    cout<<"I Love"<< "C++ and"<<"this is a single statement";


    Chaining insertions is especially useful to mix literals and variables in a single
    statement as presented in the example below.


    cout<<"I Love C++ and I am "<<intAge<<"years old";


    Assuming the intAge variable contains the value 21, the output of the statement
    would be:


    I Love C++ and I am 21 years old


    Figure 4.6 presents a sample output of chaining multiple insertion operators.


