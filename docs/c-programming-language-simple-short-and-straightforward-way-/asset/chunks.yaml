  trans: "\n查看表 6.3，操作按照以下顺序执行：首先执行的是一元递增和递减，它们的优先级最高；其次执行的是乘法、除法和取模运算；最后执行的是加法和减法，它们的优先级最低。\n\
    \n如果一个表达式包含多个相同优先级的运算符，则按照它们在表达式中出现的顺序从左到右执行运算符。下面是一个包含 `/` 和 `*` 的表达式示例，它们具有相同的优先级，但由于\
    \ `/` 是最左侧的运算符，因此首先执行它，结果得到值为 12。\n\n```\n24/4*2\n```\n\n在某些情况下，表达式中的操作需要按照程序员的意图进行求值。例如，程序员需要上述表达式的结果为值\
    \ 3，即在除法之前先执行乘法。在 `C++` 中，使用括号 `( )` 来修改求值顺序。括号内的子表达式首先求值，而不考虑运算符的优先级。下面的示例修改了上面的表达式，以得到结果值\
    \ 3。\n\n```\n24/(4*2)\n```\n\n括号内的表达式 `4 * 5` 首先被求值，因此值 24 除以 8。下面是一个更复杂的表达式示例。\n\
    \n```\nintNum=30-(2*(10+(6/2)));\n```\n\n上述表达式的求值过程如下：\n\n1. 首先求值最内层的表达式 `6/2`，得到值\
    \ 3：\n   ```\n   30-(2*(10+3))\n   ```\n2. 向外移动，对下一个表达式 `10+3` 进行求值，得到值 13：\n\
    \   ```\n   30-(2*13)\n   ```\n3. 最后（或最外层）表达式 `2*13` 被求值，得到值 26：\n   ```\n   30-26\n\
    \   ```\n4. 最终表达式 `30-26` 被求值，将值 4 赋值给变量 `intNum`：\n   ```\n   intNum=4\n   ```\n\
    \n### 3. 关系运算符\n\n`C++` 的关系运算符用于比较表达式，提出诸如“Num 是否大于 5？”或“Num 是否等于 10？”等问题。包含关系运算符的表达式求值结果为\
    \ `true`（非零）或 `false`（零）。记住，在 `C++` 中，表达式返回一个数值。`C++` 的六个关系运算符列在表 6.4 中。\n\n表\
    \ 6.4\n![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_2dad3b7a.png)\n\
    \n表 6.5 展示了关系运算符的一些示例。这些示例使用了字面量常量，相同的原理也适用于变量。\n\n表 6.5\n![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_581494f4.png)\n\
    \n对于使用两个或多个关系运算符的表达式，表 6.6 列出了它们的优先级。\n\n表 6.6\n![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m3854b997.png)\n\
    \n关系运算符与条件语句结合使用，条件语句将在本书的下一章进行讨论。\n\n### 4. 逻辑运算符\n\n`C++` 语言中的逻辑运算符允许程序员将两个或多个关系表达式组合成单个表达式（也称为复合表达式），其求值结果\
    \ `true` 或 `false`。这三个逻辑运算符列在表 6.7 中。\n\n表 6.7\n![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m206729ac.png)\n\
    \n在表 6.7 中，`exp1` 和 `exp2` 求值为 `true` 或 `false`。例如，如果 `exp1` 求值为 `true` 且 `exp2`\
    \ 求值为 `false`，逻辑运算符将结果组合成 `true` 或 `false` 的复合结果，具体取决于使用了哪个逻辑运算符。`NOT` 运算符是唯一一个不组合表达式的逻辑运算符。表\
    \ 6.8 展示了逻辑运算符的真值表。\n\n表 6.8\n![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m4cd3393e.png)\n\
    \n如表 6.8 所示，`AND` 运算符的复合结果当且仅当两个表达式都为真时求值为 `TRUE`，否则复合结果为 `FALSE`。此外，`OR` 运算符的复合结果当任一表达式为真时求值为\
    \ `TRUE`，否则复合结果为 `FALSE`。最后，`NOT` 运算符反转真值。`True` 变为 `FALSE`，`false` 变为 `TRUE`。\n\
    \n程序员也可以创建使用多个逻辑运算符的表达式。例如，为了询问 `intNum` 是否等于 5、9 或 3，它将写为：\n\n```\nintNum==5\
    \ || intNum==9 || intNum==3\n```\n\n上述示例 6.5 展示了 `intNum` 等于 5 的情况。\n\n图 6.5\n\
    ![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_7017e.png)\n\n括号内的表达式\
    \ `4 * 5` 首先被求值，因此值 24 除以 8。下面是一个更复杂的表达式示例。\n\n```\nintNum=30-(2*(10+(6/2)));\n\
    ```\n\n上述表达式的求值过程如下：\n\n1. 首先求值最内层的表达式 `6/2`，得到值 3：\n   ```\n   30-(2*(10+3))\n\
    \   ```\n2. 向外移动，对下一个表达式 `10+3` 进行求值，得到值 13：\n   ```\n   30-(2*13)\n   ```\n3.\
    \ 最后（或最外层）表达式 `2*13` 被求值，得到值 26：\n   ```\n   30-26\n   ```\n4. 最终表达式 `30-26` 被求值，将值\
    \ 4 赋值给变量 `intNum`：\n   ```\n   intNum=4\n   ```\n\n### 类型转换\n\n类型转换是将一种数据类型转换为另一种的方法。在\
    \ `C++` 中，转换有两种类型：隐式转换和显式。\n\n#### 隐式转换\n\n隐式转换由编译器自动完成。例如，当 `int` 被赋值给 `float`\
    \ 变量时。\n\n```cpp\nint i = 5;\nfloat f = i;\n```\n\n#### 显式转换\n\n显式转换由程序员执行。在 `C++`\
    \ 中有两种显式转换的方法：\n\n```cpp\nint i = 5;\nfloat f = (float)i; // C 风格转换\n```\n```cpp\n\
    int i = 5;\nfloat f = static_cast<float>(i); // C++ 风格转换\n```\n\n`static_cast`\
    \ 运算符优于 C 风格转换，因为它更安全且明确。\n\n#### 类型转换示例\n\n下面是一个使用显式转换的示例：\n\n```cpp\nint a =\
    \ 5;\nint b = 2;\nfloat result = (float)a / b;\n```\n\n该表达式的结果将是 2.5。如果没有使用转换，由于整数除法，结果将是\
    \ 2。\n"
