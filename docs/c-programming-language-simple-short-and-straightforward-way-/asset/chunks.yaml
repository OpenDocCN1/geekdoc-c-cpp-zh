    ## 2. Multi-Dimensional Array (Two-Dimensional)


    A two-dimensional array can hold 2 subscripts which can be represented as rows
    and columns.


    Example:


    ```cpp

    int num[2][3];

    ```


    The example can be represented like a 2 x 3 table as presented in table 5.1.


    Table 5.1


    ![](tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m32bbce77.png)


    The numbers in table 5.1 is the subscript numbers of the array. The above two-dimensional
    array example can hold 6 data. Below is an example of initializing the two-dimensional
    array.


    ```cpp

    num[0][0]=5;

    num[0][1]=3;

    num[0][2]=8;

    num[1][0]=7;

    num[1][1]=2;

    num[1][2]=15;

    ```


    Multi-dimensional array can have more dimensions, but having more than two dimensions
    means developing a very complicated program. Even industry practitioners has difficulty
    dealing with multi-dimensional arrays. The following are sample programs that
    uses arrays.


    ### Array program1


    Figure 5.1 presents a sample program that declares and defines a single and two-dimensional
    array and prints their values. Figure 5.2 presents the output.


    Figure 5.1 (source file name: ch5sample1.cpp)


    ![](tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_mb6d4b13.png)


    Line 6 declares and defines (initialize) a single dimensional array with 3 elements
    named `num1`, and line 7 prints its values using the `cout<<`. Line 10 declares
    a single dimensional array named `num2` with 3 elements, and lines 13 to 15 is
