  trans: "\n\n`<ret-type>` 是方法的返回类型。它可以是 C++ 中的任何数据类型，如果不需要返回值，则使用关键字 `void`。`<class-name>`\
    \ 是要定义该方法的类名。`<method-name>` 是类中方法的名称，`<par>` 是参数（如果有的话）。与用户自定义函数类似，方法可以有 0 个或多个参数。下面展示了\
    \ `Dog` 类的 `Bark()` 方法的定义。\n\n```cpp\nvoid Dog::Bark()\n{\n    cout<<\"Baw! waw!\
    \ waw! argh! argh!\";\n}\n```\n\n在示例中，`Bark()` 方法没有参数，因为它只会在屏幕上打印狗的叫声。\n\n## 定义类的对象\n\
    \n对象的定义与声明变量相似。\n\n定义`一个类的对象`的语法如下：\n\n`<class-name> <object-name>;`\n\n下面的示例展示了一个名为\
    \ `Blacky` 的 `Dog` 类类对象的定义。\n\n```cpp\nDog Blacky; // 将 Blacky 定义为 Dog 的对象\n```\n\
    \n上面的示例定义了 `Blacky`，它是一个类（或类型）为 `Dog` 的对象。对象是类的单个`实例`。\n\n图 11.1 展示了一个声明并定义了类的程序，并显示了它们在源代码中应该放置的位置。\n\
    \n图 11.1\n\n![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_5500c479.png)\n\
    \n类声明应该放在 `main()` 函数之前，如第 5 到 14 行所示，其方法定义应该紧随之后，如第 17 到 20 行所示。最后，第 24 行展示了\
    \ Dog 类对象的定义。\n\n## 访问类成员\n\n一旦定义了类的对象，就可以通过 `.` 点成员访问运算符访问其成员。在上面的示例中，实际定义的 `Dog`\
    \ 对象命名为 `Blacky`。因此，要给 `Blacky` 的 `weight` 成员变量赋值 20，程序员将写：\n\n```cpp\nBlacky.weight=20;\n\
    ```\n\n同样地，要调用 `Meow()` 函数，程序员将写：\n\n```cpp\nBlacky.Bark();\n```\n\n图 11.2 展示了一个使用类的程序。\n\
    \n图 11.2 (源文件名：`ch11sample1.cpp`)\n\n![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m32b8061b.png)\n\
    ![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m3462c2d4.png)\n\n第 25\
    \ 和 26 行展示了对对象 `Blacky` 成员变量的赋值，第 27 和 28 行展示了为了打印而访问其成员变量。第 29 行展示了调用对象 `Blacky`\
    \ 的方法 `Bark()`。所有这些操作都使用了 `.` 点访问运算符。图 11.3 展示了程序的输出。\n\n图 11.3\n\n![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m2d562a0a.png)\n\
    \n图 11.2 的代码列表\n\n```cpp\n#include<iostream>\n\nusing namespace std;\n\n//类声明\n\
    class Dog\n{\n    // 成员变量为 age & weight\n    public:\n    unsigned int age;\n\
    \    unsigned int weight ;\n    // 成员方法\n    void Bark();\n};\n\n//方法定义\nvoid\
    \ Dog::Bark()\n{\n    cout<<\"Baw! waw! waw! argh! argh!\";\n}\n\nint main()\n\
    {\n    // Dog 类的对象定义\n    Dog Blacky;\n    Blacky.weight=20;\n    Blacky.age=5;\n\
    \    cout<<\"Blacky is \"<<Blacky.weight<<\" kgs.\"<<endl;\n    cout<<\"Blacky\
    \ is \"<<Blacky.age<<\" years old.\"<<endl;\n    Blacky.Bark();\n    fflush(stdin);\n\
    \    getchar();\n    return 0;\n}\n```\n\n## 私有与公共访问控制\n\n类的所有成员变量和方法默认都是私有的。私有成员只能在类本身的方法内部访问；另一方面，公共成员可以通过类的任何对象进行访问，类似于图\
    \ 11.2 所示的示例，它仅使用 `.` 点访问运算符来访问成员变量。\n\n作为一项通的设计规则，程序员应该将类的成员变量保持为私有。因此，程序员应该创建名为`访问器方法（accessor\
    \ methods）的公共方法来设置和获取私有成员变量。这些`访问器方法`是程序其他部分为了设置和获取私有成员变量的值而需要的成员方法。\n\n问题是，为什么要费力进行这种额外的间接访问呢？毕竟，直接通过公共方式访问成员变量比通过`访问器方法`操作要简单快捷得多。\n\
    \n`访问器方法`允许程序员将数据的存储细节与使用方式分开，这为成员变量提供了更多的安全性。这种方法被称为访问方法。图 11.4 展示了使用访问方法的示例程序\n\
    \n图 11.4 (源文件名：`ch11sample2.cpp`)\n\n![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_1744)\n\
    ![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_313f)\n![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_5097)\n\
    \n第 8 和 9 行是类的声明。第 11 到 17 行是方法的声明。第 15 行 `getAge()` 方法为 `void`。第 21 到 24 行是 `setAge()`\
    \ 方法的声明。第 52 行是 `setAge()` 的调用，第 55 行是 `getAge()` 的调用。图 11.5 展示了输出。## 构造函数与析构函数\n\
    \n类有一种特殊的成员函数称为构造函数。`构造函数`可以接受参数，但不能返回值，即使是 `void`也不行。`构造函数`是与类同名的类方法。每当程序员声明构造函数时，也必须声明析构函数。\n\
    \n`析构函数`用于清理对象并释放不再需要的任何内存。析构函数的名称总是类名，前面有一个波浪号（`~`）。析构函数不接受参数也没有返回值。因此，上述示例中的\
    \ `Dog` 类可以有一个析构函数：`~Dog();`\n\n如果程序员没有声明构造函数或析构函数，编译器会创建一个默认的。在图 11.4 的示例中没有创建构造函数，因此编译器创建一个默认的。默认构造函数的名称是类本身，类似于图\
