    本章介绍了在屏幕上显示数据、接受用户输入以及 C++ 中其他输入/输出流的要点。


    ### 在屏幕上显示文本


    任何 C++ 程序中常见的常见的操作是在屏幕上显示文本，负责此操作的流是 `cout`。流（stream）是一个实体，程序可以从中插入或从中提取字符。


    #### 标准输出 `cout` 的语法：


    ```cpp

    cout << <value-to-print>

    ```


    `<<` 运算符将跟随其后的数据插入到其之前的流中。`<value-to-print>` 可以是`字面量文本`、`数值`、`变量`或`表达式`。


    `cout` 与插入运算符结合使用，写为 `<<`，即两个小于号，如图 4.1 所示。


    图 4.1 (源文件名：`ch4sample.cpp`)


    ![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m2f0.png)


    第 5 到 7 行显示了字符串，图 4.2 展示了程序的输出。


    图 4.2


    ![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_bbb7.png)


    #### 图 4.1 的代码列表


    ```cpp

    #include<iostream>


    using namespace std;


    int main()

    {

    cout<<"Hello World";

    cout<<"C++";

    cout<<"I Love";

    }

    ```


    除非指示，否则 `cout` 不会自动换行。要插入换行，可以如图 4.3 所示指定换行符。图 4.3 (源文件名：`ch4sample.cpp`)


    ![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m6e1.png)


    第 5 和 6 行展示了图 4.4 中 `endl` 的用法。


    图 4.4


    ![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m523.png)


    #### 图 4.3 的代码列表


    ```cpp

    #include<iostream>


    using namespace std;


    int main()

    {

    cout<<"Hello World\n";

    cout<<"C++\n";

    cout<<"I Love";

    }

    ```


    或者，可以使用 `endl` 操纵符来换行。图 4.5 展示了一个示例。


    图 4.5 (源文件名：`ch4sample.cpp`)


    ![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m146.png)


    #### 图 4.4 的代码列表


    ```cpp

    #include<iostream>


    using namespace std;


    int main()

    {

    cout<<"Hello World"<<endl;

    cout<<"C++"<<endl;

    cout<<"I Love";

    }

    ```


    多个插入操作（`<<`）可以在单个语句中链式调用，如下所示。


    ```cpp

    cout<<"I Love"<< "C++ and<<"this is a single statement";

    ```


    链插入在单个语句中混合字面量和变量特别有用，如示例所示。


    ```cpp

    cout<<"I Love C++ and I am "<<intAge<<"years old";

    ```


    假设变量 `intAge` 包含值 21，该语句的输出将是：


    I Love C++ and I am 21 years old


    图 4.6 展示了多个插入运算符的输出。


    图 4.6 (源文件名：`ch4sample.cpp`)


    ![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_297.png)


    第 6 行展示了多个插入运算符的使用。打印变量时，不应将其包含在 `""` 双引号内。图 4.7 展示了示例输出。


    图 4.7


    ![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m651.png)


    #### 图 4.5 的代码列表


    ```cpp

    #include<iostream>


    using namespace std;


    int main()

    {

    int intAge=30;

    cout<<"My name is Sherwyn and I am "<<intAge<<"yrs old."<<endl;

    cout<<"I Love C++!";


    getchar();


    return 0;

    }

    ```


