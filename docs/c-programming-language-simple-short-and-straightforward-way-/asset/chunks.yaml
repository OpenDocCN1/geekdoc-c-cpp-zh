    Line 5 declares a integer variable named `iCtr`. This variable acts as the counter
    variable of the `for()` loop statement. Lines 7 to 10 presents the `for()` statement.
    In line 7, `iCtr=1` is the counter initialization which is initially set to the
    value 1\. This initializes the `iCtr` so that it can be used by the rest of the
    loop. The second step in executing this `for()` statement is the evaluation of
    the counter condition `iCtr<=5`. Because `iCtr` was just initialized to 1, and
    it is less than 5, so the statement in the `for()` statement, `cout<<"Hello "<<iCtr<<endl;`,
    is executed. After executing the `cout`, the counter modifier, `ictr++` is executed.
    This adds 1 to `iCtr`, making it 2\. Now the program loops back and checks the
    condition again. If it is true, the `cout` re-executes, then the counter modifier
    increments `iCtr` (making it 3), and the counter condition is checked. This loop
    continues until the counter condition evaluates to false, at which point the program
    exits the loop and continues to the next line (line 11) onwards, then ends the
    program. Figure 8.2 presents the output.


