    Chapter 13 - Pointer in C++


    A pointer is a value that designates the address (i.e., the location in memory),
    of some value. Pointers are variables that hold a memory location. This chapter
    presents the fundamentals of pointers in C++ programming language.


    Pointers in C++


    Pointers are widely used in programming; they are used to refer to memory location
    of another variable without using variable identifier itself. A pointer is a variable
    that is used to point to a memory address whose content is wanted to be used in
    the program. The contents of a pointer is a memory address of another location
    of memory, which is usually the memory address of another variable.


    Figure 13.1 illustrates the idea of pointers.


    Figure 13.1


    ![](tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_7f01cd4.png)


    As presented in figure 13.1, prtA is a pointer variable that holds the value 101
    which is a memory address. The value stored in the memory address 101 is the character
    ''A'', hence ptrA variable is pointed to memory address 101 with a value ''A''
    stored to it.


    Pointer Declaration


    To declare a pointer variable, the * operator (indirection/dereferencing operator)
    is used before the variable name and after the data type.


    Syntax of **pointer variable** declaration:


    <data-type> *<pointer-varname>;


    Example:


    int *ptrA;


    In the example, the ptrA is a variable declared as pointer with the data type
    integer. Every variable is a memory location and every memory location has its
    address defined which can be accessed using ampersand (&) operator, which denotes
    an address in memory.


    Figure 13.2 presents a sample program that uses the & operator to print the memory
    address of a declared variable.


    Figure 13.2 (source file name: ch13sample1.cpp)


    ![](tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m46129e36.png)


    In lines 7 and 8, the & ampersand operator retrieves the memory address instead
    of the value stored in that memory, hence in this example, instead of printing
    the value of variables iNum1 and iNum2, their memory address is printed. Figure
    13.3 presents the output of the program.


    Figure 13.3


    ![](tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m49282fca.png)


    The output of the program as presented in figure 13.3 may not be the same with
    the output for other computers as memory addresses may differ depending upon the
    compiler and platform. In the example, the memory address is printed in its numeric
    value.


    Code listings of figure 13.2


    #include<iostream>


    using namespace std;


    int main()


    {


    int iNum1=5, iNum2=10;


    cout<<"Memory address of iNum is "<<&iNum1<<endl;


    cout<<"Memory address of iNum is "<<&iNum2;


    fflush(stdin);


    getchar();


    return 0;


    }


    Notes:


    **&** ampersand is an address operator used to get the address of a variable.'
