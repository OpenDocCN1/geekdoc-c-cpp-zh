    Chapter 7 - Conditional Statements in C++


    This chapter presents decision making structures in C++ language. Decision making
    structures require that the programmer specifies one or more conditions to be
    evaluated or tested by the program, along with a statement or statements to be
    executed if the condition is evaluated to be true, and optionally, other statements
    to be executed if the condition is evaluated to be false. This chapter uses the
    different relational and logical operators and presents the fundamentals of conditional
    statements in C++ programming.


    The if() statement


    The if() statement is the commonly used conditional statement in C++ language.
    if() statement is the simplest form of the branching C statements. It takes an
    expression in parentheses and a statement or block of statements. The if() statement
    has different cases as follows:


    1\. **Single-alternative**


    Single-alternative execute the statement(s) under its "true path" only when the
    condition is true and has no other statement(s) to execute if the condition is
    false.


    Syntax of single-alternative if() statement:


    if(<condition>)


    {


    <True Path Statement(s)>


    }


    The <condition> in the syntax should be an expression that evaluates to either
    true or false and the <True Path Statement(s)> can be a single statement or block
    of statements. If the <condition> is evaluated to be true, execute the <True Path
    Statement(s)>, otherwise, exit the if() statement. Below is an example of single-alternative
    if() statement.


    if(5>2)


    {


    cout<<"The condition is True.";


    }


    In the above example, the expression 5>2 evaluates to true, hence the cout statement
    is executed. Below is another example that takes a compound expression using the
    logical operator AND.


    if((5>2)&&(5<4))


    {


    printf("The condition is True.");


    }


    The first expression 5>2 in the example above evaluates to true and the second
    expression 5<4 evaluates to false. The compound result of the two expressions
    using the && operator is FALSE, hence the cout statement is not executed.


