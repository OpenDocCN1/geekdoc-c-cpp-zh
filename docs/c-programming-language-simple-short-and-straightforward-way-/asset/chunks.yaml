    \ table 6.1, the following are example statements of using binary operators.\n\
    \n```cpp\nint intNum1=5, intNum2=4;\nint intVal;\n/*intVal is assigned to a value\
    \ 7 */\nintVal=intNum1+2;\n/*intVal is assigned to a value 1 */\nintVal=intNum1-intNum2;\n\
    /*intVal is assigned to a value 6 */\nintVal=3*2;\n/*intVal is assigned to a value\
