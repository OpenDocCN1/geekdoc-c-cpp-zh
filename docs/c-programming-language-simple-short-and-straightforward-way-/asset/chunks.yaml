  trans: "\n\n在语法中，`<statement(s)>` 是循环体，它可以是一个单条语句，也可以是一个语句块。循环体在`<condition>` 为真时反复迭代。`<condition>`\
    \ 可以是任何求值为真或假的表达式。请注意，`<condition>` 出循环的末尾，因此循环中的 `<statement(s)>` 在测试条件之前会先执行一次。如果条件为真，执行过程将回到\
    \ do 语句，循环中的 `<statement(s)>` 再次执行。这个过程不断重复，直到给定的 `<condition>` 变为假。\n\n图 8.7\
    \ 展示了一个示例程序，与图 8.5 中的示例类似，但使用了 `do while()` 循环语句。\n\n图 8.7（源文件名：`ch8sample4.cpp`）\n\
    \n![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m876d744.png)\n\n第\
    \ 5 行声明了两个名为 `iSum` 和 `iNum` 的整数变量。`iSum` 存储所有输入数字的总和，`iNum` 存储每个输入数字的值。第 7 行到\
    \ 12 行展示了 `do while()` 循环语句。第 9 行到 11 行是循环体。在评估 12 行 `while` 子句中的表达式 `iNum!=5`\
    \ 之前，会先执行循环体。如果 `iNum!=5` 求值为真，则会继续执行循环体，直到 `iNum!=5` 变为假。图 8.8 展示了可能的输出。\n\n\
    图 8.8\n\n![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m3f784099.png)\n\
    \n图 8.7 代码列表\n\n```cpp\n#include<iostream>\n\nusing namespace std;\n\nint main()\n\
    {\n\nint iSum=0,iNum;\n\ndo\n\n{\n\ncout<<\"Enter a integer number: \";\ncin>>iNum;\n\
    \niSum=iSum+iNum;\n\n} while(iNum!=5);\n\ncout<<\"The summation is \"<<iSum;\n\
    \nfflush(stdin);\n\ngetchar();\n\nreturn 0;\n\n}\n```\n\n注意：`do while()` 循环语句也可以嵌套，只要它符合语法即可。\n\
    \n## 无限循环\n\n如果循环条件始终不为假，循环体将无休止执行。因此它被称为**无限循环**。无限循环可能发生在所有的循环语句中，包括 `for()`、`while()`\
    \ 和 `do while()` 循环语句。\n\n当缺少条件表达式时，假设它为真。程序员可能会有一个初始化和递增表达式，但 C++ 程序员更常用 `for(;;)`\
    \ 结构来表示无限循环。\n\n## 自评测试题\n\n判断陈述句对或错。\n\n1. `for()` 循环语句中的 `<condition>` 是修改符，可以是计数器的简单递或或减。\n\
    2. `do while()` 循环语句与 `while()` 循环相似，区别在于测试条件是在循环末尾检查的，而不是开始。\n3. `while()` 循环语句可以嵌套在\
    \ `do while()` 循环语句中。\n4. 在 `while()` 循环语句中，如果测试条件为真：则执行语句。\n5. `while()` 循环语句可以使用，并且可以获得与编写\
    \ `for()` 循环语句相同的结果。\n6. 循环是在特定条件不被满足时不断重复相同代码的过程。\n\n选择最能完成陈述或回答问题的选项。\n\n7.\
    \ 它是 `for()` 循环语句中初始化计数变量的部分。\n   a. `<ctr-init>` c. `<ctr-modifier>`\n   b. `<ctr-condition>`\
    \ d. 无\n\n8. 它是 `for()` 循环语句中将计数器修改为递增或减的部分。\n   a. `<ctr-init>` c. `<ctr-modifier>`\n\
    \   b. `<ctr-condition>` d. 无\n\n回答以下问题：\n\n9. 当以下语句完成后，`x` 的值是多少？\n   `for(x=0;x<100;x++);`\n\
    \n10. 当以下语句完成后，`ctr` 的最终值是多少？\n    `for(ctr=2;ctr<10;ctr=ctr+3);`\n\n## 第 9 章\
    \ - C++ 语言中的用户定义函数\n\n函数是一组共同执行某项任务的语句。每个 C++ 程序至少有一个函数，即 `main()` 函数。C++ 中有两种类型的函数：1)\
    \ **预定义**函数（其中一些已在本书之前的章节中讨论过），另一类型被称为 2) **用户定义函数**。本章介绍了定义和使用用户定义函数的基础。\n\n\
    ### 用户定义函数\n\nC++ 允许程序员根据需要定义函数。这些函数被称为用户定义函数。创建一个用户定义函数涉及函数声明（即**函数原型**）和**函数定义**，后者定义了用户定义函数将执行的语句。\n\
    \n下面的讨论是创建一个返回矩形面积的用户定义函数的示例。计算矩形面积的数据是长度和宽度。函数的名称将为 `getArea()`。\n\n### 用户定义函数原型\n\
    \n函数原型仅仅是函数的声明，指定了函数的名称、参数和返回类型。它不包含函数体。函数原型为编译器提供了该函数可能被使用的信息。\n\n用户定义函数原型的语法：\n\
    `<ret-type> func_name(type param1, type param2, ...);`\n\n在示例中，语法为：\n`int getArea(int\
    \ len, int wid);`\n\n图 9.1 展示了应该在何处声明函数原型。\n\n图 9.1\n\n![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_fbac489.png)\n\
    \n第 4 行展示了函数原型的声明，它必须在 `main()` 函数之前声明。\n\n### 用户定义函数定义\n\n用户定义函数的函数定义包含了函数将执行的语句块。\n\
