    \n声明两个或多个变量可以在单行中也可以在不同的行。单行声明三个变量的示例是：\n\n```cpp\nint num1, num2, num3\n```\n\
    \n在单行中声明变量时，假设所有变量具有相同的数据类型，因此上面的示例声明了三个数据类型为 `int` 的变量。上面的示例也可以写成：\n\n```cpp\n\
    int num1;\nint num2;\nint num3;\n```\n\n### 变量定义\n\n变量声明之后，接下来是变量定义。**变量定义**是为变量定义或赋值值的过程。定义给变量的值必须与变量所声明的数据类型相对应。变量定义使用赋值运算符\
    \ `=` 等号，它将右侧（右操作数）的值赋值给左侧（左操作数）的变量。\n\n变量定义示例：\n\n```cpp\nage=18;\n```\n\n在示例中，值\
