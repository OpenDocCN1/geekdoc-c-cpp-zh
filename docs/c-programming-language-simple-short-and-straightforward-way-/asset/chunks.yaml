    The switch() statement


    A switch statement allows a variable to be tested for equality against a list
    of values. Each value is called a case, and the variable being switched on is
    checked for each switch case.


    Syntax of switch() statement:


    switch(<expression>)


    {


    case <cons-expression-1> :


    <statement(s)>;


    break; /* optional */


    case <cons-expression-N> :


    <statement(s)>;


    break; /* optional */


    /* Can have any number of case statements */


    default : /* Optional */


    statement(s);


    }


    In the syntax, the <expression> in the "switch" keyword should be an integral
    type like integer values, signed or unsigned. Boolean values, where 0 is equivalent
    to false and any nonzero number is equivalent to true. Can also be a character,
    which are automatically converted to an integer value by the compiler.


    The <cons-expression-1/N> in the "case" clause must be the same data type as the
    <expression> in the switch keyword, and it must be a constant or a literal.


    The switch() statement can have any number of case statements within a switch.
    Each case is followed by <cons-expression-1/N>, the value to be compared to, and
    ends with a **:** colon.


    When the variable being switched on is equal to a case, the statements following
    that case will execute until a "break" keyword is reached. When a "break" keyword
    is reached, it exits the switch() statement, and the execution goes to the next
    line following the switch() statement disregarding the succeeding case(s). Note
    that not every case needs to contain a "break". If no break appears, the execution
    will go through all the subsequent cases until a break is reached.


    A switch statement can have an optional "default" clause, which must appear at
    the end of the switch. The "default" clause can be used for performing a task
    when none of the cases is true. No break is needed in the default case.


    Also, note that switch() statement does not support strings as cases. In dealing
    with strings, it is recommended to use the if() statement.


