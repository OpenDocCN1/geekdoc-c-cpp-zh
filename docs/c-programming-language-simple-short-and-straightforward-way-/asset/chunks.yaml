  trans: "\n\n7. 编写一个名为 `numfunc` 的自定义函数原型，无参数且该函数不返回任何值。\n\n8. 编写一个名为 `charfunc`\
    \ 的自定义函数原型，该函数有三个名为 `x`、`y`、`z` 的参数。两个变量是整数类型，一个是浮点类型，并返回一个 `char` 类型的值。\n\n9.\
    \ 编写一条语句调用名为 `xfunc` 的用户定义函数，并将两个常量值 `5` 和 `10` 作为其参数。\n\n10. 如果用户定义函数不返回值，应该使用什么返回类型关键字。\n\
    \n# 第 10 章 - C++ 中的自定义数据类型\n\nC++ 编程语言中的数据类型是一组具有定义特征的值集合。数据类型分为两种。第一种是基本数据类型或内置类型，包括\
    \ `int`、`float`、`double` 等，如第 3 章 中讨论的。第二种是复合类型或自定义数据类型，可以使用基本数据类型甚至其他复合类型在程序中构建。本章介绍自定义数据类型的基础知识。\n\
    \n## 结构体 (Structures)\n\n自定义数据类型或复合类型可以使用 C++ 中的 `struct` 语句构建。结构体是一个或多个变量分组在单个名称下的集合，以便操作。结构体中的变量与数组中的变量不同，可以是不同的数据类型。结构体可以包含\
    \ C++ 的任何基本数据类型，包括数组和其他结构体。结构体中的每个变量被称为结构的 `member`（成员）。\n\n### 声明结构\n\n声明结构是创建一个自定义数据类型的过程，该类型稍后可以定义。声明结构位于声明该类型的变量之前。\n\
    \n`struct` 语句的语法：\n\n```cpp\nstruct <struct-name>\n{\n\n<member variable(s)>;\n\
    };\n```\n\n在语法中，标识结构声明开始的 `struct` 关键字后面必须紧跟 `<struct-name>`，它是结构体的名称或标签（遵循与其他\
    \ C++ 变量名相同的规则）。\n\n在 `<struct-name>` 后的大括号内是结构的成员变量列表，这些是组成结构的变量声明。此外，`struct`\
    \ 语句必须以分号 `;` 结束。结构声明应该在 `main()` 函数之前进行。\n\n下面是一个使用 `struct` 的自定义数据类型示例。\n\n\
    ```cpp\nstruct stud\n{\n\nunsigned int id;\nchar name[50];\nunsigned int yob;\n\
    };\n```\n\n该结构的名称是 `stud`，带有三个成员变量，分别是 `unsigned int id` 用于学生的识别号，`char name[50]`\
    \ 用于学生姓名，`unsigned int yob` 用于出生年份。\n\n### 定义结构\n\n定义结构类似于声明基本类型的变量。然而，在定义结构时，程序员\
    \ `programmer` 应该包含 `struct` 关键字和结构名称。\n\n定义结构的语法：\n\n```cpp\nstruct <struct-name>\
    \ <struct-varname>;\n```\n\n定义结构必须遵守声明变量的规则。下面是声明类型为 `stud` 的变量（定义结构）的示例。\n\n\
    ```cpp\nstruct stud studRecord;\n```\n\n在示例中，`stud` 是结构名称，`studRecord` 是数据类型为\
    \ `stud` 的变量名称。\n\n### 访问结构成员\n\n结构成员使用结构成员运算符（`.`），也称为点运算符）在结构名称和成员名称之间进行访问。`.`\
    \ 点用于引用或访问一个或多个成员变量。\n\n使用 `.` 点运算符访问成员的语法：\n\n```cpp\n<struct-varname>.<member-variable>\n\
    ```\n\n图 10.1 展示了一个使用 `struct` 语句使用自定义数据类型的示例程序。\n\n图 10.1（文件名：`ch10sample1.cpp`）\n\
    \n![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m3c45b9d7.png)\n\n\
    ![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_1927e10e.png)\n\n第 4\
    \ 到 9 行展示了名为 `stud` 的结构声明。第 6 到 8 行是 `struct` `stud` 的成员变量。第 14 行是结构定义。在这里，`studRecord`\
