    通过调用用户定义的函数，程序的执行将转移到用户定义的函数定义处。要调用用户定义的函数，只需使用其名称并包含参数（如果有），这些参数将传递给函数。


    ### 调用用户定义函数的语法：


    ```

    <func-name> (<arg1>, <argN>,..)

    ```


    在语法中，`<arg1>` 到 `<argN>` 是应该传递给用户定义函数的实际值，它们必须符合用户定义函数参数中声明的数据类型。参数（parameters）和实（arguments）之间的区别在于：参数是数据类型和变量名的声明（该术语通常用于函数原型），而实是这些变量将要持有的实际值（该术语通常用于函数调用）。


    图 9.3 展示了一个工作良好的程序，该程序使用用户定义的函数计算矩形的面积。


    #### 图 9.3（文件名：`ch9sample1.cpp`）


    ![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m26074786.png)


    第 3 行展示了用户定义的函数原型。`()` 括号内的 `int len` 和 `int wid` 是参数，因此该函数有两个整数类型的参数。


    第 6 行展示了 `main()` 函数内部局部变量的声明，命名为 `intLen` 和 `intWid`，类型为整数。


    第 8 行到 12 行要求用户输入矩形的长度和宽度，每个值分别赋值给变量 `intLen`（长度）和 `intWid`（宽度）。


    第 14 行打印“The area of rectangle is”，并执行函数调用，该调用将返回 `getArea(int Len, intWid)` 函数定义中返回的任何整数值。第
    14 行中的 `getArea(intLen, intWid)` 是调用函数定义的方法，`intLen` 和 `intWid` 是传递给第 21 行函数定义的实。在本例中，在执行第
    14 行后，程序的执行将跳转到第 21 行。


    在第 21 行中，`getArea()` 的参数 `int len` 和 `int wid` 现在根据第 14 行调用语句中传递的实获得了值。


    第 23 行到 25 行是函数将执行的语句，在本例中，它通过将变量 `len` 乘以 `wid`（代表矩形的长度和宽度）来计算矩形的面积。


    在第 25 行，具有返回值的用户定义函数需要 `return` 关键字，因此本例中的返回值变量 `iArea` 的值，该值将返回到第 14 行打印矩形的面积。


    图 9.4 展示了程序的可能输出。


    #### 图 9.4


    ![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_8e5c0ef.png)


    #### 图 9.3 的代码列表


    ```cpp

    #include<iostream>


    using namespace std;


    int getArea(int len, int wid);


    int main()


    {


    int intLen, intWid;


    cout<<"Enter the length of the rectangle: ";


    cin>>intLen;


    cout<<"Enter the width of the rectangle: ";


    cin>>intWid;


    cout<<"The area of rectangle is "<<getArea(intLen, intWid);


    fflush(stdin);


    getchar();


    return 0;


    }


    int getArea(int len, int wid)


    {


    int iArea;

    iArea=len*wid;


    return iArea;

    }

    ```


