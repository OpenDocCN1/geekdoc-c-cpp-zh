    # 第 11 章 - C++中的类


    第 10 章关于结构体的大部分讨论也适用于类。事实上，在声明类时，我们简单地将`struct`关键字替换为`class`关键字即可。然而，结构体和类之间存在重要的区别。虽然两者都有成员变量，但类还可以拥有结构体不具备的方法。类是
    C++的核心特征，本章介绍 C++类的基础。


    ## 什么是类？


    类用于指定对象的形状，它将数据表示（成员变量）和用于处理这些数据的类似函数的方法组合成一个整洁的包。类内部的数据和方法被称为类的成员。类扩展了 C++的内置能力，帮助程序员表示和解决复杂的现实问题。


    ## 创建新类型


    创建新的 `type` 与上一章讨论的创建 `structure` 类似，并遵循类似的原理。在 C++中，程序员可以创建任何需要的类型，这些这些新类型都可以具有内置数据类型的所有功能和威力。


    程序通常用于解决现实问题，例如模拟加热系统的工作。虽然可以使用仅用整数和字符编写的程序解决复杂问题，但如果程序员可以创建对象的表示（如模拟加热系统的工作），处理复杂问题将容易得多，如果程序员可以创建代表房间、热传感器、恒温器和锅炉的变量，就会变得更容易。这些变量与现实越接近，编写程序就越容易。


    ## 类与成员


    程序员可以通过声明 `class` 来创建一个新类型。`class` 只是变量（通常是不同类型）的集合与一组相关函数的组合，例如汽车关于轮子、门、座椅、窗口等的数据。`class`
    允许程序员封装（或绑定）这些各种部分和各种函数组合成一个集合，这种过程被称为封装。


    类似于结构体，类可以由任何数据类型的组合组成。类中的变量被称为成员变量或`数据成员`。类中的函数通常被称为成员函数或`方法`。例如，一个`Dog`类可能有表示年龄和颜色的数据成员，其方法包括
    `bark()`、`walk()` 和 `sit()`。


    ## C++中类的声明


    要声明类，使用`class`关键字后跟一个左大括号，然后列出类的变量和方法，并用右大括号和分号结束声明。


    类的声明语法：


    ```cpp

    class <class-name>

    {

    // 此处的访问控制

    // 此处声明类变量和方法

    };

    ```


    下面是`Dog`类的声明。


    ```cpp

    class Dog

    {

    // 成员变量为年龄和体重

    public:

    unsigned int age;

    unsigned int weight;


    // 成员方法

    void Bark();

    };

    ```


