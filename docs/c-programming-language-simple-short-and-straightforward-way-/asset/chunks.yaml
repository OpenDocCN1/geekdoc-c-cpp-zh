    `switch` 语句允许对变量与一组值进行等等性测试。每个值被称为一个 `case`，而被切换的变量会在每个 `switch case` 中进行检查。\n\
    \n### switch() 语句的语法\n\n```cpp\nswitch(<expression>)\n{\n    case <cons-expression-1>\
    \ :\n        <statement(s)>;\n        break; /* 可选 */\n    case <cons-expression-N>\
    \ :\n        <statement(s)>;\n        break; /* 可选 */\n    /* 可以有任意数量的 case statement\
    \ */\n    default : /* 可选 */\n        statement(s);\n}\n```\n\n在语法中，`\"switch\"\
    ` 关键字中的 `<expression>` 应该是整型，例如整数值、有符号或无符号。布尔值（其中 `0` 等于 `false`，任何非零数字等于 `true`）也可以。也可以字符，编译器会将字符自动转换为整数值。\n\
    \n`case` 子句中的 `<cons-expression-1/N>` 的数据类型必须与 `switch` 关键字中的 `<expression>` 类型相同，并且必须是常量或字面量。\n\
    \n`switch()` 语句可以在 `switch` 内部包含任意数量的 `case` 语句。每个 `case` 后面跟着 `<cons-expression-1/N>`（即要比较的值），并以\
    \ `:` 结束。\n\n当被切换的变量等于某个 `case` 时，该 case 后的语句将执行，直到遇到 `break` 关键字。当遇到 `break`\
    \ 关键字时，将退出 `switch()` 语句，执行跳转到 `switch()` 语句之后的下一行，忽略后续的 `case(s)`。注意，并不是每个 `case`\
    \ 都需要包含 `break`。如果没有出现 `break`，执行将通过所有后续的 `cases` 直到遇到 `break` 为止。\n\n`switch`\
    \ 语句可以有一个可选的 `\"default\"` 子句，它必须出现在 `switch` 的末尾。`\"default\"` 子句用于在所有 `cases`\
    \ 均假时执行任务。`default` case 中不需要 `break`。\n\n此外，请注意 `switch()` 语句不支持字符串作为 `cases`。在处理字符串时，建议使用\
    \ `if()` 语句。\n\n图 7.14 展示了一个处理 `switch()` 语句的程序。\n\n### 图 7.14 (源文件名: ch7sample5.cpp)\n\
    \n![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_599f439f.png)\n![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_62f7d314.png)\n\
    \n第 9 到 28 行展示了具有五个 `case` 子句和一个 `default` 子句的 `switch()` 语句。第 9 行拥有表达式 `cGrade`\
    \ 并将其与 `case` 子句进行比较。它首先与第一个 `case` \"A\" 比较。如果结果为真，打印 \"Excellent\"，然后换行；从而退出\
    \ switch。如果第一个 `case` 结果为假，执行将进入后续的 `case` 子句，如果没有没有 `case` 结果为真，执行将进入 `default`\
    \ 子句并打印 \"Invalid grade\"，然后退出 switch。图 7.15 展示了程序的示例输出。\n\n### 图 7.15\n\n![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_750db395.png)\n\
    \n### 图 7.14 的代码列表\n\n```cpp\n#include<iostream>\n\nusing namespace std;\n\nint\
    \ main()\n{\n    char cGrade;\n    cout<<\"Enter your grade character code: \"\
    ;\n    cin>>cGrade;\n    switch(cGrade)\n    {\n    case 'A' :\n        cout<<\"\
    Excellent!\"<<endl;\n        break;\n    case 'B' :\n        cout<<\"Greatly done\"\
    <<endl;\n        break;\n    case 'C' :\n        cout<<\"Well done\"<<endl;\n\
    \        break;\n    case 'D' :\n        cout<<\"You passed\"<<endl;\n       \
    \ break;\n    case 'F' :\n        cout<<\"Better try again\"<<endl;\n        break;\n\
