    {\ncout<<\"Positive\";\n}\nelse\n{\ncout<<\"Negative\";\n}\n\nfflush(stdin);\n\
    getchar();\nreturn 0;\n}\n```\n\n## 2. 多重分支\n\n7.4 中的示例程序看起来已经是一个很好的程序，但正数被定义为任何大于\
    \ 0 的数，另一方面，负数被定义为任何小于 0 的数。问题是，如果输入的数字是 0 呢？如果输入的数字是 0，图 7.4 中的示例程序将打印“Negative”，因为\
    \ 0 并不大于 0，因此表达式 `intNum>0` 求值为假，并执行假路径打印“Negative”。数字 0 既不是正数也不是负数。解决办法是使用多重分支\
    \ `if()` 语句。\n\n多重分支 `if()` 语句可以有两个或多个真路径没有假路径，或者有两个或多个真路径和一个假路径。为了让 `if()` 语句有两个或多个真路径，使用了\
    \ `else if` 子句。\n\n不带假路径的多重分支 `if()` 语句语法：\n\n```cpp\nif(<condition-1>)\n{\n \
    \   <1.True Path Statement(s)>\n}\nelse if(<condition-2>)\n{\n    <2. True Path\
    \ Statement(s)> even}\n[else if(<condition-N>)]\n{\n    <N. True Path Statement(s)>\n\
    }\n```\n\n在语法中，多重分支 `if()` 语句可以有由 `else if` 子句分隔的两个或多个 `<conditions>`。执行从评估第一个\
    \ `<condition-1>` 开始。如果第一个 `<condition-1>` 求值为真，则执行其真路径并退出循环，因此其他的 `<condition-2/N)`\
    \ 不再求值。然而，如果第一个 `<condition-1>` 求值为假，则评估后续的 `<conditions-2/N>`。一旦某个条件求值为真，执行其真路径，然后退出循环。如果没有条件求值为真，且由于没有假路径，执行将到\
    \ `if()` 语句之后的语句。\n\n下面是一个具有三个 `<conditions>` 并引入了 NOT（非）运算符的 `if()` 语句示例。\n\n\
    ```cpp\nif ((intNum>=0)&&(intNum<=5))\n{\n    cout<<\"A\";\n}\nelse if((intNum>=6)&&(intNum<=10))\n\
    {\n    cout<<\"B\";\n}\nelse if(!intNum<10)\n{\n    cout<<\"C\";\n}\n```\n\n在示例中，如果\
    \ `intNum` 的值为 0 到 5，则执行 `cout<<\"A\";` 然后退出循环。如果 `intNum` 的值是 6 到 10，执行 `cout<<\"\
    B\";`。在第三个表达式 `!intNum<10` 中，如果 `intNum` 小于 10，由于 `!`（NOT）运算符忽略或反转真值，它求值为假并退出\
    \ `if()` 语句。因此，如果值大于或等于 10，它求值为真并执行 `cout<<\"C\";`。\n\n带假路径的多重分支 `if()` 语句语法：\n\
    \n```cpp\nif(<condition-1>)\n{\n    <1.True Path Statement(s)>\n}\nelse if(<condition-2>)\n\
    {\n    <2. True Path Statement(s)>}\n[else if(<condition-N>)]\n{\n    <N. True\
    \ Path Statement(s)>\n}\nelse\n{\n    <False Path Statement(s)>\n}\n```\n\n这与上面的类似，但多重分支\
    \ `if()` 语句带假路径，当所有 `<conditions>` 求值为假时执行该语句。它使用 `else` 子句作为其假路径。这确保了 `if()`\
    \ 语句在退出前有语句执行。下面是上述示例的修改，在 `if()` 语句中加入了假路径。\n\n```cpp\nif ((intNum>=0)&&(intNum<=5))\n\
    {\n    cout<<\"A\";\n}\nelse if((intNum>=6)&&(intNum<=10))\n{\n    cout<<\"B\"\
    ;\n}\nelse if(!intNum<10)\n{\n    cout<<\"C\";\n}\nelse\ncout<<\"D\";\n```\n\n\
    如果上述示例中的所有条件求值为假，则执行 `else` 子句下的 `cout<<\"D\";` 然后退出 `if()`。\n\n回到图 7.4 中“输入的数字为\
    \ 0”的问题，图 7.7 展示了使用多重分支 `if()` 语句的解决方案。\n\n图 7.7（文件名：`ch7sample3.cpp`）\n\n![](img/tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_1751cd0.png)\n\
    \n如图 7.7 所示，如果第一个表达式 `intNum>0` 求值为真，打印“Positive”并退出循环，否则评估后续条件。如果第二个表达式 `intNum<0`\
    \ 求值为真，打印“Negative”并退出循环，否则执行到假路径打印“Zero”，然后退出循环。图 7.8、7.9 和 7.10 展示了程序的各种输出情况。\n\
