    This line defines the main body of the program. The only component that is required
    in every C++ program is the `main()` function. In its simplest form, the `main()`
    function consists of the name `main` followed by a pair of empty parentheses `(()`
    and a pair of braces `{ }` presented in lines 4 and 9. Within the braces are statements
    that make up the main body of the program. Under normal circumstances, program
    execution starts at the first statement in the `main()` function and terminates
    at the last statement in `main()`.


    Usually functions are invoked or called by other functions, but `main()` is special.
    When the program starts, `main()` is called automatically.


    The `main()` function, like all functions, must state what kind of value it will
    return. The return value type for `main()` in the sample program is `int` which
    signifies integer number, but it''s not necessary for a program that just prints
    the word "Hello World", hence, the value `0` in line 8 is returned just to satisfy
    the format. Returning values from functions is discussed in detail in the succeeding
    chapters of this book.


    ### Lines 4 and 9. `{ }`


    The curly braces `{ }` are used to enclose the program lines that make up every
    C++ function including the `main()` function. A group of one or more statements
    enclosed within braces is called a block. Line 4 signifies the start of the content
    of the main function and line 9 signifies its end.


    ### Line 5. `//The line below prints a string`


    The `//` (double slash), are called comments. Anything that follows the `//` becomes
    a comment. Comments are text details usually used by programmers to reference
    a line code statement in the source file. The comments are ignored by the compiler,
    hence does not affect the output of the program. The program will execute and
    run properly with or without comments. In line 5, the comments are used to give
    a reference or details that the next line will print a string on-screen.


    Syntax for single-line comment:


    ```

    //<string-comment>

    ```


    The `<string-comment>` in the syntax should be replaced with a text entries that
    represents the comment of the programmer in the code. The comment can be on a
    single line or multi-line. Line 5 is an example of single line comment. The multi-line
    comment uses the `/* */` (slash asterisk asterisk slash, wherein anything enclose
    inside is considered comment. It can span multiple lines. The format is presented
    below.


    Syntax for multi-line comment:


    ```

    /* <string-comment-string-comment

    -string-comment> */

    ```


    ### Line 6. `cout<<"Hello World!";`


    The `cout` is pronounced “C-out". The `cout` statement is a library object stream
    under `"iostream"` library that displays information on-screen. The `cout` statement
    can display a simple text message or the value of one or more program variables.
    The `cout`, followed by the `<<` (output redirection operator) in which whatever
    follows it is written on-screen. If it is needed to print string of characters,
    be sure to enclose them in double quotes `"`, as shown in line 6.


    Syntax of `cout` in printing literal text:


    ```

    cout<<"<string-to-print>";

    ```


    In the syntax, anything inside the `" "` double quotes is considered a literal
    text and will be printed on-screen. The `<string-to-print>` should be replaced
    with the text entries to be printed on-screen. The `cout` statement must end with
    a `;` semi-colon.


    Note: If line 2 using `namespace std;` is omitted, the `cout` statement should
    be written as `std::cout<<"<string-to-print>";`.


    ### Line 7. `getchar();`


    The `getchar()` "get character", is a library function that accepts a character
    from the keyboard. If the `getchar()` is omitted from the code, the program will
    run, but upon printing the word "Hello World!", the program will immediately terminate.
    This is how the display console of Dev-C++ was designed. The program output closes
    immediately and may not be seen by the user. Hence the `getchar()` is used as
    the trigger that when the output is presented on-screen, the user will have to
    press a key in the keyboard (except for space bar) before the program terminates.
    The `getchar()` is simply used as a terminator and is used for the rest of the
    sample programs in this book. The `getchar()` function must end with a `;` semi-colon.


    Note: If you are using other compilers that has a different display console behavior,
    you may ought to remove the `getchar()`.


    ### Line 8. `Return 0`


    Technically in C++, the `main()` function has to return a value because most of
    the compiler requires it to be declared with a return value, and it is a common
    tradition to declare it as `int main()` indicating that it should return a integer
    value. The return value is usually passed back to the operating system. Traditionally,
    `0` indicates that the program is indeed successful.


    Note: You don''t have to return `0` explicitly, because that will happen automatically
    when the `main()` function terminates. But keep in mind that the `main()` function
    is the only function where omitting return is allowed. It is also a common practice
    for C++ programmers to include the `return 0` in the `main()` function, hence
    for the rest of the sample programs in this book includes the `return 0` in its
    `main()` function.


