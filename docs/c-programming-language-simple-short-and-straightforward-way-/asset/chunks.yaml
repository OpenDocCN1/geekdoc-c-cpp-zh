    cin and strings


    Unlike C language which uses array of character to deal with strings, C++ already
    has a library intended to deal with string. This library is called "**string**"
    which enables the use of string data type. To include the string library, the
    format is presented below.


    #include<string>


    The extraction operator can be used on cin to get strings of characters in the
