    ### 2. Condition-controlled loop


    Condition-controlled loop is a way for C++ programs to repeat one or more various
    statements depending on condition(s) set either by the programmer initially or
    during run-time of the program. There are two types of condition-controlled loop
    in C++ which are the pre-test and post-test loop.


    #### 2.1 Pre-test loop


    The pre-test condition controlled loop can be executed using the `while()` loop
    statement. The `while()` loop statement repeatedly executes a target statement(s)
    from 0 to N times as long as a given condition is true. The given condition is
    tested before the body of the loop, hence, there is a possibility that the body
    of the loop may not be executed if at first evaluation of the condition is false.


    Syntax of the `while()` loop statement:


    ```cpp

    while(<condition>)

    {

    statement(s);

    }

    ```


    In the syntax, the `<condition>` may be any expression that evaluates to either
    true or false. Note that any non-zero is true and zero is false. The `<statement(s)>`
    is the body of the loop which may be a single statement or a block of statements.
    The body of the loop iterates while the `<condition>` is true. When the `<condition>`
    evaluates to false, the program execution passes to the line immediately following
    the `while()` loop statement.


    Figure 8.5 presents a sample program that repeatedly accepts a integer number,
    until the value 5 is encountered, and computes the summation of all numbers entered
    including 5.


    Figure 8.5 (source file name: ch8sample3.cpp)


    ![](tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_68fb343.png)


    Line 5 declares a integer variables named `iSum` and `iNum`. `iSum` holds the
    summation of all numbers and its initial value is 0, `iNum` holds the value of
    each entered number.


    Line 7 instructs the user to enter a number and line 8 accepts input through `cin>>`
    and assigns it to `iNum`.


    Line 9, adds the variable `iSum` to `iNum` which is equal to 0.


    Lines 11 to 16 presents the `while()` loop statement. In line 11, the expression
    `iNum!=5` checks if the current value of `iNum` is not equal to 5\. If this evaluates
    to true, then lines 13 to 15 is executed, executing the `cout<<` in line 13, accepting
    input through `cin>>` and assigns it to `iNum` in line 14, and adding the value
    of `iNum` to `iSum` in line 15\. This process is repeated until the entered number
    is 5, which will set the evaluation of the expression `iNum!=5` to false, then
    exits `while()` loop statement and program execution goes to line 17 printing
    the summation. Figure 8.6 presents the possible output.


    Figure 8.6


    ![](tmp_480d342d62b142d3035f515983d694d0_PG1Fmz_html_m79e9470.png)


    Code listings of figure 8.5


    ```cpp

    #include<iostream>


    using namespace std;


    int main()

    {


    int iSum=0,iNum;

    cout<<"Enter a integer number: ";

    cin>>iNum;

    iSum=iSum+iNum;


    while(iNum!=5)

    {

    cout<<"Enter a integer number: ";

    cin>>iNum;

    iSum=iSum+iNum;

    }


    cout<<"The summation is "<<iSum;


    fflush(stdin);


    getchar();


    return 0;

    }

    ```


    Note: The `while()` loop statement can also be nested as long as it conforms to
    the syntax.


    #### 2.2 Post-test loop


    The post-test condition controlled loop can be executed using the `do while()`
    loop statement. The `do while()`loop statement repeatedly executes a target statement(s)
    from 1 to N times as long as a given condition is true.


    Syntax of the `do while()` loop statement:


    ```cpp

    do

    {

    statement(s)>;

    } while(<condition>);

    ```

