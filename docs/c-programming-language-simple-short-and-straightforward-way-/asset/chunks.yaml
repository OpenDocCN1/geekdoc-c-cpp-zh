    \ 对象可以这样定义：\n\n```cpp\nBlacky(3);\n```\n\n如果构造函数完全不接受参数，则省略括号，类似于声明变量，可以这样定义：\n\
    \n```cpp\nDog Blacky;\n```\n\n图 11.6 展示了一个修改了图 11.3 的示例程序，创建了一个接受两个参数的构造函数，用于设置私有成员变量\
