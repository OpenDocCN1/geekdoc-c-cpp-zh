    Chapter 14 - File Management in C++


    This chapter presents the fundamentals of file management in C++. It presents
    reading and writing of text into a text file.


    C++ Files and Streams


    C++ supports a number of functions that have the ability to perform basic file
    operations, which include naming a file, opening a file, reading from a file,
    writing data into a file, and closing a file. This requires another standard C++
    library called fstream, which defines three new data types:


    1.**ofstream**. This data type represents the output file stream and is used to
    create files and to write information to files.


    2\. **ifstream**. This data type represents the input file stream and is used
    to read information from files.


    3\. **fstream**. This data type represents the file stream generally, and has
    the capabilities of both ofstream and ifstream which means it can create files,
    write information to files, and read information from files.


    To perform file processing in C++, header files <iostream> and <fstream> must
    be included in your C++ source file. The general format to include the iostream
    and fstream libraries is presented below.


    #include<iostream>


    #include<fstream>


    Opening a File


    A file must be opened before it can be read from or write to. Either the ofstream
    or fstream object may be used to open a file for writing and ifstream object is
    used to open a file for reading purpose only.


    Following is the standard format for open() function, which is a member of fstream,
    ifstream, and ofstream objects.


    <stream-datatype> <stream-name>;


    <stream-name>.open(<filename>,ios::<mode>);


    The <stream-datatype> can be any of the three data types under fstream library.
    In the second line, the first argument <filename> in the open() function specifies
    the name and location of the file to be opened and the second argument of the
    open() member function defines the mode in which the file should be opened. The
    <mode> can be any of the following.


    1\. **os::app**


    Append mode. All output to that file to be appended to the end.


    2\. **ios::ate**


    Open a file for output and move the read/write control to the end of the file.


    3\. **ios::in**


    Open a file for reading.


    4\. **ios::out**


    Open a file for writing.


    5\. **ios::trunc**


    If the file already exists, its contents will be truncated before opening the
    file.


    Example:


    ofstream outfile;


    outfile.open("data.txt", ios::out);


    Programmers can combine two or more of these values by ORing them together. For
    example if it is needed to open a file in write mode and want to truncate it in
    case it already exists, following will be the format:


    ofstream outfile;


    outfile.open("data.txt ", ios::out | ios::trunc );


    Similar way, programmers can open a file for reading and writing purpose as follows:


    fstream afile;


    afile.open("data.txt", ios::out | ios::in );


    Closing a File


    When a C++ program terminates it automatically closes flushes all the streams,
    release all the allocated memory and close all the opened files. But it is always
    a good practice that a programmer should close all the opened files before program
    termination.


    Following is the standard format for close() function, which is a member of fstream,
    ifstream, and ofstream objects.


    <stream-name>.close();


