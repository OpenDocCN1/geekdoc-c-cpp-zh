    # 献辞


    作者将此书献给`ALMIGHTY GOD`。


    这本书也献给`Dennis Ritchie`，感谢他赋予作者编程的工具；献给`Bill Gates`，感谢他赋予作者编程的理由。


    # 第一章 - 开始 C++ 语言编程


    本章介绍了 C++ 编程的简单概述。`C++` 的设计以系统编程为基础，高性能、高效和使用灵活是其设计亮点。本章介绍了开始 C++ 编程所需的内容。


    ## C++ 简史


    `C++` 编程语言的历史可以追溯到 1979 年。丹麦计算机科学家 `Bjarne Stroustrup` 正在使用一种名为 `Simula` 的语言，该语言主要用于仿真。`Simula
    67` 语言奠定了面向对象编程范式的基础。Stroustrup 开始研究带有类的 `C` 语言。`C` 被视为中间语言，既具有底层语言的力量，又具有高级语言的特征，`C`
    被认为是 `C++` 的前身。`Bjarne Stroustrup` 在贝尔实验室于 80 年代初设计了 `C++`，这是一种基于 `C` 语言的面向对象的语言，自
    1972 年诞生以来，它驱动了几乎所有的系统软件。第一个带有类的 `C` 编译器被称为 `Cfront`，它源自一个名为 `CPre` 的 `C` 编译器。`C++`
    的目标是将面向对象编程引入 `C` 语言中。`C` 语言中的 `++` 运算符是用于变量自增的运算符，这让我们对 Stroustrup 如何看待这种语言有了某种了解。1985
    年，Stroustrup 关于该语言的参考著作《C++ 编程语言》出版。


    ## 使用 C++ 的理由


    首先，非常推荐初学者在开始职业生涯时学习 `C++`，因为 `C++` 兼顾了过程化和面向对象的编程方法。一旦有人学会了 `C++` 编程语言背后的概念，无论是面向对象还是面向过程的编程，采用或迁移到其他编程语言都将变得容易得多，因为大部分所需内容非常相似。


    `C++` 已经存在很段时间了，考虑到它也是今天驱动移动端体验的主要语言，它已经解决了若干项行业挑战。除了高性能服务器和中间件外，`C++` 还是两个最流行的移动平台
    `Android` 和 `iOS` 以及两个最流行的桌面平台 `Windows` 和 `Mac OS X` 平台上客户端开发的绝佳选择。随着近期开发者工具的引入（能够实现客户端、中间件和服务器端应用程序的可视化设计等），`C++`
    的效率极高，确实使其成为现代应用开发的绝佳选择，因此学习 `C++` 的基础将使人们在激烈的行业竞争中具有竞争力。


    这本书将把 C++ 编程的世界带到你身边。


    ## 开始使用 C++ 语言编程


    所有的 `C++` 程序都写在扩展名为 `.cpp` 的文本文件中，例如 `hello.cpp`，其中 `.cpp` 是文件扩展名。这些文本文件被称为源文件。源文件包含
    C++ 源代码，稍后将转换为可运行的可执行文件。C++ 语言的程序开发周期为：


    1. 将源代码写入文本编辑器（如：`notepad`）以创建源文件。

    2. 编译源文件创建对象文件。

    3. 将对象文件链接成可执行文件（例如 Windows 下的 `.exe`）。

    4. 运行程序并查看结果。


    根据 `C++` 的程序开发周期，注意到需要几样东西，包括文本编辑器、编译器和链接器。好消息是，对于 Windows 用户，有一款软件包含了这三者。它被称为
    `Dev-C++`，可以在 [`bloodshed.net`](http://bloodshed.net/) 获取，直接下载链接请见在 [`bloodshed-dev-c.en.softonic.com/download`](http://bloodshed-dev-c.en.softonic.com/download)
    处。


    `Dev-C++` 是一个 C++ 源代码编辑器、编译器和链接器。包含了创建 C 程序所需的所有内容。


    注意：你可能需要使用其他编译器，因为书中的示例代码可以正常运行。


