    ## 2. 字符串拼接


    `strcat()` 函数将一个字符串附加到另一个字符串之后。


    ### `strcat()` 语法：


    ```c

    char strcat(<str1>, <str2>);

    ```


    第一个字符串 `<str1>` 会在其后追加第二个字符串 `<str2>`。在语法中，`<str1>` 应该是一个存储字符串的变量，而 `<str2>` 可以是字面量字符串、变量或返回字符串的函数。


    ### 示例：


    ```cpp

    char fname[30] = "Sherwyn";

    char lname[30] = "Allibang";

    cout<<strcat(fname, lname);

    ```


    在示例中，输出为 "SherwynAllibang"，因为 `lname` 被追加到了 `fname` 之后。


    ## 3. 比较两个字符串（区分大小写）


    有时需要判断两个字符串是否相同。为此，应该使用 `strcmp()` 函数。该函数返回一个整数。


    ### `strcmp()` 语法：


    ```c

    int strcmp(<str1>, <str2>);

    ```


    返回值表示 2 个字符串之间的关系。如果它们相等，`strcmp()` 返回 0。如果字符串 `<str1>` 小于字符串 `<str2>`，则值为负；反之则为正。语法中的
    `<str1>` 和 `<str2>` 可以是字面量字符串、变量或返回字符串的函数。


    ### 示例：


    ```cpp

    char strDep1[10]="CSE";

    char strDep2[10]="ITE";

    char strAdd1[10]="Prontera";

    char strAdd2[10]="Prontera";

    int intVal1=strcmp(strDep1, strDep2);

    int intVal2=strcmp(strAdd1, strAdd2);

    ```


    在示例中，`intVal1` 将赋值为值 -1，因为 `strDep1` 和 `strDep2` 不相同。此外，`intVal2` 将赋值为值 0，因为 `strAdd1`
    和 `strAdd2` 是相同的。


    ## 4. 比较两个字符串（不区分大小写）


    如果不在乎字符串是大写还是小写，则使用 `strcmpi()` 函数代替 `strcmp()`。除此，其他部分完全相同。


    ### `strcmpi()` 语法：


    ```c

    int strcmpi(<str1>, <str2>);

    ```


    语法中的 `<str1>` 和 `<str2>` 可以是字面量字符串、变量或返回字符串的函数。


    ### 示例：


    ```cpp

    char strDep1[10]="CSE";

    char strDep2[10]="ITE";

    char strAdd1[10]="Prontera";

    char strAdd2[10]="PRONTERA";

    int intVal1=strcmp(strDep1, strDep2);

    int intVal2=strcmp(strAdd1, strAdd2);

    ```


    `intVal1` 将具有值 -1，类似于 `strmp()` 函数，同时 `intVal2` 仍具有值 0，因为无论大小写如何，`strAdd1` 和 `strAdd2`
    都是。


    ## 5. 复制字符串


    要将一个字符串复制到另一个字符串变量中，应该使用 `strcpy()` 函数。这弥补了无法使用 `=` 赋值运算符设置字符串变量值的问题。


    ### `strcpy()` 语法：


    ```c

    strcpy(<str-var>,<str2>);

    ```


    `<str-var>` 必须是一个字符数组变量，而 `<str2>` 可以是字面量字符串、变量或返回字符串的函数。


    ### 示例：


    ```cpp

    char strName[10]="Sherwyn";

    char strOfficer[10];

    strcpy(strOfficer,strName);

    ```


    执行上述代码后，`strOfficer` 的值为 "Sherwyn"，因为它将 `strName` 的值复制到了 `strOfficer`。下面是另一个将字面量字符串复制到
    `<str-val>` 的示例。


    ```cpp

    char strOfficer[10];

    strcpy(strOfficer,"Allibang");

    ```


    上述示例中 `strOfficer` 的值为 "Allibang"，因为字面量字符串 "Allibang" 已复制到 `strOfficer`。这实际上是定义字符数组或字符串变量的另一种方式。


    ## 6. 反转字符串顺序


    `strrev()` 函数不是 ANSI 标准的一部分，因此，如果程序需要迁移到 Windows 以外的平台，强烈建议不要使用。


    ### `strrev()` 语法：


    ```c

    strrev(<string>);

    ```


    该函数将反转字符串 `<string>` 的顺序。语法中的 `<string>` 可以是字面量文本、变量或返回字符串的函数。


    ### 示例：


    ```cpp

    char strName[10]="Sherwyn";

    strrev(strName);

    ```


    字符串为 "Sherwyn"，`strrev()` 反转了字符串，然后 `strName` 的新值将变为 "nywrehS"。


    ## 7. 将大写字符串转换为为小写字符串


    `strlwr()` 函数不是 ANSI 标准的一部分，因此，如果程序需要迁移到 Windows 以外的平台，强烈建议不要使用。


    ### `strlwr()` 语法：


    ```c

    strlwr(<string>);

    ```


    该函数会将字符串 `<string>` 中的大写字符转换为小写。语法中的 `<string>` 可以是字面量文本、变量或返回字符串的函数。


    ### 示例：


    ```cpp

    char strName[10]="Sherwyn";

    strlwr(strName);

    ```


    字符串为 "Sherwyn"，`strlwr()` 将字符串转换为小写，因此 `strName` 的新值将变为 "sherwyn"。


    ## 8. 将小写字符串转换为大写字符串


    `strlwr()` 函数不是 ANSI 标准的一部分，因此，如果程序需要迁移到 Windows 以外的平台，强烈建议不要使用。


    ### `strlwr()` 语法：


    ```c

    strlwr(<string>);

    ```


    该函数会将字符串 `<string>` 中的大写字符转换为大写。语法中的 `<string>` 可以是字面量文本、变量或返回字符串的函数。


    ### 示例：


    ```cpp

    char strName[10]="Sherwyn";

    strlwr(strName);

    ```


    字符串为 "Sherwyn"，`strlwr()` 将字符串转换为大写，因此 `strName` 的新值将变为 "SHERWYN"。


