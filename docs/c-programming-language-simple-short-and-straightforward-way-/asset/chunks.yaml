    2\. **Dual-alternative**


    Dual-alternative execute the statement(s) under its "true path" only when the
    condition is true and execute a different statement(s) under its "false path"
    if the condition is false. The false path uses the "else" clause of the if() statement.


    Syntax of dual-alternative if() statement:


    if(<condition>)


    {


    <True Path Statement(s)>


    }


    else


    {


    <False Path Statement(s)>


    }


    In the syntax, if the <condition> is evaluated to be true, then execute the <True
    Path Statement(s)>, otherwise, the execution goes to the "else" keyword and execute
    the <False Path Statement(s)>, and exit if() statement. The <False Path Statement(s)>
    can be a single statement or block of statements. Below is an example of dual-alternative
    if() statement.


    if(4<1)


    {


    cout<<The condition is True.";


    }


    else


    {


    cout<<"The condition is False.";


    }


    In the example, the expression 4<1 is evaluated to be false, hence the execution
    goes to "else" clause and executes the cout<<"The condition is False"; statement.
    Below is another example of dual-alternative that takes a compound expression
    using the logical operator OR.


    if((4<1)||(3<2))


    {


    cout<<"The condition is True.";


    }


    else


    {


    cout<<"The condition is False.";


