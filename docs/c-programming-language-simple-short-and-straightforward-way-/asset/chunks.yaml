    Things to consider in conditional statement:


    1\. **When to use if()statement over switch() statement:**


    In case of simple and few condition, if() statement executes faster and easier
    to write. if() statement allows complex expressions on its condition(s), while
    switch() wants a constant. Also if() accepts and allows all data types including
    string, which is not allowed in switch() statement. Thus, depending on the program’s
    requirement, a programmer should decide himself which conditional statement to
    use.


    2\. **When to use switch() statement over if() statement:**


    If there are large number of compares for a condition in the program, use switch()
    over if() as long as the expressions are all integral type because switch offer
    more readability for the program source code. A switch statement works much faster
    than equivalent if() statement having more conditions to compare. It is because
    compiler generates a jump table for a switch during compilation. Consequently,
    during execution, instead of checking which case is satisfied, it only decides
    which case has to be executed. Also, switch() is more manageable for having higher
    level of indentation than if().


