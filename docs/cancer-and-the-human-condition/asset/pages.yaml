  md: '![](img/fe481b0f2e190573448211a8d1ff379b_35_0.png)


    We love our dogs. Each unique in personality and capacity and above all their
    love. Each capable of expressing their love and devotion in ways that touch our
    hearts and souls.


    In Central Park in New York City there is a statue of Balto, a sled dog that helped
    save hundreds of children from possible death during a Diphtheria epidemic in
    Nome, Alaska in 1925.


    There was Marjorie, a dog that sacrificed itself to help Dr. Frederick Banting,
    and his medical student Charles Best, isolate insulin, which is necessary for
    many diabetics to live, and in so doing, in the 1920''s, saved countless thousands
    of lives of patients with Type 1 diabetes; for before then, that diagnosis meant
    certain death.


    There were Belka and Strelka, Russian cosmonaut dogs, who explored outer space
    in Sputnik 5 before any man.


    In 2005 another hero, Tasha, who with only blood samples, allowed scientists to
    complete the genetic sequence of the dog genome (www.genome.gov/175158860) (7).
    As a result, we will be better able to understand the genetics of cancer.


