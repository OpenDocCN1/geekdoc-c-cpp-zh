  md: '# XII. Can an Aspirin a Day Keep Cancer Away?


    ~~To do nothing is sometimes a good remedy.~~

    Hippocrates (460BC-377BC)


    Aspirin (acetylsalicylic acid) and similar substances have been known about for
    at least 2500 years! Hippocrates the great Greek physician (whose oath is still
    recited at medical school graduations) described the properties of a concoction
    derived from the bark of the willow tree which helped people with fevers and other
    medical conditions.


    ![](img/fe481b0f2e190573448211a8d1ff379b_68_0.png)


    The Latin word for willow is salix, hence the name coined by scientists at the
    Bayer pharmaceutical company who synthesized this substance in 1899. And just
    in case you were thinking that anything from the bark of a tree is useless in
    treating cancer, I remind you that the chemotherapy drug Taxol was isolated from
    the bark of the Pacific yew tree.


    ![](img/fe481b0f2e190573448211a8d1ff379b_68_1.png)


    Many scientific studies have been published which show that aspirin can reduce
    the risk of various types of cancer. This effect is both dose-and time-dependent.
    The best-characterized example (16) showed that colorectal cancer risk is significantly
    decreased when people take aspirin about once a day (standard strength 325 mg)*


    > * As this manuscript was in the final stages of preparation, "Hot Off The Press",
    a study by Holmes et al showed regular aspirin decreases recurrence and death
    by breast survivors.


    > "J. Clin Oncol 2010; DOI: 10.1200 JDCO.2009:22.7918"


    Hippocrates: The great Greek physician and his oath, "Above all, do no harm.",'
  merge: -1
  pgno: 68
- img_proc: true
  md: '![](img/fe481b0f2e190573448211a8d1ff379b_69_0.png)


    ![](img/fe481b0f2e190573448211a8d1ff379b_69_1.png)


    Willow tree: Original source of aspirin.


    Yew tree Taxol “harvest.”


    Although the biochemical mechanisms are still being studied, we know that in tumors
    that over-express a specific enzyme, COX-2 (oxygenase), aspirin reduces the risk
    of colorectal cancer, but a clear statistical benefit is not observed in the population
    studied until about 5 years or more of regular use. Two-thirds of the tumors tested
    overexpress COX-2, so that in one third of people, the use of aspirin seems to
    have no benefit. This may also be true in other cancers such as stomach, esophagus,
    breast, and lung, although the data is not mature or compelling yet.


    More specific inhibitors of COX-2 have been in the marketplace for several years.
    Remember Vioxx? It is a COX-2 inhibitor that was withdrawn from the market due
    to an increased risk of heart attacks. Merck settled a class-action suit for nearly
    5 billion dollars. But it, like Celebrex, may in some fashion be useful in treating
    various cancers, and there are studies that are continuing to answer that question.


