  md: 'There was Hildegarde, our German Shepherd, who died 3 years ago at the age
    of 10, after battling inflammatory breast cancer for 2 years. My heart is still
    broken, for I could not save her despite two surgeries and a trial with tamoxifen.
    Despite her suffering, she was always a great friend.


    What I learned was yet another lesson in sadness and humility. But think of the
    magnificent dignity of these wonderful creatures; of such godly souls! So we endure,
    suffer, and keep trying to penetrate the mysteries of life and death.


    So when I heard about a cancer vaccine recently approved for dogs with malignant
    melanoma, a disease I studied for many years at Sloan Kettering Institute in the
    laboratory of Dr. Lloyd Old, one of the world''s greatest cancer immunologists,
    I was particularly intrigued.


    This vaccine is a most probable success. Created by Dr. Jed Wolchok and his colleagues
    at Memorial Hospital and the Animal Medical Center, it is derived from the DNA
    of melanoma cells that produce an enzyme that is often overproduced and abnormal
    in these tumors called tyrosinease.(8)


    By injecting this DNA into dogs with malignant melanoma that would often kill
    them within weeks, many dogs had their tumors, which had been widespread, disappear
    completely for months or even years. Some were ever cured.


    ![](img/fe481b0f2e190573448211a8d1ff379b_36_0.png)


    Dogs and humans share many cancers, including malignant melanoma. This is a nonpigmented
    (amelanotic) type in a poor little dog''s paw.


    This vaccine has been approved by the US government for use, and could save or
    at least prolong the lives of thousands of our best friends. Other canine cancer
    vaccines are being developed (one estimate is that 4 million dogs get cancer every
    year), and we will learn much about treating human cancer in this way.'
