- img_proc: true
  md: 'Sphingolipids are molecules named after the Sphinx. The Sphinx was a god of
    Egypt, whose gigantic figure near the pyramids at Giza shows a human head attached
    to a lion''s body. There are other sphinx permutations throughout Egypt, and over
    time the Sphinx became a Greek god, who assumed the form of a woman with a lion''s
    body. Sometimes wings and a tail were also added. But this was no lady! For she
    was quite fond of eating the unlucky people who failed to correctly answer her
    questions, with death and destruction her calling card, until her fateful end.


    ![](img/fe481b0f2e190573448211a8d1ff379b_59_0.png)


    The two basic components of a glycosolipid: Sphingolipid embedded in the cell
    membrane with its polar carbohydrates sticking out to allow for cellular communication.


    If I''d known the nasty behavior of the Sphinx when I was young, I might have
    reconsidered my choice of molecules to study. But the sphingolipid was cleverly
    named because it is in a way, the construction or joining of two distinct forms.
    A lipid portion typically contains a long chain fatty acid kind of like butter,
    and another part called sphingosine, both of which are connected and embedded
    in the lipid portion of the cell membrane. The other part, the “head”, which sticks
    out into the milieu, can be many different things. For instance, ceramide is a
    simple sphingolipid which ladies can find advertised'
  merge: -1
  pgno: 59
- img_proc: true
  md: 'in beauty creams. Sphingomyelin is another fairly simple molecule that allows
    nerve cells to conduct electrical impulses efficiently. A common disease, multiple
    sclerosis is an autoimmune disease that causes neurological dysfunction because
    of (in part), the destruction of sphingomyelin. The newest cosmetic phenomenon,
    Botox, a purified toxin derived from a poisonous bacteria, actually binds to (among
    other things), a class of sphingolipids called sialated glycosphingolipids, which
    are also present on cancer cells, which I studied in the lab for many years. Even
    blood group antigens, which we commonly call blood types A, B and O, are often
    glycosphingolipids, and they are so incredibly similar in structure (and yet recognized
    by the immune system), that their precise molecular differences were not determined
    until the late 1960''s by my scientific mentor at Sloan-Ketter Institute, the
    great biochemist, Dr. Kenneth Lloyd.


    ![](img/fe481b0f2e190573448211a8d1ff379b_60_0.png)


    The human blood group antigen structure discovered by Dr. Kenneth Lloyd differ
    by the slightest molecular signature, and yet can evoke an incredible immune response
    if transfused to an incompatible person.


    You must be wondering about the riddle, in the back of your mind, so here it is,
    as presented to the incredibly tragic Greek, Oedipus, who after his encounter
    with the Sphinx,'
  merge: -1
  pgno: 60
- img_proc: true
  md: 'through the whimsy of the gods, unknown to him at the time, killed his father
    and married his mother, plucked out his eyes upon this terrible discovery and
    was killed by his sons. Which makes me wonder whether, in retrospect, answering
    the riddle correctly may have been the worst thing he ever did.


    The riddle: Sphinx (licking her chops for it’s suppertime): “Which creature in
    the morning goes on four feet, at noon upon two, and in the evening upon three?”


    Oedipus (feeling pretty good at this time): “The answer is man, who crawls as
    a baby, walks on two feet as an adult, and uses a cane in old age.”


    So the Sphinx destroyed herself, and Oedipus is perhaps best remembered by psychoanalysts
    who follow Freud’s theory of an Oedipus complex in young boys, who reject and
    hate their fathers and love their mothers (which typically ends when they ask
    dad for the car keys and money to go out on a date).


    Now the thing about the Greeks, is they loved a story with a message that overwhelmed
    the audience with emotion. Forget about my story doing that, but I can tell you
    sphingolipids, with ever so slight changes in their structure, location, or number,
    can lead to cellular destruction, or life. Ubiquitously present in the lowliest
    creatures who the most perfect (or imperfect) Greek hero, their structure and
    functions may be part of the solution to solving the riddle of cancer. So that
    with further study (thousands of papers having already been published), this story
    may ultimately end in a beautiful and joyful way.'
