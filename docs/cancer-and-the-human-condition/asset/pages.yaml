  md: '# IV. The Chronicle of Death


    > ~~There are three kinds of lies: lies, damned lies, and statistics.~~

    Benjamin Disraeli (1804-1881)


    The American Cancer Society has published its annual report on global cancer.
    This report can be accessed online for interested readers (www.cancer.org) by
    looking under cancer facts and figures.


    The number of new cancer diagnoses worldwide is more than 12 million.* This number
    excludes common skin cancers (squamous cell or basal cell) which excludes number
    in the millions by themselves!


    ![](img/fe481b0f2e190573448211a8d1ff379b_29_0.png)


    ![](img/fe481b0f2e190573448211a8d1ff379b_29_1.png)


