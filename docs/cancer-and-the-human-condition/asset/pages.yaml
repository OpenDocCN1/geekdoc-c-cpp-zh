  md: '# I. Cancer and the Human Condition*

    ~~ Selfishness is the greatest curse of the human race~~

    William Gladstone (1809-1898)


    Cancer, like the poor will always be with us.


    When I started studying cancer many years ago, I was young and idealistic, and
    believed that as societies evolved, with altruistic motives and with technological
    advancements poverty could be eliminated from this planet. In a similar fashion,
    and method of reasoning, I thought that cancer could also be eliminated from this
    planet.


    I no longer believe that either of these wonderful ideas will ever be accomplished.


    For there is something wrong with our species, that I think will prevent mankind
    from fulfilling its highest goals. The thing that is wrong with us is we are incredibly
    selfish. We don''t like to share. We don''t like others to beat us at anything;
    to earn more, vacation home, dress better, live in bigger or better residences,
    have more money, have more success, be happier, better looking, be more popular,
    be smarter, stronger....


    As we are selfish in a psychological sense, our bodies can metaphorically also
    be selfish. And the sine qua non of physiologic selfishness, is cancer.


    Now I do not believe that selfish people by some mechanistic (or Divinely inspired)
    process develop selfish diseases. That is far too simplistic. But I think it is
    important to consider what it means when our bodies fail us in philosophically
    provocative vocates. For, unlike other diseases, cancer, just the word alone evokes
    an incredibly primitive and intense response in many people. It terrifies them.
    Just the word. Just the thought. Just the mental imagery. Just the idea.


    > * No offense (literary or philosophical) is intended to the great social theorist
    and intellectual, Hannah Arendt (1906-1975), who wrote “The Human Condition",
    in 1958.'
