  md: 'Prior to surgery, this mover and shaker, waited about 6 months before seeing
    his internist, and reporting occasional bloody stools (he was hoping it was just
    hemorrhoids), but within a week, all the necessary tests (CT scan, colonoscopy
    with biopsy, preop lab tests including CEA and CA19-9, cardiology consult) were
    completed.


    The CT scan of the abdomen and pelvis showed a mass in the transverse colon, and
    no clear evidence of lymph node involvement or spread to other sites, such as
    the liver. Despite smoking from age 20 to 50, a CT of the chest was not included
    in the preop radiological studies (the lung bases were mentioned as being clear
    on the CT report). All chemists (including liver function tests and LDH-- dehydrogenase)
    and CBC (complete blood count) were normal. Tumor markers (including PSA, ordered
    by me) were either normal or just slightly above normal (CEA was 4.0, which in
    nonsmokers was abnormal, with 2.5 considered the upper limit of normal, and the
    other markers were within the range of normal).


    So how does the statement: The surgeon said he got it all, why am I seeing an
    oncologist?” become: "He said I may die.\”


    Let’s dissect these statements from the patient’s perspective or cancer gestalt:


    +   1) He got it all: Translation: All the cancer was removed, so I’m cured. If
    they can’t see any disease on the scans and the lab tests are OK, there is no
    cancer remaining, and therefore I’m cured. Please tell me I’m cured.


    +   2) Why am I seeing an oncologist? Translation: I denied my symptoms for several
    months, even though I knew bloody stools could be cancer. I don''t want to die
    of cancer. This is just a bad dream. If I close my eyes, everything will be perfect
    again.


    Now the same analysis from the oncologist''s viewpoint:


    +   1) He got it all: Translation: I’m sure the surgeon (who I know well, is seasoned
    and careful with his language) didn’t just say that; he probably said something
    like: “The operation was successful, all the cancer was removed that'
