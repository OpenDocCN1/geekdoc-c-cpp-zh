  md: 'Now I wear a conservative pinstripe suit and wing-tip shoes.


    But the amazing thing is the coincidence does not end there. For Lewis Thomas
    and I are both MDs, both with lots of boxes of papers, both grew up in Queens,
    both had fathers who were MDs, although my dad was a “Meat Dealer” as the family
    joke goes, as in kosher butcher,* before he became a full-time cab driver. Dr.
    Thomas wrote beautiful books and I wrote....


    Let’s not spoil the story with a few details that are suspect. Instead consider
    that at Princeton University the Lewis Thomas Papers are housed, donated to his
    alma mater the year before his death, in 1993. This collection of stuff includes
    his expense accounts at MSKCC and totals 160 boxes, one of which is oversized.
    I believe my wife and I are approaching that number. The reason I mention expense
