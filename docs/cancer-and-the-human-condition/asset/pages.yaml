    it all off, so I’m not sure why I’m seeing an oncologist.” After ten or “phone
    calls,” the message is transformed by some incredibly sophisticated neural network
    into: “The oncologist said I may die.”


    After many thousands of patient encounters, here is one synthetic scenario, or
    as physicians like to say, “clinical vignette."


    A 68-year-old man with recently resected stage IIIA colon cancer is seen in initial
    consultation two weeks after surgery. He is a captain of industry, a multimillionaire
    who owns a manufacturing company, with several hundred employees. He is recovering
    well after surgery, with no unusual complaints. His other relevant medical problems
    include coronary artery disease, with a heart attack at age 54, and subsequent
    angioplasty and stent placement at age 62. Other than heart and blood pressure
    medicines (and Viagra), and mild diabetes and arthritis, he takes no other drugs,
    including no vitamins or supplements**


    In my careful review of the pathology report (which is probably the most important
    thing that I do), the tumor is located in the transverse colon, measuring about
    5 cm in diameter (which is not relevant to staging or prognosis), with the histological
    description typical for this type of malignancy, “a moderately differentiated
    adenocarcinoma, with tumor extending into the muscularis propria of the bowel
    wall, but not through it. All resection margins were clear, with the closest margin
    1 cm (distal margin). A total of 18 mesenteric lymph nodes were identified, of
    which 3 were positive for metastatic disease; formal pathologic staging is therefore
    pT2pN1Mx.”


    > ** Unless specifically stated, all clinical scenarios were modified to protect
    my patients’ privacy.'
