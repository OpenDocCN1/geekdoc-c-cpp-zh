  md: 'treatments that might be available in the future. They recognized that the
    treatment might cause an earlier death or other bad outcomes, and we were always
    very honest and realistic about the disease and the limits of both conventional
    and experimental therapy.


    I tried injecting the primary tumor in his leg and another easily accessible site
    of disease that had developed on his back, during chemotherapy, with three different
    substances that had some immunostimulatory properties, Interferon alpha-2b, interleukin-2,
    and GMCSF (granulocyte-macrophage colony stimulating factor), all of which were
    FDA approved for other uses, so this would represent what is called in medicine,
    "off-label use."


    We repeated the scans before starting immunotherapy and by then the cancer appeared
    to be growing in his lungs with multiple ball-like lesions and large collections
    of fluid which appeared to represent what are called bilateral malignant effusions.
    Nothing happened to the primary tumor or subcutaneous metastasis as I injected
    them about once a week, but after 6 weeks of treatment, I repeated all the scans
    and to my absolute shock, amazement, and general disbelief, the lung CT showed
    essentially no disease! Other weird things occurred like what appeared to be a
    sclerotic-type process in some of the bones that had disease before and areas
    of sclerosis in some areas of the primary tumor.


    Despite this incredible and mysterious event (possibly the result of stimulating
    the immune system and other cells), the man continued to lose weight and repeat
    studies after four weeks showed the lung lesions still nearly all gone or "resolved,"
    but soon after they returned and eventually the cancer won, despite our best efforts.


    ![](img/fe481b0f2e190573448211a8d1ff379b_27_0.png)


    Macrophages can be activated with cytokines like GMCSF to kill cancer cells.


    I sent my case report to be reviewed by people I thought would be interested in
