  md: '# V. Your Grandmother was Right!


    ~Give a man fish, and you''ll feed him for a day. And he''ll buy a funny hat.
    Talk to a hungry man about a fish, and you''re a consultant.~ Scott Adams (1957-)


    If you wait enough the scientific pendulum swings back. This may be particularly
    true in what some might consider to be “old wives tales.” The story begins a few
    hundred years ago when Norwegian fishermen started to ingest Cod liver oil to
    protect against the cold and illness. It tasted terrible so it must be good for
    you, and children were given despite their protests.


    ![](img/fe481b0f2e190573448211a8d1ff379b_31_0.png)


    Well guess what? Cod liver oil is a great source of Vitamin D and Vitamin A. Vitamins
    as a class of chemicals act typically as coenzymes in biochemical reactions critical
    for life. With specific attention to Vitamin D, its deficiency in childhood causes
    rickets, and in adults, osteoporosis.


    But these are things we all know. But how about Vitamin D (and its analogs) as
    a treatment for cancer? I just treated a man with metastatic prostate cancer today
    with calcitriol which is a Vitamin D derivative. Together with Taxotere, calcitriol
    seems to improve response rates and survival compared with Taxotere alone. (2)


    How many fish have a stamp created for them?


    And how about Vitamin D as a cancer prevention drug? There is good evidence that
    the risk of colon, breast, prostate, and ovarian cancer can be lowered by adequate
    Vitamin D intake (probably around 1000 IU/day). (3, 4)'
