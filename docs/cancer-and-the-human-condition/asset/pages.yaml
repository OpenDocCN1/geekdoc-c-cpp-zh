  md: 'So a story about potentially unfair and indiscriminate treatment of innocent
    people ends in a way that only God could imagine.


    A fair question is what is the relevance of this story in a cancer essay? But,
    and this is not a stretch, we often treat cancer patients in an unfair and indiscriminate
    way with incredibly toxic poison. The end result, (as the title of this essay
    suggests) although not as final and dramatic, is reminiscent of this ancient debate
    between God and man.


    One could choose many different tumor types, but let''s start with the statement
    that most often the treatment of breast cancer with chemotherapy drugs is ineffective,
    costly, and dangerous. The reason we accept this measure of treatment failure
    is because we have convinced ourselves that we are justified in treating everyone
    to benefit around 5 to 20% of patients. We have also convinced ourselves that
    if perhaps one or two people die from chemotherapy-related complications (per
    thousand), this is statistically acceptable (unless of course, I suspect, that
    person is you or someone you). And let''s add in 20 people per thousand who develop
    irreversible health problems like heart failure or blood diseases, and may be
    20 thousand with serious complications that are reversible but were potentially
    serious and life threatening like infections, allergic reactions and such.


    So let''s crunch some numbers. Treatment X: For every 1,000 patients treated at
    a cost of around 50,000 dollars per patient, 100 are helped in that they are cured
    of their disease (10%), one or two die by therapy, who may have done well without
    it, and 20 people are sick the rest of their lives, who may or may not have benefited
    from treatment. Nor should we ignore many people who have persistent side effects
    from treatment which never entirely disappear.


    Let''s call the treatment AC for Adriamycin/Cytoxan for early-stage breast cancer.
