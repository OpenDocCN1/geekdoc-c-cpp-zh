  md: '# # Preface


    If you are reading this sentence you are smart! It means the book’s title and
    cover interested you enough to open it and I would like to think this demonstrates
    you have a fine mind. You may be incredibly smart (I hope so), or even a genius,
    but I can (within the laws of probability) guarantee you do not know more about
    cancer than me. Look at the odds, with 6 billion people in the world, and maybe
    6 thousand cancer experts of various sorts (researchers and clinicians with many
    years of experience), the likelihood of one of my peers reading this is one in
    a million.* In fact, if the definition of an expert is: “someone who doesn''t
    need to know anything more, otherwise they wouldn''t be an expert,” I doubt my
    colleagues will be interested in this book.


    So being smart, and wanting to learn, you are already on the second paragraph.
    Congratulations!


    As my wonderful professor of comparative anatomy, Dr. Giles McIntyre, said more
    than thirty years ago, “The definition of intelligence is the ability to learn,
    and, unlearn, if something is found to be untrue,” which is precisely what this
    collection of essays is designed to do.


    I want you to remain skeptical. I want you to be challenged, and to question the
    statements that are made, in a vigorous and intellectually honest way. I want
    you to take everything I say with a large “grain of salt.” I want you to think.
    I want you to learn.


    Much of what I say may prove to be false. It may be true today, and untrue tomorrow.
    That is the beauty of the scientific method.


    > * I recognize that the numbers are inaccurate and the reasoning imprecise. Maybe
    only 1 billion people can read at all and let''s not talk about translations and
    accessibility to books. Odds of one in one hundred thousand may be closer to the
    truth.'
