  md: '# This mental imagery extends to our way of responding to the diagnosis of
    cancer. “We are going to fight this thing.” “We are going to win the battle.”
    “We are going to be cancer survivors.” “We are going to defeat it’


    So we are at war with ourselves! The battle lines are drawn. It''s the good guys
    versus the bad The bad guys, of course, are the cancer cells, that have become
    transformed from good guys into bad guys, so now the fight is in within ourselves.


    The good guys need to be helped.


    So we attack the cancer with harmful drugs that will hopefully kill the bad guys
    without killing too many good guys, in this World War Me.


    We take supplements to make our good guys work better. We meditate, pray, chant,
    aromatize, reflexologize, in the hope of winning. For Vince Lombardi, the great
    football coach (who died of colon cancer, at age 57) said: “If winning isn''t
    everything, why do they keep score?”


    ![](img/fe481b0f2e190573448211a8d1ff379b_17_0.png)


    Vanquish Cancer. The eternal struggle as artistic abstraction.


    I worked for several years at a Vince Lombardi Cancer Clinic, in the city where
    he is immortal, Green Bay, Wisconsin, and the problem is that his success defeating
    football opponents did not translate into success defeating a different kind of
    opponent.


    ![](img/fe481b0f2e190573448211a8d1ff379b_17_1.png)


    But consider that cancer cells, (in a special way) are as much a part of all of
    us as healthy cells. In other words, due to our inherent complexity as multicellular
    organisms, abnormal cells are created, each and every day, due to random genetic


    The righteous sword of cancer justice.'
