  md: '# III. The Archer

    ~~Courage is being scared to death - saddling up anyway.~~

    John Wayne (1907-1979)


    I think there is a way practicing physicians (and consider the word "practice"
    in this setting), analyze information. What I mean by this statement is that much
    of what we do in medicine is predicated on previous events and observations. For
    instance, when I see a patient with a fairly common tumor like breast cancer,
    I have developed a method of reasoning, after many hundreds of previous cases,
    which allows me to, within a minute, figure out what to do and say. This is not
    to say that each case is not unique, as each patient is unique, nor that there
    aren''t variations on a theme (which drugs to administer, participation in a clinical
    trial, etc.), but the basic pattern of my response is the same.


    When I see an unusual or rare tumor, it''s quite another thing. In fact, the way
    I phrased that is an indication, as I''m distancing myself from the patient, and
    places the emphasis on the tumor and not the person. It is interesting that when
    physicians speak to each other, and the way we are taught in medical school is
    to say something like: "This is a 25-year-old man who presents with a two-year
    history of increasing pain and swelling in his right leg." And in the doctors''
    lounge: "I saw a huge chondosarcoma today." Through a method of scientific reductionism,
    doctors can "simplify" a unique human being, into two sentences of information!


    ![](img/fe481b0f2e190573448211a8d1ff379b_23_0.png)


    A markedly swollen red calf, representing a sarcoma similar to my patient''s.


    That''s the way it is. That''s the way we do things. The rarer and more complicated
    the case in terms of pathology, and such, the less we care about personality or
    anything related to what makes us human.


    Yet, when I think about this real case, seen many years ago, my mind can now reflect
    on different things.'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'The boy came in with his mother. He was a man at 25, only the strictest chronological
    criteria. At my age, a 25-year-old male is a boy. He had been in the armed forces
    for awhile, and the story I was told that his right leg started to swell 2 years
    before, and the clinic “ran some tests and told him he didn''t have a blood clot,
    and not to worry.” After 2 years he came to see me because his right leg, mostly
    around his calf muscles, was now three times the size of his left leg, and he
    was having trouble walking because of the pain.


    ![](img/fe481b0f2e190573448211a8d1ff379b_24_0.png)


    MRI scan of the leg showing a large malignant tumor similar to my patient''s.


    There was nothing to guide me from previous experience as an oncologist, nor did
    we know for sure whether it was a malignant tumor as no biopsy had yet been done,
    so I had some time to figure out what I sent him for an MRI scan and to an orthopedist
    for a consultation and tissue biopsy.


    The following week he came back with his mother, and the pathology report was
    unequivocal. It was a type of cancer called a chondrosarcoma, and it was the worst
    kind, a so-called differentiated chondrosarcoma, where most of the cells in the
    tumor are so bizarre and abnormal, that they no longer resemble the cartilage
    cells from the tumor arose. And this was a very aggressive cancer, now, as the
    MRI showed the tumor had replaced most of the bone and tissue of his leg, and
    had invaded his lymph nodes in his right groin. A CT scan also showed other sites
    of disease, including multiple bone and lung metastases, for this


    ![](img/fe481b0f2e190573448211a8d1ff379b_24_1.png)


    Normal cartilage cells. Notice their uniform appearance and spacing.'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'was a tough, tough situation for a young guy and his mom to deal with.


    ![](img/fe481b0f2e190573448211a8d1ff379b_25_0.png)


    Chondrosarcoma cells. Note bizarre shapes and irregular spacing.

    Another example of the cellular abnormalities seen in chondrosarcomas.


    We talked about several options: First, to consider amputation of his right leg
    to try to decrease the tumor burden, as this was a massive tumor that might not
    be accessible to chemotherapy drugs or radiation, by virtue of its incredible
    size and growth patterns. I was not enthusiastic about this idea, because there
    was still the even ominous spread to other organs that we had to deal with and
    surgery would only delay and possibly stimulate further growth of cancer at more
    distant sites. But, it was absolutely necessary to talk about this first, as most
    people reason (sometimes correctly), that surgically removing a cancer is the
    proper course of action, as in: “Can’t you just cut it out?” Second, and perhaps
    more important in my way of thinking, was to consider a second opinion, and possibly
    treatment at a place where they see cases like this all. We tried to get him to
    the MD Anderson Cancer Center, which is a great place for this sort of case, having
    a large staff of oncologists who just see sarcomas. But due to financial constraints
    and logistics, they decided to be treated by me, and I called one of the leaders
    in the treatment of these types of tumors he recommended a chemotherapy regimen
    of two drugs, Adriamycin and Ifosfamide (very high dose), which had been shown
    in clinical trials to work well about 20% of the time.'
  merge: -1
  pgno: 25
- img_proc: true
  md: '![](img/fe481b0f2e190573448211a8d1ff379b_26_0.png)


    ![](img/fe481b0f2e190573448211a8d1ff379b_26_1.png)


    # Chemical structure of Adriamycin.


    # Chemical structure of Ifosfamide.


    So we treated him with two cycles of chemotherapy, over about 2 months, and after
    the treatment, we repeated the CT and bone scans, MRI and other tests. And the
    cancer had now spread even further. In other words, in oncology parlance, the
    tumor had grown through the chemotherapy regimen, which equals disease progression,
    which equals an even poorer chance that further chemotherapy would be useless.
    So we considered clinical trials, particularly a study at the National Cancer
    Institute, if he was eligible and enrolled, all his expenses (except for transportation),
    would be paid for. But he was not eligible, as these studies have very specific
    criteria for enrollment.


    Now throughout all this boy (my initial impression) and his mom were an inspiration
    to me. He acted with great courage and determination, and never complained, and
    his mom was equally splendid in her demeanor throughout this ordeal. This was
    no boy; this was a man of character and excellence of spirit.


    I told them about immunotherapy as a way of stimulating his immune system to fight
    the cancer, and that with the tools available to me, the likelihood of a positive
    and meaningful response to treatment was very remote. But there was some suggestion
    that in humans the immune system could recognize sarcoma-related antigens, and
    we could get lucky in stimulating it to do better and control his disease for
    awhile, and in the meantime keep exploring possible new


    ![](img/fe481b0f2e190573448211a8d1ff379b_26_2.png)


    GM-CSF. This complex protein can sometimes stimulate immune cells to kill cancer
    cells, seen in the next image.'
