  md: 'other scientists were also thinking the same thing and were actively involved
    in the painstaking research needed to prove its correctness.


    And like most ideas it was a long time coming to the realization, despite a host
    of defeatists and naysayers, that it is fundamentally sound.


    ![](img/fe481b0f2e190573448211a8d1ff379b_66_0.png)


    The three Es of cancer immunoediting: host protective versus tumor sculpting actions
    of immunity. Following cellular transformation and the failure of intrinsic tumor
    suppressor mechanisms, a developing tumor is detected by the immune system and
    its ultimate fate is determined by whether or not it is eliminated by the host
    protective actions of immunity (Elimination phase), maintained in a dormant or
    equilibrium state (Equilibrium phase) or escapes the extrinsic tumor suppressor
    actions of immunity by either becoming non-immunogenic or through the elaboration
    of immunosuppressive molecules and cells (Escape phase).


    Dr. Schreiber, Dr. Old, and their colleagues have brilliantly described the way
    the immune system functions in controlling cancer. Sometimes-complete success
    or failures occur which lead to disease progression.


    Which leads us "With a Wingtip and a Prayer" to the work of Dr. Robert Schreiber,
    Dr. Old, and many colleagues who have placed the immuno surveillance theory on
    solid scientific ground, an achievement for which they deserve the highest honors
    (15). In a process called immunoediting, (described in the figure above) the immune
    system, very often, detects'
