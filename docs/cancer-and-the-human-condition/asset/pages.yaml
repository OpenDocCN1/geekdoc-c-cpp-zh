  md: '# II. Forget Harvard, I Want My Kid to go to Medicare University!


    ~~In accordance with our principles of free enterprise and healthy competition,
    I''m going to ask you two to fight to the death for it.~~

    Monty Python


    In a free and modern society such as ours, based on democracy and capitalism,
    ideas which I fully endorse, there are various institutions which control the
    treatment of patients with cancer. The situation is complex in that typically
    a person cannot simply go to an oncologist and be treated with various drugs that
    may be helpful in controlling or curing the disease.


    ![](img/fe481b0f2e190573448211a8d1ff379b_20_0.png)


    As large as this dollar bill is, as a point of emphasis, I should have probably
    made it even larger!


    First, drugs are often extremely expensive. These drugs are created by pharmaceutical
    companies. These companies have employees and they want to be paid for their labor.
    These companies often have shareholders who invested in stocks and want a good
    return on their investments. The generation of income based on so-called blockbuster
    drugs with sales in the billions every year, allow further drug development and
    so on. In our current economy it is not unusual for a drug to cost $50,000.00
    a year. This cost does not include the cost of administering it, which might include
    hospital or clinic fees, material fees for tubing and IV fluids, pharmacy costs
    for drug preparation, and nursing and physician fees.'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'Assuming a drug has passed through the FDA (Food and Drug Administration) regulatory
    process, an extraordinary event in itself, somebody has to go pay for it.


    If you are a billionaire, stop reading this essay. If you are of modest means
    and old enough or poor or sick enough to be enrolled in Medicare or Medicaid (controlled
    by the Centers for Medicare and Medicaid Services)CMS), then you probably know
    that these government services determine to a large extent what chemotherapy or
    other treatments your oncologist is permitted to use, which can be translated
    into what treatment will be paid for. This limitation also applies to various
    lab tests and radiometric studies.


    President Lyndon Johnson signing the first Medicare bill in 1965. Former President
    Harry Truman is sitting on the right, representing the “first” Medicare recipient.
    When politics dictate healthcare decisions, expect to be amazed and confused.


    ![](img/fe481b0f2e190573448211a8d1ff379b_21_0.png)


    If a drug is not approved by CMS, it is unlikely to be approved by insurance companies.
    These companies also have employees and shareholders to please. For example, the
    recently departed CEO of United Healthcare made more than a billion dollars during
    his tenure.*


    So outside of clinical trials that are completely paid for by the companies that
    are developing a new cancer treatment, which are often highly experimental and
    of ineffective or even dangerous, somebody has to pay.


    ![](img/fe481b0f2e190573448211a8d1ff379b_21_1.png)


    Confusion / Mediocrity /Sillness * Due to “irregularities” in the method the money
    was obtained, he had to give some of it back, but still made a ton of money.'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'So why am I urging my kid to attend Medicare University? Because they must
    be the smartest people in the universe; they decide what drugs they will allow
    me to use in treating patients with cancer and blood diseases, for without Medicare
    approval with rare exception, the cost of these drugs is beyond the means of the
    average citizen. There is an appeals process, but despite presenting sound scientific
    data to support the use of nonapproved drugs, including copies of papers and abstracts
    from distinguished academic physicians, I have had no success in reversing any
    decisions.


    I have no idea how we can advance the treatment of cancer, while controlling costs,
    with the present system that exists in our country.


