  md: '# X. The Riddle of the Sphingolipid


    > ~It is, I think, particularly in periods of acknowledged crisis that scientists
    have turned to philosophical analysis as a device for unlocking the riddles of
    their field.~~ Thomas Kuhn, Ph.D. (1922-1996)


    Years ago at a fellows meeting sponsored by a pharmaceutical company, I presented
    an abstract (which is a brief summary of work in progress), and spoke to the other
    attendees, in what was considered by many to be at best an adequate talk. But,
    it was much better than my performance in Rio de Janiero, about ten years before,
    when I stood before the audience, at the University of Rio de Janiero, and said
    nothing! I was absolutely terrified, and suffered from stage fright, which totally
    incapacitated me, so completely, that I could not utter a single word. My embarrassment
    was only magnified, for while visiting Brazil, I was the guest of my friend and
    teacher, the great scholar and man, Dr. Luiz R. Travassos.


    So there was a certain measure of satisfaction in being able to speak coherently:
    if not quite the Thespian, at least I didn’t make a complete fool of myself, as
    I had done before. And as the topics are connected, separated by more than ten
    years, it gives me a sense of perspective on how we mature through events that
    at the time seem cruel and unbearable, and yet we survive, and sometimes benefit
    from them, in unexpected ways.


    ![](img/fe481b0f2e190573448211a8d1ff379b_55_0.png)'
  merge: -1
  pgno: 55
- img_proc: true
  md: '![](img/fe481b0f2e190573448211a8d1ff379b_56_0.png)


    As you probably know, the riddle of the sphinx was three questions. But before
    we get to that ancient story, and the origins of the Sphinx, let me tell you about
    sphingolipids which are not nearly as well known.


    When we think about the basic confines of a cell in let''s say $5^{th}$ grade,
    our teacher describes various structures or organelles. There is the nucleus,
    where DNA resides. There is the nucleolus, where RNA resides. We see images of
    centrioles, mitochondria, endoplasmic reticulum, Golgi apparatus, lysosomes, and
    so on.


    But my personal favorite has always been the cell membrane. For a number of reasons,
    I love the cell surface. As in “I spent about ten years of my life, on and off,
    studying cancer cell cell surfaces.” In simple terms, we think of the cell as
    a unique, biological entity because it exists to some degree, separate from its
    surrounding environment, yet, to some degree communicating with its surrounding
    environment through the cell membrane. The cell membrane is a double-layered lipid'
  merge: -1
  pgno: 56
- img_proc: true
  md: 'sandwich which contains many different types of lipids (cholesterol, phospholipids,
    sphingolipids, glycosphingolipids, and gangliosides* to name a few classes of
    molecules), which kind of float around as a sort of oily sea**, with many other
    types of molecules, interspersed as well, in what is a constantly changing environment.


    ![](img/fe481b0f2e190573448211a8d1ff379b_57_0.png)


    Cross-section of a small piece of the cell membrane and associated structures.


    The cell surface, and specifically the outer part of the cell membrane, is that
    specialized part of the cell membrane that interacts with the external environment.
    Things are of course much more complicated, as sometimes parts of the cell membrane
    reverse sides, or flip-flop, and new additions are added, while other parts are
    discarded; and quite often, a layer of secretions from these cells, called the
    glycocalyx, accumulates just outside of the outer membrane as a sort of fuzzy
    matrix, which influences communication between cells and their environment.


    So, now let us perform a thought experiment. I want you to close your eyes and
    think of the cell surface as a beautiful forest, with all sorts of amazing plants,
    trees, flowers, shrubs, and grass, all dancing in front of your eyes, in a kind
    of molecular kaleidoscope.


    > * More about gangliosides in essay XI ‘Lewis Thomas’ Shoes’


    > **Just before printing BP (British Petroleum) created an oily sea evolving in
    the Gulf Coast. This is a disaster of unspeakable magnitude.'
  merge: -1
  pgno: 57
- img_proc: true
  md: '![](img/fe481b0f2e190573448211a8d1ff379b_58_0.png)


    The cell as surrealistic art form.


    To add to this imagery, now imagine a trillion cells, all with their own cell
    surfaces, with their own unique landscape. Now add the motion of membrane motion,
    to the motion of cells, to the motion of structures (organs), to the motion of
    organisms (us), to the motion of everything.


    Whirling around, seeking out others, searching, probing, reaching out, constantly,
    wanting to touch, to embrace.


    If you think of it as a way of achieving communion between living things, or as
    a subatomic spirit dance, maybe that will help.


    Or maybe just another manifestation of the ineffable will and creativity of God.'
