    # XVII. Microtruth

    ~~Of all lies, art is the least untrue.~~ Gustave Flaubert (1821-1880)


    I am sitting in a lecture hall about 35 years ago and our organic chemistry professor
    at Queens College in New York, Dr. Axelrod, is handing out exams, and I am praying
    that I can survive this ordeal. Dr. Axelrod was short and squat and terrifying.
    His gaze was penetrating, with his glass eye participating in a totally intimidating
    visage.


    The last question was about laetrile or amygdal. It''s also incorrectly called
    vitamin B17 and it''s sometimes derived from apricot pits, in a chemical extraction
    process that leads to the isolation of a sugar molecule distantly related to glucose,
    like one is directly related to a never-seen crazy uncle, who is whispered about
    holiday gatherings.


    ![](img/fe481b0f2e190573448211a8d1ff379b_93_0.png)


    Laetrile is not the answer.


    For laetrile is a glycoside that carries a cyanide moiety which when released
    kills cells and sometimes people from cyanide poisoning.


    The question involved the synthesis of amygdalin from a sugar precursor, using
    various catalytic processes. By a stroke of luck I got the right question, but
    there was no future for me in chemistry.


    In the 1970''s the laetrile controversy peaked, and various citizens formed political
    action organizations to allow the use of this drug in treating cancer. Lawsuits
    were filed in federal courts and the highest levels of government were involved
    in deciding the fate of laetrile in this country. For those readers interested
    in this fascinating story, go to the Quackwatch website, and access a superb article
    by Benjamin Wilson, MD: “The Rise and Fall of Laetrile"'
