    ![](img/fe481b0f2e190573448211a8d1ff379b_32_0.png)


    # Cholesterol


    # Cholecalciferol


    # Calcitriol


    Note the similarity in structure between cholesterol (which is synthesized in
    vitamin D and the vitamin D analog calcitriol used in treating prostate cancer.


    The mechanism of action may be related to Vitamin D (which is synthesized in the
    skin from a cholesterol derivative) acting as a hormone and binding to a Vitamin
    D receptor, which then becomes activated and influences other biochemical pathways
    in cells. (5)


    So a tablespoon of Cod liver oil has about 1,300 IU of Vitamin D, which may be
    the highest naturally occurring source of this vitamin on earth! But don''t rush
    out to buy some or to go fishing in the North Atlantic.


    Be careful to check that the Vitamin A content is not too excessive, as too much
    Vitamin A can be very toxic. In fact, people have died from Vitamin A poisoning
    when they eat polar bear livers (don''t ask me why they were eating polar bear).
    So before taking: read the label of Cod liver oil preparations carefully (which
    come in capsule form also) and ask your doctor or pharmacist about drug interactions
    that might occur.


    Now consider this journal article title: “Could ultraviolet and Vitamin D be associated
    with lower incidence rates of lung cancer?” (6) As you already know, Vitamin D
    is made in the skin from a cholesterol precursor. But to make this happen the
    body needs a certain amount of sunlight exposure and without it Vitamin D levels
    are too low, which may increase the risk of lung cancer along with the other cancers
    mentioned. Vitamin D levels (in the form of 25 hydroxyvitamin D) can be measured
