    她说她感觉好多了，尽管她的体重增加了40磅，看起来不像人而像一具骨架。


    三个月后，讣中描述了“她对抗癌症的勇敢战斗”。


    我们该如何解释这些事件呢？首先


    在不久前，与我在斯隆-凯特林研究所的导师洛德·奥德博士（Dr. Lloyd Old）聊天时，他分享了他对甜胺（laetrile）争议的观察。这场争议在支持使用它的患者群体与反对它的科学家和医生群体之间引发了巨大的对立。他建议双方会面进行思想的自由交流，尽管这是最符合逻辑的方法，但显然这从未发生过。


    让我想起早些与奥德博士的谈话（如你从之前的文章中所知，我认为他是世界上领先的癌症生物学家，现代癌症免疫学的创始人）。在那个谈话中，他引用了卓越的逻辑学家哲哲阿尔弗雷德·诺斯·怀特海（Alfred
    North Whitehead）的话：“一个想法的有趣比它的真实更重要。”


    ![](img/fe481b0f2e190573448211a8d1ff379b_96_0.png)


    所以现在，这篇文章的标题将定义为：“微真相”（Microtruth）：被包裹并隐藏在虚假之中的极微小的真相。


    甜胺能杀死癌细胞，有时它似乎能帮助使用它的人攻击癌症。甜胺的“微真相”在于：它并不比人类发明过的最神奇且最具争议的替代疗法——“安慰剂”。因为安慰剂是一种神秘的药物，它不应该帮助任何人感觉好转或控制任何疾病的症状，但在无数由声良好的调查人员进行的研究中，它确实做到了。有时它的效果比那些认为更有效的药物还好，有时则没如此，但作为科学家和医生，我们总是假设安慰剂是无用的治疗手段。但这也是一个微真相，因为我们忽略了事实：出于某些公认的神秘原因，它确实帮助了一些癌症和其他疾病患者；而至于这种安慰剂效应是神经免疫学的结果、自发性缓解（这无论如何可能发生），还是全能上帝的行为，只要人们康复了，并不重要。


    甜胺、鲨鱼和��寄松的问题在于，正如尤利斯·凯撒所说：“人们相信他们想相信的东西。”


    安慰剂仍然是一种强大的、也许现在被低估的“药物”。


    所以，当关于这些药物影响免疫功能或抑制血管生成的报告发表时（19, 20），绝望的患者会做出绝望的事。因为问题的核心不在于通过我们认为相关的任何机制来起作用，而在于哪种方法效果最好且毒性最小。冒着提出异端思想的风险，一种方法（尽管许多人认为是不符合道德的）是给患者安慰剂，声称这是一种可能帮助他们的物质。与其简单地否定这个愚蠢的想法，不如想想在任何疾病的有效疗法出现之前，医生们几千年来一直在做什么！


    肿瘤学中使用常规化疗的微真相是：它在晚期癌症患者中持续实现了有意义的收益。如果这一陈述是真的，那么永远不会出现使用维生素B17、内维星（Nevastat）和艾斯卡多（Iscador）等传统、无效且有毒药物。


    # XVIII. 当乳癌不是乳癌时，它何时才是乳癌？


    ~~“专家是一个在一个极窄领域内犯过所有可能错误的人。”~~ 尼尔斯·波尔（1885-1962）


    我重复这篇文章的标题作为强调，以防你认为这是排版错误或我疯了。


    当乳癌不是乳癌时，它何时才是乳癌？


    让我们从一位接受年度乳腺检查的女性开始。检查显示右乳有一个可疑的异常，大小小于1厘米，并伴有微钙化。极其严谨的放射科医生建议：“对这一异常进行活检，可能在超声引导下进行，因为临床触诊无法检测到。”


    ![](img/fe481b0f2e190573448211a8d1ff379b_98_0.png)


    经验丰富的放射科医生有75%能正确解读常规乳腺检查结果。注意左侧致密的正常乳组织。


    这位现在已成为“患者”的女性心烦意乱，她的丈夫和直系家人也是如此。她50岁，上周刚跑完马马拉松。她所做的一切都是正确的，并不断通过健康饮食、运动以及任何被认为有帮助的方法来降低患癌风险。


    活检在周五下午进行。从技术角度来看，一切进展顺利。当她离开回家时，她问放射科医生诊断结果什么时候出来。他指出，病理学家要到周一才会给出正式解释！现在她对等待感到非常焦躁，由于她是AAA型人格，她拨给她的全科医生打电话投诉（并看看能否加快速度，但在一个组织片制备技术有限的小型社区医院，这是办不到的）。


    她在类似守 vigil的环境中等待了大约4000分钟（72小时），随后接到了主治医生的电话，好消息。他告诉她，活检的乳腺肿被称为导管内原位癌（lobular
    carcinoma in situ），仅通过医生进行的切除活检，治愈概率大约为100%。


