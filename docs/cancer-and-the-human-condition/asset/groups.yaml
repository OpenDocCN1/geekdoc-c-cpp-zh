    # XVIII. When is Breast Cancer, Which is Not Breast Cancer, Breast Cancer?


    ~~"An expert is a man who has made all the mistakes which can be made in a very
    narrow field."~~ Niels Bohr (1885-1962)


    I repeat the headline of this essay as a point of emphasis, lest you think it
    is a typographical error or I have gone mad.


    When is breast cancer, which is not breast cancer, breast cancer?


    Let us begin with a woman who undergoes her yearly mammogram. It shows a suspicious
    abnormality in the right breast, less than a centimeter in size, with microcalcifications,
    the radiologist, ever diligent, recommends: "a biopsy of this abnormality, possibly
    under ultrasound guidance, as it cannot be detected by clinical palpation."


    ![](img/fe481b0f2e190573448211a8d1ff379b_98_0.png)


    An experienced radiologist can correctly interpret routine mammograms about 75%
    of the time. Notice the dense normal breast on the left.


    The woman, who is now a "patient," is frantic, as are her husband and immediate
    family. She is 50 years old and just ran a marathon last week. She does everything
    right and is constantly trying to decrease her risk of cancer, by eating well,
    exercising, and anything else believed to help.


    A biopsy is performed on a Friday afternoon. Everything goes well from a technical
    standpoint. As she leaves to go home she asks the radiologist when the diagnosis
    will be back. He indicates that it won''t be formally interpreted by the pathologist-
    until MONDAY! Now she is really upset about waiting and, being a type AAA personality,
    she calls her primary care'
  - '[PAGE 99]


    doctor to complain (and see if things can be sped up, they can''t in a small community
    hospital with limited histology technicians to prepare slides.)


    She waits in a vigil-like setting for about 4,000 minutes (72 hours), and is called
    by her primary physician with good news. He tells her that the breast mass that
    was biopsied is called lobular carcinoma in situ and her chance of being cured
    with just an excisional biopsy performed by a surgeon is about 100%.


    Now she calls her brother-in-law who is a PhD scientist at a famous university.
    He calls one of the world''s experts in LCIS (lobular carcinoma in situ) who tells
    him that the term lobular carcinoma in situ is no longer used by the world''s
    leading-experts. Instead we call it lobular neoplasia, and yes it''s a tumor (neoplasia)
    but not cancer (carcinoma). Some experts still call it carcinoma in situ, but
    he''s not friends with them because of this dispute.


    > Cancer experts like to disagree with each other.


    So her brother-in-law calls other experts and reviews the world literature and
    discovers several areas of scientific controversy.


    +   1) Lobular neoplasia (formerly lobular carcinoma in situ) does not always
    need to be surgically excised. (21)


    +   2) Lobular carcinoma in situ (now lobular neoplasia) does not need to be surgically
    excised. (22)


    +   3) Lobular neoplasia (formerly lobular carcinoma in situ) is a benign lesion
    that is associated with an increased risk of developing breast cancer in either
    breast, but by itself probably has no malignant potential. (23)


    +   4) Lobular carcinoma in situ can develop into invasive lobular carcinoma.
    (24, 25)


    So if you are not somewhat confused by all this, you probably need to read it
    again, since it is Very Confusing.


    ![](img/fe481b0f2e190573448211a8d1ff379b_99_0.png)'
