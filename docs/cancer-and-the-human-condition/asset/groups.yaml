- md: '

    God still pretty spry), has for many religious people remained the gold standard
    for longevity. Less prominent figures like you and I may expect 80 to be considered
    a righteous age to pass on, for a righteous life led.


    But living longer may not be living better. Some people end up with debilitating
    diseases that impair their ability to function independently. Their families,
    despite their best efforts, cannot take care of them, so end up in nursing homes,
    where many become disillusioned, they just wait to die.


    Other people may be more highly functional, or motivated and fight on. Still,
    as I''ve experienced personally with my late father and now my mother, a nursing
    home is an imperfect but necessary solution to the problems associated with aging
    and disease.


    ![](img/fe481b0f2e190573448211a8d1ff379b_132_0.png)


    Will the future of mankind be one in which people live so long that we will no
    longer be able to provide even a modicum of comfort for most of its citizens?
    If you have enough money and/or really good insurance addressing long term care,
    this will not be consideration, but most people struggle financially and don''t
    have the resources to plan adequately for the future. Now can we entirely depend
    on government programs like Social Security, Medicare, or Medicaid to respond
    adequately to our aging population, as our nation is already running up an incredible
    debt. Other social and religious organizations may be able to help, but again
    the numbers are staggering.


    > The late-blooming painter, Grandma Moses (1860-1961). As my late Grandpa Benny
    said: "The first 100 years are the hardest."


    I have no idea what to do about the “Age of Age,” beyond the recommendation that
    people reconsider how old is old enough. For instance, a friend of mine wants
    to live forever.


    - Grandpa Benny died at 97, so he was right!


    He says, "I want to be raisin in a jar." I’m not kidding. He is an otherwise intelligent
    and fairly sensible person, that’s what he wants. A patient of mine with a terrible
    bile duct cancer that had already spread to his bones and other organs at the
    time of diagnosis, wanted everything done to sustain his life. He was already
    an amputee from end-stage diabetes and renal disease and had received a kidney
    transplant a couple years before, so he was not exactly the best candidate for
    aggressive treatment of any sort, but that is precisely what he believed would
    help him live many more years. His wife, who loved him dearly, told me "wanted
    to live for a thousand years." And meant what she said. As an oncologist, I heard
    many things, but I was taken aback by her irrational desires. The outcome, unfortunately,
    was more like a thousand hours of additional life with chemotherapy.


    ![](img/fe481b0f2e190573448211a8d1ff379b_133_0.png)


    On the other hand, I’ve had people who were comfortable with death. One lady who
    was 79 and in wheelchair, with a treatable and even potentially curable lymphoma,
    said: "I do not wish for any treatment that will prolong my life." Many other
    patients have also expressed similar views, which I deeply respect as a mature
    and sensible approach to terrible disease. No one need suffer beyond measure in
    these situations, and sometimes the treatment is toxic and ineffective and worse
    than the disease itself.


    This poster, circa 1930, is no longer true. Advances made in treating cancer now
    allow us to "cure" people with chemotherapy and biological therapy, only to return
    with new cancers.


    If you truly believe that cancer, in general, will be controlled with chemotherapy,
    radiation, surgery, or other treatments, I’m sorry to disappoint you. More and
    more people will develop cancer throughout the world as the global population
    increases and people live longer. Since the industrial revolution, (and I’m all
    for industry and technology), our planet has been drenched with toxic, carcinogenic
    chemicals, which we now know in the tiniest amounts, over say 20 to 60 years of
    chronic exposure, promote the development of a myriad of forms of cancer. If we
    just live long enough and wait, the likelihood is that we will develop cancer.
    That doesn''t imply it can''t be cured or controlled at times, but what I''m seeing
    more and more is a growing number of what I would call cancer “frequent flyers.”
    I saw one woman with 5 different cancers who was still in very good shape at 75.
    And people with 3 separate malignancies are not unusual anymore.


    ![](img/fe481b0f2e190573448211a8d1ff379b_134_0.png)


    A healthy diet, exercise, prayer, vitamins, supplements, may help reduce the risk
    of cancer, or at least to delay its often inevitable development, but the hard
    numbers are that the benefits statistically are small, but significant. Small
    and significant does not equal control. For control, we have to figure out how
    to prevent cancer by other more elegant methods. Decreasing pollution may help
    a little, but we already live in a toxic waste dump (planet Earth), which will
    take hundreds of years (if ever) to clean up. So I think it''s naive to think
    that “the cure” is something that can be achieved.


    Toxic waste dump (Earth) and Mars. Don''t expect any help from the Martians.


    Now consider this equation: time + toxic chemicals (carcinogens) + viruses + genetic
    instability = cancer.


    ![](img/fe481b0f2e190573448211a8d1ff379b_134_1.png)


    Visual aids for the equation above.


    Time being time, is not fixed; so if we live long enough and don''t die from something
    else (reader''s choice), we''ll probably develop cancer cells in our bodies. In
    fact, they''re probably already there in all of us, every day. Remaining undetected
    for some of us, they are part of our genetic complexity. For cancer to become
    clinically apparent, the other factors in the equation may or may not need to
    be active. In other words, if you have a particularly dysfunctional genetic makeup
    like we some-times in cancer syndromes, you don''t need anything but time to develop
    cancer. In other cases, carcinogens or viruses alone are sufficient to trigger
    things. You get the idea, it’s not complicated!


    # DIPHTHERIA is deadly-


    ![](img/fe481b0f2e190573448211a8d1ff379b_135_0.png)


    # IMMUNISATION is the safeguard


    ![](img/fe481b0f2e190573448211a8d1ff379b_135_1.png)


    ![](img/fe481b0f2e190573448211a8d1ff379b_135_2.png)

    '
  mdcn: '

    （上帝依然很精力活力），对许多宗教人士来说，这仍然是长寿的金标准。像你我这样没那么显赫的人物，可能会认为 80 岁是一个离开世界的正义生命的终点，因为我们过了一段正义的人生。


    但活得长并不意味着活得好。有些人最终会患上衰弱体质的疾病，损害了他们独立生活的能力。尽管家人尽了全力，却仍无法照顾他们，最终只能进入养老院，在那里，许多人变得幻灭，只是在等待死亡。


    另一些人的功能可能更高，或者更有动力并斗争到底。然而，正如我个人在去世的父亲和现在的母亲身上经历的那样，养老院是解决年龄和疾病相关问题的一个完美但必要的解决方案。


    ![](img/fe481b0f2e190573448211a8d1ff379b_132_0.png)


    人类的未来是否会变成这样：人们活得太久，以我们无法为大多数公民提供哪怕一点点的舒适？如果你有足够的资金和/或非常好的长期护理保险，这将不是需要考虑的问题，但大多数人在财务上很挣扎，没有资源对未来做出充分计划。现在，我们能完全依靠社会保障、医疗保健或医疗补助救助等政府计划来充分应对老龄化的人口吗？因为我们的国家已经积压了惊人的债务。其他和社会宗教组织可能提供帮助，但再次强调，这些数字是惊人的。


    > 晚年成名的画家，摩西斯奶奶（1860-1961）。正如我去世的本尼爷爷所说：“前 100 年是最艰难的。”


    对于这个“年龄时代”，我不知道该怎么办，除了建议人们重新考虑多大才算老。例如，我的一个朋友想长生不老。


    -   本尼爷爷在 97 岁去世，所以他是对的！


    他说：“我想成为罐子里的葡萄干。”我不是在开玩笑。他其他时候是一个明智且相当理智的人，这是他想要的。我的一位患者患有严重的胆管癌，在确诊时已经扩散到骨骼和其他器官，他希望尽一切手段维持他的生命。他已经因为晚期糖尿病和肾脏疾病导致截肢，并在几年前接受过肾移植，所以他并不是接受任何形式激进治疗的理想人选，但这恰恰就是他认为能帮助他多活几年的方法。他深爱的妻子告诉我，“她想活一千年。”而且她是认真的的。作为一名肿瘤科医生，我听过很多事，但我仍对她那种不理性的愿望感到惊讶。遗憾的是，结果更像是通过化疗增加了一千小时的生命。


    ![](img/fe481b0f2e190573448211a8d1ff379b_133_0.png)


    另一方面，我也遇到过对死亡感到释然（不，是感到坦然）的人。一位 79 岁、坐在轮椅上、患有可治疗甚至可能治愈的淋巴瘤的女士说：“我不希望接受任何延长我生命的治疗。”许多其他患者也表达了类似的观点，我深表尊重，这是可怕疾病的一种成熟且理智的方法。在这些情况下，没有人需要遭受超出想象的痛苦，有时治疗本身是有毒且无效的，甚至比疾病本身还要糟糕。


    这张大约是 1930 年的海报已不再成立。癌症治疗手段的进步使我们现在能够通过化疗和生物疗法“治愈”人们，结果他们又带着新的癌症回来。


    如果你真的认为癌症通常可以通过化疗、放疗、手术或其他治疗得到控制，我很遗憾让你失望了。随着全球人口的增加和寿命的延长，世界上患癌症的人将越来越多。自工业革命以来（我完全支持工业和技术），我们的地球被浸透了有毒的致癌化学物质，我们现在知道，这些物质在极微剂量下，经过
    20 到 60 年的暴露，就会导致各种形式的癌症。由于我们活得足够久而没有由于其他原因去世，癌症的概率是……只要我们活得足够久并等待，我们就会患上癌症。这并不意味着癌症无法控制，但我看到的，我所谓的“癌症癌症常客”的人数正在增加。我见过一位
    75 岁时状态依然良好的女性患有 5 种恶性肿瘤。这已经不再罕见。


    ![](img/fe481b0f2e190573448211a8d1ff379b_134_0.png)


    健康的饮食、运动、祈祷、补充剂可能降低癌症风险，或者至少推迟其不可避免的发生，但数据表明这些益处是微小的。微小且显著并不意味着可以控制。为了控制，我们必须找到更优雅的方法预防癌症。减少污染可能有帮助，但我们已经生活在一个毒垃圾场（地球）上，这需要百年时间（如果有）才能清理。因此我认为认为“治愈”是可以实现的目标是天真的。


    毒垃圾场（地球）和火星。不要指望火星人的帮助。


    现在考虑这个公式：时间 + 有毒化学物质（致癌物）+ 病毒 + 基因不稳定 = 癌症。


    ![](img/fe481b0f2e190573448211a8d1ff379b_134_1.png)


    上述公式的视觉辅助。


    时间本身不是固定的；所以如果我们活得足够久而没有死于其他原因（读者的选择），我们可能会产生癌症细胞。事实上，这些细胞每天都存在我们每个人身上。对于我们中的某些人来说，它们保持未被发现状态，是由于基因复杂性的一部分。要让癌症在临床上出现，公式中的其他因素可能不需要激活。换句话说，如果你具有特殊的功能异常基因组成，就像我们某些癌症综合征患者，除了时间之外什么都会患癌。在其他情况下，致癌物或病毒本身就足以引发问题。你明白意思，这并不复杂！


