    # XXIII. How Should Cancer Patients Respond to Response Rates?


    ~~The saddest aspect of life right now is that science gathers knowledge faster
    than society gathers wisdom.~~ Isaac Asimov (1920-1992)


    One of the fascinating features of cancer is that people can go to their doctor
    complaining of some fairly mild and nondcript symptoms such as feeling more tired
    and end up with a diagnosis of widespread, i.e., metastatic cancer.


    After completing what is called a staging workup with CT, PET/CT, MRI, and other
    radiologic tests, along with routine laboratory studies, I have seen countless
    patients with an incredible amount of disease and few signs or symptoms. And remember
    that the cancer was probably present for years before being discovered.


    So the first question is: How can people walk around with a considerable disease
    burden and not know it?


    The second question is: How important is it to make the cancer partially or completely
    disappear for a period of time?


    The third question is: If the cancer disappears will the patient feel better and
    live longer?


    As we have talked about before, when oncologists talk about cancer disappearing,
    what are they really talking about something called a response rate. This is the
    percentage of patients who have disease (that can be measured by some method such
    as size of a mass on a CT scan), that shrinks down to a smaller size or disappears
    completely. There are also laboratory tests that are used to measure biochemical
    responses in a similar fashion.


    The precise definition of a complete radiologic response is the complete disappearance
    of measurable disease for at least one month. After one month if the cancer grows
    back, we don’t change our definition that a complete response was achieved.


    In a similar fashion, a partial response indicates the cancer decreased in size
    by more than 25%.'
  - '[PAGE 122]


    No response actually means the cancer decreased in size by less than 25% or not
    at all, although sometimes one hears called a minor response in this setting.*


    To complicate matters further, a major response can be described, indicating that
    the cancer decreased in size by more than 50%, but not completely.


    To really make you dizzy, there are also mixed responses where the cancer can
    shrink in some places but remain the same size or increase in other places.


    Let us ignore other terms such as complete remission and cytogenetic remission,
    which are typically used to describe blood diseases such as myeloma, lymphoma,
    and leukemia.


    ![](img/fe481b0f2e190573448211a8d1ff379b_122_0.png)


    To add to our confusion, a patient can have a biochemical response such as a decrease
    in PSA, CEA, CA27.29, CA15-3, CA19-9, and yet the CT scans or other radiologic
    tests show no change!


    PET/CT scans of a patient with a malignant tumor in the left neck (the heart brain
    normally are hyper-metabolic). What does it truly tell us?


    And with new tests as PET/CT, which measure the metabolic activity of cancer and
    its size and distribution, we can sometimes observe a metabolic response where
    the tumor seems to have shut down its excessive utilization of glucose (or other
    substrates) and yet its size is unchanged.


    So when is a response not a response? The answer depends on what we are really
    talking about and part of that discussion is based on concepts such as quality
    of life and prolonged survival, which may not be improved with cancer treatments
    that demonstrate statistically significant response rates.


    So a word of caution: Do not always equate response rates with feeling better
    and living longer!


    > * The precise definition of response rates including different measurement standards
    is continually changing.'
  - '[PAGE 123]


    # XXIV. Has Reefer Madness Struck the National Cancer Institute?

    ~~"I don''t do drugs."~~ Salvador Dali (1904-1989)


    Not too long ago, a patient told me she watched a news clip describing the possible
    use of marijuana in treating cancer. I was reluctant to investigate further but
    within a few days reports started to surface about a study published in the Journal
    of the National Cancer Institute describing the anticancer effect of a marijuana
    derivative that has been used (legally) in treating patients who experience side
    effects from chemotherapy drugs such as nausea and vomiting.


    This drug is called Marinol and it is a synthetic version of tetrahydrocannabinol
    (THC), which is one of the active chemicals in pot plants (Cannabis sativa in
    our country).


    Before you tell your friends and family that getting high has unexpected benefits
    in treating metastatic cancer, read on.


    The study by Ramer and Hinz (35) uses cancer cells which grow outside of the body.
    These are called tissue cells. There many hundreds of cell lines derived from
    animals and humans with cancer which have been adapted to grow outside of a host,
    and these cell lines can be studied biochemically to determine how they are affected
    by altering their environment. One way to do this is to add chemicals to the cells
    and see what happens. When we talk about in vitro experiments (versus in vivo)
    this is what we are talking about. Any potential effect observed in vitro, such
    as the death of cancer cells by adding chemical X, must be


    ![](img/fe481b0f2e190573448211a8d1ff379b_123_0.png)'
  - '[PAGE 124]


    confirmed by observations in vivo (i.e., in a living creature), before we can
    even begin to ask questions like: Does drug X help patients with cancer in any
    meaningful way?*


    ![](img/fe481b0f2e190573448211a8d1ff379b_124_0.png)


    Give me that old-time tissue culture.


    In this study one of the chemicals was THC. THC was structurally characterized
    in 1964. THC will get you high. THC will make you forget what I just said. THC
    will make you want to check the refrigerator right now for snacks. But I doubt
    THC will ever be used to control metastatic cancer.


    THC and other cannabinoids derived from pot binds to receptors in the brain that
    influence neurological and psychological function, and these receptors are called
    CB1. There are also CB2 receptors found in other cell types such as spleen cells
    of the immune system. THC also affects other cells, and their functions, probably
    by binding to other receptors. So in treating cancer cells with THC, Ramer and
    Hinz showed that certain cell lines could be inhibited from becoming invasive
    in an in vitro assay using a gel matrix to measure invasiveness. This process
    was mediated by another molecule produced by these cells called TIMP-1 (Tissue
    Inhibitor of Matrix Metalloproteinase-1). Matrix metalloproteinases may be a key
    molecule in the spread of cancer cells as they help break apart the natural barriers
    that prevent cancer cells from growing and spreading. THC promotes the expression
    of TIMP-1.


    In 1975 a paper was published in the (guess) Journal of the National Cancer Institute
    titled: “Anticancer Activity of Cannabinoids."(35) This study in mice demonstrated
    that THC


    * These are called pre-clinical studies.'
  - '[PAGE 125]


    # Happy investigator. Mice ready to party! Party over! Why?


    could inhibit lung cancer growth in vivo and in vitro by feeding mice THC every
    day for nearly 2 weeks. Other types of cancer cells were also studied. But beyond
    creating incredibly stoned mice*, the results were less than spectacular.


    Fast forwarding 30 years we are back where we started in that THC is being studied
    by researchers (including clinical trials in humans with advanced brain cancers),
    (36) lung cancer where it seems to have an anticancer effect, (37) lung cancer
    where it seems to promote cancer growth, (38) and many other cancer cell types
    with contradictory results.


    ![](img/fe481b0f2e190573448211a8d1ff379b_125_0.png)


    My opinion is that the use of THC and other related molecules in treating cancer,
    as a form of chemotherapy, will fail. THC is wonderful in altering perception
    but not wonderful in decreasing cancer invasiveness. And as for the news media
    treating what I consider a mediocre paper as something sent


    > * The use of marijuana as a “recreational” drug in humans, and its consequences,
    is a political, social and medical nightmare.'
