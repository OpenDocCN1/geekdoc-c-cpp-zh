    ~~每个人的终结都是一样的。区分人与人的只有他生活和死死的细节。~~

    欧斯特·海明威 (1899-1961)


    我们都是生命正态曲线上的点。


    如果你了解几何学、代数、微分方程、*概率论*和微积分，请带着谨慎和怜悯的心情阅读此。我真的不记得任何“高等”数学了，我几乎忘记了它们。但我对正态曲线（或曲线状图中的任何其他数据点分布）的了解足以我写下这篇文章。


    ![](img/fe481b0f2e190573448211a8d1ff379b_116_0.png)


    我们都是生命正态曲线上的点。


    当我们谈论癌症患者的缓解率时，正如我之前提到的，我们谈论的是某种测量。在一个典型研究中，药物A可能让30%的特定类型癌症患者的肿瘤缩小超过50%，并持续至少一个月。如果我们考虑这个简单的例子，我们就会得出结论：药物A的缓解率（基于肿瘤消失超过50%的主要缓解）为30%，因此，如果我们治疗1000名癌症患者，预计将300人产生主要缓解，假设他们的年龄、体能状况、疾病阶段和其他合并症相似。


    现在，在我们完成这个练习后，我们可以将这些反应绘制在图表中，它将开始看起来像一条正态曲线。


    * 正如之前提到的，布莱·帕斯卡的天赋不仅限于我早早对他那个著名的“赌注”的描述。他还是概率论的创立者。


    1000人中的每个人都成为药物A反应图上的一个点（或数据点）。


    现在，让我们通过包含其他700人（点）增加复杂性，他们代表了大多数其他反应（或缺乏反应）。假设另有300名患者产生轻微缓解，其肿瘤缩小小于50%但大于25%。将他们加入曲线。现在，假设另有300名患者肿瘤缩小在小于25%到完全不缩小之间。这通常被称为稳定疾病。将他们加入曲线。再假设另有100人（现在总数为1000人）在治疗期间肿瘤继续增长超过25%（根据惯例，小于25%的增长仍被视为稳定疾病），那么这被称为疾病进展。也将他们加入。


    那些产生主要缓解的人呢？有些人甚至可能看到肿瘤完全消失，我们称之为完全缓解。或其他具有相似程度的反应（例如缩小90%），称为近完全缓解。以此类推，无无穷（或几乎如此）。


    恭喜！你成为了一名初级癌症统计学家。作为一个思想实验，请尝试想象我们在这项研究中可以绘制的所有可能变化。


    考虑患者997的例子，他入组接受实验性药物A。为了保护他的身份，我们用一个秘密代号来称呼。患者997=Buddy（全世界的Buddy，请原谅我）。


