    with it, perhaps more clearly. We don''t talk about evil heart cells that cause
    heart attacks and heart failure. We don''t talk about evil cells that break or
    clog causing strokes. We don''t talk about evil pancreatic or immune cells that
    cause diabetes, and so on. As far as I can determine, only cancer is consistently
    described in such vivid and passionate ways.


    ![](img/fe481b0f2e190573448211a8d1ff379b_19_0.png)


    For cancer is evil, insidious, cruel, and destructive. Cancer is deceitful and
