    # IX. The Silence of the Worms


    ~~~ if all the matter in the universe except the nematodes were swept away, our
    world would still be dimly recognizable~~~

    nNathan A Cobb (1859-1932)


    One function of these essays is to inform our readers of new and exciting developments
    in science and medicine that may be relevant to understanding and treating cancer
    and other diseases. So I am pleased to inform you about a meeting that took place
    in Brisbane, Australia, on July 13, 2008, which may have altered the course of
    human history.


    The Society of Nematologists held its 5th International Congress!*


    You can register online for the next meeting but space is limited, so hurry.


    Why am I troubling you with making flight and hotel reservations, when you are
    busy trying to cure cancer?


    So begins a story that is so incredible it must be true.


    First, we must remember Rudolphi and celebrate the 200th anniversary of his discovery
    of nematode worms.


    Next, we should praise tropical medicine doctors who throughout the ages have
    battled diseases with exotic and scary names like Dracunculculiasis, Filariasis,
    Loa Loa, Ascariasis, and Trichinosis.


    ![](img/fe481b0f2e190573448211a8d1ff379b_50_0.png)


    The terrible consequences of nematode infestations in humans. These images are
    not for the squeamish or faint of heart.


    * Sorry we missed this meeting. There will be others.'
  - '[PAGE 51]


    In 2008, more than a billion people in the world were infected with various nematode
    parasites. As any medical student will tell you, the graphic images of patients
    with elephantiasis (where a limb or other body part can swell to incredibly disgusting
    proportions) , caused by some of these parasites when they clog up lymphatic channels,
    make one aware of the terrible consequences of infection. And Onchocerciasis is
    a leading cause of preventable blindness in the world to this day.


    Among more than 20,000 known species of nematode worms, many are helpful to mankind
    in that they eat bacteria and other things that cause disease in humans, and help
    regulate the life cycle of this planet.


    But as my friend Nancy in New York would say, "Yeah, so."


    Well how about two out of the last seven Nobel Prizes in Medicine?


    For intrepid scientists more than 30 years ago, and in particular Dr. Sydney Brenner,
    one nematode stands above all others at 1 mm in length and at around 1,000 cells
    soaking wet. Whereas we humans are many trillions of cells in size and more than
    1 mm hopefully.


    ![](img/fe481b0f2e190573448211a8d1ff379b_51_0.png)


    # Superstar worm.


    Its stage name is C. elegans; Caenorhabditis when its mother is mad at it.


    Its claim to eternal scientific fame may rest on its diminutiveness, life cycle
    (7-10 days), and transparency. Not to ignore its capacity to survive frozen or
    (in a morbid sidebar) to survive even the Columbia spaceship disaster!'
  - '[PAGE 52]


    So when Dr. Brenner, Dr. John Sulston, and Dr. Robert Horvitz, were honored in
    Stockholm in 2002, C. elegans should have been at the podium too. And it wouldn''t
    surprise me if they were real close, somewhere in the soil on the Nobel Foundation
    lawn, begging to get in.


    By understanding the regulation of the fate of each life and death, and in a way
    this little naked worm, cancer may someday be treated with highly effective and
    novel drugs.


    ![](img/fe481b0f2e190573448211a8d1ff379b_52_0.png)


    In cloning the genome of this multicellular eukaryotic organism (the first), and
    in mapping the process of cell division and differentiation, and in understanding
    the genetics of this process, those scientists were properly honored. Because,
    their very important observations allow us to understand how all living thing
    function. For the same basic mechanisms that control life and death in this worm
    also work in a similar, but more complex, fashion in humans.


    > Alfred Nobel (1833-1896), inventor of TNT, and Founder of the Nobel Prize. Winners
    in each category about 1.5 million dollars (equally divided if it is shared).


    In further studies of this worm, yet another Nobel Prize was awarded to Dr. Andrew
