    Nowhere was there negative thought, or speculation about the future. Despite some
    of my colleagues'' insistence, we are not gods, nor can we prophesy. We are at
    best God’s instruments. Or as the great 16th century surgeon Ambroise Pare said:
    "I treat the patient, but God heals the patient."


    Let me tell you a secret: Whether anything works at all is a miracle! There are
    great miracles, small miracles, and everything in between, but I''ve been around
    too long to believe in anything else. I understand all the principles of medical
    science, have an excellent academic pedigree, treat people with the best available
    drugs based on the scientific evidence, but whether it works or is not not within
    my sphere of influence, that is the province of the Almighty. And as I''ve said
    many times to seriously ill people over many, many years of medical practice:
    “I know what I''m doing, and the Good Lord knows what He is doing, and He’s running
    the show.


    So a story about potentially unfair and indiscriminate treatment of innocent people
    ends in a way that only God could imagine. A fair question is what is the relevance
    of this story? But, and this is not a stretch, we often treat cancer patients
    in an unfair and indiscriminate way with incredibly toxic poison.


    One could choose many different types, but let''s start with the statement that
    most often the treatment of breast cancer with chemotherapy drugs is ineffective,
    costly, and dangerous. The reason we accept this measure of treatment failure
    is because we have convinced ourselves that we are justified in treating everyone
    to benefit around 5 to 20% of patients. We have also convinced ourselves that
    if perhaps one or two people die from chemotherapy-related complications (per
    thousand), this is statistically acceptable (unless of course, I suspect that
    person is you or someone you).


