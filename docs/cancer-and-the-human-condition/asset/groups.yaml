    ![](img/fe481b0f2e190573448211a8d1ff379b_35_0.png)


    We love our dogs. Each unique in personality and capacity and above all their
    love. Each capable of expressing their love and devotion in ways that touch our
    hearts and souls.


    In Central Park in New York City there is a statue of Balto, a sled dog that helped
    save hundreds of children from possible death during a Diphtheria epidemic in
    Nome, Alaska in 1925.


    There was Marjorie, a dog that sacrificed itself to help Dr. Frederick Banting,
    and his medical student Charles Best, isolate insulin, which is necessary for
    many diabetics to live, and in so doing, in the 1920''s, saved countless thousands
    of lives of patients with Type 1 diabetes; for before then, that diagnosis meant
    certain death.


    There were Belka and Strelka, Russian cosmonaut dogs, who explored outer space
    in Sputnik 5 before any man.


    In 2005 another hero, Tasha, who with only blood samples, allowed scientists to
    complete the genetic sequence of the dog genome (www.genome.gov/175158860) (7).
    As a result, we will be better able to understand the genetics of cancer.


    ![](img/fe481b0f2e190573448211a8d1ff379b_35_1.png)


    ![](img/fe481b0f2e190573448211a8d1ff379b_35_2.png)


    There was Hildegarde, our German Shepherd, who died 3 years ago at the age of
    10, after battling inflammatory breast cancer for 2 years. My heart is still broken,
    for I could not save her despite two surgeries and a trial with tamoxifen. Despite
    her suffering, she was always a great friend.


    What I learned was yet another lesson in sadness and humility. But think of the
    magnificent dignity of these wonderful creatures; of such godly souls! So we endure,
    suffer, and keep trying to penetrate the mysteries of life and death.


    So when I heard about a cancer vaccine recently approved for dogs with malignant
    melanoma, a disease I studied for many years at Sloan Kettering Institute in the
    laboratory of Dr. Lloyd Old, one of the world''s greatest cancer immunologists,
    I was particularly intrigued.


    This vaccine is a most probable success. Created by Dr. Jed Wolchok and his colleagues
    at Memorial Hospital and the Animal Medical Center, it is derived from the DNA
    of melanoma cells that produce an enzyme that is often overproduced and abnormal
    in these tumors called tyrosinease.(8)


    By injecting this DNA into dogs with malignant melanoma that would often kill
    them within weeks, many dogs had their tumors, which had been widespread, disappear
    completely for months or even years. Some were ever cured.


    ![](img/fe481b0f2e190573448211a8d1ff379b_36_0.png)


    Dogs and humans share many cancers, including malignant melanoma. This is a nonpigmented
    (amelanotic) type in a poor little dog''s paw.


    This vaccine has been approved by the US government for use, and could save or
    at least prolong the lives of thousands of our best friends. Other canine cancer
    vaccines are being developed (one estimate is that 4 million dogs get cancer every
    year), and we will learn much about treating human cancer in this way.


    ![](img/fe481b0f2e190573448211a8d1ff379b_37_0.png)


    But the ironic twist to all this is that the DNA injected into these poor animals,
    that helps them fight cancer and live longer, happier lives, is derived from his
    grateful master, man!


    So to celebrate our German Shepherd Honey''s second birthday today, I leave with
