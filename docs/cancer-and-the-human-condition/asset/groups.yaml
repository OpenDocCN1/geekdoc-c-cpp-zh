    # XI. Lewis Thomas’ Shoes


    > ~~Worrying is the most natural and spontaneous of all human functions. It is
    time to acknowledge this, perhaps even to learn to do it better.~~ Lewis Thomas,
    M.D. (1913-1993)


    About 30 years ago I was on my way to curing cancer and in so doing winning a
    couple of Nobel prizes, and achieving world fame, I was also writing the great
    first novel, which would provide immediate recognition and wealth, while I accomplished
    lofty goals related to ending disease, poverty, social injustice, war, and I forget
    what the other thing was.


    ![](img/fe481b0f2e190573448211a8d1ff379b_62_0.png)


    Wingtip shoe design. Both the author’s and Dr. Thomas’ shoe of choice (black preferred).


    Like Einstein, only with better hair.


    ![](img/fe481b0f2e190573448211a8d1ff379b_62_1.png)


    It was a great time to be somewhat overly optimistic about my inherent abilities,
    for I think delusions of grandeur should be the province of youthful dreams to
    make the world a better place.


    ![](img/fe481b0f2e190573448211a8d1ff379b_62_2.png)


    This shoe is larger than many NYC apartments.


    Part of that educational process included the great man’s dress-for-success wardrobe.
    Fortunately, one day while walking to the lab, ready to tease out another mystery
    of creation, I caught a glimpse of Dr. Lewis Thomas, who at the time was Chancellor
    of Memorial Sloan-Kettering Cancer Center (MSKCC), in New York City. He was standing
    outside the Arnold and Marie Schwartz Research Building on 1st Ave and 68th St.
    and was was getting ready to hail a cab. He was dressed in a conservative pinstripe
    suit and was wearing not just any shoes, but wingtip shoes!'
  - '[PAGE 63]


    Now I wear a conservative pinstripe suit and wing-tip shoes.


    But the amazing thing is the coincidence does not end there. For Lewis Thomas
    and I are both MDs, both with lots of boxes of papers, both grew up in Queens,
    both had fathers who were MDs, although my dad was a “Meat Dealer” as the family
    joke goes, as in kosher butcher,* before he became a full-time cab driver. Dr.
    Thomas wrote beautiful books and I wrote....


    Let’s not spoil the story with a few details that are suspect. Instead consider
    that at Princeton University the Lewis Thomas Papers are housed, donated to his
    alma mater the year before his death, in 1993. This collection of stuff includes
    his expense accounts at MSKCC and totals 160 boxes, one of which is oversized.
    I believe my wife and I are approaching that number. The reason I mention expense
    accounts is that I used an expense account... once.


    The one time when we traveled downtown to the meat district. I called the cab
    company (INTABORO) which I was working for (my dad let me drive his cab at night
    so that I could be a struggling artist of sorts), since for some reason my impressions
    of myself did not in any way reflect the world view at that moment in history.
    So while in Graduate School for a PhD in biochemistry (never completed), I drove
    a cab, and not too well at all. But imagine the sense of power and entitlement
    in calling cab and being picked up for a round trip (waiting time), all at the
    expense of MSKCC. Was I not special?


    ![](img/fe481b0f2e190573448211a8d1ff379b_63_0.png)


    For this was a trip to Joseph Siege and Sons to obtain experimental materials
    which would change the course


    > * My Grandpa Charley was a kosher butcher too and I loved visits to his store
    with vivid olfactory, gustatory, and visual memories still present nearly 50 years
    ago.'
  - '[PAGE 64]


    of medical science. For Mr. Siege was selling me about one hundred cow eyes. Not
    to mention the chicken heads I had obtained at a nearby kosher butcher shop (no
    cab-- walked), or the black molly fish obtained at a local pet store, nor the
    frogs my colleague Edward Natoli had shipped in from Long Island, which created
    quite a stir in the subway when they started to rouse from their cold induced
    slumber in the subway car, as Ed was not nearly as important as me* and so he
    had to take public transportation.


    The end result of these Zoological New York style safaris was that we were able
    to demonstrate that: 1) A monoclonal antibody (CR24) against a molecule called
    GD3 ganglioside reacted


    ![](img/fe481b0f2e190573448211a8d1ff379b_64_0.png)


    Fish, man, and frog all share GD3 ganglioside as a common molecule.


    with melanoma cells and many other cell types, but it seemed to react with melanoma
    in a much more vigorous fashion. 2) Human antibodies from patients with melanoma
    could be sometimes detected that reacted to gangliosides on their own tumor cells,
    which we thought might be important in the way the immune system detects normal
    cancer cells and destroys them.


    I believed that these observations were quite important in helping us develop
    methods to stimulate or promote the development of cancer immunity. As it turns
    out, things are much more complicated than just injecting a mouse monoclonal antibody
    to a tumor ganglioside and curing people, but the preliminary results achieved
    by Dr. Alan Houghton and his


    * My impression, not Ed''s!'
  - '[PAGE 65]


    colleagues while working in the lab of Dr. Lloyd Old, the great cancer immunologist,
    were incredibly encouraging. One of many problems was that over time humans made
    neutralizing antibodies to mouse antibodies, but to see people with metastatic
    melanoma sometimes have nearly all their cancer apparently disappear in a matter
    of weeks was fantastic. And in a special note of irony, I remember test review
    questions for the Medical Oncology boards, which were based at least in part on
    some of my earlier discoveries, I hope I answered them correctly.


    ![](img/fe481b0f2e190573448211a8d1ff379b_65_0.png)


    Now the great Dr. Thomas had many beautiful ideas. His classic, Lives of a Cell:
    Notes of a Biology Watcher (1974), is one of several examples of his unique ability
    to synthesize profound ideas about science and medicine into a poetic form. And
    maybe someday when I grow up, someone will say something nice about my writings.
    But in the meantime let''s tie things together in this essay, before you give
    up on me and run to purchase Dr. Thomas’ books.


    First, as far as I can tell, Dr. Thomas was many things to people, and had an
    extraordinary academic pedigree. But his life’s work was not entirely centered
    on understanding cancer. Nevertheless, he did suggest that the immune system was
    capable of detecting cancer cells and eliminating them through a process called
    immune surveillance. I suspect that one reason he is remotely remembered for this
    theory is his general popularity as a writer and scientist. But the fact is that'
