    # XXV. Phraseotics


    ~~When one door closes, another opens; but we often look so long and so regretfully
    upon the closed door that we do not see the one which has opened for us.~~ Alexander
    Graham Bell (1847-1922)


    I have to admit that I suffer from a condition which I just invented named for
    Alexander Graham Bell*, the man who transformed communications by developing and
    marketing the telephone. The telephone and its subsequent offspring, the cellular
    phone, are communication tools that allow us to speak to each other at pretty
    much anytime and anywhere. When I think about our ability to translate electrical
    impulses into recognizable aural signals which the brain can process and understand,
    it is nothing short of amazing. To do this at distances of thousands of miles,
    without paper cups and string, allowing for irregularities in transmission (“you’re
    cutting out”), encourages me that we may survive and advance as a species.


    As to the definition of this disease: “A condition where words are spoken, but
    not always completely understood.” Please see the theory of Selective Hearing.


    Now the theory of Selective Hearing*, which I just invented, is that, unlike computers,
    the human brain is capable of the most incredibly dumb conclusions, after processing
    the simplest statements.


    ![](img/fe481b0f2e190573448211a8d1ff379b_127_0.png)


    Author’s imaginary conversation between Gandhi and Alexander Graham Bell.


    > * I am not sure what to call it. The eponym “Alexander” disease which I planned
    to use is already taken. This disease is a genetic disease that causes infants
    and children to develop terrible neurological problems of all sorts. This is an
    adult onset form as well. “Alexander Disease,” J Rafael Goroscope, MD, PhD in
    Gene Reviews, National Center for Biotechnology Information (NCBI) website.


    For example, as in the game “telephone,” which I suspect is no longer a popular
    game for teens, start out with a phrase or statement, lets say: “The surgeon got
    it all off, so I’m not sure why I’m seeing an oncologist.” After ten or “phone
    calls,” the message is transformed by some incredibly sophisticated neural network
    into: “The oncologist said I may die.”


    After many thousands of patient encounters, here is one synthetic scenario, or
    as physicians like to say, “clinical vignette."


    A 68-year-old man with recently resected stage IIIA colon cancer is seen in initial
    consultation two weeks after surgery. He is a captain of industry, a multimillionaire
    who owns a manufacturing company, with several hundred employees. He is recovering
    well after surgery, with no unusual complaints. His other relevant medical problems
    include coronary artery disease, with a heart attack at age 54, and subsequent
    angioplasty and stent placement at age 62. Other than heart and blood pressure
    medicines (and Viagra), and mild diabetes and arthritis, he takes no other drugs,
    including no vitamins or supplements**.


    In my careful review of the pathology report (which is probably the most important
    thing that I do), the tumor is located in the transverse colon, measuring about
    5 cm in diameter (which is not relevant to staging or prognosis), with the histological
    description typical for this type of malignancy, “a moderately differentiated
    adenocarcinoma, with tumor extending into the muscularis propria of the bowel
    wall, but not through it. All resection margins were clear, with the closest margin
    1 cm (distal margin). A total of 18 mesenteric lymph nodes were identified, of
    which 3 were positive for metastatic disease; formal pathologic staging is therefore
    pT2pN1Mx.”


    > ** Unless specifically stated, all clinical scenarios were modified to protect
    my patients’ privacy.


    Prior to surgery, this mover and shaker, waited about 6 months before seeing his
    internist, and reporting occasional bloody stools (he was hoping it was just hemorrhoids),
    but within a week, all the necessary tests (CT scan, colonoscopy with biopsy,
    preop lab tests including CEA and CA19-9, cardiology consult) were completed.


