    # XII. Can an Aspirin a Day Keep Cancer Away?


    ~~To do nothing is sometimes a good remedy.~~

    Hippocrates (460BC-377BC)


    Aspirin (acetylsalicylic acid) and similar substances have been known about for
    at least 2500 years! Hippocrates the great Greek physician (whose oath is still
    recited at medical school graduations) described the properties of a concoction
    derived from the bark of the willow tree which helped people with fevers and other
    medical conditions.


    ![](img/fe481b0f2e190573448211a8d1ff379b_68_0.png)


    The Latin word for willow is salix, hence the name coined by scientists at the
    Bayer pharmaceutical company who synthesized this substance in 1899. And just
    in case you were thinking that anything from the bark of a tree is useless in
    treating cancer, I remind you that the chemotherapy drug Taxol was isolated from
    the bark of the Pacific yew tree.


    ![](img/fe481b0f2e190573448211a8d1ff379b_68_1.png)


