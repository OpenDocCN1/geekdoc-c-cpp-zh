    ## IV. The Chronicle of Death


    > ~~There are three kinds of lies: lies, damned lies, and statistics.~~

    Benjamin Disraeli (1804-1881)


    The American Cancer Society has published its annual report on global cancer.
    This report can be accessed online for interested readers (www.cancer.org) by
    looking under cancer facts and figures.


    The number of new cancer diagnoses worldwide is more than 12 million.* This number
    excludes common skin cancers (squamous cell or basal cell) which excludes a number
    in the millions by themselves!


    ![](img/fe481b0f2e190573448211a8d1ff379b_29_0.png)


    ![](img/fe481b0f2e190573448211a8d1ff379b_29_1.png)


    It seems incredible that cancer registries do not even include these types of
    cancers, which number in the millions, in their data collection.


    What these staggering numbers truly represent is the topic of this essay, and
    the perfect opportunity to talk briefly about cancer statistics. When scientists
    talk about the incidence of cancer they are generally referring to the number
    of new cases discovered over a period of time (i.e. per year). The prevalence
    refers to cases that have already been identified and are still alive. Therefore
    the prevalence of cancer is a much higher number than the incidence as people
    can live with cancer for many years.


    When physicians talk to patients with cancer, they often discuss their prognosis.
    This is typically translated in layman’s terms into how long they are expected
    to live. Different quotes may be heard and, beyond being scientifically invalid,
    are sometimes incredibly mean-spirited and idiotic, such as, “My doctor told me
    I have 3 months to live with no treatment and 6 months with treatment.” These
    statements strike terror and fear into the hearts of patients and their families.
    And they are false. The prognosis for any particular person with cancer is entirely
    unknown except to God Almighty. If He speaks to someone with cancer, that’s a
    different story. If your doctor tells you you have X number of months to live,
    take what is said with considerable skepticism.


    What we can talk about in scientific terms is how long a population can be expected
    to live or not. In other words individual survival can never be accurately predicted,
    but if you took 1,000 people with a similar tumor, stage, age and other health
    problems, their survival could be predicted. I assure you, within that population
    some individuals will live way beyond our expectations (statistically) and other
    people will unfortunately die much sooner than expected.


    ![](img/fe481b0f2e190573448211a8d1ff379b_30_0.png)


    An impossible expectation fueled by irrational reasoning.


    Despite spending trillions of dollars over many decades, the world can expect
    cancer statistics to remain fairly constant over time.


    Political and social institutions will continue to encourage us to decrease our
    risk of cancer by not smoking, eating better, seeing your doctor, exercising,
    and such, but I predict the numbers will not change dramatically. In fact, we
    should expect the cancer prevalence rate to increase over time, with better treatments.


    As you continue reading this book, the reasons for all of this will become clearer,
    just be patient.


