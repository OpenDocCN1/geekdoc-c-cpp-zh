  - '[PAGE 137]


    # XXVII. The Importance of Being Important

    ~~"Illusion is the first of all pleasures."~~~ Oscar Wilde (1854-1900)


    Look in the mirror, then return to your reading.

    What did you see?

    Did you see yourself? Did you see your soul?


    ![](img/fe481b0f2e190573448211a8d1ff379b_137_0.png)


    What do you see?


    When I look in the mirror, I see a middle-aged guy, with thinning hair (and I''m
    being generous), with lines and wrinkles and puffy eyes and imperfections everywhere;
    the products of age and abuse.


    In other words, I''m looking good!

    I''m fabulous! I''m megahot! I''m the bomb!


    Back to you. You are not beautiful, elegant; the perfect lady? (For women)


    Or handsome, debonair, refined;

    the perfect gentleman? (For men)


    I think you are fabulous because you are reading my book. In fact, I''m sure of
    it.


    So it''s agreed then, you''re great.

    And since it''s all about you, let''s find out why you are so important to the
    world.

    On second thought, let''s expand our range of your kingdom, to the universe. If
    there are multiple universes, you''re on your own.


    You''re perfect! Everything is wonderful!


    ![](img/fe481b0f2e190573448211a8d1ff379b_137_1.png)


    There are all sorts of people, but I''ve never met someone who didn''t want to
    be important. Which does not in any way imply that if we are meek or humble, we
    cannot be'
  - '[PAGE 138]


    important too. It''s just more difficult a state of being to achieve. For instance,
    in 1997, two examples of important, yet dissimilar, people made the news when
    they died: Mother Teresa and Princess Diana.


    ![](img/fe481b0f2e190573448211a8d1ff379b_138_0.png)


    Mother Teresa was a modern Saint. She won the Nobel Peace prize, for a life of
    extraordinary service to the poorest and most destitute people in the world, the
    lowest caste members of Indian society, considered by some to be human garbage.
    The smell of the poor and sick is by itself a difficult thing to endure. Add to
    that disease, infections, wasting, purulent secretions, and you have a scene out
    of Dante''s Inferno. Now imagine not only taking care of these suffering creatures
    and not leaving to go home to a comfortable house and well-stocked pantry. Imagine
    living with them for fifty years, eating what they eat, sleeping on the floor,
    suffering with the poor in every imaginable way.


    For the love of Jesus she did these things. For in her way of living, she was
    trying to come closer to God. Closer to Him, meant closer to spiritual perfection,
    which was her way of expressing His love for the world.


    Two things she said had never left me: "Do small things with great love" and "We
    are not here to be successful, we are here to be faithful."'
  - '[PAGE 139]


    Even this wonderful woman was impatient and rigid at times. These sensual sins
    were notwithstanding, what she achieved, in this horrible world, ever tested by
    the demons of doubt, was the one thing that consumed her: Being God’s loyal servant.


    ![](img/fe481b0f2e190573448211a8d1ff379b_139_0.png)


    Now to another important person, Princess Diana. One might consider her an icon
    for secular humanism. She was a beautiful Princess with an ability to communicate
    on a spiritual level with millions of people, who were touched by her persona.
    She led an effort to clean up mine fields so kids wouldn’t be blown up, and led
    many other humanitarian efforts to make the world a better place. I think there


    Princess Diana engaging in one of many charitable works. was also something missing
    in her life that made her beloved by many, a certain insecurity, and vulnerability,
    which helped people feel closer to her, and appreciate her.


    But what about you and me? How can we possibly compete with eminent figures, to
    become important like them?


    The answer is that we don’t have to do anything extraordinary to be important,
    we just think we do.


    All you need to do is your best! If you consider how simple that is, you won’t
    be so concerned about your place in the Universe. From a distance of a zillion
    light years, with all of eternity to work on us, to shape and reshape us like
    a potter, God will probably cut us some slack. For when He created the world and
    universe, He never said it was super, great, fantastic, or most excellent. The
    best He could offer us as a “grade” was good and very good! Now if the Creator
    of the Universe can live with very good, why can’t we?


    From the earliest time, Biblically speaking, it’s always about failure and triumph
    (the order is intentional). Call it what you want, as soon as man and woman wanted
    too much,'
  - '[PAGE 140]


    as in Original Sin, as my Christian brethren believe, things

    have been interesting. As in the clever Chinese curse, “May you

    have an interesting life.” In my way of thinking, God set Adam

    and Eve up, for the “fall”, and theologians should call it “Origi-

    al Blaming.” For, in a free-for-all of He said, he said, she said,

    every (except for the Serpent), passed on the blame. And it

    was exit stage left, this way to the egress, for Adam and Eve and

    their Garden party. And things have never been the same.


    ![](img/fe481b0f2e190573448211a8d1ff379b_140_0.png)


    A William Blake image of Satan with Adam and Eve.

    Wait ‘til God finds out!


    But in so doing, God added to the complexity of being

    human, and free will may be one of His greatest gifts. Perhaps

    the freedom to do our best is the most important element to

    being important!


    So knock yourself out, with acts of kindness, and love,

    in the smallest of ways, and maybe someday people will be

    writing about you!'
  - '[PAGE 141]


