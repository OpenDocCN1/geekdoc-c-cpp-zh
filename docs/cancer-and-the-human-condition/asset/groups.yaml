    by the laws of probability, are cancer cells.


    These cancer cells can do nothing or something. If they are properly recognized
    by the immune system, assuming it is functioning normally, they will be destroyed.
    Or they may, more often than not, die on their own in a process called apoptosis,
    which is all part of nature''s design. Or they may simply remain where they are
    for many, many years, in a kind of suspended animation, waiting to wake up by
    some other stimulus, and start to cause problems. In which case they can become
    something. And the something they become can remain quiescent, very often found
    by accident, in an early and still nonaggressive form called in situ disease.
    Or the something they become can really be something, as in invasive cancer, which
    is typically what the layman thinks of when he hears the word "cancer."


    Being bad, cancer cells do demonstrate capacity to destroy us. Or kill us. Which
    is I suppose rarely a good thing. Although if you''re 116 years old in a nursing
    home, bed-ridden, blind, deaf, sick, worn out by life, death from cancer might
    be considered a good thing, as long as the pain and suffering that might be part
    of the disease process is controlled. So the perception of cancer as always a
    terrible disease must be balanced by a certain realism about the human organism.
    Unlike taxes which may be avoided if you''re incredibly rich, death (and feel
    free to choose the manner) is inevitable.


    The Star Wars theme in the eternal struggle between good cells and evil cells.


    Which reminds me of an old Yiddish saying: "If the poor could die for the rich,
    they would make a good living."


    ![](img/fe481b0f2e190573448211a8d1ff379b_18_0.png)


