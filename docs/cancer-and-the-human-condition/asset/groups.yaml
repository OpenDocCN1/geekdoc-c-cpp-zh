    no clear evidence of lymph node involvement or spread to other sites, such as
    the liver. Despite smoking from age 20 to 50, a CT of the chest was not included
    in the preop radiological studies (the lung bases were mentioned as being clear
    on the CT report). All chemists (including liver function tests and LDH-- dehydrogenase)
    and CBC (complete blood count) were normal. Tumor markers (including PSA, ordered
    by me) were either normal or just slightly above normal (CEA was 4.0, which in
    nonsmokers was abnormal, with 2.5 considered the upper limit of normal, and the
    other markers were within the range of normal).


    So how does the statement: The surgeon said he got it all, why am I seeing an
    oncologist?” become: "He said I may die.\”


    Let’s dissect these statements from the patient’s perspective or cancer gestalt:


    - 1) He got it all: Translation: All the cancer was removed, so I’m not sure.

    - 2) Why am I seeing an oncologist?: Translation: He said I may die.


