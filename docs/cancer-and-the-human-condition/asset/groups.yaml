    Three months later, the obituary described "her brave fight against cancer."


    How are we to interpret these events? First


    In a conversation not too long ago with my mentor Dr. Lloyd Old at Sloan-Kettering
    Institute, he shared with me his observations about the laetrile controversy which
    created such a tremendous amount of anger between patient groups supporting its
    use, and scientists and physicians against it. He suggested to have both sides
    meet for a free exchange of thoughts, and of course this never happened, despite
    it being the most logical approach.


    This reminded me of an earlier conversation with Dr. Old (who, as you know from
    previous essays, I consider the world''s leading cancer biologist and founder
    of modern cancer immunology) in which he quoted the brilliant logician and philosopher
    Alfred North Whitehead: "It is more important for an idea to be interesting, than
    it is to be true."


    ![](img/fe481b0f2e190573448211a8d1ff379b_96_0.png)


    So now, the title of this essay will be defined, "Microtruth": An extremely miniscule
    truth encased and shrouded in falsehood.


    Laetrile kills cancer cells, and sometimes it seems to help people who use it
    in attacking their cancer. The microtruth of laetrile is that it is no better
    than the most amazing, and controversial, alternative therapy ever invented: the
    "placebo." For the placebo is the mysterious drug that shouldn''t help anyone
    feel better or control the symptoms of any disease, and yet in countless studies,
    by reputable investigators, it does just that. Sometimes it works better than
    the drug supposed to be more effective, sometimes less so, but we always assume
    as scientists and physicians that a placebo is a useless treatment. But this is
    also a microtruth, because we ignore the fact that for admittedly mysterious reasons,
    it does help some people with cancer and other diseases, and whether this placebo-effect
    is a consequence of neuroimmunology, spontaneous regression (which might have
    occurred anyway), or an act of Almighty God, it doesn''t matter as long as people
    get better.


    The problem with laetrile, shark cartilage and mistletoe, is that as Julius Caesar
    said: "People believe what they want to believe."


    The placebo is still a powerful and perhaps now underutilized "medicine".


    So when reports of the ability of these drugs to influence immune function or
    inhibit angiogenesis are published (19, 20), desperate patients will do desperate
    things. For the issue is really not what works by whatever mechanism we believe
    is relevant, but what works best, with the least toxicity. At the risk of a heret
    thought, one approach (although it is considered by many to be unethical) would
    be to give patients a placebo, claiming it is a substance that might help them.
    Rather than summarily dismissing this silly idea, consider what physicians were
    doing for thousands of years, before effective therapies for any disease existed!


    For the microtruth in the use of conventional chemotherapy in oncology is that
    it has consistently achieved a meaningful benefit in patients with advanced cancer.
    And if that statement were true, the use of unconventional, ineffective and toxic
    drugs like Vitamin B17, Nevastat, and Iscador would never occur.


