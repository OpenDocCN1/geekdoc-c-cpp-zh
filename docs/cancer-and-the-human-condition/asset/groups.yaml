    # XXII. For Whom the Bell Curve Tolls


    ~~Every man''s life ends the same way. It is only the details of how he lived
    and how he died that distinguish one man from another.~~

    Ernest Hemingway (1899-1961)


    We are all dots on the bell curve of life.


    If you know about geometry, algebra, differential equations, probability theory*,
    and calculus, please read this with caution and pity. I really don''t remember
    any “higher” mathematics, having forgotten nearly all of it. But, I know enough
    about the bell curve (or any other distribution of data points in a curve-like
    graph) to write this essay.


    ![](img/fe481b0f2e190573448211a8d1ff379b_116_0.png)


    We are all dots on the bell curve of life.


    When we talk about response rates for cancer patients, as I''ve mentioned before,
    we are talking about the measurement of something. In a typical study, drug A
    may shrink a tumor by more than 50%, for at least one month, in let''s say 30%
    of people with a particular type of cancer. If we consider this simple example,
    we would conclude that the response rate for drug A (a major response based on
    more than 50% of the tumor disappearing), is 30%, so if we treat 1,000 people
    with cancer, 300 will be expected to have a major response, assuming a similar
    age, performance status, stage of disease, and other comorbidities.


    Now we can plot these responses on a graph, which will start to look like a bell
    curve, after we''re done with this exercise.


    * As mentioned earlier, the genius of Bla Pascal was not restricted to my earlier
    descriptions of his famous “wager.” He was also the creator of probability theory.'
  - '[PAGE 117]


    Each person among the 1,000 becomes a dot (or data point) on the graph of responses
    to drug A.


    Now, let''s add to the complexity, by including the other 700 people (dots), who
    represent the majority of other responses (or lack thereof). Let''s say, another
    300 patients have a minor response where their tumor shrinks in size by less than
    50% but more than 25%. Add them to the curve. Now let''s say another 300 patients
    have a reduction in size of their tumor, somewhere between less than 25% and not
    at all. This is typically called stable disease. Add them to the curve. And let''s
    say another 100 (now the total is 1,000), have their tumor continue to grow in
    size by more than 25% while being treated (anything less than 25% growth is still
    considered stable disease by convention), then that is called disease progression.
    And add them too.


    What about the people with major responses? Some may even see their tumor completely
    disappear, which we call a complete response. Or other responses of a similar
    magnitude (90% shrinkage for example), called near-complete responses. And so
    on ad infinitum (or nearly so).


    Congratulations! You are a budding cancer statistician. And as a thought experiment,
    try to imagine all the possible variations we could graph in this study.


    Consider the example of patient 997, enrolled to receive experimental drug A.
    Let''s call him by a secret code word to protect his identity. How about patient
    997=Buddy (all Buddy''s of the world, please forgive me).


    Buddy receives drug A for 3 weeks, with the fourth week off to rest from the toxic
    effects of drug A (we can graph that too). He has a CT scan before treatment,
    and at one month, read by a radiologist, who measures the size of the tumor before
    and after treatment. The radiologist calculates the size of the tumor (the one
    he is comparing, and not any other tumors that may also be present), which was
    2.0 cm (a little less than an inch) in greatest dimension, has now decreased in
    size to 1.1 cm.'
  - '[PAGE 118]


    So Buddy returns to the clinic and sees the oncologist to discuss his test results.
    Buddy is a nervous guy to begin with, so when the oncologist walks into the exam
    room, Buddy is standing, having read everything, and pacing back and forth, waiting
    at least ten minutes, with tremendous trepidation, and


    ![](img/fe481b0f2e190573448211a8d1ff379b_118_0.png)


    ![](img/fe481b0f2e190573448211a8d1ff379b_118_1.png)


    ![](img/fe481b0f2e190573448211a8d1ff379b_118_2.png)


    Beautiful examples of radiologic responses to therapy (in this case an experimental
    monoclonal antibody). But this is only part of the story.


    Buddy says: "Hi Doc, What about the scan?"


    Now if you were the oncologist what would you say?*

    a) "Before I tell you the results of your CT scan, I need to ask you some questions,
    as part of the clinical trial, and then examine you, and then we''ll talk about
    the CT scan results."


    > * In a new book by the prolific Christian author, Walter Wanger, Jr., "Letters
    From The Land of Cancer", he uses the term "chemical oncologists" to distinguish
    them from the "radiation oncologists", to describe the medical oncologists treating
    him for advanced lung cancer.'
  - '[PAGE 119]


    b) "What scan results?"

    c) "Buddy, be cool."

    d) "The scan shows a minor response to drug A."

    e) "The scan shows nearly a major response to drug A."

    f) "Not bad, Buddy, not bad at all."

    g) "Pretty good, Buddy, pretty good."

    h) "Sit down."

    i) "Buddy, how are you feeling, are you feeling lucky today?"


    BeyondBeyond a point on the bell curve (or whatever curve) of response rates,
    we have accomplished anything real or tangible? For the cancer may have decreased
    in size any way by other mechanisms. Or the cancer may have decreased in size,
    but the remaining cells, (of which may be so-called cancer stem cells) (33), may
    be intrinsically resistant to drug A, and they have already spread to other, as
    yet undetected sites. If Buddy is experiencing unacceptable toxicity from drug
    A, despite a potentially meaningful response, and must be removed from the study,
    as part of the protocol. Or he feels great and is ecstatic over the CT results....


    ![](img/fe481b0f2e190573448211a8d1ff379b_119_0.png)


    6 months

    Sometimes stable disease is a perfectly desirable outcome.


    Or how about drug A delaying the time to disease progression, but not changing
    the survival rate. An example of this type of outcome was recently reported in
    the news that led to the rejection of Avastin for metastatic breast cancer (34)
    and yes yes men get breast cancer, although I don''t think Buddy would be eligible
    for participation), by an FDA advisory panel by a'
  - '[PAGE 120]


    5-to-4 vote. (I''ll bet it will be approved, with more data, having already been
    approved in Europe).*


    Buddy wants to know one thing: is drug A working? In his way of thinking, which
    is all too common, shrinking the size of the cancer equals drug A working. But,
    this is incorrect reasoning for what Buddy really wants to know, as I suppose
    most of us do, is: “Is drug A going to significantly prolong my life, with a modest
    and manageable toxicity, or not?” And the answer to that question is, of course:
    “I don’t know.”


    For what does it mean when a tumor decreases in size for a period of time? Are
    we really expected to believe that changing the size of a quarter size spot to
    a nickel size spot on a CT scan is a reflection of our capacity to survive for
    long periods of time with advanced cancer?


    I believe that beyond the reductionist’s need to “place that dot,” the answers
    to these important questions will come from scientists and clinicians, of great
    courage and intellectual curiosity, stepping back and reflecting on what we are
    ignoring in these studies. One point (pun intended) to consider, that is rarely
    mentioned or measured, in the bell curve of cancer life, is what role drug A has
    (in perhaps unexpected and even paradoxical ways), in influencing the immune response
    to cancer, which may be the “sleeping tiger” in much of what we observe and attribute
    to other etiologies in cancer research.


    * FDA approval was finally given, despite the advisory panel’s objections.'
