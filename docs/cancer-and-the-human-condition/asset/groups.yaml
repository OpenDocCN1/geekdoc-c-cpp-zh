  - '[PAGE 35]


    ![](img/fe481b0f2e190573448211a8d1ff379b_35_0.png)


    We love our dogs. Each unique in personality and capacity and above all their
    love. Each capable of expressing their love and devotion in ways that touch our
    hearts and souls.


    In Central Park in New York City there is a statue of Balto, a sled dog that helped
    save hundreds of children from possible death during a Diphtheria epidemic in
    Nome, Alaska in 1925.


    There was Marjorie, a dog that sacrificed itself to help Dr. Frederick Banting,
    and his medical student Charles Best, isolate insulin, which is necessary for
    many diabetics to live, and in so doing, in the 1920''s, saved countless thousands
    of lives of patients with Type 1 diabetes; for before then, that diagnosis meant
    certain death.


    There were Belka and Strelka, Russian cosmonaut dogs, who explored outer space
    in Sputnik 5 before any man.


    In 2005 another hero, Tasha, who with only blood samples, allowed scientists to
    complete the genetic sequence of the dog genome (www.genome.gov/175158860) (7).
    As a result, we will be better able to understand the genetics of cancer.


    ![](img/fe481b0f2e190573448211a8d1ff379b_35_1.png)


    ![](img/fe481b0f2e190573448211a8d1ff379b_35_2.png)'
  - '[PAGE 36]


    There was Hildegarde, our German Shepherd, who died 3 years ago at the age of
    10, after battling inflammatory breast cancer for 2 years. My heart is still broken,
    for I could not save her despite two surgeries and a trial with tamoxifen. Despite
    her suffering, she was always a great friend.


    What I learned was yet another lesson in sadness and humility. But think of the
    magnificent dignity of these wonderful creatures; of such godly souls! So we endure,
    suffer, and keep trying to penetrate the mysteries of life and death.


    So when I heard about a cancer vaccine recently approved for dogs with malignant
    melanoma, a disease I studied for many years at Sloan Kettering Institute in the
    laboratory of Dr. Lloyd Old, one of the world''s greatest cancer immunologists,
    I was particularly intrigued.


    This vaccine is a most probable success. Created by Dr. Jed Wolchok and his colleagues
    at Memorial Hospital and the Animal Medical Center, it is derived from the DNA
    of melanoma cells that produce an enzyme that is often overproduced and abnormal
    in these tumors called tyrosinease.(8)


    By injecting this DNA into dogs with malignant melanoma that would often kill
    them within weeks, many dogs had their tumors, which had been widespread, disappear
    completely for months or even years. Some were ever cured.


    ![](img/fe481b0f2e190573448211a8d1ff379b_36_0.png)


    Dogs and humans share many cancers, including malignant melanoma. This is a nonpigmented
    (amelanotic) type in a poor little dog''s paw.


    This vaccine has been approved by the US government for use, and could save or
    at least prolong the lives of thousands of our best friends. Other canine cancer
    vaccines are being developed (one estimate is that 4 million dogs get cancer every
    year), and we will learn much about treating human cancer in this way.'
  - '[PAGE 37]


    ![](img/fe481b0f2e190573448211a8d1ff379b_37_0.png)


    But the ironic twist to all this is that the DNA injected into these poor animals,
    that helps them fight cancer and live longer, happier lives, is derived from his
    grateful master, man!


    So to celebrate our German Shepherd Honey''s second birthday today, I leave with
    a poem, nearly forgotten, written more than 400 years ago, by Sir John Davies:


    Daniel Boone & his dog.


    Thou sayest thou art as weary as a dog.

    As angry, sick, and hungry as a dog.

    As dull and melancholy as a dog.

    As lazy, sleepy, idle as a dog.


    But why dost thou compare thee to a dog?

    In that for which all men despise a dog.

    I will compare thee better to a dog.


    Thou art as fair and comely as a dog.

    Thou art as true and honest as a dog.

    Thou art as kind and liberal as a dog.

    Thou art as wise and valiant as a dog.'
  - '[PAGE 38]


    # VII. The Broken Clock


    > ~~The trouble with our times is that the future is not what it used to be.~~~

    Paul Valery (1871-1945)


    ![](img/fe481b0f2e190573448211a8d1ff379b_38_0.png)


    ![](img/fe481b0f2e190573448211a8d1ff379b_38_1.png)


    sundial may not be accurate on a cloudy day.


    Difficult to rewind.


    With the discoveries made by Albert Einstein, we know that time is relative. The
    way we experience time is to some extent subjective (assuming we are not traveling
    near the speed of light), so for instance, when you are being nagged by your spouse,
    or at a boring lecture, or reading something that seems like it''s endless and
    going nowhere, or waiting in traffic, or waiting in line, or...


    ![](img/fe481b0f2e190573448211a8d1ff379b_38_2.png)


    ![](img/fe481b0f2e190573448211a8d1ff379b_38_3.png)


    Candle Clock: Attachments included.


    Elephant Clock: May not be suitable for apartment dwellers.'
  - '[PAGE 39]


    Or watching a beautiful sunset, or dreaming of the most beautiful girl in the
    world (or boy)... Or reading this essay!


    So sometimes a minute seems like an hour and some-times an hour seems like a minute.


    And sometimes something, or someone belongs to an earlier time, and so we call
    this an anachronism. There is even a Society for Creative Anachronism, with 30,000
    members throughout the world who pretend to be personalities in the Middle Ages
    and Renaissance, and they (as I discovered) will wrap your holiday book purchases
    at Barnes & Noble book-store, in Madison, Wisconsin!*


    ![](img/fe481b0f2e190573448211a8d1ff379b_39_0.png)


    When not at court or in combat, Nobles may be found wrapping holiday books for
    the commoner.


    ![](img/fe481b0f2e190573448211a8d1ff379b_39_1.png)


    Before you give up on the relevance of this discussion (for after all shouldn''t
    we be talking about cancer and blood diseases, or at least medical research?),
    consider the Sweet Clover plant.


    * I''ve seen them, costumes and all, in the Gulfport, MS, Barnes & Noble, too!*'
  - '[PAGE 40]


    ![](img/fe481b0f2e190573448211a8d1ff379b_40_0.png)


    Ruminant''s delight!


    Is a moldy 4-leaf clover still lucky?


    Delicious when fresh.


    Cows in Wisconsin (The Dairy State) eat plants. The Sweet Clover sometimes becomes
    moldy. Cows in general don''t care about a little mold and eat anyway. But when
    they eat too much they get sick, and bleed from their nose and mouth spontaneously
    and sometimes even die from massive hemorrhage. This was something that, of course,
    upset farmers, who told veterinary doctors, who talked to chemists, who eventually
    isolated a compound in 1940 from this moldy plant.


    The chemist, Dr. Link, and his student were on the faculty of the University of
    Wisconsin, Madison. So they called this substance warfarin (Wisconsin Alumni Research
    Foundation...arin). Most people call it Coumarin now, but it''s the same chemical.
    As the story goes, after a US Navy sailor in 1950 tried to overdose (by ingesting
    rat poison) (and lived) someone thought of the idea of using rat poison (warfarin)
    in treating people at risk for blood clots and heart attacks.


    ![](img/fe481b0f2e190573448211a8d1ff379b_40_1.png)


    Who would imagine that Coumarin was derived from a moldy plant?'
  - '[PAGE 41]


    Another substance isolated from pig and cow intestines and other tissue is called
    heparin, and it was first discovered in 1916 by Dr. McLean and his student at
    Johns Hopkins University. Heparin is a complex sugar molecule called a glycosaminoglycan
    which also has had tremendous utility in treating people or at risk for blood
    clots and has also saved the lives of countless cancer patients through the years,
    as cancer often increases the risk of blood clots which can often migrate to the
    lung, an often fatal complication called a pulmonary embolus.


    ![](img/fe481b0f2e190573448211a8d1ff379b_41_0.png)


    Heparin is now usually derived from pig intestines.*


    But what does this have to do with anachronisms? Well, consider the leech.


    ![](img/fe481b0f2e190573448211a8d1ff379b_41_1.png)


    The yucky leech, source of the powerful anticoagulant hirudin, shown in combination
    with thrombin, a molecule that when uninhibited, promotes blood clots.


    > * Most heparin worldwide is initially derived from Chinese manufacturers. Lack
    of FDA oversight at these foreign plants has recently led to a number of deaths
    from contaminated preparations. A congressional investigation is underway at the
    time of this writing. Ref: FDA website news update 4/21/08.'
