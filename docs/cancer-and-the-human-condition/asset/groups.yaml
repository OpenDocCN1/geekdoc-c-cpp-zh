    thought, one approach (although it is considered by many to be unethical) would
    be to give patients a placebo, claiming it is a substance that might help them.
    Rather than summarily dismissing this silly idea, consider what physicians were
    doing for thousands of years, before effective therapies for any disease existed!


    For the microtruth in the use of conventional chemotherapy in oncology is that
    it has consistently achieved a meaningful benefit in patients with advanced cancer.
    And if that statement were true, the use of unconventional, ineffective and toxic
