    ~~不要忘记招待陌生客，因为他们可能无意间招待了天使。~~ 希伯来书 13:2


    出于情感、装饰或其他原因收集的一系列零杂小物品被称为杂件（bric-a-brac）。时间的推移使人们积累这些物品，它们对所有者具有非常特定的价值，唤起（希望）美好的记忆。因此我们试图将这些物品陈放在架子和柜子里，以保持与过去的联系。例如：“你的祖母继承了这个天使雕像，它已经流传了几百年。”


