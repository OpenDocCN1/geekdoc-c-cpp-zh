    （光源是可用的），去寻找一个该死的灯泡。以此类推。如果家里没有光，那么算法就会改变，现在我们必须考虑可怕的保险丝盒箱、电线布线、停电和其他灾难性事件。


    ![](img/fe481b0f2e190573448211a8d1ff379b_102_0.png)


    # 当灯不亮时，这会帮到我们！


    我不需要了解电子、阻抗、欧姆定律、泡利不相容原理、海森堡不确定原理、薛定谔波方程，或者任何事物是如何运作的。自旋、振动、角动量、速度和电荷对我现在毫无意义。我在大学学习这些深奥的学科时，我曾以为可以将它们成为我知识生活的一部分，并帮助我理解如何在医学工作中以某种方式或形式应用它们。但是，忘掉吧！


    我记得大学里的是：弹珠机（维度是我最喜欢的，即使只有一个弱的拨子），这让我通过考试而不是上无聊的课程。其他成就：在快餐店工作（我可以和女孩调情）；加载铅块并将它们移动到另一个地方；在生物化学实验室洗玻璃器；在湖边钓鱼……我挂科了结构化学（我无法推导出薛定谔波方程），但我喜欢那些弯曲的线条。


    化学教授在批改我的卷子后：“请看我。”（其他同学写着：“做得好。保持你的高标准。”）“克夫（停顿效果），你考虑过化学以外的其他专业吗？”


    我只是想去医学院。


    所以现在我提出了一个想法，如果足够完善且可以测试，将被视为一个理论。而且那不会是我做的！


    公式1：时间 + 有毒化学物质（癌源）+ 病毒 + 基因不稳定 = 癌症。


    公式2：时间 + 癌症 = 更多癌症。


    公式3：时间 + 免疫 = 较少癌症。


    公式4：致命疾病的癌症概率 = 公式1 + 2 + 3。


    公式5：公式1 + 2 + 3 + 4 全部由量子肿瘤学的定律决定。


    定义：量子肿瘤学 - 基于量子力学原理的癌症发展研究。


    我们本质上都是原子，应该遵守物理定律。但问题是，量子物理的数学方程不足以描述像基因和蛋白质这样复杂的结构（我们最终由蛋白质、脂质、核酸、细胞、结构、器官……组成的原子）。足够聪明这一点现在可能会让我担心那些细节，比如，“方程如何平衡，”其他的学术评论。


    当人们患癌时，让我们用肺为例，为什么一个患者右肺的原发肿瘤扩散到了几个（肺门）淋巴结、肋骨、右骨盆以及左叶的一个点？而另一个患者有右肺肿瘤（组织学、大小和位置相似），位于（纵隔）淋巴结、肝脏三个点（右侧两个，左侧一个）以及大脑叶的一个孤立点？我可以展示数千这样的临床案例。


    所以为什么癌症发生在一个地方而不是另一个？为什么它在晚期或转移性疾病中扩散到不同的地方而不是其他地方？这可能只是“土壤与种子”的问题，这是一个已经存在了100多年的理论。而且无法通过局部或区域免疫的失败来轻易解释（我曾相信这一点）。


    ![](img/fe481b0f2e190573448211a8d1ff379b_104_0.png)


    ![](img/fe481b0f2e190573448211a8d1ff379b_104_1.png)


    ![](img/fe481b0f2e190573448211a8d1ff379b_104_2.png)


    ![](img/fe481b0f2e190573448211a8d1ff379b_104_3.png)


    在大多数情况下，除了概率考虑之外，对于癌症为何发生在一个位置而不是另一个并没有充分的解释。公式中概述癌症发生的原因仅仅是随机事件的发生，无法被绝对预测，因为同样的物理原理使得我们无法准确预测构成我们的任何原子或亚原子粒子的位置，它们是以蛋白质、脂质、核酸、细胞、结构、器官的形式存在的


    ![](img/fe481b0f2e190573448211a8d1ff379b_105)


    所以，我们为什么应该期望确切知道癌症从哪里开始、到哪里去呢？当我们甚至无法确定一个电子在哪里（我们能做的是描述它的云状分布），以及数以亿计的其他电子让我打开家里的灯并写这篇文章时。命运在转动，它最终去向何方，没有人知道！


    ![](img/fe481b0f2e190573448211a8d1ff379b_105_1.png)


    命运与轮盘。


    # XX. 裸体生物学家


    随你意愿，这个世界是一个虚构，由矛盾组成。威廉·布莱克（1757-1827）人类处境的荒谬性（我们某种程度上是囚犯）能通过一个改变历史进程的西海岸嬉士的故事来解释吗？我怀疑，但还是试一下吧。


    ![](img/fe481b0f2e190573448211a8d1ff379b_106_0.png)


    在创造的深处，在地狱的裂缝中，喷出以各种化合物形式释放的甲烷气和硫磺，这些通过被称为“黑烟囱”的热液喷口释放。这些地质事件发生在地球表面数千英尺之下，以热液喷口的形式存在，管虫依靠地下岩浆在极端温度和压力喷发产生的嗜热细菌中生存。而在那里，被吃掉的是……（此处原文逻辑错乱，未翻译完整意译）

