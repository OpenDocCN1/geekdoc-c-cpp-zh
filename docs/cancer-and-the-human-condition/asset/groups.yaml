    Well guess what? Cod liver oil is a great source of Vitamin D and Vitamin A. Vitamins
    as a class of chemicals act typically as coenzymes in biochemical reactions critical
    for life. With specific attention to Vitamin D, its deficiency in childhood causes
    rickets, and in adults, [it causes] osteoporosis.


