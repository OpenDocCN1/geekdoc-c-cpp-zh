    # Biography


    Clifford S. Pukel, MD is a physician who specializes in hematology and oncology.
    He is a graduate of the University of Miami School of Medicine, completed his
    internal medicine residency at the University of West Virginia/Charleston Area
    Medical Center, and subspecialty fellowship at Dartmouth Hitchcock Medical Center.


    Prior to his career as a clinician, he was a scientist at Memorial Sloan Kettering
    Cancer Center working in various areas of research studying cancer cells and the
    immune response to this disease. His achievements have been recognized, and he
    has been elected to: Who''s Who in the World, America, Science and Engineering,
    and Medicine and Health Care. He is presently an Assistant Professor of Clinical
    Medicine at the University of Wisconsin School of Medicine.


    After 35 years of both basic research and clinical medicine, this represents his
    first book. Hopefully his wealth of experience and unique perspective towards
    the problem of cancer, will lead to other books. He has also created a corporation,
    the Cancer Immunotherapy Institute, LLC (cancerimmunst@aol.com) designed to disseminate
    his ideas and provide funds for the development of new and innovative ways to
    safely and effectively treat people with cancer.'
