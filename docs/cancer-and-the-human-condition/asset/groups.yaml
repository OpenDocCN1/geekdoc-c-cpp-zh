  mdcn: '

    山穴里，一只巨大的熊从觅食归来，发现 Ug 在那里大笑大叫。现在，Ug 成了生命链中一个由罂粟引起的死者。*


    考古学家发现了这个山穴并分析了其中的内容，由于他们非常严谨，发现那里到处都是罂粟籽，事实就是如此。


    但为什么要让你费心这些古代历史呢？


    那么，一个对古柯和吗啡成瘾的讽刺性纽约人又如何？他能教我们关于历史什么？


    ![](img/fe481b0f2e190573448211a8d1ff379b_72_0.png)


    罂粟花、罂粟荚、罂粟籽：上帝的药物。


    首先，人们从未忘记过罂粟，这很讽刺，因为遗忘是使用源自罂粟植物的麻毒药物常见的副作用之一。这些麻毒药物非常擅长刺激被称为阿片受受体的脑受体并控制疼痛感，在适当使用的情况下，它们也有助于促进睡眠和休息状态。从罂粟植物提取的天然植物碱对人类的益处是奇迹性的，医生们已经使用了它们数千年。例如，鸦片含有吗啡和可因，问题就在于此，因为如果你吃了两个带有罂粟籽的贝果包或面包，然后接受毒品检测，当你麻毒药物呈阳性时，你可能需要向当局做大量的解释！


    > * 药物滥用的悲剧今天笼罩着我们，我对于如何减少其破坏性影响没有任何建议。最近有一位大学生因喝了由罂粟籽和荚制的茶而去世。（Newsrecord.org
    2009年10月27日，星期二）


    当然，我们不是在谈论海因，但我们可能会谈论。因为海因只是另一种吗啡衍生物。它由拜耳的化学家在19世纪世纪70 年代创造（是的，拜耳，生产阿司匹林的那个公司），用于多种用途，包括作为儿童止咳剂。它还被认为是不成瘾的，因此吗啡或鸦片成瘾者可以使用它来戒掉其他的。


    在肿瘤学中，在治疗遭受痛苦和严重疾病折磨的患者时，没有比吗啡及相关的阿片衍生物更好的药物了，它们在结构和效力上只有轻微差别。


    芬太尼、羟考酮、OxyContin、可因、海因和甲丙酮在结构上都与吗啡相关。


    所以当睡神摩耳菲斯（Morpheus）赐予我们睡眠和梦想时（这也是词源），我们必须感谢 Ug。


    大医生威廉·奥勒爵士（Sir William Osler*）在00多年前曾说，吗啡是“上帝的药物”。我深信如此。


    我之前提到的那个无礼、药物成瘾的纽约人呢？


    他的名字叫威廉·哈尔斯德（William Halsted），他和奥勒医生改变了20世纪医学的进程。


    在约翰·霍普金斯医学院，他们为医生引入了第一个全新的住院医师计划，并强调临床训练以及研究作为教学医学生的基础。


    ![](img/fe481b0f2e190573448211a8d1ff379b_73_0.png)


    吗啡、海因、可因和甲丙酮：

    大多数麻毒药物在结构上是相关的。


    > * 关于奥勒医生的更多信息，见论文 XIV《恐惧的复活》。


    ## 吗啡


    简易居家治疗


    无痛——持久

    吗啡酒，或固体药物

    药效。针对痛苦、绞痛、大生命要症的快速治疗。

    主要症状

    焦虑、失眠和

    结核；圣詹姆斯协会（PT. JAMES SOCIETY, STN）


    ![](img/fe481b0f2e190573448211a8d1ff379b_74_0.png)


    ![](img/fe481b0f2e190573448211a8d1ff379b_74_1.png)


    禁毒局（DEA）成立之前的麻毒药物早期用途。


    哈尔斯德医生尽管使用麻毒药物和古柯，但他仍是一个外科天才。他抽烟像抽烟囱一样，而且不需要手术刀就能“切开”住院医师（用一个难听的词形容）。


    但在纽约度过职业早期后，作为约翰·霍普金斯的外科教授，他培训了世界上最伟大的外科医生。


    ![](img/fe481b0f2e190573448211a8d1ff379b_74_2.png)

