    ## IV. The Chronicle of Death


    > ~~There are three kinds of lies: lies, damned lies, and statistics.~~

    Benjamin Disraeli (1804-1881)


    The American Cancer Society has published its annual report on global cancer.
    This report can be accessed online for interested readers (www.cancer.org) by
    looking under cancer facts and figures.


    The number of new cancer diagnoses worldwide is more than 12 million.* This number
    excludes common skin cancers (squamous cell or basal cell) which excludes a number
    in the millions by themselves!


    ![](img/fe481b0f2e190573448211a8d1ff379b_29_0.png)


    ![](img/fe481b0f2e190573448211a8d1ff379b_29_1.png)


    It seems incredible that cancer registries do not even include these types of
    cancers, which number in the millions, in their data collection.


    What these staggering numbers truly represent is the topic of this essay, and
    the perfect opportunity to talk briefly about cancer statistics. When scientists
    talk about the incidence of cancer they are generally referring to the number
    of new cases discovered over a period of time (i.e. per year). The prevalence
    refers to cases that have already been identified and are still alive. Therefore
    the prevalence of cancer is a much higher number than the incidence as people
    can live with cancer for many years.


    When physicians talk to patients with cancer, they often discuss their prognosis.
    This is typically translated in layman’s terms into how long they are expected
    to live. Different quotes


