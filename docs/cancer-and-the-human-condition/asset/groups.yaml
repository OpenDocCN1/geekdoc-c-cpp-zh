    to her bones and destroying parts of them.


    As an oncologist who believes in personal freedom and the role of religion in
    the way people deal with disease, I saw the patient over the weekend, with her
    family present, and we talked about the likelihood this was metastatic breast
    cancer, while awaiting the breast biopsy results. I did not say: "You have breast
    cancer." I did not say: "How could you wait so long before you went to the doctor!"
