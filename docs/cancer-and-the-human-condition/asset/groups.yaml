    ## XXIII. 癌症患者如何应对缓解率？


    ~~目前生活中最悲哀的一点是科学积累知识的速度快于社会积累智慧的速度。~~ 伊萨·阿西莫 (1920-1992)


    癌症迷人的特征之一是，人们去医生那里抱怨一些相当轻微的症状，如感到更加疲劳，结果却诊断为广泛性癌症，即转移性癌症。


    在完成通过 CT、PET/CT、MRI 和其他放射学检查以及常规实验室检查等所谓的分期检查后，我见过无数患者体内病情惊人，但几乎没有迹象或症状。请记住，癌症在被发现之前可能已经存在多年。


    所以第一个问题是：人们如何带着相当的疾病负担行走而却不知情？


    第二个问题是：让癌症在一段时间内部分或完全消失有多重要？


    第三个问题是：如果癌症消失了，患者会感觉更好并活得更久吗？


    正如我们之前讨论过的，当肿瘤医生谈论癌症消失时，他们实际上讨论的是所谓的“缓解率”（response rate）。这是指疾病（可以通过某些方法，如 CT 扫描中肿块的大小来测量）缩小到较小尺寸或完全消失的患者百分比。还有实验室测试也以类似的方式测量生化反应。


    放射学完全缓解的精确定义是：可测量的疾病完全消失至少一个月。如果一个月后癌症重新生长，我们不会改变对已达到完全缓解的定义。


    类似地，部分缓解（partial response）表示癌症缩小了 25% 以上。


    无缓解（no response）实际上意味着癌症缩小比例于 25% 或完全没有缩小，尽管在某些情况下人们会听到被称为“轻微缓解”（minor response）。


    为了使问题更加复杂，还可以描述为主要缓解（major response），表示癌症缩小了 50% 以上但未完全消失。


    为了让你彻底头晕，还有混合缓解（mixed responses），即癌症在某些地方缩小，但在其他地方保持不变或增加。


    让我们忽略其他术语，如完全缓解（complete remission）和细胞遗传学缓解（cytogenetic remission），这些术语通常用于描述多性髓瘤、淋巴瘤和白血病等血液疾病。


    ![](img/fe481b0f2e190573448211a8d1ff379b_122_0.png)


    增加我们困惑的是，患者可能出现生化反应，例如 PSA、CEA、CA27.29、CA15-3、CA19-9 下降，但 CT 扫描或其他放射学检查显示没有变化！


    左颈恶性肿瘤患者的 PET/CT 扫描（心脏和大脑通常是高代谢的）。这到底告诉了我们什么？


    随着 PET/CT 等新测试出现，它们测量癌症的代谢活动及其大小和分布，我们有时可以观察到代谢缓解，肿瘤似乎停止了对葡萄糖（或其他底物）的过度利用，但其大小保持不变。


    那么，什么时候缓解不是缓解呢？答案取决于我们到底在讨论什么，部分讨论内容是基于生活质量和延长寿命等概念，而这些可能可能通过具有统计学显著缓解率的癌症治疗并无法得到改善。


    所以提个醒：不要总是将缓解率等同于感觉更好和活得更久！


    > * 包括不同衡量标准的缓解率的精确定义正在不断变化。


    ## XXIV. “大麻狂热”席卷了国家癌症研究所吗？

    ~~“我不吸毒。”~~ 萨尔瓦多·达利 (1904-1989)


    不久前，一位患者告诉我她看了一段新闻片段，描述了大麻在治疗癌症中的可能。我不愿意进一步调查，但几天后，关于《国家癌症研究所杂志》发表的一项研究报告开始出现，描述了某种大麻衍生物的抗癌作用，这种衍生物已（合法地）用于治疗经历化疗副作用（如恶心和呕吐）的患者。


    这种药物被称为 Marinol，它是四氢大麻素（THC）的合成版本，THC 是大麻植物（在我们国家是大麻 *Cannabis sativa*）中的活性化合物之一。


    在告诉你的朋友家人吸毒对治疗转移性癌症有意想不到的益处之前，请继续读。


    Ramer 和 Hinz (35) 的研究使用了体外生长的癌细胞。这些被称为组织细胞。有数百种源自动物和人类癌症的细胞系，它们已经适应了在宿主之外生长，可以对这些细胞系进行生化研究，以确定它们如何受环境改变的影响。其中一种方法是向细胞中添加化学物质并观察发生了什么。当我们谈论体外实验（in
    vitro）对比体内实验（in vivo）时，我们指的就是这个。在体外观察到的任何潜在效应，例如添加化学 X 导致癌细胞死亡，必须


    ![](img/fe481b0f2e190573448211a8d1ff379b_123_0.png)


    在通过体内观察（即在活体中）确认之前，我们才能开始问诸这样的问题：药物 X 是否以任何有意义的方式帮助癌症患者？*


    ![](img/fe481b0f2e190573448211a8d1ff379b_124_0.png)


    给我看那种老式的组织培养。


    在这项研究中，一种化学物质是 THC。THC 在 1964 年了结构表定。THC 会让你致醉。THC 会让你想去冰箱里找零食。


    在你告诉朋友家人吸毒对治疗转移性癌症有意想不到的益处之前，请继续读。


    THC 和从大麻中提取的其他大麻素结合大脑中的受体，影响神经和心理功能，这些受体被称为 CB1。在其他细胞类型中（如免疫系统的脾细胞）发现了 CB2 受体。THC
    还影响其他细胞及其功能，可能是通过与其他受体结合。因此，在用 THC 处理细胞时，Ramer 和 Hinz 显示，在一种使用凝胶基质测量侵袭性的体外实验中，某些细胞系被抑制。这一过程是由细胞产生的另一种分子
    TIMP-1（基质金属蛋白酶抑制剂-1）介导的。基质金属蛋白酶可能是细胞扩散的关键分子，因为它们有助于分解的自然屏障。THC 促进了 TIMP-1 的表达。


    1975 年，《国家癌症研究所杂志》发表了一篇名为《大麻素的抗癌活性》的文章(35)。这项小鼠实验证明，每天给小鼠喂 THC 近两周，可以在体内和体外抑制肺癌生长。其他类型的癌细胞也经过了研究。但除了创造了极其陶醉的小鼠*，结果并不理想。


    * 这些被称为临床前研究。


    ## 快乐的研究人员。小鼠准备好派对了！派对结束了！为什么？


    快进 30 年，我们回到了起点，研究人员正在研究 THC（包括对晚期脑癌患者的临床试验），包括(36) 似乎具有抗癌作用的肺癌，(37) 似乎促进癌症生长的肺癌，(38)
    以及许多其他结果矛盾的癌细胞类型。


    ![](img/fe481b0f2e190573448211a8d1ff379b_125_0.png)


    我的观点是，作为化疗的一种，用 THC 和其他相关分子治疗癌症将会失败。THC 在改变感知方面很奇妙，但在减少癌症侵袭性方面并不理想。至于新闻媒体将我认为平庸的论文当作某种发送……


    > * 人类将大麻作为“娱乐”药物使用及其后果，是一场政治、社会和医学噩梦。


