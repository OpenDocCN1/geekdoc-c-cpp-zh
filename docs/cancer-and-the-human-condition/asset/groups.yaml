    \n我曾通过耳朵听见过你。\n\n但现在，我的眼睛看见你了。\n\n因此我厌恶自己，在尘土和灰烬中悔改。\n\n约伯记42:1-6\n\n![](img/fe481b0f2e190573448211a8d1ff379b_12_0.png)\n\
    \n一张 19 世纪癌症“专家”A. Borrel 博士检查患者的漫画。与其说其他，，螃蟹的符号提醒着人们人类想象力不可思议的创造力。\n\n## 前言\n\
    \n如果你正在读这句话，说明你很聪明！这意味着这本书的标题和封面有足够的吸引力让你打开它，我希望这证明了你有一个极佳的头脑。你可能非常聪明（我希望如此），甚至可能是一个天才，但我可以（在概率范围内）保证你对癌症的了解并不比我多。看看几率吧，世界上有\
