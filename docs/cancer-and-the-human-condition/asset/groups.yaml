    由于神灵的反复无常，他在当时并不知情的情况下杀了自己的父亲并娶了自己的母亲，在发现这一可怕事实后挖出了自己的眼睛，并被他的儿子所杀。这不禁让我思考，回想起来，正确回答谜题或许是他做过最糟糕的事情。


    谜题是：斯芬克斯（舔着嘴等晚餐）：“什么生物在早晨用四条腿走路，中午用两条腿走路，晚上用三条腿走路？”


    俄狄浦斯（此时感觉很不错）：“答案是人，婴儿时爬行，成年后用双脚行走，老年时拄着拐杖。”


    于是斯芬克斯自杀了，而俄狄浦斯可能最受精神分析师们的推崇，他们追随弗洛伊德关于年幼俄狄浦斯综合结的理论，即男孩拒绝并恨父亲，爱着母亲（这通常在他们向父亲要车钥匙和出去约会的钱时结束）。


    现在希腊人的特点在于，他们热爱带有某种信息且能让观众情感泛滥的故事。别提我的故事也能做到这一点，但我可以告诉你，鞘脂只要其结构、位置或数量发生极其细微的变化，就能导致细胞的毁灭或生存。它们普遍存在于最卑微的生物中，而最完美（或不完美）的希腊英雄也是如此，它们的结构和功能可能是解决癌症之谜的一部分。因此，通过进一步的研究（已有成千上万论文发表），这个故事最终可能会以一种美丽且快乐的方式终结。


    ## XI. 刘易斯·托马斯的鞋


    > ~~忧虑是人类功能中最自然、最自发的一种。是时候承认这一点，或许甚至学会更好地这样做了。~~ 刘易斯·托马斯医学博士（1913-1993）


    大约30年前，我正处于治愈癌症的道路上，并在过程中赢得几个诺贝尔奖并名扬全球；同时我正在写第一部伟大的小说，这本将带给我即时的认可和财富，而我正在实现与结束疾病、贫困、社会不公、战争以及我忘记了还有什么的高尚目标。


    ![](img/fe481b0f2e190573448211a8d1ff379b_62_0.png)


    翼头鞋设计。这是作者和托马斯博士的首选鞋款（偏爱黑色）。


    像爱因斯坦一样，只是头发更好。


    ![](img/fe481b0f2e190573448211a8d1ff379b_62_1.png)


    那是一个对我我自身能力稍分过度乐观的好时代，因为我认为宏伟的幻想应该是青少年梦想的领地，以此让世界变得更好。


    ![](img/fe481b0f2e190573448211a8d1ff379b_62_2.png)


    这只鞋比纽约的很多公寓都要大。


    那个教育过程的一部分包括那位伟人的“成功人士”衣橱。幸运的是，有一天，当我走向实验室，准备揭开另一个创世之谜时，我瞥见了刘易斯·托马斯博士，他当时是纽约市纪念碑斯斯洛恩-凯特林癌症中心（MSKCC）的院长。他正站在第一大道第68街的阿诺尔德和玛丽·施瓦茨研究大楼外，准备打辆出租车。他穿着一套保守的条纹西装，穿的不仅是普通的鞋，而是翼头鞋！


    现在，我也穿着保守的条纹西装和翼头鞋。


    但令人惊讶的是，巧合并未止于此。因为刘易斯·托马斯和我都是医生，手里都有很多箱文件，都在皇后区长大，父亲都是医生，尽管我父亲像家里的笑话说的那样，是一个“肉类交易商”（*即洁食食品屠夫*），这在他成为一名全职出租车司机之前。托马斯博士写了优美的书籍，而我写了……


    让我们不要用一些可疑的细节来破坏故事。相反，请考虑在普林斯顿大学收藏了《刘易斯·托马斯论文》，那是在他去世前一年，1993年捐赠给他的母校的。这系列材料包含了他在MSKCC的报销账，总共160箱，其中一箱还是超大的。我相信我和妻子正接近那个数字。我之所以提到报销账是因为我……用过一次报销账。


    那有一次，我们去市中心的肉类市场。我拨给了我工作的出租车公司（INTABORO）电话（我父亲让我晚上开他的车，好让我当某种挣扎的艺术家），因为由于某种原因，我对自己的印象完全没有反映当时历史一刻的世界观。所以，在攻读生物化学博士学位期间（未完成），我开着出租车，而且开得并不好。但想象一下那种叫车并被接送往返（等待时间）的权力感和特权感，这一切都是由MSKCC买单。难道我不特别吗？


    ![](img/fe481b0f2e190573448211a8d1ff379b_63_0.png)


