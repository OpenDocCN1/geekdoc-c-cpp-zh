    # VI. Let Us Now Praise Famous Dogs


    > ~~ If I have any beliefs about immortality, it is that certain dogs I have known
    will go to heaven, and very, very few persons.~~

    James Thurber (1894-1961)


    ![](img/fe481b0f2e190573448211a8d1ff379b_34_0.png)


    The dog has been domesticated for thousands of years and has shared much of recorded
    history with their human masters. This incredible social intimacy continues unabated
    to this day. In fact beyond the love and affection that they provide, they have
    served us in other less apparent ways that deserve our deepest respect.


    No greater love. I remember 35 years ago when I was a student at Memorial Hospital/Sloan
    Kettering Institute, an image that was truly profound. It was a scene that I cannot
    forget, of a hospital gurney with white sheets and attendants that one sees in
    hospitals all the time, but on it was a dog that had been intubated and was being
    wheeled away from and operating room.


    I have no idea what the dog was doing there and whether it was simply an experimental
    animal (which I suspect but cannot confirm) used for whatever purposes that animals
    are used in research.


    ![](img/fe481b0f2e190573448211a8d1ff379b_34_1.png)


    But the dog has always been willing to risk its life for mankind, and it is a
    great truth that these domesticated wolves, with all their wonderful variation
    in form, temperament and function, are “man’s best friend.”


    Seal of the United States Treasury Department, circa 1800.


    My wife and kids have 5 dogs, Lima, Oprah, Annie, Honey, and Bianca.* We also
    have cats and other critters (we’ll talk about cats another time).


    * Poor little Bianca, a Shitzu-Australian Shepherd mix died unexpectedly before
    this book was published. We all miss her terribly.


