    从上苍，送给你们伟大的怀疑主义者马克·吐温的一句名言：“谎言传遍半个地球时，真理正在穿鞋。”


    ![](img/fe481b0f2e190573448211a8d1ff379b_126_0.png)


    作者对《国家癌症研究所杂志》文章评审委员会的构想。


    ![](img/fe481b0f2e190573448211a8d1ff379b_126_1.png)


    20世纪初对大麻提取物的营销。


    # XXV. 词组语义学


    ~~一扇门关闭时，另一扇门就会开启；但我们往往久久地、遗憾地盯着那扇关闭的门看，以至于没有看到为我们开启的那扇。~~ 亚历山大·格拉姆·贝尔 (1847-1922)


    我不得不承认，我患有一种由我刚刚发明的疾病，以亚历山大·格拉姆·贝尔*命名，这位通过开发和营销电话改变了通信领域的人。电话及其后代——手机，是使我们能够在任何时间、任何地点相互交流的通信工具。当我想到我们能够将电脉冲转化为大脑可以处理和理解的可识别听觉信号时，这简直不可思议。在在数千英里的距离上，在没有纸杯和线的情况下，允许传输出现不稳定（“你的声音在断断续续”），这让我相信，我们作为一个物种可能会生存并进步。


    至于这种疾病的定义：“一种文字被说出来，但并不总是被完全理解的状态。”请参见选择性听力理论。


    现在，我刚刚发明的选择性听力理论*是指，与计算机不同，人类大脑在处理最简单的陈述后，能够得出最令人愚蠢的结论。


    ![](img/fe481b0f2e190573448211a8d1ff379b_127_0.png)


    作者构想的甘地与亚历山大·格拉姆·贝尔之间的对话。


    > * 我不确定该称它什么。我计划使用的命名法“亚历山大症”已被占用。这种疾病是一种遗传性疾病，会导致婴儿和儿童产生各种可怕的神经系统问题。这也是一种成人发型。“亚历山大症，”J
    Rafael Goroscope，医学博士、哲学博士，《基因评论》，国家生物技术信息中心 (NCBI) 网站。


    例如，就像“传声筒”游戏一样（我怀疑这已经不是青少年的流行游戏了），从一个短语或陈述开始，比如：“医生把肿瘤都切掉了，所以我不确定我为什么要看肿瘤科医生。”经过十次“电话通话”后，信息被某种极其复杂的神经网络转化成了：“肿瘤科医生说我可能会死。”


    在经历了数千次患者接触后，这里有一个合成情景，或者像医生们常说的，“临床病例”。


    一名68岁的男性，近期因切除了IIIA期结直肠癌，在手术两周后接受了初诊。他是一位行业领袖，一位拥有一家拥有数百名员工的制造公司的万百万富翁。他术后恢复良好，没有异常主诉。他的其他相关健康问题包括冠状动脉疾病，曾在54岁时患过心脏发病，随后在62岁时接受了血管成形术和支架植入。除了心脏血压药物（以及万力乐）以及轻微糖尿病和关节炎外，他不服用任何其他药物，包括任何维生素或**补充剂**。


    在我对病理报告的仔细审查中（这可能是我做的最重要的事情），肿瘤位于横结肠，直径约5厘米（这与分期或预后无关），组织学描述是此类恶性肿瘤的典型特征，“中度分化腺癌，肿瘤延伸至肠壁固有肌层，但未穿透。所有切缘均为干净，最接近的边缘为1厘米。识别出18个肠系淋巴结，其中3个为转移性；因此病理分期为pT2pNMx。”


    > 除非特别说明，所有临床情景都经过了修改以保护患者的隐私。


    手术之前，这位大人物在看内科医生之前等了大约6个月，并报告偶尔血便（他希望只是痔），但在一周内，完成了所有必要的检查（CT扫描、结肠镜检查，包括CEA和CA19-9、心脏会诊）。


    腹部和骨盆的CT扫描显示横结肠有一个肿块，没有淋巴结受累或扩散到其他部位的证据，例如肝脏。尽管从20岁到50岁一直在吸烟，胸部CT未包含在报告中（肺底显示正常）。所有的化指标（包括肝功能测试和LDH）和血细胞计数均为正常。肿瘤标志物（包括PSA）正常或略高于正常（CEA为4.0，在非吸烟者中异常，上限为2.5，其他指标在正常范围内）。


    那么这句话：“医生把肿瘤都切掉了，所以我不确定我为什么要看肿瘤科医生”是如何变成“肿瘤科医生说我可能会死？”


    让我们从患者的角度剖析这些陈述：


    - 1) 医生把肿瘤都切掉了：肿瘤已切除，我不确定。

    - 2) 我不确定我为什么要看肿瘤科医生：肿瘤科医生说我可能会死。

