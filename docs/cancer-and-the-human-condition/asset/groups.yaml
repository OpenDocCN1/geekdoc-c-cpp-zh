    ## XVI. The Other Peyton


    ~~Science arose from poetry - when times change the two can meet on a higher level
    as friends.~~ Johann Wolfgang von Goethe (1749-1832)


    ![](img/fe481b0f2e190573448211a8d1ff379b_89_0.png)


    With the NFL playoffs upon us as of this writing, everyone who follows this great
    game knows who Peyton is.


    Peyton Manning is a future Hall of Fame quarterback for the Indianapolis Colts.
    For those readers who are less familiar with the game, he led his team to a Super
    Bowl victory in 2007 and just lost to the New Orleans Saints in 2010.*


    Peyton Manning: Super Bowl winner in 2007. His brother, Eli, won for the NY Giants
    in 2008.


    To win a Super Bowl is a very difficult thing to do, and among millions of young
    athletes in this country it is considered a dream come true for athletic excellence.


    And what about the nerds of the world?


    And here lies the story of the other Peyton.


    ![](img/fe481b0f2e190573448211a8d1ff379b_89_1.png)


    First, let us consider the nerd. The nerd is a term that somehow evolved into
    someone who is extremely bright intellectually and has an intense focus on some
    pursuit such as computers, or science. He or she is typically a bookworm with
    few social skills. But did you know, among my nerd audience, that the word "nerd"
    was invented by Dr. Seuss? And it had no meaning when first used by him in a children''s
    book in 1950?


    Theodore Seuss Geisel, a.k.a. Dr. Seuss.


    * Homonymous irony: Peyton lost to Peyton this year as in the winning coach Sean
    Peyton.


    Or that Dr. Seuss (Theodor Seuss Geisel) was a Dartmouth College graduate? Or
    that he entered Oxford University for a PhD but never completed his doctorate?


    Well among nerds, the one prize above all others to aspire to is the Nobel Prize,
    which in 1966 was won by two men who shared equally in the cash payout (now around
    1.5 million dollars). Charles Huggins won for the importance of hormones in cancer
    and we''ll talk more about him another time. And the other winner was Peyton Rous.


    ![](img/fe481b0f2e190573448211a8d1ff379b_90_0.png)


    Peyton Rous, MD. We are lucky we didn''t like being a Texas cowpoke more!


    Peyton Rous was a meaner. He was a native Texan who decided that being a cowboy
    was perhaps not the best use of his prodigious intellect, although he did participate
    (as a nerd would say) in a cattle drive as a young man.


    ![](img/fe481b0f2e190573448211a8d1ff379b_90_1.png)


    Dr. Rous chose to round up chickens and rabbits instead of cattle.


    He eventually ended up at the Rockefeller Institute in New York, after graduating
    from Johns Hopkins Medical School. And he spent his entire scientific career there,
    mostly in the presence of chickens and rabbits.


    What he discovered about 100 years ago is so important that it has changed the
    course of medicine in a way that could


    > * His father was disappointed that he didn''t get his doctorate, hence the nom
    de plume.


    be compared to the discovery of electricity. In other words, a huge way!


    He discovered that viruses can cause cancer!


    Working with chickens in 1911, he published a paper that described the transmission
    of a type of cancer called sarcoma which could be separated from the tumor cells
    and passed through the finest filters. (17)


    ![](img/fe481b0f2e190573448211a8d1ff379b_91_0.png)


    He also studied rabbit tumors called papillomas which were also caused by viruses
    and in fact these papillomas are similar to papillomas that can occur in humans
    who are caused by the human papilloma virus (HPV) which can promote the development
    of cervical and other cancers. And now there are cancer vaccines, (Gerdasil and
    Cervarix) approved for preventing HPV infection from ever occurring!


    Lasso that chicken!


    But I am getting ahead of myself in my “nerdsome” zeal.


    As is typical of great discoveries, in 1911 the “experts” laughed at Peyton Rous.
    And for 15 years or so they continued to laugh at his silly work with critters.
    But then they stopped laughing.


    ![](img/fe481b0f2e190573448211a8d1ff379b_91_1.png)


    Finally in 1966 the ultimate nerd was honored by his peers with the Nobel Prize.
    This prize was created by another nerd, Alfred Nobel, who might not want to laugh
    at laugh since he invented TNT.


    An incredible photo of a wild rabbit infected with a papilloma virus similar to
    HPV. The weird growth by its mouth is a virally-induced tumor!


    So when they talk about the Nobel Prize Ceremony being a “blast” they ain''t kidding
    as they say in Texas.


    And as my Texas friend Billy Bob says: “We’ll be...”


    ![](img/fe481b0f2e190573448211a8d1ff379b_92_0.png)


    ![](img/fe481b0f2e190573448211a8d1ff379b_92_1.png)


