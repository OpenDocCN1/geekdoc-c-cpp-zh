    ## XII. 每天一片阿司林可以预防癌症吗？


    ~~无所事事有时是一种良方。~~

    希波克拉底（公元前460年-377年）


    阿司林（乙酰水杨酸）和类似物质已为人知至少2500年了！伟大的希腊医生希波克拉底（他的誓言仍会在医学院毕业典礼上被朗诵）描述了从柳树皮中提取的制剂特性，这种制剂有助于发热和其他医疗状况的人。


    ![](img/fe481b0f2e190573448211a8d1ff379b_68_0.png)


    柳树的拉丁语词是 salix，因此拜耳制药公司的科学家在1899年合成这种物质时创造了这个名字。以防你认为树皮提取的任何东西对治疗癌症都是没用的，我提醒你，化疗药物紫杉杉醇（Taxol）是从太平洋红杉的树皮中提取的。


    ![](img/fe481b0f2e190573448211a8d1ff379b_68_1.png)


    许多科学研究已经发表，表明阿司林可以降低多种癌症的风险。这种效应既取决于剂量也取决于时间。最典型的的例子（16）显示，当人们每天服用大约一次阿司林（标准强度325
    mg）时，结直肠癌的风险显著降低*


    > * 由于手稿处于准备的最后阶段，Holmes等人名为“Hot Off The Press”的研究显示，定期服用阿司林可降低乳癌生存者的复发率和死亡率。


    > "J. Clin Oncol 2010; DOI: 10.1200/JDCO.2009:22.7918"


    希波克拉底：伟大的希腊医生及其誓言，“首先，不不伤害。”


    ![](img/fe481b0f2e190573448211a8d1ff379b_69_0.png)


    ![](img/fe481b0f2e190573448211a8d1ff379b_69_1.png)


    柳树：阿司林的原始来源。


    红杉树紫杉醇的“采收”。


    尽管生物化学机制仍在研究中，但我们知道在过度表达特定酶 COX-2（加氧酶）的肿瘤中，阿司林降低了结直肠癌的风险，但在研究人群中，直到定期使用约5年或以上才观察到明显的统计学益处。三分二的肿瘤过度表达COX-2，因此在三分之一的人中，使用阿司林似乎没有收益。这可能也适用于其他癌症，如胃、食道、乳腺和肺，尽管数据尚不成熟或缺乏服力。


