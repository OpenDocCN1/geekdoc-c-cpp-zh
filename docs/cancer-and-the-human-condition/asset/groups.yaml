    through the whimsy of the gods, unknown to him at the time, killed his father
    and married his mother, plucked out his eyes upon this terrible discovery and
    was killed by his sons. Which makes me wonder whether, in retrospect, answering
    the riddle correctly may have been the worst thing he ever did.


    The riddle: Sphinx (licking her chops for it’s suppertime): “Which creature in
    the morning goes on four feet, at noon upon two, and in the evening upon three?”


    Oedipus (feeling pretty good at this time): “The answer is man, who crawls as
    a baby, walks on two feet as an adult, and uses a cane in old age.”


    So the Sphinx destroyed herself, and Oedipus is perhaps best remembered by psychoanalysts
    who follow Freud’s theory of an Oedipus complex in young boys, who reject and
    hate their fathers and love their mothers (which typically ends when they ask
    dad for the car keys and money to go out on a date).


    Now the thing about the Greeks, is they loved a story with a message that overwhelmed
    the audience with emotion. Forget about my story doing that, but I can tell you
    sphingolipids, with ever so slight changes in their structure, location, or number,
    can lead to cellular destruction, or life. Ubiquitously present in the lowliest
    creatures who the most perfect (or imperfect) Greek hero, their structure and
    functions may be part of the solution to solving the riddle of cancer. So that
    with further study (thousands of papers having already been published), this story
    may ultimately end in a beautiful and joyful way.


