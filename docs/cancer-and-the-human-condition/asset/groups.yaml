    千年来，医生一直使用水蛭为患者放血。直到2008年，他们仍在某些病例的整形手术中继续使用它们！


    因为水蛭产生一种名为水蛭素（hirudin）的抗凝血剂，它存在于这些生物的唾液中。几年前，它被批准用于具有血栓风险的患者。它是一种基因工程生产的水蛭唾液版本，即水蛭蛋白（lepirudin），对于无法耐受肝素类物质或华法林（Coumadin）的人很有用。此外还有许多其他抗凝血分子处于不同的开发阶段，很快就会面世。


    我们过时的清单包含了一种治疗血色沉积症（hemochromatosis）和真性红细胞增多症（Polycythemia vera，Osler-Vaquez病）的方法。


    现在这些疾病可以通过简单的血液测试来识别，检测与每种疾病相关的基因突变。这是高科技，事实上，关于真性红细胞增多症（P. vera）的性研究直到2005年才发表（9,
    10）。


    ![](img/fe481b0f2e190573448211a8d1ff379b_42_0.png)


    所以对于P. Vera，我们现在知道，在这种类型的骨髓增殖性疾病（与骨髓中红细胞过度产生有关，红细胞释放到血液中）中，大多数病例是由JAK2（Janus激）基因的异常突变引起的，这种突变产生了一种异常蛋白。


    雅努斯（Janus）——一种酶命名的罗马神。


    雅努斯是罗马门窗之神，拥有两张脸，分子生物学家仍然记得他。但对我们来说，这还不够过时，也没有把这篇文章的主题联系起来。


    因为从因和亚伯以来，血液的流出（或移除）对人类历史产生了深远的影响。


    中世纪的手术和放血工具，以及根据疾病从不同部位抽血的、易于遵循的说明。哎哟！


    除了水蛭和放血刀，许多工具曾被用于从人体放血。现在的医学术语是治疗性放血（therapeutic phlebotomy）。但这种“治疗”的结果几乎是一致灾难性的，因为由于错误的原因抽取大量血液导致了人的死亡和受伤。直到19世纪，人们普遍认为，通过移除血液（四种基本物质“体液”之一，其他是黑胆、黄胆和粘液），医生可以改变导致各种疾病的失衡。甚至性格也被直接归于这些特质或气质；因此：多血的、忧郁的、胆质的和粘液的*。


    乔治·华盛顿，我们美元币上深受爱的总统，实际上是由于喉咙痛被医生抽了几夸脱血而害死的。


    坏钟什么时候是不坏的？


