    may be heard and, beyond being scientifically invalid, are sometimes incredibly
    mean-spirited and idiotic, such as, “My doctor told me I have 3 months to live
    with no treatment and 6 months with treatment.” These statements strike terror
    and fear into the hearts of patients and their families. And they are false. The
    prognosis for any particular person with cancer is entirely unknown except to
    God Almighty. If He speaks to someone with cancer, that’s a different story. If
    your doctor tells you you have X number of months to live, take what is said with
    considerable skepticism.


    What we can talk about in scientific terms is how long a population can be expected
    to live or not. In other words individual survival can never be accurately predicted,
    but if you took 1,000 people with a similar tumor, stage, age and other health
    problems, their survival could be predicted. I assure you, within that population
    some individuals will live way beyond our expectations (statistically) and other
    people will unfortunately die much sooner than expected.


    ![](img/fe481b0f2e190573448211a8d1ff379b_30_0.png)


    An impossible expectation fueled by irrational reasoning.


    Despite spending trillions of dollars over many decades, the world can expect
    cancer statistics to remain fairly constant over time.


    Political and social institutions will continue to encourage us to decrease our
    risk of cancer by not smoking, eating better, seeing your doctor, exercising,
    and such, but I predict the numbers will not change dramatically. In fact, we
    should expect the cancer prevalence rate to increase over time, with better treatments.


