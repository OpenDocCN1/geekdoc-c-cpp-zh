  mdcn: '

    ![](img/fe481b0f2e190573448211a8d1ff379b_35_0.png)


    我们爱我们的狗。它们在性格和能力上都是独一无二的，尤其是它们的爱。每一只狗都能以触动我们心灵和灵魂的方式表达它们的爱与奉献。


    在纽约市中央公园有一尊巴托（Balto）的像，它是一只雪橇犬，在1925年阿拉斯加州诺姆的白喉热流行期间，帮助数百名儿童免于死死。


    还有玛乔丽（Marjorie），这只狗牺牲自己帮助弗雷德里克·班廷（Dr. Frederick Banting）博士和他的医学生查尔斯·贝斯特（Charles
    Best）分离出胰岛素。胰岛素对于许多糖尿病患者的生存至关重要，它在20世纪20年代拯救了数以万计的一型糖尿病患者的生命；在那之前，这种诊断意味着必死。


    还有贝尔卡（Belka）和斯特雷尔卡（Strelka），它们是俄罗斯宇航员犬，在人类之前乘坐喷球卫星5号（Sputnik 5）探索了太空。


    2005年是另一个英雄塔莎（Tasha），她仅凭血样本就让科学家完成了狗基因组的遗传序列（[www.genome.gov/175158860](）。结果是，我们能够更好地理解癌症的遗传学。


    ![](img/fe481b0f2e190573448211a8d1ff379b_35_1.png)


    ![](img/fe481b0f2e190573448211a8d1ff379b_35_2.png)


    还有希尔德加德（Hildegarde），我们的德国牧犬，它在3年前以10岁的年龄去世，生前与了2年炎性乳腺癌。我的心依然破碎，尽管经过了两次手术并尝试了他莫芬治疗，我没能救它。尽管它遭受了痛苦，它一直是一个伟大的朋友。


    我学到的是另一课关于悲伤与谦卑的课。但想想这些奇妙生物伟大的尊严；想想这些神圣的灵魂！因此我们忍受、痛苦，并继续努力破解生死的奥秘。


    所以，当我最近听到一种新批准用于恶性黑色素瘤犬的癌症疫苗时——这种疾病我曾在斯洛恩-凯特琳林学院（Sloan Kettering Institute）的洛伊德·奥（Dr.
    Lloyd Old）博士实验室研究过多年，他是世界上最伟大的癌症免疫学家之一——我对此特别感兴趣。


    这种疫苗极有可能成功。它由杰德·沃尔乔克（Dr. Jed Wolchok）博士及其同事在纪念医院和动物医学中心开发，它源自黑色素瘤细胞的DNA，这些细胞产生一种在这些肿瘤中往往过度产生且异常的酶——酪氨酸氧化酶（tyrosinease）。


    通过将这种DNA注入患有恶性黑色素瘤的狗体内（这种疾病通常会在几周内杀死它们），许多狗原本扩散的肿瘤完全消失，持续了几个月甚至几年。有些甚至被彻底治愈了。


    ![](img/fe481b0f2e190573448211a8d1ff379b_36_0.png)


    狗和人类共有许多癌症，包括恶性黑色素瘤。这是可怜小狗爪上的一个非色素（无黑色素）类型。


    这种疫苗已获得美国政府批准使用，可以拯救或至少延长我们数千好朋友的生命。其他的犬癌症疫苗正在开发中（估计每年有400万只狗患癌），我们将通过这种方式学到更多治疗人类癌症的知识。


    ![](img/fe481b0f2e190573448211a8d1ff379b_37_0.png)


    但这一切中最讽刺的转折是，注入这些可怜动物体内、帮助它们对抗癌症并活得更长、更快乐的DNA，竟然源自它们感激的主人——人类！


    所以为了庆祝我们的德国牧犬哈尼（Honey）今天二生日，我留下一首几乎被遗忘的诗，那是400多年前由约翰·戴维斯士（Sir John Davies）写的：


    丹尼尔·布恩与他的狗。


    你说你像狗一样疲惫。

    像狗一样愤怒、生病和饥饿。

    像狗一样迟钝和忧郁。

    像狗一样懒惰、嗜睡、无所事事。


    但你为什么要把自己比作狗呢？

    在所有人都鄙视狗的方面。

    我会把你比作狗更美好。


    你像狗一样美丽动人。

    你像狗一样真诚诚实。

    你像狗一样善良慷慨。

    你像狗一样智慧且勇敢。


    ## VII. 坏掉的钟


    > ~~我们时代的问题在于，未来已不再过去。~~

    保罗·瓦勒里（Paul Valery, 1871-1945）


    ![](img/fe481b0f2e190573448211a8d1ff379b_38_0.png)


    ![](img/fe481b0f2e190573448211a8d1ff379b_38_1.png)


    日晙阴天可能不准确。


    很难倒拨。


    随着阿尔伯特·爱因斯坦的发现，我们知道时间是相对的。我们体验时间的方式在某种程度上是主观（假设我们没有以接近光速旅行），例如，当你被配偶唠时，或者在一个无聊的讲座上，或者在读某些看起来像……的东西


    ![](img/fe481b0f2e190573448211a8d1ff379b_38_2.png)


    日晷阴天可能不准确。


    很难倒拨。


    随着阿尔伯特·爱因斯坦的发现，我们知道时间是相对的。我们体验时间的方式在某种程度上是主观（假设我们没有以接近光速旅行），例如，当你被配偶唠时，或者在一个无聊的讲座上，或者在读某些看起来像……的东西


