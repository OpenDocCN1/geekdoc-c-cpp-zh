    Equation 2: Time + cancer = more cancer.


    Equation 3: Time + cancer + immunity = less cancer.


    Equation 4: Probability of cancer as a life-threatening disease = Equation 1 +
    2 + 3.


    Equation 5: Equations 1 + 2 + 3 + 4 are all determined by the laws of Quantum
    Oncology.


    Definition: Quantum Oncology - The study of cancer development based on the principles
    of quantum mechanics.


    We are all basically atoms, which should obey the laws of physics. But the problem
    is the mathematical equations of quantum physics are inadequate to describe complicated
    atomic structures like genes and proteins. Not being smart enough to understand
    them in the first place may now work to my advantage! For it frees me from worrying
    about the details, like, “Why don''t the equations balance,” and other nerdy comments.


    When people get cancer, let''s use lung as an example, why is it that there may
    be a primary tumor in the right lung in one patient, which has spread to a few
    local (hilar) lymph nodes, and a rib, right pelvis, and one spot in the left lobe
    of the liver? And in another patient with a right lung tumor (similar histology
    and primary size and location), which is in regional (mediastinal) lymph nodes,
    three spots in the liver (two on right, one on left), and a solitary spot in the
    right lobe of the brain? And I could present a thousand examples or clinical vignettes
    of this.'
  - '[PAGE 104]


    So why does cancer start in one place and not the other? Why does it spread in
    cases of advanced or metastatic disease, to different places and not other places?
    It is probably not just a case of "soil and seed," which is a theory that’s been
    around for more than 100 years. Nor, can things be easily explained by the failure
    of local or regional immunity (which I used to believe).


    ![](img/fe481b0f2e190573448211a8d1ff379b_104_0.png)


    ![](img/fe481b0f2e190573448211a8d1ff379b_104_1.png)


    ![](img/fe481b0f2e190573448211a8d1ff379b_104_2.png)


    ![](img/fe481b0f2e190573448211a8d1ff379b_104_3.png)


    For the most part, there are no adequate explanations for why cancer occurs in
    one location and not another, beyond probabilistic considerations.


    The reasons for cancer development as outlined in the equations are simply that
    random events occur that cannot be predicted with absolute certainty due to the
    same physical principles that make it impossible to accurately predict the location
    of an electron or any other atomic or subatomic particle from which we are ultimately
    composed of, in the form of proteins, lipids, nucleic acids, organelles, cells,
    structures, organs, creatures....'
  - '[PAGE 105]


    ![](img/fe481b0f2e190573448211a8d1ff379b_105_0.png)


    Taenidae Lung epithelium


    # Transcendental cellular complexity.


    So why should we expect to know precisely where cancer will start, and go to,
    when we can''t figure out where an electron is (the best we can do is describe
    its cloud-like distribution), which along with a gazillion other electrons, allowed
    me to turn on the light in my house and write this essay.


    For the wheel of cancer fortune turns, and where it ends up, nobody knows!


    ![](img/fe481b0f2e190573448211a8d1ff379b_105_1.png)


    Fortune and her wheel.'
  - '[PAGE 106]


    # XX. The Nude Molecular Biologist

    ~~Do what you will, this world''s a fiction and is made up of contradiction.~~

    William Blake (1757-1827)


    Can the absurdity of the human condition, of which we are prisoners of sorts,
    be explained by a story about a west coast hippie who changed the course of social
    history?


    I doubted it, but let''s try anyway.


    ![](img/fe481b0f2e190573448211a8d1ff379b_106_0.png)


    From out of the depths of creation, within the cracks of Hell are spewed methane
    gas and brimstone in the form of various sulfur compounds that are released in
    hydro-thermal vents called black smokers. These geological events occur thousands
    of feet below the earth''s ocean surface, in the form


    A hydrothermal vent where tubeworms live off of thermophilic bacteria in the "cracks
    of hell."


    of underground eruptions of magma at incredible temperature and pressure. And
    there we of course find some life form that has evolved to survive and thrive,
    which is eaten by other things and so on.


    But how can a man, justly accused of a crime such as murder and incarcerated for
    25 years, find hope in these observations?


    And how can a cancer patient breathe a sigh of relief from a test that was indirectly
    created by some fantastic bacteria that can live at the edge of the abyss?


    And how can an LSD-tripping molecular biologist be part of this puzzle?


    And what does this have to do with Ulysses S. Grant, our 18th president, and Theodore
    Roosevelt, our 26th president?'
  - '[PAGE 107]


    Or a Jewish physician/scientist/

    Polish emigre/VA employee who discovered endogenous retroviruses, which led to
    discovery of the HIV virus?


    Let''s begin at the beginning of time when ancient bacteria called extremophiles
    figured out a way of living under “extreme” conditions. Under tons of pressure
    and heat, they are happy and capable of using methane and sulfur compounds to
    provide their energy requirements in a process called chemosynthesis, and other
    things they eat, such as the Pompeii worm (great name).


    ![](img/fe481b0f2e190573448211a8d1ff379b_107_0.png)


    In studying these bacteria, which are also called thermophiles (heat lovers),
    in hydrothermal vents and in other places with similar geologic activity such
    as the hot springs of Yellowstone National Park, scientists about 35 years ago
    found that various enzymes that the bacteria produced functioned best at temperatures
    that could fry an


    ![](img/fe481b0f2e190573448211a8d1ff379b_107_1.png)


    egg. Yellowstone National Park was first dedicated in 1872 by President Grant
    and then President T. Roosevelt had the vision to create the National Parks Service
    around 1900, to further protect this treasured land where scientific discoveries
    could be made in a pristine setting.'
  - '[PAGE 108]


    So the nude molecular biologist could have his (perhaps) LSD-influenced vision.


    For Kary Mullis in 1983, (in 1998 the author of the autobiography: “Dancing Naked
    in the Mind Field") inadvertently figured out a way to save the unjustly accused
    and imprisoned, among other things.


    He realized that he could exploit other scientist''s discoveries of heat-loving
    enzymes such as the DNA polymerase isolated from Thermus aquaticus, in creating
    a method called PCR or the polymerase chain reaction. There are now about 20 variations
    of this reaction which use high heat in the steps to create amplified copies of
    DNA or sometimes RNA.


    ![](img/fe481b0f2e190573448211a8d1ff379b_108_0.png)


    Kary Mullis, Ph.D. His discovery of PCR has changed the way criminal evidence
    is analyzed and sometimes freed the innocent.


    +   1. Denaturation

    2. Annealing

    3. Extension

    4. ...

    5. ...

    6. ...

    Exponential growth of short product


    ![](img/fe481b0f2e190573448211a8d1ff379b_108_1.png)


    PCR (polymerase chain reaction) will continue to have a profound impact on future
    scientific discoveries in cancer research.


    Not only did Dr. Mullis win the Nobel Prize in Chemistry in 1993, but his method
    (PCR) and the Thermus aquaticus polymerase were honored by the journal Science
    Magazine in 1989, in its inaugural award: “Molecule of the Year!”'
- md: '

    Without realizing all the implications of his brilliant invention, Dr. Mullis
    has helped to free hundreds of prisoners who were justly accused of terrible crimes
    such as rape and murder. By testing minute amounts of blood or semen, scientists
    can use PCR as a forensic tool, to see if the DNA matches the accused or not.*


    Another PCR test is called RT-PCR. The RT stands for reverse transcriptase, which
    is an enzyme found in RNA viruses that infect people and animals and cause sorts
    of diseases including cancer, leukemia, and AIDS. The discovery of this enzyme
    changed what was called the paradigm of molecular biology and led to Nobel Prizes
    for Howard Temin, David Baltimore, and Renato Dulbeco in 1975.


    These viruses are called retroviruses and the man who really understood that viruses
    could cause cancer through natural infection and transmission from parent to offspring
    was a man named Ludwik Gross.


    ![](img/fe481b0f2e190573448211a8d1ff379b_109_0.png)


    Feline leukemia virus is a retrovirus. Now, alluded to before, he escaped Poland
    before the Nazis could kill him for being Jewish and served in the US Army medical
    corps, and he eventually ended up at a Bronx, NY VA hospital where he worked alone
    for years in a one-room lab, studying a mouse leukemia virus, eventually named
    after him.


    And like Peyton, and the terrible reception that he had from his colleagues, Dr.
    Gross when he said in 1954 viruses could cause cancer in mammals or humans.(26)


    The Gross leukemia virus is an RNA virus (retrovirus) that can integrate into
    the cellular genome by activating an enzyme it carries with it (described before)
    called reverse transcriptase and, just like HIV, cause terrible consequences.


    * * This test can also help convict criminals who might otherwise escape the judicial
    system.


    Now there are several drugs like zidovudine, which can control HIV infection by
    inhibiting this reverse transcriptase enzyme, often prolonging patients’ lives
    for many years.


    Dr. Gross and other scientists made an equally profound discovery: Retroviruses,
    millions of years ago, were already part of the DNA of many if not all creatures.


    In other words humans are already part virus!


    To that issue we will return later.


    What about the cancer with melanoma, for instance, who has been told that the
    cancer was completely removed and lymph nodes negative? Does that mean a cure?
    Are there other tests to tell whether the cancer will return?


    For those questions RT-PCR may help us to see who will likely be cured. For it
    can detect a tiny fragment of DNA in the blood (in the form of messenger RNA)
    which is ultimately amplified and copied millions of times by RT-PCR. By isolating
    a speck of RNA from one cell out of 10 million cells, RT-PCR, using the most specific
    and sensitive probes, may someday reassure patients with early-stage melanoma
    that they have been truly cured. Unfortunately not yet, as various research groups
    have reported conflicting results to date, but I believe my prediction will come
    true in years.


    From the depths of Hell to peace of mind, a quote from William Blake, who was
    read by the famous philosopher Aldous Huxley, who wrote of “The Doors of Perception”
    after ingesting LSD, and encouraged other “minds.”


    ## Dr. Hansen

    ### XXI. The Leper

    Forsake me not, O Lord: O my God, be far from me (Psalm 38:21).

    The poor leper.

    The lowly leper.

    The cursed leper.

    Throughout the Bible, the leper is a diseased person who may be healed by the
    High Priests, as seen in Leviticus. I found at least 22 references to lepers in
    the Bible, so it must be an important disease to God. Yet only one of many examples
    actually healed Him (31).


    The fact that leprosy is still a tremendous health problem in the world should
    not surprise us. India and Brazil have the most cases, with millions infected
    with this bacteria (or more specifically mycobacterium, in the same general category
    as tuberculosis). When I was in medical school at the University of Miami, we
    rotated through the dermatology department, and there is actually a leprosy clinic
    at Jackson Memorial Hospital where we treated patients, most of whom were originally
    from South America. I ever knew about leprosy until the movie Papillon! I still
    don''t know much about this disease, nor have I seen a case since, but that doesn''t
    really matter, for you''ll discover truth is stranger than fiction.


    Start with another name for leprosy, Hansen’s disease, an eponym for the Norwegian
    doctor who first isolated the bacillus in 1873. This was early in the history
    of bacteriology, and to identify a causative agent of any sort was huge. But not
    much happened for nearly 70 years, when antibiotics were found to be modestly
    effective in controlling this disease. As antibiotics were developed they were
    tested on patients, and with better treatments, sometimes a side effect was observed.
    This side effect was the result of massive death of mycobacterium in the skin,
    which caused another type reaction called erythema nodosum. This was extremely
    painful and in desperation an Israeli physician named Green found some bottles
    of thalidomide lying around (don''t ask me why), he tried the pills on a patient
    and his condition improved. Then Dr. Green tried it on more people, and they also
    improved. In fact nearly every one with erythema nodosum got better!


    Created by chemists at a small pharmaceutical company in Germany, thalidomide
    was in every other respect a disaster of unspeakable proportions. It was originally
    synthesized in an attempt to create a new type of antibiotic, and in tests it
    had no activity in experimental animals. Since it was well tolerated, and rather
    than throw it out, the scientists convinced themselves that it might be useful
    as a sedative. So they gave free samples to physicians and eventually it was believed
    to be a nontoxic therapy for pregnant women with morning sickness.


    No tests in pregnant animals were done but that didn''t stop clinicians and scientists
    to agree that thalidomide was safe.


    ## Structure of thalidomide and the terrible consequences of its improper use.


    So in treating newly (1st trimester) pregnant women a horrible consequence was
    the eventual delivery of babies with phocomelia, where their limbs were grossly
    malformed, sort of a flipper shape. So-called thalidomide babies were the result
    of a poorly conceived, improperly tested, ineffective and dangerous drug, which
    led to major changes in the way future drugs would be tested and approved. It
    was a terrible learning experience.


    In trying to figure out the mechanism of action of thalidomide as a teratogen,
    scientists found that it inhibited vessel development (angiogenesis) in the developing
    embryo and fetus. In the early 1970s, the theory that tumors needed to create
    their own blood vessels to grow was advocated by Dr. Judah Folkman and his colleagues,
    so the next question was whether thalidomide might be effective in shrinking cancers.


    Before we pursue that question, consider that for nearly 100 years after its discovery,
    one could grow bacterium leprae in culture medium. While all these other events
    were unraveling, many of people were still being infected. Then in 1974 Dr. Eleanor
    Storer reported on the isolation of the leprosy bug and so to a large extent we
    owe much of what we have learned about leprosy from of all creatures, the armadillo,
    which looks to me like an armor plated rat.


