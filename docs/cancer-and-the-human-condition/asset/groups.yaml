    ## XVI. 另一个佩顿


    ~~科学源于诗歌——当时代改变，两者可以在更高的层次上以朋友身份相遇。~~ 约翰·沃尔夫冈·歌德（1749-1832）


    ![](img/fe481b0f2e190573448211a8d1ff379b_89_0.png)


    在写本文时，NFL季后赛已经开始，每个关注这项伟大运动的人都知道佩顿是谁。


    佩顿·曼宁（Peyton Manning）是印第安纳波利小马队未来的名人堂级四卫。对于那些不太熟悉这项运动的读者来说，他曾带领球队在2007年夺得超级碗冠军，并在2010年刚刚输给了新奥尔尔斯圣人队。


    佩顿·曼宁：2007年超级碗冠军。他的兄弟埃利（Eli）在2008年代表纽约巨人队夺得冠军。


    赢得超级碗是一项非常困难的事情，在国家数百万的年轻运动员中，这被认为是体育成就的梦想成真。


    那么，世界上的书呆们又是怎样的呢？


    这就是另一个佩顿的故事。


    ![](img/fe481b0f2e190573448211a8d1ff379b_89_1.png)


    首先，让我们来看看“书呆”（nerd）。“书呆”这个词以某种方式演变成指智力极其聪明，并且对计算机或科学等追求领域高度专注的人。他或她通常是个书呆虫，社交技巧匮。但你知道吗，在我的书呆读者中，“nerd”这个词是由苏斯博士发明的？而且当他1950年第一次在一部儿童书中使用它时，它并没有任何意义？


    西奥多·苏斯·盖塞尔（Theodore Seuss Geisel），又名苏斯博士。


    * 同音词讽刺：今年佩顿输给了另一个佩顿，即那名获胜的教练肖恩·佩顿（Sean Peyton）。


    或者，苏斯博士（西奥多·苏斯·盖塞尔）是达特茅斯学院的毕业生？或者他曾进入牛津大学攻读博士学位，但从未完成毕业？


    嗯，在书呆中，最向往的首要奖是诺贝尔奖。1966年，该奖由两位男性获得，平分奖金（现在约150万美元）。查尔斯·哈金斯（Charles Huggins）因激素在癌症中的重要性而获奖，我们以后会再详谈他。而另一位获奖者是佩顿·劳斯（Peyton
    Rous）。


    ![](img/fe481b0f2e190573448211a8d1ff379b_90_0.png)


    佩顿·劳斯，医学博士。我们很幸没有更喜欢当一个德州牛仔夫了！


    佩顿·劳斯是个狠角色。他是一个德克萨斯州人，决定当牛仔夫可能不是利用他过人天赋的最好方式，尽管他在年轻时确实参加（用书呆的话说）过一次赶牛活动。


    ![](img/fe481b0f2e190573448211a8d1ff379b_90_1.png)


    劳斯博士选择围捕鸡和兔子，而不是牛。


    在从约翰·霍普金斯医学院毕业后，他最终来到了纽约的洛克菲勒学院。他在那里度过了整个科学职业，大部分时间与鸡和兔子为伴。


    他在100年前发现的东西如此重要，以至于它改变了医学进程，其程度可以


    > * 他父亲对他没有获得博士学位感到失望，因此使用了笔名。


    与电相比。换句话说，影响巨大！


    他发现病毒会导致癌症！


    1911年，他在与鸡合作时，发表了一篇论文描述了一种名为肉瘤的癌症传播，这种癌症可以从肿瘤细胞中分离出来并通过最细的过滤器。（17）


    ![](img/fe481b0f2e190573448211a8d1ff379b_91_0.png)


    他还研究了被称为乳头瘤的兔子肿瘤，这些肿瘤也是病毒引起的，事实上，这些乳头瘤与人类乳头瘤病毒（HPV）引起的人颈癌和其他癌症非常相似。现在已经有了预防HPV感染的癌症疫苗（卫瑞妥和西佳彻）！


    套住那只鸡！


    但我在“书呆式”的热情中有些过头了。


    正如伟大发现的常态，1911年，“专家们”嘲笑佩顿·劳斯。在过去的约15年里，他们继续嘲笑他那些对动物的工作。但后来他们停止了。


    ![](img/fe481b0f2e190573448211a8d1ff379b_91_1.png)


    终于在1966年，这位终极书呆获得了同行的授予的诺贝尔奖。这个奖是由另一个书呆——阿尔弗雷·诺贝尔创立的，由于他发明了TNT，他可能不想笑。


    一张感染了类似于HPV的乳头瘤病毒的野兔惊人照片。它嘴边的奇怪生长物是病毒性肿瘤！


    所以，当他们说诺贝尔奖颁奖仪式非常“震撼”（blast）时，他们像德州人说的那样并不是玩笑。


    正如我的德州朋友比尔·鲍布（Billy Bob）所说：“我们将……”


