    suit and was wearing not just any shoes, but wingtip shoes!


    Now I wear a conservative pinstripe suit and wing-tip shoes.


    But the amazing thing is the coincidence does not end there. For Lewis Thomas
    and I are both MDs, both with lots of boxes of papers, both grew up in Queens,
