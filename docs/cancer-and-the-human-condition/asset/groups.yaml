    # I. Cancer and the Human Condition*

    ~~ Selfishness is the greatest curse of the human race~~

    William Gladstone (1809-1898)


    Cancer, like the poor will always be with us.


    When I started studying cancer many years ago, I was young and idealistic, and
    believed that as societies evolved, with altruistic motives and with technological
    advancements poverty could be eliminated from this planet. In a similar fashion,
    and method of reasoning, I thought that cancer could also be eliminated from this
    planet.


    I no longer believe that either of these wonderful ideas will ever be accomplished.


    For there is something wrong with our species, that I think will prevent mankind
