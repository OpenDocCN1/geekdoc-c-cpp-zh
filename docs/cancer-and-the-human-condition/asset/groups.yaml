    在没有意识到他这项伟大发明的所有影响的情况下，穆利斯博士（Dr. Mullis）帮助数百名被被指控犯下强奸和杀人等严重罪行的囚犯。通过检测极量的血液或精液，科学家可以使用
    PCR 作为一种法医学工具，查看 DNA 是否与嫌疑人匹配。


    另一种 PCR 测试称为 RT-PCR。RT 代表逆转录酶，这是一种存在感染人类和动物的 RNA 病毒中的酶，这些病毒会导致包括癌症、白血病和艾滋病在内的各种疾病。这种酶的发现改变了所谓的分子生物学范式，并使霍华德·泰明（Howard
    Temin）、大卫·巴尔特洛（David Baltimore）和雷纳托·杜贝科（Renato Dulbeco）在 1975 年获得了诺贝尔奖。


    这些病毒被称为逆转录病毒，而真正理解病毒可以通过自然感染和亲子传递导致癌症的人是一个名叫卢德维希·格罗斯斯（Ludwik Gross）的人。


    ![](img/fe481b0f2e190573448211a8d1ff379b_109_0.png)


    猫白血病病毒是一种逆转录病毒。如前提到的，他在纳粹因他是犹太人而杀死他之前逃离了波兰，并在美国军医队服役，最终来到纽约布罗克斯的一家退伍军人医院，在那里单间实验室里独自工作多年，研究小鼠白血病病毒，该病毒最终以他的名字命名。


    就像佩顿（Peyton）一样，格罗斯博士在 1954 年说病毒可以引起哺乳动物或人类癌症时，遭到了同事们可怕的冷遇。(26)


    格罗斯白血病病毒是一种 RNA 病毒（逆转录病毒），可以通过激活它携带的一种（前述描述过的）逆转录酶整合到细胞基因组，并像 HIV 一样导致严重的后果。


    * 这种测试还可以帮助定罪那些可能逃脱司法体制的罪犯。


    现在有几种像齐多夫定（zidovudine）之类的药物，它们可以通过抑制这种逆转录酶来控制 HIV 感染，通常可以延长患者多年的寿命。


    格罗斯博士和其他科学家有了一个同样深刻的发现：逆转录病毒在数百万年前已经是许多（如果不是所有）生物 DNA 的一部分。


    换句话说，人类本身就是病毒的一部分！


    关于这个问题，我们稍后会回来。


    例如，黑色素瘤患者呢？如果被告知癌症已完全切除且淋巴结呈阴性，这意味着治愈了吗？是否有其他测试可以告诉癌症是否会复发？


    对于这些问题，RT-PCR 可能帮助我们看到谁可能会被治愈。因为它可以检测血液中微小的 DNA 片段（以信使 RNA 的形式），这些片段最终会被 RT-PCR
    放大并复制数百万次。通过从 100 万个细胞中分离出一个 RNA 斑点，RT-PCR 使用最具特异性和最敏感的探针，有一天可能会让早期黑色素瘤患者确信他们已被真正治愈。遗憾的是目前尚未，因为到为止不同的研究小组报告了相互矛盾的结果，但我相信我的预测将在几年后实现。


    从地狱深处到内心平静，这是威廉·布莱克（William Blake）的一言，被著名的哲学家奥尔德斯·赫胥黎（Aldous Huxley）朗读，赫胥黎在摄入
    LSD 后写下了《感知之门》，并鼓励其他的“心灵”。


