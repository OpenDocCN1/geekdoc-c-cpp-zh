    Archaeologists discover the cave and analyze its contents and, being thorough,
    they find poppy seeds littering the place and there you have it.


    But why trouble you with ancient history?


    Well, how about a sarcastic New Yorker who is addicted to cocaine and morphine?
    What can he teach us about history?


    ![](img/fe481b0f2e190573448211a8d1ff379b_72_0.png)


    Opium flower, opium pods, poppy seeds: God’s own medicine.


    For starters, people have never forgotten the poppy, which is ironic because forgetting
    is one of the most reproducible effects of using narcotics derived from poppy
    plants. These narcotics are wonderful at stimulating brain receptors called opioid
    receptors and controlling the sensation of pain and they are also helpful in promoting
    sleep and a restful state, when used appropriately. The naturally occurring plant
    alkaloids derived from poppy plants are miraculous in their benefits to man and
    have been used by physicians for thousands of years. Opium contains morphine and
    codeine, for example, and there’s the problem, for if you eat two poppy seed-embedded
    bagels or rolls and then are tested for drugs, you could be doing a lot of explaining
    to the authorities when you test positive for narcotics!


    > * The tragedy of drug abuse haunts us today and I offer no suggestions on how
    to reduce its destructive effects. A college student just recently died drinking
    tea made from poppy seeds and pods. (Newsrecord.org Tuesday, Oct 27, 2009)


    Of course we''re not talking about heroin, but we could be. For heroin is just
    another morphine derivative. It was created by Bayer chemists (yes Bayer, as aspirin)
    in the 1870s and used for a variety of purposes including a cough suppressant
    for children. It was also believed to be non-addictive, so morphine or opium addicts
    could take it to get off the other stuff.


    In oncology, in treating patients in pain and suffering from terrible disease,
    there is no better drug than morphine and related opioid derivatives which differ
    only slightly in structure and potency.


    Fentanyl, oxycodone, OxyContin, codeine, heroin, and methadone are all structurally
    related to morphine.


    So when the god Morpheus blesses us with sleep and dreams, hence the derivation,
    we have to Ug thank.


    The great physician Sir William Osler* said more than 100 years ago, morphine
    is “God’s own medicine.” And this I believe.


    What about that rude, drug-addicted New Yorker I mentioned earlier?


    His name was William Halsted, and he and Dr. Osler changed the course of 20th
    century medicine.


    At Johns Hopkins Medical School, they introduced the first residency program new
    for physicians and emphasized clinical training along with research as the basis
    for teaching medical students.


    ![](img/fe481b0f2e190573448211a8d1ff379b_73_0.png)


    Morphine, heroin, codeine, and methadone:

    Most narcotics are structurally related.


