    Before effective vaccines and antibiotics other public health measures, an early
    death from infec-ious diseases was very common.


    What are we to do? For us not despair. The answer is to figure out a way to prevent
    cancer from ever occurring by creat-ing very, very specific vaccines that help
    the good old immune system to do its job more effectively. For the reason this
    is the “Age of Age” is to a large extent a consequence of improved public hygiene
    (less viruses and other bugs), vaccines to prevent or ameliorate infectious diseases
    and very, very specific molecules that kill microorganisms (antibiotics). Seventy
    five years ago people died from common infections, and now they are living much
    longer (statistically), so they can die from something else. Still, that something
    else need not be cancer. Cancer in many respects behaves any other parasitic or
    infectious disease, only in a much more clever and sinister way, but to a large
    ex-tent, I believe the principles are the same.


    So then, how about the “Age of Age” transformed into the “MAGE?” For MAGE is one
    of many molecules that the immune system (with an appropriate adjuvant), can become
    stimulated against attack cancer cells, leading to'
