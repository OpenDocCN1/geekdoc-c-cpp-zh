    # XIX. Quantum Oncology


    > ~~"The key to wisdom is this - constant and frequent questioning... for by doubting
    we are led to question and by questioning we arrive at the truth."

    Peter Abelard (1079-1142)


    Let’s start with an assumption: We know not what we do.


    We turn on the lights and through a series of physico-chemical processes light
    is created, we are able to perceive this, and it is good.


    ![](img/fe481b0f2e190573448211a8d1ff379b_101_0.png)


    This explains everything. There will be a quiz later.


    The universal constant in this activity is do something, and something else happens.
    Now I’m not pretending to be Newton, Maxwell, Faraday, Bohr, or Einstein. I’m
    just pretending to be an oncologist who spends time thinking about why things
    are the way they are, or seem to be. I’m a dreamer, so I like to dream. But the
    Monster.com job website has no positions in that capacity, yet so I’m forced to
    consider other methods of satisfying my curiosity, like being a physician and
    writing this stuff.


    But, maybe Poe was right when he said: "What we see or seem is a dream but within
    a dream."


    Now I don’t want to speculate about the meaning of life when I turn on a light,
    I just want it to work. If it doesn’t, I’m irritated, having absolutely no mechanical
    ability to repair anything. Switch the switch and no light. Now what? First, jiggle
    it a few times. Next, check the light bulb by untwisting it, and shaking it; if
    it is blackened, and the filament makes a kind of ping sound, we are on to something!
    Next, (assuming other'
- md: '

    light sources are available), find a stinkin’ light bulb. And so on. If there
    is no light in the house then the algorithm changes, for now we must consider
    the dreaded fuse box, electrical wiring, power outages, and other cataclysmic
    events.


    ![](img/fe481b0f2e190573448211a8d1ff379b_102_0.png)


    # This will help us when the light won’t go on!


    I don’t need to know about electrons, impedance, Ohm’s law, the Pauli exclusion
    principle, Heisenberg’s uncertainty theory, the Schrodinger wave equation, or
    how anything works. Spin, vibration, angular momentum, velocity, and charge have
    no meaning to me now. When I studied these esoteric subjects in college I thought
    that I could make them a part of my intellectual life and help me understand how
    to apply them in some fashion or form in my work in medicine. But, forget about
    it!


    What do I remember about college is: Pinball machines (Dimension was my favorite,
    even with one weak flipper), which allowed me to pass time rather than attending
    boring classes: football, where I could be humiliated by players better than me.
    Other achievements: Working in the ratheller as a short-order cook where I could
    flirt with girls; loading lead blocks and moving them to some other place at the
    atomic accelerator; washing glassware in a biochemistry lab; trolling for algae
    in a lake...


    I failed structural chemistry (I could not derive the Schrodinger wave equation),
    but loved the squiggly integral lines.


    Being told by my chemistry professor after he wrote on my exam: “Please see me.”
    (Other classmates had things written like: “Great job. “Keep up your high standards.”)
    “Cliff, (pause for effect), have you considered other majors besides chemistry?”


    I just wanted to go to medical school.


    So now I propose an idea which, if better developed and testable, would be considered
    a theory. And it ain''t gonna be me who does!


    Equation 1: Time + toxic chemicals (carcinogens) + viruses + genetic instability
    = cancer.


    Equation 2: Time + cancer = more cancer.


    Equation 3: Time + cancer + immunity = less cancer.


    Equation 4: Probability of cancer as a life-threatening disease = Equation 1 +
    2 + 3.


    Equation 5: Equations 1 + 2 + 3 + 4 are all determined by the laws of Quantum
    Oncology.


    Definition: Quantum Oncology - The study of cancer development based on the principles
    of quantum mechanics.


    We are all basically atoms, which should obey the laws of physics. But the problem
    is the mathematical equations of quantum physics are inadequate to describe complicated
    atomic structures like genes and proteins. Not being smart enough to understand
    them in the first place may now work to my advantage! For it frees me from worrying
    about the details, like, “Why don''t the equations balance,” and other nerdy comments.


    When people get cancer, let''s use lung as an example, why is it that there may
    be a primary tumor in the right lung in one patient, which has spread to a few
    local (hilar) lymph nodes, and a rib, right pelvis, and one spot in the left lobe
    of the liver? And in another patient with a right lung tumor (similar histology
    and primary size and location), which is in regional (mediastinal) lymph nodes,
    three spots in the liver (two on right, one on left), and a solitary spot in the
    right lobe of the brain? And I could present a thousand examples or clinical vignettes
    of this.


    So why does cancer start in one place and not the other? Why does it spread in
    cases of advanced or metastatic disease, to different places and not other places?
    It is probably not just a case of "soil and seed," which is a theory that’s been
    around for more than 100 years. Nor, can things be easily explained by the failure
    of local or regional immunity (which I used to believe).


    ![](img/fe481b0f2e190573448211a8d1ff379b_104_0.png)


    ![](img/fe481b0f2e190573448211a8d1ff379b_104_1.png)


    ![](img/fe481b0f2e190573448211a8d1ff379b_104_2.png)


    ![](img/fe481b0f2e190573448211a8d1ff379b_104_3.png)


    For the most part, there are no adequate explanations for why cancer occurs in
    one location and not another beyond probabilistic considerations. The reasons
    for cancer development as outlined in the equations are simply that random events
    occur that cannot be predicted with absolute certainty due to the same physical
    principles that make it impossible to accurately predict the location of any atomic
    or subatomic particle from which we are ultimately composed, in the form of proteins,
    lipids, nucleic acids, cells, structures, organs....


    ![](img/fe481b0f2e190573448211a8d1ff379b_105)


    So why should we expect to know precisely where cancer will start, and go to,
    when we can''t figure out where an electron (the best we can do is describe its
    cloud-like distribution), along with a gazillion other electrons allowed me to
    turn on the light in my house and write this essay. For fortune turns, and where
    it ends up, nobody knows!


    ![](img/fe481b0f2e190573448211a8d1ff379b_105_1.png)


    Fortune and wheel.


    # XX. The Nude Biologist


    Do what you will, this world''s a fiction and is made up of contradiction. William
    Blake (1757-1827) Can the absurdity of the human condition, of which we are prisoners
    of sorts, be explained by a story about a west coast hippie who changed the course
    of history? I doubted it, but let''s try anyway.


    ![](img/fe481b0f2e190573448211a8d1ff379b_106_0.png)


    Out of the depths of creation, within the cracks of Hell are spewed methane gas
    and brimstone in the form of various compounds released in hydrothermal vents
    called black smokers. These geological events occur thousands of feet below the
    earth''s surface, in the form of a hydrothermal vent where tubeworms live off
    thermophilic bacteria in underground eruptions of magma at incredible temperature
    and pressure. And there which is eaten by other things and so on. But how can
    a cancer patient breathe a sigh of relief from a test that was indirectly created
    by some fantastic bacteria that can live at the edge of the abyss? And how can
    an LSD-tripping molecular biologist be part of this puzzle? And what does this
    have to do with Ulysses S. Grant, our 18th president, and Theodore Roosevelt,
    our 26th president? Or a physician/scientist/Polish immigrant/VA employee who
    discovered endogenous retroviruses, which led to discovery of the HIV virus? Let''s
    begin at the beginning of time when ancient bacteria called extremophiles figured
    out a way of living under “extreme” conditions. Under tons of pressure and heat,
    they are happy and capable of using methane and sulfur compounds to provide their
    energy requirements in a process called chemosynthesis, and other things they
    eat, such as the Pompeii worm (great name).


    ![](img/fe481b0f2e190573448211a8d1ff379b_107_0.png)


    In studying these bacteria, which are also called thermophiles (heat lovers),
    in hydrothermal vents and in other places with similar geologic activity such
    as the hot springs of Yellowstone National Park, scientists about 35 years ago
    found that various enzymes that the bacteria produced functioned best at temperatures
    that could fry an egg.


    ![](img/fe481b0f2e190573448211a8d1ff379b_107_1.png)


    Yellowstone National Park was first dedicated in 1872 by President Grant and then
    President T. Roosevelt had the vision to create the National Parks Service around
    1900, to further protect this treasured land where scientific discoveries could
    be made in a pristine setting. So the nude molecular biologist could have his
    (perhaps) LSD-influenced vision. For Kary Mullis in 1983 (in 1998 the author of
    the autobiography: “Dancing Naked in the Mind Field”) inadvertently figured out
    a way to save the unjustly accused and imprisoned, among other things. He realized
    that he could exploit other scientist''s discoveries of heat-loving enzymes such
    as the DNA polymerase isolated from Thermus aquaticus, in creating a method called
    PCR or the polymerase chain reaction. There are now about 20 variations of this
    reaction which use high heat in the steps to create amplified copies of DNA or
    sometimes RNA.


    ![](img/fe481b0f2e190573448211a8d1ff379b_108_0.png)


    Kary Mullis, Ph.D. His discovery of PCR has changed the way criminal evidence
    is analyzed and sometimes freed the innocent.


    - 1. Denaturation

    - 2. Annealing

    - 3. Extension

    - 4. ...

    - 5. ...

    - 6. ...

    Exponential growth of short product


    ![](img/fe481b0f2e190573448211a8d1ff379b_108_1.png)


    PCR (polymerase chain reaction) will continue to have a profound impact on future
    scientific discoveries in cancer research. Not only did Dr. Mullis win the Nobel
    Prize in Chemistry in 1993, but his method (PCR) and the Thermus aquaticus polymerase
    were honored by the journal Science Magazine in 1989, in its inaugural award:
    “Molecule of the Year!”

