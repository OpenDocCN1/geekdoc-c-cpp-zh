    With further studies on thalidomide it appeared that it could decrease inflammatory
    responses, decrease angiogenesis, and paradoxically activate immune cells, in
    biochemical processes that are still not fully understood. But why would that
    stop anyone testing this drug on nonpregnant patients with cancer, in desperation,
    people will try just about anything?


    In 1999, a year after the FDA approved thalidomide for treating an occasional
    complication of leprosy treatment, Dr. Bart Barlogie (one of the leading experts
    in myeloma), reported it to be effective in some patients with a hematologic malignancy
    called multiple myeloma. In combination with another drug called dexamethasone
    (which is a steroid drug that typically inhibits allergic reactions and immune
    function), thalidomide became a star chemotherapy drug in a Rube Goldberg series
    of scientific events. Newer thalidomide derivatives work even better, such as
    Revlimid, and all I can say you can''t make this stuff up!


    ![](img/fe481b0f2e190573448211a8d1ff379b_115_0.png)


