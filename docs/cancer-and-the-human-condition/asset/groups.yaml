    cm（略小于一英寸），现在已缩小到1.1 cm。


    所以Buddy回到诊所看肿瘤科医生讨论测试结果。Buddy本身是个紧张的人，所以当肿瘤科医生走进诊室时，Buddy站着，读完了所有内容，来回走去，等了至少十分钟，![](img/fe481b0f2e190573448211a8d1ff379b_118_0.png)
