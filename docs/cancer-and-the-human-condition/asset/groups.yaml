    ![](img/fe481b0f2e190573448211a8d1ff379b_74_2.png)


    Mrs. William Halsted

    (Caroline Hampton)


    Dr. Halsted in Surgery.


    Dr. and Mrs. Halsted helped change the course of modern surgical technique.


    When his wife complained of sore hands from washing them in carbolic acid (she
    was his surgical nurse), he had the chemists at Goodyear Tire Co. create the first
    rubber surgical'
  - '[PAGE 75]


    gloves. Before then surgeons would operate without gloves; he also realized that
    infection rates went down after their use became the new standard of care.


    What does this have to do with cancer?


    Despite all the flaws of a Greek hero, Dr. Halsted cured women with advanced breast
    cancer with an operation that he invented called a radical mastectomy.*


    ![](img/fe481b0f2e190573448211a8d1ff379b_75_0.png)


    This operation changed the course of cancer surgery and led to a less expensive
    modification of this procedure called a modified radical mastectomy where the
    chest wall muscles and some axillary lymph nodes are preserved. Even after more
    than 100 years, the basic procedure is the same, and as before this operation
    was invented there was little to offer women with breast cancer, his work stands
    out as a spectacular event in the annals of surgical oncology.


    > Despite the use of drugs, Dr. Halsted was a great surgeon.


    * During the final editorial process, another "Hot Off the Press" item: For the
    Halsted aficionado, a must read Genius on the Edge: The Bizarre Double Life of
    Dr. William Stewart Halsted, by Gerald Imber, MD.'
  - "[PAGE 76]\n\n# XIV. The Resurrection of the Dread\n\n> ~First of all, let me\
    \ assert my firm belief that the only thing we have to\nfear is fear itself -\
    \ nameless, unreasoning, unjustified terror that\nalyzes needed efforts to convert\
    \ retreat into advance.~~\nFranklin D. Roosevelt (1887-1945)\n\nWith a title like\
    \ the \"Resurrection of the Dread,\" I'll try\n to remain lighthearted as I write\
    \ this. I want you to relax too.\n\n![](img/fe481b0f2e190573448211a8d1ff379b_76_0.png)\n\
    \nThe four humors or temperaments (sanguine, melancholy, phlegmatic,\ncholeric).\
    \ A sanguine disposition is the most optimistic and pleasant.\n\nWell maybe not\
    \ be lighthearted, but optimistic. Well maybe\nnot optimistic, as much as fatalistic.\
    \ On second thought don't relax.\n\nCheerful? Sanguine? Not really. How about\
    \ hopeful?\nYes, let's try to be hopeful!\n\nSo the title should read \"Hopeful.\"\
    \ Maybe, but when\npeople come to see me with cancer for the first time, most\
    \ often\nthey are afraid. No, not afraid, something deeper, something\ncloser\
    \ to terror, but not quite, something like dread. So that's why\ni used the word\
    \ \"dread,\" as in I dread seeing the oncologist next\nweek, for what he may tell\
    \ me.\n\nNow what about \"resurrection,\" as in a rising again or\nrevival, and\
    \ hence the play on words? For the phrase \"resurrect-\ntion of the dread\" evokes\
    \ a very primitive emotion in me (and\ni suspect you); it is a feeling inside\
    \ us, of awe and great fear of\nthe future."
  - '[PAGE 77]


    So let’s consider a real life example, of a case seen several years ago. A 60-year-old
    lady is admitted to the hospital over the weekend, complaining of severe neck
    pain, radiating to her head. On exam, an X-ray of her neck shows an area of bone
    in cervical vertebrae appears to be “eaten away,” a so-called lytic lesion, suggesting
    some type of malignancy. She is examined by a physician who finds her entire right
    breast (skin included), is completely distorted, hard, and red and orange in color,
    along with hard, enlarged lymph nodes identified under her right axilla (armpit).


    ![](img/fe481b0f2e190573448211a8d1ff379b_77_0.png)


    In today’s times, why believe in God? Why not believe in the incredible advances
