    [content]world''s experts in treating breast cancer, made me shudder. His quote
    from the 30th Annual San Antonio Breast Symposium (12/13/07): “Given the known
    long-term cardiac and leukemogenic toxicities of anthracyclines and the lack of
    incremental benefit in the non-HER2 population, we can ask if there is any role
    for these agents at all.”


    Before we get to the HER2 status of patients and its significance, let''s talk
    about the history behind Adriamycin (doxorubicin) and Cytoxan (cyclophosphamide).


    Adriamycin is an anthracycline drug isolated from a strain of bacteria called
    Streptomyces. In other words, it is an antibiotic that the bacteria produces to
    kill other invading microorganisms, including competing species of bacteria and
    fungal organisms. Other examples of Streptomyces-derived drugs which have revolutionized
    the treatment of infectious disease are a pharmacopeia Who''s Who: Nystatin, Amphotericin
    B, Erythromycin, Tetracacycline, and Vancomycin. Adriamycin kills all sorts of
    cells (both microbial and human), and includes cancer cells. It inserts itself
    (intercalates) into DNA, and leads to cells dying because they cannot repair the
    DNA. This effect is as true with normal cells such as bone marrow progenitor cells,
    as it is with breast cancer cells and in fact as we now know, it is much more
    effective at killing bone marrow cells than breast cancer cells.


    Cytoxan (cyclophosphamide) and its derivatives have been around for nearly 200
    years, in the form of chemicals called nitrogen mustards. Yes, the same nitrogen
    mustards (with slight structural changes), were used in World War I to gas troops.
    What happened after exposure, beyond terrible lung and skin damage, was that doctors
    observed a decrease in the number of white blood cells in some exposed soldiers.
    They tried treating leukemia patients with these chemicals and eventually tested
    them on many different cancers, sometimes with encouraging results. By trial and
    error, so-called “empiricism,” Cytoxan continues to be used in treating many different
    cancers and blood diseases, typically in combination with other drugs. We even
    use it in treating autoimmune disease such as systemic lupus erythematosus, since
    it kills off immune system bone marrow cells that attack normal body components.


    ![](img/fe481b0f2e190573448211a8d1ff379b_85_0.png)


    The origins of many chemotherapy drugs still in use are from "The War to End all
    Wars."


    ![](img/fe481b0f2e190573448211a8d1ff379b_85_1.png)


    Dog, doctor, and soldier with masks to protect them from noxious vapors. The doctor''s
    outfit is from the 17th century to protect against the black death and other epidemics.


    So Adriamycin (named by Italian scientists after the Adriatic Sea), AKA doxorubicin
    (derivative of ruby red color), an antibiotic, is one of the most commonly used
    chemotherapy drugs in treating breast cancer and other malignancies. I can see
    the rationale for using antibiotics to help fight infections, as there is a certain
    sense that from an evolutionary perspective, these drugs and their structurally
    related cousins, synthesized in the laboratory, are perfectly designed for that
    function and purpose in microorganisms. But I am not convinced that they are or
    will be truly suitable, logical, or scientifically elegant cancer chemotherapy
    drugs.


    > * The Adriatic Sea got its name from the Roman Emperor Hadrian (76-138).


    And a reminder that about 50 years ago when scientists talked about chemotherapy,
    they were talking most often about antibiotic therapy for infectious diseases!


    ![](img/fe481b0f2e190573448211a8d1ff379b_86_0.png)


    Estramust, melphalan, and mechloreamine: Nitrogen mustard gas derivatives. From
    gassing troops to treating patients with chemotherapy.


    Unfortunately empirism has once again prevailed above true understanding, which
    has led to an alphabet soup of regimens designed to “selectively” kill cancer
    cells.


    AC, CMF, FEC, FAC, CEF, not to mention T-based regimens (Taxol or Taxotere), H-based
    regimens (Herceptin), X-based regimens (Xeloda), and so.


    The E by way stands for epirubicin, another anthracycline like Adriamycin. And
    all I can say is it''s only going to get crazier, unless we reconsider our approach.
    But I doubt it, and in fact the combinations of drugs will only become more confusing,
    and add the new “schedule du jour,” dose density, which is the next “great” idea,
    based, I believe, on incorrect premises. So yes I am disappointed that oncologists
    can be so stubborn and timid.


    Now back to Dr. Slam''s brave statement. For it suggests that in patients with
    breast cancer, nearly 70-80%, treated with Adriamycin (and most likely epirubicin)
    for early-stage breast cancer, derive no benefit. Whether C (Cytoxan), or other
    chemotherapy alphabet letters help is not known, but my guess is that they do
    to a small extent (maybe 5-10% benefit). But in HER2-negative breast cancer, which
    I indicated represents the majority of cases, anthracycline-based regimens are
    no longer justified. And our breast cancer thought leaders are busy creating new
    catchy acronyms for “novel” drug regimens. And even more amazingly, among HER2
    positive breast cancers, only small subset of patients benefit from anthracyclines.
    This population is 5% of the total (those tumors that are HER2-positive and also
    overexpress an enzyme topoisomerase II), so an incredible number of women have
    been treated with anthracycline (topoisomerase II) more than 20 years.


    ![](img/fe481b0f2e190573448211a8d1ff379b_87_0.png)


    Herceptin structure. We''ll talk about HER2 in detail later, but I''ll tell you
    that it is a receptor that is a normal component of breast and many other cell
    types. In about 20-30% of breast cancers it is “overexpressed” in varying amounts.
    Inhibition of HER2 with the monoclonal antibody Herceptin (a billion dollar for
    Genentech), can help cure patients with early-stage breast cancer, in combination
    with other drugs, and it is also effective in prolonging the lives of women with
    metastatic disease, sometimes dramatically so. Even in carefully selected candidates
    with HER2-positive tumors, it''s best at a coin-flip whether a meaningful or beneficial
    response will be. But at least Herceptin’s creation was based on some thought,
    although when we speak of HER2-negative tumors, we are being ingenuous since the
    protein is present in relatively low numbers; 20,000 molecules per cell can be
    considered “negative.”


    * We are getting a bit more scientific testing for topoisomerase II overexpression.
    Tests are now being performed in many hospitals. Breast cancer that overexpresses
    this enzyme should be “sensitive” to anthacycline chemotherapy, so at least there
    is some rationale for its continued use. The problem is we don''t know whether
    drug combinations are better.


    And Herceptin can be dangerous to use (feel free to review its toxicity profile
    on the Genentech website). So, please be very skeptical when you hear about other
    new drugs with the catch-phrases like “revolutionary,” “paradigm shift,” “extraordinary”
    and similar hyperbole.


    ![](img/fe481b0f2e190573448211a8d1ff379b_88_0.png)


    Apocalyptic vision of the way, to a large extent (metaphorically) we treat cancer:
    Poisonous drugs, radiation, mutilating surgery, and the absence of faith in God
    all contribute to the mess we’re in.


    And with a “dose” of linguistic irony, as I end this essay, monoclonal antibodies
    (like Herceptin), can be conventionally abbreviated as Moab,* which leads us back
    to the beginning of biblical history. So we begin and end this essay with a cautionary
    tale, written by the Hand of God 4,000 years ago!!!


    * Over the last 30 years since the production of monoclonal antibodies the abbreviation
    changed from Moab to Mab but that would ruin the tenuous connections of this story!

