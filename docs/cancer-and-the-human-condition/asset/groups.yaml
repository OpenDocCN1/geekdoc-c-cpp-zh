    其他科学家也在思考同样的事情，并积极参与到证明其正确性所需的艰辛研究中。


    而且尽管有许多失败主义者和反对者，正如大多数想法一样，它经历了很长时间才被人们意识到其在根本上是正确的。


    ![](img/fe481b0f2e190573448211a8d1ff379b_66_0.png)


    癌症免疫编辑的“三个E”阶段：免疫的宿主保护作用与肿瘤塑形作用。在细胞转化和内在肿瘤抑制因子机制失败后，发育中的肿瘤会被免疫系统检测到，其最终命运取决于它是被免疫的宿主保护作用消除（消除阶段）、维持在休眠或平衡状态（平衡阶段），还是通过变为非免疫原性或产生免疫抑制分子和细胞来逃避免疫的外源性肿瘤抑制作用（逃逸阶段）。


    施莱伯博士（Dr. Schreiber）、奥尔博士（Dr. Old）以及他们的同事生动地描述了免疫系统控制癌症运作的方式。有时会发生完全成功或失败，导致疾病的进展。


    这让我们“带着希望和祈祷”走向罗伯特·施莱伯博士、奥尔博士以及许多同事的工作，他们将免疫监视理论建立在坚实的科学基础上，这一成就值得他们最高荣誉（15）。在一个被称为“免疫编辑”的过程中（如图所示），免疫系统经常在癌症细胞检测并摧毁它们在变成具有侵袭性和威胁生命的恶性肿瘤之前。但这种控制系统并不总是成功的。有时发生的情况是癌细胞能够以欺骗和策略的方式逃避免疫识别，因此现在的任务是研究如何通过癌症疫苗、人源单隆抗体免疫治疗以及其他促进对癌症产生更强更有效免疫反应的方法，帮助免疫系统表现得更好。


