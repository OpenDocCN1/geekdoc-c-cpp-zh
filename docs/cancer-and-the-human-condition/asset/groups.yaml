    # X. 鞘氨脂的谜团


    > ~~我认为，特别是在那些公认的危机时期，科学家们转向哲学分析，作为一种破解其领域谜团的手段.~~ 托马斯·库恩，博士 (1922-1996)


    多年前，在一次由制药公司赞助的研究员会议上，我展示了一份摘要（对正在进行的工作简要总结），并向与会者发表了演讲。许多人看来，那场演讲充其量算还可以。但是，这比我十年前在里约热内卢的表现要好得多，当时我站在里约热内卢大学的观众面前，却一言不发！我当时极其恐惧，深受舞台恐症的困扰，这种恐惧完全让我瘫痪了，以至于一个字也说不出来。我的尴尬被放大了，因为在访问巴西期间，我是朋友兼导师、伟大的学者和人物路易斯·R·特瓦沃斯博士（Dr.
    Luiz R. Travassos）的客人。


    因此，能够流畅地发言有一种某种满足感：虽然不上不上，但至少没有像以前那样出大丑。由于这些话题是相关的，尽管相隔了十多年，这给了我一种视角，让我看到如何通过那些当时看起来残酷且无法忍受的事件而成熟，然而我们仍然生存了下来，有时甚至以意想不到的方式从中受益。


    ![](img/fe481b0f2e190573448211a8d1ff379b_55_0.png)


    ![](img/fe481b0f2e190573448211a8d1ff379b_56_0.png)


    正如你们可能知道的，斯芬斯的谜语有三个。但在我们进入那个古老的故事和斯芬斯的起源之前，让我给你们介绍一下鞘氨脂，它们远没有那么出名。


    当我们考虑细胞的基本边界时，比如在五年级，我们的老师会描述各种结构或细胞器。有细胞核，DNA居住在那里。有核仁，RNA居住在那里。我们看到中心体、线粒体、内质网、高尔基体、溶酶体等的图像。


    但我个人一直喜欢细胞膜。出于许多原因，我热爱细胞表面。正如我所说，“我花了生命中大约十年的时间，断断续地研究癌细胞表面。”简单来说，我们认为细胞是一个独特的生物学实体，因为它在某种程度上是独立于周围环境存在的，但又在某种程度上通过细胞膜与周围环境进行交流。细胞膜是一个双层脂质明治，包含许多不同类型的脂质（如胆固醇、磷脂、鞘氨脂、糖鞘氨脂和神经节糖*，仅列举几类分子），它们像一种**油海一样漂浮**，其中还夹杂着许多其他类型的分子，处于一个不断变化的环境中。


    ![](img/fe481b0f2e190573448211a8d1ff379b_57_0.png)


    细胞膜小片段及相关结构的横截。


    细胞表面，特别是细胞膜的外层，是细胞膜中与外部环境相互作用的特殊部分。情况要复杂得多，因为有时细胞膜的部分会反转位置或翻转（flip-flop），并增加新的成分，而其他部分则被丢弃；而且经常，这些细胞分泌的一层被称为糖萼的物质积聚在外膜外面，形成一种毛茸的基质，影响着细胞与其环境之间的交流。


    现在，让我们来进行思想实验。我想让你们闭上眼睛，把细胞表面想象成一片美丽的森林，那里有各种奇特的植物、树、花、灌木和草，它们在你们面前跳舞，像一种分子万花筒。


    > *  在文章XI《路易斯·托马斯的鞋》中有更多关于神经节糖的信息*


    > **在BP（英国石油公司）印刷之前，墨西哥湾出现了一片正在演变的油海。这是一场无法言喻的规模的灾难。


    ![](img/fe481b0f2e190573448211a8d1ff379b_58_0.png)


    作为超现实艺术形式的细胞。


    为了增加这种想象，现在想象有万亿个细胞，它们都有自己的细胞表面和独特的景观。现在加上膜的运动、细胞的运动、结构（器官）的运动、生物体（我们）的运动，以及万物的运动。


    旋转着，寻找其他，搜寻，探查，伸出手，不断地，想要触摸，想要拥抱。


    如果你将其视为实现生物体间交流的方式，或者视为一种亚原子级的灵魂之舞，也许这会有帮助。


    或者，这只是上帝不可言喻的意志和创造力的另一种表现。


    鞘氨脂是以斯芬斯命名的分子。斯芬斯是埃及的神灵，金字塔附近的巨大的斯芬斯形象显示了一个连接在狮子身体上的头部。埃及还有其他的斯芬斯变体，随着时间的推移，斯芬斯变成了一个拥有狮子身体的女性，有时还会加上翅膀和尾巴。但这并不是一个女士！因为她非常喜欢杀死那些未能正确回答问题的人，以死亡和毁灭作为她的名片，直到她命运的结局。


    ![](img/fe481b0f2e190573448211a8d1ff379b_59_0.png)


    由肯尼德博士发现的人类血型抗原是嵌入细胞膜的糖脂，糖糖允许细胞交流。


    如果我年轻时就知道斯芬斯的恶劣行为，我可能会重新考虑我研究的分子。但鞘氨脂的命名非常巧妙，因为它在某种程度上是两种形式的结合。脂质部分通常包含长链脂肪酸（类似于油脂），以及另一部分称为鞘醇，两者都连接并嵌入细胞的脂质部分。另一部分是“头部”，指向环境，可以是许多不同的物质。例如，神经酰胺是一种可以在护肤品中找到的简单鞘氨脂。鞘氨脂是另一种让神经细胞高效传导电冲的简单分子。一种常见的疾病多发性硬化是一种免疫系统性疾病，由于（部分）鞘氨脂的破坏导致神经功能障碍。一种最新的美容现象——肉毒杆（一种源自毒菌的纯化毒素），实际上结合了（其他物质之外）一类被称为唾酸化的鞘氨脂的鞘氨脂，这些也存在于癌细胞中，我在实验室研究了多年。即使是血型抗原（我们常说的血型A、B和O），通常也是糖鞘氨脂，它们的结构如此相似（尽管会被免疫系统识别），以至于精确的分子差异直到20世纪60年代末才由我在斯隆凯特研究所的科学导师、伟大的生物化学家肯尼·洛德（Kenneth
