- md: "\n# CANCER and the Human Condition\n\n![](img/fe481b0f2e190573448211a8d1ff379b_0_0.png)\n\
    \nClifford S. Pukel, M.D.\n\nDigitized by the Internet Archive in 2022 with funding\
    \ from Kahle/Austin Foundation\nhttps://archive.org/details/cancerhumancondi0000puke\n\
    \n# CANCER and the\n\n# HUMAN CONDITION\n\nClifford S. Pukel, M.D.\n\nPublished\
    \ by Cancer Vaccine Institute, LLC\n\nEmail address: cancerimmunionst@aol.com\n\
    \nCopyright © 2010 Cancer Immunotherapy Institute, LLC\nAll rights reserved.\n\
    \nLibrary of Congress Cataloging-in-Publication Date 2010\nISBN: 978-0-615-35459-0\n\
    \n# Essays\n\n- I. Cancer and the Human Condition\n- II. Forget Harvard, I Want\
    \ My Kid to go to Medicare University!\n- III. The Archer\n- IV. The Chronicle\
    \ of Death\n- V. Your Grandmother Was Right!\n- VI. Let Us Now Praise Famous Dogs\n\
    - VII. The Broken Clock\n- VIII. Bric-a-Brac\n- IX. The Silence of the Worms\n\
    - X. The Riddle of the Sphingolipid\n- XI. Lewis Thomas’ Shoes\n- XII. Can an\
    \ Aspirin a Day Keep Cancer Away?\n- XIII. Confessions of a Poppy Seed Bagel Eater\n\
    - XIV. The Resurrection of the Dread\n- XV. Wilt Thou Indeed Destroy the Righteous\
    \ with the Wicked?\n- XVI. The Other Peyton\n- XVII. Microtruth\n- XVIII. When\
    \ is Breast Cancer, Which is Not Breast Cancer, Breast Cancer?\n- XIX. Quantum\
    \ Oncology\n- XX. The Nude Molecular Biologist\n- XXI. The Leper\n- XXII. For\
    \ Whom the Bell Curve Tolls\n- XXIII. How Should Cancer Patients Respond to Response\
    \ Rates?\n- XXIV. Has Reefer Madness Struck the National Cancer Institute?\n-\
    \ XXV. Phraseotics\n- XXVI. The Age of Age\n- XXVII. The Importance of Being Important\n\
    \n## Dedication\n\nThis book is dedicated to Lloyd J. Old, MD, a man of great\
    \ vision, intellectual curiosity, and excellence of moral character.\n\nAnd\n\n\
    To my Grandpa, Charles Buchholtz, former President of Congregation Kneses Israel,\
    \ Sea Gate, Brooklyn, NY, who will always live in my heart.\n\n> All nature is\
    \ but art unknown to thee;\n> All chance, direction, which thou canst not see...\n\
    > Alexander Pope (1688-1744)\nEssay on Man\n\nThen Job answered the Lord, and\
    \ said:\n\nI know that Thou canst do every thing, and that no thought can be withholden\
    \ from Thee.\n\nWho is he that hideth counsel without knowledge?\nTherefore have\
    \ I uttered that I understand not;\n\nThings too wonderful for me, which I knew\
    \ not.\nHear I beseech Thee and I will speak: \nI will demand of Thee and disclose\
    \ Thou unto me.\n\nI have heard of Thee by hearing of the ear.\n\nBut now mine\
    \ eye seeth Thee.\n\nWherefore I abhor myself, and repent in dust and ashes.\n\
    \nJob 42:1-6\n\n![](img/fe481b0f2e190573448211a8d1ff379b_12_0.png)\n\nA cartoon\
    \ of a 19th century cancer \"expert,\" Dr. A. Borrel, examining a patient. More\
    \ than anything else, the crab motif is a reminder of the incredible creativity\
    \ of the human imagination.\n\n## Preface\n\nIf you are reading this sentence\
    \ you are smart! It means the book’s title and cover interested you enough to\
    \ open it and I would like to think this demonstrates you have a fine mind. You\
    \ may be incredibly smart (I hope so), or even a genius, but I can (within the\
    \ laws of probability) guarantee you do not know more about cancer than me. Look\
    \ at the odds, with 6 billion people in the world, and maybe 6 thousand cancer\
    \ experts of various sorts (researchers and clinicians with many years of experience),\
    \ the likelihood of my peers reading this is one in a million. In fact, if the\
    \ definition of an expert is: “someone who doesn't need to know more,” I doubt\
    \ my colleagues will be interested in this book.\n\nSo being smart, and wanting\
    \ to learn, you are already on the right track. Congratulations! As my wonderful\
    \ professor of comparative anatomy, Dr. McIntyre said more than thirty years ago,\
    \ “The definition of intelligence is the ability to learn, and unlearn, if something\
    \ is found to be untrue,” which is precisely what this collection of essays is\
    \ designed to do. I want you to remain skeptical. I want you to be challenged,\
    \ and to question the statements that are made in a vigorous and intellectually\
    \ honest way. I want you to take everything I say with a grain of salt. I want\
    \ you to think. Much of what I say may prove to be false. It may be true today,\
    \ and untrue tomorrow. That is the beauty of the scientific method. I recognize\
    \ that the numbers are inaccurate and the reasoning imprecise. Odds of one in\
    \ hundred thousand may be closer to the truth. I am puzzled about why cancer,\
    \ even the word alone, stimulates an almost visceral reaction in people diagnosed\
    \ with this disease. Is it the destructive changes that can occur? Is it the fear\
    \ of death associated with this disease? Or is it something even deeper in the\
    \ human psyche, like the notion or belief that cancer is the betrayal of self?\
    \ In other words, we have failed ourselves in the most intimate and perhaps passionate\
    \ way. This is the first in a series of books, and I'm sure you will have many\
    \ excellent ideas. I encourage you to share your thoughts, experiences, and reflections\
    \ with us. But for now, just open your heart and mind to ideas and unique connections\
    \ that will inspire you, dear reader, to think about our existence in new ways.\
    \ C. S. Pukel, MD\n\n## I. Cancer and the Human Condition\n\nSelfishness is the\
    \ greatest curse of the human race\nWilliam Gladstone (1809-1898)\n\nCancer, like\
    \ the poor will always be with us. When I started cancer many years ago, I was\
    \ young and idealistic, and believed that as societies evolved, with altruistic\
    \ motives and technological advancements poverty could be eliminated from this\
    \ planet. In a similar fashion and method of reasoning, I thought that cancer\
    \ could also be eliminated from this planet. I no longer believe that either of\
    \ these ideas will ever be accomplished.\n\nFor there is something wrong with\
    \ our species that I think will prevent mankind from fulfilling its highest goals.\
    \ The thing that is wrong with us we are incredibly selfish. We don't like to\
    \ share. We don't like others to beat us at anything; to earn more, dress better,\
    \ live in bigger or better residences, have more money, have more success, be\
    \ happier, better looking, be more popular, be smarter, stronger....\n\nAs we\
    \ are selfish in a psychological sense, our bodies can metaphorically also be\
    \ selfish. And the sine qua non of physiologic selfishness is cancer. Now I do\
    \ not believe that selfish people by some mechanistic (or Divinely inspired) process\
    \ develop selfish diseases. That is far too simplistic. But I think it is important\
    \ to consider what it means when our bodies fail us in philosophically provocative\
    \ ways. For, unlike other diseases, cancer just the word alone evokes an incredibly\
    \ primitive and intense response in many people. It terrifies them. Just the word.\
    \ Just the thought. Just the mental imagery. Just the idea.\n\n> No offense (literary\
    \ or philosophical) is intended to the great social theorist and intellectual,\
    \ Hannah Arendt (1906-1975), who wrote “The Human Condition\", in 1958.\n\nThis\
    \ mental imagery extends to our way of responding to the diagnosis of cancer.\
    \ “We are going to fight this thing.” “We are going to win the battle.” “We are\
    \ going to be cancer survivors.” “We are going to defeat it.”\n\nSo we are at\
    \ war with ourselves! The battle lines are drawn. It's the good guys versus the\
    \ bad. The bad guys, of course, are the cancer cells, that have become transformed\
    \ from good guys into bad guys, so now the fight is within ourselves.\n\nThe good\
    \ guys need to be helped.\n\nSo we attack the cancer with harmful drugs that will\
    \ hopefully kill the bad guys without killing too many good guys, in this World\
    \ War Me.\n\nWe take supplements to make our good guys work better. We meditate,\
    \ pray, chant, aromatize, reflexologize, in the hope of winning. For Vince Lombardi,\
    \ the great football coach (who died of colon cancer, at age 57) said: “If winning\
    \ isn't everything, why do they keep score?”\n\n![](img/fe481b0f2e190573448211a8d1ff379b_17_0.png)\n\
    \nVanquish Cancer. The eternal struggle as artistic abstraction. I worked for\
    \ several years at a Vince Lombardi Cancer Clinic, in the city where he is immortal,\
    \ Green Bay, Wisconsin, and the problem is that his success defeating football\
    \ opponents did not translate into success defeating a different kind of opponent.\n\
    \n![](img/fe481b0f2e190573448211a8d1ff379b_17_1.png)\n\nBut consider that cancer\
    \ cells, (in a special way) are as much a part of all of us as healthy cells.\
    \ In other words, due to our inherent complexity as multicellular organisms, abnormal\
    \ cells are created, each and every day, due to random genetic\n"
