    I am puzzled about why cancer, even the word alone, stimulates an almost visceral
    physical reaction in people, and their families, diagnosed with this disease.
    Is it the destructive changes that can occur? Is it the fear of death associated
    with this disease? Or is it something even more deep in the human psyche, like
    the notion or belief that cancer is the betrayal of self? That in other words,
    we have failed ourselves, in the most intimate and perhaps passionate way imaginable.


    Hopefully, you will consider these thoughts as you continue your reading.


    This is the first in a series of books, and I''m sure that you will have many
    excellent ideas about future essays.


    I encourage you to share your thoughts, experiences, and reflections with us.


    But for now, just open your heart and mind to ideas and images and unique connections
    that will inspire you, dear reader, to think about our existence in new and wonderful
    ways.


    C. S. Pukel, MD'
