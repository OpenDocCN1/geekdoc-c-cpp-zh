    # The sad story of MY FATHERS GREAT SUFFERING FROM CANCER


    Read the following and be convinced WE CAN CURE YOU.


    # THE YOGHURT HEALTH NEWS


    # PATRONS WILL SHARE PROFITS


    CANCER TREATMENT NOW READY Yogurt Calls Friends For Big Opportunity Of Business
    Expansion


    New Dept. Opens After Doctor Finds Rapid Growth in Cancer; Must Enter Sanitarium:
    To Receive Treatment


    In this issue we present the story of a young man who suffered from cancer for
    many years, and had no hope until he read this article. He had tried everything,
    from chemotherapy to self-medication, but to no avail. The disease continued to
    grow and spread, and he reached the end of his tether. He was in despair and did
    not know what to do. He had heard of a new treatment and decided to try it. Today,
    he is cured and living a happy life. This is a testament to the power of modern
    medicine.


    HAVE YOU CANCER? Tumors are not just a physical disease but a disease of the mind.
    Self-belief, Emotion, Fear, Stress, Guilt, and Anger are the root causes of cancer.
    If you can control these emotions, you can cure cancer. The growth of a tumor
    is a result of suppressed emotions. When these emotions are released, they are
    inhibited by positive thoughts and feelings. When they are suppressed, they allow
    the tumor to continue to grow. If you are worried about cancer, read this book.
    It will give you the answers you are looking for.


    Desperate trillions of dollars spent worldwide in the so called "war" against
    cancer, every year, millions of people, young and old, die from this disease.


    In this fascinating series of 27 essays, filled with provocative and disturbing
    images, Dr. C. Sukel explores the psychological, historical, sociological, and
    religious aspects of this dreadful disease.


    In easy to understand language, this book helps to bridge the gap for patients
    and their families, or really anyone interested in learning more about what is
    known and not known about cancer.


    Many questions are raised which the interested reader will want answered. Yet
    these questions will remain and perhaps baffled by the lack of knowledge and true
    understanding by the world''s leading "medical experts."


    Recognizing our limitations and lack of consistent progress, Dr. Pukel shares
    the frustration and disappointment that many, many people have with the way we
    treat cancer in the 21st century. Nor is he entirely blameless in this process,
    for a medical oncologist and hematologist, he is as much a prisoner of ineffective
    and toxic therapies, as his colleagues and patients.


    So on, and discover why cancer research and treatment is still decades or centuries
    away from the effective control and treatment of a disease that is still terrifying
    to many of us.


    Still, let us not despair, for with hope and faith in God, the reader should not
    be left with the feeling that things cannot get much better; and this may be the
    most important message of all!


