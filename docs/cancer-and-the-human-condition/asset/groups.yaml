    HER2 人群中缺乏额外获益，我们可以问问这些药物是否还具有任何作用。”


    在讨论患者的 HER2 状态及其意义之前，让我们先聊聊阿霉素素（Adriamycin）和环磷酰胺（Cytoxan）的历史。


    阿霉素素是一种从名为链霉菌（Streptomyces）的细菌中分离出的蒽环类药物。换句话说，它是一种细菌为了杀死其他入侵微生物产生的抗生素，包括竞争物种细菌和真菌生物。其他源自链霉菌并彻底改变感染性治疗的药物还包括药典界的“名人录”：霉菌素、琥青霉素
    B、红霉素、四环素和青霉霉素。阿霉素素能杀死杀死各种细胞（包括微生物和人类细胞），也癌细胞。它插入（嵌入）DNA 中，导致细胞因无法修复 DNA 而死亡。这种效应对于骨髓祖细胞等正常细胞同样有效，对于乳腺癌细胞也是如此；事实上正如我们现在所知，它杀死骨髓细胞比杀死乳腺癌细胞有效得多。


    环磷酰胺（Cytoxan）及其衍生物已存在近 200 年，形式为被称为氮气芥的化学品。是的，同样的氮气芥（结构略有不同）在第一次世界大战中曾用作化学毒气攻击士兵。暴露后发生的情况除了严重的肺部和皮肤损伤外，医生观察到某些暴露的士兵的白细胞数量减少。他们尝试用这些化学药物治疗白血病患者，并并在许多不同的癌症上进行了测试，有时取得了令人鼓舞的结果。通过试错，即所谓的“经验主义”，环磷酰胺继续用于治疗许多不同的癌症和血液疾病，通常与其他药物联合使用。我们甚至用它治疗系统性红斑狼疮等自身免疫性疾病，因为它能杀死攻击人体正常成分的免疫系统骨髓细胞。


    ![](img/fe481b0f2e190573448211a8d1ff379b_85_0.png)


    许多仍在使用的化疗药物源于“结束所有战争的战争”。


    ![](img/fe481b0f2e190573448211a8d1ff379b_85_1.png)


    狗、医生和士兵戴着口罩保护自己免受有害气体的侵害。医生的服装源于 17 世纪，用于防止黑死病和其他流行病。


    因此，阿霉素素（由意大利科学家以亚德里亚海命名），又名多柔霉素（宝石红色的衍生物），作为一种抗生素，是治疗乳腺癌和其他恶性肿瘤最常用的化疗药物之一。我能理解使用抗生素帮助对抗感染的原理，因为从进化的角度来看，这些药物及其在实验室合成的结构相关亲戚，对于微生物的这种功能和目的来说是完美设计的。我不认同它们是或将成为真正合适、逻辑合理或科学上优雅的癌症化疗药物。


    > * 亚德里亚海是以罗马皇帝哈德良（76-138年）命名的。


    提醒一下，大约 50 年前，当科学家谈论化疗时，他们大多数时候说的是针对感染疾病的抗生素疗法！


    ![](img/fe481b0f2e190573448211a8d1ff379b_86_0.png)


    曲妥顺、美法坦和甲氯氨胺：氮气芥毒气衍生物。从毒气攻击士兵到化疗治疗患者。


    遗憾的是，经验主义再次战胜了真正的理解，这导致了一堆像“字母汤”一样的方案，旨在“选择性”杀死癌细胞。


    AC, CMF, FEC, FAC, CEF，更不用说基于 T 的方案（紫杉醇或紫杉杉杉醇）、基于 H 的方案（赫赛汀）、基于 X 的方案（赛来吉达）等等。


    方案中的 E 代表表柔霉素，另一种与阿霉素素类似的蒽环类药物。我能说的只有，除非我们重新考虑自己的方法，否则情况只会变得越来越疯狂。但我怀疑如此，事实上，药物组合只会变得更加混乱，并加入新的“今日热门”方案——剂量密度，我认为这是基于错误前提的下一个“伟大”主意。所以，我对肿瘤学家能如此固执和胆小而感到失望。


    现在回到 Slam 博士的勇敢陈述。因为它表明，在乳腺癌患者中，近 70-80% 使用阿霉素素（极有可能是表柔霉素）治疗早期乳腺癌的患者并没有获得任何获益。C（环磷酰胺）或其他化疗字母方案是否有帮助尚不清楚，但我猜测它们在小小程度上有效（可能有
    5-10% 的获益）。但在 HER2 阴性乳腺癌中（我指出这代表了大多数病例），蒽环类方案不再具有合理性。而我们的乳腺癌意见领袖们正忙于为“新型”药物方案创造朗亮的新缩写。更惊讶的是，在
    HER2 阳性乳腺癌中，只有一小部分患者从蒽环类药物中获益。这一人群占总数的 5%（那些既 HER2 阳性又过度表达拓扑异构酶 II 的肿瘤），因此有惊数量的女性接受了
    20 多年的蒽环（拓扑异构酶 II）治疗。


    ![](img/fe481b0f2e190573448211a8d1ff379b_87_0.png)


    赫赛汀结构。我们稍后详细讨论 HER2，但我会告诉你，它是一种乳腺和许多其他细胞类型的正常组成部分。在约 20-30% 的乳腺癌中，它程度程度“过度表达”。使用单克隆抗体赫赛汀（基因泰公司价值数十亿美元的产品）抑制
    HER2，可以结合其他药物帮助早期乳腺癌患者，还能延长转移性疾病女性的寿命，有时效果非常显著。即使在经过仔细筛选的 HER2 阳性肿瘤候选者中，能否产生有意义或有益的反应也就像抛硬币一样。但至少赫赛汀的创造是基于思考的，尽管当我们谈论
    HER2 阴性肿瘤时，我们太天真了，因为该蛋白的数量相对较低；每个细胞 20,000 个分子就可以被认为是“阴性”。


    * 我们正在对拓扑异构酶 II 过度表达进行更科学的检测。现在许多医院都在进行此类检测。过度表达这种酶的乳腺癌对蒽环类化疗应该是“敏感”的，因此其继续使用至少有一定的理由。问题是，我们不知道药物联合是否更好。


    而且赫赛汀的使用可能是危险的（欢迎随时在基因泰公司网站上查看其毒性概况）。所以，当你听到其他带有“革命性的”、“范式转移”、“非凡”及类似的夸张词汇的新药时，请务必保持高度怀疑。


    ![](img/fe481b0f2e190573448211a8d1ff379b_88_0.png)


    一种末日式的愿景，展示了很大程度上（隐喻地）我们治疗癌症的方式：毒性药物、放射、破坏性手术以及对上帝信仰的缺失共同导致了我们面临的困境。


    并用一种语言上的幽默（“剂量”）作为结尾，当我结束这篇文章时，单克隆抗体（如赫赛汀）可以惯常缩写为 Moab*，这带我们回到了圣经历史的开头。所以，我们用一个
    4000 年上帝之手写的警言故事作为的开头和结尾！！！


    * 在单克隆抗体生产后的过去 30 年里，缩写从 Moab 变为了 Mab，但这会破坏这个故事微弱的联系！

    '
