    companies. These companies have employees and they want to be paid for their labor.
    These companies often have shareholders who invested in stocks and want a good
    return on their investments. The generation of income based on so-called blockbuster
    drugs with sales in the billions every year, allow further drug development and
    so on. In our current economy it is not unusual for a drug to cost $50,000.00
    a year. This cost does not include the cost of administering it, which might include
    hospital or clinic fees, material fees for tubing and IV fluids, pharmacy costs
    for drug preparation, and nursing and physician fees.


    Assuming a drug has passed through the FDA (Food and Drug Administration) regulatory
    process, an extraordinary event in itself, somebody has to go pay for it.


    If you are a billionaire, stop reading this essay. If you are of modest means
    and old enough or poor or sick enough to be enrolled in Medicare or Medicaid (controlled
    by the Centers for Medicare and Medicaid Services)CMS), then you probably know
    that these government services determine to a large extent what chemotherapy or
    other treatments your oncologist is permitted to use, which can be translated
    into what treatment will be paid for. This limitation also applies to various
    lab tests and radiometric studies.


    President Lyndon Johnson signing the first Medicare bill in 1965. Former President
    Harry Truman is sitting on the right, representing the “first” Medicare recipient.
    When politics dictate healthcare decisions, expect to be amazed and confused.


