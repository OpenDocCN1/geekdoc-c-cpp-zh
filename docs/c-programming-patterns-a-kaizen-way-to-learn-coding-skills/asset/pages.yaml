  md: "# Accessing array elements using pointers\n\n*Array is treated as a pointer\
    \ to its first element* in memory. Hence, we can use pointer to access elements\
    \ of an array. The pointer and the array should be of same data-type. The following\
    \ program is a re-implementation of the program WithLooping.c using pointer variables.\n\
    \n# PointerInLooping.c\n\n```\n```c\n#include <stdio.h>\n\nint main() {\n    //\
    \ array initialization\n    char name[20] = \"Mr.Always Right\";\n    int ages[5]\
    \ = { 10, 20, 30, 40, 50};\n    float weight[5] = {23.27, 32.14, 37.45, 60.74,\
    \ 47.25};\n    long distance[5] = {1234567L, 4335454L, 98767567L, 4354321L,555588889L};\n\
    \    int size = -1;// size of an array\n\n    // pointer declarations\n    char\
    \ *charPtr;\n    int *intPtr;\n    float *floatPtr;\n    long *longPtr;\n\n  \
    \  printf(\" Accessing char array element using char pointer.\\n\");\n\n    //\
    \ assigns the starting address of char array to the char pointer.\n    charPtr\
    \ = name ;\n\n    for( int index = 0 ; name[index] != '\\0'; index ++){\n    \
    \    // using asterisk(*) indirection operator to print the array's element.\n\
    \        printf(\" %c |\", *charPtr);\n        charPtr ++ ;\n    }\n\n    printf(\"\
    \\n Accessing int array element using int pointer.\\n\");\n\n    // assigns the\
    \ starting address of int array to the int pointer.\n    intPtr = ages;\n\n  \
    \  // finding size of array using C language's sizeof() operator.\n    size =\
    \ sizeof( ages ) / sizeof( int );\n\n    for( int index = 0 ; index < size ; index++){\n\
    \        // using asterisk(*) indirection operator to print the array's element.\n\
    \        printf(\" %d | \", *intPtr);\n        intPtr ++ ;\n    }\n}\n```\n```"
