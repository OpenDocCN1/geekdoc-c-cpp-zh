  md: "Let's implement a program to print the pattern1H( diamond pattern) using dynamic\
    \ memory allocation and pointer.\n\n# Pattern1HByPointer.c\n\n```\n#include <stdio.h>\n\
    #include <stdlib.h>\n/* function declaration */\nvoid printPattern(int rows);\n\
    \nint main() {\n    // number of rows\n    int totalRows = 5;\n    printPattern(\
    \ totalRows );// function call to print pattern\n    totalRows = 7;\n    printPattern(\
    \ totalRows );// function call to print pattern\n    return 0;\n}\n\n/**\n * function\
    \ printing diamond pattern by dynamically allocating memory.\n */\nvoid printPattern(int\
    \ totalRows) {\n    /* local variable declaration */\n    int MAX_COLUMNS = 0;\n\
    \    int midIndex = 0;\n    int count = 0;\n    // This pointer will holds the\
    \ memory address of the first element\n    // in the allocated memory block.\n\
    \    char *charPtr;\n    // To dynamically allocate memory.\n    printf(\"Enter\
    \ number of rows : %d\\n\", totalRows );\n    MAX_COLUMNS = 2 * totalRows - 1;\n\
    \    midIndex = totalRows - 1; // since array index start at 0;\n    charPtr =\
    \ (char*) malloc( sizeof(char) * MAX_COLUMNS + 1 );\n    // checking if memory\
    \ block allocated or not.\n    if ( charPtr == NULL ) {\n        printf( \"malloc\
    \ failed.\\n\" );\n        exit( 0 ); // terminate the program.\n    }\n    //\
    \ initializing array with spaces\n    for ( int spaces = 0; spaces < MAX_COLUMNS;\
    \ spaces++ ) {\n        * ( charPtr + spaces ) = ' ';\n    }\n    // string is\
    \ made null-terminated.\n    * ( charPtr + MAX_COLUMNS ) = '\\0';\n```"
