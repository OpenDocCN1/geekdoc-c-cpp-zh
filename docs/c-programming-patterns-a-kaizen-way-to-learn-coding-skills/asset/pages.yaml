- pgno: 19
  md: '# Implementing Kaizen model for logic building skills


    +   - Start a topic and learn till you reach a point where you are ready to analyse
    a solved example. Concentrate on that example till you get a feel that you have
    understood everything about the program.


    +   - Then try to implement that solved example without referring it. Make a strong
    will that once you start implementing already studied program, you are not going
    to refer it back that particular solved program. You can refer theoretical explanation
    but not program. There are lot of chances that you may get many error syntactically
    or logically as well. In that situation, you can refer theoretical explanation
    about the concept but do not allow yourself to see the solution. Try your best
    to resolve issues by yourself referring theoretical explanation.


    +   - Please maintain an excel or spreadsheet file to note down the errors you
    encountered in a program. When you yourself able to resolve the errors, please
    note down the reasons also why you have adopted that approach. Also, what you
    thought previously and afterwards you faced that particular logical error.


    +   - Every new day when you want to start your learning, please have a quick
    look to your error file that you were maintaining every time, you implement the
    solved program when encountered any error(s). Referring back to those errors while
    learning every new day will help to do better next time and it will also helps
    you to quickly revise the concept. We should maintain this practice to avoid common
    logical errors so those errors should not become part of our habit. So it is good
    to correct those loopholes in the beginning itself, since breaking a habit consumes
    sufficient efforts. What we practice, that will become our habit whether good
    or bad. Here, we are trying to **convert failures into lessons**. It is more rewarding
    when we get improved from mistakes as early as possible so that we can invest
    more time learning other important subjects in our life.


    +   - If two times you are able to solve all the solved examples from the book
    back to back without referring to the solutions, then you will be in a better
    position to write program effectively.


    +   - Hints are there for unsolved problems in the explanations of solved exercises.
    If you are unable to solve unsolved problem, just try 2-3 attempts and move forward
    to complete the book. Come back again and try to attempt the remaining ones.


    +   - Two times back to back, if you are able to solve all the solved exercise
    without referring to the solutions and also unsolved problems, then logic wise
    you will be in a very comfortable position. You will get the courage to build
    programming logic for more difficult level and can be able to deal other heavier
    subjects of programming like data-structures and design of algorithms with confidence.


    # Repeat the above **kaizen(continuous improvement) model**

    to produce solutions, _single attempts_ for all programs with

    **<u>0 defect</u>**.


    > > The GREAT aim of education is not knowledge but action.

    > >

    > > — Herbert Spencer'
