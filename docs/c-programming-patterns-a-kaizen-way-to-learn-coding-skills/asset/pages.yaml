  md: "# Strings\n\nIt is common programming practice to modify or manipulate text\
    \ in some way. Some of the examples are dynamically creating web-page url addresses\
    \ or file paths, extracting specific information from different kinds of file\
    \ like text files/PDFs/HTML, developing web-scrapping tools that extract text\
    \ from web-pages. Every programming language provides in-built string libraries\
    \ for string manipulation. We will experiment with some of commonly used in-built\
    \ string methods or functions.\n\n# String concatenation\n\nWe can output a resultant\
    \ string by joining one string with another using in-built strcat method or function\
    \ and this process is known as concatenating strings. The string library to use\
    \ is;\n\n```\n#include <string.h>\n\nchar *strcat( char target, const char *source\
    \ );\n```\n\nThis method appends source_string to the target string.\n\n# StringConcat.c\n\
    \n```\n#include <stdio.h>\n#include <string.h>\n\nint main() {\n    char name[20]\
    \ = \"Steve\" ; // target string\n    // appends target string to source string\n\
    \    strcat( name , \" Jobs\");\n    printf(\"%s \\n\", name);\n    return 0;\n\
    }\n```\n\n# Output\n\nSteve Jobs"
