- pgno: 27
  md: 'Please stick to the following points and do revise it before you start writing
    programs.


    ![](img/67765455776ddeb6395161cd553ecd87_27_0.png)


    The space in memory location can be expressed in terms of byte units. So the size
    of primitive data types too can be expressed in terms of bytes to store the value.
    (**Note: - 1 byte = 8 bits.**)


    | Data type | Size | Minimum Value | Maximum Value | Default Value |

    |---|---|---|---|---|

    | byte | 1byte | -128 | 127 | 0 |

    | short | 2bytes | -32768 | 32767 | 0 |

    | int | 4bytes | -2,147,483,648 | 2,147,483,648 | 0 |

    | long | 8bytes | -9,223,372,036,854,775,808 | 9,223,372,036,854,775,808 | 0 |

    | float | 4bytes |  | upto 6 to 7 decimal digits | 0.0f |

    | double | 8bytes |  | upto 15 decimal digits | 0.0d |

    | char | 2bytes |  | 65536 characters | ''\u0000'' or " (single space) |

    | boolean | 1-bit | true or false (Only two possible values) |  | true or false
    |


    # What is there in the variable’s name?


    We know that in geographical maps, the locations can be represented as combination
    of longitude & latitude. Think for a moment if our city, town, street places are
    replaced by longitude and latitude values, how much it will become difficult to
    use it in our normal communication. So the choice of variable should be a meaningful
    name and must indicate some purpose associate with it. It is not uncommon to find
    such programmers who has this special SLVNS sickness.


    # What is SLVNS sickness?


    **SLVNS** stands for **Single Letter Variable Name Syndrome**. Many programmers
    has this special habit of creating suspense through name of a variable. They allocate
    just a single letter for variable’s name in writing programs. When such program
    become lengthy and someone else has to fix a bug/error for that programming code,
    it will surely turned out to be irritating experience. Even such **SLVNS** programmers
    may find it difficult to get his/her own programming logic quickly on revisiting
    after a gap of time. If you find those programmers, please request them to leave
    this habit, *it is an offence*. Please prevent yourself from this sickness and
    **be patient to write meaningful variable name.**


    > Mind it, Better You Mind It.'
