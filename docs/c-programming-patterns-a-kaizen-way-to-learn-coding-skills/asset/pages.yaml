  md: "# Stack and function calls\n\nStack literally means arranging items on top\
    \ of another. A pile of books as shown in the picture is an example of stack.\
    \ If we want a book from this stack, we need to start removing book from the top\
    \ and then get the actual one. This is called last-in-first-out or in short LIFO\
    \ method. Stack is a memory area in a RAM where data are added and removed in\
    \ LIFO style. When a method is called, data stored in a variable(s) push into\
    \ the top of the stack and data pop-out or get removed when the execution of called\
    \ function ends.\n\n![](img/67765455776ddeb6395161cd553ecd87_351_0.png)\n\nSuppose\
    \ our main method calls the function swap. Then the stack-frames get developed\
    \ into the stack memory area. Each stack-frame represents a functional call whose\
    \ execution is yet to be completed.\n\n**Assumptions:** The size of int data type\
    \ is 4 bytes.\n\nThe program control is represented by ►\n\n```\n#include <stdio.h>\n\
    \n// function prototype\nvoid swap(int, int );\n\nint main() {\n    // local variables:\n\
    \    firstNum, secondNum\n    int firstNum = 9;\n    int secondNum = 10;\n\n \
    \   // actual arguments:\n    firstNum, secondNum\n    swap( firstNum, secondNum\
    \ );\n    return 0;\n}\n// formal parameters :\n// firstNo and secondNo\nvoid\
    \ swap(int firstNo, int secondNo) {\n    int emptyVar = 0;\n    --------\n}\n\
    ```\n\n| Code | Stack |\n|------|-------|\n| #include <stdio.h> ... void swap(...)\
    \ { ... } | Stack frame for main()  ? firstNum  1000  UPWARD GROWING STACK |\n\
    \nWhen program starts executing the stack frame for the method main() gets created\
    \ on to the stack memory area.\n\nWhen program control reaches variable declaration\
    \ as;\nint firstNum\n\nThe variable firstNum is pushed into the stack represented\
    \ by memory address 1000 and data can be any garbage value(?).\n\nIn the assignment\
    \ operation given as follows;\nint firstNum = 9;\n\nThe left side of = represent\
    \ a memory location.\nThe right side of = represents data on that memory location"
