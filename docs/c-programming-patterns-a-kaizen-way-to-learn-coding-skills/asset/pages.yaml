- pgno: 14
  md: "# Introduction\n\nWithout a doubt every subject has some key fundamental basis.\
    \ If key concepts of any subject are truly internalize then the rest of the learning\
    \ will be productive.\n\nMany novice programmer and many frustrated programmers\
    \ do ask similar kind of questions which are as follows:\n\n> “How to learn programming?”\n\
    > \n> “How to develop logic building skill?”\n> \n> “How to learn coding?”\n>\
    \ \n> “How to improve programming logic?”\n\nProgramming is an applied field.\
    \ In my opinion if a programmer who is weak in programming logic is not a programmer\
    \ even. We know that complaining is the easiest job and if someone is expert in\
    \ that haven’t actually achieved anything big. Whenever there is a problem, we\
    \ just need to think **“what could be the easiest possible way out?”**\n\nIn order\
    \ to become confident in any programming language, the first step should be to\
    \ gain some level of proficiency to self-hack programming logic. This technical\
    \ manual is totally dedicated to a non-programmer/beginner or intermediate students\
    \ who are just tired of hitting hard on many different places in order to become\
    \ confident in programming. Additionally, if you are among those who got limited\
    \ time to learn programming, this is the guide that can serve you well too. **So\
    \ the rule of the thumb is, in order to learn programming language fast and properly,\
    \ first learn the tactics of programming logic sufficiently.**\n\n![](img/67765455776ddeb6395161cd553ecd87_14_0.png)\n\
    \nThe most common mistake that many non-programmers/absolute beginners or trainers\
    \ does is that they focus more on grammar/syntax and feature(s) of the programming\
    \ language. Such shallow outlook about programming language doesn’t help beginners\
    \ much. Computer science is an applied field to solve practical problems. It is\
    \ foremost and essential need that a beginner should get trained sufficiently\
    \ in area of programming logic skills at the first priority. How does an appropriate\
    \ physical exercises and healthy food tones the body muscles, similar it goes\
    \ with developing programming logical skills. It does need right kind of logic\
    \ based programming exercises to groom visualization of programming logic."
  merge: -1
  img_proc: true
- pgno: 15
  md: "It also happens that a beginner may know almost all the concepts of programming\
    \ language but still feels something is missing. That missing element is due to\
    \ insufficient logic building capabilities. Without a comfortable level of logic\
    \ building skills, the beginner struck a lot and, on top of that, they face lot\
    \ of confusions while developing programs.\n\n# The Right Attitude\n\n> *Failure\
    \ taught me things about myself that I could have learned no other way.*\n> \n\
    > - J.K. Rowling\n\nBy default children are not afraid to be wrong and so they\
    \ are creative. It's well said **hiding mistakes is a mistake of higher order**.\
    \ So it is always good to notice our mistakes as early as possible so that it\
    \ shouldn't give a hard blow in the future during the much needed time.\n\nExperimenting\
    \ and learning from mistakes work like a some sort of body detoxification program.\
    \ Initially, any detoxification program doesn't tastes nice but still person go\
    \ for it because that person will love to see the way the body will go to respond\
    \ after 2-3 weeks. Anything new that we do take some practice. Everything that\
    \ is valuable has a cost associated with it. Failures are one such type of cost\
    \ that are to be paid to learn and to remember lessons.\n\nGetting accurate output\
