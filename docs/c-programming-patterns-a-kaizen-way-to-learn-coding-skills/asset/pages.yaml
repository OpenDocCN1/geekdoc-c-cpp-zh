    The condition (col >= (totalRows – row)) gives the minimum limit, a starting point
    from which it will start printing star(*) character(s) till the maximum value
    of variable col which is (totalRows + row).


    The if-condition can be given for between the range of values


    (totalRows - row ) and (totalRows + row) using the comparison and logical operators
    as:


    ```

    If ( col >= ( totalRows - row ) && col <= ( totalRows + row ) )

    ```


    We already know that;


    Variable col = 1,2,3,4,...,9 or 1,2,3,4,..., ( totalRows + row )


    Variable row = 4,3,2,1,0 or (totalRows – 1),3,2,1,0


    We can eliminate the logical AND(&&) condition( col <= ( totalRows + row ) ) in
    the if-condition to print the star(*) characters.This logical AND(&&) condition
    already been considered as the upper_limit in the loop-condition for column level
    inner for-loop. So the if-condition will now reduce to the following.


    If ( col >= (totalRows - row ) )It will allow to print star(*) character when
    result of if-condition''s expression is true or else will prints the space character.
    We generalised the non-repeating numeric pattern of the column max_val into an
    expressions. We can now define column level for-loop.'
