- pgno: 78
  md: "*ProblemLadderIfElse:* A college came up with an idea to encourage CS students\
    \ by refunding some percentage of their bi-semester CS Course fees. College management\
    \ laid the following conditions to be eligible for the same. Moreover, if a student\
    \ scored in Grade-0, will be declared failed.\n\n+   - If a student scored in\
    \ Grade-5, will be eligible for 35% refund of the college fees.\n+   - If a student\
    \ scored in Grade-4, will be eligible for 25% refund of the college fees.\n+ \
    \  - If a student scored in Grade-3, will be eligible for 20% refund of the college\
    \ fees.\n+   - If a student score scored in Grade-2, will be eligible for 10%\
    \ refund of the college fees.\n+   - If a student scored in Grade-1, will be passed\
    \ with margin.\n\n# LadderIfElse.c\n\n```\n```c\n#include <stdio.h>\nint main()\
    \ {\n    int grade = 2;\n    if(grade == 1) {\n        printf(\"35%% fee refund.\"\
    );\n    }else if(grade == 2) {\n        printf(\"25%% fee refund.\");\n    }else\
    \ if(grade == 3) {\n        printf(\"20%% fee refund.\");\n    }else if(grade\
    \ == 4) {\n        printf(\"10%% fee refund.\");\n    }else if(grade == 5) {\n\
    \        printf(\"Passed with margin.\");\n    }else if(grade == 0) {\n      \
    \  printf(\"Failed,please retry.\");\n    }else {\n        printf(\"Invalid grade\
    \ ? \" + grade);\n    }\n    return 0;\n}\n//Note:- %% double percentage symbols\
    \ are used to print %\n```\n```\n\n# Output\n\n25% fee refund.\n\nIt’s going to\
    \ test if-conditions sequence-wise, unless and until some if-condition becomes\
    \ true.\n\nThis type of many else-if is also called as ladder else-if, which is\
    \ basically not a good practice.\n\nWhen two or three else-if condition are used,\
    \ is considered to be okay and further more else-if conditions are strongly discouraged\
    \ as it reduces the code readability.\n\nThen what is the way-out?\n\nThe answer\
    \ is switch-case construct."
  merge: -1
  img_proc: true
