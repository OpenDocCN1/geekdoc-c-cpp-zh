  md: "# Pointers And Memory Matters\n\nPointers are famously known as address variables\
    \ as their only purpose is to store memory address of a data not the data itself.\
    \ Pointer variable's name starts with asterisk(*) character. For example;\n\n\
    ```\ndata_type *dataPointer ;\nint *intPtr; // pointer variable of type integer\
    \ data-type\n```\n\n| CONCEPTUAL LAYOUT OF A POINTER VARIABLE |\n|---|---|---|---|\n\
    | data-type | *pointer_variable_name | = | Memory Address of a variable matching\
    \ data-type |\n| | | | Memory Address of pointer_variable_name |\n\nLet, the 4\
    \ digit number depicts the memory locations of our main memory.\n\n| Memory (RAM)\
    \ |\n|---|---|---|---|---|\n| Heap | | | | |\n| | | | | 8014 |\n| 5264 | 5866\
    \ | | | |\n| | | | | |\n| 7085 | | | | |\n| | | | 7088 | 9244 |\n| Stack | main()\
    \ | | | |\n| 0 | 1 | 5 | .................... | NULL |\n| 1024 row | 1026 col\
    \ | 1028 totalRows | .................... | 2048 intPtr |\n| | | | | |\n| Code\
    \ | Program will get converted into machine code after compiler compiles the programming\
    \ code. This machine code then gets loaded into this area. Actual code is shown\
    \ for understanding purpose as machine code is not easy to grasp. | | | |\n\n\
    ```\n#include <stdio.h>\nint main() {\n    int row = 0;\n    int col = 1;\n  \
    \  int totalRows = 5;\n    int *intPtr = NULL; // pointer variable\n    return\
    \ 0;\n}\n```"
