  md: 'Let’s consider two attributes rows and columns of a 2-dimensional pattern as
    variables;


    +   - **row** → variable <i>type_of_integer</i> to store integer value one at
    a time and represents row number between 1 and 9.

    +   - **col** → variable <i>type_of_integer</i> to store integer value one at
    a time and represents column number between 1 and 9.

    +   - **spaces** → variable <i>type_of_integer</i> to store integer value one
    at a time and represents space character at column number between 1 and 5.

    +   - **totalRows** → variable <i>type_of_integer</i> to store integer value for
    total number of rows <i>which is 5 by default</i>.


