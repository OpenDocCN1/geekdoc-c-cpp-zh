    | For row = 4<br>Print "*" twice in the same 4th row<br>then move to row number
    5 | * * * * *<br>* * * *<br>* * *<br>* *<br>→ (arrow points to row 5) |

    | For row = 5<br>Print "*" once in the 5th row<br>then move to row number 6 |
    * * * * *<br>* * * *<br>* * *<br>* *<n>*<br>→ (arrow points to row 6) |


    # *Let''s convert steps into C program.*


    | Use of C in-built method | |

    |---|---|

    | In order to move cursor to the next row | printf("\n") ; |

    | In order to move cursor and to print "*" character in the same row | printf("*");
    |


