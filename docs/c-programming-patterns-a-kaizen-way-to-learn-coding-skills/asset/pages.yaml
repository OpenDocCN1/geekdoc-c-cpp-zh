  md: '# Arrays


    Till now we had deal with variables which deals only with single data. In short;


    | Relationship between variable and data |

    |---|---|---|

    | Variable | one – to – one | Data |


    It is also possible to have relationship between variable and data as one-to-many,
    which means one variable can able to hold many data or group of data. Such type
    of variables specially known as array variables.


    | Relationship between array variable and data |

    |---|---|---|

    | Array Variable | one – to – many | Data1 |

    | | | Data2 |

    | | | Data3 |

    | | | Data4 |


    We too can initialize array variable like we used to initialize a normal variable
