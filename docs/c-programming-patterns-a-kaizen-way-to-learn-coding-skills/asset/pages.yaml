  md: '# *Approach to solution1*


    The overall observation is that at each row, either it’s printing space characters
    or star (*) characters in a continues fashion.


    The columns in the pattern divided into two parts, either it’s printing space
    “ ” character(s) or star(“*”) characters. These comma separated values given in
    the table basically represents the column positions where space and star character(s)
    are placed.


    | Logic Trace Table |  |  |  |  |  |

    |---|---|---|---|---|---|

    | **Row level Repetitive Action** | **Column level Repetitive Action** |  | **Character
    count** | **Total Characters** | **Expected Output** |

    | Variable: row | Variable: col spaces |  |  |  |  |

    | 1 | 1,2,3,4 | 5 | 4 Spaces + 1 star | 5 | * |

    | 2 | 1,2,3 | 4, 5,6 | 3 Spaces + 3 stars | 6 | * * * |

    | 3 | 1,2 | 3, 4, 5,6,7 | 2 Spaces + 5 stars | 7 | * * * * * |

    | 4 | 1 | 2, 3, 4, 5,6,7,8, | 1 Space + 7 stars | 8 | * * * * * * * |

