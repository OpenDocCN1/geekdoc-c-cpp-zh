    \ }\n        printf(\"Please Join Us...!!!\\n\");\n        if( cnt == 5 ) {\n\
    \            printf(\"keyword{break} at cnt = %d\\n\", cnt);\n            break;\n\
    \        }\n        printf(\"Please look back...\\n\" );\n    }\n    return 0;\n\
    }\n```\n\n# Output\n\nkeyword(continue) is throwing control of program back.\n\
    keyword(continue) is throwing control of program back.\nkeyword(continue) is throwing\
