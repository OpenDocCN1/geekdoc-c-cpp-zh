  md: "# Analysis of output\n\nIn general, three repetitive action takes place.\n\n\
    +   a) Printing of alphabets starting from A in incrementing order.\n+   b) Printing\
    \ of spaces\n+   c) Printing of alphabets in decrementing order and it's upper\
    \ limit will start from last updated incremented value.\n\nSo in an increment\
    \ value order of Unicode we can get alphabets. We can verify this from following\
    \ program which prints all 26 alphabets, capital or small along with Unicode.\n\
    \n| Capital Alphabets | Unicode | Small Alphabets | Unicode |\n|---|---|---|---|\n\
    | A | 65 | a | 97 |\n| B | 66 | b | 98 |\n| ...... | ...... | .... | .... |\n\
    | Z | 90 | z | 122 |\n\n# UniCodeToAlphabets.c\n\n```\n#include <stdio.h>\nint\
    \ main() {\n    printf(\"Alphabets and it's equivalent unicode.\\n\" );\n    printf(\"\
    ----------------------------------------\\n\");\n    for ( int cnt = 0; cnt <\
    \ 26; cnt++ ) {\n        int unicodeCap = ( 65 + cnt );\n        int unicodeSmall\
    \ = ( 97 + cnt );\n        printf(\"%c = %d | \", unicodeCap,unicodeCap);\n  \
    \      printf(\"%c = %d\\n\", unicodeSmall,unicodeSmall);\n    }\n    return 0;\n\
    }\n```\n\n# Output\n\nAlphabets and it's equivalent unicode.\n----------------------------------------\n\
    A=65  | a=97\nB=66  | b=98\nC=67  | c=99\nD=68  | d=100\nE=69  | e=101\n......\n\
    ......\nV=86  | v=118\nW=87  | w=119\nX=88  | x=120\nY=89  | y=121\nZ=90  | z=122"
