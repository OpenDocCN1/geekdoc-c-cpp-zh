    | **For row = 3** Print space " " **2 times** in the same 3ʳᵈ row. Print star
    "*" **3 times** in the same 3ʳᵈ row then move to the next row number 4. | (image:
    dotted grid; three `*` symbols in row 3, columns 3, 4, and 5; first two cells
    of row 3 outlined; blue arrow points to row 4) |

    | **For row = 4** Print space " " **1 time** in the same 4ᵗʰ row. Print star "*"
    **4 times** in the same 4ᵗʰ row then move to the next row number 5. | (image:
    dotted grid; four `*` symbols in row 4, columns 2, 3, 4, and 5; first cell of
    row 4 outlined; blue arrow points to row 5) |

