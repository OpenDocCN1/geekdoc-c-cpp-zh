- pgno: 175
  md: 'Let the following are the two versions of column level for-loop printing star
    (“*”) character(s).


    **Column level for-loop_1** for printing star characters // *inner* for-loop


    **Column level for-loop_2** for printing star characters // *inner* for-loop


    We can summarise it as:


    | Prints a star for every value of variable row |

    |---|

    | row=1 |

    | row=2 |

    | row=3 |

    | row=4 |

    | row=totalRows |

    | .............. |

    | row= (2*totalRows - 1) |


    If ( condition<( col <=totalRows ) is True)


    &nbsp;&nbsp;&nbsp;&nbsp;Print star character using Column level for-loop_1


    &nbsp;&nbsp;&nbsp;&nbsp;Else


    &nbsp;&nbsp;&nbsp;&nbsp;Print star character using Column level for-loop_2


    Flowchart: Diamond `col <=totalRows` — branch `True` → oval `Print star character
    using for-loop_1`; branch `False` → oval `Print star character using for-loop_2`


    We can now define these two column level for-loop.


    **Elements of Column level for-loop_1**


    | Element | Value |

    |---|---|

    | min_val | 1 |

    | max_val | totalRows |

    | variable_name | col |

    | statement(s) | printf("*"); |


    **Elements of Column level for-loop_2**


    | Element | Value |

    |---|---|

    | min_val | 1 |

    | max_val | 2*totalRows - row |

    | variable_name | col |

    | statement(s) | printf("*"); |'
