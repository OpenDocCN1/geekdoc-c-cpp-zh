  md: "Let's implement a recursive function call based program to print a diamond\
    \ pattern.\n\n# RecursiveDiamondPattern.c\n\n```\n```c\n#include <stdio.h>\n\n\
    /* function declaration */\nvoid outerLoop( int row, int totalRows );\nvoid nestedLoopLowerHalf(\
    \ int col, int row, int totalRows );\nvoid nestedLoopUpperHalf( int col, int row,\
    \ int totalRows );\n\nint main() {\n\n    int totalRows = 7;\n        outerLoop(1,\
    \ totalRows);\n    return 0;\n}\n\n    void outerLoop( int row, int totalRows\
    \ ) {\n    // for every row , col = 1,... and hence 1 value as a parameter.\n\
    \        int col = 1;\n\n            // Row level Repetitive Action : printing\
    \ single row.\n            if ( row <= (2 * totalRows - 1) ) {\n\n           \
    \     // Action1.Execute's Column level Repetitive Action\n\n                //\
    \ 1st half\n                if ( row <= totalRows ) {\n                    nestedLoopUpperHalf(col,\
    \ row, totalRows);\n                }\n                // 2nd half\n         \
    \       if (row > totalRows ) {\n                    nestedLoopLowerHalf(col,\
    \ row, totalRows);\n                }\n                printf(\"\\n\"); // Action2.Move\
    \ cursor to next row.\n            } else {\n                return;// recursive\
    \ call terminating condition\n            }\n            // next recursive call\
    \ for the next row.\n            outerLoop(row + 1, totalRows);\n    }\n\n   \
    \ void nestedLoopUpperHalf( int col, int row, int totalRows ) {\n        // recursive\
    \ call terminating condition\n        if ( !(col <= (2 * totalRows - 1)) ) {\n\
    \            return;\n        }\n\n        if ( (col <= (2 * totalRows - 1)) {\n\
    \            if ( col >= (totalRows - row + 1) &&\n                col <= (totalRows\
    \ + row - 1) ) {\n                    printf(\"* \");\n            } else {\n\
    \                printf(\"  \");\n            }\n        }\n```\n```"
