  md: "# Recursion: Repeat without looping\n\nIn *for-loop*, the same piece of code\
    \ which is enclosed in for-loop’s code block gets repeated until the condition\
    \ to repeat it becomes false. We can able to get similar kind of affect using\
    \ function and function calls. We know that a function can call other function(s)\
    \ as not to repeat the same piece of code or set of programming instructions again\
    \ and again. In case, if we do the opposite and repeat the same piece of code\
    \ again and again by calling the same function then this process is known as **recursion**\
    \ and function is known as **recursive function**. Moreover, like in most of repetitive\
    \ processing we tried to maintain a **terminating condition** so that after which\
    \ it should stop working. Similarly, we are required to give a terminating condition\
    \ in order to end the motion of recursive function calls. You need to maintain\
    \ a simple format to write recursive function which is given as follows;\n\n```\n\
    recursiveFunction( startValue, parm1,param2,...){\n    1.Write terminating condition\
    \ which is just opposite to how you write\n    loop-condition /update-condition\
    \ in a for-loop\n    2. Write your programming logic.\n        Pass all the required\
    \ variables as parameters ( parm1, param2,... ) in this functional\n        call\
    \ which are used in writing programming logic.\n    3.recursiveFunction( nextValue,\
    \ parm1,param2...);\n}\n```\n\nLet’s implement a recursive function call program\
    \ to print number in ascending order.\n\n# RecursiveLoopIncrement.c\n\n```\n#include\
    \ <stdio.h>\n\n/* function declaration */\nvoid loopInc(int counter, int totalRows);\n\
    \nint main() {\n    // number of rows\n    int totalRows = 10;\n    // recursive\
    \ function call to print number in an incremental order\n    loopInc( 1, totalRows\
    \ );\n    return 0;\n}\n\nvoid loopInc(int counter, int totalRows) {\n    // terminating\
    \ condition\n    if ( counter > totalRows ) {\n        return;\n    }\n    //\
    \ programming logic\n    if ( counter <= totalRows ) {\n        printf( \"%d\\\
    n\", counter );//print to console\n    }\n    // tail recursive call\n    loopInc(\
    \ counter + 1, totalRows );\n}\n```"
