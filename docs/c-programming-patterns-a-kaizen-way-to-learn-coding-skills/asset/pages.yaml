- pgno: 105
  md: '# Outputting Simple Picture on Computer Screen


    The key point here is to understand that the computer screen is nothing more than
    a logical collection of small boxes where individual small box can output individual
    character. These boxes are arranged in such a way to give a clear idea about rows
    and columns. Following is the conceptual diagram of computer screen showing some
    rows and columns of a simple picture outputted into the computer screen. Each
    keyboard character is in one of the single smallest boxes.


    ![](img/67765455776ddeb6395161cd553ecd87_105_0.png)


    Before we begin programming with simple picture-based exercises, we must first
    learn to conceptually allocate row number and column number. This will give justice
    to uniquely identify each smallest box with a singular keyboard character. The
    **(row number, column number)** numeric combination will imply a single keyboard
    character. Mentioning (row number, column number) numeric combination simply assign
    a reason to locate correctly, any keyboard character on the computer screen. It
    is quite analogous to locating a city on the geographical map using **(longitude,
    latitude)** combination. Hence, our version of single smallest box maps to a single
    keyboard character on the computer screen and equivalently maps to a unique (row
    number, column number) numeric pair. In this way, the collection of (row number,
    column number) numeric pairs can be used to represent a simple picture completely.


    **Single Smallest Box → Single keyboard character → (row number, column number)
    numeric pair.**


    ![](img/67765455776ddeb6395161cd553ecd87_105_1.png)'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'Alternately, we can think of the computer screen as a sophisticated version
    of graph paper or grid paper. Each smallest box of the computer screen is a coordinate,
    a unique combination of two numbers, an "X (Columns)" (horizontal) and a "Y(Rows)"
    (vertical) - that determines the location of a keyboard character in computer
    screen space.


    It is our programming job, how can a simple picture-based pattern should appear
    at these smallest box coordinates represented by (row number, column number) numeric
    pairs.


    ![](img/67765455776ddeb6395161cd553ecd87_106_0.png)


    ![](img/67765455776ddeb6395161cd553ecd87_106_1.png)


    As discussed previously, we can represent any 2-dimensional simple picture in
    terms of rows and columns on the computer screen. So, such simple picture which
    are made up of keyboard characters can be completely caged into collection of
    small boxes. Each keyboard character of a considered simple picture can have a
    unique (row number, column number) numeric pair. Hence, the collection of such
    numeric pairs, then can totally represent a complete simple picture.


    The collection of related unique (row number, column number) numeric pairs of
    this simple picture can be given as;


    +   - (2,2), (2,3), (2,4), (2,5)

    +   - (3,3), (3,5), (4,4), (4,5),

    +   - (5,5)


    | | Col=1 | Col=2 | Col=3 | Col=4 | Col=5 |

    |---|---|---|---|---|---|

    | Row=1 | | | | | |

    | Row=2 | | *(2,2) | *(2,3) | *(2,4) | *(2,5) |

    | Row=3 | | | *(3,3) | | *(3,5) |

    | Row=4 | | | | *(4,4) | *(4,5) |

    | Row=5 | | | | | *(5,5) |


    # Cursor Movement


    A moving position-indicator shown on a computer monitor where the next move or
    operation will occur. We will use this concept to explain better how each character
    of a pattern got generated on the computer screen or console screen of the programming
    IDE. In our case, keyboard characters are to be outputted using C inbuilt libraries
    onto the computer screen at specific locations. So the cursor movement to the
    next position on the screen and then printing of character will be taken care
    by C inbuilt methods.'
