    Let use decrementing for-loop with range 4 to at the row level repetition.


    This is in order to match the part of the expression of variable col''s columns
    min_val & max_val.


    Using variable row to generalise the variable col''s columns min_val & max_val.


    | Row level Repetitive Action | Expected Output |

