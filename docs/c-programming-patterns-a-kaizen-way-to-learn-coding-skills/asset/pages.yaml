    # If-else Shortcut


    Short-cut in any matter is a special case to be applied in a specific situation.
    Not only in subject of programming people unknowingly confuse themselves simply
    by the fact that they choose a special case and tried to apply it commonly. Even
    in choice of words, two words may give almost similar meaning and when we actually
    apply those in different situations then only we will be in a position to explore
    it’s true potential meaning.


    The shortcut to if-else option is there in almost every programming language which
    is also known as **ternary operator** and is given by the symbol (:).


    # When to apply if-else shortcut


    The ternary operator is a sort of syntactic sugar for if-else statements usually
    applied in a situation where both **if-block** and **else-block** assign different
    value to the same result variable. For example, let’s suppose that if-else statement
    is something like the following:


    | If-else statement | If-else shortcut or ternary operator (:) |

    |---|---|

    | `If( condition){`<br>&nbsp;&nbsp;&nbsp;&nbsp;`result = one_value;`<br>`}else{`<br>&nbsp;&nbsp;&nbsp;&nbsp;`result
    = other_value;`<br>`}` | `result = (condition)? one_value : other_value ;` |

    | Simple if-else can be easily replaced by the use of **if-else shortcut** represented
    by the one liner **ternary operator**. In such situations only it makes true sense
    to use ternary operator to increase code readability. | • Two outcome result values
    are possible which are separated by a symbol colon (:).<br>• If **condition**
    is **true**, then *one_value* will get assigned to the variable result.<br>• If
    **condition** is **false**, then *one_value* will get assigned to the variable
    result. |'
