  md: '# Call by Reference


    In certain situations of programming requirement accessing data using memory address
    using pointer variable is favoured than accessing data directly using local variable.
    Let’s assume there are many methods in a program. Many methods in a program can
    access the latest content/data of a particular variable by referring to the memory
    address of a variable with the help of a pointer variable. This particular variable
    is local to the main() method and whose data may get regularly updated in many
    methods. In case, suppose many methods on different occasions needed a latest
    updated value of this particular main() method’s local variable. We know that
    in call by value functional call strategy, the called method works on the copy
    of the variable’s data passed via formal arguments. When the execution of called
    method ends it has no impact on the values of variables which are passed as actual
    arguments.


    # How to update the values of actual arguments whose values got changed in a called
    method?


    If there is a single variable, a called method may return a value and callee method
    will update it with the returned value. If more than one variable is to be updated,
    we may return many values using an array variable. Now, without returning any
    value(s) from calling method, how to update callee method’s local variables values.
    So the trick will be, a pointer variable should be used for each method parameter
    instead of normal variable. We need to pass the memory location of a variable
    instead of passing the copy of the value of a variable as already done in the
    call by value functional call strategy. This way many methods can get access to
    the most updated data of a particular variable which might got changed many times
    by different methods in a program.


    ![](img/67765455776ddeb6395161cd553ecd87_360_0.png)'
