- pgno: 379
  md: "# Programming Pattern Using Pointer\n\nIn most of the case related to arrays,\
    \ memory remains unused. The C library does provides a facility to allocate memory\
    \ as per our exact memory allocation demands. Such dynamic memory allocation functions\
    \ are declared in the <stdlib.h> header. For example;\n\n```\nint totalRows =\
    \ 5;\n\nchar *charPtr;\n\ncharPtr = (char *)malloc( sizeof(char) * (totalRows\
    \ + 1) );\n```\n\nmalloc or memory allocation method is used to dynamically allocate\
    \ a single large block of memory with the given specified element_count and data-type.\
    \ In this example data-type is char and elements are 5 and require 1 more extra\
    \ byte of memory for string termination by NULL. So in total it will be (totalRows\
    \ + 1) and this suggests (1 * 6 or 6 ) bytes of memory block.\n\n| 6 bytes | byte\
    \ | byte | byte | byte | byte | byte |\n|---|---|---|---|---|---|---|\n| Index\
    \ | 0 | 1 | 2 | 3 | 4 | 5 |\n| Address | 1024 | 1025 | 1026 | 1027 | 1028 | 1029\
    \ |\n\ncharPtr will hold the address of the first element in the allocated memory\
    \ block.\n\n```\n// string is made null-terminated at 6th byte after\n// allocating\
    \ characters in first 5 bytes.\n\n*( charPtr + 5 ) = '\\0';\n```\n\nIn general;\n\
    \n```\ndataType *dataTypePtr = (dataType *)malloc( sizeof(dataType) * count );\n\
    ```\n\nIf the memory is insufficient, then allocation will fail and will returns\
    \ a NULL pointer.\n\n```\n// checking if memory block allocated or not.\nif (\
    \ charPtr == NULL) {\n    printf(\"malloc failed.\\n\");\n    exit(0); // terminate\
    \ the program.\n}\n```\n\nIn order to de-allocate the allocated memory, we can\
    \ use method free from <stdlib.h> header.\n\n```\n// freeing the allocated memory\n\
    free( charPtr );\n```"
  merge: -1
  img_proc: true
