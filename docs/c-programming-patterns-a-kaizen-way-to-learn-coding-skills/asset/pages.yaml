  md: '# Nested Loop: Beginner Programmer''s Best Friend


    Best friend is a person not only who appreciates our good quality but also gives
    reality check by showing our weaknesses or mistakes whenever it is required. Nested
    loop plays such best friend''s role while learning programming logic and it also
    gives a reality check how much true is our programming logic. This is my personal
    opinion that **practising a programming logic just by juggling with numbers is
    not a good idea** and specially for a person who had a less or no inclination
    towards higher school mathematics. Many of them feel bored to practice on such
    mathematical problems in order to learn skill of programming logic.


    Everybody is different and everyone has a different buffer of patience and pace
    of learning. There should be a simple to understand approach. Any beginner who
    want to learn/improve programming should be able to do it with his own learning
    pace on the backdrop of minimal technical stuff.


    It is broadly three-step learning process on pictorial based exercises so that
    beginners get comfortable in the programming.


    +   - **Step1.** Clarity about how logical condition is to be explored.

    +   - **Step2.** Clarity about how nested loop works. This is our next major hands-on
    training.

    +   - **Step3.** Finding a scope to improve implemented program so that programming
    logic can be further simplified. Looking for alternate possible solutions.


    After going through these three steps, anyone will be in a confident position
    to learn and explore advanced features of programming language.


    # *Why nested loops are such an important deal?*


    The outer for-loop and inner for-loop, each one are used for outputting data in
    different direction horizontally and vertically to give a 2-dimensional output.
    Usually outer for-loop moves the control vertically and inner for-loop outputs
    the data horizontally. This gives a grid kind of output. This particular feature
    of looping can be utilized to perfect the imagination of the learner. Yes, logic
    building is a skill and can be developed using simple maths and common sense.
    It''s not a must for a person to be very good in maths in order to be a successful
    programmer or software developer. If a learner is able to imagine the behaviour
    of outer and nested loop correctly, the person will gain enough confidence that
    he/she can code.


    The first and foremost requirement for any subject related teaching is to first
    create interest about the subject among the student or learner group. If a learner
    gets deeply connected with the subject than rest of the learning with be without
    burden. Learner will enjoy learning and this course is'
