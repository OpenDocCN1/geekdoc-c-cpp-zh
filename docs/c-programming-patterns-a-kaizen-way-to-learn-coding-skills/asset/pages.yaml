- pgno: 68
  md: "# Decision making\n\nThere are only two perfect answers in this world either\
    \ YES or NO. In programming these perfect answers are represented by boolean data\
    \ type. The boolean data type can take only single value at a time which is either\
    \ true or false. So boolean value true is represented by YES and boolean value\
    \ false is represented by NO. While running the program, the control of program\
    \ may find logical expression. This logical expression is then evaluated to find\
    \ the result. The result is expressed in terms of either true or false. Based\
    \ on the boolean result of logical expression the control of program decides whether\
    \ to execute bunch of programming statements or bypass it.\n\nSuch kind of decision\
    \ making has to be programmed by using following different versions of decision\
    \ making if-statements.\n\n+   a) If-statement\n+   b) If-else statement\n+  \
    \ c) If-else if ...statement (Also known as ladder if-else statement)\n\nFlow-chart\
    \ helps to visualize the flow of control when condition becomes either true or\
    \ false.\n\n# a) if-statement\n\n![](img/67765455776ddeb6395161cd553ecd87_68_0.png)\n\
    \nThe general syntax for if-statement can be given as:\n\n```\nIf (condition)\
    \ {\n    execute statement(s);\n}\nnext statement(s); // continue program execution\n\
    ```\n\n+   - condition: It will be an expression consisting of variables and operators\
    \ in such a way so that whose outcome should be a boolean value either true or\
    \ false. Since logical and comparison operators gives result in either true or\
    \ false and commonly used in conditional expression.\n+   - When the result of\
    \ condition is true, it will execute statement(s) enclosed in the If-block {...}."
  merge: -1
  img_proc: true
