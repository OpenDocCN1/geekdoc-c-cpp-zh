- pgno: 59
  md: 'It''s giving consistent result and we need to verify if any other (row, col)
    combination too follows this rule of selection or not. If we find any other (row,
    col), then we need to find some other relationship formula. The selection rule
    or logical condition should uniquely select (4,1),(5,2),(6,3),(7,4). Let check
    by subtracting each row - col value. All (row – col) value are shown as follows
    and highlighted ones were follows the rule (row - col=3).


    ```

    (1-1=0)   (1-2=-1)   (1-3=-2)   (1-4=-3)   (1-5=-4)

    (2-1=1)   (2-2=0)    (2-3=-1)   (2-4=-2)   (2-5=-3)

    (3-1=2)   (3-2=1)    (3-3=0)    (3-4=-1)   (3-5=-2)

    (4-1=3)   (4-2=2)    (4-3=1)    (4-4=0)    (4-5=-1)

    (5-1=4)   (5-2=3)    (5-3=2)    (5-4=1)    (5-5=0)

    (6-1=5)   (6-2=4)    (6-3=3)    (6-4=2)    (6-5=1)

    (7-1=6)   (7-2=5)    (7-3=4)    (7-4=3)    (7-5=2)

    ```


    |  | col=1 | col=2 | col=3 | col=4 | col=5 |

    |---|---|---|---|---|---|

    | row=1 | 1,1* | 1,2 | 1,3 | 1,4* | 1,5 |

    | row=2 | 2,1* | 2,2 | 2,3* | 2,4 | 2,5 |

    | row=3 | 3,1* | 3,2* | 3,3 | 3,4 | 3,5 |

    | row=4 | 4,1* | 4,2 | 4,3 | 4,4 | 4,5 |

    | row=5 | 5,1* | 5,2* | 5,3 | 5,4 | 5,5 |

    | row=6 | 6,1* | 6,2 | 6,3* | 6,4 | 6,5 |

    | row=7 | 7,1* | 7,2 | 7,3 | 7,4* | 7,5 |


    Nowhere row – col = 3 holds true in other than our considered value pairs. So
    our guess now becomes valid to select these boxes under consideration.


    Hence our next logical condition becomes


    (row - col == 3). So final logical condition becomes


    ( col ==1) || (row+col==5) ||(row - col == 3).


    Removing the (row, col) value pair where * character is not present, we will get
    as follows;


    |  | col=1 | col=2 | col=3 | col=4 | col=5 |

