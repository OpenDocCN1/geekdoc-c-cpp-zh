- pgno: 25
  md: 'We will learn to sharpen our intelligence in programming logic by just using
    required only minimum technical knowledge. We are targeting to dive deep in the
    art of building programming logic rather than going deep in basic of grammar/syntax
    of a programming language. Let’s check out some basic building blocks of programming
    logic.


    # Storing different data types


    The intelligence of software is due to programming language(s). The processing
    of different types of data in some form, is something very core to almost every
    software. Facility to manipulate **different types of data correctly** should
    be a necessary feature of any programming language. Example of commonly used different
    data types.


    | General data type | Value examples |

    |---|---|

    | Integer | 23, -4, 8908 |

    | Real Numbers | 23.45, 3.1456, -45.27 |

    | Truth Values | true, false |

    | text | "Just do it", "impossible" |

    | Single Character | A, a, @, $, %, *, 9 |


    Don’t we use different variety of data in our daily life? We actually do, for
    example;


    | Name : ................................ | We are sometimes required to fill
    correctly personal details in some way or the other way. Examples are many, like
    school/college admission process, flight booking or any online purchasing. We
    are intelligent enough to distinguish different types of data, whether it''s numeric,
    textual or any other kind. |

    | Age : ................................ | |

    | Weight(In Kgs) : ....................... | |

    | Personal loan (true/false): ........... | |

    | Gender(M/F) : ........................... | |


    # How can be a programming language made intelligent to distinguish different
    variety of data?


    Yes, it is made possible through the facility of declaring variables.


    # Variable declaration


    variable_name represents a memory address and also known as lvalue.


    | CONCEPTUAL LAYOUT OF A VARIABLE |  |  |

    |---|---|---|

    | data-type | variable_name | Data within the range of data-type |

    |  |  | Memory Address |


    The format for variable declaration is as follows:


    ```

    data-type variable_name;


    int age; // age is lvalue and represents a memory location

    ```'
