  md: 'We have assigned unique value to each row starting from 1 till 9.


    We can represent value 9 as (2*5 - 1).The variable **totalRows** has initially
    assigned the value 5.


    So, we can generalised the maximum limit of the **row** variable using the variable.
    Let’s consider;


    **row** → variable *type of integer* to store integer value one at a time and
    represents row number between 1 and (2 * **totalRows** - 1).


    We have logically divided row level repetition *for-loop* into two parts due to
    two different versions of the *column level for-loop*.


    | Elements Of Row Level decrementing for-loop | |

    |---|---|

    | *min_val* | 1 |

    | *totalRows* | totalRows |

    | *variable_name* | **row** |

    | *statement(s)* | Column level for-loop_1 for printing star characters<br>printf("\n");
    // Move cursor to the next row |


    | Elements Of Row Level decrementing for-loop | |

    |---|---|

    | *totalRows + 1* | totalRows + 1 |

    | *max_val* | 2*totalRows - 1 |

    | *variable_name* | **row** |

    | *statement(s)* | Column level for-loop_2 for printing star characters<br>printf("\n");
    // Move cursor to the next row |


    Since we got all the details related to considered for-loops, we can summarise
    these related information with the help of flow-chart.


