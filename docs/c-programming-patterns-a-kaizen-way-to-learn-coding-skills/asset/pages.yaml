- pgno: 88
  md: "# Nested for-loop/Inner for-loop\n\nWe have previously seen examples of for-loop\
    \ that have if-statements or any other simple statements. Instead of simple if-\
    \ statement within for-loop we place another for-loop then how the things will\
    \ be. For example;\n\n```\n```c\nfor ( int counter = 5 ; counter >= 1; counter\
    \ -- ){\n        // print the variable counter's value\n        printf (\"%d\\\
    n\", counter ); //statement1\n        printf (\"%d\\n\", 2*counter ); //statement2\n\
    \        printf (\"%d\\n\", 3*counter ); //statement3\n}\n```\n```\n\nWe know\
    \ that these considered statements will get execute in order. Firstly statement1\
    \ will get executed, then statement2 and lastly statement3 will get executed.\
    \ All these statements will repeat 5 times when we execute the considered piece\
    \ of program. If we place another for-loop instead of any single statement, the\
    \ major style of work doesn’t change. We need to think in way that **inner for-loop**\
    \ itself is like some other single **programming statement**. Whenever control\
    \ of a program starts executing programming statements in a sequence and finds\
    \ any **inner for-loop**, it will then fully executes inner for-loop and then\
    \ executes next statement(s) if there are any available.\n\nFor example;\n\n```\n\
    ```c\nfor ( int counter = 5 ; counter >= 1; counter -- ){\n    // print the variable\
    \ counter's value\n    printf (\"%d\\n\", counter ); //statement1\n    //The for-loop\
    \ is a single statement\n    for(int inner = 1 ; inner <= 5; inner ++){\n    \
    \    printf (\"%d\\n\", inner );\n    }\n    printf (\"%d\\n\", 3* counter );\
    \ //statement3\n}\n```\n```\n\n> > Please treat\n> > nested for-loop\n> > as a\
    \ single\n> > programming\n> > statement\n\nNow as usual **statement1** gets completed\
    \ first. Then inner for-loop with 5 times repetitions will get executed completely\
    \ and finally **statement3** will get executed. All these **three statements**\
    \ will repeat 5 times as suggested by the structure of outer for-loop. Whenever\
    \ a for-loop is placed within the code block of another for-loop is known as **inner\
    \ for-loop** or **nested for-loop**.\n\nThe inner for-loop will **restart from\
    \ the beginning** for every new value of a outer for-loop.\n\nIt is easy to follow\
    \ this concept if we try to relate it with time piece clock with following assumptions;\n\
    \n**Inner Loop →** It’s like a “seconds” hand in a clock\n**Outer Loop →** It’s\
    \ like a “minute” hand in a clock\n\nIn a clock when “seconds” hand completes\
    \ one cycle then only afterwards “minute” hand will get updated by counter value\
    \ 1 and not before.\n\n![](img/67765455776ddeb6395161cd553ecd87_88_0.png)\n\n\
    The **inner for-loop will execute completely before every new counter value of\
    \ outer for-loop** to continue repetition depends upon it’s loop-condition."
  merge: -1
  img_proc: true
