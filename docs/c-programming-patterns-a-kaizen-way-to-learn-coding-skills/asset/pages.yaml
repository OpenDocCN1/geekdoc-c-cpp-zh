  md: '# Why the maximum value of variable col is kept dynamic?


    We know that the printing star("*") character(s) will continue till the maximum
    value of variable col which is (totalRows + row).


    We are not worried about the spaces when printing of all the star("*") character(s)
    gets completed in a row.


    It makes sense to restrict the column level looping to the point where the maximum
    number of printing of star("*") characters reached.


    # Why the minimum value of variable col is kept 1?


    It makes sense to start the col=1,2...from the value 1 ,since we have to print
    space characters before actual printing of star("*") characters required to start
    at the column level looping.


    We can eliminate the logical AND(&&) condition which is ( col <= ( totalRows +
    row ) ) in the if-condition to print the star("*") characters.


    It’s already planned to consider this logical AND(&&) condition as the loop-condition
    already been taken into the column level inner for-loop.


    So the if-condition will now reduce to the following:


    ```

    If ( col >= (totalRows - row ) )

    ```


    We can summarise it all as;


    | Prints a star character when condition is True for every value of variable col
    |

    |---|---|---|---|---|---|

    | col=1 | col=2 | col=3 | col=4 | ................... | col=(totalRows + row)
    |

    | If ( condition( col >= (totalRows - row) ) is True )<br>Print star character<br><br>Else<br><br>Print
    space character | | | | | |


    We generalised the non-repeating numeric pattern of the column max_val into an
    expressions.


    We can now define column level for-loop which is same for every row value.


    | Elements of Column level for-loop |

    |---|---|

    | min_val | 1 |

    | max_val | totalRows + row |

    | variable_name | col |

    | statement(s) | printf("*"); |'
