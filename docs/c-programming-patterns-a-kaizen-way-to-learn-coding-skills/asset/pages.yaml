    Now **row+col=6** also holds true for the value pair **(4, 2)** and we don’t want
    to put character * over there. We have to restrict it to value pair **(3, 3)**.
    The overall logical condition specifically for this can be given as;


    ```

    (row==col) && (row<=3 && col>=3)

    ```'
