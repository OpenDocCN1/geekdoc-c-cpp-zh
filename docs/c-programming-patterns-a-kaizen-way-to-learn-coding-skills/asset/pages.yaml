- pgno: 28
  md: '# Operators


    Some special keyboard characters are used as operators in programming to denote
    frequent mathematical operations like addition, subtraction, comparing two numeric
    values and many such operations. We can categorize operators as per their purpose.
    In short, it’s a simulation of simple school maths calculation activities but
    using programming. These simple mathematical operations are very much common in
    our daily life and plays a major role in dealing daily business or transactions.
    Such calculation based activities with accuracy and many such related activities
    are very much common in our daily routine.


    # *Arithmetic Operators*


    | Operator | Arithmetic Operation Description |

    |---|---|

    | + | Addition |

    | - | Subtraction |

    | * | Multiplication |

    | / | Division |

    | % | Modulus (Remainder on division) |

    | ++ | Increment |

    | -- | Decrement |


    For example, simple **addition operation** using “+” operator can be given as
    follows:


    ```

    int intNum1 = 6;

    int intNum2 = 4;

    int intResult = intNum1 + intNum2;

    ```


    We know that assignment operator (=), at a time we can store single value in a
    variable. So in the considered example, **intNum1** will store the value 6 & **intNum2**
    will store the value 4.


    Finally, **intResult** will store the result value of addition of **intNum1**
    and **intNum2** as addition operator (+) is applied between these two variables.


