- pgno: 82
  md: "# About for-loop\n\nIn case of high calculation intensive data or large amount\
    \ of data processing activities, human resources are not reliable in terms of\
    \ accuracy and productivity as compared to computers. Nothing is automatic unless\
    \ someone does it. The feature of repetitiveness helps to automate tedious data\
    \ processing work amazingly efficient and accurate as compared to doing it manually.\
    \ One of the repetitive control feature in a programming is known as **for statement**\
    \ or **for-loop**. In a very generic way **for-loop** can be expressed as follows:\n\
    \n![](img/67765455776ddeb6395161cd553ecd87_82_0.png)\n\n```\n```\nfor (start-loop;\
    \ loop-condition ; counter-update ) {\n    execute statement(s);\n}\n\nnext statement;\n\
    ```\n```\n\n+   - **_start-loop_** is a simple way of initialisation of a variable\
    \ and anyway from some point the process of repetitive cycle has to be get started.\n\
    +   - **_loop-condition_** is a logical expression which evaluates a boolean value\
    \ either **_true_** or **_false._** Based on this (_**true/false**_), **_for-loop_**\
    \ control structure decides whether to repeat the set of statement(s) or not.\n\
    +   - **_counter-update_** is a change in variable's value in a fixed smaller\
    \ steps (increment/decrement) only after all statement(s) gets executed in **for-loop**\
    \ block. Usually it holds strong bonding with **_start-loop_** and **_loop-condition._**"
  merge: -1
  img_proc: true
- pgno: 83
  md: "The *for-loop* helps a programmer to repeat programming statement(s) over a\
    \ “range of values”.\nWhen we talk about a range, then it must have a minimum\
    \ value and a maximum value.\n\nWe will use the following notations:\n\n| Notation\
    \ | Description |\n|---|---|\n| *min_val* | minimum value from where the for-loop\
    \ starts the repetition. |\n| *max_val* | maximum value to the extent where for-loop\
    \ will do the repetition. |\n\nIt means *for-loop* will operate between *min_val*\
    \ and *max_val* values. We can understand this concept better by doing examples\
    \ based on incrementing or decrementing *counter-update* expression of the *for-loop*.\n\
    \n# Basics\n\nHere are some basic examples to get clarity about how the *for-loop*\
    \ behaves.\n\nLet’s express range [*min_val*, *max_val*] where *min_val* < *max_val*\
    \ with counter-update incremental value 1. The for-loop can be expressed as;\n\
    \n```\nfor ( int variable_name = min_val ; variable_name <= max_val ; variable_name\
    \ ++ ){\n\n        statement(s);\n\n}\n```\n\n# **Case a:**\n\nLet the range be\
    \ [1,5] with counter-update incremental value 1, then the for-loop can be expressed\
    \ to print counter variable’s value 1 to 5 in ascending order which is as follows;\n\
    \n```\nfor ( int counter = 1 ; counter <=5 ; counter ++ ) {\n\n        printf(\"\
    %d\\n\", counter); //print output to console\n\n}\n```\n\nHence the above *for-loop*\
    \ can be expressed as a flow chart which is as follows:\n\n![](img/67765455776ddeb6395161cd553ecd87_83_0.png)"
  merge: -1
  img_proc: true
