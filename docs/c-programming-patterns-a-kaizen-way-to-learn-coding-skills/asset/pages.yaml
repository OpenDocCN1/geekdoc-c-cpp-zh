  md: "Let’s try to implement program based on our fact-findings.\n\n```\n```c\nPattern1HByArray.c:\n\
    #include <stdio.h>\n#include <stdlib.h>\nint main() {\n\n        char strings[44]\
    \ = { \"\" };\n        int totalRows = 5; // number of rows to display\n     \
    \   int MAX_COLUMNS = 2 * totalRows - 1;\n        int midIndex = totalRows - 1;\
    \ // since array index start at 0;\n        int count = 0;\n\n        // initializing\
    \ array with spaces\n        for ( int col = 0; col < MAX_COLUMNS; col++ ) {\n\
    \                strings[col] = ' ';\n        }\n\n        // Column level Repetitive\
    \ Action :\n        for ( int row = 1; row <= MAX_COLUMNS; row++ ) {\n\n     \
    \           // filling array using '*' char at specific positions.\n         \
    \       if ( row == 1 ) {\n                        strings[midIndex] = '*';\n\
    \                } else if ( row <= totalRows ) {\n                        count\
    \ = count + 1;\n                        strings[midIndex - count] = '*';\n   \
    \                     strings[midIndex + count] = '*';\n                } else\
    \ {\n                        // for second-half portion\n                    \
    \    strings[midIndex - count] = ' ';\n                        strings[midIndex\
    \ + count] = ' ';\n                        count = count - 1;\n              \
    \  }\n                // Print string and move cursor to the next row\n      \
    \          printf( \" %s\\n\", strings );\n        }\n        return 0;\n}\n```\n\
    ```\n\n# Output\n\n```\n```\n    *\n   ***\n  *****\n *******\n*********\n *******\n\
    \  *****\n   ***\n    *\n```\n```"
