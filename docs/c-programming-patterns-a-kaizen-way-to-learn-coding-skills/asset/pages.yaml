  md: "# CallByReference.c\n\n```\n```c\n#include <stdio.h>\n\n// function prototype\n\
    void swap(int*, int*);\n\nint main() {\n    // local variables: firstNum, secondNum\n\
    \    int firstNum = 9;\n    int secondNum = 10;\n\n    printf(\"*** Before swap()\
    \ method call ***\\n\");\n    printf(\"[firstNum = %d | secondNum = %d ]\\n\"\
    , firstNum, secondNum );\n    printf(\"------------------------------------------------\\\
    n\");\n    // memory address value of local variables are passed.\n    swap( &firstNum,\
    \ &secondNum );\n\n    printf(\"------------------------------------------------\\\
    n\");\n    printf(\"*** After swap() method call ***\\n\");\n    printf(\"[firstNum\
    \ = %d | secondNum = %d ]\", firstNum, secondNum );\n    return 0;\n}\n\n// formal\
    \ parameters : firstNo and secondNo\nvoid swap(int* firstNo, int* secondNo) {\n\
    \    printf(\"Start swap() : \");\n    printf(\"firstNo = %d | secondNo = %d \\\
    n\", *firstNo, *secondNo );\n    // local variable: emptyVar\n    int emptyVar\
    \ = 0 ;\n    emptyVar = *firstNo;\n    *firstNo = *secondNo;\n    *secondNo =\
    \ emptyVar;\n    printf(\"End   swap() : \");\n    printf(\"firstNo = %d | secondNo\
    \ = %d \\n\", *firstNo, *secondNo );\n}\n```\n```"
