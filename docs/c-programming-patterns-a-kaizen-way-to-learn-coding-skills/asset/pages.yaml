- pgno: 18
  md: '# Kaizen Principles: To Improve Programming Logic


    The Kaizen principle is a Japanese philosophy that refers to the set of activities
    that promote **continuous improvement**. **Improvement is not an activity which
    is meant to be done once or few times and then leave it. A continuous improvement
    is a process which consists of simple steps that leads to improvements in various
    areas.**


    # Small improvements everyday


    It focuses on incremental improvements as compared to finding exact solutions
    to the problems. Any improvement is better than ZERO improvement and 100% postponement.
    So make small simple targets and achieve it by putting efforts. Even 1% improvement
    is valuable and therefore small gains combined together in longer run yields big
    results. Basically don’t break the learning pattern and it’s better to learn something
    rather than postponing it 100%.This activity also help to break the habit of procrastination,
    if somebody who really find it hard to get rid of.


    # Measurement and feedback


    The implementer of this principle has to be mentally prepared to find their own
    mistakes in logical expression and overall programming logic. Each mistake is
    treated as a lesson in the path of overall improvement. So total focus is on incremental
    improvements rather than on complete solutions to programming problems. The learning
    of process of programming logic should be based on pictorial based exercises rather
    than mathematical based problems. When a learner practice programming logic based
    on pictorial based exercises, the feedback on applied logic can be known easily
    and clearly. Not only limited to this, it will create lot of curiosity and interest
    to learn programming. Moreover, it also helps to eliminate one of the commonest
    issue of;


    > “how to keep focus while learning programming?”.


    # Let go of assumptions


    The usual and common way to learn programming is just by randomly experimenting
    it based on assumptions. This takes much more time to learn programming logic
    as it required hell lot of practice. Learning programming by assumptions is a
    switch off to many of them. Since it doesn’t reflect any standard way of learning.
    Most of us can’t able to make a good assumptions and in every subject area is
    highly impossible and there is no standard formula for assumptions that can work
    with anybody. If an approach for learning sparks visualisation and thought process,
    then it will be easy for anybody to learn it.


    # Speak with data, manage by facts


    The programmer should device a solution based on the data and facts. The most
    important protocol which makes programming logic that works correctly is to understand
    the intelligence involved in the flow of data.


    The trick to get this intelligence is to express flow of data in one or more logical
    expressions using our version of observation table known as logic trace table.
    The logical expression is made up of one or more variables and operators. Finally,
    programming logic is made up of one or more logical expressions. We can easily
    learn this art of making logical expressions using data and through appropriate
    practice mentioned in the **section-programming patterns.**'
