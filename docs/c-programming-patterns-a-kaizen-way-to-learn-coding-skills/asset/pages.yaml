  md: '# *Alternative solution*


    We observed previously that for row=5, the values of col and numeric output are
    just reversed.

    Let’s device a solution by decrementing the for-loop for col variable (5 to 1)
    so the numeric

    output will match partially or wholly with the values of col variable.


    | row | 5 |

    |---|---|

    | col | 1 | 2 | 3 | 4 | 5 |

    | output | 5 | 4 | 3 | 2 | 1 |


    For row =5, 5>=num>=1, 1<=col<=5


    | row | 1 |

    |---|---|

    | col | 5 | 4 | 3 | 2 | 1 |

    | output | space | space | space | space | 1 |


    row =1, 1>=col>=1 (print col value)  or row >=col>=1 (print col value)


    | row | 2 |

    |---|---|

    | col | 5 | 4 | 3 | 2 | 1 |

    | output | space | space | space | 2 | 1 |


    row =2, 2>=col>=1 (print col value)  or row >=col>=1 (print col value)


    | row | 3 |

    |---|---|

    | col | 5 | 4 | 3 | 2 | 1 |

    | output | space | space | 3 | 2 | 1 |


    row =3, 3>=col>=1 (print col value)  or row >=col>=1 (print col value)


    | row | 4 |

    |---|---|

    | col | 5 | 4 | 3 | 2 | 1 |

    | output | space | 4 | 3 | 2 | 1 |


    row =4, 4>=col>=1 (print col value)  or row >=col>=1 (print col value)


    | row | 5 |

    |---|---|

    | col | 5 | 4 | 3 | 2 | 1 |

    | output | 5 | 4 | 3 | 2 | 1 |


    row =5, 5>=col>=1 (print col value)  or row >=col>=1 (print col value)


    So, if –condition now becomes (col >=1 and col<=row)


    col >=1 is redundant condition, since it’s a lower limit in the inner for-loop
    for col = 5 to 1.


    So, if –condition is reduced to (col<=row)


    | **if-condition** | lower_limit <=col<= upper_limit |

    |---|---|

    | **Mathematical expression** | 1 <= col <= row |

    | Syntax | `if( col<=row )` |


    The overall observation is at each row, either it’s printing space characters
    or col values in a

    continuous fashion. It’s quite obvious that we can make use of **if-else statement**
    as printing of

    characters are continuous.'
