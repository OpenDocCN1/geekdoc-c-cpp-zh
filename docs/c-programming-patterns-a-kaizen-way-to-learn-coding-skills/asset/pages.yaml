    | row=6 | 6,1* |  | 6,3* |  |  |

    | row=7 | 7,1* |  |  | 7,4* |  |


    We have seen in this case addition and subtraction relationship among row and
    column values worked. Sometimes other arithmetic relationship like division or
    remainder among row and column value holds true to select the boxes means (row,
    col) value pairs. Logical condition can be implemented in many different ways.
    There could be possible different alternative ways of giving conditions for the
    same set of selection of (row, col) value pairs.'
