    \ following for capital letters\n\n```\nnumSet1 = col + ( 65 - 1); // Unicode\
    \ for capital alphabet ‘A’ is 65\n```\n\nWe can use the following\n\n```\nnumSet1\
    \ = col + ( 97 - 1); // Unicode for small alphabet ‘a’ is 97\n```\n\nAlthough\
    \ with minor change we can get output in small alphabets but real point is to\
    \ understand is that the most of the code will get repeated. We can avoid such\
    \ repetition of programming logic by the concept of **functions** or methods.\
    \ We can create our own function and use it as on demand in the same way as we\
    \ are using in-built method/function like `printf(\"\\n\")`.\n\n# Writing our\
    \ own functions\n\nTill now we have used many times the concept of generalised\
    \ expression based on variable(s) to represent hard-coded values. We can still\
    \ go ahead to generalise programming logic too. One of major advantage of **function\
    \ with input parameter(s)** is that it helps to achieve different types of output\
    \ by reusing the same programming logic.\n\nWriting functions are a very sensible\
    \ idea that suggests how we can encapsulate different programming logics differently\
    \ so that repetition of same piece of programming logic should not happen in other\
    \ parts of the programs. Before we apply this concept we need to understand the\
    \ commonly used syntax of a function in a class with **main method** which is\
    \ as follows:\n\n```\nreturn_type methodName( parameter1, parameter2,...){\n\n\
    \    //programming logic\n\n}\n```\n\nWhere *parameter1, parameter2...* are the\
    \ input(s) that a function may require and passing parameters in function is optional.\
    \ The **return_type** is void if it is not returning any value or may return (int,char,..etc)\
    \ using the return keyword. Since our main method is static, so just to keep technical\
    \ stuff easy our method **printPattern** too using **static** keyword and moreover\
    \ it is a part of object-oriented programming ,which is out of scope of this book.\
    \ For the following three different types of output we can use the same **printPattern\
    \ method**, encapsulating a common programming logic. The **printPattern** will\
