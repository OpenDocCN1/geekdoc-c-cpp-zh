    The well studied $k$-DOMINATING SET problem can be considered as a special case
    of $d$-DOMINATING SET when $d=1$. The concept of dominating set was introduced
    by Slater [1] and Hed [2]. The application of dominating set in wireless networks
    was introduced by Wu and Li [3]; Prathiba et al. [4] studied the problem of finding
    a dominating set in extended graphs [5]. For more details and references on distance
    domination, see Hemming [6].


    Parameterized complexity is a powerful framework that deals with intractable problems.
    A parameterized problem is a set of instances $(x,k)$, where $x$ is the input
    instance and $k$ is a nonnegative integer parameter. The parameterized problem
    is said to be parameterized tractable if there is an algorithm that solves the
    problem in time $f(k)|x|^c$, where $f$ is a function solely dependent on $k$,
    and $|x|$ is the size of the input. A kernelization of a parameterized problem
    is a reduction to a kernel, a polynomial-time algorithm to transform any input
    $(x,k)$ to a reduced instance $(x'',k'')$ with $k'' \le k$ and $|x''| \le g(k)$.
    A parameterized problem is fixed tractable if and only if it is kernelizable.
    On the other hand, many fixed tractable problems are classified in a hierarchy
    of complexity classes $W[1] \le W[2] \le \dots \le W[t]$. For example, $k$-INDEPENDENT
    SET and $k$-CLIQUE


    are known to be $W[1]$-complete and $k$-DOMINATING SET is known to be $W[2]$-complete.
    We refer the readers to [7] for more details.


    $d$-DOMINATING SET is known to be W[2]-hard in graphs of diameter $(d+1)$ [8]
    and in interval graphs and their complements [9]. On the other hand, it has a
    size kernel in any dense graph class [10]. We show that $d$-DOMINATING SET remains
    W[2]-hard when restricted to special graph classes. In particular, we show that
    $d$-DOMINATING SET remains W[2]-hard in bipartite graphs, and in triangle-free
    graphs. $K_{1,k}$-free graph is a graph without We also show it remains W[1]-hard
    in $K_{1,k}$-free graphs.


