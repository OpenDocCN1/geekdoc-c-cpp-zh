    # SESSION: SOFTWARE SYSTEMS AND RELATED ISSUES

    Chair(s)


    # User-level Deterministic Replay via Accurate Non-deterministic Event Capture


    Jeongakta Lim, Hosong Yoon, Hyunmin Yoon, Yooree Ko, and Minsoo Ryu

    ¹Department of Computer Science and Engineering, Hanyang University, Seoul, Korea

    ²Department of Electronics and Computer Engineering, Hanyang University, Seoul,
    Korea

    †jtlim, hsyon, hymun@hanyang.ac.kr, yk@naver.com, msryu@hanyang.ac.kr


    Abstract – Recently, software that affects human life has increased and we use
    almost everything, such as cars, homes, appliances, and smart phones. Since bugs
    can have a devastating effect on people, ensuring stability is becoming important.
    Many bugs have been difficult to eliminate. Debuggers do not help in eliminating
    bugs, such as synchronization faults. These bugs are caused by non-deterministic
    events. Events occur at unpredictable timing and affect the behavior of user processes.
    In this paper, our approach captures and plays non-deterministic events of single
    thread to make the thread reproducible and useful for software debugging. We replay
    the events at the end to call non-deterministic events. For this, we have help
    of the ARM debug architecture without having to modify our program.


    Several tools as GNU debugger (GDB) have been developed to help developers remove
    these bugs. GDB provides many features that allows developers to track and modify
    the process to eliminate bugs. However, these debuggers are not very helpful in
    resolving synchronization faults. Bugs are caused not only by problems inside
    the user thread but also by external factors. In this paper, we call these non-deterministic
    faults/events. These non-deterministic events occur in a variety of ways, such
    as an external interrupt or communication with an external thread. In order to
    detect bugs we must be able to capture, play, and control non-deterministic events.


    Keywords: deterministic replay, non-deterministic, system call replay, thread
    communication


    Our approach is to replay all non-deterministic events that can affect the target
    thread and perform a deterministic replay of the thread based on the recorded
    events. To accomplish this, we need to analyze what non-deterministic events are
    in the thread. This uses the system to request external resources or to request
    kernel services. If we capture and replay the non-deterministic factors of the
    system, we also need to determine events that do not use system threads. Threads
    access the same data by sharing memory and can send signals to other to communicate.
    Non-deterministic events of these specific cases are also captured and replayed
    to achieve our goal.


    # 1 Introduction


    Recently, software has been applied to various technologies. Software is becoming
    larger and complex to provide more functionality. As such, software bugs are more
    likely to occur. Research at Cambridge University shows that the damage caused
    by the bugs around the world is more than $12 billion per year, with a million
    lines of automotive and aircraft software directly related to the user. Ensuring
    software stability is very important. However, it is difficult to guarantee the
    software reliability with the conventional debugging and testing methods.

