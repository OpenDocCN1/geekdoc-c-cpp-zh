    of an array of 100,000,000, performed under the binary search and the Congruent
    Binary Search, O(log (2+100,000,000)) = 26.58 and O(log n) = 25.58. The two are
    still different iterations.


    Following the form of the Congruent Binary Search, outlined above, either ''left''
    or ''right'' are assigned a value at the midpoint in question and compared to
    the value being searched. For an array divided into two threads will need Left
    and Right that change in increments of p. For the example, in even and odd threads,
    Left and Right''s values can change in increments of two. For an array divided
    into four threads, Left and Right''s values can change in increments of four.


    The search terminates under the same conditions as the above form. The iteration
    stops when ''left'' is greater than ''right'' or midpoint is equal to the value
    being searched for.


    The fact that indexing by even and odd indices may have some potential or advantage
    because of their steeper curve than that of logarithmic algorithms. The Congruent
    Binary Search algorithm is parallel but not performant. It is concluded binary
    search is a good candidate for parallel programming.


