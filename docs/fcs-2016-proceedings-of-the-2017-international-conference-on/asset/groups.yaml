    # 会议：软件系统及相关问题

    主席


    通过精确捕捉非确定性事件的用户级确定性重放


    Jeongakta Lim, Hosong Yoon, Hyunmin Yoon, Yooree Ko, and Minsoo Ryu

    ¹汉阳大学计算机科学与工程系，韩国首尔

    ²汉阳大学电子与计算机工程系，韩国首尔

    †jtlim, hsyon, hymun@hanyang.ac.kr, yk@naver.com, msryu@hanyang.ac.kr


    摘要 – 最近影响人类生活的软件日益增加，我们几乎使用所有设备，如汽车、房屋、电器和智能手机。由于 Bug 可能对人类产生毁灭性影响，确保稳定性变得越来越重要。许多
    Bug 很难消除。调试器无法帮助消除同步故障等 Bug。这些 Bug 是非确定性事件引起的。事件在不可预测的时间发生，并影响用户进程的行为。在本文中，我们的方法捕捉并播放单线程的非确定性事件，以使线程具有可现性并对软件调试有用。我们在最后重放事件以调用非确定性事件。为此，我们得到了
    ARM 调试架构的帮助，而无需修改程序。


    已开发了如 GNU 调试器 (GDB) 等工具帮助开发者移除这些 Bug。GDB 提供了许多功能，允许开发者跟踪和修改进程以消除 Bug。然而，这些调试器在解决同步故障方面帮助不大。Bug
    不仅由用户线程内部引起，还由外部因素引起。在本文中，我们将这些称为非确定性故障/事件。这些非确定性事件以多种方式发生，例如外部中断或与外部线程通信。为了检测
    Bug，我们必须能够捕捉、播放和控制非确定性事件。


    关键词：确定性重放，非确定性，系统调用重放


    我们的方法是重放所有影响目标线程的非确定性事件，并根据记录的事件进行线程的确定性重放。为了实现这一点，我们需要分析线程中的非确定性事件。


    # 1 引言


    最近，软件已应用于各种技术。为了提供更多功能，软件变得越来越庞大复杂。因此，软件 Bug更容易发生。剑桥大学的研究显示，全球 造成的损失每年超过 120  亿美元，百万行的汽车和飞机软件直接关系到用户。确保稳定性变得非常重要。通过传统的调试和测试方法很难保证软件的可靠性。

