    \ = 0.0000001\n\nRequire: $x \\in \\mathbb{Z}^+, x \\geq 0$.\n\nReturn: The value\
    \ of the nth root of the supplied number $x$, is computed. Here $x \\geq 0$.\n\
    \nInput non-negative root number $x$ by keyboard. [May prompt the user to input\
    \ $x$ with $x \\geqgeq 0$.\n\n```\nwhile x < 2\n  a = 1\n  if x = 0\n    nth root\
    \ = 0\n  else if x = 1\n    nth root = 1\n  else if x < 1.0\n    b = x\n    while\
