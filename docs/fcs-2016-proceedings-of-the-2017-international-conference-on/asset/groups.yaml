    # A New Algorithm for Tiered Binary Search


    Ahmed Tarek

    Engineering, Physics and Computer Science, Montgomery College, Rockville, Maryland,
    USA


    **Abstract—Due to strong application flavor, binary search and its derivatives
    are researched widely in literature. The new concept pertaining to multiple key
    search strategy was introduced by the author in 2004. Since then, reverse investigations
    are performed with a wide variety of multi-key searches. In this paper, a new
    algorithm for tiered binary search is proposed. The proposed algorithm performs
    multiple binary search through a tiered strategy that optimizes the search space
    even further compared to other versions. The proposed tiered search is an extension
    of the basic binary search to Newton''s root search strategy. This introduced
    algorithm computes the n-th root of a non-negative real number. The underlying
    concept pertaining to tiered binary search in finding multiple elements with a
    single iteration in an organized search pool is fully described. The algorithm
    is analyzed for clarity. Finally, application and future avenues are explored.


    One improvement with the proposed multi-key search strategy over the traditional
    binary search is the effective reduction in the search space, which accelerates
    the key search computation. Additionally, instead of just two variants of the
    key search strategy, which are searching the key element either in ascending or
    a descending sorted pool, four variants are available to compute — which are ascending
    key search inside an ascending search pool, ascending search inside a descending
    pool, a descending key search or descending keys in an ascending search pool.
    This diversity in computational model has extended the application paradigm for
    the multiple key search paradigm over time [2], [4], etc. Multi-key binary search
    as proposed in [1] keeps on computing the elements in order beginning with the
    first key element. The proposed search employs a Balanced Binary Search strategy.
    It starts with the middle element of the key array. It detects the position of
    the middle element the key array in the larger search using a recursive version
    of the binary search algorithm. The new algorithm confirms for the key portion
    that contains keys larger than the middle element only continues the larger search.
    For the keys, which are smaller than the middle, the algorithm confirms in that
    part of the search pool, which contains elements smaller than the middle. Therefore,
    instead of blending searches for the key element beginning and proceeding in succession,
    the algorithm divides the key elements into two halves, and performs search in
    each half of the search pool using the recursive binary search. Here, the proposed
    algorithm performs the key search through a tiered binary search. By using two
    partitions, the algorithm implements a balanced binary search strategy. Here,
    the proposed algorithm performs a tiered element binary search strategy, which
    is computationally efficient.


    **Keywords:** Binary Search, Binary Search Strategy, Multi-key Elements, Search
    Pool, Search Space Reduction, Tiered Binary Search


