    \n# 图 2\n关键图 $C_{15,3}$。\n\n![](img/447fbed58dc921d81e92b3d3f8047037_12_0.png)\n\
    \n![](img/447fbed58dc921d81e92b3d3f8047037_12_1.png)\n\n为了确定关键图，我们分析了四度图，即 `CirculantGraph(n,l)`，其中\
    \ $n \\in [2,80]$，$l=\\{1,j\\}$且 $j \\in [2,20]$。在这一范围内，我们识别了 121 个四度关键图，如图 1\
    \ 所示。此外，我们实现了对度数为 $s$ 的关键循环图的搜索，即对于 $|L|=s$ 的 `CirculantGraph(n,L)`。在这一范围内我们总共确定了\
    \ 127 个关键图。由于空间限制，它们在完整版本 [4] 中给出。\n\n为了本节的结论，我们提出了一种用于循环图搜索的通用规则，以判断它们是否为关键图。我们可以看到定理\
    \ 23 如下：\n\n> 定义 5。设 $n, j \\in \\mathbb{N}$，定义循环图 $C_{n,j} = (\\{u_0, \\dots,\
    \ u_{n-1}\\}, E_{n,j})$，其中 $E_{n,j} = \\{u_i, u_{i+j} \\pmod n\\} \\cup \\{u_i,\
    \ u_{i-j} \\pmod n\\}$，对于所有 $i \\in \\{0, \\dots, n-1\\}$，有\n$$E_{n,j}^+ = \\\
    {u_i, u_{i+j} \\pmod n\\}, \\quad E_{n,j}^- = \\{u_i, u_{i-j} \\pmod n\\}$$$\n\
    \n因此，$C_{n,j} = CirculantGraph(n,L)$，其中 $L=\\{j\\}$。图 2 展示了图 $C_{15,3}$。\n\n-\
    \ 引理 1。图 $C_{n,j}$ 的最小顶点覆盖为 $n-d_j$，当 $n \\le 2d_j$ 或 $n-d_j$ 是 $d_j$ 的倍数时，该图是关键的。\n\
    - 定理 4。如果 $n \\le 2d_j$ 或 $n-d_j$ 是 $d_j$ 的倍数，则 $C_{n,j}$ 是关键图。\n\n## 5. 图的高效生成的扩展\n\
    \n为了获得各种图，需要高效的生成和模式。本节介绍了两种通过扩展奇长度循环来产生关键图的方法。它们被称为并行扩展（见图 3a）和链扩展（见图 3b）。在这里，让我们考虑并行扩展\n\
    \n首先，设 $G = (V,E)$ 为一个无向图，$U \\subseteq V$ 为 $G$ 的顶点子集。如果对于 $G$ 的每一个顶点覆盖 $C$，都有\
    \ $U \\subseteq C$，则称 $U$ 为 VC-Overlap。如果对于 $U$ 中的任意顶点 $u$，都存在 $G$ 的顶点覆盖 $C$ 使得\
    \ $u \\in C$ 且 $U \\setminus \\{u\\} \\subseteq C$，则 $U$ 为 1-VC-Overlap。设 $v$\
    \ 为新顶点且 $U \\subseteq V$。那么，$G$ 作为 $U$ 和 $V$ 的扩展为：\n\n定义 5.1。设 $G = (V,E)$ 为一个无向图，$U\
    \ \\subseteq V$ 为 $G$ 的顶点子集。如果对于 $G$ 的每一个顶点覆盖 $C$，都有 $U \\subseteq C$，则称 $U$ 为\
    \ VC-Overlap。如果对于 $U$ 中的任意顶点 $u$，都存在 $G$ 的顶点覆盖 $C$ 使得 $u \\in C$ 且 $U \\setminus\
    \ \\{u\\} \\subseteq C$，则 $U$ 为 1-VC-Overlap。\n\n$\\Gamma(G,U) = \\{u,v\\} \\\
    mid u \\in U, v \\in V\\}$\n\n观察结果 5.2。如果 $G = (V,E)$ 是一个 VC-Overlap $U$ 和 $V$，则\
    \ $G \\cup U$ 的最小顶点覆盖由 $G$ 的顶点覆盖的大小加上 $|U|$ 给出。\n\n观察结果 5.3。如果 $G$ 是关键图 $(V,E)$，1-VC-Overlap\
    \ $U$ 和一个新顶点 $v$，则 $\\Gamma(G,U)$ 是关键的。\n\n定理 5.4。如果图 $G=(V,E)$，$U \\subseteq\
    \ V$ 是 1-VC-Overlap且添加了一个新顶点 $u$，则如果 $\\Gamma(G,U)$ 是关键的，则 $G$ 是关键的。\n\n定义 5.3（并行扩展）：设\
    \ $G = (V,E)$ 为无向图，$v \\in V$ 为 $G$ 的一个顶点。定义 $G' = (V \\setminus \\{v\\}, E \\\
    cup \\{\\{u,v\\} \\mid u \\in U\\})$ 为不含 $v$ 的图。对于无向图 $G = (V,E)$ 和顶点 $v],$N_G(v)\
    \ = \\{u \\mid \\{u,v\\} \\in E\\}$ 表示 $v$ 在 $G$ 中的度。\n\n## 从五顶点循环生成的两个关键图\n\n\
