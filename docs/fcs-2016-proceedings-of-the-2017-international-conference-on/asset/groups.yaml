    **摘要—** 在色数的背景下，临界图（critical graph）是指删除任何元素都会降低其色数的实例。这些实例已被证明是深化对优化问题理解的有趣研究对象。


    本工作引入了*顶点覆盖*（Vertex Cover）背景下的关键图。我们讨论了它们在生成具有已知解的更大图方面的潜力。首先，我们提出了一种保留最小覆盖知识的参数化图生成过程。其次，我们对小型关键图进行了系统搜索。最后，我们通过报告使用最先进的启发式求解器
    NuMVC 的系列实验，评估了其在基准测试中的适用性。


    **关键词：** 关键图，最小顶点覆盖，图生成，基准测试


    # 1. 引言


    *顶点覆盖问题。* 图 $G = (V, E)$ 的顶点覆盖 $C$ 定义为顶点子集 $C \subseteq V$，使得每条边 $e \in E$ 至少关联到
    $C$ 中的一个顶点。最小顶点覆盖（MVC）是具有最小尺寸的覆盖。在图中寻找最小覆盖的任务是一个 NP-hard 优化问题 [3]，且其判定版本是 Karp
    [6] 解决的 21 个原始 NP-完全问题之一。虽然构造一个极大匹配可以得到一个紧致的近似-2 似算法，但根据唯一游戏猜想（Unique Games Conjecture），在
    2 倍因子内逼近是 NP-hard 的 [7] $P \neq NP$；然而，人们可以获得 $2-o(1)$ 的近似比 [5]。


    MVC 问题与其他问题紧密相关，寻找最小顶点覆盖等同于寻找最大独立集（MIS），即一个没有两个顶点共享一条边的顶点子集。实例也可以还原为最小尺寸团（MVC）实例，此外，从（二进制）约束满足问题（CSP）到
    MIS 有直接的还原。在实践中，MVC 问题在网络安全、工业机器组装或设施选址中起着重要作用 [7], [8]。


    **关键图。** 如果图对于某个属性是极小值，则称为关键图。更精确地说，如果图 $G$ 的某个元素的删除会减少最小覆盖，则该图是关键的。关键图的概念主要用于色数研究，但在
    MVC 问题中也有助于我们理解顶点覆盖问题的复杂度。


    **随机图生成。** 关键图可以作为构造更大图的基础。由于关键实例提供了易于确定的基础，随机图生成过程可以在保持解的同时创建大型实例。Xu 等人 [15]
    利用关键图进行基准测试并在修订中 [12]。


    **贡献。** 本工作研究了用于顶点覆盖问题的关键图。我们提出了一种可以在保留最小覆盖知识的同时创建可能图的新生成过程。为了高效实现这一点，我们将搜索限制在小型关键实例。其次，如果所有关键图都是已知的，我们使用最先进启发式求解器
    NuMVC 的系列实验进行了报告。


    **概述。** 第 2 节定义关键图。第 3 节描述了从关键图生成图的方法。第 5 节介绍了我们使用的实例，并得出结论。


