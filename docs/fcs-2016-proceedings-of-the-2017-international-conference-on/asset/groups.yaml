    # Some results for Distancing Dominating Set


    Yong Zhang

    Department of Computer Science, University of Pennsylvania, PA


    Abstract— We study the parameterized complexity of d-DISTANCE DOMINATING SET in
    bipartite graphs and $K_{1,k}$-free graphs. We show that d-DISTANCE DOMINATING
    SET is W[2]-hard in bipartite graphs and W[1]-hard in $K_{1,k}$-free graphs.


    Keywords: parameterized complexity, dominating set


    # 1. Introduction


    Given a simple graph $G=(V,E)$, let $N(v)$ denote the open neighborhood of $v$
    in $G$, and $N[v]$ denote the close neighborhood of $v$ in $G$. The distance $d(u,v)$
    between $u$ and $v$ is the length of the path between them in $G$. A $d$-dominating
    set of $G$ is a set of vertices $V$ of $G$ such that every vertex of $V$ is within
    distance $d$ to some vertex in $V$.


    Given a graph $G$, a $d$-DOMINATING SET and a positive integer $k$, the problem
    is to determine whether $G$ has a $d$-dominating set of size most $k$.


    The well studied $k$-DOMINATING SET problem can be considered as a special case
    of $d$-DOMINATING SET when $d=1$. The concept of dominating set was introduced
    by Slater [1] and Hed [2]. The application of dominating set in wireless networks
    was introduced by Wu and Li [3]; Prathiba et al. [4] studied the problem of finding
    a dominating set in extended graphs [5]. For more details and references on distance
    domination, see Hemming [6].


    Parameterized complexity is a powerful framework that deals with intractable problems.
    A parameterized problem is a set of instances $(x,k)$, where $x$ is the input
    instance and $k$ is a nonnegative integer parameter. The parameterized problem
    is said to be parameterized tractable if there is an algorithm that solves the
    problem in time $f(k)|x|^c$, where $f$ is a function solely dependent on $k$,
    and $|x|$ is the size of the input. A kernelization of a parameterized problem
    is a reduction to a kernel, a polynomial-time algorithm to transform any input
    $(x,k)$ to a reduced instance $(x'',k'')$ with $k'' \le k$ and $|x''| \le g(k)$.
    A parameterized problem is fixed tractable if and only if it is kernelizable.
    On the other hand, many fixed tractable problems are classified in a hierarchy
    of complexity classes $W[1] \le W[2] \le \dots \le W[t]$. For example, $k$-INDEPENDENT
    SET and $k$-CLIQUE are known to be $W[1]$-complete and $k$-DOMINATING SET is known
    to be $W[2]$-complete. We refer the readers to [7] for more details.


    $d$-DOMINATING SET is known to be W[2]-hard in graphs of diameter $(d+1)$ [8]
    and in interval graphs and their complements [9]. On the other hand, it has a
    size kernel in any dense graph class [10]. We show that $d$-DOMINATING SET remains
    W[2]-hard when restricted to special graph classes. In particular, we show that
    $d$-DOMINATING SET remains W[2]-hard in bipartite graphs, and in triangle-free
    graphs. $K_{1,k}$-free graph is a graph without We also show it remains W[1]-hard
    in $K_{1,k}$-free graphs.


    # 2. Main Results


    We show that $d$-DOMINATING SET is W[2]-hard when restricted to bipartite graphs.


    > Theorem 2: $d$-DOMINATING SET is W[2]-hard in bipartite graphs.


    We prove the case $d=2$ and show how the construction can be generalized to the
    case $d$. We do this by reducing $W[2]$-complete [6], to $d$-DOMINATING SET. Given
    an input graph $G=(V,E)$ for $k$-DOMINATING SET, we show construct a bipartite
    graph $B=(V'',E'')$. Let $V_1 = \{v_1 |mid v \in V\}$, $V_2 = \{v_2 |mid v \in
    V\}$, and $V_3 = \{v_3 |mid v \in V\}$. $V''$ is a union of $V_1, V_2$, and $V_3$
    and three dummy vertices $\{x, y, z\}$ of the following:


    +   $E_1 = \{\{v_1, v\} | v \in V\}$$

    E_2 = \{\{v_2, v\} | v \in V\}$

    E_3 = \{\{v_3, u\} | u \in N[v]\}$$

    E_4 = \{\{x, y\}, \{x, z\}, \{y, z\}\}$


    This completes the proof. It is easy to show that $B$ is bipartite. We show that
    $G$ has a dominating set of size $k$ if and only if $B$ has a 2-dominating set
    of size $k+1$. Let $D$ be a 2-dominating set of size $k+1$ in $G$. Then $D^* =
    \{v_1 |mid v \in D\}$ is a 2-dominating set of size $k$.

