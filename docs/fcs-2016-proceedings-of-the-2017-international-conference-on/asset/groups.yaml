    # 4 Conclusions


    We reviewed Cohort Lock and NUMA-Aware Reader Lock, and analyzed the performance
    with various read-write workloads. These locks give higher performance than the
    state-of-the-art. In NUMA system, reducing inter-node traffic and cache coherence
    misses enables high performance in shared-resources. We also evaluated with different
    values in tunable parameters in Cohort Lock and NUMA-Aware Reader, and worked
    out the appropriate settings to improve throughput up to 3% than default values.


    In the future, we will review the locks design for deep NUMA hierarchy with more
    than two-cohort lock as NUMA system grows more complex with deep levels. In addition,
    we will examine delegation lock that provides high throughput by lock holding
    to execute other threads'' critical section. This lock allows shared resource
    to be fetched in private cache and reduces data transfer between inter-node caches.


