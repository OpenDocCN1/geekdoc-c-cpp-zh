    - 给定 $B$ 和顶点色数 $\ell$ 的边数上界 $m$，以及顶点数的上界 $n$，$g_{B,n,m}$ 是一个生成集合 $S=\{S_1,...,S_k\}$
    的 $B$ 的元素的随机变量，其中 $S_i=(U_i,V_i,E_i)$。


    **观察 2.2：** 连通图 $G=(V,E)$ 是关键的（简称：VC-critical），如果删除它会减少最小色：

    $|U_i| = \ell$

