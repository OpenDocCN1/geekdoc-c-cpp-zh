    # Analysis and Evaluation of Locks designed for NUMA system


    Joohaan Hong, Seokyeong Jung, Kihyun Yun, and Minsoo Ryu

    Department of Computer Science and Engineering, Hanyang University, Seoul, Korea

    [jjhong, sykyung, kihyun]@rtcc.hanyang.ac.kr, msryu@hanyang.ac.kr


    **Abstract** - As systems grow to multi-core and multicore systems for high performance,
    Non-Uniform Memory Access (NUMA) architecture is widely adopted in recent computing
    systems. In NUMA systems, lock primitives such as spinlock become bottleneck by
    causing frequent inter-node traffic. For improving performance in NUMA architectures,
    lock evaluation is cautiously necessary to maintain cache traffic and coherence.
    In this paper, we evaluate two locks designed for NUMA architecture: Cohort Lock
    and NUMA-Reader-Writer Lock. We analyze the performance with readwrite workloads
    using a microbenchmark. We evaluate with various settings to improve throughput
    in two parameters: handoff in Cohort Lock and maximum performance limit in NUMA-Reader-Writer
    Lock Evaluation shows that throughput improved up to 3% when we apply appropriate
    settings in tunable parameters.


    **Keywords:** NUMA, reader-writer lock


    # 1 Introduction


    Currently, most performance systems use hardware platforms with two or more sockets
    and several cores per socket. In this hardware platform, multicore and multi-socket
    systems use Non-Uniform Memory Access (NUMA) architecture structured as two or
    more nodes which are connected by local caches and memory. Each cache and memory
    of each node can be accessed by other nodes; however, the access time to inter-node
    is less than to intra-node. As the number of cores grows in NUMA system, parallel
    programming is key for performance since cores operate at the same time. Applications
    designed for parallel programming, performance is limited by shared resource that
    can be accessed simultaneously. Specifically, for shared resource is restricted
    for performance caused by long latencies in NUMA system. The reason for this is
    inter-node traffic after intra-node traffic. By using intra-node, reducing cache
    traffic and misses are key for improving performance of lock.


    MCS lock [3] is widely known as scalable in shared resource. MCS lock maintains
    a queue-based wait list for acquiring the lock. The head becomes the head of the
    queue-based list and the thread which tries to acquire the lock is added to the
    tail of queue-based list, pointing to itself on a local variable. When the head
    is added to release the lock, the thread notifies its successor in the queue-based
    list. When the successor receives the notification, it stops spinning and acquires
    the lock, the thread becomes the head of queue. This lock avoids bursts of cache
    traffic. When a lock is released by permitting only the successor to acquire the
    lock. However, the performance significantly suffered in NUMA system due to inter-node
    traffic and monitoring the tail of the lock.


    Hierarchical Lock (HBO) [4] is designed for reducing remote access. When a thread
    tries to acquire shared resource it waits for backoff time until the lock is expired,
    and tries to acquire the lock again. The backoff time can be adapted, so a shared
    holding thread can shorten backoff to reduce coherence changes. Adaptive lock
    can reduce cache traffic; however, it needs a lock parameter to get scalable result
    for every platform, so cannot give performance and fairness issue [2].


    We discussed two locks for shared resources in multi-threaded, but the performance
    is not scalable in NUMA system. Therefore, we need to analyze the lock in NUMA
    system for further consideration. In this paper, we examine the locks designed
    for NUMA system, and evaluate the performance in readwrite workload. We also attempt
    to find out appropriate settings to improve throughput in tunable parameters.
    We describe scalable NUMA lock in Section 2 and provide experimental evaluation
    in Section 3.


    # 2 Locks designed for NUMA system


    ## 2.1 Lock Cohorting


    Cohort lock [2] is consisted of two levels of locks: global lock and local lock.
    Global lock is shared by all threads in NUMA system, and local lock is only shared
    with same node in NUMA system. The thread needs to acquire both locks by a sequence
    of local lock and global lock and then executes the critical section. When a thread
    releases the lock it checks the waiting thread in the same node. If there is a
    waiting thread in the same node, a lock holding releases the local lock first,
    then passes the global lock to the waiting thread in same node.


    Cohort lock gives priority to the thread in the same node using the intra-node
    cache; inter-node traffic and misses can be reduced, however cohort lock occurs
    in the thread trying to acquire the lock in other nodes. It is because cohort
    lock holding does not release a global lock to the other nodes. To solve this
    problem, cohort lock sets a threshold to make a global lock held in a specific
    node continually. After a thread meets the threshold, it must release the global
    lock to yield the lock to other nodes. This threshold is called handoff and is
    set to 64.


    Allen et al. [1] sets patience limit to 1000:


    (a) Read 98%, Writer 2%

    ![](img/447fbed58dc921d81e92b3d3f8047037_27_0.png)


    (b) Read 50%, Writer 50%

    ![](img/447fbed58dc921d81e92b3d3f8047037_27_1.png)


    ## 2.2 NUMA-Reader-Writer Locks


    NUMA-reader-writer lock [1] is designed based on cohort lock to limit migrations
    between waiting writers by releasing global lock. When a writer meets the threshold
    in the same node, a writer transfers global lock to other waiting writers in the
    same node. Furthermore, to get high performance, this lock maximizes the concurrency
    by balancing readers and writer operations. The readers actually not need to access
    the shared resource concurrently, so they do not execute the critical section
    protected by the locks. To implement this, it uses reader indicators in each node,
    adding when a reader acquires a lock and deallocating when it releases. Writers
    for acquiring a lock only check the reader indicator whether a reader is in the
    critical section.


    NUMA-reader-writer locks present three different preferences: writer-preference,
    reader-preference, and neutral preference. Writer-preference and reader-preference
    give a priority to critical section regardless of order. This may cause starvation
    operation to each preference. To overcome this, lock algorithm adopts the patience
    limit blocking preference operation continuously. For example, with a writer preference,
    a reader waits over patience limit, sets a barrier flag and the writers are blocked
    until a barrier finish to execute critical section.


